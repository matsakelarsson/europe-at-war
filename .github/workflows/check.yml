# Build the site and run the tests on every pull request, so a broken
# change (or a Dependabot update) shows up before it reaches main.
name: Check

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test

      # Rebuild the base map geometry from Natural Earth and fail if it differs
      # from the committed site-data/ and content/borders/atoms.json. This covers
      # the tools only build-geo uses (mapshaper, polygon-clipping).
      - uses: actions/cache@v6
        with:
          path: .cache/ne
          key: natural-earth-${{ hashFiles('tools/fetch-data.mjs') }}
      - run: node tools/fetch-data.mjs ne
      - run: npm run geo
      - name: Geometry matches the committed files
        run: git diff --exit-code --stat
