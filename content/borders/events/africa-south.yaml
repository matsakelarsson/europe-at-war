  note: "Said bin Sultan takes Fort Jesus and ends Mazrui rule in Mombasa."
  owners:
    oman: [KE-300~mombasa, KE-300~malindi]

- date: "1838"
  note: "Voortrekker and Griqua-Rolong attacks drive the Ndebele north (1837); Voortrekkers settle Potchefstroom (1838). The trekker communities north of the Vaal unite as the South African Republic, recognised by Britain in the Sand River Convention of 1852."
