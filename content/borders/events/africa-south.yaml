  owners:
    maryland-liberia: [LR-MY, LR-GK]

- date: "1835"
  note: "Mallam Dendo’s sons make Nupe an emirate of the caliphate, and new emirates rule the lands south of Zaria (Keffi, Nasarawa, Lafia); the lamidates of Adamawa reach Garoua, Ngaoundéré and Tibati."
  owners:
    sokoto-caliphate: [NG-NI, NG-NA, CM-NO, CM-AD]

- date: "1835"
  note: "After Zwangendaba’s Ngoni have ravaged the plateau (1833–1835), Nyamazana’s Ngoni take Danamombe and kill the Rozvi king Chirisamhuru (1835); the Rozvi Empire breaks up."
