  owners:
    liberia: [LR-MG, LR-GB, LR-BM, LR-RI]

- date: "1839-10-12"
  note: "After their victory over Dingane at Blood River (Ncome, December 1838) the Voortrekkers proclaim the Republic of Natalia south of the Tugela."
  owners:
    natalia: [ZA-NL!]

- date: "1840"
  note: "Ibadan defeats Ilorin at Osogbo (1840) and becomes the protector of the Osun towns."
  owners:
    ibadan: [NG-OS]

- date: "1840"
  note: "Portugal founds Moçâmedes (Namibe) on the southern coast."
  owners:
    angola: [AO-NAM]

- date: "1840"
  note: "Said bin Sultan moves his capital from Muscat to Zanzibar; his governors rule the mainland ports from Tanga to Bagamoyo, where the caravan routes to the Great Lakes begin."
  owners:
    oman: [TZ-25~coast, TZ-19~coast, TZ-02]

- date: "1840"
  note: "The Gaza Empire extends its rule north of the Save to the Zambezi (by about 1840) and takes tribute from the Portuguese posts of Sofala and Sena; from the 1860s its capital is Mossurize, in the highlands near the Save."
