    ndebele-kingdom: [ZA-NW!, ZA-GT]

- date: "1829"
  note: "Yoruba soldiers settle at Ibadan, a war camp that grows into the strongest Yoruba power."
  owners:
    ibadan: [NG-OY~ibadan]

- date: "1830"
  note: "Dar al-Kuti, a Muslim state founded under the overlordship of Wadai, rules the lands north of the Ubangi basin (about 1830); from 1890 its sultan Muhammad al-Sanusi raids far to the south for slaves, from 1894 from his new capital Ndélé."
  owners:
    dar-al-kuti: [CF-BB, CF-VK]

- date: "1830"
  note: "Kaboyo, a son of the Bunyoro king, makes Toro an independent kingdom (about 1830)."
  owners:
    toro: [UG-405, UG-415, UG-421, UG-413, UG-406, UG-401, UG-423]

- date: "1830"
  note: "By about 1830 the Merina kingdom rules the Betsileo highlands and the edge of the western plains; Menabe, the Bara and the peoples of the far south stay outside its rule."
  owners:
    merina: [MDG-5861, MDG-5873, MDG-5871]

- date: "1833"
  note: "Moshoeshoe’s Basotho kingdom spreads over the fertile lowlands on both sides of the Caledon (1830s), which it defends against the Boers in the wars of 1858 and 1865–1868."
