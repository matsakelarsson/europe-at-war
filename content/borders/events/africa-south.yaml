- date: "1000"
  note: "Kano, one of the Hausa city-states; the Kano Chronicle, written down much later, dates the founding of its ruling house by Bagauda to about 999."
  owners:
    kano: [NG-KN]

- date: "1030"
  note: "Takrur on the middle Senegal is known to Arab writers by the eleventh century; according to al-Bakri its king War Jabi (died 1040–1041) was the first ruler there to adopt Islam."
  owners:
    takrur: [SN-MT]

- date: "1075"
  note: "Mapungubwe, near the confluence of the Shashe and the Limpopo, becomes the first state of the southern African interior, rich on gold and ivory traded to the coast (about 1075–1220)."
  owners:
    mapungubwe: [ZA-LP, ZW-MS]

- date: "1100"
  note: "Kilwa Kisiwani becomes the leading city-state of the southern Swahili coast; the Kilwa Chronicle dates its Shirazi dynasty to the tenth century, archaeology to the twelfth."
  owners:
    kilwa: [TZ-12~coast, TZ-17~coast]

- date: "1150"
  note: "Mombasa, a Swahili city-state on its island, is described by al-Idrisi in the twelfth century."
  owners:
    mombasa: [KE-300~mombasa]

- date: "1200"
  note: "The kingdom of Benin of the Edo; its present dynasty dates by tradition from about 1200, and the obas Ewuare (about 1440–1473) and his successors make it the strongest state of the forest."
  owners:
    benin-kingdom: [NG-ED]

- date: "1220"
  note: "Mapungubwe is abandoned and power moves north to Great Zimbabwe, whose stone enclosures are built from the thirteenth century; it controls the gold trade with the coast until about 1450."
  owners:
    great-zimbabwe: [ZW-MV, ZW-MI]
    none: [ZA-LP, ZW-MS]

- date: "1235"
  note: "Sundiata Keita founds the Mali Empire (about 1235); its Mandinka heartland lies on the upper Niger around Niani, Siguiri and Kangaba (the site of the capital is debated)."
  owners:
    mali-empire: [GN-SI, GN-K, GN-MD, GN-KO]

- date: "1250"
  note: "The Mali Empire extends its rule west to the Gambia: by tradition Tiramakhan Traoré, a general of Sundiata, conquers the land that becomes Mali’s western province of Kaabu (thirteenth century; the dates are traditional)."
  owners:
    mali-empire: [GM-B, GM-W, GM-N, GM-L, GM-M, GM-U, SN-KD, SN-SE, GW-GA, GW-BA, SN-TC, SN-KE]

- date: "1286"
  note: "The Mali Empire conquers Takrur (about 1286) and rules it through military governors (farba)."
  owners:
    mali-empire: [SN-MT]

- date: "1300"
  note: "The Hausa kingdom of Zamfara (by tradition from the eleventh century; Birnin Zamfara by the fourteenth)."
  owners:
    zamfara: [NG-ZA]

- date: "1300"
  note: "Under the Mahdali sultans Kilwa controls the gold trade of Sofala; Ibn Battuta visits Kilwa in 1331."
  owners:
    kilwa: [MZ-S~coast]

- date: "1300"
  note: "The Swahili towns of the Lamu archipelago, led in later centuries by Pate, flourish on the trade of the northern coast (by the fourteenth century)."
  owners:
    pate: [KE-300~lamu]

- date: "1350"
  note: "The Jolof Empire, founded by tradition by Ndiadiane Ndiaye in the mid-fourteenth century, unites the Wolof and Serer kingdoms of Waalo, Cayor, Baol and Sine under the burba of Jolof."
  owners:
    jolof: [SN-LG, SN-SL, SN-TH, SN-DK, SN-DB, SN-FK]

- date: "1350"
  note: "The Hausa kingdom of Katsina, ruled from the fourteenth century by the dynasty of Muhammadu Korau."
  owners:
    katsina: [NG-KT]

- date: "1360"
  note: "As Mali’s power in the west fades in the fourteenth century, Fulbe dynasties (the Lam Termes and Lam Taaga) take power in Takrur."
  owners:
    takrur: [SN-MT]

- date: "1380"
  note: "Driven out of Kanem by the Bulala, the Sayfawa kings settle in Bornu, west of Lake Chad; Ali Gaji builds Birni Ngazargamu as their capital about 1470."
  owners:
    kanem-bornu: [NG-BO, NG-YO]

- date: "1390"
  note: "The Kingdom of Kongo is founded, by tradition by Lukeni lua Nimi, who conquers the land around Mbanza Kongo in the late fourteenth century; its provinces reach from the Congo River to the Dande and inland to the Kwango."
  owners:
    kongo: [AO-ZAI, AO-UIG, AO-BGO, AO-LUA, CD-BC]

- date: "1400"
  note: "The Hausa kingdom of Zazzau, with Zaria as its capital from the sixteenth century (the dates are traditional)."
  owners:
    zazzau: [NG-KD]

- date: "1400"
  note: "The Yoruba kingdom of Oyo north of the forest, with Oyo-Ile as its capital, and the Ijebu kingdom near the coast (by the fifteenth century; the dates are traditional)."
  owners:
    oyo: [NG-OY!, NG-KW]
    ijebu: [NG-OG~ijebu]

- date: "1400"
  note: "The Bamum kingdom of the western Grassfields, founded by tradition by Nchare Yen in the late fourteenth century; Foumban is its capital."
  owners:
    bamum: [CM-OU]

- date: "1400"
  note: "The Swahili city-state of Malindi (by the fifteenth century), whose envoys reach China in 1414–1415 and whose ruler welcomes Vasco da Gama in 1498 and becomes Portugal’s ally."
  owners:
    malindi: [KE-300~malindi]

- date: "1450"
  note: "The Mossi-related kingdoms of Dagbon and Mamprugu rule the savanna of the north, descended by tradition from Na Gbewaa; the dates are traditional."
  owners:
    dagbon: [GH-NP!]
    mamprugu: [GH-NP~mamprugu]

- date: "1450"
  note: "The Akan state of Bono, with Bono-Manso as its capital, controls the trade routes between the forest gold fields and the Niger (by the fifteenth century)."
  owners:
    bono: [GH-BA]

- date: "1450"
  note: "The Karagwe kingdom west of Lake Victoria, ruled by the Hinda dynasty (by tradition from the fifteenth century)."
  owners:
    karagwe: [TZ-05]

- date: "1450"
  note: "Great Zimbabwe is abandoned in the fifteenth century. Its heirs are the Mutapa kingdom in the north, founded by tradition by Nyatsimba Mutota, and the Torwa kingdom (Butua) in the south-west, with Khami as its capital."
  owners:
    mutapa: [ZW-MC, ZW-MW, ZW-HA, ZW-ME, MZ-T]
    torwa: [ZW-MN, ZW-MS, ZW-BU, ZW-MI, ZW-MV]

- date: "1456"
  note: "The burba of Jolof conquers Takrur (in the 1450s; by about 1456) and divides it among his governors (farba)."
  owners:
    jolof: [SN-MT]

- date: "1462"
  note: "Portuguese settlers found Ribeira Grande on Santiago, the first European town in the tropics, on the uninhabited Cape Verde islands sighted in 1456–1460."
  owners:
    cabo-verde: [CV-BR, CV-BV, CV-CA, CV-CF, CV-CR, CV-MA, CV-MO, CV-PA, CV-PN, CV-PR, CV-RB, CV-RG, CV-RS, CV-SD, CV-SF, CV-SL, CV-SM, CV-SO, CV-SS, CV-SV, CV-TA, CV-TS]

- date: "1493"
  note: "Portuguese settlers found the town of São Tomé on the uninhabited island, which becomes a sugar colony worked by enslaved Africans."
  owners:
    sao-tome-and-principe: [ST-S]

- date: "1494"
  note: "Mbegan Ndour founds the kingdom of Saloum (about 1494)."
  owners:
    saloum: [SN-KL, SN-KA]

- date: "1500"
  note: "The Aja kingdom of Allada controls the coast between the Mono and the Ouémé (by the sixteenth century)."
  owners:
    allada: [BJ-AQ!, BJ-LI, BJ-OU]

- date: "1500"
  note: "The Bariba (Baatombu) kingdoms of Borgu, led by Nikki, rule the north of today’s Benin and the lands around Bussa on the Niger (by the sixteenth century; the traditions differ)."
  owners:
    borgu: [BJ-BO, BJ-AL]

- date: "1500"
  note: "The Igala kingdom, with Idah as its capital, rules the lands east of the Niger–Benue confluence (by about 1500)."
  owners:
    igala: [NG-KO]

- date: "1500"
  note: "The sultanate of Mandara (Wandala) rules the hills and plains south of Lake Chad (by about 1500)."
  owners:
    mandara: [CM-EN]

- date: "1500"
  note: "The Tio (Teke) kingdom, the Anziku of Portuguese writers, rules the plateaus north of Malebo Pool and the lands on both sides of the pool (by about 1500)."
  owners:
    tio: [CG-12, CG-14, CG-BZV, CD-KN]

- date: "1500"
  note: "The Mbundu kingdom of Ndongo, ruled by the ngola, grows between the Kwanza and the Lukala as a tributary of Kongo (by about 1500)."
  owners:
    ndongo: [AO-CNO]

- date: "1500"
  note: "Portugal settles the island of Príncipe."
  owners:
    sao-tome-and-principe: [ST-P]

- date: "1500"
  note: "Bunyoro-Kitara, ruled by the Babiito dynasty from about 1500 (the dates are traditional), is the strongest kingdom of the lakes; its kings claim the heritage of the older Kitara of the Bachwezi."
  owners:
    bunyoro: [UG-403, UG-409, UG-407, UG-419, UG-420, UG-405, UG-415, UG-421, UG-413, UG-406, UG-401, UG-423, UG-107, UG-103, UG-123, UG-105, UG-110, UG-122, UG-118, UG-124, UG-116, UG-111, UG-101]

- date: "1500"
  note: "The kingdom of Buganda on the north-west shore of Lake Victoria, founded by tradition by Kintu; its kabakas are dated from the fourteenth or fifteenth century."
  owners:
    buganda: [UG-102, UG-113, UG-106, UG-108, UG-104, UG-114, UG-119, UG-117, UG-112, UG-115, UG-121, UG-109, UG-120]

- date: "1500"
  note: "The Nkore (Ankole) kingdom of the Hinda dynasty (by tradition from about 1500)."
  owners:
    ankole: [UG-410, UGA-3371, UG-416, UG-417, UG-402, UG-425, UG-325, UG-424, UG-422, UG-411]

- date: "1500"
  note: "Sultanates of Shirazi descent rule the Comoro islands, often at war with one another (by the sixteenth century); Malagasy raids devastate them around 1800."
  owners:
    comoro-sultanates: [KM-A, KM-G, KM-M]

- date: "1500"
  note: "The Maravi kingdoms of the Phiri clan grow south and west of Lake Malawi under the kalonga (by the sixteenth century; the dates are uncertain)."
  owners:
    maravi: [MW-BA, MW-BL, MW-CK, MW-CR, MW-DE, MW-DO, MW-LI, MW-MC, MW-MG, MW-MH, MW-MU, MW-MW, MW-NE, MW-NI, MW-NK, MW-NS, MW-NU, MW-PH, MW-SA, MW-TH, MW-ZO, ZM-03]

- date: "1505-07-24"
  note: "Francisco de Almeida takes Kilwa, installs a sultan friendly to Portugal and builds a fort; in August he sacks Mombasa. The Portuguese leave Kilwa in 1512."
  owners:
    portugal: [TZ-12~coast, TZ-17~coast]

- date: "1505-09"
  note: "Pero de Anaya builds a Portuguese fort at Sofala."
  owners:
    mozambique: [MZ-S~coast]

- date: "1507"
  note: "The Portuguese build a fort on Mozambique Island, which becomes the capital of Portuguese East Africa."
  owners:
    mozambique: [MZ-N~coast]

- date: "1512"
  note: "The Portuguese abandon their fort at Kilwa."
  owners:
    kilwa: [TZ-12~coast, TZ-17~coast]

- date: "1513"
  note: "Koli Tenguella, whose father Tenguella was killed fighting Songhai in 1512, leads his Fulbe from Futa Jallon across the upper Gambia and Senegal, takes Futa Toro from Jolof’s governors and founds the Denianke dynasty (1513 in some sources, about 1520 in others)."
  owners:
    futa-toro: [SN-MT]

- date: "1516"
  note: "Kanta Kotal, a commander in Songhai’s war against Aïr, breaks away and founds the kingdom of Kebbi (about 1516)."
  owners:
    kebbi: [NG-KE, NG-SO]

- date: "1520"
  note: "Sine, like its Serer neighbour Saloum, leaves the Jolof Empire at least twenty-nine years before the battle of Danki (by about 1520)."
  owners:
    sine: [SN-FK]

- date: "1530"
  note: "The Mbundu kingdom of Matamba on the upper Kwango (first mentioned in 1530)."
  owners:
    matamba: [AO-MAL!]

- date: "1531"
  note: "Tsoede (Edegi) founds the Nupe kingdom on the middle Niger (by tradition in 1531)."
  owners:
    nupe: [NG-NI]

- date: "1535"
  note: "The Nupe take and sack Oyo-Ile (about 1535); the alaafins flee to Borgu and later rule from Igboho (the dates are traditional)."
  owners:
    nupe: [NG-KW]

- date: "1537"
  note: "Kaabu, Mali’s western province, becomes an independent kingdom as Mali declines (the sources give 1537 or the mid-sixteenth century); the Mandinka kingdoms of the Gambia valley go their own ways."
  owners:
    kaabu: [SN-KD, SN-SE, GW-GA, GW-BA]
    none: [GM-B, GM-W, GM-N, GM-L, GM-M, GM-U, SN-TC, SN-KE]

- date: "1540"
  note: "The Merina kingdom of Imerina in the central highlands of Madagascar, founded by tradition by Andriamanelo (about 1540)."
  owners:
    merina: [MG-T]

- date: "1544"
  note: "Portuguese trading posts at Quelimane and Inhambane (by the 1540s)."
  owners:
    mozambique: [MZ-Q~coast, MZ-I~coast]

- date: "1549"
  note: "Amari Ngoone Sobel Fall of Cayor defeats the burba of Jolof at Danki (1549); Cayor becomes independent, and Waalo and Baol break away, leaving Jolof a small inland kingdom."
  owners:
    cayor: [SN-TH, SN-DK]
    baol: [SN-DB]
    waalo: [SN-SL]

- date: "1550"
  note: "Mande horsemen found the kingdom of Gonja in the mid-sixteenth century; under Ndewura Jakpa (seventeenth century) it reaches its greatest size."
  owners:
    gonja: [GH-NP~gonja]

- date: "1550"
  note: "The Kingdom of Loango on the coast north of the Congo, with the smaller kingdoms of Kakongo and Ngoyo (Cabinda), which are shown with it (by the sixteenth century)."
  owners:
    loango: [CG-5, CG-16, AO-CAB]

- date: "1576"
  note: "Paulo Dias de Novais founds São Paulo de Luanda, the start of the Portuguese colony of Angola; its wars with Ndongo begin in 1579."
  owners:
