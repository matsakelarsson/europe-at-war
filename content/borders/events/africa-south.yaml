# Africa south of the Sahara from 800: West Africa from Senegal to Nigeria and
# Cameroon, Central Africa, East Africa, Southern Africa, Madagascar and the
# Indian Ocean and Atlantic islands (curated range "Africa south of the Sahara"
# in curated.yaml). Splits in splits/99e-africa-south.geojson. Written for wave
# 13; edit directly.

- date: "0800"
  note: "Africa south of the Sahara about 800. Farming and iron-working peoples, among them the Bantu-speaking peoples who have spread over most of Central, East and Southern Africa, live in villages and chiefdoms; Khoikhoi herders and San hunter-gatherers live in the far south-west, and Austronesian settlers have reached Madagascar. Towns are growing on the middle Niger (shown with the Sahel), at Igbo-Ukwu east of the lower Niger and on the Swahili coast, where traders from the Persian Gulf call. No states are shown here yet: the kingdoms appear as the written sources, oral traditions and archaeology begin to describe them."
