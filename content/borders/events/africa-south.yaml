    gaza-empire: [MZ-B, MZ-S!]

- date: "1840"
  note: "Mzilikazi’s Ndebele, driven from the Transvaal in 1837, settle north of the Limpopo (1838–1840); their kingdom raids and takes tribute from the Shona."
