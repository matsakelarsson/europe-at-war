    rwanda: [RW-02, RW-03, RW-04]

- date: "1861-08-06"
  note: "Britain annexes Lagos, which it had bombarded in 1851."
  owners:
    lagos-colony: [NG-LA]

- date: "1862"
  note: "France extends its rule to Cape Lopez and the Orungu on the Ogooué delta."
