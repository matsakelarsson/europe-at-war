- date: "1842"
  note: "Mississippi in Africa (Greenville, Sinoe) joins the Commonwealth of Liberia."
  owners:
    liberia: [LR-SI]

- date: "1843"
  note: "France builds forts at Grand-Bassam and Assinie after treaties with the local rulers (1842–1843)."
  owners:
    french-ivory-coast: [CI-13]

- date: "1843-05-12"
  note: "Britain annexes Natal."
  owners:
    natal: [ZA-NL!]

- date: "1845"
  note: "Trekkers under Hendrik Potgieter settle Ohrigstad (1845) and Lydenburg (1849) in the east."
  owners:
    transvaal: [ZA-MP]

- date: "1847-12-17"
  note: "Sir Harry Smith extends the Cape Colony’s northern border to the Orange River."
