    cape-colony: [ZA-EC~ciskei]

- date: "1836-12"
  note: "On London’s orders Queen Adelaide Province is given up, and the Xhosa chiefs regain their land under treaties with the Cape."
  owners:
    xhosa: [ZA-EC~ciskei]

