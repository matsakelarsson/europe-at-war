# Anatolia, 800–today (curated ranges "Balkans, Hungary and Anatolia" and
# "Eastern Anatolia before 1801" in curated.yaml). Generated for wave 5
# (scratchpad gen-east.mjs); edit by hand from here on. Eastern Thrace and
# Constantinople are in balkans.yaml (the 1922 event here covers them too);
# Cilicia and Hatay in 1833–1840 and Hatay from 1920 are in levant.yaml;
# Kars, Ardahan, Artvin and Iğdır from 1801 are in caucasus.yaml.
#
# How the map is drawn:
# - Atoms are provinces, with a split for the Asian side of Istanbul. A province
#   changes hands with its main town, so lines are approximate.
# - Smaller emirates are grouped as `anatolian-beyliks` (Turkish beyliks).
# - The Ottoman Empire stays on the map until the sultanate is abolished
#   (1922-11-01). The Allied, Greek, Italian and French zones of 1918–1923 and
#   the fronts of the Greco-Turkish War are war-step areas.

