# The Balkans: a first pass until the Ottoman and Balkan wave curates them.
# The 1000 keyframe shows Tsar Samuel's Bulgaria; the 1100 keyframe was
# corrected to Byzantine rule (1018–1185).

- date: "971-07"
  note: After defeating Sviatoslav of Kiev at Dorostolon, John I Tzimiskes annexes eastern Bulgaria with Preslav. The western Bulgarian lands stay independent under the Cometopuli brothers, later Tsar Samuel.
