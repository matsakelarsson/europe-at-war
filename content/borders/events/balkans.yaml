# ---- 1878–1885 (Serbia autonomous from 1817–1830 and Montenegro de facto
# independent are shown as their own states in the 1815 keyframe)
- date: "1878-07-13"
  note: Congress of Berlin. Romania, Serbia and Montenegro become independent and gain land; Romania takes northern Dobruja in exchange for southern Bessarabia. A smaller Bulgaria than the one agreed at San Stefano becomes an autonomous principality; Eastern Rumelia stays an Ottoman province with its own governor, and Macedonia goes back to the Ottomans. Austria-Hungary occupies Bosnia and Herzegovina.
  owners:
    bulgaria: [BG-03, BG-04, BG-05, BG-06, BG-07, BG-08, BG-10, BG-11, BG-12, BG-14, BG-15, BG-17, BG-18, BG-19, BG-22, BG-23, BG-25, BG-27]
    serbia: [RS-20, RS-21, RS-22, RS-23, RS-24]
    montenegro: [ME-02, ME-09, ME-12, ME-16, ME-15, ME-11]
    romania: [RO-CT, RO-TL]
- date: "1880-11-26"
  note: Under pressure from the Great Powers, the Ottomans hand Ulcinj to Montenegro in place of Plav and Gusinje.
  owners:
    montenegro: [ME-20]
- date: "1885-09-18"
  note: A bloodless coup in Plovdiv unites Eastern Rumelia with Bulgaria; the union survives the Serbo-Bulgarian War that follows.
  owners:
