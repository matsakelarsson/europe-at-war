# ---- Wallachia and Moldavia (autonomous principalities under Ottoman
# suzerainty, shown as their own states; Ottoman rayas such as Brăila,
# Bender, Khotyn and the Budjak are Ottoman)
- date: "1718-07-21"
  note: Treaty of Passarowitz. The Ottomans cede Oltenia, western Wallachia, to the Habsburgs.
  owners:
    habsburg: [RO-DJ, RO-GJ, RO-MH, RO-VL, RO-OT]
- date: "1739-09-18"
  note: Treaty of Belgrade. The Habsburgs return Oltenia to Wallachia.
