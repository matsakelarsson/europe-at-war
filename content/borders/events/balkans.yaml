# The Balkans, the Carpathian basin, Greece, Cyprus, eastern Thrace and Moldavia,
# 800–today (curated ranges "Balkans, Hungary and Anatolia" and "Moldavia before
# 1812" in curated.yaml). Generated for wave 5 (scratchpad gen-east.mjs); edit by
# hand from here on. Anatolia and the 1922 change to Turkey are in anatolia.yaml,
# the Levant and Egypt in levant.yaml, Bessarabia after 1812 in bessarabia.yaml.
# Venetian Istria and Dalmatia in 1797–1805 are in italy.yaml.
#
# How the map is drawn:
# - Atoms are counties, provinces or municipalities, with splits for Euboea,
#   Achaea and Elis, western Thrace, the Dodecanese, the Gallipoli peninsula,
#   the Sandžak, Royal and Ottoman Hungary and the Hungarian strip of 1938.
#   A region changes hands with its main town, so lines are approximate.
# - The base map shows borders recognised by treaty or in practice; wartime
#   occupations and fronts are war-step areas. Ottoman vassals (Wallachia,
#   Moldavia, Transylvania, Ragusa, Serbia from 1817, Bulgaria 1878–1908,
#   Eastern Rumelia, the Cretan State) are shown as their own states.
# - Croatia is shown as its own kingdom in union with Hungary, 1102–1527.
# - The conquests of the Great Turkish War (1683–1699) change the map at
#   Karlowitz; the Balkan Wars at the treaties of 1913.
# - The Second World War (1939–1945): the Vienna Awards and the Treaty of
#   Craiova are here; the partition of Yugoslavia (1941–1945) and the Bulgarian
#   annexation in Greece are in ww2.yaml; occupations are areas in the war files.

