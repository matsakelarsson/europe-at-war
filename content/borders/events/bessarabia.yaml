# Bessarabia, Transnistria and Northern Bukovina. The atoms are curated from
# 1812 ("Bessarabia and Transnistria" in curated.yaml), so every change is here.
# Left bank of the Dniester: MD-CAM, MD-RE, MD-SN, MDA-1638, MD-GRI, MD-BD (Transnistria; Podolia in the north, Yedisan in the south).
# The Second World War occupation of the region east of the Dniester is in ww2-east.yaml.

- date: "1484-08"
  note: Bayezid II takes Kilia and Akkerman (Cetatea Albă), Moldavia's ports at the mouths of the Danube and the Dniester. Suleiman I annexes the Budjak steppe between them in 1538.
  owners:
    ottoman: [UA-51~ro1938]
- date: "1792-01-09"
  note: Treaty of Jassy. The Ottomans cede the land between the Southern Bug and the Dniester, with the southern half of today's Transnistria.
  owners:
    russia: [MD-SN, MDA-1638, MD-GRI, MD-BD]
- date: "1793-01-23"
  note: Second Partition of Poland. Podolia, with the northern half of today's Transnistria, goes to Russia.
  owners:
    russia: [MD-CAM, MD-RE]
- date: "1812-05-28"
  note: Treaty of Bucharest. The Ottomans cede the eastern half of Moldavia, between the Prut and the Dniester, which Russia names Bessarabia.
  owners:
    russia: [MD-BR, MD-ED, MD-OC, MD-GL, MD-RI, MD-DO, MD-FA, MD-UN, MD-DR, MD-BA, MD-SI, MD-NI, MD-SO, MD-CA, MD-FL, MD-CT, MD-CL, MD-HI, MD-LE, MD-TE, MD-ST, MD-TA, MD-GA, MD-SD, MD-IA, MD-CM, MD-OR, MD-BS, MD-CU, MDA-1644, MD-CR, MD-CS, MD-AN, MD-SV, UA-51~ro1938, UA-77~bess]
- date: "1856-03-30"
  note: Treaty of Paris. After the Crimean War Russia cedes southern Bessarabia (Cahul, Bolgrad, Izmail) to Moldavia, keeping it away from the mouths of the Danube.
  owners:
    moldavia: [MD-CA, MD-TA, UA-51~ro1938~1856]
- date: "1859-01-24"
  note: Alexandru Ioan Cuza is elected prince of both Moldavia and Wallachia, the start of Romania.
  owners:
    romania: [MD-CA, MD-TA, UA-51~ro1938~1856]
- date: "1867-02-08"
  note: The Austro-Hungarian Compromise. Bukovina stays in the Austrian half of the monarchy.
  owners:
    austria-hungary: [UA-77!]
- date: "1878-07-13"
  note: Congress of Berlin. Romania, now independent, returns southern Bessarabia to Russia and receives Northern Dobruja instead.
  owners:
    russia: [MD-CA, MD-TA, UA-51~ro1938~1856]
- date: "1917-11-07"
  note: October Revolution. The left bank of the Dniester is claimed by Soviet Russia.
  owners:
    ussr: [MD-CAM, MD-RE, MD-SN, MDA-1638, MD-GRI, MD-BD]
- date: "1918-01-22"
  note: The Ukrainian People's Republic declares independence, claiming the left bank of the Dniester.
  owners:
    ukraine: [MD-CAM, MD-RE, MD-SN, MDA-1638, MD-GRI, MD-BD]
- date: "1918-04-09"
  note: The Bessarabian assembly (Sfatul Țării), with Romanian troops in the country, votes for union with Romania.
  owners:
    romania: [MD-BR, MD-ED, MD-OC, MD-GL, MD-RI, MD-DO, MD-FA, MD-UN, MD-DR, MD-BA, MD-SI, MD-NI, MD-SO, MD-CA, MD-FL, MD-CT, MD-CL, MD-HI, MD-LE, MD-TE, MD-ST, MD-TA, MD-GA, MD-SD, MD-IA, MD-CM, MD-OR, MD-BS, MD-CU, MDA-1644, MD-CR, MD-CS, MD-AN, MD-SV, UA-51~ro1938, UA-77~bess]
- date: "1918-11-28"
  note: A congress in Czernowitz votes for the union of Bukovina with Romania.
  owners:
    romania: [UA-77!]
- date: "1921-03-18"
  note: Peace of Riga. The left bank of the Dniester stays in Soviet Ukraine (the Moldavian ASSR from 1924).
  owners:
    ussr: [MD-CAM, MD-RE, MD-SN, MDA-1638, MD-GRI, MD-BD]
- date: "1940-06-28"
  note: Under a Soviet ultimatum Romania cedes Bessarabia and Northern Bukovina, with the Hertsa region, to the Soviet Union.
  owners:
    ussr: [MD-BR, MD-ED, MD-OC, MD-GL, MD-RI, MD-DO, MD-FA, MD-UN, MD-DR, MD-BA, MD-SI, MD-NI, MD-SO, MD-CA, MD-FL, MD-CT, MD-CL, MD-HI, MD-LE, MD-TE, MD-ST, MD-TA, MD-GA, MD-SD, MD-IA, MD-CM, MD-OR, MD-BS, MD-CU, MDA-1644, MD-CR, MD-CS, MD-AN, MD-SV, UA-51~ro1938, UA-77]
- date: "1941-07-26"
  note: Romania, at war with the Soviet Union beside Germany, retakes Bessarabia and Northern Bukovina.
  owners:
    romania: [MD-BR, MD-ED, MD-OC, MD-GL, MD-RI, MD-DO, MD-FA, MD-UN, MD-DR, MD-BA, MD-SI, MD-NI, MD-SO, MD-CA, MD-FL, MD-CT, MD-CL, MD-HI, MD-LE, MD-TE, MD-ST, MD-TA, MD-GA, MD-SD, MD-IA, MD-CM, MD-OR, MD-BS, MD-CU, MDA-1644, MD-CR, MD-CS, MD-AN, MD-SV, UA-51~ro1938, UA-77]
- date: "1944-03-29"
  note: The Red Army retakes Chernivtsi and Northern Bukovina.
  owners:
    ussr: [UA-77]
- date: "1944-08-24"
  note: The Jassy–Kishinev offensive. The Red Army retakes Bessarabia, and Romania changes sides the next day.
  owners:
    ussr: [MD-BR, MD-ED, MD-OC, MD-GL, MD-RI, MD-DO, MD-FA, MD-UN, MD-DR, MD-BA, MD-SI, MD-NI, MD-SO, MD-CA, MD-FL, MD-CT, MD-CL, MD-HI, MD-LE, MD-TE, MD-ST, MD-TA, MD-GA, MD-SD, MD-IA, MD-CM, MD-OR, MD-BS, MD-CU, MDA-1644, MD-CR, MD-CS, MD-AN, MD-SV, UA-51~ro1938]
- date: "1991-08-27"
  note: Moldova declares independence. Transnistria, which had declared itself a separate republic in 1990, is not under its control.
  owners:
    moldavia: [MD-BR, MD-ED, MD-OC, MD-GL, MD-RI, MD-DO, MD-FA, MD-UN, MD-DR, MD-BA, MD-SI, MD-NI, MD-SO, MD-CA, MD-FL, MD-CT, MD-CL, MD-HI, MD-LE, MD-TE, MD-ST, MD-TA, MD-GA, MD-SD, MD-IA, MD-CM, MD-OR, MD-BS, MD-CU, MDA-1644, MD-CR, MD-CS, MD-AN, MD-SV, MD-CAM, MD-RE, MD-SN, MDA-1638, MD-GRI, MD-BD]
