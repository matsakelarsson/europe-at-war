# The British Isles: the Danelaw, Norway's western isles, and the Union of 1707.
# GB-ELS (Outer Hebrides), GB-ORK, GB-ZET and the Isle of Man are curated
# (curated.yaml) because the drafts leave them unowned.

# ---- The Danelaw
- date: "825-12-31"
  note: After Mercia's defeat at Ellendun, East Anglia throws off Mercian rule.
  owners:
    east-anglia: [GB-NFK, GB-SFK, GB-CAM, GB-PTE]
- date: "825"
  note: Battle of Ellendun. Egbert of Wessex defeats Mercia and takes Kent, Sussex, Surrey and Essex.
  owners:
    england: [GB-KEN, GB-ESX, GB-BDG, GB-BEN, GB-BNE, GB-CMD, GB-EAL, GB-ENF, GB-ESS, GB-GRE, GB-HAV, GB-HCK, GB-HIL, GB-HMF, GB-HNS, GB-HRT, GB-HRW, GB-HRY, GB-ISL, GB-LUT, GB-NWM, GB-RDB, GB-SLG, GB-SWK, GB-THR, GB-TWH, GB-WFT, GB-WNM, GB-WSM]
- date: "838"
  note: Battle of Hingston Down. Egbert defeats the Cornish and their Viking allies; Cornwall comes under West Saxon rule.
  owners:
    england: [GB-CON]
- date: "869-11-20"
  note: The Great Heathen Army defeats and kills King Edmund; East Anglia comes under Danish rule.
  owners:
    danelaw: [GB-NFK, GB-SFK, GB-CAM, GB-PTE]
- date: "876"
  note: Halfdan shares out the land of southern Northumbria (Deira) among his men; York becomes a Viking kingdom.
  owners:
    danelaw: [GB-YOR, GB-NYK, GB-ERY, GB-KHL, GB-LDS, GB-BRD, GB-WKF, GB-KIR, GB-CLD, GB-SHF, GB-ROT, GB-BNS, GB-DNC, GB-MDB, GB-RCC, GB-STT]
- date: "877"
  note: The Danes partition Mercia and settle its eastern half, later the Five Boroughs.
  owners:
    danelaw: [GB-LIN, GB-NEL, GB-NLN, GB-NTT, GB-NGM, GB-DBY, GB-DER, GB-LEC, GB-LCE, GB-RUT]
- date: "880"
  note: After Edington and the Peace of Wedmore, Guthrum's army settles East Anglia; Essex and the south-east Midlands fall within the Danelaw, as the Treaty of Alfred and Guthrum later sets out.
  owners:
    danelaw: [GB-NTH, GB-BDF, GB-ESS, GB-SOS, GB-THR, GB-HAV, GB-BDG, GB-RDB, GB-NWM, GB-WFT]
- date: "917"
  note: Edward the Elder conquers the southern Danelaw, including Essex and East Anglia.
  owners:
    england: [GB-NFK, GB-SFK, GB-CAM, GB-PTE, GB-NTH, GB-BDF, GB-ESS, GB-SOS, GB-THR, GB-HAV, GB-BDG, GB-RDB, GB-NWM, GB-WFT]
- date: "918"
  note: The Five Boroughs of the east Midlands submit to Edward and Æthelflæd.
  owners:
    england: [GB-LIN, GB-NEL, GB-NLN, GB-NTT, GB-NGM, GB-DBY, GB-DER, GB-LEC, GB-LCE, GB-RUT]
- date: "954"
  note: Eric Bloodaxe is driven out of York, and the last Viking kingdom in England ends.
  owners:
    england: [GB-YOR, GB-NYK, GB-ERY, GB-KHL, GB-LDS, GB-BRD, GB-WKF, GB-KIR, GB-CLD, GB-SHF, GB-ROT, GB-BNS, GB-DNC, GB-MDB, GB-RCC, GB-STT]

# ---- Norway's western isles
- date: "875"
  note: Orkney and Shetland become a Norse earldom under the Norwegian crown (traditionally dated to Harald Fairhair).
  owners:
    norway: [GB-ORK, GB-ZET]
- date: "1098"
  note: Magnus Barefoot's expedition. Scotland recognises Norwegian rule over the Hebrides and Man (the Kingdom of the Isles).
  owners:
    norway: [GB-ELS, IMN+00?]
- date: "1266-07-02"
  note: Treaty of Perth. After the Battle of Largs, Norway cedes the Hebrides and Man to Scotland and keeps Orkney and Shetland.
  owners:
    scotland: [GB-ELS, IMN+00?]
- date: "1333"
  note: Edward III grants Man to William Montagu; the island stays under the English crown.
  owners:
    england: [IMN+00?]
- date: "1397"
  note: Kalmar Union. Orkney and Shetland follow Norway into union with Denmark.
  owners:
    denmark-norway: [GB-ORK, GB-ZET]
- date: "1468-09-08"
  note: Christian I pledges Orkney to James III of Scotland as security for his daughter's dowry; the pledge is never redeemed.
  owners:
    scotland: [GB-ORK]
- date: "1469"
  note: Christian I pledges Shetland to Scotland as well. Both are annexed to the Scottish crown in 1472.
  owners:
    scotland: [GB-ZET]

