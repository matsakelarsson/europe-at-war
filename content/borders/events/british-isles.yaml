# The British Isles, 800–today (curated range "British Isles" in curated.yaml; the
# Outer Hebrides, Orkney, Shetland and Man have their own range).
# Generated from a group list for wave 3; edit by hand from here on.
#
# How the map is drawn:
# - England: the Anglo-Saxon kingdoms (Wessex, Mercia, Northumbria, Essex, East Anglia,
#   Cornwall) and the Danelaw until the kingdom of England (927/954). Client kings
#   under Mercian overlordship (Kent, Sussex, Surrey) are shown as Mercia.
# - Wales until 1283, with the Marcher lordships under the English crown from 1070/1093.
# - Scotland: Pictland, Dál Riata and Strathclyde becoming Alba; Lothian and Strathclyde
#   from 1018; Cumbria and Northumberland Scottish 1136/1139–1157.
# - Ireland: the Irish kingdoms/lordships; Viking Dublin 853–902 and 917–1170; the
#   Lordship of Ireland growing from 1171 and shrinking after 1318–1400 (Gaelicised
#   Anglo-Norman lordships such as Desmond count as Irish lordships), then the Tudor
#   conquest. Kingdom of Ireland from 1542 (a name change only).
# - The Commonwealth union 1653/54–1660, Great Britain 1707, the United Kingdom 1801,
#   the Irish Free State 1922.
# - English occupations (Scotland 1296–1306, the 1330s) and rebellions are war areas.

