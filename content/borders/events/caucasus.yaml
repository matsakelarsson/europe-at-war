# The Caucasus from 1801: the Russian conquest, the republics of 1918–1921,
# the Soviet republics and independence in 1991. Curated from 1801 ("Caucasus"
# in curated.yaml); the 1800 keyframe gives the starting state (Kartli-Kakheti,
# Imereti, the khanates under Persian suzerainty, Ottoman Akhaltsikhe and Kars).
# The base map follows recognised borders: Abkhazia, South Ossetia and Karabakh
# after 1991 are shown as areas in the war steps.

- date: "1801-09-12"
  note: Alexander I annexes the kingdom of Kartli-Kakheti (eastern Georgia).
  owners:
    russia: [GE-TB, GE-KK, GE-MM, GE-SK, GE-KA, AM-LO, AM-TV, AZ-QAZ, AZ-AGA, AZ-TOV]
- date: "1803"
  note: Mingrelia accepts Russian rule, and a Russian expedition subdues the Jar-Belokani communities.
  owners:
    russia: [GE-SZ, AZ-ZAQ, AZ-BAL, AZ-QAX]
- date: "1804-01-15"
  note: Russian troops storm Ganja; the khanate is annexed.
  owners:
    russia: [AZ-GA, AZ-GYG, AZ-SKR, AZ-SMX, AZ-GOR, AZ-DAS, AZ-GAD]
- date: "1805-05-14"
  note: The khans of Karabakh, with Zangezur, and Sheki (and in December Shirvan) accept Russian suzerainty, and Russia annexes the Shuragel sultanate around Gyumri.
  owners:
    russia: [AM-SU, AM-SH, AZ-LAN, AZ-SUS, AZ-XA, AZ-XCI, AZ-AGM, AZ-XVD, AZ-FUZ, AZ-CAB, AZ-QBI, AZ-ZAN, AZ-KAL, AZ-TAR, AZ-BAR, AZ-AGC, AZ-BEY, AZ-SA, AZE-5564, AZ-OGU, AZ-QAB, AZ-SMI, AZ-ISM, AZ-AGU, AZ-QOB, AZ-GOY, AZ-KUR, AZ-UCA, AZ-ZAR, AZ-HAC, AZ-YEV, AZE-5566, AZ-MI, AZ-AGS]
- date: "1806"
  note: Russian forces take Baku, Derbent and Quba.
  owners:
    russia: [AZ-QBA, AZ-QUS, AZ-XAC, AZ-SBN, AZ-SIY, AZ-XIZ, AZ-ABS, AZ-BA, AZ-SM]
- date: "1810"
  note: Russia deposes King Solomon II and annexes Imereti. Abkhazia and Guria become Russian protectorates (both are annexed outright later, Guria in 1829).
  owners:
    russia: [GE-IM, GE-RL, GE-AB, GE-GU]
- date: "1813-10-24"
  note: Treaty of Gulistan. Persia recognises Russian rule over Georgia, Dagestan and the khanates north of the Aras, including Talysh.
  owners:
    russia: [AZ-AST, AZ-BIL, AZ-CAL, AZ-IMI, AZ-LA, AZ-LER, AZ-MAS, AZ-NEF, AZ-SAB, AZ-SAL, AZ-SAT, AZ-SR, AZ-YAR, AZE-5562, RU-DA]
- date: "1828-02-21"
  note: Treaty of Turkmenchay. Persia cedes the khanates of Erivan and Nakhchivan.
  owners:
    russia: [AM-ER, AM-AR, AM-AV, AM-AG, AM-KT, AM-VD, AM-GR, TR-76, AZ-NX, AZ-BAB, AZ-CUL, AZ-ORD, AZ-SAD, AZ-SAH, AZ-SAR, AZ-KAN]
- date: "1828-10-20"
  note: After the Battle of Khasauka, Karachay is annexed.
  owners:
    russia: [RU-KC]
- date: "1829-09-14"
  note: Treaty of Adrianople. The Ottomans cede Akhaltsikhe and Akhalkalaki and recognise Russian rule over Georgia and the eastern Black Sea coast.
  owners:
    russia: [GE-SJ]
- date: "1859-09-06"
  note: Imam Shamil surrenders at Gunib; Chechnya and mountain Dagestan come under Russian rule.
  owners:
    russia: [RU-CE, RU-IN]
- date: "1864-05-21"
  note: The last Circassian resistance ends at Kbaade (Krasnaya Polyana). Most Circassians are killed or driven out to the Ottoman Empire.
  owners:
    russia: [RU-AD]
- date: "1878-07-13"
  note: Congress of Berlin. The Ottomans cede Kars, Ardahan and Batumi to Russia.
  owners:
    russia: [TR-36, TR-75, TR-08, GE-AJ]
- date: "1917-11-07"
  note: October Revolution. The northern Caucasus is fought over in the Russian Civil War (not shown); Transcaucasia stays outside Soviet rule.
  owners:
    ussr: [RU-DA, RU-CE, RU-IN, RU-SE, RU-KB, RU-KC, RU-AD]
- date: "1918-03-03"
  note: Treaty of Brest-Litovsk. Soviet Russia cedes Kars, Ardahan and Batumi to the Ottoman Empire, whose troops take them in April.
  owners:
    ottoman: [TR-36, TR-75, TR-08, GE-AJ]
- date: "1918-05-26"
  note: The Transcaucasian Federation breaks up. Georgia declares independence.
  owners:
    georgia: [GE-TB, GE-KK, GE-MM, GE-SK, GE-KA, GE-IM, GE-RL, GE-SZ, GE-GU, GE-AB, GE-SJ, AM-LO]
- date: "1918-05-28"
  note: Armenia and Azerbaijan declare independence. Karabakh, Zangezur and Nakhchivan are disputed between them.
  owners:
    armenia: [AM-ER, AM-AR, AM-AV, AM-AG, AM-KT, AM-VD, AM-GR, AM-SH, AM-SU, AM-TV, TR-76]
    azerbaijan: [AZ-ABS, AZ-AGA, AZ-AGC, AZ-AGM, AZ-AGS, AZ-AGU, AZ-AST, AZ-BA, AZ-BAB, AZ-BAL, AZ-BAR, AZ-BEY, AZ-BIL, AZ-CAB, AZ-CAL, AZ-CUL, AZ-DAS, AZ-FUZ, AZ-GA, AZ-GAD, AZ-GOR, AZ-GOY, AZ-GYG, AZ-HAC, AZ-IMI, AZ-ISM, AZ-KAL, AZ-KAN, AZ-KUR, AZ-LA, AZ-LAN, AZ-LER, AZ-MAS, AZ-MI, AZ-NEF, AZ-NX, AZ-OGU, AZ-ORD, AZ-QAB, AZ-QAX, AZ-QAZ, AZ-QBA, AZ-QBI, AZ-QOB, AZ-QUS, AZ-SA, AZ-SAB, AZ-SAD, AZ-SAH, AZ-SAL, AZ-SAR, AZ-SAT, AZ-SBN, AZ-SIY, AZ-SKR, AZ-SM, AZ-SMI, AZ-SMX, AZ-SR, AZ-SUS, AZ-TAR, AZ-TOV, AZ-UCA, AZ-XA, AZ-XAC, AZ-XCI, AZ-XIZ, AZ-XVD, AZ-YAR, AZ-YEV, AZ-ZAN, AZ-ZAQ, AZ-ZAR, AZE-5562, AZE-5564, AZE-5566]
- date: "1918-12"
  note: Under the Armistice of Mudros the Ottoman army leaves Transcaucasia. British troops hold Batumi until July 1920, when it passes to Georgia; it is shown as Georgian from here.
  owners:
    georgia: [GE-AJ]
- date: "1919-04-19"
  note: After the Ottoman withdrawal, Armenia takes over Kars and Georgia takes Ardahan and Artvin, with British backing.
  owners:
    armenia: [TR-36]
    georgia: [TR-75, TR-08]
- date: "1920-04-28"
  note: The Red Army enters Baku, and Azerbaijan becomes a Soviet republic.
  owners:
    ussr: [AZ-ABS, AZ-AGA, AZ-AGC, AZ-AGM, AZ-AGS, AZ-AGU, AZ-AST, AZ-BA, AZ-BAB, AZ-BAL, AZ-BAR, AZ-BEY, AZ-BIL, AZ-CAB, AZ-CAL, AZ-CUL, AZ-DAS, AZ-FUZ, AZ-GA, AZ-GAD, AZ-GOR, AZ-GOY, AZ-GYG, AZ-HAC, AZ-IMI, AZ-ISM, AZ-KAL, AZ-KAN, AZ-KUR, AZ-LA, AZ-LAN, AZ-LER, AZ-MAS, AZ-MI, AZ-NEF, AZ-NX, AZ-OGU, AZ-ORD, AZ-QAB, AZ-QAX, AZ-QAZ, AZ-QBA, AZ-QBI, AZ-QOB, AZ-QUS, AZ-SA, AZ-SAB, AZ-SAD, AZ-SAH, AZ-SAL, AZ-SAR, AZ-SAT, AZ-SBN, AZ-SIY, AZ-SKR, AZ-SM, AZ-SMI, AZ-SMX, AZ-SR, AZ-SUS, AZ-TAR, AZ-TOV, AZ-UCA, AZ-XA, AZ-XAC, AZ-XCI, AZ-XIZ, AZ-XVD, AZ-YAR, AZ-YEV, AZ-ZAN, AZ-ZAQ, AZ-ZAR, AZE-5562, AZE-5564, AZE-5566]
- date: "1920-10-30"
  note: Turkish nationalist forces take Kars in the Turkish–Armenian War.
  owners:
    turkey: [TR-36, TR-76]
- date: "1920-12-02"
  note: Armenia becomes a Soviet republic, and the Treaty of Alexandropol leaves Kars to Turkey.
  owners:
    ussr: [AM-ER, AM-AR, AM-AV, AM-AG, AM-KT, AM-VD, AM-GR, AM-SH, AM-SU, AM-TV]
- date: "1921-03-16"
  note: Treaty of Moscow between Soviet Russia and the Turkish nationalists. Turkey keeps Kars, Ardahan and Artvin; Batumi stays with Georgia (confirmed at Kars in October).
  owners:
    turkey: [TR-75, TR-08]
- date: "1921-03-18"
  note: The Red Army takes Tbilisi (25 February) and Batumi; Georgia becomes a Soviet republic.
  owners:
    ussr: [GE-TB, GE-KK, GE-MM, GE-SK, GE-KA, GE-IM, GE-RL, GE-SZ, GE-GU, GE-AB, GE-SJ, GE-AJ, AM-LO]
- date: "1991-04-09"
  note: Georgia declares the restoration of its independence.
  owners:
    georgia: [GE-TB, GE-KK, GE-MM, GE-SK, GE-KA, GE-IM, GE-RL, GE-SZ, GE-GU, GE-AB, GE-SJ, GE-AJ]
- date: "1991-09-21"
  note: Armenia declares independence after a referendum.
  owners:
    armenia: [AM-ER, AM-AR, AM-AV, AM-AG, AM-KT, AM-VD, AM-GR, AM-SH, AM-SU, AM-TV, AM-LO]
- date: "1991-10-18"
  note: Azerbaijan declares the restoration of its independence.
  owners:
    azerbaijan: [AZ-ABS, AZ-AGA, AZ-AGC, AZ-AGM, AZ-AGS, AZ-AGU, AZ-AST, AZ-BA, AZ-BAB, AZ-BAL, AZ-BAR, AZ-BEY, AZ-BIL, AZ-CAB, AZ-CAL, AZ-CUL, AZ-DAS, AZ-FUZ, AZ-GA, AZ-GAD, AZ-GOR, AZ-GOY, AZ-GYG, AZ-HAC, AZ-IMI, AZ-ISM, AZ-KAL, AZ-KAN, AZ-KUR, AZ-LA, AZ-LAN, AZ-LER, AZ-MAS, AZ-MI, AZ-NEF, AZ-NX, AZ-OGU, AZ-ORD, AZ-QAB, AZ-QAX, AZ-QAZ, AZ-QBA, AZ-QBI, AZ-QOB, AZ-QUS, AZ-SA, AZ-SAB, AZ-SAD, AZ-SAH, AZ-SAL, AZ-SAR, AZ-SAT, AZ-SBN, AZ-SIY, AZ-SKR, AZ-SM, AZ-SMI, AZ-SMX, AZ-SR, AZ-SUS, AZ-TAR, AZ-TOV, AZ-UCA, AZ-XA, AZ-XAC, AZ-XCI, AZ-XIZ, AZ-XVD, AZ-YAR, AZ-YEV, AZ-ZAN, AZ-ZAQ, AZ-ZAR, AZE-5562, AZE-5564, AZE-5566]
