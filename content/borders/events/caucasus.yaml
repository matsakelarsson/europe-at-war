# The Caucasus, 800–today: Georgia, Armenia, Azerbaijan, the northern Caucasus
# (Dagestan, Chechnya, Ingushetia, Ossetia, Kabarda, Karachay-Cherkessia,
# Adygea) and Iranian Azerbaijan (East and West Azerbaijan, Ardabil).
# Curated from 800 ("Caucasus before 1801" and "Caucasus" in curated.yaml), so
# every change must be an event. Kars, Ardahan, Artvin and Iğdır before 1801 are
# in anatolia.yaml; Krasnodar and Stavropol are in rus-and-russia.yaml.
# Vassal kingdoms (Georgia and Shirvan under the Seljuks and Mongols, the
# Georgian kingdoms under Persia or the Ottomans) stay on the map as their own
# states; the khanates are shown from Nader Shah's death (1747).
# The base map follows recognised borders: Abkhazia, South Ossetia and Karabakh
# after 1991 are shown as areas in the war steps.

- date: "800"
  note: About 800. The Abbasid Caliphate rules Armenia, Arran, Shirvan and Azerbaijan through its governors (the province of Arminiya), with Tbilisi and Derbent as frontier fortresses. In the west, Leon II has made the Kingdom of Abkhazia independent of Byzantium; the Georgian princes of Iberia, Kakheti and Hereti and the Alans of the northern Caucasus are autonomous, and the Khazars hold the plains north of the mountains.
