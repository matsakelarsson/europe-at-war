# Central Europe in the 19th century: a first pass until the German lands and
# Habsburg wave curates it. historical-basemaps has no snapshot between 1815
# and 1880, so these events carry the big changes in between.

- date: "1867-02-08"
  note: The Austro-Hungarian Compromise. The Austrian Empire becomes the Dual Monarchy of Austria-Hungary, with a Hungarian government in Budapest under the same monarch.
  owners:
    austria-hungary: [IT-GO, IT-TS, CZ-US, CZ-LI, CZ-KA, CZ-PL, CZ-JC, CZ-KR, CZ-OL, CZ-PA, CZ-MO, AT-3, CZ-JM, AT-4, AT-1, IT-BZ, AT-8, AT-7, AT-5, AT-2, AT-6, CZ-ZL, UA-77, AT-9, CZ-VY, CZ-ST, CZ-PR, IT-TN]
- date: "1871-05-10"
  note: Treaty of Frankfurt. France cedes Alsace and part of Lorraine to the German Empire.
  owners:
    germany: [FR-57, FR-67, FR-68]
- date: "1918-11-22"
  note: French troops enter Strasbourg after the armistice; the Treaty of Versailles returns Alsace-Lorraine to France in 1919.
  owners:
    france: [FR-57, FR-67, FR-68]
