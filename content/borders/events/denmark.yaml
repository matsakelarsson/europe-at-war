# Denmark, Norway and their Atlantic islands, Schleswig-Holstein, and early
# Danish holdings around the Baltic.
#
# Sweden at War's events (sweden-at-war.yaml) cover the Nordic atoms from 1240
# to 1815. After that, and for Iceland, the Faroes and Greenland throughout, the
# atoms are curated (curated.yaml): keyframes do not apply, so every change
# must be listed here.

# ---- Iceland, the Faroes, Greenland
- date: "930"
  note: The Althing meets for the first time; the Icelandic Commonwealth.
  owners:
    iceland: [IS-0, IS-1, IS-2, IS-3, IS-4, IS-5, IS-6, IS-7, IS-8]
- date: "1035"
  note: The Faroe Islands come under the Norwegian crown (traditionally dated about 1035).
  owners:
    norway: [FRO-1443]
- date: "1262"
  note: Old Covenant. The Icelanders accept the king of Norway.
  owners:
    norway: [IS-0, IS-1, IS-2, IS-3, IS-4, IS-5, IS-6, IS-7, IS-8]
- date: "1397"
  note: Kalmar Union. Iceland and the Faroes follow Norway into union with Denmark.
  owners:
    denmark-norway: [IS-0, IS-1, IS-2, IS-3, IS-4, IS-5, IS-6, IS-7, IS-8, FRO-1443]
- date: "1721-07-03"
  note: Hans Egede lands in western Greenland, and Danish–Norwegian colonisation begins. The east coast was not reached until the 1880s.
  owners:
    denmark-norway: [GL-KU, GL-QA, GL-QE, GL-SM, GL-UO]
- date: "1814-01-14"
  note: Treaty of Kiel. Norway goes to Sweden, but Iceland, the Faroes and Greenland stay with Denmark. The kingdom is Denmark alone again, with the duchies.
  owners:
    denmark: [DK-81, DK-82, DK-83!, DK-83~jut!, DK-84, DK-85, IS-0, IS-1, IS-2, IS-3, IS-4, IS-5, IS-6, IS-7, IS-8, FRO-1443, GL-KU, GL-QA, GL-QE, GL-SM, GL-UO]
- date: "1918-12-01"
  note: The Danish–Icelandic Act of Union. Iceland becomes a sovereign kingdom in personal union with Denmark (a republic from 17 June 1944).
  owners:
    iceland: [IS-0, IS-1, IS-2, IS-3, IS-4, IS-5, IS-6, IS-7, IS-8]

# ---- Norway and Denmark, 1000–1035
- date: "1000-09-09"
  note: Battle of Svolder. Olaf Tryggvason falls; Norway is divided between the Danish and Swedish kings, ruled for Sweyn Forkbeard by the jarls of Lade.
  owners:
    denmark: [NO-01, NO-02, NO-03, NO-04, NO-05, NO-06, NO-07, NO-08, NO-09, NO-10, NO-11, NO-12, NO-14, NO-15, NO-16, NO-17, NO-18~no, SE-O~bohus, SE-W~idre, SE-Z]
- date: "1015"
  note: Olaf Haraldsson (Saint Olaf) takes the Norwegian throne and drives out the jarls.
  owners:
    norway: [NO-01, NO-02, NO-03, NO-04, NO-05, NO-06, NO-07, NO-08, NO-09, NO-10, NO-11, NO-12, NO-14, NO-15, NO-16, NO-17, NO-18~no, SE-O~bohus, SE-W~idre, SE-Z]
- date: "1028"
  note: Cnut the Great, king of Denmark and England, drives Olaf out and takes Norway; Olaf falls at Stiklestad in 1030 trying to return.
  owners:
    denmark: [NO-01, NO-02, NO-03, NO-04, NO-05, NO-06, NO-07, NO-08, NO-09, NO-10, NO-11, NO-12, NO-14, NO-15, NO-16, NO-17, NO-18~no, SE-O~bohus, SE-W~idre, SE-Z]
- date: "1035"
  note: Magnus the Good, Olaf's son, is king of Norway after Cnut's regime collapses.
  owners:
    norway: [NO-01, NO-02, NO-03, NO-04, NO-05, NO-06, NO-07, NO-08, NO-09, NO-10, NO-11, NO-12, NO-14, NO-15, NO-16, NO-17, NO-18~no, SE-O~bohus, SE-W~idre, SE-Z]

# ---- Danish expansion around the Baltic, 1168–1325
- date: "1168"
  note: Valdemar I and Bishop Absalon take Arkona. The princes of Rügen become Danish vassals.
  owners:
    denmark: [DE-MV~pomN]
- date: "1201"
  note: Danish forces take Holstein, Hamburg and Lübeck. Danish overlordship north of the Elbe lasts until 1227.
  owners:
    denmark: [DE-SH~holstein, DE-SH!, DE-HH]
- date: "1219-06-15"
  note: Battle of Lyndanisse (Tallinn). Valdemar II begins the Danish conquest of northern Estonia.
  owners:
    denmark: [EE-37, EE-44, EE-51, EE-59, EE-70]
- date: "1224"
  note: The fall of Tarbatu (Tartu). Southern Estonia passes to the Livonian Brothers of the Sword and the Bishops of Riga and Dorpat (shown as the Order).
  owners:
    teutonic-order: [EE-39, EE-49, EE-57, EE-65, EE-67, EE-78, EE-82, EE-84, EE-86]
- date: "1227"
  note: The Sword Brothers take Danish Estonia and Saaremaa while Valdemar II is weakened by his captivity (1223–1225).
  owners:
    teutonic-order: [EE-37, EE-44, EE-51, EE-59, EE-70, EE-74]
- date: "1227-07-22"
  note: Battle of Bornhöved. Denmark loses Holstein, Hamburg and Lübeck; Rügen stays Danish.
  owners:
    hre: [DE-SH~holstein, DE-SH!, DE-HH]
- date: "1238-06-07"
  note: Treaty of Stensby. The Teutonic Order returns northern Estonia to Denmark.
  owners:
    denmark: [EE-37, EE-44, EE-51, EE-59, EE-70]
- date: "1325-11-08"
  note: Wizlaw III, the last prince of Rügen, dies. The principality passes to the dukes of Pomerania.
  owners:
    pomerania: [DE-MV~pomN]

# ---- Schleswig, Holstein and Lauenburg
- date: "1460-03-05"
  note: Treaty of Ribe. Christian I becomes Duke of Schleswig and Count of Holstein; Holstein stays an imperial fief.
  owners:
    danish-duchies: [DE-SH~holstein]
- date: "1689-09-30"
  note: The last Duke of Saxe-Lauenburg dies; the duchy passes to the dukes of Brunswick-Lüneburg (Hanover).
  owners:
    hanover: [DE-SH!]
- date: "1815-06-07"
  note: Denmark gains Lauenburg as compensation for Norway and Swedish Pomerania (taking possession in 1816). Holstein and Lauenburg join the German Confederation.
  owners:
    danish-duchies: [DE-SH!]
- date: "1864-10-30"
  note: Treaty of Vienna. After the Second Schleswig War, Denmark cedes Schleswig, Holstein and Lauenburg to Prussia and Austria jointly.
  owners:
    duchies-condominium: [DK-83~jut~nschleswig, DE-SH]
- date: "1865-08-14"
  note: Gastein Convention. Prussia takes over Schleswig and buys Lauenburg; Austria administers Holstein.
  owners:
    prussia: [DK-83~jut~nschleswig, DE-SH~schleswig, DE-SH!]
    habsburg: [DE-SH~holstein]
- date: "1866-08-23"
  note: Peace of Prague. After the Austro-Prussian War, Austria gives up Holstein; Prussia annexes the duchies.
  owners:
    prussia: [DE-SH~holstein]
- date: "1871-01-18"
  note: The German Empire is proclaimed.
  owners:
    germany: [DK-83~jut~nschleswig, DE-SH]
- date: "1920-06-15"
  note: After the plebiscites of February and March 1920, North Schleswig is handed to Denmark; the south votes to stay German.
  owners:
    denmark: [DK-83~jut~nschleswig]

# ---- Norway
- date: "1905-10-26"
  note: Sweden recognises the dissolution of the union. Norway is a fully independent kingdom (Haakon VII is elected in November).
  owners:
    norway: [NO-01, NO-02, NO-03, NO-04, NO-05, NO-06, NO-07, NO-08, NO-09, NO-10, NO-11, NO-12, NO-14, NO-15, NO-16, NO-17, NO-18~no, NO-19, NO-20]
- date: "1925-08-14"
  note: The Svalbard Treaty (1920) comes into force, and the archipelago becomes part of Norway.
  owners:
    norway: [NO-21]
- date: "1929-05-08"
  note: Norway annexes Jan Mayen (counted with Nordland in today's regions).
  owners:
    norway: [NO-18!]
