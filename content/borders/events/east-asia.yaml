- date: "800"
  note: About 800. Tang China rules from Chang’an but has lost the north-west to the Tibetan Empire, which holds the Hexi Corridor, Gansu west of the Liupan Mountains, Qinghai and the Tarim; the Kingdom of Khotan is its vassal. The Uyghur Khaganate rules Mongolia, Dzungaria and Turfan, the Karluks the Ili and Semirechye, the Oghuz the lower Syr Darya and the Kimek–Kipchak confederation the Irtysh steppe. In the north-east the Khitan tribes live on the Liao and Xar Moron rivers and Balhae rules Manchuria; Nanzhao rules Yunnan. The peoples of Siberia, the Mohe tribes of the Amur and the indigenous peoples of Taiwan live outside any state.
