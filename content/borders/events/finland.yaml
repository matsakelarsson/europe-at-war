# Finland from 1809. The Finnish atoms and Åland are curated from 1809
# ("Finland" in curated.yaml); the Karelian and Petsamo atoms are in "Russia
# and the steppe" (events here and in rus-and-russia.yaml/russia.yaml).
# FI-09 and FI-04 include their "Old Finland" parts (~fiOld), Russian 1721/1743–1812.

- date: "1809-09-17"
  note: Treaty of Fredrikshamn. Sweden cedes Finland and Åland to Russia. Alexander I had already promised the Diet of Porvoo (March 1809) to rule Finland as an autonomous grand duchy.
  owners:
    grand-duchy-finland: [FI-02, FI-03, FI-04, FI-05, FI-06, FI-07, FI-08, FI-10, FI-11, FI-12, FI-13, FI-14, FI-15, FI-16, FI-17, FI-18, FI-19, FI-09, ALD-4810, ALD-4812, ALD-4814, ALD-4818, ALD-4819, ALD-4820, ALD-4822]
    russia: [FI-04~fiOld, FI-09~fiOld]
- date: "1812-01-01"
  note: Alexander I joins “Old Finland”, the Vyborg province taken from Sweden in 1721 and 1743, to the Grand Duchy.
  owners:
    grand-duchy-finland: [FI-04~fiOld, FI-09~fiOld, RU-LEN~vib~fi1938, RU-LEN~kex~fi1938, RU-KR~kex~fi1938, RU-KR~fi1938]
- date: "1917-12-06"
  note: The Finnish parliament declares independence; Soviet Russia recognises it on 31 December.
  owners:
    finland: [FI-02, FI-03, FI-04, FI-05, FI-06, FI-07, FI-08, FI-10, FI-11, FI-12, FI-13, FI-14, FI-15, FI-16, FI-17, FI-18, FI-19, FI-09, ALD-4810, ALD-4812, ALD-4814, ALD-4818, ALD-4819, ALD-4820, ALD-4822, FI-04~fiOld, FI-09~fiOld, RU-LEN~vib~fi1938, RU-LEN~kex~fi1938, RU-KR~kex~fi1938, RU-KR~fi1938]
- date: "1920-10-14"
  note: Treaty of Tartu. Soviet Russia recognises Finland's border and cedes Petsamo, giving Finland a port on the Arctic Ocean.
  owners:
    finland: [RU-MUR~fi1938]
- date: "1940-03-13"
  note: Moscow Peace Treaty. After the Winter War Finland cedes the Karelian Isthmus with Vyborg, Ladoga Karelia, part of Salla and Kuusamo, and islands in the Gulf of Finland, and leases Hanko to the Soviet Union.
  owners:
    ussr: [RU-LEN~vib~fi1938, RU-LEN~kex~fi1938, RU-KR~kex~fi1938, RU-KR~fi1938]
- date: "1941-08-31"
  note: In the Continuation War Finnish forces retake Ladoga Karelia and, on 29 August, Vyborg; the ceded land is annexed again in December 1941. East Karelia, beyond the old border, is occupied (shown in the war's steps).
  owners:
    finland: [RU-LEN~vib~fi1938, RU-LEN~kex~fi1938, RU-KR~kex~fi1938, RU-KR~fi1938]
- date: "1944-06-20"
  note: The Red Army takes Vyborg in its summer offensive.
  owners:
    ussr: [RU-LEN~vib~fi1938]
- date: "1944-09-19"
  note: Moscow Armistice. Finland returns to the 1940 border, cedes Petsamo and leases Porkkala to the Soviet Union (until 1956); the Paris peace treaty confirms this in 1947.
  owners:
    ussr: [RU-LEN~kex~fi1938, RU-KR~kex~fi1938, RU-KR~fi1938, RU-MUR~fi1938]
