- date: "1814-06-21"
  note: "The Eight Articles of London. The Allies agree to unite the former Austrian Netherlands with the Dutch state under William of Orange, who takes over their government in August."
  owners:
    netherlands: [NL-NB, NL-ZE!, NL-ZE~vlaanderen, NL-LI, BE-VWV, BE-VOV, BE-VAN, BE-VBR, BE-BRU, BE-WBR, BE-WNA, BE-WHT, BE-WLX, BE-WLG~eupen, LU-L, LU-D, LU-G, BE-WLG!, BE-VLI]
- date: "1815-06-09"
