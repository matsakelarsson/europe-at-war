- date: "1552-04-18"
  note: "Henry II of France occupies Metz, Toul and Verdun (the Three Bishoprics), recognised as French in 1648."
  owners:
    france: [FR-57~metz]
- date: "1556-01-16"
  note: "Charles V abdicates as king of Spain. His son Philip II inherits Spain, the Netherlands and the Free County of Burgundy."
  owners:
    spain: [FR-25, FR-39, FR-70]
- date: "1558-01-08"
  note: "The duke of Guise takes Calais from the English."
  owners:
    france: [FR-62~calais]

# ---- The Dutch Republic and the wars of Louis XIV
- date: "1581-07-26"
  note: "Act of Abjuration. The provinces of the Union of Utrecht renounce Philip II; the Dutch Republic is born."
  owners:
    dutch-republic: [NL-NH, NL-ZH, NL-FL, NL-ZE!, NL-UT, NL-OV, NL-FR, NL-GE]
- date: "1594-07-22"
  note: "Maurice of Nassau takes Groningen; Groningen and Drenthe join the Republic."
  owners:
    dutch-republic: [NL-GR, NL-DR]
- date: "1601-01-17"
  note: "Treaty of Lyon. Savoy cedes Bresse, Bugey and Gex to France in exchange for Saluzzo."
  owners:
    france: [FR-01]
- date: "1620-10-20"
  note: "Louis XIII marches into Béarn, restores Catholic worship and joins Béarn and Lower Navarre to the French crown."
  owners:
    france: [FR-64~bearn]
- date: "1648-05-15"
  note: "Peace of Münster. Spain recognises the independence of the Dutch Republic, which keeps northern Brabant and Zeelandic Flanders."
  owners:
    dutch-republic: [NL-NB, NL-ZE~vlaanderen]
- date: "1648-10-24"
  note: "Peace of Westphalia. The Habsburgs cede Upper Alsace and the Sundgau to France, and the Three Bishoprics are confirmed as French."
  owners:
    france: [FR-68, FR-90]
- date: "1659-11-07"
  note: "Peace of the Pyrenees. Spain cedes Roussillon and most of Artois to France."
  owners:
    france: [FR-66, FR-62!]
- date: "1668-05-02"
  note: "Treaty of Aachen ends the War of Devolution. France keeps Lille, Douai and the towns it took in Flanders."
  owners:
    france: [FR-59~flandre]
- date: "1678-09-17"
  note: "Peace of Nijmegen. Spain cedes the Free County of Burgundy and Valenciennes, Cambrai and Maubeuge to France."
  owners:
    france: [FR-25, FR-39, FR-70, FR-59!]
- date: "1681-09-30"
  note: "French troops occupy Strasbourg, the last free city in Alsace; the Truce of Ratisbon (1684) and Ryswick (1697) leave it French."
  owners:
    france: [FR-67]
- date: "1684-08-15"
  note: "Truce of Ratisbon. The Emperor and Spain accept for twenty years France’s Reunions, Strasbourg and Luxembourg, taken in June after a siege."
  owners:
    france: [BE-WLX, LU-L, LU-D, LU-G]
- date: "1697-09-20"
  note: "Peace of Ryswick. France returns Luxembourg to Spain, and Lorraine to its duke."
  owners:
    habsburg-netherlands: [BE-WLX, LU-L, LU-D, LU-G]
- date: "1714-03-07"
  note: "Treaty of Rastatt. The Spanish Netherlands pass to the Austrian Habsburgs."
  owners:
    austrian-netherlands: [BE-VWV, BE-VOV, BE-VAN, BE-VBR, BE-BRU, BE-WBR, BE-WNA, BE-WHT, BE-WLX, BE-WLG~eupen, LU-L, LU-D, LU-G]
- date: "1715-11-15"
  note: "Third Barrier Treaty. The Dutch receive Venlo and part of Upper Guelders; with Maastricht they hold most of Limburg."
  owners:
    dutch-republic: [NL-LI]
- date: "1766-02-23"
  note: "Stanisław Leszczyński, the former king of Poland, dies, and the duchies of Lorraine and Bar pass to France."
  owners:
    france: [FR-54, FR-88, FR-57!, FR-55]
- date: "1768-05-15"
  note: "Treaty of Versailles. Genoa, unable to put down the Corsican revolt, cedes Corsica to France."
  owners:
    france: [FR-2A, FR-2B]

# ---- Revolution and empire
- date: "1791-09-14"
