# France and the Low Countries, 1066–today (curated range "France and the Low
# Countries" in curated.yaml). Generated from a group list for wave 3; edit by hand
# from here on. Earlier dates come from the drafted keyframes.
#
# How the map is drawn:
# - France is one kingdom (the great fiefs are not shown), except: the lands of the
#   English crown (Normandy 1066–1144; the Angevin lands 1154–1204/24; Gascony to 1453;
#   the Brétigny lands 1360–1372; Lancastrian France 1419–1450; Calais 1347–1558); the
#   duchy of Brittany until 1532; the county of Flanders until 1384; the county of
#   Toulouse until 1229/1271; and the Valois Burgundian state 1363–1477.
# - The Low Countries follow the Holy Roman Empire rule (see german-lands.yaml): the
#   imperial fiefs are `hre` until they pass to Burgundy, and the larger territorial
#   states (Liège, Lorraine, Habsburg Upper Alsace) are shown from 1500-07-02.
# - Savoy, Provence, Dauphiné, Lyon, the Vivarais, the Free County, Roussillon, Béarn,
#   Avignon and Corsica are separate until they joined France.
# - Alsace-Lorraine 1871–1918 is in central-europe.yaml, Savoy and Nice 1860 in italy.yaml.

