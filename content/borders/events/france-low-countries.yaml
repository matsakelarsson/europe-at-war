  owners:
    france: [FR-84]
- date: "1792-11-27"
  note: "France annexes Savoy as the department of Mont-Blanc."
  owners:
    france: [FR-73, FR-74]
- date: "1793-01-31"
  note: "France annexes the county of Nice."
  owners:
    france: [FR-06]
- date: "1795-01-19"
  note: "The stadtholder flees as French troops cross the frozen rivers; the Batavian Republic is proclaimed."
