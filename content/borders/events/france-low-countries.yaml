- date: "1810-03-16"
  note: "Louis Bonaparte cedes the Dutch lands south of the Waal to France."
  owners:
    france: [NL-NB, NL-ZE!]
- date: "1810-07-09"
  note: "Napoleon annexes the Kingdom of Holland to France."
  owners:
    france: [NL-NH, NL-ZH, NL-FL, NL-UT, NL-FR, NL-GE, NL-OV, NL-GR, NL-DR]
- date: "1813-12-02"
  note: "The French have left the northern Netherlands; William of Orange returns and is proclaimed sovereign prince."
  owners:
    netherlands: [NL-NH, NL-ZH, NL-FL, NL-UT, NL-FR, NL-GE, NL-OV, NL-GR, NL-DR]
- date: "1814-05-30"
