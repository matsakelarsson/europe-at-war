# The German lands, Austria, Bohemia and Switzerland from 1240 ("German lands"
# in curated.yaml). Splits in splits/60-german-lands.geojson.
#
# How the Holy Roman Empire is drawn: until 1500 as one polity (`hre`), with
# Bohemia, Habsburg Austria (from 1282) and the Swiss Confederacy (from 1291)
# separate. From the Diet of Augsburg in 1500 the larger territorial states
# are shown; the many small ones (ecclesiastical states, imperial cities,
# counts) stay grouped as `hre` until 1803–1806.
#
# Swedish Pomerania, Bremen-Verden and Schleswig-Holstein before 1815 are in
# events/sweden-at-war.yaml and events/denmark.yaml; Silesia after 1772 and the
# eastern borders after 1918 are in events/poland-lithuania.yaml.

# Before 1240 (outside the curated range): these correct the drafts only until
# the next keyframe.
