# Iberia, 800–today (curated range "Iberia" in curated.yaml). Generated from a
# group list for wave 4 (scratchpad gen-south.mjs); edit by hand from here on.
#
# How the map is drawn:
# - Atoms are Spanish provinces and Portuguese districts, with splits for Upper
#   Aragon (ES-HU~jaca), Urgell and Pallars (ES-L~pallars), Tudela (ES-NA~tudela),
#   Menorca (ES-PM~menorca) and Olivenza (ES-BA~olivenza). Gibraltar is too small
#   to be an atom.
# - Each province changes hands when its main town was taken, so frontier lines
#   are approximate. The Duero valley counts as Asturian/Leonese as it was resettled.
# - León and Castile are one polity while one king held both (castile 1037–65,
#   1072–1157, from 1230). Castile and Aragon become `spain` on 1516-01-23;
#   Portugal stays Portugal during the Iberian Union (1580–1640).
# - Occupations (the Napoleonic war, the Civil War fronts) are war-step areas.
# - Roussillon (FR-66) is in france-low-countries.yaml.

# ---- Iberia in 800 (start of the curated range)
- date: "800"
  note: "About 800. The Emirate of Córdoba rules most of the peninsula. The Kingdom of Asturias holds the north coast from Galicia to the Basque lands and the upper Ebro; the Frankish March of Spain holds Girona, Urgell and Aragon; the Balearics are still nominally Byzantine; the Duero valley is a thinly settled frontier."
  owners:
    leon: [ES-C, ES-LU, ES-OR, ES-PO, ES-O, ES-S, ES-BI, ES-VI]
    carolingian: [ES-GI, ES-L~pallars, ES-HU~jaca, AD-02, AD-03, AD-04, AD-05, AD-06, AD-07, AD-08]
    cordoba: [ES-NA!, ES-NA~tudela, ES-SS, ES-LO, ES-LE, ES-P, ES-ZA, ES-VA, ES-SO, ES-BU, ES-SA, ES-SG, ES-AV, ES-M, ES-TO, ES-GU, ES-CU, ES-CR, ES-AB, ES-Z, ES-TE, ES-B, ES-T, ES-CS, ES-V, ES-A, ES-MU, ES-CC, ES-H, ES-SE, ES-CA, ES-MA, ES-CO, ES-J, ES-GR, ES-AL, ES-HU!, ES-L!, ES-BA!, ES-BA~olivenza, PT-16, PT-03, PT-13, PT-04, PT-17, PT-01, PT-18, PT-09, PT-06, PT-05, PT-10, PT-11, PT-14, PT-15, PT-12, PT-07, PT-02, PT-08]
