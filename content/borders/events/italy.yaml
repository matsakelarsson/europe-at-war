# Italy, 1797–1870: a first pass until the Iberia and Italy wave. The drafts
# have no snapshot between 1815 and 1880. The Napoleonic Kingdom of Italy and
# Habsburg Lombardy–Venetia were added in the German lands wave, for the wars
# of 1796–1815 and 1866; the 1800 and 1815 keyframes were corrected to match.

- date: "1797-10-17"
  note: Treaty of Campo Formio. Austria recognises the Cisalpine Republic (Lombardy, Modena and the Papal Legations) and receives Venice with the Venetian mainland, Istria and Dalmatia.
  owners:
    napoleonic-italy: [IT-VA, IT-CO, IT-SO, IT-BG, IT-BS, IT-CR, IT-MI, IT-LC, IT-MB, IT-LO, IT-MN, IT-BO, IT-FE, IT-RA, IT-FC, IT-RN, IT-MO, IT-RE]
    habsburg: [IT-BL, IT-UD, IT-VE, IT-PD, IT-RO, IT-VI, IT-VR, IT-TV, IT-PN, SI-050, SI-040, SI-090, HR-18, HR-13, HR-15, HR-17]
- date: "1801-02-09"
  note: Treaty of Lunéville. After Marengo the Cisalpine Republic is restored, now with Novara.
  owners:
    napoleonic-italy: [IT-NO]
- date: "1805-12-26"
  note: Peace of Pressburg. Austria cedes Venetia, Venetian Istria and Dalmatia to the Kingdom of Italy.
  owners:
    napoleonic-italy: [IT-BL, IT-UD, IT-VE, IT-PD, IT-RO, IT-VI, IT-VR, IT-TV, IT-PN, SI-050, SI-040, SI-090, HR-18, HR-13, HR-15, HR-17]
- date: "1808-01-31"
  note: The French, who had occupied Ragusa in 1806, abolish the Republic and join it to the Kingdom of Italy.
  owners:
    napoleonic-italy: [HR-19]
- date: "1808-04-02"
  note: Napoleon annexes the Marches, taken from the Papal States, to the Kingdom of Italy.
  owners:
    napoleonic-italy: [IT-AN, IT-PU, IT-MC, IT-AP, IT-FM]
- date: "1814-05-30"
  note: First Peace of Paris. Austria, whose troops had occupied northern Italy in April, receives Lombardy and Venetia; Novara returns to Sardinia, and the Marches and the Legations to the pope.
  owners:
    habsburg: [IT-VA, IT-CO, IT-SO, IT-BG, IT-BS, IT-CR, IT-MI, IT-LC, IT-MB, IT-LO, IT-MN, IT-BL, IT-UD, IT-VE, IT-PD, IT-RO, IT-VI, IT-VR, IT-TV, IT-PN, IT-GO, IT-TS]
    savoy: [IT-NO]
    papal-states: [IT-BO, IT-FE, IT-RA, IT-FC, IT-RN, IT-AN, IT-PU, IT-MC, IT-AP, IT-FM]
    modena: [IT-MO, IT-RE]

- date: "1859-11-10"
  note: Treaty of Zürich. After the Second Italian War of Independence, Austria cedes Lombardy (without Mantua) to France, which passes it to Sardinia.
  owners:
    savoy: [IT-VA, IT-CO, IT-SO, IT-BG, IT-BS, IT-CR, IT-MI, IT-LC, IT-MB, IT-LO, IT-NO]
- date: "1860-03-24"
  note: Treaty of Turin. Sardinia cedes Savoy and Nice to France in return for its support; plebiscites in April confirm it.
  owners:
    france: [FR-73, FR-74, FR-06]
- date: "1861-03-17"
  note: The Kingdom of Italy is proclaimed in Turin. In 1860 Tuscany, Modena, Parma and the Romagna had voted to join Sardinia, Garibaldi's Thousand had overthrown the Kingdom of the Two Sicilies, and Sardinian troops had taken the Marche and Umbria from the Papal States.
  owners:
    italy: [IT-AO, IT-VB, IT-IM, IT-CN, IT-TO, IT-SP, IT-GE, IT-SV, IT-CI, IT-SS, IT-NU, IT-OT, IT-OR, IT-VS, IT-CA, IT-OG, IT-AT, IT-VC, IT-PV, IT-AL, IT-BI, IT-VA, IT-CO, IT-SO, IT-BG, IT-BS, IT-CR, IT-MI, IT-LC, IT-MB, IT-LO, IT-NO, IT-LU, IT-MS, IT-RE, IT-MO, IT-PC, IT-PR, IT-FC, IT-GR, IT-LI, IT-PI, IT-SI, IT-AR, IT-FI, IT-PT, IT-PO, IT-BO, IT-FE, IT-RA, IT-RN, IT-PU, IT-AN, IT-MC, IT-FM, IT-AP, IT-PG, IT-TR, IT-RI, IT-TE, IT-AQ, IT-PE, IT-CH, IT-CB, IT-FG, IT-BT, IT-BA, IT-BR, IT-LE, IT-TA, IT-MT, IT-CS, IT-KR, IT-CZ, IT-RC, IT-VV, IT-PZ, IT-SA, IT-NA, IT-CE, IT-TP, IT-ME, IT-PA, IT-AG, IT-CL, IT-RG, IT-SR, IT-CT, IT-EN, IT-BN, IT-AV, IT-IS]
- date: "1866-10-12"
  note: Treaty of Vienna. After the Austro-Prussian War, in which Italy fought on Prussia's side, Austria cedes Venetia and Mantua (through France) to Italy.
  owners:
    italy: [IT-BL, IT-UD, IT-VE, IT-PD, IT-RO, IT-VI, IT-VR, IT-TV, IT-PN, IT-MN]
- date: "1870-10-09"
  note: Italian troops entered Rome on 20 September after the French garrison left; Lazio is annexed after a plebiscite, and Rome becomes the capital. The pope withdraws into the Vatican.
  owners:
    italy: [IT-RM, IT-LT, IT-FR, IT-VT]
- date: "1918-11-03"
  note: Armistice of Villa Giusti. Italian troops occupy Trieste and Gorizia; the Treaty of Rapallo of 1920 confirms them as Italian.
  owners:
    italy: [IT-GO, IT-TS]
