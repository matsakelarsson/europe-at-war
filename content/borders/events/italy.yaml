# Italy, Sardinia, Malta, San Marino and Monaco, 800–today (curated range "Italy"
# in curated.yaml). Generated from a group list for wave 4 (scratchpad
# gen-south.mjs); edit by hand from here on. Trentino and South Tyrol are in
# german-lands.yaml; Istria and Dalmatia (listed here for 1797–1814) belong to
# the Balkan wave; Nice, Savoy and Corsica are in france-low-countries.yaml.
#
# How the map is drawn:
# - Atoms are provinces, with splits for the Neapolitan parts of Lazio
#   (IT-LT~gaeta, IT-FR~sora, IT-RI~cittaducale) and for Montferrat (IT-AL~casale).
#   A province changes hands with its main city, so lines are approximate.
# - The north is Carolingian to 888, the Kingdom of Italy to 962, then `hre`
#   until Frederick II’s death (1250-12-13), except Venice, the Papal States and,
#   from 1100, Genoa and Pisa. After 1250 the north and centre are shown as
#   regional states; cities not yet under a bigger neighbour are grouped as
#   `italian-communes`.
# - Naples, Sicily, Sardinia and Milan keep their own polities while ruled by
#   Aragon, Spain or Austria.
# - Occupations (French Piedmont 1536–59, Agnadello 1509, the wars of 1799 and
#   1848–49, the world wars) are war-step areas.

# ---- Italy in 800 (start of the curated range)
