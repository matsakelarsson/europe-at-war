# Korea, Japan, the Ryukyu Islands, Sakhalin and the Kurils from 800 (curated
# range "Korea and Japan" in curated.yaml). Splits in splits/99b-korea-japan.geojson.
# Written for wave 10; edit directly.

- date: "800"
  note: About 800. Silla rules the Korean peninsula south of the Taedong River and the coast up to the Wonsan area; the land between the Taedong and the Chongchon is an empty frontier, and Balhae rules the Yalu and the north-east. Tamna (Jeju) is a kingdom of its own that sends tribute to Silla. Japan, ruled from Heian-kyō (Kyoto) since 794, holds Kyushu, Shikoku and Honshu up to the lands of the Emishi in the north of Tōhoku, where the court’s armies are still fighting. Hokkaido, southern Sakhalin and the Kurils are the land of the Satsumon and Okhotsk peoples, ancestors of the Ainu, and the north of Sakhalin that of the Nivkh. The Ryukyu Islands are outside any state.
  owners:
    silla: [KR-11, KR-26, KR-27, KR-28, KR-29, KR-30, KR-31, KR-41, KR-42, KR-43, KR-44, KR-45, KR-46, KR-47, KR-48, KR-50, KP-05, KP-06, KP-07]
    tamna: [KR-49]
    balhae: [KP-03, KP-04, KP-08, KP-09, KP-10, KP-13]
    japan: [JP-04, JP-05, JP-06, JP-07, JP-08, JP-09, JP-10, JP-11, JP-12, JP-13, JP-14, JP-15, JP-16, JP-17, JP-18, JP-19, JP-20, JP-21, JP-22, JP-23, JP-24, JP-25, JP-26, JP-27, JP-28, JP-29, JP-30, JP-31, JP-32, JP-33, JP-34, JP-35, JP-36, JP-37, JP-38, JP-39, JP-40, JP-41, JP-42, JP-43, JP-44, JP-45, JP-46]
    emishi: [JP-02, JP-03]
    ainu: [JP-01, RU-SAK~karafuto, RU-SAK~skurils, RU-SAK~nkurils]
    siberian-peoples: [RU-SAK!]
    none: [KP-01, KP-02, JP-47]

- date: "0802"
  note: Sakanoue no Tamuramaro builds Isawa Castle on the Kitakami River and the Emishi leaders Aterui and More surrender. Shiwa Castle follows in 803, and Fun’ya no Watamaro’s campaign of 811 brings the rest of the Kitakami basin (Iwate) under the court.
  owners:
    japan: [JP-03]

- date: "0892"
  note: Gyeon Hwon, a Silla commander, rebels in the south-west and takes Mujinju (Gwangju).
  owners:
    later-baekje: [KR-46, KR-29]

- date: "0900"
  note: Gyeon Hwon proclaims Later Baekje at Wansanju (Jeonju).
  owners:
    later-baekje: [KR-45]

- date: "0901"
  note: Gung Ye, a rebel leader who has taken central Korea from Silla, proclaims Later Goguryeo at Songak (Kaesong). It is renamed Majin in 904 and Taebong in 911.
  owners:
    taebong: [KR-41, KR-11, KR-28, KR-42, KR-43, KP-05, KP-06, KP-07]

- date: "0904"
  note: Hong Gi, the commander of Gongju, goes over to Gung Ye with the land around it.
  owners:
    taebong: [KR-44, KR-50, KR-30]

- date: "0918"
  note: Wang Geon overthrows Gung Ye and founds Goryeo; he resettles the ruined Pyongyang as the Western Capital (Seogyeong). Ungju (Gongju) and Unju (Hongseong) go over to Later Baekje.
  owners:
    goryeo: [KR-41, KR-11, KR-28, KR-42, KR-43, KP-05, KP-06, KP-07, KP-01, KP-02]
    later-baekje: [KR-44, KR-50, KR-30]

- date: "0920"
  note: Later Baekje takes Daeya (Hapcheon) and the west of Gyeongsang from Silla.
  owners:
    later-baekje: [KR-48]

- date: "0926-02-20"
  note: With the fall of Balhae to the Liao, the Jurchen tribes are left in the north of the Korean peninsula; Balhae refugees flee to Goryeo.
  owners:
    jurchens: [KP-03, KP-04, KP-08, KP-09, KP-10, KP-13]

- date: "0935-12"
  note: King Gyeongsun of Silla gives up his kingdom to Goryeo.
  owners:
    goryeo: [KR-47, KR-27, KR-31, KR-26]

- date: "0936"
  note: Goryeo destroys Later Baekje at the battle of the Illi River and unifies the peninsula.
  owners:
    goryeo: [KR-46, KR-29, KR-45, KR-44, KR-30, KR-50, KR-48]

- date: "0994"
  note: After the first Khitan invasion, Seo Hui’s talks with the Liao commander Xiao Sunning (993) win Goryeo the land between the Chongchon and the Yalu, held by Jurchen tribes; Goryeo fortifies it as the six garrisons east of the river.
  owners:
    goryeo: [KP-03]

- date: "1044"
  note: Goryeo completes the Thousand-li Wall (Cheolli Jangseong), begun in 1033, from the mouth of the Yalu to the east coast at Jeongpyeong, on the south-western edge of the Hamhung plain, and settles the coast behind it.
  owners:
    goryeo: [KP-08~yonghung]

- date: "1100"
  note: "About 1100 (the exact date is not known). After the campaign of 1070, the Kiyohara and then the Northern Fujiwara of Hiraizumi, who govern Mutsu and Dewa for the court, bring the north of Honshu under Japanese rule: districts are set up in Nukanobu and Tsugaru (Aomori)."
  owners:
    japan: [JP-02]

- date: "1105"
  note: Tamna becomes a county of Goryeo, though its rulers keep their titles.
  owners:
    goryeo: [KR-49]

- date: "1115"
  note: The Jurchens of the north-east of the peninsula, led by the Wanyan since the 1100s, come under the new Jin dynasty.
  owners:
    jurchen-jin: [KP-04, KP-08!, KP-09, KP-10, KP-13]

- date: "1217"
  note: Puxian Wannu’s Eastern Xia takes the north-east of the peninsula from the Jin.
  owners:
    eastern-xia: [KP-04, KP-08!, KP-09, KP-10, KP-13]

- date: "1233"
  note: The Mongols end Eastern Xia; its lands in the north-east of the peninsula come under the Mongol Empire.
  owners:
    mongol-empire: [KP-04, KP-08!, KP-09, KP-10, KP-13]

- date: "1258"
  note: Two Goryeo officials, Jo Hwi and Tak Cheong, kill the local commander and hand the land north of the Cheollyeong pass to the Mongols, who govern it as the Ssangseong Commandery.
  owners:
    mongol-empire: [KP-08~yonghung]

- date: "1260-05-05"
  note: The Mongol lands in the north-east of the peninsula pass to Kublai.
  owners:
    yuan: [KP-04, KP-08, KP-09, KP-10, KP-13]

- date: "1270"
  note: Choe Tan, an officer at Pyongyang who rebelled against Goryeo in 1269, hands the north-west to the Mongols, who govern it as the Dongnyeong Prefecture.
  owners:
    yuan: [KP-01, KP-02, KP-03]

- date: "1273"
  note: After the last Sambyeolcho stronghold on Jeju falls, the Mongols take the island as a horse-breeding ground under their own governor.
  owners:
    yuan: [KR-49]

- date: "1290"
  note: The Yuan give the Dongnyeong Prefecture back to Goryeo.
  owners:
    goryeo: [KP-01, KP-02, KP-03]

- date: "1294"
  note: The Yuan give Jeju back to Goryeo; Mongol horse-breeders stay on the island, and a Yuan commandery set up again in 1300 is replaced by a Goryeo garrison in 1301.
  owners:
    goryeo: [KR-49]

- date: "1322"
  note: About 1322. Okinawa is divided between three kingdoms, Hokuzan in the north, Chūzan in the centre and Nanzan in the south; from 1372 they send tribute to Ming China.
  owners:
    sanzan: [JP-47!]

- date: "1356"
  note: "King Gongmin turns against the Yuan: his army takes back the Ssangseong Commandery, helped by a local commander, Yi Ja-chun, the father of Yi Seong-gye, and pushes north along the coast."
  owners:
    goryeo: [KP-08]

- date: "1368-09-14"
  note: The Yuan lands on the Tumen and the upper Yalu pass to the Mongols who hold Manchuria for the Northern Yuan.
  owners:
    northern-yuan: [KP-04, KP-09, KP-10, KP-13]

- date: "1369"
  note: Kanggye on the middle Yalu, a Goryeo garrison since 1361, becomes a garrison command (manhobu).
  owners:
    goryeo: [KP-04]

- date: "1387"
  note: After Naghachu’s surrender to the Ming, the Jurchen tribes of the Tumen and the upper Yalu are left to themselves.
  owners:
    jurchens: [KP-09, KP-10, KP-13]

- date: "1391"
  note: Goryeo makes Kapsan, on the upper Yalu, a garrison command.
  owners:
    goryeo: [KP-10]

- date: "1392-08-05"
  note: Yi Seong-gye takes the throne and founds Joseon (so named in 1393), ending Goryeo.
  owners:
    joseon: [KR-11, KR-26, KR-27, KR-28, KR-29, KR-30, KR-31, KR-41, KR-42, KR-43, KR-44, KR-45, KR-46, KR-47, KR-48, KR-50, KR-49, KP-01, KP-02, KP-03, KP-04, KP-05, KP-06, KP-07, KP-08, KP-10]

- date: "1429"
  note: Shō Hashi of Chūzan conquers Nanzan, having taken Hokuzan in 1416, and unites Okinawa as the Ryukyu Kingdom.
  owners:
    ryukyu: [JP-47!]

- date: "1434"
  note: "Kim Jong-seo begins the six garrisons on the lower Tumen, completed by 1449, while King Sejong’s armies set up four commanderies on the middle Yalu in 1433–1443 (all four were abandoned in 1455–1459 and the land left empty): the Yalu and the Tumen become the border of Korea."
  owners:
    joseon: [KP-09, KP-13]

- date: "1466"
  note: Shō Toku conquers Kikai, the last of the Amami Islands to come under Ryukyu.
  owners:
    ryukyu: [JP-47~amami]

- date: "1500"
  note: Ryukyuan forces defeat Oyake Akahachi on Ishigaki; the Yaeyama and Miyako Islands come under the rule of Shuri.
  owners:
    ryukyu: [JP-47~sakishima]

- date: "1604"
  note: Tokugawa Ieyasu grants the Matsumae clan the sole right to trade with the Ainu; their land at the south-western tip of Ezo (Hokkaido), where Japanese settlers have held forts since the 1450s, becomes the Matsumae domain.
  owners:
    japan: [JP-01~oshima]

- date: "1611"
  note: "Two years after the Satsuma invasion, the released king Shō Nei accepts Satsuma’s terms: the Amami Islands are ruled directly by Satsuma, and Ryukyu becomes a vassal of Satsuma and the shogunate while still sending tribute to China."
  owners:
    japan: [JP-47~amami]

- date: "1711"
  note: Cossacks from Kamchatka land on Shumshu, and in 1713 on Paramushir; Russia takes tribute from the Ainu of the northern Kurils.
  owners:
    russia: [RU-SAK~nkurils]

- date: "1799"
  note: The shogunate takes eastern Ezo and the southern Kurils (Kunashir and Iturup) from the Matsumae domain and rules them directly, against Russian advances; western Ezo follows in 1807. The lands go back to Matsumae in 1821 and to the shogunate again in 1855.
  owners:
    japan: [JP-01!, RU-SAK~skurils]

- date: "1853"
  note: Gennady Nevelskoy’s expedition sets up Russian posts on Sakhalin; Russia occupies the north of the island, where it opens coal mines at Dué and, from 1869, a penal colony.
  owners:
    russia: [RU-SAK!]

- date: "1855-02-07"
  note: "Treaty of Shimoda: Russia and Japan draw their border in the Kurils between Iturup and Urup, and leave Sakhalin, where both have posts, undivided and open to both."
  owners:
    russia: [RU-SAK~nkurils]

- date: "1875-05-07"
  note: "Treaty of Saint Petersburg: Japan gives up its claims to Sakhalin, which becomes wholly Russian, in exchange for the Kurils north of Iturup."
  owners:
    russia: [RU-SAK!, RU-SAK~karafuto]
    japan: [RU-SAK~nkurils]

- date: "1879-03-27"
  note: Japan abolishes the Ryukyu Domain, made from the kingdom in 1872, and annexes the islands as Okinawa Prefecture; King Shō Tai is taken to Tokyo.
  owners:
    japan: [JP-47!, JP-47~sakishima]

- date: "1905-09-05"
  note: "Treaty of Portsmouth: Russia cedes Sakhalin south of the 50th parallel (Karafuto) to Japan."
  owners:
    japan: [RU-SAK~karafuto]

- date: "1910-08-29"
  note: Japan annexes Korea, its protectorate since 1905; the Korean Empire ends.
  owners:
    japan: [KR-11, KR-26, KR-27, KR-28, KR-29, KR-30, KR-31, KR-41, KR-42, KR-43, KR-44, KR-45, KR-46, KR-47, KR-48, KR-50, KR-49, KP-01, KP-02, KP-03, KP-04, KP-05, KP-06, KP-07, KP-08, KP-09, KP-10, KP-13]

- date: "1917-11-07"
  note: "The Bolsheviks take power in Petrograd. Northern Sakhalin, held by the Whites from 1918, rises in January 1920 and is occupied by Japanese troops in April."
  owners:
    ussr: [RU-SAK!]

- date: "1920-10-22"
  note: Northern Sakhalin is claimed by the Far Eastern Republic; Japanese troops occupy it from 1920 to 1925.
  owners:
    far-eastern-republic: [RU-SAK!]

- date: "1922-11-15"
  note: Northern Sakhalin passes to Soviet Russia with the rest of the Far Eastern Republic.
  owners:
    ussr: [RU-SAK!]

- date: "1945-08-24"
  note: Soviet troops, who entered Korea on 10–12 August, reach Pyongyang. The Japanese north of the 38th parallel, the line agreed with the United States between their zones, surrender to them, and the Soviet Union sets up its administration.
  owners:
    soviet-civil-administration: [KP-01, KP-02, KP-03, KP-04, KP-05!, KP-06!, KP-07, KP-08, KP-09, KP-10, KP-13, KR-41~n38, KR-42~n38]

- date: "1945-09-09"
  note: The Japanese governor-general surrenders in Seoul to American forces, who landed at Incheon the day before; the US Army Military Government rules Korea south of the 38th parallel.
  owners:
    usamgik: [KR-11, KR-26, KR-27, KR-28, KR-29, KR-30, KR-31, KR-41!, KR-42!, KR-43, KR-44, KR-45, KR-46, KR-47, KR-48, KR-49, KR-50, KP-05~s38, KP-06~s38]

- date: "1946-01-29"
  note: "An order of the Allied occupation separates the islands south of 30° N from Japan’s administration: the Ryukyu and Amami Islands (Okinawa, taken by American forces in the battle of Okinawa in April–June 1945, and the other islands, whose garrisons surrendered in September 1945) are ruled by a US military government, from 1950 the United States Civil Administration of the Ryukyu Islands. The Treaty of San Francisco (1951) confirmed American rule; Japan kept residual sovereignty."
  owners:
    uscar: [JP-47]

- date: "1946-02-02"
  note: The Soviet Union annexes South Sakhalin and the Kuril Islands, which its troops occupied in August and September 1945. Japan renounced South Sakhalin and the Kurils in the Treaty of San Francisco (1951), which the Soviet Union did not sign, but holds that the four southern islands, Iturup, Kunashir, Shikotan and the Habomai, are not part of the Kurils it renounced (Shikotan and the Habomai being part of Hokkaido) and claims them as its Northern Territories; the dispute is unresolved.
  owners:
    ussr: [RU-SAK~karafuto, RU-SAK~skurils, RU-SAK~nkurils]

- date: "1948-08-15"
  note: The Republic of Korea is proclaimed in Seoul, with Syngman Rhee as president.
  owners:
    south-korea: [KR-11, KR-26, KR-27, KR-28, KR-29, KR-30, KR-31, KR-41!, KR-42!, KR-43, KR-44, KR-45, KR-46, KR-47, KR-48, KR-49, KR-50, KP-05~s38, KP-06~s38]

- date: "1948-09-09"
  note: The Democratic People’s Republic of Korea is proclaimed in Pyongyang, with Kim Il-sung as premier.
  owners:
    north-korea: [KP-01, KP-02, KP-03, KP-04, KP-05!, KP-06!, KP-07, KP-08, KP-09, KP-10, KP-13, KR-41~n38, KR-42~n38]

- date: "1953-07-27"
  note: "Korean Armistice Agreement: the front line becomes the Military Demarcation Line. South Korea keeps the land north of the 38th parallel in the east, North Korea the land south of it in the west, with Kaesong and the Ongjin peninsula."
  owners:
    south-korea: [KR-41~n38, KR-42~n38]
    north-korea: [KP-05~s38, KP-06~s38]

- date: "1953-12-25"
  note: The United States returns the Amami Islands to Japan.
  owners:
    japan: [JP-47~amami]

- date: "1972-05-15"
  note: The United States returns Okinawa and the rest of the Ryukyu Islands to Japan; American bases stay.
  owners:
    japan: [JP-47!, JP-47~sakishima]

- date: "1991-12-26"
  note: Sakhalin and the Kurils pass to Russia with the end of the Soviet Union.
  owners:
    russia: [RU-SAK]
