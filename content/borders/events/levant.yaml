# The Levant and Egypt, 800–today (curated range "Levant and Egypt" in
# curated.yaml). Generated for wave 5 (scratchpad gen-east.mjs); edit by hand
# from here on. Hatay and Cilicia appear here for 1833–1840, Hatay for 1920–1939.
#
# How the map is drawn:
# - Atoms are governorates and districts. A region changes hands with its main
#   town, so lines are approximate: the crusader coast is drawn by district.
# - Egypt under Muhammad Ali and his heirs (from 1805) is shown as its own state;
#   the British occupation of 1882 and the protectorate of 1914 do not change
#   the map. The French in Egypt (1798–1801) are war-step areas.
# - Territories occupied by Israel in 1967 (the West Bank, Gaza, Sinai, the
#   Golan) are war-step areas, not border changes; Palestine is shown from the
#   1988 declaration.

