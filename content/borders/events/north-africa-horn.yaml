# North Africa, the Sahel and the Horn of Africa from 800: Morocco, Western
# Sahara, Algeria, Tunisia, Libya, Mauritania, Mali, Niger, Burkina Faso, Chad,
# Sudan, South Sudan, Eritrea, Ethiopia, Djibouti, Somalia and Somaliland
# (curated range "North Africa, the Sahel and the Horn" in curated.yaml).
# Splits in splits/99d-north-africa-horn.geojson. Written for wave 12; edit directly.

- date: "0800"
  note: "North Africa, the Sahel and the Horn about 800. In the Maghreb the Idrisids (from 789) rule around Fez and Tlemcen, the Barghawata the Atlantic plain, the Emirate of Nekor the Rif and the Midrarids Sijilmasa; the Ibadi Rustamids rule from Tahert, and the Aghlabids (from 800) govern Ifriqiya and Tripoli for the Abbasid caliph, whose governors in Egypt hold Barqa. South of the Sahara the Ghana Empire (Wagadu) rules from Koumbi Saleh, Gao (Kawkaw) is a kingdom on the Niger, and Kanem lies north-east of Lake Chad. On the Nile, Christian Makuria and Alwa rule Nubia, and in the highlands the late Kingdom of Aksum survives. Desert and pastoral peoples without a state (the Sanhaja, the Tuareg, the Beja, the Somali and Oromo clans) are shown as no state."
