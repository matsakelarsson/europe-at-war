# curated.yaml). Splits in splits/99f-north-america.geojson. Written for wave 14;
# edit directly.

- date: "0800"
  note: "North America and the Caribbean about 800. In Mesoamerica the Classic Maya city-states of the southern lowlands are close to their collapse, while the cities of northern Yucatán flourish; Monte Albán, the old Zapotec capital in the valley of Oaxaca, is in decline, and central Mexico is divided among the cities that rose after the fall of Teotihuacan, such as Xochicalco and Cacaxtla. North of Mexico, farming peoples live in the river valleys of the East and the Southwest, and hunting, fishing and gathering peoples across the rest of the continent; the Caribbean islands are home to the ancestors of the Taíno. Only the Mesoamerican states are shown on the map: the Native nations north of Mexico appear in the wars they fought."
