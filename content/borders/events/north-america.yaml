- date: "1521-08-13"
  note: "Tenochtitlan falls to Hernán Cortés and his Tlaxcalan and other Native allies after a siege of nearly three months. The Aztec Empire passes to Spain, and New Spain is built on its ruins; Tlaxcala keeps privileges as an ally."
  owners:
    new-spain: [MX-DIF, MX-MEX, MX-HID, MX-MOR, MX-PUE, MX-TLA, MX-VER, MX-GRO, MX-OAX~mixteca]

- date: "1522"
  note: "The Tarascan king Tangáxuan II submits to the Spaniards, and expeditions under Francisco de Orozco and Pedro de Alvarado subdue the Zapotec and Mixtec lords of Oaxaca."
  owners:
    new-spain: [MX-MIC, MX-OAX!]

- date: "1523"
  note: "Gonzalo de Sandoval founds Colima."
  owners:
    new-spain: [MX-COL]

- date: "1527"
  note: "Spanish settlers take possession of Curaçao, Aruba and Bonaire."
  owners:
    spanish-west-indies: [CUW-5151, ABW-5150, NL-BQ1]

- date: "1528"
  note: "Diego de Mazariegos founds Villa Real (San Cristóbal de las Casas) and completes the conquest of highland Chiapas."
  owners:
    new-spain: [MX-CHP]

- date: "1530"
  note: "Francisco de Montejo subdues the Chontal Maya of Tabasco."
  owners:
    new-spain: [MX-TAB]

- date: "1531"
  note: "Nuño de Guzmán conquers the west of Mexico, which becomes the kingdom of New Galicia, and founds Culiacán; north of the valley of Mexico the Otomí lord Conín, an ally of the Spaniards, founds Querétaro."
  owners:
    new-spain: [MX-JAL, MX-NAY, MX-SIN, MX-QUE]

- date: "1540"
  note: "Francisco de Montejo the Younger founds San Francisco de Campeche."
  owners:
    new-spain: [MX-CAM]

- date: "1542"
  note: "Montejo the Younger founds Mérida on the ruins of the Maya city of T’ho, and the Maya provinces of the north-west submit; a great Maya revolt in the east is crushed in 1546–1547. On the northern frontier San Miguel is founded in the lands of the Chichimecs."
  owners:
    new-spain: [MX-YUC, "MEX+99?", MX-GUA]

- date: "1543"
  note: "The campaign of the Pachecos takes Bacalar in the south-east of Yucatán, where Gaspar Pacheco founds the Spanish town of Salamanca de Bacalar in 1545; the forests of the interior stay largely outside Spanish control."
  owners:
    new-spain: [MX-ROO]

- date: "1546-09-08"
  note: "Silver is found at Zacatecas. The mining towns spread north into the lands of the Chichimecs, who fight the Spaniards from 1550 to about 1590."
  owners:
    new-spain: [MX-ZAC]

- date: "1563"
  note: "Francisco de Ibarra founds Durango as the capital of New Vizcaya."
  owners:
    new-spain: [MX-DUR]

- date: "1565-09-08"
  note: "Pedro Menéndez de Avilés founds St Augustine and destroys the French Huguenot colony of Fort Caroline: Spanish Florida."
