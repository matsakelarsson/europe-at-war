- date: "0900"
  note: "About 900 Chichen Itza becomes the leading power of northern Yucatán. In the southern lowlands most of the great Classic cities, among them Palenque and Calakmul, have been abandoned or are in decline."
  owners:
    chichen-itza: [MX-YUC, "MEX+99?"]

- date: "0950"
  note: "About 950 Tula, the capital of the Toltecs in Hidalgo, rises to dominate the north of central Mexico."
  owners:
    toltec-state: [MX-HID]

- date: "0950"
  note: "By about 950 Mixtec kingdoms such as Tilantongo dominate the Mixteca of western Oaxaca, while Zapotec kingdoms hold the valley of Oaxaca and the isthmus."
  owners:
    mixtec-kingdoms: [MX-OAX~mixteca]

- date: "1100"
  note: "By about 1100 Chichen Itza has declined as a regional power, and northern Yucatán is divided among smaller Maya cities."
  owners:
    maya-city-states: [MX-YUC, "MEX+99?"]

- date: "1150"
  note: "About 1150 Tula is sacked and abandoned, and the Toltec state breaks up. Over the next two centuries peoples from the north, among them the Mexica, move into the valley of Mexico."
  owners:
    none: [MX-HID]

- date: "1220"
  note: "From the 1220s Mayapan is the capital of a league that rules most of northern Yucatán."
  owners:
    mayapan: [MX-YUC, "MEX+99?"]

- date: "1350"
  note: "By about 1350 Tariácuri has united the towns around Lake Pátzcuaro: the Purépecha (Tarascan) state, which by 1450 rules most of Michoacán. In the highlands east of the valley of Mexico the Tlaxcaltecs found the towns that form the confederation of Tlaxcala."
  owners:
    tarascan-state: [MX-MIC]
    tlaxcala: [MX-TLA]

- date: "1370"
  note: "Under Tezozomoc (about 1370–1426) the Tepanec city of Azcapotzalco becomes the dominant power in the valley of Mexico, with the Mexica of Tenochtitlan among its tributaries and allies."
  owners:
    tepanec: [MX-DIF, MX-MEX]

- date: "1395"
  note: "About 1395 the Tepanecs and their allies conquer the Otomí kingdom of Xaltocan, in the north of the valley, and extend their rule into the Otomí lands around Tula; Metztitlán in the mountains beyond stays independent."
  owners:
    tepanec: [MX-HID]

- date: "1428"
  note: "Tenochtitlan, Texcoco and Tlacopan defeat Azcapotzalco and form the Triple Alliance, the Aztec Empire."
  owners:
    aztec-empire: [MX-DIF, MX-MEX, MX-HID]

- date: "1440"
  note: "By 1440 the Triple Alliance has conquered the Tlahuica of Morelos, around Cuauhnahuac (Cuernavaca)."
  owners:
    aztec-empire: [MX-MOR]

- date: "1441"
  note: "Mayapan is destroyed in a revolt, and northern Yucatán breaks up into about sixteen rival Maya provinces."
  owners:
    maya-provinces: [MX-YUC, "MEX+99?", MX-CAM, MX-ROO]

- date: "1458"
  note: "About 1458 Moctezuma I conquers Coixtlahuaca and brings much of the Mixteca under Aztec rule; the coastal Mixtec kingdom of Tututepec stays independent."
  owners:
    aztec-empire: [MX-OAX~mixteca]

- date: "1461"
  note: "The Triple Alliance conquers the Gulf coast around Cotaxtla and the Totonac towns of central Veracruz."
  owners:
    aztec-empire: [MX-VER]

- date: "1466"
  note: "Tepeaca and the south of Puebla fall to the Triple Alliance; Cholula and Huejotzingo, like Tlaxcala, stay independent."
  owners:
    aztec-empire: [MX-PUE]

- date: "1490"
  note: "By about 1490 the Triple Alliance rules most of Guerrero. Ahuitzotl’s armies reach the Pacific coast near Acapulco in the late 1490s, but the Yopi country stays independent."
  owners:
    aztec-empire: [MX-GRO]

- date: "1496"
  note: "The Spaniards found Santo Domingo, the first capital of their empire in the Americas, and subdue the Taíno chiefdoms of Hispaniola; the last, Jaragua and Higüey, are crushed in 1503–1504."
  owners:
    dominican-republic: [HT-ND, HT-NE, HT-NO, HT-AR, HT-CE, HT-OU, HT-SE, HT-SD, HT-GA, HT-NI, DO-01, DO-02, DO-03, DO-04, DO-05, DO-06, DO-07, DO-08, DO-09, DO-10, DO-11, DO-12, DO-13, DO-14, DO-15, DO-16, DO-17, DO-18, DO-19, DO-20, DO-21, DO-22, DO-23, DO-24, DO-25, DO-26, DO-27, DO-28, DO-29, DO-30, DO-31, DO-32]

- date: "1508-08"
  note: "Juan Ponce de León lands on Puerto Rico, founds Caparra and begins the conquest of the island."
  owners:
    puerto-rico: [US-PR]

- date: "1509"
  note: "Juan de Esquivel begins the Spanish settlement of Jamaica."
