# Poland, Lithuania and the eastern Baltic.
#
# Before 1772 these lands follow Sweden at War's events (sweden-at-war.yaml),
# corrected here. From 1772 the atoms of today's Poland, Lithuania, Latvia,
# Estonia, Belarus, Kaliningrad and right-bank Ukraine are curated
# (curated.yaml): keyframes do not apply, so every change must be listed here.
#
# Atoms split for these borders (splits/30-poland.geojson) are named after the
# line they follow: ~congress (Congress Poland, 1815), ~de1930 and ~pl1930 (the
# interwar borders), ~ru1772 (the First Partition), ~galicia, ~krakow, ~netze,
# ~danzig, ~eprussia, ~memel.

# ---- Before 1772: the Teutonic Order, Lithuania and Moscow
- date: "1230"
  note: Treaty of Kruszwica. Duke Konrad of Masovia grants Chełmno Land to the Teutonic Order as a base against the Prussians.
  owners:
    teutonic-order: [PL-KP!]
- date: "1252"
  note: The Livonian Order founds Memel castle (Klaipėda). The Memel land stays with the Order and its successors until 1920.
  owners:
    teutonic-order: [LT-KL~memel]
- date: "1308-11-13"
  note: The Teutonic Order seizes Danzig, and Pomerelia within a year. Brandenburg sells its claims at Soldin (1309); Poland recognises the loss at Kalisz (1343).
  owners:
    teutonic-order: [PL-PM!, PL-PM~danzig, PL-PM~de1930, PL-PM~eprussia]
- date: "1329"
  note: The Teutonic Order occupies Dobrzyń Land, and Kuyavia in 1332.
  owners:
    teutonic-order: [PL-KP~congress]
- date: "1343-07-08"
  note: Treaty of Kalisz. The Order returns Dobrzyń Land and Kuyavia to Poland and keeps Pomerelia and Chełmno Land.
  owners:
    poland: [PL-KP~congress]
- date: "1392"
  note: Duke Władysław of Opole pawns Dobrzyń Land to the Teutonic Order.
  owners:
    teutonic-order: [PL-KP~congress]
- date: "1404-05-22"
  note: Peace of Raciąż. Poland and Lithuania confirm the cession of Samogitia to the Teutonic Order (first agreed at Salynas in 1398); Poland buys back Dobrzyń Land.
  owners:
    teutonic-order: [LT-TE, LT-TA, LT-SA, LT-KL!]
    poland: [PL-KP~congress]
- date: "1411-02-01"
  note: First Peace of Thorn. After Grunwald, Samogitia returns to Lithuania for the lifetimes of Jogaila and Vytautas; the Treaty of Melno (1422) makes it permanent.
  owners:
    lithuania: [LT-TE, LT-TA, LT-SA, LT-KL!]
- date: "1466-10-19"
  note: Second Peace of Thorn. Royal Prussia (Pomerelia with Danzig, Chełmno Land, Marienburg and Warmia) passes to the Polish crown. The Teutonic Order keeps eastern Prussia as a Polish fief.
  owners:
    poland: [PL-PM!, PL-PM~danzig, PL-PM~de1930, PL-PM~eprussia, PL-KP!, PL-WN~warm]
- date: "1503-03-25"
  note: Truce of Moscow. Lithuania cedes Chernihiv–Siveria and the upper Oka lands, about a third of its territory, to Moscow.
  owners:
    russia: [UA-74, UA-59, RU-BRY, RU-KRS, RU-ORL, RU-KLU, BY-HO~ru1772]
- date: "1525-04-10"
  note: Prussian Homage. The last grand master in Prussia, Albert of Brandenburg, becomes the first Duke of Prussia, a Lutheran duchy under the Polish crown.
  owners:
    ducal-prussia: [RU-KGD, PL-WN!, PL-WN~pl1930, LT-KL~memel]
- date: "1537"
  note: Truce of Moscow. Lithuania recovers Homel.
  owners:
    lithuania: [BY-HO~ru1772]
- date: "1561-11-28"
  note: Union of Vilnius. The Livonian Order is dissolved; its last master, Gotthard Kettler, becomes Duke of Courland and Semigallia under the Grand Duchy of Lithuania.
  owners:
    courland: [LV-003, LV-004, LV-006, LV-010, LV-012, LV-013, LV-016, LV-018, LV-026, LV-027, LV-028, LV-029, LV-032, LV-034, LV-036, LV-038, LV-040, LV-043, LV-050, LV-051, LV-052, LV-062, LV-063, LV-065, LV-066, LV-068, LV-069, LV-071, LV-074, LV-079, LV-081, LV-083, LV-086, LV-087, LV-088, LV-093, LV-097, LV-098, LV-099, LV-100, LV-105, LV-107, LV-JEL, LV-JKB, LV-JUR, LV-LPX, LV-VEN, LV-DGV~cour, LVA-4849, LVA-4852, LVA-1085]
- date: "1563-02-15"
  note: Ivan IV takes Polotsk from Lithuania during the Livonian War.
  owners:
    russia: [BY-VI!]
- date: "1569-07-01"
  note: Union of Lublin. The Crown of Poland and the Grand Duchy of Lithuania become one Commonwealth; Podlasie, Volhynia, Bracław and Kyiv pass from the Grand Duchy to the Crown.
  owners:
    poland: [PL-PD, UA-07, UA-56, UA-18, UA-30, UA-32, UA-05, UA-71, UA-35, UA-53, UA-12]
- date: "1579-08-30"
  note: Stefan Báthory retakes Polotsk.
  owners:
    lithuania: [BY-VI!]
- date: "1618-08-27"
  note: Duke Albert Frederick dies, and Ducal Prussia passes to the electors of Brandenburg. It stays a Polish fief until the Treaty of Wehlau (1657).
  owners:
    prussia: [RU-KGD, PL-WN!, PL-WN~pl1930, LT-KL~memel]

- date: "1611-06-13"
  note: Sigismund III takes Smolensk after a siege of twenty months.
  owners:
    lithuania: [RU-SMO]
- date: "1618-12-11"
  note: Truce of Deulino. Moscow cedes Smolensk, Chernihiv and Siveria to the Commonwealth, which is now at its largest.
  owners:
    poland: [UA-74]
- date: "1649-08-18"
  note: Treaty of Zboriv. The king recognises Cossack self-rule in the Kyiv, Bracław and Chernihiv voivodeships, which Khmelnytsky's Hetmanate has held since 1648.
  owners:
    cossack-hetmanate: [UA-30, UA-32, UA-71, UA-05, UA-74, UA-53]
- date: "1672-10-18"
  note: Treaty of Buchach. Poland cedes Podolia to the Ottoman Empire; the right-bank Cossacks under Doroshenko accept the sultan's protection.
  owners:
    ottoman: [UA-68]
- date: "1699-01-26"
  note: Treaty of Karlowitz. The Ottomans return Podolia, and right-bank Ukraine comes back under Polish rule.
  owners:
    poland: [UA-68, UA-05, UA-32, UA-35, UA-71]

# ---- The Cossack Hetmanate
- date: "1764"
  note: Catherine II abolishes the office of hetman. The Hetmanate becomes the Little Russia Governorate of the Russian Empire; its last institutions go in 1781.
  owners:
    russia: [UA-30, UA-53, UA-74]

