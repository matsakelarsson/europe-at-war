# Rus', Muscovy and the steppe, 800–1800.
# Curated from 800: "Rus' and the steppe before 1236" and "Russia and the
# steppe" in curated.yaml, so keyframes do not apply and every change must be
# listed here. Belarus and right-bank Ukraine are curated by sweden-at-war.yaml
# from 1240 and poland-lithuania.yaml from 1772; the Karelian and Ingrian atoms
# by sweden-at-war.yaml from 1240. The Caucasus foothills are in caucasus.yaml.
# Tribal lands before the Rus' are shown as the peoples who lived there.
# The Rus' principalities stay on the map under Mongol rule; the Golden Horde
# and its successors hold the steppe and the Volga.

# ---- Kievan Rus' and the steppe peoples
- date: "800"
  note: About 800. East Slavic tribes live in the forests from the Bug to the upper Volga; the Khazar Khaganate rules the steppe from the Dnieper to beyond the Volga and takes tribute from the Slavs nearest to it. Volga Bulgaria is forming on the middle Volga, Byzantium holds Cherson in the Crimea, and Finnic, Permic and Ugric peoples live in the north and east.
  owners:
    slavic-tribes: [BY-BR, BY-HR, BY-MI, BY-HM, BY-VI, BY-MA, BY-HO, UA-07, UA-56, UA-46, UA-26, UA-61, UA-68, UA-05, UA-18, UA-30, UA-32, UA-71, UA-74, UA-59, UA-53, UA-35, UA-51!, RU-SMO, RU-BRY, RU-KLU, RU-ORL, RU-TUL, RU-KRS, RU-LIP, RU-MOS, RU-MOW, RU-TVE, RU-PSK!, RU-NGR, RU-LEN!]
    chuds: [RU-LEN~ingria, RU-SPE!, RU-PSK~ee1938, RU-PSK~lv1938]
    karelians: [RU-KR, RU-LEN~kex, RU-LEN~vib, RU-SPE~kex]
    veps: [RU-VLG]
    sami: [RU-MUR]
    finno-ugric-taiga-hunter-gatherers: [RU-ARK, RU-NEN, RU-SVE]
    permians: [RU-KO, RU-PER, RU-UD, RU-KIR]
    volga-finns: [RU-YAR, RU-IVA, RU-KOS, RU-VLA, RU-NIZ, RU-RYA, RU-ME]
    mordvinians: [RU-MO, RU-PNZ, RU-TAM]
    volga-bulgars: [RU-TA, RU-ULY, RU-SAM, RU-CU]
    bashkirs: [RU-BA, RU-CHE]
    khazars: [RU-AST, RU-KL, RU-VGG, RU-SAR, RU-ROS, RU-VOR, RU-BEL, RU-STA, RU-KDA, UA-63, UA-09, UA-14, UA-23, UA-65, UA-43, UA-12, UA-48, KZ-ATY]
    byzantium: [UA-40]
    pechenegs: [KZ-ZAP, RU-ORE]
    oghuz-turks: [KZ-MAN, KZ-AKT]
    kimek-kipchak-khaganate: [KZ-KUS]
- date: "830"
  note: About 830. The Magyars move west into Etelköz, the steppe between the Dnieper and the lower Danube, still under Khazar overlordship.
  owners:
    hungary: [UA-12, UA-48, UA-35, UA-51!]
- date: "862"
  note: "The date the Primary Chronicle gives for the call to Rurik: Scandinavian Rus’ princes rule Novgorod, Ladoga and Izborsk, with Beloozero and Rostov."
  owners:
    kievan-rus: [RU-NGR, RU-LEN!, RU-PSK!, RU-VLG, RU-YAR]
- date: "882"
  note: Oleg of Novgorod takes Kiev and makes it his capital, with Smolensk on the way. By 885 the Drevlians have submitted, and the Severians and Radimichs pay tribute to him instead of the Khazars.
  owners:
    kievan-rus: [RU-SMO, RU-TVE, UA-30, UA-32, UA-71, UA-18, UA-74, UA-59, UA-53, RU-BRY, RU-KRS, BY-HO, BY-MA]
- date: "893"
  note: About 893. The Oghuz and the Khazars drive the Pechenegs west across the Volga; the Oghuz take the steppe between the Volga and the Ural River.
  owners:
    oghuz-turks: [KZ-ZAP, KZ-ATY, RU-ORE]
- date: "895"
  note: The Pechenegs, allied with Bulgaria, attack the Magyars, who leave Etelköz and cross the Carpathians. The Pechenegs hold the steppe from the Don to the Danube.
  owners:
    pechenegs: [UA-12, UA-48, UA-35, UA-51!, UA-65, UA-23, UA-14]
- date: "965"
  note: Sviatoslav of Kiev subdues the Vyatichi of the upper Oka (964–966), the last East Slavic tribe paying tribute to the Khazars.
  owners:
    kievan-rus: [RU-KLU, RU-ORL, RU-TUL, RU-MOS, RU-MOW, RU-LIP]
- date: "969"
  note: Sviatoslav of Kiev destroys the Khazar Khaganate (965–969). The Pechenegs take over the steppe west of the Volga, the Oghuz the lower Volga, and Alania the plains north of the Caucasus.
  owners:
    pechenegs: [RU-BEL, RU-VOR, RU-ROS, RU-VGG, RU-SAR, RU-KDA, UA-09, UA-63, UA-43]
    oghuz-turks: [RU-AST, RU-KL]
    alans: [RU-STA]
- date: "980"
  note: Vladimir of Novgorod takes Polotsk, killing its prince Rogvolod, and then Kiev.
  owners:
    kievan-rus: [BY-VI, BY-MI, BY-HM]
- date: "988"
  note: Vladimir, baptised this year, sends his sons to rule Rostov and Murom; the lands of the Finnic Merya and Muroma on the upper Volga and the Oka are part of Rus’.
  owners:
    kievan-rus: [RU-VLA, RU-IVA, RU-KOS, RU-RYA]
- date: "993"
  note: "Vladimir has taken the Cherven towns (981), fought the Yatvingians (983) and the Croats (992–993): Volhynia, Red Ruthenia and the Bug and Neman lands are part of Rus’."
  owners:
    kievan-rus: [UA-07, UA-56, UA-46, UA-26, UA-61, UA-68, UA-05, BY-BR, BY-HR]
- date: "1001"
  note: Bryachislav succeeds his father Iziaslav, whom Vladimir had made prince of Polotsk; from now on Polotsk is ruled by its own line of princes.
  owners:
    principality-of-polotsk: [BY-VI, BY-MI, BY-HM]
- date: "1061"
  note: The Cumans (Polovtsians), who have driven the Torks and the Pechenegs west, raid Rus’ for the first time. They hold the steppe from the Danube to beyond the Volga.
  owners:
    cuman-kipchak-confederation: [UA-12, UA-48, UA-35, UA-51!, UA-65, UA-23, UA-14, RU-BEL, RU-VOR, RU-ROS, RU-VGG, RU-SAR, RU-KDA, RU-STA, UA-09, UA-63, UA-43, RU-AST, RU-KL, KZ-ZAP, KZ-ATY, KZ-AKT, KZ-KUS, RU-ORE]

# ---- The break-up of Kievan Rus'
- date: "1132-04-15"
  note: Mstislav the Great dies, and Kievan Rus' breaks up into rival principalities under branches of the Rurikid dynasty; Novgorod becomes a republic in 1136.
  owners:
    novgorod: [RU-NGR, RU-LEN, RU-SPE, RU-KR, RU-ARK, RU-PSK]
    russia: [RU-VLA, RU-IVA, RU-YAR, RU-KOS, RU-VLG, RU-MOS, RU-MOW, RU-TVE]
    chernigov: [UA-74, RU-BRY, RU-ORL, RU-KLU, RU-KRS, BY-HO, UA-59]
    ryazan: [RU-RYA, RU-LIP, RU-TUL]
    smolensk: [RU-SMO, BY-MA]
    principality-of-polotsk: [BY-VI, BY-MI, BY-HM]
    galicia-volhynia: [BY-BR, BY-HR, UA-07, UA-26, UA-46, UA-56, UA-61, UA-68, UA-77]
- date: "1204"
  note: After the crusaders take Constantinople, Cherson and Crimean Gothia pass to the Empire of Trebizond.
  owners:
    trebizond: [UA-40]
- date: "1221"
  note: Grand Prince Yuri II of Vladimir founds Nizhny Novgorod where the Oka meets the Volga.
  owners:
    russia: [RU-NIZ]

# ---- The Mongol conquest and the Golden Horde
- date: "1236"
  note: The Mongols conquer Volga Bulgaria and destroy its cities.
  owners:
    mongol-empire: [RU-TA, RU-CU, RU-ME, RU-UD, RU-ULY, RU-SAM, RU-PNZ, RU-MO, RU-BA, RU-ORE, RU-CHE]
- date: "1239"
  note: Batu's armies defeat the Cumans and take the steppe from the Dniester to the Volga.
  owners:
    mongol-empire: [UA-12, UA-09, UA-14, UA-23, UA-63, UA-65, UA-48, UA-51!, UA-43, UA-40, RU-BEL, RU-VOR, RU-ROS, RU-VGG, RU-AST, RU-KL, RU-STA, RU-KDA, RU-SAR, RU-TAM]
- date: "1242"
  note: Batu founds his capital at Sarai on the lower Volga. The western part of the Mongol Empire becomes the Golden Horde (the Ulus of Jochi), and the Rus' princes rule as its tributaries.
  owners:
    golden-horde: [RU-SE, RU-KB, RU-CE, RU-IN, RU-KC, KZ-ZAP, KZ-ATY, KZ-AKT, KZ-MAN, KZ-KUS, UA-51~ro1938, UA-12, RU-TA, RU-CU, RU-ME, RU-UD, RU-ULY, RU-SAM, RU-PNZ, RU-MO, RU-BA, RU-ORE, RU-CHE, UA-09, UA-14, UA-23, UA-63, UA-65, UA-48, UA-51!, UA-43, UA-40, RU-BEL, RU-VOR, RU-ROS, RU-VGG, RU-AST, RU-KL, RU-STA, RU-KDA, RU-SAR, RU-TAM]
- date: "1247"
  note: Tver becomes a principality of its own under Yaroslav Yaroslavich, Alexander Nevsky's brother.
  owners:
    tver: [RU-TVE]
- date: "1348"
  note: Treaty of Bolotovo. Novgorod recognises the independence of Pskov.
  owners:
    pskov: [RU-PSK]
- date: "1356"
  note: Algirdas of Lithuania takes Bryansk.
  owners:
    lithuania: [RU-BRY]
- date: "1362"
  note: After the Battle of Blue Waters, Lithuania takes Kiev and the Seversk lands; the Upper Oka princes become Lithuanian vassals.
  owners:
    lithuania: [RU-KRS, UA-59, RU-ORL, RU-KLU]
- date: "1399"
  note: Under Vytautas the Grand Duchy of Lithuania reaches the Black Sea between the Dniester and the Dnieper.
  owners:
    lithuania: [UA-48, UA-51!]

# ---- The Horde breaks up
- date: "1438"
  note: Ulugh Muhammad founds the Khanate of Kazan on the middle Volga.
  owners:
    kazan-khanate: [RU-TA, RU-CU, RU-ME, RU-UD, RU-ULY]
- date: "1440"
  note: The Nogai Horde breaks away east of the Volga.
  owners:
    nogai-horde: [RU-ORE, RU-BA, RU-CHE, KZ-ZAP, KZ-ATY, KZ-AKT, KZ-MAN, KZ-KUS]
- date: "1441"
  note: Hacı I Giray founds the Crimean Khanate.
  owners:
    crimean-khanate: [UA-43, UA-40, UA-65, UA-23]
- date: "1466"
  note: The Khanate of Astrakhan breaks away; what is left of the Golden Horde is called the Great Horde.
  owners:
    astrakhan-khanate: [RU-AST, RU-KL]
    great-horde: [RU-VGG, RU-ROS, RU-SAR, RU-SAM, RU-VOR, RU-BEL, RU-STA, RU-KDA, RU-PNZ, RU-TAM, RU-MO, UA-09, UA-14, UA-63]
- date: "1468"
  note: Beyond the Urals the Khanate of Sibir takes shape under the Taibugid and Shaybanid dynasties; on the steppe east of the Nogais the Kazakh Khanate has formed (about 1465).
  owners:
    khanate-of-sibir: [RU-TYU, RU-KGN, KZ-SEV, RU-OMS]
    quazaq-khanate: [KZ-AKM, KZ-AST, KZ-PAV]
- date: "1475"
  note: The Ottomans take Kaffa and the principality of Theodoro (Mangup); the Crimean Khanate becomes an Ottoman vassal.
  owners:
    ottoman: [UA-40]
- date: "1492"
  note: Mengli I Giray of Crimea builds the fortress of Ochakov; Lithuania loses the Black Sea steppe (Ochakov is Ottoman from 1526).
  owners:
    ottoman: [UA-48, UA-51!]

# ---- The gathering of the Russian lands
- date: "1472"
  note: Ivan III conquers Great Perm.
  owners:
    russia: [RU-PER, RU-KO]
- date: "1478-01-15"
  note: Ivan III annexes the Novgorod Republic and its northern lands.
  owners:
    russia: [RU-KR~kex, RU-KR~ingria, RU-LEN~kex, RU-LEN~ingria, RU-SPE~kex, RU-NGR, RU-LEN!, RU-SPE!, RU-KR!, RU-KR~fi1938, RU-ARK, RU-MUR, RU-NEN]
- date: "1485-09-12"
  note: Ivan III takes Tver.
  owners:
    russia: [RU-TVE]
- date: "1489"
  note: Moscow annexes Vyatka.
  owners:
    russia: [RU-KIR]
- date: "1494-02-05"
  note: Peace with Lithuania. Moscow keeps Vyazma and the Upper Oka principalities that have changed sides.
  owners:
    russia: [RU-KLU]
- date: "1502-06"
  note: Mengli I Giray of Crimea sacks Sarai, and the Great Horde comes to an end. The steppe north of the Black Sea becomes the Crimean Khanate's; the Nogais hold the lands east of the Don.
  owners:
    crimean-khanate: [UA-09, UA-14, UA-63, RU-BEL, RU-VOR, RU-ROS, RU-KDA, RU-STA, RU-TAM]
    nogai-horde: [RU-SAM, RU-SAR, RU-VGG]
    russia: [RU-MO, RU-PNZ]
- date: "1503"
  note: Tula and the lands of Princess Agrippina of Ryazan pass to Moscow.
  owners:
    russia: [RU-TUL]
- date: "1510-01-24"
  note: Vasily III ends the independence of Pskov.
  owners:
    russia: [RU-PSK]
- date: "1521"
  note: Vasily III annexes the Principality of Ryazan.
  owners:
    russia: [RU-RYA, RU-LIP]
- date: "1514-07-31"
  note: Vasily III takes Smolensk from Lithuania.
  owners:
    russia: [RU-SMO]
- date: "1552-10-02"
  note: Ivan IV takes Kazan; the khanate is annexed.
  owners:
    russia: [RU-TA, RU-CU, RU-ME, RU-UD, RU-ULY]
- date: "1556"
  note: Russia annexes the Khanate of Astrakhan; the whole Volga is Russian.
  owners:
    russia: [RU-AST, RU-KL]
- date: "1557"
  note: Most Bashkir tribes accept the tsar's rule.
  owners:
    russia: [RU-BA, RU-CHE]
- date: "1570"
  note: Ivan IV takes the Don Cossacks into his service. Their lands are shown with Russia from here, though the Host governed itself, and Azov at the mouth of the Don stayed Ottoman until 1696.
  owners:
    russia: [RU-ROS]
- date: "1585"
  note: The fortress of Voronezh is founded on the steppe frontier.
  owners:
    russia: [RU-VOR]
- date: "1586"
  note: Samara is founded; the Volga route to Astrakhan is secured with forts (Tsaritsyn 1589, Saratov 1590).
  owners:
    russia: [RU-SAM, RU-SAR, RU-VGG]
- date: "1596"
  note: Belgorod is founded, and the frontier line moves south into the Wild Fields.
  owners:
    russia: [RU-BEL]
- date: "1598"
  note: Verkhoturye is founded on the road across the Urals into Siberia.
  owners:
    russia: [RU-SVE]

# ---- The seventeenth and eighteenth centuries
- date: "1632"
  note: Kalmyk Oirats arrive on the lower Volga and drive the Nogais west; the Kalmyk Khanate accepts Russian suzerainty in 1655.
  owners:
    kalmyk-khanate: [RU-KL, RU-ORE]
- date: "1636"
  note: Tambov is founded as part of the Belgorod defensive line.
  owners:
    russia: [RU-TAM]
- date: "1654"
  note: Kharkiv is founded by Cossack settlers in Sloboda Ukraine under the tsar.
  owners:
    russia: [UA-63, UA-09]
- date: "1735"
  note: The Orenburg expedition builds forts on the Ural River (Orenburg 1743).
  owners:
    russia: [RU-ORE]
- date: "1771"
  note: Most of the Kalmyks leave for Dzungaria, and Catherine II abolishes the Kalmyk Khanate.
  owners:
    russia: [RU-KL]
- date: "1774-07-21"
  note: Treaty of Küçük Kaynarca. Russia gains the steppe north of the Sea of Azov, Azov itself, Kerch and Kinburn, and Kabarda in the northern Caucasus (North Ossetia accepts Russian rule the same year); the Crimean Khanate becomes independent of the Ottomans.
  owners:
    russia: [UA-14, RU-KB, RU-SE]
    crimean-khanate: [UA-40]
- date: "1775-06-15"
  note: Russian troops destroy the Zaporozhian Sich; its lands become part of New Russia.
  owners:
    russia: [UA-12]
- date: "1783-04-19"
  note: Catherine II annexes the Crimean Khanate, with its lands north of the Crimea and on the Kuban.
  owners:
    russia: [UA-43, UA-40, UA-65, UA-23, RU-KDA, RU-STA]
- date: "1792-01-09"
  note: Treaty of Jassy. The Ottomans cede Ochakov and the land between the Southern Bug and the Dniester.
  owners:
    russia: [UA-48, UA-51!, MDA-1638]
