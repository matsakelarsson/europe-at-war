- date: "1287"
  note: "A Mongol invasion from Yunnan and the murder of King Narathihapate break up the Pagan Empire. Wareru, a Mon, makes himself king at Martaban, founding the kingdom later called Hanthawaddy; the Shan chiefs of the hills go their own way, and the Tenasserim coast south of Tavoy passes to Sukhothai. Pagan survives as a small kingdom until 1297, when its king Kyawswa submits to the Mongols and is deposed."
