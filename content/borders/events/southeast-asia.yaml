- date: "0929"
  note: "Mpu Sindok moves the court of Mataram (Medang) from Central Java to the Brantas valley in East Java, perhaps after an eruption of Merapi; East Java becomes the centre of the kingdom."
  owners:
    medang: [ID-JI!, ID-JI~madura]

- date: "0939"
  note: "Ngô Quyền, victor over the Southern Han fleet at the Bạch Đằng River in 938, proclaims himself king at Cổ Loa: the Red River delta becomes an independent kingdom. Đinh Bộ Lĩnh reunites it in 968 after the wars of the twelve warlords and names it Đại Cồ Việt."
