# Written for wave 11; edit directly.

- date: "800"
  note: "About 800. In Burma the Pyu city-states (Sri Ksetra near Prome, Halin) hold the dry zone and the Mon city-states of Thaton and Pegu the coast; Arakan is a kingdom of its own (Waithali). In Thailand the Mon city-states of Dvaravati hold the Chao Phraya plain and Hariphunchai (Lamphun) the north. The Khmer lands of Chenla, divided at this time, stretch from southern Laos and the Khorat plateau over Cambodia to the Mekong delta. The Tang protectorate of Annan rules the Red River delta down to Hà Tĩnh, and Champa the coast to the south. Srivijaya, from Palembang, rules southern Sumatra and the Strait of Malacca with the Malay peninsula; the Sailendra and Sanjaya kings of Mataram (Medang) rule Central Java, and the kingdom of Sunda West Java. Bali has kings of its own. The rest of the islands — northern Sumatra, Borneo, Sulawesi, the Moluccas, the Philippines, Timor and New Guinea — are the land of smaller polities and peoples outside these kingdoms. The northern hills of Burma, Laos and Vietnam are outside any state."
