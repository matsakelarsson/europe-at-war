- date: "0849"
  note: "Pagan is founded on the Irrawaddy, by the traditional date, after Nanzhao’s raids of the 830s have broken the Pyu cities."
  owners:
    pagan: [MM-04]

- date: "0905"
  note: "Khúc Thừa Dụ, a local leader, takes over the Tang circuit of Tĩnh Hải (Jinghai) in the Red River delta as the Tang dynasty breaks up, and rules it in its name."
