# Turkey, 1920–1939. A first pass until the Ottoman and Balkan wave. The 1920,
# 1930 and 1938 keyframes were drafted from the Treaty of Sèvres map, which
# never took effect, and have been corrected. The base map shows the Ankara
# government's Turkey, the Sultan's government in the Allied-occupied Straits
# zone, and the Greek, Italian and French zones; the fronts of the
# Greco-Turkish War belong in the war's steps. Kars, Ardahan and Artvin are in
# caucasus.yaml.

- date: "1920-04-23"
  note: The Grand National Assembly meets in Ankara. Its nationalist government, led by Mustafa Kemal, rules Anatolia outside the Allied zones; the Sultan's government in occupied Constantinople keeps only the Straits.
  owners:
    turkey: [TR-02, TR-03, TR-04, TR-05, TR-06, TR-09, TR-10, TR-11, TR-12, TR-13, TR-14, TR-15, TR-16, TR-18, TR-19, TR-20, TR-21, TR-23, TR-24, TR-25, TR-26, TR-28, TR-29, TR-30, TR-32, TR-33, TR-37, TR-38, TR-40, TR-42, TR-43, TR-44, TR-47, TR-49, TR-50, TR-51, TR-52, TR-53, TR-54, TR-55, TR-56, TR-57, TR-58, TR-60, TR-61, TR-62, TR-64, TR-65, TR-66, TR-67, TR-68, TR-69, TR-70, TR-71, TR-72, TR-73, TR-74, TR-78, TR-81]
- date: "1921-10-20"
  note: Treaty of Ankara. France ends the Franco-Turkish War, withdraws from Cilicia (by January 1922) and accepts a border that leaves Alexandretta with Syria.
  owners:
    turkey: [TR-01, TR-27, TR-46, TR-63, TR-79, TR-80]
- date: "1922-09-09"
  note: Turkish forces enter Smyrna (İzmir) after routing the Greek army; the city burns in the following days.
  owners:
    turkey: [TR-35, TR-45]
- date: "1922-10-11"
  note: Armistice of Mudanya. Greece agrees to leave Eastern Thrace. Italy has begun withdrawing its troops from the Antalya region.
  owners:
    turkey: [TR-22, TR-39, TR-07, TR-48]

- date: "1923-10-29"
  note: After the Treaty of Lausanne (24 July 1923) the Grand National Assembly proclaims the Republic of Turkey. Hatay stays with French Syria until 1939.
  owners:
    turkey: [TR-01, TR-02, TR-03, TR-04, TR-05, TR-06, TR-07, TR-09, TR-10, TR-11, TR-12, TR-13, TR-14, TR-15, TR-16, TR-17, TR-18, TR-19, TR-20, TR-21, TR-22, TR-23, TR-24, TR-25, TR-26, TR-27, TR-28, TR-29, TR-30, TR-32, TR-33, TR-34, TR-35, TR-37, TR-38, TR-39, TR-40, TR-41, TR-42, TR-43, TR-44, TR-45, TR-46, TR-47, TR-48, TR-49, TR-50, TR-51, TR-52, TR-53, TR-54, TR-55, TR-56, TR-57, TR-58, TR-59, TR-60, TR-61, TR-62, TR-63, TR-64, TR-65, TR-66, TR-67, TR-68, TR-69, TR-70, TR-71, TR-72, TR-73, TR-74, TR-77, TR-78, TR-79, TR-80, TR-81]
