# German and Romanian occupation of Soviet territory, 1941–1945, region by region
# at a few dates. Approximate: an atom counts as occupied when most of it was.
# Front lines on other dates are drawn in the war steps. Finland is in finland.yaml,
# Bessarabia and Northern Bukovina in bessarabia.yaml, Galicia and Białystok in
# poland-lithuania.yaml. The polities are those of the German civil
# administrations (Reichskommissariats) and the military zone behind the front.

