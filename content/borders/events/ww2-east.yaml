- date: "1942-11-18"
  note: The eve of the Soviet counter-offensive at Stalingrad. After the summer offensive Germany holds the Donbas, the lower Don, the Kuban and the northern Caucasus foothills; Sevastopol fell in July. Kaluga was retaken in the winter.
  owners:
    german-occupied-ussr: [UA-09, UA-40, RU-ROS, RU-KDA, RU-STA, RU-KC, RU-KB, RU-AD, RU-KL]
    ussr: [RU-KLU]
- date: "1943-12-31"
  note: After Stalingrad, Kursk and the battles for the Dnieper, the Red Army has retaken the northern Caucasus, eastern Ukraine with Kyiv, and Smolensk.
