- date: "1941-12-05"
  note: The furthest German advance before the Soviet counter-offensive at Moscow. Estonia, eastern Belarus, most of Ukraine and the Crimea except Sevastopol are occupied; Leningrad is besieged. Romania administers the land between the Dniester and the Southern Bug as “Transnistria”.
