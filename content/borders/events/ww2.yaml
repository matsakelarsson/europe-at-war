# Border changes of the Second World War outside the Soviet Union and Poland
# (wave 6). The base map shows borders recognised at the time, by treaty or in
# practice; occupations are areas in the war files. Exceptions drawn here:
# - German annexations in the west: Eupen-Malmedy (1940), Alsace and Moselle
#   (1940, de facto) and Luxembourg (1942), until the liberation.
# - The partition of Yugoslavia (1941–1945): the Independent State of Croatia
#   (`ndh`), the German, Italian, Hungarian, Bulgarian and Albanian annexations,
#   German-occupied Serbia (`serbia`) and Italian-occupied Montenegro
#   (`montenegro`), with each region returning to `yugoslavia` on the date it
#   was liberated. Lines follow atoms (Slovene and Macedonian municipalities,
#   Croatian counties, Kosovo districts), so they are approximate.
# - The Bulgarian annexation of eastern Macedonia and western Thrace (1941–1944).
# Prewar Italian territory, Ljubljana and Italy itself stay `italy` after the
# armistice of 1943; the German operational zones and the Italian Social
# Republic are areas.
- date: "1940-05-18"
  note: "Germany annexes Eupen, Malmedy and Sankt Vith, which Belgium had received at Versailles."
  owners:
    germany: [BE-WLG~eupen]
- date: "1940-08-02"
  note: "After the armistice Germany puts Alsace and Moselle under Gauleiters of the neighbouring German provinces: a de facto annexation that France never recognised."
  owners:
