# Flip-flops the build has flagged (an atom going A → B → A within 60 years,
# where one side of the change is a drafted keyframe) that have been checked
# and are real history. Each entry silences the warning for those atoms at the
# date of the middle change.
#
#   atoms   atom ids
#   at      date of the B assignment, as written in the event or keyframe
#   note    why it is right (and anything still to refine)

- atoms: [PL-MA, PL-PK, PL-KP, PL-WP]
  at: "1807"
  note: >-
    Duchy of Warsaw, 1807–1815; in 1815 Posen went back to Prussia and Galicia
    to Austria. Migrated from Sweden at War, which shows the 1809 borders from
    1807 (West Galicia and Kraków only joined in 1809); refine in the Poland pilot.
- atoms: [PL-LU]
  at: "1200"
  note: >-
    The Lublin land was fought over by Poland and Galicia–Volhynia in the 13th
    century; historical-basemaps puts it under Galicia–Volhynia in 1200.
- at: "1938"
  note: Georgia and Azerbaijan, independent 1918–1921 and Soviet until 1991. Real changes; the drafts have no snapshot between 1920 and 1938, so the Soviet takeover shows up as 1938.
  atoms: [AZ-ABS, AZ-AGA, AZ-AGC, AZ-AGM, AZ-AGS, AZ-AGU, AZ-AST, AZ-BA, AZ-BAB, AZ-BAL, AZ-BAR, AZ-BEY, AZ-BIL, AZ-CAB, AZ-CAL, AZ-CUL, AZ-DAS, AZ-FUZ, AZ-GA, AZ-GAD, AZ-GOR, AZ-GOY, AZ-GYG, AZ-HAC, AZ-IMI, AZ-ISM, AZ-KAL, AZ-KAN, AZ-KUR, AZ-LA, AZ-LAN, AZ-LER, AZ-MAS, AZ-MI, AZ-NEF, AZ-NX, AZ-OGU, AZ-ORD, AZ-QAB, AZ-QAX, AZ-QAZ, AZ-QBA, AZ-QBI, AZ-QOB, AZ-QUS, AZ-SA, AZ-SAB, AZ-SAD, AZ-SAH, AZ-SAL, AZ-SAR, AZ-SAT, AZ-SBN, AZ-SIY, AZ-SKR, AZ-SM, AZ-SMI, AZ-SMX, AZ-SR, AZ-SUS, AZ-TAR, AZ-TOV, AZ-UCA, AZ-XA, AZ-XAC, AZ-XCI, AZ-XIZ, AZ-XVD, AZ-YAR, AZ-YEV, AZ-ZAQ, AZ-ZAR, AZE-5562, AZE-5564, AZE-5566, GE-AB, GE-AJ, GE-GU, GE-IM, GE-KA, GE-KK, GE-MM, GE-RL, GE-SJ, GE-SK, GE-SZ, GE-TB]
