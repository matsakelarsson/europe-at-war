# Flip-flops the build has flagged (an atom going A → B → A within 60 years,
# where one side of the change is a drafted keyframe) that have been checked
# and are real history. Each entry silences the warning for those atoms at the
# date of the middle change.
#
#   atoms   atom ids
#   at      date of the B assignment, as written in the event or keyframe
#   note    why it is right (and anything still to refine)

- atoms: [PL-MA, PL-PK, PL-KP, PL-WP]
  at: "1807"
  note: >-
    Duchy of Warsaw, 1807–1815; in 1815 Posen went back to Prussia and Galicia
    to Austria. Migrated from Sweden at War, which shows the 1809 borders from
    1807 (West Galicia and Kraków only joined in 1809); refine in the Poland pilot.
- atoms: [PL-LU]
  at: "1200"
  note: >-
    The Lublin land was fought over by Poland and Galicia–Volhynia in the 13th
    century; historical-basemaps puts it under Galicia–Volhynia in 1200.
- atoms: [AL-01, AL-04, AL-05, AL-06, AL-12, GR-C, MK-03, MK-04, MK-05, MK-07, MK-10, MK-11, MK-13, MK-14, MK-18, MK-20, MK-23, MK-24, MK-26, MK-33, MK-36, MK-37, MK-41, MK-49, MK-53, MK-54, MK-55, MK-56, MK-60, MK-62, MK-64, MK-67, MK-73, MK-80, MK-81, MK-83]
  at: "1000"
  note: >-
    Tsar Samuel's Bulgaria (976–1018) took Macedonia, Albania and the lands
    around Lake Prespa and Ohrid from Byzantium; Basil II reconquered them by
    1018 (balkans.yaml). The Balkans are still drafts until the Ottoman wave.
- atoms: [PL-MA, PL-PK, PL-SL~polLes, PL-MA~galicia, PL-SL~austria]
  at: "0900"
  note: >-
    Great Moravia held the land of the Vistulans (Kraków) from about 880 until
    its fall (about 906); before and after it the drafts show Slavic tribes.
    Flagged once "Slavonic tribes" and "Slavic tribes" became one polity.
