borderSources:
  "historical-basemaps world_800 (automatic draft, partly hand-corrected)": "historical-basemaps world_800 (ébauche automatique partiellement corrigée à la main)"
  "About 800. Byzantium holds Anatolia west of the Taurus and Anti-Taurus. The Abbasid caliphate holds Cilicia and the fortified frontier zone (the thughur) from Tarsus to Melitene, Upper Mesopotamia, and Armenia, ruled by Armenian princes as an Arab province.": "Environ 800. Byzance tient Anatolie à l’ouest du Taureau et Anti-Taurus. Le califat abbasside tient Cilicie et la zone frontalière fortifiée (le houghour) de Tarse à Melitène, Haute Mésopotamie et Arménie, gouverné par les princes arméniens comme une province arabe."
  "About 800. Byzantium holds Greece, Thrace and the coasts, with loose claims over the Slavs of Macedonia and the interior. Bulgaria rules the lower Danube on both banks. Charlemagne’s Franks have broken the Avar Khaganate (791–796) and hold Pannonia, Carantania and Istria; the Croats of Dalmatia and the Serbs of Raška are ruled by their own princes.": "Environ 800. Byzance détient la Grèce, Thrace et les côtes, avec des revendications lâches sur les Slaves de Macédoine et l’intérieur. La Bulgarie règle le Danube inférieur sur les deux rives. Charlemagne-Les Francs ont brisé l’Avar Khaganate (791-796) et tiennent Pannonie, Carantanie et Istrie ; les Croates de Dalmatie et les Serbes de Raška sont gouvernés par leurs propres princes."
  "About 800. Mercia under Coenwulf dominates southern England, including Kent, Sussex, Surrey, London and East Anglia; Essex keeps its own kings under Mercian overlordship. Wessex holds the south-west as far as the Tamar, Northumbria stretches from the Humber to the Forth and Galloway, the Picts hold the north and east of Scotland, Dál Riata holds Argyll, and the Britons hold Strathclyde, Wales and Cornwall. Ireland is divided among many Gaelic kingdoms.": "Environ 800. La mercerie sous Coenwulf domine le sud de l’Angleterre, y compris Kent, Sussex, Surrey, Londres et East Anglia ; Essex garde ses propres rois sous la domination des Merciens. Wessex détient le sud-ouest jusqu’au Tamar, Northumbria s’étend du Humber au Forth et Galloway, les Picts tiennent le nord et l’est de l’Écosse, Dál Riata tient Argyll, et les Britanniques tiennent Strathclyde, Pays de Galles et Cornwall. L’Irlande est divisée entre de nombreux royaumes gaéliques."
  "About 800. The Emirate of Córdoba rules most of the peninsula. The Kingdom of Asturias holds the north coast from Galicia to the Basque lands and the upper Ebro; the Frankish March of Spain holds Girona, Urgell and Aragon; the Balearics are still nominally Byzantine; the Duero valley is a thinly settled frontier.": "Environ 800. L’Émirat de Cordoue domine la majeure partie de la péninsule. Le Royaume des Asturies tient la côte nord de Galice aux terres basques et à l’Èbre supérieure ; la Marche franquiste d’Espagne tient Girona, Urgell et Aragon ; les Baléares sont toujours nominalement byzantins ; la vallée du Duero est une frontière peu peuplée."
  "About 800. Charlemagne, crowned emperor in Rome this Christmas, rules the Lombard kingdom of Italy with the Duchy of Spoleto. The pope holds Rome, the old Exarchate of Ravenna and the Pentapolis; the Lombard Duchy of Benevento holds the south; Byzantium keeps Sicily, Sardinia, Calabria, Otranto and Gaeta, and Naples and Venice are Byzantine duchies that go their own way.": "Vers 800. Charlemagne, couronné empereur à Rome ce Noël, gouverne le royaume lombard d’Italie avec le duché de Spoleto. Le pape tient Rome, l’ancien exarchat de Ravenne et la Pentapolis ; le duché lombard de Bénévent tient le sud ; Byzance garde Sicile, Sardaigne, Calabre, Otranto et Gaeta, et Naples et Venise sont des duches byzantines qui vont leur propre chemin."
  "About 800. Syria, Palestine and Egypt are provinces of the Abbasid caliphate, ruled from Baghdad.": "La Syrie, la Palestine et l’Égypte sont des provinces du califat abbasside, gouvernées de Bagdad."
  "Louis the Pious takes Barcelona after a long siege; it becomes the seat of a Frankish county.": "Louis le Pieux prend Barcelone après un long siège ; il devient le siège d’un comté de Frankish."
  "About 805. Khan Krum of Bulgaria destroys what is left of the Avar Khaganate east of the Danube; the Great Hungarian Plain, the Banat and Transylvania come under loose Bulgarian rule.": "Environ 805. Khan Krum de Bulgarie détruit ce qui reste de l’Avar Khaganate à l’est du Danube ; la Grande plaine hongroise, le Banat et la Transylvanie sont soumis à un régime bulgare lâche."
  "Pamplona and the western Pyrenees accept Frankish overlordship.": "Pampelune et les Pyrénées occidentales acceptent l’hégémonie franque."
  "Krum takes Serdica (Sofia) in the spring of 809 and opens the way into the upper Struma valley.": "Krum prend Serdica (Sofia) au printemps de 809 et ouvre le chemin dans la haute vallée de Struma."
  "Thirty years’ peace between Khan Omurtag and Emperor Leo V. The border follows the Erkesia earthwork from Develtos on the Gulf of Burgas to the Maritsa; northern Thrace with Stara Zagora, Sliven and Yambol is Bulgarian.": "Trente ans de paix entre Khan Omurtag et l’empereur Leo V. La frontière suit les travaux de terre Erkesia de Develtos sur le golfe de Burgas à la Maritsa ; le nord de Thrace avec Stara Zagora, Sliven et Yambol est bulgare."
  "Second battle of Roncevaux. The Basques of Pamplona, allied with the Banu Qasi, defeat a Frankish army; Íñigo Arista rules Pamplona as an independent king, and the county of Aragon falls into its orbit.": "Deuxième bataille de Roncevaux. Les Basques de Pampelune, alliés du Banu Qasi, défont une armée francaise ; Íñigo Arista règne sur Pampelune en tant que roi indépendant, et le comté d’Aragon tombe sur son orbite."
  "Battle of Ellendun. Egbert of Wessex defeats Mercia and takes Kent, Sussex, Surrey and Essex.": "Bataille d’Ellendun. Egbert du Wessex bat Mercia et prend Kent, Sussex, Surrey et Essex."
  "After Mercia's defeat at Ellendun, East Anglia throws off Mercian rule.": "Après la défaite de Mercia à Ellendun, East Anglia rejette la règle des Mercies."
  "Omurtag’s Bulgarians drive the Franks from Syrmia and the land along the lower Drava; the war lasts until 829.": "Les Bulgares d’Omurtag conduisent les Francs de Syrmia et la terre le long de la Drava inférieure ; la guerre dure jusqu’à 829."
  "Arab and Berber forces from Ifriqiya land at Mazara at the invitation of the rebel Euphemius; the conquest of Sicily begins.": "Les forces arabes et berbères de la terre d’Ifriqiya à Mazara à l’invitation du rebelle Euphéme ; la conquête de la Sicile commence."
  "About 827–828. Andalusi exiles led by Abu Hafs land on Crete and found an emirate with its capital at Chandax (Heraklion). Some historians date the landing to 824.": "Environ 827–828. Des exilés andalous dirigés par Abu Hafs en Crète ont trouvé un émirat avec sa capitale à Chandax (Héraklion). Certains historiens datent le débarquement à 824."
  "Palermo falls to the Arabs after a year-long siege and becomes the capital of Muslim Sicily.": "Palerme tombe aux Arabes après un siège d’un an et devient la capitale de la Sicile musulmane."
  "Mojmír I of Moravia drives Prince Pribina from Nitra and unites the two principalities into Great Moravia.": "Mojmír I de Moravie conduit le prince Pribina de Nitra et unit les deux principautés en Grande Moravie."
  "About 836. Philippopolis (Plovdiv) and the upper Maritsa valley pass to Bulgaria under Khan Malamir or his successor Presian.": "Vers 836. Philippopolis (Plovdiv) et la haute vallée de Maritsa passent en Bulgarie sous Khan Malamir ou son successeur Presian."
  "Battle of Hingston Down. Egbert defeats the Cornish and their Viking allies; Cornwall comes under West Saxon rule.": "Bataille de Hingston Down. Egbert bat les Cornish et leurs alliés vikings ; Cornwall est sous la domination ouest-saxonne."
  "Arab forces hold Agrigento and the centre of the island, and seize Taranto on the mainland.": "Les forces arabes tiennent Agrigento et le centre de l’île, et saisissent Tarente sur la terre ferme."
  "Kenneth MacAlpin, king of Dál Riata, becomes king of the Picts as well; the two kingdoms grow together into Alba (the traditional date).": "Kenneth MacAlpin, roi de Dál Riata, devient aussi roi des Picts ; les deux royaumes grandissent ensemble en Alba (la date traditionnelle)."
  "Messina falls to the Arabs.": "Messine tombe aux Arabes."
  "Treaty of Verdun. Louis the German receives the eastern Frankish lands, with Pannonia, Carantania and Carniola; Istria and Friuli stay with Lothair’s Italy.": "Traité de Verdun. Louis l’Allemand reçoit les terres franches orientales, avec Pannonia, Carantania et Carniola ; Istrie et Friuli séjournent avec Lothair ès Italie."
  "Treaty of Verdun. The sons of Louis the Pious divide the Frankish empire: Charles the Bald takes West Francia, Louis the German East Francia, and the emperor Lothair the middle kingdom from Frisia to Italy.": "Traité de Verdun. Les fils de Louis le Pieux divisent l’empire franc : Charles le Bald prend la Francie occidentale, Louis la Francia orientale allemande, et l’empereur Lothair le royaume moyen de Frisia à Italie."
  "Treaty of Verdun. The Catalan counties pass to West Francia.": "Traité de Verdun. Les comtés catalans passent à la Francie occidentale."
  "Berkshire has passed from Mercia to Wessex by the 840s.": "Le Berkshire est passé de Mercia à Wessex vers les années 840."
  "Arab mercenaries seize Bari, which becomes the seat of an emirate.": "Les mercenaires arabes s’emparent de Bari, qui devient le siège d’un émirat."
  "The Arabs take Ragusa and the south-east.": "Les Arabes prennent Raguse et le sud-est."
  "The Divisio Ducatus Beneventani. Emperor Louis II divides the Lombard south into the Principalities of Benevento and Salerno.": "Le Divisio Ducatus Beneventani. L’empereur Louis II divise le sud lombard en les principautés de Bénévet et de Salerno."
  "About 850. Under Presian and Boris I the Bulgarians extend their rule over the Morava valley, Kosovo, Macedonia and the Rhodopes; the dates of these conquests, between the 830s and the 860s, are uncertain.": "850. Sous Presian et Boris Ier, les Bulgares étendent leur domination sur la vallée du Morava, le Kosovo, la Macédoine et les Rhodopes ; les dates de ces conquêtes, entre les années 830 et 860, sont incertaines."
  "Norse settlers have taken over the Hebrides (about 850).": "Les colons nordiques ont repris les Hébrides (environ 850)."
  "Battle of Jengland and Treaty of Angers. Charles the Bald recognises Erispoe as king of the Bretons, with Rennes, Nantes and the Pays de Retz.": "Bataille de Jengland et traité d’Angers. Charles le Bald reconnaît Erispoe comme roi des bretons, avec Rennes, Nantes et le Pays de Retz."
  "Amlaíb (Olaf) becomes king of the Norse at Dublin; the Viking kingdom of Dublin is founded.": "Amlaíb (Olaf) devient roi des Nors à Dublin ; le royaume viking de Dublin est fondé."
  "Ordoño I of Asturias resettles León and Astorga.": "Ordoño I des Asturies réinstalle León et Astorga."
  "Enna (Castrogiovanni), the central fortress of Byzantine Sicily, falls.": "Enna (Castrogiovanni), la forteresse centrale de la Sicile byzantine, tombe."
  "Treaty of Compiègne. Charles the Bald grants the Cotentin, with the Channel Islands, to Salomon of Brittany.": "Traité de Compiègne. Charles le Bald accorde le Cotentin, avec les îles Anglo-Normandes, à Salomon de Bretagne."
  "Docibilis I rules Gaeta as an independent duke.": "Docibilis Je règle Gaeta comme un duc indépendant."
  "Vímara Peres takes Porto for Alfonso III; the County of Portugal is founded between the Minho and the Douro.": "Vímara Peres prend Porto pour Alfonso III ; le comté du Portugal est fondé entre le Minho et le Douro."
  "Ahmad ibn Tulun arrives in Egypt as governor and soon rules it as his own.": "Ahmad ibn Tulun arrive en Egypte comme gouverneur et le gouverne bientôt comme son propre."
  "The Great Heathen Army defeats and kills King Edmund; East Anglia comes under Danish rule.": "La Grande Armée des Heathes bat et tue le roi Edmund ; East Anglia est sous la domination danoise."
  "The Aghlabids take Malta.": "Les Aghlabides prennent Malte."
  "Emperor Louis II takes Bari from the Arabs.": "L’empereur Louis II prend Bari des Arabes."
  "Orkney and Shetland become a Norse earldom under the Norwegian crown (traditionally dated to Harald Fairhair).": "Orkney et Shetland deviennent un comte norvégien sous la couronne norvégienne (traditionnellement datée de Harald Fairhair)."
  "Halfdan shares out the land of southern Northumbria (Deira) among his men; York becomes a Viking kingdom.": "Halfdan partage la terre du sud de Northumbria (Deira) parmi ses hommes ; York devient un royaume viking."
  "Byzantine troops take over Bari.": "Les troupes byzantines prennent le contrôle de Bari."
  "The Danes partition Mercia and settle its eastern half, later the Five Boroughs. Western Mercia stays English under Ceolwulf II and then Ealdorman Æthelred, who accepts Alfred’s lordship.": "La partition des Danois Mercia et installe sa moitié orientale, plus tard les Cinq Boroughs. Mercia occidentale reste anglais sous Ceolwulf II puis Ealdorman Æthelred, qui accepte la lordship d’Alfred."
  "Ahmad ibn Tulun of Egypt takes Syria and the Cilician frontier.": "Ahmad ibn Tulun d’Égypte prend la Syrie et la frontière cilicienne."
  "Alfonso III’s counts take Coimbra, Viseu and Lamego and settle Trás-os-Montes.": "Les comtes d’Alfonso III ont pris Coimbra, Viseu et Lamego et s’installent à Trás-os-Montes."
  "Ahmad ibn Tulun takes Syria.": "Ahmad ibn Tulun prend la Syrie."
  "Syracuse falls after a nine-month siege; only Taormina, Catania and a few strongholds in the north-east remain Byzantine.": "Syracuse tombe après un siège de neuf mois ; seuls Taormina, Catane et quelques bastions du nord-est restent byzantins."
  "At Mantaille the bishops and nobles of Provence and Lower Burgundy elect Boso king, the first non-Carolingian king in the West.": "A la Mantille, les évêques et nobles de Provence et de Basse Bourgogne élisent le roi Boso, premier roi non carolingien à l’Ouest."
  "Boso is elected king of Provence; the coast around Monaco belongs to his kingdom.": "Boso est élu roi de Provence ; la côte autour de Monaco appartient à son royaume."
  "After Edington and the Peace of Wedmore, Guthrum’s army settles East Anglia; Essex and the south-east Midlands fall within the Danelaw, as the Treaty of Alfred and Guthrum later sets out.": "Après Edington et la paix de Wedmore, l’armée de Guthrum s’installe à East Anglia ; Essex et les Midlands du sud-est tombent dans la Danelaw, comme le prévoit plus tard le Traité d’Alfred et de Guthrum."
  "Treaty of Ribemont. West Francia gives up its half of Lotharingia; all of Lotharingia belongs to East Francia.": "Traité de Ribemont. Francia occidentale abandonne sa moitié de Lotharingia ; toute la Lotharingia appartient à la Francie orientale."
  "The Byzantines retake Taranto.": "Les Byzantins reprennent Tarente."
  "Count Diego Rodríguez Porcelos founds Burgos for Alfonso III of Asturias.": "Le comte Diego Rodríguez Porcelos a trouvé Burgos pour Alfonso III des Asturies."
  "Ashot I Bagratuni is recognised as king of Armenia by the caliph and by Byzantium; the Artsruni of Vaspurakan become kings in 908.": "Ashot I Bagratuni est reconnu comme roi d’Arménie par le calife et par Byzance ; les Artsruni de Vaspurakan deviennent rois en 908."
  "Nikephoros Phokas the Elder reconquers northern Calabria and much of Apulia and Lucania for Byzantium.": "Nikephoros Phokas l’Ancien reconquiert le nord de la Calabre et une grande partie des Pouilles et Lucanie pour Byzance."
  "Adarnase IV of Tao-Klarjeti takes the title king of the Iberians.": "Adarnase IV de Tao-Klarjeti prend le titre de roi des Ibériques."
  "After Charles the Fat is deposed, Rudolph I is crowned king of Upper Burgundy at Saint-Maurice.": "Après la déposition de Charles le Fat, Rudolph Ier est couronné roi de Haute Bourgogne à Saint-Maurice."
  "Emperor Charles the Fat dies and the Carolingian empire breaks up; Friuli and Istria belong to the Kingdom of Italy.": "L’empereur Charles le Fat meurt et l’empire carolingien se brise ; Friuli et Istrie appartiennent au Royaume d’Italie."
  "Emperor Charles the Fat dies and the Carolingian empire breaks apart. Berengar of Friuli is crowned king of Italy; Rudolph of Upper Burgundy takes the Aosta valley.": "L’empereur Charles le Fat meurt et l’empire carolingien se sépare. Berengar du Frioul est couronné roi d’Italie ; Rudolph de Haute Bourgogne prend la vallée d’Aoste."
  "Alfonso III resettles Zamora on the Duero.": "Alfonso III réinstalle Zamora sur le Duero."
  "The Magyars, driven from the steppe north of the Black Sea by the Pechenegs, cross the Carpathians and occupy the Great Hungarian Plain and the upper Tisza. The Pechenegs take the steppe north of the lower Danube.": "Les Magyars, chassés de la steppe au nord de la mer Noire par les Pechenegs, traversent les Carpates et occupent la Grande plaine hongroise et le haut Tisza. Les Pechenegs prennent la steppe au nord du Danube inférieur."
  "historical-basemaps world_900 (automatic draft, partly hand-corrected)": "historical-basemaps world_900 (ébauche automatique partiellement corrigée à la main)"
  "After the death of Emperor Arnulf (899) the Magyars take Pannonia west of the Danube from East Francia. Transylvania is settled in the same years.": "Après la mort de l’empereur Arnulf (899), les Magyars prennent Pannonia à l’ouest du Danube depuis la Francie orientale. Transylvanie est établie dans les mêmes années."
  "By about 900 the kingdom of Strathclyde has expanded south over Cumbria and Galloway, the western lands of the old Northumbria.": "Vers 900, le royaume de Strathclyde s’étend au sud sur Cumbria et Galloway, les terres occidentales du vieux Northumbria."
  "Atenulf I of Capua takes Benevento and unites the two principalities.": "Atenulf I de Capua prend Benevento et unit les deux principautés."
  "Sardinia, cut off from Byzantium, is ruled by its own judges in four judicates.": "La Sardaigne, coupée de Byzance, est gouvernée par ses propres juges dans quatre tribunaux."
  "The Irish expel the Norse from Dublin. Many of them settle the coast of north-west England between the Ribble and the Mersey, which falls under the Viking kingdom of York.": "Les Irlandais expulsent les Nors de Dublin. Beaucoup d’entre eux s’installent sur la côte du nord-ouest de l’Angleterre entre le Ribble et le Mersey, qui tombe sous le royaume viking de York."
  "Isam al-Khawlani conquers the Balearic Islands for the Emirate of Córdoba.": "Isam al-Khawlani conquiert les îles Baléares pour l’Émirat de Cordoue."
  "Ibrahim II takes Taormina; the last Byzantine strongholds in eastern Sicily fall.": "Ibrahim II prend Taormina ; les derniers bastions byzantins dans l’est de la Sicile tombent."
  "A peace after Simeon’s wars with Byzantium sets the border about 20 km north of Thessaloniki; Bulgaria holds most of Albania and northern Epirus, while Dyrrhachium stays Byzantine.": "Une paix après les guerres de Siméon avec Byzance fixe la frontière à environ 20 km au nord de Thessalonique ; la Bulgarie détient la plupart de l’Albanie et le nord de l’Epire, tandis que Dyrrachium reste byzantine."
  "The Abbasids end Tulunid rule and recover Syria and Cilicia.": "Les Abbassides mettent fin à la domination tulunide et récupèrent la Syrie et la Cilicie."
  "An Abbasid army enters Fustat and ends Tulunid rule in Egypt and Syria.": "Une armée abbasside entre dans Fustat et met fin à la domination tulunide en Égypte et en Syrie."
  "Battle of Pressburg. A Bavarian army is destroyed by the Magyars, who now control the former Moravian lands in the Danube basin. Their hold on the hills of today’s northern Slovakia stays loose for another century.": "Bataille de Pressburg. Une armée bavaroise est détruite par les Magyars, qui contrôlent maintenant les anciennes terres moraves dans le bassin du Danube. Leur emprise sur les collines d’aujourd'hui."
  "The Bavarian army is destroyed by the Magyars at Pressburg. Great Moravia has collapsed; the Magyars hold the Carpathian Basin, Moravia and the land east of the Enns, and the Přemyslid dukes rule Bohemia.": "L’armée bavaroise est détruite par les Magyars à Pressburg. La Grande Moravie s’est effondrée ; les Magyars tiennent le bassin des Carpates, la Moravie et la terre à l’est de l’Enns, et les ducs Přemyslid dominent la Bohême."
  "The counts of Castile and León reach the Duero, resettling Roa, Osma, San Esteban de Gormaz and Simancas.": "Les dénombrements de Castille et León atteignent le Duero, réinstallant Roa, Osma, San Esteban de Gormaz et Simancas."
  "Edward the Elder conquers the southern Danelaw, including Essex and East Anglia. In Ireland, Sihtric Cáech retakes Dublin for the Norse.": "En Irlande, Sihtric Cáech reprend Dublin pour la Norse."
  "The Five Boroughs of the east Midlands submit to Edward and Æthelflæd.": "Les cinq arrondissements des Midlands de l’est se soumettent à Edward et Æthelflæd."
  "After Æthelflæd, Lady of the Mercians, dies in June, Edward removes her daughter Ælfwynn and takes Mercia under his own rule.": "Après la mort en juin de la Dame des Merciens, Edward enlève sa fille Ælfwynn et prend Mercia sous son propre règne."
  "Ordoño II of León and Sancho Garcés I of Pamplona take Nájera and Viguera; La Rioja passes to Pamplona.": "Ordoño II de León et Sancho Garcés I de Pampelune prennent Nájera et Viguera ; La Rioja passe à Pampelune."
  "Tsar Simeon’s army annexes Serbia after deposing its prince Zaharija.": "Le tsar Simeon's annexes de l’armée de Serbie après avoir déposé son prince Zaharija."
  "About 925. Tomislav unites Pannonian and Dalmatian Croatia; a papal letter of 925 calls him king.": "Vers 925. Tomislav unit la Croatie pannonienne et dalmate ; une lettre papale de 925 l’appelle roi."
  "Abd al-Rahman III takes Melilla.": "Abd al-Rahman III prend Melilla."
  "Æthelstan takes York, and at Eamont the kings of the north submit to him. He becomes the first king of all the English.": "Æthelstan prend York, et à Eamont les rois du nord se soumettent à lui. Il devient le premier roi de tous les Anglais."
  "The Althing meets for the first time; the Icelandic Commonwealth.": "L’Althing se réunit pour la première fois ; le Commonwealth islandais."
  "Abd al-Rahman III takes Ceuta.": "Abd al-Rahman III prend Ceuta."
  "About 933. Časlav Klonimirović escapes from Bulgaria and restores the Serbian principality.": "Environ 933. Časlav Klonimirović s’échappe de Bulgarie et restaure la principauté serbe."
  "William Longsword of Normandy annexes the Cotentin and the Channel Islands.": "William Longsword de Normandie annexe le Cotentin et les îles Anglo-Normandes."
  "John Kourkouas takes Melitene (Malatya) after years of campaigning.": "John Kourkouas prend Melitene (Malatya) après des années de campagne."
  "Muhammad ibn Tughj al-Ikhshid takes over Egypt as governor and founds the Ikhshidid dynasty.": "Muhammad ibn Tughj al-Ikhshid prend le contrôle de l’Egypte comme gouverneur et fonde la dynastie Ikhshidid."
  "After Æthelstan’s death, Olaf Guthfrithson of Dublin is accepted as king at York.": "Après sa mort, Olaf Guthfrithson de Dublin est accepté comme roi à York."
  "Olaf Guthfrithson takes the Five Boroughs of the east Midlands.": "Olaf Guthfrithson prend les Cinq Boroughs des Midlands Est."
  "After the victory at Simancas in 939, Count Fernán González resettles Sepúlveda south of the Duero.": "Après la victoire à Simancas en 939, le comte Fernán González réinstalle Sepúlveda au sud du Duero."
  "Ramiro II of León resettles Salamanca and Ledesma on the Tormes.": "Ramiro II de León réinstalle Salamanque et Ledesma sur les Tormes."
  "King Edmund recovers the Five Boroughs.": "Le roi Edmund récupère les cinq arrondissements."
  "Edmund drives the Norse kings out of York.": "Edmund chasse les rois des Nors de York."
  "Sayf al-Dawla, the Hamdanid emir of Aleppo (from 944) and Mayyafariqin, rules northern Syria, the Jazira and the Diyarbakır region, and leads the war against Byzantium.": "Sayf al-Dawla, l’émir de Hamdanid d’Alep (de 944) et Mayyafariqin, dirige le nord de la Syrie, la Jazira et la région de Diyarbakır, et mène la guerre contre Byzance."
  "Sayf al-Dawla takes Aleppo (944); a treaty with the Ikhshidids leaves him northern Syria and them Damascus, Palestine and the coast.": "Sayf al-Dawla prend Alep (944) ; un traité avec les Ikhshidides le quitte au nord de la Syrie et les Damas, la Palestine et la côte."
  "The Northumbrians accept Eric Bloodaxe as king at York.": "Les Northumbriens acceptent Eric Bloodaxe comme roi à York."
  "Otto I founds the bishoprics of Brandenburg and Havelberg in the Slav lands between the Elbe and the Oder, conquered by Henry I and the margrave Gero.": "Otto j’ai trouvé les évêchés de Brandebourg et Havelberg dans les terres slaves entre l’Elbe et l’Oder, conquis par Henry Ier et le margrave Gero."
  "Byzantium takes Theodosiopolis (Erzurum) and the upper Euphrates valley.": "Byzance prend Theodosiopolis (Erzurum) et la haute vallée de l’Euphrate."
  "Count Fernán González has made Castile, with Álava and Biscay, all but independent of León.": "Le comte Fernán González a fait de la Castille, avec Álava et Biscaye, tous sauf indépendants de León."
  "Eric Bloodaxe is driven out of York, and the last Viking kingdom in England ends.": "Eric Bloodaxe est chassé de York, et le dernier royaume viking d’Angleterre prend fin."
  "John Tzimiskes takes Samosata.": "John Tzimiskes prend Samosata."
  "Nikephoros Phokas takes Chandax after a winter siege; Crete is Byzantine again.": "Nikephoros Phokas prend Chandax après un siège d’hiver ; la Crète est de nouveau byzantine."
  "Nikephoros Phokas takes Germanikeia (Marash) and sacks Aleppo.": "Nikephoros Phokas prend Germanikeia (Marash) et saccage Alep."
  "Otto I is crowned emperor in Rome. Carantania, Carniola and the March of Istria belong to the empire.": "Otto Ier est couronné empereur à Rome. Carantanie, Carniola et la Marche de l’Istrie appartiennent à l’empire."
  "Otto I is crowned emperor in Rome; Lotharingia, part of his kingdom since 925, belongs to the Holy Roman Empire.": "Otto Ier est couronné empereur à Rome ; Lotharingia, une partie de son royaume depuis 925, appartient au Saint-Empire romain."
  "Otto I is crowned emperor in Rome; East Francia becomes the core of the Holy Roman Empire.": "Otto Ier est couronné empereur à Rome ; la Francie orientale devient le noyau du Saint-Empire romain."
  "Otto I is crowned emperor in Rome; the Kingdom of Italy becomes part of the Holy Roman Empire, and the emperors take over the Exarchate and the Pentapolis in practice.": "Otto Ier est couronné empereur à Rome ; le Royaume d’Italie devient partie du Saint Empire romain, et les empereurs prennent en pratique l’Exarchate et la Pentapolis."
  "Byzantium takes Cyprus, which had been shared with the Arab caliphate since the treaty of 688.": "Byzance prend Chypre, qui a été partagée avec le califat arabe depuis le traité de 688."
  "Nikephoros II takes Tarsus, a year after Mopsuestia; Cilicia is Byzantine again.": "Nikephoros II prend Tarsus, un an après Mopsuestia ; Cilicie est de nouveau byzantine."
  "The Armenian princes of Taron cede their land to Byzantium.": "Les princes arméniens de Taron cèdent leur terre à Byzance."
  "The Fatimid general Jawhar takes Fustat and founds Cairo nearby.": "Le général Fatimid Jawhar prend Fustat et trouve le Caire à proximité."
  "Byzantine troops take Antioch. Aleppo becomes a Byzantine tributary.": "Les troupes byzantines prennent Antioche. Alep devient un affluent byzantin."
  "Byzantium takes Antioch; Latakia and Tartus are Byzantine too. Aleppo becomes a tributary under the treaty of Safar.": "Byzance prend Antioche ; Latakia et Tartus sont byzantines aussi. Alep devient un affluent sous le traité de Safar."
  "The Fatimids take Palestine and Damascus (970–971).": "Les Fatimidés prennent la Palestine et Damas (970–971)."
  "After defeating Sviatoslav of Kiev at Dorostolon, John I Tzimiskes annexes eastern Bulgaria with Preslav and the Thracian lands. The western Bulgarian lands stay independent under the Cometopuli brothers, later Tsar Samuel.": "Après avoir vaincu Sviatoslav de Kiev à Dorostolon, John I Tzimiskes annexe l’est de la Bulgarie avec Preslav et les terres thraces. Les terres bulgares occidentales restent indépendantes sous les frères Cometopuli, plus tard Tsar Samuel."
  "Otto II gives the march on the Danube east of the Enns to Leopold of Babenberg, the beginning of Austria.": "Otto II donne la marche sur le Danube à l’est des Enns à Léopold de Babenberg, le début de l’Autriche."
  "Pandulf Ironhead dies; Capua and Benevento separate again.": "Pandulf Ironhead meurt ; Capua et Benevento se séparent à nouveau."
  "The Great Slav Rising. The Lutici destroy Havelberg and Brandenburg, and the Empire loses the land between the Elbe and the Oder for almost two centuries.": "Les Lutici détruisent Havelberg et Brandebourg, et l’Empire perd la terre entre l’Elbe et l’Oder pendant près de deux siècles."
  "Samuel takes Larissa (986) and defeats Basil II at the Gates of Trajan. By then Bulgaria also holds the north-east again; the date of that recovery is uncertain.": "Samuel prend Larissa (986) et bat Basil II aux Portes de Trajan. À l’époque, la Bulgarie détient également le nord-est ; la date de cette reprise est incertaine."
  "Almanzor takes Coimbra; the land south of the Douro returns to Córdoba.": "Almanzor prend Coimbra ; la terre au sud du Douro revient à Cordoue."
  "Hugh Capet is crowned king of the West Franks.": "Hugh Capet est couronné roi des Francs de l’Ouest."
  "Count Borrell II of Barcelona no longer renews his allegiance to the new Capetian king; the Catalan counties are independent in practice.": "Le comte Borrell II de Barcelone ne renouvelle plus son allégeance au nouveau roi capétain ; les comtés catalans sont indépendants dans la pratique."
  "The Kurdish Marwanid dynasty takes over the Diyarbakır region after the Hamdanids.": "La dynastie kurde marwanide reprend la région de Diyarbakır après les Hamdanides."
  "In the 990s Samuel takes Dyrrhachium on the Adriatic.": "Dans les années 990 Samuel prend Dyrrachium sur l’Adriatique."
  "historical-basemaps world_1000 (automatic draft, partly hand-corrected)": "historical-basemaps world_1000 (ébauche automatique partiellement corrigée à la main)"
  "Basil II’s generals retake Pliska, Preslav and Dorostolon in north-eastern Bulgaria.": "Basil II Les généraux reprennent Pliska, Preslav et Dorostolon dans le nord-est de la Bulgarie."
  "Battle of Svolder. Olaf Tryggvason falls; Norway is divided between the Danish and Swedish kings, ruled for Sweyn Forkbeard by the jarls of Lade.": "Bataille de Svolder. Olaf Tryggvason tombe ; la Norvège est divisée entre les rois danois et suédois, gouverné pour Sweyn Forkbeard par les jarls de Lade."
  "Byzantium recovers Thessaly and the fortresses of Berroia and Servia in western Macedonia.": "Byzance récupère Thessalie et les forteresses de Berroie et Servia dans l’ouest de la Macédoine."
  "The last Hamdanid of Aleppo is deposed by his minister Lu’lu’. Aleppo passes to Fatimid governors and, from 1024, to the Mirdasid emirs; the Jazira is held by Arab emirs of the Uqaylid and Numayrid families.": "Le dernier Hamdanid d’Alep est déposé par son ministre Lu. Alep passe aux gouverneurs fatimides et, de 1024, aux émirs Mirdasid ; le Jazira est détenu par les émirs arabes des familles Uqaylid et Numayrid."
  "Vidin surrenders after an eight-month siege (1002 or 1003); Byzantium holds the Danube from Vidin to the sea.": "Vidin se rend après un siège de huit mois (1002 ou 1003) ; Byzance tient le Danube de Vidin à la mer."
  "Basil II defeats Samuel on the Vardar and takes Skopje (1003 or 1004).": "Basil II bat Samuel sur le Vardar et prend Skopje (1003 ou 1004)."
  "Dyrrhachium is handed back to Byzantium.": "La dyrrachium est remise à Byzance."
  "Olaf Haraldsson (Saint Olaf) takes the Norwegian throne and drives out the jarls.": "Olaf Haraldsson (Saint-Olaf) prend le trône norvégien et chasse les jarls."
  "Basil II completes the conquest of Bulgaria after Samuel’s death and the surrender of Tsar Ivan Vladislav’s widow at Ohrid. Sirmium follows in 1018–1019.": "Basil II complète la conquête de la Bulgarie après la mort de Samuel et la reddition du tsar Ivan Vladislav, veuve d’Ohrid. Sremium suit en 1018-1019."
  "Battle of Carham. Malcolm II of Scotland and Owen of Strathclyde defeat the Northumbrians; Lothian passes to Scotland for good. After Owen’s death Strathclyde, with Cumbria and Galloway, is absorbed into the Scottish kingdom.": "Bataille de Carham. Malcolm II d’Écosse et Owen de Strathclyde battent les Northumbriens ; Lothian passe en Ecosse pour de bon. Après la mort d’Owen Strathclyde, avec Cumbria et Galloway, est absorbé dans le royaume écossais."
  "The Byzantine catepan Basil Boioannes defeats Melus and his Norman allies at Cannae and secures the Capitanata.": "La catepan byzantine Basil Boioannes bat Melus et ses alliés normands à Cannae et assure la Capitanata."
  "Senekerim-John of Vaspurakan cedes his kingdom to Basil II (1021–1022).": "Senekerim-Jean de Vaspurakan cède son royaume à Basil II (1021-1022)."
  "Cnut the Great, king of Denmark and England, drives Olaf out and takes Norway; Olaf falls at Stiklestad in 1030 trying to return.": "Cnut le Grand, roi du Danemark et de l’Angleterre, chasse Olaf et prend la Norvège ; Olaf tombe à Stiklestad en 1030 essayant de revenir."
  "Count García Sánchez of Castile is murdered in León; Sancho III of Pamplona takes Castile.": "Le comte García Sánchez de Castille est assassiné à León ; Sancho III de Pampelune prend Castille."
  "George Maniakes takes Edessa.": "George Maniakes prend Edessa."
  "The Caliphate of Córdoba is abolished. Al-Andalus breaks up into taifa kingdoms: Zaragoza (with Lleida and Tortosa), Toledo, Badajoz (with Lisbon), Seville, Granada (with Málaga and Jaén), Almería, Murcia, Valencia, Denia (with the Balearics), and Córdoba itself.": "Le califat de Cordoue est aboli. Al-Andalus se divise en royaumes taifa : Saragosse (avec Lleida et Tortosa), Tolède, Badajoz (avec Lisbonne), Séville, Grenade (avec Málaga et Jaén), Almería, Murcia, Valence, Denia (avec les Baléares) et Córdoba lui-même."
  "With the end of the Caliphate of Córdoba, its protectorate in northern Morocco breaks up among Zenata Berber emirs at Fez, Sijilmasa and elsewhere.": "Avec la fin du califat de Córdoba, son protectorat au nord du Maroc se sépare entre les émirs berbères Zenata à Fez, Sijilmasa et ailleurs."
  "Conrad II is crowned king of Burgundy after the last Rudolfian king dies; the kingdom of Burgundy (Arles) becomes part of the Holy Roman Empire.": "Conrad II est couronné roi de Bourgogne après la mort du dernier roi rudolfien ; le royaume de Bourgogne (Arles) devient partie intégrante du Saint Empire romain."
  "Conrad II inherits the Kingdom of Burgundy; Humbert the White-Handed holds the Aosta valley, the start of the house of Savoy.": "Conrad II hérite du Royaume de Bourgogne ; Humbert la Main Blanche tient la vallée d’Aoste, le départ de la maison de Savoie."
  "The county of Provence, with Monaco, is held by its own counts within the Kingdom of Burgundy.": "Le comté de Provence, avec Monaco, est détenu par ses propres comtes au sein du Royaume de Bourgogne."
  "The Faroe Islands come under the Norwegian crown (traditionally dated about 1035).": "Les îles Féroé sont placées sous la couronne norvégienne (qui date traditionnellement d’environ 1035)."
  "Magnus the Good, Olaf's son, is king of Norway after Cnut's regime collapses.": "Magnus le Bon, fils d’Olaf, est roi de Norvège après l’effondrement du régime de Cnut."
  "Sancho III of Pamplona dies. His son Ferdinand rules Castile as king, Ramiro rules Aragon, and García keeps Pamplona with Álava and Biscay.": "Sancho III de Pampelune meurt. Son fils Ferdinand gouverne la Castille comme roi, Ramiro dirige Aragon, et García garde Pamplune avec Álava et Biscaye."
  "Battle of Tamarón. Ferdinand I of Castile defeats and kills Bermudo III of León and takes his kingdom.": "Bataille de Tamarón. Ferdinand Ier de Castille bat et tue Bermudo III de León et prend son royaume."
  "Stefan Vojislav of Duklja defeats a Byzantine army near Bar and makes Duklja independent.": "Stefan Vojislav de Duklja bat une armée byzantine près de Bar et rend Duklja indépendante."
  "The Normans at Melfi elect William Iron Arm count of Apulia.": "Les Normands de Melfi élisent William Iron Arm comte d’Apulia."
  "Byzantium annexes the Bagratid kingdom of Ani.": "Byzance annexe le royaume Bagratide d’Ani."
  "Battle of Civitate. The Normans defeat and capture Pope Leo IX; they hold the Capitanata.": "Bataille de Civitate. Les Normands battent et capturent le pape Léon IX ; ils détiennent les Capitanata."
  "Treaty of Melfi. Pope Nicholas II invests Robert Guiscard as Duke of Apulia and Calabria, and of Sicily to come.": "Traité de Melfi. Le pape Nicholas II investit Robert Guiscard comme duc d’Apulie et de Calabre, et de Sicile à venir."
  "Robert Guiscard takes Reggio, completing the conquest of Calabria.": "Robert Guiscard prend Reggio, complétant la conquête de la Calabre."
  "Roger and Robert Guiscard cross the strait and take Messina.": "Roger et Robert Guiscard traversent le détroit et prennent Messina."
  "Richard of Capua takes Gaeta.": "Richard de Capua prend Gaeta."
  "The Normans take Taranto and Matera.": "Les Normands prennent Tarente et Matera."
  "Ferdinand I takes Coimbra.": "Ferdinand, je prends Coimbra."
  "Sultan Alp Arslan takes Ani; Kars follows within a year.": "Sultan Alp Arslan prend Ani ; Kars suit dans un an."
  "Ferdinand I dies and divides his realm: Sancho II takes Castile, Alfonso VI León with Portugal, and García Galicia.": "Ferdinand I meurt et divise son royaume : Sancho II prend Castille, Alfonso VI León avec le Portugal, et García Galicia."
  "France in 1066. The Capetian kings rule a small royal domain, but the great fiefs of the kingdom (Normandy, Anjou, Aquitaine, Burgundy, Champagne and the rest) are shown with France. The duchy of Brittany, the county of Flanders (with Artois) and the county of Toulouse are shown separately. East of the Scheldt, the Meuse, the Saône and the Rhône lie the lands of the Holy Roman Empire: the Low Countries, Lorraine, Alsace, the Free County of Burgundy, Dauphiné and Provence.": "La France en 1066. Les rois capétains dominent un petit domaine royal, mais les grands fiefs du royaume (Normandie, Anjou, Aquitaine, Bourgogne, Champagne et les autres) sont représentés avec la France. Le duché de Bretagne, le comté de Flandre (avec Artois) et le comté de Toulouse sont présentés séparément. A l’est de l’Escaut, la Meuse, la Saône et le Rhône se trouvent les terres du Saint Empire romain : les Pays Bas, Lorraine, Alsace, le Comté Libre de Bourgogne, Dauphiné et Provence."
  "William of Normandy is crowned king of England. The Channel Islands, part of his duchy, stay with the English crown when Normandy is lost in 1204.": "Guillaume de Normandie est couronné roi d’Angleterre. Les îles Anglo-Normandes, une partie de son duché, restent avec la couronne anglaise quand la Normandie est perdue en 1204."
  "William, duke of Normandy, is crowned king of England. Normandy stays a fief of the French crown, held by the English king.": "William, duc de Normandie, est couronné roi d’Angleterre. La Normandie reste un fief de la couronne française, tenu par le roi anglais."
  "Al-Mu’tamid of Seville annexes Córdoba.": "Al-Mudim de Séville annexes Cordoue."
  "About 1070. The Cumans (Kipchaks) push the Pechenegs out of the steppe north of the Danube.": "Environ 1070. Les Cumans (Kipchaks) poussent les Pechenegs hors de la steppe au nord du Danube."
  "William FitzOsbern, earl of Hereford, has conquered Gwent (Monmouthshire), the first Norman lordship in Wales.": "William FitzOsbern, comte d’Hereford, a conquis Gwent (Monmouthshire), la première seigneurie normande au pays de Galles."
  "The Normans take Brindisi and Otranto.": "Les Normands prennent Brindisi et Otranto."
  "About 1070. The qadis of the Banu Ammar family make Tripoli independent of the Fatimids.": "Vers 1070. Les qadis de la famille Banu Ammar rendent Tripoli indépendante des Fatimides."
  "King Solomon of Hungary takes Belgrade and Sirmium from Byzantium.": "Le roi Salomon de Hongrie prend Belgrade et Sremium de Byzance."
  "Catania falls to Count Roger.": "Catane tombe au comte Roger."
  "Bari, the last Byzantine city in Italy, surrenders to Robert Guiscard after a siege of nearly three years.": "Bari, la dernière ville byzantine d’Italie, se rend à Robert Guiscard après un siège de près de trois ans."
  "Battle of Manzikert. Alp Arslan defeats and captures Romanos IV; Byzantine rule in the east collapses.": "Bataille de Manzikert. Alp Arslan bat et capture Romanos IV ; la domination byzantine dans l’est s’effondre."
  "Robert Guiscard and Roger take Palermo.": "Robert Guiscard et Roger prennent Palerme."
  "Sancho II is killed besieging Zamora; Alfonso VI reunites León and Castile.": "Sancho II est tué en assiégeant Zamora ; Alfonso VI réunit León et Castille."
  "Zaragoza annexes Denia; Mallorca becomes a taifa of its own.": "Saragosse annexes Denia ; Majorque devient une taifa propre."
  "Sancho IV of Pamplona is murdered at Peñalén. Alfonso VI takes La Rioja, Álava, Biscay and Gipuzkoa; Sancho Ramírez of Aragon becomes king of Pamplona.": "Sancho IV de Pamplona est assassiné à Peñalén. Alfonso VI prend La Rioja, Álava, Biscaye et Gipuzkoa ; Sancho Ramírez d’Aragon devient roi de Pamplona."
  "Robert Guiscard takes Salerno (the citadel holds out until May 1077); the last Lombard principality ends, and Benevento city passes to the pope.": "Robert Guiscard prend Salerno (la citadelle tient jusqu’en mai 1077), la dernière principauté lombarde se termine, et la ville de Benevento passe au pape."
  "Count Roger takes Trapani.": "Le comte Roger prend Trapani."
  "The Turkmen chief Atsiz took Jerusalem (1073) and Damascus (1076); Tutush, brother of the Seljuk sultan Malik-Shah, now rules Damascus. The Fatimids keep the coast.": "Le chef turkmène Atsiz a pris Jérusalem (1073) et Damas (1076) ; Tutuch, frère du sultan de Seljuk Malik-Shah, dirige maintenant Damas. Les fatimides gardent la côte."
  "The Armenian lord Ruben founds a principality in the Taurus mountains of Cilicia.": "Le seigneur arménien Ruben a trouvé une principauté dans les montagnes du Taureau en Cilicie."
  "By 1081 Turkish emirs hold most of Anatolia. Süleyman ibn Qutalmish rules from Nicaea as the first Seljuk sultan of Rum, and the Danishmendids hold the north-east; a treaty with Alexios I sets the frontier on the Drakon near Nicomedia. Byzantium keeps the Black Sea coast and Attaleia; the Armenian general Philaretos holds Melitene, Antioch and Edessa in its name.": "En 1081, les émirs turcs détiennent la plus grande partie de l’Anatolie. Süleyman ibn Qutalmish règne depuis Nicée comme le premier sultan Seljuk de Rum, et les Danois tiennent le nord-est ; un traité avec Alexios I établit la frontière sur le Drakon près de Nicomedia. Byzance garde la côte de la mer Noire et l’Ataleia ; le général arménien Philaretos tient Méliténe, Antioch et Edessa en son nom."
  "The Almoravids take Ceuta and Melilla.": "Les Almoravid prennent Ceuta et Melilla."
  "Süleyman of Rum takes Antioch and the Cilician plain.": "Süleyman de Rum prend Antioch et la plaine cilicienne."
  "The Seljuks end Marwanid rule in Diyarbakır.": "Les Seljuks mettent fin à la domination marwanide dans Diyarbakır."
  "Alfonso VI takes Toledo, the old Visigothic capital, and the land between the Sistema Central and the Tagus; the deposed al-Qadir is installed in Valencia.": "Alfonso VI prend Toledo, l’ancienne capitale visigothique, et la terre entre le Sistema Central et le Tage ; le dépossé al-Qadir est installé à Valence."
  "Tutush takes Aleppo; northern Syria and the Jazira come under Seljuk rule.": "Tutush prend Alep ; le nord de la Syrie et les Jazira sont sous le règne de Seljuk."
  "Süleyman is killed fighting Tutush; Antioch and, in 1087, Edessa pass to governors of the Great Seljuk sultan Malik-Shah.": "Süleyman est tué en combattant Tutush ; Antioche et, en 1087, Edessa passe aux gouverneurs du Grand Seljuk sultan Malik-Shah."
  "Count Roger takes Syracuse.": "Le comte Roger prend Syracuse."
  "Count Roger takes Agrigento, and Enna surrenders.": "Le comte Roger prend Agrigento, et Enna se rend."
  "Count Roger takes Butera.": "Le comte Roger prend Butera."
  "The Almoravid emir Yusuf ibn Tashfin, who had defeated Alfonso VI at Sagrajas in 1086, deposes the taifa kings of Granada and Málaga.": "L’émir Almoravid Yusuf ibn Tashfin, qui avait vaincu Alfonso VI à Sagrajas en 1086, pose les rois taifa de Grenade et de Malaga."
  "Ladislaus I of Hungary takes Slavonia; he founds the bishopric of Zagreb a few years later.": "Ladislaus I de Hongrie prend la Slavonie ; il trouve l’évêché de Zagreb quelques années plus tard."
  "Noto, the last Muslim stronghold in Sicily, surrenders. Later that year Roger raids Malta and makes it tributary.": "Noto, le dernier bastion musulman en Sicile, se rend. Plus tard cette année-là Roger attaque Malte et la fait affluent."
  "The Almoravids take Seville and send al-Mu’tamid into exile; Córdoba, Almería and Murcia fall the same year.": "Les Almoravid prennent Séville et envoient al-Mu.tamid en exil ; Cordoue, Almería et Murcie tombent la même année."
  "William II takes Carlisle and Cumbria from Scotland.": "William II prend Carlisle et Cumbria d’Écosse."
  "The Almoravids take Denia.": "Les Almoravids prennent Denia."
  "After Rhys ap Tewdwr of Deheubarth is killed, Norman lords take southern Wales: Glamorgan, Brecon, Gower and Pembroke become Marcher lordships under the English crown.": "Après la mort de Rhys ap Tewdwr de Deheubarth, les seigneurs normands prennent le sud du Pays de Galles : Glamorgan, Brecon, Gower et Pembroke deviennent des seigneurs de Marcher sous la couronne anglaise."
  "The Almoravids take Badajoz and its lands, including Lisbon.": "Les Almoravids prennent Badajoz et ses terres, y compris Lisbonne."
  "Rodrigo Díaz, El Cid, takes Valencia after a twenty-month siege and rules it as his own.": "Rodrigo Díaz, El Cid, prend Valence après vingt mois de siège et la règle comme le sien."
  "Peter I of Aragon takes Huesca after the battle of Alcoraz.": "Pierre I d’Aragon prend Huesca après la bataille d’Alcoraz."
  "Nicaea surrenders to Byzantium during the First Crusade; in 1097–1098 John Doukas recovers the west coast and its river valleys.": "Nicée se rend à Byzance pendant la première croisade ; en 1097–1098, John Doukas récupère la côte ouest et ses vallées fluviales."
  "Magnus Barefoot’s expedition. Scotland recognises Norwegian rule over the Hebrides and Man (the Kingdom of the Isles).": "L’Écosse reconnaît la domination norvégienne sur les Hébrides et l’Homme (le Royaume des Îles)."
  "Baldwin of Boulogne takes over Edessa and founds the first crusader state.": "Baldwin de Boulogne reprend Edessa et trouve le premier état croisé."
  "The crusaders take Antioch; Bohemond of Taranto founds the Principality of Antioch.": "Les croisés prennent Antioche ; Bohemond de Tarente fonde la Principauté d’Antioche."
  "The crusaders take Antioch, with the land around Maarat and Albara to the south-east.": "Les croisés prennent Antioche, avec la terre autour de Maarat et Albara au sud-est."
  "The Fatimids retake Jerusalem from the Artuqid governors.": "Les Fatimides reprennent Jérusalem des gouverneurs d’Artuqid."
  "The crusaders take Jerusalem and massacre much of its population; Godfrey of Bouillon rules the new Kingdom of Jerusalem. Jaffa and Galilee are taken the same year.": "Les croisés prennent Jérusalem et massacrent une grande partie de sa population ; Godfrey de Bouillon gouverne le nouveau Royaume de Jérusalem. Jaffa et Galilée sont prises la même année."
  "historical-basemaps world_1100 (automatic draft, partly hand-corrected)": "historical-basemaps world_1100 (ébauche automatique partiellement corrigée à la main)"
  "About 1100. As Great Seljuk power in the west breaks up, Turkish dynasties hold the east: the Saltukids at Erzurum, the Mengujekids at Erzincan, the Artuqids around Diyarbakır and Mardin, and the Shah-Armens at Ahlat.": "Vers 1100. Alors que la Grande puissance de Seljuk dans l’ouest se brise, les dynasties turques tiennent l’est : les Saltukids à Erzurum, les Mengujekids à Erzincan, les Artuqids autour de Diyarbakır et Mardin, et les Shah-Armens à Ahlat."
  "Genoa and Pisa, the leading sea powers of the western Mediterranean, govern themselves as communes.": "Gênes et Pise, les principales puissances maritimes de la Méditerranée occidentale, se gouvernent comme des communes."
  "The Principality of Antioch takes the Cilician plain with Tarsus, Adana and Mamistra.": "La Principauté d’Antioche prend la plaine cilicienne avec Tarse, Adana et Mamistra."
  "King Baldwin I takes Arsuf and Caesarea; Haifa fell in 1100.": "Le roi Baldwin I prend Arsuf et Césarée ; Haïfa est tombé en 1100."
  "The Danishmendids take Melitene.": "Les Danois prennent Melitene."
  "Coloman of Hungary is crowned king of Croatia at Biograd. Croatia stays a separate kingdom in union with Hungary, shown here on its own until 1527.": "Coloman de Hongrie est couronné roi de Croatie à Biograd. La Croatie reste un royaume séparé en union avec la Hongrie, montré ici sur son propre jusqu’en 1527."
  "Raymond of Toulouse takes Tortosa (Tartus).": "Raymond de Toulouse prend Tortosa (Tartus)."
  "Jimena, El Cid’s widow, abandons Valencia, which the Almoravids occupy.": "Jimena, la veuve d’El Cid, abandonne Valence, que les Almoravids occupent."
  "Tancred of Antioch takes Latakia from Byzantium.": "Tancré d’Antioche prend Latakia de Byzance."
  "Marash passes to the County of Edessa.": "Marash passe au comté d’Edessa."
  "Battle of Uclés. The Almoravids defeat Castile and retake the land south-east of Toledo.": "Bataille d’Uclés. Les Almoravids ont vaincu la Castille et repris la terre au sud-est de Tolède."
  "Tripoli surrenders after a siege of several years; it becomes the capital of the County of Tripoli.": "Tripoli se rend après un siège de plusieurs années ; il devient la capitale du comté de Tripoli."
  "Baldwin I takes Beirut and Sidon; Tyre follows in 1124.": "Baldwin I prend Beyrouth et Sidon ; Tyr suit en 1124."
  "The Almoravids take Zaragoza, the last independent taifa.": "Les Almoravids prennent Saragosse, la dernière taifa indépendante."
  "Baldwin I builds Montréal (Shobak) and extends the kingdom beyond the Jordan to Ayla on the Red Sea (1116); Kerak is built in 1142.": "Baldwin Ier construit Montréal (Shobak) et étend le royaume au-delà du Jourdain jusqu’à Ayla sur la mer Rouge (1116) ; Kerak est construit en 1142."
  "The Almoravids occupy Mallorca after the Pisan–Catalan raid of 1114–15.": "Les Almoravids occupent Majorque après le raid Pisan-Catalan de 1114–1115."
  "Alfonso I of Aragon, the Battler, takes Zaragoza.": "Alfonso I d’Aragon, le Batailleur, prend Saragosse."
  "John II retakes Laodicea (1119) and Sozopolis (1120).": "Jean II reprend Laodicée (1119) et Sozopolis (1120)."
  "Alfonso I takes Tudela.": "Alfonso, je prends Tudela."
  "Provence is partitioned: the counts of Barcelona keep Provence south of the Durance, the counts of Toulouse take the march north of it (the later Comtat Venaissin).": "La Provence est divisée : les comtes de Barcelone gardent la Provence au sud de la Durance, les comtes de Toulouse prennent la marche au nord de celle-ci (le plus tard Comtat Venaissin)."
  "Imad al-Din Zengi becomes atabeg of Mosul, with the Kurdish mountains to the north.": "Imad al-Din Zengi devient atabeg de Mossoul, avec les montagnes kurdes au nord."
  "Duke William of Apulia dies childless; Roger II of Sicily claims and conquers Apulia and Calabria. Roger also annexes Malta.": "Le duc Guillaume d’Apulia meurt sans enfant ; Roger II de Sicile revendique et conquiert les Pouilles et la Calabre."
  "Imad al-Din Zengi, atabeg of Mosul, takes Aleppo.": "Imad al-Din Zengi, atabeg de Mossoul, prend Alep."
  "Battle of São Mamede. Afonso Henriques defeats his mother’s party and rules the County of Portugal as his own.": "Bataille de São Mamede. Afonso Henriques défait son parti maternel et dirige le comté du Portugal comme le sien."
  "Mstislav the Great dies, and Kievan Rus' breaks up into rival principalities under branches of the Rurikid dynasty; Novgorod becomes a republic in 1136.": "Mstislav le Grand meurt, et Kievan Rus se sépare en principautés rivales sous les branches de la dynastie rurikide ; Novgorod devient une république en 1136."
  "Alfonso I dies childless. Pamplona elects García Ramírez as king, with Tudela, Álava and Gipuzkoa; Aragon keeps Zaragoza.": "Alfonso I meurt sans enfant. Pampelune élit García Ramírez comme roi, avec Tudela, Álava et Gipuzkoa ; Aragon garde Saragosse."
  "Roger II conquers the Principality of Capua.": "Roger II conquiert la Principauté de Capoue."
  "First Treaty of Durham. During the Anarchy, David I of Scotland keeps Cumbria.": "Premier traité de Durham. Pendant l’anarchie, David Ier d’Écosse garde Cumbria."
  "John II subdues Cilicia and captures the Armenian prince Leo I.": "Jean II soumet Cilicia et capture le prince arménien Léon I."
  "Béla II takes Bosnia (Rama), which is ruled by bans under Hungarian overlordship.": "Béla II prend la Bosnie (Rama), qui est gouvernée par des interdictions sous l’emprise hongroise."
  "Petronilla of Aragon is betrothed to Count Ramon Berenguer IV of Barcelona, joining Aragon and the Catalan counties in the Crown of Aragon.": "Petronilla d’Aragon est fiancée au comte Ramon Berenguer IV de Barcelone, rejoignant Aragon et les comtés catalans dans la couronne d’Aragon."
  "After the Treaty of Mignano, in which Pope Innocent II recognises Roger II as king, Naples submits; the last independent duchy in the south ends.": "Après le traité de Mignano, dans lequel le pape Innocent II reconnaît Roger II comme roi, Naples se soumet ; le dernier duché indépendant au sud s’achève."
  "Second Treaty of Durham. Stephen grants the earldom of Northumberland to David’s son Henry.": "Deuxième traité de Durham. Stephen accorde le comte de Northumberland au fils de David, Henry."
  "Roger II’s sons conquer the Abruzzi.": "Les fils de Roger II conquièrent les Abruzzes."
  "Geoffrey Plantagenet, count of Anjou, takes Rouen and becomes duke of Normandy, which passes out of the English king’s hands during the Anarchy.": "Geoffrey Plantagenet, comte d’Anjou, prend Rouen et devient duc de Normandie, qui s’efface des mains du roi anglais pendant l’anarchie."
  "Zengi takes Edessa after a four-week siege.": "Zengi prend Edessa après un siège de quatre semaines."
  "The Almohads take Ceuta and Melilla.": "Les Almohades prennent Ceuta et Melilla."
  "The Almoravid state collapses. The Almohads take Seville and western al-Andalus; Ibn Mardanish, the “Wolf King”, rules Murcia and Valencia.": "Les Almohades prennent Séville et l’ouest d’al-Andalus ; Ibn Mardanish, le roi des loups, règne sur Murcie et Valence."
  "Alfonso VII of Castile takes Calatrava.": "Alfonso VII de Castille prend Calatrava."
  "Afonso Henriques takes Santarém.": "Afonso Henriques prend Santarém."
  "Alfonso VII, with Genoese, Pisan and Catalan help, takes Almería.": "Alfonso VII, avec l’aide de Genoese, Pisan et Catalan, prend Almería."
  "Afonso Henriques takes Lisbon with the help of crusaders sailing to the Holy Land.": "Afonso Henriques prend Lisbonne avec l’aide de croisés naviguant en Terre Sainte."
  "The Banu Ghaniya governors keep Mallorca as an independent Almoravid state.": "Les gouverneurs de Banu Ghaniya gardent Majorque en tant qu’État Almoravid indépendant."
  "Ramon Berenguer IV takes Tortosa.": "Ramon Berenguer IV prend Tortosa."
  "Sultan Mesud of Rum takes Marash.": "Le sultan Mesud de Rum prend Marash."
  "Ramon Berenguer IV takes Lleida.": "Ramon Berenguer IV prend Lleida."
  "Countess Beatrice sells the rest of the County of Edessa to Byzantium, which loses it to Nur al-Din and Rum within a year.": "La comtesse Beatrice vend le reste du comté d’Edessa à Byzance, qui le perd à Nur al-Din et Rum en un an."
  "Thoros II recovers the Cilician plain for the Armenians; in 1158 he accepts Manuel I as overlord.": "Thoros II récupère la plaine cilicienne pour les Arméniens ; en 1158, il accepte Manuel I comme un seigneur excessif."
  "Baldwin III takes Ascalon, the last Fatimid stronghold in Palestine.": "Baldwin III prend Ascalon, le dernier bastion fatimide en Palestine."
  "Zengi’s son Nur al-Din takes Damascus.": "Le fils de Zengi Nur al-Din prend Damas."
  "Henry II is crowned king of England. Count of Anjou, Maine and Touraine and duke of Normandy, and since his marriage to Eleanor in 1152 duke of Aquitaine too, he holds more of France than the French king; Brittany comes under his family in 1166.": "Henri II est couronné roi d’Angleterre. Comte d’Anjou, Maine et Touraine et duc de Normandie, et depuis son mariage avec Eleanor en 1152 duc d’Aquitaine aussi, il détient plus de France que le roi français ; la Bretagne relève de sa famille en 1166."
  "Henry II makes Malcolm IV return Cumbria and Northumberland.": "Henry II fait revenir Malcolm IV Cumbria et Northumberland."
  "Alfonso VII dies; León (with Galicia and Salamanca) and Castile are divided between his sons. The Almohads retake Almería.": "Alfonso VII meurt ; León (avec Galice et Salamanque) et Castille sont divisés entre ses fils. Les Almohades reprennent Almería."
  "Nur al-Din defeats the crusaders at Harim and takes the fortress.": "Nur al-Din bat les croisés à Harim et prend la forteresse."
  "Gerald the Fearless takes Évora for Portugal; the Portuguese settle the frontier to the Tagus and beyond.": "Gerald l’Intrépide prend Évora pour le Portugal ; les Portugais installent la frontière au Tage et au-delà."
  "Manuel I’s victory at Sirmium confirms Byzantine rule over Syrmia, Bosnia and Dalmatia, taken in the war that began in 1162.": "La victoire de Manuel II à Sirmium confirme la domination byzantine sur la Syrmie, la Bosnie et la Dalmatie, prise dans la guerre qui a commencé en 1162."
  "Valdemar I and Bishop Absalon take Arkona. The princes of Rügen become Danish vassals.": "Valdemar Ier et Mgr Absalon prennent Arkona. Les princes de Rügen deviennent des vassaux danois."
  "Anglo-Norman knights invited by Diarmait Mac Murchada, the deposed king of Leinster, land at Bannow Bay and take the Norse town of Wexford.": "Les chevaliers anglo-normains invités par Diarmait Mac Murchada, le roi de Leinster déposé, débarquent à Bannow Bay et prennent la ville nordique de Wexford."
  "Strongbow (Richard de Clare) storms Waterford.": "Strongbow (Richard de Clare) s’empare de Waterford."
  "Strongbow and Diarmait take Dublin; its Norse king Ascall flees.": "Strongbow et Diarmait prennent Dublin ; son roi norvégien Ascall fuit."
  "Alfonso II of Aragon founds Teruel.": "Alfonso II d’Aragon a trouvé Teruel."
  "Saladin, vizier of Egypt since 1169, ends the Fatimid caliphate; he took Ayla in 1170.": "Saladin, vizir de l’Egypte depuis 1169, termine le califat fatimide ; il prend Ayla en 1170."
  "Henry II lands at Waterford. Strongbow, lord of Leinster since Diarmait’s death, and many Irish kings submit to him, and the Lordship of Ireland begins. Meath is granted to Hugh de Lacy in 1172.": "Henri II débarque à Waterford. Strongbow, seigneur de Leinster depuis la mort de Diarmait, et beaucoup de rois irlandais se soumettent à lui, et le Seigneurship d’Irlande commence. Meath est accordé à Hugh de Lacy en 1172."
  "Count Girard II of Roussillon leaves his county to Alfonso II of Aragon.": "Le comte Girard II de Roussillon quitte son comté à Alfonso II d’Aragon."
  "Ibn Mardanish dies; Murcia and Valencia submit to the Almohads.": "Ibn Mardanish meurt ; Murcie et Valence se soumettent aux Almohades."
  "After Nur al-Din’s death Saladin takes Damascus, and Homs and Hama in 1175.": "Après la mort de Nur al-Din, Saladin prend Damas et Homs et Hama en 1175."
  "John de Courcy conquers eastern Ulster, and the Anglo-Normans take Cork.": "John de Courcy conquiert l’Ulster oriental, et les Anglo-Normans prennent Cork."
  "Alfonso VIII of Castile takes Cuenca.": "Alfonso VIII de Castille prend Cuenca."
  "By 1178 Kılıç Arslan II of Rum has absorbed the Danishmendid lands, taking Sivas (about 1174) and Melitene.": "Par 1178 Kılıç Arslan II de Rhum a absorbé les terres mendies danoises, prenant Sivas (environ 1174) et Melitene."
  "Manuel I dies. Béla III of Hungary recovers Syrmia and Dalmatia; Ban Kulin rules Bosnia as an independent banate.": "Manuel Ier meurt. Béla III de Hongrie récupère Syrmia et Dalmatie ; Ban Kulin règne sur la Bosnie comme un banate indépendant."
  "Saladin takes Edessa and the Jazira; Kılıç Arslan II takes Sozopolis from Byzantium.": "Saladin prend Edessa et la Jazira ; Kılıç Arslan II prend Sozopolis de Byzance."
  "Saladin takes Aleppo, after the Jazira (1182).": "Saladin prend Alep, après la Jazira (1182)."
  "Prince John’s expedition. Louth and Tipperary are granted to Anglo-Norman lords.": "Expédition du prince John. Louth et Tipperary sont accordés aux seigneurs anglo-normains."
  "The brothers Asen and Peter rise against Byzantium at Tarnovo. By 1187 the Second Bulgarian Empire holds the land between the Danube and the Balkan range.": "Les frères Asen et Pierre se lèvent contre Byzance à Tarnovo. En 1187, le Second Empire bulgare détient la terre entre le Danube et les Balkans."
  "Stefan Nemanja of Serbia conquers Duklja (Zeta) with its coastal towns.": "Stefan Nemanja de Serbie conquiert Duklja (Zeta) avec ses villes côtières."
  "After his victory at Hattin (4 July), Saladin takes Acre, Sidon and Beirut, and Jerusalem surrenders on 2 October. Tyre holds out; Kerak (1188) and Montréal (1189) fall after long sieges.": "Après sa victoire à Hattin (4 juillet), Saladin prend Acre, Sidon et Beyrouth, et Jérusalem se rend le 2 octobre. Tyr tient ; Kerak (1188) et Montréal (1189) tombent après de longs sièges."
  "Saladin takes Latakia.": "Saladin prend Latakia."
  "After the battle on the Morava, Byzantium recognises Stefan Nemanja’s Serbia, which keeps Kosovo, Toplica and the upper Morava valley.": "Après la bataille sur le Morava, Byzance reconnaît Stefan Nemanjas Serbie, qui garde le Kosovo, Toplica et la haute vallée du Morava."
  "The Almohad caliph Yaqub al-Mansur retakes Alcácer do Sal and the land south of the Tagus except Évora.": "Le calife Almohad Yaqub al-Mansur reprend Alcácer do Sal et la terre au sud du Tage, à l’exception d’Évora."
  "Emperor Henry VI grants Monaco to Genoa.": "L’empereur Henri VI accorde Monaco à Gênes."
  "Acre surrenders to the armies of the Third Crusade.": "Acre se rend aux armées de la troisième croisade."
  "Count Philip of Flanders dies at Acre. Artois, the dowry of his niece Isabella of Hainaut, passes to her son, the future Louis VIII, and so to the French crown.": "Le comte Philippe de Flandre meurt à Acre. Artois, la dot de sa nièce Isabella du Hainaut, passe à son fils, le futur Louis VIII, et ainsi à la couronne française."
  "Treaty of Jaffa. Richard I and Saladin agree a three-year truce; the coast from Tyre to Jaffa stays with the crusaders, the interior and Jerusalem with Saladin.": "Traité de Jaffa. Richard I et Saladin conviennent d’une trêve de trois ans ; la côte de Tyr à Jaffa reste avec les croisés, l’intérieur et Jérusalem avec Saladin."
  "Asen takes Sofia and the upper Struma valley; Vidin and the north-west also pass to Bulgaria.": "Asen prend Sofia et la haute vallée de Struma ; Vidin et le nord-ouest passent également vers la Bulgarie."
  "Battle of Alarcos. The Almohads defeat Alfonso VIII and retake Calatrava.": "Bataille d’Alarcos. Les Almohades ont vaincu Alfonso VIII et repris Calatrava."
  "Richard I gives the Agenais to Raymond VI of Toulouse as the dowry of his sister Joan.": "Richard Ier donne l’Agenais à Raymond VI de Toulouse comme la dot de sa sœur Joan."
  "Limerick receives a charter as an English town; the Anglo-Normans settle the county.": "Limerick reçoit une charte en tant que ville anglaise ; les Anglo-Normans s’installent dans le comté."
  "The crusade of Emperor Henry VI recovers Beirut and Byblos.": "La croisade de l’empereur Henry VI récupère Beyrouth et Byblos."
  "Pope Innocent III takes over the Duchy of Spoleto and the March of Ancona.": "Le pape Innocent III reprend le duché de Spoleto et la marche d’Ancone."
  "historical-basemaps world_1200 (automatic draft, partly hand-corrected)": "historical-basemaps world_1200 (ébauche automatique partiellement corrigée à la main)"
  "Alfonso VIII of Castile takes Álava and Gipuzkoa from Navarre.": "Alfonso VIII de Castille prend Álava et Gipuzkoa de Navarre."
  "Danish forces take Holstein, Hamburg and Lübeck. Danish overlordship north of the Elbe lasts until 1227.": "Les forces danoises prennent Holstein, Hambourg et Lübeck. Le surfeur danois au nord de l’Elbe dure jusqu’en 1227."
  "Tsar Kaloyan takes Varna.": "Le tsar Kaloyan prend Varna."
  "Süleyman II of Rum ends the Saltukid emirate of Erzurum.": "Süleyman II de Rhum termine l’émirate de Saltukid d’Erzurum."
  "The Fourth Crusade takes Zara (Zadar) for Venice.": "La Quatrième Croisade prend Zara (Zadar) pour Venise."
  "Kaloyan takes Belgrade and Braničevo from Hungary, Niš and most of Macedonia from Byzantium (1202–1203).": "Kaloyan prend Belgrade et Braničevo de Hongrie, Niš et la plupart de Macédoine de Byzance (1202–1203)."
  "The Almohads conquer Mallorca from the Banu Ghaniya.": "Les Almohades conquirent Majorque du Banu Ghaniya."
  "The Fourth Crusade takes Constantinople. The Latins claim north-western Asia Minor; Theodore Laskaris holds the rest of Byzantine Anatolia from Nicaea. Alexios and David Komnenos, with Georgian help, found the Empire of Trebizond and take the Paphlagonian coast.": "La quatrième croisade prend Constantinople. Les latins revendiquent l’Asie Mineure du nord-ouest ; Theodore Laskaris détient le reste de l’Anatolie Byzantine de Nicée. Alexios et David Komnenos, avec l’aide géorgienne, ont trouvé l’Empire de Trebizonde et prendre la côte Paphlagonienne."
  "The Fourth Crusade sacks Constantinople. Baldwin of Flanders is crowned Latin emperor, with Thrace as his share; Boniface of Montferrat founds the Kingdom of Thessalonica.": "La quatrième croisade sac Constantinople. Baldwin de Flandre est couronné empereur latin, avec Thrace comme sa part ; Boniface de Montferrat fonde le royaume de Thessalonique."
  "Rouen surrenders to Philip II. After two years of war he has taken Normandy, Anjou, Maine and Touraine from King John.": "Rouen se rend à Philippe II. Après deux ans de guerre, il a pris la Normandie, Anjou, Maine et Touraine du roi Jean."
  "The crusaders conquer southern Greece: William of Champlitte and Geoffrey of Villehardouin found the Principality of Achaea, Othon de la Roche the lordship of Athens and Thebes. Michael Komnenos Doukas holds Epirus; Venice takes Ragusa and Dyrrhachium.": "Les croisés conquirent la Grèce du Sud : Guillaume de Champlitte et Geoffrey de Villehardouin ont trouvé la Principauté d’Achaea, l’Othon de la Roche la seigneurie d’Athènes et de Thebes. Michael Komnenos Doukas tient Epirus ; Venise prend Ragusa et Dyrrachium."
  "Kaloyan destroys the Latin army at Adrianople and captures Emperor Baldwin; Bulgaria takes the Thracian plain north of Adrianople.": "Kaloyan détruit l’armée latine à Adrianople et capture l’empereur Baldwin ; la Bulgarie prend la plaine thrace au nord d’Adrianople."
  "Queen Tamar’s Georgian army takes Kars, after Ani in 1199.": "L’armée géorgienne prend Kars, après Ani en 1199."
  "Marco Sanudo founds the Duchy of the Archipelago in the Cyclades; Venice occupies Corfu.": "Marco Sanudo a trouvé le duché de l’archipel dans les Cyclades ; Venise occupe Corfou."
  "Kaykhusraw I of Rum takes Attaleia (Antalya).": "Kaykhusraw I de Rum prend Attaleia (Antalya)."
  "Emperor Henry defeats Tsar Boril near Philippopolis; the plain of Plovdiv returns to the Latin Empire.": "L’empereur Henry bat le tsar Boril près de Philippopolis ; la plaine de Plovdiv revient à l’Empire Latin."
  "The Lombard lords of Euboea (Negroponte) accept Venetian overlordship.": "Les seigneurs lombards d’Euboea (Negroponte) acceptent la domination vénitienne."
  "Venice, which bought Crete from Boniface in 1204, completes its conquest of the island.": "Venise, qui a acheté la Crète à Boniface en 1204, complète sa conquête de l’île."
  "The crusading army of Alfonso VIII retakes Calatrava on its march south; on 16 July Castile, Aragon and Navarre crush the Almohads at Las Navas de Tolosa.": "L’armée croisée d’Alfonso VIII reprend Calatrava sur sa marche au sud ; le 16 juillet Castille, Aragon et Navarre écrasent les Almohades à Las Navas de Tolosa."
  "Michael I of Epirus takes Dyrrhachium from Venice.": "Michael I d’Epire prend Dyrrachium de Venise."
  "Philip II’s forces seize Auvergne.": "Les forces de Philippe II saisissent Auvergne."
  "Alfonso VIII takes Alcaraz.": "Alfonso VIII prend Alcaraz."
  "Nicaea takes Heraclea and Amastris from David Komnenos.": "Nicée prend Heraclea et Amastris de David Komnenos."
  "Michael I of Epirus takes Corfu from Venice.": "Michael I d’Epire prend Corfou de Venise."
  "Kaykaus I of Rum takes Sinope and captures Alexios I of Trebizond.": "Kaykaus I de Rum prend Sinope et capture Alexios I de Trebizond."
  "Portugal, helped by crusaders, takes Alcácer do Sal.": "Le Portugal, aidé par les croisés, prend Alcácer do Sal."
  "Battle of Lyndanisse (Tallinn). Valdemar II begins the Danish conquest of northern Estonia.": "Bataille de Lyndanisse (Tallinn). Valdemar II commence la conquête danoise du nord de l’Estonie."
  "Grand Prince Yuri II of Vladimir founds Nizhny Novgorod where the Oka meets the Volga.": "Le Grand Prince Yuri II de Vladimir a trouvé Nijni Novgorod où l’Oka rencontre la Volga."
  "The fall of Tarbatu (Tartu). Southern Estonia passes to the Livonian Brothers of the Sword and the Bishops of Riga and Dorpat (shown as the Order).": "La chute de Tarbatu (Tartu). L’Estonie du Sud passe aux Frères livoniens de l’Épée et aux Evêques de Riga et Dorpat (présentés comme l’Ordre)."
  "La Rochelle surrenders to Louis VIII. Poitou and Saintonge are lost to the English crown, and the lords of the Limousin, Périgord and the Gascon borderlands turn to France; Henry III keeps only Gascony.": "La Rochelle se rend à Louis VIII. Poitou et Saintonge sont perdus à la couronne anglaise, et les seigneurs du Limousin, du Périgord et des frontières de Gascon se tournent vers la France ; Henri III ne garde que la Gascogne."
  "Theodore Komnenos Doukas of Epirus takes Thessalonica and ends the Latin kingdom; he is crowned emperor.": "Theodore Komnenos Doukas d’Epire prend Thessalonique et termine le royaume latin ; il est couronné empereur."
  "After the battle of Poimanenon (1224) the Latins keep only Nicomedia and the shore opposite Constantinople.": "Après la bataille de Poimanenon (1224), les Latins ne gardent que Nicomedia et le rivage en face de Constantinople."
  "Theodore takes Adrianople and western Thrace. In Asia Minor, the Empire of Nicaea takes the Aegean islands from the Latins.": "Théodore prend Adrianople et Thrace occidentale. En Asie Mineure, l’Empire de Nicée prend les îles Égées des Latins."
  "The Sword Brothers take Danish Estonia and Saaremaa while Valdemar II is weakened by his captivity (1223–1225).": "Les frères Sword prennent l’Estonie danoise et Saaremaa tandis que Valdemar II est affaibli par sa captivité (1223-1225)."
  "Battle of Bornhöved. Denmark loses Holstein, Hamburg and Lübeck; Rügen stays Danish.": "Bataille de Bornhöved. Le Danemark perd Holstein, Hambourg et Lübeck ; Rügen reste danois."
  "Kayqubad I ends the Mengujekid emirate of Erzincan.": "Kayqubad Je termine l’émirat de Mengujekid d’Erzincan."
  "Almohad rule in al-Andalus collapses. Ibn Hud, proclaimed at Murcia, wins most of the south; Zayyan ibn Mardanish rules Valencia.": "Ibn Hud, proclamé à Murcie, gagne la plus grande partie du sud ; Zayyan ibn Mardanish dirige Valence."
  "Treaty of Jaffa. Sultan al-Kamil cedes Jerusalem, Bethlehem and a corridor to the coast to Emperor Frederick II.": "Traité de Jaffa. Sultan al-Kamil cède Jérusalem, Bethléem et un couloir vers la côte à l’empereur Frédéric II."
  "Treaty of Paris (Meaux) ends the Albigensian Crusade. Raymond VII keeps Toulouse, Quercy, Rouergue and the Agenais for his lifetime; lower Languedoc (Carcassonne, Béziers, Nîmes) and Foix pass to the French crown.": "Le Traité de Paris (Meaux) met fin à la croisade albigenoise. Raymond VII garde Toulouse, Quercy, Rouergue et les Agenais pour sa vie ; le Languedoc inférieur (Carcassonne, Béziers, Nîmes) et Foix passent à la couronne française."
  "Alfonso IX of León takes Cáceres.": "Alfonso IX de León prend Cáceres."
  "James I of Aragon takes Madina Mayurqa (Palma); the conquest of Mallorca follows.": "Jacques Ier d’Aragon prend Madina Mayurqa (Palma) ; la conquête de Majorque suit."
  "Alfonso IX takes Mérida and Badajoz.": "Alfonso IX prend Mérida et Badajoz."
  "Treaty of Kruszwica. Duke Konrad of Masovia grants Chełmno Land to the Teutonic Order as a base against the Prussians.": "Traité de Kruszwica. Le duc Konrad de Masovia accorde Chełmno Land à l’Ordre Teutonique comme base contre les Prussiens."
  "Ivan Asen II defeats and captures Theodore at Klokotnitsa and takes Thrace, Macedonia and Albania. Theodore’s brother Manuel keeps Thessalonica as a Bulgarian vassal.": "Ivan Asen II bat et capture Théodore à Klokotnitsa et prend Thrace, Macédoine et Albanie. Le frère de Theodore Manuel garde Thessalonique comme vassal bulgare."
  "Kayqubad I defeats the Khwarazmshah Jalal al-Din at Yassıçemen and takes Ahlat and the Lake Van region.": "Kayqubad I bat le Khwarazmshah Jalal al-Din à Yassiçemen et prend Ahlat et la région du lac Van."
  "Alfonso IX dies; his son Ferdinand III of Castile inherits León, and the two crowns are joined for good.": "Alfonso IX meurt ; son fils Ferdinand III de Castille hérite León, et les deux couronnes sont unies pour de bon."
  "About 1230–1233. Hungary organises the Banate of Severin in Oltenia.": "De 1230 à 1233. La Hongrie organise le Banate of Severin à Oltenia."
  "James I takes Burriana and Peñíscola, beginning the conquest of Valencia.": "James I prend Burriana et Peñíscola, commençant la conquête de Valence."
  "Rum takes Harput from the Artuqids.": "Le rhum prend Harput des Artuqides."
  "Ibn Mahfuz rules Niebla and the Algarve as an independent taifa.": "Ibn Mahfuz gouverne Niebla et l’Algarve en tant que taifa indépendante."
  "Nicaea takes Nicomedia and the Asian shore of the Bosporus.": "Nicée prend Nicomedia et la rive asiatique du Bospore."
  "Nicaea, allied with Bulgaria against the Latins, takes Gallipoli and the Thracian coast.": "Nicée, alliée à la Bulgarie contre les Latins, prend Gallipoli et la côte thrace."
  "Richard de Burgh conquers Connacht; the O’Conor kings keep only the “King’s cantreds” around Roscommon.": "Richard de Burgh conquiert Connacht ; les rois d’O-Conor ne gardent que les Cantres du Roi autour de Roscommon."
  "The Mongols conquer Volga Bulgaria and destroy its cities.": "Les Mongols conquirent la Volga Bulgarie et détruisent ses villes."
  "Ferdinand III takes Córdoba.": "Ferdinand III prend Cordoue."
  "Muhammad ibn al-Ahmar, founder of the Nasrid dynasty, enters Granada; Málaga and Almería accept him. Portugal takes Mértola and the land around Beja.": "Muhammad ibn al-Ahmar, fondateur de la dynastie nasride, entre à Grenade ; Málaga et Almería l’acceptent. Le Portugal prend Mértola et les terres autour de Beja."
  "Treaty of Stensby. The Teutonic Order returns northern Estonia to Denmark.": "Traité de Stensby. L’Ordre Teutonique retourne le nord de l’Estonie au Danemark."
  "Zayyan surrenders Valencia to James I.": "Zayyan rend Valence à James Ier."
  "Batu's armies defeat the Cumans and take the steppe from the Dniester to the Volga.": "Les armées de Batu battent les Cuman et prennent la steppe du Dniestr à la Volga."
  "Starting state. The Holy Roman Empire is drawn as one polity until 1500; Bohemia and Moravia are a kingdom of the Empire with their own ruler, and the Burgenland belongs to Hungary.": "État de départ. Le Saint Empire romain est dessiné comme une seule politique jusqu’à 1500 ; la Bohême et la Moravie sont un royaume de l’Empire avec leur propre dirigeant, et le Burgenland appartient à la Hongrie."
  "Sweden at War border state “1240”": "Frontières d’après Sweden at War “1240”"
  "Treaties made during the crusade of Theobald of Champagne and Richard of Cornwall (1239–1241) return Ascalon, Beaufort and much of Galilee to the kingdom.": "Les traités conclus lors de la croisade de Theobald de Champagne et Richard de Cornwall (1239–1241) ramènent Ascalon, Beaufort et une grande partie de Galilée au royaume."
  "After the Mongol invasion of 1241–1242, the steppe east of the Carpathians and the Wallachian plain come under the Golden Horde.": "Après l’invasion mongole de 1241-1242, la steppe à l’est des Carpates et la plaine wallachienne passent sous la Horde d’or."
  "Batu founds his capital at Sarai on the lower Volga. The western part of the Mongol Empire becomes the Golden Horde (the Ulus of Jochi), and the Rus' princes rule as its tributaries.": "Batu fonde sa capitale à Saraï sur la basse Volga. La partie occidentale de l’Empire mongol devient la Horde d’or (l’Ulus de Jochi), et les princes de Rus règnent comme ses affluents."
  "Treaty of Alcaraz. The taifa of Murcia submits to Castile.": "Traité d’Alcaraz. La taifa de Murcie se soumet à la Castille."
  "Battle of Köse Dağ. The Mongols defeat Kaykhusraw II; Rum becomes a Mongol vassal and the east comes under the Mongols, from 1256 the Ilkhanate.": "Bataille de Köse Dağ. La défaite des Mongols Kaykhusraw II ; le rhum devient un vassal mongol et l’est passe sous les Mongols, à partir de 1256 l’Ilkhanate."
  "Khwarazmian troops in Ayyubid service sack Jerusalem; it never returns to crusader rule.": "Les troupes de Khwarazmian dans le service ayyoubid sac Jérusalem ; il ne revient jamais à la domination croisé."
  "James I takes Biar, completing the conquest of the Kingdom of Valencia to the line agreed at Almizra.": "Jacques I prend Biar, complétant la conquête du Royaume de Valence à la ligne convenue à Almizra."
  "Pact of Jaén. Muhammad I surrenders Jaén and becomes Ferdinand III’s vassal.": "Pacte de Jaén. Muhammad Je rends Jaén et devient Ferdinand III's vassal."
  "John III Vatatzes takes Thessalonica and, after the death of the young tsar Koloman, the Bulgarian lands in Thrace and Macedonia.": "Jean III Vatatzes prend Thessalonique et, après la mort du jeune tsar Koloman, les terres bulgares de Thrace et de Macédoine."
  "Béla IV organises the Banate of Macsó south of the Sava; Belgrade is Hungarian too.": "Béla IV organise le Banate de Macsó au sud de la Save ; Belgrade est également hongroise."
  "Tver becomes a principality of its own under Yaroslav Yaroslavich, Alexander Nevsky's brother.": "Tver devient sa propre principauté sous Yaroslav Yaroslavich, le frère d’Alexandre Nevsky."
  "The Ayyubids take Ascalon.": "Les Ayyubides prennent Ascalon."
  "Seville surrenders to Ferdinand III after a sixteen-month siege.": "Séville se rend à Ferdinand III après un siège de seize mois."
  "Afonso III of Portugal takes Faro and completes the conquest of the Algarve.": "Afonso III du Portugal prend Faro et complète la conquête de l’Algarve."
  "Sweden at War border state “1250”": "Frontières d’après Sweden at War “1250”"
  "Mamluk officers murder Sultan Turanshah; the Mamluks take power in Egypt.": "Des officiers mamelouks assassinent Sultan Turanshah ; les mamelouks prennent le pouvoir en Egypte."
  "Emperor Frederick II dies; the counts of Gorizia rule the upper Soča valley and the Karst as their own county.": "L’empereur Frédéric II meurt ; les comtes de Gorizia dominent la haute vallée de Soča et le Karst comme leur propre comté."
  "Emperor Frederick II dies and imperial power in Italy collapses. North and central Italy are a patchwork of city-states and lordships: Milan, Florence, Siena, Lucca, Genoa, Pisa and Venice, the Este at Ferrara, Savoy, Montferrat, the Patriarchate of Aquileia and many smaller communes.": "L’empereur Frédéric II meurt et le pouvoir impérial s’effondre en Italie. L’Italie du Nord et du Centre est un patchwork d’états-villes et de seigneuries : Milan, Florence, Sienne, Lucques, Gênes, Pise et Venise, l’Este à Ferrare, Savoie, Montferrat, le Patriarcat d’Aquileia et beaucoup de petites communes."
  "After the Babenberg line dies out, Ottokar of Bohemia takes the duchy of Austria.": "Après la mort de la ligne Babenberg, Ottokar de Bohême prend le duché d’Autriche."
  "The Livonian Order founds Memel castle (Klaipėda). The Memel land stays with the Order and its successors until 1920.": "L’Ordre livonien fonde le château de Memel (Klaipėda). La terre de Memel reste avec l’Ordre et ses successeurs jusqu’en 1920."
  "Pisa and its allies destroy the Judicate of Cagliari.": "Pise et ses alliés détruisent le Judice de Cagliari."
  "The Ilkhan Hülegü takes Upper Mesopotamia; the Mamluks, victorious at Ain Jalut, hold the land west of the Euphrates.": "L’Ilkhan Hülegü prend la Mésopotamie supérieure ; les Mamelouks, victorieux à Ain Jalut, détiennent la terre à l’ouest de l’Euphrate."
  "Peter of Savoy completes his conquest of the Vaud.": "Pierre de Savoie complète sa conquête du Vaud."
  "Bohemond VI of Antioch and Tripoli, allied with the Mongols, recovers Latakia.": "Bohemond VI d’Antioche et Tripoli, allié aux Mongols, récupère Latakia."
  "The Mamluks defeat the Mongols at Ain Jalut and take over Ayyubid Syria; Kerak follows in 1263. The Jazira east of the Euphrates stays Mongol.": "Les Mamelouks battent les Mongols à Ain Jalut et prennent le contrôle de la Syrie ayyoubide ; Kerak suit en 1263. La Jazira à l’est de l’Euphrate reste mongol."
  "Peace of Vienna. Béla IV of Hungary gives up Styria to Ottokar II of Bohemia.": "Paix de Vienne. Béla IV de Hongrie abandonne la Styrie à Ottokar II de Bohême."
  "Peace of Vienna after Kressenbrunn. Béla IV of Hungary gives up Styria to Ottokar.": "Paix de Vienne après Kressenbrunn. Béla IV de Hongrie abandonne Styrie à Ottokar."
  "Alexios Strategopoulos retakes Constantinople for Michael VIII Palaiologos; the Latin Empire ends.": "Alexios Strategopoulos reprend Constantinople pour Michael VIII Palaiologis ; l’Empire latin se termine."
  "Old Covenant. The Icelanders accept the king of Norway.": "Ancien pacte. Les Islandais acceptent le roi de Norvège."
  "Alfonso X of Castile takes Niebla and Cádiz.": "Alfonso X de Castille prend Niebla et Cadix."
  "Mastino I della Scala is elected captain of the people of Verona.": "Mastino I della Scala est élu capitaine du peuple de Vérone."
  "Baybars takes Caesarea, Haifa and Arsuf.": "Baybars prend Césarée, Haïfa et Arsuf."
  "Treaty of Perth. After the Battle of Largs, Norway cedes the Hebrides and Man to Scotland and keeps Orkney and Shetland.": "Traité de Perth. Après la bataille de Largs, la Norvège cède les Hébrides et l’Homme à l’Écosse et garde Orkney et Shetland."
  "By the Treaty of Viterbo, Charles of Anjou gains Corfu.": "Par le traité de Viterbo, Charles d’Anjou gagne Corfou."
  "Poreč submits to Venice (1267), the first of the Istrian coastal towns; Pula follows in 1331. Inner Istria stays with the counts of Gorizia and later the Habsburgs.": "Poreč se soumet à Venise (1267), la première des villes côtières d’Istrie ; Pula suit en 1331. L’Istrie intérieure reste avec les chefs de Gorizia et plus tard les Habsbourg."
  "Gilbert de Clare seizes the upland lordship of Senghenydd and begins Caerphilly Castle; the hills of Glamorgan and Gwent come under the Marcher lords.": "Gilbert de Clare s’empare de la seigneurie des montagnes de Senghenydd et commence le château de Caerphilly ; les collines de Glamorgan et Gwent passent sous les seigneurs des Marchers."
  "Baybars takes Jaffa.": "Baybars prend Jaffa."
  "Baybars takes Beaufort.": "Baybars prend Beaufort."
  "The Marinids, having taken Marrakesh, rule Morocco with its ports.": "Les Marinidés, ayant pris Marrakech, dominent le Maroc avec ses ports."
  "Ottokar II inherits Carniola and Carinthia from Duke Ulrich III.": "Ottokar II hérite de Carniola et Carinthie du Duc Ulrich III."
  "Ottokar inherits Carinthia and Carniola under the will of Duke Ulrich III.": "Ottokar hérite de Carinthie et Carniola sous la volonté du Duc Ulrich III."
  "Alphonse of Poitiers, count of Toulouse by marriage to Raymond VII’s daughter, dies without heirs. The county of Toulouse passes to the French crown.": "Alphonse de Poitiers, comte de Toulouse par mariage avec la fille de Raymond VII, meurt sans héritiers. Le comté de Toulouse passe à la couronne française."
  "Count Philip of Savoy acquires Bresse through his marriage to the heiress of Bâgé.": "Le comte Philippe de Savoie acquiert Bresse par son mariage avec l’héritière de Bâgé."
  "Charles of Anjou proclaims himself king of Albania at Durrës.": "Charles d’Anjou se proclame roi d’Albanie à Durrès."
  "Philip III hands the Comtat Venaissin to the papacy, as the Treaty of Paris of 1229 had promised. (The city of Avignon follows in 1348.)": "Philippe III remet le Comtat Venaissin à la papauté, comme l’avait promis le traité de Paris de 1229. (La ville d’Avignon suit en 1348.)"
  "Edward I grants Thomond (Clare) to Thomas de Clare.": "Edward I accorde Thomond (Clare) à Thomas de Clare."
  "James I of Aragon dies; Roussillon and Cerdagne pass with the Balearics to the Kingdom of Majorca under his younger son James II.": "Jacques Ier d’Aragon meurt ; Roussillon et Cerdagne passent avec les Baléares au Royaume de Majorque sous son fils cadet Jacques II."
  "James I dies. His younger son James II rules the Kingdom of Majorca (Mallorca, Ibiza, Roussillon and Montpellier, with overlordship of Muslim Menorca) under Aragonese suzerainty.": "Jacques Ier meurt. Son fils cadet James II gouverne le Royaume de Majorque (Mallorca, Ibiza, Roussillon et Montpellier, avec la domination musulmane Menorque) sous la suzeraineté aragonaise."
  "Treaty of Vienna. Ottokar gives up Austria, Styria, Carinthia and Carniola to King Rudolf of Habsburg.": "Traité de Vienne. Ottokar abandonne l’Autriche, la Styrie, la Carinthie et la Carniola au roi Rudolf de Habsbourg."
  "Treaty of Aberconwy. After Edward I’s first Welsh war, Llywelyn ap Gruffudd is left only Gwynedd west of the Conwy; the Perfeddwlad (the land between the Conwy and the Dee), Powys and the south-west pass to the English crown and its allies.": "Traité d’Aberconwy. Après la première guerre galloise d’Edward I, Llywelyn ap Gruffudd est laissé seulement Gwynedd à l’ouest du Conwy ; le Perfeddwlad (le pays entre le Conwy et le Dee), Powys et le sud-ouest passent à la couronne anglaise et ses alliés."
  "Rudolf of Habsburg recognises papal rule over Romagna and Bologna.": "Rudolf de Habsbourg reconnaît la domination papale sur la Romagne et Bologne."
  "The first paréage makes the bishop of Urgell and the count of Foix joint lords of Andorra.": "Le premier pariéage fait l’évêque d’Urgell et le comte de Foix co seigneurs d’Andorre."
  "historical-basemaps world_1279 (automatic draft, partly hand-corrected)": "historical-basemaps world_1279 (ébauche automatique partiellement corrigée à la main)"
  "Koper (Capodistria) submits to Venice; Izola and Piran follow by 1283.": "Koper (Capodistria) se soumet à Venise ; Izola et Piran suivent vers 1283."
  "Treaty of Amiens. Philip III gives the Agenais to Edward I, as the Treaty of Paris of 1259 had promised.": "Traité d’Amiens. Philippe III donne l’Agenais à Edward Ier, comme le traité de Paris de 1259 l’avait promis."
  "Thomas III of Savoy takes Turin.": "Thomas III de Savoie prend Turin."
  "Byzantium defeats the Angevins at Berat and holds central and southern Albania.": "Byzance bat les Angevins à Berat et détient l’Albanie centrale et méridionale."
  "Stefan Uroš II Milutin of Serbia takes Skopje and northern Macedonia, and Niš.": "Stefan Uroš II Milutin de Serbie prend Skopje et le nord de la Macédoine, et Niš."
  "The Sicilian Vespers. Peter III of Aragon lands at Trapani and is acclaimed king of Sicily; Charles of Anjou keeps the mainland, called the Kingdom of Naples.": "Les Vêpres siciliens. Pierre III d’Aragon pays à Trapani et est acclamé roi de Sicile ; Charles d’Anjou garde le continent, appelé le Royaume de Naples."
  "Rudolf enfeoffs his sons with Austria and Styria; Styria stays with the Habsburgs.": "Rudolf entre ses fils avec l’Autriche et la Styrie ; Styrie reste avec les Habsbourg."
  "Rudolf enfeoffs his sons with Austria and Styria, the start of Habsburg rule there.": "Rudolf enferme ses fils avec l’Autriche et la Styrie, le début de Habsbourg règne là."
  "Llywelyn’s brother Dafydd is captured. Edward I completes the conquest of Wales, which the Statute of Rhuddlan (1284) annexes to the English crown.": "Le frère de Llywelyn, Dafydd, est capturé. Edward I complète la conquête du Pays de Galles, que le Statut de Rhuddlan (1284) annexe à la couronne anglaise."
  "Stefan Dragutin, who abdicated the Serbian throne, receives Belgrade and Mačva from Hungary.": "Stefan Dragutin, qui abdique le trône serbe, reçoit Belgrade et Mačva de Hongrie."
  "Battle of Meloria. Genoa destroys the Pisan fleet; Pisa gives up Corsica, which passes to Genoa.": "Bataille de Meloria. Gênes détruit la flotte Pisane ; Pise abandonne la Corse, qui passe à Gênes."
  "In the Aragonese Crusade, James II of Majorca sided with France; his nephew Alfonso III of Aragon conquers Mallorca (November 1285) and Ibiza.": "Dans la croisade aragonaise, Jacques II de Majorque prend parti pour la France ; son neveu Alfonso III d’Aragon conquiert Majorque (novembre 1285) et Ibiza."
  "Alfonso III of Aragon conquers Menorca and expels or enslaves its Muslim population.": "Alfonso III d’Aragon conquiert Menorca et expulse ou asservit sa population musulmane."
  "Sultan Qalawun takes Latakia.": "Sultan Qalawun prend Latakia."
  "Pisa takes Gallura.": "Pise prend Gallura."
  "Qalawun takes Tripoli; the County of Tripoli ends.": "Qalawun prend Tripoli ; le comté de Tripoli se termine."
  "Dragutin and Milutin take Braničevo from the Bulgarian lords Darman and Kudelin.": "Dragutin et Milutin prennent Braničevo des seigneurs bulgares Darman et Kudelin."
  "Al-Ashraf Khalil takes Acre; Tyre, Sidon, Beirut, Haifa, Tortosa and Athlit are abandoned or surrender by August.": "Al-Ashraf Khalil prend Acre ; Tyr, Sidon, Beyrouth, Haïfa, Tortosa et Athlit sont abandonnés ou se rendent en août."
  "Uri, Schwyz and Unterwalden renew their alliance, the traditional founding of the Swiss Confederacy.": "Uri, Schwyz et Unterwalden renouvellent leur alliance, la fondation traditionnelle de la Confédération suisse."
  "Sweden at War border state “1293”": "Frontières d’après Sweden at War “1293”"
  "James II of Aragon occupies the Kingdom of Murcia.": "Jacques II d’Aragon occupe le Royaume de Murcie."
  "Treaty of Alcañices. Castile cedes Olivenza and the Riba-Côa to Portugal.": "Traité d’Alcañices. Castille cedes Olivenza et Riba-Côa au Portugal."
  "The Mamluks take Marash from Armenian Cilicia.": "Les Mamelouks prennent Marash de la Cilicie Arménienne."
  "Under the terms of the treaty of Anagni (1295), James II of Aragon restores the Balearics to James II of Majorca.": "Aux termes du traité d’Anagni (1295), Jacques II d’Aragon restaure les Baléares à Jacques II de Majorque."
  "historical-basemaps world_1300 (automatic draft, partly hand-corrected)": "historical-basemaps world_1300 (ébauche automatique partiellement corrigée à la main)"
  "About 1300. Seljuk Rum has dissolved into Turkish emirates (beyliks), among them Osman’s on the Byzantine frontier in Bithynia and the Karamanids in the Taurus; Ilkhanid governors rule central and eastern Anatolia. The emirates overrun most of Byzantine Asia Minor in the next decades.": "Vers 1300. Seljuk Rum s’est dissout en émirats turcs (beyliks), parmi lesquels Osmanes à la frontière byzantine en Bithynie et les Karamanids dans le Taureau ; les gouverneurs ilkhanides dominent l’Anatolie centrale et orientale. Les émirats ont envahi la plupart des Byzantines Asie Mineure dans les prochaines décennies."
  "Treaty of Torrellas. Aragon returns Murcia to Castile but keeps Alicante, Elche and Orihuela.": "Traité de Torrellas. Aragon retourne Murcie en Castille mais garde Alicante, Elche et Orihuela."
  "The last Seljuk sultan of Rum dies; the Karamanids take Konya.": "Le dernier sultan Seljuk de Rum meurt ; les Karamanides prennent Konya."
  "The bishop of Viviers accepts French sovereignty over the Vivarais.": "L’évêque de Viviers accepte la souveraineté française sur les Vivarais."
  "The Teutonic Order seizes Danzig, and Pomerelia within a year. Brandenburg sells its claims at Soldin (1309); Poland recognises the loss at Kalisz (1343).": "L’Ordre teutonique saisit Danzig et Pomerelia dans un délai d’un an. Brandenburg vend ses réclamations à Soldin (1309) ; la Pologne reconnaît la perte à Kalisz (1343)."
  "The Knights Hospitaller complete their conquest of Rhodes and make it the seat of their order.": "Les Chevaliers Hospitaliers achèvent leur conquête de Rhodes et en font le siège de leur ordre."
  "Cangrande della Scala takes Vicenza.": "Cangrande della Scala prend Vicenza."
  "Treaty of Vienne. Lyon passes from the Empire to the kingdom of France.": "Traité de Vienne. Lyon passe de l’Empire au royaume de France."
  "Treaty of Pontoise. Flanders hands over Lille, Douai and Orchies (Walloon Flanders), ceded at Athis-sur-Orge in 1305.": "Traité de Pontoise. La Flandre remet Lille, Douai et Orchies (Flandre Wallonne), cédée à Athis-sur-Orge en 1305."
  "Saruhan Bey takes Magnesia (Manisa).": "Saruhan Bey prend la Magnésie (Manisa)."
  "The Mamluks take Malatya.": "Les Mamelouks prennent Malatya."
  "The emirs of Aydın take the citadel of Smyrna; the harbour castle follows in 1329.": "Les émirs d’Aydın prennent la citadelle de Smyrne ; le château du port suit en 1329."
  "Jacopo I da Carrara becomes lord of Padua.": "Jacopo I da Carrara devient seigneur de Padoue."
  "Battle of Dysert O’Dea. The O’Briens destroy the de Clare lordship of Thomond.": "Bataille de Dysert O-Dea. Les O-Briens détruisent la seigneurie de Clare de Thomond."
  "Charles I of Hungary retakes Belgrade and Mačva from Dragutin’s son.": "Charles Ier de Hongrie reprend Belgrade et Mačva du fils Dragutin."
  "About 1320. The Byzantine Despotate of the Morea, based at Mystras since 1262, takes most of Arcadia and holds the larger part of the Peloponnese outside Achaea’s north-west and the Venetian ports.": "Vers 1320. Le Despotate byzantin de la Morea, basé à Mystras depuis 1262, prend la majeure partie de l’Arcadia et détient la plus grande partie de la Péloponnèse à l’extérieur d’Achaea."
  "Emperor Louis IV pledges the Egerland to John of Bohemia.": "L’empereur Louis IV promet l’Egerland à Jean de Bohême."
  "Sweden at War border state “1323”": "Frontières d’après Sweden at War “1323”"
  "Pisa surrenders Cagliari to the Infante Alfonso of Aragon; the Aragonese Kingdom of Sardinia holds the south and the north, Arborea the centre-west.": "Pise rend Cagliari à l’infante Alfonso d’Aragon ; le royaume aragonais de Sardaigne détient le sud et le nord, Arborea le centre-ouest."
  "After the War of Saint-Sardos, Charles IV keeps the Agenais, which his army occupied in 1324.": "Après la guerre de Saint-Sardos, Charles IV garde l’Agenais, que son armée occupe en 1324."
  "Wizlaw III, the last prince of Rügen, dies. The principality passes to the dukes of Pomerania.": "Wizlaw III, le dernier prince de Rügen, meurt. La principauté passe aux ducs de Poméranie."
  "Ban Stephen II Kotromanić of Bosnia takes Hum (Zachlumia) from Serbia, and the Tropolje around Livno.": "Ban Stephen II Kotromanić de Bosnie prend Hum (Zachlumia) de Serbie, et le Tropolje autour de Livno."
  "Orhan takes Bursa after a long blockade and makes it the Ottoman capital.": "Orhan prend Bursa après un long blocus et en fait la capitale ottomane."
  "Luigi Gonzaga seizes Mantua.": "Luigi Gonzaga saisit Mantua."
  "Cangrande della Scala takes Padua.": "Cangrande della Scala prend Padoue."
  "With Görlitz, all of Upper Lusatia is under the Bohemian crown (Bautzen since 1319).": "Avec Görlitz, tout le haut Lusatia est sous la couronne bohème (Bautzen depuis 1319)."
  "Cangrande takes Treviso, shortly before his death.": "Cangrande prend Treviso, peu avant sa mort."
  "The Teutonic Order occupies Dobrzyń Land, and Kuyavia in 1332.": "L’Ordre teutonique occupe la Terre Dobrzyń et Kuyavia en 1332."
  "Battle of Posada. Basarab I of Wallachia defeats King Charles I of Hungary; Wallachia is independent.": "Bataille de Posada. Basarab Ier de Wallachia bat le roi Charles Ier de Hongrie ; Wallachia est indépendant."
  "Orhan takes Nicaea (İznik).": "Orhan prend Nicée (Iznik)."
  "Sweden at War border state “1332”": "Frontières d’après Sweden at War “1332”"
  "Lucerne joins the three forest cantons.": "Lucerne rejoint les trois cantons forestiers."
  "Andronikos III takes Thessaly after the death of its ruler Stephen Gabrielopoulos.": "Andronikos III prend Thessalie après la mort de son chef Stephen Gabrielopoulos."
  "Edward III grants Man to William Montagu; the island stays under the English crown.": "Edward III accorde l’homme à William Montagu ; l’île reste sous la couronne anglaise."
  "William de Burgh, earl of Ulster, is murdered. The earldom collapses outside Carrickfergus, the Ards and Lecale, and the de Burghs of Connacht become Gaelic-style lords independent of the crown.": "William de Burgh, comte d’Ulster, est assassiné. Le comte s’effondre à l’extérieur de Carrickfergus, les Ards et Lecale, et les de Burghs de Connacht deviennent seigneurs gaéliques indépendants de la couronne."
  "Azzone Visconti rules Bergamo, Como, Lodi, Cremona, Novara, Vercelli and Piacenza; Brescia follows in 1337.": "Azzone Visconti règle Bergamo, Côme, Lodi, Cremona, Novara, Vercelli et Piacenza ; Brescia suit en 1337."
  "Emperor Louis IV enfeoffs the Habsburgs with Carinthia and Carniola.": "L’empereur Louis IV défait les Habsbourg avec Carinthie et Carniola."
  "The Ilkhan Abu Said dies and the Ilkhanate breaks up. Eretna, its former governor, rules central Anatolia from Sivas and Kayseri; Turkmen and Kurdish lords hold the east.": "L’Ilkhan Abu Said meurt et l’Ilkhanate se sépare. Eretna, son ancien gouverneur, dirige l’Anatolie centrale de Sivas et Kayseri ; les Turkmènes et les seigneurs kurdes tiennent l’est."
  "Obizzo III d’Este becomes lord of Modena.": "Obizzo III d’Este devient seigneur de Modène."
  "Orhan takes Nicomedia and the shore of the Bosporus. In the south-east, the Dulkadirids found an emirate at Elbistan and Marash.": "Orhan prend Nicomédia et la rive du Bosporus. Au sud-est, les Dulkadirid ont trouvé un émirat à Elbistan et Marash."
  "The Carraresi recover Padua from the Scaligeri.": "Les Carraresi récupèrent Padoue des Scaligeri."
  "Peace of Venice. Venice receives Treviso, its first mainland territory.": "Paix de Venise. Venise reçoit Treviso, son premier territoire continental."
  "Andronikos III annexes Epirus (1338–1340).": "Andronikos III annexes Epirus (1338–1340)."
  "Asti accepts Visconti lordship.": "Asti accepte la seigneurie Visconti."
  "Stefan Dušan of Serbia takes the rest of Macedonia and most of Albania (1342–1345), taking advantage of the Byzantine civil war.": "Stefan Dušan, de Serbie, prend le reste de la Macédoine et la majeure partie de l’Albanie (1342–1345) en profitant de la guerre civile byzantine."
  "Peter IV of Aragon conquers the Kingdom of Majorca and joins it to the Crown.": "Pierre IV d’Aragon conquiert le Royaume de Majorque et l’associe à la Couronne."
  "Treaty of Kalisz. The Order returns Dobrzyń Land and Kuyavia to Poland and keeps Pomerelia and Chełmno Land.": "Traité de Kalisz. L’Ordre renvoie Dobrzyń Land et Kuyavia à la Pologne et garde Pomerelia et Chełmno Land."
  "Anna of Savoy, regent in Constantinople, cedes Philippopolis and the upper Maritsa valley to Tsar Ivan Alexander of Bulgaria for his help in the civil war.": "Anna de Savoie, régente à Constantinople, cède Philippopolis et la haute vallée de Maritsa au tsar Ivan Alexander de Bulgarie pour son aide dans la guerre civile."
  "Peter IV of Aragon, having taken Mallorca in 1343, reunites Roussillon with the Crown of Aragon.": "Pierre IV d’Aragon, ayant pris Majorque en 1343, réunit Roussillon avec la Couronne d’Aragon."
  "Orhan annexes the emirate of Karasi (1345–1357), which reaches the Dardanelles.": "Orhan annexe l’émirat de Karasi (1345-1357), qui atteint les Dardanelles."
  "Dušan takes Serres; Mount Athos accepts his rule. In 1346 he is crowned emperor.": "Dušan prend Serres ; le mont Athos accepte sa domination. En 1346, il est couronné empereur."
  "Luchino Visconti buys Parma.": "Luchino Visconti achète Parma."
  "Calais surrenders to Edward III after an eleven-month siege. It stays English for 211 years.": "Calais se rend à Edward III après un siège de onze mois. Il reste anglais pendant 211 ans."
  "Gaston Fébus, count of Foix, declares that he holds Béarn from God alone and from no king.": "Gaston Fébus, comte de Foix, déclare qu’il tient Béarn de Dieu seul et d’aucun roi."
  "Dušan’s commanders take Thessaly and Epirus (1347–1348).": "Les commandants de Dušan emportent Thessalie et Epirus (1347–1348)."
  "Alessandria passes to the Visconti.": "Alessandria passe au Visconti."
  "Treaty of Bolotovo. Novgorod recognises the independence of Pskov.": "Traité de Bolotovo. Novgorod reconnaît l’indépendance de Pskov."
  "Treaty of Romans. The last dauphin, Humbert II, sells the Dauphiné to the heir of the French crown.": "Traité des Romains. Le dernier dauphin, Humbert II, vend le Dauphiné à l’héritier de la couronne française."
  "Archbishop Giovanni Visconti buys Bologna from the Pepoli.": "Mgr Giovanni Visconti achète Bologne au Pepoli."
  "Florence buys Prato from the Angevins of Naples.": "Florence achète Prato aux Angevins de Naples."
  "Zürich joins the Confederacy.": "Zürich rejoint la Confédération."
  "Glarus (4 June) and Zug (27 June) join the Confederacy.": "Glarus (4 juin) et Zug (27 juin) se joignent à la Confédération."
  "Peace of Brandenburg. The Confederates must return Glarus and Zug to Habsburg rule, though both stay allied to them.": "La paix du Brandebourg. Les Confédérés doivent retourner Glarus et Zug à la domination de Habsburg, bien que les deux restent alliés à eux."
  "Bern joins the Confederacy.": "Bern rejoint la Confédération."
  "The Ottomans take Ankara.": "Les Ottomans prennent Ankara."
  "An earthquake ruins the walls of Gallipoli; Süleyman Pasha’s Ottoman troops occupy the town, their first foothold in Europe.": "Un tremblement de terre détruit les murs de Gallipoli ; les troupes ottomanes de Süleyman Pashah occupent la ville, leur première place en Europe."
  "Stefan Dušan dies. His empire breaks up; in Albania local families rule their own principalities.": "Stefan Dušan meurt. Son empire se brise ; en Albanie les familles locales gouvernent leurs propres principautés."
  "About 1356. Ivan Alexander’s son Ivan Sratsimir rules Vidin as a separate tsardom.": "Vers 1356. Ivan Alexandre Son fils Ivan Sratsimir gouverne Vidin comme un tsardom séparé."
  "Algirdas of Lithuania takes Bryansk.": "Algirdas de Lituanie prend Bryansk."
  "Treaty of Zadar. Venice gives up Dalmatia to Louis I of Hungary; Ragusa accepts Hungarian overlordship and governs itself.": "Traité de Zadar. Venise abandonne la Dalmatie à Louis Ier de Hongrie ; Raguse accepte la domination hongroise et se gouverne elle-même."
  "Epirus passes to Serbian and Albanian lords after the death of Nikephoros II; the ruler of Ioannina takes the title of despot.": "Epirus passe aux seigneurs serbes et albanais après la mort de Nikephoros II ; le souverain d’Ioannina prend le titre de despote."
  "Bogdan I, who rebelled against Hungary, rules Moldavia as an independent principality around Baia, Siret and Suceava.": "Bogdan Ier, qui s’est rebellé contre la Hongrie, dirige la Moldavie comme une principauté indépendante autour de Baia, Siret et Suceava."
  "Pavia surrenders to Galeazzo II Visconti.": "Pavia se rend à Galeazzo II Visconti."
  "Cardinal Albornoz recovers Bologna for the pope.": "Le cardinal Albornoz récupère Bologne pour le pape."
  "Sweden at War border state “1360”": "Frontières d’après Sweden at War “1360”"
  "Treaty of Brétigny, ratified at Calais. Edward III gives up his claim to the French crown and receives a greatly enlarged Aquitaine in full sovereignty: Poitou, Saintonge, Angoumois, Limousin, Périgord, Quercy, Rouergue, the Agenais, Bigorre and Gaure, as well as Calais and Ponthieu.": "Traité de Brétigny, ratifié à Calais. Edward III renonce à sa prétention à la couronne française et reçoit une Aquitaine largement élargie en pleine souveraineté : Poitou, Saintonge, Angoumois, Limousin, Périgord, Quercy, Rouergue, l’Agenais, Bigorre et Gaure, ainsi que Calais et Ponthieu."
  "About 1362. The Balšić family rules Zeta independently of the Serbian emperor.": "1362. La famille Balšić gouverne Zeta indépendamment de l’empereur serbe."
  "After the Battle of Blue Waters, Lithuania takes Kiev and the Seversk lands; the Upper Oka princes become Lithuanian vassals.": "Après la bataille des eaux bleues, la Lituanie prend Kiev et les terres de Seversk ; les princes du Haut Oka deviennent vassaux lituaniens."
  "After the Battle of Blue Waters, Lithuania takes Podolia from the Golden Horde.": "Après la bataille des eaux bleues, la Lituanie prend Podolia de la Horde d’Or."
  "Margaret of Tyrol hands the county of Tyrol to Rudolf IV of Austria.": "Margaret du Tyrol confie le comté de Tyrol à Rudolf IV d’Autriche."
  "John II grants the duchy of Burgundy to his youngest son, Philip the Bold. The Valois dukes of Burgundy will build a state of their own.": "Jean II accorde le duché de Bourgogne à son plus jeune fils, Philip le Bold. Les ducs Valois de Bourgogne construiront leur propre état."
  "Schwyz takes Zug back from the Habsburgs; it rejoins the Confederacy.": "Schwyz reprend Zug des Habsbourg ; il rejoint la Confédération."
  "Amadeus VI of Savoy takes Gallipoli from the Ottomans and hands it to Byzantium.": "Amadeus VI de Savoie prend Gallipoli des Ottomans et la livre à Byzance."
  "Karl Thopia takes Durrës from the Angevins.": "Karl Thopia prend Durrës des Angevins."
  "Charles IV completes the purchase of Lower Lusatia for the Bohemian crown.": "Charles IV complète l’achat de Lower Lusatia pour la couronne bohème."
  "Mariano IV of Arborea, at war with Aragon, overruns most of Sardinia; Aragon holds only Cagliari and Alghero.": "Mariano IV d’Arborea, en guerre contre Aragon, envahit la majeure partie de la Sardaigne ; Aragon ne détient que Cagliari et Alghero."
  "Murad I takes Adrianople (at some point between 1361 and 1369), which becomes the Ottoman capital, and Philippopolis (about 1363).": "Murad I prend Adrianople (entre 1361 et 1369), qui devient la capitale ottomane, et Philippopolis (environ 1363)."
  "Philip the Bold marries Margaret, heiress of Flanders. As part of the settlement Charles V returns Walloon Flanders to her father.": "Philippe le Bold épouse Margaret, héritière de Flandre. Dans le cadre de la colonie Charles V rend la Flandre wallonne à son père."
  "Charles V confiscates Aquitaine after the Gascon lords appeal to him against the Black Prince. Rouergue, Quercy, the Agenais, Armagnac and Bigorre go over to France within months.": "Charles V confisque Aquitaine après que les seigneurs de Gascon lui aient fait appel contre le Prince Noir. Rouergue, Quercy, Agenais, Armagnac et Bigorre se rendent en France dans quelques mois."
  "Battle of the Maritsa. The Ottomans destroy the army of the Serbian lords of Macedonia and take northern Thrace; Tsar Ivan Shishman of Bulgaria and the surviving Serbian lords become Ottoman vassals.": "Bataille du Maritsa. Les Ottomans détruisent l’armée des seigneurs serbes de Macédoine et prennent le nord de Thrace ; le tsar Ivan Shishman de Bulgarie et les seigneurs serbes survivants deviennent des vassaux ottomans."
  "After the death of the Serbian lords at the Maritsa, Manuel Palaiologos retakes Serres and the lower Struma for Byzantium.": "Après la mort des seigneurs serbes au Maritsa, Manuel Palaiologis reprend Serres et le bas Struma pour Byzance."
  "Du Guesclin’s campaigns have recovered Poitou, Saintonge, Angoumois, the Limousin and Périgord. The English hold little more than Bordeaux, Bayonne and Calais.": "Les campagnes du Guesclin ont permis de récupérer Poitou, Saintonge, Angoumois, le Limousin et le Périgord."
  "About 1375. The Kara Koyunlu Turkmen, based north of Lake Van, rule the Armenian highlands.": "Vers 1375, le Kara Koyunlu Turkmen, basé au nord du lac Van, domine les hautes terres arméniennes."
  "Sis falls to the Mamluks; the Armenian Kingdom of Cilicia ends.": "Sis tombe aux Mamelouks ; le royaume arménien de Cilicie s’achève."
  "The Habsburgs buy Feldkirch, the first of the Vorarlberg lordships (Bludenz follows in 1394, Bregenz in 1451–1523).": "Les Habsbourg achètent Feldkirch, la première des seigneuries du Vorarlberg (Bludenz suit en 1394, Bregenz en 1451–1523)."
  "Andronikos IV hands Gallipoli back to Murad I.": "Andronikos IV remet Gallipoli à Murad I."
  "Tvrtko I, who took the upper Drina and Lim valleys and Trebinje in 1373, is crowned king of Bosnia.": "Tvrtko I, qui a pris les vallées supérieures de la Drina et du Lim et Trebinje en 1373, est couronné roi de Bosnie."
  "Biella accepts the lordship of Savoy.": "Biella accepte la seigneurie de Savoie."
  "Peace of Turin ends the War of Chioggia; Venice gives Treviso to Duke Leopold III of Austria.": "La paix de Turin met fin à la guerre de Chioggia ; Venise donne Treviso au duc Léopold III d’Autriche."
  "About 1382–1385. The Ottomans take Sofia.": "Entre 1382 et 1385, les Ottomans prennent Sofia."
  "Cuneo submits to Amadeus VI of Savoy; Trieste places itself under Leopold III of Austria.": "Cuneo se soumet à Amadeus VI de Savoie ; Trieste se place sous Léopold III d’Autriche."
  "The Ottomans take Serres; Mount Athos submits.": "Les Ottomans prennent Serres ; le mont Athos se soumet."
  "Arezzo submits to Florence; Francesco da Carrara buys Treviso.": "Arezzo se soumet à Florence ; Francesco da Carrara achète Treviso."
  "Louis of Male, count of Flanders, dies. Philip the Bold and Margaret inherit Flanders, Artois and the Free County of Burgundy.": "Louis de Mâle, comte de Flandre, meurt. Philippe le Bold et Margaret héritent de la Flandre, d’Artois et du Comté libre de Bourgogne."
  "The Ottomans take Niš.": "Les Ottomans prennent Niš."
  "Corfu places itself under Venice, which rules it until 1797.": "Corfou se place sous Venise, qui la règle jusqu’en 1797."
  "Gian Galeazzo Visconti takes Verona and Vicenza, ending the Scaliger lordship; Asti goes to Louis of Orléans as the dowry of Valentina Visconti.": "Gian Galeazzo Visconti prend Vérone et Vicenza, mettant fin à la seigneurie Scaliger ; Asti se rend à Louis d’Orléans comme dot de Valentina Visconti."
  "Thessalonica surrenders to the Ottomans after a four-year siege.": "Thessalonica se rend aux Ottomans après un siège de quatre ans."
  "The men of Glarus defeat the Austrians at Näfels and Glarus is free of Habsburg rule; the peace of 1389 confirms it.": "Les hommes de Glarus défait les Autrichiens à Näfels et Glarus est libre du règne des Habsbourg ; la paix de 1389 le confirme."
  "The Dedition of Nice. Nice and its hinterland leave Provence for the protection of Amadeus VII of Savoy.": "La Dédition de Nice. Nice et son arrière-pays quittent la Provence pour la protection d’Amadeus VII de Savoie."
  "Gian Galeazzo takes Padua and Treviso from the Carraresi; he passes Treviso to Venice.": "Gian Galeazzo prend Padoue et Trévise du Carraresi ; il passe Treviso à Venise."
  "Bayezid I annexes the western emirates (Aydın, Saruhan, Menteşe, Germiyan, Hamid and Teke) and takes Philadelphia, the last Byzantine town in Asia Minor.": "Bayezid I annexes les émirats occidentaux (Aydın, Saruhan, Menteşe, Germiyan, Hamid et Teke) et prend Philadelphie, la dernière ville byzantine en Asie Mineure."
  "About 1388–1390. Mircea the Elder of Wallachia takes Dobruja and Silistra.": "Vers 1388-1390. Mircea l’Ancien de Wallachie prend Dobruja et Silistra."
  "Francesco Novello da Carrara recovers Padua.": "Francesco Novello da Carrara récupère Padoue."
  "Bayezid I takes Amasya, Samsun and Kastamonu.": "Bayezid Je prends Amasya, Samsun et Kastamonu."
  "Roman I calls himself ruler of Moldavia “from the mountains to the sea”: Moldavia now reaches the Dniester and the Black Sea at Cetatea Albă.": "Roman I s’appelle le chef de la Moldavie depuis les montagnes jusqu’à la mer.La Moldavie atteint maintenant le Dniestr et la Mer Noire à Cetatea Albă."
  "Duke Władysław of Opole pawns Dobrzyń Land to the Teutonic Order.": "Duc Władysław des pions Opole Dobrzyń Land à l’Ordre Teutonique."
  "The Ottomans take Skopje from Vuk Branković.": "Les Ottomans prennent Skopje de Vuk Branković."
  "Venice takes over Durrës from the Thopia.": "Venise reprend Durrës de la Thopia."
  "Tarnovo falls after a three-month siege; Bayezid I annexes the Bulgarian tsardom and occupies Thessaly.": "Tarnovo tombe après un siège de trois mois ; Bayezid I annexe le tsardom bulgare et occupe Thessalie."
  "Battle of Rovine. The Ottoman vassals Prince Marko and Konstantin Dejanović fall fighting for Bayezid against Wallachia; their lands in Macedonia are annexed.": "Bataille de Rouvine. Les vassaux ottomans, le prince Marko et Konstantin Dejanović, se battent pour Bayezid contre Wallachie ; leurs terres en Macédoine sont annexées."
  "Gian Galeazzo Visconti is made Duke of Milan; the duchy includes the Ticino valleys.": "Gian Galeazzo Visconti est fait duc de Milan ; le duché comprend les vallées du Tessin."
  "Venice buys Shkodër from the Balšići and holds Lezhë.": "Venise achète Shkodër chez les Balšići et détient Lezhë."
  "After the crusaders’ defeat at Nicopolis, Bayezid I annexes the Tsardom of Vidin.": "Après la défaite des croisés à Nicopolis, Bayezid I annexes le Tsardom de Vidin."
  "Bayezid I annexes the emirate of Karaman.": "Bayezid I annexe l’émirat de Karaman."
  "Kalmar Union. Orkney and Shetland follow Norway into union with Denmark.": "Kalmar Union. Orkney et Shetland suivent la Norvège dans l’union avec le Danemark."
  "Kalmar Union. Iceland and the Faroes follow Norway into union with Denmark.": "Kalmar Union. L’Islande et les Féroé suivent la Norvège en union avec le Danemark."
  "Sweden at War border state “1397”": "Frontières d’après Sweden at War “1397”"
  "Bayezid I takes Sivas and Kayseri after the death of Kadi Burhan al-Din.": "Bayezid Je prends Sivas et Kayseri après la mort de Kadi Burhan al-Din."
  "Gian Galeazzo buys Pisa and Livorno; Siena submits to him.": "Gian Galeazzo achète Pise et Livourne ; Sienne lui soumet."
  "Under Vytautas the Grand Duchy of Lithuania reaches the Black Sea between the Dniester and the Dnieper.": "Sous Vytautas, le Grand-Duché de Lituanie atteint la mer Noire entre le Dniestr et le Dniepr."
  "historical-basemaps world_1400 (automatic draft, partly hand-corrected)": "historical-basemaps world_1400 (ébauche automatique partiellement corrigée à la main)"
  "About 1400. Grand Duke Vytautas extends Lithuanian rule over the steppe between the Dniester and the Dnieper.": "Vers 14h. Le Grand Duc Vytautas étend la domination lituanienne sur la steppe entre le Dniestr et le Dniepr."
  "By about 1400 the Gaelic revival has pushed English rule back to the Pale around Dublin, the Butler earldom of Ormond and the towns. Leinster’s mountains belong to the MacMurroughs and O’Byrnes, and the FitzGerald earls of Desmond rule Munster as independent lords.": "Vers 14h00, le réveil gaélique a repoussé la domination anglaise vers le Pale autour de Dublin, le royaume Butler d’Ormond et les villes. Les montagnes de Leinster appartiennent aux MacMurroughs et O-Byrnes, et les oreilles FitzGerald de Desmond règnent Munster en tant que seigneurs indépendants."
  "Perugia submits to Gian Galeazzo.": "Pérouse se soumet à Gian Galeazzo."
  "Florence takes direct rule of Pistoia.": "Florence prend la domination directe de Pistoia."
  "After Timur’s campaigns, the Aq Qoyunlu Turkmen hold the upper Jazira.": "Après les campagnes de Timur, les Turkmènes d’Aq Qoyunlu tiennent la haute Jazira."
  "After the battle of Casalecchio, Gian Galeazzo takes Bologna; he dies of plague on 3 September.": "Après la bataille de Casalecchio, Gian Galeazzo prend Bologne ; il meurt de peste le 3 septembre."
  "Battle of Ankara. Timur defeats and captures Bayezid I and restores the western emirates, Karaman and Kastamonu; the Ottoman princes keep Bithynia and the north. Timur gives the Diyarbakır region to the Aq Qoyunlu Turkmen.": "Bataille d’Ankara. Timur bat et capture Bayezid Ier et restaure les émirats occidentaux, Karaman et Kastamonu ; les princes ottomans gardent Bithynia et le nord. Timur donne la région de Diyarbakır aux Turkmènes Aq Qoyunlu."
  "Treaty of Gallipoli. After the Ottoman defeat at Ankara, Süleyman Çelebi returns Thessalonica and Mount Athos to Byzantium.": "Traité de Gallipoli. Après la défaite ottomane à Ankara, Süleyman Çalebi retourne Thessalonique et le mont Athos à Byzance."
  "Bologna and Perugia return to the pope.": "Bologne et Pérouse reviennent au pape."
  "Despot Stefan Lazarević of Serbia receives Belgrade and Mačva from King Sigismund.": "Despot Stefan Lazarević de Serbie reçoit Belgrade et Mačva du roi Sigismund."
  "Siena throws off Milanese rule. Vicenza, Belluno and Feltre give themselves to Venice.": "Sienne rejette la règle milanaise. Vicenza, Belluno et Feltre se donnent à Venise."
  "Peace of Raciąż. Poland and Lithuania confirm the cession of Samogitia to the Teutonic Order (first agreed at Salynas in 1398); Poland buys back Dobrzyń Land.": "La Pologne et la Lituanie confirment la cession de Samogitia à l’Ordre Teutonique (accordé pour la première fois à Salynas en 1398) ; la Pologne rachète Dobrzyń Land."
  "Jean de Béthencourt completes the conquest of Lanzarote and Fuerteventura for Castile.": "Jean de Béthencourt complète la conquête de Lanzarote et Fuerteventura pour Castille."
  "Verona surrenders to Venice.": "Vérone se rend à Venise."
  "Venice takes Padua; the Carraresi are executed.": "Venise prend Padoue ; les Carraresi sont exécutés."
  "Neuchâtel enters a perpetual alliance with Bern and becomes an associate of the Confederacy.": "Neuchâtel entre dans une alliance perpétuelle avec Berne et devient associé de la Confédération."
  "Pisa surrenders to Florence after a long siege.": "Pise se rend à Florence après un long siège."
  "Genoa takes Livorno.": "Gênes prend Livourne."
  "The Kara Koyunlu take Mardin from the last Artuqids.": "Le Kara Koyunlu prend Mardin des derniers Artuqids."
  "Niccolò III d’Este takes Reggio.": "Niccolò III d-Este prend Reggio."
  "Battle of Sanluri. Martin the Younger of Sicily defeats Arborea; Aragon recovers the south of Sardinia.": "Bataille de Sanluri. Martin le Jeune de Sicile bat Arborea ; Aragon récupère le sud de la Sardaigne."
  "Ladislaus of Naples sells Zadar and his rights in Dalmatia to Venice.": "Ladislaus de Naples vend Zadar et ses droits en Dalmatie à Venise."
  "Kara Yusuf, back from exile, restores Kara Koyunlu rule over the Armenian highlands.": "Kara Yusuf, de retour d’exil, rétablit la domination de Kara Koyunlu sur les hautes terres arméniennes."
  "Oristano surrenders; Leonardo Cubello holds it as the Marquisate of Oristano under the Crown of Aragon.": "Oristano se rend ; Leonardo Cubello la tient comme le marquisat d’Oristano sous la couronne d’Aragon."
  "First Peace of Thorn. After Grunwald, Samogitia returns to Lithuania for the lifetimes of Jogaila and Vytautas; the Treaty of Melno (1422) makes it permanent.": "Première paix de Thorn. Après Grunwald, Samogitia revient en Lituanie pour la vie de Jogaila et Vytautas ; le traité de Melno (1422) le rend permanent."
  "Appenzell, which had freed itself from the abbot of St. Gallen, becomes an associate of the Confederacy (a full canton in 1513).": "Appenzell, qui s’était libéré de l’abbé de Saint-Gall, devient associé de la Confédération (un canton complet en 1513)."
  "At the Emperor’s call the Confederates conquer the Habsburg Aargau and rule it as a subject territory.": "Chez l’Empereur, les Confédérés conquièrent l’Argovie des Habsbourg et la gouvernent comme un territoire sujet."
  "Portugal takes Ceuta.": "Le Portugal prend Ceuta."
  "The Ottomans take Dobruja from Wallachia, and Vlorë, Berat and southern Albania (1417–1419).": "Les Ottomans prennent Dobruja de Wallachie, Vlorë, Berat et le sud de l’Albanie (1417–1419)."
  "The Grimaldi of Genoa take lasting possession of Monaco.": "Les Grimaldi de Gênes prennent possession durable de Monaco."
  "Rouen surrenders to Henry V after a six-month siege; the English conquest of Normandy is complete.": "Rouen se rend à Henry V après un siège de six mois ; la conquête anglaise de Normandie est terminée."
  "Venice completes its conquest of Dalmatia (Šibenik 1412, Trogir and Split 1420); Kotor places itself under Venice.": "Venise complète sa conquête de la Dalmatie (Šibenik 1412, Trogir et Split 1420) ; Kotor se place sous Venise."
  "Portuguese settlers begin to colonise Madeira.": "Les colons portugais commencent à coloniser Madère."
  "Udine surrenders; Venice conquers the Friuli from the Patriarch of Aquileia.": "Udine se rend ; Venise conquiert les Friouls du Patriarche d’Aquileia."
  "William III of Narbonne, the last judge of Arborea, sells his rights and Sassari to Alfonso V of Aragon.": "Guillaume III de Narbonne, le dernier juge d’Arborea, vend ses droits et Sassari à Alfonso V d’Aragon."
  "Treaty of Troyes (May 1420). Charles VI disinherits his son and makes Henry V his heir and regent. Henry enters Paris in December; with Burgundian support, the Lancastrians control northern France.": "Traité de Troyes (1420 mai). Charles VI déshérite son fils et fait d’Henry V son héritier et régent. Henry entre à Paris en décembre ; avec le soutien bourguignon, les Lancastriens contrôlent le nord de la France."
  "Balša III dies; Zeta passes to his uncle, Despot Stefan Lazarević of Serbia.": "Balša III meurt ; Zeta passe à son oncle, Despot Stefan Lazarević de Serbie."
  "Florence buys Livorno from Genoa.": "Florence achète Livourne à Gênes."
  "Byzantium hands besieged Thessalonica to Venice.": "Les mains de Byzance ont assiégé Thessalonique à Venise."
  "Le Mans surrenders to the English, who take Maine.": "Le Mans se rend aux Anglais, qui prennent le Maine."
  "Peace of Venice. Filippo Maria Visconti cedes Brescia to Venice.": "Paix de Venise. Filippo Maria Visconti cedes Brescia à Venise."
  "Stefan Lazarević dies; under their agreement Belgrade and Mačva return to Hungary.": "Stefan Lazarević meurt ; en vertu de leur accord Belgrade et Mačva reviennent en Hongrie."
  "Filippo Maria Visconti cedes Vercelli to Savoy.": "Filippo Maria Visconti cedes Vercelli à Savoy."
  "By about 1428 Murad II has annexed the restored western emirates again.": "Vers 1428 Murad II a annexé de nouveau les émirats occidentaux restaurés."
  "Peace of Ferrara, after the battle of Maclodio. Venice receives Bergamo.": "Paix de Ferrare, après la bataille de Maclodio. Venise reçoit Bergame."
  "Philip the Good inherits the county of Namur, which he had bought in 1421.": "Philippe le Bon hérite du comté de Namur, qu’il avait acheté en 1421."
  "Charles VII is crowned at Reims after Joan of Arc relieves Orléans. Champagne, Laon, Soissons, Beauvais and Compiègne go over to him.": "Charles VII est couronné à Reims après que Jeanne d’Arc soulage Orléans. Champagne, Laon, Soissons, Beauvais et Compiègne vont vers lui."
  "Constantine Palaiologos takes Patras; Thomas Palaiologos ends the Principality of Achaea in 1432.": "Constantin Palaiologis prend Patras ; Thomas Palaiologis termine la Principauté d’Achaea en 1432."
  "Murad II takes Thessalonica by storm.": "Murad II prend Thessalonica par la tempête."
  "Philip the Good inherits the duchies of Brabant and Limburg.": "Philippe le Bon hérite des duchés de Brabant et de Limburg."
  "Ioannina surrenders to the Ottomans; the Tocco keep Arta as vassals.": "Ioannina se rend aux Ottomans ; les Tocco gardent Arta comme vassaux."
  "Portugal begins to settle the Azores.": "Le Portugal commence à s’installer aux Açores."
  "Charles VII’s men take Chartres by surprise.": "Les hommes de Charles VII prennent Chartres par surprise."
  "Jacqueline of Bavaria gives up Holland, Zeeland and Hainaut to Philip the Good (Treaty of Delft, 1428).": "Jacqueline de Bavière abandonne la Hollande, la Zélande et le Hainaut à Philippe le Bon (Traité de Delft, 1428)."
  "Treaty of Arras. Philip the Good of Burgundy makes peace with Charles VII and receives Auxerre, Mâcon and the towns on the Somme.": "Traité d’Arras. Philippe le Bon de Bourgogne fait la paix avec Charles VII et reçoit Auxerre, Mâcon et les villes sur la Somme."
  "Paris opens its gates to Charles VII’s army.": "Paris ouvre ses portes à l’armée de Charles VII."
  "Ulugh Muhammad founds the Khanate of Kazan on the middle Volga.": "Ulugh Muhammad a trouvé le khanate de Kazan sur la Volga du milieu."
  "Murad II takes Smederevo; Despot Đurađ Branković flees to Hungary and Serbia becomes an Ottoman province.": "Murad II prend Smederevo ; Despot шuraю Branković fuit en Hongrie et la Serbie devient une province ottomane."
  "The Nogai Horde breaks away east of the Volga.": "La Nogai Horde s’en va à l’est de la Volga."
  "Hacı I Giray founds the Crimean Khanate.": "Hacı I Giray a trouvé le khanate de Crimée."
  "Venice takes Ravenna.": "Venise prend Ravenne."
  "Antonio Alberico Malaspina rules Massa.": "Antonio Alberico Malaspina règle Massa."
  "Venice takes Bar, Ulcinj and Budva on the Zeta coast.": "Venise prend Bar, Ulcinj et Budva sur la côte de Zeta."
  "Oddantonio da Montefeltro is made Duke of Urbino by Pope Eugene IV.": "Oddantonio da Montefeltro est fait duc d’Urbino par le pape Eugène IV."
  "Burgundian troops take Luxembourg, which Philip the Good had bought from its duchess.": "Les troupes bourguignonnes prennent le Luxembourg, que Philippe le Bon avait acheté de sa duchesse."
  "Peace of Szeged. After Hunyadi’s Long Campaign, Murad II restores the Serbian Despotate to Đurađ Branković.": "La paix de Szeged. Après la longue campagne de Hunyadi, Murad II restaure le Despotat serbe à Branković."
  "Stjepan Vukčić Kosača takes the title “herceg of Saint Sava”; his lands become known as Herzegovina.": "Stjepan Vukčić Kosača prend le titre d’Herceg de Saint Sava, ses terres deviennent connues sous le nom d’Herzégovine."
  "The English hand over Le Mans and Maine, as promised in the truce of Tours.": "La mainmise anglaise sur Le Mans et le Maine, comme promis dans la trêve de Tours."
  "The Ottomans take Arta.": "Les Ottomans prennent Arta."
  "Cherbourg surrenders, four months after Formigny. Normandy is French again.": "Cherbourg se rend, quatre mois après Formigny. La Normandie est de nouveau française."
  "About 1451. Stefan Crnojević rules Upper Zeta between Venice and the Ottomans.": "Vers 1451. Stefan Crnojević gouverne la Haute Zêta entre Venise et les Ottomans."
  "The abbey of St. Gallen allies with the Confederacy (the city follows in 1454).": "L’abbaye de St. Gallen alliés à la Confédération (la ville suit en 1454)."
  "Bayonne surrenders; Gascony falls to France, although Bordeaux briefly returns to English rule in 1452–53.": "Bayonne se rend ; Gascony tombe en France, bien que Bordeaux retourne brièvement à la règle anglaise en 1452–1453."
  "Mehmed II takes Constantinople; the last emperor, Constantine XI, dies in the fighting.": "Mehmed II prend Constantinople ; le dernier empereur, Constantin XI, meurt dans les combats."
  "Bordeaux capitulates after Castillon. Of the English crown’s lands in France only Calais remains.": "Bordeaux capitule après Castillon. De la couronne anglaise, il ne reste en France que Calais."
  "The Ottomans take Novo Brdo and Prizren, and with them Kosovo and the upper Ibar and Lim valleys.": "Les Ottomans prennent Novo Brdo et Prizren, avec eux le Kosovo et les vallées supérieures de l’Ibar et du Lim."
  "The Acropolis surrenders to the Ottomans, two years after the city of Athens; the Duchy of Athens ends.": "L’Acropole se rend aux Ottomans, deux ans après la ville d’Athènes ; le duché d’Athènes prend fin."
  "Smederevo surrenders; the Serbian Despotate ends.": "Smederevo se rend ; le Despotat serbe s’arrête."
  "Treaty of Ribe. Christian I becomes Duke of Schleswig and Count of Holstein; Holstein stays an imperial fief.": "Traité de Ribe. Christian I devient duc de Schleswig et comte de Holstein ; Holstein reste un fief impérial."
  "Mehmed II conquers the Despotate of the Morea (1460); only the Venetian ports and Monemvasia stay outside Ottoman rule.": "Mehmed II conquiert le Despotat de la Morea (1460) ; seuls les ports vénitiens et la Monemvasia restent en dehors du gouvernement ottoman."
  "The Confederates take the Habsburg Thurgau.": "Les Confédérés prennent les Habsbourg Thurgau."
  "Mehmed II takes Trebizond; the emirate of Kastamonu and Sinope has surrendered earlier in the year.": "Mehmed II prend Trebizonde ; l’émirat de Kastamonu et Sinope s’est rendu plus tôt dans l’année."
  "Mehmed II takes Lesbos from the Genoese Gattilusio family.": "Mehmed II prend Lesbos de la famille Genoese Gattilusio."
  "Louis XI occupies Roussillon and Cerdagne, pledged to him by John II of Aragon in 1462.": "Louis XI occupe Roussillon et Cerdagne, promis par Jean II d’Aragon en 1462."
  "Mehmed II conquers Bosnia; King Stephen Tomašević is executed.": "Mehmed II conquiert la Bosnie ; le roi Stephen Tomašević est exécuté."
  "Louis XI buys back the Somme towns from Philip the Good.": "Louis XI rachète les villes de Somme à Philippe le Bon."
  "Matthias Corvinus retakes Jajce and organises the banates of Jajce and Srebrenik along the Sava.": "Matthias Corvinus reprend Jajce et organise les banates de Jajce et Srebrenik le long de la Save."
  "Treaty of Conflans after the War of the Public Weal: Louis XI has to return the Somme towns to Burgundy.": "Traité des Conflans après la guerre de Weal public : Louis XI doit renvoyer les villes de Somme en Bourgogne."
  "By 1466 the Ottomans hold most of Herzegovina; Herceg Novi and the western strongholds hold out.": "En 1466, les Ottomans détiennent la plus grande partie de l’Herzégovine ; Herceg Novi et les bastions occidentaux s’en tiennent."
  "The Khanate of Astrakhan breaks away; what is left of the Golden Horde is called the Great Horde.": "Le khanat d’Astrakhan s’en va ; ce qui reste de la Horde d’or est appelé la Grande Horde."
  "Second Peace of Thorn. Royal Prussia (Pomerelia with Danzig, Chełmno Land, Marienburg and Warmia) passes to the Polish crown. The Teutonic Order keeps eastern Prussia as a Polish fief.": "Deuxième Paix de l’épine. La Prusse royale (Pomérelie avec Danzig, Chełmno Land, Marienburg et Warmia) passe à la couronne polonaise. L’Ordre teutonique garde la Prusse orientale comme un fief polonais."
  "Uzun Hasan of the Aq Qoyunlu defeats and kills the Kara Koyunlu ruler Jahan Shah and takes his lands.": "Uzun Hasan de l’Aq Qoyunlu bat et tue le dirigeant Kara Koyunlu Jahan Shah et prend ses terres."
  "The Ottomans annex Karaman (1468; its last strongholds fall in 1474).": "Les Ottomans annexe Karaman (1468 ; ses derniers bastions baissent en 1474)."
  "Christian I pledges Orkney to James III of Scotland as security for his daughter’s dowry; the pledge is never redeemed.": "Christian Je promets Orkney à Jacques III d’Écosse comme sécurité pour sa fille Dot ; la promesse n’est jamais rachetée."
  "Christian I pledges Shetland to Scotland as well. Both are annexed to the Scottish crown in 1472.": "Christian J’engage Shetland à l’Écosse aussi. Les deux sont annexés à la couronne écossaise en 1472."
  "Sweden at War border state “1470”": "Frontières d’après Sweden at War “1470”"
  "Mehmed II takes Negroponte (Chalkis) from Venice.": "Mehmed II prend Negroponte (Chalkis) de Venise."
  "The Grey League, the League of God’s House and the League of the Ten Jurisdictions form the Three Leagues (the Grisons).": "La Ligue Grey, la Ligue de Dieu et la Ligue des dix juridictions forment les trois ligues (les Grisons)."
  "Ivan III conquers Great Perm.": "Ivan III conquiert le Grand Perm."
  "Charles the Bold conquers the duchy of Guelders, bought from its old duke Arnold.": "Charles le Bold conquiert le duché de Guelders, acheté à son vieux duc Arnold."
  "The Ottomans fortify Podgorica.": "Les Ottomans fortifient Podgorica."
  "The Ottomans take Kaffa and the principality of Theodoro (Mangup); the Crimean Khanate becomes an Ottoman vassal.": "Les Ottomans prennent Kaffa et la principauté de Theodoro (Mangup) ; le khanat de Crimée devient un vassal ottoman."
  "After the battle on the Planta at Sion, Upper Valais conquers Lower Valais from Savoy.": "Après la bataille sur le Planta à Sion, le Haut Valais conquiert le Bas Valais de Savoie."
  "Charles the Bold is killed at Nancy. Louis XI seizes the duchy of Burgundy and the Somme towns.": "Charles le Bold est tué à Nancy. Louis XI s’empare du duché de Bourgogne et des villes de Somme."
  "Charles’s daughter Mary marries Maximilian of Austria. The Burgundian Netherlands pass to the Habsburgs; Guelders, Artois and the Free County are contested.": "La fille de Charles Mary épouse Maximilian d’Autriche. Le passage des Pays-Bas bourguignons aux Habsbourg ; Guelders, Artois et le comté libre sont contestés."
  "The Crimean Khanate becomes an Ottoman vassal; its Nogai subjects roam the steppe east of the Dniester.": "Le khanat de Crimée devient un vassal ottoman ; ses sujets Nogai errent la steppe à l’est du Dniestr."
  "Ivan III annexes the Novgorod Republic and its northern lands.": "Ivan III annexe la République de Novgorod et ses terres septentrionales."
  "Krujë surrenders to the Ottomans, ten years after Skanderbeg’s death.": "Krujë se rend aux Ottomans, dix ans après la mort de Skanderbeg."
  "Treaty of Constantinople. Venice cedes Shkodër and Lezhë to the Ottomans.": "Traité de Constantinople. Cedes de Venise Shkodër et Lezhë aux Ottomans."
  "Francis Phoebus, count of Foix and viscount of Béarn, becomes king of Navarre.": "François Phœbus, comte de Foix et vicomte de Béarn, devient roi de Navarre."
  "Peace of Olomouc. Vladislaus II keeps Bohemia; Matthias Corvinus of Hungary keeps Moravia, Silesia and Lusatia for his lifetime.": "Paix d’Olomouc. Vladislaus II garde la Bohême ; Matthias Corvinus de Hongrie garde Moravie, Silésie et Lusatie pour sa vie."
  "Charles of Maine, the last Angevin count of Provence, dies and leaves Provence to Louis XI.": "Charles du Maine, le dernier comte d’Angevin de Provence, meurt et quitte la Provence à Louis XI."
  "Compact of Stans. Fribourg and Solothurn join the Confederacy.": "Compact de Stans. Fribourg et Soleure rejoignent la Confédération."
  "The Ottomans take Herceg Novi, the last stronghold of Herzegovina.": "Les Ottomans prennent Herceg Novi, le dernier bastion de l’Herzégovine."
  "Treaty of Arras. Maximilian accepts the loss of Burgundy and Picardy, and Artois and the Free County go to France as the dowry of his daughter Margaret, betrothed to the dauphin.": "Traité d’Arras. Maximilian accepte la perte de Bourgogne et de Picardie, et Artois et le comté libre vont en France comme la dot de sa fille Margaret, fiancée au dauphin."
  "Bayezid II takes Kilia and Akkerman (Cetatea Albă), Moldavia's ports at the mouths of the Danube and the Dniester. Suleiman I annexes the Budjak steppe between them in 1538.": "Bayezid II prend Kilia et Akkerman (Cetatea Albă), les ports de Moldavie à l’embouchure du Danube et le Dniestr. Suleiman I annexe la steppe Budjak entre eux en 1538."
  "Treaty of Bagnolo ends the War of Ferrara; Venice receives the Polesine of Rovigo.": "Traité de Bagnolo met fin à la guerre de Ferrare ; Venise reçoit le Polonais de Rovigo."
  "Matthias Corvinus takes Vienna after a long siege and makes it his residence; most of Lower Austria is under Hungarian rule until his death.": "Matthias Corvinus prend Vienne après un long siège et en fait sa résidence ; la plupart de Basse-Autriche est sous domination hongroise jusqu’à sa mort."
  "Ivan III takes Tver.": "Ivan III prend Tver."
  "Málaga surrenders to Ferdinand and Isabella after a siege.": "Málaga se rend à Ferdinand et Isabella après un siège."
  "Moscow annexes Vyatka.": "Moscou annexes Vyatka."
  "Queen Catherine Cornaro abdicates; Venice takes over Cyprus.": "La reine Catherine Cornaro abdique ; Venise prend le contrôle de Chypre."
  "Almería and Guadix surrender to Castile after the fall of Baza.": "Almería et Guadix se rendent en Castille après la chute de Baza."
  "Matthias Corvinus dies; Moravia, Silesia and Lusatia return to the Bohemian crown.": "Matthias Corvinus meurt ; Moravie, Silésie et Lusatia reviennent à la couronne de Bohême."
  "After Matthias's death Maximilian of Habsburg retakes Vienna and Lower Austria.": "Après la mort de Matthias Maximilian de Habsbourg reprend Vienne et Basse-Autriche."
  "historical-basemaps world_1492 (automatic draft, partly hand-corrected)": "historical-basemaps world_1492 (ébauche automatique partiellement corrigée à la main)"
  "Charles of Egmond returns to Guelders and wins back his family’s duchy from the Habsburgs.": "Charles d’Egmond revient à Guelders et gagne sa famille duché des Habsbourg."
  "Mengli I Giray of Crimea builds the fortress of Ochakov; Lithuania loses the Black Sea steppe (Ochakov is Ottoman from 1526).": "Mengli I Giray de Crimée construit la forteresse d’Ochakov ; la Lituanie perd la steppe de la mer Noire (Ochakov est ottoman de 1526)."
  "Muhammad XII hands over Granada to Ferdinand and Isabella; the last Muslim state in Iberia ends.": "Muhammad XII confie Grenade à Ferdinand et Isabella ; le dernier État musulman d’Iberia se termine."
  "Treaty of Barcelona. Charles VIII returns Roussillon and Cerdagne to Aragon to keep Ferdinand neutral in Italy.": "Traité de Barcelone. Charles VIII retourne Roussillon et Cerdagne à Aragon pour garder Ferdinand neutre en Italie."
  "Treaty of Senlis. Charles VIII, who has married Anne of Brittany instead of Margaret, returns Artois and the Free County to the Habsburgs.": "Traité de Senlis. Charles VIII, qui a épousé Anne de Bretagne au lieu de Margaret, retourne Artois et le comté libre aux Habsbourg."
  "Peace with Lithuania. Moscow keeps Vyazma and the Upper Oka principalities that have changed sides.": "La paix avec la Lituanie. Moscou garde Vyazma et les principautés du Haut Oka qui ont changé de camp."
  "Pisa rebels against Florence when Charles VIII’s army arrives.": "Révoltés de Pise contre Florence quand l’armée Charles VIII arrive."
  "Sweden at War border state “1495”": "Frontières d’après Sweden at War “1495”"
  "The Ottomans annex Zeta after the last Crnojević ruler leaves for Venice.": "Les Ottomans annexe Zeta après le dernier souverain de Crnojević part pour Venise."
  "The conquest of Tenerife completes Castile’s conquest of the Canary Islands.": "La conquête de Tenerife complète la conquête des îles Canaries par la Castille."
  "Castilian forces under the Duke of Medina Sidonia occupy Melilla.": "Les forces castilliennes sous le duc de Medina Sidonia occupent Melilla."
  "Venice receives Cremona as its share of Louis XII’s conquest of Milan.": "Venise reçoit la Crémone comme part de la conquête de Milan par Louis XII."
  "historical-basemaps world_1500 (automatic draft, partly hand-corrected)": "historical-basemaps world_1500 (ébauche automatique partiellement corrigée à la main)"
  "The last count of Gorizia dies; the county passes to Maximilian of Habsburg.": "Le dernier comte de Gorizia meurt ; le comté passe à Maximilian de Habsbourg."
  "The Diet of Augsburg sets up the Imperial Circles. From here on the map shows the larger territorial states of the Empire: the duchy of Lorraine, the Prince-Bishopric of Liège and the Habsburg lands in Upper Alsace.": "La Diète d’Augsbourg met en place les Cercles Impériaux. D’ici sur la carte montre les plus grands états territoriaux de l’Empire : le duché de Lorraine, le Prince-Bishopric de Liège et les terres Habsburg en Haute Alsace."
  "Imperial Reform. The Diet of Augsburg sets up the Imperial Circles. From here the map shows the larger territorial states of the Empire; before, the Empire is drawn as one. The many small states (ecclesiastical states, imperial cities, counts) remain grouped as the Holy Roman Empire. Saxony is shown as divided by the Leipzig partition of 1485 into the Ernestine electorate (Wittenberg and Thuringia) and Albertine ducal Saxony (Meissen).": "Réforme impériale. La Diète d’Augsbourg met en place les Cercles Impériaux. De là, la carte montre les plus grands états territoriaux de l’Empire ; avant, l’empire est dessiné comme un seul. Les nombreux petits états (états ecclésiastiques, villes impériales, dénombrements) restent regroupés comme le Saint Empire romain. La Saxe est représentée comme divisée par la partition de Leipzig de 1485 dans l’électorat Ernestin (Wittenberg et Thuringe) et Albertine ducal Saxe (Meissen)."
  "The County of Gorizia passes to Maximilian of Habsburg.": "Le comté de Gorizia passe à Maximilian de Habsbourg."
  "Basel joins the Confederacy (Schaffhausen follows on 10 August).": "Bâle rejoint la Confédération (Schaffhausen suit le 10 août)."
  "The Ottomans take Durrës from Venice.": "Les Ottomans prennent Durrës de Venise."
  "Mengli I Giray of Crimea sacks Sarai, and the Great Horde comes to an end. The steppe north of the Black Sea becomes the Crimean Khanate's; the Nogais hold the lands east of the Don.": "Mengli I Giray de Crimée sacs Saraï, et la Grande Horde arrive à une fin. La steppe au nord de la mer Noire devient la Crimée Khanate ; les Nogais détiennent les terres à l’est du Don."
  "Venice takes Rimini and Faenza after the fall of Cesare Borgia.": "Venise prend Rimini et Faenza après la chute de Cesare Borgia."
  "Tula and the lands of Princess Agrippina of Ryazan pass to Moscow.": "Tula et les terres de la princesse Agrippina de Riazan passent à Moscou."
  "Truce of Moscow. Lithuania cedes Chernihiv–Siveria and the upper Oka lands, about a third of its territory, to Moscow.": "Trêve de Moscou. Lituanie cède Chernihiv-Siveria et les terres de la haute Oka, environ un tiers de son territoire, à Moscou."
  "Treaty of Arona. France, holding Milan, cedes Bellinzona; with the Leventina (Uri’s since 1440), Blenio and Riviera, the northern Ticino is Swiss (Lugano and Locarno follow in 1512).": "Traité d’Arona. France, tenant Milan, cedes Bellinzona ; avec la Leventina (Uri) depuis 1440, Blenio et Riviera, le nord du Tessin est suisse (Lugano et Locarno suivent en 1512)."
  "Shah Ismail I of Persia takes the Aq Qoyunlu lands (1501–1507), Diyarbakır last.": "Shah Ismail I de Perse prend les terres Aq Qoyunlu (1501-1507), Diyarbakır dernier."
  "Shah Ismail I of Persia takes the upper Jazira with the Aq Qoyunlu lands.": "Shah Ismail I de Perse prend la haute Jazira avec les terres Aq Qoyunlu."
  "Battle of Agnadello. Venice loses its mainland for a time; Julius II recovers Romagna, and the French take Cremona for Milan.": "Bataille d’Agnadello. Venise perd son continent pour un certain temps ; Julius II récupère la Romagne, et les Français prennent Cremona pour Milan."
  "Pisa surrenders to Florence.": "Pise se rend à Florence."
  "Vasily III ends the independence of Pskov.": "Vasily III met fin à l’indépendance de Pskov."
  "The Ottomans take Srebrenik.": "Les Ottomans prennent Srebrenik."
  "The Swiss drive the French from Milan. The Grisons take the Valtellina; Julius II takes Parma, Piacenza and Reggio, the last from the Duke of Ferrara.": "Les Suisses conduisent les Français de Milan. Les Grisons prennent la Valtellina ; Julius II prend Parma, Piacenza et Reggio, le dernier duc de Ferrare."
  "Ferdinand of Aragon’s army under the Duke of Alba takes Pamplona; Upper Navarre is annexed to Castile in 1515.": "Ferdinand de l’armée d’Aragon sous le duc d’Alba prend Pampelune ; la Haute Navarre est annexée à Castille en 1515."
  "Emperor Maximilian sells Modena, which his troops had held since 1510, to Pope Leo X.": "L’empereur Maximilien vend Modène, que ses troupes tenaient depuis 1510, au pape Léon X."
  "Vasily III takes Smolensk from Lithuania.": "Vasily III prend Smolensk de Lituanie."
  "After defeating Ismail at Chaldiran (23 August 1514), Selim I takes Erzincan, Bayburt and Kemah; his commanders take Diyarbakır and the Kurdish emirates (1515–1516) and Mardin (1517).": "Après avoir vaincu Ismail à Chaldiran (23 août 1514), Selim I prend Erzincan, Bayburt et Kemah ; ses commandants prennent Diyarbakır et les émirats kurdes (1515-1516) et Mardin (1517)."
  "After Marignano, Leo X gives up Parma and Piacenza to Francis I as Duke of Milan.": "Après Marignano, Leo X abandonne Parme et Piacenza à François Ier comme duc de Milan."
  "Ferdinand of Aragon dies; his grandson Charles inherits the Spanish kingdoms, including Roussillon.": "Ferdinand d’Aragon meurt ; son petit-fils Charles hérite des royaumes espagnols, y compris Roussillon."
  "Ferdinand of Aragon dies; his grandson Charles inherits both Castile and Aragon, and the crowns are ruled together as Spain.": "Ferdinand d’Aragon meurt ; son petit-fils Charles hérite à la fois de Castille et d’Aragon, et les couronnes sont gouvernées ensemble comme l’Espagne."
  "Selim I destroys the Mamluk army at Marj Dabiq near Aleppo and takes Cilicia and the Mamluk lands west of the Euphrates.": "Selim I détruit l’armée mamelouke à Marj Dabiq près d’Alep et prend Cilicia et les terres mameloukes à l’ouest de l’Euphrate."
  "Selim I destroys the Mamluk army at Marj Dabiq; Aleppo, Damascus (September) and Jerusalem (December) open their gates.": "Selim I détruit l’armée mamelouke à Marj Dabiq ; Alep, Damas (septembre) et Jérusalem (décembre) ouvrent leurs portes."
  "Selim I defeats the last Mamluk sultan, Tumanbay, at Ridaniya outside Cairo; Egypt, Palestine and the Hejaz route pass to the Ottomans.": "Selim I bat le dernier sultan mamelouk, Tumanbay, à Ridaniya en dehors du Caire ; l’Egypte, la Palestine et la route de Hejaz passent aux Ottomans."
  "The Swabian League, which drove out Duke Ulrich in 1519, sells Württemberg to Charles V; it is ruled by Ferdinand of Austria.": "La Ligue souabe, qui a chassé le duc Ulrich en 1519, vend Württemberg à Charles V ; elle est dirigée par Ferdinand d’Autriche."
  "Papal and imperial troops retake Parma and Piacenza for Leo X.": "Les troupes papales et impériales reprennent Parma et Piacenza pour Leo X."
  "Vasily III annexes the Principality of Ryazan.": "Vasily III annexes la Principauté de Riazan."
  "Sweden at War border state “1521”": "Frontières d’après Sweden at War “1521”"
  "Suleiman I takes Belgrade and Šabac.": "Suleiman Je prends Belgrade et Šabac."
  "Selim’s son Suleiman I annexes the Dulkadirid emirate, an Ottoman vassal since 1515.": "Son fils Suleiman I annexes l’émirate dulkarid, un vassal ottoman depuis 1515."
  "The Ottomans take Knin.": "Les Ottomans prennent Knin."
  "The Knights Hospitaller surrender Rhodes after a six-month siege and leave on 1 January 1523.": "Les Chevaliers Hospitaliers rendent Rhodes après un siège de six mois et partent le 1er janvier 1523."
  "After the death of Pope Adrian VI, Alfonso I d’Este recovers Reggio.": "Après la mort du pape Adrian VI, Alfonso I d-Este récupère Reggio."
  "Friesland submits to Charles V after a decade of war with Saxony and Guelders.": "Friesland se soumet à Charles V après une décennie de guerre avec Saxe et Guelders."
  "Prussian Homage. The last grand master in Prussia, Albert of Brandenburg, becomes the first Duke of Prussia, a Lutheran duchy under the Polish crown.": "Hommage prussien. Le dernier grand maître en Prusse, Albert de Brandebourg, devient le premier duc de Prusse, un duché luthérien sous la couronne polonaise."
  "After the battle of Mohács (29 August), the Ottomans keep Syrmia and Osijek.": "Après la bataille de Mohács (29 août), les Ottomans gardent Syrmia et Osijek."
  "Ferdinand of Habsburg is elected King of Bohemia after Louis II falls at Mohács; Bohemia, Moravia, Silesia and Lusatia pass to the Habsburgs. In December he is also elected King of Hungary, and western Hungary (with the later Burgenland) comes under Habsburg rule.": "Ferdinand de Habsbourg est élu Roi de Bohême après que Louis II tombe à Mohács ; Bohème, Moravie, Silésie et Lusatia passent aux Habsbourg. En décembre il est également élu Roi de Hongrie, et l’ouest de la Hongrie (avec le Burgenland plus tard) vient sous le règne de Habsburg."
  "Two kings for Hungary. John Zápolya, crowned in November, holds the centre and east; Ferdinand of Habsburg, elected on 17 December, holds the west and north. The line between them shifts for years; Zápolya’s kingdom becomes the Principality of Transylvania.": "Deux rois pour la Hongrie. John Zápolya, couronné en novembre, tient le centre et l’est ; Ferdinand de Habsbourg, élu le 17 décembre, tient l’ouest et le nord. La ligne entre eux se déplace pendant des années ; le royaume de Zápolya è devient la Principauté de Transylvanie."
  "The Croatian estates at Cetin elect Ferdinand of Habsburg king.": "Les domaines croates de Cetin élisent Ferdinand du roi Habsbourg."
  "During the Sack of Rome, Alfonso I d’Este retakes Modena.": "Pendant le Sack de Rome, Alfonso I d-Este reprend Modena."
  "The Ottomans take Jajce and Banja Luka.": "Les Ottomans prennent Jajce et Banja Luka."
  "The Ottomans take Lika (Udbina, 1527–1528).": "Les Ottomans prennent Lika (Udbina, 1527-1528)."
  "The bishop of Utrecht hands his temporal power over Utrecht and Overijssel to Charles V.": "L’évêque d’Utrecht remet son pouvoir temporel sur Utrecht et Overijssel à Charles V."
  "historical-basemaps world_1530 (automatic draft, partly hand-corrected)": "historical-basemaps world_1530 (ébauche automatique partiellement corrigée à la main)"
  "Charles V grants Malta to the Knights of Saint John, expelled from Rhodes.": "Charles V accorde Malte aux Chevaliers de Saint-Jean, expulsés de Rhodes."
  "Charles V grants Asti to Beatrice of Portugal, Duchess of Savoy.": "Charles V accorde Asti à Béatrice du Portugal, Duchesse de Savoie."
  "The Edict of Union joins the duchy of Brittany to the kingdom of France.": "L’édit d’Union rejoint le duché de Bretagne au royaume de France."
  "Treaty of Kaaden. After Philip of Hesse defeats the Austrians at Lauffen, Ulrich is restored to Württemberg as an Austrian fief.": "Traité de Kaaden. Après la défaite de Philippe de Hesse par les Autrichiens à Lauffen, Ulrich est rétabli au Wurtemberg comme fief autrichien."
  "Groningen and Drenthe accept Charles V’s rule.": "Groningen et Drenthe acceptent la règle de Charles V."
  "Bern conquers the Vaud from Savoy.": "Bern conquiert le Vaud de Savoie."
  "Geneva adopts the Reformation and makes itself an independent republic, allied with Bern and Fribourg.": "Genève adopte la Réforme et se fait une république indépendante, alliée à Berne et Fribourg."
  "The Ottomans take Požega and western Slavonia (1536–1537).": "Les Ottomans prennent Požega et la Slavonie occidentale (1536-1537)."
  "Truce of Moscow. Lithuania recovers Homel.": "Trêve de Moscou. La Lituanie récupère Homel."
  "Suleiman I’s campaign against Petru Rareș. Moldavia becomes a tributary state; the Ottomans annex the Budjak steppe and Bender, and Brăila in Wallachia.": "La Moldavie devient un État affluent ; les Ottomans annexent la steppe et Bender Budjak, et Brăila en Wallachie."
  "Suleiman I occupies Buda. Central Hungary becomes an Ottoman province; Queen Isabella and the infant John Sigismund keep the east.": "Suleiman I occupe Buda. La Hongrie centrale devient une province ottomane ; la reine Isabella et l’enfant John Sigismond gardent l’est."
  "The Ottomans take Pécs, Siklós, Esztergom and Székesfehérvár.": "Les Ottomans prennent Pécs, Siklós, Esztergom et Székesfehérvár."
  "Treaty of Venlo. William of Cleves gives up Guelders and Zutphen to Charles V; the Seventeen Provinces are complete.": "Traité de Venlo. Guillaume de Cleves donne Guelders et Zutphen à Charles V ; les dix-sept provinces sont complètes."
  "Pope Paul III creates the Duchy of Parma and Piacenza for his son Pier Luigi Farnese.": "Le pape Paul III crée le duché de Parme et Piacenza pour son fils Pier Luigi Farnese."
  "Capitulation of Wittenberg after Mühlberg. The electorate and Wittenberg pass to the Albertine Wettins; the Ernestines keep only their Thuringian lands.": "Capitulation de Wittenberg après Mühlberg. L’électorat et Wittenberg passent aux Albertines Wettins ; les Ernestines ne gardent que leurs terres de Thuringe."
  "Suleiman I takes Van; the Peace of Amasya (1555) confirms Ottoman rule over the Lake Van region.": "Suleiman I prend Van ; la paix d’Amasya (1555) confirme le règne ottoman sur la région du lac Van."
  "Treaty of Weissenburg. Queen Isabella gives up Transylvania and the eastern counties to Ferdinand of Habsburg in exchange for Silesian duchies.": "Traité de Weissenburg. La reine Isabella donne la Transylvanie et les comtés de l’est à Ferdinand de Habsbourg en échange de duches silésiennes."
  "The Ottomans take Temesvár and the Banat, Lippa, Szolnok, Nógrád and Veszprém, and Virovitica in Slavonia; Eger holds out.": "Les Ottomans prennent Temesvár et les Banat, Lippa, Szolnok, Nógrád et Veszprém, et Virovitica en Slavonie ; Eger tient."
  "Henry II of France occupies Metz, Toul and Verdun (the Three Bishoprics), recognised as French in 1648.": "Henri II de France occupe Metz, Toul et Verdun (les Trois Bishopriques), reconnus comme français en 1648."
  "Ivan IV takes Kazan; the khanate is annexed.": "Ivan IV prend Kazan ; le khanate est annexé."
  "The Ottomans take Kaposvár.": "Les Ottomans prennent Kaposvár."
  "Laois and Offaly are shired as Queen’s County and King’s County and planted with English settlers; Carlow is under crown control again.": "Laois et Offaly sont cantonnés dans le comté de Queens et le comté de KingS et plantés avec des colons anglais ; Carlow est à nouveau sous contrôle de la couronne."
  "Russia annexes the Khanate of Astrakhan; the whole Volga is Russian.": "La Russie annexe le khanate d’Astrakhan ; l’ensemble de la Volga est russe."
  "Charles V abdicates as king of Spain. His son Philip II inherits Spain, the Netherlands and the Free County of Burgundy.": "Charles V abdique comme roi d’Espagne. Son fils Philippe II hérite de l’Espagne, des Pays-Bas et du comté libre de Bourgogne."
  "With Ottoman backing, Isabella and her son John Sigismund return to Transylvania; the Habsburg troops leave.": "Avec le soutien ottoman, Isabella et son fils John Sigismond reviennent en Transylvanie ; les troupes des Habsbourg s’en vont."
  "Most Bashkir tribes accept the tsar's rule.": "La plupart des tribus Bachkir acceptent la règle du tsar."
  "Philip II grants Siena, conquered in 1555, to Cosimo I de’ Medici, keeping the coastal State of the Presidi.": "Philippe II accorde Sienne, conquise en 1555, à Cosimo I de-. Médicis, gardant l’État côtier des Presidi."
  "The duke of Guise takes Calais from the English.": "Le duc de Guise prend Calais des Anglais."
  "Sweden at War border state “1561”": "Frontières d’après Sweden at War “1561”"
  "Union of Vilnius. The Livonian Order is dissolved; its last master, Gotthard Kettler, becomes Duke of Courland and Semigallia under the Grand Duchy of Lithuania.": "Union de Vilnius. L’Ordre livonien est dissout ; son dernier maître, Gotthard Kettler, devient duc de Courland et Semigallia sous le Grand-Duché de Lituanie."
  "Ivan IV takes Polotsk from Lithuania during the Livonian War.": "Ivan IV prend Polotsk de Lituanie pendant la guerre de Livonie."
  "The Ottomans take Szigetvár (7 September, after Suleiman’s death in his camp) and Gyula.": "Les Ottomans prennent Szigetvár (7 septembre, après la mort de Suleiman dans son camp) et Gyula."
  "Philip of Hesse dies and Hesse is divided among his sons; Hesse-Kassel and Hesse-Darmstadt are the lasting lines.": "Philippe de Hesse meurt et Hesse est divisé entre ses fils ; Hesse-Kassel et Hesse-Darmstadt sont les lignes durables."
  "Union of Lublin. The Bracław region passes from Lithuania to the Polish Crown in the new Commonwealth.": "Union de Lublin. La région de Bracław passe de la Lituanie à la Couronne polonaise dans le nouveau Commonwealth."
  "Union of Lublin. The Crown of Poland and the Grand Duchy of Lithuania become one Commonwealth; Podlasie, Volhynia, Bracław and Kyiv pass from the Grand Duchy to the Crown.": "Union de Lublin. La Couronne de Pologne et le Grand-Duché de Lituanie deviennent un Commonwealth ; Podlasie, Volhynia, Bracław et Kyiv passent du Grand-Duché à la Couronne."
  "Ivan IV takes the Don Cossacks into his service. Their lands are shown with Russia from here, though the Host governed itself, and Azov at the mouth of the Don stayed Ottoman until 1696.": "Ivan IV met les Don Cosaques à son service. Leurs terres sont montrées avec la Russie d’ici, bien que l’Hôte se gouverne, et Azov à l’embouchure du Don est resté Ottoman jusqu’en 1696."
  "Sweden at War border state “1570”": "Frontières d’après Sweden at War “1570”"
  "Famagusta surrenders after an eleven-month siege; Cyprus is Ottoman. Bar and Ulcinj fall the same year.": "Famagouste se rend après un siège de onze mois ; Chypre est ottomane. Bar et Ulcinj tombent la même année."
  "Lala Mustafa Pasha takes Kars and the Georgian principality of Samtskhe with Ardahan and Artvin.": "Lala Mustafa Pacha prend Kars et la principauté géorgienne de Samtskhe avec Ardahan et Artvin."
  "After the death of Joseph Nasi, whom Selim II made duke in 1566, the Cyclades come under direct Ottoman rule.": "Après la mort de Joseph Nasi, que Selim II fit duc en 1566, les Cyclades sont gouvernés directement par l’ottoman."
  "Stefan Báthory retakes Polotsk.": "Stefan Báthory reprend Polotsk."
  "Act of Abjuration. The provinces of the Union of Utrecht renounce Philip II; the Dutch Republic is born.": "Acte d’abrogation. Les provinces de l’Union d’Utrecht renoncent à Philippe II ; la République néerlandaise est née."
  "Sweden at War border state “1583”": "Frontières d’après Sweden at War “1583”"
  "The earl of Desmond is killed, ending the Second Desmond Rebellion. His lands are confiscated and planted as the Munster Plantation.": "Le comte de Desmond est tué, mettant fin à la Seconde rébellion desmonde. Ses terres sont confisquées et plantées comme la plantation de Munster."
  "The Composition of Connacht. The lords of Connacht and Thomond accept crown rule and English land tenure; Longford has been shired.": "La composition de Connacht. Les seigneurs de Connacht et Thomond acceptent la règle de la couronne et le régime foncier anglais ; Longford a été cantonné."
  "The fortress of Voronezh is founded on the steppe frontier.": "La forteresse de Voronezh est fondée sur la frontière steppe."
  "Samara is founded; the Volga route to Astrakhan is secured with forts (Tsaritsyn 1589, Saratov 1590).": "Samara est fondée ; la route de Volga à Astrakhan est sécurisée par des forts (Tsaritsyn 1589, Saratov 1590)."
  "Treaty of Constantinople. Persia cedes the Erivan region to the Ottomans.": "Traité de Constantinople. Perse cède la région d’Erivan aux Ottomans."
  "The Ottomans take Bihać.": "Les Ottomans prennent Bihać."
  "Archduke Matthias retakes Nógrád during the Long Turkish War.": "L’archiduc Matthias reprend Nógrád pendant la longue guerre turque."
  "Maurice of Nassau takes Groningen; Groningen and Drenthe join the Republic.": "Maurice de Nassau prend Groningen ; Groningen et Drenthe rejoignent la République."
  "Sweden at War border state “1595”": "Frontières d’après Sweden at War “1595”"
  "Belgorod is founded, and the frontier line moves south into the Wild Fields.": "Belgorod est fondée, et la frontière se déplace vers le sud dans les champs sauvages."
  "The Ottomans take Eger.": "Les Ottomans prennent Eger."
  "Verkhoturye is founded on the road across the Urals into Siberia.": "Verkhoturye est fondé sur la route qui traverse l’Oural en Sibérie."
  "Duke Alfonso II d’Este dies without a legitimate heir; Pope Clement VIII takes Ferrara, and the Este keep Modena and Reggio.": "Le duc Alfonso II d’Este meurt sans héritier légitime ; le pape Clément VIII prend Ferrare, et l’este garde Modena et Reggio."
  "historical-basemaps world_1600 (automatic draft, partly hand-corrected)": "historical-basemaps world_1600 (ébauche automatique partiellement corrigée à la main)"
  "The Ottomans take Kanizsa.": "Les Ottomans prennent Kanizsa."
  "Treaty of Lyon. Savoy cedes Bresse, Bugey and Gex to France in exchange for Saluzzo.": "Traité de Lyon. Savoy cède Bresse, Bugey et Gex à la France en échange de Saluzzo."
  "Treaty of Mellifont. Hugh O’Neill submits, ending the Nine Years’ War; the whole of Ireland is under the English crown for the first time.": "Traité de Mellifont. Hugh O-Neill soutient, mettant fin à la guerre de neuf ans ; toute l’Irlande est sous la couronne anglaise pour la première fois."
  "Shah Abbas I retakes Erivan.": "Shah Abbas, je reprend Erivan."
  "Sigismund III takes Smolensk after a siege of twenty months.": "Sigismund III prend Smolensk après un siège de vingt mois."
  "Treaty of Xanten. The Jülich-Cleves inheritance is divided; Cleves, Mark and Ravensberg go to Brandenburg, Jülich and Berg to Palatinate-Neuburg.": "Traité de Xanten. L’héritage Jülich-Cleves est divisé ; Cleves, Mark et Ravensberg se rendent à Brandebourg, Jülich et Berg à Palatinat-Neuburg."
  "Sweden at War border state “1617”": "Frontières d’après Sweden at War “1617”"
  "Duke Albert Frederick dies, and Ducal Prussia passes to the electors of Brandenburg. It stays a Polish fief until the Treaty of Wehlau (1657).": "Le duc Albert Frederick meurt, et Ducal Prusse passe aux électeurs de Brandebourg. Il reste un fief polonais jusqu’au traité de Wehlau (1657)."
  "Truce of Deulino. Moscow cedes Smolensk, Chernihiv and Siveria to the Commonwealth, which is now at its largest.": "Truce de Deulino. Moscou cède Smolensk, Chernihiv et Siveria au Commonwealth, qui est maintenant à son plus grand."
  "Louis XIII marches into Béarn, restores Catholic worship and joins Béarn and Lower Navarre to the French crown.": "Louis XIII marche à Béarn, restaure le culte catholique et rejoint Béarn et la Basse Navarre à la couronne française."
  "Ferdinand II gives the Upper Palatinate, conquered in 1621, to Maximilian of Bavaria.": "Ferdinand II donne le Palatinat supérieur, conquis en 1621, à Maximilien de Bavière."
  "Sweden at War border state “1629”": "Frontières d’après Sweden at War “1629”"
  "Duke Francesco Maria II della Rovere dies; Urbino passes to the Papal States.": "Le duc Francesco Maria II della Rovere meurt ; Urbino passe aux États pontificaux."
  "Kalmyk Oirats arrive on the lower Volga and drive the Nogais west; the Kalmyk Khanate accepts Russian suzerainty in 1655.": "Kalmyk Oirats arrive sur la basse Volga et conduit les Nogais à l’ouest ; le khanate de Kalmyk accepte la suzerainté russe en 1655."
  "Peace of Prague. Ferdinand II cedes Upper and Lower Lusatia to Saxony.": "Paix de Prague. Ferdinand II cède la Haute et la Basse Lusatie à la Saxe."
  "Tambov is founded as part of the Belgorod defensive line.": "Tambov est fondé dans le cadre de la ligne défensive Belgorod."
  "Sweden at War border state “1643”": "Frontières d’après Sweden at War “1643”"
  "Sweden at War border state “1645”": "Frontières d’après Sweden at War “1645”"
  "Sweden at War border state “1648”": "Frontières d’après Sweden at War “1648”"
  "Peace of Münster. Spain recognises the independence of the Dutch Republic, which keeps northern Brabant and Zeelandic Flanders.": "Paix de Münster. L’Espagne reconnaît l’indépendance des Provinces-Unies, qui conservent le Brabant septentrional et la Flandre zélandaise."
  "Peace of Westphalia. The Habsburgs cede Upper Alsace and the Sundgau to France, and the Three Bishoprics are confirmed as French.": "Paix de Westphalie. Les Habsbourg cèdent la Haute-Alsace et le Sundgau à la France. La souveraineté française sur les Trois-Évêchés est confirmée."
  "Peace of Westphalia. Brandenburg gains Minden, Halberstadt, Farther Pomerania and the reversion of Magdeburg; Sweden gains Western Pomerania and Bremen-Verden; the Lower Palatinate is restored to Charles Louis.": "Paix de Westphalie. Le Brandebourg obtient Minden, Halberstadt et la Poméranie ultérieure, ainsi que le droit de succéder à Magdebourg. La Suède obtient la Poméranie occidentale et Brême-et-Verden. Le Bas-Palatinat est rendu à Charles-Louis."
  "Treaty of Zboriv. The king recognises Cossack self-rule in the Kyiv, Bracław and Chernihiv voivodeships, which Khmelnytsky's Hetmanate has held since 1648.": "Traité de Zboriv. Le roi reconnaît l’autonomie Cosaque dans les voïvodies de Kiev, Bracław et Chernihiv, que le Hetmanate de Khmelnytsky a tenu depuis 1648."
  "historical-basemaps world_1650 (automatic draft, partly hand-corrected)": "historical-basemaps world_1650 (ébauche automatique partiellement corrigée à la main)"
  "The Instrument of Government gives Ireland seats in the Protectorate’s parliament; after the Cromwellian conquest Ireland is ruled as part of the Commonwealth.": "L’Instrument de gouvernement donne des sièges à l’Irlande dans le parlement du Protectorat ; après la conquête cromwellienne, l’Irlande est gouvernée comme faisant partie du Commonwealth."
  "Kharkiv is founded by Cossack settlers in Sloboda Ukraine under the tsar.": "Kharkiv est fondé par les colons Cosaques à Sloboda Ukraine sous le tsar."
  "Sweden at War border state “1654”": "Frontières d’après Sweden at War “1654”"
  "The Ordinance of Union incorporates Scotland into the Commonwealth of England, Scotland and Ireland.": "L’ordonnance de l’Union incorpore l’Écosse dans le Commonwealth d’Angleterre, d’Ecosse et d’Irlande."
  "Sweden at War border state “1658”": "Frontières d’après Sweden at War “1658”"
  "Peace of the Pyrenees. Spain cedes Roussillon and most of Artois to France.": "Paix des Pyrénées. L’Espagne cède Roussillon et la plupart des Artois à la France."
  "Sweden at War border state “1660”": "Frontières d’après Sweden at War “1660”"
  "The Restoration. Charles II returns, and Scotland and Ireland are separate kingdoms again.": "La Restauration. Charles II revient, et l’Écosse et l’Irlande sont à nouveau des royaumes séparés."
  "The Ottomans take Várad (Oradea) from Transylvania.": "Les Ottomans prennent Várad (Oradea) de Transylvanie."
  "The Ottomans take Érsekújvár (Nové Zámky) and Nógrád; the Treaty of Vasvár (1664) leaves them to the Ottomans.": "Les Ottomans prennent Érsekújvár (Nové Zámky) et Nógrád ; le traité de Vasvár (1664) les laisse aux Ottomans."
  "Treaty of Lisbon. Spain recognises Portugal’s independence; Ceuta, which had stayed loyal to Philip IV in 1640, remains Spanish.": "Traité de Lisbonne. L’Espagne reconnaît l’indépendance du Portugal ; Ceuta, qui était resté fidèle à Philippe IV en 1640, reste espagnol."
  "Treaty of Aachen ends the War of Devolution. France keeps Lille, Douai and the towns it took in Flanders.": "Le traité d’Aix-la-Chapelle met fin à la guerre de Dévolution. La France maintient Lille, Douai et les villes qu’il a prises en Flandre."
  "Candia (Heraklion) surrenders after a siege of 21 years; Venice keeps only three island forts off Crete.": "Candia (Héraklion) se rend après un siège de 21 ans ; Venise garde seulement trois forts insulaires au large de la Crète."
  "Treaty of Buczacz. Poland–Lithuania cedes Podolia and the right-bank Ukraine to the Ottomans and their Cossack vassals.": "Traité de Buczacz. Pologne-Lituanie cedes Podolia et la rive droite de l’Ukraine aux Ottomans et à leurs vassaux Cosaques."
  "Treaty of Buchach. Poland cedes Podolia to the Ottoman Empire; the right-bank Cossacks under Doroshenko accept the sultan's protection.": "Traité de Buchach. La Pologne cède Podolia à l’Empire ottoman ; les cosaques de la banque droite sous Dorochenko acceptent la protection du sultan."
  "Peace of Nijmegen. Spain cedes the Free County of Burgundy and Valenciennes, Cambrai and Maubeuge to France.": "Paix de Nijmegen. L’Espagne cède le Comté Libre de Bourgogne et Valenciennes, Cambrai et Maubeuge à la France."
  "Sweden at War border state “1679”": "Frontières d’après Sweden at War “1679”"
  "The archbishopric of Magdeburg falls to Brandenburg on the death of its last administrator.": "L’archevêque de Magdeburg tombe à Brandebourg à la mort de son dernier administrateur."
  "French troops occupy Strasbourg, the last free city in Alsace; the Truce of Ratisbon (1684) and Ryswick (1697) leave it French.": "Les troupes françaises occupent Strasbourg, la dernière ville libre d’Alsace ; la Trêve de Ratisbon (1684) et Ryswick (1697) la quittent en français."
  "Truce of Ratisbon. The Emperor and Spain accept for twenty years France’s Reunions, Strasbourg and Luxembourg, taken in June after a siege.": "Trêve de Ratisbonne. L’Empereur et l’Espagne acceptent pendant vingt ans les Reunions France, Strasbourg et Luxembourg, prises en juin après un siège."
  "The Simmern line dies out and the Palatinate passes to the Neuburg line, which also holds Jülich and Berg.": "La ligne Simmern s’éteint et le Palatinat passe à la ligne Neuburg, qui tient également Jülich et Berg."
  "The last Duke of Saxe-Lauenburg dies; the duchy passes to the dukes of Brunswick-Lüneburg (Hanover).": "Le dernier duc de Saxe-Lauenburg meurt ; le duché passe aux ducs de Brunswick-Lüneburg (Hanover)."
  "Danilo I becomes prince-bishop of Montenegro (1696 or 1697); Old Montenegro around Cetinje is in practice independent of Ottoman rule.": "Danilo I devient prince-évêque du Monténégro (1696 ou 1697) ; le vieux Monténégro autour de Cetinje est en pratique indépendant de la domination ottomane."
  "Peace of Ryswick. France returns Luxembourg to Spain, and Lorraine to its duke.": "Paix du Ryswick. La France retourne le Luxembourg en Espagne, et la Lorraine à son duc."
  "Treaty of Karlowitz. The Ottomans cede Hungary (except the Banat), Transylvania and Slavonia to the Habsburgs, the Morea and inland Dalmatia to Venice, and Podolia to Poland–Lithuania.": "Traité de Karlowitz. Les Ottomans cèdent la Hongrie (sauf le Banat), la Transylvanie et la Slavonie aux Habsbourg, la Morea et la Dalmatie intérieure à Venise, et la Podolie à la Pologne-Lituanie."
  "Treaty of Karlowitz. The Ottomans return Podolia, and right-bank Ukraine comes back under Polish rule.": "Traité de Karlowitz. Les Ottomans retournent Podolia, et l’Ukraine de droite revient sous le règne polonais."
  "historical-basemaps world_1700 (automatic draft, partly hand-corrected)": "historical-basemaps world_1700 (ébauche automatique partiellement corrigée à la main)"
  "Sweden at War border state “1700”": "Frontières d’après Sweden at War “1700”"
  "The Acts of Union join England and Scotland as the Kingdom of Great Britain.": "Les Actes de l’Union rejoignent l’Angleterre et l’Écosse en tant que Royaume de Grande-Bretagne."
  "Union of England and Scotland. The Channel Islands stay crown dependencies of the new kingdom.": "Union d’Angleterre et d’Écosse. Les îles Anglo-Normandes restent les dépendances de la couronne du nouveau royaume."
  "The estates of Neuchâtel choose Frederick I of Prussia as their prince.": "Les domaines de Neuchâtel choisissent Frederick Ier de Prusse comme leur prince."
  "Emperor Joseph I confiscates Mantua and grants Montferrat to Victor Amadeus II of Savoy.": "L’empereur Joseph I confisque Mantoue et accorde Montferrat à Victor Amadeus II de Savoie."
  "The Ottomans take over Khotyn as a district under their direct rule.": "Les Ottomans prennent Khotyn comme district sous leur domination directe."
  "Peace of Utrecht. Savoy keeps Alessandria and the Lomellina, occupied in 1707 (with the Oltrepò Pavese, ceded at Worms in 1743), and receives Sicily; Austria later receives Naples, Milan and Sardinia.": "Paix d’Utrecht. Savoie garde Alessandria et la Lomellina, occupée en 1707 (avec l’Oltrepò Pavese, cédé à Worms en 1743), et reçoit la Sicile ; l’Autriche reçoit plus tard Naples, Milan et Sardaigne."
  "Treaty of Utrecht. Spain cedes Menorca (occupied since 1708) and Gibraltar to Great Britain.": "Traité d’Utrecht. Espagne cedes Menorca (occupé depuis 1708) et Gibraltar à la Grande-Bretagne."
  "Treaty of Rastatt. The Spanish Netherlands pass to the Austrian Habsburgs.": "Traité de Rastatt. Les Pays-Bas espagnols passent aux Habsbourg autrichiens."
  "historical-basemaps world_1715 (automatic draft, partly hand-corrected)": "historical-basemaps world_1715 (ébauche automatique partiellement corrigée à la main)"
  "The Ottomans complete the reconquest of the Morea from Venice in a single summer campaign; the Treaty of Passarowitz (1718) confirms it.": "Les Ottomans achèvent la reconquête de la Morea de Venise en une seule campagne d’été ; le traité de Passarowitz (1718) le confirme."
  "Third Barrier Treaty. The Dutch receive Venlo and part of Upper Guelders; with Maastricht they hold most of Limburg.": "Les Néerlandais reçoivent Venlo et une partie des Gueldres supérieurs ; avec Maastricht, ils détiennent la plupart du Limbourg."
  "Treaty of Passarowitz. The Ottomans cede the Banat, northern Serbia and Oltenia to the Habsburgs.": "Traité de Passarowitz. Les Ottomans cèdent le Banat, le nord de la Serbie et Oltenia aux Habsbourg."
  "Vaduz and Schellenberg are united as the Principality of Liechtenstein.": "Vaduz et Schellenberg sont unis en tant que Principauté du Liechtenstein."
  "Sweden at War border state “1720”": "Frontières d’après Sweden at War “1720”"
  "Treaty of The Hague. Savoy exchanges Sicily for Sardinia, and Victor Amadeus II becomes King of Sardinia.": "Traité de La Haye. Savoie échange la Sicile avec la Sardaigne, et Victor Amadeus II devient roi de Sardaigne."
  "Sweden at War border state “1721”": "Frontières d’après Sweden at War “1721”"
  "Hans Egede lands in western Greenland, and Danish–Norwegian colonisation begins. The east coast was not reached until the 1880s.": "Hans Egede se trouve dans l’ouest du Groenland, et la colonisation danoise-norvégienne commence. La côte est n’a été atteinte que dans les années 1880."
  "Treaty of Constantinople between Russia and the Ottomans; the Ottomans occupy Erivan.": "Traité de Constantinople entre la Russie et les Ottomans ; les Ottomans occupent l’Erivan."
  "The Orenburg expedition builds forts on the Ural River (Orenburg 1743).": "L’expédition Orenburg construit des forts sur la rivière Oural (Orenburg 1743)."
  "Preliminary Peace of Vienna. Don Carlos keeps Naples and Sicily, conquered in 1734–35; Austria receives Parma and Piacenza.": "Préliminaire paix de Vienne. Don Carlos garde Naples et la Sicile, conquis en 1734–1735 ; l’Autriche reçoit Parma et Piacenza."
  "Nader takes back Erivan for Persia (1735) and is crowned shah.": "Nader reprend Erivan pour la Perse (1735) et est couronné shah."
  "Treaty of Vienna. Savoy receives Novara and Tortona from Milan.": "Traité de Vienne. Savoie reçoit Novara et Tortona de Milan."
  "Treaty of Belgrade. The Habsburgs return northern Serbia with Belgrade to the Ottomans and Oltenia to Wallachia.": "Traité de Belgrade. Les Habsbourg retournent dans le nord de la Serbie avec Belgrade aux Ottomans et Oltenia à Wallachie."
  "Preliminary Peace of Breslau (confirmed in Berlin on 28 July). Maria Theresa cedes almost all of Silesia and the county of Glatz to Prussia; Austria keeps Teschen, Troppau and Jägerndorf.": "La paix préliminaire de Breslau (confirmée à Berlin le 28 juillet). Maria Theresa cède presque toute la Silésie et le comté de Glatz à la Prusse ; l’Autriche garde Teschen, Toppau et Jägerndorf."
  "Sweden at War border state “1743”": "Frontières d’après Sweden at War “1743”"
  "Treaty of Worms. Maria Theresa promises Savoy the Upper Novarese and Vigevano for its alliance.": "Traité de Worms. Maria Theresa promet Savoy la Haute-Novarèse et Vigevano pour son alliance."
  "The last Cirksena count dies and Prussia takes East Frisia.": "Le dernier compte de Cirksena meurt et la Prusse prend la frison orientale."
  "Treaty of Aachen. Parma and Piacenza go to the Spanish Infante Philip.": "Traité d’Aix-la-Chapelle. Parma et Piacenza vont à l’Infanterie espagnole Philip."
  "France takes Fort St Philip and occupies Menorca.": "La France prend Fort St Philip et occupe Menorca."
  "Treaty of Paris. France returns Menorca to Britain.": "Traité de Paris. La France retourne Menorca en Grande-Bretagne."
  "Catherine II abolishes the office of hetman. The Hetmanate becomes the Little Russia Governorate of the Russian Empire; its last institutions go in 1781.": "Catherine II abolit la fonction d’hetman. L’Hetmanate devient le gouvernorat de la petite Russie de l’Empire russe ; ses dernières institutions vont en 1781."
  "Revestment Act. The British crown buys the lordship of Man; it stays a crown dependency outside the United Kingdom.": "La couronne britannique achète la seigneurie de l’homme ; elle demeure une dépendance de la Couronne en dehors du Royaume-Uni."
  "Stanisław Leszczyński, the former king of Poland, dies, and the duchies of Lorraine and Bar pass to France.": "Stanisław Leszczyński, l’ancien roi de Pologne, meurt, et les duchés de Lorraine et de Bar passent en France."
  "Treaty of Versailles. Genoa, unable to put down the Corsican revolt, cedes Corsica to France.": "Traité de Versailles. Gênes, incapable d’abattre la révolte corse, cède la Corse à la France."
  "Most of the Kalmyks leave for Dzungaria, and Catherine II abolishes the Kalmyk Khanate.": "La plupart des Kalmyks partent pour Dzungaria, et Catherine II abolit le khanate de Kalmyk."
  "First Partition of Poland. Prussia takes Royal Prussia (without Danzig and Thorn) and the Netze District, Austria takes Galicia, and Russia takes Polish Livonia and the lands east of the Dvina and Dnieper.": "Première partition de la Pologne. La Prusse prend la Prusse Royale (sans Danzig et Thorn) et le district de Netze, l’Autriche prend la Galice, et la Russie prend la Livonie polonaise et les terres à l’est de la Dvina et Dniepr."
  "Treaty of Küçük Kaynarca. Russia gains the steppe north of the Sea of Azov, Azov itself, Kerch and Kinburn, and Kabarda in the northern Caucasus (North Ossetia accepts Russian rule the same year); the Crimean Khanate becomes independent of the Ottomans.": "Traité de Küçük Kaynarca. La Russie gagne la steppe au nord de la mer d’Azov, Azov elle-même, Kerch et Kinburn, et Kabarda dans le nord du Caucase (Ossétie du Nord accepte la domination russe la même année) ; le khanat de Crimée devient indépendant des Ottomans."
  "The Ottomans cede Bukovina, the north-western corner of Moldavia, to the Habsburgs, who had occupied it in 1774.": "Les Ottomans cede Bukovina, l’angle nord-ouest de la Moldavie, aux Habsbourg, qui l’avaient occupé en 1774."
  "Russian troops destroy the Zaporozhian Sich; its lands become part of New Russia.": "Les troupes russes détruisent le Sich zaporozhien ; ses terres font partie de la Nouvelle Russie."
  "The Bavarian Wittelsbachs die out; Charles Theodore, Elector Palatine, inherits Bavaria and unites the two electorates.": "Les Wittelsbach bavarois meurent ; Charles Theodore, élector Palatine, hérite de la Bavière et unit les deux électeurs."
  "Peace of Teschen. Austria gains the Innviertel from Bavaria.": "La paix de Teschen. L’Autriche gagne l’Innviertel de Bavière."
  "A Franco-Spanish force takes Fort St Philip; Spain keeps Menorca at the Peace of Versailles in 1783.": "Une force franco-espagnole prend le fort St Philip ; l’Espagne maintient Menorca à la Paix de Versailles en 1783."
  "historical-basemaps world_1783 (automatic draft, partly hand-corrected)": "historical-basemaps world_1783 (ébauche automatique partiellement corrigée à la main)"
  "Catherine II annexes the Crimean Khanate, with its lands north of the Crimea and on the Kuban.": "Catherine II annexe le khanate de Crimée, avec ses terres au nord de la Crimée et sur le Kuban."
  "Sweden at War border state “1788”": "Frontières d’après Sweden at War “1788”"
  "The National Assembly annexes Avignon and the Comtat Venaissin.": "L’Assemblée nationale annexe Avignon et le Comtat Venaissin."
  "Treaty of Jassy. The Ottomans cede the land between the Southern Bug and the Dniester, with the southern half of today's Transnistria.": "Traité de Jassy. Les Ottomans cèdent la terre entre le Bug méridional et le Dniestr, avec la moitié sud de la Transnistrie actuelle."
  "Treaty of Jassy. The Ottomans cede Ochakov and the land between the Southern Bug and the Dniester.": "Traité de Jassy. Les Ottomans cèdent Ochakov et la terre entre le Bug du Sud et le Dniestr."
  "France annexes Savoy as the department of Mont-Blanc.": "La France annexe Savoy comme département du Mont-Blanc."
  "Second Partition of Poland. Podolia, with the northern half of today's Transnistria, goes to Russia.": "Deuxième Partition de Pologne. Podolia, avec la moitié nord de la Transnistrie d’aujourd'hui, va en Russie."
  "Second Partition of Poland. Prussia takes Greater Poland, Danzig and Thorn; Russia takes central Belarus and right-bank Ukraine.": "Deuxième partition de la Pologne. La Prusse prend la Grande Pologne, Danzig et Thorn ; la Russie prend le Belarus central et l’Ukraine à droite."
  "France annexes the county of Nice.": "La France annexe le comté de Nice."
  "France annexes Monaco.": "La France annexes Monaco."
  "The northern part of the prince-bishopric of Basel, occupied by France, is annexed as the department of Mont-Terrible.": "La partie nord du prince-évêque de Bâle, occupée par la France, est annexée comme département du Mont-Terrible."
  "Sweden at War border state “1795”": "Frontières d’après Sweden at War “1795”"
  "The stadtholder flees as French troops cross the frozen rivers; the Batavian Republic is proclaimed.": "Le holder s’enfuit alors que les troupes françaises traversent les fleuves gelés ; la République batave est proclamée."
  "Treaty of The Hague. The Batavian Republic cedes Zeelandic Flanders, Maastricht and Venlo to France.": "Traité de La Haye. La République de Batave cède la Flandre zélandaise, Maastricht et Venlo à la France."
  "France annexes the Austrian Netherlands and the Prince-Bishopric of Liège; Austria recognises the annexation at Campo Formio (1797).": "La France annexe les Pays-Bas autrichiens et le Prince Bishopric de Liège ; l’Autriche reconnaît l’annexion à Campo Formio (1797)."
  "Third Partition of Poland. The Commonwealth disappears from the map. Russia also annexes the Duchy of Courland.": "Troisième partition de la Pologne. Le Commonwealth disparaît de la carte. La Russie annexe également le duché de Courland."
  "After the Montenegrin victory at Krusi, the Bjelopavlići and Piperi clans join Montenegro.": "Après la victoire du Monténégrin à Krusi, les clans Bjelopavlići et Piperi rejoignent le Monténégro."
  "Treaty of Campo Formio. The Republic of Venice is abolished; Austria takes Venetian Albania with the Bay of Kotor, and France the Ionian Islands.": "Traité de Campo Formio. La République de Venise est abolie ; l’Autriche prend l’Albanie vénitienne avec la baie de Kotor, et la France les îles Ioniennes."
  "Treaty of Campo Formio. Austria accepts the French annexation of the left bank of the Rhine, organised as four departments in 1798 and confirmed at Lunéville in 1801.": "Traité de Campo Formio. L’Autriche accepte l’annexion française de la rive gauche du Rhin, organisée comme quatre départements en 1798 et confirmée à Lunéville en 1801."
  "Treaty of Campo Formio. Austria recognises the Cisalpine Republic (Lombardy, Mantua, Modena, Massa and the Papal Legations, with Venetian Bergamo, Brescia and Crema) and receives Venice with the Venetian mainland, Istria and Dalmatia.": "Traité de Campo Formio. L’Autriche reconnaît la République Cisalpine (Lombardy, Mantua, Modène, Massa et les légations papales, avec Bergame vénitienne, Brescia et Crema) et reçoit Venise avec le continent vénitien, Istrie et Dalmatie."
  "French troops proclaim the Roman Republic; Pius VI is taken into exile.": "Les troupes françaises proclament la République romaine ; Pie VI est emmené en exil."
  "France annexes Geneva.": "France annexes Genève."
  "The Valais is incorporated into the Helvetic Republic, the French-backed unitary state that replaced the Old Confederacy in April.": "Le Valais est incorporé dans la République helvétique, l’État unitaire soutenu par la France qui a remplacé la vieille Confédération en avril."
  "Napoleon takes Malta from the Knights on his way to Egypt.": "Napoléon prend Malte des Chevaliers sur son chemin vers l’Egypte."
  "Britain occupies Menorca again.": "La Grande-Bretagne occupe à nouveau Menorca."
  "The Grisons join the Helvetic Republic as the canton of Raetia.": "Les Grisons rejoignent la République helvétique en tant que canton de Raetia."
  "Neapolitan troops enter Rome; the Roman Republic ends and papal rule is restored in 1800.": "Les troupes napolitaines entrent à Rome ; la République romaine s’achève et la domination papale est rétablie en 1800."
  "historical-basemaps world_1800 (automatic draft, partly hand-corrected)": "historical-basemaps world_1800 (ébauche automatique partiellement corrigée à la main)"
  "Russia and the Ottomans set up the Septinsular Republic in the Ionian Islands, under Ottoman suzerainty.": "La Russie et les Ottomans installent la République Septinsulaire dans les îles Ioniennes, sous la suzeraine."
  "The French garrison of Valletta surrenders to the British after a two-year siege.": "La garnison française de Valletta se rend aux Britanniques après un siège de deux ans."
  "The Act of Union joins the Kingdom of Ireland to Great Britain as the United Kingdom of Great Britain and Ireland.": "L’Acte de l’Union rejoint le Royaume d’Irlande en Grande-Bretagne en tant que Royaume-Uni de Grande-Bretagne et d’Irlande."
  "Treaty of Lunéville. After Marengo the Cisalpine Republic is restored, now with Novara, the Ossola and the Lomellina.": "Traité de Lunéville. Après Marengo la République Cisalpine est restaurée, maintenant avec Novara, l’Ossola et la Lomellina."
  "Treaty of Badajoz, after the War of the Oranges. Portugal cedes Olivenza to Spain.": "Traité de Badajoz, après la guerre des Oranges. Portugal cède Olivenza à l’Espagne."
  "Alexander I annexes the kingdom of Kartli-Kakheti (eastern Georgia).": "Alexandre Ier joint le royaume de Kartli-Kakheti (Géorgie orientale)."
  "Treaty of Amiens. Britain returns Menorca to Spain.": "Traité d’Amiens. La Grande-Bretagne retourne Menorca en Espagne."
  "Napoleon detaches the Valais from Switzerland as a separate republic.": "Napoléon détache le Valais de la Suisse comme une république séparée."
  "France annexes Piedmont.": "France annexes Piémont."
  "Mingrelia accepts Russian rule, and a Russian expedition subdues the Jar-Belokani communities.": "Mingrelia accepte la règle russe, et une expédition russe soumet les communautés Jar-Belokani."
  "Reichsdeputationshauptschluss. Almost all ecclesiastical states and most imperial cities are given to the secular princes as compensation for the left bank of the Rhine.": "Reichsdeputationshauptschluss. Presque tous les états ecclésiastiques et la plupart des villes impériales sont donnés aux princes séculiers comme compensation pour la rive gauche du Rhin."
  "Russian troops storm Ganja; the khanate is annexed.": "Les troupes russes s’emparent de Ganja ; le khanate est annexé."
  "France annexes the Ligurian Republic.": "La France annexe la République Ligurienne."
  "The sultan recognises Muhammad Ali, chosen by Cairo’s notables, as governor of Egypt; he and his heirs rule it as an autonomous state.": "Le sultan reconnaît Muhammad Ali, choisi par les notables du Caire, comme gouverneur de l’Egypte ; lui et ses héritiers le gouvernent comme un État autonome."
  "Treaty of Pressburg. Austria cedes the former Venetian lands, with the Bay of Kotor, to Napoleon’s Kingdom of Italy.": "Traité de Pressburg. L’Autriche cède les anciennes terres vénitiennes, avec la baie de Kotor, au Royaume Napoléon d’Italie."
  "Peace of Pressburg. Austria cedes Tyrol and Vorarlberg to Bavaria and Further Austria to Baden and Württemberg, and gains Salzburg.": "L’Autriche cède le Tyrol et le Vorarlberg à la Bavière, puis l’Autriche à Baden et au Württemberg et gagne Salzbourg."
  "Peace of Pressburg. Austria cedes Venetia, Venetian Istria and Dalmatia to the Kingdom of Italy.": "Paix de Pressburg. Autriche cedes Venetia, Istrie Vénitienne et Dalmatie au Royaume d’Italie."
  "Russian forces take Baku, Derbent and Quba.": "Les forces russes prennent Bakou, Derbent et Quba."
  "Prussia cedes Neuchâtel to Napoleon, who gives it to Marshal Berthier.": "La Prusse cède Neuchâtel à Napoléon, qui la donne au maréchal Berthier."
  "Napoleon creates the Grand Duchy of Berg for Joachim Murat from Berg and the Prussian part of Cleves.": "Napoléon crée le Grand-Duché de Berg pour Joachim Murat de Berg et la partie prussienne de Cleves."
  "Napoleon joins Massa and Carrara to his sister Elisa’s Principality of Lucca.": "Napoléon rejoint Massa et Carrara à sa sœur Elisa, la Principauté de Lucques."
  "The Confederation of the Rhine. Its members leave the Empire, which Francis II dissolves on 6 August, and absorb the remaining counts and knights.": "La Confédération du Rhin. Ses membres quittent l’Empire, que François II dissout le 6 août, et absorbent les autres comtes et chevaliers."
  "Sweden at War border state “1807”": "Frontières d’après Sweden at War “1807”"
  "Treaty of Tilsit. Russia gives the Ionian Islands to France.": "Traité de Tilsit. La Russie donne les îles Ioniennes à la France."
  "Peace of Tilsit. Prussia loses all its lands west of the Elbe; Erfurt becomes a French imperial domain.": "Paix de Tilsit. La Prusse perd toutes ses terres à l’ouest de l’Elbe ; Erfurt devient un domaine impérial français."
  "Treaties of Tilsit. Napoleon makes the Duchy of Warsaw out of Prussia's partition gains; Danzig becomes a free city and Białystok goes to Russia.": "Traités de Tilsit. Napoléon fait le duché de Varsovie à partir des gains de partition de la Prusse ; Danzig devient une ville libre et Białystok va en Russie."
  "Napoleon creates the Kingdom of Westphalia for his brother Jérôme from Hesse-Kassel, Brunswick and Prussia’s lands west of the Elbe.": "Napoléon crée le Royaume de Westphalie pour son frère Jérôme à partir des terres de Hesse-Kassel, Brunswick et Prusse à l’ouest de l’Elbe."
  "East Frisia is given to the Kingdom of Holland.": "La frison orientale est donnée au Royaume de Hollande."
  "Mark, Münster and other former Prussian lands are added to the Grand Duchy of Berg.": "Mark, Münster et d’autres anciennes terres prussiennes sont ajoutés au Grand-Duché de Berg."
  "Marshal Marmont abolishes the Republic of Ragusa, which is joined to the Kingdom of Italy.": "Le maréchal Marmont abolit la République de Ragusa, qui est rattachée au Royaume d’Italie."
  "Napoleon annexes the Marches, taken from the Papal States, to the Kingdom of Italy.": "Napoléon annexe les Marches, prises des Etats Pontificaux, au Royaume d’Italie."
  "France annexes Parma and Tuscany (the Kingdom of Etruria, dissolved in December 1807).": "France annexes Parme et Toscane (le Royaume d’Etrurie, dissout en décembre 1807)."
  "Sweden at War border state “1809”": "Frontières d’après Sweden at War “1809”"
  "Napoleon annexes Rome and the rest of the Papal States to France; Pius VII is arrested in July.": "Napoléon annexes Rome et le reste des États pontificaux à la France ; Pie VII est arrêté en juillet."
  "Treaty of Fredrikshamn. Sweden cedes Finland and Åland to Russia. Alexander I had already promised the Diet of Porvoo (March 1809) to rule Finland as an autonomous grand duchy.": "Traité de Fredrikshamn. La Suède cède la Finlande et Åland à la Russie. Alexandre J’avais déjà promis à la Diète de Porvoo (mars 1809) de gouverner la Finlande comme un grand duché autonome."
  "Treaty of Schönbrunn. Austria cedes Carniola, Gorizia, Trieste, Istria, western Carinthia and Croatia south of the Sava; with Dalmatia, Ragusa and Kotor from the Kingdom of Italy they form the Illyrian Provinces of the French Empire.": "Traité de Schönbrunn. Autriche cedes Carniola, Gorizia, Trieste, Istrie, Carinthie occidentale et Croatie au sud de la Save ; avec Dalmatie, Raguse et Kotor du Royaume d’Italie ils forment les Provinces Illyriennes de l’Empire français."
  "Treaty of Schönbrunn. After the Austro-Polish War, the Duchy of Warsaw gains West Galicia with Kraków; Russia takes the Tarnopol district.": "Traité de Schönbrunn. Après la guerre austro-polonaise, le duché de Varsovie gagne la Galice occidentale avec Cracovie ; la Russie prend le district de Tarnopol."
  "Russia deposes King Solomon II and annexes Imereti. Abkhazia and Guria become Russian protectorates (both are annexed outright later, Guria in 1829).": "La Russie pose le roi Salomon II et les annexes Imereti. L’Abkhazie et la Guria deviennent des protectorats russes (les deux sont annexés tout à fait plus tard, Guria en 1829)."
  "Treaty of Paris between France and Bavaria. Bavaria gains Salzburg and the Innviertel (ceded by Austria at Schönbrunn) and gives South Tyrol and Trentino to the Kingdom of Italy.": "Traité de Paris entre la France et la Bavière. La Bavière gagne Salzbourg et l’Innviertel (cédé par l’Autriche à Schönbrunn) et donne Tyrol du Sud et Trentino au Royaume d’Italie."
  "Most of Hanover, under French occupation since 1803, is given to the Kingdom of Westphalia.": "La majeure partie de Hanovre, sous occupation française depuis 1803, est donnée au Royaume de Westphalie."
  "Louis Bonaparte cedes the Dutch lands south of the Waal to France.": "Louis Bonaparte cède les terres néerlandaises au sud de la Waal à la France."
  "Napoleon annexes the Kingdom of Holland to France.": "Napoléon annexe le Royaume de Hollande à la France."
  "France annexes the Kingdom of Holland, with East Frisia.": "La France annexe le Royaume des Pays-Bas, avec la Frise orientale."
  "France annexes the Valais as the département of the Simplon, to secure the road over the Simplon Pass.": "La France annexe le Valais comme département du Simplon, pour sécuriser la route au-dessus du col de Simplon."
  "France annexes the North Sea coast of Germany, with Oldenburg, Bremen, Hamburg, Lübeck and Lauenburg.": "La France annexe la côte de la mer du Nord de l’Allemagne, avec Oldenburg, Brême, Hambourg, Lübeck et Lauenburg."
  "Alexander I joins “Old Finland”, the Vyborg province taken from Sweden in 1721 and 1743, to the Grand Duchy.": "Alexander Ie rejoint l’ancienne Finlande, la province de Vyborg prise de Suède en 1721 et 1743, au Grand-Duché."
  "Treaty of Bucharest. The Ottomans cede the eastern half of Moldavia, between the Prut and the Dniester, which Russia names Bessarabia.": "Traité de Bucarest. Les Ottomans cèdent la moitié orientale de la Moldavie, entre le Prut et le Dniestr, que la Russie nomme Bessarabia."
  "Treaty of Gulistan. Persia recognises Russian rule over Georgia, Dagestan and the khanates north of the Aras, including Talysh.": "La Perse reconnaît la domination russe sur la Géorgie, le Daghestan et les khanats au nord de l’Aras, y compris Talysh."
  "After Leipzig the Kingdom of Westphalia collapses; the Elector of Hesse, the Duke of Brunswick, Prussia and Hanover return.": "Après Leipzig, le royaume de Westphalie s’effondre ; l’électeur de Hesse, le duc de Brunswick, la Prusse et Hanovre reviennent."
  "The Allies take over north-west Germany; the Grand Duchy of Berg comes under Prussian-led administration and the French departments on the coast are dissolved (Hamburg holds out until May 1814).": "Les Alliés prennent le contrôle du nord-ouest de l’Allemagne ; le Grand-Duché de Berg est sous administration prussienne et les départements français sur la côte sont dissous (Hambourg tient jusqu’en mai 1814)."
  "The French have left the northern Netherlands; William of Orange returns and is proclaimed sovereign prince.": "Les Français ont quitté les Pays-Bas du nord ; Guillaume d’Orange revient et est proclamé prince souverain."
  "Austrian troops enter the Valais and the French department of the Simplon is dissolved.": "Les troupes autrichiennes entrent dans le Valais et le département français du Simplon est dissous."
  "The French leave Geneva, which restores its republic.": "Les Français quittent Genève, qui restaure sa république."
  "The French garrison of Erfurt surrenders; the town returns to Prussia.": "La garnison française d’Erfurt se rend ; la ville retourne en Prusse."
  "Treaty of Kiel. Norway goes to Sweden, but Iceland, the Faroes and Greenland stay with Denmark. The kingdom is Denmark alone again, with the duchies.": "Traité de Kiel. La Norvège se rend en Suède, mais l’Islande, les Féroé et le Groenland restent avec le Danemark. Le royaume est à nouveau seul au Danemark, avec les duches."
  "Sweden at War border state “1814”": "Frontières d’après Sweden at War “1814”"
  "Treaty of Fontainebleau. Parma and Piacenza go to Napoleon’s wife Marie Louise.": "Traité de Fontainebleau. Parma et Piacenza vont à la femme de Napoléon Marie Louise."
  "Lord William Bentinck restores the Republic of Genoa.": "Lord William Bentinck restaure la République de Gênes."
  "Davout’s garrison leaves Hamburg.": "La garnison de Davout quitte Hambourg."
  "After Austria reconquers the Illyrian Provinces in 1813, the First Peace of Paris returns them, with Dalmatia, Ragusa and Kotor, to Austria.": "Après la reconquête des Provinces Illyriennes en 1813, la Première Paix de Paris les ramène en Autriche, avec Dalmatie, Raguse et Kotor."
  "First Peace of Paris. France gives up Nice; it keeps Chambéry and Annecy for now.": "Première Paix de Paris. La France renonce à Nice, elle garde Chambéry et Annecy pour l’instant."
  "First Peace of Paris. France gives up the left bank of the Rhine except Saarbrücken and Saarlouis; the north comes under Prussian administration, the Palatinate and Rhenish Hesse under a joint Austrian–Bavarian one.": "Première Paix de Paris. La France abandonne la rive gauche du Rhin à l’exception de Sarrebruck et de Saarlouis ; le nord relève de l’administration prussienne, le Palatinat et la Hesse rhénane sous une commune Autrichien-Bavarien."
  "First Peace of Paris. Austria, whose troops had occupied northern Italy in April, receives Lombardy and Venetia; Piedmont, Novara and Nice return to Sardinia, the Papal States to the pope, Tuscany to its grand duke, Modena to the Este, Massa to Maria Beatrice d’Este, and Monaco to its prince.": "Première Paix de Paris. L’Autriche, dont les troupes avaient occupé le nord de l’Italie en avril, reçoit la Lombardie et la Vénétie ; Piémont, Novare et Nice reviennent en Sardaigne, les États pontificaux au pape, la Toscane à son grand duc, Modène à l’Este, Massa à Maria Béatrice d’Este, et Monaco à son prince."
  "Bavaria returns Tyrol and Vorarlberg to Austria, which also takes back Trentino and South Tyrol from the Kingdom of Italy.": "La Bavière retourne le Tyrol et le Vorarlberg en Autriche, qui reprend également le Trentin et le Tyrol du Sud du Royaume d’Italie."
  "The Eight Articles of London. The Allies agree to unite the former Austrian Netherlands with the Dutch state under William of Orange, who takes over their government in August.": "Les huit articles de Londres. Les Alliés conviennent d’unir les anciens Pays-Bas autrichiens à l’État néerlandais sous William d’Orange, qui prend le contrôle de leur gouvernement en août."
  "Sweden at War border state “1814b”": "Frontières d’après Sweden at War “1814b”"
  "historical-basemaps world_1815 (automatic draft, partly hand-corrected)": "historical-basemaps world_1815 (ébauche automatique partiellement corrigée à la main)"
  "The Congress of Vienna gives Genoa and Liguria to the Kingdom of Sardinia.": "Le Congrès de Vienne donne Gênes et la Ligurie au Royaume de Sardaigne."
  "The powers at Vienna award the former prince-bishopric of Basel to Bern.": "Les pouvoirs de Vienne attribuent à Berne l’ancien prince-évêque de Bâle."
  "The Valais, Neuchâtel and Geneva join the Confederation as cantons (Neuchâtel remains a principality of the King of Prussia until 1848).": "Le Valais, Neuchâtel et Genève rejoignent la Confédération en tant que cantons (Neuchâtel reste une principauté du roi de Prusse jusqu’en 1848)."
  "Denmark gains Lauenburg as compensation for Norway and Swedish Pomerania (taking possession in 1816). Holstein and Lauenburg join the German Confederation.": "Le Danemark gagne Lauenburg comme compensation pour la Norvège et la Poméranie suédoise (prise en possession en 1816). Holstein et Lauenburg rejoignent la Confédération allemande."
  "Final Act of the Congress of Vienna. Luxembourg becomes a grand duchy in personal union with the Netherlands and a member of the German Confederation; Eupen and Malmedy go to Prussia.": "Acte final du Congrès de Vienne. Le Luxembourg devient grand-duché en union personnelle avec les Pays-Bas et membre de la Confédération allemande ; Eupen et Malmedy se rendent en Prusse."
  "Final Act of the Congress of Vienna. Saxony cedes the north of the kingdom, with Lower Lusatia and northern Upper Lusatia, to Prussia; Prussia gains the Rhineland and Westphalia; Hanover gains East Frisia.": "Acte final du Congrès de Vienne. La Saxe cède à la Prusse le nord du royaume, avec la Basse Lusatie et le Nord de la Haute Lustia ; la Prusse gagne la Rhénanie et la Westphalie ; Hanovre gagne la Frésie orientale."
  "Final Act of the Congress of Vienna. The Kingdom of Poland (Congress Poland) is created in union with Russia, Kraków becomes a free city, and Prussia keeps Posen and Danzig.": "Acte final du Congrès de Vienne. Le Royaume de Pologne (Congress Poland) est créé en union avec la Russie, Cracovie devient une ville libre, et la Prusse garde Posen et Danzig."
  "Prussia takes over Swedish Pomerania, which Denmark (given it at Kiel in 1814) has exchanged for Lauenburg.": "La Prusse prend le contrôle de la Poméranie suédoise, que le Danemark (pardonné à Kiel en 1814) a échangé avec Lauenburg."
  "Treaty of Paris. The Ionian Islands become the United States of the Ionian Islands under British protection.": "Traité de Paris. Les îles Ioniennes deviennent les États-Unis des îles Ioniennes sous la protection britannique."
  "Second Peace of Paris. France returns the rest of Savoy to the Kingdom of Sardinia.": "Deuxième Paix de Paris. La France retourne le reste de la Savoie au Royaume de Sardaigne."
  "Second Peace of Paris. France cedes Saarbrücken and Saarlouis.": "Deuxième Paix de Paris. France cedes Sarrebruck et Sarrelouis."
  "Treaty of Munich (14 April). Bavaria returns Salzburg and the Innviertel to Austria and receives the Palatinate on the left bank of the Rhine.": "Traité de Munich (14 avril). La Bavière retourne Salzbourg et l’Innviertel en Autriche et reçoit le Palatinat sur la rive gauche du Rhin."
  "Hesse-Darmstadt takes possession of Rhenish Hesse (Mainz, Worms, Alzey).": "Hesse-Darmstadt prend possession de Rhenish Hesse (Mainz, Worms, Alzey)."
  "Ferdinand IV of Naples, restored in 1815, unites his kingdoms as the Kingdom of the Two Sicilies.": "Ferdinand IV de Naples, restauré en 1815, unit ses royaumes comme le Royaume des Deux Sicilies."
  "The assembly in Belgrade recognises Miloš Obrenović as hereditary prince. Serbia, autonomous in practice since the Second Serbian Uprising (1815), has its status confirmed by the sultan in 1830.": "L’assemblée de Belgrade reconnaît Miloš Obrenović comme prince héréditaire. La Serbie, autonome dans la pratique depuis le deuxième soulèvement serbe (1815), a son statut confirmé par le sultan en 1830."
  "Treaty of Turkmenchay. Persia cedes the khanates of Erivan and Nakhchivan.": "Traité de Turkmenchay. Persia cède les khanates d’Erivan et de Nakhchivan."
  "After the Battle of Khasauka, Karachay is annexed.": "Après la bataille de Khasauka, Karachay est annexé."
  "Treaty of Adrianople. The Ottoman fortresses on the Danube’s left bank, Brăila among them, go back to Wallachia, and the principalities come under Russian protection.": "Traité d’Adrianople. Les forteresses ottomanes sur le Danube ont laissé la rive, Brăila parmi eux, retourner à Wallachie, et les principautés sont sous protection russe."
  "Treaty of Adrianople. The Ottomans cede Akhaltsikhe and Akhalkalaki and recognise Russian rule over Georgia and the eastern Black Sea coast.": "Traité d’Adrianople. Les Ottomans cèdent Akhaltsikhe et Akhalkalaki et reconnaissent la domination russe sur la Géorgie et la côte orientale de la mer Noire."
  "Maria Beatrice d’Este dies; Massa and Carrara pass to her son, Duke Francis IV of Modena.": "Maria Béatrice d’Este meurt ; Massa et Carrara passent à son fils, le duc François IV de Modène."
  "London Protocol. Britain, France and Russia recognise Greece as an independent kingdom: the Peloponnese, Central Greece south of a line from the Aspropotamos to Zitouni, Euboea and the Cyclades.": "La Grande-Bretagne, la France et la Russie reconnaissent la Grèce comme un royaume indépendant : le Péloponnèse, la Grèce centrale au sud d’une ligne allant des Aspropotamos à Zitouni, Euboea et les Cyclades."
  "The sultan gives Crete to Muhammad Ali of Egypt in return for his help against the Greek revolution.": "Le sultan donne la Crète à Muhammad Ali d’Égypte en échange de son aide contre la révolution grecque."
  "The Belgian revolution. A provisional government declares Belgium independent of the United Kingdom of the Netherlands; Limburg (except Maastricht) and most of Luxembourg join the revolt.": "La révolution belge. Un gouvernement provisoire déclare la Belgique indépendante du Royaume-Uni des Pays-Bas ; le Limbourg (sauf Maastricht) et la plupart du Luxembourg rejoignent la révolte."
  "Treaty of Constantinople. The Ottomans accept the Arta–Volos line, which adds Acarnania to Greece.": "Traité de Constantinople. Les Ottomans acceptent la ligne Arta-Volos, qui ajoute Acarnania à la Grèce."
  "A decree of the sultan adds six districts to Serbia, among them the Krajina, Crna Reka and Kruševac.": "Un décret du sultan ajoute six districts à la Serbie, parmi lesquels la Krajina, Crna Reka et Kruševac."
  "Convention of Kütahya. After Ibrahim Pasha’s victories, the sultan gives Muhammad Ali Syria, Palestine and the district of Adana.": "Convention de Kütahya. Après les victoires d’Ibrahim Pacha, le sultan donne Muhammad Ali Syrie, la Palestine et le district d’Adana."
  "Treaty of London. The Netherlands recognises Belgium; Limburg and Luxembourg are divided, the eastern halves staying with William I.": "Traité de Londres. Les Pays-Bas reconnaissent la Belgique, le Limbourg et le Luxembourg sont divisés, les moitiés orientales demeurant avec William Ier."
  "Muhammad Ali accepts the London convention and returns Crete and Syria to the Ottomans.": "Muhammad Ali accepte la convention de Londres et retourne la Crète et la Syrie aux Ottomans."
  "Under pressure from Britain, Austria and Russia, Muhammad Ali accepts the London convention and gives up Syria and Adana; Egypt becomes his family’s hereditary governorship.": "Sous la pression de la Grande-Bretagne, de l’Autriche et de la Russie, Muhammad Ali accepte la convention de Londres et abandonne la Syrie et Adana ; l’Egypte devient sa famille."
  "After the Kraków Uprising, Austria annexes the Free City as the Grand Duchy of Kraków.": "Après le soulèvement de Cracovie, l’Autriche annexe la ville libre comme le Grand-Duché de Cracovie."
  "Duke Charles Louis hands Lucca to Tuscany.": "Le duc Charles Louis livre Lucca à la Toscane."
  "The princes of Hohenzollern-Hechingen and Hohenzollern-Sigmaringen cede their lands to Prussia.": "Les princes de Hohenzollern-Hechingen et Hohenzollern-Sigmaringen cèdent leurs terres à la Prusse."
  "Treaty of Paris. After the Crimean War Russia cedes southern Bessarabia (Cahul, Bolgrad, Izmail) to Moldavia, keeping it away from the mouths of the Danube.": "Traité de Paris. Après la guerre de Crimée, la Russie cède le sud de Bessarabia (Cahul, Bolgrad, Izmail) à la Moldavie, en l’éloignant des embouchures du Danube."
  "Alexandru Ioan Cuza, already prince of Moldavia, is elected prince of Wallachia too. The United Principalities take the name Romania in 1862 and become independent in 1878.": "Alexandru Ioan Cuza, déjà prince de Moldavie, est également élu prince de Wallachie. Les principautés unies prennent le nom de Roumanie en 1862 et deviennent indépendantes en 1878."
  "Alexandru Ioan Cuza is elected prince of both Moldavia and Wallachia, the start of Romania.": "Alexandru Ioan Cuza est élu prince à la fois de Moldavie et de Wallachie, le départ de la Roumanie."
  "Imam Shamil surrenders at Gunib; Chechnya and mountain Dagestan come under Russian rule.": "L’imam Shamil se rend à Gunib ; la Tchétchénie et le Daghestan de montagne sont sous domination russe."
  "A boundary commission marks Montenegro’s border after its victory at Grahovac (1858), adding Grahovo, Drobnjak and the upper Vasojevići.": "Une commission de délimitation marque la frontière du Monténégro après sa victoire à Grahovac (1858), ajoutant Grahovo, Drobnjak et le Vasojevići supérieur."
  "Treaty of Zürich. After the Second Italian War of Independence, Austria cedes Lombardy (without Mantua) to France, which passes it to Sardinia.": "Traité de Zurich. Après la Seconde Guerre d’Indépendance italienne, l’Autriche cède la Lombardie (sans Mantoue) à la France, qui la passe en Sardaigne."
  "After plebiscites, Sardinia annexes Parma, Modena and the Papal Legations (Emilia and Romagna).": "Après les plébiscites, la Sardaigne annexes Parme, Modène et les Légations pontificales (Émilie et Romagne)."
  "Sardinia annexes Tuscany after a plebiscite.": "Annexes Sardaigne Toscane après un plébiscite."
  "Treaty of Turin. Sardinia cedes Savoy and Nice to France in return for its support in 1859; plebiscites in April confirm the transfer.": "Traité de Turin. La Sardaigne cède Savoy et Nice à la France en échange de son soutien en 1859, les plébiscites en avril confirment le transfert."
  "Sardinia annexes the Two Sicilies, conquered by Garibaldi’s Thousand and the Sardinian army, and the Marche and Umbria, taken from the Papal States, after plebiscites. Gaeta holds out until February 1861.": "La Sardaigne annexe les Deux Sicilies, conquises par Garibaldi de Mille et l’armée sarde, et les Marches et Ombrie, prises des Etats Pontificaux, après des plébiscites. Gaeta tient jusqu’en février 1861."
  "The Kingdom of Italy is proclaimed in Turin, with Victor Emmanuel II as king.": "Le Royaume d’Italie est proclamé à Turin, avec Victor Emmanuel II comme roi."
  "The last Circassian resistance ends at Kbaade (Krasnaya Polyana). Most Circassians are killed or driven out to the Ottoman Empire.": "La dernière résistance circassienne se termine à Kbaade (Krasnaya Polyana).La plupart des Circassiens sont tués ou chassés vers l’Empire ottoman."
  "Britain hands the Ionian Islands to Greece, as agreed in the Treaty of London of March 1864.": "La Grande-Bretagne remet les îles Ioniennes à la Grèce, comme convenu dans le traité de Londres de mars 1864."
  "Treaty of Vienna. After the Second Schleswig War, Denmark cedes Schleswig, Holstein and Lauenburg to Prussia and Austria jointly.": "Traité de Vienne. Après la Seconde Guerre du Schleswig, le Danemark cède le Schleswig, Holstein et Lauenburg à la Prusse et l’Autriche conjointement."
  "Gastein Convention. Prussia takes over Schleswig and buys Lauenburg; Austria administers Holstein.": "Convention de Gastein. La Prusse reprend le Schleswig et achète Lauenburg ; l’Autriche administre Holstein."
  "Peace of Prague. After the Austro-Prussian War, Austria gives up Holstein; Prussia annexes the duchies.": "Paix de Prague. Après la guerre austro-prussienne, l’Autriche abandonne Holstein ; Prusse annexes les duches."
  "After the Austro-Prussian War Prussia annexes Hanover, Hesse-Kassel, Nassau and Frankfurt (the law of 20 September; Schleswig-Holstein follows in 1867).": "Après la Prusse de guerre austro-prussienne annexes Hanovre, Hesse-Kassel, Nassau et Francfort (la loi du 20 septembre ; Schleswig-Holstein suit en 1867)."
  "Treaty of Vienna. After the war of 1866, in which Italy fought on Prussia’s side, Austria cedes Venetia and Mantua (through France) to Italy.": "Traité de Vienne. Après la guerre de 1866, dans laquelle l’Italie a combattu du côté Prusse, l’Autriche cedes Venetia et Mantua (par la France) vers l’Italie."
  "After the January Uprising, the Kingdom of Poland loses its separate administration and is governed as provinces of the Russian Empire (the \"Vistula Land\").": "Après l’Insurrection de janvier, le Royaume de Pologne perd son administration distincte et est gouverné comme provinces de l’Empire russe (la \"Terre des Vistules\")."
  "The Austro-Hungarian Compromise.": "Le compromis austro-hongrois."
  "The Austro-Hungarian Compromise. The Austrian Empire becomes the Dual Monarchy of Austria-Hungary: Hungary with Transylvania, Croatia–Slavonia and the Banat under a government in Budapest; Slovenia, Istria, Dalmatia and Bukovina under Vienna.": "Le compromis austro-hongrois. L’Empire autrichien devient la double monarchie d’Autriche-Hongrie : la Hongrie avec la Transylvanie, la Croatie-Slavonie et le Banat sous un gouvernement à Budapest ; la Slovénie, l’Istrie, la Dalmatie et la Bukovina sous Vienne."
  "The Austro-Hungarian Compromise. Bukovina stays in the Austrian half of the monarchy.": "Le compromis austro-hongrois. Bukovina reste dans la moitié autrichienne de la monarchie."
  "The Austro-Hungarian Compromise. The Austrian Empire becomes the Dual Monarchy of Austria-Hungary, with a Hungarian government in Budapest under the same monarch.": "Le compromis austro-hongrois. L’Empire autrichien devient la double monarchie d’Autriche-Hongrie, avec un gouvernement hongrois à Budapest sous le même monarque."
  "Italian troops entered Rome on 20 September after the French garrison left; Lazio is annexed after a plebiscite, and Rome becomes the capital. The pope withdraws into the Vatican.": "Les troupes italiennes sont entrées à Rome le 20 septembre, après la gauche de la garnison française ; le Latium est annexé après un plébiscite et Rome devient capitale. Le pape se retire au Vatican."
  "The German Empire is proclaimed.": "L’Empire allemand est proclamé."
  "The German Empire is proclaimed; Eupen and Malmedy are part of Prussia within it.": "L’Empire allemand est proclamé ; Eupen et Malmedy font partie de la Prusse en son sein."
  "The German Empire is proclaimed at Versailles; the German states, still with their own rulers, form one federal empire under the King of Prussia.": "L’Empire allemand est proclamé à Versailles ; les États allemands, toujours avec leurs propres dirigeants, forment un empire fédéral sous le roi de Prusse."
  "The German Empire is proclaimed; Prussia's Polish provinces become part of it.": "L’Empire allemand est proclamé ; les provinces polonaises de la Prusse en font partie."
  "Treaty of Frankfurt. France cedes Alsace and part of Lorraine to the German Empire.": "Traité de Francfort. France cède l’Alsace et une partie de la Lorraine à l’Empire allemand."
  "Cyprus Convention. The Ottomans hand the administration of Cyprus to Britain in return for an alliance against Russia; Britain annexes it in 1914.": "Convention de Chypre. Les Ottomans remettent l’administration de Chypre à la Grande-Bretagne en échange d’une alliance contre la Russie ; la Grande-Bretagne l’annexe en 1914."
  "Congress of Berlin. Romania, Serbia and Montenegro become independent and gain land; Romania takes northern Dobruja in exchange for southern Bessarabia. A smaller Bulgaria than the one agreed at San Stefano becomes an autonomous principality, Eastern Rumelia an autonomous Ottoman province. Austria-Hungary occupies Bosnia and Herzegovina.": "Congrès de Berlin. La Roumanie, la Serbie-et-Monténégro deviennent indépendantes et acquièrent des terres ; la Roumanie prend le nord de Dobruja en échange du sud de Bessarabia. Une Bulgarie plus petite que celle convenue à San Stefano devient une principauté autonome, la Rumelia orientale est une province ottomane autonome. L’Autriche-Hongrie occupe la Bosnie-Herzégovine."
  "Congress of Berlin. Romania, now independent, returns southern Bessarabia to Russia and receives Northern Dobruja instead.": "Congrès de Berlin. La Roumanie, aujourd'hui indépendante, retourne dans le sud de la Bessarabie en Russie et reçoit au lieu de Dobruja du Nord."
  "Congress of Berlin. The Ottomans cede Kars, Ardahan and Batumi to Russia.": "Congrès de Berlin. Les Ottomans cèdent Kars, Ardahan et Batumi à la Russie."
  "historical-basemaps world_1880 (automatic draft, partly hand-corrected)": "historical-basemaps world_1880 (ébauche automatique partiellement corrigée à la main)"
  "Under pressure from the Great Powers, the Ottomans hand Ulcinj to Montenegro in place of Plav and Gusinje.": "Sous la pression des grandes puissances, les Ottomans remettent Ulcinj au Monténégro à la place de Plav et Gusinje."
  "Convention of Constantinople. The Ottomans cede Thessaly and the district of Arta to Greece.": "Convention de Constantinople. Les Ottomans cèdent Thessalie et le district d’Arta à la Grèce."
  "A bloodless coup in Plovdiv unites Eastern Rumelia with Bulgaria; the union survives the Serbo-Bulgarian War that follows.": "Un coup d’État sans sang à Plovdiv unit Rumelia orientale à la Bulgarie ; l’union survit à la guerre serbo-bulgarienne qui suit."
  "Prince George of Greece arrives as high commissioner of the autonomous Cretan State; the last Ottoman troops left in November.": "Le prince George de Grèce arrive comme haut commissaire de l’État crétois autonome ; les dernières troupes ottomanes sont parties en novembre."
  "historical-basemaps world_1900 (automatic draft, partly hand-corrected)": "historical-basemaps world_1900 (ébauche automatique partiellement corrigée à la main)"
  "Sweden recognises the dissolution of the union. Norway is a fully independent kingdom (Haakon VII is elected in November).": "La Suède reconnaît la dissolution de l’union. La Norvège est un royaume entièrement indépendant (Haakon VII est élu en novembre)."
  "Treaty of Ouchy ends the Italo-Turkish War. Italy keeps the Dodecanese, occupied in May 1912, pending an Ottoman withdrawal from Libya that never fully happens.": "Le traité d’Ouchy met fin à la guerre italo-turque. L’Italie maintient le Dodécanèse, occupé en mai 1912, dans l’attente d’un retrait ottoman de la Libye qui ne se produit jamais pleinement."
  "Treaty of London. The Ottomans give up everything west of a line from Enos to Midia. The allies keep the land they occupied: Serbia most of Macedonia, Kosovo and the Sandžak; Greece southern Macedonia and Epirus; Montenegro the upper Lim valley and western Kosovo; Bulgaria eastern Macedonia, Thrace and the Rhodopes.": "Traité de Londres. Les Ottomans abandonnent tout à l’ouest d’une ligne allant d’Enos à Midia. Les alliés gardent les terres qu’ils occupent : la Serbie, la majeure partie de Macédoine, le Kosovo et le Sandžak ; la Grèce, la Macédoine méridionale et Epirus ; le Monténégro, la haute vallée du Lim et l’ouest du Kosovo ; la Bulgarie, la Macédoine orientale, la Thrace et les Rhodopes."
  "The Conference of Ambassadors in London recognises Albania as an independent principality; its southern border follows in December.": "La Conférence des ambassadeurs de Londres reconnaît l’Albanie comme une principauté indépendante ; sa frontière sud suit en décembre."
  "Treaty of Bucharest ends the Second Balkan War. Greece takes eastern Macedonia with Kavala, Romania southern Dobruja; Bulgaria keeps the Strumica valley and western Thrace.": "Le traité de Bucarest met fin à la Seconde Guerre des Balkans. La Grèce prend la Macédoine orientale avec Kavala, Roumanie au sud de Dobruja ; la Bulgarie garde la vallée de Strumica et la Thrace occidentale."
  "Treaty of Constantinople. Bulgaria returns Adrianople and eastern Thrace, retaken by the Ottomans in July.": "Traité de Constantinople. La Bulgarie retourne Adrianople et Thrace orientale, repris par les Ottomans en juillet."
  "Treaty of Athens between Greece and the Ottomans. The Great Powers award Greece the north-eastern Aegean islands occupied in 1912 (February 1914); the Ottomans accept it only at Lausanne in 1923.": "Traité d’Athènes entre la Grèce et les Ottomans. Les grandes puissances attribuent à la Grèce les îles du nord-est de la mer Égée occupées en 1912 (février 1914) ; les Ottomans ne l’acceptent qu’à Lausanne en 1923."
  "Crete is formally united with Greece.": "La Crète est formellement unie à la Grèce."
  "The Protocol of Florence gives Gjirokastër and Korçë to Albania; Greek troops leave in 1914.": "Le Protocole de Florence donne Gjirokastër et Korçë à l’Albanie ; les troupes grecques partent en 1914."
  "historical-basemaps world_1914 (automatic draft, partly hand-corrected)": "historical-basemaps world_1914 (ébauche automatique partiellement corrigée à la main)"
  "Russia's Provisional Government recognises Poland's right to independence. Congress Poland, occupied by Germany and Austria-Hungary since 1915, is ruled by the Kingdom of Poland they proclaimed in November 1916, a client state under a Regency Council from October 1917 (shown as Poland).": "Le gouvernement provisoire de la Russie reconnaît le droit à l’indépendance de la Pologne. Congrès La Pologne, occupée par l’Allemagne et l’Autriche-Hongrie depuis 1915, est gouvernée par le Royaume de Pologne qu’elle a proclamé en novembre 1916, un État client sous un Conseil Régence d’octobre 1917 (comme la Pologne)."
  "October Revolution. The left bank of the Dniester is claimed by Soviet Russia.": "Révolution d’octobre. La rive gauche du Dniestr est revendiquée par la Russie soviétique."
  "October Revolution. The northern Caucasus is fought over in the Russian Civil War (not shown); Transcaucasia stays outside Soviet rule.": "Révolution d’octobre. Le nord du Caucase est combattu pendant la guerre civile russe (non montré) ; Transcaucasie reste en dehors de la domination soviétique."
  "October Revolution. The Bolsheviks take power in Estonia and the unoccupied parts of Latvia and Belarus; German forces have held Lithuania, Courland, Grodno and Brest since 1915 and Riga since September 1917.": "Révolution d’octobre. Les bolcheviks prennent le pouvoir en Estonie et dans les parties inoccupées de la Lettonie et du Bélarus ; les forces allemandes détiennent la Lituanie, Courland, Grodno et Brest depuis 1915 et Riga depuis septembre 1917."
  "October Revolution. The Bolsheviks take power in Petrograd; the shifting fronts of the Russian Civil War are not shown.": "Révolution d’octobre. Les bolcheviks prennent le pouvoir à Petrograd ; les fronts en mouvement de la guerre civile russe ne sont pas montrés."
  "The Finnish parliament declares independence; Soviet Russia recognises it on 31 December.": "Le Parlement finlandais déclare son indépendance ; la Russie soviétique le reconnaît le 31 décembre."
  "The Ukrainian People's Republic declares independence, claiming the left bank of the Dniester.": "La République populaire d’Ukraine déclare son indépendance, revendiquant la rive gauche du Dniestr."
  "The Fourth Universal. The Ukrainian People's Republic declares independence.": "La quatrième universelle, la République populaire d’Ukraine déclare son indépendance."
  "Act of Independence of Lithuania, signed in German-occupied Vilnius.": "Acte d’indépendance de la Lituanie, signé en allemand Vilnius."
  "Estonia declares independence, a day before German troops take Tallinn. Its borders are settled by the Treaty of Tartu (1920).": "L’Estonie déclare son indépendance, un jour avant que les troupes allemandes ne prennent Tallinn. Ses frontières sont fixées par le traité de Tartu (1920)."
  "Treaty of Brest-Litovsk. Soviet Russia cedes Kars, Ardahan and Batumi to the Ottoman Empire, whose troops take them in April.": "Traité de Brest-Litovsk. La Russie soviétique cède Kars, Ardahan et Batumi à l’Empire ottoman, dont les troupes les prennent en avril."
  "Treaty of Brest-Litovsk. Soviet Russia gives up Poland, Lithuania, Courland and Riga, and Grodno and Brest; Livonia and Estonia, occupied in the German offensive of February, follow in August. These lands are under German military rule until November 1918. Eastern Belarus, also occupied, stays Russian by the treaty.": "Traité de Brest-Litovsk. La Russie soviétique abandonne la Pologne, la Lituanie, Courland et Riga, Grodno et Brest ; Livonie et l’Estonie, occupées dans l’offensive allemande de février, suivent en août. Ces terres sont sous le régime militaire allemand jusqu’en novembre 1918."
  "The Bessarabian assembly (Sfatul Țării), with Romanian troops in the country, votes for union with Romania.": "L’assemblée bessarabie (Sfatul ării), avec les troupes roumaines dans le pays, vote pour l’union avec la Roumanie."
  "The Transcaucasian Federation breaks up. Georgia declares independence.": "La Fédération Transcaucasienne se sépare. La Géorgie déclare son indépendance."
  "Armenia and Azerbaijan declare independence. Karabakh, Zangezur and Nakhchivan are disputed between them.": "L’Arménie et l’Azerbaïdjan déclarent leur indépendance. Le Karabakh, Zangezur et Nakhchivan sont contestés entre eux."
  "The Czechoslovak Republic is proclaimed in Prague; Slovak leaders join it two days later at Martin.": "La République tchécoslovaque est proclamée à Prague ; les dirigeants slovaques la rejoignent deux jours plus tard à Martin."
  "The National Committee in Prague proclaims the Czechoslovak state; its borders with Austria, Germany and Poland are fixed in 1919–1920.": "Le Comité national de Prague proclame l’État tchécoslovaque ; ses frontières avec l’Autriche, l’Allemagne et la Pologne sont fixées en 1919-1920."
  "Armistice of Mudros. Aqaba and Ma’an, taken by the Arab Revolt, are administered by the Kingdom of Hejaz.": "Armistice de Mudros. Aqaba et Maaan, prises par la Revont arabe, sont administrées par le Royaume de Hejaz."
  "The Aster Revolution in Budapest; Hungary leaves the union with Austria, and the Burgenland remains Hungarian until 1921.": "La révolution d’Aster à Budapest ; la Hongrie quitte l’union avec l’Autriche, et le Burgenland reste hongrois jusqu’en 1921."
  "Ukrainians take power in Lviv and proclaim the West Ukrainian People's Republic; the Polish–Ukrainian War follows.": "Les Ukrainiens prennent le pouvoir à Lviv et proclament la République populaire d’Ukraine de l’Ouest ; la guerre polonais-ukrainienne suit."
  "Armistice of Villa Giusti. Italian troops occupy the Slovene Littoral, Istria and the islands of Cres, Lošinj and Lastovo, within the line promised in the 1915 Treaty of London; the Treaty of Rapallo (12 November 1920) confirms them as Italian.": "Armistice de Villa Giusti. Les troupes italiennes occupent le Littoral slovène, l’Istrie et les îles de Cres, Lošinj et Lastovo, dans la ligne promise par le traité de Londres de 1915 ; le traité de Rapallo (12 novembre 1920) confirme qu’elles sont italiennes."
  "Armistice of Villa Giusti. Italy occupies South Tyrol and Trentino up to the Brenner, annexed under the Treaty of Saint-Germain (1919).": "Armistice de Villa Giusti. L’Italie occupe le Tyrol du Sud et le Trentin jusqu’au Brenner, annexé au Traité de Saint-Germain (1919)."
  "Armistice of Villa Giusti. Italian troops occupy Trieste and Gorizia; the Treaty of Rapallo of 1920 confirms them as Italian.": "Armistice de Villa Giusti. Les troupes italiennes occupent Trieste et Gorizia ; le Traité de Rapallo de 1920 les confirme comme Italiens."
  "Poland regains independence as Germany and Austria-Hungary collapse. Its borders are fought over until 1921.": "La Pologne retrouve son indépendance alors que l’Allemagne et l’Autriche-Hongrie s’effondrent."
  "The Republic of German-Austria is proclaimed (named Austria under the Treaty of Saint-Germain).": "La République d’Allemagne et d’Autriche est proclamée (appelée Autriche en vertu du Traité de Saint-Germain)."
  "The Hungarian People’s Republic is proclaimed; Austria-Hungary has dissolved.": "La République populaire hongroise est proclamée ; l’Autriche-Hongrie s’est dissoute."
  "Latvia proclaims independence. Its War of Independence lasts until 1920.": "La Lettonie proclame son indépendance. Sa guerre d’indépendance dure jusqu’en 1920."
  "French troops enter Strasbourg after the armistice; the Treaty of Versailles returns Alsace-Lorraine to France in 1919.": "Les troupes françaises entrent à Strasbourg après l’armistice ; le traité de Versailles retourne l’Alsace-Lorraine en France en 1919."
  "The Podgorica Assembly deposes King Nicholas and votes for union with Serbia.": "L’Assemblée de Podgorica pose le roi Nicholas et vote pour l’union avec la Serbie."
  "The General Congress of Bukovina in Czernowitz votes for union with Romania.": "Le Congrès général de Bukovina à Czernowitz vote pour l’union avec la Roumanie."
  "A congress in Czernowitz votes for the union of Bukovina with Romania.": "Un congrès à Czernowitz vote pour l’union de Bukovina avec la Roumanie."
  "Under the Armistice of Mudros the Ottoman army leaves Transcaucasia. British troops hold Batumi until July 1920, when it passes to Georgia; it is shown as Georgian from here.": "Sous l’armistice de Mudros, l’armée ottomane quitte la Transcaucasie. Les troupes britanniques tiennent Batoumi jusqu’en juillet 1920, quand il passe en Géorgie ; il est montré comme géorgien d’ici."
  "The Kingdom of Serbs, Croats and Slovenes is proclaimed in Belgrade, uniting Serbia and Montenegro with the South Slav lands of Austria-Hungary, Vojvodina among them. The same day an assembly at Alba Iulia votes for the union of Transylvania with Romania.": "Le Royaume des Serbes, des Croates et des Slovènes est proclamé à Belgrade, unissant la Serbie-et-Monténégro aux pays slaves du Sud de l’Autriche-Hongrie, Voïvodine parmi eux. Le même jour une assemblée à Alba Iulia vote pour l’union de Transylvanie avec la Roumanie."
  "The Danish–Icelandic Act of Union. Iceland becomes a sovereign kingdom in personal union with Denmark (a republic from 17 June 1944).": "L’Acte danois-icelandique de l’Union. L’Islande devient un royaume souverain en union personnelle avec le Danemark (une république à partir du 17 juin 1944)."
  "The Socialist Soviet Republic of Byelorussia is proclaimed as the Red Army moves west behind the withdrawing Germans.": "La République socialiste soviétique de Biélorussie est proclamée alors que l’Armée rouge se déplace à l’ouest derrière les Allemands qui se retirent."
  "Truce of Trier. The Greater Poland Uprising has won most of the Province of Posen for Poland.": "Trêve de Trèves. La Grande Pologne L’insurrection a remporté la plus grande partie de la province de Posen pour la Pologne."
  "After the Ottoman withdrawal, Armenia takes over Kars and Georgia takes Ardahan and Artvin, with British backing.": "Après le retrait ottoman, l’Arménie reprend Kars et la Géorgie prend Ardahan et Artvin, avec le soutien britannique."
  "Polish forces take Vilnius. By mid-1919 Poland holds western Belarus up to the line of the later Riga border; the front moves east and back again in 1920.": "Les forces polonaises prennent Vilnius. Vers le milieu de 1919, la Pologne tient la Biélorussie occidentale jusqu’à la ligne de la frontière plus tard à Riga ; le front se déplace vers l’est et de nouveau en 1920."
  "The Polish–Ukrainian War ends with all of Eastern Galicia under Polish control; Polish forces also hold western Volhynia.": "La guerre polonaise-ukrainienne se termine avec toute la Galice orientale sous contrôle polonais ; les forces polonaises détiennent également la Volhynie occidentale."
  "Treaty of Saint-Germain. Carpathian Ruthenia is assigned to Czechoslovakia.": "Traité de Saint-Germain. Ruthénie Carpatienne est assignée à la Tchécoslovaquie."
  "Treaty of Neuilly. Bulgaria cedes the Strumica valley to Yugoslavia and western Thrace to the Allies.": "Traité de Neuilly. Bulgarie cède la vallée de Strumica à la Yougoslavie et Thrace occidentale aux Alliés."
  "historical-basemaps world_1920 (automatic draft, partly hand-corrected)": "historical-basemaps world_1920 (ébauche automatique partiellement corrigée à la main)"
  "The Treaty of Versailles comes into force. The Saar is placed under the League of Nations for fifteen years, administered by France.": "Le traité de Versailles entre en vigueur. La Sarre est placée sous la tutelle de la Société des Nations pendant quinze ans, administrée par la France."
  "The Treaty of Versailles comes into force. Poland receives most of West Prussia (the \"Polish Corridor\"), Danzig becomes a free city under the League of Nations, and the Memel Territory is put under Allied administration.": "Le traité de Versailles entre en vigueur. La Pologne reçoit la plus grande partie de la Prusse occidentale (le « corridor polonais »), Danzig devient une ville libre sous la Société des Nations, et le territoire Memel est placé sous l’administration alliée."
  "Treaty of Tartu. Soviet Russia recognises Estonia, with Petseri (Pechory) and the land east of the Narva.": "Traité de Tartu. Russie soviétique reconnaît l’Estonie, avec Petseri (Pechory) et la terre à l’est de la Narva."
  "After Denikin's defeat the Red Army takes Kyiv (December 1919) and Odesa, and holds Ukraine east of the Polish lines; a Soviet Ukrainian republic governs it (shown with Soviet Russia). The Polish–Ukrainian offensive of spring 1920 is drawn in the Polish–Soviet War, and Wrangel's Crimea in the Russian Civil War.": "Après la défaite de Denikin, l’Armée rouge prend Kiev (décembre 1919) et Odesa, et détient l’Ukraine à l’est des lignes polonaises ; une république soviétique ukrainienne la gouverne (montrée avec la Russie soviétique). L’offensive polono-ukrainienne du printemps 1920 est tirée dans la guerre polonais-soviétique, et la Crimée de Wrangel dans la guerre civile russe."
  "The Red Army enters Baku, and Azerbaijan becomes a Soviet republic.": "L’armée rouge entre à Bakou, et l’Azerbaïdjan devient une république soviétique."
  "The Allies hand western Thrace to Greece, which confirms its rule in the Treaty of Sèvres.": "Les Alliés remettent la Thrace occidentale à la Grèce, ce qui confirme sa règle dans le traité de Sèvres."
  "Treaty of Trianon. Hungary loses two-thirds of its territory: the Banat, Crișana and Maramureș go to Romania, Međimurje and Prekmurje to Yugoslavia.": "Traité de Trianon. La Hongrie perd les deux tiers de son territoire : les Banat, Crișana et Maramureș se rendent en Roumanie, à Meшimurje et à Prekmurje en Yougoslavie."
  "After the plebiscites of February and March 1920, North Schleswig is handed to Denmark; the south votes to stay German.": "Après les plébiscites de février et mars 1920, le Schleswig du Nord est remis au Danemark ; le sud vote pour rester allemand."
  "A British civil administration replaces the military government in Palestine; the League of Nations confirms the mandate in 1922.": "Une administration civile britannique remplace le gouvernement militaire en Palestine ; la Société des Nations confirme le mandat en 1922."
  "French troops defeat the army of Faisal’s Arab Kingdom of Syria at Maysalun and take Damascus; Syria and Lebanon, with Alexandretta, come under the French mandate. The land east of the Jordan falls to the British mandate.": "Les troupes françaises battent l’armée du Royaume arabe de Syrie à Maysalun et prennent Damas ; la Syrie et le Liban, avec Alexandretta, relèvent du mandat français. La terre à l’est de la Jordanie tombe au mandat britannique."
  "The Conference of Ambassadors divides Teschen Silesia along the Olza. Czechoslovakia keeps the land west of the river with the Karviná coalfield and the Košice–Bohumín railway, which it had held since 1919; Poland gets the eastern part with Bielsko and Cieszyn's old town.": "La Conférence des ambassadeurs divise Teschen Silésie le long de l’Olza. La Tchécoslovaquie garde la terre à l’ouest du fleuve avec le champ de charbon Karviná et le chemin de fer Košice-Bohumín, qu’elle avait tenu depuis 1919 ; la Pologne obtient la partie orientale avec la vieille ville de Bielsko et Cieszyn."
  "Treaty of Riga. Soviet Russia recognises Latvia, with Abrene (Pytalovo).": "Traité de Riga. La Russie soviétique reconnaît la Lettonie, avec Abrene (Pytalovo)."
  "Under the Soviet–Lithuanian Peace Treaty, the retreating Red Army hands Vilnius to Lithuania.": "En vertu du Traité de paix soviet-lituanien, l’Armée rouge en retraite remet Vilnius à la Lituanie."
  "Eupen and Malmedy pass to Belgium under the Treaty of Versailles.": "Eupen et Malmedy passent à la Belgique en vertu du traité de Versailles."
  "After Żeligowski's staged mutiny, the Republic of Central Lithuania is proclaimed in Vilnius under Polish protection.": "Après la mutinerie mise en scène d’Eligowski, la République de Lituanie centrale est proclamée à Vilnius sous protection polonaise."
  "Treaty of Tartu. Soviet Russia recognises Finland's border and cedes Petsamo, giving Finland a port on the Arctic Ocean.": "Traité de Tartu. La Russie soviétique reconnaît la frontière finlandaise et cède Petsamo, donnant à la Finlande un port sur l’océan Arctique."
  "Turkish nationalist forces take Kars in the Turkish–Armenian War.": "Les forces nationalistes turques prennent Kars dans la guerre turco-arménienne."
  "Armenia becomes a Soviet republic, and the Treaty of Alexandropol leaves Kars to Turkey.": "L’Arménie devient une république soviétique, et le traité d’Alexandropol quitte Kars pour la Turquie."
  "Treaty of Moscow between Soviet Russia and the Turkish nationalists. Turkey keeps Kars, Ardahan and Artvin; Batumi stays with Georgia (confirmed at Kars in October).": "Traité de Moscou entre la Russie soviétique et les nationalistes turcs. La Turquie garde Kars, Ardahan et Artvin ; Batumi reste avec la Géorgie (confirmé à Kars en octobre)."
  "Peace of Riga. The left bank of the Dniester stays in Soviet Ukraine (the Moldavian ASSR from 1924).": "Paix de Riga. La rive gauche du Dniestr reste en Ukraine soviétique (l’ASSR moldave de 1924)."
  "The Red Army takes Tbilisi (25 February) and Batumi; Georgia becomes a Soviet republic.": "L’Armée Rouge prend Tbilissi (25 février) et Batumi ; la Géorgie devient une république soviétique."
  "Peace of Riga. Poland, Soviet Russia and Soviet Ukraine fix a border that leaves western Belarus and western Volhynia in Poland. Soviet Ukraine and Belarus join the USSR in 1922.": "La paix de Riga. Pologne, Russie soviétique et Ukraine soviétique fixent une frontière qui quitte la Biélorussie occidentale et la Volhynie occidentale en Pologne. L’Ukraine soviétique et la Biélorussie rejoignent l’URSS en 1922."
  "Peace of Riga. Soviet Ukraine, which holds the rest of Ukraine, joins the USSR in December 1922.": "Paix de Riga. Ukraine soviétique, qui détient le reste de l’Ukraine, rejoint l’URSS en décembre 1922."
  "Abdullah, son of the sharif of Mecca, becomes emir of Transjordan under the British mandate.": "Abdullah, fils du sharif de la Mecque, devient émir de Transjordan sous le mandat britannique."
  "Austrian troops take over the Burgenland, awarded to Austria at Saint-Germain and Trianon (Sopron stays Hungarian after a plebiscite in December).": "Les troupes autrichiennes reprennent le Burgenland, décerné à l’Autriche à Saint-Germain et Trianon (Sopron reste hongrois après un plébiscite en décembre)."
  "Central Lithuania is incorporated into Poland. Lithuania does not recognise the loss of Vilnius until 1938.": "La Lituanie centrale est intégrée en Pologne. La Lituanie ne reconnaît la perte de Vilnius qu’en 1938."
  "After the plebiscite and the Silesian Uprisings, Polish troops enter the eastern part of Upper Silesia awarded to Poland.": "Après le plébiscite et les soulèvements silésiens, les troupes polonaises entrent dans la partie orientale de la Haute Silésie décernée à la Pologne."
  "The Grand National Assembly in Ankara abolishes the sultanate; its government, which has won the war against Greece, takes over from the Ottoman state. Allied troops leave Istanbul in October 1923, after the Treaty of Lausanne; the Republic is proclaimed on 29 October 1923.": "La Grande Assemblée nationale d’Ankara abolit le sultanat ; son gouvernement, qui a remporté la guerre contre la Grèce, prend le relais de l’État ottoman. Les troupes alliées quittent Istanbul en octobre 1923, après le traité de Lausanne ; la République est proclamée le 29 octobre 1923."
  "The Irish Free State is founded under the Anglo-Irish Treaty; Northern Ireland opts out the next day and stays in the United Kingdom.": "L’État libre d’Irlande est fondé en vertu du traité anglo-irlandais ; l’Irlande du Nord opte le lendemain et reste au Royaume-Uni."
  "After the Klaipėda Revolt, the Allied Conference of Ambassadors transfers the Memel Territory to Lithuania.": "Après la révolte de Klaipėda, la Conférence alliée des ambassadeurs transfère le territoire de Memel en Lituanie."
  "After the Saudi conquest of the Hejaz, Britain attaches Aqaba and Ma’an to Transjordan.": "Après la conquête saoudienne du Hejaz, la Grande-Bretagne attache Aqaba et Maaan à la Transjordanie."
  "The Svalbard Treaty (1920) comes into force, and the archipelago becomes part of Norway.": "Le Traité Svalbard (1920) entre en vigueur et l’archipel fait partie de la Norvège."
  "Norway annexes Jan Mayen (counted with Nordland in today's regions).": "Norvège annexes Jan Mayen (comptée avec Nordland dans les régions d’aujourd'hui)."
  "historical-basemaps world_1930 (automatic draft, partly hand-corrected)": "historical-basemaps world_1930 (ébauche automatique partiellement corrigée à la main)"
  "After a plebiscite the Saar returns to Germany.": "Après un plébiscite, la Sarre revient en Allemagne."
  "historical-basemaps world_1938 (automatic draft, partly hand-corrected)": "historical-basemaps world_1938 (ébauche automatique partiellement corrigée à la main)"
  "The Anschluss. German troops enter Austria, which is annexed to Germany.": "Les troupes allemandes entrent en Autriche, qui est annexée à l’Allemagne."
  "Munich Agreement. Czechoslovakia cedes the Sudetenland to Germany (occupied 1–10 October).": "Accord de Munich. La Tchécoslovaquie cède la Sudetenland à l’Allemagne (occupée du 1er au 10 octobre)."
  "Poland occupies Zaolzie, the Czechoslovak part of Teschen.": "La Pologne occupe Zaolzie, la partie tchécoslovaque de Teschen."
  "First Vienna Award. Germany and Italy give southern Slovakia, with Košice, to Hungary.": "Premier prix de Vienne. L’Allemagne et l’Italie donnent le sud de la Slovaquie, avec Košice, à la Hongrie."
  "Slovakia declares independence under German protection; Germany occupies Bohemia and Moravia the next day.": "La Slovaquie déclare son indépendance sous protection allemande ; l’Allemagne occupe la Bohême et la Moravie le lendemain."
  "Carpatho-Ukraine declares independence; Hungary occupies it the same day.": "Carpatho-Ukraine déclare son indépendance ; la Hongrie l’occupe le même jour."
  "German troops occupy what remains of Bohemia and Moravia, which Hitler declares a protectorate of the Reich.": "Les troupes allemandes occupent ce qui reste de la Bohême et de la Moravie, que Hitler déclare protectorat du Reich."
  "Under a German ultimatum, Lithuania cedes the Memel Territory to Germany.": "Sous un ultimatum allemand, la Lituanie cède le territoire de Memel à l’Allemagne."
  "France cedes the Sanjak of Alexandretta, briefly the Hatay State, to Turkey.": "La France cède le Sanjak d’Alexandretta, brièvement l’État de Hatay, à la Turquie."
  "On the first day of its invasion of Poland, Germany annexes the Free City of Danzig.": "Dès le premier jour de son invasion de la Pologne, l’Allemagne annexe la Ville libre de Dantzig."
  "German–Soviet Boundary and Friendship Treaty. Germany annexes western Poland, with Zaolzie (formally from 26 October), and sets up the General Government in the centre; the Soviet Union annexes the east.": "Traité germano-soviétique de délimitation et d’amitié. L’Allemagne annexe l’ouest de la Pologne, avec la Zaolzie (formellement à partir du 26 octobre), et crée le Gouvernement général au centre ; l’Union soviétique annexe l’est."
  "Soviet–Lithuanian Mutual Assistance Treaty. Lithuania receives Vilnius and part of its region and accepts Soviet bases.": "Traité d’entraide soviétique-lituanienne. La Lituanie reçoit Vilnius et une partie de sa région et accepte les bases soviétiques."
  "Moscow Peace Treaty. After the Winter War Finland cedes the Karelian Isthmus with Vyborg, Ladoga Karelia, part of Salla and Kuusamo, and islands in the Gulf of Finland, and leases Hanko to the Soviet Union.": "Traité de paix de Moscou. Après la guerre d’hiver, la Finlande cède l’isthme karélien à Vyborg, Ladoga Karelia, une partie de Salla et Kuusamo, et des îles dans le golfe de Finlande, et loue Hanko à l’Union soviétique."
  "Germany annexes Eupen, Malmedy and Sankt Vith, which Belgium had received at Versailles.": "Allemagne annexes Eupen, Malmedy et Sankt Vith, que la Belgique avait reçu à Versailles."
  "Under a Soviet ultimatum Romania cedes Bessarabia and Northern Bukovina, with the Hertsa region, to the Soviet Union.": "Sous un ultimatum soviétique, la Roumanie cède Bessarabia et la Bukovina du Nord, avec la région Hertsa, à l’Union soviétique."
  "After the armistice Germany puts Alsace and Moselle under Gauleiters of the neighbouring German provinces: a de facto annexation that France never recognised.": "Après l’armistice, l’Allemagne place l’Alsace et la Moselle sous les Gauleiters des provinces allemandes voisines : une annexion de facto que la France n’a jamais reconnue."
  "Lithuania, occupied by the Red Army in June, is annexed by the Soviet Union.": "La Lituanie, occupée par l’Armée rouge en juin, est annexée par l’Union soviétique."
  "Latvia is annexed by the Soviet Union.": "La Lettonie est annexée par l’Union soviétique."
  "Estonia is annexed by the Soviet Union.": "L’Estonie est annexée par l’Union soviétique."
  "Second Vienna Award. Germany and Italy give northern Transylvania to Hungary.": "Deuxième prix de Vienne. L’Allemagne et l’Italie donnent la Transylvanie du Nord à la Hongrie."
  "Treaty of Craiova. Romania returns southern Dobruja to Bulgaria.": "Traité de Craiova. La Roumanie retourne le sud de Dobruja en Bulgarie."
  "Yugoslavia capitulates and is partitioned. The Independent State of Croatia (proclaimed 10 April) takes Croatia, Bosnia–Herzegovina and Syrmia; Germany annexes northern Slovenia de facto; Italy takes Ljubljana (annexed 3 May); Hungary takes Bačka, Baranja, Međimurje and Prekmurje (annexed in December); Bulgaria takes most of Macedonia and Pirot; Kosovo, western Macedonia and the Montenegrin borderlands go to Italian-ruled Albania; Serbia and Montenegro are put under German and Italian military rule.": "La Yougoslavie capitule et est divisée. L’État indépendant de Croatie (proclamé le 10 avril) prend la Croatie, la Bosnie-Herzégovine et la Syrmie ; l’Allemagne fait des annexes au nord de la Slovénie de facto ; l’Italie prend Ljubljana (annexe du 3 mai) ; la Hongrie prend Bačka, Baranja, Meшimurje et Prekmurje (annexée en décembre) ; la Bulgarie prend la majeure partie de la Macédoine et Pirot ; le Kosovo, La Macédoine occidentale et les régions frontalières du Monténégro se rendent en Albanie gouvernée par l’Italie ; la Serbie-et-Monténégro est placée sous le régime militaire allemand et italien."
  "Bulgaria annexes eastern Macedonia and western Thrace, which its army had occupied from 20 April (Evros stays under German control).": "La Bulgarie annexe l’est de la Macédoine et l’ouest de Thrace, que son armée avait occupée à partir du 20 avril (Evros reste sous contrôle allemand)."
  "Treaties of Rome. The Independent State of Croatia cedes to Italy most of the Dalmatian coast and islands (the Governorate of Dalmatia, with Zadar, Šibenik, Split, Korčula and the Bay of Kotor), and Krk and Rab, joined to the province of Fiume.": "Traités de Rome. L’État indépendant de Croatie cède à l’Italie la plupart des côtes et îles dalmates (le gouvernorat de Dalmatie, avec Zadar, Šibenik, Split, Korčula et la baie de Kotor), et Krk et Rab, rejoint la province de Fiume."
  "Romania, at war with the Soviet Union beside Germany, retakes Bessarabia and Northern Bukovina.": "La Roumanie, en guerre avec l’Union soviétique à côté de l’Allemagne, reprend Bessarabia et le nord de la Bukovina."
  "Six weeks after the invasion of 22 June, German forces hold Lithuania, Latvia, southern Estonia, most of Belarus, western Ukraine, Pskov and Smolensk.": "Six semaines après l’invasion du 22 juin, les forces allemandes détiennent la Lituanie, la Lettonie, le sud de l’Estonie, la majeure partie de la Biélorussie, l’ouest de l’Ukraine, Pskov et Smolensk."
  "After the German invasion of the Soviet Union, Eastern Galicia is added to the General Government and the Białystok district is put under East Prussian administration. The occupation further east is in ww2-east.yaml.": "Après l’invasion allemande de l’Union soviétique, la Galice orientale est ajoutée au gouvernement général et le district de Białystok est placé sous administration prussienne orientale. L’occupation plus à l’est est dans ww2-east.yaml."
  "In the Continuation War Finnish forces retake Ladoga Karelia and, on 29 August, Vyborg; the ceded land is annexed again in December 1941. East Karelia, beyond the old border, is occupied (shown in the war's steps).": "Dans la guerre continue, les forces finlandaises reprennent Ladoga Karelia et, le 29 août, Vyborg ; la terre cédée est annexée à nouveau en décembre 1941. L’est Karelia, au-delà de l’ancienne frontière, est occupée (montrée dans les pas de la guerre)."
  "The furthest German advance before the Soviet counter-offensive at Moscow. Estonia, eastern Belarus, most of Ukraine and the Crimea except Sevastopol are occupied; Leningrad is besieged. Romania administers the land between the Dniester and the Southern Bug as “Transnistria”.": "L’Estonie, la Biélorussie orientale, la plus grande partie de l’Ukraine et la Crimée sauf Sébastopol sont occupées ; Leningrad est assiégé. La Roumanie administre les terres entre le Dniestr et le Bug du Sud sous le nom de \"Transnistrie\"."
  "Germany annexes Luxembourg, under civil administration since 1940, and introduces conscription; a general strike follows.": "Allemagne annexes Luxembourg, sous administration civile depuis 1940, et introduit la conscription ; une grève générale suit."
  "The eve of the Soviet counter-offensive at Stalingrad. After the summer offensive Germany holds the Donbas, the lower Don, the Kuban and the northern Caucasus foothills; Sevastopol fell in July. Kaluga was retaken in the winter.": "La veille de la contre-offensive soviétique à Stalingrad. Après l’offensive d’été l’Allemagne tient les Donbas, le Don inférieur, le Kuban et les contreforts du nord du Caucase ; Sébastopol est tombé en Juillet. Kaluga a été repris en hiver."
  "After the Italian armistice the Independent State of Croatia annexes the Italian part of Dalmatia except Zadar, and German troops take over the Bay of Kotor with Montenegro. Ljubljana, Fiume, Krk and Rab come under German rule as part of the Adriatic Littoral zone (shown here as Italian territory under occupation).": "Après l’armistice italien, l’État indépendant de Croatie annexe la partie italienne de la Dalmatie sauf Zadar, et les troupes allemandes prennent le contrôle de la baie de Kotor avec le Monténégro. Ljubljana, Fiume, Krk et Rab sont sous la domination allemande dans la zone adriatique Littoral (représenté ici comme territoire italien sous occupation)."
  "France releases the Lebanese government, which it had arrested; Lebanon is independent.": "La France libère le gouvernement libanais, qu’elle avait arrêté ; le Liban est indépendant."
  "After Stalingrad, Kursk and the battles for the Dnieper, the Red Army has retaken the northern Caucasus, eastern Ukraine with Kyiv, and Smolensk.": "Après Stalingrad, Kursk et les batailles pour le Dniepr, l’Armée Rouge a repris le nord du Caucase, l’est de l’Ukraine avec Kiev, et Smolensk."
  "The Red Army retakes Chernivtsi and Northern Bukovina.": "L’Armée Rouge reprend Chernivtsi et Bukovina du Nord."
  "The Red Army retakes Odesa (10 April) and the land east of the Dniester.": "L’Armée rouge reprend Odesa (10 avril) et la terre à l’est du Dniestr."
  "The Red Army takes Vyborg in its summer offensive.": "L’Armée Rouge prend Vyborg dans son offensive d’été."
  "The Red Army takes Lviv and Białystok. A Soviet agreement with the Polish Committee of National Liberation (Lublin) sets the new border close to the Curzon Line.": "L’armée rouge prend Lviv et Białystok. Un accord soviétique avec le Comité polonais de libération nationale (Lublin) fixe la nouvelle frontière près de la ligne Curzon."
  "The Jassy–Kishinev offensive. The Red Army retakes Bessarabia, and Romania changes sides the next day.": "L’offensive Jassy-Kishinev. L’Armée Rouge reprend Bessarabia, et la Roumanie change de camp le lendemain."
  "After the spring offensives in Ukraine and the Crimea and Operation Bagration in Belarus, the Red Army stands in eastern Poland and the Baltic states.": "Après les offensives de printemps en Ukraine et en Crimée et l’opération Bagration en Biélorussie, l’Armée rouge se trouve dans l’est de la Pologne et les États baltes."
  "American troops liberate Luxembourg City; most of the country is free by mid-September.": "Les troupes américaines libèrent la ville de Luxembourg ; la majeure partie du pays est libre à la mi-septembre."
  "American troops reach Eupen and Malmedy, which return to Belgium.": "Les troupes américaines atteignent Eupen et Malmedy, qui reviennent en Belgique."
  "Moscow Armistice. Finland returns to the 1940 border, cedes Petsamo and leases Porkkala to the Soviet Union (until 1956); the Paris peace treaty confirms this in 1947.": "L’armistice de Moscou. La Finlande retourne à la frontière de 1940, cède Petsamo et loue Porkkala à l’Union soviétique (jusqu’en 1956) ; le traité de paix de Paris le confirme en 1947."
  "The Partisans liberate Dubrovnik and the southern Dalmatian islands.": "Les Partisans libèrent Dubrovnik et les îles de Dalmatie méridionale."
  "The Red Army and the Partisans liberate Belgrade; the German occupation of Serbia ends, and the Bulgarian-annexed Pirot and Vranje return to Yugoslavia.": "L’Armée rouge et les Partisans libèrent Belgrade ; l’occupation allemande de la Serbie prend fin, et le Pirot et Vranje annexés à la Bulgarie retournent en Yougoslavie."
  "Novi Sad is liberated; Bačka returns to Yugoslavia.": "Novi Sad est libéré ; Bačka retourne en Yougoslavie."
  "The Bulgarian army completes its withdrawal from eastern Macedonia and western Thrace, under the terms of the armistice with the Allies.": "L’armée bulgare complète son retrait de la Macédoine orientale et de la Thrace occidentale, aux termes de l’armistice avec les Alliés."
  "The Partisans liberate Split and central Dalmatia.": "Les Partisans libèrent Split et la Dalmatie centrale."
  "The last Italian authorities leave Zadar, which the Partisans enter.": "Les dernières autorités italiennes quittent Zadar, où entrent les Partisans."
  "The Partisans liberate Šibenik.": "Les Partisans libèrent Šibenik."
  "Skopje is liberated; the Bulgarian annexation of Macedonia ends.": "Skopje est libéré ; l’annexion bulgare de la Macédoine prend fin."
  "The Partisans take Pristina; Kosovo and western Macedonia are separated from Albania again.": "Les Partisans prennent Pristina ; le Kosovo et la Macédoine occidentale sont à nouveau séparés de l’Albanie."
  "American troops take Metz; Moselle returns to France.": "Les troupes américaines prennent Metz ; Moselle revient en France."
  "French troops liberate Strasbourg.": "Les troupes françaises libèrent Strasbourg."
  "The Battle of Batina opens Baranja to the Red Army and the Partisans.": "La bataille de Batina ouvre Baranja à l’Armée Rouge et aux Partisans."
  "The Partisans take Knin; northern Dalmatia is free.": "Les Partisans prennent Knin ; la Dalmatie du Nord est libre."
  "The last German troops leave Montenegro; the Partisans enter Podgorica.": "Les dernières troupes allemandes quittent le Monténégro ; les Partisans entrent dans Podgorica."
  "Estonia, most of Latvia with Riga (13 October) and western Lithuania are retaken. German forces hold out in the Courland pocket until May 1945.": "L’Estonie, la plupart de la Lettonie avec Riga (13 octobre) et l’ouest de la Lituanie sont repris. Les forces allemandes tiennent dans la poche de Courland jusqu’en mai 1945."
  "The Vistula–Oder Offensive. Soviet and Polish troops take Warsaw (17 January), Kraków and Łódź (19 January).": "Les troupes soviétiques et polonaises prennent Varsovie (17 janvier), Cracovie et Łóda (19 janvier)."
  "The Colmar Pocket is cleared; Alsace is wholly French again.": "La poche de Colmar est nettoyée ; l’Alsace est entièrement française à nouveau."
  "The Partisans take Mostar; Herzegovina is free.": "Les Partisans prennent Mostar ; l’Herzégovine est libre."
  "With the Groza government in office, Romanian administration returns to northern Transylvania; the Paris peace treaty (1947) confirms the 1920 border.": "Avec le gouvernement Groza en fonction, l’administration roumaine retourne dans le nord de la Transylvanie ; le traité de paix de Paris (1947) confirme la frontière de 1920."
  "The Red Army drives the Hungarians out of Prekmurje and Međimurje.": "L’Armée Rouge chasse les Hongrois de Prekmurje et Meшimurje."
  "Soviet and Romanian troops take Bratislava; Slovakia, with the land Hungary took in 1938, returns to Czechoslovakia.": "Les troupes soviétiques et roumaines prennent Bratislava ; la Slovaquie, avec le pays que la Hongrie a pris en 1938, revient en Tchécoslovaquie."
  "The Partisans liberate Sarajevo.": "Les Partisans libèrent Sarajevo."
  "The Yugoslav Army breaks through the Syrmian Front.": "L’armée yougoslave traverse le Front syrmien."
  "Osijek is liberated; Slavonia is free.": "Osijek est libéré ; la Slavonie est libre."
  "The Partisans take Banja Luka; northern and western Bosnia are free.": "Les Partisans prennent Banja Luka ; le nord et l’ouest de la Bosnie sont libres."
  "Karl Renner’s provisional government in Vienna declares Austria independent again (occupied by the four powers until 1955).": "Le gouvernement provisoire de Karl Renner à Vienne déclare de nouveau l’Autriche indépendante (occupée par les quatre pouvoirs jusqu’en 1955)."
  "The Partisans enter Zagreb; the Independent State of Croatia collapses (its last troops surrender at Bleiburg and Poljana on 15 May).": "Les Partisans entrent à Zagreb ; l’État indépendant de Croatie s’effondre (les dernières troupes se rendent à Bleiburg et Poljana le 15 mai)."
  "Prague is liberated and Czechoslovakia is restored within its borders before Munich.": "Prague est libérée et la Tchécoslovaquie est restaurée à l’intérieur de ses frontières avant Munich."
  "The Courland pocket surrenders after Germany's capitulation.": "La poche de Courland se rend après la capitulation allemande."
  "The Partisans liberate Ljubljana; German-annexed and Italian-annexed Slovenia return to Yugoslavia. Yugoslav forces also hold Trieste and Istria until June (shown in the war files).": "Les Partisans libèrent Ljubljana ; la Slovénie, annexée à l’Allemagne et à l’Italie, retourne en Yougoslavie. Les forces yougoslaves détiennent également Trieste et Istrie jusqu’en juin (indiquées dans les dossiers de guerre)."
  "Berlin Declaration. The four powers assume supreme authority in Germany, divided into American, British, French and Soviet zones; Berlin is under joint four-power rule. Germany east of the Oder and Neisse comes under Polish and Soviet administration.": "Déclaration de Berlin. Les quatre puissances assument l’autorité suprême en Allemagne, divisée en zones américaines, britanniques, françaises et soviétiques ; Berlin est sous la domination conjointe des quatre puissances. L’Allemagne à l’est de l’Oder et Neisse relève de l’administration polonaise et soviétique."
  "The Red Army takes Carpathian Ruthenia (Uzhhorod falls on 27 October). A Czechoslovak government delegation takes office in Khust, but Soviet-backed committees soon push it aside and in November call for union with Soviet Ukraine.": "L’Armée rouge prend la Ruthénie subcarpatique (Oujhorod tombe le 27 octobre). Une délégation du gouvernement tchécoslovaque s’installe à Khoust, mais des comités soutenus par les Soviétiques l’écartent bientôt et réclament en novembre l’union avec l’Ukraine soviétique."
  "Czechoslovakia cedes Carpathian Ruthenia to the Soviet Union, which had occupied it in October 1944.": "La Tchécoslovaquie cède la Ruthénie carpatienne à l’Union soviétique, qui l’avait occupée en octobre 1944."
  "historical-basemaps world_1945 (automatic draft, needs checking)": "historic-basemaps world_1945 (ébauche automatique, vérification des besoins)"
  "The Red Army takes Memel (Klaipėda) after a three-month siege; the Memel Territory returns to Soviet Lithuania.": "L’Armée rouge prend Memel (Klaipėda) après un siège de trois mois ; le territoire de Memel revient à la Lituanie soviétique."
  "The Vistula–Oder Offensive halts on the Oder. Behind it the rest of the pre-war Polish west is free, Bydgoszcz (24 January), Katowice (27 January), Toruń (1 February) and Greater Poland, though Poznań holds out until 23 February and Grudziądz until 6 March.": "L’offensive Vistule-Oder s’arrête sur l’Oder. Derrière elle, le reste de l’ouest de la Pologne d’avant-guerre est libéré : Bydgoszcz (24 janvier), Katowice (27 janvier), Toruń (1er février) et la Grande-Pologne, bien que Poznań tienne jusqu’au 23 février et Grudziądz jusqu’au 6 mars."
  "Soviet and Polish troops take Gdynia (28 March) and Danzig (30 March). Polish Pomerania is free, and Danzig comes under Polish administration as Gdańsk.": "Les troupes soviétiques et polonaises prennent Gdynia (28 mars) et Dantzig (30 mars). La Poméranie polonaise est libérée et Dantzig passe sous administration polonaise sous le nom de Gdańsk."
  "Germany surrenders. The German lands east of the Oder and Neisse, where Poland had set up administrative districts from March, are under Polish administration (Stettin is handed over on 5 July), and northern East Prussia with Königsberg (taken 9 April) is under Soviet rule.": "L’Allemagne capitule. Les terres allemandes à l’est de l’Oder et de la Neisse, où la Pologne a créé des districts administratifs dès mars, passent sous administration polonaise (Stettin lui est remise le 5 juillet), et le nord de la Prusse-Orientale avec Königsberg (prise le 9 avril) sous domination soviétique."
  "Potsdam Agreement. The Allies confirm Polish administration east of the Oder and Neisse and Soviet rule in northern East Prussia, pending a peace settlement. Most Germans there are expelled.": "Accords de Potsdam. Les Alliés confirment l’administration polonaise à l’est de l’Oder et de la Neisse et la domination soviétique dans le nord de la Prusse-Orientale, en attendant un traité de paix. La plupart des Allemands qui y vivent sont expulsés."
  "The last French troops leave Syria.": "Les dernières troupes françaises quittent la Syrie."
  "Britain hands the Dodecanese, which Italy ceded under the Paris peace treaty, to Greece.": "La Grande-Bretagne remet le Dodécanèse, que l’Italie a cédé en vertu du traité de paix de Paris, à la Grèce."
  "The Paris peace treaty comes into force. Italy cedes Istria, most of the Slovene Littoral, Cres, Lošinj and Lastovo to Yugoslavia; Koper, Izola and Piran become Zone B of the Free Territory of Trieste, under Yugoslav military administration.": "Le traité de paix de Paris entre en vigueur. L’Italie cède l’Istrie, la plupart du Littoral slovène, Cres, Lošinj et Lastovo en Yougoslavie ; Koper, Izola et Piran deviennent la zone B du territoire libre de Trieste, sous administration militaire yougoslave."
  "The Paris peace treaty comes into force. Trieste becomes the Free Territory of Trieste, under Anglo-American (Zone A) and Yugoslav (Zone B) military administration.": "Le traité de paix de Paris entre en vigueur. Trieste devient le territoire libre de Trieste, sous administration militaire anglo-américaine (Zone A) et yougoslave (Zone B)."
  "The Saar, detached from the French zone, becomes a French protectorate with its own constitution.": "La Sarre, détachée de la zone française, devient un protectorat français avec sa propre constitution."
  "The British mandate ends and Israel declares independence; Arab armies invade. By the 1949 armistice lines Israel holds most of the former mandate, Jordan the West Bank (annexed in 1950) and Egypt the Gaza Strip.": "Le mandat britannique prend fin et Israël déclare son indépendance ; les armées arabes envahissent. Par les lignes d’armistice de 1949, Israël détient la plus grande partie de l’ancien mandat, la Jordanie en Cisjordanie (annexée en 1950) et l’Égypte dans la bande de Gaza."
  "The Basic Law. The Federal Republic of Germany is founded in the three western zones.": "La Loi fondamentale. La République fédérale d’Allemagne est fondée dans les trois zones occidentales."
  "The German Democratic Republic is founded in the Soviet zone.": "La République démocratique allemande est fondée dans la zone soviétique."
  "London Memorandum. Zone B of the Free Territory passes to Yugoslavia, Zone A with Trieste to Italy.": "Mémorandum de Londres. La zone B du territoire libre passe à la Yougoslavie, zone A avec Trieste à l’Italie."
  "London Memorandum. Zone A of the Free Territory, with Trieste, passes to Italy.": "Note de Londres. Zone A du Territoire Libre, avec Trieste, passe à l’Italie."
  "Agreement on the zones of occupation in Austria. The Soviet Union holds Lower Austria, Burgenland and Upper Austria north of the Danube; the United States Upper Austria south of the Danube and Salzburg; Britain Styria, Carinthia and East Tyrol; France North Tyrol and Vorarlberg. Vienna is under joint four-power rule, with a sector for each power and an international centre. Unlike Germany, Austria keeps its own government, recognised by all four powers in October.": "Accord sur les zones d’occupation en Autriche. L’Union soviétique tient la Basse-Autriche, le Burgenland et la Haute-Autriche au nord du Danube ; les États-Unis la Haute-Autriche au sud du Danube et Salzbourg ; la Grande-Bretagne la Styrie, la Carinthie et le Tyrol oriental ; la France le Tyrol du Nord et le Vorarlberg. Vienne est sous administration commune des quatre puissances, avec un secteur pour chacune et un centre international. Contrairement à l’Allemagne, l’Autriche garde son propre gouvernement, reconnu par les quatre puissances en octobre."
  "The Austrian State Treaty, signed in Vienna on 15 May, comes into force. The Allied Council is dissolved and the occupation ends; the last foreign troops leave by 25 October, and the next day Austria declares its permanent neutrality.": "Le traité d’État autrichien, signé à Vienne le 15 mai, entre en vigueur. Le Conseil allié est dissous et l’occupation prend fin ; les dernières troupes étrangères partent avant le 25 octobre, et le lendemain l’Autriche proclame sa neutralité permanente."
  "After a referendum the Saar joins the Federal Republic.": "Après un référendum, la Sarre rejoint la République fédérale."
  "Egypt and Syria unite as the United Arab Republic.": "L’Égypte et la Syrie s’unissent comme République arabe unie."
  "historical-basemaps world_1960 (automatic draft, needs checking)": "historic-basemaps world_1960 (ébauche automatique, contrôle des besoins)"
  "Cyprus becomes independent of Britain, which keeps two sovereign base areas.": "Chypre devient indépendante de la Grande-Bretagne, qui conserve deux zones de base souveraines."
  "A military coup in Damascus takes Syria out of the United Arab Republic.": "Un coup d’État militaire à Damas fait sortir la Syrie de la République arabe unie."
  "Malta becomes independent of Britain.": "Malte devient indépendante de la Grande-Bretagne."
  "After Jordan gives up its claim to the West Bank (31 July), the Palestine National Council declares the State of Palestine in the territories occupied by Israel since 1967.": "Après que la Jordanie a renoncé à sa réclamation en Cisjordanie (31 juillet), le Conseil national palestinien déclare l’État de Palestine dans les territoires occupés par Israël depuis 1967."
  "German reunification. The GDR’s states and Berlin join the Federal Republic.": "La réunification allemande. Les Etats de la RDA et Berlin rejoignent la République fédérale."
  "Georgia declares the restoration of its independence.": "La Géorgie déclare le rétablissement de son indépendance."
  "Slovenia and Croatia declare independence from Yugoslavia.": "La Slovénie et la Croatie déclarent leur indépendance de la Yougoslavie."
  "Ukraine declares independence (confirmed by referendum on 1 December).": "L’Ukraine déclare son indépendance (confirmée par référendum le 1er décembre)."
  "Belarus declares independence.": "Le Bélarus déclare son indépendance."
  "Moldova declares independence. Transnistria, which had declared itself a separate republic in 1990, is not under its control.": "La Transnistrie, qui s’était déclarée une république distincte en 1990, n’est pas sous son contrôle."
  "The Soviet Union recognises the independence of Estonia, Latvia and Lithuania.": "L’Union soviétique reconnaît l’indépendance de l’Estonie, de la Lettonie et de la Lituanie."
  "Macedonia votes for independence from Yugoslavia in a referendum.": "La Macédoine vote pour l’indépendance de la Yougoslavie lors d’un référendum."
  "Armenia declares independence after a referendum.": "L’Arménie déclare son indépendance après un référendum."
  "Azerbaijan declares the restoration of its independence.": "L’Azerbaïdjan déclare le rétablissement de son indépendance."
  "The Soviet Union is dissolved; the northern Caucasus republics stay in the Russian Federation.": "L’Union soviétique est dissoute ; les républiques du Caucase septentrional restent dans la Fédération de Russie."
  "The Soviet Union is dissolved; the Kaliningrad region stays with Russia.": "L’Union soviétique est dissoute ; la région de Kaliningrad reste avec la Russie."
  "The Soviet Union is dissolved. Most republics had declared independence between August and December 1991.": "L’Union soviétique est dissoute. La plupart des républiques avaient déclaré leur indépendance entre août et décembre 1991."
  "Bosnia and Herzegovina declares independence after a referendum boycotted by most Bosnian Serbs.": "La Bosnie-Herzégovine déclare son indépendance après un référendum boycotté par la plupart des Serbes de Bosnie."
  "Czechoslovakia splits peacefully into the Czech Republic and Slovakia.": "La Tchécoslovaquie se sépare pacifiquement en République tchèque et en Slovaquie."
  "Czechoslovakia is dissolved into the Czech Republic and Slovakia.": "La Tchécoslovaquie est dissoute en République tchèque et en Slovaquie."
  "historical-basemaps world_1994 (automatic draft, needs checking)": "historic-basemaps world_1994 (ébauche automatique, vérification des besoins)"
  "historical-basemaps world_2000 (automatic draft, needs checking)": "historic-basemaps world_2000 (ébauche automatique, contrôle des besoins)"
  "Montenegro declares independence after its referendum of 21 May; Serbia becomes the successor of the state union.": "Le Monténégro déclare son indépendance après le référendum du 21 mai ; la Serbie devient le successeur de l’union d’État."
  "Natural Earth admin-0 (de jure borders after Kosovo’s declaration of independence)": "Natural Earth admin-0 (frontières de jure après la déclaration d’indépendance du Kosovo)"
  "Kosovo, under UN administration since 1999, declares independence from Serbia. Serbia and a number of states do not recognise it.": "Le Kosovo, sous l’administration de l’ONU depuis 1999, déclare son indépendance par rapport à la Serbie."
  "About 800. The Abbasid Caliphate rules Armenia, Arran, Shirvan and Azerbaijan through its governors (the province of Arminiya), with Tbilisi and Derbent as frontier fortresses. In the west, Leon II has made the Kingdom of Abkhazia independent of Byzantium; the Georgian princes of Iberia, Kakheti and Hereti and the Alans of the northern Caucasus are autonomous, and the Khazars hold the plains north of the mountains.": "Vers 800. Le califat abbasside gouverne l’Arménie, l’Arran, le Chirvan et l’Azerbaïdjan par ses gouverneurs (la province d’Arminiya), avec Tbilissi et Derbent comme forteresses frontalières. À l’ouest, Léon II a rendu le royaume d’Abkhazie indépendant de Byzance ; les princes géorgiens d’Ibérie, de Kakhétie et d’Héréti et les Alains du Caucase du Nord sont autonomes, et les Khazars tiennent les plaines au nord des montagnes."
  "About 800. East Slavic tribes live in the forests from the Bug to the upper Volga; the Khazar Khaganate rules the steppe from the Dnieper to beyond the Volga and takes tribute from the Slavs nearest to it. Volga Bulgaria is forming on the middle Volga, Byzantium holds Cherson in the Crimea, and Finnic, Permic and Ugric peoples live in the north and east.": "Vers 800. Des tribus slaves orientales vivent dans les forêts, du Boug à la haute Volga ; le khaganat khazar domine la steppe du Dniepr jusqu’au-delà de la Volga et lève un tribut sur les Slaves les plus proches. La Bulgarie de la Volga se forme sur la moyenne Volga, Byzance tient Cherson en Crimée, et des peuples finnois, permiens et ougriens vivent au nord et à l’est."
  "About 830. The Magyars move west into Etelköz, the steppe between the Dnieper and the lower Danube, still under Khazar overlordship.": "Vers 830. Les Magyars s’installent plus à l’ouest, dans l’Etelköz, la steppe entre le Dniepr et le bas Danube, toujours sous la suzeraineté khazare."
  "About 833. Ishaq ibn Ismail, the emir of Tbilisi, stops obeying the caliph. Bugha al-Kabir sacks the city in 853 and kills him, but the emirate goes on under its own emirs.": "Vers 833. Ishaq ibn Ismail, émir de Tbilissi, cesse d’obéir au calife. Bugha al-Kabir saccage la ville en 853 et le tue, mais l’émirat se maintient sous ses propres émirs."
  "Haytham ibn Khalid, the Arab governor of Shirvan, takes the title of Shirvanshah and founds a dynasty independent of the caliphs.": "Haytham ibn Khalid, gouverneur arabe du Chirvan, prend le titre de chirvanchah et fonde une dynastie indépendante des califes."
  "The date the Primary Chronicle gives for the call to Rurik: Scandinavian Rus’ princes rule Novgorod, Ladoga and Izborsk, with Beloozero and Rostov.": "La date que la Chronique des temps passés donne à l’appel de Riourik : des princes rus’ scandinaves gouvernent Novgorod, Ladoga et Izborsk, ainsi que Beloozero et Rostov."
  "Hashim ibn Suraqa becomes emir of Derbent (Bab al-Abwab) and founds the Hashimid emirate.": "Hashim ibn Suraqa devient émir de Derbent (Bab al-Abwab) et fonde l’émirat hachémite."
  "Oleg of Novgorod takes Kiev and makes it his capital, with Smolensk on the way. By 885 the Drevlians have submitted, and the Severians and Radimichs pay tribute to him instead of the Khazars.": "Oleg de Novgorod prend Kiev, dont il fait sa capitale, après Smolensk. En 885, les Drevliens se sont soumis, et les Sévériens et les Radimitches lui paient tribut au lieu des Khazars."
  "The caliph and the Byzantine emperor recognise Ashot I Bagratuni as king of Armenia. The Armenian princes of Syunik, Khachen (Artsakh) and the north acknowledge him.": "Le calife et l’empereur byzantin reconnaissent Achot Ier Bagratouni comme roi d’Arménie. Les princes arméniens de Siounie, de Khatchen (Artsakh) et du nord le reconnaissent."
  "The caliph appoints Muhammad ibn Abi’l-Saj governor of Azerbaijan. His family, the Sajids, rule Azerbaijan, Arran and Nakhchivan from Ardabil and Maragha as all but independent emirs until 929.": "Le calife nomme Muhammad ibn Abi’l-Saj gouverneur de l’Azerbaïdjan. Sa famille, les Sadjides, gouverne l’Azerbaïdjan, l’Arran et le Nakhitchevan depuis Ardabil et Maragha en émirs presque indépendants jusqu’en 929."
  "Grigol Hamam of Hereti, whose seat is at Sheki, takes the title of king.": "Grigol Hamam d’Héréti, dont le siège est à Cheki, prend le titre de roi."
  "About 893. The Oghuz and the Khazars drive the Pechenegs west across the Volga; the Oghuz take the steppe between the Volga and the Ural River.": "Vers 893. Les Oghuz et les Khazars repoussent les Petchénègues à l’ouest de la Volga ; les Oghuz prennent la steppe entre la Volga et l’Oural."
  "The Pechenegs, allied with Bulgaria, attack the Magyars, who leave Etelköz and cross the Carpathians. The Pechenegs hold the steppe from the Don to the Danube.": "Les Petchénègues, alliés à la Bulgarie, attaquent les Magyars, qui quittent l’Etelköz et franchissent les Carpates. Les Petchénègues tiennent la steppe du Don au Danube."
  "Marzuban ibn Muhammad of the Sallarid (Musafirid) dynasty takes Azerbaijan and Arran, filling the gap left by the end of the Sajids (929).": "Marzuban ibn Muhammad, de la dynastie sallaride (moussafiride), prend l’Azerbaïdjan et l’Arran et comble le vide laissé par la fin des Sadjides (929)."
  "Sviatoslav of Kiev subdues the Vyatichi of the upper Oka (964–966), the last East Slavic tribe paying tribute to the Khazars.": "Sviatoslav de Kiev soumet les Viatitches de la haute Oka (964–966), la dernière tribu slave orientale qui payait tribut aux Khazars."
  "Sviatoslav of Kiev destroys the Khazar Khaganate (965–969). North of the mountains the Kasogs (Circassians) and Alania are left independent, and the Avar kingdom of Sarir is the strongest power in Dagestan.": "Sviatoslav de Kiev détruit le khaganat khazar (965–969). Au nord des montagnes, les Kassogues (Circassiens) et l’Alanie restent indépendants, et le royaume avar de Sarir est la première puissance du Daghestan."
  "Sviatoslav of Kiev destroys the Khazar Khaganate (965–969). The Pechenegs take over the steppe west of the Volga, the Oghuz the lower Volga, and Alania the plains north of the Caucasus.": "Sviatoslav de Kiev détruit le khaganat khazar (965–969). Les Petchénègues s’emparent de la steppe à l’ouest de la Volga, les Oghuz de la basse Volga, et l’Alanie des plaines au nord du Caucase."
  "Lashkari ibn Muhammad of the Shaddadid dynasty takes Ganja, and the Shaddadids rule Arran from there; in Azerbaijan the Rawwadids of Tabriz take over from the Sallarids (about 980).": "Lashkari ibn Muhammad, de la dynastie cheddadide, prend Gandja, d’où les Cheddadides gouvernent l’Arran ; en Azerbaïdjan, les Rawwadides de Tabriz succèdent aux Sallarides (vers 980)."
  "Gurgen (Kiurike I) founds the Armenian kingdom of Tashir-Dzoraget (Lori) as a vassal of the Bagratid kings of Ani.": "Gourguen (Kiouriké Ier) fonde le royaume arménien de Tachir-Dzoraget (Lori), vassal des rois bagratides d’Ani."
  "Vladimir of Novgorod takes Polotsk, killing its prince Rogvolod, and then Kiev.": "Vladimir de Novgorod prend Polotsk, où il tue le prince Rogvolod, puis Kiev."
  "Smbat of Syunik is crowned king; the Kingdom of Syunik holds the mountains between Lake Sevan and the Aras.": "Smbat de Siounie est couronné roi ; le royaume de Siounie tient les montagnes entre le lac Sevan et l’Araxe."
  "Vladimir, baptised this year, sends his sons to rule Rostov and Murom; the lands of the Finnic Merya and Muroma on the upper Volga and the Oka are part of Rus’.": "Vladimir, baptisé cette année-là, envoie ses fils gouverner Rostov et Mourom ; les terres des Finnois Mériens et Mouromiens, sur la haute Volga et l’Oka, font partie de la Rus’."
  "Vladimir has taken the Cherven towns (981), fought the Yatvingians (983) and the Croats (992–993): Volhynia, Red Ruthenia and the Bug and Neman lands are part of Rus’.": "Vladimir a pris les villes de Tcherven (981), combattu les Iatvingues (983) et les Croates (992–993) : la Volhynie, la Ruthénie rouge et les terres du Boug et du Niémen font partie de la Rus’."
  "Bryachislav succeeds his father Iziaslav, whom Vladimir had made prince of Polotsk; from now on Polotsk is ruled by its own line of princes.": "Briatchislav succède à son père Iziaslav, que Vladimir avait fait prince de Polotsk ; Polotsk est désormais gouvernée par sa propre lignée de princes."
  "Bagrat III, heir to both Abkhazia and Tao-Klarjeti, unites the western and eastern Georgian lands into the Kingdom of Georgia.": "Bagrat III, héritier à la fois de l’Abkhazie et du Tao-Klardjéti, unit les terres géorgiennes de l’ouest et de l’est dans le royaume de Géorgie."
  "About 1020. Kvirike III of Kakheti absorbs Hereti and rules the Kingdom of Kakheti-Hereti.": "Vers 1020. Kvirike III de Kakhétie absorbe l’Héréti et règne sur le royaume de Kakhétie-Héréti."
  "Byzantium annexes the Bagratid kingdom of Ani. The Armenian kingdoms of Lori and Syunik and the principality of Khachen survive as vassals.": "Byzance annexe le royaume bagratide d’Ani. Les royaumes arméniens de Lori et de Siounie et la principauté de Khatchen survivent comme vassaux."
  "The Seljuk sultan Tughril marches into Azerbaijan; the Rawwadids of Tabriz submit to him.": "Le sultan seldjoukide Toghrul entre en Azerbaïdjan ; les Rawwadides de Tabriz se soumettent à lui."
  "The Cumans (Polovtsians), who have driven the Torks and the Pechenegs west, raid Rus’ for the first time. They hold the steppe from the Danube to beyond the Volga.": "Les Coumans (Polovtses), qui ont repoussé les Torks et les Petchénègues vers l’ouest, attaquent la Rus’ pour la première fois. Ils tiennent la steppe du Danube jusqu’au-delà de la Volga."
  "Sultan Alp Arslan takes Ani from Byzantium.": "Le sultan Alp Arslan prend Ani à Byzance."
  "The Seljuks end the Shaddadid emirate of Ganja and occupy Derbent, where local emirs go on ruling under Seljuk and Shirvani overlordship. The Shirvanshahs keep their throne as Seljuk vassals.": "Les Seldjoukides mettent fin à l’émirat cheddadide de Gandja et occupent Derbent, où des émirs locaux continuent de gouverner sous la suzeraineté seldjoukide et chirvanie. Les chirvanchahs gardent leur trône comme vassaux des Seldjoukides."
  "David IV the Builder annexes the Kingdom of Kakheti-Hereti.": "David IV le Bâtisseur annexe le royaume de Kakhétie-Héréti."
  "David IV takes Lori from the Kiurikid kings; their heirs keep only a small domain in Tavush.": "David IV prend Lori aux rois kiourikides ; leurs héritiers ne gardent qu’un petit domaine dans le Tavouch."
  "After the Battle of Didgori (1121) David IV takes Tbilisi, ending four centuries of Muslim rule there, and makes it his capital.": "Après la bataille de Didgori (1121), David IV prend Tbilissi, mettant fin à quatre siècles de domination musulmane, et en fait sa capitale."
  "The Seljuk sultan grants Arran to Eldiguz; within thirty years he and his sons, the Atabegs of Azerbaijan, rule Arran, Azerbaijan and Nakhchivan as the real power behind the sultans.": "Le sultan seldjoukide confie l’Arran à Eldiguz ; en trente ans, lui et ses fils, les atabegs d’Azerbaïdjan, gouvernent l’Arran, l’Azerbaïdjan et le Nakhitchevan et sont le vrai pouvoir derrière les sultans."
  "The Eldiguzids take Baghaberd, the last fortress of the kings of Syunik.": "Les Ildéguzides prennent Baghaberd, dernière forteresse des rois de Siounie."
  "Queen Tamar’s generals Zakare and Ivane Mkhargrdzeli take Ani (1199) and Dvin (1203). Northern Armenia is ruled by the Zakarids under the Georgian crown, with the Orbelians in Syunik.": "Les généraux de la reine Tamar, Zakaré et Ivané Mkhargrdzéli, prennent Ani (1199) et Dvin (1203). L’Arménie du Nord est gouvernée par les Zakarides sous la couronne géorgienne, avec les Orbélian en Siounie."
  "After the crusaders take Constantinople, Cherson and Crimean Gothia pass to the Empire of Trebizond.": "Après la prise de Constantinople par les croisés, Cherson et la Gothie de Crimée passent à l’empire de Trébizonde."
  "Jalal al-Din, the last Khwarazmshah, takes Tabriz and ends the Eldiguzid atabegate.": "Djalal ad-Din, le dernier khwarezmchah, prend Tabriz et met fin à l’atabegat ildéguzide."
  "Jalal al-Din is killed, and the Mongol general Chormaqan takes Azerbaijan and Arran.": "Djalal ad-Din est tué, et le général mongol Tchormaghan prend l’Azerbaïdjan et l’Arran."
  "The Mongols take Ganja (1235), Lori, Ani and Kars (1236) and the Zakarid lands of Armenia. Queen Rusudan of Georgia submits in 1243, and the kingdom becomes a Mongol vassal.": "Les Mongols prennent Gandja (1235), Lori, Ani et Kars (1236) et les terres zakarides d’Arménie. La reine Roussoudan de Géorgie se soumet en 1243, et le royaume devient vassal des Mongols."
  "The Mongols take Derbent and the northern Caucasus plains; the Alan capital, Magas, falls in the winter of 1239–1240.": "Les Mongols prennent Derbent et les plaines du Caucase du Nord ; la capitale alaine, Magas, tombe pendant l’hiver 1239–1240."
  "Hülegü founds the Ilkhanate, which rules Azerbaijan, Arran, Armenia and Derbent. Georgia and Shirvan stay on the map as its vassals.": "Hülegü fonde l’Ilkhanat, qui gouverne l’Azerbaïdjan, l’Arran, l’Arménie et Derbent. La Géorgie et le Chirvan restent sur la carte comme ses vassaux."
  "David VI Narin breaks away from Mongol rule and is king in western Georgia, which becomes the Kingdom of Imereti.": "David VI Narin rompt avec la domination mongole et règne sur la Géorgie occidentale, qui devient le royaume d’Imereti."
  "The Mongols execute Hasan-Jalal, prince of Khachen; his heirs rule as Mongol vassals.": "Les Mongols exécutent Hassan-Djalal, prince de Khatchen ; ses héritiers règnent comme vassaux des Mongols."
  "Sargis Jaqeli, lord of Samtskhe, breaks with the Georgian crown and submits directly to the Ilkhan.": "Sargis Jakéli, seigneur de Samtskhé, rompt avec la couronne géorgienne et se soumet directement à l’ilkhan."
  "George V the Brilliant reunites the Kingdom of Georgia: he takes Imereti (1329–1330) and brings Samtskhe back under the crown (1334).": "Georges V le Brillant réunifie le royaume de Géorgie : il prend l’Imereti (1329–1330) et ramène le Samtskhé sous la couronne (1334)."
  "The Ilkhanate breaks up after the death of Abu Said (1335). Hasan Kuchak of the Chobanid family takes Azerbaijan, Arran and Armenia.": "L’Ilkhanat se disloque après la mort d’Abou Saïd (1335). Hassan Koutchouk, de la famille chobanide, prend l’Azerbaïdjan, l’Arran et l’Arménie."
  "The Golden Horde khan Jani Beg ends the Chobanid state (1357); after his death Shaikh Uvais of the Jalayirids takes Tabriz.": "Le khan de la Horde d’or Djanibek met fin à l’État chobanide (1357) ; après sa mort, Cheikh Uvais, des Djalayirides, prend Tabriz."
  "Ibrahim I of Derbent becomes Shirvanshah and founds the Derbendi dynasty, which holds Derbent with Shirvan.": "Ibrahim Ier de Derbent devient chirvanchah et fonde la dynastie derbendie, qui tient Derbent avec le Chirvan."
  "Timur takes Tabriz and invades Georgia, where he captures Tbilisi. Azerbaijan, Arran and Armenia become part of his empire; Georgia and Shirvan survive as tributaries.": "Tamerlan prend Tabriz et envahit la Géorgie, où il s’empare de Tbilissi. L’Azerbaïdjan, l’Arran et l’Arménie entrent dans son empire ; la Géorgie et le Chirvan survivent comme tributaires."
  "Timur defeats Tokhtamysh of the Golden Horde on the Terek and ravages the northern Caucasus; Alania never recovers. Kabarda becomes the leading power of the Circassian princes, and the Chechen and Ingush communities of the mountains are left to themselves.": "Tamerlan bat Tokhtamych de la Horde d’or sur le Terek et ravage le Caucase du Nord ; l’Alanie ne s’en relève pas. La Kabardie devient la première puissance des princes circassiens, et les communautés tchétchènes et ingouches des montagnes sont livrées à elles-mêmes."
  "About 1400. After Timur’s campaigns Sheki is ruled by its own princes.": "Vers 1400. Après les campagnes de Tamerlan, Cheki est gouvernée par ses propres princes."
  "Qara Yusuf of the Kara Koyunlu defeats and kills Timur’s son Miran Shah at Sardrud and takes Azerbaijan.": "Qara Yusuf, des Kara Koyunlu, bat et tue Miran Shah, fils de Tamerlan, à Sardroud et prend l’Azerbaïdjan."
  "At Chikhori the rebel Bagrat of Imereti defeats King George VIII. Bagrat becomes king in Imereti, and the princes of Mingrelia, Guria and Abkhazia rule their lands as vassals in name only.": "À Tchikhori, le rebelle Bagrat d’Imereti bat le roi Georges VIII. Bagrat devient roi d’Imereti, et les princes de Mingrélie, de Gourie et d’Abkhazie gouvernent leurs terres en vassaux de nom seulement."
  "Qvarqvare II Jaqeli of Samtskhe defeats and captures George VIII at Paravani; Samtskhe breaks away again, and George rules on in Kakheti as its first king.": "Kvarkvaré II Jakéli de Samtskhé bat et capture Georges VIII à Paravani ; le Samtskhé fait de nouveau sécession, et Georges continue de régner en Kakhétie, dont il est le premier roi."
  "Uzun Hasan of the Aq Qoyunlu defeats and kills Jahan Shah of the Kara Koyunlu.": "Ouzoun Hassan, des Aq Qoyunlu, bat et tue Djahan Shah, des Kara Koyunlu."
  "Ismail Safavi defeats the Aq Qoyunlu at Sharur, takes Tabriz and is crowned shah of Persia.": "Ismaïl Safavi bat les Aq Qoyunlu à Charour, prend Tabriz et est couronné chah de Perse."
  "Rostom Gurieli receives Adjara, taken from Samtskhe.": "Rostom Gourieli reçoit l’Adjarie, prise au Samtskhé."
  "Shah Tahmasp I ends the rule of the Shirvanshahs and annexes Shirvan and Derbent.": "Le chah Tahmasp Ier met fin au règne des chirvanchahs et annexe le Chirvan et Derbent."
  "Shah Tahmasp I annexes Sheki.": "Le chah Tahmasp Ier annexe Cheki."
  "Lala Mustafa Pasha defeats the Persians at Çıldır and takes Samtskhe, which becomes the Ottoman province of Childir (Akhaltsikhe).": "Lala Mustafa Pacha bat les Perses à Çıldır et prend le Samtskhé, qui devient la province ottomane de Childir (Akhaltsikhé)."
  "Treaty of Constantinople. Persia cedes to the Ottomans the Caucasus lands they had taken since 1578: Erivan, Nakhchivan, Karabakh, Ganja, Shirvan with Derbent, Sheki and Tabriz.": "Traité de Constantinople. La Perse cède aux Ottomans les terres du Caucase qu’ils avaient prises depuis 1578 : Erevan, le Nakhitchevan, le Karabagh, Gandja, le Chirvan avec Derbent, Cheki et Tabriz."
  "Shah Abbas I retakes Tabriz (1603), Nakhchivan and Erivan.": "Le chah Abbas Ier reprend Tabriz (1603), le Nakhitchevan et Erevan."
  "Shah Abbas I completes the reconquest with Ganja (1606), Shirvan, Baku and Derbent.": "Le chah Abbas Ier achève la reconquête avec Gandja (1606), le Chirvan, Bakou et Derbent."
  "The Ottomans conquer Adjara.": "Les Ottomans conquièrent l’Adjarie."
  "The Lezgin (Avar and Tsakhur) communities of Jar and Belokani defeat the king of Kakheti and keep the lands of old Hereti north of the Alazani as free communities.": "Les communautés lezghiennes (avares et tsakhoures) de Djar et de Belokani battent le roi de Kakhétie et gardent, en communautés libres, les terres de l’ancien Héréti au nord de l’Alazani."
  "Peter the Great’s Persian campaign: Derbent opens its gates to the Russian army.": "Campagne de Perse de Pierre le Grand : Derbent ouvre ses portes à l’armée russe."
  "Treaty of Saint Petersburg. The Safavid prince Tahmasp cedes the Caspian coast to Russia; Russian troops hold Baku (taken in July), Quba, Salyan and the Talysh coast.": "Traité de Saint-Pétersbourg. Le prince safavide Tahmasp cède la côte de la Caspienne à la Russie ; les troupes russes tiennent Bakou (prise en juillet), Kouba, Salyan et la côte du Talych."
  "Treaty of Constantinople between Russia and the Ottomans. Ottoman armies take Tbilisi and Kartli (1723), Erivan, Ganja, Nakhchivan and Karabakh; Shirvan and Sheki submit under Ottoman protection.": "Traité de Constantinople entre la Russie et les Ottomans. Les armées ottomanes prennent Tbilissi et le Karthli (1723), Erevan, Gandja, le Nakhitchevan et le Karabagh ; le Chirvan et Cheki se placent sous protection ottomane."
  "The Ottomans take Tabriz.": "Les Ottomans prennent Tabriz."
  "Nader, Tahmasp II’s general, drives the Ottomans out of Tabriz and Azerbaijan.": "Nader, général de Tahmasp II, chasse les Ottomans de Tabriz et de l’Azerbaïdjan."
  "Treaty of Resht. Russia returns the Persian lands south of the Kura.": "Traité de Racht. La Russie rend les terres persanes au sud de la Koura."
  "Treaty of Ganja. Russia returns Baku and Derbent to Persia.": "Traité de Gandja. La Russie rend Bakou et Derbent à la Perse."
  "Nader defeats the Ottomans at Yeghevard and retakes Ganja, Tbilisi, Shirvan and Karabakh. Kartli is ruled by Persian governors.": "Nader bat les Ottomans à Yeghevard et reprend Gandja, Tbilissi, le Chirvan et le Karabagh. Le Karthli est gouverné par des gouverneurs persans."
  "Erivan surrenders to Nader (October 1735), who is crowned shah in 1736 and makes Erivan one of four khanates in the Caucasus.": "Erevan se rend à Nader (octobre 1735), qui est couronné chah en 1736 et fait d’Erevan l’un des quatre khanats du Caucase."
  "Haji Chalabi leads a rising against Nader’s officials in Sheki and founds the Khanate of Sheki.": "Hadji Tchelebi mène un soulèvement contre les agents de Nader à Cheki et fonde le khanat de Cheki."
  "Nader gives Kartli to Teimuraz II and Kakheti to his son Erekle II as vassal kings.": "Nader confie le Karthli à Teimouraz II et la Kakhétie à son fils Héraclius II comme rois vassaux."
  "Nader Shah is murdered, and Persian rule north of the Aras falls apart. The khans of Karabakh, Ganja, Shirvan, Baku, Quba, Derbent, Talysh, Javad, Erivan and Nakhchivan rule as independent princes.": "Nader Chah est assassiné, et le pouvoir persan au nord de l’Araxe s’effondre. Les khans du Karabagh, de Gandja, du Chirvan, de Bakou, de Kouba, de Derbent, du Talych, de Djavad, d’Erevan et du Nakhitchevan gouvernent en princes indépendants."
  "Teimuraz II dies, and Erekle II unites Kartli and Kakheti; the kingdom also holds the Kazakh and Shamshadil lands north of Ganja.": "Teimouraz II meurt, et Héraclius II unit le Karthli et la Kakhétie ; le royaume tient aussi les terres de Kazakh et de Chamchadil au nord de Gandja."
  "Fatali Khan of Quba takes Derbent; by the 1780s he also controls Baku and Shirvan, but his realm breaks up after his death (1789).": "Fath Ali Khan de Kouba prend Derbent ; dans les années 1780, il contrôle aussi Bakou et le Chirvan, mais son domaine se disloque après sa mort (1789)."
  "Agha Mohammad Khan Qajar receives the submission of Erivan and Nakhchivan on his way to sack Tbilisi; both stay under Persian rule until 1828.": "Agha Mohammad Khan Qadjar reçoit la soumission d’Erevan et du Nakhitchevan en marchant sur Tbilissi, qu’il saccage ; tous deux restent sous domination persane jusqu’en 1828."
  "The khans of Karabakh, with Zangezur, and Sheki (and in December Shirvan) accept Russian suzerainty, Russia annexes the Shuragel sultanate around Gyumri, and the Khanate of Javad is annexed.": "Les khans du Karabagh, avec le Zanguezour, et de Cheki (et en décembre du Chirvan) acceptent la suzeraineté russe, la Russie annexe le sultanat de Chouragel autour de Gyumri, et le khanat de Djavad est annexé."
  About 800. The Abbasid Caliphate of Harun al-Rashid rules Iraq, Iran, Khorasan and Transoxiana. Gilan on the Caspian, the Shahis of Kabul, the Zunbils of Zabulistan and the Turkic Karluks are outside its rule, and the mountains of Ghor, Badakhshan and the Pamirs are held by local chiefs (not shown as states).: Vers 800. Le califat abbasside de Haroun al-Rachid règne sur l’Irak, l’Iran, le Khorassan et la Transoxiane. Le Gilan, sur la Caspienne, les Shahis de Kaboul, les Zunbils du Zaboulistan et les Karlouks turcs échappent à son autorité, et les montagnes du Ghor, du Badakhchan et du Pamir sont aux mains de chefs locaux (non représentés comme des États).
  Tahir ibn Husayn, al-Ma’mun’s general, becomes governor of Khorasan. His family, the Tahirids, govern Khorasan and the east as hereditary governors for the caliphs until 873; the Samanid brothers rule Transoxiana under them.: Tahir ibn Husayn, général d’al-Ma’mun, devient gouverneur du Khorassan. Sa famille, les Tahirides, gouverne le Khorassan et les provinces orientales pour les califes, à titre héréditaire, jusqu’en 873 ; les frères samanides gouvernent la Transoxiane sous leur autorité.
  Mazyar, the ruler of Tabaristan, rebels against the Tahirids and is defeated and executed; Tabaristan passes to the Tahirids.: Mazyar, souverain du Tabaristan, se révolte contre les Tahirides ; il est vaincu et exécuté, et le Tabaristan passe aux Tahirides.
  "Ya’qub ibn al-Layth, a coppersmith turned leader of volunteer fighters, takes Zaranj in Sistan: the beginning of the Saffarids.": "Ya’qub ibn al-Layth, chaudronnier devenu chef de combattants volontaires, prend Zarandj, dans le Sistan : c’est le début des Saffarides."
  Hasan ibn Zayd, a Zaydi descendant of Ali, is proclaimed in Tabaristan and drives out the Tahirid governors.: Hasan ibn Zayd, descendant zaydite d’Ali, est proclamé au Tabaristan et en chasse les gouverneurs tahirides.
  Ya’qub kills the Zunbil of Zabulistan and takes his lands, Bost and Ghazni among them.: Ya’qub tue le Zunbil du Zaboulistan et s’empare de ses terres, dont Bost et Ghazni.
  Ya’qub takes Kerman. He also defeats the governor of Fars at Shiraz, but goes home with the spoils.: Ya’qub prend le Kerman. Il bat aussi le gouverneur du Fars à Chiraz, mais rentre chez lui avec le butin.
  Ya’qub takes Herat, Balkh and Bamyan (870–871), and drives the Hindu Shahis from Kabul.: Ya’qub prend Hérat, Balkh et Bamiyan (870–871) et chasse les Shahis hindous de Kaboul.
  Ya’qub enters Nishapur and ends Tahirid rule in Khorasan. In Transoxiana the Samanid governors, until now under the Tahirids, rule on their own; the caliph names Nasr ibn Ahmad governor of all Transoxiana in 875.: Ya’qub entre à Nichapour et met fin à la domination tahiride au Khorassan. En Transoxiane, les gouverneurs samanides, jusque-là soumis aux Tahirides, gouvernent désormais pour leur propre compte ; en 875, le calife nomme Nasr ibn Ahmad gouverneur de toute la Transoxiane.
  Ya’qub defeats Muhammad ibn Wasil, master of Fars since 870, near Lake Bakhtegan and takes Fars.: Ya’qub bat Muhammad ibn Wasil, maître du Fars depuis 870, près du lac Bakhtegan et s’empare du Fars.
  Ismail the Samanid takes Talas from the Karluks.: Ismaïl le Samanide prend Talas aux Karlouks.
  Ismail the Samanid defeats and captures the Saffarid Amr ibn al-Layth near Balkh. Khorasan passes to the Samanids, who also take Tabaristan from the Alids; the Saffarids keep Sistan, Kerman and Fars, and Kabul returns to the Hindu Shahis. Ghazni and Bost fall to local rulers (not shown as states).: Ismaïl le Samanide bat et capture le Saffaride Amr ibn al-Layth près de Balkh. Le Khorassan passe aux Samanides, qui prennent aussi le Tabaristan aux Alides ; les Saffarides gardent le Sistan, le Kerman et le Fars, et Kaboul revient aux Shahis hindous. Ghazni et Bost tombent aux mains de souverains locaux (non représentés comme des États).
  Abbasid forces retake Fars and Kerman from the Saffarids.: Les troupes abbassides reprennent le Fars et le Kerman aux Saffarides.
  The Samanids conquer Sistan (911–913).: Les Samanides conquièrent le Sistan (911–913).
  Hasan al-Utrush restores Alid rule in Tabaristan (until 928).: Hasan al-Utrush rétablit la domination alide au Tabaristan (jusqu’en 928).
  A Saffarid, Abu Ja’far Ahmad, is restored in Sistan under Samanid overlordship.: Un Saffaride, Abu Ja’far Ahmad, est rétabli au Sistan sous la suzeraineté des Samanides.
  The Hamdanid Nasir al-Dawla governs Mosul and the Jazira for the caliphs, and from the 930s on his own account.: Le Hamdanide Nasir al-Dawla gouverne Mossoul et la Djézireh pour le compte des califes, puis, à partir des années 930, pour son propre compte.
  "Mardavij ibn Ziyar, a Gilani officer who overthrew Asfar ibn Shiruya, the last master of the former Alid lands, rules Tabaristan, Gorgan and the Jibal from Isfahan: the Ziyarid dynasty.": "Mardavij ibn Ziyar, officier gilani qui a renversé Asfar ibn Shiruya, dernier maître des anciennes terres alides, règne depuis Ispahan sur le Tabaristan, le Gorgan et le Djibal : c’est la dynastie ziyaride."
  Muhammad ibn Ilyas, a Samanid officer, makes himself ruler of Kerman (until 968).: Muhammad ibn Ilyas, officier samanide, se rend maître du Kerman (jusqu’en 968).
  "Ali ibn Buya, later called Imad al-Dawla, takes Shiraz: the Buyids, Daylamite soldiers, rule Fars.": "Ali ibn Buya, appelé plus tard Imad al-Dawla, prend Chiraz : les Bouyides, des soldats daylamites, règnent sur le Fars."
  The Buyid Ahmad ibn Buya takes Khuzestan.: Le Bouyide Ahmad ibn Buya prend le Khouzistan.
  About 940. The Karakhanids, a Turkic dynasty that turns to Islam under Satuq Bughra Khan, take Balasagun from the Karluks.: Vers 940. Les Karakhanides, dynastie turque qui se convertit à l’islam sous Satuq Bughra Khan, prennent Balasagun aux Karlouks.
  The Buyid Rukn al-Dawla retakes Isfahan, which he first took after Mardavij’s murder in 935 and lost to the Ziyarid Vushmgir; the Buyids hold Isfahan and the Jibal.: Le Bouyide Rukn al-Dawla reprend Ispahan, qu’il avait pris une première fois après l’assassinat de Mardavij en 935 avant de le perdre au profit du Ziyaride Vushmgir ; les Bouyides tiennent Ispahan et le Djibal.
  The Buyid Rukn al-Dawla takes Rayy for good.: Le Bouyide Rukn al-Dawla prend définitivement Rayy.
  Ahmad ibn Buya enters Baghdad and the caliph names him Mu’izz al-Dawla. The Buyids rule Iraq; the Abbasid caliphs keep only their religious authority.: Ahmad ibn Buya entre à Bagdad, et le calife lui donne le titre de Mu’izz al-Dawla. Les Bouyides règnent sur l’Irak ; les califes abbassides ne conservent que leur autorité religieuse.
  Alptigin, a Samanid general who had fallen out with the court, takes Ghazni; his Turkish successors, the Ghaznavids, rule it as Samanid vassals.: Alptigin, général samanide brouillé avec la cour, prend Ghazni ; ses successeurs turcs, les Ghaznévides, la gouvernent en vassaux des Samanides.
  The Buyid Adud al-Dawla ends the Ilyasids and takes Kerman.: Le Bouyide Adud al-Dawla met fin aux Ilyassides et prend le Kerman.
  Sabuktigin succeeds at Ghazni and takes Bost.: Sabuktigin prend la succession à Ghazni et s’empare de Bost.
  Adud al-Dawla takes Mosul from the Hamdanids.: Adud al-Dawla prend Mossoul aux Hamdanides.
  Adud al-Dawla, who took Tabaristan in 980, and his brother Mu’ayyad al-Dawla drive the Ziyarid Qabus from Gorgan (until 998).: Adud al-Dawla, qui a pris le Tabaristan en 980, et son frère Mu’ayyad al-Dawla chassent le Ziyaride Qabus du Gorgan (jusqu’en 998).
  Sabuktigin defeats Jayapala, the Hindu Shahi king, near Laghman and takes Kabul and the lands from Laghman towards Peshawar.: Sabuktigin bat Jayapala, roi des Shahis hindous, près de Laghman et prend Kaboul ainsi que les terres qui s’étendent de Laghman vers Peshawar.
  The Uqaylid Arabs take Mosul from the Buyids.: Les Arabes uqaylides prennent Mossoul aux Bouyides.
  Ma’mun ibn Muhammad of Gurganj unites Khwarazm under his Ma’munid dynasty.: Ma’mun ibn Muhammad, de Gourgandj, unifie le Khwarezm sous sa dynastie, celle des Mamounides.
  Qabus regains Tabaristan and Gorgan for the Ziyarids.: Qabus reprend le Tabaristan et le Gorgan pour les Ziyarides.
  The Karakhanids take Bukhara and end the Samanid state north of the Oxus. Mahmud of Ghazni, who held Khorasan for the Samanids, keeps the lands south of it and rules on his own.: Les Karakhanides prennent Boukhara et mettent fin à l’État samanide au nord de l’Oxus. Mahmoud de Ghazni, qui tenait le Khorassan pour les Samanides, garde les terres situées au sud du fleuve et règne pour son propre compte.
  Mahmud of Ghazni defeats Jayapala near Peshawar; the Hindu Shahis lose their lands west of the Indus.: Mahmoud de Ghazni bat Jayapala près de Peshawar ; les Shahis hindous perdent leurs terres à l’ouest de l’Indus.
  Mahmud ends the Saffarids of Sistan.: Mahmoud met fin aux Saffarides du Sistan.
  Mahmud subdues Ghor.: Mahmoud soumet le Ghor.
  Mahmud annexes Khwarazm and ends the Ma’munids.: Mahmoud annexe le Khwarezm et met fin aux Mamounides.
  Mahmud takes Rayy from the Buyid Majd al-Dawla.: Mahmoud prend Rayy au Bouyide Majd al-Dawla.
  The Seljuk Turks under Tughril take Nishapur; Merv had fallen to them in 1037.: Les Turcs seldjoukides, menés par Toghrul, prennent Nichapour ; Merv était tombée entre leurs mains en 1037.
  The Seljuks defeat the Ghaznavid Mas’ud at Dandanaqan. Khorasan and Herat pass to them; the Ghaznavids keep Balkh and their lands to the east.: Les Seldjoukides battent le Ghaznévide Massoud à Dandanaqan. Le Khorassan et Hérat leur reviennent ; les Ghaznévides gardent Balkh et leurs terres plus à l’est.
  The Seljuks take Rayy, Gorgan and Tabaristan; the Ziyarids rule on as their vassals until 1090.: Les Seldjoukides prennent Rayy, le Gorgan et le Tabaristan ; les Ziyarides continuent d’y régner comme leurs vassaux jusqu’en 1090.
  The Seljuks take Khwarazm.: Les Seldjoukides prennent le Khwarezm.
  Qavurt, Tughril’s nephew, founds the Seljuk sultanate of Kerman; Sistan accepts Seljuk rule.: Qavurt, neveu de Toghrul, fonde le sultanat seldjoukide du Kerman ; le Sistan accepte la domination seldjoukide.
  Tughril takes Isfahan, which becomes his capital, and the Jibal.: Toghrul prend Ispahan, dont il fait sa capitale, ainsi que le Djibal.
  Tughril enters Baghdad; the last Buyid ruler of Iraq is deposed.: Toghrul entre à Bagdad ; le dernier souverain bouyide d’Irak est déposé.
  "Peace between the Seljuks and the Ghaznavids: Balkh and Tokharistan go to the Seljuks.": "Paix entre les Seldjoukides et les Ghaznévides : Balkh et le Tokharestan reviennent aux Seldjoukides."
  The Seljuks end the last Buyid rule in Fars.: Les Seldjoukides mettent fin à la dernière domination bouyide, celle du Fars.
  The Nizari Ismailis, who seized Alamut in 1090, take control of Quhistan.: Les ismaéliens nizarites, maîtres d’Alamut depuis 1090, prennent le contrôle du Quhistan.
  Kerbogha, a Seljuk commander, takes Mosul from the Uqaylids.: Kerbogha, chef militaire seldjoukide, prend Mossoul aux Uqaylides.
  "Qutb al-Din Muhammad becomes Khwarazmshah: his Anushteginid dynasty rules Khwarazm as Seljuk vassals.": "Qutb al-Din Muhammad devient khwarezmchah : sa dynastie, celle des Anouchteguinides, gouverne le Khwarezm en vassale des Seldjoukides."
  "Imad al-Din Zengi becomes atabeg of Mosul: the Zengids.": "Imad al-Din Zengi devient atabeg de Mossoul : c’est le début des Zengides."
  Yelü Dashi, founder of the Qara Khitai, takes Balasagun from the Karakhanids.: Yelü Dashi, fondateur des Kara Khitaï, prend Balasagun aux Karakhanides.
  Sunqur ibn Mawdud founds the Salghurid atabegate of Fars.: Sunqur ibn Mawdud fonde l’atabegat salghuride du Fars.
  The Shansabani princes of Ghor throw off Ghaznavid rule; in 1150 Ala al-Din Husayn burns Ghazni.: Les princes shansabani du Ghor secouent la tutelle ghaznévide ; en 1150, Ala al-Din Husayn incendie Ghazni.
  Sanjar, the last Great Seljuk sultan in the east, dies after three years as a captive of the Oghuz. Khorasan breaks up among Oghuz chiefs and former Seljuk commanders (not shown as states); the Abbasid caliphs rule Iraq on their own again, the Bavandids Tabaristan and the maliks of Sistan their province.: Sanjar, dernier sultan grand seldjoukide d’Orient, meurt après trois ans de captivité chez les Oghouzes. Le Khorassan se morcelle entre chefs oghouzes et anciens chefs militaires seldjoukides (non représentés comme des États) ; les califes abbassides gouvernent de nouveau l’Irak pour leur propre compte, les Bavandides le Tabaristan et les maliks du Sistan leur province.
  Ghiyath al-Din of Ghor takes Ghazni; the Ghaznavids withdraw to Lahore.: Ghiyath al-Din de Ghor prend Ghazni ; les Ghaznévides se replient sur Lahore.
  The Ghurids take Herat.: Les Ghurides prennent Hérat.
  Oghuz tribesmen under Malik Dinar end the Seljuk sultanate of Kerman.: Des tribus oghouzes menées par Malik Dinar mettent fin au sultanat seldjoukide du Kerman.
  The Khwarazmshah Tekish takes Nishapur and, over the next years, the rest of western Khorasan.: Le khwarezmchah Tekish prend Nichapour puis, dans les années suivantes, le reste du Khorassan occidental.
  Tekish defeats and kills Tughril III, the last Seljuk sultan of Iraq, near Rayy. The Khwarazmshahs take the Jibal; Caliph al-Nasir takes Khuzestan.: Tekish bat et tue près de Rayy Toghrul III, dernier sultan seldjoukide d’Irak. Les khwarezmchahs prennent le Djibal ; le calife al-Nasir prend le Khouzistan.
  The Ghurids take Balkh.: Les Ghurides prennent Balkh.
  About 1203. The Khwarazmshahs take Kerman.: Vers 1203. Les khwarezmchahs prennent le Kerman.
  The Khwarazmshah Muhammad II ends the Bavandids of Tabaristan.: Le khwarezmchah Muhammad II met fin aux Bavandides du Tabaristan.
  Kuchlug, a Naiman prince, usurps the throne of the Qara Khitai and takes the eastern Karakhanid lands in Ferghana.: Kütchlüg, prince naïman, usurpe le trône des Kara Khitaï et prend les terres karakhanides orientales du Ferghana.
  Muhammad II takes Samarkand and ends the western Karakhanids.: Muhammad II prend Samarcande et met fin aux Karakhanides occidentaux.
  "After the death of Muhammad of Ghor (1206) the Khwarazmshahs take the Ghurid lands: Herat, Balkh and, in 1215, Ghazni.": "Après la mort de Muhammad de Ghor (1206), les khwarezmchahs s’emparent des terres ghurides : Hérat, Balkh et, en 1215, Ghazni."
  The Mongol general Jebe destroys Kuchlug; the former Qara Khitai lands pass to the Mongol Empire.: Le général mongol Djebé anéantit Kütchlüg ; les anciennes terres des Kara Khitaï passent à l’Empire mongol.
  Genghis Khan takes Bukhara (February) and Samarkand (March).: Gengis Khan prend Boukhara (février) et Samarcande (mars).
  The Mongols destroy Gurganj, Merv, Nishapur, Balkh and Herat, and defeat Jalal al-Din on the Indus in November. His brother Ghiyath al-Din holds the Jibal and Isfahan, and the Nizaris keep Quhistan.: Les Mongols détruisent Gourgandj, Merv, Nichapour, Balkh et Hérat, et battent Jalal al-Din sur l’Indus en novembre. Son frère Ghiyath al-Din tient le Djibal et Ispahan, et les Nizarites gardent le Quhistan.
  "Baraq Hajib, a former Qara Khitai officer, takes Kerman: the Qutlugh-Khanids, who soon accept Mongol overlordship.": "Baraq Hajib, ancien officier des Kara Khitaï, prend le Kerman : ce sont les Qutlugh-Khanides, qui acceptent bientôt la suzeraineté mongole."
  Jalal al-Din is killed; the Mongol general Chormaqan takes the Jibal and Rayy (Isfahan falls in 1235/36).: Jalal al-Din est tué ; le général mongol Chormaqan prend le Djibal et Rayy (Ispahan tombe en 1235/36).
  Shams al-Din Kart succeeds his father as malik of Herat. His Kartid dynasty rules Herat and Ghor as vassals of the Mongols, from 1256 of the Ilkhans.: Shams al-Din Kart succède à son père comme malik de Hérat. Sa dynastie, celle des Kartides, gouverne Hérat et le Ghor en vassale des Mongols, puis, à partir de 1256, des Ilkhans.
  Hülegü destroys the Nizari castles and founds the Ilkhanate.: Houlagou détruit les forteresses nizarites et fonde l’Ilkhanat.
  Hülegü takes Baghdad and has the last Abbasid caliph of Baghdad, al-Musta’sim, killed.: Houlagou prend Bagdad et fait mettre à mort le dernier calife abbasside de Bagdad, al-Musta’sim.
  About 1260. The Chagatai khan Alghu takes Transoxiana; the Golden Horde holds Khwarazm. In Afghanistan the Chagatai khans and their Negüderi allies hold Balkh, Kabul and Ghazni.: Vers 1260. Le khan djaghataïde Alghu prend la Transoxiane ; la Horde d’or tient le Khwarezm. En Afghanistan, les khans djaghataïdes et leurs alliés negüderis tiennent Balkh, Kaboul et Ghazni.
  The Ilkhanate takes Mosul from the successors of Badr al-Din Lu’lu’, who had ruled it from 1233 as the Zengids’ heir (shown with Zengid Mosul until then).: L’Ilkhanat prend Mossoul aux successeurs de Badr al-Din Lu’lu’, qui la gouvernait depuis 1233 en héritier des Zengides (son règne est représenté jusque-là avec celui des Zengides de Mossoul).
  The Ilkhanate annexes Fars after the last Salghurid ruler, Abish Khatun.: L’Ilkhanat annexe le Fars après la dernière souveraine salghuride, Abish Khatun.
  About 1300. The kings of Hormuz move to the island of Jarun, the new Hormuz, which becomes the Gulf’s great trading port.: Vers 1300. Les rois d’Ormuz s’installent sur l’île de Jarun, la nouvelle Ormuz, qui devient le grand port marchand du Golfe.
  Öljeitü conquers Gilan and ends the Qutlugh-Khanids of Kerman.: Oldjaïtou conquiert le Gilan et met fin aux Qutlugh-Khanides du Kerman.
  The Ilkhanate breaks up after the death of Abu Sa’id (1335). The Jalayirids take Baghdad, the Chobanids the Jibal, the Injuids Fars and Isfahan, the Muzaffarids Kerman and the Sarbadars western Khorasan; the Kartids of Herat rule on their own, and Gilan and Mazandaran return to local rulers.: L’Ilkhanat se disloque après la mort d’Abu Sa’id (1335). Les Djalayirides prennent Bagdad, les Chobanides le Djibal, les Injuides le Fars et Ispahan, les Muzaffarides le Kerman et les Sarbadars le Khorassan occidental ; les Kartides de Hérat règnent pour leur propre compte, et le Gilan et le Mazandéran reviennent à des souverains locaux.
  "The Chagatai Khanate splits: the eastern khans rule Moghulistan, while Transoxiana is run by Turkic emirs in the name of puppet khans.": "Le khanat de Djaghataï se scinde : les khans orientaux règnent sur le Moghulistan, tandis que la Transoxiane est gouvernée par des émirs turcs au nom de khans fantoches."
  The Muzaffarid Mubariz al-Din takes Shiraz (1353) and Isfahan (1357), ending the Injuids.: Le Muzaffaride Mubariz al-Din prend Chiraz (1353) et Ispahan (1357), mettant fin aux Injuides.
  After the end of the Chobanids (1357) the Jalayirids take the Jibal.: Après la fin des Chobanides (1357), les Djalayirides prennent le Djibal.
  Husayn Sufi takes Urgench from the Golden Horde and founds the Sufi dynasty of Khwarazm.: Husayn Sufi prend Ourguentch à la Horde d’or et fonde la dynastie soufie du Khwarezm.
  Timur defeats his rival Amir Husayn at Balkh and becomes master of Transoxiana.: Tamerlan bat son rival l’émir Husayn à Balkh et devient maître de la Transoxiane.
  Timur takes Herat and ends the Kartids; the Sarbadars submit.: Tamerlan prend Hérat et met fin aux Kartides ; les Sarbadars se soumettent.
  Timur sacks Sistan and takes Kandahar.: Tamerlan ravage le Sistan et prend Kandahar.
  Timur takes Gorgan, Rayy and Sultaniyya.: Tamerlan prend le Gorgan, Rayy et Sultaniyya.
  Timur destroys Urgench and annexes Khwarazm.: Tamerlan détruit Ourguentch et annexe le Khwarezm.
  "Timur’s Five-Year Campaign: he ends the Muzaffarids, takes Mazandaran (1392) and in August 1393 Baghdad.": "La campagne de cinq ans de Tamerlan : il met fin aux Muzaffarides, prend le Mazandéran (1392) puis, en août 1393, Bagdad."
  Timur dies at Otrar (18 February). Ahmad Jalayir returns to Baghdad, the Marashi sayyids to Mazandaran and the maliks of Sistan to their province.: Tamerlan meurt à Otrar (18 février). Ahmad Jalayir revient à Bagdad, les sayyids marashi au Mazandéran et les maliks du Sistan dans leur province.
  Qara Yusuf of the Kara Koyunlu takes Baghdad and the Jibal from the Jalayirids, who hold out in the south until 1432.: Qara Yusuf, des Kara Koyunlu, prend Bagdad et le Djibal aux Djalayirides, qui se maintiennent dans le sud jusqu’en 1432.
  The Kara Koyunlu take Basra from the last Jalayirids.: Les Kara Koyunlu prennent Bassora aux derniers Djalayirides.
  About 1440. The Musha’sha’, a messianic Arab movement led by Muhammad ibn Falah, take Khuzestan.: Vers 1440. Les Musha’sha’, mouvement arabe messianique mené par Muhammad ibn Falah, prennent le Khouzistan.
  After the death of the Timurid Shah Rukh (1447), Jahan Shah of the Kara Koyunlu takes Rayy, Isfahan, Fars and Kerman (1452–1458).: Après la mort du Timouride Shah Rukh (1447), Jahan Shah, des Kara Koyunlu, prend Rayy, Ispahan, le Fars et le Kerman (1452–1458).
  Uzun Hasan of the Aq Qoyunlu defeats and kills Jahan Shah; the Aq Qoyunlu take the Kara Koyunlu lands in Iraq and western Iran.: Uzun Hasan, des Aq Qoyunlu, bat et tue Jahan Shah ; les Aq Qoyunlu s’emparent des terres des Kara Koyunlu en Irak et dans l’ouest de l’Iran.
  The Arghuns, Timurid governors, rule Kandahar on their own.: Les Arghun, gouverneurs timourides, règnent sur Kandahar pour leur propre compte.
  Yunus Khan of Moghulistan takes Tashkent.: Yunus Khan, khan du Moghulistan, prend Tachkent.
  Muhammad Shaybani Khan’s Uzbeks take Samarkand and Bukhara from the Timurids (1500–1501).: Les Ouzbeks de Muhammad Chaybani Khan prennent Samarcande et Boukhara aux Timourides (1500–1501).
  Shah Ismail I defeats the Aq Qoyunlu at Hamadan; by 1504 he holds the Jibal, Isfahan, Fars, Yazd and Kerman.: Shah Ismaïl Ier bat les Aq Qoyunlu à Hamadan ; en 1504, il tient le Djibal, Ispahan, le Fars, Yazd et le Kerman.
  Shaybani defeats the khans of Moghulistan at Akhsi and takes Tashkent and Ferghana.: Chaybani bat les khans du Moghulistan à Akhsi et prend Tachkent et le Ferghana.
  Babur, a Timurid prince driven out of Ferghana, takes Kabul.: Babur, prince timouride chassé du Ferghana, prend Kaboul.
  Shaybani takes Urgench and Khwarazm.: Chaybani prend Ourguentch et le Khwarezm.
  Shaybani takes Herat and ends the Timurids of Khorasan.: Chaybani prend Hérat et met fin aux Timourides du Khorassan.
  Shah Ismail takes Baghdad, Mosul and Khuzestan; the Musha’sha’ rule on as his vassals.: Shah Ismaïl prend Bagdad, Mossoul et le Khouzistan ; les Musha’sha’ continuent de régner comme ses vassaux.
  Shah Ismail defeats and kills Muhammad Shaybani near Merv and takes Khorasan and Herat; the Uzbeks fall back across the Oxus. Babur takes Kunduz and Badakhshan.: Shah Ismaïl bat et tue Muhammad Chaybani près de Merv et prend le Khorassan et Hérat ; les Ouzbeks se replient au-delà de l’Oxus. Babur prend Kunduz et le Badakhchan.
  "Ilbars, a Shaybanid of the Arabshahid line, takes Khwarazm: the Khanate of Khiva.": "Ilbars, un Chaybanide de la lignée des Arabshahides, prend le Khwarezm : c’est le khanat de Khiva."
  The Uzbeks defeat Babur and his Persian allies at Ghazdewan; Babur loses Transoxiana and Balkh but keeps Kunduz and Badakhshan.: Les Ouzbeks battent Babur et ses alliés persans à Ghazdewan ; Babur perd la Transoxiane et Balkh mais garde Kunduz et le Badakhchan.
  The Portuguese under Afonso de Albuquerque build a fortress on Hormuz; the kings of Hormuz rule on as their vassals, and Muscat is held by a Portuguese garrison.: Les Portugais d’Afonso de Albuquerque bâtissent une forteresse à Ormuz ; les rois d’Ormuz continuent de régner comme leurs vassaux, et Mascate est tenue par une garnison portugaise.
  Babur takes Kandahar from the Arghuns.: Babur prend Kandahar aux Arghun.
  Suleiman the Magnificent enters Baghdad; Iraq passes to the Ottomans.: Soliman le Magnifique entre à Bagdad ; l’Irak passe aux Ottomans.
  Basra submits to the Ottomans.: Bassora se soumet aux Ottomans.
  Shah Tahmasp I takes Kandahar from the Mughals.: Shah Tahmasp Ier prend Kandahar aux Moghols.
  About 1570. The Moghul khans, now based in Yarkand, have lost the Chuy and Issyk-Kul lands; the Kyrgyz tribes there live outside any state.: Vers 1570. Les khans du Moghulistan, désormais établis à Yarkand, ont perdu les terres de la Tchouï et de l’Issyk-Koul ; les tribus kirghizes qui y vivent échappent à tout État.
  Abdullah Khan II of Bukhara takes Badakhshan and Kunduz.: Abdullah Khan II de Boukhara prend le Badakhchan et Kunduz.
  The Uzbeks of Abdullah Khan II take Herat (1588) and Mashhad (1589).: Les Ouzbeks d’Abdullah Khan II prennent Hérat (1588) et Mechhed (1589).
  Shah Abbas I annexes Gilan (1592) and Mazandaran (1596–97).: Shah Abbas Ier annexe le Gilan (1592) et le Mazandéran (1596–97).
  The Mughals regain Kandahar.: Les Moghols reprennent Kandahar.
  Shah Abbas I retakes Mashhad and Herat from the Uzbeks.: Shah Abbas Ier reprend Mechhed et Hérat aux Ouzbeks.
  The Kazakh khan Tevekkel takes Tashkent.: Le khan kazakh Tevekkel prend Tachkent.
  The Turkmen of the steppe between the Caspian and Merv live outside the rule of Khiva and Persia (not shown as states).: Les Turkmènes de la steppe située entre la Caspienne et Merv vivent hors de l’autorité de Khiva et de la Perse (non représentés comme des États).
  An Anglo-Persian force takes Hormuz from the Portuguese; the Kingdom of Ormus ends. The Portuguese fall back on Muscat, the Batinah coast with Sohar, and Musandam; the coast to the west passes to its tribes (not shown as a state), and the Omani imams take Julfar in 1633.: Une force anglo-persane prend Ormuz aux Portugais ; c’est la fin du royaume d’Ormuz. Les Portugais se replient sur Mascate, la côte de la Batinah avec Sohar, et le Musandam ; la côte plus à l’ouest passe à ses tribus (non représentées comme un État), et les imams omanais prennent Julfar en 1633.
  Shah Abbas I takes Kandahar from the Mughals.: Shah Abbas Ier prend Kandahar aux Moghols.
  Shah Abbas I takes Baghdad.: Shah Abbas Ier prend Bagdad.
  Sultan Murad IV retakes Baghdad. The Treaty of Zuhab (1639) leaves Iraq to the Ottomans.: Le sultan Murad IV reprend Bagdad. Le traité de Zuhab (1639) laisse l’Irak aux Ottomans.
  The Mughals regain Kandahar, whose governor goes over to them.: Les Moghols reprennent Kandahar, dont le gouverneur passe de leur côté.
  Shah Abbas II retakes Kandahar; Mughal sieges in 1649, 1652 and 1653 fail.: Shah Abbas II reprend Kandahar ; les sièges moghols de 1649, 1652 et 1653 échouent.
  About 1680. The Dzungar Khanate takes Moghulistan’s lands in Semirechye.: Vers 1680. Le khanat dzoungar s’empare des terres du Moghulistan dans le Semiretchie.
  "Mirwais Hotak leads a revolt in Kandahar and kills the Persian governor: the Hotaki dynasty.": "Mirwais Hotak mène une révolte à Kandahar et tue le gouverneur persan : c’est le début de la dynastie hotaki."
  "Shahrukh Bi, of the Ming clan, makes Ferghana independent of Bukhara: the beginning of the Khanate of Kokand.": "Shahrukh Bi, du clan Ming, rend le Ferghana indépendant de Boukhara : c’est le début du khanat de Kokand."
  The Abdali Afghans take Herat.: Les Afghans abdali prennent Hérat.
  Isfahan surrenders to Mahmud Hotaki after a six-month siege; Shah Sultan Husayn abdicates. The Afghans hold Isfahan, Kerman and, from 1724, Shiraz; Shah Tahmasp II holds out in the north.: Ispahan capitule devant Mahmoud Hotaki après un siège de six mois ; Shah Sultan Husayn abdique. Les Afghans tiennent Ispahan, le Kerman et, à partir de 1724, Chiraz ; Shah Tahmasp II résiste dans le nord.
  Russian troops occupy Gilan during the Russo-Persian War; the Treaty of Saint Petersburg (1723) cedes the Caspian provinces to Russia.: Les troupes russes occupent le Gilan pendant la guerre russo-persane ; le traité de Saint-Pétersbourg (1723) cède les provinces caspiennes à la Russie.
  The Dzungars take Tashkent and Turkestan from the Kazakhs.: Les Dzoungars prennent Tachkent et Turkestan aux Kazakhs.
  The Ottomans take Hamadan and Kermanshah.: Les Ottomans prennent Hamadan et Kermanshah.
  Nader, Tahmasp II’s general, defeats the Afghans at Damghan and Murche-Khort and retakes Isfahan, Fars and Kerman.: Nader, général de Tahmasp II, bat les Afghans à Damghan et à Murche-Khort et reprend Ispahan, le Fars et le Kerman.
  Nader drives the Ottomans out of Hamadan and Kermanshah.: Nader chasse les Ottomans de Hamadan et de Kermanshah.
  Nader takes Herat from the Abdalis. By the Treaty of Rasht Russia returns Gilan.: Nader prend Hérat aux Abdali. Par le traité de Racht, la Russie restitue le Gilan.
  Nader’s son Reza Qoli takes Balkh.: Reza Qoli, fils de Nader, prend Balkh.
  Nader takes Kandahar and ends the Hotaki dynasty; Kabul surrenders in June.: Nader prend Kandahar et met fin à la dynastie hotaki ; Kaboul capitule en juin.
  "Nader Shah is murdered. Ahmad Khan Abdali is chosen shah at Kandahar: the Durrani Empire.": "Nader Shah est assassiné. Ahmad Khan Abdali est choisi comme shah à Kandahar : c’est le début de l’Empire durrani."
  Ahmad Shah Durrani takes Herat. The Afsharid Shahrokh keeps only Khorasan, under Durrani protection; Karim Khan Zand rules western Iran from Shiraz, nominally for a Safavid puppet. Mazandaran and Astarabad are held by the Qajar chief Mohammad Hasan Khan until 1759.: Ahmad Shah Durrani prend Hérat. L’Afcharide Shahrokh ne garde que le Khorassan, sous protection durrani ; Karim Khan Zand gouverne l’ouest de l’Iran depuis Chiraz, nominalement au nom d’un Safavide fantoche. Le Mazandéran et l’Astarabad sont tenus par le chef qadjar Mohammad Hasan Khan jusqu’en 1759.
  Ahmad Shah takes Balkh.: Ahmad Shah prend Balkh.
  The Qing destroy the Dzungar Khanate. Tashkent is ruled by its own hakims (from 1784 by Yunus Khoja), and the Kyrgyz tribes are free of outside rule (neither shown as states).: Les Qing anéantissent le khanat dzoungar. Tachkent est gouvernée par ses propres hakims (à partir de 1784 par Yunus Khoja), et les tribus kirghizes échappent à toute domination extérieure (ni l’une ni les autres ne sont représentées comme des États).
  Ahmad Shah takes Badakhshan.: Ahmad Shah prend le Badakhchan.
  Basra surrenders to the Zand army after a year-long siege.: Bassora capitule devant l’armée zand après un siège d’un an.
  Karim Khan Zand dies. Agha Mohammad Khan Qajar escapes from Shiraz and takes Mazandaran and Gorgan.: Karim Khan Zand meurt. Agha Mohammad Khan Qadjar s’échappe de Chiraz et prend le Mazandéran et le Gorgan.
  Shah Murad of Bukhara, of the Manghit dynasty, takes the title of emir and sacks Merv.: Shah Murad de Boukhara, de la dynastie des Manghit, prend le titre d’émir et met Merv à sac.
  Agha Mohammad Khan makes Tehran his capital; he holds the north and the Jibal.: Agha Mohammad Khan fait de Téhéran sa capitale ; il tient le nord et le Djibal.
  Agha Mohammad Khan enters Shiraz, handed to him by its governor Hajji Ebrahim in 1791; Lotf Ali Khan, the last Zand ruler, holds out in the south-east.: Agha Mohammad Khan entre à Chiraz, que son gouverneur Hajji Ebrahim lui a livrée en 1791 ; Lotf Ali Khan, dernier souverain zand, résiste dans le sud-est.
  Agha Mohammad Khan takes Kerman after a five-month siege and soon captures Lotf Ali Khan at Bam; Qajar Iran.: "Agha Mohammad Khan prend Kerman après un siège de cinq mois et capture bientôt Lotf Ali Khan à Bam : c’est l’Iran qadjar."
  Agha Mohammad Khan takes Mashhad and ends the Afsharids.: Agha Mohammad Khan prend Mechhed et met fin aux Afcharides.
  Alim Khan of Kokand takes Tashkent.: Alim Khan de Kokand prend Tachkent.
  The Durrani Empire breaks up after the Barakzai brothers rebel. Herat stays with Mahmud Shah’s Sadozai line, Kandahar goes to the Barakzai sardars, and Kabul passes to Dost Mohammad Khan in 1826.: L’Empire durrani se disloque après la révolte des frères Barakzai. Hérat reste à la lignée sadozai de Mahmud Shah, Kandahar passe aux sardars barakzai, et Kaboul revient à Dost Mohammad Khan en 1826.
  Murad Beg of Kunduz and the Uzbek khans of Balkh and Maimana break free of Afghan rule.: Murad Beg de Kunduz et les khans ouzbeks de Balkh et de Maimana s’affranchissent de la domination afghane.
  Khiva takes Merv.: Khiva prend Merv.
  Kokand builds forts at Pishpek and Tokmak and takes over the Chuy valley.: Kokand construit des forts à Pichpek et à Tokmak et prend le contrôle de la vallée de la Tchouï.
  Dost Mohammad retakes Balkh.: Dost Mohammad reprend Balkh.
  Dost Mohammad takes Kandahar.: Dost Mohammad prend Kandahar.
  Persian troops take Herat. The Anglo-Persian War follows, and by the Treaty of Paris (March 1857) Persia withdraws.: Les troupes persanes prennent Hérat. La guerre anglo-persane s’ensuit et, par le traité de Paris (mars 1857), la Perse se retire.
  The Tekke Turkmen take Merv from Khiva.: Les Turkmènes Tekke prennent Merv à Khiva.
  Persia hands Herat back to its own ruler.: La Perse rend Hérat à son propre souverain.
  Afghan forces take Kunduz and Badakhshan.: Les forces afghanes prennent Kunduz et le Badakhchan.
  Russian troops take Pishpek and Tokmak from Kokand; the Issyk-Kul Kyrgyz accept Russian rule.: Les troupes russes prennent Pichpek et Tokmak à Kokand ; les Kirghizes de l’Issyk-Koul acceptent la domination russe.
  Dost Mohammad takes Herat, shortly before his death.: Dost Mohammad prend Hérat, peu avant sa mort.
  Russia takes Aulie-Ata and the Talas valley.: La Russie prend Aulie-Ata et la vallée du Talas.
  General Chernyayev takes Tashkent from Kokand.: Le général Tcherniaïev prend Tachkent à Kokand.
  Persia takes Sistan; the Goldsmid arbitration (1872) divides Sistan, leaving the Helmand delta’s west bank to Persia.: La Perse prend le Sistan ; l’arbitrage de Goldsmid (1872) partage le Sistan et laisse à la Perse la rive occidentale du delta de l’Helmand.
  Russia takes Khujand, Ura-Tyube and Jizzakh.: La Russie prend Khodjent, Oura-Tioubé et Djizak.
  Russia takes Samarkand. The emir of Bukhara becomes a Russian vassal (formally a protectorate from 1873).: La Russie prend Samarcande. L’émir de Boukhara devient vassal de la Russie (officiellement sous protectorat à partir de 1873).
  Russia builds a fort at Naryn.: La Russie construit un fort à Naryn.
  Russia founds Krasnovodsk on the Caspian.: La Russie fonde Krasnovodsk sur la Caspienne.
  "Treaty of Gandomian: Khiva becomes a Russian protectorate and cedes the right bank of the Amu Darya.": "Traité de Gandomian : Khiva devient un protectorat russe et cède la rive droite de l’Amou-Daria."
  Russia annexes the Khanate of Kokand as the Fergana oblast.: La Russie annexe le khanat de Kokand, qui devient l’oblast de Ferghana.
  Russian troops under Skobelev storm Geok Tepe; the Ahal Tekke oasis is annexed, and the Akhal-Khorasan treaty (December 1881) fixes the border with Persia.: Les troupes russes de Skobelev prennent d’assaut Geok Tepe ; l’oasis d’Ahal Tekke est annexée, et le traité d’Akhal-Khorasan (décembre 1881) fixe la frontière avec la Perse.
  Afghanistan occupies Shughnan and Roshan in the western Pamirs.: L’Afghanistan occupe le Chougnan et le Rochan, dans le Pamir occidental.
  Merv submits to Russia.: Merv se soumet à la Russie.
  "The Anglo-Russian Pamir agreement fixes the Panj as the border: the lands north of it go to Russia and Bukhara, and the Wakhan corridor to Afghanistan.": "L’accord anglo-russe sur le Pamir fixe la frontière sur le Piandj : les terres situées au nord du fleuve reviennent à la Russie et à Boukhara, et le corridor du Wakhan à l’Afghanistan."
  The Turkestan Autonomous Soviet Socialist Republic is proclaimed in Tashkent, within Soviet Russia; the fighting with the Kokand Autonomy, the Basmachi and the Transcaspian government is drawn in the wars’ steps.: La République socialiste soviétique autonome du Turkestan est proclamée à Tachkent, au sein de la Russie soviétique ; les combats contre l’autonomie de Kokand, les Basmatchis et le gouvernement transcaspien sont représentés dans les étapes des guerres correspondantes.
  At San Remo the Allies give Britain the mandate for Iraq, made up of the Ottoman provinces of Baghdad, Basra and Mosul; Turkey renounces Mosul in 1926.: À San Remo, les Alliés confient à la Grande-Bretagne le mandat sur l’Irak, formé des provinces ottomanes de Bagdad, de Bassora et de Mossoul ; la Turquie renonce à Mossoul en 1926.
  The Khan of Khiva has abdicated (February); the Khorezm People’s Soviet Republic is proclaimed.: Le khan de Khiva a abdiqué (février) ; la République soviétique populaire du Khorezm est proclamée.
  After the Red Army takes Bukhara (2 September) the Bukharan People’s Soviet Republic is proclaimed.: Après la prise de Boukhara par l’Armée rouge (2 septembre), la République soviétique populaire de Boukhara est proclamée.
  "The national delimitation of Soviet Central Asia: the people’s republics of Khorezm and Bukhara are dissolved, and the Uzbek and Turkmen SSRs and the Tajik and Kirghiz autonomous regions are formed within the Soviet Union.": "La délimitation nationale de l’Asie centrale soviétique : les républiques populaires du Khorezm et de Boukhara sont dissoutes, et les RSS ouzbèke et turkmène ainsi que les régions autonomes tadjike et kirghize sont créées au sein de l’Union soviétique."
  About 800. The Abbasid caliphs send governors to the Hejaz, Yemen and Bahrayn (eastern Arabia). Oman is ruled by its Ibadi imams; Najd, Asir, Dhofar and Hadramawt are tribal lands outside any state.: Vers 800. Les califes abbassides envoient des gouverneurs au Hedjaz, au Yémen et au Bahrayn (l’Arabie orientale). Oman est gouverné par ses imams ibadites ; le Nejd, l’Asir, le Dhofar et l’Hadramaout sont des terres tribales hors de tout État.
  Muhammad ibn Ziyad, sent by the caliph al-Ma’mun against rebels in the Tihama, founds Zabid (820). His Ziyadid dynasty rules the Tihama and the south of Yemen in the caliph’s name.: Muhammad ibn Ziyad, envoyé par le calife al-Ma’mun contre des rebelles de la Tihama, fonde Zabid (820). Sa dynastie, celle des Ziyadides, gouverne la Tihama et le sud du Yémen au nom du calife.
  Yu’fir ibn Abd al-Rahman takes Sanaa. His Yufirid dynasty rules the Yemeni highlands, at times recognising the Abbasids.: Yu’fir ibn Abd al-Rahman prend Sanaa. Sa dynastie, celle des Yufirides, règne sur les hautes terres du Yémen et reconnaît par moments les Abbassides.
  An Abbasid army under Muhammad ibn Nur takes Oman from the Ibadi imams.: Une armée abbasside menée par Muhammad ibn Nur prend Oman aux imams ibadites.
  Yahya ibn al-Husayn, al-Hadi ila’l-Haqq, founds the Zaydi imamate at Sa’da in northern Yemen.: Yahya ibn al-Husayn, al-Hadi ila’l-Haqq, fonde l’imamat zaydite à Saada, dans le nord du Yémen.
  Abu Sa’id al-Jannabi founds a Qarmatian state in Bahrayn, eastern Arabia, with its capital at al-Ahsa from the 920s. The desert coast to the north, today’s Kuwait, is tribal land (not shown as a state).: Abu Sa’id al-Jannabi fonde un État qarmate au Bahrayn, en Arabie orientale, avec pour capitale al-Hassa à partir des années 920. La côte désertique plus au nord, l’actuel Koweït, est une terre tribale (non représentée comme un État).
  "Ja’far ibn Muhammad al-Hasani takes Mecca: the beginning of the Sharifate of Mecca, which recognises the Fatimids from 969.": "Ja’far ibn Muhammad al-Hasani prend La Mecque : c’est le début du chérifat de La Mecque, qui reconnaît les Fatimides à partir de 969."
  A Buyid expedition takes Oman.: Une expédition bouyide prend Oman.
  The Yufirid dynasty of Sanaa comes to an end; the Zaydi imams and local rulers contend for the highlands.: La dynastie yufiride de Sanaa prend fin ; les imams zaydites et des souverains locaux se disputent les hautes terres.
  "Najah, a former slave commander, takes Zabid from the slave regents who had ruled since the last Ziyadid died in 1018: the Najahid dynasty rules the Tihama.": "Najah, ancien chef militaire esclave, prend Zabid aux régents esclaves qui gouvernaient depuis la mort du dernier Ziyadide en 1018 : la dynastie najahide règne sur la Tihama."
  Ali ibn Muhammad al-Sulayhi, an Ismaili missionary, rises against the Zaydis in the Haraz mountains west of Sanaa and founds the Sulayhid dynasty, which unites most of Yemen by 1063.: Ali ibn Muhammad al-Sulayhi, missionnaire ismaélien, se soulève contre les Zaydites dans les monts Haraz, à l’ouest de Sanaa, et fonde la dynastie sulayhide, qui unifie la plus grande partie du Yémen en 1063.
  Ali al-Sulayhi, who had Najah poisoned in 1060, takes Zabid and the Tihama; by 1063 Aden accepts his rule.: Ali al-Sulayhi, qui avait fait empoisonner Najah en 1060, prend Zabid et la Tihama ; en 1063, Aden accepte son autorité.
  About 1065. Qavurt, the Seljuk ruler of Kerman, conquers Oman.: Vers 1065. Qavurt, souverain seldjoukide du Kerman, conquiert Oman.
  Abd Allah ibn Ali al-Uyuni, with Seljuk help, overthrows the Qarmatians of Bahrayn and founds the Uyunid emirate.: Abd Allah ibn Ali al-Uyuni, avec l’aide des Seldjoukides, renverse les Qarmates du Bahrayn et fonde l’émirat uyunide.
  Jayyash, a son of Najah, returns from exile and retakes Zabid; the Najahids rule the Tihama again.: Jayyash, fils de Najah, revient d’exil et reprend Zabid ; les Najahides règnent de nouveau sur la Tihama.
  Hatim ibn al-Ghashim, a Hamdani chief, takes power in Sanaa, left to Hamdani governors since the Sulayhids moved to Jibla; his Hatimid sultans rule Sanaa and the north.: Hatim ibn al-Ghashim, chef hamdani, prend le pouvoir à Sanaa, laissée à des gouverneurs hamdanis depuis l’installation des Sulayhides à Jibla ; ses descendants, les sultans hatimides, règnent sur Sanaa et le nord.
  Queen Arwa, the last Sulayhid ruler, dies. The Zurayids of Aden take over her lands around Ta’izz and Jibla, and the Hatimid sultans of Sanaa the rest of the highlands.: La reine Arwa, dernière souveraine sulayhide, meurt. Les Zurayides d’Aden reprennent ses terres autour de Taëz et de Jibla, et les sultans hatimides de Sanaa le reste des hautes terres.
  About 1154. The Nabhani dynasty takes power in Oman.: Vers 1154. La dynastie des Nabhanides prend le pouvoir à Oman.
  "Ali ibn Mahdi takes Zabid and ends the Najahids: the Mahdids.": "Ali ibn Mahdi prend Zabid et met fin aux Najahides : ce sont les Mahdides."
  Saladin’s brother Turan-Shah conquers Zabid and Aden, and the Hejaz comes under Ayyubid overlordship; Sanaa follows in 1175.: Turan-Shah, frère de Saladin, conquiert Zabid et Aden, et le Hedjaz passe sous la suzeraineté ayyoubide ; Sanaa suit en 1175.
  "Umar ibn Rasul, the Ayyubids’ governor, makes himself sultan of Yemen: the Rasulids.": "Umar ibn Rasul, gouverneur des Ayyoubides, se proclame sultan du Yémen : ce sont les Rassoulides."
  After the end of the Ayyubids in Egypt the sharifs of Mecca rule the Hejaz on their own, under Rasulid influence.: Après la fin des Ayyoubides en Égypte, les chérifs de La Mecque gouvernent le Hedjaz pour leur propre compte, sous influence rassoulide.
  The Usfurids, a branch of the Banu Uqayl, replace the Uyunids in eastern Arabia.: Les Usfurides, une branche des Banu Uqayl, remplacent les Uyunides en Arabie orientale.
  The Mamluk sultan Baybars, on pilgrimage, makes the Hejaz a Mamluk dependency.: Le sultan mamelouk Baybars, en pèlerinage, fait du Hedjaz une dépendance mamelouke.
  The Rasulids conquer Dhofar.: Les Rassoulides conquièrent le Dhofar.
  About 1320. Hormuz rules the Omani coast, from Qalhat to Musandam, and Julfar.: Vers 1320. Ormuz domine la côte omanaise, de Qalhat au Musandam, ainsi que Julfar.
  The Bahrain islands become tributary to the kings of Hormuz.: Les îles de Bahreïn deviennent tributaires des rois d’Ormuz.
  About 1395. The Kathiri sultans take power in Hadramawt.: Vers 1395. Les sultans kathiri prennent le pouvoir dans l’Hadramaout.
  About 1414. The Kathiri sultan Ali ibn Umar takes Dhofar from its Rasulid rulers; the Kathiri hold it, with interruptions, until the Omani conquest of 1829.: Vers 1414. Le sultan kathiri Ali ibn Umar prend le Dhofar à ses souverains rassoulides ; les Kathiri le tiennent, avec des interruptions, jusqu’à la conquête omanaise de 1829.
  About 1417. The Jabrids, a Bedouin family of the Banu Uqayl, take over eastern Arabia.: Vers 1417. Les Jabrides, famille bédouine des Banu Uqayl, prennent le contrôle de l’Arabie orientale.
  The Mahri Ba Dujana family take the port of Shihr; their Mahra Sultanate, later centred on Qishn and Socotra, rules the Mahra coast.: La famille mahri des Ba Dujana prend le port de Shihr ; son sultanat de Mahra, centré plus tard sur Qishn et Socotra, règne sur la côte du Mahra.
  The Tahirids, a local family of Rada’a, replace the Rasulids; the Zaydi imams hold the northern highlands and Sanaa.: Les Tahirides, famille locale de Rada’a, remplacent les Rassoulides ; les imams zaydites tiennent les hautes terres du nord et Sanaa.
  About 1485. The Jabrids take Bahrain from the kings of Hormuz.: Vers 1485. Les Jabrides prennent Bahreïn aux rois d’Ormuz.
  A Mamluk expedition ends the Tahirids in the Tihama; when the Mamluk sultanate falls to the Ottomans the same year, its commanders in Yemen recognise the Ottoman sultan. The sharif of Mecca sends the keys of the holy cities to Selim I.: Une expédition mamelouke met fin aux Tahirides dans la Tihama ; lorsque le sultanat mamelouk tombe aux mains des Ottomans la même année, ses chefs militaires au Yémen reconnaissent le sultan ottoman. Le chérif de La Mecque envoie les clés des villes saintes à Sélim Ier.
  The Portuguese and Hormuz take Bahrain from the Jabrids.: Les Portugais et Ormuz prennent Bahreïn aux Jabrides.
  An Ottoman fleet takes Aden from the last Tahirids; Zabid, held by the former Mamluk commanders, comes under direct Ottoman rule in 1539.: Une flotte ottomane prend Aden aux derniers Tahirides ; Zabid, tenue par les anciens chefs mamelouks, passe sous administration ottomane directe en 1539.
  The Ottomans take Sanaa.: Les Ottomans prennent Sanaa.
  The Ottomans take al-Hasa (Lahsa eyalet).: Les Ottomans prennent al-Hassa (eyalet de Lahsa).
  Shah Abbas I takes Bahrain from the Portuguese.: Shah Abbas Ier prend Bahreïn aux Portugais.
  "Nasir ibn Murshid is elected imam: the Ya’ariba dynasty begins to unite Oman. The Portuguese still hold Muscat, Sohar and the coast.": "Nasir ibn Murshid est élu imam : la dynastie des Ya’ariba commence à unifier Oman. Les Portugais tiennent encore Mascate, Sohar et la côte."
  The Zaydi imam al-Mu’ayyad Muhammad drives the last Ottoman troops from Yemen; the Qasimid imamate rules all of Yemen.: L’imam zaydite al-Mu’ayyad Muhammad chasse du Yémen les dernières troupes ottomanes ; l’imamat qasimide règne sur tout le Yémen.
  The Omanis take Sohar from the Portuguese.: Les Omanais prennent Sohar aux Portugais.
  Imam Sultan ibn Saif takes Muscat; the Portuguese leave Oman.: L’imam Sultan ibn Saif prend Mascate ; les Portugais quittent Oman.
  The Qasimid imams of Yemen take Hadramawt (until the early 18th century).: Les imams qasimides du Yémen prennent l’Hadramaout (jusqu’au début du XVIIIe siècle).
  Barrak ibn Ghurayr of the Banu Khalid drives the Ottomans from al-Hasa; the Banu Khalid also rule the coast to the north, where Kuwait is founded.: Barrak ibn Ghurayr, des Banu Khalid, chasse les Ottomans d’al-Hassa ; les Banu Khalid règnent aussi sur la côte plus au nord, où est fondée la ville de Koweït.
  About 1705. The Kathiri sultans regain Hadramawt.: Vers 1705. Les sultans kathiri reprennent l’Hadramaout.
  The Omanis take Bahrain from Persia.: Les Omanais prennent Bahreïn à la Perse.
  The Abdali sultan of Lahej breaks away from the Zaydi imams and takes Aden (about 1731).: Le sultan abdali de Lahej rompt avec les imams zaydites et prend Aden (vers 1731).
  Nader takes Bahrain for Persia.: Nader prend Bahreïn pour le compte de la Perse.
  Nader’s army, called in by one side of the Omani civil war, holds Muscat and the coast.: L’armée de Nader, appelée par l’un des camps de la guerre civile omanaise, tient Mascate et la côte.
  "Muhammad ibn Saud and the preacher Muhammad ibn Abd al-Wahhab make their pact at Diriyah: the first Saudi state.": "Muhammad ibn Saoud et le prédicateur Muhammad ibn Abd al-Wahhab concluent leur pacte à Diriyah : c’est le premier État saoudien."
  "Ahmad ibn Sa’id, governor of Sohar, drives out the Persians and is elected imam (1749): the Al Bu Sa’id dynasty. The Qawasim rule the coast from Ras al-Khaimah to Sharjah; the Bani Yas tribes the land behind it (not shown as a state).": "Ahmad ibn Sa’id, gouverneur de Sohar, chasse les Persans et est élu imam (1749) : c’est la dynastie des Al Bu Sa’id. Les Qawasim tiennent la côte, de Ras el Khaïmah à Charjah, et les tribus Bani Yas l’arrière-pays (non représenté comme un État)."
  The Al Sabah family become rulers of Kuwait.: Les Al Sabah deviennent les souverains du Koweït.
  The Al Khalifa of Zubarah and their allies take Bahrain from Persia.: Les Al Khalifa de Zubarah et leurs alliés prennent Bahreïn à la Perse.
  About 1786. The first Saudi state rules most of Najd.: Vers 1786. Le premier État saoudien règne sur la plus grande partie du Nejd.
  The Saudis defeat the Banu Khalid and take al-Hasa.: Les Saoudiens battent les Banu Khalid et prennent al-Hassa.
  The Saudis take Mecca (and Medina in 1805); the Asir highlands join them.: Les Saoudiens prennent La Mecque (et Médine en 1805) ; les hautes terres de l’Asir se rallient à eux.
  An Egyptian army sent by Muhammad Ali retakes Medina (and Mecca and Taif in January 1813) for the Ottomans.: Une armée égyptienne envoyée par Méhémet Ali reprend Médine (ainsi que La Mecque et Taïf en janvier 1813) pour le compte des Ottomans.
  Ibrahim Pasha takes Diriyah and ends the first Saudi state. Egyptian troops hold Najd until 1824 (not shown), and the Banu Khalid return to al-Hasa under Egyptian protection.: Ibrahim Pacha prend Diriyah et met fin au premier État saoudien. Les troupes égyptiennes tiennent le Nejd jusqu’en 1824 (ce qui n’est pas représenté), et les Banu Khalid reviennent à al-Hassa sous protection égyptienne.
  "The General Maritime Treaty: after a British campaign against the Qawasim, the sheikhs of the coast make treaties with Britain, the Trucial States.": "Le traité maritime général : après une campagne britannique contre les Qawasim, les cheikhs de la côte concluent des traités avec la Grande-Bretagne ; ce sont les États de la Trêve."
  "Turki ibn Abdullah retakes Riyadh: the second Saudi state, the Emirate of Nejd.": "Turki ibn Abdullah reprend Riyad : c’est le deuxième État saoudien, l’émirat du Nejd."
  Sa’id ibn Sultan of Muscat takes Dhofar.: Sa’id ibn Sultan de Mascate prend le Dhofar.
  The Saudis take al-Hasa again.: Les Saoudiens reprennent al-Hassa.
  "Abdullah ibn Rashid takes power in Ha’il: the Rashidi emirate of Jabal Shammar.": "Abdullah ibn Rashid prend le pouvoir à Haïl : c’est l’émirat rachidite du Djebel Shammar."
  British forces take Aden, which is governed from British India.: Les forces britanniques prennent Aden, qui est administrée depuis l’Inde britannique.
  The Ottomans return to the Tihama.: Les Ottomans reviennent dans la Tihama.
  Britain recognises Muhammad ibn Thani as ruler of Qatar.: La Grande-Bretagne reconnaît Muhammad ibn Thani comme souverain du Qatar.
  Midhat Pasha’s expedition takes al-Hasa and Qatar for the Ottomans, during a Saudi civil war; Asir follows.: L’expédition de Midhat Pacha prend al-Hassa et le Qatar pour le compte des Ottomans, en pleine guerre civile saoudienne ; l’Asir suit.
  The Ottomans take Sanaa; the Zaydi imams keep the far north.: Les Ottomans prennent Sanaa ; les imams zaydites gardent l’extrême nord.
  "About 1886–1888. Britain makes protection treaties with the sultans of the Aden hinterland, Mahra and Hadramawt: the Aden Protectorate.": "Vers 1886–1888. La Grande-Bretagne conclut des traités de protection avec les sultans de l’arrière-pays d’Aden, du Mahra et de l’Hadramaout : c’est le protectorat d’Aden."
  The Rashidis defeat the Saudis at Mulayda and take Riyadh and Qasim; the Saudi family goes into exile in Kuwait.: Les Rachidites battent les Saoudiens à Mulayda et prennent Riyad et le Qasim ; la famille saoudienne part en exil au Koweït.
  Abdulaziz ibn Saud retakes Riyadh.: Abdelaziz ibn Saoud reprend Riyad.
  Ibn Saud wins Qasim after the Battle of Rawdat Muhanna.: Ibn Saoud s’empare du Qasim après la bataille de Rawdat Muhanna.
  Ibn Saud takes al-Hasa from the Ottomans; the Anglo-Ottoman Convention (July 1913) renounces Ottoman claims to Qatar.: Ibn Saoud prend al-Hassa aux Ottomans ; par la convention anglo-ottomane (juillet 1913), les Ottomans renoncent à leurs prétentions sur le Qatar.
  Sharif Hussein of Mecca begins the Arab Revolt and takes Mecca, Jeddah and Taif; he is recognised as King of the Hejaz.: Le chérif Hussein de La Mecque déclenche la révolte arabe et prend La Mecque, Djeddah et Taïf ; il est reconnu roi du Hedjaz.
  Armistice of Mudros. The Ottomans leave Yemen, where Imam Yahya founds the Mutawakkilite Kingdom, and Asir, where the Idrisid emir rules the Tihama and the Al Aid emirs the highlands around Abha (not shown as a state); Arab forces hold Tabuk.: Armistice de Moudros. Les Ottomans quittent le Yémen, où l’imam Yahya fonde le royaume mutawakkilite, et l’Asir, où l’émir idrisside règne sur la Tihama et les émirs Al Aid sur les hautes terres autour d’Abha (non représentées comme un État) ; les forces arabes tiennent Tabouk.
  The Ottoman garrison of Medina, besieged since 1916, surrenders.: La garnison ottomane de Médine, assiégée depuis 1916, se rend.
  Ibn Saud’s forces defeat Hasan ibn Aid, emir of highland Asir, and take Abha; a settlement in August leaves the Tihama tribes to the Idrisid emir.: Les forces d’Ibn Saoud battent Hasan ibn Aid, émir de l’Asir montagneux, et prennent Abha ; un accord conclu en août laisse les tribus de la Tihama à l’émir idrisside.
  Britain leaves Hodeidah, which it has occupied since the war, and hands it to the Idrisid emir of Asir.: La Grande-Bretagne quitte Hodeïda, qu’elle occupait depuis la guerre, et la remet à l’émir idrisside de l’Asir.
  Ibn Saud takes Ha’il and ends the Rashidi emirate.: Ibn Saoud prend Haïl et met fin à l’émirat rachidite.
  Imam Yahya’s forces take Hodeidah from the Idrisids.: Les forces de l’imam Yahya prennent Hodeïda aux Idrissides.
  "Jeddah surrenders to Ibn Saud, after Mecca (October 1924) and Medina (December 1925): the end of the Kingdom of Hejaz.": "Djeddah se rend à Ibn Saoud, après La Mecque (octobre 1924) et Médine (décembre 1925) : c’est la fin du royaume du Hedjaz."
  Ibn Saud takes over the government of the Idrisid emirate of Asir, a Saudi protectorate since 1926; it is formally annexed in 1934.: Ibn Saoud prend en main le gouvernement de l’émirat idrisside de l’Asir, protectorat saoudien depuis 1926 ; l’émirat est officiellement annexé en 1934.
  "Treaty of Taif after the Saudi–Yemeni War: Najran and Jizan stay Saudi.": "Traité de Taïf, après la guerre saoudo-yéménite : Najran et Jizan restent saoudiens."
  Britain leaves Aden; the People’s Republic of South Yemen becomes independent.: La Grande-Bretagne quitte Aden ; la République populaire du Yémen du Sud devient indépendante.
  Six of the Trucial States form the United Arab Emirates; Ras al-Khaimah joins on 10 February 1972.: Six des États de la Trêve forment les Émirats arabes unis ; Ras el Khaïmah les rejoint le 10 février 1972.
  Ras al-Khaimah joins the United Arab Emirates.: Ras el Khaïmah rejoint les Émirats arabes unis.
  North and South Yemen unite as the Republic of Yemen.: Le Yémen du Nord et le Yémen du Sud s’unissent pour former la République du Yémen.
  About 800. The Abbasid Caliphate holds Sind and Multan, and the Turk Shahis rule Gandhara from Kabul. In the north the Pala Empire of Bengal is overlord of Kannauj, whose king Chakrayudha it has installed; the Gurjara-Pratiharas rule Malwa and Rajasthan, and the Rashtrakutas the Deccan. The Pallavas, Pandyas and Chera Perumals share the south, and the Anuradhapura kingdom rules Sri Lanka. Hill and forest peoples in the north-east, the Kirat hills and western Nepal, the Thar and Kutch are outside any state, and the eastern Punjab and south-eastern Bengal are divided among small kingdoms (not shown as states).: Vers 800. Le califat abbasside tient le Sind et Multan, et les Shahis turcs gouvernent le Gandhara depuis Kaboul. Au nord, l’Empire pala du Bengale est le suzerain de Kannauj, dont il a installé le roi, Chakrayudha ; les Gurjara-Pratihara gouvernent le Malwa et le Rajasthan, et les Rashtrakuta le Dekkan. Les Pallava, les Pandya et les Chera Perumal se partagent le sud, et le royaume d’Anuradhapura gouverne le Sri Lanka. Les peuples des collines et des forêts du nord-est, des collines kirat et de l’ouest du Népal, du Thar et du Kutch échappent à tout État, et l’est du Pendjab et le sud-est du Bengale sont partagés entre de petits royaumes (non représentés comme des États).
  About 816. The Pratihara king Nagabhata II takes Kannauj from Chakrayudha and makes it his capital.: Vers 816. Le roi pratihara Nagabhata II prend Kannauj à Chakrayudha et en fait sa capitale.
  The Tibetan Empire breaks up after the death of Langdarma. Its outposts in Baltistan, Gilgit and the Bhutanese valleys fall to local rulers (not shown as states).: L’Empire tibétain se disloque après la mort de Langdarma. Ses avant-postes du Baltistan, de Gilgit et des vallées bhoutanaises tombent aux mains de souverains locaux (non représentés comme des États).
  "About 848. Vijayalaya Chola takes Thanjavur from the Muttaraiyar chiefs, vassals of the Pallavas: the beginning of the Chola kingdom.": "Vers 848. Vijayalaya Chola prend Thanjavur aux chefs muttaraiyar, vassaux des Pallava : c’est le début du royaume chola."
  About 850. Mihira Bhoja extends Pratihara rule over the middle Ganges plain to Varanasi and Gorakhpur.: Vers 850. Mihira Bhoja étend la domination pratihara sur la moyenne plaine du Gange, jusqu’à Varanasi et Gorakhpur.
  About 855. As Abbasid authority fades, the Habbarids rule Sind from Mansura as independent emirs, and the Banu Munabbih rule Multan. Makran and Turan pass to local emirs (not shown as states).: Vers 855. Tandis que l’autorité abbasside s’efface, les Habbarides gouvernent le Sind depuis Mansura en émirs indépendants, et les Banu Munabbih gouvernent Multan. Le Makran et le Turan passent à des émirs locaux (non représentés comme des États).
  Ya’qub the Saffarid kills the Zunbil of Zabulistan; the Saffarids take Arachosia, with Pishin and the Quetta valley.: Ya’qub le Saffaride tue le Zunbil du Zaboulistan ; les Saffarides prennent l’Arachosie, avec Pishin et la vallée de Quetta.
  Aditya I Chola defeats the Pallava king Aparajita and annexes Tondaimandalam, the Pallava land around Kanchipuram.: Aditya Ier Chola bat le roi pallava Aparajita et annexe le Tondaimandalam, le pays pallava autour de Kanchipuram.
  Ismail the Samanid defeats and captures the Saffarid Amr ibn al-Layth; Arachosia, with Pishin and Quetta, falls to local rulers (not shown as states).: Ismaïl le Samanide bat et capture le Saffaride Amr ibn al-Layth ; l’Arachosie, avec Pishin et Quetta, tombe aux mains de souverains locaux (non représentés comme des États).
  About 910. Parantaka I Chola defeats the Pandyas and takes Madurai; Kongu follows.: Vers 910. Parantaka Ier Chola bat les Pandya et prend Madurai ; le Kongu suit.
  "About 930. The Chandra dynasty of Harikela rules eastern Bengal: Samatata, Vanga and Srihatta (Sylhet).": "Vers 930. La dynastie Chandra du Harikela gouverne l’est du Bengale : le Samatata, le Vanga et le Srihatta (Sylhet)."
  About 940. The Somavamshi king Yayati I unites Utkala (coastal Odisha) with his kingdom of Kosala; the Bhauma-Kara dynasty has ended.: Vers 940. Le roi somavamshi Yayati Ier unit l’Utkala (la côte de l’Odisha) à son royaume du Kosala ; la dynastie Bhauma-Kara a pris fin.
  Mularaja founds the Chaulukya (Solanki) kingdom at Anahilavada, in northern Gujarat.: Mularaja fonde le royaume chaulukya (solanki) à Anahilavada, dans le nord du Goujarat.
  Battle of Takkolam. The Rashtrakuta king Krishna III defeats the Cholas and takes Tondaimandalam.: Bataille de Takkolam. Le roi rashtrakuta Krishna III bat les Chola et prend le Tondaimandalam.
  About 950. Ladakh becomes a kingdom of its own (Maryul) under a dynasty founded by Nyima-Gon. The Chandelas of Jejakabhukti, at Khajuraho and Kalinjar, throw off Pratihara overlordship; the Chahamanas of Naddula hold southern Marwar and the Bhatis the desert around Lodurva. In Saurashtra the Chudasamas rule from Vamanasthali (Junagadh).: Vers 950. Le Ladakh devient un royaume à part entière (Maryul) sous une dynastie fondée par Nyima-Gon. Les Chandela de Jejakabhukti, à Khajuraho et Kalinjar, rejettent la suzeraineté pratihara ; les Chahamana de Naddula tiennent le sud du Marwar et les Bhati le désert autour de Lodurva. Au Saurashtra, les Chudasama gouvernent depuis Vamanasthali (Junagadh).
  About 965. Jayapala, the Hindu Shahi king, rules from Kabul to the Beas.: Vers 965. Jayapala, le roi shahi hindou, règne de Kaboul à la Beas.
  About 970. The Cholas under Sundara Chola retake Tondaimandalam from the Rashtrakutas.: Vers 970. Les Chola, sous Sundara Chola, reprennent le Tondaimandalam aux Rashtrakuta.
  About 972. Siyaka, the Paramara king of Malwa and a Rashtrakuta vassal, sacks the Rashtrakuta capital Manyakheta; the Paramaras become independent.: Vers 972. Siyaka, roi paramara du Malwa et vassal des Rashtrakuta, met à sac la capitale rashtrakuta, Manyakheta ; les Paramara deviennent indépendants.
  Tailapa II overthrows the last Rashtrakuta king. His Western Chalukya (Kalyani Chalukya) Empire takes over the Deccan; the Paramaras take the land south of the Narmada.: Tailapa II renverse le dernier roi rashtrakuta. Son Empire chalukya occidental (ou des Chalukya de Kalyani) prend le contrôle du Dekkan ; les Paramara prennent les terres au sud de la Narmada.
  Sabuktigin succeeds at Ghazni and takes Bost and Kandahar; the Ghaznavids hold Pishin and the Quetta valley.: Sabuktigin prend la succession à Ghazni et s’empare de Bost et de Kandahar ; les Ghaznévides tiennent Pishin et la vallée de Quetta.
  About 990. The Chaulukyas extend their rule to Lata, southern Gujarat.: Vers 990. Les Chaulukya étendent leur domination au Lata, le sud du Goujarat.
  Rajaraja I Chola invades Sri Lanka and takes Anuradhapura; the north of the island becomes a Chola province. The Sinhalese king Mahinda V holds out in the south-east (Ruhuna).: Rajaraja Ier Chola envahit le Sri Lanka et prend Anuradhapura ; le nord de l’île devient une province chola. Le roi cinghalais Mahinda V résiste dans le sud-est (Ruhuna).
  About 1000. The Kalachuris of Ratanpur, a branch of the Kalachuris of Tripuri, rule Dakshina Kosala (Chhattisgarh).: Vers 1000. Les Kalachuri de Ratanpur, une branche des Kalachuri de Tripuri, gouvernent le Dakshina Kosala (Chhattisgarh).
  Mahmud of Ghazni defeats the Hindu Shahi king Jayapala near Peshawar and takes Gandhara.: Mahmoud de Ghazni bat le roi shahi hindou Jayapala près de Peshawar et prend le Gandhara.
  Rajaraja I Chola takes Talakad and the Ganga country (Gangavadi), southern Karnataka.: Rajaraja Ier Chola prend Talakad et le pays ganga (Gangavadi), dans le sud du Karnataka.
  Mahmud of Ghazni annexes Multan from its Ismaili ruler Abu’l-Fath Daud.: Mahmoud de Ghazni annexe Multan, qu’il enlève à son souverain ismaélien, Abu’l-Fath Daud.
  Rajendra I Chola completes the conquest of Sri Lanka and carries off King Mahinda V.: Rajendra Ier Chola achève la conquête du Sri Lanka et emmène le roi Mahinda V en captivité.
  About 1021. With the death of Trilochanapala the Hindu Shahi kingdom ends; Mahmud of Ghazni annexes the Punjab, with Lahore.: Vers 1021. Avec la mort de Trilochanapala, le royaume shahi hindou prend fin ; Mahmoud de Ghazni annexe le Pendjab, avec Lahore.
  Returning from Somnath, Mahmud of Ghazni deposes the Habbarid emir of Mansura. In Sind the Soomras take power, at first under Ghaznavid overlordship.: De retour de Somnath, Mahmoud de Ghazni dépose l’émir habbaride de Mansura. Au Sind, les Soomra prennent le pouvoir, d’abord sous la suzeraineté ghaznévide.
  About 1029. Sinhalese princes regain Ruhuna, the south and east of Sri Lanka, from the Cholas.: Vers 1029. Des princes cinghalais reprennent aux Chola le Ruhuna, le sud et l’est du Sri Lanka.
  About 1036. The Pratihara kingdom of Kannauj comes to an end. The Kalachuri king Gangeyadeva holds Varanasi and Prayaga; the rest of the Ganges plain is divided among minor rulers (not shown as states).: Vers 1036. Le royaume pratihara de Kannauj prend fin. Le roi kalachuri Gangeyadeva tient Varanasi et Prayaga ; le reste de la plaine du Gange est partagé entre des souverains mineurs (non représentés comme des États).
  About 1070. The Sena dynasty rises in Radha, western Bengal, under Samantasena and Vijayasena. Kulottunga I unites the Eastern Chalukya kingdom of Vengi with the Chola Empire.: Vers 1070. La dynastie Sena s’élève dans le Radha, l’ouest du Bengale, sous Samantasena et Vijayasena. Kulottunga Ier unit le royaume chalukya oriental de Vengi à l’Empire chola.
  Vijayabahu I takes Polonnaruwa and drives the Cholas out of Sri Lanka.: Vijayabahu Ier prend Polonnaruwa et chasse les Chola du Sri Lanka.
  About 1080. The Varman dynasty succeeds the Chandras in Vanga, eastern Bengal.: Vers 1080. La dynastie Varman succède aux Chandra au Vanga, dans l’est du Bengale.
  About 1090. Chandradeva founds the Gahadavala kingdom at Kannauj and Varanasi.: Vers 1090. Chandradeva fonde le royaume gahadavala à Kannauj et Varanasi.
  Nanyadeva founds the Karnat dynasty of Mithila at Simraungadh, in the Terai.: Nanyadeva fonde la dynastie Karnat de Mithila à Simraungadh, dans le Teraï.
  "About 1100. The Katyuri kingdom breaks up: Kumaon passes to the Chand rajas, and Garhwal is divided among many chiefs (not shown as states). The Pala dynasty of Kamarupa ends; Upper Assam falls to the Chutia and Kachari chiefs, and Srihatta (Sylhet) to the kingdom of Gour (not shown as states). The Khasa Malla kings rule western Nepal from Sinja.": "Vers 1100. Le royaume katyuri se disloque : le Kumaon passe aux rajas Chand, et le Garhwal est partagé entre de nombreux chefs (non représentés comme des États). La dynastie Pala du Kamarupa s’éteint ; le haut Assam tombe aux mains des chefs chutia et kachari, et le Srihatta (Sylhet) à celles du royaume de Gour (non représentés comme des États). Les rois Khasa Malla gouvernent l’ouest du Népal depuis Sinja."
  About 1112. The Eastern Ganga king Anantavarman Chodaganga conquers Utkala; his dynasty rules Odisha.: Vers 1112. Le roi ganga oriental Anantavarman Chodaganga conquiert l’Utkala ; sa dynastie gouverne l’Odisha.
  The Hoysala king Vishnuvardhana takes Talakad from the Cholas and rules southern Karnataka, at first as a vassal of the Western Chalukyas.: Le roi hoysala Vishnuvardhana prend Talakad aux Chola et gouverne le sud du Karnataka, d’abord comme vassal des Chalukya occidentaux.
  About 1124. The Chera Perumal kingdom of Mahodayapuram breaks up. Venad in the south, Cochin (Perumpadappu) and the Zamorins of Calicut in the north become separate kingdoms.: Vers 1124. Le royaume des Chera Perumal de Mahodayapuram se disloque. Le Venad au sud, Cochin (Perumpadappu) et les Zamorins de Calicut au nord deviennent des royaumes distincts.
  About 1136. The Chaulukya king Jayasimha Siddharaja takes Dhara; Malwa is ruled from Gujarat for about half a century.: Vers 1136. Le roi chaulukya Jayasimha Siddharaja prend Dhara ; le Malwa est gouverné depuis le Goujarat pendant environ un demi-siècle.
  About 1150. The Chahamana king Vigraharaja IV takes Delhi from the Tomaras. In Bengal the Senas under Vijayasena take Varendra from the Palas and Vanga from the Varmans.: Vers 1150. Le roi chahamana Vigraharaja IV prend Delhi aux Tomara. Au Bengale, les Sena, sous Vijayasena, prennent le Varendra aux Pala et le Vanga aux Varman.
  About 1162. The Pala dynasty ends; the Gahadavalas take the west of Bihar.: Vers 1162. La dynastie Pala prend fin ; les Gahadavala prennent l’ouest du Bihar.
  The Kakatiya ruler Rudradeva declares independence from the Western Chalukyas at Hanamakonda; Warangal becomes his dynasty’s capital.: Le souverain kakatiya Rudradeva proclame son indépendance vis-à-vis des Chalukya occidentaux à Hanamakonda ; Warangal devient la capitale de sa dynastie.
  Ghiyath al-Din of Ghor takes Ghazni; the Ghurids take Arachosia with Pishin and Quetta.: Ghiyath al-Din de Ghor prend Ghazni ; les Ghurides prennent l’Arachosie avec Pishin et Quetta.
  Muhammad of Ghor takes Multan and Uch, which had slipped from Ghaznavid control.: Muhammad de Ghor prend Multan et Uch, qui avaient échappé au contrôle ghaznévide.
  Muhammad of Ghor takes Peshawar from the Ghaznavids.: Muhammad de Ghor prend Peshawar aux Ghaznévides.
  About 1180. Vindhyavarman restores Paramara rule in Malwa.: Vers 1180. Vindhyavarman rétablit la domination paramara au Malwa.
  Muhammad of Ghor takes Lahore and deposes Khusrau Malik, the last Ghaznavid.: Muhammad de Ghor prend Lahore et dépose Khusrau Malik, le dernier Ghaznévide.
  The Western Chalukya Empire ends. The Seuna (Yadava) king Bhillama V takes the north of the Deccan; the Hoysalas the south.: L’Empire chalukya occidental prend fin. Le roi seuna (yadava) Bhillama V prend le nord du Dekkan, et les Hoysala le sud.
  About 1190. The Pandyas regain their independence from the declining Cholas at Madurai.: Vers 1190. Les Pandya, à Madurai, recouvrent leur indépendance vis-à-vis des Chola en déclin.
  Second Battle of Tarain. Muhammad of Ghor defeats Prithviraj Chauhan, who is executed, and takes the Chahamana lands.: Seconde bataille de Tarain. Muhammad de Ghor bat Prithviraj Chauhan, qui est exécuté, et prend les terres des Chahamana.
  Qutb al-Din Aibak takes Delhi from its Tomara rulers, vassals of the Chahamanas.: Qutb al-Din Aibak prend Delhi à ses souverains tomara, vassaux des Chahamana.
  Battle of Chandawar. Muhammad of Ghor defeats the Gahadavala king Jayachandra; Varanasi and the middle Ganges fall to the Ghurids.: Bataille de Chandawar. Muhammad de Ghor bat le roi gahadavala Jayachandra ; Varanasi et la moyenne vallée du Gange tombent aux mains des Ghurides.
  The Ghurids put down Hariraja’s revolt and annex Ajmer.: Les Ghurides écrasent la révolte de Hariraja et annexent Ajmer.
  The Ghurids take Gwalior from the Parihar chiefs.: Les Ghurides prennent Gwalior aux chefs parihar.
  Qutb al-Din Aibak takes Badaun (Rohilkhand) for the Ghurids.: Qutb al-Din Aibak prend Badaun (Rohilkhand) pour les Ghurides.
  About 1200. Bakhtiyar Khalji, a Ghurid commander, takes Bihar.: Vers 1200. Bakhtiyar Khalji, un chef militaire ghuride, prend le Bihar.
  Bakhtiyar Khalji takes Nadia from Lakshmana Sena and founds Lakhnauti in Gauda. The Senas keep eastern Bengal.: Bakhtiyar Khalji prend Nadia à Lakshmana Sena et fonde Lakhnauti, dans le Gauda. Les Sena conservent l’est du Bengale.
  "Qutb al-Din Aibak takes power in Lahore after the murder of Muhammad of Ghor: the beginning of the Delhi Sultanate. Nasir al-Din Qabacha, ruling Multan and Uch, and the Khalji lords of Lakhnauti owe him only nominal allegiance.": "Qutb al-Din Aibak prend le pouvoir à Lahore après l’assassinat de Muhammad de Ghor : c’est le début du sultanat de Delhi. Nasir al-Din Qabacha, qui gouverne Multan et Uch, et les seigneurs khalji de Lakhnauti ne lui doivent qu’une allégeance nominale."
  About 1210. The Kakatiya king Ganapati conquers coastal Andhra from the Velanati Chodas.: Vers 1210. Le roi kakatiya Ganapati conquiert l’Andhra côtier sur les Choda de Velanati.
  The Khwarazmshah Muhammad takes Ghazni; his empire reaches Peshawar and Quetta.: Le khwarezmchah Muhammad prend Ghazni ; son empire atteint Peshawar et Quetta.
  Kalinga Magha invades Sri Lanka and takes Polonnaruwa. The Sinhalese kings withdraw to Dambadeniya in the south-west; Magha rules the north from Polonnaruwa.: Kalinga Magha envahit le Sri Lanka et prend Polonnaruwa. Les rois cinghalais se replient à Dambadeniya, dans le sud-ouest ; Magha gouverne le nord depuis Polonnaruwa.
  After the Mongol conquest of Khwarazm, Mongol commanders hold Peshawar and Pishin.: Après la conquête mongole du Khwarezm, des chefs militaires mongols tiennent Peshawar et Pishin.
  Iltutmish defeats Nasir al-Din Qabacha, who drowns in the Indus, and ends his rule at Multan and Uch. In the Brahmaputra valley the Tai prince Sukaphaa founds the Ahom kingdom.: Iltutmish bat Nasir al-Din Qabacha, qui se noie dans l’Indus, et met fin à son pouvoir à Multan et Uch. Dans la vallée du Brahmapoutre, le prince taï Sukaphaa fonde le royaume ahom.
  About 1230. The last Sena kings lose eastern Bengal to the Deva dynasty (not shown as a state). The Baghels settle at Bandhavgarh, the core of the later kingdom of Rewa. After the end of the Kalachuris of Tripuri, Gond chiefs rule the upper Narmada.: Vers 1230. Les derniers rois sena perdent l’est du Bengale au profit de la dynastie Deva (non représentée comme un État). Les Baghel s’établissent à Bandhavgarh, cœur du futur royaume de Rewa. Après la fin des Kalachuri de Tripuri, des chefs gond gouvernent la haute Narmada.
  About 1255. Parakramabahu II of Dambadeniya drives Magha out of Polonnaruwa. Jaffna, the Vanni and the east stay outside Sinhalese rule.: Vers 1255. Parakramabahu II de Dambadeniya chasse Magha de Polonnaruwa. Jaffna, le Vanni et l’est restent hors de la domination cinghalaise.
  "About 1257. The king of Kamarupa, Sandhya, moves his capital to Kamatapur: the Kamata kingdom.": "Vers 1257. Le roi du Kamarupa, Sandhya, transfère sa capitale à Kamatapur : c’est le royaume de Kamata."
  About 1258. Jatavarman Sundara Pandya I takes the Chola heartland and Kanchipuram; the Pandyas dominate the Tamil country. The last Chola king, Rajendra III, dies about 1279.: Vers 1258. Jatavarman Sundara Pandya Ier prend le cœur du pays chola et Kanchipuram ; les Pandya dominent le pays tamoul. Le dernier roi chola, Rajendra III, meurt vers 1279.
  About 1260. The Chagatai Khanate holds the country west of the Indus, with Peshawar and Pishin.: Vers 1260. Le khanat djaghataïde tient le pays à l’ouest de l’Indus, avec Peshawar et Pishin.
  After the death of Sultan Balban, his son Bughra Khan, governor of Lakhnauti, rules Bengal as an independent sultan; his successors keep it independent until 1324.: Après la mort du sultan Balban, son fils Bughra Khan, gouverneur de Lakhnauti, règne sur le Bengale en sultan indépendant ; ses successeurs le maintiennent indépendant jusqu’en 1324.
  Alauddin Khalji’s generals conquer Gujarat; the Vaghela king Karna flees.: Les généraux d’Alauddin Khalji conquièrent le Goujarat ; le roi vaghela Karna s’enfuit.
  About 1303. Shamsuddin Firuz Shah of Lakhnauti, who also rules Sonargaon, conquers Srihatta (Sylhet), with the Sufi Shah Jalal.: Vers 1303. Shamsuddin Firuz Shah de Lakhnauti, qui gouverne aussi Sonargaon, conquiert le Srihatta (Sylhet), avec le soufi Shah Jalal.
  Alauddin Khalji takes Chittorgarh after an eight-month siege; the Guhila ruler Ratnasimha is killed.: Alauddin Khalji prend Chittorgarh après un siège de huit mois ; le souverain guhila Ratnasimha est tué.
  Ain al-Mulk Multani conquers Malwa for Alauddin Khalji; the Paramara dynasty ends.: Ain al-Mulk Multani conquiert le Malwa pour Alauddin Khalji ; la dynastie Paramara prend fin.
  Alauddin Khalji takes Jalore from Kanhadadeva Songara. Malik Kafur’s army sacks Dwarasamudra and Madurai.: Alauddin Khalji prend Jalore à Kanhadadeva Songara. L’armée de Malik Kafur met à sac Dwarasamudra et Madurai.
  About 1315. The last Chandela strongholds pass to the Delhi Sultanate.: Vers 1315. Les dernières places fortes chandela passent au sultanat de Delhi.
  Qutb al-Din Mubarak Shah defeats the last Yadava, Harapaladeva; the Yadava kingdom is annexed.: Qutb al-Din Mubarak Shah bat le dernier Yadava, Harapaladeva ; le royaume yadava est annexé.
  Ulugh Khan (the future Muhammad bin Tughluq) takes Warangal and captures the Kakatiya king Prataparudra; the Kakatiya lands and the Pandya kingdom of Madurai are annexed.: Ulugh Khan (le futur Muhammad bin Tughluq) prend Warangal et capture le roi kakatiya Prataparudra ; les terres kakatiya et le royaume pandya de Madurai sont annexés.
  Ghiyath al-Din Tughluq intervenes in a succession war in Bengal and makes it a province of the Delhi Sultanate, governed from Lakhnauti, Satgaon and Sonargaon.: Ghiyath al-Din Tughluq intervient dans une guerre de succession au Bengale et en fait une province du sultanat de Delhi, gouvernée depuis Lakhnauti, Satgaon et Sonargaon.
  Ghiyath al-Din Tughluq destroys Simraungadh; the Karnat kingdom of Mithila ends. The Terai passes to local chiefs.: Ghiyath al-Din Tughluq détruit Simraungadh ; le royaume karnat de Mithila prend fin. Le Teraï passe à des chefs locaux.
  About 1325. Prolaya Vema Reddi founds the Reddi kingdom in coastal Andhra.: Vers 1325. Prolaya Vema Reddi fonde le royaume reddi dans l’Andhra côtier.
  "About 1326. Hammir Singh, of the Sisodia branch of the Guhilas, retakes Chittorgarh: Mewar is independent again.": "Vers 1326. Hammir Singh, de la branche sisodia des Guhila, reprend Chittorgarh : le Mewar est de nouveau indépendant."
  "Jalal al-Din Ahsan Khan, governor of Ma’bar, declares independence at Madurai: the Madurai Sultanate.": "Jalal al-Din Ahsan Khan, gouverneur du Ma’bar, proclame son indépendance à Madurai : c’est le sultanat de Madurai."
  The Musunuri Nayakas drive the Tughluq governors out of Warangal. In the south Harihara and Bukka found the Vijayanagara Empire on the Tungabhadra.: Les Nayaka de Musunuri chassent de Warangal les gouverneurs des Tughluq. Au sud, Harihara et Bukka fondent l’Empire de Vijayanagar sur la Tungabhadra.
  Fakhruddin Mubarak Shah declares himself sultan at Sonargaon, in eastern Bengal, and takes Chittagong about 1340.: Fakhruddin Mubarak Shah se proclame sultan à Sonargaon, dans l’est du Bengale, et prend Chittagong vers 1340.
  "Shah Mir takes the throne of Kashmir: the Kashmir Sultanate.": "Shah Mir s’empare du trône du Cachemire : c’est le sultanat du Cachemire."
  Shamsuddin Ilyas Shah takes Satgaon and Lakhnauti; he unites Bengal in 1352.: Shamsuddin Ilyas Shah prend Satgaon et Lakhnauti ; il unifie le Bengale en 1352.
  "About 1342. The Hada Chauhans take Bundi: the beginning of Hadoti.": "Vers 1342. Les Chauhan hada prennent Bundi : c’est le début du Hadoti."
  The last Hoysala king, Veera Ballala III, is killed fighting the Madurai Sultanate; Vijayanagara takes the Hoysala lands.: Le dernier roi hoysala, Veera Ballala III, est tué en combattant le sultanat de Madurai ; Vijayanagar prend les terres hoysala.
  "Rebel amirs of the Deccan proclaim Hasan Gangu sultan at Daulatabad: the Bahmani Sultanate, with its capital at Gulbarga.": "Des émirs rebelles du Dekkan proclament Hasan Gangu sultan à Daulatabad : c’est le sultanat bahmanide, avec Gulbarga pour capitale."
  About 1350. Gond kingdoms rule the hills of eastern Vidarbha around Chanda and Deogarh.: Vers 1350. Des royaumes gond gouvernent les collines de l’est du Vidarbha, autour de Chanda et de Deogarh.
  About 1351. The Samma dynasty replaces the Soomras in Sind, with its capital at Thatta.: Vers 1351. La dynastie Samma remplace les Soomra au Sind, avec Thatta pour capitale.
  About 1358. Ajay Pal unites the chiefdoms of Garhwal into one kingdom.: Vers 1358. Ajay Pal unit les chefferies du Garhwal en un seul royaume.
  The Recherla Velamas, allies of the Bahmanis, kill the Musunuri ruler Kapaya Nayaka; Telangana falls under Bahmani sway (the Velama kingdom of Rachakonda is not shown as a state).: Les Velama de Recherla, alliés des Bahmanides, tuent le souverain musunuri Kapaya Nayaka ; le Telangana passe sous l’emprise bahmanide (le royaume velama de Rachakonda n’est pas représenté comme un État).
  About 1370. Vijayanagara takes Goa from the Bahmanis. Kumara Kampana of Vijayanagara conquers the Sambuvarayas of the northern Tamil country and, by 1378, ends the Madurai Sultanate.: Vers 1370. Vijayanagar prend Goa aux Bahmanides. Kumara Kampana de Vijayanagar soumet les Sambuvaraya du nord du pays tamoul et, au plus tard en 1378, met fin au sultanat de Madurai.
  Timur defeats his rival Amir Husayn at Balkh and becomes master of the Chagatai lands, with Kabul and the Peshawar valley.: Tamerlan bat son rival l’émir Husayn à Balkh et devient maître des terres djaghataïdes, avec Kaboul et la vallée de Peshawar.
  Malik Raja Faruqi founds the Khandesh Sultanate.: Malik Raja Faruqi fonde le sultanat de Khandesh.
  Timur takes Kandahar, with Pishin and Quetta.: Tamerlan prend Kandahar, avec Pishin et Quetta.
  About 1390. The Khasa Malla kingdom of western Nepal breaks up into the Baise (twenty-two) principalities.: Vers 1390. Le royaume khasa malla de l’ouest du Népal se morcelle en principautés Baise (les « vingt-deux »).
  "Malik Sarwar, a Tughluq eunuch, declares himself independent at Jaunpur: the Jaunpur Sultanate.": "Malik Sarwar, un eunuque des Tughluq, se proclame indépendant à Jaunpur : c’est le sultanat de Jaunpur."
  "Bir Singh Deo Tomar takes Gwalior: the Tomaras of Gwalior.": "Bir Singh Deo Tomar prend Gwalior : c’est le début des Tomara de Gwalior."
  "About 1395. Rao Chunda takes Mandore: the Rathores rule Marwar.": "Vers 1395. Rao Chunda prend Mandore : les Rathore gouvernent le Marwar."
  Timur sacks Delhi, and the weakened sultanate loses its outlying provinces. In eastern Rajasthan the Kachwahas of Amber, rulers there since the 11th century, are shown as their own state; Ajmer is fought over by Mewar, Marwar and Malwa.: Tamerlan met Delhi à sac, et le sultanat affaibli perd ses provinces périphériques. Dans l’est du Rajasthan, les Kachwaha d’Amber, qui y règnent depuis le XIe siècle, sont représentés comme un État distinct ; Ajmer est disputée entre le Mewar, le Marwar et le Malwa.
  About 1400. The Manikya dynasty rules Tripura. The Chaubisi (twenty-four) principalities share the hills of central Nepal.: Vers 1400. La dynastie Manikya gouverne le Tripura. Les principautés Chaubisi (les « vingt-quatre ») se partagent les collines du centre du Népal.
  "Dilawar Khan Ghuri, governor of Malwa, makes himself independent: the Malwa Sultanate.": "Dilawar Khan Ghuri, gouverneur du Malwa, se rend indépendant : c’est le sultanat de Malwa."
  "Zafar Khan, governor of Gujarat, proclaims himself Sultan Muzaffar Shah at Birpur: the Gujarat Sultanate, with its seat at Patan.": "Zafar Khan, gouverneur du Goujarat, se proclame sultan à Birpur sous le nom de Muzaffar Shah : c’est le sultanat du Goujarat, qui siège à Patan."
  Kapilendra Deva deposes the last Eastern Ganga king and founds the Gajapati dynasty in Odisha.: Kapilendra Deva dépose le dernier roi ganga oriental et fonde la dynastie Gajapati en Odisha.
  "About 1445. The Langah tribe takes power in Multan: the Langah Sultanate.": "Vers 1445. La tribu langah prend le pouvoir à Multan : c’est le sultanat langah."
  About 1450. Prince Sapumal of Kotte conquers the Jaffna Kingdom for Parakramabahu VI.: Vers 1450. Le prince Sapumal de Kotte conquiert le royaume de Jaffna pour Parakramabahu VI.
  About 1454. The Gajapati Kapilendra Deva conquers the Reddi kingdoms of Rajahmundry and Kondavidu.: Vers 1454. Le Gajapati Kapilendra Deva conquiert les royaumes reddi de Rajahmundry et de Kondavidu.
  About 1459. The Arakanese kingdom of Mrauk U takes Chittagong from Bengal.: Vers 1459. Le royaume arakanais de Mrauk U prend Chittagong au Bengale.
  About 1467. Jaffna regains its independence under Kanakasooriya Cinkaiariyan.: Vers 1467. Jaffna recouvre son indépendance sous Kanakasooriya Cinkaiariyan.
  The Bahmanis take Goa from Vijayanagara. In Sri Lanka Senasammata Vikramabahu makes Kandy, in the hills, a kingdom of its own.: Les Bahmanides prennent Goa à Vijayanagar. Au Sri Lanka, Senasammata Vikramabahu fait de Kandy, dans les collines, un royaume à part entière.
  Mahmud Begada of Gujarat takes Junagadh and ends the Chudasama kingdom of Saurashtra.: Mahmud Begada du Goujarat prend Junagadh et met fin au royaume chudasama du Saurashtra.
  Bahlul Lodi of Delhi defeats Hussain Shah Sharqi and annexes the Jaunpur Sultanate.: Bahlul Lodi de Delhi bat Hussain Shah Sharqi et annexe le sultanat de Jaunpur.
  Dhu’l-Nun Arghun, a Timurid governor, takes Pishin, Shal (Quetta) and Mastung; the Arghuns rule Kandahar on their own account.: Dhu’l-Nun Arghun, un gouverneur timuride, prend Pishin, Shal (Quetta) et Mastung ; les Arghun gouvernent Kandahar pour leur propre compte.
  Rao Bika, a son of Rao Jodha of Marwar, founds Bikaner.: Rao Bika, un fils de Rao Jodha du Marwar, fonde Bikaner.
  "The Bahmani Sultanate breaks up: Ahmad Nizam Shah founds the Ahmadnagar Sultanate, Yusuf Adil Shah the Bijapur Sultanate and Fathullah Imad-ul-Mulk the Berar Sultanate; the Barid Shahis hold the rump at Bidar.": "Le sultanat bahmanide se disloque : Ahmad Nizam Shah fonde le sultanat d’Ahmadnagar, Yusuf Adil Shah celui de Bijapur et Fathullah Imad-ul-Mulk celui de Berar ; les Barid Shahi tiennent ce qui reste de l’État, à Bidar."
  About 1490. Tripura under Dhanya Manikya extends its rule over the plains of Comilla.: Vers 1490. Le Tripura, sous Dhanya Manikya, étend sa domination sur les plaines de Comilla.
  About 1495. Sikandar Lodi drives Husain Shah Sharqi, the last sultan of Jaunpur, out of Bihar and annexes it; the land east of Barh stays with Bengal.: Vers 1495. Sikandar Lodi chasse du Bihar Husain Shah Sharqi, le dernier sultan de Jaunpur, et l’annexe ; les terres à l’est de Barh restent au Bengale.
  Alauddin Hussain Shah of Bengal conquers the Kamata kingdom.: Alauddin Hussain Shah du Bengale conquiert le royaume de Kamata.
  "Rudra Pratap Singh founds Orchha: the Bundela Rajputs rule Bundelkhand.": "Rudra Pratap Singh fonde Orchha : les Rajputs bundela gouvernent le Bundelkhand."
  Afonso de Albuquerque takes Goa from Bijapur, after a first capture and loss earlier in the year.: Afonso de Albuquerque prend Goa à Bijapur, après l’avoir prise une première fois puis perdue plus tôt dans l’année.
  Krishnadevaraya of Vijayanagara takes Udayagiri, Kondavidu and the coast south of the Krishna from the Gajapatis. In the west of the Brahmaputra valley Vishwa Singha founds the Koch kingdom.: Krishnadevaraya de Vijayanagar prend aux Gajapati Udayagiri, Kondavidu et la côte au sud de la Krishna. Dans l’ouest de la vallée du Brahmapoutre, Vishwa Singha fonde le royaume koch.
  About 1516. Alauddin Hussain Shah of Bengal takes Chittagong back from Arakan.: Vers 1516. Alauddin Hussain Shah du Bengale reprend Chittagong à l’Arakan.
  About 1518. Ibrahim Lodi forces Vikramaditya Tomar to surrender Gwalior.: Vers 1518. Ibrahim Lodi contraint Vikramaditya Tomar à lui livrer Gwalior.
  Quli Qutb-ul-Mulk, Bahmani governor of Telangana, makes himself independent at Golconda.: Quli Qutb-ul-Mulk, gouverneur bahmanide du Telangana, se rend indépendant à Golconde.
  Babur, ruler of Kabul, takes Bajaur and the Peshawar valley.: Babur, souverain de Kaboul, prend le Bajaur et la vallée de Peshawar.
  Shah Beg Arghun takes Thatta and ends the Samma dynasty. In the Deccan, Krishnadevaraya of Vijayanagara defeats Bijapur at Raichur and takes the fortress.: Shah Beg Arghun prend Thatta et met fin à la dynastie Samma. Dans le Dekkan, Krishnadevaraya de Vijayanagar bat Bijapur à Raichur et prend la forteresse.
  "The Vijayabahu Kollaya: Vijayabahu VI of Kotte is killed and his sons divide the kingdom. Mayadunne rules Sitawaka, in the interior.": "Le Vijayabahu Kollaya : Vijayabahu VI de Kotte est tué et ses fils se partagent le royaume. Mayadunne gouverne Sitawaka, dans l’intérieur des terres."
  Babur takes Kandahar; the Mughals also take Pishin and the Quetta valley.: Babur prend Kandahar ; les Moghols prennent aussi Pishin et la vallée de Quetta.
  "First Battle of Panipat. Babur defeats and kills Ibrahim Lodi and takes Delhi and Agra: the Mughal Empire.": "Première bataille de Panipat. Babur bat et tue Ibrahim Lodi, et prend Delhi et Agra : c’est l’Empire moghol."
  The last Bahmani sultan flees; the Barid Shahis rule Bidar as a sultanate of their own.: Le dernier sultan bahmanide s’enfuit ; les Barid Shahi gouvernent Bidar comme un sultanat à part entière.
  Shah Husain Arghun takes Multan and ends the Langah Sultanate.: Shah Husain Arghun prend Multan et met fin au sultanat langah.
  The Mughals take Awadh, Gwalior, Chanderi and the Ganges plain to Bihar.: Les Moghols prennent l’Awadh, Gwalior, Chanderi et la plaine du Gange jusqu’au Bihar.
  Battle of the Ghaghra. Babur defeats the Afghans of Bihar and Bengal; Bihar submits.: Bataille de la Ghaghra. Babur bat les Afghans du Bihar et du Bengale ; le Bihar se soumet.
  Vishwanatha Nayaka, governor of Madurai for Vijayanagara, founds the Madurai Nayaka dynasty.: Vishwanatha Nayaka, gouverneur de Madurai pour Vijayanagar, fonde la dynastie des Nayaka de Madurai.
  Bahadur Shah of Gujarat conquers the Malwa Sultanate.: Bahadur Shah du Goujarat conquiert le sultanat de Malwa.
  About 1532. The Vijayanagara governors at Thanjavur become hereditary Nayakas.: Vers 1532. Les gouverneurs de Vijayanagar à Thanjavur deviennent des Nayaka héréditaires.
  In the 1530s, as the Bengal Sultanate weakens, Arakan retakes Chittagong.: Dans les années 1530, tandis que le sultanat du Bengale s’affaiblit, l’Arakan reprend Chittagong.
  Sher Khan Sur takes Gaur, the capital of Bengal.: Sher Khan Sur prend Gaur, la capitale du Bengale.
  Battle of Kannauj. Sher Shah Suri defeats Humayun; the Mughals lose Hindustan to the Sur Empire.: Bataille de Kannauj. Sher Shah Suri bat Humayun ; les Moghols perdent l’Hindoustan au profit de l’Empire suri.
  Sher Shah Suri conquers Malwa.: Sher Shah Suri conquiert le Malwa.
  Battle of Sammel. Sher Shah Suri defeats Maldeo Rathore and occupies Marwar.: Bataille de Sammel. Sher Shah Suri bat Maldeo Rathore et occupe le Marwar.
  Sher Shah dies at the siege of Kalinjar; Maldeo Rathore retakes Jodhpur.: Sher Shah meurt au siège de Kalinjar ; Maldeo Rathore reprend Jodhpur.
  About 1548. Khengarji I unites Kutch under the Jadejas, with his capital at Bhuj.: Vers 1548. Khengarji Ier unit le Kutch sous les Jadeja, avec Bhuj pour capitale.
  Tarkhan rulers succeed the Arghuns in Sind. In Bengal the governor Muhammad Khan Sur declares himself independent.: Des souverains tarkhan succèdent aux Arghun au Sind. Au Bengale, le gouverneur Muhammad Khan Sur se proclame indépendant.
  Baz Bahadur makes himself sultan of Malwa.: Baz Bahadur se fait sultan du Malwa.
  Humayun retakes Delhi.: Humayun reprend Delhi.
  Second Battle of Panipat. Akbar’s army defeats Hemu; the Mughals take the rest of the Sur lands in Hindustan.: Seconde bataille de Panipat. L’armée d’Akbar bat Hemu ; les Moghols prennent le reste des terres des Suri dans l’Hindoustan.
  Andiri Andiri, a Portuguese captain, takes Malé; the Maldives are under Portuguese rule until 1573.: Andiri Andiri, un capitaine portugais, prend Malé ; les Maldives sont sous domination portugaise jusqu’en 1573.
  "About 1559. Drabya Shah takes Gorkha: the Gorkha kingdom, the future Nepal.": "Vers 1559. Drabya Shah prend Gorkha : c’est le royaume de Gorkha, le futur Népal."
  The Portuguese take Daman.: Les Portugais prennent Daman.
  Adham Khan defeats Baz Bahadur; the Mughals annex Malwa.: Adham Khan bat Baz Bahadur ; les Moghols annexent le Malwa.
  Battle of Talikota. The Deccan sultanates defeat Vijayanagara and sack its capital. Bijapur takes the land south of the Tungabhadra; the Aravidu kings rule the rest of the empire from Penukonda. The Keladi Nayakas become independent in Kanara. In Marwar Akbar’s forces take Jodhpur.: Bataille de Talikota. Les sultanats du Dekkan battent Vijayanagar et mettent sa capitale à sac. Bijapur prend les terres au sud de la Tungabhadra ; les rois Aravidu gouvernent le reste de l’empire depuis Penukonda. Les Nayaka de Keladi deviennent indépendants dans le Kanara. Au Marwar, les forces d’Akbar prennent Jodhpur.
  Mukunda Deva, the last independent king of Odisha, is killed; the Karrani sultans of Bengal take Odisha.: Mukunda Deva, le dernier roi indépendant de l’Odisha, est tué ; les sultans karrani du Bengale prennent l’Odisha.
  The Maldivians under Muhammad Thakurufaanu drive out the Portuguese.: Les Maldiviens, menés par Muhammad Thakurufaanu, chassent les Portugais.
  Akbar wins the Battle of Ahmedabad; the Gujarat Sultanate is annexed.: Akbar remporte la bataille d’Ahmedabad ; le sultanat du Goujarat est annexé.
  Ahmadnagar annexes the Berar Sultanate.: Ahmadnagar annexe le sultanat de Berar.
  Battle of Rajmahal. The Mughals defeat and kill Daud Khan Karrani and annex Bengal and Bihar; the Baro-Bhuyan chiefs of eastern Bengal resist until 1611.: Bataille de Rajmahal. Les Moghols battent et tuent Daud Khan Karrani et annexent le Bengale et le Bihar ; les chefs baro-bhuyan de l’est du Bengale résistent jusqu’en 1611.
  About 1579. Golconda conquers coastal Andhra up to the Godavari.: Vers 1579. Golconde conquiert l’Andhra côtier jusqu’à la Godavari.
  Rajasinha I of Sitawaka conquers Kandy. Of Kotte only Colombo and its coast remain, held by the Portuguese for King Dharmapala.: Rajasinha Ier de Sitawaka conquiert Kandy. De Kotte, il ne reste que Colombo et sa côte, tenues par les Portugais pour le roi Dharmapala.
  Akbar installs Udai Singh as Rao of Marwar, a Mughal vassal.: Akbar installe Udai Singh comme rao du Marwar, vassal des Moghols.
  About 1585. The Nagvanshi raja of Chota Nagpur submits to the Mughals.: Vers 1585. Le raja nagvanshi du Chota Nagpur se soumet aux Moghols.
  The Mughals annex the Kashmir Sultanate.: Les Moghols annexent le sultanat du Cachemire.
  About 1590. Konappu Bandara, crowned as Vimaladharmasuriya I, retakes Kandy from Sitawaka.: Vers 1590. Konappu Bandara, couronné sous le nom de Vimaladharmasuriya Ier, reprend Kandy à Sitawaka.
  Man Singh conquers Odisha for the Mughals.: Man Singh conquiert l’Odisha pour les Moghols.
  The Tarkhan ruler of Thatta submits; the Mughals annex Sind. Rajasinha I of Sitawaka dies and his kingdom falls apart; the Portuguese take the lowlands.: Le souverain tarkhan de Thatta se soumet ; les Moghols annexent le Sind. Rajasinha Ier de Sitawaka meurt et son royaume se désagrège ; les Portugais prennent les basses terres.
  The Mughals regain Kandahar, with Pishin and Quetta.: Les Moghols reprennent Kandahar, avec Pishin et Quetta.
  Chand Bibi of Ahmadnagar cedes Berar to the Mughals.: Chand Bibi d’Ahmadnagar cède le Berar aux Moghols.
  Akbar takes Asirgarh and annexes Khandesh.: Akbar prend Asirgarh et annexe le Khandesh.
  The Wodeyar king Raja Wodeyar I takes Srirangapatna and rules southern Karnataka as the Kingdom of Mysore.: "Le roi wodeyar Raja Wodeyar Ier prend Srirangapatna et gouverne le sud du Karnataka : c’est le royaume de Mysore."
  The Mughals take Sylhet and, from the Koch, Koch Hajo (Lower Assam).: Les Moghols prennent Sylhet et, aux Koch, le Koch Hajo (bas Assam).
  About 1616. Ngawang Namgyal, the Zhabdrung, arrives from Tibet and begins to unite western Bhutan; the east follows by about 1650.: Vers 1616. Ngawang Namgyal, le Zhabdrung, arrive du Tibet et entreprend d’unifier l’ouest du Bhoutan ; l’est suit vers 1650.
  Phillippe de Oliveira conquers the Jaffna Kingdom for Portugal.: Phillippe de Oliveira conquiert le royaume de Jaffna pour le Portugal.
  Bijapur annexes the Bidar Sultanate.: Bijapur annexe le sultanat de Bidar.
  Shah Abbas I takes Kandahar; the Safavids also hold Pishin.: Shah Abbas Ier prend Kandahar ; les Safavides tiennent aussi Pishin.
  The Mughals take Daulatabad from Ahmadnagar.: Les Moghols prennent Daulatabad à Ahmadnagar.
  The Ahmadnagar Sultanate is extinguished. Bijapur keeps Pune and the south of the Konkan; the rest passes to the Mughals.: Le sultanat d’Ahmadnagar disparaît. Bijapur garde Pune et le sud du Konkan ; le reste passe aux Moghols.
  The Mughals regain Kandahar, with Pishin.: Les Moghols reprennent Kandahar, avec Pishin.
  The Dutch East India Company, allied with Kandy, takes Galle from the Portuguese; Matara follows. The Portuguese keep Colombo.: La Compagnie néerlandaise des Indes orientales, alliée à Kandy, prend Galle aux Portugais ; Matara suit. Les Portugais gardent Colombo.
  Phuntsog Namgyal is consecrated as the first Chogyal of Sikkim.: Phuntsog Namgyal est consacré premier chogyal du Sikkim.
  The Dutch take Negombo from the Portuguese for the second time and keep it.: Les Néerlandais prennent Negombo aux Portugais pour la seconde fois et le gardent.
  "The Vijayanagara Empire ends: Golconda and Bijapur divide the last lands of the Aravidu kings.": "L’Empire de Vijayanagar prend fin : Golconde et Bijapur se partagent les dernières terres des rois Aravidu."
  Shah Abbas II retakes Kandahar, with Pishin.: Shah Abbas II reprend Kandahar, avec Pishin.
  The Dutch take Colombo from the Portuguese. Shivaji, a Maratha jagirdar of Bijapur, takes Javli, the start of his own state.: "Les Néerlandais prennent Colombo aux Portugais. Shivaji, un jagirdar marathe de Bijapur, prend Javli : c’est le début de son propre État."
  The Dutch take Jaffna, the last Portuguese stronghold in Sri Lanka; Kandy keeps the interior.: Les Néerlandais prennent Jaffna, la dernière place forte portugaise du Sri Lanka ; Kandy garde l’intérieur de l’île.
  About 1666. Mir Ahmad founds the Khanate of Kalat.: Vers 1666. Mir Ahmad fonde le khanat de Kalat.
  Shaista Khan’s Mughal army takes Chittagong from Arakan.: L’armée moghole de Shaista Khan prend Chittagong à l’Arakan.
  The Ahoms retake Guwahati from the Mughals; they keep it after the Battle of Saraighat (1671).: Les Ahom reprennent Guwahati aux Moghols ; ils la gardent après la bataille de Saraighat (1671).
  About 1670. Mysore under Chikka Devaraja conquers Kongu (Coimbatore and Salem) from Madurai.: Vers 1670. Le Mysore, sous Chikka Devaraja, conquiert le Kongu (Coimbatore et Salem) sur Madurai.
  "Shivaji is crowned at Raigad: the Maratha kingdom. Venkoji, his half-brother, takes Thanjavur from the Nayakas. The French found Pondicherry.": "Shivaji est couronné à Raigad : c’est le royaume marathe. Venkoji, son demi-frère, prend Thanjavur aux Nayaka. Les Français fondent Pondichéry."
  Shivaji’s southern campaign takes Gingee and Vellore from Bijapur.: La campagne de Shivaji dans le sud lui donne Gingee et Vellore, prises à Bijapur.
  Aurangzeb occupies Marwar after the death of Jaswant Singh; the Rajput War begins.: Aurangzeb occupe le Marwar après la mort de Jaswant Singh ; la guerre des Rajputs commence.
  The Ahom viceroy Laluk Sola Borphukan hands Guwahati over to the Mughals.: Le vice-roi ahom Laluk Sola Borphukan livre Guwahati aux Moghols.
  Battle of Itakhuli. The Ahoms take Guwahati and the country east of the Manas from the Mughals for good.: Bataille d’Itakhuli. Les Ahom prennent définitivement aux Moghols Guwahati et le pays à l’est du Manas.
  Aurangzeb takes Bijapur and ends the Adil Shahi sultanate.: Aurangzeb prend Bijapur et met fin au sultanat adil shahi.
  Aurangzeb takes Golconda and ends the Qutb Shahi sultanate.: Aurangzeb prend Golconde et met fin au sultanat qutb shahi.
  After the capture of Sambhaji and the fall of Raigad, the Mughals occupy most of the Maratha country. The Marathas fight on from Gingee and, after 1700, across the Deccan.: Après la capture de Sambhaji et la chute de Raigad, les Moghols occupent la plus grande partie du pays marathe. Les Marathes poursuivent la lutte depuis Gingee puis, après 1700, dans tout le Dekkan.
  The Dutch take Pondicherry from the French; they return it under the Treaty of Ryswick (1699).: Les Néerlandais prennent Pondichéry aux Français ; ils la restituent en vertu du traité de Ryswick (1699).
  Zulfiqar Khan takes Gingee for the Mughals.: Zulfiqar Khan prend Gingee pour les Moghols.
  Pondicherry is handed back to France.: Pondichéry est rendue à la France.
  Aurangzeb recognises Yar Muhammad Kalhoro as ruler in Sind; the Kalhoras rule Sind, later as Durrani vassals.: Aurangzeb reconnaît Yar Muhammad Kalhoro comme souverain du Sind ; les Kalhora gouvernent le Sind, plus tard comme vassaux des Durrani.
  Aurangzeb dies. Ajit Singh retakes Jodhpur; the Marathas under Shahu recover their homeland.: Aurangzeb meurt. Ajit Singh reprend Jodhpur ; les Marathes, sous Shahu, recouvrent leur pays.
  Mirwais Hotak leads a revolt in Kandahar; the Hotakis hold Pishin.: Mirwais Hotak mène une révolte à Kandahar ; les Hotaki tiennent Pishin.
  About 1710. Saadatullah Khan, Mughal governor of the Carnatic at Arcot, founds the line of the Nawabs of the Carnatic under the Nizam’s nominal authority.: Vers 1710. Saadatullah Khan, gouverneur moghol du Carnatic à Arcot, fonde la lignée des nawabs du Carnatic, sous l’autorité nominale du nizam.
  Murshid Quli Khan, diwan and then governor, makes Bengal and Odisha a hereditary nawabate under nominal Mughal rule.: Murshid Quli Khan, diwan puis gouverneur, fait du Bengale et de l’Odisha un nawabat héréditaire sous la souveraineté nominale des Moghols.
  Saadat Khan becomes governor of Awadh; he and his successors rule it as hereditary nawabs.: Saadat Khan devient gouverneur de l’Awadh ; lui et ses successeurs le gouvernent en nawabs héréditaires.
  About 1723. Dost Mohammad Khan founds the state of Bhopal.: Vers 1723. Dost Mohammad Khan fonde l’État de Bhopal.
  Battle of Shakar Kheda. Asaf Jah I (Nizam-ul-Mulk) defeats the Mughal governor of the Deccan and rules it as Nizam of Hyderabad.: Bataille de Shakar Kheda. Asaf Jah Ier (Nizam-ul-Mulk) bat le gouverneur moghol du Dekkan et gouverne la région en tant que nizam d’Hyderabad.
  About 1730. With Mughal power gone from Saurashtra, its many chiefs (Junagadh, Nawanagar, Bhavnagar and others) are independent; the Marathas soon levy tribute on them.: Vers 1730. La puissance moghole ayant disparu du Saurashtra, ses nombreux chefs (Junagadh, Nawanagar, Bhavnagar et d’autres) sont indépendants ; les Marathes leur imposent bientôt un tribut.
  About 1732. Chhatrasal of Bundelkhand leaves a third of his kingdom, with Jhansi and Kalpi, to the Peshwa Baji Rao I.: Vers 1732. Chhatrasal du Bundelkhand lègue un tiers de son royaume, avec Jhansi et Kalpi, au peshwa Baji Rao Ier.
  Shuja-ud-Din, Nawab of Bengal, adds Bihar to his government; his forces annex the plains of Tripura (Comilla).: Shuja-ud-Din, nawab du Bengale, ajoute le Bihar à son gouvernement ; ses forces annexent les plaines du Tripura (Comilla).
  Chanda Sahib takes Madurai and Tiruchirappalli for the Nawab of the Carnatic; the Madurai Nayaka dynasty ends.: Chanda Sahib prend Madurai et Tiruchirappalli pour le nawab du Carnatic ; la dynastie des Nayaka de Madurai prend fin.
  Treaty of Duraha, after the Battle of Bhopal. The Nizam cedes Malwa to the Marathas. The Nawab of Awadh gives the Benares zamindari to Mansa Ram.: Traité de Duraha, après la bataille de Bhopal. Le nizam cède le Malwa aux Marathes. Le nawab d’Awadh donne le zamindari de Bénarès à Mansa Ram.
  Nader Shah takes Peshawar on his way to India; at Karnal in 1739 the Mughal emperor cedes him everything west of the Indus.: Nader Shah prend Peshawar en route vers l’Inde ; à Karnal, en 1739, l’empereur moghol lui cède tout ce qui se trouve à l’ouest de l’Indus.
  About 1740. Ali Mohammed Khan, leader of the Rohilla Afghans, rules Rohilkhand from Aonla.: Vers 1740. Ali Mohammed Khan, chef des Afghans rohilla, gouverne le Rohilkhand depuis Aonla.
  Raghoji Bhonsle of Nagpur, a Maratha general, takes Chhattisgarh from the Kalachuris of Ratanpur.: Raghoji Bhonsle de Nagpur, un général marathe, prend le Chhattisgarh aux Kalachuri de Ratanpur.
  Raghoji Bhonsle takes Nagpur and the Gond kingdom of Deogarh.: Raghoji Bhonsle prend Nagpur et le royaume gond de Deogarh.
  Nader Shah is murdered. Ahmad Shah Durrani takes his eastern lands, with Peshawar and Pishin.: Nader Shah est assassiné. Ahmad Shah Durrani prend ses terres orientales, avec Peshawar et Pishin.
  About 1748. Nawab Bahawal Khan I founds Bahawalpur, the capital of the Daudpotra state south of the Sutlej.: Vers 1748. Le nawab Bahawal Khan Ier fonde Bahawalpur, la capitale de l’État daudpotra au sud du Sutlej.
  Alivardi Khan of Bengal cedes Odisha to Raghoji Bhonsle of Nagpur.: Alivardi Khan du Bengale cède l’Odisha à Raghoji Bhonsle de Nagpur.
  The Mughal emperor cedes Lahore and Multan to Ahmad Shah Durrani, whose army takes Kashmir. Under the Treaty of Bhalki the Nizam cedes Khandesh to the Marathas.: L’empereur moghol cède Lahore et Multan à Ahmad Shah Durrani, dont l’armée prend le Cachemire. Par le traité de Bhalki, le nizam cède le Khandesh aux Marathes.
  The Marathas take Ahmedabad; Gujarat is shared between the Peshwa and the Gaekwads of Baroda. The French Company’s general Bussy obtains the Northern Circars from the Nizam.: Les Marathes prennent Ahmedabad ; le Goujarat est partagé entre le peshwa et les Gaekwad de Baroda. Bussy, général de la Compagnie française, obtient du nizam les Circars du Nord.
  The Marathas under Raghunath Rao take Lahore and drive the Durrani governors out of the Punjab.: Les Marathes, sous Raghunath Rao, prennent Lahore et chassent du Pendjab les gouverneurs durrani.
  The British take Masulipatnam; the French lose the Northern Circars, which return to the Nizam.: Les Britanniques prennent Masulipatnam ; les Français perdent les Circars du Nord, qui reviennent au nizam.
  Ahmad Shah Durrani invades again and retakes the Punjab from the Marathas.: Ahmad Shah Durrani envahit de nouveau le pays et reprend le Pendjab aux Marathes.
  Battle of Udgir. The Nizam cedes Bijapur, Ahmadnagar, Daulatabad and Burhanpur to the Marathas.: Bataille d’Udgir. Le nizam cède Bijapur, Ahmadnagar, Daulatabad et Burhanpur aux Marathes.
  Mir Qasim, the new Nawab of Bengal, cedes Burdwan, Midnapore and Chittagong to the East India Company.: Mir Qasim, le nouveau nawab du Bengale, cède Burdwan, Midnapore et Chittagong à la Compagnie britannique des Indes orientales.
  Hyder Ali takes power in Mysore. After Panipat the Maratha chiefs Scindia and Holkar rule Gwalior and Malwa as states of their own within the Maratha Confederacy; Scindia also holds Burhanpur.: Hyder Ali prend le pouvoir au Mysore. Après Panipat, les chefs marathes Scindia et Holkar gouvernent Gwalior et le Malwa comme des États à part entière au sein de la Confédération marathe ; Scindia tient aussi Burhanpur.
  The British take Pondicherry after a long siege and raze its fortifications.: Les Britanniques prennent Pondichéry après un long siège et en rasent les fortifications.
  Prithvi Narayan Shah of Gorkha takes Makwanpur.: Prithvi Narayan Shah de Gorkha prend Makwanpur.
  Hyder Ali takes Bednur and ends the Keladi Nayaka kingdom.: Hyder Ali prend Bednur et met fin au royaume des Nayaka de Keladi.
  The Sikh misls take Lahore and the plains between the Indus and the Yamuna from the Durranis.: Les misls sikhs prennent aux Durrani Lahore et les plaines entre l’Indus et la Yamuna.
  Pondicherry is handed back to France under the Treaty of Paris (1763).: Pondichéry est rendue à la France en vertu du traité de Paris (1763).
  Treaty of Allahabad. The Mughal emperor grants the East India Company the diwani (revenue rights) of Bengal, Bihar and Odisha; the Company rules Bengal and Bihar.: Traité d’Allahabad. L’empereur moghol accorde à la Compagnie britannique des Indes orientales la diwani (le droit de percevoir les revenus) du Bengale, du Bihar et de l’Odisha ; la Compagnie gouverne le Bengale et le Bihar.
  Hyder Ali conquers Malabar and the Zamorin’s kingdom of Calicut.: Hyder Ali conquiert le Malabar et le royaume du zamorin de Calicut.
  Treaty of Batticaloa, after the Kandyan–Dutch war. Kandy cedes the whole coast of Sri Lanka, with Batticaloa and Trincomalee, to the Dutch.: Traité de Batticaloa, après la guerre entre Kandy et les Néerlandais. Kandy cède aux Néerlandais toute la côte du Sri Lanka, avec Batticaloa et Trincomalee.
  The Nizam cedes the Northern Circars to the East India Company.: Le nizam cède les Circars du Nord à la Compagnie britannique des Indes orientales.
  "Prithvi Narayan Shah takes Kathmandu; Lalitpur and Bhaktapur fall by 1769: the Kingdom of Nepal.": "Prithvi Narayan Shah prend Katmandou ; Lalitpur et Bhaktapur tombent avant la fin de 1769 : c’est le royaume du Népal."
  Rohilla War. The Nawab of Awadh annexes Rohilkhand with the help of East India Company troops. Prithvi Narayan Shah conquers the Kirat country and Morang, eastern Nepal.: Guerre des Rohilla. Le nawab d’Awadh annexe le Rohilkhand avec l’aide de troupes de la Compagnie britannique des Indes orientales. Prithvi Narayan Shah conquiert le pays kirat et le Morang, dans l’est du Népal.
  Treaty of Faizabad. The Nawab of Awadh cedes the Benares zamindari to the East India Company.: Traité de Faizabad. Le nawab d’Awadh cède le zamindari de Bénarès à la Compagnie britannique des Indes orientales.
  The British take Pondicherry again, after France joins the American War of Independence.: Les Britanniques reprennent Pondichéry, après l’entrée de la France dans la guerre d’indépendance américaine.
  Hyder Ali takes Cuddapah and the land of the Pathan nawabs of Cuddapah and Kurnool.: Hyder Ali prend Cuddapah et les terres des nawabs pathans de Cuddapah et de Kurnool.
  The Peshwa’s governor of Saugor ends the Gond kingdom of Garha-Mandla; Mandla passes to the Bhonsles of Nagpur in 1799.: Le gouverneur du peshwa à Saugor met fin au royaume gond de Garha-Mandla ; Mandla passe aux Bhonsle de Nagpur en 1799.
  "Battle of Halani. Mir Fateh Ali Khan Talpur overthrows the Kalhoras: the Talpur Mirs rule Sind.": "Bataille de Halani. Mir Fateh Ali Khan Talpur renverse les Kalhora : les Mirs Talpur gouvernent le Sind."
  Pondicherry is returned to France under the Treaty of Versailles (1783).: Pondichéry est rendue à la France en vertu du traité de Versailles (1783).
  About 1785. Mahadji Scindia controls Delhi, Agra and the upper Doab as regent of the Mughal emperor.: Vers 1785. Mahadji Scindia contrôle Delhi, Agra et le haut Doab en tant que régent de l’empereur moghol.
  Nepal conquers the Chaubisi principalities of central Nepal.: Le Népal conquiert les principautés Chaubisi du centre du Népal.
  Nepal conquers the Baise principalities of the west, with Jumla, and invades Sikkim.: Le Népal conquiert les principautés Baise de l’ouest, avec Jumla, et envahit le Sikkim.
  Nepal conquers the Chand kingdom of Kumaon.: Le Népal conquiert le royaume chand du Kumaon.
  Treaty of Seringapatam, after the Third Anglo-Mysore War. Tipu Sultan cedes Malabar, Salem and the Baramahal to the East India Company, and Bellary and Cuddapah to the Nizam.: Traité de Seringapatam, après la troisième guerre anglo-mysorienne. Tipu Sultan cède le Malabar, Salem et le Baramahal à la Compagnie britannique des Indes orientales, et Bellary et Cuddapah au nizam.
  The British take Pondicherry in the war with revolutionary France; they hold it, but for a few months in 1802–1803, until 1816.: Les Britanniques prennent Pondichéry pendant la guerre contre la France révolutionnaire ; ils la gardent jusqu’en 1816, à l’exception de quelques mois en 1802–1803.
  "The British take Jaffna and, in 1796, Colombo: the Dutch possessions in Sri Lanka pass to Britain.": "Les Britanniques prennent Jaffna et, en 1796, Colombo : les possessions néerlandaises du Sri Lanka passent à la Grande-Bretagne."
  Seringapatam falls and Tipu Sultan is killed. The Wodeyars are restored to a smaller Mysore under British protection; the Company takes Kanara and Coimbatore. In October the Raja of Thanjavur cedes his kingdom to the Company, and in July Ranjit Singh takes Lahore.: Seringapatam tombe et Tipu Sultan est tué. Les Wodeyar sont rétablis à la tête d’un Mysore réduit, sous protection britannique ; la Compagnie prend le Kanara et Coimbatore. En octobre, le raja de Thanjavur cède son royaume à la Compagnie, et en juillet Ranjit Singh prend Lahore.
  The Nizam cedes the districts he received from Mysore (the Ceded Districts) to the East India Company.: Le nizam cède à la Compagnie britannique des Indes orientales les districts qu’il avait reçus du Mysore (les « Districts cédés »).
  The East India Company annexes the Carnatic. In November the Nawab of Awadh cedes Rohilkhand, the lower Doab and Gorakhpur.: La Compagnie britannique des Indes orientales annexe le Carnatic. En novembre, le nawab d’Awadh cède le Rohilkhand, le bas Doab et Gorakhpur.
  Battle of Delhi. Lake’s army defeats Scindia’s forces; the Company takes Delhi and the Mughal emperor comes under its protection.: Bataille de Delhi. L’armée de Lake bat les forces de Scindia ; la Compagnie prend Delhi et l’empereur moghol passe sous sa protection.
  Treaty of Deogaon. The Bhonsle of Nagpur cedes Odisha; under the Treaty of Surji-Anjangaon (30 December) Scindia cedes his lands north of the Jumna and in Gujarat. The Company also takes Bundelkhand from the Peshwa.: Traité de Deogaon. Le Bhonsle de Nagpur cède l’Odisha ; par le traité de Surji-Anjangaon (30 décembre), Scindia cède ses terres au nord de la Jumna et au Goujarat. La Compagnie prend aussi le Bundelkhand au peshwa.
  Nepal conquers Garhwal.: Le Népal conquiert le Garhwal.
  Nepal annexes the kingdom of Palpa, with Butwal, after executing its king, Prithvi Pal Sen.: Le Népal annexe le royaume de Palpa, avec Butwal, après avoir exécuté son roi, Prithvi Pal Sen.
  Ranjit Singh takes Jammu.: Ranjit Singh prend Jammu.
  Treaty of Amritsar. Ranjit Singh accepts the Sutlej as his border; the Cis-Sutlej states pass under British protection. Ranjit Singh takes Kangra from the Gorkhas.: Traité d’Amritsar. Ranjit Singh accepte le Sutlej comme frontière ; les États cis-Sutlej passent sous protection britannique. Ranjit Singh prend Kangra aux Gorkhas.
  Kandyan Convention. The British take Kandy, and the whole of Sri Lanka becomes British Ceylon.: Convention de Kandy. Les Britanniques prennent Kandy, et tout le Sri Lanka devient le Ceylan britannique.
  Treaty of Sugauli. Nepal cedes Kumaon, Garhwal and its lands in Sikkim to the East India Company; Garhwal is divided between British Garhwal and the princely state of Tehri Garhwal.: Traité de Sugauli. Le Népal cède le Kumaon, le Garhwal et ses terres du Sikkim à la Compagnie britannique des Indes orientales ; le Garhwal est partagé entre le Garhwal britannique et l’État princier de Tehri Garhwal.
  Pondicherry is returned to France for the third time.: Pondichéry est rendue à la France pour la troisième fois.
  Diwan Sawan Mal and the Sikh army take Multan from the Durranis.: Le diwan Sawan Mal et l’armée sikhe prennent Multan aux Durrani.
  "The Peshwa surrenders: the Third Anglo-Maratha War ends the Maratha Confederacy. The Company annexes the Peshwa’s lands; Scindia, Holkar and the Bhonsle become princely states, the Bhonsle losing the Narmada valley.": "Le peshwa se rend : la troisième guerre anglo-marathe met fin à la Confédération marathe. La Compagnie annexe les terres du peshwa ; Scindia, Holkar et le Bhonsle deviennent des États princiers, le Bhonsle perdant la vallée de la Narmada."
  Battle of Shopian. The Sikh Empire takes Kashmir from the Durranis.: Bataille de Shopian. L’Empire sikh prend le Cachemire aux Durrani.
  The Burmese occupy Assam; they have held Manipur since 1819.: Les Birmans occupent l’Assam ; ils tiennent le Manipur depuis 1819.
  Ranjit Singh makes Gulab Singh, a Dogra, Raja of Jammu.: Ranjit Singh fait de Gulab Singh, un Dogra, le raja de Jammu.
  Treaty of Yandabo. Burma gives up Assam and Manipur; the Company annexes Assam, and Manipur is restored under Gambhir Singh.: Traité de Yandabo. La Birmanie renonce à l’Assam et au Manipur ; la Compagnie annexe l’Assam, et le Manipur est restauré sous Gambhir Singh.
  The British restore Purandar Singha as Ahom king in Upper Assam.: Les Britanniques rétablissent Purandar Singha comme roi ahom dans le haut Assam.
  Zorawar Singh, Gulab Singh’s general, begins the conquest of Ladakh; the kingdom is annexed by 1842.: Zorawar Singh, le général de Gulab Singh, entreprend la conquête du Ladakh ; le royaume est annexé au plus tard en 1842.
  Hari Singh Nalwa occupies Peshawar for the Sikh Empire.: Hari Singh Nalwa occupe Peshawar pour l’Empire sikh.
  The British annex the Jaintia kingdom; with the Khasi hills (from 1833) Meghalaya comes under British rule.: Les Britanniques annexent le royaume jaintia ; avec les collines khasi (à partir de 1833), le Meghalaya passe sous domination britannique.
  The British depose Purandar Singha and annex Upper Assam.: Les Britanniques déposent Purandar Singha et annexent le haut Assam.
  Zorawar Singh conquers Baltistan; Gilgit follows in 1842.: Zorawar Singh conquiert le Baltistan ; Gilgit suit en 1842.
  Battle of Dubba (Hyderabad). After Miani, the British annex Sind.: Bataille de Dubba (Hyderabad). Après Miani, les Britanniques annexent le Sind.
  Treaty of Lahore, after the First Anglo-Sikh War. The Sikh Empire cedes the Jalandhar Doab and the hills between the Beas and the Sutlej.: Traité de Lahore, après la première guerre anglo-sikhe. L’Empire sikh cède le doab de Jalandhar et les collines entre la Beas et le Sutlej.
  "Treaty of Amritsar. The British sell Kashmir to Gulab Singh: the princely state of Jammu and Kashmir.": "Traité d’Amritsar. Les Britanniques vendent le Cachemire à Gulab Singh : c’est l’État princier de Jammu-et-Cachemire."
  After the Second Anglo-Sikh War the East India Company annexes the Punjab.: Après la seconde guerre anglo-sikhe, la Compagnie britannique des Indes orientales annexe le Pendjab.
  The Nizam assigns Berar to the East India Company to pay for the Hyderabad Contingent.: Le nizam remet le Berar à la Compagnie britannique des Indes orientales pour financer le contingent d’Hyderabad.
  The East India Company annexes the Nagpur kingdom of the Bhonsles under the doctrine of lapse.: La Compagnie britannique des Indes orientales annexe le royaume de Nagpur des Bhonsle en vertu de la doctrine de la déchéance.
  The East India Company annexes Awadh.: La Compagnie britannique des Indes orientales annexe l’Awadh.
  A British penal settlement is founded at Port Blair in the Andaman Islands.: Une colonie pénitentiaire britannique est fondée à Port Blair, dans les îles Andaman.
  Scindia cedes the Nimar district, with Khandwa, to British India in an exchange of territory.: Scindia cède le district de Nimar, avec Khandwa, à l’Inde britannique dans le cadre d’un échange de territoires.
  Treaty of Sinchula, after the Bhutan War. Bhutan cedes the Bengal and Assam Duars and Kalimpong to British India.: Traité de Sinchula, après la guerre du Bhoutan. Le Bhoutan cède les Duars du Bengale et de l’Assam, ainsi que Kalimpong, à l’Inde britannique.
  Treaty of Gandamak. Afghanistan cedes Pishin and Sibi to British India; Quetta is leased from Kalat in 1876–1883.: Traité de Gandamak. L’Afghanistan cède Pishin et Sibi à l’Inde britannique ; Quetta est prise à bail auprès de Kalat en 1876–1883.
  About 1881. The British complete the annexation of the Naga Hills, with Kohima.: Vers 1881. Les Britanniques achèvent l’annexion des collines naga, avec Kohima.
  The British annex the Lushai Hills (Mizoram).: Les Britanniques annexent les collines lushai (Mizoram).
  The Durand Line agreement fixes the border between Afghanistan and British India; the Pashtun tribal areas come under British political agents.: L’accord sur la ligne Durand fixe la frontière entre l’Afghanistan et l’Inde britannique ; les zones tribales pachtounes passent sous l’autorité d’agents politiques britanniques.
  The Arakkal ruler of Cannanore cedes the Laccadive Islands to British India.: Le souverain arakkal de Cannanore cède les îles Laquedives à l’Inde britannique.
  Simla Convention. The McMahon Line between Tibet and British India puts the hills north of Assam on the British side; they are not administered until the 1940s, Tawang until 1951.: Convention de Simla. La ligne McMahon entre le Tibet et l’Inde britannique place les collines au nord de l’Assam du côté britannique ; elles ne sont administrées qu’à partir des années 1940, et Tawang qu’à partir de 1951.
  Partition of India. Pakistan becomes independent, with Sind, western Punjab, the North-West Frontier, British Baluchistan and East Bengal; Sylhet joins East Bengal after a referendum.: Partition des Indes. Le Pakistan devient indépendant, avec le Sind, l’ouest du Pendjab, la Frontière du Nord-Ouest, le Baloutchistan britannique et le Bengale oriental ; Sylhet rejoint le Bengale oriental après un référendum.
  India becomes independent. Most princely states have acceded to it; Hyderabad, Jammu and Kashmir and others have not yet decided.: L’Inde devient indépendante. La plupart des États princiers y ont adhéré ; Hyderabad, le Jammu-et-Cachemire et d’autres ne se sont pas encore décidés.
  Bahawalpur accedes to Pakistan.: Bahawalpur adhère au Pakistan.
  Rebels in the west of Jammu and Kashmir, backed by Pakistani tribesmen, proclaim Azad (Free) Kashmir; the area they hold stays under Pakistani control.: Des rebelles de l’ouest du Jammu-et-Cachemire, soutenus par des combattants tribaux pakistanais, proclament l’Azad Cachemire (« Cachemire libre ») ; la zone qu’ils tiennent reste sous contrôle pakistanais.
  Maharaja Hari Singh accedes Jammu and Kashmir to India; the First Kashmir War follows. The ceasefire of 1 January 1949 leaves the valley, Jammu and Ladakh under Indian control.: Le maharaja Hari Singh fait adhérer le Jammu-et-Cachemire à l’Inde ; la première guerre du Cachemire s’ensuit. Le cessez-le-feu du 1er janvier 1949 laisse la vallée, Jammu et le Ladakh sous contrôle indien.
  After the Gilgit Scouts’ revolt (1 November) Pakistan takes over the Gilgit Agency; Baltistan follows in 1948.: Après la révolte des Gilgit Scouts (1er novembre), le Pakistan prend le contrôle de l’agence de Gilgit ; le Baltistan suit en 1948.
  Ceylon becomes an independent dominion.: Ceylan devient un dominion indépendant.
  The Khan of Kalat accedes to Pakistan.: Le khan de Kalat adhère au Pakistan.
  Operation Polo. The Nizam surrenders and Hyderabad is annexed to India.: Opération Polo. Le nizam capitule et Hyderabad est annexé à l’Inde.
  France hands over the administration of Pondicherry, Karaikal, Mahé and Yanam to India (de jure in 1962).: La France transfère à l’Inde l’administration de Pondichéry, Karikal, Mahé et Yanaon (de jure en 1962).
  India annexes Goa, Daman and Diu after a two-day military operation. Dadra and Nagar Haveli, freed from Portuguese rule in 1954, is merged into India in August.: L’Inde annexe Goa, Daman et Diu après une opération militaire de deux jours. Le territoire de Dadra et Nagar Haveli, libéré de la domination portugaise en 1954, est intégré à l’Inde en août.
  "The Pakistani army surrenders in Dhaka: East Pakistan becomes the independent state of Bangladesh, proclaimed on 26 March.": "L’armée pakistanaise capitule à Dacca : le Pakistan oriental devient l’État indépendant du Bangladesh, proclamé le 26 mars."
  Sikkim becomes a state of India after a referendum.: Le Sikkim devient un État de l’Inde après un référendum.
  Operation Meghdoot. Indian troops occupy the Siachen Glacier, north of the end of the 1949 ceasefire line; the two armies have faced each other there since.: Opération Meghdoot. Les troupes indiennes occupent le glacier de Siachen, au nord de l’extrémité de la ligne de cessez-le-feu de 1949 ; les deux armées s’y font face depuis lors.
  About 800. Tang China rules from Chang’an but has lost the north-west to the Tibetan Empire, which holds the Hexi Corridor, Gansu west of the Liupan Mountains, Qinghai and the Tarim; the Kingdom of Khotan is its vassal. The Uyghur Khaganate rules Mongolia, Dzungaria and Turfan, the Karluks the Ili and Semirechye, the Oghuz the lower Syr Darya and the Kimek–Kipchak confederation the Irtysh steppe. In the north-east the Khitan tribes live on the Liao and Xar Moron rivers and Balhae rules Manchuria; Nanzhao rules Yunnan. The peoples of Siberia, the Mohe tribes of the Amur and the indigenous peoples of Taiwan live outside any state.: Vers 800. La Chine des Tang gouverne depuis Chang’an, mais a perdu le nord-ouest au profit de l’Empire tibétain, qui tient le corridor du Hexi, le Gansu à l’ouest des monts Liupan, le Qinghai et le Tarim ; le royaume de Khotan est son vassal. Le khaganat ouïghour règne sur la Mongolie, la Dzoungarie et Tourfan, les Karlouks sur l’Ili et le Semiretchie, les Oghouzes sur le bas Syr-Daria et la confédération kimek-kiptchak sur la steppe de l’Irtych. Au nord-est, les tribus khitanes vivent sur les rivières Liao et Xar Moron, et le Balhae règne sur la Mandchourie ; le Nanzhao règne sur le Yunnan. Les peuples de Sibérie, les tribus mohe de l’Amour et les peuples autochtones de Taïwan vivent hors de tout État.
  The Yenisei Kyrgyz take the Uyghur capital Ordu-Baliq and destroy the Uyghur Khaganate. Uyghur groups flee to the Tang frontier, to Gansu and to Turfan, where they found the Kingdom of Qocho; the Karluks take western Dzungaria. Inner Mongolia and Hulunbuir are left to the Shatuo, Tatar and Shiwei tribes.: Les Kirghizes de l’Ienisseï prennent Ordu-Baliq, la capitale ouïghoure, et détruisent le khaganat ouïghour. Des groupes ouïghours fuient vers la frontière des Tang, vers le Gansu et vers Tourfan, où ils fondent le royaume de Qocho ; les Karlouks prennent la Dzoungarie occidentale. La Mongolie-Intérieure et Hulunbuir sont laissées aux tribus shatuo, tatares et shiwei.
  The Samanid Nuh ibn Asad takes Isfijab (Sayram) from its Turkic rulers.: Le Samanide Nuh ibn Asad prend Isfijab (Sayram) à ses souverains turcs.
  The Tibetan Empire breaks up after the death of the emperor Langdarma; Tibetan rule over Amdo, Kham and the Tarim collapses. The Karluks take Kashgar.: L’Empire tibétain se disloque après la mort de l’empereur Langdarma ; la domination tibétaine sur l’Amdo, le Kham et le Tarim s’effondre. Les Karlouks prennent Kachgar.
  Zhang Yichao drives the Tibetans out of Shazhou (Dunhuang).: Zhang Yichao chasse les Tibétains de Shazhou (Dunhuang).
  Tang China recovers Qinzhou, Yuanzhou and the passes west of the Liupan Mountains from Tibet.: La Chine des Tang reprend au Tibet Qinzhou, Yuanzhou et les cols situés à l’ouest des monts Liupan.
  Zhang Yichao, now governor of the Guiyi circuit under the Tang, holds the Hexi Corridor and Hami; Liangzhou (Wuwei) follows in 861.: Zhang Yichao, désormais gouverneur du circuit de Guiyi pour les Tang, tient le corridor du Hexi et Hami ; Liangzhou (Wuwei) suit en 861.
  Nanzhao takes Xizhou (Xichang) south of the Dadu River and besieges Chengdu; after Gao Pian’s campaign of 875 the Dadu stays the border.: Le Nanzhao prend Xizhou (Xichang), au sud de la rivière Dadu, et assiège Chengdu ; après la campagne de Gao Pian en 875, la Dadu reste la frontière.
  The Kingdom of Qocho takes Yizhou (Hami) from the Guiyi circuit.: Le royaume de Qocho prend Yizhou (Hami) au circuit de Guiyi.
  The Tangut chief Tuoba Sigong is made military governor of Xiazhou (the Dingnan circuit) for his help against Huang Chao; his family rules the Ordos borderland as a hereditary circuit.: Le chef tangoute Tuoba Sigong est nommé gouverneur militaire de Xiazhou (le circuit de Dingnan) pour l’aide qu’il a apportée contre Huang Chao ; sa famille gouverne les marches de l’Ordos comme un circuit héréditaire.
  The Samanid Ismail takes Taraz (Talas) from the Karluks.: Le Samanide Ismaïl prend Taraz (Talas) aux Karlouks.
  About 894. Uyghurs settled in Gansu found the Ganzhou Uyghur Kingdom at Zhangye; the Guiyi circuit is left with Guazhou and Shazhou.: Vers 894. Des Ouïghours établis au Gansu fondent le royaume ouïghour de Ganzhou à Zhangye ; il ne reste au circuit de Guiyi que Guazhou et Shazhou.
  "Zhu Wen deposes the last Tang emperor and founds the Later Liang at Kaifeng: the Five Dynasties and Ten Kingdoms. Li Keyong’s Jin holds Shanxi, Liu Shouguang’s Lulong circuit holds Youzhou (Beijing), Li Maozhen’s Qi holds Fengxiang and eastern Gansu; in the south Wu, Wuyue, Min, Chu, Lingnan (the later Southern Han) and Former Shu go their own way.": "Zhu Wen dépose le dernier empereur Tang et fonde les Liang postérieurs à Kaifeng : c’est le début des Cinq Dynasties et Dix Royaumes. Le Jin de Li Keyong tient le Shanxi, le circuit de Lulong de Liu Shouguang tient Youzhou (Pékin), et le Qi de Li Maozhen tient Fengxiang et l’est du Gansu ; au sud, Wu, Wuyue, Min, Chu, Lingnan (le futur Han du Sud) et les Shu antérieurs deviennent indépendants."
  Li Cunxu of Jin captures Liu Shouguang and annexes Yan.: Li Cunxu, du Jin, capture Liu Shouguang et annexe le Yan.
  Former Shu takes Qinzhou (Tianshui) from Qi and the Jingnan circuit goes over to the Later Liang; Li Maozhen is left with Fengxiang.: Les Shu antérieurs prennent Qinzhou (Tianshui) au Qi, et le circuit de Jingnan se rallie aux Liang postérieurs ; il ne reste à Li Maozhen que Fengxiang.
  Abaoji of the Khitans campaigns west across the Yinshan, subjecting the Tuyuhun, Tangut and Tatar tribes of Inner Mongolia; the Weibo army in southern Hebei has gone over to Jin.: Abaoji, chef des Khitans, mène campagne vers l’ouest au-delà des monts Yinshan et soumet les tribus tuyuhun, tangoutes et tatares de Mongolie-Intérieure ; l’armée de Weibo, dans le sud du Hebei, est passée au Jin.
  Li Cunxu, who has proclaimed the Later Tang, takes Kaifeng; the Later Liang falls and Jin’s lands become the core of the Later Tang.: Li Cunxu, qui a proclamé les Tang postérieurs, prend Kaifeng ; les Liang postérieurs tombent et les terres du Jin deviennent le cœur des Tang postérieurs.
  "Li Maozhen of Qi submits to the Later Tang. Abaoji’s western campaign reaches the Orkhon: the Kyrgyz withdraw to the Yenisei and the Khitans dominate the Mongolian steppe.": "Li Maozhen, du Qi, se soumet aux Tang postérieurs. La campagne occidentale d’Abaoji atteint l’Orkhon : les Kirghizes se replient sur l’Ienisseï et les Khitans dominent la steppe mongole."
  The Later Tang conquers Former Shu.: Les Tang postérieurs conquièrent les Shu antérieurs.
  Abaoji destroys Balhae and sets up the Dongdan kingdom under his son in its place; the Mohe peoples of the east keep to themselves.: Abaoji détruit le Balhae et établit à sa place le royaume de Dongdan, confié à son fils ; les peuples mohe de l’est restent à l’écart.
  About 930. Nyima Gon, a descendant of the Tibetan emperors, founds a kingdom in Ngari in western Tibet; Guge is its central part.: Vers 930. Nyima Gon, descendant des empereurs tibétains, fonde un royaume dans le Ngari, dans l’ouest du Tibet ; le Guge en est la partie centrale.
  Meng Zhixiang, the Later Tang governor of Sichuan, proclaims the Later Shu.: Meng Zhixiang, gouverneur du Sichuan pour les Tang postérieurs, proclame les Shu postérieurs.
  The Later Jin cedes the Sixteen Prefectures, from Youzhou to Yunzhou (Datong), to the Liao in return for Khitan help in Shi Jingtang’s revolt (936).: Les Jin postérieurs cèdent aux Liao les Seize Préfectures, de Youzhou à Yunzhou (Datong), en échange de l’aide khitane apportée à la révolte de Shi Jingtang (936).
  About 940. The Karakhanids, who turn to Islam under Satuq Bughra Khan, rule Kashgar, the Ili and Semirechye from Balasagun.: Vers 940. Les Karakhanides, qui se convertissent à l’islam sous Satuq Bughra Khan, gouvernent Kachgar, l’Ili et le Semiretchie depuis Balasagun.
  Southern Tang conquers Min. Fuzhou goes its own way under Li Renda, and Quanzhou and Zhangzhou under Liu Congxiao.: Les Tang du Sud conquièrent le Min. Fuzhou fait sécession sous Li Renda, et Quanzhou et Zhangzhou sous Liu Congxiao.
  Wuyue takes Fuzhou, defeating a Southern Tang army sent against Li Renda.: Le Wuyue prend Fuzhou après avoir battu une armée des Tang du Sud envoyée contre Li Renda.
  Liu Congxiao rules Quanzhou and Zhangzhou as the autonomous Qingyuan circuit.: Liu Congxiao gouverne Quanzhou et Zhangzhou comme circuit autonome de Qingyuan.
  Guo Wei founds the Later Zhou; Liu Chong, the brother of the last Later Han emperor, founds the Northern Han in Taiyuan.: Guo Wei fonde les Zhou postérieurs ; Liu Chong, frère du dernier empereur des Han postérieurs, fonde les Han du Nord à Taiyuan.
  Southern Tang conquers Chu; Southern Han takes the Chu prefectures in Guangxi.: Les Tang du Sud conquièrent le Chu ; les Han du Sud prennent les préfectures du Chu situées dans le Guangxi.
  Liu Yan and Zhou Xingfeng drive the Southern Tang out of Hunan (Wuping).: Liu Yan et Zhou Xingfeng chassent les Tang du Sud du Hunan (Wuping).
  Southern Tang cedes all its land north of the Yangtze to the Later Zhou after the Huainan campaigns.: Après les campagnes du Huainan, les Tang du Sud cèdent aux Zhou postérieurs toutes leurs terres au nord du Yangzi.
  Zhao Kuangyin takes the throne of the Later Zhou and founds the Song dynasty.: Zhao Kuangyin s’empare du trône des Zhou postérieurs et fonde la dynastie Song.
  Song takes Jingnan and Hunan (Wuping).: Les Song prennent le Jingnan et le Hunan (Wuping).
  Song conquers the Later Shu.: Les Song conquièrent les Shu postérieurs.
  Song conquers the Southern Han.: Les Song conquièrent les Han du Sud.
  Song takes Jinling (Nanjing); the Southern Tang falls.: Les Song prennent Jinling (Nankin) ; les Tang du Sud tombent.
  Qian Chu of Wuyue and Chen Hongjin of Qingyuan surrender their lands to the Song.: Qian Chu, du Wuyue, et Chen Hongjin, du Qingyuan, remettent leurs terres aux Song.
  Song conquers the Northern Han, the last of the Ten Kingdoms; the Song–Liao war follows.: Les Song conquièrent les Han du Nord, le dernier des Dix Royaumes ; la guerre entre les Song et les Liao s’ensuit.
  Hasan Bughra Khan of the Karakhanids takes Isfijab from the Samanids without a fight; Taraz follows.: Hasan Bughra Khan, des Karakhanides, prend Isfijab aux Samanides sans combat ; Taraz suit.
  Li Jiqian, the Tangut leader who has fought the Song since 982, takes Lingzhou.: Li Jiqian, le chef tangoute qui combat les Song depuis 982, prend Lingzhou.
  The Karakhanids conquer the Buddhist Kingdom of Khotan after a long war.: Les Karakhanides conquièrent le royaume bouddhiste de Khotan après une longue guerre.
  Li Yuanhao takes Ganzhou and ends the Ganzhou Uyghur Kingdom; the Tanguts hold the Hexi Corridor and the Alxa desert.: Li Yuanhao prend Ganzhou et met fin au royaume ouïghour de Ganzhou ; les Tangoutes tiennent le corridor du Hexi et le désert d’Alxa.
  Gusiluo, a descendant of the Tibetan emperors, makes Qingtang (Xining) the capital of the Tsongkha kingdom in Amdo.: Gusiluo, descendant des empereurs tibétains, fait de Qingtang (Xining) la capitale du royaume de Tsongkha, dans l’Amdo.
  Western Xia takes Guazhou and Shazhou (Dunhuang); the Guiyi circuit ends.: Les Xia occidentaux prennent Guazhou et Shazhou (Dunhuang) ; c’est la fin du circuit de Guiyi.
  About 1050. The Kimek confederation on the Irtysh gives way to the Kipchaks, who spread over the steppe; the Kipchaks also displace the Oghuz on the lower Syr Darya.: Vers 1050. La confédération kimek de l’Irtych cède la place aux Kiptchaks, qui se répandent sur la steppe ; les Kiptchaks supplantent aussi les Oghouzes sur le bas Syr-Daria.
  Wang Shao’s Xihe campaign brings Hezhou, Taozhou and Minzhou under the Song; Lanzhou is taken from Western Xia in 1081.: La campagne du Xihe menée par Wang Shao place Hezhou, Taozhou et Minzhou sous l’autorité des Song ; Lanzhou est prise aux Xia occidentaux en 1081.
  Song takes Xining and ends the Tsongkha kingdom.: Les Song prennent Xining et mettent fin au royaume de Tsongkha.
  Aguda of the Wanyan Jurchens proclaims the Jin dynasty after his victories over the Liao at Ningjiang and Chuhedian (1114) and takes Huanglong.: Aguda, des Jürchen Wanyan, proclame la dynastie Jin après ses victoires sur les Liao à Ningjiang et à Chuhedian (1114) et prend Huanglong.
  Jin takes Liaoyang and the Liaodong peninsula.: Les Jin prennent Liaoyang et la péninsule du Liaodong.
  Jin takes the Liao Supreme Capital.: Les Jin prennent la capitale suprême des Liao.
  Jin takes the Liao Central and Western capitals; the Song attack on the Southern Capital (Beijing) fails, and Jin takes it in December.: Les Jin prennent les capitales centrale et occidentale des Liao ; l’attaque des Song contre la capitale du Sud (Pékin) échoue, et les Jin la prennent en décembre.
  Jin hands Yanjing (Beijing) and six prefectures to the Song for an annual payment.: Les Jin remettent Yanjing (Pékin) et six préfectures aux Song contre un paiement annuel.
  "Jin captures the last Liao emperor. The Mongolian steppe falls to tribal confederations: the Kereit on the Tuul and Orkhon, the Naimans in the west, the Merkits on the Selenga, the Tatars by Lake Hulun and the Mongols on the Onon and Kherlen, who form the Khamag Mongol (about 1130).": "Les Jin capturent le dernier empereur Liao. La steppe mongole revient à des confédérations tribales : les Kereït sur la Tuul et l’Orkhon, les Naïmans à l’ouest, les Merkites sur la Selenga, les Tatars près du lac Hulun et les Mongols sur l’Onon et le Kherlen, qui forment le Khamag Mongol (vers 1130)."
  Jin invades the Song and retakes Yanjing.: Les Jin envahissent le territoire des Song et reprennent Yanjing.
  Jin takes Kaifeng and carries off the Song emperors (the Jingkang incident); Hebei and Shanxi are in Jin hands. The Song court re-forms in the south.: Les Jin prennent Kaifeng et emmènent en captivité les empereurs Song (l’incident de Jingkang) ; le Hebei et le Shanxi sont aux mains des Jin. La cour Song se reconstitue dans le sud.
  Jin takes Shandong and Henan.: Les Jin prennent le Shandong et le Henan.
  Jin sets up the puppet state of Qi under Liu Yu to rule Henan and Shandong; Shaanxi is added after the Song defeat at Fuping (1130).: Les Jin créent l’État fantoche de Qi, dirigé par Liu Yu, pour gouverner le Henan et le Shandong ; le Shaanxi y est ajouté après la défaite des Song à Fuping (1130).
  Jin takes the Xihe region, Xining and Tianshui from the Song.: Les Jin prennent aux Song la région du Xihe, Xining et Tianshui.
  Yelü Dashi, founder of the Qara Khitai, takes Balasagun; the Karakhanids of Kashgar and the Kingdom of Qocho become his vassals.: Yelü Dashi, fondateur des Kara Khitaï, prend Balasagun ; les Karakhanides de Kachgar et le royaume de Qocho deviennent ses vassaux.
  Western Xia takes Xining from the Jin.: Les Xia occidentaux prennent Xining aux Jin.
  Jin abolishes the Qi state and rules its lands directly.: Les Jin abolissent l’État de Qi et gouvernent directement ses terres.
  Under a peace agreed in 1138 the Jin hand Henan and Shaanxi back to the Song.: En vertu d’une paix conclue en 1138, les Jin rendent le Henan et le Shaanxi aux Song.
  The Jin break the peace and retake Henan and Shaanxi; the Treaty of Shaoxing (1142) fixes the border on the Huai River and the Dasan Pass.: Les Jin rompent la paix et reprennent le Henan et le Shaanxi ; le traité de Shaoxing (1142) fixe la frontière sur la rivière Huai et au col de Dasan.
  About 1152. The Khwarazmshah Atsiz takes Jend and the lower Syr Darya.: Vers 1152. Le khwarezmchah Atsiz prend Jend et le bas Syr-Daria.
  Temüjin destroys the Tatars.: Temüdjin anéantit les Tatars.
  Temüjin defeats the Kereit and takes their lands.: Temüdjin bat les Kereït et prend leurs terres.
  Temüjin defeats the Naimans at Chakirmaut and the Merkits.: Temüdjin bat les Naïmans à Chakirmaut, ainsi que les Merkites.
  "Jochi subdues the forest peoples: the Oirats, the Kyrgyz of the Yenisei and the Buryat and Tuvan tribes submit to the Mongols.": "Djötchi soumet les peuples de la forêt : les Oïrats, les Kirghizes de l’Ienisseï et les tribus bouriates et touvaines font allégeance aux Mongols."
  The Khwarazmshah Muhammad II defeats the Qara Khitai and takes Otrar, Isfijab and Taraz.: Le khwarezmchah Muhammad II bat les Kara Khitaï et prend Otrar, Isfijab et Taraz.
  Kuchlug, the Naiman prince who has usurped the Qara Khitai throne, takes Kashgar and Khotan from the Karakhanids.: Kütchlüg, le prince naïman qui a usurpé le trône des Kara Khitaï, prend Kachgar et Khotan aux Karakhanides.
  The Mongols take the Jin Central Capital (Beijing); the Jin court has moved to Kaifeng. The north of the Jin realm, from Liaoxi to Datong, is in Mongol hands.: Les Mongols prennent la capitale centrale des Jin (Pékin) ; la cour Jin s’est repliée à Kaifeng. Le nord du royaume Jin, du Liaoxi à Datong, est aux mains des Mongols.
  Puxian Wannu, a Jin general, founds Eastern Xia in eastern Manchuria and the Ussuri country.: Puxian Wannu, un général Jin, fonde les Xia orientaux dans l’est de la Mandchourie et le pays de l’Oussouri.
  The Mongols take Otrar, Jend and the cities of the Syr Darya; Muqali’s campaigns take Hebei and Shanxi from the Jin.: Les Mongols prennent Otrar, Jend et les villes du Syr-Daria ; les campagnes de Muqali enlèvent le Hebei et le Shanxi aux Jin.
  About 1222. The Mongols conquer the Kipchak steppe east of the Urals.: Vers 1222. Les Mongols conquièrent la steppe kiptchak à l’est de l’Oural.
  "Genghis Khan’s last campaign takes the Hexi Corridor from Western Xia: Ganzhou, Suzhou and Liangzhou fall in the summer.": "La dernière campagne de Gengis Khan enlève le corridor du Hexi aux Xia occidentaux : Ganzhou, Suzhou et Liangzhou tombent pendant l’été."
  Li Quan, besieged in Yidu since 1226, surrenders to the Mongols and is made governor of Shandong.: Li Quan, assiégé dans Yidu depuis 1226, se rend aux Mongols et est nommé gouverneur du Shandong.
  Western Xia surrenders and is destroyed, days after Genghis Khan’s death.: Les Xia occidentaux se rendent et sont anéantis, quelques jours après la mort de Gengis Khan.
  The Mongols take Fengxiang and Guanzhong.: Les Mongols prennent Fengxiang et le Guanzhong.
  The Mongols take Nanjing (Yanji) and end Eastern Xia.: Les Mongols prennent Nanjing (Yanji) et mettent fin aux Xia orientaux.
  The last Jin emperor dies at Caizhou; the Mongols hold all of the former Jin realm.: Le dernier empereur Jin meurt à Caizhou ; les Mongols tiennent tout l’ancien royaume Jin.
  Batu’s western campaign subdues the Bashkirs and the forest-steppe of the Tobol and the Tura.: La campagne occidentale de Batu soumet les Bachkirs et la forêt-steppe du Tobol et de la Toura.
  The Mongols take Hanzhong and sack Chengdu.: Les Mongols prennent Hanzhong et mettent Chengdu à sac.
  "Doorda Darkhan’s expedition: the Mongols raid central Tibet and take Amdo.": "Expédition de Doorda Darkhan : les Mongols lancent un raid sur le Tibet central et prennent l’Amdo."
  The Mongols hold the Sichuan basin; the Song keep Chongqing and the east.: Les Mongols tiennent le bassin du Sichuan ; les Song gardent Chongqing et l’est.
  Batu’s Ulus of Jochi (the Golden Horde) takes over the steppe from the Irtysh to the Volga.: L’oulous de Djötchi (la Horde d’or), dirigé par Batu, prend possession de la steppe, de l’Irtych à la Volga.
  Kublai takes Dali; the Mongols end the Dali Kingdom and the chiefdoms of Kham submit to them.: Kubilai prend Dali ; les Mongols mettent fin au royaume de Dali et les chefferies du Kham se soumettent à eux.
  About 1260. Alghu makes the Ulus of Chagatai independent of the Great Khan; it holds the Ili, Semirechye and the Tarim oases.: Vers 1260. Alghu rend l’oulous de Djaghataï indépendant du grand khan ; il tient l’Ili, le Semiretchie et les oasis du Tarim.
  Kublai is proclaimed Great Khan at Kaiping (Shangdu); his brother Ariq Böke holds Karakorum and Mongolia. Kublai’s realm is the Yuan dynasty (named in 1271).: Kubilai est proclamé grand khan à Kaiping (Shangdu) ; son frère Ariq Böke tient Karakorum et la Mongolie. Le domaine de Kubilai constitue la dynastie Yuan (nom adopté en 1271).
  Ariq Böke surrenders to Kublai; Mongolia comes under the Yuan.: Ariq Böke se rend à Kubilai ; la Mongolie passe sous l’autorité des Yuan.
  Kaidu, grandson of Ögedei, rules Dzungaria and dominates the Chagatai Khanate; the western Mongol khanates no longer obey the Yuan.: Qaïdu, petit-fils d’Ögedei, gouverne la Dzoungarie et domine le khanat de Djaghataï ; les khanats mongols de l’ouest n’obéissent plus aux Yuan.
  Xiangyang surrenders to the Yuan after a five-year siege.: Xiangyang se rend aux Yuan après un siège de cinq ans.
  The Yuan general Bayan has crossed the Yangtze; Jiankang (Nanjing) and the land south of the river fall.: Le général Yuan Bayan a franchi le Yangzi ; Jiankang (Nankin) et les terres au sud du fleuve tombent.
  The Song court at Lin’an (Hangzhou) surrenders to Bayan; Song loyalists fight on in the south.: La cour Song de Lin’an (Hangzhou) se rend à Bayan ; des loyalistes Song poursuivent la lutte dans le sud.
  Yangzhou and Luzhou (Hefei), the last Song strongholds between the Huai and the Yangtze, surrender.: Yangzhou et Luzhou (Hefei), derniers bastions Song entre la Huai et le Yangzi, se rendent.
  The Yuan take Fujian and Guangxi.: Les Yuan prennent le Fujian et le Guangxi.
  Chongqing falls to the Yuan.: Chongqing tombe aux mains des Yuan.
  The Yuan bring the chiefdoms of Guizhou under their administration.: Les Yuan placent les chefferies du Guizhou sous leur administration.
  "Battle of Yamen: the last Song fleet is destroyed and the boy emperor drowned.": "Bataille de Yamen : la dernière flotte Song est détruite et l’enfant empereur meurt noyé."
  The Uyghur ruler of Qocho withdraws to Gansu before Kaidu’s armies; Turfan passes to the Chagatai Khanate, Hami stays with the Yuan.: Le souverain ouïghour de Qocho se replie au Gansu devant les armées de Qaïdu ; Tourfan passe au khanat de Djaghataï, Hami reste aux Yuan.
  "The Chagatai Khanate splits: the eastern khans rule Moghulistan, from the Ili to the Tarim and Turfan, while Transoxiana is run by Turkic emirs.": "Le khanat de Djaghataï se scinde : les khans orientaux règnent sur le Moghulistan, de l’Ili au Tarim et à Tourfan, tandis que la Transoxiane est gouvernée par des émirs turcs."
  Ming Yuzhen, a Red Turban leader who has held Chongqing since 1357, proclaims the Xia dynasty and rules Sichuan.: Ming Yuzhen, un chef des Turbans rouges qui tient Chongqing depuis 1357, proclame la dynastie Xia et règne sur le Sichuan.
  Zhu Yuanzhang proclaims the Ming dynasty at Nanjing; his armies hold the Yangtze valley and take Fujian, Guangdong and Guangxi in the spring.: Zhu Yuanzhang proclame la dynastie Ming à Nankin ; ses armées tiennent la vallée du Yangzi et prennent le Fujian, le Guangdong et le Guangxi au printemps.
  Ming troops take Dadu (Beijing); the Yuan court flees to Mongolia, where it rules as the Northern Yuan.: Les troupes Ming prennent Dadu (Pékin) ; la cour Yuan s’enfuit en Mongolie, où elle règne sous le nom de Yuan du Nord.
  Ming takes Shanxi, Shaanxi and Gansu; Hainan submits.: Les Ming prennent le Shanxi, le Shaanxi et le Gansu ; Hainan se soumet.
  About 1370. The Ming garrison Dongsheng in the Ordos.: Vers 1370. Les Ming placent une garnison à Dongsheng, dans l’Ordos.
  Ming conquers the Xia state in Sichuan and takes Xining; the Yuan governor of Liaodong surrenders.: Les Ming conquièrent l’État Xia au Sichuan et prennent Xining ; le gouverneur Yuan du Liaodong se rend.
  Ming extends the Great Wall line to Jiayu Pass and holds the Hexi Corridor; Dunhuang is ruled by Mongol princes as a Ming guard. In Amdo and Kham the Tibetan chiefs take Ming titles.: Les Ming prolongent la ligne de la Grande Muraille jusqu’au col de Jiayu et tiennent le corridor du Hexi ; Dunhuang est gouvernée par des princes mongols comme garde des Ming. Dans l’Amdo et le Kham, les chefs tibétains reçoivent des titres Ming.
  About 1376. Timur takes Sayram and Yasi (Turkistan), where he later builds the mausoleum of Khoja Ahmad Yasawi.: Vers 1376. Tamerlan prend Sayram et Yasi (Turkistan), où il fera plus tard bâtir le mausolée de Khoja Ahmed Yasavi.
  About 1380. The Chagatayid prince Gunashiri rules Hami (Kara Del); it becomes a Ming guard in 1406.: Vers 1380. Le prince djaghataïde Gunashiri gouverne Hami (Kara Del) ; elle devient une garde des Ming en 1406.
  Ming conquers Yunnan from the Yuan Prince of Liang and brings Guizhou under its rule.: Les Ming enlèvent le Yunnan au prince Yuan de Liang et placent le Guizhou sous leur autorité.
  Naghachu, the Northern Yuan commander in Manchuria, surrenders to the Ming. Ming holds Liaoxi and garrisons Daning in the Rehe hills; the Jurchen tribes of Jilin and Heilongjiang take Ming titles but rule themselves.: Naghachu, commandant des Yuan du Nord en Mandchourie, se rend aux Ming. Les Ming tiennent le Liaoxi et placent une garnison à Daning, dans les collines du Rehe ; les tribus jürchen du Jilin et du Heilongjiang acceptent des titres Ming mais se gouvernent elles-mêmes.
  About 1399. The Oirats of western Mongolia break away from the Northern Yuan khans.: Vers 1399. Les Oïrats de Mongolie occidentale se détachent des khans des Yuan du Nord.
  The Yongle Emperor withdraws the garrisons of Daning and Dongsheng; the Rehe hills pass to the Uriankhai Mongols, Ming vassals.: L’empereur Yongle retire les garnisons de Daning et de Dongsheng ; les collines du Rehe passent aux Mongols Uriankhai, vassaux des Ming.
  Abu’l-Khayr, a Shaybanid, is proclaimed khan at Chimgi-Tura (Tyumen) and builds an Uzbek khanate on the steppe east of the Urals.: Abu’l-Khayr, un Chaybanide, est proclamé khan à Chimgi-Tura (Tioumen) et bâtit un khanat ouzbek dans la steppe à l’est de l’Oural.
  Abu’l-Khayr takes Sygnak, Sauran, Yasi and the towns of the Syr Darya from the Timurids.: Abu’l-Khayr prend aux Timourides Sygnak, Sauran, Yasi et les villes du Syr-Daria.
  "About 1465. Kerey and Janibek lead their followers from Abu’l-Khayr’s khanate to the Chu valley: the Kazakh Khanate.": "Vers 1465. Kereï et Janibek quittent le khanat d’Abu’l-Khayr avec leurs partisans et gagnent la vallée du Tchou : c’est le khanat kazakh."
  Abu’l-Khayr dies. The Kazakhs take most of the steppe and Sygnak; Ibak, a Shaybanid, rules the Tyumen Khanate.: Abu’l-Khayr meurt. Les Kazakhs prennent la plus grande partie de la steppe et Sygnak ; Ibak, un Chaybanide, règne sur le khanat de Tioumen.
  Yunus Khan’s son Ahmad (Ala) of Turfan takes Hami and its Ming-appointed ruler.: Ahmad (Ala) de Tourfan, fils de Yunus Khan, s’empare de Hami et de son souverain désigné par les Ming.
  Hanshen, a prince of the Hami house, retakes Hami with Ming backing.: Hanshen, un prince de la maison de Hami, reprend Hami avec le soutien des Ming.
  Ahmad of Turfan kills Hanshen and takes Hami again.: Ahmad de Tourfan tue Hanshen et reprend Hami.
  After a Ming trade embargo Turfan gives Hami back to its Ming-appointed ruler.: Après un embargo commercial des Ming, Tourfan rend Hami à son souverain désigné par les Ming.
  Muhammad Shaybani’s Uzbeks, now masters of Transoxiana, hold Yasi and Sayram against the Kazakhs.: Les Ouzbeks de Muhammad Chaybani, désormais maîtres de la Transoxiane, tiennent Yasi et Sayram face aux Kazakhs.
  Turfan takes Hami from its Ming-appointed ruler for good; the Ming lose the guards west of Jiayu Pass in the following years.: Tourfan prend définitivement Hami à son souverain désigné par les Ming ; les Ming perdent dans les années suivantes les gardes situées à l’ouest du col de Jiayu.
  About 1513. Under Kasym Khan the Kazakhs hold Semirechye and the steppe to the Ural river.: Vers 1513. Sous Kasym Khan, les Kazakhs tiennent le Semiretchie et la steppe jusqu’au fleuve Oural.
  Sultan Said Khan takes Kashgar and Yarkand from Mirza Abu Bakr Dughlat and founds the Yarkent Khanate; the Moghul khans of Turfan rule the east.: Sultan Said Khan prend Kachgar et Yarkand à Mirza Abu Bakr Dughlat et fonde le khanat de Yarkand ; les khans moghouls de Tourfan gouvernent l’est.
  About 1520. The Kazakhs under Kasym Khan hold the steppe of the Tobol and the Turgai.: Vers 1520. Les Kazakhs de Kasym Khan tiennent la steppe du Tobol et du Tourgaï.
  The Ming close Jiayu Pass and give up Dunhuang, which falls to Turfan and the Mongols.: Les Ming ferment le col de Jiayu et abandonnent Dunhuang, qui tombe aux mains de Tourfan et des Mongols.
  About 1552. The Khalkha Mongols push the Oirats west; the Khotogoid khans rule the north-west of Mongolia and Tuva.: Vers 1552. Les Mongols khalkhas repoussent les Oïrats vers l’ouest ; les khans khotogoïdes gouvernent le nord-ouest de la Mongolie et Touva.
  The Ming allow the Portuguese to settle at Macau for an annual rent.: Les Ming autorisent les Portugais à s’installer à Macao contre un loyer annuel.
  About 1560. Mongols of the Tümed under Altan Khan’s relatives settle around Kokonor.: Vers 1560. Des Mongols tümed, conduits par des parents d’Altan Khan, s’installent autour du Kokonor.
  After Yermak’s campaign (1582–1585) the Russians found Tyumen (1586) and Tobolsk (1587) on the lands of the Khanate of Sibir.: Après la campagne de Iermak (1582–1585), les Russes fondent Tioumen (1586) et Tobolsk (1587) sur les terres du khanat de Sibir.
  The Russians take Pelym and found Berezov (1593) and Surgut (1594) among the Khanty and Mansi.: Les Russes prennent Pelym et fondent Berezov (1593) et Sourgout (1594) chez les Khantys et les Mansis.
  The Russians found Tara on the Irtysh.: Les Russes fondent Tara sur l’Irtych.
  The Russians found Obdorsk on the lower Ob; Mangazeya follows in 1601.: Les Russes fondent Obdorsk sur le bas Ob ; Mangazeïa suit en 1601.
  The Russians found Narym; Tomsk follows in 1604.: Les Russes fondent Narym ; Tomsk suit en 1604.
  Kuchum Khan is defeated on the Ob (Battle of Irmen) and flees to the Nogais; the Russians take the forest-steppe of the Tobol and the Baraba. The southern steppe passes to the Kazakhs. The Kazakhs also take Tashkent, Turkistan and Sayram from the Shaybanids.: Koutchoum Khan est vaincu sur l’Ob (bataille d’Irmen) et s’enfuit chez les Nogaïs ; les Russes prennent la forêt-steppe du Tobol et la Baraba. La steppe du sud passe aux Kazakhs. Les Kazakhs prennent aussi Tachkent, Turkistan et Sayram aux Chaybanides.
  Nurhaci, chief of the Jianzhou Jurchens, proclaims the Later Jin at Hetu Ala.: Nurhaci, chef des Jürchen de Jianzhou, proclame les Jin postérieurs à Hetu Ala.
  The Russians found Kuznetsk.: Les Russes fondent Kouznetsk.
  The Russians found Yeniseysk (Krasnoyarsk follows in 1628).: Les Russes fondent Ienisseïsk (Krasnoïarsk suit en 1628).
  Later Jin defeats the Ming at Sarhu and destroys the Yehe, the last free Haixi Jurchen tribe.: Les Jin postérieurs battent les Ming à Sarhu et anéantissent les Yehe, la dernière tribu jürchen haixi restée libre.
  Later Jin takes Shenyang and Liaoyang and all of Liaodong east of the Liao River.: Les Jin postérieurs prennent Shenyang et Liaoyang, et tout le Liaodong à l’est de la rivière Liao.
  The Dutch East India Company, driven from Penghu by the Ming, builds Fort Zeelandia at Tayouan (Tainan).: La Compagnie néerlandaise des Indes orientales, chassée de Penghu par les Ming, construit le fort Zeelandia à Tayouan (Tainan).
  The Spanish found San Salvador at Keelung and Santo Domingo at Tamsui (1628).: Les Espagnols fondent San Salvador à Keelung et Santo Domingo à Tamsui (1628).
  The Russians found Ilimsk and Kirensk on the way to the Lena.: Les Russes fondent Ilimsk et Kirensk sur la route de la Léna.
  Ladakh conquers the kingdom of Guge.: Le Ladakh conquiert le royaume de Guge.
  The Cossack Pyotr Beketov founds the Lena fort (Yakutsk).: Le cosaque Piotr Beketov fonde le fort de la Léna (Iakoutsk).
  Hong Taiji’s campaign drives Ligdan Khan of the Chahar west; the eastern Mongol banners, allied with the Later Jin since the 1620s, come under its rule.: La campagne de Hong Taiji repousse vers l’ouest Ligdan Khan, des Tchakhars ; les bannières mongoles de l’est, alliées aux Jin postérieurs depuis les années 1620, passent sous leur autorité.
  Later Jin takes Lüshun (Port Arthur), the last Ming base on the Liaodong peninsula.: Les Jin postérieurs prennent Lüshun (Port-Arthur), dernière base Ming de la péninsule du Liaodong.
  Erdeni Batur founds the Dzungar Khanate in the Ili valley and Dzungaria.: Erdeni Batur fonde le khanat dzoungar dans la vallée de l’Ili et en Dzoungarie.
  The Kalmyks drive the Nogais west across the Ural river and hold the Caspian shore to Mangyshlak; the Kazakhs of the Junior Zhuz take the steppe of the Emba and the Ilek.: Les Kalmouks repoussent les Nogaïs à l’ouest du fleuve Oural et tiennent la côte de la Caspienne jusqu’au Manguychlak ; les Kazakhs du Petit Jüz prennent la steppe de l’Emba et de l’Ilek.
  "Ligdan Khan’s son surrenders to the Later Jin: the Northern Yuan ends and the Inner Mongols submit to the Manchus. The Khalkha khans in Outer Mongolia stay independent.": "Le fils de Ligdan Khan se rend aux Jin postérieurs : c’est la fin des Yuan du Nord, et les Mongols de Mongolie-Intérieure se soumettent aux Mandchous. Les khans khalkhas de Mongolie-Extérieure restent indépendants."
  Dutch campaigns bring the plains villages of the south-west under the Company.: Des campagnes néerlandaises placent les villages des plaines du sud-ouest sous l’autorité de la Compagnie.
  Güshi Khan of the Khoshut defeats the Khalkha Tsogt Taiji at Kokonor; the Khoshut rule Qinghai.: Güshi Khan, des Khoshut, bat le Khalkha Tsogt Taiji au Kokonor ; les Khoshut gouvernent le Qinghai.
  About 1640. The Dzungars dominate the upper Irtysh.: Vers 1640. Les Dzoungars dominent le haut Irtych.
  Güshi Khan defeats Donyo Dorje, the Bon king of Beri, and subdues Kham; in 1642 he takes Shigatse and makes the Fifth Dalai Lama ruler of Tibet.: Güshi Khan bat Donyo Dorje, le roi bön de Beri, et soumet le Kham ; en 1642, il prend Shigatsé et fait du cinquième dalaï-lama le souverain du Tibet.
  The Qing take Jinzhou after the Battle of Songjin; the Ming hold only Ningyuan and Shanhai Pass beyond the Great Wall.: Les Qing prennent Jinzhou après la bataille de Songjin ; au-delà de la Grande Muraille, les Ming ne tiennent plus que Ningyuan et le col de Shanhai.
  The Dutch take Keelung from the Spanish; their campaigns of 1642–1645 extend Company rule up the west coast.: Les Néerlandais prennent Keelung aux Espagnols ; leurs campagnes de 1642–1645 étendent l’autorité de la Compagnie le long de la côte ouest.
  Qing expeditions bring the Jurchen and Daur peoples of the Amur and Ussuri under tribute.: Des expéditions Qing soumettent au tribut les peuples jürchen et daur de l’Amour et de l’Oussouri.
  Li Zicheng proclaims the Shun dynasty at Xi’an; he holds Shaanxi, Gansu and Henan.: Li Zicheng proclame la dynastie Shun à Xi’an ; il tient le Shaanxi, le Gansu et le Henan.
  Li Zicheng takes Beijing; the Chongzhen Emperor hangs himself. Shun officials take over Shanxi, Hebei and Shandong.: Li Zicheng prend Pékin ; l’empereur Chongzhen se pend. Des fonctionnaires Shun prennent en main le Shanxi, le Hebei et le Shandong.
  After the Battle of Shanhai Pass the Qing enter Beijing; they take Hebei and Shandong in the summer and Shanxi in the autumn.: Après la bataille du col de Shanhai, les Qing entrent dans Pékin ; ils prennent le Hebei et le Shandong pendant l’été et le Shanxi à l’automne.
  "The Ming Prince of Fu is enthroned at Nanjing as the Hongguang Emperor: the Southern Ming.": "Le prince Ming de Fu est intronisé à Nankin sous le nom d’empereur Hongguang : ce sont les Ming du Sud."
  Zhang Xianzhong proclaims the Great Xi at Chengdu.: Zhang Xianzhong proclame le Grand Xi à Chengdu.
  The Qing take Tongguan and Xi’an; the Shun state collapses.: Les Qing prennent Tongguan et Xi’an ; l’État Shun s’effondre.
  Yangzhou has fallen (20 May); the Qing take Nanjing.: Yangzhou est tombée (20 mai) ; les Qing prennent Nankin.
  The Qing take Hangzhou and Shanghai, and Jiangxi and Hubei by the end of the year.: Les Qing prennent Hangzhou et Shanghai, puis le Jiangxi et le Hubei avant la fin de l’année.
  The Longwu Emperor is captured at Tingzhou; the Qing take Fujian. Zheng Chenggong holds out on Kinmen and Xiamen.: L’empereur Longwu est capturé à Tingzhou ; les Qing prennent le Fujian. Zheng Chenggong tient bon à Kinmen et à Xiamen.
  The Russians found Okhotsk on the Pacific.: Les Russes fondent Okhotsk sur le Pacifique.
  Zhang Xianzhong is killed by the Qing; the Great Xi collapses and the Qing take Chengdu and Chongqing.: Zhang Xianzhong est tué par les Qing ; le Grand Xi s’effondre et les Qing prennent Chengdu et Chongqing.
  The Qing take Guangzhou and Hunan.: Les Qing prennent Canton et le Hunan.
  Jin Shenghuan, the Qing commander in Jiangxi, goes over to the Yongli Emperor; Li Chengdong follows with Guangdong in May, and He Tengjiao’s Ming armies retake most of Hunan.: Jin Shenghuan, commandant Qing au Jiangxi, se rallie à l’empereur Yongli ; Li Chengdong suit avec le Guangdong en mai, et les armées Ming de He Tengjiao reprennent la plus grande partie du Hunan.
  The Qing retake Nanchang (February) and Hunan, where He Tengjiao is captured and killed.: Les Qing reprennent Nanchang (février) et le Hunan, où He Tengjiao est capturé et tué.
  About 1650. Russian forts and winter quarters on the Okhotsk coast and the Anadyr; the Koryaks and Chukchi remain unsubdued.: Vers 1650. Forts et quartiers d’hiver russes sur la côte d’Okhotsk et sur l’Anadyr ; les Koriaks et les Tchouktches restent insoumis.
  Shang Kexi and Geng Jimao retake Guangzhou for the Qing after a ten-month siege.: Shang Kexi et Geng Jimao reprennent Canton pour les Qing après un siège de dix mois.
  The Qing take Guilin.: Les Qing prennent Guilin.
  The Russians found Nerchinsk in Transbaikalia.: Les Russes fondent Nertchinsk en Transbaïkalie.
  Three Qing armies converge on Guizhou and take Guiyang.: Trois armées Qing convergent sur le Guizhou et prennent Guiyang.
  The Qing take Kunming; the Yongli Emperor flees to Burma.: Les Qing prennent Kunming ; l’empereur Yongli s’enfuit en Birmanie.
  The Russians found Irkutsk; the Buryats west of Lake Baikal pay tribute.: Les Russes fondent Irkoutsk ; les Bouriates à l’ouest du lac Baïkal paient tribut.
  Zheng Chenggong (Koxinga) lands on Taiwan and takes Penghu.: Zheng Chenggong (Koxinga) débarque à Taïwan et prend Penghu.
  "The Dutch surrender Fort Zeelandia to Zheng Chenggong: the Kingdom of Tungning.": "Les Néerlandais livrent le fort Zeelandia à Zheng Chenggong : c’est le royaume de Tungning."
  The Yongli Emperor, handed over by Burma, is executed in Kunming; Zheng Chenggong’s heirs hold Kinmen and Xiamen for Tungning.: L’empereur Yongli, livré par la Birmanie, est exécuté à Kunming ; les héritiers de Zheng Chenggong tiennent Kinmen et Xiamen pour le Tungning.
  The Qing take Xiamen and Kinmen from the Zheng.: Les Qing prennent Xiamen et Kinmen aux Zheng.
  The Russians found Verkhneudinsk (Ulan-Ude) and Selenginsk on the Selenga.: Les Russes fondent Verkhneoudinsk (Oulan-Oudé) et Selenguinsk sur la Selenga.
  The Dzungars defeat the Khotogoid khans and take Tuva; the Yenisei Kyrgyz become their vassals.: Les Dzoungars battent les khans khotogoïdes et prennent Touva ; les Kirghizes de l’Ienisseï deviennent leurs vassaux.
  Zheng Jing joins the Revolt of the Three Feudatories and takes Xiamen and Kinmen.: Zheng Jing se joint à la révolte des Trois Feudataires et prend Xiamen et Kinmen.
  About 1680. Galdan of the Dzungars conquers the Yarkent Khanate, Turfan and Hami and rules the Tarim through the Afaqi Khojas; the Dzungars also take Moghulistan’s lands in Semirechye.: Vers 1680. Galdan, des Dzoungars, conquiert le khanat de Yarkand, Tourfan et Hami, et gouverne le Tarim par l’intermédiaire des Khodjas Afaqi ; les Dzoungars prennent aussi les terres du Moghulistan dans le Semiretchie.
  The Qing drive Zheng Jing back to Taiwan.: Les Qing repoussent Zheng Jing à Taïwan.
  Shi Lang defeats the Zheng fleet at Penghu.: Shi Lang bat la flotte des Zheng à Penghu.
  Zheng Keshuang surrenders; the Qing annex western Taiwan.: Zheng Keshuang se rend ; les Qing annexent l’ouest de Taïwan.
  "Treaty of Tingmosgang, after the Tibet–Ladakh–Mughal war: Ngari passes to Tibet; the uninhabited Aksai Chin plateau stays with Ladakh.": "Traité de Tingmosgang, après la guerre entre le Tibet, le Ladakh et les Moghols : le Ngari passe au Tibet ; le plateau inhabité de l’Aksai Chin reste au Ladakh."
  At Dolon Nor the Khalkha khans, driven from their lands by Galdan, submit to the Kangxi Emperor.: À Dolon Nor, les khans khalkhas, chassés de leurs terres par Galdan, se soumettent à l’empereur Kangxi.
  Hami submits to the Qing.: Hami se soumet aux Qing.
  Vladimir Atlasov conquers Kamchatka for Russia; Itelmen risings continue until 1731.: Vladimir Atlassov conquiert le Kamtchatka pour la Russie ; les soulèvements des Itelmènes se poursuivent jusqu’en 1731.
  The Dzungars have carried the Yenisei Kyrgyz off to the Ili (1703); the Russians found the Abakan fort in the Minusinsk basin.: Les Dzoungars ont déporté les Kirghizes de l’Ienisseï vers l’Ili (1703) ; les Russes fondent le fort d’Abakan dans le bassin de Minoussinsk.
  In the war with the Dzungars the Qing occupy Dunhuang and garrison Turfan.: Pendant la guerre contre les Dzoungars, les Qing occupent Dunhuang et placent une garnison à Tourfan.
  The Russians found Biysk on the upper Ob; the Altai foothills come under Russian rule.: Les Russes fondent Biïsk sur le haut Ob ; les contreforts de l’Altaï passent sous domination russe.
  A Qing army enters Lhasa and expels the Dzungars (who have held it since 1717); Tibet becomes a Qing protectorate, with Chamdo under the Lhasa government.: Une armée Qing entre à Lhassa et en chasse les Dzoungars (qui la tiennent depuis 1717) ; le Tibet devient un protectorat des Qing, et Chamdo relève du gouvernement de Lhassa.
  "The Aqtaban Shubyryndy: the Dzungars overrun the Kazakh south and take Taraz, Turkistan and Sayram.": "L’Aqtaban Shubyryndy : les Dzoungars envahissent le sud du pays kazakh et prennent Taraz, Turkistan et Sayram."
  The Qing crush Lobzang Danjin’s revolt and annex Kokonor (Qinghai).: Les Qing écrasent la révolte de Lobzang Danjin et annexent le Kokonor (Qinghai).
  The Qing put eastern Kham (Batang, Litang) under Sichuan; the border with Tibet is fixed at Bum La (1727).: Les Qing rattachent l’est du Kham (Batang, Litang) au Sichuan ; la frontière avec le Tibet est fixée à Bum La (1727).
  The Qing take Ghulja and destroy the Dzungar state; Amursana’s revolt and its suppression follow until 1757.: Les Qing prennent Ghulja et anéantissent l’État dzoungar ; la révolte d’Amoursana et sa répression suivent jusqu’en 1757.
  The Altai Oirats and Teleuts submit to Russia.: Les Oïrats de l’Altaï et les Téléoutes se soumettent à la Russie.
  With the Dzungars gone, the Kazakhs return to Semirechye, the upper Irtysh and the Talas.: Une fois les Dzoungars disparus, les Kazakhs reviennent dans le Semiretchie, sur le haut Irtych et dans le Talas.
  The Qing defeat the Khoja brothers and annex Kashgaria (Altishahr).: Les Qing battent les frères Khodja et annexent la Kachgarie (Altishahr).
  Most of the Kalmyks leave the Volga for Dzungaria; the steppe between the Volga and the Ural comes under direct Russian rule, and Adai Kazakhs move onto Mangyshlak.: La plupart des Kalmouks quittent la Volga pour la Dzoungarie ; la steppe entre la Volga et l’Oural passe sous domination russe directe, et des Kazakhs adaï s’installent sur le Manguychlak.
  The Chukchi agree to pay tribute after decades of war with Russia.: Les Tchouktches acceptent de payer tribut après des décennies de guerre avec la Russie.
  The Qing set up the Kavalan subprefecture in Yilan.: Les Qing créent la sous-préfecture de Kavalan à Yilan.
  Kokand takes Turkistan and the Syr Darya towns from the Kazakhs, and in the 1820s the Talas valley.: Kokand prend aux Kazakhs Turkistan et les villes du Syr-Daria, puis, dans les années 1820, la vallée du Talas.
  Kokand builds the fort of Ak-Mechet on the lower Syr Darya.: Kokand construit le fort d’Ak-Mechet sur le bas Syr-Daria.
  Russia abolishes the khanship of the Middle Zhuz; the northern and central steppe is ruled through Russian districts.: La Russie abolit la dignité de khan dans le Moyen Jüz ; la steppe du nord et du centre est administrée par des districts russes.
  Russia abolishes the khanship of the Junior Zhuz.: La Russie abolit la dignité de khan dans le Petit Jüz.
  Kokand builds forts at Aulie-Ata and in the Chu valley.: Kokand construit des forts à Aulie-Ata et dans la vallée du Tchou.
  Zorawar Singh, general of the Dogra ruler Gulab Singh, conquers Ladakh; Aksai Chin is claimed with it.: Zorawar Singh, général du souverain dogra Gulab Singh, conquiert le Ladakh ; l’Aksai Chin est revendiqué avec lui.
  "Treaty of Nanking, after the First Opium War: the Qing cede Hong Kong Island to Britain.": "Traité de Nankin, après la première guerre de l’opium : les Qing cèdent l’île de Hong Kong à la Grande-Bretagne."
  Russia founds the Novopetrovsk fort (Fort-Shevchenko) on Mangyshlak.: La Russie fonde le fort de Novopetrovsk (Fort-Chevtchenko) sur le Manguychlak.
  The Senior Zhuz accepts Russian rule; the Russians found Kopal (1847) and Verny (Almaty, 1854).: Le Grand Jüz accepte la domination russe ; les Russes fondent Kopal (1847) et Verny (Almaty, 1854).
  Russian troops take Ak-Mechet from Kokand.: Les troupes russes prennent Ak-Mechet à Kokand.
  "Treaty of Aigun: the Qing cede the left bank of the Amur to Russia.": "Traité d’Aigoun : les Qing cèdent la rive gauche de l’Amour à la Russie."
  "Convention of Peking: the Qing cede Kowloon to Britain.": "Convention de Pékin : les Qing cèdent Kowloon à la Grande-Bretagne."
  "Treaty of Peking: the Qing cede the land east of the Ussuri (Primorye) to Russia.": "Traité de Pékin : les Qing cèdent à la Russie les terres à l’est de l’Oussouri (Primorié)."
  Russia takes Aulie-Ata and Turkistan (12 June).: La Russie prend Aulie-Ata et Turkistan (12 juin).
  Russia takes Chimkent; the Kazakh steppe is under Russian rule.: La Russie prend Chymkent ; la steppe kazakhe est sous domination russe.
  Yakub Beg, a Kokandi commander, takes Kashgar in the Dungan and Uyghur revolt against the Qing; by 1867 he rules the Tarim (Yettishar).: Yakoub Beg, un commandant kokandais, prend Kachgar pendant la révolte des Doungans et des Ouïghours contre les Qing ; dès 1867, il règne sur le Tarim (Yettishar).
  Yakub Beg takes Turfan and Ürümqi from the Dungan rebels.: Yakoub Beg prend Tourfan et Ürümqi aux rebelles doungans.
  Russia occupies the Ili valley, ending the Taranchi sultanate of Ghulja.: La Russie occupe la vallée de l’Ili et met fin au sultanat taranchi de Ghulja.
  After the Japanese expedition of 1874 the Qing open the mountains and the east coast of Taiwan to settlement and administration.: Après l’expédition japonaise de 1874, les Qing ouvrent les montagnes et la côte est de Taïwan au peuplement et à l’administration.
  Zuo Zongtang’s army takes Turfan; Yakub Beg dies.: L’armée de Zuo Zongtang prend Tourfan ; Yakoub Beg meurt.
  The Qing take Khotan, completing the reconquest of the Tarim.: Les Qing prennent Khotan et achèvent la reconquête du Tarim.
  Russia returns the Ili valley to the Qing under the Treaty of Saint Petersburg (1881).: La Russie rend la vallée de l’Ili aux Qing en vertu du traité de Saint-Pétersbourg (1881).
  "Treaty of Shimonoseki, after the First Sino-Japanese War: the Qing cede Taiwan and Penghu to Japan.": "Traité de Shimonoseki, après la première guerre sino-japonaise : les Qing cèdent Taïwan et Penghu au Japon."
  Germany leases Kiautschou Bay for 99 years.: L’Allemagne prend à bail la baie de Kiautschou pour 99 ans.
  Russia leases the Kwantung peninsula, with Port Arthur and Dalian.: La Russie prend à bail la péninsule du Kwantung, avec Port-Arthur et Dalian.
  France leases Guangzhouwan.: La France prend à bail Kouang-Tchéou-Wan.
  Britain leases the New Territories of Hong Kong for 99 years, and Weihaiwei.: La Grande-Bretagne prend à bail les Nouveaux Territoires de Hong Kong pour 99 ans, ainsi que Weihaiwei.
  "Treaty of Portsmouth, after the Russo-Japanese War: Russia transfers the Kwantung lease to Japan.": "Traité de Portsmouth, après la guerre russo-japonaise : la Russie cède au Japon le bail du Kwantung."
  Zhao Erfeng’s troops take Chamdo; a Qing army enters Lhasa (12 February) and the Thirteenth Dalai Lama flees to India.: Les troupes de Zhao Erfeng prennent Chamdo ; une armée Qing entre à Lhassa (12 février) et le treizième dalaï-lama s’enfuit en Inde.
  "The Bogd Khan is enthroned in Urga: Outer Mongolia declares independence from the Qing. Most of the Tuvan banners also accept the Bogd Khan.": "Le Bogd Khan est intronisé à Ourga : la Mongolie-Extérieure proclame son indépendance vis-à-vis des Qing. La plupart des bannières touvaines reconnaissent aussi le Bogd Khan."
  Hulunbuir (Barga) declares independence and joins the Mongolian state.: Hulunbuir (Barga) proclame son indépendance et se rattache à l’État mongol.
  The last Qing emperor abdicates; the Republic of China claims the whole Qing realm.: Le dernier empereur Qing abdique ; la République de Chine revendique l’ensemble du territoire des Qing.
  The Chinese garrison in Lhasa agrees to leave Tibet; the last troops go in January 1913 and the Dalai Lama proclaims Tibet’s independence.: La garnison chinoise de Lhassa accepte de quitter le Tibet ; les dernières troupes partent en janvier 1913 et le dalaï-lama proclame l’indépendance du Tibet.
  Mongolian forces take Khovd from its Chinese garrison.: Les forces mongoles prennent Khovd à sa garnison chinoise.
  Russia makes the Uriankhai country (Tuva) a protectorate.: La Russie fait du pays ouriankhaï (Touva) un protectorat.
  Japan takes Qingdao and Kiautschou from Germany.: Le Japon prend Qingdao et Kiautschou à l’Allemagne.
  Hulunbuir returns to China as a special region.: Hulunbuir revient à la Chine avec le statut de région spéciale.
  The Bolsheviks take power in Petrograd; Soviet rule spreads to Siberia and the Kazakh steppe over the winter, and the Russian Civil War follows.: Les bolcheviks prennent le pouvoir à Petrograd ; la domination soviétique s’étend à la Sibérie et à la steppe kazakhe au cours de l’hiver, et la guerre civile russe s’ensuit.
  In the Sino-Tibetan war Tibetan troops take Chamdo from the Sichuan frontier army; the Rongbatsa truce in October leaves it to Tibet.: Pendant la guerre sino-tibétaine, les troupes tibétaines prennent Chamdo à l’armée chinoise de la frontière du Sichuan ; la trêve de Rongbatsa, en octobre, laisse Chamdo au Tibet.
  The Turkestan Soviet Republic is proclaimed in Tashkent, with Semirechye and the Syr Darya.: La République soviétique du Turkestan est proclamée à Tachkent, avec le Semiretchie et le Syr-Daria.
  The Chinese government abolishes Mongolia’s autonomy after Xu Shuzheng’s troops occupy Urga.: Le gouvernement chinois abolit l’autonomie de la Mongolie après l’occupation d’Ourga par les troupes de Xu Shuzheng.
  The Far Eastern Republic is proclaimed at Verkhneudinsk as a buffer state between Soviet Russia and Japan.: La République d’Extrême-Orient est proclamée à Verkhneoudinsk, comme État tampon entre la Russie soviétique et le Japon.
  Ataman Semyonov has been driven from Chita; a conference there unites Transbaikalia, the Amur region and the coast under the Far Eastern Republic.: L’ataman Semionov a été chassé de Tchita ; une conférence qui s’y tient réunit la Transbaïkalie, la région de l’Amour et la côte au sein de la République d’Extrême-Orient.
  The Primorye government in Vladivostok joins the Far Eastern Republic; Japanese troops stay in the city, and a White government holds it from May 1921 until October 1922.: Le gouvernement du Primorié, à Vladivostok, rejoint la République d’Extrême-Orient ; les troupes japonaises restent dans la ville, et un gouvernement blanc la tient de mai 1921 à octobre 1922.
  Baron Ungern-Sternberg takes Urga and restores the Bogd Khan; the Red Army and Sükhbaatar’s partisans take Urga in July.: Le baron Ungern-Sternberg prend Ourga et rétablit le Bogd Khan ; l’Armée rouge et les partisans de Soukhbaatar prennent Ourga en juillet.
  The Tuvan People’s Republic is proclaimed.: La République populaire de Touva est proclamée.
  The Far Eastern Republic is merged into Soviet Russia.: La République d’Extrême-Orient est intégrée à la Russie soviétique.
  Japan returns Kiautschou (Qingdao) to China.: Le Japon rend Kiautschou (Qingdao) à la Chine.
  Britain returns Weihaiwei to China.: La Grande-Bretagne rend Weihaiwei à la Chine.
  Japan sets up Manchukuo in Manchuria after the Mukden incident (1931).: Le Japon crée le Mandchoukouo en Mandchourie après l’incident de Moukden (1931).
  "Japanese and Manchukuo troops take Chengde: Rehe is added to Manchukuo.": "Les troupes japonaises et celles du Mandchoukouo prennent Chengde : le Rehe est rattaché au Mandchoukouo."
  After the Japanese conquest of Chahar and Suiyuan the Mongol United Autonomous Government (later Mengjiang) is set up under Prince Demchugdongrub.: Après la conquête japonaise du Tchakhar et du Suiyuan, le gouvernement autonome uni mongol (plus tard le Mengjiang) est créé sous la direction du prince Demchugdongrub.
  Tuva is annexed by the Soviet Union.: Touva est annexée par l’Union soviétique.
  Japan surrenders; Manchukuo and Mengjiang are dissolved and their lands return to the Republic of China, Manchuria after a Soviet occupation that lasts until May 1946. France returns Guangzhouwan.: Le Japon capitule ; le Mandchoukouo et le Mengjiang sont dissous et leurs terres reviennent à la République de Chine, la Mandchourie après une occupation soviétique qui dure jusqu’en mai 1946. La France rend Kouang-Tchéou-Wan.
  Soviet troops occupy Port Arthur and Dalian, leased to the Soviet Union as a naval base by the treaty of 14 August.: Les troupes soviétiques occupent Port-Arthur et Dalian, cédés à bail à l’Union soviétique comme base navale par le traité du 14 août.
  Japan hands Taiwan and Penghu over to the Republic of China.: Le Japon remet Taïwan et Penghu à la République de Chine.
  Jammu and Kashmir accedes to India, which inherits the claim to Aksai Chin.: Le Jammu-et-Cachemire adhère à l’Inde, qui hérite de la revendication sur l’Aksai Chin.
  Mao Zedong proclaims the People’s Republic of China in Beijing. The Communists hold the north, the north-east, the Yangtze valley and the north-west; the Nationalists still hold the south and south-west.: Mao Zedong proclame la République populaire de Chine à Pékin. Les communistes tiennent le nord, le nord-est, la vallée du Yangzi et le nord-ouest ; les nationalistes tiennent encore le sud et le sud-ouest.
  The People’s Liberation Army takes Guangzhou.: L’Armée populaire de libération prend Canton.
  The People’s Liberation Army takes Xiamen; its attack on Kinmen fails (25–27 October).: L’Armée populaire de libération prend Xiamen ; son attaque contre Kinmen échoue (25–27 octobre).
  The People’s Liberation Army takes Guiyang and Chongqing.: L’Armée populaire de libération prend Guiyang et Chongqing.
  The Nationalist government moves to Taipei; Yunnan and Xikang change sides on 9 December and Chengdu falls on 27 December. Guangxi has been taken in the same weeks.: Le gouvernement nationaliste s’installe à Taipei ; le Yunnan et le Xikang changent de camp le 9 décembre et Chengdu tombe le 27 décembre. Le Guangxi a été pris au cours des mêmes semaines.
  The People’s Liberation Army takes Hainan.: L’Armée populaire de libération prend Hainan.
  The People’s Liberation Army takes Chamdo.: L’Armée populaire de libération prend Chamdo.
  "The Seventeen Point Agreement: the Tibetan government accepts the sovereignty of the People’s Republic, whose troops reach Lhasa in October. Aksai Chin, crossed by Chinese troops from Xinjiang, is claimed by India as part of Ladakh.": "L’accord en dix-sept points : le gouvernement tibétain accepte la souveraineté de la République populaire, dont les troupes atteignent Lhassa en octobre. L’Aksai Chin, traversé par des troupes chinoises venues du Xinjiang, est revendiqué par l’Inde comme partie du Ladakh."
  The Soviet Union hands Port Arthur back to China.: L’Union soviétique rend Port-Arthur à la Chine.
  The Soviet Union is dissolved; Siberia and the Far East stay with Russia.: L’Union soviétique est dissoute ; la Sibérie et l’Extrême-Orient restent à la Russie.
  Britain hands Hong Kong over to China.: La Grande-Bretagne remet Hong Kong à la Chine.
  Portugal hands Macau over to China.: Le Portugal remet Macao à la Chine.
  About 800. Silla rules the Korean peninsula south of the Taedong River and the coast up to the Wonsan area; the land between the Taedong and the Chongchon is an empty frontier, and Balhae rules the Yalu and the north-east. Tamna (Jeju) is a kingdom of its own that sends tribute to Silla. Japan, ruled from Heian-kyō (Kyoto) since 794, holds Kyushu, Shikoku and Honshu up to the lands of the Emishi in the north of Tōhoku, where the court’s armies are still fighting. Hokkaido, southern Sakhalin and the Kurils are the land of the Satsumon and Okhotsk peoples, ancestors of the Ainu, and the north of Sakhalin that of the Nivkh. The Ryukyu Islands are outside any state.: Vers 800. Silla règne sur la péninsule coréenne au sud du fleuve Taedong et sur la côte jusqu’à la région de Wonsan ; les terres situées entre le Taedong et le Chongchon forment une zone frontière déserte, et le Balhae règne sur le Yalu et le nord-est. Tamna (Jeju) est un royaume distinct, tributaire de Silla. Le Japon, gouverné depuis Heian-kyō (Kyoto) à partir de 794, tient Kyushu, Shikoku et Honshu jusqu’aux terres des Emishi, dans le nord du Tōhoku, où les armées de la cour combattent encore. Hokkaido, le sud de Sakhaline et les Kouriles sont le pays des peuples des cultures Satsumon et d’Okhotsk, ancêtres des Aïnous, et le nord de Sakhaline celui des Nivkhes. Les îles Ryūkyū sont hors de tout État.
  Sakanoue no Tamuramaro builds Isawa Castle on the Kitakami River and the Emishi leaders Aterui and More surrender. Shiwa Castle follows in 803, and Fun’ya no Watamaro’s campaign of 811 brings the rest of the Kitakami basin (Iwate) under the court.: Sakanoue no Tamuramaro construit le château d’Isawa sur le fleuve Kitakami, et les chefs emishi Aterui et More se rendent. Le château de Shiwa suit en 803, et la campagne de Fun’ya no Watamaro, en 811, soumet à la cour le reste du bassin du Kitakami (Iwate).
  Gyeon Hwon, a Silla commander, rebels in the south-west and takes Mujinju (Gwangju).: Gyeon Hwon, un commandant de Silla, se rebelle dans le sud-ouest et prend Mujinju (Gwangju).
  Gyeon Hwon proclaims Later Baekje at Wansanju (Jeonju).: Gyeon Hwon proclame le Baekje postérieur à Wansanju (Jeonju).
  Gung Ye, a rebel leader who has taken central Korea from Silla, proclaims Later Goguryeo at Songak (Kaesong). It is renamed Majin in 904 and Taebong in 911.: Gung Ye, un chef rebelle qui a pris le centre de la Corée à Silla, proclame le Goguryeo postérieur à Songak (Kaesong). Le royaume est rebaptisé Majin en 904, puis Taebong en 911.
  Hong Gi, the commander of Gongju, goes over to Gung Ye with the land around it.: Hong Gi, commandant de Gongju, se rallie à Gung Ye avec les terres environnantes.
  Wang Geon overthrows Gung Ye and founds Goryeo; he resettles the ruined Pyongyang as the Western Capital (Seogyeong). Ungju (Gongju) and Unju (Hongseong) go over to Later Baekje.: Wang Geon renverse Gung Ye et fonde Goryeo ; il repeuple Pyongyang, alors en ruine, dont il fait la capitale de l’Ouest (Seogyeong). Ungju (Gongju) et Unju (Hongseong) se rallient au Baekje postérieur.
  Later Baekje takes Daeya (Hapcheon) and the west of Gyeongsang from Silla.: Le Baekje postérieur prend à Silla Daeya (Hapcheon) et l’ouest du Gyeongsang.
  With the fall of Balhae to the Liao, the Jurchen tribes are left in the north of the Korean peninsula; Balhae refugees flee to Goryeo.: Avec la chute du Balhae, conquis par les Liao, le nord de la péninsule coréenne est laissé aux tribus jürchen ; des réfugiés du Balhae fuient vers Goryeo.
  King Gyeongsun of Silla gives up his kingdom to Goryeo.: Le roi Gyeongsun de Silla remet son royaume à Goryeo.
  Goryeo destroys Later Baekje at the battle of the Illi River and unifies the peninsula.: Goryeo détruit le Baekje postérieur à la bataille de la rivière Illi et unifie la péninsule.
  After the first Khitan invasion, Seo Hui’s talks with the Liao commander Xiao Sunning (993) win Goryeo the land between the Chongchon and the Yalu, held by Jurchen tribes; Goryeo fortifies it as the six garrisons east of the river.: Après la première invasion khitane, les pourparlers de 993 entre Seo Hui et Xiao Sunning, commandant des Liao, valent à Goryeo les terres situées entre le Chongchon et le Yalu, tenues par des tribus jürchen ; Goryeo les fortifie et en fait les six garnisons à l’est du fleuve.
  Goryeo completes the Thousand-li Wall (Cheolli Jangseong), begun in 1033, from the mouth of the Yalu to the east coast at Jeongpyeong, on the south-western edge of the Hamhung plain, and settles the coast behind it.: Goryeo achève le mur des Mille Li (Cheolli Jangseong), commencé en 1033, qui va de l’embouchure du Yalu à la côte est, à Jeongpyeong, au bord sud-ouest de la plaine de Hamhung, et peuple la côte située en deçà.
  "About 1100 (the exact date is not known). After the campaign of 1070, the Kiyohara and then the Northern Fujiwara of Hiraizumi, who govern Mutsu and Dewa for the court, bring the north of Honshu under Japanese rule: districts are set up in Nukanobu and Tsugaru (Aomori).": "Vers 1100 (la date exacte n’est pas connue). Après la campagne de 1070, les Kiyohara puis les Fujiwara du Nord de Hiraizumi, qui gouvernent les provinces de Mutsu et de Dewa pour la cour, placent le nord de Honshu sous domination japonaise : des districts sont créés à Nukanobu et à Tsugaru (Aomori)."
  Tamna becomes a county of Goryeo, though its rulers keep their titles.: Tamna devient un comté de Goryeo, mais ses souverains conservent leurs titres.
  The Jurchens of the north-east of the peninsula, led by the Wanyan since the 1100s, come under the new Jin dynasty.: Les Jürchen du nord-est de la péninsule, menés par les Wanyan depuis les années 1100, passent sous l’autorité de la nouvelle dynastie Jin.
  Puxian Wannu’s Eastern Xia takes the north-east of the peninsula from the Jin.: Les Xia orientaux de Puxian Wannu prennent aux Jin le nord-est de la péninsule.
  The Mongols end Eastern Xia; its lands in the north-east of the peninsula come under the Mongol Empire.: Les Mongols mettent fin aux Xia orientaux ; leurs terres du nord-est de la péninsule passent sous l’autorité de l’Empire mongol.
  Two Goryeo officials, Jo Hwi and Tak Cheong, kill the local commander and hand the land north of the Cheollyeong pass to the Mongols, who govern it as the Ssangseong Commandery.: Deux fonctionnaires de Goryeo, Jo Hwi et Tak Cheong, tuent le commandant local et livrent aux Mongols les terres situées au nord du col de Cheollyeong, que ceux-ci administrent sous le nom de commanderie de Ssangseong.
  The Mongol lands in the north-east of the peninsula pass to Kublai.: Les terres mongoles du nord-est de la péninsule passent à Kubilai.
  Choe Tan, an officer at Pyongyang who rebelled against Goryeo in 1269, hands the north-west to the Mongols, who govern it as the Dongnyeong Prefecture.: Choe Tan, un officier de Pyongyang qui s’est rebellé contre Goryeo en 1269, livre le nord-ouest aux Mongols, qui l’administrent sous le nom de préfecture de Dongnyeong.
  After the last Sambyeolcho stronghold on Jeju falls, the Mongols take the island as a horse-breeding ground under their own governor.: Après la chute du dernier bastion des Sambyeolcho, à Jeju, les Mongols prennent l’île, dont ils font un lieu d’élevage de chevaux placé sous leur propre gouverneur.
  The Yuan give the Dongnyeong Prefecture back to Goryeo.: Les Yuan rendent la préfecture de Dongnyeong à Goryeo.
  The Yuan give Jeju back to Goryeo; Mongol horse-breeders stay on the island, and a Yuan commandery set up again in 1300 is replaced by a Goryeo garrison in 1301.: Les Yuan rendent Jeju à Goryeo ; des éleveurs de chevaux mongols restent sur l’île, et une commanderie des Yuan, rétablie en 1300, est remplacée en 1301 par une garnison de Goryeo.
  About 1322. Okinawa is divided between three kingdoms, Hokuzan in the north, Chūzan in the centre and Nanzan in the south; from 1372 they send tribute to Ming China.: "Vers 1322. Okinawa est partagée entre trois royaumes : Hokuzan au nord, Chūzan au centre et Nanzan au sud ; à partir de 1372, ils versent un tribut à la Chine des Ming."
  "King Gongmin turns against the Yuan: his army takes back the Ssangseong Commandery, helped by a local commander, Yi Ja-chun, the father of Yi Seong-gye, and pushes north along the coast.": "Le roi Gongmin se retourne contre les Yuan : son armée reprend la commanderie de Ssangseong, avec l’aide d’un commandant local, Yi Ja-chun, père de Yi Seong-gye, et pousse vers le nord le long de la côte."
  The Yuan lands on the Tumen and the upper Yalu pass to the Mongols who hold Manchuria for the Northern Yuan.: Les terres des Yuan sur le Tumen et le haut Yalu passent aux Mongols qui tiennent la Mandchourie pour les Yuan du Nord.
  Kanggye on the middle Yalu, a Goryeo garrison since 1361, becomes a garrison command (manhobu).: Kanggye, sur le moyen Yalu, garnison de Goryeo depuis 1361, devient un commandement de garnison (manhobu).
  After Naghachu’s surrender to the Ming, the Jurchen tribes of the Tumen and the upper Yalu are left to themselves.: Après la reddition de Naghachu aux Ming, les tribus jürchen du Tumen et du haut Yalu sont livrées à elles-mêmes.
  Goryeo makes Kapsan, on the upper Yalu, a garrison command.: Goryeo fait de Kapsan, sur le haut Yalu, un commandement de garnison.
  Yi Seong-gye takes the throne and founds Joseon (so named in 1393), ending Goryeo.: Yi Seong-gye s’empare du trône et fonde Joseon (nom adopté en 1393), mettant fin à Goryeo.
  Shō Hashi of Chūzan conquers Nanzan, having taken Hokuzan in 1416, and unites Okinawa as the Ryukyu Kingdom.: Shō Hashi, de Chūzan, conquiert Nanzan, après avoir pris Hokuzan en 1416, et unifie Okinawa, qui devient le royaume de Ryūkyū.
  "Kim Jong-seo begins the six garrisons on the lower Tumen, completed by 1449, while King Sejong’s armies set up four commanderies on the middle Yalu in 1433–1443 (all four were abandoned in 1455–1459 and the land left empty): the Yalu and the Tumen become the border of Korea.": "Kim Jong-seo entreprend les six garnisons du bas Tumen, achevées en 1449, tandis que les armées du roi Sejong établissent quatre commanderies sur le moyen Yalu en 1433–1443 (toutes quatre seront abandonnées en 1455–1459, et leurs terres laissées vides) : le Yalu et le Tumen deviennent la frontière de la Corée."
  Shō Toku conquers Kikai, the last of the Amami Islands to come under Ryukyu.: Shō Toku conquiert Kikai, la dernière des îles Amami à passer sous la domination du royaume de Ryūkyū.
  Ryukyuan forces defeat Oyake Akahachi on Ishigaki; the Yaeyama and Miyako Islands come under the rule of Shuri.: Les forces de Ryūkyū battent Oyake Akahachi à Ishigaki ; les îles Yaeyama et Miyako passent sous la domination de Shuri.
  Tokugawa Ieyasu grants the Matsumae clan the sole right to trade with the Ainu; their land at the south-western tip of Ezo (Hokkaido), where Japanese settlers have held forts since the 1450s, becomes the Matsumae domain.: Tokugawa Ieyasu accorde au clan Matsumae le monopole du commerce avec les Aïnous ; ses terres, à la pointe sud-ouest d’Ezo (Hokkaido), où des colons japonais tiennent des forts depuis les années 1450, deviennent le domaine de Matsumae.
  "Two years after the Satsuma invasion, the released king Shō Nei accepts Satsuma’s terms: the Amami Islands are ruled directly by Satsuma, and Ryukyu becomes a vassal of Satsuma and the shogunate while still sending tribute to China.": "Deux ans après l’invasion du royaume par Satsuma, le roi Shō Nei, libéré, accepte les conditions de Satsuma : les îles Amami sont gouvernées directement par Satsuma, et le royaume de Ryūkyū devient vassal de Satsuma et du shogunat tout en continuant à verser un tribut à la Chine."
  Cossacks from Kamchatka land on Shumshu, and in 1713 on Paramushir; Russia takes tribute from the Ainu of the northern Kurils.: Des Cosaques venus du Kamtchatka débarquent à Choumchou, puis en 1713 à Paramouchir ; la Russie lève un tribut sur les Aïnous du nord des Kouriles.
  The shogunate takes eastern Ezo and the southern Kurils (Kunashir and Iturup) from the Matsumae domain and rules them directly, against Russian advances; western Ezo follows in 1807. The lands go back to Matsumae in 1821 and to the shogunate again in 1855.: Le shogunat retire au domaine de Matsumae l’est d’Ezo et le sud des Kouriles (Kounachir et Itouroup) et les gouverne directement, face aux avancées russes ; l’ouest d’Ezo suit en 1807. Ces terres reviennent à Matsumae en 1821, puis de nouveau au shogunat en 1855.
  Gennady Nevelskoy’s expedition sets up Russian posts on Sakhalin; Russia occupies the north of the island, where it opens coal mines at Dué and, from 1869, a penal colony.: L’expédition de Guennadi Nevelskoï établit des postes russes à Sakhaline ; la Russie occupe le nord de l’île, où elle ouvre des mines de charbon à Dué et, à partir de 1869, une colonie pénitentiaire.
  "Treaty of Shimoda: Russia and Japan draw their border in the Kurils between Iturup and Urup, and leave Sakhalin, where both have posts, undivided and open to both.": "Traité de Shimoda : la Russie et le Japon fixent leur frontière dans les Kouriles entre Itouroup et Ouroup, et laissent Sakhaline, où tous deux ont des postes, indivise et ouverte aux deux pays."
  "Treaty of Saint Petersburg: Japan gives up its claims to Sakhalin, which becomes wholly Russian, in exchange for the Kurils north of Iturup.": "Traité de Saint-Pétersbourg : le Japon renonce à ses prétentions sur Sakhaline, qui devient entièrement russe, en échange des Kouriles situées au nord d’Itouroup."
  Japan abolishes the Ryukyu Domain, made from the kingdom in 1872, and annexes the islands as Okinawa Prefecture; King Shō Tai is taken to Tokyo.: Le Japon abolit le domaine de Ryūkyū, créé à partir du royaume en 1872, et annexe les îles, qui deviennent la préfecture d’Okinawa ; le roi Shō Tai est emmené à Tokyo.
  "Treaty of Portsmouth: Russia cedes Sakhalin south of the 50th parallel (Karafuto) to Japan.": "Traité de Portsmouth : la Russie cède au Japon la partie de Sakhaline située au sud du 50e parallèle (Karafuto)."
  Japan annexes Korea, its protectorate since 1905; the Korean Empire ends.: Le Japon annexe la Corée, son protectorat depuis 1905 ; c’est la fin de l’Empire coréen.
  The Bolsheviks take power in Petrograd. Northern Sakhalin, held by the Whites from 1918, rises in January 1920 and is occupied by Japanese troops in April.: Les bolcheviks prennent le pouvoir à Petrograd. Le nord de Sakhaline, tenu par les Blancs à partir de 1918, se soulève en janvier 1920 et est occupé par les troupes japonaises en avril.
  Northern Sakhalin is claimed by the Far Eastern Republic; Japanese troops occupy it from 1920 to 1925.: Le nord de Sakhaline est revendiqué par la République d’Extrême-Orient ; les troupes japonaises l’occupent de 1920 à 1925.
  Northern Sakhalin passes to Soviet Russia with the rest of the Far Eastern Republic.: Le nord de Sakhaline passe à la Russie soviétique avec le reste de la République d’Extrême-Orient.
  Soviet troops, who entered Korea on 10–12 August, reach Pyongyang. The Japanese north of the 38th parallel, the line agreed with the United States between their zones, surrender to them, and the Soviet Union sets up its administration.: Les troupes soviétiques, entrées en Corée du 10 au 12 août, atteignent Pyongyang. Les Japonais situés au nord du 38e parallèle, ligne convenue avec les États-Unis pour séparer leurs zones, se rendent aux Soviétiques, et l’Union soviétique met en place son administration.
  The Japanese governor-general surrenders in Seoul to American forces, who landed at Incheon the day before; the US Army Military Government rules Korea south of the 38th parallel.: Le gouverneur général japonais se rend à Séoul aux forces américaines, débarquées la veille à Incheon ; le gouvernement militaire de l’armée américaine administre la Corée au sud du 38e parallèle.
  "An order of the Allied occupation separates the islands south of 30° N from Japan’s administration: the Ryukyu and Amami Islands (Okinawa, taken by American forces in the battle of Okinawa in April–June 1945, and the other islands, whose garrisons surrendered in September 1945) are ruled by a US military government, from 1950 the United States Civil Administration of the Ryukyu Islands. The Treaty of San Francisco (1951) confirmed American rule; Japan kept residual sovereignty.": "Une directive de l’occupation alliée soustrait à l’administration japonaise les îles situées au sud de 30° N : les îles Ryūkyū et Amami (Okinawa, prise par les forces américaines lors de la bataille d’Okinawa d’avril à juin 1945, et les autres îles, dont les garnisons se sont rendues en septembre 1945) sont placées sous un gouvernement militaire américain, qui devient en 1950 l’Administration civile des États-Unis des îles Ryūkyū. Le traité de San Francisco (1951) a confirmé la domination américaine ; le Japon a conservé une souveraineté résiduelle."
  The Soviet Union annexes South Sakhalin and the Kuril Islands, which its troops occupied in August and September 1945. Japan renounced South Sakhalin and the Kurils in the Treaty of San Francisco (1951), which the Soviet Union did not sign, but holds that the four southern islands, Iturup, Kunashir, Shikotan and the Habomai, are not part of the Kurils it renounced (Shikotan and the Habomai being part of Hokkaido) and claims them as its Northern Territories; the dispute is unresolved.: L’Union soviétique annexe le sud de Sakhaline et les îles Kouriles, que ses troupes ont occupés en août et septembre 1945. Le Japon a renoncé au sud de Sakhaline et aux Kouriles par le traité de San Francisco (1951), que l’Union soviétique n’a pas signé, mais il soutient que les quatre îles du sud, Itouroup, Kounachir, Shikotan et les Habomai, ne font pas partie des Kouriles auxquelles il a renoncé (Shikotan et les Habomai faisant partie de Hokkaido), et les revendique comme ses Territoires du Nord ; le différend n’est pas réglé.
  The Republic of Korea is proclaimed in Seoul, with Syngman Rhee as president.: La République de Corée est proclamée à Séoul, avec Syngman Rhee pour président.
  The Democratic People’s Republic of Korea is proclaimed in Pyongyang, with Kim Il-sung as premier.: La République populaire démocratique de Corée est proclamée à Pyongyang, avec Kim Il-sung pour Premier ministre.
  "Korean Armistice Agreement: the front line becomes the Military Demarcation Line. South Korea keeps the land north of the 38th parallel in the east, North Korea the land south of it in the west, with Kaesong and the Ongjin peninsula.": "Accord d’armistice coréen : la ligne de front devient la ligne de démarcation militaire. La Corée du Sud conserve, à l’est, les terres situées au nord du 38e parallèle, et la Corée du Nord, à l’ouest, celles situées au sud, avec Kaesong et la péninsule d’Ongjin."
  The United States returns the Amami Islands to Japan.: Les États-Unis rendent les îles Amami au Japon.
  The United States returns Okinawa and the rest of the Ryukyu Islands to Japan; American bases stay.: Les États-Unis rendent Okinawa et le reste des îles Ryūkyū au Japon ; les bases américaines y restent.
  Sakhalin and the Kurils pass to Russia with the end of the Soviet Union.: Sakhaline et les Kouriles passent à la Russie avec la fin de l’Union soviétique.
  ? About 800. In Burma the Pyu city-states (Sri Ksetra near Prome, Halin) hold the dry zone and the Mon city-states of Thaton and Pegu the coast; Arakan is a kingdom of its own (Waithali). In Thailand the Mon city-states of Dvaravati hold the Chao Phraya plain and Hariphunchai (Lamphun) the north. The Khmer lands of Chenla, divided at this time, stretch from southern Laos and the Khorat plateau over Cambodia to the Mekong delta. The Tang protectorate of Annan rules the Red River delta down to Hà Tĩnh, and Champa the coast to the south. Srivijaya, from Palembang, rules southern Sumatra and the Strait of Malacca with the Malay peninsula; the Sailendra and Sanjaya kings of Mataram (Medang) rule Central Java, and the kingdom of Sunda West Java. Bali has kings of its own. The rest of the islands — northern Sumatra, Borneo, Sulawesi, the Moluccas, the Philippines, Timor and New Guinea — are the land of smaller polities and peoples outside these kingdoms. The northern hills of Burma, Laos and Vietnam are outside any state.
  : Vers 800. En Birmanie, les cités-États pyu (Sri Ksetra, près de Prome, et Halin) tiennent la zone sèche, et les cités-États môns de Thaton et de Pégou la côte ; l’Arakan forme un royaume à part (Waithali). En Thaïlande, les cités-États môns de Dvaravati tiennent la plaine de la Chao Phraya, et Hariphunchai (Lamphun) le nord. Les terres khmères du Chenla, alors divisées, s’étendent du sud du Laos et du plateau de Khorat jusqu’au delta du Mékong, en passant par le Cambodge. Le protectorat Tang d’Annan gouverne le delta du fleuve Rouge jusqu’à Hà Tĩnh, et le Champa la côte plus au sud. Srivijaya, depuis Palembang, domine le sud de Sumatra et le détroit de Malacca ainsi que la péninsule Malaise ; les rois Sailendra et Sanjaya de Mataram (Medang) règnent sur Java central, et le royaume de Sunda sur Java occidental. Bali a ses propres rois. Le reste des îles — le nord de Sumatra, Bornéo, Sulawesi, les Moluques, les Philippines, Timor et la Nouvelle-Guinée — est le domaine d’entités politiques et de peuples plus petits, extérieurs à ces royaumes. Les collines du nord de la Birmanie, du Laos et du Vietnam échappent à tout État.
  Pagan is founded on the Irrawaddy, by the traditional date, after Nanzhao’s raids of the 830s have broken the Pyu cities.: La ville de Pagan est fondée sur l’Irrawaddy, selon la date traditionnelle, après que les raids du Nanzhao des années 830 ont brisé les cités pyu.
  Khúc Thừa Dụ, a local leader, takes over the Tang circuit of Tĩnh Hải (Jinghai) in the Red River delta as the Tang dynasty breaks up, and rules it in its name.: Khúc Thừa Dụ, un chef local, prend le contrôle du circuit Tang de Tĩnh Hải (Jinghai), dans le delta du fleuve Rouge, alors que la dynastie Tang se disloque, et le gouverne au nom des Tang.
  Mpu Sindok moves the court of Mataram (Medang) from Central Java to the Brantas valley in East Java, perhaps after an eruption of Merapi; East Java becomes the centre of the kingdom.: Mpu Sindok transfère la cour de Mataram (Medang) de Java central dans la vallée du Brantas, à Java oriental, peut-être après une éruption du Merapi ; Java oriental devient le centre du royaume.
  "Ngô Quyền, victor over the Southern Han fleet at the Bạch Đằng River in 938, proclaims himself king at Cổ Loa: the Red River delta becomes an independent kingdom. Đinh Bộ Lĩnh reunites it in 968 after the wars of the twelve warlords and names it Đại Cồ Việt.": "Ngô Quyền, vainqueur de la flotte des Han du Sud sur le fleuve Bạch Đằng en 938, se proclame roi à Cổ Loa : le delta du fleuve Rouge devient un royaume indépendant. Đinh Bộ Lĩnh le réunifie en 968, après les guerres des douze seigneurs, et le nomme Đại Cồ Việt."
  Po-ni, on the north-west coast of Borneo, the forerunner of Brunei, sends its first recorded embassy to the Song court.: Po-ni, sur la côte nord-ouest de Bornéo, ancêtre de Brunei, envoie sa première ambassade attestée à la cour des Song.
  Mataram (Medang) collapses when Wurawari, a vassal allied with Srivijaya, sacks its capital and kills King Dharmawangsa (the Pralaya); Airlangga, his son-in-law, survives in the hills.: Mataram (Medang) s’effondre lorsque Wurawari, un vassal allié à Srivijaya, met sa capitale à sac et tue le roi Dharmawangsa (le Pralaya) ; Airlangga, son gendre, survit dans les collines.
  About 1025. Suryavarman I extends Khmer rule over Lavo (Lopburi) and the Mon lands of the Chao Phraya plain; Dvaravati’s cities become Khmer provinces.: Vers 1025. Suryavarman Ier étend la domination khmère sur Lavo (Lopburi) et les terres môns de la plaine de la Chao Phraya ; les cités de Dvaravati deviennent des provinces khmères.
  Airlangga, crowned in 1019, has reunited East Java under his kingdom of Kahuripan. Before his death in 1049 he divides it into Janggala and Panjalu (Kediri), which Kediri later absorbs.: Airlangga, couronné en 1019, a réunifié Java oriental dans son royaume de Kahuripan. Avant sa mort, en 1049, il le partage entre Janggala et Panjalu (Kediri) ; Kediri absorbera plus tard Janggala.
  Anawrahta becomes king of Pagan and unites the dry zone; the Pyu towns of the south come under Pagan.: Anawrahta devient roi de Pagan et unifie la zone sèche ; les villes pyu du sud passent sous l’autorité de Pagan.
  Anawrahta takes Thaton, the main city of the Mon, and brings Lower Burma and the Tenasserim coast under Pagan.: Anawrahta prend Thaton, la principale cité des Môns, et place la Basse-Birmanie et la côte du Tenasserim sous l’autorité de Pagan.
  Lý Thánh Tông takes the Cham capital and its king Rudravarman III, who buys his freedom with the three northern districts of Champa (Quảng Bình and the north of Quảng Trị).: Lý Thánh Tông prend la capitale chame et son roi Rudravarman III, qui achète sa liberté en cédant les trois districts septentrionaux du Champa (le Quảng Bình et le nord du Quảng Trị).
  About 1100. Kedah, the old port kingdom at the foot of Gunung Jerai, rules its coast as a state of its own after Srivijaya’s decline; its rulers become Muslim, by tradition, in 1136.: Vers 1100. Le Kedah, vieux royaume portuaire situé au pied du Gunung Jerai, gouverne sa côte comme un État indépendant après le déclin de Srivijaya ; ses souverains se convertissent à l’islam, selon la tradition, en 1136.
  "About 1180. Under Jayavarman VII the Khmer Empire reaches its greatest extent: inscriptions and rest houses show Khmer rule as far as Sukhothai in the west and the Vientiane plain in the north. On the isthmus Tambralinga (Nakhon Si Thammarat) has replaced Srivijaya as the leading power.": "Vers 1180. Sous Jayavarman VII, l’Empire khmer atteint sa plus grande extension : inscriptions et gîtes d’étape attestent la domination khmère jusqu’à Sukhothaï à l’ouest et jusqu’à la plaine de Vientiane au nord. Sur l’isthme, Tambralinga (Nakhon Si Thammarat) a remplacé Srivijaya comme puissance dominante."
  Jayavarman VII’s army conquers Champa, which is ruled as a Khmer province until 1220.: L’armée de Jayavarman VII conquiert le Champa, qui est gouverné comme une province khmère jusqu’en 1220.
  The Khmer withdraw from Champa, and Jaya Paramesvaravarman II restores its independence.: Les Khmers se retirent du Champa, et Jaya Paramesvaravarman II rétablit son indépendance.
  Ken Arok defeats King Kertajaya of Kediri at Ganter and founds the kingdom of Singhasari in East Java.: Ken Arok bat le roi Kertajaya de Kediri à Ganter et fonde le royaume de Singhasari, à Java oriental.
  About 1238. Two Thai chiefs, Pho Khun Bang Klang Hao and Pha Mueang, drive the Khmer governor from Sukhothai; Bang Klang Hao becomes its first king, Si Inthrathit.: Vers 1238. Deux chefs thaïs, Pho Khun Bang Klang Hao et Pha Mueang, chassent le gouverneur khmer de Sukhothaï ; Bang Klang Hao en devient le premier roi, sous le nom de Si Inthrathit.
  About 1240. Lavo (Lopburi) and the lower Chao Phraya plain break away from the Khmer Empire; Lavo sends its own missions to China later in the century.: Vers 1240. Lavo (Lopburi) et la basse plaine de la Chao Phraya se détachent de l’Empire khmer ; Lavo envoie ses propres missions en Chine plus tard dans le siècle.
  Mangrai, ruler of Ngoenyang, founds Chiang Rai, the first step of the kingdom of Lan Na.: Mangrai, souverain de Ngoenyang, fonde Chiang Rai, première étape du royaume de Lan Na.
  About 1267. Samudera Pasai, on the north coast of Sumatra, becomes a sultanate under Malik al-Saleh (died 1297), the first Muslim kingdom of the islands known from its own remains.: "Vers 1267. Samudera Pasai, sur la côte nord de Sumatra, devient un sultanat sous Malik al-Saleh (mort en 1297) : c’est le premier royaume musulman des îles connu par ses propres vestiges."
  Kertanegara of Singhasari sends the Pamalayu expedition to Sumatra (1275–1293). By then the leadership of the Malay world in Sumatra has passed from Srivijaya to Melayu, with its centre on the upper Batang Hari at Dharmasraya, and the ports of the southern Malay peninsula and the Riau Islands no longer answer to one ruler.: Kertanegara de Singhasari envoie l’expédition Pamalayu à Sumatra (1275–1293). À cette époque, la direction du monde malais à Sumatra est passée de Srivijaya à Melayu, dont le centre se trouve sur le cours supérieur de la Batang Hari, à Dharmasraya, et les ports du sud de la péninsule Malaise et des îles Riau ne relèvent plus d’un seul souverain.
  A Mongol invasion from Yunnan and the murder of King Narathihapate break up the Pagan Empire. Wareru, a Mon, makes himself king at Martaban, founding the kingdom later called Hanthawaddy; the Shan chiefs of the hills go their own way, and the Tenasserim coast south of Tavoy passes to Sukhothai. Pagan survives as a small kingdom until 1297, when its king Kyawswa submits to the Mongols and is deposed.: Une invasion mongole venue du Yunnan et l’assassinat du roi Narathihapate font éclater l’Empire de Pagan. Wareru, un Môn, se fait roi à Martaban et fonde le royaume appelé plus tard Hanthawaddy ; les chefs shans des collines prennent leur indépendance, et la côte du Tenasserim au sud de Tavoy passe à Sukhothaï. Pagan survit comme petit royaume jusqu’en 1297, lorsque son roi Kyawswa se soumet aux Mongols et est déposé.
  Mangrai takes Hariphunchai (Lamphun); in 1296 he founds Chiang Mai, the capital of Lan Na.: Mangrai prend Hariphunchai (Lamphun) ; en 1296, il fonde Chiang Mai, la capitale du Lan Na.
  Jayakatwang, ruler of Gelang-gelang and a vassal of Singhasari, rebels while Kertanegara’s army is away in Sumatra, kills the king in his palace and restores the kingdom of Kediri at Daha.: Jayakatwang, souverain de Gelang-gelang et vassal de Singhasari, se révolte pendant que l’armée de Kertanegara est à Sumatra, tue le roi dans son palais et restaure le royaume de Kediri à Daha.
  Raden Wijaya, Kertanegara’s son-in-law, uses the Mongol expedition sent against Java to overthrow Jayakatwang of Kediri, who had killed Kertanegara in 1292, then drives the Mongols out and founds Majapahit.: Raden Wijaya, gendre de Kertanegara, se sert de l’expédition mongole envoyée contre Java pour renverser Jayakatwang de Kediri, qui avait tué Kertanegara en 1292, puis chasse les Mongols et fonde Majapahit.
  The three brothers of Myinsaing, Shan-Burmese commanders, depose the last Pagan king, Kyawswa, and rule the dry zone; Thihathu moves the capital to Pinya in 1313.: Les trois frères de Myinsaing, des commandants shan-birmans, déposent le dernier roi de Pagan, Kyawswa, et gouvernent la zone sèche ; Thihathu transfère la capitale à Pinya en 1313.
  About 1300. In the islands the oldest kingdoms of South Sulawesi are named in their chronicles — Luwu, Bone and the Makassar kingdom of Gowa — and Ternate and Tidore rule the clove islands of the northern Moluccas.: Vers 1300. Dans les îles, les chroniques nomment les plus anciens royaumes de Sulawesi du Sud — Luwu, Bone et le royaume makassar de Gowa —, et Ternate et Tidore règnent sur les îles aux girofliers du nord des Moluques.
  Champa cedes the districts of Ô and Lý (Thuận Hóa, around Huế) to Đại Việt as the marriage gift for the Vietnamese princess Huyền Trân.: Le Champa cède au Đại Việt les districts d’Ô et de Lý (Thuận Hóa, autour de Huế) en présent de noces pour la princesse vietnamienne Huyền Trân.
  Sawyun, a son of Thihathu, makes Sagaing a kingdom of its own across the Irrawaddy from Pinya.: Sawyun, un fils de Thihathu, fait de Sagaing un royaume distinct, en face de Pinya, sur l’autre rive de l’Irrawaddy.
  Lan Na annexes the kingdom of Phayao.: Le Lan Na annexe le royaume de Phayao.
  Adityawarman, a prince of Melayu raised at Majapahit, moves his court to the Minangkabau highlands, the beginning of the kingdom of Pagaruyung. Palembang has rulers of its own.: "Adityawarman, un prince de Melayu élevé à Majapahit, transfère sa cour dans les hautes terres minangkabau : c’est le début du royaume de Pagaruyung. Palembang a ses propres souverains."
  About 1350. Tanjungpura in western Borneo and Kutai on the Mahakam are named among Majapahit’s tributaries in the Nagarakretagama (1365).: Vers 1350. Tanjungpura, dans l’ouest de Bornéo, et Kutai, sur la Mahakam, figurent parmi les tributaires de Majapahit dans le Nagarakretagama (1365).
  U Thong founds Ayutthaya, joining Lavo and Suphannaburi into one kingdom; Nakhon Si Thammarat (the old Tambralinga) and the upper isthmus, ruled by a Thai line since the late 13th century, come under it.: U Thong fonde Ayutthaya en réunissant Lavo et Suphannaburi en un seul royaume ; Nakhon Si Thammarat (l’ancienne Tambralinga) et le nord de l’isthme, gouvernés par une lignée thaïe depuis la fin du XIIIe siècle, passent sous son autorité.
  Fa Ngum, a Lao prince raised at Angkor, founds the kingdom of Lan Xang at Muang Sua (Luang Prabang), stretching from the borders of Yunnan to the Khone Falls and over the Khorat plateau.: Fa Ngum, un prince lao élevé à Angkor, fonde le royaume de Lan Xang à Muang Sua (Luang Prabang) ; il s’étend des confins du Yunnan aux chutes de Khone et sur le plateau de Khorat.
  Thado Minbya ends the rival kingdoms of Pinya and Sagaing and founds Ava, which rules the dry zone for the next two centuries.: Thado Minbya met fin aux royaumes rivaux de Pinya et de Sagaing et fonde Ava, qui gouverne la zone sèche pendant les deux siècles suivants.
  Majapahit sacks Palembang after its ruler seeks recognition from the Ming. Chinese settlers then rule the port; the Ming name one of them its governor in 1407.: Majapahit met Palembang à sac après que son souverain a sollicité la reconnaissance des Ming. Des colons chinois gouvernent ensuite le port ; les Ming nomment l’un d’eux gouverneur en 1407.
  About 1400. Parameswara, a prince from Palembang driven from Temasek (Singapore), founds Malacca, which becomes the leading port of the Strait within a generation. The southern Malay peninsula and the Riau Islands, under Srivijaya’s heirs until the late 13th century, have had no one ruler since. Buton is a kingdom of its own off south-eastern Sulawesi.: Vers 1400. Parameswara, un prince de Palembang chassé de Temasek (Singapour), fonde Malacca, qui devient en une génération le premier port du détroit. Le sud de la péninsule Malaise et les îles Riau, soumis aux héritiers de Srivijaya jusqu’à la fin du XIIIe siècle, n’ont plus de souverain unique depuis lors. Buton forme un royaume distinct au large du sud-est de Sulawesi.
  Hồ Quý Ly, who seized the throne of Đại Việt in 1400 and renamed it Đại Ngu, forces Champa to cede Amaravati (Quảng Nam and Quảng Ngãi).: Hồ Quý Ly, qui s’est emparé du trône du Đại Việt en 1400 et l’a rebaptisé Đại Ngu, contraint le Champa à céder Amaravati (Quảng Nam et Quảng Ngãi).
  The Ming, who have conquered Đại Ngu and captured the Hồ rulers, annex it as the province of Jiaozhi. Champa takes back the lands south of the Hải Vân pass that it had ceded to the Hồ.: Les Ming, qui ont conquis le Đại Ngu et capturé les souverains Hồ, l’annexent comme province de Jiaozhi. Le Champa reprend les terres situées au sud du col de Hải Vân qu’il avait cédées aux Hồ.
  Lê Lợi, victor of the ten-year Lam Sơn rising, takes the throne of a restored Đại Việt after the Ming army withdraws.: Lê Lợi, vainqueur du soulèvement de Lam Sơn, qui a duré dix ans, monte sur le trône d’un Đại Việt restauré après le retrait de l’armée des Ming.
  Ayutthaya takes and sacks Angkor. The Khmer court moves south, to Srei Santhor and later Phnom Penh, and Ayutthaya takes the Khorat plateau and the coast at Chanthaburi.: Ayutthaya prend et met à sac Angkor. La cour khmère se replie vers le sud, à Srei Santhor puis à Phnom Penh, et Ayutthaya s’empare du plateau de Khorat et de la côte de Chanthaburi.
  On the death of King Mahathammaracha IV, Ayutthaya annexes Sukhothai, its vassal since 1378.: À la mort du roi Mahathammaracha IV, Ayutthaya annexe Sukhothaï, son vassal depuis 1378.
  Lan Na under Tilokarat annexes Phrae and Nan in the 1440s.: Le Lan Na de Tilokarat annexe Phrae et Nan dans les années 1440.
  About 1448. During the troubles in Lan Xang, Đại Việt annexes the Black Tai country along the Black River in the north-west (Điện Biên and Sơn La).: Vers 1448. Pendant les troubles du Lan Xang, le Đại Việt annexe le pays des Tai noirs, le long de la rivière Noire, dans le nord-ouest (Điện Biên et Sơn La).
  About 1450. Sulu, in the archipelago south-west of Mindanao, becomes a sultanate under Sharif ul-Hashim, by its own tradition; Malacca, now Muslim, rules Pahang and the coasts of the peninsula and of Sumatra opposite.: Vers 1450. Sulu, dans l’archipel situé au sud-ouest de Mindanao, devient un sultanat sous Sharif ul-Hashim, selon sa propre tradition ; Malacca, désormais musulmane, domine le Pahang et les côtes de la péninsule et de Sumatra qui lui font face.
  Pahang, conquered by Malacca in the 1450s, receives a Malacca prince, Muhammad Shah, as its first sultan.: Le Pahang, conquis par Malacca dans les années 1450, reçoit un prince de Malacca, Muhammad Shah, comme premier sultan.
  Lê Thánh Tông takes Vijaya, the Cham capital, and annexes it with Amaravati (Quảng Nam and Quảng Ngãi); what remains of Champa, in Kauthara and Panduranga, becomes a small kingdom in the far south.: Lê Thánh Tông prend Vijaya, la capitale chame, et l’annexe avec Amaravati (Quảng Nam et Quảng Ngãi) ; ce qui reste du Champa, au Kauthara et au Panduranga, devient un petit royaume dans l’extrême sud.
  About 1475. Demak, on the north coast of Central Java, becomes the first Muslim power of Java under Raden Patah.: Vers 1475. Demak, sur la côte nord de Java central, devient la première puissance musulmane de Java sous Raden Patah.
  Cirebon, under Sunan Gunung Jati, breaks away from the Hindu kingdom of Sunda.: Cirebon, sous Sunan Gunung Jati, se détache du royaume hindou de Sunda.
  Thado Minsaw, governor of Prome, breaks away from Ava and founds the kingdom of Prome.: Thado Minsaw, gouverneur de Prome, se détache d’Ava et fonde le royaume de Prome.
  About 1496. Aceh, at the northern tip of Sumatra, becomes a sultanate; Ali Mughayat Syah (died 1530) makes it a power.: Vers 1496. Aceh, à la pointe nord de Sumatra, devient un sultanat ; Ali Mughayat Syah (mort en 1530) en fait une puissance.
  About 1500. Ternate’s rulers extend their sway to Hitu on Ambon and to Seram and Buru, the islands of the central Moluccas.: Vers 1500. Les souverains de Ternate étendent leur influence à Hitu, sur Ambon, ainsi qu’à Seram et à Buru, les îles du centre des Moluques.
  About 1500. Pattani, the port of the old Langkasuka, is a Malay sultanate; Kelantan has its own rulers under Malacca’s overlordship; Brunei, at the height of its power, rules the coasts of north-western Borneo. Aru (Haru), on the east coast of Sumatra, is the rival of Pasai and Malacca.: Vers 1500. Pattani, le port de l’ancien Langkasuka, est un sultanat malais ; le Kelantan a ses propres souverains sous la suzeraineté de Malacca ; Brunei, à l’apogée de sa puissance, domine les côtes du nord-ouest de Bornéo. Aru (Haru), sur la côte est de Sumatra, est le rival de Pasai et de Malacca.
  Mingyi Nyo of Toungoo breaks with Ava, the beginning of the Toungoo kingdom.: "Mingyi Nyo de Toungoo rompt avec Ava : c’est le début du royaume de Toungoo."
  A Portuguese fleet under Afonso de Albuquerque takes Malacca. Sultan Mahmud withdraws, first to Pahang and Bintan, and his heirs rule the peninsula’s south from the Riau Islands and Johor.: Une flotte portugaise commandée par Afonso de Albuquerque prend Malacca. Le sultan Mahmud se retire, d’abord au Pahang et à Bintan, et ses héritiers gouvernent le sud de la péninsule depuis les îles Riau et le Johor.
  About 1520. Sharif Kabungsuwan, from Johor, founds the sultanate of Maguindanao in the Cotabato valley of Mindanao.: Vers 1520. Sharif Kabungsuwan, venu du Johor, fonde le sultanat de Maguindanao dans la vallée de Cotabato, à Mindanao.
  Aceh takes Pasai, which the Portuguese have held since 1521, and Pedir; by 1530 it rules the north of Sumatra.: Aceh prend Pasai, que les Portugais tenaient depuis 1521, ainsi que Pedir ; en 1530, le sultanat domine le nord de Sumatra.
  About 1526. Raden Samudra, with help from Demak, becomes the first sultan of Banjar (Banjarmasin) in southern Borneo.: Vers 1526. Raden Samudra, avec l’aide de Demak, devient le premier sultan de Banjar (Banjarmasin), dans le sud de Bornéo.
  Demak has destroyed Majapahit’s successor at Daha (Kediri) and, under Fatahillah, takes Sunda Kelapa (Jayakarta) and Banten from Sunda; Palembang is governed for Demak. In Burma the Confederation of Shan States, led by Mohnyin, takes Ava. In Đại Việt the general Mạc Đăng Dung seizes the throne and founds the Mạc dynasty.: Demak a détruit le successeur de Majapahit à Daha (Kediri) et, sous Fatahillah, prend Sunda Kelapa (Jayakarta) et Banten au royaume de Sunda ; Palembang est gouvernée pour le compte de Demak. En Birmanie, la Confédération des États shans, menée par Mohnyin, prend Ava. Au Đại Việt, le général Mạc Đăng Dung s’empare du trône et fonde la dynastie Mạc.
  "Sultan Mahmud’s sons divide what is left of Malacca’s realm: Alauddin Riayat Shah founds Johor, with the Riau Islands, Singapore and the south of the peninsula, and Muzaffar Shah founds Perak.": "Les fils du sultan Mahmud se partagent ce qui reste du royaume de Malacca : Alauddin Riayat Shah fonde le Johor, avec les îles Riau, Singapour et le sud de la péninsule, et Muzaffar Shah fonde le Perak."
  Tabinshwehti of Toungoo takes Pegu, the capital of Hanthawaddy.: Tabinshwehti de Toungoo prend Pégou, la capitale de Hanthawaddy.
  Toungoo takes Martaban after a seven-month siege, and with it the Mon country to Tavoy.: Toungoo prend Martaban après un siège de sept mois, et avec elle le pays môn jusqu’à Tavoy.
  Toungoo takes Prome.: Toungoo prend Prome.
  The Lê, restored in exile in 1533 by Nguyễn Kim, take back Thanh Hóa; for fifty years the Lê (with the Trịnh and Nguyễn lords) hold the south and the Mạc the north.: Les Lê, restaurés en exil en 1533 par Nguyễn Kim, reprennent Thanh Hóa ; pendant cinquante ans, les Lê (avec les seigneurs Trịnh et Nguyễn) tiennent le sud et les Mạc le nord.
  After the death of Hkonmaing, the Shan king of Ava, Ava makes peace with Toungoo and cedes the land down to Pagan.: Après la mort de Hkonmaing, le roi shan d’Ava, Ava fait la paix avec Toungoo et lui cède les terres jusqu’à Pagan.
  "Sultan Trenggana of Demak dies before Panarukan, and Demak’s realm falls apart: Surabaya leads the east, and Jaka Tingkir, lord of Pajang, rises in the interior.": "Le sultan Trenggana de Demak meurt devant Panarukan, et le royaume de Demak se désagrège : Surabaya prend la tête de l’est, et Jaka Tingkir, seigneur de Pajang, s’élève dans l’intérieur."
  About 1550. Palembang, a vassal of Demak and later Mataram, is ruled by a Javanese dynasty; it becomes a sultanate in 1659. Jambi has its own Malay rulers.: Vers 1550. Palembang, vassale de Demak puis de Mataram, est gouvernée par une dynastie javanaise ; elle devient un sultanat en 1659. Jambi a ses propres souverains malais.
  Bayinnaung of Toungoo takes Ava from the Shan, and in 1557 the Shan states become his vassals.: Bayinnaung de Toungoo prend Ava aux Shans et, en 1557, les États shans deviennent ses vassaux.
  Bayinnaung of Toungoo takes Chiang Mai; Lan Na becomes a Burmese vassal kingdom and, from 1578, is ruled by Burmese princes and governors.: Bayinnaung de Toungoo prend Chiang Mai ; le Lan Na devient un royaume vassal de la Birmanie et, à partir de 1578, il est gouverné par des princes et des gouverneurs birmans.
  Aceh conquers Aru on the east coast of Sumatra.: Aceh conquiert Aru, sur la côte est de Sumatra.
  Miguel López de Legazpi lands at Cebu and founds the first Spanish settlement in the Philippines.: Miguel López de Legazpi débarque à Cebu et fonde le premier établissement espagnol aux Philippines.
  Jaka Tingkir, as Sultan Hadiwijaya, makes Pajang the heir of Demak in the interior of Central Java.: Jaka Tingkir, devenu le sultan Hadiwijaya, fait de Pajang l’héritier de Demak dans l’intérieur de Java central.
  The Spanish move to Panay.: Les Espagnols déplacent leur base à Panay.
  Legazpi founds Spanish Manila on the site of the Muslim town of Maynila, taken the year before, and makes it the capital of the Spanish East Indies; the towns of the Manila Bay plain and Mindoro submit.: Legazpi fonde la Manille espagnole sur le site de la ville musulmane de Maynila, prise l’année précédente, et en fait la capitale des Indes orientales espagnoles ; les villes de la plaine de la baie de Manille et Mindoro se soumettent.
  In 1572–1574 Juan de Salcedo’s expeditions bring the Ilocos coast, Pangasinan and the Bicol peninsula under Spain, and the rest of the Visayas follow.: En 1572–1574, les expéditions de Juan de Salcedo placent la côte d’Ilocos, le Pangasinan et la péninsule de Bicol sous l’autorité de l’Espagne, et le reste des Visayas suit.
  Banten takes Pakuan Pajajaran, the capital of Sunda, and the Hindu kingdom of Sunda comes to an end; Sumedang Larang, which claims its heritage, keeps the Priangan highlands.: Banten prend Pakuan Pajajaran, la capitale de Sunda, et le royaume hindou de Sunda prend fin ; Sumedang Larang, qui revendique son héritage, conserve les hautes terres du Priangan.
  The Spanish occupy the Cagayan valley in northern Luzon.: Les Espagnols occupent la vallée de Cagayan, dans le nord de Luçon.
  Senapati, lord of Mataram, takes over Pajang and founds the Mataram Sultanate.: Senapati, seigneur de Mataram, s’empare de Pajang et fonde le sultanat de Mataram.
  The Lê and Trịnh retake Thăng Long; the Mạc hold out in Cao Bằng, under Ming and later Qing protection, until 1677.: Les Lê et les Trịnh reprennent Thăng Long ; les Mạc se maintiennent à Cao Bằng, sous la protection des Ming puis des Qing, jusqu’en 1677.
  Naresuan’s armies take Tavoy and Tenasserim from Burma for Ayutthaya.: Les armées de Naresuan prennent Tavoy et Tenasserim à la Birmanie pour le compte d’Ayutthaya.
  The governor of Moulmein rises against Pegu and calls in Naresuan; the Burmese garrison abandons Martaban, and the Mon provinces become subject to Ayutthaya.: Le gouverneur de Moulmein se soulève contre Pégou et appelle Naresuan ; la garnison birmane abandonne Martaban, et les provinces môns passent sous la domination d’Ayutthaya.
  As the Toungoo empire breaks up, Nawrahta Minsaw, Bayinnaung’s son and viceroy of Lan Na, breaks with Pegu; about 1602 he submits to Naresuan, and Lan Na becomes a vassal of Ayutthaya.: Alors que l’empire taungû se disloque, Nawrahta Minsaw, fils de Bayinnaung et vice-roi du Lan Na, rompt avec Pégou ; vers 1602, il se soumet à Naresuan, et le Lan Na devient un vassal d’Ayutthaya.
  "The Toungoo empire breaks up: the armies of Arakan and of Toungoo’s own lord take and burn Pegu. The Nyaungyan prince holds Ava, and the port of Syriam is left to Arakan and its Portuguese mercenaries.": "L’empire taungû se disloque : les armées de l’Arakan et du seigneur même de Toungoo prennent et incendient Pégou. Le prince de Nyaungyan tient Ava, et le port de Syriam est laissé à l’Arakan et à ses mercenaires portugais."
  About 1600. Nguyễn Hoàng, governor of Thuận Hóa and Quảng Nam, returns to the south and rules it as his own, the start of Đàng Trong. The Spanish have occupied the north coast of Mindanao (Caraga and Butuan); around Lake Lanao the Maranao have formed the confederation of the Lanao sultanates (Pat a Pangampong ko Ranao).: "Vers 1600. Nguyễn Hoàng, gouverneur de Thuận Hóa et de Quảng Nam, revient dans le sud et le gouverne pour son propre compte : c’est le début de Đàng Trong. Les Espagnols ont occupé la côte nord de Mindanao (Caraga et Butuan) ; autour du lac Lanao, les Maranao ont formé la confédération des sultanats du Lanao (Pat a Pangampong ko Ranao)."
  Filipe de Brito e Nicote, the Portuguese commander at Syriam, declares for Portugal and rules the port as a Portuguese fort.: Filipe de Brito e Nicote, le commandant portugais de Syriam, se déclare pour le Portugal et gouverne le port comme un fort portugais.
  The Dutch East India Company (VOC) takes the Portuguese fort on Ambon, its first territory in the islands.: La Compagnie néerlandaise des Indes orientales (VOC) prend le fort portugais d’Ambon, son premier territoire dans les îles.
  The Nguyễn take Phú Yên from Champa.: Les Nguyễn prennent Phú Yên au Champa.
  Anaukpetlun’s armies bring Lan Na back under Burma, whose vassal kings rule it for more than a century.: Les armées d’Anaukpetlun replacent le Lan Na sous l’autorité de la Birmanie, dont les rois vassaux le gouvernent pendant plus d’un siècle.
  Jan Pieterszoon Coen takes Jayakarta from Banten and founds Batavia, the VOC’s capital in Asia.: Jan Pieterszoon Coen prend Jayakarta à Banten et fonde Batavia, la capitale de la VOC en Asie.
  About 1620. Sumedang Larang, the heir of Sunda in the Priangan highlands, submits to Mataram.: Vers 1620. Sumedang Larang, héritier de Sunda dans les hautes terres du Priangan, se soumet à Mataram.
  Bima, on Sumbawa, becomes a sultanate after Gowa’s conquest and conversion of the island.: Bima, sur Sumbawa, devient un sultanat après la conquête et la conversion de l’île par Gowa.
  Pahang, devastated by Aceh in 1617, passes to Johor.: Le Pahang, dévasté par Aceh en 1617, passe au Johor.
  Sultan Agung of Mataram conquers Madura.: Le sultan Agung de Mataram conquiert Madura.
  Sultan Agung takes Surabaya after a five-year siege; Mataram rules all of Central and East Java except Blambangan.: Le sultan Agung prend Surabaya après un siège de cinq ans ; Mataram domine tout Java central et oriental, à l’exception de Blambangan.
  The VOC and Johor take Malacca from the Portuguese after a five-month siege.: La VOC et le Johor prennent Malacca aux Portugais après un siège de cinq mois.
  The Nguyễn take Kauthara (Khánh Hòa) from Champa.: Les Nguyễn prennent le Kauthara (Khánh Hòa) au Champa.
  The Spanish build the fort of Taytay in northern Palawan, where the Calamianes and Cuyo have had Spanish missions since the 1620s.: Les Espagnols construisent le fort de Taytay, dans le nord de Palawan, où les Calamianes et Cuyo ont des missions espagnoles depuis les années 1620.
  By the Treaty of Bongaya, after its defeat by the VOC and Bone, Gowa loses its overseas vassals and hands the fort of Makassar to the Company; Bone becomes the leading power of South Sulawesi.: Par le traité de Bongaya, après sa défaite face à la VOC et à Bone, Gowa perd ses vassaux d’outre-mer et remet le fort de Makassar à la Compagnie ; Bone devient la première puissance de Sulawesi du Sud.
  Deli, on the east coast of Sumatra, throws off the overlordship of Aceh.: Deli, sur la côte est de Sumatra, rejette la suzeraineté d’Aceh.
  The Lê and Trịnh take Cao Bằng, the last stronghold of the Mạc.: Les Lê et les Trịnh prennent Cao Bằng, le dernier bastion des Mạc.
  A treaty with Sultan Amsterdam of Ternate, in force from 11 May 1677, hands Ternate’s possessions in Sulawesi, Gorontalo and Limboto among them, to the VOC.: Un traité avec le sultan Amsterdam de Ternate, en vigueur à partir du 11 mai 1677, cède à la VOC les possessions de Ternate à Sulawesi, dont Gorontalo et Limboto.
  The chiefs of Minahasa, in northern Sulawesi, sign a treaty with the VOC, which has replaced the Spanish at Manado.: Les chefs de la Minahasa, dans le nord de Sulawesi, signent un traité avec la VOC, qui a remplacé les Espagnols à Manado.
  Sultan Amsterdam of Ternate, defeated in his war against the VOC, signs a treaty that makes Ternate a fief of the Company, which takes over its sovereignty and more of its lands; his predecessor Mandar Syah had already given up Ternate’s claims in the central Moluccas in return for the Company’s help against rebels.: Le sultan Amsterdam de Ternate, vaincu dans sa guerre contre la VOC, signe un traité qui fait de Ternate un fief de la Compagnie, laquelle s’approprie sa souveraineté et une plus grande partie de ses terres ; son prédécesseur Mandar Syah avait déjà renoncé aux prétentions de Ternate sur le centre des Moluques en échange de l’aide de la Compagnie contre des rebelles.
  The English East India Company founds Bencoolen (Bengkulu) on the west coast of Sumatra.: La Compagnie anglaise des Indes orientales fonde Bencoolen (Bengkulu), sur la côte ouest de Sumatra.
  Nguyễn Hữu Cảnh organises the Đồng Nai and Saigon (Prey Nokor) country, long settled by Vietnamese under Cambodian rule, as the Nguyễn prefecture of Gia Định.: Nguyễn Hữu Cảnh organise le pays de Đồng Nai et de Saïgon (Prey Nokor), peuplé de longue date de Vietnamiens sous domination cambodgienne, en préfecture Nguyễn de Gia Định.
  The first Portuguese governor of Timor settles at Lifau (Oecusse); the Timorese kingdoms of the east are drawn into a loose Portuguese overlordship. Dili becomes the capital in 1769.: Le premier gouverneur portugais de Timor s’installe à Lifau (Oecusse) ; les royaumes timorais de l’est sont entraînés dans une vague suzeraineté portugaise. Dili devient la capitale en 1769.
  About 1704. Brunei cedes north-eastern Borneo to Sulu, by Sulu’s account in return for help in a Brunei civil war; some sources date the cession to 1658, and Brunei’s tradition denies it. Sulu also claims southern Palawan.: Vers 1704. Brunei cède le nord-est de Bornéo à Sulu, selon Sulu en échange de son aide dans une guerre civile à Brunei ; certaines sources datent la cession de 1658, et la tradition de Brunei la nie. Sulu revendique aussi le sud de Palawan.
  Mataram cedes the eastern Priangan and Cirebon to the VOC for its help in the First Javanese War of Succession; the western Priangan and Semarang had been ceded in 1677–1678, for the Company’s help against Trunajaya.: Mataram cède le Priangan oriental et Cirebon à la VOC en échange de son aide dans la première guerre de succession javanaise ; le Priangan occidental et Semarang avaient été cédés en 1677–1678, pour l’aide de la Compagnie contre Trunajaya.
  Lan Xang splits into the kingdoms of Luang Prabang and Vientiane; Muang Phuan (Xieng Khouang) goes its own way between them.: Le Lan Xang se scinde en royaumes de Luang Prabang et de Vientiane ; Muang Phuan (Xieng Khouang) prend son indépendance entre les deux.
  Nokasad, a grandson of the last king of Lan Xang, founds the kingdom of Champasak in the south.: Nokasad, petit-fils du dernier roi du Lan Xang, fonde le royaume de Champassak dans le sud.
  The Spanish rebuild their fort at Zamboanga, first held from 1635 to 1663.: Les Espagnols reconstruisent leur fort de Zamboanga, tenu une première fois de 1635 à 1663.
  Raja Kecil, who has fought Johor for its throne, founds the sultanate of Siak, until then a Johor dependency, on the east coast of Sumatra.: Raja Kecil, qui a disputé au Johor son trône, fonde le sultanat de Siak, jusque-là dépendance du Johor, sur la côte est de Sumatra.
  About 1725. Terengganu becomes a sultanate of its own under Zainal Abidin I, a younger brother of the Johor sultan Abdul Jalil IV; Terengganu’s own tradition dates his rule from 1708.: Vers 1725. Terengganu devient un sultanat distinct sous Zainal Abidin Ier, frère cadet du sultan de Johor Abdul Jalil IV ; la tradition de Terengganu fait commencer son règne en 1708.
  Chiang Mai rises against Burmese rule, and Burmese control of Lan Na falls apart as the Toungoo kingdom declines; only Chiang Saen keeps a Burmese governor. Lan Na’s principalities are independent until 1763.: Chiang Mai se soulève contre la domination birmane, et le contrôle birman sur le Lan Na s’effondre à mesure que le royaume taungû décline ; seul Chiang Saen garde un gouverneur birman. Les principautés du Lan Na restent indépendantes jusqu’en 1763.
  The Nguyễn set up the Định Viễn district at Vĩnh Long, pushing further into the Mekong delta.: Les Nguyễn créent le district de Định Viễn à Vĩnh Long et s’avancent plus loin dans le delta du Mékong.
  The Mon of Lower Burma rise against Ava and restore the kingdom of Hanthawaddy at Pegu.: Les Môns de Basse-Birmanie se soulèvent contre Ava et restaurent le royaume de Hanthawaddy à Pégou.
  About 1740. The Balinese kingdom of Karangasem conquers Lombok.: Vers 1740. Le royaume balinais de Karangasem conquiert Lombok.
  Pakubuwono II cedes the north coast of Java and Madura to the VOC for its help against the Chinese War rebels.: Pakubuwono II cède la côte nord de Java et Madura à la VOC en échange de son aide contre les rebelles de la guerre chinoise.
  The VOC and its Timorese allies defeat the Topasses (Portuguese-speaking mestizos from Larantuka) at Penfui near Kupang; West Timor passes to the Company’s sphere.: La VOC et ses alliés timorais battent les Topasses (des métis lusophones de Larantuka) à Penfui, près de Kupang ; le Timor occidental passe dans la sphère de la Compagnie.
  Alaungpaya, headman of Moksobo (Shwebo), refuses to submit to the Mon armies besieging Ava, proclaims himself king and founds the Konbaung dynasty.: Alaungpaya, chef du village de Moksobo (Shwebo), refuse de se soumettre aux armées môns qui assiègent Ava, se proclame roi et fonde la dynastie Konbaung.
  Hanthawaddy’s army takes Ava, ending the Toungoo dynasty.: L’armée de Hanthawaddy prend Ava, mettant fin à la dynastie Taungû.
  Konbaung forces under Alaungpaya’s son Hsinbyushin retake Ava.: Les forces des Konbaung, commandées par Hsinbyushin, fils d’Alaungpaya, reprennent Ava.
  The Treaty of Giyanti divides Mataram between Pakubuwono III at Surakarta and his uncle Mangkubumi, now Sultan Hamengkubuwono I, at Yogyakarta; their outer provinces are divided in a patchwork, which the map simplifies.: Le traité de Giyanti partage Mataram entre Pakubuwono III, à Surakarta, et son oncle Mangkubumi, devenu le sultan Hamengkubuwono Ier, à Yogyakarta ; leurs provinces extérieures sont réparties en une mosaïque que la carte simplifie.
  Cambodia cedes the rest of the Mekong delta (Trà Vinh, Sóc Trăng and the Bassac) to the Nguyễn; Hà Tiên, ruled by the Mạc family as a Nguyễn vassal since 1708, joins it.: Le Cambodge cède le reste du delta du Mékong (Trà Vinh, Sóc Trăng et le Bassac) aux Nguyễn ; Hà Tiên, gouvernée par la famille Mạc comme vassale des Nguyễn depuis 1708, est rattachée à leur domaine.
  Alaungpaya takes Pegu and destroys the restored kingdom of Hanthawaddy.: Alaungpaya prend Pégou et détruit le royaume restauré de Hanthawaddy.
  Konbaung armies, based at Chiang Saen, take Chiang Mai and bring Lan Na under direct Burmese rule.: Les armées des Konbaung, basées à Chiang Saen, prennent Chiang Mai et placent le Lan Na sous administration birmane directe.
  Konbaung armies take Mergui and Tenasserim on their way to Ayutthaya.: Les armées des Konbaung prennent Mergui et Tenasserim en route vers Ayutthaya.
  About 1766. Raja Lumu, of the Bugis family that rules in Riau, becomes the first sultan of Selangor.: Vers 1766. Raja Lumu, de la famille bugis qui règne à Riau, devient le premier sultan de Selangor.
  Ayutthaya falls to the Burmese and is destroyed. The Burmese hold the lower Chao Phraya; elsewhere Siam breaks up among rival regimes at Phitsanulok, Fang, Phimai and Nakhon Si Thammarat.: Ayutthaya tombe aux mains des Birmans et est détruite. Les Birmans tiennent la basse Chao Phraya ; ailleurs, le Siam se morcelle entre des régimes rivaux établis à Phitsanulok, Fang, Phimai et Nakhon Si Thammarat.
  Phraya Tak (Taksin) takes Chanthaburi, the base for his reconquest.: Phraya Tak (Taksin) prend Chanthaburi, base de sa reconquête.
  Taksin takes Thonburi and then the Burmese camp at Pho Sam Ton, and makes Thonburi his capital; he is crowned on 28 December.: Taksin prend Thonburi, puis le camp birman de Pho Sam Ton, et fait de Thonburi sa capitale ; il est couronné le 28 décembre.
  Taksin defeats the Phimai regime on the Khorat plateau.: Taksin bat le régime de Phimai, sur le plateau de Khorat.
  The VOC conquers Blambangan, at the eastern end of Java, after a war with its Balinese-backed rulers; resistance goes on until 1772.: La VOC conquiert Blambangan, à l’extrémité orientale de Java, après une guerre contre ses souverains soutenus par Bali ; la résistance se poursuit jusqu’en 1772.
  Taksin defeats the Nakhon Si Thammarat regime in the south.: Taksin bat le régime de Nakhon Si Thammarat, dans le sud.
  Taksin defeats the regimes of Phitsanulok and Fang and reunites Siam.: Taksin bat les régimes de Phitsanulok et de Fang et réunifie le Siam.
  Syarif Abdurrahman Alkadrie founds Pontianak at the mouth of the Kapuas.: Syarif Abdurrahman Alkadrie fonde Pontianak à l’embouchure du Kapuas.
  The Tây Sơn brothers, who rose in 1771, take Quy Nhơn.: Les frères Tây Sơn, soulevés en 1771, prennent Quy Nhơn.
  The Minangkabau chiefs of the Negeri Sembilan bring Raja Melewar from Pagaruyung as their ruler, the first Yang di-Pertuan Besar.: Les chefs minangkabau du Negeri Sembilan font venir Raja Melewar de Pagaruyung pour en faire leur souverain, le premier Yang di-Pertuan Besar.
  A Trịnh army from the north takes Phú Xuân (Huế), the Nguyễn capital, while the Tây Sơn take Quảng Nam, Quảng Ngãi and Phú Yên.: Une armée Trịnh venue du nord prend Phú Xuân (Huế), la capitale des Nguyễn, tandis que les Tây Sơn prennent Quảng Nam, Quảng Ngãi et Phú Yên.
  Chiang Mai, with its Lan Na lords Kawila and Chaban, goes over to Taksin; Lan Na becomes a vassal kingdom of Siam. Chiang Saen stays Burmese until 1804.: Chiang Mai, avec ses seigneurs du Lan Na, Kawila et Chaban, se rallie à Taksin ; le Lan Na devient un royaume vassal du Siam. Chiang Saen reste birman jusqu’en 1804.
  The Tây Sơn take Gia Định and kill the Nguyễn lords; only a nephew, Nguyễn Ánh, escapes.: Les Tây Sơn prennent Gia Định et tuent les seigneurs Nguyễn ; seul un neveu, Nguyễn Ánh, s’échappe.
  Nguyễn Ánh retakes Gia Định and holds the south, apart from a Tây Sơn offensive in 1782, until 1783.: Nguyễn Ánh reprend Gia Định et tient le sud jusqu’en 1783, hormis lors d’une offensive des Tây Sơn en 1782.
  The VOC deposes the sultan of Tidore and makes the sultanate a fief of the Company, which takes over its sovereignty; Prince Nuku’s rebellion against it lasts until 1805.: La VOC dépose le sultan de Tidore et fait du sultanat un fief de la Compagnie, qui s’approprie sa souveraineté ; la rébellion du prince Nuku contre elle dure jusqu’en 1805.
  The Spanish occupy the Batanes Islands.: Les Espagnols occupent les îles Batanes.
  The Tây Sơn drive Nguyễn Ánh out of the Mekong delta; he takes refuge in Siam, whose army the Tây Sơn rout at Rạch Gầm–Xoài Mút in 1785.: Les Tây Sơn chassent Nguyễn Ánh du delta du Mékong ; il se réfugie au Siam, dont les Tây Sơn mettent l’armée en déroute à Rạch Gầm–Xoài Mút en 1785.
  Bodawpaya’s army takes Mrauk U and annexes Arakan to Burma.: L’armée de Bodawpaya prend Mrauk U et annexe l’Arakan à la Birmanie.
  The Tây Sơn take Phú Xuân from the Trịnh, then march north, end the rule of the Trịnh lords and leave the north to the Lê emperor.: Les Tây Sơn prennent Phú Xuân aux Trịnh, puis marchent vers le nord, mettent fin au pouvoir des seigneurs Trịnh et laissent le nord à l’empereur Lê.
  Francis Light takes possession of Penang, leased from Kedah, for the East India Company; Province Wellesley on the mainland follows in 1800.: Francis Light prend possession de Penang, louée au Kedah, pour le compte de la Compagnie britannique des Indes orientales ; la province Wellesley, sur le continent, suit en 1800.
  The Tây Sơn take Thăng Long, and the Lê emperor Lê Chiêu Thống flees to the Qing.: Les Tây Sơn prennent Thăng Long, et l’empereur Lê Chiêu Thống s’enfuit auprès des Qing.
  Nguyễn Ánh, back from exile in Siam, retakes Gia Định (Saigon) and makes it his base; French volunteers raised by Pigneau de Behaine join him from 1789.: Nguyễn Ánh, de retour d’exil au Siam, reprend Gia Định (Saïgon) et en fait sa base ; des volontaires français recrutés par Pigneau de Behaine le rejoignent à partir de 1789.
  Siam annexes Battambang and Siem Reap, the north-west of Cambodia, and takes the coast of Koh Kong under its own administration.: Le Siam annexe Battambang et Siem Reap, le nord-ouest du Cambodge, et place la côte de Koh Kong sous sa propre administration.
  British forces take Malacca from the Dutch, whose country is now ruled by revolutionary France; the British keep it until 1818.: Les forces britanniques prennent Malacca aux Néerlandais, dont le pays est désormais sous la coupe de la France révolutionnaire ; les Britanniques la gardent jusqu’en 1818.
  Nguyễn Ánh takes Quy Nhơn; the coast from Bình Định to Bình Thuận is his.: Nguyễn Ánh prend Quy Nhơn ; la côte, de Bình Định à Bình Thuận, est à lui.
  Nguyễn Ánh takes Phú Xuân (Huế).: Nguyễn Ánh prend Phú Xuân (Huế).
  Nguyễn Ánh, crowned as the Gia Long emperor on 1 June, takes Thăng Long; the Tây Sơn are destroyed and Vietnam is united under the Nguyễn.: Nguyễn Ánh, couronné empereur sous le nom de Gia Long le 1er juin, prend Thăng Long ; les Tây Sơn sont anéantis et le Vietnam est unifié sous les Nguyễn.
  Siamese and Lan Na forces take Chiang Saen, the last Burmese stronghold in Lan Na.: Les forces siamoises et du Lan Na prennent Chiang Saen, le dernier bastion birman au Lan Na.
  Java and the Dutch posts surrender to a British expedition from India at Tuntang; the Moluccas have been British since 1810. Raffles governs for the East India Company until 1816.: Java et les postes néerlandais se rendent à Tuntang à une expédition britannique venue de l’Inde ; les Moluques sont britanniques depuis 1810. Raffles gouverne pour la Compagnie britannique des Indes orientales jusqu’en 1816.
  British troops storm the kraton of Yogyakarta; the sultan is deposed and Kedu is annexed (the map draws Kedu with Bagelen and Banyumas, which follow in 1830). Palembang cedes Bangka to the British.: Les troupes britanniques prennent d’assaut le kraton de Yogyakarta ; le sultan est déposé et le Kedu annexé (la carte représente le Kedu avec Bagelen et Banyumas, qui suivent en 1830). Palembang cède Bangka aux Britanniques.
  Raffles ends the sultanate of Banten; its Lampung lands in Sumatra are left to their own chiefs.: Raffles met fin au sultanat de Banten ; ses terres du Lampung, à Sumatra, sont laissées à leurs propres chefs.
  Siam takes Melou Prey and Tonle Repou, the north of Cambodia between the Dângrêk range and the Mekong.: Le Siam prend Melou Prey et Tonle Repou, le nord du Cambodge entre la chaîne des Dângrêk et le Mékong.
  Java and the other Dutch possessions are handed back to the Netherlands, now a kingdom, under the Anglo-Dutch convention of 1814.: Java et les autres possessions néerlandaises sont rendues aux Pays-Bas, devenus un royaume, en vertu de la convention anglo-néerlandaise de 1814.
  The British hand Malacca back to the Dutch.: Les Britanniques rendent Malacca aux Néerlandais.
  The Dutch reassert their authority over Pontianak and the coast of western Borneo.: Les Néerlandais réaffirment leur autorité sur Pontianak et la côte de l’ouest de Bornéo.
  Minangkabau chiefs at Padang, at war with the Padri, cede the Pagaruyung lands to the Dutch, who need until 1838 to conquer them.: Des chefs minangkabau de Padang, en guerre contre les Padri, cèdent les terres de Pagaruyung aux Néerlandais, qui mettent jusqu’en 1838 à les conquérir.
  Siam invades Kedah, whose sultan it suspects of an alliance with Burma, and rules it directly; the sultan flees to Penang.: Le Siam envahit le Kedah, dont il soupçonne le sultan d’alliance avec la Birmanie, et le gouverne directement ; le sultan s’enfuit à Penang.
  After its wars with the Dutch (1819–1821), the sultanate of Palembang is abolished.: Après ses guerres contre les Néerlandais (1819–1821), le sultanat de Palembang est aboli.
  "The Sultan of Johor and the Temenggong cede Singapore, where the East India Company has had a post since 1819, to the Company outright. By the Anglo-Dutch Treaty of March 1824 the Johor realm is split: Johor and Pahang in the British sphere, Riau-Lingga in the Dutch.": "Le sultan de Johor et le Temenggong cèdent définitivement à la Compagnie britannique des Indes orientales Singapour, où elle a un comptoir depuis 1819. Par le traité anglo-néerlandais de mars 1824, le royaume de Johor est partagé : le Johor et le Pahang dans la sphère britannique, Riau-Lingga dans la sphère néerlandaise."
  "The Anglo-Dutch Treaty of 1824 takes effect: the Dutch hand Malacca to Britain and receive Bencoolen.": "Le traité anglo-néerlandais de 1824 entre en vigueur : les Néerlandais cèdent Malacca à la Grande-Bretagne et reçoivent Bencoolen."
  The East India Company joins Penang, Malacca and Singapore as the Straits Settlements.: La Compagnie britannique des Indes orientales réunit Penang, Malacca et Singapour sous le nom d’Établissements des détroits.
  "The Treaty of Yandabo ends the First Anglo-Burmese War: Burma cedes Arakan and Tenasserim (the coast south and east of the Salween) to the East India Company, and gives up Assam and Manipur.": "Le traité de Yandabo met fin à la première guerre anglo-birmane : la Birmanie cède l’Arakan et le Tenasserim (la côte au sud et à l’est de la Salouen) à la Compagnie britannique des Indes orientales, et renonce à l’Assam et au Manipur."
  Siam, overlord of the Lao kingdoms since it took Vientiane in 1779, crushes the rebellion of Anouvong, destroys Vientiane and annexes the kingdom; the Khorat plateau’s Lao principalities come under Bangkok’s governors.: Le Siam, suzerain des royaumes lao depuis la prise de Vientiane en 1779, écrase la rébellion d’Anouvong, détruit Vientiane et annexe le royaume ; les principautés lao du plateau de Khorat passent sous l’autorité des gouverneurs de Bangkok.
  The Dutch proclaim their sovereignty over the south-western coast of New Guinea at Fort Du Bus on Triton Bay, claiming the island west of 141° E; their rule stays nominal until posts are founded in 1898.: Les Néerlandais proclament leur souveraineté sur la côte sud-ouest de la Nouvelle-Guinée à Fort Du Bus, sur la baie de Triton, et revendiquent l’île à l’ouest de 141° E ; leur domination reste nominale jusqu’à la fondation de postes en 1898.
  "After the Java War the Dutch annex the outer provinces of Yogyakarta and Surakarta: Banyumas, Bagelen, Madiun and Kediri.": "Après la guerre de Java, les Néerlandais annexent les provinces extérieures de Yogyakarta et de Surakarta : Banyumas, Bagelen, Madiun et Kediri."
  The Minh Mạng emperor abolishes the Cham principality of Panduranga (Thuận Thành), a Nguyễn vassal since 1697, and annexes it.: L’empereur Minh Mạng abolit la principauté chame de Panduranga (Thuận Thành), vassale des Nguyễn depuis 1697, et l’annexe.
  The Minh Mạng emperor annexes Muang Phuan (Xieng Khouang), whose ruler Chao Noi he has had executed, as the Vietnamese prefecture of Trấn Ninh.: L’empereur Minh Mạng annexe Muang Phuan (Xieng Khouang), dont il a fait exécuter le souverain Chao Noi, sous le nom de préfecture vietnamienne de Trấn Ninh.
  The Minh Mạng emperor annexes Cambodia as the province of Trấn Tây, with the princess Ang Mey as a figurehead.: L’empereur Minh Mạng annexe le Cambodge comme province de Trấn Tây, avec la princesse Ang Mey comme souveraine de façade.
  Vietnam gives up its province in Cambodia after risings and war with Siam; Ang Duong becomes king in 1848 under the joint overlordship of Siam and Vietnam.: Le Vietnam renonce à sa province du Cambodge après des soulèvements et une guerre contre le Siam ; Ang Duong devient roi en 1848 sous la double suzeraineté du Siam et du Vietnam.
  James Brooke, an English adventurer who has helped put down a revolt for Brunei, is made Rajah of Sarawak (the Kuching river country) by the sultan’s uncle, Pengiran Muda Hashim; the sultan confirms the grant in 1842.: James Brooke, un aventurier anglais qui a aidé Brunei à réprimer une révolte, est fait rajah de Sarawak (le pays de la rivière Kuching) par l’oncle du sultan, Pengiran Muda Hashim ; le sultan confirme la concession en 1842.
  Siam restores the Kedah sultanate, but keeps Perlis and Setul (Satun) apart from it; Setul is ruled by its own raja under Bangkok.: Le Siam rétablit le sultanat de Kedah, mais en tient à l’écart Perlis et Setul (Satun) ; Setul est gouverné par son propre raja sous l’autorité de Bangkok.
  Perlis becomes a separate kingdom under Siamese overlordship.: Perlis devient un royaume distinct sous suzeraineté siamoise.
  Kutai accepts Dutch sovereignty after a Dutch punitive expedition, sent once the sultan’s forces had driven off the British adventurer James Erskine Murray, who was killed trying to settle there.: Kutai accepte la souveraineté néerlandaise après une expédition punitive néerlandaise, envoyée une fois que les forces du sultan eurent repoussé l’aventurier britannique James Erskine Murray, tué en tentant de s’y établir.
  The Spanish occupy Basilan, which France had tried to acquire from Sulu, and build the fort of Isabela.: Les Espagnols occupent Basilan, que la France avait tenté d’acquérir auprès de Sulu, et construisent le fort d’Isabela.
  Brunei cedes the island of Labuan to Britain.: Brunei cède l’île de Labuan à la Grande-Bretagne.
  "Muang Phuan has its own princes again: Chao Po, a son of Chao Noi, rules it from 1848 as a vassal of the Vietnamese emperors, and after a rising in the mid-1850s it pays tribute to Siam as well.": "Muang Phuan retrouve ses propres princes : Chao Po, un fils de Chao Noi, le gouverne à partir de 1848 en vassal des empereurs vietnamiens et, après un soulèvement au milieu des années 1850, la principauté paie aussi tribut au Siam."
  The Spanish found a settlement at Davao after a campaign against its Muslim ruler; missions and military posts reach the Bukidnon plateau in the following decades.: Les Espagnols fondent un établissement à Davao après une campagne contre son souverain musulman ; missions et postes militaires atteignent le plateau de Bukidnon dans les décennies suivantes.
  The Dutch take Jagaraga at the third attempt and bring Buleleng and Jembrana, in northern and western Bali, under their rule.: Les Néerlandais prennent Jagaraga à la troisième tentative et placent Buleleng et Jembrana, dans le nord et l’ouest de Bali, sous leur domination.
  Britain annexes Pegu (Lower Burma) after the Second Anglo-Burmese War; the frontier runs about 80 km north of Prome and Toungoo.: La Grande-Bretagne annexe Pégou (la Basse-Birmanie) après la deuxième guerre anglo-birmane ; la frontière passe à environ 80 km au nord de Prome et de Toungoo.
  Brooke Sarawak acquires the Saribas and Batang Lupar country.: Le Sarawak des Brooke acquiert le pays de la Saribas et de la Batang Lupar.
  About 1853. Pahang’s Bendahara rules as an independent sovereign; the Pahang civil war (1857–1863) brings Wan Ahmad to power, as sultan from 1881.: Vers 1853. Le Bendahara du Pahang gouverne en souverain indépendant ; la guerre civile du Pahang (1857–1863) porte au pouvoir Wan Ahmad, sultan à partir de 1881.
  The Dutch conquer Lampung after the death of the resistance leader Raden Intan II.: Les Néerlandais conquièrent le Lampung après la mort du chef de la résistance Raden Intan II.
  Siak signs a treaty with the Netherlands that makes it and its dependencies part of the Dutch East Indies.: Siak signe avec les Pays-Bas un traité qui fait du sultanat et de ses dépendances une partie des Indes orientales néerlandaises.
  By the Treaty of Lisbon (signed 1859, in force 1860) Portugal sells its claims on Flores, Solor and Alor to the Netherlands; the Dutch claim the islands east of Bali, though their rule there long stays nominal. Portugal receives Maubara on Timor.: Par le traité de Lisbonne (signé en 1859, en vigueur en 1860), le Portugal vend aux Pays-Bas ses prétentions sur Florès, Solor et Alor ; les Néerlandais revendiquent les îles à l’est de Bali, bien que leur domination y reste longtemps nominale. Le Portugal reçoit Maubara, sur Timor.
  Spanish military districts are set up in the Cordillera of northern Luzon (Benguet, Lepanto, Bontoc) and in Nueva Vizcaya from the 1840s to the 1850s.: Des districts militaires espagnols sont créés dans la Cordillera du nord de Luçon (Benguet, Lepanto, Bontoc) et en Nueva Vizcaya entre les années 1840 et les années 1850.
  The Dutch abolish the sultanate of Banjar during the Banjarmasin War; resistance goes on in the interior until 1905.: Les Néerlandais abolissent le sultanat de Banjar pendant la guerre de Banjarmasin ; la résistance se poursuit dans l’intérieur jusqu’en 1905.
  Brunei cedes the Rajang, Mukah and Bintulu country to Sarawak. The Spanish occupy Cotabato, the centre of Maguindanao.: Brunei cède au Sarawak le pays du Rajang, de Mukah et de Bintulu. Les Espagnols occupent Cotabato, le centre du Maguindanao.
  The Dutch establish their rule over Deli and the east coast of Sumatra, now opening to tobacco planting.: Les Néerlandais établissent leur domination sur Deli et la côte est de Sumatra, qui s’ouvre alors à la culture du tabac.
  By the Treaty of Saigon the Tự Đức emperor cedes the three eastern provinces of Cochinchina — Biên Hòa, Gia Định and Định Tường — to France.: Par le traité de Saïgon, l’empereur Tự Đức cède à la France les trois provinces orientales de la Cochinchine — Biên Hòa, Gia Định et Định Tường.
  France annexes the three western provinces of Cochinchina — Vĩnh Long, An Giang and Hà Tiên.: La France annexe les trois provinces occidentales de la Cochinchine — Vĩnh Long, An Giang et Hà Tiên.
  The Spanish found Puerto Princesa and occupy southern Palawan, which the Sultan of Sulu claimed. After the capture of Jolo (1876) the sultan accepts Spanish sovereignty in the protocol of 1878, but keeps his internal rule; the map shows Sulu as its own state until 1904.: Les Espagnols fondent Puerto Princesa et occupent le sud de Palawan, que revendiquait le sultan de Sulu. Après la prise de Jolo (1876), le sultan accepte la souveraineté espagnole par le protocole de 1878, mais conserve son autorité intérieure ; la carte montre Sulu comme un État distinct jusqu’en 1904.
  After taking the kraton of Aceh at Kutaraja, the Dutch proclaim the sultanate annexed; the war in the rest of Aceh lasts thirty years.: Après avoir pris le kraton d’Aceh à Kutaraja, les Néerlandais proclament l’annexion du sultanat ; la guerre dans le reste d’Aceh dure trente ans.
  Britain and Burma agree to recognise the independence of the Karenni (Red Karen) states.: La Grande-Bretagne et la Birmanie conviennent de reconnaître l’indépendance des États karenni (Karens rouges).
  The British North Borneo Company receives its royal charter for the lands leased from Brunei and Sulu in 1877–1878.: La Compagnie britannique du Bornéo du Nord reçoit sa charte royale pour les terres louées à Brunei et à Sulu en 1877–1878.
  Brunei cedes the Baram to Sarawak.: Brunei cède le Baram au Sarawak.
  Britain annexes Upper Burma after the Third Anglo-Burmese War; the Shan states submit in 1887–1890, and the Kachin and Chin hills are occupied in the following years.: La Grande-Bretagne annexe la Haute-Birmanie après la troisième guerre anglo-birmane ; les États shans se soumettent en 1887–1890, et les collines kachin et chin sont occupées dans les années suivantes.
  The Đồng Khánh emperor cedes Hanoi, Haiphong and Tourane (Đà Nẵng), French concessions since the 1870s and 1880s, to full French sovereignty.: L’empereur Đồng Khánh cède en pleine souveraineté à la France Hanoï, Haïphong et Tourane (Đà Nẵng), concessions françaises depuis les années 1870 et 1880.
  The Chin Hills are occupied by British columns in the Chin–Lushai expedition (1889–1890). Sarawak annexes Limbang; Trusan had been ceded to it in 1885, and Lawas follows in 1905.: Les collines chin sont occupées par des colonnes britanniques lors de l’expédition Chin–Lushai (1889–1890). Le Sarawak annexe Limbang ; Trusan lui avait été cédé en 1885, et Lawas suit en 1905.
  The British North Borneo Company takes over the administration of Labuan.: La Compagnie britannique du Bornéo du Nord prend en charge l’administration de Labuan.
  After the Paknam crisis, Siam cedes to France all its land on the left bank of the Mekong; the kingdom of Luang Prabang becomes a French protectorate, while its lands on the right bank (Sainyabuli) stay with Siam. France also claims the Central Highlands of Vietnam, where it sets up posts in the following years.: Après la crise de Paknam, le Siam cède à la France toutes ses terres de la rive gauche du Mékong ; le royaume de Luang Prabang devient un protectorat français, tandis que ses terres de la rive droite (Sainyabuli) restent au Siam. La France revendique aussi les hauts plateaux du centre du Vietnam, où elle établit des postes dans les années suivantes.
  A Dutch expedition takes Cakranegara and ends the Balinese kingdom of Lombok.: Une expédition néerlandaise prend Cakranegara et met fin au royaume balinais de Lombok.
  The Spanish take Marawi on Lake Lanao after a campaign against the Lanao sultanates.: Les Espagnols prennent Marawi, sur le lac Lanao, après une campagne contre les sultanats du Lanao.
  Perak, Selangor, Negeri Sembilan and Pahang, under British residents since 1874–1888, form the Federated Malay States under the Treaty of Federation signed in July 1895.: Le Perak, le Selangor, le Negeri Sembilan et le Pahang, dotés de résidents britanniques depuis 1874–1888, forment les États malais fédérés en vertu du traité de fédération signé en juillet 1895.
  "The office of the viceroy (kinh lược) of Tonkin is abolished and its powers pass to the French résident supérieur: Tonkin is ruled directly as part of French Indochina, while Annam keeps the Nguyễn court at Huế.": "La charge de vice-roi (kinh lược) du Tonkin est abolie et ses pouvoirs passent au résident supérieur français : le Tonkin est gouverné directement comme partie de l’Indochine française, tandis que l’Annam conserve la cour des Nguyễn à Huế."
  The kingdom of Lan Na loses its autonomy with the creation of the Siamese province (monthon) of Phayap.: Le royaume de Lan Na perd son autonomie avec la création de la province (monthon) siamoise de Phayap.
  "The Treaty of Paris (1898) comes into force: Spain cedes the Philippines to the United States. The First Philippine Republic, proclaimed in January, fights the American occupation until 1902; its territory is shown in the war’s steps. In the Bates Treaty of August 1899 the Sultan of Sulu accepts American sovereignty and keeps his internal rule.": "Le traité de Paris (1898) entre en vigueur : l’Espagne cède les Philippines aux États-Unis. La Première République des Philippines, proclamée en janvier, combat l’occupation américaine jusqu’en 1902 ; son territoire est représenté dans les étapes de la guerre. Par le traité Bates d’août 1899, le sultan de Sulu accepte la souveraineté américaine et conserve son autorité intérieure."
  Siam deposes Abdul Kadir, the last raja of Pattani, and annexes the seven Malay principalities into which it had divided the old sultanate after Rama I’s conquest of 1786.: Le Siam dépose Abdul Kadir, le dernier raja de Pattani, et annexe les sept principautés malaises entre lesquelles il avait divisé l’ancien sultanat après la conquête de Rama Ier en 1786.
  Sultan Muhammad Daud Syah of Aceh surrenders to the Dutch; the north-east coast of Aceh comes under Dutch rule, though fighting goes on in the Gayo highlands.: Le sultan Muhammad Daud Syah d’Aceh se rend aux Néerlandais ; la côte nord-est d’Aceh passe sous domination néerlandaise, bien que les combats se poursuivent dans les hautes terres gayo.
  By a Franco-Siamese convention Siam cedes Champasak on the right bank of the Mekong, Sainyabuli opposite Luang Prabang, Melou Prey, and Trat with Koh Kong to France. France attaches Stung Treng, Melou Prey and Koh Kong to Cambodia.: Par une convention franco-siamoise, le Siam cède à la France Champassak, sur la rive droite du Mékong, Sainyabuli, en face de Luang Prabang, Melou Prey, ainsi que Trat et Koh Kong. La France rattache Stung Treng, Melou Prey et Koh Kong au Cambodge.
  The United States abrogates the Bates Treaty and rules the Sulu archipelago directly, as a district of the Moro Province.: Les États-Unis abrogent le traité Bates et gouvernent directement l’archipel de Sulu, comme district de la province Moro.
  In the South Sulawesi expeditions the Dutch occupy Bone (July), Luwu, and Gowa (October–December), and bring Bima, Mandar and Central Sulawesi under their rule.: Lors des expéditions de Sulawesi du Sud, les Néerlandais occupent Bone (juillet), Luwu et Gowa (octobre–décembre), et placent Bima, Mandar et Sulawesi central sous leur domination.
  Buton accepts Dutch sovereignty in the Asyikin–Brugman treaty (8 April), and Jambi, whose last sultan died in 1904, is annexed.: Buton accepte la souveraineté néerlandaise par le traité Asyikin–Brugman (8 avril), et Jambi, dont le dernier sultan est mort en 1904, est annexé.
  Labuan becomes part of the Straits Settlements.: Labuan est rattachée aux Établissements des détroits.
  Siam cedes Battambang, Siem Reap and Sisophon to France, which attaches them to Cambodia, and receives back Trat; Koh Kong stays with Cambodia.: Le Siam cède Battambang, Siem Reap et Sisophon à la France, qui les rattache au Cambodge, et récupère Trat ; Koh Kong reste au Cambodge.
  The Dutch conquest of Bali ends with the puputan, the ritual mass death of the court of Klungkung; Badung and Tabanan fell in 1906.: La conquête néerlandaise de Bali s’achève par le puputan, la mort collective rituelle de la cour de Klungkung ; Badung et Tabanan étaient tombés en 1906.
  The Dutch depose the last sultan of Riau-Lingga, who has refused to sign an agreement curbing his powers, and rule the sultanate directly; they annex it formally in 1913.: Les Néerlandais déposent le dernier sultan de Riau-Lingga, qui a refusé de signer un accord limitant ses pouvoirs, et gouvernent directement le sultanat ; ils l’annexent officiellement en 1913.
  Burma is separated from British India and becomes a colony of its own.: La Birmanie est séparée de l’Inde britannique et devient une colonie à part entière.
  The Tokyo convention, mediated by Japan after the Franco-Thai War, gives Thailand the lands on the right bank of the Mekong (Sainyabuli and Champasak) and the north-west of Cambodia without Angkor. The Allies do not recognise it, and Thailand returns the lands in 1946.: La convention de Tokyo, conclue par la médiation du Japon après la guerre franco-thaïlandaise, donne à la Thaïlande les terres de la rive droite du Mékong (Sainyabuli et Champassak) et le nord-ouest du Cambodge, sans Angkor. Les Alliés ne la reconnaissent pas, et la Thaïlande rend ces terres en 1946.
  Hồ Chí Minh proclaims the Democratic Republic of Vietnam in Hanoi, after the Japanese surrender and the abdication of the emperor Bảo Đại (30 August), which ends the Nguyễn monarchy. France, back in Cochinchina from September, does not recognise its independence; it accepts it as a free state within the French Union in March 1946, and war breaks out in December. The base map keeps French Indochina until the State of Vietnam of 1949; the zones the Democratic Republic held are drawn in the war’s steps.: Hồ Chí Minh proclame la République démocratique du Vietnam à Hanoï, après la capitulation japonaise et l’abdication de l’empereur Bảo Đại (30 août), qui met fin à la monarchie des Nguyễn. La France, de retour en Cochinchine à partir de septembre, ne reconnaît pas son indépendance ; elle l’accepte comme État libre au sein de l’Union française en mars 1946, et la guerre éclate en décembre. La carte de base conserve l’Indochine française jusqu’à l’État du Vietnam de 1949 ; les zones tenues par la République démocratique sont dessinées dans les étapes de la guerre.
  Britain joins the Malay states — the four northern ones under British protection since Siam gave up its rights over them in 1909 — with Penang and Malacca as the Malayan Union, and makes Singapore a separate crown colony.: La Grande-Bretagne réunit les États malais — dont les quatre du nord, sous protection britannique depuis que le Siam a renoncé à ses droits sur eux en 1909 — avec Penang et Malacca dans l’Union malaise, et fait de Singapour une colonie de la Couronne distincte.
  The Philippines becomes independent from the United States, as had been laid down in the Tydings–McDuffie Act of 1934.: Les Philippines deviennent indépendantes des États-Unis, comme l’avait prévu la loi Tydings–McDuffie de 1934.
  North Borneo, with Labuan, becomes a British crown colony.: Le Bornéo du Nord, avec Labuan, devient une colonie de la Couronne britannique.
  France and the king of Luang Prabang agree on a unified Kingdom of Laos under French protection.: La France et le roi de Luang Prabang s’accordent sur un royaume du Laos unifié sous protection française.
  Under the Washington agreement Thailand returns the lands it gained in 1941 to Laos and Cambodia.: En vertu de l’accord de Washington, la Thaïlande rend au Laos et au Cambodge les terres acquises en 1941.
  Burma becomes independent as the Union of Burma, with the Shan and Karenni states as member states.: La Birmanie devient indépendante sous le nom d’Union de Birmanie, avec les États shans et karenni comme États membres.
  The Federation of Malaya replaces the Malayan Union.: La Fédération de Malaisie remplace l’Union malaise.
  France recognises the State of Vietnam under Bảo Đại, with Cochinchina, as an associated state; the United States and Britain recognise it in 1950. The Democratic Republic of Vietnam, recognised by China and the Soviet Union in January 1950, holds much of the countryside; its zones are shown in the war’s steps.: La France reconnaît l’État du Vietnam de Bảo Đại, avec la Cochinchine, comme État associé ; les États-Unis et la Grande-Bretagne le reconnaissent en 1950. La République démocratique du Vietnam, reconnue par la Chine et l’Union soviétique en janvier 1950, tient une grande partie des campagnes ; ses zones sont représentées dans les étapes de la guerre.
  The Netherlands transfers sovereignty over the Dutch East Indies, without western New Guinea, to the Republic of the United States of Indonesia; it becomes the unitary Republic of Indonesia on 17 August 1950. Yogyakarta, the seat of the Republic during the revolution, and Surakarta become part of it.: Les Pays-Bas transfèrent la souveraineté sur les Indes orientales néerlandaises, sans l’ouest de la Nouvelle-Guinée, à la République des États-Unis d’Indonésie ; celle-ci devient la République unitaire d’Indonésie le 17 août 1950. Yogyakarta, siège de la République pendant la révolution, et Surakarta en font partie.
  "The Geneva conference divides Vietnam at the 17th parallel: the Democratic Republic of Vietnam takes the north, the State of Vietnam keeps the south, pending elections that are never held.": "La conférence de Genève divise le Vietnam au 17e parallèle : la République démocratique du Vietnam prend le nord, l’État du Vietnam garde le sud, dans l’attente d’élections qui n’auront jamais lieu."
  The Federation of Malaya becomes independent within the Commonwealth.: La Fédération de Malaisie devient indépendante au sein du Commonwealth.
  Under the New York Agreement the Netherlands hands western New Guinea to the United Nations Temporary Executive Authority.: En vertu de l’accord de New York, les Pays-Bas remettent l’ouest de la Nouvelle-Guinée à l’Autorité exécutive temporaire des Nations unies.
  UNTEA hands western New Guinea to Indonesia, which holds the Act of Free Choice in 1969.: L’UNTEA remet l’ouest de la Nouvelle-Guinée à l’Indonésie, qui organise l’Acte de libre choix en 1969.
  Malaya, Singapore, Sarawak and North Borneo (Sabah), both British crown colonies since 1946, form Malaysia; Brunei stays out.: La Fédération de Malaisie, Singapour, le Sarawak et le Bornéo du Nord (Sabah), ces deux derniers colonies de la Couronne britannique depuis 1946, forment la Malaisie ; Brunei reste à l’écart.
  Singapore leaves Malaysia and becomes independent.: Singapour quitte la Malaisie et devient indépendante.
  North Vietnamese troops take Saigon; the Republic of South Vietnam, under the Provisional Revolutionary Government, replaces the Republic of Vietnam.: Les troupes nord-vietnamiennes prennent Saïgon ; la République du Sud-Vietnam, sous le Gouvernement révolutionnaire provisoire, remplace la République du Vietnam.
  North and South Vietnam are united as the Socialist Republic of Vietnam.: Le Nord-Vietnam et le Sud-Vietnam s’unissent pour former la République socialiste du Vietnam.
  Indonesia, which invaded East Timor in December 1975, annexes it as its 27th province. The United Nations never recognises the annexation and regards Portugal as the administering power; the occupation is shown on the map as the map of its time.: L’Indonésie, qui a envahi le Timor oriental en décembre 1975, l’annexe comme sa 27e province. Les Nations unies ne reconnaissent jamais l’annexion et considèrent le Portugal comme la puissance administrante ; l’occupation figure sur la carte telle que la montraient les cartes de l’époque.
  Brunei, a British protected state since 1888, becomes fully independent.: Brunei, État protégé britannique depuis 1888, devient pleinement indépendant.
  After the independence referendum of 30 August 1999 and the violence that followed, the United Nations takes over the administration of East Timor (UNTAET).: Après le référendum d’indépendance du 30 août 1999 et les violences qui ont suivi, les Nations unies prennent en charge l’administration du Timor oriental (UNTAET).
  East Timor becomes independent as Timor-Leste.: Le Timor oriental devient indépendant sous le nom de Timor-Leste.
  North Africa, the Sahel and the Horn about 800. In the Maghreb the Idrisids (from 789) rule around Fez and Tlemcen, the Barghawata the Atlantic plain, the Emirate of Nekor the Rif and the Midrarids Sijilmasa; the Ibadi Rustamids rule from Tahert, and the Aghlabids (from 800) govern Ifriqiya and Tripoli for the Abbasid caliph, whose governors in Egypt hold Barqa. South of the Sahara the Ghana Empire (Wagadu) rules from Koumbi Saleh, Gao (Kawkaw) is a kingdom on the Niger, and Kanem lies north-east of Lake Chad. On the Nile, Christian Makuria and Alwa rule Nubia, and in the highlands the late Kingdom of Aksum survives. Desert and pastoral peoples without a state (the Sanhaja, the Tuareg, the Beja, the Somali and Oromo clans) are shown as no state.: L’Afrique du Nord, le Sahel et la Corne vers 800. Au Maghreb, les Idrissides (depuis 789) règnent autour de Fès et de Tlemcen, les Berghouata sur la plaine atlantique, l’émirat de Nekor sur le Rif et les Midrarides à Sijilmassa ; les Rostémides ibadites règnent depuis Tahert, et les Aghlabides (depuis 800) gouvernent l’Ifriqiya et Tripoli pour le calife abbasside, dont les gouverneurs en Égypte tiennent Barqa. Au sud du Sahara, l’empire du Ghana (Wagadou) règne depuis Koumbi Saleh, Gao (Kawkaw) est un royaume sur le Niger, et le Kanem s’étend au nord-est du lac Tchad. Sur le Nil, la Makurie et l’Alodie, chrétiennes, règnent sur la Nubie, et sur les hauts plateaux le royaume d’Aksoum survit sous sa forme tardive. Les peuples du désert et les pasteurs sans État (les Sanhadja, les Touaregs, les Bedja, les clans somalis et oromos) sont représentés comme sans État.
  Ahmad ibn Tulun, governor of Egypt, rules on his own; Barqa passes with Egypt to the Tulunids.: Ahmad ibn Tulun, gouverneur d’Égypte, gouverne pour son propre compte ; Barqa passe avec l’Égypte aux Toulounides.
  The Abbasids end Tulunid rule in Egypt and Barqa.: Les Abbassides mettent fin à la domination toulounide en Égypte et à Barqa.
  The Kutama army of the missionary Abu Abdallah al-Shi’i takes Raqqada; the last Aghlabid emir, Ziyadat Allah III, has fled to the east. The Fatimid caliphate is proclaimed there in January 910.: L’armée kutama du missionnaire Abu Abdallah al-Shi’i prend Raqqada ; le dernier émir aghlabide, Ziyadat Allah III, s’est enfui vers l’est. Le califat fatimide y est proclamé en janvier 910.
  Abu Abdallah takes Tahert and ends the Rustamid imamate; the Ibadis withdraw to Ouargla and the Jebel Nafusa. In August he frees al-Mahdi at Sijilmasa, where the Midrarids keep their throne under Fatimid overlordship.: Abu Abdallah prend Tahert et met fin à l’imamat rostémide ; les ibadites se replient à Ouargla et dans le djebel Nefoussa. En août, il libère al-Mahdi à Sijilmassa, où les Midrarides conservent leur trône sous la suzeraineté fatimide.
  Fatimid troops take Barqa, the base for their invasions of Egypt in 914–915 and 919–921.: Les troupes fatimides prennent Barqa, base de leurs invasions de l’Égypte en 914–915 et en 919–921.
  The Banu Khattab, an Ibadi Berber family, rule the Fezzan from Zuwila (about 918).: Les Banu Khattab, une famille berbère ibadite, gouvernent le Fezzan depuis Zuwila (vers 918).
  The Fatimid general Masala ibn Habus deposes the Idrisid Yahya IV at Fez, which he hands to the Miknasa chief Musa ibn Abi’l-Afiya; Tlemcen falls too. The Idrisids keep only the north, around the Hajar al-Nasr.: Le général fatimide Masala ibn Habus dépose l’Idrisside Yahya IV à Fès, qu’il remet au chef miknasa Musa ibn Abi’l-Afiya ; Tlemcen tombe aussi. Les Idrissides ne gardent que le nord, autour du Hajar al-Nasr.
  Musa ibn Abi’l-Afiya changes sides and recognises the Umayyad caliph of Córdoba, Abd al-Rahman III, who holds Ceuta (931) and Melilla (927). For forty years Fez and the north pass between Umayyad and Fatimid clients.: Musa ibn Abi’l-Afiya change de camp et reconnaît le calife omeyyade de Cordoue, Abd al-Rahman III, qui tient Ceuta (931) et Melilla (927). Pendant quarante ans, Fès et le nord passent tour à tour entre les mains de clients des Omeyyades et des Fatimides.
  The Umayyads of Córdoba take Tangier from the Idrisids.: Les Omeyyades de Cordoue prennent Tanger aux Idrissides.
  The Fatimid general Jawhar marches west and takes Sijilmasa; its Midrarid ruler, Muhammad ibn al-Fath, is killed.: Le général fatimide Jawhar marche vers l’ouest et prend Sijilmassa ; son souverain midraride, Muhammad ibn al-Fath, est tué.
  Tradition tells of a queen, Gudit (Yodit), who destroyed Aksum about 960; scholars debate who she was. The kingdom survives in a weaker form.: La tradition parle d’une reine, Gudit (Yodit), qui aurait détruit Aksoum vers 960 ; son identité est débattue par les historiens. Le royaume survit sous une forme affaiblie.
  Jawhar storms Fez and captures its Umayyad governor; Fatimid rule reaches the Atlantic.: Jawhar prend Fès d’assaut et capture son gouverneur omeyyade ; la domination fatimide atteint l’Atlantique.
  A Midrarid, Abu Muhammad al-Mu’tazz, rules Sijilmasa again.: Un Midraride, Abu Muhammad al-Mu’tazz, règne de nouveau sur Sijilmassa.
  The Fatimid caliph al-Mu’izz leaves for Egypt, conquered by Jawhar in 969, and makes Buluggin ibn Ziri governor of Ifriqiya and the central Maghreb; the Zirids rule it as his vassals. Barqa stays under Cairo.: Le calife fatimide al-Mu’izz part pour l’Égypte, conquise par Jawhar en 969, et fait de Buluggin ibn Ziri le gouverneur de l’Ifriqiya et du Maghreb central ; les Zirides les gouvernent comme ses vassaux. Barqa reste sous l’autorité du Caire.
  The Umayyad general Ghalib campaigns in northern Morocco and in 974 ends the Idrisid dynasty. Fez and the north are governed for Córdoba, from the 980s through Zenata emirs, and Tlemcen and the west of the central Maghreb pass to Zenata emirs (the Maghrawa and the Banu Ifran) who recognise Córdoba.: Le général omeyyade Ghalib fait campagne dans le nord du Maroc et met fin en 974 à la dynastie idrisside. Fès et le nord sont gouvernés pour le compte de Cordoue, à partir des années 980 par l’intermédiaire d’émirs zénètes, et Tlemcen et l’ouest du Maghreb central passent à des émirs zénètes (les Maghraoua et les Banu Ifran) qui reconnaissent Cordoue.
  Khazrun ibn Fulful of the Maghrawa takes Sijilmasa for Córdoba and ends the Midrarids.: Khazrun ibn Fulful, des Maghraoua, prend Sijilmassa pour Cordoue et met fin aux Midrarides.
  Ghana takes Aoudaghost, the Sanhaja trading town at the southern end of the Saharan route (about 992).: Le Ghana prend Aoudaghost, la ville marchande sanhadja située à l’extrémité sud de la route saharienne (vers 992).
  Fulful ibn Sa’id of the Banu Khazrun, a Zenata family, seizes Tripoli; his house holds it, with breaks, until 1146.: Fulful ibn Sa’id, des Banu Khazrun, une famille zénète, s’empare de Tripoli ; sa maison la tient, avec des interruptions, jusqu’en 1146.
  Hammad ibn Buluggin, governor of the central Maghreb for the Zirids, rules on his own from his fortress, the Qal’a of the Banu Hammad; peace in 1017 confirms the split.: Hammad ibn Buluggin, gouverneur du Maghreb central pour les Zirides, gouverne pour son propre compte depuis sa forteresse, la Kalâa des Béni Hammad ; la paix de 1017 confirme la scission.
  With the end of the Caliphate of Córdoba the Zenata emirs of Fez, Salé and Tadla, Aghmat and Sijilmasa rule on their own.: Avec la fin du califat de Cordoue, les émirs zénètes de Fès, de Salé et du Tadla, d’Aghmat et de Sijilmassa gouvernent pour leur propre compte.
  The Banu Sulaym and the Banu Hilal, Arab Bedouin tribes sent west by the Fatimids after the Zirid break with Cairo (1048), overrun Barqa; Fatimid rule there ends.: Les Banu Sulaym et les Banu Hilal, tribus bédouines arabes envoyées vers l’ouest par les Fatimides après la rupture des Zirides avec Le Caire (1048), envahissent Barqa ; la domination fatimide y prend fin.
  The Almoravids, a reform movement of the Sanhaja of the western Sahara led by Abdallah ibn Yasin and Abu Bakr ibn Umar, take Sijilmasa and Aoudaghost (1054–1055).: Les Almoravides, mouvement réformateur des Sanhadja de l’ouest du Sahara conduit par Abdallah ibn Yasin et Abu Bakr ibn Umar, prennent Sijilmassa et Aoudaghost (1054–1055).
  The Almoravids take the Sous and the Draa.: Les Almoravides prennent le Souss et le Drâa.
  After the Zirid defeat at Haydaran (1052) the Hilali tribes sack Kairouan; the Zirid emir al-Mu’izz withdraws to Mahdia. Inland Ifriqiya and the interior of Tripolitania pass to Bedouin chiefs and small emirates (the Banu Jami at Gabès, the Banu Rand at Gafsa).: Après la défaite ziride de Haydaran (1052), les tribus hilaliennes saccagent Kairouan ; l’émir ziride al-Mu’izz se replie à Mahdia. L’intérieur de l’Ifriqiya et de la Tripolitaine passe à des chefs bédouins et à de petits émirats (les Banu Jami à Gabès, les Banu Rand à Gafsa).
  The Almoravids take Aghmat, near the later Marrakesh, and Tadla.: Les Almoravides prennent Aghmat, près de la future Marrakech, et le Tadla.
  Tunis, under the Banu Khurasan, recognises the Hammadids.: Tunis, sous les Banu Khurasan, reconnaît les Hammadides.
  The Almoravids break the Barghawata on the Atlantic plain, where Ibn Yasin was killed in 1059.: Les Almoravides brisent les Berghouata dans la plaine atlantique, où Ibn Yasin avait été tué en 1059.
  Yusuf ibn Tashfin takes Fez (1069–1070) and the plains of the north; Marrakesh, founded about 1070, becomes the Almoravid capital.: Yusuf ibn Tashfin prend Fès (1069–1070) et les plaines du nord ; Marrakech, fondée vers 1070, devient la capitale almoravide.
  The Almoravids take Tangier.: Les Almoravides prennent Tanger.
  The Almoravids take Taza, Oujda and Tlemcen and destroy the Emirate of Nekor in the Rif.: Les Almoravides prennent Taza, Oujda et Tlemcen et détruisent l’émirat de Nekor, dans le Rif.
  The Almoravids take Oran, Tenes and Algiers; their border with the Hammadids runs east of Algiers.: Les Almoravides prennent Oran, Ténès et Alger ; leur frontière avec les Hammadides passe à l’est d’Alger.
  Abu Bakr ibn Umar, leader of the Almoravids in the Sahara since 1072, dies; the movement’s hold on the desert south of the Draa breaks up (the sources are thin).: Abu Bakr ibn Umar, chef des Almoravides au Sahara depuis 1072, meurt ; l’emprise du mouvement sur le désert au sud du Drâa se désagrège (les sources sont rares).
  The Hammadids leave the Qal’a, exposed to the Hilali tribes, for Bougie (Béjaïa); the steppe passes to the Bedouin. Bône (Annaba) is held by the Hammadids under al-Mansur (1088–1105).: Les Hammadides quittent la Kalâa, exposée aux tribus hilaliennes, pour Bougie (Béjaïa) ; la steppe passe aux Bédouins. Bône (Annaba) est tenue par les Hammadides sous al-Mansur (1088–1105).
  Roger II of Sicily takes the island of Djerba.: Roger II de Sicile prend l’île de Djerba.
  The Zagwe dynasty, from Lasta, rules the Christian kingdom (from about 1137; the dates are uncertain), with its capital at Roha (Lalibela).: La dynastie zagoué, originaire du Lasta, règne sur le royaume chrétien (à partir de 1137 environ ; les dates sont incertaines), avec pour capitale Roha (Lalibela).
  The Almohads, followers of Ibn Tumart (proclaimed Mahdi in 1121, at Tinmel from about 1124) led since 1130 by Abd al-Mu’min, hold the High Atlas, the Sous and the Draa.: Les Almohades, disciples d’Ibn Tumart (proclamé Mahdi en 1121, installé à Tinmel à partir de 1124 environ), conduits depuis 1130 par Abd al-Mu’min, tiennent le Haut Atlas, le Souss et le Drâa.
  After the death of the Almoravid emir Tashfin ibn Ali near Oran, the Almohads take Tlemcen, Oran and the north-east of Morocco.: Après la mort de l’émir almoravide Tashfin ibn Ali près d’Oran, les Almohades prennent Tlemcen, Oran et le nord-est du Maroc.
  The Almohads take Fez after a long siege, then Meknes, Salé, Ceuta and Sijilmasa.: Les Almohades prennent Fès après un long siège, puis Meknès, Salé, Ceuta et Sijilmassa.
  A Sicilian fleet takes Tripoli.: Une flotte sicilienne prend Tripoli.
  The Almohads take Marrakesh and end the Almoravid dynasty; in the Sahara the Almoravids’ Sanhaja homeland falls back to its tribes, and Algiers passes to the Hammadids.: Les Almohades prennent Marrakech et mettent fin à la dynastie almoravide ; au Sahara, le pays sanhadja d’où étaient issus les Almoravides retourne à ses tribus, et Alger passe aux Hammadides.
  The Sicilian admiral George of Antioch takes Mahdia, Sousse and Sfax and ends the Zirid dynasty; the Normans rule the coast of Ifriqiya from Tripoli to Sfax. Tunis, under the Banu Khurasan, is on its own until the Almohads take it in 1159.: L’amiral sicilien Georges d’Antioche prend Mahdia, Sousse et Sfax et met fin à la dynastie ziride ; les Normands gouvernent la côte de l’Ifriqiya de Tripoli à Sfax. Tunis, sous les Banu Khurasan, reste indépendante jusqu’à sa prise par les Almohades en 1159.
  Abd al-Mu’min takes Algiers and Bougie and ends the Hammadid dynasty; Constantine submits.: Abd al-Mu’min prend Alger et Bougie et met fin à la dynastie hammadide ; Constantine se soumet.
  A Sicilian fleet takes Bône (Annaba).: Une flotte sicilienne prend Bône (Annaba).
  Revolts drive the Sicilian garrisons from Sfax, Tripoli and Djerba (1156–1158); only Mahdia and Sousse remain Norman.: Des révoltes chassent les garnisons siciliennes de Sfax, de Tripoli et de Djerba (1156–1158) ; seules Mahdia et Sousse restent normandes.
  Abd al-Mu’min takes Tunis from the Banu Khurasan.: Abd al-Mu’min prend Tunis aux Banu Khurasan.
  Abd al-Mu’min takes Mahdia from the Normans after Tunis (1159); Tripoli, Bône and the whole of Ifriqiya are Almohad, and for the first time one power rules from the Atlantic to Tripolitania.: Abd al-Mu’min prend Mahdia aux Normands après Tunis (1159) ; Tripoli, Bône et toute l’Ifriqiya sont almohades, et pour la première fois une seule puissance règne de l’Atlantique à la Tripolitaine.
  Qaraqush, a Mamluk commander from Egypt, takes Zuwila and ends the Banu Khattab (1172–1176); the Fezzan falls to Kanem’s rulers in the following century.: Qaraqush, un chef mamelouk venu d’Égypte, prend Zuwila et met fin aux Banu Khattab (1172–1176) ; le Fezzan passe aux souverains du Kanem au siècle suivant.
  The Sosso king Sumanguru Kanté takes Koumbi Saleh, the old capital of Ghana, whose power had been declining for a century (about 1203; the dates are traditional).: Le roi de Sosso Soumaoro Kanté prend Koumbi Saleh, l’ancienne capitale du Ghana, dont la puissance déclinait depuis un siècle (vers 1203 ; les dates sont traditionnelles).
  Abu Zakariya, Almohad governor at Tunis, breaks with Marrakesh and founds the Hafsid dynasty; he takes Constantine and Bougie in 1230 and Algiers in 1235.: Abu Zakariya, gouverneur almohade à Tunis, rompt avec Marrakech et fonde la dynastie hafside ; il prend Constantine et Bougie en 1230 et Alger en 1235.
  Abu Zakariya takes Constantine and Bougie.: Abu Zakariya prend Constantine et Bougie.
  Sundiata Keita of the Mandinka defeats Sumanguru at Kirina (about 1235) and founds the Mali Empire.: Soundiata Keïta, des Mandingues, bat Soumaoro à Kirina (vers 1235) et fonde l’empire du Mali.
  Abu Zakariya takes Algiers.: Abu Zakariya prend Alger.
  "Yaghmurasen ibn Zayyan of the Banu Abd al-Wad rules Tlemcen on his own: the Zayyanid kingdom.": "Yaghmurasen ibn Zayyan, des Banu Abd al-Wad, gouverne Tlemcen pour son propre compte : c’est le royaume zianide."
  Kanem’s king Dunama Dibalemi extends his rule to the Fezzan, governed from Traghen (mid-thirteenth century; the dates are uncertain).: Le roi du Kanem Dunama Dibalemi étend sa domination au Fezzan, gouverné depuis Traghen (milieu du XIIIe siècle ; les dates sont incertaines).
  The Marinids, Zenata nomads from the east of Morocco, take Meknes and the north-east.: Les Mérinides, nomades zénètes de l’est du Maroc, prennent Meknès et le nord-est.
  The Marinid Abu Yahya takes Fez, which becomes the Marinid capital.: Le Mérinide Abu Yahya prend Fès, qui devient la capitale mérinide.
  The Marinids take Sijilmasa.: Les Mérinides prennent Sijilmassa.
  The Zayyanids take Sijilmasa.: Les Zianides prennent Sijilmassa.
  "The Marinid Abu Yusuf Yaqub takes Marrakesh: the end of the Almohad caliphate, whose last followers hold out at Tinmel until 1275.": "Le Mérinide Abu Yusuf Yaqub prend Marrakech : c’est la fin du califat almohade, dont les derniers fidèles résistent à Tinmel jusqu’en 1275."
  Yekuno Amlak of Amhara overthrows the Zagwe and founds the Solomonic dynasty of Ethiopia.: Yekouno Amlak, de l’Amhara, renverse les Zagoué et fonde la dynastie salomonide d’Éthiopie.
  The Marinids retake Sijilmasa.: Les Mérinides reprennent Sijilmassa.
  Tangier, ruled by its own lords since the Almohad collapse, submits to the Marinids.: Tanger, gouvernée par ses propres seigneurs depuis l’effondrement almohade, se soumet aux Mérinides.
  Roger of Lauria, admiral of Aragonese Sicily, takes the island of Djerba.: Roger de Lauria, amiral de la Sicile aragonaise, prend l’île de Djerba.
  Umar Walasma founds the sultanate of Ifat east of Shewa and absorbs the old Muslim sultanate of Shewa; its rule reaches the Harar plateau, and Zeila is its port.: Umar Walasma fonde le sultanat d’Ifat à l’est du Choa et absorbe l’ancien sultanat musulman du Choa ; sa domination atteint le plateau de Harar, et Zeila est son port.
  The Ajuran Sultanate rules the Shabelle and Juba valleys and the Benadir coast (from the thirteenth century; dates are uncertain).: Le sultanat d’Ajuran gouverne les vallées du Chébéli et du Djouba et la côte du Benadir (à partir du XIIIe siècle ; les dates sont incertaines).
  The Zayyanids of Tlemcen take Algiers from the Hafsids; from the mid-fourteenth century its Thaaliba amirs rule it largely on their own as tributaries of Tlemcen.: Les Zianides de Tlemcen prennent Alger aux Hafsides ; à partir du milieu du XIVe siècle, ses émirs thaaliba la gouvernent en grande partie pour leur propre compte, comme tributaires de Tlemcen.
  Gao and Timbuktu are under Mali by the time Mansa Musa returns from his pilgrimage to Mecca (1324–1325); Mali reaches from the Atlantic to the middle Niger.: Gao et Tombouctou relèvent du Mali lorsque Mansa Moussa revient de son pèlerinage à La Mecque (1324–1325) ; le Mali s’étend de l’Atlantique au moyen Niger.
  Amda Seyon defeats Ifat, Hadiya and Dawaro; the Muslim sultanates of the south become tributaries of Ethiopia.: Amda Seyon bat l’Ifat, le Hadiya et le Dawaro ; les sultanats musulmans du sud deviennent tributaires de l’Éthiopie.
  The people of Djerba rise against Sicilian rule and the Hafsids retake the island.: Les habitants de Djerba se soulèvent contre la domination sicilienne et les Hafsides reprennent l’île.
  The Marinid Abu al-Hasan takes Tlemcen after a two-year siege; the Zayyanid king dies in the fighting.: Le Mérinide Abu al-Hasan prend Tlemcen après un siège de deux ans ; le roi zianide meurt dans les combats.
  Abu al-Hasan enters Tunis; for a few months the Marinids rule the whole Maghreb.: Abu al-Hasan entre à Tunis ; pendant quelques mois, les Mérinides règnent sur tout le Maghreb.
  After Abu al-Hasan’s defeat by the Arab tribes near Kairouan (April 1348), the Zayyanids retake Tlemcen and Algiers, and the Hafsid princes Constantine and Bougie.: Après la défaite d’Abu al-Hasan face aux tribus arabes près de Kairouan (avril 1348), les Zianides reprennent Tlemcen et Alger, et les princes hafsides Constantine et Bougie.
  Abu al-Hasan leaves Tunis by sea (December 1349); the Hafsids return.: Abu al-Hasan quitte Tunis par la mer (décembre 1349) ; les Hafsides reviennent.
  Abu al-Hasan’s son Abu Inan takes Tlemcen and Algiers and, in 1352–1353, Bougie.: Abu Inan, fils d’Abu al-Hasan, prend Tlemcen et Alger et, en 1352–1353, Bougie.
  After Abu Inan’s death the Zayyanid Abu Hammu II retakes Tlemcen and Algiers, and the Hafsids Bougie.: Après la mort d’Abu Inan, le Zianide Abu Hammu II reprend Tlemcen et Alger, et les Hafsides Bougie.
  After a civil war (1365) the Makurian court leaves Dongola for Gebel Adda in Lower Nubia; the Dongola reach passes to Arab tribes. Makuria had been a Mamluk vassal since 1276 and had its first Muslim king in 1316–1317.: Après une guerre civile (1365), la cour de Makurie quitte Dongola pour Gebel Adda, en Basse-Nubie ; le bief de Dongola passe à des tribus arabes. La Makurie était vassale des Mamelouks depuis 1276 et avait eu son premier roi musulman en 1316–1317.
  The Bulala drive the Sayfawa kings out of Kanem (from about 1380); the dynasty moves west of Lake Chad to Bornu, and Kanem’s hold on the Fezzan ends.: Les Boulala chassent les rois sayfawa du Kanem (à partir de 1380 environ) ; la dynastie s’installe à l’ouest du lac Tchad, au Bornou, et l’emprise du Kanem sur le Fezzan prend fin.
  The kingdom of Kaffa rises in the forests south-west of the Gibe (about 1390; dates are traditional).: Le royaume du Kaffa naît dans les forêts au sud-ouest du Gibe (vers 1390 ; les dates sont traditionnelles).
  The Tuareg of Aïr accept a sultan (about 1405); Agadez becomes his seat in the 1430s.: Les Touaregs de l’Aïr acceptent un sultan (vers 1405) ; Agadez devient son siège dans les années 1430.
  An Ethiopian army kills Sa’ad ad-Din of Ifat at Zeila (in 1403 under Dawit I or about 1415 under Yeshaq; the sources differ). His sons return from Yemen and found the Adal Sultanate further east, with its capital at Dakkar and from 1520 at Harar.: Une armée éthiopienne tue Sa’ad ad-Din d’Ifat à Zeila (en 1403 sous Dawit Ier ou vers 1415 sous Yeshaq ; les sources divergent). Ses fils reviennent du Yémen et fondent plus à l’est le sultanat d’Adal, avec pour capitale Dakkar puis, à partir de 1520, Harar.
  Gao breaks away from Mali under the Sonni dynasty (about 1430).: Gao se détache du Mali sous la dynastie des Sonni (vers 1430).
  The Tuareg chief Akil takes Timbuktu from Mali (1433–1434); Walata and the Sahel fall to them a few years later.: Le chef touareg Akil prend Tombouctou au Mali (1433–1434) ; Oualata et le Sahel tombent aux mains des Touaregs quelques années plus tard.
  The Mossi kingdoms (Ouagadougou, Yatenga, Tenkodogo) rule the plateau of the White and Red Volta by the mid-fifteenth century; their origins and dates are traditional.: Les royaumes mossis (Ouagadougou, Yatenga, Tenkodogo) dominent le plateau des Volta Blanche et Rouge dès le milieu du XVe siècle ; leurs origines et leurs dates sont traditionnelles.
  Sonni Ali comes to the throne of Gao and begins the conquests that make Songhai an empire.: Sonni Ali monte sur le trône de Gao et commence les conquêtes qui font du Songhaï un empire.
  Sonni Ali takes Timbuktu.: Sonni Ali prend Tombouctou.
  After taking Asilah, the Portuguese occupy Tangier, abandoned by its people.: Après avoir pris Asilah, les Portugais occupent Tanger, abandonnée par ses habitants.
  Muhammad al-Shaykh, of the Wattasids, a family of Marinid viziers, takes Fez, where a revolt had killed the last Marinid sultan in 1465 and the sharif Muhammad al-Juti had ruled since; the Wattasid sultanate. Marrakesh is held by its Hintata emirs and the Sous by local lords.: "Muhammad al-Shaykh, des Wattassides, une famille de vizirs mérinides, prend Fès, où une révolte avait tué le dernier sultan mérinide en 1465 et où le chérif Muhammad al-Juti régnait depuis : c’est le sultanat wattasside. Marrakech est tenue par ses émirs hintata et le Souss par des seigneurs locaux."
  Sonni Ali takes Djenné after a long siege.: Sonni Ali prend Djenné après un long siège.
  The Shilluk kingdom on the White Nile takes shape under its reths (dates are traditional).: Le royaume shilluk prend forme sur le Nil Blanc sous ses reths (les dates sont traditionnelles).
  "Askia Muhammad, who seized the Songhai throne in 1493, campaigns against the Mossi, Aïr and the western provinces of Mali: Diafunu falls in 1501 and Diara in 1512. Aïr pays tribute.": "Askia Mohammed, qui s’est emparé du trône songhaï en 1493, fait campagne contre les Mossis, l’Aïr et les provinces occidentales du Mali : le Diafunu tombe en 1501 et le Diara en 1512. L’Aïr paie tribut."
  The Funj under Amara Dunqas and the Abdallab Arabs destroy Soba, the capital of Alwa (about 1504); the Funj Sultanate rules from Sennar, the Abdallab as its vassals in the north.: Les Founj d’Amara Dunqas et les Arabes abdallab détruisent Soba, la capitale de l’Alodie (vers 1504) ; le sultanat Founj règne depuis Sennar, et les Abdallab sont ses vassaux dans le nord.
  Castile takes Mers el-Kébir; Melilla had been taken in 1497.: La Castille prend Mers el-Kébir ; Melilla avait été prise en 1497.
  The Bornu king Idris Katakarmabe enters Njimi, the old capital of Kanem, and makes peace with the Bulala, who keep Kanem.: Le roi du Bornou Idris Katakarmabe entre à Njimi, l’ancienne capitale du Kanem, et fait la paix avec les Boulala, qui conservent le Kanem.
  A Castilian army under Cardinal Cisneros and Pedro Navarro storms Oran.: Une armée castillane conduite par le cardinal Cisneros et Pedro Navarro prend Oran d’assaut.
  "Muhammad al-Qa’im, a sharif of the Sous, is proclaimed leader of the holy war against the Portuguese: the start of the Saadian dynasty.": "Muhammad al-Qa’im, un chérif du Souss, est proclamé chef de la guerre sainte contre les Portugais : c’est le début de la dynastie saadienne."
  Pedro Navarro takes Bougie for Castile; Algiers accepts a Spanish fort on the islet before the town (the Peñón).: Pedro Navarro prend Bougie pour la Castille ; Alger accepte un fort espagnol sur l’îlot situé devant la ville (le Peñón).
  Pedro Navarro takes Tripoli, which is placed under the viceroy of Sicily.: Pedro Navarro prend Tripoli, qui est placée sous l’autorité du vice-roi de Sicile.
  The Portuguese take Azemmour; with Safi (1508) they dominate the Doukkala plain.: Les Portugais prennent Azemmour ; avec Safi (1508), ils dominent la plaine des Doukkala.
  "Oruç Reis (Barbarossa) seizes Algiers, which had called on him against the Spanish. After his death (1518) his brother Hayreddin places Algiers under the Ottoman sultan (1519), who makes him its governor: the Regency of Algiers. Kabyle rivals hold the town again in 1520–1525.": "Oruç Reis (Barberousse) s’empare d’Alger, qui l’avait appelé contre les Espagnols. Après sa mort (1518), son frère Hayreddin place Alger sous l’autorité du sultan ottoman (1519), qui le nomme gouverneur : c’est la régence d’Alger. Des rivaux kabyles tiennent de nouveau la ville en 1520–1525."
  Oran and Bougie pass with the Crown of Castile to Spain.: Oran et Bougie passent à l’Espagne avec la couronne de Castille.
  The kingdom of Baguirmi is founded on the Chari, with its capital at Massenya (dates are traditional).: Le royaume du Baguirmi est fondé sur le Chari, avec pour capitale Massenya (les dates sont traditionnelles).
  The Saadians take Marrakesh from its Hintata emirs (1524 or 1525); the Wattasids keep Fez and the north, and in 1527 the two dynasties divide Morocco along the Oum er-Rbia.: Les Saadiens prennent Marrakech à ses émirs hintata (1524 ou 1525) ; les Wattassides conservent Fès et le nord, et en 1527 les deux dynasties se partagent le Maroc le long de l’Oum er-Rbia.
  Hayreddin takes the Spanish Peñón of Algiers; his rule reaches west to Cherchell and Ténès and east into Kabylia.: Hayreddin prend le Peñón espagnol d’Alger ; sa domination s’étend à l’ouest jusqu’à Cherchell et Ténès et à l’est jusqu’en Kabylie.
  Charles V gives Tripoli, with Malta, to the Knights Hospitaller.: Charles Quint donne Tripoli, avec Malte, aux chevaliers hospitaliers.
  Hayreddin takes Constantine and, briefly, Tunis (August 1534) from the Hafsids; Charles V restores the Hafsid Mawlay Hasan at Tunis in 1535 as his vassal.: Hayreddin prend aux Hafsides Constantine et, brièvement, Tunis (août 1534) ; Charles Quint rétablit en 1535 le Hafside Moulay Hassan à Tunis, comme son vassal.
  After the Saadians take Agadir (March 1541), the Portuguese evacuate Safi and Azemmour.: Après la prise d’Agadir par les Saadiens (mars 1541), les Portugais évacuent Safi et Azemmour.
  The Saadian Muhammad al-Shaykh takes Fez and ends Wattasid rule.: Le Saadien Muhammad al-Shaykh prend Fès et met fin à la domination wattasside.
  The Awlad Muhammad, a family of sharifs, found a sultanate in the Fezzan with its capital at Murzuq; they pay tribute to Tripoli from the late sixteenth century.: Les Awlad Muhammad, une famille de chérifs, fondent un sultanat au Fezzan avec pour capitale Mourzouk ; ils paient tribut à Tripoli à partir de la fin du XVIe siècle.
  An Ottoman fleet under Sinan Pasha and Turgut Reis takes Tripoli from the Knights of St John.: Une flotte ottomane conduite par Sinan Pacha et Turgut Reis (Dragut) prend Tripoli aux chevaliers de Saint-Jean.
  Salah Rais, Ottoman governor of Algiers, makes the oasis towns of Touggourt and Ouargla pay tribute and garrisons Biskra.: Salah Raïs, gouverneur ottoman d’Alger, soumet au tribut les villes oasiennes de Touggourt et de Ouargla et place une garnison à Biskra.
  With Ottoman help the Wattasid Ali Abu Hassun retakes Fez.: Avec l’aide ottomane, le Wattasside Ali Abu Hassun reprend Fès.
  Muhammad al-Shaykh defeats and kills Abu Hassun near Fez (September 1554); the Saadians rule all Morocco. Algiers, which had driven the Saadians from Tlemcen in 1551, ends the Zayyanid kingdom (1554–1556).: Muhammad al-Shaykh bat et tue Abu Hassun près de Fès (septembre 1554) ; les Saadiens règnent sur tout le Maroc. Alger, qui avait chassé les Saadiens de Tlemcen en 1551, met fin au royaume zianide (1554–1556).
  The Ottomans make Suakin, with Massawa (1557), the seat of the province of Habesh on the Red Sea.: Les Ottomans font de Souakin, avec Massaoua (1557), le siège de la province d’Habesh, sur la mer Rouge.
  Salah Rais takes Bougie from Spain.: Salah Raïs prend Bougie à l’Espagne.
  Özdemir Pasha takes Massawa for the Ottomans.: Özdemir Pacha prend Massaoua pour les Ottomans.
  By the 1570s the Oromo, moving north under their gadaa age-sets, have taken over Shewa, Bale, Hadiya and the Harar plateau; Ethiopia’s rule shrinks to the north.: Dans les années 1570, les Oromos, qui progressent vers le nord en classes d’âge gadaa, ont pris le Choa, le Bale, le Hadiya et le plateau de Harar ; la domination éthiopienne se réduit au nord.
  Uluç Ali, governor of Algiers, takes Tunis from the Hafsids.: Uluç Ali, gouverneur d’Alger, prend Tunis aux Hafsides.
  Don John of Austria retakes Tunis and restores a Hafsid as Spain’s vassal.: Don Juan d’Autriche reprend Tunis et rétablit un Hafside comme vassal de l’Espagne.
  "An Ottoman army under Sinan Pasha and Uluç Ali takes La Goulette and Tunis and ends the Hafsid dynasty. Tunis becomes an Ottoman province, ruled from 1591 by its deys and from 1613 by beys: the Regency of Tunis.": "Une armée ottomane conduite par Sinan Pacha et Uluç Ali prend La Goulette et Tunis et met fin à la dynastie hafside. Tunis devient une province ottomane, gouvernée à partir de 1591 par ses deys et à partir de 1613 par des beys : c’est la régence de Tunis."
  "Imam Muhammad Jasa moves the capital of Adal from Harar to Aussa in the Awash delta: the Imamate of Aussa. Adal’s Somali coast falls away.": "L’imam Muhammad Jasa transfère la capitale de l’Adal de Harar à l’Awsa (Aussa), dans le delta de l’Aouache : c’est l’imamat de l’Awsa. Le littoral somali de l’Adal se détache."
  Under a treaty with Idris Alooma of Bornu the Bulala give up western Kanem with Njimi and keep the east around Lake Fitri (about 1580; the dates are uncertain).: Par un traité avec Idris Alooma du Bornou, les Boulala cèdent l’ouest du Kanem avec Njimi et conservent l’est, autour du lac Fitri (vers 1580 ; les dates sont incertaines).
  The Saadian sultan Ahmad al-Mansur sends an army to the oases of the Tuat and Gourara and the Saoura, which pay tribute to Morocco from now on.: Le sultan saadien Ahmad al-Mansur envoie une armée dans les oasis du Touat, du Gourara et de la Saoura, qui paient désormais tribut au Maroc.
  The Moroccan army of Judar Pasha defeats the Songhai at Tondibi; Gao, Timbuktu and Djenné fall. The Moroccan pashas rule the Niger bend from Timbuktu (the Pashalik); the Songhai princes hold out downstream in Dendi.: L’armée marocaine de Djouder Pacha bat les Songhaï à Tondibi ; Gao, Tombouctou et Djenné tombent. Les pachas marocains gouvernent la boucle du Niger depuis Tombouctou (le pachalik) ; les princes songhaï résistent en aval, dans le Dendi.
  After the death of Mansa Mahmud IV (about 1610) the Mali Empire breaks up into small Manding kingdoms.: Après la mort du mansa Mahmud IV (vers 1610), l’empire du Mali éclate en petits royaumes mandingues.
  Anaukpetlun of Ava takes Syriam and executes de Brito, then retakes Martaban; Tavoy comes back under Burma in the following years (in 1614 or 1622, by different accounts). Lower Burma is again united with Ava.: Anaukpetlun d’Ava prend Syriam et fait exécuter de Brito, puis reprend Martaban ; Tavoy repasse sous l’autorité de la Birmanie dans les années suivantes (en 1614 ou en 1622, selon les récits). La Basse-Birmanie est de nouveau unie à Ava.
  Abd al-Karim founds the Wadai sultanate east of Lake Fitri, with its capital at Wara (about 1635).: Abd al-Karim fonde le sultanat du Ouaddaï à l’est du lac Fitri, avec pour capitale Ouara (vers 1635).
  The Ottoman pashas of Tripoli bring Barqa (Cyrenaica) and the coast of the Gulf of Sirte under their rule (from the 1630s).: Les pachas ottomans de Tripoli soumettent Barqa (la Cyrénaïque) et la côte du golfe de Syrte (à partir des années 1630).
  The river north of Niamey breaks up into small Songhai chiefdoms; the askias keep Dendi in the south.: Le long du fleuve, au nord de Niamey, le pays se morcelle en petites chefferies songhaï ; les askias conservent le Dendi, au sud.
  Ali ibn Daud founds the Emirate of Harar, independent of Aussa.: Ali ibn Daud fonde l’émirat de Harar, indépendant de l’Awsa.
  Sulayman Solongdungu founds the Keira sultanate of Darfur (about 1650; the dates are uncertain).: Sulayman Solongdungu fonde le sultanat keira du Darfour (vers 1650 ; les dates sont incertaines).
  The Trarza and Brakna emirates of the Hassani Arabs take shape north of the Senegal River in the seventeenth century; the Char Bouba war (about 1673–1677; older accounts give 1644–1674) confirms Hassani dominance over the Berber tribes.: Les émirats du Trarza et du Brakna, fondés par les Arabes hassani, prennent forme au nord du fleuve Sénégal au XVIIe siècle ; la guerre de Char Bouba (vers 1673–1677 ; des récits plus anciens donnent 1644–1674) confirme la domination hassani sur les tribus berbères.
  Portugal hands Tangier to England under the marriage treaty of Charles II and Catherine of Braganza (June 1661).: Le Portugal remet Tanger à l’Angleterre en vertu du traité de mariage de Charles II et de Catherine de Bragance (juin 1661).
  Moulay al-Rashid, of the Alaouite sharifs of the Tafilalet, takes Fez; in 1668 he destroys the Dila’iyya and takes Marrakesh, reuniting Morocco after sixty years of division among rival Saadians, the Dila’iyya, the corsair republic of Salé and others.: Moulay Rachid, des chérifs alaouites du Tafilalet, prend Fès ; en 1668, il détruit la Dila’iyya et prend Marrakech, réunifiant le Maroc après soixante ans de division entre Saadiens rivaux, la Dila’iyya, la république corsaire de Salé et d’autres.
  Negasi Krestos founds the kingdom of Shewa in Menz (about 1682).: Negasi Krestos fonde le royaume du Choa dans le Menz (vers 1682).
  England evacuates and destroys Tangier after years of blockade by the army of Moulay Ismail.: L’Angleterre évacue et détruit Tanger après des années de blocus par l’armée de Moulay Ismaïl.
  The Ajuran Sultanate falls apart in the late seventeenth century; its lands pass to Hawiye and Rahanweyn clans and smaller sultanates.: Le sultanat d’Ajuran se désagrège à la fin du XVIIe siècle ; ses terres passent à des clans hawiye et rahanweyn et à de plus petits sultanats.
  The Geledi Sultanate rises at Afgooye on the lower Shabelle (about 1700).: Le sultanat de Geledi naît à Afgooye, sur le bas Chébéli (vers 1700).
  The bey of Mascara takes Oran for the Regency of Algiers.: Le bey de Mascara prend Oran pour la régence d’Alger.
  Ahmed Karamanli, an officer of the Tripoli garrison, seizes power; his dynasty rules the Regency of Tripoli under nominal Ottoman sovereignty until 1835.: Ahmed Karamanli, un officier de la garnison de Tripoli, s’empare du pouvoir ; sa dynastie gouverne la régence de Tripoli sous souveraineté ottomane nominale jusqu’en 1835.
  Biton Coulibaly makes Ségou the centre of the Bamana Empire.: Biton Coulibaly fait de Ségou le centre du royaume bambara.
  The sultanate of Damagaram is founded; Zinder becomes its capital in the 1730s.: Le sultanat du Damagaram est fondé ; Zinder en devient la capitale dans les années 1730.
  A Spanish army under the Count of Montemar retakes Oran; Mers el-Kébir follows the next day.: Une armée espagnole conduite par le comte de Montemar reprend Oran ; Mers el-Kébir suit le lendemain.
  The Tuareg defeat the arma, the Moroccan soldiers’ descendants who rule the Pashalik, at Toya; Gao and the east pass to the Iwillimmeden Tuareg.: Les Touaregs battent à Toya les Arma, descendants des soldats marocains, qui gouvernent le pachalik ; Gao et l’est passent aux Touaregs Iwillimmeden.
  The Emirate of Adrar takes shape around Atar and Chinguetti (about 1745).: L’émirat de l’Adrar prend forme autour d’Atar et de Chinguetti (vers 1745).
  The kingdom of Taqali rules much of the Nuba Mountains (from about 1750).: Le royaume de Taqali gouverne une grande partie des monts Nouba (à partir de 1750 environ).
  The Isaaq Sultanate takes shape in the north (about 1750); the Majeerteen Sultanate rules the north-east tip of Somalia (from the mid-eighteenth century).: Le sultanat isaaq prend forme dans le nord (vers 1750) ; le sultanat majeerteen gouverne la pointe nord-est de la Somalie (à partir du milieu du XVIIIe siècle).
  The Massassi Bamana kings, rivals of Ségou since the seventeenth century, move west and rule Kaarta around Nioro (about 1753).: Les rois bambara massassi, rivaux de Ségou depuis le XVIIe siècle, se déplacent vers l’ouest et gouvernent le Kaarta autour de Nioro (vers 1753).
  The Funj general Muhammad Abu Likaylik overruns Kordofan and drives out the Musabba’at, a branch of the Darfur royal house.: Le général founj Muhammad Abu Likaylik envahit le Kordofan et en chasse les Musabba’at, une branche de la maison royale du Darfour.
  Alaungpaya takes Prome.: Alaungpaya prend Prome.
  Alaungpaya takes Dagon, which he renames Yangon (Rangoon), and the delta.: Alaungpaya prend Dagon, qu’il rebaptise Yangon (Rangoun), et le delta.
  Darfur’s sultan Tayrab takes Kordofan as the Funj withdraw amid civil war (about 1785).: Le sultan du Darfour Tayrab prend le Kordofan, d’où les Founj se retirent en pleine guerre civile (vers 1785).
  Spain, under a treaty of 1791 that followed the earthquake of 1790, hands Oran and Mers el-Kébir to the Regency of Algiers.: En vertu d’un traité de 1791, conclu après le tremblement de terre de 1790, l’Espagne remet Oran et Mers el-Kébir à la régence d’Alger.
  Sultan Sabun of Wadai makes Baguirmi a tributary and extends his rule south to Dar Sila and the Salamat.: Le sultan Sabun du Ouaddaï fait du Baguirmi un tributaire et étend sa domination au sud jusqu’au Dar Sila et au Salamat.
  Brahima Seydou founds the Fulani emirate of Liptako, with its capital at Dori.: Brahima Seydou fonde l’émirat peul du Liptako, avec pour capitale Dori.
  Tripoli’s general Muhammad al-Mukni ends the Awlad Muhammad sultanate of the Fezzan (1811–1812).: Le général tripolitain Muhammad al-Mukni met fin au sultanat des Awlad Muhammad au Fezzan (1811–1812).
  Seku Amadu defeats the Bamana of Ségou at Noukouma and founds the Massina Empire, with its capital at Hamdullahi from about 1820.: Sékou Amadou bat les Bambara de Ségou à Noukouma et fonde la Dina du Macina, avec pour capitale Hamdallahi à partir de 1820 environ.
  The army of Muhammad Ali of Egypt under his son Ismail Kamil Pasha takes Dongola.: L’armée de Méhémet Ali d’Égypte, conduite par son fils Ismaïl Kamil Pacha, prend Dongola.
  The last Funj sultan surrenders Sennar to Ismail Kamil; Egypt rules the Nile valley to Fazughli.: Le dernier sultan founj remet Sennar à Ismaïl Kamil ; l’Égypte gouverne la vallée du Nil jusqu’à Fazughli.
  Egyptian troops defeat Darfur’s army at Bara and take Kordofan.: Les troupes égyptiennes battent l’armée du Darfour à Bara et prennent le Kordofan.
  The Kénédougou kingdom of the Traoré rises around Sikasso (dates are traditional).: Le royaume du Kénédougou des Traoré naît autour de Sikasso (les dates sont traditionnelles).
  Massina takes Timbuktu, ending the Pashalik in practice.: Le Macina prend Tombouctou, ce qui met fin dans les faits au pachalik.
  A French army takes Algiers and the dey surrenders. The bey of Constantine, Ahmed Bey, carries on the Ottoman regency in the east; in the west and centre tribes and towns choose their own leaders, and from 1832 most follow the emir Abd al-Qadir, whose state is shown in the war’s steps.: Une armée française prend Alger et le dey capitule. Le bey de Constantine, Ahmed Bey, maintient la régence ottomane dans l’est ; dans l’ouest et le centre, tribus et villes se choisissent leurs propres chefs et, à partir de 1832, la plupart suivent l’émir Abd el-Kader, dont l’État est représenté dans les étapes de la guerre.
  Tlemcen offers its allegiance to the sultan of Morocco, Abd al-Rahman, who sends troops; he withdraws them in 1832 under French pressure.: Tlemcen fait allégeance au sultan du Maroc, Abd al-Rahman, qui envoie des troupes ; il les retire en 1832 sous la pression française.
  French troops occupy Oran.: Les troupes françaises occupent Oran.
  France takes Bône (Annaba); Moroccan troops leave Tlemcen.: La France prend Bône (Annaba) ; les troupes marocaines quittent Tlemcen.
  France takes Mostaganem and Bougie (September).: La France prend Mostaganem et Bougie (septembre).
  An Ottoman fleet deposes the Karamanli dynasty; Tripolitania and Cyrenaica are again an Ottoman province. The Fezzan is held by Abd al-Jalil of the Awlad Sulayman until 1842.: Une flotte ottomane dépose la dynastie des Karamanli ; la Tripolitaine et la Cyrénaïque redeviennent une province ottomane. Le Fezzan est tenu par Abd al-Jalil, des Awlad Sulayman, jusqu’en 1842.
  France takes Constantine at its second attempt; Ahmed Bey holds out in the Aurès until 1848.: La France prend Constantine à sa seconde tentative ; Ahmed Bey résiste dans les Aurès jusqu’en 1848.
  Egypt takes Taka and founds Kassala.: L’Égypte prend le Taka et fonde Kassala.
  Sahle Selassie of Shewa (1813–1847) extends his kingdom south over the Oromo of the Shewan plateau.: Sahle Selassie du Choa (1813–1847) étend son royaume vers le sud, sur les Oromos du plateau du Choa.
  French troops take Médéa; Miliana follows in June.: Les troupes françaises prennent Médéa ; Miliana suit en juin.
  Bugeaud takes Mascara, Abd al-Qadir’s former capital.: Bugeaud prend Mascara, l’ancienne capitale d’Abd el-Kader.
  The Ottomans retake the Fezzan; Abd al-Jalil is killed.: Les Ottomans reprennent le Fezzan ; Abd al-Jalil est tué.
  Bugeaud occupies Tlemcen.: Bugeaud occupe Tlemcen.
  The Duke of Aumale captures Abd al-Qadir’s smala at Taguine; France builds posts at Orléansville, Tiaret and Teniet el-Had, and by the end of the year Abd al-Qadir has withdrawn to Morocco.: Le duc d’Aumale s’empare de la smala d’Abd el-Kader à Taguine ; la France construit des postes à Orléansville, Tiaret et Teniet el-Had, et à la fin de l’année Abd el-Kader s’est replié au Maroc.
  The Duke of Aumale takes Biskra; French columns hold the Aurès and the Hodna.: Le duc d’Aumale prend Biskra ; des colonnes françaises tiennent les Aurès et le Hodna.
  Abd al-Qadir surrenders to General Lamoricière; France holds the Tell from Tlemcen to the Titteri.: Abd el-Kader se rend au général Lamoricière ; la France tient le Tell, de Tlemcen au Titteri.
  French troops storm Laghouat; Géryville (El Bayadh) and Djelfa follow.: Les troupes françaises prennent Laghouat d’assaut ; Géryville (El Bayadh) et Djelfa suivent.
  France takes Touggourt; Ouargla and the Souf submit.: La France prend Touggourt ; Ouargla et le Souf se soumettent.
  Umar Tall takes Nioro and ends the kingdom of Kaarta.: El Hadj Oumar Tall prend Nioro et met fin au royaume du Kaarta.
  Tewodros II conquers Shewa (1855–1856).: Téwodros II conquiert le Choa (1855–1856).
  Marshal Randon’s campaign conquers Great Kabylia; Lalla Fatma N’Soumer is captured.: La campagne du maréchal Randon conquiert la Grande Kabylie ; Lalla Fatma N’Soumer est capturée.
  Umar Tall takes Ségou and ends the Bamana Empire.: El Hadj Oumar Tall prend Ségou et met fin au royaume bambara.
  Umar Tall takes Hamdullahi and ends the Massina Empire. Timbuktu passes to the Kunta and the Tuareg.: El Hadj Oumar Tall prend Hamdallahi et met fin à la Dina du Macina. Tombouctou passe aux Kounta et aux Touaregs.
  The Ottoman sultan hands Suakin and Massawa to Egypt; Egypt places a post at Fashoda in the Shilluk country.: Le sultan ottoman cède Souakin et Massaoua à l’Égypte ; l’Égypte établit un poste à Fachoda, dans le pays shilluk.
  Menelik escapes from Magdala and is proclaimed negus of Shewa; he submits to Yohannes IV in 1878 and keeps his kingdom.: Ménélik s’échappe de Magdala et est proclamé négus du Choa ; il se soumet à Yohannes IV en 1878 et conserve son royaume.
  Samuel Baker annexes Gondokoro and the upper Nile for Egypt as the province of Equatoria.: Samuel Baker annexe Gondokoro et le haut Nil pour l’Égypte, qui en fait la province d’Équatoria.
  Egypt occupies Keren and the Bogos under Werner Munzinger.: L’Égypte occupe Keren et le pays bogos sous Werner Munzinger.
  Egypt annexes the Bahr el-Ghazal, conquered by the slave-trading armies of al-Zubayr Rahma Mansur, who is made its governor.: L’Égypte annexe le Bahr el-Ghazal, conquis par les armées de marchands d’esclaves d’al-Zubayr Rahma Mansur, qui en est nommé gouverneur.
  Al-Zubayr defeats and kills Sultan Ibrahim of Darfur and takes El Fasher for Egypt.: Al-Zubayr bat et tue le sultan Ibrahim du Darfour et prend El Fasher pour l’Égypte.
  The Ottomans place a garrison at Ghat.: Les Ottomans installent une garnison à Ghat.
  Egyptian troops occupy Harar; Zeila and Berbera are Egyptian too (1874–1884).: Les troupes égyptiennes occupent Harar ; Zeila et Berbera sont aussi égyptiennes (1874–1884).
  Yusuf Ali Kenadid founds the Sultanate of Hobyo.: Yusuf Ali Kenadid fonde le sultanat de Hobyo.
  France builds a post at Aïn Sefra in the southern Oranais during the rising of Bou Amama.: La France construit un poste à Aïn Sefra, dans le Sud oranais, pendant le soulèvement de Bou Amama.
  "Treaty of Bardo: the bey of Tunis accepts a French protectorate (confirmed by the La Marsa Convention of 1883). The beylik remains on the map as Tunisia.": "Traité du Bardo : le bey de Tunis accepte un protectorat français (confirmé par la convention de La Marsa en 1883). Le beylik reste sur la carte sous le nom de Tunisie."
  The Italian state takes over Assab, bought by the Rubattino company in 1869.: L’État italien prend en charge Assab, achetée par la compagnie Rubattino en 1869.
  France annexes the Mzab, a protectorate since 1853.: La France annexe le Mzab, protectorat depuis 1853.
  French troops under Borgnis-Desbordes occupy Bamako, linked to Kayes on the Senegal River by a line of forts.: Les troupes françaises de Borgnis-Desbordes occupent Bamako, reliée à Kayes, sur le fleuve Sénégal, par une ligne de forts.
  "Britain makes treaties with the Somali clans of the north coast as Egypt withdraws (1884–1886): British Somaliland.": "La Grande-Bretagne conclut des traités avec les clans somalis de la côte nord au moment du retrait égyptien (1884–1886) : c’est le Somaliland britannique."
  France occupies Obock, bought in 1862, and makes treaties with the sultan of Tadjoura.: La France occupe Obock, achetée en 1862, et conclut des traités avec le sultan de Tadjourah.
  Under the Hewett Treaty Egypt returns the Bogos (Keren) to Ethiopia.: Par le traité Hewett, l’Égypte rend le pays bogos (Keren) à l’Éthiopie.
  Spain declares a protectorate over the coast of the Río de Oro between Cape Bojador and Cape Blanc, with a post at Villa Cisneros (Dakhla).: L’Espagne proclame un protectorat sur la côte du Río de Oro entre le cap Bojador et le cap Blanc, avec un poste à Villa Cisneros (Dakhla).
  "The Mahdi’s army storms Khartoum and kills Gordon: the Mahdist State rules Sudan from Omdurman. Kordofan (1883), Darfur and the Bahr el-Ghazal (1883–1884) had already fallen. Suakin stays Egyptian, and Emin Pasha holds out in Equatoria until 1889.": "L’armée du Mahdi prend Khartoum d’assaut et tue Gordon : l’État mahdiste gouverne le Soudan depuis Omdurman. Le Kordofan (1883), le Darfour et le Bahr el-Ghazal (1883–1884) étaient déjà tombés. Souakin reste égyptienne, et Emin Pacha résiste en Équatoria jusqu’en 1889."
  Italian troops land at Massawa as the Egyptian garrison leaves.: Les troupes italiennes débarquent à Massaoua au moment où la garnison égyptienne s’en va.
  The Egyptians leave Harar; Emir Abdullahi rules it again.: Les Égyptiens quittent Harar ; l’émir Abdullahi la gouverne de nouveau.
  Kassala surrenders to the Mahdists.: Kassala se rend aux mahdistes.
  Menelik of Shewa defeats Emir Abdullahi at Chelenqo and takes Harar. With the Arsi (1886), Wollega and the Gurage, much of the south is now under Shewa.: Ménélik du Choa bat l’émir Abdullahi à Chelenqo et prend Harar. Avec l’Arsi (1886), le Wollega et le pays gouragué, une grande partie du sud est désormais sous l’autorité du Choa.
  France founds Djibouti on the south shore of the Gulf of Tadjoura.: La France fonde Djibouti sur la rive sud du golfe de Tadjourah.
  The sultan of Hobyo accepts an Italian protectorate; Majeerteen follows on 7 April.: Le sultan de Hobyo accepte un protectorat italien ; le Majeerteen suit le 7 avril.
  Emin Pasha leaves Equatoria with Stanley’s relief expedition; the Mahdists, who took Rejaf in 1888, hold the upper Nile.: Emin Pacha quitte l’Équatoria avec l’expédition de secours de Stanley ; les mahdistes, qui ont pris Rejaf en 1888, tiennent le haut Nil.
  Italian troops occupy Keren and, on 3 August, Asmara; the colony of Eritrea is proclaimed on 1 January 1890.: Les troupes italiennes occupent Keren et, le 3 août, Asmara ; la colonie d’Érythrée est proclamée le 1er janvier 1890.
  Menelik of Shewa is crowned emperor of Ethiopia; Shewa and its conquests join the empire.: Ménélik du Choa est couronné empereur d’Éthiopie ; le Choa et ses conquêtes rejoignent l’empire.
  Archinard takes Ségou from Ahmadu, Umar Tall’s son.: Archinard prend Ségou à Ahmadou, fils d’El Hadj Oumar Tall.
  Archinard takes Nioro.: Archinard prend Nioro.
  The sultan of Zanzibar leases the Benadir ports to Italy (bought outright in 1905).: Le sultan de Zanzibar loue les ports du Benadir à l’Italie (qui les achète en 1905).
  Rabih az-Zubayr, a slave-trader’s commander from the Nile valley, conquers Baguirmi’s lands on the Chari and the Bornu empire west of Lake Chad. Kanem, long contested between Bornu and Wadai, is left to its alifas and the Awlad Sulayman.: Rabih az-Zubayr (Rabah), chef de guerre au service d’un marchand d’esclaves de la vallée du Nil, conquiert les terres du Baguirmi sur le Chari et l’empire du Bornou à l’ouest du lac Tchad. Le Kanem, longtemps disputé entre le Bornou et le Ouaddaï, est laissé à ses alifas et aux Awlad Sulayman.
  Archinard takes Djenné and Bandiagara.: Archinard prend Djenné et Bandiagara.
  Bonnier’s column enters Timbuktu, which a French river flotilla had reached in December 1893; the Hodh and Walata come under French rule in the following years.: La colonne Bonnier entre à Tombouctou, qu’une flottille fluviale française avait atteinte en décembre 1893 ; le Hodh et Oualata passent sous domination française dans les années suivantes.
  Italian troops take Kassala from the Mahdists.: Les troupes italiennes prennent Kassala aux mahdistes.
  Menelik conquers Wolaita; the lands of the Rift Valley and the south-west follow.: Ménélik conquiert le Wolaita ; les terres de la vallée du Rift et du sud-ouest suivent.
  Britain makes the land up to the Juba the East Africa Protectorate.: La Grande-Bretagne fait des terres situées jusqu’au Djouba le protectorat de l’Afrique orientale.
  Ras Welde Giyorgis defeats the sultan of Aussa at Arraddó (January 1896); Aussa becomes a tributary of Ethiopia and keeps its sultan. Ethiopia’s rule reaches the northern Afar lowlands.: Ras Welde Giyorgis bat le sultan de l’Awsa à Arraddó (janvier 1896) ; l’Awsa devient tributaire de l’Éthiopie et conserve son sultan. La domination éthiopienne atteint les basses terres afar du nord.
  Voulet’s column takes Ouagadougou; the Mossi kingdoms come under French protection (1895–1897).: La colonne Voulet prend Ouagadougou ; les royaumes mossis passent sous protection française (1895–1897).
  Kitchener’s Egyptian army takes Dongola.: L’armée égyptienne de Kitchener prend Dongola.
  French columns occupy Say, Dori, Bobo-Dioulasso and Gourma.: Des colonnes françaises occupent Say, Dori, Bobo-Dioulasso et le Gourma.
  Menelik’s armies conquer the Borana and the Ogaden; treaties with Britain (May 1897) and France fix the eastern borders.: Les armées de Ménélik conquièrent le pays borana et l’Ogaden ; des traités avec la Grande-Bretagne (mai 1897) et la France fixent les frontières orientales.
  Congo Free State troops defeat the Mahdists at Rejaf and occupy the Lado Enclave on the west bank of the upper Nile, leased to King Leopold II by Britain in 1894.: Les troupes de l’État indépendant du Congo battent les mahdistes à Rejaf et occupent l’enclave de Lado, sur la rive ouest du haut Nil, louée au roi Léopold II par la Grande-Bretagne en 1894.
  Kitchener’s army occupies Berber.: L’armée de Kitchener occupe Berber.
  Ethiopian armies take the kingdom of Kaffa and capture its last king, Gaki Sherocho.: Les armées éthiopiennes prennent le royaume du Kaffa et capturent son dernier roi, Gaki Sherocho.
  Italy hands Kassala to the Egyptian army.: L’Italie remet Kassala à l’armée égyptienne.
  Ethiopia takes Benishangul and the Gambela lowlands to the Sudan border.: L’Éthiopie prend le Benishangul et les basses terres de Gambela jusqu’à la frontière soudanaise.
  French troops storm Sikasso and end the Kénédougou kingdom.: Les troupes françaises prennent Sikasso d’assaut et mettent fin au royaume du Kénédougou.
  Kitchener’s Anglo-Egyptian army destroys the Mahdist army at Omdurman. Under the Condominium Agreement of January 1899 Britain and Egypt rule Sudan jointly. In Darfur Ali Dinar restores the sultanate under nominal Anglo-Egyptian overlordship.: L’armée anglo-égyptienne de Kitchener détruit l’armée mahdiste à Omdurman. En vertu de l’accord de condominium de janvier 1899, la Grande-Bretagne et l’Égypte gouvernent conjointement le Soudan. Au Darfour, Ali Dinar rétablit le sultanat sous une suzeraineté anglo-égyptienne nominale.
  French troops occupy Gao; the Tuareg of the Adrar des Ifoghas submit in the following years.: Les troupes françaises occupent Gao ; les Touaregs de l’Adrar des Ifoghas se soumettent dans les années suivantes.
  Remnants of the Voulet–Chanoine mission take Zinder and end the sultanate of Damagaram.: Les restes de la mission Voulet–Chanoine prennent Zinder et mettent fin au sultanat du Damagaram.
  French columns take In Salah in the Tidikelt (December 1899) and the oases of the Tuat and Gourara, over the protests of the sultan of Morocco.: Des colonnes françaises prennent In Salah, dans le Tidikelt (décembre 1899), et les oasis du Touat et du Gourara, malgré les protestations du sultan du Maroc.
  French forces defeat and kill Rabih at Kousséri. Baguirmi, under French protection since 1897, and Rabih’s lands become the Military Territory of Chad.: Les forces françaises battent et tuent Rabah à Kousséri. Le Baguirmi, sous protection française depuis 1897, et les terres de Rabah deviennent le Territoire militaire du Tchad.
  The Treaty of Paris fixes the southern and eastern borders of Spain’s Río de Oro.: Le traité de Paris fixe les frontières sud et est du Río de Oro espagnol.
  French troops defeat the Senussi at Bir Alali in Kanem.: Les troupes françaises battent les Senoussis à Bir Alali, au Kanem.
  The battle of Tit breaks the resistance of the Kel Ahaggar Tuareg; the Hoggar submits.: La bataille de Tit brise la résistance des Touaregs Kel Ahaggar ; le Hoggar se soumet.
  France occupies Béchar (Colomb-Béchar) in the Saoura.: La France occupe Béchar (Colomb-Béchar), dans la Saoura.
  France creates the Civil Territory of Mauritania from the emirates of Trarza and Brakna, which had accepted protectorates in 1902–1903.: La France crée le Territoire civil de Mauritanie à partir des émirats du Trarza et du Brakna, qui avaient accepté des protectorats en 1902–1903.
  Coppolani’s column takes Tidjikja in the Tagant; Coppolani is killed there in May.: La colonne Coppolani prend Tidjikja, dans le Tagant ; Coppolani y est tué en mai.
  French troops occupy Agadez.: Les troupes françaises occupent Agadez.
  Italy unites its Somali possessions as the colony of Italian Somaliland.: L’Italie réunit ses possessions somaliennes dans la colonie de la Somalie italienne.
  Gouraud’s column takes Atar and the Emirate of Adrar.: La colonne Gouraud prend Atar et l’émirat de l’Adrar.
  French troops take Abéché, the capital of Wadai.: Les troupes françaises prennent Abéché, la capitale du Ouaddaï.
  After Leopold II’s death the Lado Enclave passes to the Anglo-Egyptian Sudan.: Après la mort de Léopold II, l’enclave de Lado passe au Soudan anglo-égyptien.
  French troops occupy Djanet in the Tassili n’Ajjer, which the Ottomans had claimed.: Les troupes françaises occupent Djanet, dans le Tassili n’Ajjer, que revendiquaient les Ottomans.
  "Treaty of Fez: the sultan of Morocco accepts a French protectorate. The sultanate remains on the map as Morocco.": "Traité de Fès : le sultan du Maroc accepte un protectorat français. Le sultanat reste sur la carte sous le nom de Maroc."
  "Treaty of Ouchy (Lausanne): the Ottoman Empire withdraws from Tripolitania and Cyrenaica, which Italy had annexed by decree in November 1911. Italian rule outside the coastal towns stays contested for twenty years; Kufra falls in 1931.": "Traité d’Ouchy (Lausanne) : l’Empire ottoman se retire de la Tripolitaine et de la Cyrénaïque, que l’Italie avait annexées par décret en novembre 1911. La domination italienne hors des villes côtières reste contestée pendant vingt ans ; Koufra tombe en 1931."
  A Franco-Spanish treaty gives Spain a zone of the protectorate in the north (the Rif and the Jebala, capital Tetouan) and in the south between the Draa and 27°40′ N (the Tarfaya Strip, administered with the Sahara), and confirms Spain’s claim to the Saguia el-Hamra. Spanish forces occupy Cape Juby in 1916 and Smara in 1934.: Un traité franco-espagnol donne à l’Espagne une zone du protectorat au nord (le Rif et le Jebala, capitale Tétouan) et au sud, entre le Drâa et 27°40′ N (la bande de Tarfaya, administrée avec le Sahara), et confirme la revendication espagnole sur la Saguia el-Hamra. Les forces espagnoles occupent le cap Juby en 1916 et Smara en 1934.
  French troops take the Senussi stronghold of Ain Galakka in Borkou.: Les troupes françaises prennent Aïn Galakka, place forte senoussie du Borkou.
  French troops reach Bardaï in the Tibesti (withdrawn in 1916, back from 1929).: Les troupes françaises atteignent Bardaï, dans le Tibesti (retirées en 1916, de retour à partir de 1929).
  France occupies the sultanate of Dar Sila.: La France occupe le sultanat du Dar Sila.
  An Anglo-Egyptian force takes El Fasher; Darfur is annexed to Sudan, and Ali Dinar is killed in November. Dar Masalit keeps its sultan until it is absorbed into Sudan after the Anglo-French border settlement.: Une force anglo-égyptienne prend El Fasher ; le Darfour est annexé au Soudan, et Ali Dinar est tué en novembre. Le Dar Masalit conserve son sultan jusqu’à son intégration au Soudan après le règlement frontalier franco-britannique.
  Dar Masalit is joined to the Anglo-Egyptian Sudan (the sources give 1919 or 1922).: Le Dar Masalit est rattaché au Soudan anglo-égyptien (les sources donnent 1919 ou 1922).
  "The Tangier Statute (1923) comes into force: Tangier becomes an international zone under the sultan’s nominal sovereignty. Spain occupies it from June 1940 to October 1945.": "Le statut de Tanger (1923) entre en vigueur : Tanger devient une zone internationale sous la souveraineté nominale du sultan. L’Espagne l’occupe de juin 1940 à octobre 1945."
  Britain cedes Jubaland, west of the Juba, to Italy.: La Grande-Bretagne cède à l’Italie le Jubaland, à l’ouest du Djouba.
  Italian troops occupy Hobyo and end the sultanate.: Les troupes italiennes occupent Hobyo et mettent fin au sultanat.
  Italian troops complete the conquest of the Majeerteen Sultanate.: Les troupes italiennes achèvent la conquête du sultanat majeerteen.
  French forces occupy the Tiris and join the Saharan zones of Mauritania, Algeria and Morocco.: Les forces françaises occupent le Tiris et relient les zones sahariennes de la Mauritanie, de l’Algérie et du Maroc.
  French forces occupy Tindouf and join the Algerian, Moroccan and West African Sahara.: Les forces françaises occupent Tindouf et relient les parties algérienne, marocaine et ouest-africaine du Sahara.
  Spanish troops occupy Ifni, ceded by Morocco in 1860.: Les troupes espagnoles occupent Ifni, cédé par le Maroc en 1860.
  Mussolini proclaims the annexation of Ethiopia four days after Italian troops enter Addis Ababa; on 1 June Ethiopia, Eritrea and Italian Somaliland are joined as Italian East Africa. Most states recognise the conquest by 1938, but the United States, the Soviet Union and a few others never do, and Ethiopian resistance continues (shown in the war’s steps).: Mussolini proclame l’annexion de l’Éthiopie quatre jours après l’entrée des troupes italiennes à Addis-Abeba ; le 1er juin, l’Éthiopie, l’Érythrée et la Somalie italienne sont réunies dans l’Afrique orientale italienne. En 1938, la plupart des États ont reconnu la conquête, mais les États-Unis, l’Union soviétique et quelques autres ne la reconnaissent jamais, et la résistance éthiopienne se poursuit (elle est représentée dans les étapes de la guerre).
  Eritrea and Italian Somaliland join Italian East Africa.: L’Érythrée et la Somalie italienne rejoignent l’Afrique orientale italienne.
  Haile Selassie returns to Addis Ababa after the British and Ethiopian campaign. The Ogaden stays under British military administration, confirmed by the Anglo-Ethiopian agreement of January 1942, until 1948. Eritrea and Somalia are administered by Britain as occupied enemy territory.: Hailé Sélassié rentre à Addis-Abeba après la campagne britannique et éthiopienne. L’Ogaden reste sous administration militaire britannique, confirmée par l’accord anglo-éthiopien de janvier 1942, jusqu’en 1948. L’Érythrée et la Somalie sont administrées par la Grande-Bretagne comme territoires ennemis occupés.
  The Anglo-Ethiopian agreement confirms British administration of the Ogaden and the Haud.: L’accord anglo-éthiopien confirme l’administration britannique de l’Ogaden et du Haud.
  Ifni, the Sahara and the Tarfaya Strip are joined as Spanish West Africa, governed from Sidi Ifni.: Ifni, le Sahara et la bande de Tarfaya sont réunis dans l’Afrique-Occidentale espagnole, gouvernée depuis Sidi Ifni.
  "The peace treaty with Italy, signed in February, comes into force: Italy gives up Libya. Britain, which has administered Tripolitania and Cyrenaica since 1942–1943, goes on doing so; France administers the Fezzan and Ghadames.": "Le traité de paix avec l’Italie, signé en février, entre en vigueur : l’Italie renonce à la Libye. La Grande-Bretagne, qui administre la Tripolitaine et la Cyrénaïque depuis 1942–1943, continue de les administrer ; la France administre le Fezzan et Ghadamès."
  "The peace treaty with Italy comes into force: Italy gives up Eritrea and Somalia, which remain under British military administration until the United Nations decides their future.": "Le traité de paix avec l’Italie entre en vigueur : l’Italie renonce à l’Érythrée et à la Somalie, qui restent sous administration militaire britannique jusqu’à ce que les Nations unies décident de leur avenir."
  Britain hands the Ogaden back to Ethiopia; the Haud and the Reserved Area follow in 1955.: La Grande-Bretagne rend l’Ogaden à l’Éthiopie ; le Haud et la Zone réservée suivent en 1955.
  Idris al-Senussi proclaims the Emirate of Cyrenaica, under British administration.: Idris al-Senussi proclame l’émirat de Cyrénaïque, sous administration britannique.
  Italy takes over Somalia as a United Nations trust territory for ten years.: L’Italie prend en charge la Somalie comme territoire sous tutelle des Nations unies pour dix ans.
  Libya becomes independent as the United Kingdom of Libya under King Idris, uniting Cyrenaica, Tripolitania and the Fezzan.: La Libye accède à l’indépendance sous le nom de Royaume-Uni de Libye, avec Idris pour roi, et réunit la Cyrénaïque, la Tripolitaine et le Fezzan.
  Eritrea is federated with Ethiopia under the Ethiopian crown, by a United Nations resolution of 1950.: L’Érythrée est fédérée à l’Éthiopie sous la couronne éthiopienne, en vertu d’une résolution des Nations unies de 1950.
  Sudan becomes independent.: Le Soudan devient indépendant.
  The French protectorate in Morocco ends.: Le protectorat français au Maroc prend fin.
  Tunisia becomes independent; on 25 July 1957 the bey is deposed and Habib Bourguiba proclaims the republic.: La Tunisie devient indépendante ; le 25 juillet 1957, le bey est déposé et Habib Bourguiba proclame la république.
  Spain recognises Morocco’s independence and gives up its zone in the north.: L’Espagne reconnaît l’indépendance du Maroc et renonce à sa zone du nord.
  The Tangier international zone is returned to Morocco.: La zone internationale de Tanger est rendue au Maroc.
  "Spanish West Africa is dissolved: the Sahara (10 January) and Ifni (14 January) become Spanish provinces.": "L’Afrique-Occidentale espagnole est dissoute : le Sahara (10 janvier) et Ifni (14 janvier) deviennent des provinces espagnoles."
  Under the Angra de Cintra agreement of 1 April, Spain hands the Tarfaya Strip to Morocco.: Par l’accord d’Angra de Cintra du 1er avril, l’Espagne remet la bande de Tarfaya au Maroc.
  The Mali Federation of Senegal and the Sudanese Republic becomes independent; Senegal leaves it in August and the Sudanese Republic takes the name Mali on 22 September.: La fédération du Mali, formée du Sénégal et de la République soudanaise, devient indépendante ; le Sénégal la quitte en août et la République soudanaise prend le nom de Mali le 22 septembre.
  British Somaliland becomes independent as the State of Somaliland.: Le Somaliland britannique devient indépendant sous le nom d’État du Somaliland.
  Somaliland and the trust territory unite as the Somali Republic.: Le Somaliland et le territoire sous tutelle s’unissent pour former la République somalienne.
  Niger becomes independent.: Le Niger devient indépendant.
  Upper Volta becomes independent; it is renamed Burkina Faso in 1984.: La Haute-Volta devient indépendante ; elle prend le nom de Burkina Faso en 1984.
  Chad becomes independent.: Le Tchad devient indépendant.
  Mauritania becomes independent.: La Mauritanie devient indépendante.
  Algeria becomes independent after the Évian Accords (March 1962) and the referendum of 1 July.: L’Algérie devient indépendante après les accords d’Évian (mars 1962) et le référendum du 1er juillet.
  The Eritrean assembly votes to dissolve the federation, and Ethiopia annexes Eritrea.: L’assemblée érythréenne vote la dissolution de la fédération, et l’Éthiopie annexe l’Érythrée.
  Spain returns Ifni to Morocco.: L’Espagne rend Ifni au Maroc.
  "Spain withdraws from Western Sahara under the Madrid Accords of November 1975, which divided its administration between Morocco and Mauritania; the Polisario Front proclaims the Sahrawi Arab Democratic Republic on 27 February. Western Sahara is shown as one territory, on the United Nations list of non-self-governing territories, its status disputed: Moroccan, Mauritanian and Polisario control are shown in the war’s steps.": "L’Espagne se retire du Sahara occidental en vertu des accords de Madrid de novembre 1975, qui en avaient partagé l’administration entre le Maroc et la Mauritanie ; le Front Polisario proclame la République arabe sahraouie démocratique le 27 février. Le Sahara occidental est représenté comme un seul territoire, inscrit sur la liste des territoires non autonomes des Nations unies, dont le statut est disputé : les zones contrôlées par le Maroc, la Mauritanie et le Polisario sont représentées dans les étapes de la guerre."
  Djibouti becomes independent.: Djibouti devient indépendant.
  The Somali National Movement declares Somaliland independent within the borders of British Somaliland. It governs itself but no United Nations member recognised it until Israel did in December 2025.: Le Mouvement national somalien proclame l’indépendance du Somaliland dans les frontières du Somaliland britannique. Le Somaliland se gouverne lui-même, mais aucun État membre des Nations unies ne l’avait reconnu avant qu’Israël ne le fasse en décembre 2025.
  The EPLF takes Asmara and Eritrea governs itself; it becomes formally independent on 24 May 1993 after the referendum.: Le Front populaire de libération de l’Érythrée (FPLE) prend Asmara et l’Érythrée se gouverne elle-même ; elle devient officiellement indépendante le 24 mai 1993, après le référendum.
  South Sudan becomes independent after the referendum of January 2011 under the Comprehensive Peace Agreement. The status of Abyei is still disputed.: Le Soudan du Sud devient indépendant après le référendum de janvier 2011 prévu par l’accord de paix global. Le statut d’Abyei reste disputé.
  "Africa south of the Sahara about 800. Farming and iron-working peoples, among them the Bantu-speaking peoples who have spread over most of Central, East and Southern Africa, live in villages and chiefdoms; Khoikhoi herders and San hunter-gatherers live in the far south-west, and Austronesian settlers have reached Madagascar. Towns are growing on the middle Niger (shown with the Sahel), at Igbo-Ukwu east of the lower Niger and on the Swahili coast, where traders from the Persian Gulf call. No states are shown here yet: the kingdoms appear as the written sources, oral traditions and archaeology begin to describe them.": "L’Afrique subsaharienne vers 800. Des peuples d’agriculteurs et de métallurgistes du fer, parmi lesquels les peuples de langues bantoues qui se sont répandus dans la plus grande partie de l’Afrique centrale, orientale et australe, vivent en villages et en chefferies ; des éleveurs khoïkhoï et des chasseurs-cueilleurs san vivent dans l’extrême sud-ouest, et des colons austronésiens ont atteint Madagascar. Des villes se développent sur le moyen Niger (représenté avec le Sahel), à Igbo-Ukwu, à l’est du bas Niger, et sur la côte swahilie, où abordent des marchands venus du golfe Persique. Aucun État n’est encore représenté ici : les royaumes apparaissent à mesure que les sources écrites, les traditions orales et l’archéologie commencent à les décrire."
  Kano, one of the Hausa city-states; the Kano Chronicle, written down much later, dates the founding of its ruling house by Bagauda to about 999.: Kano, l’une des cités-États haoussa ; la Chronique de Kano, mise par écrit bien plus tard, situe vers 999 la fondation de sa maison régnante par Bagauda.
  Takrur on the middle Senegal is known to Arab writers by the eleventh century; according to al-Bakri its king War Jabi (died 1040–1041) was the first ruler there to adopt Islam.: Le Tekrour, sur le moyen Sénégal, est connu des auteurs arabes dès le XIe siècle ; selon al-Bakri, son roi War Jabi (mort en 1040–1041) fut le premier souverain du pays à embrasser l’islam.
  Mapungubwe, near the confluence of the Shashe and the Limpopo, becomes the first state of the southern African interior, rich on gold and ivory traded to the coast (about 1075–1220).: Mapungubwe, près du confluent de la Shashe et du Limpopo, devient le premier État de l’intérieur de l’Afrique australe, enrichi par l’or et l’ivoire échangés avec la côte (vers 1075–1220).
  Kilwa Kisiwani becomes the leading city-state of the southern Swahili coast; the Kilwa Chronicle dates its Shirazi dynasty to the tenth century, archaeology to the twelfth.: Kilwa Kisiwani devient la principale cité-État du sud de la côte swahilie ; la Chronique de Kilwa fait remonter sa dynastie chirazie au Xe siècle, l’archéologie au XIIe.
  Mombasa, a Swahili city-state on its island, is described by al-Idrisi in the twelfth century.: Mombasa, cité-État swahilie établie sur son île, est décrite par al-Idrisi au XIIe siècle.
  The kingdom of Benin of the Edo; its present dynasty dates by tradition from about 1200, and the obas Ewuare (about 1440–1473) and his successors make it the strongest state of the forest.: Le royaume du Bénin, chez les Edo ; sa dynastie actuelle remonte selon la tradition à 1200 environ, et l’oba Ewuare (vers 1440–1473) et ses successeurs en font l’État le plus puissant de la zone forestière.
  Mapungubwe is abandoned and power moves north to Great Zimbabwe, whose stone enclosures are built from the thirteenth century; it controls the gold trade with the coast until about 1450.: Mapungubwe est abandonnée et le pouvoir se déplace vers le nord, au Grand Zimbabwe, dont les enceintes de pierre sont construites à partir du XIIIe siècle ; il contrôle le commerce de l’or avec la côte jusque vers 1450.
  Sundiata Keita founds the Mali Empire (about 1235); its Mandinka heartland lies on the upper Niger around Niani, Siguiri and Kangaba (the site of the capital is debated).: Soundiata Keïta fonde l’empire du Mali (vers 1235) ; son cœur mandingue se trouve sur le haut Niger, autour de Niani, Siguiri et Kangaba (l’emplacement de la capitale est débattu).
  "The Mali Empire extends its rule west to the Gambia: by tradition Tiramakhan Traoré, a general of Sundiata, conquers the land that becomes Mali’s western province of Kaabu (thirteenth century; the dates are traditional).": "L’empire du Mali étend sa domination à l’ouest jusqu’à la Gambie : selon la tradition, Tiramakhan Traoré, un général de Soundiata, conquiert le pays qui devient le Kaabu, province occidentale du Mali (XIIIe siècle ; les dates sont traditionnelles)."
  The Mali Empire conquers Takrur (about 1286) and rules it through military governors (farba).: L’empire du Mali conquiert le Tekrour (vers 1286) et le fait administrer par des gouverneurs militaires (farba).
  The Hausa kingdom of Zamfara (by tradition from the eleventh century; Birnin Zamfara by the fourteenth).: Le royaume haoussa du Zamfara (depuis le XIe siècle selon la tradition ; Birnin Zamfara existe dès le XIVe).
  Under the Mahdali sultans Kilwa controls the gold trade of Sofala; Ibn Battuta visits Kilwa in 1331.: Sous les sultans mahdali, Kilwa contrôle le commerce de l’or de Sofala ; Ibn Battuta visite Kilwa en 1331.
  The Swahili towns of the Lamu archipelago, led in later centuries by Pate, flourish on the trade of the northern coast (by the fourteenth century).: Les villes swahilies de l’archipel de Lamu, menées aux siècles suivants par Pate, prospèrent grâce au commerce de la côte nord (dès le XIVe siècle).
  The Jolof Empire, founded by tradition by Ndiadiane Ndiaye in the mid-fourteenth century, unites the Wolof and Serer kingdoms of Waalo, Cayor, Baol and Sine under the burba of Jolof.: L’empire du Djolof, fondé selon la tradition par Ndiadiane Ndiaye au milieu du XIVe siècle, unit les royaumes wolofs et sérères du Waalo, du Cayor, du Baol et du Sine sous l’autorité du bourba du Djolof.
  The Hausa kingdom of Katsina, ruled from the fourteenth century by the dynasty of Muhammadu Korau.: Le royaume haoussa de Katsina, gouverné à partir du XIVe siècle par la dynastie de Muhammadu Korau.
  As Mali’s power in the west fades in the fourteenth century, Fulbe dynasties (the Lam Termes and Lam Taaga) take power in Takrur.: Tandis que la puissance du Mali décline dans l’ouest au XIVe siècle, des dynasties peules (les Lam Termes et les Lam Taaga) prennent le pouvoir au Tekrour.
  Driven out of Kanem by the Bulala, the Sayfawa kings settle in Bornu, west of Lake Chad; Ali Gaji builds Birni Ngazargamu as their capital about 1470.: Chassés du Kanem par les Boulala, les rois sayfawa s’installent au Bornou, à l’ouest du lac Tchad ; Ali Gaji y bâtit vers 1470 leur capitale, Birni Ngazargamu.
  The Kingdom of Kongo is founded, by tradition by Lukeni lua Nimi, who conquers the land around Mbanza Kongo in the late fourteenth century; its provinces reach from the Congo River to the Dande and inland to the Kwango.: Le royaume du Kongo est fondé, selon la tradition par Lukeni lua Nimi, qui conquiert la région de Mbanza Kongo à la fin du XIVe siècle ; ses provinces s’étendent du fleuve Congo à la Dande et, vers l’intérieur, jusqu’au Kwango.
  The Hausa kingdom of Zazzau, with Zaria as its capital from the sixteenth century (the dates are traditional).: Le royaume haoussa du Zazzau, avec Zaria pour capitale à partir du XVIe siècle (les dates sont traditionnelles).
  The Yoruba kingdom of Oyo north of the forest, with Oyo-Ile as its capital, and the Ijebu kingdom near the coast (by the fifteenth century; the dates are traditional).: Le royaume yoruba d’Oyo, au nord de la forêt, avec Oyo-Ile pour capitale, et le royaume ijebu, près de la côte (dès le XVe siècle ; les dates sont traditionnelles).
  The Bamum kingdom of the western Grassfields, founded by tradition by Nchare Yen in the late fourteenth century; Foumban is its capital.: Le royaume bamoun des Grassfields de l’Ouest, fondé selon la tradition par Nchare Yen à la fin du XIVe siècle ; Foumban est sa capitale.
  The Swahili city-state of Malindi (by the fifteenth century), whose envoys reach China in 1414–1415 and whose ruler welcomes Vasco da Gama in 1498 and becomes Portugal’s ally.: La cité-État swahilie de Malindi (dès le XVe siècle), dont les envoyés atteignent la Chine en 1414–1415 et dont le souverain accueille Vasco de Gama en 1498 et devient l’allié du Portugal.
  The Mossi-related kingdoms of Dagbon and Mamprugu rule the savanna of the north, descended by tradition from Na Gbewaa; the dates are traditional.: Les royaumes du Dagbon et du Mamprugu, apparentés aux royaumes mossis et issus selon la tradition de Na Gbewaa, dominent la savane du nord ; les dates sont traditionnelles.
  The Akan state of Bono, with Bono-Manso as its capital, controls the trade routes between the forest gold fields and the Niger (by the fifteenth century).: L’État akan de Bono, avec Bono-Manso pour capitale, contrôle les routes commerciales entre les champs aurifères de la forêt et le Niger (dès le XVe siècle).
  The Karagwe kingdom west of Lake Victoria, ruled by the Hinda dynasty (by tradition from the fifteenth century).: Le royaume du Karagwe, à l’ouest du lac Victoria, gouverné par la dynastie hinda (depuis le XVe siècle selon la tradition).
  Great Zimbabwe is abandoned in the fifteenth century. Its heirs are the Mutapa kingdom in the north, founded by tradition by Nyatsimba Mutota, and the Torwa kingdom (Butua) in the south-west, with Khami as its capital.: Le Grand Zimbabwe est abandonné au XVe siècle. Ses héritiers sont le royaume du Monomotapa au nord, fondé selon la tradition par Nyatsimba Mutota, et le royaume torwa (Butua) au sud-ouest, avec Khami pour capitale.
  The burba of Jolof conquers Takrur (in the 1450s; by about 1456) and divides it among his governors (farba).: Le bourba du Djolof conquiert le Tekrour (dans les années 1450 ; vers 1456 au plus tard) et le partage entre ses gouverneurs (farba).
  Portuguese settlers found Ribeira Grande on Santiago, the first European town in the tropics, on the uninhabited Cape Verde islands sighted in 1456–1460.: Des colons portugais fondent Ribeira Grande sur l’île de Santiago, première ville européenne des tropiques, dans l’archipel inhabité du Cap-Vert, aperçu en 1456–1460.
  Portuguese settlers found the town of São Tomé on the uninhabited island, which becomes a sugar colony worked by enslaved Africans.: Des colons portugais fondent la ville de São Tomé sur l’île inhabitée, qui devient une colonie sucrière exploitée par des Africains réduits en esclavage.
  Mbegan Ndour founds the kingdom of Saloum (about 1494).: Mbegan Ndour fonde le royaume du Saloum (vers 1494).
  The Aja kingdom of Allada controls the coast between the Mono and the Ouémé (by the sixteenth century).: Le royaume aja d’Allada contrôle la côte entre le Mono et l’Ouémé (dès le XVIe siècle).
  The Bariba (Baatombu) kingdoms of Borgu, led by Nikki, rule the north of today’s Benin and the lands around Bussa on the Niger (by the sixteenth century; the traditions differ).: Les royaumes bariba (baatombu) du Borgou, menés par Nikki, dominent le nord de l’actuel Bénin et les terres autour de Boussa, sur le Niger (dès le XVIe siècle ; les traditions divergent).
  The Igala kingdom, with Idah as its capital, rules the lands east of the Niger–Benue confluence (by about 1500).: Le royaume igala, avec Idah pour capitale, domine les terres à l’est du confluent du Niger et de la Bénoué (vers 1500 au plus tard).
  The sultanate of Mandara (Wandala) rules the hills and plains south of Lake Chad (by about 1500).: Le sultanat du Mandara (Wandala) domine les collines et les plaines au sud du lac Tchad (vers 1500 au plus tard).
  The Tio (Teke) kingdom, the Anziku of Portuguese writers, rules the plateaus north of Malebo Pool and the lands on both sides of the pool (by about 1500).: Le royaume tio (téké), l’Anziku des auteurs portugais, domine les plateaux au nord du Pool Malebo et les terres situées des deux côtés du Pool (vers 1500 au plus tard).
  The Mbundu kingdom of Ndongo, ruled by the ngola, grows between the Kwanza and the Lukala as a tributary of Kongo (by about 1500).: Le royaume mbundu du Ndongo, gouverné par le ngola, se développe entre le Kwanza et la Lukala comme tributaire du Kongo (vers 1500 au plus tard).
  Portugal settles the island of Príncipe.: Le Portugal colonise l’île de Principe.
  Bunyoro-Kitara, ruled by the Babiito dynasty from about 1500 (the dates are traditional), is the strongest kingdom of the lakes; its kings claim the heritage of the older Kitara of the Bachwezi.: Le Bounyoro-Kitara, gouverné par la dynastie babiito à partir de 1500 environ (les dates sont traditionnelles), est le plus puissant royaume des Grands Lacs ; ses rois revendiquent l’héritage de l’ancien Kitara des Bachwezi.
  The kingdom of Buganda on the north-west shore of Lake Victoria, founded by tradition by Kintu; its kabakas are dated from the fourteenth or fifteenth century.: Le royaume du Bouganda, sur la rive nord-ouest du lac Victoria, fondé selon la tradition par Kintu ; ses kabakas sont datés à partir du XIVe ou du XVe siècle.
  The Nkore (Ankole) kingdom of the Hinda dynasty (by tradition from about 1500).: Le royaume du Nkore (Ankole), de la dynastie hinda (depuis 1500 environ selon la tradition).
  Sultanates of Shirazi descent rule the Comoro islands, often at war with one another (by the sixteenth century); Malagasy raids devastate them around 1800.: Des sultanats d’ascendance chirazie gouvernent les Comores et se font souvent la guerre (dès le XVIe siècle) ; des raids malgaches les dévastent vers 1800.
  The Maravi kingdoms of the Phiri clan grow south and west of Lake Malawi under the kalonga (by the sixteenth century; the dates are uncertain).: Les royaumes maravi du clan phiri se développent au sud et à l’ouest du lac Malawi sous l’autorité du kalonga (dès le XVIe siècle ; les dates sont incertaines).
  Francisco de Almeida takes Kilwa, installs a sultan friendly to Portugal and builds a fort; in August he sacks Mombasa. The Portuguese leave Kilwa in 1512.: Francisco de Almeida prend Kilwa, y installe un sultan favorable au Portugal et y construit un fort ; en août, il met Mombasa à sac. Les Portugais quittent Kilwa en 1512.
  Pero de Anaya builds a Portuguese fort at Sofala.: Pero de Anaya construit un fort portugais à Sofala.
  The Portuguese build a fort on Mozambique Island, which becomes the capital of Portuguese East Africa.: Les Portugais construisent un fort sur l’île de Mozambique, qui devient la capitale de l’Afrique orientale portugaise.
  The Portuguese abandon their fort at Kilwa.: Les Portugais abandonnent leur fort de Kilwa.
  Koli Tenguella, whose father Tenguella was killed fighting Songhai in 1512, leads his Fulbe from Futa Jallon across the upper Gambia and Senegal, takes Futa Toro from Jolof’s governors and founds the Denianke dynasty (1513 in some sources, about 1520 in others).: Koli Tenguella, dont le père Tenguella avait été tué en combattant le Songhaï en 1512, conduit ses Peuls du Fouta-Djalon à travers les hautes vallées de la Gambie et du Sénégal, prend le Fouta-Toro aux gouverneurs du Djolof et fonde la dynastie denianké (1513 selon certaines sources, vers 1520 selon d’autres).
  Kanta Kotal, a commander in Songhai’s war against Aïr, breaks away and founds the kingdom of Kebbi (about 1516).: Kanta Kotal, un chef de l’armée songhaï dans la guerre contre l’Aïr, fait sécession et fonde le royaume de Kebbi (vers 1516).
  Sine, like its Serer neighbour Saloum, leaves the Jolof Empire at least twenty-nine years before the battle of Danki (by about 1520).: Le Sine, comme son voisin sérère le Saloum, quitte l’empire du Djolof au moins vingt-neuf ans avant la bataille de Danki (vers 1520 au plus tard).
  The Mbundu kingdom of Matamba on the upper Kwango (first mentioned in 1530).: Le royaume mbundu du Matamba, sur le haut Kwango (mentionné pour la première fois en 1530).
  Tsoede (Edegi) founds the Nupe kingdom on the middle Niger (by tradition in 1531).: Tsoede (Edegi) fonde le royaume nupe sur le moyen Niger (en 1531 selon la tradition).
  The Nupe take and sack Oyo-Ile (about 1535); the alaafins flee to Borgu and later rule from Igboho (the dates are traditional).: Les Nupe prennent et mettent à sac Oyo-Ile (vers 1535) ; les alaafins se réfugient au Borgou et règnent ensuite depuis Igboho (les dates sont traditionnelles).
  Kaabu, Mali’s western province, becomes an independent kingdom as Mali declines (the sources give 1537 or the mid-sixteenth century); the Mandinka kingdoms of the Gambia valley go their own ways.: Le Kaabu, province occidentale du Mali, devient un royaume indépendant à mesure que le Mali décline (les sources donnent 1537 ou le milieu du XVIe siècle) ; les royaumes mandingues de la vallée de la Gambie suivent chacun leur propre voie.
  The Merina kingdom of Imerina in the central highlands of Madagascar, founded by tradition by Andriamanelo (about 1540).: Le royaume merina de l’Imerina, dans les hautes terres centrales de Madagascar, fondé selon la tradition par Andriamanelo (vers 1540).
  Portuguese trading posts at Quelimane and Inhambane (by the 1540s).: Comptoirs portugais de Quelimane et d’Inhambane (dès les années 1540).
  Amari Ngoone Sobel Fall of Cayor defeats the burba of Jolof at Danki (1549); Cayor becomes independent, and Waalo and Baol break away, leaving Jolof a small inland kingdom.: Amari Ngoone Sobel Fall, du Cayor, bat le bourba du Djolof à Danki (1549) ; le Cayor devient indépendant, le Waalo et le Baol font sécession, et le Djolof n’est plus qu’un petit royaume de l’intérieur.
  Mande horsemen found the kingdom of Gonja in the mid-sixteenth century; under Ndewura Jakpa (seventeenth century) it reaches its greatest size.: Des cavaliers mandé fondent le royaume de Gonja au milieu du XVIe siècle ; sous Ndewura Jakpa (XVIIe siècle), il atteint sa plus grande extension.
  The Kingdom of Loango on the coast north of the Congo, with the smaller kingdoms of Kakongo and Ngoyo (Cabinda), which are shown with it (by the sixteenth century).: Le royaume de Loango, sur la côte au nord du Congo, avec les petits royaumes de Kakongo et de Ngoyo (Cabinda), qui sont représentés avec lui (dès le XVIe siècle).
  Paulo Dias de Novais founds São Paulo de Luanda, the start of the Portuguese colony of Angola; its wars with Ndongo begin in 1579.: Paulo Dias de Novais fonde São Paulo de Luanda, point de départ de la colonie portugaise de l’Angola ; ses guerres avec le Ndongo commencent en 1579.
  The Portuguese conquer the lower Kwanza and Bengo valleys and build the fort of Massangano (1582).: Les Portugais conquièrent les basses vallées du Kwanza et du Bengo et construisent le fort de Massangano (1582).
  The Luba kingdom is founded between the Lomami and the upper Lualaba, by tradition by Kalala Ilunga (about 1585; the dates are traditional).: Le royaume luba est fondé entre le Lomami et le haut Lualaba, selon la tradition par Kalala Ilunga (vers 1585 ; les dates sont traditionnelles).
  The Portuguese found Cacheu on the Guinea coast, a trading post of Cape Verde merchants.: Les Portugais fondent Cacheu, sur la côte de Guinée, comptoir des marchands du Cap-Vert.
  Portuguese settlers take over the Kerimba (Querimba) islands, among them Ibo (late sixteenth century).: Des colons portugais s’emparent des îles Kerimba (Querimba), parmi lesquelles Ibo (fin du XVIe siècle).
  After sacking Mombasa again (1589) the Portuguese build Fort Jesus (1593) and make the sultan of Malindi, their ally, ruler of Mombasa.: Après avoir de nouveau mis Mombasa à sac (1589), les Portugais construisent Fort Jesus (1593) et font du sultan de Malindi, leur allié, le souverain de Mombasa.
  The Fante states of the coast, with Mankessim as their old centre, trade gold and, increasingly, enslaved people with the European forts at Cape Coast, Elmina and Anomabu.: Les États fantis de la côte, dont Mankessim est l’ancien centre, échangent de l’or et, de plus en plus, des personnes réduites en esclavage avec les forts européens de Cape Coast, d’Elmina et d’Anomabu.
  The Akan state of Akwamu rises inland from Accra (about 1600).: L’État akan d’Akwamu s’élève dans l’arrière-pays d’Accra (vers 1600).
  The kingdom of Whydah (Hueda), with Savi as its capital and Ouidah as its port, becomes the busiest slave-trading port of the coast in the late seventeenth century.: Le royaume de Ouidah (Hueda), avec Savi pour capitale et Ouidah pour port, devient le port de traite des esclaves le plus actif de la côte à la fin du XVIIe siècle.
  Lagos (Eko), whose ruling house descends from a Benin war camp of the late sixteenth century, is ruled as a dependency of Benin.: Lagos (Eko), dont la maison régnante descend d’un camp militaire béninois de la fin du XVIe siècle, est gouvernée comme une dépendance du Bénin.
  The Xhosa chiefdoms between the Fish and the Mthatha rivers, under the paramountcy of the Tshawe royal house (by the seventeenth century).: Les chefferies xhosa entre la Fish et la Mthatha, sous la suprématie de la maison royale tshawe (dès le XVIIe siècle).
  Alaafin Abipa brings the court back to rebuild Oyo-Ile (about 1610).: L’alaafin Abipa ramène la cour à Oyo-Ile pour la reconstruire (vers 1610).
  The Portuguese found Benguela.: Les Portugais fondent Benguela.
  Denkyira becomes the leading Akan state of the forest between the Pra and the Ofin, with tributaries reaching west to Wassa and Aowin (about 1620); its capital is Abankeseso.: Le Denkyira devient le principal État akan de la forêt entre la Pra et l’Ofin, avec des tributaires jusqu’au Wassa et à l’Aowin, à l’ouest (vers 1620) ; sa capitale est Abankeseso.
  Imbangala bands under the leader Kasanje settle in the Baixa de Cassange below the Malanje escarpment and found the kingdom of Kasanje (about 1620), which grows rich as the middleman of the slave trade between the Lunda lands and Luanda.: Des bandes imbangala conduites par leur chef Kasanje s’établissent dans la Baixa de Cassange, au pied de l’escarpement de Malanje, et fondent le royaume de Kasanje (vers 1620), qui s’enrichit comme intermédiaire de la traite des esclaves entre les pays lunda et Luanda.
  The kingdom of Dahomey is founded on the Abomey plateau (early seventeenth century; by tradition under Dakodonu and Houegbadja).: Le royaume du Dahomey est fondé sur le plateau d’Abomey (début du XVIIe siècle ; selon la tradition sous Dakodonu et Houegbadja).
  Shyaam a-Mbul founds the Kuba kingdom between the Kasai and the Sankuru (about 1625, by tradition).: Shyaam a-Mbul fonde le royaume kuba entre le Kasaï et le Sankuru (vers 1625, selon la tradition).
  After the treaty of 1629 that made the Mutapa a Portuguese vassal, Portuguese prazo holders take over the lower Zambezi valley around Sena and Quelimane.: Après le traité de 1629 qui avait fait du Monomotapa un vassal du Portugal, des détenteurs portugais de prazos s’emparent de la basse vallée du Zambèze autour de Sena et de Quelimane.
  Njinga Mbande, driven from Ndongo by the Portuguese and their Imbangala allies, conquers Matamba and makes it her kingdom; the Portuguese keep a puppet king of Ndongo at Pungo Andongo.: Njinga Mbande, chassée du Ndongo par les Portugais et leurs alliés imbangala, conquiert le Matamba et en fait son royaume ; les Portugais maintiennent un roi fantoche du Ndongo à Pungo Andongo.
  Sultan Yusuf bin Hasan (Dom Jerónimo Chingulia) had killed the Portuguese of Fort Jesus in 1631 and fled; Portugal now rules Mombasa and Malindi directly.: Le sultan Yusuf bin Hasan (Dom Jerónimo Chingulia) avait tué les Portugais de Fort Jesus en 1631 avant de s’enfuir ; le Portugal gouverne désormais directement Mombasa et Malindi.
  The Dutch East India Company settles uninhabited Mauritius.: La Compagnie néerlandaise des Indes orientales colonise l’île Maurice, alors inhabitée.
  The Dutch West India Company takes Luanda and Benguela; the Portuguese hold out at Massangano.: La Compagnie néerlandaise des Indes occidentales prend Luanda et Benguela ; les Portugais résistent à Massangano.
  Jacques Pronis of the French Compagnie de l’Orient founds Fort-Dauphin in the south-east of Madagascar; the settlers leave in 1674.: Jacques Pronis, de la Compagnie française de l’Orient, fonde Fort-Dauphin dans le sud-est de Madagascar ; les colons partent en 1674.
  The Portuguese found Ziguinchor on the Casamance as a dependency of Cacheu.: Les Portugais fondent Ziguinchor, sur la Casamance, comme dépendance de Cacheu.
  A fleet from Brazil under Salvador Correia de Sá retakes Luanda; the Dutch leave Angola.: Une flotte venue du Brésil sous Salvador Correia de Sá reprend Luanda ; les Néerlandais quittent l’Angola.
  Oyo’s cavalry makes it the dominant Yoruba state; its rule reaches the Egba forest and the towns of the Osun valley (by the mid-seventeenth century).: Sa cavalerie fait d’Oyo l’État yoruba dominant ; sa domination atteint la forêt egba et les villes de la vallée de l’Osun (dès le milieu du XVIIe siècle).
  The Nyiginya kingdom of Rwanda takes shape in central Rwanda in the seventeenth century (by tradition under Ruganzu Ndori).: Le royaume nyiginya du Rwanda prend forme dans le centre du Rwanda au XVIIe siècle (selon la tradition sous Ruganzu Ndori).
  The Sakalava kingdom of Menabe, founded by Andriandahifotsy in the mid-seventeenth century, rules the west coast of Madagascar.: Le royaume sakalava du Menabe, fondé par Andriandahifotsy au milieu du XVIIe siècle, domine la côte ouest de Madagascar.
  The Lozi (Luyi) kingdom of Barotseland on the upper Zambezi floodplain (by the seventeenth century).: Le royaume lozi (luyi) du Barotseland, dans la plaine inondable du haut Zambèze (dès le XVIIe siècle).
  The Pedi kingdom of the Maroteng (by tradition from the mid-seventeenth century); under Thulare (about 1780–1820) it dominates the north-eastern highveld.: Le royaume pedi des Maroteng (selon la tradition à partir du milieu du XVIIe siècle) ; sous Thulare (vers 1780–1820), il domine le nord-est du Highveld.
  The Ovambo kingdoms, among them Ndonga and Kwanyama, farm the floodplains between the Kunene and the Okavango (by the seventeenth century).: Les royaumes ovambos, parmi lesquels le Ndonga et le Kwanyama, cultivent les plaines inondables entre le Kunene et l’Okavango (dès le XVIIe siècle).
  Jan van Riebeeck founds a Dutch East India Company station at the Cape; colonists spread over the south-western Cape, taking the land and herds of the Khoikhoi.: Jan van Riebeeck fonde un poste de la Compagnie néerlandaise des Indes orientales au Cap ; les colons se répandent dans le sud-ouest de la région du Cap, s’emparant des terres et des troupeaux des Khoïkhoï.
  The Dutch leave Mauritius; they return in 1664.: Les Néerlandais quittent Maurice ; ils reviennent en 1664.
  The English East India Company settles uninhabited St Helena.: La Compagnie anglaise des Indes orientales s’établit à Sainte-Hélène, alors inhabitée.
  The Dutch resettle Mauritius.: Les Néerlandais s’établissent de nouveau à Maurice.
  The Lunda kingdom of the Mwata Yamvo, with its capital (musumba) on the upper Kasai and Lulua, begins a century of expansion west to the Kwango and east to the Luapula (about 1665).: Le royaume lunda du Mwata Yamvo, avec sa capitale (musumba) sur le haut Kasaï et la Lulua, entame un siècle d’expansion, vers l’ouest jusqu’au Kwango et vers l’est jusqu’au Luapula (vers 1665).
  The Portuguese take Pungo Andongo and end the kingdom of Ndongo.: Les Portugais prennent Pungo Andongo et mettent fin au royaume du Ndongo.
  The French abandon Fort-Dauphin.: Les Français abandonnent Fort-Dauphin.
  The kingdom of Burundi is founded, by tradition by Ntare Rushatsi in the late seventeenth century; under Ntare Rugamba (about 1796–1850) it reaches its modern size.: Le royaume du Burundi est fondé, selon la tradition par Ntare Rushatsi, à la fin du XVIIe siècle ; sous Ntare Rugamba (vers 1796–1850), il atteint son étendue actuelle.
  Akwamu completes its conquest of the Ga kingdom of Accra (1677–1681).: L’Akwamu achève la conquête du royaume ga d’Accra (1677–1681).
  Changamire Dombo, a former keeper of the Mutapa’s royal herds, conquers Butua and founds the Rozvi Empire (about 1683).: Changamire Dombo, ancien gardien des troupeaux royaux du Monomotapa, conquiert le Butua et fonde l’empire rozvi (vers 1683).
  The Portuguese found Bissau as a fortified trading post.: Les Portugais fondent Bissau, comptoir fortifié.
  A prince of Allada founds the kingdom of Porto-Novo (Hogbonou) on the lagoon (by tradition in 1688).: Un prince d’Allada fonde le royaume de Porto-Novo (Hogbonou) sur la lagune (en 1688 selon la tradition).
  Malik Sy, a Fulbe cleric from Futa Toro, founds the almamate of Bundu between the Senegal and the Falémé (about 1690–1699).: Malik Sy, un lettré peul du Fouta-Toro, fonde l’almamat du Boundou entre le Sénégal et la Falémé (vers 1690–1699).
  The Abron found the Gyaman kingdom around Bondoukou (late seventeenth century); it becomes a tributary of Asante after 1740.: Les Abron fondent le royaume du Gyaman autour de Bondoukou (fin du XVIIe siècle) ; il devient tributaire de l’empire ashanti après 1740.
  A Sakalava prince founds the kingdom of Boina in the north-west (about 1690), around the port of Mahajanga; Boina and Menabe are shown together.: Un prince sakalava fonde le royaume du Boina dans le nord-ouest (vers 1690), autour du port de Mahajanga ; le Boina et le Menabe sont représentés ensemble.
  Changamire Dombo drives the Portuguese from the plateau (Dambarare, 1693) and from Manyika (1695).: Changamire Dombo chasse les Portugais du plateau (Dambarare, 1693) et du Manyika (1695).
  Omani forces take Fort Jesus after a siege of nearly three years (1696–1698); Oman becomes the leading power of the coast north of Cape Delgado and takes Zanzibar and Pemba.: Les forces omanaises prennent Fort Jesus après un siège de près de trois ans (1696–1698) ; Oman devient la principale puissance de la côte au nord du cap Delgado et prend Zanzibar et Pemba.
  The Ovimbundu kingdoms of the central highlands, among them Bailundo, Bié and Wambu (Huambo), grow rich on the caravan trade to Benguela (by the eighteenth century).: Les royaumes ovimbundu des hauts plateaux du centre, parmi lesquels le Bailundo, le Bié et le Wambu (Huambo), s’enrichissent grâce au commerce caravanier vers Benguela (dès le XVIIIe siècle).
  The Tswana kingdoms (the Kwena, Ngwaketse and Ngwato, and further south the Rolong and Tlhaping) rule the eastern edge of the Kalahari (by the eighteenth century).: Les royaumes tswana (les Kwena, les Ngwaketse et les Ngwato et, plus au sud, les Rolong et les Tlhaping) dominent la bordure orientale du Kalahari (dès le XVIIIe siècle).
  Osei Tutu’s Asante, united under the Golden Stool, defeat Denkyira at Feyiase (1701); Asante takes Denkyira’s place as the strongest power of the forest.: Les Ashantis d’Osei Tutu, unis sous le Tabouret d’or, battent le Denkyira à Feyiase (1701) ; l’empire ashanti prend la place du Denkyira comme puissance dominante de la forêt.
  Akwamu conquers the Ewe lands east of the Volta (1702–1710).: L’Akwamu conquiert les terres ewe à l’est de la Volta (1702–1710).
  St Helena passes with England to the Kingdom of Great Britain.: Sainte-Hélène passe avec l’Angleterre au royaume de Grande-Bretagne.
  Seku Wattara founds the Kong Empire, a state of Dyula traders and warriors in the north of the Ivory Coast (about 1710).: Sékou Ouattara fonde l’empire de Kong, un État de marchands et de guerriers dioula dans le nord de la Côte d’Ivoire (vers 1710).
  The Dutch abandon Mauritius.: Les Néerlandais abandonnent Maurice.
  Ratsimilaho unites the peoples of the north-east coast as the Betsimisaraka confederation (about 1712–1720).: Ratsimilaho unit les peuples de la côte nord-est dans la confédération betsimisaraka (vers 1712–1720).
  France claims Mauritius as Île de France and settles it from 1721 with colonists and enslaved Africans and Malagasy; Rodrigues follows.: La France revendique Maurice sous le nom d’île de France et la peuple à partir de 1721 de colons et d’Africains et de Malgaches réduits en esclavage ; Rodrigues suit.
  Opoku Ware of Asante conquers Bono and destroys Bono-Manso (1723).: Opoku Ware, souverain ashanti, conquiert le Bono et détruit Bono-Manso (1723).
  Weakened by civil wars, the Mutapa kings keep their capital in the Zambezi valley (Chidima) from 1723; the northern plateau is held by independent Shona chiefdoms.: Affaiblis par des guerres civiles, les rois du Monomotapa gardent leur capitale dans la vallée du Zambèze (Chidima) à partir de 1723 ; le plateau septentrional est tenu par des chefferies shona indépendantes.
  King Agaja of Dahomey conquers Allada.: Le roi Agaja du Dahomey conquiert Allada.
  The Fulbe jihad of Karamokho Alfa and Ibrahima Sori founds the Imamate of Futa Jallon, with Timbo as its capital and Fugumba as its religious centre (about 1725; the dates are debated).: Le djihad peul de Karamokho Alfa et d’Ibrahima Sori fonde l’imamat du Fouta-Djalon, avec Timbo pour capitale et Fougoumba pour centre religieux (vers 1725 ; les dates sont débattues).
  Agaja conquers Whydah, giving Dahomey direct access to the European slave traders; Oyo’s invasions make Dahomey its tributary from 1730.: Agaja conquiert Ouidah, ce qui donne au Dahomey un accès direct aux marchands d’esclaves européens ; les invasions d’Oyo font du Dahomey son tributaire à partir de 1730.
  With the help of Pate, the Portuguese retake Mombasa and Fort Jesus.: Avec l’aide de Pate, les Portugais reprennent Mombasa et Fort Jesus.
  The Portuguese give up Fort Jesus after a rising in Mombasa, and Omani governors return.: Les Portugais abandonnent Fort Jesus après un soulèvement à Mombasa, et les gouverneurs omanais reviennent.
  Akyem and its allies defeat Akwamu (1730), whose rulers withdraw to a small state on the Volta; Akyem takes over Akwamu’s lands west of the Volta and the rents of the Accra forts.: L’Akyem et ses alliés battent l’Akwamu (1730), dont les souverains se replient dans un petit État sur la Volta ; l’Akyem s’empare des terres de l’Akwamu à l’ouest de la Volta et des loyers des forts d’Accra.
  A Lunda general founds the kingdom of Kazembe on the Luapula (about 1740).: Un général lunda fonde le royaume du Kazembe sur le Luapula (vers 1740).
  Asante defeats Akyem (1742) and takes control of the trade routes to Accra.: L’empire ashanti bat l’Akyem (1742) et prend le contrôle des routes commerciales vers Accra.
  The Mazrui governors of Mombasa break with the new Busaidi rulers of Oman (1741–1746) and rule Mombasa and Pemba on their own; their state is shown as Mombasa.: Les gouverneurs mazrui de Mombasa rompent avec les nouveaux souverains busaidi d’Oman (1741–1746) et gouvernent Mombasa et Pemba pour leur propre compte ; leur État est représenté sous le nom de Mombasa.
  Gobir, driven south from the borders of Aïr, settles in the Rima valley with Alkalawa as its capital (mid-eighteenth century).: Le Gobir, repoussé vers le sud depuis les confins de l’Aïr, s’établit dans la vallée de la Rima, avec Alkalawa pour capitale (milieu du XVIIIe siècle).
  The Maravi kingdoms break up into rival chiefdoms (eighteenth century).: Les royaumes maravi éclatent en chefferies rivales (XVIIIe siècle).
  The Swazi kingdom takes shape under Ngwane III (mid-eighteenth century); Sobhuza I (about 1815–1836) builds it north of the Pongola.: Le royaume swazi prend forme sous Ngwane III (milieu du XVIIIe siècle) ; Sobhuza Ier (vers 1815–1836) le développe au nord de la Pongola.
  Gobir destroys Birnin Zamfara (the sources give 1756 to 1764) and takes Zamfara.: Le Gobir détruit Birnin Zamfara (les sources donnent de 1756 à 1764) et prend le Zamfara.
  French settlers and enslaved Africans settle the uninhabited Seychelles, claimed by France in 1756.: Des colons français et des Africains réduits en esclavage s’établissent aux Seychelles, alors inhabitées, revendiquées par la France en 1756.
  Governor van Plettenberg makes the Great Fish River the Cape Colony’s eastern border; colonists and Xhosa fight the first frontier war in 1779–1781.: Le gouverneur van Plettenberg fait de la Great Fish River la frontière orientale de la colonie du Cap ; colons et Xhosa mènent la première guerre de la frontière en 1779–1781.
  In the Treaty of El Pardo Portugal cedes Fernando Po (Bioko) and Annobón to Spain; Spanish rule takes hold only in the 1840s, after a British naval base on Fernando Po (1827–1843).: Par le traité d’El Pardo, le Portugal cède Fernando Poo (Bioko) et Annobón à l’Espagne ; la domination espagnole ne s’établit réellement que dans les années 1840, après une base navale britannique à Fernando Poo (1827–1843).
  The Egba throw off Oyo rule under Lisabi (about 1775–1780).: Les Egba secouent la domination d’Oyo sous la conduite de Lisabi (vers 1775–1780).
  Buganda takes Buddu and other lands from Bunyoro (late eighteenth century) and becomes the strongest kingdom of the lakes.: Le Bouganda prend le Buddu et d’autres territoires au Bounyoro (fin du XVIIIe siècle) et devient le plus puissant royaume des Grands Lacs.
  Portugal builds a permanent fort at Lourenço Marques on Delagoa Bay, after Dutch (1721–1730) and Austrian (1777–1781) posts there.: Le Portugal construit un fort permanent à Lourenço Marques, sur la baie de Delagoa, après des postes néerlandais (1721–1730) et autrichien (1777–1781).
  Oman places a garrison at Kilwa Kisiwani; the last Kilwa sultans rule under Omani overlordship.: Oman installe une garnison à Kilwa Kisiwani ; les derniers sultans de Kilwa règnent sous la suzeraineté omanaise.
  Black Loyalists from Nova Scotia found Freetown for the Sierra Leone Company, on land bought from Temne rulers; it becomes a British crown colony in 1808.: Des loyalistes noirs venus de Nouvelle-Écosse fondent Freetown pour la Compagnie de Sierra Leone, sur des terres achetées à des souverains temne ; elle devient une colonie de la Couronne britannique en 1808.
  Andrianampoinimerina reunites Imerina, makes Antananarivo his capital and extends his rule over Vakinankaratra (1790s–1800s).: Andrianampoinimerina réunifie l’Imerina, fait d’Antananarivo sa capitale et étend sa domination au Vakinankaratra (années 1790–1800).
  The Bemba kingdom of the Chitimukulu becomes the strongest power on the plateau of north-eastern Zambia between Lake Bangweulu and Lake Tanganyika (by about 1800; it expands most in the mid-nineteenth century).: Le royaume bemba du Chitimukulu devient la plus forte puissance du plateau du nord-est de la Zambie, entre le lac Bangweulu et le lac Tanganyika (vers 1800 au plus tard ; son expansion la plus forte date du milieu du XIXe siècle).
  The fall of Alkalawa, the Gobir capital (October 1808), completes the conquest of the Hausa kingdoms by Usman dan Fodio’s jihad (1804–1808); his flag-bearers rule Kano, Katsina, Zaria and new emirates such as Bauchi and Gombe in the Sokoto Caliphate.: La chute d’Alkalawa, la capitale du Gobir (octobre 1808), achève la conquête des royaumes haoussa par le djihad d’Usman dan Fodio (1804–1808) ; ses porte-étendards gouvernent Kano, Katsina, Zaria et de nouveaux émirats comme Bauchi et Gombe au sein du califat de Sokoto.
  Modibo Adama, a flag-bearer of Usman dan Fodio, begins to build the emirate of Adamawa (Fombina) on the upper Benue.: Modibo Adama, un porte-étendard d’Usman dan Fodio, commence à constituer l’émirat de l’Adamaoua (Fombina) sur la haute Bénoué.
  British forces take Île de France, ceded to Britain in 1814 with its dependencies, the Seychelles among them.: Les forces britanniques prennent l’île de France, cédée à la Grande-Bretagne en 1814 avec ses dépendances, dont les Seychelles.
  Lamu defeats Pate and the Mazrui at Shela (about 1812) and calls in Oman, which garrisons a new fort at Lamu (1813–1821); the Lamu archipelago comes under Omani rule over the next decade.: Lamu bat Pate et les Mazrui à Shela (vers 1812) et fait appel à Oman, qui place une garnison dans un nouveau fort à Lamu (1813–1821) ; l’archipel de Lamu passe sous domination omanaise au cours de la décennie suivante.
  Griqua communities of Khoikhoi and mixed descent, led by the Kok and Waterboer families, settle at Griquatown, the core of later Griqualand West.: Des communautés griqua d’origine khoïkhoï et métissée, menées par les familles Kok et Waterboer, s’installent à Griquatown, noyau du futur Griqualand occidental.
  The Treaty of Paris confirms British rule of the Seychelles, a dependency of Mauritius until 1903.: Le traité de Paris confirme la domination britannique sur les Seychelles, dépendance de Maurice jusqu’en 1903.
  Britain garrisons Ascension during Napoleon’s exile on St Helena.: La Grande-Bretagne installe une garnison à l’Ascension pendant l’exil de Napoléon à Sainte-Hélène.
  After invasions in 1807, 1811 and 1814–1816 the Fante states submit to Asante; only the European forts stay outside its rule.: Après des invasions en 1807, 1811 et 1814–1816, les États fantis se soumettent à l’empire ashanti ; seuls les forts européens restent hors de sa domination.
  Britain annexes Tristan da Cunha.: La Grande-Bretagne annexe Tristan da Cunha.
  Britain founds Bathurst (Banjul) on St Mary’s Island at the mouth of the Gambia, ceded by the king of Kombo.: La Grande-Bretagne fonde Bathurst (Banjul) sur l’île Sainte-Marie, à l’embouchure de la Gambie, île cédée par le roi de Kombo.
  The emirate of Muri is founded on the middle Benue.: L’émirat de Muri est fondé sur la moyenne Bénoué.
  Radama I, allied with Britain by a treaty of 1817, takes Toamasina and the north-east coast and conquers the Sihanaka of Lake Alaotra (1817–1823); Britain recognises him as king of Madagascar.: Radama Ier, allié à la Grande-Bretagne par un traité de 1817, prend Toamasina et la côte nord-est et soumet les Sihanaka du lac Alaotra (1817–1823) ; la Grande-Bretagne le reconnaît comme roi de Madagascar.
  Shaka’s Zulu kingdom defeats the Ndwandwe (1818–1819) and becomes the strongest power between the Drakensberg and the sea.: Le royaume zoulou de Shaka bat les Ndwandwe (1818–1819) et devient la plus forte puissance entre le Drakensberg et la mer.
  Omani forces take Pemba from the Mazrui.: Les forces omanaises prennent Pemba aux Mazrui.
  Settlers sent by the American Colonization Society, free-born and formerly enslaved Black Americans, move to Cape Mesurado, where Monrovia is founded.: Des colons envoyés par l’American Colonization Society, des Noirs américains nés libres ou anciens esclaves, s’installent au cap Mesurado, où Monrovia est fondée.
  Afonja, Oyo’s general at Ilorin, had rebelled in 1817 with the help of Fulani and Hausa fighters; after his death (1823–1824) Ilorin becomes an emirate of the Sokoto Caliphate, and the Oyo Empire falls apart.: Afonja, général d’Oyo à Ilorin, s’était révolté en 1817 avec l’aide de combattants peuls et haoussa ; après sa mort (1823–1824), Ilorin devient un émirat du califat de Sokoto, et l’empire d’Oyo se désagrège.
  Radama’s armies reach the far north, Vohemar and the Antankarana lands.: Les armées de Radama atteignent l’extrême nord, Vohemar et le pays antankarana.
  Radama takes Mahajanga and the Sakalava kingdom of Boina.: Radama prend Mahajanga et le royaume sakalava du Boina.
  Moshoeshoe gathers refugees of the wars of the 1820s at Thaba Bosiu and builds the Basotho kingdom.: Moshoeshoe rassemble à Thaba Bosiu les réfugiés des guerres des années 1820 et constitue le royaume basotho.
  Merina armies take the south-east coast to Fort-Dauphin.: Les armées merina prennent la côte sud-est jusqu’à Fort-Dauphin.
  Soshangane, a Nguni leader driven north by the Zulu wars, founds the Gaza Empire in southern Mozambique (about 1825), with its capital in the lower Limpopo valley.: Soshangane, un chef nguni repoussé vers le nord par les guerres zouloues, fonde l’empire de Gaza dans le sud du Mozambique (vers 1825), avec sa capitale dans la basse vallée du Limpopo.
  An army of the coastal states and the British defeats Asante at Katamanso (Dodowa) near Accra; Asante loses its hold on the south and in the treaty of 1831 gives up its claims to the coastal states, which come under informal British protection; Akyem Abuakwa, which fought on the coastal side, is independent again.: Une armée des États côtiers et des Britanniques bat les Ashantis à Katamanso (Dodowa), près d’Accra ; l’empire ashanti perd son emprise sur le sud et, par le traité de 1831, renonce à ses prétentions sur les États côtiers, qui passent sous une protection britannique informelle ; l’Akyem Abuakwa, qui a combattu aux côtés des États côtiers, redevient indépendant.
  Mzilikazi’s Ndebele settle on the Magaliesberg and the Marico, from where they raid the highveld (1827–1837).: Les Ndébélé de Mzilikazi s’installent sur le Magaliesberg et le Marico, d’où ils lancent des raids sur le Highveld (1827–1837).
  Yoruba soldiers settle at Ibadan, a war camp that grows into the strongest Yoruba power.: Des soldats yoruba s’établissent à Ibadan, un camp militaire qui devient la plus forte puissance yoruba.
  Dar al-Kuti, a Muslim state founded under the overlordship of Wadai, rules the lands north of the Ubangi basin (about 1830); from 1890 its sultan Muhammad al-Sanusi raids far to the south for slaves, from 1894 from his new capital Ndélé.: Le Dar el-Kouti, un État musulman fondé sous la suzeraineté du Ouaddaï, domine les terres au nord du bassin de l’Oubangui (vers 1830) ; à partir de 1890, son sultan Muhammad al-Sanusi lance des razzias d’esclaves loin vers le sud, à partir de 1894 depuis sa nouvelle capitale, Ndélé.
  Kaboyo, a son of the Bunyoro king, makes Toro an independent kingdom (about 1830).: Kaboyo, un fils du roi du Bounyoro, fait du Toro un royaume indépendant (vers 1830).
  By about 1830 the Merina kingdom rules the Betsileo highlands and the edge of the western plains; Menabe, the Bara and the peoples of the far south stay outside its rule.: Vers 1830, le royaume merina domine les hautes terres betsileo et la bordure des plaines occidentales ; le Menabe, les Bara et les peuples de l’extrême sud restent hors de sa domination.
  Moshoeshoe’s Basotho kingdom spreads over the fertile lowlands on both sides of the Caledon (1830s), which it defends against the Boers in the wars of 1858 and 1865–1868.: Le royaume basotho de Moshoeshoe s’étend sur les basses terres fertiles des deux rives du Caledon (années 1830), qu’il défend contre les Boers lors des guerres de 1858 et de 1865–1868.
  Settlers of the Maryland State Colonization Society found Harper at Cape Palmas, the colony of Maryland in Africa (an independent republic from 1854).: Des colons de la Maryland State Colonization Society fondent Harper au cap Palmas, la colonie du Maryland en Afrique (république indépendante à partir de 1854).
  Mallam Dendo’s sons make Nupe an emirate of the caliphate, and new emirates rule the lands south of Zaria (Keffi, Nasarawa, Lafia); the lamidates of Adamawa reach Garoua, Ngaoundéré and Tibati.: Les fils de Mallam Dendo font du Nupe un émirat du califat, et de nouveaux émirats dominent les terres au sud de Zaria (Keffi, Nasarawa, Lafia) ; les lamidats de l’Adamaoua atteignent Garoua, Ngaoundéré et Tibati.
  After Zwangendaba’s Ngoni have ravaged the plateau (1833–1835), Nyamazana’s Ngoni take Danamombe and kill the Rozvi king Chirisamhuru (1835); the Rozvi Empire breaks up.: Après le ravage du plateau par les Ngoni de Zwangendaba (1833–1835), les Ngoni de Nyamazana prennent Danamombe et tuent le roi rozvi Chirisamhuru (1835) ; l’empire rozvi se désagrège.
  After the Sixth Frontier War Governor D’Urban annexes the land up to the Kei as Queen Adelaide Province.: Après la sixième guerre de la frontière, le gouverneur D’Urban annexe les terres jusqu’à la Kei sous le nom de province de la Reine-Adélaïde.
  On London’s orders Queen Adelaide Province is given up, and the Xhosa chiefs regain their land under treaties with the Cape.: Sur ordre de Londres, la province de la Reine-Adélaïde est abandonnée, et les chefs xhosa recouvrent leurs terres par des traités avec la colonie du Cap.
  Said bin Sultan takes Fort Jesus and ends Mazrui rule in Mombasa.: Saïd ben Sultan prend Fort Jesus et met fin à la domination mazrui à Mombasa.
  Voortrekker and Griqua-Rolong attacks drive the Ndebele north (1837); Voortrekkers settle Potchefstroom (1838). The trekker communities north of the Vaal unite as the South African Republic, recognised by Britain in the Sand River Convention of 1852.: Des attaques des Voortrekkers et des Griqua-Rolong repoussent les Ndébélé vers le nord (1837) ; les Voortrekkers s’établissent à Potchefstroom (1838). Les communautés de trekkers au nord du Vaal s’unissent dans la République sud-africaine, reconnue par la Grande-Bretagne par la convention de Sand River de 1852.
  King Denis Rapontchombo of the Mpongwe signs a treaty giving France land on the Gabon estuary; a French post follows in 1843 and Libreville in 1849.: Le roi Denis Rapontchombo, des Mpongwe, signe un traité qui cède à la France des terres sur l’estuaire du Gabon ; un poste français suit en 1843 et Libreville en 1849.
  Monrovia and the settlements of Grand Bassa unite as the Commonwealth of Liberia; Liberia declares its independence in 1847.: Monrovia et les établissements de Grand Bassa s’unissent dans le Commonwealth du Liberia ; le Liberia proclame son indépendance en 1847.
  After their victory over Dingane at Blood River (Ncome, December 1838) the Voortrekkers proclaim the Republic of Natalia south of the Tugela.: Après leur victoire sur Dingane à Blood River (Ncome, décembre 1838), les Voortrekkers proclament la république de Natalia au sud de la Tugela.
  Ibadan defeats Ilorin at Osogbo (1840) and becomes the protector of the Osun towns.: Ibadan bat Ilorin à Osogbo (1840) et devient le protecteur des villes de l’Osun.
  Portugal founds Moçâmedes (Namibe) on the southern coast.: Le Portugal fonde Moçâmedes (Namibe) sur la côte méridionale.
  Said bin Sultan moves his capital from Muscat to Zanzibar; his governors rule the mainland ports from Tanga to Bagamoyo, where the caravan routes to the Great Lakes begin.: Saïd ben Sultan transfère sa capitale de Mascate à Zanzibar ; ses gouverneurs administrent les ports du continent, de Tanga à Bagamoyo, d’où partent les routes caravanières vers les Grands Lacs.
  The Gaza Empire extends its rule north of the Save to the Zambezi (by about 1840) and takes tribute from the Portuguese posts of Sofala and Sena; from the 1860s its capital is Mossurize, in the highlands near the Save.: L’empire de Gaza étend sa domination au nord de la Save jusqu’au Zambèze (vers 1840 au plus tard) et lève tribut sur les postes portugais de Sofala et de Sena ; à partir des années 1860, sa capitale est Mossurize, dans les hautes terres près de la Save.
  Mzilikazi’s Ndebele, driven from the Transvaal in 1837, settle north of the Limpopo (1838–1840); their kingdom raids and takes tribute from the Shona.: Les Ndébélé de Mzilikazi, chassés du Transvaal en 1837, s’installent au nord du Limpopo (1838–1840) ; leur royaume lance des raids sur les Shona et leur impose un tribut.
  Sebetwane’s Kololo, Sotho migrants from the south, conquer Barotseland (about 1840).: Les Kololo de Sebetwane, migrants sotho venus du sud, conquièrent le Barotseland (vers 1840).
  Mississippi in Africa (Greenville, Sinoe) joins the Commonwealth of Liberia.: Le Mississippi en Afrique (Greenville, Sinoe) rejoint le Commonwealth du Liberia.
  France builds forts at Grand-Bassam and Assinie after treaties with the local rulers (1842–1843).: La France construit des forts à Grand-Bassam et à Assinie après des traités avec les souverains locaux (1842–1843).
  Britain annexes Natal.: La Grande-Bretagne annexe le Natal.
  Trekkers under Hendrik Potgieter settle Ohrigstad (1845) and Lydenburg (1849) in the east.: Des trekkers menés par Hendrik Potgieter s’établissent à Ohrigstad (1845) et à Lydenburg (1849), dans l’est.
  Sir Harry Smith extends the Cape Colony’s northern border to the Orange River.: Sir Harry Smith repousse la frontière septentrionale de la colonie du Cap jusqu’au fleuve Orange.
  "After the War of the Axe Britain annexes the land between the Fish and the Kei: the west to the Cape, the rest as the crown colony of British Kaffraria, joined to the Cape in 1866.": "Après la guerre de la Hache, la Grande-Bretagne annexe les terres entre la Fish et la Kei : l’ouest est rattaché au Cap, le reste devient la colonie de la Couronne de Cafrerie britannique, rattachée au Cap en 1866."
  Sir Harry Smith proclaims British sovereignty between the Orange and the Vaal (the Orange River Sovereignty); Britain withdraws in 1854 and the Boers form the Orange Free State.: Sir Harry Smith proclame la souveraineté britannique entre l’Orange et le Vaal (la Souveraineté de la rivière Orange) ; la Grande-Bretagne se retire en 1854 et les Boers forment l’État libre d’Orange.
  Umar Tall settles at Dinguiraye with his followers, the base from which he launches his jihad in 1852.: Oumar Tall s’établit à Dinguiraye avec ses disciples ; c’est de là qu’il lance son djihad en 1852.
  Munyigumba unites the Hehe chiefdoms (about 1855); under his son Mkwawa (from 1879) the Hehe kingdom dominates the southern highlands of today’s Tanzania.: Munyigumba unit les chefferies hehe (vers 1855) ; sous son fils Mkwawa (à partir de 1879), le royaume hehe domine les hautes terres méridionales de l’actuelle Tanzanie.
  Faidherbe’s troops conquer Waalo, which France annexes to Senegal.: Les troupes de Faidherbe conquièrent le Waalo, que la France annexe au Sénégal.
  Msiri, a Nyamwezi trader, builds the Yeke kingdom (Garanganze) in the copper country of southern Katanga, with Bunkeya as his capital (from about 1856).: Msiri, un marchand nyamwezi, constitue le royaume yeke (Garanganze) dans le pays du cuivre du sud du Katanga, avec Bunkeya pour capitale (à partir de 1856 environ).
  "After the death of Said bin Sultan his sons divide his realm: Majid rules Zanzibar and the African coast as a separate sultanate (confirmed by the Canning Award of 1861).": "Après la mort de Saïd ben Sultan, ses fils se partagent ses possessions : Majid gouverne Zanzibar et la côte africaine comme un sultanat distinct (confirmé par l’arbitrage Canning de 1861)."
  After a war with the Grebo and a referendum, the Republic of Maryland joins Liberia as Maryland County.: Après une guerre contre les Grebo et un référendum, la république du Maryland rejoint le Liberia sous le nom de comté de Maryland.
  France founds Dakar on the Cap-Vert peninsula, opposite its island of Gorée.: La France fonde Dakar sur la presqu’île du Cap-Vert, face à son île de Gorée.
  Ibadan brings the Ekiti kingdoms under its rule (1850s–1870s).: Ibadan soumet les royaumes ekiti (années 1850–1870).
  Rwanda absorbs Gisaka in the east (mid-nineteenth century), and under Kigeli IV Rwabugiri (about 1867–1895) royal rule reaches Lake Kivu; the north-west is brought under the court only in the 1910s.: Le Rwanda absorbe le Gisaka à l’est (milieu du XIXe siècle) et, sous Kigeli IV Rwabugiri (vers 1867–1895), le pouvoir royal atteint le lac Kivu ; le nord-ouest n’est soumis à la cour que dans les années 1910.
  Britain annexes Lagos, which it had bombarded in 1851.: La Grande-Bretagne annexe Lagos, qu’elle avait bombardée en 1851.
  France extends its rule to Cape Lopez and the Orungu on the Ogooué delta.: La France étend sa domination au cap Lopez et aux Orungu, sur le delta de l’Ogooué.
  The Lozi rise against the Kololo and restore their kingdom under Sipopa.: Les Lozi se soulèvent contre les Kololo et restaurent leur royaume sous Sipopa.
  After defeating the damel Lat Dior at Loro (12 January 1864), France restores its candidate Madiodio as damel and annexes Cayor (1865).: Après avoir battu le damel Lat Dior à Loro (12 janvier 1864), la France rétablit son candidat Madiodio comme damel et annexe le Cayor (1865).
  In the treaty of Thaba Bosiu, after the second Free State–Basotho war, Moshoeshoe cedes the lowlands west of the Caledon, the Conquered Territory, to the Orange Free State; the cession is confirmed with a smaller border in the second treaty of Aliwal North (1869).: Par le traité de Thaba Bosiu, après la deuxième guerre entre l’État libre et les Basotho, Moshoeshoe cède à l’État libre d’Orange les basses terres à l’ouest du Caledon, le Territoire conquis ; la cession est confirmée, avec une frontière plus restreinte, par le second traité d’Aliwal North (1869).
  Futa Jallon’s army takes Kansala, the Kaabu capital, whose defenders blow it up (1867); Alfa Molo, a Fulbe leader, builds the kingdom of Fuladu on Kaabu’s ruins.: L’armée du Fouta-Djalon prend Kansala, la capitale du Kaabu, que ses défenseurs font sauter (1867) ; Alfa Molo, un chef peul, fonde le royaume du Fouladou sur les ruines du Kaabu.
  An arbitration by US President Ulysses S. Grant awards Bolama, long claimed by Britain, to Portugal; Bolama becomes the capital of Portuguese Guinea in 1879.: Un arbitrage du président américain Ulysses S. Grant attribue au Portugal Bolama, longtemps revendiquée par la Grande-Bretagne ; Bolama devient la capitale de la Guinée portugaise en 1879.
  France, weakened by its war with Prussia, recognises Lat Dior as damel of Cayor again (July 1870; by treaty in January 1871).: La France, affaiblie par sa guerre contre la Prusse, reconnaît de nouveau Lat Dior comme damel du Cayor (juillet 1870 ; par traité en janvier 1871).
  Britain annexes Griqualand West with the diamond fields around Kimberley.: La Grande-Bretagne annexe le Griqualand occidental avec les champs diamantifères autour de Kimberley.
  After the Anglo-Ashanti war of 1873–1874 Britain proclaims the Gold Coast Colony over the southern states it had protected; the Danes had sold their forts to Britain in 1850 and the Dutch theirs in 1872.: Après la guerre anglo-ashanti de 1873–1874, la Grande-Bretagne proclame la colonie de la Côte-de-l’Or sur les États du sud qu’elle protégeait ; les Danois lui avaient vendu leurs forts en 1850, et les Néerlandais les leurs en 1872.
  Kabalega of Bunyoro reconquers Toro.: Kabalega, du Bounyoro, reconquiert le Toro.
  The Ekiti, Ijesha and their allies rise against Ibadan as the Ekitiparapo, beginning the sixteen-year Kiriji War.: Les Ekiti, les Ijesha et leurs alliés se soulèvent contre Ibadan sous le nom d’Ekitiparapo, ce qui ouvre la guerre de Kiriji, longue de seize ans.
  Samori Touré, a Mandinka trader turned war leader, proclaims himself faama with his capital at Bissandougou (1878); his state is the Wassoulou Empire.: Samory Touré, un marchand mandingue devenu chef de guerre, se proclame faama avec Bissandougou pour capitale (1878) ; son État est l’empire du Wassoulou.
  Britain annexes Walvis Bay, joined to the Cape Colony in 1884.: La Grande-Bretagne annexe Walvis Bay, rattachée à la colonie du Cap en 1884.
  After its defeat at Ulundi (4 July 1879) the Zulu kingdom is divided by Wolseley among thirteen chiefs, and Cetshwayo is exiled.: Après sa défaite à Ulundi (4 juillet 1879), le royaume zoulou est partagé par Wolseley entre treize chefs, et Cetshwayo est exilé.
  British and Swazi troops storm Tsate, Sekhukhune’s capital, and capture him on 2 December; the Pedi kingdom falls to the Transvaal, then under British rule.: Des troupes britanniques et swazies prennent d’assaut Tsate, la capitale de Sekhukhune, et le capturent le 2 décembre ; le royaume pedi passe au Transvaal, alors sous domination britannique.
  Griqualand West is joined to the Cape Colony.: Le Griqualand occidental est rattaché à la colonie du Cap.
  Samori takes Kankan (1881) and extends his rule over the upper Niger, the Bouré gold country and the edge of the forest.: Samory prend Kankan (1881) et étend sa domination sur le haut Niger, le pays aurifère du Bouré et la lisière de la forêt.
  Vakaba Touré’s kingdom of Kabadougou (Odienné) comes under Samori’s rule.: Le royaume de Kabadougou (Odienné) de Vakaba Touré passe sous la domination de Samory.
  France groups its posts and protectorates on the Guinea coast (Boké, Boffa, Dubréka, Conakry) as the Rivières du Sud, from 1891 French Guinea.: La France regroupe ses postes et protectorats de la côte de Guinée (Boké, Boffa, Dubréka, Conakry) sous le nom de Rivières du Sud, qui deviennent en 1891 la Guinée française.
  The French parliament ratifies the treaty in which Makoko, king of the Tio, placed his lands under French protection (signed with Brazza in 1880); Brazzaville grows on the north bank of the pool.: Le Parlement français ratifie le traité par lequel Makoko, roi des Tio, avait placé ses terres sous protection française (signé avec Brazza en 1880) ; Brazzaville se développe sur la rive nord du Pool.
  The Ma Loango places Loango under French protection, and France occupies the coast.: Le Ma Loango place le Loango sous protection française, et la France occupe la côte.
  Gustav Nachtigal signs a protection treaty with Mlapa III at Togoville; the coast becomes the German protectorate of Togoland.: Gustav Nachtigal signe un traité de protection avec Mlapa III à Togoville ; la côte devient le protectorat allemand du Togoland.
  Gustav Nachtigal raises the German flag at Douala after treaties with the Duala kings (12 July 1884); Kamerun becomes a German protectorate.: Gustav Nachtigal hisse le drapeau allemand à Douala après des traités avec les rois douala (12 juillet 1884) ; le Kamerun devient un protectorat allemand.
  Germany raises its flag at Lüderitz Bay (Angra Pequena), bought by the Bremen merchant Adolf Lüderitz in 1883; the coast becomes German South West Africa.: L’Allemagne hisse son drapeau dans la baie de Lüderitz (Angra Pequena), achetée par le négociant brêmois Adolf Lüderitz en 1883 ; la côte devient le Sud-Ouest africain allemand.
  Boer volunteers who had helped Dinuzulu win the Zulu civil war take a large part of western Zululand as their reward and proclaim the New Republic (Nieuwe Republiek) at Vryheid; Britain recognises a reduced version of it in 1886.: Des volontaires boers qui avaient aidé Dinuzulu à remporter la guerre civile zouloue prennent en récompense une grande partie de l’ouest du Zoulouland et proclament la Nouvelle République (Nieuwe Republiek) à Vryheid ; la Grande-Bretagne en reconnaît une version réduite en 1886.
  Portugal, which attacked the Mutapa state in 1884, annexes its last lands in Chidima and drives Mwenemutapa Dzuda into exile. His successor Chioko leads a rising that holds much of the Tete region (1897–1902) until he is killed helping the Barue against the Portuguese.: Le Portugal, qui avait attaqué l’État du Monomotapa en 1884, annexe ses dernières terres du Chidima et contraint le Mwenemutapa Dzuda à l’exil. Son successeur Chioko mène un soulèvement qui tient une grande partie de la région de Tete (1897–1902), jusqu’à ce qu’il soit tué en aidant les Barue contre les Portugais.
  "The Cape annexes the Transkei piecemeal (1879–1894): Fingoland, Gcalekaland, Thembuland, Griqualand East and last Pondoland (1894).": "Le Cap annexe le Transkei morceau par morceau (1879–1894) : le Fingoland, le Gcalekaland, le Thembuland, le Griqualand oriental et enfin le Pondoland (1894)."
  In the treaty of Simulambuco the princes of Cabinda accept Portuguese protection.: Par le traité de Simulambuco, les princes de Cabinda acceptent la protection portugaise.
  France and the International Association of the Congo agree their border; the Berlin conference (26 February 1885) recognises King Leopold II’s Congo Free State, which claims the Congo basin, and France the lands of Gabon and the Congo north and west of it.: La France et l’Association internationale du Congo fixent leur frontière ; la conférence de Berlin (26 février 1885) reconnaît l’État indépendant du Congo du roi Léopold II, qui revendique le bassin du Congo, et reconnaît à la France les terres du Gabon et du Congo situées au nord et à l’ouest de celui-ci.
  Britain proclaims the Bechuanaland Protectorate between the Molopo and 22° S, where the Tswana kings keep much of their power; to the south Warren’s expedition has ended the Boer republics of Stellaland and Goshen.: La Grande-Bretagne proclame le protectorat du Bechuanaland entre le Molopo et la latitude 22° S, où les rois tswana conservent une grande partie de leur pouvoir ; au sud, l’expédition de Warren a mis fin aux républiques boers du Stellaland et du Goshen.
  Britain proclaims the Oil Rivers Protectorate over the Niger delta and the Cross River (Bonny, Kalabari, Brass, Opobo, Old Calabar) and the lands behind them.: La Grande-Bretagne proclame le protectorat des Oil Rivers sur le delta du Niger et la Cross River (Bonny, Kalabari, Brass, Opobo, Old Calabar) et sur leur arrière-pays.
  The land south of the Molopo becomes the crown colony of British Bechuanaland.: Les terres au sud du Molopo deviennent la colonie de la Couronne du Bechuanaland britannique.
  The treaty ending the Franco-Hova War gives France the bay of Diego-Suarez and control of Madagascar’s foreign affairs.: Le traité qui met fin à la guerre franco-hova donne à la France la baie de Diego-Suarez et le contrôle des affaires étrangères de Madagascar.
  Agreements with Britain (1885–1886) and France (December 1885) fix the coastal borders of Kamerun; Germany claims the forest and the Grassfields behind them, which it conquers over the next two decades.: Des accords avec la Grande-Bretagne (1885–1886) et la France (décembre 1885) fixent les frontières côtières du Kamerun ; l’Allemagne revendique la forêt et les Grassfields situés en arrière, qu’elle conquiert au cours des deux décennies suivantes.
  In the treaty of Kéniéba-Koura Samori gives up the left bank of the Niger and the Bouré to France; France builds a fort at Siguiri in 1888.: Par le traité de Kéniéba-Koura, Samory cède à la France la rive gauche du Niger et le Bouré ; la France construit un fort à Siguiri en 1888.
  A Franco-Portuguese convention fixes the borders of Portuguese Guinea; Portugal gives up Ziguinchor and the Casamance to France (handed over in 1888).: Une convention franco-portugaise fixe les frontières de la Guinée portugaise ; le Portugal cède Ziguinchor et la Casamance à la France (remis en 1888).
  The Royal Niger Company receives a royal charter to govern the lands along the lower Niger and Benue covered by its treaties.: La Royal Niger Company reçoit une charte royale pour gouverner les terres situées le long du bas Niger et de la Bénoué couvertes par ses traités.
  Samba Laobé Fall, the damel France had installed in 1883, is killed at Tivaouane after a quarrel with the French; France abolishes the kingship and divides Cayor into provinces. Lat Dior, who had fought the railway from Dakar to Saint-Louis, is killed at Dékheulé on 27 October.: Samba Laobé Fall, le damel que la France avait installé en 1883, est tué à Tivaouane à la suite d’une querelle avec les Français ; la France abolit la royauté et divise le Cayor en provinces. Lat Dior, qui s’était opposé au chemin de fer de Dakar à Saint-Louis, est tué à Dékheulé le 27 octobre.
  An Anglo-German agreement recognises the sultan of Zanzibar’s coastal strip and divides the mainland behind it into a British sphere in the north and a German sphere in the south; the chartered companies of both countries make treaties with local rulers, and occupation follows over the next twenty years.: Un accord anglo-allemand reconnaît la bande côtière du sultan de Zanzibar et partage l’intérieur, en arrière de celle-ci, en une sphère britannique au nord et une sphère allemande au sud ; les compagnies à charte des deux pays concluent des traités avec les souverains locaux, et l’occupation suit au cours des vingt années suivantes.
  A Portuguese–German treaty fixes the southern border of Angola; Portugal claims the lands behind its coast, which it conquers between the 1880s and 1917.: Un traité germano-portugais fixe la frontière méridionale de l’Angola ; le Portugal revendique l’arrière-pays de sa côte, qu’il conquiert entre les années 1880 et 1917.
  The Portuguese–German treaty makes the Rovuma the border between Mozambique and German East Africa.: Le traité germano-portugais fait du Rovuma la frontière entre le Mozambique et l’Afrique orientale allemande.
  The Portuguese–German treaty fixes the northern border of German South West Africa; Germany makes protection treaties with Herero and Nama leaders and claims the interior.: Le traité germano-portugais fixe la frontière septentrionale du Sud-Ouest africain allemand ; l’Allemagne conclut des traités de protection avec des chefs héréros et namas et revendique l’intérieur.
  France and the Congo Free State make the Ubangi their border; French posts spread up the river, where Bangui is founded in 1889.: La France et l’État indépendant du Congo font de l’Oubangui leur frontière ; les postes français s’échelonnent vers l’amont du fleuve, où Bangui est fondée en 1889.
  Britain annexes Zululand, except the Boer New Republic (joined to the Transvaal in 1888); Zululand is joined to Natal in 1897.: La Grande-Bretagne annexe le Zoulouland, à l’exception de la Nouvelle République boer (rattachée au Transvaal en 1888) ; le Zoulouland est rattaché au Natal en 1897.
  Mamadou Lamine Dramé, who had taken Bundu in his war with France, is killed; France takes over Bundu.: Mamadou Lamine Dramé, qui avait pris le Boundou dans sa guerre contre la France, est tué ; la France prend le contrôle du Boundou.
  The New Republic joins the South African Republic (Transvaal) as its Vryheid district.: La Nouvelle République rejoint la République sud-africaine (Transvaal), dont elle devient le district de Vryheid.
  An Anglo-French convention fixes the borders of the British Gambia, a strip along the river; Britain proclaims its protectorate over the interior in 1894.: Une convention franco-britannique fixe les frontières de la Gambie britannique, une bande de terre le long du fleuve ; la Grande-Bretagne proclame son protectorat sur l’intérieur en 1894.
  A French column enters Jolof; its burba, Alboury Ndiaye, withdraws east to join Ahmadu of the Toucouleur Empire.: Une colonne française entre dans le Djolof ; son bourba, Alboury Ndiaye, se retire vers l’est pour rejoindre Ahmadou, de l’empire toucouleur.
  Britain extends the Bechuanaland Protectorate north of 22° S, over Ngamiland and the lands to the Chobe.: La Grande-Bretagne étend le protectorat du Bechuanaland au nord de 22° S, sur le Ngamiland et les terres qui s’étendent jusqu’au Chobe.
  The Anglo-German agreement of 1890 fixes Togoland’s western border; Germany claims the Ewe uplands west and north of Lomé.: L’accord anglo-allemand de 1890 fixe la frontière occidentale du Togoland ; l’Allemagne revendique les hautes terres ewe à l’ouest et au nord de Lomé.
  The British South Africa Company’s Pioneer Column raises the flag at Fort Salisbury (Harare); the company rules Mashonaland under its charter of 1889.: La colonne des pionniers de la Compagnie britannique d’Afrique du Sud hisse le drapeau à Fort Salisbury (Harare) ; la compagnie gouverne le Mashonaland en vertu de sa charte de 1889.
  After the first Franco-Dahomean war Dahomey recognises French rule of Cotonou and the French protectorate over Porto-Novo.: Après la première guerre franco-dahoméenne, le Dahomey reconnaît la domination française sur Cotonou et le protectorat français sur Porto-Novo.
  Germany buys the sultan’s coastal strip south of the Umba, after the Abushiri revolt (1888–1890) against the German East Africa Company, which had leased it in 1888; German rule begins on 1 January 1891.: L’Allemagne achète la bande côtière du sultan au sud de l’Umba, après la révolte d’Abushiri (1888–1890) contre la Compagnie de l’Afrique orientale allemande, qui l’avait prise à bail en 1888 ; la domination allemande commence le 1er janvier 1891.
  Emin Pasha founds the German station of Bukoba; Karagwe and the Haya kingdoms come under German rule.: Emin Pacha fonde la station allemande de Bukoba ; le Karagwe et les royaumes haya passent sous domination allemande.
  France brings Baol, Sine and Saloum under its protectorate administration (1887–1894; their kings become chiefs under French rule) and ends the resistance in Futa Toro, where Abdul Bokar Kane is killed (1891).: La France place le Baol, le Sine et le Saloum sous son administration de protectorat (1887–1894 ; leurs rois deviennent des chefs sous l’autorité française) et met fin à la résistance au Fouta-Toro, où Abdoul Bokar Kane est tué (1891).
  France occupies Dinguiraye.: La France occupe Dinguiraye.
  The Luba kingdom has broken up in succession wars and raids by Swahili-Arab and Chokwe traders; Free State expeditions take over its lands (1891–1892).: Le royaume luba s’est désagrégé sous l’effet des guerres de succession et des raids de marchands swahili-arabes et tchokwe ; des expéditions de l’État indépendant du Congo s’emparent de ses terres (1891–1892).
  Lugard restores Toro under Kasagama, with British protection.: Lugard rétablit le Toro sous Kasagama, avec la protection britannique.
  An Anglo-Italian protocol makes the Juba the border between the British and Italian spheres.: Un protocole anglo-italien fait du Djouba la frontière entre les sphères britannique et italienne.
  Archinard’s column takes Kankan.: La colonne d’Archinard prend Kankan.
  Britain proclaims a protectorate over the lands west and south of Lake Malawi, the British Central Africa Protectorate (Nyasaland from 1907); the Yao chiefs and the Maseko Ngoni are conquered by 1898, and the northern Ngoni accept British rule in 1904.: La Grande-Bretagne proclame un protectorat sur les terres à l’ouest et au sud du lac Malawi, le protectorat britannique d’Afrique centrale (Nyassaland à partir de 1907) ; les chefs yao et les Ngoni maseko sont soumis en 1898, et les Ngoni du nord acceptent la domination britannique en 1904.
  A treaty between Portugal and the Congo Free State divides the old Lunda lands.: Un traité entre le Portugal et l’État indépendant du Congo partage les anciennes terres lunda.
  The Anglo-Portuguese treaty fixes the eastern border of Angola (the Barotse border is settled by arbitration in 1905).: Le traité anglo-portugais fixe la frontière orientale de l’Angola (la frontière du Barotseland est réglée par arbitrage en 1905).
  The Anglo-Portuguese treaty fixes the borders of Mozambique and the British lands north of the Zambezi, which the British South Africa Company governs. Portugal receives the Gaza lands north of the Save, which Ngungunhane had left when he moved his capital south in 1889, and conquers its interior by about 1920; the company conquers Mpezeni’s Ngoni in 1898 and brings the Bemba under its rule by 1899.: Le traité anglo-portugais fixe les frontières du Mozambique et des territoires britanniques au nord du Zambèze, que gouverne la Compagnie britannique d’Afrique du Sud. Le Portugal reçoit les terres de Gaza au nord de la Save, que Ngungunhane avait quittées en transférant sa capitale vers le sud en 1889, et achève la conquête de l’intérieur vers 1920 ; la compagnie soumet les Ngoni de Mpezeni en 1898 et place les Bemba sous sa domination en 1899.
  A Free State expedition under William Stairs kills Msiri at Bunkeya; the Yeke kingdom falls to the Congo Free State.: Une expédition de l’État indépendant conduite par William Stairs tue Msiri à Bunkeya ; le royaume yeke passe à l’État indépendant du Congo.
  Humbert’s column takes Bissandougou; Samori abandons his homeland and moves his state east, into the northern Ivory Coast (1892–1894).: La colonne de Humbert prend Bissandougou ; Samory abandonne son pays natal et déplace son État vers l’est, dans le nord de la Côte d’Ivoire (1892–1894).
  British troops defeat the Ijebu at Imagbon and occupy Ijebu-Ode.: Les troupes britanniques battent les Ijebu à Imagbon et occupent Ijebu-Ode.
  After Dodds’s capture of Abomey (17 November 1892) France annexes Ouidah and the coastal lands of Dahomey.: Après la prise d’Abomey par Dodds (17 novembre 1892), la France annexe Ouidah et les terres côtières du Dahomey.
  A Franco-Liberian treaty fixes the border between French Guinea and Liberia; the forest peoples of the south (the Kissi, Toma, Kpelle and Mano) come under French rule over the next twenty years.: Un traité franco-libérien fixe la frontière entre la Guinée française et le Liberia ; les peuples forestiers du sud (les Kissi, les Toma, les Kpellé et les Mano) passent sous domination française au cours des vingt années suivantes.
  Treaties with Britain (1885) and France (1892) fix Liberia’s borders; the government in Monrovia extends its rule over the peoples of the interior only in the early twentieth century.: Des traités avec la Grande-Bretagne (1885) et la France (1892) fixent les frontières du Liberia ; le gouvernement de Monrovia n’étend sa domination sur les peuples de l’intérieur qu’au début du XXe siècle.
  Rabih az-Zubayr conquers Bornu and destroys its capital Kukawa.: Rabah (Rabih az-Zubayr) conquiert le Bornou et détruit sa capitale, Kukawa.
  France makes the Ivory Coast a colony; treaties made by Binger and Treich-Laplène give it claims to the interior, whose peoples (the Baoulé, Bété, Guro, Dan and others) resist French rule into the 1910s.: La France fait de la Côte d’Ivoire une colonie ; les traités conclus par Binger et Treich-Laplène lui donnent des prétentions sur l’intérieur, dont les peuples (les Baoulé, les Bété, les Gouro, les Dan et d’autres) résistent à la domination française jusque dans les années 1910.
  Governor Carter’s treaties bring Ibadan, Oyo and the Ekiti and Ondo kingdoms into the British protectorate of Lagos; Ibadan accepts a British resident. The Egba keep their independence.: Les traités du gouverneur Carter font entrer Ibadan, Oyo et les royaumes ekiti et ondo dans le protectorat britannique de Lagos ; Ibadan accepte un résident britannique. Les Egba conservent leur indépendance.
  Company forces take Bulawayo; Lobengula flees and dies early in 1894, and the Ndebele kingdom falls.: Les forces de la compagnie prennent Bulawayo ; Lobengula s’enfuit et meurt au début de 1894, et le royaume ndébélé tombe.
  Samori rebuilds his state in the north of the Ivory Coast, with Dabakala as its capital.: Samory reconstitue son État dans le nord de la Côte d’Ivoire, avec Dabakala pour capitale.
  Agoli-Agbo, a brother of King Béhanzin, signs the surrender, and France makes him king of a smaller Dahomey on the Abomey plateau under a French resident; France takes the rest of the kingdom and its neighbours. Béhanzin gives himself up later in January.: Agoli-Agbo, un frère du roi Béhanzin, signe la reddition, et la France le fait roi d’un Dahomey réduit au plateau d’Abomey, sous un résident français ; la France prend le reste du royaume et ses voisins. Béhanzin se rend plus tard en janvier.
  A Franco-German protocol fixes the border between Kamerun and the French Congo; France claims the upper Sangha and the Ubangi–Shari lands.: Un protocole franco-allemand fixe la frontière entre le Kamerun et le Congo français ; la France revendique la haute Sangha et les terres de l’Oubangui-Chari.
  Britain proclaims a protectorate over Buganda, after company rule under Lugard and the civil wars of 1888–1892; the Uganda Agreement of 1900 makes Buganda a province of the protectorate under its kabaka.: La Grande-Bretagne proclame un protectorat sur le Bouganda, après le gouvernement de la compagnie sous Lugard et les guerres civiles de 1888–1892 ; l’accord d’Ouganda de 1900 fait du Bouganda une province du protectorat, sous son kabaka.
  France forms the Colony of Dahomey with Porto-Novo as its capital. King Toffa keeps his title under French rule until his death in 1908, when France makes his heir a “superior chief”.: La France forme la colonie du Dahomey, avec Porto-Novo pour capitale. Le roi Toffa conserve son titre sous l’autorité française jusqu’à sa mort en 1908, date à laquelle la France fait de son héritier un « chef supérieur ».
  Samori’s forces occupy the Gyaman kingdom (Bondoukou).: Les forces de Samory occupent le royaume du Gyaman (Bondoukou).
  France joins Senegal, French Sudan, Guinea and the Ivory Coast in the federation of French West Africa, governed from Saint-Louis and from 1902 from Dakar.: La France réunit le Sénégal, le Soudan français, la Guinée et la Côte d’Ivoire dans la fédération de l’Afrique-Occidentale française, gouvernée depuis Saint-Louis puis, à partir de 1902, depuis Dakar.
  French rule extends to the upper Gambia and the Bassari country around Kédougou, where the Bassari resist into the 1900s.: La domination française s’étend à la haute Gambie et au pays bassari autour de Kédougou, où les Bassari résistent jusque dans les années 1900.
  Britain proclaims the East Africa Protectorate, taking over from the Imperial British East Africa Company; the sultan’s coastal strip, leased to the company in 1887–1888, is governed as part of it but remains his in law until 1963.: La Grande-Bretagne proclame le protectorat de l’Afrique orientale, qui succède à l’Imperial British East Africa Company ; la bande côtière du sultan, louée à la compagnie en 1887–1888, est administrée comme une partie du protectorat mais appartient en droit au sultan jusqu’en 1963.
  British Bechuanaland is joined to the Cape Colony.: Le Bechuanaland britannique est rattaché à la colonie du Cap.
  Mouzinho de Albuquerque captures Ngungunhane at Chaimite; the Gaza Empire falls.: Mouzinho de Albuquerque capture Ngungunhane à Chaimite ; l’empire de Gaza tombe.
  A British expedition occupies Kumasi without a fight (17 January 1896) and deposes and exiles the Asantehene Prempeh I; Britain rules Asante as a protectorate under a resident.: Une expédition britannique occupe Kumasi sans combat (17 janvier 1896), dépose l’asantehene Prempeh Ier et l’exile ; la Grande-Bretagne gouverne l’Ashanti comme un protectorat, sous un résident.
  Britain extends the Uganda Protectorate over Bunyoro, Toro, Ankole, Busoga and the lands east to the Rift Valley (Kavirondo and Naivasha). Kabalega of Bunyoro fights on until his capture in 1899; the north and east are occupied over the next two decades.: La Grande-Bretagne étend le protectorat de l’Ouganda au Bounyoro, au Toro, à l’Ankole, au Busoga et aux terres situées à l’est jusqu’à la vallée du Rift (Kavirondo et Naivasha). Kabalega, du Bounyoro, poursuit la lutte jusqu’à sa capture en 1899 ; le nord et l’est sont occupés au cours des deux décennies suivantes.
  After capturing Antananarivo (30 September 1895) France annexes Madagascar as a colony; Ranavalona III is exiled in 1897, and the Menalamba rising and the resistance in the west and south are put down by about 1904.: Après la prise d’Antananarivo (30 septembre 1895), la France annexe Madagascar comme colonie ; Ranavalona III est exilée en 1897, et le soulèvement des Menalamba ainsi que la résistance dans l’ouest et le sud sont réprimés vers 1904.
  Britain proclaims a protectorate over the hinterland of Sierra Leone, whose borders it had agreed with France in 1895.: La Grande-Bretagne proclame un protectorat sur l’arrière-pays de la Sierra Leone, dont elle avait fixé les frontières avec la France en 1895.
  German troops under Tom von Prince occupy Uhehe and found the station of Iringa, after storming Kalenga, Mkwawa’s fortress, in October 1894; Mkwawa fights on until his death in 1898.: Les troupes allemandes de Tom von Prince occupent l’Uhehe et fondent la station d’Iringa, après avoir pris d’assaut Kalenga, la forteresse de Mkwawa, en octobre 1894 ; Mkwawa poursuit la lutte jusqu’à sa mort en 1898.
  French troops defeat Bokar Biro, the almamy of Futa Jallon, at Porédaka, where he is killed; France, which had entered Timbo on 3 November, installs client almamies and rules Futa Jallon as a protectorate.: Les troupes françaises battent Bokar Biro, l’almamy du Fouta-Djalon, à Porédaka, où il est tué ; la France, qui était entrée à Timbo le 3 novembre, installe des almamys qui dépendent d’elle et gouverne le Fouta-Djalon comme un protectorat.
  Mwami Yuhi V Musinga accepts German protection; Germany rules Rwanda through its king.: Le mwami Yuhi V Musinga accepte la protection allemande ; l’Allemagne gouverne le Rwanda par l’intermédiaire de son roi.
  The Royal Niger Company’s troops take Bida, capital of the Nupe emirate.: Les troupes de la Royal Niger Company prennent Bida, capitale de l’émirat du Nupe.
  The Royal Niger Company’s troops take Ilorin.: Les troupes de la Royal Niger Company prennent Ilorin.
  Congo Free State troops take Rejaf and occupy the Lado Enclave west of the upper Nile, leased to Leopold II in 1894, with the West Nile lands.: Les troupes de l’État indépendant du Congo prennent Rejaf et occupent l’enclave de Lado, à l’ouest du haut Nil, louée à Léopold II en 1894, ainsi que les terres du West Nile.
  A British expedition takes Benin City, burns it and loots the Benin Bronzes; Oba Ovonramwen is exiled.: Une expédition britannique prend Benin City, l’incendie et pille les bronzes du Bénin ; l’oba Ovonramwen est exilé.
  Samori sacks Kong, the old Dyula city, which had accepted his rule in 1895.: Samory met à sac Kong, la vieille cité dioula, qui avait accepté sa domination en 1895.
  A Franco-German convention fixes the northern borders of Togoland.: Une convention franco-allemande fixe les frontières septentrionales du Togoland.
  "The Anglo-French convention of 1898 divides Borgu: France takes Nikki, Kandi and the north of Dahomey, Britain the lands around Bussa.": "La convention franco-britannique de 1898 partage le Borgou : la France prend Nikki, Kandi et le nord du Dahomey, la Grande-Bretagne les terres autour de Boussa."
  Gouraud’s troops capture Samori at Guéléma; his state falls to France, and Samori dies in exile in Gabon in 1900.: Les troupes de Gouraud capturent Samory à Guéléma ; son État passe à la France, et Samory meurt en exil au Gabon en 1900.
  Company forces drive Kazembe X from his capital on the Luapula.: Les forces de la compagnie chassent Kazembe X de sa capitale sur le Luapula.
  After the death of the senior chief Mwamba (1898) the British South Africa Company occupies the Bemba country, ending its independence.: Après la mort du chef principal Mwamba (1898), la Compagnie britannique d’Afrique du Sud occupe le pays bemba et met fin à son indépendance.
  Dahomey becomes part of French West Africa.: Le Dahomey est intégré à l’Afrique-Occidentale française.
  An order in council brings Barotseland, whose king Lewanika had signed treaties with the British South Africa Company in 1890, into the company’s North-Western Rhodesia; the Lozi kings keep a special position until 1964.: Un ordre en conseil intègre le Barotseland, dont le roi Lewanika avait signé des traités avec la Compagnie britannique d’Afrique du Sud en 1890, à la Rhodésie du Nord-Ouest de la compagnie ; les rois lozi conservent un statut particulier jusqu’en 1964.
  Free State forces occupy the Kuba capital Nsheng (1899–1900).: Les forces de l’État indépendant occupent Nsheng, la capitale kuba (1899–1900).
  "The Royal Niger Company’s charter is revoked: its southern lands join the Niger Coast Protectorate as the Protectorate of Southern Nigeria.": "La charte de la Royal Niger Company est révoquée : ses terres du sud rejoignent le protectorat de la côte du Niger pour former le protectorat du Nigeria du Sud."
  The rest of the Company’s lands become the Protectorate of Northern Nigeria, under Frederick Lugard.: Le reste des terres de la compagnie devient le protectorat du Nigeria du Nord, sous Frederick Lugard.
  The Igala kingdom comes under the Protectorate of Northern Nigeria.: Le royaume igala passe sous l’autorité du protectorat du Nigeria du Nord.
  France deposes Agoli-Agbo and abolishes the kingdom of Dahomey.: La France dépose Agoli-Agbo et abolit le royaume du Dahomey.
  In the Treaty of Paris France recognises Spain’s claim to Río Muni on the mainland.: Par le traité de Paris, la France reconnaît la revendication espagnole sur le Río Muni, sur le continent.
  British troops take Yola, capital of the Adamawa emirate; Germany occupies its southern lamidates (Ngaoundéré, Garoua) in 1901.: Les troupes britanniques prennent Yola, capitale de l’émirat de l’Adamaoua ; l’Allemagne occupe ses lamidats méridionaux (Ngaoundéré, Garoua) en 1901.
  British columns occupy Bauchi, Gombe, Zaria and the emirates south of it, and Bornu, where Rabih’s son Fadlallah had been killed by the French (1901); the British install Shehu Abubakar Garbai as emir of Bornu. German troops take Maroua and Mandara.: Des colonnes britanniques occupent Bauchi, Gombe, Zaria et les émirats situés au sud, ainsi que le Bornou, où Fadlallah, fils de Rabah, avait été tué par les Français (1901) ; les Britanniques installent le shehu Abubakar Garbai comme émir du Bornou. Les troupes allemandes prennent Maroua et le Mandara.
  German officers reach Foumban; King Njoya of Bamum accepts German rule and keeps his throne.: Des officiers allemands atteignent Foumban ; le roi bamoun Njoya accepte la domination allemande et conserve son trône.
  Britain annexes Asante, after the War of the Golden Stool (1900), and makes the Northern Territories a protectorate, as parts of the Gold Coast (by orders of September 1901). Eastern Dagbon with Yendi had gone to German Togoland in 1899; it joins Ghana with British Togoland.: La Grande-Bretagne annexe l’Ashanti, après la guerre du Tabouret d’or (1900), et fait des Territoires du Nord un protectorat, comme parties de la Côte-de-l’Or (par des ordres de septembre 1901). Le Dagbon oriental, avec Yendi, était passé au Togoland allemand en 1899 ; il rejoint le Ghana avec le Togoland britannique.
  Uganda’s Eastern Province, with Kisumu and Naivasha, is transferred to the East Africa Protectorate, which now reaches Lake Victoria along the Uganda Railway.: La province orientale de l’Ouganda, avec Kisumu et Naivasha, est transférée au protectorat de l’Afrique orientale, qui atteint désormais le lac Victoria le long du chemin de fer de l’Ouganda.
  Musa Molo, king of Fuladu, flees to the Gambia after quarrels with the French; France takes over Fuladu.: Moussa Molo, roi du Fouladou, s’enfuit en Gambie après des querelles avec les Français ; la France prend le contrôle du Fouladou.
  Portugal crushes the Bailundo revolt (1902–1903) and occupies the Ovimbundu highlands.: Le Portugal écrase la révolte du Bailundo (1902–1903) et occupe les hauts plateaux ovimbundu.
  After the Anglo-Boer War the Vryheid and Utrecht districts are transferred from the Transvaal to Natal.: Après la guerre anglo-boer, les districts de Vryheid et d’Utrecht sont transférés du Transvaal au Natal.
  British troops take Kano; Katsina submits.: Les troupes britanniques prennent Kano ; Katsina se soumet.
  British troops take Sokoto; the caliph Attahiru I flees east and is killed at Burmi in July, and his successor accepts British rule.: Les troupes britanniques prennent Sokoto ; le calife Attahiru Ier s’enfuit vers l’est et est tué à Burmi en juillet, et son successeur accepte la domination britannique.
  After German campaigns Mwami Mwezi Gisabo of Burundi accepts German rule in the treaty of Kiganda.: Après des campagnes allemandes, le mwami Mwezi Gisabo du Burundi accepte la domination allemande par le traité de Kiganda.
  The Colony and Protectorate of Lagos is merged with Southern Nigeria.: La colonie et protectorat de Lagos est fusionnée avec le Nigeria du Sud.
  Captain Kurt Streitwolf founds Schuckmannsburg and takes over the Caprivi Strip for German South West Africa, which had received it in the Anglo-German agreement of 1890 as a corridor to the Zambezi; until then the Lozi kingdom had ruled it.: Le capitaine Kurt Streitwolf fonde Schuckmannsburg et prend possession de la bande de Caprivi pour le Sud-Ouest africain allemand, qui l’avait reçue par l’accord anglo-allemand de 1890 comme couloir d’accès au Zambèze ; jusque-là, le royaume lozi la gouvernait.
  Portugal completes its occupation of Matamba and Kasanje on the Kwango.: Le Portugal achève son occupation du Matamba et du Kasanje, sur le Kwango.
  An Anglo-German-Belgian convention fixes the borders around the Virunga volcanoes; Kigezi becomes part of Uganda.: Une convention anglo-germano-belge fixe les frontières autour des volcans Virunga ; le Kigezi est rattaché à l’Ouganda.
  The Cape, Natal, the Transvaal and the Orange River Colony unite as the Union of South Africa, a self-governing dominion ruled by its white minority.: Le Cap, le Natal, le Transvaal et la colonie de la rivière Orange s’unissent pour former l’Union sud-africaine, dominion autonome gouverné par sa minorité blanche.
  French troops kill al-Sanusi at Ndélé and end Dar al-Kuti.: Les troupes françaises tuent al-Sanusi à Ndélé et mettent fin au Dar el-Kouti.
  In the Morocco–Congo treaty France gives Germany two strips of the French Congo, Neukamerun, reaching the Congo and the Ubangi; German rule begins in 1912. Only the provinces that lay mostly within it are shown.: Par le traité franco-allemand sur le Maroc et le Congo, la France cède à l’Allemagne deux bandes du Congo français, le Neukamerun, qui atteignent le Congo et l’Oubangui ; la domination allemande commence en 1912. Seules les provinces situées en majeure partie dans ce territoire sont représentées.
  France annexes the Comoro sultanates of Grande Comore, Anjouan and Mohéli, its protectorates since 1886, as a colony under the governor-general of Madagascar; from 1914 the islands are a province of Madagascar. Mayotte, French since 1841, is not shown.: La France annexe les sultanats comoriens de Grande Comore, d’Anjouan et de Mohéli, ses protectorats depuis 1886, comme colonie placée sous l’autorité du gouverneur général de Madagascar ; à partir de 1914, les îles forment une province de Madagascar. Mayotte, française depuis 1841, n’est pas représentée.
  After the Kongo revolt of 1913–1914 Portugal abolishes the Kingdom of Kongo, its vassal since 1857.: Après la révolte kongo de 1913–1914, le Portugal abolit le royaume du Kongo, son vassal depuis 1857.
  Lugard joins Northern and Southern Nigeria as the Colony and Protectorate of Nigeria.: Lugard réunit le Nigeria du Nord et le Nigeria du Sud dans la colonie et protectorat du Nigeria.
  West Nile is transferred from the Sudan to Uganda.: Le West Nile est transféré du Soudan à l’Ouganda.
  After unrest in Abeokuta the British end the Egba’s independence and join their land to Nigeria.: Après des troubles à Abeokuta, les Britanniques mettent fin à l’indépendance des Egba et rattachent leur territoire au Nigeria.
  Portuguese troops defeat the Kwanyama under King Mandume at Mongua and occupy the Ovambo lands of southern Angola.: Les troupes portugaises battent les Kwanyama du roi Mandume à Mongua et occupent les terres ovambos du sud de l’Angola.
  King Mandume of the Kwanyama is killed fighting South African troops, and South Africa takes over the Ovambo kingdoms.: Le roi Mandume des Kwanyama est tué en combattant les troupes sud-africaines, et l’Afrique du Sud prend le contrôle des royaumes ovambos.
  With the Treaty of Versailles, Togoland, conquered by British and French troops in August 1914, is divided into British and French League of Nations mandates.: Par le traité de Versailles, le Togoland, conquis par les troupes britanniques et françaises en août 1914, est partagé en mandats britannique et français de la Société des Nations.
  With the Treaty of Versailles, Kamerun, conquered by British, French and Belgian troops in 1914–1916, is divided into British and French League of Nations mandates. Northern Cameroons, the northern part of the British mandate, ran along the Nigerian border and joined Nigeria in 1961; it is not shown.: Par le traité de Versailles, le Kamerun, conquis par les troupes britanniques, françaises et belges en 1914–1916, est partagé en mandats britannique et français de la Société des Nations. Le Cameroun septentrional, partie nord du mandat britannique, longeait la frontière nigériane et a rejoint le Nigeria en 1961 ; il n’est pas représenté.
  With the Treaty of Versailles, Neukamerun, retaken in 1914–1916, returns to French Equatorial Africa.: Par le traité de Versailles, le Neukamerun, repris en 1914–1916, revient à l’Afrique-Équatoriale française.
  "With the Treaty of Versailles, German East Africa, conquered in 1916–1917, is divided: Britain receives Tanganyika and Belgium Ruanda-Urundi as League of Nations mandates.": "Par le traité de Versailles, l’Afrique orientale allemande, conquise en 1916–1917, est partagée : la Grande-Bretagne reçoit le Tanganyika et la Belgique le Ruanda-Urundi comme mandats de la Société des Nations."
  With the Treaty of Versailles, German South West Africa, conquered by South African troops in 1915, becomes a League of Nations mandate under South Africa.: Par le traité de Versailles, le Sud-Ouest africain allemand, conquis par les troupes sud-africaines en 1915, devient un mandat de la Société des Nations confié à l’Afrique du Sud.
  Walvis Bay, which stays South African territory in law, is governed as part of the South West Africa mandate (1922–1977).: Walvis Bay, qui reste en droit un territoire sud-africain, est administrée comme une partie du mandat du Sud-Ouest africain (1922–1977).
  "Company rule ends south of the Zambezi: Southern Rhodesia becomes a self-governing British colony, ruled by its white settlers.": "Le gouvernement de la compagnie prend fin au sud du Zambèze : la Rhodésie du Sud devient une colonie britannique autonome, gouvernée par ses colons blancs."
  Northern Rhodesia becomes a British protectorate.: La Rhodésie du Nord devient un protectorat britannique.
  Britain joins Southern Rhodesia, Northern Rhodesia and Nyasaland in the Federation of Rhodesia and Nyasaland, against the opposition of most Africans.: La Grande-Bretagne réunit la Rhodésie du Sud, la Rhodésie du Nord et le Nyassaland dans la fédération de Rhodésie et du Nyassaland, malgré l’opposition de la plupart des Africains.
  After a plebiscite in May 1956, British Togoland joins the Gold Coast, which becomes independent as Ghana on 6 March 1957.: Après un plébiscite en mai 1956, le Togoland britannique rejoint la Côte-de-l’Or, qui devient indépendante sous le nom de Ghana le 6 mars 1957.
  Guinea votes no in de Gaulle’s referendum on the French Community and becomes independent under Ahmed Sékou Touré.: La Guinée vote non au référendum du général de Gaulle sur la Communauté française et devient indépendante sous la direction d’Ahmed Sékou Touré.
  Senegal and French Sudan become independent together as the Mali Federation.: Le Sénégal et le Soudan français accèdent ensemble à l’indépendance sous le nom de fédération du Mali.
  The Belgian Congo becomes independent as the Republic of the Congo, with Patrice Lumumba as prime minister; within weeks the army mutinies and Katanga and South Kasai secede.: Le Congo belge accède à l’indépendance sous le nom de République du Congo, avec Patrice Lumumba comme Premier ministre ; en quelques semaines, l’armée se mutine, et le Katanga et le Sud-Kasaï font sécession.
  Dahomey becomes independent.: Le Dahomey devient indépendant.
  Côte d’Ivoire becomes independent under Félix Houphouët-Boigny.: La Côte d’Ivoire devient indépendante sous la direction de Félix Houphouët-Boigny.
  The Central African Republic (Ubangi-Shari) becomes independent.: La République centrafricaine (Oubangui-Chari) devient indépendante.
  The Republic of the Congo (Middle Congo) becomes independent.: La République du Congo (Moyen-Congo) devient indépendante.
  Gabon becomes independent.: Le Gabon devient indépendant.
  Senegal leaves the Mali Federation.: Le Sénégal quitte la fédération du Mali.
  After a UN plebiscite Southern Cameroons joins the Republic of Cameroon as a federated state.: Après un plébiscite organisé par l’ONU, le Cameroun méridional rejoint la République du Cameroun comme État fédéré.
  Rwanda, a republic since the revolution of 1959–1961, and the kingdom of Burundi become independent.: Le Rwanda, république depuis la révolution de 1959–1961, et le royaume du Burundi deviennent indépendants.
  The Federation of Rhodesia and Nyasaland is dissolved; Malawi and Zambia become independent in 1964, while Southern Rhodesia’s white government declares independence as Rhodesia in 1965.: La fédération de Rhodésie et du Nyassaland est dissoute ; le Malawi et la Zambie deviennent indépendants en 1964, tandis que le gouvernement blanc de la Rhodésie du Sud proclame l’indépendance sous le nom de Rhodésie en 1965.
  After the revolution of January 1964 that overthrew the sultan, Zanzibar unites with Tanganyika as Tanzania.: Après la révolution de janvier 1964 qui a renversé le sultan, Zanzibar s’unit au Tanganyika pour former la Tanzanie.
  South Africa returns Walvis Bay to its Cape Province.: L’Afrique du Sud rattache de nouveau Walvis Bay à sa province du Cap.
  South Africa hands Walvis Bay to Namibia.: L’Afrique du Sud remet Walvis Bay à la Namibie.
  "North America and the Caribbean about 800. In Mesoamerica the Classic Maya city-states of the southern lowlands are close to their collapse, while the cities of northern Yucatán flourish; Monte Albán, the old Zapotec capital in the valley of Oaxaca, is in decline, and central Mexico is divided among the cities that rose after the fall of Teotihuacan, such as Xochicalco and Cacaxtla. North of Mexico, farming peoples live in the river valleys of the East and the Southwest, and hunting, fishing and gathering peoples across the rest of the continent; the Caribbean islands are home to the ancestors of the Taíno. Only the Mesoamerican states are shown on the map: the Native nations north of Mexico appear in the wars they fought.": "L’Amérique du Nord et les Caraïbes vers 800. En Mésoamérique, les cités-États mayas classiques des basses terres du sud sont proches de leur effondrement, tandis que les cités du nord du Yucatán prospèrent ; Monte Albán, l’ancienne capitale zapotèque de la vallée d’Oaxaca, est en déclin, et le centre du Mexique est partagé entre les cités qui se sont élevées après la chute de Teotihuacan, comme Xochicalco et Cacaxtla. Au nord du Mexique, des peuples d’agriculteurs vivent dans les vallées fluviales de l’Est et du Sud-Ouest, et des peuples de chasseurs, de pêcheurs et de cueilleurs dans le reste du continent ; les îles des Caraïbes sont habitées par les ancêtres des Taïnos. Seuls les États mésoaméricains sont représentés sur la carte : les nations amérindiennes au nord du Mexique apparaissent dans les guerres qu’elles ont menées."
  About 900 Chichen Itza becomes the leading power of northern Yucatán. In the southern lowlands most of the great Classic cities, among them Palenque and Calakmul, have been abandoned or are in decline.: Vers 900, Chichén Itzá devient la principale puissance du nord du Yucatán. Dans les basses terres du sud, la plupart des grandes cités classiques, parmi lesquelles Palenque et Calakmul, ont été abandonnées ou sont en déclin.
  About 950 Tula, the capital of the Toltecs in Hidalgo, rises to dominate the north of central Mexico.: Vers 950, Tula, la capitale des Toltèques dans l’Hidalgo, prend son essor et domine le nord du Mexique central.
  By about 950 Mixtec kingdoms such as Tilantongo dominate the Mixteca of western Oaxaca, while Zapotec kingdoms hold the valley of Oaxaca and the isthmus.: Vers 950, des royaumes mixtèques comme Tilantongo dominent la Mixteca de l’ouest de l’Oaxaca, tandis que des royaumes zapotèques tiennent la vallée d’Oaxaca et l’isthme.
  By about 1100 Chichen Itza has declined as a regional power, and northern Yucatán is divided among smaller Maya cities.: Vers 1100, Chichén Itzá a perdu son rang de puissance régionale, et le nord du Yucatán est partagé entre des cités mayas plus petites.
  About 1150 Tula is sacked and abandoned, and the Toltec state breaks up. Over the next two centuries peoples from the north, among them the Mexica, move into the valley of Mexico.: Vers 1150, Tula est mise à sac et abandonnée, et l’État toltèque se désagrège. Au cours des deux siècles suivants, des peuples venus du nord, parmi lesquels les Mexicas, s’installent dans la vallée de Mexico.
  From the 1220s Mayapan is the capital of a league that rules most of northern Yucatán.: À partir des années 1220, Mayapán est la capitale d’une ligue qui domine la plus grande partie du nord du Yucatán.
  "By about 1350 Tariácuri has united the towns around Lake Pátzcuaro: the Purépecha (Tarascan) state, which by 1450 rules most of Michoacán. In the highlands east of the valley of Mexico the Tlaxcaltecs found the towns that form the confederation of Tlaxcala.": "Vers 1350, Tariácuri a uni les villes des bords du lac de Pátzcuaro : c’est l’État purépecha (tarasque), qui domine dès 1450 la plus grande partie du Michoacán. Sur les hautes terres à l’est de la vallée de Mexico, les Tlaxcaltèques fondent les villes qui forment la confédération de Tlaxcala."
  Under Tezozomoc (about 1370–1426) the Tepanec city of Azcapotzalco becomes the dominant power in the valley of Mexico, with the Mexica of Tenochtitlan among its tributaries and allies.: Sous Tezozomoc (vers 1370–1426), la cité tépanèque d’Azcapotzalco devient la puissance dominante de la vallée de Mexico ; les Mexicas de Tenochtitlan comptent parmi ses tributaires et ses alliés.
  About 1395 the Tepanecs and their allies conquer the Otomí kingdom of Xaltocan, in the north of the valley, and extend their rule into the Otomí lands around Tula; Metztitlán in the mountains beyond stays independent.: Vers 1395, les Tépanèques et leurs alliés conquièrent le royaume otomi de Xaltocan, dans le nord de la vallée, et étendent leur domination aux terres otomis autour de Tula ; Metztitlán, dans les montagnes au-delà, reste indépendante.
  Tenochtitlan, Texcoco and Tlacopan defeat Azcapotzalco and form the Triple Alliance, the Aztec Empire.: Tenochtitlan, Texcoco et Tlacopan battent Azcapotzalco et forment la Triple Alliance, l’Empire aztèque.
  By 1440 the Triple Alliance has conquered the Tlahuica of Morelos, around Cuauhnahuac (Cuernavaca).: Dès 1440, la Triple Alliance a conquis les Tlahuicas du Morelos, autour de Cuauhnahuac (Cuernavaca).
  Mayapan is destroyed in a revolt, and northern Yucatán breaks up into about sixteen rival Maya provinces.: Mayapán est détruite lors d’une révolte, et le nord du Yucatán se divise en quelque seize provinces mayas rivales.
  About 1458 Moctezuma I conquers Coixtlahuaca and brings much of the Mixteca under Aztec rule; the coastal Mixtec kingdom of Tututepec stays independent.: Vers 1458, Moctezuma Ier conquiert Coixtlahuaca et place une grande partie de la Mixteca sous la domination aztèque ; le royaume mixtèque côtier de Tututepec reste indépendant.
  The Triple Alliance conquers the Gulf coast around Cotaxtla and the Totonac towns of central Veracruz.: La Triple Alliance conquiert la côte du golfe autour de Cotaxtla et les cités totonaques du centre du Veracruz.
  Tepeaca and the south of Puebla fall to the Triple Alliance; Cholula and Huejotzingo, like Tlaxcala, stay independent.: Tepeaca et le sud de Puebla tombent aux mains de la Triple Alliance ; Cholula et Huejotzingo, comme Tlaxcala, restent indépendantes.
  By about 1490 the Triple Alliance rules most of Guerrero. Ahuitzotl’s armies reach the Pacific coast near Acapulco in the late 1490s, but the Yopi country stays independent.: Vers 1490, la Triple Alliance domine la plus grande partie du Guerrero. Les armées d’Ahuitzotl atteignent la côte pacifique près d’Acapulco à la fin des années 1490, mais le pays yopi reste indépendant.
  The Spaniards found Santo Domingo, the first capital of their empire in the Americas, and subdue the Taíno chiefdoms of Hispaniola; the last, Jaragua and Higüey, are crushed in 1503–1504.: Les Espagnols fondent Santo Domingo, première capitale de leur empire dans les Amériques, et soumettent les chefferies taïnos d’Hispaniola ; les dernières, le Jaragua et le Higüey, sont écrasées en 1503–1504.
  Juan Ponce de León lands on Puerto Rico, founds Caparra and begins the conquest of the island.: Juan Ponce de León débarque à Porto Rico, fonde Caparra et entreprend la conquête de l’île.
  Juan de Esquivel begins the Spanish settlement of Jamaica.: Juan de Esquivel commence la colonisation espagnole de la Jamaïque.
  Diego Velázquez lands at Baracoa and begins the conquest of Cuba.: Diego Velázquez débarque à Baracoa et entreprend la conquête de Cuba.
  Tenochtitlan falls to Hernán Cortés and his Tlaxcalan and other Native allies after a siege of nearly three months. The Aztec Empire passes to Spain, and New Spain is built on its ruins; Tlaxcala keeps privileges as an ally.: Tenochtitlan tombe aux mains d’Hernán Cortés et de ses alliés tlaxcaltèques et autres alliés autochtones après un siège de près de trois mois. L’Empire aztèque passe à l’Espagne, et la Nouvelle-Espagne se construit sur ses ruines ; Tlaxcala conserve des privilèges en tant qu’alliée.
  The Tarascan king Tangáxuan II submits to the Spaniards, and expeditions under Francisco de Orozco and Pedro de Alvarado subdue the Zapotec and Mixtec lords of Oaxaca.: Le roi tarasque Tangáxuan II fait sa soumission aux Espagnols, et des expéditions menées par Francisco de Orozco et Pedro de Alvarado soumettent les seigneurs zapotèques et mixtèques de l’Oaxaca.
  Gonzalo de Sandoval founds Colima.: Gonzalo de Sandoval fonde Colima.
  Spanish settlers take possession of Curaçao, Aruba and Bonaire.: Des colons espagnols prennent possession de Curaçao, d’Aruba et de Bonaire.
  Diego de Mazariegos founds Villa Real (San Cristóbal de las Casas) and completes the conquest of highland Chiapas.: Diego de Mazariegos fonde Villa Real (San Cristóbal de las Casas) et achève la conquête des hautes terres du Chiapas.
  Francisco de Montejo subdues the Chontal Maya of Tabasco.: Francisco de Montejo soumet les Mayas chontales du Tabasco.
  Nuño de Guzmán conquers the west of Mexico, which becomes the kingdom of New Galicia, and founds Culiacán; north of the valley of Mexico the Otomí lord Conín, an ally of the Spaniards, founds Querétaro.: Nuño de Guzmán conquiert l’ouest du Mexique, qui devient le royaume de Nouvelle-Galice, et fonde Culiacán ; au nord de la vallée de Mexico, le seigneur otomi Conín, allié des Espagnols, fonde Querétaro.
  Francisco de Montejo the Younger founds San Francisco de Campeche.: Francisco de Montejo le Jeune fonde San Francisco de Campeche.
  Montejo the Younger founds Mérida on the ruins of the Maya city of T’ho, and the Maya provinces of the north-west submit; a great Maya revolt in the east is crushed in 1546–1547. On the northern frontier San Miguel is founded in the lands of the Chichimecs.: Montejo le Jeune fonde Mérida sur les ruines de la cité maya de T’ho, et les provinces mayas du nord-ouest se soumettent ; une grande révolte maya dans l’est est écrasée en 1546–1547. Sur la frontière nord, San Miguel est fondée sur les terres des Chichimèques.
  The campaign of the Pachecos takes Bacalar in the south-east of Yucatán, where Gaspar Pacheco founds the Spanish town of Salamanca de Bacalar in 1545; the forests of the interior stay largely outside Spanish control.: La campagne des Pacheco aboutit à la prise de Bacalar, dans le sud-est du Yucatán, où Gaspar Pacheco fonde en 1545 la ville espagnole de Salamanca de Bacalar ; les forêts de l’intérieur restent en grande partie hors du contrôle espagnol.
  Silver is found at Zacatecas. The mining towns spread north into the lands of the Chichimecs, who fight the Spaniards from 1550 to about 1590.: De l’argent est découvert à Zacatecas. Les villes minières s’étendent vers le nord, sur les terres des Chichimèques, qui combattent les Espagnols de 1550 à 1590 environ.
  Francisco de Ibarra founds Durango as the capital of New Vizcaya.: Francisco de Ibarra fonde Durango, capitale de la Nouvelle-Biscaye.
  "Pedro Menéndez de Avilés founds St Augustine and destroys the French Huguenot colony of Fort Caroline: Spanish Florida.": "Pedro Menéndez de Avilés fonde Saint-Augustin et détruit Fort Caroline, la colonie des huguenots français : c’est la Floride espagnole."
  Santa Bárbara, the first Spanish mining town in Chihuahua, is founded.: Fondation de Santa Bárbara, la première ville minière espagnole du Chihuahua.
  Aguascalientes is founded as a way station on the silver road.: Aguascalientes est fondée comme relais sur la route de l’argent.
  Saltillo is founded in Coahuila.: Saltillo est fondée dans le Coahuila.
  After the Chichimec War, San Luis Potosí is founded at the new silver mines of Cerro de San Pedro.: Après la guerre chichimèque, San Luis Potosí est fondée auprès des nouvelles mines d’argent du Cerro de San Pedro.
  Antonio de Berrío founds San José de Oruña, the first Spanish town on Trinidad.: Antonio de Berrío fonde San José de Oruña, la première ville espagnole de la Trinité.
  Diego de Montemayor founds Monterrey.: Diego de Montemayor fonde Monterrey.
  Juan de Oñate leads settlers up the Rio Grande and founds the province of New Mexico among the Pueblos, with its first capital at San Juan de los Caballeros; Santa Fe follows in about 1610.: Juan de Oñate conduit des colons en remontant le Rio Grande et fonde la province du Nouveau-Mexique parmi les Pueblos, avec pour première capitale San Juan de los Caballeros ; Santa Fe suit vers 1610.
  Pierre Dugua de Mons and Samuel de Champlain found Port-Royal, the first lasting settlement of French Acadia.: Pierre Dugua de Mons et Samuel de Champlain fondent Port-Royal, le premier établissement durable de l’Acadie française.
  The Virginia Company founds Jamestown, the first lasting English settlement in North America.: La Compagnie de Virginie fonde Jamestown, le premier établissement anglais durable en Amérique du Nord.
  Samuel de Champlain founds Quebec, the centre of New France on the St Lawrence.: Samuel de Champlain fonde Québec, le centre de la Nouvelle-France sur le Saint-Laurent.
  John Guy founds the English colony of Cupids on Conception Bay in Newfoundland, whose fishing grounds English, French, Portuguese and Basque fishermen had used for a century.: John Guy fonde la colonie anglaise de Cupids, dans la baie de la Conception, à Terre-Neuve, dont les pêcheurs anglais, français, portugais et basques fréquentaient les zones de pêche depuis un siècle.
  English settlers arrive in Bermuda, where the Virginia Company’s ship Sea Venture was wrecked in 1609.: Des colons anglais arrivent aux Bermudes, où le Sea Venture, navire de la Compagnie de Virginie, avait fait naufrage en 1609.
  Jesuit missions among the Mayo and the Yaqui bring southern Sonora under Spanish rule.: Les missions jésuites chez les Mayos et les Yaquis font passer le sud du Sonora sous la domination espagnole.
  The Pilgrims of the Mayflower found Plymouth; the Massachusetts Bay Colony follows at Boston in 1630.: Les Pères pèlerins du Mayflower fondent Plymouth ; la colonie de la baie du Massachusetts suit à Boston en 1630.
  English fishing and trading settlements begin on the Piscataqua and the coast of Maine.: Des établissements anglais de pêche et de traite apparaissent sur la Piscataqua et sur la côte du Maine.
  "The Dutch West India Company settles Fort Orange (Albany), and in 1625–1626 New Amsterdam on Manhattan: New Netherland.": "La Compagnie néerlandaise des Indes occidentales établit Fort Orange (Albany), puis, en 1625–1626, la Nouvelle-Amsterdam sur l’île de Manhattan : c’est la Nouvelle-Néerlande."
  Thomas Warner founds the first English colony in the Caribbean on St Kitts.: Thomas Warner fonde la première colonie anglaise des Caraïbes à Saint-Christophe.
  English settlers land on Barbados.: Des colons anglais débarquent à la Barbade.
  "The English and the French, who arrived under Pierre Belain d’Esnambuc in 1625, partition St Kitts: the French take the two ends of the island.": "Les Anglais et les Français, arrivés en 1625 sous la conduite de Pierre Belain d’Esnambuc, se partagent Saint-Christophe : les Français prennent les deux extrémités de l’île."
  English settlers from St Kitts settle Nevis.: Des colons anglais venus de Saint-Christophe s’établissent à Niévès.
  Charles Daniel builds a French fort at Sainte-Anne on Cape Breton Island.: Charles Daniel construit un fort français à Sainte-Anne, sur l’île du Cap-Breton.
  Dutch settlers found Pavonia on the west bank of the Hudson; New Netherland claims the land between the Hudson and the Delaware.: Des colons néerlandais fondent Pavonia sur la rive ouest de l’Hudson ; la Nouvelle-Néerlande revendique les terres situées entre l’Hudson et la Delaware.
  Charles de La Tour builds Fort Sainte-Marie at the mouth of the Saint John River.: Charles de La Tour construit le fort Sainte-Marie à l’embouchure du fleuve Saint-Jean.
  William Claiborne of Virginia sets up a trading post on Kent Island in Chesapeake Bay; in 1634 Leonard Calvert founds St Mary’s City in the new proprietary colony of Maryland.: William Claiborne, de Virginie, établit un comptoir sur l’île Kent, dans la baie de Chesapeake ; en 1634, Leonard Calvert fonde St Mary’s City dans la nouvelle colonie propriétaire du Maryland.
  English settlers from St Kitts settle Antigua and Montserrat, where many of the first colonists are Irish.: Des colons anglais venus de Saint-Christophe s’établissent à Antigua et à Montserrat, où beaucoup des premiers colons sont irlandais.
  Traders from Plymouth build a post at Windsor, the first English settlement in Connecticut; Puritans from Massachusetts follow to Wethersfield and Hartford in 1634–1636.: Des marchands de Plymouth construisent un poste à Windsor, le premier établissement anglais du Connecticut ; des puritains du Massachusetts les suivent à Wethersfield et à Hartford en 1634–1636.
  The Spanish garrison of Curaçao surrenders to a Dutch West India Company fleet under Johannes van Walbeeck; the Dutch take Aruba and Bonaire in 1636.: La garnison espagnole de Curaçao se rend à une flotte de la Compagnie néerlandaise des Indes occidentales commandée par Johannes van Walbeeck ; les Néerlandais prennent Aruba et Bonaire en 1636.
  French settlers land on Guadeloupe.: Des colons français débarquent en Guadeloupe.
  Pierre Belain d’Esnambuc founds Saint-Pierre on Martinique.: Pierre Belain d’Esnambuc fonde Saint-Pierre, en Martinique.
  Roger Williams, banished from Massachusetts, founds Providence.: Roger Williams, banni du Massachusetts, fonde Providence.
  The Dutch settle Sint Eustatius, and Saba a few years later.: Les Néerlandais s’établissent à Saint-Eustache, puis à Saba quelques années plus tard.
  "Peter Minuit lands the first Swedish colonists, who found Fort Christina (Wilmington) on the Delaware: New Sweden.": "Peter Minuit débarque les premiers colons suédois, qui fondent Fort Christina (Wilmington) sur la Delaware : c’est la Nouvelle-Suède."
  Governor Johan Printz moves the seat of New Sweden to Tinicum Island, in what is now Pennsylvania, where Swedish and Finnish settlers farm along the Delaware.: Le gouverneur Johan Printz transfère le siège de la Nouvelle-Suède sur l’île Tinicum, dans l’actuelle Pennsylvanie, où des colons suédois et finlandais cultivent les terres le long de la Delaware.
  The Eleutheran Adventurers, Puritans from Bermuda, settle Eleuthera in the Bahamas; French settlers from St Kitts settle St Barthélemy, and Dutch settlers Tortola.: Les Aventuriers d’Eleuthera (Eleutheran Adventurers), des puritains venus des Bermudes, s’établissent à Eleuthera, aux Bahamas ; des colons français venus de Saint-Christophe s’établissent à Saint-Barthélemy, et des colons néerlandais à Tortola.
  By the Treaty of Concordia the French and the Dutch partition St Martin.: Par le traité de Concordia, les Français et les Néerlandais se partagent Saint-Martin.
  Jacques Dyel du Parquet, governor of Martinique, founds a French settlement on Grenada.: Jacques Dyel du Parquet, gouverneur de la Martinique, fonde un établissement français à la Grenade.
  English settlers settle Anguilla; the French take St Croix from the Spaniards.: Des colons anglais s’établissent à Anguilla ; les Français prennent Sainte-Croix aux Espagnols.
  French settlers from Martinique settle St Lucia.: Des colons français venus de la Martinique s’établissent à Sainte-Lucie.
  The Order of Saint John, the Knights of Malta, buys the French part of St Kitts, St Barthélemy, St Martin and St Croix; it sells them to the French West India Company in 1665.: L’ordre de Saint-Jean (les chevaliers de Malte) achète la partie française de Saint-Christophe, Saint-Barthélemy, Saint-Martin et Sainte-Croix ; il les revend à la Compagnie française des Indes occidentales en 1665.
  The Duchy of Courland founds New Courland on Tobago.: Le duché de Courlande fonde la Nouvelle-Courlande sur Tobago.
  An English expedition under Robert Sedgwick takes Port-Royal and the French forts on the Saint John; England holds Acadia until 1670.: Une expédition anglaise menée par Robert Sedgwick prend Port-Royal et les forts français du Saint-Jean ; l’Angleterre tient l’Acadie jusqu’en 1670.
  An English expedition sent by Oliver Cromwell takes Jamaica from Spain.: Une expédition anglaise envoyée par Oliver Cromwell prend la Jamaïque à l’Espagne.
  Peter Stuyvesant takes Fort Christina, and New Sweden becomes part of New Netherland.: Peter Stuyvesant prend Fort Christina, et la Nouvelle-Suède est rattachée à la Nouvelle-Néerlande.
  The Dutch take Tobago from Courland.: Les Néerlandais prennent Tobago à la Courlande.
  Charles II grants Carolina to eight Lords Proprietors; settlers from Virginia are already farming around Albemarle Sound.: Charles II concède la Caroline à huit lords propriétaires ; des colons venus de Virginie cultivent déjà les terres autour du détroit d’Albemarle.
  An English fleet takes New Amsterdam, which is renamed New York; all of New Netherland, with the former New Sweden on the Delaware, becomes English.: Une flotte anglaise prend la Nouvelle-Amsterdam, rebaptisée New York ; toute la Nouvelle-Néerlande, avec l’ancienne Nouvelle-Suède sur la Delaware, devient anglaise.
  The Order of Saint John sells its islands to the French West India Company.: L’ordre de Saint-Jean vend ses îles à la Compagnie française des Indes occidentales.
  Bertrand d’Ogeron becomes the French governor of Tortuga and the coast of Saint-Domingue, the buccaneer settlements in western Hispaniola.: Bertrand d’Ogeron devient gouverneur français de la Tortue et de la côte de Saint-Domingue, les établissements de boucaniers de l’ouest d’Hispaniola.
  Settlers from Bermuda settle New Providence, which soon becomes the centre of the Bahamas.: Des colons venus des Bermudes s’établissent à New Providence, qui devient bientôt le centre des Bahamas.
  A French officer claims St Pierre and Miquelon, where a few French fishermen live all year; the small settlement grows with support from the French colony of Plaisance in Newfoundland.: Un officier français revendique Saint-Pierre-et-Miquelon, où vivent toute l’année quelques pêcheurs français ; le petit établissement se développe avec le soutien de la colonie française de Plaisance, à Terre-Neuve.
  The Bahamas are granted to the Lords Proprietors of Carolina.: Les Bahamas sont concédées aux lords propriétaires de la Caroline.
  "English settlers from Barbados and England found Charles Town (Charleston): South Carolina.": "Des colons venus de la Barbade et d’Angleterre fondent Charles Town (Charleston) : c’est la Caroline du Sud."
  Charles II grants the Hudson’s Bay Company all the lands draining into Hudson Bay, which are named Rupert’s Land.: Charles II concède à la Compagnie de la baie d’Hudson toutes les terres dont les eaux s’écoulent vers la baie d’Hudson, qui reçoivent le nom de Terre de Rupert.
  Under the Treaty of Breda (1667) England hands Acadia back to France; the new governor, Hector d’Andigné de Grandfontaine, takes over the forts between July and September.: En vertu du traité de Breda (1667), l’Angleterre rend l’Acadie à la France ; le nouveau gouverneur, Hector d’Andigné de Grandfontaine, prend possession des forts entre juillet et septembre.
  By the Treaty of Madrid Spain recognises English rule in Jamaica and the Cayman Islands.: Par le traité de Madrid, l’Espagne reconnaît la domination anglaise sur la Jamaïque et les îles Caïmans.
  At Sault Ste. Marie, Simon-François Daumont de Saint-Lusson claims the Great Lakes and the lands beyond for Louis XIV before an assembly of Native nations.: À Sault-Sainte-Marie, Simon-François Daumont de Saint-Lusson revendique les Grands Lacs et les terres situées au-delà au nom de Louis XIV, devant une assemblée de nations amérindiennes.
  The Danish West India Company settles St Thomas; the English take Tortola from the Dutch.: La Compagnie danoise des Indes occidentales s’établit à Saint-Thomas ; les Anglais prennent Tortola aux Néerlandais.
  A French fleet under the comte d’Estrées takes Tobago and destroys the Dutch settlement; the island is left almost empty and is later declared neutral.: Une flotte française commandée par le comte d’Estrées prend Tobago et détruit l’établissement néerlandais ; l’île, laissée presque vide, est plus tard déclarée neutre.
  The English colonise Barbuda.: Les Anglais colonisent Barbuda.
  The Pueblo Revolt, led by Popé, drives the Spaniards out of New Mexico; they withdraw to El Paso. The Hopi in the west never come back under Spanish rule.: La révolte des Pueblos, menée par Popé, chasse les Espagnols du Nouveau-Mexique ; ils se replient sur El Paso. Les Hopis, à l’ouest, ne repassent jamais sous la domination espagnole.
  Salt rakers from Bermuda begin working the Turks Islands.: Des récolteurs de sel venus des Bermudes commencent à exploiter les îles Turques.
  Charles II grants Pennsylvania to William Penn, who founds Philadelphia in 1682.: Charles II concède la Pennsylvanie à William Penn, qui fonde Philadelphie en 1682.
  René-Robert Cavelier de La Salle reaches the mouth of the Mississippi and claims its whole basin for France as Louisiana.: René-Robert Cavelier de La Salle atteint l’embouchure du Mississippi et revendique tout son bassin pour la France sous le nom de Louisiane.
  The Jesuit Eusebio Kino begins founding missions in the Pimería Alta, in what is now southern Arizona.: Le jésuite Eusebio Kino commence à fonder des missions dans la Pimería Alta, dans l’actuel sud de l’Arizona.
  Diego de Vargas reoccupies Santa Fe, and Spanish rule over the Pueblos is restored by 1696.: Diego de Vargas réoccupe Santa Fe, et la domination espagnole sur les Pueblos est rétablie en 1696.
  "By the Peace of Ryswick Spain recognises French rule in western Hispaniola: Saint-Domingue.": "Par la paix de Ryswick, l’Espagne reconnaît la domination française sur l’ouest d’Hispaniola : Saint-Domingue."
  Juan María de Salvatierra founds the mission of Loreto, the first lasting Spanish settlement in Baja California.: Juan María de Salvatierra fonde la mission de Loreto, le premier établissement espagnol durable en Basse-Californie.
  Pierre Le Moyne d’Iberville builds Fort Maurepas on Biloxi Bay, the first settlement of French Louisiana.: Pierre Le Moyne d’Iberville construit le fort Maurepas sur la baie de Biloxi, le premier établissement de la Louisiane française.
  The French found Mobile, which becomes the capital of Louisiana.: Les Français fondent Mobile, qui devient la capitale de la Louisiane.
  Bermuda passes with England to the Kingdom of Great Britain.: Les Bermudes passent avec l’Angleterre au royaume de Grande-Bretagne.
  Peace of Utrecht. France cedes Acadia (mainland Nova Scotia) and its claims to Newfoundland, with St Pierre and Miquelon, and Hudson Bay to Britain, but keeps Cape Breton, where it builds Louisbourg, and Île Saint-Jean.: Paix d’Utrecht. La France cède à la Grande-Bretagne l’Acadie (la Nouvelle-Écosse continentale), ses prétentions sur Terre-Neuve, avec Saint-Pierre-et-Miquelon, et la baie d’Hudson, mais conserve le Cap-Breton, où elle construit Louisbourg, et l’île Saint-Jean.
  "Peace of Utrecht: France cedes its part of St Kitts to Britain.": "Paix d’Utrecht : la France cède sa partie de Saint-Christophe à la Grande-Bretagne."
  Spain founds missions and a presidio in East Texas against the French in Louisiana; San Antonio follows in 1718.: L’Espagne fonde des missions et un presidio dans l’est du Texas face aux Français de Louisiane ; San Antonio suit en 1718.
  The French build Fort Toulouse among the Alabama, where the Coosa and the Tallapoosa meet.: Les Français construisent le fort Toulouse chez les Alabamas, au confluent de la Coosa et de la Tallapoosa.
  The Danes settle St John.: Les Danois s’établissent à Saint John.
  French settlers found Port-La-Joye on Île Saint-Jean (Prince Edward Island).: Des colons français fondent Port-La-Joye sur l’île Saint-Jean (l’Île-du-Prince-Édouard).
  Massachusetts builds Fort Dummer, the first lasting English settlement in what is now Vermont.: Le Massachusetts construit le fort Dummer, le premier établissement anglais durable dans l’actuel Vermont.
  By about 1727 settlers from Pennsylvania are farming the valleys west of the Blue Ridge, in what is now the Eastern Panhandle of West Virginia.: Vers 1727, des colons venus de Pennsylvanie cultivent les vallées à l’ouest du Blue Ridge, dans l’actuel Eastern Panhandle de la Virginie-Occidentale.
  James Oglethorpe founds Savannah and the colony of Georgia.: James Oglethorpe fonde Savannah et la colonie de Géorgie.
  France sells St Croix to the Danish West India Company.: La France vend Sainte-Croix à la Compagnie danoise des Indes occidentales.
  José de Escandón settles the Gulf coast between Tampico and the Nueces River as the province of Nuevo Santander.: José de Escandón colonise la côte du golfe entre Tampico et la Nueces, qui forme la province de Nuevo Santander.
  By the secret Treaty of Fontainebleau France gives Louisiana west of the Mississippi, with New Orleans, to Spain.: Par le traité secret de Fontainebleau, la France cède à l’Espagne la Louisiane à l’ouest du Mississippi, avec La Nouvelle-Orléans.
  Treaty of Paris. France cedes Canada, Acadia, Cape Breton and Île Saint-Jean and all of Louisiana east of the Mississippi to Britain, which gives St Pierre and Miquelon back to France as a shelter for its fishermen; Spain cedes Florida to Britain.: Traité de Paris. La France cède à la Grande-Bretagne le Canada, l’Acadie, le Cap-Breton, l’île Saint-Jean et toute la Louisiane à l’est du Mississippi ; la Grande-Bretagne rend Saint-Pierre-et-Miquelon à la France pour servir d’abri à ses pêcheurs. L’Espagne cède la Floride à la Grande-Bretagne.
  The rest of New France east of the Mississippi passes to Britain.: Le reste de la Nouvelle-France à l’est du Mississippi passe à la Grande-Bretagne.
  Treaty of Paris. France cedes Grenada, and the neutral islands of Dominica, St Vincent and Tobago go to Britain; St Lucia stays French.: Traité de Paris. La France cède la Grenade, et les îles neutres de la Dominique, de Saint-Vincent et de Tobago reviennent à la Grande-Bretagne ; Sainte-Lucie reste française.
  "The Royal Proclamation organises Britain’s new lands: the St Lawrence valley becomes the Province of Quebec, Labrador goes to Newfoundland, Cape Breton and Île Saint-Jean are joined to Nova Scotia, and the lands west of the Appalachians are reserved for the Native nations.": "La Proclamation royale organise les nouvelles terres britanniques : la vallée du Saint-Laurent devient la province de Québec, le Labrador passe à Terre-Neuve, le Cap-Breton et l’île Saint-Jean sont réunis à la Nouvelle-Écosse, et les terres à l’ouest des Appalaches sont réservées aux nations amérindiennes."
  Île Saint-Jean, renamed St John’s Island, becomes a British colony separate from Nova Scotia; it is renamed Prince Edward Island in 1799.: L’île Saint-Jean, rebaptisée St John’s Island, devient une colonie britannique distincte de la Nouvelle-Écosse ; elle prend le nom d’Île-du-Prince-Édouard en 1799.
  Gaspar de Portolá and Junípero Serra found San Diego, the first of the Spanish presidios and missions of Alta California; missions spread through northern Baja California at the same time.: Gaspar de Portolá et Junípero Serra fondent San Diego, le premier des presidios et des missions espagnols de Haute-Californie ; à la même époque, des missions se répandent dans le nord de la Basse-Californie.
  The Quebec Act extends the Province of Quebec to the Great Lakes and the Ohio country, and to Labrador.: L’Acte de Québec étend la province de Québec jusqu’aux Grands Lacs et au pays de l’Ohio, ainsi qu’au Labrador.
  The thirteen colonies declare their independence as the United States. Vermont, claimed by New York and New Hampshire, declares itself an independent republic in 1777 and joins the Union in 1791.: Les treize colonies proclament leur indépendance sous le nom d’États-Unis. Le Vermont, revendiqué par New York et le New Hampshire, se proclame république indépendante en 1777 et rejoint l’Union en 1791.
  Peace of Paris. Britain recognises the independence of the United States, with a border along the Great Lakes and the Mississippi, and cedes East and West Florida to Spain.: Paix de Paris. La Grande-Bretagne reconnaît l’indépendance des États-Unis, avec une frontière qui suit les Grands Lacs et le Mississippi, et cède la Floride orientale et la Floride occidentale à l’Espagne.
  Peace of Versailles. Britain cedes Tobago to France.: Paix de Versailles. La Grande-Bretagne cède Tobago à la France.
  Loyalist refugees from the United States settle along the Saint John, and New Brunswick is separated from Nova Scotia.: Des réfugiés loyalistes venus des États-Unis s’établissent le long du Saint-Jean, et le Nouveau-Brunswick est séparé de la Nouvelle-Écosse.
  France cedes St Barthélemy to Sweden in exchange for trading rights in Gothenburg.: La France cède Saint-Barthélemy à la Suède en échange de droits commerciaux à Göteborg.
  Grigory Shelikhov founds a Russian settlement at Three Saints Bay on Kodiak Island. Russia claims Alaska, which the Russian-American Company governs from 1799.: Grigori Chelikhov fonde un établissement russe à Three Saints Bay, sur l’île Kodiak. La Russie revendique l’Alaska, que la Compagnie russe d’Amérique gouverne à partir de 1799.
  The Constitutional Act divides the Province of Quebec into Lower Canada, on the lower St Lawrence, and Upper Canada, settled by Loyalists, on the Great Lakes.: L’Acte constitutionnel divise la province de Québec en Bas-Canada, sur le cours inférieur du Saint-Laurent, et Haut-Canada, peuplé de loyalistes, sur les Grands Lacs.
  The Dutch Republic becomes the Batavian Republic.: Les Provinces-Unies deviennent la République batave.
  By the Peace of Basel Spain cedes Santo Domingo, the eastern part of Hispaniola, to France; Toussaint Louverture takes it over in the name of France in January 1801.: Par la paix de Bâle, l’Espagne cède à la France Santo Domingo, la partie orientale d’Hispaniola ; Toussaint Louverture en prend possession au nom de la France en janvier 1801.
  By the secret Treaty of San Ildefonso Spain returns Louisiana to France; Spanish officials go on governing it until 1803.: Par le traité secret de San Ildefonso, l’Espagne rend la Louisiane à la France ; des fonctionnaires espagnols continuent de la gouverner jusqu’en 1803.
  By the Peace of Amiens Spain cedes Trinidad, taken by the British in 1797, to Britain.: Par la paix d’Amiens, l’Espagne cède à la Grande-Bretagne la Trinité, prise par les Britanniques en 1797.
  The United States buys Louisiana from France for 15 million dollars, doubling its territory.: Les États-Unis achètent la Louisiane à la France pour 15 millions de dollars, doublant ainsi leur territoire.
  Jean-Jacques Dessalines proclaims the independence of Haiti, the first state founded by formerly enslaved people, after the defeat of Napoleon’s army. The east of the island stays in French hands.: Jean-Jacques Dessalines proclame l’indépendance d’Haïti, le premier État fondé par des personnes autrefois réduites en esclavage, après la défaite de l’armée de Napoléon. L’est de l’île reste aux mains des Français.
  "After the murder of Dessalines Haiti splits: Henri Christophe rules the north as the State of Haiti, from 1811 the Kingdom of Haiti, and Alexandre Pétion the south as the Republic of Haiti.": "Après l’assassinat de Dessalines, Haïti se divise : Henri Christophe gouverne le nord sous le nom d’État d’Haïti, devenu en 1811 le royaume d’Haïti, et Alexandre Pétion le sud sous le nom de République d’Haïti."
  An act of Parliament returns the coast of Labrador to Newfoundland.: Une loi du Parlement rend la côte du Labrador à Terre-Neuve.
  The French garrison of Santo Domingo surrenders to Dominican rebels and a British squadron, and the east of Hispaniola returns to Spain.: La garnison française de Santo Domingo se rend aux rebelles dominicains et à une escadre britannique, et l’est d’Hispaniola revient à l’Espagne.
  After American settlers in Spanish West Florida take the fort at Baton Rouge and proclaim a republic, President Madison claims West Florida for the United States, and American troops occupy it as far as the Pearl River.: Après que des colons américains de la Floride occidentale espagnole ont pris le fort de Baton Rouge et proclamé une république, le président Madison revendique la Floride occidentale pour les États-Unis, et les troupes américaines l’occupent jusqu’à la Pearl.
  American troops under James Wilkinson take Mobile from Spain; Congress had annexed the coast between the Pearl and the Perdido the year before.: Les troupes américaines de James Wilkinson prennent Mobile à l’Espagne ; le Congrès avait annexé l’année précédente la côte entre la Pearl et la Perdido.
  The Danish West Indies pass with Denmark to the reduced Danish kingdom after the Treaty of Kiel.: Après le traité de Kiel, les Indes occidentales danoises passent avec le Danemark au royaume danois, désormais réduit.
  By the Treaty of Paris France cedes St Lucia and Tobago to Britain.: Par le traité de Paris, la France cède Sainte-Lucie et Tobago à la Grande-Bretagne.
  The Anglo-American Convention fixes the border on the 49th parallel from the Lake of the Woods to the Rocky Mountains, and the Red River valley south of it passes to the United States. The Oregon Country west of the mountains is left open to both.: La convention anglo-américaine fixe la frontière sur le 49e parallèle, du lac des Bois aux montagnes Rocheuses, et la vallée de la rivière Rouge, au sud de cette ligne, passe aux États-Unis. Le pays de l’Oregon, à l’ouest des montagnes, reste ouvert aux deux pays.
  Henri Christophe shoots himself during a revolt, and Jean-Pierre Boyer reunites Haiti.: Henri Christophe se tire une balle pendant une révolte, et Jean-Pierre Boyer réunifie Haïti.
  "The Adams–Onís Treaty comes into force: Spain cedes Florida to the United States, and their border is fixed along the Sabine, the Red and the Arkansas rivers and the 42nd parallel to the Pacific.": "Le traité Adams–Onís entre en vigueur : l’Espagne cède la Floride aux États-Unis, et leur frontière est fixée le long de la Sabine, de la rivière Rouge et de l’Arkansas, puis du 42e parallèle jusqu’au Pacifique."
  Mexico declares its independence as the Mexican Empire under Agustín de Iturbide, a month after the last Spanish viceroy accepted it in the Treaty of Córdoba.: Le Mexique proclame son indépendance sous le nom d’Empire mexicain, avec Agustín de Iturbide à sa tête, un mois après que le dernier vice-roi espagnol l’a acceptée par le traité de Córdoba.
  José Núñez de Cáceres declares the independence of Spanish Haiti, the east of the island.: José Núñez de Cáceres proclame l’indépendance d’Haïti espagnol, l’est de l’île.
  After the Hudson’s Bay Company absorbs its rival, the North West Company, the Crown grants it the sole right to trade in the lands north and west of Rupert’s Land.: Après l’absorption de sa rivale, la Compagnie du Nord-Ouest, par la Compagnie de la baie d’Hudson, la Couronne accorde à celle-ci le droit exclusif de commercer dans les terres situées au nord et à l’ouest de la Terre de Rupert.
  Boyer’s army enters Santo Domingo, and Haiti rules the whole island for 22 years.: L’armée de Boyer entre à Santo Domingo, et Haïti gouverne l’île entière pendant 22 ans.
  Sam Houston defeats and captures Santa Anna at San Jacinto, securing the independence of the Republic of Texas, declared on 2 March. Mexico does not recognise it, and the land between the Nueces and the Rio Grande stays disputed.: Sam Houston bat et capture Santa Anna à San Jacinto, assurant l’indépendance de la république du Texas, proclamée le 2 mars. Le Mexique ne la reconnaît pas, et les terres situées entre la Nueces et le Rio Grande restent disputées.
  Upper and Lower Canada are united as the Province of Canada.: Le Haut-Canada et le Bas-Canada sont unis pour former la province du Canada.
  The Trinitarios led by Juan Pablo Duarte proclaim the Dominican Republic in Santo Domingo.: Les membres de La Trinitaria, menés par Juan Pablo Duarte, proclament la République dominicaine à Santo Domingo.
  The Dutch islands of the Caribbean, governed with Suriname from Paramaribo since 1828, become the colony of Curaçao and Dependencies, governed from Willemstad.: Les îles néerlandaises des Caraïbes, administrées avec le Suriname à partir de Paramaribo depuis 1828, deviennent la colonie de Curaçao et dépendances, gouvernée depuis Willemstad.
  Texas is annexed by the United States.: Le Texas est annexé par les États-Unis.
  The Oregon Treaty divides the Oregon Country along the 49th parallel; the land south of it passes to the United States.: Le traité de l’Oregon partage le pays de l’Oregon le long du 49e parallèle ; les terres situées au sud passent aux États-Unis.
  "Treaty of Guadalupe Hidalgo. Mexico recognises the Rio Grande as the border of Texas and cedes California and New Mexico to the United States: with Texas, it loses about half of its territory.": "Traité de Guadalupe Hidalgo. Le Mexique reconnaît le Rio Grande comme frontière du Texas et cède la Californie et le Nouveau-Mexique aux États-Unis : avec le Texas, il perd environ la moitié de son territoire."
  Vancouver Island becomes a British colony, granted to the Hudson’s Bay Company.: L’île de Vancouver devient une colonie britannique, concédée à la Compagnie de la baie d’Hudson.
  In the Gadsden Purchase the United States buys the land south of the Gila River from Mexico, for a southern railway route.: Par l’achat Gadsden, les États-Unis achètent au Mexique les terres situées au sud de la Gila, afin d’y faire passer une ligne de chemin de fer par le sud.
  During the Fraser River gold rush the mainland becomes the British colony of British Columbia.: Pendant la ruée vers l’or du fleuve Fraser, la partie continentale devient la colonie britannique de la Colombie-Britannique.
  President Pedro Santana returns the Dominican Republic to Spanish rule; a war of restoration forces Spain to leave in 1865.: Le président Pedro Santana replace la République dominicaine sous la domination espagnole ; une guerre de restauration contraint l’Espagne à partir en 1865.
  Vancouver Island is united with British Columbia.: L’île de Vancouver est réunie à la Colombie-Britannique.
  Russia sells Alaska to the United States for 7.2 million dollars.: La Russie vend l’Alaska aux États-Unis pour 7,2 millions de dollars.
  Confederation. The Province of Canada, split into Ontario and Quebec, Nova Scotia and New Brunswick unite as the Dominion of Canada.: Confédération. La province du Canada, scindée en Ontario et en Québec, la Nouvelle-Écosse et le Nouveau-Brunswick s’unissent pour former le Dominion du Canada.
  Canada takes over Rupert’s Land and the North-Western Territory from the Hudson’s Bay Company, and Manitoba becomes a province after the Red River Rebellion.: Le Canada reprend la Terre de Rupert et le Territoire du Nord-Ouest à la Compagnie de la baie d’Hudson, et le Manitoba devient une province après la rébellion de la rivière Rouge.
  British Columbia joins Canada, which promises it a railway to the east.: La Colombie-Britannique rejoint le Canada, qui lui promet un chemin de fer vers l’est.
  Prince Edward Island joins Canada.: L’Île-du-Prince-Édouard rejoint le Canada.
  Sweden returns St Barthélemy to France.: La Suède rend Saint-Barthélemy à la France.
  Britain transfers its claims to the Arctic islands to Canada.: La Grande-Bretagne transfère au Canada ses droits sur les îles arctiques.
  Treaty of Paris. After its defeat in the Spanish–American War, Spain cedes Puerto Rico to the United States and gives up Cuba.: Traité de Paris. Après sa défaite dans la guerre hispano-américaine, l’Espagne cède Porto Rico aux États-Unis et renonce à Cuba.
  Spain hands Cuba over to an American military government.: L’Espagne remet Cuba à un gouvernement militaire américain.
  The American military government ends, and Cuba becomes an independent republic, under the Platt Amendment.: Le gouvernement militaire américain prend fin, et Cuba devient une république indépendante, soumise à l’amendement Platt.
  The United States takes possession of Guantánamo Bay, leased from Cuba as a naval station by an agreement of February 1903.: Les États-Unis prennent possession de la baie de Guantánamo, louée à Cuba comme base navale en vertu d’un accord de février 1903.
  Denmark sells the Danish West Indies to the United States, which renames them the Virgin Islands.: Le Danemark vend les Indes occidentales danoises aux États-Unis, qui les rebaptisent îles Vierges.
  Guadeloupe and Martinique, with St Martin and St Barthélemy, become overseas departments of France.: La Guadeloupe et la Martinique, avec Saint-Martin et Saint-Barthélemy, deviennent des départements français d’outre-mer.
  Newfoundland and Labrador join Canada after two referendums.: Terre-Neuve et le Labrador rejoignent le Canada après deux référendums.
  By the Charter for the Kingdom the Netherlands Antilles, so named since 1948, become a self-governing country within the Kingdom of the Netherlands.: Par le Statut du royaume, les Antilles néerlandaises, ainsi nommées depuis 1948, deviennent un pays autonome au sein du royaume des Pays-Bas.
  Ten British colonies form the West Indies Federation, with its capital at Port of Spain.: Dix colonies britanniques forment la Fédération des Indes occidentales, avec Port-d’Espagne pour capitale.
  The West Indies Federation is dissolved after Jamaica votes to leave it.: La Fédération des Indes occidentales est dissoute après que la Jamaïque a voté pour la quitter.
  Jamaica becomes independent.: La Jamaïque accède à l’indépendance.
  Trinidad and Tobago becomes independent.: Trinité-et-Tobago accède à l’indépendance.
  Barbados becomes independent.: La Barbade accède à l’indépendance.
  The Bahamas become independent.: Les Bahamas accèdent à l’indépendance.
  Grenada becomes independent.: La Grenade accède à l’indépendance.
  Dominica becomes independent.: La Dominique accède à l’indépendance.
  St Lucia becomes independent.: Sainte-Lucie accède à l’indépendance.
  St Vincent and the Grenadines becomes independent.: Saint-Vincent-et-les-Grenadines accède à l’indépendance.
  Antigua and Barbuda becomes independent.: Antigua-et-Barbuda accède à l’indépendance.
  St Kitts and Nevis becomes independent; Anguilla, which broke away in 1967, stays British.: Saint-Christophe-et-Niévès accède à l’indépendance ; Anguilla, qui avait fait sécession en 1967, reste britannique.
  Aruba leaves the Netherlands Antilles and becomes a separate country within the Kingdom of the Netherlands.: Aruba quitte les Antilles néerlandaises et devient un pays distinct au sein du royaume des Pays-Bas.
  "The Netherlands Antilles are dissolved: Curaçao and Sint Maarten become separate countries within the kingdom, and Bonaire, Sint Eustatius and Saba special municipalities of the Netherlands.": "Les Antilles néerlandaises sont dissoutes : Curaçao et Sint Maarten deviennent des pays distincts au sein du royaume, et Bonaire, Saint-Eustache et Saba des communes à statut particulier des Pays-Bas."
  "Virginia’s Kentucky County comes into being, and North Carolina has taken in the Watauga settlements as its Washington District: the lands west of the mountains are governed by the new states, though Britain gives up its claim only in 1783.": "Le comté de Kentucky, créé par la Virginie, voit le jour, et la Caroline du Nord a rattaché les établissements de la Watauga sous le nom de district de Washington : les terres à l’ouest des montagnes sont administrées par les nouveaux États, même si la Grande-Bretagne ne renonce à ses prétentions qu’en 1783."

