# French translations of the catalogue text (wave 9); step bodies follow later.
1959 Tibetan uprising: Soulèvement tibétain de 1959
? A rising in Lhasa in March 1959 against Chinese rule, and its suppression by the People’s Liberation Army, which ended with the flight of the 14th Dalai Lama to India. Revolts against land reform and the campaigns against monasteries had spread from Kham and Amdo since 1956, and refugees and guerrillas of the Chushi Gangdruk crowded into central Tibet. On 10 March 1959, fearing that the Dalai Lama would be seized at a theatre performance in the PLA camp, thousands of Lhasa residents surrounded his summer palace, the Norbulingka; assemblies in the city declared Tibet independent. On the night of 17 March the Dalai Lama slipped away, and from 20 March the PLA shelled the Norbulingka and the Tibetan positions and took the city by 23 March. Thousands of Tibetans were killed in Lhasa; estimates of the dead in the suppression of the revolt across central Tibet range much higher. On 28 March the Chinese government dissolved the Tibetan government, and on 31 March the Dalai Lama crossed into India, where about 80,000 refugees followed him. Exiles mark 10 March as Tibetan Uprising Day; the Chinese government describes the events as an armed rebellion of the upper strata to preserve serfdom, and since 2009 marks 28 March as Serfs’ Emancipation Day.
: Un soulèvement à Lhassa en mars 1959 contre la domination chinoise, et sa répression par l’Armée populaire de libération, qui s’acheva par la fuite du 14e dalaï-lama en Inde. Des révoltes contre la réforme agraire et les campagnes contre les monastères s’étendaient depuis 1956 à partir du Kham et de l’Amdo, et des réfugiés et des guérilleros du Chushi Gangdruk affluaient dans le Tibet central. Le 10 mars 1959, craignant que le dalaï-lama ne soit enlevé lors d’une représentation théâtrale au camp de l’APL, des milliers d’habitants de Lhassa encerclèrent son palais d’été, le Norbulingka ; des assemblées réunies dans la ville proclamèrent l’indépendance du Tibet. Dans la nuit du 17 mars, le dalaï-lama s’éclipsa et, à partir du 20 mars, l’APL bombarda le Norbulingka et les positions tibétaines et, le 23 mars, s’était rendue maîtresse de la ville. Des milliers de Tibétains furent tués à Lhassa ; les estimations du nombre de morts lors de la répression de la révolte dans l’ensemble du Tibet central vont bien au-delà. Le 28 mars, le gouvernement chinois dissolut le gouvernement tibétain et, le 31 mars, le dalaï-lama passa en Inde, où environ 80 000 réfugiés le suivirent. Les exilés commémorent le 10 mars comme le Jour du soulèvement tibétain ; le gouvernement chinois décrit ces événements comme une rébellion armée des classes supérieures visant à préserver le servage et a fait du 28 mars, depuis 2009, le Jour de l’émancipation des serfs.
