# French translations of the catalogue text (wave 9); step bodies follow later.
February 28 incident: Incident du 28 février
? "An uprising in Taiwan against the Nationalist administration and its violent suppression. Japan had handed Taiwan to the Republic of China in October 1945, and the government of Chen Yi, staffed mostly by officials from the mainland, was resented for corruption, state monopolies, inflation and discrimination against Taiwanese. On 27 February 1947 agents of the Tobacco Monopoly in Taipei beat a widow, Lin Jiang-mai, while seizing her cigarettes, and one of them fired into the crowd, killing a bystander. The next day soldiers fired on protesters outside the governor’s office, and the unrest spread across the island. Taiwanese took over local offices, police stations and a radio station in Taipei, some mainlanders were beaten or killed by crowds, and settlement committees presented 32 demands for reform and self-government. Armed groups fought government troops at Chiayi and Kaohsiung, and in Taichung the Twenty-Seven Brigade, formed by the communist Xie Xuehong, took up arms. Chen Yi negotiated while asking Nanjing for troops. On 6 March the Kaohsiung garrison under Peng Meng-chi arrested and executed a peace delegation led by the city’s mayor and attacked the city, and on 8 March the 21st Division began landing at Keelung. In the following weeks troops killed protesters, students, lawyers, doctors and local leaders across the island; the last armed group was dispersed near Puli on 16 March. The number of dead is unknown: a government commission in 1992 estimated 18,000 to 28,000, the figure adopted officially in 2007, while other estimates are around 10,000 or lower. The incident was followed by martial law (1949–1987) and the White Terror, when it could not be discussed in public. President Lee Teng-hui apologised in 1995, and 28 February is now Peace Memorial Day."
: "Un soulèvement à Taïwan contre l’administration nationaliste, et sa répression violente. Le Japon avait remis Taïwan à la République de Chine en octobre 1945, et le gouvernement de Chen Yi, composé surtout de fonctionnaires venus du continent, suscitait le ressentiment par sa corruption, ses monopoles d’État, l’inflation et la discrimination envers les Taïwanais. Le 27 février 1947, à Taipei, des agents du Monopole du tabac frappèrent une veuve, Lin Jiang-mai, en saisissant ses cigarettes, et l’un d’eux tira dans la foule, tuant un passant. Le lendemain, des soldats ouvrirent le feu sur des manifestants devant le bureau du gouverneur, et les troubles gagnèrent toute l’île. Des Taïwanais prirent le contrôle de bureaux locaux, de commissariats et d’une station de radio à Taipei, certains continentaux furent battus ou tués par la foule, et des comités de règlement présentèrent 32 revendications de réforme et d’autonomie. Des groupes armés combattirent les troupes gouvernementales à Chiayi et à Kaohsiung et, à Taichung, la Brigade des Vingt-Sept, formée par la communiste Xie Xuehong, prit les armes. Chen Yi négociait tout en demandant des troupes à Nankin. Le 6 mars, la garnison de Kaohsiung, commandée par Peng Meng-chi, arrêta et exécuta une délégation de paix conduite par le maire de la ville et attaqua celle-ci et, le 8 mars, la 21e division commença à débarquer à Keelung. Dans les semaines qui suivirent, les troupes tuèrent des manifestants, des étudiants, des avocats, des médecins et des personnalités locales dans toute l’île ; le dernier groupe armé fut dispersé près de Puli le 16 mars. Le nombre de morts est inconnu : une commission gouvernementale l’estima en 1992 entre 18 000 et 28 000, chiffre adopté officiellement en 2007, tandis que d’autres estimations tournent autour de 10 000 ou moins. L’incident fut suivi de la loi martiale (1949–1987) et de la Terreur blanche, période pendant laquelle il ne pouvait être évoqué en public. Le président Lee Teng-hui présenta des excuses en 1995, et le 28 février est aujourd’hui la Journée commémorative de la paix."
