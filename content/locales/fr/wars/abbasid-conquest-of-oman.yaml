# French translations of the catalogue text (wave 7); step bodies follow later.
Abbasid conquest of Oman: Conquête abbasside d’Oman
The Abbasid invasion of Oman in 893, which ended the second Ibadi imamate. During a civil war among the Omani tribes, one faction asked Muhammad ibn Nur, the caliph’s governor of Bahrayn, to intervene, and the caliph al-Mu’tadid approved an expedition. Muhammad’s army, said to number 25,000, marched overland while supplies came by sea from Basra. It took Julfar after a brief fight, advanced in April 893 by way of Tu’am to Nizwa, which fell without resistance, and in mid-May defeated the imam Azzan ibn Tamim, who was killed with many of his followers; their heads were sent to Baghdad. A last tribal alliance was crushed at Dama. Ibadi sources describe harsh repression, with torture, mutilation and killings, the burning of books and the destruction of irrigation channels, and called Muhammad ibn Bur, “son of desolation”. He returned to Bahrayn in 896, leaving a deputy in Oman.: L’invasion abbasside d’Oman en 893, qui mit fin au second imamat ibadite. Pendant une guerre civile entre les tribus omanaises, une faction demanda à Muhammad ibn Nur, gouverneur de Bahreïn pour le calife, d’intervenir, et le calife al-Mu’tadid approuva une expédition. L’armée de Muhammad, forte, dit-on, de 25 000 hommes, avança par voie de terre tandis que le ravitaillement arrivait par mer depuis Bassora. Elle prit Julfar après un bref combat, avança en avril 893 par Tu’am jusqu’à Nizwa, qui tomba sans résistance, et vainquit à la mi-mai l’imam Azzan ibn Tamim, qui fut tué avec nombre de ses partisans ; leurs têtes furent envoyées à Bagdad. Une dernière alliance tribale fut écrasée à Dama. Les sources ibadites décrivent une dure répression, avec tortures, mutilations et meurtres, livres brûlés et canaux d’irrigation détruits, et surnommèrent Muhammad ibn Bur, « fils de la désolation ». Il retourna à Bahreïn en 896, laissant un lieutenant à Oman.
