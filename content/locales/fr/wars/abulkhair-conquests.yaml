# French translations of the catalogue text (wave 9); step bodies follow later.
Wars of Abu’l-Khayr Khan: Guerres d’Abu’l-Khayr Khan
? The campaigns by which Abu’l-Khayr, a Shaybanid prince of the house of Jochi, built the Uzbek Khanate on the steppe east of the Urals and the Volga, and the defeats that broke it. Proclaimed khan in 1428 at about the age of seventeen, in the lands of the Tura and the Tobol around Chimgi-Tura (today’s Tyumen), he defeated rival Jochid khans, among them Hajji Muhammad of Sibir and, near Astrakhan, Mustafa Khan. In 1430–1431 his army sacked Urgench in Timurid Khwarazm, and in about 1446 he took the towns of the middle Syr Darya, Sighnaq, Sozak, Uzgend and Arquq, and made Sighnaq his capital. In 1451 he helped the Timurid Abu Sa’id take Samarkand and married a daughter of Ulugh Beg. In about 1457 an Oirat army under Uz Temür taishi routed him at Kök Kashane near Sighnaq and plundered his lands, and soon after the sultans Kerei and Janibek left him with their followers and settled in Moghulistan, where they founded the Kazakh Khanate. Abu’l-Khayr died in 1468 (some sources say 1469) on a campaign against them; his khanate broke up, and his grandson Muhammad Shaybani later founded the Shaybanid state in Mawarannahr.
: Les campagnes par lesquelles Abu’l-Khayr, prince chaybanide de la maison de Djötchi, bâtit le khanat ouzbek dans la steppe à l’est de l’Oural et de la Volga, et les défaites qui le brisèrent. Proclamé khan en 1428, vers l’âge de dix-sept ans, dans les terres de la Toura et du Tobol autour de Tchimgui-Toura (l’actuelle Tioumen), il vainquit des khans djötchides rivaux, parmi lesquels Hajji Muhammad de Sibir et, près d’Astrakhan, Mustafa Khan. En 1430–1431, son armée mit à sac Ourguentch, dans le Khwarezm timouride, et vers 1446 il prit les villes du moyen Syr-Daria, Sighnaq, Sozak, Uzgend et Arquq, et fit de Sighnaq sa capitale. En 1451, il aida le Timouride Abu Sa’id à prendre Samarcande et épousa une fille d’Ulugh Beg. Vers 1457, une armée oïrate commandée par le taishi Uz Temür le mit en déroute à Kök Kashane, près de Sighnaq, et pilla ses terres, et peu après les sultans Kereï et Janibek le quittèrent avec leurs partisans et s’établirent au Moghulistan, où ils fondèrent le khanat kazakh. Abu’l-Khayr mourut en 1468 (en 1469 selon certaines sources) au cours d’une campagne contre eux ; son khanat se disloqua, et son petit-fils Muhammad Chaybani fonda plus tard l’État chaybanide dans le Mawarannahr.
