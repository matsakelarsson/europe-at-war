# French translations of the catalogue text (wave 13); step bodies follow later.
Abushiri revolt: Révolte d’Abushiri
? The rising of the Swahili coast of present-day Tanzania against the German East Africa Company. In April 1888 Sultan Khalifa of Zanzibar leased the mainland coast to the company, and when its agents arrived in August, hauled down the sultan’s flags and took over the customs houses, the towns rose. Led at Pangani by Abushiri ibn Salim al-Harthi, a planter of Arab and Oromo descent, and at Saadani by Bwana Heri, Swahili townspeople, Arab planters and traders and the peoples of the hinterland drove the company out of every port except Bagamoyo and Dar es Salaam, which held out with the help of German warships. Germany and Britain blockaded the coast, and in 1889 the imperial commissioner Hermann von Wissmann, with an army of African soldiers recruited in Egypt and Mozambique, stormed Abushiri’s fort near Bagamoyo (8 May) and retook the northern ports. Abushiri was betrayed and hanged at Pangani on 15 December 1889; Bwana Heri submitted early in 1890, and Kilwa, Lindi and Mikindani were retaken in May. The German government took over the colony from the company on 1 January 1891, and Wissmann’s force became the core of the Schutztruppe.
: Le soulèvement de la côte swahilie de l’actuelle Tanzanie contre la Compagnie de l’Afrique orientale allemande. En avril 1888, le sultan Khalifa de Zanzibar concéda à bail la côte continentale à la compagnie et, lorsque ses agents arrivèrent en août, amenèrent les drapeaux du sultan et prirent le contrôle des douanes, les villes se soulevèrent. Menés à Pangani par Abushiri ibn Salim al-Harthi, planteur d’ascendance arabe et oromo, et à Saadani par Bwana Heri, citadins swahilis, planteurs et marchands arabes et peuples de l’arrière-pays chassèrent la compagnie de tous les ports à l’exception de Bagamoyo et de Dar es Salam, qui tinrent bon grâce aux navires de guerre allemands. L’Allemagne et la Grande-Bretagne imposèrent un blocus de la côte et, en 1889, le commissaire impérial Hermann von Wissmann, à la tête d’une armée de soldats africains recrutés en Égypte et au Mozambique, prit d’assaut le fort d’Abushiri près de Bagamoyo (8 mai) et reprit les ports du nord. Abushiri fut trahi et pendu à Pangani le 15 décembre 1889 ; Bwana Heri se soumit au début de 1890, et Kilwa, Lindi et Mikindani furent reprises en mai. Le gouvernement allemand reprit la colonie à la compagnie le 1er janvier 1891, et la troupe de Wissmann devint le noyau de la Schutztruppe.
