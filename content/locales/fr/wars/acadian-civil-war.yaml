# French translations of the catalogue text (wave 14); step bodies follow later.
Acadian Civil War: Guerre civile acadienne
? A war in French Acadia between two rival commanders, Charles de Saint-Étienne de La Tour, based at Fort Sainte-Marie (Fort La Tour) at the mouth of the Saint John River, and Charles de Menou d’Aulnay, based at Port-Royal across the Bay of Fundy, over the fur trade and the right to govern the colony. After the death of the governor Isaac de Razilly in 1635, the French crown divided Acadia between them in 1638 in a way that left each with a fort inside the other’s lands. In 1640 the two came to blows when La Tour was refused entry at Port-Royal. D’Aulnay won royal orders charging La Tour with disloyalty and calling him to France, and in 1642–1643 blockaded Fort Sainte-Marie, while La Tour’s wife, Françoise-Marie Jacquelin, slipped out to plead his case in France. La Tour turned to Puritan Boston, where Governor John Winthrop let him hire ships and volunteers; in July 1643 he returned with four ships and some 270 men, broke the blockade, chased d’Aulnay to Port-Royal, burned his mill and seized his furs, and skirmished with him again at Penobscot. D’Aulnay’s first attack on Fort Sainte-Marie, in February 1645, was beaten off. In April, learning that La Tour was again in Boston, he returned with about two hundred men. Jacquelin held the fort for several days before surrendering on a promise of quarter; d’Aulnay then had the garrison hanged, all but one man who was made to act as executioner, and forced her to watch with a rope around her neck. She died there three weeks later. D’Aulnay ruled all Acadia until he drowned in 1650; in 1653 La Tour, restored as governor, married his widow, Jeanne Motin. The rivalry weakened Acadia, which a New England expedition under Robert Sedgwick took in 1654.
: Une guerre qui opposa en Acadie française deux commandants rivaux, Charles de Saint-Étienne de La Tour, établi au fort Sainte-Marie (fort La Tour), à l’embouchure de la rivière Saint-Jean, et Charles de Menou d’Aulnay, établi à Port-Royal, de l’autre côté de la baie de Fundy, pour le commerce des fourrures et le droit de gouverner la colonie. Après la mort du gouverneur Isaac de Razilly en 1635, la Couronne française partagea en 1638 l’Acadie entre eux d’une manière qui laissait à chacun un fort sur les terres de l’autre. En 1640, les deux hommes en vinrent aux armes lorsque l’entrée de Port-Royal fut refusée à La Tour. D’Aulnay obtint des ordres royaux qui accusaient La Tour de déloyauté et le rappelaient en France et, en 1642–1643, il bloqua le fort Sainte-Marie, tandis que l’épouse de La Tour, Françoise-Marie Jacquelin, s’échappait pour aller plaider sa cause en France. La Tour se tourna vers la Boston puritaine, où le gouverneur John Winthrop le laissa louer des navires et engager des volontaires ; en juillet 1643, il revint avec quatre navires et quelque 270 hommes, brisa le blocus, pourchassa d’Aulnay jusqu’à Port-Royal, incendia son moulin et saisit ses fourrures, puis l’affronta de nouveau dans une escarmouche à Penobscot. Une première attaque lancée par d’Aulnay contre le fort Sainte-Marie, en février 1645, fut repoussée. En avril, apprenant que La Tour se trouvait de nouveau à Boston, il revint avec environ deux cents hommes. Françoise-Marie Jacquelin tint le fort pendant plusieurs jours avant de se rendre contre la promesse d’avoir la vie sauve ; d’Aulnay fit alors pendre la garnison, à l’exception d’un homme contraint de servir de bourreau, et l’obligea à y assister la corde au cou. Elle mourut sur place trois semaines plus tard. D’Aulnay gouverna toute l’Acadie jusqu’à sa noyade en 1650 ; en 1653, La Tour, rétabli dans ses fonctions de gouverneur, épousa sa veuve, Jeanne Motin. Cette rivalité affaiblit l’Acadie, dont une expédition de la Nouvelle-Angleterre commandée par Robert Sedgwick s’empara en 1654.
