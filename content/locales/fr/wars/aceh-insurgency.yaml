# French translations of the catalogue text (wave 11); step bodies follow later.
Aceh insurgency: Insurrection d’Aceh
? The war of the Free Aceh Movement (Gerakan Aceh Merdeka, GAM) for the independence of Aceh, at the northern tip of Sumatra, from Indonesia. Aceh had been an independent sultanate until the Dutch conquest (1873–1904), and many Acehnese felt that Jakarta had broken its promises of autonomy and taken the wealth of the natural gas fields opened near Lhokseumawe in the 1970s. Hasan di Tiro declared independence on 4 December 1976; his small movement was crushed by 1979, revived in 1989 with fighters trained in Libya, and was met by a decade of military operations in which thousands of civilians were killed, tortured or disappeared. After the fall of Suharto in 1998 GAM grew quickly; ceasefires in 2000 and 2002 broke down, and in May 2003 the government imposed martial law and launched its largest military operation since East Timor. The Indian Ocean tsunami of 26 December 2004, which killed some 170,000 people in Aceh, pushed both sides to talks in Helsinki under the former Finnish president Martti Ahtisaari. In the agreement of 15 August 2005 GAM gave up its demand for independence and disarmed, and Indonesia withdrew most of its troops, granted an amnesty and allowed local political parties; GAM disbanded its army on 27 December 2005. An estimated 15,000 people, most of them civilians, died in the conflict, though estimates range from about 10,000 to 30,000.
: La guerre menée contre l’Indonésie par le Mouvement pour un Aceh libre (Gerakan Aceh Merdeka, GAM) pour l’indépendance d’Aceh, à la pointe nord de Sumatra. Aceh avait été un sultanat indépendant jusqu’à la conquête néerlandaise (1873–1904), et de nombreux Acehnais estimaient que Jakarta avait trahi ses promesses d’autonomie et accaparé les richesses des gisements de gaz naturel mis en exploitation près de Lhokseumawe dans les années 1970. Hasan di Tiro proclama l’indépendance le 4 décembre 1976 ; son petit mouvement fut écrasé dès 1979, se reconstitua en 1989 avec des combattants formés en Libye, et dut faire face à une décennie d’opérations militaires au cours desquelles des milliers de civils furent tués, torturés ou portés disparus. Après la chute de Suharto en 1998, le GAM se développa rapidement ; les cessez-le-feu de 2000 et de 2002 échouèrent, et en mai 2003 le gouvernement imposa la loi martiale et lança sa plus grande opération militaire depuis le Timor oriental. Le tsunami de l’océan Indien du 26 décembre 2004, qui tua quelque 170 000 personnes à Aceh, poussa les deux camps à négocier à Helsinki sous l’égide de l’ancien président finlandais Martti Ahtisaari. Par l’accord du 15 août 2005, le GAM renonça à sa revendication d’indépendance et désarma, tandis que l’Indonésie retirait la plupart de ses troupes, accordait une amnistie et autorisait des partis politiques locaux ; le GAM procéda à la dissolution de son armée le 27 décembre 2005. Le conflit fit environ 15 000 morts selon les estimations, pour la plupart des civils, bien que celles-ci aillent d’environ 10 000 à 30 000.
