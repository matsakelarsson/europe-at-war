# French translations of the catalogue text (wave 11); step bodies follow later.
Aceh, Johor and Portugal’s wars for the Strait of Malacca: Guerres d’Aceh, de Johor et du Portugal pour le détroit de Malacca
? The century of wars between Portuguese Malacca, the sultanate of Aceh in northern Sumatra and the sultanate of Johor, heir of the old Malacca sultanate, for control of the Strait of Malacca, the main sea route between the Indian Ocean and the China Sea. Historians call it a triangular war, because each of the three fought the other two in turn. Aceh, which had grown rich on the pepper trade that Muslim merchants moved there after 1511 and that it shipped to the Red Sea in defiance of the Portuguese, attacked Malacca again and again from 1537, with gunners and guns from the Ottoman Empire after the 1560s. Johor, which wanted Malacca back, besieged it with Javanese help in 1551, but feared Aceh more and often sided with the Portuguese; Aceh sacked the Johor capital in 1564, the Portuguese in 1587. Japara, the Javanese port ruled by Ratu Kalinyamat, sent its fleets against Malacca in 1551 and 1574. After 1600 the Dutch East India Company joined the war as Johor’s ally against Portugal, besieging Malacca in 1606. Aceh reached its height under Iskandar Muda (1607–1636), who conquered Pahang, Kedah and Perak, carried their people off to Aceh and sacked Johor three times, until his great armada was destroyed at the Duyon River outside Malacca in 1629 by the Portuguese, helped by Johor and Patani. Aceh never again threatened Malacca, and in 1641 the Dutch and Johor took the city from the Portuguese.
: Le siècle de guerres entre la Malacca portugaise, le sultanat d’Aceh, au nord de Sumatra, et le sultanat de Johor, héritier de l’ancien sultanat de Malacca, pour le contrôle du détroit de Malacca, principale route maritime entre l’océan Indien et la mer de Chine. Les historiens parlent d’une guerre triangulaire, car chacun des trois combattit tour à tour les deux autres. Aceh, enrichi par le commerce du poivre que les marchands musulmans y avaient transféré après 1511 et qu’il expédiait vers la mer Rouge au mépris des Portugais, attaqua Malacca à maintes reprises à partir de 1537, avec des artilleurs et des canons venus de l’Empire ottoman après les années 1560. Johor, qui voulait récupérer Malacca, l’assiégea avec l’aide des Javanais en 1551, mais craignait davantage Aceh et se rangea souvent aux côtés des Portugais ; Aceh saccagea la capitale de Johor en 1564, les Portugais en 1587. Japara, le port javanais gouverné par Ratu Kalinyamat, envoya ses flottes contre Malacca en 1551 et en 1574. Après 1600, la Compagnie néerlandaise des Indes orientales entra en guerre comme alliée de Johor contre le Portugal et assiégea Malacca en 1606. Aceh atteignit son apogée sous Iskandar Muda (1607–1636), qui conquit Pahang, Kedah et Perak, en déporta les habitants à Aceh et saccagea Johor à trois reprises, jusqu’à ce que sa grande armada soit détruite en 1629 sur la rivière Duyon, devant Malacca, par les Portugais, aidés de Johor et de Patani. Aceh ne menaça plus jamais Malacca, et en 1641 les Néerlandais et Johor prirent la ville aux Portugais.
