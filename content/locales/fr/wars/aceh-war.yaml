# French translations of the catalogue text (wave 11); step bodies follow later.
Aceh War: Guerre d’Aceh
? The longest of the Dutch colonial wars, fought for the sultanate of Aceh at the northern tip of Sumatra. Aceh was an independent Muslim kingdom and a great exporter of pepper, whose independence Britain had agreed to respect in 1824; in the Treaty of Sumatra of 1871 Britain gave the Dutch a free hand, and when Aceh sought foreign support the Dutch declared war in March 1873. A first expedition was driven off after its general was killed; a second took the sultan’s palace in January 1874, and the Dutch proclaimed Aceh annexed and renamed its capital Kutaraja. But the war went on in the countryside for thirty years, led by uleebalang (territorial chiefs) and ulama (religious scholars) who preached it as a holy war. Teungku Chik di Tiro led the resistance in the 1880s; Teuku Umar served the Dutch from 1893 and turned against them in 1896 with their weapons, fighting with his wife Cut Nyak Dhien until his death in 1899. Under J. B. van Heutsz, with the scholar Christiaan Snouck Hurgronje as adviser and mobile marechaussee units, the Dutch broke the resistance village by village; the sultan surrendered in January 1903, and in 1904 a column under G. C. E. van Daalen marched through the Gayo and Alas highlands, killing at least 2,922 people by its own count. Fighting went on in places until about 1914, and Acehnese count the resistance as lasting until the Japanese invasion of 1942. Estimates of the Acehnese dead range from about 50,000 to more than 100,000; on the colonial side about 37,000 died, most of them from disease.
: La plus longue des guerres coloniales néerlandaises, menée pour la possession du sultanat d’Aceh, à la pointe nord de Sumatra. Aceh était un royaume musulman indépendant et un grand exportateur de poivre, dont la Grande-Bretagne s’était engagée en 1824 à respecter l’indépendance ; par le traité de Sumatra de 1871, la Grande-Bretagne laissa les mains libres aux Néerlandais et, quand Aceh rechercha des appuis étrangers, les Néerlandais lui déclarèrent la guerre en mars 1873. Une première expédition fut repoussée après la mort de son général ; une seconde prit le palais du sultan en janvier 1874, et les Néerlandais proclamèrent l’annexion d’Aceh et rebaptisèrent sa capitale Kutaraja. Mais la guerre se poursuivit dans les campagnes pendant trente ans, menée par les uleebalang (chefs territoriaux) et les oulémas (savants religieux), qui la prêchaient comme une guerre sainte. Teungku Chik di Tiro dirigea la résistance dans les années 1880 ; Teuku Umar servit les Néerlandais à partir de 1893 et se retourna contre eux en 1896 avec leurs propres armes, combattant aux côtés de sa femme Cut Nyak Dhien jusqu’à sa mort en 1899. Sous J. B. van Heutsz, avec le savant Christiaan Snouck Hurgronje pour conseiller et des unités mobiles de la maréchaussée, les Néerlandais brisèrent la résistance village par village ; le sultan se rendit en janvier 1903 et, en 1904, une colonne commandée par G. C. E. van Daalen traversa les hautes terres gayo et alas en tuant au moins 2 922 personnes, selon son propre décompte. Les combats se poursuivirent par endroits jusque vers 1914, et les Acehnais considèrent que la résistance dura jusqu’à l’invasion japonaise de 1942. Les estimations du nombre de morts acehnais vont d’environ 50 000 à plus de 100 000 ; du côté colonial, environ 37 000 personnes moururent, pour la plupart de maladie.
