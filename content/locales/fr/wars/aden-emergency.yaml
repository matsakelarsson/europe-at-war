# French translations of the catalogue text (wave 7); step bodies follow later.
Aden Emergency: Insurrection d’Aden
The armed revolt against British rule in Aden and the Federation of South Arabia, the union of Aden colony and the sultanates of its hinterland that Britain had formed to keep its naval and air base. Nationalist movements backed by Nasser’s Egypt and the new Yemen Arab Republic, chiefly the National Liberation Front (NLF) and, from 1966, the Front for the Liberation of Occupied South Yemen (FLOSY), fought British troops in the Radfan mountains in 1964 and waged a campaign of bombings and assassinations in Aden itself. In 1966 Britain announced that it would leave. In 1967 the NLF and FLOSY fought each other as well as the British; after a mutiny in June the rebels held Aden’s Crater district for two weeks. The NLF took over the sultanates one by one, and when the last British troops left on 29–30 November 1967 it proclaimed the People’s Republic of South Yemen. About 90 British soldiers and several hundred Arab fighters and civilians were killed.: La révolte armée contre la domination britannique à Aden et dans la Fédération d’Arabie du Sud, union de la colonie d’Aden et des sultanats de son arrière-pays que la Grande-Bretagne avait formée pour conserver sa base navale et aérienne. Des mouvements nationalistes soutenus par l’Égypte de Nasser et la jeune République arabe du Yémen, principalement le Front de libération nationale (FLN) et, à partir de 1966, le Front pour la libération du Yémen du Sud occupé (FLOSY), combattirent les troupes britanniques dans les montagnes du Radfan en 1964 et menèrent une campagne d’attentats à la bombe et d’assassinats dans Aden même. En 1966, la Grande-Bretagne annonça qu’elle partirait. En 1967, le FLN et le FLOSY se combattirent l’un l’autre en même temps qu’ils combattaient les Britanniques ; après une mutinerie en juin, les rebelles tinrent pendant deux semaines le quartier de Crater, à Aden. Le FLN prit le contrôle des sultanats l’un après l’autre et, lorsque les dernières troupes britanniques partirent, les 29 et 30 novembre 1967, il proclama la République populaire du Yémen du Sud. Environ 90 soldats britanniques et plusieurs centaines de combattants et de civils arabes furent tués.
