# French translations of the catalogue text (wave 13); step bodies follow later.
ADF insurgency: Insurrection des ADF
? "Last updated 27 November 2026. The insurgency of the Allied Democratic Forces (ADF), a Ugandan Islamist rebel group that has fought mostly in the eastern Democratic Republic of the Congo and since 2019 has been, in its main faction, the Congolese branch of the Islamic State’s Central Africa Province (ISCAP). The ADF was formed in the mid-1990s by Jamil Mukulu, a convert from Catholicism who had joined the Tabligh movement, and merged with the remnants of an older western Ugandan rebel group, NALU, aiming to overthrow Yoweri Museveni’s government. Its first large attack, on Bwera and Mpondwe in Kasese district on 13 November 1996, killed about 50 people; on 8 June 1998 its fighters killed some 80 students at Kichwamba Technical College in Kabarole, and bombs in Kampala restaurants and on buses killed dozens more that year. Driven out of Uganda by the army by the early 2000s, it settled in the Rwenzori mountains and the Beni area of North Kivu, financed by timber, gold and trade. It revived from 2013; from October 2014 a wave of massacres around Beni killed hundreds of civilians, though investigators also found that Congolese army officers and other armed groups had a hand in some of the killings. Mukulu was arrested in Tanzania in April 2015, and his deputy Musa Baluku took over and brought the group into the Islamic State, which recognised it as part of ISCAP in 2018 and to which it pledged allegiance in 2019; a minority stayed loyal to Mukulu. The ADF killed UN peacekeepers, among them 15 Tanzanians at Semuliki on 7 December 2017, attacked prisons and Christian congregations, and moved north into Ituri. After a series of bombings in Uganda in late 2021, among them suicide attacks in Kampala, Uganda and the DR Congo launched a joint offensive, Operation Shujaa, on 30 November 2021, with 4,000–5,000 Ugandan troops by early 2025. It pushed the ADF out of most strongholds near Beni, but the group shifted west into Irumu and Mambasa in Ituri and south into Lubero and Tshopo, and kept raiding: 42 people, most of them pupils, were killed at Lhubiriha Secondary School in Mpondwe, Uganda, in June 2023; more than 40 people (at least 43 according to the UN) at a Catholic church in Komanda, Ituri, on 27 July 2025; at least 71 mourners at a funeral wake at Ntoyo, Lubero, on 8 September 2025; and 28 people, 17 of them in a church-run hospital, at Byambwe on 14–15 November 2025, part of a week of attacks in Lubero that killed at least 89 according to the UN. In 2025 the ADF partly rebuilt its strength while Congolese forces were drawn into the war with the M23; a strike on Musa Baluku’s headquarters on 23 February 2026 forced his camp to move deeper into the forest, but attacks went on, and the group’s raids hampered the response to an Ebola outbreak declared in Ituri in May 2026. In one week in November 2026 the ADF killed at least 44 civilians in Mambasa territory, Ituri, days after killing 66 people in North Kivu, according to humanitarian and security sources, and Africanews reported that the Ugandan and Congolese armies had had no significant success against it. Total deaths since 1996 run into the thousands, mostly Congolese civilians; exact figures are not known."
: "Dernière mise à jour : 27 novembre 2026. L’insurrection des Forces démocratiques alliées (ADF), un groupe rebelle islamiste ougandais qui a surtout combattu dans l’est de la République démocratique du Congo et dont la principale faction constitue depuis 2019 la branche congolaise de la province d’Afrique centrale de l’État islamique (ISCAP). Les ADF furent fondées au milieu des années 1990 par Jamil Mukulu, un converti, ancien catholique, qui avait rejoint le mouvement Tabligh, et fusionnèrent avec les restes d’un groupe rebelle plus ancien de l’ouest de l’Ouganda, la NALU, dans le but de renverser le gouvernement de Yoweri Museveni. Leur première grande attaque, contre Bwera et Mpondwe, dans le district de Kasese, le 13 novembre 1996, fit environ 50 morts ; le 8 juin 1998, leurs combattants tuèrent quelque 80 étudiants au collège technique de Kichwamba, dans le district de Kabarole, et des bombes posées dans des restaurants et des autobus de Kampala firent des dizaines d’autres morts cette année-là. Chassées d’Ouganda par l’armée au début des années 2000, elles s’installèrent dans les monts Rwenzori et la région de Beni, au Nord-Kivu, financées par le bois, l’or et le commerce. Elles reprirent de la vigueur à partir de 2013 ; à partir d’octobre 2014, une vague de massacres autour de Beni tua des centaines de civils, même si des enquêteurs constatèrent aussi que des officiers de l’armée congolaise et d’autres groupes armés avaient pris part à certaines de ces tueries. Mukulu fut arrêté en Tanzanie en avril 2015, et son adjoint Musa Baluku prit la relève et fit entrer le groupe dans l’État islamique, qui le reconnut comme partie de l’ISCAP en 2018 et auquel il prêta allégeance en 2019 ; une minorité resta fidèle à Mukulu. Les ADF tuèrent des Casques bleus de l’ONU, dont 15 Tanzaniens à Semuliki le 7 décembre 2017, attaquèrent des prisons et des communautés chrétiennes, et progressèrent vers le nord, en Ituri. Après une série d’attentats en Ouganda à la fin de 2021, dont des attentats-suicides à Kampala, l’Ouganda et la RD Congo lancèrent le 30 novembre 2021 une offensive conjointe, l’opération Shujaa, qui mobilisait 4 000 à 5 000 soldats ougandais au début de 2025. Elle chassa les ADF de la plupart de leurs bastions proches de Beni, mais le groupe se déplaça vers l’ouest, dans les territoires d’Irumu et de Mambasa, en Ituri, et vers le sud, dans le Lubero et la Tshopo, et poursuivit ses raids : 42 personnes, des élèves pour la plupart, furent tuées à l’école secondaire de Lhubiriha, à Mpondwe, en Ouganda, en juin 2023 ; plus de 40 (au moins 43 selon l’ONU) dans une église catholique de Komanda, en Ituri, le 27 juillet 2025 ; au moins 71 personnes venues à une veillée funèbre à Ntoyo, dans le Lubero, le 8 septembre 2025 ; et 28 personnes, dont 17 dans un hôpital tenu par une Église, à Byambwe les 14 et 15 novembre 2025, au cours d’une semaine d’attaques dans le Lubero qui fit au moins 89 morts selon l’ONU. En 2025, les ADF ont en partie reconstitué leurs forces tandis que les forces congolaises étaient happées par la guerre contre le M23 ; une frappe contre le quartier général de Musa Baluku le 23 février 2026 a contraint son camp à s’enfoncer davantage dans la forêt, mais les attaques ont continué, et les raids du groupe ont entravé la riposte à une épidémie d’Ebola déclarée en Ituri en mai 2026. En une semaine, en novembre 2026, les ADF ont tué au moins 44 civils dans le territoire de Mambasa, en Ituri, quelques jours après avoir tué 66 personnes au Nord-Kivu, selon des sources humanitaires et sécuritaires, et Africanews a rapporté que les armées ougandaise et congolaise n’avaient remporté contre elles aucun succès significatif. Le nombre total de morts depuis 1996 se chiffre en milliers, pour la plupart des civils congolais ; les chiffres exacts ne sont pas connus."
