# French translations of the catalogue text (wave 7); step bodies follow later.
Afghan Civil War of 1863–1869: Guerre civile afghane de 1863–1869
The war of succession among the sons of Dost Mohammad Khan, who died at Herat on 9 June 1863, days after taking the city. His chosen heir, Sher Ali Khan, was challenged by his half-brothers Mohammad Afzal Khan and Mohammad Azam Khan and by Afzal’s son Abdur Rahman Khan, and by his own full brother Mohammad Amin Khan at Kandahar. Sher Ali defeated and killed Amin in 1865, but lost his heir in the same battle; Abdur Rahman and Azam then beat him at Sheikhabad in 1866 and at Kalat-i-Ghilzai in 1867, and Afzal and then Azam ruled in Kabul. After Afzal’s death in 1867 the victors quarrelled, and Sher Ali, with his son Yaqub Khan, retook Kandahar in May 1868 and Kabul in September. Azam fled to Persia and Abdur Rahman to Russian Turkestan, from where he returned to take the throne in 1880. British India stayed out of the war and recognised whoever held Kabul.: La guerre de succession entre les fils de Dost Mohammad Khan, mort à Hérat le 9 juin 1863, quelques jours après avoir pris la ville. Son héritier désigné, Sher Ali Khan, fut contesté par ses demi-frères Mohammad Afzal Khan et Mohammad Azam Khan, par Abdur Rahman Khan, fils d’Afzal, et à Kandahar par son propre frère germain, Mohammad Amin Khan. Sher Ali vainquit et tua Amin en 1865, mais perdit son héritier dans la même bataille ; Abdur Rahman et Azam le battirent ensuite à Sheikhabad en 1866 et à Kalat-i-Ghilzai en 1867, et Afzal, puis Azam, régnèrent à Kaboul. Après la mort d’Afzal en 1867, les vainqueurs se querellèrent, et Sher Ali, avec son fils Yaqub Khan, reprit Kandahar en mai 1868 et Kaboul en septembre. Azam s’enfuit en Perse et Abdur Rahman au Turkestan russe, d’où il revint prendre le trône en 1880. L’Inde britannique resta à l’écart de la guerre et reconnut quiconque tenait Kaboul.
