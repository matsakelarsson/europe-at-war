# French translations of the catalogue text (wave 7); step bodies follow later.
Afghan civil war of 1928–1929: Guerre civile afghane de 1928–1929
A civil war that overthrew King Amanullah Khan, whose reforms, among them women’s rights, Western dress and conscription, had angered tribal and religious leaders. It began with a revolt of the Shinwari tribe around Jalalabad in November 1928. Habibullah Kalakani, a Tajik from the Koh-i Daman north of Kabul whose followers are known as the Saqqawists, attacked Kabul in December and took it on 17 January 1929, after Amanullah had abdicated and fled to Kandahar. Habibullah ruled as emir for nine months and took Kandahar in June, after Amanullah had left the country, while a Soviet detachment briefly entered the north. Nadir Khan, a former commander-in-chief, raised the tribes of the south-east and took Kabul on 13 October 1929. He became king, and Habibullah was executed in November. Each side is estimated to have lost about 7,500 fighters.: Une guerre civile qui renversa le roi Amanullah Khan, dont les réformes, parmi lesquelles les droits des femmes, les vêtements occidentaux et la conscription, avaient irrité les chefs tribaux et religieux. Elle commença par une révolte de la tribu shinwari autour de Jalalabad en novembre 1928. Habibullah Kalakani, un Tadjik du Koh-i Daman, au nord de Kaboul, dont les partisans sont appelés saqqawistes, attaqua Kaboul en décembre et s’en empara le 17 janvier 1929, après qu’Amanullah eut abdiqué et se fut enfui à Kandahar. Habibullah régna comme émir pendant neuf mois et prit Kandahar en juin, après qu’Amanullah eut quitté le pays, tandis qu’un détachement soviétique pénétrait brièvement dans le nord. Nadir Khan, ancien commandant en chef, souleva les tribus du sud-est et prit Kaboul le 13 octobre 1929. Il devint roi, et Habibullah fut exécuté en novembre. On estime que chaque camp perdit environ 7 500 combattants.
