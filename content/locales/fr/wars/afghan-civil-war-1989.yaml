# French translations of the catalogue text (wave 7); step bodies follow later.
Afghan Civil War (1989–1992): Guerre civile afghane (1989–1992)
The war between the communist government of President Mohammad Najibullah and the mujahideen after the last Soviet troops left Afghanistan in February 1989. Most observers expected the government to fall quickly, but its army, militias and air force, still supplied by the Soviet Union, beat off a mujahideen assault on Jalalabad in 1989, and Najibullah survived a coup attempt by his own defence minister in 1990. The mujahideen took their first city, Khost, in March 1991. When the Soviet Union collapsed at the end of 1991, its aid stopped; Najibullah’s northern militia commanders, led by Abdul Rashid Dostum, went over to Ahmad Shah Massoud, and in April 1992 the government fell. Najibullah took refuge in the UN compound in Kabul, and the mujahideen parties proclaimed the Islamic State of Afghanistan, but they soon fell to fighting among themselves.: La guerre entre le gouvernement communiste du président Mohammad Najibullah et les moudjahidines après le départ des dernières troupes soviétiques d’Afghanistan, en février 1989. La plupart des observateurs s’attendaient à une chute rapide du gouvernement, mais son armée, ses milices et son aviation, toujours ravitaillées par l’Union soviétique, repoussèrent un assaut des moudjahidines contre Jalalabad en 1989, et Najibullah survécut en 1990 à une tentative de coup d’État de son propre ministre de la Défense. Les moudjahidines prirent leur première ville, Khost, en mars 1991. Quand l’Union soviétique s’effondra à la fin de 1991, son aide cessa ; les commandants des milices de Najibullah dans le nord, menés par Abdul Rashid Dostum, passèrent du côté d’Ahmad Shah Massoud, et en avril 1992 le gouvernement tomba. Najibullah se réfugia dans l’enceinte de l’ONU à Kaboul, et les partis moudjahidines proclamèrent l’État islamique d’Afghanistan, mais ils ne tardèrent pas à se battre entre eux.
