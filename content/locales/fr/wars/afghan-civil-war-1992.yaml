# French translations of the catalogue text (wave 7); step bodies follow later.
Afghan Civil War (1992–1996): Guerre civile afghane (1992–1996)
The war among the victorious mujahideen factions after the fall of Najibullah’s government. The Islamic State of Afghanistan, led by President Burhanuddin Rabbani and his defence minister Ahmad Shah Massoud, held Kabul, but Gulbuddin Hekmatyar’s Hezb-e Islami, backed by Pakistan, shelled the capital from the south, and the Hazara Shia party Hezb-e Wahdat and, from 1994, Abdul Rashid Dostum’s Uzbek Junbish-e Milli also fought the government in shifting alliances. Much of Kabul, which had come through the Soviet war largely intact, was destroyed, and tens of thousands of its people were killed. In 1994 a new movement of religious students, the Taliban, emerged in Kandahar, disarmed local warlords with Pakistani support, and swept across the south and west, taking Herat in 1995 and Kabul on 27 September 1996, when they hanged Najibullah.: La guerre entre les factions moudjahidines victorieuses après la chute du gouvernement de Najibullah. L’État islamique d’Afghanistan, dirigé par le président Burhanuddin Rabbani et son ministre de la Défense Ahmad Shah Massoud, tenait Kaboul, mais le Hezb-e-Islami de Gulbuddin Hekmatyar, soutenu par le Pakistan, bombardait la capitale depuis le sud, et le parti chiite hazara Hezb-e-Wahdat ainsi que, à partir de 1994, le Junbish-e-Milli ouzbek d’Abdul Rashid Dostum combattirent eux aussi le gouvernement, au gré d’alliances changeantes. Une grande partie de Kaboul, sortie presque intacte de la guerre soviétique, fut détruite, et des dizaines de milliers de ses habitants furent tués. En 1994, un nouveau mouvement d’étudiants en religion, les talibans, apparut à Kandahar, désarma les seigneurs de guerre locaux avec le soutien du Pakistan et déferla sur le sud et l’ouest, prenant Hérat en 1995 et Kaboul le 27 septembre 1996 ; ils y pendirent Najibullah.
