# French translations of the catalogue text (wave 7); step bodies follow later.
Afghan Civil War (1996–2001): Guerre civile afghane (1996–2001)
The war between the Taliban’s Islamic Emirate of Afghanistan, which took Kabul in September 1996, and the Northern Alliance (United Islamic Front), a coalition of the forces of Ahmad Shah Massoud, Abdul Rashid Dostum, the Hazara party Hezb-e Wahdat and others, which kept the internationally recognised government of Burhanuddin Rabbani alive in the north-east. The Taliban, supported by Pakistan and joined by thousands of foreign fighters including Osama bin Laden’s al-Qaeda, took Mazar-i-Sharif in 1998 after a failed attempt the year before, and by 2001 held about 85 to 90 per cent of the country. Both sides committed massacres of prisoners and civilians, often along ethnic lines. Massoud was killed by al-Qaeda suicide bombers two days before the attacks of 11 September 2001, and the war merged into the US-led invasion that began on 7 October 2001.: La guerre entre l’Émirat islamique d’Afghanistan des talibans, qui avait pris Kaboul en septembre 1996, et l’Alliance du Nord (Front islamique uni), coalition des forces d’Ahmad Shah Massoud, d’Abdul Rashid Dostum, du parti hazara Hezb-e-Wahdat et d’autres, qui maintint en vie dans le nord-est le gouvernement internationalement reconnu de Burhanuddin Rabbani. Les talibans, soutenus par le Pakistan et rejoints par des milliers de combattants étrangers, dont al-Qaïda d’Oussama ben Laden, prirent Mazar-i-Sharif en 1998 après une tentative manquée l’année précédente et, en 2001, tenaient environ 85 à 90 % du pays. Les deux camps commirent des massacres de prisonniers et de civils, souvent sur des bases ethniques. Massoud fut tué par des kamikazes d’al-Qaïda deux jours avant les attentats du 11 septembre 2001, et la guerre se fondit dans l’invasion menée par les États-Unis, qui commença le 7 octobre 2001.
