# French translations of the catalogue text (wave 8); step bodies follow later.
Afghan–Sikh Wars: Guerres afghano-sikhes
The wars in which Maharaja Ranjit Singh’s Sikh Empire took the Durrani Empire’s provinces east of the Khyber Pass. As the Durrani state broke up in civil war, the Sikhs bought the fortress of Attock in 1813 and held it against the Afghan wazir Fateh Khan, stormed Multan in 1818 and conquered Kashmir in 1819. After a hard-fought victory over the Pashtun tribes and the Barakzai sardar Azim Khan at Nowshera in 1823, Peshawar became a Sikh tributary, and in 1834 it was annexed. Emir Dost Mohammad Khan of Kabul tried twice to win it back, in 1835 without a battle and in 1837 at Jamrud, where the Sikh general Hari Singh Nalwa was killed but the Afghans failed to take the fort. The loss of Peshawar shaped Afghan relations with Britain and led into the First Anglo-Afghan War.: Les guerres au cours desquelles l’Empire sikh du maharaja Ranjit Singh enleva à l’Empire durrani ses provinces situées à l’est de la passe de Khyber. Tandis que l’État durrani se disloquait dans la guerre civile, les Sikhs achetèrent la forteresse d’Attock en 1813 et la tinrent face au vizir afghan Fateh Khan, prirent Multan d’assaut en 1818 et conquirent le Cachemire en 1819. Après une victoire âprement disputée sur les tribus pachtounes et le sardar barakzai Azim Khan à Nowshera en 1823, Peshawar devint tributaire des Sikhs, qui l’annexèrent en 1834. L’émir Dost Mohammad Khan de Kaboul tenta à deux reprises de reprendre la ville, en 1835 sans livrer bataille et en 1837 à Jamrud, où le général sikh Hari Singh Nalwa fut tué mais où les Afghans ne parvinrent pas à prendre le fort. La perte de Peshawar façonna les relations de l’Afghanistan avec la Grande-Bretagne et mena à la première guerre anglo-afghane.
