# French translations of the catalogue text (wave 8); step bodies follow later.
Afghanistan–Pakistan conflict: Conflit afghano-pakistanais
? The war between Pakistan and Afghanistan’s Taliban government, which Pakistan accuses of sheltering the Pakistani Taliban (TTP) and other groups that attack it from Afghan soil; the Taliban deny this. In October 2025 Pakistani air strikes in Kabul, aimed at the TTP’s leader, were followed by Afghan attacks on Pakistani border posts and a week of the heaviest border fighting in decades, ended by a ceasefire mediated by Qatar and Turkey on 19 October. Talks in Istanbul failed and the border stayed closed. In February 2026, after a wave of bombings in Pakistan, Pakistan struck targets across Afghanistan, including Kabul, Kandahar and Bagram, and declared “open war”. Fighting along the border, Pakistani air and drone strikes and Afghan drone attacks continued through 2026, interrupted only by short truces at the Eid holidays, while talks mediated by China and others brought no settlement. By October 2026 the UN counted more than 1,100 Afghan civilians killed or wounded, and about 115,000 Afghans had been displaced. Last updated 27 November 2026.
: "La guerre entre le Pakistan et le gouvernement taliban d’Afghanistan, que le Pakistan accuse d’abriter les talibans pakistanais (TTP) et d’autres groupes qui l’attaquent depuis le sol afghan, ce que les talibans démentent. En octobre 2025, des frappes aériennes pakistanaises sur Kaboul, visant le chef du TTP, furent suivies d’attaques afghanes contre des postes frontaliers pakistanais et d’une semaine des combats frontaliers les plus violents depuis des décennies, à laquelle mit fin un cessez-le-feu conclu le 19 octobre grâce à la médiation du Qatar et de la Turquie. Les pourparlers d’Istanbul échouèrent et la frontière resta fermée. En février 2026, après une vague d’attentats au Pakistan, celui-ci frappa des cibles dans tout l’Afghanistan, notamment à Kaboul, Kandahar et Bagram, et déclara une « guerre ouverte ». Les combats le long de la frontière, les frappes aériennes et les frappes de drones pakistanaises et les attaques de drones afghanes se poursuivirent tout au long de 2026, interrompus seulement par de courtes trêves pendant les fêtes de l’Aïd, tandis que des pourparlers menés sous la médiation de la Chine et d’autres pays n’aboutissaient à aucun règlement. En octobre 2026, l’ONU dénombrait plus de 1 100 civils afghans tués ou blessés, et quelque 115 000 Afghans avaient été déplacés. Dernière mise à jour : 27 novembre 2026."
