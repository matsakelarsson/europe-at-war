# French translations of the catalogue text (wave 12); step bodies follow later.
Agacher Strip War: Guerre de la bande de l’Agacher
? Two short border wars between Mali and Upper Volta (Burkina Faso from 1984) over the Agacher, a strip of semi-desert about 160 km long on their common border in the north-east of Burkina Faso, with seasonal pools along the Béli river that mattered to herders and, it was believed, minerals underground. The colonial boundary between French Sudan and Upper Volta had never been marked on the ground, and both states claimed the strip. Fighting in November and December 1974 ended in African mediation and an agreement to have the line studied. In December 1985, after a Burkinabé census reached villages in the strip, Mali attacked on Christmas Day with armour and aircraft and took most of the Agacher; Burkinabé aircraft bombed Sikasso. A ceasefire arranged by the West African defence pact ANAD took effect on 30 December. Estimates of the dead range from about 60 to about 140, soldiers and civilians. Both states had already put the dispute to the International Court of Justice, whose chamber on 22 December 1986 divided the strip roughly in two, giving Mali the more populated west and Burkina Faso the east along the Béli; both accepted the ruling.
: Deux courtes guerres frontalières entre le Mali et la Haute-Volta (le Burkina Faso à partir de 1984) pour l’Agacher, une bande semi-désertique d’environ 160 km de long sur leur frontière commune, dans le nord-est du Burkina Faso, où des mares saisonnières le long du Béli étaient précieuses pour les éleveurs et dont le sous-sol renfermait, croyait-on, des minerais. La limite coloniale entre le Soudan français et la Haute-Volta n’avait jamais été matérialisée sur le terrain, et les deux États revendiquaient la bande. Les combats de novembre et décembre 1974 prirent fin grâce à une médiation africaine et à un accord prévoyant l’étude du tracé. En décembre 1985, après qu’un recensement burkinabé eut atteint des villages de la bande, le Mali attaqua le jour de Noël avec des blindés et des avions et s’empara de la plus grande partie de l’Agacher ; l’aviation burkinabé bombarda Sikasso. Un cessez-le-feu obtenu par le pacte de défense ouest-africain ANAD entra en vigueur le 30 décembre. Les estimations du nombre de morts, soldats et civils, vont d’environ 60 à environ 140. Les deux États avaient déjà soumis le différend à la Cour internationale de justice, dont une chambre partagea la bande à peu près en deux le 22 décembre 1986, attribuant au Mali l’ouest, plus peuplé, et au Burkina Faso l’est, le long du Béli ; les deux pays acceptèrent l’arrêt.
