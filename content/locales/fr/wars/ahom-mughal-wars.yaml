# French translations of the catalogue text (wave 8); step bodies follow later.
Ahom–Mughal wars: Guerres entre Ahoms et Moghols
The long struggle between the Mughal Empire and the Ahom kingdom of the Brahmaputra valley, in today’s Assam, for the borderland of Kamrup and the town of Guwahati. The wars began when the Mughals, having conquered the Koch kingdom of Hajo, pushed up the river in 1615. After two decades of frontier fighting, the Treaty of Asurar Ali in 1639 left Guwahati to the Mughals. In 1661–62 Mir Jumla, governor of Bengal, invaded with a large army and fleet and took the Ahom capital, Garhgaon, but the monsoon, disease and Ahom raids wore his army down, and the Treaty of Ghilajharighat (1663) only bought a tribute and western Assam. The Ahoms took Guwahati back in 1667 under their general Lachit Borphukan, held it against the army of Raja Ram Singh of Amber, and won a decisive river battle at Saraighat in 1671. Guwahati was betrayed to the Mughals in 1679, but in 1682 the Ahoms under King Gadadhar Singha won it back at Itakhuli and pushed the Mughal frontier back to the Manas river, where it stayed.: La longue lutte entre l’Empire moghol et le royaume ahom de la vallée du Brahmapoutre, dans l’actuel Assam, pour la région frontalière du Kamrup et la ville de Guwahati. Les guerres commencèrent lorsque les Moghols, après avoir conquis le royaume koch de Hajo, remontèrent le fleuve en 1615. Après deux décennies de combats frontaliers, le traité d’Asurar Ali, en 1639, laissa Guwahati aux Moghols. En 1661–62, Mir Jumla, gouverneur du Bengale, envahit le pays avec une grande armée et une flotte et prit la capitale ahom, Garhgaon, mais la mousson, les maladies et les raids des Ahoms usèrent son armée, et le traité de Ghilajharighat (1663) ne rapporta aux Moghols qu’un tribut et l’ouest de l’Assam. Les Ahoms reprirent Guwahati en 1667 sous la conduite de leur général Lachit Borphukan, la tinrent face à l’armée du raja Ram Singh d’Amber et remportèrent une bataille fluviale décisive à Saraighat en 1671. Guwahati fut livrée aux Moghols par trahison en 1679, mais en 1682 les Ahoms, menés par le roi Gadadhar Singha, la reprirent à Itakhuli et repoussèrent la frontière moghole jusqu’à la rivière Manas, où elle se maintint.
