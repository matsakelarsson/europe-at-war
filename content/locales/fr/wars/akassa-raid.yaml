# French translations of the catalogue text (wave 13); step bodies follow later.
Akassa raid: Raid d’Akassa
? An attack by the Nembe kingdom, also called Brass, on the Royal Niger Company in the Niger Delta, and the British reprisal that followed. Nembe was an Ijaw trading state on the eastern side of the delta, inside the British Oil Rivers Protectorate since 1884. The Royal Niger Company, which held a British charter over the Niger from 1886, used its rules and licences to keep the river trade for itself and shut out the Nembe traders, who had sold palm oil in the interior markets for generations. In January 1895 King Frederick William Koko, who had recently renounced Christianity, led more than a thousand men in some 22 war canoes against the company’s headquarters at Akassa, at the mouth of the Nun river. At dawn on 29 January they destroyed its warehouses, offices and machinery, killed a number of its African workers and carried about 70 captives back to Nembe. Koko offered to exchange them for a return to free trade, writing that his quarrel was with the company and not with Queen Victoria; when the British refused, more than forty of the captives were killed in a ritual, and later reports said they had been eaten. On 22 February a Royal Navy force, which had left Brass two days earlier, attacked and burnt Nembe, and many more people died in a smallpox epidemic that followed. Koko escaped. The inquiry of Sir John Kirk, published in 1896, confirmed the killings but also upheld many of Nembe’s complaints against the company. Koko refused the settlement offered and died in hiding in 1898. Criticism of the company after Akassa contributed to the revocation of its charter in 1899; on 1 January 1900 its territories passed to the British crown.
: Une attaque du royaume de Nembe, appelé aussi Brass, contre la Royal Niger Company dans le delta du Niger, et les représailles britanniques qui suivirent. Nembe était un État marchand ijaw de l’est du delta, inclus depuis 1884 dans le protectorat britannique des Oil Rivers. La Royal Niger Company, qui détenait depuis 1886 une charte britannique sur le Niger, se servait de ses règlements et de ses licences pour se réserver le commerce fluvial et en exclure les marchands de Nembe, qui vendaient depuis des générations de l’huile de palme sur les marchés de l’intérieur. En janvier 1895, le roi Frederick William Koko, qui venait de renier le christianisme, mena plus d’un millier d’hommes à bord d’environ 22 pirogues de guerre contre le siège de la compagnie à Akassa, à l’embouchure du Nun. À l’aube du 29 janvier, ils détruisirent ses entrepôts, ses bureaux et ses machines, tuèrent un certain nombre de ses employés africains et ramenèrent à Nembe environ 70 captifs. Koko proposa de les échanger contre un retour au libre-échange, écrivant que sa querelle l’opposait à la compagnie et non à la reine Victoria ; devant le refus britannique, plus de quarante captifs furent tués lors d’un rituel, et des rapports ultérieurs affirmèrent qu’ils avaient été mangés. Le 22 février, une force de la Royal Navy, partie de Brass deux jours plus tôt, attaqua et incendia Nembe, et beaucoup d’autres personnes moururent lors de l’épidémie de variole qui suivit. Koko s’échappa. L’enquête de sir John Kirk, publiée en 1896, confirma les meurtres mais donna aussi raison à Nembe sur nombre de ses griefs contre la compagnie. Koko refusa l’accord proposé et mourut caché en 1898. Les critiques visant la compagnie après Akassa contribuèrent à la révocation de sa charte en 1899 ; le 1er janvier 1900, ses territoires passèrent à la Couronne britannique.
