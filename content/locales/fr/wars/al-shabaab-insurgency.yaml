# French translations of the catalogue text (wave 12); step bodies follow later.
Al-Shabaab insurgency: Insurrection des Chabab
? The war of al-Shabaab, a Somali jihadist movement allied to al-Qaeda since 2012, against Somalia’s internationally backed governments, African Union peacekeepers, Kenya, Ethiopia and the United States. After the Ethiopian withdrawal in January 2009 al-Shabaab held most of southern and central Somalia and fought the government for Mogadishu, until African Union troops drove it out of the city in August 2011, the year a famine killed some 258,000 people in its areas and beyond. Kenyan and Ethiopian forces then entered Somalia, and by 2014 the African Union mission (AMISOM) and the Somali army had taken the main towns, including Kismayo and Barawe. Al-Shabaab fell back to the countryside, which it still largely governs and taxes, and fought on with ambushes, assaults on African Union bases and bombings in Mogadishu, among them the truck bomb of 14 October 2017 that killed 587 people, and in Uganda and Kenya, at the Westgate mall in Nairobi (2013) and Garissa University (2015). A government offensive with clan militias in 2022–2023 retook parts of central Somalia, but al-Shabaab won most of them back in 2025. A smaller branch of the Islamic State fights in Puntland. In late 2026 the war continues alongside a deep political crisis in Mogadishu.
: La guerre que mènent les Chabab, mouvement djihadiste somalien allié à al-Qaïda depuis 2012, contre les gouvernements somaliens soutenus par la communauté internationale, les forces de maintien de la paix de l’Union africaine, le Kenya, l’Éthiopie et les États-Unis. Après le retrait éthiopien de janvier 2009, les Chabab tinrent la plus grande partie du sud et du centre de la Somalie et disputèrent Mogadiscio au gouvernement, jusqu’à ce que les troupes de l’Union africaine les chassent de la ville en août 2011, année où une famine fit quelque 258 000 morts dans les zones qu’ils contrôlaient et au-delà. Les forces kényanes et éthiopiennes entrèrent ensuite en Somalie et, en 2014, la mission de l’Union africaine (AMISOM) et l’armée somalienne avaient pris les principales villes, dont Kismayo et Barawe. Les Chabab se replièrent dans les campagnes, qu’ils administrent et taxent encore en grande partie, et poursuivirent la lutte par des embuscades, des assauts contre les bases de l’Union africaine et des attentats à Mogadiscio, dont celui au camion piégé du 14 octobre 2017, qui fit 587 morts, ainsi qu’en Ouganda et au Kenya, au centre commercial Westgate de Nairobi (2013) et à l’université de Garissa (2015). En 2022–2023, une offensive gouvernementale menée avec des milices claniques reprit une partie du centre de la Somalie, mais les Chabab en reconquirent l’essentiel en 2025. Une branche plus réduite de l’État islamique combat au Puntland. Fin 2026, la guerre se poursuit sur fond de profonde crise politique à Mogadiscio.
