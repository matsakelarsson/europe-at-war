# French translations of the catalogue text (wave 12); step bodies follow later.
Alaouite rise to power: Avènement des Alaouites
? The wars in which Moulay al-Rashid, a prince of the Alaouite sharifs of Tafilalt, reunited Morocco after the fall of the Saadians and founded the dynasty that still reigns. By 1659, when the last Saadian sultan was murdered, the country was divided between the Dila’iyya, a Sufi lodge of the Middle Atlas whose leader had been proclaimed sultan in Fez; the war leader al-Khadir Ghailan in the north-west; the Shabana Arabs in Marrakesh; the Semlali lords of Iligh in the Sous; the corsair town of Salé; and the Alaouites of Tafilalt under Muhammad ibn Sharif. Al-Rashid, who had refused to accept his half-brother Muhammad and fled, built a following around Taza and the east, and in August 1664 Muhammad was killed fighting him at Angad. Al-Rashid then took Sijilmasa (1665) and Fez (June 1666), defeated Ghailan, destroyed the zawiya of Dila (June 1668), took Marrakesh (July 1668) and subdued the Sous (1670). He died in Marrakesh in April 1672 after a fall from his horse, and his half-brother Moulay Ismail succeeded him.
: Les guerres par lesquelles Moulay al-Rashid, prince des chérifs alaouites du Tafilalet, réunifia le Maroc après la chute des Saadiens et fonda la dynastie qui règne encore aujourd’hui. En 1659, lorsque le dernier sultan saadien fut assassiné, le pays était partagé entre la Dila’iyya, une zaouïa soufie du Moyen Atlas dont le chef avait été proclamé sultan à Fès ; le chef de guerre al-Khadir Ghailan, dans le nord-ouest ; les Arabes Shabana, à Marrakech ; les seigneurs semlali d’Iligh, dans le Souss ; la ville corsaire de Salé ; et les Alaouites du Tafilalet, sous Muhammad ibn Sharif. Al-Rashid, qui avait refusé de se soumettre à son demi-frère Muhammad et s’était enfui, rassembla des partisans autour de Taza et dans l’est, et en août 1664 Muhammad fut tué en le combattant à Angad. Al-Rashid prit ensuite Sijilmassa (1665) et Fès (juin 1666), vainquit Ghailan, détruisit la zaouïa de Dila (juin 1668), prit Marrakech (juillet 1668) et soumit le Souss (1670). Il mourut à Marrakech en avril 1672 des suites d’une chute de cheval, et son demi-frère Moulay Ismail lui succéda.
