"Albanian revolts of 1910–1912": "Révoltes albanaises de 1910-1912"
"A series of risings in the Albanian lands of the Ottoman Empire against the Young Turk government’s centralising policies, taxes, conscription and disarmament campaigns – in Kosovo in 1910, crushed by an Ottoman army that burned villages and closed Albanian schools; among the Catholic highlanders of Malësia in 1911; and in a general revolt in 1912, when the rebels took Skopje. On 4 September 1912 the government accepted most of the rebels’ demands, a settlement overtaken weeks later by the First Balkan War.": "Une série de montées dans les terres albanaises de l’Empire ottoman contre le gouvernement jeune turkmène centralise les politiques, les impôts, la conscription et les campagnes de désarmement – au Kosovo en 1910, écrasé par une armée ottomane qui a brûlé des villages et fermé des écoles albanaises ; parmi les hauts-landers catholiques de Malésia en 1911 ; et dans une révolte générale en 1912, quand les rebelles ont pris Skopje. Le 4 septembre 1912, le gouvernement accepta la plupart des revendications des rebelles, un règlement dépassé quelques semaines plus tard par la Première Guerre balkanique."
"Leaders included Isa Boletini in 1910 and Hasan Prishtina in 1912. The 1911 rising in Malësia, also called the Malissori uprising, won an amnesty and concessions.": "Parmi les dirigeants se trouvaient Isa Boletini en 1910 et Hasan Prishtina en 1912. La montée de 1911 en Malès, également appelée le soulèvement malaisori, a remporté une amnistie et des concessions."
