"1211–1218": "1211–1218"
"Simon turned on Raymond VI himself, whom the legates had excommunicated again. He failed to take Toulouse in 1211, but by 1212 he held most of the county outside the city. King Peter II of Aragon, fresh from the great victory over the Almohads at Las Navas de Tolosa, was overlord of many of the southern lords and Raymond’s brother-in-law, and he crossed the Pyrenees to defend them. In September 1213 he and Raymond, with the counts of Foix and Comminges, were besieging the little town of Muret when Simon slipped in with his knights. On 12 September they charged out, Peter was killed in the mêlée, and the southern army broke; many men drowned in the Garonne.": "Simon se tourna vers Raymond VI lui-même, que les légats avaient de nouveau excommunié. Il ne prit pas Toulouse en 1211, mais en 1212 il tenait la majeure partie du comté hors de la ville. Le roi Pierre II d’Aragon, tout frais de la grande victoire sur les Almohades à Las Navas de Tolosa, était le seigneur de beaucoup des seigneurs du sud et beau-frère de Raymond, et il traversa les Pyrénées pour les défendre. En septembre 1213, lui et Raymond, avec les comtes de Foix et Comminges, assiégeaient la petite ville de Muret quand Simon s’en alla avec ses chevaliers. Le 12 septembre, ils chargent Pierre de mort dans la mêlée, et l’armée du sud éclate ; beaucoup d’hommes se noyent dans la Garonne."
"In 1215 the Fourth Lateran Council gave Raymond’s lands to Simon. But Raymond and his son, the future Raymond VII, came back. In 1216 the young Raymond took Beaucaire on the Rhône and held it against Simon, and in September 1217 Raymond VI was welcomed back into Toulouse. Simon besieged the city for nine months. On 25 June 1218, as he went to help his wounded brother, he was killed by a stone from a siege engine, worked, says the Song of the crusade, by the ladies, girls and women of Toulouse. His son Amaury lifted the siege a month later.": "Mais Raymond et son fils, le futur Raymond VII, reviennent. En 1216, le jeune Raymond prend Beaucaire sur le Rhône et la tient contre Simon, et en septembre 1217 Raymond VI est accueilli à Toulouse. Simon assiégea la ville pendant neuf mois. Le 25 juin 1218, alors qu’il allait aider son frère blessé, il a été tué par une pierre d’un moteur de siège, travaillé, dit le chant de la croisade, par les dames, les filles et les femmes de Toulouse. Son fils Amaury a levé le siège un mois plus tard."
