"1219–1229": "1219–1229"
"In 1219 Prince Louis of France led an army south and took Marmande, where the crusaders massacred the townspeople, but he failed before Toulouse. Raymond VI died in 1222, and his son Raymond VII and the count of Foix won back most of the south; in 1224 Amaury de Montfort gave up Carcassonne and ceded his claims to the crown. In 1226 Louis, now King Louis VIII, came again with a royal crusade down the Rhône. Avignon, an imperial city, closed its gates and was besieged from 10 June until it surrendered on 9 September, and most of Languedoc submitted without a fight. On the way home Louis died of dysentery at Montpensier on 8 November.": "En 1219, le prince Louis de France dirigea une armée au sud et prit Marmande, où les croisés massacrérent les habitants, mais il échoua avant Toulouse. Raymond VI mourut en 1222, et son fils Raymond VII et le comte de Foix remportèrent la plus grande partie du sud ; en 1224 Amaury de Montfort abandonna Carcassonne et ceéda ses prétentions à la couronne. En 1226 Louis, aujourd'hui roi Louis VIII, est revenu avec une croisade royale dans le Rhône. Avignon, ville impériale, a fermé ses portes et a été assiégé du 10 juin jusqu’à ce qu’il se rende le 9 septembre, et la plupart du Languedoc soumis sans un combat."
"The royal commander Humbert de Beaujeu kept up the war, laying waste the country around Toulouse, until Raymond VII made peace. By the Treaty of Paris, agreed at Meaux and sealed in Paris on 12 April 1229, the day Raymond did penance at Notre-Dame, he kept Toulouse for life but gave up his eastern lands to the crown, and his daughter Joan was to marry Alphonse, a brother of Louis IX, with the rest of the county to pass to them. When both died childless in 1271, it went to the crown. The Inquisition, set up in the early 1230s, hunted the remaining Cathars; in 1244 more than 200 were burned after the fall of their fortress of Montségur.": "Le commandant royal Humbert de Beaujeu a poursuivi la guerre, jetant le pays autour de Toulouse, jusqu’à ce que Raymond VII fasse la paix. Par le traité de Paris, convenu à Meaux et scellé à Paris le 12 avril 1229, le jour où Raymond pénétrait à Notre-Dame, il gardait Toulouse pour la vie mais abandonnait ses terres orientales à la couronne, et sa fille Joan allait épouser Alphonse, frère de Louis IX, avec le reste du comté pour passer à eux. L’Inquisition, établie au début des années 1230, chassait les Cathares restants ; en 1244 plus de 200 furent brûlés après la chute de leur forteresse de Montségur."
