"1208–1211": "1208–1211"
"In the towns and castles of Languedoc many people followed the Cathars, and local lords, among them Count Raymond VI of Toulouse, tolerated them. On 14 January 1208 the papal legate Pierre de Castelnau was murdered near Saint-Gilles by a man thought to be in Raymond’s service, and Pope Innocent III called a crusade, promising the crusaders the lands of heretics and their protectors. Raymond did public penance at Saint-Gilles and joined the crusade himself, so the army of northern barons that left Lyon on 24 June 1209 turned against his nephew, Raymond-Roger Trencavel, viscount of Béziers and Carcassonne.": "Dans les villes et châteaux du Languedoc beaucoup de gens suivirent les Cathares, et les seigneurs locaux, parmi lesquels le comte Raymond VI de Toulouse, les tollé. Le 14 janvier 1208, le légat papal Pierre de Castelnau fut assassiné près de Saint-Gilles par un homme pensé pour être au service de Raymond, et le pape Innocent III appela une croisade, promettant aux croisés les terres des hérétiques et leurs protecteurs. Raymond fit la pénitence publique à Saint-Gilles et se joignit à la croisade lui-même, de sorte que l’armée des barons du nord qui quittèrent Lyon le 24 juin 1209 tourna contre son neveu, Raymond-Roger Trencavel, vicomte de Béziers et Carcassonne."
"On 22 July, after a sortie by the defenders, the crusaders’ camp followers broke into Béziers and the army sacked it, killing men, women and children, many of them in the churches where they had taken refuge. The legates told the pope that almost 20,000 died, surely an exaggeration. A generation later a German monk put in the mouth of the abbot Arnaud Amalric the words “Kill them all; God will know his own.” Carcassonne was besieged from 1 August; Trencavel was seized while negotiating, and the city surrendered on 15 August. Simon de Montfort, a baron from near Paris, took his lands. At Minerve in 1210 and Lavaur in 1211 hundreds of Cathars were burned.": "Le 22 juillet, après une sortie des défenseurs, les partisans du camp de croisés ont pénétré dans Béziers et l’armée l’a renvoyé, tuant des hommes, des femmes et des enfants, dont beaucoup dans les églises où ils s’étaient réfugiés. Les légats ont dit au pape que près de 20 000 personnes sont mortes, sûrement une exagération. Une génération plus tard, un moine allemand mit dans la bouche de l’abbé Arnaud Amalric les mots « Kill them all ; God will know s his. » Carcassonne fut assiégé à partir du 1er août ; Trencavel fut saisi lors des négociations, et la ville se rendit le 15 août. Simon de Montfort, baron près de Paris, prit ses terres. À Minerve en 1210 et à Lavaur en 1211, des centaines de Cathares furent brûlés."
