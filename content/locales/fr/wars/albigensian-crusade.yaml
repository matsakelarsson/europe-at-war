# Some French text was translated automatically.
"Albigensian Crusade": "Croisade des albigeois"
"A crusade called by Pope Innocent III against the Cathar heretics of Languedoc and the southern lords who tolerated them. Northern French barons led by Simon de Montfort massacred Béziers and took the lands of the Trencavel family and most of the County of Toulouse, but the southerners fought back, and only the royal crusade of Louis VIII forced Count Raymond VII to accept the Treaty of Paris in 1229, which brought Languedoc under the French crown.": "Une croisade appelée par le Pape Innocent III contre les hérétiques cathares du Languedoc et les seigneurs du sud qui les ont tolérés. Les barons du nord de la France, dirigés par Simon de Montfort, massacrent Béziers et prennent les terres de la famille Trencavel et de la plupart des comtés de Toulouse, mais les Sudistes s’y opposent, et seule la croisade royale de Louis VIII oblige le comte Raymond VII à accepter le traité de Paris en 1229, qui porte le Languedoc sous la couronne française."
"The Cathars, whom their enemies called Albigensians after the town of Albi, held that the material world was the work of an evil principle and rejected the Catholic Church and its sacraments; their leaders, the perfects, were known to their followers as good men and good women. How organised and widespread the movement was is debated by historians.": "Les Cathares, que leurs ennemis appelaient les Albigéniens après la ville d’Albi, considéraient que le monde matériel était l’œuvre d’un principe maléfique et rejetèrent l’Église catholique et ses sacrements ; leurs chefs, les parfaits, étaient connus de leurs disciples comme des hommes bons et de bonnes femmes."
"The chief sources are the crusade’s chronicler Peter of Vaux-de-Cernay, the Song of the Albigensian Crusade (in Occitan, its first part by a pro-crusade author and its second by a southern one) and William of Puylaurens.": "Les principales sources sont le chroniqueur de la croisade Pierre de Vaux-de-Cernay, le chant de la Croisade d’Albigens (à Occitan, sa première partie par un auteur pro-croisade et sa seconde par un sud) et Guillaume de Puylaurens."
