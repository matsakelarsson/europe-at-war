# French translations of the catalogue text (wave 14); step bodies follow later.
Aleutian Islands campaign: Campagne des îles Aléoutiennes
? The fight for the western Aleutian Islands of Alaska, then a US territory, during the Second World War. In June 1942, as part of the operation against Midway, Japanese carrier aircraft bombed the US base at Dutch Harbor on 3 and 4 June, and Japanese troops landed unopposed on Kiska on 6 June and on Attu on 7 June, the only US soil in the Americas occupied by a foreign enemy during the war. The Attu villagers were taken to Japan as prisoners, and the US government removed nearly 900 Unangax̂ (Aleut) people from their island villages to camps in southeast Alaska, where many died. Through the following year US and Canadian aircraft bombed the islands from bases built westward along the chain, at Adak and Amchitka, and US ships and submarines cut the Japanese supply lines; after the naval Battle of the Komandorski Islands on 26 March 1943 Japan supplied the garrisons only by submarine. In May 1943 the US 7th Infantry Division retook Attu in nearly three weeks of fighting in fog, snow and mud, ending in a mass charge by the last Japanese troops on 29 May; nearly the whole garrison of about 2,600 died. In late July Japanese ships evacuated the 5,000-man garrison of Kiska under cover of fog, unseen, and when 34,000 US and Canadian troops landed there on 15 August they found the island empty. From Attu and Shemya US aircraft raided Japan’s Kuril Islands until the end of the war.
: "La lutte pour les îles Aléoutiennes occidentales de l’Alaska, alors territoire des États-Unis, pendant la Seconde Guerre mondiale. En juin 1942, dans le cadre de l’opération contre Midway, des avions embarqués japonais bombardèrent la base américaine de Dutch Harbor les 3 et 4 juin, et des troupes japonaises débarquèrent sans rencontrer de résistance à Kiska le 6 juin et à Attu le 7 juin : ce furent les seules terres des États-Unis dans les Amériques occupées par un ennemi étranger pendant la guerre. Les villageois d’Attu furent emmenés prisonniers au Japon, et le gouvernement américain déplaça près de 900 Unangax̂ (Aléoutes) de leurs villages insulaires vers des camps du sud-est de l’Alaska, où beaucoup moururent. Pendant l’année qui suivit, des avions américains et canadiens bombardèrent les îles depuis des bases construites de plus en plus à l’ouest le long de l’archipel, à Adak et à Amchitka, et des navires et sous-marins américains coupèrent les lignes de ravitaillement japonaises ; après la bataille navale des îles Komandorski, le 26 mars 1943, le Japon ne ravitailla plus ses garnisons que par sous-marin. En mai 1943, la 7e division d’infanterie américaine reprit Attu au terme de près de trois semaines de combats dans le brouillard, la neige et la boue, qui s’achevèrent le 29 mai par une charge massive des derniers soldats japonais ; la quasi-totalité de la garnison, forte d’environ 2 600 hommes, périt. Fin juillet, des navires japonais évacuèrent à la faveur du brouillard, sans être repérés, les 5 000 hommes de la garnison de Kiska, et lorsque 34 000 soldats américains et canadiens y débarquèrent le 15 août, ils trouvèrent l’île vide. Depuis Attu et Shemya, des avions américains attaquèrent les îles Kouriles japonaises jusqu’à la fin de la guerre."
