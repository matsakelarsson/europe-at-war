# French translations of the catalogue text (wave 12); step bodies follow later.
Algerian Civil War: Guerre civile algérienne
? "The war between the Algerian state and armed Islamist groups that followed the army’s cancellation of the elections of 1991–1992, known in Algeria as the black decade. After riots in October 1988 ended the FLN’s single-party rule, the Islamic Salvation Front (FIS) won local elections in 1990 and the first round of parliamentary elections on 26 December 1991. On 11 January 1992 the army forced President Chadli Bendjedid to resign, cancelled the second round, banned the FIS and interned thousands of its members in desert camps. Armed groups took to the mountains and the suburbs: the Islamic Salvation Army (AIS), loyal to the FIS, fought the security forces, while the more radical Armed Islamic Group (GIA) killed police and soldiers, officials, journalists, intellectuals, foreigners and finally villagers by the hundreds, above all in the massacres of 1997–1998 around Algiers and in the west. The security forces answered with torture, summary executions and thousands of disappearances, and armed village militias. The AIS declared a truce in 1997, President Abdelaziz Bouteflika’s Civil Concord of 1999 offered amnesty to fighters who surrendered, and the killing of the GIA’s leader Antar Zouabri in February 2002 is usually taken as the end of the war, though the GSPC fought on. Algerian officials gave about 150,000 dead, a figure of 200,000 is often cited, and some researchers estimate far fewer; several thousand people disappeared."
: "La guerre entre l’État algérien et des groupes islamistes armés qui suivit l’annulation par l’armée des élections de 1991–1992, appelée en Algérie la décennie noire. Après que les émeutes d’octobre 1988 eurent mis fin au régime de parti unique du FLN, le Front islamique du salut (FIS) remporta les élections locales de 1990 et le premier tour des élections législatives du 26 décembre 1991. Le 11 janvier 1992, l’armée contraignit le président Chadli Bendjedid à démissionner, annula le second tour, interdit le FIS et interna des milliers de ses membres dans des camps du désert. Des groupes armés gagnèrent les montagnes et les banlieues : l’Armée islamique du salut (AIS), fidèle au FIS, combattit les forces de sécurité, tandis que le Groupe islamique armé (GIA), plus radical, tua des policiers et des soldats, des fonctionnaires, des journalistes, des intellectuels, des étrangers et enfin des villageois par centaines, surtout lors des massacres de 1997–1998 autour d’Alger et dans l’ouest. Les forces de sécurité répondirent par la torture, des exécutions sommaires et des milliers de disparitions, et armèrent des milices villageoises. L’AIS déclara une trêve en 1997, la Concorde civile du président Abdelaziz Bouteflika offrit en 1999 l’amnistie aux combattants qui se rendaient, et la mort du chef du GIA, Antar Zouabri, tué en février 2002, est généralement considérée comme la fin de la guerre, bien que le GSPC ait poursuivi le combat. Les autorités algériennes ont avancé le chiffre d’environ 150 000 morts, celui de 200 000 est souvent cité, et certains chercheurs en estiment le nombre bien plus bas ; plusieurs milliers de personnes ont disparu."
