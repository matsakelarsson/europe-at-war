# French translations of the catalogue text (wave 12); step bodies follow later.
Wars between Algiers and Tunis: Guerres entre Alger et Tunis
A series of wars between the two Ottoman regencies of Algiers and Tunis, nominal vassals of the same sultan, fought over their border, over tribute and over Tunis’s ruling families. An earlier war, in 1628, had ended with a treaty fixing the border along the Mellègue. In 1694 an Algerian army took Tunis for a rival claimant, until a revolt brought the Muradid bey back in 1695; in 1705 another Algerian invasion captured the bey Ibrahim Sharif at El Kef, but the officer Husayn ibn Ali held Tunis and founded the Husainid dynasty. Algiers backed Husayn’s nephew Ali Pasha against him in 1735, and in 1756 helped Husayn’s sons overthrow Ali Pasha, storming and sacking Tunis; for half a century afterwards Tunis paid tribute to Algiers. In 1807 Hammouda Pasha refused to pay, failed to take Constantine but beat the Algerian counter-invasion near El Kef, ending Tunis’s dependence. Fighting flared again in 1811 and 1813 before a peace at the end of 1813.: Une série de guerres entre les deux régences ottomanes d’Alger et de Tunis, vassales nominales du même sultan, livrées au sujet de leur frontière, du tribut et des familles régnantes de Tunis. Une guerre antérieure, en 1628, s’était achevée par un traité fixant la frontière le long du Mellègue. En 1694, une armée algérienne prit Tunis pour le compte d’un prétendant rival, jusqu’à ce qu’une révolte ramène le bey mouradite en 1695 ; en 1705, une nouvelle invasion algérienne captura le bey Ibrahim Sharif au Kef, mais l’officier Husayn ibn Ali tint Tunis et fonda la dynastie husseinite. Alger soutint contre lui son neveu Ali Pacha en 1735, puis aida en 1756 les fils de Husayn à renverser Ali Pacha, en prenant d’assaut et en pillant Tunis ; pendant le demi-siècle qui suivit, Tunis paya tribut à Alger. En 1807, Hammouda Pacha refusa de payer ; il échoua devant Constantine mais battit la contre-invasion algérienne près du Kef, mettant fin à la dépendance de Tunis. Les combats reprirent en 1811 et en 1813, avant une paix conclue à la fin de 1813.
