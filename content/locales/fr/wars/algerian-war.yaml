# Some French text was translated automatically.
"Algerian War": "Guerre d’Algérie"
? "The war of independence fought by Algeria’s National Liberation Front (FLN) against French rule. It began with coordinated attacks on 1 November 1954 and became a guerrilla war in the countryside and a campaign of bombings in the cities, as in the Battle of Algiers in 1957. The French counter-insurgency made wide use of torture, summary executions and the forced resettlement of some two million villagers, and the FLN also killed many civilians, Algerian and European. The war brought down the Fourth Republic in 1958 and returned Charles de Gaulle to power, and it reached France itself, where the Paris police killed dozens of Algerian demonstrators on 17 October 1961, by some estimates as many as two hundred. After a failed army putsch in Algiers in April 1961 and a campaign of bombings and murders by the OAS, a secret army opposed to independence, the Évian Accords brought a ceasefire on 19 March 1962, and Algeria became independent on 5 July. Some 900,000 Europeans, the pieds-noirs, left for France within months, and many thousands of harkis, Algerians who had served with the French army, were killed. Estimates of the Algerian dead range from a few hundred thousand to the 1.5 million of official Algerian figures; about 25,000 French soldiers died."
: "La guerre d’indépendance menée par le Front de libération nationale (FLN) contre la domination française a commencé avec des attaques coordonnées le 1er novembre 1954 et est devenue une guérilla dans les campagnes et une campagne d’attentats dans les villes, comme lors de la bataille d’Alger en 1957. La guerre a fait tomber la quatrième République en 1958 et a rendu Charles de Gaulle au pouvoir, et elle est arrivée en France elle-même, où la police parisienne a tué des dizaines de manifestants algériens le 17 octobre 1961, selon certaines estimations jusqu’à 200. Après l’échec d’un putsch militaire à Alger en avril 1961 et une campagne de bombardements et d’assassinats par l’OEA, armée secrète opposée à l’indépendance, les Accords d’Évian ont apporté un cessez-le-feu le 19 mars 1962, et l’Algérie est devenue indépendante le 5 juillet. Les estimations des morts algériens vont de quelques centaines de milliers à 1,5 million de personnes officielles algériennes ; environ 25 000 soldats français sont morts."
"Algeria, conquered from 1830, was governed as part of France, divided into French départements; it lies outside the map. France officially called the conflict a war only in 1999.": "L’Algérie, conquise à partir de 1830, est gouvernée comme une partie de la France, divisée en départements français ; elle se trouve en dehors de la carte. La France a officiellement qualifié le conflit de guerre seulement en 1999."
