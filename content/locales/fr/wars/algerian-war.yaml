? The war of independence fought by Algeria’s National Liberation Front (FLN) and its army, the ALN, against French rule. Algeria, conquered from 1830, was governed as part of France, with a million settlers of European descent and some nine million Muslim Algerians who had few political rights. After the bloody repression of the Sétif and Guelma rising in May 1945 and years of blocked reform, the FLN began the war with coordinated attacks on 1 November 1954. It became a guerrilla war in the mountains and a campaign of bombings and assassinations in the cities, as in the Battle of Algiers in 1957. France sent some 400,000 soldiers, most of them conscripts, sealed the borders with Tunisia and Morocco with electrified barriers, moved more than two million villagers into camps and made wide use of torture and summary executions; the FLN killed many civilians, European and Algerian, and fought a bitter war with its rival, the MNA. The crisis brought down the Fourth Republic in May 1958 and returned Charles de Gaulle to power. His army all but defeated the ALN inside Algeria, but he turned towards self-determination, survived an army putsch in April 1961 and the bombings of the OAS, a secret army of settlers and officers, and signed the Évian Accords, which brought a ceasefire on 19 March 1962. Algeria voted for independence on 1 July and celebrated it on 5 July 1962. Some 900,000 Europeans, the pieds-noirs, left for France within months, and tens of thousands of harkis, Algerians who had served with the French army, were killed. Estimates of the Algerian dead range from about 300,000 to the 1.5 million of official Algerian figures; about 25,000 French soldiers died.
: La guerre d’indépendance menée par le Front de libération nationale (FLN) algérien et son armée, l’ALN, contre la domination française. L’Algérie, conquise à partir de 1830, était administrée comme une partie de la France, avec un million de colons d’origine européenne et quelque neuf millions d’Algériens musulmans qui ne disposaient que de peu de droits politiques. Après la répression sanglante du soulèvement de Sétif et de Guelma en mai 1945 et des années de réformes bloquées, le FLN déclencha la guerre par des attaques coordonnées le 1er novembre 1954. Elle devint une guérilla dans les montagnes et une campagne d’attentats et d’assassinats dans les villes, comme lors de la bataille d’Alger en 1957. La France envoya quelque 400 000 soldats, des appelés pour la plupart, ferma les frontières avec la Tunisie et le Maroc par des barrages électrifiés, déplaça plus de deux millions de villageois dans des camps et recourut largement à la torture et aux exécutions sommaires ; le FLN tua de nombreux civils, européens et algériens, et mena une guerre acharnée contre son rival, le MNA. La crise fit tomber la IVe République en mai 1958 et ramena Charles de Gaulle au pouvoir. Son armée vainquit presque entièrement l’ALN à l’intérieur de l’Algérie, mais il s’orienta vers l’autodétermination, survécut à un putsch militaire en avril 1961 et aux attentats de l’OAS, une armée secrète de colons et d’officiers, et signa les accords d’Évian, qui instaurèrent un cessez-le-feu le 19 mars 1962. L’Algérie vota pour l’indépendance le 1er juillet et la célébra le 5 juillet 1962. Quelque 900 000 Européens, les pieds-noirs, partirent pour la France en l’espace de quelques mois, et des dizaines de milliers de harkis, des Algériens qui avaient servi dans l’armée française, furent tués. Les estimations du nombre de morts algériens vont d’environ 300 000 à 1,5 million selon les chiffres officiels algériens ; environ 25 000 soldats français moururent.
