# Some French text was translated automatically.
"Algiers Expedition": "Expédition à Alger"
? "Emperor Charles V’s attempt to take Algiers, the corsair base ruled for the Ottomans by Hasan Agha, Hayreddin Barbarossa’s deputy. Charles sailed late in the year, against the advice of his admiral Andrea Doria, with a fleet of over 500 sails gathered at Majorca and some 24,000 German, Spanish and Italian soldiers, joined by Knights of Malta; Hernán Cortés, the conqueror of Mexico, came as a volunteer. The army landed east of the city on 23 October, but on the night of 24–25 October a violent storm drenched the troops’ powder, wrecked many ships on the shore and allowed the defenders to make a fierce sortie, held off at the Bab Azoun gate largely by the knights. Doria gathered what was left of the fleet at Cape Matifou, and the army re-embarked and sailed to Spanish Bougie, from where Charles left for Spain in late November. About 150 ships were lost, with many soldiers and sailors, and so many were taken prisoner that slaves were said to be sold in Algiers for almost nothing. The defeat left the corsairs of Algiers secure for the rest of the century."
: "L’empereur Charles Vês tente de prendre Alger, la base corsaire gouvernée pour les Ottomans par Hasan Agha, député de Hayreddin Barbarossa. Charles a navigué tard dans l’année, contre le conseil de son amiral Andrea Doria, avec une flotte de plus de 500 voiles rassemblées à Majorque et quelque 24 000 soldats allemands, espagnols et italiens, rejoints par les Chevaliers de Malte ; Hernán Cortés, conquérant du Mexique, est venu comme volontaire. L’armée débarqua à l’est de la ville le 23 octobre, mais, dans la nuit du 24 au 25 octobre, une violente tempête fit tomber les troupes en poudre, détruisit de nombreux navires sur la côte et permit aux défenseurs de faire une sortie féroce, tenue par les chevaliers à la porte de Bab Azoun. Doria rassembla ce qui restait de la flotte au cap Matifou, et l’armée re-embaucha et s’embarqua pour l’espagnol Bougie, d’où Charles partit pour l’Espagne fin novembre. Environ 150 navires furent perdus, avec beaucoup de soldats et de marins, et tant furent faits prisonniers que des esclaves seraient vendus à Alger pour presque rien. La défaite laissa les corsaires d’Alger en sécurité pour le reste du siècle."
"Dates are Julian. Figures for the size of the expedition and its losses vary between sources.": "Les chiffres pour la taille de l’expédition et ses pertes varient selon les sources."
"Charles V’s earlier and more successful expedition against Tunis in 1535 has its own entry.": "L’expédition de Charles Vês, plus tôt et plus réussie contre Tunis en 1535, a sa propre entrée."
