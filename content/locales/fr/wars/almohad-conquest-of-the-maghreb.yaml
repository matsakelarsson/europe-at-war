# French translations of the catalogue text (wave 12); step bodies follow later.
Almohad conquest of the Maghreb: Conquête almohade du Maghreb
? The rise of the Almohads (al-Muwahhidun, “those who affirm the unity of God”), a religious movement founded among the Masmuda Berbers of the High Atlas by the preacher Ibn Tumart, and their conquest of North Africa from the Atlantic to Tripolitania. Proclaimed the Mahdi in 1121, Ibn Tumart made the mountain village of Tinmel his base and waged war on the Almoravids, whom he accused of corrupting Islam; his first attack on Marrakesh was crushed at al-Buhayra in 1130, and he died a few months later. His successor Abd al-Mu’min, a Zenata from near Tlemcen, fought his way along the mountains for years, broke the Almoravid army near Tlemcen and Oran in 1144–1145, took Fez in 1146 and Marrakesh in 1147, and crushed a great revolt with mass executions. He then turned east, ending the Hammadid kingdom at Bougie in 1152, defeating the Arab tribes at Sétif in 1153 and, in 1159–1160, taking Tunis and driving the Normans of Sicily from Mahdia. For the first time the whole Maghreb was united under one ruler, a Berber dynasty that also held al-Andalus.
: L’essor des Almohades (al-Muwahhidun, « ceux qui affirment l’unicité de Dieu »), mouvement religieux fondé chez les Berbères Masmouda du Haut Atlas par le prédicateur Ibn Tumart, et leur conquête de l’Afrique du Nord, de l’Atlantique à la Tripolitaine. Proclamé Mahdi en 1121, Ibn Tumart fit du village de montagne de Tinmel sa base et mena la guerre contre les Almoravides, qu’il accusait de corrompre l’islam ; sa première attaque contre Marrakech fut écrasée à al-Buhayra en 1130, et il mourut quelques mois plus tard. Son successeur Abd al-Mu’min, un Zénète des environs de Tlemcen, progressa pendant des années le long des montagnes en combattant, brisa l’armée almoravide près de Tlemcen et d’Oran en 1144–1145, prit Fès en 1146 et Marrakech en 1147, et écrasa une grande révolte par des exécutions de masse. Il se tourna ensuite vers l’est, mettant fin au royaume hammadide à Bougie en 1152, battant les tribus arabes à Sétif en 1153 et, en 1159–1160, prenant Tunis et chassant de Mahdia les Normands de Sicile. Pour la première fois, tout le Maghreb se trouva uni sous un seul souverain, une dynastie berbère qui tenait aussi al-Andalus.
