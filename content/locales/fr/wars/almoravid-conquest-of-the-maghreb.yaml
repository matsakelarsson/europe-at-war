# French translations of the catalogue text (wave 12); step bodies follow later.
Almoravid conquest of the Maghreb: Conquête almoravide du Maghreb
The rise of the Almoravids (al-Murabitun), a movement of religious reform among the veiled Sanhaja Berbers of the western Sahara, and their conquest of what is now Morocco and western Algeria. Brought to the Gudala and Lamtuna tribes by the Maliki scholar Abdallah ibn Yasin in the 1040s, the movement took the caravan cities at both ends of the western Saharan trade in 1054–1055, Sijilmasa in the north and Awdaghust in the south. Under the Lamtuna chiefs Yahya ibn Umar and Abu Bakr ibn Umar it conquered the Sous, Aghmat (1058) and the Barghawata of the Atlantic plains, whose own faith it stamped out; Ibn Yasin was killed fighting them in 1059. Abu Bakr founded Marrakesh and went back to the desert, leaving the north to his cousin Yusuf ibn Tashfin, who took Fez from its Zenata emirs (1069–1075), then Tangier, Tlemcen and Algiers, and in 1083 Ceuta on the Strait. The Almoravids ruled from the Senegal to the Mediterranean, and in 1086 they crossed into al-Andalus at the call of its Muslim kings.: L’essor des Almoravides (al-Murabitun), mouvement de réforme religieuse né chez les Berbères Sanhadja voilés de l’ouest du Sahara, et leur conquête de ce qui est aujourd’hui le Maroc et l’ouest de l’Algérie. Apporté aux tribus gudala et lamtuna par le savant malikite Abdallah ibn Yasin dans les années 1040, le mouvement s’empara en 1054–1055 des villes caravanières situées aux deux extrémités du commerce de l’ouest saharien, Sijilmassa au nord et Aoudaghost au sud. Sous les chefs lamtuna Yahya ibn Umar et Abu Bakr ibn Umar, il conquit le Souss, Aghmat (1058) et les Berghouata des plaines atlantiques, dont il extirpa la religion propre ; Ibn Yasin fut tué en les combattant en 1059. Abu Bakr fonda Marrakech et repartit au désert, laissant le nord à son cousin Yusuf ibn Tashfin, qui prit Fès à ses émirs zénètes (1069–1075), puis Tanger, Tlemcen et Alger, et en 1083 Ceuta, sur le détroit. Les Almoravides régnèrent du fleuve Sénégal à la Méditerranée et, en 1086, passèrent en al-Andalus à l’appel de ses rois musulmans.
