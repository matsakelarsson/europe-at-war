# French translations of the catalogue text (wave 12); step bodies follow later.
The Almoravids and Ghana: Les Almoravides et le Ghana
? The contacts and conflict between the Almoravid movement of the western Sahara and the Soninke kingdom of Ghana in the Sahel, and the long debate about whether the Almoravids conquered Ghana in 1076. What is certain is that in 1054–1055 the Almoravids sacked Awdaghust, a Saharan trading town that recognised the king of Ghana. Al-Bakri, writing in 1068, describes Ghana under its kings Bassi and Tunka Manin as rich and powerful, with a royal town and a Muslim merchants’ town with twelve mosques, Muslim officials at court and a king who kept the old religion; Tunka Manin is said to have corresponded with Yusuf ibn Tashfin. Hints in later Arabic writers, above all Ibn Khaldun, gave rise to the long-held view that the Almoravids conquered Ghana in 1076–1077 and forced its people to convert. In 1982 David Conrad and Humphrey Fisher argued that this conquest was largely a misreading of the sources; others accept that Almoravid pressure and agitation weakened Ghana, and archaeology at Koumbi Saleh, the site most often identified with the capital, shows no sign of a sudden destruction. Ghana’s rulers did become Muslim around this time, and in 1154 al-Idrisi described the country as Muslim and its capital as the greatest town of the Sudan.
: Les contacts et le conflit entre le mouvement almoravide de l’ouest du Sahara et le royaume soninké du Ghana, au Sahel, ainsi que le long débat sur la question de savoir si les Almoravides conquirent le Ghana en 1076. Ce qui est certain, c’est qu’en 1054–1055 les Almoravides saccagèrent Aoudaghost, une ville commerçante saharienne qui reconnaissait l’autorité du roi du Ghana. Al-Bakri, qui écrivait en 1068, décrit le Ghana sous ses rois Bassi et Tunka Manin comme riche et puissant, avec une ville royale et une ville des marchands musulmans comptant douze mosquées, des fonctionnaires musulmans à la cour et un roi resté fidèle à l’ancienne religion ; Tunka Manin aurait correspondu avec Yusuf ibn Tashfin. Des allusions chez des auteurs arabes plus tardifs, Ibn Khaldoun surtout, ont donné naissance à l’opinion longtemps admise selon laquelle les Almoravides conquirent le Ghana en 1076–1077 et contraignirent sa population à se convertir. En 1982, David Conrad et Humphrey Fisher ont soutenu que cette conquête reposait en grande partie sur une mauvaise lecture des sources ; d’autres admettent que la pression et l’agitation almoravides affaiblirent le Ghana, et les fouilles de Koumbi Saleh, le site le plus souvent identifié à la capitale, ne montrent aucune trace de destruction soudaine. Les souverains du Ghana se convertirent bien à l’islam vers cette époque, et en 1154 al-Idrisi décrivait le pays comme musulman et sa capitale comme la plus grande ville du Soudan.
