# French translations of the catalogue text (wave 9); step bodies follow later.
Altan Khan’s wars with the Ming: Guerres d’Altan Khan contre les Ming
"Four decades of raiding on the northern frontier of Ming China by Altan Khan (1507/08–1582), ruler of the Tümed Mongols and leader of the right wing of the Eastern Mongols, who wanted regular trade and tribute relations with China and was repeatedly refused. His horsemen raided Shanxi, the Ordos frontier and the region of Beijing almost every year; in 1542 they plundered the country around Taiyuan, and in the autumn of 1550, in the Gengxu incident, they broke through the wall at Gubeikou and burned the suburbs of Beijing for three days while the Ming armies stayed behind the walls. Horse markets opened in 1551 were closed again within a year. Peace came in 1570–1571, after Altan’s grandson defected to the Ming: in April 1571 the Longqing Emperor named Altan Shunyi Wang (Obedient and Righteous Prince), and regular markets on the frontier kept the peace with the western Mongols for decades.": "Quatre décennies de raids sur la frontière nord de la Chine des Ming, menés par Altan Khan (1507/08–1582), souverain des Mongols Tümed et chef de l’aile droite des Mongols orientaux, qui réclamait des relations régulières de commerce et de tribut avec la Chine et se heurta à des refus répétés. Ses cavaliers razziaient presque chaque année le Shanxi, la frontière de l’Ordos et la région de Pékin ; en 1542, ils pillèrent les environs de Taiyuan et, à l’automne 1550, lors de l’incident de Gengxu, ils percèrent la muraille à Gubeikou et incendièrent pendant trois jours les faubourgs de Pékin, tandis que les armées Ming restaient à l’abri des remparts. Les marchés aux chevaux ouverts en 1551 furent refermés moins d’un an plus tard. La paix vint en 1570–1571, après la défection du petit-fils d’Altan auprès des Ming : en avril 1571, l’empereur Longqing conféra à Altan le titre de Shunyi Wang (prince obéissant et juste), et des marchés réguliers à la frontière maintinrent la paix avec les Mongols de l’Ouest pendant des décennies."
