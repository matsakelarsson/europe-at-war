"Alterations of Aragon": "Troubles d’Aragon"
? "The rising in Zaragoza in 1591 over Antonio Pérez, Philip II’s fallen secretary, who had escaped from prison in Castile in April 1590 and claimed the protection of Aragon’s laws. When the king turned to the Inquisition, which those laws could not block, crowds in Zaragoza freed Pérez from its custody on 24 May and again on 24 September 1591; the king’s representative, the Marquis of Almenara, was mortally wounded in the first riot, and more than thirty people died in the second. The Justicia of Aragon, Juan de Lanuza, declared the coming of a Castilian army a breach of the kingdom’s liberties and called out its men, but only about 2,000 answered. A royal army of some 14,000 under Alonso de Vargas entered Zaragoza unopposed on 12 November, Pérez fled to France, and on 20 December Lanuza was beheaded in the market square without trial. Other leaders were executed or died in prison. In 1592 the Cortes of Tarazona kept Aragon’s laws and institutions but gave the crown more power over them."
: "La montée à Saragosse en 1591 sur Antonio Pérez, le secrétaire de Philippe II tombé, qui s’était échappé de prison en Castille en avril 1590 et a revendiqué la protection des lois d’Aragon. Lorsque le roi se tourna vers l’Inquisition, que ces lois ne pouvaient bloquer, des foules à Saragosse délivraient Pérez de sa garde le 24 mai et encore le 24 septembre 1591 ; le représentant du roi, le marquis d’Almenara, fut mortellement blessé lors de la première émeute, et plus de trente personnes moururent dans la seconde. La Justicia d’Aragon, Juan de Lanuza, a déclaré la venue d’une armée castillane une violation des libertés du royaume et a appelé ses hommes, mais seulement environ 2000 ont répondu. Une armée royale d’environ 14 000 sous Alonso de Vargas est entrée Zaragoza sans opposition le 12 novembre, Pérez s’est enfui en France, et le 20 décembre Lanuza a été décapité sur la place du marché sans procès. D’autres dirigeants sont exécutés ou morts en prison. En 1592, les Cortes de Tarazona gardent les lois et institutions d’Aragon, mais donnent à la couronne plus de pouvoir sur eux."
"Dates are Gregorian; Spain adopted the Gregorian calendar in 1582.": "Les dates sont grégorien ; l’Espagne a adopté le calendrier grégorien en 1582."
"The Kingdom of Aragon kept its own laws, the fueros, under the Spanish crown. Its Justicia was a judge whose court could take prisoners under its protection, a right called manifestación. Pérez later lived in France and England, where his writings helped spread the ‘black legend’ about Philip II, and died in Paris in 1611.": "Le Royaume d’Aragon a gardé ses propres lois, les fueros, sous la couronne espagnole. Sa Justicia était un juge dont le tribunal pouvait prendre des prisonniers sous sa protection, un droit appelé manifeste. Pérez vivait plus tard en France et en Angleterre, où ses écrits ont contribué à répandre la « légende noire » sur Philippe II, et est mort à Paris en 1611."
