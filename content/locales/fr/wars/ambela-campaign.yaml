# French translations of the catalogue text (wave 8); step bodies follow later.
Ambela campaign: Campagne d’Ambela
A British Indian expedition on the North-West Frontier in 1863 against the community of Indian mujahideen at Malka, beyond the border of British territory, followers of the movement of Sayyid Ahmad Barelvi whom the British called the “Hindustani Fanatics”, and the Pashtun tribes who backed them. About 6,000 troops under Brigadier-General Neville Chamberlain marched into the Ambela (Umbeyla) pass in October, intending to cross Buner. The Bunerwals, joined by Swatis rallied by the Akhund of Swat and by other tribes, some 15,000 men in all, rose and pinned the force in the pass for weeks; the Crag Picquet changed hands several times, and Chamberlain was badly wounded. Reinforced and under Major-General John Garvock, the British broke out in mid-December, and the Buner elders agreed to destroy Malka themselves, which a party escorted by British officers burned on 23 December. British casualties were some 900 to 1,000 killed and wounded.: Une expédition de l’Inde britannique sur la frontière du Nord-Ouest en 1863 contre la communauté de moudjahidines indiens établie à Malka, au-delà de la limite du territoire britannique, disciples du mouvement de Sayyid Ahmad Barelvi que les Britanniques appelaient les « fanatiques hindoustanis », et contre les tribus pachtounes qui les soutenaient. Environ 6 000 hommes commandés par le brigadier-général Neville Chamberlain s’engagèrent en octobre dans le col d’Ambela (Umbeyla), avec l’intention de traverser le Buner. Les Bunerwals, rejoints par des Swatis ralliés par l’Akhund de Swat et par d’autres tribus, quelque 15 000 hommes en tout, se soulevèrent et bloquèrent la colonne dans le col pendant des semaines ; le Crag Picquet changea plusieurs fois de mains, et Chamberlain fut grièvement blessé. Renforcés et placés sous les ordres du major-général John Garvock, les Britanniques se dégagèrent à la mi-décembre, et les anciens du Buner acceptèrent de détruire eux-mêmes Malka, qu’un détachement escorté par des officiers britanniques incendia le 23 décembre. Les pertes britanniques s’élevèrent à quelque 900 à 1 000 tués et blessés.
