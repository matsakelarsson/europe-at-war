# French translations of the catalogue text (wave 11); step bodies follow later.
Ambon wars (Great Ambon War): Guerres d’Ambon (grande guerre d’Ambon)
? The war in which the Dutch East India Company (VOC) completed its monopoly of cloves in the central Moluccas by crushing the Muslim communities of Hoamoal, the western peninsula of Seram, and their allies on the nearby islands. Hoamoal, the main clove-growing area outside Company control, was ruled for the sultan of Ternate by a governor (kimelaha), and Makassar (Gowa) traders bought its cloves in defiance of the Company. In 1650 a court faction in Ternate drove out Sultan Mandar Syah, whom the VOC restored; the kimelaha Majira sided with the rebels, and in 1651 the Hoamoal villages and allied communities on the neighbouring islands rose, killing Company soldiers and Christian Ambonese and attacking VOC posts. Arnold de Vlaming van Oudshoorn, sent from Batavia, fought them from 1651 to 1656. In 1652 he made Mandar Syah cede Ternate’s rights in Hoamoal and agree to the destruction of all clove trees outside Ambon and the Lease islands, in return for a yearly payment. Makassar sent fleets and troops to Hoamoal in 1653–1655. De Vlaming’s campaign of 1654–1655 destroyed villages, crops and clove groves; the stronghold of Asahudi fell in July 1655, and on 6 August 1655 his troops took a hill fort in the Kalike mountains, where the Ternatean prince Kaicili Saidi was captured and killed. Majira escaped to Makassar. The war ended in early 1656, when news reached Ambon of a peace between the VOC and Makassar. The surviving people of Hoamoal were moved to Ambon and its neighbouring islands, the peninsula was left almost empty, and clove growing was confined to Company-controlled Ambon and the Lease islands.
: La guerre par laquelle la Compagnie néerlandaise des Indes orientales (VOC) acheva d’imposer son monopole du girofle dans le centre des Moluques en écrasant les communautés musulmanes de Hoamoal, la péninsule occidentale de Seram, et leurs alliés des îles voisines. Hoamoal, principale zone de culture du girofle échappant au contrôle de la Compagnie, était gouvernée pour le compte du sultan de Ternate par un gouverneur (kimelaha), et des marchands de Makassar (Gowa) y achetaient le girofle au mépris de la Compagnie. En 1650, une faction de la cour de Ternate chassa le sultan Mandar Syah, que la VOC rétablit ; le kimelaha Majira prit le parti des rebelles et, en 1651, les villages de Hoamoal et les communautés alliées des îles voisines se soulevèrent, tuant des soldats de la Compagnie et des Ambonais chrétiens et attaquant les postes de la VOC. Arnold de Vlaming van Oudshoorn, envoyé de Batavia, les combattit de 1651 à 1656. En 1652, il obtint de Mandar Syah qu’il cède les droits de Ternate sur Hoamoal et accepte la destruction de tous les girofliers en dehors d’Ambon et des îles Lease, en échange d’un versement annuel. Makassar envoya des flottes et des troupes à Hoamoal en 1653–1655. La campagne de De Vlaming en 1654–1655 détruisit villages, cultures et plantations de girofliers ; la place forte d’Asahudi tomba en juillet 1655, et le 6 août 1655 ses troupes prirent un fort perché dans les monts Kalike, où le prince Kaicili Saidi, de Ternate, fut capturé et tué. Majira s’échappa à Makassar. La guerre prit fin au début de 1656, lorsque parvint à Ambon la nouvelle d’une paix entre la VOC et Makassar. Les survivants de Hoamoal furent déplacés à Ambon et dans les îles voisines, la péninsule fut laissée presque vide, et la culture du girofle fut cantonnée à Ambon et aux îles Lease, contrôlées par la Compagnie.
