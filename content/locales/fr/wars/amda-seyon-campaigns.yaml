# French translations of the catalogue text (wave 12); step bodies follow later.
Amda Seyon’s campaigns against Ifat and its allies: Campagnes d’Amda Seyon contre l’Ifat et ses alliés
Wars of the Ethiopian emperor Amda Seyon I (r. 1314–1344) against the Muslim sultanate of Ifat and the states of the south and east that made the Solomonic kingdom the leading power of the Horn of Africa. After campaigns against Damot and Hadiya in 1316–1317, Amda Seyon invaded Ifat when its sultan Haqq ad-Din I had his envoy, returning from Mamluk Cairo, put to death. In 1332 Haqq ad-Din’s brother Sabr ad-Din rose against him, joined by Hadiya and Dawaro, and the Muslims of Adal and Mora under the religious leader Salih joined in. In a long campaign told in the chronicle known as the Glorious Victories of Amda Seyon, the emperor defeated them one after another, installed a succession of Walashma princes in Ifat as his vassals, and extended his overlordship over Dawaro, Hadiya, Bale and the lands across the Awash. Arab writers of the time, among them al-Umari, list seven Muslim states in the region, all paying tribute to the Christian king.: Les guerres que l’empereur d’Éthiopie Amda Seyon Ier (règne 1314–1344) mena contre le sultanat musulman d’Ifat et les États du sud et de l’est, et qui firent du royaume salomonide la principale puissance de la Corne de l’Afrique. Après des campagnes contre le Damot et le Hadiya en 1316–1317, Amda Seyon envahit l’Ifat lorsque son sultan, Haqq ad-Din Ier, fit mettre à mort l’envoyé de l’empereur, qui revenait du Caire mamelouk. En 1332, Sabr ad-Din, frère de Haqq ad-Din, se souleva contre lui avec le Hadiya et le Dawaro, et les musulmans de l’Adal et de Mora, conduits par le chef religieux Salih, se joignirent à eux. Au cours d’une longue campagne relatée par la chronique dite des Glorieuses Victoires d’Amda Seyon, l’empereur les vainquit l’un après l’autre, plaça successivement plusieurs princes walashma à la tête de l’Ifat comme ses vassaux et étendit sa suzeraineté sur le Dawaro, le Hadiya, le Bale et les terres situées au-delà de l’Awash. Les auteurs arabes de l’époque, dont al-Umari, dénombrent dans la région sept États musulmans, tous tributaires du roi chrétien.
