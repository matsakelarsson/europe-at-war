# French translations of the catalogue text (wave 14); step bodies follow later.
American Civil War: Guerre de Sécession
? The war between the United States (the Union) and the Confederate States of America, formed by eleven Southern slave states that seceded to preserve slavery after Abraham Lincoln, who opposed its spread into the western territories, was elected president in 1860. It began with the Confederate bombardment of Fort Sumter on 12 April 1861. The Union, with more than twice the population and most of the country’s industry, railways and ships, blockaded the Southern coast, took the Mississippi Valley in 1862–1863 and split the Confederacy in two, while Robert E. Lee’s Army of Northern Virginia defended Richmond and twice invaded the North, to be turned back at Antietam (1862) and Gettysburg (1863). Lincoln’s Emancipation Proclamation of 1 January 1863 made the end of slavery a Union war aim, and about 179,000 Black soldiers, most of them formerly enslaved, served in the Union army. Ulysses S. Grant’s Overland Campaign of 1864 pinned Lee at Petersburg, William T. Sherman took Atlanta and marched to the sea, and Lee surrendered at Appomattox on 9 April 1865; the last Confederate forces surrendered in May and June. The war was fought also in the Far West and in Indian Territory, where the Cherokee, Muscogee and Seminole nations divided between the two sides. An estimated 620,000 to 750,000 soldiers died, more than in any other American war. The Thirteenth Amendment of December 1865 abolished slavery throughout the United States, freeing about four million people.
: La guerre entre les États-Unis (l’Union) et les États confédérés d’Amérique, formés par onze États esclavagistes du Sud qui avaient fait sécession pour préserver l’esclavage après l’élection à la présidence, en 1860, d’Abraham Lincoln, opposé à son extension aux territoires de l’Ouest. Elle commença par le bombardement confédéré de Fort Sumter, le 12 avril 1861. L’Union, dont la population était plus de deux fois supérieure et qui possédait l’essentiel de l’industrie, des chemins de fer et des navires du pays, imposa un blocus aux côtes du Sud, prit la vallée du Mississippi en 1862–1863 et coupa la Confédération en deux, tandis que l’armée de Virginie du Nord de Robert E. Lee défendait Richmond et envahit à deux reprises le Nord, pour être repoussée à Antietam (1862) et à Gettysburg (1863). La proclamation d’émancipation de Lincoln, le 1er janvier 1863, fit de la fin de l’esclavage un but de guerre de l’Union, et environ 179 000 soldats noirs, dont la plupart avaient été réduits en esclavage, servirent dans l’armée de l’Union. La campagne de l’Overland d’Ulysses S. Grant, en 1864, immobilisa Lee à Petersburg, William T. Sherman prit Atlanta et marcha jusqu’à la mer, et Lee capitula à Appomattox le 9 avril 1865 ; les dernières forces confédérées se rendirent en mai et en juin. La guerre se déroula aussi dans le Far West et dans le territoire indien, où les nations cherokee, muscogee et séminole se divisèrent entre les deux camps. On estime que 620 000 à 750 000 soldats moururent, plus que dans toute autre guerre américaine. Le treizième amendement de décembre 1865 abolit l’esclavage dans l’ensemble des États-Unis, libérant environ quatre millions de personnes.
