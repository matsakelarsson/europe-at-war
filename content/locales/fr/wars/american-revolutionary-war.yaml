# French translations of the catalogue text (wave 14); step bodies follow later.
American Revolutionary War: Guerre d’Indépendance des États-Unis
? The war in which thirteen of Britain’s North American colonies won their independence as the United States. Quarrels over taxation and self-government after the Seven Years’ War turned to fighting at Lexington and Concord on 19 April 1775. The Continental Congress made George Washington commander of a Continental Army, the colonies declared independence on 4 July 1776, and an American invasion of Canada failed. Britain took New York in 1776 and Philadelphia in 1777, but the surrender of John Burgoyne’s army at Saratoga in October 1777 brought France into the war in 1778, followed by Spain in 1779 and the Dutch Republic in 1780, which made it a world war fought from the Caribbean to India. The Haudenosaunee (Iroquois) Confederacy split, most of its nations fighting for Britain and the Oneida and Tuscarora for the Americans, and the war on the frontier destroyed towns on both sides. Britain then turned to the South, taking Savannah and Charleston, and promised freedom to enslaved people who escaped from rebel owners; tens of thousands did. After a hard campaign in the Carolinas, Charles Cornwallis was besieged at Yorktown by American and French armies and a French fleet and surrendered on 19 October 1781. The Treaty of Paris of 3 September 1783 recognised the United States, with a western boundary on the Mississippi, and in a treaty signed the same day Britain returned Florida to Spain; Britain’s Native allies were not mentioned in it, and some 60,000 Loyalists left the new republic.
: "La guerre au cours de laquelle treize des colonies britanniques d’Amérique du Nord obtinrent leur indépendance sous le nom d’États-Unis. Les querelles sur l’impôt et l’autonomie qui suivirent la guerre de Sept Ans tournèrent à l’affrontement à Lexington et à Concord le 19 avril 1775. Le Congrès continental plaça George Washington à la tête d’une armée continentale, les colonies proclamèrent leur indépendance le 4 juillet 1776, et une invasion américaine du Canada échoua. La Grande-Bretagne prit New York en 1776 et Philadelphie en 1777, mais la capitulation de l’armée de John Burgoyne à Saratoga, en octobre 1777, entraîna l’entrée en guerre de la France en 1778, puis de l’Espagne en 1779 et des Provinces-Unies en 1780, ce qui en fit une guerre mondiale, livrée des Caraïbes jusqu’en Inde. La Confédération haudenosaunee (iroquoise) se divisa : la plupart de ses nations combattirent pour la Grande-Bretagne, les Oneidas et les Tuscaroras pour les Américains, et la guerre sur la frontière détruisit des villes et des villages des deux camps. La Grande-Bretagne se tourna ensuite vers le Sud, prit Savannah et Charleston et promit la liberté aux esclaves qui fuiraient leurs maîtres rebelles ; des dizaines de milliers le firent. Après une rude campagne dans les Carolines, Charles Cornwallis fut assiégé à Yorktown par des armées américaine et française et par une flotte française, et capitula le 19 octobre 1781. Le traité de Paris du 3 septembre 1783 reconnut les États-Unis, dont la frontière occidentale fut fixée au Mississippi et, par un traité signé le même jour, la Grande-Bretagne rendit la Floride à l’Espagne ; les alliés autochtones de la Grande-Bretagne n’y étaient pas mentionnés, et quelque 60 000 loyalistes quittèrent la nouvelle république."
