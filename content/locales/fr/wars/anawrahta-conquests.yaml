# French translations of the catalogue text (wave 11); step bodies follow later.
Anawrahta’s wars: Guerres d’Anawrahta
The wars by which Anawrahta, king of Pagan from 1044 to 1077, made his small kingdom in the dry zone of Upper Burma the first state to rule the whole Irrawaddy valley. According to the Burmese chronicles he seized the throne by killing King Sokkate in 1044, and in 1057 his armies took Thaton, the Mon city on the Gulf of Martaban, after a three-month siege, bringing its king Manuha, its monks, scriptures and artisans to Pagan; Pegu became his vassal. He received the submission of chiefs in the eastern hills, marched to the gates of Dali in Yunnan, guarded the plains with a line of 43 forts (1061), raided Arakan and drove a Khmer army out of Tenasserim. He sent help to Vijayabahu I of Sri Lanka against the Cholas, and monks to restore the Buddhist ordination there. Historians accept the outline of his rule, which the inscriptions confirm, but treat many chronicle stories as later legends; whether the conquest of Thaton happened as told, and how much it changed Pagan, is disputed.: Les guerres par lesquelles Anawrahta, roi de Pagan de 1044 à 1077, fit de son petit royaume de la zone sèche de Haute-Birmanie le premier État à dominer toute la vallée de l’Irrawaddy. Selon les chroniques birmanes, il s’empara du trône en tuant le roi Sokkate en 1044 et, en 1057, ses armées prirent Thaton, la cité môn du golfe de Martaban, après un siège de trois mois, ramenant à Pagan son roi Manuha, ses moines, ses textes sacrés et ses artisans ; Pégou devint son vassal. Il reçut la soumission des chefs des collines de l’est, marcha jusqu’aux portes de Dali au Yunnan, protégea les plaines par une ligne de 43 forts (1061), lança des raids sur l’Arakan et chassa une armée khmère du Tenasserim. Il envoya de l’aide à Vijayabahu Ier de Sri Lanka contre les Chola, ainsi que des moines pour y restaurer l’ordination bouddhique. Les historiens acceptent les grandes lignes de son règne, que confirment les inscriptions, mais tiennent nombre de récits des chroniques pour des légendes plus tardives ; la question de savoir si la conquête de Thaton s’est déroulée comme on la raconte, et à quel point elle a transformé Pagan, est débattue.
