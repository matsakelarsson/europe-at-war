"1269": "1269"
"Angevin conquest of the Kingdom of Sicily": "Conquête angevine du royaume de Sicile"
"The conquest of the Hohenstaufen Kingdom of Sicily by Charles of Anjou, brother of Louis IX of France, invited by the popes to take it from Frederick II’s heirs. Charles defeated and killed King Manfred at Benevento in 1266 and beat Manfred’s nephew Conradin at Tagliacozzo in 1268, after which Conradin was beheaded in Naples and the risings in his favour were crushed.": "La conquête du royaume de Sicile de Hohenstaufen par Charles d’Anjou, frère de Louis IX de France, invité par les papes à la prendre des héritiers de Frédéric II. Charles a vaincu et tué le roi Manfred à Benevento en 1266 et battu le neveu de Manfred de Conradin à Tagliacozzo en 1268, après quoi Conradin a été décapité à Naples et les montées en sa faveur ont été écrasées."
"The popes regarded the Kingdom of Sicily, which took in both the island and the mainland south of the Papal States, as a fief of the Holy See. Charles ruled the whole kingdom until the Sicilian Vespers of 1282; on the map it keeps its name, Kingdom of Sicily.": "Les papes considéraient le Royaume de Sicile, qui prit à la fois l’île et le continent au sud des États pontificaux, comme un fief du Saint-Siège. Charles gouverna tout le royaume jusqu’aux Vêpres siciliens de 1282 ; sur la carte il garde son nom, le Royaume de Sicile."
"Charles was Count of Anjou and, through his wife Beatrice, Count of Provence. His army was largely French and Provençal, and was paid for with loans from Tuscan bankers guaranteed by the papacy and with church taxes raised as for a crusade.": "Charles était comte d’Anjou et, par l’intermédiaire de son épouse Béatrice, comte de Provence. Son armée était en grande partie française et provençale, et a été payé avec des prêts de banquiers toscans garantis par la papauté et avec les impôts de l’église augmentés comme pour une croisade."
