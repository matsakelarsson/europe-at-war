"1267–1269": "1267–1269"
"Charles’s rule and his French officials were soon resented, and the Ghibellines called on Conradin, Frederick II’s fifteen-year-old grandson and the last legitimate Hohenstaufen, to claim his inheritance. He crossed the Alps in the autumn of 1267 and was welcomed at Verona, Pavia and Pisa. Revolts broke out in the south. The Saracens of Lucera rose, and exiles landed in Sicily with troops from Tunis, where much of the island declared for Conradin. On 24 July 1268 he entered Rome in triumph, received by its senator, Henry of Castile, a Castilian prince who had fallen out with Charles.": "Charles et ses officiers français furent bientôt en colère, et les Ghibellines appelèrent Conradin, Frederick II, petit-fils de quinze ans, et le dernier Hohenstaufen légitime, à réclamer son héritage. Il traversa les Alpes à l’automne de 1267 et fut accueilli à Vérone, Pavia et Pise. Des révoltes éclatèrent dans le sud. Les Sarrasins de Lucera se levèrent et des exilés débarquèrent en Sicile avec des troupes de Tunis, où une grande partie de l’île déclara pour Conradin. Le 24 juillet 1268, il entra à Rome en triomphe, reçu par son sénateur, Henry de Castille, un prince castillan tombé avec Charles."
"On 23 August 1268 Conradin’s army met Charles’s smaller force on the Palentine plain near Tagliacozzo, in the Abruzzi. The Ghibellines routed Charles’s first lines and scattered to plunder his camp. Charles, who on the advice of the veteran crusader Érard de Valéry had kept a reserve hidden behind a hill, then fell on them and destroyed them. Conradin fled towards the coast and was betrayed and captured at Torre Astura. After a trial he was beheaded in the market square of Naples on 29 October 1268, with his friend Frederick of Baden. Lucera surrendered in August 1269, and the rising in Sicily was crushed with great cruelty; at Augusta the people were massacred.": "Le 23 août 1268, l’armée de Conradin rencontra Charles dans la plaine palentine près de Tagliacozzo, dans les Abruzzes. Les Ghibellines roulèrent les premières lignes de Charles et se dispersèrent pour piller son camp. Charles, qui sur le conseil du vétéran croisé Érard de Valéry avait gardé une réserve cachée derrière une colline, puis tomba sur eux et les détruisit. Après un procès, il a été décapité sur la place du marché de Naples le 29 octobre 1268, avec son ami Frederick de Baden. Lucera s’est rendu en août 1269, et la montée en Sicile a été écrasée par une grande cruauté ; à Augusta le peuple a été massacré."
