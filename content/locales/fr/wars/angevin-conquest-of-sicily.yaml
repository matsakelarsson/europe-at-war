"1263–1266": "1263–1266"
"The popes feared the Hohenstaufen hold on both the Empire and the Kingdom of Sicily. After Frederick II’s death his son Manfred, at first regent for his young nephew Conradin, took the Sicilian crown himself in 1258 and backed the Ghibellines across Italy. The French pope Urban IV offered the kingdom to Charles of Anjou, brother of Louis IX of France and Count of Provence, and his successor Clement IV confirmed the grant. Charles reached Rome by sea in May 1265, and on 6 January 1266 cardinals crowned him King of Sicily in St Peter’s, while his army, which had come over the Alps and through Lombardy that winter, joined him.": "Après la mort de Frédéric II, son fils Manfred, d’abord régent pour son jeune neveu Conradin, prit lui-même la couronne sicilienne en 1258 et appuya les Ghibellines à travers l’Italie. Le pape français Urban IV a offert le royaume à Charles d’Anjou, frère de Louis IX de France et comte de Provence, et son successeur Clément IV a confirmé la concession. Charles est arrivé à Rome par mer en mai 1265, et le 6 janvier 1266 cardinaux l’a couronné roi de Sicile à Saint-Pierre, tandis que son armée, qui était venue au-dessus des Alpes et à travers la Lombardie cet hiver, le rejoignait."
"In February Charles crossed into the kingdom at Ceprano, where the bridge over the Liri had been left undefended, and stormed San Germano below Montecassino. Manfred chose to fight before more of his barons went over. On 26 February 1266, on the plain outside Benevento, his German knights and Saracen archers from Lucera at first drove back the French, but Charles’s men-at-arms, told to strike at the horses, broke the German cavalry, and many of Manfred’s barons left the field. Manfred rode into the fighting and was killed. Benevento was sacked, Manfred’s wife and children were imprisoned, and Charles entered Naples on 7 March.": "En février Charles a traversé le royaume à Ceprano, où le pont sur le Liri avait été laissé sans défense, et a pris San Germano sous Montecassino. Manfred a choisi de se battre avant que plus de ses barons ne passent. Le 26 février 1266, dans la plaine à l’extérieur de Benevento, ses chevaliers allemands et ses archers Sarrasins de Lucera conduisirent d’abord les Français, mais Charles dit aux hommes d’armes de frapper les chevaux, brisa la cavalerie allemande, et beaucoup de barons de Manfred ont quitté le champ. Benevento a été renvoyé, Manfred et ses enfants ont été emprisonnés, et Charles est entré à Naples le 7 mars."
