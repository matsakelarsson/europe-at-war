# French translations of the catalogue text (wave 13); step bodies follow later.
Anglo-Aro War: Guerre anglo-aro
? The British conquest of the Aro Confederacy in what is now south-eastern Nigeria. The Aro, an Igbo people centred on Arochukwu, had built from the 17th century a network of trading settlements across Igboland and the Cross River region, held together by the prestige of their oracle, Ibini Ukpabi, which Europeans called the Long Juju, and by alliances with warrior communities such as Abam, Ohafia and Edda. Pilgrims came to the oracle from far and wide to settle disputes, and many of those it condemned were sold into slavery, making the Aro the leading suppliers of captives to the coastal ports during the Atlantic slave trade and of slaves to the region afterwards. As British rule spread inland from the coast in the 1890s, the Aro saw their trade, their influence and their oracle threatened by British officials, merchants and missionaries, and they and their allies attacked communities that had accepted British protection. After the Aro sacked Obegu, a British ally, in November 1901, the Southern Nigeria Protectorate sent four columns of about 1,550 soldiers and 2,100 carriers under Lieutenant-Colonel Arthur Montanaro converging on Arochukwu. They took the town on 28 December 1901 after four days of fighting and destroyed the oracle’s shrine; the last major Aro resistance was broken at Bende in March 1902. The Aro Confederacy collapsed, but resistance to British rule in Igboland went on for years.
: La conquête britannique de la confédération aro, dans l’actuel sud-est du Nigeria. Les Aro, peuple igbo centré sur Arochukwu, avaient bâti à partir du XVIIe siècle un réseau d’établissements commerciaux à travers le pays igbo et la région de la Cross River, que cimentaient le prestige de leur oracle, Ibini Ukpabi, que les Européens appelaient le Long Juju, et des alliances avec des communautés guerrières comme Abam, Ohafia et Edda. Des pèlerins venaient de toutes parts consulter l’oracle pour régler leurs différends, et beaucoup de ceux qu’il condamnait étaient vendus comme esclaves, si bien que les Aro furent les principaux fournisseurs de captifs des ports de la côte au temps de la traite atlantique, puis d’esclaves pour la région. Lorsque la domination britannique s’étendit de la côte vers l’intérieur dans les années 1890, les Aro virent leur commerce, leur influence et leur oracle menacés par les fonctionnaires, les marchands et les missionnaires britanniques, et ils attaquèrent avec leurs alliés des communautés qui avaient accepté la protection britannique. Après le sac d’Obegu, alliée des Britanniques, par les Aro en novembre 1901, le protectorat du Nigeria du Sud envoya quatre colonnes, soit environ 1 550 soldats et 2 100 porteurs, sous le commandement du lieutenant-colonel Arthur Montanaro, converger sur Arochukwu. Elles prirent la ville le 28 décembre 1901 après quatre jours de combats et détruisirent le sanctuaire de l’oracle ; la dernière grande résistance aro fut brisée à Bende en mars 1902. La confédération aro s’effondra, mais la résistance à la domination britannique en pays igbo se poursuivit pendant des années.
