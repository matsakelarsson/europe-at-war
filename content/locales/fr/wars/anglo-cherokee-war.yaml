# French translations of the catalogue text (wave 14); step bodies follow later.
Anglo-Cherokee War: Guerre anglo-cherokee
? A war between the Cherokee and the British colonies of South Carolina, Virginia and North Carolina, backed by British regular troops, during the French and Indian War. The Cherokee had been Britain’s allies, and hundreds of their warriors served against the French in 1758, but Virginia frontiersmen killed some 30 to 40 of them on their way home, and their kin took revenge on the frontier as Cherokee law required. Governor William Henry Lyttelton of South Carolina seized Cherokee peace envoys as hostages in 1759; in February 1760 Oconostota besieged Fort Prince George, and after its commander was killed the garrison put the hostages to death. In 1760 the Cherokee raided the Carolina backcountry, turned back a British army under Archibald Montgomery at Echoe, and starved Fort Loudoun into surrender, killing many of its garrison as they marched away. In 1761 a larger army under James Grant fought its way into the Middle towns and burned some fifteen to eighteen towns and their crops, leaving thousands of Cherokee facing famine. Attakullakulla led the Cherokee to peace in treaties with Virginia and South Carolina at the end of 1761.
: Une guerre entre les Cherokees et les colonies britanniques de Caroline du Sud, de Virginie et de Caroline du Nord, soutenues par des troupes régulières britanniques, pendant la guerre franco-indienne. Les Cherokees avaient été les alliés de la Grande-Bretagne, et des centaines de leurs guerriers servirent contre les Français en 1758, mais des hommes de la frontière virginienne en tuèrent 30 à 40 sur le chemin du retour, et leurs proches se vengèrent sur la frontière, comme l’exigeait la loi cherokee. Le gouverneur de Caroline du Sud, William Henry Lyttelton, fit saisir comme otages des envoyés de paix cherokees en 1759 ; en février 1760, Oconostota assiégea le fort Prince George et, après que son commandant eut été tué, la garnison mit les otages à mort. En 1760, les Cherokees lancèrent des raids sur l’arrière-pays de la Caroline, repoussèrent à Echoe une armée britannique commandée par Archibald Montgomery et réduisirent par la faim le fort Loudoun à capituler, tuant de nombreux hommes de la garnison au moment où ils s’en allaient. En 1761, une armée plus nombreuse commandée par James Grant se fraya un chemin jusqu’aux villes du Milieu (Middle towns) et incendia quinze à dix-huit villes et leurs récoltes, laissant des milliers de Cherokees face à la famine. Attakullakulla conduisit les Cherokees à la paix par des traités conclus avec la Virginie et la Caroline du Sud à la fin de 1761.
