# French translations of the catalogue text (wave 12); step bodies follow later.
Anglo-Egyptian conquest of Darfur: Conquête anglo-égyptienne du Darfour
The conquest of the Sultanate of Darfur, the last independent state in what is now Sudan, by the Anglo-Egyptian government of Sudan during the First World War. Sultan Ali Dinar of the Keira dynasty had restored the sultanate after the fall of the Mahdist State in 1898 and paid a yearly tribute to Khartoum. In 1915, after the Ottoman sultan called for holy war against the Allies, he renounced his allegiance and made contact with the Ottomans through the Senussi in Libya. The governor-general, Reginald Wingate, sent about 2,000 men under Lieutenant-Colonel Philip Kelly, supported by four aircraft of the Royal Flying Corps. They crossed into Darfur on 16 March 1916, defeated the Fur army at Beringia on 22 May and entered El Fasher the next day. Ali Dinar fled to Jebel Marra and the west, and on 6 November 1916 a small force under Major Hubert Huddleston found him at Jebel Juba, where he was shot dead. Darfur was annexed to Anglo-Egyptian Sudan.: La conquête du sultanat du Darfour, dernier État indépendant sur le territoire de l’actuel Soudan, par le gouvernement anglo-égyptien du Soudan pendant la Première Guerre mondiale. Le sultan Ali Dinar, de la dynastie Keira, avait restauré le sultanat après la chute de l’État mahdiste en 1898 et versait un tribut annuel à Khartoum. En 1915, après l’appel du sultan ottoman à la guerre sainte contre les Alliés, il renia son allégeance et prit contact avec les Ottomans par l’intermédiaire des Senoussis de Libye. Le gouverneur général, Reginald Wingate, envoya environ 2 000 hommes sous le commandement du lieutenant-colonel Philip Kelly, appuyés par quatre avions du Royal Flying Corps. Ils pénétrèrent au Darfour le 16 mars 1916, battirent l’armée des Four à Beringia le 22 mai et entrèrent à El Fasher le lendemain. Ali Dinar s’enfuit vers le djebel Marra et l’ouest et, le 6 novembre 1916, un petit détachement commandé par le major Hubert Huddleston le trouva au djebel Juba, où il fut abattu. Le Darfour fut annexé au Soudan anglo-égyptien.
