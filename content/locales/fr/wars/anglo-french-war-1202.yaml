# Some French text was translated automatically.
"Anglo-French War of 1202–1214": "Guerre anglo-française de 1202 à 1214"
"The war in which Philip II of France took Normandy, Anjou, Maine and Touraine from King John of England in 1202–1205, ending the Angevin hold on northern France. John’s attempt to win them back with a coalition led by Emperor Otto IV failed at La Roche-aux-Moines and Bouvines in 1214.": "La guerre au cours de laquelle Philippe II de France a pris la Normandie, Anjou, Maine et Touraine du roi Jean d’Angleterre en 1202-1205, mettant fin à l’emprise d’Angevin sur le nord de la France."
"Philip’s side of the story was told by his chaplain William the Breton, who also wrote a long poem on the king’s deeds; on John’s side the main sources are English chroniclers such as Roger of Wendover, who disliked him. Numbers at Bouvines are uncertain; modern estimates give each army between about 6,000 and 9,000 men.": "Son aumônier William le Breton, qui a aussi écrit un long poème sur les actes du roi, raconta la partie de l’histoire de Philippe. Du côté de Jean, les principales sources sont les chroniqueurs anglais comme Roger de Wendover, qui ne l’aimaient pas. Les chiffres à Bouvines sont incertains ; les estimations modernes donnent chaque armée entre environ 6 000 et 9 000 hommes."
