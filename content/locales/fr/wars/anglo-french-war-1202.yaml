"1202–1206": "1202–1206"
"In 1200 King John married Isabella of Angoulême, who had been promised to Hugh of Lusignan, and the Lusignans appealed to Philip II, John’s overlord for his lands in France. John refused to answer a summons to the French king’s court, which in April 1202 declared his French fiefs forfeit. Philip invaded Normandy and recognised John’s young nephew, Arthur of Brittany, as lord of Anjou, Maine, Touraine and Poitou. On 1 August, after a forced march from Le Mans, John surprised Arthur and the Lusignans besieging his mother, Eleanor of Aquitaine, at Mirebeau and captured them all. Arthur disappeared in prison in 1203, almost certainly killed on John’s orders, and many of John’s barons turned against him.": "En 1200, le roi Jean épousa Isabella d’Angoulême, qui avait été promis à Hugh de Lusignan, et les Lusignans appelèrent Philippe II, et Jean surplomba ses terres en France. John refusa de répondre à une convocation devant la cour du roi français, qui, en avril 1202, déclara ses fiefs français confisqués. Philippe envahit la Normandie et reconnut le jeune neveu de Jean, Arthur de Bretagne, comme seigneur d’Anjou, Maine, Touraine et Poitou. Le 1er août, après une marche forcée du Mans, John surprit Arthur et les Lusignans assiégeant sa mère, Eleanor d’Aquitaine, à Mirebeau et les capturèrent tous. Arthur a disparu en prison en 1203, presque certainement tué sur les ordres de John, et beaucoup de Johns barons se sont retournés contre lui."
"In the late summer of 1203 Philip laid siege to Château Gaillard, the great castle Richard I had built above the Seine to guard Normandy. John failed to relieve it and left the duchy in December. The castle fell on 6 March 1204, after French soldiers got in through a latrine chute, and on 24 June Rouen surrendered. Normandy, ruled with England since 1066, was lost. Philip went on to take Anjou, Maine, Touraine and much of Poitou; Chinon and Loches held out until 1205. John landed at La Rochelle in 1206, but the truce agreed at Thouars that October left him only Gascony, part of Poitou and, off the Norman coast, the Channel Islands.": "À la fin de l’été 1203, Philippe assiégea le château Gaillard, le grand château que Richard Ier avait construit au-dessus de la Seine pour garder la Normandie. John ne réussit pas à le soulager et quitta le duché en décembre. Le château tomba le 6 mars 1204 après que des soldats français eurent traversé un parachute latrine, et le 24 juin Rouen se rendit. Philippe prit ensuite Anjou, Maine, Touraine et une grande partie du Poitou ; Chinon et Loches s’arrêtèrent jusqu’en 1205. John débarqua à La Rochelle en 1206, mais la trêve consentit à Thouars qu’octobre ne lui laissa que Gascogne, une partie du Poitou et, au large des côtes normandes, les îles Anglo-Normandes."
