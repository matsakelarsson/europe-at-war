"John spent years raising money and allies to win back his lands. In 1213 Philip prepared to invade England, but on 30–31 May an English fleet under William Longespée, earl of Salisbury, caught the French fleet at Damme in Flanders with most of its crews ashore, captured some 300 ships and burned about 100 more. John then joined a coalition with his nephew, the Emperor Otto IV, Count Ferrand of Flanders, Count Renaud of Boulogne and princes of the Low Countries. The plan was to attack from two sides. John landed at La Rochelle in February 1214, won over some Poitevin lords and crossed into Anjou, but when Prince Louis came to relieve the castle of La Roche-aux-Moines on 2 July, the Poitevins would not fight and John retreated.": "En 1213, Philip se prépara à envahir l’Angleterre, mais les 30 et 31 mai, une flotte anglaise sous William Longespée, comte de Salisbury, prit la flotte française à Damme en Flandre avec la plupart de ses équipages à terre, captura quelque 300 navires et brûla environ 100 autres. John s’est ensuite joint à une coalition avec son neveu, l’empereur Otto IV, le comte Ferrand de Flandre, le comte Renaud de Boulogne et les princes des Pays-Bas. John débarqua à La Rochelle en février 1214, remporta quelques seigneurs Poitevin et passa à Anjou, mais lorsque le prince Louis vint libérer le château de La Roche-aux-Moines le 2 juillet, les Poitevins ne combattirent pas et Jean se retira."
"In the north Otto gathered the allied army at Valenciennes. On 27 July 1214, near the bridge of Bouvines between Lille and Tournai, Philip turned and gave battle. The allied infantry broke into the French centre and Philip was unhorsed, but the French knights routed the allied wings and centre; Otto fled, and Ferrand, Renaud and Salisbury were taken prisoner. On 18 September John agreed a five-year truce at Chinon and gave up hope of recovering the north. Otto lost his throne to Frederick II, and John came home weakened to face his rebellious barons, the beginning of the First Barons’ War.": "Le 27 juillet 1214, près du pont de Bouvines entre Lille et Tournai, Philippe se retourna et livra la bataille. L’infanterie alliée s’enfuit dans le centre français et Philip fut sans chevaux, mais les chevaliers français parcourèrent les ailes et le centre alliés ; Otto s’enfuirent et Ferrand, Renaud et Salisbury furent faits prisonniers. Le 18 septembre, Jean accepta une trêve de cinq ans à Chinon et abandonna l’espoir de récupérer le nord. Otto perdit son trône contre Frédéric II, et John rentra chez lui affaibli pour affronter ses barons rebelles, le début de la Première Guerre des Barons."
