# French translations of the catalogue text (wave 7); step bodies follow later.
Anglo-Iraqi War: Guerre anglo-irakienne
A month-long war in the Second World War between Britain and the government of Rashid Ali al-Gaylani, who had taken power in Iraq in a coup by nationalist officers in April 1941 and sought German help. Iraqi troops besieged the British air base at Habbaniya, but the base’s aircraft drove them off, a relief column crossed the desert from Transjordan, and German and Italian air support came too late. Rashid Ali fled as British forces approached Baghdad, and an armistice was signed on 31 May. The anti-Jewish riots of the Farhud followed in Baghdad.: Une guerre d’un mois, pendant la Seconde Guerre mondiale, entre la Grande-Bretagne et le gouvernement de Rachid Ali al-Gillani, qui avait pris le pouvoir en Irak en avril 1941 à la faveur d’un coup d’État d’officiers nationalistes et cherchait l’aide de l’Allemagne. Les troupes irakiennes assiégèrent la base aérienne britannique de Habbaniya, mais les avions de la base les repoussèrent, une colonne de secours traversa le désert depuis la Transjordanie, et l’appui aérien allemand et italien arriva trop tard. Rachid Ali s’enfuit à l’approche des forces britanniques de Bagdad, et un armistice fut signé le 31 mai. Les émeutes antijuives du Farhoud suivirent à Bagdad.
