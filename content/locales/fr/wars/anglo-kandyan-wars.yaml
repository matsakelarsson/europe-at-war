# French translations of the catalogue text (wave 8); step bodies follow later.
Anglo-Kandyan Wars: Guerres anglo-kandyennes
The wars in which Britain conquered the Kingdom of Kandy, the last independent kingdom of Sri Lanka, in the island’s central highlands. A British invasion in 1803 took the abandoned capital but ended in disaster when the garrison left behind surrendered and was killed. In 1815, after King Sri Vikrama Rajasinha had turned his chief nobles against him, a second invasion met almost no resistance; the king was captured and exiled, and by the Kandyan Convention the chiefs gave the kingdom to the British Crown. Within two years many of the same chiefs led the Uva rebellion of 1817–1818, which was crushed with great destruction and loss of life, after which the British ruled the highlands directly.: Les guerres par lesquelles la Grande-Bretagne conquit le royaume de Kandy, dernier royaume indépendant du Sri Lanka, dans les hautes terres du centre de l’île. Une invasion britannique prit en 1803 la capitale abandonnée, mais tourna au désastre lorsque la garnison laissée sur place se rendit et fut tuée. En 1815, alors que le roi Sri Vikrama Rajasinha s’était aliéné ses principaux nobles, une seconde invasion ne rencontra presque aucune résistance ; le roi fut capturé et exilé, et par la convention de Kandy les chefs cédèrent le royaume à la Couronne britannique. Moins de deux ans plus tard, nombre de ces mêmes chefs menèrent la rébellion d’Uva de 1817–1818, qui fut écrasée au prix de grandes destructions et de lourdes pertes humaines, après quoi les Britanniques gouvernèrent directement les hautes terres.
