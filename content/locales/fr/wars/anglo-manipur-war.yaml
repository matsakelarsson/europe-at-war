# French translations of the catalogue text (wave 8); step bodies follow later.
Anglo-Manipur War: Guerre anglo-manipurie
A short war in 1891 between British India and the kingdom of Manipur, which the British regarded as a protected state and the Manipuris as independent. In September 1890 the senapati (army commander) Tikendrajit Singh deposed Maharaja Surachandra Singh and put his brother Kulachandra on the throne. The British accepted Kulachandra but sent the Chief Commissioner of Assam, James Quinton, with a Gurkha escort to arrest Tikendrajit. The attempt on 24 March 1891 failed, the British Residency was besieged, and Quinton, the political agent Frank Grimwood and three other officers were killed after going to parley; the rest escaped to Cachar. Three columns from Kohima, Silchar and Tamu then invaded, defeated the Manipuri forces at Thoubal and in the battle of Khongjom in late April, and occupied Imphal on 27 April. Tikendrajit and the general Thangal were hanged in public on 13 August 1891, and the British made the boy Churachand raja of a princely state under their control.: Une courte guerre en 1891 entre l’Inde britannique et le royaume de Manipur, que les Britanniques considéraient comme un État protégé et les Manipuris comme un État indépendant. En septembre 1890, le senapati (commandant de l’armée) Tikendrajit Singh déposa le maharaja Surachandra Singh et mit sur le trône son frère Kulachandra. Les Britanniques acceptèrent Kulachandra mais envoyèrent le commissaire en chef de l’Assam, James Quinton, avec une escorte de Gurkhas pour arrêter Tikendrajit. La tentative du 24 mars 1891 échoua, la résidence britannique fut assiégée, et Quinton, l’agent politique Frank Grimwood et trois autres officiers furent tués après s’être rendus à des pourparlers ; les autres s’enfuirent vers le Cachar. Trois colonnes parties de Kohima, de Silchar et de Tamu envahirent alors le pays, battirent les forces manipuries à Thoubal et à la bataille de Khongjom à la fin d’avril, et occupèrent Imphal le 27 avril. Tikendrajit et le général Thangal furent pendus en public le 13 août 1891, et les Britanniques firent du jeune Churachand le raja d’un État princier placé sous leur contrôle.
