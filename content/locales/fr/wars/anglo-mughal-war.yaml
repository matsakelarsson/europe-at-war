# French translations of the catalogue text (wave 8); step bodies follow later.
Child’s War (Anglo-Mughal war): Guerre de Child (guerre anglo-moghole)
The English East India Company’s first war against an Indian power, named after Sir Josiah Child, the Company’s head in London, who decided to win better trading terms and a fortified base in Bengal by force. In 1686 Company troops fought the Mughal governor’s men at Hooghly, and Job Charnock withdrew the Company’s Bengal staff down the river to the island of Hijli, where they were besieged and decimated by disease. In 1688–1689 English ships seized Mughal merchant and pilgrim ships off the western coast; Aurangzeb ordered the Company’s factories across India seized, and his admiral, the Siddi of Janjira, besieged Bombay for more than a year. In 1690 the Company sued for peace, paid a fine of 150,000 rupees and was allowed to trade again. Charnock returned to Bengal and in August 1690 set up the settlement at Sutanuti that grew into Calcutta.: La première guerre de la Compagnie anglaise des Indes orientales contre une puissance indienne, nommée d’après sir Josiah Child, chef de la Compagnie à Londres, qui avait décidé d’obtenir par la force de meilleures conditions commerciales et une base fortifiée au Bengale. En 1686, les troupes de la Compagnie affrontèrent les hommes du gouverneur moghol à Hooghly, et Job Charnock replia le personnel de la Compagnie au Bengale en aval du fleuve, jusqu’à l’île de Hijli, où il fut assiégé et décimé par les maladies. En 1688–1689, des navires anglais s’emparèrent de navires marchands et de navires de pèlerins moghols au large de la côte occidentale ; Aurangzeb ordonna la saisie des comptoirs de la Compagnie dans toute l’Inde, et son amiral, le Siddi de Janjira, assiégea Bombay pendant plus d’un an. En 1690, la Compagnie demanda la paix, paya une amende de 150 000 roupies et fut autorisée à reprendre son commerce. Charnock revint au Bengale et fonda en août 1690 à Sutanuti l’établissement qui devint Calcutta.
