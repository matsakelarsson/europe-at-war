# French translations of the catalogue text (wave 8); step bodies follow later.
Anglo-Mysore Wars: Guerres anglo-mysoriennes
Four wars between the Kingdom of Mysore, ruled by Hyder Ali and then his son Tipu Sultan, and the British East India Company, with the Marathas and the Nizam of Hyderabad as allies of one side or the other. In the first (1767–1769) Hyder rode to the gates of Madras and made the Company accept a defensive treaty. In the second (1780–1784) Mysore destroyed a British column at Pollilur, overran the Carnatic with French help and ended the war on equal terms at Mangalore. In the third (1790–1792) Lord Cornwallis, allied with the Marathas and the Nizam, besieged Srirangapatna and took half of Tipu’s kingdom. In the fourth (1799) a British and Hyderabadi army stormed Srirangapatna; Tipu was killed in the breach, his kingdom was partitioned and a child of the old Wodeyar dynasty was set on the throne of a smaller Mysore under Company protection.: Quatre guerres entre le royaume de Mysore, gouverné par Hyder Ali puis par son fils Tipu Sultan, et la Compagnie britannique des Indes orientales, les Marathes et le nizam d’Hyderabad se rangeant aux côtés de l’un ou de l’autre camp. Lors de la première (1767–1769), Hyder poussa jusqu’aux portes de Madras et contraignit la Compagnie à accepter un traité défensif. Lors de la deuxième (1780–1784), le Mysore anéantit une colonne britannique à Pollilur, envahit le Carnatic avec l’aide de la France et termina la guerre sur un pied d’égalité à Mangalore. Lors de la troisième (1790–1792), lord Cornwallis, allié aux Marathes et au nizam, assiégea Srirangapatna et s’empara de la moitié du royaume de Tipu. Lors de la quatrième (1799), une armée composée de troupes britanniques et de troupes d’Hyderabad prit Srirangapatna d’assaut ; Tipu fut tué sur la brèche, son royaume fut partagé et un enfant de l’ancienne dynastie Wodeyar fut placé sur le trône d’un Mysore réduit, sous la protection de la Compagnie.
