# French translations of the catalogue text (wave 8); step bodies follow later.
Anglo-Nepalese War: Guerre anglo-népalaise
A war between the East India Company and the Gorkha kingdom of Nepal, which in half a century had grown from a small hill state into a Himalayan empire stretching from the Teesta to the Sutlej. Border disputes in the Terai lowlands, above all over Butwal and Sheoraj, led the Governor-General, Lord Moira, to invade along the whole frontier in 1814. Nepalese garrisons beat off the first attacks at Kalunga and Jaithak and in the Terai, but in 1815 the Company took Kumaon and forced Amar Singh Thapa to give up the western hills at Malaun. When Kathmandu would not ratify the Treaty of Sugauli, Sir David Ochterlony marched to Makwanpur, and Nepal accepted the treaty on 4 March 1816. It lost Kumaon, Garhwal, the hill states to the Sutlej, the Sikkim lands and most of the Terai, part of which was soon returned, and took a British Resident, but kept its independence. The British began recruiting the soldiers they had fought, the origin of the Gurkha regiments.: Une guerre entre la Compagnie des Indes orientales et le royaume gorkha du Népal, qui en un demi-siècle était passé du rang de petit État des collines à celui d’empire himalayen s’étendant de la Teesta à la Sutlej. Des différends frontaliers dans les basses terres du Teraï, surtout au sujet de Butwal et de Sheoraj, conduisirent le gouverneur général, lord Moira, à envahir le pays sur toute la longueur de la frontière en 1814. Les garnisons népalaises repoussèrent les premières attaques à Kalunga, à Jaithak et dans le Teraï, mais en 1815 la Compagnie prit le Kumaon et força Amar Singh Thapa à abandonner les collines de l’ouest à Malaun. Comme Katmandou refusait de ratifier le traité de Sugauli, sir David Ochterlony marcha sur Makwanpur, et le Népal accepta le traité le 4 mars 1816. Il perdit le Kumaon, le Garhwal, les États des collines jusqu’à la Sutlej, les terres du Sikkim et la plus grande partie du Teraï, dont une partie lui fut bientôt rendue, et dut accueillir un résident britannique, mais conserva son indépendance. Les Britanniques se mirent à recruter les soldats qu’ils avaient combattus, ce qui fut l’origine des régiments gurkhas.
