# French translations of the catalogue text (wave 7); step bodies follow later.
Anglo-Persian War: Guerre anglo-perse
A short war between Britain and Qajar Iran over Herat. In 1856 Naser al-Din Shah’s army besieged and took Herat, which Iran claimed as part of Khorasan and had promised in 1853 to leave alone. Britain, which wanted Herat in Afghan hands as a barrier against Russian and Persian influence near India, declared war on 1 November 1856. Instead of marching across Afghanistan it sent a force from Bombay to the Gulf, which seized Kharg Island and Bushehr, defeated an Iranian army at Khushab in February 1857 and took Mohammerah (Khorramshahr) and Ahvaz in March and April. A peace signed in Paris on 4 March 1857, before the last battles were fought, made Iran give up Herat and its claims in Afghanistan; the British left Bushehr in October 1857.: Une courte guerre entre la Grande-Bretagne et l’Iran qadjar au sujet d’Hérat. En 1856, l’armée de Nasser al-Din Shah assiégea et prit Hérat, que l’Iran revendiquait comme une partie du Khorassan et qu’il avait promis en 1853 de laisser en paix. La Grande-Bretagne, qui voulait Hérat aux mains des Afghans comme rempart contre l’influence russe et persane près de l’Inde, déclara la guerre le 1er novembre 1856. Au lieu de traverser l’Afghanistan, elle envoya de Bombay dans le Golfe une force qui s’empara de l’île de Kharg et de Bouchehr, vainquit une armée iranienne à Khushab en février 1857 et prit Mohammerah (Khorramshahr) et Ahvaz en mars et avril. Une paix signée à Paris le 4 mars 1857, avant les dernières batailles, obligea l’Iran à renoncer à Hérat et à ses prétentions en Afghanistan ; les Britanniques quittèrent Bouchehr en octobre 1857.
