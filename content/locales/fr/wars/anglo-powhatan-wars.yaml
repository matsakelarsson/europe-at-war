# French translations of the catalogue text (wave 14); step bodies follow later.
Anglo-Powhatan Wars: Guerres anglo-powhatanes
? Three wars between the English colony of Virginia and Tsenacomoco, the paramount chiefdom of some thirty Algonquian-speaking nations of the Virginia coastal plain ruled by Powhatan (Wahunsenacawh) and later by his brother Opechancanough. In the first (1609–1614), Powhatan cut off the starving colony at Jamestown, and the English, reinforced in 1610, burned towns along the James River, killed women and children and took Pocahontas hostage; it ended with her marriage to John Rolfe. As tobacco planting spread up the rivers, Opechancanough’s warriors struck the English settlements on 22 March 1622 and killed 347 colonists, opening a second war (1622–1632) in which the English destroyed Powhatan crops year after year. His last attack, on 18 April 1644, killed about 400 colonists, but the colony now numbered some 8,000. Opechancanough was captured in 1646 and shot by a guard at Jamestown, and by the treaty of October 1646 his successor Necotowance made the Powhatan nations tributaries of the English crown and gave up the land between the York and the Blackwater rivers. Several tribes descended from the nations of Tsenacomoco are recognised by Virginia today, among them the Pamunkey and Mattaponi, who still hold reservations set aside in the 1600s.
: Trois guerres entre la colonie anglaise de Virginie et le Tsenacomoco, la chefferie suprême d’une trentaine de nations de langue algonquienne de la plaine côtière de Virginie, dirigée par Powhatan (Wahunsenacawh), puis par son frère Opechancanough. Lors de la première (1609–1614), Powhatan isola la colonie affamée de Jamestown, et les Anglais, renforcés en 1610, incendièrent des villages le long de la James, tuèrent des femmes et des enfants et prirent Pocahontas en otage ; la guerre prit fin avec le mariage de celle-ci avec John Rolfe. Tandis que les plantations de tabac remontaient les rivières, les guerriers d’Opechancanough frappèrent les établissements anglais le 22 mars 1622 et tuèrent 347 colons, ouvrant une deuxième guerre (1622–1632) au cours de laquelle les Anglais détruisirent année après année les récoltes des Powhatans. La dernière attaque d’Opechancanough, le 18 avril 1644, tua environ 400 colons, mais la colonie comptait désormais quelque 8 000 habitants. Opechancanough fut capturé en 1646 et abattu par un garde à Jamestown et, par le traité d’octobre 1646, son successeur Necotowance fit des nations powhatanes des tributaires de la Couronne anglaise et céda les terres comprises entre la York et la Blackwater. Plusieurs tribus issues des nations du Tsenacomoco sont aujourd’hui reconnues par la Virginie, parmi lesquelles les Pamunkeys et les Mattaponis, qui possèdent toujours des réserves délimitées au XVIIe siècle.
