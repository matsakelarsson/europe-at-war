# French translations of the catalogue text (wave 10); step bodies follow later.
Anglo-Satsuma War: Guerre anglo-satsuma
? A brief war between Britain and the Satsuma domain, fought as the bombardment of Kagoshima. On 14 September 1862 samurai escorting Shimazu Hisamitsu, the father and regent of the Satsuma daimyo, cut down British merchants who had failed to make way for his procession at Namamugi near Yokohama, killing Charles Lennox Richardson. Britain demanded £100,000 and an apology from the shogunate, which paid, and £25,000 and the trial and execution of the killers from Satsuma, which refused. In August 1863 Admiral Augustus Kuper sailed from Yokohama with seven warships and anchored in Kagoshima Bay on 11 August. When talks failed he seized three Satsuma steamers on 15 August; the shore batteries opened fire, and in a typhoon the British squadron bombarded the town and the forts for two days. The British lost 13 killed, among them Captain Josling and Commander Wilmot of the flagship Euryalus, killed by the same shot from a shore battery, and 50 to 69 wounded by different counts; Satsuma reported 5 killed. About 500 houses burned, between 5 and 10 per cent of the town in different accounts, together with Satsuma’s modern factory complex, the Shūseikan, and five Ryukyuan junks in the harbour. Short of coal and ammunition, the squadron withdrew on 17 August. In talks at Yokohama that autumn Satsuma agreed to pay the £25,000, borrowed from the shogunate, and promised to look for the killers, who were never handed over. The war convinced Satsuma’s leaders that they could not drive out the Western powers by force; the domain soon bought British ships and arms, sent students to Britain in 1865 and became one of Britain’s main partners in Japan.
: Une brève guerre entre la Grande-Bretagne et le domaine de Satsuma, qui prit la forme du bombardement de Kagoshima. Le 14 septembre 1862, des samouraïs escortant Shimazu Hisamitsu, père et régent du daimyo de Satsuma, abattirent à coups de sabre des marchands britanniques qui n’avaient pas cédé le passage à son cortège à Namamugi, près de Yokohama, tuant Charles Lennox Richardson. La Grande-Bretagne exigea 100 000 £ et des excuses du shogunat, qui paya, ainsi que 25 000 £ et le jugement et l’exécution des meurtriers de la part de Satsuma, qui refusa. En août 1863, l’amiral Augustus Kuper quitta Yokohama avec sept navires de guerre et mouilla dans la baie de Kagoshima le 11 août. Les pourparlers ayant échoué, il s’empara de trois vapeurs de Satsuma le 15 août ; les batteries côtières ouvrirent le feu et, en plein typhon, l’escadre britannique bombarda la ville et les forts pendant deux jours. Les Britanniques perdirent 13 tués, parmi lesquels le capitaine de vaisseau Josling et le capitaine de frégate Wilmot, du navire amiral Euryalus, tués par le même boulet tiré d’une batterie côtière, et de 50 à 69 blessés selon les décomptes ; Satsuma fit état de 5 tués. Environ 500 maisons brûlèrent, soit entre 5 et 10 % de la ville selon les récits, ainsi que le complexe industriel moderne de Satsuma, le Shūseikan, et cinq jonques de Ryūkyū qui se trouvaient dans le port. À court de charbon et de munitions, l’escadre se retira le 17 août. Lors de pourparlers tenus à Yokohama cet automne-là, Satsuma accepta de payer les 25 000 £, empruntées au shogunat, et promit de rechercher les meurtriers, qui ne furent jamais livrés. La guerre convainquit les dirigeants de Satsuma qu’ils ne pourraient pas chasser les puissances occidentales par la force ; le domaine acheta bientôt des navires et des armes britanniques, envoya des étudiants en Grande-Bretagne en 1865 et devint l’un des principaux partenaires de la Grande-Bretagne au Japon.
