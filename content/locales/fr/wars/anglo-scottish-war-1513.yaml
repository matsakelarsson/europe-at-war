# Some French text was translated automatically.
"Anglo-Scottish War of 1513": "Guerre anglo-scotte de 1513"
"James IV of Scotland invaded England to support his French allies while Henry VIII was campaigning in France. He took the border castles of Norham, Etal and Ford and waited on Flodden Hill, but the English army under the Earl of Surrey marched round to his rear. On 9 September 1513, near Branxton, the Scottish pikemen advanced downhill, lost their order in marshy ground and were cut down at close quarters by English billmen. James IV was killed, the last monarch in Britain to die in battle, with many of his nobles and perhaps 10,000 of his men, though estimates vary widely. His infant son became James V.": "James IV d’Écosse a envahi l’Angleterre pour soutenir ses alliés français pendant qu’Henry VIII faisait campagne en France. Il a pris les châteaux frontaliers de Norham, Etal et Ford et a attendu sur Flodden Hill, mais l’armée anglaise sous le comte de Surrey marcha vers son arrière. Le 9 septembre 1513, près de Branxton, les pikemen écossais avançaient en descente, perdaient leur ordre dans un sol marécageux et furent coupés à des quartiers rapprochés par les factureurs anglais. James IV fut tué, le dernier monarque en Grande-Bretagne à mourir au combat, avec beaucoup de ses nobles et peut-être 10 000 de ses hommes, bien que les estimations varient grandement."
"Dates are Julian (Old Style). The campaign was part of the War of the League of Cambrai; border raids went on until the Anglo-French peace of 1514, which included Scotland.": "Dates sont Julian (Ancien Style). La campagne a fait partie de la guerre de la Ligue de Cambrai ; les raids frontaliers ont continué jusqu’à la paix anglo-française de 1514, qui comprenait l’Écosse."
