# French translations of the catalogue text (wave 11); step bodies follow later.
Anglo-Siamese War: Guerre anglo-siamoise
? A short war between the English East India Company and the kingdom of Siam under King Narai, fought almost entirely at Mergui (Myeik), Siam’s port on the Bay of Bengal. Narai’s Greek minister Constantine Phaulkon had made two Englishmen, Richard Burnaby and Samuel White, governor and harbour master of Mergui, and from 1685 they seized Indian ships, above all those of Golconda, in a private vendetta that the Company and Golconda regarded as piracy and blamed on Siam. In 1687 the Company, armed with a royal order recalling Englishmen from foreign service, sent the warships Curtana and James under Anthony Weltden to take the English out of Siamese service and to hold the port’s shipping until Narai paid £65,000 in damages. On the night of 14 June 1687, while the English were ashore, Siamese troops under the governor of Tenasserim fired on the ships and attacked the English in the town; about sixty were killed, by most accounts including Burnaby, and the James was sunk. Weltden and White escaped. Siam declared war on the Company in August 1687, and in September a Company frigate sent to occupy Mergui was captured on arrival, by which time a French governor had taken over the port. There was little more fighting; no peace was signed, because the Company kept its claim for damages, and after the revolution of 1688 Siam closed its ports to Company ships until 1708.
: Une courte guerre entre la Compagnie anglaise des Indes orientales et le royaume de Siam du roi Narai, livrée presque entièrement à Mergui (Myeik), le port siamois sur le golfe du Bengale. Le ministre grec de Narai, Constantin Phaulkon, avait nommé deux Anglais, Richard Burnaby et Samuel White, gouverneur et capitaine du port de Mergui, et à partir de 1685 ceux-ci saisirent des navires indiens, surtout ceux de Golconde, dans une vendetta privée que la Compagnie et Golconde considérèrent comme de la piraterie et imputèrent au Siam. En 1687, la Compagnie, munie d’un ordre royal rappelant les Anglais au service de puissances étrangères, envoya les navires de guerre Curtana et James sous le commandement d’Anthony Weltden pour retirer les Anglais du service siamois et retenir les navires du port jusqu’à ce que Narai ait payé 65 000 livres sterling de dommages. Dans la nuit du 14 juin 1687, alors que les Anglais étaient à terre, des troupes siamoises commandées par le gouverneur de Tenasserim ouvrirent le feu sur les navires et attaquèrent les Anglais dans la ville ; une soixantaine d’entre eux furent tués, dont Burnaby selon la plupart des récits, et le James fut coulé. Weltden et White s’échappèrent. Le Siam déclara la guerre à la Compagnie en août 1687 et, en septembre, une frégate de la Compagnie envoyée occuper Mergui fut capturée dès son arrivée ; un gouverneur français avait entre-temps pris possession du port. Il n’y eut guère d’autres combats ; aucune paix ne fut signée, car la Compagnie maintenait sa demande de dommages, et après la révolution de 1688 le Siam ferma ses ports aux navires de la Compagnie jusqu’en 1708.
