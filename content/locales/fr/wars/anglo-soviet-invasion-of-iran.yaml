# French translations of the catalogue text (wave 7); step bodies follow later.
Anglo-Soviet invasion of Iran: Invasion anglo-soviétique de l’Iran
The joint invasion of neutral Iran by Britain and the Soviet Union in the Second World War. Wanting to secure the oil fields and the Trans-Iranian Railway as a supply route to the Soviet Union, and to expel German nationals, the two powers attacked on 25 August 1941, British and Indian troops from Iraq and the Gulf, Soviet armies from the Caucasus and Central Asia. Iran ordered a ceasefire after four days. Reza Shah abdicated in favour of his son Mohammad Reza on 16 September, and Iran stayed under Allied occupation until 1946.: L’invasion conjointe de l’Iran neutre par la Grande-Bretagne et l’Union soviétique pendant la Seconde Guerre mondiale. Pour s’assurer des champs pétrolifères et du chemin de fer transiranien, voie de ravitaillement vers l’Union soviétique, et pour expulser les ressortissants allemands, les deux puissances attaquèrent le 25 août 1941, les troupes britanniques et indiennes depuis l’Irak et le Golfe, les armées soviétiques depuis le Caucase et l’Asie centrale. L’Iran ordonna un cessez-le-feu au bout de quatre jours. Reza Shah abdiqua en faveur de son fils Mohammad Reza le 16 septembre, et l’Iran resta sous occupation alliée jusqu’en 1946.
