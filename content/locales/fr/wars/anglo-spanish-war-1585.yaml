"1585–1588": "1585–1588"
"Relations between Elizabeth I and Philip II had soured over religion, English raids on Spain’s American trade and English sympathy for the Dutch rebels. When the Duke of Parma’s reconquest of the southern Netherlands took Antwerp in August 1585, Elizabeth made the Treaty of Nonsuch with the rebels and sent an army under the Earl of Leicester, while Francis Drake raided the Spanish Caribbean. Philip began to plan an invasion of England, and after Mary, Queen of Scots, was executed in February 1587 he had no reason to wait for a Catholic succession. That spring Drake raided Cádiz and destroyed dozens of ships gathering for the expedition.": "Les relations entre Élisabeth I et Philippe II avaient assommé la religion, les raids anglais sur l’Espagne le commerce américain et la sympathie anglaise pour les rebelles hollandais. Lorsque le duc de Parma , reconquête du sud des Pays-Bas a pris Anvers en août 1585, Elizabeth a fait le traité de Nonsuch avec les rebelles et envoyé une armée sous le comte de Leicester, tandis que Francis Drake fouillait les Caraïbes espagnoles. Philippe commença à planifier une invasion de l’Angleterre et, après que Marie, Reine des Écossais, eut été exécutée en février 1587, il n’avait aucune raison d’attendre une succession catholique."
"The Armada, about 130 ships under the Duke of Medina Sidonia, left Lisbon in May 1588 to escort Parma’s army across from Flanders. Sighted off Cornwall on 29 July, it sailed up the Channel in a tight crescent, harried by the English under Lord Howard and Drake, but lost few ships. Anchored off Calais, it was scattered by fireships on the night of 7–8 August, and the next day the English attacked it off Gravelines. Parma’s barges, blockaded by Dutch ships, never came out. The wind drove the Armada north, round Scotland and Ireland, where storms wrecked many ships; around a third never returned, and thousands of men died.": "L’Armada, environ 130 navires sous le duc de Medina Sidonia, a quitté Lisbonne en mai 1588 pour escorter l’armée de Parme à travers la Flandre. Vu au large de Cornwall le 29 juillet, il a navigué dans un croissant serré, harcelé par les Anglais sous Lord Howard et Drake, mais a perdu peu de navires. Le lendemain, les Anglais l’attaquèrent au large de Gravelines. Les chalands de Parma, bloqués par des navires hollandais, ne sortirent jamais. Le vent conduisit l’Armada nord, autour de l’Écosse et de l’Irlande, où les tempêtes détruisaient de nombreux navires ; environ un tiers n’est jamais revenu, et des milliers d’hommes moururent."
