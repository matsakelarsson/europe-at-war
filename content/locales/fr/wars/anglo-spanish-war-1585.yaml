# Some French text was translated automatically.
"Anglo-Spanish War of 1585–1604": "Guerre anglo-espagnole de 1585 à 1604"
"An undeclared war between Elizabeth I’s England and Philip II’s Spain, fought over religion, English help for the Dutch revolt and English raids on Spain’s Atlantic trade. Its best-known episode is the defeat of the Spanish Armada in 1588; England’s counter-attack failed in 1589, Cádiz was sacked in 1596, and Spanish troops landed in Ireland in 1601. James I made peace in the Treaty of London in 1604, restoring the position before the war.": "Une guerre non déclarée entre l’Angleterre d’Elizabeth et Philippe II d’Espagne, a combattu pour la religion, l’aide anglaise pour la révolte néerlandaise et les raids anglais sur le commerce atlantique d’Espagne. Son épisode le plus connu est la défaite de l’Armada espagnole en 1588 ; l’Angleterre a échoué contre-attaque en 1589, Cadix a été renvoyé en 1596, et les troupes espagnoles ont atterri en Irlande en 1601. James Ier fit la paix dans le traité de Londres en 1604, rétablissant la position avant la guerre."
"Dates are New Style (Gregorian), as used in Spain from 1582. England kept the Julian calendar, ten days behind, so English accounts date the Armada’s arrival off Cornwall to 19 July 1588 and Gravelines to 29 July.": "Les dates sont New Style (Gregorian), comme utilisé en Espagne à partir de 1582. L’Angleterre a conservé le calendrier julien, dix jours derrière, donc les comptes anglais datent l’arrivée des Armadas de Cornwall au 19 juillet 1588 et Gravelines au 29 juillet."
"Philip II was also king of Portugal from 1580, and the Armada sailed from Lisbon. The war ran alongside the Dutch revolt (the Eighty Years’ War), the French Wars of Religion, in which England and Spain backed opposite sides, and the Nine Years’ War in Ireland.": "Philippe II est aussi roi du Portugal à partir de 1580, et l’Armada part de Lisbonne. La guerre court aux côtés de la révolte néerlandaise (la Guerre des Quatre-vingts Ans), des guerres de religion françaises, dans lesquelles l’Angleterre et l’Espagne soutiennent les côtés opposés, et de la guerre des Neuf Ans en Irlande."
