"1600–1604": "1600–1604"
"The war’s last years were fought mainly in the Low Countries and Ireland. English regiments under Sir Francis Vere fought in the Dutch army that beat Archduke Albert at Nieuwpoort on 2 July 1600, and from 1601 helped hold Ostend, whose siege lasted more than three years. In Ireland, where Hugh O’Neill, Earl of Tyrone, had been at war with the crown since the mid-1590s, Spain at last sent help. About 3,500 Spanish soldiers under Juan del Águila landed at Kinsale in October 1601. Lord Mountjoy besieged them, and on 3 January 1602 routed the Irish army that came to their relief; del Águila surrendered on terms and sailed home.": "La guerre des dernières années ont été combattues principalement dans les Pays-Bas et en Irlande. régiments anglais sous sir Francis Vere a combattu dans l’armée néerlandaise qui a battu Archduke Albert à Nieuwpoort le 2 juillet 1600, et à partir de 1601 aidé tenir Ostende, dont le siège a duré plus de trois ans. En Irlande, où Hugh O-Neill, comte de Tyrone, était en guerre avec la couronne depuis le milieu des années 1590, l’Espagne a enfin envoyé de l’aide. Environ 3 500 soldats espagnols sous Juan del Águila débarquèrent à Kinsale en octobre 1601. Lord Mountjoy les assiégea et, le 3 janvier 1602, il dirigea l’armée irlandaise qui vint à leur secours ; del Águila se rendit et rentra chez elle."
"Elizabeth died on 24 March 1603, and James VI of Scotland, who had never been at war with Spain, became James I of England and soon stopped the fighting. In 1604 English and Spanish envoys met at Somerset House in London, and the treaty was signed in August. Neither side gained land. England ended its official help to the Dutch, though English volunteers went on serving them; Spain gave up hope of restoring Catholicism in England, and English merchants could trade with Spain again. Ostend fell to Spain three weeks after the peace.": "Elizabeth mourut le 24 mars 1603, et Jacques VI d’Écosse, qui n’avait jamais été en guerre avec l’Espagne, devint James Ier d’Angleterre et arrêta bientôt les combats. En 1604, des envoyés anglais et espagnols se rencontrèrent à Somerset House à Londres, et le traité fut signé en août. L’Angleterre a mis fin à son aide officielle aux Hollandais, bien que des volontaires anglais aient continué à les servir ; l’Espagne a abandonné l’espoir de restaurer le catholicisme en Angleterre, et les marchands anglais ont pu à nouveau faire du commerce avec l’Espagne."
