"1589–1597": "1589–1597"
"In 1589 Elizabeth sent a fleet of her own under Drake and Sir John Norris to destroy the surviving Spanish ships, raise Portugal for the pretender Dom António and seize the Azores. It wasted two weeks at A Coruña, failed to take Lisbon and lost thousands of men to disease, and Philip rebuilt his navy. England turned to helping Henry IV of France against the Catholic League and Spain, sending troops to Normandy and to Brittany, where a Spanish force held Blavet; in 1594 English and French troops stormed the Spanish fort at Crozon near Brest. In 1595 Spanish soldiers from Brittany burned Mousehole and Penzance.": "En 1589, Elizabeth envoya une flotte sous la direction de Drake et sir John Norris pour détruire les navires espagnols survivants, élever le Portugal pour le prétendant Dom António et saisir les Açores. Elle gaspilla deux semaines à A Coruña, échoua à prendre Lisbonne et perdit des milliers d’hommes malades, et Philippe rebâtit sa marine. L’Angleterre se tourna vers l’aide d’Henri IV de France contre la Ligue catholique et l’Espagne, envoyant des troupes en Normandie et en Bretagne, où une force espagnole tenait Blavet ; en 1594, les troupes anglaises et françaises s’emparèrent du fort espagnol à Crozon près de Brest."
"In June 1596 an English and Dutch fleet under Lord Howard and the Earl of Essex attacked Cádiz. It destroyed or took the warships in the bay, and its soldiers stormed and sacked the city and held it for two weeks, while the Spanish burned the merchant fleet to keep it from them. Philip answered with two more armadas. In October 1596 a storm off Cape Finisterre wrecked many ships of the first, and the second was scattered by gales off the Channel in October 1597. Drake and John Hawkins had both died on a failed raid on the Caribbean, and Essex’s voyage to the Azores in 1597 also failed.": "En juin 1596, une flotte anglaise et néerlandaise sous lord Howard et le comte d’Essex attaquèrent Cádiz. Elle détruisit ou prit les navires de guerre dans la baie, et ses soldats saccagèrent la ville et la tenaient pendant deux semaines, tandis que les Espagnols brûlaient la flotte marchande pour la garder. Philippe répondit avec deux autres armadas. En octobre 1596, une tempête au large du cap Finisterre a détruit de nombreux navires du premier et le second a été éparpillé par des tempêtes au large de la Manche en octobre 1597. Drake et John Hawkins étaient tous deux morts lors d’un raid raté sur les Caraïbes, et Essex est allé aux Açores en 1597 également échoué."
