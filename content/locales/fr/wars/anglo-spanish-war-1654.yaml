# Some French text was translated automatically.
"Anglo-Spanish War of 1654–1660": "Guerre anglo-espagnole de 1654 à 1660"
? "A war between Oliver Cromwell’s Protectorate and Spain, begun with the “Western Design” against Spain’s Caribbean empire. An expedition was beaten off at Santo Domingo in April 1655 but took Jamaica in May. At sea Robert Blake’s fleet blockaded Cádiz, captured part of a silver fleet in 1656 and destroyed the Spanish fleet sheltering at Santa Cruz de Tenerife on 20 April 1657, though its silver had already been landed. Allied with France from March 1657, English troops helped Turenne beat the Spanish army and its French and English Royalist allies, led by Condé and the future James II, at the Battle of the Dunes on 14 June 1658, and Dunkirk, which surrendered soon afterwards, was handed to England. The fighting stopped after the Restoration of Charles II in 1660, and treaties signed at Madrid in 1667 and 1670 formally ended the war. England kept Jamaica; Charles II sold Dunkirk to France in 1662."
: "Une guerre entre Oliver Cromwells Protectorate et l’Espagne, a commencé avec le design occidental contre l’empire des Caraïbes Espagne. Une expédition a été battue à Saint-Domingue en avril 1655 mais a pris la Jamaïque en mai. En mer, la flotte de Robert Blake a bloqué Cádiz, capturé une partie d’une flotte d’argent en 1656 et détruit la flotte espagnole abritant Santa Cruz de Tenerife le 20 avril 1657, bien que son argent ait déjà été débarqué. Alliés à la France depuis mars 1657, les troupes anglaises aident Turenne à battre l’armée espagnole et ses alliés royalistes français et anglais, dirigés par Condé et le futur Jacques II, lors de la bataille des dunes le 14 juin 1658, et Dunkerque, qui se rend peu après, est remis à l’Angleterre. Les combats s’arrêtent après la restauration de Charles II en 1660, et les traités signés à Madrid en 1667 et 1670 mettent fin officiellement à la guerre. L’Angleterre garda la Jamaïque ; Charles II vendit Dunkerque à la France en 1662."
"English dates are Old Style (Julian), ten days behind the New Style dates used in Spain, France and Flanders. Fighting in Flanders was part of the wider Franco-Spanish War of 1635–1659.": "Les dates anglaises sont Old Style (Julien), dix jours derrière les dates New Style utilisées en Espagne, France et Flandre. Combattre en Flandre faisait partie de la guerre franco-espagnole plus large de 1635–1659."
