# Some French text was translated automatically.
"Anglo-Spanish War of 1727–1729": "Guerre anglo-espagnole de 1727 à 1729"
"A short war in which Philip V’s Spain, counting on its new alliance with the Emperor Charles VI, tried to win back Gibraltar, which it had ceded to Britain at Utrecht in 1713. On 11 February 1727 a Spanish army under the Count de las Torres, put at between 12,000 and 25,000 men and many of them foreign regiments, opened a siege from the isthmus below the Rock. The Royal Navy held the Strait, and the garrison, about 1,500 men at first, was reinforced by sea to some 5,000. Spanish batteries pounded the north front, but rain, sickness and fire from the Rock wore the besiegers down, and the promised Austrian help never came. Fighting stopped in June 1727 after preliminaries signed in Paris, having cost Spain over 1,400 men against about 300 British. Meanwhile a British squadron blockading Porto Bello in Panama lost some 4,000 men to disease. The Convention of El Pardo (March 1728) and the Treaty of Seville (9 November 1729) restored the position before the war, and Gibraltar stayed British.": "Une courte guerre dans laquelle Philippe V. Espagne, comptant sur sa nouvelle alliance avec l’empereur Charles VI, a tenté de reconquérir Gibraltar, qu’il avait cédé à la Grande-Bretagne à Utrecht en 1713. Le 11 février 1727, une armée espagnole sous le comte de las Torres, mis entre 12 000 et 25 000 hommes et beaucoup d’entre eux régiments étrangers, ouvrit un siège de l’isthme au-dessous du Rocher. La Royal Navy tenait le détroit, et la garnison, environ 1 500 hommes au début, fut renforcée par la mer à quelque 5 000. Les batteries espagnoles battaient le front nord, mais la pluie, la maladie et le feu du Rocher portaient les assiégeurs, et l’aide autrichienne promise n’est jamais venue. Pendant ce temps, un escadron britannique qui bloquait Porto Bello au Panama a perdu quelque 4 000 hommes à cause de la maladie. La Convention d’El Pardo (mars 1728) et le Traité de Séville (9 novembre 1729) ont rétabli la position avant la guerre, et Gibraltar est resté britannique."
"Dates are New Style (Gregorian). Britain still used the Julian calendar, eleven days behind. Some historians date the start of the war to 1726, when Britain sent a fleet to the Spanish Caribbean.": "Les dates sont New Style (Gregorian). La Grande-Bretagne utilise toujours le calendrier julien, onze jours après. Certains historiens datent du début de la guerre à 1726, quand la Grande-Bretagne envoie une flotte dans les Caraïbes espagnoles."
"Spanish historians count this as the thirteenth siege of Gibraltar.": "Les historiens espagnols considèrent cela comme le treizième siège de Gibraltar."
