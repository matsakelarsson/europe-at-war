# Some French text was translated automatically.
"Anglo-Spanish War of 1779–1783": "Guerre anglo-espagnole de 1779 à 1783"
"Spain’s war with Britain as France’s ally during the American War of Independence, fought above all to win back Gibraltar and Minorca. A Franco-Spanish force took Minorca in February 1782, but Gibraltar held out through a siege of three and a half years, the Great Siege, and remained British at the peace of 1783, while Spain kept Minorca and regained Florida.": "L’Espagne fait la guerre avec la Grande-Bretagne comme alliée de la France pendant la guerre d’indépendance américaine, se bat avant tout pour reconquérir Gibraltar et Minorque. Une force franco-espagnole prend Minorque en février 1782, mais Gibraltar tient par un siège de trois ans et demi, le Grand Siège, et reste britannique à la paix de 1783, tandis que l’Espagne garde Minorque et reprend la Floride."
"Spain fought as an ally of France, which had been at war with Britain since 1778, and not formally of the United States. The fighting in the Americas, where Spanish forces took West Florida, and the Franco-Spanish attempt to invade England in the summer of 1779 are only mentioned here.": "L’Espagne se battait comme allié de la France, qui était en guerre avec la Grande-Bretagne depuis 1778, et non pas formellement des États-Unis. Les combats dans les Amériques, où les forces espagnoles ont pris l’ouest de la Floride, et la tentative franco-espagnole d’envahir l’Angleterre à l’été de 1779 sont seulement mentionnés ici."
"The peace was signed at Versailles on 3 September 1783, the same day as the Treaty of Paris between Britain and the United States; together they are often called the Peace of Paris.": "La paix a été signée à Versailles le 3 septembre 1783, le même jour que le traité de Paris entre la Grande-Bretagne et les États-Unis ; ensemble, ils sont souvent appelés la Paix de Paris."
