"Minorca and the grand assault": "Minorque et l’assaut"
"August 1781 – September 1783": "août 1781 – septembre 1783"
"On 19 August 1781 a Spanish army of some 8,000 men under the Duc de Crillon landed on Minorca, British since 1763, and besieged Fort St Philip, which guarded Port Mahon; French and German regiments later raised it to about 14,000. General James Murray’s garrison held out for five months, but shut inside the fort without fresh food it was ravaged by scurvy, and by February only a few hundred men were fit to stand. On 5 February 1782 Murray surrendered, and about 2,500 men marched out. Crillon then took command at Gibraltar, where French and Spanish forces prepared a grand assault by land and sea.": "Le 19 août 1781, une armée espagnole de quelque 8 000 hommes sous le duc de Crillon débarqua sur Minorque, en Grande-Bretagne depuis 1763, et assiégea le fort St Philip, qui gardait Port Mahon ; les régiments français et allemands l’élevaient plus tard à environ 14 000. La garnison du général James Murray s’est tenue pendant cinq mois, mais a été fermée à l’intérieur du fort sans nourriture fraîche, elle a été ravagée par le scorbut, et en février seulement quelques centaines d’hommes ont été aptes à se tenir. Le 5 février 1782, Murray s’est rendu, et environ 2 500 hommes sont sortis. Crillon a ensuite pris le commandement à Gibraltar, où les forces françaises et espagnoles ont préparé une grande attaque terrestre et maritime."
"The French engineer Jean d’Arçon had designed ten floating batteries, with thick walls of timber and wet sand meant to be proof against shot and fire. They attacked on 13 September 1782 while hundreds of guns fired from the isthmus. The garrison answered with red-hot shot, and by night the batteries were burning; all ten were lost, and of their crews some 700 were killed, wounded or drowned, though British boats under Roger Curtis rescued hundreds. In October Admiral Howe brought another convoy into the bay. Peace preliminaries ended the siege on 7 February 1783, and at Versailles on 3 September Spain kept Minorca and regained Florida, but not Gibraltar.": "L’ingénieur français Jean d=Arçon avait conçu dix batteries flottantes, avec des murs épais de bois et de sable humide destinés à être la preuve contre le tir et le feu. Ils attaquèrent le 13 septembre 1782, tandis que des centaines de canons tirés de l’isthme. La garnison répondit par un coup de feu rouge, et la nuit les batteries brûlaient ; toutes les dix furent perdues, et leurs équipages environ 700 furent tués, blessés ou noyés, bien que des embarcations britanniques sous Roger Curtis secourèrent des centaines. En octobre l’amiral Howe apporta un autre convoi dans la baie. Les préliminaires de paix terminèrent le siège le 7 février 1783, et à Versailles le 3 septembre l’Espagne conserva Minorque et reprit la Floride, mais pas Gibraltar."
