"June 1779 – November 1781": "juin 1779 – novembre 1781"
"Spain declared war on Britain on 16 June 1779, as France’s ally, with the recovery of Gibraltar as its chief aim. That summer a combined French and Spanish fleet of some 66 ships of the line sailed into the English Channel to cover an invasion of England, but sickness and indecision ended the attempt. At Gibraltar the Spanish closed the frontier, blockaded the bay and built siege lines across the isthmus. The garrison, some 5,400 men under General George Augustus Eliott, strengthened the batteries on the Rock, but as the winter went on its rations were cut again and again.": "L’Espagne a déclaré la guerre à la Grande-Bretagne le 16 juin 1779, en tant qu’allié de France, avec la reprise de Gibraltar comme objectif principal. Cet été une flotte française et espagnole combinée d’environ 66 navires de la ligne navigua dans la Manche pour couvrir une invasion de l’Angleterre, mais la maladie et l’indécision ont mis fin à la tentative. La garnison, composée de quelque 5 400 hommes sous la direction du général George Augustus Eliott, a renforcé les batteries sur le Rocher, mais l’hiver étant passé, ses rations ont été coupées encore et encore."
"In January 1780 Admiral Sir George Rodney, escorting a convoy, caught a Spanish squadron off Cape St Vincent and in a night action, the “Moonlight Battle”, captured four of its ships, while a fifth blew up; he reached Gibraltar on 25 January with men and supplies. A second convoy under Admiral Darby got through on 12 April 1781, and the Spanish then opened a bombardment that wrecked much of the town; most of the civilians left with Darby’s ships. On the night of 26–27 November 1781 the garrison made a surprise sortie and blew up the forward Spanish batteries, for the loss of a handful of men.": "En janvier 1780, l’amiral sir George Rodney, escortant un convoi, a pris un escadron espagnol au large du cap St Vincent et dans une action de nuit, la bataille de Moonlight, a capturé quatre de ses navires, tandis qu’un cinquième a explosé ; il est arrivé à Gibraltar le 25 janvier avec des hommes et des fournitures. Un second convoi, sous la direction de l’amiral Darby, a traversé le 12 avril 1781 et les Espagnols ont alors ouvert un bombardement qui a détruit une grande partie de la ville ; la plupart des civils sont partis avec les navires Darby. Dans la nuit du 26 au 27 novembre 1781, la garnison a fait une sortie surprise et a fait exploser les batteries espagnoles avant, pour la perte d’une poignée d’hommes."
