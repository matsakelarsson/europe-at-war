"Anglo-Turkish War of 1807–1809": "Guerre anglo-turque de 1807–1809"
"A war between Britain and the Ottoman Empire during the Napoleonic Wars, after Sultan Selim III, encouraged by the French ambassador Horace Sébastiani, drew closer to France and went to war with Russia. In February 1807 a British squadron under Vice-Admiral Sir John Duckworth forced the Dardanelles and anchored off Constantinople, but withdrew under fire from strengthened batteries; in March a British force of about 6,000 men landed at Alexandria, but after defeats at Rosetta by the troops of Muhammad Ali it left Egypt in September. The Treaty of the Dardanelles of 5 January 1809 restored peace.": "Une guerre entre la Grande-Bretagne et l’Empire ottoman pendant les guerres napoléoniennes, après le sultan Selim III, encouragé par l’ambassadeur de France Horace Sébastiani, se rapprocha de la France et partit en guerre avec la Russie. En février 1807, un escadron britannique sous le vice-amiral sir John Duckworth força les Dardanelles et s’ancrea au large de Constantinople, mais se retira sous le feu des batteries renforcées ; en mars, une force britannique d’environ 6 000 hommes débarqua à Alexandrie, mais après des défaites à Rosetta par les troupes de Muhammad Ali il quitta l’Égypte en septembre."
"Russia’s war with the Ottomans at the same time is told in the Russo-Turkish War of 1806–1812.": "La guerre entre la Russie et les Ottomans est racontée en même temps dans la guerre russo-turque de 1806–1812."
