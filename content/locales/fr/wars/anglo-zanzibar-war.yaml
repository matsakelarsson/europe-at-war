# French translations of the catalogue text (wave 13); step bodies follow later.
Anglo-Zanzibar War: Guerre anglo-zanzibarite
A British naval bombardment of the sultan’s palace in Zanzibar town on 27 August 1896, often called the shortest war in history. Zanzibar had been a British protectorate since 1890, and Britain claimed the right to approve each new sultan. When Sultan Hamad bin Thuwaini died suddenly on 25 August 1896, his cousin Khalid bin Barghash occupied the palace and proclaimed himself sultan with about 2,800 armed supporters, palace guards and a few guns. The British ordered him to stand down by 9 a.m. on 27 August. At 9.02 five Royal Navy ships under Rear Admiral Harry Rawson opened fire; about 38 minutes later the palace was in flames, the sultan’s only warship, the Glasgow, had been sunk and the flag shot down. About 500 of Khalid’s supporters were killed or wounded; one British sailor was wounded. Khalid escaped to the German consulate, and Britain installed Hamud bin Muhammad, who abolished slavery in Zanzibar the following year.: Un bombardement naval britannique du palais du sultan, dans la ville de Zanzibar, le 27 août 1896, souvent présenté comme la guerre la plus courte de l’histoire. Zanzibar était un protectorat britannique depuis 1890, et la Grande-Bretagne revendiquait le droit d’approuver chaque nouveau sultan. Lorsque le sultan Hamad bin Thuwaini mourut subitement le 25 août 1896, son cousin Khalid bin Barghash occupa le palais et se proclama sultan avec environ 2 800 partisans armés, des gardes du palais et quelques canons. Les Britanniques lui ordonnèrent de se retirer avant 9 heures le 27 août. À 9 h 02, cinq navires de la Royal Navy commandés par le contre-amiral Harry Rawson ouvrirent le feu ; environ 38 minutes plus tard, le palais était en flammes, le seul navire de guerre du sultan, le Glasgow, avait été coulé et le drapeau abattu. Environ 500 partisans de Khalid furent tués ou blessés ; un marin britannique fut blessé. Khalid se réfugia au consulat d’Allemagne, et la Grande-Bretagne installa Hamud bin Muhammad, qui abolit l’esclavage à Zanzibar l’année suivante.
