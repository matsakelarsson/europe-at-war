# French translations of the catalogue text (wave 13); step bodies follow later.
Anglo-Zulu War: Guerre anglo-zouloue
? The British invasion of the Zulu kingdom of Cetshwayo in 1879. Sir Bartle Frere, the British high commissioner, saw the independent Zulu kingdom and its army as the main obstacle to his plan for a confederation of southern Africa under British rule, and in December 1878, without the British government’s approval, sent Cetshwayo an ultimatum that no Zulu king could accept, demanding among other things that he disband his army. On 11 January 1879 Lord Chelmsford’s army crossed into Zululand in three columns. On 22 January a Zulu army of some 20,000 men destroyed the British camp at Isandlwana, killing more than 1,300 soldiers, one of the worst defeats of a colonial army in Africa; that evening and night the small garrison of Rorke’s Drift beat off a Zulu attack. The coastal column was besieged at Eshowe, but in the north Evelyn Wood’s column repulsed the main Zulu army at Kambula on 29 March, and on 2 April Chelmsford won at Gingindlovu and relieved Eshowe. With reinforcements from Britain he invaded again and defeated the Zulu army at Ulundi on 4 July, burning the royal homestead of oNdini. Cetshwayo was captured on 28 August, and Sir Garnet Wolseley divided the kingdom among thirteen chiefs, a settlement that led to civil war in the 1880s and to the British annexation of Zululand in 1887.
: L’invasion britannique du royaume zoulou de Cetshwayo en 1879. Sir Bartle Frere, haut-commissaire britannique, voyait dans le royaume zoulou indépendant et son armée le principal obstacle à son projet de confédération de l’Afrique australe sous domination britannique et, en décembre 1878, sans l’accord du gouvernement britannique, il adressa à Cetshwayo un ultimatum qu’aucun roi zoulou ne pouvait accepter, exigeant notamment qu’il dissolve son armée. Le 11 janvier 1879, l’armée de lord Chelmsford pénétra au Zoulouland en trois colonnes. Le 22 janvier, une armée zouloue de quelque 20 000 hommes anéantit le camp britannique d’Isandlwana, tuant plus de 1 300 soldats, l’une des pires défaites d’une armée coloniale en Afrique ; le soir même et pendant la nuit, la petite garnison de Rorke’s Drift repoussa une attaque zouloue. La colonne côtière fut assiégée à Eshowe mais, dans le nord, la colonne d’Evelyn Wood repoussa la principale armée zouloue à Kambula le 29 mars et, le 2 avril, Chelmsford l’emporta à Gingindlovu et dégagea Eshowe. Renforcé par des troupes venues de Grande-Bretagne, il envahit de nouveau le pays et vainquit l’armée zouloue à Ulundi le 4 juillet, incendiant la résidence royale d’oNdini. Cetshwayo fut capturé le 28 août, et sir Garnet Wolseley partagea le royaume entre treize chefs, un règlement qui conduisit à la guerre civile dans les années 1880 et à l’annexion britannique du Zoulouland en 1887.
