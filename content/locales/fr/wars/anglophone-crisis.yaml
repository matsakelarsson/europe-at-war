# French translations of the catalogue text (wave 13); step bodies follow later.
Anglophone Crisis: Crise anglophone
? The armed conflict in Cameroon’s two English-speaking regions, the Northwest and Southwest, between the Cameroonian army and separatists who seek an independent state they call Ambazonia. It grew out of protests by lawyers and teachers from October 2016 against the imposition of French-speaking judges and teachers and the long marginalisation of the Anglophone regions, the former British Southern Cameroons, which joined Cameroon in 1961. The government answered with arrests, killings of protesters and a three-month internet shutdown; on 1 October 2017 separatist leaders declared Ambazonia’s independence, and armed groups began attacking soldiers and police. The war has been fought between dozens of separatist militias, which enforce school boycotts and “ghost town” lockdowns and kidnap for ransom, and the army, which has burned villages and killed civilians. A national dialogue in 2019 brought a special status for the two regions but no peace, and mediation by Switzerland and Canada failed. By early 2023 more than 6,000 people had been killed, according to the International Crisis Group, and hundreds of thousands had been displaced. Fighting continued in 2026.
: Le conflit armé qui oppose, dans les deux régions anglophones du Cameroun, le Nord-Ouest et le Sud-Ouest, l’armée camerounaise à des séparatistes qui réclament un État indépendant qu’ils appellent Ambazonie. Il naquit des manifestations d’avocats et d’enseignants qui, à partir d’octobre 2016, protestèrent contre la nomination imposée de juges et d’enseignants francophones et contre la marginalisation de longue date des régions anglophones, l’ancien Cameroun méridional britannique, qui avait rejoint le Cameroun en 1961. Le gouvernement répondit par des arrestations, des meurtres de manifestants et une coupure d’internet de trois mois ; le 1er octobre 2017, des dirigeants séparatistes proclamèrent l’indépendance de l’Ambazonie, et des groupes armés commencèrent à attaquer soldats et policiers. La guerre oppose des dizaines de milices séparatistes, qui imposent le boycott des écoles et des confinements « villes mortes » et pratiquent l’enlèvement contre rançon, à l’armée, qui a incendié des villages et tué des civils. Un dialogue national, en 2019, a valu aux deux régions un statut spécial, mais pas la paix, et les médiations de la Suisse et du Canada ont échoué. Au début de 2023, plus de 6 000 personnes avaient été tuées, selon l’International Crisis Group, et des centaines de milliers avaient été déplacées. Les combats se sont poursuivis en 2026.
