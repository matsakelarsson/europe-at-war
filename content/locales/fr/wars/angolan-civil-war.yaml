# French translations of the catalogue text (wave 13); step bodies follow later.
Angolan Civil War: Guerre civile angolaise
? "The war for power in independent Angola between the MPLA, which held Luanda and proclaimed the People’s Republic of Angola on 11 November 1975, and its rivals UNITA and, until 1976, the FNLA. It began as a Cold War battleground: the Soviet Union armed the MPLA and some 36,000 Cuban troops arrived by early 1976, while South Africa invaded in support of UNITA and the FNLA (Operation Savannah), Zaire backed the FNLA and the United States gave covert aid. The MPLA won the first round; UNITA under Jonas Savimbi rebuilt its army in the south-east with South African and, from 1985, American help. After the battles around Cuito Cuanavale in 1987–1988, the New York Accords brought a Cuban withdrawal and Namibia’s independence, and the Bicesse Accords of 1991 led to elections in 1992. Savimbi rejected his defeat, and the war resumed more destructively than before; the Lusaka Protocol of 1994 broke down in 1998. The war ended only when government troops killed Savimbi on 22 February 2002; the Luena Memorandum of 4 April 2002 made peace. Estimates of the dead range from 500,000 to 800,000, and some 4 million people were displaced."
: "La guerre pour le pouvoir dans l’Angola indépendant entre le MPLA, qui tenait Luanda et proclama la République populaire d’Angola le 11 novembre 1975, et ses rivaux, l’UNITA et, jusqu’en 1976, le FNLA. Elle commença comme un terrain d’affrontement de la guerre froide : l’Union soviétique arma le MPLA et quelque 36 000 soldats cubains étaient arrivés au début de 1976, tandis que l’Afrique du Sud envahissait le pays pour soutenir l’UNITA et le FNLA (opération Savannah), que le Zaïre appuyait le FNLA et que les États-Unis apportaient une aide secrète. Le MPLA remporta la première manche ; l’UNITA de Jonas Savimbi reconstitua son armée dans le sud-est avec l’aide de l’Afrique du Sud puis, à partir de 1985, des États-Unis. Après les batailles autour de Cuito Cuanavale en 1987–1988, les accords de New York entraînèrent le retrait cubain et l’indépendance de la Namibie, et les accords de Bicesse de 1991 débouchèrent sur des élections en 1992. Savimbi refusa sa défaite, et la guerre reprit, plus destructrice qu’auparavant ; le protocole de Lusaka de 1994 vola en éclats en 1998. La guerre ne prit fin que lorsque les troupes gouvernementales tuèrent Savimbi, le 22 février 2002 ; le mémorandum de Luena du 4 avril 2002 rétablit la paix. Les estimations du nombre de morts vont de 500 000 à 800 000, et quelque 4 millions de personnes furent déplacées."
