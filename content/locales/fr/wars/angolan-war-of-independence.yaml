# French translations of the catalogue text (wave 13); step bodies follow later.
Angolan War of Independence: Guerre d’indépendance de l’Angola
? "The war fought in 1961–1974 by Angolan nationalist movements against Portuguese rule, the first and longest theatre of the Portuguese Colonial War. A strike by cotton workers in the Baixa de Cassanje in January 1961 was crushed from the air; on 4 February militants attacked the prisons of Luanda, and on 15 March fighters of Holden Roberto’s UPA rose in the coffee country of the north, killing about 1,000 settlers and thousands of African workers. Portugal’s army and settler militias answered with reprisals that killed tens of thousands and drove hundreds of thousands of Bakongo into the Congo. The war then became a guerrilla war fought from neighbouring countries by three rival movements: the FNLA from Zaire, the MPLA of Agostinho Neto from Congo-Brazzaville and, from 1966, Zambia, and Jonas Savimbi’s UNITA in the east. Portugal, with up to some 65,000 troops, held the towns and most of the country, and the movements fought each other as well as the Portuguese. The war ended with the Carnation Revolution in Lisbon on 25 April 1974; the Alvor Agreement of January 1975 set independence for 11 November 1975, but the movements were already fighting the civil war that followed."
: "La guerre menée de 1961 à 1974 par les mouvements nationalistes angolais contre la domination portugaise, premier et plus long théâtre de la guerre coloniale portugaise. Une grève des ouvriers du coton de la Baixa de Cassanje, en janvier 1961, fut écrasée par l’aviation ; le 4 février, des militants attaquèrent les prisons de Luanda et, le 15 mars, des combattants de l’UPA de Holden Roberto se soulevèrent dans la région caféière du nord, tuant environ 1 000 colons et des milliers de travailleurs africains. L’armée portugaise et les milices de colons répondirent par des représailles qui firent des dizaines de milliers de morts et poussèrent des centaines de milliers de Bakongo à fuir au Congo. La guerre devint ensuite une guérilla menée depuis les pays voisins par trois mouvements rivaux : le FNLA depuis le Zaïre, le MPLA d’Agostinho Neto depuis le Congo-Brazzaville puis, à partir de 1966, depuis la Zambie, et l’UNITA de Jonas Savimbi dans l’est. Le Portugal, avec jusqu’à quelque 65 000 hommes, tenait les villes et la plus grande partie du pays, et les mouvements se combattaient entre eux autant qu’ils combattaient les Portugais. La guerre prit fin avec la révolution des œillets à Lisbonne, le 25 avril 1974 ; l’accord d’Alvor de janvier 1975 fixa l’indépendance au 11 novembre 1975, mais les mouvements étaient déjà engagés dans la guerre civile qui allait suivre."
