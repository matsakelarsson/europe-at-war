# French translations of the catalogue text (wave 8); step bodies follow later.
Annexation of Goa: Annexion de Goa
India’s military takeover of Portuguese India, Goa, Daman and Diu, in December 1961, code-named Operation Vijay. Portugal had ruled Goa since 1510 and, under Salazar, refused to negotiate after Indian independence, declaring its Indian territories overseas provinces of Portugal. After years of failed diplomacy and the suppression of nonviolent protests, India sent about 45,000 troops with air and naval support against a Portuguese garrison of some 3,500. The Governor-General, Manuel António Vassalo e Silva, disobeyed Salazar’s order to fight to the last and surrendered on 19 December after about 36 hours. India calls the operation the Liberation of Goa; Portugal called it an invasion and recognised Indian sovereignty only in 1974.: La prise de contrôle militaire de l’Inde portugaise (Goa, Daman et Diu) par l’Inde en décembre 1961, sous le nom de code d’opération Vijay. Le Portugal gouvernait Goa depuis 1510 et, sous Salazar, refusa de négocier après l’indépendance de l’Inde, faisant de ses territoires indiens des provinces d’outre-mer du Portugal. Après des années d’échecs diplomatiques et la répression de manifestations non violentes, l’Inde envoya environ 45 000 soldats, appuyés par l’aviation et la marine, contre une garnison portugaise de quelque 3 500 hommes. Le gouverneur général, Manuel António Vassalo e Silva, désobéit à l’ordre de Salazar de combattre jusqu’au bout et capitula le 19 décembre, après environ 36 heures. L’Inde appelle l’opération la libération de Goa ; le Portugal la qualifia d’invasion et ne reconnut la souveraineté indienne qu’en 1974.
