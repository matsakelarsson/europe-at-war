# French translations of the catalogue text (wave 8); step bodies follow later.
Annexation of Hyderabad: Annexion d’Hyderabad
India’s military takeover of the princely state of Hyderabad in September 1948, code-named Operation Polo and officially called a “police action”. The Nizam, Mir Osman Ali Khan, ruled the largest princely state, a mostly Hindu land in the middle of the Deccan, and after independence in 1947 refused to join India or Pakistan. While talks dragged on under a standstill agreement, the Razakars, a militia of the Majlis-e-Ittehadul Muslimeen led by Qasim Razvi, terrorised opponents, and a communist-led peasant rising held much of Telangana. On 13 September 1948 Indian forces invaded from west and east, and after four days the Nizam ordered a ceasefire; his army surrendered on 18 September. The fighting was brief, but in the violence that followed tens of thousands of people, most of them Muslims, were killed.: La prise de contrôle militaire de l’État princier d’Hyderabad par l’Inde en septembre 1948, sous le nom de code d’opération Polo, officiellement qualifiée d’« action de police ». Le nizam, Mir Osman Ali Khan, régnait sur le plus grand des États princiers, un pays majoritairement hindou situé au cœur du Dekkan, et refusa après l’indépendance de 1947 de rejoindre l’Inde ou le Pakistan. Tandis que les négociations traînaient sous le régime d’un accord de statu quo, les Razakars, une milice du Majlis-e-Ittehadul Muslimeen dirigée par Qasim Razvi, terrorisaient les opposants, et un soulèvement paysan mené par les communistes tenait une grande partie du Telangana. Le 13 septembre 1948, les forces indiennes envahirent l’État par l’ouest et par l’est, et au bout de quatre jours le nizam ordonna un cessez-le-feu ; son armée capitula le 18 septembre. Les combats furent brefs, mais les violences qui suivirent firent des dizaines de milliers de morts, musulmans pour la plupart.
