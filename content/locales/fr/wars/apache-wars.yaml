# French translations of the catalogue text (wave 14); step bodies follow later.
Apache Wars: Guerres apaches
? The wars of 1849–1886 between the Apache peoples, with their Yavapai neighbours, and the United States and Mexico in the deserts and mountains of Arizona, New Mexico, west Texas, Sonora and Chihuahua. The Apache, the Chiricahua, Western Apache, Mescalero, Jicarilla and others, lived in small independent bands and had raided Spanish and Mexican settlements for more than a century, while Sonora and Chihuahua paid bounties for Apache scalps. When the United States took the region from Mexico in 1848 and 1854, miners, ranchers and soldiers moved into Apache country. The Bascom affair of 1861 turned the Chokonen leader Cochise against the Americans, and the killing of Mangas Coloradas under a flag of truce in 1863 deepened the war. After the Camp Grant massacre of 1871 the government made peace with Cochise and set up reservations, while General George Crook’s columns, guided by Apache scouts, forced the Yavapai and Tonto Apache onto them. The concentration of the bands at San Carlos from 1875 led to the breakouts of Victorio in 1879, who was killed by Mexican troops at Tres Castillos in 1880, and of Juh, Naiche and Geronimo in 1881 and 1885. Geronimo’s surrender at Skeleton Canyon on 4 September 1886 ended the wars; the whole Chiricahua people, including the scouts who had served the army, were sent as prisoners of war to Florida, Alabama and Oklahoma and held until 1913.
: Les guerres de 1849–1886 qui opposèrent les peuples apaches, avec leurs voisins yavapais, aux États-Unis et au Mexique dans les déserts et les montagnes de l’Arizona, du Nouveau-Mexique, de l’ouest du Texas, du Sonora et du Chihuahua. Les Apaches (Chiricahuas, Apaches de l’Ouest, Mescaleros, Jicarillas et d’autres) vivaient en petites bandes indépendantes et menaient depuis plus d’un siècle des raids contre les établissements espagnols puis mexicains, tandis que le Sonora et le Chihuahua payaient des primes pour les scalps apaches. Lorsque les États-Unis prirent la région au Mexique en 1848 et en 1854, mineurs, éleveurs et soldats s’installèrent dans le pays apache. L’affaire Bascom, en 1861, dressa le chef chokonen Cochise contre les Américains, et le meurtre de Mangas Coloradas sous drapeau blanc, en 1863, aggrava la guerre. Après le massacre de Camp Grant, en 1871, le gouvernement fit la paix avec Cochise et créa des réserves, tandis que les colonnes du général George Crook, guidées par des éclaireurs apaches, y contraignaient les Yavapais et les Apaches Tontos. Le regroupement des bandes à San Carlos à partir de 1875 provoqua les évasions de Victorio en 1879 (il fut tué par des troupes mexicaines à Tres Castillos en 1880), puis de Juh, de Naiche et de Geronimo en 1881 et en 1885. La reddition de Geronimo à Skeleton Canyon, le 4 septembre 1886, mit fin aux guerres ; tout le peuple chiricahua, y compris les éclaireurs qui avaient servi l’armée, fut envoyé comme prisonnier de guerre en Floride, en Alabama et en Oklahoma, et détenu jusqu’en 1913.
