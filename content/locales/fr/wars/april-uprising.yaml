# Some French text was translated automatically.
"April Uprising": "Le soulèvement d’avril"
"A Bulgarian rising against Ottoman rule in the spring of 1876, organised by the Bulgarian Revolutionary Central Committee and centred on the Sredna Gora and the western Rhodopes. It was crushed within weeks, largely by bashi-bazouk irregulars, with massacres at Batak, Perushtitsa, Panagyurishte and elsewhere; reports of the “Bulgarian horrors” turned European opinion against the Ottomans and prepared the way for the Russo-Turkish War of 1877–1878 and a Bulgarian state.": "Un Bulgare se lève contre le gouvernement ottoman au printemps de 1876, organisé par le Comité central révolutionnaire bulgare et centré sur la Sredna Gora et les Rhodopes occidentales. Il a été écrasé en quelques semaines, en grande partie par des irrégularités bashi-bazouks, avec des massacres à Batak, Perouchtitsa, Panagyurishte et ailleurs ; les rapports des horreurs bulgares ont tourné l’opinion européenne contre les Ottomans et préparé la voie pour la guerre russo-turque de 1877–1878 et un État bulgare."
"Dates are New Style (Gregorian). Bulgarians used the Julian calendar, then 12 days behind, and Bulgaria commemorates the rising on 20 April, the Old Style date of its outbreak at Koprivshtitsa (2 May New Style).": "Les Bulgares ont utilisé le calendrier julien, puis 12 jours derrière, et la Bulgarie commémore la montée le 20 avril, la date de l’ancien style de son éclosion à Koprivshtitsa (2 mai nouveau style)."
"The number of dead is disputed. Contemporary investigators put the Bulgarian dead at 12,000 (Walter Baring) to 15,000 (Eugene Schuyler), and the French and Russian consuls at 25,000–40,000; some later historians, notably Justin McCarthy and Stanford Shaw, give much lower figures and stress Muslim victims, which the contemporary reports put at a few hundred.": "Les enquêteurs contemporains mettent les Bulgares morts à 12 000 (Walter Baring) à 15 000 (Eugene Schuyler), et les consuls français et russes à 25 000 à 40 000 ; certains historiens plus tard, notamment Justin McCarthy et Stanford Shaw, donnent des chiffres beaucoup moins élevés et stressent les victimes musulmanes, que les rapports contemporains ont mis à quelques centaines."
