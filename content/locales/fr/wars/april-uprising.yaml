"April – June 1876": "avril – juin 1876"
"In November 1875 the Bulgarian Revolutionary Central Committee, meeting in exile at Giurgiu in Romania, planned a general rising for the spring and divided the country into revolutionary districts. Arms were hoarded, and in the Sredna Gora the rebels even made a cannon out of cherry wood. A delegate betrayed the plan after a meeting at Oborishte, and Ottoman police tried to arrest the leaders in Koprivshtitsa. On 2 May 1876 Todor Kableshkov’s men attacked the police post there and proclaimed the rising, two weeks early. It spread across the Sredna Gora and the western Rhodopes, with smaller risings around Gabrovo, Tryavna and Sliven and near Berovo in Macedonia.": "En novembre 1875, le Comité central révolutionnaire bulgare, réuni en exil à Giurgiu en Roumanie, planifia une montée générale pour le printemps et divisa le pays en districts révolutionnaires. Les armes étaient entreposées, et dans la Sredna Gora les rebelles firent même un canon en bois de cerise. Un délégué trahit le plan après une réunion à Oborishte, et la police ottomane tenta d’arrêter les dirigeants de Koprivshtitsa. Le 2 mai 1876, les hommes de Todor Kableshkov ont attaqué le poste de police et proclamé la montée, deux semaines plus tôt. Elle s’est répandue à travers la Sredna Gora et les Rhodopes occidentales, avec des ascensions plus petites autour de Gabrovo, Tryavna et Sliven et près de Berovo en Macédoine."
"Rather than send regular troops, the authorities largely armed bashi-bazouk irregulars, among them Pomaks and Circassians, who put down the rising by the middle of May with massacres. Panagyurishte, Perushtitsa, Klisura and Batak were sacked; at Batak alone some 5,000 people are thought to have been killed. Bratsigovo, which fought regular troops, suffered far fewer deaths. On 29 May the poet Hristo Botev landed from a Danube steamer at Kozloduy with about 200 émigrés from Romania; his band was scattered in the Vratsa Balkan, and he was killed on 1 June.": "Plutôt que d’envoyer des troupes régulières, les autorités ont en grande partie armé des irréguliers bashi-bazouks, parmi lesquels Pomaks et Circassiens, qui ont mis à terre la montée vers le milieu de mai avec des massacres. Panagyurishte, Perouchtitsa, Klisura et Batak ont été saccagés ; à Batak seul, quelque 5 000 personnes auraient été tuées. Le 29 mai, le poète Hristo Botev débarqua d’un vapeur du Danube à Kozloduy avec environ 200 émigrés de Roumanie ; son groupe fut dispersé dans les Balkans de la Vratsa et il fut tué le 1er juin."
"The Americans Eugene Schuyler and Januarius MacGahan reported the killings, and a British inquiry by Walter Baring largely confirmed them. William Gladstone’s pamphlet Bulgarian Horrors and the Question of the East, published in September 1876, roused British opinion, and the British government, Russia’s rival, could no longer support the Ottomans as before. When the Constantinople Conference of the powers failed to impose reforms early in 1877, Russia went to war, and in 1878 an autonomous Bulgarian principality was created.": "Les Américains Eugene Schuyler et Januarius MacGahan ont rapporté les meurtres, et une enquête britannique de Walter Baring les a largement confirmés. William GladstoneS pamphlet Horrors bulgares et la question de l’Est, publié en septembre 1876, a suscité l’opinion britannique, et le gouvernement britannique, rival de Russie, ne pouvait plus soutenir les Ottomans comme auparavant. Lorsque la Conférence de Constantinople des puissances n’a pas réussi à imposer des réformes au début de 1877, la Russie est partie en guerre et une principauté bulgare autonome a été créée en 1878."
