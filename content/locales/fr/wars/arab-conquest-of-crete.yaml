"827": "827"
"Arab conquest of Crete": "Conquête arabe de la Crète"
"The conquest of Byzantine Crete by a band of Muslim exiles from al-Andalus, who had held Alexandria until the Abbasids expelled them. Led by Abu Hafs, they beat off the expeditions of the Emperor Michael II, founded Chandax (Heraklion) and made the island an emirate that raided the Aegean until the Byzantines retook it in 961.": "La conquête de la Crète byzantine par une bande d’exilés musulmans d’al-Andalus, qui avait tenu Alexandrie jusqu’à ce que les Abbassides les expulsent. Dirigés par Abu Hafs, ils ont battu les expéditions de l’empereur Michael II, fondé Chandax (Héraklion) et fait de l’île un émirat qui a attaqué l’Egée jusqu’à ce que les Byzantins la reprennent en 961."
"The date of the landing is uncertain. Muslim sources put it in 827 or 828, after the expulsion from Alexandria; Byzantine sources place it soon after the revolt of Thomas the Slav (821–823), and several historians now prefer about 824. The landing place is unknown.": "La date du débarquement est incertaine. Des sources musulmanes le mettent en 827 ou 828, après l’expulsion d’Alexandrie ; des sources byzantines la placent peu de temps après la révolte de Thomas le Slave (821-823), et plusieurs historiens préfèrent maintenant environ 824."
"The exiles are traditionally said to be survivors of the Revolt of the Suburb in Córdoba in 818, but Andalusi corsairs were active in Alexandria earlier, and their leader came from Fahs al-Ballut (Los Pedroches), north of Córdoba. Their numbers are estimated at about 12,000 people, of whom some 3,000 were fighting men.": "On dit traditionnellement que les exilés sont des survivants de la révolte de la banlieue de Cordoue en 818, mais les corsaires d’Andalousie étaient actifs à Alexandrie plus tôt, et leur chef est venu de Fahs al-Ballut (Los Pedroches), au nord de Cordoue. Leur nombre est estimé à environ 12 000 personnes, dont quelque 3 000 combattaient des hommes."
"The Byzantine reconquest is told in the Byzantine reconquest of Crete.": "La reconquête byzantine est racontée dans la reconquête byzantine de Crète."
