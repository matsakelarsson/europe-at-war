"c. 824–827": "c. 824–827"
"In 818 the emir of Córdoba, al-Hakam I, crushed a revolt in the suburb south of his capital and exiled its people. Many of them, with other Andalusi sailors, made their way to Alexandria, where they seized power in the confusion of the Abbasid civil war. In 827 the Abbasid general Abdallah ibn Tahir besieged them and let them leave with their families in some forty ships. Led by Abu Hafs Umar al-Balluti, they landed on Crete, which they may already have raided. Byzantine writers say Abu Hafs burned the ships so his men could not turn back, but as they had brought their families, this is probably a later story.": "En 818 l’émir de Cordoue, al-Hakam Ier, a écrasé une révolte dans la banlieue sud de sa capitale et exilé son peuple. Beaucoup d’entre eux, avec d’autres marins Andalousie, ont fait leur chemin à Alexandrie, où ils ont pris le pouvoir dans la confusion de la guerre civile abbasside. En 827, le général abbasside Abdallah ibn Tahir les assiégea et les laissa partir avec leurs familles dans une quarantaine de navires. Dirigés par Abu Hafs Umar al-Balluti, ils débarquèrent en Crète, qu’ils auraient peut-être déjà attaqués."
"The Emperor Michael II, weakened by the revolt of Thomas the Slav, sent a force under Photeinos and Damian, which was beaten; Damian was killed. A second expedition of 70 ships under Krateros won a first battle but was routed in a night attack, and Krateros, who fled to Kos, was captured there and crucified. The Andalusis founded a new capital on the north coast, Chandax, “the castle of the moat”, recognised the Abbasid caliph as their nominal overlord and ruled the island as an independent emirate. Byzantine fleets cleared them from the nearby islands, but Crete became the base for raids across the Aegean for more than a century.": "L’empereur Michel II, affaibli par la révolte de Thomas le Slave, envoya une force sous Photeinos et Damian, qui fut battu ; Damian fut tué. Une deuxième expédition de 70 navires sous Krateros a gagné une première bataille mais a été acheminée dans une attaque nocturne, et Krateros, qui s’est enfui à Kos, a été capturé et crucifié. L’Andalousie a fondé une nouvelle capitale sur la côte nord, Chandax, le château du fossé, reconnu le calife abbasside comme leur seigneur nominal et a gouverné l’île comme un émirat indépendant. Les flottes byzantines les ont libérés des îles voisines, mais la Crète est devenue la base de raids à travers l’Egée pendant plus d’un siècle."
