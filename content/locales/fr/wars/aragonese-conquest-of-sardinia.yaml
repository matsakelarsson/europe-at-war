"In 1297 Pope Boniface VIII had granted Sardinia and Corsica to James II of Aragon in return for his giving up Sicily, but the island was not his to take. Pisa ruled the south and east, the Genoese Doria and Malaspina families much of the north, and the Judicate of Arborea, the last of Sardinia’s native kingdoms, the west. In April 1323 Judge Hugh II of Arborea declared himself James’s vassal and attacked the Pisans. On 13 June an Aragonese fleet of some 300 ships under James’s heir, the Infante Alfonso, landed at Palma di Sulcis in the south-west.": "En 1297, le pape Boniface VIII avait accordé la Sardaigne et la Corse à Jacques II d’Aragon en échange de son abandon de Sicile, mais l’île n’était pas à lui. Pise gouvernait le sud et l’est, les familles génoises Doria et Malaspina une grande partie du nord, et le Judice d’Arborea, le dernier des royaumes indigènes de Sardaigne, l’ouest. En avril 1323, le juge Hugh II d’Arborea se déclara vassal James et attaqua les Pisans. Le 13 juin, une flotte aragonaise de quelque 300 navires sous l’héritier de James, l’infante Alfonso, débarqua à Palma di Sulcis dans le sud-ouest."
"Alfonso besieged the silver-mining town of Villa di Chiesa (Iglesias), which held out for seven months until hunger forced it to surrender on 7 February 1324, while malaria took a heavy toll of his army. He then turned on Cagliari. On 29 February a Pisan relief army was beaten at Lucocisterna, near Elmas, and the same day the Aragonese fleet beat the Pisan ships off Cagliari. In the peace of June 1324 Pisa gave up its Sardinian lands, keeping only the castle of Cagliari as a fief; after another war it lost that too in 1326. Its Pisan people were expelled, and Cagliari, settled by Catalans, became the capital of the Kingdom of Sardinia.": "Alfonso assiégea la ville minière d’argent de Villa di Chiesa (Iglesias), qui se tint pendant sept mois jusqu’à ce que la faim l’oblige à se rendre le 7 février 1324, tandis que la malaria prit un lourd tribut de son armée. Le 29 février, une armée de secours pisan a été battue à Lucocisterna, près d’Elmas, et le même jour la flotte aragonaise a battu les navires Pisan au large de Cagliari. Dans la paix de juin 1324 Pise a renoncé à ses terres sardes, gardant seulement le château de Cagliari comme un fief ; après une autre guerre il a perdu cela aussi en 1326. Son peuple Pisan a été expulsé, et Cagliari, établi par les Catalans, est devenu la capitale du Royaume de Sardaigne."
