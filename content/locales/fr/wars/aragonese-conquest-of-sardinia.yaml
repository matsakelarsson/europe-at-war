"1353–1420": "1353–1420"
"Aragon struggled to hold the island. The Doria rebelled repeatedly with Genoese backing, and in 1353 Judge Marianus IV of Arborea, who wanted the whole of Sardinia for his own house, joined them. That August an Aragonese and Venetian fleet beat the Genoese off Porto Conte, and in 1354 King Peter IV took Alghero, expelled its people and resettled it with Catalans, whose language is still spoken there. Marianus’s armies overran most of the island in the 1360s, leaving Aragon little more than Cagliari and Alghero. His daughter Eleanor, who ruled for her sons from 1383, kept up the struggle and in about 1392 issued the Carta de Logu, a law code that stayed in force until 1827.": "Aragon a lutté pour tenir l’île. La Doria s’est rebellée à plusieurs reprises avec le soutien de Genoese, et en 1353 le juge Marianus IV d’Arborea, qui voulait toute la Sardaigne pour sa propre maison, les a rejoints. En août, une flotte aragonaise et vénitienne battit le Génois au large de Porto Conte, et en 1354 le roi Pierre IV prit Alghero, expulsa son peuple et le réinstalla avec des Catalans, dont la langue y est encore parlée. Sa fille Eleanor, qui gouverna ses fils de 1383, poursuivit la lutte et, vers 1392, publia la Carta de Logu, un code de loi qui resta en vigueur jusqu’en 1827."
"In 1409 Martin the Younger, King of Sicily and heir to Aragon, brought an army to Sardinia. On 30 June at Sanluri he crushed the army of Arborea and its Genoese allies under the new judge, William III of Narbonne, a French grandson of Eleanor’s sister; thousands of Sardinians were killed. Martin died of malaria at Cagliari on 25 July, but Oristano surrendered in 1410, and its lord, Leonardo Cubello, became Marquis of Oristano under the crown. William held out in the north until 1420, when he sold his remaining rights to Alfonso V for 100,000 gold florins. Castelsardo, the last Doria stronghold, fell in 1448.": "En 1409, Martin le Jeune, roi de Sicile et héritier d’Aragon, apporta une armée en Sardaigne. Le 30 juin à Sanluri, il détruisit l’armée d’Arborée et ses alliés génois sous le nouveau juge William III de Narbonne, petit-fils français de la sœur d’Eleanor ; des milliers de sardes furent tués. Martin mourut de la malaria à Cagliari le 25 juillet, mais Oristano se rendit en 1410 et son seigneur, Leonardo Cubello, devint marquis d’Oristano sous la couronne. William tenait dans le nord jusqu’en 1420, quand il vendit ses droits restants à Alfonso V pour 100 000 florins d’or. Castelsardo, dernier bastion de Doria, tomba en 1448."
