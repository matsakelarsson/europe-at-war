"1354": "1354"
"Aragonese conquest of Sardinia": "conquête aragonaise de la Sardaigne"
"The long conquest of Sardinia by the Crown of Aragon, to which the pope had granted the island in 1297. The Infante Alfonso took the Pisan lands in 1323–1324, creating the Kingdom of Sardinia, but Aragon then fought the Doria and Genoa and, from 1353, the native Judicate of Arborea, which at times held most of the island; Martin the Younger’s victory at Sanluri in 1409 broke Arborea, and its last judge sold his rights in 1420.": "La longue conquête de la Sardaigne par la Couronne d’Aragon, à laquelle le pape avait accordé l’île en 1297. L’infante Alfonso prit les terres Pisanes en 1323–1324, créant le royaume de Sardaigne, mais Aragon combattit alors la Doria et Gênes et, à partir de 1353, le Judice indigène d’Arborée, qui tenait parfois la plus grande partie de l’île ; Martin le Jeune, victoire à Sanluri en 1409 brisa Arborea, et son dernier juge vendit ses droits en 1420."
"Medieval Sardinia was divided into four judicates (giudicati), native kingdoms ruled by judges. By 1323 only Arborea survived; Pisa held the former judicates of Cagliari and Gallura, and the Genoese Doria and Malaspina families and the city of Sassari held most of the north.": "La Sardaigne médiévale était divisée en quatre juges (giudicati), royaumes indigènes gouvernés par les juges. En 1323 seulement Arborea survécu ; Pise tenu les anciens juges de Cagliari et Gallura, et les familles génoises Doria et Malaspina et la ville de Sassari tenu la plupart du nord."
"Arborea fought on Aragon’s side in 1323–1324 and against it from 1353. The war of 1353–1420 is often called the Sardinian–Catalan or Sardinian–Aragonese war, and was broken by several truces and peaces (1355, 1388).": "Arborea a combattu sur le côté d’Aragon en 1323–1324 et contre lui à partir de 1353. La guerre de 1353–1420 est souvent appelée la guerre sarde-catalienne ou sarde-aragonaise, et a été brisée par plusieurs trêves et paixs (1355, 1388)."
