# Some French text was translated automatically.
"Aragonese Crusade": "Croisade aragonaise"
"A crusade proclaimed by Pope Martin IV against Peter III of Aragon, who had taken Sicily from Charles of Anjou after the Sicilian Vespers of 1282. Philip III of France, allied with James II of Majorca, invaded Catalonia in 1285 to win Aragon for his son Charles of Valois and took Girona, but Roger of Lauria’s fleet destroyed the French at sea, disease ravaged the army, and the king died at Perpignan during the retreat. Peace with France and the pope came at Tarascon in 1291 and Anagni in 1295.": "Une croisade proclamée par le Pape Martin IV contre Pierre III d’Aragon, qui avait pris la Sicile de Charles d’Anjou après les Vêpres siciliennes de 1282. Philippe III de France, allié avec Jacques II de Majorque, envahit la Catalogne en 1285 pour gagner Aragon pour son fils Charles de Valois et prit Girona, mais Roger de Lauria, la flotte détruisit les Français en mer, la maladie ravageait l’armée, et le roi mourut à Perpignan pendant la retraite."
"The crusade was one front of the War of the Sicilian Vespers (1282–1302), which has its own entry.": "La croisade était un front de la guerre des Vêpres siciliennes (1282–1302), qui a sa propre entrée."
"The chronicles of Bernat Desclot and Ramon Muntaner, both Catalan, are the main narratives; they give the French army as well over 100,000 men, far more than it can have been. Dates are Julian.": "Les chroniques de Bernat Desclos et Ramon Muntaner, tous deux catalans, sont les principaux récits ; elles donnent à l’armée française ainsi qu’à plus de 100 000 hommes, bien plus que cela n’aurait pu être."
