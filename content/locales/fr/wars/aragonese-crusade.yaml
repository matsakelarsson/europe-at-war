"Elne and the siege of Girona": "Elne et le siège de Girona"
"1284–1285": "1284–1285"
"After the Sicilian Vespers of 1282, Peter III of Aragon took the crown of Sicily from Charles of Anjou, the brother of Saint Louis of France. Pope Martin IV, a Frenchman, excommunicated Peter and declared him deposed, and in 1284 Philip III of France accepted the crown of Aragon for his younger son, Charles of Valois. The pope proclaimed the war a crusade. Peter’s own brother, James II of Majorca, who held Roussillon and Montpellier as well as the Balearic Islands, sided with France. In the spring of 1285 Philip and Charles led a large army south into Roussillon.": "Après les Vêpres siciliens de 1282, Pierre III d’Aragon prit la couronne de Sicile de Charles d’Anjou, frère de saint Louis de France. Le pape Martin IV, Français, excommunia Pierre et le déclara déposé, et en 1284 Philippe III de France accepta la couronne d’Aragon pour son fils cadet, Charles de Valois. Le frère de Peter, Jacques II de Majorque, qui tenait Roussillon et Montpellier ainsi que les îles Baléares, s’est joint à la France. Au printemps de 1285, Philippe et Charles menèrent une grande armée au sud dans Roussillon."
"On 25 May 1285 the crusaders stormed Elne, whose people had resisted them, burned the cathedral and massacred many of the inhabitants. Peter’s troops held the main pass over the Pyrenees, the Col de Panissars, but in June the French crossed by another pass farther east and descended on the Empordà. They besieged Girona from late June. Its garrison under Ramon Folc of Cardona held out through the summer while dysentery spread through the French camp, and the city surrendered only on 7 September, too late in the year to be of much use.": "Le 25 mai 1285, les croisés s’emparèrent d’Elne, dont le peuple leur avait résisté, incendièrent la cathédrale et massacrérent de nombreux habitants. Les troupes de Pierre tenaient le col principal au-dessus des Pyrénées, le Col de Panissars, mais en juin les Français passèrent par un autre passage plus à l’est et descendirent sur l’Embordà. Sa garnison sous Ramon Folc de Cardona s’est déroulée tout au long de l’été, tandis que la dysenterie se répandait dans le camp français, et la ville ne s’était rendue que le 7 septembre, trop tard pour être très utile."
