"Les Formigues and the retreat": "Les Formigues et la retraite"
"September–October 1285": "septembre–octobre 1285"
"Peter’s admiral, Roger of Lauria, brought his galleys back from Sicily. Early on 4 September, probably near the Formigues islets off the Catalan coast, he attacked a French and Genoese galley fleet and destroyed or captured much of it, and then swept the French supply ships from the coast. Without command of the sea the invaders could not feed an army that disease was already destroying. Philip III, himself ill, ordered a retreat.": "Au début du 4 septembre, probablement près des îlots de Formigues au large de la côte catalane, il attaqua une flotte française et génoise de galères et en détruisit ou en captura une grande partie, puis balaya les navires d’alimentation français de la côte. Sans commandement de la mer, les envahisseurs ne purent pas nourrir une armée qui était déjà en train de détruire la maladie. Philippe III, lui-même malade, ordonna une retraite."
"Peter let the French king and his household pass through the mountains, but on 30 September and 1 October his troops fell on the rearguard and baggage at the Col de Panissars and slaughtered many of them. Philip died at Perpignan on 5 October, and Peter III on 11 November. His son Alfonso III punished James II of Majorca by taking Mallorca from him in 1285–1286 and conquered Muslim Menorca in 1287. The Treaty of Tarascon (1291) reconciled Aragon with the pope and France, and by the Treaty of Anagni (1295) Aragon gave up Sicily, which the Sicilians fought on to keep, and agreed to return the Balearics to James II.": "Pierre laissa passer le roi français et sa famille, mais les 30 septembre et 1er octobre ses troupes tombaient sur l’arrière-garde et les bagages au Col de Panissars et massacrés beaucoup d’entre eux. Philippe mourut à Perpignan le 5 octobre, et Pierre III le 11 novembre. Son fils Alfonso III punit Jacques II de Majorque en lui prenant Majorque en 1285-1286 et conquiert Muslim Menorca en 1287. Le traité de Tarascon (1291) réconcilia l’Aragon avec le pape et la France, et par le traité d’Anagni (1295) Aragon abandonna la Sicile, que les Siciliens combattirent pour garder, et acceptèrent de rendre les Baléares à Jacques II."
