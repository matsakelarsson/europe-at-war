# Some French text was translated automatically.
"Ararat rebellion": "Rébellion d’Ararat"
"A Kurdish rising around Mount Ararat in eastern Turkey, organised by the Kurdish nationalist league Xoybûn, which had proclaimed a Republic of Ararat there in 1927, and led by Ihsan Nuri Pasha; Turkish offensives and heavy air bombardment crushed it in the summer of 1930, with many civilians killed in the Zilan valley in July. The last rebels were defeated or fled into Persia by 1931, and in 1932 Persia ceded the slopes of Lesser Ararat to Turkey in exchange for land elsewhere on the border, to close the rebels’ refuge.": "Un kurde qui se levait autour du mont Ararat dans l’est de la Turquie, organisé par la Ligue nationaliste kurde Xoybûn, qui y avait proclamé une République d’Ararat en 1927, et dirigé par Ihsan Nuri Pacha ; des offensives turques et un bombardement aérien lourd l’ont écrasé à l’été 1930, avec de nombreux civils tués dans la vallée du Zilan en juillet. Les derniers rebelles ont été défaits ou ont fui en Perse en 1931, et en 1932 la Perse a cédé les pentes de Petit Ararat à la Turquie en échange de terres ailleurs sur la frontière, pour fermer le refuge des rebelles."
"Also known as the Ağrı rebellion; Ağrı Dağı is the Turkish name of Mount Ararat. Fighting around the mountain began in 1926–1927, and the number of people killed in the Zilan valley in July 1930 is disputed.": "Aussi connu sous le nom de rébellion Ağrı ; Ağrı Dağı est le nom turc du mont Ararat. Combattre autour de la montagne a commencé en 1926-1927, et le nombre de personnes tuées dans la vallée de Zilan en juillet 1930 est contesté."
