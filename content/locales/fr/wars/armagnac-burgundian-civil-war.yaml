# Some French text was translated automatically.
"Armagnac–Burgundian Civil War": "Guerre civile entre Armagnacs et Bourguignons"
"A civil war between two branches of the French royal family for control of the government of the mentally ill Charles VI. It began when John the Fearless, Duke of Burgundy, had the king’s brother Louis of Orléans murdered in Paris in 1407; Louis’s son Charles and Charles’s father-in-law Bernard VII of Armagnac led the opposing party. Both sides sought English help. The Burgundians took Paris in 1418 and massacred Armagnacs, the dauphin’s men killed John the Fearless at Montereau in 1419, and his son Philip the Good allied with England until the Treaty of Arras reconciled Burgundy with Charles VII in 1435.": "Une guerre civile entre deux branches de la famille royale française pour le contrôle du gouvernement des malades mentaux Charles VI. Il a commencé quand Jean l’Intrépide, duc de Bourgogne, a fait assassiner le roi Louis d’Orléans à Paris en 1407 ; Louis son fils Charles et Charles Son beau-père Bernard VII d’Armagnac a dirigé le parti adverse. Les Bourguignons prirent Paris en 1418 et massacrérent les Armagnacs, les dauphins tuèrent Jean l’Intrépide à Montereau en 1419, et son fils Philippe le Bon allié à l’Angleterre jusqu’à ce que le traité d’Arras réconciliât la Bourgogne avec Charles VII en 1435."
"After 1419 the Armagnacs were in effect the party of the dauphin, later Charles VII, and the civil war merged into the Hundred Years’ War. Paris also saw the Cabochien revolt of 1413, a rising of butchers and craftsmen on the Burgundian side.": "Après 1419 les Armagnacs furent en effet le parti du dauphin, plus tard Charles VII, et la guerre civile fusionna dans la guerre de Cent Ans. Paris vit aussi la révolte cabochien de 1413, une montée des bouchers et artisans du côté bourguignon."
