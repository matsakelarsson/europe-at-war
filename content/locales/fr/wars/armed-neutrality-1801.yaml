"December 1800 – March 1801": "décembre 1800 – mars 1801"
"During the wars against revolutionary France, the Royal Navy stopped and searched neutral merchant ships for goods bound for its enemies. Denmark–Norway, with one of Europe’s largest merchant fleets, sent warships to escort its convoys, which led to clashes at sea. In December 1800 Tsar Paul I of Russia brought Denmark–Norway, Sweden and Prussia into a League of Armed Neutrality to resist the searches. Britain saw the league as a pro-French alliance that threatened its supplies of timber, hemp and tar from the Baltic.": "Au cours des guerres contre la France révolutionnaire, la Royal Navy s’arrêta et chercha des navires marchands neutres à destination de ses ennemis. Danemark-Norvège, avec l’une des plus grandes flottes marchandes d’Europe, envoya des navires de guerre pour escorter ses convois, ce qui conduisit à des affrontements en mer. En décembre 1800, le tsar Paul Ier de Russie fit entrer le Danemark-Norvège, la Suède et la Prusse dans une Ligue de neutralité armée pour résister aux recherches. La Grande-Bretagne considérait la ligue comme une alliance pro-française qui menaçait ses approvisionnements en bois, chanvre et goudron de la Baltique."
"In March 1801 a British fleet under Admiral Sir Hyde Parker, with Vice-Admiral Horatio Nelson as second in command, sailed from Great Yarmouth to break up the league before the Russian, Swedish and Danish fleets could join. It passed through the Sound on 30 March, keeping close to the Swedish shore, whose guns stayed silent. Most of the Danish fleet was laid up without masts or rigging, so the defence of Copenhagen rested on a line of old ships, hulks and floating batteries moored before the city.": "En mars 1801, une flotte britannique placée sous le commandement de l’amiral Sir Hyde Parker, avec le vice-amiral Horatio Nelson en deuxième position, partit de Great Yarmouth pour rompre la ligue avant que les flottes russe, suédoise et danoise puissent s’y joindre. La plupart de la flotte danoise a été posée sans mâts ni gréement, de sorte que la défense de Copenhague reposait sur une ligne de vieux navires, des hulks et des batteries flottantes amarrées devant la ville."
