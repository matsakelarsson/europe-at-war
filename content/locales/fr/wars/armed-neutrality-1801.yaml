"2 April 1801": "2 avril 1801"
"On the morning of 2 April Nelson led twelve ships of the line and smaller vessels down the narrow channel in front of Copenhagen. Three of his ships ran aground, but the rest anchored opposite the Danish line and opened fire. The Danes and Norwegians, many of them untrained volunteers, fought for about four hours. When Parker signalled him to break off the action, Nelson is said to have put his telescope to his blind eye and claimed he could not see the signal.": "Le matin du 2 avril, Nelson conduisit douze navires de la ligne et de plus petits navires sur le chenal étroit en face de Copenhague. Trois de ses navires s’échouèrent, mais le reste se coucha en face de la ligne danoise et ouvrit le feu. Les Danois et les Norvégiens, dont beaucoup étaient des volontaires non entraînés, combattirent environ quatre heures. Quand Parker l’a averti de rompre l’action, Nelson aurait mis son télescope à l’œil aveugle et a prétendu qu’il ne pouvait pas voir le signal."
"By the afternoon most of the Danish ships had been silenced or taken. Nelson sent a letter ashore offering a truce, which Crown Prince Frederick accepted. The British lost 274 killed and 737 wounded; Danish and Norwegian casualties are uncertain, and estimates range from about 1,000 to 1,800 killed and wounded, with many more taken prisoner. After days of talks Denmark agreed on 9 April to a fourteen-week armistice and suspended its part in the league. News arrived that Tsar Paul had been murdered on 23–24 March, and the league fell apart.": "L’après-midi, la plupart des navires danois avaient été réduits au silence ou pris. Nelson envoya une lettre à terre offrant une trêve, que le prince héritier Frederick accepta. Les Britanniques perdirent 274 tués et 737 blessés ; les pertes danoises et norvégiennes sont incertaines, et les estimations vont d’environ 1 000 à 1 800 morts et blessés, avec beaucoup plus de prisonniers. Les nouvelles arrivaient que le tsar Paul avait été assassiné les 23 et 24 mars, et la ligue s’écroulait."
