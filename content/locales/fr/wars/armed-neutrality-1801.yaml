# Some French text was translated automatically.
"War of the Second Armed Neutrality": "Guerre de la deuxième neutralité armée"
"A brief war in 1801 in which Britain sent a fleet to break up the Russian-led League of Armed Neutrality, which Denmark–Norway had joined. Nelson’s attack on the Danish defence line at Copenhagen on 2 April forced Denmark to suspend its part in the league, which collapsed after the murder of Tsar Paul I.": "Une brève guerre en 1801 au cours de laquelle la Grande-Bretagne a envoyé une flotte pour briser la Ligue russe de neutralité armée, que le Danemark et la Norvège avaient rejointe. Nelson attaque sur la ligne de défense danoise à Copenhague le 2 avril a forcé le Danemark à suspendre sa part dans la ligue, qui s’est effondrée après le meurtre du tsar Paul Ier."
"Dates are New Style. In Denmark the battle is called Slaget på Reden, “the Battle of the Roads”, and it opened the period known as the English Wars (Englandskrigene), which continued with the Gunboat War of 1807–1814.": "Au Danemark, la bataille s’appelle Slaget på Reden, la Bataille des Routes, et elle a ouvert la période connue sous le nom de Guerres Anglaises (Englandskrigene), qui a continué avec la guerre des canons de 1807–1814."
