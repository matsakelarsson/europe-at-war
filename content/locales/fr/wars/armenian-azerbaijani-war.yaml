# Some French text was translated automatically.
"Armenian–Azerbaijani War": "Guerre Arménienne-Azerbaïdjan"
"A war between the newly independent republics of Armenia and Azerbaijan over the mixed borderlands of Karabakh, Zangezur and Nakhchivan, in which both sides massacred and expelled civilians. It ended when the Red Army occupied Azerbaijan in April 1920 and Armenia that November; Soviet rule later placed Nagorno-Karabakh and Nakhchivan in Azerbaijan and Zangezur in Armenia.": "Une guerre entre les républiques nouvellement indépendantes d’Arménie et d’Azerbaïdjan sur les zones frontalières mixtes du Karabakh, Zangezur et Nakhchivan, au cours de laquelle les deux parties ont massacré et expulsé des civils, a pris fin lorsque l’Armée rouge a occupé l’Azerbaïdjan en avril 1920 et l’Arménie en novembre ; le gouvernement soviétique a ensuite placé le Haut-Karabakh et le Nakhchivan en Azerbaïdjan et le Zangezur en Arménie."
"Among the worst killings were the March Days of 1918, when Bolshevik and Armenian forces in Baku killed thousands of Muslims, the killing of Armenians when Ottoman and Azerbaijani forces took Baku in September 1918, and the Shusha massacre of March 1920.": "Parmi les pires tueries, on peut citer les journées de mars 1918, où les forces bolcheviques et arméniennes à Bakou ont tué des milliers de musulmans, le meurtre d’Arméniens lorsque les forces ottomanes et azerbaïdjanaises ont pris Bakou en septembre 1918, et le massacre de Shusha en mars 1920."
"The Ottoman Army of Islam fought alongside Azerbaijan in 1918, and British troops occupied Baku and oversaw Karabakh from November 1918 to August 1919.": "L’armée ottomane de l’islam combattit aux côtés de l’Azerbaïdjan en 1918, et les troupes britanniques occupèrent Bakou et surveillèrent le Karabakh de novembre 1918 à août 1919."
"The numbers of victims are disputed. Estimates for the Shusha massacre range from about 500 to 30,000, depending on the source and the area counted, and for the killing of Armenians in Baku in September 1918 from about 10,000 to 20,000.": "Le nombre de victimes est contesté. Les estimations pour le massacre de Shusha vont d’environ 500 à 30 000, selon la source et la zone comptée, et pour le meurtre des Arméniens à Bakou en septembre 1918 d’environ 10 000 à 20 000."
