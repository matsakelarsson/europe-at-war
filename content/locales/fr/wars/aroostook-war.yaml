# French translations of the catalogue text (wave 14); step bodies follow later.
Aroostook War: Guerre de l’Aroostook
? "A bloodless confrontation of 1838–1839 between the US state of Maine and the British colony of New Brunswick over the forests of the Aroostook valley, also called the Pork and Beans War. The Treaty of Paris of 1783 had left the boundary between Maine and British North America unclear, and both sides claimed some 12,000 square miles of timberland. In 1831 the King of the Netherlands, asked to arbitrate, proposed a compromise line that Britain accepted but the United States, under pressure from Maine, rejected. In the winter of 1838–1839 lumbermen from New Brunswick were cutting timber in the disputed valley, and Maine sent a posse under its land agent Rufus McIntire to drive them out; in February 1839 New Brunswick lumbermen seized McIntire and carried him to Woodstock. Both sides called out troops: Maine raised thousands of militia and began Fort Fairfield, New Brunswick and Nova Scotia mobilised theirs and British regulars moved up, and the US Congress authorised 50,000 men and $10 million. President Martin Van Buren sent General Winfield Scott, who in March 1839 arranged a truce with New Brunswick’s lieutenant governor, Sir John Harvey, under which both sides withdrew while the dispute was negotiated. There was no fighting; about 38 militiamen died of disease and accidents. The Webster–Ashburton Treaty of 9 August 1842 drew the boundary, giving the United States about 7,000 square miles and Britain about 5,000, including the route between New Brunswick and Quebec."
: "Une confrontation sans effusion de sang qui opposa en 1838–1839 l’État américain du Maine et la colonie britannique du Nouveau-Brunswick au sujet des forêts de la vallée de l’Aroostook, et qu’on appelle aussi la « guerre du lard et des fèves » (Pork and Beans War). Le traité de Paris de 1783 avait laissé imprécise la frontière entre le Maine et l’Amérique du Nord britannique, et les deux parties revendiquaient quelque 12 000 milles carrés de terres forestières. En 1831, le roi des Pays-Bas, appelé à arbitrer, proposa une ligne de compromis que la Grande-Bretagne accepta, mais que les États-Unis, sous la pression du Maine, rejetèrent. Au cours de l’hiver 1838–1839, des bûcherons du Nouveau-Brunswick coupaient du bois dans la vallée contestée, et le Maine envoya un détachement sous les ordres de son agent foncier, Rufus McIntire, pour les chasser ; en février 1839, des bûcherons néo-brunswickois s’emparèrent de McIntire et l’emmenèrent à Woodstock. Les deux camps mobilisèrent : le Maine leva des milliers de miliciens et commença la construction de Fort Fairfield, le Nouveau-Brunswick et la Nouvelle-Écosse mobilisèrent leurs milices et des troupes régulières britanniques s’avancèrent, tandis que le Congrès des États-Unis autorisait la levée de 50 000 hommes et une dépense de 10 millions de dollars. Le président Martin Van Buren envoya le général Winfield Scott, qui conclut en mars 1839 avec le lieutenant-gouverneur du Nouveau-Brunswick, sir John Harvey, une trêve aux termes de laquelle les deux camps se retirèrent pendant la négociation du différend. Il n’y eut aucun combat ; environ 38 miliciens moururent de maladie ou d’accident. Le traité Webster-Ashburton du 9 août 1842 fixa la frontière, attribuant environ 7 000 milles carrés aux États-Unis et environ 5 000 à la Grande-Bretagne, dont la route entre le Nouveau-Brunswick et le Québec."
