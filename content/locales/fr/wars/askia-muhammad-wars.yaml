# French translations of the catalogue text (wave 12); step bodies follow later.
Askia Muhammad’s wars: Les guerres d’Askia Mohammed
The wars of Askia Muhammad (Muhammad Ture), who seized the Songhai throne from Sonni Ali’s son in 1493 and ruled until his own son deposed him in 1528. After defeating Sonni Baru at Anfao, near Gao, he made the pilgrimage to Mecca, returned with the title of caliph for the lands of Takrur, and led a campaign against the Mossi in 1497–1498 that the Timbuktu chronicle calls the only true holy war of the region. In the following years his armies marched against Aïr (1500), the Malian town of Zalen (1501), Borgu (1505, with heavy losses), Mali (1506–1507), the Fulani leader Tengella in Diara (1512), Katsina in Hausaland (1513) and the sultan of Agadez (1514–1515). On the way back from Agadez, Kanta Kotal of Kebbi rebelled over his share of the plunder and held off a Songhai expedition in 1516–1517, founding an independent Kebbi. Under Askia Muhammad the Songhai Empire reached its greatest extent, from the upper Senegal to Aïr; in 1528, old and nearly blind, he was deposed by his son Musa.: Les guerres d’Askia Mohammed (Mohammed Touré), qui s’empara du trône songhaï aux dépens du fils de Sonni Ali en 1493 et régna jusqu’à ce que son propre fils le dépose en 1528. Après avoir vaincu Sonni Baru à Anfao, près de Gao, il fit le pèlerinage de La Mecque, en revint avec le titre de calife pour les pays du Tekrour et mena en 1497–1498 contre les Mossi une campagne que la chronique de Tombouctou qualifie de seule véritable guerre sainte de la région. Les années suivantes, ses armées marchèrent contre l’Aïr (1500), la ville malienne de Zalen (1501), le Borgou (1505, avec de lourdes pertes), le Mali (1506–1507), le chef peul Tengella au Diara (1512), Katsina en pays haoussa (1513) et le sultan d’Agadez (1514–1515). Au retour d’Agadez, Kanta Kotal, du Kebbi, se révolta à propos de sa part du butin et tint en échec une expédition songhaï en 1516–1517, fondant un Kebbi indépendant. Sous Askia Mohammed, l’empire songhaï atteignit sa plus grande extension, du haut Sénégal à l’Aïr ; en 1528, âgé et presque aveugle, il fut déposé par son fils Moussa.
