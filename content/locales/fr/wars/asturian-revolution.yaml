# Some French text was translated automatically.
"Asturian Revolution of 1934": "Révolution asturienne de 1934"
"A revolutionary general strike called by the Socialists and other left-wing groups across Spain in October 1934, when the Catholic conservative CEDA entered the government of the Second Republic. It failed in most of the country, and in Barcelona Lluís Companys’s proclamation of a Catalan State lasted only ten hours, but in Asturias the miners rose in arms, took the mining valleys and most of Oviedo, and set up revolutionary committees, which killed several dozen priests and others. The government sent the Spanish Legion and Moroccan troops under General Eduardo López Ochoa and Colonel Juan Yagüe, with General Francisco Franco advising the war minister in Madrid, and after two weeks of fighting and a harsh repression about 1,500–2,000 people were dead and 15,000–30,000 imprisoned.": "Une grève générale révolutionnaire appelée par les socialistes et d’autres groupes de gauche à travers l’Espagne en octobre 1934, quand le CEDA conservateur catholique est entré dans le gouvernement de la Deuxième République. Il a échoué dans la plupart du pays, et à Barcelone Lluís Companys proclamation d’un État catalan a duré seulement dix heures, mais dans les Asturies les mineurs se sont levés dans les armes, ont pris les vallées minières et la plupart de Oviedo, et mis en place des comités révolutionnaires, qui ont tué plusieurs dizaines de prêtres et autres. Le gouvernement a envoyé la Légion espagnole et les troupes marocaines sous le général Eduardo López Ochoa et le colonel Juan Yagüe, avec le général Francisco Franco conseillant le ministre de la guerre à Madrid, et après deux semaines de combats et une répression sévère environ 1500–2000 personnes ont été mortes et 15 000–30 000 emprisonnées."
"Also called the Revolution of 1934 or the Asturian miners’ strike. Much of the old centre of Oviedo, including the university, was burned or damaged, and the Cámara Santa of the cathedral was blown up. Many historians see the rising and its suppression as a prelude to the Civil War of 1936–1939.": "Aussi appelé la Révolution de 1934 ou la grève des mineurs asturiens. Une grande partie du centre ancien d’Oviedo, y compris l’université, a été brûlée ou endommagée, et le Père Noël Cámara de la cathédrale a été soufflé. Beaucoup d’historiens voient la montée et sa suppression comme un prélude à la guerre civile de 1936-1939."
