# Some French text was translated automatically.
"Austrian Civil War": "Guerre civile autrichienne"
"Four days of fighting between the authoritarian government of Engelbert Dollfuss, backed by the army, the police and the right-wing Heimwehr militia, and the Republican Protection League (Schutzbund), the banned militia of the Social Democrats. It began in Linz on 12 February 1934, when Schutzbund members resisted a police search for weapons at the party’s headquarters, and spread to Vienna and the industrial towns of Upper Austria and Styria. In Vienna the army shelled the Karl-Marx-Hof and other municipal housing estates. Between about 350 and 370 people were killed, some 130 of them uninvolved civilians. Nine Schutzbund members were executed, the Social Democratic Party was banned, and the constitution of May 1934 made Austria a one-party corporative state.": "Quatre jours de combats entre le gouvernement autoritaire d’Engelbert Dollfuss, soutenu par l’armée, la police et la milice de droite Heimwehr, et la Ligue républicaine de protection (Schutzbund), la milice interdite des sociaux-démocrates. Il a commencé à Linz le 12 février 1934, lorsque les membres de Schutzbund ont résisté à une recherche d’armes au quartier général du parti, et s’est répandu à Vienne et dans les villes industrielles de Haute-Autriche et de Styrie. À Vienne, l’armée a bombardé le Karl-Marx-Hof et d’autres lotissements municipaux. Neuf membres de Schutzbund ont été exécutés, le Parti social-démocrate a été interdit et la constitution de mai 1934 a fait de l’Autriche un État corporatiste à parti unique."
"Also called the February Uprising or the February Fights (Februarkämpfe). Dollfuss had governed without parliament since March 1933 and had banned the Schutzbund and the Communist and Nazi parties.": "Aussi appelé l’insurrection de février ou les combats de février (Februarkämpfe). Dollfuss a gouverné sans parlement depuis Mars 1933 et a interdit le Schutzbund et les partis communistes et nazis."
"The government gave official figures of 193 civilians and 104 soldiers and police killed; estimates by later writers have varied widely.": "Le gouvernement a donné des chiffres officiels de 193 civils et 104 soldats et policiers tués ; les estimations des auteurs ultérieurs ont varié considérablement."
