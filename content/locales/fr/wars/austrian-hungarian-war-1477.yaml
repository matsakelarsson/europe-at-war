# Some French text was translated automatically.
"Austrian–Hungarian War, 1477–1488": "Guerre autrichienne-hongroise, 1477-1488"
"A war between King Matthias Corvinus of Hungary and Emperor Frederick III, as ruler of the Austrian lands, fought mostly in Lower Austria. Matthias declared war in June 1477 after Frederick had invested his rival Vladislaus II with Bohemia, and by the peace of Gmunden and Korneuburg that December won recognition as king of Bohemia. When fighting resumed in the early 1480s, Matthias’s mercenary Black Army took Hainburg, Korneuburg and other strongholds, starved Vienna into surrender on 1 June 1485 and took Wiener Neustadt in August 1487. Matthias held Vienna, where he kept his court, most of Lower Austria and parts of Styria and Carinthia until his death in 1490, after which Frederick’s son Maximilian recovered them.": "Une guerre entre le roi Matthias Corvinus de Hongrie et l’empereur Frederick III, en tant que chef des terres autrichiennes, combattit principalement en Basse-Autriche. Matthias déclara la guerre en juin 1477 après que Frédéric eut investi son rival Vladislas II avec la Bohême, et par la paix de Gmunden et Korneuburg que Décembre a remporté la reconnaissance comme roi de Bohême. Lorsque les combats ont repris au début des années 1480, le mercenaire de Matthias Black Army a pris Hainburg, Korneuburg et d’autres bastions, a laissé Vienne mourir de faim le 1er juin 1485 et a pris Wiener Neustadt en août 1487. Matthias tenait Vienne, où il gardait sa cour, la plupart de Basse-Autriche et des parties de Styrie et Carinthie jusqu’à sa mort en 1490, après quoi Fredericks fils Maximilian les récupéra."
"Dates are Julian, as usual for the period. Frederick received little help from the princes of the Empire; an imperial army under Duke Albert of Saxony was raised only in 1487. Albert agreed an armistice with Matthias at St. Pölten, which was extended until Matthias died.": "Les dates sont Julian, comme d’habitude pour l’époque. Frederick a reçu peu d’aide des princes de l’Empire ; une armée impériale sous le duc Albert de Saxe n’a été élevée qu’en 1487. Albert a convenu un armistice avec Matthias à Saint-Pölten, qui a été prolongé jusqu’à la mort Matthias."
"Vienna was held for Hungary from 1485 to 1490 but was not made the capital of Hungary. Under the Peace of Pressburg of 1491, Maximilian gave up the claim to the Hungarian throne for the time being in return for the right to succeed if Vladislaus II died without a son.": "Vienne a été tenue pour la Hongrie de 1485 à 1490 mais n’a pas été fait la capitale de la Hongrie. Sous la paix de Pressburg de 1491, Maximilian a renoncé à la revendication du trône hongrois pour le moment en échange du droit de succéder si Vladislas II est mort sans fils."
