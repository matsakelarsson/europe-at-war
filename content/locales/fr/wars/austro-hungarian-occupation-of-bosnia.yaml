"29 July – 20 October 1878": "29 juillet – 20 octobre 1878"
"The Congress of Berlin allowed Austria-Hungary to occupy and administer Bosnia and Herzegovina, which stayed under the sultan’s nominal sovereignty, and to garrison the Sanjak of Novi Pazar between Serbia and Montenegro. The foreign minister, Gyula Andrássy, expected “a walk with a brass band”, but many Bosnian Muslims, who stood to lose most under Christian rule, and many Orthodox Serbs resisted; most Catholic Croats did not. On 29 July General Josip Filipović’s XIII Corps crossed the Sava at Brod, Kostajnica and Gradiška, while General Stjepan Jovanović’s division marched up the Neretva from Dalmatia and took Mostar on 5 August.": "Le Congrès de Berlin a permis à l’Autriche-Hongrie d’occuper et d’administrer la Bosnie-Herzégovine, qui est restée sous la souveraineté nominale du sultan, et de garnisonr le Sanjak de Novi Pazar entre la Serbie et le Monténégro. Le ministre des Affaires étrangères, Gyula Andrássy, s’attendait à une marche avec un groupe de cuivres, mais beaucoup de musulmans bosniaques, qui se trouvaient à perdre le plus sous la domination chrétienne, et de nombreux Serbes orthodoxes résistèrent ; la plupart des Croates catholiques ne l’ont pas fait. Le 29 juillet, le général Josip Filipović . XIII Corps a traversé la Sava à Brod, Kostajnica et Gradiška, tandis que le général Stjepan Jovanović , division marche vers la Neretva de Dalmatie et prend Mostar le 5 août."
"Muslim volunteers led by the preacher Hadži Lojo rallied armed bands, helped almost openly by withdrawing Ottoman troops. Hussars were ambushed at Maglaj on 3 August, and on 7 August the Austro-Hungarians lost some 600 men in a battle near Jajce. Vienna mobilised three more corps, and on 19 August Sarajevo was taken after a day of street fighting; summary courts then had many accused rebels executed. Resistance went on in the hills until Hadži Lojo surrendered on 3 October and the castle of Velika Kladuša fell on 20 October. The campaign needed 153,000 troops and cost almost 5,200 Austro-Hungarian casualties.": "Des volontaires musulmans dirigés par le prédicateur Hadži Lojo ont rassemblé des bandes armées, aidé presque ouvertement en retirant les troupes ottomanes. Les Hussards ont été embusqués à Maglaj le 3 août et le 7 août les Austro-hongrois ont perdu quelque 600 hommes dans une bataille près de Jajce. Vienne a mobilisé trois autres corps, et le 19 août Sarajevo a été prise après une journée de combats de rue ; les tribunaux sommaires ont alors fait exécuter de nombreux rebelles accusés. La résistance a continué dans les collines jusqu’à ce qu’Hadži Lojo se rende le 3 octobre et que le château de Velika Kladuša tombe le 20 octobre."
