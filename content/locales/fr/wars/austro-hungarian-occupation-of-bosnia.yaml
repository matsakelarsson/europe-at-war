# Some French text was translated automatically.
"Austro-Hungarian occupation of Bosnia and Herzegovina": "Occupation austro-hongroise de la Bosnie-Herzégovine"
"The campaign of July to October 1878 in which Austria-Hungary, given the right by the Congress of Berlin to occupy and administer Bosnia and Herzegovina, overcame armed resistance by Bosnian Muslims and Orthodox Serbs, helped unofficially by Ottoman troops. Sarajevo fell after street fighting on 19 August, and the last strongholds in October; the provinces stayed under nominal Ottoman sovereignty until Austria-Hungary annexed them in 1908.": "La campagne de juillet à octobre 1878, au cours de laquelle l’Autriche-Hongrie, qui avait le droit d’occuper et d’administrer la Bosnie-Herzégovine par le Congrès de Berlin, a surmonté la résistance armée des musulmans bosniaques et des Serbes orthodoxes, a aidé officieusement les troupes ottomanes. Sarajevo est tombée après les combats de rue le 19 août et les derniers bastions en octobre ; les provinces sont restées sous souveraineté nominale ottomane jusqu’à ce que l’Autriche-Hongrie les annexe en 1908."
"The Ottoman government did not fight the occupation officially, but many of its troops in the provinces joined or helped the resistance. Numbers of insurgents and of Bosnian dead are uncertain; the Austro-Hungarian General Staff estimated 79,000 armed insurgents and 13,800 Ottoman regulars.": "Le gouvernement ottoman n’a pas combattu officiellement l’occupation, mais beaucoup de ses troupes dans les provinces ont rejoint ou aidé la résistance. Nombre d’insurgés et de Bosniaques morts sont incertains ; l’état-major général austro-hongrois a estimé 79 000 insurgés armés et 13 800 réguliers Ottomans."
"The occupation was sanctioned by Article 25 of the Treaty of Berlin. Austro-Hungarian garrisons entered the Sanjak of Novi Pazar, which stayed under Ottoman administration, in September 1879.": "L’occupation est sanctionnée par l’article 25 du traité de Berlin. Les garnisons austro-hongroise entrent dans le Sanjak de Novi Pazar, qui reste sous administration ottomane, en septembre 1879."
