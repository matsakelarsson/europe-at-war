"June 1866": "juin 1866"
"After their joint victory over Denmark in 1864, Prussia and Austria fell out over Schleswig and Holstein. The Gastein Convention of August 1865 gave Prussia Schleswig and Austria Holstein to administer, but Otto von Bismarck, Prussia’s chief minister, meant to end Austria’s leading role in Germany. On 8 April 1866 he made a secret alliance with Italy, which wanted Venetia. When Austria put the duchies’ future before the Federal Diet, Prussian troops marched into Holstein on 7 June and the Austrians withdrew. On 14 June the Diet voted, nine votes to six, to mobilise federal forces against Prussia, which declared the German Confederation dissolved.": "Après leur victoire commune sur le Danemark en 1864, la Prusse et l’Autriche tombent sur Schleswig et Holstein. La Convention de Gastein d’août 1865 donne à Prussia Schleswig et à Austria Holstein d’administrer, mais Otto von Bismarck, le ministre principal de la Prusse, veut mettre fin au rôle de premier plan de l’Autriche en Allemagne. Le 8 avril 1866, il fait une alliance secrète avec l’Italie, qui voulait Vénétie. Lorsque l’Autriche a mis l’avenir des duches devant la Diète fédérale, les troupes prussiennes ont marché à Holstein le 7 juin et les Autrichiens se sont retirés. Le 14 juin, la Diète a voté, neuf voix contre six, pour mobiliser les forces fédérales contre la Prusse, qui a déclaré la Confédération allemande dissoute."
"Most of the middle-sized states sided with Austria. On 15 June Prussia demanded that Saxony, Hanover and Hesse-Kassel disarm, and the next day its troops invaded all three. The Saxon army withdrew into Bohemia to join the Austrians, and the Prussians entered Dresden on 18 June. The Elector of Hesse was taken prisoner to Stettin. The Hanoverian army, about 19,000 men with King George V, marched south to join the Bavarians. At Langensalza on 27 June it beat off an attacking Prussian detachment, but converging Prussian forces surrounded it, and it surrendered two days later.": "Le 15 juin, la Prusse a exigé que la Saxe, Hanovre et Hesse-Kassel désarment, et le lendemain ses troupes ont envahi les trois. L’armée saxonne s’est retirée en Bohême pour rejoindre les Autrichiens, et les Prussiens sont entrés à Dresde le 18 juin. L’Électeur de Hesse a été fait prisonnier à Stettin. L’armée hanoverienne, environ 19 000 hommes avec le roi George V, marcha vers le sud pour rejoindre les Bavarois. À Langensalza le 27 juin, elle battit un détachement prussien attaquant, mais convergeant les forces prussiennes l’entourèrent et se rendit deux jours plus tard."
