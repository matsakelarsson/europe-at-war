"1–27 July 1866": "1–27 juillet 1866"
"After Langensalza the Prussian forces in the west became the Army of the Main under General Eduard Vogel von Falckenstein. Against them stood two federal corps that never joined up, the Bavarians under Prince Charles of Bavaria and the troops of Württemberg, Baden, Hesse-Darmstadt, Nassau and Austria under Prince Alexander of Hesse. Falckenstein beat the Bavarians at Dermbach on 4 July and at Kissingen on the Franconian Saale on 10 July, then turned west and beat Prince Alexander’s corps at Laufach and Aschaffenburg on 13 and 14 July. On 16 July his troops entered Frankfurt; the Federal Diet had fled to Augsburg.": "Après Langensalza les forces prussiennes à l’ouest sont devenues l’armée de la Main sous le général Eduard Vogel von Falckenstein. Contre eux se tenaient deux corps fédéral qui ne s’unirent pas, les Bavarois sous le prince Charles de Bavière et les troupes de Wurtemberg, Baden, Hesse-Darmstadt, Nassau et Autriche sous le prince Alexandre de Hesse. Falckenstein battit les Bavarois à Dermbach le 4 juillet et à Kissingen sur la Saale franconienne le 10 juillet, puis se tourna vers l’ouest et battit le corps du prince Alexandre à Laufach et Aschaffenburg les 13 et 14 juillet. Le 16 juillet ses troupes entrèrent à Francfort ; la Diète fédérale s’était enfuie à Augsbourg."
"Frankfurt, which had taken no part in the fighting, was ordered to pay huge war contributions, and its mayor, Karl Fellner, hanged himself rather than enforce them. General Edwin von Manteuffel, who took over the army, beat the Württembergers at Tauberbischofsheim on 24 July and the Bavarians around Helmstadt and Rossbrunn over the next two days. On 27 July Prussian guns shelled the fortress of Würzburg, which held out. Armistices with the southern states followed in early August. In separate peace treaties they paid indemnities and secretly allied with Prussia, and Bavaria and Hesse-Darmstadt gave up small territories.": "Le général Edwin von Manteuffel, qui a pris la relève de l’armée, a battu les Wurtembergers à Tauberbischofsheim le 24 juillet et les Bavarois autour de Helmstadt et Rossbrunn au cours des deux jours suivants. Le 27 juillet, des canons prussiens ont bombardé la forteresse de Würzburg. Des armistices avec les États du sud ont suivi au début d’août. Dans des traités de paix séparés, ils payaient des indemnités et en secret alliés avec la Prusse, et la Bavière et Hesse-Darmstadt abandonnaient de petits territoires."
