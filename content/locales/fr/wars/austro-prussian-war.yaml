"22 June – 3 July 1866": "22 juin – 3 juillet 1866"
"Prussia’s chief of staff, Helmuth von Moltke, used the railways to bring three armies to the Bohemian border and sent them through the mountain passes separately, to unite on the battlefield. The Elbe Army and the First Army came from Saxony and Lusatia, the Second Army under Crown Prince Frederick William from Silesia. Ludwig von Benedek, commanding the Austrian North Army and the Saxons, failed to strike at either group alone. In a week of battles from 26 June the Austrians lost at Náchod, Skalitz, Münchengrätz and Gitschin, winning only at Trautenau, as the fast-firing Prussian breech-loading needle gun cut down their attacking columns.": "Le chef d’état-major de la Prusse, Helmuth von Moltke, a utilisé les chemins de fer pour amener trois armées à la frontière bohème et les a envoyées par les cols de montagne séparément, pour s’unir sur le champ de bataille. L’Armée Elbe et la Première Armée sont venues de Saxe et Lusatie, la Deuxième Armée sous le prince héritier Frederick William de Silesia. Ludwig von Benedek, commandant l’Armée du Nord Autrichien et les Saxons, n’a pas réussi à frapper les deux groupes seuls. Dans une semaine de batailles à partir du 26 juin, les Autrichiens ont perdu à Náchod, Skalitz, Münchengrätz et Gitschin, gagnant seulement à Trautenau, alors que le tir rapide prussien-chargeur d’aiguille a coupé leurs colonnes attaquantes."
"On 3 July Benedek stood before the fortress of Königgrätz, by the village of Sadowa, with the Elbe at his back. Close to half a million men took part, more than in any battle in Europe since Leipzig in 1813. Prince Frederick Charles’s First Army attacked across the Bistritz in the morning and was held by the Austrian artillery until the Second Army reached the Austrian right flank in the afternoon and took the heights at Chlum. Benedek’s army escaped across the Elbe, covered by its cavalry and guns, but lost about 31,000 men killed, wounded, missing or captured, against about 9,000 Prussians.": "Le 3 juillet, Benedek se tenait devant la forteresse de Königgrätz, près du village de Sadowa, avec l’Elbe à son dos. Près d’un demi-million d’hommes ont pris part, plus que dans toute bataille en Europe depuis Leipzig en 1813. La première armée du prince Frederick Charles, qui a attaqué le Bistritz le matin, a été retenue par l’artillerie autrichienne jusqu’à ce que la deuxième armée atteigne le flanc droit autrichien dans l’après-midi et prenne les hauteurs à Chlum. L’armée de Benedek s’est échappée à travers l’Elbe, couverte par sa cavalerie et ses canons, mais a perdu environ 31 000 hommes tués, blessés, portés disparus ou capturés contre environ 9 000 Prussiens."
