"Nikolsburg and the Peace of Prague": "Nikolsburg et la paix de Prague"
"22 July – 12 October 1866": "22 juillet – 12 octobre 1866"
"By mid-July the Prussian armies had occupied Prague and Brno and reached the Marchfeld, a day’s march from Vienna, while Austria brought troops north from Italy. On 22 July, during a last action at Blumenau outside Pressburg, an armistice came into force at noon. King William wanted to march into Vienna and annex Austrian and Saxon land, but Bismarck, threatening to resign, insisted on a mild peace that would neither make Austria a lasting enemy nor give France a reason to intervene. The preliminary peace was signed at Nikolsburg on 26 July and the final Peace of Prague on 23 August.": "A la mi-juillet, les armées prussiennes avaient occupé Prague et Brno et atteint le Marchfeld, un jour de marche de Vienne, tandis que l’Autriche apportait des troupes au nord d’Italie. Le 22 juillet, lors d’une dernière action à Blumenau en dehors de Pressburg, un armistice est entré en vigueur à midi. Le roi William voulait entrer à Vienne et annexer des terres autrichiennes et saxonnes, mais Bismarck, menaçant de démissionner, insista sur une paix douce qui ne ferait pas de l’Autriche un ennemi durable ni ne donnerait à la France une raison d’intervenir. La paix préliminaire fut signée à Nikolsburg le 26 juillet et la paix finale de Prague le 23 août."
"Austria accepted the end of the German Confederation and its own exclusion from German affairs, gave up its rights in Schleswig and Holstein, and paid an indemnity. Prussia annexed Hanover, Hesse-Kassel, Nassau and the free city of Frankfurt, then Schleswig-Holstein, and led the states north of the Main in a new North German Confederation; Saxony kept its king but had to join it. By the Treaty of Vienna of 3 October Austria ceded Venetia, through France, to Italy. Many in the annexed states resented Prussian rule, and in 1871 a party loyal to the deposed King of Hanover won almost half the vote there.": "L’Autriche accepte la fin de la Confédération allemande et son exclusion des affaires allemandes, renonce à ses droits au Schleswig et Holstein et verse une indemnité. La Prusse annexe Hanovre, Hesse-Kassel, Nassau et la ville libre de Francfort, puis le Schleswig-Holstein, et dirige les États au nord du Main dans une nouvelle Confédération d’Allemagne du Nord ; la Saxe conserve son roi mais doit y adhérer. Par le traité de Vienne du 3 octobre l’Autriche a cédé Venetia, par la France, à l’Italie. Beaucoup dans les États annexés déplaisaient à la règle prussienne, et en 1871 un parti fidèle au roi déposé de Hanovre a remporté près de la moitié des voix."
