"20 June – 12 August 1866": "20 juin – 12 août 1866"
"Italy declared war on Austria on 20 June and sent two armies against Venetia. On 24 June the larger, under General Alfonso La Marmora with King Victor Emmanuel II, crossed the Mincio and was beaten at Custoza by the smaller South Army of Archduke Albrecht, based on the fortresses around Verona. The day after Königgrätz Francis Joseph offered Venetia to Napoleon III of France in return for his mediation, to free troops for the defence of Vienna, but Italy, bound by its alliance with Prussia, fought on. Giuseppe Garibaldi’s volunteers pushed into Trentino and beat the Austrians at Bezzecca on 21 July.": "L’Italie a déclaré la guerre à l’Autriche le 20 juin et envoyé deux armées contre Vénétie. Le 24 juin, le plus grand, sous la direction du général Alfonso La Marmora avec le roi Victor Emmanuel II, a traversé le Mincio et a été battu à Custoza par la petite armée sud de l’archiduc Albrecht, basé sur les forteresses autour de Vérone. Le lendemain de Königgrätz, Francis Joseph offrit Vénétie à Napoléon III de France en échange de sa médiation, pour libérer les troupes pour la défense de Vienne, mais l’Italie, liée par son alliance avec la Prusse, combattit. Giuseppe Garibaldi ès volontaires poussés dans le Trentino et battus les Autrichiens à Bezzecca le 21 juillet."
"At sea the larger and more modern Italian fleet under Admiral Carlo Persano attacked the Austrian island of Lissa in the Adriatic. On 20 July Wilhelm von Tegetthoff’s squadron came to its relief and, in the first battle between fleets of ironclads, rammed and sank the Re d’Italia, while the armoured gunboat Palestro blew up; 612 Italians were killed, against 38 Austrians. As Austrian troops went north, General Enrico Cialdini’s army advanced across Venetia. Garibaldi, ordered on 9 August to leave Trentino, replied with one word, “Obbedisco” (“I obey”), and the armistice of Cormons ended the fighting on 12 August.": "En mer, la flotte italienne plus grande et plus moderne sous l’amiral Carlo Persano attaque l’île autrichienne de Lissa dans l’Adriatique. Le 20 juillet Wilhelm von Tegetthoff escadron est venu à son secours et, lors de la première bataille entre les flottes de ferclades, a rampé et coulé le Re d-Italia, tandis que le canon blindé Palestro a explosé ; 612 Italiens ont été tués, contre 38 Autrichiens. Alors que les troupes autrichiennes allaient vers le nord, l’armée du général Enrico Cialdini avançait à travers Venetia. Garibaldi, ordonné le 9 août de quitter Trentino, répliqua avec un seul mot, \"Obbedisco\", et l’armistice de Cormons termina les combats le 12 août."
