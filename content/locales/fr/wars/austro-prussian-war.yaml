# Some French text was translated automatically.
"Austro-Prussian War": "Guerre austro-prussienne"
"A seven-week war in which Prussia and Italy defeated Austria and most of the German middle states. After the Prussian victory at Königgrätz, the Peace of Prague dissolved the German Confederation and shut Austria out of Germany; Prussia annexed Hanover, Hesse-Kassel, Nassau, Frankfurt and Schleswig-Holstein and led a new North German Confederation, and Austria ceded Venetia to Italy.": "Une guerre de sept semaines au cours de laquelle la Prusse et l’Italie ont vaincu l’Autriche et la plupart des pays allemands du milieu. Après la victoire prussienne à Königgrätz, la paix de Prague dissout la Confédération allemande et ferma l’Autriche hors d’Allemagne ; la Prusse a joint Hanovre, Hesse-Kassel, Nassau, Francfort et Schleswig-Holstein et conduit une nouvelle Confédération nord-allemande, et l’Autriche a cédé Venetia à l’Italie."
"Also called the Seven Weeks’ War, in German often the German War (Deutscher Krieg), and in Italy the Third War of Independence.": "Aussi appelé la guerre des sept semaines, en allemand souvent la guerre allemande (Deutscher Krieg), et en Italie la troisième guerre d’indépendance."
"Places in Bohemia and Moravia are named in the German forms used in most accounts of the war; Königgrätz is today’s Hradec Králové, Nikolsburg is Mikulov, Pressburg is Bratislava and Lissa is the Croatian island of Vis.": "Les endroits en Bohême et en Moravie sont nommés dans les formes allemandes utilisées dans la plupart des récits de la guerre ; Königgrätz est aujourd'hui, Hradec Králové, Nikolsburg est Mikulov, Pressburg est Bratislava et Lissa est l’île croate de Vis."
