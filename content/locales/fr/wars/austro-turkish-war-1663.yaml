"1663 – February 1664": "1663 – février 1664"
"After the Ottomans crushed Transylvania’s bid for independence and took Várad in 1660, Leopold I sent troops under Raimondo Montecuccoli into Transylvania, and the ban of Croatia, Nikola Zrinski, raided Ottoman land from his new fortress of Novi Zrin on the Mura. In 1663 the grand vizier Köprülü Fazıl Ahmed Pasha led a large army, perhaps 100,000 men, up the Danube. On 7 August it routed a force under Ádám Forgách, commander of Érsekújvár, at Párkány, and then besieged his fortress, the chief Habsburg stronghold north of the Danube, which surrendered on terms in September.": "Après que les Ottomans eurent écrasé la Transylvanie pour obtenir l’indépendance et pris Várad en 1660, Léopold J’ai envoyé des troupes sous Raimondo Montecucoli en Transylvanie, et l’interdiction de la Croatie, Nikola Zrinski, a perquisitionné la terre ottomane de sa nouvelle forteresse de Novi Zrin sur la Mura. En 1663, le grand vizier Köprülü Fazıl Ahmed Pasha conduisit une grande armée, peut-être 100 000 hommes, jusqu’au Danube. Le 7 août, il dirigea une force sous Ádám Forgách, commandant d’Érsekújvár, à Párkány, puis assiégea sa forteresse, la forteresse du chef Habsbourg au nord du Danube, qui se rendit en septembre."
"Ottoman and Tatar raiders crossed the Váh and devastated western Upper Hungary and Moravia, carrying off thousands of captives, and Nógrád fell too. Zrinski struck back in midwinter. In January 1664, with about 25,000 Croatian, Hungarian and German troops, he marched some 240 kilometres down the Drava, taking Berzence and Babócsa and burning the town of Pécs, and on 1 February he set fire to the Ottoman army’s great wooden bridge across the Drava marshes at Osijek. The raid made him famous throughout Europe.": "Les raideurs ottomans et tatars ont traversé le Váh et dévasté la Haute Hongrie occidentale et la Moravie, transportant des milliers de captifs, et Nógrád est tombé aussi. Zrinski a résisté au milieu de l’hiver. En janvier 1664, avec environ 25 000 soldats croates, hongrois et allemands, il marcha à 240 kilomètres de la Drava, prenant Berzence et Babócsa et brûlant la ville de Pécs, et le 1er février, il mit le feu au grand pont en bois de l’armée ottomane qui traversait les marais de Drava à Osijek."
