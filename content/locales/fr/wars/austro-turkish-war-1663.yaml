# Some French text was translated automatically.
"Austro-Turkish War (1663–1664)": "Guerre austro-turque (1663-1664)"
"A war between Emperor Leopold I and the Ottoman Empire, revived under the Köprülü grand viziers. Fazıl Ahmed Pasha took Érsekújvár in 1663, and the Croatian–Hungarian ban Nikola Zrinski answered with a daring winter raid that burned the Ottoman bridge at Osijek. An imperial army with German and French contingents under Raimondo Montecuccoli won at Saint Gotthard in August 1664, but the Peace of Vasvár nine days later left the Ottomans their conquests and angered the Hungarian nobility.": "Une guerre entre l’empereur Léopold Ier et l’Empire ottoman, relancée sous les grands viziers de Köprülü. Fazıl Ahmed Pasha a pris Érsekújvár en 1663, et l’interdiction croate-hongroise Nikola Zrinski a répondu par un raid hivernal audacieux qui a brûlé le pont ottoman à Osijek. Une armée impériale avec des contingents allemands et français sous Raimondo Montecucoli a gagné à Saint Gotthard en août 1664, mais la paix de Vasvár neuf jours plus tard quitta les Ottomans leurs conquêtes et irrité la noblesse hongroise."
"Dates are Gregorian. Sources disagree on the date of Érsekújvár’s surrender, giving dates between 13 and 26 September 1663.": "Les sources ne sont pas d’accord sur la date de la reddition d’Érsekújvár, ce qui donne des dates entre le 13 et 26 septembre 1663."
"Nikola Zrinski (in Hungarian Zrínyi Miklós), poet and general, was the great-grandson of the defender of Szigetvár in 1566. He died in a hunting accident in November 1664. The anger at the Peace of Vasvár fed the Magnate Conspiracy, whose leaders, among them his brother Petar Zrinski and Fran Krsto Frankopan, were executed in 1671.": "Nikola Zrinski (en hongrois Zrínyi Miklós), poète et général, fut l’arrière-petit-fils du défenseur de Szigetvár en 1566. Il mourut dans un accident de chasse en novembre 1664. La colère à la paix de Vasvár alimenta la conspiration Magnée, dont les dirigeants, son frère Petar Zrinski et Fran Krsto Frankopan, furent exécutés en 1671."
"The war grew out of the Transylvanian–Ottoman war of 1658–1662, which has its own entry.": "La guerre est née de la guerre transylvanienne-ottomane de 1658–1662, qui a sa propre entrée."
