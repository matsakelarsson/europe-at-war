"April – August 1664": "avril – août 1664"
"In late April Zrinski and the imperial general Wolfgang Julius von Hohenlohe besieged Kanizsa, but they could not breach its walls, and on 2 June, as the grand vizier’s army approached, they withdrew. The Ottomans then besieged Novi Zrin, and Montecuccoli would not risk an attack to save it; the fortress was destroyed on 7 July. Fazıl Ahmed marched north towards Styria. On 1 August Montecuccoli’s imperial army, with troops of the Empire and a French corps of 6,000 sent by Louis XIV, met him at the Rába between Mogersdorf and the abbey of Szentgotthárd. Ottoman troops crossed the river and drove back the imperial centre, but a counter-attack threw them back into the swollen river with heavy losses.": "Fin avril, Zrinski et le général impérial Wolfgang Julius von Hohenlohe assiégèrent Kanizsa, mais ils ne purent pas briser ses murs, et le 2 juin, à l’approche de l’armée du grand vizier, ils se retiraient. Les Ottomans assiégés ensuite Novi Zrin, et Montecucoli ne risqueraient pas une attaque pour la sauver ; la forteresse fut détruite le 7 juillet. Fazıl Ahmed marcha vers le nord en direction de Styrie. Le 1er août, l’armée impériale de Montecuccoli, avec des troupes de l’Empire et un corps français de 6 000 envoyés par Louis XIV, le rencontra à la Rába entre Mogersdorf et l’abbaye de Szentgotthárd. Les troupes ottomanes traversèrent la rivière et regagnèrent le centre impérial, mais une contre-attaque les jeta dans la rivière enflée avec de lourdes pertes."
"In the north Jean-Louis Raduit de Souches retook Nitra and won at Léva. Yet on 10 August, nine days after the battle, Leopold’s envoy signed the Peace of Vasvár. The emperor, worried about France and the Spanish succession, accepted a twenty-year truce in which the Ottomans kept Várad, Érsekújvár and Nógrád, both armies left Transylvania, whose Ottoman-backed prince Michael I Apafi was recognised, and Leopold sent the sultan a “gift” of 200,000 florins. Many Hungarian and Croatian nobles saw it as a betrayal.": "Dans le nord, Jean-Louis Raduit de Souches reprend Nitra et gagne à Léva. Pourtant, le 10 août, neuf jours après la bataille, l’envoyé de Léopold signait la Paix de Vasvár. L’empereur, inquiet de la France et de la succession espagnole, accepta une trêve de vingt ans dans laquelle les Ottomans gardaient Várad, Érsekújvár et Nógrád, les deux armées quittèrent la Transylvanie, dont le prince ottoman Michael I Apafi fut reconnu, et Léopold envoya le sultan un don de 200 000 florins. De nombreux nobles hongrois et croates l’ont vu comme une trahison."
