"In 1715 the Ottomans took the Morea from Venice. Emperor Charles VI, a guarantor of the Treaty of Karlowitz, allied with the Venetians in April 1716 and demanded that the conquests be returned, and the Ottomans declared war. Grand Vizier Silahdar Damat Ali Pasha led a large army from Belgrade across the Sava into Syrmia. On 2 August it routed an imperial cavalry detachment near Karlowitz and closed in on Petrovaradin, the fortress on the Danube that its builders called the Gibraltar of the Danube, where Prince Eugene of Savoy had gathered an army perhaps half the size of the Ottoman one in an entrenched camp.": "En 1715, les Ottomans prirent la Morea de Venise. L’empereur Charles VI, garant du traité de Karlowitz, allié avec les Vénitiens en avril 1716 et exige le retour des conquêtes, et les Ottomans déclarent la guerre. Le 2 août, elle a fait route vers un détachement impérial de cavalerie près de Karlowitz et s’est fermée sur Petrovaradin, la forteresse sur le Danube que ses constructeurs appelaient Gibraltar du Danube, où le prince Eugène de Savoie avait rassemblé une armée peut-être moitié plus grande que celle des Ottomans dans un camp retranché."
"On 5 August Eugene attacked out of his lines. The janissaries at first broke into the imperial centre, but Eugene’s cavalry turned the Ottoman flank, and the army fled back towards Belgrade, leaving its camp and some 250 guns. Damat Ali was mortally wounded; Ottoman losses are often put at about 20,000 men. Eugene then marched into the Banat and besieged Temesvár, the last Ottoman fortress in Hungary, which surrendered in mid-October. Its garrison was allowed to leave for Belgrade, and the Banat, Ottoman since 1552, came under Habsburg rule.": "Le 5 août, Eugène attaqua hors de ses lignes. Les janissaires entrèrent d’abord dans le centre impérial, mais la cavalerie d’Eugène tourna le flanc ottoman, et l’armée s’enfuit vers Belgrade, laissant son camp et quelque 250 canons. Damat Ali fut mortellement blessé ; les pertes ottomanes sont souvent portées à environ 20 000 hommes. Eugène marcha alors dans le Banat et assiégea Temesvár, la dernière forteresse ottomane en Hongrie, qui se rendit à la mi-octobre. Sa garnison fut autorisée à partir pour Belgrade, et le Banat, Ottoman depuis 1552, tomba sous le règne des Habsbourg."
