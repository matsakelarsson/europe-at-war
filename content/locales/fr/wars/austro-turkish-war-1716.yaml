"Austro-Turkish War of 1716–1718": "Guerre austro-turque de 1716–1718"
"A war in which the Habsburg Monarchy, allied with Venice, fought the Ottoman Empire after the Ottomans had retaken the Morea from the Venetians. Prince Eugene of Savoy won at Petrovaradin in 1716, took Temesvár the same year and Belgrade in 1717, and the Treaty of Passarowitz gave the Habsburgs the Banat, Belgrade with northern Serbia, and Oltenia, the greatest extent of their rule in the Balkans.": "Une guerre dans laquelle la monarchie des Habsbourg, alliée à Venise, combat l’Empire ottoman après que les Ottomans eurent repris la Morea des Vénitiens. Le prince Eugène de Savoie gagne à Petrovaradin en 1716, prend Temesvár la même année et Belgrade en 1717, et le traité de Passarowitz donne aux Habsbourg le Banat, Belgrade avec le nord de la Serbie, et Oltenia, la plus grande étendue de leur domination dans les Balkans."
"Dates are New Style (Gregorian). Numbers of soldiers and dead come from contemporary reports and vary between sources, especially for the Ottoman armies.": "Les dates sont New Style (Gregorian). Le nombre de soldats et de morts provient de rapports contemporains et varient d’une source à l’autre, surtout pour les armées ottomanes."
"Venice’s war with the Ottomans in Greece and the Ionian Sea, including the siege of Corfu in 1716, is told in the Seventh Ottoman–Venetian War.": "Venise La guerre avec les Ottomans en Grèce et la mer Ionienne, y compris le siège de Corfou en 1716, est racontée dans la septième guerre ottoman-vénétienne."
"Places are named as in most accounts of the war; Peterwardein (Pétervárad) is Petrovaradin, today part of Novi Sad, Temesvár is Timișoara, Karlowitz is Sremski Karlovci and Passarowitz is Požarevac.": "Les lieux sont nommés comme dans la plupart des récits de la guerre ; Peterwardein (Pétervárad) est Petrovaradin, aujourd'hui partie de Novi Sad, Temesvár est Timișoara, Karlowitz est Sremski Karlovci et Passarowitz est Požarevac."
