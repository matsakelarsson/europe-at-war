"The Peace of Passarowitz": "La paix de Passarowitz"
"June – July 1718": "juin – juillet 1718"
"Peace talks opened at Passarowitz, a small town on the Morava south-east of Belgrade, in June 1718, with British and Dutch envoys mediating. Both sides wanted an end. The Ottomans had lost two armies, and Charles VI needed his troops in Italy, where Spain had seized Sardinia in 1717 and landed in Sicily in July 1718. Venice wanted the Morea back but found no support. The treaty, signed on 21 July 1718, kept what each side held. The Habsburgs gained the Banat of Temesvár, lower Syrmia, Belgrade with most of the Ottoman province of Smederevo south of the Sava and Danube, a strip of northern Bosnia, and Oltenia, the part of Wallachia west of the Olt.": "Des pourparlers de paix s’ouvrent à Passarowitz, une petite ville du Morava au sud-est de Belgrade, en juin 1718, avec des envoyés britanniques et néerlandais. Les deux parties veulent une fin. Les Ottomans ont perdu deux armées, et Charles VI a besoin de ses troupes en Italie, où l’Espagne a saisi la Sardaigne en 1717 et atterri en Sicile en juillet 1718. Venise veut le retour de Morea mais ne trouve aucun soutien. Le traité, signé le 21 juillet 1718, conservait ce que chaque partie tenait. Les Habsbourg gagnaient le Banat de Temesvár, la Basse-Syrmie, Belgrade avec la plus grande partie de la province ottomane de Smederevo au sud de la Save et du Danube, une bande du nord de la Bosnie, et Oltenia, la partie de Wallachie à l’ouest de l’Olt."
"Venice gave up the Morea but kept the Ionian Islands and small gains in Dalmatia. A trade treaty signed the same day opened the Ottoman Empire to Habsburg merchants. The new lands were ruled directly from Vienna. Under its governor, Count Claudius Florimund Mercy, the Banat was drained, fortified and settled with German colonists, Serbs and Romanians; northern Serbia became the Kingdom of Serbia and Oltenia the Banat of Craiova. It was the furthest the Habsburgs had yet reached into the Balkans, but they lost Serbia and Oltenia again in 1739.": "Venise abandonna la Morea mais garda les îles Ioniennes et de petits gains en Dalmatie. Un traité commercial signé le même jour ouvrit l’Empire ottoman aux marchands de Habsbourg. Les nouvelles terres furent gouvernées directement de Vienne. Sous son gouverneur, le comte Claudius Florimund Mercy, le Banat a été drainé, fortifié et installé avec les colons allemands, les Serbes et les Roumains ; le nord de la Serbie est devenu le royaume de Serbie et Oltenia le Banat de Craiova. Il était le plus éloigné des Habsbourg avait encore atteint dans les Balkans, mais ils ont perdu la Serbie et Oltenia à nouveau en 1739."
