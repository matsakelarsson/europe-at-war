"In June 1717 Eugene crossed the Danube below Belgrade, approaching the city from the east where the Ottomans did not expect him, and on 18 June closed the siege. His troops dug lines 16 kilometres long from the Danube to the Sava, facing both the fortress, held by about 30,000 men under Mustafa Pasha, and the open country behind, while a flotilla guarded the river. On 28 July the new grand vizier, Hacı Halil Pasha, arrived with a relief army of perhaps 140,000 and dug in on the heights behind the besiegers. Caught between two fires and weakened by dysentery and malaria, the imperial army dwindled.": "En juin 1717, Eugène traversa le Danube en dessous de Belgrade, s’approchant de la ville de l’est où les Ottomans ne l’attendaient pas, et ferma le siège le 18 juin. Ses troupes creusèrent des lignes de 16 kilomètres de long du Danube à la Save, face à la forteresse, tenue par environ 30 000 hommes sous Mustafa Pacha, et le pays ouvert derrière, tandis qu’une flottille gardait le fleuve. Le 28 juillet, le nouveau grand vizier, Hacı Halil Pasha, est arrivé avec une armée de secours d’environ 140 000 hommes et a creusé sur les hauteurs derrière les assiégeants."
"On 14 August a mortar bomb fired from Zemun blew up the main powder store inside the fortress, killing some 3,000 defenders. Before dawn on 16 August, in thick fog, Eugene attacked the relief army with about 60,000 men. Some units lost their way, and the janissaries broke into a gap in the centre, but Eugene led his reserve cavalry into their flank and the Ottoman army fled, leaving its camp and guns. The garrison surrendered on 21 August and marched out with the Muslim townspeople. The victory made Eugene a hero across Europe and is remembered in the soldiers’ song “Prinz Eugen, der edle Ritter”.": "Le 14 août, une bombe de mortier tirée de Zemun a fait exploser le principal magasin de poudre à l’intérieur de la forteresse, tuant quelque 3 000 défenseurs. Avant l’aube du 16 août, dans un épais brouillard, Eugène attaqua l’armée de secours avec environ 60 000 hommes. Certaines unités se sont égarées et les janissaires ont pénétré dans une brèche au centre, mais Eugène a mené sa cavalerie de réserve dans leur flanc et l’armée ottomane s’est enfuie, laissant son camp et ses canons. La garnison s’est rendue le 21 août et a marché avec les habitants musulmans. La victoire a fait d’Eugène un héros à travers l’Europe et est rappelée dans la chanson des soldats."
