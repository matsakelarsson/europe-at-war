"Bound by its alliance of 1726 to help Russia, and hoping for easy gains, the Habsburg Monarchy entered the Russo-Turkish war in July 1737. Field Marshal Friedrich Heinrich von Seckendorff led the main army up the Morava from Belgrade and took Niš in late July, and Serbs in the Ottoman lands rose in support. In the west, an army under Prince Joseph of Saxe-Hildburghausen invaded Bosnia and besieged Banja Luka, but on 4 August it ran into a relief army raised by the governor of Bosnia, Hekimoğlu Ali Pasha, from the local captains and their men, and was routed. A third force from Oltenia achieved little in Wallachia.": "Bâtie par son alliance de 1726 pour aider la Russie, et en espérant des gains faciles, la monarchie des Habsbourg est entrée dans la guerre russo-turque en juillet 1737. Le maréchal de campagne Friedrich Heinrich von Seckendorff a mené l’armée principale vers le haut du Morava de Belgrade et a pris Niš à la fin de juillet, et les Serbes dans les terres ottomanes se sont levés en soutien. À l’ouest, une armée dirigée par le prince Joseph de Saxe-Hildburghausen envahit la Bosnie et assiégea Banja Luka, mais le 4 août elle croisa dans une armée de secours élevée par le gouverneur de Bosnie, Hekimoğlu Ali Pacha, des capitaines locaux et de leurs hommes, et fut rouée."
"The Ottomans struck back in the autumn and retook Niš in October; its commander, General Nikolaus Doxat, was later beheaded by the Austrians for giving it up. Seckendorff was recalled, tried and imprisoned at Graz. Peace talks with Russia and the Ottomans at Nemyriv in Poland failed. In 1738 a large Ottoman army under Grand Vizier Yeğen Mehmed Pasha advanced into the Banat, took Mehadia and the island fortress of Orsova on the Danube, while plague spread through both armies and the towns of the region.": "Les Ottomans ont frappé à l’automne et repris Niš en octobre ; son commandant, le général Nikolaus Doxat, a ensuite été décapité par les Autrichiens pour l’avoir abandonné. Seckendorff a été rappelé, jugé et emprisonné à Graz. En 1738, une grande armée ottomane sous la direction du Grand Vizier Yeğen Mehmed Pacha a avancé dans le Banat, a pris Mehadia et l’île forteresse d’Orsova sur le Danube, tandis que la peste s’est répandue à travers les armées et les villes de la région."
