"A war in which the Habsburg Monarchy, as Russia’s ally, attacked the Ottoman Empire in Serbia, Bosnia and Wallachia. After brief early gains it was beaten at Banja Luka and lost Niš, and after its defeat at Grocka in 1739 the Treaty of Belgrade gave Belgrade, northern Serbia and Oltenia back to the Ottomans and Wallachia, undoing most of the gains of Passarowitz.": "Une guerre au cours de laquelle la Monarchie des Habsbourg, alliée de la Russie, attaqua l’Empire ottoman en Serbie, en Bosnie et en Wallachie. Après de brefs progrès, elle fut battue à Banja Luka et perdit Niš, et après sa défaite à Grocka en 1739, le traité de Belgrade remit Belgrade, le nord de la Serbie et Oltenia aux Ottomans et à la Wallachie."
