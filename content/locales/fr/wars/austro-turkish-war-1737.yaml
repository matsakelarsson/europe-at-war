"In 1739 Count George Oliver Wallis took command with about 40,000 men. Hearing that the main Ottoman army under Grand Vizier Elhac Ivaz Mehmed Pasha was camped at Grocka, on the Danube below Belgrade, he hurried his cavalry forward. On the morning of 22 July they came out of a narrow defile into the Ottoman army drawn up on the hills, and were shot down as they arrived; the infantry that followed fought all day under fire from above. That night Wallis retreated to Belgrade, and the Ottomans followed and laid siege to the city.": "En 1739, le comte George Oliver Wallis prit le commandement avec environ 40 000 hommes. Lorsqu'il apprit que la principale armée ottomane du Grand Vizier Elhac Ivaz Mehmed Pacha était campée à Grocka, sur le Danube sous Belgrade, il précipitait sa cavalerie vers l’avant. Le matin du 22 juillet, ils sortirent d’une étroite souillure dans l’armée ottomane dressée sur les collines, et furent abattus à leur arrivée ; l’infanterie qui suivit combattit toute la journée sous le feu d’en haut."
"Vienna sent Count Wilhelm Reinhard von Neipperg to make peace. Isolated in the grand vizier’s camp and relying on the French ambassador, the Marquis de Villeneuve, he agreed on 1 September to give up Belgrade, not knowing that the emperor had meanwhile decided to hold it. The Treaty of Belgrade, signed on 18 September, returned Belgrade, northern Serbia and the strip of Bosnia south of the Sava to the Ottomans and Oltenia to Wallachia; the Austrians had to demolish the fortifications they had built at Belgrade. The border was again the Sava and the Danube. Wallis and Neipperg were imprisoned until Maria Theresa freed them in 1740, and many Serbs who had sided with the Habsburgs fled north across the rivers.": "Vienne a envoyé le comte Wilhelm Reinhard von Neipperg pour faire la paix. Isolé dans le camp du grand vizier et s’appuyant sur l’ambassadeur de France, le marquis de Villeneuve, il a convenu le 1 septembre de renoncer à Belgrade, ne sachant pas que l’empereur avait entre-temps décidé de la tenir. Le traité de Belgrade, signé le 18 septembre, renvoyait Belgrade, le nord de la Serbie et la bande de Bosnie au sud de la Save aux Ottomans et à Oltenia à Wallachie ; les Autrichiens devaient démolir les fortifications qu’ils avaient construites à Belgrade. La frontière était encore la Save et le Danube. Wallis et Neipperg furent emprisonnés jusqu’à ce que Maria Theresa les libère en 1740, et de nombreux Serbes qui avaient pris parti pour les Habsbourg s’enfuirent au nord à travers les rivières."
