# Some French text was translated automatically.
"Austro-Turkish War of 1788–1791": "Guerre austro-turque de 1788–1791"
"The last war between the Habsburg Monarchy and the Ottoman Empire, fought by Joseph II as Russia’s ally. After a disastrous first year, in which disease swept the Habsburg camps and an Ottoman army invaded the Banat, Field Marshal Laudon took Belgrade in 1789 and Austrian troops helped the Russians win at Focșani and Rymnik; but under Prussian pressure Leopold II made peace at Sistova in 1791 and gave back almost everything.": "La dernière guerre entre la Monarchie des Habsbourg et l’Empire ottoman, combattue par Joseph II comme allié de la Russie. Après une première année désastreuse, au cours de laquelle la maladie a balayé les camps de Habsbourg et une armée ottomane a envahi le Banat, le maréchal de campagne Laudon a pris Belgrade en 1789 et les troupes autrichiennes ont aidé les Russes à gagner à Focșani et Rymnik ; mais sous la pression prussienne Leopold II a fait la paix à Sistova en 1791 et a rendu presque tout."
"Dates are New Style (Gregorian).": "Les dates sont New Style (Gregorian)."
"Russia’s war with the Ottomans in 1787–1792 is told in the Russo-Turkish War of 1787–1792; the battles of Focșani and Rymnik, won jointly by Austrian and Russian troops, appear in both.": "La guerre avec les Ottomans en 1787–1792 est racontée dans la guerre russo-turque de 1787–1792 ; les batailles de Focșani et Rymnik, remportées conjointement par les troupes autrichiennes et russes, apparaissent dans les deux."
"Karánsebes is today’s Caransebeș in Romania, and Sistova is Svishtov in Bulgaria.": "Karánsebes est aujourd'hui Caransebeș en Roumanie, et Sistova est Svishtov en Bulgarie."
