"1789–1791": "1789–1791"
"Joseph, ill since the campaign of 1788, gave the main army to the 72-year-old Laudon in July 1789. On 1 August Austrian troops under Prince Josias of Saxe-Coburg and Russians under Alexander Suvorov beat the Ottomans at Focșani in Moldavia, and on 22 September they routed the grand vizier’s army on the Rymnik. Laudon crossed the Sava in mid-September and besieged Belgrade with more than 200 guns. After three weeks of bombardment Osman Pasha surrendered on 8 October in return for free passage for his garrison. Habsburg troops occupied much of Serbia, and in November Coburg entered Bucharest and occupied Wallachia.": "Joseph, malade depuis la campagne de 1788, donna l’armée principale à Laudon, 72 ans, en juillet 1789. Le 1er août, les troupes autrichiennes sous le prince Josias de Saxe-Coburg et les Russes sous Alexander Suvorov battaient les Ottomans à Focșani en Moldavie, et le 22 septembre, elles roulèrent l’armée du grand vizier sur le Rymnik. Après trois semaines de bombardement, Osman Pacha s’est rendu le 8 octobre en échange du libre passage pour sa garnison. Les troupes de Habsbourg ont occupé une grande partie de la Serbie, et en novembre Coburg est entré à Bucarest et a occupé Wallachia."
"Joseph II died on 20 February 1790. His brother Leopold II faced revolt in the Austrian Netherlands, unrest in Hungary and a Prussian army gathered on the Silesian border, and Prussia had allied with the Ottomans. At Reichenbach on 27 July 1790 he agreed to make peace on the basis of the pre-war borders, and an armistice followed at Giurgiu in September. By the Treaty of Sistova, signed on 4 August 1791 under British, Prussian and Dutch mediation, Austria gave back Belgrade, Serbia and Wallachia, keeping only Old Orsova and a strip of the Croatian border. The Serbs who had fought for Austria were left to the Ottomans, and many turned their hopes to Russia.": "Joseph II mourut le 20 février 1790. Son frère Léopold II affronta la révolte aux Pays-Bas autrichiens, les troubles en Hongrie et une armée prussienne se rassemblèrent à la frontière silésienne, et la Prusse avait allié avec les Ottomans. Par le traité de Sistova, signé le 4 août 1791 sous la médiation britannique, prussienne et hollandaise, l’Autriche a rendu Belgrade, Serbie et Wallachie, ne conservant que la vieille Orsova et une bande de la frontière croate. Les Serbes qui avaient combattu pour l’Autriche ont été laissés aux Ottomans, et beaucoup ont tourné leurs espoirs vers la Russie."
