"February – December 1788": "février – décembre 1788"
"Joseph II had allied with Catherine II of Russia in 1781, and when the Ottomans declared war on Russia in August 1787 he was bound to join in. Austria declared war on 9 February 1788. Joseph went to the front himself and spread his armies along the whole border from Croatia to Galicia, waiting for the Russians to draw off the Ottoman forces. He took Šabac on the Sava in April but went no further, and through the summer malaria and dysentery spread in the camps on the marshy banks of the Danube; by some accounts half the army was sick, and thousands died. Serbian refugees and volunteers formed a Free Corps, whose captains, among them Koča Anđelković, raised much of the country around Smederevo.": "Joseph II avait allié avec Catherine II de Russie en 1781, et quand les Ottomans ont déclaré la guerre à la Russie en août 1787 il était obligé de s’y joindre. L’Autriche a déclaré la guerre le 9 février 1788. Joseph est allé au front lui-même et a répandu ses armées le long de toute la frontière de Croatie à Galice, attendant que les Russes retirent les forces ottomanes. Il a pris Šabac sur la Save en avril mais n’est pas allé plus loin, et au cours de l’été le paludisme et la dysenterie se sont répandus dans les camps sur les rives marécageuses du Danube ; selon certains, la moitié de l’armée était malade, et des milliers de personnes sont mortes."
"In August the grand vizier, Koca Yusuf Pasha, crossed the Danube into the Banat, took Mehadia and burned villages, and tens of thousands of Serbs and Romanians fled north. Joseph marched against him, but on the night of 21–22 September, near Karánsebes, his retreating columns panicked and fired on each other in the dark. Later accounts of thousands killed by their own side are not borne out by contemporary reports, but the Ottomans took Karánsebes and ravaged the Banat before the winter. In Croatia, Field Marshal Ernst Gideon von Laudon did better, taking the Bosnian border forts of Dubica and Novi on the Una.": "En août, le grand vizier, Koca Yusuf Pasha, a traversé le Danube dans le Banat, a pris Mehadia et brûlé des villages, et des dizaines de milliers de Serbes et Roumains ont fui vers le nord. Joseph marchait contre lui, mais dans la nuit du 21 au 22 septembre, près de Karánsebes, ses colonnes en retraite paniquaient et tiraient l’un sur l’autre dans l’obscurité. Plus tard, les récits de milliers de personnes tuées par leur propre camp ne sont pas corroborés par des rapports contemporains, mais les Ottomans ont pris Karánsebes et ravagé le Banat avant l’hiver. En Croatie, le maréchal Ernst Gideon von Laudon a fait mieux, prenant les forts de la frontière bosniaque de Dubica et Novi sur l’Una."
