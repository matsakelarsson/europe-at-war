# French translations of the catalogue text (wave 11); step bodies follow later.
Ayutthaya’s wars with Angkor: Guerres d’Ayutthaya contre Angkor
The wars between the new Siamese kingdom of Ayutthaya and the Khmer kingdom of Angkor, which ended with the Khmer court leaving Angkor. Ayutthaya, founded in 1351 on the lower Chao Phraya, in lands the Khmer had once ruled, attacked Angkor three times according to the chronicles. Its founder Uthong took the city in 1352 after a long siege and put his sons on the Khmer throne until a Khmer prince drove them out in 1357; Ramesuan took it again in 1393–1394 and carried off many captives; and in 1431 Borommaracha II took Angkor after a siege of seven months. The Khmer king Ponhea Yat then moved his court south-east, first to Basan near Srei Santhor and then to Chaktomuk, today’s Phnom Penh. Historians agree that the court left Angkor in the fifteenth century, but treat the chronicles’ account of the earlier wars with caution, and see the Siamese attacks as one cause among several, with the shift of trade to the Mekong and the sea, the decay of Angkor’s waterworks and long droughts.: Les guerres entre le nouveau royaume siamois d’Ayutthaya et le royaume khmer d’Angkor, qui s’achevèrent par l’abandon d’Angkor par la cour khmère. Ayutthaya, fondée en 1351 sur le cours inférieur de la Chao Phraya, sur des terres jadis gouvernées par les Khmers, attaqua Angkor à trois reprises selon les chroniques. Son fondateur Uthong prit la ville en 1352 après un long siège et plaça ses fils sur le trône khmer jusqu’à ce qu’un prince khmer les chasse en 1357 ; Ramesuan la reprit en 1393–1394 et emmena de nombreux captifs ; et en 1431, Borommaracha II prit Angkor après un siège de sept mois. Le roi khmer Ponhea Yat transféra alors sa cour vers le sud-est, d’abord à Basan, près de Srei Santhor, puis à Chaktomuk, aujourd’hui Phnom Penh. Les historiens s’accordent sur le fait que la cour quitta Angkor au XVe siècle, mais considèrent avec prudence le récit que les chroniques font des guerres antérieures, et voient dans les attaques siamoises une cause parmi d’autres, avec le déplacement du commerce vers le Mékong et la mer, la dégradation des ouvrages hydrauliques d’Angkor et de longues sécheresses.
