# French translations of the catalogue text (wave 11); step bodies follow later.
Ayutthaya–Lan Na war: Guerre entre Ayutthaya et le Lan Na
The long war between the Siamese kingdom of Ayutthaya and the northern Tai kingdom of Lan Na, fought mainly over the old Sukhothai lands of the upper Chao Phraya valley. When Tilokarat seized the throne of Chiang Mai in 1441, his rebel brother’s side called in Borommaracha II of Ayutthaya, whose army was driven back from Chiang Mai in 1442; Tilokarat went on to take Nan and Phrae. After Borommaracha’s son Trailok (Borommatrailokkanat) became king in 1448, a prince of the Sukhothai line, Yuthitthira, went over to Lan Na, and Lan Na armies raided the northern cities; in 1460 the governor of Chaliang (Si Satchanalai) surrendered to Tilokarat. Trailok moved his court to Phitsanulok in 1463 to lead the war, and his son Intharacha was killed fighting the Lan Na army that year. Ayutthaya retook Chaliang in 1474, and in 1475 Tilokarat asked for peace. The war, celebrated on the Ayutthayan side in the poem Lilit Yuan Phai, left the border much as it had been.: La longue guerre entre le royaume siamois d’Ayutthaya et le royaume taï du nord, le Lan Na, livrée principalement pour les anciennes terres de Sukhothaï, dans la haute vallée de la Chao Phraya. Lorsque Tilokarat s’empara du trône de Chiang Mai en 1441, le parti de son frère rebelle appela Borommaracha II d’Ayutthaya, dont l’armée fut repoussée de Chiang Mai en 1442 ; Tilokarat prit ensuite Nan et Phrae. Après l’avènement de Trailok (Borommatrailokkanat), fils de Borommaracha, en 1448, un prince de la lignée de Sukhothaï, Yuthitthira, passa au Lan Na, et les armées du Lan Na lancèrent des raids sur les villes du nord ; en 1460, le gouverneur de Chaliang (Si Satchanalai) se rendit à Tilokarat. Trailok transféra sa cour à Phitsanulok en 1463 pour diriger la guerre, et son fils Intharacha fut tué cette année-là en combattant l’armée du Lan Na. Ayutthaya reprit Chaliang en 1474 et, en 1475, Tilokarat demanda la paix. La guerre, célébrée du côté d’Ayutthaya par le poème Lilit Yuan Phai, laissa la frontière à peu près telle qu’elle était.
