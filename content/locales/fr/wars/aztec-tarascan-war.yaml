# French translations of the catalogue text (wave 14); step bodies follow later.
Aztec–Tarascan War: Guerre aztéco-tarasque
The attempt by the Aztec ruler Axayacatl to conquer the Purépecha (Tarascan) kingdom of Michoacán, the other great power of central Mexico, which ended in the worst defeat the Triple Alliance ever suffered. After taking the Toluca Valley from the Matlatzinca, Axayacatl marched west with an army that the chronicles put at 24,000 to 32,000 men, took several frontier towns and was routed near Taximaroa by a larger Purépecha army; the Mexica histories say only a few hundred men came home. The Purépecha then fortified their eastern border, which held until the Spanish conquest.: La tentative du souverain aztèque Axayacatl de conquérir le royaume purépecha (tarasque) du Michoacán, l’autre grande puissance du centre du Mexique, qui se solda par la pire défaite que la Triple Alliance ait jamais subie. Après avoir pris la vallée de Toluca aux Matlatzincas, Axayacatl marcha vers l’ouest avec une armée que les chroniques évaluent entre 24 000 et 32 000 hommes, prit plusieurs villes frontalières et fut mis en déroute près de Taximaroa par une armée purépecha plus nombreuse ; selon les histoires mexicas, seules quelques centaines d’hommes revinrent. Les Purépechas fortifièrent ensuite leur frontière orientale, qui tint jusqu’à la conquête espagnole.
