# French translations of the catalogue text (wave 7); step bodies follow later.
Revolt of Babak Khorramdin: Révolte de Babak Khorramdin
The revolt of the Khurramites of Azerbaijan under their leader Babak against the Abbasid caliphate. From the mountain fortress of Badhdh, between Ardabil and the Aras River, Babak defeated one caliphal army after another for some twenty years, while Khurramites rose elsewhere in western Iran. The caliph al-Mu’tasim finally sent his general al-Afshin, who advanced step by step, stormed Badhdh in August 837 and received Babak from an Armenian prince who had captured him. Babak was executed at Samarra in January 838.: La révolte des khurramites d’Azerbaïdjan, menés par Babak, contre le califat abbasside. Depuis la forteresse de montagne de Badhdh, entre Ardabil et l’Araxe, Babak battit les armées califales l’une après l’autre pendant une vingtaine d’années, tandis que d’autres khurramites se soulevaient ailleurs dans l’ouest de l’Iran. Le calife al-Mu’tasim finit par envoyer son général al-Afshin, qui avança pas à pas, prit Badhdh d’assaut en août 837 et se fit livrer Babak par un prince arménien qui l’avait capturé. Babak fut exécuté à Samarra en janvier 838.
