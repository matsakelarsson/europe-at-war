# French translations of the catalogue text (wave 14); step bodies follow later.
Bacon’s Rebellion: Rébellion de Bacon
? An armed rising in the Colony of Virginia in 1676 against Governor William Berkeley, led by the young planter Nathaniel Bacon, which began as unauthorised war on Native peoples. In July 1675 a quarrel between colonists and the Doeg on the Potomac led Virginia militia to kill fourteen Susquehannock by mistake; in September 1675 Maryland and Virginia militia besieged the Susquehannock fort on Piscataway Creek and killed five of their chiefs who had come out to parley. The Susquehannock answered with raids that killed dozens of colonists in Maryland and Virginia in early 1676. Frontier planters, angered by low tobacco prices, high taxes and Berkeley’s defensive plan of forts and his trade with Native allies, followed Bacon without a commission. In May 1676 his men killed many of the Occaneechi on the Roanoke River, who had just fought the Susquehannock for them, and in August and September they hunted the Pamunkey, allies of the colony, through the swamps of their country and took 45 prisoners. Berkeley declared Bacon a rebel; Bacon forced a commission from the assembly at gunpoint, issued a “Declaration of the People” against the governor on 30 July, and on 19 September 1676 (Old Style) burned Jamestown. Bacon promised freedom to servants and enslaved people who joined him, and in the last months indentured servants and enslaved Africans were among the rebels’ last holdouts. Bacon died of dysentery on 26 October 1676, and his successor, John Ingram, surrendered to Royal Navy captains in November and January; Berkeley had at least thirteen and by most counts twenty-three rebels hanged; a royal commission and 1,000 soldiers arrived in early 1677, and he was recalled. The Treaty of Middle Plantation of May 1677 with the Pamunkey queen Cockacoeske and other nations confirmed their reserved lands as tributaries of the Crown. Historians long saw the rebellion as a forerunner of the Revolution; most now stress its war on Native peoples and the planters’ turn from indentured servants to enslaved Africans that followed.
: Un soulèvement armé dans la colonie de Virginie, en 1676, contre le gouverneur William Berkeley, mené par le jeune planteur Nathaniel Bacon, qui commença par une guerre non autorisée contre des peuples autochtones. En juillet 1675, une querelle entre des colons et les Doegs sur le Potomac conduisit la milice de Virginie à tuer par erreur quatorze Susquehannocks ; en septembre 1675, les milices du Maryland et de Virginie assiégèrent le fort des Susquehannocks sur le Piscataway Creek et tuèrent cinq de leurs chefs venus parlementer. Les Susquehannocks répondirent par des raids qui tuèrent des dizaines de colons au Maryland et en Virginie au début de 1676. Les planteurs de la frontière, irrités par le bas prix du tabac, par le poids des impôts, par le plan défensif de Berkeley, fondé sur des forts, et par son commerce avec les alliés autochtones, suivirent Bacon sans commission. En mai 1676, ses hommes tuèrent de nombreux Occaneechis, sur la Roanoke, qui venaient de combattre les Susquehannocks pour leur compte, et en août et septembre, ils traquèrent les Pamunkeys, alliés de la colonie, à travers les marais de leur pays et firent 45 prisonniers. Berkeley déclara Bacon rebelle ; Bacon arracha une commission à l’assemblée sous la menace des armes, publia le 30 juillet une « Déclaration du peuple » contre le gouverneur et, le 19 septembre 1676 (ancien style), incendia Jamestown. Bacon promit la liberté aux serviteurs et aux esclaves qui le rejoindraient et, dans les derniers mois, des serviteurs sous contrat et des Africains réduits en esclavage figuraient parmi les derniers rebelles à résister. Bacon mourut de dysenterie le 26 octobre 1676, et son successeur, John Ingram, se rendit à des capitaines de la Royal Navy en novembre et en janvier ; Berkeley fit pendre au moins treize rebelles, vingt-trois selon la plupart des décomptes ; une commission royale et 1 000 soldats arrivèrent au début de 1677, et il fut rappelé. Le traité de Middle Plantation, conclu en mai 1677 avec la reine pamunkey Cockacoeske et d’autres nations, leur confirma, en tant que tributaires de la Couronne, les terres qui leur étaient réservées. Les historiens ont longtemps vu dans cette rébellion un signe avant-coureur de la Révolution ; la plupart insistent aujourd’hui sur sa guerre contre les peuples autochtones et sur l’abandon par les planteurs, dans les années qui suivirent, des serviteurs sous contrat au profit d’Africains réduits en esclavage.
