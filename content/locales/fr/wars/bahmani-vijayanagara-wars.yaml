# French translations of the catalogue text (wave 8); step bodies follow later.
Bahmani–Vijayanagara wars: Guerres entre Bahmanides et Vijayanagar
The wars between the Bahmani Sultanate of the Deccan and the Vijayanagara Empire of the south, fought for almost two centuries over the Raichur Doab, the fertile land between the Krishna and the Tungabhadra, with its forts of Raichur and Mudgal. Both states were born in the 1330s and 1340s from the collapse of the Delhi Sultanate’s rule in the south. In repeated wars (1362–1367, 1375–1378, 1398, 1406, 1417–1420, 1423, 1443) the Bahmani sultans usually had the better of the field and forced Vijayanagara to pay tribute, but could not hold the land south of the Tungabhadra, and both sides ravaged the country and killed civilians. Under Mahmud Gawan the Bahmanis took Goa and the west coast (1472). After the sultanate broke up into five states, Krishnadevaraya of Vijayanagara won the Doab, defeating Bijapur at the Battle of Raichur in 1520; the last Bahmani sultan fled in 1527.: Les guerres entre le sultanat bahmanide du Dekkan et l’Empire de Vijayanagar, plus au sud, livrées pendant près de deux siècles pour le Raichur Doab, la terre fertile comprise entre la Krishna et la Tungabhadra, avec ses forteresses de Raichur et de Mudgal. Les deux États étaient nés dans les années 1330 et 1340 de l’effondrement de la domination du sultanat de Delhi dans le sud. Au fil de guerres répétées (1362–1367, 1375–1378, 1398, 1406, 1417–1420, 1423, 1443), les sultans bahmanides eurent le plus souvent l’avantage sur le terrain et contraignirent Vijayanagar à payer tribut, mais ne purent tenir les terres situées au sud de la Tungabhadra, et les deux camps ravagèrent le pays et tuèrent des civils. Sous Mahmud Gawan, les Bahmanides prirent Goa et la côte occidentale (1472). Après l’éclatement du sultanat en cinq États, Krishnadevaraya de Vijayanagar conquit le Doab en battant Bijapur à la bataille de Raichur en 1520 ; le dernier sultan bahmanide s’enfuit en 1527.
