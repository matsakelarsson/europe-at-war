# French translations of the catalogue text (wave 9); step bodies follow later.
Bai Lang Rebellion: Rébellion de Bai Lang
? A rising in central and north-western China against the government of Yuan Shikai, led by Bai Lang (1873–1914), a former officer of the New Army from Baofeng in western Henan. Bai took to arms in the disorder after the 1911 revolution with a few dozen men, survived a government purge of armed bands at Lushan in October 1912, and by 1913 led several thousand men who raided towns between the Beijing–Hankou railway and the Han River. Government papers wrote his name with the character for “wolf”, and the foreign press called him the “White Wolf”. In 1913–1914 his army, which took names such as the Citizens’ Punitive Army and claimed to fight Yuan Shikai, grew to 10,000 or more; Huang Xing and other Kuomintang leaders sent letters and arms after the failed Second Revolution, but their influence on it was small. In early 1914 it marched through Henan, Anhui and Hubei, crossed the Tongguan pass into Shaanxi and entered Gansu, where it met hard resistance from the Hui general Ma Anliang and from Hui, Tibetan and Han militias; at Taozhou thousands of Hui Muslims were killed, and Minzhou was plundered. Pressed by about 12,000 Beiyang troops under Duan Qirui’s command, the army broke up on its way back east. Bai was wounded near Lushan and died in August 1914, by most accounts in his home district; his head was shown at Kaifeng. Remnants were dispersed later that year.
: Un soulèvement dans le centre et le nord-ouest de la Chine contre le gouvernement de Yuan Shikai, mené par Bai Lang (1873–1914), ancien officier de la Nouvelle Armée originaire de Baofeng, dans l’ouest du Henan. Bai prit les armes avec quelques dizaines d’hommes dans le désordre qui suivit la révolution de 1911, survécut à une purge gouvernementale des bandes armées à Lushan en octobre 1912 et, en 1913, commandait plusieurs milliers d’hommes qui razziaient les villes situées entre le chemin de fer Pékin–Hankou et la rivière Han. Les documents officiels écrivaient son nom avec le caractère signifiant « loup », et la presse étrangère le surnomma le « Loup blanc ». En 1913–1914, son armée, qui prit des noms tels qu’Armée punitive des citoyens et affirmait combattre Yuan Shikai, atteignit 10 000 hommes ou davantage ; Huang Xing et d’autres dirigeants du Kuomintang lui envoyèrent des lettres et des armes après l’échec de la Seconde révolution, mais leur influence sur elle resta faible. Au début de 1914, elle traversa le Henan, l’Anhui et le Hubei, franchit le col de Tongguan pour entrer dans le Shaanxi et pénétra dans le Gansu, où elle se heurta à une rude résistance du général hui Ma Anliang et de milices hui, tibétaines et han ; à Taozhou, des milliers de musulmans hui furent tués, et Minzhou fut pillée. Pressée par environ 12 000 soldats de l’armée de Beiyang placés sous le commandement de Duan Qirui, l’armée se désagrégea sur le chemin du retour vers l’est. Bai fut blessé près de Lushan et mourut en août 1914, selon la plupart des récits dans son district natal ; sa tête fut exposée à Kaifeng. Les derniers groupes furent dispersés plus tard dans l’année.
