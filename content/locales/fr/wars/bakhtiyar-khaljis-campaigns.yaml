# French translations of the catalogue text (wave 8); step bodies follow later.
Bakhtiyar Khalji’s campaigns: Campagnes de Bakhtiyar Khalji
The conquest of Bihar and north-western Bengal by Muhammad Bakhtiyar Khalji, a Turkish officer in the service of the Ghurids, and his failed expedition towards Tibet. From his fiefs near Mirzapur he raided Bihar, where the great Buddhist monasteries of Odantapuri and Vikramashila were destroyed in these years. In about 1204 he surprised the Sena king Lakshmana Sena at Nadia with a small advance party, made Lakhnauti (Gauda) his capital and ruled northern Bengal for the Ghurids. In 1206 he led about 10,000 horsemen north into the Himalaya to attack Tibet. The expedition ended in disaster; only about a hundred men came back, and Bakhtiyar died, perhaps murdered, at Devkot later that year. The Sena kings kept eastern Bengal for another half-century.: La conquête du Bihar et du nord-ouest du Bengale par Muhammad Bakhtiyar Khalji, un officier turc au service des Ghurides, et son expédition manquée vers le Tibet. Depuis ses fiefs proches de Mirzapur, il lança des raids sur le Bihar, où les grands monastères bouddhiques d’Odantapuri et de Vikramashila furent détruits au cours de ces années. Vers 1204, il surprit à Nadia, avec une petite avant-garde, le roi Lakshmana Sena, de la dynastie Sena, fit de Lakhnauti (Gauda) sa capitale et gouverna le nord du Bengale pour le compte des Ghurides. En 1206, il mena environ 10 000 cavaliers vers le nord, dans l’Himalaya, pour attaquer le Tibet. L’expédition tourna au désastre ; une centaine d’hommes seulement en revinrent, et Bakhtiyar mourut, peut-être assassiné, à Devkot plus tard la même année. Les rois Sena conservèrent le Bengale oriental pendant encore un demi-siècle.
