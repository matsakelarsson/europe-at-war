# French translations of the catalogue text (wave 13); step bodies follow later.
Bambatha rising: Soulèvement de Bambatha
? The last armed Zulu resistance to colonial rule, in the British Colony of Natal in 1906, known in the colonial records as the Bambatha Rebellion or Zulu Rebellion. In 1905 Natal imposed a poll tax of £1 on every African man over eighteen, on top of the hut tax, to push men into wage labour at a time of depression, cattle disease and land loss. Protests at the tax collection led to the killing of two policemen near Richmond on 8 February 1906 and to martial law; the colonial militia burned homesteads and executed twelve men. Bambatha kaMancinza, chief of the Zondi in the Mpanza valley near Greytown, was deposed for resisting the tax. In April he attacked a police patrol and withdrew into the Nkandla forest of Zululand, where the elderly chief Sigananda of the Cube joined him, and many hoped for the support of Dinuzulu, son of the last Zulu king. A colonial force of over 4,000 men under Colonel Duncan McKenzie surrounded the main body of fighters in the Mome Gorge on 10 June 1906 and killed hundreds with machine guns and artillery; the colonial forces said Bambatha was among the dead and displayed a head as his, but many Zulu believe that he escaped to Mozambique. A rising under Meseni in the lower Thukela valley was crushed by 11 July. Between 3,000 and 4,000 Africans were killed, more than 7,000 imprisoned and some 4,000 flogged; 36 colonial soldiers died. Dinuzulu was tried for treason and imprisoned. Mohandas Gandhi led an Indian stretcher-bearer corps for the colonial forces and later called the campaign “no war but a man hunt”. In 2006 South Africa declared Bambatha a national hero.
: La dernière résistance armée zouloue à la domination coloniale, dans la colonie britannique du Natal en 1906, connue dans les archives coloniales sous le nom de rébellion de Bambatha ou de rébellion zouloue. En 1905, le Natal imposa une capitation de 1 livre à tout homme africain de plus de dix-huit ans, en plus de l’impôt sur les cases, afin de pousser les hommes vers le travail salarié dans une période de dépression économique, d’épizooties et de perte de terres. Des protestations lors de la perception de l’impôt aboutirent au meurtre de deux policiers près de Richmond le 8 février 1906 et à la proclamation de la loi martiale ; la milice coloniale incendia des habitations et exécuta douze hommes. Bambatha kaMancinza, chef des Zondi dans la vallée de la Mpanza, près de Greytown, fut destitué pour avoir résisté à l’impôt. En avril, il attaqua une patrouille de police et se retira dans la forêt de Nkandla, au Zoulouland, où le vieux chef Sigananda, des Cube, le rejoignit, et beaucoup espéraient le soutien de Dinuzulu, fils du dernier roi zoulou. Une force coloniale de plus de 4 000 hommes commandée par le colonel Duncan McKenzie encercla le gros des combattants dans la gorge de la Mome le 10 juin 1906 et en tua des centaines à la mitrailleuse et à l’artillerie ; les forces coloniales affirmèrent que Bambatha figurait parmi les morts et exhibèrent une tête présentée comme la sienne, mais de nombreux Zoulous croient qu’il s’échappa au Mozambique. Un soulèvement mené par Meseni dans la basse vallée de la Thukela était écrasé le 11 juillet. Entre 3 000 et 4 000 Africains furent tués, plus de 7 000 emprisonnés et quelque 4 000 fouettés ; 36 soldats coloniaux moururent. Dinuzulu fut jugé pour trahison et emprisonné. Mohandas Gandhi dirigea un corps indien de brancardiers au service des forces coloniales et qualifia plus tard la campagne de « non pas une guerre, mais une chasse à l’homme ». En 2006, l’Afrique du Sud a proclamé Bambatha héros national.
