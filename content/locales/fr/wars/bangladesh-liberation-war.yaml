# French translations of the catalogue text (wave 8); step bodies follow later.
Bangladesh Liberation War: Guerre de libération du Bangladesh
The war in which East Pakistan became independent as Bangladesh. After the Awami League of Sheikh Mujibur Rahman won the Pakistani elections of December 1970 and the military government postponed the new assembly, the Pakistan Army began a crackdown in Dhaka on the night of 25 March 1971 (Operation Searchlight) and arrested Mujib. Bengali leaders declared independence, a government in exile was formed, and Bengali soldiers, police and volunteers, the Mukti Bahini, fought a guerrilla war with Indian support. The army and allied militias killed large numbers of civilians, especially Hindus, students and Awami League supporters; estimates of the dead range from about 300,000 to three million, and some ten million refugees fled to India. India entered the war openly in December, and Pakistan’s Eastern Command surrendered in Dhaka on 16 December 1971.: La guerre au terme de laquelle le Pakistan oriental devint indépendant sous le nom de Bangladesh. Après la victoire de la Ligue Awami de Sheikh Mujibur Rahman aux élections pakistanaises de décembre 1970 et l’ajournement de la nouvelle assemblée par le gouvernement militaire, l’armée pakistanaise lança une répression à Dacca dans la nuit du 25 mars 1971 (opération Searchlight) et arrêta Mujib. Des dirigeants bengalis proclamèrent l’indépendance, un gouvernement en exil fut formé, et des soldats, des policiers et des volontaires bengalis, les Mukti Bahini, menèrent une guérilla avec le soutien de l’Inde. L’armée et les milices alliées tuèrent un grand nombre de civils, en particulier des hindous, des étudiants et des partisans de la Ligue Awami ; les estimations du nombre de morts vont d’environ 300 000 à trois millions, et quelque dix millions de réfugiés s’enfuirent en Inde. L’Inde entra ouvertement en guerre en décembre, et le commandement oriental du Pakistan capitula à Dacca le 16 décembre 1971.
