# French translations of the catalogue text (wave 11); step bodies follow later.
Banjarmasin War: Guerre de Banjarmasin
? "The war of the Banjar sultanate in south-eastern Borneo and its Dayak allies against the Dutch, known in Indonesia as the Banjar War (Perang Banjar). After Sultan Adam died in 1857 the Dutch installed Tamjidillah as sultan over the claims of Prince Hidayatullah, whom much of the court preferred, and exiled another claimant; resentment of Dutch interference, taxes and the new Dutch coal mines grew. On 28 April 1859 Prince Antasari, a member of the royal house, attacked the Oranje Nassau coal mine at Pengaron, and the rising spread across the sultanate and up the Barito River. The Dutch deposed Tamjidillah, declared the sultanate abolished in 1860 and annexed its lands, and by 1863 had broken the main resistance: Hidayatullah surrendered in 1862 and was exiled to Java, and Antasari, proclaimed head of the faithful by his followers, died of smallpox on the upper Barito in October 1862. His sons and other leaders fought on from forts in the interior for four more decades, until Gusti Muhammad Seman was killed at Baras Kuning on 24 January 1905."
: "La guerre du sultanat de Banjar, dans le sud-est de Bornéo, et de ses alliés dayaks contre les Néerlandais, appelée en Indonésie guerre de Banjar (Perang Banjar). À la mort du sultan Adam en 1857, les Néerlandais installèrent Tamjidillah sur le trône, au détriment des prétentions du prince Hidayatullah, que préférait une grande partie de la cour, et exilèrent un autre prétendant ; le ressentiment contre l’ingérence néerlandaise, les impôts et les nouvelles mines de charbon néerlandaises grandit. Le 28 avril 1859, le prince Antasari, membre de la maison royale, attaqua la mine de charbon Oranje Nassau à Pengaron, et le soulèvement s’étendit à tout le sultanat et remonta le fleuve Barito. Les Néerlandais déposèrent Tamjidillah, proclamèrent l’abolition du sultanat en 1860 et annexèrent ses terres, et en 1863 ils avaient brisé l’essentiel de la résistance : Hidayatullah se rendit en 1862 et fut exilé à Java, et Antasari, proclamé chef des croyants par ses partisans, mourut de la variole sur le haut Barito en octobre 1862. Ses fils et d’autres chefs poursuivirent la lutte depuis des forts de l’intérieur pendant quatre décennies encore, jusqu’à ce que Gusti Muhammad Seman soit tué à Baras Kuning le 24 janvier 1905."
