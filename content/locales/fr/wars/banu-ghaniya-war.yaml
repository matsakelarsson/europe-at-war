# French translations of the catalogue text (wave 12); step bodies follow later.
Banu Ghaniya’s war in Ifriqiya: Guerre des Banu Ghaniya en Ifriqiya
Half a century of war in the eastern Maghreb between the Almohad Caliphate and the Banu Ghaniya, the last branch of the Almoravid ruling family, who had kept the Balearic Islands after the Almohads overthrew the Almoravids. In November 1184 Ali ibn Ghaniya landed at Bougie and, with the help of Arab tribes, overran much of the central Maghreb; driven back by the caliph Abu Yusuf Yaqub al-Mansur, he joined forces with Qaraqush, a mamluk commander from Ayyubid Egypt who held Tripoli, until al-Mansur defeated them in 1187. Ali’s brother Yahya kept the war going, took Mahdia and Tunis and by 1203 ruled most of Ifriqiya. The caliph Muhammad al-Nasir won it back in 1205–1206 and left Abd al-Wahid ibn Abi Hafs as governor, and Yahya went on raiding from the desert until his death in the 1230s. The war kept the Almohads from ever ruling the east securely, and their Hafsid governors became the rulers of Ifriqiya.: Un demi-siècle de guerre dans le Maghreb oriental entre le califat almohade et les Banu Ghaniya, dernière branche de la famille régnante almoravide, qui avaient conservé les îles Baléares après que les Almohades eurent renversé les Almoravides. En novembre 1184, Ali ibn Ghaniya débarqua à Bougie et, avec l’aide de tribus arabes, conquit une grande partie du Maghreb central ; repoussé par le calife Abu Yusuf Yaqub al-Mansur, il s’allia à Qaraqush, un commandant mamelouk de l’Égypte ayyoubide qui tenait Tripoli, jusqu’à ce qu’al-Mansur les batte en 1187. Yahya, le frère d’Ali, poursuivit la guerre, prit Mahdia et Tunis et, en 1203, régnait sur la plus grande partie de l’Ifriqiya. Le calife Muhammad al-Nasir la reconquit en 1205–1206 et y laissa Abd al-Wahid ibn Abi Hafs comme gouverneur, tandis que Yahya continua de lancer des raids depuis le désert jusqu’à sa mort dans les années 1230. La guerre empêcha les Almohades de jamais dominer solidement l’est, et leurs gouverneurs hafsides devinrent les souverains de l’Ifriqiya.
