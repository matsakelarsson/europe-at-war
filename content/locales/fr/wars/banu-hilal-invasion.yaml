# French translations of the catalogue text (wave 12); step bodies follow later.
Hilalian invasion of Ifriqiya: Invasion hilalienne de l’Ifriqiya
? The arrival in Ifriqiya of the Banu Hilal and Banu Sulaym, Arab Bedouin tribes whom the Fatimid caliphs of Cairo turned loose on their former governors, the Zirids, after the Zirid emir al-Mu’izz ibn Badis broke with Cairo and recognised the Abbasid caliph in Baghdad in the 1040s. On the advice of the vizier al-Yazuri, the caliph al-Mustansir granted the Maghreb to the tribes, then camping in Upper Egypt, in 1050. The Sulaym settled in Cyrenaica; the Hilal moved on into Tripolitania and southern Ifriqiya, and on 14 April 1052 they routed al-Mu’izz’s much larger army at Haydaran, near Gabès. For five years they roamed and plundered the countryside around Kairouan, until in 1057 al-Mu’izz withdrew to the coastal fortress of Mahdia and the tribes sacked his abandoned capital. Ifriqiya broke up into small principalities paying the Arab chiefs for protection. Medieval writers, above all Ibn Khaldun, compared the Hilalians to a swarm of locusts that left ruin behind; many modern historians see a slower migration of families that did less damage than once claimed but changed the Maghreb for good, spreading pastoral nomadism and the Arabic language in the countryside.
: L’arrivée en Ifriqiya des Banu Hilal et des Banu Sulaym, tribus bédouines arabes que les califes fatimides du Caire lâchèrent sur leurs anciens gouverneurs, les Zirides, après que l’émir ziride al-Mu’izz ibn Badis eut rompu avec Le Caire et reconnu le calife abbasside de Bagdad dans les années 1040. Sur le conseil du vizir al-Yazuri, le calife al-Mustansir concéda en 1050 le Maghreb aux tribus, qui campaient alors en Haute-Égypte. Les Sulaym s’établirent en Cyrénaïque ; les Hilal poursuivirent leur route vers la Tripolitaine et le sud de l’Ifriqiya et, le 14 avril 1052, mirent en déroute à Haydaran, près de Gabès, l’armée bien plus nombreuse d’al-Mu’izz. Pendant cinq ans, ils parcoururent et pillèrent les campagnes autour de Kairouan, jusqu’à ce qu’en 1057 al-Mu’izz se retire dans la forteresse côtière de Mahdia et que les tribus mettent à sac sa capitale abandonnée. L’Ifriqiya se morcela en petites principautés qui payaient les chefs arabes pour leur protection. Les auteurs médiévaux, Ibn Khaldoun en tête, comparèrent les Hilaliens à une nuée de sauterelles qui ne laissait que des ruines derrière elle ; de nombreux historiens modernes y voient une migration plus lente de familles, moins destructrice qu’on ne l’a affirmé autrefois, mais qui transforma durablement le Maghreb en répandant le nomadisme pastoral et la langue arabe dans les campagnes.
