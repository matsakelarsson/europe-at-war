# French translations of the catalogue text (wave 14); step bodies follow later.
Baptist War: Guerre baptiste
? The largest rising of enslaved people in the British Caribbean, also called the Christmas Rebellion and the Great Jamaican Slave Revolt of 1831–1832. It was planned by Samuel Sharpe, an enslaved man of Montego Bay who was a deacon of the Baptist chapel of the missionary Thomas Burchell and a leader among the Black Baptists of western Jamaica. As the campaign against slavery grew in Britain, many enslaved Jamaicans believed that the king had granted freedom and that the planters were withholding it. Sharpe and his companions swore people on the estates to refuse to work after the Christmas holidays of 1831 unless they were paid wages. The strike turned into an armed rising when the trash house of Kensington estate in the hills of Saint James was set alight on 27 December. Up to 60,000 of the island’s roughly 300,000 enslaved people took part across Saint James, Hanover, Westmoreland, Trelawny and Saint Elizabeth; estates were burned, and a rebel Black Regiment drove back a militia force. The governor, Lord Belmore, declared martial law, and British troops under Sir Willoughby Cotton, with the militia and Maroons, broke the rising in the first weeks of January 1832. Fourteen white people were killed. More than 200 rebels died in the fighting, and between 310 and 340 were executed after trials by courts martial and slave courts; Sharpe was hanged at Montego Bay on 23 May 1832. Planters blamed the missionaries and destroyed Baptist and Methodist chapels. The Assembly put the damage at £1,154,589. The rising and the reprisals, reported in Britain by the missionaries, helped persuade Parliament to pass the Slavery Abolition Act of 1833.
: Le plus grand soulèvement d’esclaves des Caraïbes britanniques, appelé aussi rébellion de Noël et grande révolte des esclaves de la Jamaïque de 1831–1832. Il fut préparé par Samuel Sharpe, un esclave de Montego Bay qui était diacre de la chapelle baptiste du missionnaire Thomas Burchell et l’un des chefs des baptistes noirs de l’ouest de la Jamaïque. À mesure que la campagne contre l’esclavage prenait de l’ampleur en Grande-Bretagne, beaucoup de Jamaïcains réduits en esclavage croyaient que le roi avait accordé la liberté et que les planteurs la leur refusaient. Sharpe et ses compagnons firent jurer aux esclaves des domaines de refuser de travailler après les fêtes de Noël de 1831 s’ils ne recevaient pas de salaire. La grève se transforma en soulèvement armé lorsque le hangar à bagasse du domaine de Kensington, dans les collines de Saint James, fut incendié le 27 décembre. Jusqu’à 60 000 des quelque 300 000 esclaves de l’île y prirent part dans les paroisses de Saint James, Hanover, Westmoreland, Trelawny et Saint Elizabeth ; des domaines furent incendiés, et un Régiment noir rebelle repoussa une force de la milice. Le gouverneur, Lord Belmore, proclama la loi martiale, et les troupes britanniques de Sir Willoughby Cotton, avec la milice et les Marrons, brisèrent le soulèvement dans les premières semaines de janvier 1832. Quatorze Blancs furent tués. Plus de 200 rebelles moururent au combat, et entre 310 et 340 furent exécutés après des procès devant des cours martiales et des tribunaux d’esclaves ; Sharpe fut pendu à Montego Bay le 23 mai 1832. Les planteurs accusèrent les missionnaires et détruisirent des chapelles baptistes et méthodistes. L’Assemblée évalua les dégâts à 1 154 589 livres sterling. Le soulèvement et les représailles, rapportés en Grande-Bretagne par les missionnaires, contribuèrent à convaincre le Parlement de voter la loi sur l’abolition de l’esclavage (Slavery Abolition Act) de 1833.
