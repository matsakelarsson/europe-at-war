# Some French text was translated automatically.
"Bar Confederation": "Confédération du barreau"
"In February 1768 Polish nobles formed a confederation at Bar in Podolia against Russian domination, King Stanisław August and the rights for Protestants and Orthodox that Russia had forced on the Sejm. Four years of guerrilla war against Russian troops followed, during which Cossacks in Russian service, chasing confederates, raided the Ottoman border town of Balta, which helped start the Russo-Turkish War of 1768–1774. The last strongholds, among them Częstochowa, fell in 1772, the year Russia, Prussia and Austria took almost a third of Poland–Lithuania in the First Partition.": "En février 1768, les nobles polonais formèrent une confédération à Bar in Podolia contre la domination russe, le roi Stanisław August et les droits des protestants et orthodoxes que la Russie avait imposés au Sejm. Quatre années de guérilla contre les troupes russes ont suivi, au cours desquelles les cosaques en service russe, poursuivant des confédérés, ont attaqué la ville frontalière ottomane de Balta, qui a aidé à démarrer la guerre russo-turque de 1768–1774. Les derniers bastions, parmi lesquels Częstochowa, sont tombés en 1772, l’année où la Russie, la Prusse et l’Autriche ont pris près d’un tiers de Pologne-Lituanie dans la Première Partition."
