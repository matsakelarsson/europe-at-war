# French translations of the catalogue text (wave 12); step bodies follow later.
The Barbarossa brothers and the Ottoman conquest of Algiers: Les frères Barberousse et la conquête ottomane d’Alger
The war in which two Turkish corsair brothers, Oruç and Hayreddin, called Barbarossa by the Europeans, fought the Spanish garrisons of the central Maghreb and made Algiers an Ottoman province. Invited by the rulers of Bougie and Algiers to drive out the Spaniards, Oruç failed at Bougie in 1512 and 1514 but took Jijel and, in 1516, Algiers, where he had its ruler Salim al-Tumi killed and beat off a Spanish expedition. He took Ténès and Tlemcen in 1517, but a Spanish army from Oran besieged him there, and he was killed while trying to escape in May 1518. Hayreddin, holding only the coast, put himself under the Ottoman sultan Selim I in 1519 and received the title of beylerbey with 2,000 janissaries. Driven out of Algiers in 1520 by a coalition of the Kabyle kingdom of Kuku and the Hafsids, he won it back in 1525, and in May 1529 he took the Spanish fort on the Peñón, the island facing the city, and joined it to the shore with a mole to make the harbour of Algiers.: La guerre au cours de laquelle deux frères corsaires turcs, Oruç et Hayreddin, que les Européens appelaient Barberousse, combattirent les garnisons espagnoles du Maghreb central et firent d’Alger une province ottomane. Appelé par les souverains de Bougie et d’Alger pour chasser les Espagnols, Oruç échoua devant Bougie en 1512 et en 1514, mais prit Jijel puis, en 1516, Alger, dont il fit tuer le souverain Salim al-Tumi et où il repoussa une expédition espagnole. Il prit Ténès et Tlemcen en 1517, mais une armée espagnole venue d’Oran l’y assiégea, et il fut tué en tentant de s’échapper en mai 1518. Hayreddin, qui ne tenait plus que la côte, se plaça en 1519 sous l’autorité du sultan ottoman Sélim Ier et reçut le titre de beylerbey avec 2 000 janissaires. Chassé d’Alger en 1520 par une coalition du royaume kabyle de Koukou et des Hafsides, il la reprit en 1525 et, en mai 1529, s’empara du fort espagnol du Peñón, l’îlot qui fait face à la ville, qu’il relia au rivage par une jetée pour créer le port d’Alger.
