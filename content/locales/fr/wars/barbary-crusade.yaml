# French translations of the catalogue text (wave 12); step bodies follow later.
Barbary Crusade (Mahdia, 1390): Croisade de Barbarie (Mahdia, 1390)
? A French and Genoese expedition against Mahdia, a port of the Hafsid kingdom of Tunis from which ships raided Christian shipping and coasts. Genoa, whose trade suffered from the raids, offered ships, supplies and soldiers if France would provide the knights, and Charles VI allowed his uncle Louis II, Duke of Bourbon, to lead about 1,500 French knights and squires, with some English volunteers such as John Beaufort; Pope Boniface IX gave the enterprise crusade privileges. The fleet landed before Mahdia in July 1390 and laid siege to it. The Hafsid sultan Abu al-Abbas Ahmad II came to its relief with an army that included troops from Bougie and Tlemcen; it avoided a pitched battle and harassed the crusaders, who fortified their camp, while disease and shortages wore them down and a last assault on the walls failed. After about two months the Genoese negotiated a ten-year truce, and the army was back in Genoa by mid-October, having lost 274 knights and squires to fighting and disease. Both sides claimed victory; the town stayed Hafsid, and many of the French leaders went on to fight at Nicopolis in 1396.
: Une expédition française et génoise contre Mahdia, port du royaume hafside de Tunis d’où partaient des navires qui s’attaquaient à la navigation et aux côtes chrétiennes. Gênes, dont le commerce souffrait de ces raids, offrit navires, vivres et soldats si la France fournissait les chevaliers, et Charles VI autorisa son oncle Louis II, duc de Bourbon, à conduire environ 1 500 chevaliers et écuyers français, avec quelques volontaires anglais comme John Beaufort ; le pape Boniface IX accorda à l’entreprise les privilèges de la croisade. La flotte débarqua devant Mahdia en juillet 1390 et mit le siège devant la ville. Le sultan hafside Abu al-Abbas Ahmad II vint à son secours avec une armée qui comprenait des troupes de Bougie et de Tlemcen ; celle-ci évita la bataille rangée et harcela les croisés, qui fortifièrent leur camp, tandis que la maladie et les pénuries les épuisaient et qu’un dernier assaut contre les murailles échouait. Au bout d’environ deux mois, les Génois négocièrent une trêve de dix ans, et l’armée était de retour à Gênes à la mi-octobre, après avoir perdu 274 chevaliers et écuyers au combat ou de maladie. Les deux camps revendiquèrent la victoire ; la ville resta hafside, et nombre des chefs français allèrent ensuite combattre à Nicopolis en 1396.
