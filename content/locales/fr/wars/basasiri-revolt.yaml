# French translations of the catalogue text (wave 7); step bodies follow later.
Revolt of al-Basasiri: Révolte d’al-Basasiri
The seizure of Baghdad for the Fatimid caliphate of Cairo by al-Basasiri, the Turkish commander of the last Buyids in Iraq. Driven out when the Seljuk Tughril entered Baghdad in 1055, al-Basasiri took service with the Fatimid caliph al-Mustansir, defeated a Seljuk force at Sinjar in January 1057 and briefly held Mosul. In 1058 Tughril’s half-brother Ibrahim Inal rebelled in western Iran and drew Tughril away, and in late December al-Basasiri entered Baghdad with his Arab allies, the Uqaylid emir Quraysh and the Mazyadid Dubays. For about forty weeks the Friday sermon was read in the name of the Fatimid caliph. The Abbasid caliph al-Qa’im was sent into custody at Haditha on the Euphrates, and his vizier Ibn al-Muslima was executed. After defeating and executing Ibrahim Inal, Tughril marched back to Iraq. Al-Basasiri left Baghdad in December 1059, al-Qa’im was restored, and al-Basasiri was defeated and killed near Kufa in January 1060.: La prise de Bagdad, pour le compte du califat fatimide du Caire, par al-Basasiri, le commandant turc des derniers Bouyides d’Irak. Chassé lorsque le Seldjoukide Toghrul entra à Bagdad en 1055, al-Basasiri passa au service du calife fatimide al-Mustansir, battit une troupe seldjoukide à Sinjar en janvier 1057 et tint brièvement Mossoul. En 1058, Ibrahim Inal, demi-frère de Toghrul, se révolta dans l’ouest de l’Iran et força Toghrul à s’éloigner, et fin décembre al-Basasiri entra à Bagdad avec ses alliés arabes, l’émir uqaylide Quraysh et le Mazyadide Dubays. Pendant une quarantaine de semaines, le sermon du vendredi fut prononcé au nom du calife fatimide. Le calife abbasside al-Qa’im fut placé en détention à Haditha, sur l’Euphrate, et son vizir Ibn al-Muslima fut exécuté. Après avoir vaincu et exécuté Ibrahim Inal, Toghrul revint en Irak. Al-Basasiri quitta Bagdad en décembre 1059, al-Qa’im fut rétabli, et al-Basasiri fut vaincu et tué près de Koufa en janvier 1060.
