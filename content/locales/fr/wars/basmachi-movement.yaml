# French translations of the catalogue text (wave 7); step bodies follow later.
Basmachi movement: Mouvement basmatchi
An armed resistance to Soviet rule in Central Asia, made up of many separate bands rather than one organisation. It began in the Ferghana Valley after Soviet troops sacked Kokand, the seat of the short-lived Turkestan Autonomy, in February 1918, and spread to Bukhara and Khiva after the Red Army overthrew their rulers in 1920. The former Ottoman war minister Enver Pasha led part of it until he was killed in 1922. Red Army offensives, religious and economic concessions and war-weariness broke the movement by the mid-1920s, but exiles raided from Afghanistan and the collectivisation of farming set off new revolts until the early 1930s.: Une résistance armée au pouvoir soviétique en Asie centrale, formée de nombreuses bandes distinctes plutôt que d’une organisation unique. Elle commença dans la vallée de Ferghana après le sac de Kokand, siège de l’éphémère Autonomie du Turkestan, par les troupes soviétiques en février 1918, et s’étendit à Boukhara et à Khiva après le renversement de leurs souverains par l’Armée rouge en 1920. L’ancien ministre ottoman de la Guerre Enver Pacha en dirigea une partie jusqu’à ce qu’il soit tué en 1922. Les offensives de l’Armée rouge, des concessions religieuses et économiques et la lassitude de la guerre brisèrent le mouvement vers le milieu des années 1920, mais des exilés lancèrent des raids depuis l’Afghanistan, et la collectivisation de l’agriculture provoqua de nouvelles révoltes jusqu’au début des années 1930.
