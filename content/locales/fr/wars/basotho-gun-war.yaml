# French translations of the catalogue text (wave 13); step bodies follow later.
Basotho Gun War: Guerre des fusils basotho
? "The war in which the Basotho resisted the Cape Colony’s attempt to disarm them, and kept their guns. Basutoland, a British protectorate since 1868, had been annexed to the Cape in 1871. Many Basotho had bought rifles with wages earned at the Kimberley diamond fields, and to them guns meant the defence of their land and cattle and the standing of grown men. In 1879 the Cape doubled the hut tax, crushed the rising of the Baphuthi chief Moorosi in the south and announced that the Quthing district would be opened to white settlement; Gordon Sprigg’s government extended the Peace Preservation Act of 1878 to Basutoland, and in 1880 ordered all firearms handed in for compensation. Most chiefs refused. The paramount chief Letsie I stayed formally loyal; his son Lerotholi led the resistance in the south and besieged the magistracy at Mafeteng, and Letsie’s brother Masopha held Thaba Bosiu and blockaded Maseru, while Jonathan Molapo in the north sided with the government against his kinsman Joel Molapo. Cape forces, the Cape Mounted Riflemen, yeomanry and burgher volunteers under Brigadier-General Charles Clarke and Lieutenant-Colonel Frederick Carrington, entered Basutoland on 13 September 1880, but the Basotho, mounted and armed with rifles, fought them to a standstill: at Qalabane on 19 October 1880 Lerotholi’s horsemen cut up a Cape column. The Cape spent about £3 million and lost some 94 men killed. On 29 April 1881 the High Commissioner, Sir Hercules Robinson, gave an award that let the Basotho keep their guns on payment of a licence fee, with a fine in cattle and an amnesty, and Quthing remained Basotho land. Unrest continued, and in 1884 the Cape handed Basutoland back to the Crown, which ruled it as a High Commission territory; that is why Lesotho was not included in the Union of South Africa in 1910 and became independent in 1966."
: "La guerre au cours de laquelle les Basotho résistèrent à la tentative de la colonie du Cap de les désarmer, et conservèrent leurs fusils. Le Basutoland, protectorat britannique depuis 1868, avait été annexé au Cap en 1871. De nombreux Basotho avaient acheté des fusils avec les salaires gagnés sur les gisements diamantifères de Kimberley et, pour eux, les armes à feu signifiaient la défense de leur terre et de leur bétail, ainsi que le statut d’homme adulte. En 1879, le Cap doubla l’impôt sur les cases, écrasa le soulèvement du chef baphuthi Moorosi dans le sud et annonça que le district de Quthing serait ouvert à la colonisation blanche ; le gouvernement de Gordon Sprigg étendit au Basutoland le Peace Preservation Act de 1878 et, en 1880, ordonna la remise de toutes les armes à feu contre indemnisation. La plupart des chefs refusèrent. Le chef suprême Letsie Ier resta formellement loyal ; son fils Lerotholi mena la résistance dans le sud et assiégea la résidence du magistrat à Mafeteng, et Masopha, frère de Letsie, tint Thaba Bosiu et bloqua Maseru, tandis que Jonathan Molapo, dans le nord, se rangea du côté du gouvernement contre son parent Joel Molapo. Les forces du Cap, les Cape Mounted Riflemen, la yeomanry et des volontaires burghers commandés par le brigadier-général Charles Clarke et le lieutenant-colonel Frederick Carrington, entrèrent au Basutoland le 13 septembre 1880, mais les Basotho, montés et armés de fusils, les tinrent en échec : à Qalabane, le 19 octobre 1880, les cavaliers de Lerotholi taillèrent en pièces une colonne du Cap. Le Cap dépensa environ 3 millions de livres sterling et perdit quelque 94 tués. Le 29 avril 1881, le haut-commissaire, sir Hercules Robinson, rendit une sentence qui permit aux Basotho de garder leurs fusils moyennant le paiement d’une licence, assortie d’une amende en bétail et d’une amnistie, et le Quthing resta terre basotho. L’agitation se poursuivit et, en 1884, le Cap rendit le Basutoland à la Couronne, qui l’administra comme territoire de la Haute Commission ; c’est pourquoi le Lesotho ne fut pas inclus dans l’Union sud-africaine en 1910 et devint indépendant en 1966."
