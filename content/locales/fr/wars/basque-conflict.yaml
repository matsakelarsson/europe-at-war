# Some French text was translated automatically.
"Basque conflict": "Conflit basque"
"The armed campaign of ETA (Euskadi Ta Askatasuna, “Basque Homeland and Freedom”) for an independent socialist Basque state, against Franco’s dictatorship and then against democratic Spain and France. Founded in 1959, ETA killed its first victim in 1968, assassinated the Spanish prime minister Luis Carrero Blanco in 1973, and in all killed over 800 people, among them police, soldiers, politicians, journalists and many bystanders, with its worst year in 1980 and the Hipercor bombing in Barcelona in 1987 the deadliest attack. The state answered with mass arrests, cases of torture and, in 1983–1987, the GAL death squads, which killed 27 people. Weakened by arrests and loss of support, ETA declared a definitive end to its armed activity on 20 October 2011, gave up its weapons in 2017 and dissolved itself in 2018.": "La campagne armée de l’ETA (Euskadi Ta Askatasuna, \"Basque Homeland and Freedom\") pour un Etat basque socialiste indépendant, contre la dictature franco-saxonne et ensuite contre l’Espagne démocratique et la France. Fondée en 1959, l’ETA a tué sa première victime en 1968, assassiné le Premier ministre espagnol Luis Carrero Blanco en 1973 et tué en tout plus de 800 personnes, dont des policiers, des soldats, des politiciens, des journalistes et de nombreux passants, avec sa pire année en 1980 et l’attentat de Hipercor à Barcelone en 1987 l’attaque la plus meurtrière. L’État a répondu par des arrestations massives, des cas de torture et, en 1983-1987, les escadrons de la mort de GAL, qui ont tué 27 personnes. Atteint par des arrestations et une perte de soutien, l’ETA a déclaré qu’elle avait définitivement mis fin à son activité armée le 20 octobre 2011, a renoncé à ses armes en 2017 et s’est dissoute en 2018."
"Figures differ by source; Spanish government counts give about 850 people killed by ETA. Several smaller groups also used violence, among them ETA’s own splinter groups and, on the other side, far-right groups.": "Les chiffres diffèrent selon les sources ; le gouvernement espagnol compte environ 850 personnes tuées par l’ETA. Plusieurs groupes plus petits ont également eu recours à la violence, parmi lesquels les groupes d’éclaboussures de l’ETA et, de l’autre côté, les groupes d’extrême droite."
