# French translations of the catalogue text (wave 11); step bodies follow later.
Batak War: Guerre des Batak
? The resistance of Sisingamangaraja XII, the priest-king of the Toba Batak, to the Dutch advance into the Batak highlands of North Sumatra. German missionaries of the Rhenish Mission, led by Ludwig Ingwer Nommensen, had worked in the Silindung valley around Tarutung since the 1860s, and the Dutch stationed troops there to protect them and their converts. Sisingamangaraja XII, whose authority over the Toba Batak was religious more than administrative, saw the mission and the soldiers as a threat to the Batak religion and to the lands still outside Dutch rule. In February 1878 he held a ceremony to rally the Batak and attacked the Dutch posts at Bahal Batu and Tarutung; the attacks failed, and Dutch expeditions that year brought Silindung and much of the southern Toba country under Dutch rule. In 1883–1884, with help from Aceh, then at war with the Dutch, his followers attacked Dutch positions at Uluan, Balige and Tangga Batu; the Dutch replied with burnings, fines and executions but could not catch him. In 1894 they took Bakkara, his seat on the south-western shore of Lake Toba, and he moved to Parlilitan in the hills west of the lake and then to the forests of the Dairi (Pakpak) country, keeping in touch with the Acehnese. In 1904 van Daalen’s column passed through the Batak lands at the end of its march through the Gayo and Alas country. In 1907 a Marechaussee column under Captain Hans Christoffel captured his wife and two of his children, and on 17 June 1907 it caught up with him in the Dairi forest and killed him, his daughter Lopian and his sons Patuan Nagari and Patuan Anggi. His death ended the war. Indonesia declared him a National Hero in 1961.
: La résistance de Sisingamangaraja XII, le roi-prêtre des Batak Toba, à l’avancée néerlandaise dans les hautes terres batak du nord de Sumatra. Des missionnaires allemands de la Mission rhénane, menés par Ludwig Ingwer Nommensen, travaillaient depuis les années 1860 dans la vallée du Silindung, autour de Tarutung, et les Néerlandais y stationnèrent des troupes pour les protéger, eux et leurs convertis. Sisingamangaraja XII, dont l’autorité sur les Batak Toba était plus religieuse qu’administrative, voyait dans la mission et les soldats une menace pour la religion batak et pour les terres qui échappaient encore à la domination néerlandaise. En février 1878, il organisa une cérémonie pour rallier les Batak et attaqua les postes néerlandais de Bahal Batu et de Tarutung ; les attaques échouèrent, et les expéditions néerlandaises de cette année-là placèrent le Silindung et une grande partie du sud du pays toba sous domination néerlandaise. En 1883–1884, avec l’aide d’Aceh, alors en guerre contre les Néerlandais, ses partisans attaquèrent les positions néerlandaises d’Uluan, de Balige et de Tangga Batu ; les Néerlandais répliquèrent par des incendies, des amendes et des exécutions, mais ne purent le capturer. En 1894, ils prirent Bakkara, sa résidence sur la rive sud-ouest du lac Toba, et il se replia à Parlilitan, dans les collines à l’ouest du lac, puis dans les forêts du pays dairi (pakpak), en restant en contact avec les Acehnais. En 1904, la colonne de van Daalen traversa les terres batak au terme de sa marche à travers le pays gayo et alas. En 1907, une colonne de la maréchaussée commandée par le capitaine Hans Christoffel captura sa femme et deux de ses enfants et, le 17 juin 1907, le rattrapa dans la forêt de Dairi et le tua, ainsi que sa fille Lopian et ses fils Patuan Nagari et Patuan Anggi. Sa mort mit fin à la guerre. L’Indonésie l’a proclamé héros national en 1961.
