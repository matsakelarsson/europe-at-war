# French translations of the catalogue text (wave 13); step bodies follow later.
Batetela rebellion: Rébellion des Batetela
? Three revolts of Tetela and Kusu soldiers of the Congo Free State’s army, the Force Publique, and the guerrilla war that followed them, from 1895 until 1901 or later. The Free State had recruited heavily among the Tetela of the Sankuru, Lomami and Maniema during the Congo Arab war of 1892–1894, in which their leader Ngongo Lutete changed sides and fought for the Free State. In September 1893 Ngongo was executed after a summary court-martial on a charge of treason that many of his followers considered false. In July 1895 the Tetela soldiers of the garrison at Luluabourg (Kananga) rose, killed one of their Belgian officers and marched off; Tetela soldiers from other posts joined them over the following years, and by October 1896 there were some 3,000–4,000 of them in the Kasai, the Lomami and Maniema. In 1897 about 1,300 Tetela and Kusu soldiers of Francis Dhanis’s expedition to the Upper Nile, described as the largest colonial force yet assembled in Africa, rose in the north-east of the Free State over harsh treatment and the execution of some of their chiefs, killed about ten Belgian officers and broke up the expedition, which was meant to claim the Fashoda region before the British and the French; Dhanis spent 1897 and 1898 fighting the rebel bands. On 17 April 1900 the garrison of the Shinkakasa fort, which guarded the river below the capital, Boma, also rose, fired on a ship moored in the river and threatened the town before it was overcome. The last bands, around Lake Kisale in northern Katanga, were defeated in 1901 by some accounts and in 1908 by others. Afterwards the colonial authorities mixed the peoples in every unit of the Force Publique so that no group was a majority. Free State and Belgian writers called the revolts mutinies; they are now counted among the most important anti-colonial revolts in the Congo’s history.
: Trois révoltes de soldats tetela et kusu de l’armée de l’État indépendant du Congo, la Force publique, et la guérilla qui s’ensuivit, de 1895 jusqu’en 1901 ou au-delà. L’État indépendant avait largement recruté parmi les Tetela du Sankuru, du Lomami et du Maniema pendant la guerre congo-arabe de 1892–1894, au cours de laquelle leur chef Ngongo Lutete avait changé de camp et combattu pour l’État indépendant. En septembre 1893, Ngongo fut exécuté à l’issue d’une cour martiale sommaire, sous une accusation de trahison que nombre de ses partisans jugeaient fausse. En juillet 1895, les soldats tetela de la garnison de Luluabourg (Kananga) se soulevèrent, tuèrent l’un de leurs officiers belges et partirent ; des soldats tetela d’autres postes les rejoignirent au cours des années suivantes et, en octobre 1896, ils étaient quelque 3 000 à 4 000 au Kasaï, au Lomami et au Maniema. En 1897, environ 1 300 soldats tetela et kusu de l’expédition de Francis Dhanis vers le haut Nil, décrite comme la plus grande force coloniale jamais rassemblée en Afrique jusque-là, se révoltèrent dans le nord-est de l’État indépendant en raison des mauvais traitements subis et de l’exécution de certains de leurs chefs, tuèrent une dizaine d’officiers belges et disloquèrent l’expédition, qui devait revendiquer la région de Fachoda avant les Britanniques et les Français ; Dhanis passa les années 1897 et 1898 à combattre les bandes rebelles. Le 17 avril 1900, la garnison du fort de Shinkakasa, qui gardait le fleuve en aval de la capitale, Boma, se souleva à son tour, tira sur un navire amarré dans le fleuve et menaça la ville avant d’être maîtrisée. Les dernières bandes, autour du lac Kisale, dans le nord du Katanga, furent vaincues en 1901 selon certains récits, en 1908 selon d’autres. Par la suite, les autorités coloniales mêlèrent les peuples dans chaque unité de la Force publique afin qu’aucun groupe n’y soit majoritaire. Les auteurs de l’État indépendant et les auteurs belges qualifièrent ces révoltes de mutineries ; elles comptent aujourd’hui parmi les plus importantes révoltes anticoloniales de l’histoire du Congo.
