# French translations of the catalogue text (wave 7); step bodies follow later.
Batken conflict: Conflit de Batken
? An incursion by the Islamic Movement of Uzbekistan (IMU), an armed group seeking to overthrow Uzbekistan’s government, into the Batken region of southern Kyrgyzstan. In August 1999 several hundred IMU fighters, based in the mountains of Tajikistan since the end of the Tajik civil war, crossed into Kyrgyzstan, apparently aiming to reach Uzbekistan’s part of the Fergana Valley, and occupied villages in the mountains around Batken. They took hostages, among them a Kyrgyz general, Anarbek Shamkeev, and, on 22–23 August, four Japanese geologists and their interpreter. Kyrgyz troops, with Uzbek air strikes, some of which hit villages in Tajikistan, fought the militants through September; the IMU fighters withdrew to Tajikistan, and the Japanese hostages were freed on 25 October, reportedly after a ransom was paid. Between about 20 and 30 Kyrgyz soldiers were killed; claims of militant losses vary widely. The IMU made a larger incursion into Uzbekistan and Kyrgyzstan in 2000 before many of its fighters moved to Afghanistan.
: Une incursion du Mouvement islamique d’Ouzbékistan (MIO), groupe armé qui cherchait à renverser le gouvernement de l’Ouzbékistan, dans la région de Batken, dans le sud du Kirghizistan. En août 1999, plusieurs centaines de combattants du MIO, installés dans les montagnes du Tadjikistan depuis la fin de la guerre civile tadjike, passèrent au Kirghizistan, apparemment dans le but d’atteindre la partie ouzbèke de la vallée de Ferghana, et occupèrent des villages dans les montagnes autour de Batken. Ils prirent des otages, parmi lesquels un général kirghiz, Anarbek Shamkeev, et, les 22 et 23 août, quatre géologues japonais et leur interprète. Les troupes kirghizes, appuyées par des frappes aériennes ouzbèkes dont certaines touchèrent des villages au Tadjikistan, combattirent les insurgés pendant tout le mois de septembre ; les combattants du MIO se retirèrent au Tadjikistan, et les otages japonais furent libérés le 25 octobre, d’après certaines informations contre le paiement d’une rançon. Entre 20 et 30 soldats kirghiz environ furent tués ; les chiffres avancés pour les pertes des insurgés varient considérablement. Le MIO mena une incursion plus importante en Ouzbékistan et au Kirghizistan en 2000, avant que nombre de ses combattants ne partent pour l’Afghanistan.
