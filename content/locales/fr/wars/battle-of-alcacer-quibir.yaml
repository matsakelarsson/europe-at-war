Battle of the Three Kings (Britannica): Bataille des Trois Rois (Britannica)
? "The defeat of King Sebastian of Portugal in northern Morocco on 4 August 1578, also called the Battle of the Three Kings or, in Morocco, of Wadi al-Makhazin. It grew out of a Saadian succession war: in 1576 Abd al-Malik, with troops from Ottoman Algiers, drove his nephew, the sultan Abu Abdallah Mohammed al-Mutawakkil, from Fez and Marrakesh, and al-Mutawakkil turned to Portugal. Sebastian, young, unmarried and set on a crusade, landed at Asilah with an army of perhaps 17,000–23,000 men, including German, Flemish, Castilian and Italian soldiers, and marched inland. Near Ksar el-Kebir it was surrounded by a much larger Moroccan army, strong in cavalry and firearms, and destroyed; thousands were killed and most of the rest captured. Sebastian and al-Mutawakkil died in the battle, and Abd al-Malik died of illness during it. His brother Ahmad al-Mansur succeeded him and grew rich on the ransoms of Portuguese nobles. Sebastian was childless, and the succession crisis that followed brought Portugal under Philip II of Spain in 1580."
: "La défaite du roi Sébastien de Portugal dans le nord du Maroc, le 4 août 1578, appelée aussi bataille des Trois Rois ou, au Maroc, bataille de l’oued al-Makhazin. Elle naquit d’une guerre de succession saadienne : en 1576, Abd al-Malik, avec des troupes de l’Alger ottomane, chassa de Fès et de Marrakech son neveu, le sultan Abu Abdallah Mohammed al-Mutawakkil, qui se tourna vers le Portugal. Sébastien, jeune, célibataire et résolu à mener une croisade, débarqua à Asilah avec une armée de peut-être 17 000 à 23 000 hommes, dont des soldats allemands, flamands, castillans et italiens, et marcha vers l’intérieur des terres. Près de Ksar el-Kébir, elle fut encerclée par une armée marocaine bien plus nombreuse, forte en cavalerie et en armes à feu, et anéantie ; des milliers d’hommes furent tués et la plupart des autres faits prisonniers. Sébastien et al-Mutawakkil périrent dans la bataille, et Abd al-Malik mourut de maladie au cours de celle-ci. Son frère Ahmad al-Mansur lui succéda et s’enrichit grâce aux rançons des nobles portugais. Sébastien n’avait pas d’enfant, et la crise de succession qui suivit fit passer le Portugal sous l’autorité de Philippe II d’Espagne en 1580."
