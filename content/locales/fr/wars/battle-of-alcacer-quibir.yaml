# Some French text was translated automatically.
"Battle of Alcácer Quibir": "Bataille d’Alcácer Quibir"
"The defeat of King Sebastian of Portugal in northern Morocco on 4 August 1578, also called the Battle of the Three Kings or of Wadi al-Makhazin. The young king had taken up the cause of the deposed Saadi sultan Abu Abdallah Mohammed II against his uncle Abd al-Malik, who had taken the throne with Ottoman help in 1576. Sebastian landed at Asilah with an army of perhaps 17,000–23,000 men, including German, Flemish, Spanish and Italian soldiers, and marched inland. Near Ksar el-Kebir it was surrounded by a much larger Moroccan army, strong in cavalry and firearms, and destroyed; thousands were killed and most of the rest captured. Sebastian and Mohammed II died in the battle, and Abd al-Malik died of illness during it. His brother Ahmad al-Mansur succeeded him and grew rich on the ransoms of Portuguese nobles. Sebastian was childless, and the succession crisis that followed brought Portugal under Philip II of Spain in 1580.": "La défaite du roi Sebastian du Portugal dans le nord du Maroc, le 4 août 1578, a également appelé la bataille des Trois Rois ou de Wadi al-Makhazin. Le jeune roi avait repris la cause de Saadi sultan Abu Abdallah Mohammed II déposé contre son oncle Abd al-Malik, qui avait pris le trône avec l’aide ottomane en 1576. Sebastian débarqua à Asilah avec une armée de quelque 17 000 à 23 000 hommes, y compris des soldats allemands, flamands, espagnols et italiens, et marcha à l’intérieur du pays. Près de Ksar el-Kebir il fut entouré d’une armée marocaine beaucoup plus grande, forte en cavalerie et en armes à feu, et détruit ; des milliers furent tués et la plupart des autres capturés. Son frère Ahmad al-Mansur lui succède et s’enrichit des rançons de nobles portugais. Sebastian était sans enfant, et la crise de succession qui a suivi a amené le Portugal sous Philippe II d’Espagne en 1580."
"Dates are Julian, as usual for the period. The size of the Moroccan army is very uncertain; some accounts give 50,000 or more.": "Les dates sont Julian, comme d’habitude pour la période. La taille de l’armée marocaine est très incertaine ; certains comptes donnent 50 000 ou plus."
"Many Portuguese refused to believe that Sebastian was dead, and several pretenders later claimed to be him. The hope of his return, Sebastianism, lived on in Portuguese popular culture for centuries.": "Beaucoup de Portugais ont refusé de croire que Sebastian était mort, et plusieurs prétendants ont plus tard prétendu être lui. L’espoir de son retour, le Sebastianisme, a vécu dans la culture populaire portugaise pendant des siècles."
