# French translations of the catalogue text (wave 14); step bodies follow later.
Battle of Blair Mountain: Bataille de Blair Mountain
? "The largest armed uprising in the United States since the Civil War, the climax of the West Virginia Mine Wars. Coal operators in Logan and Mingo counties in southern West Virginia kept out the United Mine Workers of America with mine guards, evictions and the Baldwin–Felts Detective Agency, and Logan County’s sheriff, Don Chafin, was paid by the operators to keep organisers out. After the Matewan shootout of May 1920 and martial law in Mingo County, Baldwin–Felts agents shot dead Sid Hatfield, Matewan’s police chief and a hero to the miners, on the courthouse steps at Welch on 1 August 1921. In late August some 10,000 armed miners (estimates run from about 7,000 to 20,000), white, Black and immigrant, many of them First World War veterans wearing red bandanas, gathered at Marmet near Charleston and set out to march through Logan County to Mingo, to free jailed strikers and unionise the southern coalfield. Union officials and Mother Jones tried to stop them. Chafin’s forces, some 3,000 deputies, mine guards, state police and volunteers (one account says more than 5,000), dug in with machine guns along the ridge of Spruce Fork and Blair Mountain, and private aircraft hired by the defenders dropped homemade bombs on the miners. Fighting along the ridge lasted from about 29 August to 2 September. President Warren G. Harding ordered the marchers to disperse and sent some 2,100–2,500 federal troops, with Army Air Service bombers for reconnaissance; when they arrived on 2–3 September, most miners laid down their arms rather than fight the army and went home. The dead were never counted: low estimates are about 20, while the highest give 50 to 100 miners and some 30 defenders. Afterwards 985 miners were indicted for murder, conspiracy and treason against West Virginia; the miners’ leader Bill Blizzard was acquitted of treason in 1922, but union membership in the state collapsed until the New Deal. Blair Mountain was listed on the National Register of Historic Places, and its preservation against surface mining remains contested."
: "Le plus grand soulèvement armé aux États-Unis depuis la guerre de Sécession, point culminant des guerres des mines de Virginie-Occidentale. Dans les comtés de Logan et de Mingo, dans le sud de la Virginie-Occidentale, les exploitants charbonniers tenaient à l’écart les United Mine Workers of America au moyen de gardes miniers, d’expulsions et de l’agence de détectives Baldwin-Felts, et le shérif du comté de Logan, Don Chafin, était payé par les exploitants pour empêcher l’entrée des organisateurs syndicaux. Après la fusillade de Matewan, en mai 1920, et la proclamation de la loi martiale dans le comté de Mingo, des agents de Baldwin-Felts abattirent Sid Hatfield, chef de la police de Matewan et héros des mineurs, sur les marches du palais de justice de Welch le 1er août 1921. À la fin d’août, quelque 10 000 mineurs armés (les estimations vont d’environ 7 000 à 20 000), blancs, noirs et immigrés, dont beaucoup étaient des vétérans de la Première Guerre mondiale portant des bandanas rouges, se rassemblèrent à Marmet, près de Charleston, et se mirent en marche pour traverser le comté de Logan jusqu’à celui de Mingo, afin de libérer des grévistes emprisonnés et de syndiquer le bassin houiller du sud. Des responsables syndicaux et Mother Jones tentèrent de les arrêter. Les forces de Chafin, quelque 3 000 shérifs adjoints, gardes miniers, policiers d’État et volontaires (plus de 5 000 selon un récit), se retranchèrent avec des mitrailleuses le long de la crête de Spruce Fork et de Blair Mountain, et des avions privés loués par les défenseurs larguèrent des bombes artisanales sur les mineurs. Les combats le long de la crête durèrent du 29 août environ au 2 septembre. Le président Warren G. Harding ordonna aux marcheurs de se disperser et envoya quelque 2 100 à 2 500 soldats fédéraux, avec des bombardiers de l’Army Air Service pour la reconnaissance ; lorsqu’ils arrivèrent, les 2 et 3 septembre, la plupart des mineurs déposèrent les armes plutôt que de combattre l’armée et rentrèrent chez eux. Les morts ne furent jamais dénombrés : les estimations basses sont d’environ 20, tandis que les plus hautes font état de 50 à 100 mineurs et de quelque 30 défenseurs. Par la suite, 985 mineurs furent inculpés de meurtre, de complot et de trahison envers la Virginie-Occidentale ; le chef des mineurs Bill Blizzard fut acquitté de trahison en 1922, mais les effectifs syndicaux s’effondrèrent dans l’État jusqu’au New Deal. Blair Mountain a été inscrit au Registre national des lieux historiques, et sa préservation face à l’exploitation minière à ciel ouvert reste contestée."
