# Some French text was translated automatically.
"Battle of Breadfield": "Bataille de Breadfield"
"The defeat of a large Ottoman raiding army in Transylvania by the forces of King Matthias Corvinus. In October 1479 Ottoman akıncı raiders and other troops under Ali Koca Bey, with Wallachian infantry of Basarab the Younger, crossed into southern Transylvania, plundering villages and taking captives. On 13 October the voivode of Transylvania, Stephen Báthory, attacked their camp on the Breadfield (Kenyérmező) near Alkenyér (Șibot) on the Mureș. The Ottomans had the upper hand, and Báthory was nearly captured, until Pál Kinizsi, count of Temes, charged with the heavy cavalry and Serbian horsemen and broke first their left and then their centre. Hungarian, Székely, Saxon, Serbian and Romanian soldiers fought on the Christian side, and losses were heavy on both sides. The victory kept large Ottoman raids out of Transylvania and southern Hungary for years.": "La défaite d’une grande armée ottomane de raids en Transylvanie par les forces du roi Matthias Corvinus. En octobre 1479, les akıncı ottomans et d’autres troupes sous Ali Koca Bey, avec l’infanterie wallachienne de Basarab le Jeune, ont traversé dans le sud de la Transylvanie, pillant des villages et prenant captifs. Le 13 octobre, la voïvode de Transylvanie, Stephen Báthory, attaqua leur camp sur le terrain Breadfield (Kenyérmező) près d’Alkenyér sur le Mureș. Les Ottomans avaient la main haute, et Báthory était presque capturé, jusqu’à Pál Kinizsi, comte de Tèmes, chargé de la cavalerie lourde et des cavaliers serbes et cassé d’abord leur gauche puis leur centre. La victoire a gardé de grands raids ottomans hors de la Transylvanie et du sud de la Hongrie pendant des années."
"Numbers are uncertain. The Ottoman force was probably a large raiding army rather than a full field army; estimates range from under 20,000 to 60,000 or more, against some 12,000–15,000 Christians.": "Les chiffres sont incertains. La force ottomane était probablement une grande armée de raid plutôt qu’une armée de plein champ ; les estimations vont de moins de 20 000 à 60 000 ou plus, contre quelque 12 000–15 000 chrétiens."
