# Some French text was translated automatically.
"Battle of Brunanburh": "Bataille de Brunanburh"
"A battle in 937 in which King Æthelstan of England and his brother Edmund defeated an alliance of Olaf Guthfrithson, king of Dublin, Constantine II of Alba and Owain of Strathclyde, who had joined forces to break Æthelstan’s overlordship of Britain after his invasion of Scotland in 934. A poem in the Anglo-Saxon Chronicle celebrates the slaughter, telling of five young kings and seven of Olaf’s earls killed, as well as Constantine’s son. Olaf fled back to Dublin and Constantine to Scotland, and the victory secured the unity of the English kingdom, although Olaf took York after Æthelstan’s death in 939.": "Une bataille en 937 dans laquelle le roi d’Angleterre et son frère Edmund ont défait une alliance d’Olaf Guthfrithson, roi de Dublin, Constantin II d’Alba et Owain de Strathclyde, qui avait uni leurs forces pour briser l’emprise de la Grande-Bretagne après son invasion de l’Écosse en 934. Un poème dans la Chronique anglo-saxonne célèbre le massacre, racontant cinq jeunes rois et sept des comtes d’Olaf, tués, ainsi que le fils de Constantin. Olaf s’enfuit à Dublin et Constantin en Écosse, et la victoire garantit l’unité du royaume anglais, bien qu’Olaf prit York après la mort d’Ethelstan en 939."
"The site of Brunanburh is unknown and has been argued over for centuries; Bromborough on the Wirral is the identification most widely accepted today, but many other places in northern England and southern Scotland have been proposed.": "Le site de Brunanburh est inconnu et a été défendu pendant des siècles ; Bromborough sur le Wirral est l’identification la plus largement acceptée aujourd'hui, mais beaucoup d’autres endroits dans le nord de l’Angleterre et le sud de l’Écosse ont été proposés."
