# French translations of the catalogue text (wave 11); step bodies follow later.
Battle of Bubat: Bataille de Bubat
? The killing of the king of Sunda and his party at Bubat, a field on the north side of Trowulan, the capital of Majapahit, in 1357. King Hayam Wuruk of Majapahit had asked for the hand of Dyah Pitaloka (Citra Rashmi), daughter of King Linggabuana of Sunda, the kingdom of western Java. The king sailed to Java with his family, nobles and guards, went up the Brantas river and camped at Bubat to await the wedding. There Majapahit’s chief minister, Gajah Mada, demanded that the princess be handed over not as a queen but as a token of Sunda’s submission. The Sundanese refused, and Majapahit troops surrounded the camp. In the fight that followed the king and almost all his party, said to number fewer than a hundred against several thousand, were killed; according to tradition the princess and the other Sundanese women took their own lives. Hayam Wuruk married his cousin instead, and Gajah Mada is said to have lost the king’s favour. Sunda seems to have acknowledged Majapahit’s overlordship for a time and then regained its independence; Linggabuana’s young son Niskala Wastu Kancana, who had stayed at Kawali, cut off relations with Majapahit. The Sundanese remember Linggabuana as Prabu Wangi, and the story is still told in wayang, drama and novels; in 2018 the governors of East Java, West Java and Yogyakarta renamed streets in Surabaya, Bandung and Yogyakarta to mark a reconciliation.
: La mise à mort du roi de Sunda et de sa suite à Bubat, un terrain situé au nord de Trowulan, la capitale de Majapahit, en 1357. Le roi Hayam Wuruk de Majapahit avait demandé la main de Dyah Pitaloka (Citra Rashmi), fille du roi Linggabuana de Sunda, le royaume de Java occidental. Le roi fit voile vers Java avec sa famille, ses nobles et ses gardes, remonta le Brantas et campa à Bubat en attendant les noces. Là, le premier ministre de Majapahit, Gajah Mada, exigea que la princesse soit livrée non comme reine, mais comme gage de la soumission de Sunda. Les Sundanais refusèrent, et les troupes de Majapahit encerclèrent le camp. Dans le combat qui suivit, le roi et presque toute sa suite, moins d’une centaine d’hommes, dit-on, contre plusieurs milliers, furent tués ; selon la tradition, la princesse et les autres femmes sundanaises se donnèrent la mort. Hayam Wuruk épousa à la place sa cousine, et Gajah Mada aurait perdu la faveur du roi. Sunda semble avoir reconnu un temps la suzeraineté de Majapahit, puis avoir recouvré son indépendance ; le jeune fils de Linggabuana, Niskala Wastu Kancana, resté à Kawali, rompit les relations avec Majapahit. Les Sundanais se souviennent de Linggabuana sous le nom de Prabu Wangi, et l’histoire est encore racontée dans le wayang, au théâtre et dans des romans ; en 2018, les gouverneurs de Java oriental, de Java occidental et de Yogyakarta ont rebaptisé des rues à Surabaya, Bandung et Yogyakarta pour marquer une réconciliation.
