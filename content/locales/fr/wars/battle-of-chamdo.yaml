# French translations of the catalogue text (wave 9); step bodies follow later.
Battle of Chamdo: Bataille de Chamdo
? The People’s Liberation Army’s campaign of October 1950 against the Tibetan army at Chamdo, in eastern Tibet, and the incorporation of Tibet into the People’s Republic of China that followed. After failed talks, between 20,000 and 30,000 PLA troops of the 18th Army and a cavalry force from Qinghai crossed the upper Yangtze (Drichu) on 6–7 October 1950 and in less than two weeks surrounded the Tibetan army in Kham; its commander, the governor Ngabo Ngawang Jigme, surrendered with about 2,700 men after Chamdo fell on 19 October. The PLA halted there and offered talks. Tibet’s appeal to the United Nations was shelved, and on 23 May 1951 a Tibetan delegation led by Ngabo signed the Seventeen Point Agreement in Beijing, accepting that Tibet was part of China while keeping the Dalai Lama’s government in place. The Dalai Lama accepted it in October 1951, and the PLA entered Lhasa. The People’s Republic calls these events the “peaceful liberation of Tibet”; the Tibetan government in exile calls them an invasion and the start of an occupation.
: La campagne d’octobre 1950 de l’Armée populaire de libération contre l’armée tibétaine à Chamdo, dans l’est du Tibet, et l’incorporation du Tibet à la République populaire de Chine qui s’ensuivit. Après l’échec de pourparlers, entre 20 000 et 30 000 soldats de la 18e armée de l’APL et une force de cavalerie venue du Qinghai franchirent le haut Yangzi (Drichu) les 6 et 7 octobre 1950 et, en moins de deux semaines, encerclèrent l’armée tibétaine dans le Kham ; son commandant, le gouverneur Ngabo Ngawang Jigme, se rendit avec environ 2 700 hommes après la chute de Chamdo, le 19 octobre. L’APL s’arrêta là et proposa des négociations. L’appel du Tibet aux Nations unies fut ajourné et, le 23 mai 1951, une délégation tibétaine conduite par Ngabo signa à Pékin l’accord en dix-sept points, acceptant que le Tibet fasse partie de la Chine tout en maintenant en place le gouvernement du dalaï-lama. Le dalaï-lama l’accepta en octobre 1951, et l’APL entra à Lhassa. La République populaire appelle ces événements la « libération pacifique du Tibet » ; le gouvernement tibétain en exil les qualifie d’invasion et de début d’une occupation.
