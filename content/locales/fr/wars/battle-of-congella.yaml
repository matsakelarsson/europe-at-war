# French translations of the catalogue text (wave 13); step bodies follow later.
Battle of Congella and the British annexation of Natal: Bataille de Congella et annexion britannique du Natal
? The clash at Port Natal (Durban) that ended the Voortrekker Republic of Natalia. Britain had never accepted the republic the trekkers founded south of the Tugela after their war with Dingane, and a Boer raid on the Bhaca of Ncaphayi in December 1840, which alarmed the Cape government about the frontier, decided it to act. On 4 May 1842 Captain Thomas Charlton Smith arrived at Port Natal with a small force of the 27th (Inniskilling) Regiment and camped there. On the night of 23–24 May he marched out to attack the Boer camp at Congella, on the shore of the bay, and was beaten back by Andries Pretorius’s men with the loss of 16 to 19 killed and two guns. The Boers took the harbour and besieged the British camp. The trader Dick King slipped out with his young servant Ndongeni, who turned back part of the way, and rode some 960 km to Grahamstown in about ten days to call for help; on 26 June 1842 the schooner Conch and the frigate Southampton landed troops under Lieutenant-Colonel Abraham Cloete, who relieved the camp. The Natalia Volksraad submitted in July 1842. Britain proclaimed Natal a British colony on 12 May 1843, and on 8 August 1843 the Volksraad in Pietermaritzburg accepted the terms, with the Drakensberg as Natal’s border; Natal was joined to the Cape in 1844 and became a separate colony in 1856. Most trekker families left over the mountains for the highveld, to the lands that became the Orange Free State and the South African Republic.
: L’affrontement de Port Natal (Durban) qui mit fin à la république voortrekker de Natalia. La Grande-Bretagne n’avait jamais accepté la république que les trekkers avaient fondée au sud de la Tugela après leur guerre contre Dingane, et un raid boer contre les Bhaca de Ncaphayi en décembre 1840, qui inquiéta le gouvernement du Cap pour la frontière, la décida à agir. Le 4 mai 1842, le capitaine Thomas Charlton Smith arriva à Port Natal avec un petit détachement du 27e régiment (Inniskilling) et y établit son camp. Dans la nuit du 23 au 24 mai, il sortit attaquer le camp boer de Congella, au bord de la baie, et fut repoussé par les hommes d’Andries Pretorius, perdant de 16 à 19 tués et deux canons. Les Boers prirent le port et assiégèrent le camp britannique. Le marchand Dick King s’en échappa avec son jeune serviteur Ndongeni, qui fit demi-tour en cours de route, et parcourut à cheval quelque 960 km jusqu’à Grahamstown en une dizaine de jours pour demander du secours ; le 26 juin 1842, la goélette Conch et la frégate Southampton débarquèrent des troupes sous les ordres du lieutenant-colonel Abraham Cloete, qui dégagèrent le camp. Le Volksraad de Natalia se soumit en juillet 1842. La Grande-Bretagne proclama le Natal colonie britannique le 12 mai 1843 et, le 8 août 1843, le Volksraad réuni à Pietermaritzburg en accepta les conditions, le Drakensberg devenant la frontière du Natal ; le Natal fut rattaché au Cap en 1844 et devint une colonie distincte en 1856. La plupart des familles de trekkers repartirent au-delà des montagnes vers le Highveld, sur les terres qui devinrent l’État libre d’Orange et la République sud-africaine.
