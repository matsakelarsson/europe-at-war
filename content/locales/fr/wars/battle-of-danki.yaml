# French translations of the catalogue text (wave 13); step bodies follow later.
Battle of Danki and the breakup of the Jolof Empire: Bataille de Danki et éclatement de l’empire du Djolof
? The war in which Cayor, on the coast of today’s Senegal, threw off the overlordship of the Jolof Empire, which had united the Wolof and Serer kingdoms between the Senegal and the Gambia since the fourteenth century. Jolof had already lost Futa Toro to Koli Tenguella early in the sixteenth century, and the coastal vassals, enriched by the Portuguese trade, had grown stronger than their overlord. When the lamane of Cayor, Dece Fu Njogu Fall, stopped sending tribute, his son Amari Ngoone Sobel Fall, with help from his uncle the teigne of Baol, led an army to the buurba Leele Fuli Fak, lured the Jolof army into an ambush at Lake Danki and killed him. Dece Fu was acclaimed damel, but died during the celebrations, and Amari Ngoone, damel from 1549 to 1593, also became teigne of Baol, the first ruler of both kingdoms, and beat off several Jolof attempts at reconquest. Waalo and Baol left the empire, Sine and Saloum had gone their own way before, and Jolof became an inland kingdom whose buurba kept only prestige. Cayor’s chronicles date Danki to 1549; Britannica dates Cayor’s independence to 1556.
: La guerre par laquelle le Cayor, sur la côte de l’actuel Sénégal, secoua la suzeraineté de l’empire du Djolof, qui unissait depuis le XIVe siècle les royaumes wolof et sérère entre le Sénégal et la Gambie. Le Djolof avait déjà perdu le Fouta-Toro au profit de Koli Tenguella au début du XVIe siècle, et ses vassaux côtiers, enrichis par le commerce portugais, étaient devenus plus forts que leur suzerain. Lorsque le lamane du Cayor, Dece Fu Njogu Fall, cessa de payer le tribut, son fils Amari Ngoone Sobel Fall, aidé de son oncle, le teigne du Baol, mena une armée contre le bourba Leele Fuli Fak, attira l’armée du Djolof dans une embuscade au lac de Danki et tua le bourba. Dece Fu fut acclamé damel, mais mourut pendant les réjouissances, et Amari Ngoone, damel de 1549 à 1593, devint aussi teigne du Baol, premier souverain des deux royaumes, et repoussa plusieurs tentatives de reconquête du Djolof. Le Waalo et le Baol quittèrent l’empire, le Sine et le Saloum s’en étaient déjà détachés, et le Djolof devint un royaume de l’intérieur dont le bourba ne conservait que le prestige. Les chroniques du Cayor datent Danki de 1549 ; Britannica date l’indépendance du Cayor de 1556.
