# French translations of the catalogue text (wave 8); step bodies follow later.
Battle of Diu (1509): Bataille de Diu (1509)
The naval war of 1508–1509 in which Portugal destroyed the fleet that the Mamluk sultan of Egypt, Qansuh al-Ghawri, had sent to India to break the Portuguese hold on the spice trade. Joined at Diu by the ships of Malik Ayaz, governor for the sultan of Gujarat, and supported by Calicut, the Mamluk fleet under Amir Husain al-Kurdi trapped a Portuguese squadron at Chaul in March 1508 and killed its commander Lourenço de Almeida, son of the viceroy. On 3 February 1509 the viceroy Francisco de Almeida took his revenge off Diu, where his carracks’ guns and boarding parties destroyed the Mamluk ships. The victory gave Portugal the mastery of the Arabian Sea for decades.: La guerre navale de 1508–1509 au cours de laquelle le Portugal détruisit la flotte que le sultan mamelouk d’Égypte, Qansuh al-Ghawri, avait envoyée en Inde pour briser l’emprise portugaise sur le commerce des épices. Rejointe à Diu par les navires de Malik Ayaz, gouverneur pour le compte du sultan du Goujarat, et soutenue par Calicut, la flotte mamelouke commandée par Amir Husain al-Kurdi prit au piège une escadre portugaise à Chaul en mars 1508 et tua son commandant, Lourenço de Almeida, fils du vice-roi. Le 3 février 1509, le vice-roi Francisco de Almeida prit sa revanche au large de Diu, où l’artillerie de ses caraques et ses troupes d’abordage détruisirent les navires mamelouks. Cette victoire donna au Portugal la maîtrise de la mer d’Arabie pendant des décennies.
