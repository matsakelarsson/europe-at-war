# Some French text was translated automatically.
"Battle of Djerba": "Bataille de Djerba"
? "A Spanish-led expedition to retake Tripoli, which the corsair Turgut Reis (Dragut) had taken from the Knights of Malta in 1551, that ended in one of the worst Christian defeats at sea of the century. Philip II’s allies, Genoa, the papacy, Naples, Sicily, Florence and the Knights, assembled perhaps 50–60 galleys and many smaller ships under the young Giovanni Andrea Doria and the Duke of Medinaceli, viceroy of Sicily. Delayed by weather and disease, they gave up on Tripoli and in March occupied the island of Djerba, where they built a fort. In May an Ottoman fleet of about 86 galleys and galliots under Piyale Pasha arrived unexpectedly fast and caught the allied ships as they tried to leave, taking or sinking some 27 galleys and many other vessels. The fort, held by Álvaro de Sande with several thousand soldiers and civilians, held out until the Ottomans cut off its water in July; after a last sortie at the end of the month it fell, and thousands were killed or carried off as slaves. A tower of the defenders’ skulls stood on the island until the 19th century. The defeat crippled the Spanish galley fleet for several years."
: "Une expédition dirigée par l’Espagne pour reprendre Tripoli, que le corsair Turgut Reis (Dragut) avait pris aux Chevaliers de Malte en 1551, qui a fini par une des pires défaites chrétiennes en mer du siècle. Les alliés de Philippe II, Gênes, la papauté, Naples, Sicile, Florence et les Chevaliers, assemblèrent peut-être 50 à 60 galères et de nombreux petits navires sous le jeune Giovanni Andrea Doria et le duc de Medinaceli, vice-roi de Sicile. Retardés par la météo et la maladie, ils abandonnèrent sur Tripoli et en mars occupèrent l’île de Djerba, où ils construisirent un fort. Au mois de mai, une flotte ottomane d’environ 86 galères et galiotes sous Piyale Pacha est arrivée rapidement et a pris les navires alliés alors qu’ils essayaient de partir, de prendre ou de couler quelque 27 galères et beaucoup d’autres navires. Le fort, tenu par Álvaro de Sande avec plusieurs milliers de soldats et de civils, a tenu jusqu’à ce que les Ottomans coupent son eau en juillet ; après une dernière sortie à la fin du mois il est tombé, et des milliers ont été tués ou emportés comme esclaves. Une tour des défenseurs : crânes se tenait sur l’île jusqu’au 19ème siècle."
"Dates are Julian. The size of the allied fleet and the numbers killed and captured vary widely between sources; one modern estimate puts the dead at more than 5,000, with about as many taken prisoner.": "Les dates sont Julian. La taille de la flotte alliée et le nombre de tués et capturés varient considérablement d’une source à l’autre ; selon une estimation moderne, les morts sont plus de 5 000, avec environ autant de prisonniers."
"The Ottoman victory was followed by the Great Siege of Malta in 1565, which has its own entry.": "La victoire ottomane a été suivie par le Grand Siège de Malte en 1565, qui a sa propre entrée."
