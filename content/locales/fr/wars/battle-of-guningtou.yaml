# French translations of the catalogue text (wave 9); step bodies follow later.
Battle of Guningtou: Bataille de Guningtou
? A failed amphibious attack by the People’s Liberation Army on Kinmen (Quemoy), the island off Xiamen held by the Republic of China, in the last months of the Chinese Civil War. After taking Xiamen on 17 October 1949, Ye Fei’s 10th Corps sent the first echelon of its 28th Army, over 9,000 men in about 200 fishing boats and junks, across the strait on the night of 24–25 October. They landed along some 10 km of the north-west coast between Longkou and Guningtou, but the boats were stranded by the falling tide and set on fire, and no second wave could follow. The defenders, more than 40,000 men of Li Liangrong’s 22nd Army and of Hu Lien’s 12th Corps, which had just arrived, counter-attacked with M5A1 light tanks, aircraft and naval guns, and by 27 October the landing force had been destroyed. By ROC figures the PLA lost 3,873 killed and 5,175 to 7,364 captured, the higher count including boatmen and porters, while the defenders lost 1,267 killed and 1,982 wounded. It was one of the PLA’s few defeats in the last stage of the civil war; Kinmen stayed in ROC hands, plans to invade Taiwan were set back, and the island became the front line of the Taiwan Strait crises of 1954 and 1958.
: Une attaque amphibie manquée de l’Armée populaire de libération contre Kinmen (Quemoy), l’île située au large de Xiamen et tenue par la République de Chine, dans les derniers mois de la guerre civile chinoise. Après avoir pris Xiamen le 17 octobre 1949, le 10e corps de Ye Fei fit traverser le détroit au premier échelon de sa 28e armée, plus de 9 000 hommes à bord d’environ 200 bateaux de pêche et jonques, dans la nuit du 24 au 25 octobre. Ils débarquèrent sur quelque 10 km de la côte nord-ouest, entre Longkou et Guningtou, mais les bateaux, échoués par la marée descendante, furent incendiés, et aucune seconde vague ne put suivre. Les défenseurs, plus de 40 000 hommes de la 22e armée de Li Liangrong et du 12e corps de Hu Lien, qui venait d’arriver, contre-attaquèrent avec des chars légers M5A1, des avions et l’artillerie navale et, le 27 octobre, la force de débarquement était anéantie. Selon les chiffres de la République de Chine, l’APL perdit 3 873 tués et 5 175 à 7 364 prisonniers, le chiffre le plus élevé incluant les bateliers et les porteurs, tandis que les défenseurs perdirent 1 267 tués et 1 982 blessés. Ce fut l’une des rares défaites de l’APL dans la dernière phase de la guerre civile ; Kinmen resta aux mains de la République de Chine, les projets d’invasion de Taïwan furent retardés, et l’île devint la ligne de front des crises du détroit de Taïwan de 1954 et de 1958.
