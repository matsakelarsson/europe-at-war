# French translations of the catalogue text (wave 7); step bodies follow later.
Battle of Herat (1270): Bataille d’Hérat (1270)
A war between two Mongol khanates over Khorasan. Baraq, khan of the Chagatai ulus in Central Asia, had been forced by his rival Kaidu to share the revenues of Transoxiana, and in 1270, with Kaidu’s encouragement, he invaded the Ilkhanate’s eastern province instead. He beat Abaqa’s brother Tübshin near Herat and at Maruchaq, sacked Nishapur and made the Kartid ruler of Herat, Shams al-Din, pay tribute, but the princes Kaidu had sent with him soon deserted. The Ilkhan Abaqa marched east from Azerbaijan in late April, keeping his presence secret, and on 22 July 1270 met Baraq on the plain near Herat. After a hard fight in which Baraq’s men broke the Ilkhanid left wing, Abaqa’s counter-attacks won the day; Baraq was thrown from his horse and fled to Bukhara. His army broke up, Kaidu took over the Chagatai lands, and Baraq died in 1271. Abaqa’s troops raided across the Oxus and burned Bukhara in 1273, but the river remained the frontier between the Ilkhanate and the Chagatai lands.: Une guerre entre deux khanats mongols pour le Khorassan. Baraq, khan de l’ulus de Djaghataï en Asie centrale, avait été contraint par son rival Kaidu de partager les revenus de la Transoxiane ; en 1270, encouragé par Kaidu, il envahit à la place la province orientale de l’Ilkhanat. Il battit Tübshin, frère d’Abaqa, près d’Hérat et à Maruchaq, pilla Nichapur et contraignit le souverain kartide d’Hérat, Shams al-Din, à lui payer tribut, mais les princes que Kaidu avait envoyés avec lui l’abandonnèrent bientôt. L’ilkhan Abaqa partit d’Azerbaïdjan vers l’est à la fin d’avril, en gardant sa présence secrète, et affronta Baraq le 22 juillet 1270 dans la plaine près d’Hérat. Au terme d’un rude combat au cours duquel les hommes de Baraq enfoncèrent l’aile gauche ilkhanide, les contre-attaques d’Abaqa emportèrent la décision ; Baraq fut désarçonné et s’enfuit à Boukhara. Son armée se désagrégea, Kaidu prit possession des terres de Djaghataï, et Baraq mourut en 1271. Les troupes d’Abaqa lancèrent des raids au-delà de l’Oxus et incendièrent Boukhara en 1273, mais le fleuve resta la frontière entre l’Ilkhanat et les terres de Djaghataï.
