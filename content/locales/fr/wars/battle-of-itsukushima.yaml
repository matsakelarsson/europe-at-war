# French translations of the catalogue text (wave 10); step bodies follow later.
Battle of Itsukushima: Bataille d’Itsukushima
? The surprise attack on the shrine island of Itsukushima (Miyajima) in which Mōri Motonari destroyed the army of Sue Harukata and made the Mōri the leading power of western Japan. In 1551 Sue Harukata, chief retainer of the Ōuchi, rose against his lord Ōuchi Yoshitaka, who took his own life at the temple of Tainei-ji, and ruled the Ōuchi lands from Yamaguchi through a puppet lord, Ōuchi Yoshinaga. Motonari, a lord of Aki who had served the Ōuchi, broke with Sue in 1554 and beat a Sue army at Oshikibata. He then built a small fort, Miyao, on Itsukushima, across the strait from the mainland, as bait. Sue landed on the island with an army put at 20,000 or more and laid siege to the fort. On the night before the battle Motonari, with 4,000 men or perhaps a few thousand more and the help of the Murakami sea lords of the Inland Sea, crossed to the island in a storm and landed behind Sue’s camp at the Tō-no-oka hill, while his son Kobayakawa Takakage brought ships round to attack from the sea. At dawn on 16 October 1555 (the 1st day of the tenth month) they fell on the Sue army from both sides. Sue’s men broke; many drowned trying to reach the mainland, and some 4,700 were killed. Sue escaped from the fort but found no boat and took his own life. Motonari had the bodies taken to the mainland and the island cleansed, since death polluted the sacred ground. In 1557 his advance into Suō and Nagato drove Ōuchi Yoshinaga to take his own life, ending the Ōuchi, and the Mōri went on to rule most of western Honshu.
: L’attaque surprise de l’île-sanctuaire d’Itsukushima (Miyajima), au cours de laquelle Mōri Motonari anéantit l’armée de Sue Harukata et fit des Mōri la principale puissance de l’ouest du Japon. En 1551, Sue Harukata, premier vassal des Ōuchi, se souleva contre son seigneur Ōuchi Yoshitaka, qui se donna la mort au temple Tainei-ji, et gouverna les terres des Ōuchi depuis Yamaguchi par l’intermédiaire d’un seigneur fantoche, Ōuchi Yoshinaga. Motonari, un seigneur d’Aki qui avait servi les Ōuchi, rompit avec Sue en 1554 et battit une armée de Sue à Oshikibata. Il construisit ensuite un petit fort, Miyao, sur Itsukushima, de l’autre côté du détroit qui sépare l’île de la terre ferme, pour servir d’appât. Sue débarqua sur l’île avec une armée estimée à 20 000 hommes ou davantage et assiégea le fort. La nuit précédant la bataille, Motonari, avec 4 000 hommes, ou peut-être quelques milliers de plus, et l’aide des seigneurs de la mer Murakami de la mer intérieure de Seto, passa sur l’île en pleine tempête et débarqua derrière le camp de Sue, sur la colline de Tō-no-oka, tandis que son fils Kobayakawa Takakage amenait des navires en contournant l’île pour attaquer depuis la mer. À l’aube du 16 octobre 1555 (le 1er jour du dixième mois), ils tombèrent sur l’armée de Sue des deux côtés. Les hommes de Sue cédèrent ; beaucoup se noyèrent en tentant de regagner la terre ferme, et quelque 4 700 furent tués. Sue s’échappa du fort mais ne trouva aucune embarcation et se donna la mort. Motonari fit transporter les corps sur la terre ferme et purifier l’île, car la mort souillait le sol sacré. En 1557, son avancée dans les provinces de Suō et de Nagato poussa Ōuchi Yoshinaga à se donner la mort, ce qui mit fin aux Ōuchi, et les Mōri finirent par gouverner la plus grande partie de l’ouest de Honshu.
