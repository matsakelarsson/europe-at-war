# French translations of the catalogue text (wave 13); step bodies follow later.
Battle of Kansala: Bataille de Kansala
? The siege and destruction of Kansala, the capital of Kaabu, by the army of the Imamate of Futa Jallon and the Fula of Kaabu who had risen under Alfa Molo, remembered by the Mandinka as Turban Keloo, the war of annihilation. Kaabu, a federation of Mandinka kingdoms that had begun as a western province of the Mali Empire, had ruled the lands between the Gambia river and the Geba for three centuries and grown rich on the slave trade. In the 19th century it was weakened by the end of that trade, by the jihad of Futa Jallon to the south, and by the revolt of the Fula herders who lived among its Mandinka nobility, the Nyancho. In 1867, by the usual dating, Futa Jallon’s army and Alfa Molo’s Fula besieged Kansala; after an assault that lasted, by tradition, eleven days, Mansaba Janke Waali Sanneh opened the gates and had his sons fire the town’s powder stores, killing the defenders and many of the attackers. Kaabu ceased to exist as a power, Futa Jallon carried off thousands of captives, and Alfa Molo founded the kingdom of Fuladu in its eastern lands. The battle is told mainly by griots, and some historians think tradition has enlarged or merged it with earlier fighting.
: Le siège et la destruction de Kansala, capitale du Kaabu, par l’armée de l’imamat du Fouta-Djalon et les Peuls du Kaabu soulevés sous la conduite d’Alfa Molo, événement dont les Mandingues gardent le souvenir sous le nom de Turban Keloo, la guerre d’anéantissement. Le Kaabu, fédération de royaumes mandingues née d’une province occidentale de l’empire du Mali, dominait depuis trois siècles les terres comprises entre le fleuve Gambie et le Geba, et s’était enrichi grâce à la traite des esclaves. Au XIXe siècle, il fut affaibli par la fin de cette traite, par le djihad du Fouta-Djalon au sud et par la révolte des éleveurs peuls qui vivaient parmi sa noblesse mandingue, les Nyancho. En 1867, selon la datation habituelle, l’armée du Fouta-Djalon et les Peuls d’Alfa Molo assiégèrent Kansala ; après un assaut qui dura, selon la tradition, onze jours, le mansaba Janke Waali Sanneh ouvrit les portes et fit mettre le feu par ses fils aux réserves de poudre de la ville, tuant les défenseurs et beaucoup d’assaillants. Le Kaabu cessa d’exister en tant que puissance, le Fouta-Djalon emmena des milliers de captifs, et Alfa Molo fonda le royaume du Fouladou sur ses terres orientales. La bataille est surtout connue par les récits des griots, et certains historiens pensent que la tradition l’a amplifiée ou confondue avec des combats antérieurs.
