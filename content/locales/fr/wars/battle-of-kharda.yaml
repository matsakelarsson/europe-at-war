# French translations of the catalogue text (wave 8); step bodies follow later.
Battle of Kharda: Bataille de Kharda
? The last campaign in which all the Maratha chiefs fought together under the Peshwa’s government at Pune (Poona). The Nizam of Hyderabad, Nizam Ali Khan, owed the Marathas arrears of chauth (a share of revenue) and refused to pay, and his minister Azim-ul-Umara insulted the Peshwa’s envoys. Under the direction of Nana Phadnavis, the armies of the Peshwa, Daulat Rao Scindia, Tukoji Holkar and Raghuji Bhonsle of Nagpur, led in the field by Parashuram Bhau Patwardhan, met the Nizam’s army near Kharda, south-east of Ahmednagar, on 11 March 1795. After a short fight, in which a Scindia counter-attack drove back the French-trained infantry of Michel Raymond, the Nizam took refuge in the small fort of Kharda, where the Marathas cut off his supplies. After some three weeks of hunger and thirst he came to terms. He ceded lands including the fortress of Daulatabad, promised a large indemnity and surrendered Azim-ul-Umara, who was held at Pune. The British, although the Nizam’s allies, did not intervene, and he responded by enlarging Raymond’s French-officered corps. Most of what he lost was returned in 1796, when Nana Phadnavis needed his support in the succession crisis that followed the death of the young Peshwa Sawai Madhavrao in October 1795.
: La dernière campagne au cours de laquelle tous les chefs marathes combattirent ensemble sous l’autorité du gouvernement du peshwa à Pune (Poona). Le nizam d’Hyderabad, Nizam Ali Khan, devait aux Marathes des arriérés de chauth (une part des revenus fiscaux) et refusait de payer, et son ministre Azim-ul-Umara insulta les envoyés du peshwa. Sous la direction de Nana Phadnavis, les armées du peshwa, de Daulat Rao Scindia, de Tukoji Holkar et de Raghuji Bhonsle de Nagpur, commandées sur le terrain par Parashuram Bhau Patwardhan, affrontèrent l’armée du nizam près de Kharda, au sud-est d’Ahmednagar, le 11 mars 1795. Après un bref combat, au cours duquel une contre-attaque de Scindia repoussa l’infanterie de Michel Raymond, formée à la française, le nizam se réfugia dans le petit fort de Kharda, où les Marathes coupèrent ses approvisionnements. Après quelque trois semaines de faim et de soif, il accepta de traiter. Il céda des territoires, dont la forteresse de Daulatabad, promit une lourde indemnité et livra Azim-ul-Umara, qui fut détenu à Pune. Les Britanniques, bien qu’alliés du nizam, n’intervinrent pas, et celui-ci répliqua en agrandissant le corps de Raymond, encadré par des officiers français. La plus grande partie de ce qu’il avait perdu lui fut rendue en 1796, lorsque Nana Phadnavis eut besoin de son soutien dans la crise de succession qui suivit la mort du jeune peshwa Sawai Madhavrao en octobre 1795.
