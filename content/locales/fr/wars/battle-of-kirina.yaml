# French translations of the catalogue text (wave 12); step bodies follow later.
Battle of Kirina: Bataille de Kirina
The war in which Sunjata (Sundiata) Keita and a coalition of Mande chiefdoms overthrew Sumaoro (Sumanguru) Kante, king of Sosso, in about 1235, the founding event of the Mali Empire. Sumaoro had made the Mande chiefdoms of the upper Niger his tributaries. According to the epic of Sunjata, the young prince, who had grown up in exile in Mema, was called home by the Mande chiefs, gathered allies at Sibi and, after two indecisive battles, defeated Sumaoro at Kirina, near the Niger south-west of today’s Bamako. Sumaoro fled north into the hills of Koulikoro and disappeared, and the Sosso capital was razed. The battle is known almost entirely from oral tradition, which mixes history with sorcery and spirit powers; the only early written source, Ibn Khaldun, says just that Mari Jata (Sunjata) overcame the Susu and took their kingdom.: La guerre au cours de laquelle Soundiata (Sunjata) Keïta et une coalition de chefferies mandingues renversèrent Soumaoro (Soumangourou) Kanté, roi du Sosso, vers 1235, événement fondateur de l’empire du Mali. Soumaoro avait fait des chefferies mandingues du haut Niger ses tributaires. Selon l’épopée de Soundiata, le jeune prince, qui avait grandi en exil à Mema, fut rappelé par les chefs mandingues, rassembla des alliés à Sibi et, après deux batailles indécises, vainquit Soumaoro à Kirina, près du Niger, au sud-ouest de ce qui est aujourd’hui Bamako. Soumaoro s’enfuit vers le nord dans les collines de Koulikoro et disparut, et la capitale du Sosso fut rasée. La bataille n’est guère connue que par la tradition orale, qui mêle l’histoire à la sorcellerie et aux pouvoirs des esprits ; la seule source écrite ancienne, Ibn Khaldoun, dit seulement que Mari Jata (Soundiata) vainquit les Susu et s’empara de leur royaume.
