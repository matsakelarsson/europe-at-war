# Some French text was translated automatically.
"Second Battle of Kosovo": "Deuxième bataille du Kosovo"
"A three-day battle on the Field of Blackbirds in Kosovo, where Sultan Murad II defeated a Hungarian-led army under the regent John Hunyadi on the same ground as the battle of 1389. Seeking revenge for Varna, Hunyadi crossed the Danube in September 1448 with Hungarians, Wallachians and German and Bohemian mercenaries, hoping to join Skanderbeg’s Albanians, who were held up on the way; the Serbian despot Đurađ Branković, bound by his truce with the Ottomans, refused to join. Fighting from a wagon fort from 17 October, Hunyadi’s army was worn down by the larger Ottoman army, in which the young Mehmed fought his first battle; on the third day the Wallachians went over to the sultan, by some accounts, and the rest of the army was destroyed. Hunyadi escaped but was held prisoner by Branković until he paid a ransom. It was the last great Hungarian offensive into the Balkans for decades.": "Une bataille de trois jours sur le champ des Blackbirds au Kosovo, où le sultan Murad II a vaincu une armée dirigée par la Hongrie sous le régent John Hunyadi sur le même terrain que la bataille de 1389. Cherchant à se venger de Varna, Hunyadi a traversé le Danube en septembre 1448 avec des Hongrois, des Wallachiens et des mercenaires allemands et bohèmes, espérant rejoindre les Albanais de Skanderbeg, qui ont été retenus sur le chemin ; les Serbes du Despote de Branković, liés par sa trêve avec les Ottomans, refusèrent de s’y joindre. Le 17 octobre, l’armée de Hunyadi a été épuisée par la plus grande armée ottomane, dans laquelle le jeune Mehmed a combattu sa première bataille ; le troisième jour, les Wallachiens sont passés au sultan, selon certains récits, et le reste de l’armée a été détruit. C’est la dernière grande offensive hongroise dans les Balkans depuis des décennies."
"Numbers are uncertain; modern estimates give the crusaders about 22,000–30,000 men and the Ottomans perhaps 40,000–60,000. Some historians doubt that the Wallachians really changed sides.": "Les chiffres sont incertains ; les estimations modernes donnent aux croisés environ 22 000 à 30 000 hommes et aux Ottomans environ 40 000 à 60 000. Certains historiens doutent que les Wallachiens aient vraiment changé de camp."
