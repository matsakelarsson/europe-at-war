# French translations of the catalogue text (wave 9); step bodies follow later.
Battle of Lake Khasan: Bataille du lac Khassan
? A border battle between the Soviet Union and Japan over two hills west of Lake Khasan, where the borders of the Soviet Maritime Province, Japanese-ruled Korea and Manchukuo met near the mouth of the Tumen River, about 120 km south-west of Vladivostok. In July 1938 Soviet border guards fortified Zaozernaya hill (Changkufeng to the Japanese), which Japan and Manchukuo said lay on their side of a boundary drawn in the Russo-Chinese treaties of 1860 and 1886. After a clash at the neighbouring Bezymyannaya hill on 29 July, troops of the Japanese 19th Division from Korea under Lieutenant General Suetaka Kamezō took both hills in a night attack on 31 July. The Soviet 39th Rifle Corps under Grigory Shtern, with Vasily Blyukher in overall command, counter-attacked from 2 August with infantry, tanks and aircraft over marshy ground, at heavy cost, and retook most of the heights. After talks in Moscow between the Soviet foreign commissar Maxim Litvinov and the Japanese ambassador Shigemitsu Mamoru, fighting stopped at 13:30 local time on 11 August, with Soviet troops on the heights and the border where the Soviet Union claimed it. Russian figures give 792 Soviet dead and missing and 3,279 wounded and sick; Japanese records give 526 dead and missing and 913 wounded, while Soviet sources claimed about 3,000 Japanese killed. Blyukher, blamed for the losses, was arrested in October and died in custody in November 1938. The Kwantung Army fought the Soviet Union again, on a larger scale, at Khalkhin Gol in 1939.
: Une bataille frontalière entre l’Union soviétique et le Japon pour deux collines à l’ouest du lac Khassan, là où les frontières de la province maritime soviétique, de la Corée sous domination japonaise et du Mandchoukouo se rejoignaient près de l’embouchure du Tumen, à environ 120 km au sud-ouest de Vladivostok. En juillet 1938, des gardes-frontières soviétiques fortifièrent la colline de Zaozernaïa (Changkufeng pour les Japonais), dont le Japon et le Mandchoukouo affirmaient qu’elle se trouvait de leur côté d’une frontière tracée par les traités russo-chinois de 1860 et de 1886. Après un accrochage sur la colline voisine de Bezymiannaïa le 29 juillet, des troupes de la 19e division japonaise venues de Corée, commandées par le lieutenant-général Suetaka Kamezō, prirent les deux collines lors d’une attaque de nuit le 31 juillet. Le 39e corps de fusiliers soviétique de Grigori Stern, sous le commandement général de Vassili Blücher, contre-attaqua à partir du 2 août avec de l’infanterie, des chars et des avions sur un terrain marécageux, au prix de lourdes pertes, et reprit la plupart des hauteurs. Après des pourparlers à Moscou entre le commissaire soviétique aux Affaires étrangères Maxime Litvinov et l’ambassadeur japonais Shigemitsu Mamoru, les combats cessèrent le 11 août à 13 h 30, heure locale, les troupes soviétiques tenant les hauteurs et la frontière restant là où l’Union soviétique la revendiquait. Les chiffres russes font état de 792 morts et disparus et de 3 279 blessés et malades soviétiques ; les archives japonaises indiquent 526 morts et disparus et 913 blessés, tandis que les sources soviétiques affirmaient qu’environ 3 000 Japonais avaient été tués. Blücher, tenu pour responsable des pertes, fut arrêté en octobre et mourut en détention en novembre 1938. L’armée du Kwantung affronta de nouveau l’Union soviétique, à plus grande échelle, à Khalkhin Gol en 1939.
