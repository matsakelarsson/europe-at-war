# French translations of the catalogue text (wave 11); step bodies follow later.
Battle of Mactan: Bataille de Mactan
? The battle on the island of Mactan, off Cebu, in which the warriors of the datu Lapulapu defeated a landing party of Ferdinand Magellan’s Spanish expedition and killed Magellan. The expedition, sailing west to reach the Spice Islands, arrived among the Visayan islands in March 1521. At Cebu, Rajah Humabon made an alliance with Magellan and was baptised with his queen and many of his people, and Magellan required the neighbouring chiefs to submit to Humabon and to the King of Spain. On Mactan one of the two chiefs, Zula, sent gifts, but Lapulapu refused to submit or pay tribute. Before dawn on 27 April Magellan crossed to Mactan with about 60 Spaniards and 20 to 30 boats of Humabon’s warriors, whom he told to stay back and watch. Because of the reef the boats could not come near the shore, and Magellan waded in with 49 armoured men; the guns firing from the boats were out of range. Lapulapu’s men, about 1,500 according to the chronicler Antonio Pigafetta, attacked from the front and both flanks with arrows, bamboo spears and swords, aiming at the soldiers’ unprotected legs. Magellan burned some houses, was wounded in the leg and the arm and was killed in the shallows while covering the retreat. Pigafetta counted eight Spaniards and four baptised Cebuanos dead, and fifteen of the Mactan warriors. A few days later Humabon turned on his guests and had some two dozen of them killed at a feast, and the survivors sailed on; under Juan Sebastián Elcano one ship completed the first voyage around the world in 1522. Spain returned to the islands with Legazpi in 1565. In the Philippines Lapulapu is honoured as the first to resist foreign rule, and 27 April is Lapulapu Day.
: La bataille livrée sur l’île de Mactan, au large de Cebu, au cours de laquelle les guerriers du datu Lapulapu vainquirent un détachement de débarquement de l’expédition espagnole de Fernand de Magellan et tuèrent Magellan. L’expédition, qui faisait route vers l’ouest pour atteindre les îles aux Épices, arriva parmi les îles Visayas en mars 1521. À Cebu, le rajah Humabon s’allia à Magellan et fut baptisé avec sa reine et une grande partie de son peuple, et Magellan exigea des chefs voisins qu’ils se soumettent à Humabon et au roi d’Espagne. À Mactan, l’un des deux chefs, Zula, envoya des présents, mais Lapulapu refusa de se soumettre et de payer tribut. Avant l’aube du 27 avril, Magellan passa à Mactan avec une soixantaine d’Espagnols et 20 à 30 embarcations de guerriers de Humabon, auxquels il ordonna de rester en retrait et de regarder. À cause du récif, les embarcations ne purent approcher du rivage, et Magellan s’avança dans l’eau avec 49 hommes en armure ; les canons qui tiraient depuis les embarcations étaient hors de portée. Les hommes de Lapulapu, environ 1 500 selon le chroniqueur Antonio Pigafetta, attaquèrent de front et sur les deux flancs avec des flèches, des lances de bambou et des épées, en visant les jambes non protégées des soldats. Magellan incendia quelques maisons, fut blessé à la jambe et au bras et fut tué dans les hauts-fonds alors qu’il couvrait la retraite. Pigafetta compta huit Espagnols et quatre Cébuanos baptisés morts, et quinze guerriers de Mactan. Quelques jours plus tard, Humabon se retourna contre ses hôtes et en fit tuer deux douzaines environ lors d’un festin, et les survivants reprirent la mer ; sous le commandement de Juan Sebastián Elcano, un navire acheva en 1522 le premier tour du monde. L’Espagne revint dans l’archipel avec Legazpi en 1565. Aux Philippines, Lapulapu est honoré comme le premier à avoir résisté à la domination étrangère, et le 27 avril est le jour de Lapulapu.
