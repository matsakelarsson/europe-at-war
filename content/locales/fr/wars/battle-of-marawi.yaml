# French translations of the catalogue text (wave 11); step bodies follow later.
Battle of Marawi: Bataille de Marawi
? "The five-month battle for the city of Marawi in Lanao del Sur, on the southern Philippine island of Mindanao, between the Philippine armed forces and fighters allied to the Islamic State, led by the Maute group and the Abu Sayyaf leader Isnilon Hapilon. A raid to capture Hapilon on 23 May 2017 met far stronger resistance than expected: several hundred fighters, among them foreigners from Indonesia, Malaysia and the Middle East, seized much of the city, took hostages and raised the black flag of the Islamic State, and President Rodrigo Duterte declared martial law over all of Mindanao the same night. Almost the whole population of about 200,000 fled. The army, supported by air strikes and American and Australian surveillance, retook the city street by street; Hapilon and Omar Maute were killed on 16 October, Duterte declared Marawi liberated the next day, and the fighting ended on 23 October. By official figures 168 soldiers and police, 87 civilians and about 978 militants died, and the centre of the city was destroyed. It was the longest urban battle in the Philippines since the Second World War."
: "La bataille de cinq mois pour la ville de Marawi, dans le Lanao del Sur, sur l’île de Mindanao, dans le sud des Philippines, entre les forces armées philippines et des combattants alliés à l’État islamique, dirigés par le groupe Maute et par le chef d’Abu Sayyaf Isnilon Hapilon. Un raid visant à capturer Hapilon le 23 mai 2017 se heurta à une résistance bien plus forte que prévu : plusieurs centaines de combattants, parmi lesquels des étrangers venus d’Indonésie, de Malaisie et du Moyen-Orient, s’emparèrent d’une grande partie de la ville, prirent des otages et hissèrent le drapeau noir de l’État islamique, et le président Rodrigo Duterte proclama la loi martiale sur l’ensemble de Mindanao le soir même. La quasi-totalité des quelque 200 000 habitants s’enfuit. L’armée, appuyée par des frappes aériennes et par la surveillance américaine et australienne, reprit la ville rue par rue ; Hapilon et Omar Maute furent tués le 16 octobre, Duterte déclara Marawi libérée le lendemain, et les combats prirent fin le 23 octobre. Selon les chiffres officiels, 168 soldats et policiers, 87 civils et environ 978 insurgés moururent, et le centre de la ville fut détruit. Ce fut la plus longue bataille urbaine aux Philippines depuis la Seconde Guerre mondiale."
