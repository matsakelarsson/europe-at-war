# Some French text was translated automatically.
"Battle of Morgarten": "Bataille de Morgarten"
"The first great victory of the Swiss Confederates over the Habsburgs. After men of Schwyz raided the Habsburg-protected abbey of Einsiedeln in January 1314, and with the Forest Cantons backing Louis the Bavarian against the Habsburg Frederick the Fair in the disputed royal election of that year, Duke Leopold I of Austria marched on Schwyz. On 15 November 1315 men of Schwyz, Uri and Unterwalden ambushed his column of knights on the narrow path between Lake Ägeri and Sattel, killing many and driving others into the lake. Less than a month later the three cantons renewed their alliance in the Pact of Brunnen.": "La première grande victoire des Confédérés suisses sur les Habsbourg. Après que les hommes de Schwyz ont attaqué l’abbaye d’Einsiedeln protégée par les Habsbourg en janvier 1314, et avec les cantons forestiers soutenant Louis le Bavarois contre les Habsburg Frederick la Foire lors de l’élection royale contestée de cette année-là, le duc Léopold Ier d’Autriche a marché sur Schwyz. Le 15 novembre 1315, des hommes de Schwyz, d’Uri et d’Unterwalden ont embusqué sa colonne de chevaliers sur l’étroit chemin entre le lac Ägeri et Sattel, tuant beaucoup et conduisant d’autres dans le lac. Moins d’un mois plus tard, les trois cantons ont renouvelé leur alliance dans le Pacte de Brunnen."
"The size of both armies is unknown; Leopold’s has been put at anything from 2,000–3,000 to 20,000, and the Confederates at 1,500 to 4,000. Much of the familiar story, including the warning that the lords of Hünenberg are said to have sent over the border on arrows, comes from chronicles written a century later.": "La taille des deux armées est inconnue ; Léopold's a été mis à quelque chose de 2 000-3 000 à 20 000, et les Confédérés de 1 500 à 4 000. Une grande partie de l’histoire familière, y compris l’avertissement que les seigneurs de Hünenberg auraient envoyé par-dessus la frontière sur des flèches, vient de chroniques écrites un siècle plus tard."
"The quarrel with Einsiedeln over pastures and forest (the Marchenstreit) had gone on for generations. The Pact of Brunnen was sealed on 9 December 1315, and a truce with the Habsburgs followed in 1318.": "La querelle avec Einsiedeln sur les pâturages et la forêt (le Marchenstreit) avait duré des générations. Le Pacte de Brunnen fut scellé le 9 décembre 1315, et une trêve avec les Habsbourg suivit en 1318."
