# French translations of the catalogue text (wave 10); step bodies follow later.
Battle of Okehazama: Bataille d’Okehazama
? The battle in which Oda Nobunaga, a young lord of Owari, killed Imagawa Yoshimoto and broke the strongest house of the Tōkaidō. Yoshimoto, who ruled Suruga, Tōtōmi and Mikawa, marched west into Owari in 1560 with an army of about 25,000; whether he meant to go on to Kyoto or only to secure the border is debated. His vanguard took the Oda border forts of Washizu and Marune, the second stormed by the young Matsudaira Motoyasu, the later Tokugawa Ieyasu, who served the Imagawa. Nobunaga could raise perhaps 2,000 to 3,000 men. He rode out from Kiyosu by way of the Atsuta shrine to the fort at Zenshō-ji, left banners there to suggest a larger force, and moved against Yoshimoto’s headquarters, which had halted in the narrow valley of Dengaku-hazama near the village of Okehazama. Under cover of a sudden thunderstorm the Oda troops fell on the Imagawa headquarters on 12 June 1560 (the 19th day of the fifth month of Eiroku 3). Yoshimoto was killed in the fight by two Oda samurai, Hattori Koheita and Mōri Shinsuke (accounts differ on which of them struck him down), and most of his commanders died with him. The traditional account has the Oda swing round through the hills to strike from the flank; many historians now think Nobunaga attacked head on. The Imagawa never recovered. Motoyasu went home to Okazaki, made himself independent and in 1562 allied with Nobunaga, and Nobunaga, secure in the east, turned to the conquest of Mino.
: La bataille au cours de laquelle Oda Nobunaga, jeune seigneur d’Owari, tua Imagawa Yoshimoto et brisa la plus puissante maison du Tōkaidō. Yoshimoto, qui gouvernait les provinces de Suruga, de Tōtōmi et de Mikawa, marcha vers l’ouest et entra en Owari en 1560 avec une armée d’environ 25 000 hommes ; on débat de la question de savoir s’il entendait pousser jusqu’à Kyoto ou seulement assurer sa frontière. Son avant-garde prit les forts frontaliers des Oda à Washizu et à Marune, le second enlevé d’assaut par le jeune Matsudaira Motoyasu, le futur Tokugawa Ieyasu, alors au service des Imagawa. Nobunaga pouvait réunir peut-être 2 000 à 3 000 hommes. Il partit à cheval de Kiyosu, gagna par le sanctuaire d’Atsuta le fort de Zenshō-ji, y laissa des bannières pour faire croire à une force plus nombreuse et marcha sur le quartier général de Yoshimoto, qui avait fait halte dans l’étroite vallée de Dengaku-hazama, près du village d’Okehazama. À la faveur d’un orage soudain, les troupes des Oda tombèrent sur le quartier général des Imagawa le 12 juin 1560 (le 19e jour du cinquième mois de la 3e année de l’ère Eiroku). Yoshimoto fut tué dans le combat par deux samouraïs des Oda, Hattori Koheita et Mōri Shinsuke (les récits divergent sur celui des deux qui l’abattit), et la plupart de ses commandants périrent avec lui. Selon le récit traditionnel, les Oda contournèrent l’ennemi par les collines pour le frapper de flanc ; beaucoup d’historiens pensent aujourd’hui que Nobunaga attaqua de front. Les Imagawa ne s’en relevèrent jamais. Motoyasu rentra à Okazaki, se rendit indépendant et s’allia en 1562 à Nobunaga, qui, désormais tranquille à l’est, se tourna vers la conquête de la province de Mino.
