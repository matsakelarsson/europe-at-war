# French translations of the catalogue text (wave 7); step bodies follow later.
Qara Khitai–Seljuk war and the Battle of Qatwan: Guerre entre Qara Khitaï et Seldjoukides et bataille de Qatwan
The war in which the Qara Khitai, Khitans from northern China who had moved west after the fall of their Liao empire, took Transoxiana from the Seljuk sultan Ahmad Sanjar and his Karakhanid vassals. After beating the Karakhanid khan near Khujand in 1137, the Qara Khitai ruler Yelü Dashi destroyed Sanjar’s army on the Qatwan steppe north of Samarkand on 9 September 1141. Transoxiana passed under the overlordship of a non-Muslim empire for the next seventy years, the Khwarazmshah Atsiz plundered Merv, and the Seljuk empire in the east began to decline.: La guerre au cours de laquelle les Qara Khitaï, des Khitans du nord de la Chine partis vers l’ouest après la chute de leur empire Liao, enlevèrent la Transoxiane au sultan seldjoukide Ahmad Sanjar et à ses vassaux karakhanides. Après avoir battu le khan karakhanide près de Khodjent en 1137, le souverain des Qara Khitaï, Yelü Dashi, anéantit l’armée de Sanjar dans la steppe de Qatwan, au nord de Samarcande, le 9 septembre 1141. La Transoxiane passa pour soixante-dix ans sous la suzeraineté d’un empire non musulman, le shah du Khwarezm Atsiz pilla Merv, et l’empire seldjoukide commença à décliner à l’est.
