# Some French text was translated automatically.
"Battle of Stiklestad": "Bataille de Stiklestad"
"The battle in which King Olaf Haraldsson, driven out of Norway in 1028 when Cnut the Great took the country, was killed on 29 July 1030 trying to win back his throne with an army raised in Sweden. He was defeated in the Verdal valley north of Trondheim by a peasant army led by Norwegian chieftains loyal to Cnut. Within a year Olaf was revered as a saint, and harsh Danish rule soon turned Norwegians against Cnut; Olaf’s son Magnus took the throne in 1035.": "La bataille au cours de laquelle le roi Olaf Haraldsson, chassé de Norvège en 1028 quand Cnut le Grand prit le pays, fut tué le 29 juillet 1030 en essayant de reconquérir son trône avec une armée élevée en Suède. Il fut battu dans la vallée du Verdal au nord de Trondheim par une armée paysanne dirigée par des chefs norvégiens fidèles à Cnut. En moins d’un an, Olaf fut vénéré comme un saint, et la dure domination danoise tourna bientôt les Norvégiens contre Cnut ; le fils d’Olafs Magnus prit le trône en 1035."
"The traditional date of 29 July comes from Snorri Sturluson’s saga, written about 200 years later. The sagas also describe a solar eclipse during the battle, but the eclipse visible in Norway in 1030 fell on 31 August, so the exact date is uncertain.": "La date traditionnelle du 29 juillet vient de la saga Snorri Sturluson, écrite environ 200 ans plus tard. Les sagas décrivent également une éclipse solaire pendant la bataille, mais l’éclipse visible en Norvège en 1030 est tombée le 31 août, donc la date exacte est incertaine."
"Olaf was declared a saint by the bishop of Nidaros in 1031. His shrine in Trondheim made Nidaros a pilgrimage centre, and Olsok, 29 July, is still kept in Norway.": "Olaf a été déclaré saint par l’évêque de Nidaros en 1031. Son sanctuaire à Trondheim fait de Nidaros un centre de pèlerinage, et Olsok, 29 juillet, est toujours gardé en Norvège."
