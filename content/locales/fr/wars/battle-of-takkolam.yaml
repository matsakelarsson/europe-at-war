# French translations of the catalogue text (wave 8); step bodies follow later.
Battle of Takkolam: Bataille de Takkolam
The battle in which the Rashtrakuta emperor Krishna III defeated the army of the Chola king Parantaka I near Takkolam, in today’s Ranipet district of Tamil Nadu, in 949. Krishna III invaded the Chola country with his brother-in-law and vassal, the Western Ganga king Butuga II. The Chola army was led by the crown prince Rajaditya, who was killed on his war elephant; a Ganga inscription at Atakur says that Butuga shot him with an arrow, and the Cholas remembered him as the prince “who died on the elephant”. The Chola army broke, and the Rashtrakutas took Tondaimandalam, the northern Chola lands around Kanchipuram, which they held for about twenty years. Krishna III took the title “who took Kanchi and Tanjore”, and his inscriptions claim that he advanced as far as Rameswaram. The defeat set the Cholas back for a generation, until the rise of Rajaraja I after 985.: La bataille au cours de laquelle l’empereur rashtrakuta Krishna III vainquit l’armée du roi chola Parantaka Ier près de Takkolam, dans l’actuel district de Ranipet, au Tamil Nadu, en 949. Krishna III envahit le pays chola avec son beau-frère et vassal Butuga II, roi des Ganga occidentaux. L’armée chola était commandée par le prince héritier Rajaditya, qui fut tué sur son éléphant de guerre ; une inscription ganga d’Atakur affirme que Butuga l’abattit d’une flèche, et les Chola gardèrent le souvenir du prince « mort sur l’éléphant ». L’armée chola se débanda, et les Rashtrakuta prirent le Tondaimandalam, les terres chola du nord autour de Kanchipuram, qu’ils conservèrent une vingtaine d’années. Krishna III prit le titre de « celui qui prit Kanchi et Tanjore », et ses inscriptions affirment qu’il s’avança jusqu’à Rameswaram. Cette défaite fit reculer les Chola pour une génération, jusqu’à l’essor de Rajaraja Ier après 985.
