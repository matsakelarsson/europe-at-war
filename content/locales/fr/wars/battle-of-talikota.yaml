# French translations of the catalogue text (wave 8); step bodies follow later.
Battle of Talikota: Bataille de Talikota
The battle in which an alliance of four Deccan sultanates, Bijapur, Ahmadnagar, Golconda and Bidar, defeated the army of the Vijayanagara Empire, the great power of southern India, on 23 January 1565. Aliya Rama Raya, who ruled Vijayanagara in the name of the emperor Sadashiva, had for twenty years played the sultanates against each other; his growing demands drove them to unite. The armies met south of the Krishna river, near the villages of Rakkasagi and Tangadagi, some 30 km from Talikota, after which the battle is usually named. Rama Raya was captured and beheaded, his army broke, and the sultans’ troops sacked the undefended capital, Vijayanagara (Hampi), over the following months. The empire survived under Rama Raya’s brother Tirumala and the Aravidu dynasty, ruling from Penukonda and later Chandragiri, but never recovered its power.: La bataille au cours de laquelle une alliance de quatre sultanats du Dekkan, Bijapur, Ahmadnagar, Golconde et Bidar, vainquit l’armée de l’Empire de Vijayanagar, la grande puissance de l’Inde du Sud, le 23 janvier 1565. Aliya Rama Raya, qui gouvernait Vijayanagar au nom de l’empereur Sadashiva, avait pendant vingt ans joué les sultanats les uns contre les autres ; ses exigences croissantes les poussèrent à s’unir. Les armées se rencontrèrent au sud de la Krishna, près des villages de Rakkasagi et de Tangadagi, à quelque 30 km de Talikota, dont la bataille porte généralement le nom. Rama Raya fut capturé et décapité, son armée se débanda, et les troupes des sultans mirent à sac au cours des mois suivants la capitale sans défense, Vijayanagar (Hampi). L’empire survécut sous Tirumala, frère de Rama Raya, et la dynastie Aravidu, qui régna depuis Penukonda puis depuis Chandragiri, mais ne retrouva jamais sa puissance.
