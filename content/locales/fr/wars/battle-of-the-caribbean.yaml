# French translations of the catalogue text (wave 14); step bodies follow later.
Battle of the Caribbean: Bataille des Caraïbes
? The German and Italian submarine campaign against Allied shipping in the Caribbean Sea and the Gulf of Mexico during the Second World War, part of the Battle of the Atlantic. The region mattered because of the oil of Venezuela, refined on the Dutch islands of Aruba and Curaçao and in Trinidad, the bauxite of the Guianas, needed for aircraft aluminium, and the Panama Canal. After Germany declared war on the United States on 11 December 1941, U-boats opened Operation Neuland on 16 February 1942, torpedoing tankers in the harbours of Aruba and Curaçao and in Trinidad’s Gulf of Paria. Ships sailing alone along lit coasts were easy targets, and in 1942 the Caribbean and the Gulf of Mexico saw some of the heaviest losses of the whole Atlantic war. The sinking of two Mexican tankers in May 1942 brought Mexico into the war. Losses fell sharply once the United States and Britain organised interlocking convoys from mid-1942 and covered them with aircraft from new bases leased in the British islands; by 1943 few U-boats came to the region, and several were sunk there, one of them by a Cuban submarine chaser. In all about 400 ships were sunk in the wider Caribbean, including 56 in the Gulf of Mexico. French Martinique and Guadeloupe, held for the Vichy government by Admiral Georges Robert under a US watch, went over to the Free French in July 1943.
: La campagne des sous-marins allemands et italiens contre la navigation alliée dans la mer des Caraïbes et le golfe du Mexique pendant la Seconde Guerre mondiale, qui faisait partie de la bataille de l’Atlantique. La région comptait en raison du pétrole du Venezuela, raffiné dans les îles néerlandaises d’Aruba et de Curaçao et à Trinidad, de la bauxite des Guyanes, nécessaire à l’aluminium des avions, et du canal de Panama. Après la déclaration de guerre de l’Allemagne aux États-Unis, le 11 décembre 1941, les U-Boote lancèrent l’opération Neuland le 16 février 1942, torpillant des pétroliers dans les ports d’Aruba et de Curaçao et dans le golfe de Paria, à Trinidad. Les navires qui naviguaient seuls le long de côtes éclairées étaient des cibles faciles, et en 1942 les Caraïbes et le golfe du Mexique connurent certaines des plus lourdes pertes de toute la guerre de l’Atlantique. Le naufrage de deux pétroliers mexicains en mai 1942 fit entrer le Mexique en guerre. Les pertes chutèrent fortement lorsque les États-Unis et la Grande-Bretagne organisèrent, à partir du milieu de 1942, un réseau de convois coordonnés et les firent couvrir par des avions opérant depuis de nouvelles bases louées dans les îles britanniques ; en 1943, rares étaient les U-Boote qui venaient encore dans la région, et plusieurs y furent coulés, dont un par un chasseur de sous-marins cubain. Au total, environ 400 navires furent coulés dans l’ensemble de la région caraïbe, dont 56 dans le golfe du Mexique. La Martinique et la Guadeloupe françaises, tenues pour le gouvernement de Vichy par l’amiral Georges Robert sous la surveillance des États-Unis, se rallièrent à la France libre en juillet 1943.
