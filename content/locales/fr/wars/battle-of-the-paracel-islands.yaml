# French translations of the catalogue text (wave 11); step bodies follow later.
Battle of the Paracel Islands: Bataille des îles Paracels
? "A naval battle in which China took the western Paracel Islands in the South China Sea from South Vietnam. The islands are claimed by China, Taiwan and Vietnam; since 1956 the People’s Republic had held the eastern Amphitrite group, with Woody Island, and South Vietnam the western Crescent group, with Pattle Island. In January 1974 Chinese fishing boats and militia landed on Duncan and Drummond islands, and South Vietnamese warships came to remove them. On 19 January four South Vietnamese warships and six smaller Chinese submarine chasers and minesweepers fought off Duncan Island: the escort ship Nhật Tảo was sunk and the other ships damaged, and South Vietnam lost about 75 men killed; China gave its losses as 18 killed. The next day Chinese troops landed on Pattle, Robert and Money islands and took 48 prisoners, among them an American liaison officer, Gerald Kosh, who was released on 31 January. The United States declined to intervene, the UN Security Council dropped South Vietnam’s complaint, and North Vietnam kept silent. China has held all the Paracels since. China regards the islands as Chinese since ancient times and the battle as a counter-attack in self-defence; Vietnam, which renewed the claim after reunification as successor to South Vietnam and to the Nguyễn emperors who sent expeditions to the islands from the 18th century, calls it an invasion and commemorates the 74 sailors it counts as killed. On 14 March 1988, at Johnson South Reef in the Spratly Islands, Chinese ships opened fire on Vietnamese troops standing on the reef and sank their transport ships, killing 64 Vietnamese; China took six reefs and has since turned some of them into artificial islands. The disputes over both archipelagos remain unresolved."
: "Une bataille navale à l’issue de laquelle la Chine prit au Sud-Vietnam la partie occidentale des îles Paracels, en mer de Chine méridionale. Les îles sont revendiquées par la Chine, Taïwan et le Vietnam ; depuis 1956, la République populaire tenait le groupe oriental d’Amphitrite, avec l’île Woody, et le Sud-Vietnam le groupe occidental du Croissant, avec l’île Pattle. En janvier 1974, des bateaux de pêche et des miliciens chinois débarquèrent sur les îles Duncan et Drummond, et des navires de guerre sud-vietnamiens vinrent les en déloger. Le 19 janvier, quatre navires de guerre sud-vietnamiens et six chasseurs de sous-marins et dragueurs de mines chinois, plus petits, s’affrontèrent au large de l’île Duncan : le navire d’escorte Nhật Tảo fut coulé et les autres navires endommagés, et le Sud-Vietnam perdit environ 75 tués ; la Chine fit état de 18 tués dans ses rangs. Le lendemain, des troupes chinoises débarquèrent sur les îles Pattle, Robert et Money et firent 48 prisonniers, parmi lesquels un officier de liaison américain, Gerald Kosh, qui fut libéré le 31 janvier. Les États-Unis refusèrent d’intervenir, le Conseil de sécurité de l’ONU écarta la plainte du Sud-Vietnam, et le Nord-Vietnam garda le silence. La Chine tient depuis lors l’ensemble des Paracels. Elle considère les îles comme chinoises depuis l’Antiquité et la bataille comme une contre-attaque en légitime défense ; le Vietnam, qui a renouvelé sa revendication après la réunification en tant que successeur du Sud-Vietnam et des empereurs Nguyễn, qui envoyèrent des expéditions dans les îles à partir du XVIIIe siècle, parle d’une invasion et commémore les 74 marins qu’il compte comme tués. Le 14 mars 1988, au récif Johnson South, dans les îles Spratleys, des navires chinois ouvrirent le feu sur des soldats vietnamiens qui se tenaient sur le récif et coulèrent leurs navires de transport, tuant 64 Vietnamiens ; la Chine prit six récifs et a depuis transformé certains d’entre eux en îles artificielles. Les différends sur les deux archipels ne sont toujours pas résolus."
