# French translations of the catalogue text (wave 14); step bodies follow later.
Battle of the St. Lawrence: Bataille du Saint-Laurent
? The German U-boat campaign in the Gulf of St. Lawrence and the lower St. Lawrence River during the Second World War, part of the Battle of the Atlantic and the first fighting in Canada’s inland waters since the War of 1812. On 12 May 1942 U-553 sank the British freighter Nicoya and the Dutch Leto near Anticosti Island, at the mouth of the river. In July U-132 sank three ships of a convoy off Cap-Chat, and in late August and September U-517 sank nine ships, among them the corvette HMCS Charlottetown, and U-165 sank the armed yacht HMCS Raccoon and badly damaged other ships, while residents of the Gaspé coast watched ships burn and bodies wash ashore under wartime censorship. In September 1942 Ottawa closed the river and the gulf to ocean shipping, sending cargoes by rail to Halifax and Sydney, until 1944. On 14 October 1942 U-69 sank the Newfoundland Railway ferry Caribou in the Cabot Strait; 137 of the 237 people aboard died, many of them women and children. On the Atlantic side of Newfoundland, then a separate dominion, U-boats sank four ore carriers at the anchorage of Bell Island in September and November 1942, and U-518 landed the spy Werner von Janowski at New Carlisle, Quebec, where he was arrested the same day. In September 1943 the navy and police foiled Operation Kiebitz, a plan for U-536 to pick up German naval officers escaping from a prisoner-of-war camp at Bowmanville, Ontario, at Pointe de Maisonnette. In autumn 1944 U-1223 damaged the frigate HMCS Magog beyond repair and U-1228 sank the corvette HMCS Shawinigan in the Cabot Strait with all 91 men aboard. In all, U-boats sank more than 20 merchant ships and four Canadian warships in and around the gulf, without losing a U-boat there; the Royal Canadian Navy, the Royal Canadian Air Force and the convoys kept most shipping moving.
: La campagne des U-Boote allemands dans le golfe du Saint-Laurent et le cours inférieur du fleuve Saint-Laurent pendant la Seconde Guerre mondiale, qui faisait partie de la bataille de l’Atlantique et fut le premier combat livré dans les eaux intérieures du Canada depuis la guerre de 1812. Le 12 mai 1942, l’U-553 coula le cargo britannique Nicoya et le néerlandais Leto près de l’île d’Anticosti, à l’embouchure du fleuve. En juillet, l’U-132 coula trois navires d’un convoi au large de Cap-Chat, et à la fin d’août et en septembre l’U-517 coula neuf navires, dont la corvette HMCS Charlottetown, tandis que l’U-165 coulait le yacht armé HMCS Raccoon et endommageait gravement d’autres navires ; sous la censure de guerre, les habitants de la côte gaspésienne voyaient des navires brûler et des corps s’échouer sur le rivage. En septembre 1942, Ottawa ferma le fleuve et le golfe à la navigation océanique jusqu’en 1944, et les cargaisons furent acheminées par chemin de fer vers Halifax et Sydney. Le 14 octobre 1942, l’U-69 coula dans le détroit de Cabot le traversier Caribou, du Newfoundland Railway ; 137 des 237 personnes à bord périrent, dont beaucoup de femmes et d’enfants. Du côté atlantique de Terre-Neuve, alors un dominion distinct, des U-Boote coulèrent quatre minéraliers au mouillage de l’île Bell en septembre et en novembre 1942, et l’U-518 débarqua l’espion Werner von Janowski à New Carlisle, au Québec, où il fut arrêté le jour même. En septembre 1943, la marine et la police déjouèrent l’opération Kiebitz, un plan selon lequel l’U-536 devait recueillir à la pointe de Maisonnette des officiers de marine allemands évadés d’un camp de prisonniers de guerre de Bowmanville, en Ontario. À l’automne 1944, l’U-1223 endommagea irrémédiablement la frégate HMCS Magog et l’U-1228 coula la corvette HMCS Shawinigan dans le détroit de Cabot avec les 91 hommes qui se trouvaient à son bord. Au total, les U-Boote coulèrent plus de 20 navires marchands et quatre navires de guerre canadiens dans le golfe et ses abords, sans y perdre un seul sous-marin ; la Marine royale canadienne, l’Aviation royale canadienne et les convois permirent à la majeure partie du trafic de se poursuivre.
