# French translations of the catalogue text (wave 10); step bodies follow later.
Battles of Fengwudong and Qingshanli: Batailles de Fengwudong et de Qingshanli
? The largest clashes between Korean independence armies and the Japanese army, fought in 1920 in Jiandao (Gando), the region of China’s Jilin province north of the Tumen River where hundreds of thousands of Koreans lived. After the March First Movement of 1919, armed Korean groups based there raided Japanese posts across the river in Korea. On 7 June 1920 Hong Beom-do’s and Choe Jin-dong’s forces ambushed a pursuing Japanese battalion in the valley of Fengwudong (Bongo-dong). In October, after an attack on the Japanese consulate at Hunchun, Japan sent a large force, by Korean estimates 18,000–20,000 men, into Jiandao with China’s reluctant consent, and from 21 to 26 October the units of Kim Jwa-jin and Hong Beom-do fought a series of actions in the forests around Qingshanli (Cheongsan-ri) before slipping away north. Korean accounts count these as great victories with hundreds or more than a thousand Japanese dead; Japanese army records give only a handful. Japanese troops then burned Korean villages and killed thousands of their people in what Koreans call the Gyeongsin massacre or Gando massacre, and the independence armies withdrew towards Soviet Russia.
: Les plus grands affrontements entre les armées coréennes d’indépendance et l’armée japonaise, livrés en 1920 dans le Jiandao (Gando), la région de la province chinoise du Jilin située au nord du fleuve Tumen, où vivaient des centaines de milliers de Coréens. Après le mouvement du 1er Mars 1919, des groupes armés coréens qui y étaient établis lancèrent des raids contre des postes japonais de l’autre côté du fleuve, en Corée. Le 7 juin 1920, les forces de Hong Beom-do et de Choe Jin-dong tendirent une embuscade à un bataillon japonais lancé à leur poursuite dans la vallée de Fengwudong (Bongo-dong). En octobre, après une attaque contre le consulat japonais de Hunchun, le Japon envoya dans le Jiandao, avec le consentement réticent de la Chine, une force importante, de 18 000 à 20 000 hommes selon les estimations coréennes, et du 21 au 26 octobre les unités de Kim Jwa-jin et de Hong Beom-do livrèrent une série de combats dans les forêts autour de Qingshanli (Cheongsan-ri) avant de s’esquiver vers le nord. Les récits coréens les présentent comme de grandes victoires, avec des centaines, voire plus d’un millier de morts japonais ; les archives de l’armée japonaise n’en indiquent qu’une poignée. Les troupes japonaises incendièrent ensuite des villages coréens et en tuèrent les habitants par milliers, lors de ce que les Coréens appellent le massacre de Gyeongsin ou massacre de Gando, et les armées d’indépendance se retirèrent vers la Russie soviétique.
