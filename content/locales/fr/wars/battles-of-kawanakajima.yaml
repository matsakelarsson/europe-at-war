# French translations of the catalogue text (wave 10); step bodies follow later.
Battles of Kawanakajima: Batailles de Kawanakajima
Five campaigns fought between Takeda Shingen of Kai and Uesugi Kenshin of Echigo for the Kawanakajima plain in northern Shinano, where the Sai and Chikuma rivers meet, around today’s city of Nagano. After Shingen drove the Murakami and Ogasawara out of Shinano in 1553, they turned to Kenshin, then still called Nagao Kagetora, and he crossed the mountains to stop the Takeda advance towards his own province. The armies met at Kawanakajima in 1553, 1555, 1557, 1561 and 1564. Most of these campaigns were long stand-offs, but the fourth, fought at Hachimanbara on 18 October 1561, was one of the bloodiest battles of the Sengoku period, in which Shingen’s brother Takeda Nobushige was killed and both armies lost thousands of men. Neither side won the plain outright, though the Takeda kept most of northern Shinano; the rivalry of the two lords became one of the most retold stories of Japanese warfare.: "Cinq campagnes menées par Takeda Shingen, de Kai, et Uesugi Kenshin, d’Echigo, pour la plaine de Kawanakajima, dans le nord du Shinano, au confluent des rivières Sai et Chikuma, autour de l’actuelle ville de Nagano. Après que Shingen eut chassé les Murakami et les Ogasawara du Shinano en 1553, ceux-ci se tournèrent vers Kenshin, qui s’appelait encore Nagao Kagetora, et celui-ci franchit les montagnes pour arrêter l’avancée des Takeda vers sa propre province. Les armées s’affrontèrent à Kawanakajima en 1553, 1555, 1557, 1561 et 1564. La plupart de ces campagnes furent de longs face-à-face, mais la quatrième, livrée à Hachimanbara le 18 octobre 1561, fut l’une des batailles les plus sanglantes de l’époque Sengoku : le frère de Shingen, Takeda Nobushige, y fut tué et les deux armées perdirent des milliers d’hommes. Aucun des deux camps ne s’assura définitivement la plaine, même si les Takeda conservèrent la plus grande partie du nord du Shinano ; la rivalité des deux seigneurs devint l’un des récits les plus souvent repris de l’histoire militaire japonaise."
