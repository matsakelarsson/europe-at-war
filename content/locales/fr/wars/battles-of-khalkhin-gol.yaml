# French translations of the catalogue text (wave 9); step bodies follow later.
Battles of Khalkhin Gol: Batailles de Khalkhin Gol
? An undeclared war between the Soviet Union and Mongolia on one side and Japan and its client state Manchukuo on the other, fought over a strip of steppe on the Khalkhin Gol, the river that the Japanese said was the border between Manchukuo and the Mongolian People’s Republic, while Mongolia and the Soviet Union placed the border some 16–20 km further east, near the cairn of Nomonhan. Clashes between border patrols in May 1939 grew into a battle of divisions. A Japanese offensive across the river at Bain-Tsagan in early July was thrown back by Soviet armour, and on 20 August Georgy Zhukov’s army group attacked with some 500 tanks and 500 aircraft, encircled the Japanese 23rd Division and destroyed it by the end of the month. A ceasefire agreed in Moscow took effect on 16 September, and the border was fixed roughly where Mongolia had claimed it. Japan lost some 17,000–20,000 killed, wounded and sick, the Soviet Union about 25,000. The defeat turned Japan away from war with the Soviet Union and towards South-East Asia and the Pacific.
: Une guerre non déclarée entre l’Union soviétique et la Mongolie d’un côté, le Japon et son État client, le Mandchoukouo, de l’autre, livrée pour une bande de steppe sur la Khalkhin Gol, la rivière dont les Japonais affirmaient qu’elle marquait la frontière entre le Mandchoukouo et la République populaire de Mongolie, tandis que la Mongolie et l’Union soviétique plaçaient la frontière quelque 16 à 20 km plus à l’est, près du cairn de Nomonhan. Des accrochages entre patrouilles frontalières en mai 1939 dégénérèrent en une bataille de divisions. Une offensive japonaise de l’autre côté de la rivière, à Bain-Tsagan, au début de juillet, fut repoussée par les blindés soviétiques et, le 20 août, le groupe d’armées de Gueorgui Joukov attaqua avec quelque 500 chars et 500 avions, encercla la 23e division japonaise et l’anéantit avant la fin du mois. Un cessez-le-feu conclu à Moscou entra en vigueur le 16 septembre, et la frontière fut fixée à peu près là où la Mongolie la revendiquait. Le Japon perdit quelque 17 000 à 20 000 hommes tués, blessés et malades, l’Union soviétique environ 25 000. La défaite détourna le Japon d’une guerre contre l’Union soviétique et l’orienta vers l’Asie du Sud-Est et le Pacifique.
