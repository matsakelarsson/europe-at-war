Battles of La Naval de Manila: Batailles de La Naval de Manila
? Five sea battles fought in 1646 in Philippine waters between the Spanish and the Dutch East India Company (VOC), in the last years of the Eighty Years’ War. The VOC, which had taken the Spanish fort on Formosa (Taiwan) in 1642, sent two squadrons to blockade Manila, intercept the galleons from Acapulco and the junks from China, and win over the people of the coasts. Governor Diego Fajardo had only two old merchant galleons fit for war, the Encarnación and the Rosario, with a galley and a few brigantines, manned by Spanish and Filipino crews under Lorenzo Ugalde de Orellana and Sebastián López. On 15 March they fought four Dutch ships off Bolinao in Pangasinan. On 29 July, between Banton and Marinduque, they fought seven Dutch ships and sank a fire ship; on 31 July, between Mindoro and Maestre de Campo, a second fire ship was sunk and the Dutch withdrew. On 16 September the Encarnación fought three Dutch ships off Ambil and Lubang for four hours, and on 4 October, at the entrance of Manila Bay off Mariveles, the galleon and the galley drove off the last three. Dutch landings in Ilocos and Pangasinan and an attack on Zamboanga, where the Dutch were driven back from Caldera, also failed. Spanish accounts give about 15 Spanish dead in the five battles and about 500 Dutch. The crews had made a vow to Our Lady of the Rosary and walked barefoot to the church of Santo Domingo when they came home; on 9 April 1652 (1662 in some accounts) the cathedral chapter of Manila declared the victories miraculous, and La Naval is still celebrated on the second Sunday of October. The Peace of Münster ended the war between Spain and the Dutch Republic in 1648.
: Cinq batailles navales livrées en 1646 dans les eaux philippines entre les Espagnols et la Compagnie néerlandaise des Indes orientales (VOC), dans les dernières années de la guerre de Quatre-Vingts Ans. La VOC, qui avait pris le fort espagnol de Formose (Taïwan) en 1642, envoya deux escadres pour bloquer Manille, intercepter les galions d’Acapulco et les jonques de Chine, et gagner à sa cause les populations des côtes. Le gouverneur Diego Fajardo ne disposait que de deux vieux galions marchands aptes au combat, l’Encarnación et le Rosario, avec une galère et quelques brigantins, montés par des équipages espagnols et philippins sous les ordres de Lorenzo Ugalde de Orellana et de Sebastián López. Le 15 mars, ils combattirent quatre navires néerlandais au large de Bolinao, dans le Pangasinan. Le 29 juillet, entre Banton et Marinduque, ils affrontèrent sept navires néerlandais et coulèrent un brûlot ; le 31 juillet, entre Mindoro et Maestre de Campo, un second brûlot fut coulé et les Néerlandais se retirèrent. Le 16 septembre, l’Encarnación combattit pendant quatre heures trois navires néerlandais au large d’Ambil et de Lubang, et le 4 octobre, à l’entrée de la baie de Manille, au large de Mariveles, le galion et la galère repoussèrent les trois derniers. Les débarquements néerlandais dans l’Ilocos et le Pangasinan et une attaque contre Zamboanga, où les Néerlandais furent repoussés de Caldera, échouèrent également. Les récits espagnols font état d’environ 15 morts espagnols dans les cinq batailles et d’environ 500 morts néerlandais. Les équipages avaient fait un vœu à Notre-Dame du Rosaire et se rendirent pieds nus à l’église de Santo Domingo à leur retour ; le 9 avril 1652 (1662 selon certains récits), le chapitre de la cathédrale de Manille déclara ces victoires miraculeuses, et La Naval est encore célébrée le deuxième dimanche d’octobre. La paix de Münster mit fin en 1648 à la guerre entre l’Espagne et la République des Provinces-Unies.
