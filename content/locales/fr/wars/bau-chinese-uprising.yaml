# French translations of the catalogue text (wave 11); step bodies follow later.
Chinese uprising at Bau and Kuching: Soulèvement chinois de Bau et de Kuching
? A rising of the Hakka gold miners of Bau, in Upper Sarawak, against the Brooke Raj. Their kongsi, the Twelve Kongsi, ran the gold mines of the Bau district and managed many of its own affairs; in the 1850s James Brooke’s government curbed its powers, made it build and pay for a fort at Belidah, and shortly before the rising fined it £150 for smuggling opium. Rumours of Britain’s war with China at Canton and of the British commission of inquiry into Brooke’s rule encouraged the kongsi’s leaders. On 18 February 1857 about 600 miners under Liu Shan Bang went down the Sarawak River by boat from Tundong and attacked Kuching after midnight. They burned the houses of Brooke and his officers and took the stockade with its arms and treasury; Brooke escaped by swimming a creek. Several Europeans were killed, among them a young officer, Nicholetts, whose head was paraded as the Rajah’s, two small children of the police inspector and a Borneo Company clerk. The kongsi’s leaders sat in Brooke’s court, made the Borneo Company’s manager and the Malay Datu Bandar govern the town under them, and went back upriver with their plunder. Malays under the Datu Bandar fought them on the river; within days the Borneo Company steamer Sir James Brooke arrived from Singapore and the Iban fighters of Brooke’s nephew Charles Brooke came from the Batang Lupar. The miners fled towards the Dutch border. Liu Shan Bang was killed on 24 February, and Malay, Iban and Bidayuh forces pursued the retreating Chinese, women and children among them, for days. Brooke-era accounts put the Chinese dead at about 1,000 and those who escaped into Sambas at about 2,000, half of them women and children; one account gives about 3,000 villagers killed in the pursuit. Peace was proclaimed on 15 April 1857. The kongsi was broken up, the Borneo Company took over much of the mining, and the Hakka of Bau later honoured Liu Shan Bang as a deity.
: Un soulèvement des mineurs d’or hakkas de Bau, dans le haut Sarawak, contre le raj des Brooke. Leur kongsi, le Twelve Kongsi, exploitait les mines d’or du district de Bau et gérait lui-même une bonne partie de ses affaires ; dans les années 1850, le gouvernement de James Brooke restreignit ses pouvoirs, l’obligea à construire et à financer un fort à Belidah et, peu avant le soulèvement, lui infligea une amende de 150 £ pour contrebande d’opium. Les rumeurs sur la guerre de la Grande-Bretagne contre la Chine à Canton et sur la commission d’enquête britannique chargée d’examiner le gouvernement de Brooke encouragèrent les chefs du kongsi. Le 18 février 1857, environ 600 mineurs menés par Liu Shan Bang descendirent en bateau la rivière Sarawak depuis Tundong et attaquèrent Kuching après minuit. Ils incendièrent les maisons de Brooke et de ses officiers et prirent la palissade avec ses armes et son trésor ; Brooke s’échappa en traversant une crique à la nage. Plusieurs Européens furent tués, parmi lesquels un jeune officier, Nicholetts, dont la tête fut promenée comme si c’était celle du rajah, deux jeunes enfants de l’inspecteur de police et un employé de la Borneo Company. Les chefs du kongsi siégèrent au tribunal de Brooke, chargèrent le directeur de la Borneo Company et le Datu Bandar malais de gouverner la ville sous leur autorité, et remontèrent la rivière avec leur butin. Des Malais menés par le Datu Bandar les combattirent sur la rivière ; en quelques jours, le vapeur de la Borneo Company Sir James Brooke arriva de Singapour, et les combattants iban du neveu de Brooke, Charles Brooke, arrivèrent du Batang Lupar. Les mineurs s’enfuirent vers la frontière néerlandaise. Liu Shan Bang fut tué le 24 février, et des forces malaises, iban et bidayuh poursuivirent pendant des jours les Chinois en retraite, parmi lesquels des femmes et des enfants. Les récits de l’époque des Brooke évaluent le nombre de morts chinois à environ 1 000, et celui des personnes qui parvinrent à s’enfuir à Sambas à environ 2 000, dont la moitié de femmes et d’enfants ; un récit fait état d’environ 3 000 villageois tués pendant la poursuite. La paix fut proclamée le 15 avril 1857. Le kongsi fut démantelé, la Borneo Company reprit une grande partie de l’exploitation minière, et les Hakkas de Bau honorèrent plus tard Liu Shan Bang comme une divinité.
