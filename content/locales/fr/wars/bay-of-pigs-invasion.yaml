# French translations of the catalogue text (wave 14); step bodies follow later.
Bay of Pigs Invasion: Débarquement de la baie des Cochons
? "The failed invasion of Cuba by Brigade 2506, about 1,400 Cuban exiles recruited, trained and armed by the CIA, in April 1961. President Eisenhower approved a plan to overthrow Fidel Castro in March 1960, as Castro’s government nationalised American property and drew close to the Soviet Union, and the brigade trained in Guatemala. President Kennedy, in office since January 1961, approved a revised plan that moved the landing to the remote Bay of Pigs in the Zapata swamp on Cuba’s south coast and kept the American role hidden. On 15 April 1961 exile pilots in B-26 bombers painted in Cuban markings struck three Cuban airfields but left part of Castro’s small air force intact, and the cover story fell apart within hours; Kennedy cancelled a second strike. The brigade landed at Playa Larga and Playa Girón before dawn on 17 April. Cuban aircraft sank two of its supply ships, and Cuban troops and militias, led by Castro himself, attacked down the causeways through the swamp. Short of ammunition and without the American air cover they had expected, the invaders were defeated by the evening of 19 April: 114 were killed and 1,202 captured, while Cuba gave its own losses as 176 dead, with many more militiamen killed or wounded by other estimates. The victory strengthened Castro, who had declared the revolution socialist on 16 April, and pushed Cuba closer to the Soviet Union; the prisoners were ransomed in December 1962 for $53 million in food and medicine, and the United States turned to covert sabotage against Cuba in Operation Mongoose."
: "L’invasion manquée de Cuba par la brigade 2506, environ 1 400 exilés cubains recrutés, entraînés et armés par la CIA, en avril 1961. Le président Eisenhower approuva en mars 1960 un plan de renversement de Fidel Castro, alors que le gouvernement castriste nationalisait les biens américains et se rapprochait de l’Union soviétique, et la brigade s’entraîna au Guatemala. Le président Kennedy, en fonction depuis janvier 1961, approuva un plan révisé qui déplaçait le débarquement vers la baie des Cochons, isolée dans le marais de Zapata, sur la côte sud de Cuba, et dissimulait le rôle américain. Le 15 avril 1961, des pilotes exilés aux commandes de bombardiers B-26 peints aux couleurs cubaines frappèrent trois aérodromes cubains, mais laissèrent intacte une partie de la petite aviation de Castro, et la version de façade s’effondra en quelques heures ; Kennedy annula une deuxième frappe. La brigade débarqua à Playa Larga et à Playa Girón avant l’aube du 17 avril. Des avions cubains coulèrent deux de ses navires de ravitaillement, et les troupes et les milices cubaines, menées par Castro en personne, attaquèrent le long des chaussées qui traversaient le marais. À court de munitions et privés de la couverture aérienne américaine qu’ils attendaient, les envahisseurs furent vaincus le 19 avril au soir : 114 furent tués et 1 202 capturés, tandis que Cuba fit état de 176 morts dans ses rangs, d’autres estimations comptant beaucoup plus de miliciens tués ou blessés. La victoire renforça Castro, qui avait proclamé le caractère socialiste de la révolution le 16 avril, et rapprocha Cuba de l’Union soviétique ; les prisonniers furent rachetés en décembre 1962 contre 53 millions de dollars de nourriture et de médicaments, et les États-Unis se tournèrent vers le sabotage clandestin contre Cuba avec l’opération Mongoose."
