# French translations of the catalogue text (wave 14); step bodies follow later.
Beaver Wars (French and Iroquois Wars): Guerres des Castors (guerres franco-iroquoises)
? "Nearly a century of intermittent war around the St. Lawrence and the Great Lakes between the Haudenosaunee (Iroquois) Confederacy of the Mohawk, Oneida, Onondaga, Cayuga and Seneca, armed by Dutch and later English traders at Fort Orange (Albany), and New France with its allies, the Wendat (Huron), Algonquin, Innu and later the nations of the upper Great Lakes. It began when Samuel de Champlain joined his Native allies against the Mohawk at Lake Champlain in 1609. After epidemics in the 1630s halved the populations of the region, Haudenosaunee war parties blockaded the St. Lawrence and the Ottawa, and in 1648–1650 destroyed Wendake, the Wendat homeland on Georgian Bay; the Petun, the Neutral and the Erie were defeated and dispersed in turn, and thousands of captives were adopted into the Five Nations. New France, near collapse, was saved by royal troops who burned the Mohawk towns in 1666. War resumed in the 1680s over the western fur trade: the Haudenosaunee attacked the Illinois, Denonville burned the Seneca towns in 1687, and in 1689 Haudenosaunee warriors struck Lachine, near Montreal. French, Anishinaabe and Wyandot counter-attacks in the 1690s drove them back, and at the Great Peace of Montreal of 1701 the Haudenosaunee and some forty nations allied with France made peace. Historians explain the wars by the fur trade, by the mourning-war custom of taking captives to replace the dead, and by the Haudenosaunee aim of bringing other peoples under the Great Law of Peace."
: "Près d’un siècle de guerre intermittente autour du Saint-Laurent et des Grands Lacs entre la Confédération haudenosaunee (iroquoise), formée des Mohawks, des Oneidas, des Onondagas, des Cayugas et des Senecas et armée par des marchands néerlandais, puis anglais, de Fort Orange (Albany), et la Nouvelle-France et ses alliés, les Wendats (Hurons), les Algonquins, les Innus, puis les nations du haut des Grands Lacs. Elle commença lorsque Samuel de Champlain se joignit à ses alliés autochtones contre les Mohawks au lac Champlain en 1609. Après que des épidémies eurent réduit de moitié les populations de la région dans les années 1630, des partis de guerre haudenosaunee bloquèrent le Saint-Laurent et l’Outaouais et, entre 1648 et 1650, détruisirent le Wendake, le pays des Wendats sur la baie Georgienne ; les Pétuns, les Neutres et les Ériés furent à leur tour vaincus et dispersés, et des milliers de captifs furent adoptés par les Cinq Nations. La Nouvelle-France, au bord de l’effondrement, fut sauvée par des troupes royales qui incendièrent les villages mohawks en 1666. La guerre reprit dans les années 1680 pour le commerce des fourrures de l’Ouest : les Haudenosaunee attaquèrent les Illinois, Denonville incendia les villages senecas en 1687 et, en 1689, des guerriers haudenosaunee frappèrent Lachine, près de Montréal. Les contre-attaques des Français, des Anishinaabés et des Wyandots dans les années 1690 les repoussèrent et, à la Grande Paix de Montréal de 1701, les Haudenosaunee et une quarantaine de nations alliées de la France firent la paix. Les historiens expliquent ces guerres par le commerce des fourrures, par la coutume de la guerre de deuil, qui consistait à faire des captifs pour remplacer les morts, et par la volonté des Haudenosaunee de placer d’autres peuples sous la Grande Loi de la Paix."
