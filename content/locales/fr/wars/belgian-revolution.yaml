"August 1831 – December 1832": "août 1831 – décembre 1832"
"The National Congress chose Leopold of Saxe-Coburg as king, and he took the oath on 21 July 1831, now Belgium’s national day. William I had not accepted the terms set in London, and on 2 August a Dutch army of about 50,000 under the Prince of Orange crossed the border near Poppel. The Belgians had about 24,000 regulars and militia, split between an Army of the Scheldt around Antwerp and an Army of the Meuse in Limburg. The Dutch beat them at Turnhout, at Houthalen and Hasselt, and on 12 August before Leuven.": "Le Congrès national choisit Léopold de Saxe-Coburg comme roi, et il prêta serment le 21 juillet 1831, jour national de la Belgique. William I n’avait pas accepté les conditions fixées à Londres, et le 2 août une armée néerlandaise d’environ 50 000 sous le prince d’Orange a franchi la frontière près de Poppel. Les Belges avaient environ 24 000 réguliers et miliciens, répartis entre une armée de l’Escaut autour d’Anvers et une armée de la Meuse au Limbourg. Les Hollandais les battaient à Turnhout, à Houthalen et Hasselt, et le 12 août avant Louvain."
"Leopold had appealed to France, and on 9 August Marshal Étienne Gérard crossed the border with about 70,000 men. Rather than fight the French, the Dutch agreed to a ceasefire on 12 August and withdrew, keeping only the citadel of Antwerp. The powers then offered terms less favourable to Belgium, the Twenty-Four Articles, which Belgium accepted and William refused. In November 1832 British and French warships blockaded the Dutch coast and Gérard returned to besiege the citadel. His engineers under General François Haxo dug their trenches up to the walls and pounded the fort with heavy mortars until Chassé surrendered on 23 December.": "Leopold avait fait appel à la France et, le 9 août, le maréchal Étienne Gérard a franchi la frontière avec environ 70 000 hommes. Plutôt que de combattre les Français, les Hollandais ont accepté un cessez-le-feu le 12 août et se sont retirés, ne conservant que la citadelle d’Anvers. En novembre 1832, des navires de guerre britanniques et français ont bloqué la côte néerlandaise et Gérard est retourné assiéger la citadelle. Ses ingénieurs sous le commandement du général François Haxo ont creusé leurs tranchées jusqu’aux murs et frappé le fort avec de lourds mortiers jusqu’à ce que Chassé se rende le 23 décembre."
"The Dutch still held the forts of Lillo and Liefkenshoek on the Scheldt below Antwerp, and an agreement in May 1833 left matters as they stood. In 1838 William at last accepted the Twenty-Four Articles. By the Treaty of London of 19 April 1839 the Netherlands recognised Belgium, whose independence and perpetual neutrality the great powers guaranteed, the guarantee Germany broke in 1914. Belgium gave up eastern Limburg, with Maastricht and Venlo, to the Netherlands, and the eastern, German-speaking part of Luxembourg, which remained a grand duchy under the Dutch king.": "En 1838, William accepta enfin les vingt-quatre articles. Par le traité de Londres du 19 avril 1839, les Pays-Bas reconnaissèrent la Belgique, dont l’indépendance et la neutralité perpétuelles garantissaient les grandes puissances, la garantie que l’Allemagne rompt en 1914. La Belgique abandonna l’est du Limbourg, avec Maastricht et Venlo, aux Pays-Bas, et la partie orientale germanophone du Luxembourg, qui demeura un grand-duché sous le roi néerlandais."
