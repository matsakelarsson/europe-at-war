"August – December 1830": "août – décembre 1830"
"The south of the United Kingdom of the Netherlands had more people than the north but no more seats in the States General, most officials and officers were Dutch, Catholics resented King William I’s control of schools, and French-speakers his promotion of Dutch. Catholics and liberals made common cause against him. Weeks after the July Revolution in Paris, on 25 August 1830, the audience at Brussels’ opera house, the Monnaie, poured into the streets after a performance of Auber’s La Muette de Portici, and rioting spread to Liège and other towns.": "Le sud du Royaume-Uni des Pays-Bas avait plus de gens que le nord, mais pas plus de sièges dans les États généraux, la plupart des fonctionnaires et des officiers étaient néerlandais, catholiques déplaisaient le roi William I.S contrôle des écoles, et Français-parleurs sa promotion des Hollandais. Catholiques et libéraux ont fait cause commune contre lui. Des semaines après la Révolution de juillet à Paris, le 25 août 1830, le public de l’opéra bruxellois, la Monnaie, s’est répandu dans les rues après une représentation d’Aubers La Muette de Portici et des émeutes se sont répandues à Liège et dans d’autres villes."
"The king’s heir, the Prince of Orange, came to Brussels and accepted that north and south should be governed separately, but his father chose force. From 23 to 26 September several thousand troops under his younger son, Prince Frederick, held the park in the city centre against volunteers firing from barricades and houses, then withdrew. Several hundred insurgents were killed; they lie under today’s Place des Martyrs. A provisional government declared independence on 4 October.": "L’héritier du roi, le prince d’Orange, vint à Bruxelles et accepta que le nord et le sud soient gouvernés séparément, mais son père choisit la force. Du 23 au 26 septembre, plusieurs milliers de troupes sous son fils cadet, le prince Frederick, tenaient le parc dans le centre-ville contre des volontaires tirant des barricades et des maisons, puis se retiraient."
"The Dutch army fell back to the citadel of Antwerp and the fortress of Maastricht. On 27 October, as Belgian volunteers entered Antwerp, General David Chassé’s guns in the citadel bombarded the city, setting warehouses and houses on fire. A National Congress, elected in November, declared Belgium independent and barred the House of Orange from its throne, and on 20 December a conference of the great powers in London accepted that the United Kingdom of the Netherlands was dissolved.": "Le 27 octobre, alors que des volontaires belges entraient à Anvers, les canons du général David Chassé dans la citadelle bombardaient la ville, mettant le feu aux entrepôts et maisons. Un Congrès national, élu en novembre, a déclaré la Belgique indépendante et interdit la Chambre d’Orange de son trône, et le 20 décembre une conférence des grandes puissances à Londres a accepté que le Royaume-Uni des Pays-Bas soit dissous."
