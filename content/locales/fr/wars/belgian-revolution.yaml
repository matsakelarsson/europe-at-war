# Some French text was translated automatically.
"Belgian Revolution": "Révolution belge"
"The rising of the southern provinces of the United Kingdom of the Netherlands that created the Kingdom of Belgium. Street fighting drove the Dutch army out of Brussels in September 1830 and a provisional government declared independence; a Dutch invasion in August 1831 was halted by a French army, which also took the citadel of Antwerp in December 1832, and the Netherlands recognised Belgium by the Treaty of London of 1839.": "La montée des provinces méridionales du Royaume-Uni des Pays-Bas qui créa le Royaume de Belgique. Les combats de rue ont chassé l’armée néerlandaise de Bruxelles en septembre 1830 et un gouvernement provisoire a déclaré l’indépendance ; une invasion hollandaise en août 1831 a été arrêtée par une armée française, qui a également pris la citadelle d’Anvers en décembre 1832, et les Pays-Bas ont reconnu la Belgique par le traité de Londres de 1839."
"The United Kingdom of the Netherlands, created in 1815, joined the former Dutch Republic with the former Austrian Netherlands and the Prince-Bishopric of Liège. Its king, William I of Orange-Nassau, was also Grand Duke of Luxembourg. Its army and government are called “Dutch” here, as in most accounts.": "Le Royaume-Uni des Pays-Bas, créé en 1815, a rejoint l’ancienne République néerlandaise avec les anciens Pays-Bas autrichiens et le prince-évêque de Liège. Son roi, William I d’Orange-Nassau, était également Grand-Duc du Luxembourg. Son armée et son gouvernement sont appelés ici ─ néerlandais, comme dans la plupart des comptes."
"The fighting ended in 1832, but the Netherlands accepted Belgian independence only by the Treaty of London of 19 April 1839, which also divided Limburg and Luxembourg. Until then Belgium held most of both.": "Les combats ont pris fin en 1832, mais les Pays-Bas n’ont accepté l’indépendance belge que par le traité de Londres du 19 avril 1839, qui a également divisé le Limbourg et le Luxembourg."
