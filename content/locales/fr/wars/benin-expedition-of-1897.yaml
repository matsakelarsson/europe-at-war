# French translations of the catalogue text (wave 13); step bodies follow later.
Benin Expedition of 1897: Expédition du Bénin de 1897
? The British conquest of the Kingdom of Benin, in what is now southern Nigeria. Benin, ruled by its obas from Benin City for some six centuries, controlled the trade of its hinterland and had kept its independence while Britain built up the Niger Coast Protectorate around it. Britain claimed that a treaty of 1892 had opened Benin to free trade; Oba Ovonramwen went on levying duties and in 1896 halted the palm-oil trade with the Itsekiri middlemen. In late December 1896 the acting consul-general, James Phillips, set out for Benin City with a party of about 250, without waiting for permission from London and against the oba’s request to wait until a festival was over. On 4 January 1897 Benin soldiers attacked the party near Ugbine and killed most of its members. A British force of about 1,200 sailors, marines and protectorate soldiers under Rear-Admiral Harry Rawson invaded in February and took Benin City on 18 February after ten days of fighting; much of the city burned, and the troops looted the palace and shrines of thousands of brass, ivory and wooden works of art, the Benin Bronzes. Ovonramwen surrendered in August and was exiled to Calabar, where he died in 1914, and Benin was annexed to the protectorate. The return of the Bronzes, scattered among museums in Europe and North America, has become one of the best-known questions of restitution of cultural property.
: La conquête britannique du royaume du Bénin, dans l’actuel sud du Nigeria. Le Bénin, gouverné depuis quelque six siècles par ses obas depuis Benin City, contrôlait le commerce de son arrière-pays et avait conservé son indépendance tandis que la Grande-Bretagne édifiait autour de lui le protectorat de la Côte du Niger. La Grande-Bretagne affirmait qu’un traité de 1892 avait ouvert le Bénin au libre-échange ; l’oba Ovonramwen continua de percevoir des droits et, en 1896, suspendit le commerce de l’huile de palme avec les intermédiaires itsekiri. Fin décembre 1896, le consul général par intérim, James Phillips, partit pour Benin City avec un groupe d’environ 250 personnes, sans attendre l’autorisation de Londres et malgré la demande de l’oba d’attendre la fin d’une fête. Le 4 janvier 1897, des soldats du Bénin attaquèrent l’expédition près d’Ugbine et tuèrent la plupart de ses membres. Une force britannique d’environ 1 200 marins, fusiliers marins et soldats du protectorat, commandée par le contre-amiral Harry Rawson, envahit le pays en février et prit Benin City le 18 février après dix jours de combats ; une grande partie de la ville brûla, et les troupes pillèrent dans le palais et les sanctuaires des milliers d’œuvres d’art en laiton, en ivoire et en bois, les bronzes du Bénin. Ovonramwen se rendit en août et fut exilé à Calabar, où il mourut en 1914, et le Bénin fut annexé au protectorat. Le retour des bronzes, dispersés entre des musées d’Europe et d’Amérique du Nord, est devenu l’une des questions de restitution de biens culturels les plus connues.
