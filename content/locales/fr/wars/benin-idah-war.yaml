# French translations of the catalogue text (wave 13); step bodies follow later.
Benin–Idah war: Guerre entre le Bénin et Idah
? "A war between the Kingdom of Benin under Oba Esigie and the Igala kingdom of Idah, on the lower Niger, in 1515–1516, known from Benin tradition and a Portuguese letter. Esigie had come to power after a civil war against his brother Arhuaran, who held the town of Udo, and one account says that Benin nobles who opposed the oba’s dealings with the Portuguese conspired with the Attah (king) of Idah. The Igala attacked Benin and were driven back. Tradition gives a great part to Esigie’s mother Idia, whom he made the first Iyoba (queen mother): she is said to have raised troops and gone to war at his side, and a servant of hers is credited with killing the Igala general. Portuguese missionaries went with the Benin army: on 20 October 1516 the priest Duarte Pires wrote to King Manuel I that they had stayed with the oba “during a whole year of war”, that the oba hoped to finish the war that summer, and that he had given his son and some of his greatest officials to be made Christians. Whether Portuguese soldiers or guns took part is disputed: some accounts credit Portuguese firepower with Benin’s victory, others say Benin won without it. Benin was then selling captives to the Portuguese, who carried many of them to Elmina on the Gold Coast to buy gold."
: "Une guerre qui opposa en 1515–1516 le royaume du Bénin, sous l’oba Esigie, au royaume igala d’Idah, sur le bas Niger, et que l’on connaît par la tradition du Bénin et par une lettre portugaise. Esigie était arrivé au pouvoir à l’issue d’une guerre civile contre son frère Arhuaran, qui tenait la ville d’Udo, et selon un récit, des nobles du Bénin hostiles aux relations de l’oba avec les Portugais conspirèrent avec l’Attah (roi) d’Idah. Les Igala attaquèrent le Bénin et furent repoussés. La tradition accorde un grand rôle à la mère d’Esigie, Idia, dont il fit la première Iyoba (reine mère) : elle aurait levé des troupes et serait partie en guerre à ses côtés, et l’on attribue à l’un de ses serviteurs la mort du général igala. Des missionnaires portugais accompagnèrent l’armée du Bénin : le 20 octobre 1516, le prêtre Duarte Pires écrivit au roi Manuel Ier qu’ils étaient restés auprès de l’oba « pendant toute une année de guerre », que l’oba espérait achever la guerre cet été-là et qu’il avait confié son fils et quelques-uns de ses plus hauts dignitaires pour qu’ils soient faits chrétiens. La participation de soldats ou d’armes à feu portugais est discutée : certains récits attribuent la victoire du Bénin à la puissance de feu portugaise, d’autres affirment que le Bénin l’emporta sans elle. Le Bénin vendait alors des captifs aux Portugais, qui en emmenaient beaucoup à Elmina, sur la Côte-de-l’Or, pour acheter de l’or."
