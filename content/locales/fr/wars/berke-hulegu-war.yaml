# French translations of the catalogue text (wave 7); step bodies follow later.
Berke–Hülegü war: Guerre entre Berké et Houlagou
The first open war between two khanates of the Mongol Empire, fought in the eastern Caucasus between Berke, khan of the Golden Horde, and his cousin Hülegü, founder of the Ilkhanate in Iran. Berke, a convert to Islam, resented the sack of Baghdad, the deaths of Jochid princes in Hülegü’s service and Hülegü’s seizure of Azerbaijan and its pastures, which the Jochids claimed; the two also backed rival candidates in the succession war for the title of Great Khan. In 1262 Berke’s general Nogai crossed the Derbent pass into Shirvan. Hülegü drove him back and took Derbent, but his army was routed on the Terek in January 1263, many drowning when the river ice broke. After Hülegü’s death in 1265 Nogai invaded again and was beaten on the Aksu; Berke died while trying to cross the Kura in 1266. The Derbent–Kura frontier between the two khanates remained a war zone for decades, and Berke’s alliance with the Mamluks of Egypt lasted.: La première guerre ouverte entre deux khanats de l’Empire mongol, menée dans l’est du Caucase entre Berké, khan de la Horde d’or, et son cousin Houlagou, fondateur de l’Ilkhanat en Iran. Berké, converti à l’islam, supportait mal le sac de Bagdad, la mort de princes djötchides au service de Houlagou et la mainmise de celui-ci sur l’Azerbaïdjan et ses pâturages, que revendiquaient les Djötchides ; les deux hommes soutenaient en outre des candidats rivaux dans la guerre de succession pour le titre de grand khan. En 1262, le général de Berké, Nogaï, franchit le défilé de Derbent et pénétra dans le Chirvan. Houlagou le repoussa et prit Derbent, mais son armée fut mise en déroute sur le Terek en janvier 1263, et beaucoup de ses hommes se noyèrent quand la glace du fleuve céda. Après la mort de Houlagou en 1265, Nogaï envahit de nouveau la région et fut battu sur l’Aksou ; Berké mourut en tentant de franchir la Koura en 1266. La frontière entre les deux khanats, de Derbent à la Koura, resta une zone de guerre pendant des décennies, et l’alliance de Berké avec les Mamelouks d’Égypte perdura.
