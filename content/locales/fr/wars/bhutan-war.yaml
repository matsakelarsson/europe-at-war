# French translations of the catalogue text (wave 8); step bodies follow later.
Bhutan War: Guerre du Bhoutan
A war between British India and Bhutan in 1864–1865, also called the Duar War or the Anglo-Bhutan War. It was fought over the Duars, the fertile strip of foothills and plain below the Bhutanese mountains, after years of disputes over Bhutanese raids into Cooch Behar and Sikkim, the humiliation of a British envoy, Ashley Eden, at Punakha in 1864 and British interest in the land for tea. British columns took the forts along the foothills in the winter of 1864–1865; the Bhutanese retook Dewangiri, which the British then won back. By the Treaty of Sinchula of 11 November 1865 Bhutan gave up the Bengal and Assam Duars and the hills east of the Teesta around Kalimpong, about a fifth of its territory, for an annual payment of 50,000 rupees.: Une guerre entre l’Inde britannique et le Bhoutan en 1864–1865, également appelée guerre des Duars ou guerre anglo-bhoutanaise. Elle eut pour enjeu les Duars, la bande fertile de piémont et de plaine qui s’étend au pied des montagnes bhoutanaises, après des années de différends au sujet des raids bhoutanais au Cooch Behar et au Sikkim, l’humiliation infligée à un envoyé britannique, Ashley Eden, à Punakha en 1864 et l’intérêt des Britanniques pour ces terres propices au thé. Des colonnes britanniques prirent les forts du piémont au cours de l’hiver 1864–1865 ; les Bhoutanais reprirent Dewangiri, que les Britanniques reconquirent ensuite. Par le traité de Sinchula du 11 novembre 1865, le Bhoutan céda les Duars du Bengale et de l’Assam ainsi que les collines situées à l’est de la Teesta autour de Kalimpong, soit environ un cinquième de son territoire, en échange d’un versement annuel de 50 000 roupies.
