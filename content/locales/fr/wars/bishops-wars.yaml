"Bishops’ Wars": "Evêques"
"Two short wars between Charles I and the Scottish Covenanters, who had rejected his new prayer book in 1637, signed the National Covenant in 1638 and abolished the bishops of the Church of Scotland. In 1639 the two armies faced each other near Berwick without a battle and agreed the Pacification of Berwick on 18 June. After the Short Parliament refused him money, Charles tried again in 1640, but a Covenanter army under Alexander Leslie crossed the Tweed, routed the King’s troops at Newburn on 28 August and occupied Newcastle and the north-east. By the Treaty of Ripon of 26 October Charles had to pay the Scottish army £850 a day while it stayed, which forced him to summon the Long Parliament; the Treaty of London ended the war in August 1641. The wars opened the Wars of the Three Kingdoms.": "Deux guerres courtes entre Charles Ier et les covenants écossais, qui avaient rejeté son nouveau livre de prière en 1637, ont signé l’Alliance nationale en 1638 et aboli les évêques de l’Église d’Écosse. En 1639, les deux armées se sont affrontées près de Berwick sans bataille et ont accepté la Pacification de Berwick le 18 juin. Après que le Parlement court lui ait refusé de l’argent, Charles essaya à nouveau en 1640, mais une armée d’alliances sous Alexander Leslie traversa le Tweed, roula les troupes du roi à Newburn le 28 août et occupa Newcastle et le nord-est. Par le traité de Ripon du 26 octobre Charles a dû payer l’armée écossaise £850 par jour pendant qu’il restait, ce qui l’a forcé à convoquer le Long Parlement ; le traité de Londres a mis fin à la guerre en août 1641. Les guerres ont ouvert les guerres des trois royaumes."
"Dates are Old Style (Julian), as usual in British history. The story continues in the Wars of the Three Kingdoms.": "Les dates sont Old Style (Julien), comme d’habitude dans l’histoire britannique. L’histoire continue dans les guerres des trois royaumes."
