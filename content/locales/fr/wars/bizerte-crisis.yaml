# French translations of the catalogue text (wave 12); step bodies follow later.
Bizerte crisis: Crise de Bizerte
? A short and bloody clash between Tunisia and France over the naval base of Bizerte, which France had kept when Tunisia became independent in 1956. After the French bombing of Sakiet Sidi Youssef in 1958 France gave up its other bases in Tunisia, but it held on to Bizerte, its great harbour on the Strait of Sicily, while the war in neighbouring Algeria went on. In July 1961, angered by work to lengthen the runway at the base and by France’s refusal to set a date for leaving, President Habib Bourguiba demanded a timetable for withdrawal, and on 19 July Tunisian troops and thousands of volunteers, many of them barely armed, blockaded the base. France flew in paratroopers under Vice-Admiral Maurice Amman; French aircraft, artillery and tanks broke the roadblocks, and on 21–23 July French forces fought their way into the town of Bizerte and took it. The UN Security Council called for a ceasefire on 22 July, and a special session of the General Assembly met on the crisis in August. Tunisia gave its losses as 630 killed and 1,555 wounded, many of them civilians and young volunteers; about 24 French soldiers died. Tunisia broke off relations with France for a time, and the last French forces left Bizerte on 15 October 1963, after the end of the Algerian War, a day Tunisia keeps as Evacuation Day.
: Un affrontement bref et sanglant entre la Tunisie et la France autour de la base navale de Bizerte, que la France avait conservée lorsque la Tunisie était devenue indépendante en 1956. Après le bombardement français de Sakiet Sidi Youssef en 1958, la France renonça à ses autres bases en Tunisie, mais elle garda Bizerte, son grand port sur le détroit de Sicile, alors que la guerre se poursuivait dans l’Algérie voisine. En juillet 1961, irrité par les travaux d’allongement de la piste de la base et par le refus de la France de fixer une date de départ, le président Habib Bourguiba exigea un calendrier de retrait et, le 19 juillet, des troupes tunisiennes et des milliers de volontaires, dont beaucoup étaient à peine armés, firent le blocus de la base. La France y envoya par avion des parachutistes sous le commandement du vice-amiral Maurice Amman ; l’aviation, l’artillerie et les chars français forcèrent les barrages routiers et, du 21 au 23 juillet, les forces françaises pénétrèrent de vive force dans la ville de Bizerte et s’en emparèrent. Le Conseil de sécurité de l’ONU appela à un cessez-le-feu le 22 juillet, et une session extraordinaire de l’Assemblée générale se réunit sur la crise en août. La Tunisie fit état de 630 tués et 1 555 blessés, dont beaucoup de civils et de jeunes volontaires ; environ 24 soldats français moururent. La Tunisie rompit pour un temps ses relations avec la France, et les dernières forces françaises quittèrent Bizerte le 15 octobre 1963, après la fin de la guerre d’Algérie, date que la Tunisie célèbre comme la fête de l’Évacuation.
