# French translations of the catalogue text (wave 14); step bodies follow later.
Black Hawk War: Guerre de Black Hawk
? A war of 1832 between the United States and a band of about 1,100 Sauk, Meskwaki and Kickapoo people led by the Sauk war leader Black Hawk (Makataimeshekiakiak). Black Hawk’s followers, whom the Americans called the British Band, rejected a treaty of 1804 by which a few Sauk and Meskwaki men had ceded their lands east of the Mississippi, including the great Sauk town of Saukenuk on the Rock River. In April 1832 they crossed back into Illinois, hoping for help from the Ho-Chunk and the British. Illinois militia attacked them, and after routing the militia at Stillman’s Run on 14 May the band fled north into what is now Wisconsin, pursued by regulars and militia under General Henry Atkinson, while warriors raided farms and forts. After the rear guard held the pursuers at Wisconsin Heights on 21 July, the band was caught trying to recross the Mississippi at the mouth of the Bad Axe River on 1–2 August, where soldiers, militia and an armed steamboat killed between about 150 and 260 people or more, many of them women and children. About 77 Americans and between 450 and 600 of the band died in the war. Black Hawk surrendered on 27 August, and in September the Sauk, Meskwaki and Ho-Chunk were made to cede more land.
: "Une guerre de 1832 entre les États-Unis et une bande d’environ 1 100 Sauks, Meskwakis et Kickapous menée par le chef de guerre sauk Black Hawk (Makataimeshekiakiak). Les partisans de Black Hawk, que les Américains appelaient la « bande britannique » (British Band), rejetaient un traité de 1804 par lequel quelques hommes sauks et meskwakis avaient cédé leurs terres à l’est du Mississippi, dont la grande ville sauk de Saukenuk, sur la rivière Rock. En avril 1832, ils repassèrent en Illinois, dans l’espoir d’obtenir l’aide des Ho-Chunks et des Britanniques. La milice de l’Illinois les attaqua et, après avoir mis cette milice en déroute à Stillman’s Run le 14 mai, la bande s’enfuit vers le nord, dans l’actuel Wisconsin, poursuivie par des réguliers et des miliciens sous les ordres du général Henry Atkinson, tandis que des guerriers attaquaient fermes et forts. Après que l’arrière-garde eut tenu les poursuivants en respect à Wisconsin Heights le 21 juillet, la bande fut rattrapée alors qu’elle tentait de repasser le Mississippi à l’embouchure de la rivière Bad Axe, les 1er et 2 août : soldats, miliciens et un bateau à vapeur armé y tuèrent entre 150 et 260 personnes environ, voire davantage, dont beaucoup de femmes et d’enfants. Environ 77 Américains et entre 450 et 600 membres de la bande moururent pendant la guerre. Black Hawk se rendit le 27 août et, en septembre, les Sauks, les Meskwakis et les Ho-Chunks furent contraints de céder de nouvelles terres."
