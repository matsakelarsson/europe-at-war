# French translations of the catalogue text (wave 14); step bodies follow later.
Bleeding Kansas: Bleeding Kansas
? "The armed struggle over whether Kansas Territory would enter the Union as a slave state or a free state. The Kansas–Nebraska Act of 1854 repealed the Missouri Compromise line and left the question to the territory’s settlers (“popular sovereignty”), and both sides rushed in. Thousands of Missourians crossed the border to vote in the territorial elections of 1854 and 1855, and the proslavery legislature they elected adopted Missouri’s slave code; antislavery settlers, many sent by the New England Emigrant Aid Company, set up a rival Free-State government at Topeka. Rival governments, constitutions and militias led to raids, ambushes and killings, above all in 1856: the sack of Lawrence, John Brown’s killing of five proslavery men at Pottawatomie Creek, and the fights at Black Jack and Osawatomie. Federal troops and a new governor restored a fragile peace in late 1856, Kansans rejected the proslavery Lecompton Constitution in 1858, and Kansas was admitted as a free state on 29 January 1861. About 56 people were killed in political violence, and the struggle split the Democratic Party and helped bring on the Civil War."
: "La lutte armée pour décider si le territoire du Kansas entrerait dans l’Union comme État esclavagiste ou comme État libre. La loi Kansas-Nebraska de 1854 abrogea la ligne du compromis du Missouri et laissa la question aux colons du territoire (la « souveraineté populaire »), et les deux camps s’y précipitèrent. Des milliers de Missouriens franchirent la frontière pour voter aux élections territoriales de 1854 et 1855, et la législature proesclavagiste qu’ils élurent adopta le code des esclaves du Missouri ; les colons antiesclavagistes, dont beaucoup avaient été envoyés par la New England Emigrant Aid Company, établirent à Topeka un gouvernement rival, celui de l’État libre (Free-State). Gouvernements, constitutions et milices rivaux entraînèrent raids, embuscades et meurtres, surtout en 1856 : le sac de Lawrence, le meurtre de cinq hommes proesclavagistes par John Brown à Pottawatomie Creek, et les combats de Black Jack et d’Osawatomie. Les troupes fédérales et un nouveau gouverneur rétablirent une paix fragile à la fin de 1856, les Kansans rejetèrent la constitution proesclavagiste de Lecompton en 1858, et le Kansas fut admis comme État libre le 29 janvier 1861. Environ 56 personnes furent tuées dans les violences politiques, et la lutte divisa le Parti démocrate et contribua au déclenchement de la guerre de Sécession."
