"1604–1606": "1604–1606"
"By 1604 the long war had ruined much of Hungary, and Rudolf II’s government was using treason trials to seize the estates of rich nobles, while in Upper Hungary churches were taken from the Protestants; in January 1604 the cathedral of Kassa was handed to the Catholics. In the autumn the imperial commander Giovanni Giacomo Barbiano di Belgioioso moved against István Bocskai, a magnate and former Transylvanian commander whose letters to exiles in Ottoman territory had been intercepted. Bocskai won over the hajdús, cattle drovers turned frontier soldiers, and on the night of 14–15 October they routed an imperial force near Álmosd and Diószeg. In November Kassa opened its gates to him.": "En 1604, la longue guerre avait ruiné une grande partie de la Hongrie, et le gouvernement Rudolf II utilisait les procès de trahison pour saisir les domaines des nobles riches, tandis que dans la Haute-Hongrie les églises étaient prises aux protestants ; en janvier 1604 la cathédrale de Kassa fut remise aux catholiques. À l’automne, le commandant impérial Giovanni Giacomo Barbiano di Belgioioso s’est déplacé contre István Bocskai, un magnat et ancien commandant transylvanien dont les lettres aux exilés en territoire ottoman avaient été interceptées. Bocskai a gagné sur les hajdús, les conducteurs de bétail ont tourné les soldats de la frontière, et dans la nuit du 14 au 15 octobre ils ont acheminé une force impériale près d’Almosd et Diószeg. En novembre Kassa lui a ouvert ses portes."
"Giorgio Basta, brought back from the Ottoman front, beat the rebels at Osgyán but could not take Kassa, and in the spring of 1605 he withdrew to Pozsony. Bocskai’s forces overran Upper Hungary and the lands east of the Tisza, and hajdú raiders plundered Moravia, Lower Austria and Styria. The Transylvanian estates elected him prince in February 1605, and the Hungarian diet at Szerencs made him prince of Hungary in April. In November the grand vizier Lala Mehmed Pasha gave him a crown, which he accepted only as a gift. He chose to negotiate, and on 23 June 1606 the Peace of Vienna restored the Hungarian estates’ rights, allowed Protestants to worship freely and left Transylvania and several eastern counties to Bocskai.": "Giorgio Basta, ramené du front ottoman, bat les rebelles à Osgyán mais ne peut pas prendre Kassa, et au printemps de 1605 il se retire à Pozsony. Les forces de Bocskaï envahissent la Haute Hongrie et les terres à l’est de la Tisza, et les raideurs hajdú pillent la Moravie, la Basse-Autriche et la Styrie. Les domaines transylvaniens l’ont élu prince en février 1605, et le régime hongrois à Szerencs l’a fait prince de Hongrie en avril. En novembre le grand vizier Lala Mehmed Pasha lui a donné une couronne, qu’il n’acceptait que comme cadeau. Il choisit de négocier et, le 23 juin 1606, la paix de Vienne rétablit les droits des propriétés hongroises, permit aux protestants d’adorer librement et quitta la Transylvanie et plusieurs comtés de l’est à Bocskaï."
