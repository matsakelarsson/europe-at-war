# Some French text was translated automatically.
"Bocskai Uprising": "Le soulèvement de Bocskaï"
"A revolt in Royal Hungary and Transylvania against Emperor Rudolf II, led by the Calvinist magnate István Bocskai during the Long Turkish War. Provoked by treason trials, confiscations and the seizure of Protestant churches, it was carried by the hajdús, free soldiers of the frontier, and backed by the Ottomans. Bocskai was elected prince of Transylvania and of Hungary, and the Peace of Vienna of 1606 guaranteed the estates’ rights and freedom of worship.": "Une révolte en Hongrie royale et en Transylvanie contre l’empereur Rudolf II, dirigé par le magnat calviniste István Bocskaï pendant la longue guerre turque. Provoché par les procès de trahison, les confiscations et la saisie des églises protestantes, il a été porté par les hajdús, les soldats libres de la frontière, et soutenu par les Ottomans. Bocskaï fut élu prince de Transylvanie et de Hongrie, et la paix de Vienne de 1606 garantissait les droits et la liberté de culte."
"Dates are Gregorian. Hungarian historians call the revolt Bocskai’s War of Independence. The Long Turkish War, of which it was part, has its own entry.": "Les historiens hongrois appellent la révolte Bocskaï la guerre d’indépendance. La longue guerre turque, dont elle faisait partie, a sa propre entrée."
"Bocskai died in Kassa on 29 December 1606, a few weeks after the Peace of Zsitvatorok ended the Long Turkish War. His followers suspected poison and killed his chancellor, Mihály Káthay. Shortly before his death he settled thousands of hajdús as a privileged free community in the Hajdúság region.": "Bocskaï mourut à Kassa le 29 décembre 1606, quelques semaines après la fin de la longue guerre turque. Ses disciples soupçonnaient de poison et tuèrent son chancelier, Mihály Káthay. Peu avant sa mort, il s’installa dans une communauté libre privilégiée dans la région de Hajdúság."
