# Some French text was translated automatically.
"Bohemian War, 1468–1478": "Guerre de Bohême, 1468-1478"
"A war for the crown of Bohemia between King Matthias Corvinus of Hungary and the Utraquist King George of Poděbrady, whom Pope Paul II had condemned as a heretic and declared deposed in 1466. Matthias invaded Moravia in 1468 at the call of the Catholic lords and was elected king of Bohemia by them at Olomouc in 1469, but he never took Prague. When George died in 1471 the Bohemian estates chose the Polish prince Vladislaus II Jagiellon, and Poland joined the war. In the peace of Brno in 1478, confirmed at Olomouc in 1479, both kings kept the title; Vladislaus ruled Bohemia itself, and Matthias kept Moravia, Silesia and the two Lusatias, which Bohemia could buy back for 400,000 florins after his death.": "Une guerre pour la couronne de Bohême entre le roi Matthias Corvinus de Hongrie et l’Utraquis Roi George de Poděbrady, que le pape Paul II avait condamné comme hérétique et déclaré déposé en 1466. Matthias envahit la Moravie en 1468 à l’appel des seigneurs catholiques et fut élu roi de Bohème par eux à Olomouc en 1469, mais il ne prit jamais Prague. À la mort de George en 1471, les domaines bohèmes ont choisi le prince polonais Vladislaus II Jagiellon, et la Pologne s’est jointe à la guerre. Dans la paix de Brno en 1478, confirmé à Olomouc en 1479, les deux rois gardaient le titre ; Vladislas gouvernait la Bohême elle-même, et Matthias conservait la Moravie, la Silésie et les deux Lusaties, que la Bohème pouvait racheter pour 400 000 florins après sa mort."
"Dates are Julian, as usual for the period. The Catholic lords had formed the League of Zelená Hora against George in 1465. Matthias, George’s former son-in-law, had the backing of the pope and at first of Emperor Frederick III.": "Les dates sont Julian, comme d’habitude pour l’époque. Les seigneurs catholiques avaient formé la Ligue de Zelená Hora contre George en 1465. Matthias, George, ancien gendre, avait le soutien du pape et au début de l’empereur Frédéric III."
"In February 1469 George’s army trapped Matthias near Vilémov, and the two kings met and agreed a truce, which Matthias soon broke. In 1474 Vladislaus and his father, Casimir IV of Poland, besieged Matthias in Breslau without success. Matthias died in 1490, Vladislaus succeeded him as king of Hungary, and the crown lands returned to Bohemia.": "En février 1469, l’armée de George a piégé Matthias près de Vilemov, et les deux rois se sont rencontrés et ont convenu d’une trêve, que Matthias a bientôt rompu. Matthias mourut en 1490, Vladislas lui succéda comme roi de Hongrie, et les terres de la couronne retournèrent à Bohême."
