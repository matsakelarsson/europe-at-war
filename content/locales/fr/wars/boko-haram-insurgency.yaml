# French translations of the catalogue text (wave 13); step bodies follow later.
Boko Haram insurgency: Insurrection de Boko Haram
? "The jihadist insurgency centred on Borno State in north-eastern Nigeria and the Lake Chad basin. Boko Haram, a Salafi movement founded in Maiduguri by the preacher Mohammed Yusuf, rose in July 2009; the army crushed the rising and Yusuf was killed in police custody. Under Abubakar Shekau the movement turned to bombings, assassinations and mass killings, abducted 276 schoolgirls from Chibok in April 2014 and by early 2015 held a large part of Borno and neighbouring states, which it declared a caliphate. Shekau pledged allegiance to the Islamic State in March 2015. A counter-offensive by Nigeria, Chad, Cameroon and Niger, later the Multinational Joint Task Force, retook the towns in 2015, but in 2016 the movement split: the Islamic State West Africa Province (ISWAP) built a base on the shores and islands of Lake Chad and attacked army bases, while Shekau’s faction (JAS) kept the Sambisa forest and the Mandara mountains. ISWAP overran Sambisa in May 2021 and Shekau died. After a lull, attacks by both factions rose again from 2024; the United States joined Nigeria in air strikes from December 2025, and fighting continued in 2026 in Borno, around Lake Chad and in Cameroon’s Far North. By the UN’s estimates the war has killed tens of thousands of people directly and, with hunger and disease, about 350,000 by the end of 2020, and has displaced some two million people in north-eastern Nigeria."
: "L’insurrection djihadiste centrée sur l’État de Borno, dans le nord-est du Nigeria, et sur le bassin du lac Tchad. Boko Haram, mouvement salafiste fondé à Maiduguri par le prédicateur Mohammed Yusuf, se souleva en juillet 2009 ; l’armée écrasa le soulèvement, et Yusuf fut tué en garde à vue. Sous Abubakar Shekau, le mouvement se tourna vers les attentats à la bombe, les assassinats et les tueries de masse, enleva 276 lycéennes à Chibok en avril 2014 et, au début de 2015, tenait une grande partie du Borno et des États voisins, où il proclama un califat. Shekau prêta allégeance à l’État islamique en mars 2015. Une contre-offensive du Nigeria, du Tchad, du Cameroun et du Niger, réunis plus tard au sein de la Force multinationale mixte, reprit les villes en 2015, mais en 2016 le mouvement se scinda : l’État islamique en Afrique de l’Ouest (ISWAP) établit une base sur les rives et les îles du lac Tchad et attaqua des bases de l’armée, tandis que la faction de Shekau (JAS) conservait la forêt de Sambisa et les monts Mandara. L’ISWAP s’empara de Sambisa en mai 2021, et Shekau y trouva la mort. Après une accalmie, les attaques des deux factions reprirent à partir de 2024 ; les États-Unis se joignirent au Nigeria pour mener des frappes aériennes à partir de décembre 2025, et les combats se sont poursuivis en 2026 dans le Borno, autour du lac Tchad et dans l’Extrême-Nord du Cameroun. Selon les estimations de l’ONU, la guerre a fait directement des dizaines de milliers de morts et, en comptant la faim et la maladie, environ 350 000 à la fin de 2020, et elle a déplacé quelque deux millions de personnes dans le nord-est du Nigeria."
