# Some French text was translated automatically.
"Bolotnikov rebellion": "Rébellion de Bolotnikov"
"A rising in Russia’s Time of Troubles, led by Ivan Bolotnikov, a former slave and galley oarsman, in the name of the supposedly surviving Tsar Dmitry and against Tsar Vasily Shuisky. His army of Cossacks, runaway peasants, townsmen and provincial gentry marched from Putyvl and besieged Moscow in late 1606, but fell back after the gentry of Ryazan and Tula went over to the tsar, and surrendered at Tula in October 1607.": "Une montée en Russie Temps des Troubles, conduit par Ivan Bolotnikov, un ancien esclave et rameur de galère, au nom du Tsar Dmitry supposé survivre et contre le Tsar Vasily Shuisky. Son armée de cosaques, de paysans fugueurs, d’hommes de villes et de genterie provinciale marcha de Putyvl et assiégea Moscou à la fin de 1606, mais tomba après que le gentry de Ryazan et Tula passa au tsar, et se rendit à Tula en octobre 1607."
"Dates are Julian (Old Style). Putyvl, where the rising began, is in Ukraine today.": "Les dates sont Julian (Ancien Style). Putyvl, où la montée a commencé, est en Ukraine aujourd'hui."
"The rebels claimed to fight for Tsar Dmitry, said to have escaped when the first False Dmitry was killed in Moscow in May 1606. A second pretender, the self-styled Tsarevich Peter, joined them at Tula in 1607. Bolotnikov was later blinded and drowned at Kargopol.": "Les rebelles prétendaient se battre pour le Tsar Dmitry, qui aurait fui lorsque le premier Faux Dmitry a été tué à Moscou en mai 1606. Un second prétendant, le Tsarevich Peter auto-qualifié, les rejoignit à Tula en 1607. Bolotnikov fut plus tard aveugle et noyé à Kargopol."
