# French translations of the catalogue text (wave 12); step bodies follow later.
Bombardment of Algiers: Bombardement d’Alger
? "The bombardment of Algiers on 27 August 1816 by a British and Dutch fleet under Admiral Lord Exmouth, to force the dey to free his European captives and give up taking Christians as slaves. After the Napoleonic Wars, Britain no longer needed the regencies’ goodwill, and pressure was growing in Europe to end the enslavement of Christian captives. In the spring of 1816 Exmouth won agreements from Tunis and Tripoli and a partial one from Algiers, but soon afterwards Algerian troops at Bône (Annaba) killed some 200 Corsican, Sicilian and Sardinian coral fishermen under British protection. Exmouth returned with five ships of the line, frigates, sloops and bomb vessels, joined at Gibraltar by a Dutch squadron of five frigates under Vice-Admiral Theodorus van Capellen. When an Algerian battery opened fire at about 3 p.m., the fleet, anchored close to the mole, silenced the harbour batteries and burned the Algerian ships before withdrawing out of range that night. The British lost 141 killed and 742 wounded, the Dutch 13 killed and 52 wounded; estimates of the Algerian dead, soldiers and civilians, range from 300 to 2,000. Dey Omar Agha accepted Exmouth’s terms, and a treaty was signed on 24 September: he freed 1,083 Christian captives at once, and over 3,000 in all, returned the ransom money he had taken earlier in the year, and renounced the enslavement of Christians. Algiers rebuilt its defences, the taking of captives did not wholly stop under later deys, and a British fleet returned under threat in 1824; the corsair war ended with the French conquest of Algiers in 1830."
: "Le bombardement d’Alger, le 27 août 1816, par une flotte britannique et néerlandaise sous les ordres de l’amiral lord Exmouth, pour contraindre le dey à libérer ses captifs européens et à renoncer à réduire des chrétiens en esclavage. Après les guerres napoléoniennes, la Grande-Bretagne n’avait plus besoin de la bienveillance des régences, et la pression grandissait en Europe pour mettre fin à l’esclavage des captifs chrétiens. Au printemps 1816, Exmouth obtint des accords de Tunis et de Tripoli et un accord partiel d’Alger, mais peu après, à Bône (Annaba), des troupes algériennes tuèrent quelque 200 pêcheurs de corail corses, siciliens et sardes placés sous protection britannique. Exmouth revint avec cinq vaisseaux de ligne, des frégates, des sloops et des galiotes à bombes, et fut rejoint à Gibraltar par une escadre néerlandaise de cinq frégates sous le vice-amiral Theodorus van Capellen. Lorsqu’une batterie algérienne ouvrit le feu vers 15 heures, la flotte, mouillée tout près du môle, réduisit au silence les batteries du port et incendia les navires algériens avant de se retirer hors de portée dans la nuit. Les Britanniques perdirent 141 tués et 742 blessés, les Néerlandais 13 tués et 52 blessés ; les estimations des morts algériens, soldats et civils, vont de 300 à 2 000. Le dey Omar Agha accepta les conditions d’Exmouth, et un traité fut signé le 24 septembre : il libéra sur-le-champ 1 083 captifs chrétiens, et plus de 3 000 au total, restitua les rançons qu’il avait perçues plus tôt dans l’année et renonça à l’esclavage des chrétiens. Alger reconstruisit ses défenses, la prise de captifs ne cessa pas entièrement sous les deys suivants, et une flotte britannique revint en 1824 pour exercer des menaces ; la guerre de course prit fin avec la conquête française d’Alger en 1830."
