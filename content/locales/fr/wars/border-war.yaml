# French translations of the catalogue text (wave 14); step bodies follow later.
Mexican Border War: Guerre de la frontière mexicaine
? The armed clashes along and across the border between Mexico and the United States during the Mexican Revolution, from 1910 to 1919. The name is used in US unit and popular history; Mexican histories treat the same fighting as US involvement in Mexico’s civil war, and there was never a declared war. Battles between Mexican factions spilled over the line at Ciudad Juárez, Agua Prieta, Nogales and Naco, and the United States sent troops to the border from 1911. In 1915 raiders acting under the Plan of San Diego struck ranches and railways in the Lower Rio Grande Valley of Texas, and Texas Rangers, posses and some soldiers answered by killing hundreds, possibly thousands, of Mexicans and Mexican Americans, a time Tejanos remember as la matanza. After the United States recognised Venustiano Carranza’s government, Pancho Villa’s men killed American mining employees at Santa Isabel and on 9 March 1916 raided Columbus, New Mexico. General John J. Pershing led a punitive expedition of up to about 10,000 men into Chihuahua that never caught Villa and nearly led to war with Carranza’s government after the fight at Carrizal; more than 100,000 National Guardsmen were called to the border. Pershing withdrew in February 1917. The killings at Porvenir in 1918, the battle of Ambos Nogales in August 1918 and the US crossing to drive Villa from Ciudad Juárez in June 1919 were the last large clashes.
: Les affrontements armés le long de la frontière entre le Mexique et les États-Unis, et de part et d’autre de celle-ci, pendant la révolution mexicaine, de 1910 à 1919. Ce nom est employé aux États-Unis dans l’histoire des unités militaires et dans l’histoire populaire ; les histoires mexicaines traitent ces mêmes combats comme une implication des États-Unis dans la guerre civile mexicaine, et il n’y eut jamais de déclaration de guerre. Les batailles entre factions mexicaines débordèrent de l’autre côté de la frontière à Ciudad Juárez, Agua Prieta, Nogales et Naco, et les États-Unis envoyèrent des troupes à la frontière à partir de 1911. En 1915, des assaillants agissant au nom du plan de San Diego frappèrent des ranchs et des voies ferrées dans la basse vallée du Rio Grande, au Texas, et les Texas Rangers, des posses de citoyens armés et quelques soldats répliquèrent en tuant des centaines, peut-être des milliers, de Mexicains et d’Américains d’origine mexicaine, une période dont les Tejanos se souviennent sous le nom de la matanza. Après la reconnaissance du gouvernement de Venustiano Carranza par les États-Unis, les hommes de Pancho Villa tuèrent des employés miniers américains à Santa Isabel et, le 9 mars 1916, attaquèrent Columbus, au Nouveau-Mexique. Le général John J. Pershing mena dans le Chihuahua une expédition punitive comptant jusqu’à environ 10 000 hommes, qui ne captura jamais Villa et faillit provoquer une guerre avec le gouvernement de Carranza après l’affrontement de Carrizal ; plus de 100 000 gardes nationaux furent appelés à la frontière. Pershing se retira en février 1917. Les tueries de Porvenir en 1918, la bataille d’Ambos Nogales en août 1918 et le franchissement de la frontière par les États-Unis pour chasser Villa de Ciudad Juárez en juin 1919 furent les derniers grands affrontements.
