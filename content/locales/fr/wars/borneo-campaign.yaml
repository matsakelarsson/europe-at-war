# French translations of the catalogue text (wave 11); step bodies follow later.
Borneo campaign (1945): Campagne de Bornéo (1945)
? The Allied reconquest of parts of Borneo from Japan in the last months of the Second World War, codenamed Oboe and fought mainly by the Australian I Corps, with American naval and air support and Dutch colonial troops. The 26th Brigade landed on the oil island of Tarakan on 1 May 1945 and took it in weeks of hard fighting; the 9th Division landed on Labuan and around Brunei Bay on 10 June and took Brunei town, Beaufort and the oilfields of Seria and Miri; and the 7th Division landed at Balikpapan on 1 July in the largest amphibious operation carried out by Australian forces. Australian special forces parachuted into the interior, where Dayak and other peoples fought the Japanese with them. The campaign cost about 570 Australian dead and several thousand Japanese; its strategic value was disputed then and since, as the war ended before the oilfields could be used. Before the landings the Japanese had marched the Allied prisoners of Sandakan inland to Ranau in the Sandakan death marches of January–June 1945; of some 2,400 Australian and British prisoners, only six, all Australians who escaped, survived. Japanese forces in Borneo surrendered in September 1945.
: La reconquête par les Alliés d’une partie de Bornéo sur le Japon dans les derniers mois de la Seconde Guerre mondiale, sous le nom de code Oboe, menée principalement par le Ier corps australien avec l’appui naval et aérien américain et des troupes coloniales néerlandaises. La 26e brigade débarqua sur l’île pétrolière de Tarakan le 1er mai 1945 et s’en empara au terme de plusieurs semaines de durs combats ; la 9e division débarqua à Labuan et autour de la baie de Brunei le 10 juin et prit la ville de Brunei, Beaufort et les champs pétrolifères de Seria et de Miri ; et la 7e division débarqua à Balikpapan le 1er juillet, lors de la plus grande opération amphibie jamais menée par les forces australiennes. Des forces spéciales australiennes furent parachutées dans l’intérieur, où des Dayaks et d’autres peuples combattirent les Japonais à leurs côtés. La campagne coûta environ 570 morts australiens et plusieurs milliers de morts japonais ; sa valeur stratégique fut contestée à l’époque comme par la suite, car la guerre prit fin avant que les champs pétrolifères puissent être exploités. Avant les débarquements, les Japonais avaient fait marcher les prisonniers alliés de Sandakan vers l’intérieur, jusqu’à Ranau, lors des marches de la mort de Sandakan de janvier à juin 1945 ; sur quelque 2 400 prisonniers australiens et britanniques, six seulement survécurent, tous des Australiens qui s’étaient évadés. Les forces japonaises de Bornéo capitulèrent en septembre 1945.
