# French translations of the catalogue text (wave 10); step bodies follow later.
Boshin War: Guerre de Boshin
? The civil war of 1868–1869 in which the new imperial government, led by men of the Satsuma and Chōshū domains, destroyed the power of the Tokugawa shogunate and its allies. The shogun Tokugawa Yoshinobu had handed back his powers to the emperor in November 1867, hoping to keep his lands and a leading place in a council of lords, but on 3 January 1868 Satsuma and its allies seized the palace in Kyoto and proclaimed the restoration of imperial rule. Yoshinobu’s march on Kyoto was beaten at Toba and Fushimi in late January, and when the imperial banner appeared on the battlefield he fled to Edo. The imperial army marched east, and in May 1868 Katsu Kaishū surrendered Edo Castle without a fight. In the north-east more than thirty domains formed the Ōuetsu Reppan Dōmei (the Northern Alliance) around Sendai and Aizu; they were defeated in a summer and autumn of hard fighting at Shirakawa, Nagaoka and Bonari Pass, and Aizu-Wakamatsu fell after a month’s siege on 6 November 1868. Enomoto Takeaki took most of the shogunate’s navy and some French officers to Ezo (Hokkaido), took Hakodate and Matsumae and set up the Republic of Ezo, which surrendered at Goryōkaku on 27 June 1869. The war, named after the year of the earth dragon (boshin) in which it began, cost about 8,200 lives; it gave the Meiji government control of the whole country and opened the way to the abolition of the domains in 1871.
: La guerre civile de 1868–1869 au cours de laquelle le nouveau gouvernement impérial, dirigé par des hommes des domaines de Satsuma et de Chōshū, détruisit le pouvoir du shogunat Tokugawa et de ses alliés. Le shogun Tokugawa Yoshinobu avait remis ses pouvoirs à l’empereur en novembre 1867, dans l’espoir de conserver ses terres et une place de premier plan dans un conseil de seigneurs, mais le 3 janvier 1868, Satsuma et ses alliés s’emparèrent du palais de Kyoto et proclamèrent la restauration du pouvoir impérial. La marche de Yoshinobu sur Kyoto fut brisée à Toba et Fushimi à la fin de janvier et, lorsque la bannière impériale apparut sur le champ de bataille, il s’enfuit à Edo. L’armée impériale marcha vers l’est et, en mai 1868, Katsu Kaishū rendit le château d’Edo sans combat. Dans le nord-est, plus de trente domaines formèrent l’Ōuetsu Reppan Dōmei (l’Alliance du Nord) autour de Sendai et d’Aizu ; ils furent vaincus au terme d’un été et d’un automne de durs combats à Shirakawa, à Nagaoka et au col de Bonari, et Aizu-Wakamatsu tomba le 6 novembre 1868 après un mois de siège. Enomoto Takeaki emmena la plus grande partie de la marine du shogunat et quelques officiers français à Ezo (Hokkaido), prit Hakodate et Matsumae et fonda la République d’Ezo, qui capitula à Goryōkaku le 27 juin 1869. La guerre, qui tire son nom de l’année du dragon de terre (boshin) au cours de laquelle elle commença, coûta environ 8 200 vies ; elle donna au gouvernement Meiji le contrôle de tout le pays et ouvrit la voie à l’abolition des domaines en 1871.
