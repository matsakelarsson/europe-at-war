# Some French text was translated automatically.
"Bosnian Uprising of 1831–1832": "Inauguration bosniaque de 1831–1832"
"A revolt of Bosnia’s Muslim notables, the ayans and hereditary captains, led by Husein Gradaščević, captain of Gradačac, against Sultan Mahmud II’s centralising reforms, which threatened their privileges, and against the Treaty of Adrianople’s promise of six districts to autonomous Serbia. The rebels drove out the governor, marched into Kosovo and beat the grand vizier near Štimlje on 18 July 1831, and an assembly in Sarajevo proclaimed Gradaščević vizier of Bosnia. Herzegovinian captains under Ali-paša Rizvanbegović and Smail-aga Čengić stayed loyal, and their troops helped an Ottoman army defeat the rebels at Stup outside Sarajevo on 4 June 1832. Gradaščević fled to Austria, and in 1833 Herzegovina became a separate province under Rizvanbegović.": "Une révolte des notables musulmans de Bosnie, des ayans et des capitaines héréditaires, dirigée par Husein Gradaščević, capitaine de Gradačac, contre les réformes centralisatrices du Sultan Mahmud II, qui menaçaient leurs privilèges, et contre la promesse de six districts à la Serbie autonome. Les rebelles ont chassé le gouverneur, ont marché au Kosovo et battu le grand vizir près de Štimlje le 18 juillet 1831, et une assemblée à Sarajevo a proclamé Gradaščević vizier de Bosnie. Les capitaines d’Herzegovini sous Ali-paša Rizvanbegović et Smail-aga Čengić sont restés fidèles, et leurs troupes ont aidé une armée ottomane à vaincre les rebelles à Stup en dehors de Sarajevo le 4 juin 1832. Gradaščević a fui vers l’Autriche, et en 1833 Herzégovine est devenu une province séparée sous Rizvanbegović."
"Gradaščević is remembered by Bosniaks as the “Dragon of Bosnia” (Zmaj od Bosne) and a champion of Bosnian autonomy; other historians see the rising mainly as a conservative revolt of the Muslim nobility against reform. Some sources date the end of the rising to 1833, when the last captaincies submitted.": "Gradaščević est connu par les Bosniaques comme le dragon de Bosnie (Zmaj od Bosne) et un champion de l’autonomie bosniaque ; d’autres historiens voient la montée principalement comme une révolte conservatrice de la noblesse musulmane contre la réforme."
