"Uzdol and Grabovica": "Uzdol et Grabovica"
"8–14 September 1993": "8–14 septembre 1993"
"During the Bosnian army’s Neretva ’93 offensive its troops killed at least 29 Croat villagers at Uzdol and, the ICTY found, 13 at Grabovica.": "Lors de l’offensive de Neretva 93, ses troupes ont tué au moins 29 villageois croates à Uzdol et, selon le TPIY, 13 à Grabovica."
"Stupni Do": "Stupni Do"
"23 October 1993": "23 octobre 1993"
"HVO units under Ivica Rajić killed at least 37 Bosniak villagers and burned the village; Rajić pleaded guilty before the ICTY.": "Des unités du HVO sous Ivica Rajić ont tué au moins 37 villageois bosniaques et brûlé le village ; Rajić a plaidé coupable devant le TPIY."
"Velika Kladuša": "Velika Kladuša"
