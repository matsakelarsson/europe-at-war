"The siege of Sarajevo": "Le siège de Sarajevo"
"April 1992 – February 1996": "avril 1992 – février 1996"
"From April 1992 JNA and Bosnian Serb forces, some 13,000 men at first, ringed Sarajevo from the surrounding hills and held suburbs such as Ilidža and part of Grbavica. An attack to cut the city in two failed on 2 May. The next day the JNA seized Izetbegović at the airport, and Bosnian fighters attacked the army column leaving the city in exchange for his release. The JNA’s Bosnian units became the Army of Republika Srpska under Ratko Mladić, and on 29 June the airport was handed to the UN for an airlift that lasted more than three years.": "À partir d’avril 1992, la JNA et les forces serbes de Bosnie, dont 13 000 hommes au début, ont sonné Sarajevo depuis les collines environnantes et tenu des banlieues telles qu’Ilidža et une partie de Grbavica. L’attaque visant à couper la ville en deux a échoué le 2 mai. Le lendemain, la JNA a saisi Izetbegović à l’aéroport, et des combattants bosniaques ont attaqué la colonne de l’armée quittant la ville en échange de sa libération. Les unités bosniaques de la JNA sont devenues l’armée de la Republika Srpska sous Ratko Mladić, et le 29 juin l’aéroport a été remis à l’ONU pour un transport aérien qui a duré plus de trois ans."
"The siege lasted 1,425 days, until 29 February 1996. On average 329 shells a day struck the city, which lived for long periods without water, power or gas; the National Library burned with most of its collection in August 1992. From mid-1993 a tunnel under the airport runway was the only land link to the outside. About 13,952 people were killed, 5,434 of them civilians. The ICTY convicted the Sarajevo commanders Stanislav Galić and Dragomir Milošević of terrorising civilians, and Karadžić and Mladić for the siege.": "Le siège a duré 1 425 jours, jusqu’au 29 février 1996. En moyenne 329 obus par jour ont frappé la ville, qui a vécu de longues périodes sans eau, ni électricité ni gaz ; la Bibliothèque nationale a brûlé avec la majeure partie de sa collection en août 1992. Le TPIY a condamné les commandants de Sarajevo Stanislav Galić et Dragomir Milošević pour avoir terrorisé des civils, ainsi que Karadžić et Mladić pour le siège."
