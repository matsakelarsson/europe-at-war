"January – April 1992": "janvier – avril 1992"
"In 1991 Bosnia and Herzegovina was 44 per cent Bosniak, 32.5 per cent Serb and 17 per cent Croat. As Yugoslavia broke up, Radovan Karadžić’s Serb Democratic Party rejected independence, and on 9 January 1992 Bosnian Serb deputies proclaimed a Serb republic that would stay in Yugoslavia. In a referendum on 29 February and 1 March, which most Serbs boycotted or were prevented from joining, 99.7 per cent of those voting, on a 64 per cent turnout, chose independence. President Alija Izetbegović declared it on 3 March.": "En 1991, la Bosnie-Herzégovine comptait 44 % de Bosniaques, 32,5 % de Serbes et 17 % de Croates. Alors que la Yougoslavie s’est disloquée, le Parti démocratique serbe Radovan Karadžić a rejeté l’indépendance et, le 9 janvier 1992, les députés serbes de Bosnie ont proclamé une république serbe qui resterait en Yougoslavie. Lors d’un référendum organisé le 29 février et le 1er mars, auquel la plupart des Serbes ont boycotté ou empêché l’adhésion, 99,7 % des votants, sur une participation de 64 %, ont choisi l’indépendance, que le Président Alija Izetbegović a déclarée le 3 mars."
"Barricades went up in Sarajevo, and violence spread. On 26 March Croat and Bosniak fighters killed some nine to eleven Serb civilians at Sijekovac near Bosanski Brod. On 1–2 April Arkan’s Serb Volunteer Guard and local paramilitaries took Bijeljina, killing dozens of Bosniak civilians. On 5 April Serb gunmen fired on a peace march in Sarajevo, killing Suada Dilberović and Olga Sučić on the Vrbanja bridge. The next day the European Community and the United States recognised Bosnia, and Serb forces began shelling the capital.": "Le 26 mars, des combattants croates et bosniaques ont tué entre neuf et onze civils serbes à Sijekovac près de Bosanski Brod. Le 1er et le 2 avril, Arkan a pris Bijeljina, tuant des dizaines de civils bosniaques. Le 5 avril, des hommes armés serbes ont tiré sur une marche de la paix à Sarajevo, tuant Suada Dilberović et Olga Sučić sur le pont de Vrbanja. Le lendemain, la Communauté européenne et les États-Unis ont reconnu la Bosnie, et les forces serbes ont commencé à bombarder la capitale."
