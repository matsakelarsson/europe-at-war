"Mrkonjić Grad": "Mrkonjić Grad"
"10 October 1995": "10 octobre 1995"
"Taken in Southern Move; a mass grave found after the war held the bodies of 181 Serbs, mostly civilians.": "Pris dans Southern Move ; une fosse commune trouvée après la guerre contenait les corps de 181 Serbes, principalement des civils."
"Deliberate Force": "Force délibérante"
"Mistral 2": "Mistral 2"
"Operation Sana": "Opération Sana"
"Southern Move": "Déplacement au sud"
"Taken by Croatian and HVO forces, September–October 1995 (approximate)": "Prise par les forces croates et du HVO, septembre-octobre 1995 (approximative)"
"Taken by the Bosnian army, August–October 1995 (approximate)": "Prise par l’armée bosniaque, août-octobre 1995 (approximative)"
"Held by Bosnian Serb forces at the ceasefire, 12 October 1995 (approximate)": "Tenue par les forces serbes de Bosnie au cessez-le-feu, le 12 octobre 1995 (approximative)"
"Dayton": "États-Unis d’Amérique"
"November 1995 – March 1996": "novembre 1995 – mars 1996"
"Peace talks opened on 1 November 1995 at an air base in Dayton, Ohio, led by the Americans Warren Christopher and Richard Holbrooke, with Izetbegović, Tuđman and Serbia’s Slobodan Milošević, who spoke for the Bosnian Serbs. The agreement was initialled on 21 November and signed in Paris on 14 December. Bosnia and Herzegovina remained one state, made up of the Federation with 51 per cent of its land and Republika Srpska with 49. Sarajevo was reunited under the Federation, Goražde was joined to it by a corridor, and the status of Brčko was left to arbitration.": "Les pourparlers de paix ont débuté le 1er novembre 1995 dans une base aérienne de Dayton, en Ohio, dirigée par les Américains Warren Christopher et Richard Holbrooke, avec Izetbegović, Tuшman et Serbias Slobodan Milošević, qui s’est exprimé au nom des Serbes de Bosnie. La Bosnie-Herzégovine est restée un État, composé de la Fédération avec 51 % de ses terres et la Republika Srpska avec 49. Sarajevo a été réunie sous la Fédération, Goražde y a été rejoint par un couloir, et le statut de Brčko a été laissé à l’arbitrage."
"A NATO-led Implementation Force of some 60,000 troops replaced the UN from 20 December, and a High Representative oversaw civilian affairs. As the Serb-held suburbs of Sarajevo passed to the Federation, most of their Serb residents left, and the siege formally ended on 29 February 1996. Around 100,000 people had been killed, 2.2 million displaced and an estimated 12,000–50,000 women raped. Dayton ended the war but also entrenched the ethnic division it had produced.": "Une force de mise en oeuvre dirigée par l’OTAN, composée d’environ 60 000 soldats, a remplacé l’ONU à partir du 20 décembre et un haut représentant a supervisé les affaires civiles. Alors que la banlieue serbe de Sarajevo est passée à la Fédération, la plupart de ses résidents serbes sont partis, et le siège s’est officiellement terminé le 29 février 1996. Environ 100 000 personnes ont été tuées, 2,2 millions de personnes déplacées et environ 12 000 à 50 000 femmes violées. Dayton a mis fin à la guerre mais a également enraciné la division ethnique qu’elle avait produite."
"Dayton Agreement": "Accord de Dayton"
"initialled 21 November 1995, signed 14 December 1995": "paraphé le 21 novembre 1995, signé le 14 décembre 1995"
"Entities": "Entités"
