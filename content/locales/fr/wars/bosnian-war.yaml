"28 August 1995": "28 août 1995"
"Five mortar shells fired by the VRS killed 43 people and wounded 75 near the market.": "Cinq obus de mortier tirés par la VRS ont tué 43 personnes et blessé 75 personnes près du marché."
"Han Pijesak": "Han Pijesak"
"August – September 1995": "août – septembre 1995"
"NATO aircraft struck targets around Han Pijesak, seat of the VRS main staff, and around Sarajevo; depleted uranium rounds were used near both.": "Des avions de l’OTAN ont frappé des cibles autour de Han Pijesak, siège du personnel principal de la VRS, et autour de Sarajevo ; des obus d’uranium appauvri ont été utilisés près des deux."
"September 1995": "septembre 1995"
"Taken in Mistral 2, with Šipovo and Drvar, as HV and HVO forces gained more than 2,500 km².": "Prise en Mistral 2, avec Šipovo et Drvar, les forces du HV et du HVO ont gagné plus de 2 500 km2."
"Ključ": "Ključ"
