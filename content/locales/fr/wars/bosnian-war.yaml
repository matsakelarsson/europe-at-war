"Mostar and the Old Bridge": "Mostar et le vieux pont"
"May 1993 – March 1994": "mai 1993 – mars 1994"
"The HVO besieged East Mostar, cutting off aid and destroying ten mosques. The Ottoman bridge, shelled down on 9 November 1993, was rebuilt and reopened in 2004.": "Le HVO a assiégé Mostar-Est, coupé l’aide et détruit dix mosquées. Le pont ottoman, bombardé le 9 novembre 1993, a été reconstruit et rouvert en 2004."
"Dretelj camp": "Camp de Dretelj"
