"April – December 1992": "avril – décembre 1992"
"In April and May 1992 Serb forces, with JNA support and paramilitaries from Serbia, took the Bosniak-majority towns along the Drina and in the north-west. Some 40,000 Bosniaks were driven from the Zvornik district; in Višegrad, in what the ICTY called one of the most ruthless campaigns of the war, Bosniaks were killed on the Drina bridge and burned alive in houses; in Foča women were held and raped in detention sites. By the end of the year Bosnian Serb forces held about 70 per cent of the country.": "En avril et mai 1992, les forces serbes, avec l’appui de la JNA et des paramilitaires de Serbie, ont pris les villes à majorité bosniaque le long de la Drina et dans le nord-ouest. Quelque 40 000 Bosniaques ont été chassés du district de Zvornik ; à Višegrad, dans ce que le TPIY appelait l’une des campagnes les plus impitoyables de la guerre, les Bosniaques ont été tués sur le pont de la Drina et brûlés vifs dans des maisons ; à Foča, des femmes ont été détenues et violées dans des lieux de détention."
"Around Prijedor, taken on 30 April, Bosniaks and Croats were rounded up after the shelling of Kozarac in May. Some 6,000 men were held at Omarska, where hundreds died, and about 30,000 people passed through Trnopolje. When Western journalists reached the camps in August they were closed. Of some 4,868 people killed or missing in the municipality, 3,515 were Bosniak, 186 Croat and 78 Serb civilians. The ICTY sentenced twenty people for crimes in Prijedor; its first trial, of Duško Tadić, concerned them.": "Autour de Prijedor, pris le 30 avril, les Bosniaques et les Croates ont été rassemblés après le bombardement de Kozarac en mai. Quelque 6 000 hommes ont été détenus à Omarska, où des centaines sont morts, et environ 30 000 personnes ont traversé Trnopolje. Lorsque les journalistes occidentaux ont atteint les camps en août, ils ont été fermés. Le TPIY a condamné vingt personnes pour des crimes commis à Prijedor ; son premier procès, celui de Duško Tadić, les concernait."
"Bosniak and Croat forces held prisoners too. At the Čelebići camp near Konjic some 400–700 Serbs, mostly civilians, were held in 1992 and as many as 30 died; three of its staff were convicted by the ICTY. At Tuzla on 15 May 1992 a withdrawing JNA column was ambushed and 52 soldiers, most of them Serbs, were killed.": "Dans le camp de Čelebići, près de Konjic, quelque 400 à 700 Serbes, pour la plupart des civils, ont été détenus en 1992 et jusqu’à 30 personnes sont mortes ; trois membres de son personnel ont été condamnés par le TPIY. À Tuzla, le 15 mai 1992, une colonne de la JNA retirée a été embusquée et 52 soldats, pour la plupart serbes, ont été tués."
