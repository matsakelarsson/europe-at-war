"June 1992 – May 1993": "juin 1992 – mai 1993"
"The Bosnian Serbs’ lands were cut in two in May 1992 when Croatian and Bosnian Croat forces took Derventa in Posavina. In Operation Corridor, from 24 June to 6 October, the VRS reopened the road from Banja Luka to eastern Bosnia and drove Croatian forces back across the Sava at Bosanski Brod, leaving them only the Orašje pocket. On 29 October Jajce, defended by an uneasy mix of HVO and Bosnian army troops, fell to the VRS; its Croats fled to Herzegovina and some 20,000 Bosniaks to Travnik and the Lašva valley.": "Les terres des Serbes de Bosnie ont été coupées en deux en mai 1992, lorsque les forces croates et croates de Bosnie ont pris Derventa à Posavina. Dans l’opération Corridor, du 24 juin au 6 octobre, la VRS a rouvert la route de Banja Luka à l’est de la Bosnie et a conduit les forces croates à travers la Save à Bosanski Brod, ne laissant que la poche d’Orašje. Le 29 octobre, Jajce, défendu par un mélange de troupes du HVO et de l’armée bosniaque, est tombé à la VRS ; ses Croates ont fui vers l’Herzégovine et quelque 20 000 Bosniaques vers Travnik et la vallée de Lašva."
"In the east, Bosniak forces under Naser Orić held a large area around Srebrenica and raided Serb villages; at Kravica on Orthodox Christmas, 7 January 1993, 43 Serbs were killed, 13 of them civilians. From March the VRS took back most of the enclave, and the UN Security Council declared Srebrenica a safe area on 16 April and Sarajevo, Tuzla, Žepa, Goražde and Bihać on 6 May. The Vance–Owen peace plan, which would have divided Bosnia into ten provinces, was rejected by the Bosnian Serbs that month.": "À l’est, les forces bosniaques placées sous Naser Orić ont tenu une grande zone autour de Srebrenica et ont attaqué des villages serbes ; à Kravica, le jour de Noël orthodoxe, le 7 janvier 1993, 43 Serbes ont été tués, dont 13 civils. Dès le mois de mars, la VRS a repris la majeure partie de l’enclave et le Conseil de sécurité des Nations unies a déclaré Srebrenica zone sûre le 16 avril et Sarajevo, Tuzla, Žepa, Goražde et Bihać le 6 mai. Le plan de paix Vance-Owen, qui aurait divisé la Bosnie en dix provinces, a été rejeté par les Serbes de Bosnie ce mois-là."
