"Dead": "Mort"
"about 100,000 (97,207 named by the Research and Documentation Center)": "environ 100 000 (97 207 nommés par le Centre de recherche et de documentation)"
"29 February 1996": "29 février 1996"
"The siege ended when the last Serb-held suburbs, including Ilidža, Vogošća and Grbavica, were handed to the Federation.": "Le siège a pris fin lorsque les dernières banlieues serbes, dont Ilidža, Vogošća et Grbavica, ont été remises à la Fédération."
"Brčko": "Brčko"
"1995–2000": "1995–2000"
