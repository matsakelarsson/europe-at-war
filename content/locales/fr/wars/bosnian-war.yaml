"Capital of Abdić’s Autonomous Province of Western Bosnia, which fought the Bosnian army’s 5th Corps in the Bihać pocket.": "Capitale de la province autonome d’Abdić, en Bosnie occidentale, qui a combattu l’armée bosniaque du 5ème Corps dans la poche de Bihać."
"Held by the HVO, 1993 (approximate)": "Tenue par le HVO, 1993 (approximative)"
"Held by Bosnian Serb forces, 1993 (approximate)": "Tenue par les forces serbes de Bosnie, 1993 (approximative)"
"Autonomous Province of Western Bosnia, from September 1993 (approximate)": "Province autonome de Bosnie occidentale, à partir de septembre 1993 (approximative)"
"The Washington Agreement and 1994": "Accord de Washington et 1994"
"February – December 1994": "février – décembre 1994"
"On 5 February 1994 a mortar bomb killed 68 people at the Markale market in Sarajevo. NATO ordered the Bosnian Serbs to withdraw their heavy weapons from around the city, and on 12 February Sarajevo had its first day without casualties since April 1992. With American mediation the Bosnian government and the Bosnian Croats agreed a ceasefire, and on 18 March signed the Washington Agreement, which joined the areas they held in a Federation of ten cantons.": "Le 5 février 1994, une bombe à mortier a tué 68 personnes sur le marché de Markale à Sarajevo. L’OTAN a ordonné aux Serbes de Bosnie de retirer leurs armes lourdes autour de la ville, et le 12 février Sarajevo a eu son premier jour sans pertes depuis avril 1992. Avec la médiation américaine, le gouvernement bosniaque et les Croates de Bosnie ont convenu d’un cessez-le-feu, et le 18 mars a signé l’Accord de Washington qui s’est joint aux zones qu’ils détenaient dans une Fédération de dix cantons."
"In April the VRS attacked the Goražde safe area. NATO aircraft struck Serb positions, the first time they had done so in support of UN troops, and an ultimatum forced the Serbs back. In the Bihać pocket the Bosnian army’s 5th Corps defeated Abdić in the summer, survived a Bosnian and Krajina Serb counter-offensive in November that led NATO to bomb Udbina airfield in Croatia, but lost Velika Kladuša again in December. In the south-west the allies retook Kupres on 3 November.": "En avril, la VRS a attaqué la zone de sécurité de Goražde. Des avions de l’OTAN ont frappé des positions serbes, la première fois qu’ils l’avaient fait pour soutenir les troupes des Nations Unies, et un ultimatum a forcé les Serbes à revenir. Dans la poche de Bihać, l’armée bosniaque du 5e Corps a vaincu Abdić en été, survécu à une contre-offensive serbe bosniaque et Krajina en novembre qui a conduit l’OTAN à bombarder l’aérodrome d’Udbina en Croatie, mais a perdu Velika Kladuša en décembre."
"First Markale massacre": "Premier massacre de Markale"
"5 February 1994, 68 killed": "5 février 1994, 68 tués"
"Washington Agreement": "Accord de Washington"
"18 March 1994": "18 mars 1994"
"Kupres retaken": "Kupres repris"
"3 November 1994": "3 novembre 1994"
"Markale": "Marqueur"
"5 February 1994": "5 février 1994"
"A 120 mm mortar bomb killed 68 people and wounded 144. Responsibility was long disputed; the ICTY found it reasonable to conclude that it was fired from Serb positions.": "Une bombe de mortier de 120 mm a tué 68 personnes et blessé 144 personnes, dont la responsabilité a été longtemps contestée ; le TPIY a jugé raisonnable de conclure qu’elle avait été tirée à partir de positions serbes."
"April 1994": "avril 1994"
"The VRS overran much of the enclave and took about 150 UN soldiers hostage before NATO air strikes and an ultimatum made it withdraw.": "La VRS a envahi une grande partie de l’enclave et pris environ 150 soldats des Nations Unies en otage avant les frappes aériennes de l’OTAN et un ultimatum l’a fait se retirer."
"Udbina airfield": "Aérodrome d’Udbina"
"21 November 1994": "21 novembre 1994"
"NATO aircraft struck the Krajina Serb airfield in Croatia from which attacks had been flown on the Bihać pocket.": "Des avions de l’OTAN ont heurté l’aérodrome serbe de Krajina en Croatie à partir duquel des attaques avaient été lancées sur la poche de Bihać."
"Bihać": "Bihać"
"The 5th Corps held the pocket against the VRS, Krajina Serb forces and, from 1993, Abdić’s troops until Operation Storm lifted the siege in August 1995.": "Le 5e Corps a tenu la poche contre la VRS, les forces serbes de Krajina et, depuis 1993, les troupes d’Abdić jusqu’à l’opération Storm a levé le siège en août 1995."
"August 1994": "août 1994"
"The 5th Corps overran Abdić’s province in Operation Tiger; he returned with Serb help in December.": "Le 5e Corps a envahi la province d’Abdić dans l’opération Tiger ; il est revenu avec l’aide des Serbes en décembre."
"Retaken from the VRS by the HVO and the Bosnian army, their first joint operation after the Washington Agreement.": "Reprise de la VRS par le HVO et l’armée bosniaque, leur première opération conjointe après l’Accord de Washington."
"Livno valley": "Vallée de Livno"
"November – December 1994": "novembre – décembre 1994"
"In Operation Winter ’94 Croatian and HVO forces advanced up the valley towards Bosansko Grahovo.": "Dans l’opération Hiver 94, les forces croates et du HVO ont avancé dans la vallée vers Bosansko Grahovo."
"VRS on Goražde": "VRS sur Goražde"
"5th Corps": "5e Corps"
"Winter ’94": "Hiver"
"Held by Bosnian Serb forces, 1994 (approximate)": "Tenue par les forces serbes de Bosnie, 1994 (approximative)"
"Srebrenica": "Srebrenica"
"May – July 1995": "mai – juillet 1995"
"After NATO aircraft bombed Bosnian Serb positions at Pale on 25 May 1995, the VRS shelled the safe areas and took hundreds of UN peacekeepers hostage. That evening a shell killed 71 civilians, most of them young, in the centre of Tuzla. On 6 July the VRS attacked the Srebrenica enclave, defended by a weak Bosnian army division and about 400 lightly armed Dutch peacekeepers, and on 11 July Mladić entered the town.": "Après que des avions de l’OTAN aient bombardé des positions serbes de Bosnie à Pale le 25 mai 1995, la VRS a bombardé les zones de sécurité et pris en otage des centaines de soldats de la paix de l’ONU. Le soir, un obus a tué 71 civils, dont la plupart étaient jeunes, dans le centre de Tuzla. Le 6 juillet, la VRS a attaqué l’enclave de Srebrenica, défendue par une faible division de l’armée bosniaque et environ 400 Casques bleus néerlandais légèrement armés, et le 11 juillet, Mladić est entré dans la ville."
"Some 25,000–30,000 women, children and old men were bussed to Bosnian lines after the men were separated from them at the Dutch base at Potočari. Men who tried to escape through the woods towards Tuzla were hunted down. In the following days more than 8,000 Bosniak men and boys were shot and buried in mass graves, later dug up and scattered to hide the crime. A list of the missing and dead contains 8,372 names.": "Quelque 25 000 à 30 000 femmes, enfants et vieillards ont été carés jusqu’aux lignes bosniaques après que les hommes aient été séparés d’eux à la base néerlandaise de Potočari. Des hommes qui tentaient de s’échapper dans les bois vers Tuzla ont été chassés. Dans les jours suivants, plus de 8 000 Bosniaques ont été abattus et enterrés dans des fosses communes, puis déterrés et dispersés pour cacher le crime."
"The ICTY, in the Krstić appeal of 2004, and the International Court of Justice in 2007 ruled that the killings were genocide; the ICJ found that Serbia had failed to prevent and punish it, though it was not itself responsible. Karadžić and Mladić were sentenced to life imprisonment. Žepa fell on 25 July, but its Ukrainian commander secured the evacuation of its civilians.": "Le TPIY, dans l’appel de Krstić en 2004, et la Cour internationale de Justice en 2007 ont statué que les meurtres étaient des génocides ; la CIJ a conclu que la Serbie n’avait pas réussi à le prévenir ni à le punir, bien qu’elle ne soit pas elle-même responsable. Karadžić et Mladić ont été condamnés à la prison à vie."
"Srebrenica fell": "Srebrenica est tombé"
"11 July 1995": "11 juillet 1995"
"more than 8,000 men and boys; 8,372 names listed": "plus de 8 000 hommes et garçons ; 8 372 noms énumérés"
"Ruled genocide": "Génocide déclaré"
"ICTY (2004) and ICJ (2007)": "TPIY (2004) et la CIJ (2007)"
"25–26 May 1995": "25–26 mai 1995"
"NATO bombed VRS positions after the Bosnian Serbs failed to return heavy weapons; the VRS answered by seizing UN peacekeepers, some of whom were chained to likely targets.": "L’OTAN a bombardé des positions de la VRS après que les Serbes de Bosnie n’ont pas rendu d’armes lourdes ; la VRS a répondu en saisissant des soldats de la paix de l’ONU, dont certains étaient enchaînés à des cibles probables."
"25 May 1995": "25 mai 1995"
"A VRS shell landed among young people at the Kapija square, killing 71 civilians and wounding about 240.": "Un obus de la VRS a atterri parmi des jeunes sur la place Kapija, tuant 71 civils et blessant environ 240 personnes."
"Taken in Operation Krivaja ’95 by the VRS Drina Corps under Mladić’s command.": "Pris dans l’opération Krivaja 95 par le Corps de la Drina sous le commandement de Mladić."
"Potočari": "Potočari"
"12–13 July 1995": "12–13 juillet 1995"
"At the Dutch base, where thousands had sought safety, Serb troops separated men and boys from their families; on 13 July the peacekeepers handed over some 5,000 people sheltering there.": "Sur la base néerlandaise, où des milliers de personnes avaient cherché à se protéger, les troupes serbes ont séparé les hommes et les garçons de leur famille ; le 13 juillet, les soldats de la paix ont remis quelque 5 000 personnes qui s’y trouvaient."
"Kravica warehouse": "Entrepôt de Kravica"
"13 July 1995": "13 juillet 1995"
"About a thousand men captured on the road to Tuzla were killed in and around a farm warehouse, one of the first mass executions.": "Environ un millier d’hommes capturés sur la route de Tuzla ont été tués dans et autour d’un entrepôt agricole, l’une des premières exécutions massives."
"Žepa": "Žepa"
"25 July 1995": "25 juillet 1995"
"The VRS took the second eastern safe area; its commander, Avdo Palić, disappeared in Serb custody.": "La VRS a pris la deuxième zone de sécurité orientale ; son commandant, Avdo Palić, a disparu en garde à vue serbe."
"Krivaja ’95": "Krivaja 95"
"Held by Bosnian Serb forces, end of July 1995 (approximate)": "Tenue par les forces serbes de Bosnie, fin juillet 1995 (approximative)"
"Markale, Deliberate Force and the western offensives": "Markale, la Force délibérante et les offensives occidentales"
"August – October 1995": "août – octobre 1995"
"After Operation Storm had swept the Krajina Serbs out of Croatia and relieved Bihać, a VRS mortar attack on the Markale market in Sarajevo killed 43 people on 28 August 1995. Two days later NATO began Operation Deliberate Force. Until 20 September some 400 aircraft from 15 countries struck 338 Bosnian Serb targets, from air defences and artillery around Sarajevo to depots and command posts, and the VRS pulled its heavy weapons back from the city.": "Après que l’opération Tempête eut balayé les Serbes de Krajina hors de Croatie et relevé Bihać, une attaque de mortier de la VRS sur le marché de Markale à Sarajevo a tué 43 personnes le 28 août 1995. Deux jours plus tard, l’OTAN a commencé l’opération Délibérée. Jusqu ' au 20 septembre, quelque 400 avions de 15 pays ont frappé 338 cibles serbes de Bosnie, des défenses aériennes et de l’artillerie autour de Sarajevo aux dépôts et postes de commandement, et la VRS a retiré ses armes lourdes de la ville."
"At the same time Croatian and HVO forces took Jajce, Šipovo and Drvar in Operation Mistral 2, and the Bosnian army’s 5th Corps broke out of the Bihać pocket and took Bosanska Krupa, Bosanski Petrovac and Ključ. When a Serb counter-attack threatened Ključ, the Croats’ Operation Southern Move took Mrkonjić Grad and came within 25 km of Banja Luka. Southern Move alone displaced some 10,000 Serbs, and at least 181 were killed. A nationwide ceasefire took effect on 12 October, with the Federation now holding about half the country.": "En même temps, les forces croates et du HVO ont pris Jajce, Šipovo et Drvar dans l’opération Mistral 2, et le 5e Corps de l’armée bosniaque s’est détaché de la poche de Bihać et a pris Bosanska Krupa, Bosanski Petrovac et Ključ. Quand une contre-attaque serbe a menacé Ključ, l’opération des Croates a pris Mrkonjić Grad et est arrivée à moins de 25 km de Banja Luka. Southern Move seul a déplacé quelque 10 000 Serbes, et au moins 181 ont été tués. Un cessez-le-feu national a pris effet le 12 octobre, la Fédération tenant maintenant environ la moitié du pays."
"Second Markale massacre": "Deuxième massacre de Markale"
"28 August 1995, 43 killed": "28 août 1995, 43 personnes tuées"
"Operation Deliberate Force": "Opération Délibérée"
