"The eastern enclave was joined to the Federation by a corridor through Serb-held land.": "L’enclave orientale a été rejointe par la Fédération par un couloir traversant des terres tenues par les Serbes."
"Banja Luka": "Banja Luka"
"The largest Bosnian Serb city, later the seat of the Republika Srpska government.": "La plus grande ville serbe de Bosnie, plus tard le siège du gouvernement de la Republika Srpska."
"Republika Srpska under the Dayton Agreement": "Republika Srpska en vertu de l’Accord de Dayton"
"Brčko, left to arbitration": "Brčko, laissé à l’arbitrage"
