"October 1992 – February 1994": "octobre 1992 – février 1994"
"The HVO and the Bosnian army had fought the Serbs together in 1992, but the Croatian Community of Herzeg-Bosnia under Mate Boban was building its own state, and clashes began in October at Novi Travnik and Prozor. Fighting spread from Gornji Vakuf in January 1993 to open war in central Bosnia in April. On 16 April HVO troops killed about 120 Bosniak civilians at Ahmići in the Lašva valley; the ICTY sentenced their political leader, Dario Kordić, to 25 years. On the same day Bosnian army soldiers killed 22 Croats, sixteen of them civilians, at Trusina near Konjic.": "Le HVO et l’armée bosniaque avaient combattu les Serbes ensemble en 1992, mais la communauté croate d’Herzeg-Bosnia sous Mate Boban construisait son propre État, et des affrontements ont commencé en octobre à Novi Travnik et Prozor. Les combats se sont propagés de Gornji Vakuf en janvier 1993 pour ouvrir la guerre en Bosnie centrale en avril. Le 16 avril, les troupes du HVO ont tué environ 120 civils bosniaques à Ahmići dans la vallée de Lašva ; le TPIY a condamné leur chef politique, Dario Kordić, à 25 ans, et le même jour, des soldats de l’armée bosniaque ont tué 22 Croates, dont seize civils, à Trusina près de Konjic."
"On 9 May the HVO attacked the Bosniak east bank of Mostar and besieged it until early 1994, holding thousands of Bosniak men at camps such as the Heliodrom and Dretelj. On 9 November its tanks destroyed the 16th-century Old Bridge. In 2017 the ICTY Appeals Chamber confirmed the convictions of six Herzeg-Bosnia leaders for crimes against Bosniaks, though it judged the bridge itself a military target. Herzeg-Bosnia declared itself a republic on 28 August 1993.": "Le 9 mai, le HVO a attaqué la rive est bosniaque de Mostar et l’a assiégée jusqu’au début de 1994, en tenant des milliers d’hommes bosniaques dans des camps comme l’Héliodrom et Dretelj. Le 9 novembre, ses chars ont détruit le vieux pont du 16ème siècle. Herzeg-Bosnia s’est déclaré république le 28 août 1993."
"The larger Bosnian army took Travnik, Kakanj and Fojnica in June and July and Bugojno in July, where 15,000 Croats left, and Vareš in November. Its soldiers killed at least 13 Croat villagers at Grabovica and 29 at Uzdol in September; HVO troops killed at least 37 Bosniaks at Stupni Do in October. In the Bihać pocket Fikret Abdić proclaimed an Autonomous Province of Western Bosnia on 27 September and made deals with the Serb and Croat leaders. A ceasefire on 23 February 1994 ended the Croat–Bosniak war.": "La plus grande armée bosniaque a pris Travnik, Kakanj et Fojnica en juin et juillet et Bugojno en juillet, où 15 000 Croates sont partis, et Vareš en novembre. Ses soldats ont tué au moins 13 villageois croates à Grabovica et 29 à Uzdol en septembre ; les troupes du HVO ont tué au moins 37 Bosniaques à Stupni Do en octobre. Dans la poche de Bihać, Fikret Abdić a proclamé une province autonome de Bosnie occidentale le 27 septembre et conclu des accords avec les dirigeants serbes et croates."
"Ahmići massacre": "Massacré d’Ahmići"
"16 April 1993, about 120 killed": "16 avril 1993, environ 120 personnes tuées"
"Old Bridge destroyed": "Vieux pont détruit"
"9 November 1993": "9 novembre 1993"
"Croat–Bosniak ceasefire": "cessez-le-feu entre les Croates et les Bosniaques"
"23 February 1994": "23 février 1994"
"Ahmići": "Ahmići"
"The worst massacre of the Croat–Bosniak war, the culmination of the HVO’s expulsions in the Lašva valley; found by British UN troops under Colonel Bob Stewart.": "Le pire massacre de la guerre Croate-Bosniak, l’aboutissement des expulsions du HVO dans la vallée de Lašva ; trouvé par les troupes britanniques de l’ONU sous le colonel Bob Stewart."
"Trusina": "Trusina"
