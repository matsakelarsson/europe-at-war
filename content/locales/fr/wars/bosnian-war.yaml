# Some French text was translated automatically.
"Bosnian War": "Guerre de Bosnie"
"The war that followed Bosnia and Herzegovina’s independence from Yugoslavia. Bosnian Serb forces, armed by the Yugoslav People’s Army and backed by Serbia, seized about 70 per cent of the country in 1992, driving out or killing Bosniaks and Croats, and besieged Sarajevo for almost four years. In 1993 the Bosniak-led government and the Bosnian Croats, backed by Croatia, fought each other, until the Washington Agreement of March 1994 made them allies again. The fall of the UN safe area of Srebrenica in July 1995, where more than 8,000 Bosniak men and boys were killed in what international courts ruled was genocide, was followed by NATO air strikes and Croatian and Bosnian offensives. The Dayton Agreement of November 1995 kept Bosnia as one state of two entities. About 100,000 people were killed and 2.2 million displaced.": "Les forces serbes de Bosnie, armées par l’armée populaire yougoslave et soutenues par la Serbie, ont saisi environ 70 % du pays en 1992, chassant ou tuant des Bosniaques et des Croates, et assiégé Sarajevo pendant près de quatre ans. En 1993, le gouvernement dirigé par les Bosniaques et les Croates de Bosnie, soutenus par la Croatie, se sont battus, jusqu’à ce que l’Accord de Washington de mars 1994 les fasse de nouveau alliés. La chute de la zone de sécurité des Nations unies à Srebrenica en juillet 1995, où plus de 8 000 Bosniaques et garçons ont été tués dans ce que les tribunaux internationaux avaient jugé comme un génocide, a été suivie par des frappes aériennes de l’OTAN et des offensives croates et bosniaques."
"Republika Srpska, Herzeg-Bosnia and Western Bosnia were recognised by no state. The map shows them as areas inside Bosnia and Herzegovina, whose independence the base map shows from 3 March 1992; the Federal Republic of Yugoslavia (Serbia and Montenegro) is shown from 27 April 1992. Front lines are approximate and moved often.": "La Republika Srpska, l’Herzeg-Bosnie et la Bosnie occidentale n’ont été reconnues par aucun État. La carte les montre comme des zones à l’intérieur de la Bosnie-Herzégovine, dont l’indépendance est illustrée par la carte de base du 3 mars 1992 ; la République fédérative de Yougoslavie (Serbie et Monténégro) est représentée à partir du 27 avril 1992."
"Bosniak is used for Bosnian Muslims. The Bosnian government’s army (ARBiH) was mainly Bosniak but had Croat and Serb members; the Croatian Defence Council (HVO) was the Bosnian Croat army, and the Army of Republika Srpska (VRS) was formed from the JNA in May 1992.": "L’armée bosniaque (ARBiH) était principalement bosniaque, mais avait des membres croates et serbes ; le Conseil de défense croate (HVO) était l’armée croate de Bosnie, et l’Armée de la Republika Srpska (VRS) a été formée à partir de la JNA en mai 1992."
"Casualty figures are disputed. The Sarajevo Research and Documentation Center listed 97,207 named people killed or missing; ICTY demographers put the probable total at about 104,732. Where the ICTY or the International Court of Justice settled what happened, their findings are given.": "Le Centre de recherche et de documentation de Sarajevo a recensé 97 207 personnes tuées ou portées disparues ; les démographes du TPIY ont estimé qu’il était probable que le total soit d’environ 104 732. Lorsque le TPIY ou la Cour internationale de Justice ont réglé ce qui s’est passé, leurs conclusions sont données."
