# French translations of the catalogue text (wave 9); step bodies follow later.
Boxer Rebellion: Révolte des Boxers
? An anti-foreign and anti-Christian rising in North China, and the war it led to between the Qing court and eight foreign powers. The Boxers, the Yihetuan or “Militia United in Righteousness”, grew among villagers in Shandong and Zhili hit by drought, floods and the German seizure of Jiaozhou Bay; practising martial arts and rituals they believed made them invulnerable, they attacked missionaries, Chinese Christians, railways and telegraphs. In June 1900 they poured into Beijing and Tianjin. When foreign troops seized the Dagu forts, the Empress Dowager Cixi declared war on the powers, and Qing troops and Boxers besieged the foreign legations in Beijing for 55 days. An international army of about 20,000, mostly Japanese, Russian, British and American, took Tianjin and relieved Beijing on 14 August 1900; the court fled to Xi’an, and foreign troops looted the capital and sent punitive columns through Zhili while Russia occupied Manchuria. The Boxer Protocol of September 1901 imposed an indemnity of 450 million taels. About 32,000 Chinese Christians and some 200 foreign missionaries were killed, and estimates of the total dead are around 100,000.
: Un soulèvement antiétranger et antichrétien dans le nord de la Chine, et la guerre qu’il entraîna entre la cour des Qing et huit puissances étrangères. Les Boxers, ou Yihetuan, les « Milices de la justice et de la concorde », se multiplièrent parmi les villageois du Shandong et du Zhili frappés par la sécheresse, les inondations et la saisie de la baie de Jiaozhou par l’Allemagne ; pratiquant des arts martiaux et des rituels qui, croyaient-ils, les rendaient invulnérables, ils attaquèrent les missionnaires, les chrétiens chinois, les chemins de fer et les lignes télégraphiques. En juin 1900, ils affluèrent à Pékin et à Tianjin. Lorsque des troupes étrangères s’emparèrent des forts de Dagu, l’impératrice douairière Cixi déclara la guerre aux puissances, et les troupes Qing et les Boxers assiégèrent les légations étrangères de Pékin pendant 55 jours. Une armée internationale d’environ 20 000 hommes, pour la plupart japonais, russes, britanniques et américains, prit Tianjin et délivra Pékin le 14 août 1900 ; la cour s’enfuit à Xi’an, et les troupes étrangères pillèrent la capitale et envoyèrent des colonnes punitives à travers le Zhili, tandis que la Russie occupait la Mandchourie. Le protocole de paix Boxer de septembre 1901 imposa une indemnité de 450 millions de taëls. Environ 32 000 chrétiens chinois et quelque 200 missionnaires étrangers furent tués, et le nombre total des morts est estimé à environ 100 000.
