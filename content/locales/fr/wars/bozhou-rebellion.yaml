# French translations of the catalogue text (wave 9); step bodies follow later.
Bozhou rebellion: Rébellion de Bozhou
The war between the Ming and Yang Yinglong, hereditary chieftain (tusi) of Bozhou, around today’s Zunyi in northern Guizhou, whose family had ruled the region for some seven centuries under the Tang, Song, Yuan and Ming. From 1589 Yang fought rival chiefs and raided Ming territory, while the court, busy with the war against Japan in Korea, alternated between campaigns and pardons. After his forces took Qijiang in Sichuan in 1599, the court gave Li Hualong command of Sichuan, Guizhou and Huguang. In March 1600 eight Ming columns, about 240,000 men, most of them indigenous troops, invaded Bozhou, and on 15 July 1600 they stormed Yang’s mountain fortress of Hailongtun; Yang took his own life. The chieftaincy was abolished and its lands divided between Sichuan and Guizhou under appointed officials. The Ming counted the war among the Wanli Emperor’s Three Great Campaigns, with the Ningxia campaign of 1592 and the war in Korea.: La guerre entre les Ming et Yang Yinglong, chef héréditaire (tusi) de Bozhou, autour de l’actuelle Zunyi, dans le nord du Guizhou, dont la famille gouvernait la région depuis quelque sept siècles sous les Tang, les Song, les Yuan et les Ming. À partir de 1589, Yang combattit des chefs rivaux et lança des raids en territoire Ming, tandis que la cour, absorbée par la guerre contre le Japon en Corée, alternait campagnes et pardons. Après la prise de Qijiang, au Sichuan, par ses forces en 1599, la cour confia à Li Hualong le commandement du Sichuan, du Guizhou et du Huguang. En mars 1600, huit colonnes Ming, soit environ 240 000 hommes, pour la plupart des troupes indigènes, envahirent Bozhou et, le 15 juillet 1600, prirent d’assaut la forteresse de montagne de Yang à Hailongtun ; Yang se donna la mort. La chefferie fut abolie et ses terres partagées entre le Sichuan et le Guizhou, sous l’autorité de fonctionnaires nommés. Les Ming comptèrent cette guerre parmi les trois grandes campagnes de l’empereur Wanli, avec la campagne de Ningxia de 1592 et la guerre de Corée.
