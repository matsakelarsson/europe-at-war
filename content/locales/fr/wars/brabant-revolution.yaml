"Brabant Revolution": "Révolution Brabante"
"A revolt in the Austrian Netherlands against the reforms of the Emperor Joseph II, which many saw as an attack on the Catholic Church and on the provinces’ old privileges. Exiles gathered a small army in the Dutch Republic, which crossed the border and beat the Austrians at Turnhout on 27 October 1789. Risings followed across the country, and by the end of the year the Austrian troops had withdrawn to Luxembourg. On 11 January 1790 the rebel provinces declared independence as the United Belgian States, but no power recognised them, and the conservative Statists of Henri Van der Noot, backed by the Church, drove out the liberal Vonckists of Jan Frans Vonck. Joseph’s successor, Leopold II, stopped fighting the Ottomans and came to terms with Prussia at Reichenbach in July 1790; his troops beat the Belgian army at Falmagne in September and reoccupied the country, entering Brussels in early December 1790.": "Une révolte aux Pays-Bas autrichiens contre les réformes de l’empereur Joseph II, que beaucoup considéraient comme une attaque contre l’Église catholique et sur les anciens privilèges des provinces. Les exilés ont rassemblé une petite armée en République néerlandaise qui a traversé la frontière et battu les Autrichiens à Turnhout le 27 octobre 1789. Le 11 janvier 1790, les provinces rebelles déclarent l’indépendance en tant qu’Etats-Unis belges, mais aucun pouvoir ne les reconnaît, et les statistes conservateurs d’Henri Van der Noot, soutenus par l’Église, chassent les vanchistes libéraux de Jan Frans Vonck. Le successeur de Joseph, Léopold II, a cessé de combattre les Ottomans et est entré en accord avec la Prusse à Reichenbach en juillet 1790 ; ses troupes ont battu l’armée belge à Falmagne en septembre et réoccupé le pays, entrant à Bruxelles au début décembre 1790."
"Sometimes called the Belgian Revolution of 1789–1790. It ran alongside the Liège Revolution and the first year of the French Revolution; the restored Austrian rule lasted only until the French conquests of 1792 and 1794.": "Parfois appelée la Révolution belge de 1789–1790. Elle court aux côtés de la révolution de Liège et de la première année de la Révolution française ; le règne autrichien restauré ne dura que jusqu’aux conquêtes françaises de 1792 et 1794."
