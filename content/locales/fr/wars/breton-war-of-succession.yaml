# Some French text was translated automatically.
"Breton War of Succession": "Guerre de succession bretonne"
"A war for the Duchy of Brittany after Duke John III died without children in 1341, between his half-brother John of Montfort, backed by England, and Charles of Blois, husband of his niece Joan of Penthièvre, backed by France. Fought as part of the Hundred Years’ War, it saw Joanna of Flanders’ defence of Hennebont in 1342, Charles’s capture at La Roche-Derrien in 1347 and the Combat of the Thirty in 1351. It ended when Charles was killed at Auray in 1364, and by the Treaty of Guérande in 1365 Montfort’s son John IV was recognised as duke.": "Une guerre pour le duché de Bretagne après la mort du duc Jean III sans enfants en 1341, entre son demi-frère Jean de Montfort, soutenu par l’Angleterre, et Charles de Blois, mari de sa nièce Jeanne de Penthièvre, soutenu par la France. Frappée dans le cadre de la guerre de Cent Ans, elle vit Joanna de Flanders pour la défense de Hennebont en 1342, Charles capturé à La Roche-Derrien en 1347 et le combat des Trente en 1351. Elle prit fin lorsque Charles fut tué à Auray en 1364, et par le traité de Guérande en 1365 Montfort."
"The war is also called the War of the Two Joans, after Joanna of Flanders, Montfort’s wife, who led his party while he was a prisoner, and Joan of Penthièvre, Charles of Blois’s wife, in whose right he claimed the duchy.": "La guerre s’appelle aussi la Guerre des Deux Joans, après Joanna de Flandre, femme de Montfort, qui a dirigé son parti pendant qu’il était prisonnier, et Jeanne de Penthièvre, Charles de Blois, dans le droit duquel il a réclamé le duché."
