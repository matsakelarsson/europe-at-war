# Some French text was translated automatically.
"Brigandage in southern Italy": "Brigandage dans le sud de l’Italie"
? "A guerrilla war in the former Kingdom of the Two Sicilies after its annexation by Italy. Armed bands of former Bourbon soldiers, deserters, peasants and outlaws, encouraged at first by the exiled court of Francis II in Rome and joined by a few foreign legitimists, attacked troops, officials and landowners, above all in Basilicata, Apulia, Campania and the Abruzzi; leaders such as Carmine Crocco commanded hundreds of men. The new state answered with a large part of its army, martial law and, from 1863, the Pica Law, which set up military courts and allowed the arrest of brigands’ relatives. Both sides committed atrocities. After brigands killed some 40 soldiers near Pontelandolfo in August 1861, troops burned Pontelandolfo and Casalduni and killed many of their people. Official figures for 1861–1864 alone count about 2,400 brigands killed in fighting, over 1,000 executed and about 600 soldiers killed; estimates of the total dead vary widely and remain disputed. By the late 1860s the bands had been destroyed, but the war left lasting bitterness in the south."
: "Une guérilla dans l’ancien Royaume des Deux Sicilies après son annexion par l’Italie. Des bandes armées d’anciens soldats Bourbon, déserteurs, paysans et hors-la-loi, encouragées au début par la cour exilée de François II à Rome et rejointes par quelques légitimistes étrangers, attaquèrent des troupes, des officiels et des propriétaires fonciers, surtout en Basilicate, aux Pouilles, en Campanie et dans les Abruzzes ; des dirigeants comme Carmine Crocco commandaient des centaines d’hommes. Le nouvel État a répondu par une grande partie de son armée, la loi martiale et, à partir de 1863, la loi Pica, qui a créé des tribunaux militaires et permis l’arrestation de parents brigands. Les deux parties ont commis des atrocités. Après que les brigands ont tué une quarantaine de soldats près de Pontelandolfo en août 1861, les troupes ont brûlé Pontelandolfo et Casalduni et tué beaucoup de leur peuple. Les chiffres officiels pour 1861–1864 seulement comptent environ 2 400 brigands tués dans les combats, plus de 1 000 exécutés et environ 600 soldats tués ; les estimations du nombre total de morts varient considérablement et demeurent contestées.À la fin des années 1860, les bandes avaient été détruites, mais la guerre a laissé une amertume durable dans le sud."
"Italian historians still debate how far brigandage was a social revolt of poor peasants, a legitimist war for the Bourbons or simple banditry; it was each of these in different places and years.": "Les historiens italiens discutent encore de la mesure dans laquelle le brigandage était une révolte sociale des paysans pauvres, une guerre légitimiste pour les Bourbons ou un simple banditisme ; il s’agissait de chacun en différents lieux et années."
