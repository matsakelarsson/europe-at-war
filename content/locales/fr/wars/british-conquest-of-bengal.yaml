# French translations of the catalogue text (wave 8); step bodies follow later.
British conquest of Bengal: Conquête britannique du Bengale
The wars in which the British East India Company became the real ruler of Bengal, Bihar and Orissa, the richest province of Mughal India. In 1756 the young Nawab Siraj-ud-Daulah took the Company’s town of Calcutta; a force from Madras under Robert Clive retook it, seized the French settlement of Chandernagore and, in league with the Nawab’s own commander Mir Jafar, defeated Siraj at Plassey on 23 June 1757. The Company made and unmade nawabs, replacing Mir Jafar with Mir Qasim in 1760, and when Mir Qasim tried to rule on his own terms it fought and beat him in 1763. At Buxar in October 1764 it defeated Mir Qasim, the Nawab of Awadh and the Mughal emperor Shah Alam II together, and by the settlement of Allahabad in August 1765 the emperor granted the Company the diwani, the right to collect the revenue of the three provinces.: "Les guerres au terme desquelles la Compagnie britannique des Indes orientales devint la véritable maîtresse du Bengale, du Bihar et de l’Orissa, la plus riche province de l’Inde moghole. En 1756, le jeune nawab Siraj-ud-Daulah prit Calcutta, la ville de la Compagnie ; une force venue de Madras sous le commandement de Robert Clive la reprit, s’empara de l’établissement français de Chandernagor et, de connivence avec Mir Jafar, le propre commandant du nawab, battit Siraj à Plassey le 23 juin 1757. La Compagnie faisait et défaisait les nawabs : elle remplaça Mir Jafar par Mir Qasim en 1760, et lorsque Mir Qasim tenta de gouverner à sa guise, elle lui fit la guerre et le battit en 1763. À Buxar, en octobre 1764, elle vainquit à la fois Mir Qasim, le nawab d’Awadh et l’empereur moghol Shah Alam II, et par le règlement d’Allahabad, en août 1765, l’empereur accorda à la Compagnie la diwani, le droit de percevoir les revenus des trois provinces."
