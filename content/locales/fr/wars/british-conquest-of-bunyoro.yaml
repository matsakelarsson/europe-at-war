# French translations of the catalogue text (wave 13); step bodies follow later.
British conquest of Bunyoro: Conquête britannique du Bounyoro
? The war in which Britain and its Ganda allies conquered the kingdom of Bunyoro-Kitara in western Uganda. Omukama Kabalega, who had rebuilt Bunyoro’s power with a standing army armed with guns, resisted the advance of British influence from Buganda and backed Buganda’s Muslim party. In December 1893 Colonel Henry Colvile invaded with Sudanese troops and a large Ganda army under Semei Kakungulu; Britain declared war on 1 January 1894, and Kabalega abandoned his capital, Mparo. For five years he fought on from the Budongo forest and the country north of the Nile, while the British built forts across his kingdom and gave large parts of it to Buganda and Toro. In 1897 Kabaka Mwanga II of Buganda rose against the British, was defeated and, after a mutiny of the protectorate’s Sudanese troops, joined Kabalega. Both were captured in Lango on 9 April 1899 and exiled to the Seychelles. The lands south of the Kafu given to Buganda remained a grievance in Bunyoro; two of the “lost counties” voted to return to it in a referendum in 1964.
: La guerre par laquelle la Grande-Bretagne et ses alliés ganda conquirent le royaume de Bounyoro-Kitara, dans l’ouest de l’Ouganda. L’omukama Kabalega, qui avait restauré la puissance du Bounyoro grâce à une armée permanente dotée d’armes à feu, s’opposa à l’avancée de l’influence britannique depuis le Bouganda et soutint le parti musulman du Bouganda. En décembre 1893, le colonel Henry Colvile envahit le pays avec des troupes soudanaises et une grande armée ganda commandée par Semei Kakungulu ; la Grande-Bretagne déclara la guerre le 1er janvier 1894, et Kabalega abandonna sa capitale, Mparo. Pendant cinq ans, il poursuivit la lutte depuis la forêt de Budongo et le pays situé au nord du Nil, tandis que les Britanniques construisaient des forts à travers son royaume et en donnaient de vastes parties au Bouganda et au Toro. En 1897, le kabaka Mwanga II du Bouganda se souleva contre les Britanniques, fut vaincu et, après une mutinerie des troupes soudanaises du protectorat, rejoignit Kabalega. Tous deux furent capturés au Lango le 9 avril 1899 et exilés aux Seychelles. Les terres situées au sud du Kafu et données au Bouganda restèrent un grief au Bounyoro ; deux des « comtés perdus » votèrent leur retour au Bounyoro lors d’un référendum en 1964.
