British Conquest of Dutch Ceylon: Conquête britannique du Ceylan néerlandais
The British capture of the Dutch East India Company’s coastal provinces of Ceylon during the French Revolutionary Wars. After France overran the Dutch Republic and set up the Batavian Republic in January 1795, the exiled Prince of Orange told Dutch colonial governors in the Kew Letters to admit British troops. An expedition from Madras of about 2,700 men under Colonel James Stuart, with Rear-Admiral Peter Rainier’s squadron, landed near Trincomalee in August 1795; the town surrendered on 26 August after a short bombardment and Fort Ostenburg on 31 August. Batticaloa, Jaffna, Mullaitivu and Mannar followed in September and October. The Swiss Regiment de Meuron, the backbone of the Dutch garrison, had already been bought into British service. Stuart landed at Negombo in February 1796, and Governor Johan van Angelbeek surrendered Colombo without a fight on 15–16 February; Galle followed a few days later. The Dutch formally ceded Ceylon at the Peace of Amiens in 1802, when it became a British Crown colony.: La prise par les Britanniques des provinces côtières de Ceylan tenues par la Compagnie néerlandaise des Indes orientales, pendant les guerres de la Révolution française. Après que la France eut envahi les Provinces-Unies et instauré la République batave en janvier 1795, le prince d’Orange en exil enjoignit aux gouverneurs coloniaux néerlandais, par les lettres de Kew, d’accueillir les troupes britanniques. Une expédition partie de Madras, forte d’environ 2 700 hommes sous les ordres du colonel James Stuart et accompagnée de l’escadre du contre-amiral Peter Rainier, débarqua près de Trincomalee en août 1795 ; la ville capitula le 26 août après un bref bombardement, et le fort Ostenburg le 31 août. Batticaloa, Jaffna, Mullaitivu et Mannar suivirent en septembre et en octobre. Le régiment suisse de Meuron, pilier de la garnison néerlandaise, était déjà passé, contre paiement, au service britannique. Stuart débarqua à Negombo en février 1796, et le gouverneur Johan van Angelbeek livra Colombo sans combat les 15 et 16 février ; Galle suivit quelques jours plus tard. Les Néerlandais cédèrent officiellement Ceylan à la paix d’Amiens en 1802, et l’île devint une colonie de la Couronne britannique.
