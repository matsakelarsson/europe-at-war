# French translations of the catalogue text (wave 13); step bodies follow later.
British conquest of northern Nigeria: Conquête britannique du nord du Nigeria
? The conquest of the Sokoto Caliphate and its emirates by the Royal Niger Company and then the British Northern Nigeria Protectorate. The caliphate, founded in Usman dan Fodio’s jihad, was the largest state in West Africa, a loose union of some thirty emirates under the caliph at Sokoto and the emir of Gwandu. In 1897 the Royal Niger Company, which held a British charter over the lower Niger, defeated the emirates of Nupe at Bida and of Ilorin. The British government took over the company’s territories on 1 January 1900 and Frederick Lugard, as high commissioner, extended British rule emirate by emirate with the West African Frontier Force, taking Kontagora, Yola, Bauchi and Zaria in 1901–1902, Kano on 3 February 1903 and Sokoto on 15 March 1903. Caliph Attahiru I set out with thousands of followers on a hijra towards Mecca and was killed at Burmi in July 1903. Lugard kept the emirs who submitted as rulers under British residents, the system that became known as indirect rule. The last armed resistance, a Mahdist rising at Satiru near Sokoto, was crushed in March 1906 by British troops together with the new sultan’s forces.
: La conquête du califat de Sokoto et de ses émirats par la Royal Niger Company, puis par le protectorat britannique du Nigeria du Nord. Le califat, fondé lors du djihad d’Ousmane dan Fodio, était le plus grand État d’Afrique de l’Ouest, une union lâche d’une trentaine d’émirats placés sous l’autorité du calife de Sokoto et de l’émir de Gwandu. En 1897, la Royal Niger Company, qui détenait une charte britannique sur le bas Niger, vainquit les émirats du Nupe, à Bida, et d’Ilorin. Le gouvernement britannique reprit les territoires de la compagnie le 1er janvier 1900, et Frederick Lugard, haut-commissaire, étendit la domination britannique émirat par émirat avec la West African Frontier Force, prenant Kontagora, Yola, Bauchi et Zaria en 1901–1902, Kano le 3 février 1903 et Sokoto le 15 mars 1903. Le calife Attahiru Ier partit avec des milliers de fidèles pour une hégire vers La Mecque et fut tué à Burmi en juillet 1903. Lugard maintint au pouvoir les émirs qui s’étaient soumis, sous l’autorité de résidents britanniques, système qui prit le nom d’administration indirecte (indirect rule). La dernière résistance armée, un soulèvement mahdiste à Satiru, près de Sokoto, fut écrasée en mars 1906 par les troupes britanniques, avec les forces du nouveau sultan.
