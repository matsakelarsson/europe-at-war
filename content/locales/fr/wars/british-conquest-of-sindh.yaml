# French translations of the catalogue text (wave 8); step bodies follow later.
British Conquest of Sindh: Conquête britannique du Sind
The East India Company’s conquest of Sindh, the lower Indus valley ruled by the Talpur Mirs. The British had forced the Mirs to let the Army of the Indus pass through their country and to accept British troops during the First Anglo-Afghan War; in 1842 the new Governor-General, Lord Ellenborough, and his general in Sindh, Sir Charles Napier, demanded new cessions. After a Baluch attack on the British Residency at Hyderabad, Napier’s small army defeated far larger Talpur forces at Miani on 17 February 1843 and at Dubba near Hyderabad on 24 March, and took Mirpur and Umarkot. Sindh was annexed, except for Khairpur, whose Mir had sided with the British. The conquest was widely criticised in Britain as unprovoked.: La conquête par la Compagnie des Indes orientales du Sind, la basse vallée de l’Indus, gouvernée par les mirs Talpur. Les Britanniques avaient contraint les mirs à laisser l’armée de l’Indus traverser leur pays et à accepter des troupes britanniques pendant la première guerre anglo-afghane ; en 1842, le nouveau gouverneur général, lord Ellenborough, et son général au Sind, sir Charles Napier, exigèrent de nouvelles cessions. Après une attaque baloutche contre la résidence britannique d’Hyderabad, la petite armée de Napier battit des forces talpur bien plus nombreuses à Miani le 17 février 1843 et à Dubba, près d’Hyderabad, le 24 mars, et prit Mirpur et Umarkot. Le Sind fut annexé, à l’exception de Khairpur, dont le mir s’était rangé du côté des Britanniques. La conquête fut largement critiquée en Grande-Bretagne comme une attaque que rien n’avait provoquée.
