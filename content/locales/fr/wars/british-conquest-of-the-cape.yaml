# French translations of the catalogue text (wave 13); step bodies follow later.
British conquest of the Cape: Conquête britannique du Cap
? "The two British invasions that took the Cape of Good Hope from the Dutch, an outcome of the French Revolutionary and Napoleonic Wars. When French armies overran the Dutch Republic in 1795 and the Batavian Republic was proclaimed, Britain moved to keep the Cape, the half-way station on the sea route to India, out of French hands. A squadron under Vice-Admiral George Elphinstone, with troops under Major-General James Craig, anchored in False Bay in June 1795, bearing letters from the exiled stadtholder William V asking the Dutch East India Company’s governor, Abraham Sluysken, to admit them. He refused; the British forced the Muizenberg pass on 7 August, and when reinforcements under General Alured Clarke arrived in September the colony capitulated. A Batavian squadron sent to retake it surrendered in Saldanha Bay in August 1796. The Peace of Amiens returned the Cape to the Batavian Republic, which took it over in February 1803, but when war resumed Britain sent a second expedition: Sir David Baird’s army landed north of Cape Town, defeated Governor Jan Willem Janssens’s smaller and mixed force at Blaauwberg on 8 January 1806, took Cape Town on 10 January and received Janssens’s capitulation on 18 January. The Netherlands ceded the colony to Britain in 1814."
: "Les deux invasions britanniques qui enlevèrent le cap de Bonne-Espérance aux Néerlandais, conséquence des guerres de la Révolution et de l’Empire. Lorsque les armées françaises envahirent la République des Provinces-Unies en 1795 et que la République batave fut proclamée, la Grande-Bretagne entreprit de soustraire aux Français le Cap, escale à mi-chemin sur la route maritime des Indes. Une escadre commandée par le vice-amiral George Elphinstone, avec des troupes du major-général James Craig, mouilla dans False Bay en juin 1795, porteuse de lettres du stathouder en exil Guillaume V qui demandaient au gouverneur de la Compagnie néerlandaise des Indes orientales, Abraham Sluysken, de les accueillir. Il refusa ; les Britanniques forcèrent le passage de Muizenberg le 7 août et, quand des renforts commandés par le général Alured Clarke arrivèrent en septembre, la colonie capitula. Une escadre batave envoyée pour la reprendre se rendit dans la baie de Saldanha en août 1796. La paix d’Amiens rendit le Cap à la République batave, qui en reprit possession en février 1803 mais, à la reprise de la guerre, la Grande-Bretagne envoya une seconde expédition : l’armée de sir David Baird débarqua au nord de la ville du Cap, battit à Blaauwberg le 8 janvier 1806 les forces moins nombreuses et composites du gouverneur Jan Willem Janssens, prit Le Cap le 10 janvier et reçut la capitulation de Janssens le 18 janvier. Les Pays-Bas cédèrent la colonie à la Grande-Bretagne en 1814."
