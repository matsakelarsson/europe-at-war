# French translations of the catalogue text (wave 12); step bodies follow later.
British Expedition to Abyssinia: Expédition britannique en Abyssinie
? "A British and Indian army’s march to Magdala to free British and other European captives held by Emperor Tewodros II. Tewodros had imprisoned the British consul Charles Cameron in January 1864, after his letter to Queen Victoria went unanswered, and later the envoy Hormuzd Rassam and missionaries. In 1867 the British government sent an army from Bombay under Sir Robert Napier: about 13,000 soldiers, 26,000 followers and more than 40,000 animals, among them elephants, landed at Zula on the Red Sea and marched some 600 km through the highlands, helped by the ruler of Tigray, Kassa Mercha. On 10 April 1868 Tewodros’s army was cut down at Arogee below Magdala; he released the captives, and on 13 April, as the British stormed the fortress, he shot himself. The British looted and burned Magdala and left the country by June. Kassa Mercha, rewarded with arms, became Emperor Yohannes IV in 1872. Many of the manuscripts and treasures taken from Magdala are still in British collections, and Ethiopia has long asked for their return."
: "La marche d’une armée britannique et indienne sur Magdala pour libérer les captifs britanniques et européens détenus par l’empereur Tewodros II. Tewodros avait fait emprisonner le consul britannique Charles Cameron en janvier 1864, après que sa lettre à la reine Victoria fut restée sans réponse, puis l’envoyé Hormuzd Rassam et des missionnaires. En 1867, le gouvernement britannique envoya de Bombay une armée commandée par sir Robert Napier : environ 13 000 soldats, 26 000 suiveurs et plus de 40 000 animaux, dont des éléphants, débarquèrent à Zula, sur la mer Rouge, et parcoururent quelque 600 km à travers les hauts plateaux, avec l’aide du maître du Tigré, Kassa Mercha. Le 10 avril 1868, l’armée de Tewodros fut taillée en pièces à Arogee, au pied de Magdala ; il libéra les captifs et, le 13 avril, alors que les Britanniques prenaient la forteresse d’assaut, il se donna la mort d’un coup de pistolet. Les Britanniques pillèrent et incendièrent Magdala et avaient quitté le pays en juin. Kassa Mercha, récompensé par des armes, devint l’empereur Yohannes IV en 1872. Une grande partie des manuscrits et des trésors emportés de Magdala se trouvent encore dans des collections britanniques, et l’Éthiopie en réclame depuis longtemps la restitution."
