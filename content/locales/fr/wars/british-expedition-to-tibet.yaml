# French translations of the catalogue text (wave 8); step bodies follow later.
British expedition to Tibet: Expédition britannique au Tibet
A British Indian military expedition into Tibet in 1903–1904, led by Colonel Francis Younghusband and Brigadier-General James Macdonald, also called the Younghusband expedition. The Viceroy, Lord Curzon, sent it to force Tibet to accept trade and border agreements, fearing Russian influence in Lhasa. About 3,000 soldiers and 7,000 porters and followers crossed the Jelep La from Sikkim in December 1903. At Guru (Chumik Shenko) on 31 March 1904 British and Indian troops killed some 600 to 700 Tibetans in minutes; Gyantse was besieged and its fortress stormed in July, and the force entered Lhasa on 3 August. The Dalai Lama had fled to Mongolia. The Convention of Lhasa of 7 September 1904 opened trade marts and imposed an indemnity, and the expedition withdrew. Some 2,000 to 3,000 Tibetans were killed.: Une expédition militaire de l’Inde britannique au Tibet en 1903–1904, menée par le colonel Francis Younghusband et le brigadier-général James Macdonald, également appelée expédition Younghusband. Le vice-roi, lord Curzon, l’envoya pour contraindre le Tibet à accepter des accords commerciaux et frontaliers, car il craignait l’influence russe à Lhassa. Environ 3 000 soldats et 7 000 porteurs et suiveurs franchirent le Jelep La depuis le Sikkim en décembre 1903. À Guru (Chumik Shenko), le 31 mars 1904, les troupes britanniques et indiennes tuèrent quelque 600 à 700 Tibétains en quelques minutes ; Gyantsé fut assiégée et sa forteresse prise d’assaut en juillet, et la colonne entra à Lhassa le 3 août. Le dalaï-lama s’était enfui en Mongolie. La convention de Lhassa du 7 septembre 1904 ouvrit des comptoirs commerciaux et imposa une indemnité, et l’expédition se retira. Quelque 2 000 à 3 000 Tibétains furent tués.
