# French translations of the catalogue text (wave 11); step bodies follow later.
British invasion of Java: Invasion britannique de Java
? The British conquest of Java from its Franco-Dutch government during the Napoleonic Wars, and the storming of the court of Yogyakarta that followed. The Netherlands had been annexed by France in 1810, and Java, governed since 1808 by the marshal Herman Willem Daendels and from 1811 by General Jan Willem Janssens, was the last French-ruled base in the East. An expedition of about 12,000 men, half of them Indian sepoys of the East India Company, sailed from India under General Sir Samuel Auchmuty and landed at Cilincing east of Batavia on 4 August 1811. Batavia surrendered without a fight on 8 August, and on the night of 25–26 August the British stormed the fortified lines of Meester Cornelis, where about 5,000 defenders were captured and about 1,000 found dead. Janssens retreated east, and after his last force broke up he capitulated at Tuntang near Salatiga on 18 September. Thomas Stamford Raffles governed Java for the East India Company. On 20 June 1812 British and sepoy troops, with the Mangkunegaran Legion, stormed and plundered the palace of Sultan Hamengkubuwono II of Yogyakarta, who was deposed and exiled to Penang. Java was returned to the Netherlands in 1816.
: La conquête britannique de Java, alors aux mains d’un gouvernement franco-néerlandais, pendant les guerres napoléoniennes, puis l’assaut donné à la cour de Yogyakarta. Les Pays-Bas avaient été annexés par la France en 1810, et Java, gouvernée depuis 1808 par le maréchal Herman Willem Daendels, puis à partir de 1811 par le général Jan Willem Janssens, était la dernière base sous domination française en Orient. Une expédition d’environ 12 000 hommes, dont une moitié de cipayes indiens de la Compagnie des Indes orientales, partit de l’Inde sous le commandement du général Sir Samuel Auchmuty et débarqua à Cilincing, à l’est de Batavia, le 4 août 1811. Batavia se rendit sans combattre le 8 août et, dans la nuit du 25 au 26 août, les Britanniques prirent d’assaut les lignes fortifiées de Meester Cornelis, où environ 5 000 défenseurs furent faits prisonniers et environ 1 000 retrouvés morts. Janssens se replia vers l’est et, après la dislocation de ses dernières troupes, capitula à Tuntang, près de Salatiga, le 18 septembre. Thomas Stamford Raffles gouverna Java pour le compte de la Compagnie des Indes orientales. Le 20 juin 1812, des troupes britanniques et des cipayes, avec la Légion de Mangkunegaran, prirent d’assaut et pillèrent le palais du sultan Hamengkubuwono II de Yogyakarta, qui fut déposé et exilé à Penang. Java fut rendue aux Pays-Bas en 1816.
