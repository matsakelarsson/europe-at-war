# French translations of the catalogue text (wave 11); step bodies follow later.
British occupation of Manila: Occupation britannique de Manille
? The capture and occupation of Manila and Cavite by a British and East India Company expedition from Madras in the Seven Years’ War, and the risings it set off in Luzon. Spain had entered the war on France’s side in January 1762. On 24 September a fleet under Rear-Admiral Samuel Cornish, carrying about 6,800 soldiers, sailors and marines under Brigadier William Draper, among them Company sepoys, sailed into Manila Bay. The city, governed by the acting governor, Archbishop Manuel Rojo, had small regular forces and thousands of Filipino militia; it was stormed on 6 October and sacked, and Rojo agreed to a ransom of four million dollars, of which only a quarter was ever paid. The judge Simón de Anda y Salazar escaped to Pampanga, proclaimed himself governor and, with an army of Filipino volunteers, kept the British confined to Manila and Cavite. In the Ilocos Diego Silang rose against Spanish rule in December 1762 and sought British help, which never came; he was killed on 28 May 1763, and his widow Gabriela Silang fought on until she and her followers were captured and hanged at Vigan in September. Juan de la Cruz Palaris led a revolt in Pangasinan that lasted until 1765. The Treaty of Paris of 10 February 1763 returned Manila to Spain, and the British sailed away in April 1764.
: La prise et l’occupation de Manille et de Cavite par une expédition britannique et de la Compagnie des Indes orientales partie de Madras pendant la guerre de Sept Ans, et les soulèvements qu’elle déclencha à Luçon. L’Espagne était entrée en guerre aux côtés de la France en janvier 1762. Le 24 septembre, une flotte commandée par le contre-amiral Samuel Cornish, qui transportait environ 6 800 soldats, marins et fusiliers marins sous les ordres du brigadier William Draper, dont des cipayes de la Compagnie, entra dans la baie de Manille. La ville, gouvernée par le gouverneur par intérim, l’archevêque Manuel Rojo, ne disposait que de faibles forces régulières et de milliers de miliciens philippins ; elle fut prise d’assaut le 6 octobre et mise à sac, et Rojo consentit à une rançon de quatre millions de dollars, dont un quart seulement fut jamais versé. Le juge Simón de Anda y Salazar s’échappa vers la Pampanga, se proclama gouverneur et, avec une armée de volontaires philippins, tint les Britanniques confinés à Manille et à Cavite. Dans les Ilocos, Diego Silang se souleva contre la domination espagnole en décembre 1762 et sollicita une aide britannique qui ne vint jamais ; il fut tué le 28 mai 1763, et sa veuve, Gabriela Silang, poursuivit la lutte jusqu’à ce qu’elle et ses partisans soient capturés et pendus à Vigan en septembre. Juan de la Cruz Palaris mena dans le Pangasinan une révolte qui dura jusqu’en 1765. Le traité de Paris du 10 février 1763 rendit Manille à l’Espagne, et les Britanniques repartirent en avril 1764.
