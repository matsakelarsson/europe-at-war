# Some French text was translated automatically.
"Bruce campaign in Ireland": "Campagne Bruce en Irlande"
"The invasion of Ireland by Edward Bruce, brother of Robert I of Scotland, who landed near Larne in May 1315 at the invitation of Domnall Ó Néill of Tír Eógain and was proclaimed High King of Ireland. With Irish allies he beat the forces of the Lordship of Ireland at Connor, Kells and Skerries and took Carrickfergus, and Robert joined him in 1317 for a march as far as Limerick. The campaign came during the Great Famine and devastated much of Ireland; it ended when Edward was defeated and killed at Faughart, near Dundalk, on 14 October 1318.": "L’invasion de l’Irlande par Edward Bruce, frère de Robert Ier d’Écosse, qui débarqua près de Larne en mai 1315 à l’invitation de Domnall Ó Néill de Tír Eógain et fut proclamé Grand Roi d’Irlande. Avec des alliés irlandais, il battit les forces de la Lordship of Ireland à Connor, Kells et Skerries et prit Carrickfergus, et Robert le rejoignit en 1317 pour une marche jusqu’à Limerick. La campagne vint pendant la Grande Famine et dévasta une grande partie de l’Irlande ; elle se termina lorsque Edward fut vaincu et tué à Faughart, près de Dundalk, le 14 octobre 1318."
"The campaign was part of the First War of Scottish Independence, a second front against England. Its destruction is hard to separate from that of the Great Famine of 1315–1317, which struck Ireland at the same time.": "La campagne faisait partie de la Première Guerre d’Indépendance écossaise, un second front contre l’Angleterre. Sa destruction est difficile à séparer de celle de la Grande Famine de 1315–1317, qui a frappé l’Irlande en même temps."
