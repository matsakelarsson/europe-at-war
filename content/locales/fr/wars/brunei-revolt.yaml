# French translations of the catalogue text (wave 11); step bodies follow later.
Brunei revolt: Révolte de Brunei
? The rising of the North Kalimantan National Army (TNKU) in the British protectorate of Brunei and the neighbouring parts of Sarawak and North Borneo. The left-wing Brunei People’s Party of A. M. Azahari had won every elected seat in the Legislative Council in 1962 and opposed the plan to bring Brunei into Malaysia; it wanted a unitary state of North Kalimantan joining Brunei, Sarawak and North Borneo under the Sultan, and its armed wing had been trained and armed with Indonesian help. At about 2 a.m. on 8 December 1962 several thousand TNKU members attacked police stations and government offices across the protectorate, failed to take the Sultan’s palace in Brunei Town, seized the Shell oil field at Seria with European hostages, and took Bangar, Limbang and other towns, while Azahari proclaimed the state from Manila. British troops flown from Singapore, starting with Gurkhas that evening and the Queen’s Own Highlanders on 10 December, retook Brunei Town and Seria within days; on 12 December Royal Marines of 42 Commando stormed Limbang from the river and freed the British Resident and other hostages, losing five men. Iban and other Dayak volunteers raised by Tom Harrisson helped hunt down the rebels in the interior. About 40 rebels were killed and some 3,400 detained; the Commonwealth side lost six dead. The last TNKU commander, Yassin Affendi, was wounded and captured on 18 May 1963. The Sultan declared a state of emergency, which has never been lifted, banned the party and decided in 1963 not to join Malaysia; Brunei stayed a British protectorate until it became independent on 1 January 1984. Indonesia’s support for the revolt led directly to its confrontation with Malaysia.
: Le soulèvement de l’Armée nationale du Kalimantan du Nord (TNKU) dans le protectorat britannique de Brunei et dans les parties voisines du Sarawak et du Bornéo du Nord. Le Parti du peuple de Brunei, formation de gauche dirigée par A. M. Azahari, avait remporté tous les sièges électifs du Conseil législatif en 1962 et s’opposait au projet d’intégrer Brunei à la Malaisie ; il voulait un État unitaire du Kalimantan du Nord réunissant Brunei, le Sarawak et le Bornéo du Nord sous l’autorité du sultan, et sa branche armée avait été entraînée et armée avec l’aide de l’Indonésie. Vers 2 heures du matin, le 8 décembre 1962, plusieurs milliers de membres de la TNKU attaquèrent les postes de police et les bâtiments administratifs dans tout le protectorat ; ils échouèrent à prendre le palais du sultan à Brunei Town, mais s’emparèrent du champ pétrolifère de la Shell à Seria en prenant des otages européens, ainsi que de Bangar, de Limbang et d’autres villes, tandis qu’Azahari proclamait l’État depuis Manille. Les troupes britanniques acheminées par avion depuis Singapour, à commencer par des Gurkhas le soir même et les Queen’s Own Highlanders le 10 décembre, reprirent Brunei Town et Seria en quelques jours ; le 12 décembre, les Royal Marines du 42 Commando prirent d’assaut Limbang depuis le fleuve et libérèrent le résident britannique et d’autres otages, en perdant cinq hommes. Des volontaires ibans et d’autres Dayaks recrutés par Tom Harrisson aidèrent à traquer les rebelles dans l’intérieur. Une quarantaine de rebelles furent tués et quelque 3 400 détenus ; le camp du Commonwealth perdit six hommes. Le dernier commandant de la TNKU, Yassin Affendi, fut blessé et capturé le 18 mai 1963. Le sultan proclama l’état d’urgence, qui n’a jamais été levé, interdit le parti et décida en 1963 de ne pas rejoindre la Malaisie ; Brunei resta un protectorat britannique jusqu’à son indépendance, le 1er janvier 1984. Le soutien de l’Indonésie à la révolte conduisit directement à sa confrontation avec la Malaisie.
