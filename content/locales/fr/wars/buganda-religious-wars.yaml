# French translations of the catalogue text (wave 13); step bodies follow later.
Buganda civil wars: Guerres civiles du Bouganda
? The wars between the Muslim, Catholic and Protestant parties of the kingdom of Buganda, which opened the way to British rule in Uganda. Converts to Islam and to the two Christian missions, many of them young chiefs and royal pages, had become powerful at the court, and Kabaka Mwanga II, who had had dozens of Christians killed in 1885–1887, tried to break them. In August or September 1888 Muslims and Christians together deposed him and enthroned his brother Kiwewa; within weeks the Muslims drove out the Christians and made another brother, Kalema, kabaka. Mwanga escaped and joined the Christian exiles, who won back the capital in October 1889, lost it, and took it for good in February 1890; Kalema withdrew towards Bunyoro. The victors then split into a Catholic party, the Fransa, and a Protestant party, the Ingleza. Frederick Lugard of the Imperial British East Africa Company, who arrived in December 1890, sided with the Protestants, and on 24 January 1892 his Maxim gun decided the battle of Mengo against the Catholics and Mwanga. The settlement that followed divided Buganda’s chieftaincies between the parties, and Buganda became a British protectorate in 1894.
: Les guerres entre les partis musulman, catholique et protestant du royaume du Bouganda, qui ouvrirent la voie à la domination britannique en Ouganda. Les convertis à l’islam et aux deux missions chrétiennes, dont beaucoup de jeunes chefs et de pages royaux, avaient acquis une grande influence à la cour, et le kabaka Mwanga II, qui avait fait tuer des dizaines de chrétiens en 1885–1887, tenta de briser leur pouvoir. En août ou en septembre 1888, musulmans et chrétiens s’unirent pour le déposer et introniser son frère Kiwewa ; en quelques semaines, les musulmans chassèrent les chrétiens et firent d’un autre frère, Kalema, le kabaka. Mwanga s’échappa et rejoignit les chrétiens exilés, qui reprirent la capitale en octobre 1889, la perdirent, puis s’en emparèrent définitivement en février 1890 ; Kalema se retira vers le Bounyoro. Les vainqueurs se divisèrent alors en un parti catholique, les Fransa, et un parti protestant, les Ingleza. Frederick Lugard, de l’Imperial British East Africa Company, arrivé en décembre 1890, prit le parti des protestants et, le 24 janvier 1892, sa mitrailleuse Maxim décida de l’issue de la bataille de Mengo contre les catholiques et Mwanga. Le règlement qui suivit répartit les chefferies du Bouganda entre les partis, et le Bouganda devint un protectorat britannique en 1894.
