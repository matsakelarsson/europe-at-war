# French translations of the catalogue text (wave 7); step bodies follow later.
Soviet conquest of Khiva and Bukhara: Conquête soviétique de Khiva et de Boukhara
The overthrow of the last two Central Asian monarchies by the Red Army in 1920. Khiva and Bukhara had been Russian protectorates and became independent in practice after the Russian Revolution. In Khiva, the Turkmen leader Junaid Khan was driven into the desert and the khan abdicated in February 1920; in Bukhara, Mikhail Frunze’s troops stormed the city on 2 September 1920 and the emir fled east and then to Afghanistan. Local reformers, the Young Khivans and Young Bukharans, headed the people’s soviet republics that replaced them, which were divided between new Soviet republics in 1924.: Le renversement par l’Armée rouge, en 1920, des deux dernières monarchies d’Asie centrale. Khiva et Boukhara avaient été des protectorats russes et étaient devenus indépendants dans les faits après la révolution russe. À Khiva, le chef turkmène Junaid Khan fut repoussé dans le désert et le khan abdiqua en février 1920 ; à Boukhara, les troupes de Mikhaïl Frounze prirent la ville d’assaut le 2 septembre 1920 et l’émir s’enfuit vers l’est, puis en Afghanistan. Des réformateurs locaux, les Jeunes-Khiviens et les Jeunes-Boukhariens, dirigèrent les républiques populaires soviétiques qui les remplacèrent et qui furent partagées en 1924 entre de nouvelles républiques soviétiques.
