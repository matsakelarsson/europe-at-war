# French translations of the catalogue text (wave 12); step bodies follow later.
Bulala wars: Guerres des Boulala
The wars in which the Bulala, a pastoral people of the Lake Fitri region, drove the Sayfawa kings out of Kanem, north-east of Lake Chad, and forced them to rebuild their kingdom in Bornu, west of the lake. Taking advantage of a succession war among the Sayfawa, the Bulala king Abd al-Jalil killed Mai Dawud about 1376; between then and about 1389 seven kings fell fighting the Bulala or their Arab allies, and Mai Umar b. Idris abandoned the capital Njimi and Kanem altogether. In Bornu the dynasty survived a century of civil war between two branches of the royal family, while the Bulala built a strong kingdom in Kanem. Mai Ali Gaji ended the civil wars, beat a Bulala raid about 1471 and founded a fortified capital at Ngazargamu; his son Idris Katakarmabe defeated the Bulala and entered Njimi in triumph early in his reign, 122 years after his ancestors had been driven out. He did not move the capital back, and the wars went on at intervals until Idris Alooma’s campaigns of the 1570s.: Les guerres au cours desquelles les Boulala, peuple pastoral de la région du lac Fitri, chassèrent les rois sayfawa du Kanem, au nord-est du lac Tchad, et les contraignirent à reconstruire leur royaume au Bornou, à l’ouest du lac. Profitant d’une guerre de succession chez les Sayfawa, le roi boulala Abd al-Jalil tua le maï Dawud vers 1376 ; de cette date à 1389 environ, sept rois tombèrent en combattant les Boulala ou leurs alliés arabes, et le maï Umar b. Idris abandonna la capitale, Njimi, et le Kanem tout entier. Au Bornou, la dynastie survécut à un siècle de guerre civile entre deux branches de la famille royale, tandis que les Boulala bâtissaient un royaume puissant au Kanem. Le maï Ali Gaji mit fin aux guerres civiles, repoussa un raid boulala vers 1471 et fonda une capitale fortifiée à Ngazargamu ; son fils Idris Katakarmabe vainquit les Boulala et entra en triomphe à Njimi au début de son règne, 122 ans après que ses ancêtres en avaient été chassés. Il n’y ramena pas la capitale, et les guerres reprirent par intermittence jusqu’aux campagnes d’Idris Alooma dans les années 1570.
