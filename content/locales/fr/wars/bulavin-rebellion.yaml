"Bulavin Rebellion": "Rébellion de Bulavin"
"A rising of Don Cossacks and runaway peasants against Peter the Great’s government, begun in October 1707 when the ataman Kondraty Bulavin and his men killed Prince Yury Dolgorukov, sent to hunt down fugitive serfs on the Don. In 1708 Bulavin took the Don Cossack capital, Cherkassk, but a government army under Yury’s brother Vasily burned Cossack settlements, Bulavin died that July when Cossacks turned against him, and some 2,000 of his followers fled to the Kuban.": "Une montée de Don Cosaques et des paysans fugueurs contre le gouvernement de Pierre le Grand, a commencé en octobre 1707 quand l’ataman Kondraty Bulavin et ses hommes ont tué le prince Yury Dolgoroukov, envoyé pour chasser les serfs fugitifs sur le Don. En 1708, Bulavin prit la capitale Don Cosaque, Cherkassk, mais une armée gouvernementale sous le commandement du frère Yury.Vassily brûla les colonies de Cosaques.Bulavin mourut en juillet quand Cosaques se retourna contre lui, et quelque 2 000 de ses disciples s’enfuirent au Kuban."
