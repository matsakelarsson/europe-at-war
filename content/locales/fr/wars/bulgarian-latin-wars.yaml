"1206–1213": "1206–1213"
"Kaloyan pressed on. On 31 January 1206 he destroyed a Latin force at Rusion, and his armies ravaged Thrace, taking and wrecking towns and carrying off their people. He called himself “the Roman-slayer”, answering the Byzantine emperor Basil II’s name of “Bulgar-slayer”, and the Thracian Greeks, alarmed, turned back to the Latins. Baldwin’s brother Henry, crowned emperor in August 1206, relieved Didymoteicho and won back much of Thrace. In September 1207 Boniface of Thessalonica was killed in a Bulgarian ambush, and Kaloyan besieged Thessalonica, but in October he died in his camp, perhaps murdered.": "Le 31 janvier 1206, il détruisit une force latine à la Rusion, et ses armées ravageaient Thrace, prenant et détruisant des villes et emportant leur peuple. Il s’appelait lui-même le Tueur romain, répondant au nom de l’empereur byzantin Basil II du Tueur bulgare, et les Grecs thraces, alarmés, retournèrent aux Latins. En septembre 1207 Boniface de Thessalonique fut tué dans une embuscade bulgare, et Kaloyan assiégea Thessalonique, mais en octobre il mourut dans son camp, peut-être assassiné."
"His nephew Boril seized the throne and carried on the war. In June 1208 he beat the Latins near Beroe (Stara Zagora), but on 30 June 1208, near Philippopolis, Henry’s army routed him, and the Latins recovered the plain of Philippopolis. Boril’s cousin Alexius Slav, lord of the Rhodopes, went over to the Latins. In 1213 Henry married Boril’s daughter and the two states made peace, which held for the rest of Henry’s reign.": "Son neveu Boril s’empara du trône et poursuivit la guerre. En juin 1208, il battit les Latins près de Béroé (Stara Zagora), mais le 30 juin 1208, près de Philippopolis, l’armée d’Henri le dirigea, et les Latins récupérèrent la plaine de Philippopolis. En 1213, Henry épousa la fille de Boril et les deux États firent la paix, qui occupa le reste du règne d’Henri."
