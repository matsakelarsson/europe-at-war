"February–summer 1205": "Février–été 1205"
"Kaloyan had offered the crusaders friendship after they took Constantinople in 1204, but the emperor Baldwin I treated him as a rebel against lands that had belonged to the Byzantine Empire. The Greek nobles of Thrace, ill-used by their new Latin lords, rose in February 1205, killed or drove out Latin garrisons in Adrianople and Didymoteicho, and called on Kaloyan for help. Baldwin marched to besiege Adrianople with Count Louis of Blois and the doge Enrico Dandolo before all his forces had gathered.": "Kaloyan avait offert aux croisés l’amitié après avoir pris Constantinople en 1204, mais l’empereur Baldwin je le traitai comme un rebelle contre des terres qui avaient appartenu à l’Empire byzantin. Les nobles grecs de Thrace, mal utilisés par leurs nouveaux seigneurs latins, se sont levés en février 1205, ont tué ou chassé les garnisons latines à Adrianople et Didymoteicho, et appelé Kaloyan pour l’aide. Baldwin marcha pour assiéger Adrianople avec le comte Louis de Blois et le doge Enrico Dandolo avant que toutes ses forces ne s’étaient rassemblées."
"Kaloyan came south with Bulgarians, Vlachs and a large force of Cuman horsemen. On 14 April 1205 the Cumans drew the Latin knights into a headlong pursuit, and Kaloyan’s army surrounded them. Louis of Blois was killed and Baldwin taken prisoner; he died in captivity at Tarnovo. Villehardouin and Dandolo led the survivors back to Rodosto. In the summer Kaloyan took Serres and much of Thrace, and he destroyed Philippopolis after its Greek leaders had submitted to him.": "Le 14 avril 1205, les Cuman ont attiré les chevaliers latins dans une poursuite en tête, et l’armée de Kaloyan les a entourés. Louis de Blois a été tué et Baldwin fait prisonnier ; il est mort en captivité à Tarnovo. Villehardouin et Dandolo ont conduit les survivants à Rodosto. En été, Kaloyan prit Serres et une grande partie de Thrace, et il détruisit Philippopolis après que ses dirigeants grecs lui eurent soumis."
