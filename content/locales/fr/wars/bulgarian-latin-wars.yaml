"Bulgarian–Latin wars": "Guerres bulgare-latine"
"The wars between the Second Bulgarian Empire and the Latin Empire founded by the Fourth Crusade. Tsar Kaloyan, joined by the Greek nobles of Thrace, destroyed the Latin army at Adrianople in 1205, captured the emperor Baldwin I and ravaged Thrace until his death at Thessalonica in 1207; his successor Boril was beaten by the emperor Henry at Philippopolis in 1208, and peace followed in 1213.": "Les guerres entre le Second Empire bulgare et l’Empire latin fondées par la Quatrième Croisade. Le tsar Kaloyan, rejoint par les nobles grecs de Thrace, détruit l’armée latine à Adrianople en 1205, capture l’empereur Baldwin Ier et ravagé Thrace jusqu’à sa mort à Thessalonique en 1207 ; son successeur Boril a été battu par l’empereur Henry à Philippopolis en 1208, et la paix suit en 1213."
"Dates are Julian. The main sources are the crusader chroniclers Geoffrey of Villehardouin and Henry of Valenciennes and the Byzantine historians Niketas Choniates and George Akropolites; numbers of soldiers vary widely between them.": "Les principales sources sont les chroniqueurs croisés Geoffrey de Villehardouin et Henry de Valenciennes ainsi que les historiens byzantins Niketas Choniates et George Akropolites ; le nombre de soldats varie grandement entre eux."
"Fighting between Bulgaria and the Latin Empire flared up again later, notably in the siege of Constantinople of 1235–1236, told under the Nicaean–Latin wars.": "Les combats entre la Bulgarie et l’Empire Latin ont repris plus tard, notamment lors du siège de Constantinople de 1235 à 1236, relaté sous les guerres nicaéennes-latines."
