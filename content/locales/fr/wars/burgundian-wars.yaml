"1476–1477": "1476–1477"
"René II won back Nancy in October 1476, and Charles, against advice, besieged it again with a much weakened army through a hard winter. René raised an army of Swiss mercenaries, Alsatians and Lorrainers, paid partly with French money, and on 5 January 1477 attacked the Burgundian lines south of the town in snow. While part of the Swiss held the Burgundians in front, a column marched round through the woods and fell on their flank, and the army broke. Charles was killed in the rout. His body, stripped and with the head split open, was found two days later frozen in a pond.": "René II remporta Nancy en octobre 1476, et Charles, contre conseil, l’assiégea à nouveau avec une armée beaucoup affaiblie par un hiver dur. René souleva une armée de mercenaires suisses, alsaciens et Lorrainers, payé en partie avec l’argent français, et le 5 janvier 1477 attaqua les lignes bourguignonnes au sud de la ville dans la neige. Alors qu’une partie des Suisses tenait les Burgundiens devant, une colonne marchait dans les bois et tomba sur leur flanc, et l’armée se brisa. Charles fut tué dans la rout. Son corps, dépouillé et la tête scindée ouverte, fut retrouvé deux jours plus tard gelé dans un étang."
"His only child, Mary, aged nineteen, inherited his lands. Louis XI at once occupied the duchy of Burgundy and sent troops into Picardy, Artois and Franche-Comté. In Ghent the estates made Mary grant them the Great Privilege, restoring the local liberties her father and grandfather had curbed. In August 1477 she married Maximilian of Habsburg, the Emperor’s son, who took up the war with France. The Swiss gained little land, but their victories made their pikemen the most sought-after mercenaries in Europe.": "Son unique enfant, Marie, âgée de dix-neuf ans, hérite de ses terres. Louis XI occupe à la fois le duché de Bourgogne et envoie des troupes en Picardie, Artois et Franche-Comté. À Gand, les domaines font que Marie leur accorde le Grand Privilège, rétablissant les libertés locales que son père et grand-père avaient entravées. En août 1477, elle épouse Maximilien de Habsbourg, fils de l’empereur, qui entreprit la guerre avec la France. Les Suisses ont gagné peu de terres, mais leurs victoires ont fait de leurs pikemen les mercenaires les plus recherchés en Europe."
