"1474–1475": "1474–1475"
"Charles the Bold, Duke of Burgundy since 1467, ruled most of the Low Countries as well as the duchy and county of Burgundy, and hoped to join them into a kingdom. In 1469 Sigismund of Austria pledged him the Habsburg lands in Upper Alsace and the Breisgau for 50,000 florins. Charles’s bailiff there, Peter von Hagenbach, ruled harshly and harassed the trade of Basel, Strasbourg and Mulhouse, which turned to Bern for help. In 1474 Sigismund made a lasting peace with his old enemies the Swiss and joined them and the Alsatian towns against Burgundy. The pledged lands rose, and Hagenbach was tried and beheaded at Breisach on 9 May.": "Charles le Bold, duc de Bourgogne depuis 1467, gouverna la plupart des Pays-Bas ainsi que le duché et le comté de Bourgogne, et espérait les rejoindre dans un royaume. En 1469 Sigismond d’Autriche lui promet les terres Habsburg en Haute Alsace et le Breisgau pour 50 000 fleurons. En 1474, Sigismond fit une paix durable avec ses anciens ennemis les Suisses et les villes alsaciennes contre la Bourgogne. Les terres promises se levèrent, et Hagenbach fut jugé et décapité à Breisach le 9 mai."
"That summer Charles laid siege to Neuss, on the Rhine, to support his ally Archbishop Ruprecht of Cologne against the chapter and towns that had rejected him. The town held out for almost eleven months, and when the Emperor Frederick III came with an imperial army, Charles came to terms and withdrew in June 1475. Meanwhile the Swiss declared war and, with their allies, beat a Burgundian army at Héricourt on 13 November 1474, and in 1475 Bern overran the Vaud, which belonged to Charles’s ally Savoy. Charles made a truce with Louis XI and turned on Lorraine, whose young duke René II had joined his enemies. Nancy fell on 30 November 1475.": "Cet été-là, Charles assiégea Neuss, sur le Rhin, pour soutenir son allié Mgr Ruprecht de Cologne contre le chapitre et les villes qui l’avaient rejeté. La ville s’arrêta pendant près de onze mois, et lorsque l’empereur Frédéric III vint avec une armée impériale, Charles prit ses fonctions et se retira en juin 1475. Pendant ce temps, les Suisses déclaraient la guerre et, avec leurs alliés, battaient une armée bourguignonne à Héricourt le 13 novembre 1474, et en 1475 Bern surpassait le Vaud, qui appartenait à Charles's allié Savoy. Charles fit une trêve avec Louis XI et se tourna vers Lorraine, dont le jeune duc René II avait rejoint ses ennemis. Nancy tomba le 30 novembre 1475."
