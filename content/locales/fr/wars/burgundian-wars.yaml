"Grandson and Morat": "Petit-fils et Morat"
"In February 1476 Charles crossed the Jura with a large army and besieged Grandson, on Lake Neuchâtel, which the Bernese had taken from its Savoyard lord. The garrison of about 400 men surrendered on 28 February, and Charles had them hanged from the trees or drowned in the lake. On 2 March the Swiss army marching to relieve the town ran into the Burgundians a few kilometres to the north-east. As the Swiss columns of pikemen came on, Charles tried to redeploy; the movement turned into panic and his army fled, leaving its guns, tents and the duke’s treasure. Pieces of this “Burgundian booty” are still kept in Swiss museums.": "En février 1476, Charles traversa le Jura avec une grande armée et assiégea Grandson, sur le lac Neuchâtel, que les Bernois avaient pris de son seigneur savoyard. La garnison d’environ 400 hommes se rendit le 28 février, et Charles les fit pendre des arbres ou se noyèrent dans le lac. Le 2 mars, l’armée suisse marchant pour soulager la ville courut dans les Burgundiens à quelques kilomètres au nord-est. Au fur et à mesure que les colonnes suisses de brochets arrivèrent, Charles tenta de se redéployer ; le mouvement se transforma en panique et son armée s’enfuit, laissant ses canons, ses tentes et le trésor du duc."
"Charles raised a new army in camp near Lausanne and in June besieged Morat (Murten), held by a Bernese garrison under Adrian von Bubenberg. The Confederates gathered with René of Lorraine and contingents from Alsace and Austria, and on 22 June, after a morning of rain, they stormed the palisade the Burgundians had built facing east. Charles had not expected an attack that day, and his army was caught strung out between its camp and the lake. Thousands were cut down or drowned in Lake Morat; some estimates put the Burgundian dead at 10,000 or more. Savoy soon made its peace with the Swiss and France.": "Charles éleva une nouvelle armée dans un camp près de Lausanne et en juin assiégé Morat (Murten), détenu par une garnison bernoise sous la direction d’Adrian von Bubenberg. Les Confédérés se rassemblèrent avec René de Lorraine et des contingents d’Alsace et d’Autriche, et le 22 juin, après une matinée de pluie, ils prirent l’assaut de la palissade que les Bourguignons avaient construite face à l’est. Charles ne s’attendait pas à une attaque ce jour-là, et son armée était coincée entre son camp et le lac. Des milliers furent abattus ou noyés dans le lac de Morat ; certaines estimations mettent les morts bourguignons à 10 000 ou plus. Savoy fit bientôt la paix avec les Suisses et la France."
