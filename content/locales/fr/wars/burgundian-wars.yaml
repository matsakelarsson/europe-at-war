"1476": "1476"
"Burgundian Wars": "Guerres bourguignonnes"
"The wars between Charles the Bold, Duke of Burgundy, and the Swiss Confederates and their allies on the upper Rhine and in Lorraine. Swiss infantry beat the Burgundian army at Grandson and Morat in 1476, and Charles was killed at Nancy in January 1477; his death broke up the Burgundian state, divided between France and the Habsburgs through his daughter Mary’s marriage to Maximilian.": "Les guerres entre Charles le Bold, duc de Bourgogne, et les Confédérés suisses et leurs alliés sur le Rhin supérieur et en Lorraine. L’infanterie suisse bat l’armée bourguignonne à Grandson et à Morat en 1476, et Charles est tué à Nancy en janvier 1477 ; sa mort rompt l’État bourguignon, divisé entre la France et les Habsbourgs par son mariage de sa fille Marie avec Maximilien."
"The Swiss allies were Sigismund of Austria, ruler of Tyrol and the Habsburg lands on the upper Rhine; the Lower Union of Basel, Strasbourg, Colmar, Sélestat and other Alsatian towns; and, from 1475, René II of Lorraine. Louis XI of France paid subsidies but sent no army against Charles until after his death.": "Les alliés suisses étaient Sigismond d’Autriche, chef du Tyrol et des terres des Habsbourg sur le Rhin supérieur ; la Basse Union de Bâle, Strasbourg, Colmar, Sélestat et d’autres villes alsaciennes ; et, à partir de 1475, René II de Lorraine. Louis XI de France paya des subventions mais n’envoya aucune armée contre Charles avant sa mort."
"Places in the Vaud are given their French names, with the German name where English accounts often use it (Morat/Murten).": "Les endroits du Vaud reçoivent leur nom français, avec le nom allemand où les comptes anglais l’utilisent souvent (Morat/Murten)."
