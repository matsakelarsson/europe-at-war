# French translations of the catalogue text (wave 11); step bodies follow later.
Burma campaign: Campagne de Birmanie
? The fighting for Burma in the Second World War. Japan invaded the British colony from Thailand in December 1941 and January 1942, to cut the Burma Road that carried Allied supplies to China and to guard the flank of its conquests in Malaya, and Burmese nationalists of the Burma Independence Army under Aung San marched in with it, hoping for independence. By May 1942 the British, Indian, Burmese and Chinese armies had been driven out to India and Yunnan, and hundreds of thousands of refugees had fled on foot. Japan built the Burma Railway from Thailand with the forced labour of Allied prisoners and Asian workers, tens of thousands of whom died, and in 1943 declared Burma independent under Ba Maw. Allied counter-attacks in Arakan and Wingate’s Chindit raids in 1943 achieved little, but in 1944 the Japanese offensive into India was broken at Imphal and Kohima, while Chinese and American troops under Stilwell took Myitkyina and reopened the road to China. In 1945 Slim’s Fourteenth Army crossed the Irrawaddy, won at Meiktila and Mandalay and reached Rangoon in May; in March the Burma National Army had turned against the Japanese. Japan’s dead in Burma are estimated at 144,000–164,500, and estimates of Burmese civilian deaths range from about 250,000 to 1 million.
: Les combats pour la Birmanie pendant la Seconde Guerre mondiale. Le Japon envahit la colonie britannique depuis la Thaïlande en décembre 1941 et en janvier 1942, pour couper la route de Birmanie qui acheminait le ravitaillement allié vers la Chine et pour protéger le flanc de ses conquêtes en Malaisie, et des nationalistes birmans de l’Armée pour l’indépendance de la Birmanie, conduits par Aung San, entrèrent avec lui dans le pays dans l’espoir d’obtenir l’indépendance. En mai 1942, les armées britannique, indienne, birmane et chinoise avaient été refoulées vers l’Inde et le Yunnan, et des centaines de milliers de réfugiés avaient fui à pied. Le Japon construisit depuis la Thaïlande le chemin de fer de Birmanie grâce au travail forcé de prisonniers alliés et de travailleurs asiatiques, dont des dizaines de milliers moururent, et proclama en 1943 l’indépendance de la Birmanie sous Ba Maw. Les contre-attaques alliées en Arakan et les raids des Chindits de Wingate en 1943 n’obtinrent guère de résultats, mais en 1944 l’offensive japonaise vers l’Inde fut brisée à Imphal et à Kohima, tandis que des troupes chinoises et américaines commandées par Stilwell prenaient Myitkyina et rouvraient la route de la Chine. En 1945, la Quatorzième Armée de Slim franchit l’Irrawaddy, l’emporta à Meiktila et à Mandalay et atteignit Rangoun en mai ; en mars, l’Armée nationale birmane s’était retournée contre les Japonais. Les morts japonais en Birmanie sont estimés à 144 000–164 500, et les estimations des morts civils birmans vont d’environ 250 000 à 1 million.
