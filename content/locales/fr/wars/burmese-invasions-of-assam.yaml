# French translations of the catalogue text (wave 8); step bodies follow later.
Burmese invasions of Assam: Invasions birmanes de l’Assam
Three Burmese invasions of the Ahom kingdom of Assam, and its conquest. Called in by the exiled Ahom viceroy Badan Chandra Borphukan, a Burmese army defeated the Ahoms at Ghiladhari in 1817 and put him in power. A second invasion in 1819 restored King Chandrakanta Singha against his rival Purandar Singha, and when Chandrakanta turned against his patrons, a third invasion in 1821–1822 under Mingimaha Tilowa and Maha Bandula drove him out and ended Ahom rule. Burmese rule, remembered in Assam for its violence, brought the Konbaung empire to the borders of British Bengal. In the First Anglo-Burmese War the East India Company occupied Guwahati in 1824 and took the surrender of Rangpur in January 1825, and in the Treaty of Yandabo (24 February 1826) Burma renounced its claims to Assam and Manipur. Assam passed to British rule.: Trois invasions birmanes du royaume ahom d’Assam, suivies de sa conquête. Appelée par le vice-roi ahom en exil Badan Chandra Borphukan, une armée birmane battit les Ahoms à Ghiladhari en 1817 et le porta au pouvoir. Une deuxième invasion, en 1819, rétablit le roi Chandrakanta Singha contre son rival Purandar Singha, et lorsque Chandrakanta se retourna contre ses protecteurs, une troisième invasion, en 1821–1822, sous Mingimaha Tilowa et Maha Bandula, le chassa et mit fin au pouvoir ahom. La domination birmane, dont l’Assam garde le souvenir pour sa violence, porta l’empire Konbaung jusqu’aux frontières du Bengale britannique. Pendant la première guerre anglo-birmane, la Compagnie des Indes orientales occupa Guwahati en 1824 et obtint la reddition de Rangpur en janvier 1825, et par le traité de Yandabo (24 février 1826) la Birmanie renonça à ses prétentions sur l’Assam et le Manipur. L’Assam passa sous domination britannique.
