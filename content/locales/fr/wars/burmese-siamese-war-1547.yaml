# French translations of the catalogue text (wave 11); step bodies follow later.
Burmese–Siamese War (1547–1549): Guerre birmano-siamoise (1547–1549)
The first war between Toungoo Burma and the Siamese kingdom of Ayutthaya, and the first of the Burmese–Siamese wars that went on into the 19th century. According to the Burmese chronicles a Siamese force occupied Tavoy (Dawei), on the Tenasserim coast, by January 1547; a Burmese army retook it later that year. In October 1548, after a succession crisis in Ayutthaya, King Tabinshwehti of Toungoo invaded Siam with about 12,000 men, among them several hundred Portuguese mercenaries, by the Three Pagodas Pass. In a battle outside Ayutthaya, by Thai tradition, Queen Suriyothai was killed on her war elephant shielding her husband, King Maha Chakkraphat. The Burmese could not take the walled island city and withdrew after a month. On the retreat they failed before Kamphaeng Phet but captured the Siamese heir Ramesuan and Prince Thammaracha, who were released under a truce in February 1549 in exchange for two royal war elephants. Tabinshwehti was murdered in 1550; his successor Bayinnaung invaded again in 1563.: La première guerre entre la Birmanie des Taungû et le royaume siamois d’Ayutthaya, et la première des guerres birmano-siamoises, qui se poursuivirent jusqu’au XIXe siècle. Selon les chroniques birmanes, une force siamoise occupait Tavoy (Dawei), sur la côte du Tenasserim, dès janvier 1547 ; une armée birmane la reprit plus tard la même année. En octobre 1548, après une crise de succession à Ayutthaya, le roi Tabinshwehti de Toungoo envahit le Siam par le col des Trois Pagodes avec environ 12 000 hommes, dont plusieurs centaines de mercenaires portugais. Lors d’une bataille livrée devant Ayutthaya, selon la tradition thaïe, la reine Suriyothai fut tuée sur son éléphant de guerre en protégeant son mari, le roi Maha Chakkraphat. Les Birmans ne purent prendre la ville insulaire fortifiée et se retirèrent au bout d’un mois. Pendant la retraite, ils échouèrent devant Kamphaeng Phet, mais capturèrent l’héritier siamois Ramesuan et le prince Thammaracha, qui furent libérés à la faveur d’une trêve en février 1549 en échange de deux éléphants de guerre royaux. Tabinshwehti fut assassiné en 1550 ; son successeur Bayinnaung envahit de nouveau le Siam en 1563.
