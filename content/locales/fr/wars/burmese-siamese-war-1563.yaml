# French translations of the catalogue text (wave 11); step bodies follow later.
Burmese–Siamese wars of 1563–1564 and 1568–1569: Guerres birmano-siamoises de 1563–1564 et de 1568–1569
Two invasions of Siam by Bayinnaung of Toungoo, who had brought the Shan states, Manipur and Lan Na under his rule. In 1563 he demanded one of the Siamese king’s white elephants, the emblems of a universal ruler; when Maha Chakkraphat refused, five Burmese armies took the towns of the north and forced Ayutthaya to surrender in February 1564. Siam became a vassal kingdom, gave up four white elephants and sent hostages to Pegu. In 1568 the former king, allowed home as a monk, renounced the robe and rose in alliance with Setthathirath of Lan Xang, while Maha Thammarachathirat of Phitsanulok stayed loyal to Burma. A Burmese army of about 70,000 besieged Ayutthaya from December 1568, beat a Lao relief army in May 1569, and took the city on 2 August 1569 when a gate was opened from inside. Maha Thammarachathirat was made king of a vassal Siam; Bayinnaung then marched on Vientiane, where the Lao fought a guerrilla war until he withdrew in 1570.: Deux invasions du Siam par Bayinnaung de Toungoo, qui avait soumis les États shans, le Manipur et le Lan Na. En 1563, il exigea l’un des éléphants blancs du roi de Siam, emblèmes d’un souverain universel ; devant le refus de Maha Chakkraphat, cinq armées birmanes prirent les villes du nord et contraignirent Ayutthaya à se rendre en février 1564. Le Siam devint un royaume vassal, livra quatre éléphants blancs et envoya des otages à Pégou. En 1568, l’ancien roi, autorisé à rentrer comme moine, renonça à la robe et se souleva en alliance avec Setthathirath du Lan Xang, tandis que Maha Thammarachathirat de Phitsanulok restait fidèle à la Birmanie. Une armée birmane d’environ 70 000 hommes assiégea Ayutthaya à partir de décembre 1568, battit une armée lao de secours en mai 1569 et prit la ville le 2 août 1569, lorsqu’une porte fut ouverte de l’intérieur. Maha Thammarachathirat fut fait roi d’un Siam vassal ; Bayinnaung marcha ensuite sur Vientiane, où les Lao menèrent une guérilla jusqu’à son retrait en 1570.
