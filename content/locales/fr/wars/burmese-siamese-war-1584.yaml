# French translations of the catalogue text (wave 11); step bodies follow later.
Burmese–Siamese War (1584–1593): Guerre birmano-siamoise (1584–1593)
"The war in which Siam threw off Burmese overlordship. In 1584 Naresuan, the son of Siam’s vassal king Maha Thammarachathirat, led a Siamese army to help Nanda Bayin of Toungoo against a rising at Ava, then withdrew and declared Siam independent on 3 May 1584. Nanda sent five invasions in nine years: a pursuit force beaten at the Sittaung river, an army caught by the floods, attacks from Lan Na in 1586 and 1590–1591, and a siege of Ayutthaya from December 1586 that ended in a disastrous retreat in April 1587. In January 1593 the last Burmese army met Naresuan near Suphanburi; the Burmese crown prince, Mingyi Swa, was killed, in a duel on elephants by the Siamese chronicles, by a gunshot by the Burmese. Siam then took Tavoy and Tenasserim and carried the war into Burma, and the Toungoo empire began to break up.": "La guerre par laquelle le Siam secoua la suzeraineté birmane. En 1584, Naresuan, fils du roi vassal du Siam Maha Thammarachathirat, conduisit une armée siamoise au secours de Nanda Bayin de Toungoo contre un soulèvement à Ava, puis se retira et proclama l’indépendance du Siam le 3 mai 1584. Nanda lança cinq invasions en neuf ans : une force de poursuite battue sur la Sittaung, une armée surprise par les crues, des attaques depuis le Lan Na en 1586 et en 1590–1591, et un siège d’Ayutthaya, commencé en décembre 1586, qui s’acheva par une retraite désastreuse en avril 1587. En janvier 1593, la dernière armée birmane affronta Naresuan près de Suphanburi ; le prince héritier birman, Mingyi Swa, fut tué, en duel à dos d’éléphant selon les chroniques siamoises, d’un coup de feu selon les sources birmanes. Le Siam prit ensuite Tavoy et Tenasserim et porta la guerre en Birmanie, et l’empire taungû commença à se disloquer."
