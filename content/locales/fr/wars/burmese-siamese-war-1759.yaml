# French translations of the catalogue text (wave 11); step bodies follow later.
Burmese–Siamese War (1759–1760): Guerre birmano-siamoise (1759–1760)
Alaungpaya’s invasion of Siam, the first Burmese army to reach Ayutthaya since 1587. Having united Burma, Alaungpaya accused Siam of sheltering Mon rebels and, when the Siamese at Mergui held a ship he claimed as his, left Rangoon on 21 December 1759 with about 40,000 men. His armies took Tavoy, Mergui and Tenasserim, crossed the hills by the Singkhon Pass in March 1760, swept up the Gulf coast through Kuiburi, Phetchaburi and Ratchaburi, and reached Ayutthaya at the end of March. Siam, weakened by quarrels between King Ekkathat and his brother Uthumphon, held out behind its walls. The Burmese burned the suburbs, massacred refugees outside the southern moat on 13 April and shelled the palace, but on 16 April Alaungpaya fell ill, from dysentery by the Burmese chronicles, from a bursting cannon by Siamese and French accounts. The army withdrew by the Mae Sot pass, and Alaungpaya died on the march on 11 May 1760. Burma kept Tavoy; the war prepared the invasion that destroyed Ayutthaya in 1767.: L’invasion du Siam par Alaungpaya, la première armée birmane à atteindre Ayutthaya depuis 1587. Ayant unifié la Birmanie, Alaungpaya accusa le Siam d’abriter des rebelles môns et, lorsque les Siamois de Mergui retinrent un navire qu’il revendiquait, quitta Rangoun le 21 décembre 1759 avec environ 40 000 hommes. Ses armées prirent Tavoy, Mergui et Tenasserim, franchirent les collines par le col de Singkhon en mars 1760, remontèrent la côte du golfe par Kuiburi, Phetchaburi et Ratchaburi, et atteignirent Ayutthaya à la fin du mois de mars. Le Siam, affaibli par les querelles entre le roi Ekkathat et son frère Uthumphon, tint bon derrière ses murailles. Les Birmans incendièrent les faubourgs, massacrèrent des réfugiés à l’extérieur du fossé méridional le 13 avril et bombardèrent le palais, mais le 16 avril Alaungpaya tomba malade, de dysenterie selon les chroniques birmanes, à cause de l’éclatement d’un canon selon les récits siamois et français. L’armée se retira par le col de Mae Sot, et Alaungpaya mourut en chemin le 11 mai 1760. La Birmanie garda Tavoy ; la guerre prépara l’invasion qui détruisit Ayutthaya en 1767.
