# French translations of the catalogue text (wave 11); step bodies follow later.
Burmese–Siamese War (1765–1767): Guerre birmano-siamoise (1765–1767)
? "The war in which Konbaung Burma destroyed Ayutthaya, the capital of Siam for four centuries. King Hsinbyushin, who had served in his father Alaungpaya’s failed invasion of 1760, first took Lan Na and the Lao kingdoms of Luang Prabang and Vientiane (1763–1765) and the Tenasserim coast (January 1765). In the second half of 1765 two Burmese armies, about 40,000 to 50,000 men in all, invaded Siam: Maha Nawrahta’s from Tavoy in the west and Ne Myo Thihapate’s from Lan Na down the rivers of the north. They met before Ayutthaya in January 1766, beat the Siamese armies sent against them and settled down to a siege that lasted fourteen months, through the floods of the rainy season. Village resistance such as that at Bang Rachan delayed them; a Chinese invasion of Burma from the end of 1765 pressed them to finish. On 7 April 1767 the Burmese undermined and stormed the walls. The city was sacked and burned, King Ekkathat died, and between 30,000 people (by Thai chronicles) and 100,000 (by Burmese) were carried off to Burma. Siam broke up among rival regimes until Taksin, who had broken out of the siege, reunited it."
: "La guerre au cours de laquelle la Birmanie des Konbaung détruisit Ayutthaya, capitale du Siam depuis quatre siècles. Le roi Hsinbyushin, qui avait pris part à l’invasion manquée de son père Alaungpaya en 1760, s’empara d’abord du Lan Na et des royaumes lao de Luang Prabang et de Vientiane (1763–1765), ainsi que de la côte du Tenasserim (janvier 1765). Dans la seconde moitié de 1765, deux armées birmanes, de 40 000 à 50 000 hommes au total, envahirent le Siam : celle de Maha Nawrahta depuis Tavoy, à l’ouest, et celle de Ne Myo Thihapate depuis le Lan Na, en descendant les rivières du nord. Elles se rejoignirent devant Ayutthaya en janvier 1766, battirent les armées siamoises envoyées contre elles et entreprirent un siège qui dura quatorze mois, jusque dans les crues de la saison des pluies. Des résistances villageoises comme celle de Bang Rachan les retardèrent ; une invasion chinoise de la Birmanie, à partir de la fin de 1765, les pressa d’en finir. Le 7 avril 1767, les Birmans sapèrent les murailles et donnèrent l’assaut. La ville fut pillée et incendiée, le roi Ekkathat mourut, et entre 30 000 personnes (selon les chroniques thaïes) et 100 000 (selon les chroniques birmanes) furent emmenées en Birmanie. Le Siam se morcela entre des régimes rivaux jusqu’à ce que Taksin, qui avait forcé les lignes du siège, le réunifie."
