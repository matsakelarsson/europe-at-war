# French translations of the catalogue text (wave 11); step bodies follow later.
Burmese–Siamese War (1775–1776): Guerre birmano-siamoise (1775–1776)
? The largest Burmese invasion of Taksin’s Siam, known in Thailand as the war of Athi Wungyi, the Thai name for the Burmese commander Maha Thiha Thura. In 1774 a Mon rising against Burmese rule at Martaban failed and thousands of Mon fled to Siam; in January 1775 Taksin’s army, with the Lan Na lords Kawila of Lampang and Phaya Chaban, who had turned against the Burmese, took Chiang Mai, and Lan Na became a Siamese vassal. A Burmese force of 8,000 that followed the Mon through the Three Pagodas Pass was surrounded at Bangkaeo near Ratchaburi and surrendered on 31 March 1775. In October 1775 Maha Thiha Thura, victor over the Qing at Maymyo, crossed the Mae Lamao pass with about 35,000 men, took Sukhothai and in December besieged Phitsanulok, defended by the brothers Chaophraya Chakri (the later King Rama I) and Chaophraya Surasi. Taksin came north with a river fleet but could not break through; when the Burmese cut his supply lines he fell back from Pakphing to Phichit, and on 15 March 1776 the defenders broke out of Phitsanulok, which the Burmese burned. King Hsinbyushin’s death in June 1776 made Maha Thiha Thura hurry home, and the remaining Burmese troops withdrew in disorder; by September they had left Siam. The war left the northern cities depopulated, but Burma did not regain Lan Na.
: La plus grande invasion birmane du Siam de Taksin, connue en Thaïlande sous le nom de guerre d’Athi Wungyi, nom thaï du commandant birman Maha Thiha Thura. En 1774, un soulèvement môn contre la domination birmane à Martaban échoua et des milliers de Môns se réfugièrent au Siam ; en janvier 1775, l’armée de Taksin, avec les seigneurs du Lan Na Kawila de Lampang et Phaya Chaban, qui s’étaient retournés contre les Birmans, prit Chiang Mai, et le Lan Na devint un vassal du Siam. Une force birmane de 8 000 hommes qui avait suivi les Môns par le col des Trois Pagodes fut encerclée à Bangkaeo, près de Ratchaburi, et se rendit le 31 mars 1775. En octobre 1775, Maha Thiha Thura, vainqueur des Qing à Maymyo, franchit le col de Mae Lamao avec environ 35 000 hommes, prit Sukhothaï et, en décembre, assiégea Phitsanulok, défendue par les frères Chaophraya Chakri (le futur roi Rama Ier) et Chaophraya Surasi. Taksin remonta vers le nord avec une flotte fluviale mais ne put percer ; lorsque les Birmans coupèrent ses lignes de ravitaillement, il se replia de Pakphing sur Phichit, et le 15 mars 1776 les défenseurs firent une sortie et abandonnèrent Phitsanulok, que les Birmans incendièrent. La mort du roi Hsinbyushin en juin 1776 poussa Maha Thiha Thura à rentrer en hâte, et les troupes birmanes restantes se retirèrent en désordre ; en septembre, elles avaient quitté le Siam. La guerre laissa les villes du nord dépeuplées, mais la Birmanie ne reprit pas le Lan Na.
