# French translations of the catalogue text (wave 11); step bodies follow later.
Burmese–Siamese War (1809–1812): Guerre birmano-siamoise (1809–1812)
? "The last Burmese invasion of Siam, fought over Phuket island, known as Thalang or Junkceylon, and the tin-rich Andaman coast. In 1809, as King Rama I lay dying (he died in September), Bodawpaya’s commander at Tavoy, the Atwinwun, sent a fleet down the coast: Takua Pa surrendered without a fight, the Burmese crossed from the mainland to Phuket in November 1809 and besieged Thalang, and another army crossed the hills and took Chumphon. The Thalang garrison beat off an assault on the night of 18 November, while the new king, Rama II, sent armies south under his brother, the Front Palace prince Maha Senanurak. The Siamese retook Chumphon in January 1810 and drove that army back towards Takua Pa, but a renewed Burmese assault took Thalang on 13 January 1810; the town was plundered and burnt to the ground and its people fled to the mainland. In March 1810 a Siamese and Malay fleet from Trang and Pak Phra, with the navy of Kedah, whose sultan was compelled to send it, moved against Phuket, and the Burmese abandoned the island. Later Burmese expeditions in May 1810 and at the end of 1811 were wrecked by the monsoon or ran out of supplies, and the war was over by January 1812. Phuket and much of the southern coast were left depopulated for decades; when Burma lost Tenasserim to the British in 1826, the base for these invasions was gone."
: "La dernière invasion birmane du Siam, livrée pour l’île de Phuket, appelée Thalang ou Junkceylon, et la côte d’Andaman, riche en étain. En 1809, alors que le roi Rama Ier se mourait (il mourut en septembre), le commandant de Bodawpaya à Tavoy, l’Atwinwun, envoya une flotte le long de la côte : Takua Pa se rendit sans combat, les Birmans passèrent du continent à Phuket en novembre 1809 et assiégèrent Thalang, et une autre armée franchit les collines et prit Chumphon. La garnison de Thalang repoussa un assaut dans la nuit du 18 novembre, tandis que le nouveau roi, Rama II, envoyait des armées vers le sud sous le commandement de son frère, le prince du Palais de l’Avant Maha Senanurak. Les Siamois reprirent Chumphon en janvier 1810 et repoussèrent cette armée vers Takua Pa, mais un nouvel assaut birman emporta Thalang le 13 janvier 1810 ; la ville fut pillée et entièrement incendiée, et ses habitants s’enfuirent sur le continent. En mars 1810, une flotte siamoise et malaise partie de Trang et de Pak Phra, avec la marine du Kedah, dont le sultan avait été contraint de l’envoyer, se porta contre Phuket, et les Birmans abandonnèrent l’île. Les expéditions birmanes suivantes, en mai 1810 et à la fin de 1811, furent brisées par la mousson ou manquèrent de vivres, et la guerre était terminée en janvier 1812. Phuket et une grande partie de la côte sud restèrent dépeuplées pendant des décennies ; lorsque la Birmanie perdit le Tenasserim au profit des Britanniques en 1826, la base de ces invasions disparut."
