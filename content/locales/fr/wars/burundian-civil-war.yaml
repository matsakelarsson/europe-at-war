# French translations of the catalogue text (wave 13); step bodies follow later.
Burundian Civil War: Guerre civile burundaise
? "The civil war in Burundi that followed the murder of the country’s first elected Hutu president, Melchior Ndadaye, by Tutsi army officers on 21 October 1993, and was fought between the Tutsi-dominated army and Hutu rebel movements, chiefly the CNDD-FDD and PALIPEHUTU-FNL. In the weeks after the coup Hutu peasants and local officials killed Tutsi neighbours and the army killed Hutu in reprisal; estimates for the first year range from 50,000 to 100,000 dead. Ndadaye’s successor, Cyprien Ntaryamira, died in the plane shot down over Kigali on 6 April 1994 with Rwanda’s president, and the war grew alongside the Rwandan genocide and the Congo wars: Hutu rebels used bases in Zaire, while Tutsi militias and the army fought them in the hills and in Bujumbura. Major Pierre Buyoya took power in a coup on 25 July 1996, and Burundi’s neighbours imposed an embargo. Peace talks at Arusha, led by Julius Nyerere and after his death by Nelson Mandela, produced the Arusha Peace and Reconciliation Agreement of 28 August 2000, which the main rebel groups did not sign at first. South African troops, an African Union mission and from 2004 a UN operation supported a transition; the CNDD-FDD signed a ceasefire on 3 December 2002 and joined the government in 2003, and after elections its leader, Pierre Nkurunziza, was sworn in as president on 26 August 2005, the date usually taken as the end of the war. The FNL fought on until a ceasefire in 2006, renewed fighting in 2008 and its disarmament in 2009. About 300,000 people were killed in the war, and hundreds of thousands fled to Tanzania."
: "La guerre civile qui suivit au Burundi l’assassinat du premier président hutu élu du pays, Melchior Ndadaye, par des officiers tutsi de l’armée le 21 octobre 1993, et qui opposa l’armée dominée par les Tutsi aux mouvements rebelles hutu, principalement le CNDD-FDD et le PALIPEHUTU-FNL. Dans les semaines qui suivirent le coup d’État, des paysans et des responsables locaux hutu tuèrent leurs voisins tutsi, et l’armée tua des Hutu en représailles ; les estimations pour la première année vont de 50 000 à 100 000 morts. Le successeur de Ndadaye, Cyprien Ntaryamira, périt dans l’avion abattu au-dessus de Kigali le 6 avril 1994 avec le président rwandais, et la guerre s’amplifia parallèlement au génocide au Rwanda et aux guerres du Congo : les rebelles hutu disposaient de bases au Zaïre, tandis que des milices tutsi et l’armée les combattaient dans les collines et à Bujumbura. Le major Pierre Buyoya prit le pouvoir par un coup d’État le 25 juillet 1996, et les voisins du Burundi imposèrent un embargo. Les pourparlers de paix d’Arusha, menés par Julius Nyerere puis, après sa mort, par Nelson Mandela, aboutirent à l’accord d’Arusha pour la paix et la réconciliation du 28 août 2000, que les principaux groupes rebelles ne signèrent pas dans un premier temps. Des troupes sud-africaines, une mission de l’Union africaine et, à partir de 2004, une opération de l’ONU appuyèrent une transition ; le CNDD-FDD signa un cessez-le-feu le 3 décembre 2002 et entra au gouvernement en 2003 et, après les élections, son chef, Pierre Nkurunziza, prêta serment comme président le 26 août 2005, date généralement retenue comme celle de la fin de la guerre. Les FNL poursuivirent le combat jusqu’à un cessez-le-feu en 2006, reprirent les armes en 2008 et furent désarmées en 2009. Environ 300 000 personnes furent tuées pendant la guerre, et des centaines de milliers s’enfuirent en Tanzanie."
