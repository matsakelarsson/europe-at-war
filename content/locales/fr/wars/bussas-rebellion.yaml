# French translations of the catalogue text (wave 14); step bodies follow later.
Bussa’s Rebellion: Rébellion de Bussa
? "The largest rising of enslaved people in the history of Barbados, named after Bussa, an African-born man who was head ranger on Bayley’s plantation in the parish of Saint Philip. Enslaved Barbadians had followed the British debates on slavery and on the Imperial Registry Bill, a plan to register every enslaved person that the island’s House of Assembly rejected in November 1815, and many believed that freedom had been granted in London and was being withheld by the planters. Planned on the estates of Saint Philip in the first months of 1816 by Bussa, the drivers Jackey and King Wiltshire, John and Nanny Grigg, the free man Joseph Pitt Washington Franklin and others, the rising began on the night of Easter Sunday, 14 April 1816, with the burning of cane fields, and spread across Saint Philip into Christ Church, Saint John, Saint George and Saint Thomas. Martial law was declared on 15 April. The island militia and British troops, among them the 1st West India Regiment, whose soldiers were Black, defeated the rebels near Bayley’s plantation on 16 April, and Bussa was killed in the fighting. One soldier and one white civilian died on the colonial side. The reprisals were heavy: in the figures used by the UK National Archives about 50 rebels died in battle, 70 were executed in the field, 144 were executed after trial and 132 were transported from the island, while other counts give 214 executed and 170 exiled. The rising was the first of three great revolts in the British Caribbean before emancipation, followed by Demerara in 1823 and the Baptist War in Jamaica in 1831–1832. Barbados named Bussa a National Hero in 1998, and the Emancipation Statue unveiled near Bridgetown in 1985 is popularly called the Bussa statue."
: "Le plus grand soulèvement d’esclaves de l’histoire de la Barbade, qui porte le nom de Bussa, un homme né en Afrique qui était gardien en chef (head ranger) de la plantation Bayley, dans la paroisse de Saint Philip. Les Barbadiens réduits en esclavage avaient suivi les débats britanniques sur l’esclavage et sur l’Imperial Registry Bill, un projet d’enregistrement de chaque personne réduite en esclavage que la Chambre d’assemblée de l’île avait rejeté en novembre 1815, et beaucoup croyaient que la liberté avait été accordée à Londres et que les planteurs la leur refusaient. Préparé sur les domaines de Saint Philip dans les premiers mois de 1816 par Bussa, les commandeurs Jackey et King Wiltshire, John et Nanny Grigg, l’homme libre Joseph Pitt Washington Franklin et d’autres, le soulèvement commença dans la nuit du dimanche de Pâques, 14 avril 1816, par l’incendie de champs de canne, et s’étendit de Saint Philip à Christ Church, Saint John, Saint George et Saint Thomas. La loi martiale fut proclamée le 15 avril. La milice de l’île et les troupes britanniques, parmi lesquelles le 1er régiment des Indes occidentales, dont les soldats étaient noirs, battirent les rebelles près de la plantation Bayley le 16 avril, et Bussa fut tué au combat. Un soldat et un civil blanc moururent du côté colonial. Les représailles furent lourdes : selon les chiffres retenus par les National Archives britanniques, environ 50 rebelles moururent au combat, 70 furent exécutés sur le terrain, 144 furent exécutés après jugement et 132 furent déportés hors de l’île, tandis que d’autres décomptes font état de 214 exécutions et de 170 exils. Ce soulèvement fut la première des trois grandes révoltes des Caraïbes britanniques avant l’émancipation, suivie par celle de Demerara en 1823 et par la guerre baptiste en Jamaïque en 1831–1832. La Barbade a proclamé Bussa héros national en 1998, et la statue de l’Émancipation, inaugurée près de Bridgetown en 1985, est communément appelée la statue de Bussa."
