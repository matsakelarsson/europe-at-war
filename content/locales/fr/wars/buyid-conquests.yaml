# French translations of the catalogue text (wave 7); step bodies follow later.
Buyid conquests: Conquêtes bouyides
The rise of the Buyids, three brothers from Daylam south of the Caspian Sea who began as officers of Daylamite warlords and within twelve years ruled western Iran and Iraq. Ali ibn Buya took Fars in 934, his brother Hasan won the Jibal from the Ziyarids with Isfahan and Rayy, and the youngest, Ahmad, took Khuzestan and in December 945 entered Baghdad, where he deposed the caliph and made his successors figureheads under Buyid protection. A Hamdanid attempt to take Baghdad from him failed in 946.: L’ascension des Bouyides, trois frères du Daylam, au sud de la mer Caspienne, qui débutèrent comme officiers de chefs de guerre daylamites et, en douze ans, devinrent les maîtres de l’ouest de l’Iran et de l’Irak. Ali ibn Buya prit le Fars en 934, son frère Hasan enleva aux Ziyarides le Djibal avec Ispahan et Rayy, et le plus jeune, Ahmad, prit le Khouzistan et entra en décembre 945 à Bagdad, où il déposa le calife et fit de ses successeurs des figures de façade sous la protection bouyide. En 946, une tentative des Hamdanides pour lui reprendre Bagdad échoua.
