# Some French text was translated automatically.
"Byzantine–Angevin war in Albania": "Guerre byzantine-Angevin en Albanie"
"The war in which Charles of Anjou, king of Sicily and heir by treaty to the claims of the Latin emperors, sent an army from his Albanian possessions to attack the restored Byzantine Empire. His troops under Hugh of Sully besieged the Byzantine fortress of Berat from 1280, but in the spring of 1281 a relief army under Michael Tarchaneiotes captured Sully in an ambush and routed his army, which fled to the coast. The Byzantines recovered much of inland Albania, and Charles’s plans for a larger expedition against Constantinople were ended by the Sicilian Vespers in 1282.": "La guerre dans laquelle Charles d’Anjou, roi de Sicile et héritier par traité des revendications des empereurs latins, envoya une armée de ses possessions albanaises pour attaquer l’Empire byzantin restauré. Ses troupes sous Hugh de Sully assiégeèrent la forteresse byzantine de Berat à partir de 1280, mais au printemps de 1281 une armée de secours sous Michael Tarchaneiotes captura Sully dans une embuscade et dirigea son armée qui s’enfuit vers la côte. Les Byzantins récupérèrent une grande partie de l’Albanie intérieure, et les plans de Charles d’une plus grande expédition contre Constantinople furent terminés par les Vêpres siciliens en 1282."
"Charles held Durazzo, Valona and other places on the Albanian coast, which he ruled as the Kingdom of Albania from 1272. By the Treaty of Viterbo of 1267 the exiled Latin emperor Baldwin II had promised him the overlordship of Achaea and a share of any reconquered lands.": "Charles a tenu Durazzo, Valona et d’autres endroits sur la côte albanaise, qu’il a gouverné comme le royaume de l’Albanie à partir de 1272. Par le traité de Viterbo de 1267, l’empereur Latin exilé Baldwin II lui avait promis la seigneurie d’Achaea et une partie des terres reconquises."
"The Sicilian Vespers, which Michael VIII’s diplomacy and money helped to encourage, are told under the War of the Sicilian Vespers.": "Les Vêpres siciliens, que la diplomatie et l’argent de Michael VIII ont aidé à encourager, sont racontés sous la guerre des Vêpres siciliens."
