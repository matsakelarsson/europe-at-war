"Bulgarophygon and the peace": "Bulgarifon et la paix"
"With the Magyars gone, Simeon demanded that the Byzantines return all their Bulgarian prisoners. Leo, at war with the Arabs in the east and without Nikephoros Phokas, who had died or fallen from favour, gave way. Simeon then claimed that not all had been sent back and in the summer of 896 invaded Thrace again. The Byzantines made a truce in the east and brought over the armies of Asia Minor under the Domestic of the Schools, Leo Katakalon. At Bulgarophygon the Bulgarians routed them; the second-in-command, the protovestiarios Theodosios, was among the dead, and Katakalon escaped with a few men.": "Leo, en guerre avec les Arabes à l’est et sans Nikephoros Phokas, qui était mort ou tombé de faveur, a cédé la place. Simeon a alors prétendu que tous n’avaient pas été renvoyés et pendant l’été de 896 envahi Thrace à nouveau. Les Byzantins firent une trêve à l’est et apportèrent les armées d’Asie Mineure sous la Maison des Écoles, Leo Katakalon. A Bulgarophagon les Bulgares les roulèrent ; le second commandant, les protovestiarios Theodosios, était parmi les morts, et Katakalon s’échappa avec quelques hommes."
"An Arab historian, al-Tabari, writes that the Bulgarians then marched on Constantinople and that Leo considered arming Arab prisoners against them. In the peace that followed the market returned to Constantinople and Byzantium agreed to pay Bulgaria a yearly tribute. Bulgaria gained land between the Strandzha mountains and the Black Sea and released its captives, said to number 120,000. The peace lasted until Leo’s death in 912, apart from 904, when Simeon used the Arab sack of Thessalonica to win more of Macedonia.": "Un historien arabe, al-Tabari, écrit que les Bulgares ont ensuite marché sur Constantinople et que Leo a envisagé d’armer des prisonniers arabes contre eux. Dans la paix qui a suivi le marché est revenu à Constantinople et Byzance a accepté de rendre un hommage annuel à la Bulgarie. La paix a duré jusqu’à la mort de Léon en 912, à l’exception de 904, quand Siméon a utilisé le sac arabe de Thessalonique pour gagner plus de Macédoine."
