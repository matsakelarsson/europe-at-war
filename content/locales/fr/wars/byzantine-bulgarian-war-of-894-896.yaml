"Byzantine–Bulgarian war of 894–896": "Guerre byzantine-bulgare de 894 à 896"
"A war that began when the Byzantine government moved the Bulgarian merchants’ market from Constantinople to Thessalonica. Simeon I of Bulgaria invaded Thrace; the Byzantines brought in the Magyars, who ravaged Bulgaria, but Simeon and the Pechenegs drove the Magyars from their steppe homeland and in 896 he routed the Byzantine army at Bulgarophygon, winning a yearly tribute.": "Une guerre qui a commencé lorsque le gouvernement byzantin a déplacé le marché bulgare de Constantinople à Thessalonique. Siméon Ier de Bulgarie a envahi Thrace ; les Byzantins ont amené dans les Magyars, qui ont ravagé la Bulgarie, mais Siméon et les Pechenegs ont chassé les Magyars de leur patrie steppe et en 896 il a fait route l’armée byzantine à Bulgarophagon, gagnant un hommage annuel."
"The main sources are the Byzantine chronicle of Theophanes Continuatus, Constantine VII’s De administrando imperio, written some fifty years later, and Simeon’s own letters to the Byzantine envoy Leo Choirosphaktes. They give few places and dates; the battle on the Southern Buh is dated to 895 or 896, and its site is unknown.": "Les principales sources sont la chronique byzantine de Théophanes Continuatus, Constantin VII. De administrando imperio, écrite environ cinquante ans plus tard, et Siméon propres lettres à l’envoyé byzantin Leo Choirosphaktes. Ils donnent peu de places et de dates ; la bataille sur le Buh du Sud est datée à 895 ou 896, et son site est inconnu."
"Bulgarophygon is today’s Babaeski in Turkish Thrace, and Dristra is Silistra on the Danube. The war is sometimes called the first trade war in Europe; many historians think Simeon was defending his merchants rather than looking for a pretext.": "Bulgarifon est aujourd'hui Babaeski en Thrace turque, et Dristra est Silistra sur le Danube. La guerre est parfois appelée la première guerre commerciale en Europe ; de nombreux historiens pensent que Siméon défendait ses marchands plutôt que de chercher un prétexte."
"The Magyars’ move into the Carpathian Basin that followed is told in the Hungarian conquest of the Carpathian Basin.": "Les Magyars s’installent dans le bassin des Carpates qui suit est raconté dans la conquête hongroise du bassin des Carpates."
