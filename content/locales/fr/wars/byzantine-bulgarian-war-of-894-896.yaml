"In 894 Stylianos Zaoutzes, the chief minister of the Emperor Leo VI, let two merchants with links to his household move the market for Bulgarian traders from Constantinople to Thessalonica, where they paid heavier duties. Simeon, who had become ruler of Bulgaria the year before after studying in Constantinople, protested and was ignored. That autumn he invaded Byzantine Thrace and defeated an army under Prokopios Krenites and Kourtikios, who were both killed. He had the noses of the captured Khazar guardsmen cut off and sent them back to Constantinople.": "En 894 Stylianos Zaoutzes, le ministre en chef de l’empereur Léon VI, laisser deux marchands avec des liens avec sa maison déplacer le marché pour les commerçants bulgares de Constantinople à Thessalonique, où ils ont payé des tâches plus lourdes. Siméon, qui était devenu chef de la Bulgarie l’année précédente après avoir étudié à Constantinople, a protesté et a été ignoré. Cet automne-là, il envahit la Thrace byzantine et défait une armée sous les ordres de Prokopios Krenites et Kourtikios, tous deux tués."
"Leo paid the Magyars, then living on the steppes between the Dnieper and the Danube, to attack Bulgaria from the north. In 895 a Byzantine fleet ferried them across the Danube while Nikephoros Phokas the Elder threatened Bulgaria from the south. The Magyars beat Simeon, who shut himself up in Dristra, and plundered the country up to Preslav. Simeon bought time with talks about prisoners, then made an alliance with the Pechenegs. In 896, or perhaps late 895, his army beat the Magyars on the Southern Buh while the Pechenegs ravaged their homeland.": "Léon paie les Magyars, qui vivent alors dans les steppes entre le Dniepr et le Danube, pour attaquer la Bulgarie par le nord. En 895, une flotte byzantine leur fait traverser le Danube tandis que Nicéphore Phocas l’Ancien menace la Bulgarie par le sud. Les Magyars battent Siméon, qui se retranche à Dristra, et pillent le pays jusqu’à Preslav. Siméon gagne du temps en négociant au sujet des prisonniers, puis s’allie aux Petchénègues. En 896, ou peut-être à la fin de 895, son armée bat les Magyars sur le Boug méridional tandis que les Petchénègues ravagent leur territoire."
