"913–914": "913–914"
"In 912 the new emperor Alexander sent Simeon’s envoys away with threats, ending the peace of 896. Alexander died in June 913, leaving his seven-year-old nephew Constantine VII under a regency led by Patriarch Nicholas Mystikos. In August Simeon arrived before Constantinople with a large army. He knew he could not take the city without ships, and soon opened talks. Nicholas came out to his camp and crowned him, perhaps with his own patriarchal headdress, and the regents seem to have agreed that Constantine would marry one of Simeon’s daughters, which could have made Simeon the boy emperor’s guardian.": "En 912, le nouvel empereur Alexandre envoya les envoyés de Siméon avec des menaces, mettant fin à la paix de 896. Alexander mourut en juin 913, laissant son neveu de sept ans Constantin VII sous une régence dirigée par le patriarche Nicholas Mystikos. Au mois d’août Siméon arriva devant Constantinople avec une grande armée. Il savait qu’il ne pouvait pas prendre la ville sans navires, et bientôt ouvert les pourparlers. Nicolas est sorti dans son camp et l’a couronné, peut-être avec sa propre adresse patriarcale, et les régents semblent avoir convenu que Constantin épouserait une des filles de Siméon, ce qui aurait pu faire de Siméon le gardien du garçon empereur."
"Byzantine writers later presented the coronation as a sham, but Simeon called himself emperor from then on. In February 914 Constantine’s mother, Zoe Karbonopsina, overthrew the regency and revoked the agreement. Simeon invaded Thrace that summer while his troops pressed on Thessalonica and Dyrrhachium. In September the Armenian commander of Adrianople surrendered the city to him, but the Byzantines soon bought it back.": "Les écrivains byzantins ont ensuite présenté le couronnement comme une honte, mais Siméon s’est appelé empereur à partir de là. En février 914 Constantine, la mère, Zoe Karbonopsina, a renversé la régence et révoqué l’accord. Siméon envahit Thrace cet été pendant que ses troupes pressaient sur Thessalonique et Dyrrachium. En septembre, le commandant arménien d’Adrianople lui rendit la ville, mais les Byzantins la rachètent bientôt."
