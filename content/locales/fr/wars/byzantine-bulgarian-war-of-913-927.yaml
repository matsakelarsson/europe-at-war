"In 917 Zoe’s government made peace with the Arabs and gathered the whole army of the empire under the Domestic of the Schools, Leo Phokas. The fleet under Romanos Lekapenos was to carry Pechenegs across the Danube to attack from the north, but Romanos and the envoy John Bogas quarrelled and the Pechenegs never crossed. Leo marched up the Black Sea coast alone. On 20 August, by the river Achelous near Anchialos, the Byzantines were at first winning, but when Leo lost his horse panic spread, and Simeon led his cavalry down from the hills. The army was destroyed; Leo the Deacon wrote of piles of bones still visible there decades later.": "En 917 le gouvernement de Zoé a fait la paix avec les Arabes et rassemblé toute l’armée de l’empire sous la Domestique des Écoles, Leo Phokas. La flotte sous Romanos Lekapenos devait transporter des Pechenegs à travers le Danube pour attaquer du nord, mais Romanos et l’envoyé John Bogas se sont disputés et les Pechenegs n’ont jamais traversé. Le 20 août, près de la rivière Achelous, près d’Anchialos, les Byzantins ont gagné, mais quand Léon a perdu son cheval paniqué, et Siméon a mené sa cavalerie vers le bas des collines. L’armée a été détruite ; Léon le diacre a écrit des tas d’os encore visibles là des décennies plus tard."
"That autumn Leo Phokas raised another army, and the Bulgarians destroyed it in a night attack at Katasyrtai, close to Constantinople. In 919 Romanos Lekapenos took power, married his daughter to Constantine VII and in 920 was crowned senior emperor, the place Simeon wanted for himself. Simeon refused to deal with him. His armies reached the Isthmus of Corinth, camped on the Dardanelles in 920, routed the Byzantines at Pegae outside Constantinople in 921 and burned imperial palaces near the city in 922.": "En 919 Romanos Lekapenos prit le pouvoir, épousa sa fille à Constantin VII et en 920 fut couronné empereur supérieur, la place que Siméon voulait pour lui-même. Siméon refusa de traiter avec lui. Ses armées atteignirent l’isthme de Corinthe, campèrent sur les Dardanelles en 920, roulèrent les Byzantins à Pegae en dehors de Constantinople en 921 et brûlèrent des palais impériaux près de la ville en 922."
