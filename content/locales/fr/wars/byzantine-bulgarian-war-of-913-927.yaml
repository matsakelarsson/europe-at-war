"924–927": "924–927"
"Simeon had spent years installing and deposing Serbian princes as the Byzantines bribed them to change sides. When Prince Zaharija killed two Bulgarian generals and sent their heads to Constantinople, a large army invaded Serbia in 924. Zaharija fled to Croatia; the Serbian župans who came to pay homage to Simeon’s candidate, Časlav, were arrested, and Serbia was annexed. In September Simeon camped once more before Constantinople and met Romanos I at Kosmidion, outside the walls. Neither side’s account of the talks survives in full, but the war in Thrace largely stopped, and Simeon soon styled himself emperor of the Bulgarians and the Romans.": "Lorsque le prince Zaharija a tué deux généraux bulgares et envoyé leur tête à Constantinople, une grande armée a envahi la Serbie en 924. Zaharija s’est enfuie en Croatie ; les župans serbes qui sont venus rendre hommage au candidat de Siméon, Časlav, ont été arrêtés et la Serbie a été annexée. En septembre Siméon campa une fois de plus avant Constantinople et rencontra Romanos I à Kosmidion, en dehors des murs. Ni l’un ni l’autre récit des pourparlers survit pleinement, mais la guerre à Thrace s’arrêta largement, et Siméon se nomma bientôt empereur des Bulgares et des Romains."
"Annexing Serbia brought Bulgaria up against Croatia, whose king, Tomislav, was a Byzantine ally. In 926 a Bulgarian army sent into Croatia was destroyed, and papal envoys arranged a peace. Simeon died on 27 May 927 while preparing another attack on Constantinople. His son Peter I, guided by his uncle George Sursuvul, made peace. On 8 October 927 Peter married Maria, the granddaughter of Romanos I. Byzantium recognised his title of emperor (tsar), recognised the head of the Bulgarian church as a patriarch and resumed a yearly payment, and the frontier went back roughly to that of 904.": "En 926, une armée bulgare envoyée en Croatie fut détruite et les envoyés du pape arrangeèrent la paix. Siméon mourut le 27 mai 927 alors qu’il préparait une nouvelle attaque contre Constantinople. Son fils Peter Ier, guidé par son oncle George Sursuvul, fit la paix. Le 8 octobre 927 Pierre épousa Maria, petite-fille de Romanos Ier. Byzance reconnut son titre d’empereur (tsar), reconnut le chef de l’église bulgare comme patriarche et reprit un paiement annuel, et la frontière remonta à peu près à celle de 904."
