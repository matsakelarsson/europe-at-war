"Byzantine–Bulgarian war of 913–927": "Guerre byzantine-bulgare de 913-927"
"Simeon I of Bulgaria’s war to win the throne of Constantinople. He extracted an imperial coronation from the regents of the boy emperor Constantine VII in 913, destroyed the Byzantine army at Achelous in 917 and raided Thrace and Greece for years, but without a fleet he could not take the city. After his death in 927 his son Peter made a peace that recognised him as emperor (tsar) of the Bulgarians.": "Siméon I de Bulgarie La guerre pour gagner le trône de Constantinople. Il a extrait une couronne impériale des régents du garçon empereur Constantin VII en 913, détruit l’armée byzantine à Achelous en 917 et a attaqué Thrace et la Grèce pendant des années, mais sans une flotte il ne pouvait pas prendre la ville. Après sa mort en 927, son fils Pierre fit une paix qui le reconnut comme empereur (tsar) des Bulgares."
"Almost all the narrative comes from Byzantine chroniclers hostile to Simeon, above all Theophanes Continuatus, with the letters that Patriarch Nicholas Mystikos and Romanos I wrote to him. What Simeon was crowned in 913, and what Romanos conceded in 924, are disputed; many historians think Simeon was crowned emperor of the Bulgarians, not of the Romans.": "Presque tout le récit vient des chroniqueurs byzantins hostiles à Siméon, surtout Théophanes Continuatus, avec les lettres que patriarche Nicholas Mystikos et Romanos je lui ai écrit. Ce que Siméon a été couronné en 913 et ce que Romanos concédé en 924, sont contestés ; beaucoup d’historiens pensent Siméon a été couronné empereur des Bulgares, pas des Romains."
"The size of the armies at Achelous is not known; figures such as 60,000 for the Byzantines are modern guesses. Anchialos is today’s Pomorie, and Katasyrtai was a place near Constantinople whose site is unknown.": "La taille des armées à Achelous n’est pas connue ; des chiffres tels que 60 000 pour les Byzantins sont des suppositions modernes. Anchialos est aujourd'hui de Pomorie, et Katasyrtai était un endroit près de Constantinople dont le site est inconnu."
"The Croatian victory of 926 is told in its own entry, the Croatian–Bulgarian war.": "La victoire croate de 926 est racontée dans sa propre entrée, la guerre Croate-Bulgarie."
