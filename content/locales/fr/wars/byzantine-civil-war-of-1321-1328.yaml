"Byzantine civil war of 1321–1328": "Guerre civile byzantine de 1321 à 1328"
"A struggle for the throne between the elderly Emperor Andronikos II Palaiologos and his grandson Andronikos III, whom he had disinherited in 1320. Backed by ambitious young nobles such as John Kantakouzenos, Syrgiannes Palaiologos and Theodore Synadenos, the younger Andronikos raised Thrace against his grandfather in 1321 and forced him to share the empire. Fighting flared up again in 1322 and in 1327–1328, when the Serbian king Stefan Dečanski backed the old emperor and the Bulgarian tsar Michael Shishman the young one. Thessalonica went over to Andronikos III early in 1328, and on the night of 23–24 May he entered Constantinople; his grandfather abdicated and died as a monk in 1332. While the Byzantines fought each other, the Ottomans took Prusa (Bursa) in 1326.": "Une lutte pour le trône entre l’empereur Andronikos II Palaiologos âgé et son petit-fils Andronikos III, qu’il avait déshérité en 1320. Soutenu par de jeunes nobles ambitieux tels que John Kantakouzenos, Syrgiannes Palaiologos et Theodore Synadenos, le jeune Andronikos a élevé Thrace contre son grand-père en 1321 et l’a forcé à partager l’empire. Les combats ont repris en 1322 et en 1327-1328, lorsque le roi serbe Stefan Dečanski a soutenu l’ancien empereur et le tsar bulgare Michael Shishman le jeune. Thessalonique est allé à Andronikos III au début de 1328, et dans la nuit du 23 au 24 mai il est entré Constantinople ; son grand-père abdiqué et mort comme moine en 1332. Pendant que les Byzantins se battaient, les Ottomans prirent Prusa (Bursa) en 1326."
"Andronikos III was disinherited after his men killed his brother Manuel by mistake in 1320; their father, the co-emperor Michael IX, died soon after. The war came in three rounds, separated by agreements in 1321 and 1322 and by Andronikos III’s coronation as co-emperor in 1325.": "Andronikos III fut déshérité après que ses hommes eurent tué son frère Manuel par erreur en 1320 ; leur père, l’impereur Michel IX, mourut peu de temps après. La guerre arriva en trois tours, séparés par des accords en 1321 et 1322 et par Andronikos III."
