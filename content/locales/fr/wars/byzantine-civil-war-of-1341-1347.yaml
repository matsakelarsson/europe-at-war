"Byzantine civil war of 1341–1347": "Guerre civile byzantine de 1341 à 1347"
"The war for power in the Byzantine Empire after the death of Andronikos III, between his chief minister John Kantakouzenos and the regency for the boy emperor John V, led by the empress Anna of Savoy, Patriarch John Kalekas and Alexios Apokaukos. It set the landed aristocracy against the towns, where the Zealots seized Thessalonica, and both sides called in Serbs, Bulgarians and Turks. Kantakouzenos won and entered Constantinople in 1347 as co-emperor, but the war let Stefan Dušan conquer half the empire and brought the Ottomans into Thrace.": "La guerre pour le pouvoir dans l’Empire byzantin après la mort d’Andronikos III, entre son ministre en chef John Kantakouzenos et la régence du garçon empereur Jean V, dirigé par l’impératrice Anna de Savoie, le patriarche John Kalekas et Alexios Apokaukos. Il établit l’aristocratie des débarquements contre les villes, où les Zealots s’emparèrent de Thessalonique, et les deux parties appelèrent les Serbes, les Bulgares et les Turcs. Kantakouzenos gagna et entra Constantinople en 1347 comme co-empereur, mais la guerre permit à Stefan Dušan de conquérir la moitié de l’empire et d’amener les Ottomans en Thrace."
"Dates are Julian. Kantakouzenos later wrote a history of these years in which he justified himself; the other main account, by Nikephoros Gregoras, is also partisan.": "Dates sont Julian. Kantakouzenos a plus tard écrit une histoire de ces années où il se justifie ; l’autre compte principal, par Nikephoros Gregoras, est également partisan."
"Dušan fought for Kantakouzenos in 1342–1343 and then went over to the regency, taking towns for himself throughout. Umur Bey of Aydın and, from 1345, the Ottoman ruler Orhan sent troops to Kantakouzenos; Bulgaria took Philippopolis and other Thracian towns as the regency’s price.": "Dušan combattit pour Kantakouzenos en 1342–1343, puis passa à la régence, prenant des villes pour lui-même tout au long. Umur Bey d’Aydın et, à partir de 1345, le chef ottoman Orhan envoya des troupes à Kantakouzenos ; la Bulgarie prit Philippopolis et autres villes thraces comme prix de régence."
