"1341–1343": "1341–1343"
"Andronikos III died on 15 June 1341, leaving a nine-year-old heir, John V. His friend and chief minister, the grand domestic John Kantakouzenos, expected to govern, but while he was campaigning in Thrace the empress Anna of Savoy, Patriarch John Kalekas and the ambitious admiral Alexios Apokaukos took control in Constantinople and declared him an enemy. On 26 October 1341 his army and supporters proclaimed him emperor at Didymoteicho. The great landowners mostly sided with him; the townspeople, crushed by taxes, rose against the rich in Adrianople and elsewhere and declared for the regency.": "Andronikos III est décédé le 15 juin 1341, laissant un héritier de neuf ans, John V. Son ami et ministre en chef, le grand domestique John Kantakouzenos, attendait de gouverner, mais pendant qu’il faisait campagne à Thrace l’impératrice Anna de Savoie, le patriarche John Kalekas et l’ambitieux amiral Alexios Apokaukos ont pris le contrôle à Constantinople et l’ont déclaré ennemi. Le 26 octobre 1341, son armée et ses partisans le proclamèrent empereur à Didymoteicho. Les grands propriétaires s’alliaient pour la plupart avec lui ; les habitants, écrasés par les impôts, se soulevèrent contre les riches d’Adrianople et d’ailleurs et déclaraient pour la régence."
"In 1342 the Zealots, a popular party, seized Thessalonica and drove out the aristocrats, and Kantakouzenos, his army melting away, fled to Stefan Dušan of Serbia. With Serbian help he invaded Macedonia but failed before Serres. His fortunes turned when his friend Umur Bey, emir of Aydın, sailed up the Evros with a large fleet and relieved Didymoteicho, where Kantakouzenos’s wife Irene was besieged. Thessaly accepted his rule and he won Veria, but in 1343 Dušan, who had been taking towns for himself, went over to the regency.": "En 1342, les Zealots, parti populaire, s’emparèrent de Thessalonique et chassèrent les aristocrates, et Kantakouzenos, son armée qui se fondait, s’enfuit vers Stefan Dušan de Serbie. Avec l’aide des Serbes il envahit la Macédoine mais échoua avant Serres. Sa fortune tourna quand son ami Umur Bey, émir d’Aydın, remonta les Evros avec une grande flotte et souligna Didymoteicho, où la femme de Kantakouzenos Irene était assiégée. Thessali accepta sa domination et il gagna Veria, mais en 1343 Dušan, qui avait pris des villes pour lui-même, alla à la régence."
