"1344–1347": "1344–1347"
"The regency bought Bulgarian help with Philippopolis and other towns in northern Thrace, and courted the Rhodope warlord Momchil, a former brigand. On 7 July 1345 Kantakouzenos and Umur crushed Momchil at Peritheorion on the Aegean coast, and he was killed. Weeks earlier, on 11 June, Apokaukos had been murdered by political prisoners in the new prison he was inspecting in Constantinople. Dušan took Serres in September and was crowned emperor in 1346. Kantakouzenos had himself crowned at Adrianople on 21 May 1346 and married his daughter Theodora to the Ottoman ruler Orhan, whose troops plundered Thrace.": "La régence a acheté l’aide bulgare avec Philippopolis et d’autres villes dans le nord de Thrace, et courtisé le seigneur de guerre Rhodope Momchil, un ancien brigand. Le 7 juillet 1345 Kantakouzenos et Umur ont écrasé Momchil à Peritheorion sur la côte Égée, et il a été tué. Des semaines plus tôt, le 11 juin, Apokaukos avait été assassiné par des prisonniers politiques dans la nouvelle prison qu’il inspectait à Constantinople. Dušan prit Serres en septembre et fut couronné empereur en 1346. Kantakouzenos s’était lui-même couronné à Adrianople le 21 mai 1346 et épousa sa fille Theodora au chef ottoman Orhan, dont les troupes pillaient Thrace."
"On the night of 2–3 February 1347 supporters opened the walled-up Golden Gate of Constantinople, and Kantakouzenos entered with about a thousand men. After a few days the empress gave in. A settlement on 8 February made him senior emperor for ten years beside John V, who married his daughter Helena. Thessalonica’s Zealots held out until 1350. The war had ruined Thrace, cost the empire most of its European lands to Serbia, and left Turkish soldiers familiar with the country, while the Black Death reached Constantinople that year.": "Dans la nuit du 2 au 3 février 1347 les partisans ont ouvert la porte d’or murée de Constantinople, et Kantakouzenos est entré avec environ un millier d’hommes. Après quelques jours l’impératrice a cédé. Une colonie le 8 février a fait de lui empereur principal pendant dix ans à côté de John V, qui a épousé sa fille Helena. Thessalonica : Zealots tenu jusqu’à 1350. La guerre avait ruiné Thrace, coûté à l’empire la plupart de ses terres européennes à la Serbie, et laissé les soldats turcs familiers avec le pays, tandis que la mort noire atteint Constantinople cette année-là."
