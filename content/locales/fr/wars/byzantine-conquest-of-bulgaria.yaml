"Gabriel Radomir reigned for a year before his cousin Ivan Vladislav, whose life he had once saved, murdered him while hunting in 1015, reportedly with Basil’s encouragement. Ivan offered to submit, then fought on. Basil retook Vodena, which had rebelled, captured Moglena and reached Ohrid, Samuel’s capital, but withdrew when another Byzantine force was ambushed and destroyed. In 1016 Ivan lured Jovan Vladimir of Duklja to Prespa and had him killed, while Basil besieged Pernik for 88 days and again failed to take it.": "Gabriel Radomir régna pendant un an avant que son cousin Ivan Vladislav, dont il avait sauvé la vie, le tua alors qu’il chassait en 1015, avec les encouragements de Basil. Ivan offrit de se soumettre, puis combattit. Basile reprit Vodena, qui s’était rebellé, avait capturé Moglena et atteint Ohrid, capitale de Samuel, mais se retira quand une autre force byzantine fut embusquée et détruite. En 1016 Ivan a attiré Jovan Vladimir de Duklja à Prespa et l’a fait tuer, tandis que Basil assiégeait Pernik pendant 88 jours et ne le prenait pas à nouveau."
"Basil campaigned every year, wasting the country and taking forts one by one. Ivan Vladislav tried to win the Pechenegs as allies and, with Krakra of Pernik, to retake lost towns, without success. In February 1018 he was killed in a skirmish outside the walls of Dyrrhachium, which he was besieging. With him the last Bulgarian ruler with an army in the field was gone, and the nobles began to surrender.": "Basile fit campagne chaque année, gaspillant le pays et prenant des forts un par un. Ivan Vladislav tenta de gagner les Pechenegs comme alliés et, avec Krakra de Pernik, de reprendre les villes perdues, sans succès. En février 1018, il fut tué dans une escarmouche à l’extérieur des murs de Dyrrachium, qu’il assiégea. Avec lui le dernier souverain bulgare avec une armée dans les champs était parti, et les nobles ont commencé à se rendre."
