"In 1014 Samuel tried to stop Basil’s yearly invasion in the narrow valley of the Strumitsa at Kleidion, “the key”, where he built a thick wooden wall between the mountains of Belasitsa and Ograzhden. Basil’s attacks on the wall failed, and a Bulgarian force sent to distract him was beaten outside Thessalonica by its governor, Theophylact Botaneiates. Nikephoros Xiphias then led a detachment along mountain paths over Belasitsa, and on 29 July he fell on the Bulgarians from behind while Basil stormed the wall. Samuel escaped with the help of his son Gabriel Radomir.": "En 1014, Samuel tenta d’arrêter l’invasion annuelle de Basilitsa dans l’étroite vallée de la Strumitsa à Kleidion, où il construisit un mur en bois épais entre les montagnes de Belasitsa et Ograzhden. Les attaques de Basilitsa sur le mur échouèrent, et une force bulgare envoyée pour le distraire fut battue hors de Thessalonique par son gouverneur, Theophylact Botaneaes. Nikephoros Xiphias conduit ensuite un détachement le long des sentiers de montagne sur Belassitsa, et le 29 juillet il tombe sur les Bulgares de derrière tandis que Basil s’empare du mur. Samuel s’échappe avec l’aide de son fils Gabriel Radomir."
"Skylitzes says Basil took 15,000 prisoners (Kekaumenos says 14,000), blinded ninety-nine of every hundred and left the hundredth one eye to lead the others home; modern historians think the numbers exaggerated but do not doubt the blinding. It may have been revenge for Botaneiates, killed soon afterwards in an ambush in a pass near Strumitsa. When the blinded men reached Prespa, Samuel collapsed at the sight and died on 6 October 1014.": "Skylitzes dit Basil a pris 15 000 prisonniers (Kekaumenos dit 14.000), aveuglé 99 sur 100 et laissé le centième oeil pour conduire les autres à la maison ; les historiens modernes pensent que les chiffres exagérés mais ne doutent pas l’aveuglement. Il peut avoir été vengeance pour Botanéia, tué peu après dans une embuscade dans un passage près de Strumitsa. Lorsque les hommes aveugles ont atteint Prespa, Samuel s’est effondré à la vue et est mort le 6 octobre 1014."
