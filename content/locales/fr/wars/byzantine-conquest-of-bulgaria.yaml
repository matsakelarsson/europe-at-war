"From 1000 Basil, at peace in the east, campaigned in the Balkans almost every year. His generals Theodorokanos and Nikephoros Xiphias retook Pliska and the two Preslavs, Great and Little, in the north-east. Basil himself then took Berroia, whose commander changed sides, stormed Servia, recovered the forts of Thessaly and took Vodena after a long siege, moving its people to Thrace. Then he besieged Vidin on the Danube for eight months and took it. While he was there, Samuel raided Adrianople on the feast of the Dormition, 15 August.": "À partir de 1000 Basil, en paix dans l’est, a fait campagne dans les Balkans presque chaque année. Ses généraux Theodorokanos et Nikephoros Xiphias ont repris Pliska et les deux Preslavs, Grand et Petit, dans le nord-est. Basil lui-même prit alors Berroia, dont le commandant changeait de camp, s’empare de Servia, récupère les forts de Thessalie et prend Vodena après un long siège, en déplaçant son peuple à Thrace. Puis il assiégea Vidin sur le Danube pendant huit mois et le prit. Pendant qu’il était là, Samuel fit une descente d’Adrianople lors de la fête de la Dormition, 15 août."
"Marching south, Basil found Samuel’s army camped across the Vardar near Skopje. A soldier found a ford, the Byzantines crossed and routed the Bulgarians, and the governor of Skopje surrendered the town. Basil then besieged Pernik, but its commander, Krakra, held out and the Byzantines withdrew with heavy losses. In 1005 the Chryselios family handed Dyrrhachium to a Byzantine fleet, while Samuel’s son-in-law Ashot slipped away to Constantinople. For the next nine years the war went on in yearly raids and sieges, of which little is recorded.": "Marchant vers le sud, Basile trouva l’armée de Samuel dans le Vardar près de Skopje. Un soldat trouva un gué, les Byzantins traversèrent les Bulgares et le gouverneur de Skopje rendit la ville. Basile assiégea alors Pernik, mais son commandant, Krakra, s’empara et les Byzantins se retiraient avec de lourdes pertes. En 1005, la famille Chrysélios a remis Dyrrachium à une flotte byzantine, tandis que Samuel Son beau-fils Ashot a glissé à Constantinople. Pendant les neuf années suivantes, la guerre s’est poursuivie dans des raids et sièges annuels, dont peu est enregistré."
