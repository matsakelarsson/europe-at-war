"For three years Basil was fighting the rebel Bardas Phokas, and Samuel took the chance. He took Berroia and Servia in Macedonia, gained Dyrrhachium on the Adriatic by marrying the daughter of its leading citizen and at some point won back north-eastern Bulgaria. Basil campaigned in Macedonia from 991 and captured Roman, but in 995 he had to go east to save Aleppo from the Fatimids. Samuel’s men then killed the governor of Thessalonica, Gregory Taronites, outside the city, captured his son Ashot and raided through Thessaly and central Greece into the Peloponnese.": "Pendant trois ans Basil combattait le rebelle Bardas Phokas, et Samuel en a profité. Il a pris Berroia et Servia en Macédoine, a gagné Dyrrachium sur l’Adriatique en épousant la fille de son principal citoyen et à un moment donné a remporté le nord-est de la Bulgarie. Basil a fait campagne en Macédoine à partir de 991 et a capturé Roman, mais en 995 il a dû aller à l’est pour sauver Alep des Fatimides. Samuels hommes ont ensuite tué le gouverneur de Thessalonique, Grégoire Taronites, en dehors de la ville, capturé son fils Ashot et fait une descente à travers Thessalie et la Grèce centrale dans le Péloponnèse."
"Basil’s general Nikephoros Ouranos followed him. On the way home the Bulgarians camped behind the flooded Spercheios near Lamia, sure that no one could cross. Ouranos found a ford, crossed at night and attacked at dawn. Most of the Bulgarian army was killed or captured; Samuel and his son Gabriel Radomir, both wounded, escaped by lying among the dead and fled over the Pindus mountains. When Roman died in captivity in 997, Samuel had himself proclaimed tsar. In 998 he subdued Duklja, on today’s Montenegrin coast, and raided Dalmatia.": "Sur le chemin de la maison les Bulgares campaient derrière le Spercheios inondé près de Lamia, sûr que personne ne pouvait traverser. Ouranos a trouvé un gué, traversé la nuit et attaqué à l’aube. La plupart de l’armée bulgare a été tué ou capturé ; Samuel et son fils Gabriel Radomir, tous deux blessés, se sont échappés en couchant parmi les morts et ont fui au-dessus des montagnes de Pindus. Quand Roman est mort en captivité en 997, Samuel avait lui-même proclamé tsar. En 998 il a soumis Duklja, sur aujourd'hui la côte monténégrine, et a attaqué Dalmatie."
