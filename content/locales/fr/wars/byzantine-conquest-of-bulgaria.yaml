"When John I Tzimiskes died in January 976, Byzantium held eastern Bulgaria, but the west had never been conquered. There four brothers, the sons of a count and so called the Cometopuli, rose against the empire; two were soon killed, and the youngest, Samuel, came to rule. Boris II and his brother Roman escaped from Constantinople, but Boris was killed at the frontier by a guard who took him for a Byzantine. Roman, who had been castrated in captivity, was proclaimed tsar, but Samuel held real power. While Basil II fought the rebel Bardas Skleros in Asia Minor, Samuel raided Greece and starved Larissa into surrender after years of blockade.": "Lorsque Jean Ier Tzimiskes est mort en janvier 976, Byzance a tenu l’est de la Bulgarie, mais l’ouest n’a jamais été conquis. Là quatre frères, les fils d’un comte et dit le Cometopuli, se sont levés contre l’empire ; deux furent bientôt tués, et le plus jeune, Samuel, vint au pouvoir. Boris II et son frère Roman s’échappèrent de Constantinople, mais Boris fut tué à la frontière par un gardien qui le prit pour un byzantin. Roman, qui avait été castré en captivité, a été proclamé tsar, mais Samuel tenait le pouvoir réel. Alors que Basil II a combattu le rebelle Bardas Skleros en Asie Mineure, Samuel a attaqué la Grèce et a affamé Larissa pour se rendre après des années de blocus."
"In 986 Basil marched on Serdica through the pass known as the Gates of Trajan and besieged it for twenty days. The defenders sallied out, burned his siege engines and captured his draught animals, and he turned back. On 17 August, in the pass, the Bulgarians fell on his army and routed it. Basil barely escaped, and his baggage and treasury were lost. The historian Leo the Deacon, who was with the army, only just escaped himself.": "En 986, Basil marcha sur Serdica à travers le col connu sous le nom de Portes de Trajan et l’assiégea pendant vingt jours. Les défenseurs s’enfuyèrent, brûlèrent ses moteurs de siège et capturèrent ses animaux de trait, et il retourna. Le 17 août, dans le col, les Bulgares tombèrent sur son armée et la déroutent. L’historien Leo le diacre, qui était avec l’armée, vient de s’échapper."
