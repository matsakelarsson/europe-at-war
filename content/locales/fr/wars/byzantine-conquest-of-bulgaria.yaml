"The Bulgarian ruler was killed in fighting outside Dyrrhachium. Later legend said he was struck down by a mysterious warrior.": "Le souverain bulgare a été tué dans des combats en dehors de Dyrrachium. Plus tard, la légende dit qu’il a été frappé par un guerrier mystérieux."
"Basil II, 1015": "Basilic II, 1015"
"Ivan Vladislav": "Ivan Vladislav"
"The settlement at Ohrid": "La colonie d’Ohrid"
"In the spring of 1018 Basil marched west. Krakra surrendered Pernik and its neighbouring forts, and commanders and nobles came to his camp with the keys of their towns. At Ohrid Ivan Vladislav’s widow, Maria, gave herself up with her children and the treasury. His sons held out for a time on Mount Tomorr, and the last commanders surrendered or were captured within the year. Basil then went south through Thessaly to Athens, gave thanks in the Parthenon, then the church of the Mother of God, and celebrated a triumph in Constantinople in 1019.": "Au printemps de 1018 Basil marcha vers l’ouest. Krakra rendit Pernik et ses forts voisins, et les commandants et les nobles vinrent à son camp avec les clés de leurs villes. A Ohrid Ivan Vladislav, veuve, Maria, se livra avec ses enfants et le trésor. Ses fils s’arrêtèrent pendant un temps sur le mont Tomorr, et les derniers commandants se rendirent ou furent capturés dans l’année. Basil est ensuite allé vers le sud par Thessalie à Athènes, a rendu grâce dans le Parthénon, puis l’église de la Mère de Dieu, et a célébré un triomphe à Constantinople en 1019."
"Basil’s settlement was mild by the standards of the war. The Bulgarian lands became the provinces of Bulgaria, with its seat at Skopje, Sirmium and, on the lower Danube, Paristrion. Taxes were still taken in kind, as under Samuel, and the church kept its own archbishop at Ohrid, a Bulgarian, appointed by the emperor. Many nobles received Byzantine titles and posts. The Serbs and Croats acknowledged Basil’s overlordship, and for the first time since the 7th century the empire’s border ran along the Danube.": "Les terres bulgares sont devenues les provinces de Bulgarie, avec son siège à Skopje, Sremium et, sur le Danube inférieur, Paristrion. Les impôts sont toujours pris en nature, comme sous Samuel, et l’église garde son propre archevêque à Ohrid, un Bulgare, nommé par l’empereur. Beaucoup de nobles ont reçu des titres et des postes byzantins. Les Serbes et les Croates reconnaissaient la domination des Basilistes, et pour la première fois depuis le 7ème siècle, la frontière de l’empire traversait le Danube."
"Surrender at Ohrid": "Rendez-vous à Ohrid"
"New provinces": "Nouvelles provinces"
"Bulgaria (Skopje), Sirmium, Paristrion": "Bulgarie (Skopje), Sremium, Paristrion"
"Archbishopric of Ohrid": "Archevêque d’Ohrid"
"Self-governing church for the Bulgarian lands": "Église autonome pour les terres bulgares"
"Maria, widow of Ivan Vladislav, surrendered Samuel’s capital, the royal family and the treasury to Basil.": "Maria, veuve d’Ivan Vladislav, a rendu à Basil la capitale Samuels, la famille royale et le trésor."
"Krakra, who had twice held Pernik against Basil, surrendered it with some 35 forts and was made a patrikios.": "Krakra, qui avait deux fois tenu Pernik contre Basil, l’a rendu avec quelque 35 forts et a été fait un patrikios."
"Mount Tomorr": "Mont Tomorr"
"Ivan Vladislav’s eldest son, Presian, and two of his brothers took refuge on the mountain before surrendering.": "Ivan Vladislavès fils aîné, Presian, et deux de ses frères se réfugièrent sur la montagne avant de se rendre."
"Skopje": "M. Skopje"
"Seat of the governor of the new province of Bulgaria.": "Siège du gouverneur de la nouvelle province de Bulgarie."
"Athens": "Athènes"
"Basil gave thanks for his victory in the Parthenon, then a church of the Virgin, and gave it rich gifts.": "Basil a remercié pour sa victoire dans le Parthénon, puis une église de la Vierge, et lui a donné des dons riches."
"Basil II, 1018": "Basilic II, 1018"
