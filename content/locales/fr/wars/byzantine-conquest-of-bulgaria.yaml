"Byzantine conquest of Bulgaria": "La conquête byzantine de la Bulgarie"
"The forty-year war in which the Byzantine emperor Basil II destroyed the western Bulgarian realm of Samuel, centred on Prespa and Ohrid. After a defeat at the Gates of Trajan in 986 and years of Bulgarian raids deep into Greece, the Byzantines won at the Spercheios in 997, took fortress after fortress from 1000 and broke Samuel’s army at Kleidion in 1014, blinding thousands of prisoners. The last Bulgarian leaders surrendered in 1018, and Bulgaria was ruled from Constantinople until 1185.": "La guerre de quarante ans dans laquelle l’empereur byzantin Basil II a détruit le royaume occidental bulgare de Samuel, centré sur Prespa et Ohrid. Après une défaite aux portes de Trajan en 986 et des années de raids bulgares profondément en Grèce, les Byzantins ont gagné aux Spercheios en 997, pris forteresse après forteresse de 1000 et brisé l’armée Samuel à Kleidion en 1014, aveuglant des milliers de prisonniers. Les derniers dirigeants bulgares se rendirent en 1018, et la Bulgarie fut gouvernée de Constantinople jusqu’en 1185."
"The main source is John Skylitzes, who wrote in the late 11th century; Leo the Deacon, who was at the Gates of Trajan, Yahya of Antioch and the Armenian Stepanos Taronetsi add details. Their chronologies often disagree, so several dates here are given as alternatives (the Spercheios 996 or 997, Vidin 1002 or 1003, Skopje 1003 or 1004). Yahya of Antioch has Tsar Roman captured in 991 and dying in 997, while Skylitzes has him surrender Skopje in 1004. No Bulgarian account survives.": "La source principale est John Skylitzes, qui a écrit à la fin du 11ème siècle ; Leo le diacre, qui était aux portes de Trajan, Yahya d’Antioche et les Stepanos Taronetsi arménien ajouter des détails. Leurs chronologies souvent en désaccord, ainsi plusieurs dates ici sont données comme alternatives (Spercheios 996 ou 997, Vidin 1002 ou 1003, Skopje 1003 ou 1004). Yahya d’Antioche a capturé Tsar Roman en 991 et mourant en 997, tandis que Skylitzes lui a rendu Skopje en 1004. Aucun compte bulgare ne survit."
"Samuel’s state is one of the subjects of competing national histories in Bulgaria and North Macedonia. Contemporary Byzantine, Armenian and Arab writers called it Bulgaria, and Basil’s nickname Boulgaroktonos, “Bulgar-slayer”, appears in writing only from the 12th century.": "Samuel est l’un des sujets de l’histoire nationale concurrente en Bulgarie et en Macédoine du Nord. Les écrivains contemporains byzantins, arméniens et arabes l’appelaient la Bulgarie, et le surnom de Basily Boulgaroktonos, \"Bulgar-slayer\", n’apparaît par écrit que depuis le 12ème siècle."
"Places are given their Byzantine names where these are usual in English, with modern names in the text. Serdica or Sredets is Sofia, Berroia is Veria, Vodena is Edessa, Dyrrhachium is Durrës and Kleidion is near today’s Klyuch in Bulgaria. Sviatoslav’s war of 965–971, after which Byzantium annexed eastern Bulgaria, is told in Sviatoslav’s campaigns.": "Les lieux sont donnés leurs noms byzantins où ils sont habituels en anglais, avec des noms modernes dans le texte. Serdica ou Sredets est Sofia, Berroia est Veria, Vodena est Edessa, Dyrrachium est Durrës et Kleidion est près aujourd'hui de Klyuch en Bulgarie. La guerre de Sviatoslav de 965–971, après laquelle Byzance a annexé la Bulgarie orientale, est racontée dans les campagnes de Sviatoslav."
