"968–975": "968–975"
"Sayf al-Dawla died in 967, and his realm fell into revolt. In late 968 Nikephoros raided Syria as far as Tripoli, and before going home he built a fort at Baghras in the Amanus mountains, from which Michael Bourtzes and the eunuch general Peter were to blockade Antioch. Against orders, Bourtzes bribed a defender and seized a tower by night; on 28 October 969 Peter came up and the city fell. A few weeks later Nikephoros was murdered by Tzimiskes. Under the treaty of Safar, made in the winter of 969–970, Aleppo became a Byzantine tributary, and a Fatimid siege of Antioch in 971 failed.": "Sayf al-Dawla est mort en 967, et son royaume est tombé dans la révolte. À la fin de 968 Nikephoros a attaqué la Syrie jusqu’à Tripoli, et avant de rentrer chez lui il a construit un fort à Baghras dans les montagnes d’Amanus, d’où Michael Bourtzes et l’eunuque général Pierre devaient bloquer Antioche. Le 28 octobre 969, Pierre monta et la ville tomba. Quelques semaines plus tard, Nikephoros fut assassiné par Tzimiskes. Sous le traité de Safar, conclu à l’hiver de 969-970, Alep devint un affluent byzantin, et un siège fatimide d’Antioche en 971 échoua."
"In 974 Tzimiskes, now emperor, raided Upper Mesopotamia. In 975 he marched south from Antioch: Emesa and Baalbek fell, Damascus paid tribute, and he went on to Tiberias, Nazareth and Caesarea. He wrote to King Ashot III of Armenia that only fear of the Fatimids kept him from Jerusalem; historians disagree how far to trust the letter. On the way back he took Beirut but failed before Tripoli. He died in January 976, and most of his conquests south of Antioch were soon lost.": "En 974 Tzimiskes, aujourd'hui empereur, fit une descente dans la Mésopotamie supérieure. En 975, il marcha au sud d’Antioche : Emesa et Baalbek tombèrent, Damas rendit hommage, et il alla à Tibériade, Nazareth et Césarée. Il écrivit au roi Ashot III de l’Arménie que seule la crainte des Fatimides l’empêchait de Jérusalem ; les historiens ne s’accordaient pas avec la lettre. Sur le chemin du retour, il prit Beyrouth mais échoua avant Tripoli. Il mourut en janvier 976 et la plupart de ses conquêtes au sud d’Antioche furent bientôt perdues."
