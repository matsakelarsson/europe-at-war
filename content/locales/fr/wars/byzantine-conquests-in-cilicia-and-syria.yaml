"963–965": "963–965"
"Nikephoros became emperor in August 963 and turned to Cilicia, the plain whose fortified cities, Tarsus above all, had been bases for raids into Asia Minor for two centuries. Tzimiskes beat the army of Tarsus near Adana, and in 964 Nikephoros took Adana and other towns but failed before Mopsuestia. In 965 he came back with a larger army. Mopsuestia was stormed on 13 July and its people enslaved. Tarsus, besieged and short of food, surrendered on 16 August on condition that its people could leave for Syria with what they could carry.": "Nikephoros devint empereur en août 963 et se tourna vers Cilicie, la plaine dont les villes fortifiées, Tarse surtout, avaient été les bases pour des raids en Asie Mineure pendant deux siècles. Tzimiskes battit l’armée de Tarse près d’Adana, et en 964 Nikephoros prit Adana et d’autres villes mais échoua avant Mopsuestia. La Mopsuestia a été envahie le 13 juillet et son peuple asservi. Tarse, assiégé et à court de nourriture, s’est rendu le 16 août à condition que son peuple puisse partir pour la Syrie avec ce qu’il pouvait porter."
"Many Muslims left Cilicia, and Christians, many of them Armenians and Syrians, were settled in the emptied lands. Nikephoros carried the bronze gates of Tarsus and Mopsuestia to Constantinople as trophies. In the same year, or perhaps in 964, a fleet under Niketas Chalkoutzes took Cyprus, which had been shared between the empire and the Arabs since the late 7th century, and the whole island became a Byzantine province.": "De nombreux musulmans quittèrent la Cilicie, et des chrétiens, dont beaucoup d’Arméniens et de Syriens, furent installés dans les terres vidées. Nikephoros porta les portes en bronze de Tarse et de Mopsuestia à Constantinople comme trophées. La même année, ou peut-être en 964, une flotte sous Niketas Chalkoutzes a pris Chypre, qui avait été partagée entre l’empire et les Arabes depuis la fin du 7ème siècle, et toute l’île est devenue une province byzantine."
