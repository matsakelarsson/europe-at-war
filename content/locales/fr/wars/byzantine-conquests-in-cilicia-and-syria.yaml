"961–962": "961–962"
"For twenty years Sayf al-Dawla, the Hamdanid emir of Aleppo, had led the Muslim holy war on the frontier, raiding Byzantine Asia Minor almost every year. In 960, while Nikephoros Phokas was away in Crete, his brother Leo ambushed the emir in the Taurus passes and destroyed his army. Back from Crete, Nikephoros took Anazarbus in Cilicia, emptied it of its people and pulled down its walls. In 962 he took Marash and Manbij, where he captured the emir’s cousin, the poet Abu Firas, securing the passes to the north of Aleppo.": "Pendant vingt ans, Sayf al-Dawla, l’émir de Hamdanid d’Alep, avait mené la guerre sainte musulmane à la frontière, faisant des raids sur l’Asie Byzantine Mineure presque chaque année. En 960, alors que Nikephoros Phokas était parti en Crète, son frère Leo a embusqué l’émir dans les cols du Taureau et détruit son armée. De retour de Crète, Nikephoros a pris Anazarbus en Cilicie, l’a vidé de son peuple et a abattu ses murs. En 962, il a pris Marash et Manbij, où il a capturé le cousin émir, le poète Abu Firas, sécurisant les cols au nord d’Alep."
"In December, when campaigning normally stopped, he marched on Aleppo with a large army. Sayf al-Dawla’s few troops were scattered and he fled. The Byzantines plundered his palace outside the walls and on 23 or 24 December stormed the city, which they sacked for over a week. The citadel held out, and in revenge for a nephew killed attacking it Nikephoros is said to have beheaded 1,200 prisoners. He withdrew with some 10,000 captives, mostly young men. Sayf al-Dawla returned to a half-empty city, and revolts troubled his last years.": "En décembre, lorsque la campagne s’arrêtait normalement, il marchait sur Alep avec une grande armée. Sayf al-Dawla était peu de troupes dispersées et il s’enfuit. Les Byzantins pillaient son palais hors des murs et le 23 ou 24 décembre s’empara de la ville, qu’ils lançaient pendant plus d’une semaine. La citadelle se tint, et en vengeance d’un neveu tué l’attaquant Nikephoros aurait décapité 1 200 prisonniers. Il s’est retiré avec quelque 10 000 captifs, principalement des jeunes hommes. Sayf al-Dawla est retourné dans une ville à moitié vide, et les révoltes ont troublé ses dernières années."
