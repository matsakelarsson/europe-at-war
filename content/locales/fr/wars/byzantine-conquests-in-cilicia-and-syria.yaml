"Byzantine conquests in Cilicia and Syria": "Conquêtes byzantines en Cilicie et en Syrie"
"The campaigns in which Nikephoros Phokas, general and then emperor, sacked Aleppo, the capital of the Hamdanid emir Sayf al-Dawla, in 962, conquered Cilicia with Tarsus and Mopsuestia in 965 while his fleet took Cyprus, and in 969 recovered Antioch, lost to the Arabs more than three centuries before. His successor John I Tzimiskes led raids deep into Syria and Palestine in 974–975.": "Les campagnes dans lesquelles Nikephoros Phokas, général puis empereur, a renvoyé Alep, la capitale de l’émir Hamdanid Sayf al-Dawla, en 962, conquis Cilicia avec Tarse et Mopsuestia en 965 tandis que sa flotte a pris Chypre, et en 969 récupéré Antioch, perdu pour les Arabes plus de trois siècles avant. Son successeur John Ier Tzimiskes a mené des raids profondément en Syrie et en Palestine en 974–975."
"The fullest accounts are Arabic (Yahya of Antioch, Ibn al-Adim’s history of Aleppo and others), with the Byzantine historians Leo the Deacon and John Skylitzes. Dates in Arabic sources follow the Islamic calendar and are sometimes uncertain by a year; Anazarbus fell in late 961 or early 962.": "Les récits les plus complets sont l’arabe (Yahya d’Antioche, Ibn al-Adim), avec les historiens byzantins Leo le diacre et John Skylitzes. Les dates en arabe suivent le calendrier islamique et sont parfois incertaines d’un an ; Anazarbus est tombé à la fin de 961 ou au début de 962."
"Cilicia’s cities, Tarsus above all, were frontier strongholds of the Muslim holy war, nominally under the Abbasid caliph and at times under the Hamdanids or the Ikhshidids of Egypt. Cyprus had been shared between the Byzantines and the Arabs since the late 7th century.": "Les villes de Cilicia, Tarse surtout, étaient des bastions frontaliers de la guerre sainte musulmane, nominalement sous le calife abbasside et parfois sous les Hamdanides ou les Ikhshidids d’Egypte. Chypre était partagée entre les Byzantins et les Arabes depuis la fin du 7ème siècle."
"Mopsuestia is today’s Yakapınar near Adana, Anazarbus is Anavarza, and Antioch is Antakya.": "Mopsuestia est aujourd'hui à Yakapınar près d’Adana, Anazarbus est Anavarza, et Antioch est Antakya."
