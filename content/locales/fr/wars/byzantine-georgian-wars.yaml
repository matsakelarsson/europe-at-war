# Some French text was translated automatically.
"Byzantine–Georgian wars": "Guerres byzantine-géorgienne"
"The war between Basil II and King George I of Georgia over the inheritance of David III of Tao, who on his death in 1000 had left his lands in the Byzantine–Georgian borderland to the emperor. George occupied Tao in 1014–1016, while Basil was fighting Bulgaria. In 1021 Basil invaded with a large army, including the Varangian Guard, and ravaged Georgian lands; George allied with two Byzantine generals who rebelled in Basil’s rear, and in the winter the Armenian king of Vaspurakan ceded his kingdom to the empire. After a crushing defeat at Svindax in 1022, George gave up Tao, Phasiane, Kola, Artaan and Javakheti and sent his young son Bagrat to Constantinople as a hostage.": "La guerre entre Basil II et le roi George Ier de Géorgie sur l’héritage de David III de Tao, qui à sa mort en 1000 avait laissé ses terres dans la frontière byzantine-géorgienne à l’empereur. George a occupé Tao en 1014-1016, tandis que Basil combattait la Bulgarie. En 1021, Basile envahit avec une grande armée, y compris la Garde varange, et ravagé les terres géorgiennes ; George allié avec deux généraux byzantins qui se rebellèrent à Basilès arrière, et en hiver le roi arménien de Vaspurakan cédé son royaume à l’empire. Après une défaite écrasante à Svindax en 1022, George abandonna Tao, Phasiane, Kola, Artaan et Javakheti et envoya son jeune fils Bagrat à Constantinople en otage."
"The main sources are the Georgian Chronicles, the Armenian historian Aristakes Lastivertsi and John Skylitzes; they disagree on the battles of 1021–1022. Byzantine and Georgian fighting over the borderlands flared again in 1028.": "Les principales sources sont les Chroniques géorgiennes, l’historien arménien Aristotes Lastivertsi et John Skylitzes ; ils ne sont pas d’accord sur les batailles de 1021-1022."
"Tao and Artaan lie in today’s north-eastern Turkey (around Yusufeli and Ardahan), Javakheti in southern Georgia.": "Tao et Artaan se trouvent aujourd'hui dans le nord-est de la Turquie (aux alentours de Yusufeli et Ardahan), Javakheti dans le sud de la Géorgie."
