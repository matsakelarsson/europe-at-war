"Byzantine–Hungarian war of 1162–1167": "Guerre byzantine-hongroise de 1162 à 1167"
"A war between the Byzantine emperor Manuel I Komnenos and King Stephen III of Hungary over the succession to the Hungarian throne and over Sirmium, Dalmatia and Bosnia, which Manuel claimed as the inheritance of Stephen’s brother Béla, then living in Constantinople as Manuel’s heir. It ended with a Byzantine victory at Sirmium in 1167 and a peace that left these lands to the empire until Manuel’s death in 1180.": "Une guerre entre l’empereur byzantin Manuel I Komnenos et le roi Étienne III de Hongrie sur la succession au trône hongrois et sur Sremium, Dalmatie et Bosnie, que Manuel a revendiqué comme l’héritage du frère Étienne Béla, puis vivant à Constantinople en tant qu’héritier de Manuel. Elle s’est terminée par une victoire byzantine à Sremium en 1167 et une paix qui a laissé ces terres à l’empire jusqu’à la mort de Manuel en 1180."
"The fullest accounts are by the Byzantine historians John Kinnamos and Niketas Choniates; Hungarian sources say little. The fighting of 1162–1167 is sometimes treated as several short wars.": "Les récits les plus complets sont les historiens byzantins John Kinnamos et Niketas Choniates ; les sources hongroises disent peu. Le combat de 1162-1167 est parfois traité comme plusieurs guerres courtes."
"Croatia had been in union with the Hungarian crown since 1102 and is shown on the map as a separate kingdom. The Dalmatian towns were contested between Hungary, Venice and Byzantium throughout the 12th century.": "La Croatie était en union avec la couronne hongroise depuis 1102 et est montrée sur la carte comme un royaume séparé. Les villes dalmates ont été contestées entre la Hongrie, Venise et Byzance tout au long du XIIème siècle."
