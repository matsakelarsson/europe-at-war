"When Géza II of Hungary died in 1162, Manuel I backed the claims of Géza’s brothers against his young son Stephen III, whose supporters drove them out. In 1163 the two sides made a deal. Stephen’s younger brother Béla went to Constantinople, where he was betrothed to Manuel’s daughter, renamed Alexios and made heir to the empire, and his inheritance of Croatia, Dalmatia and Sirmium (Srem) was to pass with him. Stephen would not give it up, and for four years Byzantine and Hungarian armies fought over Sirmium, Zemun and the Dalmatian towns, which changed hands several times.": "Quand Géza II, de Hongrie, est mort en 1162, Manuel I a soutenu les revendications des frères Gézaís contre son jeune fils Stephen III, dont les partisans les ont chassés. En 1163 les deux parties ont fait un accord. Le jeune frère de Stephen, Béla, se rendit à Constantinople, où il fut fiancé à la fille de Manuels, rebaptisée Alexios et héritière de l’empire, et son héritage de Croatie, de Dalmatie et de Sremium (Srem) devait passer avec lui. Stephen ne voulut pas l’abandonner, et pendant quatre ans les armées byzantines et hongroises ont combattu sur Sremium, Zemun et les villes dalmates, qui ont changé de mains plusieurs fois."
"In 1167 Manuel sent a large army under his nephew Andronikos Kontostephanos. On 8 July 1167, near Zemun in the region of Sirmium, it met the Hungarian army under Dénes, count of Bács, and routed it. Hungary made peace and accepted Byzantine rule over Sirmium, Bosnia and most of Dalmatia. The gains did not last. When Manuel’s own son was born, Béla lost his place as heir, and he became king of Hungary in 1172 with Byzantine support. After Manuel died in 1180, Béla III took Sirmium and Dalmatia back.": "En 1167 Manuel envoya une grande armée sous son neveu Andronikos Kontostephanos. Le 8 juillet 1167, près de Zemun dans la région de Sremium, il rencontra l’armée hongroise sous Dènes, comte de Bács, et l’orienta. La Hongrie fit la paix et accepta la domination byzantine sur Sremium, la Bosnie et la plupart des Dalmaties. A la naissance de Manuels, Béla perd sa place d’héritier et devient roi de Hongrie en 1172 avec le soutien byzantin. Après la mort de Manuel en 1180, Béla III reprend Sremium et Dalmatie."
