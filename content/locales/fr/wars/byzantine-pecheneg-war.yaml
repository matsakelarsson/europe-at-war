"1087–1090": "1087–1090"
"In the 1080s, while Alexios I Komnenos fought the Normans in the west and the Turks held most of Anatolia, the Pechenegs on the lower Danube became a third threat. In 1087 a large Pecheneg host raided deep into Thrace before Byzantine troops drove it back. That summer Alexios, rejecting Pecheneg offers of peace, crossed the Haemus (Balkan Mountains) to strike at their homeland and reached Dristra (Silistra), the chief town of the Danube province.": "Dans les années 1080, alors qu’Alexios I Komnenos combattait les Normands à l’ouest et que les Turcs détenaient la plus grande partie de l’Anatolie, les Pechenegs sur le Danube inférieur devinrent une troisième menace. Cet été-là, Alexios, rejetant les offres de paix de Pecheneg, traversa l’Haemus (Montagnes Balkan) pour frapper leur patrie et atteignit Dristra (Silistra), la ville principale de la province du Danube."
"In August 1087 Alexios took the town but not its citadels and, fearing the arrival of the main Pecheneg army, began to withdraw. The Pechenegs caught up with him. The battle was hard fought until fresh Pecheneg horsemen arrived and the Byzantine army broke. Alexios barely escaped, and many of his men were killed or captured. A quarrel between the Pechenegs and the Cumans over the spoils gave the empire a pause, but for the next three years the Pechenegs raided Thrace almost at will, and Alexios could do little more than buy truces.": "En août 1087 Alexios prit la ville mais pas ses citadelles et, craignant l’arrivée de l’armée principale de Pecheneg, commença à se retirer. Les Pechenegs le rattachèrent. La bataille fut dure jusqu’à ce que les nouveaux cavaliers de Pecheneg arrivent et que l’armée byzantine éclate. Alexios s’échappa à peine, et beaucoup de ses hommes furent tués ou capturés. Une querelle entre les Pechenegs et les Cumans sur le butin a donné une pause à l’empire, mais pour les trois prochaines années les Pechenegs ont attaqué Thrace presque à volonté, et Alexios pourrait faire peu plus que d’acheter des trêves."
