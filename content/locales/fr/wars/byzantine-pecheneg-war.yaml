"1090–1091": "1090–1091"
"In 1090 the danger came close to the capital. The Pechenegs moved south and spent the winter in Thrace near Constantinople, and the Turkish emir Tzachas of Smyrna, who had built a fleet and seized several Aegean islands, sought to join them in an attack on the city by land and sea. Alexios gathered every soldier he could, raised new levies, took Western knights into his service and bought the help of the Cumans, nomads from the steppe north of the Black Sea, whose khans Tugorkhan and Boniak brought a large army south in the spring of 1091.": "En 1090, le danger s’est approché de la capitale. Les Pechenegs se sont déplacés au sud et ont passé l’hiver à Thrace près de Constantinople, et l’émir turc Tzachas de Smyrne, qui avait construit une flotte et saisi plusieurs îles Egée, a cherché à les rejoindre dans une attaque sur la ville par terre et par mer. Alexios rassembla tous les soldats qu’il pouvait, souleva de nouvelles cotisations, prit des chevaliers occidentaux à son service et acheta l’aide des Cumanes, nomades du steppe nord de la mer Noire, dont khans Tugorkhan et Boniak apportèrent une grande armée au sud au printemps de 1091."
"On 29 April 1091 the Byzantines and Cumans attacked the Pecheneg camp at Levounion, a hill near the mouth of the Hebros (Maritsa), not far from Ainos. The Pechenegs, with their women and children in a ring of wagons, were surrounded and overwhelmed. Most of them were killed, families as well as warriors. Anna Komnene wrote that a whole people was wiped out in a single day, and a saying arose that the Pechenegs never saw May. Survivors were settled in the empire or taken into its army, and the Pechenegs did not threaten Byzantium again until 1122.": "Le 29 avril 1091, les Byzantins et les Cumans attaquèrent le camp de Pecheneg à Levounion, une colline près de l’embouchure des Hébros (Maritsa), non loin d’Ainos. Les Pechenegs, avec leurs femmes et leurs enfants dans un anneau de wagons, furent encerclés et submergés. La plupart d’entre eux furent tués, familles ainsi que guerriers. Anna Komnene écrit qu’un peuple entier a été anéanti en un seul jour, et un dicton s’est levé que les Pechenegs n’ont jamais vu Mai. Les survivants ont été installés dans l’empire ou pris dans son armée, et les Pechenegs ne menace pas de nouveau Byzance jusqu’au 1122."
