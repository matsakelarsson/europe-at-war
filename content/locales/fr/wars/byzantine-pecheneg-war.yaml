# Some French text was translated automatically.
"Byzantine–Pecheneg war": "Guerre byzantine-Pecheneg"
"The war in which the Pechenegs, Turkic nomads settled along the lower Danube, defeated the Byzantine emperor Alexios I Komnenos at Dristra in 1087 and raided Thrace for four years, coming close to Constantinople. With the help of the Cumans, Alexios destroyed their host at Levounion near the mouth of the Hebros on 29 April 1091.": "La guerre dans laquelle les Pechenegs, nomades turkmènes s’installèrent le long du Danube inférieur, défait l’empereur byzantin Alexios I Komnenos à Dristra en 1087 et fit une descente de Thrace pendant quatre ans, se rapprochant de Constantinople. Avec l’aide des Cumans, Alexios détruisit leur hôte à Levounion près de l’embouchure des Hébros le 29 avril 1091."
"Almost everything known about this war comes from the Alexiad, the history of Alexios’s reign written decades later by his daughter Anna Komnene, who calls the Pechenegs “Scythians”. Her numbers are very large and her dates are not always clear.": "Presque tout ce qui est connu à propos de cette guerre vient de l’Alexiad, l’histoire d’Alexios règne écrit des décennies plus tard par sa fille Anna Komnene, qui appelle les Pechenegs. Ses chiffres sont très grands et ses dates ne sont pas toujours claires."
"The Pechenegs had crossed the lower Danube into the Byzantine province of Paristrion (Paradounavon) in the 1040s and lived there beside local lords who were only loosely subject to the empire.": "Les Pechenegs avaient traversé le Danube inférieur dans la province byzantine de Paristrion (Paradounavon) dans les années 1040 et y habitaient à côté des seigneurs locaux qui n’étaient que lâchement soumis à l’empire."
