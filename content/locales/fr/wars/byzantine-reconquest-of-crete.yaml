"Byzantine reconquest of Crete": "Reconquête byzantine de la Crète"
"The expedition in which the Byzantine general Nikephoros Phokas, the future emperor, landed on Crete in 960 and after a winter siege stormed Chandax (Heraklion), the capital of the emirate that had raided the Aegean for more than a century. Crete became a Byzantine province again.": "L’expédition dans laquelle le général byzantin Nikephoros Phokas, futur empereur, débarque en Crète en 960 et après un siège d’hiver s’empare de Chandax (Héraklion), la capitale de l’émirat qui avait fait une descente dans l’Egée depuis plus d’un siècle."
"The main accounts are by Byzantine writers, above all Leo the Deacon, with a verse poem on the conquest by Theodosios the Deacon. Their figures for the armies, such as Leo’s 40,000 men in the Cretan relief force, are not reliable.": "Les principaux récits sont des écrivains byzantins, surtout Léo le diacre, avec un poème de vers sur la conquête par Theodosios le diacre. Leurs figures pour les armées, comme Léo=40 000 hommes dans la force de secours crétoise, ne sont pas fiables."
"The city fell on 6 March 961 in most accounts; some give 7 March. Chandax is today’s Heraklion.": "La ville est tombée le 6 Mars 961 dans la plupart des comptes ; certains donnent 7 Mars. Chandax est aujourd'hui ,Héraklion."
"The Arab conquest of the island is told in the Arab conquest of Crete.": "La conquête arabe de l’île est racontée dans la conquête arabe de la Crète."
