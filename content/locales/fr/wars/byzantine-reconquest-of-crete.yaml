"The armada and the siege": "L’armada et le siège"
"Raiders from Crete had plundered the coasts and islands of the Aegean for over a century, and in 904 a Syrian fleet that used the island as a base had sacked Thessalonica. Byzantine expeditions to retake it failed in 911 and 949. Constantine VII prepared another, and his son Romanos II gave the command to the Domestic of the Schools, Nikephoros Phokas. The fleet, with dromons carrying Greek fire and transports fitted with ramps for horses, sailed in June or July 960 and landed near Chandax.": "Des assaillants de Crète avaient pillé les côtes et les îles de la mer Égée pendant plus d’un siècle, et en 904 une flotte syrienne qui utilisait l’île comme base avait saccagé Thessalonique. Les expéditions byzantines pour la reprendre échouèrent en 911 et 949. Constantin VII en prépara un autre, et son fils Romanos II donna le commandement à la Domestique des écoles, Nikephoros Phokas. La flotte, avec des dromons transportant le feu grec et des transports équipés de rampes pour les chevaux, a navigué en juin ou juillet 960 et atterri près de Chandax."
"Nikephoros scattered the Cretan army on the beach, but Chandax had earthen walls wide enough for two wagons to pass on top and a double moat, and his first attempt to storm it failed. He built a fortified camp, and the fleet blockaded the harbour. A foraging party under Nikephoros Pastilas was ambushed and destroyed in the hills. Nikephoros then surprised a relief army at night, cut off the heads of the dead and threw some into the city with catapults. A second assault failed too, and he settled down to starve the city over the winter while his engineers built heavier siege engines.": "Nikephoros dispersa l’armée crétoise sur la plage, mais Chandax avait des murs de terre assez larges pour que deux wagons passent sur le dessus et une double douve, et sa première tentative d’assaut a échoué. Il a construit un camp fortifié, et la flotte a bloqué le port. Un groupe de recherche de nourriture sous Nikephoros Pastilas a été embusqué et détruit dans les collines. Nikephoros a ensuite surpris une armée de secours la nuit, coupé les têtes des morts et jeté certains dans la ville avec des catapultes. Une deuxième attaque a échoué aussi, et il s’est installé pour mourir de faim la ville au cours de l’hiver tandis que ses ingénieurs ont construit des moteurs de siège plus lourds."
