"The fall of Chandax": "La chute de Chandax"
"The emir, Abd al-Aziz ibn Shu’ayb, appealed to the Ikhshidid ruler of Egypt and to the Fatimid caliph al-Mu’izz. The Fatimid promised a fleet, but nothing came in time. In March 961 Nikephoros attacked again. While the defenders were drawn to a battering ram, his miners dug beneath the walls, propped the tunnel with timber and set it on fire, and a great stretch of wall fell. On 6 March the Byzantines broke in, and the city was given over to plunder for three days.": "L’émir, Abd al-Aziz ibn Shuayb, appela le chef ikhshidid d’Egypte et le calife fatimide al-Muaizz. Le fatimide promit une flotte, mais rien ne vint à temps. En mars 961 Nikephoros attaqua de nouveau. Tandis que les défenseurs étaient attirés par un bélier battant, ses mineurs creusèrent sous les murs, enveloppèrent le tunnel de bois et le mirent au feu, et une grande partie du mur tomba. Le 6 mars, les Byzantins s’effacèrent, et la ville fut cédée au pillage pendant trois jours."
"Many inhabitants were killed or enslaved, and the mosques and walls were torn down. The emir and his son al-Nu’man were taken to Constantinople, where Nikephoros celebrated a triumph. Crete became a province again, and missionaries such as Nikon the Metanoeite worked to convert the remaining Muslims. Al-Nu’man, baptised as Anemas, later died fighting for the empire against the Rus’ at Dorostolon. Nikephoros went on to campaign in Cilicia and Syria and took the throne in 963.": "De nombreux habitants ont été tués ou réduits en esclavage, et les mosquées et les murs ont été démolis. L’émir et son fils al-Nuyman ont été emmenés à Constantinople, où Nikephoros a célébré un triomphe. La Crète est redevenue une province, et des missionnaires comme Nikon la Métanéite ont travaillé pour convertir les musulmans restants. Al-Nuyman, baptisé Anemas, mourut plus tard en combattant pour l’empire contre le Rus à Dorostolon. Nikephoros poursuivit sa campagne en Cilicie et en Syrie et prit le trône en 963."
