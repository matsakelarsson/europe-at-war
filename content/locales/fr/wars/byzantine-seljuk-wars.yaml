"1071–1081": "1071–1081"
"In the spring of 1071 Romanos marched east with a large but mixed army: Byzantine regiments, Armenian and Georgian levies, Norman and Frankish mercenaries under Roussel de Bailleul, Pecheneg and Uz horsemen and part of the Varangian Guard, perhaps 40,000 men in all. Alp Arslan, who had been campaigning in northern Syria on his way to fight the Fatimids, hurried north. Unaware how close he was, Romanos split his forces, sending Joseph Tarchaneiotes and Roussel with about half the army towards Khliat, and took Manzikert himself on 23 August. The Khliat force took no further part; Muslim writers say it was beaten, Byzantine writers that it withdrew.": "Au printemps de 1071, Romanos marchait à l’est avec une grande mais mixte armée : régiments byzantins, prélèvements arméniens et géorgiens, mercenaires normands et franquais sous la direction de Roussel de Bailleul, de Pecheneg et d’Uz et une partie de la Garde varange, peut-être 40 000 hommes au total. Sans savoir à quel point il était proche, Romanos scindé ses forces, envoyant Joseph Tarchaneiotes et Roussel avec environ la moitié de l’armée vers Khliat, et pris Manzikert lui-même le 23 août. La force Khliat ne prit plus part ; les écrivains musulmans disent qu’il a été battu, les écrivains byzantins qu’elle se retirait."
"On 26 August, having rejected a Seljuk offer of terms, Romanos advanced across the plain. The Turkish horse archers fell back before him, shooting into his flanks. By evening he had reached the sultan’s camp without forcing a battle and ordered a return to his own. In the confusion Andronikos Doukas, commanding the rearguard and the son of Romanos’s rival, the Caesar John Doukas, marched off the field instead of covering the withdrawal. The Turks attacked, the wings broke and Romanos, fighting on, was wounded and captured, the first Byzantine emperor to become the prisoner of a Muslim ruler. Most of the army escaped, and losses may have been lower than later writers claimed.": "Le 26 août, ayant rejeté une offre de conditions de Seljuk, Romanos a avancé à travers la plaine. Les archers turcs sont tombés devant lui, tirant dans ses flancs. Le soir, il avait atteint le camp de sultan sans forcer une bataille et ordonné un retour à son propre. Dans la confusion Andronikos Doukas, commandant l’arrière-garde et le fils du rival de Romanos, le César John Doukas, a marché hors du champ au lieu de couvrir le retrait. Les Turcs attaqués, les ailes cassées et Romanos, se battant sur, ont été blessés et capturés, le premier empereur byzantin à devenir le prisonnier d’un chef musulman. La plupart de l’armée s’est échappée, et des pertes peuvent avoir été plus faibles que les écrivains plus tard réclamés."
"Alp Arslan treated Romanos generously and freed him after a week, on terms that included a ransom, a yearly tribute and, in some accounts, Manzikert, Antioch, Edessa and Hierapolis. But the Doukas family had already made Michael VII emperor; Romanos was defeated, surrendered at Adana and was blinded in June 1072, dying of his wounds. In the civil wars of the next decade, against Roussel de Bailleul, Nikephoros Botaneiates and Nikephoros Melissenos, emperors and rebels alike hired Turkish bands and let them garrison towns, while Turkmen settled across the plateau. When Alexios I Komnenos seized the throne in April 1081, Suleiman ibn Qutulmish ruled from Nicaea. Many historians see these civil wars, more than the battle itself, as the cause of the loss of Anatolia.": "Alp Arslan a traité Romanos généreusement et l’a libéré après une semaine, à des conditions qui comprenaient une rançon, un tribut annuel et, dans certains comptes, Manzikert, Antioch, Edessa et Hierapolis. Mais la famille Doukas avait déjà fait empereur Michael VII ; Romanos a été vaincu, s’est rendu à Adana et a été aveugle en Juin 1072, mourant de ses blessures. Dans les guerres civiles de la décennie suivante, contre Roussel de Bailleul, Nikephoros Botanéiates et Nikephoros Melissenos, empereurs et rebelles ont engagé des bandes turques et laissé les villes de garnison, tandis que Turkmen s’installèrent sur le plateau. Quand Alexios I Komnenos a pris le trône en avril 1081, Suleiman ibn Qutulmish a gouverné de Nicée. De nombreux historiens considèrent ces guerres civiles, plus que la bataille elle-même, comme la cause de la perte d’Anatolie."
