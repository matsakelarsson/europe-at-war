"1064–1070": "1064–1070"
"In 1064 Tughril’s nephew and successor, Alp Arslan, invaded Georgia and Armenia and besieged Ani, the former Armenian royal city, now held by a Byzantine garrison. It fell on 16 August, and Armenian and Arab writers describe the slaughter of many of its people. The next year the Armenian king of Kars handed his land to the empire in exchange for estates in Asia Minor. Turkmen bands now rode deep into Anatolia almost every year: they plundered Caesarea in 1067, Neocaesarea and Amorium in 1068, Iconium in 1069 and Chonae, near the Aegean, in 1070.": "En 1064, le neveu et successeur de Tughril, Alp Arslan, envahit la Géorgie et l’Arménie et assiégea Ani, ancienne ville royale arménienne, aujourd'hui détenue par une garnison byzantine. Elle tomba le 16 août, et les écrivains arméniens et arabes décrivent le massacre d’un grand nombre de ses habitants. Les groupes turkmènes sont maintenant entrés dans l’Anatolie presque chaque année : ils ont pillé Césarée en 1067, Neocésarea et Amorium en 1068, Iconium en 1069 et Chonae, près de la mer Égée, en 1070."
"In 1068 the general Romanos Diogenes married the widowed empress Eudokia and became emperor. He set out to rebuild the eastern army, much of it now foreign mercenaries, and campaigned every year. In 1068 he marched into Syria and took Hierapolis (Manbij); in 1069 he campaigned in Cappadocia and towards Lake Van with little result. In 1070, while he stayed in Constantinople, his general Manuel Komnenos was defeated and captured near Sebasteia. Romanos resolved to secure the frontier by retaking the fortresses around Lake Van.": "En 1068, le général Romanos Diogenes épousa l’impératrice veuve Eudokia et devint empereur. Il se mit à reconstruire l’armée orientale, dont la plupart étaient maintenant des mercenaires étrangers, et fit campagne chaque année. En 1068, il marcha en Syrie et prit Hierapolis (Manbij) ; en 1069, il fit campagne à Cappadocia et vers le lac Van avec peu de résultat. En 1070, alors qu’il séjournait à Constantinople, son général Manuel Komnenos fut défait et capturé près de Sébasteia. Romanos résolut de sécuriser la frontière en reprenant les forteresses autour du lac Van."
