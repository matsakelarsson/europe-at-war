"Byzantine–Seljuk wars": "Guerres byzantine-seljuk"
"The wars in which the Seljuk Turks and the Turkmen tribes that followed them broke Byzantine power in Armenia and Asia Minor. After two decades of raids, during which Alp Arslan took Ani in 1064, the sultan defeated and captured the Emperor Romanos IV Diogenes at Manzikert in 1071. The Byzantine civil wars that followed let Turkish bands settle across Anatolia, and by 1081 a Seljuk prince ruled from Nicaea, close to Constantinople.": "Les guerres dans lesquelles les Turcs de Seljuk et les tribus turkmènes qui les suivaient ont brisé le pouvoir byzantin en Arménie et en Asie Mineure. Après deux décennies de raids, au cours desquels Alp Arslan a pris Ani en 1064, le sultan a vaincu et capturé l’empereur Romanos IV Diogenes à Manzikert en 1071. Les guerres civiles byzantines qui ont suivi ont permis aux bandes turques de s’installer à travers l’Anatolie, et par 1081 un prince Seljuk a régné de Nicée, près de Constantinople."
"Many raiders were Turkmen bands, only loosely under the Seljuk sultans, who were often more concerned with Iran, Iraq and the Fatimids of Egypt. Byzantine writers called all of them Turks.": "De nombreux raideurs étaient des bandes turkmènes, seulement lâchement sous les sultans de Seljuk, qui étaient souvent plus préoccupés par l’Iran, l’Irak et les Fatimides d’Egypte."
"The main sources are Byzantine (Michael Attaleiates, who was at Manzikert, Michael Psellos, John Skylitzes and Nikephoros Bryennios), Armenian (Aristakes Lastivertsi and Matthew of Edessa) and Arabic and Persian historians such as Ibn al-Athir. They differ on numbers, on the terms agreed after Manzikert and on what happened to the troops sent to Khliat.": "Les principales sources sont Byzantine (Michael Attaleiates, qui était à Manzikert, Michael Psellos, John Skylitzes et Nikephoros Bryennios), Arménien (Aristotes Lastivertsi et Matthieu d’Edessa) et les historiens arabes et persans comme Ibn al-Athir. Ils diffèrent en nombres, selon les conditions convenues après Manzikert et sur ce qui est arrivé aux troupes envoyées à Khliat."
"Place names. Manzikert is Malazgirt, Khliat is Ahlat, Theodosiopolis is Erzurum, Kapetron is Pasinler, Sebasteia is Sivas, Melitene is Malatya, Caesarea is Kayseri, Iconium is Konya, Chonae is Honaz, Dokeia is Tokat, Kotyaion is Kütahya and Nicaea is İznik. Ani, the old Armenian capital, lies in ruins on today’s Turkish–Armenian border.": "Les noms de lieux. Manzikert est Malazgirt, Khliat est Ahlat, Theodosiopolis est Erzurum, Kapetron est Pasinler, Sebasteia est Sivas, Melitène est Malatya, Césarée est Kayseri, Iconium est Konya, Chonae est Honaz, Dokeia est Tokat, Kotyaion est Kütahya et Nicée est ìznik. Ani, la vieille capitale arménienne, est en ruines sur la frontière turco-arménienne d’aujourd'hui."
