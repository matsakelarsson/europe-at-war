"1048–1059": "1048–1059"
"By the 1040s Byzantium had annexed the Armenian kingdoms of Vaspurakan and Ani, and Constantine IX let the local troops of the eastern provinces pay taxes instead of serving. In Iran the Seljuks, a ruling family of Oghuz Turks, had built an empire, and Turkmen bands began raiding Byzantine Armenia. In 1048 Ibrahim Inal, half-brother of the sultan Tughril, invaded in force. The Byzantine commanders, Aaron and Katakalon Kekaumenos, were ordered to wait for the Georgian prince Liparit IV, and meanwhile the Turks burned Artze, a rich, unwalled market town, killing many of its people.": "Dans les années 1040, Byzance avait annexé les royaumes arméniens de Vaspurakan et Ani, et Constantin IX a laissé les troupes locales des provinces orientales payer des impôts au lieu de servir. En Iran, les Seljuks, une famille dirigeante des Turcs d’Oghuz, avaient construit un empire, et les bandes turkmènes ont commencé à attaquer l’Arménie byzantine. En 1048 Ibrahim Inal, demi-frère du sultan Tughril, envahit en force. Les commandants byzantins, Aaron et Katakalon Kekaumenos, reçurent l’ordre d’attendre le prince géorgien Liparit IV, et pendant ce temps les Turcs brûlèrent Artze, une ville riche et sans murs, tuant beaucoup de son peuple."
"On the night of 18 September the allies fought Ibrahim at Kapetron. The Byzantine wings drove the Turks off, but in the centre Liparit was captured, and Ibrahim went home with his plunder. Liparit was later freed and embassies passed between the two courts, but the raids resumed in 1054, when Tughril himself besieged Manzikert and was beaten off by its commander, Basil Apokapes. With many Byzantine troops away fighting the Pechenegs in the Balkans, the raiders went deeper: Melitene was sacked in 1057 and Sebasteia in 1059.": "Dans la nuit du 18 septembre, les alliés ont combattu Ibrahim à Kapetron. Les ailes byzantines ont chassé les Turcs, mais au centre Liparit a été capturé, et Ibrahim est rentré chez lui avec son pillage. Liparit a ensuite été libéré et des ambassades ont passé entre les deux tribunaux, mais les raids ont repris en 1054, quand Tughril lui-même assiégé Manzikert et a été battu par son commandant, Basil Apokapes. Avec de nombreuses troupes byzantines qui combattaient les Pechenegs dans les Balkans, les raideurs sont allés plus loin : Melitene a été saccagé en 1057 et Sebasteia en 1059."
