# Some French text was translated automatically.
"Byzantine–Venetian war of 1171": "Guerre byzantine-vénitienne de 1171"
"On 12 March 1171 the emperor Manuel I Komnenos had all the Venetians in the Byzantine Empire arrested and their ships and goods seized, after Venetians had attacked the Genoese quarter in Constantinople. Venice sent a large fleet under Doge Vitale II Michiel, which attacked Byzantine towns on Euboea and wintered on Chios, but while the doge negotiated, plague broke out in the fleet and it returned home in 1172. The doge was murdered in Venice soon after. Relations were restored only in the 1180s, and the grievance was remembered when the Fourth Crusade turned on Constantinople.": "Le 12 mars 1171, l’empereur Manuel I Komnenos fit arrêter tous les Vénitiens de l’Empire byzantin et saisir leurs navires et biens, après que les Vénitiens eurent attaqué le quartier génois de Constantinople. Venise envoya une grande flotte sous le Doge Vitale II Michiel, qui attaqua les villes byzantines sur Euboea et hiverna sur Chios, mais pendant que la doge négociait, la peste éclata dans la flotte et retourna chez elle en 1172. Le doge fut assassiné à Venise peu après. Les relations furent rétablies seulement dans les années 1180, et le grief fut rappelé lorsque la quatrième croisade tourna sur Constantinople."
"The number of Venetians arrested is uncertain; the sources give figures of 10,000 or more. Venice had enjoyed wide trading privileges in the empire since the 1080s, which made its merchants rich and widely resented.": "Le nombre de Vénitiens arrêtés est incertain ; les sources donnent des chiffres de 10 000 ou plus. Venise avait bénéficié de larges privilèges commerciaux dans l’empire depuis les années 1080, ce qui rendait ses marchands riches et largement ressenti."
