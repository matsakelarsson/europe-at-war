# French translations of the catalogue text (wave 13); step bodies follow later.
Cabinda conflict: Conflit du Cabinda
? Last updated 27 November 2026. A low-intensity separatist insurgency in Cabinda, the oil-rich Angolan exclave between the two Congos. Cabinda’s chiefs placed it under Portuguese protection by the Treaty of Simulambuco in 1885, and it was ruled as a separate protectorate before Portugal attached it to Angola; the Front for the Liberation of the Enclave of Cabinda (FLEC), founded in 1963, argues that it was never part of Angola. The Alvor Agreement of January 1975 treated Cabinda as an integral part of Angola, and on 1 August 1975 FLEC proclaimed a Republic of Cabinda, but MPLA and Cuban troops took control of the enclave and its oil installations in November 1975 and beat off FLEC and Zairian attacks. FLEC split into factions and fought a guerrilla war in the forests of Mayombe, kidnapping foreign oil workers and attacking soldiers, while the Angolan army, which built up large forces after the civil war ended in 2002, was accused by rights groups of abuses against civilians. In 2006 a memorandum of understanding with the Cabinda Forum for Dialogue and FLEC-Renovada under António Bento Bembe gave Cabinda a special status, but the main armed faction, FLEC-FAC, rejected it. On 8 January 2010 gunmen of a FLEC faction, FLEC-PM, attacked the bus of Togo’s football team before the Africa Cup of Nations, killing two team officials and the driver. Since then FLEC-FAC has claimed sporadic attacks, including one in March 2025 in which it said it had killed 32 soldiers, claims that cannot be verified and that Angola does not confirm. On 2 February 2026 FLEC’s secretary general, Jacinto António Telica, declared Cabinda “a sovereign and independent state” in a video shown at a press conference in Brussels, the day after police in Cabinda arrested demonstrators marking the anniversary of the Simulambuco treaty; no state is known to have recognised the declaration, and Angola treats the enclave as one of its provinces. The death toll of the conflict is not known.
: "Dernière mise à jour : 27 novembre 2026. Une insurrection séparatiste de faible intensité au Cabinda, l’exclave angolaise riche en pétrole située entre les deux Congo. Les chefs du Cabinda le placèrent sous protection portugaise par le traité de Simulambuco en 1885, et il fut administré comme un protectorat distinct avant que le Portugal ne le rattache à l’Angola ; le Front de libération de l’enclave de Cabinda (FLEC), fondé en 1963, soutient qu’il n’a jamais fait partie de l’Angola. L’accord d’Alvor de janvier 1975 traita le Cabinda comme partie intégrante de l’Angola et, le 1er août 1975, le FLEC proclama une République du Cabinda, mais les troupes du MPLA et les troupes cubaines prirent le contrôle de l’enclave et de ses installations pétrolières en novembre 1975 et repoussèrent les attaques du FLEC et du Zaïre. Le FLEC se divisa en factions et mena une guérilla dans les forêts du Mayombe, enlevant des employés étrangers du secteur pétrolier et attaquant des soldats, tandis que l’armée angolaise, qui y concentra des forces importantes après la fin de la guerre civile en 2002, était accusée par des organisations de défense des droits humains d’exactions contre les civils. En 2006, un mémorandum d’entente conclu avec le Forum cabindais pour le dialogue et le FLEC-Renovada d’António Bento Bembe accorda au Cabinda un statut spécial, mais la principale faction armée, le FLEC-FAC, le rejeta. Le 8 janvier 2010, des hommes armés d’une faction du FLEC, le FLEC-PM, attaquèrent le car de l’équipe de football du Togo avant la Coupe d’Afrique des nations, tuant deux membres de l’encadrement et le chauffeur. Depuis, le FLEC-FAC a revendiqué des attaques sporadiques, dont une en mars 2025 au cours de laquelle il affirme avoir tué 32 soldats, des affirmations invérifiables que l’Angola ne confirme pas. Le 2 février 2026, le secrétaire général du FLEC, Jacinto António Telica, a déclaré le Cabinda « État souverain et indépendant » dans une vidéo diffusée lors d’une conférence de presse à Bruxelles, au lendemain de l’arrestation par la police, au Cabinda, de manifestants qui marquaient l’anniversaire du traité de Simulambuco ; on ne connaît aucun État qui ait reconnu cette déclaration, et l’Angola considère l’enclave comme l’une de ses provinces. Le bilan humain du conflit n’est pas connu."
