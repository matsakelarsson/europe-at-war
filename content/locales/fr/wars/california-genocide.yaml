# French translations of the catalogue text (wave 14); step bodies follow later.
California genocide: Génocide californien
? The killing, enslavement and starvation of the Native peoples of California after the American conquest of 1846, during the gold rush and the first decades of statehood. Between 1846 and 1873 settlers, miners, volunteer companies paid by the state and the US Army killed, by the historian Benjamin Madley’s count, between about 9,500 and 16,000 Native Californians, in hundreds of attacks on villages; several thousand more died of starvation or forced labour. The Native population, perhaps 300,000 before Spanish colonisation and about 150,000 at the American conquest, fell to about 30,000 by 1870 and 16,000 by 1900, through killing, disease, hunger and the loss of land and food. California’s first laws denied Native people the vote and the right to testify against whites, and the Act for the Government and Protection of Indians of 1850 allowed Native children and adults to be bound as unpaid labourers; between 10,000 and 27,000 were held in forced labour. Governor Peter Burnett told the legislature in 1851 that a war of extermination would go on until the Indian race became extinct, and the state paid up to $1.51 million for militia expeditions, much of it repaid by the federal government. Eighteen treaties that would have set aside reservations were rejected by the Senate in 1852. In 2019 Governor Gavin Newsom apologised on behalf of the state and called what happened a genocide; most historians now use the word, while some prefer terms such as ethnic cleansing and give lower death tolls.
: Les tueries, l’asservissement et la famine dont furent victimes les peuples autochtones de Californie après la conquête américaine de 1846, pendant la ruée vers l’or et les premières décennies de l’État. Entre 1846 et 1873, colons, mineurs, compagnies de volontaires payées par l’État et armée américaine tuèrent, selon le décompte de l’historien Benjamin Madley, entre 9 500 et 16 000 Amérindiens de Californie environ, au cours de centaines d’attaques contre des villages ; plusieurs milliers d’autres moururent de faim ou de travail forcé. La population autochtone, peut-être 300 000 personnes avant la colonisation espagnole et environ 150 000 au moment de la conquête américaine, tomba à environ 30 000 en 1870 et à 16 000 en 1900, sous l’effet des tueries, des maladies, de la faim et de la perte des terres et des ressources alimentaires. Les premières lois de la Californie refusèrent aux Autochtones le droit de vote et celui de témoigner contre des Blancs, et la loi de 1850 pour le gouvernement et la protection des Indiens permit de placer des enfants et des adultes autochtones en servitude comme travailleurs non rémunérés ; entre 10 000 et 27 000 d’entre eux furent soumis au travail forcé. Le gouverneur Peter Burnett déclara devant la législature en 1851 qu’une guerre d’extermination se poursuivrait jusqu’à l’extinction de la race indienne, et l’État paya jusqu’à 1,51 million de dollars pour des expéditions de milice, dont une grande partie fut remboursée par le gouvernement fédéral. Dix-huit traités qui auraient établi des réserves furent rejetés par le Sénat en 1852. En 2019, le gouverneur Gavin Newsom présenta des excuses au nom de l’État et qualifia ces événements de génocide ; la plupart des historiens emploient aujourd’hui ce mot, tandis que certains préfèrent des termes comme nettoyage ethnique et avancent des bilans moins élevés.
