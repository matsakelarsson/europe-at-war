# French translations of the catalogue text (wave 11); step bodies follow later.
Cambodian Civil War: Guerre civile cambodgienne
The war in which the Communist Party of Kampuchea, the Khmer Rouge, came to power in Cambodia. A peasant revolt at Samlaut in 1967 and a communist rising from 1968 were put down by Prince Norodom Sihanouk’s government, but the war widened when General Lon Nol deposed Sihanouk on 18 March 1970. Sihanouk allied with the Khmer Rouge from exile in Beijing; North Vietnamese troops, whose bases in eastern Cambodia had been bombed in secret by the Americans since 1969, routed Lon Nol’s army; and American and South Vietnamese forces invaded the border areas in May 1970. The Khmer Republic, kept alive by American aid and one of the heaviest bombing campaigns in history, lost the countryside to the Khmer Rouge, who besieged Phnom Penh from January 1975 and took it on 17 April 1975. They emptied the cities the same day and began the rule of Democratic Kampuchea, in which some 1.5 to 2 million people died.: La guerre au terme de laquelle le Parti communiste du Kampuchéa, les Khmers rouges, prit le pouvoir au Cambodge. Une révolte paysanne à Samlaut en 1967 et un soulèvement communiste à partir de 1968 furent réprimés par le gouvernement du prince Norodom Sihanouk, mais la guerre s’étendit lorsque le général Lon Nol déposa Sihanouk le 18 mars 1970. Sihanouk s’allia aux Khmers rouges depuis son exil à Pékin ; les troupes nord-vietnamiennes, dont les bases dans l’est du Cambodge étaient bombardées en secret par les Américains depuis 1969, mirent en déroute l’armée de Lon Nol ; et des forces américaines et sud-vietnamiennes envahirent les zones frontalières en mai 1970. La République khmère, maintenue en vie par l’aide américaine et par l’une des campagnes de bombardement les plus intenses de l’histoire, perdit les campagnes au profit des Khmers rouges, qui assiégèrent Phnom Penh à partir de janvier 1975 et la prirent le 17 avril 1975. Ils vidèrent les villes le jour même et instaurèrent le régime du Kampuchéa démocratique, sous lequel quelque 1,5 à 2 millions de personnes moururent.
