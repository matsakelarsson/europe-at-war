# French translations of the catalogue text (wave 11); step bodies follow later.
Cambodian–Thai border conflict: Conflit frontalier cambodgo-thaïlandais
? The armed clashes between Cambodia and Thailand over disputed stretches of their border along the Dângrêk escarpment, in 2008–2011 and again in 2025. The border was drawn by Franco-Siamese treaties of 1904 and 1907 and French maps whose lines do not always follow the watershed the treaties named. In 1962 the International Court of Justice awarded the temple of Preah Vihear to Cambodia, but not the land around it. When the temple was listed as a World Heritage Site in July 2008, Thai nationalists protested, troops faced each other at the temple, and clashes followed until 2011, the worst in February and April–May 2011, before the court ruled in 2013 that the whole promontory was Cambodian. In 2025 a skirmish in May led to five days of war in July, with artillery, rockets and Thai air strikes along some 200 km of the border, ended by a ceasefire brokered by Malaysia with American and Chinese help, and to three weeks of heavier fighting in December, in which Thai forces took several disputed temples and hills. A ceasefire signed on 27 December 2025 has held, uneasily, into late 2026.
: Les affrontements armés entre le Cambodge et la Thaïlande au sujet de tronçons contestés de leur frontière le long de l’escarpement des Dângrêk, en 2008–2011 puis de nouveau en 2025. La frontière fut tracée par les traités franco-siamois de 1904 et 1907 et par des cartes françaises dont les lignes ne suivent pas toujours la ligne de partage des eaux désignée par les traités. En 1962, la Cour internationale de justice attribua le temple de Preah Vihear au Cambodge, mais pas les terres qui l’entourent. Lorsque le temple fut inscrit au patrimoine mondial en juillet 2008, des nationalistes thaïlandais protestèrent, des troupes se firent face au temple, et des affrontements suivirent jusqu’en 2011, les plus graves en février et en avril–mai 2011, avant que la Cour ne juge en 2013 que l’ensemble du promontoire était cambodgien. En 2025, une escarmouche en mai conduisit à cinq jours de guerre en juillet, avec artillerie, roquettes et frappes aériennes thaïlandaises sur quelque 200 km de frontière, auxquels mit fin un cessez-le-feu négocié par la Malaisie avec l’aide des États-Unis et de la Chine, puis à trois semaines de combats plus intenses en décembre, au cours desquelles les forces thaïlandaises prirent plusieurs temples et collines contestés. Un cessez-le-feu signé le 27 décembre 2025 a tenu, tant bien que mal, jusqu’à la fin de 2026.
