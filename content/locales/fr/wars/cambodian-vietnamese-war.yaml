# French translations of the catalogue text (wave 11); step bodies follow later.
Cambodian–Vietnamese War: Guerre cambodgo-vietnamienne
The war between Vietnam and the Khmer Rouge, and the long occupation that followed. From 1977 the forces of Democratic Kampuchea raided Vietnamese border villages and massacred their people, while purges inside Cambodia drove Khmer Rouge commanders to flee to Vietnam. On 25 December 1978 the Vietnamese army invaded with Cambodian exiles, took Phnom Penh on 7 January 1979 and installed the People’s Republic of Kampuchea, ending a regime under which some 1.5 to 2 million Cambodians had died. China answered with its own attack on Vietnam in February 1979. For ten years Vietnamese troops fought a guerrilla war along the Thai border against the Khmer Rouge, armed by China and sheltered by Thailand, and two non-communist movements backed by ASEAN and the West, which together kept Cambodia’s seat at the United Nations. Vietnam withdrew its army in September 1989, and the Paris Peace Agreements of 23 October 1991 placed Cambodia under UN transitional rule until elections in 1993.: La guerre entre le Vietnam et les Khmers rouges, et la longue occupation qui suivit. À partir de 1977, les forces du Kampuchéa démocratique lancèrent des raids sur des villages frontaliers vietnamiens et en massacrèrent les habitants, tandis que les purges à l’intérieur du Cambodge poussaient des commandants khmers rouges à fuir au Vietnam. Le 25 décembre 1978, l’armée vietnamienne envahit le pays avec des exilés cambodgiens, prit Phnom Penh le 7 janvier 1979 et installa la République populaire du Kampuchéa, mettant fin à un régime sous lequel quelque 1,5 à 2 millions de Cambodgiens étaient morts. La Chine riposta en attaquant à son tour le Vietnam en février 1979. Pendant dix ans, les troupes vietnamiennes combattirent, le long de la frontière thaïlandaise, la guérilla des Khmers rouges, armés par la Chine et abrités par la Thaïlande, et de deux mouvements non communistes soutenus par l’ASEAN et l’Occident, qui conservèrent ensemble le siège du Cambodge aux Nations unies. Le Vietnam retira son armée en septembre 1989, et les accords de paix de Paris du 23 octobre 1991 placèrent le Cambodge sous une autorité de transition de l’ONU jusqu’aux élections de 1993.
