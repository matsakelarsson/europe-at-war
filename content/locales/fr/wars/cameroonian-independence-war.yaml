# French translations of the catalogue text (wave 13); step bodies follow later.
Cameroonian independence war: Guerre d’indépendance du Cameroun
? The war between the Union of the Peoples of Cameroon (UPC), the nationalist party that demanded immediate independence and the reunification of the French and British Cameroons, and the French colonial authorities and, after independence in 1960, the government of Ahmadou Ahidjo with French military support. France banned the UPC after riots in May 1955; its leader Ruben Um Nyobè took to the forests of the Sanaga-Maritime in 1956 and was killed by a French-led patrol in September 1958. From 1959 the UPC’s army fought in the Bamileke country of western Cameroon and in the Mungo, where French and Cameroonian troops waged a counter-insurgency of resettlement camps, burned villages and air strikes into the mid-1960s. Félix-Roland Moumié, the UPC’s president in exile, was poisoned by a French agent in Geneva in 1960, and the last guerrilla leader, Ernest Ouandié, was executed in Bafoussam in January 1971. Estimates of the dead range from about 10,000 to well over 100,000; most historians give figures in the tens of thousands. In 2025 France officially acknowledged that it had waged a war in Cameroon.
: La guerre qui opposa l’Union des populations du Cameroun (UPC), le parti nationaliste qui réclamait l’indépendance immédiate et la réunification des Camerouns français et britannique, aux autorités coloniales françaises puis, après l’indépendance en 1960, au gouvernement d’Ahmadou Ahidjo, soutenu militairement par la France. La France interdit l’UPC après les émeutes de mai 1955 ; son chef, Ruben Um Nyobè, prit le maquis dans les forêts de la Sanaga-Maritime en 1956 et fut tué par une patrouille encadrée par des Français en septembre 1958. À partir de 1959, l’armée de l’UPC combattit en pays bamiléké, dans l’ouest du Cameroun, et dans le Moungo, où les troupes françaises et camerounaises menèrent jusqu’au milieu des années 1960 une contre-insurrection faite de camps de regroupement, de villages incendiés et de frappes aériennes. Félix-Roland Moumié, président de l’UPC en exil, fut empoisonné par un agent français à Genève en 1960, et le dernier chef de la guérilla, Ernest Ouandié, fut exécuté à Bafoussam en janvier 1971. Les estimations du nombre de morts vont d’environ 10 000 à bien plus de 100 000 ; la plupart des historiens avancent des chiffres de l’ordre de plusieurs dizaines de milliers. En 2025, la France a officiellement reconnu avoir mené une guerre au Cameroun.
