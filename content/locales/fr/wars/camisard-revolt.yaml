# Some French text was translated automatically.
"Camisard revolt": "Révolte des camisards"
? "A rising of the Protestants of the Cévennes in southern France against the persecution that followed Louis XIV’s revocation of the Edict of Nantes in 1685, which had made Protestant worship illegal. It began on 24 July 1702, when insurgents killed the abbé du Chayla, who had imprisoned and mistreated Protestants, at Le Pont-de-Montvert. Inspired by prophets and led by young commanders such as Jean Cavalier and Roland (Pierre Laporte), a few thousand Camisards fought a guerrilla war in the mountains and the plain around Nîmes, killing priests and burning churches, against royal troops that grew to many thousands. Marshal Montrevel answered with mass reprisals, and from the autumn of 1703 hundreds of villages and hamlets in the upper Cévennes were burned and their people driven out. Marshal Villars, sent in 1704, combined force with offers of amnesty; Cavalier made terms in May 1704 and later left France, and Roland was killed in August. Scattered resistance went on until about 1710."
: "Une montée des protestants des Cévennes dans le sud de la France contre les persécutions qui ont suivi Louis XIV, révocation de l’édit de Nantes en 1685, qui avait rendu le culte protestant illégal. Il a commencé le 24 juillet 1702, lorsque les insurgés ont tué l’abbé du Chayla, qui avait emprisonné et maltraité les protestants, au Pont-de-Montvert. Inspiré par les prophètes et dirigé par de jeunes commandants tels que Jean Cavalier et Roland (Pierre Laporte), quelques milliers de camisards ont combattu une guérilla dans les montagnes et la plaine autour de Nîmes, tuant des prêtres et des églises en feu, contre des troupes royales qui se sont multipliées à plusieurs milliers. Le maréchal Montrevel répondit par des représailles massives, et à l’automne de 1703, des centaines de villages et hameaux dans les Cévennes supérieures furent incendiés et leur peuple chassé. Le maréchal Villars, envoyé en 1704, combina la force avec des offres d’amnistie ; Cavalier prit ses fonctions en mai 1704 puis quitta la France, et Roland fut tué en août."
"Also called the War of the Cévennes. The revolt coincided with the War of the Spanish Succession; France’s enemies hoped to exploit it, but little outside help reached the Camisards.": "Aussi appelé la guerre des Cévennes. La révolte coïncidait avec la guerre de la Succession d’Espagne ; les ennemis de France espéraient l’exploiter, mais peu d’aide extérieure atteignirent les Camisards."
"Protestants in France were given civil rights again by the Edict of Versailles (the Edict of Tolerance) in 1787.": "En 1787, l’édit de Versailles (l’édit de tolérance) accorde de nouveau aux protestants français des droits civils."
