# French translations of the catalogue text (wave 14); step bodies follow later.
Campaigns of Ahuitzotl: Campagnes d’Ahuitzotl
? The wars of Ahuitzotl, ruler of Tenochtitlan from 1486 to 1502, who roughly doubled the lands that paid tribute to the Aztec Triple Alliance. He succeeded his brother Tizoc, whose short reign had brought few victories, and began with a campaign against rebel towns in the Huasteca on the Gulf coast, whose captives were sacrificed at the dedication of the enlarged Templo Mayor in 1487; the sources give numbers from about 4,000 to Diego Durán’s 80,400, and modern historians think the higher figures much exaggerated. In the west, in what is now Guerrero, his armies took Teloloapan, Oztoman and Alahuiztlan near the Tarascan frontier and resettled them with colonists from the Valley of Mexico to hold the border. His main wars went south. In Oaxaca the Mexica fought the Mixtec and Zapotec kingdoms, and in the Isthmus of Tehuantepec Cosijoeza, the Zapotec king of Zaachila, allied with the Mixtec, held out in the mountain fortress of Guiengola, near Tehuantepec, through a siege that Zapotec accounts say lasted seven months, in the later 1490s. The war ended in a settlement sealed by Cosijoeza’s marriage to a daughter of Ahuitzotl, and Tehuantepec kept its own kings while Aztec armies used the road through it. Beyond the isthmus Ahuitzotl’s armies conquered Xoconochco (Soconusco) on the Pacific coast of today’s Chiapas, rich in cacao and tropical feathers, and raided into what is now Guatemala; the date of the conquest is given as 1486 in some sources and about 1500 in others. Ahuitzotl died in 1502 and was succeeded by his nephew Moctezuma II.
: Les guerres d’Ahuitzotl, souverain de Tenochtitlan de 1486 à 1502, qui doubla à peu près les territoires tributaires de la Triple Alliance aztèque. Il succéda à son frère Tizoc, dont le court règne n’avait apporté que peu de victoires, et commença par une campagne contre des villes rebelles de la Huasteca, sur la côte du golfe, dont les captifs furent sacrifiés lors de l’inauguration du Templo Mayor agrandi, en 1487 ; les sources donnent des chiffres allant d’environ 4 000 aux 80 400 de Diego Durán, et les historiens modernes jugent les chiffres les plus élevés très exagérés. À l’ouest, dans l’actuel Guerrero, ses armées prirent Teloloapan, Oztoman et Alahuiztlan, près de la frontière tarasque, et les repeuplèrent de colons venus de la vallée de Mexico pour tenir la frontière. Ses principales guerres se déroulèrent au sud. Dans l’Oaxaca, les Mexicas combattirent les royaumes mixtèques et zapotèques et, dans l’isthme de Tehuantepec, Cosijoeza, roi zapotèque de Zaachila, allié aux Mixtèques, résista dans la forteresse de montagne de Guiengola, près de Tehuantepec, à un siège qui dura sept mois selon les récits zapotèques, à la fin des années 1490. La guerre se termina par un accord scellé par le mariage de Cosijoeza avec une fille d’Ahuitzotl ; Tehuantepec conserva ses propres rois, tandis que les armées aztèques empruntaient la route qui la traversait. Au-delà de l’isthme, les armées d’Ahuitzotl conquirent le Xoconochco (Soconusco), sur la côte pacifique de l’actuel Chiapas, riche en cacao et en plumes tropicales, et lancèrent des raids dans l’actuel Guatemala ; cette conquête est datée de 1486 par certaines sources et des environs de 1500 par d’autres. Ahuitzotl mourut en 1502 et eut pour successeur son neveu Moctezuma II.
