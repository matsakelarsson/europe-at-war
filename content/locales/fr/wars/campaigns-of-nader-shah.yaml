# French translations of the catalogue text (wave 7); step bodies follow later.
Campaigns of Nader Shah: Campagnes de Nader Shah
The wars of Nader, an Afshar Turkmen soldier who rose from leading a band in northern Khorasan to be shah of Persia (1736–1747) and the most feared conqueror of his age. After expelling the Afghans from Persia in 1729 and winning back the west from the Ottomans, he subdued the Abdali Afghans of Herat, made himself shah, took Kandahar, the last Hotaki stronghold, in 1738 and invaded Mughal India. He routed the Mughal army at Karnal in 1739, sacked Delhi and carried off the Peacock Throne. In 1740 he forced Bukhara and Khiva to submit. His later years were spent in a costly war in Dagestan, a new war with the Ottomans and the bloody suppression of revolts against his heavy taxes, until his own officers killed him in 1747 and his empire fell apart.: Les guerres de Nader, soldat turkmène afchar qui, d’abord chef de bande dans le nord du Khorassan, devint shah de Perse (1736–1747) et le conquérant le plus redouté de son temps. Après avoir chassé les Afghans de Perse en 1729 et repris l’ouest aux Ottomans, il soumit les Afghans abdali d’Hérat, se fit proclamer shah, prit en 1738 Kandahar, dernier bastion des Hotaki, et envahit l’Inde moghole. Il mit en déroute l’armée moghole à Karnal en 1739, mit Delhi à sac et emporta le trône du Paon. En 1740, il contraignit Boukhara et Khiva à se soumettre. Ses dernières années furent occupées par une guerre coûteuse au Daghestan, une nouvelle guerre contre les Ottomans et la répression sanglante des révoltes suscitées par ses lourds impôts, jusqu’à ce que ses propres officiers le tuent en 1747 ; son empire se disloqua alors.
