# French translations of the catalogue text (wave 8); step bodies follow later.
Campaigns of Shivaji: Campagnes de Shivaji
The wars by which Shivaji Bhonsle, son of a Maratha general in the service of Bijapur, built an independent Maratha kingdom in the hills and coast of the western Deccan. He seized the hill forts around Pune and the valley of Javli, killed the Bijapuri general Afzal Khan at Pratapgad in 1659 and escaped the siege of Panhala in 1660. Against the Mughals he raided the governor Shaista Khan’s quarters in Pune in 1663 and sacked the port of Surat in 1664, but Jai Singh’s campaign forced him to cede most of his forts at Purandar in 1665, and on a visit to Aurangzeb’s court at Agra he was put under house arrest and escaped. From 1670 he won back his forts, sacked Surat again and defeated Mughal armies in the open. On 6 June 1674 he was crowned Chhatrapati at Raigad, and in 1677–1678, allied with Golconda, he conquered Gingee and Vellore in the far south. He died in 1680, leaving a kingdom that resisted the Mughals for the next generation.: Les guerres par lesquelles Shivaji Bhonsle, fils d’un général marathe au service de Bijapur, bâtit un royaume marathe indépendant dans les collines et sur la côte du Dekkan occidental. Il s’empara des forts de montagne autour de Pune et de la vallée de Javli, tua le général de Bijapur Afzal Khan à Pratapgad en 1659 et échappa au siège de Panhala en 1660. Contre les Moghols, il lança un coup de main sur les quartiers du gouverneur Shaista Khan à Pune en 1663 et mit à sac le port de Surat en 1664, mais la campagne de Jai Singh le contraignit à céder la plupart de ses forts à Purandar en 1665, et, lors d’une visite à la cour d’Aurangzeb à Agra, il fut assigné à résidence et s’évada. À partir de 1670, il reprit ses forts, saccagea de nouveau Surat et battit des armées mogholes en rase campagne. Le 6 juin 1674, il fut couronné chhatrapati à Raigad, et en 1677–1678, allié à Golconde, il conquit Gingee et Vellore dans l’extrême sud. Il mourut en 1680, laissant un royaume qui résista aux Moghols pendant la génération suivante.
