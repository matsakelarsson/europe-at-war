"1305–1311": "1305–1311"
"Led now by Berenguer d’Entença and Bernat de Rocafort, the Company took its revenge. On 21 June 1305 the garrison of Gallipoli sallied out and routed the besieging Byzantines, and in July the Catalans crushed Michael IX’s army near Apros. For two years, joined by Turkish bands, they ravaged Thrace from Gallipoli. When the land was exhausted they moved west, wintered on the Kassandra peninsula, plundered the monasteries of Mount Athos and in 1308 failed to take Thessalonica. Their leaders fell out; Rocafort was seized in 1309 by an agent of Charles of Valois and died in prison in Naples.": "Le 21 juin 1305, la garnison de Gallipoli s’enfuit et dirigea les Byzantins assiégés, et en juillet les Catalans écrasèrent l’armée de Michael IX près d’Apros. Pendant deux ans, rejoints par des groupes turcs, ils ravagent Thrace de Gallipoli. Quand la terre était épuisée, ils se déplaçaient vers l’ouest, hivernaient sur la péninsule de Kassandra, pillaient les monastères du mont Athos et en 1308 ne prenaient pas Thessalonique. Leurs dirigeants tombaient ; Rocafort fut saisi en 1309 par un agent de Charles de Valois et mourut en prison à Naples."
"In 1309 the Company reached Thessaly, and in 1310 Walter of Brienne, the new Duke of Athens, hired it against his Greek neighbours. When he refused to pay and tried to drive it out, the Catalans met his army near Halmyros on 15 March 1311. They had flooded the marshy ground in front of their line, and the duke’s heavy cavalry charged into the mud and was cut down. Walter and most of the knights of Frankish Greece were killed. The Company took over the duchy and placed it under the Aragonese kings of Sicily; Catalans ruled Athens and Thebes until 1388.": "En 1309, la Compagnie atteignit Thessalie, et en 1310 Walter de Brienne, le nouveau duc d’Athènes, l’engagea contre ses voisins grecs. Lorsqu'il refusa de payer et tenta de la chasser, les Catalans rencontrèrent son armée près de Halmyros le 15 mars 1311. Ils avaient inondé le terrain marécageux devant leur ligne, et la cavalerie lourde duc chargée dans la boue et fut coupée. Walter et la plupart des chevaliers de Grèce Frankish ont été tués. La Compagnie a pris le duché et l’a placé sous les rois aragonais de Sicile ; Catalans a gouverné Athènes et Thebes jusqu’à 1388."
