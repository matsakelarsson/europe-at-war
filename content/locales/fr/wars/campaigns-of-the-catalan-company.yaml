"1303–1305": "1303–1305"
"The peace of 1302 that ended the War of the Sicilian Vespers left thousands of Catalan and Aragonese soldiers in Sicily without pay, many of them almogavars, hardy light infantry from the frontier wars in Spain. Their leader, the former Templar Roger de Flor, offered them to Andronikos II, who badly needed soldiers against the Turks. The Company reached Constantinople in 1303, and Roger married the emperor’s niece and was made megas doux, commander of the fleet. After a bloody fight with the city’s Genoese, the Company was shipped to Cyzicus, where it surprised and routed the Turks of Karasi in October.": "La paix de 1302 qui mit fin à la guerre des Vêpres siciliens laissa sans salaire des milliers de soldats catalans et aragonais en Sicile, dont beaucoup d’almogavars, infanterie légère robuste des guerres frontalières en Espagne. Leur chef, l’ancien Templier Roger de Flor, les offrit à Andronikos II, qui avait cruellement besoin de soldats contre les Turcs. La Compagnie atteignit Constantinople en 1303 et Roger épousa la nièce de l’empereur et fut fait mégas deux, commandant de la flotte. Après un combat sanglant avec la ville de Genoese, la Compagnie fut expédiée à Cyzicus, où elle surprit et roulait les Turcs de Karasi en octobre."
"In the spring of 1304 Roger marched south with his Catalans and Alan allies, beat the Turks of Germiyan and Aydın besieging Philadelphia at Aulax, and relieved the city. He went on as far as the Cilician Gates, where on 15 August he won another battle at Kibistra. But the Catalans plundered Greek towns as freely as Turkish ones and quarrelled over pay, and the emperor called them back to Europe; they wintered at Gallipoli. On 30 April 1305 Roger was murdered at a banquet in Adrianople by Alan mercenaries of the co-emperor Michael IX, with many of his escort, and Catalans in Constantinople were killed.": "Au printemps de 1304, Roger marcha vers le sud avec ses alliés catalans et Alan, battit les Turcs de Germiyan et d’Aydın en assiégeant Philadelphie à Aulax, et souligna la ville. Mais les Catalans pillaient les villes grecques aussi librement que les Turcs et se disputaient pour payer, et l’empereur les rappelait en Europe ; ils hivernaient à Gallipoli. Le 30 avril 1305 Roger a été assassiné lors d’un banquet à Adrianople par des mercenaires Alan du co-empereur Michael IX, avec beaucoup de son escorte, et les Catalans à Constantinople ont été tués."
