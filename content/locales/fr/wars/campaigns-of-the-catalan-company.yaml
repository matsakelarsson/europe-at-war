"Campaigns of the Catalan Company": "Campagnes de la compagnie catalane"
"The wars of the Grand Catalan Company, mercenaries from the War of the Sicilian Vespers hired by the Byzantine emperor Andronikos II to fight the Turks in Anatolia. After victories over the Turks in 1303–1304 the Company fell out with its employers, and when its leader Roger de Flor was murdered in 1305 it turned on the Byzantines, ravaging Thrace and Macedonia for years. In 1311 it destroyed the army of the Duke of Athens at Halmyros and took over his duchy, which it ruled until 1388.": "Les guerres de la Grande Compagnie catalane, mercenaires de la Guerre des Vêpres siciliennes embauchés par l’empereur byzantin Andronikos II pour combattre les Turcs en Anatolie. Après des victoires sur les Turcs en 1303–1304, la Compagnie tombe avec ses employeurs, et quand son chef Roger de Flor a été assassiné en 1305 il s’est retourné sur les Byzantins, ravageant Thrace et Macédoine pendant des années. En 1311, il détruisit l’armée du Duc d’Athènes à Halmyros et prit son duché qu’il gouverna jusqu’en 1388."
"The main account of the Company is the chronicle of Ramon Muntaner, who served in it and tells its story from the Catalan side; the Byzantine historians George Pachymeres and Nikephoros Gregoras saw the Catalans as plunderers. Their numbers for the Company differ widely, from about 1,000 men to Muntaner’s 6,500 fighting men with their families and servants.": "Le récit principal de la Compagnie est la chronique de Ramon Muntaner, qui y a servi et raconte son histoire du côté catalan ; les historiens byzantins George Pachymeres et Nikephoros Gregoras ont vu les Catalans comme des pillards. Leur nombre pour la Compagnie varie largement, d’environ 1000 hommes à Muntaner , 6 500 hommes combattant avec leurs familles et leurs serviteurs."
"The battle of 15 March 1311 was long called the battle of the Cephissus and placed near Orchomenos in Boeotia; most historians now place it at Halmyros in southern Thessaly.": "La bataille du 15 mars 1311 fut longtemps appelée la bataille du Céphissus et placée près d’Orchomenos en Boeotia ; la plupart des historiens la placent maintenant à Halmyros dans le sud de Thessalie."
"The Company’s revenge after 1305 is remembered in Catalan as the venjança catalana. After 1311 the Duchy of Athens, and from 1319 Neopatras, were ruled by the Catalans under the Aragonese kings of Sicily, until Nerio Acciaioli of Corinth took Athens in 1388.": "Après 1311, le duché d’Athènes et à partir de 1319 Neopatras, ont été gouvernés par les Catalans sous les rois aragonais de Sicile, jusqu’à ce que Nerio Acciaioli de Corinthe prenne Athènes en 1388."
