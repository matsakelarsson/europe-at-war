# French translations of the catalogue text (wave 7); step bodies follow later.
Campaigns of Timur: Campagnes de Tamerlan
The conquests of Timur, known in Europe as Tamerlane, a Turkic emir of the Barlas tribe who made himself master of Transoxiana in 1370 and spent the next 35 years at war. From his capital, Samarkand, he took Khwarazm and Khorasan, and in a series of long campaigns between 1386 and 1404 overran Iran, Iraq, the Caucasus and eastern Anatolia, twice defeated the Golden Horde, sacked Delhi, and beat the Mamluks in Syria and the Ottomans at Ankara. His campaigns were marked by deliberate mass killings of cities that resisted or rebelled, such as Isfahan, Delhi and Baghdad, and by the deportation of craftsmen and scholars to adorn Samarkand. He built no lasting administration outside his heartland, and after his death at Otrar in 1405, on the way to attack China, his sons and grandsons fought over his empire, which soon shrank to Transoxiana and eastern Iran.: Les conquêtes de Timur, connu en Europe sous le nom de Tamerlan, émir turc de la tribu des Barlas qui se rendit maître de la Transoxiane en 1370 et passa les 35 années suivantes à faire la guerre. Depuis sa capitale, Samarcande, il prit le Khwarezm et le Khorassan et, au cours d’une série de longues campagnes entre 1386 et 1404, envahit l’Iran, l’Irak, le Caucase et l’est de l’Anatolie, vainquit deux fois la Horde d’or, mit à sac Delhi et battit les Mamelouks en Syrie et les Ottomans à Ankara. Ses campagnes furent marquées par le massacre délibéré de la population des villes qui lui résistaient ou se révoltaient, comme Ispahan, Delhi et Bagdad, et par la déportation d’artisans et de savants chargés d’embellir Samarcande. Il ne bâtit aucune administration durable hors de son territoire d’origine et, après sa mort à Otrar en 1405, alors qu’il marchait contre la Chine, ses fils et petits-fils se disputèrent son empire, qui se réduisit bientôt à la Transoxiane et à l’est de l’Iran.
