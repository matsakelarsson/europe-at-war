# French translations of the catalogue text (wave 11); step bodies follow later.
Cần Vương movement: Mouvement Cần Vương
? A rising against the French protectorate over Annam and Tonkin in the name of the young emperor Hàm Nghi. Cần Vương means “aid the king”. On the night of 4–5 July 1885 the regent Tôn Thất Thuyết’s troops attacked the French garrison at Huế; the attack failed, the French took the citadel, and Thuyết escaped with Hàm Nghi to the mountains, where an edict in the emperor’s name called on scholars and people to rise. Across central and northern Vietnam the local scholar-gentry (văn thân) raised forces, and in the first months bands killed many thousands of Vietnamese Catholics, whom they saw as allies of the French; missionary counts put the dead at about 40,000. The French put Hàm Nghi’s brother Đồng Khánh on the throne, sent columns with Catholic militias and Vietnamese troops of the court, and burned villages that supported the rising. They broke the fortified villages of Ba Đình in January 1887, and in November 1888 Hàm Nghi was betrayed, captured and exiled to Algeria. The resistance held out longest in Hà Tĩnh and Nghệ An under Phan Đình Phùng, whose death at the end of 1895 ended the movement. Hoàng Hoa Thám, who had fought in Yên Thế since the mid-1880s, held out against the French until 1913.
: Un soulèvement contre le protectorat français sur l’Annam et le Tonkin au nom du jeune empereur Hàm Nghi. Cần Vương signifie « aider le roi ». Dans la nuit du 4 au 5 juillet 1885, les troupes du régent Tôn Thất Thuyết attaquèrent la garnison française de Huế ; l’attaque échoua, les Français prirent la citadelle, et Thuyết s’enfuit avec Hàm Nghi dans les montagnes, où un édit au nom de l’empereur appela les lettrés et le peuple à se soulever. Dans tout le centre et le nord du Vietnam, les lettrés locaux (văn thân) levèrent des troupes et, dans les premiers mois, des bandes tuèrent de nombreux milliers de catholiques vietnamiens, qu’elles considéraient comme des alliés des Français ; les décomptes des missionnaires font état d’environ 40 000 morts. Les Français mirent sur le trône le frère de Hàm Nghi, Đồng Khánh, envoyèrent des colonnes accompagnées de milices catholiques et de troupes vietnamiennes de la cour, et incendièrent les villages qui soutenaient le soulèvement. Ils réduisirent les villages fortifiés de Ba Đình en janvier 1887 et, en novembre 1888, Hàm Nghi fut trahi, capturé et exilé en Algérie. La résistance tint le plus longtemps dans le Hà Tĩnh et le Nghệ An sous Phan Đình Phùng, dont la mort à la fin de 1895 mit fin au mouvement. Hoàng Hoa Thám, qui combattait dans le Yên Thế depuis le milieu des années 1880, tint tête aux Français jusqu’en 1913.
