Capture of Ormuz (1622): Prise d’Ormuz (1622)
A joint campaign of Safavid Persia and the English East India Company that took the island fortress of Hormuz from the Portuguese, who had controlled it and the trade of the Persian Gulf since 1515. Shah Abbas I had already taken Bahrain in 1602 and the mainland port of Comoran (Gombroon) in 1614–1615. In 1622 English ships bombarded the Portuguese fort on Qeshm and then Hormuz, while Persian troops under Imam Quli Khan besieged the castle, which surrendered on 23 April. The Portuguese moved their base to Muscat, and Abbas built up Gombroon as Bandar Abbas.: Campagne commune de la Perse safavide et de la Compagnie anglaise des Indes orientales, qui enleva la forteresse insulaire d’Ormuz aux Portugais, maîtres de l’île et du commerce du golfe Persique depuis 1515. Le shah Abbas Ier avait déjà pris Bahreïn en 1602 et le port continental de Comoran (Gombroon) en 1614–1615. En 1622, les navires anglais bombardèrent le fort portugais de Qeshm, puis Ormuz, tandis que les troupes persanes d’Imam Quli Khan assiégeaient le château, qui capitula le 23 avril. Les Portugais transférèrent leur base à Mascate, et Abbas développa Gombroon sous le nom de Bandar Abbas.
