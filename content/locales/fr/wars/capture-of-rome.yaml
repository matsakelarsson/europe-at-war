"Capture of Rome": "Capture de Rome"
"The Italian conquest of Rome and the last of the Papal States in September 1870, after the French garrison that had protected the pope left for the Franco-Prussian War. Italian troops breached the city walls at Porta Pia on 20 September, Rome and Lazio voted to join Italy, and Rome became the capital in 1871, while Pius IX declared himself a “prisoner in the Vatican”.": "La conquête italienne de Rome et la dernière des États pontificaux en septembre 1870, après la garnison française qui avait protégé le pape partit pour la guerre franco-prussienne. Des troupes italiennes brisèrent les murs de la ville à Porta Pia le 20 septembre, Rome et Latium votèrent pour rejoindre l’Italie, et Rome devint la capitale en 1871, tandis que Pie IX se déclara prisonnier au Vatican."
"The quarrel between Italy and the papacy that followed, the Roman Question, was settled only by the Lateran Treaty of 1929, which created the Vatican City State.": "La querelle entre l’Italie et la papauté qui a suivi, la question romaine, n’a été réglée que par le traité du Latran de 1929, qui a créé l’État de la Cité du Vatican."
