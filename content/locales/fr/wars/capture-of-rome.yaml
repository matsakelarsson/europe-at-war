"Since 1849 a French garrison had protected what was left of the Papal States, Rome and Lazio, and in 1867 French and Papal troops had beaten Garibaldi’s volunteers at Mentana. When the Franco-Prussian War broke out in July 1870, Napoleon III withdrew his troops, and after his defeat and capture at Sedan on 2 September the Italian government decided to act. Pope Pius IX rejected a last offer from King Victor Emmanuel II, and on 11 September some 50,000 Italian troops under General Raffaele Cadorna crossed the border. The Papal garrisons fell back on Rome, and Civitavecchia surrendered on 16 September.": "Depuis 1849, une garnison française avait protégé ce qui restait des États pontificaux, Rome et Latium, et en 1867 les troupes françaises et papales avaient battu les volontaires de Garibaldi à Mentana. Lorsque la guerre franco-prussienne éclata en juillet 1870, Napoléon III retira ses troupes, et après sa défaite et sa capture à Sedan le 2 septembre, le gouvernement italien décida d’agir. Le pape Pie IX a rejeté une dernière offre du roi Victor Emmanuel II, et le 11 septembre quelque 50 000 troupes italiennes sous la direction du général Raffaele Cadorna ont franchi la frontière. Les garnisons papales sont tombées sur Rome, et Civitavecchia s’est rendu le 16 septembre."
"The pope had about 13,000 troops under General Hermann Kanzler, many of them foreign volunteers, but ordered only a token defence. On the morning of 20 September Italian artillery opened a breach in the Aurelian Walls near the Porta Pia, Bersaglieri and infantry stormed through, and a white flag was raised over St Peter’s; 49 Italian and 19 Papal soldiers were killed. A plebiscite on 2 October approved union with Italy by an overwhelming majority, and Rome became the capital in 1871. Pius IX refused the Law of Guarantees offered by the Italian parliament and called himself a prisoner in the Vatican.": "Le matin du 20 septembre, l’artillerie italienne ouvrit une brèche dans les murs auréliens près de la Porta Pia, Bersaglieri et l’infanterie s’empressèrent de traverser, et un drapeau blanc fut levé sur Saint-Pierre ; 49 soldats italiens et 19 papals furent tués. Un plébiscite du 2 octobre a approuvé l’union avec l’Italie à une majorité écrasante, et Rome est devenue la capitale en 1871. Pie IX a refusé la loi des garanties offerte par le parlement italien et s’est qualifié de prisonnier au Vatican."
