# French translations of the catalogue text (wave 8); step bodies follow later.
Carnatic Wars: Guerres carnatiques
"Three wars between the British and French East India Companies and their Indian allies for influence in the Carnatic, the coastal plain of south-eastern India, and the Deccan. In the first (1746–1748), an offshoot of the War of the Austrian Succession, the French took Madras and beat the Nawab of Arcot’s army at the Adyar, but gave Madras back at the peace. In the second (1749–1754) the companies backed rival claimants to the thrones of Arcot and Hyderabad: the French governor Dupleix made his candidates nawab and Nizam, but Robert Clive’s seizure and defence of Arcot in 1751 and the French surrender at Srirangam in 1752 turned the tide, and the British candidate, Muhammad Ali, kept Arcot. In the third (1757–1763), part of the Seven Years’ War, the comte de Lally took Fort St David and besieged Madras, but Eyre Coote defeated him at Wandiwash in 1760 and took Pondicherry in 1761. The French kept their trading posts but never again challenged British power in India.": "Trois guerres entre les compagnies britannique et française des Indes orientales et leurs alliés indiens pour l’influence sur le Carnatic, la plaine côtière du sud-est de l’Inde, et sur le Dekkan. Lors de la première (1746–1748), prolongement de la guerre de Succession d’Autriche, les Français prirent Madras et battirent l’armée du nawab d’Arcot sur l’Adyar, mais rendirent Madras à la paix. Lors de la deuxième (1749–1754), les compagnies soutinrent des prétendants rivaux aux trônes d’Arcot et d’Hyderabad : le gouverneur français Dupleix fit de ses candidats le nawab et le nizam, mais la prise et la défense d’Arcot par Robert Clive en 1751 et la reddition française à Srirangam en 1752 renversèrent la situation, et le candidat britannique, Muhammad Ali, conserva Arcot. Lors de la troisième (1757–1763), volet de la guerre de Sept Ans, le comte de Lally prit le fort Saint-David et assiégea Madras, mais Eyre Coote le battit à Wandiwash en 1760 et prit Pondichéry en 1761. Les Français conservèrent leurs comptoirs mais ne contestèrent plus jamais la puissance britannique en Inde."
