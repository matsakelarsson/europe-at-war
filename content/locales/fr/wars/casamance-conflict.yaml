# French translations of the catalogue text (wave 13); step bodies follow later.
Casamance conflict: Conflit en Casamance
? The separatist conflict in Casamance, the part of Senegal south of the Gambia, between the Senegalese state and the Movement of Democratic Forces of Casamance (MFDC). Casamance, with its own Jola, Mandinka, Balanta and other peoples, its forests and rice fields and its long separation from the north by the Gambia, had grievances over land, neglect and northern officials. A march for independence in Ziguinchor on 26 December 1982, led by the priest Augustin Diamacoune Senghor, was put down, and from 1985 the MFDC’s armed wing, Atika, waged a guerrilla war from bases near the borders with Guinea-Bissau and the Gambia. The fighting was heaviest in the 1990s. Ceasefires in 1991, 1993 and 1999 and a general peace accord in 2004 did not end it, and after Diamacoune’s death in 2007 the MFDC split into factions. Salif Sadio declared a unilateral ceasefire in 2014, but the army attacked rebel bases in 2021 and 2022; the faction of César Atoute Badiate signed a peace agreement in 2022, about 250 fighters of another group laid down their arms in 2023, and the government announced a further agreement with MFDC factions in 2025. By 2026 the rebellion was much weakened and displaced people were returning, but some armed groups, above all in the forests near the Gambian border, had not laid down their arms, and no comprehensive peace agreement has been signed. Some 5,000 people are estimated to have been killed since 1982 and about 60,000 displaced.
: Le conflit séparatiste qui oppose en Casamance, la partie du Sénégal située au sud de la Gambie, l’État sénégalais au Mouvement des forces démocratiques de Casamance (MFDC). La Casamance, avec ses propres peuples, Diolas, Mandingues, Balantes et autres, ses forêts et ses rizières et sa longue séparation du nord par la Gambie, nourrissait des griefs liés à la terre, au délaissement de la région et aux fonctionnaires venus du nord. Une marche pour l’indépendance organisée à Ziguinchor le 26 décembre 1982 sous la conduite de l’abbé Augustin Diamacoune Senghor fut réprimée, et à partir de 1985 la branche armée du MFDC, Atika, mena une guérilla depuis des bases proches des frontières de la Guinée-Bissau et de la Gambie. Les combats furent les plus intenses dans les années 1990. Les cessez-le-feu de 1991, 1993 et 1999 et un accord de paix général en 2004 n’y mirent pas fin, et après la mort de Diamacoune en 2007 le MFDC se divisa en factions. Salif Sadio proclama un cessez-le-feu unilatéral en 2014, mais l’armée attaqua des bases rebelles en 2021 et 2022 ; la faction de César Atoute Badiate signa un accord de paix en 2022, environ 250 combattants d’un autre groupe déposèrent les armes en 2023, et le gouvernement annonça un nouvel accord avec des factions du MFDC en 2025. En 2026, la rébellion était très affaiblie et les déplacés revenaient, mais certains groupes armés, surtout dans les forêts proches de la frontière gambienne, n’avaient pas déposé les armes, et aucun accord de paix global n’a été signé. On estime que quelque 5 000 personnes ont été tuées depuis 1982 et environ 60 000 déplacées.
