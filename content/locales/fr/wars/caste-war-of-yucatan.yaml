# French translations of the catalogue text (wave 14); step bodies follow later.
Caste War of Yucatán: Guerre des Castes du Yucatán
? The rising of the Maya of eastern and southern Yucatán against the Hispanic Yucatecan state, and the half-century war that followed. In the 1840s Yucatán, which had broken away from Mexico, was split between rival factions that armed Maya villagers for their own quarrels, while sugar estates spread into Maya lands and church fees and head taxes weighed on the villages. In July 1847 the Yucatecan authorities executed a Maya leader, Manuel Antonio Ay, for plotting a revolt, and on 30 July Cecilio Chi attacked Tepich. With Jacinto Pat, Chi’s armies took most of the peninsula by May 1848 and came close to Mérida and Campeche, until they dispersed and the Yucatecans, after rejoining Mexico in return for money and troops, drove them back. From 1850 the rebels of the south-east, inspired by a Speaking Cross, built an independent state centred on Chan Santa Cruz, armed through trade with British Honduras. Only after Britain agreed in 1893 to stop that trade did Mexican troops under Ignacio Bravo occupy Chan Santa Cruz, in May 1901; resistance in the villages went on into the 1930s. Yucatán’s population fell by 30 to 50 percent between 1846 and the 1860s through battle, massacre, hunger, disease and flight.
: Le soulèvement des Mayas de l’est et du sud du Yucatán contre l’État yucatèque hispanique, et le demi-siècle de guerre qui suivit. Dans les années 1840, le Yucatán, qui avait fait sécession du Mexique, était divisé entre des factions rivales qui armaient les villageois mayas pour leurs propres querelles, tandis que les plantations sucrières s’étendaient sur les terres mayas et que les droits ecclésiastiques et la capitation pesaient sur les villages. En juillet 1847, les autorités yucatèques exécutèrent un chef maya, Manuel Antonio Ay, pour avoir préparé une révolte, et le 30 juillet Cecilio Chi attaqua Tepich. Avec Jacinto Pat, les armées de Chi s’emparèrent de la plus grande partie de la péninsule en mai 1848 et s’approchèrent de Mérida et de Campeche, jusqu’à ce qu’elles se dispersent et que les Yucatèques, après avoir réintégré le Mexique en échange d’argent et de troupes, les repoussent. À partir de 1850, les rebelles du sud-est, inspirés par une Croix parlante, bâtirent un État indépendant centré sur Chan Santa Cruz, qui s’armait grâce au commerce avec le Honduras britannique. Ce n’est qu’après que la Grande-Bretagne eut accepté en 1893 de mettre fin à ce commerce que les troupes mexicaines d’Ignacio Bravo occupèrent Chan Santa Cruz, en mai 1901 ; la résistance se poursuivit dans les villages jusque dans les années 1930. La population du Yucatán diminua de 30 à 50 % entre 1846 et les années 1860, du fait des combats, des massacres, de la faim, des maladies et de la fuite.
