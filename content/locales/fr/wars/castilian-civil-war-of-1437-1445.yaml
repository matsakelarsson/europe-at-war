# Some French text was translated automatically.
"Castilian Civil War of 1437–1445": "Guerre civile castillane de 1437–1445"
"A struggle for power in Castile between John II’s all-powerful favourite, the constable Álvaro de Luna, and a league of great nobles led by the Infantes of Aragon, John, king consort of Navarre, and Henry, Master of the Order of Santiago, sons of Ferdinand of Antequera. It began with the arrest of the noble Pedro Manrique in 1437. The league twice forced Luna into exile from the court, won control of the king after taking Medina del Campo in 1441, and in 1443 seized John II at Rágama. Luna, the king and the heir, Prince Henry, fought back, and on 19 May 1445, at the battle of Olmedo, the royal army beat the Infantes and their allies. The Infante Henry died of his wounds, and John of Navarre withdrew. The victory restored the crown’s authority for a time, though Luna himself was overthrown and executed in 1453.": "Une lutte pour le pouvoir en Castille entre Jean II's tout-puissant favori, le constable Álvaro de Luna, et une ligue de grands nobles dirigée par les Infantes d’Aragon, Jean, roi consort de Navarre, et Henri, maître de l’Ordre de Santiago, fils de Ferdinand d’Antequera. Elle a commencé avec l’arrestation du noble Pedro Manrique en 1437. La ligue força deux fois Luna à s’exiler de la cour, gagna le contrôle du roi après avoir pris Medina del Campo en 1441 et, en 1443, saisit Jean II à Rágama. Luna, le roi et l’héritier, le prince Henry, se battit contre lui et, le 19 mai 1445, lors de la bataille d’Olmedo, l’armée royale battit les Infantes et leurs alliés. La victoire rétablit l’autorité de la couronne pendant un certain temps, bien que Luna lui-même fut renversé et exécuté en 1453."
"Historians date the start of the war to 1437 or 1439. The Infantes had already fought Castile, with the help of Aragon and Navarre, in the war of 1429–1430.": "Les historiens datent du début de la guerre à 1437 ou 1439. Les enfants avaient déjà combattu la Castille, avec l’aide d’Aragon et Navarre, dans la guerre de 1429–1430."
