# Some French text was translated automatically.
"1368": "1368"
"Castilian Civil War": "Guerre civile castillane"
"The war between Peter I of Castile and his illegitimate half-brother Henry of Trastámara, which became a side theatre of the Hundred Years’ War. Henry, backed by France, Aragon and the Free Companies under Bertrand du Guesclin, drove Peter out in 1366; the Black Prince restored him by his victory at Nájera in 1367, but Henry returned, beat Peter at Montiel in 1369 and killed him, founding the Trastámara dynasty and making Castile an ally of France.": "La guerre entre Pierre Ier de Castille et son demi-frère illégitime Henri de Trastámara, qui est devenu un théâtre parallèle de la Guerre des Cent Ans. Henry, soutenu par la France, l’Aragon et les Compagnies Libres sous Bertrand du Guesclin, a chassé Peter en 1366 ; le Prince Noir lui a rendu par sa victoire à Nájera en 1367, mais Henry est revenu, a battu Peter à Montiel en 1369 et l’a tué, fondant la dynastie Trastámara et faisant de Castille un allié de la France."
"Peter’s enemies called him the Cruel and his supporters the Just. The main chronicle of his reign was written by Pero López de Ayala, who changed sides to Henry in 1366; Froissart tells the story from the English and French side.": "Les ennemis de Peter l’appelaient le Cruel et ses partisans le Juste. La chronique principale de son règne a été écrite par Pero López de Ayala, qui a changé de camp pour Henry en 1366 ; Froissart raconte l’histoire du côté anglais et français."
"Historians date the war differently. Some count it from the first noble revolts against Peter in the early 1350s, others only from Henry’s invasion of 1366. It overlapped with the War of the Two Peters (1356–1369) between Castile and Aragon, which has its own entry; Nájera and the Castilian alliance with France also appear in the Hundred Years’ War.": "Les historiens datent la guerre différemment. Certains la comptent des premières révoltes nobles contre Pierre au début des années 1350, d’autres seulement de l’invasion d’Henri de 1366. Il chevauchait avec la guerre des deux Pierres (1356-1369) entre Castille et Aragon, qui a sa propre entrée ; Nájera et l’alliance castillanienne avec la France apparaissent également dans la guerre de Cent Ans."
"Dates are Julian. Nájera is sometimes called the battle of Navarrete.": "Les dates sont Julian. Nájera est parfois appelé la bataille de Navarrete."
