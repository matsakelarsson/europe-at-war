"Peter could not pay what he had promised, and the Black Prince, sick and in debt, went back to Aquitaine in the summer of 1367; he never recovered his health. Henry returned that autumn, and much of the north accepted him. In 1368 he made an alliance with Charles V of France, took León and laid siege to Toledo, which held out for Peter. Peter’s ally, Muhammad V of Granada, raided Henry’s towns in Andalusia and sacked Jaén.": "Pierre ne pouvait pas payer ce qu’il avait promis, et le prince noir, malade et endetté, retourna en Aquitaine à l’été 1367 ; il n’a jamais retrouvé sa santé. Henri revint cet automne-là, et une grande partie du nord l’accepta. En 1368, il fit alliance avec Charles V de France, prit León et assiégea Tolède, qui tenait pour Pierre. Peter's allié, Muhammad V de Grenade, a fait une descente dans les villes d’Henri en Andalousie et saccagé Jaén."
"In March 1369 Peter marched to relieve Toledo with an army that included Granadan horsemen. Henry and Du Guesclin, now ransomed, surprised it at Montiel, in La Mancha, on 14 March and scattered it, and Peter took refuge in the castle. On the night of 23 March, lured out by an offer of escape, he was brought to Du Guesclin’s tent, where he fought with Henry and was stabbed to death. Henry II founded the Trastámara dynasty, and Castile became France’s ally. John of Gaunt, who married Peter’s daughter Constance, claimed the Castilian crown for years.": "En mars 1369 Pierre marcha pour soulager Tolède avec une armée qui comprenait des cavaliers de Grenade. Henry et Du Guesclin, maintenant rachetés, l’ont surpris à Montiel, à La Manche, le 14 mars et l’ont dispersée, et Pierre s’est réfugié dans le château. Dans la nuit du 23 mars, attiré par une offre d’évasion, il a été amené à la tente de Du Guesclin, où il s’est battu avec Henry et a été poignardé à mort. Henri II a fondé la dynastie Trastámara, et Castille est devenue alliée de France. Jean de Gaunt, qui a épousé Peter de la fille Constance, a réclamé la couronne castillane pendant des années."
