"Peter I became king of Castile at fifteen in 1350. His father, Alfonso XI, had had ten children with his mistress Leonor de Guzmán, and in 1351 Peter’s mother had Leonor put to death; her son Henry, count of Trastámara, became his half-brother’s mortal enemy. Peter’s reign saw noble revolts and many executions, among them that of another half-brother, Fadrique, in 1358, and his abandoned French wife, Blanche of Bourbon, died in his custody in 1361, it was said on his orders. Henry fled abroad and fought for Aragon in the War of the Two Peters.": "Pierre Ier devint roi de Castille à quinze ans en 1350. Son père, Alfonso XI, avait eu dix enfants avec sa maîtresse Leonor de Guzmán, et en 1351 la mère de Pierre avait mis Léonor à mort ; son fils Henry, comte de Trastámara, est devenu son demi-frère Ô ennemi mortel. Le règne de Pierre vit de nobles révoltes et beaucoup d’exécutions, parmi lesquelles celle d’un autre demi-frère, Fadrique, en 1358, et sa femme française abandonnée, Blanche de Bourbon, mourut sous sa garde en 1361, dit-on sur ses ordres. Henry s’enfuit à l’étranger et combattit pour Aragon pendant la guerre des Deux Pierres."
"In 1366, with French money and Aragonese support, Henry led the Free Companies, bands of soldiers left unemployed by the Hundred Years’ War, into Castile under Bertrand du Guesclin. Peter fled without a fight, and Henry was crowned at Burgos. Peter turned to Edward, the Black Prince, who ruled Aquitaine for England, and by the Treaty of Libourne promised him land and pay for his army. The prince crossed the Pyrenees at Roncesvalles in February 1367, and on 3 April, at Nájera, his English archers and men-at-arms routed Henry’s Castilian and French army. Du Guesclin was captured and Henry fled to France.": "En 1366, avec l’argent français et le soutien aragonais, Henry conduisit les compagnies libres, bandes de soldats laissés au chômage par la guerre de Cent Ans, en Castille sous Bertrand du Guesclin. Peter s’enfuit sans se battre, et Henri fut couronné à Burgos. Pierre tourna vers Edward, le prince noir, qui gouverna Aquitaine pour l’Angleterre, et par le traité de Libourne lui promet la terre et payer pour son armée. Le prince traversa les Pyrénées à Roncesvalles en février 1367, et le 3 avril, à Nájera, ses archers anglais et ses hommes d’armes roulèrent l’armée française et castillanienne Henry. Du Guesclin fut capturé et Henri s’enfuit en France."
