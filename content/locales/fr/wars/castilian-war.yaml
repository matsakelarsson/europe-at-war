# French translations of the catalogue text (wave 11); step bodies follow later.
Castilian War: Guerre de Castille
? The Spanish attack on the sultanate of Brunei in 1578, which the Malays call the Perang Kastila, “the war of the Castilians”. Brunei, the leading Muslim power of northern Borneo, had family and trading ties with Manila and the Sulu archipelago, and the Spaniards, who had taken Manila in 1571, saw its merchants and preachers as rivals to their own rule and missions in the islands. When Sultan Saiful Rijal rejected Governor Francisco de Sande’s demands to stop Muslim preaching and to admit Christian missionaries, Sande sailed from Manila in March 1578 with about 40 ships and more than 2,000 men, most of them Filipino auxiliaries, taking with him two Bruneian nobles, Pengiran Seri Lela and Pengiran Seri Ratna, who hoped for Spanish help against the sultan. On 14 April the fleet destroyed Brunei’s ships in the harbour, and by 16 April the Spaniards held the capital, Kota Batu; they burned its great mosque, and the sultan withdrew to Jerudong. Disease and Bruneian counter-attacks forced the Spaniards out after 72 days, and on 26 June they sailed back to Manila; the sultan returned and rebuilt his capital. A Spanish force sent on to Sulu obtained the submission of Jolo, the start of three centuries of wars between Spain and the Muslim states of the southern Philippines. Brunei kept its independence but never regained its influence in Luzon.
: L’attaque espagnole contre le sultanat de Brunei en 1578, que les Malais appellent Perang Kastila, « la guerre des Castillans ». Brunei, principale puissance musulmane du nord de Bornéo, entretenait des liens familiaux et commerciaux avec Manille et l’archipel de Sulu, et les Espagnols, qui avaient pris Manille en 1571, voyaient dans ses marchands et ses prédicateurs des rivaux de leur propre domination et de leurs missions dans les îles. Lorsque le sultan Saiful Rijal rejeta les exigences du gouverneur Francisco de Sande, qui lui demandait de mettre fin à la prédication musulmane et d’admettre des missionnaires chrétiens, Sande quitta Manille en mars 1578 avec environ 40 navires et plus de 2 000 hommes, pour la plupart des auxiliaires philippins, emmenant avec lui deux nobles de Brunei, Pengiran Seri Lela et Pengiran Seri Ratna, qui espéraient l’aide espagnole contre le sultan. Le 14 avril, la flotte détruisit les navires de Brunei dans le port et, dès le 16 avril, les Espagnols tenaient la capitale, Kota Batu ; ils incendièrent sa grande mosquée, et le sultan se retira à Jerudong. La maladie et les contre-attaques des Brunéiens contraignirent les Espagnols à partir au bout de 72 jours, et le 26 juin ils reprirent la mer pour Manille ; le sultan revint et rebâtit sa capitale. Un détachement espagnol envoyé ensuite à Sulu obtint la soumission de Jolo, début de trois siècles de guerres entre l’Espagne et les États musulmans du sud des Philippines. Brunei conserva son indépendance, mais ne retrouva jamais son influence à Luçon.
