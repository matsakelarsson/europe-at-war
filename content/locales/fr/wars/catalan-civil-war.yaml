# Some French text was translated automatically.
"Catalan Civil War": "Guerre civile catalane"
? "A civil war in the Principality of Catalonia between John II of Aragon and the Catalan institutions, the Generalitat and its Council of the Principality. Anger at John’s treatment of his son Charles of Viana, who died in Barcelona in 1461, combined with the revolt of the remença peasants against their lords and the conflicts within Barcelona. In 1462 John pledged Roussillon and Cerdanya to Louis XI of France for an army that rescued his queen and their son Ferdinand from the old fort of Girona, and France kept those counties until 1493. The Catalans declared John deposed and offered their crown in turn to Henry IV of Castile, to Peter, constable of Portugal, who lost at Calaf in 1465 and died in 1466, and to René of Anjou, whose son John of Lorraine fought on until his death in 1470. Barcelona, besieged by land and sea through 1472, surrendered by the Capitulation of Pedralbes on 16 October 1472; John granted a general pardon and swore to respect Catalonia’s laws."
: "Une guerre civile dans la Principauté de Catalogne entre Jean II d’Aragon et les institutions catalanes, la Generalitat et son Conseil de la Principauté. Angérer à Jean le traitement de son fils Charles de Viana, décédé à Barcelone en 1461, combiné avec la révolte des paysans de la remença contre leurs seigneurs et les conflits au sein de Barcelone. En 1462, Jean promet à Louis XI de France Roussillon et Cerdanya pour une armée qui a sauvé sa reine et leur fils Ferdinand du vieux fort de Girona, et la France garde ces comtés jusqu’en 1493. Les Catalans déclarèrent Jean déposé et offrirent leur couronne à Henri IV de Castille, à Pierre, constable du Portugal, qui perdit à Calaf en 1465 et mourut en 1466, et à René d’Anjou, dont le fils John de Lorraine combattit jusqu’à sa mort en 1470. Barcelone, assiégée par terre et par mer jusqu’en 1472, remise par la Capitulation de Pedralbes le 16 octobre 1472 ; Jean a accordé un pardon général et juré de respecter les lois catalanes."
"The remences’ own war against their lords ran alongside the civil war and broke out again in 1484–1486; many remences fought for the king.": "La guerre contre leurs seigneurs courut le long de la guerre civile et éclata de nouveau en 1484–1486 ; beaucoup de résistances combattirent pour le roi."
