"1859–1864": "1859–1864"
"With the east subdued, the Russian army turned on the Circassians, Ubykhs and Abaza of the western Caucasus, who had fought it for decades and had never been ruled by the Ottomans, although the sultan had claimed their coast. In 1861 their leaders formed an assembly at Sochi and appealed to Britain and the Ottoman Empire, without result. Alexander II approved a plan to drive the highland peoples out of the mountains and the coast and settle Cossacks there. From 1862 Russian columns under Yevdokimov moved through the valleys, burning villages and crops, and told the people to move to the Kuban plain or leave for the Ottoman Empire.": "L’armée russe, avec l’est soumis, se tourna vers les Circassiens, Ubykhs et Abaza du Caucase occidental, qui le combattaient depuis des décennies et n’avaient jamais été gouvernés par les Ottomans, bien que le sultan eût réclamé leur côte. En 1861 leurs dirigeants formèrent une assemblée à Sotchi et appelèrent sans résultat la Grande-Bretagne et l’Empire ottoman. Alexandre II a approuvé un plan pour chasser les peuples des hautes terres des montagnes et de la côte et y installer des cosaques. A partir de 1862, des colonnes russes sous Yevdokimov ont traversé les vallées, brûlé des villages et des récoltes, et ont dit au peuple de se déplacer dans la plaine de Kuban ou de partir pour l’Empire ottoman."
"On 2 June 1864 a parade at Kbaade, today’s Krasnaya Polyana, marked the end of the war. By then hundreds of thousands of people were crowded on the coast, waiting for ships. Thousands died there of hunger, cold and disease, on overloaded boats and after landing at Trabzon, Samsun and other ports. Estimates vary widely, but several hundred thousand to more than a million people were killed or driven out, and only a small part of the Circassian people remained. Many sources call this a genocide. Georgia recognised it as one in 2011; Russia rejects the term.": "Le 2 juin 1864, une parade à Kbaade, aujourd'hui Krasnaya Polyana, marqua la fin de la guerre. À l’époque, des centaines de milliers de personnes étaient encombrées sur la côte, attendant des navires. Des milliers y moururent de faim, de froid et de maladies, sur des bateaux surchargés et après avoir atterri à Trabzon, Samsun et d’autres ports. Les estimations varient considérablement, mais plusieurs centaines de milliers à plus d’un million de personnes ont été tuées ou chassées, et seule une petite partie du peuple circassien est restée. De nombreuses sources appellent cela un génocide."
