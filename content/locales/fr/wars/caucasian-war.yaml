"1817–1827": "1817–1827"
"By 1815 Russia ruled Georgia and the khanates south of the mountains, but the peoples of the North Caucasus had never accepted its rule, and the one road over the mountains to Tiflis ran past their lands. Cossack settlements along the Terek and the Kuban suffered raids, and the Russians answered with punitive expeditions. In 1816 General Aleksey Yermolov, a hero of Borodino, took command in the Caucasus, convinced that only fear would bring peace. In 1817 he began to push the line of forts forward from the Terek to the Sunzha, and in 1818 he founded the fortress of Groznaya, “the Menacing”, today’s Grozny.": "En 1815, la Russie gouverna la Géorgie et les khanates au sud des montagnes, mais les peuples du Caucase du Nord n’avaient jamais accepté sa domination, et la seule route sur les montagnes pour Tiflis courut devant leurs terres. Les colonies de cosaques le long du Terek et du Kuban subissaient des raids, et les Russes répondirent par des expéditions punitives. En 1816, le général Aleksey Yermolov, un héros de Borodino, prend le commandement dans le Caucase, convaincu que seule la peur apporterait la paix. En 1817, il commence à pousser la ligne de forts en avant du Terek à la Sunzha, et en 1818 il fonde la forteresse de Groznaya, le Menacing, aujourd'hui Grozny."
"Forts at Vnezapnaya and Burnaya followed in Dagestan, and a line of posts across Kabarda in the early 1820s. Yermolov’s troops burned villages that resisted, destroyed crops, took hostages and cut wide clearings through the Chechen forests, while families were driven from the lowlands into the mountains. In 1819 his soldiers stormed the Chechen village of Dadi-Yurt house by house and killed most of its people. A rising in Chechnya in 1825 was put down, and in 1827 Yermolov was dismissed, distrusted after the Decembrist revolt and blamed for setbacks against Persia.": "Les troupes de Yermolov ont brûlé des villages qui résistaient, détruisaient les récoltes, prenaient des otages et coupaient de larges clairières à travers les forêts tchétchènes, tandis que les familles étaient chassées des basses terres vers les montagnes. En 1819, ses soldats s’emparèrent du village tchétchène de la maison Dadi-Yurt et tuèrent la plupart de son peuple. Une montée en Tchétchénie en 1825 fut abattue et, en 1827, Yermolov fut congédié, méfié après la révolte de Decembrist et accusé des revers contre la Perse."
