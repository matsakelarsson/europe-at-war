"During the Crimean War Shamil hoped for help from the Ottomans and the British, which never came in strength. In July 1854 his son Ghazi Muhammad raided the Georgian estate of Tsinandali and carried off two princesses and their children, who were later exchanged for Shamil’s eldest son, held by the Russians since Akhulgo. After the war Prince Aleksandr Baryatinsky, the new viceroy, brought some 200,000 troops to bear. Roads and clearings closed in on Chechnya, and in 1858 the Russians took the Argun gorge and cut it in two.": "Pendant la guerre de Crimée, Shamil espérait recevoir l’aide des Ottomans et des Britanniques, qui n’étaient jamais venus en force. En juillet 1854, son fils Ghazi Muhammad fit une descente dans le domaine géorgien de Tsinandali et emmena deux princesses et leurs enfants, qui furent échangés plus tard contre Shamily, fils aîné, détenu par les Russes depuis Akhulgo. Après la guerre, le prince Aleksandr Baryatinsky, le nouveau vice-roi, a apporté quelque 200 000 soldats. Routes et clairières fermèrent sur la Tchétchénie, et en 1858, les Russes prirent la gorge d’Argun et la coupèrent en deux."
"Many villages, worn out by war, hunger and Shamil’s harsh rule, now made their peace with the Russians. Vedeno fell in April 1859 and the imamate collapsed. Shamil retreated with some 400 followers to the mountain village of Gunib in Dagestan, where Russian troops surrounded and stormed it. On 6 September 1859 he surrendered to Baryatinsky. He was taken to Saint Petersburg, lived in honourable exile in Kaluga, and died on pilgrimage in Medina in 1871. Resistance went on in places, but the war in the eastern Caucasus was over.": "De nombreux villages, usés par la guerre, la faim et la dure domination de Shamil, ont maintenant fait leur paix avec les Russes. Vedeno est tombé en avril 1859 et l’imamate s’est effondré. Shamil a pris sa retraite avec quelque 400 disciples dans le village de montagne de Gunib au Daghestan, où les troupes russes l’ont encerclé et pris d’assaut. Il fut emmené à Saint-Pétersbourg, vécut en exil honorable à Kaluga et mourut en pèlerinage à Medina en 1871. La résistance se poursuivit par des endroits, mais la guerre dans l’est du Caucase était terminée."
