"In 1843 Shamil struck in Dagestan. Moving his forces faster than the Russians could follow, he took almost every Russian post in Avaria within weeks and besieged the garrisons that were left. The campaign cost the Russians some 2,600 men and a dozen forts. Nicholas I sent large reinforcements and appointed Count Mikhail Vorontsov viceroy, with orders to destroy the imamate. In June 1845 Vorontsov marched south into the mountains with about 18,000 men, waited for weeks at Andi for supplies, and on 18 July took Shamil’s capital, Dargo, which the imam had set on fire.": "En 1843, Shamil frappe au Daghestan. Déplacement plus rapide que les Russes, il prend presque tous les postes russes à Avaria en quelques semaines et assiége les garnisons qui restent. La campagne coûte aux Russes quelque 2 600 hommes et une douzaine de forts. Nicholas J’envoie de grands renforts et nomme le comte Mikhail Vorontsov vice-roy, avec l’ordre de détruire l’imamate. En juin 1845, Vorontsov marcha vers le sud dans les montagnes avec environ 18 000 hommes, attendit pendant des semaines à Andi des fournitures, et le 18 juillet prit la capitale de Shamil, Dargo, que l’imam avait incendié."
"In the forests around Dargo the Chechens felled trees across the paths and attacked the strung-out columns from cover. A column sent to fetch a supply convoy lost hundreds of men and General Passek. Starving and burdened with wounded, Vorontsov’s army fought its way north for a week until relief troops met it. The campaign cost about 3,600 killed and wounded, among them three generals. Afterwards the Russians turned to slower methods, building forts and roads and clearing the forests, while Shamil moved his capital to Vedeno and beat off a Russian assault on Gergebil in 1847.": "Dans les forêts autour de Dargo, les Tchétchènes ont abattu des arbres à travers les sentiers et attaqué les colonnes de couverture. Une colonne envoyée pour aller chercher un convoi d’approvisionnement a perdu des centaines d’hommes et le général Passek. Fardé et encombré de blessés, l’armée Vorontsov a combattu son chemin au nord pendant une semaine jusqu’à ce que les troupes de secours le rencontrent. La campagne a coûté environ 3 600 morts et blessés, parmi lesquels trois généraux. Les Russes se tournèrent ensuite vers des méthodes plus lentes, construisant des forts et des routes et débarrassant les forêts, tandis que Shamil déplaça sa capitale à Vedeno et battit une attaque russe contre Gergebil en 1847."
