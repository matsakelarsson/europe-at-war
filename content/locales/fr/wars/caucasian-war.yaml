"1829–1840": "1829–1840"
"In the highlands of Dagestan, Naqshbandi Sufi teachers preached that Muslims should live by Islamic law, not local custom, and resist Russian rule. In 1829 the scholar Ghazi Muhammad of Gimry was proclaimed imam, and from 1830 he waged holy war. In 1831 he besieged Russian forts and sacked Kizlyar, carrying off some 200 captives. On 29 October 1832 Russian troops stormed Gimry and he was killed. His successor, Hamzat Bek, murdered the ruling family of the Avar khanate at Khunzakh in 1834 and was himself killed in revenge that year.": "Dans les hautes terres du Daghestan, les professeurs de Naqshbandi soufi prêchaient que les musulmans devaient vivre selon la loi islamique, et non la coutume locale, et résister à la domination russe. En 1829 l’érudit Ghazi Muhammad de Gimry a été proclamé imam, et à partir de 1830 il a mené la guerre sainte. Le 29 octobre 1832, les troupes russes s’emparèrent de Gimry et il fut tué. Son successeur, Hamzat Bek, assassina la famille dirigeante du khanate Avar à Khunzakh en 1834 et fut lui-même tué en vengeance cette année-là."
"The next imam was Shamil, an Avar who had escaped from Gimry badly wounded. He built a state with its own law, taxes and standing army, ruling through deputies called naibs. In the summer of 1839 General Pavel Grabbe besieged him in the rock fortress of Akhulgo for 80 days. When it fell, most of the defenders were killed, along with many of the women and children sheltering there, but Shamil escaped with a few followers. In 1840 the Chechens, fearing that the Russians would disarm them, rose and accepted him as imam.": "L’imam suivant était Shamil, un Avar qui s’était échappé de Gimry gravement blessé. Il a construit un État avec sa propre loi, les impôts et l’armée permanente, dirigeant par des députés appelés naibs. À l’été de 1839, le général Pavel Grabbe assiégea dans la forteresse rocheuse d’Akhulgo pendant 80 jours. Quand il est tombé, la plupart des défenseurs ont été tués, avec beaucoup de femmes et d’enfants qui s’y trouvaient, mais Shamil s’est échappé avec quelques partisans. En 1840 les Tchétchènes, craignant que les Russes les désarment, se sont levés et l’ont accepté comme imam."
