"Caucasian War": "Guerre du Caucase"
"The Russian Empire’s half-century war to conquer the peoples of the North Caucasus, from Yermolov’s fortified lines of 1817 to the surrender of Imam Shamil at Gunib in 1859 and the subjugation of Circassia in 1864. It ended with the killing and mass expulsion of the Circassians and other peoples of the western Caucasus to the Ottoman Empire, which many sources call a genocide.": "L’Empire russe mène pendant un demi-siècle une guerre de conquête contre les peuples du Caucase du Nord. Elle s’étend des lignes fortifiées d’Ermolov en 1817 à la reddition de l’imam Chamil à Gounib en 1859, puis à la soumission de la Circassie en 1864. Le conflit s’achève par le massacre et l’expulsion massive vers l’Empire ottoman des Circassiens et d’autres peuples du Caucase occidental. De nombreuses sources qualifient ces actes de génocide."
"Dates are New Style (Gregorian). Russian accounts use the Julian calendar, then 12 days behind, so Shamil’s surrender at Gunib is 25 August 1859 and the ceremony at Kbaade that marked the end of the war 21 May 1864 in Russian sources. Circassians mark 21 May as their day of mourning.": "Les comptes russes utilisent le calendrier julien, puis 12 jours derrière, donc la reddition de Shamil à Gunib est 25 août 1859 et la cérémonie à Kbaade qui a marqué la fin de la guerre 21 mai 1864 dans des sources russes. Circassiens marquent le 21 mai comme leur jour de deuil."
"Russian sources of the time called all the peoples of the North Caucasus “mountaineers”. They were many peoples, among them Chechens, Ingush, Avars, Dargins, Lezgins and Kumyks in the east, and in the west Kabardians, Circassians (Adyghe), Abaza, Ubykhs and Karachays.": "Les sources russes de l’époque appelaient tous les peuples du Caucase du Nord. Ils étaient beaucoup de peuples, parmi lesquels Tchétchènes, Ingush, Avars, Dargins, Lezgins et Kumyks à l’est, et dans l’ouest Kabardiens, Circassiens (Adyghe), Abaza, Ubykhs et Karachays."
"Numbers of dead and expelled are estimates, and they differ very widely between sources, above all for the expulsion of the Circassians in the 1860s.": "Le nombre de morts et d’expulsés est estimé, et ils diffèrent très largement entre les sources, surtout pour l’expulsion des circassiens dans les années 1860."
"The base map does not show the shifting zones of Russian control in the mountains, which steps show with lines and areas drawn from general accounts.": "La carte de base ne montre pas les zones mouvantes du contrôle russe dans les montagnes, que les marches montrent avec les lignes et les zones tirées des comptes généraux."
