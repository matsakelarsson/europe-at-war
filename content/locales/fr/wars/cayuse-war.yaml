# French translations of the catalogue text (wave 14); step bodies follow later.
Cayuse War: Guerre des Cayuses
? A war in the Oregon Country between the Cayuse and the American settlers of the Willamette Valley, which began with the killing of the missionaries Marcus and Narcissa Whitman. Wagon trains on the Oregon Trail brought measles to the Columbia Plateau in 1847, and the epidemic killed about half of the Cayuse, while most white children treated at the Whitman mission at Waiilatpu, near today’s Walla Walla, recovered. On 29 November 1847 a group of Cayuse men led by Tiloukaikt and Tomahas, believing that Whitman was poisoning their people, killed him, his wife and eleven others at the mission and held some fifty people captive, most of them women and children, until Peter Skene Ogden of the Hudson’s Bay Company ransomed them a month later. The Provisional Government of Oregon raised about 500 volunteers, the Oregon Rifles, under Cornelius Gilliam, who fought the Cayuse and some of their allies at Sand Hollow on 24 February 1848 and burned villages, but could not bring the war to an end; Gilliam was killed in an accident in March. The war led Congress to organise Oregon Territory in August 1848. In 1850 the Cayuse handed over five men, Tiloukaikt, Tomahas, Klokamas, Isaiachalakis and Kimasumpkin, who were tried and hanged at Oregon City on 3 June 1850; whether all of them had taken part in the killings is doubted. Raids and patrols went on until the Walla Walla Council of 1855, where the Cayuse ceded most of their land and were placed with the Umatilla and Walla Walla on the Umatilla Reservation, and some of them fought again in the Yakima War.
: Une guerre qui opposa, dans le pays de l’Oregon, les Cayuses aux colons américains de la vallée de la Willamette, et qui commença par le meurtre des missionnaires Marcus et Narcissa Whitman. Les convois de chariots de la piste de l’Oregon apportèrent la rougeole sur le plateau du Columbia en 1847, et l’épidémie tua environ la moitié des Cayuses, alors que la plupart des enfants blancs soignés à la mission Whitman de Waiilatpu, près de l’actuelle Walla Walla, guérirent. Le 29 novembre 1847, un groupe d’hommes cayuses mené par Tiloukaikt et Tomahas, persuadés que Whitman empoisonnait leur peuple, le tua, ainsi que sa femme et onze autres personnes, à la mission, et retint captives une cinquantaine de personnes, pour la plupart des femmes et des enfants, jusqu’à ce que Peter Skene Ogden, de la Compagnie de la Baie d’Hudson, les rachète un mois plus tard. Le gouvernement provisoire de l’Oregon leva environ 500 volontaires, les Oregon Rifles, sous les ordres de Cornelius Gilliam, qui combattirent les Cayuses et certains de leurs alliés à Sand Hollow le 24 février 1848 et brûlèrent des villages, mais ne purent mettre fin à la guerre ; Gilliam fut tué dans un accident en mars. La guerre amena le Congrès à organiser le territoire de l’Oregon en août 1848. En 1850, les Cayuses livrèrent cinq hommes, Tiloukaikt, Tomahas, Klokamas, Isaiachalakis et Kimasumpkin, qui furent jugés et pendus à Oregon City le 3 juin 1850 ; il n’est pas certain que tous aient pris part aux meurtres. Raids et patrouilles se poursuivirent jusqu’au conseil de Walla Walla de 1855, où les Cayuses cédèrent la plupart de leurs terres et furent installés avec les Umatillas et les Walla Wallas dans la réserve d’Umatilla, et certains d’entre eux reprirent les armes pendant la guerre Yakima.
