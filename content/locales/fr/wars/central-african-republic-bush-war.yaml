# French translations of the catalogue text (wave 13); step bodies follow later.
Central African Republic Bush War: Guerre de brousse centrafricaine
? A rebellion against François Bozizé, who had seized power in the Central African Republic in March 2003 and was elected president in 2005. In the remote north-east, rebels later united in the Union of Democratic Forces for Unity (UFDR), led by Michel Djotodia, raided Birao in November 2004 and in late 2006 took Birao, Sam Ouandja and Ouadda; the government accused Sudan of backing them. French aircraft and troops, based in the country under a defence agreement, helped the army retake Birao in November–December 2006, and when the UFDR attacked again in March 2007 French paratroopers fought for the town, much of which was burned. In the north-west, the APRD, made up largely of supporters of the overthrown president Ange-Félix Patassé, and Abdoulaye Miskine’s FDPC fought the army, whose Presidential Guard burned villages and killed hundreds of civilians; Chadian troops also crossed the border. Some 212,000 people fled their homes. The FDPC signed a peace agreement at Sirte in Libya in February 2007, and the UFDR at Birao in April 2007; a comprehensive peace agreement signed in Libreville in June 2008 by the main groups provided for amnesty and disarmament, but its failure led to the Séléka rebellion of 2012.
: Une rébellion contre François Bozizé, qui avait pris le pouvoir en République centrafricaine en mars 2003 et fut élu président en 2005. Dans le nord-est reculé, des rebelles réunis plus tard au sein de l’Union des forces démocratiques pour le rassemblement (UFDR), dirigée par Michel Djotodia, attaquèrent Birao en novembre 2004 et, à la fin de 2006, prirent Birao, Sam Ouandja et Ouadda ; le gouvernement accusa le Soudan de les soutenir. Des avions et des troupes français, stationnés dans le pays en vertu d’un accord de défense, aidèrent l’armée à reprendre Birao en novembre–décembre 2006 et, lorsque l’UFDR attaqua de nouveau en mars 2007, des parachutistes français se battirent pour la ville, dont une grande partie fut incendiée. Dans le nord-ouest, l’APRD, composée en grande partie de partisans du président renversé Ange-Félix Patassé, et le FDPC d’Abdoulaye Miskine combattirent l’armée, dont la Garde présidentielle incendia des villages et tua des centaines de civils ; des troupes tchadiennes franchirent aussi la frontière. Quelque 212 000 personnes fuirent leur foyer. Le FDPC signa un accord de paix à Syrte, en Libye, en février 2007, et l’UFDR à Birao en avril 2007 ; un accord de paix global signé à Libreville en juin 2008 par les principaux groupes prévoyait l’amnistie et le désarmement, mais son échec déboucha sur la rébellion de la Seleka en 2012.
