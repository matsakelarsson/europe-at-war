# French translations of the catalogue text (wave 13); step bodies follow later.
Central African Republic Civil War: Guerre civile centrafricaine
? The war that began in December 2012, when the Séléka, an alliance of rebel groups from the largely Muslim north-east, marched on Bangui and in March 2013 overthrew President François Bozizé. The Séléka’s looting and killings provoked the rise of the Anti-balaka, militias drawn mostly from Christian and animist communities, which drove much of the Muslim population out of the west of the country. French troops, African and then UN peacekeepers intervened, the Séléka leader Michel Djotodia resigned in 2014, and elections in 2016 brought Faustin-Archange Touadéra to power, but the country remained divided between more than a dozen armed groups fighting over mines, cattle routes and roadblocks. After a peace agreement in 2019 failed, the armed groups united against Touadéra in the Coalition of Patriots for Change (CPC) in December 2020; Russian Wagner fighters and Rwandan troops drove them back from Bangui and most towns. Two of the largest groups disarmed in 2025, but violence continues in the north-east and south-east. No reliable overall death toll exists; more than a million people were displaced at the height of the war.
: La guerre qui commença en décembre 2012, lorsque la Seleka, alliance de groupes rebelles du nord-est majoritairement musulman, marcha sur Bangui et renversa en mars 2013 le président François Bozizé. Les pillages et les tueries de la Seleka provoquèrent l’essor des anti-balaka, des milices issues pour la plupart des communautés chrétiennes et animistes, qui chassèrent une grande partie de la population musulmane de l’ouest du pays. Des troupes françaises et des forces de maintien de la paix africaines, puis onusiennes, intervinrent, le chef de la Seleka Michel Djotodia démissionna en 2014, et les élections de 2016 portèrent Faustin-Archange Touadéra au pouvoir, mais le pays resta divisé entre plus d’une dizaine de groupes armés qui se disputaient les mines, les routes de transhumance et les barrages routiers. Après l’échec d’un accord de paix en 2019, les groupes armés s’unirent contre Touadéra au sein de la Coalition des patriotes pour le changement (CPC) en décembre 2020 ; des combattants russes de Wagner et des troupes rwandaises les repoussèrent loin de Bangui et de la plupart des villes. Deux des principaux groupes ont désarmé en 2025, mais les violences se poursuivent dans le nord-est et le sud-est. Il n’existe aucun bilan global fiable des morts ; plus d’un million de personnes étaient déplacées au plus fort de la guerre.
