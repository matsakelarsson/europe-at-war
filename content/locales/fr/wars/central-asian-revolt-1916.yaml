# French translations of the catalogue text (wave 7); step bodies follow later.
Central Asian revolt of 1916: Révolte d’Asie centrale de 1916
A rising against Russian rule in Turkestan and the Kazakh steppe, set off by a wartime decree of July 1916 that called up the region’s Muslim men, until then exempt from military service, for labour behind the front. Rebels killed officials and Russian settlers, above all in Semirechye. The army, Cossacks and settler militias put the revolt down with mass killings, and hundreds of thousands of Kyrgyz and Kazakhs fled across the Tian Shan into China, the flight Kyrgyz remember as the Urkun. Estimates of the Central Asian dead range from about 40,000 to 270,000 or more.: Un soulèvement contre la domination russe au Turkestan et dans la steppe kazakhe, déclenché par un décret de guerre de juillet 1916 qui mobilisait les hommes musulmans de la région, jusque-là exemptés du service militaire, pour des travaux à l’arrière du front. Les rebelles tuèrent des fonctionnaires et des colons russes, surtout dans le Semiretchie. L’armée, les Cosaques et les milices de colons écrasèrent la révolte par des massacres, et des centaines de milliers de Kirghiz et de Kazakhs s’enfuirent en Chine par le Tian Shan, un exode dont les Kirghiz gardent la mémoire sous le nom d’Urkun. Les estimations des morts parmi les populations d’Asie centrale vont d’environ 40 000 à 270 000 ou davantage.
