# French translations of the catalogue text (wave 9); step bodies follow later.
Central Plains War: Guerre des plaines centrales
? "A civil war in 1930 between Chiang Kai-shek’s Nationalist government in Nanjing and a coalition of the generals who had fought beside him in the Northern Expedition: Yan Xishan of Shanxi, Feng Yuxiang of the Northwest Army and Li Zongren of the Guangxi clique, with Wang Jingwei’s faction of the Kuomintang. It grew out of Chiang’s plans to cut the regional armies and the wars of 1929 against the Guangxi clique and Feng. From May to October 1930 well over a million men fought along the railways of Henan, Shandong and Anhui, on the plains of the middle Yellow River, in the largest war of the warlord era. The coalition took Jinan and set up a rival national government in Beiping in September, but Chiang held the Longhai railway and retook Jinan, and the war was decided when Zhang Xueliang, ruler of the north-east, declared for Nanjing on 18 September and sent his army through the Shanhai Pass to occupy Beiping and Tianjin. Feng’s army fell apart and Yan withdrew to Shanxi; both resigned their posts on 4 November. The government admitted 30,000 dead and 60,000 wounded on its own side; losses on both sides and among civilians were much higher. Chiang emerged as China’s leading figure, but the war drained his government, and Zhang’s move south left Manchuria weakly defended a year before the Japanese invasion."
: "Une guerre civile, en 1930, entre le gouvernement nationaliste de Tchang Kaï-chek à Nankin et une coalition des généraux qui avaient combattu à ses côtés pendant l’expédition du Nord : Yan Xishan du Shanxi, Feng Yuxiang de l’armée du Nord-Ouest et Li Zongren de la clique du Guangxi, avec la faction de Wang Jingwei au sein du Kuomintang. Elle naquit des projets de Tchang de réduire les armées régionales et des guerres de 1929 contre la clique du Guangxi et contre Feng. De mai à octobre 1930, bien plus d’un million d’hommes combattirent le long des voies ferrées du Henan, du Shandong et de l’Anhui, dans les plaines du cours moyen du fleuve Jaune, lors de la plus grande guerre de l’ère des seigneurs de la guerre. La coalition prit Jinan et établit un gouvernement national rival à Beiping en septembre, mais Tchang tint la ligne du Longhai et reprit Jinan, et la guerre fut tranchée lorsque Zhang Xueliang, maître du Nord-Est, se déclara pour Nankin le 18 septembre et envoya son armée par la passe de Shanhai occuper Beiping et Tianjin. L’armée de Feng se désagrégea et Yan se retira dans le Shanxi ; tous deux démissionnèrent de leurs fonctions le 4 novembre. Le gouvernement reconnut 30 000 morts et 60 000 blessés dans son propre camp ; les pertes des deux camps et parmi les civils furent bien plus élevées. Tchang en sortit comme la figure dominante de la Chine, mais la guerre épuisa son gouvernement, et le départ de Zhang vers le sud laissa la Mandchourie faiblement défendue un an avant l’invasion japonaise."
