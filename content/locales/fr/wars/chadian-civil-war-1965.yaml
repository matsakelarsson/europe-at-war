# French translations of the catalogue text (wave 12); step bodies follow later.
Chadian Civil War (1965–1979): Guerre civile tchadienne (1965–1979)
? The first civil war of independent Chad, between the governments of François Tombalbaye and Félix Malloum in Fort-Lamy (N’Djamena from 1973) and rebels of the Muslim centre, east and north. Tombalbaye’s one-party state, dominated by southerners, raised taxes that were collected by force, and tax riots at Mangalmé in November 1965 began a peasant revolt that spread across the centre and east. In 1966 exiles in Sudan founded the National Liberation Front of Chad (FROLINAT), and from 1968 Toubou fighters in the Tibesti under Goukouni Oueddei and later Hissène Habré joined the rebellion. France intervened in 1968–1972 and drove the rebels back at the cost of thousands of lives, mostly Chadian. Libya, which occupied the Aouzou Strip in the far north in 1973, armed the rebels; FROLINAT split into rival armies. Tombalbaye was killed in a coup in 1975. In 1978 Goukouni’s forces, with Libyan support, took Faya-Largeau and advanced on the capital until French troops stopped them; Habré then joined the government as prime minister and in February 1979 turned on Malloum. The battle for N’Djamena and the killings that followed in the north and south left thousands dead, the state fell apart into factions, and the agreements of Kano and Lagos brought Goukouni to power at the head of a government of national unity in November 1979. Its collapse began the Chadian–Libyan war.
: La première guerre civile du Tchad indépendant, qui opposa les gouvernements de François Tombalbaye et de Félix Malloum, à Fort-Lamy (N’Djamena à partir de 1973), aux rebelles des régions musulmanes du centre, de l’est et du nord. L’État à parti unique de Tombalbaye, dominé par les sudistes, augmenta des impôts qui étaient perçus par la force, et des émeutes fiscales à Mangalmé, en novembre 1965, déclenchèrent une révolte paysanne qui s’étendit à tout le centre et à l’est. En 1966, des exilés au Soudan fondèrent le Front de libération nationale du Tchad (FROLINAT) et, à partir de 1968, des combattants toubou du Tibesti, menés par Goukouni Oueddei puis par Hissène Habré, rejoignirent la rébellion. La France intervint en 1968–1972 et repoussa les rebelles au prix de milliers de vies, tchadiennes pour la plupart. La Libye, qui occupa en 1973 la bande d’Aouzou, dans l’extrême nord, arma les rebelles ; le FROLINAT se divisa en armées rivales. Tombalbaye fut tué lors d’un coup d’État en 1975. En 1978, les forces de Goukouni, soutenues par la Libye, prirent Faya-Largeau et marchèrent sur la capitale jusqu’à ce que les troupes françaises les arrêtent ; Habré entra alors au gouvernement comme Premier ministre et, en février 1979, se retourna contre Malloum. La bataille de N’Djamena et les tueries qui suivirent dans le nord et dans le sud firent des milliers de morts, l’État se désagrégea en factions, et les accords de Kano et de Lagos portèrent Goukouni au pouvoir à la tête d’un gouvernement d’union nationale en novembre 1979. L’effondrement de ce gouvernement ouvrit la guerre tchado-libyenne.
