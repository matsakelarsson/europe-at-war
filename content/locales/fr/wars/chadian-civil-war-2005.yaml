# French translations of the catalogue text (wave 12); step bodies follow later.
Chadian Civil War (2005–2010): Guerre civile tchadienne (2005–2010)
? "A war between the government of President Idriss Déby and rebel movements based in Darfur, fought alongside the war in Darfur as a proxy war between Chad and Sudan. Déby, who had taken power in 1990, faced defections from his own Zaghawa clan and army over his support for the Darfur rebels and over a constitutional change of 2005 that let him stand for a third term. Sudan armed and sheltered the Chadian rebels, while Chad backed the Darfur rebels of the Justice and Equality Movement (JEM). Rebel columns of pickup trucks crossed Chad from the Sudanese border and reached N’Djamena twice: in April 2006, when the United Front for Democratic Change was beaten back at the National Assembly, and in February 2008, when a coalition of the UFDD, UFDD-F and RFC broke into the capital and besieged Déby in his palace before withdrawing. France helped the government with intelligence, logistics and the evacuation of foreigners. In eastern Chad, where about 250,000 refugees from Darfur lived in camps, militias and rebels raided villages and some 170,000 Chadians were displaced; a European Union force and then a UN mission protected the camps in 2008–2010. After a last rebel offensive was crushed at Am Dam in May 2009, Chad and Sudan signed an agreement on 15 January 2010 to stop backing each other’s rebels."
: "Une guerre entre le gouvernement du président Idriss Déby et des mouvements rebelles basés au Darfour, menée parallèlement à la guerre du Darfour comme une guerre par procuration entre le Tchad et le Soudan. Déby, arrivé au pouvoir en 1990, dut faire face à des défections au sein de son propre clan zaghawa et de l’armée en raison de son soutien aux rebelles du Darfour et d’une révision constitutionnelle de 2005 qui lui permettait de briguer un troisième mandat. Le Soudan arma et abrita les rebelles tchadiens, tandis que le Tchad soutenait les rebelles darfouris du Mouvement pour la justice et l’égalité (JEM). Des colonnes rebelles de pick-up traversèrent le Tchad depuis la frontière soudanaise et atteignirent N’Djamena à deux reprises : en avril 2006, lorsque le Front uni pour le changement démocratique fut repoussé devant l’Assemblée nationale, et en février 2008, lorsqu’une coalition de l’UFDD, de l’UFDD-F et du RFC pénétra dans la capitale et assiégea Déby dans son palais avant de se retirer. La France aida le gouvernement par du renseignement, un soutien logistique et l’évacuation des étrangers. Dans l’est du Tchad, où environ 250 000 réfugiés du Darfour vivaient dans des camps, des milices et des rebelles attaquèrent des villages et quelque 170 000 Tchadiens furent déplacés ; une force de l’Union européenne, puis une mission de l’ONU protégèrent les camps en 2008–2010. Après l’écrasement d’une dernière offensive rebelle à Am Dam en mai 2009, le Tchad et le Soudan signèrent le 15 janvier 2010 un accord par lequel chacun s’engageait à cesser de soutenir les rebelles de l’autre."
