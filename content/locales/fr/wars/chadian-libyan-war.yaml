# French translations of the catalogue text (wave 12); step bodies follow later.
Chadian–Libyan war: Guerre tchado-libyenne
? "A war over northern Chad between Muammar Gaddafi’s Libya and successive Chadian governments, fought in and around Chad’s own civil war. Libya had occupied the Aouzou Strip on the Libyan border in 1973 and backed Goukouni Oueddei’s rebels, who took Faya-Largeau with Libyan help in 1978. After the government of national unity formed in 1979 broke apart, Libyan troops helped Goukouni drive his rival Hissène Habré out of N’Djamena in December 1980, and Gaddafi announced a union of the two countries, which alarmed Africa and France; the Libyans withdrew in November 1981, and Habré took the capital in June 1982. Libya then backed Goukouni’s rival government in the north, retook Faya-Largeau in 1983 and held the north of the country for three years, while French troops in Operations Manta and Épervier guarded the south along the 15th and then the 16th parallel. When Goukouni broke with Libya in 1986, the Chadian forces, united under Habré and mounted on Toyota pickup trucks with anti-tank missiles, won the “Toyota War” of 1987: they destroyed the Libyan bases at Fada and Ouadi Doum, took Faya-Largeau and even raided the airbase of Maaten al-Sarra inside Libya. A ceasefire on 11 September 1987 left Libya only the Aouzou Strip, which the International Court of Justice awarded to Chad in 1994; Libya withdrew that May. Habré’s own rule was brutal: a Chadian commission later blamed it for some 40,000 political killings, and he was convicted of crimes against humanity in 2016."
: "Une guerre pour le nord du Tchad entre la Libye de Mouammar Kadhafi et les gouvernements tchadiens successifs, imbriquée dans la guerre civile que connaissait le Tchad lui-même. La Libye avait occupé en 1973 la bande d’Aouzou, à la frontière libyenne, et soutenait les rebelles de Goukouni Oueddei, qui prirent Faya-Largeau avec l’aide libyenne en 1978. Après l’éclatement du gouvernement d’union nationale formé en 1979, les troupes libyennes aidèrent Goukouni à chasser de N’Djamena son rival Hissène Habré en décembre 1980, et Kadhafi annonça l’union des deux pays, ce qui inquiéta l’Afrique et la France ; les Libyens se retirèrent en novembre 1981, et Habré prit la capitale en juin 1982. La Libye soutint alors le gouvernement rival de Goukouni dans le nord, reprit Faya-Largeau en 1983 et tint le nord du pays pendant trois ans, tandis que les troupes françaises des opérations Manta et Épervier gardaient le sud le long du 15e, puis du 16e parallèle. Lorsque Goukouni rompit avec la Libye en 1986, les forces tchadiennes, unies sous Habré et montées sur des pick-up Toyota armés de missiles antichars, remportèrent la « guerre des Toyota » de 1987 : elles détruisirent les bases libyennes de Fada et de Ouadi Doum, prirent Faya-Largeau et allèrent jusqu’à attaquer la base aérienne de Maaten al-Sarra, en territoire libyen. Un cessez-le-feu conclu le 11 septembre 1987 ne laissa à la Libye que la bande d’Aouzou, que la Cour internationale de justice attribua au Tchad en 1994 ; la Libye s’en retira en mai de la même année. Le régime de Habré fut lui-même brutal : une commission tchadienne lui imputa plus tard quelque 40 000 meurtres politiques, et il fut condamné pour crimes contre l’humanité en 2016."
