# French translations of the catalogue text (wave 11); step bodies follow later.
Champa–Đại Việt war of 1361–1390: Guerre entre le Champa et le Đại Việt (1361–1390)
Three decades of war in which Champa, reunited under Chế Bồng Nga (Po Binasuor), nearly overthrew the Trần dynasty of Đại Việt. Cham fleets raided the coast from 1361, and in 1368 Chế Bồng Nga demanded back the districts of Ô and Lý, ceded to Đại Việt in 1306. In 1371, after a succession crisis in Thăng Long, his fleet sailed into the Red River delta and sacked the capital. In 1377 the Trần king Trần Duệ Tông led a large army against the Cham capital Vijaya and was killed in an ambush; the Cham marched north, overran Nghệ An and Thanh Hóa with the help of Vietnamese defectors, and sacked Thăng Long again in 1377–1378 and in 1383. The war ended in 1390 on the Hải Triều (Luộc) River, where a volley of handguns hit Chế Bồng Nga’s barge and killed him. Neither side gained land, both were exhausted, and the general Hồ Quý Ly, who had risen in the war, took the Trần throne in 1400.: Trois décennies de guerre au cours desquelles le Champa, réunifié sous Chế Bồng Nga (Po Binasuor), faillit renverser la dynastie Trần du Đại Việt. Les flottes chames lancèrent des raids sur la côte à partir de 1361 et, en 1368, Chế Bồng Nga réclama la restitution des districts d’Ô et de Lý, cédés au Đại Việt en 1306. En 1371, après une crise de succession à Thăng Long, sa flotte pénétra dans le delta du fleuve Rouge et saccagea la capitale. En 1377, le roi Trần Duệ Tông conduisit une grande armée contre la capitale chame, Vijaya, et fut tué dans une embuscade ; les Chams marchèrent vers le nord, envahirent le Nghệ An et le Thanh Hóa avec l’aide de transfuges vietnamiens, et saccagèrent de nouveau Thăng Long en 1377–1378 et en 1383. La guerre prit fin en 1390 sur la rivière Hải Triều (Luộc), où une salve de canons à main atteignit la barge de Chế Bồng Nga et le tua. Aucun des deux camps ne gagna de territoire, tous deux sortirent épuisés, et le général Hồ Quý Ly, qui s’était élevé à la faveur de la guerre, s’empara du trône des Trần en 1400.
