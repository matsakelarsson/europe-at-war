# French translations of the catalogue text (wave 12); step bodies follow later.
Char Bouba war: Guerre de Char Bouba
? A war in the south-western Sahara and the Senegal valley between the clerical Berber tribes (the zawaya) led by the imam Nasir al-Din and the warrior Arab tribes of the Banu Hassan, which ended the zawaya’s political power and left the Hassan emirates of Trarza and Brakna dominant in what is now southern Mauritania. Nasir al-Din (Awbek b. Ashfaga), a scholar of the Lamtuna, preached repentance and the rule of Islamic law, demanded zakat from the tribes of the region and condemned the kings of the Senegal valley for selling their own subjects to European slave traders. The war takes its Berber name, “Bubba’s war”, from a tributary of the Lamtuna who persuaded his chief to call on Haddi b. Ahmad b. Daman of the Trarza to resist the zakat. In 1673 Nasir al-Din’s followers, called the Toubenan (“penitents”) by Europeans, overthrew the Denianke ruler of Futa Toro and the rulers of Kayor and Jolof, with the support of Torodbe clerics, peasants and Muslim Wolof, and later took Waalo. The French at Saint-Louis, whose trade the clerics disrupted, backed the old ruling families. Nasir al-Din was killed at Tirtilass by May 1674; his successors Uthman, Munir al-Din and al-Mukhtar were killed or died in turn, the Wolof and Denianke aristocracies regained their thrones with French help, and the movement collapsed in 1677. The defeated zawaya had to pay tribute to the Hassan and give them rights to water and milk. A famine from 1676 drove many people in the Senegal valley to sell themselves into slavery.
: Une guerre dans le sud-ouest du Sahara et la vallée du Sénégal entre les tribus berbères maraboutiques (les zawaya), menées par l’imam Nasir al-Din, et les tribus guerrières arabes des Banu Hassan ; elle mit fin au pouvoir politique des zawaya et laissa les émirats hassanes du Trarza et du Brakna dominer l’actuel sud de la Mauritanie. Nasir al-Din (Awbek b. Ashfaga), lettré des Lamtuna, prêchait la repentance et le règne de la loi islamique, exigeait la zakat des tribus de la région et condamnait les rois de la vallée du Sénégal qui vendaient leurs propres sujets aux négriers européens. La guerre tire son nom berbère, « la guerre de Bubba », d’un tributaire des Lamtuna qui persuada son chef de faire appel à Haddi b. Ahmad b. Daman, du Trarza, pour résister à la zakat. En 1673, les partisans de Nasir al-Din, que les Européens appelaient les Toubenan (« pénitents »), renversèrent le souverain denianké du Fouta-Toro et les souverains du Cayor et du Djolof, avec l’appui des clercs torodbé, des paysans et des Wolof musulmans, puis prirent le Waalo. Les Français de Saint-Louis, dont les clercs perturbaient le commerce, soutinrent les anciennes familles régnantes. Nasir al-Din fut tué à Tirtilass au plus tard en mai 1674 ; ses successeurs Uthman, Munir al-Din et al-Mukhtar furent tués ou moururent l’un après l’autre, les aristocraties wolof et denianké retrouvèrent leurs trônes avec l’aide française, et le mouvement s’effondra en 1677. Les zawaya vaincus durent payer tribut aux Hassan et leur accorder des droits sur l’eau et le lait. Une famine, à partir de 1676, poussa de nombreux habitants de la vallée du Sénégal à se vendre eux-mêmes comme esclaves.
