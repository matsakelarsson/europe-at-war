# French translations of the catalogue text (wave 14); step bodies follow later.
Cherokee–American wars: Guerres cherokee-américaines
? Nearly twenty years of war between the Cherokee and the American frontier settlements of Virginia, the Carolinas, Georgia and Tennessee. Settlers had pushed onto Cherokee land beyond the Appalachians, and in 1775 a land company bought Kentucky and much of the Cumberland valley from some Cherokee leaders. In the summer of 1776, encouraged by the British and by the Shawnee, Cherokee warriors attacked the frontier; militia from four states answered by burning more than fifty Cherokee towns, and in 1777 the older leaders made peace and gave up land. Dragging Canoe (Tsiyu Gansini) and those who refused to accept the cessions moved down the Tennessee River and founded new towns, first on Chickamauga Creek and later below Lookout Mountain; the Americans called them the Chickamauga, and later the Lower Cherokee. With British and then Spanish supplies, and with Muscogee, Shawnee and Loyalist allies, they fought on after the Revolution against the settlements on the Holston and the Cumberland. American raids repeatedly destroyed their towns and those of the Cherokee who had made peace, and in 1788 militiamen killed the peace chief Old Tassel under a flag of truce. After Dragging Canoe’s death in 1792 John Watts led the war, until the destruction of Nickajack and Running Water and the defeat of the Western Confederacy in the north led him to make peace at Tellico Blockhouse on 7 November 1794.
: Près de vingt ans de guerre entre les Cherokees et les établissements américains de la frontière, en Virginie, dans les Carolines, en Géorgie et au Tennessee. Des colons s’étaient avancés sur les terres cherokees au-delà des Appalaches et, en 1775, une compagnie foncière acheta à quelques chefs cherokees le Kentucky et une grande partie de la vallée de la Cumberland. À l’été 1776, encouragés par les Britanniques et par les Shawnees, des guerriers cherokees attaquèrent la frontière ; les milices de quatre États répliquèrent en incendiant plus de cinquante villes cherokees et, en 1777, les chefs les plus âgés firent la paix et cédèrent des terres. Dragging Canoe (Tsiyu Gansini) et ceux qui refusaient d’accepter les cessions descendirent la Tennessee et fondèrent de nouvelles villes, d’abord sur le Chickamauga Creek, puis en aval de Lookout Mountain ; les Américains les appelèrent les Chickamaugas, puis les Cherokees inférieurs (Lower Cherokee). Ravitaillés par les Britanniques, puis par les Espagnols, et soutenus par des alliés muscogees, shawnees et loyalistes, ils continuèrent après la Révolution à combattre les établissements de la Holston et de la Cumberland. Les raids américains détruisirent à plusieurs reprises leurs villes et celles des Cherokees qui avaient fait la paix et, en 1788, des miliciens tuèrent le chef de paix Old Tassel sous un drapeau parlementaire. Après la mort de Dragging Canoe en 1792, John Watts dirigea la guerre jusqu’à ce que la destruction de Nickajack et de Running Water et la défaite de la Confédération de l’Ouest, au nord, le conduisent à faire la paix à Tellico Blockhouse le 7 novembre 1794.
Cherokee (from 1777 chiefly the Chickamauga or Lower Cherokee of Dragging Canoe and John Watts), with Muscogee, Shawnee and Loyalist allies: Cherokees (à partir de 1777, surtout les Chickamaugas ou Cherokees inférieurs de Dragging Canoe et de John Watts), avec des alliés muscogees, shawnees et loyalistes
