# French translations of the catalogue text (wave 14); step bodies follow later.
Chichimeca War: Guerre chichimèque
Forty years of war between New Spain and the peoples the Spaniards called Chichimecs, the Guachichiles, Zacatecos, Guamares and Pames of the dry plateau north of the old Aztec lands, set off by the silver strike at Zacatecas in 1546 and the roads, mining towns and slave raids that followed. From 1550 Chichimec raiders attacked wagon trains, ranches and towns along the silver road; by 1561 they had killed more than 4,000 Spaniards and allies. Neither a line of presidios nor the “war of fire and blood” declared in 1567 stopped them, and the raids were at their worst in 1575–1585. From 1586 the viceroys bought peace instead, with food, clothing, tools and land, missions and settlements of Tlaxcalan families; in 1590 the roads to Zacatecas were declared safe for the first time in forty years.: Une guerre de quarante ans entre la Nouvelle-Espagne et les peuples que les Espagnols appelaient Chichimèques, les Guachichiles, Zacatecos, Guamares et Pames du plateau aride situé au nord des anciennes terres aztèques, déclenchée par la découverte d’argent à Zacatecas en 1546 et par les routes, les villes minières et les razzias d’esclaves qui suivirent. À partir de 1550, des guerriers chichimèques attaquèrent les convois de chariots, les ranchs et les villes le long de la route de l’argent ; en 1561, ils avaient tué plus de 4 000 Espagnols et alliés. Ni une ligne de presidios ni la « guerre à feu et à sang » déclarée en 1567 ne les arrêtèrent, et les raids atteignirent leur paroxysme en 1575–1585. À partir de 1586, les vice-rois choisirent plutôt d’acheter la paix, avec des vivres, des vêtements, des outils et des terres, des missions et l’installation de familles tlaxcaltèques ; en 1590, les routes de Zacatecas furent déclarées sûres pour la première fois depuis quarante ans.
