# French translations of the catalogue text (wave 14); step bodies follow later.
Chickasaw Wars: Guerres chicachas
? Two French campaigns against the Chickasaw, whose towns stood near today’s Tupelo, Mississippi. The Chickasaw traded with the British of Carolina, raided French traffic on the Mississippi and had taken in Natchez refugees after the Natchez War, and Governor Jean-Baptiste Le Moyne de Bienville of Louisiana, encouraged by the Choctaw, set out to crush them. In 1736 two armies were to meet at the Chickasaw towns. The northern one, French troops and Illinois and other allied warriors from the Illinois country under Pierre d’Artaguiette, arrived first and attacked the village of Ogoula Tchetoka on 25 March 1736; it was routed, and d’Artaguiette, the Jesuit Antoine Sénat, François-Marie Bissot de Vincennes and other prisoners were burned to death. Bienville, coming up the Tombigbee from Mobile with about 1,200 French soldiers and Choctaw warriors, attacked the fortified town of Ackia on 26 May 1736 and was beaten off with heavy losses. In 1739 Bienville gathered a larger army, with troops and allied warriors from Canada and the Illinois country under Charles Le Moyne de Longueuil and Pierre-Joseph Céloron de Blainville, at Fort de l’Assomption on the Chickasaw Bluffs (today’s Memphis), but sickness and the impossibility of hauling his artillery through the forest stopped him, and in the spring of 1740 Céloron made a peace with the Chickasaw that left them undefeated. The Chickasaw remained allies of the British, and Choctaw and Chickasaw raids on each other went on until France left North America in 1763.
: Deux campagnes françaises contre les Chicachas, dont les villages se trouvaient près de l’actuelle Tupelo, dans le Mississippi. Les Chicachas commerçaient avec les Britanniques de la Caroline, attaquaient la navigation française sur le Mississippi et avaient accueilli des réfugiés natchez après la guerre des Natchez, et le gouverneur de la Louisiane, Jean-Baptiste Le Moyne de Bienville, encouragé par les Chactas, entreprit de les écraser. En 1736, deux armées devaient se rejoindre devant les villages chicachas. Celle du nord, formée de troupes françaises et de guerriers illinois et autres alliés du pays des Illinois sous les ordres de Pierre d’Artaguiette, arriva la première et attaqua le village d’Ogoula Tchetoka le 25 mars 1736 ; elle fut mise en déroute, et d’Artaguiette, le jésuite Antoine Sénat, François-Marie Bissot de Vincennes et d’autres prisonniers furent brûlés vifs. Bienville, qui remontait la Tombigbee depuis Mobile avec environ 1 200 soldats français et guerriers chactas, attaqua le village fortifié d’Ackia le 26 mai 1736 et fut repoussé avec de lourdes pertes. En 1739, Bienville rassembla au fort de l’Assomption, sur les Chickasaw Bluffs (l’actuelle Memphis), une armée plus nombreuse, avec des troupes et des guerriers alliés venus du Canada et du pays des Illinois sous les ordres de Charles Le Moyne de Longueuil et de Pierre-Joseph Céloron de Blainville, mais la maladie et l’impossibilité de faire passer son artillerie à travers la forêt l’arrêtèrent et, au printemps 1740, Céloron conclut avec les Chicachas une paix qui les laissait invaincus. Les Chicachas restèrent les alliés des Britanniques, et les raids que se livraient Chactas et Chicachas se poursuivirent jusqu’au départ de la France d’Amérique du Nord, en 1763.
