# French translations of the catalogue text (wave 13); step bodies follow later.
Chilembwe uprising: Soulèvement de Chilembwe
? A short armed rising against British colonial rule in the Nyasaland Protectorate (Malawi) in January 1915, led by the Baptist minister John Chilembwe. Educated in the United States, Chilembwe ran the Providence Industrial Mission at Mbombwe in the Shire Highlands, where he and a small African middle class of teachers, traders and farmers resented the colour bar, the hut tax and above all thangata, the system by which Africans living on European estates paid their rent in unpaid labour. The neighbouring A. L. Bruce estate at Magomero, whose manager William Jervis Livingstone had burned Chilembwe’s churches on estate land, was notorious for it. The outbreak of the First World War, in which Nyasaland’s Africans were recruited by the thousands as soldiers and porters against German East Africa and died in battle at Karonga, led Chilembwe to protest in the press and then to plan a rising. On the night of 23 January 1915 his followers attacked Magomero, killed Livingstone and two other European men, and spared the women and children; another party raided an armoury in Blantyre for weapons. The rising found little wider support. Troops of the King’s African Rifles and settler volunteers failed to take Mbombwe on 25 January but occupied it the next day, after the rebels had burned the Catholic mission at Nguludi. Chilembwe fled towards Mozambique and was shot by a police patrol on 3 February. About 40 of his followers were executed and some 300 imprisoned. The rising was largely forgotten under colonial rule, but since Malawi’s independence in 1964 Chilembwe has been honoured as a national hero; 15 January is John Chilembwe Day.
: Un bref soulèvement armé contre la domination coloniale britannique dans le protectorat du Nyassaland (Malawi) en janvier 1915, mené par le pasteur baptiste John Chilembwe. Formé aux États-Unis, Chilembwe dirigeait la Providence Industrial Mission à Mbombwe, dans les hautes terres du Shire, où lui-même et une petite classe moyenne africaine d’enseignants, de commerçants et d’agriculteurs supportaient mal la barrière de couleur, l’impôt sur les cases et surtout le thangata, le système par lequel les Africains vivant sur les domaines européens payaient leur loyer en travail non rémunéré. Le domaine voisin d’A. L. Bruce à Magomero, dont le gérant William Jervis Livingstone avait fait brûler les églises de Chilembwe bâties sur les terres du domaine, était tristement célèbre pour cette pratique. Le déclenchement de la Première Guerre mondiale, au cours de laquelle les Africains du Nyassaland furent recrutés par milliers comme soldats et porteurs contre l’Afrique orientale allemande et moururent au combat à Karonga, conduisit Chilembwe à protester dans la presse, puis à préparer un soulèvement. Dans la nuit du 23 janvier 1915, ses partisans attaquèrent Magomero, tuèrent Livingstone et deux autres hommes européens, et épargnèrent les femmes et les enfants ; un autre groupe attaqua une armurerie de Blantyre pour s’emparer d’armes. Le soulèvement ne trouva guère de soutien plus large. Les troupes des King’s African Rifles et des volontaires colons ne parvinrent pas à prendre Mbombwe le 25 janvier, mais l’occupèrent le lendemain, après que les rebelles eurent incendié la mission catholique de Nguludi. Chilembwe s’enfuit vers le Mozambique et fut abattu par une patrouille de police le 3 février. Environ 40 de ses partisans furent exécutés et quelque 300 emprisonnés. Le soulèvement fut largement oublié sous la domination coloniale mais, depuis l’indépendance du Malawi en 1964, Chilembwe est honoré comme un héros national ; le 15 janvier est la Journée John Chilembwe.
