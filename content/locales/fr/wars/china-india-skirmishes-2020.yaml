# French translations of the catalogue text (wave 8); step bodies follow later.
China–India border clashes of 2020–2021: Affrontements frontaliers sino-indiens de 2020–2021
? A military standoff along the Line of Actual Control (LAC), the undemarcated border between India and China in the Himalaya, in which soldiers of the two countries died in combat for the first time since 1975. In May 2020 Chinese troops moved into several areas in eastern Ladakh that both sides claimed and patrolled, and brawls broke out at the Pangong lake and in Sikkim. On the night of 15 June, in the Galwan valley, soldiers fought for hours with clubs, stones and rocks, since the two sides had agreed not to use firearms near the border; 20 Indian soldiers were killed, and China later acknowledged four dead. Both countries moved tens of thousands of troops, tanks and aircraft to the high plateau, India banned Chinese apps and curbed Chinese investment, and in late August Indian troops seized heights south of the Pangong lake, after which shots were fired for the first time in decades. Talks between corps commanders led to a pull-back from the Pangong area in February 2021, and from other friction points over the next years, with buffer zones in which neither side patrols.
: Une confrontation militaire le long de la ligne de contrôle effectif (LAC), la frontière non démarquée entre l’Inde et la Chine dans l’Himalaya, au cours de laquelle des soldats des deux pays moururent au combat pour la première fois depuis 1975. En mai 2020, des troupes chinoises pénétrèrent dans plusieurs zones de l’est du Ladakh que les deux camps revendiquaient et où ils patrouillaient, et des rixes éclatèrent au lac Pangong et au Sikkim. Dans la nuit du 15 juin, dans la vallée de la Galwan, des soldats se battirent pendant des heures avec des gourdins, des pierres et des rochers, les deux camps étant convenus de ne pas utiliser d’armes à feu près de la frontière ; 20 soldats indiens furent tués, et la Chine reconnut plus tard quatre morts. Les deux pays acheminèrent des dizaines de milliers de soldats, des chars et des avions sur le haut plateau, l’Inde interdit des applications chinoises et restreignit les investissements chinois, et à la fin d’août des troupes indiennes s’emparèrent de hauteurs au sud du lac Pangong, après quoi des coups de feu furent tirés pour la première fois depuis des décennies. Des pourparlers entre commandants de corps d’armée aboutirent à un retrait de la zone du Pangong en février 2021, puis d’autres points de friction au cours des années suivantes, avec des zones tampons où aucun des deux camps ne patrouille.
