# French translations of the catalogue text (wave 9); step bodies follow later.
Chinese Civil War (1927–1937): Guerre civile chinoise (1927–1937)
? "The first phase of the war between the Kuomintang’s Nationalist government and the Chinese Communist Party, from the Communists’ first armed risings in 1927 to the second united front against Japan in 1937. After the Kuomintang turned on its Communist allies in 1927, the Communists rose at Nanchang, in the Autumn Harvest Uprising and at Guangzhou, and were beaten; the survivors built rural bases, the largest in southern Jiangxi and western Fujian, where Mao Zedong and Zhu De formed the Red Army and the Chinese Soviet Republic was proclaimed at Ruijin in November 1931. Chiang Kai-shek’s government launched five encirclement campaigns against the Jiangxi base. The Red Army beat the first four, but the fifth, with about half a million men and lines of blockhouses, forced it to break out in October 1934 on the Long March: of about 86,000 who left Jiangxi, some 8,000 reached northern Shaanxi a year later, and the other Red armies followed in 1936. There, at Bao’an and Yan’an, Mao became the party’s leading figure. In December 1936 Chiang was seized at Xi’an by his own generals, who wanted an end to the civil war, and after Japan invaded in July 1937 the two parties formed a second united front; the Red Army became the Eighth Route Army and the New Fourth Army."
: "La première phase de la guerre entre le gouvernement nationaliste du Kuomintang et le Parti communiste chinois, des premiers soulèvements armés communistes de 1927 au second front uni contre le Japon en 1937. Après que le Kuomintang se fut retourné contre ses alliés communistes en 1927, les communistes prirent les armes à Nanchang, lors du soulèvement de la Moisson d’automne et à Canton, et furent battus ; les survivants bâtirent des bases rurales, dont la plus grande dans le sud du Jiangxi et l’ouest du Fujian, où Mao Zedong et Zhu De formèrent l’Armée rouge et où la République soviétique chinoise fut proclamée à Ruijin en novembre 1931. Le gouvernement de Tchang Kaï-chek lança cinq campagnes d’encerclement contre la base du Jiangxi. L’Armée rouge repoussa les quatre premières, mais la cinquième, menée avec environ un demi-million d’hommes et des lignes de blockhaus, la contraignit en octobre 1934 à percer l’encerclement et à entamer la Longue Marche : sur les quelque 86 000 personnes qui quittèrent le Jiangxi, environ 8 000 atteignirent le nord du Shaanxi un an plus tard, et les autres armées rouges suivirent en 1936. Là, à Bao’an et à Yan’an, Mao devint la figure dominante du parti. En décembre 1936, Tchang fut arrêté à Xi’an par ses propres généraux, qui voulaient mettre fin à la guerre civile et, après l’invasion japonaise de juillet 1937, les deux partis formèrent un second front uni ; l’Armée rouge devint la 8e armée de route et la Nouvelle 4e armée."
