# French translations of the catalogue text (wave 9); step bodies follow later.
Chinese Civil War (1945–1949): Guerre civile chinoise (1945–1949)
? The second phase of the war between the Nationalist government of the Kuomintang and the Chinese Communist Party, fought after the defeat of Japan. In August 1945 both sides raced to take over the territory Japan had held, and the Communists moved large forces into Manchuria, where the Soviet army had just driven out the Japanese. American mediation under George Marshall brought a ceasefire in January 1946, but fighting resumed in Manchuria in the spring, and in the summer of 1946 the war became general. The Nationalists, with far larger and better-equipped armies, took many cities, Yan’an among them, in 1946–1947. From mid-1947 the Communist People’s Liberation Army went over to the attack, and in three great campaigns in the autumn and winter of 1948–1949, Liaoshen, Huaihai and Pingjin, it destroyed the main Nationalist armies in Manchuria, on the plains north of Nanjing and around Beiping. In April 1949 it crossed the Yangtze and took Nanjing; Mao Zedong proclaimed the People’s Republic of China in Beijing on 1 October 1949, and on 7 December the Nationalist government moved to Taipei. By the end of 1949 the Republic of China held only Taiwan, Hainan and a few islands off the coast. The Nationalists lost an estimated 1.5–1.7 million men killed, wounded, captured or missing, and the People’s Liberation Army about 1.3 million, including some 260,000 killed; estimates of civilian deaths run from about 2.5 million upwards.
: La seconde phase de la guerre entre le gouvernement nationaliste du Kuomintang et le Parti communiste chinois, livrée après la défaite du Japon. En août 1945, les deux camps se hâtèrent de prendre possession des territoires que le Japon avait tenus, et les communistes envoyèrent d’importantes forces en Mandchourie, d’où l’armée soviétique venait de chasser les Japonais. La médiation américaine de George Marshall aboutit à un cessez-le-feu en janvier 1946, mais les combats reprirent en Mandchourie au printemps et, à l’été 1946, la guerre devint générale. Les nationalistes, dotés d’armées bien plus nombreuses et mieux équipées, prirent de nombreuses villes, dont Yan’an, en 1946–1947. À partir du milieu de 1947, l’Armée populaire de libération communiste passa à l’offensive et, lors de trois grandes campagnes à l’automne et à l’hiver 1948–1949, Liaoshen, Huaihai et Pingjin, elle anéantit les principales armées nationalistes en Mandchourie, dans les plaines au nord de Nankin et autour de Beiping. En avril 1949, elle franchit le Yangzi et prit Nankin ; Mao Zedong proclama la République populaire de Chine à Pékin le 1er octobre 1949 et, le 7 décembre, le gouvernement nationaliste s’installa à Taipei. À la fin de 1949, la République de Chine ne tenait plus que Taïwan, Hainan et quelques îles proches des côtes. Les nationalistes perdirent environ 1,5 à 1,7 million d’hommes tués, blessés, capturés ou disparus, et l’Armée populaire de libération environ 1,3 million, dont quelque 260 000 tués ; les estimations des morts civils s’élèvent à environ 2,5 millions au moins.
