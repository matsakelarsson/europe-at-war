# French translations of the catalogue text (wave 9); step bodies follow later.
Zhao Erfeng’s campaigns and the Chinese expedition to Tibet: Les campagnes de Zhao Erfeng et l’expédition chinoise au Tibet
The last Qing attempt to bring Tibet and the Tibetan lands of Kham under direct rule. After the British expedition to Lhasa in 1903–1904, the Qing court began to settle Chinese farmers and open mines in Kham. In April 1905 the people and monks of Batang rose and killed the assistant amban Feng Quan. Zhao Erfeng, sent from Sichuan, crushed the rising, besieged and destroyed the great monastery of Sampheling at Chatreng in 1906, and over the next five years abolished the Tibetan chiefdoms of Kham one by one, replacing them with Chinese counties. In 1909 a Sichuan army under Zhong Ying marched on Lhasa; it entered the city on 12 February 1910, and the 13th Dalai Lama fled to British India, where the Qing declared him deposed. Zhao’s troops took Chamdo and pushed into Pome and Zayul. After the Xinhai Revolution, revolutionaries in Chengdu executed Zhao in December 1911, and the Qing garrison in Lhasa fell apart.: La dernière tentative des Qing pour placer le Tibet et les terres tibétaines du Kham sous administration directe. Après l’expédition britannique à Lhassa de 1903–1904, la cour des Qing commença à installer des paysans chinois et à ouvrir des mines dans le Kham. En avril 1905, la population et les moines de Batang se soulevèrent et tuèrent l’amban adjoint Feng Quan. Zhao Erfeng, envoyé du Sichuan, écrasa le soulèvement, assiégea et détruisit le grand monastère de Sampheling à Chatreng en 1906 et, au cours des cinq années suivantes, abolit une à une les chefferies tibétaines du Kham, qu’il remplaça par des districts chinois. En 1909, une armée du Sichuan commandée par Zhong Ying marcha sur Lhassa ; elle entra dans la ville le 12 février 1910, et le 13e dalaï-lama s’enfuit en Inde britannique, où les Qing le déclarèrent déposé. Les troupes de Zhao prirent Chamdo et poussèrent jusqu’au Pome et au Zayul. Après la révolution Xinhai, des révolutionnaires de Chengdu exécutèrent Zhao en décembre 1911, et la garnison Qing de Lhassa se désagrégea.
