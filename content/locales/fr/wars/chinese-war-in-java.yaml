# French translations of the catalogue text (wave 11); step bodies follow later.
Batavia massacre and the Chinese War in Java: Massacre de Batavia et guerre des Chinois à Java
? The killing of the Chinese of Batavia by the Dutch East India Company (VOC) and its soldiers and auxiliaries in October 1740, and the war that followed across Central and East Java. Chinese sugar-mill workers around Batavia, threatened with deportation to Ceylon and hit by falling sugar prices, rose in early October 1740 and killed 50 Company soldiers. Rumours of a Chinese plot spread in the town, and from 9 to 22 October Company troops, sailors, militia and other townspeople killed the Chinese inside the walls; historians estimate at least 10,000 dead, and survivors at between 600 and about 3,400. Survivors under Khe Pandjang fled east, where the Chinese of the north coast rose under Singseh and were joined by Javanese lords and, from July 1741, by the court of Mataram under Pakubuwono II, which stormed the Company’s garrison at Kartasura. Semarang was besieged by about 3,500 Chinese and 20,000 Javanese, but Company reinforcements and Cakraningrat IV of Madura turned the tide. Pakubuwono II changed sides in 1742; the rebels proclaimed his nephew Raden Mas Garendi king and took Kartasura in June, until Cakraningrat retook it in December. By the treaty of November 1743 the restored Pakubuwono II ceded the north coast of Java, Madura and the east of the island to the Company, which never again faced a Javanese state it could not dominate.
: Le massacre des Chinois de Batavia par la Compagnie néerlandaise des Indes orientales (VOC), ses soldats et ses auxiliaires en octobre 1740, et la guerre qui s’ensuivit dans le centre et l’est de Java. Les ouvriers chinois des sucreries des environs de Batavia, menacés de déportation à Ceylan et frappés par la chute des prix du sucre, se soulevèrent début octobre 1740 et tuèrent 50 soldats de la Compagnie. Des rumeurs de complot chinois se répandirent dans la ville et, du 9 au 22 octobre, les troupes de la Compagnie, des marins, des miliciens et d’autres habitants tuèrent les Chinois qui vivaient à l’intérieur des murs ; les historiens estiment le nombre des morts à au moins 10 000, et celui des survivants entre 600 et environ 3 400. Des survivants menés par Khe Pandjang s’enfuirent vers l’est, où les Chinois de la côte nord se soulevèrent sous la conduite de Singseh et furent rejoints par des seigneurs javanais puis, à partir de juillet 1741, par la cour de Mataram sous Pakubuwono II, qui prit d’assaut la garnison de la Compagnie à Kartasura. Semarang fut assiégée par environ 3 500 Chinois et 20 000 Javanais, mais les renforts de la Compagnie et Cakraningrat IV de Madura renversèrent la situation. Pakubuwono II changea de camp en 1742 ; les rebelles proclamèrent roi son neveu Raden Mas Garendi et prirent Kartasura en juin, jusqu’à ce que Cakraningrat la reprenne en décembre. Par le traité de novembre 1743, Pakubuwono II, rétabli sur son trône, céda à la Compagnie la côte nord de Java, Madura et l’est de l’île ; la Compagnie ne se trouva plus jamais face à un État javanais qu’elle ne pût dominer.
