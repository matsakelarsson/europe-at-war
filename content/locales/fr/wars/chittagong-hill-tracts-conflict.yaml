# French translations of the catalogue text (wave 8); step bodies follow later.
Chittagong Hill Tracts conflict: Conflit des Chittagong Hill Tracts
The insurgency of the Jumma, the Buddhist, Hindu and Christian hill peoples of the Chittagong Hill Tracts in south-eastern Bangladesh, against the Bangladeshi state. The Chakma, Marma, Tripura and other peoples had lost much of their best land to the Kaptai dam in the 1960s, and after independence in 1971 Bangladesh refused their demand for autonomy. The Parbatya Chattagram Jana Samhati Samiti (PCJSS), led by Manabendra Narayan Larma, formed an armed wing, the Shanti Bahini (“peace force”), which began attacking the army in 1977. The government answered with a large military presence and by settling some 400,000 landless Bengalis in the hills, which led to clashes over land and to massacres of hill people by soldiers and settlers; the Shanti Bahini also attacked settlers. Tens of thousands of Jumma fled to India. Talks from the late 1980s led to the Chittagong Hill Tracts Peace Accord of 2 December 1997, under which the Shanti Bahini laid down its arms. Estimates of the dead range up to about 30,000.: L’insurrection des Jumma, les peuples montagnards bouddhistes, hindous et chrétiens des Chittagong Hill Tracts, dans le sud-est du Bangladesh, contre l’État bangladais. Les Chakma, les Marma, les Tripura et d’autres peuples avaient perdu une grande partie de leurs meilleures terres à cause du barrage de Kaptai dans les années 1960, et après l’indépendance de 1971 le Bangladesh rejeta leur revendication d’autonomie. Le Parbatya Chattagram Jana Samhati Samiti (PCJSS), dirigé par Manabendra Narayan Larma, constitua une branche armée, la Shanti Bahini (« force de paix »), qui commença à attaquer l’armée en 1977. Le gouvernement répondit par une forte présence militaire et en installant dans les collines quelque 400 000 Bengalis sans terre, ce qui entraîna des affrontements pour la terre et des massacres de montagnards par des soldats et des colons ; la Shanti Bahini attaqua elle aussi des colons. Des dizaines de milliers de Jumma s’enfuirent en Inde. Des pourparlers engagés à la fin des années 1980 aboutirent à l’accord de paix des Chittagong Hill Tracts du 2 décembre 1997, aux termes duquel la Shanti Bahini déposa les armes. Les estimations du nombre de morts vont jusqu’à environ 30 000.
