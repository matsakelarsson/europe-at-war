# French translations of the catalogue text (wave 8); step bodies follow later.
Chola expedition to the Ganges: Expédition chola vers le Gange
? The northern campaign of the Chola emperor Rajendra I, about 1019–1021, which took a Chola army through Kalinga and Odisha to Bengal and the Ganges. It grew out of a disputed succession in Vengi, where Rajendra backed his nephew Rajaraja Narendra against a rival supported by the kings of Kalinga and Odisha. While Rajendra waited on the Godavari, his general Araiyan Rajarajan led the army north, defeating the Somavamshi king Indraratha in Odisha, Dharmapala of Dandabhukti, Ranasura of southern Radha, Govindachandra of Vangala in eastern Bengal and the Pala king Mahipala I, and brought back water from the Ganges. The campaign won no lasting territory in the north, but Rajendra took the title Gangaikonda, “who took the Ganges”, built a new capital, Gangaikonda Cholapuram, and made a great tank there, the Cholagangam, which his inscriptions call a liquid pillar of victory. Some historians once read the expedition as a pilgrimage; the Chola records describe it as a war. It is known almost only from Chola inscriptions, above all the Tiruvalangadu copper plates.
: La campagne du Nord de l’empereur chola Rajendra Ier, vers 1019–1021, qui mena une armée chola à travers le Kalinga et l’Odisha jusqu’au Bengale et au Gange. Elle naquit d’une succession disputée au Vengi, où Rajendra soutenait son neveu Rajaraja Narendra contre un rival appuyé par les rois du Kalinga et de l’Odisha. Tandis que Rajendra attendait sur la Godavari, son général Araiyan Rajarajan mena l’armée vers le nord, battit le roi somavamshi Indraratha en Odisha, Dharmapala de Dandabhukti, Ranasura du Radha méridional, Govindachandra du Vangala, dans l’est du Bengale, et le roi pala Mahipala Ier, et rapporta de l’eau du Gange. La campagne ne procura aucun territoire durable dans le nord, mais Rajendra prit le titre de Gangaikonda, « celui qui prit le Gange », bâtit une nouvelle capitale, Gangaikonda Cholapuram, et y fit aménager un grand réservoir, le Cholagangam, que ses inscriptions appellent un pilier liquide de la victoire. Certains historiens ont jadis vu dans l’expédition un pèlerinage ; les sources chola la décrivent comme une guerre. On ne la connaît presque que par les inscriptions chola, avant tout les plaques de cuivre de Tiruvalangadu.
