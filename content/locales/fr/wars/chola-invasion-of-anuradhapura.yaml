# French translations of the catalogue text (wave 8); step bodies follow later.
Chola conquest of Anuradhapura: Conquête chola d’Anuradhapura
The conquest of northern Sri Lanka by the Chola Empire of southern India. In 993 the army of Rajaraja I crossed the Palk Strait while the Sinhalese king Mahinda V was struggling with a mutiny of his mercenaries, and sacked Anuradhapura, the island’s capital for more than a thousand years. The north became a Chola province governed from Polonnaruwa. In 1017 Rajaraja’s son Rajendra I invaded Ruhuna in the south-east, captured Mahinda V with his queen, his crown and his treasure, and took him to India, where he died in 1029. Anuradhapura was never a capital again, and the Cholas held the north until Vijayabahu I drove them out in 1070.: La conquête du nord du Sri Lanka par l’Empire chola de l’Inde du Sud. En 993, l’armée de Rajaraja Ier franchit le détroit de Palk alors que le roi cinghalais Mahinda V était aux prises avec une mutinerie de ses mercenaires, et mit à sac Anuradhapura, capitale de l’île depuis plus de mille ans. Le nord devint une province chola gouvernée depuis Polonnaruwa. En 1017, Rajendra Ier, fils de Rajaraja, envahit le Ruhuna, au sud-est, captura Mahinda V avec sa reine, sa couronne et son trésor, et l’emmena en Inde, où il mourut en 1029. Anuradhapura ne fut plus jamais une capitale, et les Chola tinrent le nord jusqu’en 1070, lorsque Vijayabahu Ier les en chassa.
