# French translations of the catalogue text (wave 8); step bodies follow later.
Chola invasion of Srivijaya: Invasion chola de Srivijaya
The overseas expedition of the Chola emperor Rajendra I against Srivijaya, the maritime power of Sumatra and the Malay Peninsula that controlled the Strait of Malacca. In 1025 a Chola fleet crossed the Bay of Bengal and attacked Srivijaya’s ports, from Kadaram (Kedah) in the north to the capital at Palembang in the south; the king, Sangrama Vijayottungavarman, was taken prisoner. The raid brought plunder and fame rather than lasting conquest, but it weakened Srivijaya, and Chola influence in the straits lasted for decades.: L’expédition outre-mer de l’empereur chola Rajendra Ier contre Srivijaya, la puissance maritime de Sumatra et de la péninsule Malaise qui contrôlait le détroit de Malacca. En 1025, une flotte chola traversa le golfe du Bengale et attaqua les ports de Srivijaya, de Kadaram (Kedah) au nord jusqu’à la capitale, Palembang, au sud ; le roi, Sangrama Vijayottungavarman, fut fait prisonnier. Le raid rapporta du butin et de la gloire plutôt qu’une conquête durable, mais il affaiblit Srivijaya, et l’influence chola dans les détroits se maintint pendant des décennies.
