# French translations of the catalogue text (wave 8); step bodies follow later.
Chola–Western Chalukya wars: Guerres entre Chola et Chalukya occidentaux
The wars of more than a century between the Chola Empire of the Tamil country and the Western Chalukyas of Kalyani in the Deccan. They fought over the rich lands of the Raichur Doab between the Krishna and the Tungabhadra, over Gangavadi in southern Karnataka, and above all over Vengi, the Eastern Chalukya kingdom in the Godavari and Krishna deltas. Chola armies sacked the Chalukya capitals Manyakheta (1007) and Kalyani (about 1045), and Chola kings won great battles at Koppam (1054), where the emperor Rajadhiraja I was killed, and at Kudal-Sangamam (about 1062). The Chalukyas held their ground in the Deccan, and under Vikramaditya VI took Vengi in about 1118. Neither side won lasting control, and the long war wore both empires down.: Les guerres, longues de plus d’un siècle, entre l’Empire chola du pays tamoul et les Chalukya occidentaux de Kalyani, dans le Dekkan. Ils se disputèrent les riches terres du Raichur Doab, entre la Krishna et la Tungabhadra, le Gangavadi, dans le sud du Karnataka, et surtout le Vengi, le royaume des Chalukya orientaux dans les deltas de la Godavari et de la Krishna. Les armées chola mirent à sac les capitales chalukya, Manyakheta (1007) et Kalyani (vers 1045), et les rois chola remportèrent de grandes batailles à Koppam (1054), où l’empereur Rajadhiraja Ier fut tué, et à Kudal-Sangamam (vers 1062). Les Chalukya tinrent bon dans le Dekkan et, sous Vikramaditya VI, prirent le Vengi vers 1118. Aucun des deux camps n’obtint de domination durable, et cette longue guerre épuisa les deux empires.
