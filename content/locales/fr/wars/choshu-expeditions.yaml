# French translations of the catalogue text (wave 10); step bodies follow later.
Kinmon incident and the Chōshū expeditions: Incident de Kinmon et expéditions contre Chōshū
? The armed struggle between the Tokugawa shogunate and the Chōshū domain in western Honshu that broke the shogunate’s authority. Chōshū, led by radical samurai of the “revere the emperor, expel the barbarians” movement, had dominated the imperial court in Kyoto until a coup by Aizu and Satsuma drove its men out in September 1863. On 20 August 1864 about 3,000 Chōshū troops and allied rōnin tried to retake Kyoto by force and were beaten at the gates of the imperial palace by Aizu, Satsuma and other domains; fire destroyed some 28,000 houses in the city. Branded an enemy of the court, Chōshū faced a shogunate army in the First Chōshū expedition, but through the mediation of Satsuma’s Saigō Takamori it submitted without a battle, putting three of its elders to death, and the army withdrew in January 1865. Within weeks Takasugi Shinsaku and his volunteer militias seized power in Chōshū, rearmed it with Western rifles and in March 1866 made a secret alliance with Satsuma. In the Second Chōshū expedition, which Chōshū calls the War on Four Borders, fighting began in July 1866. Chōshū’s modernised army of perhaps 3,500–4,000 men held off a much larger but poorly coordinated shogunate force on the island of Ōshima, on the Hiroshima border, in Iwami, where it took Hamada Castle, and across the strait at Kokura, whose garrison burned its castle and withdrew. The shogun Tokugawa Iemochi died in Osaka on 29 August, and his successor Tokugawa Yoshinobu agreed to a ceasefire in October. The shogunate’s failure to defeat a single domain showed the country that it could be overthrown, as it was in the Boshin War of 1868.
: La lutte armée entre le shogunat Tokugawa et le domaine de Chōshū, dans l’ouest de Honshu, qui brisa l’autorité du shogunat. Chōshū, mené par les samouraïs radicaux du mouvement « révérer l’empereur, expulser les barbares », avait dominé la cour impériale de Kyoto jusqu’à ce qu’un coup de force d’Aizu et de Satsuma en chasse ses hommes en septembre 1863. Le 20 août 1864, environ 3 000 soldats de Chōshū et des rōnin alliés tentèrent de reprendre Kyoto par la force et furent battus aux portes du palais impérial par Aizu, Satsuma et d’autres domaines ; un incendie détruisit quelque 28 000 maisons de la ville. Déclaré ennemi de la cour, Chōshū dut affronter une armée du shogunat lors de la première expédition contre Chōshū mais, grâce à la médiation de Saigō Takamori, du domaine de Satsuma, il se soumit sans combat en mettant à mort trois de ses anciens, et l’armée se retira en janvier 1865. En quelques semaines, Takasugi Shinsaku et ses milices de volontaires s’emparèrent du pouvoir à Chōshū, le réarmèrent de fusils occidentaux et, en mars 1866, conclurent une alliance secrète avec Satsuma. Lors de la seconde expédition contre Chōshū, que Chōshū appelle la guerre des Quatre Frontières, les combats commencèrent en juillet 1866. L’armée modernisée de Chōshū, forte de peut-être 3 500–4 000 hommes, tint en échec une force shogunale bien plus nombreuse mais mal coordonnée sur l’île d’Ōshima, à la frontière de Hiroshima, dans l’Iwami, où elle prit le château de Hamada, et de l’autre côté du détroit à Kokura, dont la garnison incendia son château et se retira. Le shogun Tokugawa Iemochi mourut à Osaka le 29 août, et son successeur Tokugawa Yoshinobu accepta un cessez-le-feu en octobre. L’incapacité du shogunat à vaincre un seul domaine montra au pays qu’il pouvait être renversé, comme il le fut lors de la guerre de Boshin en 1868.
