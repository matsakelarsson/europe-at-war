Cnut, Assandun and the North Sea empire: Cnut, Assandun et l’empire de la mer du Nord
1015–1035: 1015–1035
The Danish army chose Cnut as its king, but the English recalled Æthelred and drove him out. Cnut sailed for Denmark, leaving the mutilated hostages his father had taken on the beach at Sandwich. He returned in September 1015 with a great fleet and harried Dorset, Wiltshire and Somerset. Ealdorman Eadric Streona went over to him, and Wessex submitted. When Æthelred died in April 1016, the Londoners chose his son Edmund Ironside as king, while the leading men gathered at Southampton chose Cnut.: L’armée danoise choisit Cnut comme roi, mais les Anglais se souviendront d’Æthelred et le chasèrent. Cnut s’embarqua pour le Danemark, laissant les otages mutilés que son père avait pris sur la plage de Sandwich. Il retourna en septembre 1015 avec une grande flotte et harcela Dorset, Wiltshire et Somerset. Ealdorman Eadric Streona alla vers lui, et Wessex se présenta. Quand Æthelred mourut en avril 1016, les londoniens choisirent son fils Edmund Dacier comme roi, tandis que les principaux se rassemblèrent à Southampton pour choisir Cnut.
Edmund fought hard all summer. He fought the Danes at Penselwood and Sherston, relieved the siege of London and won at Brentford and Otford. But on 18 October 1016, at Assandun in Essex, Eadric withdrew his men in the middle of the battle and the English were routed. At Alney, an island near Deerhurst, the kings agreed that Edmund would keep Wessex and Cnut take the lands north of the Thames. Edmund died on 30 November, and Cnut became king of all England.: Il combattit les Danois à Penselwood et Sherston, souligna le siège de Londres et gagna à Brentford et à Otford. Mais, le 18 octobre 1016, à Assandun à Essex, Eadric retira ses hommes au milieu de la bataille et les Anglais furent chassés. À Alney, une île près de Deerhurst, les rois s’entendaient pour dire qu’Edmund garderait Wessex et Cnut prendre les terres au nord de la Tamise. Edmund mourut le 30 novembre, et Cnut devint roi de toute l’Angleterre.
Cnut married Æthelred’s widow, Emma of Normandy, and in 1018 raised a vast tax of £72,000, plus £10,500 from London, to pay off his fleet. He became king of Denmark after his brother Harald, beat the Norwegians and Swedes at the Helgeå, probably in 1026, and in 1028 drove Olaf Haraldsson out of Norway. When he died at Shaftesbury in 1035, his North Sea empire soon fell apart.: Cnut épousa la veuve d’Emma de Normandie et, en 1018, il obtint une énorme taxe de £72 000, plus £10 500 de Londres, pour payer sa flotte. Il devint roi du Danemark après son frère Harald, battit les Norvégiens et les Suédois à l’Helgeå, probablement en 1026, et en 1028 fit sortir Olaf Haraldsson de Norvège. Lorsqu'il mourut à Shaftesbury en 1035, son empire de la mer du Nord s’écroula bientôt.
