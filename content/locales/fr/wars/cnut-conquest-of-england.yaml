1013–1014: 1013–1014
For more than twenty years Viking armies had raided England and been paid ever larger sums of silver, the Danegeld, to leave. In 1002 King Æthelred ordered the killing of the Danes living in England, the St Brice’s Day massacre. Between 1009 and 1012 the army of Thorkell the Tall ravaged the south-east, took Canterbury and killed its archbishop, before Thorkell changed sides and entered Æthelred’s service.: Pendant plus de vingt ans, les armées vikings avaient attaqué l’Angleterre et reçu des sommes toujours plus grandes d’argent, le Danegeld, pour partir. Entre 1009 et 1012 l’armée de Thorkell le Tall a ravagé le sud-est, a pris Canterbury et tué son archevêque, avant que Thorkell change de côté et est entré dans le service d’Ethelred.
In August 1013 the Danish king, Sweyn Forkbeard, came with his son Cnut to conquer the country. He sailed up the Humber and the Trent to Gainsborough, where Northumbria, Lindsey and the Danish towns of the east Midlands submitted at once. Marching south, he took Oxford and Winchester. London, held by Æthelred and Thorkell, beat off his attack, but after the western thegns submitted at Bath, the Londoners gave in too. Æthelred fled to Normandy, and Sweyn was accepted as king. He died at Gainsborough on 3 February 1014.: En août 1013, le roi danois, Sweyn Forkbeard, vint avec son fils Cnut pour conquérir le pays. Il s’embarqua sur le Humber et le Trent jusqu’à Gainsborough, où Northumbria, Lindsey et les villes danoises des Midlands est se présentèrent à la fois. Marchant vers le sud, il prit Oxford et Winchester. Londres, tenu par Æthelred et Thorkell, a battu de son attaque, mais après les western thegns soumis à Bath, les Londoniens ont cédé aussi. Æthelred s’est enfui en Normandie, et Sweyn a été accepté comme roi. Il est mort à Gainsborough le 3 février 1014.
