Danish conquest of England: Conquête danoise de l’Angleterre
The conquest of England by the Danish king Sweyn Forkbeard in 1013 and, after his death, by his son Cnut in 1015–1016. Cnut’s victory at Assandun made him king of England, and later of Denmark and Norway, ruling a North Sea empire until 1035.: La conquête de l’Angleterre par le roi danois Sweyn Forkbeard en 1013 et, après sa mort, par son fils Cnut en 1015–1016. La victoire de Cnut à Assandun le fit roi d’Angleterre, puis du Danemark et de la Norvège, dirigeant un empire de la mer du Nord jusqu’en 1035.
The main English source is the Anglo-Saxon Chronicle; the Encomium Emmae Reginae, written for Cnut’s queen, gives a Danish-friendly account.: La principale source anglaise est la Chronique anglo-saxonne ; l’Encomium Emmae Reginae, écrit pour la reine Cnut.
The site of the Battle of Assandun is disputed. It is shown at Ashingdon in south-east Essex, the traditional identification; some historians prefer Ashdon in the north of the county.: Le site de la bataille d’Assandun est contesté. Il est montré à Ashingdon dans l’Essex du sud-est, l’identification traditionnelle ; certains historiens préfèrent Ashdon dans le nord du comté.
