# French translations of the catalogue text (wave 11); step bodies follow later.
Cochinchina campaign: Campagne de Cochinchine
? The war in which France, with Spanish help, took the southern provinces of Nguyễn Vietnam (Đại Nam) and founded the colony of Cochinchina. Napoleon III sent a French fleet under Admiral Rigault de Genouilly, citing the persecution of Catholic missionaries; Spain, whose bishop José María Díaz Sanjurjo had been executed in 1857, sent troops from the Philippines. The allies landed at Tourane (Đà Nẵng) in September 1858 but were held there by Nguyễn Tri Phương’s siege lines and by cholera, and turned south to take Saigon in February 1859. The small garrison of Saigon was itself besieged until Admiral Charner broke the Vietnamese lines at Kỳ Hòa in February 1861. Mỹ Tho, Biên Hòa and Vĩnh Long followed, and by the Treaty of Saigon (5 June 1862) Emperor Tự Đức ceded the provinces of Biên Hòa, Gia Định and Định Tường and the island of Poulo Condore, allowed Catholic worship and agreed to pay an indemnity. Local leaders such as Trương Định and Nguyễn Trung Trực fought on against the French, and in June 1867 Admiral de La Grandière took the three western provinces as well, completing French Cochinchina.
: La guerre par laquelle la France, avec l’aide de l’Espagne, s’empara des provinces méridionales du Vietnam des Nguyễn (Đại Nam) et fonda la colonie de Cochinchine. Napoléon III envoya une flotte française commandée par l’amiral Rigault de Genouilly en invoquant la persécution des missionnaires catholiques ; l’Espagne, dont l’évêque José María Díaz Sanjurjo avait été exécuté en 1857, envoya des troupes des Philippines. Les alliés débarquèrent à Tourane (Đà Nẵng) en septembre 1858, mais y furent bloqués par les lignes de siège de Nguyễn Tri Phương et par le choléra, et se tournèrent vers le sud pour prendre Saïgon en février 1859. La petite garnison de Saïgon fut à son tour assiégée jusqu’à ce que l’amiral Charner rompe les lignes vietnamiennes à Kỳ Hòa en février 1861. Suivirent Mỹ Tho, Biên Hòa et Vĩnh Long et, par le traité de Saïgon (5 juin 1862), l’empereur Tự Đức céda les provinces de Biên Hòa, de Gia Định et de Định Tường ainsi que l’île de Poulo Condore, autorisa le culte catholique et accepta de verser une indemnité. Des chefs locaux comme Trương Định et Nguyễn Trung Trực continuèrent à combattre les Français et, en juin 1867, l’amiral de La Grandière s’empara aussi des trois provinces occidentales, achevant ainsi la Cochinchine française.
