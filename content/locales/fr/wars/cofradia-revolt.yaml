# French translations of the catalogue text (wave 11); step bodies follow later.
Cofradía revolt (Hermano Pule): Révolte de la Cofradía (Hermano Pule)
? A religious brotherhood’s rising in Tayabas (now Quezon), crushed by Spanish troops in 1841. Apolinario de la Cruz, known as Hermano Pule, was born in Lucban in 1815 and was refused entry into the Dominican order in 1829 because he was an indio, a native Filipino. In December 1832 he founded the Cofradía de San José, a lay brotherhood open only to native Filipinos, which grew to some 4,500 to 5,000 members in Tayabas, Laguna and Batangas. The church and the colonial government refused to recognise it, saw it as a threat, and on 19 October 1840 raided a meeting and arrested 243 members; in July 1841 the governor-general outlawed it. Pule and about 4,000 followers gathered at Isabang, on the slopes of Mount San Cristóbal near Tayabas, and later moved to Alitao. On 23 October 1841 an attack led by the alcalde mayor of Tayabas, Joaquín Ortega, was beaten off and Ortega was killed. On 1 November Colonel Joaquín Huet attacked the camp at Alitao with 800 to 1,000 soldiers; in about four hours of fighting some 300 to 500 members of the brotherhood were killed and about 500 were taken prisoner. Pule was caught the next evening near Sariaya, tried summarily and shot at Tayabas on 4 November 1841, aged 26; his body was quartered and displayed. Spain’s Supreme Court later reprimanded Governor-General Marcelino de Oraá, and on 20 January 1843 soldiers of the Tayabas regiment, many of whom had relatives among the dead, rose in Manila under Sergeant Irineo Samaniego and seized Fort Santiago; they were overcome, and the survivors were executed at Bagumbayan two days later. Survivors of the brotherhood kept its devotions alive in the villages around Mount Banahaw.
: Le soulèvement d’une confrérie religieuse dans la province de Tayabas (aujourd’hui Quezon), écrasé par les troupes espagnoles en 1841. Apolinario de la Cruz, dit Hermano Pule, né à Lucban en 1815, se vit refuser en 1829 l’entrée dans l’ordre dominicain parce qu’il était un indio, un Philippin indigène. En décembre 1832, il fonda la Cofradía de San José, une confrérie laïque réservée aux Philippins indigènes, qui compta quelque 4 500 à 5 000 membres dans les provinces de Tayabas, de Laguna et de Batangas. L’Église et le gouvernement colonial refusèrent de la reconnaître et la considérèrent comme une menace ; le 19 octobre 1840, ils firent une descente dans une réunion et arrêtèrent 243 membres, et en juillet 1841 le gouverneur général la mit hors la loi. Pule et environ 4 000 fidèles se rassemblèrent à Isabang, sur les pentes du mont San Cristóbal, près de Tayabas, puis gagnèrent Alitao. Le 23 octobre 1841, une attaque menée par l’alcalde mayor de Tayabas, Joaquín Ortega, fut repoussée et Ortega fut tué. Le 1er novembre, le colonel Joaquín Huet attaqua le camp d’Alitao avec 800 à 1 000 soldats ; en quatre heures de combat environ, quelque 300 à 500 membres de la confrérie furent tués et environ 500 faits prisonniers. Pule fut capturé le lendemain soir près de Sariaya, jugé sommairement et fusillé à Tayabas le 4 novembre 1841, à l’âge de 26 ans ; son corps fut écartelé et exposé. Le Tribunal suprême d’Espagne réprimanda par la suite le gouverneur général Marcelino de Oraá et, le 20 janvier 1843, des soldats du régiment de Tayabas, dont beaucoup avaient des proches parmi les morts, se soulevèrent à Manille sous la conduite du sergent Irineo Samaniego et s’emparèrent du fort Santiago ; ils furent maîtrisés, et les survivants furent exécutés à Bagumbayan deux jours plus tard. Des survivants de la confrérie perpétuèrent ses dévotions dans les villages des environs du mont Banahaw.
