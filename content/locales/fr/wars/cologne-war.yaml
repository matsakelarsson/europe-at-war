# Some French text was translated automatically.
"Cologne War": "Guerre de Cologne"
? "A war over the Electorate of Cologne, set off when the Archbishop-Elector Gebhard Truchsess von Waldburg became a Protestant in December 1582, married Agnes von Mansfeld in February 1583 and tried to turn the archbishopric into a secular principality, against the ecclesiastical reservation of the Peace of Augsburg. The pope deposed him, and in May 1583 the cathedral chapter elected Ernest of Bavaria in his place. Gebhard was backed by John Casimir of the Palatinate and by Dutch and English help, Ernest by his brother Ferdinand’s Bavarian troops, the pope and, from 1586, the Spanish army of the Netherlands under the Duke of Parma. The Bavarians stormed and blew up Godesberg castle in late 1583 after sappers mined its walls, and in July 1586 Parma took and sacked Neuss. In 1588 Gebhard gave up and withdrew to Strasbourg, though his captains Adolf von Neuenahr and Martin Schenck fought on until they were killed in 1589. The war devastated the electorate and left it in Wittelsbach hands until 1761, strengthening the Catholic cause in north-west Germany."
: "Une guerre contre l’Électorat de Cologne, partit lorsque l’archevêque-électeur Gebhard Truchsess von Waldburg devint protestant en décembre 1582, épousa Agnes von Mansfeld en février 1583 et tenta de transformer l’archevêque en une principauté laïque, contre la réserve ecclésiastique de la Paix d’Augsbourg. Le pape l’a déposé, et en mai 1583 le chapitre de la cathédrale a élu Ernest de Bavière à sa place. Gebhard a été soutenu par John Casimir du Palatinat et par l’aide hollandaise et anglaise, Ernest par son frère Ferdinands les troupes bavaroises, le pape et, à partir de 1586, l’armée espagnole des Pays-Bas sous le duc de Parme. Les Bavarois ont pris l’assaut et fait exploser le château de Godesberg à la fin de 1583 après que les sapeurs aient exploité ses murs, et en juillet 1586 Parma a pris et renvoyé Neuss. En 1588 Gebhard a abandonné et se retire à Strasbourg, bien que ses capitaines Adolf von Neuenahr et Martin Schenck se battent jusqu’à ce qu’ils soient tués en 1589. La guerre a dévasté l’électorat et l’a laissé à Wittelsbach jusqu’en 1761, renforçant la cause catholique dans le nord-ouest de l’Allemagne."
"Also called the Seneschal’s War (Truchsessischer Krieg), after Gebhard’s hereditary title. It was fought alongside the Dutch Revolt, and the Spanish and Dutch armies went on fighting in the electorate for years afterwards; Rheinberg did not fall to the Spanish until 1590.": "Aussi appelé la guerre des Sénéchals (Truchsessischer Krieg), après le titre héréditaire Gebhard. Il a été combattu aux côtés de la Revolt néerlandaise, et les armées espagnoles et néerlandaises ont continué à se battre dans l’électorat pendant des années après ; Rheinberg n’est tombé à l’espagnol que 1590."
"Catholic territories adopted the Gregorian calendar in 1583–1584 and Protestant ones did not, so dates in the sources can differ by ten days.": "Les territoires catholiques ont adopté le calendrier grégorien en 1583-1584 et les protestants ne l’ont pas fait, de sorte que les dates dans les sources peuvent différer de dix jours."
