# French translations of the catalogue text (wave 14); step bodies follow later.
Colorado Coalfield War: Guerre des mines de charbon du Colorado
? "A strike that became an armed conflict in the southern Colorado coalfields of Huerfano and Las Animas counties. On 23 September 1913 some 10,000–12,000 coal miners, most of them immigrants from Italy, Greece, the Balkans and Mexico, struck the Colorado Fuel and Iron Company, owned largely by John D. Rockefeller Jr., and the smaller Rocky Mountain Fuel and Victor-American companies. Led by the United Mine Workers of America, they demanded recognition of the union, higher pay, an eight-hour day, the enforcement of Colorado’s mine-safety laws and the right to live and shop outside the company towns. Evicted from company housing, they and their families moved into tent colonies, the largest at Ludlow with about 1,200 people. The companies hired guards from the Baldwin–Felts Detective Agency, who patrolled in an armoured car, and from 28 October the Colorado National Guard was deployed. On 20 April 1914 Guardsmen and company guards attacked the Ludlow colony with machine guns and burned it: about twenty people died, among them the Greek strike leader Louis Tikas, shot while in the Guard’s custody, and two women and eleven children who suffocated in a pit dug under a burning tent. In the “Ten Days’ War” that followed, armed strikers attacked mines, company towns and guards along a front of some 360 km, from Trinidad in the south to Louisville north of Denver, until President Woodrow Wilson sent federal troops, who arrived at the end of April and disarmed both sides. Estimates of the dead in the whole conflict range from 69 to 199. The union ran out of money and ended the strike on 10 December 1914 without winning recognition; Rockefeller answered with a company-run employee representation plan. Ludlow became a symbol of the labour movement and is a National Historic Landmark."
: "Une grève qui tourna au conflit armé dans les bassins houillers du sud du Colorado, dans les comtés de Huerfano et de Las Animas. Le 23 septembre 1913, quelque 10 000 à 12 000 mineurs de charbon, pour la plupart des immigrés venus d’Italie, de Grèce, des Balkans et du Mexique, se mirent en grève contre la Colorado Fuel and Iron Company, détenue en grande partie par John D. Rockefeller Jr., et contre les compagnies plus petites Rocky Mountain Fuel et Victor-American. Menés par les United Mine Workers of America, ils réclamaient la reconnaissance du syndicat, des salaires plus élevés, la journée de huit heures, l’application des lois du Colorado sur la sécurité dans les mines et le droit de vivre et de faire leurs achats hors des villes de compagnie. Expulsés des logements de la compagnie, ils s’installèrent avec leurs familles dans des colonies de tentes, dont la plus grande, à Ludlow, comptait environ 1 200 personnes. Les compagnies engagèrent des gardes de l’agence de détectives Baldwin-Felts, qui patrouillaient à bord d’une voiture blindée, et à partir du 28 octobre la Garde nationale du Colorado fut déployée. Le 20 avril 1914, des gardes nationaux et des gardes des compagnies attaquèrent la colonie de Ludlow à la mitrailleuse et l’incendièrent : une vingtaine de personnes moururent, parmi lesquelles le dirigeant grec de la grève, Louis Tikas, abattu alors qu’il était aux mains de la Garde, ainsi que deux femmes et onze enfants asphyxiés dans une fosse creusée sous une tente en feu. Pendant la « guerre des Dix Jours » qui suivit, des grévistes armés attaquèrent mines, villes de compagnie et gardes sur un front de quelque 360 km, de Trinidad au sud à Louisville au nord de Denver, jusqu’à ce que le président Woodrow Wilson envoie des troupes fédérales, qui arrivèrent à la fin d’avril et désarmèrent les deux camps. Les estimations du nombre de morts pour l’ensemble du conflit vont de 69 à 199. À court d’argent, le syndicat mit fin à la grève le 10 décembre 1914 sans avoir obtenu sa reconnaissance ; Rockefeller répondit par un plan de représentation des employés géré par la compagnie. Ludlow devint un symbole du mouvement ouvrier et est classé National Historic Landmark."
