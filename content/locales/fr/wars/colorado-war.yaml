# French translations of the catalogue text (wave 14); step bodies follow later.
Colorado War: Guerre du Colorado
? The war of 1864–1865 on the central plains between the Southern Cheyenne, the Arapaho and their Lakota allies and the United States, Colorado’s volunteers and settlers, remembered above all for the Sand Creek massacre. The Pikes Peak gold rush of 1858–1859 brought tens of thousands of migrants onto the lands that the Treaty of Fort Laramie (1851) had recognised as Cheyenne and Arapaho, and by the Treaty of Fort Wise (1861) a few chiefs gave up most of it for a small reserve on the Arkansas, which many Cheyenne, above all the Dog Soldiers, rejected. In the spring of 1864 Colorado troops attacked Cheyenne camps, and that summer Cheyenne, Arapaho, Lakota, Kiowa and Comanche raids closed the roads to Denver. In September, after the Camp Weld council, the peace chiefs Black Kettle and Left Hand camped on Sand Creek near Fort Lyon, believing they were under the army’s protection. On 29 November 1864 Colonel John Chivington’s Colorado volunteers attacked the camp and killed between about 150 and 230 people by most estimates, most of them women, children and old men (the estimates range from about 70 to more than 600), and mutilated the dead. Congress and the army condemned the attack. The Cheyenne, Arapaho and Lakota answered by sacking Julesburg and raiding the Platte road in early 1865 before moving north to the Powder River, where General Patrick Connor’s expedition failed to defeat them. In October 1865 the southern chiefs signed the Treaty of the Little Arkansas, which promised reparations for Sand Creek that were never paid.
: La guerre de 1864–1865 qui opposa, dans les plaines centrales, les Cheyennes du Sud, les Arapahos et leurs alliés lakotas aux États-Unis, aux volontaires et aux colons du Colorado, et dont on retient avant tout le massacre de Sand Creek. La ruée vers l’or de Pikes Peak, en 1858–1859, amena des dizaines de milliers de migrants sur les terres que le traité de Fort Laramie (1851) avait reconnues aux Cheyennes et aux Arapahos, et par le traité de Fort Wise (1861), quelques chefs en cédèrent la plus grande partie contre une petite réserve sur l’Arkansas, ce que beaucoup de Cheyennes, surtout les Dog Soldiers, rejetèrent. Au printemps 1864, des troupes du Colorado attaquèrent des camps cheyennes et, cet été-là, des raids cheyennes, arapahos, lakotas, kiowas et comanches coupèrent les routes de Denver. En septembre, après le conseil de Camp Weld, les chefs de la paix Black Kettle et Left Hand établirent leur campement sur la Sand Creek, près de Fort Lyon, se croyant sous la protection de l’armée. Le 29 novembre 1864, les volontaires du Colorado du colonel John Chivington attaquèrent le camp et tuèrent entre 150 et 230 personnes environ selon la plupart des estimations, en majorité des femmes, des enfants et des vieillards (les estimations vont d’environ 70 à plus de 600), et mutilèrent les morts. Le Congrès et l’armée condamnèrent l’attaque. Les Cheyennes, les Arapahos et les Lakotas ripostèrent en mettant Julesburg à sac et en attaquant la route de la Platte au début de 1865, avant de partir vers le nord, jusqu’à la Powder River, où l’expédition du général Patrick Connor ne parvint pas à les vaincre. En octobre 1865, les chefs du Sud signèrent le traité de la Little Arkansas, qui promettait pour Sand Creek des réparations qui ne furent jamais versées.
