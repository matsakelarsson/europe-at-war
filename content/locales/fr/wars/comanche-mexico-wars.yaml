# French translations of the catalogue text (wave 14); step bodies follow later.
Comanche–Mexico Wars: Guerres comanches-mexicaines
? The long war of raids that the Comanche, with their Kiowa and Plains Apache (Kiowa Apache) allies, carried hundreds of kilometres into northern Mexico between Mexican independence and about 1870. Spain had made peace with the Comanche in 1785–1786 and kept it with trade and gifts, which independent Mexico could not afford. From the 1830s, when peace with the United States, the eastern nations and the Cheyenne and Arapaho secured their other borders, Comanche bands gathered each summer on the Red River and its tributaries and rode south in autumn, under what Texans called the Comanche Moon, in war parties of 200 to 800 men. They crossed the Rio Grande near the Big Bend, wintered with their families in the Bolsón de Mapimí and raided Chihuahua, Coahuila, Nuevo León, Durango, Tamaulipas and as far as Zacatecas, San Luis Potosí, Jalisco and Querétaro, taking horses and mules for markets in New Mexico and the United States and captives who were ransomed or brought into Comanche families. A careful but incomplete count by the historian Brian DeLay finds 44 raids of more than 100 men from 1831 to 1848, which killed 2,649 Mexicans and carried off 852 captives and more than 100,000 animals; at least 702 Comanche were killed. Mexican states answered with militias, presidios and bounties for scalps, and accused Texas and the United States of buying the stolen herds and selling the raiders guns. The devastation of the north weakened Mexico against the American invasion of 1846, and in the Treaty of Guadalupe Hidalgo (1848) the United States undertook to stop the raids, an obligation it did not meet and was released from in the Gadsden Purchase of 1853. Cholera in 1849, the decline of the bison and American settlement and campaigns in Texas reduced the raids from the mid-1850s, and the last known Comanche raid into Mexico took place in 1870.
: La longue guerre de raids que les Comanches, avec leurs alliés kiowas et apaches des plaines (Apaches kiowas), menèrent à des centaines de kilomètres à l’intérieur du nord du Mexique entre l’indépendance mexicaine et 1870 environ. L’Espagne avait fait la paix avec les Comanches en 1785–1786 et l’avait maintenue par le commerce et les présents, ce que le Mexique indépendant n’avait pas les moyens de faire. À partir des années 1830, lorsque la paix avec les États-Unis, les nations de l’Est, les Cheyennes et les Arapahos eut assuré leurs autres frontières, les bandes comanches se rassemblaient chaque été sur la Red River et ses affluents et chevauchaient vers le sud à l’automne, sous ce que les Texans appelaient la lune comanche, en partis de guerre de 200 à 800 hommes. Elles franchissaient le Rio Grande près du Big Bend, hivernaient avec leurs familles dans le Bolsón de Mapimí et attaquaient le Chihuahua, le Coahuila, le Nuevo León, le Durango, le Tamaulipas et jusqu’aux États de Zacatecas, de San Luis Potosí, de Jalisco et de Querétaro, s’emparant de chevaux et de mules destinés aux marchés du Nouveau-Mexique et des États-Unis, et de captifs qui étaient rançonnés ou intégrés à des familles comanches. Un décompte minutieux mais incomplet de l’historien Brian DeLay recense 44 raids de plus de 100 hommes entre 1831 et 1848, qui tuèrent 2 649 Mexicains et emmenèrent 852 captifs et plus de 100 000 animaux ; au moins 702 Comanches furent tués. Les États mexicains répondirent par des milices, des presidios et des primes pour les scalps, et accusèrent le Texas et les États-Unis d’acheter les troupeaux volés et de vendre des armes aux assaillants. La dévastation du Nord affaiblit le Mexique face à l’invasion américaine de 1846 et, par le traité de Guadalupe Hidalgo (1848), les États-Unis s’engagèrent à faire cesser les raids, une obligation qu’ils ne remplirent pas et dont ils furent déliés par l’achat Gadsden de 1853. Le choléra en 1849, le déclin des bisons, la colonisation américaine et les campagnes menées au Texas réduisirent les raids à partir du milieu des années 1850, et le dernier raid comanche connu au Mexique eut lieu en 1870.
