# French translations of the catalogue text (wave 11); step bodies follow later.
Communist insurgency in Malaysia: Insurrection communiste en Malaisie
? "The second armed struggle of the Malayan Communist Party (MCP), sometimes called the Second Malayan Emergency. After its defeat in the Malayan Emergency (1948–1960), the party’s army, the Malayan National Liberation Army, withdrew under Chin Peng to the jungle on the Thai side of the border, around Betong and Sadao. Encouraged by China, it resumed the war on 17 June 1968 with an ambush at Kroh–Betong that killed 17 members of the Malaysian security forces. It recruited among Chinese youth after the race riots of May 1969, broadcast from a radio station in southern China, and carried out ambushes along the border and bombings and assassinations in the towns: Inspector-General of Police Abdul Rahman Hashim was shot dead in Kuala Lumpur on 7 June 1974, and the National Monument was bombed on 26 August 1975. Purges of suspected government agents in 1970 split the party into three rival factions. Malaysia never declared a new emergency; it relied on its security and development programme (KESBAN), village guards, a special forces unit (VAT 69) and, from 1977, joint operations with Thailand. China’s support faded after it established relations with Malaysia in 1974. Talks mediated by Thailand ended the war: in two agreements signed at Hat Yai on 2 December 1989, the MCP agreed to end its armed struggle and disband its army, then about 1,200 strong. Figures commonly given are about 155 members of the security forces killed and 854 wounded, and some 212 guerrillas killed. Chin Peng was not allowed to return to Malaysia and died in Bangkok in 2013."
: "La seconde lutte armée du Parti communiste malais (PCM), parfois appelée second état d’urgence malais. Après sa défaite lors de l’état d’urgence malais (1948–1960), l’armée du parti, l’Armée de libération nationale malaise, s’était retirée sous la conduite de Chin Peng dans la jungle du côté thaïlandais de la frontière, autour de Betong et de Sadao. Encouragée par la Chine, elle reprit la guerre le 17 juin 1968 par une embuscade à Kroh–Betong qui tua 17 membres des forces de sécurité malaisiennes. Elle recruta parmi la jeunesse chinoise après les émeutes raciales de mai 1969, émit depuis une station de radio dans le sud de la Chine, et mena des embuscades le long de la frontière ainsi que des attentats à la bombe et des assassinats dans les villes : l’inspecteur général de la police Abdul Rahman Hashim fut abattu à Kuala Lumpur le 7 juin 1974, et le Monument national fut visé par un attentat à la bombe le 26 août 1975. Les purges d’agents présumés du gouvernement en 1970 scindèrent le parti en trois factions rivales. La Malaisie ne proclama jamais de nouvel état d’urgence ; elle s’appuya sur son programme de sécurité et de développement (KESBAN), sur des gardes villageois, sur une unité de forces spéciales (VAT 69) et, à partir de 1977, sur des opérations conjointes avec la Thaïlande. Le soutien de la Chine s’estompa après l’établissement de ses relations avec la Malaisie en 1974. Des pourparlers menés sous la médiation de la Thaïlande mirent fin à la guerre : par deux accords signés à Hat Yai le 2 décembre 1989, le PCM accepta de renoncer à la lutte armée et de dissoudre son armée, qui comptait alors environ 1 200 hommes. Les chiffres couramment avancés font état d’environ 155 membres des forces de sécurité tués et 854 blessés, et de quelque 212 guérilleros tués. Chin Peng ne fut pas autorisé à revenir en Malaisie et mourut à Bangkok en 2013."
