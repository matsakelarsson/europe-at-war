# French translations of the catalogue text (wave 11); step bodies follow later.
Communist insurgency in Thailand: Insurrection communiste en Thaïlande
? "The guerrilla war of the Communist Party of Thailand (CPT) against the Thai state. The party, founded in 1942 and banned under anti-communist laws, followed Mao Zedong’s line, broadcast from China and trained its cadres in China, North Vietnam and Laos. It dates its armed struggle from a clash with police at Na Bua in Nakhon Phanom province on 7 August 1965, “the day the guns spoke”. The war was fought above all in the poor north-east (Isan), in the northern hills among the Hmong and other highland peoples, around Phu Hin Rong Kla on the borders of Phitsanulok, Loei and Phetchabun, and in the south around Phatthalung and Surat Thani. The government, backed by American aid and advisers, answered with its Communist Suppression Operations Command, rural development and armed village scouts; in the “Red Drum” killings in Phatthalung in 1972, security forces burned suspected communists in oil drums, with estimates of the dead ranging from several hundred to about 3,000. After the massacre of students at Thammasat University in Bangkok on 6 October 1976 (46 dead by the official count) and the coup that followed, some 3,000 students and activists joined the party in the jungle, and its armed strength rose to perhaps 10,000–12,000. The movement then collapsed: after Vietnam’s invasion of Cambodia, China drew close to Thailand and closed the party’s radio station in 1979, Vietnam and Laos turned against its pro-Chinese leaders, and the students fell out with the party. Prime Minister Prem Tinsulanonda’s Order 66/2523 of April 1980 offered amnesty and a political path, thousands surrendered, and by 1983 the insurgency was over. Several thousand people were killed on both sides."
: "La guérilla du Parti communiste de Thaïlande (PCT) contre l’État thaïlandais. Le parti, fondé en 1942 et interdit en vertu des lois anticommunistes, suivait la ligne de Mao Zedong, émettait depuis la Chine et formait ses cadres en Chine, au Nord-Vietnam et au Laos. Il fait remonter sa lutte armée à un accrochage avec la police à Na Bua, dans la province de Nakhon Phanom, le 7 août 1965, « le jour où les fusils ont parlé ». La guerre se déroula surtout dans le Nord-Est pauvre (Isan), dans les collines du Nord parmi les Hmong et d’autres peuples montagnards, autour du Phu Hin Rong Kla, aux confins des provinces de Phitsanulok, de Loei et de Phetchabun, et dans le Sud autour de Phatthalung et de Surat Thani. Le gouvernement, soutenu par l’aide et les conseillers américains, répondit par son Commandement des opérations de répression du communisme, le développement rural et des scouts villageois armés ; lors des tueries des « fûts rouges » à Phatthalung en 1972, les forces de sécurité brûlèrent des communistes présumés dans des fûts de pétrole, et les estimations du nombre de morts vont de plusieurs centaines à environ 3 000. Après le massacre d’étudiants à l’université Thammasat de Bangkok le 6 octobre 1976 (46 morts selon le bilan officiel) et le coup d’État qui suivit, quelque 3 000 étudiants et militants rejoignirent le parti dans la jungle, et ses effectifs armés atteignirent peut-être 10 000 à 12 000 combattants. Le mouvement s’effondra ensuite : après l’invasion du Cambodge par le Vietnam, la Chine se rapprocha de la Thaïlande et ferma la station de radio du parti en 1979, le Vietnam et le Laos se retournèrent contre ses dirigeants prochinois, et les étudiants rompirent avec le parti. L’ordre 66/2523 du Premier ministre Prem Tinsulanonda, en avril 1980, offrit une amnistie et une voie politique, des milliers de combattants se rendirent, et en 1983 l’insurrection avait pris fin. Plusieurs milliers de personnes furent tuées dans les deux camps."
