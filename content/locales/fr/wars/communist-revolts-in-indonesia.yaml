# French translations of the catalogue text (wave 11); step bodies follow later.
Communist revolts in the Dutch East Indies: Révoltes communistes dans les Indes orientales néerlandaises
? Risings called by the Communist Party of Indonesia (PKI) against Dutch colonial rule in West Java in November 1926 and West Sumatra in January 1927. The party, founded in 1920 as one of the first communist parties in Asia, had grown among railway, port and plantation workers and in the villages of Banten and West Sumatra, and faced arrests and bans on its meetings. At a meeting at Prambanan in December 1925 its leaders decided on a revolution starting with strikes; Tan Malaka, the party’s representative abroad, opposed it as premature, and the plan was postponed and split the party. On the night of 12–13 November 1926 armed groups attacked the prison, the telephone exchange and police posts in Batavia and were dispersed by the morning; in Banten bands of several hundred men, many led by local religious teachers, killed the district head of Menes and several police officers, gathered at Labuan and held out in places until December, and there were smaller attacks in the Priangan and around Surakarta. In West Sumatra the rising began on the night of 31 December 1926 at Silungkang, near the coal mines of Sawahlunto, and was crushed within days. The colonial government arrested some 13,000 people. About 4,500 were sentenced to prison and a few to death, the party was banned in 1927, and from 1927 some 1,300 people judged dangerous were interned without trial at Boven-Digoel, a camp built for the purpose about 450 km up the Digul River in New Guinea.
: Des soulèvements lancés par le Parti communiste d’Indonésie (PKI) contre la domination coloniale néerlandaise à Java occidental en novembre 1926 et à Sumatra occidental en janvier 1927. Le parti, fondé en 1920 et l’un des premiers partis communistes d’Asie, s’était développé parmi les ouvriers des chemins de fer, des ports et des plantations et dans les villages de Banten et de Sumatra occidental, et se heurtait à des arrestations et à des interdictions de réunion. Lors d’une réunion à Prambanan en décembre 1925, ses dirigeants décidèrent d’une révolution qui commencerait par des grèves ; Tan Malaka, représentant du parti à l’étranger, s’y opposa, la jugeant prématurée, et le projet fut ajourné et divisa le parti. Dans la nuit du 12 au 13 novembre 1926, des groupes armés attaquèrent la prison, le central téléphonique et des postes de police à Batavia et furent dispersés au matin ; à Banten, des bandes de plusieurs centaines d’hommes, dont beaucoup étaient menées par des maîtres religieux locaux, tuèrent le chef du district de Menes et plusieurs policiers, se rassemblèrent à Labuan et tinrent par endroits jusqu’en décembre, et il y eut des attaques de moindre ampleur dans la Priangan et autour de Surakarta. À Sumatra occidental, le soulèvement commença dans la nuit du 31 décembre 1926 à Silungkang, près des mines de charbon de Sawahlunto, et fut écrasé en quelques jours. Le gouvernement colonial arrêta quelque 13 000 personnes. Environ 4 500 furent condamnées à la prison et quelques-unes à mort, le parti fut interdit en 1927 et, à partir de 1927, quelque 1 300 personnes jugées dangereuses furent internées sans procès à Boven-Digoel, un camp construit à cet effet à environ 450 km en amont sur la rivière Digul, en Nouvelle-Guinée.
