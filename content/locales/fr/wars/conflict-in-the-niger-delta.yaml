# French translations of the catalogue text (wave 13); step bodies follow later.
Conflict in the Niger Delta: Conflit dans le delta du Niger
? "Last updated 27 November 2026. The armed conflict over the oil wealth of the Niger Delta in southern Nigeria, where most of the country’s oil is pumped while many of the people, among them the Ijaw, Ogoni and others, live with oil spills, gas flaring and poverty. Peaceful protest in the 1990s was met with repression: the military government hanged the Ogoni writer Ken Saro-Wiwa and eight others in 1995, and soldiers destroyed the Ijaw town of Odi in 1999, killing scores, if not hundreds. In September 2004 Mujahid Dokubo-Asari’s Niger Delta People’s Volunteer Force (NDPVF), which fought rival militias around Port Harcourt and lived largely from stolen oil, declared “all-out war” on the state; from 2006 the Movement for the Emancipation of the Niger Delta (MEND) attacked pipelines and platforms and kidnapped more than 200 foreign oil workers, repeatedly forcing cuts in Nigeria’s oil output. After an army offensive in May 2009, President Umaru Yar’Adua offered an amnesty from 26 June 2009; some 30,000 fighters registered for stipends and training, among them leaders such as Government Ekpemupolo (Tompolo), whose firms were later paid to guard the pipelines, and violence fell sharply. In 2016 a new group, the Niger Delta Avengers, bombed pipelines and terminals and pushed output to its lowest level in decades before declaring a ceasefire in August. Since then oil theft, illegal refining and piracy have been the main problems, but attacks continued: in early 2025 pipelines were blown up in Rivers State, President Bola Tinubu declared a state of emergency there in March, saying its governor had done nothing to stop them, and in April MEND and another group claimed attacks on the main oil pipeline in Bayelsa State; on 15 June 2026 armed men attacked the Trans-Niger Pipeline at Odau in Rivers State. No one has published a reliable count of the dead; estimates run into the thousands."
: "Dernière mise à jour : 27 novembre 2026. Le conflit armé autour des richesses pétrolières du delta du Niger, dans le sud du Nigeria, où est extraite la plus grande partie du pétrole du pays, alors qu’une grande partie de la population, notamment les Ijaw et les Ogoni, vit avec les marées noires, le torchage du gaz et la pauvreté. Les manifestations pacifiques des années 1990 furent réprimées : le gouvernement militaire fit pendre l’écrivain ogoni Ken Saro-Wiwa et huit autres personnes en 1995, et des soldats détruisirent la ville ijaw d’Odi en 1999, tuant des dizaines, sinon des centaines de personnes. En septembre 2004, la Force des volontaires du peuple du delta du Niger (NDPVF) de Mujahid Dokubo-Asari, qui combattait des milices rivales autour de Port Harcourt et vivait en grande partie du pétrole volé, déclara une « guerre totale » à l’État ; à partir de 2006, le Mouvement pour l’émancipation du delta du Niger (MEND) attaqua des oléoducs et des plates-formes et enleva plus de 200 employés étrangers du secteur pétrolier, contraignant à plusieurs reprises le Nigeria à réduire sa production. Après une offensive de l’armée en mai 2009, le président Umaru Yar’Adua proposa une amnistie à partir du 26 juin 2009 ; quelque 30 000 combattants s’inscrivirent pour percevoir des allocations et suivre des formations, parmi lesquels des chefs comme Government Ekpemupolo (Tompolo), dont les entreprises furent plus tard payées pour surveiller les oléoducs, et la violence diminua fortement. En 2016, un nouveau groupe, les Vengeurs du delta du Niger, fit sauter des oléoducs et des terminaux et fit tomber la production à son plus bas niveau depuis des décennies avant de proclamer un cessez-le-feu en août. Depuis lors, le vol de pétrole, le raffinage illégal et la piraterie sont les principaux problèmes, mais les attaques se sont poursuivies : au début de 2025, des oléoducs ont été dynamités dans l’État de Rivers, où le président Bola Tinubu a décrété l’état d’urgence en mars, affirmant que le gouverneur n’avait rien fait pour empêcher ces attaques, et en avril le MEND et un autre groupe ont revendiqué des attaques contre le principal oléoduc de l’État de Bayelsa ; le 15 juin 2026, des hommes armés ont attaqué le Trans-Niger Pipeline à Odau, dans l’État de Rivers. Personne n’a publié de décompte fiable des morts ; les estimations se chiffrent en milliers."
