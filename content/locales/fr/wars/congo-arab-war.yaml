# French translations of the catalogue text (wave 13); step bodies follow later.
Congo Arab war: Guerre congo-arabe
? The war in which the Congo Free State of Leopold II destroyed the power of the Swahili-Arab traders in the eastern Congo. From the 1860s traders from Zanzibar’s sphere, led by Tippu Tip, had built a commercial empire in Maniema and on the upper Congo, based on ivory and on raids that took slaves and recruited soldiers, from towns such as Nyangwe, Kasongo and Stanley Falls. In 1887 Leopold made Tippu Tip governor of Stanley Falls for the Free State, but the two powers competed for the same ivory, and when Tippu Tip went back to Zanzibar in 1890 his son Sefu at Kasongo, his nephew Rashid at Stanley Falls and the Lake Tanganyika trader Rumaliza turned against the state. In 1892 the Free State officer Francis Dhanis defeated Tippu Tip’s former vassal Ngongo Lutete, who changed sides with his Tetela and Kusu warriors, and Sefu’s men killed the trader Arthur Hodister’s expedition. From November 1892 Dhanis’s Force Publique, a few dozen European officers with African regulars armed with modern rifles and thousands of African auxiliaries, drove Sefu back across the Lomami, took Nyangwe on 4 March and Kasongo on 22 April 1893, and relieved Stanley Falls. Rumaliza then came west with a large army and held the Free State off in fortified camps on the Luama River until November 1893; Sefu was killed in the fighting. On 14 January 1894 Dhanis stormed Rumaliza’s camps before Kabambare, and Rumaliza fled to German East Africa. The Free State presented the war in Europe as a crusade against the slave trade; historians see it above all as a war for ivory and territory, in which the Free State itself recruited soldiers through slave raids and its auxiliaries raided and killed on a large scale. It lost 16 European officers and NCOs; the African dead, soldiers, auxiliaries and civilians, are not known, with estimates running from tens of thousands to possibly more than 100,000.
: La guerre par laquelle l’État indépendant du Congo de Léopold II brisa la puissance des marchands swahili-arabes dans l’est du Congo. À partir des années 1860, des marchands issus de la sphère d’influence de Zanzibar, menés par Tippu Tip, avaient bâti un empire commercial au Maniema et sur le haut Congo, fondé sur l’ivoire et sur des razzias qui fournissaient esclaves et soldats, à partir de villes comme Nyangwe, Kasongo et Stanley Falls. En 1887, Léopold nomma Tippu Tip gouverneur de Stanley Falls pour le compte de l’État indépendant, mais les deux puissances convoitaient le même ivoire et, lorsque Tippu Tip rentra à Zanzibar en 1890, son fils Sefu à Kasongo, son neveu Rashid à Stanley Falls et Rumaliza, marchand du lac Tanganyika, se retournèrent contre l’État. En 1892, l’officier de l’État indépendant Francis Dhanis vainquit Ngongo Lutete, ancien vassal de Tippu Tip, qui changea de camp avec ses guerriers tetela et kusu, et les hommes de Sefu tuèrent les membres de l’expédition du marchand Arthur Hodister. À partir de novembre 1892, la Force publique de Dhanis, soit quelques dizaines d’officiers européens à la tête de réguliers africains armés de fusils modernes, et des milliers d’auxiliaires africains, repoussa Sefu au-delà du Lomami, prit Nyangwe le 4 mars et Kasongo le 22 avril 1893, et dégagea Stanley Falls. Rumaliza marcha alors vers l’ouest avec une grande armée et tint l’État indépendant en échec dans des camps fortifiés sur la Luama jusqu’en novembre 1893 ; Sefu fut tué dans les combats. Le 14 janvier 1894, Dhanis prit d’assaut les camps de Rumaliza devant Kabambare, et Rumaliza s’enfuit en Afrique orientale allemande. L’État indépendant présenta la guerre en Europe comme une croisade contre la traite ; les historiens y voient avant tout une guerre pour l’ivoire et le territoire, au cours de laquelle l’État indépendant recrutait lui-même des soldats par des razzias d’esclaves et ses auxiliaires pillaient et tuaient à grande échelle. Il perdit 16 officiers et sous-officiers européens ; le nombre des morts africains, soldats, auxiliaires et civils, n’est pas connu, les estimations allant de plusieurs dizaines de milliers à peut-être plus de 100 000.
