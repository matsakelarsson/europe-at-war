# French translations of the catalogue text (wave 13); step bodies follow later.
Congo Crisis: Crise congolaise
? The political crisis and wars that followed the independence of the Belgian Congo on 30 June 1960. Within a week the soldiers of the Force Publique rose against their Belgian officers, Belgium sent troops to protect its citizens without the new government’s consent, and the mineral-rich province of Katanga under Moïse Tshombe, backed by Belgian officers and mining interests, declared independence; South Kasai followed in August. Prime Minister Patrice Lumumba asked the United Nations for help and then the Soviet Union, and was dismissed by President Joseph Kasa-Vubu, removed by the army chief Joseph-Désiré Mobutu, handed to the Katangese and killed on 17 January 1961 with Belgian officers present. His followers set up a rival government in Stanleyville. The UN force (ONUC), up to about 20,000 troops, ended Katanga’s secession in January 1963 after three rounds of fighting. Risings by Lumumba’s followers in 1964 (the Simba rebellion) were put down by the army, white mercenaries and a Belgian–American airborne operation, and on 25 November 1965 Mobutu took power in a coup. Some 100,000 people are estimated to have died.
: La crise politique et les guerres qui suivirent l’indépendance du Congo belge, le 30 juin 1960. En moins d’une semaine, les soldats de la Force publique se soulevèrent contre leurs officiers belges, la Belgique envoya des troupes pour protéger ses ressortissants sans l’accord du nouveau gouvernement, et la province du Katanga, riche en minerais, dirigée par Moïse Tshombe et soutenue par des officiers belges et des intérêts miniers, proclama son indépendance ; le Sud-Kasaï suivit en août. Le Premier ministre Patrice Lumumba demanda l’aide des Nations unies, puis celle de l’Union soviétique ; révoqué par le président Joseph Kasa-Vubu, écarté par le chef de l’armée Joseph-Désiré Mobutu, il fut livré aux Katangais et tué le 17 janvier 1961 en présence d’officiers belges. Ses partisans formèrent un gouvernement rival à Stanleyville. La force de l’ONU (ONUC), qui compta jusqu’à environ 20 000 hommes, mit fin à la sécession du Katanga en janvier 1963 après trois séries de combats. Les soulèvements des partisans de Lumumba en 1964 (rébellion simba) furent réprimés par l’armée, des mercenaires blancs et une opération aéroportée belgo-américaine et, le 25 novembre 1965, Mobutu prit le pouvoir par un coup d’État. On estime à quelque 100 000 le nombre de morts.
