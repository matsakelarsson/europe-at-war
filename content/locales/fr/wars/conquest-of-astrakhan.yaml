"Russian conquest of Astrakhan": "La conquête russe d’Astrakhan"
"Ivan IV’s conquest of the Astrakhan khanate at the mouth of the Volga, two years after the fall of Kazan. In 1554 a Russian river army took Astrakhan without a fight and made Dervish Ali khan; when he broke with Moscow and turned to the Crimean Tatars, a small force of Cossacks and streltsy took the city again in 1556 and the khanate was annexed, giving Russia the whole course of the Volga to the Caspian Sea.": "Ivan IV, la conquête du khanate d’Astrakhan à l’embouchure de la Volga, deux ans après la chute de Kazan. En 1554, une armée de la rivière russe prit Astrakhan sans se battre et fit Dervish Ali khan ; quand il rompit avec Moscou et se tourna vers les Tatars de Crimée, une petite force de Cosaques et de streltsy reprenèrent la ville en 1556 et le khanate fut annexé, donnant à la Russie tout le cours de la Volga à la mer Caspienne."
