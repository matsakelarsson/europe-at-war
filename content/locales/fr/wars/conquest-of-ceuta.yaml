"Conquest of Ceuta": "Conquête de Ceuta"
"The Portuguese capture of Ceuta, a Marinid port on the African shore of the Strait of Gibraltar, often taken as the start of Portugal’s overseas expansion. John I prepared the expedition in secret, letting rumours spread that it was aimed at Holland. A fleet of about 200 ships sailed from Lisbon on 25 July 1415, and on 21 August the army, with the king’s sons Duarte, Pedro and Henry (later called the Navigator), stormed the city in a single day; its governor, Salah ibn Salah, fled. The princes were knighted in the city’s mosque, made a church. Ceuta held out against Marinid and Granadan sieges, but a Portuguese attack on Tangier in 1437 failed. The city stayed Portuguese until it passed to Spain in 1668.": "La capture portugaise de Ceuta, un port Marinid sur la rive africaine du détroit de Gibraltar, souvent pris comme le début de l’expansion du Portugal outre-mer. John Ier préparé l’expédition en secret, laissant les rumeurs se répandre qu’il était destiné à Hollande. Une flotte d’environ 200 navires a navigué de Lisbonne le 25 juillet 1415, et le 21 août l’armée, avec les fils du roi Duarte, Pedro et Henry (plus tard appelé le Navigator), a pris la ville en une seule journée ; son gouverneur, Salah ibn Salah, s’est enfui. Ceuta assiégea Marinid et Granada, mais une attaque portugaise contre Tanger en 1437 échoua. La ville resta portugaise jusqu’à ce qu’elle passe en Espagne en 1668."
"The main account is the chronicle of Gomes Eanes de Zurara, written about four decades later. Estimates of the Portuguese force range up to some 20,000 soldiers, but the sources are uncertain.": "Le récit principal est la chronique de Gomes Eanes de Zurara, écrite environ quatre décennies plus tard. Les estimations de la force portugaise vont jusqu’à quelque 20 000 soldats, mais les sources sont incertaines."
