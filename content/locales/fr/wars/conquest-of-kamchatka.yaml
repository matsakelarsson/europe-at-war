# French translations of the catalogue text (wave 9); step bodies follow later.
Russian conquest of Kamchatka: Conquête russe du Kamtchatka
? "The Russian conquest of the Kamchatka peninsula and the resistance of its peoples, the Itelmens (Kamchadals) and the Koryaks. In 1697 Vladimir Atlasov, commander of the fort of Anadyrsk, led about 65 Cossacks and 60 Yukaghirs south across the Koryak lands, killed about 150 Koryaks who had taken his reindeer, reached the Kamchatka river and claimed the peninsula for the tsar. Forts followed at Verkhnekamchatsk, Nizhnekamchatsk and Bolsheretsk (1703). Cossack demands for fur tribute (yasak), hostage-taking and the enslavement of Itelmens brought repeated risings: Koryaks killed tribute collectors in 1706, rebellious Cossacks of his own command killed Atlasov at Nizhnekamchatsk in 1711, and Itelmens and Koryaks burned the Cossack leader Danila Antsiferov to death in 1712. By 1715 the crown had lost five years of tribute and at least 200 Russians. The largest rising came in 1731, when Itelmens led by the baptised Fyodor Kharchin seized Nizhnekamchatsk. Survivors reached a Russian ship bound for the Anadyr, whose crew landed with cannon and retook the fort, which burned when its powder store exploded; the Cossacks killed their prisoners. Kharchin was captured about a month later, and some of his followers killed themselves and their families rather than surrender. Kamchatka was then put under Okhotsk, and an inquiry under Dmitry Pavlutsky and his fellow officer Merlin (1733–1739) punished Russians and Itelmens alike. War, flight and above all epidemics, smallpox in 1768–1769 worst of all, cut the Itelmens from about 12,000–13,000 people in the late 17th century to fewer than 2,000 by 1827."
: "La conquête russe de la péninsule du Kamtchatka et la résistance de ses peuples, les Itelmènes (Kamtchadales) et les Koriaks. En 1697, Vladimir Atlassov, commandant du fort d’Anadyrsk, conduisit vers le sud, à travers les terres koriakes, environ 65 Cosaques et 60 Youkaguirs, tua environ 150 Koriaks qui lui avaient pris ses rennes, atteignit le fleuve Kamtchatka et revendiqua la péninsule pour le tsar. Des forts suivirent à Verkhnekamtchatsk, Nijnekamtchatsk et Bolcheretsk (1703). Les exigences cosaques en tribut de fourrures (iassak), les prises d’otages et la réduction en esclavage d’Itelmènes provoquèrent des soulèvements répétés : des Koriaks tuèrent des collecteurs de tribut en 1706, des Cosaques révoltés placés sous son propre commandement tuèrent Atlassov à Nijnekamtchatsk en 1711, et des Itelmènes et des Koriaks firent périr par le feu le chef cosaque Danila Antsiferov en 1712. En 1715, la Couronne avait perdu cinq années de tribut et au moins 200 Russes. Le plus grand soulèvement eut lieu en 1731, lorsque des Itelmènes menés par Fiodor Khartchine, un baptisé, s’emparèrent de Nijnekamtchatsk. Des survivants gagnèrent un navire russe en partance pour l’Anadyr, dont l’équipage débarqua avec des canons et reprit le fort, qui brûla lorsque sa poudrière explosa ; les Cosaques tuèrent leurs prisonniers. Khartchine fut capturé environ un mois plus tard, et certains de ses partisans tuèrent leurs familles et se donnèrent la mort plutôt que de se rendre. Le Kamtchatka fut alors placé sous l’autorité d’Okhotsk, et une enquête menée par Dmitri Pavloutski et son collègue officier Merlin (1733–1739) punit indistinctement Russes et Itelmènes. La guerre, la fuite et surtout les épidémies, au premier rang desquelles la variole de 1768–1769, firent tomber le nombre des Itelmènes d’environ 12 000–13 000 personnes à la fin du XVIIe siècle à moins de 2 000 en 1827."
