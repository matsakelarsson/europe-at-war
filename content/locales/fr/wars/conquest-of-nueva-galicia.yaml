# French translations of the catalogue text (wave 14); step bodies follow later.
Conquest of Nueva Galicia: Conquête de la Nouvelle-Galice
? Nuño Beltrán de Guzmán’s campaign of conquest in western Mexico, in what are now Michoacán, Jalisco, Nayarit, Zacatecas and Sinaloa. Guzmán, president of the first Audiencia of Mexico and a rival of Hernán Cortés, left Mexico City on 21 December 1529 with 300 to 400 Spaniards and between 5,000 and 8,000 Indigenous auxiliaries, Mexica, Tlaxcalans and others, many of them pressed into service. In Michoacán he had the Purépecha king Tangáxuan II tortured and burned (14 February 1530), then crossed the Lerma into lands of small independent lordships of many languages, the Tecuexe, Coca, Caxcanes, Cora, Totorame, Tahue and others. Some received him peacefully and others fought, as at Tonalá in March 1530, in Nayarit and on the coast of Sinaloa; his men seized food, burned towns, tortured lords for gold that was rarely there and took thousands of people as slaves. Guzmán reached Culiacán, where he founded San Miguel de Culiacán in September 1531, and the expedition also founded Compostela, Chiametla and, in 1532, the first Guadalajara, near Nochistlán. He wanted to call the province Mayor España; the crown named it Nueva Galicia. The bishop of Mexico, Juan de Zumárraga, denounced the campaign, Guzmán lost his offices in the mid-1530s and was arrested in 1537, and modern historians have called his expedition one of the most brutal of the conquest. The seizure of land and labour and the slave raids that followed it led to the Mixtón War of 1540–1542.
: "La campagne de conquête menée par Nuño Beltrán de Guzmán dans l’ouest du Mexique, dans les actuels États de Michoacán, Jalisco, Nayarit, Zacatecas et Sinaloa. Guzmán, président de la première Audiencia de Mexico et rival d’Hernán Cortés, quitta Mexico le 21 décembre 1529 avec 300 à 400 Espagnols et entre 5 000 et 8 000 auxiliaires autochtones, Mexicas, Tlaxcaltèques et autres, dont beaucoup avaient été enrôlés de force. Dans le Michoacán, il fit torturer et brûler le roi purépecha Tangáxuan II (14 février 1530), puis franchit le Lerma et pénétra sur les terres de petites seigneuries indépendantes parlant de nombreuses langues : les Tecuexe, Coca, Caxcanes, Cora, Totorame, Tahue et d’autres. Certains l’accueillirent pacifiquement, d’autres combattirent, comme à Tonalá en mars 1530, dans le Nayarit et sur la côte du Sinaloa ; ses hommes saisirent des vivres, incendièrent des villes, torturèrent des seigneurs pour leur arracher un or qu’ils possédaient rarement et réduisirent des milliers de personnes en esclavage. Guzmán atteignit Culiacán, où il fonda San Miguel de Culiacán en septembre 1531, et l’expédition fonda aussi Compostela, Chiametla et, en 1532, la première Guadalajara, près de Nochistlán. Il voulait appeler la province Mayor España ; la Couronne la nomma Nueva Galicia (Nouvelle-Galice). L’évêque de Mexico, Juan de Zumárraga, dénonça la campagne ; Guzmán perdit ses charges au milieu des années 1530 et fut arrêté en 1537, et les historiens modernes ont qualifié son expédition de l’une des plus brutales de la conquête. La mainmise sur les terres et la main-d’œuvre et les razzias d’esclaves qui suivirent provoquèrent la guerre des Mixtón de 1540–1542."
