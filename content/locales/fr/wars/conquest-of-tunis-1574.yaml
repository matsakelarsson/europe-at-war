# French translations of the catalogue text (wave 12); step bodies follow later.
Conquest of Tunis (1574): Conquête de Tunis (1574)
? The Ottoman capture of La Goulette and Tunis in 1574, which ended both Spain’s forty-year hold on La Goulette and the Hafsid dynasty that had ruled Tunis since the 13th century. Uluç Ali, the Ottoman governor of Algiers, had taken Tunis in 1569–1570; after Lepanto, Don John of Austria retook it without a fight in October 1573 and set up the Hafsid prince Muhammad as a Spanish client, leaving garrisons in La Goulette and in a new, unfinished fort beside Tunis. In July 1574 Sultan Selim II sent a fleet of about 230–300 galleys under Kılıç Ali Pasha (Uluç Ali) and Koca Sinan Pasha, with troops from Algiers, Tripoli and the Tunisian interior. La Goulette, held by about 7,000 men, was stormed on 24 August, and the fort at Tunis surrendered on 13 September after repeated assaults. Most of the defenders died; the survivors went to the galleys or to captivity in Istanbul, and so did Muhammad, the last Hafsid. Don John’s attempts at relief were defeated by storms and lack of money. Tunis became an Ottoman province, and the frontier between the Habsburg and Ottoman Mediterranean settled into the line it kept for two centuries.
: La prise de La Goulette et de Tunis par les Ottomans en 1574, qui mit fin à la fois à la mainmise espagnole de quarante ans sur La Goulette et à la dynastie hafside, qui régnait sur Tunis depuis le XIIIe siècle. Uluç Ali, gouverneur ottoman d’Alger, avait pris Tunis en 1569–1570 ; après Lépante, don Juan d’Autriche la reprit sans combat en octobre 1573 et y installa le prince hafside Muhammad comme client de l’Espagne, en laissant des garnisons à La Goulette et dans un nouveau fort inachevé, à côté de Tunis. En juillet 1574, le sultan Sélim II envoya une flotte d’environ 230 à 300 galères sous Kılıç Ali Pacha (Uluç Ali) et Koca Sinan Pacha, avec des troupes d’Alger, de Tripoli et de l’intérieur tunisien. La Goulette, tenue par environ 7 000 hommes, fut prise d’assaut le 24 août, et le fort de Tunis se rendit le 13 septembre après des assauts répétés. La plupart des défenseurs périrent ; les survivants furent envoyés aux galères ou en captivité à Istanbul, tout comme Muhammad, le dernier Hafside. Les tentatives de secours de don Juan furent mises en échec par les tempêtes et le manque d’argent. Tunis devint une province ottomane, et la frontière entre la Méditerranée des Habsbourg et celle des Ottomans se fixa sur la ligne qu’elle allait garder pendant deux siècles.
