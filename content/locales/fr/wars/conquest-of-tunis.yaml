"June–September 1535": "juin–septembre 1535"
"Hayreddin Barbarossa, the corsair ruler of Algiers whom Suleiman had made admiral of the Ottoman fleet, raided the coasts of Italy in 1534 and on 16 August took Tunis from its Hafsid sultan, Muley Hasan. From there his galleys could close the narrows between Sicily and Africa. Charles V decided to lead a crusade against him in person. A fleet of several hundred ships carrying about 30,000 soldiers gathered from Spain, Genoa under Andrea Doria, Naples, Sicily, Portugal, the Papal States and the Knights of St John; Francis I of France, then seeking an Ottoman alliance, refused to help. The fleet assembled at Cagliari and landed near the ruins of Carthage in mid-June.": "Hayreddin Barbarossa, le chef corsaire d’Alger que Suleiman avait fait amiral de la flotte ottomane, a attaqué les côtes de l’Italie en 1534 et le 16 août a pris Tunis de son sultan hafside, Muley Hasan. De là ses galères pourraient fermer les étroites entre la Sicile et l’Afrique. Charles V a décidé de mener une croisade contre lui en personne. Une flotte de plusieurs centaines de navires transportant environ 30 000 soldats s’est rassemblée d’Espagne, Gênes sous Andrea Doria, Naples, Sicile, Portugal, les Etats Pontificaux et les Chevaliers de Saint-Jean ; François Ier de France, alors à la recherche d’une alliance ottomane, a refusé d’aider."
"La Goulette, the fortress guarding the channel into the lagoon of Tunis, was stormed on 14 July after a month’s siege, and most of Barbarossa’s fleet was taken in the lagoon. As the army marched on Tunis on 21 July, thousands of Christian captives broke out of the kasbah and seized it, and Barbarossa fled to Bône. Charles’s troops then sacked the city, killing many thousands of its people, perhaps 10,000 or more, and enslaving others. Muley Hasan was restored as a vassal of Spain, which kept a garrison in La Goulette. In September Barbarossa struck back by sacking Mahón on Minorca.": "La Goulette, forteresse qui gardait le canal dans la lagune de Tunis, fut envahie le 14 juillet après un mois de siège, et la plupart de la flotte de Barbarossa fut prise dans la lagune. Pendant que l’armée marchait sur Tunis le 21 juillet, des milliers de prisonniers chrétiens éclatèrent de la kasbah et la saisirent, et Barbarossa s’enfuit à Bône. Les troupes de Charles ont ensuite saccagé la ville, tuant des milliers de personnes, peut-être 10 000 ou plus, et en asservissant d’autres. Muley Hasan a été restauré comme un vassal d’Espagne, qui gardait une garnison à La Goulette."
