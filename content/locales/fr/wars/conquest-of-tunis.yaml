# Some French text was translated automatically.
"Conquest of Tunis": "Conquête de Tunis"
"Emperor Charles V’s expedition against Tunis, which the Ottoman admiral and corsair Hayreddin Barbarossa had seized from its Hafsid sultan in 1534. A fleet from Spain, Genoa, Portugal, the papacy, the Hospitallers and Charles’s Italian kingdoms took the fortress of La Goulette and Tunis in July 1535, sacked the city and restored the Hafsid Muley Hasan as a Spanish vassal, but Barbarossa escaped.": "L’Empereur Charles Vês expédition contre Tunis, que l’amiral ottoman et corsaire Hayreddin Barbarossa avait saisi de son sultan hafside en 1534. Une flotte d’Espagne, Gênes, Portugal, la papauté, les Hospitaliers et les Charles-Charless italiens ont pris la forteresse de La Goulette et Tunis en juillet 1535, saccagé la ville et restauré le Hafsid Muley Hasan comme un vassal espagnol, mais Barbarossa s’est échappé."
"Dates are Julian. Figures for the size of the expedition and for the dead in the sack of Tunis vary widely between sources.": "Les chiffres pour la taille de l’expédition et pour les morts dans le sac de Tunis varient considérablement d’une source à l’autre."
"Charles’s campaign was celebrated across Europe as a crusade; the Flemish painter Jan Cornelisz Vermeyen went with the army, and his drawings became the basis of a famous set of tapestries woven by Willem de Pannemaker. Charles’s attack on Algiers in 1541 has its own entry.": "La campagne Charles est célébrée à travers l’Europe comme une croisade ; le peintre flamand Jan Cornelisz Vermeyen va avec l’armée, et ses dessins deviennent la base d’un célèbre ensemble de tapisseries tissé par Willem de Pannemaker. L’attaque de Charles sur Alger en 1541 a sa propre entrée."
