# French translations of the catalogue text (wave 8); step bodies follow later.
Conquests of Alauddin Khalji: Conquêtes d’Alauddin Khalji
The campaigns of Alauddin Khalji, sultan of Delhi from 1296 to 1316, and his general Malik Kafur, which carried the Delhi Sultanate’s armies across western and central India and deep into the south. As governor of Kara he plundered the Yadava capital Devagiri in 1296 and used the treasure to seize the throne. As sultan he conquered Gujarat (1299–1304), the Rajput fortresses of Ranthambore (1301) and Chittor (1303), Malwa (1305), Siwana (1308) and Jalore (1311). From 1308 Malik Kafur made the kingdoms of the Deccan and the south tributaries, besieging Warangal in 1310, forcing the Hoysala king to submit at Dwarasamudra in 1311 and plundering the Pandya country as far as Madurai. The wars brought enormous booty to Delhi, and the sieges ended with massacres, jauhar (the self-immolation of Rajput women) and the destruction of temples.: "Les campagnes d’Alauddin Khalji, sultan de Delhi de 1296 à 1316, et de son général Malik Kafur, qui portèrent les armées du sultanat de Delhi à travers l’ouest et le centre de l’Inde et loin dans le sud. Alors gouverneur de Kara, il pilla en 1296 Devagiri, la capitale des Yadava, et se servit du trésor pour s’emparer du trône. Devenu sultan, il conquit le Goujarat (1299–1304), les forteresses rajputes de Ranthambore (1301) et de Chittor (1303), le Malwa (1305), Siwana (1308) et Jalore (1311). À partir de 1308, Malik Kafur fit des royaumes du Dekkan et du sud des tributaires : il assiégea Warangal en 1310, contraignit le roi hoysala à se soumettre à Dwarasamudra en 1311 et pilla le pays pandya jusqu’à Madurai. Ces guerres rapportèrent à Delhi un butin énorme, et les sièges s’achevèrent par des massacres, par le jauhar (l’auto-immolation des femmes rajputes) et par la destruction de temples."
