"Alarmed by Serbia’s advance into northern Macedonia, the Bulgarian tsar Michael Shishman and the Byzantine emperor Andronikos III agreed to attack it together. Before the Byzantines arrived, King Stefan Dečanski and his son Dušan caught the Bulgarian army near Velbazhd (Kyustendil) on 28 July 1330. The Bulgarians were routed and Michael Shishman was mortally wounded; Dečanski’s nephew Ivan Stefan was put on the Bulgarian throne. The following year nobles eager for southern conquests turned against Dečanski, and Dušan seized power; he was crowned king on 8 September 1331, and his father died in prison at Zvečan soon after.": "Alarmée par la Serbie, le tsar bulgare Michael Shishman et l’empereur byzantin Andronikos III ont accepté de l’attaquer ensemble. Avant l’arrivée des Byzantins, le roi Stefan Dečanski et son fils Dušan ont pris l’armée bulgare près de Velbazhd (Kyustendil) le 28 juillet 1330. Les Bulgares furent chassés et Michael Shishman fut mortellement blessé ; le neveu de Dečanski Ivan Stefan fut mis sur le trône bulgare. L’année suivante, des nobles désireux de conquêtes du sud se tournèrent contre Dečanski, et Dušan prit le pouvoir ; il fut couronné roi le 8 septembre 1331, et son père mourut en prison à Zvečan peu après."
"Dušan made peace with Bulgaria, marrying Helena, the sister of its new tsar Ivan Alexander, and turned south. With the help of the Byzantine rebel Syrgiannes he took Ohrid, Prilep and Strumica, which the Byzantines recognised as Serbian in 1334. When the Byzantine civil war broke out in 1341 he backed first John Kantakouzenos and then the regency in Constantinople, while his armies took Albania except Durrës, the towns of western Macedonia and, on 25 September 1345 after a long siege, Serres.": "Avec l’aide du rebelle byzantin Syrgiannes, il prit Ohrid, Prilep et Strumica, que les Byzantins reconnurent comme serbe en 1334. Lorsque la guerre civile byzantine éclata en 1341, il appuya d’abord John Kantakouzenos puis la régence à Constantinople, tandis que ses armées prirent l’Albanie à l’exception de Durrës, les villes de Macédoine occidentale et, le 25 septembre 1345 après un long siège, Serres."
