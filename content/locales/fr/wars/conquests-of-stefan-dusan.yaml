"Conquests of Stefan Dušan": "Conquêtes de Stefan Dušan"
"The expansion of medieval Serbia to its greatest extent under King, later Emperor, Stefan Dušan. After the Serbian victory over Bulgaria at Velbazhd in 1330, Dušan took the throne from his father and, exploiting the Byzantine civil wars, conquered Macedonia, Albania, Epirus and Thessaly. In 1346 he was crowned Emperor of the Serbs and Greeks at Skopje, but his empire broke apart soon after his death in 1355.": "Après la victoire serbe sur la Bulgarie à Velbazhd en 1330, Dušan a pris le trône de son père et, exploitant les guerres civiles byzantines, a conquis la Macédoine, l’Albanie, Epirus et Thessalie. En 1346, il fut couronné empereur des Serbes et des Grecs à Skopje, mais son empire s’est brisé peu après sa mort en 1355."
"Dates are Julian. Dušan’s titles grew with his conquests; Serbian documents use “Romans” or “Greeks” for the Byzantines, and he was crowned “Emperor of the Serbs and Romans”.": "Les titres du Dušan ont grandi avec ses conquêtes ; les documents serbes utilisent des Romains ou des Grecs pour les Byzantins, et il a été couronné Empereur des Serbes et des Romains."
"The Byzantine civil wars of 1321–1328 and 1341–1347, which made many of these conquests possible, have their own entries.": "Les guerres civiles byzantines de 1321–1328 et 1341–1347, qui ont rendu possible beaucoup de ces conquêtes, ont leurs propres entrées."
