"1346–1355": "1346–1355"
"On Easter Sunday, 16 April 1346, an assembly at Skopje raised the Serbian archbishopric to a patriarchate with its seat at Peć, and the new patriarch crowned Dušan Emperor of the Serbs and Romans, with the Bulgarian patriarch and monks of Mount Athos present; Constantinople’s patriarch excommunicated him. In 1347–1348, as the Black Death ravaged the Byzantine lands, his armies took Epirus, Aetolia and Thessaly. Dušan made his half-brother Simeon Uroš governor of Epirus and the general Preljub governor of Thessaly. His law code, proclaimed at Skopje in 1349, was meant to bind the many peoples of his realm together.": "Le dimanche de Pâques, 16 avril 1346, une assemblée à Skopje a élevé l’archevêque serbe à un patriarcat avec son siège à Peć, et le nouveau patriarche a couronné l’empereur Dušan des Serbes et des Romains, avec le patriarche bulgare et les moines du mont Athos présents ; Constantinople. En 1347–1348, alors que la mort noire ravageait les terres byzantines, ses armées prirent Epirus, Aetolia et Thessalie. Dušan fit son demi-frère Siméon Uroš gouverneur d’Epirus et le général Preljub gouverneur de Thessalie. Son code de loi, proclamé à Skopje en 1349, était destiné à lier ensemble les nombreux peuples de son royaume."
"Dušan’s empire now stretched from the Danube to the Gulf of Corinth, but Thessalonica and Constantinople were beyond him without a fleet, and Venice refused to lend him one. In 1350 Kantakouzenos, now emperor, briefly won back Veria and Edessa with Turkish help. In 1352 a Serbian force sent to help John V against Kantakouzenos was beaten near Didymoteicho by Ottoman troops under Orhan’s son Süleyman. Dušan beat off a Hungarian invasion in 1354 and died, aged about 47, on 20 December 1355. Under his son Uroš V the provinces fell away to their governors.": "L’empire du Dušan s’étend maintenant du Danube au golfe de Corinthe, mais Thessalonica et Constantinople sont au-delà de lui sans flotte, et Venise refuse de lui en prêter un. En 1350, Kantakouzenos, aujourd'hui empereur, remporta brièvement Veria et Edessa avec l’aide turque. En 1352, une force serbe envoyée pour aider John V contre Kantakouzenos a été battue près de Didymoteicho par les troupes ottomanes sous le fils d’Orhans Süleyman. Dušan a battu une invasion hongroise en 1354 et est morte, âgé d’environ 47 ans, le 20 décembre 1355."
