# Some French text was translated automatically.
"Conspiracy of the Barons": "Conspiration des Barons"
"A revolt of great barons of the Kingdom of Naples, led by Antonello Sanseverino, Prince of Salerno, against King Ferdinand I and his heir Alfonso, Duke of Calabria, whose efforts to strengthen royal power threatened their privileges. Pope Innocent VIII, the kingdom’s overlord, backed them. The rebels took L’Aquila under the papal banner on 26 September 1485, and papal troops under the condottiere Roberto Sanseverino fought Alfonso’s army around Rome, while Milan and Florence sent help to Ferdinand. In August 1486 the pope made peace with Ferdinand, who promised the barons an amnesty. He did not keep it. The leaders, among them his former secretary Antonello Petrucci and the Count of Sarno, Francesco Coppola, were arrested and later executed, and many other barons died in prison; the Prince of Salerno escaped and joined the French court.": "Une révolte des grands barons du Royaume de Naples, dirigée par Antonello Sanseverino, Prince de Salerno, contre le roi Ferdinand Ier et son héritier Alfonso, duc de Calabre, dont les efforts pour renforcer le pouvoir royal menaçaient leurs privilèges. Le 26 septembre 1485, les rebelles prirent L’Aquila sous la bannière papale, et les troupes papales sous le condottier Roberto Sanseverino combattirent l’armée Alfonso de Rome, tandis que Milan et Florence envoyèrent de l’aide à Ferdinand. En août 1486, le pape fit la paix avec Ferdinand, qui promit aux barons une amnistie. Les dirigeants, parmi eux son ancien secrétaire Antonello Petrucci et le comte de Sarno, Francesco Coppola, ont été arrêtés et exécutés plus tard, et beaucoup d’autres barons sont morts en prison ; le prince de Salerno s’est échappé et a rejoint la cour française."
"Italian historians call it the second conspiracy of the barons, after the revolt of 1459–1462. Exiled barons later urged Charles VIII of France to claim Naples, which he invaded in 1494.": "Les historiens italiens l’appellent la seconde conspiration des barons, après la révolte de 1459-1462. Des barons exilés pressèrent plus tard Charles VIII de France de réclamer Naples, qu’il envahit en 1494."
