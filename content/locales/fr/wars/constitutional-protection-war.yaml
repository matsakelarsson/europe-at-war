# French translations of the catalogue text (wave 9); step bodies follow later.
Constitutional Protection War: Guerre de protection de la Constitution
? A series of wars between the Beiyang government in Beijing and the southern provinces that rallied to Sun Yat-sen’s Constitutional Protection Movement, fought mainly in Hunan, Guangdong, Fujian and Sichuan. In 1917 the premier Duan Qirui, who had put down Zhang Xun’s twelve-day restoration of the Qing emperor in July, refused to recall the parliament dissolved in June or to restore the provisional constitution of 1912. Sun went to Guangzhou with part of the navy, and about a hundred members of the old parliament set up a military government there, with Sun as generalissimo (August–September 1917), backed by the Old Guangxi clique of Lu Rongting and the Yunnan clique of Tang Jiyao. Duan’s attempt to take Hunan failed in November 1917, but in March–April 1918 the Zhili commanders Cao Kun and Wu Peifu took Yuezhou, Changsha and Hengyang. Wu then halted, made a truce with the south and in May 1920 withdrew from Hunan. In the south the Guangxi generals pushed Sun aside in May 1918. In 1920 Chen Jiongming’s Guangdong Army returned from southern Fujian and drove the Guangxi clique out of Guangzhou (October 1920), and in 1921 it conquered Guangxi itself. The revived parliament in Guangzhou elected Sun “extraordinary president” in April 1921, but Chen opposed Sun’s plans for a northern expedition, and on 16 June 1922 his troops shelled Sun’s residence in Guangzhou; Sun escaped to a gunboat and later to Shanghai. Sun then turned to the Soviet Union for help, which led to the first united front with the Chinese Communist Party and the Whampoa Military Academy.
: Une série de guerres entre le gouvernement de Beiyang à Pékin et les provinces du Sud ralliées au mouvement de protection de la Constitution de Sun Yat-sen, livrées principalement dans le Hunan, le Guangdong, le Fujian et le Sichuan. En 1917, le Premier ministre Duan Qirui, qui avait mis fin en juillet aux douze jours de restauration de l’empereur Qing menée par Zhang Xun, refusa de rappeler le parlement dissous en juin et de rétablir la constitution provisoire de 1912. Sun se rendit à Canton avec une partie de la marine, et une centaine de membres de l’ancien parlement y établirent un gouvernement militaire, avec Sun pour généralissime (août–septembre 1917), soutenu par l’ancienne clique du Guangxi de Lu Rongting et la clique du Yunnan de Tang Jiyao. La tentative de Duan de prendre le Hunan échoua en novembre 1917, mais en mars–avril 1918 les commandants de la clique du Zhili Cao Kun et Wu Peifu prirent Yuezhou, Changsha et Hengyang. Wu s’arrêta alors, conclut une trêve avec le Sud et, en mai 1920, se retira du Hunan. Dans le Sud, les généraux du Guangxi écartèrent Sun en mai 1918. En 1920, l’armée du Guangdong de Chen Jiongming revint du sud du Fujian et chassa la clique du Guangxi de Canton (octobre 1920), puis en 1921 conquit le Guangxi lui-même. Le parlement rétabli à Canton élut Sun « président extraordinaire » en avril 1921, mais Chen s’opposait aux projets d’expédition vers le nord de Sun et, le 16 juin 1922, ses troupes bombardèrent la résidence de Sun à Canton ; Sun s’échappa sur une canonnière, puis gagna Shanghai. Sun se tourna alors vers l’Union soviétique pour obtenir de l’aide, ce qui conduisit au premier front uni avec le Parti communiste chinois et à l’académie militaire de Whampoa.
