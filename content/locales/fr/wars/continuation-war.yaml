"On the Karelian Isthmus the Finnish army halted at the end of August 1941, roughly at the old border and some 30 km from the centre of Leningrad. On 8 September German troops took Shlisselburg on the southern shore of Lake Ladoga, closing the land blockade of the city. Hitler wanted the Finns to attack Leningrad from the north, but Mannerheim and the government refused, and the Finnish line stayed where it was until 1944. Whether Finland thereby spared the city or helped to starve it is still debated. Its army closed the northern side of the ring and tied down Soviet troops.": "Sur l’isthme carélien, l’armée finlandaise s’arrêta à la fin du mois d’août 1941, à peu près à l’ancienne frontière et à une trentaine de kilomètres du centre de Leningrad. Le 8 septembre, les troupes allemandes prirent Shlisselburg sur la rive sud du lac Ladoga, fermant le blocus terrestre de la ville. Hitler voulait que les Finlandais attaquent Leningrad du nord, mais Mannerheim et le gouvernement ont refusé, et la ligne finlandaise est restée où elle était jusqu’en 1944. Que la Finlande ait ainsi épargné la ville ou aidé à mourir de faim il est encore débattu. Son armée a fermé le côté nord de l’anneau et attaché les troupes soviétiques."
"Leningrad’s only link with the rest of the country ran across Lake Ladoga, between the German and Finnish lines, by boat in summer and over the ice, on the “Road of Life”, in winter. Finnish, German and Italian boats tried to cut the lake route in 1942 without success. By one widely cited count about 640,000 civilians died in the city and some 400,000 more during evacuation, most of them of hunger in the winter of 1941–1942. The Red Army opened a narrow land corridor south of the lake in January 1943 and broke the German siege lines in January 1944, after 872 days.": "Les Leningrads n’ont traversé que le lac Ladoga, entre les lignes allemandes et finlandaises, en bateau en été et sur la glace, sur la route de la vie, en hiver. Des bateaux finlandais, allemands et italiens ont essayé de couper le tracé du lac en 1942 sans succès. Selon un dénombrement largement cité, environ 640 000 civils sont morts dans la ville et quelque 400 000 autres pendant l’évacuation, la plupart souffrant de faim durant l’hiver 1941-1942. L’Armée rouge a ouvert un étroit couloir terrestre au sud du lac en janvier 1943 et brisé les lignes de siège allemandes en janvier 1944, après 872 jours."
