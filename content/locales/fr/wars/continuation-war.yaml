"September 1944": "septembre 1944"
"Finland broke off relations with Germany on 2 September, and a ceasefire came into force on 4–5 September. The armistice, signed in Moscow on 19 September, restored the border of 1940 and gave Petsamo, Finland’s outlet to the Arctic Ocean, to the Soviet Union. Porkkala, a peninsula just west of Helsinki, was leased to the Soviet Union for 50 years as a naval base in place of Hanko. Finland agreed to pay reparations, later fixed at 300 million US dollars in goods over six years, and to disarm or expel the German troops still in the country, which led to the Lapland War.": "La Finlande rompt ses relations avec l’Allemagne le 2 septembre, et un cessez-le-feu entre en vigueur les 4 et 5 septembre. L’armistice, signé à Moscou le 19 septembre, rétablit la frontière de 1940 et donna à l’Union soviétique Petsamo (Finlande) un point de sortie vers l’océan Arctique. Porkkala, une péninsule située juste à l’ouest d’Helsinki, fut louée à l’Union soviétique pendant 50 ans comme base navale à la place de Hanko. La Finlande a accepté de verser des réparations, fixées ultérieurement à 300 millions de dollars des États-Unis en marchandises sur six ans, et de désarmer ou d’expulser les troupes allemandes encore présentes dans le pays, ce qui a conduit à la guerre de Laponie."
"Finland also had to legalise the Communist Party, ban organisations the Soviet Union considered fascist, put its wartime leaders on trial and accept an Allied Control Commission led by the Soviet Union. About 63,000 Finns had been killed or gone missing in the war, and Soviet losses are put at 250,000–305,000 dead or missing. The Karelians who had returned home, some 260,000 people, had to leave again. Finland was not occupied and kept its democratic institutions. The Paris Peace Treaty of 1947 confirmed the new border, and the Soviet Union gave Porkkala back in January 1956.": "La Finlande a également dû légaliser le Parti communiste, interdire les organisations que l’Union soviétique considérait comme fascistes, traduire en justice ses dirigeants en temps de guerre et accepter une Commission alliée de contrôle dirigée par l’Union soviétique. Environ 63 000 Finlandais avaient été tués ou portés disparus pendant la guerre, et les pertes soviétiques sont portées à 250 000 à 305 000 morts ou disparus. La Finlande n’était pas occupée et gardait ses institutions démocratiques. Le traité de paix de Paris de 1947 confirma la nouvelle frontière, et l’Union soviétique remit Porkkala en janvier 1956."
