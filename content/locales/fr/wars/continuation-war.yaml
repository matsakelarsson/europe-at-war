"The Finnish army did not stop at the old border. In September the Army of Karelia advanced into Soviet East Karelia, reached the Svir river between Lakes Ladoga and Onega and crossed it to hold a bridgehead on the southern bank, where it expected to meet German troops coming from the south. They never arrived. The German drive took Tikhvin in November but was thrown back in December. The Finns took Petrozavodsk, the Karelian capital, on 1 October and Medvezhyegorsk at the northern end of Lake Onega in early December, after which Mannerheim halted the offensive.": "L’armée finlandaise ne s’arrêta pas à l’ancienne frontière. En septembre, l’armée de Carélie avança dans la Karélie soviétique orientale, atteignit le fleuve Svir entre les lacs Ladoga et Onega et le traversa pour tenir une tête de pont sur la rive sud, où elle devait rencontrer des troupes allemandes venant du sud. Les Finlandais ont pris Petrozavodsk, la capitale karélienne, le 1er octobre et Medvezhyegorsk à l’extrémité nord du lac Onega au début de décembre, après quoi Mannerheim a arrêté l’offensive."
"Many Finnish leaders hoped to annex East Karelia, home to Finnic Karelians and Vepsians, as part of a Greater Finland. A military administration ran the occupied area. Its Finnic inhabitants were favoured, while many of its ethnic Russians, nearly a third of those who had stayed, were held in internment camps, where thousands died of hunger and disease, most of them in 1942. Of about 64,000 Soviet prisoners of war taken by Finland, at least 18,000 died in Finnish camps. From 1942 the front settled into trench warfare that lasted until the summer of 1944.": "De nombreux dirigeants finlandais espéraient annexer la Carélie de l’Est, qui abrite les Karéliens et les Vépsiens finnois, dans le cadre d’une Grande Finlande. Une administration militaire dirigeait la zone occupée. Ses habitants Finlandais étaient favorisés, tandis que beaucoup de ses Russes ethniques, près d’un tiers de ceux qui avaient séjourné, étaient détenus dans des camps d’internement, où des milliers mouraient de faim et de maladies, la plupart en 1942. Sur les 64 000 prisonniers de guerre soviétiques capturés par la Finlande, au moins 18 000 moururent dans des camps finlandais. À partir de 1942, le front s’installa dans la guerre des tranchées qui dura jusqu’à l’été 1944."
