"Continuation War": "Poursuite de la guerre"
"A war between Finland and the Soviet Union fought alongside Germany’s war in the east, in which Finland retook the lands lost in the Winter War and occupied much of East Karelia in 1941. A Soviet offensive in 1944 drove the Finns back until it was stopped at Tali-Ihantala, and in the Moscow Armistice of 19 September 1944 Finland restored the 1940 border, ceded Petsamo and leased Porkkala to the Soviet Union.": "Une guerre entre la Finlande et l’Union soviétique a combattu aux côtés de l’Allemagne dans l’est, où la Finlande a repris les terres perdues dans la guerre d’hiver et occupé une grande partie de la Carélie orientale en 1941. Une offensive soviétique en 1944 a repoussé les Finlandais jusqu’à ce qu’il soit arrêté à Tali-Ihantala, et dans l’armistice de Moscou du 19 septembre 1944 la Finlande a restauré la frontière 1940, cédé Petsamo et loué Porkkala à l’Union soviétique."
"Finland was never formally allied to Germany. It fought as a co-belligerent and coordinated its operations with the German army, and Finnish writers long presented the war as a separate conflict that continued the Winter War.": "La Finlande n’a jamais été formellement alliée à l’Allemagne. Elle a combattu en tant que co-belligérant et coordonné ses opérations avec l’armée allemande, et les écrivains finlandais ont longtemps présenté la guerre comme un conflit séparé qui a continué la guerre d’hiver."
"Places in the lands ceded in 1940 are given their Finnish names. Viipuri is now Vyborg in Russia. The Finnish administration called Petrozavodsk Äänislinna and Medvezhyegorsk Karhumäki.": "Viipuri est maintenant Vyborg en Russie. L’administration finlandaise appelée Petrozavodsk Äänislinna et Medvezhyegorsk Karhumäki."
"The base map shows the lands retaken in 1941 as Finnish until 1944. The occupation of East Karelia beyond the 1939 border is drawn as an area, and it and the front lines are approximate.": "La carte de base montre les terres reprises en 1941 comme finnois jusqu’en 1944. L’occupation de la Carélie orientale au-delà de la frontière 1939 est dessinée comme une zone, et elle et les lignes de front sont approximatives."
