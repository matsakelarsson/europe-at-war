"June – September 1941": "juin – septembre 1941"
"Finland’s leaders had secretly coordinated with Germany since late 1940, and German troops were already in northern Finland when Germany invaded the Soviet Union on 22 June 1941. When Soviet aircraft bombed Finnish towns and airfields on 25 June, the government declared that Finland was at war. In the far north, German and Finnish troops attacked towards Murmansk and the railway south of it in Operation Silver Fox, but they were stopped on the Litsa river and in the forests east of Salla, short of their goals. The Soviet base at Hanko, cut off, was besieged until its garrison left by sea in December.": "Les dirigeants de la Finlande avaient secrètement coordonné avec l’Allemagne depuis la fin de 1940, et les troupes allemandes étaient déjà dans le nord de la Finlande lorsque l’Allemagne a envahi l’Union soviétique le 22 juin 1941. Dans l’extrême nord, les troupes allemandes et finlandaises attaquèrent vers Mourmansk et le chemin de fer au sud dans l’opération Silver Fox, mais elles furent arrêtées sur la Litsa et dans les forêts à l’est de Salla, en deçà de leurs objectifs. La base soviétique à Hanko, coupée, fut assiégée jusqu’à ce que sa garnison soit laissée par mer en décembre."
"The Finnish Army of Karelia attacked north of Lake Ladoga on 10 July, reached the lake’s shore within a week and took Sortavala in mid-August. On the Karelian Isthmus the Finns attacked in August, surrounded Soviet divisions on the north-western shore of Ladoga, which escaped by boat, and retook Viipuri on 29 August. By the end of the month they had reached the 1939 border and in places gone beyond it. Most Finns saw this as winning back what had been taken in 1940. The army, however, went further.": "L’armée finlandaise de Carélie a attaqué au nord du lac Ladoga le 10 juillet, a atteint la rive du lac en une semaine et a pris Sortavala à la mi-août. Sur l’isthme karélien les Finlandais ont attaqué en août, entouré les divisions soviétiques sur la rive nord-ouest de Ladoga, qui s’est échappé par bateau, et a repris Viipuri le 29 août. À la fin du mois, ils avaient atteint la frontière de 1939 et dans des endroits allé au-delà. La plupart des Finlandais ont vu cela comme une récupération de ce qui avait été pris en 1940. L’armée, cependant, est allée plus loin."
