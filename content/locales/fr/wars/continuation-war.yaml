"On 9 June 1944, three days after the Allied landings in Normandy, the Red Army opened a massive offensive on the Karelian Isthmus with one of the heaviest bombardments of the war, at Valkeasaari. It broke the first Finnish line at once and the second, the VT line, at Kuuterselkä within a week, and on 20 June retook Viipuri almost without a fight. President Risto Ryti then gave Germany his personal pledge not to make a separate peace, in return for German anti-tank weapons, assault guns and aircraft. Further north the Red Army attacked in East Karelia from 21 June, and the Finns withdrew, giving up Petrozavodsk on 28 June.": "Le 9 juin 1944, trois jours après les débarquements des Alliés en Normandie, l’armée rouge ouvre une offensive massive sur l’isthme karélien avec un des bombardements les plus lourds de la guerre, à Valkeasaari. Elle brise la première ligne finlandaise à la fois et la deuxième, la ligne VT, à Kuuterselkä en moins d’une semaine, et le 20 juin reprend Viipuri presque sans combat. Le Président Risto Ryti a ensuite donné à l’Allemagne son engagement personnel de ne pas faire une paix séparée, en échange des armes antichars allemandes, des canons d’assaut et des avions. Plus au nord, l’Armée rouge attaqua à Carélie orientale le 21 juin, et les Finlandais se retiraient, abandonnant Petrozavodsk le 28 juin."
"North-east of Viipuri, between Tali and Ihantala, Finnish troops with German air support stopped the Soviet advance in the largest battle in Nordic history, fought from 25 June to 9 July. The Finns also held the Vuoksi at Vuosalmi and the Bay of Viipuri, and in August they encircled and mauled two Soviet divisions at Ilomantsi. The front stabilised, and with its forces needed for the advance on Germany, the Soviet leadership agreed to talks. Ryti resigned on 1 August and Mannerheim became president, which freed Finland from Ryti’s pledge.": "Au nord-est de Viipuri, entre Tali et Ihantala, les troupes finlandaises avec l’appui aérien allemand stoppèrent l’avancée soviétique dans la plus grande bataille de l’histoire nordique, se livrèrent du 25 juin au 9 juillet. Les Finlandais détenaient également le Vuoksi à Vuosalmi et dans la baie de Viipuri, et en août ils encerclèrent et maulèrent deux divisions soviétiques à Ilomantsi. Le front s’est stabilisé, et avec ses forces nécessaires à l’avance sur l’Allemagne, la direction soviétique a accepté les pourparlers. Ryti a démissionné le 1er août et Mannerheim est devenu président, qui a libéré la Finlande de l’engagement de Ryti."
