# Some French text was translated automatically.
"Corfu incident": "L’incident de Corfou"
"A crisis between Greece and Fascist Italy in 1923, after the Italian general Enrico Tellini, marking the Greek–Albanian border for the Conference of Ambassadors, was murdered with members of his staff on Greek soil. Italian warships shelled Corfu, killing some 16 civilians, many of them refugees from Anatolia, and Italian troops occupied the island until Mussolini, defying the League of Nations, won an apology and 50 million lire from Greece through the Conference of Ambassadors, an early sign of the League’s weakness against a great power.": "Une crise entre la Grèce et l’Italie fasciste en 1923, après le général italien Enrico Tellini, qui marquait la frontière gréco-albanaise pour la Conférence des ambassadeurs, fut assassinée avec des membres de son personnel sur le sol grec. Des navires de guerre italiens ont bombardé Corfou, tuant quelque 16 civils, dont beaucoup réfugiés d’Anatolie, et les troupes italiennes ont occupé l’île jusqu’à ce que Mussolini, défiant la Société des Nations, gagne une excuse et 50 millions de lires de Grèce par le biais de la Conférence des ambassadeurs, signe précoce de faiblesse de la Ligue contre une grande puissance."
"The killers were never conclusively identified. The bombardment took place on 31 August 1923, and Italian troops left Corfu on 27 September.": "Le bombardement a eu lieu le 31 août 1923, et les troupes italiennes ont quitté Corfou le 27 septembre."
