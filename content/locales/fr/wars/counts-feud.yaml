"1534–1543": "1534–1543"
"In Denmark’s civil war, the Count’s Feud, Lübeck tried to restore the deposed Christian II. Gustav Vasa, deep in debt to Lübeck, sided with the Danish nobles and Duke Christian, later Christian III. Swedish troops took Halmstad in October 1534 and won at Helsingborg in January 1535, and in June 1535 a Swedish, Danish and Prussian fleet beat Lübeck’s ships off Bornholm. Lübeck’s defeat broke its grip on the Swedish economy.": "Au Danemark, la guerre civile, le comte Feud, Lübeck a essayé de restaurer le chrétien II déposé. Gustav Vasa, profondément endetté à Lübeck, s’est associé aux nobles danois et duc Christian, plus tard Christian III. Les troupes suédoises ont pris Halmstad en octobre 1534 et gagné à Helsingborg en janvier 1535, et en juin 1535 une flotte suédoise, danoise et prussienne a battu les navires de Lübeck au large de Bornholm."
"Gustav’s heavy taxes and his Lutheran Reformation provoked the most serious revolt of his reign. In 1542 Nils Dacke led the peasants of Småland in a rising that almost toppled the king. Gustav’s Swedish and German troops crushed it in 1543, and Dacke was killed that August.": "En 1542 Nils Dacke a conduit les paysans de Småland dans une montée qui a presque renversé le roi. Gustavs les troupes suédoise et allemande l’a écrasé en 1543, et Dacke a été tué ce août."
