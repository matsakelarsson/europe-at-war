"The rising spread through the forests of Småland. Dacke fell in August 1543 in the parish of Gullabo.": "La montée s’est étendue dans les forêts de Småland. Dacke est tombé en août 1543 dans la paroisse de Gullabo."
"The siege of Copenhagen and the Reformation": "Le siège de Copenhague et la réforme"
"1534–1537": "1534–1537"
"The civil war began in 1534, when Lübeck, under its mayor Jürgen Wullenwever, hired Count Christopher of Oldenburg to restore the imprisoned Christian II. Copenhagen and Malmö opened their gates to him, and in north Jutland the privateer Skipper Clement raised the peasants, who beat the nobles at Svenstrup in October. The frightened nobles of Jutland and Funen chose the Lutheran Duke Christian of Holstein as king. His general, Johan Rantzau, stormed Aalborg on 18 December 1534, killing some 2,000 people, and crushed the rising.": "La guerre civile a commencé en 1534, lorsque Lübeck, sous la direction de son maire Jürgen Wullenwever, a engagé le comte Christopher d’Oldenburg pour restaurer le chrétien II emprisonné. Copenhague et Malmö lui ont ouvert les portes, et dans le nord du Jutland, le corsaire Skipper Clement a élevé les paysans, qui ont battu les nobles à Svenstrup en octobre. Les nobles effrayés de Jutland et de Funen ont choisi le duc luthérien chrétien de Holstein comme roi. Son général, Johan Rantzau, a pris Aalborg le 18 décembre 1534, tuant quelque 2.000 personnes, et écrasé la montée."
"In June 1535 Rantzau destroyed the Count’s army at Øksnebjerg on Funen, while the allied fleet beat Lübeck’s at sea. Christian III then besieged Copenhagen for a year. Malmö gave in in April 1536, and Copenhagen, starving, surrendered on 29 July. Christian used his victory to carry out the Reformation. In August he had the Catholic bishops arrested; an assembly in October deposed them and gave their estates to the crown, and a Lutheran church order followed in 1537. Norway, whose archbishop had opposed Christian III, lost its own council of the realm and was ruled from Copenhagen as part of the Danish realm.": "En juin 1535, Rantzau détruisit l’armée du comte à Øksnebjerg sur Funen, tandis que la flotte alliée battait Lübeck. Christian III assiégea Copenhague pendant un an. Malmö céda en avril 1536 et Copenhague, affamé, se rendit le 29 juillet. Christian usa de sa victoire pour mener à bien la Réforme. En août, il fit arrêter les évêques catholiques ; une assemblée en octobre les déposa et donna leurs biens à la couronne, et un ordre religieux luthérien suivit en 1537. La Norvège, dont l’archevêque s’était opposé à Christian III, perdit son propre conseil du royaume et fut gouvernée de Copenhague comme partie du royaume danois."
