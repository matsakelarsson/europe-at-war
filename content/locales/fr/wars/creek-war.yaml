# French translations of the catalogue text (wave 14); step bodies follow later.
Creek War: Guerre creek
? A civil war within the Muscogee (Creek) Confederacy that became a war with the United States, in present-day Alabama and Georgia. The Red Sticks, a movement strongest in the Upper Creek towns and inspired in part by Tecumseh’s visit in 1811 and by Muscogee prophets, rejected the American ways and land cessions that the Creek National Council and the United States agent Benjamin Hawkins promoted. After the council executed Red Stick warriors who had killed settlers, fighting broke out among the Creeks in 1813. Mississippi militia attacked a Red Stick party returning with Spanish arms at Burnt Corn Creek in July, and on 30 August 1813 the Red Sticks took Fort Mims, killing some 250 to 500 militiamen, settlers, Creeks of the council side and enslaved people. Armies from Tennessee, Georgia and Mississippi Territory invaded the Creek country, with Cherokee, Choctaw and allied Creek warriors; Andrew Jackson’s Tennessee army destroyed Red Stick towns and on 27 March 1814 broke the Red Sticks at Horseshoe Bend, where more than 800 of them died. By the Treaty of Fort Jackson of 9 August 1814 Jackson made the Creek Nation, including his own Creek allies, cede some 21 to 23 million acres, about half of present-day Alabama and part of southern Georgia. Many Red Sticks fled to Spanish Florida and joined the Seminole.
: Une guerre civile au sein de la Confédération muscogee (creek) qui devint une guerre contre les États-Unis, dans les actuels Alabama et Géorgie. Les Bâtons-Rouges (Red Sticks), un mouvement surtout implanté dans les villes des Creeks supérieurs et inspiré en partie par la visite de Tecumseh en 1811 et par des prophètes muscogees, rejetaient le mode de vie américain et les cessions de terres que promouvaient le Conseil national creek et l’agent des États-Unis Benjamin Hawkins. Après que le conseil eut fait exécuter des guerriers bâtons-rouges qui avaient tué des colons, les combats éclatèrent entre Creeks en 1813. La milice du Mississippi attaqua à Burnt Corn Creek, en juillet, un groupe de Bâtons-Rouges qui revenait avec des armes espagnoles et, le 30 août 1813, les Bâtons-Rouges prirent le fort Mims, tuant quelque 250 à 500 miliciens, colons, Creeks du camp du conseil et personnes réduites en esclavage. Des armées du Tennessee, de la Géorgie et du territoire du Mississippi envahirent le pays creek, avec des guerriers cherokees, chactas et creeks alliés ; l’armée du Tennessee d’Andrew Jackson détruisit des villes bâtons-rouges et, le 27 mars 1814, brisa les Bâtons-Rouges à Horseshoe Bend, où plus de 800 d’entre eux périrent. Par le traité de Fort Jackson du 9 août 1814, Jackson contraignit la nation creek, y compris ses propres alliés creeks, à céder quelque 21 à 23 millions d’acres, soit environ la moitié de l’actuel Alabama et une partie du sud de la Géorgie. De nombreux Bâtons-Rouges s’enfuirent en Floride espagnole et rejoignirent les Séminoles.
