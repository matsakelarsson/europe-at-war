"Cretan Revolt of 1866–1869": "Crétane Revont de 1866–1869"
"The largest of the nineteenth-century Christian risings in Ottoman Crete, which sought union with Greece. Ottoman and Egyptian troops held the towns and slowly won back the countryside; the destruction of the Arkadi monastery in November 1866, where defenders blew up the powder magazine, turned European opinion towards the Cretans, and the revolt ended in 1869 with a new Organic Law that gave the Christians a share in governing the island.": "Les troupes ottomanes et égyptiennes ont tenu les villes et ont lentement gagné la campagne ; la destruction du monastère d’Arkadi en novembre 1866, où les défenseurs ont fait exploser le magazine de poudre, a tourné l’opinion européenne vers les Crétois, et la révolte s’est terminée en 1869 avec une nouvelle loi organique qui a donné aux chrétiens une part dans la gouvernance de l’île."
"Also called the Great Cretan Revolution. Numbers at Arkadi come from the commonly cited count of those in the monastery; the Ottoman losses there are an estimate.": "Aussi appelé la Grande Révolution Crétoise. Les nombres à Arkadi proviennent du dénombrement communément cité de ceux dans le monastère ; les pertes ottomanes il ya une estimation."
