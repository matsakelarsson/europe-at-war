"1866 – 1869": "1866 – 1869"
"Crete had stayed Ottoman when Greece became independent, and its Christian majority rose again in 1841 and 1858. The reforms promised after the Crimean War came slowly, and in 1866 a quarrel over the property of the monasteries brought matters to a head. Assemblies of Christian notables petitioned the Sultan, and on 21 August 1866 they proclaimed a revolt and union with Greece. The insurgents, joined by volunteers from Greece, took most of the countryside, while the Ottomans held the fortified towns of the north coast. Egypt’s Khedive Ismail sent a large force of infantry to help put the rising down.": "La Crète était restée ottomane lorsque la Grèce est devenue indépendante, et sa majorité chrétienne s’est redressée en 1841 et 1858. Les réformes promises après la guerre de Crimée sont arrivées lentement, et en 1866 une querelle sur la propriété des monastères a amené les affaires à la tête. Les insurgés, rejoints par des volontaires de Grèce, ont pris la plupart de la campagne, tandis que les Ottomans tenaient les villes fortifiées de la côte nord."
"The monastery of Arkadi, near Rethymno, was a centre of the revolt. On 8 November 1866 an Ottoman army of perhaps 15,000 men with artillery attacked it; inside were 964 people, of whom 259 were armed men and most of the rest women and children. On the second day the attackers broke in, and the defenders set fire to the powder magazine, killing themselves and many of the soldiers. About 864 of those in the monastery died and 114 were taken prisoner; Ottoman losses are put at about 1,500. Reported abroad by telegraph, the “holocaust of Arkadi” caused outrage, and volunteers from Italy, France, Hungary and Serbia joined the Cretans.": "Le monastère d’Arkadi, près de Rethymno, était un centre de la révolte.Le 8 novembre 1866, une armée ottomane d’environ 15 000 hommes avec l’artillerie l’attaque ; à l’intérieur se trouvaient 964 personnes, dont 259 hommes armés et la plupart des autres femmes et enfants. Environ 864 de ceux qui se trouvaient dans le monastère sont morts et 114 ont été faits prisonniers ; les pertes ottomanes sont portées à environ 1 500. Signalé à l’étranger par télégraphe, l’Holocauste d’Arkadi a provoqué des indignations, et des volontaires d’Italie, de France, de Hongrie et de Serbie ont rejoint les Crétois."
"In May 1867 Omer Pasha’s troops overran the Lasithi plateau in the east, and from October 1867 the grand vizier, Âli Pasha, spent four months on the island, building blockhouses and offering reform. His Organic Law of 1868 gave the Christians a large share in local government. Greek ships kept running guns to the rebels until a conference of the powers in Paris in early 1869 made Greece stop, and by then most rebel leaders had submitted.": "En mai 1867, les troupes d’Omer Pasha ont envahi le plateau de Lasithi à l’est et, à partir d’octobre 1867, le grand vizier, Ali Pasha, a passé quatre mois sur l’île, construisant des blockhaus et offrant une réforme. Les navires grecs ont continué à courir des armes aux rebelles jusqu’à ce qu’une conférence des puissances à Paris au début de 1869 fasse cesser la Grèce, et la plupart des dirigeants rebelles se sont alors présentés."
