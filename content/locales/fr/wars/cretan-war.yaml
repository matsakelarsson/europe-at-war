"Battles at the Dardanelles": "Batailles aux Dardanelles"
"1646–1657": "1646–1657"
"Unable to drive the Ottomans out of Crete, Venice tried to cut their supply line by blockading the Dardanelles, through which troops and stores sailed from Constantinople. The blockade was hard to keep up with oared galleys, and Ottoman convoys often got through. Still, Venetian fleets won most of the fights at sea, among them a three-day battle off Naxos in July 1651, and in 1655 Francesco Morosini raided Aegina and burned the port of Volos. The Ottomans began to add sailing warships, galleons, to their fleet of galleys.": "Incapable de chasser les Ottomans de Crète, Venise tenta de couper leur ligne d’approvisionnement en bloquant les Dardanelles, par lesquelles les troupes et les magasins naviguaient de Constantinople. Le blocus était difficile à suivre avec des galères amarrées, et les convois ottomans ont souvent traversé. Pourtant, les flottes vénitiennes ont remporté la plupart des combats en mer, parmi lesquelles une bataille de trois jours au large de Naxos en juillet 1651, et en 1655 Francesco Morosini a attaqué Aegina et brûlé le port de Volos. Les Ottomans ont commencé à ajouter des navires de guerre à voile, galions, à leur flotte de galères."
"On 26 June 1656 a Venetian and Maltese fleet under Lorenzo Marcello caught Kenan Pasha’s larger fleet coming out of the straits and destroyed it, the worst Ottoman naval defeat since Lepanto. Marcello was killed, but some 5,000 Christian galley slaves were freed, and Venice took the islands of Tenedos and Lemnos. The new grand vizier, Köprülü Mehmed Pasha, restored Ottoman fortunes. In July 1657 a new three-day battle at the straits ended when the Venetian flagship blew up, killing its commander, Lazzaro Mocenigo, and the Ottomans retook both islands.": "Le 26 juin 1656, une flotte vénitienne et maltaise sous Lorenzo Marcello s’empare de Kenan Pacha. La plus grande flotte sort du détroit et la détruit, la pire défaite navale ottomane depuis Lepanto. Marcello est tué, mais quelque 5 000 esclaves de galères chrétiennes sont libérés, et Venise prend les îles de Tenedos et Lemnos. En juillet 1657, une nouvelle bataille de trois jours au détroit s’est terminée lorsque le vaisseau amiral vénitien a explosé, tuant son commandant, Lazzaro Mocenigo, et les Ottomans ont repris les deux îles."
