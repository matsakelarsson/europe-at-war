"1648–1669": "1648–1669"
"The siege of Candia began in May 1648, but for years it was more a blockade than a siege, as the Ottomans lacked the strength to take the city’s great bastions and Venice could still bring in supplies by sea. A French corps came in 1660 and achieved little. Once peace with the emperor was made at Vasvár in 1664, the grand vizier Köprülü Fazıl Ahmed Pasha came to Crete himself with fresh troops, and from May 1667 the Ottomans pressed the siege with mines and assaults, met by countermines and sorties. By one Venetian count about 108,000 Ottomans and 29,000 defenders died in the last phase of the siege.": "Le siège de Candia a commencé en mai 1648, mais pendant des années c’était plus un blocus qu’un siège, car les Ottomans n’avaient pas la force de prendre les grands bastions de la ville et Venise pouvait encore apporter des provisions par mer. Une fois que la paix avec l’empereur a été faite à Vasvár en 1664, le grand vizier Köprülü Fazıl Ahmed Pasha est venu en Crète lui-même avec de nouvelles troupes, et à partir de mai 1667 les Ottomans ont pressé le siège avec des mines et des assauts, rencontré par contremines et sorties."
"In June 1669 a French force of some 6,000 men under the Duke of Beaufort landed, but its sortie on 25 June was thrown back and Beaufort was killed. A French warship blew up by accident in July, and in August the French sailed away. Francesco Morosini, with only a few thousand fit men left, agreed terms early in September, and on 27 September Candia was handed over. Its people were allowed to leave with their belongings. Venice kept three island forts off Crete and some gains in Dalmatia, including Klis.": "En juin 1669, une force française d’environ 6 000 hommes sous le duc de Beaufort débarqua, mais sa sortie fut repoussée le 25 juin et Beaufort fut tué. Un navire de guerre français souffla par accident en juillet, et en août les Français s’embarquèrent. Francesco Morosini, avec seulement quelques milliers d’hommes en forme, accepta les conditions au début de septembre, et le 27 septembre Candia fut remis. Venise a gardé trois forts insulaires au large de la Crète et quelques gains en Dalmatie, y compris Klis."
