# Some French text was translated automatically.
"Cretan War": "Guerre de Candie"
"The fifth Ottoman–Venetian war, also called the War of Candia, in which the Ottoman Empire took Crete from Venice. The Ottomans landed in 1645 and overran most of the island within three years, but the capital, Candia, held out for over twenty years while the Venetian fleet fought to blockade the Dardanelles. With help from the papacy, Malta and France, Venice won most of the battles at sea, yet in 1669 Francesco Morosini surrendered Candia after one of the longest sieges in history.": "Lors de cette cinquième guerre entre l’Empire ottoman et Venise, les Ottomans s’emparent de la Crète. Ils débarquent en 1645 et occupent la majeure partie de l’île en trois ans. La capitale, Candie, résiste plus de vingt ans tandis que la flotte vénitienne tente de bloquer les Dardanelles. Aidée par la papauté, Malte et la France, Venise remporte la plupart des batailles navales. En 1669, Francesco Morosini rend toutefois Candie après l’un des plus longs sièges de l’histoire."
"Dates are Gregorian. Morosini agreed the terms of surrender on 5–6 September 1669; the city was handed over on 27 September.": "Dates sont grégorien. Morosini a accepté les conditions de la reddition du 5 au 6 septembre 1669 ; la ville a été remise le 27 septembre."
"Casualty figures for the siege of Candia come mostly from Venetian and other Christian accounts and are uncertain. The war was also fought in Dalmatia, where Venice lost Novigrad in 1646 but in 1647–1648 retook it, beat off an Ottoman siege of Šibenik and took the fortress of Klis.": "Les estimations des pertes au siège de Candie proviennent surtout de récits vénitiens et d’autres sources chrétiennes et restent incertaines. La guerre touche aussi la Dalmatie. Venise perd Novigrad en 1646, puis reprend la ville en 1647–1648, repousse un siège ottoman devant Šibenik et s’empare de la forteresse de Klis."
