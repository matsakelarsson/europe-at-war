"1644–1648": "1644–1648"
"On 28 September 1644 galleys of the Knights of Malta captured an Ottoman convoy bound for Egypt with pilgrims for Mecca aboard, among them the former chief black eunuch of the sultan’s palace, who was killed. The knights stopped briefly on the south coast of Venetian Crete before sailing home with their captives. Sultan Ibrahim’s government accused Venice of complicity and prepared a great fleet, which it said was bound for Malta. Instead it appeared off Crete on 23 June 1645 and landed an army west of Chania.": "Le 28 septembre 1644, des galères des Chevaliers de Malte capturèrent un convoi ottoman à destination de l’Egypte avec des pèlerins pour la Mecque à bord, parmi lesquels l’ancien eunuque noir en chef du palais sultan, qui fut tué. Les chevaliers s’arrêtèrent brièvement sur la côte sud de la Crète vénitienne avant de rentrer chez eux avec leurs captifs. Au lieu de cela, il apparut au large de la Crète le 23 juin 1645 et débarqua une armée à l’ouest de Chania."
"Chania surrendered on 22 August after a siege of about two months, and the Venetian relief efforts, joined by papal, Tuscan, Neapolitan and Maltese galleys, came too late. In 1646 the Ottomans took Rethymno, whose citadel surrendered in November, and by early 1648 they held the whole island except Candia and a few fortified islets. Plague and war killed a large part of Crete’s people; by one estimate almost two-fifths had died by 1648.": "Chania se rendit le 22 août après un siège d’environ deux mois, et les efforts de secours vénitiens, rejoints par des galères papales, toscanes, napolitaines et maltaises, arrivèrent trop tard. En 1646, les Ottomans prirent Rethymno, dont la citadelle s’est rendue en novembre, et au début de 1648 ils détenaient toute l’île sauf Candia et quelques îlots fortifiés. La peste et la guerre tuèrent une grande partie des Crètes ; selon une estimation, près des deux cinquièmes étaient morts en 1648."
