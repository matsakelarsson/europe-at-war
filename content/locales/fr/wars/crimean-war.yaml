Bomarsund and Sveaborg in the Baltic: Bomarsund et Sveaborg dans la Baltique
1854–1855: 1854–1855
In 1854 a large British fleet under Admiral Sir Charles Napier, joined by a French squadron, sailed into the Baltic to blockade Russia’s ports. It judged Kronstadt, the sea fortress guarding Saint Petersburg, too strong to attack. In the Gulf of Bothnia British ships burned tar, timber and shipping at Oulu and Raahe in Finland, but at Kokkola local men and soldiers drove off their boats. In August about 10,000 French troops and British marines landed in the Åland Islands and besieged the unfinished fortress of Bomarsund, which surrendered on 16 August and was blown up.: En 1854, une grande flotte britannique, sous la direction de l’amiral sir Charles Napier, rejoint par un escadron français, s’embarque dans la Baltique pour bloquer les ports russes. Elle juge Kronstadt, forteresse maritime qui garde Saint-Pétersbourg, trop fort pour attaquer. Dans le golfe de Botnia, des navires britanniques brûlent du goudron, du bois et des navires à Oulu et Raahe en Finlande, mais à Kokkola, des hommes et des soldats locaux chassaient leurs bateaux. En août, environ 10 000 troupes françaises et marines britanniques débarquèrent dans les îles Åland et assiégèrent la forteresse inachevée de Bomarsund, qui se rendit le 16 août et fut explosée.
The allies returned in 1855 under Admiral Richard Dundas and Rear-Admiral Charles Pénaud. Near Kronstadt several British ships were damaged by Russian sea mines, among the first used in war. On 9–11 August 1855 the fleet bombarded Sveaborg, the island fortress off Helsinki, for two days with mortars and rockets, causing fires and explosions, but made no attempt to land. Sweden, invited to join the allies, stayed neutral. After the war a convention attached to the Treaty of Paris forbade fortifications on Åland, and the islands remain demilitarised.: Les alliés sont revenus en 1855 sous les ordres de l’amiral Richard Dundas et du contre-amiral Charles Pénaud. Près de Kronstadt, plusieurs navires britanniques ont été endommagés par des mines maritimes russes, parmi les premières utilisées pendant la guerre. La Suède, invitée à rejoindre les alliés, est restée neutre. Après la guerre, une convention annexée au Traité de Paris interdit les fortifications sur Åland et les îles restent démilitarisées.
