Crimean War: Guerre de Crimée
A war in which the Ottoman Empire, Britain, France and later Sardinia fought the Russian Empire, fearing Russian power over the declining Ottoman state. Fought on the Danube, in the Caucasus, in the Baltic and above all in Crimea, where Sevastopol fell after a siege of nearly a year, it ended with the Treaty of Paris in 1856, which barred warships from the Black Sea.: Une guerre dans laquelle l’Empire ottoman, la Grande-Bretagne, la France et plus tard la Sardaigne ont combattu l’empire russe, craignant le pouvoir russe sur l’État ottoman en déclin. Frappé sur le Danube, dans le Caucase, dans la Baltique et surtout en Crimée, où Sébastopol est tombé après un siège de près d’un an, il s’est terminé avec le traité de Paris en 1856, qui a empêché les navires de guerre de la mer Noire.
Dates are New Style (Gregorian). Russia used the Julian calendar, then 12 days behind, so Russian sources date the Battle of Sinop to 18 November 1853 and the fall of the Malakhov to 27 August 1855.: Les dates sont New Style (Gregorian). La Russie a utilisé le calendrier julien, puis 12 jours derrière, de sorte que les sources russes datent la bataille de Sinop au 18 novembre 1853 et la chute du Malakhov au 27 août 1855.
Numbers of dead are estimates. Most of the soldiers who died were killed by cholera, dysentery, typhus and the cold rather than in battle.: La plupart des soldats morts ont été tués par le choléra, la dysenterie, le typhus et le froid plutôt qu’au combat.
Places in Crimea are given their usual English names of the time. Crimea is part of Ukraine; Sevastopol, Balaklava and Yevpatoria were then Russian.: Les lieux en Crimée reçoivent leurs noms anglais habituels de l’époque. La Crimée fait partie de l’Ukraine ; Sébastopol, Balaklava et Yevpatoria étaient alors russes.
