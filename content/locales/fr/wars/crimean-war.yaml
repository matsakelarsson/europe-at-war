From the holy places to Sinop: Des lieux saints à Sinop
A quarrel between Catholic and Orthodox monks over the holy places in Palestine, backed by France and Russia, grew into a crisis when Nicholas I demanded the right to protect all the Orthodox subjects of the sultan. When the Ottomans refused, Russian troops occupied Moldavia and Wallachia in July 1853, and Britain and France sent fleets to the Dardanelles. The Ottoman Empire declared war in October. Omar Pasha’s army crossed the Danube and on 4 November held off a Russian attack at Oltenița.: Une querelle entre moines catholiques et orthodoxes sur les lieux saints en Palestine, soutenue par la France et la Russie, est devenue une crise lorsque Nicolas J’ai exigé le droit de protéger tous les sujets orthodoxes du sultan. Lorsque les Ottomans ont refusé, les troupes russes ont occupé la Moldavie et la Wallachie en juillet 1853, et la Grande-Bretagne et la France ont envoyé des flottes aux Dardanelles. L’Empire ottoman a déclaré la guerre en octobre. L’armée d’Omar Pacha a traversé le Danube et, le 4 novembre, a tenu une attaque russe à Oltenița.
On 30 November Admiral Pavel Nakhimov’s squadron attacked an Ottoman squadron at anchor in Sinop on the Anatolian coast and destroyed it with explosive shells. Nearly 3,000 Ottomans were killed, and part of the town burned. In the Caucasus Russian forces defeated Ottoman armies at Akhaltsikhe and Başgedikler. In Britain the press called Sinop a massacre. In January 1854 the British and French fleets entered the Black Sea, and at the end of March both countries declared war on Russia.: Le 30 novembre, l’escadron de l’amiral Pavel Nakhimov a attaqué un escadron ottoman à l’ancre dans le Sinop sur la côte anatolienne et l’a détruit avec des obus explosifs. Près de 3 000 Ottomans ont été tués, et une partie de la ville a brûlé. En janvier 1854, les flottes britannique et française entrèrent dans la mer Noire et, à la fin du mois de mars, les deux pays déclaraient la guerre à la Russie.
