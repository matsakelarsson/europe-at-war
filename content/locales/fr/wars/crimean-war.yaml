The Alma, Balaclava and Inkerman: Alma, Balaclava et Inkerman
September – November 1854: septembre – novembre 1854
On 14 September 1854 more than 50,000 British, French and Ottoman troops landed at Kalamita Bay, north of Sevastopol. Six days later they drove Prince Aleksandr Menshikov’s army from the heights above the Alma, with some 9,000 killed and wounded on both sides. Instead of attacking at once, the allies marched round to the south of the city, the British taking Balaklava as their base and the French the bays near Kamiesch. The Russians sank ships across the harbour mouth, and sailors, soldiers and townspeople guided by the engineer Eduard Totleben built earthworks around the city. The siege began in October.: Le 14 septembre 1854, plus de 50 000 soldats britanniques, français et ottomans débarquèrent à Kalamita Bay, au nord de Sébastopol. Six jours plus tard, ils conduisirent l’armée du prince Aleksandr Menshikov depuis les hauteurs au-dessus de l’Alma, avec environ 9 000 morts et blessés des deux côtés. Au lieu d’attaquer tout de suite, les alliés marchaient vers le sud de la ville, les Britanniques prenant Balaklava comme base et les Français les baies près de Kamiesch. Les Russes ont coulé des navires à travers l’embouchure du port, et des marins, des soldats et des citadins guidés par l’ingénieur Eduard Totleben construisirent des travaux terrestres autour de la ville. Le siège commença en octobre.
On 25 October Russian forces attacked towards Balaklava. They took redoubts held by Ottoman troops, but the 93rd Highlanders, the “thin red line”, and the Heavy Brigade stopped their cavalry. A misunderstood order then sent the British Light Brigade charging down a valley into Russian guns, with heavy losses. On 5 November, in thick fog, Russian columns attacked the British on the heights at Inkerman. The fighting broke up into a “soldiers’ battle” until French troops arrived, and the Russians lost some 11,000 men. Then winter came, and a storm on 14 November sank supply ships at Balaklava.: Le 25 octobre, les forces russes attaquèrent Balaklava. Ils prirent des révérends détenus par les troupes ottomanes, mais les 93èmes Highlanders, la ligne rouge fine et la Brigade lourde arrêtèrent leur cavalerie. Un ordre mal compris envoya alors la Brigade légère britannique chargeant une vallée dans des canons russes, avec de lourdes pertes. Le 5 novembre, dans un épais brouillard, des colonnes russes attaquèrent les Britanniques sur les hauteurs d’Inkerman. Les combats se disloquèrent en bataille de soldats jusqu’à l’arrivée des troupes françaises, et les Russes perdirent environ 11 000 hommes. L’hiver vint, et une tempête du 14 novembre coucha des navires d’approvisionnement à Balaklava.
