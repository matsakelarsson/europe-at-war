The Danube and Silistra: Le Danube et Silistra
March – August 1854: mars – août 1854
In March 1854 Russian troops crossed the lower Danube into Dobruja, and in May an army of up to 90,000 under Field Marshal Ivan Paskevich laid siege to Silistra. The fortress was held by 12,000–18,000 Ottoman and Egyptian troops, helped by a few British officers, and it held out for six weeks. Meanwhile British and French troops landed at Varna, and Austria, alarmed by a Russian advance towards the Balkans, massed troops on its borders and demanded that Russia leave the principalities.: En mars 1854, les troupes russes traversèrent le Danube inférieur pour rejoindre Dobruja et, en mai, une armée pouvant aller jusqu’à 90 000 hommes sous la direction du maréchal de campagne Ivan Paskevich assiégea Silistra. La forteresse fut tenue par 12 000 à 18 000 soldats ottomans et égyptiens, aidés par quelques officiers britanniques, et elle se déroula pendant six semaines. Pendant ce temps, les troupes britanniques et françaises débarquèrent à Varna, et l’Autriche, alarmée par une avancée russe vers les Balkans, monta des troupes à ses frontières et demanda à la Russie de quitter les principautés.
On 23 June, hours before a planned assault, the Russians lifted the siege on Nicholas I’s orders and withdrew north of the Danube. Ottoman troops beat a Russian force on the islands at Giurgiu in July. By August the Russians had left Moldavia and Wallachia, which Austrian troops occupied until 1857. Cholera killed thousands of British and French soldiers around Varna and in a French expedition into Dobruja. With the Danube secure, the allies decided to attack Sevastopol, the base of Russia’s Black Sea Fleet.: Le 23 juin, quelques heures avant une attaque planifiée, les Russes ont levé le siège sur les ordres de Nicholas I.S. et se sont retirés au nord du Danube. Les troupes ottomanes ont battu une force russe sur les îles de Giurgiu en juillet. En août, les Russes avaient quitté la Moldavie et la Wallachie, que les troupes autrichiennes occupaient jusqu’en 1857. Avec le Danube sécurisé, les alliés ont décidé d’attaquer Sébastopol, la base de la flotte russe de la mer Noire.
