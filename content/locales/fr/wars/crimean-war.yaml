Kerch expedition: Expédition Kerch
Kars and the Treaty of Paris: Kars et le Traité de Paris
1855–1856: 1855–1856
In June 1855 General Nikolay Muravyov besieged Kars, the main Ottoman fortress in eastern Anatolia, defended by Ottoman troops under the British general William Fenwick Williams. A Russian assault on 29 September was beaten off with heavy losses. Omar Pasha landed an army in Abkhazia to relieve the city by way of Mingrelia but advanced too slowly, and on 28 November the starving garrison surrendered. Facing an Austrian threat to join the allies, Alexander II agreed to make peace.: En juin 1855, le général Nikolay Muravyov assiégea Kars, la principale forteresse ottomane de l’est de l’Anatolie, défendue par les troupes ottomanes sous le général britannique William Fenwick Williams. Une attaque russe le 29 septembre fut battue avec de lourdes pertes. Omar Pacha débarqua une armée en Abkhazie pour soulager la ville par Mingrelia mais progressa trop lentement, et le 28 novembre la garnison affamée se rendit. Face à une menace autrichienne de rejoindre les alliés, Alexandre II a accepté de faire la paix.
By the Treaty of Paris, signed on 30 March 1856, the Black Sea was made neutral and closed to warships, with no naval arsenals on its shores. Russia returned Kars and gave the southern part of Bessarabia, at the mouths of the Danube, to Moldavia, and the allies returned Sevastopol. Moldavia and Wallachia were placed under the guarantee of all the powers instead of Russia’s protection. Hundreds of thousands of soldiers had died, most of them from disease. Defeat helped push Alexander II towards reforms, above all the abolition of serfdom in 1861.: Par le traité de Paris, signé le 30 mars 1856, la mer Noire a été rendue neutre et fermée aux navires de guerre, sans arsenal naval sur ses côtes. La Russie est revenue Kars et a donné la partie sud de Bessarabia, à l’embouchure du Danube, à la Moldavie, et les alliés ont rendu Sébastopol. La Moldavie et la Wallachie ont été placées sous la garantie de toutes les puissances au lieu de la protection de la Russie. Des centaines de milliers de soldats étaient morts, la plupart d’entre eux de maladie. La défaite a aidé à pousser Alexandre II vers des réformes, surtout l’abolition du servage en 1861.
