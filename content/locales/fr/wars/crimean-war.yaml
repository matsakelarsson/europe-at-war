The fall of Sevastopol: La chute de Sébastopol
Through the winter both armies suffered terribly from cold, hunger and disease. Reports by the war correspondent William Howard Russell turned British opinion against the government, which fell in January 1855, and Florence Nightingale led nurses at the army hospital at Scutari. Nicholas I died in March and was succeeded by Alexander II. The Kingdom of Sardinia joined the allies and sent some 18,000 men. Ottoman troops beat off a Russian attack on Yevpatoria in February, and in May an allied expedition took Kerch and opened the Sea of Azov.: Pendant l’hiver, les deux armées souffraient terriblement du froid, de la faim et de la maladie. Les rapports du correspondant de guerre William Howard Russell tournèrent l’opinion britannique contre le gouvernement, qui tombait en janvier 1855, et Florence Nightingale menait des infirmières à l’hôpital militaire de Scutari. Nicholas Ier mourut en mars et fut remplacé par Alexandre II. Le Royaume de Sardaigne se joignit aux alliés et envoya quelque 18 000 hommes. Les troupes ottomanes ont battu une attaque russe contre Yevpatoria en février, et en mai une expédition alliée a pris Kerch et ouvert la mer d’Azov.
An allied assault on the Malakhov and the Redan on 18 June failed with heavy losses. Admiral Nakhimov was mortally wounded in July. A Russian attempt to break the siege was beaten by French and Sardinian troops on the Chernaya on 16 August. After a massive bombardment, French troops under General Patrice de MacMahon stormed the Malakhov on 8 September, while the British attack on the Redan failed. That night the Russians blew up their forts, sank their remaining ships and withdrew across a pontoon bridge to the north side of the harbour.: Une attaque alliée contre le Malakhov et le Redan le 18 juin a échoué avec de lourdes pertes. L’amiral Nakhimov a été mortellement blessé en juillet. Une tentative russe pour briser le siège a été battue par les troupes françaises et sardes sur le Chernaya le 16 août. Après un bombardement massif, les troupes françaises sous la direction du général Patrice de MacMahon ont pris le Malakhov le 8 septembre, tandis que l’attaque britannique sur le Redan a échoué. Cette nuit-là, les Russes ont fait sauter leurs forts, coulé leurs navires restants et se sont retirés à travers un ponton vers le côté nord du port.
