# French translations of the catalogue text (wave 14); step bodies follow later.
Cristero War: Guerre des Cristeros
? A Catholic rising against the anticlerical laws of the Mexican revolutionary state, fought mainly in the west-central states of Jalisco, Michoacán, Guanajuato, Colima, Zacatecas and Aguascalientes. The 1917 constitution barred the Church from owning property and from running schools, banned religious orders and public worship outside churches and let the states limit the number of priests. President Plutarco Elías Calles enforced these articles strictly, and when the Calles Law of June 1926 set penalties for breaking them, the bishops suspended public worship from 31 July 1926. Armed risings began in August and spread after a call to arms on 1 January 1927. The rebels, mostly rancheros and peasants, called themselves Cristeros after their cry “¡Viva Cristo Rey!” (Long live Christ the King); by 1929 they had perhaps 50,000 men under arms, supplied with ammunition by the women of the Brigades of Saint Joan of Arc, and held much of the countryside of Jalisco. The federal army, with agrarista militias and arms from the United States, held the towns. Both sides killed prisoners and civilians. After the assassination of President-elect Álvaro Obregón by a Catholic militant in 1928, the US ambassador Dwight Morrow brokered the arreglos (arrangements) of 21 June 1929 between the bishops and President Emilio Portes Gil, which allowed worship to resume without repealing the laws. The Cristeros, who had not been consulted, laid down their arms. About 90,000 combatants died, and many civilians; hundreds of Cristero leaders were killed after the amnesty, and a second, smaller rising followed in the 1930s.
: "Un soulèvement catholique contre les lois anticléricales de l’État révolutionnaire mexicain, qui se déroula principalement dans les États du centre-ouest : Jalisco, Michoacán, Guanajuato, Colima, Zacatecas et Aguascalientes. La constitution de 1917 interdisait à l’Église de posséder des biens et de diriger des écoles, proscrivait les ordres religieux et le culte public hors des églises, et permettait aux États de limiter le nombre de prêtres. Le président Plutarco Elías Calles fit appliquer strictement ces articles et, lorsque la loi Calles de juin 1926 fixa des peines pour leur violation, les évêques suspendirent le culte public à partir du 31 juillet 1926. Des soulèvements armés éclatèrent en août et s’étendirent après un appel aux armes lancé le 1er janvier 1927. Les rebelles, pour la plupart des rancheros et des paysans, se nommèrent Cristeros d’après leur cri « ¡Viva Cristo Rey! » (Vive le Christ-Roi !) ; en 1929, ils avaient peut-être 50 000 hommes sous les armes, ravitaillés en munitions par les femmes des Brigades de Sainte-Jeanne-d’Arc, et tenaient une grande partie des campagnes du Jalisco. L’armée fédérale, avec des milices agraristes et des armes venues des États-Unis, tenait les villes. Les deux camps tuèrent des prisonniers et des civils. Après l’assassinat du président élu Álvaro Obregón par un militant catholique en 1928, l’ambassadeur américain Dwight Morrow négocia les arreglos (arrangements) du 21 juin 1929 entre les évêques et le président Emilio Portes Gil, qui permirent la reprise du culte sans abrogation des lois. Les Cristeros, qui n’avaient pas été consultés, déposèrent les armes. Environ 90 000 combattants périrent, ainsi que de nombreux civils ; des centaines de chefs cristeros furent tués après l’amnistie, et un second soulèvement, de moindre ampleur, suivit dans les années 1930."
