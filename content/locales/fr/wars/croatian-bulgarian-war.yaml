# Some French text was translated automatically.
"Croatian–Bulgarian war": "Guerre croate-bulgare"
"A short war between Simeon I of Bulgaria and King Tomislav of Croatia. After annexing Serbia in 924, Simeon regarded Croatia, which sheltered Serbian exiles and was allied to Byzantium, as a threat to his rear, and in 926 he sent an army under Alogobotur against it. The Croats destroyed it in the mountains of eastern Bosnia, in what is called the battle of the Bosnian Highlands. Papal envoys led by Bishop Madalbert arranged a peace after Simeon’s death in 927, with no change of borders.": "Après avoir annexé la Serbie en 924, Siméon considérait la Croatie, qui abritait les exilés serbes et était allié à Byzance, comme une menace pour son arrière, et en 926 il envoya une armée sous Alogobotur contre elle. Les Croates l’ont détruite dans les montagnes de Bosnie orientale, dans ce qu’on appelle la bataille des Hauts-Terres bosniaques. Les envoyés pontificaux dirigés par Mgr Madalbert arrangent la paix après la mort de Siméon en 927, sans changer les frontières."
"The only accounts are Byzantine, in Constantine VII’s De administrando imperio and Theophanes Continuatus. The battlefield is unknown, and the date of 27 May 926 found in some modern works is uncertain. Constantine VII’s figures for the Croatian army (100,000 foot and 60,000 horse) are generally thought greatly exaggerated.": "Les seuls récits sont byzantin, dans Constantin VII. De administrando imperio et Theophanes Continuatus. Le champ de bataille est inconnu, et la date du 27 mai 926 trouvé dans certaines œuvres modernes est incertaine. Constantin VII. Les chiffres pour l’armée croate (100 000 pieds et 60 000 chevaux) sont généralement considérés très exagérés."
"Simeon’s wider war with Byzantium is told in the Byzantine–Bulgarian war of 913–927.": "La guerre de Siméon avec Byzance est racontée dans la guerre byzantine-bulgarie du 913-927."
