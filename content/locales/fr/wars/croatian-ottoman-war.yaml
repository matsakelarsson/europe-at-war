# Some French text was translated automatically.
"Hundred Years’ Croatian–Ottoman War": "Cent ans de guerre croate-ottomane"
? "The name Croatian historians give to the century of border warfare between Croatia and the Ottoman Empire, from the defeat at Krbava Field to the victory at Sisak. On 9 September 1493 an army of Croatian nobles under Ban Emerik Derenčin tried to cut off Ottoman raiders returning from Carniola and was destroyed near Udbina; Derenčin was captured and many nobles died. Ottoman raids and conquests then ate away at Croatia for decades. Knin fell in 1522, Jajce in 1528, Požega in 1536, and Klis, defended by the Uskok captain Petar Kružić, in 1537; in the same year a Habsburg army under Johann Katzianer was destroyed at Gorjani in Slavonia. After Mohács the Croatian estates elected Ferdinand of Habsburg king at Cetin in 1527, and the frontier gradually became the Military Frontier, financed by the Austrian lands and garrisoned by soldiers and refugees, Croats, Vlachs and Serbs, settled as frontiersmen; Karlovac was founded as its stronghold in 1579. What remained free was called “the remnants of the remnants” of the old kingdom. The fall of Bihać in 1592 opened the way to the heartland, but on 22 June 1593 an army of Croatian, Slovene and Austrian troops destroyed the army of Hasan Pasha Predojević, governor of Bosnia, at Sisak. The battle started the Long Turkish War and is seen in Croatia as the end of the Ottoman advance."
: "Le nom d’historiens croates donne au siècle de la guerre frontalière entre la Croatie et l’Empire ottoman, depuis la défaite à Krbava Field jusqu’à la victoire à Sisak. Le 9 septembre 1493 une armée de nobles croates sous Ban Emerik Derenčin a essayé de couper les raideurs ottomans revenant de Carniola et a été détruite près d’Udbina ; Derenčin a été capturé et beaucoup de nobles sont morts. Knin est tombé en 1522, Jajce en 1528, Požega en 1536 et Klis, défendu par le capitaine Ouskok Petar Kružić, en 1537 ; la même année, une armée de Habsbourg sous Johann Katzianer a été détruite à Gorjani en Slavonie. Après Mohács les domaines croates ont élu Ferdinand de Habsbourg roi à Cetin en 1527, et la frontière est progressivement devenue la Frontière militaire, financé par les terres autrichiennes et garnison par des soldats et des réfugiés, Croates, Vlachs et Serbes, s’établissant comme des hommes frontières ; Karlovac a été fondé comme sa forteresse en 1579. Ce qui restait libre était appelé les restes du vieux royaume. La chute de Bihać en 1592 ouvrit la voie au cœur du pays, mais le 22 juin 1593 une armée de troupes croates, slovènes et autrichiennes détruisit l’armée de Hasan Pacha Predojević, gouverneur de Bosnie, à Sisak. La bataille commença la longue guerre turque et est considérée en Croatie comme la fin de l’avancée ottomane."
"The term is used mainly in Croatian historiography. Most of the fighting was raiding and small-scale siege warfare rather than open battles, and thousands of people were carried off and sold as slaves.": "Le terme est utilisé principalement dans l’historiographie croate. La plupart des combats ont été des raids et des guerres de siège à petite échelle plutôt que des batailles ouvertes, et des milliers de personnes ont été emportées et vendues comme esclaves."
"The Ottoman conquest of Hungary and the Long Turkish War have their own entries.": "La conquête ottomane de la Hongrie et la longue guerre turque ont leurs propres entrées."
