"Orkan rockets with cluster munitions killed seven people and wounded more than 200 in the capital. The ICTY found Martić responsible.": "Des roquettes Orkan avec des armes à sous-munitions ont tué sept personnes et blessé plus de 200 personnes dans la capitale. Le TPIY a trouvé Martić responsable."
"5 August 1995": "5 août 1995"
"The Krajina capital fell on the second day of Storm, after the Split Corps under Ante Gotovina came down from the Dinara.": "La capitale de la Krajina est tombée le deuxième jour de tempête, après que le corps de Split sous Ante Gotovina soit descendu du Dinara."
"Tržačka Raštela": "Tržačka Raštela"
"6 August 1995": "6 août 1995"
"Croatian troops linked up with the Bosnian 5th Corps near Rakovica, ending the three-year siege of the Bihać pocket; the meeting was staged for the press here.": "Les troupes croates se sont liées au 5e Corps bosniaque près de Rakovica, mettant fin au siège de la poche Bihać pendant trois ans ; la réunion a été organisée pour la presse ici."
"Glina and Petrinja": "Glina et Petrinja"
"August 1995": "août 1995"
"The Krajina Banija Corps put up a tough defence here before it was defeated, its reserve pinned down by the Bosnian army.": "Le Corps de la Krajina Banija a mis en place une défense difficile avant sa défaite, sa réserve appuyée par l’armée bosniaque."
"Varivode": "Varivode"
"28 September 1995": "28 septembre 1995"
"Croatian soldiers and police killed nine Serb villagers aged 60 to 85. In 2012 the Croatian Supreme Court held the state responsible.": "Les soldats et la police croates ont tué neuf villageois serbes âgés de 60 à 85 ans. En 2012, la Cour suprême croate a tenu l’État responsable."
