"UN Sector West": "Secteur de l’ONU Ouest"
"The Serb-held part of western Slavonia around Okučani, astride the Zagreb–Belgrade motorway.": "La partie serbe de la Slavonie occidentale autour d’Okučani, sillonne l’autoroute Zagreb-Belgrade."
"UN Sector North": "Secteur ONU Nord"
"Banovina and Kordun, south of Sisak and Karlovac.": "Banovina et Kordun, au sud de Sisak et Karlovac."
"UN Sector South": "Secteur ONU Sud"
"Lika and northern Dalmatia around Knin, the core of the Krajina.": "Lika et la Dalmatie du Nord autour de Knin, le noyau de la Krajina."
"Miljevci plateau": "Plateau de Miljevci"
"21–22 June 1992": "21–22 juin 1992"
"Croatian forces took the plateau between the Krka and Drniš, inside the UN-protected zone.": "Les forces croates ont pris le plateau entre la Krka et Drniš, à l’intérieur de la zone protégée par les Nations Unies."
"Republic of Serbian Krajina and the UN Protected Areas, 1992 (approximate)": "République serbe de Krajina et zones protégées par l’ONU, 1992 (approximative)"
"Maslenica and the Medak Pocket": "Maslenica et la poche de Medak"
"January – September 1993": "janvier – septembre 1993"
"The Serb-held strip around Maslenica left Dalmatia joined to northern Croatia only by ferries and the Pag bridge. On 22 January 1993 the Croatian army attacked, retaking the Maslenica crossing, Zemunik airport and the hinterland of Zadar, and on 28 January the Peruća dam, which Serb forces had mined. Croatian sources put the dead at 114 Croatian and 490 Serb soldiers. The villages of Islam Grčki, Kašić and Smoković were burned. The UN Security Council condemned the offensive.": "Le 22 janvier 1993, l’armée croate a attaqué le passage de Maslenica, l’aéroport de Zemunik et l’arrière-pays de Zadar, et le 28 janvier, le barrage de Peruca, que les forces serbes avaient miné. Des sources croates ont mis les morts à 114 soldats croates et 490 Serbes. Les villages d’Islam Grčki, Kašić et Smoković ont été brûlés. Le Conseil de sécurité des Nations unies a condamné l’offensive."
"On 9 September Croatian troops attacked the Medak Pocket, a Serb-held salient on the edge of Gospić from which the town was shelled. They took the villages of Divoselo, Čitluk and part of Počitelj, but under international pressure withdrew after a week; by UN and Canadian accounts they exchanged fire with Canadian peacekeepers moving in. The villages were destroyed. ICTY investigators found that at least 100 Serbs had been unlawfully killed; a Croatian court later convicted the commander Mirko Norac of failing to stop the killings of civilians and prisoners.": "Le 9 septembre, les troupes croates ont attaqué la poche de Medak, un saillant tenu par les Serbes au bord de Gospić d’où la ville a été bombardée. Elles ont pris les villages de Divoselo, Čitluk et une partie de Počitelj, mais sous la pression internationale s’est retirée après une semaine ; selon les rapports des Nations Unies et du Canada, elles ont échangé le feu avec des soldats de la paix canadiens qui se sont installés. Les enquêteurs du TPIY ont constaté qu’au moins 100 Serbes avaient été tués illégalement ; un tribunal croate a par la suite condamné le commandant Mirko Norac de ne pas avoir arrêté les meurtres de civils et de prisonniers."
"Operation Maslenica": "Opération Maslenica"
"22 January 1993": "22 janvier 1993"
"Operation Medak Pocket": "Opération Medak Pocket"
"9–17 September 1993": "9–17 septembre 1993"
"Serb civilians killed at Medak": "Des civils serbes tués à Medak"
"at least 29 identified (ICTY investigators: at least 100 Serbs unlawfully killed)": "au moins 29 personnes identifiées (enquêteurs de la Cour pénale internationale : au moins 100 Serbes tués illégalement)"
"Maslenica": "Maslenica"
"The crossing where the bridge had been destroyed in 1991; its capture reopened a land route to Dalmatia, first by a pontoon bridge.": "Le passage à niveau où le pont avait été détruit en 1991 ; sa capture rouvrit une route terrestre vers la Dalmatie, d’abord par un ponton."
"Zemunik airport": "Aéroport de Zemunik"
"January 1993": "janvier 1993"
"Zadar’s airport, held by Krajina forces since 1991, was retaken.": "L’aéroport de Zadar, tenu par les forces de la Krajina depuis 1991, a été repris."
"Peruća dam": "Barrage de Péroua"
"28 January 1993": "28 janvier 1993"
"Krajina forces had chased off the UN guards and mined the dam above the Cetina valley. The charges they set off as they retreated damaged it, but it held.": "Les forces de la Krajina avaient chassé les gardes de l’ONU et miné le barrage au-dessus de la vallée de Cetina."
"Medak Pocket": "Pochette Medak"
"About 400 Serb civilians lived in the pocket before the attack. Twenty-nine executed civilians and five killed prisoners were identified, and Serb property was systematically looted and destroyed.": "Environ 400 civils serbes vivaient dans la poche avant l’attaque, 29 civils exécutés et 5 prisonniers tués ont été identifiés, et les biens serbes ont été systématiquement pillés et détruits."
"1991–1995": "1991–1995"
"The town remained in Croatian hands throughout the war but was regularly shelled from the Serb-held hills to its south and east.": "La ville est restée entre les mains des Croates tout au long de la guerre, mais elle a été régulièrement bombardée à partir des collines tenues par les Serbes au sud et à l’est."
"Islam Grčki": "Islam Grčki"
"This Serb village, with Kašić and Smoković, was burned by Croatian forces, and many civilians fled.": "Ce village serbe, avec Kašić et Smoković, a été brûlé par les forces croates, et de nombreux civils ont fui."
"To the Peruća dam": "Au barrage de Peruca"
"Held by the RSK, late 1993 – April 1995 (approximate)": "Tenue par la RSK, fin 1993 – avril 1995 (approximative)"
"Retaken by Croatia, June 1992 – January 1993 (approximate)": "Reprise par la Croatie, juin 1992 – janvier 1993 (approximative)"
"Medak Pocket, taken 9–15 September 1993 and handed to UN troops": "Medak Pocket, pris du 9 au 15 septembre 1993 et remis aux troupes de l’ONU"
"Flash and Storm": "Flash et tempête"
"May – August 1995": "mai – août 1995"
"A ceasefire in March 1994 and an economic agreement in December reopened the Zagreb–Belgrade motorway through western Slavonia, but Krajina leaders refused even to receive the Z-4 peace plan in January 1995. On 1 May the Croatian army launched Operation Flash and in three days took the 558 km² Serb-held salient around Okučani. Of about 14,000 Serbs there, most fled. In reply Krajina forces fired cluster rockets at Zagreb on 2 and 3 May, killing seven people; the ICTY convicted Martić for the attacks.": "Un cessez-le-feu en mars 1994 et un accord économique en décembre ont rouvert l’autoroute Zagreb-Belgrade à travers la Slavonie occidentale, mais les dirigeants de la Krajina ont même refusé de recevoir le plan de paix Z-4 en janvier 1995. Le 1er mai, l’armée croate a lancé l’opération Flash et a pris en trois jours le saillant serbe de 558 km2 autour d’Okučani. En réponse, les forces de la Krajina ont tiré des roquettes à sous-munitions sur Zagreb les 2 et 3 mai, tuant sept personnes ; le TPIY a condamné Martić pour ces attaques."
"In late July Croatian and Bosnian Croat forces took Bosansko Grahovo and Glamoč in Bosnia, outflanking Knin. Operation Storm began on 4 August along a 630 km front. Knin fell the next day, and on 6 August Croatian troops linked up with the Bosnian army’s 5th Corps, ending the siege of Bihać. Within four days Croatia had retaken 10,400 km², the whole of the Krajina except eastern Slavonia.": "Fin juillet, les forces croates et croates de Bosnie ont pris Bosansko Grahovo et Glamoč en Bosnie, dépassant Knin. L’opération Tempête a commencé le 4 août sur un front de 630 km. Knin est tombé le lendemain, et le 6 août les troupes croates liées avec l’armée bosniaque du 5ème Corps, mettant fin au siège de Bihać. En quatre jours, la Croatie avait repris 10 400 km2, l’ensemble de la Krajina sauf la Slavonie orientale."
"On 4 August the Krajina authorities ordered the evacuation of northern Dalmatia and Lika, and 150,000–200,000 Serbs fled to Bosnia and Serbia. Many of the elderly who stayed were killed in the following months, as at Grubori and Varivode, and villages were looted and burned; ICTY prosecutors put the civilian dead at 324, Serbian sources at 1,192. The tribunal convicted the generals Ante Gotovina and Mladen Markač in 2011, but acquitted them on appeal in 2012, rejecting the charge of a plan to expel the Serbs.": "Le 4 août, les autorités de la Krajina ont ordonné l’évacuation de la Dalmatie du Nord et de Lika et 150 000 à 200 000 Serbes se sont enfuis en Bosnie et en Serbie. Beaucoup des personnes âgées qui étaient restées ont été tuées au cours des mois suivants, comme à Grubori et Varivode, et des villages ont été pillés et brûlés ; les procureurs du TPIY ont fait 324 morts parmi les civils, dont 1 192 sources serbes. Le tribunal a condamné les généraux Ante Gotovina et Mladen Markač en 2011, mais les a acquittés en appel en 2012, rejetant l’accusation de projet d’expulsion des Serbes."
"Operation Flash": "Opération Flash"
"1–3 May 1995, 558 km² retaken": "1er-3 mai 1995, 558 km2 repris"
"Operation Storm": "Opération Tempête"
"4–7 August 1995, 10,400 km² retaken": "4-7 août 1995, 10 400 km2 repris"
"Serbs who fled": "Serbes qui ont fui"
"150,000–200,000": "150,000–200,000"
"The Bosnian War": "La guerre de Bosnie"
"Okučani": "Okučani"
"2 May 1995": "2 mai 1995"
"Croatian columns from Novska and Nova Gradiška met at the town; the last organised Krajina resistance in western Slavonia ended on 3 May.": "Les colonnes croates de Novska et Nova Gradiška se sont rencontrées dans la ville ; la dernière résistance organisée de Krajina en Slavonie occidentale s’est terminée le 3 mai."
"Rocket attacks on Zagreb": "Attaques de roquettes contre Zagreb"
