"Sarajevo": "Sarajevo"
"2 January 1992": "2 janvier 1992"
"The implementation agreement of the Vance plan, signed in Sarajevo, brought a ceasefire that took effect on 3 January and largely held.": "L’accord de mise en œuvre du plan Vance, signé à Sarajevo, a instauré un cessez-le-feu qui est entré en vigueur le 3 janvier et qui s’est largement déroulé."
"19 December 1991": "19 décembre 1991"
