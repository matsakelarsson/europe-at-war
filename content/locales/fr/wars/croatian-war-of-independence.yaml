"Franjo Tuđman’s Croatian Democratic Union won Croatia’s first multi-party elections in spring 1990. Many of the republic’s Serbs, about an eighth of the population, feared the new government, and Belgrade’s media told them they faced persecution. On 17 August 1990 Serbs around Knin, led by Milan Babić and the local police chief Milan Martić, blocked the roads into Dalmatia with felled trees to protect a referendum on Serb autonomy. The “Log Revolution” cut the coast off from the rest of Croatia in the middle of the tourist season.": "L’Union démocratique croate a remporté les premières élections multipartites en Croatie au printemps 1990. Beaucoup de Serbes de la république, environ un huitième de la population, craignaient le nouveau gouvernement, et les médias de Belgrade leur ont dit qu’ils étaient persécutés. Le 17 août 1990, les Serbes autour de Knin, dirigés par Milan Babić et le chef de la police locale Milan Martić, ont bloqué les routes vers la Dalmatie avec des arbres abattus pour protéger un référendum sur l’autonomie serbe. La Révolution de Log a coupé la côte du reste de la Croatie au milieu de la saison touristique."
"On 21 December the Serb-run municipalities of Knin, Benkovac, Obrovac, Gračac, Vojnić, Dvor and Kostajnica adopted a statute for a Serbian Autonomous Region (SAO) of Krajina. More than two hundred armed incidents followed. In March 1991 Krajina forces clashed with Croatian police at Pakrac, and on 31 March at the Plitvice Lakes, where the policeman Josip Jović and the Krajina fighter Rajko Vukadinović were killed. The next day the SAO Krajina declared that it was leaving Croatia to join Serbia, and the JNA moved in between the two sides.": "Le 21 décembre, les municipalités serbes de Knin, Benkovac, Obrovac, Gračac, Vojnić, Dvor et Kostajnica ont adopté un statut pour une région autonome serbe (SAO) de la Krajina. En mars 1991, les forces de la Krajina ont affronté la police croate à Pakrac, et le 31 mars aux lacs de Plitvice, où le policier Josip Jović et le combattant de la Krajina Rajko Vukadinović ont été tués. Le lendemain, la SAO Krajina a déclaré qu’elle quittait la Croatie pour rejoindre la Serbie, et la JNA s’est installée entre les deux parties."
