"On 1 October 1991 the JNA attacked the Dubrovnik region from Montenegro and eastern Herzegovina, with many Montenegrin reservists in its ranks, while the Yugoslav Navy blockaded the coast. Cavtat fell on 16 October, and by the end of the month the army held almost all the land between the Pelješac peninsula and Prevlaka except Dubrovnik itself, defended at first by a few hundred poorly armed men. Villages in Konavle and the Dubrovnik hinterland were looted and burned.": "Le 1er octobre 1991, la JNA a attaqué la région de Dubrovnik depuis le Monténégro et l’est de l’Herzégovine, avec de nombreux réservistes monténégrins dans ses rangs, tandis que la marine yougoslave bloquait la côte. Cavtat est tombé le 16 octobre, et à la fin du mois, l’armée tenait presque toute la terre entre la péninsule de Pelješac et Prevlaka, sauf Dubrovnik lui-même, défendue au début par quelques centaines d’hommes mal armés. Des villages de Konavle et de l’arrière-pays de Dubrovnik ont été pillés et brûlés."
"The city was shelled for months, most heavily on 6 December, when the walled Old Town, a World Heritage Site, was hit. The bombardment caused international outrage and helped bring about recognition of Croatia. About 16,000 refugees were evacuated by sea. In May 1992 the JNA pulled back into Herzegovina and handed its equipment to the Bosnian Serb army, and by the end of 1992 Croatian forces had retaken the whole region. The ICTY convicted the commanders Pavle Strugar and Miodrag Jokić for the attacks on the Old Town.": "La ville a été bombardée pendant des mois, surtout le 6 décembre, lorsque la vieille ville fortifiée, un site du patrimoine mondial, a été touchée. Le bombardement a provoqué l’indignation internationale et contribué à faire reconnaître la Croatie. Environ 16 000 réfugiés ont été évacués par mer. En mai 1992, la JNA est revenue en Herzégovine et a remis son matériel à l’armée serbe de Bosnie, et à la fin de 1992, les forces croates ont repris toute la région. Le TPIY a condamné les commandants Pavle Strugar et Miodrag Jokić pour les attaques contre la vieille ville."
