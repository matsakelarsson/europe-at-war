"From 14 September Croatian forces blockaded JNA barracks across the country and captured many, including all those of the Varaždin corps, gaining the heavy weapons they had lacked. The JNA answered with a full offensive. Vukovar on the Danube, held by about 1,800 guardsmen and volunteers, was besieged for 87 days by up to 36,000 troops and Serbian paramilitaries and reduced to ruins. On 7 October Yugoslav aircraft bombed the presidential palace in Zagreb; the next day Croatia cut its last ties with Yugoslavia.": "À partir du 14 septembre, les forces croates ont bloqué les casernes de la JNA dans tout le pays et en ont capturé beaucoup, y compris tous ceux du corps Varaždin, obtenant les armes lourdes dont ils avaient besoin. La JNA a répondu par une offensive complète. Vukovar sur le Danube, détenu par environ 1 800 gardes et volontaires, a été assiégé pendant 87 jours par jusqu’à 36 000 soldats et paramilitaires serbes et réduit en ruines. Le 7 octobre, des avions yougoslaves ont bombardé le palais présidentiel de Zagreb ; le lendemain, la Croatie a rompu ses derniers liens avec la Yougoslavie."
"Vukovar fell on 18 November. About 3,000 people had died in the battle, and at least 20,000 inhabitants were expelled. On 20 November some 200 prisoners taken from the town’s hospital were shot at the Ovčara farm; the ICTY convicted the JNA officers Mile Mrkšić and Veselin Šljivančanin. Seventy Croat civilians were killed at Lovas in October, and 62 civilians and five prisoners at Škabrnja near Zadar on 18–19 November, crimes for which the tribunal convicted the Krajina leaders Babić and Martić.": "Vukovar est tombé le 18 novembre. Environ 3 000 personnes sont mortes dans la bataille et au moins 20 000 habitants ont été expulsés. Le 20 novembre, 200 prisonniers de l’hôpital municipal ont été abattus à la ferme d’Ovčara ; le TPIY a condamné les officiers de la JNA Mile Mrkšić et Veselin Šljivančanin. Soixante-dix civils croates ont été tués à Lovas en octobre et 62 civils et cinq prisonniers à Škabrnja, près de Zadar, les 18 et 19 novembre, crimes pour lesquels le tribunal a condamné les dirigeants de la Krajina Babić et Martić."
"Serb civilians were also killed on the Croatian side. In October 100–120 people, most of them Serbs, were murdered in Gospić on the orders of local commanders, and in December soldiers killed 18 Serbs and a Hungarian at Paulin Dvor near Osijek; Croatian courts later convicted those responsible. In late 1991 Croatian offensives in western Slavonia, Otkos 10 and Orkan 91, retook much of the area the JNA had seized there.": "Des civils serbes ont également été tués du côté croate. En octobre, de 100 à 120 personnes, pour la plupart des Serbes, ont été assassinées à Gospić sur ordre de commandants locaux et en décembre, des soldats ont tué 18 Serbes et un Hongrois à Paulin Dvor près d’Osijek ; les tribunaux croates ont ensuite condamné les responsables. À la fin de 1991, les offensives croates en Slavonie occidentale, en Otkos et en Orkan 91, ont repris une grande partie de la zone que la JNA avait saisie."
