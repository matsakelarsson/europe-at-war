"The Sarajevo ceasefire and the UN Protected Areas": "Le cessez-le-feu de Sarajevo et les zones protégées par l’ONU"
"January – June 1992": "janvier – juin 1992"
"The UN envoy Cyrus Vance negotiated a ceasefire signed in Geneva on 23 November 1991, which did not hold, and an implementation agreement signed in Sarajevo on 2 January 1992 by the JNA general Andrija Rašeta and Croatia’s defence minister Gojko Šušak, which did. Under the Vance plan the Serb-held areas became UN Protected Areas in four sectors, East, West, North and South, patrolled by the UN Protection Force (UNPROFOR) from spring 1992. The JNA was to leave, local forces to disarm and refugees to return.": "L’envoyé des Nations unies Cyrus Vance a négocié un cessez-le-feu signé à Genève le 23 novembre 1991, qui n’a pas eu lieu, et un accord de mise en oeuvre signé à Sarajevo le 2 janvier 1992 par le général Andrija Rašeta et le ministre croate de la défense Gojko Šušak. Dans le cadre du plan Vance, les zones tenues par les Serbes sont devenues des zones protégées de l’ONU dans quatre secteurs, à savoir l’est, l’ouest, le nord et le sud, patrouilles par la Force de protection des Nations Unies (FORPRONU) depuis le printemps 1992."
"Only the first part was carried out. The Krajina Serbs, who had proclaimed the Republic of Serbian Krajina on 19 December 1991, kept their weapons under police and army names, and few of the 170,000–250,000 Croats and other non-Serbs driven from the area could return. The European Community recognised Croatia on 15 January 1992, and it joined the UN on 22 May. The front now ran through a quarter of the country, and fighting flared at its edges, as on the Miljevci plateau in June.": "Les Serbes de Krajina, qui avaient proclamé la République serbe de Krajina le 19 décembre 1991, gardaient leurs armes sous les noms de la police et de l’armée, et peu des 170 000 à 250 000 Croates et autres non-Serbes chassés de la région pouvaient revenir. La Communauté européenne a reconnu la Croatie le 15 janvier 1992 et elle est entrée aux Nations unies le 22 mai. Le front traversait maintenant un quart du pays, et les combats ont éclaté à ses bords, comme sur le plateau de Miljevci en juin."
"Implementation agreement": "Accord de mise en œuvre"
"2 January 1992, Sarajevo": "2 janvier 1992, Sarajevo"
"EC recognition of Croatia": "Reconnaissance CE de la Croatie"
"15 January 1992": "15 janvier 1992"
"Area held by the RSK": "Zone détenue par la RSK"
