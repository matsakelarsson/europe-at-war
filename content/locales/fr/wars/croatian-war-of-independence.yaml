"Zagreb Corps": "Corps de Zagreb"
"5th Corps": "5e Corps"
"Retaken in Operation Flash, 1–3 May 1995": "Reprise de l’opération Flash, du 1er au 3 mai 1995"
"Retaken in Operation Storm, 4–7 August 1995": "Reprise de l’opération Tempête, 4-7 août 1995"
"Still held by Serb forces, August 1995": "Toujours détenu par les forces serbes, août 1995"
"Erdut and the UN transition": "Erdut et la transition de l’ONU"
"November 1995 – January 1998": "novembre 1995 – janvier 1998"
"After Storm only eastern Slavonia remained in Serb hands. Croatia made its return a condition of taking part in the Dayton peace talks, and the mediators pressed for a peaceful solution. The Erdut Agreement was signed on 12 November 1995 by Hrvoje Šarinić for Croatia and Milan Milanović for the local Serbs, acting on instructions from Belgrade, with the US ambassador Peter Galbraith and the UN mediator Thorvald Stoltenberg as witnesses. It provided for a transitional period under international rule, guarantees of minority rights and the return of refugees.": "Après la tempête, seule la Slavonie orientale est restée aux mains des Serbes. La Croatie a fait de son retour une condition pour prendre part aux pourparlers de paix de Dayton et les médiateurs ont demandé une solution pacifique. L’accord Erdut a été signé le 12 novembre 1995 par Hrvoje Šarinić pour la Croatie et Milan Milanović pour les Serbes locaux, agissant sur instructions de Belgrade, avec l’ambassadeur américain Peter Galbraith et le médiateur de l’ONU Thorvald Stoltenberg comme témoins. Elle prévoit une période de transition en vertu de la règle internationale, des garanties concernant les droits des minorités et le retour des réfugiés."
"The UN Security Council set up the Transitional Administration for Eastern Slavonia, Baranja and Western Syrmium (UNTAES) on 15 January 1996, with about 5,000 troops. It demilitarised the region, reformed its police, issued Croatian papers and held local elections in April 1997. On 15 January 1998 the region returned to Croatian rule. Its Serb and Croat communities, Vukovar’s above all, remain divided.": "Le 15 janvier 1996, le Conseil de sécurité des Nations unies a créé l’Administration transitoire pour la Slavonie orientale, la Baranja et le Syrmium occidental (ATNUSO) avec environ 5 000 soldats. Il a démilitarisé la région, réformé sa police, publié des documents croates et tenu des élections locales en avril 1997."
"Erdut Agreement": "Accord d’Erdut"
