# Some French text was translated automatically.
"Croatian War of Independence": "Guerre d’indépendance croate"
? "The war that followed Croatia’s break with Yugoslavia. From August 1990 Serbs in the Knin region and other Serb-populated areas rose against the new Croatian government and set up the Serbian Autonomous Region of Krajina. After Croatia declared independence on 25 June 1991, the Yugoslav People’s Army (JNA) joined the rebels; by the end of the year Vukovar had been destroyed, Dubrovnik besieged and almost a third of Croatia taken, and most Croats and other non-Serbs had been driven out of the Serb-held areas. A UN-supervised ceasefire from January 1992 froze the front around the Republic of Serbian Krajina for three years. Croatia retook western Slavonia in May 1995 and the Krajina in Operation Storm that August, when most of its Serb population fled. Eastern Slavonia returned peacefully under the Erdut Agreement and a UN transitional administration, which ended in January 1998. More than 20,000 people were killed."
: "La guerre qui a suivi la rupture de la Croatie avec la Yougoslavie. A partir d’août 1990, les Serbes de la région de Knin et d’autres zones peuplées de Serbes se sont levés contre le nouveau gouvernement croate et ont créé la Région autonome serbe de Krajina. Après que la Croatie eut déclaré son indépendance le 25 juin 1991, l’Armée populaire yougoslave (JNA) a rejoint les rebelles ; à la fin de l’année, Vukovar avait été détruit, Dubrovnik assiégé et près d’un tiers de la Croatie capturée, et la plupart des Croates et autres non-Serbes avaient été chassés des zones tenues par les Serbes. Un cessez-le-feu supervisé par l’ONU à partir de janvier 1992 a gelé le front autour de la République serbe de Krajina pendant trois ans. La Croatie a repris la Slavonie occidentale en mai 1995 et la Krajina dans l’opération Tempête en août, lorsque la plupart de sa population serbe s’est enfuie."
"The Republic of Serbian Krajina was recognised by no state. The map shows it, and the JNA’s hold on the Dubrovnik coast, as areas inside Croatia, whose independence the base map shows from 25 June 1991. Front lines are approximate.": "La République de Krajina serbe n’a été reconnue par aucun État. La carte le montre, et les JNA sur la côte de Dubrovnik, comme des zones à l’intérieur de la Croatie, dont l’indépendance la carte de base montre à partir du 25 juin 1991."
"Casualty figures for many events are disputed between Croatian, Serbian and international sources; the figures given are those of the sources listed, and ICTY findings where the tribunal settled them.": "Les chiffres des pertes pour de nombreux événements sont contestés entre les sources croate, serbe et internationale ; les chiffres donnés sont ceux des sources énumérées, et les conclusions du TPIY où le tribunal les a réglées."
"The Croatian army was called the National Guard Corps (ZNG) until November 1991. Croatian Serb forces were the SAO Krajina police and Territorial Defence, from 1992 the Serbian Army of Krajina (SVK).": "L’armée croate a été appelée le Corps de la Garde nationale (ZNG) jusqu’en novembre 1991. Les forces serbes croates étaient la police et la défense territoriale de la SAO Krajina, depuis 1992 l’Armée serbe de la Krajina (SVK)."
