"On 2 May 1991 Croatian police drove into an ambush at Borovo Selo near Vukovar; twelve policemen and one Serb fighter were killed. On 19 May 93 per cent of voters backed independence in a referendum, and Croatia declared independence on 25 June, the same day as Slovenia. Under the Brioni Declaration of 7 July both agreed to suspend their decisions for three months, but the fighting in Croatia only grew.": "Le 2 mai 1991, la police croate a pris une embuscade à Borovo Selo, près de Vukovar ; douze policiers et un combattant serbe ont été tués ; le 19 mai, 93 % des électeurs ont soutenu l’indépendance lors d’un référendum et la Croatie a déclaré son indépendance le 25 juin, le même jour que la Slovénie."
"While the JNA left Slovenia, in Croatia it increasingly fought alongside the rebels. Serb forces from eastern Slavonia attacked Dalj on 1 August, killing police and National Guard defenders who had surrendered, and by early August Serb forces had overrun much of Banovina. On 26 August the JNA, under Colonel Ratko Mladić, and Martić’s police took the Croatian village of Kijevo near Knin and burned it. The ICTY later found that the attack was meant to drive its Croat inhabitants out.": "Alors que la JNA quittait la Slovénie, en Croatie elle combattait de plus en plus aux côtés des rebelles. Les forces serbes de Slavonie orientale attaquaient Dalj le 1er août, tuant la police et les défenseurs de la Garde nationale qui s’étaient rendus, et au début d’août les forces serbes avaient envahi une grande partie de Banovina. Le TPIY a par la suite constaté que l’attaque visait à chasser ses habitants croates."
