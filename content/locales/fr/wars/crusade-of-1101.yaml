"Crusade of 1101": "Croisade de 1101"
"A second wave of crusaders, inspired by the capture of Jerusalem, who set out in 1100–1101 from Lombardy, France and Germany under leaders including Stephen of Blois, Stephen of Burgundy, William IX of Aquitaine and Welf IV of Bavaria, with Raymond of Toulouse as their guide. Crossing Anatolia in three separate armies in the summer of 1101, they were destroyed by Kilij Arslan I of Rum and the Danishmendids, at Mersivan in August and at Heraclea in August and September. Only a few survivors, among them several of the leaders, reached the Holy Land in 1102.": "Une deuxième vague de croisés, inspirée par la prise de Jérusalem, qui partit en 1100-1101 de Lombardie, France et Allemagne sous les dirigeants dont Stephen de Blois, Stephen de Bourgogne, Guillaume IX d’Aquitaine et Welf IV de Bavière, avec Raymond de Toulouse comme guide. Traversant l’Anatolie dans trois armées séparées au cours de l’été 1101, elles furent détruites par Kilij Arslan I de Rum et les Danois mendids, à Mersivan en août et à Heraclea en août et septembre. Seuls quelques survivants, parmi eux plusieurs des dirigeants, atteignirent la Terre Sainte en 1102."
"The largest army, mainly Lombards, marched north-east from Nicaea in the hope of freeing Bohemond of Antioch, held prisoner by the Danishmendids, against the advice of Raymond of Toulouse and the Byzantine escort. The other two, the Nivernais and the Aquitanians and Bavarians, followed the route of the First Crusade and were ambushed near Heraclea. Some Western writers blamed the Byzantines for the disasters.": "La plus grande armée, principalement lombarde, marchait au nord-est de Nicée dans l’espoir de libérer Bohemond d’Antioche, détenu par les Danois, contre le conseil de Raymond de Toulouse et de l’escorte byzantine. Les deux autres, les Nivernais et les Aquitains et les Bavarois, suivirent la route de la première croisade et furent embusqués près d’Héraclaïe. Certains écrivains occidentaux ont blâmé les Byzantins pour les catastrophes."
