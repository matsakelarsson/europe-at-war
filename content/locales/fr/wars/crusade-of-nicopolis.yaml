# Some French text was translated automatically.
"Crusade of Nicopolis": "Croisade de Nicopolis"
"The great crusade of 1396, in which King Sigismund of Hungary and an army of French, Burgundian, German and other knights, with Wallachians, Hospitallers and a Venetian fleet, marched down the Danube to drive the Ottomans from the Balkans. After taking Vidin and Oryahovo they besieged Nicopolis, where on 25 September the army of Sultan Bayezid I and his Serbian vassals destroyed them. Bayezid had thousands of prisoners killed, and annexed Vidin, the last Bulgarian realm.": "La grande croisade de 1396, dans laquelle le roi Sigismond de Hongrie et une armée de chevaliers français, bourguignons, allemands et autres, avec des Wallachiens, Hospitaliers et une flotte vénitienne, marchèrent sur le Danube pour chasser les Ottomans des Balkans. Après avoir pris Vidin et Oryahovo, ils ont assiégé Nicopolis, où le 25 septembre l’armée du Sultan Bayezid Ier et ses vassaux serbes les ont détruits. Bayezid a fait tuer des milliers de prisonniers et annexé Vidin, le dernier royaume bulgare."
"Dates are Julian. The chroniclers give armies of 100,000 or more on each side; modern historians think each numbered perhaps 15,000 to 20,000. The reported English contingent seems never to have existed.": "Dates sont Julian. Les chroniqueurs donnent des armées de 100 000 ou plus de chaque côté ; les historiens modernes pensent que chacun comptait entre 15 000 et 20 000 personnes."
"The main accounts are French (Froissart, the Monk of Saint-Denis and others) and blame the defeat on the French knights’ haste; the young Johann Schiltberger, a Bavarian squire who survived the massacre, left an eyewitness account of it.": "Les principaux récits sont français (Froissart, le Moine de Saint-Denis et d’autres) et blâment la défaite des chevaliers français à la hâte ; le jeune Johann Schiltberger, un écuyer bavarois qui a survécu au massacre, en a laissé un témoignage oculaire."
