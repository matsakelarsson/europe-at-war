"25 September 1396": "25 septembre 1396"
"Bayezid broke off his blockade of Constantinople and came north through the Shipka Pass, joined by Stefan Lazarević and his Serbian knights. On 25 September the French insisted on leading the attack, against Sigismund’s advice to let the Wallachian infantry open the battle. Their knights rode down the Ottoman light troops and irregular infantry and then, many of them on foot after crossing lines of sharpened stakes, climbed the slope beyond, only to meet fresh Ottoman cavalry held in reserve at the top. Surrounded, Nevers and the surviving French surrendered.": "Bayezid a rompu son blocus de Constantinople et est venu au nord par le col de Shipka, rejoint par Stefan Lazarević et ses chevaliers serbes. Le 25 septembre, les Français ont insisté pour mener l’attaque, contre Sigismond, des conseils pour laisser l’infanterie wallachienne ouvrir la bataille. Leurs chevaliers descendirent les troupes légères ottomanes et l’infanterie irrégulière, puis, beaucoup d’entre eux à pied après avoir traversé des lignes de piquets aiguisés, grimpèrent la pente au-delà, seulement pour rencontrer la nouvelle cavalerie ottomane tenue en réserve au sommet. Entourés, Nevers et les Français survivants se rendirent."
"The Wallachians and Transylvanians left the field, and Sigismund, the Hospitallers and the Germans were overwhelmed after the Serbian horsemen joined the battle. Sigismund escaped in a boat to the Venetian ships; many others drowned trying to reach them. Enraged by his losses and by the killing of prisoners at Oryahovo, Bayezid had several thousand captives put to death the next day, sparing the richest nobles, among them Nevers and Boucicaut, who were ransomed for 200,000 florins. Coucy died in captivity at Bursa. Bayezid then took Vidin and returned to his siege of Constantinople.": "Les Wallachiens et les Transylvaniens quittèrent le champ, et Sigismond, les Hospitaliers et les Allemands furent débordés après que les cavaliers serbes eurent rejoint la bataille. Sigismund s’échappa dans un bateau aux navires vénitiens ; beaucoup d’autres se noyèrent en essayant de les atteindre. Enragé par ses pertes et par l’assassinat de prisonniers à Oryahovo, Bayezid avait plusieurs milliers de captifs mis à mort le lendemain, épargnant les nobles les plus riches, parmi lesquels Nevers et Boucicaut, qui ont été rachetés pour 200 000 florins. Coucy est mort en captivité à Bursa. Bayezid a alors pris Vidin et retourné à son siège de Constantinople."
