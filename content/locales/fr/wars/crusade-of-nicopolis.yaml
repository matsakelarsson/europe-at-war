"April – September 1396": "avril – septembre 1396"
"The fall of Tarnovo and Ottoman raids across the Danube led Sigismund of Hungary to appeal to the West, and with England and France at truce, French nobles answered eagerly. Duke Philip of Burgundy paid for much of the expedition and gave its command to his son John, Count of Nevers, aged 24, advised by veterans such as Enguerrand de Coucy, Jean de Vienne and Marshal Boucicaut. The French and Burgundians left Dijon on 30 April 1396 and joined Sigismund at Buda in July, together with German knights, Wallachians under Mircea the Elder and others; Venetian ships brought the Hospitallers of Rhodes into the Black Sea and up the Danube.": "La chute de Tarnovo et des raids ottomans à travers le Danube a conduit Sigismond de Hongrie à faire appel à l’Occident, et avec l’Angleterre et la France en trêve, les nobles français ont répondu avec empressement. Duc Philippe de Bourgogne a payé pour une grande partie de l’expédition et donné son commandement à son fils John, comte de Nevers, âgé de 24 ans, conseillé par des vétérans tels qu’Enguerrand de Coucy, Jean de Vienne et Marshal Boucicaut. Les Français et les Bourguignons quittèrent Dijon le 30 avril 1396 et rejoignirent Sigismond à Buda en juillet, avec des chevaliers allemands, des Wallachiens sous Mircea l’Ancien et d’autres ; des navires vénitiens ramenèrent les Hospitaliers de Rhodes dans la mer Noire et le Danube."
"Rather than wait for Bayezid in Hungary, the crusaders marched down the Danube and crossed it at Orșova over eight days. Ivan Sratsimir opened Vidin to them, and the Turkish officers of its garrison were put to death. At Oryahovo (Rahova) the townspeople surrendered to Sigismund on promise of their lives, but the French sacked the town and massacred many of them, Turks and Bulgarians, keeping about a thousand for ransom. On 12 September the army reached Nicopolis, a strong fortress on a cliff above the river. Having brought no siege engines, it settled down to starve the garrison out.": "Plutôt que d’attendre Bayezid en Hongrie, les croisés ont marché sur le Danube et l’ont traversé à Orșova pendant huit jours. Ivan Sratsimir leur a ouvert Vidin, et les officiers turcs de sa garnison ont été mis à mort. A Oryahovo (Rahova), les habitants se sont rendus à Sigismond en promettant leur vie, mais les Français ont renvoyé la ville et massacré beaucoup d’entre eux, Turcs et Bulgares, gardant environ mille pour rançon. Le 12 septembre l’armée a atteint Nicopolis, une forteresse forte sur une falaise au-dessus de la rivière."
