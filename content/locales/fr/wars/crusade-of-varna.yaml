"October – November 1444": "octobre – novembre 1444"
"The Christian fleet failed to stop Murad, recalled from retirement, from bringing his Anatolian army across the Bosporus on 18 October, and he marched north to cut the crusaders off. On 9 November they found him behind them near Varna, trapped between the sea, Lake Varna and the hills. Hunyadi drew up the army in an arc between the lake and the heights, with the wagon fort behind.": "La flotte chrétienne n’arrêta pas Murad, rappelé de sa retraite, de faire traverser le Bospore par son armée anatolienne le 18 octobre, et il marcha vers le nord pour couper les croisés. Le 9 novembre ils le trouvèrent derrière eux près de Varna, piégé entre la mer, le lac Varna et les collines. Hunyadi dessina l’armée dans un arc entre le lac et les hauteurs, avec le chariot fort derrière."
"On 10 November the Ottoman light cavalry drove in the crusader right wing, many of whom died in the marshes; Cesarini disappeared in the rout. Hunyadi held the left, but the twenty-year-old king, ignoring his advice, charged the janissaries in the Ottoman centre with his Polish household knights. Władysław was killed and his head was shown to his army, which broke. Hunyadi escaped, only to be held for a time in Wallachia by Vlad Dracul. Thousands of crusaders were killed or captured, and no Western army would try again to drive the Ottomans out of the Balkans for many years.": "Le 10 novembre, la cavalerie légère ottomane conduisit dans l’aile droite du croisé, dont beaucoup moururent dans les marais ; Cesarini disparut dans la rout. Hunyadi tenait la gauche, mais le roi de vingt ans, ignorant ses conseils, chargea les janissaires du centre ottoman de ses chevaliers de famille polonais. Władysław fut tué et sa tête fut montrée à son armée qui se brisa. Hunyadi s’est échappé, pour être détenu pendant un temps à Wallachie par Vlad Dracul. Des milliers de croisés ont été tués ou capturés, et aucune armée occidentale n’a essayé à nouveau de chasser les Ottomans des Balkans pendant de nombreuses années."
