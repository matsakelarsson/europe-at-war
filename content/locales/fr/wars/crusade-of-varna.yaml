# Some French text was translated automatically.
"Crusade of Varna": "Croisade de Varna"
"The last great crusade against the Ottomans in the Balkans, led by Władysław III, king of Poland and Hungary, and John Hunyadi. Their “long campaign” of 1443 reached the Balkan Mountains before winter drove them back, and in 1444 Sultan Murad II agreed to a ten-year truce that restored the Serbian despotate. Urged on by the papal legate, the king renounced the truce and marched to the Black Sea, where on 10 November 1444 the crusaders were crushed at Varna and Władysław was killed.": "La dernière grande croisade contre les Ottomans dans les Balkans, dirigée par Władysław III, roi de Pologne et de Hongrie, et John Hunyadi. Leur longue campagne de 1443 a atteint les montagnes balkaniques avant l’hiver les a repoussés, et en 1444 Sultan Murad II a convenu d’une trêve de dix ans qui a restauré le despotat serbe. Exhorté par le légat papal, le roi renonça à la trêve et marcha vers la mer Noire où, le 10 novembre 1444, les croisés furent écrasés à Varna et Władysław fut tué."
"The size of the armies is uncertain. The crusaders probably had about 20,000 men in 1444, including several thousand Wallachians; estimates for Murad’s army at Varna range from 40,000 to 60,000 or more.": "La taille des armées est incertaine. Les croisés ont probablement eu environ 20 000 hommes en 1444, y compris plusieurs milliers de Wallachiens ; les estimations pour l’armée de Murade à Varna vont de 40 000 à 60 000 ou plus."
"Whether the king broke his word is still argued over. Before the truce was sworn, Cardinal Cesarini had Władysław declare in advance that any treaty with the sultan was void, so that it could be ratified without stopping the crusade. Ottoman tradition says that Murad fought at Varna with the broken treaty fixed to his standard.": "Avant que la trêve ne soit assermentée, le cardinal Cesarini avait fait déclarer à l’avance que tout traité avec le sultan était nul, de sorte qu’il pouvait être ratifié sans arrêter la croisade. La tradition ottomane dit que Murad combattait à Varna avec le traité rompu fixé à son standard."
"Władysław’s death was not witnessed by his own men and his body was never found, which gave rise to legends that he survived.": "La mort de Władysław n’a pas été témoin par ses propres hommes et son corps n’a jamais été trouvé, ce qui a donné lieu à des légendes qu’il a survécu."
