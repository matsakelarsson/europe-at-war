"October 1443 – February 1444": "octobre 1443 – février 1444"
"Since 1439 the Ottomans had annexed the Serbian despotate and besieged Belgrade, and Hunyadi, the voivode of Transylvania, had beaten their raiders in 1441 and 1442. Pope Eugene IV proclaimed a crusade on 1 January 1443, and in October Władysław, Hunyadi and the exiled despot Đurađ Branković crossed into Serbia with a Hungarian, Polish and Serbian army, counting on the Ottoman cavalry having gone home after the harvest. Hunyadi’s vanguard defeated the Ottoman forces near Niš on 2 or 3 November, and the crusaders marched on to Sofia. In the confusion, Skanderbeg and his Albanians left the Ottoman army and rode home to Krujë.": "Depuis 1439, les Ottomans avaient annexé le despotat serbe et assiégé Belgrade, et Hunyadi, la voïvode de Transylvanie, avait battu leurs raideurs en 1441 et 1442. Le pape Eugène IV proclama une croisade le 1er janvier 1443 et, en octobre, Władysław, Hunyadi et les despotes exilés de шuraю Branković passèrent en Serbie avec une armée hongroise, polonaise et serbe, comptant sur la cavalerie ottomane qui rentrait chez elle après la récolte. L’avant-garde de Hunyadi a battu les forces ottomanes près de Niš le 2 ou 3 novembre, et les croisés ont marché à Sofia. Dans la confusion, Skanderbeg et ses Albanais ont quitté l’armée ottomane et sont rentrés chez eux à Krujë."
"Beyond Sofia the Ottomans burned the countryside and blocked the passes over the Balkan Mountains. On 12 December, in deep snow and bitter cold, the crusaders failed to break through at the Zlatitsa pass and turned back. On 2 or 5 January 1444 they ambushed their pursuers at Kunovica, between Niš and Pirot, and captured Mahmud Bey, the sultan’s brother-in-law and brother of the grand vizier. The army reached Buda in February to a heroes’ welcome; the setback at Zlatitsa was played down.": "Au-delà de Sofia, les Ottomans ont brûlé la campagne et bloqué les cols au-dessus des Balkans. Le 12 décembre, dans la neige profonde et le froid amer, les croisés n’ont pas réussi à franchir le col Zlatitsa et se sont retournés. Le 2 ou 5 janvier 1444, ils embuscadent leurs poursuivants à Kunovica, entre Niš et Pirot, et capturent Mahmud Bey, le beau-frère du sultan et frère du grand vizir. L’armée arrive à Buda en février pour un accueil de héros ; le revers à Zlatitsa est joué."
