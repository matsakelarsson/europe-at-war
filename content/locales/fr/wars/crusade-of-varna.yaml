"Under pressure from his Serbian wife Mara and from Mahmud Bey’s family, and threatened by Karaman in Anatolia, Murad II offered peace. The terms agreed at Edirne on 12 June 1444 returned the Serbian despotate, with Smederevo, Golubac and some two dozen towns, to Branković as an Ottoman vassal, released his two blinded sons and set a ten-year truce with Hungary. At the same time, Cardinal Julian Cesarini, the papal legate, kept pressing for a new crusade, and the Venetians and the pope were preparing a fleet to close the straits.": "Sous la pression de sa femme serbe Mara et de la famille Mahmud Bey, et menacée par Karaman en Anatolie, Murad II offrit la paix. Les conditions convenues à Edirne le 12 juin 1444 renvoyèrent le despotat serbe, avec Smederevo, Golubac et une vingtaine de villes, à Branković en tant que vassal ottoman, libéra ses deux fils aveuglés et établit une trêve de dix ans avec la Hongrie. Dans le même temps, le cardinal Julian Cesarini, légat pontifical, a continué à faire pression pour une nouvelle croisade, et les Vénitiens et le pape préparaient une flotte pour fermer les détroits."
"On 4 August, with Cesarini’s help, Władysław swore in advance that he renounced any treaty he had made or would make with the sultan, and on 15 August the truce was ratified by oath. Branković took back Serbia on 22 August and stayed out of the coming fight. Murad, believing the peace secure, gave up the throne to his twelve-year-old son Mehmed II and retired. On 20 September the crusading army set out from Szeged, crossed the Danube and marched east along its southern bank, joined near Nicopolis by Wallachian cavalry under Mircea, son of Vlad Dracul.": "Le 4 août, avec l’aide de Cesarini, Władysław a juré à l’avance qu’il avait renoncé à tout traité qu’il avait fait ou allait faire avec le sultan, et le 15 août la trêve a été ratifiée par serment. Branković a repris la Serbie le 22 août et est resté hors du combat à venir. Murad, croyant la paix en sécurité, a donné le trône à son fils de douze ans Mehmed II et a pris sa retraite. Le 20 septembre, l’armée croisée partit de Szeged, traversa le Danube et marcha vers l’est le long de sa rive sud, rejoint près de Nicopolis par la cavalerie wallachienne sous la direction de Mircea, fils de Vlad Dracul."
