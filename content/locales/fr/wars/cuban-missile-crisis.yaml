# French translations of the catalogue text (wave 14); step bodies follow later.
Cuban Missile Crisis: Crise des missiles de Cuba
? The confrontation of October 1962 between the United States and the Soviet Union over Soviet nuclear missiles secretly installed in Cuba, the closest the Cold War came to nuclear war. In the spring of 1962 Nikita Khrushchev decided, with Fidel Castro’s agreement, to send ballistic missiles with nuclear warheads and some 43,000 Soviet troops to Cuba (Operation Anadyr), to deter another American invasion after the Bay of Pigs and to offset the American lead in long-range missiles and the US Jupiter missiles in Turkey. An American U-2 photographed missile sites on 14 October. After a week of secret deliberation, President Kennedy announced on 22 October a naval “quarantine” of Cuba and demanded the missiles’ removal; American forces went on alert, the Strategic Air Command at DEFCON 2 for the only time in its history, and an invasion force gathered in the south-eastern United States. Soviet ships carrying weapons turned back from the quarantine on 24 October, but work on the missile sites went on, and on 27 October a Soviet anti-aircraft missile shot down a U-2 over eastern Cuba, killing its pilot, Major Rudolf Anderson. On 28 October Khrushchev announced that the missiles would be dismantled and taken home, in return for a public American pledge not to invade Cuba and a secret promise to remove the Jupiter missiles from Turkey, which were withdrawn, with those in Italy, in 1963. Castro, who had not been consulted, refused UN inspection; after the Soviet Union agreed to take back its IL-28 bombers as well, the United States lifted the quarantine on 20 November. The crisis led to the Moscow–Washington hotline and the Partial Test Ban Treaty of 1963.
: La confrontation d’octobre 1962 entre les États-Unis et l’Union soviétique au sujet des missiles nucléaires soviétiques secrètement installés à Cuba, le moment où la guerre froide fut le plus près de basculer dans la guerre nucléaire. Au printemps 1962, Nikita Khrouchtchev décida, avec l’accord de Fidel Castro, d’envoyer à Cuba des missiles balistiques à ogives nucléaires et quelque 43 000 soldats soviétiques (opération Anadyr), pour dissuader une nouvelle invasion américaine après la baie des Cochons et compenser l’avance américaine en missiles à longue portée ainsi que les missiles américains Jupiter installés en Turquie. Un U-2 américain photographia des sites de missiles le 14 octobre. Après une semaine de délibérations secrètes, le président Kennedy annonça le 22 octobre une « quarantaine » navale autour de Cuba et exigea le retrait des missiles ; les forces américaines furent mises en alerte, le Strategic Air Command passant en DEFCON 2 pour la seule fois de son histoire, et une force d’invasion se rassembla dans le sud-est des États-Unis. Les navires soviétiques transportant des armes firent demi-tour devant la quarantaine le 24 octobre, mais les travaux sur les sites de missiles se poursuivirent, et le 27 octobre un missile antiaérien soviétique abattit un U-2 au-dessus de l’est de Cuba, tuant son pilote, le commandant Rudolf Anderson. Le 28 octobre, Khrouchtchev annonça que les missiles seraient démontés et rapatriés, en échange d’un engagement public des États-Unis de ne pas envahir Cuba et d’une promesse secrète de retirer de Turquie les missiles Jupiter, qui furent retirés en 1963, en même temps que ceux d’Italie. Castro, qui n’avait pas été consulté, refusa toute inspection de l’ONU ; après que l’Union soviétique eut accepté de reprendre également ses bombardiers IL-28, les États-Unis levèrent la quarantaine le 20 novembre. La crise conduisit à l’installation de la ligne directe Moscou–Washington et au traité d’interdiction partielle des essais nucléaires de 1963.
