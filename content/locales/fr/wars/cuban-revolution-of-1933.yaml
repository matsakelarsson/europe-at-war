# French translations of the catalogue text (wave 14); step bodies follow later.
Cuban Revolution of 1933: Révolution cubaine de 1933
? The overthrow of Gerardo Machado, the Sergeants’ Revolt and the brief revolutionary government of Ramón Grau San Martín. Machado, president since 1925, had extended his term in 1928 and ruled through the police and the army while the Great Depression ruined the sugar economy; students of the Directorio Estudiantil Universitario, the clandestine ABC society and the communists fought him with strikes, bombs and assassinations, and his police killed many opponents. In 1933 the new US ambassador Sumner Welles pressed Machado to step down, and a general strike in August led army officers to withdraw their support; Machado fled on 12 August and Welles’s candidate Carlos Manuel de Céspedes y Quesada became president, with the ABC in his cabinet. On 4 September sergeants and enlisted men at Camp Columbia in Havana, led by the stenographer-sergeant Fulgencio Batista, took over the army and, with the students, replaced Céspedes with a five-man Pentarchy; on 10 September Grau became president. His “Hundred Days” government, with Antonio Guiteras as minister of the interior, decreed the eight-hour day, a minimum wage for cane cutters, autonomy for the university and a law that half of all workers must be Cuban-born, cut electricity rates and repudiated the Platt Amendment. The United States refused to recognise it and sent some thirty warships to Cuban waters, though no troops landed. Batista’s soldiers crushed the deposed officers, about 400 of whom had gathered in the Hotel Nacional, in a battle on 2 October, after which some of the officers who surrendered were killed, and put down a rising of the ABC and army officers that ended at the Atarés fortress in Havana on 8–9 November. On 15 January 1934 Batista, now a colonel and chief of staff, forced Grau out, and after a few days Carlos Mendieta became president and was recognised by Washington within a week. In May 1934 a new treaty abrogated the Platt Amendment. Batista remained the real power in Cuba until 1944; Guiteras was killed in 1935 after a failed general strike.
: Le renversement de Gerardo Machado, la révolte des sergents et le bref gouvernement révolutionnaire de Ramón Grau San Martín. Président depuis 1925, Machado avait prolongé son mandat en 1928 et gouvernait par la police et l’armée, tandis que la Grande Dépression ruinait l’économie sucrière ; les étudiants du Directorio Estudiantil Universitario, la société clandestine ABC et les communistes le combattirent par des grèves, des bombes et des assassinats, et sa police tua de nombreux opposants. En 1933, le nouvel ambassadeur des États-Unis, Sumner Welles, pressa Machado de se retirer, et une grève générale, en août, conduisit les officiers de l’armée à lui retirer leur soutien ; Machado s’enfuit le 12 août et Carlos Manuel de Céspedes y Quesada, le candidat de Welles, devint président, avec l’ABC dans son gouvernement. Le 4 septembre, les sergents et les hommes du rang du camp Columbia, à La Havane, menés par le sergent sténographe Fulgencio Batista, prirent le contrôle de l’armée et, avec les étudiants, remplacèrent Céspedes par une Pentarchie de cinq membres ; le 10 septembre, Grau devint président. Son gouvernement des « Cent Jours », où Antonio Guiteras était ministre de l’Intérieur, décréta la journée de huit heures, un salaire minimum pour les coupeurs de canne, l’autonomie de l’université et une loi imposant que la moitié des travailleurs soient nés à Cuba, baissa les tarifs de l’électricité et répudia l’amendement Platt. Les États-Unis refusèrent de le reconnaître et envoyèrent une trentaine de navires de guerre dans les eaux cubaines, sans toutefois débarquer de troupes. Lors d’une bataille, le 2 octobre, les soldats de Batista écrasèrent les officiers destitués, dont environ 400 s’étaient rassemblés à l’hôtel Nacional, et certains de ceux qui s’étaient rendus furent ensuite tués ; les soldats réprimèrent aussi un soulèvement de l’ABC et d’officiers de l’armée, qui prit fin à la forteresse d’Atarés, à La Havane, les 8 et 9 novembre. Le 15 janvier 1934, Batista, devenu colonel et chef d’état-major, contraignit Grau à partir ; quelques jours plus tard, Carlos Mendieta devint président et fut reconnu par Washington en moins d’une semaine. En mai 1934, un nouveau traité abrogea l’amendement Platt. Batista resta le véritable maître de Cuba jusqu’en 1944 ; Guiteras fut tué en 1935 après l’échec d’une grève générale.
