# French translations of the catalogue text (wave 14); step bodies follow later.
Cuban Revolution: Révolution cubaine
? The armed struggle that overthrew Fulgencio Batista, who had seized power in Cuba in a coup in March 1952. It began with Fidel Castro’s failed attack on the Moncada Barracks in Santiago de Cuba on 26 July 1953, which gave his 26th of July Movement its name. After prison and exile in Mexico, Castro landed in eastern Cuba from the yacht Granma with 81 men in December 1956; most were killed or captured within days, but the survivors built a guerrilla army in the Sierra Maestra with the help of the peasants there and of an urban underground led by Frank País. In the cities the movement, the students of the Directorio Revolucionario and other groups fought with strikes, sabotage, bombs and assassinations, and Batista’s police and army answered with torture and killings. The United States, which had armed Batista, stopped selling him weapons in March 1958. A general strike called for April 1958 failed, but the army’s summer offensive against the Sierra Maestra, about 12,000 men against some 300 guerrillas, collapsed by August. Rebel columns under Che Guevara and Camilo Cienfuegos then crossed to central Cuba, where with the Directorio Revolucionario they took Santa Clara on 31 December. Batista fled to the Dominican Republic early on 1 January 1959, a general strike called by Castro paralysed resistance, and Castro arrived in Havana on 8 January. The revolutionary government, which Castro soon dominated, tried and executed hundreds of members of Batista’s forces in 1959 and in the following years transformed Cuba into a one-party socialist state allied with the Soviet Union.
: La lutte armée qui renversa Fulgencio Batista, qui s’était emparé du pouvoir à Cuba par un coup d’État en mars 1952. Elle commença par l’attaque manquée de Fidel Castro contre la caserne Moncada, à Santiago de Cuba, le 26 juillet 1953, qui donna son nom à son Mouvement du 26 juillet. Après la prison et l’exil au Mexique, Castro débarqua dans l’est de Cuba depuis le yacht Granma avec 81 hommes en décembre 1956 ; la plupart furent tués ou capturés en quelques jours, mais les survivants bâtirent une armée de guérilla dans la Sierra Maestra avec l’aide des paysans de la région et d’un réseau clandestin urbain dirigé par Frank País. Dans les villes, le mouvement, les étudiants du Directorio Revolucionario et d’autres groupes combattirent par des grèves, des sabotages, des bombes et des assassinats, et la police et l’armée de Batista répondirent par la torture et des meurtres. Les États-Unis, qui avaient armé Batista, cessèrent de lui vendre des armes en mars 1958. Une grève générale lancée pour avril 1958 échoua, mais l’offensive d’été de l’armée contre la Sierra Maestra, environ 12 000 hommes contre quelque 300 guérilleros, s’était effondrée en août. Des colonnes rebelles commandées par Che Guevara et Camilo Cienfuegos passèrent alors dans le centre de Cuba où, avec le Directorio Revolucionario, elles prirent Santa Clara le 31 décembre. Batista s’enfuit en République dominicaine aux premières heures du 1er janvier 1959, une grève générale lancée par Castro paralysa toute résistance, et Castro arriva à La Havane le 8 janvier. Le gouvernement révolutionnaire, que Castro domina bientôt, jugea et exécuta en 1959 des centaines de membres des forces de Batista et, dans les années suivantes, transforma Cuba en un État socialiste à parti unique allié à l’Union soviétique.
