# French translations of the catalogue text (wave 14); step bodies follow later.
Cuban War of Independence: Guerre d’indépendance cubaine
? The last and decisive Cuban war against Spanish rule, which José Martí called “the necessary war”. Martí united the exiles of Florida and New York in the Cuban Revolutionary Party in 1892 and, with the veterans Máximo Gómez and Antonio Maceo, launched the rising of 24 February 1895, the Cry of Baire. Martí was killed at Dos Ríos in May, but the insurgents of the Liberation Army defeated Martínez Campos at Peralejo, set up a government at Jimaguayú and, in the invasion of 1895–1896, carried the war from the east to the western tip of the island, burning the sugar crop as they went. Spain sent some 200,000 soldiers, the largest army it had ever sent to the Americas, and General Valeriano Weyler forced the rural population of the west and centre into fortified towns; in this reconcentration about 155,000 to 170,000 civilians died of hunger and disease, by the most careful modern estimate, and some estimates are far higher. Maceo was killed in December 1896, but the insurgents held the countryside, Calixto García took Las Tunas and Guisa in 1897, and Spain, after Weyler’s recall, offered autonomy in 1898, which the insurgents rejected. The explosion of the USS Maine in Havana in February 1898 and American public anger at the reconcentration led to the Spanish–American War; Spain gave up Cuba in the armistice of 12 August 1898 and the Treaty of Paris, which handed the island to American military rule until the Republic of Cuba was founded in 1902, bound by the Platt Amendment.
: La dernière et décisive guerre cubaine contre la domination espagnole, que José Martí appelait « la guerre nécessaire ». Martí réunit les exilés de Floride et de New York dans le Parti révolutionnaire cubain en 1892 et, avec les vétérans Máximo Gómez et Antonio Maceo, lança le soulèvement du 24 février 1895, le cri de Baire. Martí fut tué à Dos Ríos en mai, mais les insurgés de l’Armée de libération battirent Martínez Campos à Peralejo, établirent un gouvernement à Jimaguayú et, lors de l’invasion de 1895–1896, portèrent la guerre de l’est jusqu’à la pointe occidentale de l’île, en brûlant la récolte de canne sur leur passage. L’Espagne envoya quelque 200 000 soldats, la plus grande armée qu’elle eût jamais envoyée dans les Amériques, et le général Valeriano Weyler contraignit la population rurale de l’ouest et du centre à se regrouper dans des villes fortifiées ; lors de cette reconcentration, environ 155 000 à 170 000 civils moururent de faim et de maladie, selon l’estimation moderne la plus rigoureuse, et certaines estimations sont bien plus élevées. Maceo fut tué en décembre 1896, mais les insurgés tenaient les campagnes, Calixto García prit Las Tunas et Guisa en 1897, et l’Espagne, après le rappel de Weyler, offrit en 1898 une autonomie que les insurgés rejetèrent. L’explosion de l’USS Maine à La Havane en février 1898 et la colère de l’opinion américaine face à la reconcentration conduisirent à la guerre hispano-américaine ; l’Espagne renonça à Cuba par l’armistice du 12 août 1898 et le traité de Paris, qui plaça l’île sous un gouvernement militaire américain jusqu’à la fondation de la République de Cuba en 1902, liée par l’amendement Platt.
