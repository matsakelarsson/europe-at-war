# Some French text was translated automatically.
"Cypriot intercommunal violence of 1963–1964": "Violence intercommunautaire chypriote de 1963 à 1964"
"Fighting between Greek and Turkish Cypriots that broke up the power-sharing republic of 1960, beginning in Nicosia on 21 December 1963 – the start of what Turkish Cypriots call Bloody Christmas – after President Makarios proposed constitutional changes that Turkish Cypriots rejected. By August 1964 some 364 Turkish Cypriots and 174 Greek Cypriots had been killed and about 25,000 Turkish Cypriots had withdrawn into armed enclaves, and Turkish air strikes during a Greek Cypriot attack on Kokkina brought Greece and Turkey close to war.": "Combattre les Chypriotes grecs et turcs qui ont rompu la république de partage du pouvoir en 1960, à partir de Nicosie le 21 décembre 1963 – le début de ce que les Chypriotes turcs appellent Noël sanglant – après que le président Makarios a proposé des changements constitutionnels que les Chypriotes turcs ont rejetés. En août 1964, quelque 364 Chypriotes turcs et 174 Chypriotes grecs ont été tués et environ 25 000 Chypriotes turcs se sont retirés dans des enclaves armées, et les frappes aériennes turques lors d’une attaque chypriote grecque contre Kokkina ont rapproché la Grèce et la Turquie de la guerre."
"A British-drawn ceasefire line through Nicosia in December 1963 was the first Green Line. The United Nations force UNFICYP, set up by the Security Council on 4 March 1964, is still in Cyprus; fighting flared again in 1967 at Kofinou, and the enclaves lasted until 1974.": "Une ligne de cessez-le-feu tirée par le Royaume-Uni à travers Nicosie en décembre 1963 a été la première Ligne verte. La Force des Nations Unies chargée d’assurer la paix à Chypre, créée par le Conseil de sécurité le 4 mars 1964, se trouve toujours à Chypre ; les combats ont repris en 1967 à Kofinou et les enclaves ont duré jusqu’en 1974."
