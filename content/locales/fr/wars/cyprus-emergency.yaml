"April 1955 – August 1960": "avril 1955 – août 1960"
"Most Greek Cypriots, about four-fifths of the island’s people, wanted union with Greece, but Britain, which planned to base its Middle East command on Cyprus, refused. On 1 April 1955 EOKA, led by George Grivas, a Cypriot-born colonel of the Greek army, and backed politically by Archbishop Makarios III, set off bombs across the island. The governor, Field Marshal Sir John Harding, declared a state of emergency in November and in March 1956 deported Makarios to the Seychelles. Some tens of thousands of British troops hunted a few hundred guerrillas in the Troodos and Kyrenia mountains, with curfews, collective fines and detention camps, and nine EOKA members were hanged.": "La plupart des Chypriotes grecs, environ les quatre cinquièmes du peuple de l’île, voulaient s’unir avec la Grèce, mais la Grande-Bretagne, qui prévoyait de fonder son commandement au Moyen-Orient sur Chypre, refusa. Le 1er avril 1955, EOKA, dirigé par George Grivas, colonel chypriote de l’armée grecque et soutenu politiquement par l’archevêque Makarios III, débarqua des bombes à travers l’île. Le gouverneur, sir John Harding, a déclaré l’état d’urgence en novembre et en mars 1956 a expulsé Makarios vers les Seychelles. Des dizaines de milliers de soldats britanniques ont chassé quelques centaines de guérilleros dans les montagnes Troodos et Kyrenia, avec des couvre-feux, des amendes collectives et des camps de détention, et neuf membres de l’EOKA ont été pendus."
"Turkish Cypriots, about a fifth of the population, opposed enosis, and Turkey called for partition. In 1958 the Turkish Resistance Organisation (TMT) and EOKA turned on each other’s communities, and intercommunal killings that summer began the separation of the two peoples. Britain, Greece and Turkey then agreed a compromise. Under the Zurich and London agreements of February 1959, Cyprus became an independent republic on 16 August 1960, with Makarios as president, a Turkish Cypriot vice-president, power shared between the communities, Britain, Greece and Turkey as guarantors, and two British sovereign base areas.": "Les Chypriotes turcs, environ un cinquième de la population, s’opposaient à l’énose et la Turquie appelait à la partition.En 1958, l’Organisation turque de résistance (TMT) et l’EOKA se tournèrent les unes sur les autres vers les communautés, et les meurtres intercommunautaires de l’été commencèrent la séparation des deux peuples. En vertu des accords de Zurich et de Londres de février 1959, Chypre est devenue une république indépendante le 16 août 1960, Makarios en tant que président, vice-président chypriote turc, le pouvoir étant partagé entre les communautés, la Grande-Bretagne, la Grèce et la Turquie en tant que garants, et deux zones souveraines britanniques."
