# Some French text was translated automatically.
"Cyprus Emergency": "Chypre, situation d’urgence"
"The armed campaign of EOKA, a Greek Cypriot guerrilla organisation led by George Grivas, against British rule in Cyprus and for union with Greece (enosis). It was fought with bombings, ambushes and assassinations, met by emergency rule, detention camps and the deportation of Archbishop Makarios, and fed rising violence between Greek and Turkish Cypriots; the Zurich and London agreements of 1959 ended it and made Cyprus an independent republic in 1960.": "La campagne armée d’EOKA, une organisation de guérilla chypriote grecque dirigée par George Grivas, contre la domination britannique à Chypre et pour l’union avec la Grèce (enose), a été combattue par des bombardements, des embuscades et des assassinats, rencontrée par la règle d’urgence, les camps de détention et la déportation de l’archevêque Makarios, et a alimenté la violence croissante entre Chypriotes grecs et Chypriotes turcs ; les accords de Zurich et de Londres de 1959 ont mis fin à cette opération et fait de Chypre une république indépendante en 1960."
"EOKA stands for Ethniki Organosis Kyprion Agoniston (National Organisation of Cypriot Fighters). Grivas used the code name “Digenis”.": "EOKA représente Ethniki Organosis Kyprion Agoniston (Organisation nationale des combattants chypriotes). Grivas a utilisé le nom de code -Digenis."
"About 370 British servicemen were killed, and EOKA lost around a hundred fighters; several hundred civilians died, among them Greek Cypriots killed by EOKA as alleged collaborators and victims of the intercommunal violence of 1958. Allegations that British forces tortured detainees were the subject of a court case in London that the British government settled in 2019.": "Environ 370 militaires britanniques ont été tués, et EOKA a perdu une centaine de combattants ; plusieurs centaines de civils sont morts, parmi lesquels des Chypriotes grecs tués par EOKA en tant que prétendus collaborateurs et victimes de la violence intercommunautaire de 1958. Les allégations selon lesquelles les forces britanniques auraient torturé des détenus ont fait l’objet d’une affaire judiciaire à Londres que le gouvernement britannique avait réglée en 2019."
