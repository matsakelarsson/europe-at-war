# French translations of the catalogue text (wave 11); step bodies follow later.
Dagohoy rebellion: Rébellion de Dagohoy
? A revolt on the island of Bohol that lasted 85 years, the longest against Spanish rule in the Philippines. It began in 1744; the killing of Giuseppe Lamberti, the Jesuit priest of Jagna, is dated to January 1744 in some accounts and January 1745 in others. Francisco Dagohoy (Francisco Sendrijas), a cabeza de barangay of Inabanga, turned against the Spanish when the Jesuit Gaspar Morales refused a Christian burial to his brother Sagarino, a constable killed while pursuing a fugitive, on the ground that he had died in a duel; forced labour, tribute and church dues fed the anger of many Boholanos. Dagohoy led about 3,000 people into the hills of the interior, where from December 1745 they ran their own government and farmed their own fields, with a base in the caves of Danao and the mountains behind Inabanga. Their numbers grew, by some accounts to 20,000. Expeditions sent by about twenty governors-general, and offers of pardon carried by the Jesuits and, after the Jesuits were expelled in 1768, by the Augustinian Recollects, failed to end the revolt, which outlived Dagohoy himself, whose death date is not known. In May 1827 Governor-General Mariano Ricafort sent José Lázaro Cairo to Bohol with 2,200 Spanish and Filipino troops and artillery. Two years of campaigning followed, in which people who had surrendered were beheaded at Inabanga and others were later deported from the island; by 31 August 1829 19,420 people had surrendered, and most were pardoned. The revolt is shown on the provincial flag of Bohol, and the town of Dagohoy is named after him.
: Une révolte sur l’île de Bohol qui dura 85 ans, la plus longue contre la domination espagnole aux Philippines. Elle commença en 1744 ; le meurtre de Giuseppe Lamberti, le prêtre jésuite de Jagna, est daté de janvier 1744 selon certains récits et de janvier 1745 selon d’autres. Francisco Dagohoy (Francisco Sendrijas), cabeza de barangay d’Inabanga, se retourna contre les Espagnols lorsque le jésuite Gaspar Morales refusa une sépulture chrétienne à son frère Sagarino, un agent de police tué alors qu’il poursuivait un fugitif, au motif qu’il était mort en duel ; le travail forcé, le tribut et les redevances dues à l’Église nourrissaient la colère de nombreux Boholanos. Dagohoy entraîna environ 3 000 personnes dans les collines de l’intérieur où, à partir de décembre 1745, elles se gouvernèrent elles-mêmes et cultivèrent leurs propres champs, avec pour base les grottes de Danao et les montagnes situées derrière Inabanga. Leur nombre augmenta, jusqu’à 20 000 selon certains récits. Les expéditions envoyées par une vingtaine de gouverneurs généraux, et les offres de pardon portées par les jésuites puis, après l’expulsion de ceux-ci en 1768, par les augustins récollets, ne parvinrent pas à mettre fin à la révolte, qui survécut à Dagohoy lui-même, dont la date de mort est inconnue. En mai 1827, le gouverneur général Mariano Ricafort envoya José Lázaro Cairo à Bohol avec 2 200 soldats espagnols et philippins et de l’artillerie. Suivirent deux années de campagne, au cours desquelles des personnes qui s’étaient rendues furent décapitées à Inabanga et d’autres furent ensuite déportées hors de l’île ; au 31 août 1829, 19 420 personnes s’étaient rendues, et la plupart furent graciées. La révolte figure sur le drapeau de la province de Bohol, et la ville de Dagohoy porte son nom.
