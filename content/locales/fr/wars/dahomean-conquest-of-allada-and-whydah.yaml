# French translations of the catalogue text (wave 13); step bodies follow later.
Dahomey’s conquest of Allada and Whydah: Conquête d’Allada et de Ouidah par le Dahomey
? The wars by which King Agaja of Dahomey, an inland kingdom on the Abomey plateau, conquered the two coastal kingdoms through which Europeans bought captives on the Slave Coast, in today’s Benin. Allada and Whydah (Hueda), like Dahomey, were tributaries of the Yoruba empire of Oyo, and their ports, with the forts and compounds of the Dutch, English, French and Portuguese, exported thousands of enslaved people a year. Taking advantage of a succession dispute, Agaja’s army stormed Allada on 30 March 1724, killing its king and burning the palace, and took Godomey on the coast in April. On 26 February 1727 he attacked Whydah, whose king Huffon fled; contemporary reports speak of about 5,000 killed and 10,000 to 11,000 captured in five days, and in April Agaja burned the European trading factories. Dahomey more than doubled its territory and gained direct access to the Atlantic trade, which Agaja made a royal monopoly in 1733. Whether he meant to control the slave trade or, as some writers argued, to end it has long been debated. The conquests brought Oyo’s armies down on Dahomey, and the Whydah exiles fought on from the coastal islands for years.
: Les guerres par lesquelles le roi Agadja du Dahomey, royaume de l’intérieur établi sur le plateau d’Abomey, conquit les deux royaumes côtiers par l’intermédiaire desquels les Européens achetaient des captifs sur la Côte des Esclaves, dans l’actuel Bénin. Allada et Ouidah (Houéda) étaient, comme le Dahomey, tributaires de l’empire yoruba d’Oyo, et leurs ports, avec les forts et les comptoirs des Néerlandais, des Anglais, des Français et des Portugais, exportaient chaque année des milliers de personnes réduites en esclavage. Profitant d’une querelle de succession, l’armée d’Agadja prit d’assaut Allada le 30 mars 1724, tuant son roi et incendiant le palais, puis s’empara de Godomey, sur la côte, en avril. Le 26 février 1727, Agadja attaqua Ouidah, dont le roi Houffon s’enfuit ; des témoignages contemporains font état d’environ 5 000 tués et de 10 000 à 11 000 captifs en cinq jours, et en avril il incendia les comptoirs européens. Le Dahomey fit plus que doubler son territoire et obtint un accès direct au commerce atlantique, dont Agadja fit un monopole royal en 1733. La question de savoir s’il voulait contrôler la traite des esclaves ou, comme l’ont soutenu certains auteurs, y mettre fin a longtemps été débattue. Ces conquêtes attirèrent sur le Dahomey les armées d’Oyo, et les exilés de Ouidah poursuivirent la lutte pendant des années depuis les îles côtières.
