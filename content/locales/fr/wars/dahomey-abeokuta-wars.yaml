# French translations of the catalogue text (wave 13); step bodies follow later.
Dahomey’s wars against Abeokuta: Guerres du Dahomey contre Abeokuta
Two great attacks by the Kingdom of Dahomey on Abeokuta, the city of the Egba in what is now south-western Nigeria, in 1851 and 1864, part of a rivalry that lasted from the 1840s to the end of Dahomey’s independence. Abeokuta, founded about 1830 by Egba refugees from the wars that followed the fall of Oyo, grew into a large walled city on the Ogun river, a centre of Christian missions and of the new palm-oil trade, and a rival to Dahomey for the trade and captives of the region between them. On 3 March 1851 King Gezo’s army, women soldiers in its front ranks, stormed Abeokuta’s walls and was driven off with heavy losses. Thirteen years later, on 15 March 1864, his son Glele attacked again, to avenge his father, and was routed in turn. Neither attack ended the rivalry. Dahomey went on raiding the Egba and western Yoruba borderlands, destroying Ketu in 1886, until the French conquest of Dahomey in 1892–1894.: Deux grandes attaques du royaume du Dahomey contre Abeokuta, la ville des Egba, dans l’actuel sud-ouest du Nigeria, en 1851 et en 1864, épisodes d’une rivalité qui dura des années 1840 à la fin de l’indépendance du Dahomey. Fondée vers 1830 par des réfugiés egba fuyant les guerres qui suivirent la chute d’Oyo, Abeokuta devint une grande ville fortifiée sur l’Ogun, un centre des missions chrétiennes et du nouveau commerce de l’huile de palme, et une rivale du Dahomey pour le commerce et les captifs de la région qui les séparait. Le 3 mars 1851, l’armée du roi Ghézo, avec des femmes soldats en première ligne, donna l’assaut aux murailles d’Abeokuta et fut repoussée avec de lourdes pertes. Treize ans plus tard, le 15 mars 1864, son fils Glélé attaqua de nouveau pour venger son père, et fut à son tour mis en déroute. Aucune des deux attaques ne mit fin à la rivalité. Le Dahomey continua de razzier les confins egba et yoruba occidentaux, détruisant Kétou en 1886, jusqu’à la conquête française du Dahomey en 1892–1894.
