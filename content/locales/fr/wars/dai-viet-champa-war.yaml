# French translations of the catalogue text (wave 11); step bodies follow later.
Đại Việt–Champa war of 1471: Guerre entre le Đại Việt et le Champa (1471)
The invasion of Champa by the Lê emperor Lê Thánh Tông of Đại Việt, which destroyed the Cham capital Vijaya and ended Champa as a major power. After a Cham attack on the Vietnamese frontier at Hóa Châu in 1470, Lê Thánh Tông led south a fleet and army that the Vietnamese sources put at 250,000 men, with firearms on the Ming model. Landing on the coast of today’s Quảng Nam and Quảng Ngãi in February 1471, it overran northern Champa in two weeks, took the port of Thị Nại on 18 March and, after a siege of four days, stormed Vijaya on 22 March. The king, Trà Toàn, was captured and deported to the north; by the figures of the Vietnamese chronicles more than 30,000 Cham were captured and 40,000 executed. Đại Việt annexed the land as far as the Cù Mông pass, south of Vijaya, as the province of Quảng Nam, and the rest of Champa, centred on Panduranga in the far south, survived as a group of small principalities under Vietnamese overlordship until 1832.: L’invasion du Champa par l’empereur Lê Thánh Tông, de la dynastie Lê du Đại Việt, qui détruisit la capitale chame, Vijaya, et mit fin au Champa en tant que grande puissance. Après une attaque chame contre la frontière vietnamienne à Hóa Châu en 1470, Lê Thánh Tông conduisit vers le sud une flotte et une armée que les sources vietnamiennes estiment à 250 000 hommes, dotées d’armes à feu sur le modèle Ming. Débarquée sur la côte des actuelles provinces de Quảng Nam et de Quảng Ngãi en février 1471, elle envahit le nord du Champa en deux semaines, prit le port de Thị Nại le 18 mars et, après un siège de quatre jours, emporta Vijaya d’assaut le 22 mars. Le roi, Trà Toàn, fut capturé et déporté dans le nord ; selon les chiffres des chroniques vietnamiennes, plus de 30 000 Chams furent faits prisonniers et 40 000 exécutés. Le Đại Việt annexa le territoire jusqu’au col de Cù Mông, au sud de Vijaya, sous le nom de province de Quảng Nam, et le reste du Champa, centré sur le Panduranga, à l’extrême sud, survécut sous la forme d’un ensemble de petites principautés sous suzeraineté vietnamienne jusqu’en 1832.
