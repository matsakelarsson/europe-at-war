# French translations of the catalogue text (wave 11); step bodies follow later.
Đại Việt–Lan Xang war: Guerre entre le Đại Việt et le Lan Xang
The invasion of the Lao kingdom of Lan Xang and the principality of Muang Phuan by Lê Thánh Tông of Đại Việt, also called the White Elephant War after the story the Lao chronicles tell of its cause. After a revolt in Muang Phuan in 1478, in which Vietnamese officials were killed, Vietnamese armies entered the Lao uplands in the autumn of 1479 by five routes. They defeated the Lao army near the Plain of Jars, destroyed the Phuan capital Xieng Khouang and took the Lao capital Luang Prabang, while King Chakkaphat Phaen Phaeo fled to Vientiane. But the invaders suffered from disease, and when one army pushed west towards Lan Na it was defeated near Nan in 1480 or 1481 by Tao Kha Kan, a governor of King Tilok of Lan Na. Under pressure from the Ming, who warned Đại Việt off its neighbours, the Vietnamese withdrew; by October 1484 Lan Xang and Lan Na reported to the Ming that they were gone. Muang Phuan remained a tributary of Đại Việt and Lan Xang in turn.: L’invasion du royaume lao du Lan Xang et de la principauté de Muang Phuan par Lê Thánh Tông du Đại Việt, appelée aussi guerre de l’Éléphant blanc d’après le récit que font les chroniques lao de sa cause. Après une révolte à Muang Phuan en 1478, au cours de laquelle des fonctionnaires vietnamiens furent tués, les armées vietnamiennes pénétrèrent dans les hautes terres lao à l’automne 1479 par cinq routes. Elles vainquirent l’armée lao près de la plaine des Jarres, détruisirent Xieng Khouang, la capitale du Phuan, et prirent la capitale lao, Luang Prabang, tandis que le roi Chakkaphat Phaen Phaeo s’enfuyait à Vientiane. Mais les envahisseurs souffraient des maladies, et lorsqu’une armée poussa vers l’ouest en direction du Lan Na, elle fut vaincue près de Nan en 1480 ou 1481 par Tao Kha Kan, gouverneur du roi Tilok du Lan Na. Sous la pression des Ming, qui sommèrent le Đại Việt de laisser ses voisins en paix, les Vietnamiens se retirèrent ; en octobre 1484, le Lan Xang et le Lan Na signalaient aux Ming qu’ils étaient partis. Muang Phuan resta tributaire tour à tour du Đại Việt et du Lan Xang.
