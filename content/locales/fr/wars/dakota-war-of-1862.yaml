# French translations of the catalogue text (wave 14); step bodies follow later.
Dakota War of 1862: Guerre des Dakotas de 1862
? The war between the eastern Dakota (Santee Sioux) and the United States in the Minnesota River valley in August and September 1862, and its aftermath. Treaties in 1851 and 1858 had left the four eastern Dakota bands a narrow strip along the Minnesota River, and traders’ claims swallowed much of the payments promised for their land. After a crop failure and a hard winter, the 1862 payment was late, and agents and traders refused food on credit. On 17 August four young Dakota men killed five settlers at Acton; that night the Mdewakanton soldiers’ lodge persuaded Taoyateduta (Little Crow) to lead a war to drive the settlers from the valley. Dakota fighters attacked the Lower Sioux Agency on 18 August and killed hundreds of settlers in the following days, but failed to take Fort Ridgely and New Ulm. Colonel Henry Hastings Sibley’s volunteers defeated them at Wood Lake on 23 September, and on 26 September Dakota who had opposed the war handed over 269 captives at Camp Release. Counts of the settlers killed range from 358 to more than 600, besides 77 soldiers and 36 militiamen and armed civilians; Dakota losses are not known. A military commission sentenced 303 Dakota men to death; President Lincoln approved 39 sentences, and 38 men were hanged at Mankato on 26 December 1862, the largest mass execution in the history of the United States. About 1,600 Dakota non-combatants were held in a camp below Fort Snelling, where between about 100 and 300 died; in 1863 Congress annulled the treaties and the Dakota were expelled from Minnesota to Crow Creek on the Missouri. Expeditions under Sibley and Alfred Sully in 1863 and 1864 carried the war into Dakota Territory against the Dakota, Yanktonai and Lakota.
: La guerre qui opposa les Dakotas de l’Est (Sioux Santees) aux États-Unis dans la vallée de la rivière Minnesota en août et septembre 1862, et ses suites. Des traités de 1851 et 1858 avaient laissé aux quatre bandes dakotas de l’Est une étroite bande de terre le long de la rivière Minnesota, et les créances des négociants avaient englouti une grande partie des paiements promis pour leurs terres. Après une mauvaise récolte et un hiver rigoureux, le versement de 1862 était en retard, et agents et négociants refusaient de faire crédit pour la nourriture. Le 17 août, quatre jeunes Dakotas tuèrent cinq colons à Acton ; la nuit même, la loge des soldats mdewakantons persuada Taoyateduta (Little Crow) de mener une guerre pour chasser les colons de la vallée. Les combattants dakotas attaquèrent la Lower Sioux Agency le 18 août et tuèrent des centaines de colons dans les jours suivants, mais ne parvinrent à prendre ni Fort Ridgely ni New Ulm. Les volontaires du colonel Henry Hastings Sibley les battirent à Wood Lake le 23 septembre et, le 26 septembre, des Dakotas qui s’étaient opposés à la guerre remirent 269 captifs à Camp Release. Les estimations du nombre de colons tués vont de 358 à plus de 600, sans compter 77 soldats et 36 miliciens et civils armés ; les pertes dakotas ne sont pas connues. Une commission militaire condamna à mort 303 hommes dakotas ; le président Lincoln confirma 39 condamnations, et 38 hommes furent pendus à Mankato le 26 décembre 1862, la plus grande exécution collective de l’histoire des États-Unis. Environ 1 600 non-combattants dakotas furent détenus dans un camp au pied de Fort Snelling, où entre 100 et 300 d’entre eux environ moururent ; en 1863, le Congrès annula les traités et les Dakotas furent expulsés du Minnesota vers Crow Creek, sur le Missouri. Des expéditions menées par Sibley et Alfred Sully en 1863 et 1864 portèrent la guerre dans le territoire du Dakota, contre les Dakotas, les Yanktonais et les Lakotas.
