"Danish–Wendish wars": "Guerres danoise et wendoise"
"A series of Danish seaborne campaigns under King Valdemar I and Bishop Absalon against the Slavic Wends of the southern Baltic coast, who had raided Denmark for decades. The Danes conquered and converted the island of Rügen in 1168 and in 1185 made the Duke of Pomerania a vassal of the Danish king.": "Une série de campagnes maritimes danoises sous le roi Valdemar Ier et Mgr Absalon contre les Wendes slaves de la côte sud de la Baltique, qui avaient fait une descente au Danemark pendant des décennies. Les Danois ont conquis et converti l’île de Rügen en 1168 et en 1185 a fait du duc de Poméranie un vassal du roi danois."
"Almost everything known about these wars comes from Saxo Grammaticus’s Gesta Danorum, written for Absalon, which celebrates his deeds. Dates and numbers are often uncertain; the fall of Arkona is usually dated 1168, but some historians argue for 1169.": "Presque tout ce qui est connu à propos de ces guerres vient de Saxo Grammaticus, Gesta Danorum, écrit pour Absalon, qui célèbre ses actes. Les dates et les chiffres sont souvent incertains ; la chute d’Arkona est généralement datée de 1168, mais certains historiens argumentent pour 1169."
"Contemporaries saw the campaigns against the pagan Rani as crusades, like the German Wendish Crusade of 1147, though the Pomeranian dukes were already Christian.": "Les contemporains voyaient les campagnes contre le païen Rani comme des croisades, comme la Croisade allemande Wendish de 1147, bien que les ducs Poméranies étaient déjà chrétiens."
