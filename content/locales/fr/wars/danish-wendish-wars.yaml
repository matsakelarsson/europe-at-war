"The Danes now turned on the Christian dukes of Pomerania, whose lands at the mouth of the Oder were also bases for raiders. In 1170 they destroyed a stronghold at Dziwnów and fought their way past a Pomeranian army and fleet at the bridge of Wolin. In 1177 the dukes bought peace with heavy tribute. Valdemar also built a great castle at Vordingborg as a base for further raids.": "Les Danois se tournèrent maintenant vers les ducs chrétiens de Poméranie, dont les terres à l’embouchure de l’Oder étaient aussi des bases pour les raideurs. En 1170, ils détruisirent une forteresse à Dziwnów et combattirent leur chemin devant une armée et une flotte de Poméranie au pont de Wolin. Valdemar a également construit un grand château à Vordingborg comme base pour d’autres raids."
"After Valdemar’s death in 1182 his son Canute VI refused to do homage to the emperor Frederick Barbarossa, who had made Duke Bogislaw I of Pomerania an imperial prince. In 1184 Bogislaw attacked Rügen on the emperor’s behalf, but Absalon, now archbishop of Lund, destroyed the Pomeranian fleet off the coast near Stralsund at Whitsun. Danish raids followed, and in 1185 Bogislaw submitted and took his duchy as a fief from Canute VI.": "Après la mort de Valdemar, en 1182, son fils Canute VI refusa de rendre hommage à l’empereur Frederick Barbarossa, qui avait fait duc Bogislaw Ier de Poméranie un prince impérial. En 1184, Bogislaw attaqua Rügen au nom de l’empereur, mais Absalon, aujourd'hui archevêque de Lund, détruisit la flotte de Poméranie au large de la côte près de Stralsund à Whitsun. Des raids danois suivirent, et en 1185 Bogislaw se présenta et prit son duché comme fief de Canute VI."
