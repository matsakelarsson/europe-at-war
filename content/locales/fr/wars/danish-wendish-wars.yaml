"1159–1169": "1159–1169"
"During Denmark’s civil wars of the 1140s and 1150s, Wendish fleets from Rügen and the Pomeranian coast raided the Danish islands almost at will, and by one account a third of the kingdom lay waste when Valdemar I became sole king in 1157. With his foster brother Absalon, bishop of Roskilde from 1158, Valdemar struck back. From 1159 Danish fleets sailed against the Wendish coast almost every year, burning settlements and taking captives, at times in alliance with Duke Henry the Lion of Saxony and at times in rivalry with him.": "Pendant les guerres civiles des années 1140 et 1150 au Danemark, les flottes wendish de Rügen et de la côte Poméranie pillèrent presque à volonté les îles danoises, et d’un seul chef un tiers du royaume laissait tomber quand Valdemar Ier devint roi unique en 1157. Avec son frère adoptif Absalon, évêque de Roskilde de 1158, Valdemar renversa. À partir de 1159, les flottes danoises naviguent presque chaque année contre la côte wendoise, brûlant des colonies et captives, parfois en alliance avec le duc Henry le Lion de Saxe et parfois en rivalité avec lui."
"The main target was Rügen, home of the pagan Rani and their temple of Svantevit at Arkona. In 1168 Valdemar and Absalon, with Pomeranian allies, took the temple fortress after a siege of only a few days. The great four-headed idol was chopped up and burned. The other strongholds of the island then surrendered, its people were baptised, and their prince, Jaromar, became Valdemar’s vassal. To guard Zealand against raids, Absalon built a castle at Havn, the beginning of Copenhagen.": "La cible principale était Rügen, la maison du païen Rani et leur temple de Svantevit à Arkona. En 1168 Valdemar et Absalon, avec des alliés Poméranies, ont pris la forteresse du temple après un siège de seulement quelques jours. Les autres bastions de l’île se rendirent alors, son peuple fut baptisé, et leur prince, Jaromar, devint vassal de Valdemar. Pour protéger la Zélande contre les raids, Absalon construisit un château à Havn, le début de Copenhague."
