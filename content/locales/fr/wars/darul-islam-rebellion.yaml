# French translations of the catalogue text (wave 11); step bodies follow later.
Darul Islam rebellion: Rébellion du Darul Islam
? "The armed movement for an Islamic state in Indonesia, led by Sekarmadji Maridjan Kartosuwiryo, against the Republic. Darul Islam (“house of Islam”) grew out of the Hizbullah and Sabilillah militias that had fought the Dutch in West Java. When the Renville agreement of January 1948 obliged the Republic’s army to leave West Java for Central Java, these units stayed behind, and in May 1948 Kartosuwiryo formed an Islamic council around Tasikmalaya. On 7 August 1949, as the Republic negotiated with the Dutch, he proclaimed the Islamic State of Indonesia (Negara Islam Indonesia) with himself as imam, and his Islamic Army of Indonesia (TII) fought both the Dutch and the returning Republican army. Other risings, each with grievances of its own, joined it: Amir Fatah in the Brebes and Tegal area of Central Java (1949), Ibnu Hadjar in South Kalimantan (from 1950, in Darul Islam from 1954), Kahar Muzakkar, whose guerrillas had been refused entry into the army as units, in South Sulawesi (from 1950, proclaiming the region part of the Islamic State on 7 August 1953), and Daud Beureu’eh in Aceh (from September 1953), angered when Aceh was merged into the province of North Sumatra. For a decade the rebels controlled much of the hill country of West Java at night and taxed, raided and burned villages that would not support them, while army operations also cost many civilian lives. The army gained the upper hand from about 1959–1960 with the pagar betis (“fence of legs”), in which villagers were made to form human cordons that swept the mountains and drove the rebels before the troops. Kartosuwiryo was captured on Mount Geber near Garut on 4 June 1962, sentenced by a military court and executed in September 1962 on an island in the Bay of Jakarta, and the last bands in West Java surrendered that year. Aceh had already been made a special region in 1959, and Daud Beureu’eh came down from the hills under an amnesty in 1962; Ibnu Hadjar surrendered in 1963 and was executed in 1965, and the movement ended in Sulawesi when Kahar Muzakkar was killed by soldiers in Southeast Sulawesi on 3 February 1965."
: "Le mouvement armé pour un État islamique en Indonésie, dirigé par Sekarmadji Maridjan Kartosuwiryo contre la République. Le Darul Islam (« maison de l’islam ») naquit des milices Hizbullah et Sabilillah qui avaient combattu les Néerlandais à Java occidental. Lorsque l’accord de Renville de janvier 1948 obligea l’armée de la République à quitter Java occidental pour Java central, ces unités restèrent sur place, et en mai 1948 Kartosuwiryo forma un conseil islamique autour de Tasikmalaya. Le 7 août 1949, alors que la République négociait avec les Néerlandais, il proclama l’État islamique d’Indonésie (Negara Islam Indonesia), dont il se fit l’imam, et son Armée islamique d’Indonésie (TII) combattit à la fois les Néerlandais et l’armée républicaine revenue dans la région. D’autres soulèvements, chacun nourri de griefs propres, s’y rallièrent : celui d’Amir Fatah dans la région de Brebes et de Tegal, à Java central (1949), celui d’Ibnu Hadjar dans le Kalimantan du Sud (à partir de 1950, au sein du Darul Islam à partir de 1954), celui de Kahar Muzakkar, dont les guérilleros s’étaient vu refuser l’intégration dans l’armée en tant qu’unités constituées, dans le Sulawesi du Sud (à partir de 1950, la région étant proclamée partie de l’État islamique le 7 août 1953), et celui de Daud Beureu’eh à Aceh (à partir de septembre 1953), irrité par le rattachement d’Aceh à la province de Sumatra du Nord. Pendant une décennie, les rebelles contrôlèrent la nuit une grande partie des collines de Java occidental, levèrent des impôts, lancèrent des raids et incendièrent les villages qui refusaient de les soutenir, tandis que les opérations de l’armée coûtaient elles aussi la vie à de nombreux civils. L’armée prit le dessus à partir de 1959–1960 environ grâce au pagar betis (« clôture de jambes »), par lequel les villageois étaient contraints de former des cordons humains qui ratissaient les montagnes et poussaient les rebelles devant les troupes. Kartosuwiryo fut capturé sur le mont Geber, près de Garut, le 4 juin 1962, condamné par un tribunal militaire et exécuté en septembre 1962 sur une île de la baie de Jakarta, et les dernières bandes de Java occidental se rendirent la même année. Aceh avait déjà reçu le statut de région spéciale en 1959, et Daud Beureu’eh descendit des collines à la faveur d’une amnistie en 1962 ; Ibnu Hadjar se rendit en 1963 et fut exécuté en 1965, et le mouvement prit fin à Sulawesi lorsque Kahar Muzakkar fut tué par des soldats dans le Sulawesi du Sud-Est le 3 février 1965."
