# French translations of the catalogue text (wave 9); step bodies follow later.
Dayan Khan’s wars: Guerres de Dayan Khan
? The wars by which Dayan Khan (Batumöngke), a boy of the Chinggisid line proclaimed khan of the Eastern Mongols in about 1479–1480, reunited the Mongols east of the Altai after the collapse of Oirat power. In his early years the campaigns were led by Mandukhai Khatun, widow of the previous khan, who later married him; she defeated the Oirats, and in 1483 the two drove out the taishi Ismayil, who fled towards Hami and was killed there. The right-wing tümens of the Ordos, Tümed and Yöngshiyebü, dominated by the chiefs Ibarai and Mandulai, rejected his authority and killed his son Ulus Bolad when he came to them as jinong. After a defeat at the Turgen stream, Dayan Khan crushed them in 1510 at Dalan Terigün; Mandulai was killed and Ibarai fled to Kokonor, and in 1513 another son, Barsu Bolad, was installed as jinong. Dayan Khan organised the Eastern Mongols into six tümens ruled by his descendants, a structure that lasted until the 17th century. Throughout these years the Mongols raided the Ming frontier, attacking Ningxia in 1500 and Datong and Xuanfu repeatedly, and in 1517 a large raid was turned back by the Zhengde Emperor at Yingzhou; the Ming answered by extending its frontier walls. Dayan Khan’s death is usually dated 1517, though dates up to 1543 are given.
: Les guerres par lesquelles Dayan Khan (Batumöngke), un enfant de la lignée gengiskhanide proclamé khan des Mongols orientaux vers 1479–1480, réunifia les Mongols à l’est de l’Altaï après l’effondrement de la puissance oïrate. Dans ses premières années, les campagnes furent menées par Mandukhai Khatun, veuve du khan précédent, qui l’épousa par la suite ; elle vainquit les Oïrats et, en 1483, tous deux chassèrent le taishi Ismayil, qui s’enfuit vers Hami et y fut tué. Les tümen de l’aile droite, Ordos, Tümed et Yöngshiyebü, dominés par les chefs Ibarai et Mandulai, rejetèrent son autorité et tuèrent son fils Ulus Bolad lorsqu’il vint à eux comme jinong. Après une défaite sur le ruisseau Turgen, Dayan Khan les écrasa en 1510 à Dalan Terigün ; Mandulai fut tué et Ibarai s’enfuit au Kokonor et, en 1513, un autre fils, Barsu Bolad, fut installé comme jinong. Dayan Khan organisa les Mongols orientaux en six tümen gouvernés par ses descendants, une structure qui dura jusqu’au XVIIe siècle. Pendant toutes ces années, les Mongols lancèrent des raids sur la frontière des Ming, attaquant le Ningxia en 1500 et, à plusieurs reprises, Datong et Xuanfu, et en 1517 un grand raid fut repoussé par l’empereur Zhengde à Yingzhou ; les Ming répondirent en prolongeant leurs murailles frontalières. La mort de Dayan Khan est habituellement datée de 1517, mais des dates allant jusqu’à 1543 sont avancées.
