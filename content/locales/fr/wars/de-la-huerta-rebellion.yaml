# French translations of the catalogue text (wave 14); step bodies follow later.
De la Huerta rebellion: Rébellion delahuertiste
? A military revolt against President Álvaro Obregón after he chose Plutarco Elías Calles to succeed him in the election of 1924. Adolfo de la Huerta, interim president in 1920 and then Obregón’s finance minister, had broken with him over the Bucareli agreements with the United States and over the succession, and became the candidate of the Partido Nacional Cooperatista. On 6 December 1923 General Guadalupe Sánchez rose with the troops in Veracruz, and the next day de la Huerta, who had gone to the port, issued the Plan of Veracruz, accusing Obregón of imposing his successor. Generals Enrique Estrada in Jalisco and Fortunato Maycotte in Oaxaca, with Manuel Diéguez, Salvador Alvarado, Cándido Aguilar and others, joined; between two-fifths and half of the army, some 23,000 men by one count, rebelled, and by mid-December the rebels held most of Veracruz, Tabasco, Jalisco and Oaxaca. But they had no common command or plan. Obregón armed workers’ and peasants’ battalions, the CROM labour federation and agrarista leaders backed the government, and the United States, which had recognised Obregón’s government in 1923, sold it rifles and aircraft. In Yucatán rebel officers shot the socialist governor Felipe Carrillo Puerto and three of his brothers on 3 January 1924, against de la Huerta’s orders. Government troops under Eugenio Martínez beat Sánchez at Esperanza, on the border of Puebla and Veracruz, on 28 January, and in February Obregón defeated Estrada at Ocotlán, on the Lerma, and took Guadalajara. De la Huerta withdrew to Frontera in Tabasco and left for the United States in March; the rebels abandoned Villahermosa, their last stronghold, in June 1924. Thousands died. Many captured rebel generals were shot, among them Maycotte and Diéguez, and Alvarado was killed in Tabasco; the purge left the army more loyal to the Sonoran leaders, and Calles won the election of July 1924.
: Une révolte militaire contre le président Álvaro Obregón, après que celui-ci eut choisi Plutarco Elías Calles pour lui succéder à l’élection de 1924. Adolfo de la Huerta, président par intérim en 1920 puis ministre des Finances d’Obregón, avait rompu avec lui à propos des accords de Bucareli avec les États-Unis et de la succession, et était devenu le candidat du Partido Nacional Cooperatista. Le 6 décembre 1923, le général Guadalupe Sánchez se souleva avec les troupes de Veracruz et, le lendemain, Adolfo de la Huerta, qui s’était rendu dans le port, lança le plan de Veracruz, accusant Obregón d’imposer son successeur. Les généraux Enrique Estrada dans le Jalisco et Fortunato Maycotte dans l’Oaxaca, ainsi que Manuel Diéguez, Salvador Alvarado, Cándido Aguilar et d’autres, se rallièrent au mouvement ; entre les deux cinquièmes et la moitié de l’armée, quelque 23 000 hommes selon un décompte, se rebellèrent et, à la mi-décembre, les rebelles tenaient la plus grande partie des États de Veracruz, de Tabasco, de Jalisco et d’Oaxaca. Mais ils n’avaient ni commandement ni plan communs. Obregón arma des bataillons d’ouvriers et de paysans, la confédération syndicale CROM et les dirigeants agraristes soutinrent le gouvernement, et les États-Unis, qui avaient reconnu le gouvernement d’Obregón en 1923, lui vendirent des fusils et des avions. Au Yucatán, des officiers rebelles fusillèrent le gouverneur socialiste Felipe Carrillo Puerto et trois de ses frères le 3 janvier 1924, contre les ordres d’Adolfo de la Huerta. Les troupes gouvernementales d’Eugenio Martínez battirent Sánchez à Esperanza, à la limite des États de Puebla et de Veracruz, le 28 janvier et, en février, Obregón vainquit Estrada à Ocotlán, sur le Lerma, et prit Guadalajara. De la Huerta se replia sur Frontera, dans le Tabasco, et partit pour les États-Unis en mars ; les rebelles abandonnèrent Villahermosa, leur dernier bastion, en juin 1924. Des milliers de personnes périrent. De nombreux généraux rebelles capturés furent fusillés, parmi lesquels Maycotte et Diéguez, et Alvarado fut tué dans le Tabasco ; la purge rendit l’armée plus loyale envers les dirigeants sonoriens, et Calles remporta l’élection de juillet 1924.
