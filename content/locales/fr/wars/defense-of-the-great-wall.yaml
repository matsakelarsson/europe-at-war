# French translations of the catalogue text (wave 9); step bodies follow later.
Defence of the Great Wall: Défense de la Grande Muraille
? The Japanese conquest of the province of Rehe (Jehol) and the fighting at the passes of the Great Wall in the first months of 1933, which ended with the Tanggu Truce. After the conquest of Manchuria the Kwantung Army claimed Rehe for Manchukuo. It took the Shanhai Pass on 1–3 January 1933, and on 23 February Japanese and Manchukuo troops invaded Rehe, whose governor Tang Yulin fled; Chengde fell on 4 March and Rehe was joined to Manchukuo. Chinese armies, the Northeastern Army of Zhang Xueliang, Song Zheyuan’s 29th Army and divisions of the Central Army, then held the passes of the Great Wall north-east of Beiping for two months, at Xifengkou, Gubeikou, Lengkou and Jielingkou, with heavy losses. In May the Japanese came through the Wall and advanced to within reach of Beiping and Tianjin, and on 31 May 1933 the two sides signed a truce at Tanggu that made the land between the Wall and Beiping a demilitarised zone. Chinese records give about 15,800 soldiers killed and 22,600 wounded from January to May. The truce left the Wall as the de facto border of Manchukuo and opened North China to Japanese pressure.
: La conquête japonaise de la province du Rehe (Jehol) et les combats aux passes de la Grande Muraille dans les premiers mois de 1933, qui s’achevèrent par la trêve de Tanggu. Après la conquête de la Mandchourie, l’armée du Kwantung revendiqua le Rehe pour le Mandchoukouo. Elle prit la passe de Shanhai du 1er au 3 janvier 1933 et, le 23 février, les troupes du Japon et du Mandchoukouo envahirent le Rehe, dont le gouverneur Tang Yulin s’enfuit ; Chengde tomba le 4 mars et le Rehe fut rattaché au Mandchoukouo. Les armées chinoises, l’armée du Nord-Est de Zhang Xueliang, la 29e armée de Song Zheyuan et des divisions de l’armée centrale, tinrent alors pendant deux mois les passes de la Grande Muraille au nord-est de Beiping, à Xifengkou, Gubeikou, Lengkou et Jielingkou, au prix de lourdes pertes. En mai, les Japonais franchirent la Muraille et avancèrent jusqu’à portée de Beiping et de Tianjin et, le 31 mai 1933, les deux camps signèrent à Tanggu une trêve qui fit des terres situées entre la Muraille et Beiping une zone démilitarisée. Les archives chinoises font état d’environ 15 800 soldats tués et 22 600 blessés de janvier à mai. La trêve fit de la Muraille la frontière de fait du Mandchoukouo et ouvrit la Chine du Nord à la pression japonaise.
