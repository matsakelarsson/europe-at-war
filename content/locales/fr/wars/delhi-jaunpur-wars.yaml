# French translations of the catalogue text (wave 8); step bodies follow later.
Delhi–Jaunpur wars: Guerres entre Delhi et Jaunpur
The wars between the Lodi sultans of Delhi and the Sharqi sultans of Jaunpur, which since Timur’s sack of Delhi in 1398 had been the strongest state in the Ganges plain. In 1452 Mahmud Shah Sharqi besieged Delhi while its new Afghan sultan, Bahlul Lodi, was away in the Punjab; Bahlul returned and defeated him, and the two fought over Etawah and Shamsabad until peace was made in 1457. Husain Shah Sharqi, sultan from 1458, kept a four-year truce, then renewed the war. In 1478 and 1479 he marched on Delhi three times and was beaten each time on the Yamuna or soon after; Bahlul took Kampil, Patiali, Shamsabad and other districts, defeated him again on the Rahab and took Jaunpur. Husain won it back briefly but was driven out and fled to the protection of the sultan of Bengal at Kahalgaon. Bahlul made his son Barbak Shah king of Jaunpur in 1486, and Husain’s last attempt to return was defeated near Benares in 1494.: Les guerres entre les sultans Lodi de Delhi et les sultans Sharqi de Jaunpur, qui était depuis le sac de Delhi par Tamerlan en 1398 l’État le plus puissant de la plaine du Gange. En 1452, Mahmud Shah Sharqi assiégea Delhi pendant que son nouveau sultan afghan, Bahlul Lodi, se trouvait au Pendjab ; Bahlul revint et le battit, et les deux souverains se disputèrent Etawah et Shamsabad jusqu’à la paix conclue en 1457. Husain Shah Sharqi, sultan à partir de 1458, respecta une trêve de quatre ans, puis reprit la guerre. En 1478 et 1479, il marcha trois fois sur Delhi et fut battu chaque fois sur la Yamuna ou peu après ; Bahlul prit Kampil, Patiali, Shamsabad et d’autres districts, le battit de nouveau sur la Rahab et prit Jaunpur. Husain reprit brièvement la ville, mais il en fut chassé et s’enfuit sous la protection du sultan du Bengale, à Kahalgaon. Bahlul fit de son fils Barbak Shah le roi de Jaunpur en 1486, et la dernière tentative de retour de Husain fut repoussée près de Bénarès en 1494.
