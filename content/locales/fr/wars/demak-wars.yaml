# French translations of the catalogue text (wave 11); step bodies follow later.
Demak’s wars: Guerres de Demak
? "The wars of Demak, the first Muslim sultanate of Java, which in the first half of the 16th century made itself the leading power of the island. Demak, a port on the north coast of Central Java that had broken away from Majapahit, led the Javanese ports against the Portuguese after their capture of Malacca: in January 1513 Pati Unus, the ruler of Japara, attacked Malacca with about 100 ships and was defeated, and Javanese tradition tells of a second attack in 1521 in which he was killed. Under Sultan Trenggana Demak then overcame the last Hindu-Buddhist powers. It defeated Daha, the successor of Majapahit in the Brantas valley, a victory dated by different sources between 1518 and about 1527, and when the Hindu kingdom of Sunda made an alliance with the Portuguese in 1522, Trenggana sent Fatahillah with troops from Demak and Cirebon to take Banten and Sunda Kelapa, which he renamed Jayakarta, in 1527. Campaigns followed against the ports and inland principalities of eastern Java: Tuban, Madiun, Surabaya (1530), Pasuruan and Malang. In 1546 Trenggana was killed while besieging Panarukan, the port of the Hindu kingdom of Blambangan. Demak broke up in a succession war, and its lands passed to Pajang in 1568 and later to Mataram."
: "Les guerres de Demak, le premier sultanat musulman de Java, qui devint dans la première moitié du XVIe siècle la principale puissance de l’île. Demak, un port de la côte nord de Java central qui s’était détaché de Majapahit, prit la tête des ports javanais contre les Portugais après leur prise de Malacca : en janvier 1513, Pati Unus, souverain de Japara, attaqua Malacca avec une centaine de navires et fut vaincu, et la tradition javanaise rapporte une seconde attaque en 1521, au cours de laquelle il fut tué. Sous le sultan Trenggana, Demak vint ensuite à bout des dernières puissances hindou-bouddhistes. Il vainquit Daha, successeur de Majapahit dans la vallée du Brantas, victoire que les sources datent diversement de 1518 à 1527 environ, et lorsque le royaume hindou de Sunda s’allia aux Portugais en 1522, Trenggana envoya Fatahillah avec des troupes de Demak et de Cirebon prendre Banten et Sunda Kelapa, qu’il rebaptisa Jayakarta, en 1527. Suivirent des campagnes contre les ports et les principautés de l’intérieur de Java oriental : Tuban, Madiun, Surabaya (1530), Pasuruan et Malang. En 1546, Trenggana fut tué alors qu’il assiégeait Panarukan, le port du royaume hindou de Blambangan. Demak se désagrégea dans une guerre de succession, et ses terres passèrent à Pajang en 1568, puis à Mataram."
