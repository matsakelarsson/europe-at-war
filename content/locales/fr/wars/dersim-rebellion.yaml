"Dersim rebellion and massacre": "Rébellion et massacre de Dersim"
"The Turkish state’s military campaign of 1937–1938 in Dersim, a mountainous region of Alevi Kurds and Zazas renamed Tunceli in 1935, which followed a local rising under Seyid Riza, hanged in Elazığ in November 1937; with air bombardment, village burnings and reportedly poison gas, thousands of people were killed, many of them civilians, and thousands more deported. Estimates of the dead range from about 13,000, the figure in a 1938 Turkish government document, to tens of thousands, and whether the events should be called a rebellion, a massacre or a genocide remains disputed.": "La campagne militaire de l’État turc de 1937-1938 à Dersim, une région montagneuse des Kurdes d’Alevi et Zazas rebaptisée Tunceli en 1935, qui a suivi une montée locale sous Seyid Riza, pendue à Elazığ en novembre 1937 ; avec bombardement aérien, incendies de village et gaz empoisonné, des milliers de personnes ont été tuées, dont beaucoup de civils, et des milliers d’autres déportés. Les estimations des morts vont d’environ 13.000, le chiffre dans un document du gouvernement turc de 1938, à des dizaines de milliers, et si les événements doivent être appelés une rébellion, un massacre ou un génocide reste contesté."
"In 2011 Prime Minister Recep Tayyip Erdoğan apologised for what he called a massacre, “one of the most tragic events of our near history”.": "En 2011, le Premier ministre Recep Tayyip Erdoğan s’est excusé pour ce qu’il a appelé un massacre, l’un des événements les plus tragiques de notre proche histoire."
