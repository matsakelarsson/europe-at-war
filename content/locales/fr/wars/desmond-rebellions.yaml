# Some French text was translated automatically.
"Desmond Rebellions": "Rébellions des amandes"
? "Two risings in Munster by the FitzGeralds of Desmond and their allies against the spread of English government and Protestantism into the south of Ireland. In the first (1569–1573), James FitzMaurice FitzGerald rose while the Earl of Desmond was held in London, and was crushed by campaigns of deliberate terror under Sir Humphrey Gilbert. In the second (1579–1583), FitzMaurice landed with a small papal force and was soon killed; Gerald FitzGerald, Earl of Desmond, joined the revolt, which spread to Leinster, where Irish forces routed Lord Grey’s army at Glenmalure in 1580. That November several hundred papal soldiers, mostly Italian and Spanish, surrendered at Smerwick and were put to death on Grey’s orders. The English answered the revolt with scorched earth, and war-related famine and disease are thought to have killed up to a third of Munster’s people. The earl was hunted down and killed in November 1583, and his lands were confiscated for the Plantation of Munster."
: "Deux montées à Munster par les FitzGeralds de Desmond et leurs alliés contre la propagation du gouvernement anglais et le protestantisme dans le sud de l’Irlande. Dans la première (1569–1573), James FitzMaurice FitzGerald se lève alors que le comte de Desmond est tenu à Londres, et a été écrasé par des campagnes de terreur délibérée sous sir Humphrey Gilbert. Dans la seconde (1579–1583), FitzMaurice débarque avec une petite force papale et est bientôt tué ; Gerald FitzGerald, comte de Desmond, rejoint la révolte qui s’étend à Leinster, où les forces irlandaises acheminent l’armée de Lord Grey à Glenmalure en 1580. Les Anglais ont répondu à la révolte par une terre brûlée, et on pense que la famine et la maladie liées à la guerre ont tué jusqu’à un tiers des Munsters. Le comte a été chassé et tué en novembre 1583, et ses terres ont été confisquées pour la plantation de Munster."
"Dates are Julian (Old Style). Gerald FitzGerald is numbered the 14th or the 15th Earl of Desmond, depending on the source.": "Les dates sont Julian (Ancien Style). Gerald FitzGerald est numéroté le 14e ou le 15e comte de Desmond, selon la source."
