# French translations of the catalogue text (wave 7); step bodies follow later.
Dhofar Rebellion: Rébellion du Dhofar
An insurgency in Dhofar, the mountainous southern province of the Sultanate of Muscat and Oman. It began among the Jebali tribes as a revolt against the neglect and harsh rule of Sultan Said bin Taimur, led from 1965 by the Dhofar Liberation Front, and from 1968, under the name Popular Front for the Liberation of the Occupied Arabian Gulf (PFLOAG), it became a Marxist movement supplied by South Yemen, China and the Soviet Union. By 1970 the rebels held almost all of Dhofar outside the town of Salalah. That year Said was overthrown by his son Qaboos, who combined reforms and an amnesty with a counter-insurgency campaign led by British officers and the SAS, and later with troops from Iran and Jordan. The rebels were pushed back towards the South Yemeni border, and Qaboos declared the war won in December 1975. Estimates of the dead range from a few thousand to about 10,000.: Une insurrection au Dhofar, la province montagneuse du sud du sultanat de Mascate et Oman. Elle commença parmi les tribus jebali comme une révolte contre l’abandon où les laissait le sultan Saïd ben Taïmour et contre la dureté de son régime ; dirigée à partir de 1965 par le Front de libération du Dhofar, elle devint à partir de 1968, sous le nom de Front populaire de libération du Golfe arabe occupé (PFLOAG), un mouvement marxiste ravitaillé par le Yémen du Sud, la Chine et l’Union soviétique. En 1970, les rebelles tenaient presque tout le Dhofar, à l’exception de la ville de Salalah. Cette année-là, Saïd fut renversé par son fils Qabous, qui associa réformes et amnistie à une campagne de contre-insurrection menée par des officiers britanniques et le SAS, puis renforcée par des troupes venues d’Iran et de Jordanie. Les rebelles furent repoussés vers la frontière sud-yéménite, et Qabous déclara la guerre gagnée en décembre 1975. Les estimations du nombre de morts vont de quelques milliers à environ 10 000.
