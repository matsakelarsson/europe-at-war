# French translations of the catalogue text (wave 12); step bodies follow later.
Djiboutian Civil War: Guerre civile djiboutienne
? An armed rising of the Front for the Restoration of Unity and Democracy (FRUD), drawn mainly from the Afar of northern and western Djibouti, against the government of President Hassan Gouled Aptidon, which was dominated by the Issa Somali and his single party, the People’s Rally for Progress. Formed in 1991 from Afar opposition groups, FRUD began its guerrilla campaign in the autumn of 1991, attacked the garrison of Obock in November, took most of the army posts in the north and besieged Tadjourah and Obock. In December 1991 troops fired on a crowd in the Arhiba district of the capital, killing at least 59 people. France, which kept a large garrison in Djibouti, deployed troops in the north from February 1992 as a buffer and pressed for talks, and Djibouti adopted a multi-party constitution in September 1992, although FRUD boycotted the elections. On 5 July 1993 the much-enlarged army launched a counteroffensive that took FRUD’s main base at Assa-Gueyla and the towns of the north and west; some 70,000 civilians were driven from their homes and about 30,000 fled the country. A faction of FRUD under Ali Mohamed Daoud signed a peace agreement at Aba’a on 26 December 1994, joining the government and integrating its fighters into the army; the faction of Ahmed Dini Ahmed fought on at a low level until a final agreement on 12 May 2001. Estimates of the dead are uncertain; FRUD’s losses are given as about 1,000.
: Un soulèvement armé du Front pour la restauration de l’unité et de la démocratie (FRUD), recruté principalement parmi les Afars du nord et de l’ouest de Djibouti, contre le gouvernement du président Hassan Gouled Aptidon, dominé par les Somalis issas et par son parti unique, le Rassemblement populaire pour le progrès. Formé en 1991 à partir de groupes d’opposition afars, le FRUD lança sa guérilla à l’automne 1991, attaqua la garnison d’Obock en novembre, s’empara de la plupart des postes de l’armée dans le nord et assiégea Tadjourah et Obock. En décembre 1991, des soldats tirèrent sur une foule dans le quartier d’Arhiba, dans la capitale, tuant au moins 59 personnes. La France, qui maintenait une importante garnison à Djibouti, déploya des troupes dans le nord à partir de février 1992 comme force d’interposition et pressa les parties de négocier ; Djibouti adopta en septembre 1992 une constitution instaurant le multipartisme, mais le FRUD boycotta les élections. Le 5 juillet 1993, l’armée, considérablement renforcée, lança une contre-offensive qui lui permit de prendre la principale base du FRUD, à Assa-Gueyla, ainsi que les villes du nord et de l’ouest ; quelque 70 000 civils furent chassés de chez eux et environ 30 000 s’enfuirent à l’étranger. Une faction du FRUD dirigée par Ali Mohamed Daoud signa un accord de paix à Aba’a le 26 décembre 1994, entra au gouvernement et intégra ses combattants dans l’armée ; la faction d’Ahmed Dini Ahmed poursuivit une lutte de faible intensité jusqu’à un accord définitif, le 12 mai 2001. Les estimations du nombre de morts sont incertaines ; les pertes du FRUD sont évaluées à environ 1 000.
