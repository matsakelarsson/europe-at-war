# French translations of the catalogue text (wave 12); step bodies follow later.
Djiboutian–Eritrean border conflict: Conflit frontalier djibouto-érythréen
? A short border war between Djibouti and Eritrea at Ras Doumeira, a headland on the Bab-el-Mandeb strait where their border meets the Red Sea, and the small Doumeira Island offshore. The 1900 Franco-Italian protocol put the border on the headland but left its exact line and the island unclear, and the two countries had already clashed there in 1996. From early 2008 Eritrean troops dug in around Ras Doumeira, and Djibouti moved troops to face them. On 10 June 2008, after several Eritrean soldiers deserted to the Djiboutian lines, fighting broke out and lasted until 13 June. Djibouti reported 44 of its soldiers killed and 55 wounded and estimated Eritrean losses at about 100 dead; Eritrea gave no figures and denied having attacked. France, which has a base in Djibouti, gave logistical, medical and intelligence support. The UN Security Council called on Eritrea to withdraw (Resolution 1862, January 2009) and in December 2009 imposed sanctions on it, also for its support of armed groups in Somalia. In June 2010 both sides accepted Qatari mediation and Qatar sent observers to the border; when they left in June 2017, Djibouti accused Eritrea of reoccupying the disputed hill and island. Eritrea released Djiboutian prisoners in 2016, and in September 2018, amid the wider Eritrean–Ethiopian peace, the two governments agreed to normalise relations, but the border has not been demarcated.
: Une brève guerre frontalière entre Djibouti et l’Érythrée à Ras Doumeira, promontoire du détroit de Bab-el-Mandeb où leur frontière atteint la mer Rouge, et sur la petite île de Doumeira, au large. Le protocole franco-italien de 1900 avait fait passer la frontière par le promontoire, mais sans en préciser le tracé exact ni le sort de l’île, et les deux pays s’y étaient déjà affrontés en 1996. À partir du début de 2008, des troupes érythréennes se retranchèrent autour de Ras Doumeira, et Djibouti déploya des troupes face à elles. Le 10 juin 2008, après la désertion de plusieurs soldats érythréens vers les lignes djiboutiennes, des combats éclatèrent, qui durèrent jusqu’au 13 juin. Djibouti fit état de 44 tués et 55 blessés dans les rangs de ses soldats et estima les pertes érythréennes à environ 100 morts ; l’Érythrée ne donna aucun chiffre et nia avoir attaqué. La France, qui dispose d’une base à Djibouti, apporta un soutien logistique, médical et en matière de renseignement. Le Conseil de sécurité de l’ONU demanda à l’Érythrée de se retirer (résolution 1862, janvier 2009) et lui imposa des sanctions en décembre 2009, également en raison de son soutien à des groupes armés en Somalie. En juin 2010, les deux parties acceptèrent une médiation qatarie et le Qatar envoya des observateurs à la frontière ; lorsque ceux-ci partirent, en juin 2017, Djibouti accusa l’Érythrée d’avoir réoccupé la colline et l’île contestées. L’Érythrée libéra des prisonniers djiboutiens en 2016 et, en septembre 2018, dans le contexte plus large de la paix entre l’Érythrée et l’Éthiopie, les deux gouvernements convinrent de normaliser leurs relations, mais la frontière n’a pas été démarquée.
