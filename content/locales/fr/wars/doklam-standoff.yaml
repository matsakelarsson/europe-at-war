# French translations of the catalogue text (wave 8); step bodies follow later.
Doklam standoff: Crise du Doklam
A 73-day military standoff between India and China on the Doklam plateau, a high pasture claimed by both Bhutan and China near the point where Bhutan, China and the Indian state of Sikkim meet. On 16 June 2017 Chinese troops with road-building equipment began extending a track across the plateau towards the Jampheri ridge, which overlooks the narrow Siliguri corridor linking north-eastern India with the rest of the country. Bhutan protested, and on 18 June some 270 Indian soldiers crossed from their posts at Doka La in Sikkim, with two bulldozers, and stopped the work. Hundreds of troops faced each other a few metres apart for more than two months while China demanded an unconditional Indian withdrawal and its state media warned of war; no shots were fired. On 28 August both sides announced that they had disengaged and the road building stopped. China kept a strong military presence in the northern part of the plateau, where it later built roads, posts and villages.: Une confrontation militaire de 73 jours entre l’Inde et la Chine sur le plateau du Doklam, un haut pâturage revendiqué à la fois par le Bhoutan et par la Chine, près du point où se rejoignent le Bhoutan, la Chine et l’État indien du Sikkim. Le 16 juin 2017, des troupes chinoises munies d’engins de construction routière commencèrent à prolonger une piste à travers le plateau en direction de la crête de Jampheri, qui domine l’étroit corridor de Siliguri reliant le nord-est de l’Inde au reste du pays. Le Bhoutan protesta, et le 18 juin quelque 270 soldats indiens passèrent de leurs postes de Doka La, au Sikkim, sur le plateau avec deux bulldozers et arrêtèrent les travaux. Des centaines de soldats se firent face à quelques mètres de distance pendant plus de deux mois, tandis que la Chine exigeait un retrait indien inconditionnel et que ses médias d’État brandissaient la menace d’une guerre ; aucun coup de feu ne fut tiré. Le 28 août, les deux camps annoncèrent leur désengagement, et la construction de la route s’arrêta. La Chine maintint une forte présence militaire dans la partie nord du plateau, où elle construisit plus tard des routes, des postes et des villages.
India: Inde
Bhutan: Bhoutan
China: Chine
