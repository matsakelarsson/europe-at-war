# French translations of the catalogue text (wave 14); step bodies follow later.
Dominican Civil War: Guerre civile dominicaine
? The civil war of 1965 in Santo Domingo, also called the April Revolution, between the Constitutionalists, officers and armed civilians who wanted to restore the elected president Juan Bosch and the constitution of 1963, and the Loyalists of the military establishment, and the American intervention that ended it. Bosch, the first freely elected president after the assassination of the dictator Rafael Trujillo in 1961, had been overthrown by the army in September 1963. On 24 April 1965 a group of officers rose against the civilian triumvirate that followed, crowds poured into the streets and the Constitutionalists, led militarily by Colonel Francisco Caamaño, armed civilians and drove back an attack by Loyalist tanks and aircraft under General Elías Wessin y Wessin at the Duarte Bridge on 27 April. On 28 April President Lyndon Johnson sent in the Marines, to protect American lives and, as he said, to stop a communist takeover; some 22,000 American troops landed, with more offshore, cut the rebel zone in the old city off from the rest of Santo Domingo and opened a corridor across the capital. The Organization of American States joined the occupation with an Inter-American Peace Force of troops from Brazil, Honduras, Paraguay, Nicaragua, Costa Rica and El Salvador. Loyalist forces under the Government of National Reconstruction of General Antonio Imbert Barrera cleared the northern districts in May, and fighting flared again in June, but OAS mediation led to an Act of Reconciliation, and on 3 September 1965 Héctor García-Godoy became provisional president. Joaquín Balaguer defeated Bosch in the elections of 1 June 1966, and the last foreign troops left in September 1966. Estimates of Dominican casualties, killed and wounded, run to about 6,000; the United States lost 27 killed in action and 44–47 dead in all.
: La guerre civile de 1965 à Saint-Domingue, aussi appelée révolution d’Avril, qui opposa les constitutionnalistes, officiers et civils armés qui voulaient rétablir le président élu Juan Bosch et la constitution de 1963, aux loyalistes de l’establishment militaire, ainsi que l’intervention américaine qui y mit fin. Bosch, premier président librement élu après l’assassinat du dictateur Rafael Trujillo en 1961, avait été renversé par l’armée en septembre 1963. Le 24 avril 1965, un groupe d’officiers se souleva contre le triumvirat civil qui lui avait succédé, la foule descendit dans les rues et les constitutionnalistes, dirigés militairement par le colonel Francisco Caamaño, armèrent des civils et repoussèrent le 27 avril, au pont Duarte, une attaque de chars et d’avions loyalistes commandée par le général Elías Wessin y Wessin. Le 28 avril, le président Lyndon Johnson envoya les Marines, pour protéger des vies américaines et, selon ses propres termes, pour empêcher une prise de pouvoir communiste ; quelque 22 000 soldats américains débarquèrent, d’autres restant au large, coupèrent la zone rebelle de la vieille ville du reste de Saint-Domingue et ouvrirent un corridor à travers la capitale. L’Organisation des États américains se joignit à l’occupation avec une Force interaméricaine de paix composée de troupes du Brésil, du Honduras, du Paraguay, du Nicaragua, du Costa Rica et du Salvador. Les forces loyalistes du gouvernement de reconstruction nationale du général Antonio Imbert Barrera prirent le contrôle des quartiers nord en mai, et les combats reprirent en juin, mais la médiation de l’OEA aboutit à un Acte de réconciliation et, le 3 septembre 1965, Héctor García-Godoy devint président provisoire. Joaquín Balaguer battit Bosch aux élections du 1er juin 1966, et les dernières troupes étrangères partirent en septembre 1966. Les estimations des pertes dominicaines, tués et blessés, atteignent environ 6 000 ; les États-Unis perdirent 27 hommes tués au combat et 44 à 47 morts au total.
Constitutionalists (Francisco Caamaño, for the return of Juan Bosch): Constitutionnalistes (Francisco Caamaño, pour le retour de Juan Bosch)
