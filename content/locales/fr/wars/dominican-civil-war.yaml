United States and the Inter-American Peace Force of the OAS (Brazil, Honduras, Paraguay, Nicaragua, Costa Rica and El Salvador): États-Unis et Force interaméricaine de paix de l’OEA (Brésil, Honduras, Paraguay, Nicaragua, Costa Rica et Salvador)
