# French translations of the catalogue text (wave 14); step bodies follow later.
Dominican Restoration War: Guerre de Restauration dominicaine
? The war in which Dominicans ended Spain’s rule over their country, which President Pedro Santana had handed back to Spain in 1861. Spanish officials, taxes, requisitions and a tobacco monopoly, church demands and rumours that slavery would return turned much of the population against the annexation. On 16 August 1863 Santiago Rodríguez and a band of exiles from Haiti raised the Dominican flag on the hill of Capotillo, near Dajabón; the Cibao rose, the Spanish garrison was driven out of Santiago, and on 14 September a provisional government there proclaimed the republic restored. Spain sent tens of thousands of soldiers from Cuba, Puerto Rico and Spain, who held the capital and the ports and retook the south-west, but they could not reconquer the Cibao, guerrillas cut their roads, and yellow fever and other diseases killed far more of them than the fighting did. With the war unpopular in Spain and the Union winning the American Civil War, Queen Isabella II annulled the annexation on 3 March 1865, and the last Spanish troops left in July. Spain had lost more than 10,000 men, most of them to disease.
: La guerre par laquelle les Dominicains mirent fin à la domination de l’Espagne sur leur pays, que le président Pedro Santana lui avait rendu en 1861. Les fonctionnaires espagnols, les impôts, les réquisitions et un monopole du tabac, les exigences de l’Église et les rumeurs d’un retour de l’esclavage retournèrent une grande partie de la population contre l’annexion. Le 16 août 1863, Santiago Rodríguez et une bande d’exilés venus d’Haïti hissèrent le drapeau dominicain sur la colline de Capotillo, près de Dajabón ; le Cibao se souleva, la garnison espagnole fut chassée de Santiago et, le 14 septembre, un gouvernement provisoire y proclama la restauration de la république. L’Espagne envoya des dizaines de milliers de soldats de Cuba, de Porto Rico et d’Espagne, qui tinrent la capitale et les ports et reprirent le sud-ouest, mais ils ne purent reconquérir le Cibao, des guérilleros coupaient leurs routes, et la fièvre jaune et d’autres maladies en tuèrent bien plus que les combats. La guerre étant impopulaire en Espagne et l’Union l’emportant dans la guerre de Sécession, la reine Isabelle II annula l’annexion le 3 mars 1865, et les dernières troupes espagnoles partirent en juillet. L’Espagne avait perdu plus de 10 000 hommes, pour la plupart de maladie.
