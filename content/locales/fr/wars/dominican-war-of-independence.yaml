# French translations of the catalogue text (wave 14); step bodies follow later.
Dominican War of Independence: Guerre d’indépendance dominicaine
? The wars in which the Dominican Republic broke away from Haiti, which had ruled the whole of Hispaniola since 1822, and beat off Haitian attempts to reunite the island. Juan Pablo Duarte’s secret society La Trinitaria, founded in 1838, and conservatives who hoped for French protection joined forces after the revolution of 1843 in Haiti, and on 27 February 1844 Francisco del Rosario Sánchez and Matías Ramón Mella proclaimed independence at the Puerta del Conde in Santo Domingo. President Charles Rivière-Hérard invaded in March 1844, but his armies were repulsed at Azua (19 March) and Santiago (30 March), a Dominican squadron won off Tortuguero (15 April), and a rising in Haiti that overthrew Hérard ended the campaign. Pedro Santana, the cattle rancher who led the Army of the South, seized power and exiled Duarte. Further Haitian invasions were beaten at La Estrelleta and Beler (1845), at El Número and Las Carreras (April 1849) under Faustin Soulouque, and, after Soulouque had made himself emperor, at Santomé, Cambronal (22 December 1855) and Sabana Larga (24 January 1856), after which Haiti made no further attempt to retake the east. In 1861 Santana handed the country back to Spain, which led to the Dominican Restoration War.
: Les guerres par lesquelles la République dominicaine se sépara d’Haïti, qui gouvernait l’ensemble d’Hispaniola depuis 1822, et repoussa les tentatives haïtiennes de réunifier l’île. La société secrète La Trinitaria de Juan Pablo Duarte, fondée en 1838, et des conservateurs qui espéraient une protection française unirent leurs forces après la révolution de 1843 en Haïti, et le 27 février 1844 Francisco del Rosario Sánchez et Matías Ramón Mella proclamèrent l’indépendance à la Puerta del Conde, à Santo Domingo. Le président Charles Rivière-Hérard envahit le pays en mars 1844, mais ses armées furent repoussées à Azua (19 mars) et à Santiago (30 mars), une escadre dominicaine l’emporta au large de Tortuguero (15 avril), et un soulèvement en Haïti qui renversa Hérard mit fin à la campagne. Pedro Santana, le grand éleveur qui commandait l’armée du Sud, s’empara du pouvoir et exila Duarte. De nouvelles invasions haïtiennes furent repoussées à La Estrelleta et à Beler (1845), à El Número et à Las Carreras (avril 1849) sous Faustin Soulouque, puis, après que Soulouque se fut fait empereur, à Santomé, à Cambronal (22 décembre 1855) et à Sabana Larga (24 janvier 1856), après quoi Haïti ne tenta plus de reprendre l’est. En 1861, Santana rendit le pays à l’Espagne, ce qui provoqua la guerre de Restauration dominicaine.
