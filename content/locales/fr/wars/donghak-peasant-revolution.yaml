# French translations of the catalogue text (wave 10); step bodies follow later.
Donghak Peasant Revolution: Révolution paysanne du Donghak
? A peasant rising in south-western Korea led by members of Donghak (“Eastern Learning”), a religion founded in 1860. It began on 15 February 1894 at Gobu, where Jeon Bong-jun led farmers against a corrupt magistrate, and grew in the spring into a rebellion across Jeolla. The peasant army beat government troops at Hwangtohyeon on 11 May and on the Hwangryong River on 27 May, and entered Jeonju, the provincial capital, on 31 May. The government asked the Qing for troops; Japan sent its own, and the rebels made a truce at Jeonju in June and set up local offices of their own across Jeolla. After Japanese troops seized the royal palace in July and the First Sino-Japanese War began, the Donghak rose again in October, this time against the Japanese. At Ugeumchi, outside Gongju, Japanese and government troops with modern rifles destroyed the peasant army in early December. Jeon was captured at the end of the year and hanged with other leaders on 24 April 1895. Estimates of the peasants killed range from tens of thousands to several hundred thousand.
: Un soulèvement paysan dans le sud-ouest de la Corée, mené par des adeptes du Donghak (« Savoir oriental »), une religion fondée en 1860. Il commença le 15 février 1894 à Gobu, où Jeon Bong-jun conduisit les paysans contre un magistrat corrompu, et se transforma au printemps en une rébellion qui gagna tout le Jeolla. L’armée paysanne battit les troupes gouvernementales à Hwangtohyeon le 11 mai et sur la rivière Hwangryong le 27 mai, et entra le 31 mai à Jeonju, la capitale provinciale. Le gouvernement demanda des troupes aux Qing ; le Japon envoya les siennes, et les rebelles conclurent une trêve à Jeonju en juin et établirent leurs propres bureaux locaux dans tout le Jeolla. Après que les troupes japonaises se furent emparées du palais royal en juillet et que la première guerre sino-japonaise eut éclaté, les partisans du Donghak se soulevèrent de nouveau en octobre, cette fois contre les Japonais. À Ugeumchi, près de Gongju, les troupes japonaises et gouvernementales, armées de fusils modernes, anéantirent l’armée paysanne au début de décembre. Jeon fut capturé à la fin de l’année et pendu avec d’autres chefs le 24 avril 1895. Les estimations du nombre de paysans tués vont de plusieurs dizaines de milliers à plusieurs centaines de milliers.
