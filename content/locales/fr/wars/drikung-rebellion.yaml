# French translations of the catalogue text (wave 9); step bodies follow later.
Drikung rebellion: Rébellion de Drikung
The revolt of the Drikung Kagyu school against the Sakya regime that governed Tibet for Kublai Khan. The monastery of Drikung Thil, north-east of Lhasa, founded in 1179, headed one of the myriarchies (tribute districts) of central Tibet and had been the strongest rival of Sakya before the Mongols made the Sakya lamas their regents. In 1285 Drikung forces attacked and destroyed the monastery of Jayül, killing its abbot, and the Drikung looked for help to the Mongol princes of Central Asia who were at war with Kublai; some sources name the Chagatai khan Du’a, an ally of Kaidu. In 1290 the Sakya ponchen (chief administrator) Aglen, with Mongol troops led by Kublai’s grandson Temür Buqa, defeated the Drikung and burned Drikung Thil; one account gives 10,000 dead. The monastery was rebuilt in the following decades with the help of the emperor and of Sakya, but Drikung lost its political influence for a long time, and Sakya rule lasted until the Phagmodrupa rose in the 1350s.: La révolte de l’école Drikung Kagyu contre le régime des Sakya, qui gouvernait le Tibet pour le compte de Kubilai Khan. Le monastère de Drikung Thil, au nord-est de Lhassa, fondé en 1179, était à la tête de l’une des myriarchies (districts tributaires) du Tibet central et avait été le plus puissant rival de Sakya avant que les Mongols ne fassent des lamas Sakya leurs régents. En 1285, les forces de Drikung attaquèrent et détruisirent le monastère de Jayül, tuant son abbé, et les Drikung cherchèrent l’aide des princes mongols d’Asie centrale en guerre contre Kubilai ; certaines sources nomment le khan de Djaghataï Du’a, allié de Qaïdu. En 1290, le ponchen (administrateur en chef) des Sakya, Aglen, avec des troupes mongoles conduites par Temür Buqa, petit-fils de Kubilai, battit les Drikung et incendia Drikung Thil ; un récit fait état de 10 000 morts. Le monastère fut reconstruit au cours des décennies suivantes avec l’aide de l’empereur et de Sakya, mais Drikung perdit pour longtemps son influence politique, et la domination des Sakya dura jusqu’à l’essor des Phagmodrupa dans les années 1350.
