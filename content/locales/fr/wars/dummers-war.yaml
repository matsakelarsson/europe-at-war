# French translations of the catalogue text (wave 14); step bodies follow later.
Dummer’s War: Guerre de Dummer
? A war between the Wabanaki Confederacy and New England and Nova Scotia over the lands between the Kennebec River and Acadia. The Wabanaki had never accepted the British sovereignty written into the Treaty of Portsmouth of 1713, and as New England settlers and forts spread east of the Kennebec they resisted, encouraged and armed by New France and by the Jesuit missionary Sébastien Rale at Norridgewock. After New Englanders raided Norridgewock in January 1722 to seize Rale, the Wabanaki burned the settlement of Brunswick, and Governor Samuel Shute of Massachusetts declared war on 25 July 1722; Lieutenant Governor William Dummer, after whom the war is named, directed it once Shute left for England. In Nova Scotia the Mi’kmaq and Wolastoqiyik (Maliseet) blockaded Annapolis Royal, seized New England fishing boats and fought at Winnepang (Jeddore Harbour) in 1722, and attacked Annapolis Royal again in 1724, while in the west the Abenaki leader Gray Lock raided the towns of the Connecticut valley. On 12 August 1724 (23 August New Style) some 200 rangers under Jeremiah Moulton and Johnson Harmon surprised Norridgewock, killing Rale, the sachem Mog and, by most accounts, about 80 Abenaki, many of them women and children, and burning the village. On 9 May 1725 John Lovewell’s company of volunteer scalp hunters fought the Pequawket Abenaki under Paugus at Pequawket (Fryeburg, Maine); both leaders were killed, only about 20 of Lovewell’s men survived, and the Pequawket afterwards left their town for Canada. Penobscot leaders led by Loron (Sauguaaram) negotiated a peace, signed at Boston on 15 December 1725 and confirmed with the Mi’kmaq at Annapolis Royal in 1726 and at Falmouth in 1727. The English text declared the Wabanaki subjects of the Crown; Loron said publicly that they had agreed to peace, not to submission.
: Une guerre entre la Confédération wabanaki, d’une part, et la Nouvelle-Angleterre et la Nouvelle-Écosse, d’autre part, pour les terres situées entre la Kennebec et l’Acadie. Les Wabanakis n’avaient jamais accepté la souveraineté britannique inscrite dans le traité de Portsmouth de 1713 et, à mesure que les colons et les forts de la Nouvelle-Angleterre s’étendaient à l’est de la Kennebec, ils résistèrent, encouragés et armés par la Nouvelle-France et par le missionnaire jésuite Sébastien Rale, établi à Norridgewock. Après qu’une troupe de la Nouvelle-Angleterre eut attaqué Norridgewock en janvier 1722 pour s’emparer de Rale, les Wabanakis incendièrent l’établissement de Brunswick, et le gouverneur du Massachusetts, Samuel Shute, déclara la guerre le 25 juillet 1722 ; le lieutenant-gouverneur William Dummer, qui a donné son nom à la guerre, la dirigea après le départ de Shute pour l’Angleterre. En Nouvelle-Écosse, les Micmacs et les Wolastoqiyik (Malécites) bloquèrent Annapolis Royal, saisirent des bateaux de pêche de la Nouvelle-Angleterre et combattirent à Winnepang (Jeddore Harbour) en 1722, puis attaquèrent de nouveau Annapolis Royal en 1724, tandis qu’à l’ouest le chef abénaquis Gray Lock lançait des raids contre les villes de la vallée du Connecticut. Le 12 août 1724 (23 août nouveau style), quelque 200 rangers commandés par Jeremiah Moulton et Johnson Harmon surprirent Norridgewock, tuèrent Rale, le sachem Mog et, selon la plupart des récits, environ 80 Abénaquis, dont beaucoup de femmes et d’enfants, et incendièrent le village. Le 9 mai 1725, la compagnie de chasseurs de scalps volontaires de John Lovewell affronta les Abénaquis pequawkets de Paugus à Pequawket (Fryeburg, dans le Maine) ; les deux chefs furent tués, une vingtaine seulement des hommes de Lovewell survécurent, et les Pequawkets quittèrent ensuite leur village pour le Canada. Des chefs penobscots menés par Loron (Sauguaaram) négocièrent une paix, signée à Boston le 15 décembre 1725 et confirmée avec les Micmacs à Annapolis Royal en 1726 et à Falmouth en 1727. Le texte anglais déclarait les Wabanakis sujets de la Couronne ; Loron affirma publiquement qu’ils avaient consenti à la paix, et non à la soumission.
Wabanaki Confederacy (Abenaki, Penobscot, Wolastoqiyik and Mi’kmaq), with Gray Lock’s western Abenaki: Confédération wabanaki (Abénaquis, Penobscots, Wolastoqiyik et Micmacs), avec les Abénaquis de l’Ouest de Gray Lock
Massachusetts (with Maine and New Hampshire) and Nova Scotia: Massachusetts (avec le Maine et le New Hampshire) et Nouvelle-Écosse
