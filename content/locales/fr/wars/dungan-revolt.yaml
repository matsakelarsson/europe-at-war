# French translations of the catalogue text (wave 9); step bodies follow later.
Dungan Revolt: Révolte des Dounganes
? A series of risings of the Hui (Chinese-speaking Muslims, called Dungans in Central Asia) and other Muslims against the Qing in north-western China, also called the Tongzhi Hui Revolt. Fighting between Hui and Han militias in Shaanxi in 1862, as Taiping and Nian armies approached, turned into a war of massacres on both sides; the Hui besieged Xi’an and then fell back into Gansu, where leaders such as Ma Hualong of the Jahriyya Sufi order held much of the province. In 1864 the Muslims of Xinjiang rose too, and Qing rule there collapsed. Yakub Beg, an officer from Kokand, built a state in the Tarim Basin and took Ürümqi from the Dungans in 1870, while Russia occupied the Ili valley. From 1867 Zuo Zongtang reconquered Shaanxi and Gansu, taking Jinjibao in 1871, Hezhou and Xining in 1872 and Suzhou in 1873, with mass executions and deportations, and in 1876–1877 he retook Xinjiang. The north-west lost a large part of its population; estimates of the dead range from about 8 to 12 million, and one demographic study puts the total loss, by violence, famine, plague and flight, at about 21 million.
: Une série de soulèvements des Hui (musulmans de langue chinoise, appelés Dounganes en Asie centrale) et d’autres musulmans contre les Qing dans le nord-ouest de la Chine, appelée aussi révolte des Hui de l’ère Tongzhi. Des affrontements entre milices hui et han au Shaanxi en 1862, à l’approche des armées taiping et nian, tournèrent à une guerre de massacres de part et d’autre ; les Hui assiégèrent Xi’an puis se replièrent au Gansu, où des chefs comme Ma Hualong, de l’ordre soufi de la Jahriyya, tenaient une grande partie de la province. En 1864, les musulmans du Xinjiang se soulevèrent à leur tour, et la domination Qing s’y effondra. Yakub Beg, un officier venu de Kokand, bâtit un État dans le bassin du Tarim et prit Ürümqi aux Dounganes en 1870, tandis que la Russie occupait la vallée de l’Ili. À partir de 1867, Zuo Zongtang reconquit le Shaanxi et le Gansu, prenant Jinjibao en 1871, Hezhou et Xining en 1872 et Suzhou en 1873, avec des exécutions et des déportations de masse, et en 1876–1877 il reprit le Xinjiang. Le Nord-Ouest perdit une grande partie de sa population ; les estimations du nombre de morts vont d’environ 8 à 12 millions, et une étude démographique évalue la perte totale, due aux violences, à la famine, à la peste et à la fuite, à environ 21 millions.
