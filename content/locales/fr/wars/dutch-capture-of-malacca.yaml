# French translations of the catalogue text (wave 11); step bodies follow later.
Dutch capture of Malacca: Prise de Malacca par les Néerlandais
? The siege and capture of Portuguese Malacca, the fortified port on the Strait of Malacca that Portugal had held since 1511, by the Dutch East India Company (VOC) and its ally Johor, the sultanate founded by the heirs of the Malay kings whom the Portuguese had driven out. After failed attempts in 1606, 1608 and the 1620s, and years of blockade that cut the town’s trade, the Company landed about 600 soldiers and sailors with Javanese, Bandanese and Mardijker auxiliaries on 3 August 1640, and Johor sent 500–600 men. The Portuguese garrison of 260 soldiers, with 2,000–3,000 local and mixed-descent defenders, held the walls of the fortress of A Famosa for five months, while famine and disease killed thousands in the town and in the besiegers’ camps; three Dutch commanders in turn died of illness. On 14 January 1641 about 650 Dutch troops under Johannes Lamotius stormed the walls and the governor, Manuel de Sousa Coutinho, surrendered. The Portuguese reported about 7,000 dead, and the Dutch lost about 1,000 men. Dutch Malacca remained a secondary post beside Batavia until it passed to Britain in 1825.
: Le siège et la prise de la Malacca portugaise, le port fortifié du détroit de Malacca que le Portugal tenait depuis 1511, par la Compagnie néerlandaise des Indes orientales (VOC) et son alliée Johor, le sultanat fondé par les héritiers des rois malais que les Portugais avaient chassés. Après des tentatives manquées en 1606, en 1608 et dans les années 1620, et des années de blocus qui coupèrent le commerce de la ville, la Compagnie débarqua le 3 août 1640 environ 600 soldats et marins avec des auxiliaires javanais, bandanais et mardijkers, et Johor envoya 500 à 600 hommes. La garnison portugaise de 260 soldats, avec 2 000 à 3 000 défenseurs locaux et métis, tint les murailles de la forteresse d’A Famosa pendant cinq mois, tandis que la famine et la maladie tuaient des milliers de personnes dans la ville et dans les camps des assiégeants ; trois commandants néerlandais moururent successivement de maladie. Le 14 janvier 1641, environ 650 soldats néerlandais commandés par Johannes Lamotius prirent les murailles d’assaut, et le gouverneur, Manuel de Sousa Coutinho, capitula. Les Portugais firent état d’environ 7 000 morts, et les Néerlandais perdirent environ 1 000 hommes. La Malacca néerlandaise resta un poste secondaire à côté de Batavia jusqu’à son passage à la Grande-Bretagne en 1825.
