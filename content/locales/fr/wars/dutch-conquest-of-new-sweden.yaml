# French translations of the catalogue text (wave 14); step bodies follow later.
Dutch conquest of New Sweden: Conquête néerlandaise de la Nouvelle-Suède
? The seizure of the Swedish colony on the Delaware River by New Netherland in 1655. New Sweden, founded at Fort Christina (Wilmington) in 1638 on land the Dutch claimed, traded for furs with the Lenape and the Susquehannock, and its few hundred Swedish and Finnish colonists farmed both banks of the river. In 1651 Peter Stuyvesant built Fort Casimir (New Castle) a few miles below Fort Christina to cut off its trade; in May 1654 the new Swedish governor, Johan Risingh, took it without a fight and renamed it Fort Trinity. On orders from the West India Company, Stuyvesant sailed from New Amsterdam in 1655 with seven ships and 317 soldiers. Fort Trinity surrendered on 11 September, and Fort Christina, besieged and short of men and powder, on 15 September; no one was killed in the fighting. The same day hundreds of Munsee entered New Amsterdam, leading to the Peach War. New Sweden became part of New Netherland, but its colonists kept their lands, church, courts and militia, and Swedish Lutheran congregations survived on the Delaware for more than a century. It was a conflict between the two trading companies, not between the Dutch Republic and Sweden, which were not at war.
: La prise de la colonie suédoise de la Delaware par la Nouvelle-Néerlande en 1655. Fondée en 1638 au fort Christina (Wilmington), sur des terres que revendiquaient les Néerlandais, la Nouvelle-Suède achetait des fourrures aux Lenapes et aux Susquehannocks, et ses quelques centaines de colons suédois et finlandais cultivaient les deux rives du fleuve. En 1651, Peter Stuyvesant fit construire le fort Casimir (New Castle) à quelques milles en aval du fort Christina pour couper son commerce ; en mai 1654, le nouveau gouverneur suédois, Johan Risingh, s’en empara sans combat et le rebaptisa fort Trinity. Sur ordre de la Compagnie des Indes occidentales, Stuyvesant quitta la Nouvelle-Amsterdam en 1655 avec sept navires et 317 soldats. Le fort Trinity capitula le 11 septembre, et le fort Christina, assiégé et à court d’hommes et de poudre, le 15 septembre ; personne ne fut tué dans les combats. Le même jour, des centaines de Munsees entrèrent dans la Nouvelle-Amsterdam, ce qui déclencha la guerre des pêches. La Nouvelle-Suède fut rattachée à la Nouvelle-Néerlande, mais ses colons conservèrent leurs terres, leur Église, leurs tribunaux et leur milice, et des paroisses luthériennes suédoises subsistèrent sur la Delaware pendant plus d’un siècle. Ce fut un conflit entre les deux compagnies de commerce, et non entre les Provinces-Unies et la Suède, qui n’étaient pas en guerre.
