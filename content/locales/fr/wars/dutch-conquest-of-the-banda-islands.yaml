# French translations of the catalogue text (wave 11); step bodies follow later.
Dutch conquest of the Banda Islands: Conquête néerlandaise des îles Banda
? "The conquest of the Banda Islands, the world’s only source of nutmeg and mace, by the Dutch East India Company (VOC), which ended in the killing, starvation, enslavement and expulsion of most of their people. The Bandanese, governed by councils of village elders (orang kaya), sold their spices to all comers and refused to keep to contracts giving the Company a monopoly. In 1609 they killed the Dutch admiral Pieter Verhoeff and 45 of his men during talks on Banda Neira, where the Dutch then built Fort Nassau. Punitive expeditions followed, and the English East India Company, which offered better prices, encouraged the islanders’ resistance from Ai and Run. In 1616 the Dutch took Ai, and Nathaniel Courthope held Run for the English until he was killed in 1620. In 1621 Governor-General Jan Pieterszoon Coen invaded the main island, Lontor, with about 1,900 Dutch soldiers and Japanese mercenaries. After an accused conspiracy, orang kaya were tortured and beheaded, and through 1621 Company troops hunted the islanders through the hills. Of a population estimated at about 15,000, sources estimate that only about 1,000 remained on the islands: thousands died of violence, hunger and disease, about 1,700 or more were enslaved or deported to Batavia, and others fled to the Kei Islands and Seram. The Company divided the nutmeg groves among Dutch planters (perkeniers) worked by enslaved people. Many historians describe the conquest as a genocide."
: "La conquête des îles Banda, seule source au monde de noix de muscade et de macis, par la Compagnie néerlandaise des Indes orientales (VOC), qui aboutit à la mort violente, à la famine, à l’asservissement et à l’expulsion de la plupart de leurs habitants. Les Bandanais, gouvernés par des conseils d’anciens des villages (orang kaya), vendaient leurs épices à tous les acheteurs et refusaient de respecter les contrats qui accordaient un monopole à la Compagnie. En 1609, ils tuèrent l’amiral néerlandais Pieter Verhoeff et 45 de ses hommes pendant des pourparlers sur Banda Neira, où les Néerlandais construisirent ensuite le fort Nassau. Des expéditions punitives suivirent, et la Compagnie anglaise des Indes orientales, qui offrait de meilleurs prix, encouragea la résistance des insulaires depuis Ai et Run. En 1616, les Néerlandais prirent Ai, et Nathaniel Courthope tint Run pour les Anglais jusqu’à ce qu’il soit tué en 1620. En 1621, le gouverneur général Jan Pieterszoon Coen envahit l’île principale, Lontor, avec environ 1 900 soldats néerlandais et mercenaires japonais. À la suite d’une conspiration dont ils furent accusés, des orang kaya furent torturés et décapités, et tout au long de 1621 les troupes de la Compagnie pourchassèrent les insulaires dans les collines. D’une population estimée à environ 15 000 personnes, il ne restait selon les estimations des sources qu’environ 1 000 habitants sur les îles : des milliers moururent de la violence, de la faim et de la maladie, environ 1 700 ou davantage furent réduits en esclavage ou déportés à Batavia, et d’autres s’enfuirent aux îles Kei et à Seram. La Compagnie répartit les vergers de muscadiers entre des planteurs néerlandais (perkeniers) qui les faisaient exploiter par des personnes réduites en esclavage. De nombreux historiens qualifient cette conquête de génocide."
