# French translations of the catalogue text (wave 11); step bodies follow later.
Dutch East Indies campaign: Campagne des Indes orientales néerlandaises
? "Japan’s conquest of the Dutch East Indies and British Borneo in 1941–1942, the goal of its southern advance: the oil of Borneo and Sumatra, which Japan had been denied by the American, British and Dutch embargo of 1941, and the rubber, tin and rice of the islands. From mid-December 1941 Japanese forces took the oil towns of British Borneo, then from January 1942 Tarakan and Balikpapan in Dutch Borneo, Manado, Kendari and Makassar in Celebes and Ambon in the Moluccas, in a series of amphibious and airborne landings that closed in on Java from east and west. The Allies formed a joint command, ABDA (American–British–Dutch–Australian), but it had too few ships and aircraft. Japanese paratroopers seized the refineries at Palembang in Sumatra on 14 February, the day before Singapore fell, and the Japanese landed on Bali and Timor. The Allied fleet under Rear Admiral Karel Doorman was destroyed in the battle of the Java Sea on 27 February, the Japanese landed on Java on 1 March, and on 8 March the Dutch commander and the governor-general surrendered at Kalijati. Australian commandos and Timorese fought on in Portuguese Timor until early 1943. The Japanese occupation that followed lasted until 1945; a later UN report estimated that some four million people in the Indies died of famine and forced labour."
: "La conquête japonaise des Indes orientales néerlandaises et du Bornéo britannique en 1941–1942, objectif de l’avancée du Japon vers le sud : le pétrole de Bornéo et de Sumatra, dont l’embargo américain, britannique et néerlandais de 1941 l’avait privé, ainsi que le caoutchouc, l’étain et le riz des îles. À partir de la mi-décembre 1941, les forces japonaises s’emparèrent des villes pétrolières du Bornéo britannique, puis, à partir de janvier 1942, de Tarakan et de Balikpapan dans le Bornéo néerlandais, de Manado, de Kendari et de Makassar à Célèbes et d’Ambon aux Moluques, par une série de débarquements amphibies et aéroportés qui se refermèrent sur Java par l’est et par l’ouest. Les Alliés formèrent un commandement commun, l’ABDA (américano-britannico-néerlando-australien), mais il manquait de navires et d’avions. Des parachutistes japonais s’emparèrent des raffineries de Palembang, à Sumatra, le 14 février, la veille de la chute de Singapour, et les Japonais débarquèrent à Bali et à Timor. La flotte alliée du contre-amiral Karel Doorman fut détruite lors de la bataille de la mer de Java le 27 février, les Japonais débarquèrent à Java le 1er mars, et le 8 mars le commandant néerlandais et le gouverneur général capitulèrent à Kalijati. Des commandos australiens et des Timorais poursuivirent le combat au Timor portugais jusqu’au début de 1943. L’occupation japonaise qui suivit dura jusqu’en 1945 ; un rapport ultérieur des Nations unies estima que quelque quatre millions de personnes moururent aux Indes de la famine et du travail forcé."
