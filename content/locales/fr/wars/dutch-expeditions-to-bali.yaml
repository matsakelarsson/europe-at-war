# French translations of the catalogue text (wave 11); step bodies follow later.
Dutch expeditions to Bali: Expéditions néerlandaises à Bali
? Three Dutch military expeditions against the Balinese kingdoms of Buleleng, Karangasem and Klungkung in 1846, 1848 and 1849. The Dutch, anxious to keep other European powers out of Bali, had made the Balinese rulers sign contracts in 1841–1843 that gave up tawan karang, the ruler’s customary right to ships wrecked on his coast, and that the Dutch read as recognising their sovereignty. When Buleleng and Karangasem went on claiming wrecks, a first expedition in 1846 burned the palace of Buleleng at Singaraja. The patih (chief minister) of Buleleng, I Gusti Ketut Jelantik, then fortified Jagaraga, where he threw back a second expedition in June 1848. A third, larger expedition took Jagaraga in April 1849 and, with troops from the Balinese kingdom of Lombok, overran Karangasem; Jelantik and the raja of Buleleng were killed, and the raja of Karangasem took his own life. At Kusamba the forces of Klungkung killed the Dutch commander, Andreas Victor Michiels, in a night attack. A settlement negotiated at Kuta in July 1849 left the Dutch in control of Buleleng and Jembrana and gave Karangasem to Lombok, while the southern kingdoms stayed independent in practice until 1906.
: Trois expéditions militaires néerlandaises contre les royaumes balinais de Buleleng, de Karangasem et de Klungkung, en 1846, 1848 et 1849. Les Néerlandais, soucieux de tenir les autres puissances européennes à l’écart de Bali, avaient fait signer aux souverains balinais en 1841–1843 des contrats par lesquels ceux-ci renonçaient au tawan karang, le droit coutumier du souverain sur les navires naufragés sur ses côtes, et que les Néerlandais interprétaient comme une reconnaissance de leur souveraineté. Comme Buleleng et Karangasem continuaient de revendiquer les épaves, une première expédition incendia en 1846 le palais de Buleleng à Singaraja. Le patih (premier ministre) de Buleleng, I Gusti Ketut Jelantik, fortifia alors Jagaraga, où il repoussa une deuxième expédition en juin 1848. Une troisième expédition, plus importante, prit Jagaraga en avril 1849 et, avec des troupes du royaume balinais de Lombok, envahit Karangasem ; Jelantik et le raja de Buleleng furent tués, et le raja de Karangasem se donna la mort. À Kusamba, les forces de Klungkung tuèrent le commandant néerlandais, Andreas Victor Michiels, lors d’une attaque de nuit. Un accord négocié à Kuta en juillet 1849 laissa aux Néerlandais le contrôle de Buleleng et de Jembrana et donna Karangasem à Lombok, tandis que les royaumes du Sud restèrent de fait indépendants jusqu’en 1906.
