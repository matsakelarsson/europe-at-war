# French translations of the catalogue text (wave 11); step bodies follow later.
Dutch intervention in Bali (1906–1908): Intervention néerlandaise à Bali (1906–1908)
The Dutch conquest of the last independent kingdoms of southern Bali. After a wrecked Chinese schooner was plundered off Sanur in 1904 and the raja of Badung refused compensation, a Dutch expedition landed at Sanur in September 1906. On 20 September the raja of Badung, his family, priests and followers, dressed in white, walked out of the palace at Denpasar towards the Dutch troops in a puputan, a ritual fight to the death; they were shot down or killed themselves and each other, and the court of Pemecutan did the same that afternoon. Estimates of the dead range from several hundred to more than 1,000. The raja of Tabanan surrendered and killed himself in prison two days later. In April 1908, after a rising against the new Dutch opium monopoly at Gelgel, the Dutch bombarded Klungkung, and the Dewa Agung, the highest-ranking ruler of Bali, led his court in a last puputan. All of Bali was now under Dutch rule. Photographs and reports of the killings shocked opinion in the Netherlands and abroad.: La conquête néerlandaise des derniers royaumes indépendants du sud de Bali. Après le pillage d’une goélette chinoise naufragée au large de Sanur en 1904 et le refus du raja de Badung de verser une indemnité, une expédition néerlandaise débarqua à Sanur en septembre 1906. Le 20 septembre, le raja de Badung, sa famille, ses prêtres et ses fidèles, vêtus de blanc, sortirent du palais de Denpasar et marchèrent vers les troupes néerlandaises dans un puputan, un combat rituel jusqu’à la mort ; ils furent abattus, ou se donnèrent la mort ou s’entretuèrent, et la cour de Pemecutan fit de même dans l’après-midi. Les estimations du nombre de morts vont de plusieurs centaines à plus de 1 000. Le raja de Tabanan se rendit et se donna la mort en prison deux jours plus tard. En avril 1908, après un soulèvement contre le nouveau monopole néerlandais de l’opium à Gelgel, les Néerlandais bombardèrent Klungkung, et le Dewa Agung, le souverain du plus haut rang de Bali, conduisit sa cour dans un dernier puputan. Bali tout entière était désormais sous domination néerlandaise. Les photographies et les récits des tueries choquèrent l’opinion aux Pays-Bas et à l’étranger.
