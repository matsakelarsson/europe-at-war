# French translations of the catalogue text (wave 13); step bodies follow later.
Dutch occupation of Luanda: Occupation hollandaise de Luanda
? "The seven years in which the Dutch West India Company (WIC) held Luanda, the capital and slave port of Portuguese Angola, part of the worldwide Dutch–Portuguese war. The Company, which had conquered the sugar lands of north-eastern Brazil, needed enslaved Africans for its plantations, and in August 1641 a fleet sent from Recife by Johan Maurits of Nassau under Admiral Cornelis Jol took Luanda; the Company also held Benguela in the south. The Portuguese governor and settlers withdrew up the Kwanza to the fort of Massangano. Garcia II of Kongo and Queen Njinga of Ndongo and Matamba, both enemies of the Portuguese, allied with the Dutch, and Soyo sent an embassy to the Dutch Republic. The Company wanted trade more than conquest: truces in 1643 left the Portuguese in their inland forts, and only after Njinga’s defeat at Kavanga in 1646 did it send troops to help her, winning at Kombi in 1647. Portugal, independent again from Spain since 1640, answered from Brazil: in August 1648 Salvador Correia de Sá, governor of Rio de Janeiro, arrived with a fleet and about a thousand men, and on 24 August 1648, after a short siege, the Dutch garrison agreed to leave Angola. Kongo had to make peace on harsh terms in 1649 and Njinga withdrew to Matamba. Without Angola’s slaves Dutch Brazil declined, and it fell to Portugal in 1654."
: "Les sept années pendant lesquelles la Compagnie néerlandaise des Indes occidentales (WIC) tint Luanda, capitale et port négrier de l’Angola portugais, dans le cadre de la guerre luso-néerlandaise qui se livrait à l’échelle du monde. La Compagnie, qui avait conquis les terres à sucre du nord-est du Brésil, avait besoin d’Africains réduits en esclavage pour ses plantations et, en août 1641, une flotte envoyée de Recife par Jean-Maurice de Nassau sous le commandement de l’amiral Cornelis Jol prit Luanda ; la Compagnie tint aussi Benguela, au sud. Le gouverneur et les colons portugais se replièrent en remontant le Kwanza jusqu’au fort de Massangano. Garcia II du Kongo et la reine Njinga du Ndongo et du Matamba, tous deux ennemis des Portugais, s’allièrent aux Hollandais, et le Soyo envoya une ambassade aux Provinces-Unies. La Compagnie cherchait le commerce plus que la conquête : des trêves conclues en 1643 laissèrent les Portugais dans leurs forts de l’intérieur, et ce n’est qu’après la défaite de Njinga à Kavanga, en 1646, qu’elle envoya des troupes l’aider, remportant la victoire de Kombi en 1647. Le Portugal, de nouveau indépendant de l’Espagne depuis 1640, riposta depuis le Brésil : en août 1648, Salvador Correia de Sá, gouverneur de Rio de Janeiro, arriva avec une flotte et environ un millier d’hommes et, le 24 août 1648, après un bref siège, la garnison hollandaise accepta de quitter l’Angola. Le Kongo dut faire la paix à des conditions sévères en 1649, et Njinga se retira au Matamba. Privé des esclaves de l’Angola, le Brésil hollandais déclina, et il tomba aux mains du Portugal en 1654."
