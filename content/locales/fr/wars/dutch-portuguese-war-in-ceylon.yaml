# French translations of the catalogue text (wave 8); step bodies follow later.
Dutch–Portuguese War in Ceylon: Guerre néerlando-portugaise à Ceylan
The conquest of Portuguese Ceylon by the Dutch East India Company (VOC), at first in alliance with King Rajasinghe II of Kandy. After the Kandyans destroyed a Portuguese army at Gannoruwa in March 1638, a Dutch fleet took Batticaloa in May and Rajasinghe signed a treaty with the Company. Trincomalee fell in 1639 and Galle, stormed on 13 March 1640, became the Dutch headquarters. A truce between the Dutch Republic and newly independent Portugal halted the fighting in the 1640s, and the allies quarrelled over the captured forts, which the Dutch kept. When war resumed, the Dutch besieged Colombo from late 1655 and took it on 12 May 1656, then turned on Mannar and Jaffna in 1658, ending Portuguese rule in the island. Rajasinghe found that he had exchanged one European power on the coast for another, and Kandy fought the Dutch on and off until 1766.: La conquête du Ceylan portugais par la Compagnie néerlandaise des Indes orientales (VOC), d’abord en alliance avec le roi Rajasinghe II de Kandy. Après que les Kandyens eurent anéanti une armée portugaise à Gannoruwa en mars 1638, une flotte néerlandaise prit Batticaloa en mai et Rajasinghe signa un traité avec la Compagnie. Trincomalee tomba en 1639, et Galle, prise d’assaut le 13 mars 1640, devint le quartier général néerlandais. Une trêve entre les Provinces-Unies et le Portugal, nouvellement indépendant, interrompit les combats dans les années 1640, et les alliés se querellèrent au sujet des forts conquis, que les Néerlandais conservèrent. À la reprise de la guerre, les Néerlandais assiégèrent Colombo à partir de la fin de 1655 et la prirent le 12 mai 1656, puis se tournèrent contre Mannar et Jaffna en 1658, mettant fin à la domination portugaise sur l’île. Rajasinghe constata qu’il avait échangé une puissance européenne installée sur la côte contre une autre, et Kandy combattit les Néerlandais par intermittence jusqu’en 1766.
