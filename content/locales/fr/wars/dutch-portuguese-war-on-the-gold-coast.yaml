# French translations of the catalogue text (wave 13); step bodies follow later.
Dutch–Portuguese war on the Gold Coast: Guerre néerlando-portugaise sur la Côte-de-l’Or
? The struggle in which Dutch traders, and from 1621 the Dutch West India Company, broke Portugal’s hold on the Gold Coast, part of the wider Dutch–Portuguese War. The Portuguese had traded for Akan gold from São Jorge da Mina at Elmina since 1482, with outposts at Shama and Axim, and paid for much of it with captives brought from Benin. Dutch ships came from the 1590s; about 1598 they opened a post at Moree, which the Portuguese burned in 1610, and in 1612, by treaty with the rulers of Asebu, they built Fort Nassau there. The Company’s first attack on Elmina, on 25 October 1625, was ambushed and beaten by the small garrison and its African allies. In August 1637 a second force from Dutch Brazil, joined by about a thousand African fighters whom the Dutch commander had won over, took the hill of St Jago above the castle and forced its surrender. Shama fell in 1640 or 1642 and Axim early in 1642, and the treaty the Company made with Axim’s chiefs on 17 February 1642 ended Portuguese rule on the coast, three days before the States-General ratified the truce of 1641 between the Dutch and the newly independent Portugal. Both sides relied on African rulers and fighters, who chose their allies for trade and gifts; the Dutch used Elmina, as the Portuguese had, for the trade in gold and increasingly in slaves.
: La lutte par laquelle les marchands néerlandais, puis, à partir de 1621, la Compagnie néerlandaise des Indes occidentales brisèrent l’emprise du Portugal sur la Côte-de-l’Or, dans le cadre plus large de la guerre néerlando-portugaise. Les Portugais achetaient l’or akan à São Jorge da Mina, à Elmina, depuis 1482, avec des comptoirs à Shama et à Axim, et le payaient en bonne partie avec des captifs amenés du royaume du Bénin. Les navires néerlandais arrivèrent à partir des années 1590 ; vers 1598, ils ouvrirent un comptoir à Moree, que les Portugais incendièrent en 1610, et en 1612, par un traité avec les souverains d’Asebu, ils y construisirent le fort Nassau. La première attaque de la Compagnie contre Elmina, le 25 octobre 1625, tomba dans une embuscade et fut repoussée par la petite garnison et ses alliés africains. En août 1637, une seconde expédition venue du Brésil néerlandais, renforcée par un millier de combattants africains que le commandant néerlandais avait gagnés à sa cause, s’empara de la colline de St Jago, qui domine le château, et en força la reddition. Shama tomba en 1640 ou en 1642 et Axim au début de 1642, et le traité que la Compagnie conclut avec les chefs d’Axim le 17 février 1642 mit fin à la domination portugaise sur la côte, trois jours avant que les États généraux ne ratifient la trêve de 1641 entre les Néerlandais et le Portugal nouvellement indépendant. Les deux camps s’appuyaient sur des souverains et des combattants africains, qui choisissaient leurs alliés en fonction du commerce et des présents ; les Néerlandais se servirent d’Elmina, comme les Portugais avant eux, pour le commerce de l’or et, de plus en plus, des esclaves.
