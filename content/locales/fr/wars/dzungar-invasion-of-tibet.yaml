# French translations of the catalogue text (wave 9); step bodies follow later.
Dzungar invasion of Tibet: Invasion du Tibet par les Dzoungars
In 1717 an army of the Dzungar Khanate under Tseren Dondub crossed the Kunlun and the uninhabited Changtang plateau from Yarkand, defeated Lhazang Khan, the Khoshut Mongol ruler of Tibet, and took Lhasa in late November; Lhazang Khan was killed on 3 December 1717. The Dzungars deposed the Dalai Lama Lhazang had installed, plundered Lhasa and its monasteries and persecuted the Nyingma school, and soon lost the support they had first found among the Gelug clergy. A Qing relief force from Xining was destroyed on the Salween river near Nagqu in September 1718. In 1720 two larger Qing armies, from Kokonor and from Sichuan, with Tibetan forces under Polhané and Kangchenné, drove the Dzungars out. The Qing brought the young Kelzang Gyatso from Kumbum and enthroned him as the Seventh Dalai Lama in the Potala, and left a garrison in Lhasa. The Qing date their rule in Tibet from this expedition; how far it made Tibet part of the Qing empire is disputed.: En 1717, une armée du khanat dzoungar commandée par Tseren Dondub franchit depuis Yarkand le Kunlun et le plateau inhabité du Changtang, battit Lhazang Khan, le souverain mongol khoshut du Tibet, et prit Lhassa à la fin de novembre ; Lhazang Khan fut tué le 3 décembre 1717. Les Dzoungars déposèrent le dalaï-lama que Lhazang avait installé, pillèrent Lhassa et ses monastères et persécutèrent l’école nyingma, et perdirent bientôt le soutien qu’ils avaient d’abord trouvé auprès du clergé gelug. Une armée de secours Qing partie de Xining fut anéantie sur la Salouen, près de Nagqu, en septembre 1718. En 1720, deux armées Qing plus importantes, venues du Kokonor et du Sichuan, avec des forces tibétaines commandées par Polhané et Kangchenné, chassèrent les Dzoungars. Les Qing firent venir de Kumbum le jeune Kelzang Gyatso, l’intronisèrent au Potala comme septième dalaï-lama et laissèrent une garnison à Lhassa. Les Qing font remonter à cette expédition leur domination sur le Tibet ; la mesure dans laquelle elle fit du Tibet une partie de l’empire des Qing est contestée.
