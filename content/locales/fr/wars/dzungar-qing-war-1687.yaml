# French translations of the catalogue text (wave 9); step bodies follow later.
Dzungar–Qing War (1687–1697): Guerre entre les Dzoungars et les Qing (1687–1697)
? The first war between the Dzungar Khanate of the western Mongols (Oirats) and the Qing empire, fought over Khalkha, the land of the eastern Mongols. Galdan Boshugtu Khan, who had made the Dzungars the leading power of Inner Asia and conquered the oases of the Tarim basin, took a quarrel among the Khalkha khans as his reason to invade Khalkha in 1688. He defeated the Tüsheet Khan at Olgoi Nor and drove the Khalkha nobles, the Jebtsundamba Khutugtu Zanabazar and tens of thousands of their people south into Qing territory, where they submitted to the Kangxi emperor. In 1690 Galdan advanced to Ulan Butung, about 300 km north of Beijing, and fought a Qing army to a standstill before withdrawing. At Dolon Nor in 1691 the Khalkha formally became Qing subjects. In 1696 the Kangxi emperor led three armies across the Gobi, and Fiyanggu’s western army destroyed Galdan’s forces at Jao Modo on the upper Tuul river. Galdan died in the Altai in April 1697. Khalkha remained part of the Qing empire until 1911, while the Dzungar Khanate survived under Galdan’s nephew Tsewang Rabtan.
: La première guerre entre le khanat dzoungar des Mongols occidentaux (Oïrats) et l’empire des Qing, livrée pour le Khalkha, le pays des Mongols orientaux. Galdan Boshugtu Khan, qui avait fait des Dzoungars la première puissance de l’Asie intérieure et conquis les oasis du bassin du Tarim, prit prétexte d’une querelle entre les khans khalkhas pour envahir le Khalkha en 1688. Il battit le Tüsheet Khan à Olgoi Nor et repoussa vers le sud, en territoire Qing, les nobles khalkhas, le Jebtsundamba Khutugtu Zanabazar et des dizaines de milliers de leurs gens, qui s’y soumirent à l’empereur Kangxi. En 1690, Galdan s’avança jusqu’à Ulan Butung, à environ 300 km au nord de Pékin, et tint en échec une armée Qing avant de se retirer. À Dolon Nor, en 1691, les Khalkhas devinrent officiellement sujets des Qing. En 1696, l’empereur Kangxi conduisit trois armées à travers le Gobi, et l’armée de l’Ouest de Fiyanggu anéantit les forces de Galdan à Jao Modo, sur le cours supérieur de la Tuul. Galdan mourut dans l’Altaï en avril 1697. Le Khalkha resta partie intégrante de l’empire des Qing jusqu’en 1911, tandis que le khanat dzoungar survécut sous le neveu de Galdan, Tsewang Rabtan.
