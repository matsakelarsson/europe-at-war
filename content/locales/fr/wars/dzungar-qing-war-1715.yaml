# French translations of the catalogue text (wave 9); step bodies follow later.
Dzungar–Qing War (1715–1739): Guerre entre les Dzoungars et les Qing (1715–1739)
The second round of wars between the Dzungar Khanate and the Qing empire, fought on the oasis road east of the Tian Shan, in Khalkha and, in 1717–1720, in Tibet. It began in 1715 when Tsewang Rabtan’s Dzungars attacked Hami, a Qing dependency since 1696–1697. The Kangxi emperor stationed armies and military farms at Barkol and Hami, and in 1720 Qing troops reached Turfan, whose people, led by Emin Khoja, went over to the Qing. After a truce under the Yongzheng emperor the war flared up again in 1729, when the Dzungars refused to hand over the Khoshut rebel Lobzang Danjin. At Khoton Nor in the Altai, in July 1731, Galdan Tseren’s army destroyed the Qing northern army under Furdan, but in 1732 the Khalkha prince Tsering defeated a Dzungar invasion of Khalkha near Erdene Zuu. Talks from 1734 ended in an agreement in 1739 that fixed the line between the Dzungar and Khalkha pastures in the Altai and opened trade, and the frontier stayed at peace until the Dzungar civil wars of the 1740s and 1750s.: La deuxième série de guerres entre le khanat dzoungar et l’empire des Qing, livrées sur la route des oasis à l’est du Tian Shan, au Khalkha et, en 1717–1720, au Tibet. Elle commença en 1715, lorsque les Dzoungars de Tsewang Rabtan attaquèrent Hami, dépendance des Qing depuis 1696–1697. L’empereur Kangxi installa des armées et des colonies militaires à Barkol et à Hami et, en 1720, des troupes Qing atteignirent Tourfan, dont la population, menée par Emin Khoja, se rallia aux Qing. Après une trêve sous l’empereur Yongzheng, la guerre reprit en 1729, lorsque les Dzoungars refusèrent de livrer le rebelle khoshut Lobzang Danjin. À Khoton Nor, dans l’Altaï, en juillet 1731, l’armée de Galdan Tseren anéantit l’armée du Nord des Qing commandée par Furdan, mais en 1732 le prince khalkha Tsering repoussa une invasion dzoungare du Khalkha près d’Erdene Zuu. Des pourparlers engagés en 1734 aboutirent en 1739 à un accord qui fixa la limite entre les pâturages dzoungars et khalkhas dans l’Altaï et ouvrit le commerce, et la frontière resta en paix jusqu’aux guerres civiles dzoungares des années 1740 et 1750.
