# French translations of the catalogue text (wave 13); step bodies follow later.
East African campaign (First World War): Campagne d’Afrique de l’Est (Première Guerre mondiale)
? "The First World War in East Africa, fought for four years over German East Africa (mainland Tanzania, Rwanda and Burundi) and the neighbouring British, Belgian and Portuguese colonies. The German commander, Paul von Lettow-Vorbeck, set out to tie down as many Allied troops as he could. His Schutztruppe, mostly African soldiers (askari), threw back a British landing at Tanga in November 1914. In 1916 the South African general Jan Smuts invaded from Kenya, while Belgian troops from the Congo took Rwanda, Burundi and Tabora and British forces came in from Nyasaland and Northern Rhodesia; by the end of the year the Allies held the north and centre of the colony and its railways. Lettow-Vorbeck withdrew south, fought a costly battle at Mahiwa in October 1917, and in November crossed the Rovuma into Portuguese Mozambique. He marched through Mozambique for ten months, came back through German East Africa into Northern Rhodesia and surrendered at Abercorn on 25 November 1918, two weeks after the armistice in Europe. The war was fought largely by Africans and borne by them: about 11,000 British Empire soldiers and some 95,000 of its African carriers died, and famine and disease caused by the war killed hundreds of thousands of civilians."
: "La Première Guerre mondiale en Afrique de l’Est, livrée pendant quatre ans pour l’Afrique orientale allemande (la Tanzanie continentale, le Rwanda et le Burundi) et dans les colonies britanniques, belges et portugaises voisines. Le commandant allemand, Paul von Lettow-Vorbeck, s’efforça d’immobiliser autant de troupes alliées que possible. Sa Schutztruppe, composée surtout de soldats africains (askaris), repoussa un débarquement britannique à Tanga en novembre 1914. En 1916, le général sud-africain Jan Smuts envahit la colonie depuis le Kenya, tandis que des troupes belges venues du Congo prenaient le Rwanda, le Burundi et Tabora et que des forces britanniques arrivaient du Nyassaland et de la Rhodésie du Nord ; à la fin de l’année, les Alliés tenaient le nord et le centre de la colonie ainsi que ses chemins de fer. Lettow-Vorbeck se replia vers le sud, livra une bataille coûteuse à Mahiwa en octobre 1917 et, en novembre, franchit la Rovuma pour entrer au Mozambique portugais. Il marcha à travers le Mozambique pendant dix mois, revint par l’Afrique orientale allemande pour gagner la Rhodésie du Nord et se rendit à Abercorn le 25 novembre 1918, deux semaines après l’armistice en Europe. La guerre fut en grande partie menée par des Africains, et ce sont eux qui en supportèrent le poids : environ 11 000 soldats de l’Empire britannique et quelque 95 000 de ses porteurs africains moururent, et la famine et les maladies causées par la guerre tuèrent des centaines de milliers de civils."
