# French translations of the catalogue text (wave 12); step bodies follow later.
East African campaign: Campagne d’Afrique de l’Est
? "The Second World War in the Horn of Africa. When Italy entered the war in June 1940, the Duke of Aosta’s army in Italian East Africa, some 250,000–290,000 men, most of them Eritrean, Somali and Ethiopian colonial troops, outnumbered the British forces around it many times over. It took Kassala and Gallabat in Sudan and Moyale in Kenya, and in August 1940 conquered British Somaliland. But cut off from Italy by the closure of the Suez Canal and short of fuel and spares, it could only wait. In January 1941 British, Indian, South African, East and West African, Sudanese, Free French and Belgian Congolese forces attacked from three sides, with Ethiopian Patriots rising in the highlands: from Sudan into Eritrea, where the Italians held the mountain fortress of Keren for eight weeks; from Kenya through Italian Somaliland to Addis Ababa, which fell on 6 April; and with Gideon Force and Emperor Haile Selassie into Gojjam. Haile Selassie returned to his capital on 5 May 1941, the Duke of Aosta surrendered at Amba Alagi on 19 May, and the last Italian army surrendered at Gondar on 27 November 1941. It restored Ethiopia’s independence."
: "La Seconde Guerre mondiale dans la Corne de l’Afrique. Lorsque l’Italie entra en guerre, en juin 1940, l’armée du duc d’Aoste en Afrique orientale italienne, quelque 250 000–290 000 hommes, pour la plupart des troupes coloniales érythréennes, somalies et éthiopiennes, était plusieurs fois plus nombreuse que les forces britanniques qui l’entouraient. Elle prit Kassala et Gallabat au Soudan et Moyale au Kenya, et conquit le Somaliland britannique en août 1940. Mais, coupée de l’Italie par la fermeture du canal de Suez et à court de carburant et de pièces de rechange, elle ne pouvait qu’attendre. En janvier 1941, des forces britanniques, indiennes, sud-africaines, est- et ouest-africaines, soudanaises, françaises libres et congolaises belges attaquèrent de trois côtés, tandis que les Patriotes éthiopiens se soulevaient sur les hauts plateaux : depuis le Soudan vers l’Érythrée, où les Italiens tinrent huit semaines la forteresse montagneuse de Keren ; depuis le Kenya, à travers la Somalie italienne, jusqu’à Addis-Abeba, qui tomba le 6 avril ; et, avec la Gideon Force et l’empereur Hailé Sélassié, vers le Godjam. Hailé Sélassié rentra dans sa capitale le 5 mai 1941, le duc d’Aoste capitula à l’Amba Alagi le 19 mai, et la dernière armée italienne se rendit à Gondar le 27 novembre 1941. La campagne rendit son indépendance à l’Éthiopie."
