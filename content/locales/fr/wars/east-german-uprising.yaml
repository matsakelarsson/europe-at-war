# Some French text was translated automatically.
"East German uprising of 1953": "soulèvement d’Allemagne de l’Est en 1953"
"A wave of strikes and protests across East Germany. It began on 16 June 1953, when construction workers on East Berlin’s Stalinallee struck against a compulsory 10 per cent rise in work quotas, and on 17 June more than a million people in some 700 towns and villages joined strikes and demonstrations, many of them demanding free elections and the government’s resignation. Soviet forces declared martial law and put the rising down with tanks, helped by the East German police. At least 55 people were killed, and some estimates are well over 100. Up to 10,000 people were detained, and Soviet and East German courts passed death sentences. West Germany made 17 June a national holiday, the Day of German Unity, until reunification in 1990.": "Une vague de grèves et de protestations dans toute l’Allemagne de l’Est. Elle a commencé le 16 juin 1953, lorsque les ouvriers du bâtiment à Berlin Est ont frappé contre une augmentation obligatoire de 10% des quotas de travail, et le 17 juin plus d’un million de personnes dans quelque 700 villes et villages se sont joints aux grèves et manifestations, beaucoup d’entre eux exigeant des élections libres et la démission du gouvernement. Au moins 55 personnes ont été tuées, et certaines estimations sont bien plus de 100. Jusqu'à 10 000 personnes ont été détenues, et les tribunaux soviétiques et allemands de l’Est ont prononcé des condamnations à mort. L’Allemagne de l’Ouest a fait 17 juin un jour férié national, le Jour de l’unité allemande, jusqu’à la réunification en 1990."
"Protests went on in some places until about 24 June. The ruling Socialist Unity Party withdrew the rise in work quotas on the afternoon of 16 June, but too late to stop the next day’s strikes.": "Les manifestations se sont poursuivies dans certains endroits jusqu’au 24 juin. Le Parti de l’unité socialiste au pouvoir a retiré la hausse des quotas de travail dans l’après-midi du 16 juin, mais trop tard pour arrêter les grèves du lendemain."
