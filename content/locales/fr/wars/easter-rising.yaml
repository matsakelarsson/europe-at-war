# Some French text was translated automatically.
"Easter Rising": "L’ascension de Pâques"
"An armed rising in Ireland, centred on Dublin, in which Irish republicans proclaimed an Irish Republic in Easter Week 1916, while Britain was fighting the First World War. British forces crushed it within six days, but the execution of sixteen of its leaders and mass arrests turned much of Irish opinion towards the separatist cause.": "Une montée armée en Irlande, centrée sur Dublin, dans laquelle les républicains irlandais ont proclamé une République irlandaise au cours de la semaine de Pâques 1916, tandis que la Grande-Bretagne combattait la Première Guerre mondiale. Les forces britanniques l’ont écrasée en six jours, mais l’exécution de seize de ses dirigeants et des arrestations massives a tourné une grande partie de l’opinion irlandaise vers la cause séparatiste."
"All of Ireland was then part of the United Kingdom of Great Britain and Ireland. Sackville Street in Dublin is today’s O’Connell Street, Kingstown is Dún Laoghaire, and Kingsbridge station is Heuston station.": "Toute l’Irlande faisait alors partie du Royaume-Uni de Grande-Bretagne et d’Irlande. La rue Sackville à Dublin est aujourd'hui une rue d’Os Connell, Kingstown est Dún Laoghaire, et la gare de Kingsbridge est la station Heuston."
"Figures for the dead are those of the Glasnevin Trust’s count, as given in most recent accounts. The rebels’ strength in Dublin is usually put at about 1,250; others mobilised in the provinces but did little fighting.": "Les chiffres pour les morts sont ceux du compte de Glasnevin Trust, comme indiqué dans les derniers récits. La force des rebelles à Dublin est généralement mise à environ 1.250 ; d’autres mobilisés dans les provinces mais a fait peu de combats."
