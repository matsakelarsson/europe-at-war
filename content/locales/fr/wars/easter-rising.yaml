"24 April – 12 May 1916": "24 avril – 12 mai 1916"
"A secret military council of the Irish Republican Brotherhood planned a rising for Easter 1916, while Britain was at war, and hoped for German arms. The plan went wrong at once. The Royal Navy intercepted the arms ship Aud off Kerry, and its crew scuttled it; Roger Casement, landed from a German submarine, was arrested; and Eoin MacNeill, chief of staff of the Irish Volunteers, cancelled the manoeuvres that were to have begun it. The council struck a day later, on Easter Monday, 24 April, with about 1,250 Volunteers, Irish Citizen Army men and women of Cumann na mBan.": "Un conseil militaire secret de la Fraternité républicaine irlandaise planifia une montée pour Pâques 1916, tandis que la Grande-Bretagne était en guerre, et espérait les armes allemandes. La Royal Navy a intercepté le navire d’armes Aud au large de Kerry, et son équipage l’a égorgé ; Roger Casement, débarqué d’un sous-marin allemand, a été arrêté ; et Eoin MacNeill, chef d’état-major des volontaires irlandais, a annulé les manoeuvres qui devaient avoir commencé. Le conseil a frappé un jour plus tard, le lundi de Pâques, 24 avril, avec environ 1 250 volontaires, Irish Citizen Army hommes et femmes de Cumann na mBan."
"They seized the General Post Office in Sackville Street, where Patrick Pearse read the Proclamation of the Irish Republic, and other strongpoints around central Dublin, but failed to take Dublin Castle, the railway stations or the ports. The British brought in troops from the Curragh, Belfast and Britain until they had more than 16,000 men. At Mount Street Bridge on 26 April a handful of Volunteers killed or wounded some 240 soldiers marching in from Kingstown. Artillery and the gunboat Helga shelled the city centre, the GPO was set on fire, and on 29 April Pearse surrendered unconditionally.": "Ils s’emparèrent du bureau de poste général de Sackville Street, où Patrick Pearse lut la Proclamation de la République irlandaise, et d’autres points forts autour du centre de Dublin, mais ne prirent pas le château de Dublin, les gares ou les ports. Les Britanniques apportèrent des troupes du Curragh, Belfast et la Grande-Bretagne jusqu’à ce qu’ils aient plus de 16 000 hommes. Au pont Mount Street, le 26 avril, une poignée de volontaires ont tué ou blessé quelque 240 soldats qui débarquaient de Kingstown. L’artillerie et la canonnière Helga ont bombardé le centre-ville, le GPO a été incendié et Pearse s’est rendu sans condition le 29 avril."
"Of the 485 people killed, 260 were civilians, many hit by shellfire or caught in crossfire, and in North King Street soldiers killed fifteen men in their homes. Secret courts martial sentenced 90 people to death. Fourteen were shot at Kilmainham Gaol between 3 and 12 May, among them all seven signatories of the Proclamation; Thomas Kent was shot in Cork, and Casement was hanged in London in August. About 3,500 people were arrested and 1,800 interned or imprisoned in Britain. The executions turned opinion, and in the 1918 election Sinn Féin won 73 of Ireland’s 105 seats.": "Sur les 485 personnes tuées, 260 étaient des civils, beaucoup ont été touchés par des tirs d’obus ou pris entre deux feux, et dans la rue North King des soldats ont tué quinze hommes dans leurs maisons. Les cours martiales secrètes ont condamné 90 personnes à mort. Quatorze ont été abattues à Kilmainham Gaol entre le 3 et le 12 mai, parmi lesquels les sept signataires de la Proclamation ; Thomas Kent a été abattu à Cork, et Casement a été pendu à Londres en août. Environ 3 500 personnes ont été arrêtées et 1 800 internées ou emprisonnées en Grande-Bretagne. Les exécutions ont tourné l’opinion, et à l’élection de 1918 Sinn Féin a remporté 73 des 105 sièges d’Irlande."
