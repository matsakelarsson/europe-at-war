# French translations of the catalogue text (wave 13); step bodies follow later.
ECOWAS military intervention in the Gambia: Intervention militaire de la CEDEAO en Gambie
? The West African intervention that made President Yahya Jammeh of the Gambia, in power since a coup in 1994, hand over to the winner of the election of 1 December 2016, Adama Barrow. Jammeh first conceded defeat, then on 9 December rejected the result and appealed to the Supreme Court, which had no judges to hear the case. ECOWAS, the African Union and the United Nations backed Barrow; mediation by West African presidents failed, about 45,000 people fled to Senegal, and Jammeh declared a state of emergency. On 19 January 2017 Barrow was sworn in at the Gambian embassy in Dakar, the UN Security Council unanimously backed ECOWAS’s efforts in Resolution 2337, without explicitly authorising force, and the same day Senegalese troops, with Nigerian aircraft and ships and contingents from Ghana and other states, crossed the border in what was first called Operation Restore Democracy. The Gambian army did not resist; after a last mediation by the presidents of Guinea and Mauritania, Jammeh flew into exile on 21 January, first to Guinea and then to Equatorial Guinea. Barrow returned on 26 January. A smaller ECOWAS force, the ECOWAS Mission in the Gambia (ECOMIG), stayed to secure the transition and was still present in 2025; in January 2022 fighters of the Casamance rebel MFDC attacked a Senegalese ECOMIG patrol near the border, killing four soldiers and capturing seven.
: L’intervention ouest-africaine qui contraignit le président gambien Yahya Jammeh, au pouvoir depuis un coup d’État en 1994, à céder la place au vainqueur de l’élection du 1er décembre 2016, Adama Barrow. Jammeh reconnut d’abord sa défaite, puis, le 9 décembre, rejeta le résultat et saisit la Cour suprême, qui n’avait pas de juges pour examiner l’affaire. La CEDEAO, l’Union africaine et les Nations unies soutinrent Barrow ; la médiation de présidents ouest-africains échoua, environ 45 000 personnes s’enfuirent au Sénégal, et Jammeh décréta l’état d’urgence. Le 19 janvier 2017, Barrow prêta serment à l’ambassade de Gambie à Dakar, le Conseil de sécurité de l’ONU soutint à l’unanimité les efforts de la CEDEAO par la résolution 2337, sans autoriser explicitement le recours à la force, et le même jour des troupes sénégalaises, avec des avions et des navires nigérians et des contingents du Ghana et d’autres États, franchirent la frontière lors de ce qui fut d’abord appelé l’opération Restaurer la démocratie. L’armée gambienne n’opposa pas de résistance ; après une dernière médiation des présidents de la Guinée et de la Mauritanie, Jammeh partit en exil par avion le 21 janvier, d’abord en Guinée, puis en Guinée équatoriale. Barrow rentra le 26 janvier. Une force plus réduite de la CEDEAO, la Mission de la CEDEAO en Gambie (ECOMIG), resta pour sécuriser la transition et était toujours présente en 2025 ; en janvier 2022, des combattants du MFDC, la rébellion casamançaise, attaquèrent une patrouille sénégalaise de l’ECOMIG près de la frontière, tuant quatre soldats et en capturant sept.
