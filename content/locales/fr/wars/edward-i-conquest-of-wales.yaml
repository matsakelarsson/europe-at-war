"By the Treaty of Montgomery of 1267 Henry III recognised Llywelyn ap Gruffudd of Gwynedd as Prince of Wales and overlord of the other Welsh rulers. Relations with Henry’s son Edward I soon broke down. Llywelyn would not come to do homage, quarrelled with the marcher lords over the border, and objected that Edward sheltered his brother Dafydd and Gruffudd ap Gwenwynwyn of Powys, who had plotted against his life. When Llywelyn married Eleanor de Montfort, the daughter of Edward’s old enemy Simon, by proxy, Edward had her ship seized at sea on her way from France in 1275. In November 1276 he declared Llywelyn a rebel.": "Par le traité de Montgomery de 1267, Henri III a reconnu Llywelyn ap Gruffudd de Gwynedd comme prince de Galles et surlord des autres dirigeants gallois. Relations avec Henrys fils Edward I bientôt rompu. Llywelyn ne venait pas rendre hommage, se disputait avec les seigneurs de marche au-dessus de la frontière, et objectait qu’Edward abritait son frère Dafydd et Gruffudd ap Gwenwynwyn de Powys, qui avait comploté contre sa vie. Lorsque Llywelyn épousa Eleanor de Montfort, la fille du vieil ennemi d’Edward Simon, par procuration, Edward fit saisir son navire en mer en 1275. En novembre 1276, il déclara Llywelyn rebelle."
"In 1277 royal armies advanced from Chester, Montgomery and Carmarthen, and the lords of Powys and Deheubarth submitted. In July Edward led the main army west from Chester along the coast, with hundreds of woodcutters clearing a road and new castles begun at Flint and Rhuddlan, while his fleet landed troops on Anglesey to take its harvest, the granary of Gwynedd. Facing a winter of hunger in the mountains, Llywelyn gave in. By the Treaty of Aberconwy in November he kept his title but only Gwynedd west of the Conwy; the land between the Conwy and the Dee went to Edward and to Dafydd, and the other Welsh lords became Edward’s vassals.": "En 1277, les armées royales avançaient de Chester, Montgomery et Carmarthen, et les seigneurs de Powys et Deheubarth se présentèrent. En juillet, Edward mena l’armée principale à l’ouest de Chester le long de la côte, avec des centaines de bûcherons qui défrichaient une route et de nouveaux châteaux commencés à Flint et Rhuddlan, tandis que sa flotte débarquait des troupes sur Anglesey pour prendre sa récolte, le grenier de Gwynedd. Face à un hiver de faim dans les montagnes, Llywelyn céda. Par le traité d’Aberconwy en novembre il garda son titre mais seulement Gwynedd à l’ouest du Conwy ; la terre entre le Conwy et le Dee se rendit à Edward et à Dafydd, et les autres seigneurs gallois devinrent des vassaux d’Edward."
