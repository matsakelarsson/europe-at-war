"1282–1283": "1282–1283"
"English officials and English law in the lands taken in 1277 caused bitter resentment, and Dafydd felt poorly rewarded for his help. On Palm Sunday, 22 March 1282, he attacked Hawarden castle and went on to besiege Rhuddlan; risings followed in Deheubarth and northern Powys, and Llywelyn joined the war. Edward advanced along the north coast once more and sent a force to Anglesey. On 6 November, while Archbishop Peckham of Canterbury was trying to make peace, Luke de Tany led a surprise attack across a bridge of boats over the Menai Strait and was routed at Moel-y-don; many of his knights drowned.": "Le dimanche des Rameaux, 22 mars 1282, il attaqua le château d’Hawarden et continua à assiéger Rhuddlan ; des montées suivirent à Deheubarth et au nord de Powys, et Llywelyn se joignit à la guerre. Edward progressa encore une fois le long de la côte nord et envoya une force à Anglesey. Le 6 novembre, alors que l’archevêque Peckham de Canterbury tentait de faire la paix, Luke de Tany mena une attaque surprise à travers un pont de bateaux au-dessus du détroit de Menai et fut acheminé à Moel-y-don ; plusieurs de ses chevaliers se noyèrent."
"Llywelyn went south to raise mid-Wales, and on 11 December he was killed near Cilmeri, by Builth, apparently cut off from his army by English troops at Orewin Bridge. His head was sent to London and set up at the Tower. In January 1283 Edward pushed into Snowdonia and took Dolwyddelan, and Castell y Bere fell on 25 April. Dafydd, who had taken the title of prince, was captured in June and hanged, drawn and quartered at Shrewsbury on 3 October. By the Statute of Rhuddlan of 1284 the principality was annexed to the English crown and divided into shires, and Edward began great castles at Conwy, Caernarfon and Harlech to hold it.": "Le 11 décembre, il fut tué près de Cilmeri, par Bâtith, apparemment coupé de son armée par des troupes anglaises au pont Orewin. Sa tête fut envoyée à Londres et installée à la tour. En janvier 1283, Edward poussa dans Snowdonia et prit Dolwyddelan, et Castell y Bere tomba le 25 avril. Dafydd, qui avait pris le titre de prince, fut capturé en juin et pendu, tiré et cantonné à Shrewsbury le 3 octobre. Par le statut de Rhuddlan de 1284 la principauté fut annexée à la couronne anglaise et divisée en shires, et Edward commença de grands châteaux à Conwy, Caernarfon et Harlech pour la tenir."
