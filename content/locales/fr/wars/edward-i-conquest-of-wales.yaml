"1277": "1277"
"Edward I’s conquest of Wales": "Edouard IIs conquête du Pays de Galles"
"The wars in which Edward I of England conquered the principality of Wales. In 1277 he forced Llywelyn ap Gruffudd, Prince of Wales, back into western Gwynedd; when Llywelyn and his brother Dafydd rose in 1282, Edward overran Snowdonia, Llywelyn was killed and Dafydd executed, and the Statute of Rhuddlan of 1284 annexed their lands to the English crown, held down by a ring of great castles.": "Les guerres dans lesquelles Edward Ier d’Angleterre a conquis la principauté du pays de Galles. En 1277, il força Llywelyn ap Gruffudd, prince de Galles, à retourner dans l’ouest de Gwynedd ; quand Llywelyn et son frère Dafydd se levèrent en 1282, Edward overran Snowdonia, Llywelyn fut tué et Dafydd exécuté, et le Statut de Rhuddlan de 1284 annexent leurs terres à la couronne anglaise, tenue par un anneau de grands châteaux."
"Much of Wales, notably the south and the border, was already held by Anglo-Norman marcher lords; the wars were fought over the principality that Llywelyn had built up and that Henry III had recognised in 1267.": "Une grande partie du pays de Galles, notamment le sud et la frontière, était déjà tenue par les seigneurs des marcheurs anglo-normains ; les guerres ont été menées sur la principauté que Llywelyn avait construite et qu’Henri III avait reconnue en 1267."
"The Welsh chronicle Brut y Tywysogion and English royal records are the main sources. The circumstances of Llywelyn’s death were told differently on each side and remain unclear.": "La chronique galloise Brut y Tywysogion et les archives royales anglaises sont les principales sources. Les circonstances de la mort de Llywelyn ont été racontées différemment de chaque côté et restent floues."
