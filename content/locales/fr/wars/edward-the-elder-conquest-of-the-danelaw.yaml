# Some French text was translated automatically.
"Edward the Elder’s conquest of the Danelaw": "Edward l’Ancien Conquête de la Danelaw"
"The campaigns in which Edward the Elder of Wessex and his sister Æthelflæd, Lady of the Mercians, conquered the Danish-ruled lands of England south of the Humber. After a West Saxon and Mercian army destroyed a Northumbrian Danish raiding army at Tettenhall on 5 August 910, the two built chains of fortified burhs and pushed into the Danelaw. In 917 the English stormed the Danish fort at Tempsford, killing the last Danish king of East Anglia, and East Anglia, Essex and Derby fell; in 918 Leicester, Stamford and Nottingham submitted, and after Æthelflæd’s death that June Edward took direct rule of Mercia. In 920 at Bakewell the rulers of York, Bamburgh, the Scots and Strathclyde accepted Edward, by the Chronicle’s account, as “father and lord”, though historians doubt how much that meant.": "Les campagnes dans lesquelles Edward l’Ancien du Wessex et sa sœur Æthelflæd, lady of the Mercians, ont conquis les terres danoises de l’Angleterre au sud du Humber. Après qu’une armée de Saxon occidental et de Mercian a détruit une armée de raid danois nordumbrien à Tettenhall le 5 août 910, les deux constructions chaînes de burh fortifiés et poussé dans la Danelaw. En 917, les Anglais s’emparèrent du fort danois de Tempsford, tuant le dernier roi danois d’East Anglia, et East Anglia, Essex et Derby tombaient ; en 918 Leicester, Stamford et Nottingham se présentèrent, et après la mort de Æthelflæd. En 920 à Bakewell, les dirigeants de York, Bamburgh, les Écossais et Strathclyde acceptèrent Edward, par le récit Chronicle, comme le père et le lord, bien que les historiens doutent de ce que cela signifiait."
"The main source is the Anglo-Saxon Chronicle, including a separate Mercian Register that records Æthelflæd’s campaigns. Whether Lincoln submitted in 918 is uncertain.": "La source principale est la Chronique anglo-saxonne, y compris un registre Mercian distinct qui enregistre les campagnes Æthelflæd. Si Lincoln soumis en 918 est incertain."
