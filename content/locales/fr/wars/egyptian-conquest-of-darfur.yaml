# French translations of the catalogue text (wave 12); step bodies follow later.
Egyptian conquest of Darfur: Conquête égyptienne du Darfour
? The end of the independent Keira sultanate of Darfur at the hands of al-Zubayr Rahma Mansur, a Ja’ali merchant prince from the Nile who had built a private empire of trading and slave-raiding stations (zaribas) in Bahr el-Ghazal, and of the Egyptian government of Sudan. The sultans of Darfur controlled the trade routes north from Bahr el-Ghazal, and quarrels over caravans and a grain embargo led al-Zubayr to fight the Rizeigat Baggara, Darfur’s clients, and to occupy Shakka in August 1873. Khedive Ismail made him governor of Shakka and Bahr el-Ghazal in November 1873, and in 1874 his army of slave riflemen (bazinqir) invaded Darfur from the south while the governor-general Ismail Ayyub Pasha advanced from Kordofan. On 25 October 1874 (23 or 30 October in other accounts) Sultan Ibrahim Qarad was defeated and killed at Manawashi, south of El Fasher; al-Zubayr entered El Fasher on 2 November and Ismail Ayyub two days later. Darfur became an Egyptian province, but members of the Keira family led resistance from Jebel Marra for years. Al-Zubayr went to Cairo in 1875 to press his claims and was not allowed to return; his son Sulayman was killed after a revolt in 1879, and his lieutenant Rabih az-Zubayr went west to found his own state. Egyptian rule in Darfur ended with the Mahdist rising in 1883.
: La fin du sultanat indépendant des Keira au Darfour, abattu par al-Zubayr Rahma Mansur, prince marchand ja’ali originaire du Nil qui s’était bâti un empire privé de comptoirs commerciaux et de postes de razzia esclavagiste (zaribas) dans le Bahr el-Ghazal, et par le gouvernement égyptien du Soudan. Les sultans du Darfour contrôlaient les routes commerciales qui menaient vers le nord depuis le Bahr el-Ghazal ; des querelles au sujet des caravanes et un embargo sur les grains conduisirent al-Zubayr à combattre les Rizeigat, des Baggara clients du Darfour, et à occuper Shakka en août 1873. Le khédive Ismaïl le nomma gouverneur de Shakka et du Bahr el-Ghazal en novembre 1873 et, en 1874, son armée de fusiliers esclaves (bazinqir) envahit le Darfour par le sud tandis que le gouverneur général Ismail Ayyub Pacha avançait depuis le Kordofan. Le 25 octobre 1874 (le 23 ou le 30 octobre selon d’autres récits), le sultan Ibrahim Qarad fut vaincu et tué à Manawashi, au sud d’El Fasher ; al-Zubayr entra à El Fasher le 2 novembre et Ismail Ayyub deux jours plus tard. Le Darfour devint une province égyptienne, mais des membres de la famille Keira menèrent pendant des années la résistance depuis le djebel Marra. Al-Zubayr se rendit au Caire en 1875 pour faire valoir ses prétentions et ne fut pas autorisé à repartir ; son fils Sulayman fut tué après une révolte en 1879, et son lieutenant Rabih az-Zubayr (Rabah) partit vers l’ouest fonder son propre État. La domination égyptienne au Darfour prit fin avec le soulèvement mahdiste, en 1883.
