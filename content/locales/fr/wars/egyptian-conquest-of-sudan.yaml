# French translations of the catalogue text (wave 12); step bodies follow later.
Egyptian conquest of Sudan: Conquête égyptienne du Soudan
"The conquest of the Nile valley south of Egypt and of Kordofan by the armies of Muhammad Ali, the Ottoman governor of Egypt, which began sixty years of Turco-Egyptian rule, the Turkiyya. Muhammad Ali wanted slaves to build a new army and hoped to find gold. In 1820 his son Ismail Kamil Pasha led about 4,000 men up the Nile, defeated the Shayqiyya at Korti and received the submission of Berber and Shendi; on 14 June 1821 the last Funj sultan, Badi VII, surrendered Sennar. A second army under the defterdar Muhammad Bey Khusraw took Kordofan from the Sultanate of Darfur after a battle at Bara. Heavy taxes and demands for slaves provoked a rising: in late 1822 Mek Nimr of the Ja’aliyyin had Ismail and his staff burned to death at Shendi, and the defterdar’s reprisals killed some 30,000 people. Tens of thousands of Sudanese were marched north as slaves for the army, most of whom died. Khartoum, at the meeting of the Blue and White Niles, became the seat of the new government.": "La conquête de la vallée du Nil au sud de l’Égypte et du Kordofan par les armées de Méhémet Ali, gouverneur ottoman de l’Égypte, qui ouvrit soixante ans de domination turco-égyptienne, la Turkiyya. Méhémet Ali voulait des esclaves pour bâtir une nouvelle armée et espérait trouver de l’or. En 1820, son fils Ismaïl Kamil Pacha remonta le Nil avec environ 4 000 hommes, battit les Shayqiyya à Korti et reçut la soumission de Berber et de Shendi ; le 14 juin 1821, le dernier sultan founj, Badi VII, livra Sennar. Une seconde armée, sous les ordres du defterdar Muhammad Bey Khusraw, enleva le Kordofan au sultanat du Darfour après une bataille à Bara. Le poids des impôts et les exigences en esclaves provoquèrent un soulèvement : fin 1822, Mek Nimr, des Ja’aliyyin, fit brûler vifs Ismaïl et son état-major à Shendi, et les représailles du defterdar firent quelque 30 000 morts. Des dizaines de milliers de Soudanais furent emmenés vers le nord comme esclaves pour l’armée ; la plupart d’entre eux moururent. Khartoum, au confluent du Nil Bleu et du Nil Blanc, devint le siège du nouveau gouvernement."
