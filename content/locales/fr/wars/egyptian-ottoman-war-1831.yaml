"November 1832 – July 1833": "novembre 1832 – juillet 1833"
"Sultan Mahmud II raised a new army of more than 50,000 men under the grand vizier, Reşid Mehmed Pasha. Ibrahim crossed the Taurus and entered Konya unopposed in November. On 21 December 1832, in thick fog on the plain outside the town, his smaller army found a gap in the Ottoman line and broke it; the grand vizier, riding forward to rally his left wing, was taken prisoner. The Egyptians lost fewer than 800 men, the Ottomans about 3,000 dead, many prisoners and much of their artillery. No army now stood between Ibrahim and Constantinople, and by February 1833 he was at Kütahya.": "Le sultan Mahmud II a élevé une nouvelle armée de plus de 50 000 hommes sous le grand vizir, Reşid Mehmed Pasha. Ibrahim a traversé le Taureau et est entré Konya sans opposition en novembre. Le 21 décembre 1832, dans un épais brouillard sur la plaine à l’extérieur de la ville, sa petite armée a trouvé un écart dans la ligne ottomane et l’a brisé ; le grand vizier, se dirigeant vers l’avant pour rallier son aile gauche, a été fait prisonnier. Les Egyptiens ont perdu moins de 800 hommes, les Ottomans environ 3000 morts, beaucoup de prisonniers et une grande partie de leur artillerie. Aucune armée n’était entre Ibrahim et Constantinople, et en février 1833 il était à Kütahya."
"Turned down by Britain and France, the Sultan accepted help from Russia. A Russian squadron anchored in the Bosporus in February, and Russian troops, by various estimates from 18,000 to 40,000 men, landed on its Asian shore at Hünkâr İskelesi. Alarmed, Britain and France pressed both sides to settle. In May 1833 the Sultan confirmed Muhammad Ali as governor of Egypt and Crete and gave him the provinces of Syria, with Adana for Ibrahim, and the Egyptian army withdrew behind the Taurus. On 8 July Russia and the Ottomans signed the Treaty of Hünkâr İskelesi, a defensive alliance whose secret article alarmed Britain. Egyptian conscription and taxes soon provoked risings in Syria, among them the Palestinian peasants’ revolt of 1834.": "Un escadron russe ancré dans le Bospore en février, et les troupes russes, selon diverses estimations de 18 000 à 40 000 hommes, débarquèrent sur sa rive asiatique à Hünkâr İskellesi. Alarmée, la Grande-Bretagne et la France pressèrent les deux camps pour s’installer. En mai 1833, le sultan confirma Muhammad Ali comme gouverneur de l’Egypte et de la Crète et lui donna les provinces de Syrie, avec Adana pour Ibrahim, et l’armée égyptienne se retira derrière le Taureau. Le 8 juillet, la Russie et les Ottomans signèrent le traité de Hünkâr Iskellesi, une alliance défensive dont l’article secret alarmait la Grande-Bretagne."
