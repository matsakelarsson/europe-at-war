"Acre and the conquest of Syria": "Acre et conquête de la Syrie"
"October 1831 – August 1832": "octobre 1831 – août 1832"
"Muhammad Ali had sent his army and fleet to fight the Greek revolt for the Sultan, and had received only Crete for it. He wanted Syria, with its timber, revenues and men. His pretext was a quarrel with Abdullah Pasha, governor of Acre, who had taken in thousands of Egyptian peasants fleeing conscription and taxes. At the end of October 1831 an army of about 30,000 men marched across Sinai, while Ibrahim Pasha sailed to Jaffa. Jaffa, Jerusalem, Sidon, Beirut and Tripoli submitted, and on 26 November Ibrahim laid siege to Acre, whose walls had defied Napoleon in 1799.": "Muhammad Ali avait envoyé son armée et sa flotte pour combattre la révolte grecque pour le Sultan, et n’avait reçu que la Crète pour elle. Il voulait la Syrie, avec ses bois, ses revenus et ses hommes. Son prétexte était une querelle avec Abdullah Pacha, gouverneur d’Acre, qui avait pris des milliers de paysans égyptiens fuyant la conscription et les impôts. Jaffa, Jérusalem, Sidon, Beyrouth et Tripoli ont soumis, et le 26 novembre Ibrahim a posé siège à Acre, dont les murs avaient défié Napoléon en 1799."
"Abdullah’s garrison beat off bombardments and assaults for six months, while the Sultan declared Muhammad Ali a rebel and gathered an army against him. On 27 May 1832 Ibrahim led the final storm in person; the ruined town was plundered and Abdullah was sent to Egypt as a prisoner. Damascus opened its gates in June. In July Ibrahim beat the Ottoman vanguard at Homs and took Aleppo, and at the end of the month he routed the main army of Ağa Hüseyin Pasha in the Belen pass above Alexandretta, then crossed into Cilicia and took Adana and Tarsus.": "La garnison d’Abdullah a battu les bombardements et les attaques pendant six mois, tandis que le Sultan a déclaré Muhammad Ali rebelle et réuni une armée contre lui. Le 27 mai 1832 Ibrahim a mené la dernière tempête en personne ; la ville ruinée a été pillée et Abdullah a été envoyé en Égypte comme prisonnier. Damas a ouvert ses portes en juin. En juillet, Ibrahim battit l’avant-garde ottomane à Homs et prit Alep, et, à la fin du mois, il roula l’armée principale d’Ağa Hüseyin Pasha dans le col de Belen au-dessus d’Alexandretta, puis traversa Cilicie pour prendre Adana et Tarse."
