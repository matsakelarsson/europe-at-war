# Some French text was translated automatically.
"Egyptian–Ottoman War of 1831–1833": "Égyptienne–Ottoman Guerre de 1831-1833"
"A war in which Muhammad Ali, the Ottoman governor of Egypt, sent his son Ibrahim Pasha to conquer Syria from the Sultan. Ibrahim took Acre and Damascus, beat the Ottoman armies at Homs, Belen and Konya and advanced to Kütahya, until Russian intervention and pressure from Britain and France brought a settlement in May 1833 that left Egypt ruling Syria and Adana under nominal Ottoman sovereignty.": "Une guerre dans laquelle Muhammad Ali, le gouverneur ottoman d’Égypte, envoya son fils Ibrahim Pacha pour conquérir la Syrie du Sultan. Ibrahim prit Acre et Damas, battit les armées ottomanes à Homs, Belen et Konya et progressa à Kütahya, jusqu’à ce que l’intervention russe et la pression de la Grande-Bretagne et de la France apportent un règlement en mai 1833 qui a laissé l’Egypte au pouvoir la Syrie et Adana sous la souveraineté nominale ottomane."
"Also called the First Syrian War or the First Turko-Egyptian War. Egypt was formally an Ottoman province, but Muhammad Ali ruled it as his own state, with an army and fleet trained on French lines.": "L’Égypte était officiellement une province ottomane, mais Muhammad Ali l’a gouverné comme son propre État, avec une armée et une flotte entraînées sur les lignes françaises."
"Accounts differ on the dates of several battles in 1832 and on the size of the armies; numbers given here are estimates.": "Les comptes diffèrent sur les dates de plusieurs batailles en 1832 et sur la taille des armées ; les chiffres donnés ici sont des estimations."
