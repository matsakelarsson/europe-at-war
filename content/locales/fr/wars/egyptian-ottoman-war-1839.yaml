"July 1840 – June 1841": "juillet 1840 – juin 1841"
"By the Convention of London of 15 July 1840 Britain, Austria, Prussia and Russia agreed with the Ottomans to offer Muhammad Ali hereditary rule of Egypt and lifelong rule of southern Syria if he accepted within ten days, and to force him out if he did not. Counting on France, which had been left out and talked of war, he refused. In Lebanon, Druze and Maronite mountaineers had already risen against Egyptian conscription and disarmament. In September British, Austrian and Ottoman ships under Admiral Robert Stopford bombarded Beirut and landed troops at Jounieh. Commodore Charles Napier took Sidon, the Egyptians abandoned Beirut on 3 October, and Ibrahim’s troops were beaten in the hills at Boharsef.": "Par la Convention de Londres du 15 juillet 1840, la Grande-Bretagne, l’Autriche, la Prusse et la Russie acceptèrent avec les Ottomans d’offrir à Muhammad Ali le pouvoir héréditaire de l’Égypte et le gouvernement permanent du sud de la Syrie s’il acceptait dans dix jours, et de le forcer s’il ne le faisait pas. Au Liban, des alpinistes druzes et maronites s’étaient déjà levés contre la conscription et le désarmement égyptiens. En septembre, des navires britanniques, autrichiens et ottomans sous les ordres de l’amiral Robert Stopford bombardèrent Beyrouth et débarquèrent à Jounieh. Le commodore Charles Napier prit Sidon, les Egyptiens abandonnèrent Beyrouth le 3 octobre et les troupes d’Ibrahim furent battues dans les collines de Boharsef."
"On 3 November the fleet bombarded Acre. A shell blew up the main magazine, killing about 1,100 men, and the garrison left that night; the British lost 18 killed. Napier sailed on to Alexandria and on 27 November, on his own authority, agreed a convention with Muhammad Ali. Ibrahim’s army marched back to Egypt through Syria that winter, losing many men. Firmans of 1841 gave Muhammad Ali and his heirs hereditary rule of Egypt under Ottoman sovereignty and limited his army to 18,000 men; he gave up Syria, Adana, Crete and the Hijaz and returned the Ottoman fleet.": "Le 3 novembre, la flotte bombarda Acre. Un obus fit exploser le magazine principal, tuant environ 1 100 hommes, et la garnison partit cette nuit-là ; les Britanniques perdirent 18 morts. Napier s’embarqua pour Alexandrie et, le 27 novembre, de son propre chef, accorda une convention avec Muhammad Ali. L’armée d’Ibrahim retourna en Égypte à travers la Syrie cet hiver, perdant de nombreux hommes. Firmans de 1841 donna à Muhammad Ali et à ses héritiers la domination héréditaire de l’Egypte sous souveraineté ottomane et limita son armée à 18 000 hommes ; il abandonna la Syrie, Adana, la Crète et le Hijaz et retourna la flotte ottomane."
