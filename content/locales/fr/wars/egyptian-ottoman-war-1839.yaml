"April – July 1839": "avril – juillet 1839"
"Neither side accepted the settlement of 1833 as final. Muhammad Ali wanted his rule over Egypt and Syria made hereditary and spoke openly of independence, while Mahmud II rebuilt his army with the help of Prussian officers, among them Captain Helmuth von Moltke, the future chief of the Prussian general staff. In April 1839 an Ottoman army under Hafiz Mehmed Pasha crossed the Euphrates at Birecik into Egyptian-held Syria. Ibrahim Pasha marched north from Aleppo to meet it, with the former French officer Soliman Pasha commanding his right wing.": "Aucune des parties n’a accepté le règlement de 1833 comme final. Muhammad Ali voulait son gouvernement sur l’Egypte et la Syrie fait héréditaire et parle ouvertement de l’indépendance, tandis que Mahmud II reconstruit son armée avec l’aide d’officiers prussiens, parmi lesquels le capitaine Helmuth von Moltke, le futur chef de l’état-major général prussien. En avril 1839, une armée ottomane sous Hafiz Mehmed Pacha traversa l’Euphrate de Birecik pour se rendre en Syrie contrôlée par l’Égypte. Ibrahim Pacha marcha au nord d’Alep pour la rencontrer avec l’ancien officier français Soliman Pacha qui commandait son aile droite."
"Hafiz had been ordered to wait in strong positions, and Moltke urged him to attack or move, but he did neither. Ibrahim marched round the Ottoman camp, forcing Hafiz to turn his army about overnight, and on 24 June near Nezib the Egyptian artillery and infantry broke it. The Ottomans fled, leaving their guns and thousands of prisoners. Mahmud II died on 1 July, leaving the throne to his 16-year-old son Abdülmecid I, and in July the Kapudan Pasha, Ahmed Fevzi, sailed the Ottoman fleet to Alexandria and handed it over to Muhammad Ali.": "Hafiz avait reçu l’ordre d’attendre dans des positions fortes, et Moltke le pressa d’attaquer ou de bouger, mais il ne fit rien. Ibrahim marcha autour du camp ottoman, forçant Hafiz à retourner son armée vers la nuit, et le 24 juin près de Nezib, l’artillerie et l’infanterie égyptiennes l’ont brisée. Mahmud II est mort le 1er juillet, laissant le trône à son fils Abdülmecid I, âgé de 16 ans, et en juillet le Kapudan Pacha, Ahmed Fevzi, a navigué la flotte ottomane à Alexandrie et l’a remis à Muhammad Ali."
