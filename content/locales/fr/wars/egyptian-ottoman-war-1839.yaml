# Some French text was translated automatically.
"Egyptian–Ottoman War of 1839–1841": "Guerre Égyptienne–Ottomane de 1839 à 1841"
"A second war between Muhammad Ali’s Egypt and the Ottoman Empire, opened by Sultan Mahmud II to win back Syria. Ibrahim Pasha routed the Ottoman army at Nezib in 1839 and the Ottoman fleet went over to Egypt, but Britain, Austria, Prussia and Russia took the Sultan’s side; British and Austrian ships took Beirut, Sidon and Acre in 1840, and Muhammad Ali gave up Syria, Adana and Crete in return for hereditary rule of Egypt.": "Une seconde guerre entre l’Egypte et l’Empire ottoman, ouverte par le Sultan Mahmud II pour reconquérir la Syrie. Ibrahim Pacha a fait route vers l’armée ottomane à Nezib en 1839 et la flotte ottomane est passée en Égypte, mais la Grande-Bretagne, l’Autriche, la Prusse et la Russie ont pris le parti du Sultan ; les navires britanniques et autrichiens ont pris Beyrouth, Sidon et Acre en 1840, et Muhammad Ali a abandonné la Syrie, Adana et Crète en échange de la domination héréditaire de l’Égypte."
"Also called the Second Syrian War or the Second Turko-Egyptian War. Prussia and Russia signed the Convention of London of 1840 but took no part in the fighting; France, which had backed Muhammad Ali, was left out of it, and the crisis brought it close to war with the other powers.": "Aussi appelé la Deuxième guerre syrienne ou la Seconde guerre turkmène-égyptienne. La Prusse et la Russie signent la Convention de Londres de 1840 mais ne prennent pas part aux combats ; la France, qui avait soutenu Muhammad Ali, en est sortie, et la crise l’a rapprochée de la guerre avec les autres puissances."
