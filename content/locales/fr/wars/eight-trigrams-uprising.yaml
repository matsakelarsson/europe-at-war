# French translations of the catalogue text (wave 9); step bodies follow later.
Eight Trigrams uprising: Soulèvement des Huit Trigrammes
? A millenarian rising in northern China by the Eight Trigrams, a network of sects of the Heavenly Principle (Tianli) teaching, related to the White Lotus tradition, whose followers expected the Eternal Venerable Mother to bring the end of the age. Its leaders, Lin Qing near Beijing and Li Wencheng in Hua county in northern Henan, planned simultaneous risings for the 15th day of the ninth lunar month of 1813 (8 October), when the Jiaqing Emperor was due back from his autumn hunt. Li Wencheng was arrested beforehand, and on 30 September his followers rose early, stormed Hua county town and freed him; sects in southern Zhili and Shandong took Caoxian and Dingtao. On 8 October some 80 of Lin Qing’s followers, guided by sympathetic palace eunuchs, broke into the Forbidden City in Beijing; they were driven back by guards and princes, among them the future Daoguang Emperor, Mianning, who shot two of them with a musket, and Lin Qing was captured and executed. Qing armies under Nayancheng retook the towns in Shandong and Zhili, Li Wencheng burned himself to death when surrounded at Sizhai in Hui county, and Hua county fell after a siege on 1 January 1814. More than 20,000 sect members were killed or executed, and some 70,000 people are estimated to have died in the disorder.
: Un soulèvement millénariste dans le nord de la Chine, mené par les Huit Trigrammes, un réseau de sectes de l’enseignement du Principe céleste (Tianli), apparenté à la tradition du Lotus blanc, dont les adeptes attendaient de la Vénérable Mère éternelle qu’elle amène la fin des temps. Ses chefs, Lin Qing près de Pékin et Li Wencheng dans le district de Hua, dans le nord du Henan, avaient prévu des soulèvements simultanés pour le 15e jour du neuvième mois lunaire de 1813 (8 octobre), date à laquelle l’empereur Jiaqing devait rentrer de sa chasse d’automne. Li Wencheng fut arrêté auparavant et, le 30 septembre, ses partisans se soulevèrent avant la date prévue, prirent d’assaut le chef-lieu du district de Hua et le libérèrent ; des sectes du sud du Zhili et du Shandong prirent Caoxian et Dingtao. Le 8 octobre, quelque 80 partisans de Lin Qing, guidés par des eunuques du palais acquis à leur cause, pénétrèrent dans la Cité interdite à Pékin ; ils furent repoussés par les gardes et des princes, parmi lesquels le futur empereur Daoguang, Mianning, qui en abattit deux au mousquet, et Lin Qing fut capturé et exécuté. Les armées Qing commandées par Nayancheng reprirent les villes du Shandong et du Zhili, Li Wencheng se donna la mort par le feu lorsqu’il fut encerclé à Sizhai, dans le district de Hui, et le chef-lieu du district de Hua tomba après un siège le 1er janvier 1814. Plus de 20 000 membres des sectes furent tués ou exécutés, et l’on estime à quelque 70 000 le nombre de personnes mortes dans ces troubles.
