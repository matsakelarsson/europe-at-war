# Some French text was translated automatically.
"Eighth Crusade": "Huitième croisade"
"The second crusade of Louis IX of France, which was diverted to Tunis, perhaps in the hope of converting its Hafsid ruler, of gaining a base against Mamluk Egypt, or at the urging of Louis’s brother Charles of Anjou, king of Sicily. The army landed near the ruins of Carthage in July 1270 and was struck by disease, and Louis died in his camp on 25 August. Charles arrived the same day, and after some fighting the crusaders made a treaty with the emir Muhammad al-Mustansir, who paid an indemnity and tribute, and sailed home in November.": "La deuxième croisade de Louis IX de France, qui a été détournée vers Tunis, peut-être dans l’espoir de convertir son dirigeant hafside, d’obtenir une base contre l’Egypte mamelouke, ou à la demande du frère de Louis Charles d’Anjou, roi de Sicile. L’armée atterrit près des ruines de Carthage en juillet 1270 et fut frappée par la maladie, et Louis mourut dans son camp le 25 août. Charles arriva le même jour, et après quelques combats les croisés firent un traité avec l’émir Muhammad al-Mustansir, qui paya une indemnité et un tribut, et rentra chez lui en novembre."
"Louis’s son and heir Philip III, who was with the army, was proclaimed king at Carthage. Louis was canonised in 1297. The Lord Edward of England arrived after the treaty and sailed on to Acre; his expedition is counted as the Ninth Crusade.": "Le fils et héritier de Louis, Philippe III, qui était avec l’armée, fut proclamé roi à Carthage. Louis fut canonisé en 1297. Lord Edward d’Angleterre arriva après le traité et s’embarqua pour Acre ; son expédition est comptée comme la neuvième croisade."
