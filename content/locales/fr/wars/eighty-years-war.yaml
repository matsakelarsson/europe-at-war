"1582–1585": "1582–1585"
"With Spanish troops back from 1582, Parma took the rebel towns of Flanders and Brabant one by one, by siege, blockade and generous terms. The States had invited Francis, Duke of Anjou, brother of the French king, to be their sovereign, but his attempt to seize Antwerp by force, the “French Fury” of 17 January 1583, failed and discredited him. On 10 July 1584 William of Orange was shot dead in his house in Delft by Balthasar Gérard, a Catholic who hoped for the reward Philip had offered. Ypres, Bruges and Ghent fell to Parma in 1584, Brussels and Mechelen in 1585.": "Avec les troupes espagnoles de retour à partir de 1582, Parma prit les villes rebelles de Flandre et Brabant une par une, par siège, blocus et conditions généreuses. Les États avaient invité François, duc d’Anjou, frère du roi français, à être leur souverain, mais sa tentative de saisir Anvers par la force, la Fury française du 17 janvier 1583, l’a échoué et discrédité. Le 10 juillet 1584, William d’Orange fut abattu dans sa maison de Delft par Balthasar Gérard, un catholique qui espérait recevoir la récompense offerte par Philippe. Ypres, Bruges et Gand tombaient à Parme en 1584, Bruxelles et Mechelen en 1585."
"Parma cut Antwerp off from the sea with a fortified bridge of boats across the Scheldt. In April 1585 the defenders sent fireships packed with explosives, the “hellburners”, against it, killing hundreds of soldiers, but the bridge was repaired, and the city surrendered on 17 August. Protestants were given four years to leave, and of about 100,000 inhabitants only some 40,000 remained; many merchants and craftsmen moved north to Amsterdam and Middelburg. Alarmed, Elizabeth I of England agreed in the Treaty of Nonsuch to send several thousand soldiers under the Earl of Leicester, bringing England openly into the war with Spain.": "Parma coupa Anvers de la mer avec un pont fortifié de bateaux en travers de l’Escaut. En avril 1585, les défenseurs envoyaient des navires de feu remplis d’explosifs, les « Hellburners » contre elle, tuant des centaines de soldats, mais le pont fut réparé, et la ville se rendit le 17 août. Les protestants furent donnés quatre ans à partir, et d’environ 100 000 habitants seulement il resta environ 40 000 ; de nombreux marchands et artisans s’installèrent au nord à Amsterdam et Middelburg. Alarmée, Elizabeth Ier d’Angleterre a accepté dans le traité de Nonsuch d’envoyer plusieurs milliers de soldats sous le comte de Leicester, faisant entrer l’Angleterre ouvertement dans la guerre avec l’Espagne."
"William of Orange assassinated": "Guillaume d’Orange assassiné"
"10 July 1584, Delft": "10 juillet 1584, Delft"
"Fall of Antwerp": "Chute d’Anvers"
"17 August 1585": "17 août 1585"
"Treaty of Nonsuch": "Traité de non-sommeil"
"August 1585, England allies with the States": "Août 1585, Alliés de l’Angleterre avec les Etats"
"Delft": "Delft"
"10 July 1584": "10 juillet 1584"
"Balthasar Gérard shot William on the stairs of his residence, the Prinsenhof. The bullet holes can still be seen in the wall.": "Balthasar Gérard a tiré sur William dans les escaliers de sa résidence, le Prinsenhof. Les trous de balles peuvent encore être vus dans le mur."
"Ghent": "Gand"
"17 September 1584": "17 septembre 1584"
"The Calvinist city, heart of the revolt in Flanders, surrendered to Parma after a long blockade.": "La ville calviniste, cœur de la révolte en Flandre, s’est rendue à Parme après un long blocus."
"10 March 1585": "10 mars 1585"
"The hungry city surrendered on terms after a blockade of several months.": "La ville affamée s’est rendue à terme après un blocus de plusieurs mois."
"July 1584 – 17 August 1585": "juillet 1584 – 17 août 1585"
"Parma’s bridge across the Scheldt cut the city off from the sea. Its surrender ended Antwerp’s golden age.": "Le pont de Parma, qui traverse l’Escaut, coupe la ville de la mer. Sa capitulation met fin à l’âge d’or d’Anvers."
"Parma": "Parme"
"Leicester": "Leicester"
"Maurice’s campaigns and Nieuwpoort": "Les campagnes de Maurice et Nieuwpoort"
"1588–1600": "1588–1600"
"In 1588 Parma’s army waited on the Flemish coast to cross to England, but the Spanish Armada, beaten off Gravelines and scattered by storms, never collected it, and Dutch flyboats blockaded the shallow coast. Philip then sent Parma into France against Henry IV, which gave the Dutch a breathing space. William’s son Maurice of Nassau and his cousin William Louis drilled their small, regularly paid army in volley fire and siege work. In March 1590 soldiers hidden in a peat barge took Breda; Zutphen, Deventer and Nijmegen fell in 1591, Steenwijk and Coevorden in 1592, and Groningen in July 1594.": "En 1588, l’armée de Parme attendait sur la côte flamande pour traverser l’Angleterre, mais l’Armada espagnole, battue au large de Gravelines et dispersée par les tempêtes, ne l’a jamais recueillie, et les bateaux à voile néerlandais ont bloqué la côte peu profonde. Philip a ensuite envoyé Parme en France contre Henry IV, qui a donné aux Hollandais un espace de respiration. En mars 1590, des soldats cachés dans une barge tourbée emmenèrent Breda ; Zutphen, Deventer et Nimègue tombaient en 1591, Steenwijk et Coevorden en 1592, et Groningue en juillet 1594."
"In January 1597 Maurice’s cavalry routed a Spanish force at Turnhout, and that summer he took the towns along the eastern border, from Rheinberg to Lingen. In 1598, shortly before his death, Philip II handed the Netherlands to his daughter Isabella and her husband, Archduke Albert. In 1600 the States General sent Maurice into Flanders to take Dunkirk, the base of the privateers who preyed on Dutch shipping. Albert caught him on the beach at Nieuwpoort on 2 July; the Dutch and English won a hard-fought battle, but Maurice had to withdraw, and Dunkirk was never taken.": "En janvier 1597, la cavalerie de Maurice dirigea une force espagnole à Turnhout, et cet été-là il prit les villes le long de la frontière orientale, de Rheinberg à Lingen. En 1598, peu avant sa mort, Philippe II livra les Pays-Bas à sa fille Isabella et son mari, l’archiduc Albert. En 1600, le général des États envoya Maurice en Flandre pour prendre Dunkerque, la base des corsaires qui s’attaquaient à la navigation hollandaise. Albert l’attrape sur la plage de Nieuwpoort le 2 juillet ; les Hollandais et les Anglais remportent une bataille acharnée, mais Maurice doit se retirer, et Dunkerque n’est jamais pris."
"Capture of Breda": "Capture de Breda"
"4 March 1590": "4 mars 1590"
"Battle of Turnhout": "Bataille de Turnhout"
"24 January 1597, Dutch victory": "24 janvier 1597, victoire néerlandaise"
"Battle of Nieuwpoort": "Bataille de Nieuwpoort"
"2 July 1600, Dutch and English victory": "2 juillet 1600, victoire néerlandaise et anglaise"
"Battle of Gravelines": "Bataille de Gravelines"
"8 August 1588": "8 août 1588"
"After fireships drove the Armada from its anchorage off Calais, the English fleet broke its formation. The Spanish ships fled north around Scotland and Ireland, losing many in storms.": "Après que les navires de pompiers aient chassé l’Armada de son mouillage au large de Calais, la flotte anglaise a rompu sa formation."
"Breda": "Breda"
"About 70 soldiers hidden under the turf in a peat barge were taken into the castle and opened it to Maurice.": "Environ 70 soldats cachés sous le gazon dans une barge tourbée ont été emmenés dans le château et l’ont ouvert à Maurice."
"Nijmegen": "Nimègue"
"October 1591": "octobre 1591"
"Maurice took the city after a short bombardment, ending a year of rapid conquests along the rivers.": "Maurice a pris la ville après un court bombardement, mettant fin à une année de conquêtes rapides le long des rivières."
"Coevorden": "Coevorden"
"The fortress, key to the north-east, surrendered to Maurice in September.": "La forteresse, clé du nord-est, se rendit à Maurice en septembre."
"Groningen": "Grossine"
"May–July 1594": "mai–juillet 1594"
"Its capture brought the city and its countryside into the Union of Utrecht and secured the north-east for the Republic.": "Sa capture a amené la ville et sa campagne dans l’Union d’Utrecht et a sécurisé le nord-est pour la République."
"24 January 1597": "24 janvier 1597"
"Maurice’s cavalry caught a retreating Spanish army on the heath and routed it.": "La cavalerie de Maurice a pris une armée espagnole en retraite sur la lande et l’a acheminée."
"2 July 1600": "2 juillet 1600"
"Fought on the beach and in the dunes as the tide went out. Albert was beaten, but Maurice’s expedition had failed.": "Frappé sur la plage et dans les dunes à mesure que la marée sortait. Albert a été battu, mais l’expédition de Maurice avait échoué."
"Maurice": "Maurice"
"Maurice, 1591–1594": "Maurice, 1591-1594"
"Ostend and the Twelve Years’ Truce": "Ostende et les douze ans de la trêve"
"1601–1609": "1601–1609"
"The siege of Ostend, the last rebel foothold on the Flemish coast, began on 5 July 1601 and became one of the longest and bloodiest of the age. Supplied by sea, the garrison was relieved in turns while the besiegers dug and stormed in the dunes; more than 100,000 people may have been killed, wounded or died of disease. The Genoese commander Ambrogio Spinola finally took the ruins on 20 September 1604, but Maurice had meanwhile captured Sluis, a better harbour. England, under James I, had made peace with Spain in the Treaty of London that August.": "Le siège d’Ostende, dernier bastion rebelle sur la côte flamande, a commencé le 5 juillet 1601 et est devenu l’un des plus longs et les plus sanglants de l’âge. Appuyé par la mer, la garnison a été soulagée à tour de rôle pendant que les assiégeurs creusaient et sillonnaient les dunes ; plus de 100 000 personnes ont peut-être été tuées, blessées ou mortes de maladie. Le commandant génois Ambrogio Spinola a finalement pris les ruines le 20 septembre 1604, mais Maurice avait entre-temps capturé Sluis, un meilleur port. L’Angleterre, sous James Ier, avait fait la paix avec l’Espagne dans le traité de Londres ce mois d’août."
"Spinola carried the war across the great rivers in 1605–1606, taking Oldenzaal, Lingen, Groenlo and Rheinberg, but Spain’s money ran out. In April 1607 a Dutch fleet under Jacob van Heemskerk destroyed a Spanish fleet in the bay of Gibraltar, and that autumn the Spanish crown suspended its payments. On 9 April 1609 the two sides signed the Twelve Years’ Truce in Antwerp. Spain treated the United Provinces as free states over which it claimed no authority, though it did not formally recognise their independence, and each side kept what it held.": "En avril 1607, une flotte néerlandaise sous Jacob van Heemskerk détruisit une flotte espagnole dans la baie de Gibraltar, et cet automne la couronne espagnole suspendit ses paiements. Le 9 avril 1609, les deux parties signèrent la trêve des Douze ans à Anvers. L’Espagne a traité les Provinces unies comme des États libres sur lesquels elle n’a pas revendiqué l’autorité, bien qu’elle ne reconnaisse pas formellement leur indépendance, et chaque partie a conservé ce qu’elle détenait."
"Siege of Ostend": "Siège d’Ostende"
"5 July 1601 – 20 September 1604": "5 juillet 1601 – 20 septembre 1604"
"Battle of Gibraltar": "Bataille de Gibraltar"
"25 April 1607, Dutch naval victory": "25 avril 1607, victoire navale néerlandaise"
"Twelve Years’ Truce": "Trêve de douze ans"
"signed 9 April 1609 at Antwerp": "signé le 9 avril 1609 à Anvers"
"Ostend": "Ostension"
"1601–1604": "1601–1604"
"Spinola took the ruined town after more than three years. Some estimates put the dead and wounded on both sides at over 100,000.": "Spinola a pris la ville ruinée après plus de trois ans. Certaines estimations ont mis les morts et les blessés des deux côtés à plus de 100 000."
"Sluis": "Sluis"
"May–August 1604": "mai–août 1604"
"Maurice took the port in August, a month before Ostend fell, as a better base on the Flemish coast.": "Maurice a pris le port en août, un mois avant la chute d’Ostende, comme une meilleure base sur la côte flamande."
"Lingen": "Lingen"
"Spinola’s first campaign across the rivers took Oldenzaal and the fortress of Lingen, which Maurice had captured in 1597.": "La première campagne de Spinola à travers les rivières a pris Oldenzaal et la forteresse de Lingen, que Maurice avait capturé en 1597."
"Groenlo": "Groenlo"
"August 1606": "août 1606"
"Spinola took the border fortress; Maurice’s attempt to win it back that autumn failed.": "Spinola a pris la forteresse frontalière ; Maurices essayer de la récupérer cet automne a échoué."
"Rheinberg": "Rheinberg"
"Spinola took the fortress on the Rhine in the autumn, his last success before the truce.": "Spinola prit la forteresse sur le Rhin à l’automne, son dernier succès avant la trêve."
"9 April 1609": "9 avril 1609"
"Signed in Antwerp, the truce ended the fighting for twelve years and left each side what it held.": "Signée à Anvers, la trêve a mis fin aux combats pendant douze ans et a laissé de chaque côté ce qu’elle tenait."
"Spinola": "Spinola"
"1621–1625": "1621–1625"
"The truce expired in April 1621, as the Thirty Years’ War was spreading through Germany. Spain’s chief minister, the Count-Duke of Olivares, hoped economic war would bring better terms. Dutch ships were banned from Spanish ports, and privateers from Dunkirk took hundreds of Dutch merchantmen and fishing boats. On land Spain took the Dutch-held fortress of Jülich in February 1622, but Spinola failed before Bergen op Zoom, which the Dutch supplied by water and relieved in October.": "La trêve a expiré en avril 1621, alors que la guerre de Trente Ans se répandait à travers l’Allemagne. Le ministre principal de l’Espagne, le comte-duc d’Olivares, espérait que la guerre économique apporterait de meilleures conditions. Sur terre, l’Espagne prit la forteresse hollandaise de Jülich en février 1622, mais Spinola échoua avant Bergen op Zoom, que les Hollandais approvisionnèrent en eau et soulagèrent en octobre."
"In August 1624 Spinola laid siege to Breda, the Nassau family’s town in Brabant, surrounding it with lines too strong to break. Maurice died in The Hague on 23 April 1625, aged 57, while his armies tried in vain to relieve it, and his half-brother Frederick Henry succeeded him. Breda surrendered on 5 June 1625 after eleven months, and its garrison marched out with full honours, a scene Diego Velázquez painted about ten years later as The Surrender of Breda. It was the high point of Spanish fortunes in the later war.": "En août 1624 Spinola assiégea Breda, la ville de Nassau à Brabant, qui l’entourait de lignes trop fortes pour se briser. Maurice mourut à La Haye le 23 avril 1625, âgé de 57 ans, tandis que ses armées essayèrent en vain de la soulager, et son demi-frère Frederick Henry lui succéda. Breda s’est rendu le 5 juin 1625 après onze mois, et sa garnison a marché avec tous les honneurs, une scène Diego Velázquez peint environ dix ans plus tard sous le nom de La Rémission de Breda. C’était le point culminant des fortunes espagnoles dans la guerre ultérieure."
"Siege of Bergen op Zoom": "Siège de Bergen op Zoom"
"July–October 1622, relieved": "Juillet–octobre 1622, relevé"
"Siege of Breda": "Siège de Breda"
"28 August 1624 – 5 June 1625": "28 août 1624 – 5 juin 1625"
"Maurice of Nassau dies": "Maurice de Nassau meurt"
"23 April 1625": "23 avril 1625"
"Jülich": "Jülich"
"September 1621 – February 1622": "septembre 1621 – février 1622"
"Spanish troops under Hendrik van den Bergh took the Dutch-garrisoned fortress after a five-month siege.": "Les troupes espagnoles sous Hendrik van den Bergh ont pris la forteresse garrisonnée aux Pays-Bas après un siège de cinq mois."
"Bergen op Zoom": "Bergen op Zoom"
"July–October 1622": "juillet–octobre 1622"
"Spinola’s siege failed when the town was supplied by water and a relief army arrived in October.": "Le siège de Spinola a échoué lorsque la ville a été alimentée par l’eau et une armée de secours est arrivée en octobre."
"August 1624 – June 1625": "août 1624 – juin 1625"
"Spinola starved the town into surrender. The governor, Justin of Nassau, handed over the keys outside the walls.": "Spinola a laissé tomber la ville, et le gouverneur Justin de Nassau a remis les clés devant les murs."
"The Hague": "La Haye"
"Maurice of Nassau died, and Frederick Henry became captain-general and stadtholder of most of the provinces.": "Maurice de Nassau mourut, et Frederick Henry devint capitaine général et propriétaire de la plupart des provinces."
"’s-Hertogenbosch and Maastricht": "Le Conseil de l’Europe"
"1626–1633": "1626–1633"
"Frederick Henry, who earned the name “taker of towns”, began with Groenlo in 1627. In September 1628 Piet Hein of the Dutch West India Company captured the Spanish silver fleet off Matanzas in Cuba, and the booty helped pay for the next campaign. In April 1629 Frederick Henry surrounded ’s-Hertogenbosch, a fortress city guarded by marshes, with miles of siege lines, and drained the water around it. A Spanish and imperial army struck into the Veluwe and took Amersfoort in August, but the Dutch surprised Wesel, its supply base, on 19 August, and ’s-Hertogenbosch surrendered on 14 September.": "Frederick Henry, qui a gagné le nom de \"taker of towns\", a commencé avec Groenlo en 1627. En septembre 1628 Piet Hein de la Dutch West India Company a capturé la flotte d’argent espagnole au large de Matanzas à Cuba, et le butin a aidé à payer pour la prochaine campagne. En avril 1629, Frederick Henry encercle -Hertogenbosch, une ville forteresse gardée par les marais, avec des kilomètres de lignes de siège, et draine l’eau autour. Une armée espagnole et impériale frappe dans le Veluwe et prend Amersfoort en août, mais les Hollandais surprennent Wesel, sa base d’approvisionnement, le 19 août, et -Hertogenbosch se rend le 14 septembre."
"In September 1631 a Spanish flotilla carrying troops to invade Zeeland was destroyed among the islands at the Slaak. The next summer Frederick Henry marched up the Maas, taking Venlo and Roermond and, on 22 August 1632, Maastricht, while nobles in the Spanish Netherlands plotted with him. The loyal provinces called their own States General and opened peace talks, which failed in 1633. Frederick Henry took Rheinberg that year, and the war in the north settled into a stalemate along the rivers.": "En septembre 1631, une flottille espagnole transportant des troupes pour envahir la Zélande fut détruite parmi les îles de Slaak. L’été suivant, Frederick Henry marcha vers la Maas, prenant Venlo et Roermond et, le 22 août 1632, Maastricht, tandis que des nobles aux Pays-Bas espagnols complotèrent avec lui. Frederick Henry a pris Rheinberg cette année-là, et la guerre dans le nord s’est installée dans une impasse le long des rivières."
"Siege of ’s-Hertogenbosch": "Siège d’Hertogenbosch"
"30 April – 14 September 1629": "30 avril – 14 septembre 1629"
"Battle of the Slaak": "Bataille des Slaaks"
"12–13 September 1631, Dutch victory": "12-13 septembre 1631, victoire néerlandaise"
"Maastricht taken": "Maastricht pris"
"22 August 1632": "22 août 1632"
"July–August 1627": "juillet–août 1627"
"Frederick Henry’s first great siege won back the fortress Spinola had taken in 1606.": "Le premier grand siège de Frederick Henry a remporté la forteresse Spinola en 1606."
"’s-Hertogenbosch": "C-Hertogenbosch"
"April–September 1629": "avril–septembre 1629"
"Frederick Henry dammed the rivers, drained the marshes with mills and took the city after a five-month siege.": "Frederick Henry a démêlé les rivières, égoutté les marais avec des moulins et pris la ville après un siège de cinq mois."
"Amersfoort": "Amersfoort"
"August 1629": "août 1629"
"A Spanish and imperial army under Hendrik van den Bergh and Ernesto Montecuccoli crossed the IJssel and took the town, but turned back when Wesel fell.": "Une armée espagnole et impériale sous Hendrik van den Bergh et Ernesto Montecuccoli traversa l’IJssel et prit la ville, mais retourna à la chute de Wesel."
"Wesel": "Wesel"
"19 August 1629": "19 août 1629"
"A surprise attack at night took the Spanish supply base on the Rhine.": "Une attaque surprise la nuit a pris la base d’approvisionnement espagnole sur le Rhin."
"12–13 September 1631": "12–13 septembre 1631"
"Dutch ships caught the Spanish flotilla among the Zeeland islands and captured or sank most of it, taking thousands of prisoners.": "Des navires hollandais ont pris la flottille espagnole parmi les îles Zeeland et capturé ou coulé la plupart d’entre eux, prenant des milliers de prisonniers."
"Venlo and Roermond": "Venlo et Roermond"
"June 1632": "juin 1632"
"Both towns on the Maas surrendered quickly as Frederick Henry advanced on Maastricht.": "Les deux villes de la Maas se rendirent rapidement à mesure que Frederick Henry avançait sur Maastricht."
"June–August 1632": "juin–août 1632"
"Frederick Henry beat off a Spanish army and Pappenheim’s imperial relief army and took the city on 22 August.": "Frederick Henry a battu une armée espagnole et l’armée impériale de secours de Pappenheim et a pris la ville le 22 août."
"Frederick Henry": "Frederick Henry"
"Van den Bergh": "Van den Bergh"
"France joins, and the Downs": "La France rejoint, et les Downs"
"1635–1639": "1635–1639"
"In February 1635 the Republic allied with France to conquer and divide the Spanish Netherlands. In May a French army beat the Spaniards at Les Avins and joined Frederick Henry, but their armies sacked Tienen and then failed before Leuven, and the people of the south rallied to the new governor, Philip IV’s brother, the Cardinal-Infante Ferdinand. Spanish troops even seized the Dutch fortress of Schenkenschans on the Rhine in July 1635; it took nine months to win back. Frederick Henry retook Breda in October 1637, but a Dutch attack on Antwerp ended in defeat at Kallo in June 1638.": "En février 1635, la République s’allie à la France pour conquérir et diviser les Pays-Bas espagnols. Au mois de mai, une armée française battit les Espagnols aux Avins et rejoignit Frederick Henry, mais leurs armées renversèrent Tienen avant d’échouer devant Louvain, et le peuple du sud se rallia au nouveau gouverneur, Philippe IV, frère du cardinal infante Ferdinand. Les troupes espagnoles s’emparèrent même de la forteresse hollandaise de Schenkenschans sur le Rhin en juillet 1635 ; il fallut neuf mois pour la reconquérir. Frederick Henry reprit Breda en octobre 1637, mais une attaque néerlandaise contre Anvers se termina par une défaite à Kallo en juin 1638."
"With French armies astride the Spanish Road through Alsace, Spain tried to reinforce Flanders by sea. In September 1639 a fleet under Antonio de Oquendo, about 50 warships and 30 transports carrying some 9,000 soldiers, was attacked in the Channel by Maarten Tromp and took shelter in the Downs off the Kent coast, in neutral English waters. Most of the troops were ferried to Dunkirk in small, fast ships, but on 21 October Tromp attacked with fireships. About ten Spanish ships were captured or destroyed and a dozen more ran aground. Spain never again sent a great fleet into the North Sea.": "En septembre 1639, une flotte sous Antonio de Oquendo, environ 50 navires de guerre et 30 transports transportant quelque 9 000 soldats, fut attaquée dans la Manche par Maarten Tromp et s’abrita dans les Downs au large de la côte du Kent, dans des eaux anglaises neutres. La plupart des troupes ont été envoyées à Dunkerque dans de petits navires rapides, mais le 21 octobre Tromp a attaqué avec des bateaux de feu. Une dizaine de navires espagnols ont été capturés ou détruits et une douzaine d’autres ont échoué. L’Espagne n’a plus jamais envoyé une grande flotte en mer du Nord."
"Battle of Les Avins": "Bataille des Avins"
"20 May 1635, French victory": "20 mai 1635, victoire française"
"Breda retaken": "Breda repris"
"October 1637": "octobre 1637"
"Battle of the Downs": "Bataille des Downs"
"21 October 1639, Dutch victory": "21 octobre 1639, victoire néerlandaise"
"20 May 1635": "20 mai 1635"
"A French army under the marshals Châtillon and Brézé beat the Spaniards near Huy and marched on to join the Dutch at Maastricht.": "Une armée française sous les maréchals Châtillon et Brézé battit les Espagnols près de Huy et marcha pour rejoindre les Hollandais à Maastricht."
"Leuven": "Leuven"
"June–July 1635": "juin–juillet 1635"
"Students and townspeople helped the garrison hold out, and the French and Dutch armies, short of supplies after sacking Tienen, withdrew.": "Des étudiants et des citadins ont aidé la garnison à tenir, et les armées française et néerlandaise, à court de fournitures après avoir renvoyé Tienen, se sont retirées."
"Schenkenschans": "Les schenkenschans"
"28 July 1635": "28 juillet 1635"
"A Spanish raiding force surprised the fort at the fork of the Rhine and the Waal. The Dutch besieged it until April 1636.": "Une force de raid espagnole a surpris le fort à la fourche du Rhin et du Waal. Les Hollandais l’ont assiégé jusqu’en avril 1636."
"July–October 1637": "juillet–octobre 1637"
"Frederick Henry won back the Nassau town twelve years after its loss.": "Frederick Henry a remporté la ville de Nassau douze ans après sa perte."
"Battle of Kallo": "Bataille de Kallo"
"20 June 1638": "20 juin 1638"
"The Cardinal-Infante’s army beat a Dutch force that had crossed the Scheldt to attack Antwerp from the west.": "L’armée cardinal-infante a battu une force néerlandaise qui avait traversé l’Escaut pour attaquer Anvers depuis l’ouest."
"21 October 1639": "21 octobre 1639"
"Tromp’s fireships and gunners destroyed the Spanish fleet in the roadstead off Deal, while an English squadron looked on.": "Les pompiers et les artilleurs ont détruit la flotte espagnole dans le poste de pont au large de Deal, tandis qu’un escadron anglais regardait."
"Châtillon and Brézé": "Châtillon et Brézé"
"Oquendo": "Oquendo"
"The Peace of Münster": "La paix de Münster"
"1640–1648": "1640–1648"
"In 1640 Catalonia and Portugal rose against Philip IV, and Spain, fighting France on several fronts, could no longer hope to win in the Netherlands. The Dutch were tiring of the war too. Frederick Henry took Sas van Gent in 1644 and Hulst in 1645, winning the strip of Flanders south of the Scheldt, but Holland’s merchants now feared a powerful France more than a weakened Spain. Peace talks opened at Münster in Westphalia, beside the congress that was ending the Thirty Years’ War, and the Dutch envoys made peace without waiting for France.": "En 1640, la Catalogne et le Portugal s’élèvent contre Philippe IV, et l’Espagne, combattant la France sur plusieurs fronts, ne peut plus espérer gagner aux Pays-Bas. Les Hollandais sont fatigants de la guerre aussi. Frederick Henry prend Sas van Gent en 1644 et Hulst en 1645, remportant la bande de Flandre au sud de l’Escaut, mais les marchands hollandais craignent maintenant une France puissante plus qu’une Espagne affaiblie. Des pourparlers de paix ont été ouverts à Münster en Westphalie, à côté du congrès qui mettait fin à la guerre de Trente Ans, et les envoyés néerlandais ont fait la paix sans attendre la France."
"The treaty was signed on 30 January 1648 and sworn in Münster’s town hall on 15 May. Spain recognised the seven United Provinces as free and sovereign states. The Republic kept the lands it had conquered in Brabant, Flanders and around Maastricht, ruled directly by the States General as the Generality Lands. The Scheldt stayed closed to shipping, to Amsterdam’s benefit and Antwerp’s cost, and the Dutch kept their conquests in Asia and the Americas. Frederick Henry, who had died in March 1647, did not see the peace.": "Le traité fut signé le 30 janvier 1648 et a prêté serment à la mairie de Münster. L’Espagne reconnut les sept provinces unies comme des États libres et souverains. La République conserva les terres qu’elle avait conquises à Brabant, en Flandre et aux environs de Maastricht, gouvernées directement par les Etats généraux comme les Terres générales. L’Escaut reste fermé à la navigation, au bénéfice d’Amsterdam et aux coûts d’Anvers, et les Hollandais gardent leurs conquêtes en Asie et dans les Amériques. Frederick Henry, décédé en mars 1647, ne voit pas la paix."
