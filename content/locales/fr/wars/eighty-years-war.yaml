"Haarlem held out for seven months. When hunger forced it to surrender on 13 July 1573, the townspeople bought themselves free, but most of the garrison was executed. Alkmaar then beat off Don Fadrique after the rebels flooded the land around his camp, the Sea Beggars beat a royal fleet on the Zuiderzee in October, and Alba was recalled. His successor, Luis de Requesens, destroyed a relief army at Mookerheyde on 14 April 1574, where Louis and Henry of Nassau were killed. But Leiden, besieged from May, was saved on 3 October when the rebels cut the dykes and sailed flat-bottomed boats across the flooded fields.": "Haarlem a tenu sept mois. Lorsque la faim l’a forcé à se rendre le 13 juillet 1573, les habitants se sont rachetés, mais la plupart de la garnison a été exécutée. Alkmaar a ensuite battu Don Fadrique après que les rebelles ont inondé la terre autour de son camp, les mendiants ont battu une flotte royale sur la Zuiderzee en octobre, et Alba a été rappelé. Son successeur, Luis de Requesens, a détruit une armée de secours à Mookerheyde le 14 avril 1574, où Louis et Henry de Nassau ont été tués. Mais Leiden, assiégé de mai, a été sauvé le 3 octobre lorsque les rebelles ont coupé les digues et navigué des bateaux à fond plat à travers les champs inondés."
"Unpaid for years, the Spanish troops mutinied again and again. Requesens died in March 1576, leaving no one in charge, and on 4 November mutineers sacked Antwerp, the richest city in northern Europe; at least 7,000 people were killed in the “Spanish Fury”. Four days later the States General of the loyal provinces and the rebels of Holland and Zeeland signed the Pacification of Ghent. They agreed to drive out the Spanish troops together and to suspend the heresy laws, leaving the question of religion for later.": "Non payés pendant des années, les troupes espagnoles mutinèrent encore et encore. Requesens mourut en mars 1576, ne laissant personne en charge, et le 4 novembre les mutins laissèrent Anvers, la ville la plus riche d’Europe du Nord ; au moins 7 000 personnes furent tuées dans la Fury espagnole. Quatre jours plus tard, les États généraux des provinces loyales et les rebelles de Hollande et Zeeland signèrent la Pacification de Gand. Ils ont accepté de chasser les troupes espagnoles ensemble et de suspendre les lois hérésies, laissant la question de la religion pour plus tard."
