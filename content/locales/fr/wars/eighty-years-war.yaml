"1577–1581": "1577–1581"
"The new governor, Philip’s half-brother Don John of Austria, accepted the Pacification in February 1577 and sent the Spanish troops away, but soon seized the citadel of Namur and called them back. On 31 January 1578 he and his nephew Alexander Farnese, later Duke of Parma, routed the army of the States General at Gembloux. Don John died that October, and Parma, a skilled soldier and diplomat, took over. The rebels were divided too. Calvinists seized power in Ghent, Brussels and other cities, alarming the Catholic nobles and the Walloon provinces.": "Le nouveau gouverneur, le demi-frère de Philippes Don John d’Autriche, accepta la Pacification en février 1577 et renvoya les troupes espagnoles, mais s’empara bientôt de la citadelle de Namur et les rappela. Le 31 janvier 1578, lui et son neveu Alexander Farnese, plus tard duc de Parme, dirigeèrent l’armée des États généraux à Gembloux. Don John est mort en octobre, et Parma, un soldat qualifié et diplomate, a pris la relève. Les rebelles ont été divisés aussi. Calvinistes s’est emparé du pouvoir à Gand, Bruxelles et dans d’autres villes, alarmant les nobles catholiques et les provinces wallonnes."
"On 6 January 1579 Artois, Hainaut and the town of Douai formed the Union of Arras, and in May they made peace with Philip on condition that only Catholicism be allowed. On 23 January Holland, Zeeland, Utrecht, Guelders and the Groningen countryside formed the Union of Utrecht, later joined by Friesland, Overijssel, Drenthe and the great cities of Flanders and Brabant. Parma took Maastricht by storm in June after a four-month siege. Philip outlawed William in 1580, and on 26 July 1581 the States General renounced Philip as their sovereign in the Act of Abjuration.": "Le 6 janvier 1579, Artois, Hainaut et la ville de Douai formèrent l’Union d’Arras, et en mai ils firent la paix avec Philippe à condition que seul le catholicisme soit autorisé. Le 23 janvier, les Pays-Bas, la Zélande, Utrecht, Guelders et la campagne de Groningue formèrent l’Union d’Utrecht, plus tard rejointe par Friesland, Overijssel, Drenthe et les grandes villes de Flandre et de Brabant. Parma prit Maastricht par tempête en juin après un siège de quatre mois. Philippe a interdit Guillaume en 1580, et le 26 juillet 1581 les États généraux ont renoncé à Philippe comme leur souverain dans l’Acte d’Abjuration."
