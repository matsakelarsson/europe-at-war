"Meeting in The Hague, the States General declared that a prince who oppressed his subjects could be deposed, and renounced Philip II.": "Réunis à La Haye, les Etats généraux ont déclaré qu’un prince qui opprimait ses sujets pouvait être déposé et a renoncé à Philippe II."
