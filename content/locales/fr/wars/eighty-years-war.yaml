"1566–1568": "1566–1568"
"In the 1560s the seventeen provinces of the Netherlands were governed from Brussels for Philip II of Spain, who enforced harsh laws against Protestants and sidelined the great nobles. In April 1566 several hundred lesser nobles petitioned the regent, Margaret of Parma, to suspend the heresy laws; a courtier is said to have called them beggars (gueux), and they took up the name. That summer Calvinist preachers drew huge crowds, and on 10 August a sermon near Steenvoorde in Flanders was followed by an attack on a church. Within weeks the Beeldenstorm, the iconoclastic fury, had stripped hundreds of churches of their images from Flanders to Groningen.": "Dans les années 1560, les dix-sept provinces des Pays-Bas furent gouvernées de Bruxelles pour Philippe II d’Espagne, qui exécuta des lois sévères contre les protestants et mis à l’écart les grands nobles. En avril 1566, plusieurs centaines de nobles de moindre importance supplièrent la régente, Margaret de Parme, de suspendre les lois hérésies ; on dit qu’un courtiste les appelait mendiants (gueux), et ils prirent le nom. Cet été-là, les prédicateurs calvinistes ont attiré d’énormes foules, et le 10 août un sermon près de Steenvoorde en Flandre a été suivi par une attaque sur une église. En quelques semaines, la Beeldenstorm, la furie iconoclastique, avait dépouillé des centaines d’églises de leurs images de Flandre à Groningue."
"Philip sent the Duke of Alba, who reached Brussels in August 1567 with about 10,000 veteran troops. His Council of Troubles condemned almost 9,000 people, most in their absence, and about 1,000 were executed, among them the counts of Egmont and Horn. William of Orange, the greatest noble of the Netherlands, had withdrawn to Germany and raised armies. His brother Louis of Nassau beat a royal force at Heiligerlee on 23 May 1568, usually taken as the start of the war, but Alba destroyed Louis’s army at Jemmingen on the Ems on 21 July, and William’s invasion of Brabant that autumn ran out of money.": "Philippe envoya le duc d’Alba, qui arriva à Bruxelles en août 1567 avec environ 10 000 soldats vétérans. Son Conseil des Troubles condamna près de 9000 personnes, la plupart en leur absence, et environ 1 000 furent exécutées, parmi lesquelles les chefs d’Egmont et de Horn. William d’Orange, le plus grand noble des Pays-Bas, s’était retiré en Allemagne et avait élevé des armées. Son frère Louis de Nassau battait une force royale à Heiligerlee le 23 mai 1568, habituellement prise comme le début de la guerre, mais Alba détruisait l’armée de Louis à Jemmingen sur les Ems le 21 juillet, et William d’invasion de Brabant cet automne manquait d’argent."
