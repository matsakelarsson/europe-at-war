"Eighty Years’ War": "Guerre de Quatre-Vingts Ans"
"The revolt of the Netherlands against Philip II of Spain, which grew out of Calvinist iconoclasm and the Duke of Alba’s repression into a long war between Spain and the northern provinces, interrupted by the Twelve Years’ Truce of 1609–1621. The Peace of Münster in 1648 recognised the independence of the Dutch Republic, while the southern provinces stayed under Spanish rule.": "La révolte des Pays-Bas contre Philippe II d’Espagne prend naissance dans l’iconoclasme calviniste et la répression menée par le duc d’Albe. Elle débouche sur une longue guerre entre l’Espagne et les provinces du Nord, interrompue par la trêve de Douze Ans (1609–1621). La paix de Münster reconnaît en 1648 l’indépendance des Provinces-Unies. Les provinces du Sud restent sous domination espagnole."
"The war is usually dated from the Battle of Heiligerlee on 23 May 1568 to the ratification of the Peace of Münster on 15 May 1648. It paused during the Twelve Years’ Truce of 1609–1621, and from 1621 it merged with the Thirty Years’ War and, from 1635, the Franco-Spanish War.": "La guerre date généralement de la bataille d’Heiligerlee le 23 mai 1568 à la ratification de la paix de Münster le 15 mai 1648. Elle s’est arrêtée pendant les douze années , Trêve de 1609–1621, et de 1621 elle a fusionné avec la guerre de Trente Ans et, à partir de 1635, la guerre franco-espagnole."
"Dates are New Style (Gregorian). The Spanish Netherlands, Holland and Zeeland adopted it in 1582–1583, but several northern provinces and England kept the Julian calendar, ten days behind, until 1700 or later.": "Les Pays-Bas, la Hollande et la Zélande l’ont adopté en 1582–1583, mais plusieurs provinces du Nord et l’Angleterre ont conservé le calendrier julien, dix jours après, jusqu’à 1700 ou plus tard."
"Places are named in the forms usual in English, with the Dutch name where it differs, such as Brill (Den Briel), Flushing (Vlissingen) and ’s-Hertogenbosch (Den Bosch). The “States General” was the assembly of the provinces’ delegates; the “States” of a province was its own assembly.": "Les lieux sont nommés dans les formes habituelles en anglais, avec le nom néerlandais où il diffère, tels que Brill (Den Briel), Flushing (Vlissingen) et -Hertogenbosch (Den Bosch). L’état général de la province était l’assemblée des délégués des provinces ; l’état d’une province était sa propre assemblée."
