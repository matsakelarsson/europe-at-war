"Brill and the revolt of Holland": "Brill et la révolte des Pays-Bas"
"Alba’s demand for a permanent sales tax, the Tenth Penny, turned even loyal towns against him. On 1 April 1572 the Sea Beggars, Calvinist privateers sailing under William’s commission who had just been expelled from English ports, seized the little port of Brill at the mouth of the Maas. Flushing rose within days, and over the summer most towns of Holland and Zeeland let the rebels in, often under pressure from armed Calvinist minorities. In July the States of Holland met at Dordrecht and recognised William as their stadtholder.": "Alba's demande une taxe de vente permanente, le dixième Penny, tourne même des villes fidèles contre lui. Le 1er avril 1572, les Sea Beggars, corsaires calvinistes naviguant sous la commission William's qui venait d’être expulsé des ports anglais, s’emparèrent du petit port de Brill à l’embouchure de la Maas. En été, la plupart des villes de Hollande et de Zélande ont laissé entrer les rebelles, souvent sous la pression de minorités calvinistes armées. En juillet, les États de Hollande se sont réunis à Dordrecht et ont reconnu William comme leur propriétaire de stadt."
"The rebels counted on France. Louis of Nassau surprised Mons in Hainaut on 24 May with Huguenot help, and William invaded Brabant from Germany. But the Massacre of St Bartholomew in Paris on 24 August killed the Huguenot leaders and any hope of French aid. Mons surrendered to Alba in September, and his son Don Fadrique marched north to punish the rebel towns. Mechelen was sacked in October, and many of the people of Zutphen and Naarden were massacred in November and December. William withdrew to Holland, resolved, he wrote, to make his grave there.": "Les rebelles comptaient sur la France. Louis de Nassau a surpris Mons à Hainaut le 24 mai avec l’aide de Huguenot, et William a envahi Brabant d’Allemagne. Mais le massacre de St Bartholomew à Paris le 24 août a tué les dirigeants de Huguenot et tout espoir d’aide française. Mons s’est rendu à Alba en septembre, et son fils Don Fadrique a marché au nord pour punir les villes rebelles. Mechelen a été renvoyé en octobre, et beaucoup de la population de Zutphen et Naarden ont été massacrés en novembre et décembre. William se retira en Hollande, résolu, écrit-il, à y faire sa tombe."
