# French translations of the catalogue text (wave 10); step bodies follow later.
Eikyō Rebellion and the Yūki War: Rébellion d’Eikyō et guerre de Yūki
? "The war in which the shogun Ashikaga Yoshinori destroyed his kinsman Ashikaga Mochiuji, the Kamakura kubō who governed eastern Japan, followed by a last stand of Mochiuji’s supporters at Yūki castle. Mochiuji had hoped to become shogun himself in 1428 and never accepted Yoshinori: he went on using the old era name after the change to Eikyō, and he quarrelled with his own deputy (Kantō kanrei), Uesugi Norizane, who kept close to Kyoto. In the sixth month of 1438 Mochiuji held the coming-of-age ceremony of his son Yoshihisa without the shogun’s leave, and in the eighth month Norizane fled to his castle of Hirai in Kōzuke. Mochiuji sent troops after him, and Yoshinori, with an imperial edict and banner, ordered Imagawa Norimasa, Ogasawara Masayasu, Uesugi Mochifusa and other lords to march on the Kantō. The shogun’s armies crossed the Ashigara and Hakone passes in the ninth month; Miura Tokitaka, left to guard Kamakura, changed sides and attacked the city, and Mochiuji’s army broke up. Mochiuji surrendered and became a monk, but Yoshinori refused Norizane’s pleas to spare him: on 24 March 1439 Norizane’s troops attacked the temple of Yōan-ji (Eian-ji) in Kamakura, where Mochiuji took his life, and his heir Yoshihisa killed himself at Hōkoku-ji. In the third month of 1440 Yūki Ujitomo of Shimōsa took up the cause of Mochiuji’s younger sons Haruōmaru and Yasuōmaru and rose with other eastern houses. An army under Uesugi Kiyokata besieged Yūki castle from the seventh month, and it fell in the fourth month of 1441; Ujitomo and his son died in the fighting, and the two boys were taken and killed in Mino on Yoshinori’s orders. A younger brother, later Ashikaga Shigeuji, survived and was made Kamakura kubō in 1449. Yoshinori was murdered at a banquet given in Kyoto to celebrate the victory (the Kakitsu incident)."
: "La guerre au cours de laquelle le shogun Ashikaga Yoshinori anéantit son parent Ashikaga Mochiuji, le Kamakura kubō qui gouvernait l’est du Japon, suivie d’un dernier combat des partisans de Mochiuji au château de Yūki. Mochiuji avait espéré devenir lui-même shogun en 1428 et n’accepta jamais Yoshinori : il continua d’employer l’ancien nom d’ère après le passage à Eikyō, et il se brouilla avec son propre adjoint (Kantō kanrei), Uesugi Norizane, qui restait proche de Kyoto. Au sixième mois de 1438, Mochiuji célébra la cérémonie de majorité de son fils Yoshihisa sans l’autorisation du shogun et, au huitième mois, Norizane s’enfuit dans son château de Hirai, dans le Kōzuke. Mochiuji envoya des troupes à sa poursuite, et Yoshinori, muni d’un édit et d’une bannière impériaux, ordonna à Imagawa Norimasa, Ogasawara Masayasu, Uesugi Mochifusa et d’autres seigneurs de marcher sur le Kantō. Les armées du shogun franchirent les cols d’Ashigara et de Hakone au neuvième mois ; Miura Tokitaka, laissé à la garde de Kamakura, changea de camp et attaqua la ville, et l’armée de Mochiuji se débanda. Mochiuji se rendit et se fit moine, mais Yoshinori rejeta les suppliques de Norizane, qui demandait qu’on l’épargne : le 24 mars 1439, les troupes de Norizane attaquèrent le temple Yōan-ji (Eian-ji) à Kamakura, où Mochiuji se donna la mort, et son héritier Yoshihisa se suicida au Hōkoku-ji. Au troisième mois de 1440, Yūki Ujitomo, du Shimōsa, épousa la cause des fils cadets de Mochiuji, Haruōmaru et Yasuōmaru, et se souleva avec d’autres maisons de l’Est. Une armée commandée par Uesugi Kiyokata assiégea le château de Yūki à partir du septième mois, et celui-ci tomba au quatrième mois de 1441 ; Ujitomo et son fils périrent dans les combats, et les deux garçons furent capturés et tués dans le Mino sur ordre de Yoshinori. Un frère plus jeune, le futur Ashikaga Shigeuji, survécut et fut fait Kamakura kubō en 1449. C’est au cours d’un banquet donné à Kyoto pour célébrer la victoire que Yoshinori fut assassiné (l’incident de Kakitsu)."
