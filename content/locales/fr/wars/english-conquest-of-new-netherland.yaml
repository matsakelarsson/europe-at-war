# French translations of the catalogue text (wave 14); step bodies follow later.
English conquest of New Netherland: Conquête anglaise de la Nouvelle-Néerlande
? The English seizure of the Dutch colony of New Netherland in 1664, its brief Dutch recapture in 1673–1674 and its final return to England. In March 1664 Charles II granted the land between the Connecticut and the Delaware to his brother James, Duke of York, and sent four ships with some 450 men under Richard Nicolls, though England and the Dutch Republic were at peace. Outnumbered, short of powder and pressed by the townspeople, Peter Stuyvesant surrendered New Amsterdam without a fight on 8 September 1664; it became New York, Fort Orange became Albany, and in October Sir Robert Carr took New Amstel on the Delaware by storm. The seizure was one of the causes of the Second Anglo-Dutch War, and at the Peace of Breda in 1667 the Dutch let England keep the colony while they kept Suriname. In the Third Anglo-Dutch War a Dutch squadron under Cornelis Evertsen the Youngest and Jacob Binckes retook New York on 9 August 1673 and renamed it New Orange, but the Treaty of Westminster gave it back, and the Dutch governor Anthony Colve handed it over to Edmund Andros on 10 November 1674. The Dutch colonists kept their property, religion and inheritance customs under the English.
: La prise par les Anglais de la colonie néerlandaise de la Nouvelle-Néerlande en 1664, sa brève reconquête par les Néerlandais en 1673–1674 et sa restitution définitive à l’Angleterre. En mars 1664, Charles II concéda les terres comprises entre le Connecticut et la Delaware à son frère Jacques, duc d’York, et envoya quatre navires avec quelque 450 hommes sous les ordres de Richard Nicolls, alors que l’Angleterre et les Provinces-Unies étaient en paix. En infériorité numérique, à court de poudre et pressé par les habitants, Peter Stuyvesant rendit la Nouvelle-Amsterdam sans combat le 8 septembre 1664 ; elle devint New York, Fort Orange devint Albany et, en octobre, Sir Robert Carr prit d’assaut New Amstel, sur la Delaware. Cette prise fut l’une des causes de la deuxième guerre anglo-néerlandaise et, à la paix de Breda de 1667, les Néerlandais laissèrent la colonie à l’Angleterre et conservèrent le Suriname. Pendant la troisième guerre anglo-néerlandaise, une escadre néerlandaise commandée par Cornelis Evertsen le Plus Jeune et Jacob Binckes reprit New York le 9 août 1673 et la rebaptisa Nouvelle-Orange, mais le traité de Westminster la rendit à l’Angleterre, et le gouverneur néerlandais Anthony Colve la remit à Edmund Andros le 10 novembre 1674. Sous la domination anglaise, les colons néerlandais conservèrent leurs biens, leur religion et leurs coutumes successorales.
