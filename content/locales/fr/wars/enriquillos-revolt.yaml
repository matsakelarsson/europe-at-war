# French translations of the catalogue text (wave 14); step bodies follow later.
Enriquillo’s revolt: Révolte d’Enriquillo
? The war of the Taíno cacique Enriquillo against the Spanish colony of Hispaniola, fought from the Bahoruco mountains in the south-west of the island from 1519 to 1533. Enriquillo, whom most historians identify with Guarocuya, a nephew of Anacaona of Xaraguá, had been raised by Franciscan friars and was held in encomienda near San Juan de la Maguana; when his encomendero Andrés de Valenzuela took his mare and abused his wife Mencía, and the colony’s courts gave him no redress, he led his people into the mountains. For fourteen years the rebels, joined by other Taíno and by Africans who had escaped slavery, beat off expedition after expedition and raided the settlements, at a cost to the colony of tens of thousands of gold pesos, while enslaved Wolof Africans rose on Diego Colón’s sugar estate in 1521 in the first recorded African revolt in the Americas. In 1533 Charles V sent Francisco de Barrionuevo with a royal letter, and Enriquillo agreed to a peace that gave his people freedom, a pardon and land of their own, in return for submission to the Crown and help in catching runaways. He died in 1535. Enriquillo is a national hero of the Dominican Republic, and the lake below the Bahoruco bears his name.
: La guerre du cacique taïno Enriquillo contre la colonie espagnole d’Hispaniola, menée depuis les montagnes du Bahoruco, dans le sud-ouest de l’île, de 1519 à 1533. Enriquillo, que la plupart des historiens identifient à Guarocuya, un neveu d’Anacaona du Xaraguá, avait été élevé par des franciscains et était tenu en encomienda près de San Juan de la Maguana ; lorsque son encomendero Andrés de Valenzuela lui prit sa jument et abusa de sa femme Mencía, et que les tribunaux de la colonie ne lui rendirent pas justice, il emmena les siens dans les montagnes. Pendant quatorze ans, les rebelles, rejoints par d’autres Taïnos et par des Africains qui avaient échappé à l’esclavage, repoussèrent expédition après expédition et attaquèrent les établissements, ce qui coûta à la colonie des dizaines de milliers de pesos d’or, tandis qu’en 1521 des Africains wolofs réduits en esclavage se soulevaient sur la plantation sucrière de Diego Colón, lors de la première révolte africaine attestée dans les Amériques. En 1533, Charles Quint envoya Francisco de Barrionuevo porteur d’une lettre royale, et Enriquillo accepta une paix qui accordait aux siens la liberté, l’amnistie et des terres à eux, en échange de leur soumission à la Couronne et de leur aide pour capturer les fugitifs. Il mourut en 1535. Enriquillo est un héros national de la République dominicaine, et le lac situé au pied du Bahoruco porte son nom.
