# Some French text was translated automatically.
"Epirote–Bulgarian war": "Guerre épirotique-bulgare"
"A short war in which Theodore Komnenos Doukas, ruler of Epirus and emperor at Thessalonica, broke his alliance with Tsar Ivan Asen II of Bulgaria and invaded Bulgaria in 1230, intending to go on to take Constantinople. At Klokotnitsa, near Haskovo, Asen routed his army on 9 March 1230 and took him prisoner. Bulgaria then occupied most of Thrace, Macedonia and Albania, becoming the leading power in the Balkans, and Theodore’s empire was reduced to Thessalonica, Thessaly and Epirus under his brother Manuel.": "Une courte guerre dans laquelle Theodore Komnenos Doukas, chef d’Epire et empereur à Thessalonique, rompit son alliance avec le tsar Ivan Asen II de Bulgarie et envahit la Bulgarie en 1230, ayant l’intention de prendre Constantinople. À Klokotnitsa, près de Haskovo, Asen roula son armée le 9 mars 1230 et le fit prisonnier. La Bulgarie occupe alors la plus grande partie de Thrace, Macédoine et Albanie, devenant le premier pouvoir dans les Balkans, et l’empire Théodore fut réduit à Thessalonique, Thessalie et Epirus sous son frère Manuel."
"Asen treated his prisoners well and freed the common soldiers, which helped him win over the towns of Theodore’s lands. Theodore was later blinded after plotting against Asen; he was released in 1237 when Asen married his daughter.": "Asen a bien traité ses prisonniers et libéré les soldats communs, ce qui l’a aidé à gagner les villes des terres de Théodore. Theodore a été plus tard aveuglé après avoir comploté contre Asen ; il a été libéré en 1237 quand Asen a épousé sa fille."
