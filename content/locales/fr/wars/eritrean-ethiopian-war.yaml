# French translations of the catalogue text (wave 12); step bodies follow later.
Eritrean–Ethiopian War: Guerre érythréo-éthiopienne
? A border war between Eritrea and Ethiopia, whose ruling fronts, the EPLF and the TPLF, had fought together against the Derg until 1991. Disputes over trade, Eritrea’s new currency and the unmarked colonial border came to a head in May 1998 when fighting broke out at Badme, a small town administered by Ethiopia and claimed by Eritrea, and Eritrean forces occupied it. The war was fought in trenches along three fronts, with mass infantry assaults, tanks, artillery and aircraft on both sides; tens of thousands of soldiers were killed, and each country expelled tens of thousands of the other’s nationals. Ethiopia retook Badme in Operation Sunset in February 1999, and in May 2000 its offensive broke the western front and occupied a strip of western and southern Eritrea. A ceasefire was signed on 18 June 2000 and a peace agreement in Algiers on 12 December 2000. The boundary commission set up by the agreement awarded Badme to Eritrea in 2002, but Ethiopia would not withdraw, and the two countries stayed in a state of “no war, no peace” until Prime Minister Abiy Ahmed accepted the ruling in 2018. Estimates of the dead range from about 70,000 to 100,000, and some go far higher.
: Une guerre frontalière entre l’Érythrée et l’Éthiopie, dont les fronts au pouvoir, le FPLE et le TPLF, avaient combattu ensemble contre le Derg jusqu’en 1991. Les différends sur le commerce, la nouvelle monnaie érythréenne et la frontière coloniale non bornée atteignirent leur paroxysme en mai 1998, lorsque des combats éclatèrent à Badme, petite ville administrée par l’Éthiopie et revendiquée par l’Érythrée, que les forces érythréennes occupèrent. La guerre se déroula dans des tranchées sur trois fronts, avec, de part et d’autre, des assauts massifs d’infanterie, des chars, de l’artillerie et de l’aviation ; des dizaines de milliers de soldats furent tués, et chaque pays expulsa des dizaines de milliers de ressortissants de l’autre. L’Éthiopie reprit Badme lors de l’opération Sunset, en février 1999, et, en mai 2000, son offensive enfonça le front occidental et occupa une bande de territoire dans l’ouest et le sud de l’Érythrée. Un cessez-le-feu fut signé le 18 juin 2000, et un accord de paix à Alger le 12 décembre 2000. La commission frontalière instituée par l’accord attribua Badme à l’Érythrée en 2002, mais l’Éthiopie refusa de se retirer, et les deux pays restèrent dans un état de « ni guerre ni paix » jusqu’à ce que le Premier ministre Abiy Ahmed accepte cette décision en 2018. Les estimations du nombre de morts vont d’environ 70 000 à 100 000, et certaines sont bien plus élevées.
