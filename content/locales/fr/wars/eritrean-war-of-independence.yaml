# French translations of the catalogue text (wave 12); step bodies follow later.
Eritrean War of Independence: Guerre d’indépendance de l’Érythrée
? "Thirty years of war in which Eritrean fronts fought for independence from Ethiopia. The former Italian colony was federated with Ethiopia by the United Nations in 1952; as Emperor Haile Selassie dismantled its autonomy, the Eritrean Liberation Front (ELF), founded in Cairo in 1960, began an armed struggle on 1 September 1961, and in 1962 Ethiopia annexed Eritrea as a province. Ethiopian counter-insurgency, with massacres of villagers, swelled the fronts, which split in the early 1970s: the Eritrean People’s Liberation Front (EPLF) of Isaias Afwerki broke away and the two fought each other. After the revolution of 1974 the military government, the Derg, lost almost all of Eritrea to the fronts by 1977, then won most of it back in 1978 with Soviet arms. The EPLF held its mountain base around Nakfa through repeated offensives, drove the ELF out in 1981 and from 1988, after its victory at Afabet, went over to the attack. It took Massawa in 1990 and entered Asmara on 24 May 1991, as the Derg fell to the EPLF’s Tigrayan allies; Eritrea became independent after a referendum in April 1993. Estimates of the dead range widely: some 65,000–70,000 Eritrean fighters, tens of thousands of Ethiopian soldiers and between 90,000 and 280,000 civilians."
: "Trente années de guerre au cours desquelles des fronts érythréens luttèrent pour l’indépendance de l’Érythrée vis-à-vis de l’Éthiopie. L’ancienne colonie italienne avait été fédérée à l’Éthiopie par les Nations unies en 1952 ; tandis que l’empereur Hailé Sélassié démantelait son autonomie, le Front de libération de l’Érythrée (FLE), fondé au Caire en 1960, engagea la lutte armée le 1er septembre 1961, et l’Éthiopie annexa l’Érythrée comme province en 1962. La contre-insurrection éthiopienne, marquée par des massacres de villageois, grossit les rangs des fronts, qui se divisèrent au début des années 1970 : le Front populaire de libération de l’Érythrée (FPLE) d’Isaias Afwerki fit sécession et les deux mouvements se combattirent. Après la révolution de 1974, le gouvernement militaire, le Derg, avait perdu dès 1977 presque toute l’Érythrée au profit des fronts, puis il en reconquit l’essentiel en 1978 grâce aux armes soviétiques. Le FPLE tint sa base montagneuse autour de Nakfa malgré des offensives répétées, chassa le FLE en 1981 et, à partir de 1988, après sa victoire d’Afabet, passa à l’attaque. Il prit Massaoua en 1990 et entra à Asmara le 24 mai 1991, au moment où le Derg tombait sous les coups des alliés tigréens du FPLE ; l’Érythrée devint indépendante après un référendum en avril 1993. Les estimations du nombre de morts varient fortement : quelque 65 000–70 000 combattants érythréens, des dizaines de milliers de soldats éthiopiens et entre 90 000 et 280 000 civils."
