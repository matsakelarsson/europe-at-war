# French translations of the catalogue text (wave 14); step bodies follow later.
Escambray rebellion: Rébellion de l’Escambray
? "The guerrilla war against Fidel Castro’s government in the Escambray Mountains of central Cuba, which the government called the struggle against bandits (Lucha Contra Bandidos). Within months of the revolution of January 1959, former fighters of the Second National Front of the Escambray, which had fought Batista in the same mountains, former soldiers of Batista’s army, anti-communist students and local peasants (guajiros) took up arms against the new government’s turn towards communism and its land reform. Among their leaders were Plinio Prieto, Evelio Duque, Osvaldo Ramírez, Tomás San Gil and Julio Emilio Carretero; William Alexander Morgan, an American comandante of the Second Front, was executed in March 1961 for helping them. The CIA supplied some bands with arms and money in 1960–1961, but its support faded after the Bay of Pigs. The government answered with tens of thousands of militiamen and soldiers, who swept the mountains in tightening rings of encirclement, the largest in the winter of 1960–1961, and from July 1962 with special counter-insurgency units of the Lucha Contra Bandidos under Raúl Menéndez Tomassevich; it also moved peasant families suspected of helping the rebels out of the mountains, many of them to new settlements in Pinar del Río. Ramírez was killed in April 1962 and San Gil in 1963, and smaller bands fought in Matanzas, Pinar del Río, Camagüey and Oriente. The last bands were wiped out in 1965. Estimates of the insurgents range from about 2,000 to 4,000 at different times, in some 170–180 bands, with several thousand collaborators. Figures for the dead vary widely: Raúl Castro put the government’s losses at about 500 in 1970, and estimates of all deaths range from about 1,000 to 7,000."
: "La guérilla menée contre le gouvernement de Fidel Castro dans les monts de l’Escambray, au centre de Cuba, que le gouvernement appela la lutte contre les bandits (Lucha Contra Bandidos). Dans les mois qui suivirent la révolution de janvier 1959, d’anciens combattants du Second Front national de l’Escambray, qui avait combattu Batista dans ces mêmes montagnes, d’anciens soldats de l’armée de Batista, des étudiants anticommunistes et des paysans de la région (guajiros) prirent les armes contre le virage du nouveau gouvernement vers le communisme et contre sa réforme agraire. Parmi leurs chefs figuraient Plinio Prieto, Evelio Duque, Osvaldo Ramírez, Tomás San Gil et Julio Emilio Carretero ; William Alexander Morgan, un comandante américain du Second Front, fut exécuté en mars 1961 pour les avoir aidés. La CIA fournit des armes et de l’argent à certaines bandes en 1960–1961, mais son soutien s’estompa après la baie des Cochons. Le gouvernement répondit en engageant des dizaines de milliers de miliciens et de soldats, qui ratissèrent les montagnes par des encerclements de plus en plus resserrés, dont le plus vaste eut lieu pendant l’hiver 1960–1961, puis, à partir de juillet 1962, des unités spéciales de contre-insurrection de la Lucha Contra Bandidos commandées par Raúl Menéndez Tomassevich ; il fit aussi évacuer des montagnes les familles paysannes soupçonnées d’aider les rebelles, dont beaucoup furent installées dans de nouveaux villages de Pinar del Río. Ramírez fut tué en avril 1962 et San Gil en 1963, et des bandes plus petites combattirent dans les provinces de Matanzas, de Pinar del Río, de Camagüey et d’Oriente. Les dernières bandes furent anéanties en 1965. Selon les estimations, les insurgés étaient environ 2 000 à 4 000 suivant les périodes, répartis en quelque 170–180 bandes, avec plusieurs milliers de collaborateurs. Les chiffres des morts varient beaucoup : Raúl Castro évalua en 1970 les pertes du gouvernement à environ 500, et les estimations du nombre total de morts vont d’environ 1 000 à 7 000."
