# French translations of the catalogue text (wave 14); step bodies follow later.
Esopus Wars: Guerres des Esopus
? Two wars between New Netherland and the Esopus, a Munsee-speaking Lenape people of the mid-Hudson valley around what is now Kingston, New York, over the spread of Dutch farms onto their cornlands. They followed the Peach War of September 1655, when some five hundred Munsee entered New Amsterdam and, after fighting broke out, raided Pavonia and Staten Island, killing some forty colonists and taking about a hundred captive; afterwards Director Peter Stuyvesant made the scattered colonists gather in stockaded villages, among them Wiltwijck at Esopus in 1658. The first war began on 20 September 1659, when colonists fired on a group of Esopus men who had been drinking brandy given to them as wages. The Esopus burned farms and besieged Wiltwijck for weeks; the Dutch burned Esopus fields and stores, and Stuyvesant sent some captured Esopus men as slaves to Curaçao. Peace on 15 July 1660 cost the Esopus land. On 7 June 1663, angered by the land losses and the enslaved captives, Esopus warriors entered Wiltwijck as if to trade, set it on fire and destroyed the new village of Nieuw Dorp (Hurley), killing some twenty colonists and taking about forty-five captive, mostly women and children. Dutch soldiers and militia under Captain Martin Cregier, guided by Mohawk and Wappinger allies, burned the Esopus fields and in September 1663 stormed their new fort near the Shawangunk Mountains, killing the sachem Papequanaehen and freeing many of the captives. A peace in May 1664 ceded more land; under English rule the Esopus sold the rest of their lands over the following decades and many moved away.
: Deux guerres entre la Nouvelle-Néerlande et les Esopus, un peuple lenape de langue munsee de la moyenne vallée de l’Hudson, autour de l’actuelle Kingston, dans l’État de New York, provoquées par l’extension des fermes néerlandaises sur leurs champs de maïs. Elles suivirent la guerre des pêches de septembre 1655, lorsque quelque cinq cents Munsees entrèrent dans la Nouvelle-Amsterdam et, une fois les combats engagés, attaquèrent Pavonia et Staten Island, tuant une quarantaine de colons et faisant une centaine de captifs ; par la suite, le directeur Peter Stuyvesant obligea les colons dispersés à se regrouper dans des villages palissadés, parmi lesquels Wiltwijck, à Esopus, en 1658. La première guerre commença le 20 septembre 1659, lorsque des colons tirèrent sur un groupe d’Esopus qui avaient bu de l’eau-de-vie qu’on leur avait donnée en guise de salaire. Les Esopus incendièrent des fermes et assiégèrent Wiltwijck pendant des semaines ; les Néerlandais brûlèrent les champs et les réserves des Esopus, et Stuyvesant envoya quelques Esopus capturés comme esclaves à Curaçao. La paix du 15 juillet 1660 coûta des terres aux Esopus. Le 7 juin 1663, irrités par ces pertes de terres et par la réduction en esclavage des captifs, des guerriers esopus entrèrent dans Wiltwijck comme pour commercer, y mirent le feu et détruisirent le nouveau village de Nieuw Dorp (Hurley), tuant une vingtaine de colons et faisant environ quarante-cinq captifs, pour la plupart des femmes et des enfants. Des soldats et des miliciens néerlandais commandés par le capitaine Martin Cregier, guidés par des alliés mohawks et wappingers, brûlèrent les champs des Esopus et, en septembre 1663, prirent d’assaut leur nouveau fort près des monts Shawangunk, tuant le sachem Papequanaehen et libérant une grande partie des captifs. Une paix conclue en mai 1664 céda de nouvelles terres ; sous la domination anglaise, les Esopus vendirent le reste de leurs terres au cours des décennies suivantes, et beaucoup s’en allèrent.
