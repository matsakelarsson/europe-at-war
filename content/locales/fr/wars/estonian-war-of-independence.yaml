"November 1918 – February 1919": "novembre 1918 – février 1919"
"Estonia had declared independence on 24 February 1918, a day before German troops entered Tallinn, and its Provisional Government took over only as the Germans began to leave in November. On 28 November the Red Army attacked Narva, where Estonian Bolsheviks proclaimed the Estonian Workers’ Commune. Soviet forces, many of them Latvian Riflemen, took Valga and Tartu at Christmas and by early January stood about 34 km from Tallinn. The new Estonian army, short of men and weapons, relied on volunteers, armoured trains and outside help. A British squadron reached Tallinn on 31 December with rifles and guns, and Finnish volunteers arrived from early January.": "L’Estonie avait déclaré son indépendance le 24 février 1918, une veille de l’entrée des troupes allemandes à Tallinn, et son gouvernement provisoire n’avait pris la relève que lorsque les Allemands ont commencé à partir en novembre. Le 28 novembre, l’Armée rouge attaqua Narva, où les bolcheviks estoniens proclamèrent la Commune des travailleurs estoniens. La nouvelle armée estonienne, à court d’hommes et d’armes, comptait sur des volontaires, des trains blindés et de l’aide extérieure. Un escadron britannique a atteint Tallinn le 31 décembre avec des fusils et des armes, et des volontaires finlandais sont arrivés à partir du début janvier."
"Under Colonel Johan Laidoner, the Estonians counter-attacked on 7 January 1919. Armoured trains and partisan units retook Tartu on 14 January, and Narva fell on 18 January after Estonian and Finnish troops landed behind the Soviet lines at Utria. At Paju near Valga on 31 January, Julius Kuperjanov’s partisans and Finnish volunteers drove back the Red Latvian Riflemen in a hard fight in which Kuperjanov was mortally wounded. By late February the Red Army had been pushed out of almost all of Estonia, and the front settled along the Narva river and the south-eastern border.": "Sous le colonel Johan Laidoner, les Estoniens contre-attaquent le 7 janvier 1919. Des trains blindés et des unités partisanes ont repris Tartu le 14 janvier, et Narva est tombée le 18 janvier après que les troupes estoniennes et finlandaises aient atterri derrière les lignes soviétiques à Utria. À Paju, près de Valga, le 31 janvier, les partisans de Julius Kuperjanov et des volontaires finlandais ont repoussé les Riflemen de Lettonie rouge dans un dur combat au cours duquel Kuperjanov a été mortellement blessé. Fin février, l’armée rouge avait été chassée de presque toute l’Estonie, et le front s’était installé le long du fleuve Narva et de la frontière sud-est."
