"Narva and the Treaty of Tartu": "Narva et le Traité de Tartu"
"October 1919 – February 1920": "octobre 1919 – février 1920"
"In October 1919 Nikolai Yudenich’s Northwestern Army advanced from Estonia on Petrograd, while Estonian forces attacked the coastal fort of Krasnaya Gorka, but the Whites were beaten back in November and fled to the Estonian border, where they were disarmed and interned; thousands of soldiers and refugees died of typhus that winter. Soviet Russia had offered Estonia peace talks. As they went on in Tartu, the Red 7th and 15th Armies attacked the fortified lines at Narva through November and December, and on 16 December some units crossed the river, but the Estonian defence held.": "En octobre 1919, l’armée du Nord-Ouest Nikolai Yudenich avança d’Estonie à Petrograd, tandis que les forces estoniennes attaquaient le fort côtier de Krasnaya Gorka, mais les Blancs furent battus en novembre et s’enfuirent à la frontière estonienne où ils furent désarmés et internés ; des milliers de soldats et de réfugiés moururent de typhus cet hiver. La Russie soviétique avait offert des pourparlers de paix en Estonie. Alors qu’ils se rendaient à Tartu, les 7e et 15e armées rouges attaquèrent les lignes fortifiées de Narva jusqu’en novembre et décembre, et le 16 décembre, certaines unités traversèrent la rivière, mais la défense estonienne s’arrêta."
"A ceasefire came into force on 3 January 1920, and on 2 February the Treaty of Tartu was signed. Soviet Russia recognised Estonia’s independence, renounced all claims to its territory in perpetuity and agreed to pay 15 million gold roubles from the old empire’s reserves. Estonia kept a strip east of the Narva river and the Petseri district in the south-east, both with many Russian or Setu inhabitants. About 3,600 Estonian soldiers had been killed. A land reform passed during the war broke up the estates of the Baltic German nobility, and much of the land went to veterans.": "Un cessez-le-feu est entré en vigueur le 3 janvier 1920, et le 2 février le Traité de Tartu a été signé. Russie soviétique reconnut l’indépendance de l’Estonie, renonça à toutes les revendications sur son territoire à perpétuité et accepta de payer 15 millions de roubles d’or des réserves de l’ancien empire. L’Estonie conserva une bande à l’est du fleuve Narva et du district Petseri dans le sud-est, avec de nombreux habitants russes ou setus. Environ 3 600 soldats estoniens avaient été tués. Une réforme agraire passée pendant la guerre a brisé les domaines de la noblesse allemande de la Baltique, et une grande partie des terres est allée aux anciens combattants."
