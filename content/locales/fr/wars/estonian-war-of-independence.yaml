# Some French text was translated automatically.
"Estonian War of Independence": "Guerre d’indépendance estonienne"
"A war in which the newly proclaimed Republic of Estonia, helped by Finnish volunteers and the British navy, drove out the Red Army in 1918–1919 and defeated the Baltic German Landeswehr in northern Latvia. It ended with the Treaty of Tartu of 2 February 1920, in which Soviet Russia recognised Estonia’s independence in perpetuity.": "Une guerre dans laquelle la République d’Estonie nouvellement proclamée, aidé par des volontaires finlandais et la marine britannique, a chassé l’Armée rouge en 1918-1919 et défait les Landeswehr allemands baltes dans le nord de la Lettonie. Il s’est terminé avec le traité de Tartu du 2 février 1920, dans lequel la Russie soviétique reconnaît l’indépendance de l’Estonie à perpétuité."
"Known in Estonia as the War of Independence or War of Liberation (Vabadussõda). Dates are New Style.": "Connu en Estonie comme la guerre d’indépendance ou la guerre de libération (Vabadussõda)."
"Places in Latvia are named in Latvian. The Battle of Cēsis is Võnnu lahing in Estonian. Petseri is today Pechory in Russia.": "Les places en Lettonie sont nommées en letton. La bataille de Cysis est Võnnu lahing en estonien. Petseri est aujourd'hui Pechory en Russie."
"The front line is approximate, drawn from general accounts.": "La ligne de front est approximative, tirée des comptes généraux."
