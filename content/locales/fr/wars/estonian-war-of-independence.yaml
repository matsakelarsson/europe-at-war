"May – July 1919": "mai – juillet 1919"
"In the spring the Red Army attacked again along the Narva river and in the south-east, and Narva was heavily shelled, but the Estonian lines held. On 13 May the White Russian Northern Corps, based in Estonia and under Estonian command, went on the offensive along the Gulf of Finland, and Estonian forces took Pskov on 25 May. Estonian divisions also advanced into northern Latvia as the Red Army withdrew. There they met a new enemy, the Baltische Landeswehr of Baltic Germans and the German Iron Division under General Rüdiger von der Goltz, which had taken Riga on 22 May and was pushing north.": "Au printemps, l’Armée rouge attaqua de nouveau le long du fleuve Narva et dans le sud-est, et Narva fut lourdement bombardé, mais les lignes estoniennes se tint. Le 13 mai, le Corps russe blanc du nord, basé en Estonie et sous commandement estonien, partit à l’offensive le long du golfe de Finlande, et les forces estoniennes prirent Pskov le 25 mai. Ils y rencontrèrent un nouvel ennemi, le Baltische Landeswehr des Allemands baltes et la division allemande du fer sous la direction du général Rüdiger von der Goltz, qui avait pris Riga le 22 mai et poussait vers le nord."
"The Germans attacked Estonian armoured trains on 5 June and took Cēsis the next day. After a short truce, the Iron Division and the Landeswehr attacked the Estonian 3rd Division and the North Latvian Brigade near Cēsis on 19 June. On 23 June the Estonians and Latvians counter-attacked, took Cēsis and drove the Germans back towards Riga; the day is Estonia’s Victory Day. On 3 July, with Estonian troops on the outskirts of Riga, an armistice was signed at Strazdumuiža under Allied pressure, and Kārlis Ulmanis’s Latvian government returned to Riga a few days later.": "Après une courte trêve, la division de fer et la Landeswehr attaquèrent la 3e division estonienne et la brigade nord lettone près de Cysis le 19 juin. Le 23 juin, les Estoniens et les Lettons contre-attaquent, prennent Cysis et ramènent les Allemands vers Riga ; c’est le jour de la victoire de l’Estonie. Le 3 juillet, avec les troupes estoniennes à la périphérie de Riga, un armistice a été signé à Strazdumuiža sous la pression des Alliés et le gouvernement letton Kārlis Ulmanis est retourné à Riga quelques jours plus tard."
