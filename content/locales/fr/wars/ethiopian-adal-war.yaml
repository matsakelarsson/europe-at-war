# French translations of the catalogue text (wave 12); step bodies follow later.
Ethiopian–Adal War: Guerre entre l’Éthiopie et l’Adal
? The conquest of most of the Christian Ethiopian highlands by the sultanate of Adal under Imam Ahmad ibn Ibrahim al-Ghazi, and their recovery with Portuguese help. Ahmad, a commander who had taken power in Adal from its sultans and made Harar his base, refused tribute to the emperor and declared a jihad. His army of Harari, Somali, Afar and Harla fighters, with matchlocks and a few cannon, defeated Emperor Lebna Dengel at Shimbra Kure in 1529 and at Antukyah and Amba Sel in 1531, and in the next years overran Dawaro, Shewa, Amhara, Lasta and much of Tigray, burning churches and monasteries, taking captives and converting many Christians. Lebna Dengel died a fugitive in 1540. In 1541 a Portuguese fleet landed about 400 musketeers under Cristóvão da Gama at Massawa; they won at Baçente and Jarte in 1542 but were overwhelmed at Wofla, where da Gama was captured and killed, after Ahmad had received Ottoman musketeers from Yemen. The survivors joined the new emperor Gelawdewos, and at Wayna Daga near Lake Tana on 21 February 1543 Ahmad was shot and killed and his army broke up. The war exhausted both states and opened the way for the Oromo expansion.
: La conquête de la plus grande partie des hauts plateaux chrétiens d’Éthiopie par le sultanat d’Adal sous l’imam Ahmad ibn Ibrahim al-Ghazi, puis leur reconquête avec l’aide des Portugais. Ahmad, un chef militaire qui avait pris le pouvoir en Adal aux dépens de ses sultans et fait de Harar sa base, refusa de payer tribut à l’empereur et proclama le djihad. Son armée de combattants hararis, somalis, afars et harlas, dotée d’arquebuses à mèche et de quelques canons, battit l’empereur Lebna Dengel à Shimbra Kure en 1529, puis à Antukyah et à Amba Sel en 1531 et, dans les années suivantes, envahit le Dawaro, le Choa, l’Amhara, le Lasta et une grande partie du Tigré, incendiant églises et monastères, faisant des captifs et convertissant de nombreux chrétiens. Lebna Dengel mourut en fugitif en 1540. En 1541, une flotte portugaise débarqua à Massaoua environ 400 mousquetaires commandés par Cristóvão da Gama ; ceux-ci l’emportèrent à Baçente et à Jarte en 1542, mais furent écrasés à Wofla, où da Gama fut capturé et tué, après qu’Ahmad eut reçu des mousquetaires ottomans venus du Yémen. Les survivants rejoignirent le nouvel empereur, Gelawdewos, et, à Wayna Daga, près du lac Tana, le 21 février 1543, Ahmad fut tué d’un coup de feu et son armée se dispersa. La guerre épuisa les deux États et ouvrit la voie à l’expansion oromo.
