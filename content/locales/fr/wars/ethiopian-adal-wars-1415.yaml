# French translations of the catalogue text (wave 12); step bodies follow later.
Ethiopian wars with Ifat and Adal (1415–1445): Guerres de l’Éthiopie contre l’Ifat et l’Adal (1415–1445)
Wars between the Solomonic emperors of Ethiopia and the Walashma sultans, first of Ifat and then of Adal, in the first half of the 15th century. Sa’ad ad-Din II, the last great sultan of Ifat, was besieged and killed at Zeila by an Ethiopian army, in 1403 under Dawit I according to al-Maqrizi, or in 1415 under Yeshaq according to a Walashma chronicle, and Ifat was overrun. His sons fled to the Rasulid court in Yemen, returned, and rebuilt their state farther east as the sultanate of Adal, from which they raided the Christian provinces for decades. Emperor Yeshaq (r. 1414–1429/1430) fought them for most of his reign and may have died in battle against Jamal ad-Din II. The wars ended for a generation when Zara Yaqob defeated and killed Sultan Badlay at Gomit in Dawaro on 25 December 1445.: Les guerres qui opposèrent les empereurs salomonides d’Éthiopie aux sultans walashma, d’abord de l’Ifat puis de l’Adal, dans la première moitié du XVe siècle. Sa’ad ad-Din II, le dernier grand sultan de l’Ifat, fut assiégé et tué à Zeila par une armée éthiopienne, en 1403 sous Dawit Ier selon al-Maqrizi, ou en 1415 sous Yeshaq selon une chronique walashma, et l’Ifat fut envahi. Ses fils se réfugièrent à la cour des Rassoulides au Yémen, puis revinrent et reconstituèrent leur État plus à l’est sous la forme du sultanat d’Adal, d’où ils lancèrent pendant des décennies des raids contre les provinces chrétiennes. L’empereur Yeshaq (règne 1414–1429/1430) les combattit pendant la plus grande partie de son règne et mourut peut-être au combat contre Jamal ad-Din II. Les guerres cessèrent pour une génération lorsque Zara Yaqob vainquit et tua le sultan Badlay à Gomit, dans le Dawaro, le 25 décembre 1445.
