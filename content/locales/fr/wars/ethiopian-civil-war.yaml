# French translations of the catalogue text (wave 12); step bodies follow later.
Ethiopian Civil War: Guerre civile éthiopienne
? "The seventeen years of war that followed the overthrow of Emperor Haile Selassie by the Derg, a committee of army officers and soldiers, in September 1974. Under Mengistu Haile Mariam the Derg declared Ethiopia a Marxist–Leninist state, nationalised the land, and fought a long list of opponents with Soviet and Cuban support: the Eritrean fronts, the Tigray People’s Liberation Front (TPLF), the Oromo Liberation Front, the Western Somali Liberation Front and Somalia, the monarchist Ethiopian Democratic Union, and in the cities the Ethiopian People’s Revolutionary Party, which it crushed in the Red Terror of 1976–1978. The famine of 1983–1985, worsened by war and by the government’s counterinsurgency, killed some 400,000 to a million people. From 1988 the rebels gained the upper hand: the Eritrean People’s Liberation Front destroyed a Derg army at Afabet, the TPLF drove the government out of Tigray after the battle of Shire in 1989, and the TPLF-led Ethiopian People’s Revolutionary Democratic Front (EPRDF) advanced on Addis Ababa. Mengistu fled on 21 May 1991, the EPLF took Asmara on 24 May and the EPRDF entered the capital on 28 May. At least 1.4 million people died in the war and the famines, and Eritrea became independent in 1993."
: "Les dix-sept années de guerre qui suivirent le renversement de l’empereur Hailé Sélassié par le Derg, un comité d’officiers et de soldats de l’armée, en septembre 1974. Sous Mengistu Haile Mariam, le Derg fit de l’Éthiopie un État marxiste-léniniste, nationalisa la terre et combattit, avec le soutien soviétique et cubain, une longue liste d’adversaires : les fronts érythréens, le Front populaire de libération du Tigré (TPLF), le Front de libération oromo, le Front de libération de la Somalie occidentale et la Somalie, l’Union démocratique éthiopienne, monarchiste, et, dans les villes, le Parti révolutionnaire du peuple éthiopien, qu’il écrasa lors de la Terreur rouge de 1976–1978. La famine de 1983–1985, aggravée par la guerre et par la contre-insurrection gouvernementale, fit quelque 400 000 à un million de morts. À partir de 1988, les rebelles prirent l’avantage : le Front populaire de libération de l’Érythrée anéantit une armée du Derg à Afabet, le TPLF chassa le gouvernement du Tigré après la bataille de Shire, en 1989, et le Front démocratique révolutionnaire du peuple éthiopien (FDRPE), dirigé par le TPLF, marcha sur Addis-Abeba. Mengistu s’enfuit le 21 mai 1991, le FPLE prit Asmara le 24 mai et le FDRPE entra dans la capitale le 28 mai. Au moins 1,4 million de personnes moururent dans la guerre et les famines, et l’Érythrée devint indépendante en 1993."
