# French translations of the catalogue text (wave 12); step bodies follow later.
Ethiopian–Egyptian War: Guerre égypto-éthiopienne
"Khedive Isma’il of Egypt’s attempt to extend his African empire into the Ethiopian highlands. Egypt had taken over Massawa from the Ottomans in 1865 and occupied the Bogos country around Keren in 1872, and in 1875 its forces took Zeila, Berbera and the emirate of Harar. In the autumn of 1875 two columns marched inland against Ethiopia: Werner Munzinger’s from Tadjoura was destroyed by the forces of the sultan of Aussa, and Colonel Arendrup’s from Massawa was annihilated by Emperor Yohannes IV’s army at Gundet near the Mareb on 16 November 1875. A larger army under Ratib Pasha, with the American general William Loring as chief of staff, entrenched on the plain of Gura and was defeated on 7–9 March 1876. No peace was signed; Egypt kept Massawa, Bogos and Harar for some years, and the war’s cost added to the debts that led to Isma’il’s fall in 1879. Shalaqa Alula, the hero of both battles, became Ras Alula and governor of the northern frontier.": "La tentative du khédive d’Égypte Ismaïl d’étendre son empire africain aux hauts plateaux éthiopiens. L’Égypte avait reçu Massaoua des Ottomans en 1865 et occupé le pays des Bogos, autour de Keren, en 1872 ; en 1875, ses forces prirent Zeila, Berbera et l’émirat de Harar. À l’automne 1875, deux colonnes marchèrent vers l’intérieur contre l’Éthiopie : celle de Werner Munzinger, partie de Tadjourah, fut détruite par les forces du sultan de l’Aussa, et celle du colonel Arendrup, partie de Massaoua, fut anéantie par l’armée de l’empereur Yohannes IV à Gundet, près du Mareb, le 16 novembre 1875. Une armée plus nombreuse, commandée par Ratib Pacha, avec le général américain William Loring pour chef d’état-major, se retrancha dans la plaine de Gura et fut battue du 7 au 9 mars 1876. Aucune paix ne fut signée ; l’Égypte conserva Massaoua, le pays des Bogos et Harar pendant quelques années, et le coût de la guerre alourdit les dettes qui entraînèrent la chute d’Ismaïl en 1879. Le shalaqa Alula, héros des deux batailles, devint ras Alula et gouverneur de la frontière septentrionale."
