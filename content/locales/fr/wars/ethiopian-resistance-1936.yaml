# French translations of the catalogue text (wave 12); step bodies follow later.
Ethiopian resistance to Italian rule: Résistance éthiopienne à la domination italienne
? Five years of guerrilla war against the Italian occupation of Ethiopia. After the fall of Addis Ababa in May 1936, nobles, soldiers and peasants fought on as the Arbegnoch, the Patriots. Their first attempts, an attack on the capital in July 1936 and the stand of Ras Imru and the Black Lions in the west, ended in surrender and executions, and after the attempt on Viceroy Graziani’s life in February 1937 the Italians answered with mass killings in Addis Ababa and at the monastery of Debre Libanos. The killings drove more people to the Patriots. From 1937 risings in Lasta, Begemder and Gojjam, and the bands of Abebe Aregai in Shewa, kept large parts of the highlands out of Italian control; a more conciliatory viceroy, the Duke of Aosta, could not end the war, and Italian troops used gas in the Zeret cave in 1939. When Italy entered the Second World War in June 1940, Britain armed the Patriots, and in January 1941 Haile Selassie re-entered Ethiopia with Gideon Force. He returned to Addis Ababa on 5 May 1941, five years to the day after the Italians had taken it, escorted by thousands of Patriots.
: Cinq années de guérilla contre l’occupation italienne de l’Éthiopie. Après la chute d’Addis-Abeba, en mai 1936, des nobles, des soldats et des paysans poursuivirent le combat sous le nom d’Arbegnoch, les Patriotes. Leurs premières tentatives, une attaque contre la capitale en juillet 1936 et la résistance du ras Imru et des Lions noirs dans l’ouest, se soldèrent par des redditions et des exécutions et, après l’attentat contre le vice-roi Graziani en février 1937, les Italiens répondirent par des tueries de masse à Addis-Abeba et au monastère de Debre Libanos. Ces tueries poussèrent davantage de gens à rejoindre les Patriotes. À partir de 1937, des soulèvements dans le Lasta, le Begemder et le Godjam, ainsi que les bandes d’Abebe Aregai dans le Choa, soustrayèrent de vastes parties des hauts plateaux au contrôle italien ; un vice-roi plus conciliant, le duc d’Aoste, ne parvint pas à mettre fin à la guerre, et les troupes italiennes employèrent des gaz dans la grotte de Zeret en 1939. Lorsque l’Italie entra dans la Seconde Guerre mondiale, en juin 1940, la Grande-Bretagne arma les Patriotes et, en janvier 1941, Hailé Sélassié rentra en Éthiopie avec la Gideon Force. Il fit son retour à Addis-Abeba le 5 mai 1941, cinq ans jour pour jour après la prise de la ville par les Italiens, escorté de milliers de Patriotes.
