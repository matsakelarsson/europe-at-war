# French translations of the catalogue text (wave 12); step bodies follow later.
Ethiopian–Somali Border War: Guerre frontalière éthio-somalienne
? A short border war between Ethiopia and the Somali Republic over the Ogaden, the Somali-inhabited east of Ethiopia that Somalia claimed as part of a Greater Somalia. In June 1963 Ogaden Somalis led by Mukhtar Dahir (“Nasrallah”) rose against Ethiopian tax collection; Ethiopia accused Somalia of arming them, which Somalia denied, and answered with reprisals against herders and villages. After clashes from mid-January 1964, both governments declared states of emergency on 8 February. Ethiopia, with some 55,000–60,000 troops and F-86 Sabre jets, against about 9,000–11,000 Somali soldiers and up to 3,000 Ogaden fighters, fought tank and artillery battles around Tog Wajaale (Togochale) on the northern border and bombed Feerfeer, Galkayo, Buuhoodle and other Somali towns, and the war spread south to Dolow on the Kenyan border. Ceasefires called by the Soviet Union and the Organisation of African Unity failed; Sudan’s president Ibrahim Abboud mediated a ceasefire on 30 March, and fighting ended on 2 April 1964, followed by an accord in Khartoum to withdraw troops and stop hostile propaganda. Both sides claimed victory, and neither gained ground; an estimated 1,000–2,000 people were killed. Somalia rejected the OAU’s Cairo declaration of July 1964 that colonial borders should stand, and the dispute led to the Ogaden War of 1977–1978.
: Une brève guerre frontalière entre l’Éthiopie et la République somalienne au sujet de l’Ogaden, l’est de l’Éthiopie peuplé de Somalis, que la Somalie revendiquait comme partie d’une Grande Somalie. En juin 1963, des Somalis de l’Ogaden menés par Mukhtar Dahir (« Nasrallah ») se soulevèrent contre la levée de l’impôt par l’Éthiopie ; celle-ci accusa la Somalie de les armer, ce que la Somalie nia, et répondit par des représailles contre les éleveurs et les villages. Après des accrochages à partir de la mi-janvier 1964, les deux gouvernements proclamèrent l’état d’urgence le 8 février. L’Éthiopie, avec quelque 55 000–60 000 soldats et des chasseurs à réaction F-86 Sabre, face à environ 9 000–11 000 soldats somaliens et jusqu’à 3 000 combattants de l’Ogaden, livra des batailles de chars et d’artillerie autour de Tog Wajaale (Togochale), sur la frontière nord, et bombarda Feerfeer, Galkayo, Buuhoodle et d’autres villes somaliennes ; la guerre s’étendit vers le sud jusqu’à Dolow, à la frontière kényane. Les cessez-le-feu demandés par l’Union soviétique et l’Organisation de l’unité africaine échouèrent ; le président soudanais Ibrahim Abboud obtint par sa médiation un cessez-le-feu le 30 mars, et les combats cessèrent le 2 avril 1964 ; un accord conclu ensuite à Khartoum prévit le retrait des troupes et l’arrêt de la propagande hostile. Les deux camps revendiquèrent la victoire, sans qu’aucun ne gagne de terrain ; on estime que 1 000 à 2 000 personnes furent tuées. La Somalie rejeta la déclaration du Caire de l’OUA de juillet 1964, selon laquelle les frontières coloniales devaient être maintenues, et le différend mena à la guerre de l’Ogaden de 1977–1978.
