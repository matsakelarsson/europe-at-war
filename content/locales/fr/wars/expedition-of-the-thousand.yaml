May – July 1860: mai – juillet 1860
A revolt in Palermo on 4 April 1860 was quickly put down but lived on in the countryside. Garibaldi gathered volunteers near Genoa, and Cavour, Sardinia’s prime minister, neither stopped nor openly helped him. On the night of 5–6 May about 1,100 men, most of them from Lombardy, Venetia and Liguria and many of them students and artisans, sailed from Quarto in two steamers and landed at Marsala on 11 May. At Salemi Garibaldi declared himself dictator of Sicily in the name of King Victor Emmanuel II. On 15 May at Calatafimi his volunteers, with Sicilian irregulars, drove a larger Neapolitan force off a terraced hill.: Une révolte à Palerme le 4 avril 1860 fut rapidement abattue mais vécut dans la campagne. Garibaldi rassembla des volontaires près de Gênes, et Cavour, Premier ministre de Sardaigne, ne s’arrêta ni ne l’aida ouvertement. Dans la nuit du 5 au 6 mai, environ 1100 hommes, pour la plupart de Lombardie, Vénétie et Ligurie et beaucoup d’entre eux étudiants et artisans, ont navigué de Quarto en deux vapeurs et atterri à Marsala le 11 mai. À Salémi Garibaldi s’est déclaré dictateur de Sicile au nom du roi Victor Emmanuel II. Le 15 mai à Calatafimi, ses volontaires, avec des irréguliers siciliens, ont conduit une force napolitaine plus grande au large d’une colline en terrasse.
Garibaldi feinted towards Corleone, then broke into Palermo on 27 May. After three days of street fighting, while Bourbon warships and the fortress shelled the city, the garrison of some 20,000 men agreed to an armistice and in June left by sea. Volunteers poured in from the north, and on 20 July Garibaldi defeated the Neapolitans at Milazzo; Messina was given up at the end of July, though its citadel held out. Peasants who rose against their landlords in the hope of land met harsh repression, and at Bronte in August Garibaldi’s lieutenant Nino Bixio had five men shot after a summary trial.: Garibaldi feint en direction de Corleone, puis s’introduit à Palerme le 27 mai. Après trois jours de combats de rue, tandis que les navires de guerre Bourbon et la forteresse bombardaient la ville, la garnison d’environ 20 000 hommes accepta un armistice et en juin laissé par la mer. Des volontaires affluèrent du nord et, le 20 juillet, Garibaldi battit les Néapolitains à Milazzo ; Messina fut abandonnée fin juillet, bien que sa citadelle se détachât. Les paysans qui s’éleva contre leurs propriétaires dans l’espoir de la terre rencontrèrent une répression sévère, et à Bronte en août Garibaldi, le lieutenant Nino Bixio fit tirer cinq hommes après un procès sommaire.
