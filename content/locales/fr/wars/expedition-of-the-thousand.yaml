Castelfidardo and Gaeta: Castelfidardo et Gaeta
September 1860 – March 1861: septembre 1860 – mars 1861
To keep Garibaldi from marching on Rome, which would have meant war with France, and to take his revolution in hand, Cavour sent the Sardinian army into the Papal Marche and Umbria on 11 September, with Napoleon III’s tacit consent. On 18 September General Enrico Cialdini defeated the Papal army of the French general Christophe de Lamoricière, which included Catholic volunteers from France, Belgium and Ireland, at Castelfidardo near Loreto, and on 29 September Ancona surrendered after a siege by land and sea. Victor Emmanuel then led his army south through the Abruzzi into the Kingdom of Naples.: Pour empêcher Garibaldi de marcher sur Rome, ce qui aurait signifié la guerre à la France, et pour prendre sa révolution en main, Cavour envoya l’armée sarde dans les Marches pontificales et en Ombrie le 11 septembre, avec le consentement tacite de Napoléon III. Le 18 septembre, le général Enrico Cialdini défait l’armée papale du général français Christophe de Lamoricière, qui comprenait des volontaires catholiques de France, de Belgique et d’Irlande, à Castelfidardo près de Loreto, et le 29 septembre, Ancône se rendit après un siège terrestre et maritime. Victor Emmanuel conduisit ensuite son armée au sud par les Abruzzes dans le royaume de Naples.
Francis II and Queen Maria Sophia held out in Gaeta with what remained of the Bourbon army. Cialdini besieged the fortress from 5 November; a French squadron kept the sea open until January 1861, and on 13 February, short of supplies and struck by typhus after weeks of bombardment, the garrison surrendered. The royal couple went into exile in Rome. The first Italian parliament proclaimed Victor Emmanuel King of Italy on 17 March 1861, and the last Bourbon strongholds, the citadel of Messina and Civitella del Tronto, surrendered in March. Rome and Venetia remained outside the new kingdom, and in the south a long guerrilla war began.: François II et la reine Maria Sophia ont tenu à Gaeta avec ce qui restait de l’armée Bourbon. Cialdini a assiégé la forteresse du 5 novembre ; un escadre français a gardé la mer ouverte jusqu’en janvier 1861, et le 13 février, à court de fournitures et frappé par le typhus après des semaines de bombardement, la garnison s’est rendue. Le couple royal est allé en exil à Rome. Le premier parlement italien proclama Victor Emmanuel King d’Italie le 17 mars 1861, et les derniers bastions Bourbon, la citadelle de Messine et Civitella del Tronto, se rendirent en mars. Rome et Vénétie demeurèrent hors du nouveau royaume, et au sud une longue guerre de guérilla commença.
