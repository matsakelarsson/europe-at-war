August – October 1860: août – octobre 1860
On the night of 18–19 August Garibaldi crossed the Strait of Messina with about 3,700 men, landed near Melito and took Reggio on 21 August. The Bourbon army in Calabria, demoralised and badly led, surrendered or melted away, and Garibaldi advanced so fast that he outran most of his troops. King Francis II left Naples on 6 September for the fortress of Gaeta, and the next day Garibaldi arrived in the capital by train with a few companions and was greeted by cheering crowds.: Dans la nuit du 18 au 19 août, Garibaldi traversa le détroit de Messine avec environ 3 700 hommes, débarqua près de Melito et prit Reggio le 21 août. L’armée Bourbon en Calabre, démoralisée et mal dirigée, se rendit ou fondit, et Garibaldi progressa si vite qu’il surpassa la plupart de ses troupes. Le roi François II quitta Naples le 6 septembre pour la forteresse de Gaeta, et le lendemain Garibaldi arriva dans la capitale en train avec quelques compagnons et fut accueilli par des foules encourageantes.
Francis II still had a large and loyal army on the Volturno, around the fortress of Capua. On 1–2 October it attacked Garibaldi’s volunteers along the river in the largest battle of the campaign, and was beaten back with help from Sardinian troops landed at Naples. Plebiscites on 21 October approved union with Sardinia by huge majorities, though voting was public and critics doubted the result. On 26 October Garibaldi met Victor Emmanuel near Teano and greeted him as King of Italy. He handed over his conquests and on 9 November sailed home to the island of Caprera.: François II avait encore une grande et loyale armée sur le Volturno, autour de la forteresse de Capua. Le 1-2 octobre, il attaqua les volontaires Garibaldi dans la plus grande bataille de la campagne, et fut battu avec l’aide des troupes sardes débarqué à Naples. Plébiscites le 21 octobre a approuvé l’union avec la Sardaigne par d’énormes majorités, bien que le vote était public et critiques doute du résultat. Le 26 octobre, Garibaldi rencontra Victor Emmanuel près de Teano et le salua comme roi d’Italie. Il livra ses conquêtes et, le 9 novembre, il rentra sur l’île de Caprera.
