Expedition of the Thousand: Expédition des mille
The campaign in which Giuseppe Garibaldi and about a thousand volunteers landed in Sicily in May 1860 and, joined by Sicilian insurgents and thousands more volunteers, overthrew the Bourbon Kingdom of the Two Sicilies. The Sardinian army meanwhile took the Marche and Umbria from the Papal States and besieged King Francis II in Gaeta, which surrendered in February 1861; the south was joined to the new Kingdom of Italy, proclaimed on 17 March 1861.: La campagne dans laquelle Giuseppe Garibaldi et environ un millier de volontaires débarquèrent en Sicile en mai 1860 et, rejoints par des insurgés siciliens et des milliers d’autres volontaires, renversa le Royaume Bourbon des Deux Sicilies. Pendant ce temps, l’armée sarde prit les Marches et l’Ombrie des États pontificaux et assiégea le roi François II à Gaeta, qui se rendit en février 1861 ; le sud fut joint au nouveau Royaume d’Italie, proclamé le 17 mars 1861.
Garibaldi’s force grew from about 1,100 men at the start to tens of thousands, organised from July as the Southern Army; its volunteers wore the red shirts that gave them their name, the Redshirts. Sicily and Naples formally joined the Kingdom of Sardinia after the plebiscites of 21 October 1860.: La force de Garibaldi est passée d’environ 1100 hommes au début à des dizaines de milliers, organisés depuis juillet comme l’Armée du Sud ; ses volontaires portaient les chemises rouges qui leur ont donné leur nom, les Redshirts. La Sicile et Naples ont officiellement rejoint le Royaume de Sardaigne après les plébiscites du 21 octobre 1860.
