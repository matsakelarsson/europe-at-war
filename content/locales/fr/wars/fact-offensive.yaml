# French translations of the catalogue text (wave 12); step bodies follow later.
FACT offensive in Chad: Offensive du FACT au Tchad
? An invasion of northern Chad from Libya by the Front for Change and Concord in Chad (FACT), during which President Idriss Déby was killed. FACT, led by Mahamat Mahdi Ali and drawing many of its fighters from the Goran (Daza) of the north, had been based in southern Libya, where a UN panel of experts placed it at the al-Jufra air base used by the forces of Khalifa Haftar and by the Russian Wagner Group. On 11 April 2021, the day of the presidential election in which Déby sought a sixth term, FACT columns of pickup trucks attacked a border post in the Tibesti and drove south through the desert towards N’Djamena. On 19 April, as the army fought them in Kanem near Nokou and Mao, some 250–300 km north of the capital, Déby was wounded at the front; his death was announced on 20 April, a day after provisional results had given him about 79 per cent of the vote. A Transitional Military Council under his son, General Mahamat Idriss Déby, suspended the constitution and dissolved parliament, and France, Chad’s main ally, accepted the takeover as necessary in exceptional circumstances; at least six protesters were killed in N’Djamena and the south when people demanded a civilian transition. The army drove the rebels back towards Niger and Libya and declared victory on 9 May; by its own figures it had killed some 540 rebels and captured about 210, and gave its own losses as 11 killed and 58 wounded; none of these figures could be checked. FACT refused to sign the peace agreement that the junta and some forty other rebel groups signed in Doha in August 2022. In March 2023 a court in N’Djamena sentenced more than 400 FACT members to life imprisonment for the attack; Mahamat Déby pardoned 380 of them days later, but not Mahamat Mahdi Ali, who was sentenced in his absence. Mahamat Déby was elected president in May 2024.
: Une invasion du nord du Tchad depuis la Libye par le Front pour l’alternance et la concorde au Tchad (FACT), au cours de laquelle le président Idriss Déby a été tué. Le FACT, dirigé par Mahamat Mahdi Ali et recrutant nombre de ses combattants parmi les Goranes (Daza) du nord, était basé dans le sud de la Libye, où un groupe d’experts de l’ONU l’a situé sur la base aérienne d’al-Joufra, utilisée par les forces de Khalifa Haftar et par le groupe russe Wagner. Le 11 avril 2021, jour de l’élection présidentielle où Déby briguait un sixième mandat, des colonnes de pick-up du FACT ont attaqué un poste frontière dans le Tibesti, puis ont foncé vers le sud à travers le désert en direction de N’Djamena. Le 19 avril, alors que l’armée les combattait au Kanem, près de Nokou et de Mao, à quelque 250–300 km au nord de la capitale, Déby a été blessé au front ; sa mort a été annoncée le 20 avril, au lendemain de résultats provisoires qui lui accordaient environ 79 % des voix. Un Conseil militaire de transition dirigé par son fils, le général Mahamat Idriss Déby, a suspendu la Constitution et dissous le Parlement, et la France, principal allié du Tchad, a accepté cette prise de pouvoir comme nécessaire en des circonstances exceptionnelles ; au moins six manifestants ont été tués à N’Djamena et dans le sud lorsque la population a réclamé une transition civile. L’armée a repoussé les rebelles vers le Niger et la Libye et a proclamé sa victoire le 9 mai ; selon ses propres chiffres, elle avait tué quelque 540 rebelles et en avait capturé environ 210, et elle a fait état de 11 tués et 58 blessés dans ses rangs ; aucun de ces chiffres n’a pu être vérifié. Le FACT a refusé de signer l’accord de paix que la junte et une quarantaine d’autres groupes rebelles ont signé à Doha en août 2022. En mars 2023, un tribunal de N’Djamena a condamné plus de 400 membres du FACT à la réclusion à perpétuité pour l’attaque ; Mahamat Déby en a gracié 380 quelques jours plus tard, mais pas Mahamat Mahdi Ali, condamné par contumace. Mahamat Déby a été élu président en mai 2024.
