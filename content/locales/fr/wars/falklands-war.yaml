# Some French text was translated automatically.
"Falklands War": "Guerre des Malouines"
"A ten-week war between Argentina and the United Kingdom over the Falkland Islands and South Georgia in the South Atlantic, British territories that Argentina claims as the Malvinas. Argentina’s military government invaded the Falklands on 2 April 1982 and South Georgia the next day. Britain sent a naval task force, retook South Georgia on 25 April and declared an exclusion zone around the Falklands. On 2 May a British submarine sank the Argentine cruiser General Belgrano, with the loss of 323 lives, and Argentine aircraft went on to sink several British ships, among them the destroyer HMS Sheffield. British troops landed at San Carlos on 21 May, won at Goose Green and in the hills around Stanley, and the Argentine garrison surrendered on 14 June. In all 649 Argentine and 255 British servicemen and three islanders were killed. The defeat brought down the Argentine junta, and democracy returned to Argentina in 1983; Argentina still claims the islands.": "Une guerre de dix semaines entre l’Argentine et le Royaume-Uni sur les îles Falkland et la Géorgie du Sud dans l’Atlantique Sud, territoires britanniques que l’Argentine prétend comme les Malvinas. Argentine Le gouvernement militaire a envahi les îles Falkland le 2 avril 1982 et la Géorgie du Sud le lendemain. Le 2 mai, un sous-marin britannique a coulé le croiseur argentin, le général Belgrano, avec la mort de 323 personnes, et des avions argentins ont coulé plusieurs navires britanniques, dont le destroyer HMS Sheffield. Les troupes britanniques ont atterri à San Carlos le 21 mai, ont gagné à Goose Green et dans les collines autour de Stanley, et la garnison argentine s’est rendue le 14 juin. La défaite a fait tomber la junte argentine, et la démocratie est revenue en Argentine en 1983 ; l’Argentine revendique toujours les îles."
"Known in Argentina as the Malvinas War (Guerra de las Malvinas). Neither country formally declared war. The islands lie far outside the map.": "Connu en Argentine comme la guerre des Malvinas (Guerra de las Malvinas). Aucun pays n’a officiellement déclaré la guerre."
