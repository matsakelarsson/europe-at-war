"Rumeli Hisarı and the preparations": "Rumeli Hisarı et les préparations"
"1452 – March 1453": "1452 – mars 1453"
"Mehmed II became sultan for the second time in February 1451, aged 19, and set out to take Constantinople, by then a shrunken city of perhaps 50,000 people surrounded by Ottoman lands. In the spring of 1452 he had a fortress built on the European shore of the Bosporus at its narrowest point, opposite the Anadolu Hisarı of his great-grandfather Bayezid I. Finished in about four months, Rumeli Hisarı, which the Turks called Boğazkesen, the cutter of the strait or of the throat, let his guns control all shipping to and from the Black Sea. In November a Venetian ship that refused to stop was sunk and its captain, Antonio Rizzo, impaled.": "Mehmed II devint sultan pour la deuxième fois en février 1451, âgé de 19 ans, et partit prendre Constantinople, alors une ville éparpillée d’environ 50 000 personnes entourées de terres ottomanes. Au printemps de 1452, il fit construire une forteresse sur la rive européenne du Bospore à son point le plus étroit, face à l’Anadolu Hisarı de son arrière-grand-père Bayezid Ier. Terminé en environ quatre mois, Rumeli Hisarı, que les Turcs ont appelé Boğazkesen, le coupeur du détroit ou de la gorge, laissez ses canons contrôler toutes les expéditions vers et depuis la mer Noire. En novembre un navire vénitien qui a refusé d’arrêter a été coulé et son capitaine, Antonio Rizzo, empalé."
"Emperor Constantine XI looked to the West for help. To win it, the union of the Orthodox and Catholic churches agreed at Florence in 1439 was proclaimed in Hagia Sophia on 12 December 1452, to the anger of many Greeks. The help was small. In January 1453 the Genoese soldier Giovanni Giustiniani Longo arrived with about 700 men, and Venetian ships in the harbour agreed to stay and fight, but the fleet voted by Venice in February sailed too late. Meanwhile Orban, a Hungarian gun-founder, cast huge bronze guns for Mehmed at Adrianople, and Turahan Bey invaded the Morea to keep the emperor’s brothers busy.": "Pour la gagner, l’union des églises orthodoxes et catholiques, convenue à Florence en 1439, a été proclamée à Hagia Sophia le 12 décembre 1452, à la colère de nombreux Grecs. L’aide était petite. En janvier 1453 le soldat génois Giovanni Giustiniani Longo arriva avec environ 700 hommes, et les navires vénitiens dans le port acceptèrent de rester et de se battre, mais la flotte votée par Venise en février navigua trop tard. Orban, un canon hongrois-fondateur, jeta d’énormes canons en bronze pour Mehmed à Adrianople, et Turahan Bey envahit la Morea pour garder les frères empereurs occupés."
