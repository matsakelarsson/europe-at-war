"1453–1461": "1453–1461"
"Mehmed made Constantinople his capital. Genoese Pera surrendered and on 1 June received a charter protecting its people’s property and trade. To fill the half-empty city he brought in settlers, Muslim, Christian and Jewish, from across his lands, many of them by force, and in January 1454 he installed the monk Gennadios Scholarios, an opponent of church union, as patriarch and head of the Orthodox community. The Old Palace was built, and from 1459 the Topkapı palace on the old acropolis. The city remained the Ottoman capital until 1922.": "Mehmed fit de Constantinople sa capitale. Genoese Pera se rendit et reçut le 1er juin une charte protégeant les biens et le commerce de son peuple. Pour remplir la ville à moitié vide, il apporta des colons, musulmans, chrétiens et juifs, de l’autre côté de ses terres, beaucoup d’entre eux par la force, et en janvier 1454, il installa le moine Gennadios Scholarios, un adversaire de l’union religieuse, comme patriarche et chef de la communauté orthodoxe. Le vieux palais fut construit, et à partir de 1459 le palais Topkapı sur l’ancienne acropole. La ville resta la capitale ottomane jusqu’en 1922."
"The rest of the Byzantine world soon followed. The Ottomans took Athens in 1456 and its Acropolis in 1458, and in 1458–1460 Mehmed conquered the Despotate of the Morea, ruled by Constantine’s quarrelling brothers; Mystras surrendered on 29 May 1460, seven years to the day after Constantinople. Trebizond, the empire of the Komnenoi on the Black Sea, fell on 15 August 1461. Greek scholars carried manuscripts and learning to Italy. The fall shocked western Europe, but Pope Pius II died at Ancona in 1464 waiting for a crusade that never sailed.": "Les Ottomans prirent Athènes en 1456 et son Acropole en 1458, et en 1458–1460 Mehmed conquiert le Despotat de la Morea, dirigé par les frères querelleurs Constantin ; Mystras se rendit le 29 mai 1460, sept ans après Constantinople. Trebizond, l’empire du Komnenoi sur la mer Noire, tomba le 15 août 1461. Des savants grecs portèrent des manuscrits et apprenaient en Italie. La chute choqua l’Europe occidentale, mais le pape Pie II mourut à Ancone en 1464 en attendant une croisade qui n’a jamais navigué."
