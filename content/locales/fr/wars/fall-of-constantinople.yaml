# Some French text was translated automatically.
"Fall of Constantinople": "Chute de Constantinople"
"The siege and capture of Constantinople, capital of the Byzantine Empire for more than a thousand years, by the Ottoman sultan Mehmed II. After blocking the Bosporus with the fortress of Rumeli Hisarı in 1452, Mehmed besieged the city from 6 April 1453 with a large army, a fleet and great bronze guns; its few thousand Greek and Italian defenders held out for 53 days until the final assault of 29 May, in which Emperor Constantine XI was killed. Mehmed made the city his capital, and the last Byzantine states in the Morea and at Trebizond fell by 1461.": "Le siège et la prise de Constantinople, capitale de l’Empire byzantin depuis plus de mille ans, par le sultan ottoman Mehmed II. Après avoir bloqué le Bospore avec la forteresse de Rumeli Hisarı en 1452, Mehmed assiégea la ville à partir du 6 avril 1453 avec une grande armée, une flotte et de grands canons de bronze ; ses quelques milliers de défenseurs grecs et italiens se tint pendant 53 jours jusqu’à l’assaut final du 29 mai, dans lequel l’empereur Constantin XI a été tué. Mehmed fit de la ville sa capitale, et les derniers états byzantins dans la Morea et à Trebizond tombaient en 1461."
"Dates are Julian, as usual for the period. The main eyewitness accounts, by the Venetian ship’s doctor Nicolò Barbaro, the Byzantine official George Sphrantzes and others, disagree on many details, and the later Greek historians Doukas, Kritoboulos and Chalkokondyles add stories of their own, such as the open postern of the Kerkoporta.": "Les dates sont Julian, comme d’habitude pour la période. Les principaux témoins oculaires, par le médecin vénitien Nicolò Barbaro, l’officiel byzantin George Sphrantzes et d’autres, ne sont pas d’accord sur de nombreux détails, et les historiens grecs plus tard Doukas, Kritoboulos et Chalkokondyles ajoutent des histoires de leurs propres, tels que la affiche ouverte du Kerkoporta."
"Numbers are uncertain. Contemporaries gave the Ottomans 160,000 men or more; modern estimates range from about 50,000 to 100,000, against some 7,000 defenders.": "Les chiffres sont incertains. Les contemporains ont donné aux Ottomans 160 000 hommes ou plus ; les estimations modernes vont d’environ 50 000 à 100 000, contre quelque 7 000 défenseurs."
"The Ottomans called the city Kostantiniyye as well as Istanbul, the name that became official in the 20th century. The Genoese colony of Pera (Galata), across the Golden Horn, was officially neutral during the siege.": "Les Ottomans ont appelé la ville Kostantiniya ainsi qu’Istanbul, le nom qui est devenu officiel au 20ème siècle. La colonie génoise de Pera (Galata), à travers la Corne d’Or, a été officiellement neutre pendant le siège."
