"20 April – 25 May 1453": "20 avril – 25 mai 1453"
"On 20 April three Genoese ships hired by the pope and a Byzantine grain transport came up the Sea of Marmara. Baltoğlu’s galleys swarmed around them in full view of the walls and of the sultan, who rode his horse into the shallows, but the tall sailing ships, fighting from above, held them off and slipped behind the chain at nightfall. Mehmed had Baltoğlu flogged and dismissed. Two days later he had some seventy ships hauled on greased rollers from the Bosporus at the Double Columns over the hill behind Pera and launched into the Golden Horn at the Valley of the Springs.": "Le 20 avril, trois navires génois loués par le pape et un transport de grain byzantin montèrent sur la mer de Marmara. Les galères de Baltoğlu chauffaient autour d’eux en pleine vue des murs et du sultan, qui montait son cheval dans les eaux peu profondes, mais les grands voiliers, se battant d’en haut, les retenaient et glissa derrière la chaîne à la tombée de la nuit. Deux jours plus tard, il fit tirer sur des rouleaux graisseux du Bospore à la double colonne de la colline derrière Pera et le lança dans la Corne d’Or à la vallée des Springs."
"The defenders now had to man the harbour walls too. A night attack with fireships on 28 April, led by the Venetian Giacomo Coco, was betrayed and failed; Mehmed had captured sailors impaled in sight of the walls, and the defenders beheaded some 260 Turkish prisoners on the ramparts. The Ottomans built a pontoon bridge across the upper harbour. Serbian miners from Novo Brdo dug tunnels towards the walls at Blachernae, but an engineer named Johannes Grant countermined and destroyed them between 16 and 25 May, and a great siege tower was burnt. On 21 May Mehmed offered terms; Constantine refused to give up the city.": "Le 28 avril, une attaque de nuit avec des navires de feu, menée par le Vénitien Giacomo Coco, fut trahie et échouée ; Mehmed avait capturé des marins empalés en vue des murs, et les défenseurs ont décapité quelque 260 prisonniers turcs sur les remparts. Les Ottomans construisirent un ponton à travers le port supérieur. Des mineurs serbes de Novo Brdo ont creusé des tunnels vers les murs de Blachernae, mais un ingénieur du nom de Johannes Grant les a contre-aminés et détruits entre le 16 et le 25 mai, et une grande tour de siège a été incendiée."
