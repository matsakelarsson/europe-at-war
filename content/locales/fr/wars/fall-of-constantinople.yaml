"29 May 1453": "29 mai 1453"
"After a day of rest and prayer in the Ottoman camp, and a last service of both Greeks and Latins in Hagia Sophia on the evening of 28 May, the general assault began after midnight on Tuesday 29 May. Mehmed sent in his irregular troops first, then the Anatolian regiments, against the breach in the Lycus valley and the weaker walls at Blachernae; both waves were thrown back. As the janissaries came on in the third wave towards dawn, Giustiniani was badly wounded and carried to a ship, and his men began to fall back. By one account Ottoman soldiers also found a small gate, the Kerkoporta, left open and raised their flag on a tower.": "Après une journée de repos et de prière dans le camp ottoman, et un dernier service des Grecs et des Latins à Hagia Sophia dans la soirée du 28 mai, l’assaut général a commencé après minuit mardi 29 mai. Mehmed a envoyé ses troupes irrégulières d’abord, puis les régiments anatoliens, contre la brèche dans la vallée de Lycus et les murs plus faibles à Blachernae ; les deux vagues ont été repoussées. Alors que les janissaires arrivèrent dans la troisième vague vers l’aube, Giustiniani fut gravement blessé et porté à un navire, et ses hommes commencèrent à tomber. D’un côté, les soldats ottomans trouvèrent aussi une petite porte, le Kerkoporta, qui s’ouvrit et souleva leur drapeau sur une tour."
"The janissaries broke in near the Gate of St Romanus. Constantine XI threw himself into the fighting and was never seen again; his fate is unknown. By midday the city was in Ottoman hands, and some Venetian, Genoese and Byzantine ships escaped from the harbour crowded with refugees. Mehmed had promised his soldiers three days of plunder; the city was sacked, thousands of people were killed and some 30,000, by one estimate, were enslaved. Mehmed rode to Hagia Sophia and had it turned into a mosque, and he is said to have stopped the looting early. The grand duke Loukas Notaras was executed a few days later.": "Les janissaires se sont introduits près de la porte de St Romanus. Constantin XI s’est jeté dans les combats et n’a jamais été revu ; son sort est inconnu. À midi, la ville était entre les mains ottomanes, et certains navires vénitiens, génois et byzantins ont échappé au port bondé de réfugiés. Mehmed avait promis à ses soldats trois jours de pillage ; la ville a été saccagée, des milliers de personnes ont été tuées et environ 30 000, selon une estimation, ont été esclaves. Mehmed est monté à Hagia Sophia et l’a fait transformer en mosquée, et il aurait arrêté le pillage tôt. Le grand duc Loukas Notaras a été exécuté quelques jours plus tard."
