"The siege begins": "Le siège commence"
"April 1453": "avril 1453"
"The Ottoman army camped before the land walls on 2 April, and Mehmed arrived on 5 April; the siege is counted from the next day. Modern historians estimate his army at 50,000 to 100,000 men, with a fleet of more than a hundred vessels under Baltoğlu Süleyman. Constantine could muster about 7,000 men, some 2,000 of them foreigners, to hold some 20 km of walls. The Theodosian land walls, a double line with a moat, ran for about 6 km from the Golden Horn to the Sea of Marmara, and a chain floated on logs closed the mouth of the Golden Horn.": "L’armée ottomane campait devant les murs de terre le 2 avril, et Mehmed arriva le 5 avril ; le siège est compté dès le lendemain. Les historiens modernes estiment son armée à 50 000 à 100 000 hommes, avec une flotte de plus d’une centaine de navires sous Baltoğlu Süleyman. Constantin pourrait rassembler environ 7 000 hommes, dont quelque 2000 étrangers, pour tenir quelque 20 km de murs. Les murs terrestres théodosiens, une double ligne avec des douves, ont couru pendant environ 6 km de la Corne d’Or à la mer de Marmara, et une chaîne flottait sur les billots fermait l’embouchure de la Corne d’Or."
"Constantine took charge of the Mesoteichion, where the walls dipped into the valley of the Lycus stream, the weakest stretch; Giustiniani stood first at the Charisian Gate and later moved beside the emperor. Mehmed pitched his tent opposite, near the Gate of St Romanus, and his guns pounded the walls day after day, though the defenders rebuilt each breach by night with timber, earth and barrels. Detachments took the outlying castles at Therapia and Stoudios, and the fleet took the Princes’ Islands. An assault on the Lycus breach on 18 April was beaten back.": "Constantin prit en charge le Mesoteichion, où les murs s’enfoncent dans la vallée du Lycus, l’étendue la plus faible ; Giustiniani se tenait d’abord à la Porte Charisienne et se déplaçait plus tard près de l’empereur. Mehmed campa sa tente en face, près de la porte de St Romanus, et ses canons batirent les murs jour après jour, bien que les défenseurs reconstruisent chaque brèche la nuit avec bois, terre et barils. Les détachements ont pris les châteaux périphériques à Therapia et Stoudios, et la flotte a pris les îles Princes. Une attaque sur la brèche de Lycus le 18 avril a été repoussée."
