# French translations of the catalogue text (wave 11); step bodies follow later.
Fall of Jayakarta and the founding of Batavia: Chute de Jayakarta et fondation de Batavia
? "The struggle for the port of Jayakarta (Jakarta), at the mouth of the Ciliwung in western Java, between the Dutch East India Company (VOC), the English East India Company, the town’s ruler and the sultanate of Banten, which ended with the Dutch destruction of the town and the founding of Batavia, the Company’s capital in Asia for more than three centuries. Governor-General Jan Pieterszoon Coen had turned the Company’s warehouses at Jayakarta into a fort. In December 1618 an English fleet under Sir Thomas Dale arrived, and after inconclusive fighting at sea Coen sailed to the Moluccas for reinforcements. The prince of Jayakarta, Wijayakrama, and the English besieged the Dutch fort and seized its commander, Pieter van den Broecke, at talks, and the garrison agreed to surrender to the English. But Banten, Jayakarta’s overlord, would not let the English have the fort: in February 1619 its regent, Pangeran Arya Ranamanggala, sent troops who removed the prince and pushed the English out, and the Dutch held on, naming their fort Batavia. Coen returned with about 1,000 men and 16 ships on 28 May 1619, stormed Jayakarta on 30 May and burned it to the ground. On its site the Company built the castle and walled town of Batavia, settled with people from elsewhere, while Banten remained hostile for decades."
: "La lutte pour le port de Jayakarta (Jakarta), à l’embouchure du Ciliwung, à Java occidental, entre la Compagnie néerlandaise des Indes orientales (VOC), la Compagnie anglaise des Indes orientales, le souverain de la ville et le sultanat de Banten, qui s’acheva par la destruction de la ville par les Néerlandais et la fondation de Batavia, capitale de la Compagnie en Asie pendant plus de trois siècles. Le gouverneur général Jan Pieterszoon Coen avait transformé en fort les entrepôts de la Compagnie à Jayakarta. En décembre 1618, une flotte anglaise commandée par Sir Thomas Dale arriva et, après des combats indécis en mer, Coen fit voile vers les Moluques pour chercher des renforts. Le prince de Jayakarta, Wijayakrama, et les Anglais assiégèrent le fort néerlandais et se saisirent de son commandant, Pieter van den Broecke, lors de pourparlers, et la garnison accepta de se rendre aux Anglais. Mais Banten, suzerain de Jayakarta, refusa de laisser le fort aux Anglais : en février 1619, son régent, Pangeran Arya Ranamanggala, envoya des troupes qui écartèrent le prince et chassèrent les Anglais, et les Néerlandais tinrent bon, donnant à leur fort le nom de Batavia. Coen revint avec environ 1 000 hommes et 16 navires le 28 mai 1619, prit Jayakarta d’assaut le 30 mai et la rasa par le feu. Sur son emplacement, la Compagnie construisit le château et la ville fortifiée de Batavia, peuplée de gens venus d’ailleurs, tandis que Banten resta hostile pendant des décennies."
