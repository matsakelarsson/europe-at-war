# French translations of the catalogue text (wave 14); step bodies follow later.
Fall of Mayapan: Chute de Mayapán
? "The revolt that destroyed Mayapan, the walled city in northern Yucatán that had been the seat of a league of Maya lords since about 1220. The Cocom lineage ruled the city, with the lords of the provinces living there and mercenaries from Tabasco, whom the Maya called Ah Canul, keeping order. According to Diego de Landa and the Maya chronicles, the Xiu lineage, led by Ah Xiu Xupan, rose against the Cocom ruler, whom they accused of tyranny and of bringing in the foreign troops, and in about 1441 killed every Cocom lord in the city except one son who was away trading in Honduras. Mayapan was sacked, burned and abandoned. Excavations have found burned buildings and a mass grave at the foot of the Temple of Kukulcan with bodies that show stab wounds and other violence, radiocarbon-dated to the mid-1400s; a stalagmite from a cave under the temple records a drought from the late 1300s, and the city’s population was already falling. After the fall, northern Yucatán broke up into some sixteen to eighteen independent provinces ruled by lineages: the Xiu at Maní, the surviving Cocom at Sotuta, the Chel at Tecoh and others. Their rivalries, above all the feud between the Xiu and the Cocom, were still alive when the Spaniards came in the 1520s."
: "La révolte qui détruisit Mayapán, la cité fortifiée du nord du Yucatán qui était depuis 1220 environ le siège d’une ligue de seigneurs mayas. La lignée des Cocom gouvernait la cité, où résidaient les seigneurs des provinces, et des mercenaires venus du Tabasco, que les Mayas appelaient Ah Canul, y maintenaient l’ordre. Selon Diego de Landa et les chroniques mayas, la lignée des Xiu, menée par Ah Xiu Xupan, se souleva contre le souverain cocom, qu’elle accusait de tyrannie et d’avoir fait venir les troupes étrangères, et vers 1441 tua tous les seigneurs cocom de la cité, à l’exception d’un fils parti commercer au Honduras. Mayapán fut pillée, incendiée et abandonnée. Les fouilles ont mis au jour des bâtiments incendiés et, au pied du temple de Kukulcan, une fosse commune contenant des corps qui portent des blessures à l’arme blanche et d’autres traces de violence, datés au radiocarbone du milieu du XVe siècle ; une stalagmite provenant d’une grotte située sous le temple enregistre une sécheresse à partir de la fin du XIVe siècle, et la population de la cité déclinait déjà. Après la chute, le nord du Yucatán se divisa en quelque seize à dix-huit provinces indépendantes gouvernées par des lignées : les Xiu à Maní, les Cocom survivants à Sotuta, les Chel à Tecoh, entre autres. Leurs rivalités, et avant tout la querelle entre les Xiu et les Cocom, étaient encore vives à l’arrivée des Espagnols dans les années 1520."
