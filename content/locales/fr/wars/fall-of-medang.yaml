# French translations of the catalogue text (wave 11); step bodies follow later.
Fall of Medang and Airlangga’s reconquest: Chute de Medang et reconquête d’Airlangga
? "The destruction of the East Javanese kingdom of Medang (Mataram) and its rebuilding by Airlangga. In 1016 Haji Wurawari of Lwaram, a vassal king, fell on the capital, Wwatan, during a royal wedding; King Dharmawangsa Teguh was killed with much of his court, and the kingdom broke up into rival lordships. Many historians see Srivijaya behind the attack, as revenge for Dharmawangsa’s naval attack on Palembang in about 990, but the Javanese sources do not say so. Airlangga, Dharmawangsa’s nephew and the bridegroom, a son of King Udayana of Bali, escaped with his servant Narottama and lived among hermits at Vanagiri (Wonogiri). From 1019 former officials of Medang rallied to him, and between 1028 and 1035 he fought the kings who had taken parts of the old kingdom: Wisnuprabhawa of Wuratan, Wijayawarma of Wengker and Panuda of Lewa in 1029–1031; a queen of the south, remembered as Dyah Tulodong of Lodoyong, who sacked his capital Watan Mas in 1031 and was defeated in 1032; Wurawari himself at the end of 1032; and Wengker again in 1035, whose king fled and was killed by his own people. By 1037 Airlangga ruled eastern Java from his new capital Kahuripan in the Brantas delta. He made peace with Srivijaya, which the Chola raid of 1025 had weakened, and before his death in 1049 divided the kingdom between his sons as Janggala and Kediri (Panjalu)."
: "La destruction du royaume de Medang (Mataram), à Java oriental, et sa reconstruction par Airlangga. En 1016, Haji Wurawari de Lwaram, un roi vassal, s’abattit sur la capitale, Wwatan, pendant un mariage royal ; le roi Dharmawangsa Teguh fut tué avec une grande partie de sa cour, et le royaume se morcela en seigneuries rivales. Beaucoup d’historiens voient Srivijaya derrière l’attaque, en représailles de l’offensive navale lancée par Dharmawangsa contre Palembang vers 990, mais les sources javanaises ne le disent pas. Airlangga, neveu de Dharmawangsa et marié de ces noces, fils du roi Udayana de Bali, s’échappa avec son serviteur Narottama et vécut parmi des ermites à Vanagiri (Wonogiri). À partir de 1019, d’anciens dignitaires de Medang se rallièrent à lui et, entre 1028 et 1035, il combattit les rois qui s’étaient emparés de parties de l’ancien royaume : Wisnuprabhawa de Wuratan, Wijayawarma de Wengker et Panuda de Lewa en 1029–1031 ; une reine du sud, connue sous le nom de Dyah Tulodong de Lodoyong, qui saccagea sa capitale Watan Mas en 1031 et fut vaincue en 1032 ; Wurawari lui-même à la fin de 1032 ; et de nouveau Wengker en 1035, dont le roi s’enfuit et fut tué par les siens. En 1037, Airlangga régnait sur l’est de Java depuis sa nouvelle capitale, Kahuripan, dans le delta du Brantas. Il fit la paix avec Srivijaya, qu’avait affaibli le raid chola de 1025, et, avant sa mort en 1049, partagea le royaume entre ses fils en deux États, Janggala et Kediri (Panjalu)."
