# French translations of the catalogue text (wave 13); step bodies follow later.
Fall of the Oyo Empire: Chute de l’empire d’Oyo
? The collapse of Oyo, the Yoruba empire that had dominated the savanna and forest between the Niger and the coast of the Bight of Benin since the 17th century. Weakened by decades of conflict between its kings, the alaafins, and its chiefs, Oyo lost its northern stronghold of Ilorin in 1817, when Afonja, the commander of its army, rebelled and called in Muslim allies; by the 1820s Ilorin had become an emirate of the Sokoto Caliphate and was raiding the heart of the empire. Dahomey threw off Oyo’s overlordship, and in the south the Owu war and the destruction of the Egba towns uprooted whole populations. In about 1835 Alaafin Oluewu and his Borgu allies were defeated and killed outside Ilorin in the Eleduwe war, and the capital, Oyo-Ile, was abandoned. Refugees and war chiefs built new towns further south, Ibadan, Abeokuta, Ijaye and a new Oyo, whose rivalries shaped the Yoruba wars of the rest of the century. Captives taken in these wars were sold in great numbers into the Atlantic slave trade through Lagos and Porto-Novo, above all to Brazil and Cuba.
: L’effondrement d’Oyo, l’empire yoruba qui dominait depuis le XVIIe siècle la savane et la forêt entre le Niger et la côte du golfe du Bénin. Affaibli par des décennies de conflit entre ses rois, les alaafins, et ses chefs, Oyo perdit en 1817 sa place forte septentrionale d’Ilorin, lorsqu’Afonja, le commandant de son armée, se rebella et fit appel à des alliés musulmans ; dans les années 1820, Ilorin était devenu un émirat du califat de Sokoto et razziait le cœur de l’empire. Le Dahomey secoua la suzeraineté d’Oyo, et dans le sud la guerre d’Owu et la destruction des villes egba déracinèrent des populations entières. Vers 1835, l’alaafin Oluewu et ses alliés du Borgou furent vaincus et tués devant Ilorin lors de la guerre d’Eleduwe, et la capitale, Oyo-Ile, fut abandonnée. Réfugiés et chefs de guerre fondèrent plus au sud de nouvelles villes, Ibadan, Abeokuta, Ijaye et un nouvel Oyo, dont les rivalités façonnèrent les guerres yoruba pendant le reste du siècle. Les captifs faits au cours de ces guerres furent vendus en très grand nombre à la traite atlantique par Lagos et Porto-Novo, surtout vers le Brésil et Cuba.
