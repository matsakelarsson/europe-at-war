# French translations of the catalogue text (wave 11); step bodies follow later.
Banten’s conquest of Sunda (fall of Pajajaran): Conquête de Sunda par Banten (chute de Pajajaran)
? The end of the Hindu kingdom of Sunda in western Java, whose capital, Pakuan Pajajaran, near today’s Bogor, was taken and destroyed by the Muslim sultanate of Banten in 1579. Sunda had lost its main ports to the forces of Demak and Cirebon in 1527, when Fatahillah took Sunda Kelapa and renamed it Jayakarta, and Banten, until then a Sundanese port, became the seat of a new sultanate under Hasanuddin, a son of Sunan Gunungjati of Cirebon. The Sundanese king Surawisesa is credited with fifteen battles against the Muslim forces before a peace of 1531, but the attacks resumed under his successors. In the 1550s Hasanuddin sent his son Maulana Yusuf against Pakuan; its walls and moats held, but the kings of Sunda often could not live there. The last king, Raja Mulya (Prabu Surya Kencana, the Nusiya Mulya of the Carita Parahyangan), moved his court west to Pulasari on the slopes of Mount Pulasari, and after 1576 the kingdom fell apart under Banten’s pressure. In 1579 Maulana Yusuf, sultan since 1570, took Pakuan, according to tradition after a guard opened the gates; the city was razed, and the sacred stone that served as the throne of the Sundanese kings was carried to Banten to become the throne of its sultans. Banten took over most of Sunda’s lands, while the regalia of the Sundanese kings were taken to Sumedang Larang in the east, whose ruler, Geusan Ulun, claimed Sunda’s succession until Mataram absorbed his principality. The Baduy of the Banten highlands, former subjects of Sunda, were left to keep their old religion.
: La fin du royaume hindou de Sunda, à Java occidental, dont la capitale, Pakuan Pajajaran, près de l’actuelle Bogor, fut prise et détruite par le sultanat musulman de Banten en 1579. Sunda avait perdu ses principaux ports au profit des forces de Demak et de Cirebon en 1527, lorsque Fatahillah prit Sunda Kelapa et la rebaptisa Jayakarta, et Banten, jusque-là port sundanais, devint le siège d’un nouveau sultanat sous Hasanuddin, fils de Sunan Gunungjati de Cirebon. On attribue au roi sundanais Surawisesa quinze batailles contre les forces musulmanes avant une paix conclue en 1531, mais les attaques reprirent sous ses successeurs. Dans les années 1550, Hasanuddin envoya son fils Maulana Yusuf contre Pakuan ; ses murailles et ses fossés tinrent, mais les rois de Sunda ne pouvaient souvent pas y résider. Le dernier roi, Raja Mulya (Prabu Surya Kencana, le Nusiya Mulya de la Carita Parahyangan), transféra sa cour vers l’ouest, à Pulasari, sur les pentes du mont Pulasari, et après 1576 le royaume se désagrégea sous la pression de Banten. En 1579, Maulana Yusuf, sultan depuis 1570, prit Pakuan, selon la tradition après qu’un garde eut ouvert les portes ; la ville fut rasée, et la pierre sacrée qui servait de trône aux rois sundanais fut emportée à Banten pour devenir le trône de ses sultans. Banten s’empara de la plupart des terres de Sunda, tandis que les regalia des rois sundanais furent emportés à Sumedang Larang, à l’est, dont le souverain, Geusan Ulun, revendiqua la succession de Sunda jusqu’à ce que Mataram absorbe sa principauté. Les Baduy des hautes terres de Banten, anciens sujets de Sunda, furent laissés libres de conserver leur ancienne religion.
