# French translations of the catalogue text (wave 11); step bodies follow later.
Fall of Pegu and the Portuguese at Syriam: Chute de Pégou et les Portugais à Syriam
? The break-up of the Toungoo empire of Bayinnaung and its restoration from Ava. After the defeat at Nong Sarai (1593) Nanda Bayin lost the Tenasserim coast and the Mon country to Siam, Naresuan besieged Pegu in 1595, and Prome, Toungoo, Ava, Lan Na and Lan Xang broke away. In 1599 the lord of Toungoo, Minye Thihathu II, and King Min Razagyi of Arakan, whose fleet carried Portuguese mercenaries, besieged Pegu; Nanda surrendered on 19 December 1599 and was taken to Toungoo, where he was killed in 1600. The Arakanese burned the city and carried off its people and treasures, and a Siamese army arriving too late besieged Toungoo in vain. Filipe de Brito, the Portuguese whom Arakan left as governor of the port of Syriam, made it a Portuguese fort in 1603. Meanwhile Nyaungyan, Nanda’s half-brother, rebuilt the kingdom from Ava; his son Anaukpetlun took Prome (1608) and Toungoo (1610), and in 1613 took Syriam after a 36-day siege and had de Brito executed. Lower Burma was again united with the Irrawaddy valley, now ruled from Ava.
: La dislocation de l’empire taungû de Bayinnaung et sa restauration depuis Ava. Après la défaite de Nong Sarai (1593), Nanda Bayin perdit la côte du Tenasserim et le pays môn au profit du Siam, Naresuan assiégea Pégou en 1595, et Prome, Toungoo, Ava, le Lan Na et le Lan Xang firent sécession. En 1599, le seigneur de Toungoo, Minye Thihathu II, et le roi Min Razagyi d’Arakan, dont la flotte transportait des mercenaires portugais, assiégèrent Pégou ; Nanda se rendit le 19 décembre 1599 et fut emmené à Toungoo, où il fut tué en 1600. Les Arakanais incendièrent la ville et emportèrent ses habitants et ses trésors, et une armée siamoise arrivée trop tard assiégea Toungoo en vain. Filipe de Brito, le Portugais que l’Arakan avait laissé comme gouverneur du port de Syriam, en fit un fort portugais en 1603. Pendant ce temps, Nyaungyan, demi-frère de Nanda, reconstruisit le royaume depuis Ava ; son fils Anaukpetlun prit Prome (1608) et Toungoo (1610), puis, en 1613, Syriam après un siège de 36 jours, et fit exécuter de Brito. La Basse-Birmanie fut de nouveau réunie à la vallée de l’Irrawaddy, désormais gouvernée depuis Ava.
