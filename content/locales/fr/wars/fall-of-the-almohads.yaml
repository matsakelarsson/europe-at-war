# French translations of the catalogue text (wave 12); step bodies follow later.
Fall of the Almohads: Chute des Almohades
? "The break-up of the Almohad Caliphate, which had ruled the Maghreb and al-Andalus from Marrakesh, into the three kingdoms that shared North Africa for the next three centuries. After the defeat at Las Navas de Tolosa (1212) and the death of the young caliph Yusuf II in 1224, members of the ruling family fought each other for the throne. Idris al-Ma’mun brought the Almohad army over from Spain in 1228 with Castilian mercenaries, took Marrakesh and renounced the movement’s founding doctrine that Ibn Tumart had been the Mahdi. His governors and the Zenata Berber tribes used the chance to break away: the Hafsid governor Abu Zakariya made Ifriqiya an independent kingdom from Tunis in 1229, Yaghmurasen ibn Zayyan ruled Tlemcen from 1236, and the Marinids, who had been raiding north-eastern Morocco since about 1215, took Meknes (1244) and, after the caliph al-Said was killed near Oujda in 1248, Fez. The caliphs were left with Marrakesh and the High Atlas, until the Marinid Abu Yusuf Yaqub took Marrakesh in September 1269; the last Almohads were defeated at Tinmel in 1275."
: "L’éclatement du califat almohade, qui avait régné depuis Marrakech sur le Maghreb et al-Andalus, en trois royaumes qui se partagèrent l’Afrique du Nord pendant les trois siècles suivants. Après la défaite de Las Navas de Tolosa (1212) et la mort du jeune calife Yusuf II en 1224, des membres de la famille régnante se disputèrent le trône. Idris al-Ma’mun fit passer l’armée almohade d’Espagne en Afrique en 1228 avec des mercenaires castillans, prit Marrakech et renia la doctrine fondatrice du mouvement, selon laquelle Ibn Tumart avait été le Mahdi. Ses gouverneurs et les tribus berbères zénètes en profitèrent pour faire sécession : le gouverneur hafside Abu Zakariya fit en 1229 de l’Ifriqiya un royaume indépendant gouverné depuis Tunis, Yaghmurasen ibn Zayyan régna sur Tlemcen à partir de 1236, et les Mérinides, qui lançaient des raids dans le nord-est du Maroc depuis 1215 environ, prirent Meknès (1244) puis, après la mort du calife al-Said, tué près d’Oujda en 1248, Fès. Il ne resta aux califes que Marrakech et le Haut Atlas, jusqu’à ce que le Mérinide Abu Yusuf Yaqub prenne Marrakech en septembre 1269 ; les derniers Almohades furent vaincus à Tinmel en 1275."
