# French translations of the catalogue text (wave 12); step bodies follow later.
Fall of the Marinids: Chute des Mérinides
? The overthrow of the last Marinid sultan of Morocco and the struggle for Fez that brought the Wattasids to power. From 1420 the Marinid sultan Abd al-Haqq II, put on the throne as a small child, was a figurehead for regents of the Wattasid family, a related Zenata lineage. In 1458 he massacred most of the Wattasids and ruled through a Jewish vizier, Harun ibn Battash, while the Portuguese held Ceuta and Ksar es-Seghir and Castile took Gibraltar in 1462. In May 1465, while the sultan was away, an insult to a woman of a sharifian (Prophet-descended) family started a riot in Fez; a preacher called for action against the Jews, the senior mufti approved a revolt, the Jewish quarter was attacked and the governor killed. The sharif Muhammad ibn Imran (al-Juti) was installed as ruler of the city, and when Abd al-Haqq returned he was killed, on 18 May 1465 according to one chronicler (23 May according to another). Whether a general massacre of the Jews of Fez took place is debated, since no Jewish source mentions it before the 19th century. Muhammad ibn Imran ruled Fez for six years and kept the surviving Wattasids out. One of them, Muhammad al-Shaykh, governor of Asilah, fought for the city from the north; to free his hands he made a truce with Portugal after it took Asilah and Tangier in August 1471, and he entered Fez in 1471 or 1472, founding the Wattasid sultanate.
: Le renversement du dernier sultan mérinide du Maroc et la lutte pour Fès qui porta les Wattassides au pouvoir. À partir de 1420, le sultan mérinide Abd al-Haqq II, placé sur le trône dans sa petite enfance, ne fut qu’un souverain de façade pour des régents de la famille wattasside, un lignage zénète apparenté. En 1458, il massacra la plupart des Wattassides et gouverna par l’intermédiaire d’un vizir juif, Harun ibn Battash, tandis que les Portugais tenaient Ceuta et Ksar es-Seghir et que la Castille prenait Gibraltar en 1462. En mai 1465, en l’absence du sultan, une insulte faite à une femme d’une famille chérifienne (descendante du Prophète) déclencha une émeute à Fès ; un prédicateur appela à agir contre les Juifs, le grand mufti approuva la révolte, le quartier juif fut attaqué et le gouverneur tué. Le chérif Muhammad ibn Imran (al-Juti) fut installé à la tête de la ville et, lorsqu’Abd al-Haqq revint, il fut tué, le 18 mai 1465 selon un chroniqueur (le 23 mai selon un autre). La question de savoir si un massacre général des Juifs de Fès eut lieu est débattue, car aucune source juive ne le mentionne avant le XIXe siècle. Muhammad ibn Imran gouverna Fès pendant six ans et en tint écartés les Wattassides survivants. L’un d’eux, Muhammad al-Shaykh, gouverneur d’Asilah, lutta pour la ville depuis le nord ; pour avoir les mains libres, il conclut une trêve avec le Portugal après que celui-ci eut pris Asilah et Tanger en août 1471, et il entra dans Fès en 1471 ou 1472, fondant le sultanat wattasside.
