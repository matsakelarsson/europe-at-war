# Some French text was translated automatically.
"Fall of the Serbian Despotate": "Chute du Despotat serbe"
"Mehmed II’s campaigns that ended medieval Serbia. In July 1454 he invaded the despotate of Đurađ Branković and besieged Smederevo, but withdrew when John Hunyadi approached; Hunyadi and the Serbs then beat the Ottoman force left at Kruševac, and the voivode Nikola Skobaljić won near Leskovac before he was defeated and executed in November. In 1455 the Ottomans took the south of the country, including the silver-mining town of Novo Brdo after a forty-day bombardment, and in 1456 they failed before Belgrade. After the deaths of Đurađ (1456) and his son Lazar (1458) the despotate was torn by quarrels among his heirs and squeezed by Hungary and Bosnia; Ottoman armies invaded again in 1458. In 1459 Stephen Tomašević, son of the Bosnian king, became despot, and when Mehmed arrived at Smederevo he handed the capital over without a fight on 20 June 1459.": "En juillet 1454, il envahit le despotat de la ville de Branković et assiégea Smederevo, mais se retira lorsque John Hunyadi s’approcha ; Hunyadi et les Serbes battèrent ensuite la force ottomane à Kruševac, et le voïvode Nikola Skobaljić gagna près de Leskovac avant d’être battu et exécuté en novembre. En 1455, les Ottomans prirent le sud du pays, y compris la ville d’argent de Novo Brdo après un bombardement de quarante jours, et en 1456 ils échouèrent avant Belgrade. Après la mort de l’empereur (1456) et son fils Lazar (1458), le despotat fut déchiré par des querelles entre ses héritiers et serré par la Hongrie et la Bosnie ; les armées ottomanes envahirent à nouveau en 1458. En 1459, Stephen Tomašević, fils du roi de Bosnie, devint despote et lorsque Mehmed arriva à Smederevo, il livra la capitale sans se battre le 20 juin 1459."
"The siege of Belgrade in 1456 has its own entry. Belgrade, held by Hungary, stayed in Christian hands until 1521.": "Le siège de Belgrade en 1456 a sa propre entrée. Belgrade, tenue par la Hongrie, est restée entre les mains des chrétiens jusqu’en 1521."
