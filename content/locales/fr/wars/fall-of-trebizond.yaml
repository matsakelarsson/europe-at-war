"Fall of Trebizond": "Chute de Trebizond"
"Mehmed II’s campaign of 1461 against the Empire of Trebizond, the last Byzantine Greek state, on the Black Sea coast of Anatolia. Emperor David Megas Komnenos had refused tribute and relied on alliances with the Aq Qoyunlu ruler Uzun Hasan, Georgia and the Turkish lords of the north. Mehmed’s fleet sailed along the coast while his army forced the Candarid lord of Sinope to give up his realm, marched east, made peace with Uzun Hasan and crossed the Pontic mountains. Trebizond was blockaded by land and sea, and on 15 August 1461 David surrendered the city on terms. He and his family were given estates near Serres in Macedonia but were executed in Constantinople in 1463; many of the city’s people were deported to Constantinople or enslaved, and boys were taken for the janissaries.": "Mehmed II's campagne de 1461 contre l’Empire de Trebizond, le dernier État grec byzantin, sur la côte de la mer Noire d’Anatolie. L’empereur David Megas Komnenos avait refusé l’hommage et s’était appuyé sur des alliances avec le souverain Aq Qoyunlu Uzun Hasan, Géorgie et les seigneurs turcs du nord. La flotte de Mehmed's navigua le long de la côte tandis que son armée força le seigneur candaride de Sinope à abandonner son royaume, marcha vers l’est, fit la paix avec Uzun Hasan et traversa les montagnes du Pont. Trebizond fut bloqué par terre et par mer, et le 15 août 1461 David capitula la ville selon les conditions. Lui et sa famille ont reçu des successions près de Serres en Macédoine, mais ont été exécutés à Constantinople en 1463 ; beaucoup de la ville gens ont été déportés à Constantinople ou asservis, et les garçons ont été pris pour les janissaires."
"The Genoese port of Amasra (Amastris) was taken in 1459 or 1460, before the campaign; dates for the march differ between sources.": "Le port génois d’Amasra (Amastris) a été pris en 1459 ou 1460, avant la campagne ; les dates de la marche diffèrent entre les sources."
