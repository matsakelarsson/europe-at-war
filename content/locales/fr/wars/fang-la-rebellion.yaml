# French translations of the catalogue text (wave 9); step bodies follow later.
Fang La rebellion: Rébellion de Fang La
? The great rising in the lower Yangtze region led by Fang La, the owner of a lacquer-tree plantation from Qingxi county in Muzhou (today’s Chun’an in Zhejiang) or from neighbouring Shezhou. Under the emperor Huizong, the people of the region were burdened with heavy taxes and with the requisitions of the “flower and rock convoys”, which shipped rare plants and stones to the emperor’s gardens in Kaifeng. On 1 November 1120 Fang La rose, calling himself the Sage Lord and proclaiming an era of his own, Yongle. His followers, soon tens of thousands strong, destroyed a government army of 5,000, took Qingxi, Muzhou and Shezhou, and in late December 1120 took Hangzhou, where they killed the regional officials. At its height the rising held six prefectures and 52 counties in Zhejiang, Anhui and Jiangxi. The court called off the convoys and sent the eunuch Tong Guan south with the army gathered for the war against the Liao. In 1121 the government armies retook Hangzhou and the other towns and trapped Fang La in the Bangyuan caves near Qingxi, where Han Shizhong, a junior officer, captured him in the spring or early summer of 1121. He was executed in Kaifeng that autumn, and the last of his followers were defeated in eastern Zhejiang in the spring of 1122. Song writers said two million people died, a figure that is probably exaggerated. The rising delayed the Song attack on the Liao and was later linked, probably wrongly, with the Manichaeans.
: Le grand soulèvement de la région du bas Yangtsé mené par Fang La, propriétaire d’une plantation d’arbres à laque du district de Qingxi, dans la préfecture de Muzhou (l’actuel Chun’an, au Zhejiang), ou de la préfecture voisine de Shezhou. Sous l’empereur Huizong, la population de la région était accablée d’impôts et des réquisitions des « convois de fleurs et de pierres », qui acheminaient plantes et pierres rares vers les jardins de l’empereur à Kaifeng. Le 1er novembre 1120, Fang La se souleva, se faisant appeler le Seigneur sage et proclamant sa propre ère, Yongle. Ses partisans, bientôt des dizaines de milliers, anéantirent une armée gouvernementale de 5 000 hommes, prirent Qingxi, Muzhou et Shezhou et, à la fin de décembre 1120, Hangzhou, où ils tuèrent les fonctionnaires régionaux. À son apogée, le soulèvement tenait six préfectures et 52 districts au Zhejiang, dans l’Anhui et au Jiangxi. La cour suspendit les convois et envoya au sud l’eunuque Tong Guan avec l’armée rassemblée pour la guerre contre les Liao. En 1121, les armées gouvernementales reprirent Hangzhou et les autres villes et cernèrent Fang La dans les grottes de Bangyuan, près de Qingxi, où un officier subalterne, Han Shizhong, le captura au printemps ou au début de l’été 1121. Il fut exécuté à Kaifeng à l’automne, et les derniers de ses partisans furent vaincus dans l’est du Zhejiang au printemps 1122. Les auteurs Song parlèrent de deux millions de morts, un chiffre probablement exagéré. Le soulèvement retarda l’attaque des Song contre les Liao et fut plus tard associé, sans doute à tort, aux manichéens.
