# French translations of the catalogue text (wave 14); step bodies follow later.
Father Le Loutre’s War: Guerre du père Le Loutre
? A war in Nova Scotia between the British and the Mi’kmaq, Wolastoqiyik (Maliseet) and many Acadians, encouraged by New France and by the missionary Jean-Louis Le Loutre, in the years of nominal peace between Britain and France after 1748. In June 1749 Edward Cornwallis arrived with some 2,500 settlers and founded Halifax on Mi’kmaq land at Chebucto without any treaty with them; in September the Mi’kmaq wrote to him, through the missionary Pierre Maillard, that the land was theirs, and attacked woodcutters at Dartmouth. On 2 October 1749 Cornwallis’s council offered a bounty of ten guineas for every Mi’kmaq killed or captured, raised to fifty in 1750. Le Loutre urged the Acadians to leave British territory, and in 1750 he and his Mi’kmaq allies burned the village of Beaubassin so its people would move across the Missaguash River into French-held land. The British built Fort Lawrence on the Chignecto isthmus and the French faced it from Fort Beauséjour. Raids struck the new settlements around Halifax, Dartmouth (where about 20 settlers were killed in May 1751) and Lunenburg; the British officer Edward How was killed under a flag of truce in October 1750. Governor Peregrine Hopson made a peace treaty with the Mi’kmaq leader Jean-Baptiste Cope in 1752, but it did not hold. Between a third and almost half of the Acadians of the peninsula, by different estimates, moved to French-held Île Saint-Jean, Île Royale and the Chignecto isthmus. The war ended when a British and New England force took Fort Beauséjour on 16 June 1755, at the start of the French and Indian War, and the expulsion of the Acadians followed.
: Une guerre en Nouvelle-Écosse entre les Britanniques, d’une part, et les Micmacs, les Wolastoqiyik (Malécites) et de nombreux Acadiens, d’autre part, encouragés par la Nouvelle-France et par le missionnaire Jean-Louis Le Loutre, pendant les années de paix nominale entre la Grande-Bretagne et la France qui suivirent 1748. En juin 1749, Edward Cornwallis arriva avec quelque 2 500 colons et fonda Halifax sur des terres micmaques, à Chebucto, sans conclure aucun traité avec les Micmacs ; en septembre, ceux-ci lui écrivirent, par l’intermédiaire du missionnaire Pierre Maillard, que la terre leur appartenait, et attaquèrent des bûcherons à Dartmouth. Le 2 octobre 1749, le conseil de Cornwallis offrit une prime de dix guinées pour chaque Micmac tué ou capturé, portée à cinquante en 1750. Le Loutre exhorta les Acadiens à quitter le territoire britannique et, en 1750, avec ses alliés micmacs, il incendia le village de Beaubassin pour que ses habitants passent de l’autre côté de la rivière Missaguash, en territoire tenu par la France. Les Britanniques construisirent le fort Lawrence sur l’isthme de Chignectou, et les Français lui faisaient face depuis le fort Beauséjour. Des raids frappèrent les nouveaux établissements des environs de Halifax, de Dartmouth (où une vingtaine de colons furent tués en mai 1751) et de Lunenburg ; l’officier britannique Edward How fut tué sous un drapeau parlementaire en octobre 1750. Le gouverneur Peregrine Hopson conclut un traité de paix avec le chef micmac Jean-Baptiste Cope en 1752, mais il ne tint pas. Entre un tiers et près de la moitié des Acadiens de la péninsule, selon les estimations, partirent pour l’île Saint-Jean, l’île Royale et l’isthme de Chignectou, tenus par la France. La guerre prit fin lorsqu’une troupe britannique et néo-anglaise s’empara du fort Beauséjour le 16 juin 1755, au début de la guerre franco-indienne ; l’expulsion des Acadiens suivit.
