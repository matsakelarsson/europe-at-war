# French translations of the catalogue text (wave 12); step bodies follow later.
Fatimid conquest of Egypt: Conquête fatimide de l’Égypte
"The Fatimid caliphs’ fifty-year effort to take Egypt, the gateway to Syria and Iraq, from the Abbasid caliphate and its governors. Two invasions led by the heir al-Qa’im took Barqa and Alexandria and reached the Fayyum, but failed before Fustat, the capital: the Kutama army was beaten at Giza in December 914 and January 915, and in 919–921 its fleet was destroyed off Abukir and the army had to retreat across the desert. Half a century later, with Egypt weakened by years of low Nile floods and famine and leaderless after the death of the regent Kafur in 968, the caliph al-Mu’izz sent his general Jawhar with a large, well-paid army. It left Ifriqiya in February 969, occupied Alexandria without a fight, forced the crossing of the Nile at Giza on 3 July and took Fustat on 6 July. Jawhar founded a new palace city beside it, which became al-Qahira, Cairo; al-Mu’izz moved there in 973, and Egypt was the centre of the Fatimid caliphate until 1171.": "L’effort d’un demi-siècle des califes fatimides pour arracher l’Égypte, porte de la Syrie et de l’Irak, au califat abbasside et à ses gouverneurs. Deux invasions menées par l’héritier al-Qa’im prirent Barqa et Alexandrie et atteignirent le Fayoum, mais échouèrent devant Fustat, la capitale : l’armée kutama fut battue à Gizeh en décembre 914 et en janvier 915, et en 919–921 sa flotte fut détruite au large d’Aboukir et l’armée dut battre en retraite à travers le désert. Un demi-siècle plus tard, alors que l’Égypte était affaiblie par des années de crues insuffisantes du Nil et de famine, et privée de chef depuis la mort du régent Kafur en 968, le calife al-Mu’izz envoya son général Jawhar avec une armée nombreuse et bien payée. Partie d’Ifriqiya en février 969, celle-ci occupa Alexandrie sans combat, força le passage du Nil à Gizeh le 3 juillet et prit Fustat le 6 juillet. Jawhar fonda à côté une nouvelle cité palatiale, qui devint al-Qahira, Le Caire ; al-Mu’izz s’y installa en 973, et l’Égypte resta le centre du califat fatimide jusqu’en 1171."
