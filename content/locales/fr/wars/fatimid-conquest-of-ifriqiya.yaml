# French translations of the catalogue text (wave 12); step bodies follow later.
Fatimid conquest of Ifriqiya: Conquête fatimide de l’Ifriqiya
"The overthrow of the Aghlabid emirs of Ifriqiya by the Ismaili missionary Abu Abdallah al-Shi’i and the Kutama Berbers of Lesser Kabylia, which brought the Fatimid caliphate to power. Abu Abdallah had lived among the Kutama since 893, preaching the coming of the Mahdi, a hidden imam descended from the Prophet’s daughter Fatima. From 902 his Kutama army took the Aghlabid fortress towns of the west one by one: Mila, Sétif (904), Tobna (906), Belezma and Baghaya (907). On 18 March 909 it destroyed the last Aghlabid army at al-Urbus (Laribus); the emir Ziyadat Allah III fled to Egypt, and a week later Abu Abdallah entered the palace city of Raqqada. In the summer he marched west, ended the Rustamid imamate of Tahert and on 26 August 909 freed the Ismaili imam Abdallah from house arrest at Sijilmasa. Proclaimed caliph as al-Mahdi, Abdallah reached Raqqada in January 910; in 911 he had Abu Abdallah killed. The dynasty he founded would rule Ifriqiya and Sicily and, from 969, Egypt.": "Le renversement des émirs aghlabides d’Ifriqiya par le missionnaire ismaélien Abu Abdallah al-Shi’i et les Berbères Kutama de Petite Kabylie, qui porta au pouvoir le califat fatimide. Abu Abdallah vivait parmi les Kutama depuis 893, annonçant la venue du Mahdi, un imam caché descendant de Fatima, la fille du Prophète. À partir de 902, son armée kutama prit une à une les villes fortifiées aghlabides de l’ouest : Mila, Sétif (904), Tobna (906), Belezma et Baghaya (907). Le 18 mars 909, elle anéantit la dernière armée aghlabide à al-Urbus (Laribus) ; l’émir Ziyadat Allah III s’enfuit en Égypte et, une semaine plus tard, Abu Abdallah entra dans la cité palatiale de Raqqada. Au cours de l’été, il marcha vers l’ouest, mit fin à l’imamat rostémide de Tahert et, le 26 août 909, libéra à Sijilmassa l’imam ismaélien Abdallah, qui y était assigné à résidence. Proclamé calife sous le nom d’al-Mahdi, Abdallah atteignit Raqqada en janvier 910 ; en 911, il fit tuer Abu Abdallah. La dynastie qu’il fonda allait régner sur l’Ifriqiya et la Sicile et, à partir de 969, sur l’Égypte."
