# French translations of the catalogue text (wave 14); step bodies follow later.
Fédon’s Rebellion: Rébellion de Fédon
? The rising of 1795–1796 against British rule in Grenada, led by Julien Fédon, a planter of mixed African and French descent who owned the Belvidere estate in the mountains of the interior. Grenada had been French until 1763 and again in 1779–1783, and its French-speaking Catholic and free coloured inhabitants suffered under British laws that excluded them from office and restricted their rights. Encouraged and armed by Victor Hugues, the commissioner of the French Republic in Guadeloupe, which had abolished slavery in 1794, Fédon and his followers attacked Grenville and Gouyave on the night of 2 March 1795 and captured the lieutenant governor, Ninian Home. Thousands of enslaved people joined them; the historian Kit Candlin estimates about 12,500, half of the enslaved population. After a failed British attack on his fortified camp on 8 April, Fédon had most of his hostages killed, among them Home. For more than a year the insurgents held almost all the island except St George’s, beating off attacks on Belvidere and taking the British posts on the east coast in early 1796. British reinforcements under Brigadier-General Oliver Nicolls began to turn the war in March 1796, and when Sir Ralph Abercromby’s expedition arrived in June, British troops stormed Fédon’s camp on 19 June 1796. Fédon was never found. Dozens of leaders were executed after summary trials, and hundreds more were condemned; about 7,000 enslaved people, a quarter of the island’s enslaved population, died in the revolt, and damage was put at £2.5 million.
: Le soulèvement de 1795–1796 contre la domination britannique à la Grenade, mené par Julien Fédon, un planteur d’ascendance africaine et française qui possédait le domaine de Belvidere dans les montagnes de l’intérieur. La Grenade avait été française jusqu’en 1763, puis de nouveau en 1779–1783, et ses habitants francophones et catholiques et ses libres de couleur souffraient de lois britanniques qui les excluaient des fonctions publiques et restreignaient leurs droits. Encouragés et armés par Victor Hugues, commissaire de la République française en Guadeloupe, où l’esclavage avait été aboli en 1794, Fédon et ses partisans attaquèrent Grenville et Gouyave dans la nuit du 2 mars 1795 et capturèrent le lieutenant-gouverneur, Ninian Home. Des milliers d’esclaves les rejoignirent ; l’historien Kit Candlin en estime le nombre à environ 12 500, soit la moitié de la population servile. Après l’échec d’une attaque britannique contre son camp fortifié le 8 avril, Fédon fit tuer la plupart de ses otages, dont Home. Pendant plus d’un an, les insurgés tinrent presque toute l’île à l’exception de St George’s, repoussant les attaques contre Belvidere et prenant les postes britanniques de la côte est au début de 1796. Les renforts britanniques du général de brigade Oliver Nicolls commencèrent à renverser le cours de la guerre en mars 1796, et lorsque l’expédition de Sir Ralph Abercromby arriva en juin, les troupes britanniques prirent d’assaut le camp de Fédon le 19 juin 1796. Fédon ne fut jamais retrouvé. Des dizaines de chefs furent exécutés après des procès sommaires, et des centaines d’autres furent condamnés ; environ 7 000 esclaves, le quart de la population servile de l’île, moururent pendant la révolte, et les dégâts furent estimés à 2,5 millions de livres sterling.
