# French translations of the catalogue text (wave 14); step bodies follow later.
Fenian raids: Raids féniens
? Armed raids from the United States into British North America by the Fenian Brotherhood, an Irish-American organisation that aimed to seize Canada and hold it hostage to force Britain to grant Ireland its independence. Many Fenians were veterans of the American Civil War. After a failed attempt on Campobello Island in New Brunswick in April 1866, John O’Neill crossed the Niagara River on 1 June 1866 with about a thousand men, defeated the Canadian militia at Ridgeway and Fort Erie the next day, and withdrew to the United States, where the US Navy intercepted his men. A second force entered Quebec at Pigeon Hill on 7 June and retreated within two days. The US government, which had tolerated the Fenians’ preparations, then enforced its neutrality laws. In May 1870 Canadian militia beat back Fenian raids at Eccles Hill and Trout River, and in October 1871 a small party under O’Neill seized a Hudson’s Bay Company post at Pembina, on the border of the new province of Manitoba, which turned out to be on American soil, and was arrested by US troops. The raids cost several dozen lives on both sides, and the danger they showed helped bring about the confederation of Canada in 1867.
: Des raids armés lancés depuis les États-Unis contre l’Amérique du Nord britannique par la Fraternité fénienne, une organisation irlando-américaine qui entendait s’emparer du Canada et le garder en otage pour contraindre la Grande-Bretagne à accorder son indépendance à l’Irlande. Beaucoup de Féniens étaient des vétérans de la guerre de Sécession. Après une tentative avortée contre l’île Campobello, au Nouveau-Brunswick, en avril 1866, John O’Neill franchit la rivière Niagara le 1er juin 1866 avec environ un millier d’hommes, battit la milice canadienne à Ridgeway et à Fort Erie le lendemain, puis se retira aux États-Unis, où la marine américaine intercepta ses hommes. Une deuxième troupe pénétra au Québec à Pigeon Hill le 7 juin et se replia en deux jours. Le gouvernement américain, qui avait toléré les préparatifs des Féniens, fit alors appliquer ses lois sur la neutralité. En mai 1870, la milice canadienne repoussa des raids féniens à Eccles Hill et à Trout River et, en octobre 1871, un petit groupe mené par O’Neill s’empara, à Pembina, à la frontière de la nouvelle province du Manitoba, d’un poste de la Compagnie de la Baie d’Hudson qui se révéla situé en territoire américain, et fut arrêté par des troupes américaines. Les raids coûtèrent plusieurs dizaines de vies de part et d’autre, et le danger qu’ils avaient révélé contribua à l’avènement de la Confédération canadienne en 1867.
