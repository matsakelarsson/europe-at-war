# Some French text was translated automatically.
"Fernandine Wars": "Guerres fernandines"
"Three wars between Ferdinand I of Portugal and the Trastámara kings of Castile, fought over Ferdinand’s claim to the Castilian throne after the murder of Peter I in 1369 and tied to the Hundred Years’ War. The first (1369–1371) ended with the Peace of Alcoutim. In the second (1372–1373), after Ferdinand allied with John of Gaunt, Henry II invaded Portugal, besieged Lisbon and burned part of the city; by the Treaty of Santarém Portugal had to side with Castile and France, and Ferdinand built new walls around Lisbon. In the third (1381–1382) an English army under the Earl of Cambridge came to Portugal, but the Castilian fleet destroyed the Portuguese at Saltés in July 1381, and Ferdinand made peace at Elvas in 1382. His daughter Beatrice was married to John I of Castile, which led to the crisis of 1383–1385.": "Trois guerres entre Ferdinand Ier du Portugal et les rois de Trastámara de Castille, ont combattu sur Ferdinands revendiquer le trône castillan après l’assassinat de Pierre Ier en 1369 et lié à la guerre de Cent Ans. La première (1369-1371) s’est terminée avec la paix d’Alcoutim. Dans la seconde (1372-1373), après que Ferdinand se soit allié avec Jean de Gaunt, Henri II a envahi le Portugal, assiégé Lisbonne et brûlé une partie de la ville ; par le traité de Santarém Portugal a dû prendre parti avec la Castille et la France, et Ferdinand a construit de nouveaux murs autour de Lisbonne. Dans la troisième (1381-1382) une armée anglaise sous le comte de Cambridge est arrivée au Portugal, mais la flotte castillane a détruit les Portugais à Saltés en juillet 1381, et Ferdinand a fait la paix à Elvas en 1382. Sa fille Béatrice était mariée à John Ier de Castille, ce qui a conduit à la crise de 1383-1385."
"The name comes from the Portuguese Guerras Fernandinas. The Portuguese chronicler Fernão Lopes is the main source.": "Le nom vient de la Guerras portugaise Fernandinas. La chronique portugaise Fernão Lopes est la source principale."
