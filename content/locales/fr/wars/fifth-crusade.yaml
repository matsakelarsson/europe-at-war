"1220–1221": "1220–1221"
"For a year and a half the crusaders waited at Damietta for the emperor Frederick II, who had promised to come. Instead he sent troops under Duke Louis of Bavaria, who arrived in May 1221. In July, against John of Brienne’s advice, Pelagius led the army south towards Cairo, just as the Nile began its annual flood. Al-Kamil’s army waited behind a branch of the Nile at al-Mansurah, the camp town he had founded, and his brothers brought reinforcements from Syria.": "Pendant un an et demi, les croisés attendirent à Damietta l’empereur Frederick II qui avait promis de venir. Il envoya des troupes sous le duc Louis de Bavière, arrivé en mai 1221. En juillet, contre les conseils de Jean de Brienne, Pelagius conduisit l’armée vers le sud vers le Caire, tout comme le Nil commença son inondation annuelle. L’armée d’Al-Kamil a attendu derrière une branche du Nil à al-Mansurah, la ville de camp qu’il avait fondée, et ses frères ont apporté des renforts de Syrie."
"By late August the crusaders were trapped. The Egyptians broke the dykes and flooded the land around them, and their ships cut the river behind. Starving and stuck in the mud, the army surrendered on about 30 August 1221. In return for being allowed to leave, the crusaders gave up Damietta and agreed to an eight-year truce, and al-Kamil promised to return the relic of the True Cross, which could not be found. The crusaders sailed away in September having gained nothing, and many blamed Frederick for staying away.": "À la fin d’août, les croisés furent pris au piège. Les Egyptiens brisèrent les digues et inondèrent le pays autour d’eux, et leurs navires coupèrent la rivière derrière. En échange de la permission de partir, les croisés abandonnèrent Damietta et acceptèrent une trêve de huit ans, et al-Kamil promit de restituer la relique de la Vraie Croix qu’on ne pouvait trouver. Les croisés s’embarquèrent en septembre n’ayant rien gagné, et beaucoup blâmèrent Frederick d’être resté loin."
