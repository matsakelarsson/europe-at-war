"Fifth Crusade": "Cinquième croisade"
"A crusade called by Pope Innocent III to recover Jerusalem by conquering Egypt. After a Hungarian and Austrian expedition in Syria in 1217, the crusaders took Damietta in the Nile delta in 1219 after a siege of a year and a half, refusing the sultan al-Kamil’s offer to trade it for Jerusalem. Their march on Cairo in 1221 was trapped by the Nile flood near al-Mansurah, and they gave up Damietta in exchange for their freedom and an eight-year truce.": "Une croisade appelée par le pape Innocent III pour récupérer Jérusalem en conquérant l’Egypte. Après une expédition hongroise et autrichienne en Syrie en 1217, les croisés ont pris Damietta dans le delta du Nil en 1219 après un siège d’un an et demi, refusant le sultan al-Kamil í offrir de le commercer à Jérusalem. Leur marche sur le Caire en 1221 a été piégée par la crue du Nil près d’al-Mansurah, et ils ont abandonné Damietta en échange de leur liberté et une trêve de huit ans."
"Dates are Julian. The crusade had no single leader. John of Brienne, king of Jerusalem, commanded in the field, but the papal legate Pelagius of Albano claimed authority over the army, and their disputes shaped its decisions.": "Les dates sont Julian. La croisade n’avait pas de chef unique. Jean de Brienne, roi de Jérusalem, commandait dans les champs, mais le légat papale Pelagius d’Albano a revendiqué l’autorité sur l’armée, et leurs différends ont façonné ses décisions."
"The Hungarian and Austrian campaign of 1217–1218 in Syria under Andrew II of Hungary and Leopold VI of Austria is often counted as the first part of the crusade.": "La campagne hongroise et autrichienne de 1217 à 1218 en Syrie sous Andrew II de Hongrie et Léopold VI d’Autriche est souvent comptée comme la première partie de la croisade."
