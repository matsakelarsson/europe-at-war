"1217–1219": "1217–1219"
"The crusade called at the Fourth Lateran Council of 1215 began in 1217, when Andrew II of Hungary and Leopold VI of Austria led an army to Acre and raided Ayyubid lands in Galilee and beyond the Jordan without lasting result. In May 1218, joined by fleets from Frisia and the Rhineland, the crusaders sailed for Egypt, the centre of Ayyubid power, under John of Brienne, king of Jerusalem, and besieged Damietta at the mouth of the Nile. On 24 August they took the Chain Tower that barred the river, news that is said to have hastened the death of Sultan al-Adil a week later.": "La croisade appelée au quatrième Conseil du Latran de 1215 a commencé en 1217, quand André II de Hongrie et Léopold VI d’Autriche ont mené une armée à Acre et ont attaqué les terres ayyubides en Galilée et au-delà de la Jordanie sans résultat durable. En mai 1218, rejoints par des flottes de Frisia et de Rhénanie, les croisés naviguèrent pour l’Egypte, centre du pouvoir ayyoubide, sous la direction de Jean de Brienne, roi de Jérusalem, et assiégeèrent Damietta à l’embouchure du Nil. Le 24 août, ils prirent la Tour de la Chaîne qui empêchait le fleuve, nouvelle qui aurait précipité la mort de Sultan al-Adil une semaine plus tard."
"The siege lasted more than a year, through floods and disease. The papal legate Pelagius, who arrived in September 1218, claimed the leadership and rejected the new sultan al-Kamil’s offer to give up Jerusalem and much of the old kingdom in exchange for Damietta. An attack on the Egyptian camp at Fariskur on 29 August 1219 was beaten back with heavy losses. Francis of Assisi crossed the lines that autumn to preach before al-Kamil, who received him courteously. On 5 November 1219 the crusaders entered Damietta to find most of its people dead of hunger and disease.": "Le siège a duré plus d’un an, par les inondations et la maladie. Le légat papale Pelagius, qui est arrivé en septembre 1218, a revendiqué la direction et rejeté la nouvelle offre de sultan al-Kamil de renoncer à Jérusalem et une grande partie du vieux royaume en échange de Damietta. François d’Assise a traversé les lignes cet automne pour prêcher devant al-Kamil, qui l’a reçu avec courtoisie. Le 5 novembre 1219, les croisés sont entrés dans Damietta pour trouver la plupart de ses gens morts de faim et de maladie."
