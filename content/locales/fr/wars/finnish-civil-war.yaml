# Some French text was translated automatically.
"Finnish Civil War": "Guerre civile finlandaise"
"A war between the socialist Reds and the conservative Whites for the leadership of newly independent Finland, fought from January to May 1918. The Whites under Carl Gustaf Emil Mannerheim, helped by German troops, won; about 38,000 people died, among them some 12,500 Red prisoners who perished in camps after the fighting.": "Une guerre entre les rouges socialistes et les blancs conservateurs pour la direction de la Finlande nouvellement indépendante, a combattu de janvier à mai 1918. Les Blancs sous Carl Gustaf Emil Mannerheim, aidé par les troupes allemandes, ont gagné ; environ 38 000 personnes sont mortes, parmi elles quelque 12 500 prisonniers rouges qui ont péri dans des camps après les combats."
"The war has had several names in Finland, among them the War of Liberation, the Red Rebellion, the Class War and the Civil War, depending on the speaker’s side.": "La guerre a eu plusieurs noms en Finlande, parmi lesquels la Guerre de libération, la Rébellion Rouge, la Guerre de Classe et la Guerre Civile, selon le côté des orateurs."
"Places are named in Finnish. Viipuri is today Vyborg in Russia, Tammisaari is Ekenäs in Swedish, and Helsinki was Helsingfors to Swedish speakers.": "Les lieux sont nommés en finnois. Viipuri est aujourd'hui Vyborg en Russie, Tammisaari est Ekenäs en suédois, et Helsinki était Helsingfors pour les suédophones."
"The front line is approximate, drawn from general accounts.": "La ligne de front est approximative, tirée des comptes généraux."
