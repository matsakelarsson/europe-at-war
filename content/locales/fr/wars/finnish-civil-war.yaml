"April – May 1918": "avril – mai 1918"
"As the Red front collapsed, columns of Red Guards and their families tried to escape east towards Russia. German troops had taken Lahti on 19 April, and around it some 30,000 people were trapped and surrendered on 1–2 May. In Karelia the Whites stormed Viipuri on 29 April, after the Red leaders had fled by sea to Petrograd. In Viipuri the Whites shot hundreds of captured Reds and, in the following days, some 360–420 Russian civilians and soldiers, killed for being Russian. The last Reds gave up in Kymenlaakso in early May, and on 16 May Mannerheim led a victory parade through Helsinki.": "Lorsque le front rouge s’est effondré, des colonnes de gardes rouges et leurs familles ont tenté d’échapper à l’Est vers la Russie. Les troupes allemandes avaient pris Lahti le 19 avril, et autour de lui quelque 30 000 personnes ont été piégées et se sont rendues les 1er-2 mai. À Viipuri, les Blancs ont tiré sur des centaines de rouges capturés et, dans les jours suivants, quelque 360–420 civils et soldats russes, tués pour être russes. Les derniers rouges ont abandonné à Kymenlaakso au début du mois de mai, et le 16 mai Mannerheim a mené une parade de victoire à travers Helsinki."
"About 80,000 Reds, among them women, children and Russians, were held in camps such as Suomenlinna, Tammisaari, Hämeenlinna, Lahti and Tampere. Hunger and disease swept the camps, and about 12,500 prisoners died there. The White Terror killed about 9,000 Reds, and the Red Terror about 1,500 Whites. Some 38,000 people died in the war in all, in a country of three million. Most prisoners were released on parole within a year or two, but the bitterness between the two sides marked Finnish politics for a generation.": "Environ 80 000 Rouges, dont des femmes, des enfants et des Russes, ont été détenus dans des camps tels que Suomenlinna, Tammisaari, Hämeenlinna, Lahti et Tampere. La faim et la maladie ont balayé les camps, et environ 12 500 prisonniers y sont morts. Quelque 38 000 personnes sont mortes pendant la guerre, dans un pays de trois millions de personnes. La plupart des prisonniers ont été libérés en liberté conditionnelle dans un an ou deux, mais l’amertume entre les deux camps a marqué la politique finlandaise pour une génération."
