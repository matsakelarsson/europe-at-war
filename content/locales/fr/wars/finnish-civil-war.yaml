"March – April 1918": "mars – avril 1918"
"In mid-March Mannerheim attacked Tampere, Finland’s main industrial town, held by about 15,000 Red Guards. Some 16,000 Whites, among them Jägers and Swedish volunteers, surrounded the town and fought their way in street by street in the bloodiest battle of the war. Red attempts to break the siege along the railway from the south failed, and on 6 April the last Reds surrendered at Pyynikki and Pispala. About 11,000 were captured and hundreds shot, and much of the town lay in ruins.": "À la mi-mars, Mannerheim attaqua Tampere, la principale ville industrielle de Finlande, tenue par environ 15 000 gardes rouges. Environ 16 000 Blancs, parmi lesquels des Jägers et des volontaires suédois, encerclèrent la ville et combattirent leur chemin rue par rue dans la bataille la plus sanglante de la guerre. Les tentatives rouges de briser le siège le long du chemin de fer depuis le sud échouèrent, et le 6 avril les derniers rouges se rendirent à Pynikki et Pispala. Environ 11 000 personnes furent capturées et des centaines fusillées, et une grande partie de la ville était en ruines."
"The White government had asked Germany for help. On 3 April the Baltic Sea Division of about 10,000 men under General Rüdiger von der Goltz landed at Hanko and marched on Helsinki, which it took on 12–13 April with the help of local Whites. On 7 April another 3,000 Germans under Colonel Otto von Brandenstein landed at Loviisa and struck inland. Germany expected influence in return. In October 1918 a Finnish parliament without its socialist members elected a German prince, Frederick Charles of Hesse, king, but he gave up the throne after Germany’s defeat.": "Le 3 avril, la division de la mer Baltique d’environ 10 000 hommes sous le commandement du général Rüdiger von der Goltz débarqua à Hanko et marcha sur Helsinki, qu’elle prit les 12 et 13 avril avec l’aide des Blancs locaux. En octobre 1918, un parlement finlandais sans ses membres socialistes élit un prince allemand, Frederick Charles de Hesse, roi, mais il abandonne le trône après la défaite de l’Allemagne."
