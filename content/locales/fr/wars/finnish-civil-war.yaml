"January – March 1918": "janvier – mars 1918"
"Finland had declared independence on 6 December 1917, but the country was split. Workers’ Red Guards and the bourgeois Civil Guards, the Whites, had armed themselves through 1917, and tens of thousands of Russian soldiers were still in the country, though few would fight. On 27 January 1918 the Reds lit a red lantern in the tower of the Helsinki Workers’ Hall as a signal and took over the capital, and a People’s Delegation under Kullervo Manner replaced the Senate. The same night Mannerheim’s Whites began disarming the Russian garrisons in Ostrobothnia, and part of the Senate escaped to Vaasa, which became the White capital.": "La Finlande avait déclaré l’indépendance le 6 décembre 1917, mais le pays était divisé. Les travailleurs des Gardes rouges et les gardes civils bourgeois, les Blancs, s’étaient armés jusqu’en 1917, et des dizaines de milliers de soldats russes étaient encore dans le pays, même si peu se battaient. Le 27 janvier 1918, les Rouges allumèrent une lanterne rouge dans la tour de la salle des travailleurs d’Helsinki comme signal et reprirent la capitale, et une délégation du peuple sous Kullervo Manner remplaça le Sénat. La même nuit, Mannerheim, les Blancs commencèrent à désarmer les garnisons russes en Ostrobotnie, et une partie du Sénat s’échappa à Vaasa, qui devint la capitale blanche."
"The front soon settled across southern Finland, from the Gulf of Bothnia north of Pori past Tampere and along the lakes to the Karelian Isthmus. The Reds held the industrial south, with Helsinki, Turku, Tampere and Viipuri, and the Whites the rural north and centre. Both sides lacked trained officers. The Whites had Swedish volunteers and the Jäger battalion trained in Germany, most of whom landed at Vaasa on 25 February, while the Reds got weapons and some help from Russian soldiers. Both sides killed opponents behind the lines, and after taking Varkaus the Whites shot Red prisoners on the ice at Huruslahti, some reportedly chosen by lot.": "Le front s’est rapidement installé dans le sud de la Finlande, du golfe de Botnia au nord de Pori après Tampere et le long des lacs jusqu’à l’isthme carélien. Les Reds ont tenu le sud industriel, avec Helsinki, Turku, Tampere et Viipuri, et les Whites le nord rural et centre. Les Blancs avaient des volontaires suédois et le bataillon Jäger entraîné en Allemagne, la plupart d’entre eux ont atterri à Vaasa le 25 février, tandis que les Rouges recevaient des armes et un peu d’aide de soldats russes.Les deux parties tuaient des adversaires derrière les lignes, et après avoir pris Varkaus les Blancs tirèrent des prisonniers rouges sur la glace à Huruslahti, dont certains auraient été choisis par lot."
