"Russia invades Finland": "La Russie envahit la Finlande"
"After the Peace of Tilsit, Russia, now Napoleon’s ally, invaded Finland on 21 February 1808 to force Sweden into his blockade of Britain. The Swedish army fell back north, and in May the great sea fortress of Sveaborg outside Helsingfors surrendered after a short siege. Its commander, Carl Olof Cronstedt, was branded a traitor.": "Après la paix de Tilsit, la Russie, aujourd'hui alliée de Napoléon, envahit la Finlande le 21 février 1808 pour forcer la Suède à entrer dans son blocus de Grande-Bretagne. L’armée suédoise retomba au nord et, en mai, la grande forteresse maritime de Sveaborg hors d’Helsingfors se rendit après un bref siège."
"In the north the Swedish-Finnish army struck back, winning at Siikajoki and Revolax in April and at Lapua in July, but on 14 September 1808 the Russians won the war’s bloodiest battle at Oravais. Denmark–Norway had also declared war on Sweden in March. On the Norwegian border the Swedes won at Lier in April but lost at Prestebakke in June.": "Dans le nord, l’armée suédoise-finlandaise battit en arrière, remportant à Siikajoki et Revolax en avril et à Lapua en juillet, mais le 14 septembre 1808 les Russes gagnèrent la bataille la plus sanglante à Oraveis. Le Danemark et la Norvège avaient également déclaré la guerre à la Suède en mars."
