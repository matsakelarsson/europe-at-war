"In March 1809 Russian armies crossed the frozen Gulf of Bothnia: to Åland, across the Kvarken to Umeå under Barclay de Tolly, and around the north of the gulf at Torneå. In Stockholm, officers overthrew Gustav IV Adolf on 7 March, and his uncle became king as Charles XIII.": "En mars 1809, les armées russes traversent le golfe gelé de Botnie : à Åland, en travers du Kvarken jusqu’à Umeå sous Barclay de Tolly, et autour du nord du golfe de Torneå. À Stockholm, les officiers renversent Gustav IV Adolf le 7 mars, et son oncle devient roi Charles XIII."
"A last Swedish counterstroke landed at Ratan north of Umeå, but after hard fighting at Sävar and Ratan on 19–20 August, the last battles fought in Sweden, the Swedes withdrew. By the Treaty of Fredrikshamn on 17 September 1809 Sweden gave up all of Finland and Åland, about a third of its territory. Peace with Denmark followed at Jönköping in December.": "Une dernière contre-attaque suédoise débarqua à Ratan au nord d’Umeå, mais après des combats acharnés à Sävar et Ratan les 19-20 août, les derniers combats en Suède, les Suédois se retiraient. Par le traité de Fredrikshamn le 17 septembre 1809, la Suède abandonna toute la Finlande et Åland, environ un tiers de son territoire. La paix avec le Danemark suivit à Jönköping en décembre."
