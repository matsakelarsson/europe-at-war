"Finnish War": "Guerre de Finlande"
"A war in which Russia, then allied with Napoleon, conquered Finland from Sweden, while Denmark–Norway attacked Sweden from the west. By the Treaty of Fredrikshamn in 1809 Sweden lost Finland and Åland, which became a grand duchy under the Russian tsar.": "Une guerre dans laquelle la Russie, alors alliée avec Napoléon, conquiert la Finlande de Suède, tandis que le Danemark-Norvège attaque la Suède de l’ouest. Par le traité de Fredrikshamn en 1809 la Suède perd la Finlande et Åland, qui devient un grand duché sous le tsar russe."
