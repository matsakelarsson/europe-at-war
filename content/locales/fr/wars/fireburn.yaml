# French translations of the catalogue text (wave 14); step bodies follow later.
Fireburn: Fireburn
? "A rising of plantation labourers on Saint Croix in the Danish West Indies, now part of the United States Virgin Islands. Denmark had abolished slavery in its West Indian islands in 1848, but the Labour Act of 1849 bound the freed people to the estates on yearly contracts at a fixed day wage and let them change employer only once a year, on Contract Day, 1 October. On that day in 1878 crowds of labourers who had come into Frederiksted heard a rumour, which proved false, that Henry Trotman, a labourer injured by the police, had died in hospital. The police and soldiers withdrew into the fort, which the crowd failed to storm, and that night buildings across the town were set on fire and shops were looted. Soldiers arrived from Christiansted the next morning, but for days fires spread across the western part of the island, and about 50 plantations and more than half of Frederiksted were destroyed. The governor, Janus August Garde, declined help offered by British, French and American warships, and by mid-October the rising was over. About 100 labourers were killed, most of them shot by soldiers, against two soldiers and one planter; 12 men were sentenced to death and shot at once, and about 40 people were convicted later. Among them were the women remembered as the leaders, the “queens”: Mary Thomas (“Queen Mary”), Axeline Elizabeth Salomon (“Queen Agnes”) and Mathilda McBean (“Queen Mathilda”), with Susanna Abrahamson. Their death sentences were commuted by the king, and several served their terms in the women’s prison of Christianshavn in Copenhagen in 1882–1887. The rising brought slightly higher wages; Denmark sold the islands to the United States in 1917. In 2018 a statue of Mary Thomas, I Am Queen Mary, was unveiled in Copenhagen."
: "Un soulèvement d’ouvriers agricoles à Sainte-Croix, dans les Indes occidentales danoises, aujourd’hui partie des îles Vierges des États-Unis. Le Danemark avait aboli l’esclavage dans ses îles antillaises en 1848, mais la loi sur le travail (Labour Act) de 1849 liait les affranchis aux domaines par des contrats annuels à salaire journalier fixe et ne leur permettait de changer d’employeur qu’une fois par an, le jour des contrats, le 1er octobre. Ce jour-là, en 1878, des foules d’ouvriers venus à Frederiksted entendirent la rumeur, qui se révéla fausse, qu’Henry Trotman, un ouvrier blessé par la police, était mort à l’hôpital. Les policiers et les soldats se replièrent dans le fort, que la foule ne parvint pas à prendre d’assaut, et cette nuit-là des bâtiments furent incendiés dans toute la ville et des boutiques pillées. Des soldats arrivèrent de Christiansted le lendemain matin, mais pendant des jours les incendies s’étendirent dans l’ouest de l’île, et une cinquantaine de plantations et plus de la moitié de Frederiksted furent détruites. Le gouverneur, Janus August Garde, déclina l’aide offerte par des navires de guerre britanniques, français et américains, et à la mi-octobre le soulèvement était terminé. Une centaine d’ouvriers furent tués, la plupart abattus par des soldats, contre deux soldats et un planteur ; 12 hommes furent condamnés à mort et fusillés sur-le-champ, et une quarantaine de personnes furent condamnées plus tard. Parmi elles figuraient les femmes dont on se souvient comme des meneuses, les « reines » : Mary Thomas (« Queen Mary »), Axeline Elizabeth Salomon (« Queen Agnes ») et Mathilda McBean (« Queen Mathilda »), ainsi que Susanna Abrahamson. Leurs condamnations à mort furent commuées par le roi, et plusieurs purgèrent leur peine dans la prison pour femmes de Christianshavn, à Copenhague, en 1882–1887. Le soulèvement permit une légère hausse des salaires ; le Danemark vendit les îles aux États-Unis en 1917. En 2018, une statue de Mary Thomas, I Am Queen Mary, a été dévoilée à Copenhague."
