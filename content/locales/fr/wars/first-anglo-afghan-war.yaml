# French translations of the catalogue text (wave 7); step bodies follow later.
First Anglo-Afghan War: Première guerre anglo-afghane
The British East India Company’s invasion of Afghanistan to replace the Barakzai emir of Kabul, Dost Mohammad Khan, with the exiled Sadozai king Shah Shuja, whom it believed would keep Russian and Persian influence away from India. The Army of the Indus took Kandahar, stormed Ghazni and entered Kabul in 1839, and Dost Mohammad surrendered in 1840. But Shah Shuja’s rule depended on British bayonets and subsidies, and in November 1841 Kabul rose. The British envoy was killed, and in January 1842 the Kabul garrison of about 4,500 soldiers and 12,000 camp followers was destroyed on its retreat through the snowbound passes; only a handful reached Jalalabad. In 1842 two British armies fought their way back to Kabul, freed the hostages and destroyed much of the city and nearby towns before withdrawing. Shah Shuja had been killed, and Dost Mohammad returned to rule until 1863.: L’invasion de l’Afghanistan par la Compagnie britannique des Indes orientales pour remplacer l’émir barakzai de Kaboul, Dost Mohammad Khan, par le roi sadozai en exil Shah Shuja, qui, pensait-elle, tiendrait l’influence russe et persane à l’écart de l’Inde. L’armée de l’Indus prit Kandahar, emporta Ghazni d’assaut et entra à Kaboul en 1839, et Dost Mohammad se rendit en 1840. Mais le pouvoir de Shah Shuja reposait sur les baïonnettes et les subsides britanniques, et en novembre 1841 Kaboul se souleva. L’envoyé britannique fut tué et, en janvier 1842, la garnison de Kaboul, environ 4 500 soldats et 12 000 civils qui suivaient l’armée, fut anéantie pendant sa retraite par les cols enneigés ; seule une poignée d’hommes atteignit Jalalabad. En 1842, deux armées britanniques regagnèrent Kaboul en combattant, libérèrent les otages et détruisirent une grande partie de la ville et des localités voisines avant de se retirer. Shah Shuja avait été tué, et Dost Mohammad revint régner jusqu’en 1863.
