# French translations of the catalogue text (wave 13); step bodies follow later.
First Anglo-Ashanti War: Première guerre anglo-ashanti
? The first war between the Asante Empire and Britain over the Gold Coast, now Ghana. Asante, the strongest state of the forest country, had conquered the Fante coast between 1807 and 1816 and claimed the rents of the European forts. In 1821 the British government took over its forts from the African Company of Merchants and put them under Sir Charles MacCarthy, the governor of Sierra Leone, who backed the Fante and refused to accept Asante’s claims. War broke out in 1823. On 21 January 1824 MacCarthy’s small army was destroyed at Nsamankow, and he was killed; on the same day the Asantehene Osei Bonsu died in Kumasi. Two years later, on 7 August 1826, a coalition of the British, the Danes at Christiansborg and the coastal and southern Akan states defeated the new Asantehene, Osei Yaw Akoto, at Katamanso near Dodowa, helped by the terror of Congreve rockets. In a treaty of 1831, negotiated by George Maclean, Asante gave up its claims to the states south of the Pra river, which became the core of a British sphere on the coast.
: La première guerre entre l’empire ashanti et la Grande-Bretagne pour la Côte-de-l’Or, l’actuel Ghana. L’Ashanti, l’État le plus puissant du pays forestier, avait conquis la côte fanti entre 1807 et 1816 et revendiquait les redevances des forts européens. En 1821, le gouvernement britannique reprit ses forts à l’African Company of Merchants et les plaça sous l’autorité de sir Charles MacCarthy, gouverneur de la Sierra Leone, qui soutint les Fanti et refusa de reconnaître les prétentions de l’Ashanti. La guerre éclata en 1823. Le 21 janvier 1824, la petite armée de MacCarthy fut anéantie à Nsamankow, et lui-même fut tué ; le même jour, l’Asantehene Osei Bonsu mourut à Kumasi. Deux ans plus tard, le 7 août 1826, une coalition réunissant les Britanniques, les Danois de Christiansborg et les États akan de la côte et du sud vainquit le nouvel Asantehene, Osei Yaw Akoto, à Katamanso, près de Dodowa, aidée par la terreur que semaient les fusées Congreve. Par un traité de 1831, négocié par George Maclean, l’Ashanti renonça à ses prétentions sur les États situés au sud du Pra, qui devinrent le noyau d’une sphère britannique sur la côte.
