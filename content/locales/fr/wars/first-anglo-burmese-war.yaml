# French translations of the catalogue text (wave 11); step bodies follow later.
First Anglo-Burmese War: Première guerre anglo-birmane
? The first of three wars in which the British conquered Burma, and one of the longest and most expensive wars of British India. The Konbaung kingdom had conquered Arakan, Manipur and Assam, and its frontier with the East India Company’s Bengal ran from the Brahmaputra to the Naf river. After clashes on that frontier, in Cachar and on the island of Shahpuri, Governor-General Lord Amherst declared war on 5 March 1824. Burma’s leading general, Maha Bandula, won at Ramu near Chittagong in May, but a Company army under Sir Archibald Campbell had already landed at Rangoon (Yangon). Bandula’s great attack on it failed in December 1824, he was killed at Danubyu in April 1825, and another army took Arakan. After failed peace talks and a last Burmese attempt to retake Prome, Campbell advanced up the Irrawaddy to Yandabo, about 80 km from the capital Ava. By the Treaty of Yandabo (24 February 1826) Burma ceded Arakan and Tenasserim, gave up Assam and Manipur and paid an indemnity of one million pounds. Of some 40,000 British and Indian troops about 15,000 died, most of them of disease; Burmese losses are not known.
: La première des trois guerres par lesquelles les Britanniques conquirent la Birmanie, et l’une des plus longues et des plus coûteuses de l’Inde britannique. Le royaume Konbaung avait conquis l’Arakan, le Manipur et l’Assam, et sa frontière avec le Bengale de la Compagnie des Indes orientales s’étendait du Brahmapoutre au fleuve Naf. Après des accrochages sur cette frontière, au Cachar et sur l’île de Shahpuri, le gouverneur général Lord Amherst déclara la guerre le 5 mars 1824. Le principal général birman, Maha Bandula, l’emporta à Ramu, près de Chittagong, en mai, mais une armée de la Compagnie commandée par Sir Archibald Campbell avait déjà débarqué à Rangoun (Yangon). La grande attaque lancée contre elle par Bandula échoua en décembre 1824 ; il fut tué à Danubyu en avril 1825, et une autre armée prit l’Arakan. Après l’échec des pourparlers de paix et une dernière tentative birmane pour reprendre Prome, Campbell remonta l’Irrawaddy jusqu’à Yandabo, à environ 80 km de la capitale, Ava. Par le traité de Yandabo (24 février 1826), la Birmanie céda l’Arakan et le Tenasserim, renonça à l’Assam et au Manipur et versa une indemnité d’un million de livres. Sur quelque 40 000 soldats britanniques et indiens, environ 15 000 moururent, pour la plupart de maladie ; les pertes birmanes ne sont pas connues.
