# Some French text was translated automatically.
"First Anglo-Dutch War": "Première guerre anglo-néerlandaise"
"A naval war between the Commonwealth of England and the Dutch Republic, caused mainly by trade rivalry and the English Navigation Act of 1651. The fleets fought a series of great battles in the Channel and the North Sea; after English victories at the Gabbard and Scheveningen, where the Dutch admiral Maarten Tromp was killed, and a costly blockade of the Dutch coast, the Treaty of Westminster of 1654 ended the war on terms that settled little.": "Une guerre navale entre le Commonwealth d’Angleterre et la République néerlandaise, causée principalement par la rivalité commerciale et la loi anglaise de 1651 sur la navigation. Les flottes ont mené une série de grandes batailles dans la Manche et la mer du Nord ; après les victoires anglaises au Gabbard et Scheveningen, où l’amiral néerlandais Maarten Tromp a été tué, et un blocus coûteux de la côte néerlandaise, le traité de Westminster de 1654 a mis fin à la guerre à des conditions qui n’ont guère réglé."
"Dates are Old Style, as used in England. The Dutch used the Gregorian calendar, ten days ahead, so Dutch accounts date the battle of Scheveningen to 10 August 1653.": "Les dates sont Old Style, comme utilisé en Angleterre. Les Hollandais utilisaient le calendrier grégorien, dix jours à l’avance, donc les comptes néerlandais datent la bataille de Scheveningen au 10 août 1653."
"The war was fought almost entirely at sea; battle markers show the approximate area of each action. Fighting in the Mediterranean, where a Dutch squadron destroyed an English one off Livorno in March 1653, is left to the text.": "La guerre a été menée presque entièrement en mer ; les marqueurs de bataille montrent la zone approximative de chaque action. Combattre dans la Méditerranée, où un escadron hollandais a détruit un anglais au large de Livourne en mars 1653, est laissé au texte."
