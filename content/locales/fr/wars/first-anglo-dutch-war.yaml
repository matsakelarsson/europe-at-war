"1651–1652": "1651–1652"
"The Dutch carried much of Europe’s seaborne trade, and the English resented it. In October 1651 the Commonwealth, victorious in the civil wars, passed a Navigation Act that barred goods from being brought to England in third countries’ ships, a blow aimed at the Dutch, and English warships and privateers began seizing Dutch merchantmen. England also demanded that foreign ships salute its flag in the seas around Britain. On 19 May 1652 Lieutenant-Admiral Maarten Tromp, at sea off Dover with a Dutch fleet, was slow to dip his flag, and Robert Blake opened fire. The fight began a war that neither government had quite decided on.": "En octobre 1651, le Commonwealth, victorieux dans les guerres civiles, adopta une loi sur la navigation qui empêchait les marchandises d’être apportées en Angleterre dans des pays tiers, un coup dirigé contre les Hollandais, et les navires de guerre et corsaires anglais commencèrent à saisir des marchands hollandais. L’Angleterre demanda également que les navires étrangers saluent son drapeau dans les mers autour de la Grande-Bretagne. Le 19 mai 1652, le lieutenant-amiral Maarten Tromp, en mer au large de Dover avec une flotte néerlandaise, tarda à tremper son drapeau et Robert Blake ouvrit le feu."
"Dutch trade had to pass through the Channel or go the long way round Scotland, and both fleets fought for the sea lanes. In August Michiel de Ruyter beat off an English squadron near Plymouth and saw a convoy through. On 28 September Blake beat a divided Dutch fleet under Witte de With at the Kentish Knock, and the English, thinking the war as good as won, sent ships away to the Mediterranean. On 30 November Tromp, back in command, defeated Blake off Dungeness and held the Channel through the winter. Denmark, a Dutch ally, closed the Sound to English ships.": "En août, Michiel de Ruyter a battu un escadron anglais près de Plymouth et a vu passer un convoi. Le 28 septembre, Blake a battu une flotte néerlandaise divisée sous Witte de With au Kentish Knock, et les Anglais, pensant que la guerre était aussi bonne que gagnée, ont envoyé des navires en Méditerranée. Le 30 novembre, Tromp, de retour au commandement, bat Blake au large de Dungeness et tient la Manche pendant l’hiver. Danemark, allié néerlandais, ferme le Sound aux navires anglais."
