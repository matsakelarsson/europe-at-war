"1653–1654": "1653–1654"
"In February 1653 Tromp was bringing a large homeward convoy up the Channel when Blake attacked it off Portland. In three days of running battle the Dutch lost a number of warships and dozens of merchant ships, but saved most of the convoy. In June the English fleet under George Monck and Richard Deane, joined later by Blake, won a clear victory off the Gabbard shoal, helped by its heavier ships and new instructions to fight in a line. The English then blockaded the Dutch coast. Trade almost stopped, ships lay idle in the harbours, and there was hunger and unrest in the Dutch towns.": "En février 1653 Tromp amenait un grand convoi vers l’intérieur dans la Manche quand Blake l’a attaqué au large de Portland. En trois jours de bataille les Hollandais ont perdu un certain nombre de navires de guerre et des dizaines de navires marchands, mais sauvé la plupart du convoi. En juin, la flotte anglaise sous George Monck et Richard Deane, rejoint plus tard par Blake, remporte une victoire claire sur le banc de Gabbard, aidé par ses navires plus lourds et de nouvelles instructions pour combattre dans une ligne. Les Anglais ont alors bloqué la côte néerlandaise. Le commerce s’est presque arrêté, les navires sont restés inactifs dans les ports, et il y a eu faim et troubles dans les villes néerlandaises."
"On 31 July Tromp came out to break the blockade, and the fleets met off Scheveningen. Tromp was killed by a musket ball early in the battle, and the Dutch lost heavily, but the battered English fleet withdrew to refit and the blockade was lifted. Both sides were exhausted, and Oliver Cromwell, Lord Protector from December 1653, wanted peace with a fellow Protestant republic. By the Treaty of Westminster of 5 April 1654 the Dutch agreed to salute the English flag and to pay compensation, and in a secret annex the province of Holland undertook never to appoint the young William III of Orange, nephew of the exiled Charles II, as its stadtholder.": "Le 31 juillet, Tromp sortit pour briser le blocus, et les flottes se rencontrèrent au large de Scheveningen. Tromp fut tué par une balle de mousquet tôt dans la bataille, et les Hollandais perdirent fortement, mais la flotte anglaise battue se retira pour se remettre en état et le blocus fut levé. Les deux camps furent épuisés, et Oliver Cromwell, Lord Protector à partir de décembre 1653, voulut la paix avec une autre république protestante. Par le traité de Westminster du 5 avril 1654, les Hollandais acceptèrent de saluer le drapeau anglais et de verser des compensations, et dans une annexe secrète la province de Hollande s’engagea à ne jamais nommer le jeune Guillaume III d’Orange, neveu de l’exilé Charles II, comme son titulaire de stadt."
