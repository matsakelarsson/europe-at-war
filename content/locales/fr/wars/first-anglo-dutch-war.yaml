"Fought near a shoal off the Thames estuary. Several Dutch captains held back, and the fleet withdrew after losing two ships.": "Ils se sont approchés d’un haut-fond de l’estuaire de la Tamise. Plusieurs capitaines hollandais se sont rétractés, et la flotte s’est retirée après avoir perdu deux navires."
