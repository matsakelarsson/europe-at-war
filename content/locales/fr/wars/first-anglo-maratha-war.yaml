# French translations of the catalogue text (wave 8); step bodies follow later.
First Anglo-Maratha War: Première guerre anglo-marathe
The first war between the British East India Company and the Maratha state. After the murder of the Peshwa Narayanrao in 1773, the Company’s Bombay government backed his uncle Raghunathrao against the regency council of Nana Phadnavis, which ruled in the name of the infant Peshwa Madhavrao II. Bombay’s first intervention was disowned by Calcutta in the Treaty of Purandar (1776), and its second ended in the surrender of its army at Wadgaon in January 1779. Warren Hastings then sent an army across India under Thomas Goddard, which took Ahmedabad and Bassein, while another force stormed Gwalior. Neither side could win, and with Hyder Ali of Mysore at war with the Company, Mahadji Scindia mediated the Treaty of Salbai (1782). The Company kept Salsette, gave up Raghunathrao and returned its other conquests, and peace held for twenty years.: La première guerre entre la Compagnie britannique des Indes orientales et l’État marathe. Après l’assassinat du peshwa Narayanrao en 1773, le gouvernement de la Compagnie à Bombay soutint son oncle Raghunathrao contre le conseil de régence de Nana Phadnavis, qui gouvernait au nom du peshwa Madhavrao II, encore enfant. La première intervention de Bombay fut désavouée par Calcutta dans le traité de Purandar (1776), et la seconde s’acheva par la capitulation de son armée à Wadgaon en janvier 1779. Warren Hastings envoya alors à travers l’Inde une armée commandée par Thomas Goddard, qui prit Ahmedabad et Bassein, tandis qu’une autre force prenait Gwalior d’assaut. Aucun des deux camps ne parvenant à l’emporter, et Hyder Ali de Mysore étant en guerre contre la Compagnie, Mahadji Scindia servit de médiateur pour conclure le traité de Salbai (1782). La Compagnie conserva Salsette, abandonna Raghunathrao et restitua ses autres conquêtes, et la paix dura vingt ans.
