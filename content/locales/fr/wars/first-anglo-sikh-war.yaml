# French translations of the catalogue text (wave 8); step bodies follow later.
First Anglo-Sikh War: Première guerre anglo-sikhe
The first war between the East India Company and the Sikh Empire, fought along the Sutlej river six years after Maharaja Ranjit Singh’s death had left the Punjab in the hands of rival court factions and a powerful, self-governing army. The Sikh army crossed the Sutlej in December 1845 and fought four hard battles, at Mudki, Ferozeshah, Aliwal and Sobraon, all won by the British at heavy cost. By the Treaty of Lahore of March 1846 the Sikh state lost the Jullundur Doab, paid a large indemnity and gave up Kashmir, which the Company sold a week later to Gulab Singh of Jammu by the Treaty of Amritsar. A British Resident took control of the government in Lahore.: La première guerre entre la Compagnie des Indes orientales et l’Empire sikh, livrée le long de la Sutlej six ans après que la mort du maharaja Ranjit Singh eut laissé le Pendjab aux mains de factions rivales de la cour et d’une armée puissante qui se gouvernait elle-même. L’armée sikhe franchit la Sutlej en décembre 1845 et livra quatre rudes batailles, à Mudki, Ferozeshah, Aliwal et Sobraon, toutes remportées par les Britanniques au prix de lourdes pertes. Par le traité de Lahore de mars 1846, l’État sikh perdit le Doab du Jullundur, paya une lourde indemnité et céda le Cachemire, que la Compagnie vendit une semaine plus tard à Gulab Singh de Jammu par le traité d’Amritsar. Un résident britannique prit le contrôle du gouvernement à Lahore.
