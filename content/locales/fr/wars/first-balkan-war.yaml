"October 1912 – January 1913": "octobre 1912 – janvier 1913"
"The Greek Army of Thessaly under Crown Prince Constantine crossed the frontier on 18 October and forced the Sarantaporo pass on 22–23 October. Constantine wanted to turn west towards Bitola, but the prime minister, Eleftherios Venizelos, insisted that Thessaloniki, the great port that Bulgaria also wanted, must come first. After a victory at Yenidje on 1–2 November the Greeks closed on the city, and on 8 November Hasan Tahsin Pasha surrendered it with about 26,000 men. A Bulgarian division arrived a day later, and the two allies shared the city uneasily. Meanwhile a separate Greek division in western Macedonia was routed at Sorovich.": "L’armée grecque de Thessalie, sous le prince héritier Constantine a franchi la frontière le 18 octobre et forcé le col de Sarantaporo les 22-23 octobre. Constantin voulait tourner vers l’ouest en direction de Bitola, mais le premier ministre, Eleftherios Venizelos, a insisté pour que Thessalonique, le grand port que la Bulgarie voulait aussi, vienne en premier. Après une victoire à Yenidje du 1er au 2 novembre, les Grecs fermèrent la ville et, le 8 novembre, Hasan Tahsin Pacha l’abandonna avec environ 26 000 hommes. Une division bulgare arriva un jour plus tard, et les deux alliés partageaient la ville sans difficulté."
"At sea, the Greek navy kept Ottoman reinforcements from Asia off the European front. It took Lemnos on 21 October and made the bay of Moudros its base; Thasos, Imbros, Samothrace, Tenedos, Lesbos and Chios followed by early January. Rear Admiral Pavlos Kountouriotis, in the fast armoured cruiser Georgios Averof, beat the Ottoman fleet when it came out of the Dardanelles at Elli on 16 December and again off Lemnos on 18 January 1913, after which it stayed in the straits.": "En mer, la marine grecque maintient les renforts ottomans d’Asie au large du front européen. Elle prend Lemnos le 21 octobre et fait de la baie de Moudros sa base ; Thasos, Imbros, Samothrace, Tenedos, Lesbos et Chios suivi par début janvier. Le contre-amiral Pavlos Kountouriotis, dans le croiseur blindé rapide Georgios Averof, a battu la flotte ottomane lorsqu’elle est sortie des Dardanelles à Elli le 16 décembre et de nouveau au large de Lemnos le 18 janvier 1913, après quoi elle est restée dans les détroits."
