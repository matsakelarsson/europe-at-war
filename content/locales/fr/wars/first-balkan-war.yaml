"October – November 1912": "octobre – novembre 1912"
"Bulgaria sent most of its army into Thrace, the shortest way to Constantinople. While the Second Army under General Nikola Ivanov closed on the fortress of Adrianople, the First and Third Armies pushed south-east past it. The Ottoman Eastern Army attacked them in the hills around Kirk Kilisse on 22 October and was routed within three days, its reserve units breaking under fire, and the Bulgarians entered the abandoned town on 24 October. From 3 November Adrianople, held by some 60,000 men under Mehmed Şükrü Pasha, was cut off and besieged.": "La Bulgarie a envoyé la plus grande partie de son armée à Thrace, le chemin le plus court vers Constantinople. Alors que la deuxième armée sous le général Nikola Ivanov fermait sur la forteresse d’Adrianople, les première et troisième armées ont poussé au sud-est. L’armée ottomane orientale les a attaqués dans les collines autour de Kirk Kilisse le 22 octobre et a été rouée en trois jours, ses unités de réserve éclatant sous le feu, et les Bulgares sont entrés dans la ville abandonnée le 24 octobre. A partir du 3 novembre, Adrianople, détenu par quelque 60 000 hommes sous Mehmed Şükrü Pasha, a été coupé et assiégé."
"The Ottomans rallied on a line from Lule Burgas to Pınarhisar, and from 28 October to 2 November well over 200,000 men fought there, the largest battle in Europe between 1871 and 1914. The Ottoman army, short of food and shells and soon struck by cholera, gave way and fell back in disorder to the Çatalca lines, the last defences of Constantinople. Further west, Bulgarian columns crossed the Rhodopes, reached the Aegean at Dedeagach on 19 November, and in late November forced the surrender of Yaver Pasha’s corps of about 10,000 men near the Maritsa.": "Les Ottomans se sont ralliés sur une ligne de Lule Burgas à Pınarhisar, et du 28 octobre au 2 novembre bien plus de 200 000 hommes y ont combattu, la plus grande bataille en Europe entre 1871 et 1914. L’armée ottomane, à court de nourriture et d’obus et bientôt frappée par le choléra, a cédé la place et est retombée dans le désordre aux lignes de Çatalca, les dernières défenses de Constantinople. Plus à l’ouest, des colonnes bulgares traversèrent les Rhodopes, atteignirent l’Egée à Dedeagach le 19 novembre et forcèrent à la fin de novembre la reddition du corps d’environ 10 000 hommes de Yaver Pacha près de Maritsa."
