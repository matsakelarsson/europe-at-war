"Unionist officers led by Enver Bey burst into a cabinet meeting, killed the war minister and forced the grand vizier to resign.": "Des officiers syndicalistes conduits par Enver Bey ont fait irruption dans une réunion du cabinet, tué le ministre de guerre et forcé le grand vizier à démissionner."
