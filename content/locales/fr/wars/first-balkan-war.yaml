"Bulgarian and Serbian troops took the fortress after two night assaults; Mehmed Şükrü Pasha surrendered his sword to the Bulgarian commander, General Nikola Ivanov.": "Les troupes bulgares et serbes ont pris la forteresse après deux assauts de nuit ; Mehmed Şükrü Pasha a remis son épée au commandant bulgare, le général Nikola Ivanov."
