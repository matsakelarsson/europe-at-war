"Ioannina and Adrianople": "Ioannina et Adrianople"
"March 1913": "mars 1913"
"In Epirus the Greeks had stood since December before the fortified heights of Bizani, which guarded Ioannina. Crown Prince Constantine brought divisions over from Macedonia, and after a heavy bombardment the Greek army broke through on 5 March. The next day Esad Pasha surrendered the city and its garrison. Greek forces went on north into southern Albania, which Greeks called Northern Epirus, where they had taken Korçë in December, and occupied Gjirokastër and the country around it. Their presence there would be one of the hardest questions for the powers drawing Albania’s borders.": "À Epirus, les Grecs se tenaient depuis décembre devant les hauteurs fortifiées de Bizani, qui gardaient Ioannina. Le prince héritier Constantin apporta des divisions de Macédoine et après un bombardement lourd, l’armée grecque traversa le 5 mars. Le lendemain, Esad Pacha rendit la ville et sa garnison. Les forces grecques se rendirent au nord dans le sud de l’Albanie, que les Grecs appelaient Epirus du Nord, où ils avaient emmené Korçë en décembre et occupé Gjirokastër et le pays qui l’entourait."
"Adrianople had been besieged since November by the Bulgarian Second Army and two Serbian divisions, and in the war’s first air raids Bulgarian airmen dropped bombs on the city. On the night of 24–25 March the allies stormed the forts, and on 26 March Mehmed Şükrü Pasha surrendered with tens of thousands of men. Turkish accounts say that thousands of prisoners kept on the river island of Sarayiçi died of hunger and cold. The loss of the old Ottoman capital ended Ottoman hopes, and in April the Porte accepted the powers’ terms.": "Adrianople avait été assiégé depuis novembre par la Deuxième Armée bulgare et deux divisions serbes, et dans la guerre les premiers raids aériens bulgares ont largué des bombes sur la ville. Dans la nuit du 24 au 25 mars, les alliés ont pris l’assaut des forts, et le 26 mars Mehmed Şükrü Pasha s’est rendu avec des dizaines de milliers d’hommes. Les récits turcs disent que des milliers de prisonniers gardés sur l’île fluviale de Sarayiçi sont morts de faim et de froid. La perte de la vieille capitale ottomane a mis fin aux espoirs ottomans, et en avril la Porte a accepté les termes des pouvoirs."
"Battle of Bizani": "Bataille de Bizani"
