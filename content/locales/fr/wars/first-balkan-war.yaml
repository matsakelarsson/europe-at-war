"The main Serbian force, the First Army under Crown Prince Alexander, advanced up the Morava towards Skopje, the centre of Ottoman power in Kosovo and Macedonia. Zeki Pasha’s Vardar Army attacked it near Kumanovo on 23 October and after two days of fighting broke and retreated, leaving much of its artillery behind. Serbian troops entered Skopje on 26 October. The Serbian Third Army took Pristina and Prizren in Kosovo, while Serbian and Montenegrin troops divided the Sandžak and Montenegrins took Peć and Gjakova. Foreign reporters and the later Carnegie Commission described killings of Albanian civilians and burned villages in their wake.": "La principale force serbe, la première armée sous le prince héritier Alexandre, a avancé le Morava vers Skopje, le centre du pouvoir ottoman au Kosovo et en Macédoine. Zeki Pashahs Vardar Armée l’a attaqué près de Kumanovo le 23 octobre et après deux jours de combats s’est cassé et a retiré, laissant une grande partie de son artillerie derrière. La troisième armée serbe a pris Pristina et Prizren au Kosovo, tandis que les troupes serbes et monténégrines ont divisé le Sandžak et les Monténégrins ont pris Peć et Gjakova. Les journalistes étrangers et la commission Carnegie ultérieure ont décrit les meurtres de civils albanais et brûlé des villages dans leur sillage."
"The Ottoman army fell back south. The Serbs beat it again at Prilep on 3–5 November, and on 16–19 November, in the biggest battle of the Macedonian campaign, they broke its last stand before Bitola, the seat of the Manastır vilayet. The remnants fled into Albania. Meanwhile, the Serbian Third Army marched west from Kosovo across the Albanian mountains and reached the Adriatic, taking Durrës on 28 November. Austria-Hungary and Italy, determined that Serbia should not have a port on the Adriatic, warned that they would not let it stay.": "L’armée ottomane se replia vers le sud. Les Serbes la battirent de nouveau à Prilep du 3 au 5 novembre, puis percèrent ses dernières défenses devant Bitola, chef-lieu du vilayet de Manastır, du 16 au 19 novembre, lors de la plus grande bataille de la campagne de Macédoine. Les troupes ottomanes restantes se réfugièrent en Albanie. Pendant ce temps, la troisième armée serbe partit du Kosovo vers l’ouest, franchit les montagnes albanaises et atteignit l’Adriatique en prenant Durrës le 28 novembre. Déterminées à priver la Serbie d’un port sur l’Adriatique, l’Autriche-Hongrie et l’Italie l’avertirent qu’elles ne la laisseraient pas s’y maintenir."
