"Çatalca, the armistice and the London conference": "Çatalca, l’armistice et la conférence de Londres"
"November 1912 – February 1913": "novembre 1912 – février 1913"
"Ignoring Russian warnings to keep out of Constantinople, the Bulgarians attacked the Çatalca lines, which ran for some 30 kilometres from the Black Sea to the Sea of Marmara, on 17–18 November. The Ottoman defenders, reinforced from Asia and supported by the guns of their warships, threw them back, while cholera spread through both armies. On 3 December Bulgaria, for itself, Serbia and Montenegro, agreed an armistice with the Ottomans. Greece refused to sign so that its fleet could keep up the blockade, and the sieges of Adrianople, Ioannina and Scutari went on.": "Ignorant les avertissements russes de se tenir hors de Constantinople, les Bulgares attaquèrent les lignes de Catalca, qui couraient pendant une trentaine de kilomètres de la mer Noire à la mer de Marmara, du 17 au 18 novembre. Les défenseurs ottomans, renforcés d’Asie et soutenus par les canons de leurs navires de guerre, les renvoyèrent, tandis que le choléra s’étendait à travers les deux armées. Le 3 décembre, la Bulgarie, pour elle-même, la Serbie et le Monténégro, ont convenu d’un armistice avec les Ottomans. La Grèce a refusé de signer afin que sa flotte puisse maintenir le blocus, et les sièges d’Adrianople, Ioannina et Scutari se sont poursuivis."
"Peace talks opened in London on 16 December, alongside a conference of the Great Powers’ ambassadors that agreed on an autonomous Albania. When the government of Kâmil Pasha seemed ready to give up Adrianople, Enver Bey and other officers of the Committee of Union and Progress stormed the Sublime Porte on 23 January 1913 and shot the war minister, Nazım Pasha. The new government rejected the terms, and fighting resumed on 3 February. On 8 February an Ottoman attack at Bulair, at the neck of the Gallipoli peninsula, failed with heavy losses, and troops landed behind the Bulgarians at Şarköy soon re-embarked.": "Les pourparlers de paix se sont ouverts à Londres le 16 décembre, aux côtés d’une conférence des ambassadeurs des grandes puissances qui s’étaient mis d’accord sur une Albanie autonome. Lorsque le gouvernement de Kâmil Pacha semblait prêt à abandonner Adrianople, Enver Bey et d’autres officiers du Comité de l’Union et du Progrès ont pris la porte Sublime le 23 janvier 1913 et abattu le ministre de la guerre, Nazım Pacha. Le 8 février, une attaque ottomane à Bulair, au cou de la péninsule de Gallipoli, a échoué avec de lourdes pertes, et des troupes ont atterri derrière les Bulgares à Şarköy bientôt réembarqué."
