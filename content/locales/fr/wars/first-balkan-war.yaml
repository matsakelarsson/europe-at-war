"Scutari and the Treaty of London": "Scutari et le traité de Londres"
"November 1912 – May 1913": "novembre 1912 – mai 1913"
"As Serbian, Montenegrin and Greek troops occupied most of the land Albanians lived in, Albanian delegates meeting at Vlorë declared independence on 28 November 1912, with Ismail Qemali at the head of a provisional government. Austria-Hungary and Italy, unwilling to see Serbia on the Adriatic, backed an Albanian state, and in December the ambassadors in London accepted it in principle. Montenegro had besieged Scutari, the largest town of northern Albania, since 28 October, with Serbian help from February, but its costly assaults on the hills around the town failed.": "Alors que les troupes serbes, monténégrines et grecques occupaient la plupart des terres où vivaient les Albanais, les délégués albanais réunis à Vlorë ont déclaré leur indépendance le 28 novembre 1912, avec Ismail Qemali à la tête d’un gouvernement provisoire. L’Autriche-Hongrie et l’Italie, peu disposés à voir la Serbie sur l’Adriatique, ont soutenu un État albanais, et en décembre les ambassadeurs de Londres l’ont accepté en principe. Le Monténégro avait assiégé Scutari, la plus grande ville du nord de l’Albanie depuis le 28 octobre, avec l’aide des Serbes à partir de février, mais ses attaques coûteuses sur les collines autour de la ville ont échoué."
"The powers awarded Scutari to Albania, and in April an international fleet blockaded the Montenegrin coast. Even so, the garrison commander, Essad Pasha Toptani, surrendered the town to Montenegro on 23 April, in return for leaving with his troops and arms. Under threat of war from Austria-Hungary, King Nicholas gave it up, and an international force took over on 14 May. By the Treaty of London of 30 May the Ottomans ceded everything west of a line from Enos to Midia, as well as Crete, and left Albania and the Aegean islands to the powers. The victors had still to divide the spoils, and quarrelled at once.": "Le 23 avril, le commandant de la garnison, Essad Pasha Toptani, a livré la ville au Monténégro en échange d’un départ avec ses troupes et ses armes. Sous la menace de guerre de l’Autriche-Hongrie, le roi Nicholas l’a cédée et une force internationale a pris la relève le 14 mai. Par le traité de Londres du 30 mai, les Ottomans cèdent tout à l’ouest d’une ligne allant d’Enos à Midia, ainsi que de la Crète, et quittent l’Albanie et les îles Égées aux puissances."
