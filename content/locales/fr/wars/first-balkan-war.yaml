"March – October 1912": "mars – octobre 1912"
"Italy’s war for Libya and a wave of Albanian revolts had shown how weak Ottoman rule in Europe had become. On 13 March 1912 Bulgaria and Serbia signed an alliance whose secret annex divided Macedonia, the prize both wanted. Serbia was to have the north, Bulgaria the land south-east of a line from Kriva Palanka to Ohrid, and the Tsar of Russia was to arbitrate the zone between. Greece allied with Bulgaria on 29 May without any agreement on borders, and in late summer Montenegro came to terms with Bulgaria and Serbia, completing what became known as the Balkan League.": "La guerre de l’Italie pour la Libye et une vague de révoltes albanaises ont montré à quel point la domination ottomane en Europe était devenue faible. Le 13 mars 1912, la Bulgarie et la Serbie signent une alliance dont l’annexe secrète divise la Macédoine, le prix veut tous deux. La Grèce s’est alliée avec la Bulgarie le 29 mai sans aucun accord sur les frontières, et à la fin de l’été, le Monténégro est arrivé à un accord avec la Bulgarie et la Serbie, complétant ce qui est devenu connu sous le nom de Ligue des Balkans."
"The allies mobilised at the end of September, although the Great Powers warned that they would accept no change to the map. Montenegro declared war first, on 8 October, and its troops crossed into northern Albania and the Sandžak of Novi Pazar. On 13 October Bulgaria, Serbia and Greece demanded autonomy for the Christian provinces of European Turkey under their supervision, knowing it would be refused. The Ottoman Empire, which was making peace with Italy, declared war on Bulgaria and Serbia on 17 October, and Greece declared war the next day.": "Les alliés se sont mobilisés à la fin du mois de septembre, bien que les grandes puissances aient averti qu’elles n’accepteraient pas de modifier la carte.Le Monténégro a déclaré la guerre en premier, le 8 octobre, et ses troupes ont traversé le nord de l’Albanie et le Sandžak de Novi Pazar. Le 13 octobre, la Bulgarie, la Serbie et la Grèce ont exigé l’autonomie des provinces chrétiennes de Turquie européenne sous leur supervision, sachant qu’elle serait refusée. L’Empire ottoman, qui faisait la paix avec l’Italie, a déclaré la guerre à la Bulgarie et à la Serbie le 17 octobre, et la Grèce a déclaré la guerre le lendemain."
