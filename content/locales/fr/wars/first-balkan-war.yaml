# Some French text was translated automatically.
"First Balkan War": "Première guerre des Balkans"
"A war in which the Balkan League of Bulgaria, Serbia, Greece and Montenegro drove the Ottoman Empire out of almost all its remaining lands in Europe. In eight months the allies won at Kirk Kilisse, Lule Burgas, Kumanovo and Bitola, took Thessaloniki, Ioannina, Adrianople and Scutari, and by the Treaty of London of May 1913 the Ottomans gave up everything west of a line from Enos to Midia, while the Great Powers created an independent Albania.": "Une guerre dans laquelle la Ligue des Balkans de Bulgarie, Serbie, Grèce et Monténégro a chassé l’Empire ottoman de presque toutes ses terres restantes en Europe. En huit mois, les alliés ont gagné à Kirk Kilisse, Lule Burgas, Kumanovo et Bitola, pris Thessalonique, Ioannina, Adrianople et Scutari, et par le traité de Londres de mai 1913, les Ottomans ont tout abandonné à l’ouest d’une ligne d’Enos à Midia, tandis que les grandes puissances créèrent une Albanie indépendante."
"Bulgaria, Serbia, Montenegro and Greece still used the Julian (Old Style) calendar, 13 days behind the Gregorian; Greek and Bulgarian accounts often give Old Style dates (Thessaloniki surrendered on 26 October Old Style, 8 November New Style). All dates here are New Style.": "La Bulgarie, la Serbie, le Monténégro et la Grèce ont toujours utilisé le calendrier Julian (Ancien Style), 13 jours derrière le grégorien ; les comptes grecs et bulgares donnent souvent des dates Old Style (Thessaloniki remis le 26 Octobre Vieux Style, 8 Novembre Nouveau Style)."
"Places are named as in most English accounts of the war, with today’s names where they differ; Kirk Kilisse is Kırklareli, Lule Burgas is Lüleburgaz, Adrianople is Edirne, Monastir is Bitola, Üsküp is Skopje, Scutari is Shkodër, Yenidje is Giannitsa and Dedeagach is Alexandroupoli.": "Les lieux sont nommés comme dans la plupart des récits anglais de la guerre, avec aujourd'hui les noms où ils diffèrent ; Kirk Kilisse est Kırklareli, Lule Burgas est Lüleburgaz, Adrianople est Edirne, Monastir est Bitola, Üsküp est Skopje, Scutari est Shkodër, Yenidje est Giannitsa et Dedeagach est Alexandroupoli."
"The base map keeps Ottoman borders until the Treaty of London; the allied occupations of 1912–1913 are shown as approximate areas.": "La carte de base conserve les frontières ottomanes jusqu’au traité de Londres ; les occupations alliées de 1912-1913 sont représentées comme des zones approximatives."
"The war’s violence fell heavily on civilians. Muslim villagers in Macedonia, Kosovo and Thrace were killed or driven out by allied troops and irregulars, Christian villages suffered at the hands of retreating Ottoman troops and irregulars, and hundreds of thousands of refugees fled; the international Carnegie Commission described many of these crimes in 1914.": "Les villageois musulmans de Macédoine, du Kosovo et de Thrace ont été tués ou chassés par des troupes alliées et des irréguliers, les villages chrétiens ont souffert de la retraite des troupes ottomanes et des irréguliers, et des centaines de milliers de réfugiés ont fui ; la Commission internationale Carnegie a décrit nombre de ces crimes en 1914."
