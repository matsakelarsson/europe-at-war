# French translations of the catalogue text (wave 12); step bodies follow later.
First Barbary War: Première guerre barbaresque
? The war between the United States and the Regency of Tripoli under Yusuf Karamanli. Like the European powers, the United States had paid the North African regencies for safe passage for its ships; when President Jefferson refused Yusuf’s demand for more money, Yusuf declared war in May 1801 by having the flagstaff of the American consulate cut down. American squadrons, at first alongside a Swedish one, blockaded Tripoli with mixed success. In October 1803 the frigate Philadelphia ran aground off Tripoli and her crew of about 300 were taken captive; in February 1804 Stephen Decatur burned her in the harbour, and Edward Preble’s squadron bombarded the town through the summer of 1804. In 1805 the former consul William Eaton led a small force of Greek, Arab and Berber soldiers and a handful of US Marines from Egypt across the desert to take Derna for Yusuf’s exiled brother Hamet. Yusuf made peace on 4 June 1805; the United States paid $60,000 to ransom the prisoners and abandoned Hamet. Tribute to Algiers went on until the Second Barbary War of 1815.
: La guerre entre les États-Unis et la régence de Tripoli sous Yusuf Karamanli. Comme les puissances européennes, les États-Unis payaient les régences d’Afrique du Nord pour garantir le libre passage de leurs navires ; lorsque le président Jefferson refusa à Yusuf l’augmentation qu’il réclamait, celui-ci déclara la guerre en mai 1801 en faisant abattre le mât du drapeau du consulat américain. Des escadres américaines, d’abord aux côtés d’une escadre suédoise, firent le blocus de Tripoli avec des succès inégaux. En octobre 1803, la frégate Philadelphia s’échoua au large de Tripoli et son équipage d’environ 300 hommes fut fait prisonnier ; en février 1804, Stephen Decatur l’incendia dans le port, et l’escadre d’Edward Preble bombarda la ville tout au long de l’été 1804. En 1805, l’ancien consul William Eaton conduisit une petite troupe de soldats grecs, arabes et berbères et une poignée de Marines américains depuis l’Égypte à travers le désert pour prendre Derna au profit de Hamet, le frère exilé de Yusuf. Yusuf fit la paix le 4 juin 1805 ; les États-Unis payèrent 60 000 dollars pour la rançon des prisonniers et abandonnèrent Hamet. Le tribut versé à Alger se poursuivit jusqu’à la seconde guerre barbaresque, en 1815.
