"1216–1217": "1216–1217"
"John’s son Henry III, aged nine, was crowned at Gloucester on 28 October 1216, since London was in Louis’s hands. The elderly William Marshal became regent, and on 12 November Magna Carta was reissued in Henry’s name. With John gone, the barons began to drift back to the crown. Louis went to France for reinforcements early in 1217 and on his return began a second siege of Dover. Meanwhile a rebel and French army was besieging Lincoln castle, held for the king by its castellan, Nicola de la Haye. On 20 May Marshal’s army broke into the city and routed it. Its commander, the count of Perche, was killed, many rebel barons were captured, and the royalists sacked the city.": "Le fils de John Henry III, âgé de neuf ans, fut couronné à Gloucester le 28 octobre 1216, puisque Londres était aux mains de Louis. Le vieux maréchal William devint régent et, le 12 novembre, Magna Carta fut réédité au nom d’Henry. Louis s’en alla en France pour des renforts au début de 1217 et, à son retour, commença un second siège de Dover. Pendant ce temps, une armée rebelle et française assiégeait le château Lincoln, tenu pour le roi par sa castellan, Nicola de la Haye. Son commandant, le comte de Perche, a été tué, de nombreux barons rebelles ont été capturés, et les royalistes ont renvoyé la ville."
"On 24 August a French fleet under the former monk and pirate Eustace sailed to bring Louis reinforcements. Off Sandwich, Hubert de Burgh’s ships attacked from windward and captured the flagship, and Eustace was beheaded on its deck. Louis had to negotiate. By the treaty agreed near Kingston and confirmed at Lambeth on 20 September 1217, he gave up his claim and left England, the rebels were pardoned, and he was paid 10,000 marks. In November the charter was issued again, with a new Charter of the Forest.": "Le 24 août, une flotte française sous l’ancien moine et pirate Eustache s’embarqua pour apporter des renforts à Louis. Au large de Sandwich, Hubert de Burghês attaqua par le vent et captura le vaisseau, et Eustache fut décapité sur son pont. Louis dut négocier. Par le traité convenu près de Kingston et confirmé à Lambeth le 20 septembre 1217, il abandonna sa revendication et quitta l’Angleterre, les rebelles furent graciés, et on lui obtint 10 000 points.En novembre la charte fut de nouveau émise avec une nouvelle Charte de la forêt."
