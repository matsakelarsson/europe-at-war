"1215–1216": "1215–1216"
"The loss of Normandy and Anjou, heavy taxes and a long quarrel with the church turned many barons against King John. At Runnymede in June 1215 they forced him to accept Magna Carta, but neither side kept to it. Pope Innocent III annulled the charter in August, and by September the country was at war. The rebels held London. John besieged Rochester castle from 11 October; his miners brought down a corner of the keep by burning its props with the fat of forty pigs, and the starving garrison surrendered on 30 November. Over the winter John’s mercenaries ravaged the rebels’ lands in the north and East Anglia, and the rebels offered the crown to Prince Louis, son of Philip II of France.": "La perte de Normandie et d’Anjou, les lourdes taxes et une longue querelle avec l’église ont transformé de nombreux barons contre le roi Jean. À Runnymede en juin 1215, ils l’ont forcé à accepter Magna Carta, mais aucune des parties n’y est restée. Le pape Innocent III a annulé la charte en août, et en septembre le pays était en guerre. Jean assiégea le château de Rochester à partir du 11 octobre ; ses mineurs firent descendre un coin du donjon en brûlant ses accessoires avec la graisse de quarante porcs, et la garnison affamée se rendit le 30 novembre. Pendant l’hiver, les mercenaires de John ont ravagé les terres des rebelles dans le nord et l’est de l’Anglie, et les rebelles offrirent la couronne au prince Louis, fils de Philippe II de France."
"Louis landed in Kent in May 1216. John fell back to Winchester, and Louis entered London without a fight and was proclaimed king at St Paul’s, though never crowned. He took Winchester after a ten-day siege and soon held more than half the kingdom, and Alexander II of Scotland came south to do homage to him. But Dover castle, defended by Hubert de Burgh, held out against a long siege, and so did Windsor. In October John, campaigning in the east, lost part of his baggage crossing the estuaries of the Wash, fell ill with dysentery and died at Newark on the night of 18–19 October.": "Louis débarqua dans le Kent en mai 1216. Jean retourna à Winchester, et Louis entra à Londres sans se battre et fut proclamé roi à St Paul, bien qu’il ne fût jamais couronné. Il prit Winchester après un siège de dix jours et occupa bientôt plus de la moitié du royaume, et Alexandre II d’Écosse vint au sud pour lui rendre hommage. En octobre, John, faisant campagne à l’est, perdit une partie de ses bagages en traversant les estuaires du Wash, tomba malade avec la dysenterie et mourut à Newark dans la nuit du 18 au 19 octobre."
