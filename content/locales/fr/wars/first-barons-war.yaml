# Some French text was translated automatically.
"First Barons’ War": "Première guerre des Barons"
"A civil war in England that broke out after King John repudiated Magna Carta. The rebel barons offered the crown to Prince Louis of France, who invaded in 1216 and held London and much of the south-east, but after John’s death the regents of the boy king Henry III won the barons back, beat Louis’s forces at Lincoln and at sea off Sandwich in 1217, and paid him to leave.": "Une guerre civile en Angleterre a éclaté après que le roi John a répudié Magna Carta. Les barons rebelles ont offert la couronne au prince Louis de France, qui a envahi en 1216 et tenu Londres et une grande partie du sud-est, mais après la mort de Jean, les régents du garçon roi Henri III ont remporté les barons, battu les forces Louis à Lincoln et en mer au large de Sandwich en 1217, et l’a payé pour partir."
"The rebels were also joined by Alexander II of Scotland, who took Carlisle in 1216, and by Llywelyn ab Iorwerth of Gwynedd, who took castles in south Wales. Philip II officially disowned his son’s expedition, and the pope excommunicated Louis.": "Les rebelles furent également rejoints par Alexandre II d’Écosse, qui prit Carlisle en 1216, et par Llywelyn ab Iorwerth de Gwynedd, qui prit des châteaux dans le sud du pays de Galles. Philippe II renonça officiellement à l’expédition de son fils, et le pape excommunia Louis."
"The chief chronicler of the war, Roger of Wendover, was hostile to John. The peace of September 1217 is called the Treaty of Lambeth or of Kingston, after the places where it was negotiated and confirmed.": "Le chroniqueur en chef de la guerre, Roger de Wendover, était hostile à Jean. La paix de septembre 1217 est appelée le traité de Lambeth ou de Kingston, après les endroits où il a été négocié et confirmé."
