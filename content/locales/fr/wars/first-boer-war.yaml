# French translations of the catalogue text (wave 13); step bodies follow later.
First Boer War: Première guerre des Boers
? The short war in which the Boers of the Transvaal won back the independence of the South African Republic, which Britain had annexed in 1877. After three years of petitions, a mass meeting at Paardekraal proclaimed the republic restored in December 1880 under a triumvirate of Paul Kruger, Piet Joubert and Marthinus Wessel Pretorius. Boer commandos besieged the seven small British garrisons in the Transvaal, destroyed a column of the 94th Regiment at Bronkhorstspruit on 20 December, and held the Natal border against the relief force of Major-General Sir George Colley, beating it at Laing’s Nek (28 January 1881) and Schuinshoogte (8 February) and killing Colley on Majuba Hill on 27 February. Gladstone’s government made peace on 23 March 1881. By the Pretoria Convention of August 1881 the Transvaal became self-governing under British suzerainty, which the London Convention of 1884 reduced to a British veto on its treaties. Some 400 British soldiers and about 40 Boers were killed. Afrikaners call it the First War of Independence.
: La courte guerre par laquelle les Boers du Transvaal recouvrèrent l’indépendance de la République sud-africaine, que la Grande-Bretagne avait annexée en 1877. Après trois ans de pétitions, une grande assemblée réunie à Paardekraal proclama en décembre 1880 la restauration de la république sous un triumvirat formé de Paul Kruger, Piet Joubert et Marthinus Wessel Pretorius. Les commandos boers assiégèrent les sept petites garnisons britanniques du Transvaal, anéantirent une colonne du 94e régiment à Bronkhorstspruit le 20 décembre et tinrent la frontière du Natal face à la force de secours du major-général sir George Colley, qu’ils battirent à Laing’s Nek (28 janvier 1881) et à Schuinshoogte (8 février), avant de tuer Colley sur la colline de Majuba le 27 février. Le gouvernement Gladstone fit la paix le 23 mars 1881. Par la convention de Pretoria d’août 1881, le Transvaal devint autonome sous suzeraineté britannique, une suzeraineté que la convention de Londres de 1884 réduisit à un droit de veto britannique sur ses traités. Quelque 400 soldats britanniques et environ 40 Boers furent tués. Les Afrikaners l’appellent la première guerre d’indépendance.
