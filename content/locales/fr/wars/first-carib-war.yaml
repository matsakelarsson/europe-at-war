# French translations of the catalogue text (wave 14); step bodies follow later.
First Carib War: Première guerre caraïbe
? "The war in which the Garifuna (the “Black Caribs”) and Kalinago of Saint Vincent defended their lands against British settlement. When France ceded Saint Vincent to Britain in 1763, most of the island, above all the fertile windward side, was held by the Garifuna, a people of Kalinago and African descent, and the British commissioners set out to survey it and sell it to planters. In 1769 the Garifuna under their chiefs, among them Joseph Chatoyer, stopped a road-building party escorted by the 32nd Regiment and held it hostage, and they obtained arms from French Martinique. In 1772 the British government sent regiments from North America and the other islands, and Major-General William Dalrymple advanced north from Kingstown and landed troops at Grand Sable; but the Garifuna, some 1,500 to 3,000 fighters, ambushed the columns in the forested mountains, and fever killed many soldiers. With the war unpopular in Parliament, Dalrymple and the Garifuna chiefs signed a treaty on 17 February 1773: the Garifuna acknowledged the British king and kept the northern third of the island, from the Wallilabou River in the west to the Byera River in the east. It was the first treaty Britain had signed with a non-European people in the Caribbean since the Jamaican Maroon treaties of 1739."
: "La guerre par laquelle les Garifunas (les « Caraïbes noirs ») et les Kalinagos de Saint-Vincent défendirent leurs terres contre la colonisation britannique. Lorsque la France céda Saint-Vincent à la Grande-Bretagne en 1763, la plus grande partie de l’île, et surtout la fertile côte au vent, était tenue par les Garifunas, un peuple d’ascendance kalinago et africaine, et les commissaires britanniques entreprirent de l’arpenter pour la vendre à des planteurs. En 1769, les Garifunas, sous la conduite de leurs chefs, parmi lesquels Joseph Chatoyer, arrêtèrent une équipe chargée de construire une route, escortée par le 32e régiment, et la retinrent en otage ; ils obtinrent par ailleurs des armes de la Martinique française. En 1772, le gouvernement britannique envoya des régiments d’Amérique du Nord et des autres îles, et le major général William Dalrymple progressa vers le nord depuis Kingstown et débarqua des troupes à Grand Sable ; mais les Garifunas, quelque 1 500 à 3 000 combattants, tendirent des embuscades aux colonnes dans les montagnes boisées, et la fièvre tua de nombreux soldats. La guerre étant impopulaire au Parlement, Dalrymple et les chefs garifunas signèrent un traité le 17 février 1773 : les Garifunas reconnurent le roi britannique et conservèrent le tiers nord de l’île, de la rivière Wallilabou à l’ouest à la rivière Byera à l’est. C’était le premier traité que la Grande-Bretagne signait avec un peuple non européen dans les Caraïbes depuis les traités conclus avec les Marrons de la Jamaïque en 1739."
