# Some French text was translated automatically.
"First Carlist War": "Première guerre carliste"
"A civil war in Spain between the supporters of the child queen Isabella II and her mother, the regent Maria Christina, and those of Ferdinand VII’s brother Don Carlos, who claimed the throne as Carlos V and stood for absolute monarchy, the Church and the old regional rights (fueros). Fought mainly in the Basque provinces, Navarre, the Maestrazgo and Catalonia, it ended with the Convention of Vergara in 1839 and the defeat of the last Carlist armies in the east in 1840.": "Une guerre civile en Espagne entre les partisans de l’enfant reine Isabella II et sa mère, la régente Maria Christina, et ceux du frère de Ferdinand VII, Don Carlos, qui a revendiqué le trône comme Carlos V et s’est représenté pour la monarchie absolue, l’Eglise et les anciens droits régionaux (fueros). Frappée principalement dans les provinces basques, Navarre, Maestrazgo et Catalogne, elle s’achève avec la Convention de Vergara en 1839 et la défaite des dernières armées carlistes à l’Est en 1840."
"The Liberals were also called Cristinos or Isabelinos. Britain, France and Portugal backed them under the Quadruple Alliance of 1834 with loans, ships and troops, among them the British Legion of volunteers under George de Lacy Evans, the French Foreign Legion and a Portuguese division.": "Les libéraux sont également appelés Cristinos ou Isabelinos. La Grande-Bretagne, la France et le Portugal les ont soutenus sous l’Alliance Quadruple de 1834 par des prêts, des navires et des troupes, dont la Légion britannique des volontaires sous George de Lacy Evans, la Légion étrangère française et une division portugaise."
"Estimates of the dead vary widely, from about 100,000 to over 300,000 including civilians. Both sides shot prisoners and took reprisals on civilians, among them the mother of the Carlist general Ramón Cabrera, executed by the Liberals in 1836.": "Les estimations des morts varient considérablement, allant d’environ 100 000 à plus de 300 000, y compris des civils.Les deux camps ont tiré sur des prisonniers et pris des représailles contre des civils, dont la mère du général carliste Ramón Cabrera, exécuté par les libéraux en 1836."
