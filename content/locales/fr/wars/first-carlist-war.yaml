"1836 – 1837": "1836 – 1837"
"The Liberals were divided, and in August 1836 a mutiny of the guard at La Granja forced the regent to restore the constitution of 1812, while the minister Juan Álvarez Mendizábal sold off Church lands to pay for the war. The Carlists, unable to break out of the north, sent raiding columns across Spain. In 1836 General Miguel Gómez marched as far as Galicia and Andalusia and back, but held nothing. That autumn they besieged Bilbao again, and on the night of 23–24 December 1836 General Baldomero Espartero broke the siege in a snowstorm at the bridge of Luchana, with help from British ships and sailors.": "Les libéraux furent divisés et, en août 1836, une mutinerie de la garde de La Granja força le régent à rétablir la constitution de 1812, tandis que le ministre Juan Álvarez Mendizábal vendit des terres de l’Église pour payer la guerre. En 1836, le général Miguel Gómez marchait jusqu’en Galice et en Andalousie, mais ne tenait rien. Cet automne-là, ils assiégeaient de nouveau Bilbao et, dans la nuit du 23 au 24 décembre 1836, le général Baldomero Espartero rompit le siège lors d’une tempête de neige sur le pont de Luchana, avec l’aide des navires britanniques et des marins."
"In May 1837 Don Carlos himself left Estella with his best troops in the Royal Expedition, hoping to take Madrid or force a settlement with the regent. He won at Huesca and Barbastro, crossed the Ebro to join Ramón Cabrera’s forces from the Maestrazgo, was checked at Chiva in July, and in September reached the outskirts of Madrid, while a second Carlist column had taken Segovia. Expected support in the capital never came, and when Espartero’s army approached, Don Carlos turned back. The retreat to the north, harried all the way, broke Carlist morale and prestige.": "En mai 1837, Don Carlos lui-même quitta Estella avec ses meilleures troupes dans l’expédition royale, espérant prendre Madrid ou forcer une colonie avec le régent. Il gagna à Huesca et Barbastro, traversa l’Ebro pour rejoindre les forces Ramón Cabrera de la Maestrazgo, fut vérifié à Chiva en juillet, et en septembre atteignit la périphérie de Madrid, tandis qu’une deuxième colonne carliste avait pris Segovia. L’appui attendu dans la capitale n’est jamais venu, et quand l’armée d’Espartero s’approcha, Don Carlos retourna. La retraite au nord, harcelé tout le chemin, brisa le moral carliste et le prestige."
