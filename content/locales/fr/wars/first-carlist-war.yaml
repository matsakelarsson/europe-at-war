"1838 – July 1840": "1838 – juillet 1840"
"In the east Cabrera, a former seminarian whose ruthlessness matched that of his enemies, made the mountain town of Morella his base in January 1838 and beat off a Liberal siege that summer. In the north the war ground on in exhaustion. The Carlist camp split between hardline courtiers and generals ready to make peace. In February 1839 the Carlist commander, General Rafael Maroto, had several of his rivals shot at Estella, and he then negotiated with Espartero.": "Dans l’est de Cabrera, un ancien séminariste dont la cruauté correspondait à celle de ses ennemis, fit de la ville montagneuse de Morella sa base en janvier 1838 et battit un siège libéral cet été-là. Au nord, le camp carliste se séparait de courtisans et de généraux prêts à faire la paix. En février 1839, le commandant carliste, le général Rafael Maroto, fit tirer plusieurs de ses rivaux sur Estella, puis il négocia avec Espartero."
"On 31 August 1839, by the Convention of Vergara, Maroto’s army laid down its arms. Its officers kept their ranks in the royal army, and Espartero promised to recommend that the government respect the fueros. The two generals embraced before their troops. Don Carlos crossed into France in September. Espartero then turned east, took Morella on 30 May 1840 and Berga in Catalonia in early July, and Cabrera led his last men into France. The fueros of the Basque provinces and Navarre were cut back in 1839–41, and Espartero soon replaced Maria Christina as regent.": "Le 31 août 1839, par la Convention de Vergara, l’armée de Maroto a déposé ses armes. Ses officiers gardaient leurs rangs dans l’armée royale, et Espartero promettait de recommander au gouvernement de respecter les fueros. Les deux généraux s’embrassèrent devant leurs troupes. Don Carlos passa en France en septembre. Espartero tourna alors vers l’est, prit Morella le 30 mai 1840 et Berga en Catalogne au début de juillet, et Cabrera conduisit ses derniers hommes en France. Les fueros des provinces basques et Navarre furent réduits en 1839–1841, et Espartero remplaça bientôt Maria Christina comme régente."
