"October 1833 – July 1835": "octobre 1833 – juillet 1835"
"In 1830 Ferdinand VII set aside the law that barred women from the throne so that his daughter Isabella could succeed him. When he died on 29 September 1833 she became queen at the age of three, with her mother Maria Christina as regent, and his brother Don Carlos, then in Portugal, proclaimed himself king. Carlist risings broke out in October in Talavera, Bilbao, Vitoria and across the north. Most of the army and the cities stayed loyal to Isabella, and the regent turned to the liberals for support, but Carlism took hold in the countryside of the Basque provinces and Navarre, where the fueros were at stake, and in parts of Aragon and Catalonia.": "En 1830, Ferdinand VII écarta la loi qui empêchait les femmes du trône afin que sa fille Isabella puisse lui succéder. Lorsqu'il mourut le 29 septembre 1833, elle devint reine à l’âge de trois ans, avec sa mère Maria Christina comme régente, et son frère Don Carlos, alors au Portugal, se proclama roi. La plupart de l’armée et des villes sont restées fidèles à Isabella, et le régent s’est tourné vers les libéraux pour obtenir du soutien, mais Carlisme a pris place dans la campagne des provinces basques et Navarre, où les fueros étaient en jeu, et dans certaines parties d’Aragon et de Catalogne."
"In Navarre Colonel Tomás de Zumalacárregui turned the Carlist bands into a disciplined army, which used the mountains to ambush and defeat government columns. Don Carlos, shipped to Britain after the Liberal victory in Portugal, crossed France in disguise and joined him in July 1834. Both sides shot their prisoners until a British envoy, Lord Eliot, arranged an agreement on exchanging them in April 1835. Don Carlos wanted a city to win foreign recognition and ordered Zumalacárregui to besiege Bilbao. He was wounded there in June and died on 24 June 1835. In July the Liberals won at Mendigorría, but the Carlists kept their hold on the countryside.": "En Navarre, le colonel Tomás de Zumalacárregui transforma les bandes carlistes en une armée disciplinée qui se servit des montagnes pour embusquer et vaincre les colonnes du gouvernement. Don Carlos, expédié en Grande-Bretagne après la victoire libérale au Portugal, traversa la France déguisée et le rejoignit en juillet 1834. Les deux parties tuèrent leurs prisonniers jusqu’à ce qu’un envoyé britannique, lord Eliot, s’accordât sur leur échange en avril 1835. Don Carlos voulait qu’une ville soit reconnue à l’étranger et ordonna à Zumalacárregui d’assiéger Bilbao. Il y fut blessé en juin et mourut le 24 juin 1835. En juillet, les libéraux remportèrent à Mendigorría, mais les carlistes gardèrent leur main sur la campagne."
