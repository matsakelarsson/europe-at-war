"Budyonnovsk, Grozny and Khasavyurt": "Budyonnovsk, Grozny et Khasavyurt"
"June 1995 – August 1996": "juin 1995 – août 1996"
"On 14 June 1995 Shamil Basayev and more than 100 fighters drove into Budyonnovsk in southern Russia and seized its hospital with well over 1,500 hostages. Two assaults by special forces failed; Prime Minister Viktor Chernomyrdin then negotiated with Basayev by telephone, promised a ceasefire and talks, and let the gunmen return to Chechnya with volunteer hostages. At least 129 people died. The talks broke down by the end of the year, and in January 1996 Salman Raduyev’s raid on Kizlyar in Dagestan ended in a battle at Pervomayskoye. On 21 April Dudayev was killed by a Russian missile.": "Le 14 juin 1995, Shamil Basayev et plus d’une centaine de combattants se sont rendus à Budyonnovsk dans le sud de la Russie pour s’emparer de son hôpital avec plus de 1 500 otages. Deux attaques de forces spéciales ont échoué ; le Premier Ministre Viktor Chernomyrdin a ensuite négocié par téléphone avec Basayev, promis un cessez-le-feu et des pourparlers, et laissé les hommes armés retourner en Tchétchénie avec des otages volontaires. Les pourparlers ont éclaté à la fin de l’année et, en janvier 1996, le raid de Salman Raduyev sur Kizlyar au Daghestan s’est terminé par une bataille à Pervomayskoye. Le 21 avril Dudayev a été tué par un missile russe."
"On 6 August 1996, days before Yeltsin began his second term, Chechen fighters under Aslan Maskhadov infiltrated Grozny and cut off the Russian garrisons there. Yeltsin’s new security chief, Alexander Lebed, then negotiated with Maskhadov, and on 31 August they agreed the Khasavyurt Accord in Dagestan. Russian forces withdrew by the end of the year, and the question of Chechnya’s status was put off until the end of 2001. More than half a million people had been driven from their homes.": "Le 6 août 1996, des jours avant le début de son second mandat, les combattants tchétchènes sous Aslan Maskhadov infiltrèrent Grozny et y coupèrent les garnisons russes. Alexander Lebed, nouveau chef de la sécurité d’Eltsine, négocia alors avec Maskhadov, et le 31 août ils acceptèrent l’accord de Khasavyurt au Daghestan. Les forces russes se sont retirées à la fin de l’année, et la question du statut de Tchétchénie a été repoussée jusqu’à la fin de 2001. Plus d’un demi-million de personnes ont été chassées de leurs foyers."
