# Some French text was translated automatically.
"First Chechen War": "Première guerre tchétchène"
"A war in which Russia tried to end the independence that Chechnya had declared in 1991. Russian forces took a ruined Grozny in early 1995 at a heavy cost in civilian lives, but Chechen fighters fought on, and after they retook Grozny in August 1996 the Khasavyurt Accord brought a Russian withdrawal and left Chechnya’s status undecided.": "Une guerre dans laquelle la Russie a tenté de mettre fin à l’indépendance que la Tchétchénie avait déclarée en 1991. Les forces russes ont pris un Grozny ruiné au début de 1995 à un coût lourd dans la vie civile, mais les combattants tchétchènes se sont battus, et après avoir repris Grozny en août 1996, l’Accord de Khasavyurt a apporté un retrait russe et laissé le statut de Tchétchénie indécise."
"Chechnya is shown as part of Russia on the map, as it is internationally recognised; no member of the United Nations recognised Ichkeria.": "La Tchétchénie fait partie de la Russie sur la carte, car elle est reconnue internationalement ; aucun membre des Nations unies n’a reconnu Ichkeria."
"Casualty figures vary widely. Russia’s official count of its military dead is about 5,500; estimates of civilian deaths range from about 30,000 to 100,000.": "Les chiffres des victimes varient considérablement. Le nombre officiel de ses morts militaires en Russie est d’environ 5 500 ; les estimations des décès civils vont d’environ 30 000 à 100 000."
