"The storming of Grozny": "La tempête de Grozny"
"December 1994 – June 1995": "décembre 1994 – juin 1995"
"In November 1991, as the Soviet Union broke up, the former Soviet air force general Dzhokhar Dudayev, newly elected president of Chechnya, declared it independent. Russia never accepted this, and three years of uneasy separation followed. In 1994 Moscow armed an anti-Dudayev opposition, but its attack on Grozny on 26 November, with Russian soldiers secretly hired as tank crews, failed, and some of the Russians were captured. On 11 December Boris Yeltsin sent about 40,000 troops into Chechnya from the north, the west and the east.": "En novembre 1991, alors que l’Union soviétique s’est dissoute, l’ancien général de l’armée de l’air soviétique Dzhokhar Dudayev, nouvellement élu président de la Tchétchénie, a déclaré son indépendance. La Russie n’a jamais accepté cela et trois années de séparation difficile ont suivi. Le 11 décembre, Boris Eltsine a envoyé environ 40 000 soldats en Tchétchénie du nord, de l’ouest et de l’est."
"The assault on Grozny on New Year’s Eve was a disaster for Russia. Armoured columns sent into the city with little infantry were destroyed in its streets, among them the 131st Maikop Brigade at the railway station. Russia then pounded the city with artillery and bombing, took the ruins of the presidential palace on 19 January 1995 and the last districts in early March. Yeltsin’s human rights adviser Sergei Kovalev estimated that about 27,000 civilians died in the first five weeks. In April interior troops killed scores of civilians in the village of Samashki, and in June Russian forces took Vedeno and Shatoy in the mountains.": "L’assaut de Grozny le Nouvel An était un désastre pour la Russie. Des colonnes blindées envoyées dans la ville avec peu d’infanterie ont été détruites dans ses rues, parmi lesquelles la 131ème Brigade Maikop à la gare. La Russie a ensuite frappé la ville avec de l’artillerie et des bombardements, a pris les ruines du palais présidentiel le 19 janvier 1995 et les derniers districts au début mars. Le conseiller en droits humains Eltsine Sergei Kovalev a estimé qu’environ 27 000 civils étaient morts au cours des cinq premières semaines. En avril, les troupes intérieures ont tué des dizaines de civils dans le village de Samashki, et en juin, les forces russes ont emmené Vedeno et Shatoy dans les montagnes."
