# French translations of the catalogue text (wave 13); step bodies follow later.
First Congo War: Première guerre du Congo
? The war in which Rwanda, Uganda and their allies overthrew Mobutu Sese Seko, who had ruled Zaire since 1965. After the genocide of 1994, more than a million Rwandan Hutu refugees, among them the soldiers and militiamen who had carried out the genocide, settled in camps along Zaire’s eastern border, from which they raided Rwanda and attacked Congolese Tutsi. In October 1996 Rwanda’s army and Congolese Tutsi fighters attacked the camps, under the cover of a new rebel coalition, the Alliance of Democratic Forces for the Liberation of Congo-Zaire (AFDL), led by the veteran rebel Laurent-Désiré Kabila. Several hundred thousand refugees went home; others fled west across the country, where AFDL and Rwandan troops hunted them down and killed tens of thousands, killings a UN report of 2010 said might be classed as genocide if proven in court. Joined by Uganda, Burundi and Angola, the AFDL crossed Zaire in seven months against a collapsing army. Mobutu fled Kinshasa on 16 May 1997, and the next day Kabila declared himself president of the Democratic Republic of the Congo. His break with his Rwandan and Ugandan backers led to the Second Congo War in 1998.
: La guerre au cours de laquelle le Rwanda, l’Ouganda et leurs alliés renversèrent Mobutu Sese Seko, qui dirigeait le Zaïre depuis 1965. Après le génocide de 1994, plus d’un million de réfugiés hutu rwandais, parmi lesquels les soldats et les miliciens qui avaient perpétré le génocide, s’installèrent dans des camps le long de la frontière orientale du Zaïre, d’où ils lançaient des raids contre le Rwanda et attaquaient des Tutsi congolais. En octobre 1996, l’armée rwandaise et des combattants tutsi congolais attaquèrent les camps, sous le couvert d’une nouvelle coalition rebelle, l’Alliance des forces démocratiques pour la libération du Congo-Zaïre (AFDL), dirigée par le rebelle de longue date Laurent-Désiré Kabila. Plusieurs centaines de milliers de réfugiés rentrèrent chez eux ; d’autres s’enfuirent vers l’ouest à travers le pays, où les troupes de l’AFDL et les troupes rwandaises les traquèrent et en tuèrent des dizaines de milliers, des tueries qui, selon un rapport de l’ONU de 2010, pourraient être qualifiées de génocide si elles étaient prouvées devant un tribunal. Rejointe par l’Ouganda, le Burundi et l’Angola, l’AFDL traversa le Zaïre en sept mois face à une armée en pleine déliquescence. Mobutu quitta Kinshasa le 16 mai 1997 et, le lendemain, Kabila se proclama président de la République démocratique du Congo. Sa rupture avec ses parrains rwandais et ougandais conduisit à la deuxième guerre du Congo en 1998.
