Clermont and the People’s Crusade: Clermont et la Croisade populaire
1095–1097: 1095–1097
In March 1095 envoys of the Byzantine emperor Alexios I Komnenos asked Pope Urban II for soldiers to fight the Seljuk Turks, who since the 1070s had overrun most of Anatolia and taken much of Syria and Palestine. On 27 November 1095, at Clermont in France, Urban called on the knights of the West to go east, help the Christians there and free Jerusalem, promising that the journey would count as full penance for their sins. Preachers carried the call across France and Germany, and the response went far beyond anything the pope had planned.: En mars 1095, les envoyés de l’empereur byzantin Alexios I Komnenos ont demandé au pape Urban II que des soldats combattent les Turcs Seljuk qui, depuis les années 1070, avaient envahi la majeure partie de l’Anatolie et pris une grande partie de la Syrie et de la Palestine. Le 27 novembre 1095, à Clermont en France, Urbain appela les chevaliers de l’Ouest à aller vers l’est, à y aider les chrétiens et à libérer Jérusalem, promettant que le voyage compterait comme pleine pénitence pour leurs péchés. Les prédicateurs portèrent l’appel à travers la France et l’Allemagne, et la réponse allait bien au-delà de tout ce que le pape avait prévu.
The first to set out were crowds of poor people and minor knights, stirred by preachers such as Peter the Hermit. In May and June 1096 bands led by Count Emicho and others massacred the Jews of Speyer, Worms, Mainz and Cologne; King Coloman of Hungary later scattered several of these bands. Peter’s followers crossed Hungary, fought the Byzantine garrison at Niš and reached Constantinople on 1 August. Alexios ferried them over to Civetot in Asia Minor. A German group seized the fort of Xerigordos and was starved into surrender, and on 21 October the Turks of Kilij Arslan I destroyed the main body near Civetot.: Les premiers à partir étaient des foules de pauvres et de chevaliers mineurs, animés par des prédicateurs comme Peter l’Ermite. En mai et juin 1096 bandes dirigées par le comte Emicho et d’autres massacrés les juifs de Speyer, Worms, Mayence et Cologne ; le roi Coloman de Hongrie dispersa plus tard plusieurs de ces groupes. Les partisans de Pierre ont traversé la Hongrie, combattu la garnison byzantine à Niš et sont arrivés à Constantinople le 1er août. Alexios les a envoyés à Civetot en Asie Mineure. Un groupe allemand s’est emparé du fort de Xerigordos et a été affamé de capitulation, et le 21 octobre les Turcs de Kilij Arslan I ont détruit le corps principal près de Civetot.
The armies of the great lords followed. Godfrey of Bouillon, Duke of Lower Lorraine, came through Hungary and reached Constantinople on 23 December 1096. Bohemond of Taranto, Raymond of Saint-Gilles, Count of Toulouse, Robert of Normandy, Robert of Flanders and Stephen of Blois came by way of Italy, Dalmatia and the old Roman road across the Balkans, the Via Egnatia, in the spring of 1097. How many took part is uncertain, but these were the largest armies the Latin West had ever sent east, with many non-combatants among them.: Les armées des grands seigneurs suivirent. Godfrey de Bouillon, duc de Basse-Lorraine, traversa la Hongrie et atteignit Constantinople le 23 décembre 1096. Bohemond de Tarente, Raymond de Saint-Gilles, comte de Toulouse, Robert de Normandie, Robert de Flandre et Étienne de Blois sont venus par l’Italie, la Dalmatie et l’ancienne route romaine à travers les Balkans, la Via Egnatia, au printemps de 1097. Combien y ont participé est incertain, mais ce sont les plus grandes armées que l’Occident Latin ait jamais envoyées à l’est, avec beaucoup de non-combattants parmi eux.
