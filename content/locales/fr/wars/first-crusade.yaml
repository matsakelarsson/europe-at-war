First Crusade: Première croisade
The first of the great expeditions from Latin Europe to the eastern Mediterranean, called by Pope Urban II at Clermont in 1095 after the Byzantine emperor Alexios I asked for help against the Seljuk Turks. After the People’s Crusade was destroyed in Anatolia, the armies of the princes took Nicaea for Byzantium, beat the Turks at Dorylaeum, took Antioch after an eight-month siege and stormed Jerusalem in July 1099, killing much of its population. They founded the County of Edessa, the Principality of Antioch and the Kingdom of Jerusalem, later joined by the County of Tripoli.: La première des grandes expéditions de l’Europe latine à la Méditerranée orientale, appelée par le pape Urban II à Clermont en 1095 après l’empereur byzantin Alexios j’ai demandé de l’aide contre les Turcs Seljuk. Après la destruction de la croisade du peuple en Anatolie, les armées des princes prirent Nicée pour Byzance, battit les Turcs à Dorylaeum, prirent Antioche après un siège de huit mois et s’emparèrent de Jérusalem en juillet 1099, tuant une grande partie de sa population. Ils fondèrent le comté d’Edessa, la Principauté d’Antioche et le royaume de Jérusalem, rejoint par le comté de Tripoli.
Dates are Julian. Most of what is known comes from Latin chronicles written by participants (the anonymous Gesta Francorum, Raymond of Aguilers, Fulcher of Chartres), from Anna Komnene’s Alexiad, written decades later, and from Arabic historians such as Ibn al-Athir, writing a century later. Numbers of soldiers and of the dead come from these chroniclers and are uncertain.: Les dates sont Julian. La plupart de ce qui est connu vient des chroniques latines écrites par les participants (la Gesta Francorum anonyme, Raymond d’Aguilers, Fulcher de Chartres), d’Anna Komne-S Alexiad, écrit des décennies plus tard, et d’historiens arabes comme Ibn al-Athir, écrivant un siècle plus tard.
Places have the names usual in histories of the crusades, with modern names where they help, such as Nicaea (İznik), Dorylaeum (near Eskişehir), Iconium (Konya), Edessa (Şanlıurfa), Antioch (Antakya), Ma‘arra (Maarat al-Numan) and Ascalon (Ashkelon).: Les lieux ont les noms habituels dans l’histoire des croisades, avec des noms modernes où ils aident, tels que Nicée (Iznik), Dorylaeum (près d’Eskişehir), Iconium (Konya), Edessa (Şanlıurfa), Antioch (Antakya), Ma’arra (Maarat al-Numan) et Ascalon (Ashkelon).
The Crusade of 1101, the Byzantine recovery of western Anatolia and the Second Crusade have their own entries. Robert Guiscard’s and Bohemond’s earlier war against Alexios, with the battle of Dyrrhachium in 1081, is told under the Norman conquest of southern Italy.: La croisade de 1101, le rétablissement byzantin de l’Anatolie occidentale et la deuxième croisade ont leurs propres entrées. Robert Guiscard ès et Bohemond ès plus tôt la guerre contre Alexios, avec la bataille de Dyrrachium en 1081, est raconté sous la conquête normande du sud de l’Italie.
