Ma‘arra taken: Ma'arra prise
12 December 1098: 12 décembre 1098
May 1098: mai 1098
Kerbogha besieged Baldwin’s new county for three weeks before giving up and marching on to Antioch, a delay that gave the crusaders time to take the city.: Kerbogha a assiégé Baldwin dans le nouveau comté pendant trois semaines avant d’abandonner et de marcher à Antioche, un retard qui a donné aux croisés le temps de prendre la ville.
Philomelion: Philomélion
late June 1098: fin juin 1098
Alexios, marching to relieve Antioch, met deserters here and, believing the crusaders lost, withdrew and laid waste the country behind him to slow the Turks.: Alexios, marchant pour soulager Antioche, a rencontré des déserteurs ici et, croyant que les croisés ont perdu, se sont retirés et ont gaspillé le pays derrière lui pour ralentir les Turcs.
28 June 1098: 28 juin 1098
The crusaders came out of the city in six divisions, with the Holy Lance carried before them. Kerbogha’s army broke up almost without a fight.: Les croisés sont sortis de la ville en six divisions, avec la Sainte Lance portée devant eux. L’armée de Kerbogha s’est disloquée presque sans se battre.
Ma‘arrat al-Nu‘man: Ma'arrat al-Nu'man
The town was stormed after a two-week siege. Its inhabitants were killed or sold into slavery, and the episode of cannibalism was long remembered in the Muslim world.: La ville fut prise d’assaut après un siège de deux semaines. Ses habitants furent tués ou vendus en esclavage, et l’épisode du cannibalisme fut longtemps rappelé dans le monde musulman.
Kerbogha: Kerbogha
Alexios I: Alexios I
The road to Jerusalem: La route vers Jérusalem
January–July 1099: janvier–juillet 1099
Pressed by his own soldiers, Raymond of Toulouse led the march south from Ma‘arra on 13 January 1099, barefoot as a pilgrim; Bohemond stayed in Antioch. The emirs of Shaizar, Homs and Tripoli bought peace with food and money. From February to May the crusaders besieged Arqa in vain, and Peter Bartholomew, whose Holy Lance many now doubted, died after walking through fire to prove it genuine. Giving up Arqa, the army marched quickly down the coast past Beirut, Tyre and Acre, and turned inland at Arsuf to Ramla.: Pressé par ses propres soldats, Raymond de Toulouse a conduit la marche au sud de Ma'arra le 13 janvier 1099, pieds nus comme pèlerin ; Bohemond est resté à Antioche. Les émirs de Shaizar, Homs et Tripoli ont acheté la paix avec nourriture et argent. De février à mai, les croisés assiégèrent Arqa en vain, et Peter Bartholomew, dont beaucoup doutaient maintenant de la Sainte Lance, mourut après avoir traversé le feu pour prouver qu’il était authentique.
The Fatimid caliphate of Egypt had taken Jerusalem from the Turks in August 1098 and offered the crusaders free access for unarmed pilgrims, but the leaders would accept nothing less than the city. They reached it on 7 June 1099 with perhaps 1,300 knights and 12,000 foot. The governor, Iftikhar al-Dawla, had poisoned the wells outside and expelled the city’s Christians. An early assault failed for lack of ladders. Genoese sailors who had landed at Jaffa brought timber, and the crusaders built siege towers; on 8 July they walked barefoot in procession around the walls.: Le califat fatimide d’Égypte avait pris Jérusalem des Turcs en août 1098 et offert aux croisés libre accès pour les pèlerins non armés, mais les dirigeants n’accepteraient rien de moins que la ville. Ils l’atteignirent le 7 juin 1099 avec peut-être 1.300 chevaliers et 12.000 pieds. Les marins génois qui avaient débarqué à Jaffa apportèrent du bois, et les croisés construisirent des tours de siège ; le 8 juillet, ils marchaient pieds nus en procession autour des murs.
In the assault of 13–15 July, Godfrey’s tower reached the northern wall and his men broke into the city. The governor surrendered the Tower of David to Raymond and was allowed to leave, but the crusaders killed most of the Muslims they found, including many who had taken refuge in the al-Aqsa Mosque, and many of the Jews, though some were captured and later ransomed. The death toll is disputed. Ibn al-Athir gave 70,000; some modern historians estimate about 3,000. On 22 July the leaders chose Godfrey as ruler; he took the title Advocate of the Holy Sepulchre.: Dans l’assaut des 13-15 juillet, la tour de Godfrey s’approcha du mur septentrional et ses hommes se brisèrent dans la ville. Le gouverneur livra la Tour de David à Raymond et fut autorisé à partir, mais les croisés tuèrent la plupart des musulmans qu’ils trouvèrent, y compris beaucoup qui avaient trouvé refuge dans la mosquée al-Aqsa, et beaucoup de Juifs, bien que certains furent capturés et rachetés par la suite. Ibn al-Athir a donné 70 000 ; certains historiens modernes estiment environ 3000. Le 22 juillet, les dirigeants ont choisi Godfrey comme chef ; il a pris le titre d’avocat du Saint Sépulcre.
Siege of Arqa: Siège d’Arqa
14 February – 13 May 1099, abandoned: 14 février – 13 mai 1099, abandonné
