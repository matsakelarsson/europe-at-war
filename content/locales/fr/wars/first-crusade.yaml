German crusaders seized this fort but were surrounded by the Turks and, without water, surrendered after eight days. Those who refused to convert to Islam were killed.: Les croisés allemands s’emparèrent de ce fort mais furent entourés par les Turcs et, sans eau, se rendirent après huit jours. Ceux qui refusaient de se convertir à l’islam furent tués.
21 October 1096: 21 octobre 1096
The Turks ambushed the People’s Crusade as it marched out of its camp. Few survived. Peter the Hermit, who was in Constantinople, later joined the princes’ armies.: Les Turcs ont embusqué la Croisade du peuple alors qu’elle sortait de son camp. Peu ont survécu. Pierre l’Ermite, qui était à Constantinople, a ensuite rejoint les armées des princes.
