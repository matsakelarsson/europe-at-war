22 July 1099: 22 juillet 1099
Arqa: Arka
14 February – 13 May 1099: 14 février – 13 mai 1099
The town held out for three months against the crusaders, who wanted to force the emir of Tripoli to pay more. Its defenders were left in peace when the army moved on.: La ville a tenu pendant trois mois contre les croisés, qui voulaient forcer l’émir de Tripoli à payer plus. Ses défenseurs ont été laissés en paix lorsque l’armée a déménagé.
Ramla: Ramla
3 June 1099: 3 juin 1099
The crusaders found the town abandoned and made the nearby church of St George at Lydda the seat of the first Latin bishop in the Holy Land.: Les croisés trouvèrent la ville abandonnée et firent de l’église voisine de St George à Lydda le siège du premier évêque latin en Terre Sainte.
Jaffa: Jaffa
17 June 1099: 17 juin 1099
Genoese ships put in at the abandoned port. Their crews brought the timber and skills to build siege engines.: Des navires génois sont entrés dans le port abandonné. Leurs équipages ont apporté du bois et des compétences pour construire des moteurs de siège.
Jerusalem: Jérusalem
15 July 1099: 15 juillet 1099
Godfrey’s men crossed from their tower onto the northern wall near the Gate of Flowers. The city was taken after a siege of five weeks.: Les hommes de Godfrey ont traversé de leur tour le mur nord près de la porte des fleurs. La ville a été prise après un siège de cinq semaines.
Ascalon and the crusader states: Ascalon et les états croisés
1099–1109: 1099–1109
In August 1099 the Fatimid vizier al-Afdal Shahanshah brought an army from Egypt to Ascalon to recover Jerusalem. The crusaders marched out to meet him, and at dawn on 12 August they surprised his camp outside the town and routed his army. Ascalon itself wanted to surrender to Raymond, but Godfrey would not let him have it, and it stayed in Fatimid hands until 1153. Most of the crusaders now went home, leaving Godfrey with a few hundred knights.: En août 1099, le fatimide vizir al-Afdal Shahanshah amena une armée d’Égypte à Ascalon pour récupérer Jérusalem. Les croisés se rendirent à sa rencontre et, à l’aube du 12 août, ils ont surpris son camp en dehors de la ville et acheminèrent son armée. Ascalon lui-même voulait se rendre à Raymond, mais Godfrey ne voulut pas le laisser l’avoir, et il resta entre les mains de Fatimid jusqu’en 1153. La plupart des croisés sont rentrés chez eux, laissant Godfrey avec quelques centaines de chevaliers.
The crusade had created three Latin states, known together in the West as Outremer, “the land beyond the sea”. When Godfrey died in July 1100, his brother Baldwin of Edessa came south and was crowned King of Jerusalem in Bethlehem on Christmas Day 1100. With fleets from Genoa, Pisa and Venice the Franks took the coastal towns, among them Caesarea in 1101, Acre in 1104, Tripoli in 1109 after a long siege, Beirut and Sidon in 1110 and Tyre in 1124. Tripoli became a fourth state, a county ruled by Raymond of Toulouse’s heirs.: La croisade avait créé trois états latins, connus en Occident sous le nom d’Outremer, la terre au-delà de la mer. Quand Godfrey est mort en juillet 1100, son frère Baldwin d’Edessa est venu au sud et a été couronné roi de Jérusalem à Bethléem le jour de Noël 1100. Avec des flottes de Gênes, Pise et Venise les Francs ont pris les villes côtières, parmi lesquelles Césarée en 1101, Acre en 1104, Tripoli en 1109 après un long siège, Beyrouth et Sidon en 1110 et Tyr en 1124. Tripoli est devenu un quatrième État, un comté dirigé par Raymond de Toulouse héritiers.
Bohemond, who had kept Antioch against his oath to Alexios, was captured by the Danishmendids in 1100, and the armies of the Crusade of 1101 were destroyed in Anatolia. A Turkish victory at Harran in 1104 stopped the Franks’ advance towards Mesopotamia. Bohemond went to Europe to raise an army against Byzantium, but failed to take Dyrrhachium and in the Treaty of Devol (1108) had to accept Alexios as his overlord. The treaty was never carried out.: Bohemond, qui avait tenu Antioche contre son serment à Alexios, fut capturé par les Danois en 1100, et les armées de la Croisade de 1101 furent détruites en Anatolie. Une victoire turque à Harran en 1104 stoppa l’avancée Franks. Bohemond est allé en Europe pour lever une armée contre Byzance, mais n’a pas pris Dyrrachium et dans le Traité de Devol (1108) a dû accepter Alexios comme son maître. Le traité n’a jamais été exécuté.
