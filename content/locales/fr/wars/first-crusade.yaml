Tancred reached the town first, but Baldwin, with the larger force, made him leave. Baldwin then refused to let 300 of Bohemond’s men in, and the Turks killed them outside the walls.: Tancred atteignit la ville d’abord, mais Baldwin, avec la plus grande force, le fit partir. Baldwin refusa alors de laisser entrer 300 hommes de Bohemond et les Turcs les tuèrent en dehors des murs.
Marash: Maréchal
October 1097: octobre 1097
The army rested in this Armenian town after a hard crossing of the Anti-Taurus mountains, where many men and animals fell from the narrow paths.: L’armée s’est reposée dans cette ville arménienne après une traversée difficile des montagnes d’Anti-Taurus, où de nombreux hommes et animaux sont tombés des sentiers étroits.
Main army: Armée principale
Tancred and Baldwin: Tancre et Baldwin
Edessa and the siege of Antioch: Edessa et le siège d’Antioche
October 1097 – June 1098: octobre 1097 – juin 1098
At Marash Baldwin of Boulogne left the main army with a small force and rode east towards the Euphrates, where Armenian Christians welcomed him and helped him take Turbessel and Ravendel. Thoros, the Armenian lord of Edessa, hard pressed by his Turkish neighbours, invited him in and adopted him as his son. On 9 March 1098 Thoros was killed by a mob, which Baldwin may have encouraged, and the next day Baldwin took over the city. The County of Edessa, a mainly Armenian land astride the Euphrates, was the first crusader state.: À Marash Baldwin de Boulogne, la principale armée partit avec une petite force et monta à l’est vers l’Euphrate, où les chrétiens arméniens l’accueillèrent et l’aidèrent à prendre Turbessel et Ravendel. Thoros, le seigneur arménien d’Edessa, fort pressé par ses voisins turcs, l’invita à entrer et l’adopta comme son fils. Le 9 mars 1098, Thoros a été tué par une foule, que Baldwin aurait peut-être encouragée, et le lendemain, Baldwin a repris la ville. Le comté d’Edessa, une terre principalement arménienne astrière de l’Euphrate, était le premier État croisé.
Antioch, the great city of northern Syria, had been Byzantine until 1084. Its Turkish governor, Yaghi-Siyan, held walls that climbed the steep mountain behind the city and could not be fully surrounded, and the crusaders blockaded it from 20 October 1097. That winter they starved. Foraging parties had to go far afield; Bohemond and Robert of Flanders beat a relief army from Damascus on 31 December, and on 9 February 1098 Bohemond routed one from Aleppo. Many deserted, and the Byzantine contingent under Tatikios left in February.: Antioche, la grande ville du nord de la Syrie, avait été byzantine jusqu’en 1084. Son gouverneur turc, Yaghi-Siyan, tenait des murs qui grimpaient la montagne raide derrière la ville et ne pouvaient pas être complètement encerclés, et les croisés l’ont bloqué à partir du 20 octobre 1097. Les groupes de recherche de nourriture ont dû aller loin ; Bohemond et Robert de Flandre ont battu une armée de secours de Damas le 31 décembre, et le 9 février 1098 Bohemond en a fait route depuis Alep. Beaucoup ont déserté, et le contingent byzantin sous Tatikios est parti en février.
In March an English fleet landed timber and supplies at the port of St Symeon, and the crusaders built forts to close the city’s gates. Bohemond secretly won over Firuz, who commanded towers on the walls. On the night of 2–3 June 1098 crusaders climbed into the city by a rope ladder and opened the gates, and in the darkness killed many of its people, Christians as well as Muslims. Yaghi-Siyan fled and was killed; his son held out in the citadel high above the town.: En mars, une flotte anglaise débarqua du bois et des provisions au port de St Symeon, et les croisés construisirent des forts pour fermer les portes de la ville. Bohemond gagna secrètement Firuz, qui commanda des tours sur les murs. Dans la nuit du 2 au 3 juin 1098, des croisés montèrent dans la ville par une échelle de corde et ouvrirent les portes, et dans l’obscurité tuèrent beaucoup de ses habitants, chrétiens comme musulmans. Yaghi-Siyan s’enfuit et fut tué ; son fils se tenait dans la citadelle au-dessus de la ville.
