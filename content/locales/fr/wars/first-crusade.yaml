Antioch: Antioche
One of the longest sieges of the crusades. The city fell by treachery after more than seven months.: L’un des plus longs sièges des croisades. La ville est tombée par la trahison après plus de sept mois.
Baldwin of Boulogne: Baldwin de Boulogne
Ridwan of Aleppo: Ridwan d’Alep
The battle of Antioch: La bataille d’Antioche
June–December 1098: juin–décembre 1098
Within days of taking the city, the crusaders were themselves besieged. Kerbogha, the atabeg of Mosul, had gathered an army of Turkish and Arab emirs, among them Duqaq of Damascus, and on the way had spent three weeks trying in vain to take Edessa. Trapped between his army and the citadel, the crusaders starved, and many let themselves down the walls on ropes and fled. One of them, Stephen of Blois, met Alexios at Philomelion as the emperor marched to help and persuaded him that the crusade was lost. Alexios turned back, which the crusaders never forgave.: Quelques jours après avoir pris la ville, les croisés étaient eux-mêmes assiégés. Kerbogha, l’atabeg de Mossoul, avait rassemblé une armée d’émirs turcs et arabes, parmi lesquels Duqaq de Damas, et sur le chemin avait passé trois semaines à essayer en vain de prendre Edessa. L’un d’eux, Étienne de Blois, rencontra Alexios à Philomelion alors que l’empereur marchait pour l’aider et le persuadait que la croisade était perdue. Alexios retourna en arrière, que les croisés ne pardonnèrent jamais.
On 14 June, after a poor Provençal pilgrim, Peter Bartholomew, reported visions of St Andrew, a spearhead said to be the Holy Lance that had pierced Christ was dug up in the cathedral of St Peter. Their spirits raised, the crusaders marched out on 28 June under Bohemond’s command. Kerbogha let them deploy, but his coalition, divided by rivalries and fears of his ambitions, fell apart; several emirs left the field and the rest of the army fled. The citadel surrendered the same day.: Le 14 juin, après un pauvre pèlerin provençal, Peter Bartholomew a rapporté des visions de saint André, un fer de lance dit être la Sainte Lance qui avait percé le Christ a été déterré dans la cathédrale de saint Pierre. Leurs esprits se sont levés, les croisés ont marché le 28 juin sous l’ordre de Bohemond. Kerbogha les laissa se déployer, mais sa coalition, divisée par des rivalités et des craintes de ses ambitions, s’écroula ; plusieurs émirs quittèrent le champ et le reste de l’armée s’enfuit. La citadelle se rendit le même jour.
The victory saved the crusade, but the leaders did not march on. An epidemic broke out, killing Adhemar of Le Puy on 1 August, and Bohemond and Raymond quarrelled over Antioch, which Bohemond claimed in spite of the oath to Alexios. In late November the army besieged Ma‘arrat al-Nu‘man. It fell on 12 December and its people were massacred, and crusader chroniclers wrote that starving soldiers ate the bodies of the dead.: La victoire a sauvé la croisade, mais les dirigeants n’ont pas marché. Une épidémie a éclaté, tuant Adhemar du Puy le 1er août, et Bohemond et Raymond se sont disputés sur Antioche, ce que Bohemond a réclamé malgré le serment à Alexios. Fin novembre l’armée a assiégé Ma 'arrat al-Nu'man. Il est tombé le 12 décembre et son peuple a été massacré, et les chroniqueurs croisés ont écrit que des soldats affamés mangeaient les corps des morts.
