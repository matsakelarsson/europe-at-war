The first pitched battle of the crusade. The crusaders lost heavily but held their ground, and the Turks never again tried to stop them in open battle in Anatolia.: La première bataille de la croisade a été lancée. Les croisés ont perdu beaucoup, mais ont tenu leur terre, et les Turcs n’ont plus jamais essayé de les arrêter dans une bataille ouverte en Anatolie.
