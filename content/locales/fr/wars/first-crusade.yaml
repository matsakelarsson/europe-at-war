Dorylaeum and the march across Anatolia: Dorylaeum et la marche à travers l’Anatolie
July–October 1097: juillet–octobre 1097
The army left Nicaea at the end of June in two groups, a day’s march apart. On 1 July 1097, near Dorylaeum, Kilij Arslan, now allied with the Danishmendid emir Gazi Gümüshtigin, surrounded the leading group under Bohemond, Robert of Normandy and Stephen of Blois. For hours Turkish horse archers shot into the knights and the crowded camp. The crusaders held on until Godfrey and Raymond came up with the second group and the papal legate, Bishop Adhemar of Le Puy, fell on the Turks from behind. The Turks fled, leaving their camp and treasure.: Le 1er juillet 1097, près de Dorylaeum, Kilij Arslan, désormais allié avec l’émir danois Gazi Gümüshtigin, encercle le groupe dirigeant sous Bohemond, Robert de Normandie et Stephen de Blois. Pendant des heures les archers turcs tirèrent dans les chevaliers et le camp bondé. Les croisés ont continué jusqu’à ce que Godfrey et Raymond viennent avec le deuxième groupe et le légat papale, Mgr Adhemar du Puy, tombe sur les Turcs de derrière.
Kilij Arslan stripped the country ahead of the crusaders. Their march across the dry Anatolian plateau in July and August cost many lives and most of the horses; knights went on foot, and oxen, goats and even dogs carried the baggage. They passed Philomelion and Iconium, beat another Turkish force at Heraclea in September and turned north-east by Caesarea and over the Anti-Taurus to Marash, reaching Antioch on 20 October. Meanwhile Tancred and Baldwin of Boulogne, Godfrey’s brother, crossed into Cilicia and quarrelled over Tarsus, which Baldwin took; Tancred went on to Adana and Mamistra.: Kilij Arslan dépouillait le pays devant les croisés. Leur marche sur le plateau anatolien sec en juillet et août a coûté beaucoup de vies et la plupart des chevaux ; les chevaliers allaient à pied, et les bœufs, les chèvres et même les chiens portaient les bagages. Ils passèrent Philomelion et Iconium, battèrent une autre force turque à Heraclea en septembre et tournèrent vers le nord-est par Césarée et sur l’Anti-Taurus jusqu’à Marash, atteignant Antioche le 20 octobre. Pendant ce temps Tancred et Baldwin de Boulogne, le frère de Godfrey, se sont croisés en Cilicie et se sont disputés sur Tarse, que Baldwin a pris ; Tancred est allé à Adana et à Mamistra.
