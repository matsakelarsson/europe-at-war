Constantinople and Nicaea: Constantinople et Nicée
Alexios had hoped for soldiers he could command, not independent armies led by great lords, one of whom, Bohemond, had invaded the empire with his father Robert Guiscard in 1081. He supplied the crusaders but asked each leader to swear to return to the empire any former imperial lands they took. Most did, some only after armed clashes outside the walls. Raymond of Toulouse swore only to respect the emperor’s life and honour, and Bohemond’s nephew Tancred slipped across the Bosporus to avoid swearing at all.: Alexios avait espéré pouvoir commander des soldats, pas des armées indépendantes dirigées par de grands seigneurs, dont l’un, Bohemond, avait envahi l’empire avec son père Robert Guiscard en 1081. Il a fourni les croisés, mais a demandé à chaque chef de jurer de retourner à l’Empire tous les anciens pays impériaux qu’ils avaient pris. Raymond de Toulouse a juré seulement de respecter la vie et l’honneur de l’empereur, et le neveu de Bohemond Tancred a glissé sur le Bospore pour éviter de jurer.
In May 1097 the armies besieged Nicaea, the capital of Kilij Arslan’s Sultanate of Rum, beside Lake Askania. Kilij Arslan, who had been away fighting the Danishmendids, came back and attacked on 16 May, but was beaten off with heavy losses. Alexios had boats hauled overland to the lake to cut the city off. Seeing no hope, the garrison secretly negotiated with the Byzantine commander Manuel Boutoumites, and on 19 June the crusaders woke to find imperial banners on the walls. Many resented losing the plunder, though Alexios rewarded the leaders generously.: En mai 1097, les armées assiégées Nicaea, la capitale du Sultanat de Rhum Kilij Arslan, près du lac Askania. Kilij Arslan, qui avait été loin en combattant les mendids danois, est revenue et a attaqué le 16 mai, mais a été battu avec de lourdes pertes. Alexios avait des bateaux transporté par terre au lac pour couper la ville. Ne voyant aucun espoir, la garnison négocia secrètement avec le commandant byzantin Manuel Boutoumites et, le 19 juin, les croisés se réveillèrent pour trouver des bannières impériales sur les murs.
