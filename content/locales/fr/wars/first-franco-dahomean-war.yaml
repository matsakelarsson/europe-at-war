# French translations of the catalogue text (wave 13); step bodies follow later.
First Franco-Dahomean War: Première guerre du Dahomey
? A short war between France and the Kingdom of Dahomey over the coast of what is now Benin. France had claimed a protectorate over Porto-Novo, a rival kingdom long raided by Dahomey, since 1863 (renewed in 1882 under King Toffa I), and claimed the port of Cotonou under treaties of 1868 and 1878 signed by Dahomey’s officials at Ouidah, while Dahomey went on collecting customs there and raiding villages in the Ouémé valley under French protection. A French mission to Abomey in late 1889 achieved nothing, and the new king, Béhanzin, who succeeded his father Glele at the end of December 1889, refused to give up his rights. On 21 February 1890 the French arrested Dahomey’s officials in Cotonou and fortified the town. On 4 March a Dahomean army of several thousand, women soldiers among them, stormed the stockade before dawn and fought for four hours before withdrawing with several hundred dead, 129 of them inside the French lines. On 20 April, at Atchoupa north of Porto-Novo, Toffa’s warriors fled under fire, but a French column of about 350 men in squares held off repeated attacks, and Béhanzin withdrew to Abomey. By a treaty of 3 October 1890 Dahomey recognised the French protectorate over Porto-Novo and French rule in Cotonou in return for 20,000 francs a year. Both sides rearmed, and war came again in 1892.
: Une courte guerre entre la France et le royaume du Dahomey pour la côte de l’actuel Bénin. Depuis 1863, la France revendiquait un protectorat sur Porto-Novo, royaume rival longtemps razzié par le Dahomey (protectorat renouvelé en 1882 sous le roi Toffa Ier), ainsi que le port de Cotonou, en vertu de traités de 1868 et de 1878 signés par les dignitaires du Dahomey à Ouidah, tandis que le Dahomey continuait d’y percevoir des droits de douane et de razzier des villages de la vallée de l’Ouémé placés sous protection française. Une mission française à Abomey, fin 1889, n’aboutit à rien, et le nouveau roi, Béhanzin, qui avait succédé à son père Glélé à la fin de décembre 1889, refusa de renoncer à ses droits. Le 21 février 1890, les Français arrêtèrent les dignitaires du Dahomey à Cotonou et fortifièrent la ville. Le 4 mars, une armée dahoméenne de plusieurs milliers de combattants, parmi lesquels des femmes soldats, donna l’assaut à la palissade avant l’aube et combattit pendant quatre heures avant de se retirer en laissant plusieurs centaines de morts, dont 129 à l’intérieur des lignes françaises. Le 20 avril, à Atchoupa, au nord de Porto-Novo, les guerriers de Toffa s’enfuirent sous le feu, mais une colonne française d’environ 350 hommes formés en carrés repoussa des attaques répétées, et Béhanzin se retira à Abomey. Par un traité du 3 octobre 1890, le Dahomey reconnut le protectorat français sur Porto-Novo et l’autorité française à Cotonou en échange de 20 000 francs par an. Les deux camps réarmèrent, et la guerre reprit en 1892.
