# French translations of the catalogue text (wave 11); step bodies follow later.
First Indochina War: Première guerre d’Indochine
? The war between France and the Viet Minh, the Communist-led front that had proclaimed the independence of Vietnam as the Democratic Republic of Vietnam in September 1945, fought mainly in Vietnam but also in Laos and Cambodia. After Japan’s surrender the Viet Minh took power in Hanoi in the August Revolution, while British troops helped the French back into Saigon and Chinese troops occupied the north. A compromise of March 1946 broke down, and after the French bombardment of Haiphong in November the Viet Minh attacked the French in Hanoi on 19 December 1946. The French held the cities and the Red River delta; the Viet Minh held the hills of the Việt Bắc and much of central Vietnam and waged guerrilla war everywhere else. France set up the State of Vietnam under the former emperor Bảo Đại in 1949. From 1950 China armed and advised the Viet Minh and the United States paid an ever larger share of France’s costs. Võ Nguyên Giáp’s regular divisions drove the French from the Chinese border in 1950, were beaten back from the delta in 1951, and took the north-west and pushed into Laos in 1952–1953. The fall of the French garrison at Điện Biên Phủ on 7 May 1954 led to the Geneva agreements of 21 July, which divided Vietnam at the 17th parallel. Estimates of the dead range from about 400,000 to over 800,000 soldiers and civilians.
: La guerre qui opposa la France au Viêt Minh, le front dirigé par les communistes qui avait proclamé l’indépendance du Vietnam sous le nom de République démocratique du Vietnam en septembre 1945 ; elle se déroula principalement au Vietnam, mais aussi au Laos et au Cambodge. Après la capitulation du Japon, le Viêt Minh prit le pouvoir à Hanoï lors de la révolution d’Août, tandis que des troupes britanniques aidaient les Français à reprendre pied à Saïgon et que des troupes chinoises occupaient le Nord. Un compromis conclu en mars 1946 ne tint pas, et après le bombardement français de Haiphong en novembre, le Viêt Minh attaqua les Français à Hanoï le 19 décembre 1946. Les Français tenaient les villes et le delta du fleuve Rouge ; le Viêt Minh tenait les collines du Việt Bắc et une grande partie du centre du Vietnam, et menait la guérilla partout ailleurs. La France créa en 1949 l’État du Vietnam, à la tête duquel elle plaça l’ancien empereur Bảo Đại. À partir de 1950, la Chine arma et conseilla le Viêt Minh, et les États-Unis prirent en charge une part toujours plus grande des dépenses de la France. Les divisions régulières de Võ Nguyên Giáp chassèrent les Français de la frontière chinoise en 1950, furent repoussées du delta en 1951, puis s’emparèrent du Nord-Ouest et pénétrèrent au Laos en 1952–1953. La chute de la garnison française de Điện Biên Phủ, le 7 mai 1954, conduisit aux accords de Genève du 21 juillet, qui divisèrent le Vietnam au niveau du 17e parallèle. Les estimations des morts vont d’environ 400 000 à plus de 800 000 soldats et civils.
