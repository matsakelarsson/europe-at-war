# French translations of the catalogue text (wave 7); step bodies follow later.
First Iraqi–Kurdish War: Première guerre kurdo-irakienne
The Kurdish revolt in northern Iraq led by Mustafa Barzani and the Kurdistan Democratic Party (KDP) against the governments of Abd al-Karim Qasim, the Arif brothers and, from 1968, the Ba’ath party. It began in September 1961, after Qasim, who had welcomed Barzani home from Soviet exile in 1958, refused Kurdish demands for autonomy. The Kurdish Peshmerga held the mountains along the Iranian and Turkish borders against repeated offensives, interrupted by ceasefires in 1963, 1964 and 1966; their victory at Mount Handrin in May 1966 was the largest of the war. Iran, and secretly Israel, came to support the Kurds. The war ended with the agreement of 11 March 1970, in which the Ba’athist government promised the Kurds autonomy within four years. Estimates of the dead range from about 10,000 to as many as 100,000.: La révolte kurde dans le nord de l’Irak, menée par Moustafa Barzani et le Parti démocratique du Kurdistan (PDK) contre les gouvernements d’Abdel Karim Kassem, des frères Aref puis, à partir de 1968, du parti Baas. Elle commença en septembre 1961, après que Kassem, qui avait accueilli Barzani à son retour d’exil en Union soviétique en 1958, eut rejeté les revendications kurdes d’autonomie. Les peshmergas kurdes tinrent les montagnes le long des frontières iranienne et turque face à des offensives répétées, entrecoupées de cessez-le-feu en 1963, 1964 et 1966 ; leur victoire au mont Handrin, en mai 1966, fut la plus importante de la guerre. L’Iran et, en secret, Israël en vinrent à soutenir les Kurdes. La guerre prit fin avec l’accord du 11 mars 1970, par lequel le gouvernement baasiste promettait aux Kurdes l’autonomie dans un délai de quatre ans. Les estimations du nombre de morts vont d’environ 10 000 jusqu’à 100 000.
