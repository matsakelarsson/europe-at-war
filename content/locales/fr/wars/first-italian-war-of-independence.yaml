The Five Days of Milan: Les cinq jours de Milan
18 March – 30 April 1848: 18 mars – 30 avril 1848
News of the revolution in Vienna reached Milan, the capital of Austrian Lombardy, on 17 March 1848, and the next day the city rose against its garrison. For five days the Milanese fought from barricades, directed by a council of war under the federalist Carlo Cattaneo, and on the night of 22 March Field Marshal Joseph Radetzky, then 81, withdrew his troops from the city. About 400 Milanese and 180 Austrian soldiers had been killed. In Venice crowds freed the lawyer Daniele Manin from prison, the Austrian garrison left, and on 22 March Manin proclaimed the Republic of San Marco. Towns across Lombardy and Venetia rose, and the dukes of Parma and Modena fled.: Les nouvelles de la révolution à Vienne arrivèrent à Milan, capitale de la Lombardie autrichienne, le 17 mars 1848, et le lendemain la ville s’éleva contre sa garnison. Pendant cinq jours, les Milanais combattirent des barricades, dirigés par un conseil de guerre sous le fédéraliste Carlo Cattaneo, et dans la nuit du 22 mars, le maréchal Joseph Radetzky, alors 81, retira ses troupes de la ville. Environ 400 Milanais et 180 soldats autrichiens avaient été tués. À Venise, des foules ont libéré l’avocat Daniele Manin de prison, la garnison autrichienne a quitté, et le 22 mars Manin a proclamé la République de San Marco.
On 23 March King Charles Albert of Sardinia declared war on Austria, partly to forestall a republican revolution, and his army crossed the Ticino into Lombardy. The Pope, the Grand Duke of Tuscany and the King of the Two Sicilies, pressed by liberal opinion, sent troops and volunteers. Radetzky fell back to the Quadrilateral, the fortresses of Peschiera, Verona, Mantua and Legnago, and waited for reinforcements down the Adige valley. The Piedmontese forced the Mincio at Goito on 8 April and drove the Austrians from Pastrengo on 30 April, but moved slowly. On 29 April Pope Pius IX declared that he could not make war on Catholic Austria.: Le 23 mars, le roi Charles Albert de Sardaigne déclara la guerre à l’Autriche, en partie pour prévenir une révolution républicaine, et son armée passa le Tessin en Lombardie. Le Pape, le Grand-Duc de Toscane et le Roi des Deux Sicilies, pressé par l’opinion libérale, envoyaient des troupes et des volontaires. Radetzky est retombé sur le Quadrilatéral, les forteresses de Peschiera, Vérone, Mantua et Legnago, et a attendu des renforts dans la vallée Adige. Les Piémontais ont forcé le Mincio à Goito le 8 avril et conduit les Autrichiens de Pastrengo le 30 avril, mais se sont déplacés lentement.
