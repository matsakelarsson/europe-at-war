Custoza: Custoza
May – August 1848: mai – août 1848
In April and May an Austrian relief army under Laval Nugent marched from the Isonzo through Friuli and Venetia, retaking the towns that had risen, and joined Radetzky at Verona. Radetzky then swung south around the Piedmontese flank. On 29 May Tuscan and Neapolitan volunteers, many of them students, held him for a day at Curtatone and Montanara. On 30 May the Piedmontese beat him at Goito, and the same day the fortress of Peschiera surrendered to them; Lombardy, the duchies and later Venice voted to join Sardinia. But the King of the Two Sicilies, after crushing a rising in Naples on 15 May, recalled his army, and on 10 June Radetzky took Vicenza from Papal troops.: En avril et mai, une armée de secours autrichienne sous Laval Nugent marcha de l’Isonzo en passant par Friuli et Venetia, reprenant les villes qui s’étaient levées, et rejoignit Radetzky à Vérone. Radetzky tourna ensuite vers le sud autour du flanc piémontais. Le 29 mai, des volontaires toscans et napolitains, dont beaucoup d’étudiants, le retenaient un jour à Curtatone et Montanara. Le 30 mai, les Piémontais le battaient à Goito, et le même jour la forteresse de Peschiera se rendit à eux ; la Lombardie, les duchés et plus tard Venise votèrent pour rejoindre la Sardaigne. Mais le roi des Deux Sicilies, après avoir écrasé une montée à Naples le 15 mai, rappela son armée, et le 10 juin Radetzky prit Vicenza des troupes papales.
In July Radetzky, now reinforced, attacked the Piedmontese line, which stretched for about 70 km along the Mincio. Around the hills of Custoza, south-west of Verona, he defeated Charles Albert’s main army on 24–25 July, and it fell back in disorder to Milan. Charles Albert agreed to give up the city on 4 August; crowds who felt betrayed fired on his residence, and he left under escort in the night. The armistice signed by General Carlo Canera di Salasco on 9 August returned Lombardy to Austria. Giuseppe Garibaldi, back from exile in South America, fought on with about a thousand volunteers near Lake Maggiore, winning a skirmish at Luino on 15 August, before escaping to Switzerland.: En juillet Radetzky, maintenant renforcé, attaqua la ligne piémontaise, qui s’étendait sur environ 70 km le long du Mincio. Autour des collines de Custoza, au sud-ouest de Vérone, il battit l’armée principale de Charles Albert du 24 au 25 juillet, et elle retomba dans le désordre à Milan. Charles Albert accepta d’abandonner la ville le 4 août ; les foules qui se sentaient trahies tirèrent sur sa résidence, et il partit sous escorte dans la nuit. L’armistice signé par le général Carlo Canera di Salasco le 9 août retourna en Autriche en Lombardie. Giuseppe Garibaldi, de retour d’exil en Amérique du Sud, s’est battu avec un millier de volontaires près du lac Majeur, remportant une escarmouche à Luino le 15 août, avant de s’enfuir en Suisse.
