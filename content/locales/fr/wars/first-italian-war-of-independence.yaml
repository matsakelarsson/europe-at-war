Venice and Sicily: Venise et Sicile
September 1848 – August 1849: septembre 1848 – août 1849
After the Salasco armistice Venice restored its republic under Manin and held out alone. Austrian troops under Haynau laid siege to the fort of Marghera on the mainland on 28 April 1849, and after more than three weeks of bombardment its 2,000 defenders withdrew to the city on 26 May. The Austrians then shelled Venice itself across the lagoon from late July; earlier they had launched balloons carrying bombs, an early attempt at bombing from the air, but the wind blew them away. Short of food and struck by cholera, which killed nearly 2,800 people, the city surrendered on 22 August. Manin and other leaders went into exile.: Après l’armistice de Salasco Venise a restauré sa république sous Manin et tenu seul. Les troupes autrichiennes sous Haynau ont assiégé le fort de Marghera sur le continent le 28 avril 1849, et après plus de trois semaines de bombardement ses 2 000 défenseurs se sont retirés dans la ville le 26 mai. Les Autrichiens ont ensuite bombardé Venise elle-même à travers la lagune à partir de fin juillet ; plus tôt, ils avaient lancé des ballons transportant des bombes, une tentative précoce de bombardement des airs, mais le vent les a fait sauter.
Sicily had risen against Bourbon rule in January 1848 and declared King Ferdinand II deposed. In September his troops bombarded and stormed Messina, earning him the nickname “King Bomba”, and after a truce arranged by Britain and France broke down, General Carlo Filangieri took Catania on 7 April 1849 and entered Palermo on 15 May. Across Italy the old rulers returned, with Austrian garrisons in the Legations, Tuscany and the duchies and a French garrison in Rome. Piedmont alone kept a constitution, and thousands of exiles from the other states found refuge there.: La Sicile s’était levée contre la domination Bourbon en janvier 1848 et avait déclaré le roi Ferdinand II dépossé. En septembre, ses troupes bombardaient et assautaient Messine, lui donnant le surnom de « King Bomba » et après l’effondrement d’une trêve organisée par la Grande-Bretagne et la France, le général Carlo Filangieri prit Catane le 7 avril 1849 et entra à Palerme le 15 mai. De l’autre côté de l’Italie, les anciens dirigeants sont revenus, avec des garnisons autrichiennes dans les Légations, en Toscane et dans les duchies, et une garnison française à Rome. Le Piémont a gardé seul une constitution, et des milliers d’exilés des autres états y ont trouvé refuge.
