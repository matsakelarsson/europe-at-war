Novara: Novare
March – August 1849: mars – août 1849
Under pressure from democrats at home, Charles Albert ended the armistice in March 1849 and sent his army, now under the Polish general Wojciech Chrzanowski, against Lombardy. Radetzky struck first. On 20 March he crossed the Ticino at Pavia, where a Piedmontese division under General Gerolamo Ramorino had failed to guard the crossings; Ramorino was later shot for disobedience. The Austrians beat the Piedmontese at Mortara on 21 March and at Novara on 23 March. That evening Charles Albert abdicated in favour of his son, Victor Emmanuel II, and left for exile in Portugal, where he died in July.: Sous la pression des démocrates à la maison, Charles Albert termina l’armistice en mars 1849 et envoya son armée, maintenant sous le général polonais Wojciech Chrzanowski, contre la Lombardie. Radetzky battit d’abord. Le 20 mars, il a traversé le Tessin à Pavie, où une division piémontaise sous la direction du général Gerolamo Ramorino n’avait pas gardé les passages à niveau ; Ramorino a ensuite été abattu pour désobéissance. Ce soir-là, Charles Albert abdiqua en faveur de son fils Victor Emmanuel II et partit pour l’exil au Portugal où il mourut en juillet.
Victor Emmanuel agreed an armistice with Radetzky at Vignale the next day, accepting an Austrian occupation of part of Piedmont until peace was made. In Lombardy the people of Brescia had risen on 23 March, not knowing of Novara, and held out for ten days until General Julius Haynau’s troops stormed the city; about 1,000 defenders and civilians were killed. In Genoa a republican revolt in April was crushed by Piedmontese troops under Alfonso La Marmora, who bombarded the city. By the Peace of Milan of 6 August 1849 Sardinia paid Austria an indemnity of 65 million francs but kept its territory and its constitution.: Victor Emmanuel accepta un armistice avec Radetzky à Vignale le lendemain, acceptant une occupation autrichienne d’une partie du Piémont jusqu’à ce que la paix fût faite. En Lombardie, le peuple de Brescia s’était levé le 23 mars, ne connaissant pas Novara, et se tenait dehors pendant dix jours jusqu’à ce que les troupes du général Julius Haynau ont pris l’assaut de la ville ; environ 1000 défenseurs et civils avaient été tués. À Gênes, une révolte républicaine en avril a été écrasée par les troupes piémontaises sous Alfonso La Marmora, qui bombardait la ville. Par la paix de Milan du 6 août 1849 Sardaigne a payé à l’Autriche une indemnité de 65 millions de francs mais a gardé son territoire et sa constitution.
