The Roman Republic: République romaine
November 1848 – August 1849: novembre 1848 – août 1849
In Rome the Pope’s chief minister, Pellegrino Rossi, was stabbed to death on 15 November 1848, and Pius IX fled in disguise to the Neapolitan fortress of Gaeta. An elected assembly proclaimed the Roman Republic on 9 February 1849, and Giuseppe Mazzini led it in a triumvirate with Carlo Armellini and Aurelio Saffi. In Tuscany the Grand Duke Leopold II also fled, and a democratic government held Florence until April. The Pope appealed to the Catholic powers. France, whose president, Louis Napoleon Bonaparte, wanted Catholic support at home and to keep Austria out of central Italy, sent an army under General Charles Oudinot, which landed at Civitavecchia on 24 April.: A Rome, le ministre en chef du pape Pellegrino Rossi fut poignardé à mort le 15 novembre 1848, et Pie IX s’enfuit déguisé dans la forteresse napolitaine de Gaeta. Une assemblée élue proclama la République romaine le 9 février 1849, et Giuseppe Mazzini la conduisit dans un triumvirat avec Carlo Armellini et Aurelio Saffi. En Toscane, le Grand-Duc Léopold II s’enfuit également et un gouvernement démocratique occupa Florence jusqu’au mois d’avril. Le Pape en appel aux puissances catholiques. La France, dont le président, Louis Napoléon Bonaparte, voulait l’appui catholique chez lui et pour garder l’Autriche hors de l’Italie centrale, envoya une armée sous les ordres du général Charles Oudinot, qui débarqua à Civitavecchia le 24 avril.
On 30 April Oudinot’s attack on Rome was beaten back by Giuseppe Garibaldi’s legion and other defenders, and in May Garibaldi drove off a Neapolitan army at Palestrina and Velletri, while Austrian troops took Bologna and Ancona. French reinforcements opened a siege on 3 June. After a month of shelling and fighting on the Janiculum hill, the assembly gave up the defence, and the French entered Rome on 3 July. Garibaldi left with about 4,000 men, hoping to reach Venice. Pursued by French and Austrian troops, he disbanded them in San Marino at the end of July, and his wife Anita died during his flight through the marshes near Ravenna.: Le 30 avril, l’attaque d’Oudinot contre Rome a été repoussée par Giuseppe Garibaldi et d’autres défenseurs, et en mai, Garibaldi a quitté une armée napolitaine à Palestrina et Velletri, tandis que les troupes autrichiennes ont pris Bologne et Ancône. Après un mois de bombardements et de combats sur la colline du Janiculum, l’assemblée abandonna la défense et les Français entrèrent à Rome le 3 juillet. Garibaldi partit avec environ 4 000 hommes dans l’espoir d’arriver à Venise. Purgé par les troupes françaises et autrichiennes, il les disloqua à Saint-Marin fin juillet, et sa femme Anita mourut lors de son vol à travers les marais près de Ravenne.
