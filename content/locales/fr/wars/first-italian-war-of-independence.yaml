First Italian War of Independence: Première guerre d’indépendance italienne
The first war of the Risorgimento, fought in 1848–1849 by the Kingdom of Sardinia, Italian volunteers and the revolutionary governments of Milan, Venice, Rome and Sicily against Austria and the rulers it backed. Austria’s Field Marshal Radetzky defeated Sardinia at Custoza in 1848 and at Novara in 1849, France destroyed the Roman Republic, the Bourbons retook Sicily and Venice surrendered in August 1849. The old order returned everywhere, but Sardinia kept its constitution and became the hope of Italian liberals.: La première guerre du Risorgimento, combattue en 1848–1849 par le Royaume de Sardaigne, les volontaires italiens et les gouvernements révolutionnaires de Milan, Venise, Rome et Sicile contre l’Autriche et les dirigeants qu’il soutenait. Autriche Le maréchal de campagne Radetzky a vaincu la Sardaigne à Custoza en 1848 et à Novara en 1849, la France a détruit la République romaine, les Bourbons ont repris la Sicile et Venise s’est rendu en août 1849. L’ancien ordre revient partout, mais la Sardaigne conserve sa constitution et devient l’espoir des libéraux italiens.
Italian historians call Charles Albert’s two campaigns against Austria the “royal war” and the risings in Milan, Venice, Rome, Tuscany and Sicily the “popular war”. The Papal States, Tuscany and the Two Sicilies sent troops to fight Austria in spring 1848 but soon withdrew them; many of their volunteers fought on.: Les historiens italiens qualifient Charles Albert de deux campagnes contre l’Autriche la guerre royale et les montées à Milan, Venise, Rome, Toscane et Sicile la guerre populaire. Les États pontificaux, la Toscane et les Deux Sicilies ont envoyé des troupes pour combattre l’Autriche au printemps 1848 mais ils les ont bientôt retirés ; beaucoup de leurs volontaires se sont battus.
The revolutions in Vienna and the German states are told in German revolutions of 1848–1849, and the revolution in Paris in French Revolution of 1848.: Les révolutions de Vienne et des États allemands sont racontées dans les révolutions allemandes de 1848–1849, et la révolution de Paris dans la Révolution française de 1848.
