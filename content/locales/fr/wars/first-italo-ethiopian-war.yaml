# French translations of the catalogue text (wave 12); step bodies follow later.
First Italo-Ethiopian War: Première guerre italo-éthiopienne
? Italy’s attempt to impose a protectorate on Ethiopia, which ended in its defeat at Adwa. From Massawa, occupied in 1885, Italy had built the colony of Eritrea, and it read the Treaty of Wuchale, signed with Menelik II in 1889, as making Ethiopia its protectorate, a reading Menelik rejected. In December 1894 a revolt against Italian rule in Eritrea led to war with Ras Mengesha of Tigray; the Italians under General Oreste Baratieri defeated him at Coatit and Senafe in January 1895 and occupied Tigray. Menelik called out the whole empire, and an army of more than 100,000 destroyed an Italian force at Amba Alagi on 7 December 1895, forced the surrender of the fort at Mekele in January 1896 and, on 1 March 1896, routed Baratieri’s army of about 17,700 at Adwa, killing or capturing more than half of it. By the Treaty of Addis Ababa of 26 October 1896 Italy annulled the Treaty of Wuchale and recognised Ethiopia’s full independence, keeping Eritrea. Adwa made Ethiopia the one African state to defeat a European colonial army decisively and keep its independence through the Scramble for Africa, and it became a symbol across Africa and its diaspora.
: La tentative de l’Italie d’imposer un protectorat à l’Éthiopie, qui s’acheva par sa défaite à Adoua. À partir de Massaoua, occupée en 1885, l’Italie avait constitué la colonie d’Érythrée, et elle interprétait le traité de Wuchale, signé avec Ménélik II en 1889, comme faisant de l’Éthiopie son protectorat, lecture que Ménélik rejetait. En décembre 1894, une révolte contre la domination italienne en Érythrée entraîna une guerre avec le ras Mengesha du Tigré ; les Italiens du général Oreste Baratieri le battirent à Coatit et à Senafe en janvier 1895 et occupèrent le Tigré. Ménélik appela aux armes tout l’empire, et une armée de plus de 100 000 hommes détruisit une force italienne à l’Amba Alagi le 7 décembre 1895, obtint la reddition du fort de Mekele en janvier 1896 et, le 1er mars 1896, mit en déroute à Adoua l’armée de Baratieri, forte d’environ 17 700 hommes, dont elle tua ou captura plus de la moitié. Par le traité d’Addis-Abeba du 26 octobre 1896, l’Italie annula le traité de Wuchale et reconnut la pleine indépendance de l’Éthiopie, tout en conservant l’Érythrée. Adoua fit de l’Éthiopie le seul État africain à avoir infligé une défaite décisive à une armée coloniale européenne et conservé son indépendance pendant le partage de l’Afrique, et la bataille devint un symbole dans toute l’Afrique et sa diaspora.
