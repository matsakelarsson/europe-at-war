# French translations of the catalogue text (wave 13); step bodies follow later.
First Ivorian Civil War: Première guerre civile ivoirienne
? The war that split Côte d’Ivoire into a rebel-held north and a government-held south. After the death of the country’s founding president, Félix Houphouët-Boigny, in 1993, the idea of “Ivoirité”, Ivorian identity, was used to exclude northerners and the opposition leader Alassane Ouattara from politics, and a coup in 1999 and a disputed election in 2000 brought Laurent Gbagbo to power. On 19 September 2002 soldiers attacked Abidjan, Bouaké and Korhogo; the attack on Abidjan failed, but the rebels, later the Forces Nouvelles under Guillaume Soro, took the north, and two further rebel groups took the far west with Liberian fighters. French troops of Operation Licorne and later a United Nations force held a buffer zone between the two halves. Power-sharing agreements at Linas-Marcoussis in 2003 and Pretoria in 2005 broke down; in November 2004 an Ivorian air raid killed nine French soldiers at Bouaké, and France destroyed the Ivorian air force. The Ouagadougou agreement of 4 March 2007 made Soro prime minister and ended the war. Estimates of the dead range from about 900 to 4,000, and some 750,000 people were displaced.
: La guerre qui coupa la Côte d’Ivoire en un nord tenu par les rebelles et un sud tenu par le gouvernement. Après la mort du président fondateur du pays, Félix Houphouët-Boigny, en 1993, l’idée d’« ivoirité », l’identité ivoirienne, servit à exclure de la vie politique les habitants du Nord et le chef de l’opposition Alassane Ouattara, et un coup d’État en 1999 puis une élection contestée en 2000 portèrent Laurent Gbagbo au pouvoir. Le 19 septembre 2002, des soldats attaquèrent Abidjan, Bouaké et Korhogo ; l’attaque contre Abidjan échoua, mais les rebelles, futures Forces nouvelles de Guillaume Soro, prirent le nord, et deux autres groupes rebelles s’emparèrent de l’extrême ouest avec des combattants libériens. Les troupes françaises de l’opération Licorne, puis une force des Nations unies, tinrent une zone tampon entre les deux moitiés du pays. Les accords de partage du pouvoir de Linas-Marcoussis en 2003 et de Pretoria en 2005 échouèrent ; en novembre 2004, un raid aérien ivoirien tua neuf soldats français à Bouaké, et la France détruisit l’aviation ivoirienne. L’accord de Ouagadougou du 4 mars 2007 fit de Soro le Premier ministre et mit fin à la guerre. Les estimations du nombre de morts vont d’environ 900 à 4 000, et quelque 750 000 personnes furent déplacées.
