# French translations of the catalogue text (wave 13); step bodies follow later.
First Liberian Civil War: Première guerre civile libérienne
? The war that began when Charles Taylor’s National Patriotic Front of Liberia (NPFL) crossed from Côte d’Ivoire into Nimba County on 24 December 1989 to overthrow President Samuel Doe. Thousands of Gio and Mano, whom Doe’s mostly Krahn army had persecuted, joined the rebels, and by mid-1990 they had overrun most of the country and besieged Monrovia, where government soldiers massacred some 600 refugees in a Lutheran church. A breakaway faction under Prince Johnson captured and killed Doe on 9 September 1990, soon after the West African intervention force ECOMOG landed at Monrovia. Taylor ruled most of the country from Gbarnga as “Greater Liberia”, while an interim government sat in Monrovia under ECOMOG’s protection. New factions, ULIMO and the Liberia Peace Council, fought the NPFL; Taylor’s assault on Monrovia, Operation Octopus, was beaten back in 1992; and more than a dozen peace agreements failed before the Abuja accords of 1995 and 1996. After fighting devastated Monrovia again in April 1996, the factions disarmed, and Taylor won the election of July 1997 by a landslide. The war killed tens of thousands of people, by many estimates up to about 200,000, drove about a million from their homes and used thousands of child soldiers.
: La guerre qui commença lorsque le Front national patriotique du Liberia (NPFL) de Charles Taylor passa de Côte d’Ivoire dans le comté de Nimba le 24 décembre 1989 pour renverser le président Samuel Doe. Des milliers de Gio et de Mano, que l’armée de Doe, majoritairement krahn, avait persécutés, rejoignirent les rebelles, qui, au milieu de 1990, avaient envahi la plus grande partie du pays et assiégeaient Monrovia, où des soldats gouvernementaux massacrèrent quelque 600 réfugiés dans une église luthérienne. Une faction dissidente menée par Prince Johnson captura et tua Doe le 9 septembre 1990, peu après le débarquement à Monrovia de la force d’intervention ouest-africaine, l’ECOMOG. Taylor gouvernait la plus grande partie du pays depuis Gbarnga sous le nom de « Grand Liberia », tandis qu’un gouvernement intérimaire siégeait à Monrovia sous la protection de l’ECOMOG. De nouvelles factions, l’ULIMO et le Conseil de la paix du Liberia, combattirent le NPFL ; l’assaut de Taylor contre Monrovia, l’opération Octopus, fut repoussé en 1992 ; et plus d’une dizaine d’accords de paix échouèrent avant les accords d’Abuja de 1995 et 1996. Après que les combats eurent de nouveau dévasté Monrovia en avril 1996, les factions désarmèrent, et Taylor remporta l’élection de juillet 1997 avec une écrasante majorité. La guerre fit des dizaines de milliers de morts, jusqu’à environ 200 000 selon de nombreuses estimations, chassa environ un million de personnes de chez elles et vit l’enrôlement de milliers d’enfants soldats.
