# French translations of the catalogue text (wave 14); step bodies follow later.
First Maroon War: Première guerre des Marrons
? "The war between the British colony of Jamaica and the Maroons, free communities of Africans and their descendants who had escaped slavery and lived in the island’s mountains. The Windward Maroons of the Blue Mountains, led by Nanny and Quao, and the Leeward Maroons of the Cockpit Country in the west, led by Cudjoe (Kojo), raided plantations, freed enslaved people and ambushed the troops sent against them. From 1728 Governor Robert Hunter, reinforced by regular regiments, sent expeditions into the mountains; the militia took Nanny Town more than once, the last time in 1734, but each time the Maroons slipped away and fought on, while the cost of the war, martial law and the flight of planters weakened the colony. In 1739 Governor Edward Trelawny made peace: Cudjoe signed a treaty with John Guthrie on 1 March 1739 (Old Style), and Quao one with Robert Bennett later that year or in 1740. The treaties recognised the Maroons’ freedom and their lands, about 1,500 acres for Cudjoe’s people, with self-government under their own leaders and a British superintendent, in return for returning runaways, helping to put down revolts and defending the island against invaders. Nanny received a grant of 500 acres in 1740, where Moore Town now stands. She is today Jamaica’s only female National Hero."
: "La guerre entre la colonie britannique de la Jamaïque et les Marrons, communautés libres d’Africains et de leurs descendants qui avaient échappé à l’esclavage et vivaient dans les montagnes de l’île. Les Marrons du Vent, dans les Montagnes Bleues, menés par Nanny et Quao, et les Marrons sous le Vent, dans le Cockpit Country à l’ouest, menés par Cudjoe (Kojo), attaquaient les plantations, libéraient des esclaves et tendaient des embuscades aux troupes envoyées contre eux. À partir de 1728, le gouverneur Robert Hunter, renforcé par des régiments réguliers, envoya des expéditions dans les montagnes ; la milice prit Nanny Town à plusieurs reprises, la dernière fois en 1734, mais chaque fois les Marrons s’échappèrent et poursuivirent le combat, tandis que le coût de la guerre, la loi martiale et la fuite des planteurs affaiblissaient la colonie. En 1739, le gouverneur Edward Trelawny fit la paix : Cudjoe signa un traité avec John Guthrie le 1er mars 1739 (ancien style), et Quao un autre avec Robert Bennett plus tard la même année ou en 1740. Les traités reconnaissaient la liberté des Marrons et leurs terres, environ 1 500 acres pour le peuple de Cudjoe, avec une autonomie sous leurs propres chefs et un surintendant britannique, en échange de la restitution des fugitifs, de leur aide pour réprimer les révoltes et de la défense de l’île contre les envahisseurs. Nanny reçut en 1740 une concession de 500 acres, à l’emplacement de l’actuelle Moore Town. Elle est aujourd’hui la seule femme au rang des héros nationaux de la Jamaïque."
