# French translations of the catalogue text (wave 13); step bodies follow later.
First Matabele War: Première guerre matabélé
? The British South Africa Company’s conquest of the Ndebele kingdom (Mthwakazi) of King Lobengula, in what is now western Zimbabwe. Cecil Rhodes’s company had obtained a mining concession from Lobengula in 1888, received a royal charter in 1889 and occupied Mashonaland, east of the kingdom, in 1890, among Shona chiefdoms the Ndebele regarded as their tributaries. After an Ndebele raid near Fort Victoria in July 1893, the company’s administrator, Leander Starr Jameson, recruited volunteers with promises of land, gold claims and captured cattle and invaded the kingdom in October with two columns and about five Maxim guns, while a third column of Bechuanaland police and Khama III’s Bangwato came from the south-west. The Ndebele regiments attacked the columns’ wagon laagers at Shangani (Bonko) on 25 October and Bembesi (Egodade) on 1 November and were cut down by machine-gun and rifle fire. Lobengula abandoned and burned his capital, Bulawayo, and fled north; on 4 December his rearguard wiped out Major Allan Wilson’s patrol of 34 men at Pupu on the Shangani River. The king died in January 1894, the izinDuna (chiefs) made peace, and the company took Matabeleland, its land and most of its cattle, grievances that led to the rising of 1896.
: La conquête par la British South Africa Company du royaume ndébélé (Mthwakazi) du roi Lobengula, dans l’actuel ouest du Zimbabwe. La compagnie de Cecil Rhodes avait obtenu de Lobengula une concession minière en 1888, reçu une charte royale en 1889 et occupé en 1890 le Mashonaland, à l’est du royaume, parmi des chefferies shona que les Ndébélés considéraient comme leurs tributaires. Après un raid ndébélé près de Fort Victoria en juillet 1893, l’administrateur de la compagnie, Leander Starr Jameson, recruta des volontaires en leur promettant des terres, des concessions aurifères et du bétail pris à l’ennemi, et envahit le royaume en octobre avec deux colonnes et environ cinq mitrailleuses Maxim, tandis qu’une troisième colonne, formée de la police du Bechuanaland et des Bangwato de Khama III, arrivait du sud-ouest. Les régiments ndébélés attaquèrent les laagers de chariots des colonnes à Shangani (Bonko) le 25 octobre et à Bembesi (Egodade) le 1er novembre, et furent fauchés par le feu des mitrailleuses et des fusils. Lobengula abandonna et incendia sa capitale, Bulawayo, et s’enfuit vers le nord ; le 4 décembre, son arrière-garde anéantit la patrouille de 34 hommes du major Allan Wilson à Pupu, sur la rivière Shangani. Le roi mourut en janvier 1894, les izinDuna (chefs) firent la paix, et la compagnie s’empara du Matabeleland, de ses terres et de la plus grande partie de son bétail, autant de griefs qui conduisirent au soulèvement de 1896.
