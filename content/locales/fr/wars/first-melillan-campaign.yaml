"A war between Spain and the Rifian tribes around Melilla, also called the Margallo War. It began in October 1893 when tribesmen attacked the garrison over new forts that Spain was building outside the city, near a shrine and cemetery, and on 28 October the governor of Melilla, General Juan García y Margallo, was killed in the fighting. Spain sent some 25,000 troops under General Arsenio Martínez Campos, the tribes were brought to terms with the help of the Sultan, Hassan I, and in 1894 a treaty with Morocco confirmed Melilla’s boundaries and obliged the Sultan to pay Spain an indemnity.": "Une guerre entre l’Espagne et les tribus rifiennes autour de Melilla, également appelée la guerre de Margallo. Elle a commencé en octobre 1893 lorsque des hommes de tribu ont attaqué la garnison sur de nouveaux forts que l’Espagne construisait à l’extérieur de la ville, près d’un sanctuaire et d’un cimetière, et le 28 octobre le gouverneur de Melilla, le général Juan García y Margallo, a été tué dans les combats. L’Espagne envoyait quelque 25 000 soldats sous le commandement du général Arsenio Martínez Campos, les tribus furent mises en accord avec l’aide du Sultan Hassan Ier et, en 1894, un traité avec le Maroc confirma les frontières de Melillas et obligea le Sultan à verser une indemnité à l’Espagne."
"The war was formally declared on 9 November 1893, after the first attacks of 3 October. The settlement is called the Treaty of Fez in some sources and the Treaty of Marrakesh in others.": "La guerre a été officiellement déclarée le 9 novembre 1893, après les premières attaques du 3 octobre. Le règlement est appelé le Traité de Fez dans certaines sources et le Traité de Marrakech dans d’autres."
