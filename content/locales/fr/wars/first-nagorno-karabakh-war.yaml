"Khojaly, Shusha and Lachin": "Khojaly, Shusha et Lachin"
"Through the winter of 1991–92 Azerbaijani forces bombarded Stepanakert with Grad rockets from Shusha, the old Azerbaijani-majority town on the heights above it, while Armenian fighters took Azerbaijani villages around the city. On 25–26 February 1992 Armenian forces, helped by some troops of the former Soviet 366th Regiment, took Khojaly, the site of the region’s airport. Civilians fleeing through the snow towards Agdam were shot down near Nakhichevanik. Azerbaijan gives the dead as 613; Human Rights Watch called it the largest massacre of the conflict and held Karabakh Armenian forces directly responsible. In April Azerbaijani forces killed dozens of Armenian villagers at Maraga.": "Pendant l’hiver 1991-1992, les forces azerbaïdjanaises ont bombardé Stepanakert avec des roquettes Grad de Shusha, la vieille ville à majorité azerbaïdjanaise sur les hauteurs au-dessus, tandis que les combattants arméniens ont pris des villages azerbaïdjanais autour de la ville. Les civils fuyant à travers la neige vers Agdam ont été abattus près de Nakhichevanik. L’Azerbaïdjan donne les morts comme 613 ; Human Rights Watch a qualifié le plus grand massacre du conflit et tenu les forces arméniennes du Karabakh directement responsables."
"On 8–9 May Armenian forces stormed Shusha, ending the bombardment, and on 18 May they took Lachin, opening a road to Armenia; the Azerbaijani inhabitants of both towns fled. The defeats cost President Ayaz Mutalibov his post, and in June the Popular Front leader Abulfaz Elchibey was elected president of Azerbaijan. That month Azerbaijan struck back with tanks inherited from the Soviet army, overrunning the Shahumyan district north of Karabakh and much of Mardakert, which fell on 4 July, and their Armenian inhabitants fled.": "Les 8 et 9 mai, les forces arméniennes ont pris la fuite de Shusha, mettant fin au bombardement, et le 18 mai, elles ont pris Lachin, ouvrant une route à l’Arménie ; les habitants azerbaïdjanais des deux villes se sont enfuis. Ce mois-là, l’Azerbaïdjan a repris avec des chars hérités de l’armée soviétique, envahissant le district de Shahumyan au nord du Karabakh et une grande partie de Mardakert, qui est tombé le 4 juillet, et leurs habitants arméniens ont fui."
