"Nagorno-Karabakh, a mountainous autonomous region of Soviet Azerbaijan where about three-quarters of the people were Armenians, had long sought to join Soviet Armenia. Encouraged by Mikhail Gorbachev’s reforms, its regional soviet voted on 20 February 1988 to ask for the transfer, and vast crowds demonstrated in Yerevan for miatsum, “unification”. Moscow refused. Two young Azerbaijanis were killed in a clash near Askeran on 22 February, and from 27 to 29 February mobs in the industrial city of Sumgait, north of Baku, attacked Armenians; officially 32 people died, most of them Armenians, while Armenian sources put the toll much higher.": "Le Haut-Karabakh, une région montagneuse autonome de l’Azerbaïdjan soviétique où les trois quarts du peuple étaient arméniens, a longtemps cherché à rejoindre l’Arménie soviétique. Encouragé par les réformes de Mikhail Gorbatchev, son soviet régional a voté le 20 février 1988 pour demander le transfert, et d’immenses foules ont manifesté à Erevan pour miatsum, l’unification. Moscou a refusé. Le 22 février, deux jeunes Azerbaïdjanais ont été tués dans un affrontement près d’Askeran et, du 27 au 29 février, des foules dans la ville industrielle de Sumgait, au nord de Bakou, ont attaqué des Arméniens ; officiellement 32 personnes sont mortes, la plupart des Arméniens, tandis que les sources arméniennes ont fait beaucoup plus de victimes."
"Over the next two years almost all Azerbaijanis left Armenia, and most Armenians left Azerbaijan outside Karabakh, often under threat of violence. In January 1990 a pogrom in Baku killed dozens of Armenians; on the night of 19–20 January Soviet troops stormed the city, officially to restore order and protect the Soviet authorities from the Popular Front, and killed about 130–150 civilians. In spring 1991, in Operation Ring, Soviet troops and Azerbaijani special police deported thousands of Armenians from villages around Karabakh. On 2 September 1991 the Karabakh Armenians proclaimed the Nagorno-Karabakh Republic; Azerbaijan abolished the region’s autonomy, and as Soviet troops withdrew the conflict became a war.": "Au cours des deux prochaines années, presque tous les Azerbaïdjanais ont quitté l’Arménie, et la plupart des Arméniens ont quitté l’Azerbaïdjan en dehors du Karabakh, souvent sous la menace de violences.En janvier 1990, un pogrom à Bakou a tué des dizaines d’Arméniens ; dans la nuit du 19 au 20 janvier, les troupes soviétiques ont pris l’assaut de la ville, officiellement pour rétablir l’ordre et protéger les autorités soviétiques du Front populaire, et ont tué environ 130 à 150 civils. Au printemps 1991, dans le cadre de l’opération Ring, les troupes soviétiques et la police spéciale azerbaïdjanaise ont expulsé des milliers d’Arméniens de villages autour du Karabakh. Le 2 septembre 1991, les Arméniens du Karabakh ont proclamé la République du Haut-Karabakh ; l’Azerbaïdjan a aboli l’autonomie de la région et les troupes soviétiques se sont retirées du conflit."
