"In spring 1993 Armenian forces broke out of Karabakh to the west. Kalbajar fell on 3 April, and about 60,000 Azerbaijani and Kurdish inhabitants fled over the mountains; the UN Security Council demanded a withdrawal in Resolution 822. Azerbaijan’s army was weakened by turmoil at home. In June a rebel colonel, Surat Huseynov, marched on Baku from Ganja, President Elchibey fled, and Heydar Aliyev, the former Soviet Azerbaijani leader, took power. Armenian forces took Agdam in July, then Fuzuli, Jabrayil and Qubadli in August and Zangilan in October, reaching the Iranian border, and three more UN resolutions followed.": "Au printemps 1993, les forces arméniennes ont quitté le Karabakh à l’ouest. Kalbajar est tombé le 3 avril, et environ 60 000 habitants azerbaïdjanais et kurdes ont fui les montagnes ; le Conseil de sécurité des Nations unies a exigé un retrait dans la résolution 822. En juin, un colonel rebelle, Sourat Huseynov, a marché sur Bakou de Ganja, le président Elchibey s’est enfui, et Heydar Aliyev, l’ancien dirigeant soviétique azerbaïdjanais, a pris le pouvoir. Les forces arméniennes ont pris Agdam en juillet, puis Fuzuli, Jabrayil et Qubadli en août et Zangilan en octobre, jusqu’à la frontière iranienne, et trois autres résolutions des Nations unies ont suivi."
"Azerbaijan’s winter offensive, from December 1993, retook Horadiz on the Araxes, but failed with heavy losses in the snow at the Omar Pass above Kalbajar. Russian mediation produced the Bishkek Protocol in May 1994, and a ceasefire took effect on 12 May. Armenian forces held almost all of Nagorno-Karabakh and all or part of seven Azerbaijani districts around it. Estimates of the dead range from about 20,000 to more than 30,000. Some 724,000 Azerbaijanis had been driven from Armenia, Karabakh and the occupied districts, and 300,000–500,000 Armenians from Azerbaijan.": "L’offensive hivernale de l’Azerbaïdjan, à partir de décembre 1993, a repris Horadiz sur les Araxes, mais a échoué avec de lourdes pertes dans la neige au col Omar au-dessus de Kalbajar. La médiation russe a produit le Protocole Bichkek en mai 1994 et un cessez-le-feu a pris effet le 12 mai. Les forces arméniennes ont détenu presque tout le Haut-Karabakh et tout ou partie des sept districts azerbaïdjanais autour de lui. Quelque 724 000 Azerbaïdjanais ont été chassés de l’Arménie, du Karabakh et des districts occupés et 300 000 à 500 000 Arméniens de l’Azerbaïdjan."
