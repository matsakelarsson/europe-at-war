"First Nagorno-Karabakh War": "Première guerre du Haut-Karabakh"
"A war between Azerbaijan and the Armenians of Nagorno-Karabakh, backed by Armenia, over the Armenian-majority region inside Soviet Azerbaijan. It began as a campaign for union with Armenia in 1988, accompanied by pogroms and mutual expulsions, and became a full war as the Soviet Union collapsed. When a ceasefire took effect in May 1994, Armenian forces held Nagorno-Karabakh and seven surrounding Azerbaijani districts, and about a million people on both sides had been driven from their homes.": "Une guerre entre l’Azerbaïdjan et les Arméniens du Haut-Karabakh, soutenue par l’Arménie, sur la région à majorité arménienne à l’intérieur de l’Azerbaïdjan soviétique. Elle a commencé comme une campagne pour l’union avec l’Arménie en 1988, accompagnée de pogroms et d’expulsions mutuelles, et est devenue une guerre complète à mesure que l’Union Soviétique s’effondre. Lorsqu ' un cessez-le-feu est entré en vigueur en mai 1994, les forces arméniennes ont tenu le Haut-Karabakh et sept districts azerbaïdjanais environnants, et environ un million de personnes des deux côtés ont été chassées de leurs foyers."
"Nagorno-Karabakh and the surrounding districts are shown as part of Azerbaijan on the map, as they are internationally recognised. The self-proclaimed Nagorno-Karabakh Republic (later the Republic of Artsakh) was recognised by no member of the United Nations.": "Le Haut-Karabakh et les districts environnants sont représentés sur la carte, car ils sont internationalement reconnus. La République du Haut-Karabakh (plus tard la République d’Artsakh) autoproclamée n’a été reconnue par aucun membre des Nations Unies."
"Many places have both Armenian and Azerbaijani names, such as Stepanakert (Khankendi), Shusha (Shushi), Mardakert (Aghdara) and Lachin (Berdzor). The more common English forms are used here.": "De nombreux endroits ont des noms arméniens et azerbaïdjanais, tels que Stepanakert (Khankendi), Shusha (Shushi), Mardakert (Aghdara) et Lachin (Berdzor)."
"Numbers of dead and displaced are estimates and are disputed; both sides’ official figures differ from independent ones.": "Le nombre de morts et de personnes déplacées est estimé et contesté ; les chiffres officiels des deux parties diffèrent des chiffres indépendants."
