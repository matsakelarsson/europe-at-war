# French translations of the catalogue text (wave 9); step bodies follow later.
First Opium War: Première guerre de l’opium
A war between Britain and Qing China over the opium trade and the terms of foreign trade at Guangzhou (Canton). In 1839 the imperial commissioner Lin Zexu forced British and other merchants to surrender more than 20,000 chests of opium, which he destroyed at Humen. Britain, which defended the merchants’ claims and wanted wider trade and diplomatic equality, sent an expedition that took Zhoushan in 1840, forced the forts of the Pearl River and occupied Hong Kong Island in 1841, and then took Xiamen (Amoy), Ningbo and Zhenjiang and sailed up the Yangtze to Nanjing. The Treaty of Nanking of 29 August 1842 ceded Hong Kong Island, opened five ports to British trade and residence and made China pay an indemnity of 21 million silver dollars. It was the first of the treaties later called the unequal treaties in China.: Une guerre entre la Grande-Bretagne et la Chine des Qing au sujet du commerce de l’opium et des conditions du commerce étranger à Canton (Guangzhou). En 1839, le commissaire impérial Lin Zexu contraignit les marchands britanniques et autres à livrer plus de 20 000 caisses d’opium, qu’il détruisit à Humen. La Grande-Bretagne, qui défendait les revendications des marchands et voulait un commerce élargi et l’égalité diplomatique, envoya une expédition qui prit Zhoushan en 1840, força les forts de la rivière des Perles et occupa l’île de Hong Kong en 1841, puis prit Xiamen (Amoy), Ningbo et Zhenjiang et remonta le Yangzi jusqu’à Nankin. Le traité de Nankin du 29 août 1842 céda l’île de Hong Kong, ouvrit cinq ports au commerce et à la résidence des Britanniques et obligea la Chine à verser une indemnité de 21 millions de dollars d’argent. Ce fut le premier des traités appelés plus tard en Chine les traités inégaux.
