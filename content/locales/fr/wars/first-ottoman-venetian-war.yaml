"First Ottoman–Venetian War": "Première guerre ottomane-vénétienne"
"Sixteen years of war between the Republic of Venice and Mehmed II, fought in the Morea, the Aegean, Albania and finally on Venice’s own doorstep in Friuli. Venice began with hopes of a crusade alongside Hungary and the pope, but its offensive in the Peloponnese failed, it lost Negroponte, its chief base in the Aegean, in 1470, and after the fall of Krujë and the long siege of Shkodër it made peace in 1479, giving up Shkodër, Lemnos and the Mani and paying for its trading rights.": "Seize ans de guerre entre la République de Venise et Mehmed II, ont combattu dans la Morea, l’Egée, l’Albanie et enfin sur Venise propre porte au Frioul. Venise a commencé avec l’espoir d’une croisade aux côtés de la Hongrie et du pape, mais son offensive dans le Péloponnèse a échoué, il a perdu Negroponte, sa base principale dans l’Egée, en 1470, et après la chute de Krujë et le long siège de Shkodër il a fait la paix en 1479, abandonnant Shkodër, Lemnos et le Mani et payant ses droits commerciaux."
"Venice’s allies came and went. Hungary attacked Bosnia in 1463–1464, Pope Pius II died at Ancona in 1464 before his crusade could sail, and Venice later sought help from Uzun Hasan of the Aq Qoyunlu, who was beaten by Mehmed in 1473. Skanderbeg and other Albanian and Montenegrin lords fought alongside Venice in Albania.": "La Hongrie attaqua la Bosnie en 1463–1464, le pape Pie II mourut à Ancône en 1464 avant que sa croisade ne puisse s’embarquer, et Venise demanda plus tard l’aide d’Uzun Hasan de l’Aq Qoyunlu, qui fut battu par Mehmed en 1473. Skanderbeg et d’autres seigneurs albanais et monténégrins combattirent aux côtés de Venise en Albanie."
"The siege of Negroponte is dated 14 June – 12 July 1470 in some accounts and 10 July – 5 August in others. The legend that its commander Paolo Erizzo was sawn in half is contradicted by an eyewitness who says he died in the fighting.": "Le siège de Negroponte est daté du 14 juin – 12 juillet 1470 dans certains comptes et du 10 juillet – 5 août dans d’autres. La légende selon laquelle son commandant Paolo Erizzo a été scié en deux est contredite par un témoin oculaire qui dit qu’il est mort dans les combats."
