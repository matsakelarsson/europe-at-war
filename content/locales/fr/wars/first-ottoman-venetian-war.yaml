"After the fall of the Morea in 1460, Venice’s ports at Koroni, Methoni and Nafplio bordered Ottoman land. A quarrel over a runaway slave led to Ottoman attacks, and on 3 April 1463 the Ottoman governor took Venetian Argos by treachery. Urged on by Cardinal Bessarion and the pope, the Venetian Senate voted for war on 28 July and allied with Matthias Corvinus of Hungary, who invaded Bosnia. In August a Venetian army retook Argos, rebuilt the Hexamilion wall across the Isthmus of Corinth with many cannon and besieged the Acrocorinth.": "Après la chute de Morea en 1460, les ports de Venise à Koroni, Methoni et Nafplio bordent la terre ottomane. Une querelle sur un esclave fugueur conduit aux attaques ottomanes, et le 3 avril 1463 le gouverneur Ottoman prend Argos vénitien par trahison. Exhorté par le cardinal Bessarion et le pape, le Sénat vénitien a voté pour la guerre le 28 juillet et allié avec Matthias Corvinus de Hongrie, qui a envahi la Bosnie. En août une armée vénitienne a repris Argos, reconstruit le mur d’Hexamilion à travers l’isthme de Corinthe avec beaucoup de canon et assiégé l’Acrocorinthe."
"On 20 October 1463 the besiegers were badly beaten, and their commander Bertoldo d’Este was mortally wounded. When the grand vizier Mahmud Pasha arrived with an army, the Venetians, weakened by dysentery, abandoned the Hexamilion and sailed away; the Ottomans razed the wall and retook Argos. In 1464 Sigismondo Malatesta, lord of Rimini, besieged Mistra without success, and the war in the peninsula settled into raids from the Venetian fortresses, while the countryside was emptied. In 1466 Vettore Cappello attacked Athens but failed to take the Acropolis, and the Venetian siege of Patras ended in a heavy defeat.": "Le 20 octobre 1463, les assiégeants furent gravement battus, et leur commandant Bertoldo d-Este fut mortellement blessé. Lorsque le grand vizier Mahmud Pacha arriva avec une armée, les Vénitiens, affaiblis par la dysenterie, abandonnèrent l’Hexamilion et s’embarquèrent ; les Ottomans rasèrent le mur et reprirent Argos. En 1464 Sigismondo Malatesta, seigneur de Rimini, assiégea Mistra sans succès, et la guerre dans la péninsule s’installa dans des raids des forteresses vénitiennes, tandis que la campagne fut vidée. En 1466 Vettore Cappello attaqua Athènes mais ne prit pas l’Acropole, et le siège vénitien de Patras se termina par une lourde défaite."
