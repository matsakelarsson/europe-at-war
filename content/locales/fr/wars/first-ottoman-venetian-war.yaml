"In 1474 Hadım Süleyman Pasha besieged Venetian Shkodër (Scutari) in Albania from May to August without success. In November 1477 Ottoman raiders under Ömer Bey crossed the Isonzo into Friuli, killed the Venetian commanders who rode out against them, and burned villages as far as the Tagliamento, within sight of Venice; they came again in 1478. With the plague in the city, no allies left and its trade with the Levant cut off, Venice sought peace.": "En 1474, Hadım Süleyman Pasha assiégea Vénitien Shkodër (Scutari) en Albanie de mai à août sans succès. En novembre 1477, des raideurs ottomans sous Ömer Bey traversèrent l’Isonzo dans le Frioul, tuèrent les commandants vénitiens qui s’élançaient contre eux et brûlèrent des villages jusqu’au Tagliamento, en vue de Venise ; ils revinrent en 1478. Avec la peste dans la ville, aucun allié n’a quitté et son commerce avec le Levant coupé, Venise a cherché la paix."
"Mehmed raised his terms. In 1478 he came to Albania in person: Krujë surrendered in June after a year’s blockade, Drisht and Lezhë were stormed, and Shkodër withstood a great siege and was left under blockade. On 25 January 1479 Giovanni Dario signed the Treaty of Constantinople. Venice gave up Shkodër, the island of Lemnos and the Mani, accepted the loss of Negroponte and Krujë, and agreed to pay 100,000 ducats and 10,000 ducats a year for the right to trade freely in the Ottoman Empire. In April the defenders of Shkodër left for Venice, and later in 1479 the Ottomans took the Ionian islands of Lefkada, Cephalonia and Zakynthos from the Tocco family.": "En 1478, il vint en Albanie en personne : Krujë se rendit en juin après un an de blocus, Drisht et Lezhë furent pris d’assaut, et Shkodër résista à un grand siège et fut laissé sous blocus.Le 25 janvier 1479 Giovanni Dario signa le Traité de Constantinople. Venise abandonna Shkodër, l’île de Lemnos et le Mani, accepta la perte de Negroponte et Krujë, et accepta de payer 100 000 ducats et 10 000 ducats par an pour le droit de commerce libre dans l’Empire ottoman. En avril, les défenseurs de Shkodër partirent pour Venise et, plus tard, en 1479, les Ottomans prirent les îles Ioniennes de Lefkada, Cephalonia et Zakynthos de la famille Tocco."
