"In 1470 Mehmed II struck at Negroponte (Chalcis), the Venetian capital of Euboea and its main base in the Aegean. A large fleet under Mahmud Pasha sailed from Gallipoli while the sultan led an army overland, and the Ottomans built a bridge of boats across the narrow Euripus strait to bring their guns onto the island. The Venetian fleet under Niccolò Canal, sent to relieve the town, failed to break the bridge or the blockade.": "En 1470, Mehmed II frappa Negroponte (Chalcis), la capitale vénitienne d’Euboea et sa base principale dans l’Égée. Une grande flotte sous Mahmud Pasha navigua de Gallipoli tandis que le sultan menait une armée sur terre, et les Ottomans construisirent un pont de bateaux à travers l’étroit détroit d’Euripus pour amener leurs canons sur l’île. La flotte vénitienne sous le canal de Niccolò, envoyée pour soulager la ville, n’a pas réussi à briser le pont ou le blocus."
"After several costly assaults the city was stormed in July. It had refused to surrender, so by the custom of the time it was given over to plunder: the men were killed and the women and children enslaved, and the whole island passed to the Ottomans. Canal was disgraced and exiled. Venice now looked for allies in the east, and in 1472 its fleet under Pietro Mocenigo raided the Anatolian coast, sacking Smyrna, while it waited for Uzun Hasan of the Aq Qoyunlu to attack the Ottomans by land.": "Après plusieurs assauts coûteux, la ville a été prise d’assaut en juillet. Elle avait refusé de se rendre, ainsi par la coutume du temps où elle a été donnée au pillage : les hommes ont été tués et les femmes et les enfants asservis, et toute l’île est passée aux Ottomans. Canal a été déshonoré et exilé. Venise cherchait maintenant des alliés à l’est, et en 1472 sa flotte sous Pietro Mocenigo fit un raid sur la côte anatolienne, saccageant Smyrne, pendant qu’elle attendait qu’Uzun Hasan de l’Aq Qoyunlu attaque les Ottomans par terre."
