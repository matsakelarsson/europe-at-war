# French translations of the catalogue text (wave 9); step bodies follow later.
First Portuguese–Ming war: Première guerre entre le Portugal et les Ming
? The first armed clashes between China and a European power, fought at the mouth of the Pearl River. Portuguese ships from Malacca, which Portugal had taken in 1511 from a sultan who sent tribute to the Ming, reached Guangdong in 1513, and in 1517 Fernão Pires de Andrade brought an embassy under Tomé Pires to Guangzhou (Canton). In 1519 his brother Simão de Andrade built a fort at Tunmen (Tamão), kept other foreign traders away, struck a Ming official and was accused of buying or kidnapping Chinese children to sell as slaves in Malacca. Envoys of the exiled sultan of Malacca also complained of the Portuguese. After the Zhengde Emperor died on 20 April 1521 the court rejected the embassy and ordered the Portuguese out. Wang Hong, the coastal defence commander, blockaded the Portuguese ships at Tunmen with some fifty junks and fire ships in 1521; the Portuguese lost two ships and many men before a storm let the rest escape to Malacca. In August 1522 a new squadron under Martim Afonso de Melo Coutinho was beaten at Xicaowan, losing two ships and 42 men taken prisoner; 23 Portuguese prisoners were executed in Guangzhou in September 1523. Tomé Pires and his companions were held in Guangzhou, where Pires probably died in about 1524. The Ming copied the captured breech-loading guns as folangji, and the Portuguese traded illegally on the coast of Fujian and Zhejiang until officials in Guangdong let them settle at Macau in the 1550s.
: Les premiers affrontements armés entre la Chine et une puissance européenne, livrés à l’embouchure de la rivière des Perles. Des navires portugais venus de Malacca, que le Portugal avait prise en 1511 à un sultan tributaire des Ming, atteignirent le Guangdong en 1513 et, en 1517, Fernão Pires de Andrade amena à Canton une ambassade conduite par Tomé Pires. En 1519, son frère Simão de Andrade construisit un fort à Tunmen (Tamão), écarta les autres marchands étrangers, frappa un fonctionnaire Ming et fut accusé d’acheter ou d’enlever des enfants chinois pour les vendre comme esclaves à Malacca. Des envoyés du sultan de Malacca en exil se plaignirent aussi des Portugais. Après la mort de l’empereur Zhengde, le 20 avril 1521, la cour rejeta l’ambassade et ordonna aux Portugais de partir. Wang Hong, commandant de la défense côtière, bloqua en 1521 les navires portugais à Tunmen avec une cinquantaine de jonques et des brûlots ; les Portugais perdirent deux navires et de nombreux hommes avant qu’une tempête ne permette aux autres de s’échapper vers Malacca. En août 1522, une nouvelle escadre commandée par Martim Afonso de Melo Coutinho fut battue à Xicaowan, perdant deux navires et 42 hommes faits prisonniers ; 23 prisonniers portugais furent exécutés à Canton en septembre 1523. Tomé Pires et ses compagnons furent détenus à Canton, où Pires mourut probablement vers 1524. Les Ming copièrent sous le nom de folangji les canons à chargement par la culasse qu’ils avaient capturés, et les Portugais commercèrent illégalement sur les côtes du Fujian et du Zhejiang jusqu’à ce que les autorités du Guangdong les laissent s’établir à Macao dans les années 1550.
