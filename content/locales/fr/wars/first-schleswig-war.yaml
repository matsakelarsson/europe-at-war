"April – August 1848": "avril – août 1848"
"On 12 April the German Confederation recognised the provisional government and asked Prussia to act for it. A much larger Prussian and federal army under General Wrangel crossed into Schleswig, beat the Danes at Schleswig town on 23 April, and pushed on into Jutland, occupying Fredericia in early May and demanding money from the Jutland towns. The Danish army withdrew to the islands of Als and Funen, from where it struck back, winning at Dybbøl on 5 June.": "Le 12 avril, la Confédération allemande reconnaît le gouvernement provisoire et demande à la Prusse d’agir en sa faveur. Une armée fédérale et prussienne beaucoup plus importante, sous la direction du général Wrangel, entre dans le Schleswig, bat les Danois à Schleswig le 23 avril, puis se rend au Jutland, occupant Fredericia début mai et exigeant de l’argent aux villes du Jutland. L’armée danoise s’est retirée dans les îles d’Als et de Funen, d’où elle a reculé, remportant à Dybbøl le 5 juin."
"The Danish navy blockaded German ports, and the other powers would not see Denmark broken up. Russia sent warships and warned Prussia, Britain threatened to step in, and a Swedish–Norwegian force landed on Funen to back the Danes. Prussia gave way. On 26 August it signed a seven-month armistice at Malmö which met most Danish demands, to the fury of the German National Assembly in Frankfurt, which nonetheless had to accept it.": "La marine danoise a bloqué les ports allemands, et les autres puissances ne verraient pas le Danemark se briser. La Russie envoya des navires de guerre et avertit la Prusse, la Grande-Bretagne menaça d’y entrer, et une force suédoise-norvégienne débarqua sur Funen pour soutenir les Danois. Le 26 août, elle signe à Malmö un armistice de sept mois qui répond à la plupart des demandes danoises, à la fureur de l’Assemblée nationale allemande de Francfort, qui doit néanmoins l’accepter."
