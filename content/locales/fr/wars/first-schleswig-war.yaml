"Talks in London failed, and fighting resumed on 3 April 1849, this time with a reorganised Schleswig-Holstein army alongside Prussian and federal troops. Two days later a Danish squadron attacked the shore batteries at Eckernförde. It was a disaster. The ship of the line Christian VIII caught fire and blew up, the frigate Gefion was captured, and over a thousand Danes were killed, wounded or taken prisoner, against a handful of German casualties.": "Les pourparlers à Londres échouèrent, et les combats reprirent le 3 avril 1849, cette fois avec une armée du Schleswig-Holstein réorganisée aux côtés des troupes prussiennes et fédérales. Deux jours plus tard, un escadron danois attaqua les batteries côtières d’Eckernförde. Le navire de la ligne Christian VIII a pris feu et a explosé, la frégate Gefion a été capturée, et plus d’un millier de Danois ont été tués, blessés ou faits prisonniers, contre une poignée de victimes allemandes."
"On land the Schleswig-Holsteiners won at Kolding on 23 April and laid siege to the fortress of Fredericia, while Prussian troops pushed north through Jutland. Then on 6 July the Danish garrison, reinforced by sea, broke out of Fredericia and stormed the siege lines. The besiegers lost about 3,000 men, many of them taken prisoner, and the Danes about 1,900; General Rye, one of the Danish commanders, was killed. Four days later Prussia signed a new armistice.": "Sur terre, les Schleswig-Holsteiners ont gagné à Kolding le 23 avril et posé siège à la forteresse de Fredericia, tandis que les troupes prussiennes poussaient vers le nord à travers Jutland. Puis, le 6 juillet, la garnison danoise, renforcée par la mer, a éclaté de Fredericie et a pris l’assaut des lignes de siège. Les assiéges ont perdu environ 3 000 hommes, dont un grand nombre ont été faits prisonniers, et les Danois environ 1 900 ; le général Rye, l’un des commandants danois, a été tué. Quatre jours plus tard, la Prusse a signé un nouvel armistice."
