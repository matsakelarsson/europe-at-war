"March – April 1848": "mars – avril 1848"
"The Danish king ruled the duchies of Schleswig and Holstein, but they were not part of the kingdom. Holstein, entirely German-speaking, belonged to the German Confederation; Schleswig had Danish, German and Frisian speakers. Danish liberals wanted Schleswig joined to Denmark up to the river Eider, while German nationalists wanted the two duchies kept together, inside Germany. In March 1848, as revolution swept Europe, a new government in Copenhagen took up the Eider programme.": "Le roi danois gouvernait les duchés de Schleswig et de Holstein, mais ils ne faisaient pas partie du royaume. Holstein, entièrement germanophone, appartenait à la Confédération allemande ; Schleswig avait des locuteurs danois, allemands et frison. Les libéraux danois voulaient que Schleswig rejoigne le Danemark jusqu’à la rivière Eider, tandis que les nationalistes allemands voulaient que les deux duchés soient conservés ensemble, en Allemagne. En mars 1848, alors que la révolution balayait l’Europe, un nouveau gouvernement de Copenhague s’engagea dans le programme Eider."
"On 24 March German-minded leaders in Kiel formed a provisional government for Schleswig-Holstein, and the Prince of Noer walked into the fortress of Rendsburg with a rifle corps and some Kiel students and won its garrison over. A volunteer army of about 7,000 moved north and took Flensburg. On 9 April a Danish army landed east of the town and beat it at Bov, and the Schleswig-Holsteiners fell back to Rendsburg.": "Le 24 mars, des dirigeants allemands à Kiel formèrent un gouvernement provisoire pour le Schleswig-Holstein, et le prince de Noer entra dans la forteresse de Rendsburg avec un corps de fusils et quelques étudiants de Kiel et remporta sa garnison. Une armée volontaire d’environ 7 000 hommes se déplaça vers le nord et prit Flensburg. Le 9 avril, une armée danoise débarqua à l’est de la ville et la battit à Bov, et les Schleswig-Holsteiners retournèrent à Rendsburg."
