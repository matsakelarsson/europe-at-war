# Some French text was translated automatically.
"First Schleswig War": "Première guerre du Schleswig"
"A war over the duchies of Schleswig and Holstein, fought between Denmark and a German-minded provisional government in the duchies, which Prussia and the German Confederation backed until 1850. Denmark won on the battlefield, and the great powers’ London Protocol of 1852 kept the duchies under the Danish king.": "Une guerre sur les duchés de Schleswig et Holstein, a combattu entre le Danemark et un gouvernement provisoire d’esprit allemand dans les duchés, que la Prusse et la Confédération allemande ont soutenu jusqu’en 1850. Le Danemark a gagné sur le champ de bataille, et les grandes puissances de Londres Protocole 1852 gardé les duchés sous le roi danois."
"Known in Denmark as the Three Years’ War (Treårskrigen) and in Germany as the Schleswig-Holstein uprising (Schleswig-Holsteinische Erhebung).": "Connu au Danemark comme la guerre de trois ans (Treårskrigen) et en Allemagne comme le soulèvement du Schleswig-Holstein (Schleswig-Holsteinische Erhebung)."
"Place names are given in the form most used in English; most have both a Danish and a German name (Idstedt/Isted, Flensburg/Flensborg).": "Les noms de lieux sont donnés sous la forme la plus utilisée en anglais ; la plupart ont un nom danois et un nom allemand (Idstedt/Isted, Flensburg/Flensborg)."
