"July 1850 – May 1852": "juillet 1850 – mai 1852"
"Under heavy pressure from Russia, Prussia made peace with Denmark in Berlin on 2 July 1850 and withdrew, leaving Schleswig-Holstein to fight alone. Three weeks later about 37,000 Danish troops met some 27,000 Schleswig-Holsteiners at Idstedt, north of Schleswig town. It was the largest battle ever fought in the Nordic countries until the Winter War of 1939–1940. In fog and rain the fighting swung back and forth for two days before the Schleswig-Holsteiners retreated.": "Trois semaines plus tard, environ 37 000 soldats danois rencontrèrent quelque 27 000 Schleswig-Holsteiners à Idstedt, au nord de la ville de Schleswig. C’était la plus grande bataille jamais menée dans les pays nordiques jusqu’à la guerre d’hiver de 1939-1940. Dans le brouillard et la pluie, les combats se sont déroulés deux jours avant que les Schleswig-Holsteiners ne reculent."
"The Danish victory was costly and the war dragged on into the autumn, with failed Schleswig-Holstein attacks on Missunde and Friedrichstadt. In January 1851 Austria and Prussia, acting for the restored German Confederation, made the duchies give up the fight, and their army was disbanded on 1 April.": "La victoire danoise fut coûteuse et la guerre traînée à l’automne, avec des attaques infructueuses du Schleswig-Holstein contre Missunde et Friedrichstadt. En janvier 1851, l’Autriche et la Prusse, agissant pour la Confédération allemande restaurée, firent abandonner les duchies et leur armée fut dissoute le 1er avril."
"The London Protocol of 8 May 1852, signed by the great powers, Sweden–Norway and Denmark, kept the Danish monarchy whole and named Christian of Glücksburg heir to it and to the duchies. Denmark promised not to bind Schleswig more closely to the kingdom than Holstein. The question was left unsolved.": "Le Protocole de Londres du 8 mai 1852, signé par les grandes puissances, la Suède-Norvège et le Danemark, a gardé toute la monarchie danoise et nommé Christian de Glücksburg héritier de celle-ci et des duchés. Le Danemark promet de ne pas lier Schleswig plus étroitement au royaume que Holstein."
