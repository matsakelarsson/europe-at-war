# French translations of the catalogue text (wave 14); step bodies follow later.
First Seminole War: Première guerre séminole
? The first war between the United States and the Seminoles of Spanish Florida, in 1817–1818. After the Creek War of 1813–1814 thousands of Red Stick Creeks had fled into Florida and joined the Seminole and Miccosukee towns, and Black people who had escaped slavery in Georgia and the Carolinas lived beside them as free communities, the Black Seminoles. In July 1816 a US expedition destroyed the fort at Prospect Bluff on the Apalachicola that the British had left to former Colonial Marines and maroons. In November 1817 US troops attacked the Miccosukee town of Fowltown in Georgia, and Seminole warriors in turn attacked a US supply boat on the Apalachicola. In March 1818 Andrew Jackson invaded Florida with about 4,000 regulars, militia and Lower Creek warriors, burned the Miccosukee and Red Stick towns, seized the Spanish fort of St. Marks, attacked Bowlegs Town on the Suwannee, executed two British subjects and took Pensacola. Spain, unable to defend Florida, ceded it to the United States by the Adams–Onís Treaty of 1819, which took effect in 1821.
: "La première guerre entre les États-Unis et les Séminoles de la Floride espagnole, en 1817–1818. Après la guerre creek de 1813–1814, des milliers de Creeks Bâtons-Rouges s’étaient réfugiés en Floride et avaient rejoint les villages séminoles et miccosukees, et des Noirs qui avaient échappé à l’esclavage en Géorgie et dans les Carolines vivaient à leurs côtés en communautés libres : les Séminoles noirs. En juillet 1816, une expédition américaine détruisit le fort de Prospect Bluff, sur l’Apalachicola, que les Britanniques avaient laissé à d’anciens Colonial Marines et à des marrons. En novembre 1817, des troupes américaines attaquèrent le village miccosukee de Fowltown, en Géorgie, et des guerriers séminoles attaquèrent à leur tour un bateau de ravitaillement américain sur l’Apalachicola. En mars 1818, Andrew Jackson envahit la Floride avec environ 4 000 soldats réguliers, miliciens et guerriers des Creeks inférieurs, brûla les villages miccosukees et Bâtons-Rouges, s’empara du fort espagnol de St. Marks, attaqua Bowlegs Town sur la Suwannee, fit exécuter deux sujets britanniques et prit Pensacola. Incapable de défendre la Floride, l’Espagne la céda aux États-Unis par le traité d’Adams-Onís de 1819, entré en vigueur en 1821."
