# French translations of the catalogue text (wave 10); step bodies follow later.
First Sino-Japanese War: Première guerre sino-japonaise
? "The war between Qing China and Japan in 1894–1895 for control of Korea, a tributary state of the Qing. Both powers sent troops to Korea in June 1894 during the Donghak peasant rising. On 23 July Japanese troops seized the royal palace in Seoul and installed a government that asked them to expel the Chinese; two days later the Japanese navy attacked a Chinese convoy off Pungdo and sank the troopship Kowshing, and on 1 August both countries declared war. Japan’s modern army and navy won every major battle: Seonghwan, Pyongyang and the naval battle of the Yalu in 1894, then Port Arthur (Lüshun), where Japanese troops killed thousands of soldiers and civilians after taking the town, and the naval base of Weihaiwei in February 1895. By the Treaty of Shimonoseki of 17 April 1895 China recognised Korea’s independence, ceded Taiwan, the Penghu Islands and the Liaodong peninsula and agreed to pay 200 million taels; within days Russia, Germany and France forced Japan to give back Liaodong. The war ended China’s suzerainty over Korea and made Japan the leading power in East Asia. Japan lost about 13,300 dead, most of them to disease; Chinese losses are uncertain and are usually estimated at some 35,000 killed and wounded."
: "La guerre qui opposa la Chine des Qing au Japon en 1894–1895 pour le contrôle de la Corée, État tributaire des Qing. Les deux puissances envoyèrent des troupes en Corée en juin 1894, pendant le soulèvement paysan du Donghak. Le 23 juillet, les troupes japonaises s’emparèrent du palais royal de Séoul et installèrent un gouvernement qui leur demanda d’expulser les Chinois ; deux jours plus tard, la marine japonaise attaqua un convoi chinois au large de Pungdo et coula le transport de troupes Kowshing, et le 1er août les deux pays se déclarèrent la guerre. L’armée et la marine modernes du Japon remportèrent toutes les grandes batailles : Seonghwan, Pyongyang et la bataille navale du Yalu en 1894, puis Port-Arthur (Lüshun), où les troupes japonaises tuèrent des milliers de soldats et de civils après avoir pris la ville, et la base navale de Weihaiwei en février 1895. Par le traité de Shimonoseki du 17 avril 1895, la Chine reconnut l’indépendance de la Corée, céda Taïwan, les îles Penghu et la péninsule du Liaodong et accepta de payer 200 millions de taels ; quelques jours plus tard, la Russie, l’Allemagne et la France contraignirent le Japon à rendre le Liaodong. La guerre mit fin à la suzeraineté chinoise sur la Corée et fit du Japon la première puissance d’Asie orientale. Le Japon compta environ 13 300 morts, pour la plupart emportés par la maladie ; les pertes chinoises sont incertaines et généralement estimées à quelque 35 000 tués et blessés."
