# French translations of the catalogue text (wave 12); step bodies follow later.
First Sudanese Civil War: Première guerre civile soudanaise
? The war between the government of Sudan and southern Sudanese rebels, the first of the two civil wars that led to South Sudan’s independence. Under British rule the south had been governed apart from the Arabic-speaking, Muslim north, and when Sudan moved towards independence southerners feared domination by northern officials. On 18 August 1955 southern soldiers of the Equatoria Corps mutinied at Torit and killed northern officers, traders and their families. After independence in 1956, and especially under the military regime of Ibrahim Abboud (1958–1964), which pressed Arabic and Islam on the south and expelled foreign missionaries, scattered resistance grew into a guerrilla war led from 1963 by the Anyanya. Massacres of southern civilians by government troops in Juba and Wau in 1965 deepened it. From 1969 Israel armed the rebels, and in 1971 Joseph Lagu united them as the Southern Sudan Liberation Movement. Gaafar Nimeiry’s government made peace by the Addis Ababa Agreement of 1972, which gave the south self-government as one region. Estimates of the dead run from 500,000 to a million, most of them civilians, and hundreds of thousands fled to neighbouring countries.
: La guerre entre le gouvernement du Soudan et des rebelles du sud du pays, la première des deux guerres civiles qui menèrent à l’indépendance du Soudan du Sud. Sous la domination britannique, le Sud avait été administré séparément du Nord arabophone et musulman et, lorsque le Soudan s’achemina vers l’indépendance, les Sudistes craignirent d’être dominés par des fonctionnaires nordistes. Le 18 août 1955, des soldats sudistes du corps d’Équatoria se mutinèrent à Torit et tuèrent des officiers et des commerçants nordistes ainsi que leurs familles. Après l’indépendance, en 1956, et surtout sous le régime militaire d’Ibrahim Abboud (1958–1964), qui imposa l’arabe et l’islam au Sud et expulsa les missionnaires étrangers, une résistance dispersée se transforma en une guérilla menée à partir de 1963 par l’Anyanya. Les massacres de civils sudistes commis par les troupes gouvernementales à Juba et à Wau en 1965 l’aggravèrent. À partir de 1969, Israël arma les rebelles et, en 1971, Joseph Lagu les réunit au sein du Mouvement de libération du Sud-Soudan. Le gouvernement de Gaafar Nimeiry fit la paix par l’accord d’Addis-Abeba de 1972, qui accordait au Sud l’autonomie sous la forme d’une région unique. Les estimations du nombre de morts vont de 500 000 à un million, des civils pour la plupart, et des centaines de milliers de personnes se réfugièrent dans les pays voisins.
