# French translations of the catalogue text (wave 9); step bodies follow later.
First Taiwan Strait Crisis: Première crise du détroit de Taïwan
An armed confrontation in 1954–1955 between the People’s Republic of China and the Republic of China on Taiwan over the islands the ROC still held off the mainland coast. The PLA shelled Kinmen (Quemoy) from 3 September 1954 and later Matsu and the Dachen islands; the United States and the ROC signed a mutual defence treaty in December. On 18–19 January 1955 the PLA took the Yijiangshan islands in its first joint operation of land, sea and air forces, and the US Congress passed the Formosa Resolution. In February the US Seventh Fleet covered the evacuation of the Dachens, which the PLA then occupied. After American leaders spoke openly of using nuclear weapons, Zhou Enlai offered talks at the Bandung Conference in April, and the shelling stopped on 1 May 1955. Kinmen and Matsu stayed with the ROC.: Une confrontation armée, en 1954–1955, entre la République populaire de Chine et la République de Chine à Taïwan au sujet des îles que cette dernière tenait encore au large des côtes du continent. L’APL bombarda Kinmen (Quemoy) à partir du 3 septembre 1954, puis Matsu et les îles Dachen ; les États-Unis et la République de Chine signèrent un traité de défense mutuelle en décembre. Les 18 et 19 janvier 1955, l’APL prit les îles Yijiangshan lors de sa première opération interarmées associant forces terrestres, navales et aériennes, et le Congrès américain adopta la résolution de Formose. En février, la 7e flotte américaine couvrit l’évacuation des Dachen, que l’APL occupa ensuite. Après que des dirigeants américains eurent évoqué ouvertement l’emploi d’armes nucléaires, Zhou Enlai proposa des négociations à la conférence de Bandung en avril, et les bombardements cessèrent le 1er mai 1955. Kinmen et Matsu restèrent à la République de Chine.
