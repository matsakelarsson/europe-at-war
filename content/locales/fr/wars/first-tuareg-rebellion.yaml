# French translations of the catalogue text (wave 12); step bodies follow later.
First Tuareg rebellion: Première rébellion touarègue
? "A rising of the Kel Adagh Tuareg of the Adrar des Ifoghas, around Kidal in the far north-east of Mali, against the new Malian state, remembered in Tamasheq as Alfellaga. When French rule ended in 1960, the Tuareg and Arab nomads of the north found themselves governed from Bamako by the socialist government of Modibo Keïta and by officials from the south, who brought new taxes, controls on herds and trade, and plans to settle the nomads; some northern notables had asked France in the late 1950s not to place them under a state ruled from the south. Small hit-and-run raids on posts and patrols began in 1962 and grew in 1963. The rebels had no single leadership or plan, rode camels, carried old rifles and probably never numbered more than about 1,500. The Malian army, newly equipped with Soviet weapons, answered with a harsh counter-insurgency: it executed suspected rebels and civilians, among them religious and clan leaders, and its commandant at Kidal, Diby Sillas Diarra, became notorious for public executions. Between November 1963 and February 1964 Keïta won the support of Algeria and Morocco, which let Malian troops pursue rebels across the border; the rebel leaders Zeyd ag Attaher and Ilyas ag Ayyuba were arrested in Algeria in November 1963 and handed over to Mali, Mohamed Ali ag Attaher was arrested in Morocco and the military leader Elledi ag Alla in Algeria in March 1964. By the end of 1964 the revolt had been crushed and the north was placed under military administration. No reliable count of the dead exists. Many Tuareg fled to Algeria and Libya, the development promised for the north never came, and the memory of the repression fed the rebellions of 1990 and 2012."
: "Un soulèvement des Touareg Kel Adagh de l’Adrar des Ifoghas, autour de Kidal, dans l’extrême nord-est du Mali, contre le jeune État malien, dont le souvenir est resté en tamasheq sous le nom d’Alfellaga. À la fin de la domination française en 1960, les nomades touareg et arabes du nord se retrouvèrent gouvernés depuis Bamako par le gouvernement socialiste de Modibo Keïta et par des fonctionnaires venus du sud, qui apportèrent de nouveaux impôts, des contrôles sur les troupeaux et le commerce, et des projets de sédentarisation des nomades ; certains notables du nord avaient demandé à la France, à la fin des années 1950, de ne pas les placer sous l’autorité d’un État gouverné depuis le sud. De petits coups de main contre des postes et des patrouilles commencèrent en 1962 et s’intensifièrent en 1963. Les rebelles n’avaient ni direction unique ni plan, allaient à dos de chameau, portaient de vieux fusils et ne furent sans doute jamais plus d’environ 1 500. L’armée malienne, nouvellement équipée d’armes soviétiques, répondit par une contre-insurrection sévère : elle exécuta des rebelles présumés et des civils, parmi lesquels des chefs religieux et des chefs de clan, et son commandant à Kidal, Diby Sillas Diarra, devint tristement célèbre pour ses exécutions publiques. Entre novembre 1963 et février 1964, Keïta obtint le soutien de l’Algérie et du Maroc, qui laissèrent les troupes maliennes poursuivre les rebelles au-delà de la frontière ; les chefs rebelles Zeyd ag Attaher et Ilyas ag Ayyuba furent arrêtés en Algérie en novembre 1963 et livrés au Mali, Mohamed Ali ag Attaher fut arrêté au Maroc, et le chef militaire Elledi ag Alla en Algérie en mars 1964. À la fin de 1964, la révolte avait été écrasée et le nord fut placé sous administration militaire. Il n’existe aucun bilan fiable des morts. De nombreux Touareg s’enfuirent en Algérie et en Libye, le développement promis au nord ne vint jamais, et le souvenir de la répression nourrit les rébellions de 1990 et de 2012."
