Bannockburn: Bannockburn
1310–1314: 1310–1314
Edward II, at odds with his barons, made only one real campaign in Scotland before 1314, in 1310–1311, and it found no one to fight. Bruce took the war into northern England, burning towns and selling truces to communities for large sums. One by one the English-held castles fell, often to night attacks, and Bruce had them pulled down so they could not be used against him. Perth was taken on 8 January 1313, Roxburgh by James Douglas in February 1314 and Edinburgh in March by Thomas Randolph, whose men climbed the castle rock. Edward Bruce, the king’s brother, besieged Stirling, and its commander agreed to surrender if it was not relieved by midsummer 1314.: Edward II, contrairement à ses barons, n’a fait qu’une vraie campagne en Écosse avant 1314, en 1310–1311, et il ne trouva personne pour se battre. Bruce prit la guerre dans le nord de l’Angleterre, incendiant les villes et vendant des trêves aux communautés pour de grandes sommes. Perth fut pris le 8 janvier 1313, Roxburgh par James Douglas en février 1314 et Édimbourg en mars par Thomas Randolph, dont les hommes grimpèrent le rocher du château. Edward Bruce, le frère du roi, assiégea Stirling, et son commandant accepta de se rendre s’il n’était pas relevé au milieu de l’été 1314.
Edward II came north with the largest army England had yet sent into Scotland. He had summoned 25,000 foot and 2,000 horse; historians think fewer came, but the army was still much larger than Bruce’s, perhaps 6,000–7,000 men. On 23 June, as the English approached Stirling, Bruce killed the knight Henry de Bohun in single combat in front of the armies, and English attempts to get past the Scots were beaten back. That night the English camped on the low ground by the Bannock Burn. Next morning the Scottish schiltrons advanced and pinned them between the streams; the English army broke, and many drowned in the Forth or the burn.: Edward II est arrivé au nord avec la plus grande armée que l’Angleterre avait encore envoyée en Écosse. Il avait convoqué 25 000 pieds et 2 000 chevaux ; les historiens pensent qu’il y en avait moins, mais l’armée était encore beaucoup plus grande que Bruce, peut-être 6 000 à 7 000 hommes. Le 23 juin, alors que les Anglais s’approchaient de Stirling, Bruce tua le chevalier Henry de Bohun en un seul combat devant les armées, et les Anglais tentèrent de passer les Écossais. Cette nuit-là, les Anglais campèrent sur le bas sol par la brûlure de Bannock. Le lendemain matin, les schiltrons écossais avançaient et les pilonnaient entre les ruisseaux ; l’armée anglaise se brisa, et beaucoup se noyèrent dans la Forth ou la brûlure.
The Earl of Gloucester was among the dead, and Edward II fled to Dunbar and from there by boat to Berwick. Stirling Castle surrendered, and prisoners such as the Earl of Hereford were exchanged for Bruce’s wife, daughter and sister and Bishop Wishart, held in England since 1306. Bannockburn made Bruce’s rule in Scotland secure, but England did not give up its claim.: Le comte de Gloucester était parmi les morts, et Edward II s’enfuit à Dunbar et de là en bateau à Berwick. Stirling Castle se rendit, et des prisonniers tels que le comte d’Hereford furent échangés contre Bruces épouse, fille et sœur et Mgr Wishart, détenu en Angleterre depuis 1306. Bannockburn fit régner Bruces en Écosse, mais l’Angleterre n’abandonna pas sa revendication.
