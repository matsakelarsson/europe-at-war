First War of Scottish Independence: Première guerre d’indépendance écossaise
The war in which Scotland resisted English rule after Edward I deposed King John Balliol in 1296. Led first by William Wallace and Andrew Moray and then by Robert the Bruce, who made himself king in 1306 and beat Edward II at Bannockburn in 1314, the Scots won recognition of their independence in the Treaty of Edinburgh–Northampton in 1328.: La guerre dans laquelle l’Écosse résista à la domination anglaise après Edward Ier déposa le roi John Balliol en 1296. Dirigés d’abord par William Wallace et Andrew Moray puis par Robert le Bruce, qui se fit roi en 1306 et battit Edward II à Bannockburn en 1314, les Écossais remportèrent la reconnaissance de leur indépendance dans le traité d’Édimbourg–Northampton en 1328.
Dates are Julian, with years beginning on 1 January.: Les dates sont Julian, les années commençant le 1er janvier.
The war was also a Scottish civil war. Many Scots fought for the English at different times, above all the Comyns and their allies after Bruce killed John Comyn in 1306.: La guerre fut aussi une guerre civile écossaise. Beaucoup d’Écossais combattirent pour les Anglais à différents moments, surtout les Comyn et leurs alliés après que Bruce eut tué John Comyn en 1306.
Much of what is popularly told about William Wallace comes from The Wallace, a poem by Blind Harry written about 170 years after his death. Little is known for certain about his early life.: Une grande partie de ce que l’on raconte à propos de William Wallace provient de The Wallace, un poème de Blind Harry écrit environ 170 ans après sa mort.
Edward Bruce’s invasion of Ireland in 1315–1318 has its own entry, the Bruce campaign in Ireland.: L’invasion de l’Irlande par Edward Bruce en 1315–1318 a sa propre entrée, la campagne Bruce en Irlande.
