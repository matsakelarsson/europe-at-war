From Arbroath to Edinburgh–Northampton: De Arbroath à Edimbourg–Northampton
1315–1328: 1315–1328
In 1315 the king’s brother Edward Bruce invaded Ireland, opening a second front that lasted until his death in 1318. In April 1318 the Scots took Berwick, the last English stronghold in Scotland, and held it against Edward II’s siege the next year. To draw him away, Randolph and Douglas raided deep into Yorkshire and on 20 September 1319 routed a hastily raised force, led by the Archbishop of York and including many clergy, at Myton. Scottish raids reached Yorkshire and Lancashire, and the north of England paid heavily for truces.: En 1315, le frère du roi Edward Bruce envahit l’Irlande, ouvrant un deuxième front qui dura jusqu’à sa mort en 1318. En avril 1318, les Écossais prirent Berwick, la dernière forteresse anglaise en Écosse, et l’assiégea contre Edward II l’année suivante. Pour l’éloigner, Randolph et Douglas ont fait une descente profonde dans le Yorkshire et, le 20 septembre 1319, ont acheminé une force hâtivement levée, dirigée par l’archevêque de York et comprenant de nombreux membres du clergé, à Myton.
Bruce was still excommunicated, and the pope would not call him king. In April 1320 the Scottish barons sent Pope John XXII the letter known as the Declaration of Arbroath, asking him to persuade Edward to leave the Scots in peace and declaring that “as long as but a hundred of us remain alive, never will we on any conditions be brought under English rule”. In 1322 Edward invaded again, found the Lowlands stripped of food and withdrew; the Scots followed and nearly captured him at Old Byland in Yorkshire on 14 October. In May 1323 the two kingdoms agreed a thirteen-year truce at Bishopthorpe.: Bruce était encore excommunié, et le pape ne l’appelait pas roi. En avril 1320, les barons écossais envoyaient au Pape Jean XXII la lettre connue sous le nom de Déclaration d’Arbroath, lui demandant de persuader Edward de quitter les Écossais en paix et déclarant que tant qu’une centaine d’entre nous resteraient en vie, nous ne serons jamais soumis à la domination anglaise. En 1322, Edward envahit de nouveau, trouva les Lowlands dépouillés de nourriture et se retira ; les Écossais le suivirent et le prirent presque au Old Byland dans le Yorkshire le 14 octobre.
Edward II was deposed in January 1327, and the Scots attacked at once. That summer they outmanoeuvred the young Edward III’s army in Weardale, and in a night raid on the English camp at Stanhope Park Douglas nearly took the king prisoner. The regents, Queen Isabella and Roger Mortimer, made peace. By the treaty sealed at Edinburgh on 17 March 1328 and confirmed by the English parliament at Northampton on 1 May, England recognised Scotland as an independent kingdom under Robert I and his heirs, with the border as it had been under Alexander III, in return for £20,000. Bruce’s son David married Edward’s sister Joan, and Bruce died in June 1329.: Edward II fut déposé en janvier 1327, et les Écossais attaquèrent aussitôt.L’été, ils surmontèrent l’armée du jeune Édouard III à Weardale, et lors d’un raid nocturne sur le camp anglais de Stanhope Park Douglas prit presque le roi prisonnier. Les régents, la reine Isabella et Roger Mortimer, firent la paix. Par le traité signé à Edimbourg le 17 mars 1328 et confirmé par le parlement anglais à Northampton le 1er mai, l’Angleterre reconnaît l’Écosse comme un royaume indépendant sous Robert Ier et ses héritiers, avec la frontière comme elle avait été sous Alexander III, en échange de £20 000.
