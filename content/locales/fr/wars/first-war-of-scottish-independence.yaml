Wallace, Moray and Stirling Bridge: Pont Wallace, Moray et Stirling
1297–1298: 1297–1298
English rule soon met resistance. In May 1297 William Wallace, a younger son of a minor landholder, killed the English sheriff of Lanark, while in the north Andrew Moray led a rising that drove the English from most of the castles beyond the Forth. Joining forces, they faced the Earl of Surrey and the treasurer Hugh de Cressingham at Stirling on 11 September. The English began to cross the narrow bridge over the Forth, and when part of their army was over, the Scots charged down from the slopes above and cut it off. Cressingham was among the many killed and, it is said, flayed. Moray died of his wounds later that year.: En mai 1297, William Wallace, un fils cadet d’un propriétaire foncier mineur, tua le shérif anglais de Lanark, tandis que dans le nord Andrew Moray menait une montée qui a conduit les Anglais de la plupart des châteaux au-delà du Forth. Rejoindre les forces, ils affrontèrent le comte de Surrey et le trésorier Hugh de Cressingham à Stirling le 11 septembre. Les Anglais commencèrent à traverser le pont étroit au-dessus de la Forth, et quand une partie de leur armée était terminée, les Écossais chargés des pentes en haut et l’ont coupé. Cressingham était parmi les nombreux tués et, dit-on, flaqué. Moray mourut de ses blessures plus tard cette année-là.
Wallace raided Northumberland and Cumberland that autumn and was made Guardian of Scotland in the name of King John. In July 1298 Edward I invaded with a large army, perhaps 25,000 foot, many of them Welsh. On 22 July at Falkirk Wallace drew up his spearmen in schiltrons, tight rings bristling with spears, which held off the English cavalry until Edward’s archers and crossbowmen shot gaps in them; the knights then broke in, and many Scots were killed. Edward lacked the supplies to hold the country and withdrew, but Wallace gave up the guardianship.: En juillet 1298, Edward Ier envahit avec une grande armée, peut-être 25 000 pieds, dont beaucoup de gallois. Le 22 juillet, à Falkirk Wallace dessina ses sapeurs en schiltrons, des anneaux serrés en bourrelet de lances, qui retenaient la cavalerie anglaise jusqu’à ce que les archers et arbalètes d’Edward y tirèrent des brèches ; les chevaliers parvinrent et beaucoup d’Écossais furent tués. Edward manqua de provisions pour tenir le pays et se retira, mais Wallace abandonna la tutelle.
