1298–1305: 1298–1305
Scotland was now governed by Guardians, among them Robert Bruce, Earl of Carrick, grandson of one of the claimants of 1291, and his rival John Comyn of Badenoch, Balliol’s nephew. They could not work together, and Bruce resigned in 1300 and later made his peace with Edward. Edward campaigned in Scotland almost every year, while Scottish envoys worked in Rome and Paris to restore Balliol, now released into papal keeping. On 24 February 1303 the Scots under Comyn beat an English force at Roslin, but that May Philip IV made peace with England and left Scotland out of it.: L’Écosse est maintenant gouvernée par des Gardiens, parmi lesquels Robert Bruce, comte de Carrick, petit-fils d’un des demandeurs de 1291, et son rival John Comyn de Badenoch, neveu de Balliol. Ils ne peuvent pas travailler ensemble, et Bruce démissionne en 1300 et plus tard fait sa paix avec Edward. Edward fait campagne en Ecosse presque chaque année, tandis que les envoyés écossais travaillent à Rome et Paris pour restaurer Balliol, maintenant libéré dans la garde papale. Le 24 février 1303, les Écossais de Comyn battent une force anglaise à Roslin, mais que Mai Philippe IV fait la paix avec l’Angleterre et en laisse l’Écosse.
In 1303 Edward marched up the east as far as Moray and wintered at Dunfermline, and in February 1304 Comyn and most of the Scottish leaders submitted. Stirling Castle held out for three months against the largest siege train Edward could gather, including a giant trebuchet called the War Wolf, which he insisted on trying out after the garrison had offered to surrender. Wallace refused to submit. Betrayed near Glasgow in August 1305, he was taken to London, tried for treason and on 23 August hanged, drawn and quartered at Smithfield; his limbs were displayed at Newcastle, Berwick, Stirling and Perth. In September Edward issued an ordinance for governing Scotland as a land of the English crown.: En 1303, Edward marcha vers l’est jusqu’à Moray et hiverna à Dunfermline, et en février 1304, Comyn et la plupart des dirigeants écossais se présentèrent. Le château de Stirling s’arrêta pendant trois mois contre le plus grand train de siège que Edward pouvait rassembler, y compris un trebuchet géant appelé le Loup de guerre, qu’il insista pour essayer après que la garnison eut offert de se rendre. Wallace refusa de se soumettre. Traduit près de Glasgow en août 1305, il est emmené à Londres, jugé pour trahison et le 23 août pendu, tiré et cantonné à Smithfield ; ses membres sont exposés à Newcastle, Berwick, Stirling et Perth. En septembre Edward a publié une ordonnance pour gouverner l’Écosse comme un pays de la couronne anglaise.
