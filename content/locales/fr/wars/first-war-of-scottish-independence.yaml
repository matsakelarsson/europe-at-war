1306–1309: 1306–1309
On 10 February 1306 Robert Bruce met John Comyn in the church of the Greyfriars at Dumfries and killed him, probably in a quarrel rather than by plan. With nothing left to lose, Bruce had himself crowned at Scone on 25 March. Edward I, now old and ill, ordered that no mercy be shown. On 19 June Aymer de Valence surprised Bruce’s army in its camp at Methven, and in the west John MacDougall of Lorne, a kinsman of Comyn, beat him again at Dalrigh. Bruce became a fugitive, probably in the Hebrides or Ireland. Three of his brothers were executed, and his sister Mary and Isabella, Countess of Buchan, who had crowned him, were kept in cages at Roxburgh and Berwick.: Le 10 février 1306, Robert Bruce rencontra John Comyn dans l’église des Greyfriars à Dumfries et le tua probablement dans une querelle plutôt que par plan. Avec rien à perdre, Bruce se fit couronner à Scone le 25 mars. Edward Ier, maintenant vieux et malade, ordonna qu’aucune miséricorde ne soit manifestée. Le 19 juin, Aymer de Valence surprit l’armée de Bruce dans son camp à Methven et, à l’ouest, John MacDougall de Lorne, un parent de Comyn, le battit à nouveau à Dalrigh. Bruce devint fugitif, probablement aux Hébrides ou en Irlande. Trois de ses frères furent exécutés, et sa sœur Marie et Isabella, comtesse de Buchan, qui l’avait couronné, furent gardées dans des cages à Roxburgh et Berwick.
In February 1307 Bruce landed in his own earldom of Carrick and fought a guerrilla war in the hills of the south-west. He ambushed an English force at Glen Trool in April and on 10 May beat Valence at Loudoun Hill. Edward I set out north once more but died at Burgh by Sands on the Solway on 7 July 1307, and his son Edward II soon went home. Bruce turned on his Scottish enemies, defeating the Earl of Buchan near Inverurie on 23 May 1308 and laying waste his lands, the “harrying of Buchan”, and then breaking the MacDougalls in Argyll. In 1309 he held his first parliament, at St Andrews.: En février 1307, Bruce débarqua dans son propre royaume de Carrick et mena une guérilla dans les collines du sud-ouest. Il embusqua une force anglaise à Glen Trol en avril et le 10 mai battit Valence à Loudoun Hill. Edward Ier partit une fois de plus vers le nord mais mourut à Burgh par Sands sur la Solway le 7 juillet 1307, et son fils Edward II rentra bientôt chez lui. Bruce se tourna vers ses ennemis écossais, battant le comte de Buchan près d’Inverurie le 23 mai 1308 et jetant ses terres, la chasse à Buchan, puis brisant les MacDougalls à Argyll. En 1309, il tenait son premier parlement, à St Andrews.
