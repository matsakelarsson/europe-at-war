Berwick, Dunbar and the conquest: Berwick, Dunbar et la conquête
1286–1296: 1286–1296
When Alexander III died in 1286 and his granddaughter and heir Margaret, the Maid of Norway, died in 1290, thirteen claimants came forward for the Scottish crown. Edward I of England, asked to judge between them, first made them accept him as overlord, and in 1292 he chose John Balliol. Edward then treated Scotland as a dependency, hearing appeals against Scottish courts and demanding Scottish service in his war with France. In 1295 the Scots took the government out of Balliol’s hands, gave it to a council of twelve and made an alliance with Philip IV of France, the beginning of what was later called the Auld Alliance.: A la mort d’Alexandre III en 1286 et de sa petite-fille et héritier Margaret, la maitre de Norvège, en 1290, treize demandeurs se présentèrent pour la couronne écossaise. Edward Ier, d’Angleterre, demanda à juger entre eux, les fit d’abord accepter comme surlord, et en 1292 il choisit John Balliol. Edward traita ensuite l’Écosse comme une dépendance, entendit des appels contre les tribunaux écossais et réclamait le service écossais dans sa guerre avec la France. En 1295, les Écossais prirent le gouvernement des mains de Balliol, le donnèrent à un conseil de douze et firent alliance avec Philippe IV de France, début de ce qu’on appela plus tard l’Alliance Auld.
Edward invaded in March 1296. On 30 March his army stormed Berwick, then Scotland’s richest town, and killed a large part of its people; chroniclers’ figures run into thousands. On 27 April the Earl of Surrey routed the Scottish army near Dunbar, and the castles of Roxburgh, Edinburgh and Stirling soon surrendered. In July Balliol submitted at Stracathro near Montrose and gave up his kingdom; the royal arms were torn from his surcoat, which earned him the nickname Toom Tabard, “empty coat”. Edward marched as far as Elgin, sent the Stone of Scone, on which Scottish kings were inaugurated, to Westminster, and at Berwick in August took oaths of fealty from the Scottish landholders, recorded in the Ragman Roll.: Edward envahit en mars 1296. Le 30 mars, son armée s’empare de Berwick, alors ville la plus riche d’Écosse, et tue une grande partie de sa population ; les chroniqueurs se précipitent en milliers. Le 27 avril, le comte de Surrey dirigea l’armée écossaise près de Dunbar, et les châteaux de Roxburgh, Edimbourg et Stirling se rendirent bientôt. En juillet, Balliol se présenta à Stracathro près de Montrose et abandonna son royaume ; les bras royaux furent arrachés de son surpoil, qui lui valut le surnom de Toom Tabard, manteau vide. Edward marcha jusqu’à Elgin, envoya la Pierre de Scone, sur laquelle des rois écossais furent inaugurés, à Westminster, et, en août, à Berwick, il fit prêter serment de fée aux propriétaires fonciers écossais, enregistrés dans le Ragman Roll.
