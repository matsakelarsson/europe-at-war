# Some French text was translated automatically.
"First War of Villmergen": "Première guerre de Villmergen"
"A short war between the Protestant cantons of Zürich and Bern and the five Catholic cantons of central Switzerland, set off when Schwyz executed four Protestants from Arth whose fellow believers had fled to Zürich in 1655. Zürich and Bern declared war on 6 January 1656, hoping to overturn the Catholic advantage written into the Second Peace of Kappel of 1531. Zürich’s army under Hans Rudolf Werdmüller laid siege to Rapperswil, but on 24 January Lucerne and Zug troops under Christoph Pfyffer surprised and routed the Bernese army of Sigmund von Erlach at Villmergen in the Freie Ämter. After Werdmüller’s assault on Rapperswil failed on 3 February, Bern and then Zürich sought peace, and the Third Peace of Baden on 7 March 1656 restored the old order, confirming each canton’s right to decide its own religion.": "Une courte guerre entre les cantons protestants de Zurich et Berne et les cinq cantons catholiques de Suisse centrale a éclaté lorsque Schwyz a exécuté quatre protestants d’Arth dont les compagnons croyants avaient fui vers Zurich en 1655. Zürich et Bern ont déclaré la guerre le 6 janvier 1656, espérant renverser l’avantage catholique écrit dans la Deuxième Paix de Kappel de 1531. L’armée de Zürich sous Hans Rudolf Werdmüller assiégea Rapperswil, mais le 24 janvier Lucerne et les troupes de Zug sous Christoph Pfyffer surprirent l’armée bernoise de Sigmund von Erlach à Villmergen dans la Freie Ämter. Après que l’assaut de Werdmüller sur Rapperswil eut échoué le 3 février, Bern et Zürich cherchèrent la paix, et la Troisième Paix de Baden, le 7 mars 1656, rétablit l’ordre ancien, confirmant ainsi le droit de chaque canton de décider sa propre religion."
"Fribourg and Solothurn stayed neutral, and Schaffhausen sent troops to defend Zürich but took no part in the fighting.": "Fribourg et Soleure restent neutres, Schaffhausen envoie des troupes pour défendre Zürich mais ne prennent pas part aux combats."
"Bern and Zürich used the Julian calendar until 1701, ten days behind the Gregorian calendar of the Catholic cantons; dates here follow the Historical Dictionary of Switzerland.": "Bern et Zürich ont utilisé le calendrier julien jusqu’en 1701, dix jours derrière le calendrier grégorien des cantons catholiques ; les dates ici suivent le dictionnaire historique de la Suisse."
