"Italy, allied with Germany and Austria-Hungary before the war, stayed neutral in 1914. By the secret Treaty of London of 26 April 1915 Britain, France and Russia promised it Trentino, South Tyrol up to the Brenner, Trieste, Istria and much of Dalmatia, and on 23 May Italy declared war on Austria-Hungary. Its chief of staff, General Luigi Cadorna, attacked eastwards across the Isonzo towards Gorizia and Trieste. The Austro-Hungarians held the mountains and the bare limestone plateau of the Karst, and in four battles in 1915 the Italians gained little ground at a heavy cost.": "L’Italie, alliée à l’Allemagne et à l’Autriche-Hongrie avant la guerre, est restée neutre en 1914. Par le traité secret de Londres du 26 avril 1915, la Grande-Bretagne, la France et la Russie lui ont promis Trentino, Tyrol du Sud jusqu’au Brenner, Trieste, Istrie et une grande partie de Dalmatie, et le 23 mai Italie a déclaré la guerre à l’Autriche-Hongrie. Son chef d’état-major, le général Luigi Cadorna, attaqua vers l’est à travers l’Isonzo en direction de Gorizia et Trieste. Les Austro-hongrois tenaient les montagnes et le plateau calcaire nu du Karst, et dans quatre batailles en 1915 les Italiens gagnaient peu de terrain à un coût lourd."
"In May 1916 the Austro-Hungarian chief of staff, Franz Conrad von Hötzendorf, struck from Trentino across the Asiago plateau to cut off the Italian armies in the east. His offensive took Asiago by 28 May, but Italian reserves stopped it short of the plain, and the Russian Brusilov offensive forced him to send troops east. In August the Italians took Gorizia in the sixth battle of the Isonzo, and Italy declared war on Germany. Five more battles followed; in the eleventh, in August and September 1917, the Italians took most of the Bainsizza plateau. The battles had cost hundreds of thousands of lives on each side, and the Austro-Hungarian army was near breaking point.": "En mai 1916, le chef d’état-major austro-hongrois, Franz Conrad von Hötzendorf, frappe de Trentino à travers le plateau Asiago pour couper les armées italiennes à l’est. Son offensive prend Asiago le 28 mai, mais les réserves italiennes l’arrêtent en dehors de la plaine, et l’offensive russe Brusilov le force à envoyer des troupes à l’est. En août, les Italiens prirent Gorizia dans la sixième bataille de l’Isonzo, et l’Italie déclara la guerre à l’Allemagne. Cinq autres batailles suivirent ; au onzième, en août et septembre 1917, les Italiens prirent la plus grande partie du plateau de Bainsizza. Les batailles avaient coûté des centaines de milliers de vies de chaque côté, et l’armée austro-hongroise était proche d’un point de rupture."
