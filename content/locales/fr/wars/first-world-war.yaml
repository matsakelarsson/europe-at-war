"In September 1915 Bulgaria, promised Serbian Macedonia, joined the Central Powers. On 6 October German and Austro-Hungarian armies under August von Mackensen crossed the Danube and the Sava, and Belgrade fell on 9 October after fierce street fighting. On 14 October the Bulgarian army attacked from the east, cutting the railway to Salonika and taking Skopje on 22 October and Niš on 5 November. At the invitation of the Greek prime minister, Eleftherios Venizelos, French and British troops had begun landing at Salonika on 5 October, but King Constantine forced him to resign and Greece stayed neutral. The Anglo-French force that advanced up the Vardar was too late to help, and in December the Bulgarians pushed it back into Greece.": "En septembre 1915, la Bulgarie, promise à la Macédoine serbe, a rejoint les puissances centrales. Le 6 octobre, les armées allemandes et austro-hongroise sous August von Mackensen ont traversé le Danube et la Sava, et Belgrade est tombée le 9 octobre après de violents combats de rue. Sur l’invitation du Premier ministre grec, Eleftherios Venizelos, les troupes françaises et britanniques avaient commencé à atterrir à Salonika le 5 octobre, mais le roi Constantin l’a forcé à démissionner et la Grèce est restée neutre. La force anglo-française qui a avancé le Vardar était trop tard pour aider, et en décembre les Bulgares ont repoussé le retour en Grèce."
"Rather than surrender, the Serbian army, the old King Peter and the government set out on 25 November across the snow-covered mountains of Montenegro and Albania to the Adriatic, with civilians and Austro-Hungarian prisoners. Frost, hunger, disease and attacks by Albanian irregulars killed tens of thousands on the way and after they reached the coast. From January 1916 Italian, French and British ships carried more than 250,000 people from the Albanian ports, the soldiers mostly to Corfu; rebuilt there, the army returned to fight on the Salonika front. Austria-Hungary overran Montenegro in January, when King Nicholas went into exile, and occupied northern and central Albania, while Bulgaria took Macedonia and eastern Serbia.": "Au lieu de se rendre, l’armée serbe, le vieux roi Pierre et le gouvernement ont traversé le 25 novembre les montagnes enneigées du Monténégro et de l’Albanie vers l’Adriatique, avec des civils et des prisonniers austro-hongrois. À partir de janvier 1916, des navires italiens, français et britanniques transportaient plus de 250 000 personnes depuis les ports albanais, les soldats principalement à Corfou ; reconstruits là, l’armée retourna combattre sur le front de Salonika. L’Autriche-Hongrie a envahi le Monténégro en janvier, lorsque le roi Nicholas est entré en exil, et occupé le nord et le centre de l’Albanie, tandis que la Bulgarie prenait la Macédoine et l’est de la Serbie."
