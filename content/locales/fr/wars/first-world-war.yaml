"Passchendaele": "Passchendaele"
"Haig’s offensive east of Ypres took the ridge after months of fighting in shell-torn mud. The ground was given up again in April 1918.": "L’offensive des Haigs à l’est d’Ypres prit la crête après des mois de combats dans la boue couverte d’obus. Le sol fut de nouveau abandonné en avril 1918."
"Cambrai": "Cambrai"
"20 November – 7 December 1917": "20 novembre – 7 décembre 1917"
"Massed British tanks broke into the Hindenburg Line; German counter-attacks with new infiltration tactics retook most of the ground.": "Des chars britanniques massifs se sont introduits dans la ligne Hindenburg ; des contre-attaques allemandes avec de nouvelles tactiques d’infiltration ont repris la majeure partie du sol."
"Withdrawal to the Hindenburg Line": "Retrait vers la ligne Hindenburg"
"Nivelle": "Nivelle"
"Byng": "En arrière"
"Front before the German withdrawal, February 1917": "Front avant le retrait allemand, février 1917"
"Front, December 1917": "Front, décembre 1917"
"Caporetto and the Piave": "Caporetto et Piave"
"October 1917 – June 1918": "octobre 1917 – juin 1918"
"In the autumn of 1917 Germany sent divisions to help the hard-pressed Austro-Hungarians on the Isonzo. On 24 October the new Fourteenth Army under General Otto von Below attacked in the upper Isonzo valley around Caporetto, today’s Kobarid, after a short bombardment with gas and high explosive, and its storm troops pushed along the valleys behind the Italian positions. Among them was Lieutenant Erwin Rommel, whose company took Monte Matajur. The Italian Second Army collapsed. Cadorna ordered a retreat to the Tagliamento and then to the Piave, which the armies reached by 10 November, abandoning Udine, all of Friuli and much of the Veneto.": "À l’automne 1917, l’Allemagne envoya des divisions pour aider les Austro-hongrois au bord de l’Isonzo. Le 24 octobre, la nouvelle Quatorzième Armée sous le général Otto von Below attaqua dans la haute vallée d’Isonzo autour de Caporetto, aujourd'hui Kobarid, après un court bombardement de gaz et d’explosifs, et ses troupes de tempête poussèrent le long des vallées derrière les positions italiennes. Parmi eux se trouvait le lieutenant Erwin Rommel, dont la compagnie a pris Monte Matajur. La deuxième armée italienne s’est effondrée. Cadorna a ordonné une retraite au Tagliamento puis au Piave, que les armées ont atteint le 10 novembre, abandonnant Udine, tout le Frioul et une grande partie de la Vénétie."
"Italy lost some 13,000 killed, 30,000 wounded and 265,000–275,000 taken prisoner, and hundreds of thousands of soldiers and civilians fled west. General Armando Diaz replaced Cadorna, British and French divisions arrived, and at Rapallo the Allies set up a Supreme War Council. The new line on the Piave and Monte Grappa held through November and December. In June 1918 Austria-Hungary attacked across the Piave and on the Asiago plateau in its last great offensive, but in eight days of fighting the Italians and their allies drove it back across the river with heavy losses.": "L’Italie a perdu environ 13 000 morts, 30 000 blessés et 260 000 à 275 000 prisonniers, et des centaines de milliers de soldats et de civils ont fui vers l’ouest. Le général Armando Diaz a remplacé Cadorna, les divisions britanniques et françaises sont arrivées, et à Rapallo les Alliés ont mis en place un Conseil suprême de guerre. En juin 1918, l’Autriche et la Hongrie attaquèrent à travers le Piave et sur le plateau Asiago lors de sa dernière grande offensive, mais en huit jours de combats les Italiens et leurs alliés l’ont ramené à travers le fleuve avec de lourdes pertes."
"Battle of Caporetto": "Bataille de Caporetto"
"24 October – 19 November 1917": "24 octobre – 19 novembre 1917"
"Italian prisoners": "Prisonniers italiens"
"about 265,000–275,000": "environ 260 000 à 275 000"
