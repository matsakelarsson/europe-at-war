"Monte Grappa": "Monte Grappa"
"November – December 1917": "novembre – décembre 1917"
"Italian troops held the massif between the Brenta and the Piave, the hinge of the new line, against repeated attacks.": "Les troupes italiennes ont tenu le massif entre la Brenta et la Piave, la charnière de la nouvelle ligne, contre des attaques répétées."
"15–23 June 1918": "15–23 juin 1918"
