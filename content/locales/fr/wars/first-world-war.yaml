"Gallipoli": "Callipoli"
"February 1915 – January 1916": "février 1915 – janvier 1916"
"To open the straits to Russia and knock the Ottoman Empire out of the war, Britain and France tried to force the Dardanelles. Their warships began bombarding the forts at the entrance on 19 February 1915, and on 18 March the battleships attacked the Narrows in force. A line of mines laid ten days earlier sank the French Bouvet and the British Irresistible and Ocean and crippled others, and the fleet withdrew. The Allies decided to land an army on the Gallipoli peninsula instead. On 25 April British troops landed at Cape Helles and the Australian and New Zealand Army Corps further north, at what became Anzac Cove, while the French made a diversion at Kum Kale on the Asian shore.": "Pour ouvrir le détroit à la Russie et faire sortir l’Empire ottoman de la guerre, la Grande-Bretagne et la France tentèrent de forcer les Dardanelles. Leurs navires de guerre commencèrent à bombarder les forts à l’entrée le 19 février 1915 et, le 18 mars, ils attaquèrent les Narrows en vigueur. Une ligne de mines posée dix jours plus tôt a coulé le Bouvet français et l’Irresistible britannique et l’océan et a paralysé d’autres, et la flotte s’est retirée. Les Alliés ont décidé d’atterrir une armée sur la péninsule Gallipoli à la place. Le 25 avril, les troupes britanniques débarquèrent au cap Helles et dans le Corps de l’armée australienne et néo-zélandaise plus au nord, à ce qui devint Anzac Cove, tandis que les Français firent une diversion à Kum Kale sur la côte asiatique."
"Ottoman troops, among them a division under Lieutenant-Colonel Mustafa Kemal, held the heights above the beaches, and the fighting sank into trench warfare amid heat, flies and dysentery. In August a new landing at Suvla Bay and an offensive on the Sari Bair ridge briefly reached the summit of Chunuk Bair but failed. In December the Allies decided to leave, and they evacuated Anzac and Suvla by 20 December and Helles by 9 January 1916 almost without loss. Each side lost some 250,000–300,000 men killed, wounded, captured or sick, with perhaps 43,000–61,000 Allied and 57,000–87,000 Ottoman dead. The campaign became a founding story of national identity in Australia, New Zealand and Turkey.": "Les troupes ottomanes, parmi lesquelles une division sous le lieutenant-colonel Mustafa Kemal, tenaient les hauteurs au-dessus des plages, et les combats s’enfonçaient dans la guerre des tranchées au milieu de la chaleur, des mouches et de la dysenterie. En décembre, les Alliés décidèrent de partir, et ils évacuèrent Anzac et Suvla le 20 décembre et Helles le 9 janvier 1916 presque sans perte. Chaque camp perdit entre 250 000 et 300 000 hommes tués, blessés, capturés ou malades, avec peut-être 43 000 et 61 000 alliés et 57 000 et 87 000 morts ottomans."
"Naval attack on the Narrows": "Attaque navale contre les Narrows"
"18 March 1915, three Allied battleships sunk": "18 mars 1915, trois navires de combat alliés coulés"
"Landings": "Débarquements"
"25 April 1915": "25 avril 1915"
"Evacuation completed": "Évacuation terminée"
