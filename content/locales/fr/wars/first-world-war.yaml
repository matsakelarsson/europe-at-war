"French success": "Le succès français"
"The Brusilov offensive": "L’offensive de Brusilov"
"March – September 1916": "mars – septembre 1916"
"In March 1916 a Russian offensive at Lake Naroch, launched to relieve the French at Verdun, failed with heavy losses. In the south-west General Aleksei Brusilov prepared a different kind of attack, striking on a wide front after short bombardments so that the enemy could not tell where the main blow would fall. On 4 June his four armies broke the Austro-Hungarian lines. Lutsk fell within days, and in the south the Russians took Chernivtsi and most of Bukovina and advanced to the Carpathians.": "En mars 1916, une offensive russe au lac Naroch, lancée pour soulager les Français à Verdun, échoue avec de lourdes pertes. Dans le sud-ouest du général Aleksei Brusilov prépare un autre type d’attaque, frappant sur un large front après de courts bombardements afin que l’ennemi ne puisse pas dire où le coup principal tomberait. Lutsk tomba quelques jours plus tard, et dans le sud les Russes prirent Chernivtsi et la plupart de Bukovina et avançaient vers les Carpates."
"German reserves stopped the advance short of Kovel and Lemberg, and the offensive ended in late September. The Austro-Hungarian army lost hundreds of thousands of men, among them some 400,000 prisoners, and never fully recovered; Russian losses were also enormous and drained the army’s strength. The victory encouraged Romania to enter the war on the Entente side in August, but by December German, Austro-Hungarian, Bulgarian and Ottoman forces had taken Bucharest and most of the country.": "Les réserves allemandes stoppèrent l’avance à court de Kovel et Lemberg, et l’offensive se termina à la fin septembre. L’armée austro-hongroise perdit des centaines de milliers d’hommes, dont quelque 400 000 prisonniers, et ne s’en remettit jamais complètement ; les pertes russes furent également énormes et drainèrent les forces de l’armée. La victoire a encouragé la Roumanie à entrer dans la guerre du côté de l’Entente en août, mais en décembre les forces allemandes, austro-hongroises, bulgares et ottomanes ont pris Bucarest et la plupart du pays."
"Brusilov offensive": "Brusilov offensive"
