"First World War": "Première Guerre mondiale"
"A world war fought from 1914 to 1918 between the Entente powers, among them France, Britain, Russia, Italy and later the United States, and the Central Powers, Germany, Austria-Hungary, the Ottoman Empire and Bulgaria. It killed some nine to ten million soldiers and millions of civilians, and brought down the Russian, German, Austro-Hungarian and Ottoman empires. In the west the German invasion of Belgium and France was stopped on the Marne in 1914, and four years of trench warfare followed, at Ypres, Verdun, the Somme and Passchendaele, until the Allied offensives of 1918 forced Germany to sign the armistice of 11 November. The Treaty of Versailles and the other Paris peace treaties of 1919–1920 redrew the map of Europe.": "Entre 1914 et 1918, une guerre mondiale entre les puissances de l’Entente, dont la France, la Grande-Bretagne, la Russie, l’Italie et plus tard les États-Unis, et les puissances centrales, l’Allemagne, l’Autriche-Hongrie, l’Empire ottoman et la Bulgarie, tua entre neuf et dix millions de soldats et de civils, et fit tomber les empires russe, allemand, austro-hongrois et ottoman. À l’ouest, l’invasion allemande de la Belgique et de la France fut arrêtée sur la Marne en 1914, et quatre années de guerre des tranchées suivirent, à Ypres, Verdun, la Somme et Passchendaele, jusqu’à ce que les offensives alliées de 1918 obligent l’Allemagne à signer l’armistice du 11 novembre."
"The steps follow all the main fronts in date order: the Western Front and the war at sea, the Eastern and Caucasus fronts, Serbia and Salonika, Gallipoli, Italy, Romania, and Mesopotamia and Palestine. Each step is tagged with the countries it involves, so a country view shows only its own fronts.": "Les étapes suivent tous les principaux fronts dans l’ordre des dates : le Front occidental et la guerre en mer, les fronts de l’Est et du Caucase, la Serbie et Salonika, Gallipoli, l’Italie, la Roumanie, la Mésopotamie et la Palestine. Chaque étape est marquée avec les pays qu’elle implique, donc une vue de pays ne montre que ses propres fronts."
"Dates are New Style (Gregorian). Russia used the Julian calendar, 13 days behind, until February 1918, so its revolutions of 1917 are named after February and October although they took place in March and November by the Western calendar. Serbia, Montenegro, Romania and Greece also used the Julian calendar throughout the war, and Bulgaria until 1916; the Ottoman Empire used its own Rumi calendar.": "Les dates sont New Style (Gregorian). La Russie a utilisé le calendrier julien, 13 jours derrière, jusqu’en février 1918, de sorte que ses révolutions de 1917 sont nommées d’après Février et Octobre bien qu’elles aient eu lieu en Mars et Novembre par le calendrier occidental. Serbie, Monténégro, Roumanie et la Grèce ont également utilisé le calendrier julien tout au long de la guerre, et la Bulgarie jusqu’en 1916 ; l’Empire Ottoman a utilisé son propre calendrier Rumi."
"Numbers of dead, prisoners and refugees are estimates and vary widely between sources. Most genocide scholars and many states recognise the killing of the Armenians in 1915–1916 as genocide; the Turkish government rejects the term.": "Le nombre de morts, de prisonniers et de réfugiés est estimé et varie considérablement d’une source à l’autre. La plupart des chercheurs en génocide et de nombreux États reconnaissent le meurtre des Arméniens en 1915-1916 comme un génocide ; le gouvernement turc rejette ce terme."
"On the Western Front, places in Flanders are named in the forms used in most English accounts of the war, such as Ypres (Ieper), Passchendaele (Passendale) and Messines (Mesen).": "Sur le front occidental, des endroits en Flandre sont nommés dans les formes utilisées dans la plupart des récits anglais de la guerre, tels que Ypres (Ieper), Passchendaele (Passendale) et Messines (Mesen)."
"In the south and east, places are named as in most English accounts, with today’s names where they differ: Salonika is Thessaloniki, Monastir is Bitola, Caporetto is Kobarid, Turtucaia is Tutrakan and Constantinople is Istanbul.": "Dans le sud et l’est, les lieux sont nommés comme dans la plupart des comptes anglais, avec aujourd'hui les noms où ils diffèrent : Salonika est Thessalonique, Monastir est Bitola, Caporetto est Kobarid, Turtucaia est Tutrakan et Constantinople est Istanbul."
"The base map shows the borders recognised at the time. Occupied territory and the front lines are drawn as approximate areas from general accounts.": "La carte de base montre les frontières reconnues à l’époque. Le territoire occupé et les lignes de front sont tracés comme des zones approximatives à partir des comptes généraux."
