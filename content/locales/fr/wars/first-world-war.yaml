"Serbia, 1914: Cer and the Kolubara": "Serbie, 1914 : Cer et le Kolubara"
"August – December 1914": "août – décembre 1914"
"Austria-Hungary declared war on Serbia on 28 July 1914, a month after the assassination of Archduke Franz Ferdinand in Sarajevo, and its river monitors shelled Belgrade from the Danube. On 12 August General Oskar Potiorek’s armies crossed the Drina and the Sava into north-western Serbia, expecting a short punitive campaign. Marshal Radomir Putnik’s Serbian army, hardened by the Balkan Wars, met them around Mount Cer and in a week of fighting drove them back across the rivers by 24 August, the first Allied victory of the war. In the towns and villages of the Mačva, among them Šabac, Austro-Hungarian troops shot and hanged many civilians as alleged guerrillas.": "L’Autriche et la Hongrie ont déclaré la guerre à la Serbie le 28 juillet 1914, un mois après l’assassinat de l’archiduc Franz Ferdinand à Sarajevo, et ses moniteurs fluviales ont bombardé Belgrade depuis le Danube. Le 12 août, les armées du général Oskar Potiorek ont traversé la Drina et la Save dans le nord-ouest de la Serbie, en attendant une courte campagne punitive. L’armée serbe du maréchal Radomir Putnik, endurcie par les guerres balkaniques, les a rencontrés autour du mont Cer et, au cours d’une semaine de combats, ils ont traversé les rivières le 24 août, la première victoire alliée de la guerre."
"A second invasion in September won a foothold across the Drina after weeks of bloody fighting. A third, in November, pushed the exhausted Serbs, short of shells, back beyond the Kolubara, and on 2 December Austro-Hungarian troops entered Belgrade. The next day General Živojin Mišić’s First Army, with fresh ammunition, counter-attacked from the Suvobor heights. Within two weeks the Serbs had routed the invaders and retaken Belgrade on 15 December. The campaign cost Austria-Hungary some 270,000 men killed, wounded, captured or sick, and Serbia about 165,000. In the winter a typhus epidemic swept the country and killed tens of thousands of soldiers, civilians and prisoners.": "Une deuxième invasion, en septembre, a pris pied sur la Drina après des semaines de combats sanglants. Un troisième, en novembre, a poussé les Serbes épuisés, à court d’obus, de retour au-delà de la Kolubara, et le 2 décembre les troupes austro-hongroises sont entrées à Belgrade. Le lendemain général Živojin MišićS Première armée, avec des munitions fraîches, contre-attaquées des hauteurs de Suvobor. En deux semaines, les Serbes avaient chassé les envahisseurs et repris Belgrade le 15 décembre. La campagne a coûté à l’Autriche-Hongrie quelque 270 000 hommes tués, blessés, capturés ou malades, et à la Serbie environ 165 000. L’hiver, une épidémie de typhus a balayé le pays et tué des dizaines de milliers de soldats, civils et prisonniers."
