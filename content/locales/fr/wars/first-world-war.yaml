"On 28 June 1914 Gavrilo Princip, a young Bosnian Serb nationalist armed with the help of members of the Serbian secret society known as the Black Hand, shot dead Archduke Franz Ferdinand, the heir to the Austro-Hungarian throne, and his wife Sophie in Sarajevo. Assured of German support, Austria-Hungary sent Serbia an ultimatum on 23 July. Serbia accepted most of its demands but not all, and on 28 July Austria-Hungary declared war. Russia mobilised in support of Serbia, and Germany declared war on Russia on 1 August and on France, Russia’s ally, on 3 August.": "Le 28 juin 1914, Gavrilo Princip, un jeune nationaliste serbe de Bosnie armé avec l’aide de membres de la société secrète serbe connue sous le nom de Main noire, a abattu l’archiduc Franz Ferdinand, héritier du trône austro-hongrois, et sa femme Sophie à Sarajevo. Assuré d’un soutien allemand, l’Autriche-Hongrie a envoyé la Serbie un ultimatum le 23 juillet. La Serbie a accepté la plupart de ses revendications, mais pas toutes, et le 28 juillet l’Autriche-Hongrie a déclaré la guerre. La Russie s’est mobilisée pour soutenir la Serbie, et l’Allemagne a déclaré la guerre à la Russie le 1er août et à la France, Russie, allié, le 3 août."
"Germany’s war plan, drawn up under Alfred von Schlieffen and revised by Helmuth von Moltke, sent most of its army through Luxembourg and neutral Belgium, round the French border fortresses, to defeat France within weeks. Belgium refused free passage. When German troops crossed its border on 4 August, Britain, a guarantor of Belgian neutrality since 1839, declared war on Germany. The forts of Liège held out until 16 August, Brussels fell on 20 August, and the Belgian army withdrew to the fortress of Antwerp.": "Allemagne Le plan de guerre, élaboré sous Alfred von Schliefen et révisé par Helmuth von Moltke, envoya la majeure partie de son armée à travers le Luxembourg et la Belgique neutre, autour des forteresses frontalières françaises, pour vaincre la France en quelques semaines. La Belgique refusa le libre passage. Lorsque les troupes allemandes passèrent sa frontière le 4 août, la Grande-Bretagne, garante de la neutralité belge depuis 1839, déclara la guerre à l’Allemagne. Les forts de Liège se déroulèrent jusqu’au 16 août, Bruxelles tomba le 20 août et l’armée belge se retira à la forteresse d’Anvers."
"In the Battle of the Frontiers the French offensives in Lorraine and the Ardennes were thrown back with enormous losses; on 22 August alone some 27,000 French soldiers were killed. The French Fifth Army was beaten at Charleroi, the British Expeditionary Force fought a delaying action at Mons on 23 August, and both began a long retreat. Convinced that civilians were firing on them, German troops killed some 6,500 Belgian and French civilians between August and October, among them 674 at Dinant, and burned much of Leuven.": "Lors de la bataille des Frontières, les offensives françaises en Lorraine et dans les Ardennes ont été repoussées avec d’énormes pertes ; le 22 août seulement, quelque 27 000 soldats français ont été tués. La cinquième armée française a été battue à Charleroi, la Force expéditionnaire britannique a combattu une action retardée à Mons le 23 août, et les deux ont commencé une longue retraite. Convaincus que des civils tiraient sur eux, les troupes allemandes tuèrent quelque 6 500 civils belges et français entre août et octobre, dont 674 à Dinant, et brûlèrent une grande partie de Louvain."
