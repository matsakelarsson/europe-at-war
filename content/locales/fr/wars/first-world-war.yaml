"December 1915 – October 1918": "décembre 1915 – octobre 1918"
"An Anglo-Indian force had landed at the head of the Persian Gulf in November 1914 to protect Britain’s oil supplies and taken Basra. In 1915 General Charles Townshend’s division advanced up the Tigris towards Baghdad, but after a costly battle at Ctesiphon in November it fell back to Kut, where Ottoman forces besieged it from 7 December. Relief attempts failed, and on 29 April 1916 Townshend surrendered with about 13,000 British and Indian soldiers, many of whom died of heat, disease and neglect on the march into captivity and in the camps. A larger and better supplied army under General Stanley Maude advanced again in December 1916, retook Kut and entered Baghdad on 11 March 1917.": "Une force anglo-indienne avait débarqué à la tête du golfe Persique en novembre 1914 pour protéger les réserves de pétrole de la Grande-Bretagne et prendre Bassorah. En 1915, le général Charles Townshend avança la division Tigris vers Bagdad, mais après une bataille coûteuse à Ctesiphon en novembre, elle tomba à Kut, où les forces ottomanes l’assiégèrent à partir du 7 décembre. Les tentatives de secours échouèrent, et le 29 avril 1916, Townshend se rendit avec environ 13 000 soldats britanniques et indiens, dont beaucoup moururent de chaleur, de maladies et de négligence lors de la marche en captivité et dans les camps."
"In June 1916 Sharif Hussein of Mecca, promised British support for Arab independence, rose against Ottoman rule in the Hejaz. With British advisers such as T. E. Lawrence, the Arab forces of his son Faisal raided the Hejaz railway and took Aqaba in July 1917. Further west the British had beaten off an Ottoman attack on the Suez Canal in 1915 and crossed Sinai, but failed twice at Gaza in 1917. Under General Edmund Allenby they broke the Gaza–Beersheba line from 31 October, and on 9 December Jerusalem surrendered. Meanwhile Britain and France had secretly agreed, in the Sykes–Picot agreement of 1916, to divide the Arab lands between them, and the Balfour Declaration of November 1917 promised British support for a Jewish national home in Palestine.": "En juin 1916, Sharif Hussein de la Mecque, promettant le soutien britannique à l’indépendance arabe, s’élève contre la domination ottomane dans les Hejaz. Avec des conseillers britanniques tels que T. E. Lawrence, les forces arabes de son fils Faisal attaquent le chemin de fer Hejaz et prennent Aqaba en juillet 1917. Plus à l’ouest, les Britanniques ont battu une attaque ottomane sur le canal de Suez en 1915 et traversé le Sinaï, mais échouent deux fois à Gaza en 1917. Sous le commandement du général Edmund Allenby, ils ont brisé la ligne Gaza-Beersheba à partir du 31 octobre et le 9 décembre Jérusalem s’est rendu. Entre-temps, la Grande-Bretagne et la France avaient secrètement convenu, dans l’accord Sykes-Picot de 1916, de diviser les terres arabes entre elles, et la Déclaration Balfour de novembre 1917 promettait un soutien britannique pour une maison nationale juive en Palestine."
"On 19 September 1918, at Megiddo, Allenby’s infantry broke through on the coastal plain and his cavalry swept round behind the Ottoman armies, which collapsed. Australian and Arab troops entered Damascus on 1 October, and Aleppo fell later that month. War, blockade, requisitions and locusts also brought famine to Syria and Lebanon, where by some estimates about 200,000 people died of hunger and disease in Mount Lebanon alone.": "Le 19 septembre 1918 à Megiddo, l’infanterie d’Allenby perce dans la plaine côtière et sa cavalerie contourne les armées ottomanes, qui s’effondrent. Des troupes australiennes et arabes entrent dans Damas le 1er octobre, puis Alep tombe dans le courant du mois. La guerre, le blocus, les réquisitions et les invasions de criquets provoquent aussi une famine en Syrie et au Liban. Selon certaines estimations, environ 200 000 personnes meurent de faim ou de maladie dans le seul Mont-Liban."
