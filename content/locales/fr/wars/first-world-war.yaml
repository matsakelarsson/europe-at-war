"Romania, 1916–1918": "Roumanie, 1916-1918"
"August 1916 – May 1918": "août 1916 – mai 1918"
"Romania stayed neutral in 1914. Encouraged by the Brusilov offensive and promised Transylvania, Bukovina and the Banat by the Entente, it declared war on Austria-Hungary on 27 August 1916 and sent its armies over the Carpathians into Transylvania. The Central Powers answered quickly. Field Marshal August von Mackensen’s German, Bulgarian and Ottoman army invaded Dobruja from the south and stormed the Danube fortress of Turtucaia on 6 September, while Erich von Falkenhayn’s Ninth Army drove the Romanians out of Transylvania at Sibiu and Brașov. In November Falkenhayn forced the mountain passes and Mackensen crossed the Danube at Svishtov, and on 6 December, after a battle on the Argeș, they entered Bucharest.": "La Roumanie est restée neutre en 1914. Encouragée par l’offensive de Brusilov et promettant la Transylvanie, la Bukovina et le Banat par l’Entente, elle a déclaré la guerre à l’Autriche-Hongrie le 27 août 1916 et envoyé ses armées sur les Carpates en Transylvanie. L’armée allemande, bulgare et ottomane, le maréchal August von Mackensen, envahit Dobruja du sud et s’empare de la forteresse du Danube de Turtucaia le 6 septembre, tandis que la neuvième armée d’Erich von Falkenhayn, chassait les Roumains de Transylvanie à Sibiu et Brașov. En novembre, Falkenhayn a forcé les cols de montagne et Mackensen a traversé le Danube à Svishtov, et le 6 décembre, après une bataille sur l’Argeș, ils sont entrés à Bucarest."
"The king, the government and the remains of the army withdrew to Moldavia, where typhus and hunger killed many soldiers and refugees that winter, and with Russian help held a front along the Carpathians and the Siret. Rebuilt with French help, the army won at Mărăști in July 1917 and in August stopped Mackensen’s offensive at Mărășești. But Russia’s collapse left Romania alone, and it signed an armistice at Focșani on 9 December 1917. In April 1918 Bessarabia’s assembly voted to join Romania, and on 7 May Romania accepted the Treaty of Bucharest, which gave Dobruja to Bulgaria and the Central Powers, the mountain passes to Austria-Hungary and its oil to Germany on a 90-year lease. King Ferdinand refused to sign it, and Romania re-entered the war on 10 November 1918.": "Le roi, le gouvernement et les restes de l’armée se sont retirés en Moldavie, où typhus et la faim ont tué de nombreux soldats et réfugiés cet hiver-là, et avec l’aide russe a tenu un front le long des Carpates et du Siret. Reconstruite avec l’aide française, l’armée a gagné à Mărăști en juillet 1917 et en août a arrêté l’offensive Mackensen. Mais l’effondrement de la Russie a laissé la Roumanie seule, et elle a signé un armistice à Focșani le 9 décembre 1917. En avril 1918 l’assemblée de Bessarabia a voté pour rejoindre la Roumanie, et le 7 mai la Roumanie a accepté le traité de Bucarest, qui a donné Dobruja à la Bulgarie et aux puissances centrales, les passes de montagne à l’Autriche-Hongrie et son pétrole à l’Allemagne sur un bail de 90 ans. Le roi Ferdinand refusa de le signer, et la Roumanie rentra dans la guerre le 10 novembre 1918."
