"Minsk": "Minsk"
"21 February 1918": "21 février 1918"
"German troops entered the city without a fight. A Belarusian People’s Republic was declared there in March.": "Les troupes allemandes sont entrées dans la ville sans se battre. Une République populaire biélorusse a été déclarée là en mars."
"Kyiv": "Kyiv"
"1 March 1918": "1er mars 1918"
"Forces of the Ukrainian People’s Republic, backed by German troops, retook the city from the Bolsheviks.": "Les forces de la République populaire d’Ukraine, soutenues par les troupes allemandes, ont repris la ville des bolcheviks."
"German advance, February 1918": "Avance allemande, février 1918"
"Given up by Soviet Russia at Brest-Litovsk (approximate)": "Abandonné par la Russie soviétique à Brest-Litovsk (approximate)"
"Kars, Ardahan and Batumi, ceded to the Ottoman Empire": "Kars, Ardahan et Batumi, cédés à l’Empire ottoman"
"The German spring offensives": "Les offensives de printemps allemandes"
"March – July 1918": "mars – juillet 1918"
"Peace in the east let Germany bring dozens of divisions west, and Erich Ludendorff resolved to win before the Americans arrived in strength. On 21 March 1918 Operation Michael struck the British Fifth and Third Armies near Saint-Quentin after a five-hour bombardment by some 6,600 guns. Storm troops slipped through the fog-bound defences, and within two weeks the Germans had advanced up to 60 kilometres, the largest gains in the west since 1914. The Allies named Ferdinand Foch to coordinate their armies, and the advance was stopped before Amiens in early April.": "La paix dans l’est laisse l’Allemagne apporter des dizaines de divisions à l’ouest, et Erich Ludendorff résolut de gagner avant que les Américains arrivent en force. Le 21 mars 1918, l’opération Michael frappe les cinquième et troisième armées britanniques près de Saint-Quentin après un bombardement de cinq heures par quelque 6 600 canons. En deux semaines, les Allemands avaient progressé jusqu’à 60 kilomètres, les plus grands gains de l’ouest depuis 1914. Les Alliés nommèrent Ferdinand Foch pour coordonner leurs armées, et l’avance fut arrêtée avant Amiens au début d’avril."
"Further attacks followed on the Lys in Flanders in April, when Haig ordered his men to fight on “with our backs to the wall”, on the Chemin des Dames on 27 May, where the Germans broke through and reached the Marne at Château-Thierry, and on the Matz in June. American troops, arriving by the summer at some 10,000 a day, fought at Cantigny and Belleau Wood. Each offensive won ground but cost the Germans their best troops, and left them holding long, exposed salients. A last attack on both sides of Reims on 15 July crossed the Marne but was stopped within three days.": "D’autres attaques ont suivi sur le Lys en Flandre en avril, lorsque Haig a ordonné à ses hommes de se battre sur le dos au mur, sur le Chemin des Dames le 27 mai, où les Allemands ont traversé et atteint la Marne à Château-Thierry, et sur le Matz en juin. Les troupes américaines, arrivant l’été à environ 10 000 par jour, ont combattu à Cantigny et Belleau Wood. Chaque offensive a gagné du terrain mais a coûté aux Allemands leurs meilleures troupes, et les a laissés tenir longtemps, des saillants exposés. Une dernière attaque des deux côtés de Reims le 15 Juillet a traversé la Marne, mais a été arrêtée dans les trois jours."
"Operation Michael": "Opération Michael"
"21 March – 5 April 1918": "21 mars – 5 avril 1918"
"Germans reach the Marne": "Les Allemands atteignent la Marne"
"end of May 1918": "fin mai 1918"
"Last German offensive": "Dernière offensive allemande"
"15–17 July 1918, near Reims": "15-17 juillet 1918, près de Reims"
"Saint-Quentin": "Saint-Quentin"
"21 March 1918": "21 mars 1918"
"The main blow fell on the British Fifth Army. By 5 April more than 75,000 British soldiers had been taken prisoner.": "Au 5 avril, plus de 75 000 soldats britanniques avaient été faits prisonniers."
"Villers-Bretonneux": "Villers-Bretonneux"
"4–25 April 1918": "4–25 avril 1918"
"The Germans were stopped here in early April, and took the town on 24 April in the first battle between tanks; Australian and British troops retook it the next night.": "Les Allemands ont été arrêtés ici début avril, et ont pris la ville le 24 avril dans la première bataille entre les chars ; les troupes australiennes et britanniques l’ont repris la nuit suivante."
"Mont Kemmel": "Mont Kemmel"
"25 April 1918": "25 avril 1918"
"German troops took the hill from its French defenders during the Lys offensive, but could not exploit the success.": "Les troupes allemandes ont pris la colline de ses défenseurs français pendant l’offensive de Lys, mais n’ont pas pu exploiter le succès."
"27 May 1918": "27 mai 1918"
"Operation Blücher broke through French and British divisions on the ridge and advanced about 50 kilometres in four days.": "L’opération Blücher a franchi les divisions françaises et britanniques sur la crête et a progressé d’environ 50 kilomètres en quatre jours."
"Belleau Wood": "Bois de Belleau"
"6–26 June 1918": "6–26 juin 1918"
"The US 2nd Division, with its Marine brigade, cleared the wood west of Château-Thierry in three weeks of fighting.": "La 2e Division des États-Unis, avec sa brigade marine, a défriché le bois à l’ouest de Château-Thierry en trois semaines de combats."
"23 March – August 1918": "23 mars – août 1918"
"Long-range guns firing from near Crépy, some 120 kilometres away, shelled the city. On 29 March a shell killed about 90 people in the church of Saint-Gervais.": "Le 29 mars, un obus a tué environ 90 personnes dans l’église Saint-Gervais."
"Dormans": "Dormans"
"15–17 July 1918": "15–17 juillet 1918"
"The last German offensive crossed the Marne here but was stopped south of the river; east of Reims, Henri Gouraud’s defence in depth defeated it on the first day.": "La dernière offensive allemande a traversé la Marne ici, mais a été arrêtée au sud de la rivière ; à l’est de Reims, Henri Gouraud est défensif en profondeur le premier jour."
"Marwitz": "Marwitz"
"Blücher": "Blücher"
"Occupied by Germany, mid-July 1918": "Occupé par l’Allemagne, mi-juillet 1918"
"Front, 21 March 1918": "Front, 21 mars 1918"
"Front, mid-July 1918": "Front, mi-juillet 1918"
"Allied success": "Succès allié"
"The Hundred Days and the Armistice": "Les cent jours et l’armistice"
"July – November 1918": "juillet – novembre 1918"
"On 18 July French and American divisions, led by tanks, struck the western flank of the German salient on the Marne near Soissons, and by early August the Germans had fallen back to the Vesle. On 8 August the British Fourth Army, with Canadian and Australian corps in the lead and some 500 tanks, attacked east of Amiens and advanced about eleven kilometres in a day, taking thousands of prisoners. Ludendorff called it “the black day of the German army”. Further Allied offensives followed, and on 12 September the American First Army under John J. Pershing cut off the Saint-Mihiel salient.": "Le 18 juillet, les divisions françaises et américaines, dirigées par des chars, frappent le flanc ouest du saillant allemand sur la Marne près de Soissons et, au début d’août, les Allemands retournent au Vesle. Le 8 août, la quatrième armée britannique, avec le corps canadien et australien en tête et quelque 500 chars, attaquent l’est d’Amiens et avancent environ onze kilomètres par jour, prenant des milliers de prisonniers. Ludendorff l’appela le jour noir de l’armée allemande. D’autres offensives alliées suivirent, et le 12 septembre, la Première Armée américaine sous John J. Pershing coupa le saillant Saint-Mihiel."
"In late September the Allies attacked from Flanders to the Meuse. Americans and French advanced in the Meuse–Argonne; British, Australian and American divisions crossed the Saint-Quentin canal, where the Hindenburg Line was broken on 29 September; and Belgian, British and French forces attacked in Flanders. The same day Bulgaria signed an armistice, and Ludendorff told the Kaiser that Germany must seek peace. A new government under Prince Max of Baden asked President Woodrow Wilson for an armistice on 4 October. The German army fell back fighting, and Ludendorff resigned on 26 October.": "Fin septembre, les Alliés attaquent de Flandre à la Meuse. Les Américains et les Français avancent dans la Meuse-Argonne ; les divisions britanniques, australiennes et américaines traversent le canal Saint-Quentin, où la ligne Hindenburg est brisée le 29 septembre ; et les forces belges, britanniques et françaises attaquent en Flandre. Un nouveau gouvernement sous le prince Max de Baden a demandé au président Woodrow Wilson un armistice le 4 octobre. L’armée allemande est tombée aux combats, et Ludendorff a démissionné le 26 octobre."
"Mutiny and revolution spread through Germany in early November, and on 9 November William II’s abdication was announced. Early on 11 November German delegates signed the armistice in Foch’s railway carriage in the forest of Compiègne, and the guns fell silent at 11 a.m. Germany had to leave occupied France, Belgium, Luxembourg and Alsace-Lorraine within 15 days, give up its submarines and much of its weaponry, have its main fleet interned and accept Allied occupation of the Rhineland, while the blockade went on until peace was signed.": "La mutinerie et la révolution se répandirent à travers l’Allemagne au début du mois de novembre, et l’abdication de Guillaume II fut annoncée le 9 novembre. L’Allemagne a dû quitter la France occupée, la Belgique, le Luxembourg et l’Alsace-Lorraine dans les 15 jours, abandonner ses sous-marins et une grande partie de ses armes, avoir sa flotte principale internée et accepter l’occupation alliée de la Rhénanie, tandis que le blocus s’est poursuivi jusqu’à la signature de la paix."
"Battle of Amiens": "Bataille d’Amiens"
