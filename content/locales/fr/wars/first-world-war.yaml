"The Marne and the race to the sea": "La Marne et la course à la mer"
"September – November 1914": "septembre – novembre 1914"
"The French and British armies fell back for two weeks, and on 2 September the French government left Paris for Bordeaux. But the German right wing was overstretched, and Alexander von Kluck’s First Army turned south-east to pass east of Paris, exposing its flank to a new French army gathered in the capital. On 5 September the French commander-in-chief, Joseph Joffre, attacked along the whole line, and some reinforcements reached the front in Paris taxis. When the British advanced into a gap between the German First and Second Armies, the Germans withdrew on 9 September to the heights north of the Aisne.": "Les armées française et britannique sont revenues pendant deux semaines, et le 2 septembre le gouvernement français a quitté Paris pour Bordeaux. Mais l’aile droite allemande était trop tendue, et la première armée d’Alexandre von Kluck arriva au sud-est pour passer à l’est de Paris, exposant son flanc à une nouvelle armée française rassemblée dans la capitale. Le 5 septembre, le commandant en chef français, Joseph Joffre, attaqua toute la ligne et quelques renforts atteignirent le front dans les taxis de Paris. Lorsque les Britanniques avançaient dans un fossé entre la première armée allemande et la seconde armée, les Allemands se retiraient le 9 septembre aux hauteurs au nord de l’Aisne."
"Moltke was replaced by Erich von Falkenhayn. Each side then tried to outflank the other to the north, in what became known as the race to the sea. Antwerp fell on 10 October, and the Belgian army held the last corner of its country on the Yser by flooding the land in front of it. At Ypres, British, French and Belgian troops beat off German attacks from 19 October to 22 November. By the end of the year a line of trenches ran from the North Sea to Switzerland, and Germany held most of Belgium and ten French departments, with much of France’s coal and heavy industry.": "Moltke a été remplacé par Erich von Falkenhayn. Chaque partie a ensuite essayé de déferler l’autre au nord, dans ce qui est devenu connu comme la course à la mer. Anvers est tombé le 10 octobre, et l’armée belge a tenu le dernier coin de son pays sur l’Yser en inondant la terre devant elle. À Ypres, les troupes britanniques, françaises et belges ont battu les attaques allemandes du 19 octobre au 22 novembre. A la fin de l’année, une ligne de tranchées s’étendait de la mer du Nord à la Suisse et l’Allemagne détenait la plus grande partie de la Belgique et dix départements français, avec une grande partie de la France charbonnière et de l’industrie lourde."
"First Battle of the Marne": "Première bataille de la Marne"
"5–12 September 1914, French and British victory": "5-12 septembre 1914, victoire française et britannique"
"Antwerp surrenders": "Remises d’Anvers"
"10 October 1914": "10 octobre 1914"
"First Battle of Ypres": "Première bataille d’Ypres"
"19 October – 22 November 1914": "19 octobre – 22 novembre 1914"
"5–12 September 1914": "5–12 septembre 1914"
"Joffre’s counter-offensive between Paris and Verdun ended the German advance and forced a retreat of some 60 kilometres to the Aisne.": "La contre-offensive de Joffres entre Paris et Verdun a mis fin à l’avancée allemande et contraint une soixantaine de kilomètres vers l’Aisne."
"Paris": "Paris"
"September 1914": "septembre 1914"
"The government left for Bordeaux on 2 September. The military governor, Joseph Gallieni, sent troops to the Ourcq, some of them in requisitioned taxis.": "Le gouvernement partit pour Bordeaux le 2 septembre. Le gouverneur militaire, Joseph Gallieni, envoya des troupes à l’Ourcq, dont certaines dans des taxis réquisitionnés."
"First Battle of the Aisne": "Première bataille de l’Aisne"
"13–28 September 1914": "13–28 septembre 1914"
"The Germans dug in on the Chemin des Dames ridge and held it against French and British attacks, the start of trench warfare.": "Les Allemands ont creusé sur la crête du Chemin des Dames et l’ont tenue contre les attaques françaises et britanniques, le début de la guerre des tranchées."
"Antwerp": "Anvers"
"28 September – 10 October 1914": "28 septembre – 10 octobre 1914"
"German siege guns broke the forts. Most of the Belgian army escaped west along the coast, but thousands of Belgian and British troops crossed into the neutral Netherlands and were interned.": "L’armée belge s’est échappée le long de la côte, mais des milliers de troupes belges et britanniques ont traversé les Pays-Bas neutres et ont été internées."
"Battle of the Yser": "Bataille de l’Yser"
"16–31 October 1914": "16–31 octobre 1914"
"The Belgian army held the river line. From 27 October sluices at Nieuwpoort were opened to flood the land between the Yser and the railway embankment.": "À partir du 27 octobre, des écluses à Nieuwpoort furent ouvertes pour inonder la terre entre l’Yser et le remblai de chemin de fer."
"The Allies held the town in a salient after weeks of fighting. Many of the German dead were young wartime volunteers, among them students, who fell in attacks near Langemarck.": "Les Alliés ont tenu la ville dans un saillant après des semaines de combats. Beaucoup de morts allemands étaient de jeunes volontaires de guerre, parmi lesquels des étudiants, qui sont tombés dans des attaques près de Langemarck."
"Maunoury": "Maunoury"
"British Expeditionary Force": "Force expéditionnaire britannique"
"Withdrawal to the Aisne": "Retrait à l’Aisne"
"Occupied by Germany, end of 1914": "Occupé par l’Allemagne, fin 1914"
"Front, end of 1914": "Front, fin 1914"
"French and British moves": "Mouvements français et britanniques"
"Sarikamish and the Caucasus front": "Sarikamish et le front du Caucase"
"November 1914 – 1916": "novembre 1914 – 1916"
"The Ottoman Empire entered the war beside Germany in November 1914. Its war minister, Enver Pasha, led the Third Army through the snow-covered mountains to encircle the Russian army at Sarikamish. Many of his men lacked winter clothing, and about 25,000 are thought to have frozen to death before the main battle. Between 22 December 1914 and 17 January 1915 the Russians beat off the attack and destroyed most of the Ottoman force. Enver blamed the Armenians for the defeat.": "L’Empire ottoman entra dans la guerre aux côtés de l’Allemagne en novembre 1914. Son ministre de guerre, Enver Pacha, conduisit la troisième armée à travers les montagnes couvertes de neige pour encercler l’armée russe à Sarikamish. Beaucoup de ses hommes manquaient de vêtements d’hiver, et environ 25 000 auraient gelé avant la bataille principale. Enver a blâmé les Arméniens pour la défaite."
"From April 1915 the Ottoman government arrested Armenian leaders and deported the Armenian population of Anatolia towards the Syrian desert, with mass killings and death marches. Around a million Armenians died in what most historians and many states recognise as the Armenian genocide; the Turkish government rejects the term. Armenians in Van resisted until Russian troops arrived in May. In 1916 General Nikolai Yudenich’s army took Erzurum in February and Trabzon in April, and by the summer it held much of eastern Anatolia.": "A partir d’avril 1915, le gouvernement ottoman a arrêté les dirigeants arméniens et expulsé la population arménienne d’Anatolie vers le désert syrien, avec des massacres et des marches de mort. Environ un million d’Arméniens sont morts dans ce que la plupart des historiens et de nombreux États reconnaissent comme le génocide arménien ; le gouvernement turc rejette le terme. En 1916, l’armée du général Nikolai Yudenich emmenait Erzurum en février et Trabzon en avril, et l’été elle tenait une grande partie de l’Anatolie orientale."
"Battle of Sarikamish": "Bataille de Sarikamish"
"22 December 1914 – 17 January 1915, Russian victory": "22 décembre 1914 – 17 janvier 1915, victoire russe"
"Erzurum taken by Russia": "Erzurum pris par la Russie"
"16 February 1916": "16 février 1916"
"Armenian genocide": "Génocide arménien"
"1915–1916, around a million dead": "1915-1916, environ un million de morts"
"22 December 1914 – 17 January 1915": "22 décembre 1914 – 17 janvier 1915"
"The Ottoman Third Army was destroyed by Russian troops, cold and hunger.": "La troisième armée ottomane a été détruite par les troupes russes, le froid et la faim."
"Köprüköy": "Köprüköy"
"November 1914": "novembre 1914"
"An Ottoman counter-attack drove back the first Russian advance into Anatolia.": "Une contre-attaque ottomane a ramené la première avance russe en Anatolie."
"Van": "Vanne"
"April – May 1915": "avril – mai 1915"
"Armenians defended the city against Ottoman forces until Russian troops and Armenian volunteers relieved them.": "Les Arméniens ont défendu la ville contre les forces ottomanes jusqu’à ce que les troupes russes et les volontaires arméniens les soulagent."
"Erzurum": "Erzurum"
"Yudenich stormed the forts of the main Ottoman fortress in eastern Anatolia in winter.": "Yudenich s’empare des forts de la forteresse ottomane principale dans l’est de l’Anatolie en hiver."
"Trabzon": "Trabzon"
"18 April 1916": "18 avril 1916"
"The Black Sea port fell to Russian troops supported by landings from the sea.": "Le port de la mer Noire est tombé sur les troupes russes soutenues par des débarquements depuis la mer."
"Enver Pasha": "Enver Pacha"
"Yudenich, 1916": "Yudenich, 1916"
