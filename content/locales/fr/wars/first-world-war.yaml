"July – October 1916": "juillet – octobre 1916"
"German and Austro-Hungarian troops held the railway junction against repeated Russian attacks, including the Russian Guard.": "Les troupes allemandes et austro-hongroise ont maintenu la jonction ferroviaire contre les attaques répétées de la Russie, y compris la Garde russe."
"Brusilov": "Brusilov"
