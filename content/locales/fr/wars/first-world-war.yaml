"The blockade, Jutland and the U-boats": "Le blocus, le Jutland et les U-boats"
"1914–1917": "1914–1917"
"From the start of the war the Royal Navy blockaded Germany, closing the Channel and the northern exits of the North Sea and stopping food as well as war materials. Germany answered with submarines. In February 1915 it declared the waters around the British Isles a war zone in which merchant ships could be sunk without warning, and on 7 May a U-boat sank the British liner Lusitania off Ireland, killing nearly 1,200 people, among them 128 Americans. American protests led Germany to restrict its submarine campaign.": "Dès le début de la guerre, la Royal Navy a bloqué l’Allemagne, fermant la Manche et les sorties nord de la mer du Nord et arrêtant la nourriture ainsi que les matériaux de guerre. L’Allemagne a répondu avec des sous-marins. En février 1915, elle a déclaré les eaux autour des îles britanniques une zone de guerre dans laquelle les navires marchands pouvaient être coulés sans avertissement, et le 7 mai un U-boat a coulé le paquebot britannique Lusitania au large de l’Irlande, tuant près de 1 200 personnes, dont 128 Américains. Les protestations américaines ont conduit l’Allemagne à restreindre sa campagne sous-marine."
"The German High Seas Fleet, smaller than the British Grand Fleet, hoped to trap and destroy part of it. On 31 May and 1 June 1916 the two fleets met off Jutland in the largest naval battle of the war, with about 250 ships. The British lost 14 ships and over 6,000 men, the Germans 11 ships and some 2,500 men, and both sides claimed victory. But the High Seas Fleet returned to port and never again seriously challenged British control of the North Sea.": "Le 31 mai et le 1er juin 1916, les deux flottes se rencontrèrent au large de Jutland dans la plus grande bataille navale de la guerre, avec environ 250 navires. Les Britanniques perdirent 14 navires et plus de 6 000 hommes, les Allemands 11 navires et quelque 2 500 hommes, et les deux camps réclamèrent la victoire. Mais la flotte de la haute mer est revenue au port et n’a plus jamais sérieusement remis en question le contrôle britannique de la mer du Nord."
"As the blockade brought growing hunger in Germany, its leaders gambled that unrestricted submarine warfare could starve Britain into submission before American help could arrive. It began on 1 February 1917, and in April U-boats sank some 860,000 tons of shipping. Together with the Zimmermann telegram, in which Germany offered Mexico an alliance against the United States, the sinkings led the United States to declare war on Germany on 6 April 1917. Convoys, introduced from the summer, cut the losses sharply.": "Alors que le blocus entraînait une famine croissante en Allemagne, ses dirigeants jouèrent au risque d’affamer la Grande-Bretagne avant l’arrivée de l’aide américaine. Il commença le 1er février 1917 et, en avril, des sous-marins ont coulé quelque 860 000 tonnes de navires. Avec le télégramme Zimmermann, dans lequel l’Allemagne offrait au Mexique une alliance contre les États-Unis, les naufrages conduisirent les États-Unis à déclarer la guerre à l’Allemagne le 6 avril 1917. Les convois, introduits à partir de l’été, réduisent fortement les pertes."
"Sinking of the Lusitania": "Échec de la Lusitanie"
