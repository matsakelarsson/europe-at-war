"Australian Light Horse charged the Ottoman trenches at dusk and seized the town and its wells, turning the flank of the Gaza line.": "L’Australien Light Horse chargea les tranchées ottomanes au crépuscule et saisit la ville et ses puits, tournant le flanc de la ligne de Gaza."
"Jerusalem": "Jérusalem"
"The city surrendered after the Ottoman troops withdrew. Allenby entered it on foot through the Jaffa Gate two days later.": "La ville s’est rendue après le retrait des troupes ottomanes. Allenby est entré à pied par la porte de Jaffa deux jours plus tard."
"Battle of Megiddo": "Bataille de Megiddo"
"19–25 September 1918": "19–25 septembre 1918"
