"After the assassination of Archduke Franz Ferdinand in Sarajevo, Austria-Hungary declared war on Serbia on 28 July 1914. Russia mobilised in support of Serbia, and Germany declared war on Russia on 1 August and on France two days later. To help France, Russia invaded East Prussia before its mobilisation was complete. General Paul von Rennenkampf’s First Army advanced from the east and won a battle at Gumbinnen on 20 August, while General Alexander Samsonov’s Second Army marched north from Russian Poland.": "Après l’assassinat de l’archiduc Franz Ferdinand à Sarajevo, l’Autriche et la Hongrie ont déclaré la guerre à la Serbie le 28 juillet 1914. La Russie s’est mobilisée pour soutenir la Serbie, et l’Allemagne a déclaré la guerre à la Russie le 1er août et deux jours plus tard sur la France. Le général Paul von Rennenkampf's La première armée a progressé de l’est et a gagné une bataille à Gumbinnen le 20 août, tandis que le général Alexander Samsonov's Deuxième armée a marché au nord de la Pologne russe."
"The new German commanders, Paul von Hindenburg and Erich Ludendorff, moved most of their troops by rail against Samsonov. Russian radio orders sent without code helped them. Near Tannenberg on 26–30 August the Second Army was surrounded and destroyed; some 90,000 Russians were captured, and Samsonov shot himself. In September the Germans turned on Rennenkampf at the Masurian Lakes and drove him out of East Prussia with heavy losses. Hundreds of thousands of East Prussians had fled from the invasion.": "Les nouveaux commandants allemands, Paul von Hindenburg et Erich Ludendorff, ont déplacé la plupart de leurs troupes par chemin de fer contre Samsonov. Des ordres radio russes envoyés sans code les ont aidés. Près de Tannenberg, du 26 au 30 août, la Deuxième armée a été encerclée et détruite ; environ 90 000 Russes ont été capturés, et Samsonov s’est tiré dessus. En septembre, les Allemands se sont retournés sur Rennenkampf aux lacs masuriens et l’ont chassé de la Prusse orientale avec de lourdes pertes. Des centaines de milliers de Prussiens ont fui l’invasion."
"Battle of Gumbinnen": "Bataille de Gumbinnen"
"20 August 1914, Russian victory": "20 août 1914, victoire russe"
"Battle of Tannenberg": "Bataille de Tannenberg"
"26–30 August 1914, German victory": "26-30 août 1914, victoire allemande"
"Russian prisoners at Tannenberg": "Prisonniers russes à Tannenberg"
"about 90,000": "environ 90 000"
"The first big battle in the east. The German Eighth Army attacked the Russian First Army and was beaten back.": "La première grande bataille à l’est. La huitième armée allemande a attaqué la première armée russe et a été battue en arrière."
"26–30 August 1914": "26–30 août 1914"
"German troops encircled the centre of Samsonov’s army in the forests south of Allenstein. The Germans named the battle after a medieval defeat nearby.": "Les troupes allemandes encerclent le centre de l’armée de Samsonov dans les forêts au sud d’Allenstein."
"First Battle of the Masurian Lakes": "Première bataille des lacs masuriens"
"7–14 September 1914": "7–14 septembre 1914"
"The Germans outflanked Rennenkampf’s army, which escaped across the border but lost about 100,000 men.": "Les Allemands ont dépassé l’armée de Rennenkampf, qui s’est échappée à la frontière mais a perdu environ 100 000 hommes."
"Rennenkampf": "Rennenkampf"
"Samsonov": "Samsonov"
"Hindenburg": "Hindenburg"
"Galicia and Przemyśl": "Galice et Przemyśl"
"August 1914 – March 1915": "août 1914 – mars 1915"
"In Galicia the Austro-Hungarian army attacked into Russian Poland and won early battles at Kraśnik and Komarów, but the Russians broke its eastern wing and took Lemberg on 3 September 1914. Austria-Hungary lost perhaps 400,000 men killed, wounded or captured in the first weeks and fell back to the Carpathians, leaving the fortress of Przemyśl besieged. In the autumn German and Austro-Hungarian offensives towards Warsaw and around Łódź were held, and the front in Poland settled along the Bzura and the Rawka.": "En Galice, l’armée austro-hongroise attaque la Pologne russe et remporte les premières batailles à Kraśnik et Komarów, mais les Russes brisent leur aile orientale et prennent Lemberg le 3 septembre 1914. L’Autriche-Hongrie perd peut-être 400 000 hommes tués, blessés ou capturés dans les premières semaines et retourne aux Carpates, laissant la forteresse de Przemyśl assiégée. À l’automne, des offensives allemandes et austro-hongroises ont eu lieu vers Varsovie et autour de la ville, et le front en Pologne s’est installé le long de la Bzura et de la Rawka."
"Through the winter the Austro-Hungarians tried to relieve Przemyśl by attacking over the Carpathian passes in snow and ice, and lost hundreds of thousands of men. On 22 March 1915 the starving garrison destroyed its guns and surrendered, and some 120,000 men went into captivity. In occupied Galicia the Russian authorities treated the land as a future part of Russia, pressed the Greek Catholic church and deported many Jews and Ukrainian activists; Jews also suffered pogroms by Russian troops.": "Pendant l’hiver, les Austro-hongrois essayèrent de soulager Przemyśl en attaquant les passages carpatiens dans la neige et la glace, et perdirent des centaines de milliers d’hommes. Le 22 mars 1915, la garnison affamée détruisit ses armes et se rendit, et quelque 120 000 hommes allèrent en captivité. En Galice occupée, les autorités russes ont traité la terre comme une partie future de la Russie, pressé l’église grecque catholique et expulsé de nombreux juifs et militants ukrainiens ; les Juifs ont également souffert pogroms par les troupes russes."
"Lemberg taken by Russia": "Lemberg prise par la Russie"
"3 September 1914": "3 septembre 1914"
"Siege of Przemyśl": "Siège de Przemyśl"
"September 1914 – 22 March 1915": "septembre 1914 – 22 mars 1915"
"Garrison of Przemyśl": "Garçon de Przemyśl"
"about 120,000 captured": "environ 120 000 personnes capturées"
"Battle of Kraśnik": "Bataille de Kraśnik"
"23–25 August 1914": "23–25 août 1914"
"The Austro-Hungarian First Army defeated a Russian army advancing on its flank.": "La Première Armée austro-hongroise a vaincu une armée russe qui s’avançait sur son flanc."
"Battle of Komarów": "Bataille de Komarów"
"26 August – 2 September 1914": "26 août – 2 septembre 1914"
"An Austro-Hungarian victory that nearly encircled the Russian Fifth Army, soon undone by defeats further east.": "Une victoire austro-hongroise qui a failli encerclé la cinquième armée russe, bientôt annulée par des défaites plus à l’est."
"Lemberg": "Lemberg"
"The capital of Austrian Galicia, today’s Lviv, fell to the Russians after battles on the Gnila Lipa and at Rava Ruska.": "La capitale de la Galice autrichienne, aujourd'hui Lviv, est tombée aux Russes après des batailles sur la Gnila Lipa et à Rava Ruska."
"1914 – 22 March 1915": "1914 – 22 mars 1915"
"The largest siege of the war. Cut off from 9 November, the fortress was starved into surrender.": "Le siège le plus important de la guerre. Coupe du 9 novembre, la forteresse est affamée de capitulation."
"Battle of Łódź": "Bataille de Łód-"
"11 November – 6 December 1914": "11 novembre – 6 décembre 1914"
"A German attack nearly encircled two Russian armies, but the Germans had to fight their way out. The Russians then gave up Łódź.": "Une attaque allemande encerclait presque deux armées russes, mais les Allemands durent se battre pour sortir. Les Russes abandonnèrent alors Łód-."
"Russian armies": "Armées russes"
"Occupied by Russia, spring 1915 (approximate)": "Occupée par la Russie, printemps 1915 (approximative)"
