"On 2 May 1915 a German and Austro-Hungarian army under General August von Mackensen broke through the Russian front between Gorlice and Tarnów after a heavy bombardment. The Russian armies, short of shells and rifles, fell back across Galicia. Przemyśl was retaken on 3 June and Lemberg on 22 June. In July the Central Powers attacked Russian Poland from the north and south, and the Russian command ordered a withdrawal.": "Le 2 mai 1915, une armée allemande et austro-hongroise sous la direction du général August von Mackensen a franchi le front russe entre Gorlice et Tarnów après un bombardement lourd. Les armées russes, à l’exception des obus et des fusils, sont tombées en Galice. Przemyśl a été repris le 3 juin et Lemberg le 22 juin. En juillet, les puissances centrales ont attaqué la Pologne russe depuis le nord et le sud, et le commandement russe a ordonné un retrait."
"Warsaw fell on 5 August, followed by the fortresses of Kovno, Novogeorgievsk and Brest-Litovsk. Vilna was lost in September, when the front settled from the Gulf of Riga to the Romanian border. By some estimates Russia lost about two million men killed, wounded or captured in 1915, and Nicholas II took over as commander-in-chief. Retreating Russian troops burned villages and forced people east, and the army deported hundreds of thousands of Jews and ethnic Germans. Some estimates put the number of refugees in Russia at over three million by the end of 1915.": "Varsovie est tombée le 5 août, suivie par les forteresses de Kovno, Novogeorgievsk et Brest-Litovsk. Vilna a été perdu en septembre, lorsque le front s’est installé du golfe de Riga à la frontière roumaine. Selon certaines estimations, la Russie a perdu environ deux millions d’hommes tués, blessés ou capturés en 1915, et Nicolas II a pris le commandement en chef. Retraiter les troupes russes a brûlé des villages et forcé les gens à l’est, et l’armée a expulsé des centaines de milliers de Juifs et d’Allemands de souche."
