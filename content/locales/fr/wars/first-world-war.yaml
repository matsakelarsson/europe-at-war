"Revolution, Kerensky’s offensive and Riga": "La révolution, l’offensive de Kerensky et Riga"
"Hunger, war-weariness and the losses at the front led to strikes and mutinies in Petrograd in March 1917, and on 15 March Nicholas II abdicated. The Provisional Government kept Russia in the war. On 1 July its war minister, Alexander Kerensky, launched an offensive in Galicia. General Lavr Kornilov’s Eighth Army broke through and took Kalush and Halych, but many units refused to fight on, and a German counter-attack from 19 July drove the Russians out of nearly all of eastern Galicia and Bukovina.": "La faim, l’usure de la guerre et les pertes au front ont entraîné des grèves et des mutineries à Petrograd en mars 1917, et le 15 mars Nicolas II a abdiqué. Le gouvernement provisoire a maintenu la Russie dans la guerre. Le général Lavr Kornilov's Huitième armée a traversé et pris Kalush et Halych, mais de nombreuses unités ont refusé de se battre, et une contre-attaque allemande du 19 juillet a chassé les Russes de presque toutes les Galice orientale et Bukovina."
"On 1 September the German Eighth Army crossed the Daugava at Ikšķile using new infiltration tactics, and on 3 September it entered Riga; most of the Russian army escaped. In October German landings took the islands of Saaremaa, Muhu and Hiiumaa. On 7 November the Bolsheviks seized power in Petrograd and called for an immediate peace. Fighting stopped with a ceasefire, and an armistice was signed at Brest-Litovsk on 15 December.": "Le 1er septembre, la huitième armée allemande a traversé le Daugava à Ikšyile en utilisant de nouvelles tactiques d’infiltration et le 3 septembre elle est entrée à Riga ; la plupart de l’armée russe s’est échappée. En octobre, les débarquements allemands ont pris les îles de Saaremaa, Muhu et Hiiumaa. Les combats se sont arrêtés avec un cessez-le-feu, et un armistice a été signé à Brest-Litovsk le 15 décembre."
