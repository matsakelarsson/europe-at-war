"The Treaty of Brest-Litovsk": "Traité de Brest-Litovsk"
"December 1917 – March 1918": "décembre 1917 – mars 1918"
"Peace talks opened at Brest-Litovsk in December 1917. The Central Powers demanded that Russia give up the lands they occupied, and in February 1918 they signed a separate peace with the Ukrainian People’s Republic. When Leon Trotsky broke off the talks without accepting their terms, German and Austro-Hungarian troops advanced from 18 February almost unopposed, taking Dvinsk, Minsk, Pskov and Tallinn and entering Kyiv on 1 March.": "Les pourparlers de paix ont commencé à Brest-Litovsk en décembre 1917. Les puissances centrales exigeaient que la Russie abandonne les terres qu’elles occupaient et, en février 1918, elles signèrent une paix séparée avec la République populaire ukrainienne. Lorsque Léon Trotsky a rompu les pourparlers sans accepter leurs termes, les troupes allemandes et austro-hongroise ont avancé à partir du 18 février presque sans opposition, prenant Dvinsk, Minsk, Pskov et Tallinn et entrant à Kiev le 1er mars."
"Lenin insisted on accepting the even harsher terms that followed. By the treaty signed on 3 March 1918, Soviet Russia gave up Poland, Lithuania, Courland and Riga, agreed to leave Livonia and Estonia, recognised the independence of Finland and Ukraine, and ceded Kars, Ardahan and Batumi to the Ottoman Empire, whose troops took them in April. The lost lands held about a third of the empire’s population. Germany’s defeat in November 1918 brought the annulment of the treaty, but the new states it had helped to create remained.": "Par le traité signé le 3 mars 1918, la Russie soviétique abandonne la Pologne, la Lituanie, Courland et Riga, accepte de quitter la Livonie et l’Estonie, reconnaît l’indépendance de la Finlande et de l’Ukraine, et cède Kars, Ardahan et Batumi à l’Empire ottoman dont les troupes les prennent en avril. La défaite de l’Allemagne en novembre 1918 a entraîné l’annulation du traité, mais les nouveaux États qu’il avait aidé à créer sont restés."
"Armistice on the Eastern Front": "Armistice sur le front est"
"15 December 1917": "15 décembre 1917"
"Treaty of Brest-Litovsk": "Traité de Brest-Litovsk"
"3 March 1918": "3 mars 1918"
