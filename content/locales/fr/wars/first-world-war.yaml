"The largest of Verdun’s forts, held by a few dozen reservists, fell to a small German party almost without a fight. French marines and colonial troops retook it on 24 October.": "Le plus grand des forts de Verdun, tenu par quelques dizaines de réservistes, est tombé à un petit parti allemand presque sans combat. Marines français et troupes coloniales l’ont repris le 24 octobre."
