"German counter-attack": "Contre-attaque allemande"
"Hutier": "Hutier"
"Arras, the Chemin des Dames and Passchendaele": "Arras, le Chemin des Dames et Passchendaele"
"February – December 1917": "février – décembre 1917"
"In February and March 1917 the Germans gave up the great bulge between Arras and Soissons and withdrew to the shorter, heavily fortified Hindenburg Line, destroying villages, roads, bridges and wells and removing most of the inhabitants as they went. On 9 April the British attacked at Arras, and the Canadian Corps took Vimy Ridge. On 16 April the new French commander-in-chief, Robert Nivelle, who had promised a breakthrough within days, attacked the Chemin des Dames. The offensive gained little and cost the French well over 100,000 casualties, and Nivelle was replaced by Pétain.": "En février et mars 1917, les Allemands abandonnèrent la grande explosion entre Arras et Soissons et se retirèrent vers la ligne Hindenburg plus courte, fortifiée, détruisant les villages, les routes, les ponts et les puits et enlevant la plupart des habitants. Le 9 avril, les Britanniques attaquèrent à Arras et le Corps canadien prit la crête de Vimy. Le 16 avril, le nouveau commandant en chef français, Robert Nivelle, qui avait promis une percée en quelques jours, attaqua le Chemin des Dames. L’offensive gagna peu et coûta bien plus de 100 000 victimes aux Français, et Nivelle fut remplacée par Pétain."
"In May and June mutinies broke out in about half the divisions of the French army; soldiers refused to attack, though most were still willing to hold the line. Pétain restored order with better leave and food, an end to hopeless attacks and courts-martial that passed over 500 death sentences, of which a few dozen were carried out. The British took over the main burden. Their mines blew the Germans off Messines Ridge on 7 June, and from 31 July Haig’s offensive at Ypres ground on through rain and mud until Canadian troops took the ruins of Passchendaele in November.": "En mai et juin, des mutineries ont éclaté dans environ la moitié des divisions de l’armée française ; les soldats ont refusé d’attaquer, bien que la plupart soient toujours prêts à tenir la ligne. Pétain a rétabli l’ordre avec de meilleurs congés et nourriture, une fin aux attaques désespérées et cours martiales qui ont passé plus de 500 condamnations à mort, dont quelques dizaines ont été exécutées. Leurs mines ont fait exploser les Allemands au large de la crête de Messines le 7 juin et, à partir du 31 juillet, l’offensive des Haigs à Ypres s’est soldée par la pluie et la boue jusqu’à ce que les troupes canadiennes prennent les ruines de Passchendaele en novembre."
"The Third Battle of Ypres gained about eight kilometres, and estimates of each side’s losses run from about 200,000 to over 400,000. On 20 November at Cambrai the British attacked with some 380 tanks and broke into the Hindenburg Line, but German counter-attacks from 30 November retook most of the ground. By then Russia was leaving the war and Italy had been routed at Caporetto, and Germany could bring its armies from the east.": "La troisième bataille d’Ypres a gagné environ huit kilomètres, et les estimations des pertes de chaque côté vont d’environ 200 000 à plus de 400 000. Le 20 novembre à Cambrai, les Britanniques ont attaqué avec quelque 380 chars et se sont introduits dans la ligne Hindenburg, mais les contre-attaques allemandes ont repris la majeure partie du sol à partir du 30 novembre. À l’époque, la Russie quittait la guerre et l’Italie avait été acheminée à Caporetto, et l’Allemagne pouvait amener ses armées de l’est."
"Vimy Ridge taken": "Prise de Vimy Ridge"
"9–12 April 1917": "9–12 avril 1917"
"Nivelle offensive": "L’offensive de Nivelle"
"16 April – 9 May 1917": "16 avril – 9 mai 1917"
"Third Battle of Ypres (Passchendaele)": "Troisième bataille d’Ypres (Passchendaele)"
"31 July – 10 November 1917": "31 juillet – 10 novembre 1917"
"Vimy Ridge": "La crête de Vimy"
"The four divisions of the Canadian Corps, attacking together for the first time, took the ridge that had resisted French and British attacks since 1914.": "Les quatre divisions du Corps canadien, attaquant ensemble pour la première fois, prirent la crête qui résistait aux attaques françaises et britanniques depuis 1914."
"Arras": "Arras"
"9 April – 16 May 1917": "9 avril – 16 mai 1917"
"The British advanced several kilometres on the first day; then the battle bogged down around Monchy-le-Preux and Bullecourt, with heavy losses.": "Les Britanniques avançaient plusieurs kilomètres le premier jour, puis la bataille s’enlisa autour de Monchy-le-Preux et de Bullecourt, avec de lourdes pertes."
"Chemin des Dames": "Chemin des Dames"
"Nivelle’s offensive against the ridge, with the first French tanks, met intact German defences and machine guns and gained only a few kilometres.": "L’offensive de Nivelle contre la crête, avec les premiers chars français, a rencontré des défenses allemandes intactes et des mitrailleuses et n’a gagné que quelques kilomètres."
"La Malmaison": "La Malmaison"
