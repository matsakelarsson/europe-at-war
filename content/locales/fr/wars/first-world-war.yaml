"Verdun": "Verdun"
"February – December 1916": "février – décembre 1916"
"Falkenhayn chose to attack at Verdun, a fortress city in a salient of the French line that he believed France would defend at any cost. He later wrote that he had meant to bleed the French army white; historians still debate whether that was his plan from the start. On 21 February 1916, after a bombardment by some 1,200 guns, the German Fifth Army under Crown Prince Wilhelm attacked on the right bank of the Meuse. Fort Douaumont, the largest of the forts and almost unmanned, fell on 25 February.": "Falkenhayn a choisi d’attaquer à Verdun, une ville forteresse dans un saillant de la ligne française qu’il croyait défendre à tout prix. Il a écrit plus tard qu’il avait voulu saigner le blanc de l’armée française ; les historiens débattent encore de savoir si tel était son plan dès le départ. Le 21 février 1916, après un bombardement de quelque 1 200 canons, la cinquième armée allemande, sous le prince héritier Wilhelm, attaqua sur la rive droite de la Meuse. Fort Douaumont, le plus grand des forts et presque sans pilote, tomba le 25 février."
"General Philippe Pétain took over the defence. He rotated divisions through the battle and kept a single road from Bar-le-Duc, later called the Voie Sacrée, open for thousands of lorries a day. The Germans extended their attack to the left bank, where Le Mort Homme and Hill 304 were fought over for months, took Fort Vaux on 7 June and Fleury on 23 June, but were stopped short of Fort Souville in July. From October French counter-attacks retook Douaumont and Vaux, and by 18 December much of the lost ground on the right bank. About three-quarters of the French army passed through Verdun.": "Le général Philippe Pétain prend la défense. Il tourne les divisions à travers la bataille et garde une seule route de Bar-le-Duc, plus tard appelée la Voie Sacrée, ouverte pour des milliers de camions par jour. Les Allemands étendirent leur attaque à la rive gauche, où le Mort Homme et la colline 304 furent combattus pendant des mois, prirent Fort Vaux le 7 juin et Fleury le 23 juin, mais furent arrêtés à court de Fort Souville en juillet. Dès octobre, les contre-attaques françaises reprirent Douaumont et Vaux, et le 18 décembre une grande partie du terrain perdu sur la rive droite. Environ les trois quarts de l’armée française sont passés par Verdun."
"Battle of Verdun": "Bataille de Verdun"
