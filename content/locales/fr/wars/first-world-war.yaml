"The Allies had planned a joint offensive astride the Somme for 1916. Verdun cut the French share, and the main attack fell to the British, many of them volunteers of Kitchener’s New Army. A week-long bombardment of about 1.5 million shells failed to cut much of the barbed wire or destroy the deep German dugouts, and when the British Fourth Army attacked on 1 July 1916 the defenders were ready. The British suffered 57,470 casualties that day, 19,240 of them killed, the worst day in the British army’s history. Only in the south, around Mametz and Montauban and beside the French, were the objectives taken.": "Les Alliés avaient planifié une offensive commune contre la Somme pour 1916. Verdun coupa la part française, et l’attaque principale tomba aux Britanniques, beaucoup d’entre eux volontaires de la nouvelle armée de Kitchener. Un bombardement d’une semaine d’environ 1,5 million d’obus ne réussit pas à couper une grande partie du fil barbelé ou à détruire les profonds étangs allemands, et lorsque la quatrième armée britannique attaqua le 1er juillet 1916, les défenseurs étaient prêts. Les Britanniques ont subi 57 470 morts ce jour-là, dont 19 240 tués, le pire jour de l’histoire de l’armée britannique. Seulement dans le sud, autour de Mametz et Montauban et à côté des Français, les objectifs ont été pris."
"The battle became a slow struggle of attrition. Australian troops took Pozières in July, South Africans held Delville Wood, and on 15 September tanks went into action for the first time, at Flers–Courcelette. Thiepval fell at the end of September and Beaumont-Hamel in November, before rain and mud ended the offensive on 18 November. The Allies had advanced up to about ten kilometres. British losses were about 420,000 and French about 200,000; estimates of German losses vary widely, from about 240,000 to 600,000. The battle relieved Verdun and wore down the German army, and historians still debate whether that justified its cost.": "Les troupes australiennes ont pris Pozières en juillet, les Sud-Africains ont tenu Delville Wood, et le 15 septembre les chars sont entrés en action pour la première fois, à Flers–Courcelette. Thiepval est tombé à la fin de septembre et Beaumont-Hamel en novembre, avant que la pluie et la boue ne terminent l’offensive le 18 novembre. Les pertes britanniques ont été d’environ 420 000 et les pertes françaises d’environ 200 000 ; les estimations des pertes allemandes varient considérablement, de 240 000 à 600 000 environ."
"First day on the Somme": "Premier jour sur la Somme"
