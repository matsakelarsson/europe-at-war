"On the night of 24 April 1915 the Ottoman authorities arrested about 235–270 Armenian intellectuals and community leaders in Constantinople; most were later deported and killed. The ruling Committee of Union and Progress, which blamed the Armenians for the defeat at Sarikamish and feared they would side with Russia, then turned on the whole Armenian population of Anatolia. Armenian soldiers had already been disarmed and put into labour battalions, where many were killed. From late May, under a deportation law, Armenians were driven from their towns and villages towards the Syrian desert. Men were often shot soon after leaving; women, children and old people were marched for weeks, robbed, raped and attacked by gendarmes, irregulars and the paramilitary Special Organisation, and many died of hunger and exhaustion or were abducted.": "Dans la nuit du 24 avril 1915, les autorités ottomanes ont arrêté entre 235 et 270 intellectuels arméniens et dirigeants communautaires à Constantinople ; la plupart ont été expulsés et tués par la suite. Le comité au pouvoir de l’Union et du progrès, qui a accusé les Arméniens de la défaite à Sarikamish et craint qu’ils ne se joignent à la Russie, s’est ensuite tourné vers toute la population arménienne d’Anatolie. À partir de la fin du mois de mai, en vertu d’une loi sur l’expulsion, les Arméniens ont été chassés de leurs villes et villages vers le désert syrien. Les hommes ont souvent été fusillés peu après leur départ ; les femmes, les enfants et les personnes âgées ont été défilés pendant des semaines, volés, violés et attaqués par des gendarmes, des irréguliers et l’Organisation spéciale paramilitaire, et beaucoup sont morts de faim et d’épuisement ou ont été enlevés."
"Survivors were held in camps along the Euphrates and around Deir ez-Zor, where most were killed in a second wave of massacres in 1916. Estimates of the Armenian dead range from about 600,000 to 1.5 million, with around one million most often cited; Assyrian and Greek Christians were also killed and deported in large numbers. Some Armenians resisted, at Van and on Musa Dagh, and some Muslim officials and families sheltered them. After the war an Ottoman court-martial sentenced the regime’s leaders to death in their absence. Most genocide scholars and 36 states, among them Germany, France and the United States, recognise the killings as genocide. Turkey accepts that many Armenians died but rejects the term, attributing the deaths to war, disease, relocation and intercommunal fighting.": "Les survivants ont été détenus dans des camps le long de l’Euphrate et autour de Deir ez-Zor, où la plupart ont été tués lors d’une deuxième vague de massacres en 1916. Selon les estimations, les morts arméniens vont d’environ 600 000 à 1,5 million, avec environ un million le plus souvent cité ; chrétiens assyriens et grecs ont également été tués et déportés en grand nombre. Après la guerre, une cour martiale ottomane a condamné les dirigeants du régime à mort en leur absence. La plupart des érudits de génocide et 36 États, dont l’Allemagne, la France et les États-Unis, reconnaissent que ces meurtres sont un génocide. La Turquie accepte que de nombreux Arméniens soient morts mais rejette ce terme, attribuant les morts à la guerre, aux maladies, aux réinstallations et aux combats intercommunautaires."
