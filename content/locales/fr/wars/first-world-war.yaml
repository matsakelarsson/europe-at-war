"The hill on the left bank and its neighbour, Hill 304, were attacked from March and taken by the Germans by the end of May. The French recaptured them in August 1917.": "La colline sur la rive gauche et son voisin, la colline 304, ont été attaqués à partir de mars et prises par les Allemands fin mai. Les Français les ont repris en août 1917."
"The fortress city never fell. The last big German attack, on 11–12 July, was stopped at Fort Souville, some five kilometres from the city.": "La ville forteresse n’est jamais tombée. La dernière grande attaque allemande, du 11 au 12 juillet, a été arrêtée à Fort Souville, à cinq kilomètres de la ville."
