"The German Revolution of 1918–1919": "La révolution allemande de 1918-1919"
"Soissons": "Poissons"
"18–22 July 1918": "18–22 juillet 1918"
"Charles Mangin’s French Tenth Army, with two American divisions, attacked without a preliminary bombardment and turned the tide on the Marne.": "Charles Mangin est la dixième armée française, avec deux divisions américaines, attaque sans bombardement préliminaire et tourne la marée sur la Marne."
"Australian, Canadian, British and French troops broke through on a wide front; the Germans lost some 30,000 men on the first day, many of them as prisoners.": "Les troupes australiennes, canadiennes, britanniques et françaises ont franchi un large front ; les Allemands ont perdu quelque 30 000 hommes le premier jour, dont beaucoup en tant que prisonniers."
"Saint-Quentin canal": "Canal Saint-Quentin"
"British, Australian and American divisions broke through the strongest part of the Hindenburg Line; at Riqueval a British division crossed the canal with lifebelts from Channel ferries.": "Des divisions britanniques, australiennes et américaines franchissent la partie la plus forte de la ligne Hindenburg ; à Riqueval, une division britannique traverse le canal avec des ceintures de sauvetage provenant des traversiers de Channel."
"Saint-Mihiel": "Saint-Mihiel"
"12–15 September 1918": "12–15 septembre 1918"
"Over half a million American troops, with French support, cut off the salient held by the Germans since 1914, as the Germans were already withdrawing from it.": "Plus d’un demi-million de troupes américaines, soutenues par la France, ont coupé le saillant tenu par les Allemands depuis 1914, car les Allemands s’en retiraient déjà."
"Meuse–Argonne": "Meuse–Argonne"
"26 September – 11 November 1918": "26 septembre – 11 novembre 1918"
"The largest battle in American history, with over a million American soldiers; some 26,000 of them were killed.": "La plus grande bataille de l’histoire américaine, avec plus d’un million de soldats américains ; environ 26 000 d’entre eux ont été tués."
"11 November 1918": "11 novembre 1918"
"Canadian troops entered the town on the morning of the armistice, where the British had first fought in August 1914.": "Les troupes canadiennes sont entrées dans la ville le matin de l’armistice, où les Britanniques avaient combattu pour la première fois en août 1914."
"Armistice of Compiègne": "Armistice de Compiègne"
"Signed at about 5 a.m. in Foch’s railway carriage in a forest clearing near Rethondes, to take effect at 11 a.m.": "Signé vers 5 heures du matin dans le transport ferroviaire de Fochs dans un défrichement forestier près de Rethondes, pour prendre effet à 11 heures."
"Spa": "Spa"
"9–10 November 1918": "9–10 novembre 1918"
"The German headquarters. Told that the army would no longer follow him, William II left from here for exile in the Netherlands.": "Le quartier général allemand. En disant que l’armée ne le suivrait plus, Guillaume II partit d’ici pour l’exil aux Pays-Bas."
"Mangin": "Mangine"
"British armies": "Armées britanniques"
"Belgian army": "Armée belge"
"Pershing": "Plongée"
"Still occupied by Germany, 11 November 1918": "Toujours occupée par l’Allemagne, le 11 novembre 1918"
"Armistice line, 11 November 1918": "Ligne d’armistice, 11 novembre 1918"
"Allied moves": "Mouvements alliés"
"1918: Dobro Pole, Vittorio Veneto and the armistices": "1918 : Dobro Pole, Vittorio Veneto et les armistices"
"September – November 1918": "septembre – novembre 1918"
"On the Salonika front a mixed Allied army of French, British, Serbian, Italian and, since Greece entered the war in June 1917, Greek troops had faced the Bulgarians and Germans across the mountains of Macedonia since 1916. On 15 September 1918 General Louis Franchet d’Espèrey attacked. Serbian, French and Greek troops broke the Bulgarian line on the mountain ridge of Dobro Pole, while a British and Greek attack at Lake Doiran failed with heavy losses. The breach widened, Bulgarian units mutinied, and French cavalry entered Skopje on 29 September. That day Bulgaria signed an armistice in Salonika, the first of the Central Powers to leave the war. The Serbian army pressed north and re-entered Belgrade on 1 November.": "Sur le front de Salonika, une armée mixte alliée française, britannique, serbe, italienne et, depuis que la Grèce entre en guerre en juin 1917, les troupes grecques affrontent les Bulgares et les Allemands à travers les montagnes de Macédoine depuis 1916. Les troupes serbes, françaises et grecques ont brisé la ligne bulgare sur la crête de Dobro Pole, tandis qu’une attaque britannique et grecque au lac Doiran a échoué avec de lourdes pertes. La brèche s’est élargie, les unités bulgares ont mutiné, et la cavalerie française est entrée à Skopje le 29 septembre. L’armée serbe a pressé le nord et est rentrée à Belgrade le 1er novembre."
"With Bulgaria out, the way to Constantinople lay open. The Ottoman Empire, also beaten in Syria and Mesopotamia, signed an armistice aboard the British battleship Agamemnon at Mudros on 30 October, and Allied fleets passed the Dardanelles in November. On the Piave the Italians, with British, French and American units, attacked on 24 October towards Vittorio Veneto. The Austro-Hungarian army, whose peoples were already declaring their own states, held for a few days and then fell apart, and hundreds of thousands of its soldiers were taken prisoner. Austria-Hungary signed an armistice at Villa Giusti near Padua on 3 November, to take effect the next day, and Italian troops entered Trento and Trieste. Germany followed on 11 November.": "Le 30 octobre, l’Empire ottoman, également battu en Syrie et en Mésopotamie, signait un armistice à bord du navire de guerre britannique Agamemnon à Mudros, et les flottes alliées passaient les Dardanelles en novembre. Sur la Piave, les Italiens, avec des unités britanniques, françaises et américaines, attaquèrent le 24 octobre vers Vittorio Veneto. L’armée austro-hongroise, dont les peuples déclaraient déjà leurs propres États, s’est tenue pendant quelques jours puis s’est effondrée, et des centaines de milliers de ses soldats ont été faits prisonniers. L’Autriche-Hongrie a signé un armistice à Villa Giusti près de Padoue le 3 novembre, pour prendre effet le lendemain, et les troupes italiennes sont entrées dans Trento et Trieste."
"Breakthrough at Dobro Pole": "Une percée au pôle Dobro"
"15–18 September 1918": "15–18 septembre 1918"
"Battle of Vittorio Veneto": "Bataille de Vittorio Veneto"
"24 October – 4 November 1918": "24 octobre – 4 novembre 1918"
"Armistices": "Armistices"
"Salonika 29 September, Mudros 30 October, Villa Giusti 3 November 1918": "Salonika 29 septembre, Mudros 30 octobre, Villa Giusti 3 novembre 1918"
"Battle of Dobro Pole": "Bataille de Dobro Pole"
"After a day-long bombardment, Serbian, French and Greek troops stormed the Bulgarian trenches on the ridge and broke the front open.": "Après un bombardement d’une journée, les troupes serbes, françaises et grecques ont pris l’assaut des tranchées bulgares sur la crête et ouvert le front."
"Battle of Doiran": "Bataille de Doiran"
"18–19 September 1918": "18–19 septembre 1918"
"British and Greek attacks on the Bulgarian hill positions west of the lake failed with heavy losses, but the Bulgarians soon had to retreat.": "Les attaques britanniques et grecques sur les positions de la colline bulgare à l’ouest du lac ont échoué avec de lourdes pertes, mais les Bulgares ont rapidement dû se retirer."
"French cavalry under General Jouinot-Gambetta reached the town after a ride through the mountains, cutting the Bulgarian and German line of retreat.": "La cavalerie française sous le général Jouinot-Gambetta a atteint la ville après une balade à travers les montagnes, coupant la ligne de retraite bulgare et allemande."
"Armistice of Salonika": "Armistice de Salonika"
"Bulgaria agreed to demobilise and evacuate the Greek and Serbian lands it held. The ceasefire took effect at noon the next day.": "La Bulgarie a accepté de démobiliser et d’évacuer les terres grecques et serbes qu’elle détenait. Le cessez-le-feu est entré en vigueur à midi le lendemain."
"1 November 1918": "1er novembre 1918"
"The Serbian First Army re-entered the capital after a rapid advance from the Salonika front, pushing back German and Austro-Hungarian rearguards.": "La première armée serbe est rentrée dans la capitale après une avancée rapide du front de Salonika, repoussant les arrière-gardes allemande et austro-hongroise."
"Armistice of Mudros": "Armistice de Mudros"
"30 October 1918": "30 octobre 1918"
"Signed in the harbour of Lemnos. The Ottoman Empire opened the straits and agreed to demobilise its army.": "Signé dans le port de Lemnos. L’Empire Ottoman ouvrit les détroits et accepta de démobiliser son armée."
"After days of hard fighting on Monte Grappa and the Piave, the Italians reached Vittorio on 30 October, splitting the Austro-Hungarian armies.": "Après des jours de combats acharnés sur le Monte Grappa et le Piave, les Italiens arrivèrent à Vittorio le 30 octobre, scindant les armées austro-hongroises."
"Armistice of Villa Giusti": "Armistice de Villa Giusti"
"3 November 1918": "3 novembre 1918"
"Signed at a villa outside Padua. The fighting stopped at 15:00 on 4 November.": "Signé dans une villa en dehors de Padoue. Les combats se sont arrêtés à 15h00 le 4 novembre."
"Franchet d’Espèrey": "Franchet d-Espèrey"
"Serbian armies": "Armées serbes"
"Diaz": "Diaz"
"Salonika front, 15 September 1918 (approximate)": "Salonika front, 15 septembre 1918 (approximative)"
"Entente success": "Le succès de l’entente"
"Entente moves": "Entente bouge"
"Versailles and the Paris peace settlement": "Versailles et le règlement de paix de Paris"
"1919–1920": "1919–1920"
"The peace conference opened in Paris on 18 January 1919. It was dominated by the leaders of France, Britain, the United States and Italy, Georges Clemenceau, David Lloyd George, Woodrow Wilson and Vittorio Emanuele Orlando, and the defeated powers were not invited to negotiate. Germany received the terms in May and, after bitter protests and a change of government, signed the Treaty of Versailles in the Hall of Mirrors on 28 June 1919, five years to the day after the assassination in Sarajevo. It came into force on 10 January 1920, the day the League of Nations was founded.": "La conférence de paix s’ouvrit à Paris le 18 janvier 1919, dominée par les dirigeants français, britanniques, américains et italiens, Georges Clemenceau, David Lloyd George, Woodrow Wilson et Vittorio Emanuele Orlando, et les puissances vaincues ne furent pas invitées à négocier. L’Allemagne a reçu les conditions en mai et, après de vives protestations et un changement de gouvernement, a signé le traité de Versailles dans la salle des miroirs le 28 juin 1919, cinq ans avant l’assassinat à Sarajevo. Il est entré en vigueur le 10 janvier 1920, jour où la Société des Nations a été fondée."
"Germany lost about 13 per cent of its European territory and a tenth of its population. Alsace-Lorraine returned to France. Poland received most of Posen and West Prussia, giving it a corridor to the sea; Danzig became a free city, the Memel territory was placed under the Allies, and the Saar was put under the League of Nations for fifteen years, with its coal mines given to France. Plebiscites gave northern Schleswig to Denmark in 1920 and divided Upper Silesia in 1921, and Eupen-Malmedy passed to Belgium.": "L’Allemagne perdit environ 13 % de son territoire européen et un dixième de sa population. Alsace-Lorraine retourna en France. La Pologne reçut la majeure partie de Posen et de Prusse occidentale, lui donnant un couloir vers la mer ; Danzig devint une ville libre, le territoire de Memel fut placé sous les Alliés, et la Sarre fut placée sous la Société des Nations pendant quinze ans, avec ses mines de charbon données à la France. Les plébiscites donnèrent le Schleswig au Danemark en 1920 et divisèrent la Haute-Silésie en 1921, et Eupen-Malmedy passa en Belgique."
"Germany’s army was limited to 100,000 men, without tanks, military aircraft or submarines. The Rhineland was occupied by Allied troops for up to fifteen years and was to remain demilitarised, and Article 231 made Germany accept responsibility for the loss and damage caused by the war, the basis for reparations, set in 1921 at 132 billion gold marks. Most Germans saw the treaty as a dictated peace. Separate treaties with Austria (Saint-Germain), Bulgaria (Neuilly), Hungary (Trianon) and the Ottoman Empire (Sèvres, later replaced by Lausanne) redrew the map of central and south-eastern Europe.": "L’armée allemande est limitée à 100 000 hommes, sans chars, avions militaires ou sous-marins. La Rhénanie est occupée par les troupes alliées pendant jusqu’à quinze ans et doit rester démilitarisée, et l’article 231 fait accepter la responsabilité de la perte et des dommages causés par la guerre, base des réparations, fixé en 1921 à 132 milliards de marks d’or. Des traités séparés avec l’Autriche (Saint-Germain), la Bulgarie (Neuilly), la Hongrie (Trianon) et l’Empire ottoman (Sèvres, remplacé ultérieurement par Lausanne) ont refait la carte de l’Europe centrale et du sud-est."
"Treaty of Versailles": "Traité de Versailles"
"signed 28 June 1919, in force 10 January 1920": "signé le 28 juin 1919, en vigueur le 10 janvier 1920"
"German territory lost in Europe": "Le territoire allemand perdu en Europe"
"about 13 per cent, with a tenth of the population": "environ 13 %, avec un dixième de la population"
"Reparations": "Réparations"
"132 billion gold marks (1921)": "132 milliards de marques d’or (1921)"
"The Silesian Uprisings": "Les soulèvements silésiens"
"28 June 1919": "28 juin 1919"
"Signed in the Hall of Mirrors of the palace, where the German Empire had been proclaimed in 1871.": "Signé dans la salle des miroirs du palais, où l’Empire allemand avait été proclamé en 1871."
"Strasbourg": "Strasbourg"
"22 November 1918": "22 novembre 1918"
"French troops entered the city after the armistice. Alsace-Lorraine, annexed by Germany in 1871, returned to France.": "Les troupes françaises entrèrent dans la ville après l’armistice. Alsace-Lorraine, annexée par l’Allemagne en 1871, retourna en France."
"Saarbrücken": "Sarrebruck"
"1920–1935": "1920–1935"
"The Saar territory was governed by the League of Nations, with its coal mines owned by France, until a plebiscite returned it to Germany in 1935.": "Le territoire de la Sarre est gouverné par la Société des Nations, avec ses mines de charbon détenues par la France, jusqu’à ce qu’un plébiscite le rende en Allemagne en 1935."
"Eupen": "Eupen"
"Eupen and Malmedy passed to Belgium after a public consultation in which those who objected had to sign their names in a register.": "Eupen et Malmedy sont passés en Belgique après une consultation publique au cours de laquelle les opposants devaient signer leur nom dans un registre."
"Northern Schleswig": "Schleswig du Nord"
"February – March 1920": "février – mars 1920"
"In two plebiscite zones the northern one voted for Denmark and the southern one, with Flensburg, for Germany. The new border took effect on 15 June 1920.": "Dans deux zones de plébiscite, le nord a voté pour le Danemark et le sud, avec Flensburg, pour l’Allemagne. La nouvelle frontière est entrée en vigueur le 15 juin 1920."
"Danzig": "Danszig"
"The mainly German port became a free city under the League of Nations, with rights for Poland; the Polish Corridor separated East Prussia from the rest of Germany.": "Le port principalement allemand est devenu une ville libre sous la Société des Nations, avec des droits pour la Pologne ; le corridor polonais a séparé la Prusse orientale du reste de l’Allemagne."
"Memel": "Mémel"
"The territory north of the Neman was put under Allied administration, run by France; Lithuania seized it in 1923.": "Le territoire au nord du Neman est placé sous l’administration alliée, dirigée par la France ; la Lituanie le saisit en 1923."
"Upper Silesia": "Silésie supérieure"
"1921–1922": "1921–1922"
"A plebiscite in March 1921 was followed by a Polish rising. On the League of Nations’ advice the industrial district was divided between Germany and Poland, taking effect in 1922.": "Un plébiscite en mars 1921 fut suivi d’une montée en Pologne. Sur les conseils de la Société des Nations, le district industriel fut divisé entre l’Allemagne et la Pologne, prenant effet en 1922."
"Rhineland, occupied by the Allies from December 1918": "Rhénanie, occupée par les Alliés à partir de décembre 1918"
