"John Jellicoe’s Grand Fleet and Reinhard Scheer’s High Seas Fleet fought in the evening and through the night off the Danish coast. The British lost more ships but kept command of the sea.": "John Jellicoe, la Grande Flotte et Reinhard Scheer, la High Seas Fleet se sont battus le soir et la nuit au large de la côte danoise. Les Britanniques ont perdu plus de navires mais ont gardé le commandement de la mer."
