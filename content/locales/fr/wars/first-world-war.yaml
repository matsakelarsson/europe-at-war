"British and Indian troops took the village after a short, intense bombardment, but reserves came up too late to exploit the break.": "Les troupes britanniques et indiennes ont pris le village après un court bombardement intense, mais les réserves sont venues trop tard pour exploiter la rupture."
"After the gas attack the Germans took Langemarck, St Julien and the Frezenberg ridge, and pushed the salient back to within about four kilometres of Ypres.": "Après l’attaque de gaz, les Allemands prirent Langemarck, St Julien et la crête de Frezenberg, et repoussèrent le saillant à environ quatre kilomètres d’Ypres."
