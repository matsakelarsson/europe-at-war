"The Allied fleet ran into an undetected line of mines in Erenköy Bay. Three battleships sank, and the attempt to force the straits by sea was given up.": "La flotte alliée a traversé une ligne de mines non détectée dans la baie d’Erenköy. Trois navires de combat ont coulé, et la tentative de forcer les détroits par la mer a été abandonnée."
"Cape Helles": "Cap Helles"
"The British 29th Division landed on five beaches at the tip of the peninsula. At V and W beaches the landing troops suffered terrible losses.": "La 29e Division britannique a atterri sur cinq plages à la pointe de la péninsule. Aux plages V et W, les troupes d’atterrissage ont subi des pertes terribles."
"Kum Kale": "Kum Kale"
"25–26 April 1915": "25–26 avril 1915"
"French troops landed on the Asian shore to draw off Ottoman forces and were withdrawn after two days.": "Les troupes françaises débarquèrent sur la côte asiatique pour se retirer des forces ottomanes et furent retirées après deux jours."
"Anzac Cove": "Anzac Cove"
"Landed further north than planned, the Australians and New Zealanders clung to a narrow strip of steep ridges for eight months.": "Débarqués plus au nord que prévu, les Australiens et les Néo-Zélandais se sont accrochés pendant huit mois à une étroite bande de crêtes abruptes."
"Chunuk Bair": "Chunuk Bair"
"8–10 August 1915": "8–10 août 1915"
"New Zealand troops took the summit on 8 August, but Mustafa Kemal’s counter-attack drove the British off it two days later.": "Les troupes néo-zélandaises ont pris le sommet le 8 août, mais la contre-attaque de Mustafa Kemal a entraîné les Britanniques deux jours plus tard."
"Suvla Bay": "Baie de Suvla"
"6–7 August 1915": "6–7 août 1915"
"New British divisions landed almost unopposed but were slow to advance, and Ottoman troops reached the hills first.": "Les nouvelles divisions britanniques débarquèrent presque sans opposition mais tardèrent à avancer, et les troupes ottomanes atteignirent les collines en premier."
"Allied fleet, 18 March": "Flotte alliée, 18 mars"
"29th Division": "29e Division"
"Anzacs": "Anzacs"
"British and French success": "Succès britannique et français"
"British, French, Australian and New Zealand moves": "Les mouvements britanniques, français, australiens et néo-zélandais"
"Gas at Ypres, Artois and Loos": "Gaz à Ypres, Artois et Loos"
"March – October 1915": "mars – octobre 1915"
"In 1915 the French and British tried to break through the German trenches, while Germany stood mostly on the defensive in the west and sent its reserves east. A British attack at Neuve Chapelle in March took the village but could go no further. On 22 April, north of Ypres, the Germans released more than 150 tonnes of chlorine against French colonial and territorial troops, the first large-scale use of lethal gas. The line gave way over several kilometres, but Canadian and French troops closed the gap, and by late May the salient had shrunk to within a few kilometres of the town.": "En 1915, les Français et les Britanniques essayèrent de percer les tranchées allemandes, tandis que l’Allemagne se tenait principalement sur la défensive à l’ouest et envoyait ses réserves vers l’est. Une attaque britannique à Neuve Chapelle en mars prit le village mais ne put aller plus loin. Le 22 avril, au nord d’Ypres, les Allemands délivraient plus de 150 tonnes de chlore contre les troupes coloniales et territoriales françaises, première utilisation à grande échelle de gaz mortel. La ligne s’étendit sur plusieurs kilomètres, mais les troupes canadiennes et françaises fermèrent l’écart et, à la fin de mai, le saillant s’était rétréci à quelques kilomètres de la ville."
"French offensives in Artois in May and September took the Lorette spur and the villages below Vimy Ridge, whose crest they reached only to be driven off, and cost the French over 100,000 casualties in the spring alone. On 25 September the British, using gas themselves for the first time, attacked at Loos while the French attacked in Champagne. Both offensives gained a few kilometres before they were stopped. The year’s attacks cost the French and British far more men than the defenders, and in December Sir Douglas Haig replaced Sir John French as commander of the British forces in France.": "Les offensives françaises à Artois en mai et septembre ont pris l’éperon de Lorette et les villages sous la crête de Vimy, dont ils n’ont atteint que la crête pour être chassés, et ont coûté aux Français plus de 100 000 victimes au printemps seulement. Le 25 septembre, les Britanniques, utilisant eux-mêmes du gaz pour la première fois, ont attaqué à Loos pendant que les Français attaquaient à Champagne. Les attaques de l’année ont coûté aux Français et aux Britanniques beaucoup plus d’hommes que les défenseurs, et en décembre sir Douglas Haig a remplacé Sir John French comme commandant des forces britanniques en France."
"First gas attack at Ypres": "Première attaque au gaz à Ypres"
"22 April 1915": "22 avril 1915"
"Second Battle of Ypres": "Deuxième bataille d’Ypres"
