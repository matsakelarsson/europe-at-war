"The British took Loos and reached Hill 70, but reserves arrived too late and the gains were mostly lost. British casualties were some 59,000.": "Les Britanniques ont pris Loos et ont atteint la colline 70, mais les réserves sont arrivées trop tard et les gains ont été pour la plupart perdus."
