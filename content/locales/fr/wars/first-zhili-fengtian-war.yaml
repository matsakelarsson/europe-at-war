# French translations of the catalogue text (wave 9); step bodies follow later.
First Zhili–Fengtian War: Première guerre Zhili–Fengtian
? A war for control of the Beijing government between the Zhili clique of Cao Kun and Wu Peifu and the Fengtian clique of Zhang Zuolin, the former allies of 1920. Their quarrel came to a head when Zhang had his candidate, Liang Shiyi, made premier in December 1921 and Wu forced him out. Each side brought about 100,000–120,000 men into Zhili (today Hebei), and fighting began at the end of April 1922. On the western front, along the railway south-west of Beijing at Changxindian and Liulihe, Wu Peifu ambushed and outflanked the Fengtian army and broke it in early May; on the eastern front, near Machang and Junliangcheng south and east of Tianjin, Zhili reinforcements arriving by rail defeated the Fengtian reserves. The Fengtian army lost about 20,000 dead and 40,000 captured or surrendered, and Zhang withdrew beyond the Shanhai Pass, which became the line between the two cliques. A British consul arranged talks, and peace was signed on 18 June aboard a British warship off Qinhuangdao. Zhang went on to govern the three north-eastern provinces independently of Beijing and to rebuild his army, while the Zhili clique dominated the Beijing government until 1924.
: Une guerre pour le contrôle du gouvernement de Pékin entre la clique du Zhili de Cao Kun et Wu Peifu et la clique du Fengtian de Zhang Zuolin, alliées en 1920. Leur querelle atteignit son paroxysme lorsque Zhang fit nommer son candidat, Liang Shiyi, Premier ministre en décembre 1921 et que Wu le contraignit à partir. Chaque camp fit entrer environ 100 000 à 120 000 hommes dans le Zhili (l’actuel Hebei), et les combats commencèrent à la fin d’avril 1922. Sur le front ouest, le long de la voie ferrée au sud-ouest de Pékin, à Changxindian et à Liulihe, Wu Peifu tendit une embuscade à l’armée du Fengtian, la déborda et la brisa au début de mai ; sur le front est, près de Machang et de Junliangcheng, au sud et à l’est de Tianjin, des renforts du Zhili arrivés par le train battirent les réserves du Fengtian. L’armée du Fengtian perdit environ 20 000 morts et 40 000 prisonniers ou hommes qui s’étaient rendus, et Zhang se retira au-delà de la passe de Shanhai, qui devint la ligne de partage entre les deux cliques. Un consul britannique organisa des pourparlers, et la paix fut signée le 18 juin à bord d’un navire de guerre britannique au large de Qinhuangdao. Zhang gouverna ensuite les trois provinces du Nord-Est indépendamment de Pékin et reconstitua son armée, tandis que la clique du Zhili domina le gouvernement de Pékin jusqu’en 1924.
