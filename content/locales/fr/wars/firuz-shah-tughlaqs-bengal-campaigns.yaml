# French translations of the catalogue text (wave 8); step bodies follow later.
Firuz Shah Tughlaq’s Bengal campaigns: Campagnes de Firuz Shah Tughlaq au Bengale
Two attempts by Firuz Shah Tughlaq, sultan of Delhi, to win back Bengal, which had broken away under Muhammad bin Tughluq and been united in 1352 by Shamsuddin Ilyas Shah, who had also raided Nepal and Odisha. In November 1353 Firuz marched east with a large army, occupied Ilyas’s capital Pandua and besieged him in Ekdala, a mud fort ringed by rivers and marshes. After about two months, and a battle in which the Bengal army, pursuing a feigned retreat, suffered heavy losses, Firuz withdrew before the rains in 1354 without taking the fort. In 1358–1359, after Ilyas’s death, he marched again, founding the city of Jaunpur on the way, and besieged Ilyas’s son Sikandar Shah in Ekdala. Again the fort held, and a peace was made with an exchange of gifts. Bengal remained an independent sultanate, ruled from Pandua and later Gaur, until the 16th century.: Deux tentatives de Firuz Shah Tughlaq, sultan de Delhi, pour reprendre le Bengale, qui avait fait sécession sous Muhammad bin Tughluq et avait été unifié en 1352 par Shamsuddin Ilyas Shah, lequel avait aussi lancé des raids sur le Népal et l’Odisha. En novembre 1353, Firuz marcha vers l’est avec une grande armée, occupa Pandua, la capitale d’Ilyas, et assiégea celui-ci dans Ekdala, un fort de terre entouré de rivières et de marais. Au bout d’environ deux mois, et après une bataille où l’armée du Bengale, lancée à la poursuite d’une feinte retraite, subit de lourdes pertes, Firuz se retira avant les pluies, en 1354, sans avoir pris le fort. En 1358–1359, après la mort d’Ilyas, il se remit en marche, fonda en chemin la ville de Jaunpur et assiégea Sikandar Shah, fils d’Ilyas, dans Ekdala. Le fort tint de nouveau, et la paix fut conclue par un échange de présents. Le Bengale demeura un sultanat indépendant, gouverné depuis Pandua puis depuis Gaur, jusqu’au XVIe siècle.
