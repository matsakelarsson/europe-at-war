"Fitna of al-Andalus": "Fitna d’al-Andalus"
"The civil war that destroyed the caliphate of Córdoba. A coup against Almanzor’s son in 1009 set the people of Córdoba, the Berber troops and the Slav generals against each other, with Castilian and Catalan armies hired by rival caliphs; Córdoba and the palace city of Madinat al-Zahra were sacked, and after two decades in which Umayyad and Hammudid caliphs came and went, the caliphate was abolished in 1031 and al-Andalus broke up into taifa kingdoms.": "La guerre civile qui a détruit le califat de Cordoue. En 1009, un coup d’État contre Almanzor, fils de Córdoba, les troupes berbères et les généraux slaves se sont affrontés, avec des armées castilliennes et catalanes engagées par des califes rivales ; Cordoba et la ville du palais de Madinat al-Zahra ont été saccagés, et après deux décennies au cours desquelles omeyyades et califes Hammudid sont venus et allés, le califat a été aboli en 1031 et al-Andalus s’est séparé en royaumes de taifa."
"Fitna is Arabic for strife or civil war. The sources, written later and mostly by Andalusi authors hostile to the Berbers, disagree on many dates; those given here are the ones most historians accept.": "Fitna est arabe pour les conflits ou la guerre civile. Les sources, écrites plus tard et principalement par des auteurs andalous hostiles aux berbères, sont en désaccord à de nombreuses dates ; ceux donnés ici sont ceux que la plupart des historiens acceptent."
"The Slavs (Saqaliba) were soldiers and officials of European, often slave, origin. The Berbers were North African troops brought over in large numbers by Almanzor.": "Les Slaves (Saqaliba) étaient des soldats et des officiels d’origine européenne, souvent esclave. Les Berbères étaient des troupes nord-africaines amenées en grand nombre par Almanzor."
"The war is part of the longer story told in the Reconquista.": "La guerre fait partie de l’histoire plus longue racontée dans la Reconquista."
