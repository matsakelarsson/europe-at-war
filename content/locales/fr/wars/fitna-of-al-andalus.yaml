"1016–1031": "1016–1031"
"Sulayman ruled a shrunken realm. Slav generals had taken over the east around Almería, Denia and Valencia, and Berber chiefs held much of the south. In 1016 Ali ibn Hammud, governor of Ceuta and a descendant of the Prophet’s family, claimed that the vanished Hisham II had named him heir, took Córdoba, executed Sulayman and made himself caliph. For fifteen years Hammudids and Umayyads followed one another on the throne, some for only weeks, while real power passed to local rulers.": "En 1016, Ali ibn Hammud, gouverneur de Ceuta et descendant de la famille du Prophète, a affirmé que le disparu Hisham II l’avait nommé héritier, pris Cordoue, exécuté Sulayman et fait lui-même calife. Pendant quinze ans, Hammoudids et Omeyyades se suivirent les uns les autres sur le trône, certains pendant seulement des semaines, tandis que le pouvoir réel passa aux dirigeants locaux."
"On 30 November 1031 the notables of Córdoba deposed the last Umayyad caliph, Hisham III, abolished the caliphate and governed the city as a council. Al-Andalus was left as a patchwork of taifa kingdoms. The Abbadids ruled Seville, the Aftasids Badajoz and the Dhul-Nunids Toledo; Zaragoza went to the Tujibids and then the Hudids, Granada to the Zirid Berbers, and the east to Slav rulers. Their rivalries let the Christian kingdoms demand tribute from them and, in time, conquer them.": "Le 30 novembre 1031, les notables de Cordoue ont déposé le dernier calife omeyyade, Hisham III, aboli le califat et gouverné la ville en tant que conseil. Al-Andalus a été laissé comme un patchwork des royaumes taifa. Les Abbadides gouvernaient Séville, les Aftasid Badajoz et les Dhul-Nunids Tolède ; Zaragoza se rendit aux Tujibids, puis aux Hudides, Grenade aux Berbères de Zirid, et à l’est aux dirigeants slaves. Leurs rivalités laissaient les royaumes chrétiens exiger d’eux un tribut et, avec le temps, les conquérir."
