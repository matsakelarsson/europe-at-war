"1009–1013": "1009–1013"
"Almanzor’s son Abd al-Malik ruled al-Andalus in the name of the caliph Hisham II until he died in 1008. His brother Abd al-Rahman, nicknamed Sanchuelo, went further and made the childless caliph name him heir, outraging the Umayyad family and the people of Córdoba. While he was campaigning against Castile early in 1009, an Umayyad prince, Muhammad, seized Córdoba, forced Hisham to abdicate and took the title al-Mahdi. Sanchuelo was killed in March, and the palace city of Almanzor’s family, Madinat al-Zahira, was plundered and destroyed.": "Le fils d’Almanzor Abd al-Malik a gouverné al-Andalus au nom du calife Hisham II jusqu’à sa mort en 1008. Son frère Abd al-Rahman, surnommé Sanchuelo, est allé plus loin et a fait le nom de calife sans enfant, l’héritier, qui dépasse la famille omeyyade et le peuple de Cordoue. Alors qu’il faisait campagne contre la Castille au début de l’année 1009, un prince omeyyade, Muhammad, s’empara de Córdoba, força Hisham à abdiquer et prit le titre d’al-Mahdi. Sanchuelo fut tué en mars, et la ville du palais d’Almanzor, la famille Madinat al-Zahira, fut pillée et détruite."
"The Berber troops whom Almanzor had brought over were hated in the city, and they set up a caliph of their own, another Umayyad, Sulayman. With help from Count Sancho García of Castile they beat al-Mahdi outside Córdoba and took the city that autumn. Al-Mahdi and the Slav general Wadih then hired the counts of Barcelona and Urgell, whose troops helped retake Córdoba in 1010 and plundered it. Al-Mahdi was murdered that July and Hisham II restored, but the Berbers sacked Madinat al-Zahra and blockaded Córdoba until they stormed it in May 1013, killing and plundering. Sulayman was caliph again, and Hisham II disappeared.": "Les troupes berbères qu’Almanzor avait amenés étaient haïes dans la ville, et ils ont mis en place un calife de leur propre, un autre Omeyyad, Sulayman. Avec l’aide du comte Sancho García de Castille, ils ont battu al-Mahdi hors Cordoue et pris la ville cet automne-là. Al-Mahdi et le général slave Wadih ont ensuite engagé les chefs d’accusation de Barcelone et Urgell, dont les troupes ont aidé à reprendre Córdoba en 1010 et l’ont pillé. Al-Mahdi a été assassiné en juillet et Hisham II restauré, mais les Berbères ont renvoyé Madinat al-Zahra et bloqué Córdoba jusqu’à ce qu’ils l’aient prise en mai 1013, tuant et pillant. Sulayman était à nouveau calife, et Hisham II disparut."
