# French translations of the catalogue text (wave 14); step bodies follow later.
Flower wars: Guerres fleuries
? "The xochiyaoyotl or “flower wars” fought for some seventy years between the Aztec Triple Alliance and the Nahua city-states of the Puebla–Tlaxcala valley east of the volcanoes: Tlaxcala, Huexotzinco and Cholula, with smaller towns such as Atlixco. The Texcocan chronicler Fernando de Alva Ixtlilxochitl, writing about 1600, says they began after the drought and famine of 1450–1454, when the rulers agreed to fight regular battles so that captives could be sacrificed to the gods. Unlike the empire’s wars of conquest, they were fought by appointment on a chosen field, with equal numbers on each side, mostly nobles, and with hand weapons rather than darts and slings, so that warriors could show their skill and take prisoners; they could be fought at any time of year. Moctezuma II told one of Cortés’s captains, Andrés de Tapia, that the empire could have conquered Tlaxcala but kept the war going to train its warriors and supply captives. Historians disagree on how far to believe this: Ross Hassig sees the flower wars as a cheap way of wearing down enemies too strong to conquer at once while the empire surrounded them, and the Tlaxcalan historian Diego Muñoz Camargo records that the Aztecs besieged Tlaxcalan towns and cut off their trade. Over time the wars became bloodier, the alliance of the valley towns frayed, and in about 1517 Cholula left the Tlaxcalan alliance and went over to the Aztecs. Tlaxcala’s long war with the Triple Alliance made it the Spaniards’ most important ally in 1519."
: "Les xochiyaoyotl ou « guerres fleuries », menées pendant quelque soixante-dix ans entre la Triple Alliance aztèque et les cités-États nahuas de la vallée de Puebla-Tlaxcala, à l’est des volcans : Tlaxcala, Huexotzinco et Cholula, ainsi que des villes plus petites comme Atlixco. Selon le chroniqueur de Texcoco Fernando de Alva Ixtlilxochitl, qui écrivait vers 1600, elles commencèrent après la sécheresse et la famine de 1450–1454, lorsque les souverains convinrent de livrer des batailles régulières afin de pouvoir sacrifier des captifs aux dieux. À la différence des guerres de conquête de l’empire, elles se livraient sur rendez-vous, sur un terrain choisi, avec un nombre égal de combattants de chaque côté, surtout des nobles, et avec des armes de corps à corps plutôt qu’avec des traits et des frondes, afin que les guerriers puissent montrer leur habileté et faire des prisonniers ; elles pouvaient avoir lieu à n’importe quelle époque de l’année. Moctezuma II déclara à l’un des capitaines de Cortés, Andrés de Tapia, que l’empire aurait pu conquérir Tlaxcala, mais qu’il entretenait la guerre pour former ses guerriers et se procurer des captifs. Les historiens ne s’accordent pas sur le crédit à accorder à ces propos : Ross Hassig voit dans les guerres fleuries un moyen peu coûteux d’user des ennemis trop puissants pour être conquis d’un seul coup, pendant que l’empire les encerclait, et l’historien tlaxcaltèque Diego Muñoz Camargo rapporte que les Aztèques assiégèrent des villes tlaxcaltèques et coupèrent leur commerce. Avec le temps, les guerres devinrent plus sanglantes, l’alliance des villes de la vallée se défit peu à peu et, vers 1517, Cholula quitta l’alliance tlaxcaltèque pour passer du côté des Aztèques. Sa longue guerre contre la Triple Alliance fit de Tlaxcala le plus important allié des Espagnols en 1519."
