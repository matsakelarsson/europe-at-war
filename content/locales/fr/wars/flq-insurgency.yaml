# French translations of the catalogue text (wave 14); step bodies follow later.
FLQ insurgency and the October Crisis: Insurrection du FLQ et crise d’Octobre
? "The bombing and kidnapping campaign of the Front de libération du Québec (FLQ), a clandestine movement of small, loosely linked cells that sought an independent, socialist Quebec by armed struggle, and the October Crisis of 1970 that ended it. Its first attacks, firebombs against army buildings in Montreal on the night of 7 March 1963, were followed by bombs in mailboxes and at federal buildings; on 20 April 1963 a bomb at an army recruiting centre killed a 65-year-old night watchman, William Vincent O’Neill. Pierre Vallières and Charles Gagnon, whose group joined the FLQ in 1965, gave it its manifesto writings. Over seven years the FLQ was blamed for more than 160 bombings, armed robberies and other attacks, the largest of which, at the Montreal Stock Exchange on 13 February 1969, injured 27 people; in all about eight people were killed. On 5 October 1970 the Liberation cell kidnapped the British trade commissioner, James Cross, in Montreal, and on 10 October the Chénier cell kidnapped Quebec’s labour minister, Pierre Laporte. At the request of the Quebec government and the city of Montreal, the army was sent into Quebec on 15 October, and early on 16 October Pierre Trudeau’s federal government invoked the War Measures Act, the only time it was used in peacetime: civil liberties were suspended and some 450–500 people, among them singers, poets and union leaders, were arrested without charge, nearly all of them later released. Laporte was found dead in the trunk of a car on 17 October. Cross was freed on 3 December 1970 in exchange for safe passage to Cuba for five members of the Liberation cell, and on 28 December police found Paul and Jacques Rose and Francis Simard of the Chénier cell in a farmhouse at Saint-Luc; Paul Rose and Simard were convicted of Laporte’s murder, and Jacques Rose, acquitted of kidnapping and murder, of being an accessory after the fact. The FLQ lost what public sympathy it had and did not act again, and the movement for independence turned to the Parti Québécois, which won the Quebec election of 1976."
: "La campagne d’attentats à la bombe et d’enlèvements du Front de libération du Québec (FLQ), mouvement clandestin formé de petites cellules peu liées entre elles qui visait, par la lutte armée, un Québec indépendant et socialiste, et la crise d’Octobre de 1970, qui y mit fin. Ses premières attaques, des bombes incendiaires lancées contre des bâtiments de l’armée à Montréal dans la nuit du 7 mars 1963, furent suivies de bombes dans des boîtes aux lettres et contre des édifices fédéraux ; le 20 avril 1963, une bombe placée dans un centre de recrutement de l’armée tua un veilleur de nuit de 65 ans, William Vincent O’Neill. Pierre Vallières et Charles Gagnon, dont le groupe rejoignit le FLQ en 1965, lui donnèrent ses textes doctrinaux. En sept ans, le FLQ se vit imputer plus de 160 attentats à la bombe, vols à main armée et autres attaques, dont le plus important, à la Bourse de Montréal le 13 février 1969, fit 27 blessés ; au total, environ huit personnes furent tuées. Le 5 octobre 1970, la cellule Libération enleva à Montréal le délégué commercial britannique James Cross, et le 10 octobre la cellule Chénier enleva le ministre québécois du Travail, Pierre Laporte. À la demande du gouvernement du Québec et de la Ville de Montréal, l’armée fut envoyée au Québec le 15 octobre et, aux premières heures du 16 octobre, le gouvernement fédéral de Pierre Trudeau invoqua la Loi sur les mesures de guerre, la seule fois où elle fut appliquée en temps de paix : les libertés civiles furent suspendues et quelque 450 à 500 personnes, parmi lesquelles des chanteurs, des poètes et des dirigeants syndicaux, furent arrêtées sans inculpation, puis presque toutes relâchées. Laporte fut retrouvé mort dans le coffre d’une voiture le 17 octobre. Cross fut libéré le 3 décembre 1970 en échange d’un sauf-conduit vers Cuba pour cinq membres de la cellule Libération, et le 28 décembre la police trouva Paul et Jacques Rose et Francis Simard, de la cellule Chénier, dans une ferme de Saint-Luc ; Paul Rose et Simard furent reconnus coupables du meurtre de Laporte, et Jacques Rose, acquitté de l’enlèvement et du meurtre, fut reconnu coupable de complicité après le fait. Le FLQ perdit le peu de sympathie dont il jouissait dans la population et n’agit plus, et le mouvement indépendantiste se tourna vers le Parti québécois, qui remporta les élections québécoises de 1976."
