"Forest Brothers": "Frères des forêts"
"An armed resistance against Soviet rule in Estonia, Latvia and Lithuania after the Red Army returned in 1944. Tens of thousands of partisans, the “Forest Brothers”, fought from forest bases, strongest in Lithuania, until mass deportations such as Operation Priboi in March 1949, forced collectivisation and infiltration by the security services broke the movement by the mid-1950s.": "Une résistance armée contre le pouvoir soviétique en Estonie, Lettonie et Lituanie après le retour de l’armée rouge en 1944. Des dizaines de milliers de partisans, les Frères Forests, se sont battus à partir des bases forestières, les plus fortes en Lituanie, jusqu’à des déportations massives telles que l’opération Priboi en mars 1949, ont forcé la collectivisation et l’infiltration par les services de sécurité a brisé le mouvement au milieu des années 1950."
"The Soviet Union annexed the Baltic states in 1940, and the map shows them as Soviet republics. Most Western states never recognised the annexation.": "L’Union soviétique a annexé les États baltes en 1940, et la carte les montre comme des républiques soviétiques. La plupart des États occidentaux n’ont jamais reconnu l’annexion."
"Numbers of partisans, dead and deported come from Soviet records and later research, and differ between sources; they are given as estimates.": "Le nombre de partisans, morts et déportés proviennent des archives soviétiques et de recherches ultérieures, et diffèrent d’une source à l’autre ; ils sont donnés en tant qu’estimations."
"The partisans were called metsavennad in Estonia, mežabrāļi in Latvia and partizanai or žaliukai in Lithuania.": "Les partisans ont été appelés metsavennad en Estonie, mežabrāшi en Lettonie et partizanai ou žaliukai en Lituanie."
