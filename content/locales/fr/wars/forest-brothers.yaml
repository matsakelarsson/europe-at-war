"Deportations and defeat": "Déportations et défaites"
"1949–1956": "1949–1956"
"In February 1949 Lithuanian partisan commanders met in a bunker at Minaičiai and united as the Union of Lithuanian Freedom Fighters under Jonas Žemaitis, declaring on 16 February that they were the lawful authority of an independent, democratic Lithuania. Five weeks later, on 25–28 March, Soviet security forces carried out Operation Priboi. More than 90,000 people, about 20,000 from Estonia, 42,000 from Latvia and 29,000–32,000 from Lithuania, were loaded onto freight trains and sent to settlements in Siberia as “kulaks”, “nationalists” and families of “bandits”. Over 70 per cent were women and children under 16.": "En février 1949, les commandants partisans lituaniens se sont rencontrés dans un bunker à Minaičiai et se sont unis comme l’Union des combattants lituaniens de la liberté sous Jonas Žemaitis, déclarant le 16 février qu’ils étaient l’autorité légale d’une Lituanie indépendante et démocratique. Cinq semaines plus tard, les 25 et 28 mars, les forces de sécurité soviétiques ont mené l’opération Priboi. Plus de 90 000 personnes, environ 20 000 en provenance d’Estonie, 42 000 en provenance de Lettonie et 29 000 à 32 000 en provenance de Lituanie, ont été chargées dans des trains de marchandises et envoyées dans des colonies de Sibérie sous la forme de -koulaks, de nationalistes et de familles de -bandits."
"The deportations drove the remaining farmers into collective farms and stripped the partisans of food and shelter. Agents planted among them, and the betrayal of British intelligence operations to the Soviets, destroyed many bands. Žemaitis was captured in 1953 and shot in Moscow in 1954, and the partisan commander Adolfas Ramanauskas was arrested in Kaunas in October 1956 and executed the next year. After amnesties following Stalin’s death many survivors gave up, although a few held out for decades. The resistance cost at least 50,000 lives, most of them in Lithuania.": "Les déportations ont conduit les agriculteurs restants dans des fermes collectives et dépouillé les partisans de la nourriture et de l’abri. Des agents y ont planté, et la trahison des opérations de renseignement britanniques aux Soviétiques, détruit de nombreuses bandes. Žemaitis a été capturé en 1953 et abattu à Moscou en 1954, et le commandant partisan Adolfas Ramanauskas a été arrêté à Kaunas en octobre 1956 et exécuté l’année suivante. Après les amnisties qui suivirent la mort de Staline, beaucoup de survivants abandonnèrent, bien que quelques-uns s’arrêtèrent pendant des décennies. La résistance coûta au moins 50 000 vies, la plupart en Lituanie."
