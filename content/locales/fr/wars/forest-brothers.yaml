"1944–1948": "1944–1948"
"The Red Army drove the Germans out of most of the Baltic states in 1944, taking Vilnius in July, Tallinn in September and Riga in October, and Soviet rule, first imposed in 1940, returned with arrests and conscription. Tens of thousands of men, and some women, went into the forests. Some were former soldiers of German-raised units, others had fled call-up into the Red Army, and many hoped that the Western Allies, who had never recognised the annexation, would restore independence. Estimates put the armed partisans at about 30,000 in Lithuania at the end of 1945 and some 10,000–15,000 each in Latvia and Estonia.": "L’armée rouge a chassé les Allemands de la plupart des États baltes en 1944, prenant Vilnius en juillet, Tallinn en septembre et Riga en octobre, et le pouvoir soviétique, imposé pour la première fois en 1940, est revenu avec des arrestations et des conscriptions. Certains étaient d’anciens soldats d’unités élevées en Allemagne, d’autres avaient fui l’appel à l’armée rouge et beaucoup espéraient que les Alliés occidentaux, qui n’avaient jamais reconnu l’annexion, rétabliraient leur indépendance. Selon les estimations, les partisans armés seraient environ 30 000 en Lituanie à la fin de 1945 et environ 10 000 à 15 000 chacun en Lettonie et en Estonie."
"The resistance was largest and best organised in Lithuania, where partisan districts held much of the countryside after dark until 1949. They ambushed troops, killed Soviet officials and people they regarded as collaborators, among them civilians, and printed underground newspapers. In the biggest battles partisans fought NKVD regiments from fortified forest camps, as at Stompaki in Latvia in March 1945 and at Kalniškės in southern Lithuania that May. The NKVD and local “destruction battalions” answered with sweeps, informers and reprisals against families, and laid out the bodies of dead partisans in town squares. In May 1948 about 40,000 Lithuanians were deported in Operation Vesna.": "La résistance était plus grande et mieux organisée en Lituanie, où les districts partisans tenaient une bonne partie de la campagne après la tombée de la nuit jusqu’en 1949. Ils ont embusqué des troupes, tué des responsables soviétiques et des personnes qu’ils considéraient comme des collaborateurs, parmi lesquels des civils, et imprimé des journaux clandestins. Le NKVD et les bataillons locaux de Destruction ont répondu par des balayages, des informateurs et des représailles contre les familles, et ont déposé les corps de partisans morts sur les places de la ville. En mai 1948, environ 40 000 Lituaniens ont été déportés dans l’opération Vesna."
