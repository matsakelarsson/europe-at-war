# French translations of the catalogue text (wave 10); step bodies follow later.
Former Nine Years’ War: Guerre de Zenkunen
? "The war in which the governor of Mutsu, Minamoto no Yoriyoshi, destroyed the Abe, a family of Emishi descent who ruled the six districts of the Kitakami basin in northern Honshu almost as an independent power. After the Abe defeated a governor at Onikiribe around 1051, the court sent Yoriyoshi, a warrior of the Kawachi branch of the Minamoto, as governor and later frontier commander. Peace held until 1056, when an attack on his officials at the Akuto River, blamed on Abe no Sadato, led to open war. Abe no Yoritoki was killed in 1057, but his son Sadato routed Yoriyoshi at Kinomi in a snowstorm that winter, and for five years the Abe collected taxes south of their border while the governor could do nothing. In 1062 Yoriyoshi won over the Kiyohara, an Emishi-descended family of Dewa, whose 10,000 men turned the war: within six weeks the allies took the Abe forts one after another, and on the 17th day of the ninth month of 1062 Kuriyagawa, near today’s Morioka, fell to fire. Sadato died of his wounds, and his brother-in-law Fujiwara no Tsunekiyo was beheaded. The Kiyohara inherited the Abe lands, and the victory became a founding legend of the Minamoto warrior house."
: "La guerre au cours de laquelle le gouverneur de Mutsu, Minamoto no Yoriyoshi, anéantit les Abe, une famille d’ascendance emishi qui gouvernait les six districts du bassin du Kitakami, dans le nord de Honshu, comme une puissance presque indépendante. Après que les Abe eurent battu un gouverneur à Onikiribe vers 1051, la cour envoya Yoriyoshi, guerrier de la branche Kawachi des Minamoto, comme gouverneur, puis comme commandant de la frontière. La paix tint jusqu’en 1056, quand une attaque contre ses fonctionnaires sur la rivière Akuto, imputée à Abe no Sadato, déclencha une guerre ouverte. Abe no Yoritoki fut tué en 1057, mais son fils Sadato mit Yoriyoshi en déroute à Kinomi, dans une tempête de neige, l’hiver suivant, et pendant cinq ans les Abe levèrent l’impôt au sud de leur frontière sans que le gouverneur pût rien faire. En 1062, Yoriyoshi gagna à sa cause les Kiyohara, une famille de Dewa d’ascendance emishi, dont les 10 000 hommes firent basculer la guerre : en six semaines, les alliés prirent les forts des Abe l’un après l’autre et, le 17e jour du neuvième mois de 1062, le fort de Kuriyagawa, près de l’actuelle Morioka, tomba, livré aux flammes. Sadato mourut de ses blessures et son beau-frère Fujiwara no Tsunekiyo fut décapité. Les Kiyohara héritèrent des terres des Abe, et la victoire devint une légende fondatrice de la maison guerrière des Minamoto."
