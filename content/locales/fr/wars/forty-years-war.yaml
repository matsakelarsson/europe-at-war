# French translations of the catalogue text (wave 11); step bodies follow later.
Forty Years’ War: Guerre de Quarante Ans
? "The intermittent war between Ava, the Burmese kingdom of Upper Burma, and Hanthawaddy, the Mon-speaking kingdom of Lower Burma with its capital at Pegu, fought between 1385 and 1423 in four rounds separated by truces. Ava’s kings, who saw themselves as heirs of Pagan, tried to bring the south under their rule; Hanthawaddy’s king Razadarit, who came to the throne in 1384 at sixteen, defended its independence and carried the war up the Irrawaddy. Ava was first invited in by a rebel viceroy in the delta, which Razadarit then conquered (1385–1391). He took his fleet up the Irrawaddy as far as Ava in 1401–1403; the two kingdoms then fought over Arakan, which changed hands several times, while the Ming court and the Shan state of Hsenwi opened a northern front against Ava. Ava’s crown prince Minye Kyawswa overran the delta in 1414–1415 but was killed at Dala in March 1415, and after his death the war lost its force. Both kings died in 1421, and a last campaign ended in 1423 with a marriage of state. Neither side gained lasting territory: Hanthawaddy kept its independence, and Ava’s attempt to restore the realm of Pagan failed."
: "La guerre intermittente entre Ava, le royaume birman de Haute-Birmanie, et Hanthawaddy, le royaume de langue môn de Basse-Birmanie dont la capitale était Pégou, livrée entre 1385 et 1423 en quatre épisodes séparés par des trêves. Les rois d’Ava, qui se considéraient comme les héritiers de Pagan, cherchèrent à soumettre le sud ; le roi de Hanthawaddy, Razadarit, monté sur le trône en 1384 à seize ans, défendit l’indépendance du royaume et porta la guerre en amont de l’Irrawaddy. Ava intervint d’abord à l’appel d’un vice-roi rebelle du delta, que Razadarit conquit ensuite (1385–1391). Il remonta l’Irrawaddy avec sa flotte jusqu’à Ava en 1401–1403 ; les deux royaumes se disputèrent ensuite l’Arakan, qui changea plusieurs fois de mains, tandis que la cour des Ming et l’État shan de Hsenwi ouvraient un front nord contre Ava. Le prince héritier d’Ava, Minye Kyawswa, envahit le delta en 1414–1415, mais fut tué à Dala en mars 1415, et après sa mort la guerre perdit de sa vigueur. Les deux rois moururent en 1421, et une dernière campagne s’acheva en 1423 par un mariage politique. Aucun des deux camps ne fit de gain territorial durable : Hanthawaddy conserva son indépendance, et la tentative d’Ava de restaurer le royaume de Pagan échoua."
