# French translations of the catalogue text (wave 13); step bodies follow later.
Fourth Anglo-Ashanti War: Quatrième guerre anglo-ashanti
? The British occupation of Kumasi in 1896 and the exile of the Asantehene, Prempeh I. After the war of 1873–1874 the Asante Empire had lost its southern provinces and gone through years of civil war, but Prempeh, enstooled in 1888, restored much of its unity. Britain, anxious to keep France and Germany out of the interior and its gold and rubber, offered him a protectorate in 1891, which he declined, and pressed for a British resident in Kumasi and payment of the indemnity left from 1874. An Asante embassy led by John Owusu Ansa went to London in 1895 to negotiate but was refused a hearing, and a British expedition under Colonel Sir Francis Scott, with British and West India Regiment troops, Gold Coast Hausa police and a levy raised by Major Robert Baden-Powell, left Cape Coast in December 1895. Prempeh ordered his people not to resist, and Scott entered Kumasi on 17 January 1896 without a shot being fired. On 20 January Prempeh made his formal submission; when he could not pay the indemnity demanded, he was arrested with the queen mother, Yaa Akyaa, and other leading chiefs. They were held at Elmina, then in Sierra Leone, and from 1900 in the Seychelles; Prempeh returned only in 1924. Disease killed some 18 Europeans of the expedition, among them Queen Victoria’s son-in-law Prince Henry of Battenberg. Britain declared a protectorate over Asante, built a fort in Kumasi and stationed a resident there, and four years later its demand for the Golden Stool led to the War of the Golden Stool.
: L’occupation britannique de Kumasi en 1896 et l’exil de l’Asantehene Prempeh Ier. Après la guerre de 1873–1874, l’empire ashanti avait perdu ses provinces méridionales et traversé des années de guerre civile, mais Prempeh, intronisé en 1888, avait restauré en grande partie son unité. La Grande-Bretagne, soucieuse de tenir la France et l’Allemagne à l’écart de l’intérieur, de son or et de son caoutchouc, lui proposa en 1891 un protectorat, qu’il déclina, et fit pression pour obtenir l’installation d’un résident britannique à Kumasi et le paiement de l’indemnité restée due depuis 1874. Une ambassade ashanti conduite par John Owusu Ansa se rendit à Londres en 1895 pour négocier, mais ne fut pas reçue, et une expédition britannique commandée par le colonel sir Francis Scott, avec des troupes britanniques et du West India Regiment, la police haoussa de la Côte-de-l’Or et une levée recrutée par le major Robert Baden-Powell, quitta Cape Coast en décembre 1895. Prempeh ordonna à son peuple de ne pas résister, et Scott entra dans Kumasi le 17 janvier 1896 sans qu’un coup de feu soit tiré. Le 20 janvier, Prempeh fit sa soumission officielle ; ne pouvant payer l’indemnité exigée, il fut arrêté avec la reine mère, Yaa Akyaa, et d’autres grands chefs. Ils furent détenus à Elmina, puis en Sierra Leone et, à partir de 1900, aux Seychelles ; Prempeh ne revint qu’en 1924. La maladie emporta quelque 18 Européens de l’expédition, parmi lesquels le gendre de la reine Victoria, le prince Henri de Battenberg. La Grande-Bretagne proclama un protectorat sur l’Ashanti, construisit un fort à Kumasi et y installa un résident, et quatre ans plus tard sa revendication du Tabouret d’or déclencha la guerre du Tabouret d’or.
