"Pope Innocent III called a new crusade in 1198 to recover Jerusalem, this time by attacking Egypt, the centre of Ayyubid power. Its leaders, mostly French and Flemish nobles under Boniface of Montferrat, agreed in 1201 that Venice would build a fleet to carry 33,500 men and 4,500 horses for 85,000 marks of silver. Venice put much of its trade aside for a year to build and crew the ships. But in the summer of 1202 only about a third of the expected army came to Venice, and the crusaders could not pay.": "Le pape Innocent III a appelé une nouvelle croisade en 1198 pour récupérer Jérusalem, cette fois-ci en attaquant l’Egypte, le centre de la puissance ayyoubide. Ses dirigeants, principalement français et flamands nobles sous Boniface de Montferrat, ont convenu en 1201 que Venise allait construire une flotte pour transporter 33 500 hommes et 4500 chevaux pour 85 000 marques d’argent. Mais à l’été 1202 seulement un tiers environ de l’armée attendue est venu à Venise, et les croisés ne pouvaient pas payer."
"The aged and nearly blind doge, Enrico Dandolo, offered to put off the debt if the crusaders helped Venice recover Zara (Zadar), a Dalmatian port that had rebelled against Venice and put itself under the King of Hungary, who had himself taken the cross. Despite the pope’s ban, the fleet sailed in October 1202, reached Zara on 10 November and took it on 24 November; the city was sacked. Some crusaders, among them Simon de Montfort, refused to take part. Innocent excommunicated the army, then absolved the crusaders but not the Venetians.": "Le vieux et presque aveugle, Enrico Dandolo, a offert de repousser la dette si les croisés ont aidé Venise à récupérer Zara (Zadar), un port dalmate qui s’était rebellé contre Venise et s’est mis sous le roi de Hongrie, lui-même avait pris la croix. Malgré l’interdiction du pape, la flotte navigua en octobre 1202, atteignit Zara le 10 novembre et la prit le 24 novembre ; la ville fut saccagée. Certains croisés, parmi lesquels Simon de Montfort, refusèrent de participer. Innocent excommunia l’armée, puis absout les croisés mais pas les Vénitiens."
"At Zara envoys came from Alexios Angelos, son of the Byzantine emperor Isaac II, whom his brother Alexios III had deposed and blinded in 1195. If he were put on the throne, the young Alexios promised 200,000 marks, 10,000 soldiers for the crusade, 500 knights to guard the Holy Land and the submission of the Greek Church to Rome. Most of the leaders accepted, though many crusaders objected and some left for Syria on their own, and in April 1203 the fleet sailed for Constantinople.": "À Zara, les envoyés venaient d’Alexios Angelos, fils de l’empereur byzantin Isaac II, que son frère Alexios III avait déposé et aveuglé en 1195. S’il était mis sur le trône, le jeune Alexios promettait 200 000 marques, 10 000 soldats pour la croisade, 500 chevaliers pour garder la Terre Sainte et la soumission de l’Église grecque à Rome. La plupart des dirigeants acceptèrent, bien que de nombreux croisés s’opposèrent et certains partirent pour la Syrie eux-mêmes, et en avril 1203, la flotte partit pour Constantinople."
