"In January 1204 a revolt in the city ended the crusaders’ hopes of payment. The courtier Alexios Doukas, known as Mourtzouphlos, seized the throne as Alexios V, had Alexios IV strangled on 8 February (Isaac II had already died) and broke with the Latins. Short of food and camped outside the walls, the crusaders and Venetians decided to take the city for themselves, and their clergy told them the war against the schismatic Greeks was just. In March they agreed how to share the conquest. Six Venetians and six crusaders would elect a Latin emperor, who would have a quarter of the empire, and the rest would be divided equally between Venice and the crusaders.": "En janvier 1204, une révolte dans la ville a mis fin aux espoirs de paiement des croisés. Le courtisan Alexios Doukas, connu sous le nom de Mourtzouphlos, s’est emparé du trône comme Alexios V, a fait étrangler Alexios IV le 8 février (Isaac II était déjà mort) et a rompu avec les latins. À court de nourriture et campé à l’extérieur des murs, les croisés et les Vénitiens ont décidé de prendre la ville pour eux-mêmes, et leur clergé leur a dit la guerre contre les Grecs schismatiques était juste. En mars ils ont convenu comment partager la conquête. Six Vénitiens et six croisés éliraient un empereur Latin, qui aurait un quart de l’empire, et le reste serait divisé également entre Venise et les croisés."
"A first assault from the ships on the Golden Horn on 9 April was driven off. On 12 April the attack was renewed; ships lashed together in pairs reached the towers, and knights forced their way through a walled-up gate. Alexios V fled in the night, and on the morning of 13 April the city lay open. For three days it was sacked. Soldiers killed and raped, churches and monasteries were plundered, and the altar of Hagia Sophia was broken up for its silver, as the historian Niketas Choniates, who fled the city, recorded.": "Un premier assaut des navires sur la Corne d’Or le 9 avril a été chassé. Le 12 avril, l’attaque a été renouvelée ; les navires se sont rassemblés par paires jusqu’aux tours, et les chevaliers ont forcé leur passage à travers une porte fortifiée. Alexios V s’est enfui dans la nuit, et le matin du 13 avril la ville était ouverte. Des soldats ont été tués et violés, des églises et des monastères ont été pillés, et l’autel de Hagia Sophia a été brisé pour son argent, comme l’a enregistré l’historien Niketas Choniates, qui s’est enfui de la ville."
"Much of the loot was melted down, and relics and treasures went west, among them the four bronze horses now at St Mark’s in Venice. Innocent III, who had forbidden attacks on Christians, condemned the crusaders’ violence, though he accepted the new Latin Church in Constantinople. The sack deepened the hostility between Greek and Latin Christians for centuries; in 2001 and 2004 Pope John Paul II expressed sorrow for it.": "Une grande partie du butin a été fondue, et les reliques et les trésors sont allés à l’ouest, parmi eux les quatre chevaux de bronze maintenant à Saint Marc de Venise. Innocent III, qui avait interdit les attaques contre les chrétiens, a condamné la violence des croisés, bien qu’il ait accepté la nouvelle Église latine à Constantinople. Le sac approfondit l’hostilité entre les chrétiens grecs et latins pendant des siècles ; en 2001 et 2004 le pape Jean-Paul II a exprimé sa tristesse pour elle."
