"May 1204 – 1205": "mai 1204 – 1205"
"On 9 May 1204 the electors chose Count Baldwin of Flanders rather than Boniface as emperor; he was crowned in Hagia Sophia on 16 May, and a Venetian, Thomas Morosini, became Latin patriarch. A treaty of partition gave the emperor Constantinople and the lands around it, and Venice three-eighths of the empire, from which it chose ports and islands for its trade. Boniface took Thessalonica as a kingdom under the emperor and sold Venice his claim to Crete. Much of this had still to be conquered.": "Le 9 mai 1204, les électeurs choisissent le comte Baldwin de Flandre plutôt que Boniface comme empereur ; il est couronné à Hagia Sophia le 16 mai et un vénitien, Thomas Morosini, devient patriarche latin. Un traité de partition donne l’empereur Constantinople et les terres qui l’entourent, et Venise trois-huitièmes de l’empire, dont il choisit les ports et les îles pour son commerce. Boniface prit Thessalonique comme royaume sous l’empereur et vendit Venise sa revendication à la Crète. Une grande partie de celle-ci devait encore être conquise."
"That autumn the Franks spread out. Boniface marched through Thessaly into Greece; Othon de la Roche became lord of Athens and Thebes, and William of Champlitte and Geoffrey of Villehardouin, nephew of the chronicler, conquered most of the Peloponnese, beating local forces at the olive grove of Kountouras in 1205 and founding the Principality of Achaea. In Asia Minor Latin knights beat Theodore Laskaris at Poimanenon in December 1204. But Greek states survived at Nicaea under Laskaris, at Trebizond, where the Komnenos brothers had taken power with Georgian help in April 1204, and in Epirus under Michael Komnenos Doukas.": "Cet automne-là, les Francs s’étendirent. Boniface marcha à travers Thessalie en Grèce ; Othon de la Roche devint seigneur d’Athènes et de Thébes, et Guillaume de Champlitte et Geoffrey de Villehardouin, neveu du chroniqueur, conquiert la plupart des Péloponnèses, battant les forces locales à l’oliveraie de Kountoras en 1205 et fondant la Principauté d’Achaïe. En Asie, des chevaliers latins mineurs ont battu Theodore Laskaris à Poimanenon en décembre 1204. Mais les États grecs ont survécu à Nicée sous Laskaris, à Trebizond, où les frères Komnenos avaient pris le pouvoir avec l’aide géorgienne en avril 1204 et à Epirus sous Michael Komnenos Doukas."
