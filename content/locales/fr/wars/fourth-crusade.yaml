"Fourth Crusade": "Quatrième croisade"
"A crusade called by Pope Innocent III to recover Jerusalem by way of Egypt, which instead sacked the Christian city of Zara in 1202 and, after taking up the cause of the exiled Byzantine prince Alexios Angelos, captured and sacked Constantinople in April 1204. The crusaders and Venice divided the Byzantine Empire among themselves, founding the Latin Empire and Latin lordships in Greece, while Byzantine successor states arose at Nicaea, Trebizond and in Epirus. The Latin emperor Baldwin was captured by the Bulgarians at Adrianople in 1205.": "Une croisade appelée par le pape Innocent III à récupérer Jérusalem en passant par l’Egypte, qui a plutôt renvoyé la ville chrétienne de Zara en 1202 et, après avoir pris la cause du prince byzantin exilé Alexios Angelos, capturé et saccagé Constantinople en avril 1204. Les croisés et Venise divisèrent l’Empire byzantin entre eux, créant l’empire latin et les seigneuries latines en Grèce, tandis que les États successeurs byzantins surgissaient à Nicée, Trebizonde et à Epirus. L’empereur latin Baldwin fut capturé par les Bulgares à Adrianople en 1205."
"Dates are Julian. The main eyewitness accounts are by two crusaders, Geoffrey of Villehardouin, one of the leaders, and the knight Robert of Clari, and by the Byzantine official and historian Niketas Choniates, who lived through the sack.": "Les principaux témoins oculaires sont deux croisés, Geoffrey de Villehardouin, l’un des dirigeants, et le chevalier Robert de Clar, ainsi que les officiels byzantins et historiens Niketas Choniates, qui ont vécu à travers le sac."
"Historians have long argued whether the diversion to Constantinople was planned, by Venice or by the leaders, or was the result of debt, accident and opportunism. Most now favour the second view.": "Les historiens ont longtemps argumenté que le détournement vers Constantinople était planifié, par Venise ou par les dirigeants, ou était le résultat de la dette, accident et opportunisme."
"The wars of the Latin Empire with Bulgaria and with Nicaea have their own entries.": "Les guerres de l’Empire latin avec la Bulgarie et avec Nicée ont leurs propres entrées."
