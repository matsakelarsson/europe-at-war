"Adrianople and the aftermath": "Adrianople et les conséquences"
"The Greek nobles of Thrace, ill treated by their new lords, rose early in 1205 and called on Kaloyan, ruler of the Bulgarians, whose offers of alliance the Latins had scorned. Baldwin besieged Adrianople, and on 14 April 1205 Kaloyan’s army, with many Cuman horsemen, drew the Latin knights into a reckless pursuit and destroyed them. Louis of Blois was killed and Baldwin taken prisoner; he died in Bulgarian captivity. Dandolo, who helped Villehardouin lead the survivors back, died at Constantinople that summer and was buried in Hagia Sophia.": "Les nobles grecs de Thrace, mal traités par leurs nouveaux seigneurs, se levèrent au début de 1205 et appelèrent Kaloyan, chef des Bulgares, dont les offres d’alliance avaient été méprisées par les Latins. Baldwin assiégea Adrianople, et le 14 avril 1205 l’armée de Kaloyan, avec beaucoup de cavaliers Cuman, tira les chevaliers latins dans une poursuite imprudente et les détruisit. Louis de Blois a été tué et Baldwin fait prisonnier ; il est mort en captivité bulgare. Dandolo, qui a aidé Villehardouin à ramener les survivants, est décédé à Constantinople cet été et a été enterré à Hagia Sophia."
"Baldwin’s brother Henry, crowned in 1206, steadied the Latin Empire, but it remained weak, squeezed between the Bulgarians and the Greeks of Nicaea, until the Byzantines recovered Constantinople in 1261. The crusade never reached the Holy Land. Venice gained an empire of ports and islands in the Aegean that lasted for centuries, and Latin lordships in Greece outlived the Latin Empire by many years. The restored Byzantine Empire never regained its former strength, which, many historians argue, eased the Ottoman conquest of the Balkans.": "Le frère de Baldwin Henri, couronné en 1206, a maintenu l’Empire latin, mais il est resté faible, serré entre les Bulgares et les Grecs de Nicée, jusqu’à ce que les Byzantins récupèrent Constantinople en 1261. La croisade n’a jamais atteint la Terre Sainte. Venise a gagné un empire de ports et d’îles dans l’Égée qui a duré des siècles, et les seigneuries latines en Grèce ont survécu à l’empire latin de nombreuses années. L’Empire byzantin restauré n’a jamais retrouvé sa force ancienne, ce qui, selon de nombreux historiens, a facilité la conquête ottomane des Balkans."
