"June–August 1203": "juin–août 1203"
"The fleet called at Durazzo and Corfu, sailed up the Dardanelles and on 24 June 1203 anchored off Constantinople, the largest city in Christendom. The crusaders camped on the Asian shore, then on 5 July landed at Galata across the Golden Horn, took the tower that held the chain across the harbour and let the Venetian ships into the Horn. The city’s people showed no wish to welcome the young Alexios. On 17 July the crusaders attacked; the French assault near the Blachernae palace was beaten back by the Varangian Guard, but the Venetians, with the doge at their head, seized some 25 towers of the sea walls and set fire to the houses behind.": "La flotte appelée à Durazzo et Corfou, a navigué sur les Dardanelles et le 24 juin 1203 a ancré au large de Constantinople, la plus grande ville de la chrétienté. Les croisés campaient sur la rive asiatique, puis le 5 juillet a atterri à Galata en travers de la Corne d’Or, a pris la tour qui tenait la chaîne à travers le port et laisser les navires vénitiens dans la Corne. Le 17 juillet, les croisés attaquèrent ; l’assaut français près du palais de Blachernae fut repoussé par la Garde varange, mais les Vénitiens, avec la colombe à leur tête, saisirent quelque 25 tours des murs de la mer et incendient les maisons derrière."
"Alexios III led his army out but would not fight, and that night he fled with his treasure. The courtiers restored the blind Isaac II, and on 1 August his son was crowned co-emperor as Alexios IV. He paid part of what he had promised but could not raise the rest, and his efforts to bring the Church under Rome angered his subjects. In August a group of crusaders attacked a mosque in the city; the fire they started burned for days and destroyed a large part of Constantinople, and relations between the Latins and the citizens went from bad to worse.": "Alexios III conduisit son armée, mais ne voulut pas se battre, et cette nuit-là il s’enfuit avec son trésor. Les courtisans rétablirent l’aveugle Isaac II, et le 1er août son fils fut couronné coempereur comme Alexios IV. Il paya une partie de ce qu’il avait promis mais ne pouvait lever le reste, et ses efforts pour amener l’Église sous Rome en colère ses sujets. En août, un groupe de croisés a attaqué une mosquée dans la ville ; le feu qu’ils ont commencé à brûler pendant des jours et détruit une grande partie de Constantinople, et les relations entre les Latins et les citoyens sont passées de mauvais à pire."
