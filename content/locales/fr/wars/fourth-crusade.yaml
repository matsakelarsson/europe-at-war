"The citizens hung crosses on the walls to remind the besiegers that they too were Christians. The city surrendered after two weeks and was sacked and divided between the Venetians and the crusaders.": "Les citoyens ont accroché des croix sur les murs pour rappeler aux assiégeurs qu’ils étaient eux aussi chrétiens. La ville s’est rendue après deux semaines et a été larguée et divisée entre les Vénitiens et les croisés."
