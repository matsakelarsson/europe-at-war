# French translations of the catalogue text (wave 7); step bodies follow later.
Fourth Fitna: Quatrième fitna
The Abbasid civil war between two sons of Harun al-Rashid, al-Amin, caliph in Baghdad, and his half-brother al-Ma’mun, governor of Khorasan at Merv. When al-Amin tried to cut al-Ma’mun out of the succession, war broke out in 811. Al-Ma’mun’s general Tahir ibn al-Husayn beat al-Amin’s armies at Rayy and Hamadan and, after a siege of more than a year that wrecked much of Baghdad, took the city in September 813, and al-Amin was killed. Al-Ma’mun stayed in Merv, and revolts in Iraq, Arabia, Syria and Egypt and the proclamation of a rival caliph in Baghdad in 817 kept the caliphate divided until he entered Baghdad in August 819.: "La guerre civile abbasside entre deux fils de Haroun al-Rachid : al-Amin, calife à Bagdad, et son demi-frère al-Ma’mun, gouverneur du Khorassan à Merv. Quand al-Amin tenta d’écarter al-Ma’mun de la succession, la guerre éclata en 811. Le général d’al-Ma’mun, Tahir ibn al-Husayn, battit les armées d’al-Amin à Rayy et à Hamadan puis, après un siège de plus d’un an qui ravagea une grande partie de Bagdad, prit la ville en septembre 813 ; al-Amin fut tué. Al-Ma’mun resta à Merv, et des révoltes en Irak, en Arabie, en Syrie et en Égypte, ainsi que la proclamation d’un calife rival à Bagdad en 817, maintinrent le califat divisé jusqu’à son entrée dans Bagdad en août 819."
