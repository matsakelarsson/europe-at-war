"Fourth Ottoman–Venetian War": "Quatrième guerre ottomane-vénétienne"
"The War of Cyprus, in which Sultan Selim II took Venice’s richest colony. Nicosia fell in September 1570 and Famagusta in August 1571 after a siege of almost a year. Two months later the fleet of the Holy League of Spain, Venice and the pope destroyed the Ottoman fleet at Lepanto, the largest galley battle in history, but the Ottomans rebuilt their navy and Venice made a separate peace in 1573, giving up Cyprus.": "La guerre de Chypre, dans laquelle le sultan Selim II prit la colonie la plus riche de Venise. Nicosie tomba en septembre 1570 et Famagouste en août 1571 après un siège de près d’un an. Deux mois plus tard, la flotte de la Sainte Ligue d’Espagne, Venise et le pape détruisirent la flotte ottomane à Lepanto, la plus grande bataille de galère de l’histoire, mais les Ottomans rebâtirent leur marine et Venise fit une paix séparée en 1573, abandonnant Chypre."
"Dates are Julian. Figures for the fleets and the dead at Lepanto vary; the commonest estimates are about 7,500 dead on the League side and about 30,000 on the Ottoman side, and some sources give more.": "Les chiffres pour les flottes et les morts à Lepanto varient ; les estimations les plus courantes sont environ 7 500 morts du côté de la Ligue et environ 30 000 du côté ottoman, et certaines sources donnent plus."
"The Holy League was formed in May 1571 by Pope Pius V; besides Venice, Spain and the Papal States, it included Genoa, Savoy, Tuscany, the Knights of Malta and smaller Italian states. Its fleet is shown here as a separate side from Venice’s own forces on Cyprus.": "La Sainte Ligue a été formée en mai 1571 par le pape Pie V ; outre Venise, l’Espagne et les États pontificaux, elle comprenait Gênes, Savoie, Toscane, les Chevaliers de Malte et les petits États italiens."
