"Famagusta was held by Marco Antonio Bragadin with about 8,500 men and 90 guns. In January 1571 Venetian ships slipped through the blockade with men and supplies, and Selim recalled Piyale Pasha in anger, leaving Lala Mustafa in sole command. From 12 May the Ottomans bombarded the walls without pause, dug mines and made repeated assaults. Meanwhile Pope Pius V brought Venice and a reluctant Philip II of Spain together in a Holy League, concluded in May, but its fleet was not ready in time to save the city.": "En janvier 1571, les navires vénitiens ont glissé à travers le blocus avec des hommes et des fournitures, et Selim a rappelé Piyale Pasha en colère, laissant Lala Mustafa sous le seul commandement. A partir du 12 mai, les Ottomans bombardèrent les murs sans pause, creusèrent des mines et firent des assauts répétés. Pendant ce temps, le pape Pie V a réuni Venise et un hésitant Philippe II d’Espagne dans une Sainte Ligue, conclue en mai, mais sa flotte n’était pas prête à temps pour sauver la ville."
"On 1 August, with powder and food exhausted and few men left fit to fight, Bragadin surrendered on terms that let the survivors leave for Crete. A few days later, after an angry meeting in which Lala Mustafa accused him of killing Muslim prisoners, Bragadin was arrested, his officers were executed, and he was mutilated and flayed alive; his stuffed skin was later sent to Constantinople. The siege had cost the Ottomans very heavy losses, by some estimates tens of thousands of dead.": "Le 1er août, avec la poudre et la nourriture épuisées et peu d’hommes laissés en état de se battre, Bragadin s’est rendu à des conditions qui ont permis aux survivants de partir pour la Crète. Quelques jours plus tard, après une réunion en colère au cours de laquelle Lala Mustafa l’a accusé de tuer des prisonniers musulmans, Bragadin a été arrêté, ses officiers ont été exécutés, et il a été mutilé et fauché vivant ; sa peau farcie a ensuite été envoyée à Constantinople. Le siège avait coûté de lourdes pertes aux Ottomans, selon certaines estimations des dizaines de milliers de morts."
