"Nicosia": "Nicosie"
"Cyprus had been Venetian since 1489, and Venice paid the sultan a tribute for it, but the island lay deep in Ottoman waters and its harbours sheltered Christian corsairs. Selim II and his war party, against the advice of the grand vizier Sokollu Mehmed Pasha, decided to take it. In March 1570 an envoy demanded that Venice give up the island; the Senate refused. On 3 July a large Ottoman army under the sultan’s old tutor Lala Mustafa Pasha, carried by Piyale Pasha’s fleet, landed unopposed at Salines, near Larnaca, and marched on the capital, Nicosia.": "Chypre était vénitienne depuis 1489, et Venise a rendu un hommage au sultan, mais l’île se trouvait profondément dans les eaux ottomanes et ses ports abritaient les corsaires chrétiens. Selim II et son parti de guerre, contre le conseil du grand vizier Sokollu Mehmed Pasha, ont décidé de la prendre. En mars 1570, un envoyé a exigé que Venise abandonne l’île ; le Sénat a refusé. Le 3 juillet, une grande armée ottomane sous l’ancien tuteur du sultan Lala Mustafa Pasha, portée par la flotte de Piyale Pasha, débarqua sans opposition à Salines, près de Larnaca, et marcha sur la capitale, Nicosie."
"Nicosia had new star-shaped walls but too few trained soldiers. The siege began on 22 July, and on 9 September the Ottomans stormed the city. Some 20,000 of its people are thought to have been killed, and many women and children were sold as slaves. Kyrenia then surrendered without a fight, and on 15 September Ottoman cavalry appeared before Famagusta, the last Venetian stronghold. A relief fleet of Venetian, papal and Spanish galleys, assembled late at Crete, heard of Nicosia’s fall at sea and turned back.": "Nicosie avait de nouveaux murs en forme d’étoiles mais trop peu de soldats entraînés. Le siège a commencé le 22 juillet, et le 9 septembre les Ottomans ont pris l’assaut de la ville. Environ 20 000 de ses habitants auraient été tués, et beaucoup de femmes et d’enfants ont été vendus comme esclaves. Kyrenia s’est ensuite rendue sans se battre, et le 15 septembre la cavalerie ottomane est apparue devant Famagusta, la dernière forteresse vénitienne. Une flotte de secours de galères vénitiennes, papales et espagnoles, réunies tard en Crète, entendit parler de Nicosie tomber en mer et se retourner."
