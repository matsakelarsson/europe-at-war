"The League fleet gathered at Messina under Don John of Austria, Philip II’s half-brother, and sailed in mid-September, still unaware that Famagusta had fallen. It had about 206 galleys and six Venetian galleasses, heavy gun-ships, against the Ottoman admiral Müezzinzade Ali Pasha’s 210 or so galleys and some 60 galliots, which lay at Lepanto. On 7 October the fleets met at the mouth of the Gulf of Patras. The galleasses broke up the Ottoman line, and after hours of fighting at close quarters Ali Pasha was killed and his flagship taken. Only the squadron of Uluç Ali, governor of Algiers, escaped in good order.": "La flotte de la Ligue s’est rassemblée à Messine sous Don John d’Autriche, demi-frère de Philippe II, et a navigué à la mi-septembre, ignorant encore que Famagusta était tombé. Il avait environ 206 galères et six gales vénitiens, des canons lourds, contre l’amiral ottoman Müezzinzade Ali Pacha 210 galles et une soixantaine de galions, qui se trouvaient à Lepanto. Le 7 octobre, les flottes se rencontrèrent à l’embouchure du golfe de Patras. Les galeasses rompirent la ligne ottomane et, après des heures de combats dans des quartiers proches, Ali Pacha fut tué et son vaisseau-amiral pris. Seul l’escadron d’Uluç Ali, gouverneur d’Alger, s’échappa en bon ordre."
"The League captured about 117 galleys and sank or burned many others; some 30,000 Ottomans and 7,500 of the allies are thought to have died, and thousands of Christian galley slaves were freed. Among the wounded was Miguel de Cervantes. The victory was celebrated across Catholic Europe, but it was not followed up. Over the winter the Ottomans built a new fleet, and in 1572 Uluç Ali, now called Kılıç Ali, avoided battle off Modon. Venice made a separate peace on 7 March 1573, giving up Cyprus and paying 300,000 ducats.": "La Ligue a capturé environ 117 galères et a coulé ou brûlé beaucoup d’autres ; on pense que 30 000 Ottomans et 7 500 des alliés sont morts, et des milliers d’esclaves chrétiens ont été libérés. Parmi les blessés était Miguel de Cervantes. La victoire a été célébrée dans toute l’Europe catholique, mais il n’a pas été suivi. Pendant l’hiver, les Ottomans construisirent une nouvelle flotte, et en 1572 Uluç Ali, aujourd'hui appelé Kılıç Ali, évita la bataille au large de Modon. Venise fit une paix séparée le 7 mars 1573, abandonnant Chypre et payant 300 000 ducats."
