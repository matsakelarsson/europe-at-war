# French translations of the catalogue text (wave 14); step bodies follow later.
Fox Wars: Guerres des Renards
? Two wars between the Meskwaki (Fox) and New France with its many Native allies in the western Great Lakes and the Illinois country. The Meskwaki held the Fox–Wisconsin waterway between Lake Michigan and the Mississippi and fought the French over trade and over French arms sales to their enemies. In 1712 a large Meskwaki and Mascouten community that had settled at Detroit was besieged by the French and their Odawa, Potawatomi, Wendat and Illinois allies; when it broke out it was destroyed, with about 1,000 people killed or enslaved. A French expedition under Louvigny forced a peace in 1716, but war resumed in the 1720s, and Governor Beauharnois set out to destroy the Meskwaki as a people. In 1730, as they tried to reach refuge with the Seneca, the Meskwaki were besieged on the prairie of Illinois and hundreds were killed or captured in their breakout. Survivors found shelter with the Sauk, who killed the French commander Coulon de Villiers at La Baye (Green Bay) in 1733. Beauharnois finally pardoned the Meskwaki in 1737–1738; reduced to a few hundred people, they lived on alongside the Sauk.
: Deux guerres entre les Meskwakis (Renards) et la Nouvelle-France, avec ses nombreux alliés autochtones, dans l’ouest des Grands Lacs et au pays des Illinois. Les Meskwakis contrôlaient la voie navigable Fox–Wisconsin, entre le lac Michigan et le Mississippi, et combattirent les Français à propos du commerce et des ventes d’armes françaises à leurs ennemis. En 1712, une importante communauté de Meskwakis et de Mascoutens qui s’était établie à Détroit fut assiégée par les Français et leurs alliés outaouais, potawatomis, wendats et illinois ; lorsqu’elle tenta de percer, elle fut anéantie, et environ 1 000 personnes furent tuées ou réduites en esclavage. Une expédition française commandée par Louvigny imposa la paix en 1716, mais la guerre reprit dans les années 1720, et le gouverneur Beauharnois entreprit de détruire les Meskwakis en tant que peuple. En 1730, alors qu’ils tentaient de trouver refuge chez les Senecas, les Meskwakis furent assiégés dans la prairie de l’Illinois, et des centaines d’entre eux furent tués ou capturés lors de leur tentative de sortie. Les survivants trouvèrent abri chez les Sauks, qui tuèrent le commandant français Coulon de Villiers à La Baye (Green Bay) en 1733. Beauharnois finit par accorder son pardon aux Meskwakis en 1737–1738 ; réduits à quelques centaines de personnes, ils continuèrent à vivre aux côtés des Sauks.
