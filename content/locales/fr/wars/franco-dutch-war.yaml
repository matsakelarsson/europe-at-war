"The Rampjaar and the Water Line": "Le Rampjaar et la ligne d’eau"
"Louis XIV meant to punish the Dutch for checking his conquests in the Spanish Netherlands in 1668. Having bought England’s alliance in the secret Treaty of Dover and isolated the Republic, he declared war on 6 April 1672 and marched down the Meuse with well over 100,000 men, bypassing Maastricht. On 12 June his army crossed the Rhine at Tolhuis near Lobith, outflanking the Dutch defences on the IJssel, and Utrecht opened its gates. France’s allies, the Bishop of Münster and the Elector of Cologne, overran Overijssel and Drenthe and laid siege to Groningen.": "Louis XIV a voulu punir les Hollandais pour avoir vérifié ses conquêtes aux Pays-Bas espagnols en 1668. Ayant acheté l’alliance de l’Angleterre dans le traité secret de Douvres et isolé la République, il a déclaré la guerre le 6 avril 1672 et a marché sur la Meuse avec bien plus de 100 000 hommes, contournant Maastricht. Le 12 juin, son armée traversa le Rhin à Tolhuis près de Lobith, surplombant les défenses néerlandaises sur l’IJssel, et Utrecht ouvrit ses portes. Les alliés de France, l’évêque de Münster et l’électeur de Cologne, envahirent Overijssel et Drenthe et assiégèrent Groningue."
"The Dutch remember 1672 as the Rampjaar, the disaster year, when the people were said to be irrational, the government desperate and the country beyond saving. They saved Holland by opening the sluices of the Water Line from Muiden to Gorinchem, flooding a belt of land the French could not cross. At sea de Ruyter attacked the Anglo-French fleet at Solebay on 7 June and prevented a landing. In the panic the young William III was made stadtholder and captain-general, and on 20 August a mob in The Hague murdered Johan de Witt and his brother Cornelis.": "Les Hollandais se souviennent de 1672 comme le Rampjaar, l’année du désastre, quand on disait que le peuple était irrationnel, le gouvernement désespéré et le pays au-delà des économies. Ils ont sauvé la Hollande en ouvrant les écluses de la ligne d’eau de Muiden à Gorinchem, inondant une ceinture de terre que les Français ne pouvaient traverser. Dans la panique, le jeune William III fut nommé holder et capitaine général, et, le 20 août, une foule à La Haye assassina Johan de Witt et son frère Cornelis."
