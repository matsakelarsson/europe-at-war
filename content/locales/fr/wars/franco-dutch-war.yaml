"In June 1673 Louis took Maastricht after a siege directed by Vauban, in which the musketeer d’Artagnan was killed. But France’s gains alarmed Europe. The Emperor, Spain and the Duke of Lorraine allied with the Dutch, William retook Naarden and, with the imperial army, Bonn, and in 1674 the French left almost all of the Republic. England made peace in February 1674. That spring Louis conquered Franche-Comté from Spain, and in August William and the Prince of Condé fought the bloody battle of Seneffe, both claiming victory.": "En juin 1673, Louis prit Maastricht après un siège dirigé par Vauban, dans lequel le mousquetaire d’Artagnan fut tué. Mais la France s’inquiétait de l’Europe. L’empereur, l’Espagne et le duc de Lorraine alliés avec les Hollandais, William reprit Naarden et, avec l’armée impériale, Bonn, et en 1674 les Français laissèrent presque toute la République. Ce printemps-là, Louis conquiert Franche-Comté d’Espagne et en août William et le prince de Condé combattent la sanglante bataille de Seneffe, tous deux remportant la victoire."
"On the Rhine Marshal Turenne faced larger imperial armies. He beat them at Sinsheim on 16 June 1674 and then laid waste much of the Palatinate. In the autumn the allies took up winter quarters in Alsace, but Turenne marched south behind the Vosges in midwinter, came out at Belfort and surprised them at Turckheim on 5 January 1675, driving them back over the Rhine. On 27 July 1675, while manoeuvring against the imperial general Raimondo Montecuccoli near Sasbach in Baden, Turenne was killed by a cannonball.": "Sur le Rhin, le maréchal Turenne fait face à de plus grandes armées impériales. Il les bat à Sinsheim le 16 juin 1674 puis gaspille une grande partie du Palatinat. À l’automne, les alliés prennent des quartiers d’hiver en Alsace, mais Turenne marche vers le sud derrière les Vosges au milieu de l’hiver, sort à Belfort et les surprend à Turckheim le 5 janvier 1675, les repoussant au-dessus du Rhin. Le 27 juillet 1675, alors qu’il manoeuvre contre le général impérial Raimondo Montecucoli près de Sasbach à Baden, Turenne est tué par un boulet."
