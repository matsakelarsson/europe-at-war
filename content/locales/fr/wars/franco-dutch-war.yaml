"Franco-Dutch War": "Guerre franco-néerlandaise"
"A war launched by Louis XIV against the Dutch Republic, which nearly fell in the disaster year of 1672 before flooding Holland and finding allies in Spain, the Emperor and Brandenburg. The war spread to the Rhine, the Spanish Netherlands and the Baltic, where it was fought as the Scanian War. The Peace of Nijmegen in 1678 left the Republic intact but gave France Franche-Comté and a string of towns in the Spanish Netherlands.": "Une guerre lancée par Louis XIV contre la République hollandaise, qui a failli tomber dans l’année du désastre de 1672 avant d’envahir la Hollande et de trouver des alliés en Espagne, l’empereur et le Brandebourg. La guerre s’est étendue au Rhin, aux Pays-Bas espagnols et à la Baltique, où elle a été combattue comme la Guerre Scanienne."
"France’s allies were England (until February 1674, in the Third Anglo-Dutch War), the Prince-Bishop of Münster and the Elector of Cologne (until 1674) and Sweden (from 1675). The Dutch were joined by Brandenburg (1672–1673 and again from 1674), the Emperor, Spain and the Duke of Lorraine (1673), the Empire (1674) and Denmark–Norway (1675). For the war in the north, see the Scanian War.": "Les alliés de la France sont l’Angleterre (jusqu’en février 1674, dans la troisième guerre anglo-néerlandaise), le Prince-évêque de Münster et l’Électeur de Cologne (jusqu’en 1674) et la Suède (à partir de 1675). Pour la guerre dans le nord, voir la Guerre Scanienne."
"Dates are New Style (Gregorian). Some Dutch provinces, such as Groningen, still used the Julian calendar, ten days behind.": "Certaines provinces néerlandaises, comme Groningen, utilisaient encore le calendrier julien, dix jours après."
