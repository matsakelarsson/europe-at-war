"The war became a contest of sieges in the Spanish Netherlands, which Louis waged with Vauban’s engineering. Valenciennes was taken by storm on 17 March 1677, and Cambrai and Saint-Omer fell that spring. When William marched to relieve Saint-Omer, the King’s brother, Philippe of Orléans, beat him at Cassel on 11 April. In November 1677 William married Mary, daughter of the Duke of York, drawing England closer to the Dutch, and in March 1678 the French took Ghent and Ypres.": "La guerre devint un concours de siège aux Pays-Bas espagnols, que Louis fit avec Vauban. Valenciennes fut pris par la tempête le 17 mars 1677, et Cambrai et Saint-Omer tombèrent au printemps. Quand William marcha pour soulager Saint-Omer, le frère du roi Philippe d’Orléans, le battit à Cassel le 11 avril. En novembre 1677, William épousa Mary, fille du duc de York, rapprochant l’Angleterre des Hollandais, et en mars 1678, les Français prirent Gand et Ypres."
"Dutch merchants wanted peace, and the Republic made a separate treaty with France at Nijmegen on 10 August 1678. It lost no territory, Maastricht was handed back, and France lowered its tariffs. Four days later William, who may already have known of the peace, attacked the French at Saint-Denis near Mons. Spain made peace on 17 September and paid for the war. France gained Franche-Comté and a belt of towns in the south, among them Valenciennes, Cambrai, Maubeuge, Saint-Omer, Ypres and Cassel, but returned others such as Charleroi, Oudenaarde, Courtrai and Ghent. The Emperor followed in February 1679.": "Les marchands hollandais voulaient la paix, et la République fit un traité séparé avec la France à Nimègue le 10 août 1678. Elle ne perdit aucun territoire, Maastricht fut remis, et la France diminua ses tarifs. Quatre jours plus tard, William, qui aurait déjà connu la paix, attaqua les Français à Saint-Denis près de Mons. L’Espagne fit la paix le 17 septembre et paya la guerre. La France a gagné Franche-Comté et une ceinture de villes dans le sud, parmi lesquelles Valenciennes, Cambrai, Maubeuge, Saint-Omer, Ypres et Cassel, mais a renvoyé d’autres comme Charleroi, Oudenaarde, Courtrai et Gand. L’empereur a suivi en février 1679."
