"1302–1305": "1302–1305"
"After Courtrai the rebels took Lille, Douai and the rest of Flanders, and the guilds took over the town governments. Philip led an army to the border in September 1302 but withdrew without fighting, and in April 1303 the Flemish held off a French attack at Arques near Saint-Omer. Guy of Namur took the war into Zeeland, which the counts of Flanders claimed against the counts of Holland, but on 10–11 August 1304 a French fleet under the Genoese Rainier Grimaldi, with ships from Holland, defeated his fleet off Zierikzee and took him prisoner.": "Après Courtrai, les rebelles ont pris Lille, Douai et le reste de la Flandre, et les guildes ont repris les gouvernements municipaux. Philippe a conduit une armée à la frontière en septembre 1302, mais se sont retirés sans combattre, et en avril 1303, les flamands ont retenu une attaque française à Arques près de Saint-Omer. Guy de Namur prit la guerre en Zélande, que les comtes de Flandre réclamaient contre les chefs d’accusation des Pays-Bas, mais les 10 et 11 août 1304, une flotte française sous la direction du Génois Rainier Grimaldi, avec des navires de Hollande, battit sa flotte au large de Zierikzee et le fit prisonnier."
"A week later, on 18 August 1304, Philip IV fought the Flemish militias at Mons-en-Pévèle, south of Lille. After a long, hot day in which the king himself was nearly killed, the Flemish left the field, with William of Jülich among the dead. Both sides claimed victory, and when the Flemish raised a new army to relieve Lille, Philip agreed a truce. By the Treaty of Athis-sur-Orge, sealed on 23 June 1305, Guy’s son Robert of Béthune was restored as count, but Flanders had to pay huge fines, pull down the walls of its great towns, send 3,000 men of Bruges on pilgrimage and hand Lille, Douai and Orchies to the king. A further agreement in 1312 made the cession permanent.": "Une semaine plus tard, le 18 août 1304, Philippe IV combattit les milices flamandes à Mons-en-Pévèle, au sud de Lille. Après une longue et chaude journée où le roi lui-même fut presque tué, les Flamands quittèrent le champ, avec William de Jülich parmi les morts. Par le traité d’Athis-sur-Orge, scellé le 23 juin 1305, Guy ès fils Robert de Béthune fut restauré comme comte, mais la Flandre dut payer des amendes énormes, abattre les murs de ses grandes villes, envoyer 3000 hommes de Bruges en pèlerinage et main Lille, Douai et Orchies au roi."
