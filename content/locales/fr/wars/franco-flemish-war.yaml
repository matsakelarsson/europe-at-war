# Some French text was translated automatically.
"Franco-Flemish War": "Guerre franco-flemande"
"A war between Philip IV of France and the County of Flanders, whose count had allied with England. France overran Flanders and annexed it by 1300, but in 1302 the towns rose and their militias destroyed a French army of knights at Courtrai, the Battle of the Golden Spurs. After the hard-fought battle of Mons-en-Pévèle in 1304, the Treaty of Athis-sur-Orge restored the count as a French vassal at the price of heavy payments and the towns of Walloon Flanders.": "Une guerre entre Philippe IV de France et le comté de Flandre, dont le comte s’était allié à l’Angleterre. La France a envahi la Flandre et l’a annexée vers 1300, mais en 1302, les villes se sont levées et leurs milices ont détruit une armée française de chevaliers à Courtrai, la bataille des Spurs d’or. Après la bataille acharnée de Mons-en-Pévèle en 1304, le traité d’Athis-sur-Orge rétablit le compte comme vassal français au prix de gros paiements et des villes de Flandre wallonne."
"Dates are Julian. Places in Belgium are given their Dutch names, with the French form where it is common in English, such as Courtrai for Kortrijk and Furnes for Veurne.": "Les dates sont Julian. Les lieux en Belgique ont leur nom néerlandais, avec la forme française où il est commun en anglais, comme Courtrai pour Kortrijk et Furnes pour Veurne."
"In Flanders the battle of Courtrai is known as the Guldensporenslag, and 11 July is the official holiday of the Flemish Community in Belgium.": "En Flandre, la bataille de Courtrai est connue sous le nom de Guldensporenslag et le 11 juillet est la fête officielle de la Communauté flamande en Belgique."
"The war ran alongside the Anglo-French Gascon War of 1294–1303 and the first years of the First War of Scottish Independence.": "La guerre s’est déroulée aux côtés de la guerre anglo-française du Gascon de 1294–1303 et des premières années de la Première Guerre d’indépendance écossaise."
