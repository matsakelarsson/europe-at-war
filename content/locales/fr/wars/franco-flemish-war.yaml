"1297–1302": "1297–1302"
"Guy of Dampierre, Count of Flanders, was caught between his overlord Philip IV, who pressed royal justice and taxes on the county, and its great cloth towns, which lived on English wool. In January 1297 he allied with Edward I of England and renounced his homage. A French army besieged Lille, Robert of Artois beat the Flemish at Furnes on 20 August, and Lille, Bruges and Kortrijk gave in. Edward landed with a small army but, with Scotland in revolt, made a truce and went home. When it ran out in 1300, Charles of Valois overran the rest of the county; Guy surrendered and was imprisoned, and Philip annexed Flanders to the royal domain.": "Guy de Dampierre, comte des Flandres, fut pris entre son surmaître Philippe IV, qui pressa la justice royale et les impôts sur le comté, et ses grandes villes en tissu, qui habitaient sur la laine anglaise. En janvier 1297, il s’allia avec Edward Ier d’Angleterre et renonça à son hommage. Edward débarqua avec une petite armée, mais, avec l’Écosse en révolte, fit une trêve et rentra chez lui. Lorsqu'elle fut épuisée en 1300, Charles de Valois envahit le reste du comté ; Guy se rendit et fut emprisonné, et Philippe rattacha la Flandre au domaine royal."
"The new governor, Jacques de Châtillon, ruled harshly with the support of the town patricians, the Leliaerts or “men of the lily”, and raised new taxes. At dawn on 18 May 1302, in the Matins of Bruges, the guildsmen of Bruges led by the weaver Pieter de Coninck killed the French soldiers quartered in the town; tradition says that anyone who could not say the Flemish words “schild en vriend” was cut down. Led by Guy’s son Guy of Namur and his grandson William of Jülich, the rebels then besieged the French garrison in the castle of Kortrijk.": "Le nouveau gouverneur, Jacques de Châtillon, gouverna durement avec le soutien des patriciens de la ville, les Leliaerts ou les hommes du lis, et souleva de nouvelles taxes. À l’aube du 18 mai 1302, dans les Matins de Bruges, les guildsmen de Bruges dirigés par le tisserand Pieter de Coninck tuèrent les soldats français cantonnés dans la ville ; la tradition dit que quiconque ne pouvait pas dire les mots flamands -\"schild en vriend. Dirigés par Guy de Namur et son petit-fils William de Jülich, les rebelles assiégèrent ensuite la garnison française dans le château de Kortrijk."
"On 11 July Robert of Artois attacked them outside the town with a royal army of about 8,000, including some 2,500 mounted men-at-arms. The Flemish, perhaps 9,000 townsmen and peasants on foot, armed with pikes and the spiked club called the goedendag, stood behind streams and ditches. The French cavalry floundered in the marshy ground and was slaughtered, since the militiamen took few prisoners. Robert and hundreds of knights were killed, and some 500 pairs of golden spurs were hung in the Church of Our Lady in Kortrijk.": "Le 11 juillet, Robert d’Artois les attaqua à l’extérieur de la ville avec une armée royale d’environ 8 000 hommes, dont quelque 2 500 montés à l’arme. Les flamands, peut-être 9 000 citadins et paysans à pied, armés de piques et du club à pic appelé goedendag, se tenaient derrière des ruisseaux et des fossés. La cavalerie française flottait dans le sol marécageux et fut massacrée, car les miliciens ne prenaient que peu de prisonniers. Robert et des centaines de chevaliers ont été tués, et quelque 500 paires d’éperons d’or ont été pendus dans l’église Notre-Dame à Kortrijk."
