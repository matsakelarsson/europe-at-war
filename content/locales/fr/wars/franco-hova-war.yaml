# French translations of the catalogue text (wave 13); step bodies follow later.
Franco-Hova War: Guerre franco-hova
? "The first French war against the Merina kingdom of Madagascar, called the Hova by the French. France pressed old claims: to a protectorate over the Sakalava of the north-west, whose chiefs had signed treaties with France in 1840–1841, and to the estates of the French businessman Jean Laborde and the concessions Radama II had granted to Joseph-François Lambert. In May 1883 Admiral Pierre bombarded the Merina posts on the north-west coast and occupied Majunga, and when Queen Ranavalona II’s government rejected his ultimatum he bombarded and occupied Tamatave in June. The queen died in July; Ranavalona III and her prime minister and husband Rainilaiarivony fought on. For two years the French blockaded and raided the coasts but could not break the Merina lines at Farafaty outside Tamatave. The Treaty of Tamatave of 17 December 1885 gave France the bay of Diego Suarez, 10 million francs to settle French and other foreign claims, and a resident at Antananarivo to handle Madagascar’s foreign relations; France called it a protectorate, the Merina government did not, and the dispute led to the French conquest of 1895."
: "La première guerre de la France contre le royaume merina de Madagascar, dont les Français appelaient les habitants « Hova ». La France faisait valoir d’anciennes revendications : un protectorat sur les Sakalava du nord-ouest, dont les chefs avaient signé des traités avec la France en 1840–1841, ainsi que les domaines de l’homme d’affaires français Jean Laborde et les concessions que Radama II avait accordées à Joseph-François Lambert. En mai 1883, l’amiral Pierre bombarda les postes merina de la côte nord-ouest et occupa Majunga et, lorsque le gouvernement de la reine Ranavalona II rejeta son ultimatum, il bombarda et occupa Tamatave en juin. La reine mourut en juillet ; Ranavalona III et son Premier ministre et époux, Rainilaiarivony, poursuivirent la lutte. Pendant deux ans, les Français bloquèrent les côtes et y lancèrent des raids sans parvenir à percer les lignes merina de Farafaty, aux portes de Tamatave. Le traité de Tamatave du 17 décembre 1885 accorda à la France la baie de Diego-Suarez, 10 millions de francs pour régler les réclamations françaises et étrangères, et un résident à Antananarivo chargé des relations extérieures de Madagascar ; la France y vit un protectorat, le gouvernement merina non, et ce différend conduisit à la conquête française de 1895."
