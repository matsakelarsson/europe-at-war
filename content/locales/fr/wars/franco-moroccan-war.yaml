# French translations of the catalogue text (wave 12); step bodies follow later.
Franco-Moroccan War: Guerre franco-marocaine
? A short war between France and Morocco over Abd al-Qadir, who carried on his war against the French conquest of Algeria from Moroccan territory with the support of many Moroccans. After clashes at the French post of Lalla Maghnia on the undefined border in May and June 1844, a French squadron under the Prince de Joinville bombarded Tangier on 6 August. On 14 August Marshal Bugeaud, with about 11,000 men, defeated a much larger Moroccan army, mostly cavalry, under the sultan’s son Sidi Mohammed on the Isly river near Oujda and took its camp; by Moroccan and French counts Morocco lost more than a thousand dead and France a few dozen. On 15–16 August the French bombarded Mogador (Essaouira) and occupied its island. Sultan Abd al-Rahman made peace by the Treaty of Tangier on 10 September 1844, agreeing to outlaw Abd al-Qadir, reduce the garrison at Oujda and mark the border. The Treaty of Lalla Maghnia of March 1845 drew the line from the coast to Teniet el-Sassi but left the desert border undefined, which led to disputes for more than a century.
: Une courte guerre entre la France et le Maroc au sujet d’Abd el-Kader, qui poursuivait depuis le territoire marocain, avec le soutien de nombreux Marocains, sa guerre contre la conquête française de l’Algérie. Après des accrochages en mai et juin 1844 au poste français de Lalla Maghnia, sur une frontière non délimitée, une escadre française commandée par le prince de Joinville bombarda Tanger le 6 août. Le 14 août, le maréchal Bugeaud, avec environ 11 000 hommes, battit sur l’oued Isly, près d’Oujda, une armée marocaine bien plus nombreuse, composée surtout de cavaliers et commandée par le fils du sultan, Sidi Mohammed, et s’empara de son camp ; selon les décomptes marocains et français, le Maroc perdit plus d’un millier de morts et la France quelques dizaines. Les 15 et 16 août, les Français bombardèrent Mogador (Essaouira) et occupèrent son île. Le sultan Abd al-Rahman fit la paix par le traité de Tanger du 10 septembre 1844, acceptant de mettre Abd el-Kader hors la loi, de réduire la garnison d’Oujda et de délimiter la frontière. Le traité de Lalla Maghnia de mars 1845 traça la ligne de la côte jusqu’à Teniet el-Sassi mais laissa indéfinie la frontière saharienne, ce qui donna lieu à des différends pendant plus d’un siècle.
