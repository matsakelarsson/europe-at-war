"German armies surrounded Paris on 19 September, shutting in some two million people. Gambetta left the city by balloon on 7 October to raise new armies from Tours, and the republic called up hundreds of thousands of men, many of them barely trained. The Army of the Loire won at Coulmiers on 9 November and retook Orléans, but the fall of Metz freed Prince Frederick Charles’s army, which beat the French at Loigny on 2 December, took Orléans again and in January reached Le Mans. In the north General Louis Faidherbe fought on until his defeat at St Quentin on 19 January.": "Les armées allemandes ont entouré Paris le 19 septembre, fermant environ deux millions de personnes. Gambetta a quitté la ville par ballon le 7 octobre pour lever de nouvelles armées de Tours, et la république a appelé des centaines de milliers d’hommes, dont beaucoup à peine entraînés. L’Armée de la Loire gagne à Coulmiers le 9 novembre et reprend Orléans, mais la chute de Metz libère l’armée du prince Frederick Charles, qui bat les Français à Loigny le 2 décembre, prend Orléans de nouveau et atteint le Mans en janvier. Au nord, le général Louis Faidherbe combat jusqu’à sa défaite à St Quentin le 19 janvier."
"Sorties from Paris failed, at Champigny in early December and at Buzenval on 19 January. Food ran short, and Parisians ate horses, cats, rats and the animals of the zoo; from 5 January German siege guns shelled the city. In the east General Charles Bourbaki’s army, sent to relieve besieged Belfort, was beaten on the Lisaine in mid-January. Driven against the Swiss border, about 87,000 of his men crossed into Switzerland on 1 February and were interned. Behind the German lines irregular francs-tireurs attacked supply lines, and the Germans answered with reprisals against villages and the taking of hostages.": "Les sorties de Paris échouèrent, à Champigny début décembre et à Buzenval le 19 janvier. La nourriture était courte et les parisiens mangeaient des chevaux, des chats, des rats et les animaux du zoo ; à partir du 5 janvier, les fusils de siège allemands pilonnaient la ville. Contre la frontière suisse, environ 87 000 de ses hommes sont entrés en Suisse le 1er février et ont été internés. Derrière les lignes allemandes, des francs-tireurs irréguliers attaquent les lignes d’approvisionnement, et les Allemands répondent par des représailles contre les villages et la prise d’otages."
