"10 May 1871": "10 mai 1871"
"The Treaty of Frankfurt, signed on 10 May 1871, confirmed the preliminary peace. France ceded Alsace, except Belfort, and the north-east of Lorraine with Metz, with about 1.5 million inhabitants, to the German Empire as the imperial territory of Alsace-Lorraine. People there could keep French nationality until 1 October 1872 if they moved to France, and tens of thousands did. France had to pay an indemnity of five billion francs, and German troops occupied the north-east of the country until it was paid. France paid ahead of time, and the last German troops left in September 1873.": "Le traité de Francfort, signé le 10 mai 1871, confirme la paix préliminaire. La France cède l’Alsace, sauf Belfort, et le nord-est de la Lorraine avec Metz, avec environ 1,5 million d’habitants, à l’Empire allemand comme territoire impérial d’Alsace-Lorraine. La France a dû payer une indemnité de cinq milliards de francs, et les troupes allemandes ont occupé le nord-est du pays jusqu’à ce qu’il soit payé. La France a payé à l’avance, et les dernières troupes allemandes sont parties en septembre 1873."
"The war had cost about 139,000 French and 45,000 German lives, counting deaths from disease, and some 380,000 French soldiers had been taken prisoner. While the peace was being negotiated, Paris rose against the government in March 1871 and formed the Commune. Government troops retook the city in the “Bloody Week” of 21–28 May, and thousands of Communards were killed in the fighting and in mass shootings, with estimates from about 7,000 to 20,000 or more. The loss of Alsace-Lorraine left a lasting bitterness in France, and the new German Empire was now the strongest power on the continent.": "La guerre a coûté environ 139 000 vies françaises et 45 000 vies allemandes, en comptant les décès dus à la maladie, et quelque 380 000 soldats français ont été faits prisonniers.Pendant que la paix est négociée, Paris s’élève contre le gouvernement en mars 1871 et forme la Commune. Les troupes gouvernementales ont repris la ville à la semaine de Bloody du 21 au 28 mai, et des milliers de Communards ont été tués dans les combats et les fusillades de masse, avec des estimations d’environ 7 000 à 20 000 ou plus. La perte de l’Alsace-Lorraine a laissé une amertume durable en France, et le nouvel Empire allemand était maintenant la puissance la plus forte sur le continent."
