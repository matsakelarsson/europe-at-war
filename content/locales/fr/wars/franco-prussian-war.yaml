"July – 6 August 1870": "juillet – 6 août 1870"
"In July 1870 the Spanish throne was offered to Prince Leopold of Hohenzollern-Sigmaringen, a relative of the King of Prussia. France protested and the candidacy was withdrawn, but the French ambassador, Vincent Benedetti, then asked King William at the spa of Ems for a promise that it would never be renewed. William politely refused. Bismarck shortened the king’s telegraphed report of the meeting, the Ems dispatch, so that it read as a snub, and published it on 13 July. Outraged opinion in Paris pushed Napoleon III’s government into declaring war on 19 July, and the south German states joined Prussia under their alliances of 1866.": "En juillet 1870, le trône d’Espagne fut offert au prince Léopold de Hohenzollern-Sigmaringen, un parent du roi de Prusse. La France protesta et la candidature fut retirée, mais l’ambassadeur français Vincent Benedetti demanda alors au roi William, au spa d’Ems, qu’il ne fût jamais renouvelé. Guillaume refusa poliment. Bismarck raccourcit le rapport télégraphié du roi de la réunion, l’expédition des Ems, afin qu’il lise comme un snub, et le publie le 13 juillet. L’opinion déconcertée à Paris pousse le gouvernement Napoléon III à déclarer la guerre le 19 juillet, et les états sud-allemands rejoignent la Prusse sous leurs alliances de 1866."
"The German armies mobilised faster and in greater numbers, carried to the frontier by rail and directed again by Moltke. On 4 August the Third Army under Crown Prince Frederick William surprised a French division at Wissembourg, and on 6 August it crushed Marshal Patrice de MacMahon’s corps at Frœschwiller and Wörth, while further west Prussian troops stormed the heights of Spicheren near Saarbrücken. MacMahon fell back across the Vosges towards Châlons. The French had the better rifle, the Chassepot, but the Germans’ steel Krupp breech-loading guns outclassed the French artillery.": "Les armées allemandes se sont mobilisées plus rapidement et en plus grand nombre, transportées à la frontière par chemin de fer et dirigées de nouveau par Moltke. Le 4 août, la troisième armée sous le prince héritier Frederick William surprit une division française à Wissembourg et, le 6 août, il détruisit le corps du maréchal Patrice de MacMahon, à Frœschwiller et à Wörth, tandis que les troupes prussiennes s’emparent des hauteurs de Spicheren près de Sarrebruck. Les Français avaient le meilleur fusil, le Chassepot, mais les Allemands en acier Krupp canons à chargement de crampons déclassaient l’artillerie française."
