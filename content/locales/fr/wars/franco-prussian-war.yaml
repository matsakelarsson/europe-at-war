"The war completed what 1866 had begun. In November 1870 Bismarck concluded treaties with Baden, Hesse-Darmstadt, Bavaria and Württemberg, which joined the North German Confederation in a German Empire from 1 January 1871. Bavaria and Württemberg kept special rights, among them their own railways and postal services, and Bavaria its own army in peacetime. King Ludwig II of Bavaria, secretly paid by Bismarck, wrote the letter inviting William to take the imperial title. On 18 January 1871, the anniversary of the first Prussian coronation in 1701, William was proclaimed German Emperor in the Hall of Mirrors of the palace of Versailles, before princes and officers.": "En novembre 1870, Bismarck conclut des traités avec Baden, Hesse-Darmstadt, Bavière et Württemberg qui rejoignent la Confédération d’Allemagne du Nord dans un Empire allemand à partir du 1er janvier 1871. La Bavière et Wurtemberg conservent des droits spéciaux, parmi lesquels leurs propres chemins de fer et services postaux, et la Bavière sa propre armée en temps de paix. Le roi Ludwig II de Bavière, payé secrètement par Bismarck, écrivit la lettre invitant William à prendre le titre impérial. Le 18 janvier 1871, date anniversaire du premier couronnement prussien en 1701, Guillaume fut proclamé empereur allemand dans la salle des miroirs du palais de Versailles, devant les princes et les officiers."
"Ten days later, with Paris starving, the French government signed an armistice at Versailles. Paris paid 200 million francs and gave up its forts, but German troops stayed outside the city. Elections on 8 February returned a National Assembly with a monarchist majority, which met in Bordeaux and chose Adolphe Thiers to lead the government. Thiers negotiated the preliminary peace signed at Versailles on 26 February, and German troops held a short victory parade in Paris on 1 March. Belfort, whose garrison had surrendered with honours, stayed French; by many accounts Thiers accepted the parade as its price.": "Dix jours plus tard, avec la faim de Paris, le gouvernement français signe une armistice à Versailles. Paris paie 200 millions de francs et abandonne ses forts, mais les troupes allemandes restent en dehors de la ville. Les élections du 8 février reviennent à l’Assemblée nationale avec une majorité monarchiste qui se réunit à Bordeaux et choisit Adolphe Thiers pour diriger le gouvernement. Thiers négocia la paix préliminaire signée à Versailles le 26 février, et les troupes allemandes organisèrent une courte parade de victoires à Paris le 1er mars. Belfort, dont la garnison s’était rendue avec honneur, resta en français ; selon de nombreux témoignages, Thiers acceptait la parade comme son prix."
