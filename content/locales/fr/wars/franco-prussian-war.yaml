# Some French text was translated automatically.
"Franco-Prussian War": "Guerre franco-prussienne"
"A war between France and the German states led by Prussia, which destroyed the armies of the Second Empire at Sedan and Metz, besieged Paris and defeated the new French republic’s armies in the provinces. The southern German states joined Prussia in a German Empire proclaimed at Versailles in January 1871, and by the Treaty of Frankfurt France ceded Alsace and part of Lorraine and paid an indemnity of five billion francs.": "Une guerre entre la France et les Etats allemands conduits par la Prusse, qui détruit les armées du Second Empire à Sedan et Metz, assiégé Paris et défait la nouvelle république française dans les provinces. Les Etats du sud de l’Allemagne ont rejoint la Prusse dans un empire allemand proclamé à Versailles en janvier 1871, et par le traité de Francfort France a cédé l’Alsace et une partie de Lorraine et payé une indemnité de cinq milliards de francs."
"In France it is usually called the War of 1870 (la guerre de 1870), and in Germany the German–French War (Deutsch-Französischer Krieg). On the German side fought the North German Confederation, led by Prussia, with Bavaria, Württemberg, Baden and Hesse-Darmstadt as allies; together they formed the German Empire from 1 January 1871.": "En France, on l’appelle généralement la guerre de 1870 (la guerre de 1870), et en Allemagne la guerre germano-française (Deutsch-Französischer Krieg). Du côté allemand combat la Confédération d’Allemagne du Nord, dirigée par la Prusse, avec la Bavière, Wurtemberg, Baden et Hesse-Darmstadt comme alliés ; ensemble ils forment l’Empire allemand à partir du 1er janvier 1871."
"Numbers of soldiers, prisoners and dead are estimates, and the sources differ, especially for the French side.": "Le nombre de soldats, de prisonniers et de morts est estimé, et les sources diffèrent, surtout pour la partie française."
