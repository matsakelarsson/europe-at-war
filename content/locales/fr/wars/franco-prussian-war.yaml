"At Châlons MacMahon gathered a new army of about 120,000 men, and Napoleon III joined it. Under pressure from Paris it set off on 23 August on a wide northern sweep to relieve Bazaine in Metz. Moltke turned the Third Army and a new Army of the Meuse north to meet it. The Germans surprised a French corps at Beaumont on 30 August and drove the army into a loop of the Meuse around the small fortress of Sedan, near the Belgian border. On 1 September they closed the ring. Their guns on the heights shelled the trapped army, and French cavalry charges at Floing failed to break out.": "À Châlons MacMahon a rassemblé une nouvelle armée d’environ 120 000 hommes, et Napoléon III l’a rejoint. Sous la pression de Paris, il est parti le 23 août sur un large balayage nord pour soulager Bazaine à Metz. Moltke tourna la Troisième Armée et une nouvelle Armée du Nord Meuse pour la rencontrer. Les Allemands ont surpris un corps français à Beaumont le 30 août et conduit l’armée dans une boucle de la Meuse autour de la petite forteresse de Sedan, près de la frontière belge. Le 1er septembre, ils ont fermé l’anneau. Leurs canons sur les hauteurs pilonnaient l’armée piégée, et les charges de cavalerie françaises à Floing n’ont pas éclaté."
"In Bazeilles Bavarian troops fought French marines from house to house and burned most of the village, and dozens of civilians were killed or wounded. On 2 September Napoleon III surrendered with about 104,000 men and went into captivity in Germany. When the news reached Paris, crowds invaded the legislature on 4 September, and Léon Gambetta and others proclaimed a republic at the Hôtel de Ville. A Government of National Defence under General Louis Trochu resolved to fight on; its foreign minister, Jules Favre, declared that France would yield “not an inch of our territory, not a stone of our fortresses”.": "À Bazeilles, les troupes bavaroises combattent les marines français de maison en maison et brûlent la plupart du village, et des dizaines de civils sont tués ou blessés. Le 2 septembre, Napoléon III se rend avec environ 104 000 hommes et entre en captivité en Allemagne. Lorsque les nouvelles arrivent à Paris, la foule envahit le parlement le 4 septembre, et Léon Gambetta et d’autres proclament une république à l’Hôtel de Ville. Un gouvernement de la Défense nationale sous le commandement du général Louis Trochu décida de se battre ; son ministre des Affaires étrangères, Jules Favre, déclara que la France ne céderait pas un pouce de notre territoire, pas une pierre de nos forteresses."
