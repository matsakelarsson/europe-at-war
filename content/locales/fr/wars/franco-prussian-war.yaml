"14 August – 27 October 1870": "14 août – 27 octobre 1870"
"Marshal François Achille Bazaine, now in command of the main French army, the Army of the Rhine, began to withdraw from Metz towards Verdun, and the Germans caught up with him. On 16 August at Mars-la-Tour the Prussian III Corps under Constantin von Alvensleben blocked the road west in a day of costly fighting that included Bredow’s cavalry charge, the “death ride”. On 18 August, at Gravelotte and St Privat, in the largest battle of the war, the Germans attacked well-entrenched French positions and lost about 20,000 men against some 12,000 French. Bazaine then withdrew into the fortress of Metz instead of breaking out.": "Le maréchal François Achille Bazaine, maintenant commandant de la principale armée française, l’Armée du Rhin, a commencé à se retirer de Metz vers Verdun, et les Allemands l’ont rattrapé. Le 16 août, à Mars-la-Tour, le Corps prussien III sous Constantin von Alvensleben a bloqué la route à l’ouest dans une journée de combats coûteux qui incluaient la charge de cavalerie de Bredow, la course de mort de . . Le 18 août, à Gravelotte et St Privat, dans la plus grande bataille de la guerre, les Allemands ont attaqué des positions françaises bien ancrées et perdu environ 20 000 hommes contre quelque 12 000 Français. Bazaine s’est alors retiré dans la forteresse de Metz au lieu d’éclater."
"Prince Frederick Charles’s army besieged Metz, and attempts to break out at Noisseville on 31 August and at Bellevue on 7 October failed. Further south, Strasbourg was bombarded from late August, which killed many civilians and burned the city’s library with its medieval manuscripts, and it surrendered on 28 September. In Metz the food ran out in October, and on 27 October Bazaine surrendered the fortress and his whole army, more than 140,000 men, the largest surrender of the war. In 1873 a French court martial sentenced him to death for it, a sentence commuted to imprisonment.": "L’armée du prince Frederick Charles assiégea Metz et tenta de s’enfuir à Noisseville le 31 août et à Bellevue le 7 octobre échoua. Plus au sud, Strasbourg fut bombardée à partir de la fin d’août, ce qui tua de nombreux civils et brûla la bibliothèque de la ville avec ses manuscrits médiévaux, et elle se rendit le 28 septembre. À Metz, la nourriture s’est épuisée en octobre et le 27 octobre Bazaine a livré la forteresse et toute son armée, plus de 140 000 hommes, la plus grande reddition de la guerre. En 1873, une cour martiale française l’a condamné à mort pour elle, une peine commuée en emprisonnement."
