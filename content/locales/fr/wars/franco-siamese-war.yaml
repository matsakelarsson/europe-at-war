# French translations of the catalogue text (wave 11); step bodies follow later.
Franco-Siamese crisis of 1893: Crise franco-siamoise de 1893
? A short war between France and Siam over the lands east of the Mekong, which Siam held as overlord of the Lao principalities and France claimed as heir to Vietnam’s rights. In April 1893 French columns from Indochina moved into the disputed country; a French officer was captured in the Khone islands, and on 5 June a French police inspector, Grosgurin, was killed with seventeen Vietnamese militiamen at Keng Kert in Khammouane. On 13 July two French warships forced their way past the forts at Paknam at the mouth of the Chao Phraya and anchored off Bangkok. France sent an ultimatum on 20 July and blockaded the coast from 29 July to 3 August, and Siam, finding that Britain would not support it, gave way. By the treaty of 3 October 1893 Siam ceded all its lands east of the Mekong, accepted a demilitarised zone 25 km wide on the west bank and the French occupation of Chanthaburi, and paid an indemnity of three million francs. Later treaties, in 1904 and 1907, gave France the right-bank parts of Luang Prabang and Champasak and the Cambodian provinces of Battambang, Siem Reap and Sisophon, in return for the evacuation of Chanthaburi, Trat and Dan Sai.
: Une courte guerre entre la France et le Siam pour les terres situées à l’est du Mékong, que le Siam tenait en qualité de suzerain des principautés lao et que la France revendiquait en tant qu’héritière des droits du Vietnam. En avril 1893, des colonnes françaises venues d’Indochine pénétrèrent dans le territoire contesté ; un officier français fut capturé dans les îles de Khone et, le 5 juin, un inspecteur de police français, Grosgurin, fut tué avec dix-sept miliciens vietnamiens à Keng Kert, dans le Khammouane. Le 13 juillet, deux navires de guerre français forcèrent le passage devant les forts de Paknam, à l’embouchure de la Chao Phraya, et mouillèrent devant Bangkok. La France adressa un ultimatum le 20 juillet et imposa un blocus de la côte du 29 juillet au 3 août, et le Siam, constatant que la Grande-Bretagne ne le soutiendrait pas, s’inclina. Par le traité du 3 octobre 1893, le Siam céda toutes ses terres à l’est du Mékong, accepta une zone démilitarisée de 25 km de large sur la rive ouest et l’occupation française de Chanthaburi, et versa une indemnité de trois millions de francs. Des traités ultérieurs, en 1904 et 1907, donnèrent à la France les parties de Luang Prabang et de Champassak situées sur la rive droite ainsi que les provinces cambodgiennes de Battambang, de Siem Reap et de Sisophon, en échange de l’évacuation de Chanthaburi, de Trat et de Dan Sai.
