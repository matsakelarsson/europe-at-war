"1639–1643": "1639–1643"
"After the Spanish invasion of Picardy in 1636 was thrown back, the war slowly turned France’s way. The French took Hesdin in 1639 and Arras, the capital of Artois, after a long siege in 1640. That year Catalonia and Portugal rose against Philip IV’s government; the Catalans put themselves under Louis XIII, and French troops helped them, taking Perpignan in 1642 and with it Roussillon. Cardinal Richelieu died in December 1642 and Louis XIII on 14 May 1643, leaving a four-year-old king, Louis XIV, under the regency of his mother, Anne of Austria, and Cardinal Mazarin.": "Après l’invasion espagnole de la Picardie en 1636, la guerre tourna lentement la France. Les Français prirent Hesdin en 1639 et Arras, capitale d’Artois, après un long siège en 1640. Cette année-là, la Catalogne et le Portugal se soulevèrent contre le gouvernement de Philippe IV ; les Catalans se mirent sous Louis XIII, et les troupes françaises les aidèrent, prenant Perpignan en 1642 et avec lui Roussillon. Le cardinal Richelieu est décédé en décembre 1642 et Louis XIII le 14 mai 1643, laissant un roi de quatre ans, Louis XIV, sous la régence de sa mère, Anne d’Autriche, et le cardinal Mazarin."
"Spain’s commander in the Netherlands, Francisco de Melo, hoped to exploit the change of reign. In May 1643 he invaded through the Ardennes and besieged the small fortress of Rocroi. The 21-year-old Duke of Enghien marched to relieve it and attacked on 19 May. His cavalry routed the Spanish horse on one wing and then fell on the Spanish infantry, the famous tercios, which beat off several attacks before they were broken; Spanish losses in dead and prisoners were very heavy. Rocroi ended the tercios’ reputation for invincibility, and Enghien went on to take Thionville in August.": "Le commandant espagnol aux Pays-Bas, Francisco de Melo, espérait exploiter le changement de règne. En mai 1643, il envahit les Ardennes et assiégea la petite forteresse de Rocroi. Sa cavalerie roulait le cheval espagnol sur une aile puis tombait sur l’infanterie espagnole, les fameux tercios, qui battaient plusieurs attaques avant qu’elles ne soient brisées ; les pertes espagnoles en morts et les prisonniers étaient très lourds. Rocroi mit fin à la réputation de tercios pour invincibilité, et Enghien poursuivit la prise Thionville en août."
