"1654–1659": "1654–1659"
"With the Fronde over, Turenne took the offensive. On 25 August 1654 he broke the lines of the Spanish army besieging Arras, though Condé beat him in turn at Valenciennes in 1656. Mazarin then allied with Oliver Cromwell’s England, at war with Spain since 1655, and in 1657 some 6,000 English soldiers joined Turenne, with Dunkirk promised to England. On 14 June 1658 a Spanish army under Don Juan José of Austria and Condé, with English Royalist exiles, tried to relieve besieged Dunkirk and was routed in the dunes east of the town. Dunkirk surrendered on 25 June and was handed to England, and that summer Gravelines, Oudenaarde and Ypres fell to the French.": "Le 25 août 1654, il rompt les lignes de l’armée espagnole assiégeant Arras, bien que Condé le batte à son tour à Valenciennes en 1656. Mazarin s’allie alors avec Oliver Cromwell (Angleterre), en guerre avec l’Espagne depuis 1655 et, en 1657, quelque 6 000 soldats anglais se joignent à Turenne, et Dunkerque promet à l’Angleterre. Le 14 juin 1658, une armée espagnole sous la direction de Don Juan José d’Autriche et de Condé, avec des exilés royalistes anglais, tenta de soulager Dunkerque assiégée et fut acheminée dans les dunes à l’est de la ville. Dunkerque se rendit le 25 juin et fut remise en Angleterre, et cet été Gravelines, Oudenaarde et Ypres tombaient aux Français."
"Both crowns were exhausted, and Mazarin and Philip IV’s minister Luis de Haro negotiated for months on Pheasant Island in the Bidasoa, on the border. The Treaty of the Pyrenees, signed on 7 November 1659, gave France Roussillon and northern Cerdagne, most of Artois and a string of fortresses in Flanders, Hainaut and Luxembourg, among them Gravelines, Thionville and Montmédy. France gave up Catalonia, and Condé was pardoned. Louis XIV married Philip’s daughter Maria Theresa, who renounced her claim to the Spanish throne in return for a dowry that Spain never paid.": "Les deux couronnes furent épuisées, et le ministre de Mazarin et Philippe IV , Luis de Haro, négocia pendant des mois sur l’île Pheasant dans la Bidasoa, à la frontière. Le traité des Pyrénées, signé le 7 novembre 1659, donne à France Roussillon et au nord du Cerdagne, la plus grande partie d’Artois et une chaîne de forteresses en Flandre, Hainaut et Luxembourg, parmi lesquelles Gravelines, Thionville et Montmédy. Louis XIV a épousé la fille de Philippes Maria Theresa, qui a renoncé à son droit au trône espagnol en échange d’une dot que l’Espagne n’avait jamais payée."
