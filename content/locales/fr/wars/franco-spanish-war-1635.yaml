# Some French text was translated automatically.
"Franco-Spanish War of 1635–1659": "Guerre franco-espagnole de 1635–1659"
"The long war between Bourbon France and Habsburg Spain that began as part of the Thirty Years’ War and went on for eleven years after the Peace of Westphalia. France won at Rocroi in 1643 and Lens in 1648, Spain recovered ground while France was torn by the Fronde, and an Anglo-French victory at the Dunes in 1658 led to the Treaty of the Pyrenees, which gave France Roussillon and Artois and marked the shift of power in Europe from Spain to France.": "La France des Bourbons et l’Espagne des Habsbourg s’affrontent d’abord dans le cadre de la guerre de Trente Ans. Le conflit se poursuit onze ans après la paix de Westphalie. La France l’emporte à Rocroi en 1643 et à Lens en 1648, puis l’Espagne regagne du terrain pendant la Fronde. La victoire franco-anglaise des Dunes, en 1658, débouche sur le traité des Pyrénées. La France obtient le Roussillon et l’Artois, signe du recul de la puissance espagnole en Europe au profit de la France."
"The war’s first years, France’s entry in 1635–1636 and its campaigns in Germany, are told in the Thirty Years’ War. Spain also faced the revolts of Catalonia (the Reapers’ War, 1640–1652), in which the Catalans placed themselves under the French crown, and of Portugal (1640–1668), which France supported. Fighting in northern Italy is left out here.": "Les premières années de la guerre, l’entrée de la France en 1635–1636 et ses campagnes en Allemagne, sont racontées dans la guerre de Trente Ans. L’Espagne a également fait face aux révoltes de Catalogne (la Guerre des Reapers, 1640–1652), dans laquelle les Catalans se sont placés sous la couronne française, et du Portugal (1640–1668) que la France soutenait."
"Dates are New Style. The English, allies of France from 1657, still used the Julian calendar, ten days behind.": "Les Anglais, alliés de la France à partir de 1657, utilisaient toujours le calendrier julien, dix jours après."
"Louis, Duke of Enghien, became Prince of Condé on his father’s death in 1646 and is known as the Great Condé. He won Rocroi and Lens for France, and from 1651 to 1659 fought for Spain.": "Louis, duc d’Enghien, devient prince de Condé à la mort de son père en 1646 et est connu comme le Grand Condé. Il remporte Rocroi et Lens pour la France, et de 1651 à 1659 combat pour l’Espagne."
