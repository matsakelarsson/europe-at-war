"1646–1653": "1646–1653"
"France pushed into Flanders and took Dunkirk in October 1646, with the Dutch fleet blockading the port. But in January 1648 the Dutch made a separate peace with Spain at Münster, and the Peace of Westphalia that October ended France’s war with the Emperor, not with Spain. On 20 August 1648 Condé, as Enghien now was, beat Archduke Leopold Wilhelm’s army at Lens, the last great battle of the Thirty Years’ War. Days later Paris rose against Mazarin and his war taxes, and barricades went up in the streets. It was the start of the Fronde, a series of revolts that lasted until 1653.": "La France poussa en Flandre et prit Dunkerque en octobre 1646, la flotte hollandaise bloquant le port. Mais en janvier 1648 les Hollandais firent une paix séparée avec l’Espagne à Münster, et la Paix de Westphalie qui octobre termina la guerre de France avec l’empereur, pas avec l’Espagne. Le 20 août 1648, Condé battit l’armée de l’archiduc Leopold Wilhelm à Lens, la dernière grande bataille de la guerre de Trente Ans. Quelques jours plus tard Paris s’éleva contre Mazarin et ses impôts de guerre, et des barricades montèrent dans les rues. C’était le début de la Fronde, une série de révoltes qui dura jusqu’en 1653."
"The Paris Parlement’s revolt was settled in 1649, but the great nobles took up the fight. Condé, arrested in 1650 and freed in 1651, rebelled and allied with Spain. On 2 July 1652 Turenne, now loyal to the crown, nearly destroyed Condé’s army against the walls of Paris, until the king’s cousin, the Grande Mademoiselle, had the gates opened and the guns of the Bastille fired on the royal troops. Spain used France’s disorder to retake Dunkirk and Gravelines in 1652, and Barcelona surrendered to Philip IV that October, ending the Catalan revolt. Louis XIV returned to Paris the same month, and Condé went over to Spain.": "La révolte du Parlement de Paris s’installe en 1649, mais les grands nobles se battent. Condé, arrêté en 1650 et libéré en 1651, rebelle et allié à l’Espagne. Le 2 juillet 1652, Turenne, maintenant fidèle à la couronne, a failli détruire l’armée Condéa contre les murs de Paris, jusqu’à ce que le cousin du roi, la Grande Mademoiselle, ait ouvert les portes et que les canons de la Bastille tirent sur les troupes royales. L’Espagne a utilisé le désordre de France pour reprendre Dunkerque et Gravelines en 1652, et Barcelone s’est rendu à Philippe IV en octobre, mettant fin à la révolte catalane. Louis XIV retourna à Paris le même mois, et Condé passa en Espagne."
