# French translations of the catalogue text (wave 11); step bodies follow later.
Franco-Thai War: Guerre franco-thaïlandaise
? A war between Thailand and the Vichy French administration of Indochina over the lands Siam had ceded to France in 1893, 1904 and 1907. After France’s defeat in Europe in June 1940 and Japan’s entry into northern Indochina in September, the government of Plaek Phibunsongkhram demanded the return of the right bank of the Mekong in Laos and of the Cambodian provinces of Battambang and Siem Reap. Clashes and air raids across the border from November 1940 were followed on 5 January 1941 by a Thai offensive into Cambodia and Laos. The Thai army held off a French counter-attack at Yang Dang Khum and Phum Préav (Ban Phrao) on 16 January, but the next day a French naval squadron sank or disabled three Thai warships off Ko Chang. Japan, which had bases in Indochina and courted Thailand, imposed a ceasefire on 28 January and mediated a settlement. By the Tokyo convention of 9 May 1941 France ceded Battambang, Siem Reap and the lands north of the Dangrek range in Cambodia, and Sainyabuli and the right bank of Champasak in Laos. Thailand celebrated a victory and built the Victory Monument in Bangkok, but returned the territories to France after the Second World War, in November 1946.
: Une guerre entre la Thaïlande et l’administration française de Vichy en Indochine au sujet des territoires que le Siam avait cédés à la France en 1893, 1904 et 1907. Après la défaite de la France en Europe en juin 1940 et l’entrée du Japon dans le nord de l’Indochine en septembre, le gouvernement de Plaek Phibunsongkhram réclama la restitution de la rive droite du Mékong au Laos et des provinces cambodgiennes de Battambang et de Siem Reap. Aux accrochages et aux raids aériens de part et d’autre de la frontière à partir de novembre 1940 succéda, le 5 janvier 1941, une offensive thaïlandaise au Cambodge et au Laos. L’armée thaïlandaise repoussa une contre-attaque française à Yang Dang Khum et à Phum Préav (Ban Phrao) le 16 janvier, mais le lendemain une escadre française coula ou mit hors de combat trois navires de guerre thaïlandais au large de Ko Chang. Le Japon, qui disposait de bases en Indochine et courtisait la Thaïlande, imposa un cessez-le-feu le 28 janvier et servit de médiateur pour parvenir à un règlement. Par la convention de Tokyo du 9 mai 1941, la France céda Battambang, Siem Reap et les territoires situés au nord de la chaîne des Dangrek au Cambodge, ainsi que Sainyabuli et la partie du Champassak située sur la rive droite, au Laos. La Thaïlande célébra une victoire et érigea le monument de la Victoire à Bangkok, mais elle rendit ces territoires à la France après la Seconde Guerre mondiale, en novembre 1946.
