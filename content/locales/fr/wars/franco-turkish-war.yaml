# Some French text was translated automatically.
"Franco-Turkish War": "Guerre franco-turque"
"The war between French occupation forces, including the Armenian Legion, and Turkish nationalists in Cilicia and south-eastern Anatolia after the First World War, in which the French gave up Maraş after street fighting in early 1920 that killed thousands of Armenian civilians, and later Urfa, but held Adana and took Aintab after a long siege. Wishing to cut costs and secure Syria, France made peace with the Ankara government in the Agreement of Ankara of 20 October 1921 and left Cilicia by January 1922, and most of the region’s Armenians left with it.": "La guerre entre les forces d’occupation françaises, y compris la Légion arménienne, et les nationalistes turcs en Cilicie et dans le sud-est de l’Anatolie après la Première Guerre mondiale, au cours de laquelle les Français ont abandonné Maraş après des combats de rue au début de 1920 qui ont tué des milliers de civils arméniens, et plus tard Urfa, mais ont tenu Adana et pris Aintab après un long siège. Souhaitant réduire les coûts et sécuriser la Syrie, la France a fait la paix avec le gouvernement d’Ankara dans l’accord d’Ankara du 20 octobre 1921 et a quitté Cilicie en janvier 1922, et la plupart des Arméniens de la région sont partis avec lui."
"Known in France as the Cilicia campaign and in Turkey as the Southern Front of the War of Independence. French troops took over the region from the British in late 1919, and many Armenian survivors of the deportations had returned there.": "Connu en France comme la campagne de Cilicie et en Turquie comme le Front Sud de la Guerre d’Indépendance. Les troupes françaises ont repris la région des Britanniques à la fin de 1919, et beaucoup de survivants arméniens des déportations y sont retournés."
"Maraş is today’s Kahramanmaraş and Aintab today’s Gaziantep, both renamed after the war in honour of their defence.": "Maraş est aujourd'hui Kahramanmaraş et Aintab aujourd'hui , Gaziantep, tous deux renommés après la guerre en l’honneur de leur défense."
