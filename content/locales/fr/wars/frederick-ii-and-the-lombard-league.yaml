# Some French text was translated automatically.
"Frederick II’s war with the Lombard League": "Guerre de Frédéric II contre la Ligue lombarde"
"The war between the emperor Frederick II, also King of Sicily, and the Lombard League led by Milan, allied with Popes Gregory IX and Innocent IV. Frederick crushed the Milanese at Cortenuova in 1237 but could not take Brescia or Milan; excommunicated and declared deposed, he lost his siege camp at Parma in 1248 and his son Enzo at Fossalta in 1249, and the war ended with his death in 1250.": "La guerre entre l’empereur Frédéric II, aussi roi de Sicile, et la Ligue Lombarde dirigée par Milan, allié avec les papes Grégoire IX et Innocent IV. Frederick a écrasé les Milanais à Cortenuova en 1237 mais ne pouvait pas prendre Brescia ou Milan ; excommunié et déclaré déposé, il a perdu son camp de siège à Parme en 1248 et son fils Enzo à Fossalta en 1249, et la guerre s’est terminée avec sa mort en 1250."
"The party names Guelph and Ghibelline, from the Welf dynasty and the Hohenstaufen castle of Waiblingen, came into use in Italy in these years for the papal and imperial sides. Many cities and lords changed sides; Cremona, Pavia and, under Ezzelino da Romano, Verona and Padua mostly stood by the emperor.": "Les noms du parti Guelph et Ghibelline, de la dynastie Welf et le château Hohenstaufen de Waiblingen, sont entrés en usage en Italie dans ces années pour les côtés papale et impérial. De nombreuses villes et seigneurs ont changé de camp ; Cremona, Pavia et, sous Ezzelino da Romano, Vérone et Padoue se tenaient principalement à côté de l’empereur."
"Frederick had already been excommunicated in 1227 for delaying his crusade, and papal troops invaded his kingdom while he was in the Holy Land (the War of the Keys, 1228–1230). That conflict ended with the Peace of San Germano in 1230 and is not told here.": "Frederick avait déjà été excommunié en 1227 pour avoir retardé sa croisade, et les troupes papales ont envahi son royaume pendant qu’il était en Terre Sainte (la guerre des clés, 1228-1230). Ce conflit a pris fin avec la paix de San Germano en 1230 et n’est pas raconté ici."
