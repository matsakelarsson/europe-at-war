"1236–1238": "1236–1238"
"Frederick II, Barbarossa’s grandson, was emperor, King of Sicily and, by marriage, King of Jerusalem. The Lombard cities, led by Milan, had renewed their League in 1226 to resist his plans to restore imperial power in the north, and Pope Gregory IX, who feared being surrounded by Frederick’s lands, was their natural ally. Having made peace with the pope in 1230 and put down a revolt by his own son Henry in Germany in 1235, Frederick came to Italy in August 1236. With Ezzelino da Romano, the Ghibelline master of Verona, he took and sacked Vicenza on 1 November.": "Frédéric II, petit-fils de Barbarossa, était empereur, roi de Sicile et, par mariage, roi de Jérusalem. Les villes lombardes, dirigées par Milan, avaient renouvelé leur Ligue en 1226 pour résister à ses plans de restaurer la puissance impériale dans le nord, et le pape Grégoire IX, qui craignait d’être entouré par les terres de Frederick, était leur allié naturel. Après avoir fait la paix avec le pape en 1230 et mis bas une révolte par son propre fils Henry en Allemagne en 1235, Frederick est venu en Italie en août 1236. Avec Ezzelino da Romano, le maître de Ghibellline de Vérone, il a pris et renvoyé Vicenza le 1er novembre."
"In November 1237 Frederick, with German knights, Saracen archers from Lucera and troops from Cremona and other allied cities, caught the Milanese army crossing the Oglio near Cortenuova. The League’s cavalry fled; its infantry made a stand round the carroccio, the city’s standard-cart, until nightfall and then scattered. Thousands were killed or taken, among them the Milanese podestà Pietro Tiepolo, son of the doge of Venice, and Frederick sent the carroccio to Rome as a trophy. But he demanded unconditional surrender, and Milan and its allies fought on. In 1238 he besieged Brescia from July and withdrew in October, having failed to take it.": "En novembre 1237, Frederick, avec des chevaliers allemands, des archers Sarrasins de Lucera et des troupes de Cremona et d’autres villes alliées, attrape l’armée milanaise traversant l’Oglio près de Cortenuova. La cavalerie de la Ligue s’est enfuie ; son infanterie a fait un stand autour du carroccio, la ville standard-cart, jusqu’à la tombée de la nuit puis dispersé. Des milliers de personnes furent tuées ou prises, parmi lesquelles la podestà milanaise Pietro Tiepolo, fils de la doge de Venise, et Frederick envoya le carroccio à Rome comme trophée. Mais il demanda une reddition inconditionnelle, et Milan et ses alliés combattirent."
