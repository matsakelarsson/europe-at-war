"1239–1245": "1239–1245"
"Gregory IX excommunicated Frederick again on 20 March 1239, and Genoa and Venice joined the League. Frederick made his son Enzo, newly married to the heiress of Torres and Gallura in Sardinia, his legate for Italy, and occupied the papal duchy of Spoleto and March of Ancona. He took Ravenna in 1240 and Faenza in April 1241, after an eight-month siege. When Gregory called a council to Rome to depose him, a Sicilian and Pisan fleet intercepted the Genoese galleys carrying the prelates off the island of Giglio on 3 May 1241 and captured two cardinals and about a hundred bishops and abbots.": "Grégoire IX excommunia de nouveau Frédéric le 20 mars 1239, et Gênes et Venise rejoignirent la Ligue. Frederick fit son fils Enzo, nouvellement marié à l’héritière de Torres et Gallura en Sardaigne, son légat pour l’Italie, et occupa le duché papal de Spoleto et Mars d’Ancona. Il prit Ravenne en 1240 et Faenza en avril 1241, après un siège de huit mois. Lorsque Grégoire appela un conseil à Rome pour le déposer, une flotte sicilienne et Pisane intercepta les galères génoises transportant les prélats au large de l’île de Giglio le 3 mai 1241 et captura deux cardinaux et une centaine d’évêques et d’abbés."
"Frederick’s army closed on Rome, but Gregory died on 22 August 1241 and Frederick drew back. The next pope, Innocent IV, elected in 1243, proved a harder opponent still. That year Viterbo, urged on by Cardinal Raniero Capocci, rose against its imperial garrison and beat off Frederick’s siege, and in 1244 Innocent escaped by sea to Genoa and went on to Lyon, beyond Frederick’s reach. On 17 July 1245 the Council of Lyon declared Frederick deposed and released his subjects from their oaths, and the pope had a crusade preached against him.": "L’armée de Frédéric se referma à Rome, mais Grégoire mourut le 22 août 1241 et Frederick redescendit. Le pape suivant, Innocent IV, élu en 1243, s’est montré un adversaire encore plus dur. Cette année-là Viterbo, poussé par le cardinal Raniero Capocci, s’éleva contre sa garnison impériale et battit le siège de Frédéric, et en 1244 Innocent s’échappa par la mer à Gênes et alla à Lyon, au-delà de Frédéric. Le 17 juillet 1245, le concile de Lyon déclare Frederick déposé et libère ses sujets de leurs serments, et le pape fait prêcher une croisade contre lui."
