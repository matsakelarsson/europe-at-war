"1247–1250": "1247–1250"
"In June 1247 exiled Guelphs seized Parma, an imperial city on the road between Frederick’s allies in Lombardy and the south. Frederick, on his way to Lyon, turned back to besiege it and built a fortified camp outside the walls, a whole town of wooden houses and churches which he named Vittoria, “victory”. On 18 February 1248, while he was out hawking, the hungry Parmesans and their allies sallied, broke into Vittoria and burned it. Thousands of the emperor’s men were killed or captured, his justiciar Thaddeus of Suessa was killed, and his treasury and crown fell into the townspeople’s hands.": "En juin 1247, Guelph s’empara de Parme, une ville impériale sur la route entre Fredericks alliés en Lombardie et le sud. Frédéric, sur son chemin vers Lyon, retourna pour l’assiéger et construisit un camp fortifié à l’extérieur des murs, toute une ville de maisons en bois et d’églises qu’il appela Vittoria, \"victory\". Le 18 février 1248, alors qu’il était hors fauconnage, les parmesans affamés et leurs alliés salirent, percutèrent Vittoria et le brûlèrent. Des milliers d’hommes de l’empereur furent tués ou capturés, son justiciaire Thaddeus de Suessa fut tué, et son trésor et sa couronne tombèrent entre les mains des habitants."
"The defeat broke the spell of Frederick’s power. His chief minister, Pier della Vigna, was arrested for treason in 1249 and died in prison. On 26 May 1249 the Bolognese beat an imperial army at Fossalta near Modena and captured Enzo, who spent the last 23 years of his life a prisoner in Bologna. Frederick still held much of Italy, and his fortunes were recovering, when he died of dysentery at Castel Fiorentino in Apulia on 13 December 1250. The League broke up, and the papacy carried on the struggle against his sons Conrad IV and Manfred.": "La défaite brisa le sort de Frédéric. Son ministre en chef, Pier della Vigna, fut arrêté pour trahison en 1249 et mourut en prison. Le 26 mai 1249, la Bologne battit une armée impériale à Fossalta près de Modène et captura Enzo, qui passa les 23 dernières années de sa vie prisonnier à Bologne. Frederick détenait encore une grande partie de l’Italie, et ses fortunes se rétablissaient, lorsqu’il mourut de la dysenterie à Castel Fiorentino dans les Pouilles le 13 décembre 1250. La Ligue s’est disloquée, et la papauté a poursuivi la lutte contre ses fils Conrad IV et Manfred."
