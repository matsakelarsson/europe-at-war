# French translations of the catalogue text (wave 13); step bodies follow later.
Free State–Basotho wars: Guerres entre l’État libre d’Orange et les Basotho
? Three wars between the Orange Free State and the Basotho kingdom of Moshoeshoe over the fertile lowlands of the Caledon valley. Moshoeshoe had built his kingdom around the mountain stronghold of Thaba Bosiu in the 1820s, and his people farmed the lowlands on both sides of the Caledon, where white farmers also settled from the 1830s. British attempts to draw a boundary, the Warden Line of 1849, failed; the Basotho defeated a British force at Viervoet in 1851 and fought another to a standstill at Berea in 1852, and in 1854 Britain withdrew and left the Orange Free State to deal with the Basotho. In Senekal’s War of 1858 Free State commandos failed to take Thaba Bosiu and the governor of the Cape, Sir George Grey, mediated a peace. In the Seqiti War of 1865–1866 the Free State, under President Jan Brand, again failed to storm Thaba Bosiu but destroyed crops and seized cattle until Moshoeshoe, short of food, ceded most of his arable land. When war resumed in 1867 the Free State overran almost everything but Thaba Bosiu, and Moshoeshoe asked for British protection. On 12 March 1868 Britain proclaimed Basutoland British territory, and the Convention of Aliwal North of 1869 fixed the border that Lesotho has today, leaving the Conquered Territory west of the Caledon to the Free State.
: Trois guerres entre l’État libre d’Orange et le royaume basotho de Moshoeshoe pour les basses terres fertiles de la vallée du Caledon. Moshoeshoe avait bâti son royaume autour de la place forte montagneuse de Thaba Bosiu dans les années 1820, et son peuple cultivait les basses terres des deux côtés du Caledon, où des fermiers blancs s’établirent eux aussi à partir des années 1830. Les tentatives britanniques de tracer une frontière, la ligne Warden de 1849, échouèrent ; les Basotho battirent une troupe britannique à Viervoet en 1851 et en tinrent une autre en échec à Berea en 1852 et, en 1854, la Grande-Bretagne se retira, laissant l’État libre d’Orange faire face aux Basotho. Lors de la guerre de Senekal, en 1858, les commandos de l’État libre ne parvinrent pas à prendre Thaba Bosiu, et le gouverneur du Cap, sir George Grey, négocia la paix. Lors de la guerre de Seqiti, en 1865–1866, l’État libre, sous la présidence de Jan Brand, échoua de nouveau à emporter d’assaut Thaba Bosiu, mais détruisit les récoltes et s’empara du bétail jusqu’à ce que Moshoeshoe, à court de vivres, cède la plupart de ses terres arables. Quand la guerre reprit en 1867, l’État libre conquit presque tout, sauf Thaba Bosiu, et Moshoeshoe demanda la protection britannique. Le 12 mars 1868, la Grande-Bretagne proclama le Basutoland territoire britannique, et la convention d’Aliwal North de 1869 fixa la frontière qui est aujourd’hui celle du Lesotho, laissant à l’État libre le Territoire conquis, à l’ouest du Caledon.
