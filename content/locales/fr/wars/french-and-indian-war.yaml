# French translations of the catalogue text (wave 14); step bodies follow later.
French and Indian War: Guerre franco-indienne
? The war in North America between Great Britain and France, with their colonies and Native allies, that began two years before the Seven Years’ War in Europe and decided the fate of New France. It started in 1754 in the Ohio country, claimed by both empires and home to the Lenape, Shawnee and Mingo, when George Washington’s Virginians and Tanaghrisson’s Mingo attacked a French party at Jumonville Glen and were forced to surrender at Fort Necessity. In 1755 a British army under Edward Braddock was destroyed on the Monongahela by French troops and Native warriors, and the British began the expulsion of the Acadians from Nova Scotia. Under Montcalm the French took Oswego in 1756 and Fort William Henry in 1757, where Native warriors attacked the surrendered garrison, and beat a far larger British army at Carillon in 1758. But William Pitt poured troops, ships and money into America, the Royal Navy cut New France off from France, and the treaty of Easton drew the Ohio nations out of the war. The British took Louisbourg, Fort Frontenac and Fort Duquesne in 1758, Niagara, Ticonderoga and Quebec in 1759, after Wolfe’s victory on the Plains of Abraham, and in 1760, after a last French victory at Sainte-Foy, three British armies converged on Montreal, where Governor Vaudreuil surrendered Canada. France gave Louisiana west of the Mississippi to Spain by the secret Treaty of Fontainebleau of 1762, and by the Treaty of Paris of 1763 ceded Canada and its lands east of the river to Britain, while Spain ceded Florida to Britain. The Native nations, not consulted, rose within months in Pontiac’s War.
: "La guerre que se livrèrent en Amérique du Nord la Grande-Bretagne et la France, avec leurs colonies et leurs alliés autochtones, qui commença deux ans avant la guerre de Sept Ans en Europe et décida du sort de la Nouvelle-France ; au Canada, on l’appelle la guerre de la Conquête. Elle débuta en 1754 dans le pays de l’Ohio, revendiqué par les deux empires et habité par les Lenapes, les Shawnees et les Mingos, lorsque les Virginiens de George Washington et les Mingos de Tanaghrisson attaquèrent un détachement français à Jumonville Glen, avant d’être contraints de capituler au fort Necessity. En 1755, une armée britannique commandée par Edward Braddock fut anéantie sur la Monongahela par des troupes françaises et des guerriers autochtones, et les Britanniques entreprirent l’expulsion des Acadiens de la Nouvelle-Écosse. Sous Montcalm, les Français prirent Oswego en 1756 et le fort William Henry en 1757, où des guerriers autochtones attaquèrent la garnison qui s’était rendue, et battirent une armée britannique bien plus nombreuse à Carillon en 1758. Mais William Pitt envoya en Amérique troupes, navires et argent en abondance, la Royal Navy coupa la Nouvelle-France de la France, et le traité d’Easton fit sortir de la guerre les nations de l’Ohio. Les Britanniques prirent Louisbourg, le fort Frontenac et le fort Duquesne en 1758, Niagara, Ticonderoga et Québec en 1759, après la victoire de Wolfe sur les plaines d’Abraham et, en 1760, après une dernière victoire française à Sainte-Foy, trois armées britanniques convergèrent sur Montréal, où le gouverneur Vaudreuil capitula et livra le Canada. Par le traité secret de Fontainebleau de 1762, la France donna à l’Espagne la Louisiane située à l’ouest du Mississippi et, par le traité de Paris de 1763, elle céda à la Grande-Bretagne le Canada et ses terres à l’est du fleuve, tandis que l’Espagne cédait la Floride à la Grande-Bretagne. Les nations autochtones, qui n’avaient pas été consultées, se soulevèrent quelques mois plus tard : ce fut la guerre de Pontiac."
Great Britain, British America and their Native allies (Mohawk and, from 1759, other Haudenosaunee; Cherokee and Catawba; Stockbridge Mohican): Grande-Bretagne, Amérique britannique et leurs alliés autochtones (Mohawks et, à partir de 1759, autres Haudenosaunee ; Cherokees et Catawbas ; Mohicans de Stockbridge)
France, New France and their Native allies (the nations of the Great Lakes and the Ohio, the Wabanaki, the Seven Nations of Canada), with Acadian militia: France, Nouvelle-France et leurs alliés autochtones (les nations des Grands Lacs et de l’Ohio, les Wabanakis, les Sept Nations du Canada), avec la milice acadienne
