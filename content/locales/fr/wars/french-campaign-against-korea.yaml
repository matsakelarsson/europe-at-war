# French translations of the catalogue text (wave 10); step bodies follow later.
French campaign against Korea: Expédition française en Corée
? A French punitive expedition to Korea, called Byeongin Yangyo in Korean (“the Western disturbance of 1866”). Early in 1866 the government of the regent Heungseon Daewongun executed nine French Catholic missionaries and thousands of Korean converts. Rear Admiral Pierre-Gustave Roze, commander of the French squadron in the Far East, surveyed the Han River up to the outskirts of Hanseong in September and returned in October with seven ships and about 800 men. His marines took the town of Ganghwa on 16 October and held it for nearly four weeks, carrying off silver, weapons and books from the royal library there. But a landing at Munsusanseong on the mainland was driven back on 26 October, and on 9 November Korean tiger hunters under Yang Heon-su repulsed an attack on Jeongjoksanseong. Roze burned the government buildings of Ganghwa and withdrew on 11 November. The Daewongun treated the outcome as a victory and hardened Korea’s isolation; the looted royal protocols were returned to Korea on a renewable loan in 2011.
: Une expédition punitive française en Corée, appelée Byeongin Yangyo en coréen (« les troubles occidentaux de 1866 »). Au début de 1866, le gouvernement du régent Heungseon Daewongun fit exécuter neuf missionnaires catholiques français et des milliers de convertis coréens. Le contre-amiral Pierre-Gustave Roze, commandant de l’escadre française d’Extrême-Orient, reconnut le fleuve Han jusqu’aux abords de Hanseong en septembre et revint en octobre avec sept navires et environ 800 hommes. Ses fusiliers marins prirent la ville de Ganghwa le 16 octobre et la tinrent près de quatre semaines, emportant de l’argent, des armes et des livres de la bibliothèque royale qui s’y trouvait. Mais un débarquement à Munsusanseong, sur la terre ferme, fut repoussé le 26 octobre et, le 9 novembre, des chasseurs de tigres coréens commandés par Yang Heon-su repoussèrent une attaque contre Jeongjoksanseong. Roze incendia les bâtiments officiels de Ganghwa et se retira le 11 novembre. Le Daewongun présenta l’issue comme une victoire et renforça l’isolement de la Corée ; les protocoles royaux pillés furent rendus à la Corée en 2011 sous la forme d’un prêt renouvelable.
