# French translations of the catalogue text (wave 12); step bodies follow later.
French conquest of Algeria: Conquête française de l’Algérie
? The seventy-year war in which France conquered Algeria. A quarrel over debts and the dey’s blow with a fly-whisk in 1827 led to a blockade and, in June 1830, to a landing at Sidi Ferruch; Algiers capitulated on 5 July and Ottoman rule ended. France held only a few coastal towns at first. In the west Abd al-Qadir, chosen emir in 1832, built a state that France recognised by the treaties of 1834 and 1837, and in the east Ahmed Bey held Constantine until it was stormed in 1837. From 1840 Marshal Bugeaud fought a war of destruction, with mobile columns burning crops and villages and seizing herds; Abd al-Qadir lost his capitals and his mobile camp, and after Morocco was defeated at Isly in 1844 he surrendered in 1847. The oases, the high plateaus and Kabylia (1857) followed, the great Mokrani revolt of 1871 was crushed and punished with land confiscations, and between 1881 and 1903 French columns took the oases of the Sahara and defeated the Tuareg of the Hoggar. Estimates of the Algerian dead between 1830 and the 1860s, from war, famine and disease, range from about 500,000 to a million, out of some three million people.
: La guerre de soixante-dix ans par laquelle la France conquit l’Algérie. Une querelle de dettes et le coup d’éventail donné par le dey en 1827 conduisirent à un blocus puis, en juin 1830, à un débarquement à Sidi-Ferruch ; Alger capitula le 5 juillet et la domination ottomane prit fin. La France ne tint d’abord que quelques villes côtières. À l’ouest, Abd el-Kader, choisi comme émir en 1832, bâtit un État que la France reconnut par les traités de 1834 et de 1837, et à l’est Ahmed Bey tint Constantine jusqu’à la prise d’assaut de la ville en 1837. À partir de 1840, le maréchal Bugeaud mena une guerre de destruction, avec des colonnes mobiles qui brûlaient les récoltes et les villages et s’emparaient des troupeaux ; Abd el-Kader perdit ses capitales et son camp mobile et, après la défaite du Maroc à Isly en 1844, il se rendit en 1847. Les oasis, les hauts plateaux et la Kabylie (1857) suivirent, la grande révolte de Mokrani en 1871 fut écrasée et punie par des confiscations de terres, et entre 1881 et 1903 des colonnes françaises prirent les oasis du Sahara et vainquirent les Touaregs du Hoggar. Les estimations du nombre de morts algériens entre 1830 et les années 1860, dus à la guerre, à la famine et aux maladies, vont d’environ 500 000 à un million, sur une population d’environ trois millions de personnes.
