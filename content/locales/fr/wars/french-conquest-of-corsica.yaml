"May 1768 – June 1769": "mai 1768 – juin 1769"
"Genoa had ruled Corsica since the Middle Ages, but from 1729 the islanders were in almost constant revolt, and in 1755 Pasquale Paoli set up an independent republic with its own constitution, written in Italian, and a capital and later a university at Corte. By the 1760s the Genoese held only a few walled coastal towns, garrisoned by French troops. Unable to subdue the island or to repay its debts to France, Genoa handed Corsica over by the Treaty of Versailles of 15 May 1768, and French troops began to occupy the interior. Paoli called the Corsicans to resist. On 8 October 1768 at Borgo, south of Bastia, his men surrounded a French garrison of some 700 men, beat off the troops sent from Bastia to relieve it, and forced it to surrender.": "Gênes avait gouverné la Corse depuis le Moyen Âge, mais à partir de 1729 les insulaires étaient dans une révolte presque constante, et en 1755 Pasquale Paoli créa une république indépendante avec sa propre constitution, écrite en italien, et une capitale et plus tard une université à Corte. Incapable de soumettre l’île ou de rembourser ses dettes à la France, Gênes remis Corse par le traité de Versailles du 15 mai 1768, et les troupes françaises commencent à occuper l’intérieur. Paoli appelle les corses à résister. Le 8 octobre 1768 à Borgo, au sud de Bastia, ses hommes encerclent une garnison française de quelque 700 hommes, battent les troupes envoyées de Bastia pour la soulager et la forcent à se rendre."
"Louis XV briefly considered giving up, but his minister Choiseul sent reinforcements that raised the French army on the island to about 24,000 men, under the Comte de Vaux. In May 1769 de Vaux advanced up the Golo valley towards Corte. On 8–9 May the Corsicans tried to hold the river crossing at Ponte Novu; caught between the French and the fire of foreign mercenaries holding the bridge behind them, they were cut down in large numbers. Resistance collapsed, and in June Paoli sailed into exile in Britain. France made Corsica a province in 1770, though guerrilla resistance went on for years. Napoleon Bonaparte was born at Ajaccio on 15 August 1769, to parents who had fought with Paoli.": "Louis XV envisagea brièvement d’abandonner, mais son ministre Choiseul envoya des renforts qui élevèrent l’armée française sur l’île à environ 24 000 hommes, sous le comte de Vaux. En mai 1769 de Vaux avança la vallée de Golo vers Corte. Les 8 et 9 mai, les corses essayèrent de maintenir la traversée du fleuve à Ponte Novu ; pris entre les Français et l’incendie de mercenaires étrangers tenant le pont derrière eux, ils furent coupés en grand nombre. La résistance s’écroula, et en juin Paoli partit en exil en Grande-Bretagne. Napoléon Bonaparte est né à Ajaccio le 15 août 1769, aux parents qui avaient combattu avec Paoli."
