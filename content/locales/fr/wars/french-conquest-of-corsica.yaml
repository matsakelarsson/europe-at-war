"French conquest of Corsica": "Conquête française de la Corse"
"The war in which France, having acquired Genoa’s rights to Corsica in 1768, conquered the island from Pasquale Paoli’s Corsican Republic. The Corsicans beat a French force at Borgo in October 1768, but a much larger French army under the Comte de Vaux broke their resistance at Ponte Novu in May 1769, and Paoli went into exile in Britain.": "La guerre dans laquelle la France, après avoir acquis Gêness droits à la Corse en 1768, a conquis l’île de Pasquale PaoliS République corse. Les corses ont battu une force française à Borgo en octobre 1768, mais une armée française beaucoup plus grande sous le comte de Vaux a brisé leur résistance à Ponte Novu en mai 1769, et Paoli est allé en exil en Grande-Bretagne."
"The Corsican Republic, proclaimed in 1755, was never recognised by the European powers, so the base map shows Corsica as Genoese until the Treaty of Versailles and French after it.": "La République corse, proclamée en 1755, n’a jamais été reconnue par les puissances européennes, de sorte que la carte de base montre la Corse comme génoise jusqu’au traité de Versailles et après celui-ci."
"Places are given in their Italian or French forms of the time; Ponte Novu is Corsican for “new bridge” (Ponte Nuovo in Italian).": "Des places sont données dans leurs formes italiennes ou françaises de l’époque ; Ponte Novu est corse pour -\"nouveau pont\" (Ponte Nuovo en italien)."
