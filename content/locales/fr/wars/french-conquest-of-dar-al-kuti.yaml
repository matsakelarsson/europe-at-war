# French translations of the catalogue text (wave 13); step bodies follow later.
French conquest of Dar al-Kuti: Conquête française du Dar al-Kuti
? "The rise and fall of Dar al-Kuti under Muhammad al-Sanusi and its conquest by France. Dar al-Kuti, in the north of today’s Central African Republic, began about 1830 as a frontier province of Dar Runga and its overlord, the sultanate of Wadai, from which horsemen raided the Banda and other peoples to the south for captives. In 1890 Rabih az-Zubayr, then the strongest power in the region, deposed its governor Kobur and installed Kobur’s nephew Muhammad al-Sanusi, born in Wadai about 1850 and a member of the Sanusiyya Sufi order, whose daughter married Rabih’s son Fadlallah. On 9 April 1891 al-Sanusi’s men killed the French explorer Paul Crampel and his companions, who were trying to open a route from the Ubangi to Lake Chad. In October 1894 a Wadai army destroyed al-Sanusi’s capital, Chá; after two years on the move he built a new fortified town (tata) at N’Délé, from which his armies raided the Banda and other peoples of the Ubangi–Chari watershed on a large scale. Captives were sold north through Wadai into the trans-Saharan trade or kept in Dar al-Kuti, and a French resident later described wide tracts of empty, devastated land; the historian Dennis Cordell places Dar al-Kuti among the last states that fed the trans-Saharan slave trade, while noting that the number of people it enslaved cannot be calculated. Al-Sanusi chose to deal with France: on 28 August 1897 he signed a treaty of trade and protectorate with Émile Gentil, revised on 18 February 1903 and 26 January 1908, and kept his independence in practice. After France took Wadai’s capital, Abéché, in 1909, it set out to rule Dar al-Kuti directly. Al-Sanusi died at N’Délé on 12 January 1911, killed by French troops; some accounts say he fell fighting, others that he was assassinated. His son Kamun withdrew east to Ouanda Djallé and resisted until Captain Souclier took the town on 17 December 1912, when Kamun went into exile in the Anglo-Egyptian Sudan. Dar al-Kuti became a district of Ubangi-Shari; it is now the prefecture of Bamingui-Bangoran, and al-Sanusi’s descendants still hold the title of sultan at N’Délé."
: "L’essor et la chute du Dar al-Kuti sous Muhammad al-Sanusi, et sa conquête par la France. Le Dar al-Kuti, dans le nord de l’actuelle République centrafricaine, naquit vers 1830 comme province frontalière du Dar Runga et de son suzerain, le sultanat du Ouaddaï, d’où des cavaliers allaient razzier les Banda et d’autres peuples du sud pour faire des captifs. En 1890, Rabih az-Zubayr, alors la plus forte puissance de la région, déposa son gouverneur Kobur et installa à sa place le neveu de celui-ci, Muhammad al-Sanusi, né au Ouaddaï vers 1850 et membre de la confrérie soufie de la Sanusiyya ; la fille d’al-Sanusi épousa Fadlallah, fils de Rabih. Le 9 avril 1891, les hommes d’al-Sanusi tuèrent l’explorateur français Paul Crampel et ses compagnons, qui tentaient d’ouvrir une route de l’Oubangui au lac Tchad. En octobre 1894, une armée du Ouaddaï détruisit Chá, la capitale d’al-Sanusi ; après deux années d’errance, il bâtit une nouvelle ville fortifiée (tata) à N’Délé, d’où ses armées razziaient à grande échelle les Banda et d’autres peuples de la ligne de partage des eaux entre l’Oubangui et le Chari. Les captifs étaient vendus vers le nord, par le Ouaddaï, dans le commerce transsaharien, ou gardés au Dar al-Kuti, et un résident français décrivit plus tard de vastes étendues vides et dévastées ; l’historien Dennis Cordell range le Dar al-Kuti parmi les derniers États qui alimentèrent la traite transsaharienne, tout en notant que le nombre de personnes qu’il réduisit en esclavage ne peut être calculé. Al-Sanusi choisit de traiter avec la France : le 28 août 1897, il signa avec Émile Gentil un traité de commerce et de protectorat, révisé le 18 février 1903 et le 26 janvier 1908, et conserva dans les faits son indépendance. Après avoir pris Abéché, la capitale du Ouaddaï, en 1909, la France entreprit d’administrer directement le Dar al-Kuti. Al-Sanusi mourut à N’Délé le 12 janvier 1911, tué par les troupes françaises ; selon certains récits, il tomba au combat, selon d’autres, il fut assassiné. Son fils Kamun se replia vers l’est, à Ouanda Djallé, et résista jusqu’à la prise de la ville par le capitaine Souclier le 17 décembre 1912 ; Kamun partit alors en exil au Soudan anglo-égyptien. Le Dar al-Kuti devint une circonscription de l’Oubangui-Chari ; c’est aujourd’hui la préfecture de Bamingui-Bangoran, et les descendants d’al-Sanusi portent toujours le titre de sultan à N’Délé."
