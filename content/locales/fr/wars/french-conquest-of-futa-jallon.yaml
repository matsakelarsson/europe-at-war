# French translations of the catalogue text (wave 13); step bodies follow later.
French conquest of Futa Jallon: Conquête française du Fouta-Djalon
? The French campaign that ended the independence of the Imamate of Futa Jallon, the Fulbe Muslim state of the Guinea highlands founded in the jihad of the 1720s. Futa Jallon was a federation of provinces under an almami at Timbo, chosen in turn from two rival houses, the Alfaya and the Soriya; it took subsidies from the British in Sierra Leone as well as dealing with the French, and helped Samori Touré in his wars with France. The Anglo-French agreement of 1889 put it in the French sphere. Bokar Biro of the Soriya seized power in 1890 by killing his brother and fought the provincial chiefs, among them Alfa Yaya of Labé, who wanted more autonomy; some of them asked the French for help. In March 1896 the French envoy Raoul de Beeckman came to Timbo with troops and demanded the right to build roads, to keep a resident and to approve the provincial chiefs. Bokar Biro appeared to sign, but where his signature should have been he had written “Bismillah”, “in the name of God”. When his term ended in April 1896 he refused to hand over office, and Futa Jallon drifted towards civil war. At the end of the rains French columns from Senegal, French Guinea and the French Sudan converged on the country and took Timbo on 3 November. Few chiefs joined Bokar Biro, and on 13 November 1896 his army was destroyed by tirailleurs and artillery, fighting alongside the Fulbe of his rival Umaru Bademba, on the plain of Porédaka. Bokar Biro escaped from the field but was caught and killed by men of a rival chief. France made Umaru Bademba almami of a reduced state, recognised Alfa Yaya’s Labé as separate, and a few months later imposed a protectorate treaty; in 1904 it removed the chiefs’ remaining powers, and in 1905 it arrested Alfa Yaya and sent him into exile.
: La campagne française qui mit fin à l’indépendance de l’imamat du Fouta-Djalon, l’État musulman peul des hautes terres de Guinée fondé lors du djihad des années 1720. Le Fouta-Djalon était une fédération de provinces placée sous un almamy siégeant à Timbo, choisi à tour de rôle dans deux maisons rivales, les Alfaya et les Soriya ; il recevait des subsides des Britanniques de Sierra Leone tout en traitant avec les Français, et aida Samory Touré dans ses guerres contre la France. L’accord franco-britannique de 1889 le plaça dans la sphère française. Bokar Biro, des Soriya, s’empara du pouvoir en 1890 en tuant son frère et combattit les chefs de province, parmi lesquels Alfa Yaya du Labé, qui réclamaient davantage d’autonomie ; certains d’entre eux demandèrent l’aide des Français. En mars 1896, l’envoyé français Raoul de Beeckman vint à Timbo avec des troupes et exigea le droit de construire des routes, d’entretenir un résident et d’approuver les chefs de province. Bokar Biro parut signer, mais à l’endroit où aurait dû figurer sa signature, il avait écrit « Bismillah », « au nom de Dieu ». Lorsque son mandat prit fin en avril 1896, il refusa de céder sa charge, et le Fouta-Djalon glissa vers la guerre civile. À la fin de la saison des pluies, des colonnes françaises venues du Sénégal, de la Guinée française et du Soudan français convergèrent sur le pays et prirent Timbo le 3 novembre. Peu de chefs se joignirent à Bokar Biro, et le 13 novembre 1896 son armée fut anéantie dans la plaine de Porédaka par les tirailleurs et l’artillerie, qui combattaient aux côtés des Peuls de son rival Oumarou Bademba. Bokar Biro s’échappa du champ de bataille, mais fut rattrapé et tué par des hommes d’un chef rival. La France fit d’Oumarou Bademba l’almamy d’un État réduit, reconnut la séparation du Labé d’Alfa Yaya et, quelques mois plus tard, imposa un traité de protectorat ; en 1904, elle retira aux chefs leurs derniers pouvoirs, et en 1905 elle arrêta Alfa Yaya et l’envoya en exil.
