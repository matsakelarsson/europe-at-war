# French translations of the catalogue text (wave 13); step bodies follow later.
French conquest of Madagascar: Conquête française de Madagascar
? The French invasion that ended the independence of the Merina kingdom of Madagascar, and the Menalamba rising that followed. After Queen Ranavalona III’s government refused a full French protectorate in October 1894, French forces occupied Tamatave in December and Majunga in January 1895. An expeditionary corps of about 15,000 men under General Jacques Duchesne landed at Majunga and marched up the Betsiboka, building a road for its carts as it went; malaria and other diseases killed more than 5,700 of its men, while only 25 died in combat. From Andriba a flying column of some 4,250 men pushed through to Antananarivo, shelled the royal palace on 30 September 1895 and forced the queen to accept a protectorate. In November 1895 the Menalamba (“red shawls”), a rural rising against the French, the Christian court and its forced labour, broke out around the capital and by mid-1896 besieged it. France annexed Madagascar in August 1896 and sent General Joseph Gallieni, who executed leading Merina nobles, crushed the rising by mid-1897, deposed and exiled the queen and abolished the monarchy on 28 February 1897. Resistance continued in other parts of the island for some years; estimates of the Malagasy dead in the rising and its suppression run up to about 100,000.
: L’invasion française qui mit fin à l’indépendance du royaume merina de Madagascar, et le soulèvement des Menalamba qui suivit. Après que le gouvernement de la reine Ranavalona III eut refusé un protectorat français intégral en octobre 1894, les forces françaises occupèrent Tamatave en décembre et Majunga en janvier 1895. Un corps expéditionnaire d’environ 15 000 hommes commandé par le général Jacques Duchesne débarqua à Majunga et remonta la Betsiboka, construisant au fur et à mesure une route pour ses charrettes ; le paludisme et d’autres maladies tuèrent plus de 5 700 de ses hommes, tandis que 25 seulement moururent au combat. Depuis Andriba, une colonne volante de quelque 4 250 hommes poussa jusqu’à Antananarivo, bombarda le palais royal le 30 septembre 1895 et contraignit la reine à accepter un protectorat. En novembre 1895, le soulèvement rural des Menalamba (« châles rouges »), dirigé contre les Français, la cour chrétienne et son travail forcé, éclata autour de la capitale, qu’il assiégeait au milieu de 1896. La France annexa Madagascar en août 1896 et y envoya le général Joseph Gallieni, qui fit exécuter des nobles merina de premier plan, écrasa le soulèvement vers le milieu de 1897, déposa et exila la reine et abolit la monarchie le 28 février 1897. La résistance se poursuivit dans d’autres parties de l’île pendant quelques années ; les estimations du nombre de morts malgaches lors du soulèvement et de sa répression vont jusqu’à environ 100 000.
