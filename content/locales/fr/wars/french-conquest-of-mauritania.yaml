# French translations of the catalogue text (wave 12); step bodies follow later.
French conquest of Mauritania: Conquête française de la Mauritanie
? The French occupation of the emirates of the western Sahara north of the Senegal river, which became the colony of Mauritania. Moorish (Bidan) society was divided between the warrior (hassane) lineages who ruled the emirates of Trarza, Brakna, Tagant and Adrar and the scholarly (zawaya) lineages whose marabouts led the Sufi brotherhoods, and both lived partly from the labour of slaves and dependants. Xavier Coppolani, a Corsican official from Algeria who knew Arabic and the brotherhoods, won over two great marabouts, Shaykh Sidiyya Baba and Shaykh Saad Bouh, by promising to protect the zawaya from the warriors’ raids, and with their help and some force brought Trarza, Brakna and Tagant under French rule in 1902–1905; France made Mauritania a territory of its own in 1904. A third marabout, Shaykh Ma al-Aynayn, Saad Bouh’s brother, who had built a base at Smara in the north with the help of the sultan of Morocco, proclaimed a holy war in 1904. Coppolani was killed at Tidjikja in May 1905. In 1908–1909 Colonel Henri Gouraud marched into the Adrar and took Atar, the emirs submitted, and Ma al-Aynayn withdrew to Morocco, where he died in 1910. Resistance in the Adrar ended by 1912, but raids by the northern nomads went on until 1934. The French ruled through the emirs and marabouts and left slavery largely in place; Morocco later based part of its claim to Mauritania on Ma al-Aynayn’s allegiance to the sultan.
: L’occupation française des émirats de l’ouest du Sahara situés au nord du fleuve Sénégal, qui devinrent la colonie de Mauritanie. La société maure (bidane) était divisée entre les lignages guerriers (hassanes), qui gouvernaient les émirats du Trarza, du Brakna, du Tagant et de l’Adrar, et les lignages lettrés (zawaya), dont les marabouts dirigeaient les confréries soufies, et les uns comme les autres vivaient en partie du travail des esclaves et des dépendants. Xavier Coppolani, fonctionnaire corse venu d’Algérie qui connaissait l’arabe et les confréries, gagna à sa cause deux grands marabouts, Cheikh Sidiya Baba et Cheikh Saad Bouh, en promettant de protéger les zawaya contre les razzias des guerriers et, avec leur aide et un certain recours à la force, plaça le Trarza, le Brakna et le Tagant sous l’autorité française en 1902–1905 ; la France fit de la Mauritanie un territoire distinct en 1904. Un troisième marabout, Cheikh Ma el-Aïnine, frère de Saad Bouh, qui avait établi une base à Smara, dans le nord, avec l’aide du sultan du Maroc, proclama la guerre sainte en 1904. Coppolani fut tué à Tidjikja en mai 1905. En 1908–1909, le colonel Henri Gouraud pénétra dans l’Adrar et prit Atar, les émirs se soumirent et Ma el-Aïnine se retira au Maroc, où il mourut en 1910. La résistance dans l’Adrar avait cessé en 1912, mais les rezzous des nomades du nord se poursuivirent jusqu’en 1934. Les Français gouvernèrent par l’intermédiaire des émirs et des marabouts et laissèrent largement subsister l’esclavage ; le Maroc fonda plus tard une partie de sa revendication sur la Mauritanie sur l’allégeance de Ma el-Aïnine au sultan.
