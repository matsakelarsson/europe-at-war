? The French conquest of Morocco, from the occupation of Oujda in 1907 to the last campaigns in the Anti-Atlas in 1934. France, which already ruled Algeria, used the murder of a French doctor in Marrakesh and the killing of European workers at Casablanca in 1907 to occupy Oujda and bombard and land at Casablanca. The crisis helped Abd al-Hafid overthrow his brother Abd al-Aziz in the name of resistance, but he could not stop the French, who relieved Fez in 1911 and imposed the Treaty of Fez on 30 March 1912, making Morocco a protectorate; Spain received a zone in the north. Ahmed al-Hiba, proclaimed sultan in the south, took Marrakesh and was defeated at Sidi Bou Othman in September 1912. Under the first resident-general, Hubert Lyautey, France ruled through the sultan and the great qaids of the south while its columns, increasingly made up of Moroccan goumiers and colonial troops, fought the Zaian confederation of the Middle Atlas, the Rif Republic and the mountain tribes of the High Atlas, the Saghro and the Anti-Atlas. France declared the country conquered in 1934. The French army officially counted about 8,600 dead, and some 12,000 Moroccan auxiliaries died on the French side; Moroccan losses were never counted, but one estimate puts them at about 100,000.
: La conquête du Maroc par la France, de l’occupation d’Oujda en 1907 aux dernières campagnes de l’Anti-Atlas en 1934. La France, qui gouvernait déjà l’Algérie, prit prétexte du meurtre d’un médecin français à Marrakech, puis de la mort d’ouvriers européens tués à Casablanca en 1907, pour occuper Oujda, bombarder Casablanca et y débarquer. La crise aida Abd al-Hafid à renverser son frère Abd al-Aziz au nom de la résistance, mais il ne put arrêter les Français, qui dégagèrent Fès en 1911 et imposèrent le traité de Fès le 30 mars 1912, faisant du Maroc un protectorat ; l’Espagne reçut une zone dans le nord. Ahmed al-Hiba, proclamé sultan dans le sud, prit Marrakech et fut vaincu à Sidi Bou Othman en septembre 1912. Sous le premier résident général, Hubert Lyautey, la France gouverna par l’intermédiaire du sultan et des grands caïds du sud, tandis que ses colonnes, composées de plus en plus de goumiers marocains et de troupes coloniales, combattaient la confédération zaïane du Moyen Atlas, la République du Rif et les tribus montagnardes du Haut Atlas, du Saghro et de l’Anti-Atlas. La France déclara le pays conquis en 1934. L’armée française compta officiellement environ 8 600 morts, et quelque 12 000 auxiliaires marocains moururent du côté français ; les pertes marocaines ne furent jamais comptées, mais une estimation les situe à environ 100 000.
