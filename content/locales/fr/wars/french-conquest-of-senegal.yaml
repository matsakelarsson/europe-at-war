# French translations of the catalogue text (wave 13); step bodies follow later.
French conquest of Senegal: Conquête française du Sénégal
? The wars by which France turned its trading towns at Saint-Louis and Gorée into the colony of Senegal, between the Plan of 1854 and the fall of the last Wolof kingdom in 1890. Under Governor Louis Faidherbe (1854–1865) France conquered Waalo, pushed the Moorish emirs of Trarza and Brakna north of the Senegal river, built a chain of forts up the river and turned back Umar Tall’s jihad at Médine, took Dakar, and fought the Serer kingdoms of Sine and Saloum and the Wolof kingdom of Cayor. It created the tirailleurs sénégalais, African soldiers who did most of the fighting, many of them slaves bought from their owners. The French advance became entangled with the Muslim reform movements of the time, led by Umar Tall, Maba Diakhou Bâ and Shaikh Amadou Ba, which fought the old warrior aristocracies as well as France, and France allied with whichever side served it. Its long contest with Lat Dior of Cayor ended after the Dakar–Saint-Louis railway was built across his kingdom, with his death at Dekhelé in 1886; in 1890 a French column took Yang-Yang, the capital of Jolof, and in 1891 the last strongman of Futa Toro, Abdul Bokar Kan, was killed in flight. By then the colony had almost its present borders; in 1895 it became part of French West Africa.
: Les guerres par lesquelles la France fit de ses villes commerçantes de Saint-Louis et de Gorée la colonie du Sénégal, entre le plan de 1854 et la chute du dernier royaume wolof en 1890. Sous le gouverneur Louis Faidherbe (1854–1865), la France conquit le Waalo, repoussa les émirs maures du Trarza et du Brakna au nord du fleuve Sénégal, construisit une chaîne de forts le long du fleuve et arrêta le djihad d’Oumar Tall à Médine, prit Dakar et combattit les royaumes sérères du Sine et du Saloum ainsi que le royaume wolof du Cayor. Elle créa les tirailleurs sénégalais, soldats africains qui menèrent l’essentiel des combats et dont beaucoup étaient des esclaves rachetés à leurs maîtres. L’avancée française se mêla aux mouvements de réforme musulmans de l’époque, menés par Oumar Tall, Maba Diakhou Bâ et Cheikh Amadou Bâ, qui combattaient les vieilles aristocraties guerrières autant que la France, et la France s’allia au camp qui servait ses intérêts. Sa longue lutte contre Lat Dior, du Cayor, s’acheva, après la construction du chemin de fer Dakar–Saint-Louis à travers son royaume, par la mort de celui-ci à Dekhelé en 1886 ; en 1890, une colonne française prit Yang-Yang, la capitale du Djolof, et en 1891 le dernier homme fort du Fouta-Toro, Abdoul Bokar Kane, fut tué dans sa fuite. La colonie avait alors presque ses frontières actuelles ; en 1895, elle fut intégrée à l’Afrique-Occidentale française.
