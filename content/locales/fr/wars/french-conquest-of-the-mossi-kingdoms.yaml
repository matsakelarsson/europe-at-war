# French translations of the catalogue text (wave 12); step bodies follow later.
French conquest of the Mossi kingdoms: Conquête française des royaumes mossis
? The French conquest of Ouagadougou, the leading Mossi kingdom on the upper Volta, in today’s Burkina Faso. The Mossi kingdoms (Ouagadougou, Yatenga, Tenkodogo, Fada N’Gourma and Boussouma among them) had kept their independence for centuries with their cavalry, but by the 1890s they were divided, Yatenga by civil war, and France, Britain and Germany were racing to sign treaties with them. The Mogho Naba Wobgo (Boukary Koutou), king of Ouagadougou since 1890, turned away the French officer Parfait-Louis Monteil in 1891 and signed a treaty of friendship with George Ekem Ferguson, a Fante agent of the British Gold Coast, in 1894; Yatenga accepted a French protectorate in 1895–1896. In 1896 a French column of tirailleurs under Captain Paul Voulet and Lieutenant Julien Chanoine marched from the Niger bend; Wobgo’s horsemen could not stop it, and Voulet entered Ouagadougou in September 1896 and burned the town. In January 1897 Voulet installed Wobgo’s brother Kouka as Mogho Naba under the name Sighiri, who signed a protectorate treaty. Wobgo appealed to the British in vain and, after further fighting, withdrew to Zongoiri, just across the border in the British Gold Coast, where he died in 1904. Voulet and Chanoine went on to campaign in the Gurunsi country in 1897, and in 1899 led the mission to Lake Chad whose killings made them notorious. France ruled the Mossi through their own kings, made Ouagadougou the capital of the colony of Upper Volta in 1919, and drew heavily on Mossi labour and soldiers.
: La conquête française de Ouagadougou, le principal royaume mossi de la région de la haute Volta, dans l’actuel Burkina Faso. Les royaumes mossis (parmi lesquels Ouagadougou, le Yatenga, Tenkodogo, Fada N’Gourma et Boussouma) avaient conservé leur indépendance pendant des siècles grâce à leur cavalerie, mais dans les années 1890 ils étaient divisés, le Yatenga par une guerre civile, et la France, la Grande-Bretagne et l’Allemagne rivalisaient de vitesse pour signer des traités avec eux. Le Mogho Naba Wobgo (Boukary Koutou), roi de Ouagadougou depuis 1890, éconduisit l’officier français Parfait-Louis Monteil en 1891 et signa en 1894 un traité d’amitié avec George Ekem Ferguson, agent fanti de la Côte-de-l’Or britannique ; le Yatenga accepta un protectorat français en 1895–1896. En 1896, une colonne française de tirailleurs commandée par le capitaine Paul Voulet et le lieutenant Julien Chanoine partit de la boucle du Niger ; les cavaliers de Wobgo ne purent l’arrêter, et Voulet entra à Ouagadougou en septembre 1896 et incendia la ville. En janvier 1897, Voulet installa comme Mogho Naba le frère de Wobgo, Kouka, sous le nom de Sighiri, qui signa un traité de protectorat. Wobgo fit appel en vain aux Britanniques et, après de nouveaux combats, se retira à Zongoiri, juste de l’autre côté de la frontière, en Côte-de-l’Or britannique, où il mourut en 1904. Voulet et Chanoine firent ensuite campagne dans le pays gourounsi en 1897 et, en 1899, conduisirent vers le lac Tchad la mission dont les tueries les rendirent tristement célèbres. La France gouverna les Mossi par l’intermédiaire de leurs propres rois, fit de Ouagadougou la capitale de la colonie de Haute-Volta en 1919 et puisa largement dans la main-d’œuvre et les soldats mossis.
