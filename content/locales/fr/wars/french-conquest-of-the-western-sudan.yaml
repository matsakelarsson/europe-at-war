# French translations of the catalogue text (wave 12); step bodies follow later.
French conquest of the Western Sudan: Conquête française du Soudan occidental
? The campaigns by which France took the lands between the upper Senegal and the Niger bend, today’s Mali, which it called the Western or French Sudan. From the colony of Senegal, officers of the marine troops led by Gustave Borgnis-Desbordes, Joseph Gallieni and Louis Archinard pushed a line of forts from Kayes to Kita (1881) and Bamako (1883), on the route of a planned railway to the Niger, often ahead of orders from Paris. The states in their way were the Toucouleur Empire of Ahmadu Tall, the son of Umar Tall, at Ségou and Nioro; the Wassoulou Empire of Samori Touré to the south; and smaller kingdoms and chiefdoms that made treaties with one side or the other. After a decade of treaties made to buy time on both sides, Archinard took Koundian (1889), Ségou (1890) and Nioro (1891), and in 1893 Djenné and Bandiagara, driving Ahmadu into exile. A column reached Timbuktu in December 1893, where the Tuareg destroyed Eugène Bonnier’s column in January 1894. The conquest ended with the storming of Sikasso, capital of Kénédougou, on 1 May 1898 and the capture of Samori in September. The armies that won it were mostly African, Senegalese tirailleurs and allied or conscripted auxiliaries under French officers; captives were distributed among the victors, and the violence of Archinard’s campaigns was criticised in France at the time.
: Les campagnes par lesquelles la France s’empara des pays situés entre le haut Sénégal et la boucle du Niger, l’actuel Mali, qu’elle appelait Soudan occidental ou Soudan français. Depuis la colonie du Sénégal, des officiers des troupes de marine, menés par Gustave Borgnis-Desbordes, Joseph Gallieni et Louis Archinard, poussèrent une ligne de forts de Kayes à Kita (1881) et à Bamako (1883), sur le tracé d’un chemin de fer prévu vers le Niger, devançant souvent les ordres de Paris. Les États qui leur barraient la route étaient l’empire toucouleur d’Ahmadou Tall, fils d’Oumar Tall, à Ségou et à Nioro ; l’empire du Wassoulou de Samory Touré, au sud ; et de plus petits royaumes et chefferies qui signèrent des traités avec l’un ou l’autre camp. Après une décennie de traités conclus de part et d’autre pour gagner du temps, Archinard prit Koundian (1889), Ségou (1890) et Nioro (1891), puis en 1893 Djenné et Bandiagara, contraignant Ahmadou à l’exil. Une colonne atteignit Tombouctou en décembre 1893 ; les Touareg y anéantirent la colonne d’Eugène Bonnier en janvier 1894. La conquête s’acheva avec la prise d’assaut de Sikasso, capitale du Kénédougou, le 1er mai 1898, et la capture de Samory en septembre. Les armées qui la menèrent étaient pour l’essentiel africaines, tirailleurs sénégalais et auxiliaires alliés ou enrôlés de force sous les ordres d’officiers français ; les captifs étaient répartis entre les vainqueurs, et la violence des campagnes d’Archinard fut critiquée en France dès cette époque.
