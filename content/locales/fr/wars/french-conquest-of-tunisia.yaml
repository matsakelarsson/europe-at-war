# French translations of the catalogue text (wave 12); step bodies follow later.
French conquest of Tunisia: Conquête française de la Tunisie
The French invasion that made Tunisia a protectorate. Using raids by the Kroumir tribes across the Algerian border as a pretext, France sent about 24,000 men from Algeria into north-western Tunisia on 24 April 1881 and landed another force at Bizerte on 1 May. On 12 May Muhammad III as-Sadiq, the bey of Tunis, signed the Treaty of Bardo, which gave France control of the regency’s foreign relations and the right to station troops. In June the south and centre rose against the occupation and the bey who had accepted it. French ships bombarded and stormed Sfax in July, a second, larger expedition took Kairouan without a fight in October, and the last resistance ended in December, while many of the tribes that had risen fled to Ottoman Tripolitania. The conventions of La Marsa in 1883 completed the protectorate, under which the beys reigned until 1957.: L’invasion française qui fit de la Tunisie un protectorat. Prenant prétexte de raids des tribus kroumirs par-delà la frontière algérienne, la France envoya le 24 avril 1881 environ 24 000 hommes d’Algérie dans le nord-ouest de la Tunisie et débarqua une autre force à Bizerte le 1er mai. Le 12 mai, Muhammad III as-Sadiq, bey de Tunis, signa le traité du Bardo, qui donnait à la France le contrôle des relations extérieures de la régence et le droit d’y stationner des troupes. En juin, le sud et le centre se soulevèrent contre l’occupation et contre le bey qui l’avait acceptée. Des navires français bombardèrent Sfax et la prirent d’assaut en juillet, une seconde expédition, plus importante, prit Kairouan sans combat en octobre, et les dernières résistances cessèrent en décembre, tandis que nombre des tribus soulevées s’enfuyaient vers la Tripolitaine ottomane. Les conventions de La Marsa, en 1883, complétèrent le protectorat, sous lequel les beys régnèrent jusqu’en 1957.
