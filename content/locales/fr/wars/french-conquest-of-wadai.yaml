# French translations of the catalogue text (wave 12); step bodies follow later.
French conquest of Wadai: Conquête française du Ouaddaï
? The French conquest of Wadai, the strongest sultanate of the eastern Sahel, in what is now eastern Chad. After the defeat of Rabih in 1900 France pushed east from Lake Chad and Baguirmi. Wadai, ruled from Abéché by the kolak Muhammad Salih, known as Dud Murra (“the lion of Murra”), was allied with the Senussi order, whose caravans linked it with Kufra and Benghazi, and drew its wealth from that trade and from slave raiding to the south. France backed his cousin Adam Asil as a rival, and in June 1909 a column under Captain Jean-Joseph Fiegenschuh took Abéché and installed Asil. Dud Murra withdrew to the north and then to Dar Masalit, whose sultan Taj ad-Din destroyed Fiegenschuh’s column in January 1910 and defeated another under Lieutenant-Colonel Henri Moll at Doroté in November 1910, where both Moll and Taj ad-Din were killed. Colonel Emmanuel Largeau, returned to command, pressed on, and Dud Murra surrendered at Abéché in October 1911; the French deposed Asil, abolished the sultanate and in 1913 took the Senussi lodge of Aïn Galakka in Borkou. Dar Masalit joined the Anglo-Egyptian Sudan in 1919, and the sultanate of Wadai was restored under French rule in 1935.
: La conquête française du Ouaddaï, le plus puissant sultanat du Sahel oriental, dans l’actuel est du Tchad. Après la défaite de Rabah en 1900, la France progressa vers l’est à partir du lac Tchad et du Baguirmi. Le Ouaddaï, gouverné depuis Abéché par le kolak Muhammad Salih, dit Dud Murra (« le lion de Murra »), était allié à la confrérie senoussie, dont les caravanes le reliaient à Koufra et à Benghazi, et tirait sa richesse de ce commerce et des razzias d’esclaves menées vers le sud. La France soutint contre lui son cousin Adam Asil et, en juin 1909, une colonne commandée par le capitaine Jean-Joseph Fiegenschuh prit Abéché et installa Asil. Dud Murra se retira vers le nord, puis au Dar Massalit, dont le sultan Taj ad-Din anéantit la colonne de Fiegenschuh en janvier 1910 et défit une autre colonne, commandée par le lieutenant-colonel Henri Moll, à Doroté en novembre 1910, combat où Moll et Taj ad-Din furent tués tous deux. Le colonel Emmanuel Largeau, revenu prendre le commandement, poursuivit l’offensive, et Dud Murra se rendit à Abéché en octobre 1911 ; les Français déposèrent Asil, abolirent le sultanat et prirent en 1913 la zaouïa senoussie d’Aïn Galakka, au Borkou. Le Dar Massalit fut rattaché au Soudan anglo-égyptien en 1919, et le sultanat du Ouaddaï fut rétabli sous l’autorité française en 1935.
