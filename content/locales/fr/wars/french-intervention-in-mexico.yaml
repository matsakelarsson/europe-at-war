# French translations of the catalogue text (wave 14); step bodies follow later.
French intervention in Mexico: Expédition du Mexique
? The invasion of Mexico by Napoleon III’s France and the war between the Mexican Republic of Benito Juárez and the empire France set up under Maximilian of Habsburg. When Juárez’s government, bankrupt after the Reform War, suspended payments on its foreign debts in July 1861, Spain, Britain and France sent troops to Veracruz. Spain and Britain withdrew in April 1862 when it became clear that Napoleon meant to overthrow the republic. On 5 May 1862 Ignacio Zaragoza’s army beat the French at Puebla, the victory remembered as Cinco de Mayo, but a much larger French army took Puebla after a siege in 1863 and entered Mexico City. Mexican conservatives offered the throne to Maximilian, who arrived in 1864. Juárez’s government retreated to the far north and fought on with guerrilla and regular forces. After the American Civil War the United States pressed France to leave, and Napoleon, facing Prussia in Europe, withdrew his army in 1866–1867. The republicans besieged Maximilian at Querétaro, which fell on 15 May 1867; he was shot with his generals Miguel Miramón and Tomás Mejía on 19 June, and Mexico City surrendered two days later.
: L’invasion du Mexique par la France de Napoléon III et la guerre entre la République mexicaine de Benito Juárez et l’empire que la France établit sous Maximilien de Habsbourg. Lorsque le gouvernement de Juárez, en faillite après la guerre de Réforme, suspendit le paiement de ses dettes extérieures en juillet 1861, l’Espagne, la Grande-Bretagne et la France envoyèrent des troupes à Veracruz. L’Espagne et la Grande-Bretagne se retirèrent en avril 1862, quand il devint clair que Napoléon entendait renverser la république. Le 5 mai 1862, l’armée d’Ignacio Zaragoza battit les Français à Puebla, victoire commémorée sous le nom de Cinco de Mayo, mais une armée française beaucoup plus nombreuse prit Puebla après un siège en 1863 et entra dans Mexico. Les conservateurs mexicains offrirent le trône à Maximilien, qui arriva en 1864. Le gouvernement de Juárez se replia dans l’extrême nord et poursuivit la lutte avec des guérillas et des forces régulières. Après la guerre de Sécession, les États-Unis pressèrent la France de partir, et Napoléon, confronté à la Prusse en Europe, retira son armée en 1866–1867. Les républicains assiégèrent Maximilien à Querétaro, qui tomba le 15 mai 1867 ; il fut fusillé avec ses généraux Miguel Miramón et Tomás Mejía le 19 juin, et Mexico se rendit deux jours plus tard.
