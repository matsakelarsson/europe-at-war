The French entered a nearly empty city. Fires that broke out the same night destroyed most of its wooden houses.: Les Français sont entrés dans une ville presque vide. Des incendies qui ont éclaté la même nuit ont détruit la plupart de ses maisons en bois.
18 October 1812: 18 octobre 1812
Kutuzov’s attack on Murat’s camp on the Chernishnya river showed that the Russian army was ready to fight again.: L’attaque de Kutuzov contre le camp de Murat sur la rivière Chernishnya a montré que l’armée russe était prête à se battre à nouveau.
Napoleon, 19 October: Napoléon, 19 octobre
The retreat begins: La retraite commence
24 October – 18 November 1812: 24 octobre – 18 novembre 1812
Napoleon hoped to reach the stores at Kaluga by the unravaged southern road. On 24 October his Italian corps under Prince Eugène met Dokhturov’s troops at Maloyaroslavets, and the town changed hands several times and burned. The French held it, but Kutuzov blocked the road south. After a narrow escape from Cossacks the next morning, Napoleon turned north to the Smolensk road, along which his army had stripped the country bare on its way east, and passed the unburied dead of Borodino.: Napoléon espérait atteindre les magasins de Kaluga par la route du sud non ravagée. Le 24 octobre, son corps italien sous le prince Eugène rencontra les troupes de Dokhturov à Maloyaroslavet, et la ville changea de mains plusieurs fois et brûla. Les Français la tenaient, mais Kutuzov obstruait la route au sud. Après une évasion de Cosaques le lendemain matin, Napoléon se dirigea vers le nord vers la route de Smolensk, sur laquelle son armée avait dépouillé le pays nu sur son chemin à l’est, et passa les morts non enterrés de Borodino.
Kutuzov followed on a parallel road to the south while Cossacks and partisans attacked the columns. At Vyazma on 3 November Miloradovich mauled the rearguard. Hard frosts came in early November, horses died in thousands, guns and wagons were abandoned and discipline broke down. At Smolensk the stores were too small and were looted. At Krasnoi on 15–18 November Russian attacks cut the strung-out army into pieces; Ney’s rearguard was cut off and escaped across the frozen Dnieper with only a few hundred men.: Kutuzov suivit une route parallèle vers le sud pendant que les cosaques et les partisans attaquaient les colonnes. A Vyazma, le 3 novembre Miloradovich maulait l’arrière-garde. Des gelées dures arrivèrent au début de novembre, des chevaux moururent en milliers, des canons et des wagons furent abandonnés et la discipline s’écroula. À Krasnoi, les 15 et 18 novembre, des attaques russes coupèrent l’armée en morceaux ; l’arrière-garde de Ney échappa à travers le Dniepr gelé avec seulement quelques centaines d’hommes.
Battle of Maloyaroslavets: Bataille de Maloyaroslavets
24 October 1812: 24 octobre 1812
