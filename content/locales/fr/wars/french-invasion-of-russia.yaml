Across the Niemen: De l’autre côté des Niémens
June – July 1812: juin – juillet 1812
The alliance that Napoleon and Alexander I had made at Tilsit in 1807 broke down over the Continental System, his blockade of British trade, which Russia had given up, and over Poland. Napoleon gathered the largest army Europe had yet seen, roughly 450,000 men in the first wave and more than 600,000 in all. On 24 June 1812 its main body began crossing the Niemen from the Duchy of Warsaw on pontoon bridges near Kaunas. The two Russian armies in the west, under Mikhail Barclay de Tolly and Pyotr Bagration, had together some 180,000–220,000 men, and they fell back rather than be destroyed one at a time.: L’alliance que Napoléon et Alexandre Ier avaient faite à Tilsit en 1807 a brisé le système continental, son blocus du commerce britannique, que la Russie avait abandonné, et sur la Pologne. Napoléon a rassemblé la plus grande armée Europe avait encore vu, environ 450 000 hommes dans la première vague et plus de 600 000 en tout. Le 24 juin 1812, son corps principal a commencé à traverser les Niémens du Duché de Varsovie sur des ponts ponton près de Kaunas. Les deux armées russes de l’ouest, sous Mikhail Barclay de Tolly et Pyotr Bagration, avaient ensemble entre 180 000 et 220 000 hommes, et ils sont tombés au lieu d’être détruits un à la fois.
Napoleon entered Vilnius on 28 June and stayed there for more than two weeks. A provisional government of Lithuania was set up, and in Warsaw a confederation proclaimed the restoration of the Kingdom of Poland. Heat, storms, bad roads and the failure of the supply trains cost the Grande Armée tens of thousands of men and horses before any great battle. Bagration escaped Marshal Davout after a fight at Saltanovka near Mogilev, Barclay’s rearguard fought at Ostrovno near Vitebsk, and in early August the two Russian armies joined at Smolensk.: Napoléon est entré à Vilnius le 28 juin et y est resté plus de deux semaines. Un gouvernement provisoire de Lituanie a été mis en place, et à Varsovie une confédération a proclamé la restauration du Royaume de Pologne. La chaleur, les tempêtes, les mauvaises routes et l’échec des trains d’approvisionnement ont coûté des dizaines de milliers d’hommes et de chevaux avant toute grande bataille. Bagration échappé Marshal Davout après un combat à Saltanovka près de Mogilev, l’arrière-garde de Barclayl a combattu à Ostrovno près de Vitebsk, et au début d’août les deux armées russes se sont jointes à Smolensk.
