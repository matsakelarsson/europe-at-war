August 1812: août 1812
Napoleon tried to swing south of the Russians and seize Smolensk behind them. On 14 August at Krasnoi, General Dmitry Neverovsky’s division of about 7,000 men held off Murat’s cavalry in a fighting retreat, buying a day for the city to be reinforced. On 16 and 17 August the French attacked Smolensk, whose old walls were held first by Nikolay Raevsky’s corps and then by Dmitry Dokhturov’s. The city caught fire, and on the night of 17–18 August Barclay ordered it abandoned, blew up the powder stores and burned the bridge over the Dnieper.: Napoléon essaya de se balancer au sud des Russes et de saisir Smolensk derrière eux. Le 14 août à Krasnoi, le général Dmitry Neverovskys division d’environ 7.000 hommes a tenu hors de la cavalerie de Murat dans une retraite de combat, achetant un jour pour que la ville soit renforcée. Les 16 et 17 août, les Français attaquèrent Smolensk, dont les vieux murs furent d’abord tenus par le corps de Nikolay Raevsky, puis par Dmitry Dokhturov. La ville prit feu, et dans la nuit du 17 au 18 août Barclay ordonna l’abandon, fit exploser les magasins de poudre et brûla le pont sur le Dniepr.
Both sides lost many thousands of men, and much of the city was destroyed. On 19 August at Valutino the Russian rearguard held off Ney and Murat while the army escaped along the Moscow road. The long retreat had made Barclay, a general of Baltic German descent, deeply unpopular, and on 20 August Alexander gave the supreme command to the 67-year-old Mikhail Kutuzov. He joined the army at the end of the month and kept falling back towards Moscow while looking for a place to fight.: Le 19 août à Valutino, l’arrière-garde russe a tenu Ney et Murat pendant que l’armée s’échappait le long de la route de Moscou. La longue retraite avait fait Barclay, un général d’origine allemande Baltique, profondément impopulaire, et le 20 août Alexandre a donné le commandement suprême au Mikhaïl Kutuzov, 67 ans. Il a rejoint l’armée à la fin du mois et a continué de retomber vers Moscou tout en cherchant un endroit pour se battre.
