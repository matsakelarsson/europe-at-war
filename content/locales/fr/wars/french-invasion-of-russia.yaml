Battles of Krasnoi: Les batailles de Krasnoi
15–18 November 1812: 15–18 novembre 1812
The French kept the burned-out town, but Kutuzov’s army barred the road to Kaluga, forcing Napoleon back onto the devastated Smolensk road.: Les Français gardèrent la ville incendiée, mais l’armée de Kutuzov a barré la route vers Kaluga, forçant Napoléon à retourner sur la route dévastée de Smolensk.
Miloradovich attacked the French rearguard under Davout, which lost heavily before it got through the town.: Miloradovich a attaqué l’arrière-garde française sous Davout, qui a fortement perdu avant qu’il ne traverse la ville.
9–14 November 1812: 9–14 novembre 1812
The starving army found too little food and looted the stores. Many units no longer existed except on paper.: L’armée affamée a trouvé trop peu de nourriture et pillé les magasins. Beaucoup d’unités n’existaient plus que sur le papier.
Kutuzov’s attacks cost the Grande Armée tens of thousands of men killed, captured or scattered.: Les attaques de Kutuzov ont coûté à la Grande Armée des dizaines de milliers d’hommes tués, capturés ou dispersés.
The retreat: La retraite
The Berezina and the end: La Berezina et la fin
November – December 1812: novembre – décembre 1812
Two more Russian armies closed in on the Berezina, Admiral Pavel Chichagov’s from the south and Wittgenstein’s from the north, and on 21 November Chichagov took the bridge at Borisov. Napoleon feinted downstream while his engineers under General Jean-Baptiste Éblé, working in the icy river, built two trestle bridges near the village of Studzianka. From 26 to 29 November the army crossed under attack from both banks. When the bridges were burned on the morning of 29 November, thousands of stragglers and camp followers were still on the eastern bank. Tens of thousands were killed, drowned or captured, but most of the remaining fighting troops got across.: Deux autres armées russes fermèrent le pont sur la Berezina, l’amiral Pavel Chichagovís du sud et Wittgensteinís du nord, et le 21 novembre, Chichagov prit le pont à Borisov. Napoléon se fendit en aval tandis que ses ingénieurs sous la direction du général Jean-Baptiste Éblé, travaillant dans la rivière glacée, construisirent deux ponts de treillis près du village de Studzianka. Du 26 au 29 novembre, l’armée a traversé les deux rives sous l’attaque. Lorsque les ponts ont été incendiés le matin du 29 novembre, des milliers de traînards et d’adeptes étaient encore sur la rive est. Des dizaines de milliers ont été tués, noyés ou capturés, mais la plupart des troupes de combat restantes sont passées par là.
On 5 December Napoleon left the army at Smorgon and hurried to Paris to raise a new one. Temperatures fell to about −30 °C, and thousands more died on the road to Vilnius and in the city itself. Around 14 December the last of the main army, with Ney’s rearguard, crossed the Niemen at Kaunas. Of the more than 600,000 men who had entered Russia, only a small fraction came back. Russian losses were also enormous, and many civilians died. On 30 December the Prussian general Ludwig Yorck agreed at Tauroggen to take his corps out of the war, and Prussia soon changed sides.: Le 5 décembre, Napoléon quitta l’armée de Smorgon et se précipita vers Paris pour en élever une nouvelle. Les températures tombaient à environ -30 °C, et des milliers d’autres moururent sur la route de Vilnius et dans la ville elle-même. Parmi les plus de 600 000 hommes entrés en Russie, seule une petite fraction est revenue. Les pertes russes étaient énormes et de nombreux civils sont morts. Le 30 décembre, le général prussien Ludwig Yorck accepta à Tauroggen de sortir son corps de la guerre, et la Prusse changea bientôt de camp.
