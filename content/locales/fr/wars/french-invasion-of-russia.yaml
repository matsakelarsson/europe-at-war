The French took the Russian earthworks at great cost but did not destroy Kutuzov’s army, which withdrew in good order.: Les Français ont pris les travaux de terre russes à grand prix mais ne détruisirent pas l’armée de Kutuzov, qui se retirait en bon ordre.
