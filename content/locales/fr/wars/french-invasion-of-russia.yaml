French Invasion of Russia: Campagne de Russie
Napoleon’s invasion of the Russian Empire in 1812 with a multinational Grande Armée of more than 600,000 men, known in Russia as the Patriotic War of 1812. The Russian armies retreated, fought at Smolensk and Borodino and gave up Moscow, which burned; after five weeks Napoleon turned back, and hunger, cold, disease and Russian attacks destroyed most of his army before the survivors recrossed the Niemen in December.: L’invasion de l’Empire russe par Napoléon en 1812 avec une multinationale Grande Armée de plus de 600 000 hommes, connue en Russie comme la guerre patriotique de 1812. Les armées russes reculèrent, combattirent à Smolensk et Borodino et abandonnèrent Moscou qui brûla ; après cinq semaines Napoléon retourna, et la faim, le froid, les maladies et les attaques russes détruisirent la plupart de son armée avant que les survivants ne croisent les Niémens en décembre.
Dates are New Style (Gregorian). Russia used the Julian calendar, then 12 days behind, so Russian sources date the crossing of the Niemen to 12 June and the Battle of Borodino to 26 August 1812.: Les dates sont New Style (Gregorian). La Russie a utilisé le calendrier julien, puis 12 jours derrière, de sorte que les sources russes datent la traversée du Niémen au 12 juin et la bataille de Borodino au 26 août 1812.
The size of the Grande Armée and its losses are estimates, and sources differ widely. Only about half of it was French; the rest came from the Duchy of Warsaw, the German states, Italy, Austria, Prussia, Switzerland and elsewhere. Napoleon called the campaign the Second Polish War.: La taille de la Grande Armée et ses pertes sont des estimations, et les sources sont très différentes. Seulement la moitié d’entre elles était française ; le reste provenait du Duché de Varsovie, des États allemands, de l’Italie, de l’Autriche, de la Prusse, de la Suisse et d’ailleurs. Napoléon a appelé la campagne la Deuxième guerre polonaise.
The Napoleonic Wars as a whole are told in another story; this one covers only the Russian campaign of 1812. Places are named in their present-day forms.: Les guerres napoléoniennes dans leur ensemble sont racontées dans une autre histoire, celle-ci ne couvre que la campagne russe de 1812.
