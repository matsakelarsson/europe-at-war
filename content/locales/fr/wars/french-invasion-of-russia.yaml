Council at Fili: Conseil à Fili
13 September 1812: 13 septembre 1812
Kutuzov told his generals that losing Moscow did not mean losing Russia, and ordered the army to march through the city and out.: Kutuzov a dit à ses généraux que perdre Moscou ne signifiait pas perdre la Russie, et a ordonné à l’armée de marcher à travers la ville et dehors.
Kutuzov: Kutuzov
Moscow burns: Moscou brûle
14 September – 19 October 1812: 14 septembre – 19 octobre 1812
Napoleon entered Moscow on 14 September, but most of its roughly 270,000 people had left with the army. That night fires broke out across the city and burned until 18 September, destroying about three-quarters of it. The governor, Fyodor Rostopchin, had taken away the fire pumps, and many historians believe he ordered the city burned, though looting soldiers and accidents also played a part. Napoleon settled in the Kremlin and sent three offers of peace to Alexander, who did not reply.: Napoléon est entré à Moscou le 14 septembre, mais la plupart de ses quelque 270 000 personnes sont parties avec l’armée. Cette nuit-là, des incendies ont éclaté à travers la ville et brûlé jusqu’au 18 septembre, détruisant environ les trois quarts de celle-ci. Le gouverneur, Fyodor Rostopchin, avait enlevé les pompes à incendie, et de nombreux historiens pensent qu’il a ordonné le brûlage de la ville, bien que le pillage des soldats et les accidents aient également joué un rôle. Napoléon s’installa au Kremlin et envoya trois offres de paix à Alexandre, qui ne répondit pas.
Kutuzov’s army slipped away south-west to a camp at Tarutino, where it rested and grew while it covered the arsenal at Tula and the grain lands of the south. Cossacks, army raiders and armed peasants attacked French foragers and killed stragglers. On 18 October the Russians surprised Murat’s advance guard at Tarutino. The next day Napoleon left Moscow with about 100,000 men and a long train of loot, heading south-west for Kaluga, and the troops left behind blew up part of the Kremlin as they followed.: L’armée de Kutuzov a glissé au sud-ouest vers un camp à Tarutino, où elle s’est reposée et a grandi pendant qu’elle couvrait l’arsenal à Tula et les terres céréalières du sud. Cosaques, raideurs de l’armée et paysans armés ont attaqué des fermiers français et tué des traînards. Le lendemain, Napoléon quitta Moscou avec environ 100 000 hommes et un long train de pillards, se dirigeant vers le sud-ouest pour Kaluga.
Napoleon in Moscow: Napoléon à Moscou
Fire of Moscow: Feu de Moscou
