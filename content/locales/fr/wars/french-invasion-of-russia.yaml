Neverovsky’s infantry formed squares and retreated for miles under repeated cavalry charges, delaying the French advance on Smolensk.: Neverovskys l’infanterie forma des places et se retira pendant des miles sous des charges de cavalerie répétées, retardant l’avance française sur Smolensk.
The French stormed the suburbs but not the walls. The Russians left the burning city on the third night.: Les Français ont envahi la banlieue mais pas les murs. Les Russes ont quitté la ville en feu la troisième nuit.
A hard rearguard fight east of Smolensk. The French held the field, but the Russian army got away.: Un dur combat d’arrière-garde à l’est de Smolensk. Les Français ont tenu le champ, mais l’armée russe s’est enfuie.
Barclay and Bagration: Barclay et Bagration
Borodino: Borodino
7 September 1812: 7 septembre 1812
Kutuzov made his stand near the village of Borodino, about 110 km west of Moscow, with roughly 120,000 men, including militia and Cossacks, against some 130,000 under Napoleon. On 5 September the French took the Shevardino redoubt in front of the Russian left. At dawn on 7 September they attacked the earthworks known as the Bagration flèches, which changed hands several times before they fell. Bagration was mortally wounded. In the afternoon French cavalry and infantry took the Great Redoubt in the centre, held by Raevsky’s corps.: Kutuzov s’est tenu près du village de Borodino, à environ 110 km à l’ouest de Moscou, avec environ 120 000 hommes, y compris des milices et des cosaques, contre quelque 130 000 sous Napoléon. Le 5 septembre, les Français ont pris le refrain Shevardino devant la gauche russe. À l’aube du 7 septembre, ils ont attaqué les travaux terriens connus sous le nom de Flèches Bagration, qui ont changé de mains plusieurs fois avant leur chute. La cavalerie et l’infanterie française ont pris le Grand Redoubt au centre, tenu par le corps de Raevsky.
The Russians fell back a short way to a new line, but their army was not broken, and Napoleon refused to send in his Imperial Guard. Some 70,000 or more men were killed or wounded in one day, about 30,000–35,000 of them French and allied and 40,000–45,000 Russian by most estimates, the bloodiest single day of the Napoleonic Wars. Kutuzov withdrew towards Moscow. At a council of war in the village of Fili on 13 September he decided to give up the city rather than risk the army.: Les Russes sont retombés sur une nouvelle ligne, mais leur armée n’a pas été brisée, et Napoléon a refusé d’envoyer sa Garde Impériale. Environ 70 000 hommes ou plus ont été tués ou blessés en un jour, environ 30 000 à 35 000 d’entre eux français et alliés et 40 000 à 45 000 russes selon la plupart des estimations, le jour le plus sanglant des guerres napoléoniennes. Kutuzov se retira vers Moscou. Lors d’un conseil de guerre dans le village de Fili, le 13 septembre, il décida d’abandonner la ville plutôt que de risquer l’armée.
Battle of Borodino: Bataille de Borodino
