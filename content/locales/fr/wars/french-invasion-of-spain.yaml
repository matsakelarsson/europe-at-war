# Some French text was translated automatically.
"French invasion of Spain (1823)": "Invasion française de l’Espagne (1823)"
"The French intervention of 1823, approved by the great powers at the Congress of Verona, which overthrew Spain’s liberal constitutional government and restored King Ferdinand VII as an absolute monarch. A French army under the Duke of Angoulême, popularly called the Hundred Thousand Sons of Saint Louis, met little resistance, took Madrid in May and forced the surrender of Cádiz, the last refuge of the Cortes, after storming the Trocadero fort in August.": "L’intervention française de 1823, approuvée par les grandes puissances au Congrès de Vérone qui renversa l’Espagne le gouvernement constitutionnel libéral et rétablit le roi Ferdinand VII comme monarque absolu. Une armée française sous le duc d’Angoulême, appelé populairement les Cent Mille Fils de Saint Louis, rencontra peu de résistance, prit Madrid en mai et força la reddition de Cadix, dernier refuge des Cortes, après avoir pris le fort Trocadéro en août."
"In French the campaign is called l’expédition d’Espagne. Despite its popular name, the French army had between 60,000 and 95,000 men. The years of liberal rule it ended, 1820–1823, are known in Spain as the Trienio Liberal, and the years of absolutism that followed, to 1833, as the Ominous Decade.": "Malgré son nom populaire, l’armée française avait entre 60 000 et 95 000 hommes. Les années de régime libéral qu’elle a fini, 1820–1823, sont connues en Espagne comme le libéral Trienio, et les années d’absolutisme qui ont suivi, jusqu’à 1833, comme la décennie omineuse."
