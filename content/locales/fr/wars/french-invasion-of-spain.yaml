"June – November 1823": "juin – novembre 1823"
"French columns pursued the constitutional armies across the country. General Francisco Ballesteros surrendered in Andalusia on 4 August, and A Coruña, Pamplona and San Sebastián gave up in August and September. Cádiz, the refuge of the Cortes, was besieged from late June. On the night of 31 August French infantry waded across the channel in front of the Trocadero fort, which guarded the inner bay, and stormed it; the Place du Trocadéro in Paris is named after the victory. After the fort of Sancti Petri fell and the city was bombarded, the Cortes gave in and released the king, who crossed to the French camp at El Puerto de Santa María on 1 October.": "Les colonnes françaises poursuivirent les armées constitutionnelles à travers le pays. Le général Francisco Ballesteros se rendit en Andalousie le 4 août, et A Coruña, Pampelune et San Sebastián abandonnèrent en août et septembre. Dans la nuit du 31 août, l’infanterie française franchit le canal devant le fort Trocadéro, qui gardait la baie intérieure, et l’a envahie ; la place du Trocadéro à Paris porte le nom de la victoire. Après la chute du fort de Sancti Petri et le bombardement de la ville, les Cortes cèdent et libèrent le roi, qui passe au camp français d’El Puerto de Santa María le 1er octobre."
"Ferdinand at once annulled every act of the constitutional government since 1820, despite his promise of an amnesty, and began a decade of repression. Riego, captured in September, was hanged in Madrid on 7 November. Thousands of liberals were imprisoned or executed, or went into exile, many of them to Britain. In Catalonia General Francisco Espoz y Mina held Barcelona until 2 November. French troops stayed in Spain until 1828, partly to restrain the king’s ultra-royalist supporters.": "Ferdinand annula à la fois tous les actes du gouvernement constitutionnel depuis 1820, malgré sa promesse d’amnistie, et commença une décennie de répression. Riego, capturé en septembre, fut pendu à Madrid le 7 novembre. Des milliers de libéraux furent emprisonnés, exécutés ou exilés, dont beaucoup en Grande-Bretagne. En Catalogne, le général Francisco Espoz y Mina occupa Barcelone jusqu’au 2 novembre. Les troupes françaises sont restées en Espagne jusqu’en 1828, en partie pour contenir les partisans ultra-royalistes du roi."
