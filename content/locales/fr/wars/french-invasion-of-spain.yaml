"In January 1820 an army revolt led by Lieutenant Colonel Rafael del Riego forced King Ferdinand VII to restore the liberal constitution of 1812, and for three years Spain was governed by liberal ministers and an elected Cortes. Royalist bands, calling themselves the Army of the Faith, rose in the north and in 1822 set up a regency at La Seu d’Urgell, and Ferdinand secretly appealed to the other monarchies. At the Congress of Verona the great powers, over British objections, agreed that France should intervene, and in January 1823 Louis XVIII announced that a hundred thousand Frenchmen were ready to march to save the throne of Spain.": "En janvier 1820, une révolte de l’armée dirigée par le lieutenant-colonel Rafael del Riego força le roi Ferdinand VII à rétablir la constitution libérale de 1812 et, pendant trois ans, l’Espagne fut gouvernée par des ministres libéraux et un Cortes élu. Au Congrès de Vérone, les grandes puissances, au sujet des objections britanniques, conviennent que la France doit intervenir et, en janvier 1823, Louis XVIII annonce qu’une centaine de milliers de Français sont prêts à marcher pour sauver le trône d’Espagne."
"On 7 April a French army under the king’s nephew, the Duke of Angoulême, crossed the Bidasoa together with Spanish royalist troops. Unlike in 1808, most Spaniards did not resist, and in many places they welcomed the French as defenders of the king and the Church. The French left the fortresses behind them under blockade and entered Madrid on 24 May, where a royalist regency was set up. The Cortes had already moved to Seville, taking the king with them. On 11 June, when he refused to go further, they declared him temporarily unfit to rule and carried him off to Cádiz.": "Le 7 avril, une armée française sous le neveu du roi, le duc d’Angoulême, traversa la Bidasoa avec les troupes royalistes espagnoles. Contrairement à 1808, la plupart des Espagnols ne résistèrent pas, et en de nombreux endroits ils accueillirent les Français comme défenseurs du roi et de l’Église. Les Français laissèrent les forteresses derrière eux sous blocus et entrèrent à Madrid, le 24 mai, où une régence royaliste fut mise en place. Les Cortes avaient déjà déménagé à Séville, emmenant le roi avec eux. Le 11 juin, lorsqu’il refusa d’aller plus loin, ils le déclaraient temporairement inapte à gouverner et l’emmenèrent à Cadix."
