# French translations of the catalogue text (wave 14); step bodies follow later.
French–Kalinago wars: Guerres franco-kalinagos
? The wars in which French colonists took Guadeloupe, Martinique and Grenada from the Kalinago (Island Caribs) between 1635 and 1660. The Compagnie des Îles de l’Amérique, founded under Cardinal Richelieu, sent Charles Liénard de l’Olive and Jean du Plessis to Guadeloupe with 554 people in June 1635; short of food, they turned on the Kalinago, and a war of raids and reprisals lasted until a peace of 1640, after which the Kalinago withdrew from most of the island. On Martinique, settled from Saint Kitts by Pierre Belain d’Esnambuc in September 1635, his nephew Jacques Dyel du Parquet agreed a truce in 1637 that left the Kalinago the windward side, the Cabesterre. In 1649 du Parquet landed on Grenada, where an agreement with the Kalinago leader Kairouane soon gave way to five years of war; in 1650 or 1651 Kalinago fighters cornered at Sauteurs in the north threw themselves from the cliff rather than surrender, and by 1654 Kalinago resistance on the island had been crushed. Kalinago from Saint Vincent and Dominica attacked Martinique and Saint Lucia in 1654–1657, and after du Parquet’s death in 1658 the colonists drove the remaining Kalinago from the Cabesterre. On 31 March 1660, at Basse-Terre on Guadeloupe, the French governor Charles Houël and English representatives signed a treaty with Kalinago leaders that left them Dominica and Saint Vincent, which became their last refuges; the English and French later broke it.
: Les guerres par lesquelles des colons français prirent la Guadeloupe, la Martinique et la Grenade aux Kalinagos (Caraïbes insulaires) entre 1635 et 1660. La Compagnie des Îles de l’Amérique, fondée sous le cardinal de Richelieu, envoya Charles Liénard de l’Olive et Jean du Plessis en Guadeloupe avec 554 personnes en juin 1635 ; à court de vivres, ils se retournèrent contre les Kalinagos, et une guerre de raids et de représailles dura jusqu’à une paix conclue en 1640, après laquelle les Kalinagos se retirèrent de la plus grande partie de l’île. En Martinique, colonisée depuis Saint-Christophe par Pierre Belain d’Esnambuc en septembre 1635, son neveu Jacques Dyel du Parquet conclut en 1637 une trêve qui laissait aux Kalinagos la côte au vent, la Cabesterre. En 1649, Du Parquet débarqua à la Grenade, où un accord avec le chef kalinago Kairouane fit bientôt place à cinq années de guerre ; en 1650 ou 1651, des combattants kalinagos acculés à Sauteurs, dans le nord, se jetèrent du haut de la falaise plutôt que de se rendre, et en 1654 la résistance kalinago dans l’île avait été écrasée. Des Kalinagos de Saint-Vincent et de la Dominique attaquèrent la Martinique et Sainte-Lucie en 1654–1657, et après la mort de Du Parquet en 1658 les colons chassèrent de la Cabesterre les derniers Kalinagos. Le 31 mars 1660, à Basse-Terre, en Guadeloupe, le gouverneur français Charles Houël et des représentants anglais signèrent avec des chefs kalinagos un traité qui leur laissait la Dominique et Saint-Vincent, devenues leurs derniers refuges ; les Anglais et les Français le violèrent par la suite.
French colonists (the Compagnie des Îles de l’Amérique and the proprietary governors du Parquet and Houël): Colons français (la Compagnie des Îles de l’Amérique et les gouverneurs propriétaires Du Parquet et Houël)
