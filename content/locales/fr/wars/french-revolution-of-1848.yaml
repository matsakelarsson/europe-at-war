"French Revolution of 1848": "Révolution française de 1848"
? "The revolution that overthrew King Louis Philippe and founded the Second French Republic, and the workers’ rising of the June Days that followed. Protests in Paris began on 22 February 1848, after the government banned a banquet held by the reform movement, and turned into insurrection when soldiers fired on a crowd on the Boulevard des Capucines on 23 February, killing about 50 people. Paris was covered with barricades overnight, the National Guard largely sided with the crowds, and on 24 February Louis Philippe abdicated and fled to England. A provisional government proclaimed the republic, introduced universal male suffrage, abolished slavery in the colonies and set up National Workshops for the unemployed; the news set off revolutions across Europe. When the conservative assembly elected in April decided to close the workshops, the workers of eastern Paris rose on 23 June. General Louis-Eugène Cavaignac crushed the rising in four days of street fighting. By one count some 4,500 people were killed or wounded, among them the Archbishop of Paris, shot while trying to make peace at a barricade, and many captured insurgents were shot; more than 4,000 were deported to Algeria. In December 1848 Louis-Napoléon Bonaparte was elected president."
: "La révolution qui a renversé le roi Louis Philippe et fondé la Deuxième République française, et les ouvriers qui se sont levés des Jours de juin qui ont suivi. Les manifestations à Paris ont commencé le 22 février 1848, après que le gouvernement ait interdit un banquet tenu par le mouvement réformiste, et s’est transformé en insurrection lorsque des soldats ont tiré sur une foule sur le boulevard des Capucines le 23 février, tuant environ 50 personnes. Le 24 février, Louis Philippe abdiqua et s’enfuit en Angleterre. Un gouvernement provisoire proclama la république, introduisit le suffrage universel masculin, abolit l’esclavage dans les colonies et créa des ateliers nationaux pour les chômeurs ; les nouvelles firent éclater des révolutions partout en Europe. Lorsque l’assemblée conservatrice élue en avril décida de fermer les ateliers, les ouvriers de l’est de Paris se sont levés le 23 juin. Le général Louis-Eugène Cavaignac a écrasé la montée en quatre jours de combats de rue. D’un côté, quelque 4 500 personnes ont été tuées ou blessées, dont l’archevêque de Paris, abattues alors qu’elles tentaient de faire la paix à une barricade, et beaucoup d’insurgés capturés ont été abattus ; plus de 4000 ont été déportés en Algérie."
"Also called the February Revolution. In February republicans and workers fought the July Monarchy’s troops and Municipal Guard; in June workers fought the army and guards of the republic that the February revolution had created.": "En février, les républicains et les ouvriers combattaient les troupes de la Monarchie de juillet et la Garde municipale ; en juin, les ouvriers combattaient l’armée et les gardiens de la République que la révolution de février avait créée."
"Figures for the dead of the June Days vary widely between sources.": "Les chiffres pour les morts des Jours de Juin varient considérablement d’une source à l’autre."
