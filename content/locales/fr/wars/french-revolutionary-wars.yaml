"In the spring of 1794 the allies tried once more to break into France from Flanders, but at Tourcoing on 18 May the French under Joseph Souham beat a poorly coordinated attack by the Austrians and the Duke of York. On the Sambre the French crossed the river and were thrown back four times before Jourdan, with the new Army of the Sambre-and-Meuse, took Charleroi on 25 June. The next day Coburg attacked him at Fleurus, where the French watched his movements from an observation balloon, and after a long struggle the Austrians withdrew. At sea the British won the battle of the Glorious First of June, but the grain convoy from America that the French fleet had sailed out to protect reached France.": "Au printemps de 1794, les alliés essayèrent une fois de plus d’entrer en France depuis la Flandre, mais à Tourcoing le 18 mai, les Français, sous Joseph Souham, battaient une attaque mal coordonnée des Autrichiens et duc d’York. Sur le Sambre, les Français traversaient la rivière et furent repoussés quatre fois avant que Jourdan, avec la nouvelle armée du Sambre-et-Meuse, prenne Charleroi le 25 juin. Le lendemain, Coburg l’attaqua à Fleurus, où les Français observèrent ses mouvements depuis un ballon d’observation, et après une longue lutte, les Autrichiens se retiraient. En mer, les Britanniques remportèrent la bataille du Glorieux Premier Juin, mais le convoi de céréales d’Amérique que la flotte française avait embarqué pour protéger atteignit la France."
"The Austrians gave up the Netherlands. The French entered Brussels on 10 July, and Antwerp and Liège later that month. Jourdan beat the Austrians on the Ourthe in September and on the Roer in early October and reached the Rhine at Cologne and Koblenz, and Maastricht surrendered on 4 November. In the north Pichegru drove the British, Hanoverians and Dutch back across the great rivers. In Paris Robespierre fell on 27 July, and the Terror came to an end, but the occupied lands were stripped of food, money and works of art to pay for the war.": "Les Autrichiens abandonnèrent les Pays-Bas. Les Français entrèrent à Bruxelles le 10 juillet, et Anvers et Liège plus tard ce mois-là. Jourdan battit les Autrichiens sur l’Ourthe en septembre et sur le Roer au début d’octobre et atteignit le Rhin à Cologne et Koblenz, et Maastricht se rendit le 4 novembre. A Paris, Robespierre tomba le 27 juillet et la terreur prit fin, mais les terres occupées furent dépouillées de nourriture, d’argent et d’oeuvres d’art pour payer la guerre."
