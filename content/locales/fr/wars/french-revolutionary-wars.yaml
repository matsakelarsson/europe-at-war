"After the execution of Louis XVI on 21 January 1793 France declared war on Britain and the Dutch Republic, and soon Spain, Portugal, Naples and the Holy Roman Empire were at war with it too, in what became known as the First Coalition. Dumouriez invaded the Dutch Republic in February, but an Austrian army under the Prince of Saxe-Coburg drove the French back and beat them at Neerwinden on 18 March. Belgium was lost, and in April Dumouriez, having failed to turn his army against the Convention, went over to the Austrians. The allies besieged and took the frontier fortresses of Condé and Valenciennes, and the Prussians retook Mainz in July. Inside France revolts broke out in the Vendée, Lyon, Marseille and Toulon.": "Après l’exécution de Louis XVI le 21 janvier 1793, la France déclare la guerre à la Grande-Bretagne et à la République néerlandaise, et bientôt l’Espagne, le Portugal, Naples et le Saint Empire romain sont en guerre avec elle aussi, dans ce qui est devenu connu sous le nom de Première Coalition. Dumouriez envahit la République néerlandaise en février, mais une armée autrichienne sous le prince de Saxe-Coburg a repoussé les Français et les a battus à Neerwinden le 18 mars. La Belgique est perdue, et en avril Dumouriez, n’ayant pas remis son armée contre la Convention, se rend aux Autrichiens. Les alliés assiégés et prennent les forteresses frontalières de Condé et Valenciennes, et les Prussiens reprennent Mayence en juillet. En France des révoltes éclatent en Vendée, Lyon, Marseille et Toulon."
"The Republic answered with the Terror and with mass mobilisation. The levée en masse of 23 August 1793 put the whole nation at the service of the war and called up all unmarried men aged 18 to 25; by 1794 the armies, organised by Lazare Carnot, numbered some 750,000 men. Generals who failed were guillotined, among them Houchard, who beat the Duke of York’s Hanoverians at Hondschoote in September, saving Dunkirk, but did not follow up. Jourdan beat Coburg at Wattignies in October. At Toulon, which royalists had handed to an Anglo-Spanish fleet in August, a young artillery officer, Napoleon Bonaparte, helped plan the attack that forced the allies out on 19 December; hundreds of Toulonnais were shot in reprisal.": "La République a répondu avec la terreur et la mobilisation de masse. La lévée en masse du 23 août 1793 met toute la nation au service de la guerre et appelle tous les hommes célibataires âgés de 18 à 25 ans ; en 1794, les armées, organisées par Lazare Carnot, comptent environ 750 000 hommes. Les généraux qui échouèrent furent guillotinés, parmi lesquels Houchard, qui battit le duc d’York à Hondschoote en septembre, sauvant Dunkerque, mais n’ayant pas suivi. Jourdan bat Coburg à Wattignies en octobre. À Toulon, que les royalistes avaient remis à une flotte anglo-espagnole en août, un jeune officier d’artillerie, Napoléon Bonaparte, a aidé à planifier l’attaque qui a forcé les alliés à sortir le 19 décembre ; des centaines de Toulonnais ont été abattus en représailles."
