"The Batavian Republic became France’s ally and paid heavily for the privilege.": "La République Batave est devenue alliée de la France et a payé lourdement pour le privilège."
"Luxembourg": "Luxembourg"
"November 1794 – 7 June 1795": "novembre 1794 – 7 juin 1795"
"One of the strongest fortresses in Europe, it surrendered after a blockade of seven months.": "Une des forteresses les plus fortes d’Europe, elle s’est rendue après un blocus de sept mois."
"5 April and 22 July 1795": "5 avril et 22 juillet 1795"
"France made peace with Prussia here in April and with Spain in July.": "La France a fait la paix avec la Prusse ici en avril et avec l’Espagne en juillet."
"British retreat": "Retraite britannique"
"Annexed by France, 1795": "Annexe par la France, 1795"
"Occupied by France, the left bank of the Rhine": "Occupé par la France, la rive gauche du Rhin"
"The Rhine and Bonaparte in Italy": "Le Rhin et Bonaparte en Italie"
"1796–1797": "1796–1797"
"In 1796 the Directory sent two armies across the Rhine into Germany, under Jourdan and Moreau, and gave a third, the small and ragged Army of Italy, to the 26-year-old Napoleon Bonaparte. In Germany the Archduke Charles, the Emperor’s brother, used his central position to beat Jourdan at Amberg in August and Würzburg in September, and both French armies fell back across the Rhine. In Italy Bonaparte split the Austrians from the Piedmontese at Montenotte in April, forced Sardinia out of the war within a month, and then beat the Austrians at Lodi on 10 May and entered Milan.": "En 1796, le Directoire envoya deux armées à travers le Rhin en Allemagne, sous Jourdan et Moreau, et donna une troisième, la petite armée d’Italie, à Napoléon Bonaparte, âgé de 26 ans. En Allemagne, l’archiduc Charles, frère de l’empereur, utilisa sa position centrale pour battre Jourdan à Amberg en août et à Würzburg en septembre, et les deux armées françaises regagnèrent le Rhin. En Italie, Bonaparte scinde les Autrichiens du Piémont à Montenotte en avril, force la Sardaigne à quitter la guerre dans un délai d’un mois, puis bat les Autrichiens à Lodi le 10 mai et entre à Milan."
"He besieged Mantua, Austria’s great fortress in Italy, and beat four Austrian attempts to relieve it, at Castiglione in August, Bassano in September, Arcole in November and Rivoli in January 1797; Mantua surrendered on 2 February. He then crossed the Alps towards Vienna, and on 18 April the Austrians agreed to preliminaries of peace at Leoben. In May Bonaparte put an end to the Republic of Venice, and he made Lombardy the core of a new Cisalpine Republic. By the Treaty of Campo Formio on 17 October 1797 Austria gave up Belgium and Lombardy and recognised the Cisalpine Republic, and received Venice, Istria and Dalmatia; secretly it agreed that France should have most of the left bank of the Rhine.": "Il assiégea Mantua, la grande forteresse d’Autriche en Italie, et battit quatre tentatives autrichiennes pour la soulager, à Castiglione en août, Bassano en septembre, Arcole en novembre et Rivoli en janvier 1797 ; Mantua se rendit le 2 février. Il traversa ensuite les Alpes en direction de Vienne et, le 18 avril, les Autrichiens acceptèrent des préliminaires de paix à Leoben. En mai Bonaparte mit fin à la République de Venise, et il fit de la Lombardie le noyau d’une nouvelle république cisalpine. Par le traité de Campo Formio du 17 octobre 1797 l’Autriche abandonna la Belgique et la Lombardie et reconnut la République cisalpine, et reçut Venise, Istrie et Dalmatie ; en secret elle accepta que la France ait la plus grande partie de la rive gauche du Rhin."
"Battle of Rivoli": "Bataille de Rivoli"
"14–15 January 1797, French victory": "14-15 janvier 1797, victoire française"
"Mantua surrenders": "Mantua se rend"
"2 February 1797": "2 février 1797"
"Treaty of Campo Formio": "Traité de Campo Formio"
"17 October 1797": "17 octobre 1797"
"Battle of Montenotte": "Bataille de Montenotte"
"12 April 1796": "12 avril 1796"
"Bonaparte’s first victory as an army commander. Within two weeks the King of Sardinia asked for an armistice, and in May he ceded Savoy and Nice.": "Bonaparte remporte la première victoire en tant que commandant de l’armée. En deux semaines, le roi de Sardaigne demande un armistice, et en mai il cède Savoie et Nice."
"Battle of Lodi": "Bataille de Lodi"
"10 May 1796": "10 mai 1796"
"French troops stormed the bridge over the Adda under fire. Milan opened its gates five days later.": "Les troupes françaises ont pris le pont sous le feu. Milan a ouvert ses portes cinq jours plus tard."
"Mantua": "Mantoue"
"July 1796 – 2 February 1797": "juillet 1796 – 2 février 1797"
"The siege drew one Austrian relief army after another into Italy. Wurmser held out with his garrison until hunger and disease forced him to surrender.": "Le siège a attiré une armée de secours autrichienne après une autre en Italie. Wurmser s’est tenu avec sa garnison jusqu’à ce que la faim et la maladie l’obligent à se rendre."
"Battle of Arcole": "Bataille d’Arcole"
"15–17 November 1796": "15–17 novembre 1796"
"Three days of fighting in the marshes by the Alpone. Bonaparte himself led a charge on the bridge, according to legend with a flag in his hand.": "Trois jours de combats dans les marais par l’Alpone. Bonaparte lui-même a mené une charge sur le pont, selon la légende avec un drapeau dans sa main."
"14–15 January 1797": "14–15 janvier 1797"
"Bonaparte beat Alvinczy’s converging columns on the plateau above the Adige, ending the last attempt to relieve Mantua.": "Bonaparte bat les colonnes convergentes d’Alvinczy sur le plateau au-dessus de l’Adige, mettant fin à la dernière tentative pour soulager Mantua."
"Battle of Amberg": "Bataille d’Amberg"
"24 August 1796": "24 août 1796"
"Archduke Charles caught Jourdan’s army in the Upper Palatinate and drove it back towards the Main.": "L’archiduc Charles a pris l’armée de Jourdan, dans le Palatinat supérieur, et l’a ramenée en direction du Main."
"Battle of Würzburg": "Bataille de Würzburg"
"3 September 1796": "3 septembre 1796"
"The Archduke beat Jourdan again, forcing the French back to the Rhine; Moreau then retreated through the Black Forest.": "L’Archevêque bat à nouveau Jourdan, forçant les Français à retourner au Rhin ; Moreau se retire alors dans la Forêt-Noire."
"Peace of Leoben": "Paix de Leoben"
"18 April 1797": "18 avril 1797"
"With French troops in Styria, a few days’ march from Vienna, Austria agreed to preliminaries of peace.": "Avec les troupes françaises en Styrie, quelques jours de marche de Vienne, l’Autriche a accepté des préliminaires de paix."
"Signed at Passariano and named after a nearby village. The thousand-year-old Republic of Venice was divided between Austria and the Cisalpine Republic.": "Signé à Passariano et nommé d’après un village voisin. La République de Venise millénaire a été divisée entre l’Autriche et la République Cisalpine."
"Bonaparte": "Bonaparte"
"Moreau": "Moreau"
"Archduke Charles": "Archduke Charles"
"Venetian lands given to Austria at Campo Formio": "Terres vénitiennes données à l’Autriche au Campo Formio"
"The Second Coalition, Zürich and Holland": "La deuxième coalition, Zürich et Hollande"
"1798–1799": "1798–1799"
"In 1798 France set up a Roman Republic, occupied Switzerland, which became the Helvetic Republic, and sent Bonaparte with an army to Egypt. He took Malta on the way and Cairo in July, but on 1 August Nelson destroyed his fleet in Aboukir Bay, in the Battle of the Nile. Britain, Russia, Austria, Naples, Portugal and the Ottoman Empire formed a Second Coalition. Naples attacked first and lost its own capital, where the French set up a Parthenopean Republic in January 1799. In the spring the Archduke Charles beat Jourdan at Ostrach and Stockach, and an Austrian and Russian army under Alexander Suvorov drove the French out of most of Italy, winning at Cassano, on the Trebbia and at Novi.": "En 1798, la France crée une République romaine, occupe la Suisse, qui devient la République helvétique, et envoie Bonaparte avec une armée en Egypte. Il prend Malte sur le chemin et Le Caire en juillet, mais le 1er août Nelson détruit sa flotte dans la baie d’Aboukir, dans la bataille du Nil. Grande-Bretagne, Russie, Autriche, Naples, Portugal et l’Empire Ottoman forment une deuxième coalition. Naples attaque d’abord et perd sa propre capitale, où les Français établissent une République Parthénopéenne en janvier 1799. Au printemps l’archiduc Charles bat Jourdan à Ostrach et Stockach, et une armée autrichienne et russe sous Alexander Suvorov chasse les Français de la majeure partie de l’Italie, gagnant à Cassano, sur la Trebbia et à Novi."
"Switzerland became a battlefield. The Archduke pushed Masséna out of Zürich in June, but when he was sent north to the Rhine, Masséna attacked the Russians under Alexander Korsakov at Zürich on 25–26 September and routed them. Suvorov, marching north from Italy over the St Gotthard Pass to join Korsakov, arrived too late and had to lead his army out over high Alpine passes in October. In Holland a British and Russian army under the Duke of York landed on 27 August, and the Dutch fleet surrendered to the British, but after battles around Bergen and Castricum York agreed at Alkmaar on 18 October to withdraw. Russia left the coalition, and on 9 November Bonaparte, back from Egypt, seized power in Paris.": "La Suisse est devenue un champ de bataille. L’archiduc a poussé Masséna hors de Zurich en juin, mais quand il a été envoyé au nord vers le Rhin, Masséna a attaqué les Russes sous Alexander Korsakov à Zürich les 25-26 septembre et les a roués. Suvorov, marchant au nord d’Italie sur le col St Gotthard pour rejoindre Korsakov, est arrivé trop tard et a dû mener son armée sur les cols alpins élevés en octobre. En Hollande, une armée britannique et russe sous le duc d’York débarqua le 27 août, et la flotte néerlandaise se rendit aux Britanniques, mais après des batailles autour de Bergen et Castricum York accepta à Alkmaar le 18 octobre de se retirer. La Russie quitta la coalition, et le 9 novembre Bonaparte, de retour d’Egypte, prit le pouvoir à Paris."
"Battle of the Nile": "Bataille du Nil"
"1–3 August 1798, British victory": "1-3 août 1798, victoire britannique"
"Second Battle of Zürich": "Deuxième bataille de Zurich"
"25–26 September 1799, French victory": "25-26 septembre 1799, victoire française"
"Convention of Alkmaar": "Convention d’Alkmaar"
"18 October 1799": "18 octobre 1799"
"Battle of Stockach": "Bataille de Stockach"
"25 March 1799": "25 mars 1799"
"Archduke Charles beat Jourdan’s Army of the Danube, which fell back across the Rhine.": "L’archiduc Charles a battu l’Armée du Danube de Jourdan, qui est retombée sur le Rhin."
"Battle of the Trebbia": "Bataille de Trebbia"
"17–19 June 1799": "17–19 juin 1799"
"Suvorov’s Austrians and Russians beat Macdonald’s army, marching north from Naples, in three days of fighting west of Piacenza.": "Les Autrichiens et les Russes ont battu l’armée Macdonald, marchant au nord de Naples, en trois jours de combats à l’ouest de Piacenza."
"Battle of Novi": "Bataille de Novi"
"15 August 1799": "15 août 1799"
"The French commander, Barthélemy Joubert, was killed early in the battle, and his army was driven back into the Ligurian mountains.": "Le commandant français, Barthélemy Joubert, a été tué au début de la bataille et son armée a été repoussée dans les montagnes liguriennes."
"25–26 September 1799": "25–26 septembre 1799"
"Masséna crossed the Limmat by surprise and broke Korsakov’s army, which fled north across the Rhine.": "Masséna traversa le Limmat par surprise et brisa l’armée de Korsakov, qui s’enfuit au nord en traversant le Rhin."
"St Gotthard Pass": "Col Saint-Gothard"
"24 September 1799": "24 septembre 1799"
"Suvorov forced the pass and the Devil’s Bridge beyond it, but by the time he came down from the mountains Korsakov had been beaten.": "Suvorov a forcé le col et le pont du Diable au-delà, mais au moment où il est descendu des montagnes Korsakov avait été battu."
"Anglo-Russian landing": "Atterrissage anglo-russe"
"27 August 1799": "27 août 1799"
"British troops came ashore near Callantsoog in North Holland; three days later the Dutch fleet surrendered without a fight.": "Les troupes britanniques sont arrivées à terre près de Callantsoog en Hollande du Nord ; trois jours plus tard, la flotte néerlandaise s’est rendue sans se battre."
"Battle of Bergen": "Bataille de Bergen"
"19 September 1799": "19 septembre 1799"
"General Brune’s French and Batavian troops threw back the allied attack, and the Russian columns suffered heavily.": "Les troupes françaises et bataves du général Brune ont repoussé l’attaque alliée, et les colonnes russes ont beaucoup souffert."
"Battle of Castricum": "Bataille de Castricum"
"6 October 1799": "6 octobre 1799"
"The last battle of the campaign. Days later York agreed at Alkmaar to evacuate his army.": "La dernière bataille de la campagne. Quelques jours plus tard, York accepta à Alkmaar d’évacuer son armée."
"Suvorov": "Suvorov"
"Retaken from the French by the Austrians and Russians, 1799": "Reprise des Français par les Autrichiens et les Russes, 1799"
"Anglo-Russian bridgehead, September – October 1799": "Tête de pont anglo-russe, septembre – octobre 1799"
"Marengo and Hohenlinden": "Marengo et Hohenlinden"
"Bonaparte, now First Consul, offered peace, which Austria and Britain refused. In the spring of 1800 the Austrians under Michael von Melas besieged Masséna in Genoa, while Moreau crossed the upper Rhine and pushed the Austrians in Swabia back to Ulm. Bonaparte led a new Reserve Army over the Great St Bernard Pass in May and came down into Lombardy behind Melas, entering Milan on 2 June. Genoa, starving, surrendered two days later.": "Au printemps 1800, les Autrichiens sous Michael von Melas ont assiégé Masséna à Gênes, tandis que Moreau a traversé le Rhin supérieur et repoussé les Autrichiens en Souabe retour à Ulm. Bonaparte a dirigé une nouvelle armée de réserve sur le Grand col St Bernard en mai et est descendu en Lombardie derrière Melas, entrant Milan le 2 juin. Gênes, affamé, s’est rendu deux jours plus tard."
"On 14 June Melas attacked Bonaparte’s army at Marengo, near Alessandria, and by the afternoon the French were retreating. Then General Desaix arrived with fresh troops; he was killed leading the counter-attack that, with a cavalry charge by Kellermann, broke the Austrians. The next day Melas agreed to withdraw east of the Mincio, leaving northern Italy to the French and Bonaparte more secure in power at home. Austria still would not make peace. On 3 December, in snowy forests east of Munich, Moreau destroyed the army of Archduke John at Hohenlinden and advanced towards Vienna, and on 25 December Austria agreed an armistice at Steyr.": "Le 14 juin, Melas attaqua l’armée de Bonaparte à Marengo, près d’Alessandria, et l’après-midi les Français se retiraient. Puis le général Desaix arriva avec de nouvelles troupes ; il fut tué en tête de la contre-attaque qui, avec une charge de cavalerie par Kellermann, brisa les Autrichiens. Le lendemain, Melas accepta de se retirer à l’est du Mincio, laissant le nord de l’Italie aux Français et Bonaparte plus sûr au pouvoir chez lui. L’Autriche ne ferait toujours pas la paix. Le 3 décembre, dans les forêts enneigées à l’est de Munich, Moreau détruisit l’armée de l’archiduc John à Hohenlinden et progressait vers Vienne, et le 25 décembre, l’Autriche accorda un armistice à Steyr."
"Battle of Marengo": "Bataille de Marengo"
"14 June 1800, French victory": "14 juin 1800, victoire française"
"Battle of Hohenlinden": "Bataille de Hohenlinden"
"3 December 1800, French victory": "3 décembre 1800, victoire française"
"Armistice of Steyr": "Armistice de Steyr"
"25 December 1800": "25 décembre 1800"
"Genoa": "Gênes"
"April – 4 June 1800": "avril – 4 juin 1800"
"Masséna held out for two months against the Austrians and a British naval blockade, until hunger forced him to surrender; his men marched out with the honours of war.": "Masséna a tenu deux mois contre les Autrichiens et un blocus naval britannique, jusqu’à ce que la faim l’oblige à se rendre ; ses hommes ont marché avec les honneurs de la guerre."
"Great St Bernard Pass": "Grand col de St Bernard"
"May 1800": "mai 1800"
"The Reserve Army crossed the pass, hauling its guns over the snow in hollowed-out tree trunks.": "L’Armée de réserve a traversé le col, tirant ses canons sur la neige dans des troncs d’arbres creusés."
"Milan": "Milan"
"2 June 1800": "2 juin 1800"
"Bonaparte entered the city and restored the Cisalpine Republic.": "Bonaparte est entré dans la ville et a restauré la République Cisalpine."
"14 June 1800": "14 juin 1800"
"A near-defeat turned into victory by Desaix’s arrival. The French bulletins later improved the story.": "Une quasi-déchéance s’est transformée en victoire par l’arrivée de Desaix. Les bulletins français ont par la suite amélioré l’histoire."
"Engen and Stockach": "Engen et Stockach"
"3 May 1800": "3 mai 1800"
"Moreau beat Paul Kray’s Austrians in two battles on the same day, opening the way to the Danube.": "Moreau bat les Autrichiens dans deux batailles le même jour, ouvrant la voie au Danube."
"3 December 1800": "3 décembre 1800"
"Moreau’s divisions fell on the Austrian columns strung out on forest roads. The Austrians lost about 13,000 men, many of them captured.": "Les divisions de Moreau sont tombées sur les colonnes autrichiennes enchaînées sur les routes forestières. Les Autrichiens ont perdu environ 13 000 hommes, dont beaucoup capturés."
"With Moreau’s army deep in Upper Austria, the Austrians stopped fighting.": "Les Autrichiens ont cessé de se battre avec l’armée Moreau en Haute-Autriche."
"Archduke John": "M. John Archduke"
"Lunéville and Amiens": "Lunéville et Amiens"
"1801–1802": "1801–1802"
"By the Treaty of Lunéville on 9 February 1801 Austria, signing also for the Holy Roman Empire, confirmed the terms of Campo Formio. France gained the whole left bank of the Rhine, and Austria recognised the Batavian, Helvetic, Cisalpine and Ligurian republics. The German princes who lost land on the left bank were to be compensated with church lands and free cities on the right bank, which led to the great redrawing of the German map in 1803. Naples made peace at Florence in March. Britain fought on alone; in Egypt a British army landed at Aboukir in March 1801 and forced the French army, which Bonaparte had left behind in 1799, to surrender at Cairo and Alexandria by September.": "Par le traité de Lunéville du 9 février 1801, l’Autriche, signant également pour le Saint Empire romain, confirma les termes de Campo Formio. La France gagna toute la rive gauche du Rhin et l’Autriche reconnut les républiques batave, helvétique, cisalpine et ligurienne. Les princes allemands qui ont perdu des terres sur la rive gauche devaient être indemnisés avec les terres de l’église et les villes libres sur la rive droite, ce qui a conduit à la grande redessination de la carte allemande en 1803. Naples fait la paix à Florence en mars. La Grande-Bretagne combattit seule ; en Égypte, une armée britannique débarqua à Aboukir en mars 1801 et força l’armée française, que Bonaparte avait laissée derrière elle en 1799, à se rendre au Caire et à Alexandrie en septembre."
"Exhausted by nine years of war, Britain and France made peace at Amiens on 25 March 1802, together with Spain and the Batavian Republic. Britain returned most of its conquests overseas except Trinidad, taken from Spain, and Ceylon, taken from the Dutch, and promised to give Malta back to the Knights of St John; France agreed to leave southern Italy, and Egypt went back to the Ottoman Empire. In August Bonaparte was made First Consul for life. The peace lasted only fourteen months. Quarrels over Malta and French expansion in Switzerland, Italy and the Netherlands led Britain to declare war again in May 1803, the beginning of the Napoleonic Wars.": "Épuisé par neuf années de guerre, la Grande-Bretagne et la France ont fait la paix à Amiens le 25 mars 1802, avec l’Espagne et la République Batavienne. La Grande-Bretagne a rendu la plupart de ses conquêtes outre-mer sauf Trinité, prise d’Espagne, et Ceylan, pris des Hollandais, et promis de rendre Malte aux Chevaliers de Saint-Jean ; la France a accepté de quitter le sud de l’Italie, et l’Egypte est retournée à l’Empire ottoman. En août Bonaparte fut nommé Premier Consul pour la vie. La paix ne dura que quatorze mois. Les Quarrels sur Malte et l’expansion française en Suisse, en Italie et aux Pays-Bas conduisirent la Grande-Bretagne à déclarer la guerre de nouveau en mai 1803, début des guerres napoléoniennes."
"Treaty of Lunéville": "Traité de Lunéville"
"9 February 1801, France and Austria": "9 février 1801, France et Autriche"
"Treaty of Amiens": "Traité d’Amiens"
"25 March 1802, France and Britain": "25 mars 1802, France et Grande-Bretagne"
"French surrender in Egypt": "La reddition française en Égypte"
"Cairo, June 1801; Alexandria, September 1801": "Le Caire, juin 1801 ; Alexandrie, septembre 1801"
"9 February 1801": "9 février 1801"
"Joseph Bonaparte and the Austrian envoy Ludwig von Cobenzl signed the peace, which made the Rhine the border of France.": "Joseph Bonaparte et l’envoyé autrichien Ludwig von Cobenzl signent la paix, qui fait du Rhin la frontière de la France."
"25 March 1802": "25 mars 1802"
"Joseph Bonaparte and Lord Cornwallis signed the peace that ended almost ten years of war between France and Britain.": "Joseph Bonaparte et Lord Cornwallis ont signé la paix qui a mis fin à près de dix ans de guerre entre la France et la Grande-Bretagne."
"Ceded to France at Lunéville, the left bank of the Rhine": "Ceded en France à Lunéville, la rive gauche du Rhin"
"The War of the First Coalition (McGill University Napoleon Collection)": "La guerre de la Première Coalition (collection Napoléon de l’Université McGill)"
"Custine’s advance on the Rhine (Musée Carnavalet)": "L’avancée de Custine sur le Rhin (musée Carnavalet)"
"The founding of the Batavian Republic (National Archives of the Netherlands)": "La fondation de la République batave (Archives nationales des Pays-Bas)"
"The first Italian campaign (Fondation Napoléon)": "La première campagne d’Italie (Fondation Napoléon)"
"The 1799 expedition to Holland (National Army Museum)": "L’expédition de Hollande de 1799 (National Army Museum)"
"The Second Battle of Zürich (City of Zürich)": "La seconde bataille de Zurich (ville de Zurich)"
"The second Italian campaign (Fondation Napoléon)": "La deuxième campagne d’Italie (Fondation Napoléon)"
