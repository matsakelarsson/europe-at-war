"Revolutionary France declared war on Austria on 20 April 1792, and Prussia joined Austria. An early French advance into the Austrian Netherlands collapsed in panic. In July the allied commander, the Duke of Brunswick, threatened Paris with destruction if the royal family were harmed, which helped bring down the monarchy on 10 August. His Prussian, Austrian and Hessian army, with French émigrés, crossed the border, took Longwy and Verdun and advanced into Champagne. On 20 September at Valmy the armies of Dumouriez and Kellermann stood firm under Prussian cannon fire, and Brunswick, his army sick with dysentery and short of supplies, broke off and retreated. The next day the National Convention abolished the monarchy.": "La France révolutionnaire a déclaré la guerre à l’Autriche le 20 avril 1792, et la Prusse est entrée en Autriche. Une première avancée française vers les Pays-Bas autrichiens s’est effondrée dans la panique. En juillet, le commandant allié, le duc de Brunswick, a menacé Paris de destruction si la famille royale était blessée, ce qui a contribué à faire tomber la monarchie le 10 août. Son armée prussienne, autrichienne et hessienne, avec des émigrés français, a traversé la frontière, pris Longwy et Verdun et avancé en Champagne. Le 20 septembre à Valmy, les armées de Dumouriez et Kellermann se tenaient fermes sous le feu du canon prussien, et Brunswick, son armée malade de dysenterie et de pénurie de vivres, s’est cassée et s’est retirée."
"The French now went over to the attack everywhere. An Austrian bombardment of Lille failed in October. In the south French armies occupied Savoy and Nice, lands of the King of Sardinia, and on the Rhine General Custine took Speyer, Worms and Mainz. In the north Dumouriez beat the Austrians at Jemappes, near Mons, on 6 November, the first great battle won by the Republic’s new armies, and by the end of the year the French held almost all of the Austrian Netherlands and Liège. On 19 November the Convention offered help to all peoples who wished to recover their liberty, and in December it ordered revolutionary government in the lands it occupied.": "Un bombardement autrichien de Lille échoua en octobre. Dans le sud des armées françaises occupèrent Savoie et Nice, terres du roi de Sardaigne, et sur le Rhin le général Custine prit Speyer, Worms et Mayence. Dans le nord de Dumouriez, les Autrichiens ont battu à Jemappes, près de Mons, le 6 novembre, la première grande bataille remportée par les nouvelles armées de la République, et à la fin de l’année les Français ont tenu presque tous les Pays-Bas autrichiens et Liège. Le 19 novembre, la Convention a offert une aide à tous les peuples qui voulaient récupérer leur liberté, et en décembre elle a ordonné un gouvernement révolutionnaire dans les pays qu’elle occupait."
