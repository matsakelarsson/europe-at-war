"French Revolutionary Wars": "Guerres de la Révolution française"
"The wars between Revolutionary France and two coalitions of European monarchies, led by Austria, Prussia, Britain and Russia. Saved at Valmy in 1792 and by mass conscription in 1793, the Republic conquered Belgium, the Dutch Republic, the left bank of the Rhine and northern Italy, ringing itself with sister republics, and after Bonaparte’s victories at Marengo and Hohenlinden the treaties of Lunéville and Amiens in 1801–1802 left France the dominant power on the Continent.": "Les guerres entre la France révolutionnaire et deux coalitions de monarchies européennes, menées par l’Autriche, la Prusse, la Grande-Bretagne et la Russie. Sauvée à Valmy en 1792 et par conscription de masse en 1793, la République a conquis la Belgique, la République néerlandaise, la rive gauche du Rhin et l’Italie du Nord, se faisant sonner avec des républiques soeurs, et après les victoires de Bonaparte à Marengo et Hohenlinden les traités de Lunéville et d’Amiens en 1801–1802 quittèrent la France le pouvoir dominant sur le continent."
"Dates are given by the Gregorian calendar. From late 1793 to 1805 the French Republic used its own Revolutionary calendar, so French sources date Bonaparte’s seizure of power 18 Brumaire Year VIII (9 November 1799).": "Les dates sont données par le calendrier grégorien. De la fin de 1793 à 1805 la République française a utilisé son propre calendrier révolutionnaire, ainsi les sources françaises datent Bonaparte de la saisie du pouvoir 18 Brumaire Année VIII (9 novembre 1799)."
"The wars are usually divided into the War of the First Coalition (1792–1797) and the War of the Second Coalition (1798–1802). Spain fought France in 1793–1795 and was its ally from 1796; Prussia left the war in 1795, and Russia fought only in 1799. The war in the Pyrenees, at sea, in the colonies and in Egypt is only outlined here; the War in the Vendée and the Irish Rebellion of 1798 have their own stories.": "Les guerres sont généralement divisées en la guerre de la première coalition (1792–1797) et la guerre de la deuxième coalition (1798–1802). L’Espagne combat la France en 1793–1795 et est son allié à partir de 1796 ; la Prusse quitte la guerre en 1795, et la Russie ne combat qu’en 1799. La guerre dans les Pyrénées, en mer, dans les colonies et en Égypte n’est que décrite ici ; la guerre de Vendée et la rébellion irlandaise de 1798 ont leurs propres histoires."
"“Belgium” here means the Austrian Netherlands and the Prince-Bishopric of Liège, which France annexed in 1795.": "La Belgique signifie ici les Pays-Bas autrichiens et le Prince-Bishopric de Liège, que la France a annexé en 1795."
