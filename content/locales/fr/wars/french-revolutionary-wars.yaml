"In the hard winter of 1794–1795 the rivers froze, and Pichegru’s army crossed them on the ice into the Dutch Republic. The British retreated through the eastern provinces to Germany in bitter cold, losing thousands of men, and the stadtholder William V fled to England on 18 January. Dutch Patriots, many back from exile in France, took over the towns and proclaimed the Batavian Republic on 19 January. On 23 January French hussars captured the Dutch fleet, frozen into the ice off Den Helder. By the Treaty of The Hague on 16 May the new republic became France’s ally, ceded Maastricht, Venlo and Zeelandic Flanders, and agreed to pay 100 million guilders and to keep a French army.": "Pendant l’hiver dur de 1794–1795, les rivières gelèrent, et l’armée de Pichegrus les traversa sur la glace en République néerlandaise. Les Britanniques se replièrent dans les provinces orientales vers l’Allemagne dans un froid amer, perdant des milliers d’hommes, et le stadtholder William V s’enfuit en Angleterre le 18 janvier. Le 23 janvier, des hussards français capturèrent la flotte néerlandaise, gelés dans la glace au large de Den Helder. Par le traité de La Haye du 16 mai, la nouvelle république devint alliée de la France, céda Maastricht, Venlo et Flandre zélandaise, et accepta de payer 100 millions de florins et de conserver une armée française."
"The coalition fell apart. Prussia, more interested in its share of Poland, made peace at Basel on 5 April, accepting in a secret article that France would keep the left bank of the Rhine until a general peace, and northern Germany became neutral behind a demarcation line. Spain made peace on 22 July, ceding its half of Hispaniola, and Hesse-Kassel in August. The fortress of Luxembourg surrendered on 7 June after a long blockade, and in July General Hoche crushed a British-backed landing of émigrés at Quiberon in Brittany. On 1 October the Convention annexed the Austrian Netherlands and Liège to France, and at the end of the month it handed power to a new government, the Directory. Austria and Britain fought on.": "La Prusse, plus intéressée par sa part de la Pologne, a fait la paix à Bâle le 5 avril, acceptant dans un article secret que la France garderait la rive gauche du Rhin jusqu’à une paix générale, et le nord de l’Allemagne est devenu neutre derrière une ligne de démarcation. L’Espagne a fait la paix le 22 juillet, cédant sa moitié d’Hispaniola, et Hesse-Kassel en août. La forteresse du Luxembourg s’est rendue le 7 juin après un long blocus et, en juillet, le général Hoche a écrasé un débarquement d’émigrés soutenu par les Britanniques à Quiberon, en Bretagne. Le 1er octobre, la Convention a annexé les Pays-Bas autrichiens et Liège à la France, et à la fin du mois elle a remis le pouvoir à un nouveau gouvernement, le Directoire. L’Autriche et la Grande-Bretagne se sont battues."
