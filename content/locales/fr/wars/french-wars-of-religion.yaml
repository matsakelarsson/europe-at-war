"Coligny returned to court after the peace, gained the young king’s ear and urged war on Spain in the Netherlands. To seal the peace, Catherine arranged the marriage of her daughter Margaret to the Protestant Henry of Navarre, and Huguenot nobles crowded into Catholic Paris for the wedding on 18 August 1572. On 22 August a gunman wounded Coligny. Fearing Huguenot revenge, the king and his council decided to kill their leaders. Before dawn on 24 August, St Bartholomew’s Day, Guise’s men murdered Coligny in his lodgings, and the killing spread as Paris militiamen and crowds murdered Protestant men, women and children over several days.": "Pour sceller la paix, Catherine organisa le mariage de sa fille Margaret à l’Henri protestant de Navarre, et les nobles de Huguenot se jetèrent dans Paris catholique pour le mariage du 18 août 1572. Le 22 août, un homme armé blessait Coligny. Craignant la vengeance de Huguenot, le roi et son conseil décidèrent de tuer leurs chefs. Avant l’aube du 24 août, Saint-Barthélemy, les hommes de Guise ont assassiné Coligny dans ses logements, et l’assassinat s’est répandu alors que des miliciens et des foules de Paris avaient assassiné des hommes, des femmes et des enfants protestants pendant plusieurs jours."
"In the following weeks there were massacres in Orléans, Lyon, Rouen, Bordeaux, Toulouse and other towns. Modern estimates put the dead at about 3,000 in Paris and several thousand more elsewhere, though figures vary widely; many survivors converted or fled abroad, Navarre and the young Condé among those who converted to save their lives. Protestant Europe was horrified, while the pope had a Te Deum sung. The Huguenots of the south and west took up arms again. La Rochelle withstood a royal siege until July 1573, and Sancerre was starved into surrender in August; the Edict of Boulogne allowed Protestant worship only in La Rochelle, Montauban and Nîmes.": "Dans les semaines suivantes, il y a eu des massacres à Orléans, Lyon, Rouen, Bordeaux, Toulouse et d’autres villes. Les estimations modernes mettent les morts à environ 3000 à Paris et plusieurs milliers d’autres ailleurs, bien que les chiffres varient largement ; de nombreux survivants se sont convertis ou ont fui à l’étranger, Navarre et le jeune Condé parmi ceux qui se sont convertis pour sauver leur vie. Les Huguenots du sud et de l’ouest reprirent les armes. La Rochelle résista à un siège royal jusqu’en juillet 1573, et Sancerre fut affamé en août ; l’édit de Boulogne ne permit le culte protestant qu’à La Rochelle, Montauban et Nîmes."
