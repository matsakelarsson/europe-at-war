"Blois": "Blois"
"23 December 1588": "23 décembre 1588"
"Summoned to the king’s chamber in the château, Guise was stabbed to death by members of the royal guard known as the Forty-Five.": "Convoqué à la chambre du roi dans le château, Guise a été poignardé à mort par des membres de la garde royale connue sous le nom de quarante-cinq."
"Plessis-lès-Tours": "Plessis-lès-Tours"
"30 April 1589": "30 avril 1589"
"Henry III and Henry of Navarre met and joined forces against the League.": "Henry III et Henry de Navarre se rencontrent et unissent leurs forces contre la Ligue."
"Saint-Cloud": "Saint-Cloud"
"1 August 1589": "1er août 1589"
"Jacques Clément, a Dominican friar who had gained an audience, stabbed the king in his camp outside Paris. Henry III died the next day, the last of the Valois kings.": "Jacques Clément, un frère dominicain qui avait gagné une audience, poignarda le roi dans son camp à l’extérieur de Paris. Henry III mourut le lendemain, le dernier des rois Valois."
"German army": "Armée allemande"
"Joyeuse": "Joyeuse"
"Arques, Ivry and the siege of Paris": "Arques, Ivry et le siège de Paris"
"1589–1594": "1589–1594"
"Most Catholics would not accept a Protestant king. The League proclaimed Navarre’s elderly uncle, the Cardinal of Bourbon, king as “Charles X”, and Guise’s brother, the Duke of Mayenne, marched to crush Henry IV in Normandy. Henry beat him at Arques near Dieppe in September 1589, and on 14 March 1590 won a full victory at Ivry. He then blockaded Paris, burning the mills and cutting off its food. The city, ruled by radical Leaguers, held out through the summer; an estimated 40,000–50,000 people died, most of starvation. In late August Spain’s commander in the Netherlands, the Duke of Parma, marched in, took Lagny and reopened supply routes, and Henry withdrew.": "La Ligue proclama l’oncle âgé de Navarre, le cardinal de Bourbon, roi de Charles X, et le frère de Guise, le duc de Mayenne, marchèrent pour écraser Henri IV en Normandie. Henry le battit à Arques près de Dieppe en septembre 1589, et le 14 mars 1590 gagna une victoire complète à Ivry. Il a ensuite bloqué Paris, brûlant les moulins et coupant sa nourriture. La ville, gouvernée par des ligueurs radicaux, s’est tenue tout au long de l’été ; environ 40 000 à 50 000 personnes sont mortes, la plupart de faim. À la fin août Espagne, le commandant aux Pays-Bas, le duc de Parme, a marché, a pris Lagny et rouvert les routes d’approvisionnement, et Henry se retire."
"The war spread across France. Spanish troops landed in Brittany to help the League’s governor, the Duke of Mercœur, Savoy invaded Provence, and England sent soldiers to Normandy and Brittany. Parma relieved Rouen too in 1592, but died that December. Weary of war and of Spain’s influence, many Catholics drifted to Henry, especially when the League’s Estates in Paris discussed a Spanish princess for the throne. On 25 July 1593 Henry heard Mass at Saint-Denis and abjured Protestantism. He was crowned at Chartres in February 1594, and on 22 March Paris opened its gates; the Spanish garrison marched out.": "La guerre s’étendit sur toute la France. Des troupes espagnoles débarquent en Bretagne pour aider le gouverneur de la Ligue, le duc de Merceur, Savoy envahit la Provence et l’Angleterre envoie des soldats en Normandie et en Bretagne. Parma relève Rouen aussi en 1592, mais meurt en décembre. Le 25 juillet 1593, Henry entendit la messe à Saint-Denis et abjura le protestantisme. Il fut couronné à Chartres en février 1594 et, le 22 mars, Paris ouvrit ses portes ; la garnison espagnole partit."
"Battle of Arques": "Bataille des Arques"
"September 1589, royal victory": "Septembre 1589, victoire royale"
"Battle of Ivry": "Bataille d’Ivry"
"14 March 1590, royal victory": "14 mars 1590, victoire royale"
"Henry IV enters Paris": "Henry IV entre à Paris"
"22 March 1594": "22 mars 1594"
"15–29 September 1589": "15–29 septembre 1589"
"Entrenched around the castle of Arques, Henry’s small army beat off Mayenne’s much larger one, which then gave up the campaign.": "Entraînée autour du château d’Arques, la petite armée d’Henry a battu Mayenne beaucoup plus grande, qui a ensuite renoncé à la campagne."
"14 March 1590": "14 mars 1590"
"Fought on the plain north of Ivry. Henry told his men to follow his white plume; the League army broke and its Swiss surrendered.": "Frappé dans la plaine au nord d’Ivry. Henry a dit à ses hommes de suivre son panache blanc ; l’armée de la Ligue s’est brisée et ses Suisses se sont rendus."
"May – September 1590": "mai – septembre 1590"
"The city of perhaps 200,000 people was blockaded for four months, and the poor were reduced to eating grass and dogs.": "La ville de quelque 200 000 personnes a été bloquée pendant quatre mois, et les pauvres ont été réduits à manger de l’herbe et des chiens."
"Lagny": "Lagny"
"7 September 1590": "7 septembre 1590"
"Parma stormed the town on the Marne, opening the river route for food to Paris, and Henry lifted the siege.": "Parma s’empare de la ville sur la Marne, ouvrant le chemin du fleuve pour se nourrir à Paris, et Henry lève le siège."
"Blavet": "Défaut"
"October 1590": "octobre 1590"
"Spanish troops under Juan del Águila landed and fortified the port, later Port-Louis, as a base for helping Mercœur and threatening England.": "Les troupes espagnoles sous Juan del Águila débarquent et fortifient le port, plus tard Port-Louis, comme base pour aider le Merceur et menacer l’Angleterre."
"November 1591 – April 1592": "novembre 1591 – avril 1592"
"Henry, with English troops under the Earl of Essex, besieged the city until Parma came to its relief.": "Henry, avec des troupes anglaises sous le comte d’Essex, assiégea la ville jusqu’à ce que Parma vienne à son secours."
"Chartres": "Graphiques"
"27 February 1594": "27 février 1594"
"Henry was crowned in Chartres Cathedral, because Reims, where kings were traditionally crowned, was still held by the League.": "Henry a été couronné dans la cathédrale de Chartres, parce que Reims, où les rois étaient traditionnellement couronnés, était toujours détenu par la Ligue."
"Mayenne": "Mayenne"
"Parma": "Parme"
"Essex": "Essex"
"Success for Henry IV": "Succès pour Henry IV"
"Moves by Henry IV": "Déplacement par Henry IV"
"The Edict of Nantes and Vervins": "L’édit de Nantes et Vervins"
"1595–1598": "1595–1598"
"In January 1595 Henry declared war on Spain, hoping to unite the French against a foreign enemy. On 5 June he routed a Spanish and League force at Fontaine-Française in Burgundy, the pope lifted his excommunication that autumn, and Mayenne made his peace. In the north Spain did better. It took Cambrai in 1595 and Calais in April 1596, and in March 1597 Spanish soldiers disguised as peasants surprised Amiens. Henry besieged Amiens with a large army and retook it in September. One by one the League’s leaders made terms, the last, Mercœur in Brittany, in March 1598.": "En janvier 1595, Henry déclara la guerre à l’Espagne, espérant unir les Français contre un ennemi étranger. Le 5 juin, il dirigea une force espagnole et de la Ligue à Fontaine-Française en Bourgogne, le pape souleva son excommunication cet automne-là, et Mayenne fit sa paix. Au nord de l’Espagne fit mieux. Il prit Cambrai en 1595 et Calais en avril 1596, et en mars 1597 des soldats espagnols déguisés en paysans surprirent Amiens. Henry a assiégé Amiens avec une grande armée et l’a repris en septembre. Un par un les dirigeants de la Ligue ont fait des termes, le dernier, Merceur en Bretagne, en mars 1598."
"At Nantes in April 1598 Henry issued an edict for the Huguenots. It gave them freedom of conscience, public worship in named places, equal civil rights, special courts and, for eight years, control of many fortified towns. On 2 May the Peace of Vervins with Spain restored the borders of 1559; Spain gave back Calais and the other towns it had taken. The edict ended the wars but not the conflict. Huguenot risings in the 1620s ended with the loss of their fortresses, and Louis XIV revoked the edict in 1685.": "En avril 1598, à Nantes, Henry publia un édit pour les Huguenots. Il leur donna la liberté de conscience, le culte public dans des lieux désignés, l’égalité des droits civils, des tribunaux spéciaux et, pendant huit ans, le contrôle de nombreuses villes fortifiées. Le 2 mai, la paix des Vervins avec l’Espagne rétablit les frontières de 1559 ; l’Espagne rendit Calais et les autres villes qu’elle avait prises. Huguenot s’élève dans les années 1620 se termine avec la perte de leurs forteresses, et Louis XIV révoque l’édit en 1685."
