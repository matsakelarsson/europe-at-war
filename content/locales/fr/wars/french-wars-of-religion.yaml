"By 1560 perhaps a tenth of the French, among them many nobles, belonged to the Reformed church founded on John Calvin’s teaching; its members were called Huguenots. After Henry II’s death in 1559 the crown passed to boy kings, and the Catholic Guise family and the Protestant Bourbon princes competed for power, while the queen mother, Catherine de’ Medici, sought a compromise. Her Edict of January 1562 allowed Protestants to worship outside town walls. On 1 March the Duke of Guise’s men attacked a Protestant service in a barn at Vassy in Champagne and killed about fifty people. Louis, Prince of Condé, called the Huguenots to arms and seized Orléans on 2 April.": "En 1560, peut-être un dixième des Français, parmi lesquels beaucoup de nobles, appartenait à l’église réformée fondée sur l’enseignement de Jean Calvin ; ses membres ont été appelés Huguenots. Après la mort d’Henri II en 1559 la couronne est passée aux rois garçons, et la famille catholique Guise et les princes Bourbon protestants se sont battus pour le pouvoir, tandis que la reine mère, Catherine de : Médicis, a cherché un compromis. Son édit de janvier 1562 permit aux protestants d’adorer en dehors des murs de la ville. Le 1er mars, les hommes du duc de Guise ont attaqué un service protestant dans une grange à Vassy en Champagne et tué environ cinquante personnes. Louis, le prince de Condé, a appelé les Huguenots pour les armes et saisi Orléans le 2 avril."
"Protestants took Rouen, Lyon and many other towns, and both sides looked abroad. Condé promised Le Havre to Elizabeth I of England in return for troops and money; Spain and the pope helped the crown. The royal army retook Rouen in October. On 19 December the armies met at Dreux, where the Catholics won a hard battle in which each side’s commander was captured, Condé by the royalists and Constable Montmorency by the Huguenots. Guise then besieged Orléans, and there a Huguenot shot him in February 1563. The Edict of Amboise (19 March) allowed limited Protestant worship, and in July French Catholics and Protestants together drove the English from Le Havre.": "Les protestants prirent Rouen, Lyon et beaucoup d’autres villes, et les deux camps regardèrent à l’étranger. Condé promit Le Havre à Elizabeth Ier d’Angleterre en échange de troupes et d’argent ; l’Espagne et le pape aidèrent la couronne. L’armée royale reprit Rouen en octobre. Le 19 décembre, les armées se rencontrèrent à Dreux, où les catholiques remportèrent une bataille difficile au cours de laquelle le commandant de chaque camp fut capturé, Condé par les royalistes et le gendarme Montmorency par les Huguenots. Guise assiégea ensuite les Orléans, et là un Huguenot lui tira dessus en février 1563. L’édit d’Amboise (19 mars) a permis un culte protestant limité et, en juillet, catholiques français et protestants ont conduit ensemble les Anglais du Havre."
