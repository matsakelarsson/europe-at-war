"French Wars of Religion": "Guerres de Religion en France"
"A series of civil wars between French Catholics and Protestants (Huguenots), tangled with the rivalry of great noble families and foreign intervention by Spain, England and German princes. Begun with the massacre at Vassy in 1562 and marked by the St Bartholomew’s Day massacre of 1572, they ended when the Protestant Henry of Navarre, heir to the throne from 1584, became a Catholic, won over the Catholic League, granted the Huguenots toleration in the Edict of Nantes and made peace with Spain at Vervins in 1598.": "Une série de guerres civiles entre catholiques français et protestants (Huguenots), enchevêtrés avec la rivalité des grandes familles nobles et l’intervention étrangère de l’Espagne, de l’Angleterre et des princes allemands. Commencés par le massacre de Vassi en 1562 et marqués par le massacre de la Saint-Barthélemy de 1572, ils ont pris fin lorsque l’Henri protestant de Navarre, héritier du trône à partir de 1584, est devenu catholique, a gagné sur la Ligue catholique, accordé la tolérance des Huguenots dans l’édit de Nantes et fait la paix avec l’Espagne à Vervins en 1598."
"Historians usually count eight wars between 1562 and 1598, separated by edicts of pacification that rarely held for long. The Huguenot risings of the 1620s, ended by the Peace of Alès in 1629, are sometimes counted as a continuation.": "Les historiens comptent généralement huit guerres entre 1562 et 1598, séparées par des édits de pacification qui ont rarement tenu longtemps. Les montées de Huguenot des 1620, terminées par la Paix d’Alès en 1629, sont parfois comptées comme une continuation."
"France adopted the Gregorian calendar in December 1582; dates after that are New Style. Contemporary English accounts are ten days behind.": "La France a adopté le calendrier grégorien en décembre 1582 ; les dates suivantes sont New Style. Les comptes contemporains anglais sont à dix jours de retard."
"The Huguenots’ princely leaders came from the house of Bourbon, kings of Navarre and lords of Béarn, which is shown as their land. After Henry of Navarre became king in 1589, his royalists and the Huguenots fought on the same side against the League and Spain.": "Les chefs princiers des Huguenots vinrent de la maison de Bourbon, rois de Navarre et seigneurs de Béarn, qui est montré comme leur pays. Après Henri de Navarre est devenu roi en 1589, ses royalistes et les Huguenots ont combattu du même côté contre la Ligue et l’Espagne."
"Numbers killed in the massacres and sieges are uncertain and disputed. The wars as a whole are thought to have cost between two and four million lives, through violence, famine and disease.": "Les nombres de morts dans les massacres et les sièges sont incertains et contestés. On pense que les guerres dans leur ensemble ont coûté entre deux et quatre millions de vies, par la violence, la famine et la maladie."
