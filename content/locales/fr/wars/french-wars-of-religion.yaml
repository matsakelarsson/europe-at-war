"The peace did not last. In 1567 the Huguenot leaders tried to seize the young Charles IX at Meaux, and after an indecisive battle at Saint-Denis a second war ended in March 1568. That summer the crown moved to arrest Condé and Admiral Gaspard de Coligny, who escaped to La Rochelle, and a third war began. On 13 March 1569, at Jarnac on the Charente, the royal army under the king’s brother Henry, Duke of Anjou, routed the Huguenots. Condé, injured and captured, was shot dead by one of Anjou’s officers. Coligny took command in the name of two boys, Condé’s son and Henry of Navarre.": "En 1567, les dirigeants huguenots tentèrent de s’emparer du jeune Charles IX à Meaux et, après une bataille indécise à Saint-Denis, une seconde guerre prit fin en mars 1568. L’été même, la couronne décida d’arrêter Condé et l’amiral Gaspard de Coligny, qui s’échappèrent à La Rochelle, et une troisième guerre commença. Le 13 mars 1569, à Jarnac en Charente, l’armée royale sous le roi Henri, duc d’Anjou, a fait route vers les Huguenots. Condé, blessé et capturé, a été abattu par un des officiers d’Anjou. Coligny a pris le commandement au nom de deux garçons, le fils de Condés et Henry de Navarre."
"Joined by German mercenaries, Coligny won at La Roche-l’Abeille in June and besieged Poitiers, which held out under the young Henry of Guise. On 3 October Anjou crushed the Huguenot army at Moncontour. Coligny led its remnant on a long march through the south, wintered in Languedoc, and came back north up the Rhône into Burgundy, where he beat a royal army at Arnay-le-Duc in June 1570. The court, short of money, made peace at Saint-Germain-en-Laye on 8 August. The Huguenots gained freedom of worship in named places and, for two years, the fortified towns of La Rochelle, Cognac, Montauban and La Charité.": "Rejoint par des mercenaires allemands, Coligny gagne à La Roche-l’Abeille en juin et assiégé Poitiers, qui se tient sous le jeune Henry de Guise. Le 3 octobre Anjou a écrasé l’armée de Huguenot à Moncontour. Coligny mène son reste sur une longue marche à travers le sud, hiverne en Languedoc, et revient au nord du Rhône en Bourgogne, où il bat une armée royale à Arnay-le-Duc en juin 1570. La cour, à court d’argent, fait la paix à Saint-Germain-en-Laye le 8 août. Les Huguenots ont obtenu la liberté de culte dans des lieux désignés et, pendant deux ans, les villes fortifiées de La Rochelle, Cognac, Montauban et La Charité."
