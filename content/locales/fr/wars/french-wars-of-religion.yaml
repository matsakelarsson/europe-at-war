"The Catholic League and the War of the Three Henrys": "La Ligue catholique et la guerre des trois Henry"
"1584–1589": "1584–1589"
"Charles IX died in 1574, and his brother Henry of Anjou came home from Poland to reign as Henry III; wars and uneasy peaces followed. When the king’s last brother, Francis, died on 10 June 1584, the heir to the childless king became the Protestant Henry of Navarre. Catholic nobles led by Henry, Duke of Guise, revived the Catholic League, made a secret treaty with Philip II of Spain at Joinville on 31 December 1584 and raised the towns. In July 1585, by the Treaty of Nemours, Henry III gave in to them, outlawed Protestantism and excluded Navarre from the succession. The War of the Three Henrys, the king, Guise and Navarre, had begun.": "Charles IX mourut en 1574, et son frère Henri d’Anjou rentra de Pologne pour régner comme Henri III ; des guerres et des paixs difficiles suivirent. Lorsque le dernier frère du roi François mourut le 10 juin 1584, l’héritier du roi sans enfant devint le protestant Henry de Navarre. Les nobles catholiques dirigés par Henri, duc de Guise, ont relancé la Ligue catholique, conclu un traité secret avec Philippe II d’Espagne à Joinville le 31 décembre 1584 et élevé les villes. En juillet 1585, par le Traité de Nemours, Henri III leur a cédé, interdit le protestantisme et exclu Navarre de la succession. La guerre des Trois Henrys, le roi, Guise et Navarre, avait commencé."
"On 20 October 1587 Navarre won his first great victory at Coutras, where the king’s favourite, the Duke of Joyeuse, was killed, but Guise destroyed a German army coming to help the Huguenots. Guise was now the hero of Catholic Paris, and on 12 May 1588, the Day of the Barricades, the city rose against royal troops and the king fled. At the Estates-General in Blois Henry III had Guise killed by his guards on 23 December, and his brother the cardinal the next day. The League declared the king deposed; he allied with Navarre, and the two besieged Paris. On 1 August 1589 a friar, Jacques Clément, stabbed Henry III; dying, he recognised Navarre as his heir.": "Le 20 octobre 1587, Navarre remporte sa première grande victoire à Coutras, où le roi préféré, le duc de Joyeuse, est tué, mais Guise détruit une armée allemande venue aider les Huguenots. Guise est maintenant le héros de Paris catholique, et le 12 mai 1588, jour des Barricades, la ville se lève contre les troupes royales et le roi s’enfuit. Le lendemain, Guise fut tué par ses gardes et son frère le cardinal. La Ligue déclara le roi déposé ; il s’allia avec la Navarre et les deux assiégés de Paris. Le 1er août 1589, un frère, Jacques Clément, poignarda Henri III ; mourant, reconnut Navarre comme son héritier."
