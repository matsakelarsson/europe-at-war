# Some French text was translated automatically.
"The Fronde": "La Fronde"
"A series of civil wars in France during the minority of Louis XIV, against the government of the Queen Regent, Anne of Austria, and her chief minister, Cardinal Mazarin, whose taxes for the war with Spain had become unbearable. When the government arrested leaders of the Parlement of Paris in August 1648, barricades went up in the streets; the court fled the capital in January 1649 and the Prince of Condé blockaded it until the Peace of Rueil in March. Mazarin then had Condé and other princes arrested, setting off the “Fronde of the princes”, in which Condé allied with Spain. Turenne, now fighting for the crown, met Condé at the Faubourg Saint-Antoine outside Paris on 2 July 1652, where the guns of the Bastille covered Condé’s retreat into the city. Louis XIV re-entered Paris in October 1652 and Mazarin returned in February 1653; Bordeaux, the last centre of revolt, surrendered in the summer of 1653. Condé fought for Spain until 1659, and the young king never forgot the humiliations of these years.": "Pendant la minorité de Louis XIV, une série de guerres civiles éclate contre le gouvernement de la régente Anne d’Autriche et de son principal ministre, le cardinal Mazarin. Les impôts destinés à financer la guerre contre l’Espagne sont devenus insupportables. En août 1648, l’arrestation de magistrats du Parlement de Paris provoque l’érection de barricades. La cour quitte la capitale en janvier 1649 et le prince de Condé la bloque jusqu’à la paix de Rueil, en mars. Mazarin fait ensuite arrêter Condé et d’autres princes, ce qui déclenche la Fronde des princes, au cours de laquelle Condé s’allie à l’Espagne. Le 2 juillet 1652, Turenne, désormais au service de la Couronne, affronte Condé au faubourg Saint-Antoine. Les canons de la Bastille couvrent la retraite de Condé dans Paris. Louis XIV revient dans la capitale en octobre 1652 et Mazarin en février 1653. Bordeaux, dernier foyer de la révolte, se rend à l’été 1653. Condé combat pour l’Espagne jusqu’en 1659, et le jeune roi n’oublie jamais les humiliations de ces années."
"The name comes from the fronde, a sling used by Paris street boys. Historians distinguish the Fronde of the Parlement (1648–1649) and the Fronde of the princes (1650–1653). Turenne fought against the court in 1650 and for it from 1651.": "Le nom vient de la fronde, une écharpe utilisée par les street boys de Paris. Les historiens distinguent la Fronde du Parlement (1648-1649) et la Fronde des princes (1650-1653). Turenne a combattu contre la cour en 1650 et pour elle à partir de 1651."
