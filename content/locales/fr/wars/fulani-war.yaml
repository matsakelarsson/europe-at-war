# French translations of the catalogue text (wave 13); step bodies follow later.
Fulani War: Guerre peule
? The jihad of Usman dan Fodio, which overthrew the Hausa kingdoms of what is now northern Nigeria and created the Sokoto Caliphate, the largest state in West Africa in the 19th century. Usman, a Fulani scholar who had preached reform in Gobir and its neighbours for thirty years, was driven from his community at Degel by King Yunfa of Gobir, his former pupil, and on 21 February 1804 led his followers into exile at Gudu, where they swore allegiance to him as Commander of the Faithful. His army, Fulani, Hausa and Tuareg, beat Gobir’s cavalry at Tabkin Kwatto in June 1804, survived a heavy defeat at Tsuntua in December, took Kebbi in 1805 and made Gwandu its base. Leaders who received flags from Usman rose across Hausaland and took Katsina, Kano and Zazzau between 1805 and 1808, and the Gobir capital Alkalawa fell in October 1808. In Bornu the jihadists sacked the capital, Ngazargamu, in 1808, but the scholar Muhammad al-Amin al-Kanemi rallied the old empire, which survived under his family. By 1812 the new state was divided between Usman’s brother Abdullahi at Gwandu and his son Muhammad Bello at Sokoto, and new emirates were growing in the south and east, in Adamawa, Nupe and, from the 1820s, Ilorin. The wars enslaved many thousands of captives, and the caliphate became one of the largest slave societies of the century.
: Le djihad d’Ousmane dan Fodio, qui renversa les royaumes haoussa de l’actuel nord du Nigeria et créa le califat de Sokoto, le plus grand État d’Afrique de l’Ouest au XIXe siècle. Ousmane, lettré peul qui prêchait la réforme depuis trente ans au Gobir et dans les royaumes voisins, fut chassé de sa communauté de Degel par le roi Yunfa du Gobir, son ancien élève, et le 21 février 1804 il conduisit ses partisans en exil à Gudu, où ils lui prêtèrent allégeance comme commandeur des croyants. Son armée, composée de Peuls, de Haoussa et de Touareg, battit la cavalerie du Gobir à Tabkin Kwatto en juin 1804, survécut à une lourde défaite à Tsuntua en décembre, prit le Kebbi en 1805 et fit de Gwandu sa base. Des chefs qui avaient reçu un étendard des mains d’Ousmane se soulevèrent dans tout le pays haoussa et prirent Katsina, Kano et le Zazzau entre 1805 et 1808, et la capitale du Gobir, Alkalawa, tomba en octobre 1808. Au Bornou, les djihadistes saccagèrent la capitale, Ngazargamu, en 1808, mais le lettré Muhammad al-Amin al-Kanemi rallia le vieil empire, qui survécut sous sa famille. En 1812, le nouvel État était partagé entre le frère d’Ousmane, Abdullahi, à Gwandu, et son fils Muhammad Bello, à Sokoto, et de nouveaux émirats se développaient au sud et à l’est, dans l’Adamaoua, au Nupe et, à partir des années 1820, à Ilorin. Les guerres réduisirent en esclavage des milliers et des milliers de captifs, et le califat devint l’une des plus grandes sociétés esclavagistes du siècle.
