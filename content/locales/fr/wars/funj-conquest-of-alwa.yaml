# French translations of the catalogue text (wave 12); step bodies follow later.
Funj and Abdallab conquest of Alwa: Conquête de l’Alodie par les Founj et les Abdallab
? "The end of Alwa (Alodia), the last of the Christian Nubian kingdoms, whose capital Soba stood on the Blue Nile just above its meeting with the White Nile, and the rise of the Funj Sultanate of Sennar. By the 15th century Arab Bedouin had settled much of the central Nile valley and Alwa was in decline. Sudanese tradition credits its fall to an alliance between Abdallah Jamma, the ancestor of the Abdallab, who led Arab groups from his seat at Qerri, and Amara Dunqas, king of the Funj, cattle-keepers from the south who founded Sennar on the Blue Nile. The dates are uncertain: the Tabaqat of Wad Dayfallah (about 1700) puts the Funj victory over the “kingdom of the Nuba” in 1504–1505, documents from Shendi give 1509 for the destruction of Soba after an attack in 1474, and the 19th-century Funj Chronicle gives an earlier date. Most modern scholars think Arabs rather than the Funj destroyed Soba, around 1500. When the traveller David Reubeni passed in 1523 he found Soba in ruins, though he still heard of a “kingdom of Soba”, and tradition says Alwan princes held out in the Fazughli hills until the Funj took them in 1685. The Abdallab became vassals of the Funj, who ruled the Gezira from Sennar while the Abdallab governed the north from Qerri, and the Funj Sultanate lasted until the Egyptian conquest of 1821."
: "La fin de l’Alodie (Alwa), le dernier des royaumes chrétiens de Nubie, dont la capitale, Soba, se dressait sur le Nil Bleu, juste en amont de son confluent avec le Nil Blanc, et l’essor du sultanat founj de Sennar. Au XVe siècle, des Bédouins arabes s’étaient établis dans une grande partie de la vallée centrale du Nil, et l’Alodie était en déclin. La tradition soudanaise attribue sa chute à une alliance entre Abdallah Jamma, ancêtre des Abdallab, qui conduisait des groupes arabes depuis sa résidence de Qerri, et Amara Dunqas, roi des Founj, éleveurs de bétail venus du sud qui fondèrent Sennar sur le Nil Bleu. Les dates sont incertaines : les Tabaqat de Wad Dayfallah (vers 1700) placent la victoire des Founj sur le « royaume des Nouba » en 1504–1505, des documents de Shendi donnent 1509 pour la destruction de Soba, après une attaque en 1474, et la Chronique founj du XIXe siècle avance une date plus ancienne. La plupart des spécialistes modernes pensent que ce sont des Arabes, plutôt que les Founj, qui détruisirent Soba, vers 1500. Lorsque le voyageur David Reubeni passa par là en 1523, il trouva Soba en ruine, même s’il entendit encore parler d’un « royaume de Soba », et, selon la tradition, des princes alodiens résistèrent dans les collines du Fazughli jusqu’à ce que les Founj s’en emparent en 1685. Les Abdallab devinrent les vassaux des Founj, qui gouvernaient la Gezira depuis Sennar tandis que les Abdallab administraient le nord depuis Qerri, et le sultanat founj dura jusqu’à la conquête égyptienne de 1821."
