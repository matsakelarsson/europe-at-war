# French translations of the catalogue text (wave 13); step bodies follow later.
Futa Jallon jihad: Djihad du Fouta-Djalon
? "The holy war by which Muslim Fulbe and their allies took power in the Futa Jallon highlands of today’s Guinea and founded the Imamate of Futa Jallon, the first of the Fulbe Islamic states of West Africa. About 1725 Muslim leaders meeting at Fugumba called for jihad against the non-Muslim Yalunka (Jallonke) and Fulbe chiefs; led by the scholar Ibrahima Sambegu, known as Karamokho Alfa, and the commander Ibrahima Sori, they won a battle at Talansan, dated by most sources to about 1727, and founded a federation of nine provinces under an almami (imam) at Timbo, checked by a council of elders at Fugumba. Many Yalunka and Susu left the highlands. After Karamokho Alfa’s death in 1751 Ibrahima Sori fought on, allied with the Yalunka kingdom of Solima to raid for captives, was defeated in Wasulu in 1762 and nearly lost Fugumba to Konde Burama of Sankaran, and finally defeated Solima in 1776. The wars produced captives in large numbers: many were sold to European traders on the coast for cloth, iron and guns, and many more were settled as slaves in farming villages that fed the Fulbe elite."
: "La guerre sainte par laquelle des Peuls musulmans et leurs alliés prirent le pouvoir dans les hautes terres du Fouta-Djalon, dans l’actuelle Guinée, et fondèrent l’imamat du Fouta-Djalon, le premier des États islamiques peuls d’Afrique de l’Ouest. Vers 1725, des chefs musulmans réunis à Fougoumba appelèrent au djihad contre les chefs dialonké (jallonke) et peuls non musulmans ; conduits par le lettré Ibrahima Sambegu, dit Karamokho Alfa, et par le chef de guerre Ibrahima Sori, ils remportèrent à Talansan une bataille que la plupart des sources datent de 1727 environ, et fondèrent une fédération de neuf provinces placée sous un almamy (imam) siégeant à Timbo et contrôlé par un conseil des anciens à Fougoumba. Beaucoup de Dialonké et de Soussou quittèrent les hautes terres. Après la mort de Karamokho Alfa en 1751, Ibrahima Sori poursuivit la lutte, s’allia au royaume dialonké de Solima pour razzier des captifs, fut battu au Wassoulou en 1762, faillit perdre Fougoumba face à Konde Burama du Sankaran et vainquit finalement le Solima en 1776. Ces guerres produisirent des captifs en grand nombre : beaucoup furent vendus aux marchands européens de la côte contre des tissus, du fer et des fusils, et bien davantage furent installés comme esclaves dans des villages agricoles qui nourrissaient l’élite peule."
