# French translations of the catalogue text (wave 8); step bodies follow later.
Conquests of Kapilendra Deva: Conquêtes de Kapilendra Deva
? The wars of Kapilendra Deva, who seized the throne of Odisha from the last Eastern Ganga king in 1434–1435 and founded the Suryavamsi Gajapati dynasty. After putting down rebellious vassals, he turned south against the Reddi kingdoms of coastal Andhra and their ally Vijayanagara. His son Hamvira took Rajahmundry by 1448, and by 1454 the Gajapatis held Kondavidu and the other Reddi lands south to the Krishna. He fought the Bengal Sultanate in the north, took the fort of Mahur during a campaign against Malwa (1457) and defeated the Bahmanis at Devarakonda in 1458, after which he called himself lord of Kalaburagi (Gulbarga); a march on Bidar in 1461 ended when Husain Shah Sharqi of Jaunpur invaded Odisha. From 1460 Hamvira’s generals took Udayagiri and Chandragiri from Vijayanagara and raided as far south as Tiruchirappalli, and in 1464 Kapilendra’s inscriptions claim an empire from the Ganges to the Kaveri. After his death in 1466 or 1467 his sons fought over the throne, and the southern conquests were soon lost to Vijayanagara and the Bahmanis.
: Les guerres de Kapilendra Deva, qui s’empara en 1434–1435 du trône de l’Odisha aux dépens du dernier roi ganga oriental et fonda la dynastie Suryavamsi Gajapati. Après avoir mis au pas ses vassaux rebelles, il se tourna vers le sud contre les royaumes reddi de l’Andhra côtier et leur allié, Vijayanagar. Son fils Hamvira prit Rajahmundry dès 1448, et en 1454 les Gajapati tenaient Kondavidu et les autres terres reddi jusqu’à la Krishna au sud. Il combattit le sultanat du Bengale au nord, prit le fort de Mahur au cours d’une campagne contre le Malwa (1457) et battit les Bahmanides à Devarakonda en 1458, après quoi il se proclama seigneur de Kalaburagi (Gulbarga) ; une marche sur Bidar en 1461 tourna court lorsque Husain Shah Sharqi de Jaunpur envahit l’Odisha. À partir de 1460, les généraux de Hamvira prirent Udayagiri et Chandragiri à Vijayanagar et lancèrent des raids jusqu’à Tiruchirappalli au sud, et en 1464 les inscriptions de Kapilendra revendiquent un empire allant du Gange à la Kaveri. Après sa mort, en 1466 ou 1467, ses fils se disputèrent le trône, et les conquêtes du sud furent bientôt perdues au profit de Vijayanagar et des Bahmanides.
