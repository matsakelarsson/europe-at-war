# French translations of the catalogue text (wave 13); step bodies follow later.
Gambian coup attempt and Senegalese intervention (1981): Tentative de coup d’État en Gambie et intervention sénégalaise (1981)
? An attempt to overthrow President Dawda Jawara of the Gambia, crushed by Senegalese troops. On 30 July 1981, while Jawara was in London for the wedding of Prince Charles and Lady Diana Spencer, Kukoi Samba Sanyang, a left-wing former politician, and members of the paramilitary Field Force seized the Field Force depot at Bakau, the radio station and key points in Banjul, proclaimed a National Revolutionary Council and released and armed prisoners; members of Jawara’s family were among the hostages they took. Jawara flew to Dakar and invoked a defence agreement with Senegal, whose troops entered the Gambia from 31 July in an operation the Senegalese named Fodé Kaba II and, after several days of fighting in and around Banjul and Serrekunda, retook the country by 5 August; a small team of British SAS soldiers helped free the hostages. Estimates of the dead range from about 500 to over 1,000, many of them civilians killed in the fighting and in looting. Kukoi escaped abroad. The coup led to the Senegambia Confederation, agreed on 12 December 1981 and in force from 1 February 1982, which joined the two countries’ armed forces and foreign policy but was dissolved in 1989; Senegalese troops guarded Jawara’s government for much of the 1980s.
: Une tentative de renversement du président gambien Dawda Jawara, écrasée par les troupes sénégalaises. Le 30 juillet 1981, alors que Jawara se trouvait à Londres pour le mariage du prince Charles et de lady Diana Spencer, Kukoi Samba Sanyang, ancien homme politique de gauche, et des membres de la Field Force, force paramilitaire, s’emparèrent du dépôt de la Field Force à Bakau, de la station de radio et de points stratégiques de Banjul, proclamèrent un Conseil national révolutionnaire et libérèrent et armèrent des détenus ; des membres de la famille de Jawara figuraient parmi les otages qu’ils prirent. Jawara se rendit à Dakar par avion et invoqua un accord de défense avec le Sénégal, dont les troupes entrèrent en Gambie à partir du 31 juillet lors d’une opération que les Sénégalais baptisèrent Fodé Kaba II et, après plusieurs jours de combats à Banjul, à Serrekunda et dans leurs environs, reprirent le contrôle du pays le 5 août ; une petite équipe de soldats britanniques du SAS aida à libérer les otages. Les estimations du nombre de morts vont d’environ 500 à plus de 1 000, dont beaucoup de civils tués dans les combats et les pillages. Kukoi s’enfuit à l’étranger. Le coup d’État conduisit à la confédération de Sénégambie, conclue le 12 décembre 1981 et en vigueur à partir du 1er février 1982, qui réunit les forces armées et la politique étrangère des deux pays mais fut dissoute en 1989 ; des troupes sénégalaises protégèrent le gouvernement de Jawara pendant une grande partie des années 1980.
