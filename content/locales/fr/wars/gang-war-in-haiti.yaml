# French translations of the catalogue text (wave 14); step bodies follow later.
Gang war in Haiti: Guerre des gangs en Haïti
? The armed conflict between Haiti’s gangs and the Haitian state and the foreign forces sent to help it, which has left most of Port-au-Prince and large parts of the countryside under gang control. Armed groups tied to politicians and businessmen had long held the capital’s poor districts; from 2018, as protests against corruption shook President Jovenel Moïse’s government, they fought over territory and attacked residents, beginning with the massacre at La Saline in November 2018. In 2020 the former police officer Jimmy Chérizier, “Barbecue”, united nine gangs as the G9, opposed by the rival G-Pèp. Moïse was assassinated in July 2021, and under Prime Minister Ariel Henry, who governed without elections, kidnappings, massacres and blockades multiplied. In February and March 2024 the G9 and G-Pèp joined forces as Viv Ansanm, stormed the two largest prisons, closed the airport and forced Henry to resign; a Transitional Presidential Council took over, and from June 2024 a Kenyan-led Multinational Security Support mission (MSS), authorised by the United Nations, arrived to help the police. The gangs spread into the Artibonite and Centre departments, where the Gran Grif gang killed more than 100 people at Pont-Sondé in October 2024. In September 2025 the UN Security Council turned the under-strength mission into a larger Gang Suppression Force (GSF). The United Nations counted more than 4,700 people killed in 2023, 5,601 in 2024 and 5,915 in 2025, and nearly 1.5 million Haitians had been driven from their homes by 2026. In late 2026 the GSF, the police, the small Haitian army, private contractors with drones and some 2,500 Salvadoran troops were fighting to retake districts of the capital, while elections planned for December 2026 were postponed indefinitely.
: Le conflit armé qui oppose les gangs d’Haïti à l’État haïtien et aux forces étrangères envoyées pour l’aider, et qui a placé la majeure partie de Port-au-Prince et de vastes zones des campagnes sous le contrôle des gangs. Des groupes armés liés à des hommes politiques et à des hommes d’affaires tenaient depuis longtemps les quartiers pauvres de la capitale ; à partir de 2018, alors que des manifestations contre la corruption ébranlaient le gouvernement du président Jovenel Moïse, ils se disputèrent des territoires et s’en prirent aux habitants, à commencer par le massacre de La Saline en novembre 2018. En 2020, l’ancien policier Jimmy Chérizier, dit « Barbecue », réunit neuf gangs au sein du G9, auquel s’opposait le G-Pèp, son rival. Moïse fut assassiné en juillet 2021 et, sous le Premier ministre Ariel Henry, qui gouvernait sans élections, les enlèvements, les massacres et les blocus se multiplièrent. En février et mars 2024, le G9 et le G-Pèp s’allièrent sous le nom de Viv Ansanm, prirent d’assaut les deux plus grandes prisons, fermèrent l’aéroport et contraignirent Henry à démissionner ; un Conseil présidentiel de transition prit le relais et, à partir de juin 2024, une Mission multinationale d’appui à la sécurité (MMAS) dirigée par le Kenya et autorisée par les Nations unies arriva pour aider la police. Les gangs s’étendirent aux départements de l’Artibonite et du Centre, où le gang Gran Grif tua plus de 100 personnes à Pont-Sondé en octobre 2024. En septembre 2025, le Conseil de sécurité de l’ONU transforma cette mission en sous-effectif en une Force de répression des gangs (FRG) plus importante. Les Nations unies dénombrèrent plus de 4 700 personnes tuées en 2023, 5 601 en 2024 et 5 915 en 2025, et près de 1,5 million d’Haïtiens avaient été chassés de chez eux en 2026. Fin 2026, la FRG, la police, la petite armée haïtienne, des prestataires privés équipés de drones et quelque 2 500 soldats salvadoriens se battent pour reprendre des quartiers de la capitale, tandis que les élections prévues pour décembre 2026 ont été reportées sine die.
Haitian government and National Police, with the Kenyan-led MSS (from 2025 the Gang Suppression Force) and, from October 2026, troops of El Salvador: Gouvernement haïtien et Police nationale, avec la MMAS dirigée par le Kenya (à partir de 2025, la Force de répression des gangs) et, à partir d’octobre 2026, des troupes du Salvador
