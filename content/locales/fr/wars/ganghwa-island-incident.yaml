# French translations of the catalogue text (wave 10); step bodies follow later.
Ganghwa Island incident: Incident de l’île de Ganghwa
? A clash between the Japanese gunboat Un’yō and the Korean forts at the mouth of the Han River, which Japan used to force Korea to open its ports. After the Meiji Restoration Korea had refused to accept letters from the new Japanese government because they used titles reserved for the Chinese emperor, and talks at Busan in 1875 had failed. In September 1875 the Un’yō, under Inoue Yoshika, was surveying the Korean coast. On 20 September a boat from the ship approached the fort of Chojijin on Ganghwa Island, said to be looking for water, and the fort fired on it. The next day the Un’yō shelled Chojijin, and on 22 September it bombarded the fort of Yeongjongjin on Yeongjong Island and landed marines, who burned the town and carried off its cannon. Thirty-five Koreans were killed and sixteen captured; two Japanese were wounded. In February 1876 Japan sent Kuroda Kiyotaka with warships and troops to Ganghwa to demand redress, and on 26 February the Korean envoy Sin Heon signed the Japan–Korea Treaty of Amity, the Treaty of Ganghwa. It declared Korea an independent state with the same sovereign rights as Japan, opened Busan and two more ports (Wonsan and Incheon) to Japanese trade, gave Japanese subjects extraterritorial rights and allowed Japan to survey the Korean coast. It was the first of the unequal treaties that opened Korea.
: Un affrontement entre la canonnière japonaise Un’yō et les forts coréens de l’embouchure du fleuve Han, dont le Japon se servit pour contraindre la Corée à ouvrir ses ports. Après la restauration de Meiji, la Corée avait refusé d’accepter les lettres du nouveau gouvernement japonais parce qu’elles employaient des titres réservés à l’empereur de Chine, et des pourparlers tenus à Busan en 1875 avaient échoué. En septembre 1875, l’Un’yō, commandé par Inoue Yoshika, effectuait des relevés le long des côtes coréennes. Le 20 septembre, une embarcation du navire s’approcha du fort de Chojijin, sur l’île de Ganghwa, à la recherche d’eau, dit-on, et le fort ouvrit le feu sur elle. Le lendemain, l’Un’yō bombarda Chojijin et, le 22 septembre, il pilonna le fort de Yeongjongjin, sur l’île de Yeongjong, et débarqua des fusiliers marins qui incendièrent la ville et emportèrent ses canons. Trente-cinq Coréens furent tués et seize capturés ; deux Japonais furent blessés. En février 1876, le Japon envoya Kuroda Kiyotaka à Ganghwa avec des navires de guerre et des troupes pour exiger réparation et, le 26 février, l’envoyé coréen Sin Heon signa le traité d’amitié nippo-coréen, ou traité de Ganghwa. Celui-ci déclarait la Corée État indépendant jouissant des mêmes droits souverains que le Japon, ouvrait au commerce japonais Busan et deux autres ports (Wonsan et Incheon), accordait aux sujets japonais des droits d’exterritorialité et autorisait le Japon à faire des relevés hydrographiques des côtes coréennes. Ce fut le premier des traités inégaux qui ouvrirent la Corée.
