# French translations of the catalogue text (wave 10); step bodies follow later.
Gangyō rebellion: Rébellion de Gangyō
? A rising of the Emishi of northern Dewa against the officials of Akita Castle, the court’s frontier headquarters on the Sea of Japan coast. After years of harsh rule and a famine, Emishi living under the court’s authority (fushū) attacked Akita Castle in the third month of 878; its commander and the governor of Dewa fled, and the rebels burned the castle and the settlements around it. An army of 5,000 men from Mutsu and Dewa sent against them was routed at Akita in the sixth month, losing hundreds of suits of armour, its rice and some 1,500 horses. Twelve Emishi villages north of the Akita River joined the rising, with support from the Emishi of Tsugaru and Watarishima, and the rebels demanded that the land north of the river be recognised as their own. The regent Fujiwara no Mototsune sent Fujiwara no Yasunori, a governor known for good administration, as acting governor of Dewa, with the soldier Ono no Harukaze as frontier commander. Yasunori kept his troops on the defensive, opened the state granaries and offered pardons; from the eighth month the rebel groups came in to surrender, and in the third month of 879 the court called off the campaign. The settlement showed that the court could no longer impose its rule in the north by force. Akita Castle was rebuilt under a strengthened commander, the Akita-jō no suke.
: Un soulèvement des Emishi du nord du Dewa contre les fonctionnaires du château d’Akita, le quartier général frontalier de la cour sur la côte de la mer du Japon. Après des années de gouvernement brutal et une famine, des Emishi soumis à l’autorité de la cour (fushū) attaquèrent le château d’Akita au troisième mois de 878 ; son commandant et le gouverneur du Dewa s’enfuirent, et les rebelles incendièrent le château et les établissements alentour. Une armée de 5 000 hommes du Mutsu et du Dewa envoyée contre eux fut mise en déroute à Akita au sixième mois, perdant des centaines d’armures, son riz et quelque 1 500 chevaux. Douze villages emishi au nord de la rivière Akita se joignirent au soulèvement, avec le soutien des Emishi de Tsugaru et de Watarishima, et les rebelles exigèrent que les terres au nord de la rivière leur soient reconnues. Le régent Fujiwara no Mototsune envoya Fujiwara no Yasunori, un gouverneur réputé pour sa bonne administration, comme gouverneur par intérim du Dewa, avec l’homme de guerre Ono no Harukaze comme commandant de la frontière. Yasunori maintint ses troupes sur la défensive, ouvrit les greniers de l’État et offrit des pardons ; à partir du huitième mois, les groupes rebelles vinrent se rendre, et au troisième mois de 879 la cour mit fin à la campagne. Ce règlement montra que la cour ne pouvait plus imposer son autorité dans le nord par la force. Le château d’Akita fut reconstruit sous un commandant aux pouvoirs renforcés, l’Akita-jō no suke.
