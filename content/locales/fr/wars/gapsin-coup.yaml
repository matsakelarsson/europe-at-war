# French translations of the catalogue text (wave 10); step bodies follow later.
Gapsin coup: Coup d’État de Gapsin
? A failed coup in Hanseong by the young reformers of the Enlightenment Party (Gaehwadang), named after the year 1884, gapsin in the sixty-year cycle. Kim Ok-gyun, Pak Yeong-hyo, Hong Yeong-sik, Seo Gwang-beom and Seo Jae-pil wanted to end Korea’s dependence on China and reform the state on the model of Meiji Japan, and were losing ground to the pro-Chinese faction around Queen Min. When half of the Chinese garrison left for the war with France, they planned a coup with the promised help of the Japanese minister Takezoe Shin’ichirō. On the evening of 4 December 1884, at a banquet for the opening of the new post office, which Hong Yeong-sik headed, their men set a fire as a signal and wounded the queen’s nephew Min Yeong-ik. The plotters took King Gojong to the Gyeongugung palace, guarded by about 140 Japanese legation troops, and killed six conservative ministers. On 5 December they announced a new government and a programme of reform, including the end of tribute to China, equal rights for all and the abolition of the yangban’s privileges. On 6 December some 1,500 Chinese troops under Yuan Shikai attacked the palace, by then Changdeokgung, together with Korean soldiers; the Japanese troops withdrew, Hong Yeong-sik was killed, and crowds burned the Japanese legation and killed some forty Japanese. Kim Ok-gyun, Pak Yeong-hyo and the others escaped to Japan, and their relatives were executed. Japan obtained an apology and compensation in the Treaty of Hanseong of 9 January 1885, and in the Convention of Tianjin of 18 April 1885 Japan and China agreed to withdraw their troops from Korea and to notify each other before sending them again.
: Un coup d’État manqué, mené à Hanseong par les jeunes réformateurs du parti des Lumières (Gaehwadang), qui doit son nom à l’année 1884, gapsin dans le cycle sexagésimal. Kim Ok-gyun, Pak Yeong-hyo, Hong Yeong-sik, Seo Gwang-beom et Seo Jae-pil voulaient mettre fin à la dépendance de la Corée envers la Chine et réformer l’État sur le modèle du Japon de Meiji, et perdaient du terrain face à la faction prochinoise réunie autour de la reine Min. Lorsque la moitié de la garnison chinoise partit pour la guerre contre la France, ils préparèrent un coup d’État avec l’aide promise du ministre japonais Takezoe Shin’ichirō. Le soir du 4 décembre 1884, lors d’un banquet donné pour l’inauguration du nouveau bureau de poste, que dirigeait Hong Yeong-sik, leurs hommes allumèrent un incendie en guise de signal et blessèrent le neveu de la reine, Min Yeong-ik. Les conjurés conduisirent le roi Gojong au palais de Gyeongugung, gardé par environ 140 soldats de la légation japonaise, et tuèrent six ministres conservateurs. Le 5 décembre, ils annoncèrent un nouveau gouvernement et un programme de réformes, dont la fin du tribut à la Chine, l’égalité des droits pour tous et l’abolition des privilèges des yangban. Le 6 décembre, quelque 1 500 soldats chinois commandés par Yuan Shikai attaquèrent le palais, qui était alors le Changdeokgung, avec des soldats coréens ; les troupes japonaises se retirèrent, Hong Yeong-sik fut tué, et la foule incendia la légation japonaise et tua une quarantaine de Japonais. Kim Ok-gyun, Pak Yeong-hyo et les autres s’enfuirent au Japon, et leurs proches furent exécutés. Le Japon obtint des excuses et une indemnité par le traité de Hanseong du 9 janvier 1885 et, par la convention de Tianjin du 18 avril 1885, le Japon et la Chine convinrent de retirer leurs troupes de Corée et de s’avertir mutuellement avant d’en envoyer de nouveau.
