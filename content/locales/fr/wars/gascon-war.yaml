# Some French text was translated automatically.
"Gascon War": "Guerre de Gascogne"
"A war between Philip IV of France and Edward I of England over the Duchy of Aquitaine, which Edward held as Philip’s vassal. After years of clashes between Norman and Gascon and English sailors, Philip summoned Edward to his court; Edward’s brother Edmund agreed in secret to a token French occupation of the duchy’s strongholds, but the Parlement of Paris declared the fief forfeit on 19 May 1294, and French armies under Charles of Valois and Robert of Artois took most of Gascony, including Bordeaux. English expeditions held only Bayonne and a few other places, and Edward’s alliance with Count Guy of Flanders and German princes achieved little; the Flemings were beaten at Furnes in August 1297 and a truce followed that October. By the Treaty of Montreuil of 1299 Edward married Philip’s sister Margaret, and after the French defeat by the Flemings at Courtrai in 1302 the Treaty of Paris of 20 May 1303 gave Gascony back to Edward.": "Une guerre entre Philippe IV de France et Édouard I d’Angleterre sur le duché d’Aquitaine, qu’Edward tenait comme Philippe Vassal. Après des années d’affrontements entre Norman et Gascon et des marins anglais, Philippe convoqua Edward à sa cour ; le frère d’Edward Edmund accepta en secret une occupation française symbolique des bastions duchés, mais le Parlement de Paris déclara le fief confisqué le 19 mai 1294, et les armées françaises sous Charles de Valois et Robert d’Artois prirent la majeure partie de Gascogne, y compris Bordeaux. Les expéditions anglaises ne détenaient que Bayonne et quelques autres endroits, et l’alliance d’Edward avec le comte Guy de Flandre et les princes allemands n’atteint pas grand-chose ; les Flemings furent battus à Furnes en août 1297 et une trêve suivit en octobre. Par le traité de Montreuil de 1299, Edward épousa Margaret, sœur de Philips, et après la défaite française par les Flemings à Courtrai en 1302, le traité de Paris du 20 mai 1303, remit Gascony à Edward."
"The war was linked to Philip’s alliance with Scotland of 1295, which began the Scottish wars of independence, and to the Franco-Flemish War.": "La guerre est liée à l’alliance de Philippes avec l’Écosse de 1295, qui a commencé les guerres écossaises d’indépendance, et à la guerre franco-flemande."
