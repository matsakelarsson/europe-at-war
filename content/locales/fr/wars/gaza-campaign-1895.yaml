# French translations of the catalogue text (wave 13); step bodies follow later.
Portuguese campaign against Gaza: Campagne portugaise contre le royaume de Gaza
? The Portuguese conquest of the Gaza kingdom of Ngungunhane (Gungunhana) in southern Mozambique in 1895. The kingdom, founded in the 1820s by Nguni from Zululand under Soshangane, ruled Tsonga, Chopi and Ndau subjects between the Incomati and the Save; Ngungunhane had played Portugal against Cecil Rhodes’s British South Africa Company, but the Anglo-Portuguese treaty of 1891 placed all of it in Portugal’s sphere. In 1894 Ronga chiefdoms near Lourenço Marques (Maputo), under Portuguese overlordship, rose against taxes and abuses and attacked the town. Portugal sent an expedition under the royal commissioner António Enes, which defeated the Ronga at Marracuene on 2 February 1895. When Ngungunhane sheltered their chiefs and refused Portugal’s terms, Portuguese columns, fighting in squares with machine guns and modern rifles, won at Magul (8 September) and at Coolela near his capital Mandlakazi (Manjacaze) on 7 November, and burned the capital. On 28 December Joaquim Mouzinho de Albuquerque seized Ngungunhane at Chaimite. The king died in exile in the Azores in 1906; a last rising under his general Maguiguana was crushed in 1897.
: La conquête portugaise du royaume de Gaza de Ngungunhane (Gungunhana), dans le sud du Mozambique, en 1895. Ce royaume, fondé dans les années 1820 par des Nguni venus du Zoulouland sous la conduite de Soshangane, régnait sur des sujets tsonga, chopi et ndau entre l’Incomati et la Save ; Ngungunhane avait joué le Portugal contre la British South Africa Company de Cecil Rhodes, mais le traité anglo-portugais de 1891 plaça l’ensemble du royaume dans la sphère portugaise. En 1894, des chefferies ronga voisines de Lourenço Marques (Maputo), placées sous suzeraineté portugaise, se soulevèrent contre les impôts et les abus et attaquèrent la ville. Le Portugal envoya une expédition sous les ordres du commissaire royal António Enes, qui battit les Ronga à Marracuene le 2 février 1895. Quand Ngungunhane donna asile à leurs chefs et refusa les conditions portugaises, des colonnes portugaises, combattant en carré avec des mitrailleuses et des fusils modernes, l’emportèrent à Magul (8 septembre) puis à Coolela, près de sa capitale Mandlakazi (Manjacaze), le 7 novembre, et incendièrent la capitale. Le 28 décembre, Joaquim Mouzinho de Albuquerque s’empara de Ngungunhane à Chaimite. Le roi mourut en exil aux Açores en 1906 ; un dernier soulèvement mené par son général Maguiguana fut écrasé en 1897.
