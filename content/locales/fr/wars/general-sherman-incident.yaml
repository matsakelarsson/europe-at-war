General Sherman incident: Incident du General Sherman
? The destruction of the American-owned armed merchant schooner General Sherman on the Taedong River at Pyongyang. The ship sailed from Yantai on 9 August 1866 with a cargo of cotton cloth, glass and tinware, intending to open trade with Korea despite its closed-door policy. On board were its owner W. B. Preston, an American captain and mate, the British supercargo George Hogarth, the Welsh missionary Robert Jermain Thomas as interpreter, and a Chinese and Malay crew. It entered the Taedong on 16 August and went up to Pyongyang, ignoring officials’ orders to leave. The regent Heungseon Daewongun, who took it for a French warship come to avenge the executed missionaries, told the governor of Pyongan, Bak Gyu-su, to drive it away. When the crew seized a Korean officer, Yi Hyeon-ik, whose boat had been shadowing them, crowds gathered on the banks and attacked the ship, which had run aground on a sandbank as the river fell, and its cannon killed several people on the shore. On 2 September Korean troops sent fire ships down on it; the ship burned and everyone on board, about twenty people, was killed as they reached the bank. The United States learned of their fate only gradually, and in 1871 sent a naval expedition to Korea, in part because of the incident. North Korean accounts later credited Kim Il Sung’s great-grandfather Kim Ung-u with leading the attack, for which there is no historical evidence.
: La destruction de la goélette marchande armée General Sherman, propriété américaine, sur le fleuve Taedong à Pyongyang. Le navire quitta Yantai le 9 août 1866 avec une cargaison de cotonnades, de verrerie et d’articles en fer-blanc, dans l’intention d’ouvrir le commerce avec la Corée malgré la politique de fermeture de celle-ci. À bord se trouvaient son propriétaire, W. B. Preston, un capitaine et un second américains, le subrécargue britannique George Hogarth, le missionnaire gallois Robert Jermain Thomas, qui servait d’interprète, et un équipage chinois et malais. Le navire entra dans le Taedong le 16 août et remonta jusqu’à Pyongyang, ignorant les ordres des fonctionnaires qui lui enjoignaient de repartir. Le régent Heungseon Daewongun, qui le prit pour un navire de guerre français venu venger les missionnaires exécutés, ordonna au gouverneur du Pyongan, Bak Gyu-su, de le chasser. Lorsque l’équipage s’empara d’un officier coréen, Yi Hyeon-ik, dont la barque le suivait de près, la foule se rassembla sur les rives et attaqua le navire, qui s’était échoué sur un banc de sable à la baisse des eaux, et ses canons tuèrent plusieurs personnes sur la rive. Le 2 septembre, les troupes coréennes lancèrent contre lui des brûlots ; le navire brûla et tous ceux qui se trouvaient à bord, une vingtaine de personnes, furent tués en atteignant la rive. Les États-Unis n’apprirent que peu à peu leur sort et, en 1871, envoyèrent une expédition navale en Corée, en partie à cause de l’incident. Les récits nord-coréens attribuèrent plus tard la direction de l’attaque à Kim Ung-u, arrière-grand-père de Kim Il Sung, ce qu’aucune preuve historique n’étaye.
