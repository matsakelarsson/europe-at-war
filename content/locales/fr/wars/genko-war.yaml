# French translations of the catalogue text (wave 10); step bodies follow later.
Genkō War: Guerre de Genkō
? The war in which Emperor Go-Daigo and the warriors who rallied to him overthrew the Kamakura shogunate and the Hōjō family that had ruled it as regents for more than a century. Go-Daigo, determined to rule in person rather than through retired emperors or the shogunate, was betrayed by an adviser in 1331, fled to the mountain temple of Kasagi and was captured; Kamakura enthroned his rival Kōgon and exiled him to the Oki Islands in 1332. His son Prince Morinaga and Kusunoki Masashige, a warrior of Kawachi, kept up the fight, and Masashige’s defence of Chihaya against a huge besieging army in 1333 encouraged risings across the country. Go-Daigo escaped from Oki and raised his banner at Mount Senjō in Hōki. The shogunate sent Ashikaga Takauji, head of a great Minamoto branch family, against him, but Takauji changed sides and took Rokuhara, the shogunate’s headquarters in Kyoto, on 19 June 1333. Days later Nitta Yoshisada rose in Kōzuke, defeated the Hōjō armies on the plains of Musashi and broke into Kamakura, where the regent Hōjō Takatoki and some 800 of his family and followers killed themselves on 4 July 1333. The shogunate’s headquarters in Kyushu fell three days later, and Go-Daigo returned to Kyoto to begin the Kenmu Restoration.
: La guerre au cours de laquelle l’empereur Go-Daigo et les guerriers qui se rallièrent à lui renversèrent le shogunat de Kamakura et la famille Hōjō, qui le dirigeait en qualité de régents depuis plus d’un siècle. Go-Daigo, résolu à gouverner en personne plutôt que par l’intermédiaire des empereurs retirés ou du shogunat, fut trahi par un conseiller en 1331, s’enfuit au temple de montagne de Kasagi et fut capturé ; Kamakura intronisa son rival Kōgon et l’exila dans les îles Oki en 1332. Son fils, le prince Morinaga, et Kusunoki Masashige, un guerrier du Kawachi, poursuivirent la lutte, et la défense de Chihaya par Masashige contre une immense armée assiégeante, en 1333, encouragea des soulèvements dans tout le pays. Go-Daigo s’échappa d’Oki et leva son étendard au mont Senjō, dans le Hōki. Le shogunat envoya contre lui Ashikaga Takauji, chef d’une grande branche cadette des Minamoto, mais Takauji changea de camp et prit Rokuhara, le quartier général du shogunat à Kyoto, le 19 juin 1333. Quelques jours plus tard, Nitta Yoshisada se souleva dans le Kōzuke, battit les armées des Hōjō dans les plaines du Musashi et força l’entrée de Kamakura, où le régent Hōjō Takatoki et quelque 800 membres de sa famille et de ses partisans se donnèrent la mort le 4 juillet 1333. Le quartier général du shogunat au Kyushu tomba trois jours plus tard, et Go-Daigo regagna Kyoto pour entreprendre la restauration de Kenmu.
