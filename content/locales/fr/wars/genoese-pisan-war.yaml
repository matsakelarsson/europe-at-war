# Some French text was translated automatically.
"Genoese–Pisan War, 1282–1290": "Guerre entre Gênes et Pise, 1282–1290"
? "A war between the maritime republics of Genoa and Pisa for Corsica, Sardinia and the trade of the Tyrrhenian Sea, which began in 1282 when Pisa backed a Corsican lord’s revolt against Genoa. On 6 August 1284, off the islet of Meloria near Livorno, the Genoese fleet under Oberto Doria, with a second squadron under Benedetto Zaccaria, destroyed the Pisan fleet led by the podestà Albertino Morosini and Count Ugolino della Gherardesca; some 5,000 Pisans were killed and about 9,000 taken to Genoa, where many died in captivity. Florence, Lucca and other Guelph cities then joined the war against Pisa. Ugolino, who ruled Pisa after the battle, gave castles to Florence and Lucca to break up the alliance; overthrown in 1288, he was starved to death in a tower with his sons and grandsons, a story made famous by Dante. By 1290 Genoese raids had wrecked Porto Pisano, the city’s harbour, and Pisa never recovered its power at sea."
: "Une guerre entre les républiques maritimes de Gênes et Pise pour la Corse, Sardaigne et le commerce de la mer Tyrrhénienne, qui a commencé en 1282 quand Pise a soutenu une révolte du seigneur corse contre Gênes. Le 6 août 1284, au large de l’îlot de Meloria près de Livourne, la flotte génoise sous Oberto Doria, avec un deuxième escadron sous Benedetto Zaccaria, a détruit la flotte Pisan conduite par le podestà Albertino Morosini et le comte Ugolino della Gherardesca ; environ 5000 Pisanes ont été tués et environ 9 000 emmenés à Gênes, où beaucoup sont morts en captivité. Florence, Lucques et d’autres villes de Guelph se joignirent alors à la guerre contre Pise. Ugolino, qui gouverna Pise après la bataille, donna des châteaux à Florence et Lucques pour rompre l’alliance ; renversé en 1288, il fut affamé dans une tour avec ses fils et petits-fils, une histoire rendue célèbre par Dante. En 1290, des raids génois avaient détruit Porto Pisano, le port de la ville, et Pise n’avait jamais récupéré son pouvoir en mer."
"Many prisoners stayed in Genoa for years. One of them, Rustichello da Pisa, later wrote down Marco Polo’s account of his travels while both were prisoners there.": "Beaucoup de prisonniers sont restés à Gênes pendant des années. L’un d’eux, Rustichello da Pise, a écrit plus tard Marco Polos récit de ses voyages alors que les deux étaient prisonniers là-bas."
"Numbers of ships and of the dead and captured at Meloria come from the chroniclers and differ between sources.": "Le nombre de navires et celui des morts capturés à Meloria proviennent des chroniqueurs et diffèrent selon les sources."
