# French translations of the catalogue text (wave 10); step bodies follow later.
Genpei War: Guerre de Genpei
? "The civil war between the Taira and the Minamoto, the two great warrior houses of late Heian Japan, which ended the Taira’s hold on the court and led to the first warrior government in Kamakura. Taira no Kiyomori had dominated the court since the Heiji rebellion, and in 1179–1180 he put the retired emperor Go-Shirakawa under arrest and placed his own infant grandson Antoku on the throne. Prince Mochihito’s call to arms against him failed at Uji in June 1180, but it set off risings across the east: Minamoto no Yoritomo, after a defeat at Ishibashiyama, made himself master of the Kantō from Kamakura, and his cousin Minamoto no Yoshinaka rose in Shinano. After two years of famine, Yoshinaka destroyed the main Taira army at Kurikara in 1183 and drove the Taira, with the boy emperor and the imperial regalia, out of the capital. Yoshinaka then fell out with Go-Shirakawa and Yoritomo and was killed by Yoritomo’s brothers Yoshitsune and Noriyori early in 1184. Yoshitsune defeated the Taira at Ichi-no-Tani in 1184 and Yashima in 1185 and destroyed their fleet at Dan-no-ura on 25 April 1185, where Antoku drowned. Yoritomo was given the right to appoint military governors and stewards across the country at the end of 1185, and in 1192 he became shōgun."
: "La guerre civile entre les Taira et les Minamoto, les deux grandes maisons guerrières de la fin de l’époque de Heian, qui mit fin à l’emprise des Taira sur la cour et conduisit au premier gouvernement guerrier, à Kamakura. Taira no Kiyomori dominait la cour depuis la rébellion de Heiji et, en 1179–1180, il fit arrêter l’empereur retiré Go-Shirakawa et plaça sur le trône son propre petit-fils en bas âge, Antoku. L’appel aux armes lancé contre lui par le prince Mochihito échoua à Uji en juin 1180, mais il déclencha des soulèvements dans tout l’est : Minamoto no Yoritomo, après une défaite à Ishibashiyama, se rendit maître du Kantō depuis Kamakura, et son cousin Minamoto no Yoshinaka se souleva dans le Shinano. Après deux années de famine, Yoshinaka anéantit la principale armée des Taira à Kurikara en 1183 et chassa de la capitale les Taira, avec l’enfant empereur et les regalia impériaux. Yoshinaka se brouilla ensuite avec Go-Shirakawa et Yoritomo et fut tué par les frères de Yoritomo, Yoshitsune et Noriyori, au début de 1184. Yoshitsune battit les Taira à Ichi-no-Tani en 1184 et à Yashima en 1185, et anéantit leur flotte à Dan-no-ura le 25 avril 1185 ; Antoku s’y noya. À la fin de 1185, Yoritomo reçut le droit de nommer des gouverneurs militaires et des intendants dans tout le pays et, en 1192, il devint shōgun."
