"Summer 1524 – April 1525": "Été 1524 – avril 1525"
"In the summer of 1524 peasants in the landgraviate of Stühlingen, on the southern edge of the Black Forest, refused the services their lord demanded, and over the winter unrest spread through the Black Forest and the Hegau. Behind it lay rising dues, a tightening of serfdom and lords’ claims on common woods and pastures, sharpened by Reformation preaching that measured every authority against Scripture. In February 1525 Upper Swabia rose, and on 7 March the Baltringen, Lake Constance and Allgäu bands, tens of thousands strong, formed a Christian Association at Memmingen.": "Au cours de l’été 1524, les paysans du pays de Stühlingen, à la limite sud de la Forêt-Noire, refusèrent les services demandés par leur seigneur, et pendant l’hiver, les troubles se répandirent dans la Forêt-Noire et dans l’Hegau. Derrière elle s’étendaient des droits croissants, un resserrement du servage et des lords, revendiquant les bois communs et les pâturages, aiguisés par la prédication de la Réforme qui mesurait toute autorité contre l’Écriture. En février 1525, la Haute-Swabie s’élève et le 7 mars, les groupes Baltringen, Lake Constance et Allgäu, des dizaines de milliers de personnes fortes, forment une association chrétienne à Memmingen."
"There they adopted the Twelve Articles, which demanded that each community choose its own pastor, that serfdom end, and that woods, water and game be free to all. Printed some 25,000 times in two months, they became the programme of the rising. The Swabian League’s army under Georg Truchsess von Waldburg routed the Leipheim band on 4 April, and on 17 April he made peace with the Lake Constance and Allgäu bands at Weingarten. The day before, the Neckar valley band had taken Weinsberg and made the Count of Helfenstein and his companions run a gauntlet of pikes to their deaths.": "Ils y adoptèrent les douze articles, qui exigeaient que chaque communauté choisisse son propre pasteur, cette fin de serfdom, et que les bois, l’eau et le jeu soient libres pour tous. Imprimés environ 25 000 fois en deux mois, ils devinrent le programme de la montée. L’armée de la Ligue souabe sous Georg Truchsess von Waldburg a fait route vers le groupe Leipheim le 4 avril, et le 17 avril il a fait la paix avec les groupes du lac de Constance et Allgäu à Weingarten. La veille, le groupe de vallée de Neckar avait pris Weinsberg et fait le comte d’Helfenstein et ses compagnons courent un gant de picots à leur mort."
