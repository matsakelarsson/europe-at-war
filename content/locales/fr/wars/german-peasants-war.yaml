"May – June 1525": "mai – juin 1525"
"By late April the rising had spread to Franconia, Alsace and Thuringia. At Mühlhausen the radical preacher Thomas Müntzer, who had broken with Luther, called for a holy war against the godless. On 15 May the armies of Landgrave Philip of Hesse, Duke George of Saxony and Duke Henry of Brunswick-Wolfenbüttel attacked some 6,000 rebels in their wagon fort above Frankenhausen during a truce. Thousands were killed while the princes lost only a handful of men. Müntzer was captured, tortured and beheaded outside Mühlhausen on 27 May.": "Fin avril, la montée s’était étendue à Franconie, en Alsace et en Thuringe. À Mühlhausen, le prédicateur radical Thomas Müntzer, qui avait rompu avec Luther, appelait à une guerre sainte contre les impies. Le 15 mai, les armées de Landgrave Philippe de Hesse, duc George de Saxe et du duc Henry de Brunswick-Wolfenbüttel attaquèrent quelque 6 000 rebelles dans leur fort de chariot au-dessus de Frankenhausen pendant une trêve. Des milliers furent tués tandis que les princes perdirent seulement quelques hommes. Müntzer fut capturé, torturé et décapité à l’extérieur de Mühlhausen le 27 mai."
"In the south the Truchsess destroyed the Württemberg band at Böblingen on 12 May, then marched north into Franconia, where the bands had besieged the Marienberg fortress at Würzburg in vain. He beat them at Königshofen on 2 June and near Würzburg two days later. In Alsace, Duke Antoine of Lorraine massacred thousands of peasants at Saverne after they had surrendered. By midsummer only the Alpine risings were left, and victorious lords punished their subjects with executions, fines and the burning of villages.": "Au sud, les Truchses détruisirent le groupe Württemberg à Böblingen le 12 mai, puis marchèrent vers le nord en Franconie, où les groupes avaient assiégé la forteresse Marienberg à Würzburg en vain. Il les battit à Königshofen le 2 juin et près de Würzburg deux jours plus tard. En Alsace, le duc Antoine de Lorraine a massacré des milliers de paysans à Saverne après qu’ils se soient rendus. Au milieu de l’été, seules les montées alpines ont été laissées, et les seigneurs vainqueurs punissent leurs sujets d’exécutions, d’amendes et d’incendies de villages."
