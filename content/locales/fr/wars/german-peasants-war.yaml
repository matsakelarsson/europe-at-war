"May 1525 – July 1526": "mai 1525 – juillet 1526"
"In May 1525 the rising reached the Alps. In Tyrol peasants and miners sacked the bishop’s palace at Brixen and the abbey of Neustift, and chose as their leader Michael Gaismair, the bishop’s former secretary. Archduke Ferdinand calmed the county by calling a diet at Innsbruck and making concessions. In Salzburg, miners from Hallein and peasants from the mountain valleys entered the city at the end of May and besieged Archbishop Matthäus Lang in the Hohensalzburg fortress. On 3 July they beat a Styrian army at Schladming, the only large battle won by rebels in the war.": "En mai 1525, la montée atteignit les Alpes. Au Tyrol, les paysans et les mineurs saccagent le palais de l’évêque à Brixen et l’abbaye de Neustift, et choisissent comme chef Michael Gaismair, ancien secrétaire de l’évêque. L’archiduc Ferdinand apaisait le comté en appelant un régime à Innsbruck et en faisant des concessions. À Salzbourg, des mineurs d’Hallein et des paysans des vallées de montagne sont entrés dans la ville à la fin du mois de mai et ont assiégé Mgr Matthäus Lang dans la forteresse de Hohensalzburg. Le 3 juillet ils ont battu une armée Styrienne à Schladming, la seule grande bataille remportée par les rebelles pendant la guerre."
"A Swabian League army faced the Salzburg rebels in August, but instead of a battle there was a truce on 31 August. In the spring of 1526 the Pinzgau rose again, and Gaismair, who had escaped to Switzerland and drafted a constitution for a Tyrolean peasant republic without nobles or church lords, came to lead it. The rebels failed to take Radstadt, which the League relieved, and in July Gaismair led the last 2,000 fighters over the Tauern into Venetian territory. Ferdinand put a price on his head, and he was murdered in Padua in 1532.": "Une armée de la Ligue souabe affronta les rebelles de Salzbourg en août, mais au lieu d’une bataille il y eut une trêve le 31 août. Au printemps de 1526, le Pinzgau se leva à nouveau, et Gaismair, qui s’était échappé en Suisse et avait rédigé une constitution pour une république paysanne tyrolienne sans nobles ni seigneurs d’église, vint la diriger. Les rebelles n’ont pas pris Radstadt, que la Ligue soulagée, et en juillet Gaismair a conduit les 2000 derniers combattants sur le Tauern dans le territoire vénitien. Ferdinand mis un prix sur sa tête, et il a été assassiné à Padoue en 1532."
