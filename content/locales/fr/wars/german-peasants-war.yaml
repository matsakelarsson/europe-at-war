# Some French text was translated automatically.
"German Peasants’ War": "Guerre des paysans allemands"
"The largest popular rising in Europe before the French Revolution, in which peasants, miners and townspeople across southern and central Germany and the Austrian Alps rose against their lords in 1524–1525, many of them inspired by the Reformation and the Twelve Articles. The armies of the Swabian League and the princes crushed the bands one after another, and by common estimates about 100,000 people were killed.": "La plus grande montée populaire en Europe avant la Révolution française, dans laquelle paysans, mineurs et citadins à travers l’Allemagne méridionale et centrale et les Alpes autrichiennes se sont levés contre leurs seigneurs en 1524-1525, beaucoup d’entre eux inspirés par la Réforme et les Douze Articles. Les armées de la Ligue souabe et les princes ont écrasé les bandes les uns après les autres, et selon des estimations communes environ 100 000 personnes ont été tuées."
"The rebel armies were known as Haufen, “bands”, named after their home districts. Numbers of rebels and of dead are uncertain; about 100,000 dead is the figure most often given.": "Les armées rebelles étaient connues sous le nom de Haufen, les bandes, nommé d’après leurs districts d’origine. Le nombre de rebelles et de morts sont incertains ; environ 100 000 morts est le chiffre le plus souvent donné."
"Württemberg was ruled by the Habsburgs from 1520 to 1534, after the Swabian League had driven out Duke Ulrich, and Archduke Ferdinand governed it at the time of the war.": "Wurtemberg fut gouverné par les Habsbourg de 1520 à 1534, après que la Ligue souabe eut chassé le duc Ulrich, et l’archiduc Ferdinand l’avait gouverné au moment de la guerre."
