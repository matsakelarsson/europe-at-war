"1002–1005": "1002–1005"
"Bolesław had been a friend and ally of Emperor Otto III, who visited him at Gniezno in 1000. When Otto died without an heir in January 1002 and Margrave Eckard of Meissen, a claimant to the throne, was murdered that April, Bolesław moved into the eastern marches. He occupied Lusatia and Milsko, the land around Bautzen, and took Meissen. At Merseburg in July the new king, Henry II, let him keep Lusatia and Milsko as fiefs but not Meissen. As Bolesław left, armed men attacked him; he blamed Henry.": "Bolesław avait été un ami et allié de l’empereur Otto III, qui lui a rendu visite à Gniezno en 1000. Lorsque Otto est mort sans héritier en janvier 1002 et Margrave Eckard de Meissen, un demandeur du trône, a été assassiné qu’avril, Bolesław s’est installé dans les marches orientales. Il a occupé Lusatia et Milsko, le pays autour de Bautzen, et a pris Meissen. En juillet, à Merseburg, le nouveau roi, Henri II, le laisse garder Lusatia et Milsko comme fiefs mais pas Meissen. Comme Bolesław partait, des hommes armés l’attaquaient ; il blâmait Henry."
"Early in 1003 Bolesław intervened in Bohemia, had its duke, Boleslaus III, blinded and ruled the country himself, refusing to do homage to Henry for it. Henry made an alliance with the pagan Lutici, which shocked many Saxon churchmen, and in 1004 drove the Poles out of Bohemia, installed Duke Jaromír and took Bautzen. In 1005 he crossed the Oder and marched to Poznań. Bolesław avoided battle and harried the invaders, but in the peace that followed he gave up Lusatia and Milsko, though he kept Moravia.": "Au début de 1003, Bolesław est intervenu en Bohême, a eu son duc, Boleslaus III, aveuglé et dirigé le pays lui-même, refusant de rendre hommage à Henry pour elle. Henri a fait une alliance avec le païen Lutici, qui a choqué beaucoup d’ecclésiastiques saxons, et en 1004 a chassé les Polonais de Bohême, installé duc Jaromír et pris Bautzen. En 1005, il traversa l’Oder et marcha à Poznań. Bolesław évita la bataille et harcela les envahisseurs, mais dans la paix qui suivit, il abandonna Lusatia et Milsko, bien qu’il gardât la Moravie."
