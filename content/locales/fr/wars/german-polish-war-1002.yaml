"German–Polish War, 1002–1018": "Guerre germano-polonaise, 1002–1018"
"A series of wars between Bolesław I the Brave of Poland and the German king Henry II over Lusatia, Meissen and Bohemia. Bolesław briefly ruled Bohemia and lost Lusatia in 1005, but held off three German invasions and kept Lusatia and Milsko under the Peace of Bautzen in 1018.": "Une série de guerres entre Bolesław I le Brave de Pologne et le roi allemand Henri II sur Lusatia, Meissen et Bohemia. Bolesław a brièvement gouverné la Bohême et a perdu Lusatia en 1005, mais a retenu trois invasions allemandes et a gardé Lusatia et Milsko sous la paix de Bautzen en 1018."
"Most of what is known comes from the chronicle of Thietmar, bishop of Merseburg, a contemporary who was hostile to Bolesław. Dates and details are often uncertain.": "La plupart de ce qui est connu vient de la chronique de Thietmar, évêque de Merseburg, un contemporain hostile à Bolesław. Les dates et les détails sont souvent incertains."
"Milsko (Milzenerland) was the land around Bautzen, later called Upper Lusatia; Lusatia proper was later Lower Lusatia.": "Milsko (Milzenerland) était la terre autour de Bautzen, plus tard appelé Upper Lusatia ; Lusatia propre était plus tard Lower Lusatia."
