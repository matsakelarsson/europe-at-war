"1007–1018": "1007–1018"
"War broke out again in 1007. Bolesław retook Lusatia and Milsko and raided as far as the neighbourhood of Magdeburg, and German campaigns in 1010 and 1012 achieved little. At Merseburg in 1013 he did homage to Henry and kept the two lands as fiefs. But he did not help Henry in Italy as promised, and in 1015 the king, again with the Lutici, invaded once more. He got no further than Krosno on the Oder, and in the fighting Margrave Gero and some 200 knights were killed.": "La guerre éclata de nouveau en 1007. Bolesław reprit Lusatia et Milsko et fit des raids jusqu’au quartier de Magdeburg, et les campagnes allemandes en 1010 et 1012 atteignirent peu. À Merseburg en 1013 il rendit hommage à Henry et garda les deux terres comme fiefs. Mais il n’a pas aidé Henri en Italie comme promis, et en 1015 le roi, à nouveau avec les Lutici, a envahi une fois de plus. Il n’a obtenu pas plus loin que Krosno sur l’Oder, et dans la bataille Margrave Gero et quelque 200 chevaliers ont été tués."
"In 1017 Henry marched to Głogów, found it too strong to besiege and turned on Niemcza instead. Its defenders held out, and with sickness in his army he withdrew through Bohemia. Peace was made at Bautzen on 30 January 1018. Bolesław kept Lusatia and Milsko, whether as imperial fiefs or outright is still debated, and married Oda, a daughter of Eckard of Meissen. That summer, with German and Hungarian help, he marched on Kiev, entered it on 14 August and restored his son-in-law Sviatopolk to its throne.": "En 1017, Henry marcha vers Głogów, le trouva trop fort pour assiéger et se retourna contre Niemcza. Ses défenseurs s’arrêtèrent, et avec la maladie dans son armée il se retira par Bohême. La paix fut faite à Bautzen le 30 janvier 1018. Bolesław a gardé Lusatia et Milsko, que ce soit comme fiefs impériaux ou carrément est toujours débattu, et a épousé Oda, une fille d’Eckard de Meissen. Cet été-là, avec l’aide allemande et hongroise, il a marché sur Kiev, est entré sur elle le 14 août et a restauré son gendre Sviatopolk à son trône."
