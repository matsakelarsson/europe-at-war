"29 October – 11 November 1918": "29 octobre – 11 novembre 1918"
"By October 1918 Germany’s generals knew the war was lost, and Prince Max of Baden’s new government had asked President Wilson for an armistice. The naval command nonetheless planned a last sortie against the British fleet. In the Schillig Roads off Wilhelmshaven crews on several battleships refused orders, and the operation was called off. One squadron was sent back to Kiel, where sailors demanded the release of comrades arrested for the mutiny. On 3 November a patrol fired on their demonstration, killing seven men. The next day sailors and workers took control of the port and elected councils.": "En octobre 1918, les généraux d’Allemagne savaient que la guerre était perdue, et le nouveau gouvernement du prince Max de Baden avait demandé au président Wilson un armistice. Le commandement naval prévoyait néanmoins une dernière sortie contre la flotte britannique. Un escadron a été renvoyé à Kiel, où des marins ont exigé la libération de camarades arrêtés pour la mutinerie. Le 3 novembre une patrouille a tiré sur leur manifestation, tuant sept hommes. Le lendemain, des marins et des ouvriers ont pris le contrôle du port et des conseils élus."
"Sailors spread the revolt by rail, and by 7 November workers’ and soldiers’ councils held Hamburg, Bremen, Lübeck, Cologne and many other cities. In Munich, on the night of 7–8 November, the Independent Socialist Kurt Eisner proclaimed a Bavarian republic, and the king fled. On 9 November, with Berlin on general strike, Prince Max announced the Kaiser’s abdication on his own authority and handed over to the Social Democrat Friedrich Ebert. Philipp Scheidemann proclaimed a republic from the Reichstag, and Karl Liebknecht a socialist republic at the palace. William II left for the Netherlands the next day; the armistice followed on 11 November.": "Les marins répandirent la révolte par chemin de fer, et le 7 novembre les conseils ouvriers et militaires occupèrent Hambourg, Brême, Lübeck, Cologne et beaucoup d’autres villes. À Munich, dans la nuit du 7 au 8 novembre, le Kurt socialiste indépendant Eisner proclama une république bavaroise, et le roi s’enfuit. Le 9 novembre, avec Berlin en grève générale, le prince Max annonça l’abdication des Kaisers sous sa propre autorité et fut remis au social-démocrate Friedrich Ebert. Philipp Scheidemann proclama une république du Reichstag, et Karl Liebknecht une république socialiste au palais. William II partit pour les Pays-Bas le lendemain ; l’armistice suivit le 11 novembre."
