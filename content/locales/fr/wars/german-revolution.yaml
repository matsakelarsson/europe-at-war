"December 1918 – August 1919": "décembre 1918 – août 1919"
"Ebert’s Council of People’s Deputies, formed with the Independent Socialists (USPD) on 10 November, wanted elections to a National Assembly, and Ebert secretly agreed with General Wilhelm Groener that the army would back the government. After troops attacked revolutionary sailors in Berlin at Christmas, the USPD left the government and the Spartacists founded the Communist Party. On 5 January 1919, after Berlin’s left-wing police chief was dismissed, armed workers occupied newspaper offices, among them the SPD’s Vorwärts. Gustav Noske, the minister responsible for the army, sent in troops and Freikorps volunteers, who crushed this “Spartacist uprising” by 12 January; some 150–200 people were killed.": "Le 10 novembre, le Conseil des députés du peuple Ebert, formé avec les socialistes indépendants (USPD), voulait des élections à l’Assemblée nationale, et Ebert accepta secrètement avec le général Wilhelm Groener que l’armée soutiendrait le gouvernement. Après que les troupes attaquèrent les marins révolutionnaires à Berlin à Noël, l’USPD quitta le gouvernement et les spartacistes fondèrent le Parti communiste. Le 5 janvier 1919, après le licenciement du chef de la police de gauche de Berlin, des ouvriers armés occupaient des bureaux de presse, dont les SPD. Gustav Noske, ministre responsable de l’armée, envoyait des troupes et des volontaires de Freikorps, qui écrasèrent ce soulèvement spartaciste au 12 janvier ; quelque 150 à 200 personnes furent tuées."
"On 15 January Freikorps officers murdered Rosa Luxemburg and Karl Liebknecht. Elections on 19 January, the first in which German women voted, gave the SPD and its Catholic and liberal allies a large majority, and the National Assembly met at Weimar. In Munich Eisner was shot dead by a nationalist on 21 February. On 6–7 April anarchists and Independent Socialists proclaimed a Bavarian Soviet Republic, which the communists took over a week later. Army and Freikorps troops took Munich on 1–3 May, after its Red Guards had shot ten hostages; at least 606 people were killed, 335 of them civilians. The Weimar Constitution was signed on 11 August 1919.": "Le 15 janvier, des officiers de Freikarps ont assassiné Rosa Luxemburg et Karl Liebknecht. Les élections du 19 janvier, la première au cours de laquelle les femmes allemandes ont voté, ont donné une large majorité au SPD et à ses alliés catholiques et libéraux, et l’Assemblée nationale s’est réunie à Weimar. Les 6 et 7 avril, les anarchistes et les socialistes indépendants proclamèrent une République soviétique bavaroise que les communistes reprirent une semaine plus tard. L’armée et les troupes de Freikorps prirent Munich le 1er-3 mai, après que ses gardes rouges eurent abattu dix otages ; au moins 606 personnes furent tuées, dont 335 civils. La Constitution de Weimar fut signée le 11 août 1919."
