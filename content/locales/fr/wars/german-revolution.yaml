# Some French text was translated automatically.
"German Revolution of 1918–1919": "Révolution allemande de 1918-1919"
"The revolution that ended the German Empire in the last days of the First World War. A naval mutiny at Kiel spread across Germany, the Kaiser and the other German princes abdicated, and a Social Democrat-led government took power; it then used the army and Freikorps volunteers to crush the radical left in Berlin and the Bavarian Soviet Republic, and the Weimar Constitution of August 1919 founded a parliamentary republic.": "La révolution qui a mis fin à l’Empire allemand dans les derniers jours de la Première Guerre mondiale. Une mutinerie navale à Kiel s’est répandue en Allemagne, le Kaiser et les autres princes allemands abdiqués, et un gouvernement dirigé par le social-démocrate a pris le pouvoir ; il a ensuite utilisé l’armée et les volontaires de Freikorps pour écraser la gauche radicale de Berlin et de la République soviétique bavaroise, et la Constitution de Weimar d’août 1919 a fondé une république parlementaire."
"The sides changed as the revolution went on. The Social Democrats who led the new government in November 1918 came to power on the back of the revolution, but from December they relied on the old army and on Freikorps volunteers against the radical left.": "Les partis ont changé au fil de la révolution. Les sociaux-démocrates qui ont dirigé le nouveau gouvernement en novembre 1918 sont arrivés au pouvoir sur le dos de la révolution, mais à partir de décembre ils comptaient sur l’ancienne armée et sur les volontaires de Freikorps contre la gauche radicale."
"The First World War, which ended with the armistice of 11 November 1918, is told separately.": "La Première Guerre mondiale, qui a pris fin avec l’armistice du 11 novembre 1918, est racontée séparément."
