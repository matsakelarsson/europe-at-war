"June – December 1848": "juin – décembre 1848"
"The old powers recovered first in the Austrian Empire. In June an uprising in Prague was crushed by Prince Alfred Windischgrätz, who bombarded the city. On 6 October, as troops were leaving Vienna to fight the revolution in Hungary, workers, students and mutinous soldiers tried to stop them. The war minister, Count Latour, was lynched, and the emperor fled to Olmütz. Windischgrätz and Josip Jelačić, the Ban of Croatia, surrounded Vienna with more than 70,000 troops, beat a Hungarian relief army at Schwechat on 30 October and stormed the city the next day. About 2,000 people were killed in the fighting.": "En juin, un soulèvement à Prague fut écrasé par le prince Alfred Windischgrätz, qui bombarda la ville. Le 6 octobre, alors que les troupes quittaient Vienne pour combattre la révolution en Hongrie, des ouvriers, des étudiants et des soldats mutins essayèrent de les arrêter. Le ministre de guerre, le comte Latour, fut lynché et l’empereur s’enfuit à Olmütz. Windischgrätz et Josip Jelačić, l’interdiction de Croatie, ont encerclé Vienne avec plus de 70 000 soldats, battu une armée de secours hongroise à Schwechat le 30 octobre et pris la ville le lendemain. Environ 2 000 personnes ont été tuées dans les combats."
"Robert Blum, a left-wing deputy who had come from Frankfurt to join the defence, was shot on 9 November despite his parliamentary immunity, and other leaders of the defence were executed. On 2 December the Emperor Ferdinand abdicated in favour of his 18-year-old nephew, Francis Joseph. In Prussia Frederick William IV moved the Prussian National Assembly out of Berlin to Brandenburg an der Havel, and on 10 November General Friedrich von Wrangel’s troops marched back into the capital unopposed. On 5 December the king dissolved the assembly and issued a constitution of his own.": "Robert Blum, député de gauche venu de Francfort pour se joindre à la défense, a été abattu le 9 novembre malgré son immunité parlementaire et d’autres dirigeants de la défense ont été exécutés. Le 2 décembre l’empereur Ferdinand abdique en faveur de son neveu de 18 ans, Francis Joseph. En Prusse Frederick William IV déplaça l’Assemblée nationale prussienne de Berlin au Brandebourg an der Havel et, le 10 novembre, les troupes du général Friedrich von Wrangel arrivèrent sans opposition dans la capitale. Le 5 décembre, le roi dissout l’assemblée et publia sa propre constitution."
