# Some French text was translated automatically.
"German revolutions of 1848–1849": "Révolutions allemandes de 1848–1849"
"A wave of risings across the German Confederation and the Austrian Empire, set off by the February Revolution in Paris, which forced the princes to grant liberal governments and brought about an elected National Assembly in Frankfurt. The old powers recovered in Vienna and Berlin in late 1848; when the King of Prussia refused the crown offered by the Assembly, the risings of May 1849 to enforce its constitution were crushed by Prussian and other troops, ending with the fall of Rastatt in July 1849.": "Une vague de montées à travers la Confédération allemande et l’Empire autrichien, déclenchée par la Révolution de février à Paris, força les princes à accorder des gouvernements libéraux et provoqua une Assemblée nationale élue à Francfort. Les anciennes puissances se rétablirent à Vienne et Berlin à la fin de 1848 ; lorsque le roi de Prusse refusa la couronne offerte par l’Assemblée, les montées de mai 1849 pour faire respecter sa constitution furent écrasées par les troupes prussiennes et autres, se terminant par la chute de Rastatt en juillet 1849."
"The revolutions were many separate risings, and this story follows only the main ones. The Hungarian Revolution of 1848–1849, the war in northern Italy of 1848–1849 and the First Schleswig War are told as separate wars.": "La révolution hongroise de 1848–1849, la guerre dans le nord de l’Italie de 1848–1849 et la Première Guerre du Schleswig sont racontées comme des guerres séparées."
"The Frankfurt National Assembly stood between the two sides. It sought a constitutional German state by agreement with the princes, had no army of its own, and relied on Prussian and Austrian troops when it was threatened from the left.": "L’Assemblée nationale de Francfort s’est tenue entre les deux parties. Elle a cherché un État allemand constitutionnel par accord avec les princes, n’avait pas d’armée propre, et comptait sur les troupes prussiennes et autrichiennes quand elle était menacée de gauche."
