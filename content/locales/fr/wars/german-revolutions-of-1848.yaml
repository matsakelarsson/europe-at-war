"The constitution refused; Dresden and Baden": "La constitution a refusé ; Dresde et Baden"
"March – July 1849": "mars – juillet 1849"
"On 28 March 1849 the National Assembly passed a constitution for a German empire without Austria and elected Frederick William IV of Prussia emperor. He refused a crown offered by a parliament, and Austria and Prussia recalled their deputies. Twenty-eight smaller governments had accepted the constitution, and in May risings to enforce it broke out in Saxony, the Prussian Rhineland and Westphalia, the Bavarian Palatinate and Baden. In Dresden, barricade fighting from 3 to 9 May, in which Richard Wagner and Mikhail Bakunin took part, was crushed by Saxon and Prussian troops; about 200 insurgents were killed.": "Le 28 mars 1849, l’Assemblée nationale adopte une constitution pour un empire allemand sans l’Autriche et élit Frederick William IV de l’empereur de Prusse. Il refuse la couronne offerte par un parlement, et l’Autriche et la Prusse rappellent leurs députés. Vingt-huit gouvernements plus petits ont accepté la constitution, et en mai des montées pour l’appliquer éclatent en Saxe, en Rhénanie prussienne et en Westphalie, en Bavière Palatinat et en Baden. À Dresde, les combats de barricade du 3 au 9 mai, auxquels participent Richard Wagner et Mikhail Bakounin, ont été écrasés par les troupes saxonnes et prussiennes ; environ 200 insurgés ont été tués."
"In Baden the army itself went over to the revolution. The garrison of the federal fortress of Rastatt mutinied, Grand Duke Leopold fled, and a provisional government under Lorenz Brentano took power, allied with the insurgents in the Palatinate. Prussian and other federal troops under Prince William of Prussia, the future emperor, beat the revolutionary army under the Polish general Ludwik Mierosławski at Waghäusel on 21 June. Württemberg troops dispersed the last of the National Assembly, which had moved to Stuttgart, on 18 June. Rastatt surrendered on 23 July; courts martial sentenced 27 men to death, and thousands of Badeners emigrated.": "En Bade l’armée elle-même est passée à la révolution. La garnison de la forteresse fédérale de Rastatt mutinée, le Grand-Duc Léopold s’enfuit, et un gouvernement provisoire sous Lorenz Brentano prend le pouvoir, allié avec les insurgés dans le Palatinat. Les troupes prussiennes et d’autres troupes fédérales sous le prince William de Prusse, futur empereur, ont battu l’armée révolutionnaire sous le général polonais Ludwik Mierosławski à Waghäusel le 21 juin. Les troupes de Wurtemberg ont dispersé la dernière de l’Assemblée nationale, qui avait déménagé à Stuttgart, le 18 juin. Rastatt s’est rendu le 23 juillet ; les cours martiales ont condamné 27 hommes à mort, et des milliers de Badens ont émigré."
