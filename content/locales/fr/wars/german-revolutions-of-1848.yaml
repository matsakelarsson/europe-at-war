"February – September 1848": "février – septembre 1848"
"News of the February revolution in Paris set off meetings and petitions across the German states. A meeting at Mannheim on 27 February demanded a free press, trial by jury, a citizens’ militia and an all-German parliament, and these “March demands” spread from state to state. Most princes gave way and appointed liberal ministers. In Vienna students and workers rose on 13 March, and Metternich, the symbol of the old order, resigned and fled. In Berlin troops fought townspeople at the barricades on 18 March, and more than 250 people, most of them civilians, were killed before Frederick William IV withdrew the army from the city.": "Les nouvelles de la révolution de février à Paris ont déclenché des réunions et des pétitions dans les États allemands. Une réunion à Mannheim le 27 février a exigé une presse libre, un procès par jury, une milice citoyenne et un parlement allemand, et ces revendications de mars se sont répandues d’État en État. La plupart des princes ont cédé la place et nommé des ministres libéraux. À Berlin, les troupes ont combattu les habitants des villes à la barricade le 18 mars, et plus de 250 personnes, pour la plupart des civils, ont été tuées avant que Frederick William IV retire l’armée de la ville."
"A pre-parliament met in Frankfurt at the end of March and called elections across the German Confederation, including the Austrian lands, on a broad male franchise. On 18 May the National Assembly opened in St Paul’s Church, its benches filled with lawyers, professors and officials. In Baden the radical Friedrich Hecker, impatient for a republic, led an armed column that was routed at Kandern on 20 April. When the Assembly accepted the armistice Prussia had made with Denmark at Malmö, riots broke out in Frankfurt on 18 September; two conservative deputies were murdered, and Prussian and Austrian troops restored order.": "Un pré-Parlement s’est réuni à Francfort fin mars et a convoqué des élections dans la Confédération allemande, y compris les terres autrichiennes, sur une large franchise masculine. Le 18 mai l’Assemblée nationale a ouvert dans l’église Saint Paul, ses bancs remplis d’avocats, de professeurs et de fonctionnaires. Lorsque l’Assemblée a accepté l’armistice Prusse avait fait avec le Danemark à Malmö, des émeutes ont éclaté à Francfort le 18 septembre ; deux députés conservateurs ont été assassinés, et les troupes prussiennes et autrichiennes ont rétabli l’ordre."
