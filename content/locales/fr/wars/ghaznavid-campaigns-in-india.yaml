# French translations of the catalogue text (wave 8); step bodies follow later.
Ghaznavid campaigns in India: Campagnes ghaznévides en Inde
The raids and conquests of Mahmud of Ghazni in north-western and northern India. Between 1000 and 1027 the Ghaznavid sultan led some seventeen expeditions across the Indus. He broke the Hindu Shahi kingdom in battles from Peshawar (1001) to Nandana (1014), took Multan from its Ismaili rulers, plundered the temple towns of Nagarkot, Thanesar and Mathura, received the submission of the Pratihara king of Kannauj in 1018 and of the kings of Gwalior and Kalinjar in 1022–1023, and in January 1026 sacked the temple of Somnath on the coast of Gujarat. The treasure and captives paid for his wars in Central Asia and his buildings in Ghazni. The lasting conquest was the Punjab, which his successors ruled from Lahore until the Ghurids took it in 1186.: Les raids et les conquêtes de Mahmoud de Ghazni dans le nord-ouest et le nord de l’Inde. Entre 1000 et 1027, le sultan ghaznévide mena quelque dix-sept expéditions au-delà de l’Indus. Il brisa le royaume des Shahis hindous au cours de batailles livrées de Peshawar (1001) à Nandana (1014), prit Multan à ses souverains ismaéliens, pilla les villes-temples de Nagarkot, de Thanesar et de Mathura, reçut la soumission du roi pratihara de Kannauj en 1018 et des rois de Gwalior et de Kalinjar en 1022–1023, et en janvier 1026 mit à sac le temple de Somnath, sur la côte du Goujarat. Le trésor et les captifs financèrent ses guerres en Asie centrale et ses constructions à Ghazni. Sa conquête durable fut le Pendjab, que ses successeurs gouvernèrent depuis Lahore jusqu’à sa prise par les Ghurides en 1186.
