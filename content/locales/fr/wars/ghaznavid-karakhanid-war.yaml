# French translations of the catalogue text (wave 7); step bodies follow later.
Ghaznavid–Karakhanid war: Guerre entre Ghaznévides et Karakhanides
The war over Khorasan between Mahmud of Ghazni and the Kara-Khanid ruler Nasr, the Ilig Khan, who had divided the lands of the Samanids between them along the Oxus in 999. In 1006, while Mahmud was campaigning at Multan in India, the Ilig Khan sent two armies across the river; Chaghartigin took Balkh and Subashitigin took Herat. Mahmud hurried back and drove them out within months. In 1008 the Ilig Khan returned with his kinsman Yusuf Qadir Khan and a large army, but on 5 January 1008, on the plain of Katar about 20 km from Balkh, Mahmud’s army and its war elephants routed them, and many Kara-Khanid soldiers drowned in the Oxus as they fled. The frontier stayed on the Oxus, and relations improved under the Ilig Khan’s successors.: La guerre pour le Khorassan entre Mahmoud de Ghazni et le souverain karakhanide Nasr, l’Ilig Khan, qui s’étaient partagé en 999 les terres des Samanides le long de l’Oxus. En 1006, alors que Mahmoud faisait campagne à Multan, en Inde, l’Ilig Khan envoya deux armées de l’autre côté du fleuve ; Chaghartigin prit Balkh et Subashitigin Hérat. Mahmoud revint en hâte et les chassa en quelques mois. En 1008, l’Ilig Khan revint avec son parent Yusuf Qadir Khan et une grande armée, mais le 5 janvier 1008, dans la plaine de Katar, à environ 20 km de Balkh, l’armée de Mahmoud et ses éléphants de guerre les mirent en déroute, et de nombreux soldats karakhanides se noyèrent dans l’Oxus en fuyant. La frontière resta sur l’Oxus, et les relations s’améliorèrent sous les successeurs de l’Ilig Khan.
