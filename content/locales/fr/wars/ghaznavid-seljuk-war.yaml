# French translations of the catalogue text (wave 7); step bodies follow later.
Ghaznavid–Seljuk war: Guerre entre Ghaznévides et Seldjoukides
The war in which the Seljuk Turkmen, led by the brothers Tughril and Chaghri, took Khorasan from the Ghaznavid sultan Mas’ud I. After crossing the Oxus in 1035 they beat a Ghaznavid army at Nasa and were granted grazing lands on the edge of the Karakum desert. They then took Merv and, in 1038, Nishapur, where Tughril was proclaimed sultan. Mas’ud’s great campaign of 1039–1040 ended in his defeat at Dandanaqan, between Sarakhs and Merv, on 23 May 1040, which gave the Seljuks Khorasan and opened the way to their conquest of Iran.: La guerre au cours de laquelle les Turkmènes seldjoukides, menés par les frères Toghrul et Tchagri, enlevèrent le Khorassan au sultan ghaznévide Mas’ud Ier. Après avoir franchi l’Oxus en 1035, ils battirent une armée ghaznévide à Nasa et obtinrent des pâturages en bordure du désert du Karakoum. Ils prirent ensuite Merv puis, en 1038, Nichapur, où Toghrul fut proclamé sultan. La grande campagne de Mas’ud en 1039–1040 s’acheva par sa défaite à Dandanaqan, entre Sarakhs et Merv, le 23 mai 1040, qui donna le Khorassan aux Seldjoukides et leur ouvrit la voie de la conquête de l’Iran.
