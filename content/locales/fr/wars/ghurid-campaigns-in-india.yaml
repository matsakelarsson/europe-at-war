# French translations of the catalogue text (wave 8); step bodies follow later.
Ghurid campaigns in India: Campagnes ghurides en Inde
The conquest of northern India by Mu’izz al-Din Muhammad of Ghor, known as Muhammad Ghori, and his commanders. From Ghazni he took Multan and Uch in 1175, was defeated by the Chaulukyas of Gujarat at Kasahrada in 1178 and took the last Ghaznavid lands in the Punjab by 1186. Beaten by the Chahamana king Prithviraj III at the first battle of Tarain in 1191, he returned the next year and destroyed Prithviraj’s army on the same field. His slave commander Qutb al-Din Aibak then took Delhi, the Gahadavala king Jayachandra was killed at Chandawar in 1194, and Gwalior, Anhilwara, Kalinjar and, under Bakhtiyar Khalji, Bihar and Bengal followed. When Mu’izz al-Din was killed in 1206, his Indian conquests passed to Aibak and the other commanders, and the Delhi Sultanate grew out of them.: La conquête du nord de l’Inde par Mu’izz al-Din Muhammad de Ghor, dit Muhammad Ghori, et par ses commandants. Depuis Ghazni, il prit Multan et Uch en 1175, fut battu par les Chaulukya du Goujarat à Kasahrada en 1178 et s’empara en 1186 des dernières terres ghaznévides du Pendjab. Vaincu par le roi chahamana Prithviraj III à la première bataille de Tarain en 1191, il revint l’année suivante et anéantit l’armée de Prithviraj sur le même champ de bataille. Son commandant esclave Qutb al-Din Aibak prit alors Delhi, le roi gahadavala Jayachandra fut tué à Chandawar en 1194, et Gwalior, Anhilwara, Kalinjar et, sous Bakhtiyar Khalji, le Bihar et le Bengale suivirent. Lorsque Mu’izz al-Din fut tué en 1206, ses conquêtes indiennes passèrent à Aibak et aux autres commandants, et c’est d’elles que naquit le sultanat de Delhi.
