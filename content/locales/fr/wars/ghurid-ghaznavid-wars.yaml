# French translations of the catalogue text (wave 7); step bodies follow later.
Ghurid–Ghaznavid wars: Guerres entre Ghurides et Ghaznévides
The wars in which the Ghurids, chiefs of the mountain land of Ghor in central Afghanistan, overthrew the Ghaznavid dynasty they had once served. In revenge for the killing of two of his brothers by the Ghaznavid sultan Bahram Shah, Ala al-Din Husayn took Ghazni in 1150 and burned it, earning the name Jahansuz, “world-burner”. After an interval in which Oghuz Turkmen held Ghazni, his nephews Ghiyath al-Din and Mu’izz al-Din took the city in 1173, and from there Mu’izz al-Din conquered the last Ghaznavid lands in the Punjab, taking Lahore and the last sultan, Khusrau Malik, in 1186.: Les guerres par lesquelles les Ghurides, chefs du pays montagneux du Ghor, dans le centre de l’Afghanistan, renversèrent la dynastie ghaznévide qu’ils avaient autrefois servie. Pour venger le meurtre de deux de ses frères par le sultan ghaznévide Bahram Shah, Ala al-Din Husayn prit Ghazni en 1150 et l’incendia, ce qui lui valut le surnom de Jahansuz, « l’incendiaire du monde ». Après une période pendant laquelle des Turkmènes oghouzes tinrent Ghazni, ses neveux Ghiyath al-Din et Mu’izz al-Din prirent la ville en 1173 ; de là, Mu’izz al-Din conquit les dernières terres ghaznévides du Pendjab, s’emparant de Lahore et du dernier sultan, Khusrau Malik, en 1186.
