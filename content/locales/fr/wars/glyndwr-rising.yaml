"1404–1415": "1404–1415"
"In 1404 Owain took the great castles of Harlech and Aberystwyth, held a parliament of all Wales at Machynlleth and made a treaty with Charles VI of France. In February 1405, in the Tripartite Indenture, he, Mortimer and the Earl of Northumberland agreed to divide England and Wales between them, with Wales stretching to the Severn and the Mersey. That August a French army of some 2,500 men landed at Milford Haven, took Carmarthen with the Welsh and marched into England as far as Woodbury Hill near Worcester, where it faced the king’s army for several days before turning back.": "En 1404 Owain prit les grands châteaux de Harlech et d’Aberystwyth, tenu un parlement de tout le pays de Galles à Machinlleth et fit un traité avec Charles VI de France. En février 1405, dans l’Indenture tripartite, il, Mortimer et le comte de Northumberland acceptèrent de diviser l’Angleterre et le Pays de Galles entre eux, le Pays de Galles s’étendant jusqu’au Severn et au Mersey. En août, une armée française de quelque 2 500 hommes débarqua à Milford Haven, prit Carmarthen avec le gallois et se rendit en Angleterre jusqu’à Woodbury Hill près de Worcester, où il affronta l’armée du roi pendant plusieurs jours avant de retourner en arrière."
"But the tide was turning. Owain’s forces were beaten at Grosmont in March 1405 and at Pwll Melyn near Usk in May, where his brother Tudur was killed and his son Gruffudd captured; Adam of Usk says 300 prisoners were beheaded. In 1406 Owain’s letter from Pennal offered to bring the Welsh church under the pope at Avignon and set out plans for two Welsh universities, but French help was drying up. Prince Henry, the future Henry V, used the castles still in English hands to blockade the country, and one district after another submitted and paid fines.": "Les forces Owain ont été battues à Grosmont en mars 1405 et à Pwll Melyn près d’Usk en mai, où son frère Tudur a été tué et son fils Gruffudd capturé ; Adam d’Usk dit que 300 prisonniers ont été décapités. En 1406 Owain, la lettre de Pennal proposa d’amener l’église galloise sous le pape d’Avignon et fixa des plans pour deux universités galloises, mais l’aide française s’assèche. Le prince Henry, le futur Henri V, utilisait les châteaux encore en mains anglaises pour bloquer le pays, et un district après l’autre soumettait et payait des amendes."
"Anglesey was lost in 1406, Aberystwyth fell in 1408 and Harlech in February 1409, where Mortimer died and Owain’s wife and daughters were captured; Catrin and her children died in captivity in London. After a failed raid into Shropshire in 1410 Owain went into hiding. He never accepted Henry V’s offers of pardon and probably died around 1415; his son Maredudd accepted a pardon in 1421.": "Anglesey est perdu en 1406, Aberystwyth tombe en 1408 et Harlech en février 1409, où Mortimer meurt et Owain , la femme et les filles sont capturées ; Catrin et ses enfants meurent en captivité à Londres. Après un raid raté dans Shropshire en 1410 Owain est entré dans la clandestinité. Il n’accepta jamais les offres de pardon d’Henry V.S. et mourut probablement vers 1415 ; son fils Maredudd accepta une grâce en 1421."
