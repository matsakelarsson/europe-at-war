"Glyndŵr Rising": "Révolte d’Owain Glyndŵr"
"The last great Welsh revolt against English rule, led by Owain Glyndŵr, who was proclaimed Prince of Wales in 1400. At its height in 1404–1405 he controlled most of Wales, held a parliament at Machynlleth and allied with France, but English armies and an economic blockade wore the rising down. After Harlech fell in 1409 Glyndŵr became a fugitive, and he disappeared around 1415.": "La dernière grande révolte galloise contre la domination anglaise, dirigée par Owain Glynd-Her, proclamé prince de Galles en 1400. A son apogée en 1404–1405, il contrôla la majeure partie du pays de Galles, tenu un parlement à Machylleth et allié à la France, mais les armées anglaises et un blocus économique portèrent la montée vers le bas. Après que Harlech tomba en 1409 Glynd-Her devint fugitif et disparut vers 1415."
"Dates are Julian. Many events of the rising are known only from a few chronicles, above all that of Adam of Usk, and several dates are uncertain, among them those of the battles of Grosmont and Pwll Melyn, usually put in March and May 1405.": "Les dates sont Julian. Beaucoup d’événements de la montée ne sont connus que de quelques chroniques, surtout celle d’Adam d’Usk, et plusieurs dates sont incertaines, parmi lesquelles celles des batailles de Grosmont et Pwll Melyn, généralement mises en mars et mai 1405."
"Owain’s name is also written Owen Glendower in older English. The date and place of his death are unknown; a Welsh annal records it under 1415.": "Le nom de Owain est aussi écrit Owen Glendower en anglais plus ancien. La date et le lieu de sa mort sont inconnus ; une annale galloise l’enregistre sous 1415."
