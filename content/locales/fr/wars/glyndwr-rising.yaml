"Owain Glyndŵr, lord of Glyndyfrdwy and Cynllaith and a descendant of the princes of Powys and Deheubarth, had served English kings in war. A land dispute with his neighbour Reginald Grey, Lord of Ruthin, came to a head after Henry IV deposed Richard II, who had been well liked in Wales. On 16 September 1400 a small band of followers proclaimed Owain Prince of Wales at Glyndyfrdwy. Two days later they sacked Ruthin, and within a week they had burned the English towns of north-east Wales from Denbigh and Flint to Oswestry and Welshpool. Henry IV marched round north Wales but found no one to fight.": "Owain Glynd, seigneur de Glyndyfrdwy et de Cynllaith et descendant des princes de Powys et Deheubarth, avait servi les rois anglais en guerre. Une dispute terrestre avec son voisin Reginald Grey, seigneur de Ruthin, vint à la tête après qu’Henri IV déposa Richard II, qui avait été bien aimé au Pays de Galles. Le 16 septembre 1400, une petite bande d’adeptes proclama Owain Prince of Wales à Glyndyfrdwy. Deux jours plus tard, ils larguèrent Ruthin, et en moins d’une semaine, ils brûlèrent les villes anglaises du nord-est du pays de Galles de Denbigh et Flint à Oswestry et Welshpool. Henry IV marcha dans le nord du pays de Galles mais ne trouva personne pour se battre."
"The revolt spread in 1401. Owain’s cousins Rhys and Gwilym ap Tudur seized Conwy Castle on Good Friday while most of its garrison was at church, and Owain beat a much larger force from Pembrokeshire at Mynydd Hyddgen. Parliament answered with harsh laws barring Welshmen from office, from bearing arms and from buying land in England. In 1402 Owain captured Grey and held him for ransom, and on 22 June at Bryn Glas, near Pilleth, he routed the levies of Herefordshire and took Sir Edmund Mortimer prisoner. Mortimer married Owain’s daughter Catrin and joined him.": "La révolte se répandit en 1401. Les cousins d’Owain Rhys et de Gwilym ap Tudur s’emparèrent du château de Conwy le vendredi saint alors que la plupart de sa garnison était à l’église, et Owain battit une force beaucoup plus grande du Pembrokeshire à Mynydd Hyddgen. En 1402 Owain captura Grey et le retena pour rançon, et le 22 juin à Bryn Glas, près de Pilleth, il débarqua les prélèvements d’Herefordshire et fit prisonnier Sir Edmund Mortimer. Mortimer épousa la fille d’Owain, Catrin, et le rejoignit."
"In July 1403 Owain swept down the Tywi valley, where castles and towns fell or surrendered, and took Carmarthen. That month Henry “Hotspur” Percy, who had fought the Welsh for the king, rebelled in Cheshire with Welsh support, but he was killed fighting Henry IV and his son Prince Henry at Shrewsbury on 21 July. Owain, far away in the south, took no part in the battle.": "En juillet 1403, Owain balaya la vallée de Tywi, où les châteaux et les villes tombaient ou se rendaient, et prit Carmarthen. Ce mois-là, Henry Hotspur, qui avait combattu le gallois pour le roi, s’était rebellé dans le Cheshire avec l’appui du gallois, mais il fut tué en combattant Henry IV et son fils le prince Henry à Shrewsbury le 21 juillet. Owain, loin dans le sud, n’a pas pris part à la bataille."
