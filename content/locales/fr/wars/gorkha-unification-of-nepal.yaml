# French translations of the catalogue text (wave 8); step bodies follow later.
Gorkha conquest of the Kathmandu Valley: Conquête de la vallée de Katmandou par le Gorkha
The wars in which Prithvi Narayan Shah, king of the small hill state of Gorkha, conquered the rich Newar kingdoms of the Kathmandu Valley and founded the Kingdom of Nepal. Starting in 1743, he took the fort of Nuwakot above the valley in 1744 and then, over two decades, cut the valley off from its trade routes to Tibet and India. He took Makwanpur in 1762, beat off an army sent by the Nawab of Bengal, Mir Qasim, in 1763, and finally took Kirtipur after two failed assaults. In 1767 the British East India Company sent a small expedition under Captain George Kinloch to help Jaya Prakash Malla, king of Kathmandu, but it was driven back from the hills. Prithvi Narayan took Kathmandu in September 1768, Lalitpur soon after and Bhaktapur in 1769, and made Kathmandu his capital. The conquests of his successors in the east and west are not part of this story.: Les guerres par lesquelles Prithvi Narayan Shah, roi du petit État montagnard de Gorkha, conquit les riches royaumes newars de la vallée de Katmandou et fonda le royaume du Népal. Entré en campagne en 1743, il prit en 1744 le fort de Nuwakot, qui domine la vallée, puis, pendant deux décennies, coupa la vallée de ses routes commerciales vers le Tibet et l’Inde. Il prit Makwanpur en 1762, repoussa en 1763 une armée envoyée par le nawab du Bengale, Mir Qasim, et s’empara enfin de Kirtipur après deux assauts manqués. En 1767, la Compagnie britannique des Indes orientales envoya une petite expédition commandée par le capitaine George Kinloch au secours de Jaya Prakash Malla, roi de Katmandou, mais elle fut refoulée des collines. Prithvi Narayan prit Katmandou en septembre 1768, Lalitpur peu après et Bhaktapur en 1769, et fit de Katmandou sa capitale. Les conquêtes de ses successeurs à l’est et à l’ouest n’appartiennent pas à ce récit.
