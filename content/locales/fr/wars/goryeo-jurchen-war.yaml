# French translations of the catalogue text (wave 10); step bodies follow later.
Goryeo–Jurchen war: Guerre entre Goryeo et les Jürchen
Goryeo’s war with the Jurchens of the north-east, then being united by the Wanyan clan. In 1104 Wanyan forces under Wuyashu reached Goryeo’s border near Jeongju, the eastern end of the Thousand-li Wall, and defeated two Goryeo armies. The general Yun Gwan then built up a new force, the Byeolmuban, with cavalry, infantry and a corps of monks, and at the end of 1107 he and O Yeon-chong crossed the wall with an army of 170,000. They overran the Jurchen villages of the north-eastern coastal plain and built nine fortresses, from Hamju (Hamhung) northwards. The Jurchens counterattacked again and again, the forts proved hard to hold and supply, and in 1109 the Goryeo court gave them back in return for promises of peace and tribute. Six years later Wuyashu’s brother Aguda founded the Jin empire, which destroyed Liao and in 1126 made Goryeo accept it as overlord.: La guerre de Goryeo contre les Jürchen du nord-est, alors en cours d’unification sous l’égide du clan Wanyan. En 1104, les forces wanyan commandées par Wuyashu atteignirent la frontière de Goryeo près de Jeongju, à l’extrémité orientale du mur des Mille li, et battirent deux armées de Goryeo. Le général Yun Gwan mit alors sur pied une nouvelle force, le Byeolmuban, composée de cavalerie, d’infanterie et d’un corps de moines, et à la fin de 1107 il franchit le mur avec O Yeon-chong à la tête d’une armée de 170 000 hommes. Ils envahirent les villages jürchen de la plaine côtière du nord-est et bâtirent neuf forteresses, de Hamju (Hamhung) vers le nord. Les Jürchen contre-attaquèrent sans relâche, les forts se révélèrent difficiles à tenir et à ravitailler, et en 1109 la cour de Goryeo les restitua en échange de promesses de paix et de tribut. Six ans plus tard, Aguda, frère de Wuyashu, fonda l’empire Jin, qui détruisit les Liao et, en 1126, contraignit Goryeo à le reconnaître comme suzerain.
