# French translations of the catalogue text (wave 10); step bodies follow later.
Goryeo–Khitan War: Guerre entre le Goryeo et les Khitans
? Three invasions of Goryeo by the Khitan Liao empire, which ended with a Goryeo victory at Gwiju and a lasting peace. Goryeo had been hostile to the Khitans since they destroyed Balhae in 926, and it traded and exchanged envoys with Song China, Liao’s rival. In 993 a Liao army under Xiao Sunning crossed the Yalu; the Goryeo envoy Seo Hui negotiated a settlement in which Goryeo became a Liao tributary but gained the land up to the Yalu, where it built six fortified garrisons. In 1010 Emperor Shengzong invaded in person, using a palace coup in Goryeo as his pretext; he defeated and killed the general Kang Jo, and early in 1011 burned the capital, Kaegyong, while King Hyeonjong fled to Naju, but his army was harassed all the way home. When Goryeo refused to hand back the garrisons, Liao attacked again, and in 1018–1019 Xiao Paiya’s army marched almost to Kaegyong before Kang Gam-chan destroyed it at Gwiju on 10 March 1019. Goryeo remained a nominal tributary of Liao, kept the land up to the Yalu, and guarded its north with a long wall built between 1033 and 1044.
: Trois invasions du Goryeo par l’empire khitan des Liao, qui s’achevèrent par une victoire du Goryeo à Gwiju et une paix durable. Le Goryeo était hostile aux Khitans depuis qu’ils avaient détruit le Balhae en 926, et il commerçait et échangeait des ambassades avec la Chine des Song, rivale des Liao. En 993, une armée Liao commandée par Xiao Sunning franchit le Yalu ; l’envoyé du Goryeo, Seo Hui, négocia un accord par lequel le Goryeo devint tributaire des Liao mais obtint les terres jusqu’au Yalu, où il construisit six garnisons fortifiées. En 1010, l’empereur Shengzong envahit le pays en personne, prenant pour prétexte un coup d’État de palais au Goryeo ; il battit et tua le général Kang Jo et, au début de 1011, incendia la capitale, Kaegyong, tandis que le roi Hyeonjong s’enfuyait à Naju, mais son armée fut harcelée pendant tout le trajet du retour. Lorsque le Goryeo refusa de rendre les garnisons, les Liao attaquèrent de nouveau et, en 1018–1019, l’armée de Xiao Paiya marcha presque jusqu’à Kaegyong avant que Kang Gam-chan ne l’anéantisse à Gwiju le 10 mars 1019. Le Goryeo resta tributaire nominal des Liao, conserva les terres jusqu’au Yalu et protégea sa frontière nord par un long mur construit entre 1033 et 1044.
