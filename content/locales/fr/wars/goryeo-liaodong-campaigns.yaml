# French translations of the catalogue text (wave 10); step bodies follow later.
Goryeo’s Liaodong campaigns: Campagnes du Goryeo au Liaodong
Goryeo’s two attempts to push into Liaodong as the Yuan empire collapsed, the second of which ended in Yi Seong-gye’s coup. After breaking with the Yuan in 1356 and retaking the north-east, King Gongmin sent armies across the Yalu in 1370 against the Yuan forces left in Liaodong. Yi Seong-gye took the mountain fortress of Uraseong (Wunu shan) in the first month, and in the eleventh month he and Ji Yong-su took Liaoyang, the main city of the region, but withdrew for lack of supplies. In the following years the new Ming dynasty took over Liaodong. In 1388, when the Ming announced that it would claim the lands north of Cheollyeong, King U and his chief minister Choe Yeong sent an army of nearly 39,000 to attack Liaodong. Yi Seong-gye, one of its two commanders, had argued against the war; when the army reached Wihwado, an island in the Yalu, in the rains, he and Jo Min-su turned it around, marched on Kaegyong, exiled Choe Yeong and deposed the king. Four years later Yi Seong-gye founded the Joseon dynasty.: Les deux tentatives du Goryeo pour s’étendre au Liaodong pendant l’effondrement de l’empire Yuan, dont la seconde aboutit au coup d’État de Yi Seong-gye. Après avoir rompu avec les Yuan en 1356 et repris le nord-est, le roi Gongmin envoya en 1370 des armées au-delà du Yalu contre les forces Yuan restées au Liaodong. Yi Seong-gye prit la forteresse de montagne d’Uraseong (Wunu shan) au premier mois et, au onzième mois, lui et Ji Yong-su prirent Liaoyang, la principale ville de la région, mais se retirèrent faute de vivres. Dans les années qui suivirent, la nouvelle dynastie Ming s’empara du Liaodong. En 1388, lorsque les Ming annoncèrent qu’ils revendiqueraient les terres au nord de Cheollyeong, le roi U et son principal ministre, Choe Yeong, envoyèrent une armée de près de 39 000 hommes attaquer le Liaodong. Yi Seong-gye, l’un de ses deux commandants, s’était opposé à la guerre ; lorsque l’armée atteignit Wihwado, une île du Yalu, sous les pluies, lui et Jo Min-su lui firent faire demi-tour, marchèrent sur Kaegyong, exilèrent Choe Yeong et déposèrent le roi. Quatre ans plus tard, Yi Seong-gye fonda la dynastie Joseon.
