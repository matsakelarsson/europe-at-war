# French translations of the catalogue text (wave 10); step bodies follow later.
Military coup of 1170 and the risings against it: Coup d’État militaire de 1170 et soulèvements contre le nouveau pouvoir
? The seizure of power by Goryeo’s military officers and the risings that followed. Under King Uijong, military officers were kept below civil officials in rank and treated with contempt. In the eighth month of 1170, during a royal outing to the Bohyeonwon hostel near Kaegyong, the generals Jeong Jung-bu, Yi Ui-bang and Yi Go had the guards kill the civil officials and eunuchs in the king’s party; more than fifty officials were killed in the capital. Uijong was exiled to Geoje and his brother was made king as Myeongjong. In the eighth month of 1173 Kim Bo-dang, a civil official commanding the north-eastern frontier, rose to restore Uijong; his allies brought the former king from Geoje to Gyeongju, but they were defeated, Kim Bo-dang was executed, and in the tenth month Yi Ui-min killed Uijong at Gyeongju. Many more civil officials were killed in reprisal. In the ninth month of 1174 Jo Wi-chong, governor of the Western Capital (Pyongyang), rose with more than forty towns of the north-west; his army reached Kaegyong but was driven back, and Seogyeong held out until the sixth month of 1176, when it fell and he was killed. Meanwhile, in the first month of 1176, Mangi and Mangsoi led the people of Myeonghak-so, a settlement of bound craftsmen in Gongju (today in Daejeon), in a rising that took Gongju; the court raised Myeonghak-so to a county to win them over, but they rose again in 1177 and surrendered in the sixth month. The officers kept power, under a succession of military strongmen, for a century.
: La prise du pouvoir par les officiers militaires du Goryeo et les soulèvements qui suivirent. Sous le roi Uijong, les officiers militaires étaient maintenus à un rang inférieur à celui des fonctionnaires civils et traités avec mépris. Au huitième mois de 1170, lors d’une sortie royale au relais de Bohyeonwon, près de Kaegyong, les généraux Jeong Jung-bu, Yi Ui-bang et Yi Go firent tuer par les gardes les fonctionnaires civils et les eunuques de la suite du roi ; plus de cinquante fonctionnaires furent tués dans la capitale. Uijong fut exilé à Geoje et son frère fut fait roi sous le nom de Myeongjong. Au huitième mois de 1173, Kim Bo-dang, un fonctionnaire civil qui commandait la frontière du nord-est, se souleva pour restaurer Uijong ; ses alliés amenèrent l’ancien roi de Geoje à Gyeongju, mais ils furent vaincus, Kim Bo-dang fut exécuté et, au dixième mois, Yi Ui-min tua Uijong à Gyeongju. De nombreux autres fonctionnaires civils furent tués en représailles. Au neuvième mois de 1174, Jo Wi-chong, gouverneur de la capitale de l’Ouest (Pyongyang), se souleva avec plus de quarante villes du nord-ouest ; son armée atteignit Kaegyong mais fut repoussée, et Seogyeong tint jusqu’au sixième mois de 1176, où la ville tomba et où il fut tué. Entre-temps, au premier mois de 1176, Mangi et Mangsoi menèrent les habitants de Myeonghak-so, un établissement d’artisans de condition servile de Gongju (aujourd’hui à Daejeon), dans un soulèvement qui s’empara de Gongju ; la cour éleva Myeonghak-so au rang de district pour les rallier, mais ils se soulevèrent de nouveau en 1177 et se rendirent au sixième mois. Les officiers conservèrent le pouvoir pendant un siècle, sous une succession d’hommes forts issus de l’armée.
