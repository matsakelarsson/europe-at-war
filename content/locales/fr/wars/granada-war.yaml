"1490–1492": "1490–1492"
"Through 1490 Castilian armies burned the crops of the Vega, while Boabdil, hoping for help from North Africa and Egypt that never came, struck back at nearby castles and tried to win back an outlet to the sea. In April 1491 Ferdinand camped before Granada with a large army. When fire destroyed the camp that July, the Monarchs rebuilt it in stone as a town, Santa Fe, a sign that they would stay until the city fell. Hunger grew inside, Boabdil’s advisers quarrelled, and secret talks began.": "En 1490, les armées castilliennes ont brûlé les récoltes de la Vega, tandis que Boabdil, espérant l’aide de l’Afrique du Nord et de l’Égypte qui n’est jamais venue, a frappé les châteaux voisins et essayé de regagner un débouché vers la mer. Lorsque le feu a détruit le camp en juillet, les Monarques l’ont reconstruit en pierre comme une ville, Santa Fe, un signe qu’ils resteraient jusqu’à ce que la ville tombe."
"By the Treaty of Granada of 25 November 1491 the city was to surrender on generous terms. Its Muslims would keep their property, laws, mosques and religion, and could emigrate freely. Boabdil handed over the Alhambra on 2 January 1492, received a lordship in the Alpujarras and left for Morocco in October 1493. The terms did not last. The Jews of Castile and Aragon were ordered that March to convert or leave, and after forced conversions provoked a revolt in 1499–1501, the Muslims of Granada had to choose between baptism and exile.": "Par le traité de Grenade du 25 novembre 1491 la ville devait se rendre à des conditions généreuses. Ses musulmans conserveraient leurs biens, lois, mosquées et religion, et pourraient émigrer librement. Boabdil remis l’Alhambra le 2 janvier 1492, reçut une seigneurie dans l’Alpujarras et partit pour le Maroc en octobre 1493. Les Juifs de Castille et d’Aragon reçurent l’ordre de se convertir ou de partir en mars, et après des conversions forcées provoquèrent une révolte en 1499–1501, les musulmans de Grenade durent choisir entre le baptême et l’exil."
