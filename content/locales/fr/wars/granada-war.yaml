"The Ajarquía and Lucena": "L’Ajarquía et Lucena"
"In March 1483 a large Castilian raiding force of nobles and knights of the military orders, led by the Master of Santiago and the Marquis of Cádiz, rode into the Ajarquía, the hill country east of Málaga, to plunder it. Lost in the ravines at night, they were ambushed by the local people and by troops under Abu’l-Hasan’s brother Muhammad, known as al-Zagal. Hundreds were killed and many more captured. It was the worst Castilian defeat of the war.": "En mars 1483, une grande force castillane de raids des nobles et chevaliers des ordres militaires, dirigée par le maître de Santiago et le marquis de Cádiz, monta dans l’Ajarquía, le pays montagneux à l’est de Málaga, pour le piller. Perdus dans les ravins la nuit, ils ont été pris en embuscade par le peuple local et par des troupes sous Aboul-Hassan Muhammad frère, connu comme al-Zagal. Des centaines ont été tués et beaucoup d’autres capturés. C’était la pire défaite castillanienne de la guerre."
"A month later Boabdil, wanting a victory of his own, attacked Lucena with his father-in-law Ali al-Attar. The Count of Cabra and his nephew, the alcaide of the Donceles, beat his army near the town; Ali al-Attar was killed and Boabdil himself was captured. Ferdinand and Isabella saw the value of a divided Granada. By the Pact of Córdoba that August they freed him as their vassal, promising him help against his father and uncle in return for tribute and his son as a hostage. From then on the war ran alongside a Nasrid civil war.": "Un mois plus tard, Boabdil, voulant remporter sa victoire, attaqua Lucena avec son beau-père Ali al-Attar. Le comte de Cabra et son neveu, l’alcaïde des Donceles, battèrent son armée près de la ville ; Ali al-Attar fut tué et Boabdil lui-même fut capturé. Ferdinand et Isabella virent la valeur d’une Grenade divisée. Par le pacte de Cordoue d’août, ils l’ont libéré comme vassal, lui promettant de l’aider contre son père et son oncle en échange d’un tribut et son fils en otage."
