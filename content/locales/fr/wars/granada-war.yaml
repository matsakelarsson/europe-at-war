"1488–1489": "1488–1489"
"In 1488 the Monarchs turned east, where Vera, Mojácar and other towns submitted without a fight. In June 1489 a large army besieged Baza, al-Zagal’s strongest fortress, defended by his kinsman Sidi Yahya al-Nayar. The city was hard to surround and the guns were of little use against it, so the siege dragged on through the autumn rains, at enormous cost. Queen Isabella came to the camp in November to show that it would not be lifted, and Baza surrendered on generous terms on 4 December 1489.": "En 1488, les Monarques tournèrent vers l’est, où Vera, Mojácar et d’autres villes se présentèrent sans se battre.En juin 1489 une grande armée assiégea Baza, la forteresse la plus forte d’al-Zagal, défendue par son parent Sidi Yahya al-Nayar. La ville était difficile à entourer et les canons étaient peu utiles contre elle, de sorte que le siège traîné par les pluies d’automne, à un coût énorme. Reine Isabella est venu au camp en novembre pour montrer qu’il ne serait pas levé, et Baza s’est rendu à des conditions généreuses le 4 décembre 1489."
"Sidi Yahya went over to the Christians and helped persuade al-Zagal that further resistance was hopeless. In December al-Zagal handed over Almería and Guadix in return for a lordship in the Alpujarras and a pension; he later left for North Africa. Now only the city of Granada and the mountains of the Alpujarras remained to Boabdil, who had promised to surrender Granada once his uncle was beaten. Unhappy with his rewards, he refused and broke with the Monarchs, and the war entered its last phase.": "Sidi Yahya est allé vers les chrétiens et a aidé à persuader al-Zagal que la résistance était sans espoir. En décembre al-Zagal a remis Almería et Guadix en échange d’une seigneurie dans l’Alpujarras et une pension ; il est parti plus tard pour l’Afrique du Nord. Maintenant, seule la ville de Grenade et les montagnes des Alpujarras sont restées à Boabdil, qui avait promis de rendre Grenade une fois son oncle battu. Malheureux de ses récompenses, il a refusé et rompu avec les Monarques, et la guerre est entrée dans sa dernière phase."
