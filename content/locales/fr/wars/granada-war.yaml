"Granada War": "Guerre de Grenade"
"The ten-year war in which Isabella of Castile and Ferdinand of Aragon conquered the Nasrid emirate of Granada, the last Muslim state in western Europe. Helped by a civil war within the Nasrid family and by their siege artillery, the Catholic Monarchs took Granada’s towns one by one, among them Ronda, Málaga and Baza, until Boabdil surrendered the city and the Alhambra on 2 January 1492, completing the Reconquista.": "La guerre de dix ans dans laquelle Isabella de Castille et Ferdinand d’Aragon ont conquis l’émirat nasride de Grenade, le dernier État musulman en Europe occidentale. Appuyés par une guerre civile au sein de la famille Nasride et par leur artillerie de siège, les Monarques catholiques ont pris Grenade une à une, parmi lesquelles Ronda, Málaga et Baza, jusqu’à ce que Boabdil se rende la ville et l’Alhambra le 2 janvier 1492, complétant la Reconquista."
"Spanish sources call the emir Abu’l-Hasan Ali “Muley Hacén”, his son Abu Abdallah Muhammad “Boabdil” and his brother Muhammad “el Zagal”, the valiant. Historians number these last two differently as Muhammad XI, XII or XIII.": "Les sources espagnoles appellent l’émir Aboul-Hasan Ali, son fils Abu Abdallah Muhammad et son frère Muhammad, le vaillant Mohamed Zagal. Les historiens comptent ces deux derniers différemment que Muhammad XI, XII ou XIII."
"The chronicles give the Castilian armies as 50,000 or more in the main campaigns and the Granadan ones as tens of thousands. Some modern historians think the real numbers were much smaller, perhaps 8,000–20,000 Castilian soldiers and a few thousand Granadans.": "Les chroniques donnent aux armées castilliennes 50 000 ou plus dans les campagnes principales et les Grenadennes des dizaines de milliers. Certains historiens modernes pensent que le nombre réel était beaucoup plus petit, peut-être 8 000 à 20 000 soldats castilliens et quelques milliers de Grenadens."
"Dates are Julian. The centuries before 1482 are told in the Reconquista.": "Les dates sont Julian. Les siècles avant 1482 sont racontés dans la Reconquista."
