"In April 1487 Ferdinand marched on Málaga, the emirate’s great port, by way of Vélez-Málaga to the east. Al-Zagal came down from Granada to relieve Vélez, but while he was away Boabdil’s supporters seized the capital, and al-Zagal fell back to Guadix. Vélez surrendered on 27 April. With the coast road open, the Castilians besieged Málaga by land and sea from 7 May. Its commander, Hamet el Zegrí, with North African troops and Christian renegades, refused all terms, and the city held out for three months while famine set in.": "En avril 1487, Ferdinand marcha sur Málaga, le grand port de l’émirat, en passant par Vélez-Málaga à l’est. Al-Zagal descendit de Grenade pour soulager Vélez, mais pendant qu’il était loin Boabdil, les partisans s’emparèrent de la capitale et al-Zagal retourna à Guadix. La route côtière étant ouverte, les Castillais ont assiégé Málaga par terre et par mer à partir du 7 mai. Son commandant, Hamet el Zegrí, avec des troupes nord-africaines et des renégats chrétiens, a refusé tous les termes, et la ville s’est tenue pendant trois mois pendant que la famine s’inscrivait."
"Málaga surrendered on 18 August 1487. Ferdinand refused terms, having offered them twice, and as punishment most of its people, many thousands, were enslaved; some were sold, some given away and some allowed to ransom themselves. The city’s Jews were ransomed by the Jews of Castile, and renegades were put to death. The fall of Málaga cut Granada off from North Africa. Boabdil held Granada as the Monarchs’ vassal, and al-Zagal was left with the east of the emirate around Guadix, Baza and Almería.": "Málaga s’est rendu le 18 août 1487. Ferdinand a refusé les conditions, leur ayant offert deux fois, et comme punition la plupart de son peuple, des milliers, ont été réduits en esclavage ; certains ont été vendus, certains donnés et certains ont permis de se racheter. La ville Juifs ont été rachetés par les juifs de Castille, et renégades ont été mis à mort. Boabdil tenait Grenade comme le vassal de Monarques, et al-Zagal a été laissé avec l’est de l’émirat autour de Guadix, Baza et Almería."
