"1484–1486": "1484–1486"
"Castile now fought a war of sieges, town by town. Its decisive weapon was artillery. The Monarchs hired gunners and founders from France, Burgundy and Italy, and trains of heavy bombards were dragged along mountain roads that labourers built ahead of them. Álora fell in 1484 and Setenil that September. In May 1485, after a bombardment of about two weeks and talks with its leaders, Ronda surrendered, and Marbella and the western hills followed. That year al-Zagal pushed aside his ageing brother, who died soon after, and fought both the Christians and his nephew Boabdil.": "La Castille a maintenant combattu une guerre de siège, ville par ville. Son arme décisive était l’artillerie. Les Monarques ont embauché des artilleurs et des fondateurs de France, Bourgogne et Italie, et des trains de bombardiers lourds ont été traînés le long des routes de montagne que les ouvriers construisaient devant eux. Álora est tombée en 1484 et Setenil en septembre. En mai 1485, après un bombardement d’environ deux semaines et des pourparlers avec ses dirigeants, Ronda s’est rendu, et Marbella et les collines occidentales ont suivi. Cette année-là al-Zagal a repoussé son frère vieillissant, qui est mort peu après, et a combattu à la fois les chrétiens et son neveu Boabdil."
"In May 1486 Ferdinand besieged Loja again, where Boabdil, who had come to terms with his uncle and broken with the Monarchs, had joined the defence. English volunteers under Lord Scales were among the besiegers. The town surrendered at the end of May, and Boabdil was captured and released once more. Íllora and Moclín, fortresses guarding the approaches to Granada, fell that summer. The western half of the emirate was gone, and Castile’s armies could reach the Vega, the fertile plain around the capital.": "En mai 1486, Ferdinand assiégea à nouveau Loja, où Boabdil, qui était venu à la rencontre de son oncle et avait rompu avec les Monarques, s’était joint à la défense. Des volontaires anglais sous Lord Scales étaient parmi les assiégés. La ville se rendit à la fin du mois de mai, et Boabdil fut capturé et relâché une fois de plus. Íllora et Moclín, forteresses qui gardaient les abords de Grenade, sont tombés cet été-là. La moitié ouest de l’émirat était partie, et les armées castillanaises pouvaient atteindre la Vega, la plaine fertile autour de la capitale."
