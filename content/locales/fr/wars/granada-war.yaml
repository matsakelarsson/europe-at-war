"By 1481 the Nasrid emirate of Granada was the last Muslim state in the Iberian Peninsula, a mountainous land with the ports of Málaga and Almería and the city of Granada itself, crowned by the Alhambra. Its emir, Abu’l-Hasan Ali, had stopped paying tribute to Castile. Isabella of Castile and Ferdinand of Aragon, married since 1469 and secure after the War of the Castilian Succession, were ready to end its independence. In late December 1481, in reprisal for a Christian raid, Granadan troops surprised the Castilian border town of Zahara by night and carried off its people as captives.": "En 1481, l’émirat nasride de Grenade était le dernier État musulman dans la péninsule ibérique, une terre montagneuse avec les ports de Malaga et Almería et la ville de Grenade elle-même, couronné par l’Alhambra. Son émir, Aboul-Hasan Ali, avait cessé de rendre hommage à la Castille. Isabella de Castille et Ferdinand d’Aragon, mariée depuis 1469 et sécurisée après la guerre de la Succession castillane, étaient prêtes à mettre fin à son indépendance. Fin décembre 1481, en représailles pour un raid chrétien, les troupes de Grenade ont surpris la ville frontalière castillane de Zahara de nuit et emporté son peuple comme captifs."
"Castile struck back on 28 February 1482, when Rodrigo Ponce de León, Marquis of Cádiz, scaled the walls of Alhama, a rich town on the road between Granada and Málaga, and took it after hard street fighting. Abu’l-Hasan besieged it twice, and the Catholic Monarchs made its defence a royal cause; Ferdinand himself took command there in May. In July he besieged Loja and was driven off. On the day Loja was relieved, Abu’l-Hasan’s son Abu Abdallah, Boabdil, rose against his father and took the Alhambra, splitting Granada between rival emirs.": "La Castille battit le 28 février 1482, lorsque Rodrigo Ponce de León, marquis de Cádiz, étendit les murs d’Alhama, une ville riche sur la route entre Grenade et Málaga, et la prit après des combats difficiles de rue. Abu=l-Hasan assiégea deux fois, et les Monarques catholiques firent de sa défense une cause royale ; Ferdinand lui-même y prit le commandement en mai. En juillet, il assiégea Loja et fut chassé. Le jour où Loja fut soulagé, le fils d’Abu Abdallah, Boabdil, se leva contre son père et prit l’Alhambra."
