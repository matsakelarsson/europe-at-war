# French translations of the catalogue text (wave 7); step bodies follow later.
Grand Mosque seizure: Prise de la Grande Mosquée de La Mecque
? The two-week occupation of the Great Mosque of Mecca, Islam’s holiest site, by armed followers of Juhayman al-Otaybi, a former Saudi National Guard corporal and preacher who denounced the Saudi royal family as corrupt and Westernised. At dawn prayers on 20 November 1979, the first day of the Islamic year 1400, between 300 and 600 men seized the mosque with tens of thousands of worshippers inside, and proclaimed Juhayman’s brother-in-law, Mohammed Abdullah al-Qahtani, to be the Mahdi, the redeemer expected at the end of time. After the senior clergy issued a ruling allowing force in the sanctuary, Saudi troops and National Guardsmen fought for the mosque and then for the cellars beneath it, with advice and gas from a small team of French GIGN commandos and help from Pakistani special forces, until the last militants surrendered on 4 December. Al-Qahtani was killed in the fighting. Official figures gave 127 soldiers, 117 militants and 26 pilgrims killed, though diplomats believed the toll was higher. Juhayman and 62 of his followers were beheaded on 9 January 1980 in eight Saudi cities. Afterwards the government gave the conservative clergy greater influence over Saudi society.
: L’occupation pendant deux semaines de la Grande Mosquée de La Mecque, le lieu le plus saint de l’islam, par les partisans armés de Juhayman al-Otaybi, ancien caporal de la Garde nationale saoudienne et prédicateur, qui dénonçait la famille royale saoudienne comme corrompue et occidentalisée. À la prière de l’aube, le 20 novembre 1979, premier jour de l’an 1400 de l’hégire, entre 300 et 600 hommes s’emparèrent de la mosquée, où se trouvaient des dizaines de milliers de fidèles, et proclamèrent le beau-frère de Juhayman, Mohammed Abdallah al-Qahtani, Mahdi, le rédempteur attendu à la fin des temps. Après que les principaux oulémas eurent rendu un avis autorisant l’usage de la force dans le sanctuaire, les troupes saoudiennes et les gardes nationaux se battirent pour reprendre la mosquée, puis les souterrains situés sous elle, conseillés et pourvus en gaz par une petite équipe de commandos français du GIGN et aidés par des forces spéciales pakistanaises, jusqu’à la reddition des derniers insurgés le 4 décembre. Al-Qahtani fut tué dans les combats. Selon les chiffres officiels, 127 soldats, 117 insurgés et 26 pèlerins furent tués, mais des diplomates estimaient le bilan plus lourd. Juhayman et 62 de ses partisans furent décapités le 9 janvier 1980 dans huit villes saoudiennes. Par la suite, le gouvernement accorda au clergé conservateur une plus grande influence sur la société saoudienne.
