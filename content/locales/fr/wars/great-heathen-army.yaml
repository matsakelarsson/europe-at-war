York and East Anglia: York et East Anglia
865–870: 865–870
Viking raids on England had gone on for seventy years, but the force that landed in East Anglia in 865 came to stay. The Chronicle calls it the “great heathen army”; its leaders are said to have included Ivar the Boneless and Halfdan, sons of the legendary Ragnar Lothbrok. The East Anglians bought peace with horses. In November 866 the army rode north and took York, while the Northumbrians were divided by civil war. In March 867 the two rival kings, Osberht and Ælla, attacked the city together and were both killed.: Les raids vikings sur l’Angleterre avaient eu lieu pendant soixante-dix ans, mais la force qui a atterri dans East Anglia en 865 est venue pour rester. La Chronique appelle cela la grande armée païenne de ; ses dirigeants auraient inclus Ivar le Boneless et Halfdan, fils du légendaire Ragnar Lothbrok. En novembre 866, l’armée monta au nord et prit York, tandis que les Northumbriens furent divisés par la guerre civile. En mars 867, les deux rois rivaux, Osberht et Ælla, attaquèrent la ville ensemble et furent tous deux tués.
The Vikings set up an English puppet king in Northumbria and moved into Mercia, taking Nottingham. A joint army of Mercia and Wessex besieged them there without result, and the Mercians paid them to leave. In 869 the army returned to East Anglia and took up winter quarters at Thetford. King Edmund fought it and was defeated, captured and killed. He was soon venerated as a martyr, St Edmund.: Les Vikings installent un roi de marionnettes anglais à Northumbria et s’établissent en Mercia, prenant Nottingham. Une armée mixte de Mercia et Wessex les assiégea là sans résultat, et les Mercians payèrent leur départ. En 869 l’armée retourna à East Anglia et prit des quartiers d’hiver à Thetford. Le roi Edmund combattit et fut vaincu, capturé et tué. Il fut bientôt vénéré comme martyr, saint Edmund.
