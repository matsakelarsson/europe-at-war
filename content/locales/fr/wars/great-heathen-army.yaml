Great Heathen Army: Grande armée des nations
A large Scandinavian army, mostly Danish, which invaded England in 865 and over fifteen years destroyed the kingdoms of Northumbria, East Anglia and Mercia. Stopped by Alfred of Wessex at Edington in 878, its leaders settled the conquered lands, the area later called the Danelaw.: Une grande armée scandinave, principalement danoise, qui envahit l’Angleterre en 865 et plus de quinze ans détruisit les royaumes de Northumbria, East Anglia et Mercia. Arrêtée par Alfred du Wessex à Edington en 878, ses dirigeants installèrent les terres conquises, la région plus tard appelée Danelaw.
The main source is the Anglo-Saxon Chronicle, written at Alfred’s court and partisan to Wessex. Its years began at Christmas or in September, so some events are a year earlier or later in other reckonings.: La principale source est la Chronique anglo-saxonne, écrite au tribunal Alfred et partisan de Wessex. Ses années ont commencé à Noël ou en septembre, donc certains événements sont un an plus tôt ou plus tard dans d’autres comptes.
The name comes from the Chronicle’s “mycel hæþen here”. The army’s size is unknown; estimates range from a few hundred to several thousand men.: Le nom vient du Chronicle. La taille de l’armée est inconnue ; les estimations vont de quelques centaines à plusieurs milliers d’hommes.
