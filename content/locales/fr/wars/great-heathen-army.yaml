Edington and the Danelaw: Edington et la Danelaw
878–880: 878–880
In midwinter 878, just after Twelfth Night, Guthrum fell on the royal estate of Chippenham. Much of Wessex submitted and Alfred fled with a small band to the marshes of Athelney in Somerset, from where he raided the Danes. In May he called out the men of Somerset, Wiltshire and part of Hampshire, and at Edington he defeated Guthrum’s army, then besieged it in Chippenham until it surrendered.: Au milieu de l’hiver 878, juste après la douzième nuit, Guthrum tombe sur le domaine royal de Chippenham. Une grande partie du Wessex se soumet et Alfred fuit avec un petit groupe dans les marais d’Athelney à Somerset, d’où il fait une descente dans les Danois. En mai, il appela les hommes de Somerset, Wiltshire et une partie du Hampshire, et à Edington il battit l’armée de Guthrum, puis l’assiégea à Chippenham jusqu’à ce qu’il se rende.
Guthrum agreed to leave Wessex and to be baptised, with Alfred as his godfather. In 879 his army moved to East Anglia, where he ruled as king under his baptismal name, Æthelstan. A treaty between the two kings, probably from the 880s, set the border along the Thames, the Lea and Watling Street. North and east of it lay the region of Danish law and settlement later called the Danelaw, where Scandinavian place names such as those ending in -by and -thorpe still abound.: Guthrum accepta de quitter Wessex et d’être baptisé, avec Alfred comme parrain. En 879 son armée s’installa à l’est Anglia, où il régna sous son nom baptismal Æthelstan. Un traité entre les deux rois, probablement des années 880, fixa la frontière le long de la Tamise, de la Lea et de la rue Watling. Au nord et à l’est de cette région se trouve la région du droit danois et de sa colonie appelée plus tard le Danelaw, où les noms de lieux scandinaves tels que ceux qui se terminent par et -thorpe abondent encore.
