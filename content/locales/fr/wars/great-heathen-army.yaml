870–877: 870–877
In late 870 the army invaded Wessex and fortified a camp at Reading. In the winter of 871 the West Saxons fought it again and again. King Æthelred and his brother Alfred won at Ashdown in January but lost several other battles, and in April Æthelred died. Alfred, now king, paid the Vikings to leave. They wintered in London, then at Torksey and in 873 at Repton, in the heart of Mercia, where they drove King Burgred into exile and put Ceolwulf, a Mercian thegn, in his place.: À la fin de 870, l’armée envahit le Wessex et fortifie un camp à Reading. L’hiver 871, les Saxons occidentaux le combattent encore et encore. Le roi Æthelred et son frère Alfred gagnent à Ashdown en janvier mais perdent plusieurs autres batailles, et en avril Æthelred meurt. Alfred, maintenant roi, paie les Vikings pour partir. Ils passèrent l’hiver à Londres, puis à Torksey et en 873 à Repton, au cœur de la Mercie, où ils conduisirent le roi Burgred à l’exil et lui confièrent Ceolwulf, un théologien mercien.
In 874 the army split. Halfdan took his men north, and in 876 he shared out the land of Northumbria among them; the Chronicle says they “were ploughing and providing for themselves”. Guthrum and two other kings went to Cambridge, then slipped into Wessex, holding Wareham and Exeter in 875–877. In 877 they divided Mercia, settling its eastern half and leaving the west to Ceolwulf.: En 874 l’armée s’est séparée. Halfdan a pris ses hommes au nord, et en 876 il partageait le pays de Northumbria parmi eux ; la Chronique dit qu’ils ont labouré et se fournir pour eux-mêmes. Guthrum et deux autres rois sont allés à Cambridge, puis glissé dans Wessex, tenant Wareham et Exeter en 875-877. En 877, ils divisèrent Mercia, s’installant dans sa moitié orientale et laissant l’ouest à Ceolwulf.
