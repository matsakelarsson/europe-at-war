Galley fleet, 1719: Flotte Galley, 1719
The end of an empire: La fin d’un empire
Charles XII’s sister Ulrika Eleonora, and then her husband Frederick I, made peace on the best terms they could get. In the Treaties of Stockholm Sweden gave up Bremen-Verden to Hanover (November 1719) and Pomerania south of the Peene, with Stettin, Usedom and Wolin, to Prussia (February 1720). At Frederiksborg in July 1720 Denmark–Norway handed back Stralsund, Rügen and Wismar for 600,000 riksdaler, but Sweden lost its exemption from the Sound Dues and its alliance with Holstein-Gottorp.: Dans les traités de Stockholm, la Suède abandonna Brême-Verden à Hanovre (novembre 1719) et Poméranie au sud du Peene, avec Stettin, Usedom et Wolin, à Prusse (1720). En juillet 1720, à Frederiksborg, le Danemark et la Norvège ont rendu Stralsund, Rügen et Wismar pour 600 000 riksdaler, mais la Suède a perdu son exemption des droits sonores et son alliance avec Holstein-Gottorp.
Peace with Russia came last, at Nystad on 10 September 1721. Sweden gave up Livonia, Estonia with Ösel, Ingria and south-eastern Finland with Viborg and Kexholm. Russia returned the rest of Finland and paid 2 million riksdaler. Sweden’s time as a great power was over, and Russia had taken its place.: La paix avec la Russie est arrivée en dernier, à Nystad le 10 septembre 1721. La Suède a abandonné Livonie, Estonie avec Ösel, Ingria et le sud-est de la Finlande avec Viborg et Kexholm. La Russie est revenue le reste de la Finlande et a payé 2 millions de raksdaler.
