1709–1710: 1709–1710
Poltava revived the coalition. Augustus took back the Polish throne and Denmark–Norway declared war again. In November 1709 a Danish army of 15,000 landed at Råå, took Helsingborg and marched through Scania into Blekinge. Magnus Stenbock raised a new army, largely of fresh recruits, and on 10 March 1710 beat the Danes outside Helsingborg. They left Scania for good.: En novembre 1709, une armée danoise de 15 000 personnes débarqua à Råå, prit Helsingborg et marcha à travers Scania pour rejoindre Blekinge. Magnus Stenbock éleva une nouvelle armée, en grande partie de nouvelles recrues, et le 10 mars 1710 battit les Danois à l’extérieur de Helsingborg. Ils quittèrent définitivement Scania.
The east was lost. In 1710 the Russians took Viborg in June, Riga in July, Pernau in August and Reval in the autumn, and the nobles and towns of Livonia and Estonia submitted to the tsar. Plague swept through the besieged towns and on into Sweden itself.: En 1710, les Russes prirent Viborg en juin, Riga en juillet, Pernau en août et Reval à l’automne, et les nobles et les villes de Livonie et d’Estonie se soumettèrent au tsar. Plague balaya dans les villes assiégées et en Suède elle-même.
