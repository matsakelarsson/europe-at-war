Treaties of Stockholm: Traités de Stockholm
1719–1720: 1719–1720
Peace with Hanover in November 1719 and with Prussia in February 1720. Hanover paid 1 million riksdaler and Prussia 2 million thalers.: Paix avec Hanovre en novembre 1719 et avec la Prusse en février 1720. Hanovre a payé 1 million de raksdaler et la Prusse 2 millions de thalers.
Treaty of Frederiksborg: Traité de Frederiksborg
July 1720: juillet 1720
Peace with Denmark–Norway, named after the castle at Hillerød. Sweden also stopped backing the Duke of Holstein-Gottorp, whose part of Schleswig Denmark kept.: Paix avec le Danemark-Norvège, nommé d’après le château à Hillerød. La Suède a également cessé de soutenir le duc de Holstein-Gottorp, dont la partie du Schleswig Danemark conservait.
Treaty of Nystad: Traité de Nystad
10 September 1721: 10 septembre 1721
Signed in a small town on the Finnish coast. Russia kept its conquests on the eastern Baltic and handed back the rest of Finland within weeks.: Signé dans une petite ville sur la côte finlandaise. La Russie a gardé ses conquêtes sur l’est de la Baltique et remis le reste de la Finlande en quelques semaines.
