The Danes bombarded and took the capital of Bremen-Verden.: Les Danois bombardèrent et prirent la capitale de Brême-Verden.
Battle of Gadebusch: Bataille de Gadebusch
20 December 1712: 20 décembre 1712
Stenbock attacked the Danish and Saxon army at Wakenstädt near Gadebusch and won decisively.: Stenbock attaqua l’armée danoise et saxonne à Wakenstädt près de Gadebusch et obtint une victoire décisive.
Altona burned: Altona brûlé
January 1713: janvier 1713
Stenbock had the Danish town next to Hamburg burned down in midwinter, which badly damaged his reputation.: Stenbock fit brûler la ville danoise à côté de Hambourg au milieu de l’hiver, ce qui mit sa réputation en péril.
Surrender at Tönning: Rendez-vous à Tönning
16 May 1713: 16 mai 1713
Trapped by Danish, Russian and Saxon forces, Stenbock’s army surrendered to Frederick IV. Another Swedish field army was gone.: Emprisonnés par les forces danoises, russes et saxonnes, l’armée de Stenbock s’est rendue à Frederick IV. Une autre armée suédoise de campagne a disparu.
Stettin: Stétine
September 1713: septembre 1713
Taken by Russian and Saxon troops and then placed under Prussian control.: Prise par les troupes russes et saxonnes, puis placée sous le contrôle prussien.
Finland falls: Finlande chutes
1713–1714: 1713–1714
In May 1713 Peter’s galley fleet appeared off Helsingfors, and over the summer Russian troops occupied southern Finland, including Åbo. That August Carl Gustaf Armfeldt took command of a starving, ragged army.: En mai 1713, la flotte de galères de Peters est apparue à Helsingfors, et au cours de l’été les troupes russes occupaient le sud de la Finlande, y compris Åbo.
On 2 March 1714 the Russians under Mikhail Golitsyn crushed Armfeldt’s army at Storkyro in Ostrobothnia. That summer the Swedish fleet tried to block the coastal route at Hangö, but on 7 August 1714 Russian galleys slipped past and captured a squadron under Rear Admiral Nils Ehrenskiöld in the Battle of Gangut. Åland fell, and all of Finland stayed under Russian occupation until 1721, years Finns remember as the Great Wrath.: Le 2 mars 1714, les Russes sous Mikhail Golitsyn ont écrasé l’armée d’Armfeldt à Storkyro en Ostrobotnie. Cet été-là, la flotte suédoise a essayé de bloquer la route côtière à Hangö, mais le 7 août 1714, des galères russes se sont glissées et ont capturé un escadron sous le contre-amiral Nils Ehrenskiöld dans la bataille de Gangut. Åland tomba, et toute la Finlande resta sous occupation russe jusqu’en 1721, années où les Finlandais se souviennent comme de la Grande Crasse.
Storkyro: Storkyro
2 March 1714, the last land battle in Finland: 2 mars 1714, la dernière bataille terrestre en Finlande
Finnish name for the occupation: Nom finlandais de la profession
Isoviha, the Great Wrath (1714–1721): Isoviha, la Grande Crasse (1714–1721)
Helsingfors: En Helsingfors
May 1713: mai 1713
Peter’s galley fleet landed troops here, and the defenders were driven inland.: La flotte de la galère de Peters a débarqué des troupes ici, et les défenseurs ont été conduits à l’intérieur.
Åbo: Åbo
Autumn 1713: Automne 1713
Finland’s chief town, seat of its bishop and university, was occupied.: La ville principale de Finlande, siège de son évêque et université, était occupée.
Battle of Storkyro: Bataille de Storkyro
2 March 1714: 2 mars 1714
Armfeldt’s outnumbered army was crushed, ending organised resistance in Finland.: L’armée d’Armfeldt a été écrasée, mettant fin à la résistance organisée en Finlande.
Battle of Gangut: Bataille de Gangut
7 August 1714: 7 août 1714
Russia’s first major naval victory, later celebrated as a “Poltava at sea”.: La Russie est la première grande victoire navale, plus tard célébré comme un -Poltava en mer.
Åland: Åland
August 1714: août 1714
After Gangut the Russians occupied the islands, within striking distance of Stockholm.: Après le Gangut, les Russes ont occupé les îles, à une distance saisissante de Stockholm.
Galley fleet: Flotte de gallois
Golitsyn: Golitsyn
The siege of Stralsund: Le siège de Stralsund
Charles found new enemies waiting. Prussia, already holding Stettin, and Hanover, whose elector was now King George I of Great Britain and had been promised Bremen-Verden by Denmark, both declared war on Sweden in 1715.: Charles trouva de nouveaux ennemis en attente. La Prusse, qui tenait déjà Stettin, et Hanovre, dont l’électeur était maintenant le roi George Ier de Grande-Bretagne et avait été promis Brême-Verden par le Danemark, tous deux déclaré la guerre à la Suède en 1715.
From July 1715 an allied army of some 55,000 besieged Stralsund, held by about 11,500 men. On 16 November Prussian, Danish and Saxon troops landed on Rügen at Stresow, and Charles’s counterattack failed. He escaped by boat just before Christmas and the town surrendered. Wismar, Sweden’s last foothold in Germany, fell in April 1716.: À partir de juillet 1715, une armée alliée d’environ 55 000 assiégés Stralsund, tenue par environ 11 500 hommes. Le 16 novembre, les troupes prussiennes, danoises et saxonnes débarquèrent sur Rügen à Stresow, et la contre-attaque de Charles s’échoua.
