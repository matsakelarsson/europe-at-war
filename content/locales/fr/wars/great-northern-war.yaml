1709–1713: 1709–1713
Charles lived near this Ottoman fortress on the Dniester for more than three years. In February 1713 he and his small household fought off Ottoman troops for hours before he was captured.: Charles a vécu près de cette forteresse ottomane sur le Dniestr pendant plus de trois ans. En février 1713, lui et sa petite maison se sont battus contre les troupes ottomanes pendant des heures avant d’être capturé.
July 1711: juillet 1711
Surrounded by a much larger Ottoman army, Peter had to make peace and hand back Azov, which Russia had won in 1696.: Entouré d’une armée ottomane beaucoup plus grande, Pierre dut faire la paix et rendre Azov, que la Russie avait gagné en 1696.
