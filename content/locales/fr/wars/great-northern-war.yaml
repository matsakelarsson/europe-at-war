After a siege of about eight months, with plague raging inside the walls, the capital of Livonia surrendered to Sheremetev.: Après un siège d’environ huit mois, avec la peste faisant rage à l’intérieur des murs, la capitale de Livonie s’est rendue à Sheremetev.
