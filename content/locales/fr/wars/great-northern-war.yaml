On the Ringstorp heights just outside the town, Stenbock routed the Danish army that had landed at Råå the previous November. It was the last major battle of the war on Swedish soil.: Sur les hauteurs de Ringstorp juste à l’extérieur de la ville, Stenbock a roué l’armée danoise qui avait atterri à Råå le novembre précédent. C’était la dernière grande bataille de la guerre sur le sol suédois.
