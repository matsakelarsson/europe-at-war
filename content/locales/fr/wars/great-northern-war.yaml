Russian raids on the coast: raids russes sur la côte
1719–1721: 1719–1721
After Charles’s death Sweden made peace with Hanover, Prussia and Denmark, but Russia kept up the pressure to force it to give up the Baltic provinces. In the summer of 1719 Russian galleys landed troops along the coasts of Uppland and Södermanland, burning towns, manors and ironworks from near Gävle down to Norrköping. A thrust toward Stockholm was stopped at Stäket in August.: Après la mort de Charles, la Suède a fait la paix avec Hanovre, la Prusse et le Danemark, mais la Russie a continué à faire pression pour qu’elle abandonne les provinces baltes. À l’été 1719, des galères russes ont débarqué des troupes le long des côtes d’Uppland et du Södermanland, des villes incendiées, des manoirs et des forges de près de Gävle jusqu’à Norrköping.
A British fleet came to Sweden’s aid in 1720 but could not stop the galleys. Russian troops burned Umeå that year, and in 1721 Sundsvall, Härnösand, Hudiksvall, Söderhamn and Piteå. Among the islands of Åland, Russian galleys defeated a Swedish squadron at Grengam in August 1720. On the west coast, Tordenskjold had taken Marstrand in 1719.: Les troupes russes brûlèrent Umeå cette année-là, et en 1721 Sundsvall, Härnösand, Hudiksvall, Söderhamn et Piteå. Parmi les îles d’Åland, les galères russes défont un escadron suédois à Grengam en août 1720. Sur la côte ouest, Tordenskjold avait pris Marsrand en 1719.
Swedish name: Nom suédois
Rysshärjningarna, the Russian ravages: Rysshärjningarna, les ravages russes
Towns burned: Villes brûlées
Norrköping, Södertälje, Umeå, Sundsvall, Härnösand, Piteå and others: Norrköping, Södertälje, Umeå, Sundsvall, Härnösand, Piteå et autres
Norrköping: Norrköping
