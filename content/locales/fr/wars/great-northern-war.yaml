1709–1714: 1709–1714
From his camp near Bender, Charles worked to bring the Ottoman Empire into the war, and late in 1710 it declared war on Russia. Peter marched into Moldavia, and in July 1711 a huge Ottoman army trapped him on the Pruth. To Charles’s fury, the grand vizier let the tsar go in return for giving back Azov.: De son camp près de Bender, Charles travailla à faire entrer l’Empire ottoman dans la guerre et, vers la fin de 1710, il déclara la guerre à la Russie. Pierre marcha en Moldavie et, en juillet 1711, une énorme armée ottomane le piégea sur la Pruth.
In time the sultan wanted his troublesome guest gone. On 1 February 1713 Ottoman troops and Tatars stormed Charles’s house at Bender, a fight remembered as the Kalabalik. In the autumn of 1714 he finally left, riding in disguise across the Habsburg lands and Germany, and reached Stralsund in about two weeks, in November 1714.: Le 1er février 1713, les troupes ottomanes et les Tatars s’emparèrent de la maison de Charles à Bender, un combat dont on se souvient comme le Kalabalik. À l’automne de 1714, il partit enfin, se déguisant sur les terres des Habsbourg et en Allemagne, et atteignit Stralsund en deux semaines environ, en novembre 1714.
Pruth campaign: Campagne de la Vérité
About 38,000 Russians against about 130,000 Ottomans: Environ 38 000 Russes contre environ 130 000 Ottomans
