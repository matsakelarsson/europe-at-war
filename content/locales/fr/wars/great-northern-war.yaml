1701–1704: 1701–1704
On 19 July 1701 Charles forced a crossing of the Düna near Riga, drove the Saxons out of Livonia and occupied Courland. Instead of turning on Russia, he set out to drive Augustus off the Polish throne.: Le 19 juillet 1701, Charles força une traversée de la Düna près de Riga, chassa les Saxons hors de Livonie et occupa Courland. Au lieu de se retourner contre la Russie, il partit chasser Auguste du trône polonais.
He took Warsaw in May 1702, beat the Saxons and their Polish allies at Kliszów on 19 July and went on to Kraków. In 1703 he won again at Pułtusk and starved Thorn into surrender after a siege of nearly five months. In July 1704 a Swedish-backed assembly in Warsaw elected Stanisław Leszczyński king of Poland, but Augustus fought on.: Il prit Varsovie en mai 1702, battit les Saxons et leurs alliés polonais à Kliszów le 19 juillet et se dirigea vers Cracovie. En 1703, il remporta à Pułtusk et mourut de faim Thorn après un siège de près de cinq mois.En juillet 1704, une assemblée soutenue par les Suédois à Varsovie élut Stanisław Leszczyński roi de Pologne, mais Augustus combattit.
