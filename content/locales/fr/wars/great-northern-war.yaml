Peter wins the Neva: Peter gagne la Neva
With the main army in Poland, small Swedish forces had to hold the Baltic provinces. Russian armies under Boris Sheremetev beat Wolmar Anton von Schlippenbach at Erastfer in January 1702 and at Hummelshof that July, then laid waste to much of Livonia and Estonia.: Avec l’armée principale en Pologne, de petites forces suédoises ont dû tenir les provinces baltes. Armées russes sous Boris Sheremetev battu Wolmar Anton von Schlippenbach à Erastfer en janvier 1702 et à Hummelshof ce juillet, puis jeté des déchets à une grande partie de la Livonie et l’Estonie.
Peter the Great’s real goal was the sea. In October 1702 he took Nöteborg, where the Neva leaves Lake Ladoga, and in May 1703 Nyenskans near its mouth. On 27 May 1703 he founded St Petersburg there. In the summer of 1704 the Russians stormed Dorpat and then Narva, the town they had failed to take four years before.: En octobre 1702, il prit Nöteborg, où la Neva quitte le lac Ladoga, et en mai 1703, Nyenskans près de son embouchure. Le 27 mai 1703, il y fonda Saint-Pétersbourg. L’été 1704, les Russes prirent Dorpat, puis Narva, ville qu’ils n’avaient pas prise quatre ans auparavant.
