November 1714: novembre 1714
Charles and a single companion reached the gates of the Swedish fortress on a dark November night, filthy from the road.: Charles et un seul compagnon atteignirent les portes de la forteresse suédoise par une nuit sombre en novembre, sale depuis la route.
Peter: Pierre
Charles rides home, 1714: Charles rentre chez lui, 1714
Gadebusch and Tönning: Gadebusch et Tönning
1711–1713: 1711–1713
With Charles away, Danish, Saxon and Russian troops attacked Swedish Pomerania in 1711 and began a long blockade of Stralsund. In 1712 Denmark and Hanover occupied Bremen-Verden between them, and Stade surrendered to the Danes in September.: Avec Charles à l’extérieur, les troupes danoises, saxonnes et russes attaquèrent la Poméranie suédoise en 1711 et commencèrent un long blocus de Stralsund. En 1712, le Danemark et Hanovre occupèrent Brême-Verden entre eux, et le Stade se rendit aux Danois en septembre.
Magnus Stenbock crossed to Pomerania with a new army and on 20 December 1712 beat the Danes and Saxons at Gadebusch, the last great Swedish victory of the war. Pursued by Russian and Saxon forces, he burned the Danish town of Altona in January 1713 and took refuge in the Holstein-Gottorp fortress of Tönning, where he had to surrender on 16 May 1713. That autumn the Russians took Stettin and handed it to Prussia to hold.: Magnus Stenbock croisa la Poméranie avec une nouvelle armée et, le 20 décembre 1712, il battit les Danois et les Saxons à Gadebusch, dernière grande victoire suédoise de la guerre. Purgée par les forces russes et saxonnes, il brûla la ville danoise d’Altona en janvier 1713 et se réfugia dans la forteresse Holstein-Gottorp de Tönning, où il dut se rendre le 16 mai 1713. Cet automne, les Russes ont pris Stettin et l’ont remis à la Prusse pour tenir.
Gadebusch: Gadebusch
14,000 Swedes against 16,000 Danes and 3,000 Saxons: 14 000 Suédois contre 16 000 Danois et 3 000 Saxons
Died a prisoner in Copenhagen in 1717: Décédé prisonnier à Copenhague en 1717
