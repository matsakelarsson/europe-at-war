Denmark–Norway, Saxony–Poland and Russia agreed to attack the young Charles XII from three sides. In February 1700 Saxon troops of Augustus II, Elector of Saxony and King of Poland, invaded Livonia and tried to take Riga. In March the Danes marched into Holstein-Gottorp, Sweden’s ally, and besieged Tönning.: En février 1700, les troupes saxonnes d’Auguste II, électrice de Saxe et roi de Pologne, envahirent Livonie et tentèrent de prendre Riga. En mars, les Danois marchèrent vers Holstein-Gottorp, en Suède, alliée et assiégée Tönning.
Charles, aged 18, struck at Denmark first. With English and Dutch ships covering the crossing, he landed at Humlebæk on Zealand on 4 August, and Frederick IV made peace at Travendal two weeks later. Charles then shipped his army to Pernau and marched on the Russians besieging Narva. On 30 November, in a snowstorm, about 10,500 Swedes routed an army more than three times their size.: Charles, âgé de 18 ans, frappe le Danemark d’abord. Avec des navires anglais et néerlandais couvrant la traversée, il débarque à Humlebæk sur la Zélande le 4 août, et Frederick IV fait la paix à Travendal deux semaines plus tard. Charles envoie ensuite son armée à Pernau et marche sur les Russes assiégeant Narva. Le 30 novembre, dans une tempête de neige, environ 10 500 Suédois acheminent une armée plus que trois fois leur taille.
