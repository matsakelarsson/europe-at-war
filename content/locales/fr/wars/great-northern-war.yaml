Disaster at Poltava: Catastrophe à Poltava
1708–1709: 1708–1709
Charles marched east through Poland and Lithuania in 1708 and won at Holowczyn on 14 July. The Russians burned the land ahead of him, so instead of heading for Moscow he turned south into Ukraine, where the Cossack hetman Ivan Mazepa had promised help. On 9 October the Russians caught Lewenhaupt’s relief column at Lesnaya and destroyed the supplies it was bringing from Riga. Mazepa brought only a few thousand Cossacks, and Menshikov razed his capital, Baturyn.: Charles marcha vers l’est à travers la Pologne et la Lituanie en 1708 et gagna à Holowczyn le 14 juillet. Les Russes brûlèrent la terre devant lui, donc au lieu de se diriger vers Moscou, il tourna vers le sud en Ukraine, où le cosaque hetman Ivan Mazepa avait promis de l’aide. Mazepa n’apporta que quelques milliers de cosaques, et Menshikov rasa sa capitale, Baturyn.
After one of the coldest winters in memory, Charles besieged Poltava. He had been wounded in the foot, so Rehnskiöld commanded when, on 8 July 1709, about 22,700 Swedes attacked Peter’s fortified camp and were crushed. Three days later most of the survivors surrendered at Perevolochna on the Dnieper. Charles and Mazepa escaped to Ottoman territory at Bender.: Après l’un des hivers les plus froids en mémoire, Charles assiégea Poltava. Il avait été blessé au pied, de sorte que Rehnskiöld commanda quand, le 8 juillet 1709, environ 22 700 Suédois attaquèrent le camp fortifié de Peter et furent écrasés. Trois jours plus tard la plupart des survivants se rendirent à Perevolochna sur le Dniepr.
