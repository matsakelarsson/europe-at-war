1705–1707: 1705–1707
In Courland, Adam Ludwig Lewenhaupt beat Sheremetev at Gemauerthof on 26 July 1705. Early in 1706 Charles hemmed a Russian army into Grodno, while in the west Carl Gustaf Rehnskiöld destroyed a much larger Saxon-Russian army at Fraustadt on 13 February 1706.: À Courland, Adam Ludwig Lewenhaupt battit Sheremetev à Gemauerthof le 26 juillet 1705. Au début de 1706, Charles écrase une armée russe dans Grodno, tandis qu’à l’ouest Carl Gustaf Rehnskiöld détruit une armée saxonne-russe beaucoup plus grande à Fraustadt le 13 février 1706.
In August Charles marched straight into Saxony, Augustus’s home. At Altranstädt near Leipzig on 24 September 1706 Augustus gave up the Polish crown and his alliance with the tsar. Even so, on 29 October a Russian-Saxon army beat a Swedish-Polish force at Kalisz, an embarrassment for Augustus, who had secretly made peace. The Swedish army stayed in Saxony for a year and set out against Russia in September 1707.: En août, Charles marcha tout droit en Saxe, chez Augustus. A Altranstädt près de Leipzig, le 24 septembre 1706, Augustus abandonna la couronne polonaise et son alliance avec le tsar. Pourtant, le 29 octobre, une armée russo-saxonne battit une force suédo-polonaise à Kalisz, un embarras pour Augustus qui avait secrètement fait la paix. L’armée suédoise est restée en Saxe pendant un an et s’est engagée contre la Russie en septembre 1707.
