Great Northern War: Grande guerre du Nord
Denmark–Norway, Saxony–Poland and Russia attacked Sweden in 1700. Charles XII beat them one by one and drove Augustus II from the Polish throne, but his invasion of Russia ended in disaster at Poltava in 1709. By the peace of Nystad in 1721 Sweden had lost its Baltic provinces and most of its German lands, and Russia had taken its place as the great power of the north.: Le Danemark, la Norvège, la Saxe, la Pologne et la Russie attaquèrent la Suède en 1700. Charles XII les battit un par un et conduisit Auguste II du trône polonais, mais son invasion de la Russie se termina par un désastre à Poltava en 1709. Par la paix de Nystad en 1721, la Suède avait perdu ses provinces baltes et la plupart de ses terres allemandes, et la Russie avait pris sa place comme grande puissance du nord.
Great Northern War dates are New Style throughout. Sweden itself used a calendar of its own, one day ahead of Old Style, from 1700 to 1712.: Les dates de la Grande Guerre du Nord sont New Style partout. La Suède elle-même a utilisé son propre calendrier, un jour d’avance sur Old Style, de 1700 à 1712.
Migrated from Sweden at War, so the story is told from Sweden’s side.: Migré de Suède à la guerre, l’histoire est donc racontée du côté suédois.
