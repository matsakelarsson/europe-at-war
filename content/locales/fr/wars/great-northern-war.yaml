55,000–58,000 men: 55 000 à 58 000 hommes
Swedish garrison: Garnison suédoise
About 11,500 men: Environ 11 500 hommes
Usedom: Utilisation
April – August 1715: avril – août 1715
Charles seized the island in a pre-emptive strike in April, but the Prussians took it back in the summer.: Charles s’empare de l’île lors d’une grève préventive en avril, mais les Prussiens la reprennent en été.
Battle of Rügen: Bataille de Rügen
August 1715: août 1715
The Swedish and Danish fleets clashed off Rügen without a clear winner.: Les flottes suédoise et danoise se sont affrontées à Rügen sans gagner clairement.
Landing at Stresow: Débarquement à Stresow
16 November 1715: 16 novembre 1715
Allied troops came ashore on Rügen. Charles attacked them at once with about 2,000 men and was beaten back.: Les troupes alliées sont arrivées à terre sur Rügen. Charles les a attaqués à la fois avec environ 2 000 hommes et a été battu en arrière.
Stralsund falls: Chutes de Stralsund
December 1715: décembre 1715
With Rügen lost the town could not hold. Charles slipped out by boat, and the whole garrison went into captivity.: Avec Rügen perdu la ville ne pouvait pas tenir. Charles glissa en bateau, et toute la garnison alla en captivité.
Wismar: Wismar
April 1716: avril 1716
Danish, Hanoverian and Prussian troops took Sweden’s last German town.: Les troupes danoises, hanoveriennes et prussiennes ont pris la Suède dernière ville allemande.
Norway, and death at Fredriksten: Norvège, et mort à Fredriksten
1716–1718: 1716–1718
Back in Sweden, Charles attacked Norway to strike at Denmark. He crossed the border in March 1716 and briefly occupied Christiania, but could not take Akershus fortress. An assault on Fredrikshald failed, and on 8 July Tordenskjold destroyed the Swedish supply fleet at Dynekilen, ending the campaign.: De retour en Suède, Charles attaqua la Norvège pour frapper le Danemark. Il traversa la frontière en mars 1716 et occupa brièvement Christiania, mais ne put prendre la forteresse d’Akershus. L’assaut de Fredrikshald échoua et, le 8 juillet, Tordenskjold détruisit la flotte d’approvisionnement suédoise à Dynekilen, mettant fin à la campagne.
In the autumn of 1718 Charles invaded again with about 36,000 men in three armies and besieged Fredriksten. On the evening of 11 December 1718, while inspecting the siege trenches, he was shot through the head. Further north, Carl Gustaf Armfeldt had failed to take Trondheim. Ordered home, his army was caught by a blizzard in the Tydal mountains in January 1719, and thousands froze to death.: À l’automne de 1718 Charles envahit à nouveau avec environ 36 000 hommes dans trois armées et assiégé Fredriksten. Le soir du 11 décembre 1718, tout en inspectant les tranchées de siège, il fut abattu par la tête. Ordonné chez lui, son armée fut prise par un blizzard dans les montagnes de Tydal en janvier 1719, et des milliers se figèrent à mort.
Charles XII killed: Charles XII tué
11 December 1718, aged 36: 11 décembre 1718, 36 ans
The death march: La marche de la mort
About 3,000 of Armfeldt’s men died: Environ 3 000 hommes d’Armfeldt sont morts
Christiania: Christiania
March – April 1716: mars – avril 1716
The Swedes held the town for some weeks, but Akershus fortress held out and they withdrew.: Les Suédois ont tenu la ville pendant quelques semaines, mais la forteresse d’Akershus a tenu dehors et ils se sont retirés.
Fredriksten: Fredriksten
1716 and 1718: 1716 et 1718
The fortress above Fredrikshald beat off the Swedes in 1716. During the second siege Charles XII was killed in the trenches on 11 December 1718, and his army went home.: La forteresse au-dessus de Fredrikshald battit les Suédois en 1716. Pendant le second siège Charles XII fut tué dans les tranchées le 11 décembre 1718, et son armée rentra chez elle.
Battle of Dynekilen: Bataille de Dynekilen
8 July 1716: 8 juillet 1716
Peter Tordenskjold sailed into the narrow fjord and captured or destroyed most of the Swedish transport ships supplying the army.: Peter Tordenskjold a navigué dans le fjord étroit et capturé ou détruit la plupart des navires de transport suédois fournissant l’armée.
Trondheim: Trondheim
Autumn 1718: Automne 1718
Armfeldt’s army of about 10,000 advanced on the city but could not take it.: Armfeldt de l’armée d’environ 10.000 avancé sur la ville, mais ne pouvait pas prendre.
The Carolean Death March: La marche de la mort caroleenne
January 1719: janvier 1719
Retreating across the mountains toward Jämtland, Armfeldt’s men were caught by a storm. Thousands froze to death.: Reprenant les montagnes vers Jämtland, les hommes d’Armfeldt ont été pris par une tempête. Des milliers se sont gelés à mort.
Charles XII, 1716: Charles XII, 1716
Tordenskjold: Tordenskjold
