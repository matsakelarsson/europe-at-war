Attacking with the snow at their backs, the Swedes broke through the Russian siege lines. Many Russians drowned when a bridge over the river collapsed under the fleeing troops.: Attaquant avec la neige à leur dos, les Suédois ont franchi les lignes de siège russes. Beaucoup de Russes se sont noyés quand un pont au-dessus de la rivière s’est effondré sous les troupes en fuite.
