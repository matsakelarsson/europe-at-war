# Some French text was translated automatically.
"Great Saxon Revolt": "Grande révolte saxonne"
"A rising of the Saxon nobles and peasants, led by Otto of Northeim and Bishop Burchard II of Halberstadt, against King Henry IV, whose castles around the Harz and their garrisons of Swabian ministeriales were resented as an occupation. Henry escaped from the besieged Harzburg in August 1073 and had to agree to slight his castles at Gerstungen in February 1074, but when peasants razed the Harzburg and desecrated the royal graves there, the princes rallied to him. He crushed the Saxon army at Homburg on the Unstrut, near Langensalza, on 9 June 1075, and the Saxon leaders surrendered unconditionally that October.": "Une montée des nobles et paysans saxons, dirigée par Otto de Northeim et Mgr Burchard II de Halberstadt, contre le roi Henri IV, dont les châteaux autour du Harz et leurs garnisons de ministres swabiens étaient ressentis comme une occupation. Henri s’échappa du Harzburg assiégé en août 1073 et dut accepter de réduire ses châteaux à Gerstungen en février 1074, mais lorsque les paysans rasèrent le Harzbourg et y profanèrent les tombes royales, les princes se rallièrent à lui. Il a écrasé l’armée saxonne à Homburg sur l’Unstrut, près de Langensalza, le 9 juin 1075, et les dirigeants saxons se sont rendus sans condition en octobre."
"Also called the Saxon Rebellion or Saxon War. The main narrative, by Lambert of Hersfeld, is hostile to Henry IV; Bruno’s Saxon War is openly partisan for the rebels.": "Aussi appelé la rébellion saxonne ou guerre saxonne. Le récit principal, par Lambert de Hersfeld, est hostile à Henry IV ; Brunos la guerre saxonne est ouvertement partisan pour les rebelles."
"The surrender at Spier near Sondershausen on 27 October 1075 came just as the quarrel with Pope Gregory VII began. The Saxons rose again in 1077 and backed the anti-kings Rudolf of Rheinfelden and Hermann of Salm, a war usually treated as part of the Investiture Controversy.": "La reddition à Spier près de Sondershausen le 27 octobre 1075 est venue tout comme la querelle avec le pape Grégoire VII a commencé. Les Saxons se sont levés à nouveau en 1077 et ont soutenu les anti-rois Rudolf de Rheinfelden et Hermann de Salm, une guerre généralement traitée dans le cadre de la controverse d’investiture."
