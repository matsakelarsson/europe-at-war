# Some French text was translated automatically.
"Great Siege of Malta": "Grand siège de Malte"
"The Ottoman attempt to take Malta from the Knights of St John in 1565. A large Ottoman army besieged the knights, the Maltese and their Spanish and Italian soldiers for nearly four months, taking Fort St Elmo at great cost but failing against Birgu and Senglea, until a relief army from Sicily landed in September and the invaders sailed away.": "La tentative ottomane de prendre Malte des Chevaliers de Saint-Jean en 1565. Une grande armée ottomane a assiégé les chevaliers, les Maltais et leurs soldats espagnols et italiens pendant près de quatre mois, prenant Fort St Elmo à grand prix mais en échec contre Birgu et Senglea, jusqu’à ce qu’une armée de secours de Sicile atterrisse en septembre et que les envahisseurs s’envolent."
"Dates are Julian, as usual for the period. In Malta the end of the siege is celebrated on 8 September, the day the Ottomans began to embark; their last attack came on 11 September, and their forces had left the islands by 13 September.": "Les dates sont Julian, comme d’habitude pour la période. A Malte la fin du siège est célébrée le 8 septembre, le jour où les Ottomans ont commencé à s’embarquer ; leur dernière attaque a eu lieu le 11 septembre, et leurs forces avaient quitté les îles le 13 septembre."
"The size of the Ottoman army is uncertain. One knight who fought in the siege, Francisco Balbi di Correggio, counted about 48,000; letters written during the siege give 22,000 or fewer, and most historians suggest 30,000–40,000 including sailors.": "La taille de l’armée ottomane est incertaine. Un chevalier qui a combattu dans le siège, Francisco Balbi di Correggio, comptait environ 48 000 ; lettres écrites pendant le siège donnent 22 000 ou moins, et la plupart des historiens suggèrent 30 000 à 40 000 y compris des marins."
"The Knights Hospitaller, a military religious order, held Malta from 1530 as a fief of the Kingdom of Sicily, paying a yearly falcon to its king. The new capital, Valletta, is named after Grand Master Jean de Valette.": "Le Chevalier Hospitalier, un ordre religieux militaire, a tenu Malte à partir de 1530 comme fief du Royaume de Sicile, payant un faucon annuel à son roi. La nouvelle capitale, la Valette, porte le nom de Grand Maître Jean de Valette."
