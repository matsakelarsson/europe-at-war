"Birgu, Senglea and the relief": "Birgu, Senglea et le soulagement"
"July–September 1565": "juillet–septembre 1565"
"Next the Ottomans turned on Birgu and Senglea, ringing them with some 65 guns. A small relief of about 600 men slipped into Birgu in early July. On 15 July Mustafa sent boats, dragged overland into the Grand Harbour, against Senglea, while corsairs stormed Fort St Michael; a battery hidden at the foot of Fort St Angelo sank most of the boats. On 7 August, with the walls breached, a great double assault was close to success when cavalry from Mdina fell on the Ottoman camp at Marsa, and the attackers, thinking a relief army had come, drew back.": "Ensuite, les Ottomans se tournèrent vers Birgu et Senglea, les sonnant avec environ 65 canons. Un petit soulagement d’environ 600 hommes s’est glissé à Birgu au début de juillet. Le 15 juillet Mustafa envoya des bateaux, traînés dans le Grand port, contre Senglea, tandis que les corsaires s’emparèrent du fort St Michael ; une batterie cachée au pied du fort St Angelo a coulé la plupart des bateaux. Le 7 août, les murs étant brisés, une grande double attaque était proche du succès lorsque la cavalerie de Mdina tomba sur le camp ottoman de Marsa, et les assaillants, pensant qu’une armée de secours était venue, se retirèrent."
"Through August the defenders beat off assaults, mines and siege towers. Valette, about seventy, fought in the breach himself and refused to abandon the towns for Fort St Angelo. On 7 September García de Toledo, viceroy of Sicily, landed about 8,000 men in the north of the island. The Ottomans began to embark, turned back to attack the relief army, were routed near St Paul’s Bay on 11 September and sailed away. About a third of the knights and of Malta’s people had died; the Ottomans had lost perhaps 25,000 or more. In March 1566 Valette laid the first stone of a new fortified city on Mount Sciberras, Valletta.": "Au cours du mois d’août, les défenseurs ont battu les assauts, les mines et les tours de siège. Valette, environ soixante-dix, s’est battu dans la brèche et a refusé d’abandonner les villes pour Fort St Angelo. Le 7 septembre García de Toledo, vice-roi de Sicile, a débarqué environ 8 000 hommes dans le nord de l’île. Environ un tiers des chevaliers et du peuple de Malte étaient morts ; les Ottomans avaient perdu peut-être 25 000 ou plus. En mars 1566, Valette posa la première pierre d’une nouvelle ville fortifiée sur le mont Sciberras, Valletta."
