"Fort St Elmo": "Fort St Elmo"
"18 May – 23 June 1565": "18 mai – 23 juin 1565"
"The Knights of St John, driven from Rhodes by the Ottomans in 1522, had held Malta since 1530, and their galleys preyed on Muslim shipping. In 1565 Sultan Suleiman sent a fleet of about 200 ships under Piyale Pasha with an army under Mustafa Pasha, perhaps 30,000 or more fighting men. Grand Master Jean de Valette had about 500 knights and some 6,000 soldiers, Maltese militia, Spanish and Italian troops, behind the walls of Birgu and Senglea, two promontories on the Grand Harbour, with Fort St Elmo guarding its mouth.": "Les Chevaliers de Saint-Jean, chassés de Rhodes par les Ottomans en 1522, détenaient Malte depuis 1530, et leurs galères s’attaquaient à la navigation musulmane. En 1565 Sultan Suleiman envoya une flotte d’environ 200 navires sous Piyale Pasha avec une armée sous Mustafa Pasha, peut-être 30 000 hommes ou plus. Le Grand Maître Jean de Valette compte environ 500 chevaliers et quelque 6 000 soldats, des milices maltaises, des troupes espagnoles et italiennes, derrière les murs de Birgu et Senglea, deux promontoires sur le Grand Port, avec le fort St Elmo qui garde son embouchure."
"The fleet anchored at Marsaxlokk, and the Ottomans chose to take St Elmo first, to open Marsamxett harbour to their ships. From late May guns on Mount Sciberras pounded the small fort to rubble, but Valette ferried in fresh men each night. The corsair Turgut Reis (Dragut) was mortally wounded by a cannon shot. St Elmo fell on 23 June; almost all of its more than 1,500 defenders were killed, and the Ottomans had lost perhaps 6,000 men. Mustafa is said to have floated the bodies of knights across the harbour, and Valette to have answered by firing the heads of Turkish prisoners from his guns.": "La flotte a ancré à Marsaxlokk, et les Ottomans ont choisi de prendre St Elmo d’abord, pour ouvrir le port Marsamxett à leurs navires. De fin mai, des canons sur le mont Sciberras ont pillé le petit fort aux décombres, mais Valette ferrie en hommes frais chaque nuit. Le corsair Turgut Reis (Dragut) a été mortellement blessé par un coup de canon. St Elmo est tombé le 23 juin ; presque tous ses plus de 1 500 défenseurs ont été tués, et les Ottomans avaient perdu peut-être 6 000 hommes. Mustafa aurait flotté les corps de chevaliers à travers le port, et Valette aurait répondu en tirant les têtes des prisonniers turcs de ses armes."
