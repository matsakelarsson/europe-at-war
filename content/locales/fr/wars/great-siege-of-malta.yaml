"The Ottoman fleet anchored in this bay in the south-east of the island. The army set up its main camp at Marsa, at the head of the Grand Harbour.": "La flotte ottomane a ancré dans cette baie au sud-est de l’île. L’armée a mis en place son camp principal à Marsa, à la tête du Grand Port."
"The star-shaped fort at the tip of Mount Sciberras held for a month against continuous bombardment and repeated assaults. Nine knights were taken alive by corsairs.": "Le fort en forme d’étoile à la pointe du mont Sciberras a tenu pendant un mois contre le bombardement continu et les assauts répétés. Neuf chevaliers ont été pris vivants par des corsaires."
