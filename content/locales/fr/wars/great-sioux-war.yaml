# French translations of the catalogue text (wave 14); step bodies follow later.
Great Sioux War of 1876: Grande Guerre sioux de 1876
? The war of 1876–1877 in which the United States took the Black Hills from the Lakota and forced the free bands of the Lakota and Northern Cheyenne onto reservations. The Treaty of Fort Laramie of 1868 had given the Lakota the Great Sioux Reservation, including the Black Hills (Paha Sapa), which are sacred to them, and left the Powder River country beyond it as unceded Indian territory. After George Armstrong Custer’s expedition of 1874 found gold in the Black Hills, thousands of miners poured in, the Lakota refused to sell, and President Grant’s government ordered all Lakota to come in to the agencies by 31 January 1876 and turned those who did not over to the army. Bands following Sitting Bull and Crazy Horse, joined by many from the agencies, gathered in the largest camp the northern plains had known. Three army columns converged on them; the Lakota and Cheyenne fought George Crook’s column to a standstill on the Rosebud on 17 June 1876, and on 25 June at the Little Bighorn they destroyed Custer and five companies of the 7th Cavalry, killing 268 soldiers, scouts and civilians in all. The army, heavily reinforced, then campaigned through the winter, destroying villages and food at Slim Buttes, the Red Fork of the Powder River and elsewhere, while Congress cut off the agencies’ rations until the Lakota gave up the Black Hills, which it annexed on 28 February 1877. Crazy Horse surrendered in May 1877 and was killed at Camp Robinson in September; Sitting Bull led his people to Canada and surrendered in 1881. In 1980 the Supreme Court ruled that the Black Hills had been taken illegally; the Lakota have refused the compensation and ask for the land.
: La guerre de 1876–1877 par laquelle les États-Unis prirent les Black Hills aux Lakotas et contraignirent les bandes libres des Lakotas et des Cheyennes du Nord à entrer dans les réserves. Le traité de Fort Laramie de 1868 avait donné aux Lakotas la Grande Réserve sioux, y compris les Black Hills (Paha Sapa), qui sont sacrées pour eux, et laissé au-delà la région de la Powder River comme territoire indien non cédé. Après que l’expédition de George Armstrong Custer eut découvert de l’or dans les Black Hills en 1874, des milliers de mineurs y affluèrent, les Lakotas refusèrent de vendre, et le gouvernement du président Grant ordonna à tous les Lakotas de se présenter aux agences avant le 31 janvier 1876, puis livra à l’armée ceux qui ne l’avaient pas fait. Les bandes qui suivaient Sitting Bull et Crazy Horse, rejointes par de nombreux Lakotas venus des agences, se rassemblèrent dans le plus grand campement que les plaines du Nord aient jamais connu. Trois colonnes de l’armée convergèrent vers eux ; les Lakotas et les Cheyennes tinrent en échec la colonne de George Crook sur la Rosebud le 17 juin 1876 et, le 25 juin, à Little Bighorn, ils anéantirent Custer et cinq compagnies du 7e de cavalerie, tuant en tout 268 soldats, éclaireurs et civils. L’armée, fortement renforcée, fit alors campagne tout l’hiver, détruisant villages et vivres à Slim Buttes, sur la Red Fork de la Powder River et ailleurs, tandis que le Congrès suspendait les rations des agences jusqu’à ce que les Lakotas cèdent les Black Hills, qu’il annexa le 28 février 1877. Crazy Horse se rendit en mai 1877 et fut tué à Camp Robinson en septembre ; Sitting Bull conduisit son peuple au Canada et se rendit en 1881. En 1980, la Cour suprême jugea que les Black Hills avaient été prises illégalement ; les Lakotas ont refusé l’indemnisation et réclament la terre elle-même.
