# Some French text was translated automatically.
"Great Slav Rising": "Grande montée des Slaves"
"A rising of the pagan Polabian Slavs between the Elbe and the Oder, led by the Lutici and joined by the Obotrites, against the German rule and Christian mission imposed on them by Henry I and Otto I. In 983, while Otto II was in Italy after his defeat at Stilo, they destroyed the bishops’ seats of Havelberg and Brandenburg and sacked Hamburg; the Northern March and the Billung March were lost, and German expansion east of the Elbe stopped for more than 150 years.": "Une montée des Slaves Polabiens païens entre l’Elbe et l’Oder, conduit par les Lutici et rejoint par les Obotrites, contre la domination allemande et la mission chrétienne qui leur est imposée par Henry Ier et Otto Ier. En 983, alors qu’Otto II était en Italie après sa défaite à Stilo, ils détruisirent les sièges des évêques de Havelberg et Brandebourg et larguèrent Hambourg ; la Marche du Nord et la Marche de Billung furent perdues, et l’expansion allemande à l’est de l’Elbe s’arrêta pendant plus de 150 ans."
"Also called the Slavic revolt of 983. The main source is the chronicle of Thietmar of Merseburg, written a generation later. Havelberg was taken on 29 June 983 and Brandenburg three days later.": "Aussi appelée la révolte slave de 983. La principale source est la chronique de Thietmar de Merseburg, écrite une génération plus tard. Havelberg a été prise le 29 juin 983 et Brandebourg trois jours plus tard."
"Saxon campaigns in the following years, some of them with the Polish dukes Mieszko I and Bolesław I, failed to win the land back; the bishoprics of Havelberg and Brandenburg existed only in name until the 12th century.": "Les campagnes saxonnes dans les années suivantes, dont certaines avec les ducs polonais Mieszko I et Bolesław I, n’ont pas réussi à récupérer la terre ; les évêchés de Havelberg et Brandebourg n’existaient que par nom jusqu’au XIIème siècle."
