"October 1480 – January 1481": "octobre 1480 – janvier 1481"
"For a month the two armies watched each other across the river while envoys came and went. Ivan made peace with his brothers, whose troops came to join him, and sent the exiled Crimean prince Nur Devlet and Prince Vasily Nozdrovaty down the Volga to raid the Horde’s lands behind Akhmat. Archbishop Vassian of Rostov urged Ivan in a famous letter to stand firm. As the river began to freeze and could no longer stop cavalry, Ivan pulled his troops back on 26 October to Kremenets and then to Borovsk, where they could cover Moscow and strike wherever the Tatars crossed.": "Ivan fit la paix avec ses frères, dont les troupes vinrent le rejoindre, et envoya le prince de Crimée exilé Nur Devlet et le prince Vassili Nozdrovaty dans la Volga pour attaquer les terres de Horde, derrière Akhmat. Mgr Vassian de Rostov pressa Ivan dans une célèbre lettre de se tenir ferme. Alors que la rivière commençait à geler et ne pouvait plus arrêter la cavalerie, Ivan retira ses troupes le 26 octobre à Kremenets puis à Borovsk, où elles pouvaient couvrir Moscou et frapper partout où les Tatars traversaient."
"Akhmat did not follow. With winter coming, his horses short of fodder and no sign of Casimir, he began to withdraw on 8 November, plundering a dozen Lithuanian towns, among them Mtsensk, on his way. Ivan returned to Moscow on 28 November. On 6 January 1481 Akhmat was killed in the steppe by Ibak, khan of Tyumen, and the Nogais. No khan again claimed a say over who ruled in Moscow, and Russian historians have long dated the end of the “Tatar yoke” to the Ugra, though some modern historians think the standoff itself changed little.": "Akhmat n’a pas suivi. L’hiver venant, ses chevaux à court de fourrage et aucun signe de Casimir, il a commencé à se retirer le 8 Novembre, pillant une douzaine de villes lituaniennes, parmi lesquelles Mtsensk, en route. Ivan est retourné à Moscou le 28 Novembre. Le 6 Janvier 1481 Akhmat a été tué dans la steppe par Ibak, khan de Tyumen, et les Nogais. Aucun khan n’a de nouveau revendiqué un mot sur qui régnait à Moscou, et les historiens russes datent depuis longtemps la fin du joug tatar à l’Ugra, bien que certains historiens modernes pensent que l’opposition elle-même a peu changé."
