"June – October 1480": "juin – octobre 1480"
"Ivan III of Moscow had stopped paying tribute to the Horde in the 1470s and allied with the Crimean khan, Mengli Giray. Khan Akhmat of the Great Horde allied in turn with Casimir IV of Poland and Lithuania, and in 1480, while Ivan was quarrelling with two of his brothers, he led north what may have been the largest Tatar army of the century. Ivan held the line of the Oka, the river that had long been Moscow’s southern frontier, with his son Ivan the Young at Serpukhov and himself at Kolomna.": "Ivan III de Moscou avait cessé de rendre hommage à la Horde dans les années 1470 et allié avec le Khan de Crimée, Mengli Giray. Khan Akhmat de la Grande Horde allié à son tour avec Casimir IV de Pologne et de Lituanie, et en 1480, tandis qu’Ivan se disputait avec deux de ses frères, il menait au nord ce qui aurait été la plus grande armée tatare du siècle. Ivan tenait la ligne de l’Oka, le fleuve qui avait longtemps été Moscou à la frontière sud, avec son fils Ivan le Jeune à Serpukhov et lui-même à Kolomna."
"Akhmat did not try the Oka but moved west between the upper Don and the Oka, towards the mouth of the Ugra near Kaluga, hoping to meet Casimir’s army. Casimir never came; he was tied down by a Crimean raid on Podolia and unrest at home. Ivan sent his treasury and family north to Beloozero and set up his headquarters at Kremenets, behind the Ugra. On 8 October the Tatars tried to force a crossing near the river’s mouth. For four days they were driven back by Russian guns and arrows, and a later attempt to cross upstream at Opakov was also blocked.": "Akhmat n’a pas essayé l’Oka mais s’est déplacé vers l’ouest entre le Don supérieur et l’Oka, vers l’embouchure de l’Ugra près de Kaluga, espérant rencontrer l’armée de Casimir. Casimir n’est jamais venu ; il a été lié par un raid de Crimée sur Podolia et des troubles à la maison. Ivan a envoyé son trésor et sa famille au nord à Beloozero et a installé son quartier général à Kremenets, derrière l’Ugra. Le 8 octobre, les Tatars essayèrent de forcer un passage près de l’embouchure du fleuve. Pendant quatre jours, ils furent repoussés par des canons et des flèches russes, et une tentative ultérieure de traverser en amont à Opakov fut également bloquée."
