# Some French text was translated automatically.
"Great Stand on the Ugra": "Grand Stand sur l’Ugra"
"A standoff in the autumn of 1480 between Ivan III of Moscow and Khan Akhmat of the Great Horde, who had marched north to restore the Horde’s overlordship. After failing to cross the Ugra river, Akhmat waited in vain for his Lithuanian allies and withdrew in November; the event is traditionally seen as the end of Mongol rule over Russia.": "En automne 1480, entre Ivan III de Moscou et Khan Akhmat de la Grande Horde, qui avait marché vers le nord pour restaurer la domination de Horde. Après avoir échoué à traverser l’Ugra, Akhmat a attendu en vain ses alliés lituaniens et s’est retiré en novembre ; l’événement est traditionnellement considéré comme la fin du règne mongol sur la Russie."
"Dates are Julian (Old Style). The Russian sources disagree on many details, and the size of both armies is unknown.": "Les sources russes ne sont pas d’accord sur de nombreux détails, et la taille des deux armées est inconnue."
"The Great Horde was the core of the old Golden Horde on the lower Volga, after the Kazan, Crimean and other khanates had broken away. Moscow was allied with the Crimean khan Mengli Giray, and Akhmat with King Casimir IV of Poland and Lithuania, whose lands then began just west of the Ugra.": "La Grande Horde était le noyau de la vieille Horde d’or sur la basse Volga, après que les Kazan, Crimée et autres khanates se soient brisés. Moscou était allié avec la Crimée khan Mengli Giray, et Akhmat avec le roi Casimir IV de Pologne et de Lituanie, dont les terres ont alors commencé juste à l’ouest de l’Ugra."
