"After Vienna, the imperial army under Charles of Lorraine moved down the Danube. Esztergom was taken in October 1683, and in 1684 Lorraine besieged Buda for more than three months, but disease and the autumn rains forced him to give up. In August 1685 he beat an Ottoman army near Esztergom and stormed Érsekújvár, the great fortress north of the Danube, killing most of its garrison. That autumn the Ottomans, blaming him for their defeats, arrested Imre Thököly, and many of his Hungarian kuruc rebels made terms with the emperor.": "Après Vienne, l’armée impériale sous Charles de Lorraine a déménagé sur le Danube. Esztergom a été pris en octobre 1683, et en 1684 Lorraine a assiégé Buda pendant plus de trois mois, mais la maladie et les pluies d’automne l’ont forcé à abandonner. En août 1685, il bat une armée ottomane près d’Esztergom et s’empare d’Érsekújvár, la grande forteresse au nord du Danube, tuant la majeure partie de sa garnison."
"On 18 June 1686 the siege of Buda began again, with an army of perhaps 65,000–75,000 under Lorraine and Maximilian II Emanuel of Bavaria, joined by volunteers from across Europe. The garrison under the veteran governor Abdurrahman Abdi Pasha held out for eleven weeks, and a relief army under the grand vizier could not break through. The city was stormed on 2 September; Abdurrahman died fighting. The soldiers sacked it for days, killing over 3,000 Muslims and about half of its Jewish community. Szeged, Pécs and other towns fell that autumn.": "Le 18 juin 1686, le siège de Buda recommença, avec une armée d’environ 65 000 à 75 000 sous Lorraine et Maximilien II Emanuel de Bavière, rejointe par des volontaires de toute l’Europe. La garnison sous le gouverneur vétéran Abdurrahman Abdi Pacha se déroula pendant onze semaines, et une armée de secours sous le grand vizir ne put pas percer. Les soldats l’ont largué pendant des jours, tuant plus de 3 000 musulmans et environ la moitié de sa communauté juive. Szeged, Pécs et d’autres villes sont tombés cet automne."
