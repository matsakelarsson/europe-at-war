"In the summer of 1687 Charles of Lorraine, with about 40,000 men, and the Elector of Bavaria, with about 20,000, advanced on Osijek, where the grand vizier Sarı Süleyman Pasha had entrenched some 60,000 men to guard the long wooden bridge across the Drava marshes. Lorraine turned away north, and on 12 August, near Mount Harsány, not far from the battlefield of 1526, the Ottomans attacked his marching columns. The imperial wings held and counter-attacked, and the Ottoman army broke, losing perhaps 10,000 dead and most of its guns. It then mutinied; the grand vizier fled, and on 8 November Sultan Mehmed IV was deposed in favour of his brother Suleiman II.": "Au cours de l’été 1687, Charles de Lorraine, avec environ 40 000 hommes, et l’Électeur de Bavière, avec environ 20 000, ont avancé sur Osijek, où le grand vizier Sarı Süleyman Pasha avait retranché quelque 60 000 hommes pour garder le long pont en bois à travers les marais de Drava. Lorraine se détourna vers le nord, et le 12 août, près du mont Harsány, non loin du champ de bataille de 1526, les Ottomans attaquèrent ses colonnes de marche. Les ailes impériales tenaient et contre-attaquaient, et l’armée ottomane rompit, perdant peut-être 10 000 morts et la plupart de ses canons."
"Imperial troops took Osijek and most of Slavonia that autumn, and Eger surrendered in December after a long blockade. Lorraine marched into Transylvania, and Prince Michael I Apafi had to accept imperial garrisons in his towns. At Eperjes the imperial general Antonio Caraffa set up a court that tortured and executed more than twenty Hungarian nobles and burghers suspected of backing Thököly. In the autumn the Hungarian diet at Pozsony accepted the Habsburgs as hereditary kings and gave up the nobles’ old right to resist an unlawful ruler, and Archduke Joseph was crowned on 9 December.": "Les troupes impériales ont pris Osijek et la plupart de Slavonie cet automne, et Eger s’est rendu en décembre après un long blocus. Lorraine a marché en Transylvanie, et le prince Michael I Apafi a dû accepter des garnisons impériales dans ses villes. À Eperjes le général impérial Antonio Caraffa a mis en place une cour qui a torturé et exécuté plus de vingt nobles et burghers hongrois soupçonnés de soutenir Thököly. À l’automne, le régime hongrois à Pozsony accepta les Habsbourg comme rois héréditaires et abandonna le droit des nobles de résister à un souverain illégal, et l’archiduc Joseph fut couronné le 9 décembre."
"Battle of Mohács (Harsány)": "Bataille de Mohács (Harsány)"
"12 August 1687, imperial victory": "12 août 1687, victoire impériale"
"Mehmed IV deposed": "Mehmed IV déposé"
"8 November 1687": "8 novembre 1687"
"Hereditary Habsburg kingship": "La royauté des Habsbourg"
"accepted at Pozsony; Joseph I crowned 9 December 1687": "accepté à Pozsony ; Joseph Ier couronné le 9 décembre 1687"
"Battle of Mohács": "Bataille de Mohács"
"12 August 1687": "12 août 1687"
"The Ottoman attack on Lorraine’s army at the foot of Mount Harsány ended in a rout. It is also called the battle of Harsány.": "L’attaque ottomane contre l’armée lorraine au pied du mont Harsány s’est terminée par une rout. Il est également appelé la bataille de Harsány."
"Osijek": "Osijek"
"September 1687": "septembre 1687"
"The Ottomans abandoned the Drava crossing, and Slavonia fell to imperial and Croatian troops.": "Les Ottomans abandonnèrent la traversée de Drava, et la Slavonie tomba aux mains des troupes impériales et croates."
"Eger": "Eger"
"December 1687": "décembre 1687"
"Starved out after a long blockade, the fortress surrendered after 91 years of Ottoman rule.": "La forteresse, affamée après un long blocus, se rendit après 91 ans de domination ottomane."
"Blaj": "BLANJ"
"27 October 1687": "27 octobre 1687"
"Under an agreement made here, Transylvania took in imperial garrisons and paid for their upkeep.": "En vertu d’un accord conclu ici, Transylvanie prit des garnisons impériales et paya pour leur entretien."
"Eperjes": "Eperjes"
"March–September 1687": "mars–septembre 1687"
"Caraffa’s tribunal, remembered in Hungary as the “slaughterhouse of Eperjes”, had suspected Thököly supporters tortured and beheaded.": "Le tribunal de Caraffa, dont on se souvient en Hongrie comme étant le \"restaurant\" d’Eperjes, avait soupçonné les partisans de Thököly de torturer et décapiter."
"Pozsony": "Pozsony"
"October–December 1687": "octobre–décembre 1687"
"The diet made the Hungarian crown hereditary in the House of Habsburg.": "Le régime a fait la couronne hongroise héréditaire dans la maison de Habsbourg."
"Elector of Bavaria": "Électeur de Bavière"
"Lorraine to Transylvania": "Lorraine à Transylvanie"
"Taken by the Habsburgs in 1687": "Prise par les Habsbourg en 1687"
"Imperial garrisons in Transylvania from 1687": "garnisons impériales en Transylvanie à partir de 1687"
"Belgrade, Kosovo and the Great Migration": "Belgrade, le Kosovo et la Grande Migration"
"1688–1690": "1688–1690"
"In 1688 the Elector of Bavaria crossed the Sava and took Belgrade by storm on 6 September. Weeks later Louis XIV invaded the Rhineland, and many imperial troops were sent west. Even so, in 1689 Louis William of Baden beat the Ottomans at Batočina and at Niš on 24 September and took Vidin. General Enea Silvio Piccolomini pushed on into Kosovo and Macedonia with a small force, joined by Serbian and Albanian volunteers and by the rising of the outlaw Karposh around Kumanovo. In late October Piccolomini burned Skopje, reportedly for fear of plague, and in November he died of plague at Prizren.": "En 1688, l’électeur de Bavière traversa la Save et prit Belgrade par la tempête le 6 septembre. Des semaines plus tard, Louis XIV envahit la Rhénanie, et de nombreuses troupes impériales furent envoyées à l’ouest. Le général Enea Silvio Piccolomini a poussé vers le Kosovo et la Macédoine avec une petite force, rejoint par des volontaires serbes et albanais et par l’élévation de la loi Karposh autour de Kumanovo. Fin octobre Piccolomini a brûlé Skopje, apparemment par crainte de peste, et en novembre il est mort de peste à Prizren."
"The new grand vizier, Fazıl Mustafa Pasha, struck back. On 2 January 1690 an Ottoman and Tatar army destroyed the imperial and Serbian force at Kačanik, and Christian villages suffered harsh reprisals. In 1690 the Ottomans retook Niš and, on 8 October, Belgrade, after its powder magazine exploded. Thousands of Serbs, with some Albanians, fled north with Patriarch Arsenije III of Peć and settled in Habsburg Hungary, where Leopold I granted them church autonomy. Arsenije wrote of more than 30,000 people; Serbian tradition speaks of 37,000 families. How far this Great Migration changed the population of Kosovo is still debated by Serbian and Albanian historians.": "Le 2 janvier 1690, une armée ottomane et tatare détruisit les forces impériales et serbes à Kačanik, et des villages chrétiens subirent de lourdes représailles. En 1690, les Ottomans reprirent Niš et, le 8 octobre, Belgrade, après l’explosion de sa poudrière. Des milliers de Serbes, avec quelques Albanais, ont fui vers le nord avec le Patriarche Arsenije III de Peć et se sont installés à Habsbourg Hongrie, où Léopold I leur a accordé l’autonomie religieuse. Arsenije a écrit sur plus de 30 000 personnes ; la tradition serbe parle de 37 000 familles."
"Belgrade taken": "Belgrade prise"
"6 September 1688": "6 septembre 1688"
"Battle of Kačanik": "Bataille de Kačanik"
"2 January 1690, Ottoman victory": "2 janvier 1690, victoire ottomane"
"Belgrade retaken by the Ottomans": "Belgrade repris par les Ottomans"
"8 October 1690": "8 octobre 1690"
"Belgrade": "Belgrade"
"1688 and 1690": "1688 et 1690"
"Stormed by the Elector of Bavaria on 6 September 1688 after a month’s siege, and retaken by the Ottomans on 8 October 1690 after a shell blew up its main powder magazine.": "Tempête par l’électeur de Bavière le 6 septembre 1688 après un mois de siège, et reprise par les Ottomans le 8 octobre 1690 après qu’un obus ait explosé son principal magazine en poudre."
"Battle of Niš": "Bataille de Niš"
"24 September 1689": "24 septembre 1689"
"Louis William of Baden defeated the Ottoman army and took the city, a month after his victory at Batočina.": "Louis William de Baden battit l’armée ottomane et prit la ville, un mois après sa victoire à Batocina."
"Skopje": "M. Skopje"
"October 1689": "octobre 1689"
"Piccolomini’s troops set fire to the city, reportedly to stop the plague that had broken out there.": "Les troupes de Piccolomini ont mis le feu à la ville, pour arrêter la peste qui avait éclaté là-bas."
"Prizren": "Prizren"
"November 1689": "novembre 1689"
"Piccolomini died of plague here, and the Habsburg advance lost its leader.": "Piccolomini est mort de peste ici, et l’avance des Habsbourg a perdu son chef."
"2 January 1690": "2 janvier 1690"
"Ottoman troops and Crimean Tatars destroyed the imperial and Serbian force guarding the pass.": "Les troupes ottomanes et les Tatars de Crimée ont détruit la force impériale et serbe qui gardait le col."
"Peć": "Pays"
"1689–1690": "1689–1690"
"Seat of the Serbian patriarch, Arsenije III, who sided with the Habsburgs and led the refugees north.": "Siège du patriarche serbe, Arsenije III, qui s’est associé aux Habsbourg et a conduit les réfugiés au nord."
"Louis of Baden, 1689": "Louis de Baden, 1689"
"Piccolomini": "Piccolomini"
"Fazıl Mustafa Pasha, 1690": "Fazıl Mustafa Pasha, 1690"
"Great Migration, 1690": "Grande migration, 1690"
"Held by the Habsburgs, 1688–1690 (approximate)": "Tenue par les Habsbourg, 1688-1690 (approximative)"
"Slankamen and the stalemate": "Slankamen et l’impasse"
"1690–1696": "1690–1696"
"The Ottoman recovery went on. On 21 August 1690 Thököly, with Ottoman and Tatar troops, defeated an imperial force at Zărnești and was proclaimed prince of Transylvania, though Louis William of Baden drove him out within weeks. In 1691 Fazıl Mustafa Pasha led about 50,000 men up the Danube to win back Hungary. On 19 August Louis of Baden, with about 33,000, attacked him at Slankamen, where the Tisza joins the Danube. It was one of the bloodiest battles of the century; late in the day the grand vizier was killed by a bullet, and his army broke, leaving its guns and treasury behind.": "Le 21 août 1690, Thököly, avec les troupes ottomanes et tatares, battit une force impériale à Zărnești et fut proclamé prince de Transylvanie, bien que Louis William de Baden l’expulse en quelques semaines. En 1691, Fazıl Mustafa Pasha conduisit environ 50 000 hommes dans le Danube pour reconquérir la Hongrie. Le 19 août, Louis de Baden, avec environ 33 000 personnes, l’attaque à Slankamen, où la Tisza rejoint le Danube. C’était l’une des batailles les plus sanglantes du siècle ; tard dans le jour où le grand vizier a été tué par une balle, et son armée s’est cassée, laissant ses armes et son trésor derrière."
"Leopold I’s Diploma Leopoldinum, published in December 1691, made Transylvania a Habsburg land with its own estates and laws. Nagyvárad fell after a long blockade in 1692 and Gyula in 1695. But the main imperial armies were fighting France in the Nine Years’ War, and the war in the south stalled. From 1695 Sultan Mustafa II led his army in person, and on 21 September 1695 he defeated an imperial corps near Lugos in the Banat, where its general, Federico Veterani, was mortally wounded.": "Leopold I.S. Diploma Leopoldinum, publié en décembre 1691, fait de la Transylvanie une terre de Habsbourg avec ses propres biens et lois. Nagyvárad tombe après un long blocus en 1692 et Gyula en 1695. Mais les principales armées impériales combattaient la France dans la guerre de neuf ans, et la guerre dans le sud s’arrêtait. À partir de 1695, le Sultan Mustafa II dirigea son armée en personne et, le 21 septembre 1695, il battit un corps impérial près de Lugos dans le Banat, où son général Federico Veterani fut mortellement blessé."
"Battle of Slankamen": "Bataille de Slankamen"
"19 August 1691, imperial victory": "19 août 1691, victoire impériale"
"Armies at Slankamen": "Armées à Slankamen"
"about 33,000 imperial troops, about 50,000 Ottomans": "environ 33 000 troupes impériales, environ 50 000 Ottomans"
"Battle of Lugos": "Bataille de Lugos"
"21 September 1695, Ottoman victory": "21 septembre 1695, victoire ottomane"
"Battle of Zărnești": "Bataille de Zărnești"
"21 August 1690": "21 août 1690"
"Thököly and his Ottoman and Tatar allies broke into Transylvania through the mountains and beat its imperial defenders.": "Thököly et ses alliés ottomans et tatars se sont introduits en Transylvanie à travers les montagnes et ont battu ses défenseurs impériaux."
"19 August 1691": "19 août 1691"
"The death of the grand vizier, Fazıl Mustafa Pasha, turned a hard-fought battle into an Ottoman rout.": "La mort du grand vizir, Fazıl Mustafa Pacha, a transformé une bataille acharnée en un rout ottoman."
"Nagyvárad": "Nagyvárad"
"June 1692": "juin 1692"
"The fortress, Ottoman since 1660, surrendered after a long blockade.": "La forteresse, ottomane depuis 1660, s’est rendue après un long blocus."
"Gyula": "Gyula"
"One of the last Ottoman strongholds north of the Maros, starved into surrender.": "Une des dernières forteresses ottomanes au nord du Maros, affamée de capitulation."
"21 September 1695": "21 septembre 1695"
"Mustafa II’s army overwhelmed Veterani’s outnumbered corps, which was trying to join the main imperial army.": "L’armée de Mustafa II a dépassé les corps de Veterani, qui essayaient de rejoindre la principale armée impériale."
"Fazıl Mustafa Pasha, 1691": "Fazıl Mustafa Pasha, 1691"
"Louis of Baden": "Louis de Baden"
"Peter the Great takes Azov": "Pierre le Grand prend Azov"
"1695–1700": "1695–1700"
"In 1695 the young Peter I turned instead against Azov, the Ottoman fortress at the mouth of the Don. About 31,000 men under Franz Lefort, Patrick Gordon and Avtonom Golovin besieged it from midsummer, with Peter himself serving as a bombardier. They could not stop supplies coming in by river, two assaults failed, and the siege was lifted in October. A larger army under Boris Sheremetev, with Mazepa’s Cossacks, took the Ottoman forts on the lower Dnieper, among them Gazi-Kerman, whose powder magazine blew up.": "En 1695, le jeune Pierre je me tournai plutôt contre Azov, la forteresse ottomane à l’embouchure du Don. Environ 31 000 hommes sous Franz Lefort, Patrick Gordon et Avtonom Golovin l’assiégèrent depuis le milieu de l’été, avec Peter lui-même servant de bombardier. Ils ne purent arrêter les ravitaillements entrant par rivière, deux assauts échouèrent, et le siège fut levé en octobre. Une armée plus grande sous Boris Sheremetev, avec les cosaques de Mazepa, a pris les forts ottomans sur le Dniepr inférieur, parmi lesquels Gazi-Kerman, dont la poudrière a explosé."
"Over the winter Peter had galleys, fire ships and two ships of the line built at Voronezh. In May 1696 about 75,000 men under Aleksei Shein came down the Don, and the new fleet under Lefort closed the river mouth and drove off an Ottoman relief squadron. After a heavy bombardment and a Cossack attack on the outer rampart, the garrison surrendered on 29 July. It was the first great Russian victory over the Ottomans, and it showed Peter what a fleet could do.": "En mai 1696, environ 75 000 hommes sous Aleksei Shein descendirent le Don, et la nouvelle flotte sous Lefort ferma l’embouchure de la rivière et déchaîna un escadron de secours ottoman. Après un bombardement lourd et une attaque du cosaque sur le rempart extérieur, la garnison se rendit le 29 juillet. C’était la première grande victoire russe sur les Ottomans, et cela montrait à Pierre ce qu’une flotte pouvait faire."
"Peter chose Taganrog, along the coast, for a naval base. When his allies made peace with the Ottomans at Karlowitz in 1699, Russia agreed only a truce. But in the Treaty of Constantinople of 14 July 1700 the sultan recognised Russian rule over Azov and Taganrog. The Dnieper forts, razed by the Russians, went back to the Ottomans, and Russia no longer had to pay a yearly tribute to the Crimean khan.": "Lorsque ses alliés ont fait la paix avec les Ottomans à Karlowitz en 1699, la Russie n’a convenu qu’une trêve. Mais dans le traité de Constantinople du 14 juillet 1700, le sultan a reconnu la domination russe sur Azov et Taganrog. Les forts du Dniepr, rasés par les Russes, retournèrent aux Ottomans, et la Russie n’avait plus à rendre un hommage annuel au khan de Crimée."
"Azov surrendered": "Azov s’est rendu"
"29 July 1696 (19 July Old Style)": "29 juillet 1696 (19 juillet Old Style)"
"Peter’s fleet in 1696": "La flotte de Peters en 1696"
"2 ships of the line, 23 galleys, 4 fire ships and smaller craft": "2 bateaux de la ligne, 23 cuisines, 4 pompiers et des menues embarcations"
"Treaty of Constantinople": "Traité de Constantinople"
"14 July 1700, a thirty-year truce": "14 juillet 1700, une trêve de trente ans"
"Voronezh": "Voronezh"
"Winter 1695–1696": "Hiver 1695–1696"
"Peter’s first fleet was built at shipyards here and floated down the Don in the spring.": "La première flotte de Peter a été construite dans les chantiers navals et a flotté sur le Don au printemps."
"Azov": "Azov"
"1695–1696": "1695–1696"
"The first siege failed in 1695. In 1696 the fleet cut the fortress off from the sea, and the garrison surrendered on 29 July.": "Le premier siège échoua en 1695. En 1696, la flotte coupa la forteresse de la mer et la garnison se rendit le 29 juillet."
"Taganrog": "Taganrog"
"1696–1698": "1696–1698"
"Chosen by Peter as a harbour for his fleet in 1696 and founded in 1698. The Ottomans recognised it as Russian in 1700.": "Choisi par Pierre comme port pour sa flotte en 1696 et fondé en 1698. Les Ottomans l’ont reconnu russe en 1700."
"Gazi-Kerman": "Gazi-Kerman"
"The main Ottoman fort on the lower Dnieper fell to Sheremetev and Mazepa when its powder magazine blew up. It was given back, razed, in 1700.": "Le fort ottoman principal du Dniepr inférieur est tombé à Sheremetev et Mazepa quand son magazine de poudre a explosé. Il a été rendu, rasé, en 1700."
"Shein and Peter, 1696": "Shein et Peter, 1696"
"Sheremetev and Mazepa, 1695": "Sheremetev et Mazepa, 1695"
"Zenta": "Zenta"
"In 1697 Mustafa II marched again from Belgrade, crossed the Danube, took Titel and turned up the Tisza towards Transylvania. Prince Eugene of Savoy, newly given command in Hungary at the age of 34, followed from Petrovaradin with about 50,000 men. On the afternoon of 11 September his cavalry found the Ottoman army crossing the Tisza at Zenta on a bridge of boats, with the sultan and part of the army already on the eastern bank and the rest behind earthworks on the western one.": "En 1697 Mustafa II marcha de nouveau de Belgrade, traversa le Danube, prit Titel et retourna la Tisza vers la Transylvanie. Le prince Eugène de Savoie, nouvellement commandé en Hongrie à l’âge de 34 ans, suivit de Petrovaradin avec environ 50 000 hommes. Dans l’après-midi du 11 septembre, sa cavalerie trouva l’armée ottomane traversant la Tisza à Zenta sur un pont de bateaux, avec le sultan et une partie de l’armée déjà sur la rive est et le reste derrière les travaux terrestres sur l’ouest."
"With only a few hours of daylight left, Eugene attacked at once. His wings worked round the earthworks to the river and cut the defenders off from the bridge, which broke under the fleeing crowd. Estimates of the Ottoman dead run from about 20,000 to 30,000, many of them drowned, among them the grand vizier Elmas Mehmed Pasha; the imperial army reported fewer than 500 casualties. Eugene took the army’s treasury and the sultan’s seal. In October he raided Bosnia with 6,000 horsemen, and after his envoys were killed he let his troops plunder and burn Sarajevo.": "Avec seulement quelques heures de lumière du jour, Eugène attaqua à la fois. Ses ailes travaillèrent autour des travaux terrestres jusqu’à la rivière et coupèrent les défenseurs du pont, qui rompit sous la foule fuyante. Les estimations des morts ottomans courent d’environ 20 000 à 30 000, beaucoup d’entre eux noient, parmi eux le grand vizier Elmas Mehmed Pasha ; l’armée impériale rapporte moins de 500 pertes. En octobre, il fit une descente en Bosnie avec 6 000 cavaliers et, après la mort de ses envoyés, il laissa ses troupes piller et brûler Sarajevo."
"Battle of Zenta": "Bataille de Zenta"
"11 September 1697, imperial victory": "11 septembre 1697, victoire impériale"
"Ottoman dead": "Mort ottoman"
"about 20,000–30,000, many drowned": "environ 20 000 à 30 000, beaucoup se sont noyés"
"Sarajevo burned": "Sarajevo brûlée"
"22–23 October 1697": "22–23 octobre 1697"
"Petrovaradin": "Pétrovaradin"
"August 1697": "août 1697"
"Eugene gathered his army at this Danube fortress before following the sultan up the Tisza.": "Eugène rassembla son armée à cette forteresse du Danube avant de suivre le sultan jusqu’à la Tisza."
"Titel": "Titel"
"The sultan’s army took this small fortress where the Tisza meets the Danube.": "L’armée du sultan a pris cette petite forteresse où la Tisza rencontre le Danube."
"11 September 1697": "11 septembre 1697"
"Caught astride the Tisza, the Ottoman army was destroyed in a few hours while the sultan watched from the far bank.": "Pris à l’écart de la Tisza, l’armée ottomane fut détruite en quelques heures tandis que le sultan regardait de la rive lointaine."
"Sarajevo": "Sarajevo"
"Eugene’s raiders sacked and burned the city, then withdrew north with their booty.": "Eugene, les assaillants ont saccagé et brûlé la ville, puis se sont retirés vers le nord avec leur butin."
"Mustafa II": "Mustafa II"
"Eugene of Savoy": "Eugène de Savoie"
"Raid on Sarajevo": "Raid sur Sarajevo"
"The Treaty of Karlowitz": "Traité de Karlowitz"
"1698–1699": "1698–1699"
"After Zenta the Ottomans accepted the mediation of England and the Dutch Republic, whose ambassadors, Lord Paget and Jacob Colyer, wanted the emperor free to face France. In November 1698 envoys of all the warring powers met at Karlowitz, on the Danube below Petrovaradin; the Ottoman side was led by Rami Mehmed Efendi and the dragoman Alexander Mavrocordatos. The talks took more than two months. They were based on uti possidetis, the principle that each side kept what it held, and the treaties were signed on 26 January 1699, for twenty-five years.": "Après Zenta, les Ottomans acceptèrent la médiation de l’Angleterre et de la République néerlandaise, dont les ambassadeurs, Lord Paget et Jacob Colyer, voulaient que l’empereur soit libre face à la France. En novembre 1698, des envoyés de toutes les puissances belligérantes se rencontrèrent à Karlowitz, sur le Danube sous Petrovaradin ; le côté ottoman fut dirigé par Rami Mehmed Efendi et le dragon Alexandre Mavrocordatos. Les pourparlers ont duré plus de deux mois, sur la base de l’uti possidetis, du principe selon lequel chaque partie conservait ce qu’elle détenait, et les traités ont été signés le 26 janvier 1699 pendant vingt-cinq ans."
"The emperor kept all of Hungary except the Banat of Temesvár, together with Transylvania, Slavonia and most of Croatia; the Ottomans kept Belgrade and the Banat. Venice kept the Morea and its new conquests in Dalmatia, and Poland–Lithuania regained Podolia. Ragusa had the Ottoman border brought down to the sea at Neum and Sutorina, so that Venetian land would not surround it. It was the first time the Ottoman Empire gave up so much by treaty, and the border was marked on the ground in the following years. Thököly and his followers went into exile in the Ottoman Empire.": "L’empereur gardait toute la Hongrie, sauf le Banat de Temesvár, avec la Transylvanie, la Slavonie et la majeure partie de la Croatie ; les Ottomans conservaient Belgrade et le Banat. Venise gardait la Morea et ses nouvelles conquêtes en Dalmatie, et la Pologne-Lituanie retrouvait Podolia. La frontière ottomane avait été ramenée à la mer à Neum et Sutorina, de sorte que la terre vénitienne ne l’entourait pas. C’était la première fois que l’Empire Ottoman abandonnait tant par traité, et la frontière était marquée sur le sol dans les années suivantes. Thököly et ses disciples allaient en exil dans l’Empire Ottoman."
"26 January 1699, for 25 years": "26 janvier 1699, pour 25 ans"
"Principle": "Principe"
"uti possidetis: each side keeps what it holds": "uti Possidetis : chaque côté garde ce qu’il détient"
"Mediators": "Médiateurs"
"England and the Dutch Republic": "Angleterre et République néerlandaise"
"Signed after a congress of more than two months at Karlowitz (Sremski Karlovci) in Syrmia.": "Signé après un congrès de plus de deux mois à Karlowitz (Sremski Karlovci) en Syrmia."
"Kept by the Ottomans, with the Banat of Temesvár, until the next war in 1716–1718.": "Conservé par les Ottomans, avec le Banat de Temesvár, jusqu’à la prochaine guerre en 1716–1718."
"Temesvár": "Temesvár"
"The Banat of Temesvár was the only part of the Hungarian kingdom left in Ottoman hands.": "Le Banat de Temesvár était la seule partie du royaume hongrois laissée entre les mains ottomanes."
"Neum": "Neum"
"Ragusa had this strip of coast given to the Ottomans, so that it bordered the empire and not only Venice. It still divides Croatia’s coast.": "Raguse avait cette bande de côte donnée aux Ottomans, de sorte qu’il bordait l’empire et pas seulement Venise. Il divise encore la côte croate."
"Ottoman lands recognised as Habsburg at Karlowitz": "Terres ottomanes reconnues comme Habsburg à Karlowitz"
