"The relief of Vienna": "Le soulagement de Vienne"
"In 1683 the grand vizier Kara Mustafa Pasha marched up the Danube with the main Ottoman army and on 14 July laid siege to Vienna, the Habsburg capital. Count Ernst Rüdiger von Starhemberg held the city with soldiers and armed citizens through two months of mining and assaults, while disease and hunger spread inside the walls. Emperor Leopold I had signed an alliance with Poland–Lithuania in March, and John III Sobieski came south with his army to join Imperial, Bavarian, Saxon and other German troops at Tulln.": "En 1683, le grand vizier Kara Mustafa Pasha marcha sur le Danube avec la principale armée ottomane et, le 14 juillet, assiégea Vienne, capitale des Habsbourg. Le comte Ernst Rüdiger von Starhemberg tenait la ville avec des soldats et des citoyens armés pendant deux mois de mines et d’assauts, tandis que la maladie et la faim se répandaient à l’intérieur des murs. L’empereur Leopold Ier avait signé une alliance avec la Pologne-Lituanie en mars, et Jean III Sobieski vint au sud avec son armée pour rejoindre les troupes impériales, bavaroises, saxonnes et autres troupes allemandes à Tulln."
"The relief army, some 70,000–80,000 men under Sobieski’s overall command, came down from the Kahlenberg on 12 September. Late in the afternoon a huge cavalry charge, led by the Polish hussars, broke the Ottoman army, which fled leaving its camp behind. Sobieski followed up with a victory at Párkány on the Danube in October, after a defeat there two days before. Kara Mustafa was executed at Belgrade on the sultan’s orders that December, and in 1684 the Emperor, Poland, Venice and the Pope formed the Holy League.": "L’armée de secours, de 70 000 à 80 000 hommes sous le commandement général de Sobieski, est descendue du Kahlenberg le 12 septembre. Tard dans l’après-midi une énorme charge de cavalerie, dirigée par les hussards polonais, a brisé l’armée ottomane, qui a fui son camp derrière. Sobieski a suivi avec une victoire à Párkány sur le Danube en octobre, après une défaite là deux jours avant. Kara Mustafa a été exécuté à Belgrade sur les ordres du sultan en décembre, et en 1684 l’empereur, la Pologne, Venise et le pape ont formé la Sainte Ligue."
