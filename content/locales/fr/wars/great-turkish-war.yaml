"For once Venice declared war on the Ottomans rather than the other way round, joining the Holy League in 1684 to win back what it had lost in Greece. Francesco Morosini, the defender of Candia in the Cretan War, sailed with papal, Tuscan and Maltese galleys and took Lefkada in August 1684. In 1685 his army, strengthened with Hanoverian and Saxon mercenaries, landed at Koroni; the fortress surrendered on 11 August, but its garrison was massacred during the talks. The Maniots rose again, and in 1686 the Swedish marshal Otto Wilhelm Königsmarck took Navarino, Modon and, on 29 August, Nauplia, the capital of the Morea.": "Pour une fois Venise a déclaré la guerre contre les Ottomans plutôt que l’inverse, rejoignant la Ligue Sainte en 1684 pour récupérer ce qu’elle avait perdu en Grèce. Francesco Morosini, le défenseur de Candia dans la guerre du Crétois, navigua avec des galères papales, toscanes et maltaises et prit Lefkada en août 1684. En 1685, son armée, fortifiée par des mercenaires Hanovriens et Saxons, débarqua à Koroni ; la forteresse se rendit le 11 août, mais sa garnison fut massacrée au cours des pourparlers. Les Maniots revinrent, et en 1686, le maréchal suédois Otto Wilhelm Königsmarck prit Navarino, Modon et, le 29 août, Nauplia, capitale de la Morea."
"In July 1687 the Venetians routed the Ottoman army at Patras, and within weeks all of the Peloponnese except Monemvasia was theirs. In September Königsmarck landed near Athens and besieged the Acropolis. On the evening of 26 September a Venetian mortar shell hit the Parthenon, which the garrison used as a powder store; the explosion killed about 300 people and wrecked the temple. The garrison surrendered two days later, but Athens was abandoned in April 1688, and some 4,000–5,000 Athenians left with the Venetians. A siege of Negroponte that summer failed, with about 9,000 men lost to battle and plague, Königsmarck among them. In Dalmatia Venetian troops took Herceg Novi in 1687 and Knin in 1688.": "En juillet 1687, les Vénitiens acheminèrent l’armée ottomane à Patras, et en quelques semaines, toute la Péloponnèse sauf la Monemvasie était à eux. En septembre Königsmarck débarqua près d’Athènes et assiégea l’Acropole. Le soir du 26 septembre, un obus de mortier vénitien frappa le Parthénon, que la garnison utilisait comme magasin de poudre ; l’explosion tua environ 300 personnes et détruisit le temple. La garnison s’est rendue deux jours plus tard, mais Athènes a été abandonnée en avril 1688, et environ 4000 à 5000 Athéniens sont partis avec les Vénitiens. Un siège de Negroponte cet été a échoué, avec environ 9 000 hommes perdus à la bataille et la peste, Königsmarck parmi eux."
