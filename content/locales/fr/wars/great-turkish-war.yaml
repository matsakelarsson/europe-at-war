"1684–1699": "1684–1699"
"Poland–Lithuania gained much less than its allies from the long war that followed. Its armies blockaded Ottoman-held Kamianets but could not take it, and Sobieski’s campaigns into Moldavia in 1686 and 1691 achieved little. To bring Russia into the League, the Commonwealth signed the Eternal Peace of 1686, giving up its claim to Kyiv. Sobieski died in 1696, and in 1698 Feliks Potocki beat a large Tatar army at Podhajce in one of the last battles of the war.": "Pologne-Lituanie a gagné beaucoup moins que ses alliés de la longue guerre qui a suivi. Ses armées ont bloqué les Kamianets ottomans, mais ne pouvaient pas le prendre, et Sobieski's campagnes en Moldavie en 1686 et 1691 obtenu peu. Pour amener la Russie dans la Ligue, le Commonwealth a signé la paix éternelle de 1686, abandonnant sa revendication à Kiev. Sobieski est mort en 1696, et en 1698 Feliks Potocki a battu une grande armée tatare à Podhajce dans l’une des dernières batailles de la guerre."
"The great victories were Habsburg ones, in Hungary and the Balkans, and the war ended with the Treaty of Karlowitz on 26 January 1699. The Ottomans returned Podolia and Kamianets to Poland–Lithuania and gave up their claims to Ukraine west of the Dnieper. The Habsburgs gained almost all of Hungary and Transylvania, and Venice the Morea. It was the first time the Ottoman Empire had given up so much territory by treaty.": "Les grandes victoires ont été celles de Habsbourg, en Hongrie et dans les Balkans, et la guerre s’est terminée avec le traité de Karlowitz le 26 janvier 1699. Les Ottomans ont rendu Podolia et Kamianets en Pologne-Lituanie et ont renoncé à leurs revendications à l’Ukraine à l’ouest du Dniepr. C’était la première fois que l’Empire ottoman abandonnait tant de territoire par traité."
