"Great Turkish War": "Grande guerre turque"
"After the failed Ottoman siege of Vienna in 1683, the Habsburg Monarchy, Poland–Lithuania, Venice and later Russia formed the Holy League against the Ottoman Empire. Sixteen years of war ended at Karlowitz in 1699 with the Ottomans giving up Hungary and Transylvania to the Habsburgs and Podolia to Poland–Lithuania.": "Après l’échec du siège ottoman de Vienne en 1683, la Monarchie des Habsbourg, la Pologne-Lituanie, Venise et plus tard la Russie formèrent la Sainte Ligue contre l’Empire Ottoman. Seize années de guerre se terminèrent à Karlowitz en 1699 avec les Ottomans abandonnant la Hongrie et la Transylvanie aux Habsbourg et Podolia à la Pologne-Lituanie."
"Dates are New Style (Gregorian).": "Les dates sont New Style (Gregorian)."
"Russia still used the Julian calendar, so Russian sources give the dates of the Crimean and Azov campaigns ten days earlier (eleven days from March 1700).": "La Russie utilise toujours le calendrier julien, de sorte que les sources russes donnent les dates des campagnes de Crimée et d’Azov dix jours plus tôt (onze jours à partir de mars 1700)."
"The Venetian campaigns in Greece and Dalmatia are often called the Morean War, or the Sixth Ottoman–Venetian War.": "Les campagnes vénitiennes en Grèce et en Dalmatie sont souvent appelées la guerre de Morée, ou la sixième guerre ottoman-vénétien."
