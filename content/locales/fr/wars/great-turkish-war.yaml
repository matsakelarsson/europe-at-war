"1687 and 1689": "1687 et 1689"
"Russia joined the Holy League through the Eternal Peace of May 1686, in which Poland–Lithuania recognised Russian rule over Kyiv and left-bank Ukraine. Its task was to tie down the Crimean Tatars. In May 1687 Prince Vasily Golitsyn, chief minister of the regent Sophia, set out from Okhtyrka with about 90,000 men, and some 50,000 Cossacks under Hetman Ivan Samoilovych joined him on the Dnieper. The huge column of men, wagons and horses crawled south in the summer heat. The Tatars set fire to the steppe, and with the horses starving and water short the army turned back in late June, still far from Perekop.": "La Russie s’est jointe à la Sainte Ligue par l’intermédiaire de la paix éternelle de mai 1686, dans laquelle la Pologne-Lituanie a reconnu la domination russe sur Kiev et la rive gauche de l’Ukraine. En mai 1687, le prince Vasily Golitsyn, ministre en chef de la régente Sophia, partit d’Okhtyrka avec environ 90 000 hommes, et quelque 50 000 cosaques sous Hetman Ivan Samoilovitch le rejoignirent sur le Dniepr. L’énorme colonne d’hommes, de wagons et de chevaux rampait au sud dans la chaleur estivale. Les Tatars ont mis le feu à la steppe, et avec les chevaux affamés et l’eau court, l’armée a tourné en arrière fin juin, encore loin de Perekop."
"Samoilovych was made the scapegoat and exiled to Siberia, and the Cossack officers elected Ivan Mazepa hetman in his place. Golitsyn set out again in the spring of 1689 with about 112,000 men and 350 guns, joined by 30,000–40,000 Cossacks under Mazepa. Marching in separate columns, they beat off Tatar attacks in late May and reached the Perekop isthmus on 30 May. There was no grass or drinking water, and a deep ditch barred the way into the peninsula, so Golitsyn turned back the next day. The failure helped to bring down Sophia’s government later that year, when the young Peter I took power and Golitsyn was exiled.": "Samoilovitch fut fait bouc émissaire et exilé en Sibérie, et les officiers du Cosaque élurent Ivan Mazepa hetman à sa place. Golitsyn partit de nouveau au printemps de 1689 avec environ 112 000 hommes et 350 canons, rejoints par 30 000 à 40 000 cosaques sous Mazepa. Marchant dans des colonnes séparées, ils ont battu les attaques Tatar à la fin de mai et atteint l’isthme Perekop le 30 mai. Il n’y avait pas d’herbe ou d’eau potable, et un fossé profond a empêché le chemin vers la péninsule, alors Golitsyn retourné le lendemain. L’échec a aidé à faire tomber Sophias gouvernement plus tard cette année-là, lorsque le jeune Peter Ier a pris le pouvoir et Golitsyn a été exilé."
