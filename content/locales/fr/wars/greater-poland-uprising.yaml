"Greater Poland Uprising": "Grande Pologne Élevée"
"A Polish rising against German rule in the Prussian Province of Posen, which broke out in Poznań on 27 December 1918, the day after a patriotic speech there by Ignacy Paderewski. By mid-January 1919 the insurgents held most of the province; fighting ended with the renewed Allied–German armistice of Trier on 16 February, and the Treaty of Versailles gave most of the region to Poland.": "Une montée polonaise contre la domination allemande dans la province prussienne de Posen, qui a éclaté à Poznań le 27 décembre 1918, le lendemain d’un discours patriotique par Ignacy Paderewski. Vers la mi-janvier 1919, les insurgés ont tenu la majeure partie de la province ; les combats se sont terminés avec l’armistice allié-allemand renouvelé de Trèves le 16 février, et le traité de Versailles a donné la plus grande partie de la région à la Pologne."
"The Treaty of Versailles, signed on 28 June 1919, came into force on 10 January 1920, when the transfer of the province to Poland was completed.": "Le traité de Versailles, signé le 28 juin 1919, est entré en vigueur le 10 janvier 1920, date à laquelle la province a été transférée en Pologne."
