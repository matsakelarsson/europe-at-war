Greco-Turkish War (1897): Guerre gréco-turque (1897)
A short war, also called the Thirty Days’ War, that grew out of a Christian revolt on Ottoman Crete and Greek efforts to annex the island. The Ottoman army routed the Greeks in Thessaly and won at Domokos before the powers imposed an armistice; Greece paid an indemnity and lost a strip of its northern frontier, but the powers then made Crete an autonomous state under a Greek prince.: Une courte guerre, aussi appelée la Guerre des Trente Jours, qui a vu le jour d’une révolte chrétienne sur la Crète ottomane et les efforts grecs pour annexer l’île. L’armée ottomane roulait les Grecs en Thessalonique et gagnait à Domokos avant que les pouvoirs imposent un armistice ; la Grèce paya une indemnité et perdit une bande de sa frontière nord, mais les pouvoirs firent alors de la Crète un État autonome sous un prince grec.
Greece used the Julian (Old Style) calendar, 12 days behind the Gregorian in the 19th century, and Greek accounts often give Old Style dates. All dates here are New Style.: La Grèce a utilisé le calendrier Julian (Old Style), 12 jours derrière le grégorien au 19ème siècle, et les comptes grecs donnent souvent des dates Old Style. Toutes les dates ici sont New Style.
The war is said to have been the first filmed by a cameraman, although the footage is lost.: La guerre aurait été la première filmée par un cameraman, bien que les images soient perdues.
