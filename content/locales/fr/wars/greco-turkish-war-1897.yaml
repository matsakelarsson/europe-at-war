Domokos and the peace: Domokos et la paix
May 1897 – December 1898: mai 1897 – décembre 1898
On 5 May the Ottomans attacked Farsala and forced the Greeks back to Domokos, and Volos fell on 8 May. At Domokos about 40,000 Greek soldiers, joined by some 2,000 Italian volunteers under Ricciotti Garibaldi, held a strong position, but on 17 May the Ottomans turned the Greek right and the army retreated again. The road to Athens was open. The powers stepped in, and after Tsar Nicholas II telegraphed the sultan, an armistice came into force on 20 May.: Le 5 mai, les Ottomans attaquèrent Farsala et forcèrent les Grecs à retourner à Domokos, et Volos tomba le 8 mai. À Domokos, environ 40 000 soldats grecs, rejoints par quelque 2 000 volontaires italiens sous Ricciotti Garibaldi, occupaient une position forte, mais le 17 mai, les Ottomans tournèrent la droite grecque et l’armée retira. La route vers Athènes était ouverte. Les pouvoirs y sont entrés, et après que le tsar Nicholas II eut télégraphié le sultan, un armistice est entré en vigueur le 20 mai.
The Treaty of Constantinople of 4 December 1897 made Greece pay an indemnity of four million Ottoman pounds, under an international commission that took control of part of its revenue, and gave the Ottomans small strips of the Thessalian frontier. Yet Crete was lost to the sultan. After Ottoman troops and Muslim mobs killed British soldiers and Christians in Heraklion in September 1898, the powers expelled the Ottoman army, and in December Prince George of Greece arrived as high commissioner of an autonomous Cretan State.: Le traité de Constantinople du 4 décembre 1897 fait que la Grèce paie une indemnité de quatre millions de livres ottomanes, sous une commission internationale qui prend le contrôle d’une partie de ses recettes, et donne aux Ottomans de petites bandes de la frontière thésalienne. Pourtant la Crète est perdue au sultan. Après que les troupes ottomanes et la foule musulmane eurent tué des soldats britanniques et des chrétiens à Héraklion en septembre 1898, les pouvoirs expulsèrent l’armée ottomane et, en décembre, le prince George de Grèce arriva comme haut commissaire d’un État crétois autonome.
