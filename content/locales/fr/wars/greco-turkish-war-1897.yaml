Crete and Thessaly: Crète et Thésalie
February – May 1897: février – mai 1897
Crete’s Christian majority had risen again and again against Ottoman rule, and in early 1897 fighting broke out in Chania. Swept along by public opinion and the nationalist Ethniki Etaireia (National Society), the Greek government sent warships and, on 14 February, landed two battalions under Colonel Timoleon Vassos, who proclaimed the island’s union with Greece. The six Great Powers had already sent an international squadron; they landed troops in the towns, shelled insurgent positions and blockaded Crete, and promised the island autonomy under Ottoman rule.: La majorité chrétienne de la Crète s’était relevée encore et encore contre le gouvernement ottoman, et au début de 1897 les combats ont éclaté à Chania. Plongé par l’opinion publique et le nationaliste Ethniki Etaireia (Société nationale), le gouvernement grec a envoyé des navires de guerre et, le 14 février, atterri deux bataillons sous le colonel Timoleon Vassos, qui proclama l’union de l’île avec la Grèce. Les six grandes puissances avaient déjà envoyé un escadron international ; elles débarquaient des troupes dans les villes, pilonnaient des positions insurgées et bloquaient la Crète, et promettaient l’autonomie de l’île sous le régime ottoman.
In April Greek irregulars crossed into Ottoman Macedonia, and on 18 April the Ottoman Empire declared war. Its army in Thessaly under Edhem Pasha, larger and better armed and trained by German officers, broke through the frontier passes. On the night of 23–24 April the Greek army under Crown Prince Constantine fell back in panic, and Larissa was occupied on 27 April. Only at Velestino did a brigade under Colonel Konstantinos Smolenskis hold, from 27 to 30 April. On the Epirus front, Greek attacks across the Arta river made little progress.: En avril, des irrégularités grecques ont traversé la Macédoine ottomane et, le 18 avril, l’Empire ottoman a déclaré la guerre. Son armée de Thessalie sous Edhem Pacha, plus grande et mieux armée et entraînée par des officiers allemands, a franchi les frontières. Ce n’est qu’à Velestino qu’une brigade sous les ordres du colonel Konstantinos Smolenskis a tenu, du 27 au 30 avril. Sur le front de l’Epire, les attaques grecques à travers la rivière Arta ont peu progressé.
