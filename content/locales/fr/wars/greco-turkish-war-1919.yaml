# Some French text was translated automatically.
"Greco-Turkish War (1919–1922)": "Guerre gréco-turque (1919-1922)"
"The war that followed the Greek landing at Smyrna in May 1919, when Greece, backed at first by Britain, tried to win western Anatolia and Eastern Thrace from the defeated Ottoman Empire. The Turkish nationalist movement led by Mustafa Kemal stopped the Greek army at the Sakarya in 1921 and routed it in August 1922; Smyrna burned, the Armistice of Mudanya ended the fighting, and the Treaty of Lausanne and the exchange of populations of 1923 uprooted some 1.6 million people.": "La guerre qui a suivi le débarquement grec à Smyrne en mai 1919, quand la Grèce, soutenue au début par la Grande-Bretagne, a essayé de gagner l’Anatolie occidentale et Thrace orientale de l’Empire ottoman vaincu. Le mouvement nationaliste turc dirigé par Mustafa Kemal a arrêté l’armée grecque à la Sakarya en 1921 et l’a acheminée en août 1922 ; Smyrna a brûlé, l’armistice de Mudanya a mis fin aux combats, et le traité de Lausanne et l’échange de populations de 1923 ont déraciné quelque 1,6 million de personnes."
"Known in Greece as the Asia Minor Campaign, ending in the Asia Minor Catastrophe, and in Turkey as the western front of the War of Independence (Kurtuluş Savaşı). Greece adopted the Gregorian calendar in 1923, and Greek accounts often give Old Style dates for 1919–1922; all dates here are New Style.": "Connu en Grèce comme la Campagne Mineure d’Asie, se terminant en Asie Catastrophe mineure, et en Turquie comme le front occidental de la guerre d’indépendance (Kurtuluş Savaşı). La Grèce a adopté le calendrier grégorien en 1923, et les comptes grecs donnent souvent des dates Old Style pour 1919-1922 ; toutes les dates ici sont New Style."
"The base map shows the Ottoman Empire until the sultanate was abolished on 1 November 1922. From 1920 most of Anatolia was held by the Grand National Assembly in Ankara, whose government became the Republic of Turkey in October 1923; the Greek, Allied, Italian and French zones are shown as approximate areas.": "La carte de base montre l’Empire ottoman jusqu’à l’abolition du sultanat le 1er novembre 1922. A partir de 1920, la plupart des Anatolies ont été tenues par la Grande Assemblée nationale à Ankara, dont le gouvernement est devenu la République de Turquie en octobre 1923 ; les zones grecque, alliée, italienne et française sont représentées comme étant approximatives."
"Places are named in their present-day forms, with the names used at the time where accounts usually give them; Smyrna is İzmir, Brusa is Bursa, Afyon Karahisar is Afyonkarahisar and Chanak is Çanakkale.": "Les lieux sont nommés dans leurs formes actuelles, avec les noms utilisés à l’époque où les comptes leur donnent habituellement ; Smyrna est Izmir, Brusa est Bursa, Afyon Karahisar est Afyonkarahisar et Chanak est Çanakkale."
"Civilians suffered on all sides. Greek troops and irregulars killed Turkish villagers and burned towns, above all during the retreat of 1922; Turkish forces and irregulars killed and deported Greek and Armenian civilians, including the Pontic Greeks of the Black Sea coast; and the burning of Smyrna and the expulsions that followed ended three thousand years of Greek life in Anatolia. Greece and a number of scholars regard the killings and deportations of Ottoman Greeks from 1914 to 1923 as genocide, which Turkey rejects. Numbers are disputed and the subject is still bitterly contested.": "Des civils ont souffert de toutes parts. Des troupes grecques et des irréguliers ont tué des villageois turcs et brûlé des villes, surtout pendant la retraite de 1922 ; des forces turques et des irréguliers ont tué et expulsé des civils grecs et arméniens, y compris les Grecs pontiques de la côte de la mer Noire ; et le brûlage de Smyrne et les expulsions qui ont suivi ont mis fin à trois mille ans de vie grecque en Anatolie. La Grèce et un certain nombre d’érudits considèrent les meurtres et déportations de Grecs ottomans de 1914 à 1923 comme des génocides que la Turquie rejette."
