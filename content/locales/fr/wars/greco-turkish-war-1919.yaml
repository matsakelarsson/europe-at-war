"In July 1922 Greece moved troops from Anatolia to Thrace and asked the Allies to let it occupy Constantinople, which they refused. Mustafa Kemal had spent months building up his army in secret. Before dawn on 26 August his artillery opened fire on the Greek positions south of Afyonkarahisar, and Turkish infantry broke through on the heights. Cavalry poured through the gap behind the Greek lines. In the battle at Dumlupınar on 30 August the main Greek force was surrounded and destroyed, and on 2 September its commander, General Nikolaos Trikoupis, was taken prisoner.": "En juillet 1922, la Grèce déplaça des troupes d’Anatolie à Thrace et demanda aux Alliés de la laisser occuper Constantinople, ce qu’ils refusèrent. Mustafa Kemal avait passé des mois à construire son armée en secret. Avant l’aube du 26 août, son artillerie ouvrit le feu sur les positions grecques au sud d’Afyonkarahisar, et l’infanterie turque se brisa sur les hauteurs. Dans la bataille de Dumlupınar le 30 août, la principale force grecque a été encerclée et détruite, et le 2 septembre son commandant, le général Nikolaos Trikoupis, a été fait prisonnier."
"The Greek army fell apart and retreated more than 300 kilometres to the coast in two weeks. Retreating troops and irregulars burned towns and villages on their way, among them Uşak, Alaşehir and Manisa, and killed Turkish civilians. Turkish troops and irregulars following them killed Greek civilians and prisoners. Greek soldiers and tens of thousands of refugees crowded into the ports of Smyrna and Çeşme, from which the army was shipped away. Turkish cavalry rode into Smyrna on 9 September.": "L’armée grecque s’est effondrée et a reculé à plus de 300 kilomètres de la côte en deux semaines. Retrait des troupes et des irréguliers ont brûlé des villes et des villages sur leur chemin, parmi lesquels Uşak, Alaşehir et Manisa, et tué des civils turcs. Des soldats grecs et des dizaines de milliers de réfugiés se sont encombrés dans les ports de Smyrne et de Çeşme, d’où l’armée a été expédiée. La cavalerie turque est arrivée à Smyrne le 9 septembre."
