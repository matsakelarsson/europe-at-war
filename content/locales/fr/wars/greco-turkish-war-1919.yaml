"May – September 1919": "mai – septembre 1919"
"After the Ottoman surrender at Mudros in October 1918, Allied troops occupied the Straits and Constantinople, Italy landed at Antalya, and British and then French troops took over Cilicia. The Greek prime minister, Eleftherios Venizelos, claimed Smyrna and its region, where Greeks were numerous, and Britain’s David Lloyd George persuaded the peace conference in Paris to let Greece occupy it, partly to forestall Italy. On 15 May 1919 Greek troops landed under the guns of Allied warships. A shot fired at them set off shooting and lynchings in which many Turkish soldiers and civilians were killed, and an Allied inquiry later blamed the Greek command.": "Après la reddition ottomane à Mudros en octobre 1918, les troupes alliées occupent le détroit et Constantinople, l’Italie débarque à Antalya, et les troupes britanniques puis françaises prennent Cilicie. Le premier ministre grec, Eleftherios Venizelos, revendique Smyrna et sa région, où les Grecs sont nombreux, et les Britanniques David Lloyd George convainc la conférence de paix à Paris de laisser la Grèce l’occuper, en partie pour prévenir l’Italie. Le 15 mai 1919, des troupes grecques débarquèrent sous les canons de navires de guerre alliés. Un coup de feu tiré contre eux a déclenché des tirs et des lynchages au cours desquels de nombreux soldats et civils turcs ont été tués, et une enquête alliée a par la suite blâmé le commandement grec."
"The Greeks spread out to Manisa, Ayvalık and Aydın, where Turkish irregulars retook the town at the end of June and it was burned amid massacres of Greek and Turkish civilians. The landing turned scattered Turkish resistance into a national movement. Mustafa Kemal Pasha, sent to the Black Sea as an army inspector, landed at Samsun on 19 May, broke with the sultan’s government, and at congresses in Erzurum and Sivas that summer rallied the resistance behind a programme of keeping the Turkish-majority lands undivided.": "Les Grecs se sont étendus à Manisa, Ayvalık et Aydın, où les irréguliers turcs ont repris la ville à la fin du mois de juin et ont été brûlés au milieu des massacres de civils grecs et turcs. Mustafa Kemal Pasha, envoyé en mer Noire comme inspecteur de l’armée, atterrit à Samsun le 19 mai, rompit avec le gouvernement sultan et aux congrès d’Erzurum et de Sivas cet été-là rallièrent la résistance derrière un programme visant à préserver les terres à majorité turque."
