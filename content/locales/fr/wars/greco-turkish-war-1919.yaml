"With King Constantine at the front, the Greek army set out in mid-August to destroy the Turkish army and take Ankara. Its columns crossed a waterless salt steppe, with supply lines stretching back hundreds of kilometres, and met Turkish positions in the hills east of the Sakarya river, some 80 kilometres from Ankara. The Assembly had made Mustafa Kemal commander-in-chief. The battle lasted from 23 August to 13 September along a front of about 100 kilometres; the Greeks took several ridges, but each side lost more than 20,000 men killed or wounded, and the Greeks could go no further.": "Avec le roi Constantin au front, l’armée grecque partit à la mi-août pour détruire l’armée turque et prendre Ankara. Ses colonnes traversèrent une steppe salée sans eau, avec des lignes d’approvisionnement s’étendant sur des centaines de kilomètres, et rencontrèrent les positions turques dans les collines à l’est du Sakarya, à quelque 80 kilomètres d’Ankara. L’Assemblée avait fait Mustafa Kemal commandant en chef. La bataille a duré du 23 août au 13 septembre sur un front d’environ 100 kilomètres ; les Grecs ont pris plusieurs crêtes, mais chaque côté a perdu plus de 20 000 hommes tués ou blessés, et les Grecs ne peuvent aller plus loin."
"The Greek army fell back to a line running from Eskişehir to Afyonkarahisar, burning villages as it went, and the front stayed there for almost a year. The Assembly gave Mustafa Kemal the title of Gazi, “the victorious”. France made peace with Ankara in the Ankara Agreement of 20 October 1921 and left Cilicia, Soviet Russia settled the eastern border in the Treaty of Kars, and Italy was withdrawing its troops. Greece was left alone, short of money and without Allied support, to hold a long front deep in Anatolia.": "L’armée grecque est revenue à une ligne allant d’Eskişehir à Afyonkarahisar, des villages brûlants pendant qu’il allait, et le front y est resté presque un an. L’Assemblée a donné Mustafa Kemal le titre de Gazi, le vainqueur. La France a fait la paix avec Ankara dans l’accord d’Ankara du 20 octobre 1921 et a quitté Cilicie, Russie soviétique a fixé la frontière orientale dans le traité de Kars, et l’Italie retirait ses troupes."
