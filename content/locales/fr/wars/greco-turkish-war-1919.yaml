"The new Greek government kept up the war, hoping to break the nationalists before the Allies made peace without Greece. In January 1921 a Greek corps advancing from Bursa towards the railway junction of Eskişehir was stopped at İnönü by the new regular army of İsmet Pasha. Talks in London failed, and in late March the Greeks attacked again on two fronts; at İnönü they were beaten back after a week of fighting, and in the south they took Afyonkarahisar but soon gave it up. The battles made the nationalists’ name, and İsmet later took İnönü as his surname.": "Le nouveau gouvernement grec a poursuivi la guerre, espérant briser les nationalistes avant que les Alliés ne fassent la paix sans la Grèce. En janvier 1921, un corps grec qui se dirigeait de Bursa vers la jonction ferroviaire d’Eskişehir fut arrêté par la nouvelle armée régulière d’Ismet Pasha. Les pourparlers à Londres échouèrent et, fin mars, les Grecs attaquèrent de nouveau sur deux fronts ; à İnönü ils furent battus après une semaine de combats, et dans le sud ils prirent Afyonkarahisar mais abandonnèrent bientôt."
"Abroad, the Ankara government gained ground. It signed a treaty of friendship with Soviet Russia in March, which brought gold and arms, and Italy began to pull out of its zone. In July the Greek Army of Asia Minor under General Anastasios Papoulas launched its largest offensive yet. In the battles of Kütahya–Eskişehir it took Afyonkarahisar on 13 July, Kütahya on 17 July and Eskişehir on 19 July. Mustafa Kemal ordered his army to fall back east of the Sakarya river, trading land for time.": "A l’étranger, le gouvernement d’Ankara a gagné du terrain. Il a signé un traité d’amitié avec la Russie soviétique en mars, qui a apporté de l’or et des armes, et l’Italie a commencé à sortir de sa zone. Dans les batailles de Kütahya–Eskişehir il a fallu Afyonkarahisar le 13 juillet, Kütahya le 17 juillet et Eskişehir le 19 juillet. Mustafa Kemal a ordonné à son armée de retomber à l’est du fleuve Sakarya, échangeant des terres pour le temps."
