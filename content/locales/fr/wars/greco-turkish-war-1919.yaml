"The city’s Muslims left for Turkey, and tens of thousands of refugees from Anatolia and Thrace settled in and around it.": "La ville est partie pour la Turquie, et des dizaines de milliers de réfugiés d’Anatolie et de Thrace s’y sont installés."
"Piraeus and Athens": "Pirée et Athènes"
"from 1922": "à partir de 1922"
"Refugee settlements such as Nea Smyrni, Nea Ionia and Kokkinia grew into new suburbs of the capital.": "Les colonies de réfugiés telles que Nea Smyrni, Nea Ionia et Kokkinia se sont développées dans de nouvelles banlieues de la capitale."
"Karaağaç": "Karaağaç"
"Greece ceded this railway suburb of Adrianople on the west bank of the Maritsa to Turkey in place of war reparations.": "La Grèce a cédé cette banlieue ferroviaire d’Adrianople sur la rive ouest du Maritsa à la Turquie au lieu de réparations de guerre."
"Imbros and Tenedos": "Imbros et Tenedos"
"The two islands at the mouth of the Dardanelles went to Turkey, with their Greek inhabitants exempted from the exchange.": "Les deux îles à l’embouchure des Dardanelles se rendirent en Turquie, leurs habitants grecs étant exemptés de l’échange."
"13–29 October 1923": "13–29 octobre 1923"
"Made the capital on 13 October; the Republic of Turkey was proclaimed here on 29 October.": "Fait la capitale le 13 octobre ; la République de Turquie a été proclamée ici le 29 octobre."
"Christian refugees and exchangees to Greece": "Réfugiés chrétiens et échanges avec la Grèce"
