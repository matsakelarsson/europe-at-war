"When the Ottoman parliament declared its support for the national movement, Allied troops formally occupied Constantinople on 16 March 1920, arrested nationalist deputies and sent many to Malta. The nationalists answered by opening a Grand National Assembly in Ankara on 23 April, which claimed to govern in the sultan’s name while he was a prisoner of the Allies. That summer, with British approval, the Greek army struck out of its zone, took Bursa on 8 July and pushed east as far as Uşak, while another Greek force occupied Eastern Thrace and entered Adrianople on 25 July.": "Lorsque le parlement ottoman a déclaré son soutien au mouvement national, les troupes alliées ont officiellement occupé Constantinople le 16 mars 1920, arrêté des députés nationalistes et envoyé beaucoup à Malte. Les nationalistes ont répondu en ouvrant une grande Assemblée nationale à Ankara le 23 avril, qui prétendait gouverner au nom du sultan pendant qu’il était prisonnier des Alliés. Cet été-là, avec l’approbation des Britanniques, l’armée grecque a quitté sa zone, pris Bursa le 8 juillet et poussé à l’est jusqu’à Uşak, tandis qu’une autre force grecque occupait la Thrace orientale et entra dans Adrianople le 25 juillet."
"On 10 August the sultan’s government signed the Treaty of Sèvres. Greece was to have Eastern Thrace and to govern Smyrna for five years before a plebiscite, the Straits were put under international control, and Armenia and a possible Kurdistan were carved from the east. The Ankara government rejected the treaty, and it was never ratified. Then fortune turned against Venizelos. King Alexander died of a monkey bite in October, Venizelos lost the elections of November, and King Constantine, whom the Allies distrusted, returned in December.": "Le 10 août, le gouvernement sultan a signé le traité de Sèvres. La Grèce devait avoir la Thrace orientale et gouverner Smyrne pendant cinq ans avant un plébiscite, les détroits ont été placés sous contrôle international, et l’Arménie et un éventuel Kurdistan ont été sculptés de l’est. Le gouvernement d’Ankara a rejeté le traité, et il n’a jamais été ratifié. Le roi Alexandre est mort d’une morsure de singe en octobre, Venizelos a perdu les élections de novembre, et le roi Constantin, que les Alliés méfiaient, est revenu en décembre."
