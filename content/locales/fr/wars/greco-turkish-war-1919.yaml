"Smyrna burns and Mudanya": "Smyrne brûle et Mudanya"
"September – November 1922": "septembre – novembre 1922"
"In Smyrna, Turkish troops and mobs killed Greeks and Armenians, and the Orthodox metropolitan, Chrysostomos, was handed over to a crowd and murdered. On 13 September fire broke out in the Armenian quarter and destroyed the Greek, Armenian and European quarters over the next days, while hundreds of thousands of refugees were trapped on the quayside and Allied warships looked on. Most eyewitnesses blamed Turkish soldiers, while Turkish accounts blamed Armenians and Greeks. Estimates of the dead run from about 10,000 to 100,000 or more; ships organised by Greece and an American, Asa Jennings, carried the survivors away.": "À Smyrne, des troupes et des foules turques ont tué des Grecs et des Arméniens, et le métropolite orthodoxe Chrysostomos a été livré à une foule et assassiné. Le 13 septembre, des tirs ont éclaté dans le quartier arménien et détruit les quartiers grec, arménien et européen au cours des prochains jours, tandis que des centaines de milliers de réfugiés ont été piégés sur le quai et les navires de guerre alliés regardés. La plupart des témoins oculaires blâmaient les soldats turcs, tandis que les comptes turcs accusaient les Arméniens et les Grecs. Les estimations des morts courent d’environ 10 000 à 100 000 personnes ou plus ; les navires organisés par la Grèce et un américain, Asa Jennings, ont emporté les survivants."
"Turkish troops then advanced on the neutral zone of the Straits, where British troops held Chanak (Çanakkale), and for some days Britain came close to war. On 11 October the Armistice of Mudanya gave Eastern Thrace up to the Maritsa back to Turkish rule, and Greece accepted it three days later. In Greece, army officers had forced King Constantine to abdicate, and six politicians and generals blamed for the defeat were shot in November. On 1 November the Assembly abolished the sultanate, and Mehmed VI left on a British warship.": "Les troupes turques avançaient alors sur la zone neutre du détroit, où les troupes britanniques retenaient Chanak (Çanakkale), et pendant quelques jours la Grande-Bretagne s’approchait de la guerre. Le 11 octobre, l’armistice de Mudanya donna à la Thrace orientale le retour au pouvoir turc, et la Grèce l’accepta trois jours plus tard. En Grèce, des officiers de l’armée avaient forcé le roi Constantin à abdiquer et six hommes politiques et généraux accusés de la défaite ont été abattus en novembre. Le 1er novembre, l’Assemblée a aboli le sultanate, et Mehmed VI est parti sur un navire de guerre britannique."
"Burning of Smyrna": "Brûlure de Smyrne"
"13–22 September 1922": "13–22 septembre 1922"
"Armistice of Mudanya": "Armistice de Mudanya"
"11 October 1922": "11 octobre 1922"
"Sultanate abolished": "Suppression du Sultanat"
"1 November 1922": "1er novembre 1922"
"The fire destroyed most of the city except the Turkish and Jewish quarters; tens of thousands of refugees waited on the quay for rescue.": "L’incendie a détruit la plus grande partie de la ville, à l’exception des quartiers turc et juif ; des dizaines de milliers de réfugiés ont attendu sur le quai pour secourir."
"Chanak": "Chanak"
"September – October 1922": "septembre – octobre 1922"
"British troops faced Turkish cavalry across the wire of the neutral zone, but the British commander, General Charles Harington, held back an ultimatum and talks followed.": "Les troupes britanniques affrontèrent la cavalerie turque à travers les fils de la zone neutre, mais le commandant britannique, le général Charles Harington, retint un ultimatum et des pourparlers suivirent."
"Signed by Turkey, Britain, France and Italy; the Greek army had 15 days to leave Eastern Thrace, and Greek civilians left with it.": "Signé par la Turquie, la Grande-Bretagne, la France et l’Italie ; l’armée grecque a eu 15 jours pour quitter Thrace orientale, et les civils grecs sont partis avec elle."
"1–17 November 1922": "1–17 novembre 1922"
"The Grand National Assembly abolished the sultanate, and the last sultan, Mehmed VI, left the city on 17 November.": "La Grande Assemblée nationale abolit le sultanate, et le dernier sultan, Mehmed VI, quitta la ville le 17 novembre."
"Eastern Thrace, evacuated by Greece under the Mudanya armistice": "Thrace orientale, évacuée par la Grèce sous l’armistice de Mudanya"
"Neutral zone of the Straits, held by the Allies (approximate)": "Zone neutre du détroit, tenue par les Alliés (approximate)"
"Lausanne and the exchange of populations": "Lausanne et l’échange de populations"
"November 1922 – October 1923": "novembre 1922 – octobre 1923"
"A peace conference opened at Lausanne in November 1922, with İsmet Pasha leading the Turkish delegation. On 30 January 1923 Greece and Turkey agreed to a compulsory exchange of populations defined by religion, the first of its kind. About 1.2 million Orthodox Christians, most of whom had already fled, lost their homes in Turkey, and some 400,000 Muslims had to leave Greece. The Greeks of Constantinople, Imbros and Tenedos and the Muslims of Western Thrace were exempted. Refugees made up about a fifth of Greece’s population and transformed Macedonia and the cities, where many lived in poverty for decades.": "Une conférence de paix s’est ouverte à Lausanne en novembre 1922, avec İsmet Pacha qui dirige la délégation turque. Le 30 janvier 1923, la Grèce et la Turquie acceptèrent un échange obligatoire de populations définies par la religion, le premier du genre. Environ 1,2 million de chrétiens orthodoxes, dont la plupart avaient déjà fui, perdirent leurs maisons en Turquie, et quelque 400 000 musulmans durent quitter la Grèce. Les Grecs de Constantinople, d’Imbros et de Tenedos et les musulmans de Thrace occidentale ont été exemptés. Les réfugiés ont constitué environ un cinquième de la population grecque et transformé la Macédoine et les villes, où beaucoup ont vécu dans la pauvreté pendant des décennies."
"The Treaty of Lausanne, signed on 24 July 1923, replaced Sèvres. Turkey kept all of Anatolia and Eastern Thrace up to the Maritsa, with Imbros, Tenedos and Karaağaç, a suburb of Adrianople, ceded by Greece instead of reparations; Greece kept the other Aegean islands and Italy the Dodecanese. The Straits were demilitarised, and the foreign privileges of the capitulations were abolished. The last Allied troops left Constantinople in early October, Ankara became the capital, and on 29 October 1923 the Assembly proclaimed the Republic of Turkey with Mustafa Kemal as its president.": "Le traité de Lausanne, signé le 24 juillet 1923, a remplacé Sèvres. La Turquie a gardé toute l’Anatolie et la Thrace orientale jusqu’à la Maritsa, avec Imbros, Tenedos et Karaağaç, une banlieue d’Adrianople, cédée par la Grèce au lieu de réparations ; la Grèce a gardé les autres îles Égées et l’Italie le Dodécanèse. Le détroit fut démilitarisé et les privilèges étrangers des capitulations furent abolis.Les dernières troupes alliées quittèrent Constantinople au début d’octobre, Ankara devint la capitale et le 29 octobre 1923 l’Assemblée proclama la République de Turquie avec Mustafa Kemal comme président."
"Exchange convention": "Convention sur les échanges"
