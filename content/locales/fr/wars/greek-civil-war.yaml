"At its height in 1948 the Democratic Army had more than 20,000 fighters, many of them women and some conscripted in the villages it held. It controlled the mountains from Grammos and Vitsi on the northern border down the Pindus to Agrafa, with bands on Olympus, in Central Greece and the Peloponnese. It raided towns, mined roads and executed people it saw as informers. The government army, enlarged and re-equipped by the United States, cleared villagers from the mountains to cut the guerrillas off from food and recruits, and by 1949 about 700,000 people had been uprooted inside Greece.": "En 1948, l’Armée démocratique comptait plus de 20 000 combattants, dont beaucoup étaient des femmes et des conscrits dans les villages qu’elle détenait. Elle contrôlait les montagnes depuis Grammos et Vitsi à la frontière nord en passant par les Pindus jusqu’à Agrafa, avec des bandes sur Olympus, en Grèce centrale et dans le Péloponnèse. L’armée gouvernementale, agrandie et rééquipée par les États-Unis, a libéré les villageois des montagnes pour couper la guérilla de la nourriture et des recrues, et en 1949 environ 700 000 personnes ont été déracinées à l’intérieur de la Grèce."
"From March 1948 the Democratic Army took about 25,000 children from the areas it held to Yugoslavia, Albania, Bulgaria and other communist countries. The KKE called it a rescue from the war; the government and most Greeks called it the paidomazoma, a seizure of children. The government in turn placed thousands of children in homes run under Queen Frederica. Tens of thousands of leftists and suspects were sent to island camps such as Makronisos, and courts martial passed thousands of death sentences. In January and February 1949 the Democratic Army raided Naousa and Karpenisi but failed to take Florina.": "A partir de mars 1948, l’Armée Démocratique a pris environ 25 000 enfants des régions qu’elle détenait en Yougoslavie, en Albanie, en Bulgarie et dans d’autres pays communistes. Le KKE a appelé cela un sauvetage de la guerre ; le gouvernement et la plupart des Grecs l’ont appelé le payomazoma, une saisie d’enfants. Des dizaines de milliers de gauchistes et de suspects ont été envoyés dans des camps insulaires comme Makronisos, et les cours martiales ont prononcé des milliers de condamnations à mort. En janvier et février 1949, l’armée démocratique a fait une descente dans Naousa et Karpenisi mais n’a pas pris Florina."
