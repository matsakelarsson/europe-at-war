"On 16 October 1949 the KKE’s radio station announced a “ceasefire”, presenting it as a pause rather than a defeat, and the war was over. Most estimates put the dead of 1946–1949 at around 50,000 soldiers, guerrillas and civilians, and some much higher. Thousands of fighters and party members, with their families and the children taken in 1948, went into exile in the Soviet Union and Eastern Europe, many of them for decades. Those captured in Greece faced courts martial and island camps; some, such as the communist Nikos Beloyannis in 1952, were executed.": "Le 16 octobre 1949, la station de radio KKE's annonça un cessez-le-feu, le présentant comme une pause plutôt qu’une défaite, et la guerre était terminée. La plupart des estimations mettaient les morts de 1946-1949 à environ 50 000 soldats, guérilleros et civils, et beaucoup plus. Des milliers de combattants et de membres du parti, avec leurs familles et les enfants pris en 1948, se sont exilés en Union soviétique et en Europe orientale, dont beaucoup pendant des décennies. Ceux capturés en Grèce ont fait face à des cours martiales et des camps d’îles ; certains, comme le communiste Nikos Beloyannis en 1952, ont été exécutés."
"The victory kept Greece in the Western camp, and it joined NATO in 1952, but it also left a deeply divided country. For a quarter of a century the left was shut out of public life by certificates of political reliability, internal exile and the ban on the KKE, which the military dictatorship of 1967–1974 tightened. The KKE was legalised after the junta fell in 1974. In 1982 political refugees “Greek by birth” were allowed back, a rule that excluded many Slavic Macedonians, and in 1989 parliament recognised the war officially as a civil war.": "La victoire a maintenu la Grèce dans le camp occidental, et elle a rejoint l’OTAN en 1952, mais elle a également laissé un pays profondément divisé. Pendant un quart de siècle, la gauche a été fermée à la vie publique par des certificats de fiabilité politique, d’exil interne et l’interdiction du KKE, que la dictature militaire de 1967-1974 s’est resserrée. En 1982, les réfugiés politiques -\"Greek de naissance\" ont été admis, une règle qui excluait beaucoup de Macédoniens slaves, et en 1989 le parlement a reconnu officiellement la guerre comme une guerre civile."
