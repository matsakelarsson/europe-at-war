"Greek Civil War": "Guerre civile grecque"
"A war between the Greek government, backed first by Britain and then by the United States, and the Democratic Army of Greece led by the Communist Party (KKE), with bases in Yugoslavia, Albania and Bulgaria. Rooted in the wartime split of the resistance and the December 1944 fighting in Athens, it was fought mainly in the northern mountains and ended with the government victories at Grammos and Vitsi in August 1949, after tens of thousands of deaths and the uprooting of some 700,000 people.": "Une guerre entre le gouvernement grec, soutenu d’abord par la Grande-Bretagne puis par les États-Unis, et l’Armée démocratique de Grèce dirigée par le Parti communiste (KKE), avec des bases en Yougoslavie, Albanie et Bulgarie. A l’origine de la scission de la résistance et des combats de décembre 1944 à Athènes, elle a été combattue principalement dans les montagnes du nord et s’est terminée par les victoires du gouvernement à Grammos et Vitsi en août 1949, après des dizaines de milliers de morts et le déracinement d’environ 700 000 personnes."
"Greek governments called the conflict the “bandit war” (Symmoritopolemos) until 1989, when a law recognised it as a civil war. The Democratic Army is often called by its Greek initials, DSE.": "Les gouvernements grecs ont appelé le conflit la guerre de bandit (Symmoritopolemos) jusqu’en 1989, quand une loi l’a reconnu comme une guerre civile. L’armée démocratique est souvent appelée par ses initiales grecques, DSE."
"Many Slavic-speaking Macedonians of northern Greece fought in the Democratic Army, some in the National Liberation Front (NOF), and thousands of them left Greece for good after 1949; the place of this community in the war is still disputed between Greece and North Macedonia.": "De nombreux Macédoniens slaves du nord de la Grèce ont combattu dans l’armée démocratique, certains dans le Front de libération nationale (FNO), et des milliers d’entre eux ont quitté la Grèce pour de bon après 1949 ; la place de cette communauté dans la guerre est toujours contestée entre la Grèce et la Macédoine du Nord."
"Figures for fighters, deaths, children and refugees vary widely between sources and between the two sides’ accounts; the numbers here are approximate.": "Les chiffres pour les combattants, les décès, les enfants et les réfugiés varient considérablement d’une source à l’autre et entre les deux parties."
