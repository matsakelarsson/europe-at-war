"In June 1948 the government army opened Operation Koronis against Grammos, with aircraft and heavy artillery. After two months of fighting the Democratic Army slipped away through Albania to Vitsi and in the autumn beat off attacks there. The split between Tito and Stalin that summer divided the communist camp. The KKE sided with Moscow, its leader Nikos Zachariadis removed Markos Vafiadis and committed the Democratic Army to holding ground in pitched battles. In January 1949 Marshal Alexandros Papagos took command of the government army, which first cleared the Peloponnese and central Greece.": "En juin 1948, l’armée gouvernementale ouvrit l’opération Koronis contre Grammos, avec des avions et de l’artillerie lourde. Après deux mois de combats, l’Armée démocratique s’enfuit en Albanie à Vitsi et, à l’automne, elle battit les attaques. La division entre Tito et Staline cet été-là sépara le camp communiste. En janvier 1949, le maréchal Alexandros Papagos prend le commandement de l’armée gouvernementale, qui défriche d’abord le Péloponnèse et la Grèce centrale."
"In July 1949 Yugoslavia closed its border to the Democratic Army. In August the government army, now far larger and supported by American-supplied aircraft dropping bombs and napalm, launched Operation Pyrsos (“Torch”). It took Vitsi between 10 and 16 August and then Grammos between 24 and 30 August. The surviving guerrillas, several thousand men and women, crossed into Albania, whose government threatened to cut off their supplies if they went back into Greece.": "En juillet 1949, la Yougoslavie a fermé sa frontière avec l’Armée démocratique. En août, l’armée gouvernementale, désormais beaucoup plus grande et soutenue par des avions américains qui lançaient des bombes et du napalm, a lancé l’opération Pyrsos (-Torch) qui a pris Vitsi entre le 10 et le 16 août puis Grammos entre le 24 et le 30 août. Les guérilleros survivants, plusieurs milliers d’hommes et de femmes, sont entrés en Albanie, dont le gouvernement a menacé de couper leurs vivres s’ils retournaient en Grèce."
