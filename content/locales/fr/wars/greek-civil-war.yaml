"When the Germans left Greece in October 1944, the left-wing National Liberation Front (EAM) and its army, ELAS, controlled most of the countryside. The government of national unity under Georgios Papandreou came back from exile with British troops under General Ronald Scobie. A dispute over disarming the resistance armies led EAM’s ministers to resign, and on 3 December police fired on an EAM demonstration in Syntagma Square in Athens, killing more than 28 people. Weeks of fighting followed in Athens and Piraeus between ELAS on one side and government forces and British troops, reinforced and backed by aircraft, on the other. Both sides killed prisoners and hostages.": "Lorsque les Allemands quittèrent la Grèce en octobre 1944, le Front de libération nationale (FLE) de gauche et son armée, ELAS, contrôlèrent la plupart des campagnes. Le gouvernement d’unité nationale sous Georgios Papandreou revint de l’exil avec les troupes britanniques sous le général Ronald Scobie. Le 3 décembre, la police a tiré sur une manifestation de l’EAM à la place Syntagma à Athènes, tuant plus de 28 personnes. Des semaines de combats ont suivi à Athènes et au Pirée entre ELAS d’un côté et les forces gouvernementales et les troupes britanniques, renforcées et soutenues par des avions, de l’autre. Les deux camps ont tué prisonniers et otages."
"ELAS agreed to a truce in January 1945, and by the Varkiza Agreement of 12 February it handed in its weapons in return for an amnesty for political offences and the promise of a plebiscite and elections. The amnesty was hardly kept. In what the left called the White Terror, gendarmes and right-wing bands such as Grivas’s Organisation X killed, beat and imprisoned thousands of leftists, while some former ELAS fighters hid their weapons or fled to Yugoslavia. The KKE boycotted the elections of March 1946, and a plebiscite in September brought back King George II.": "L’ELAS a conclu une trêve en janvier 1945 et, par l’accord de Varkiza du 12 février, elle a remis ses armes en échange d’une amnistie pour des délits politiques et de la promesse d’un plébiscite et d’élections. Dans ce que la gauche a appelé la terreur blanche, les gendarmes et les groupes de droite tels que Grivas Organisation X ont tué, battu et emprisonné des milliers de gauchistes, tandis que d’anciens combattants ELAS ont caché leurs armes ou ont fui vers la Yougoslavie. Le KKE boycotté les élections de mars 1946, et un plébiscite en septembre a ramené le roi George II."
