"On the night before the elections of 31 March 1946, about 30 former ELAS fighters attacked the police station at Litochoro, below Mount Olympus, the event usually taken as the start of the civil war. Armed bands, many formed by men escaping persecution, regrouped in the northern mountains with bases and supplies across the border in Yugoslavia, Albania and Bulgaria. In October 1946 the KKE set up a general headquarters under Markos Vafiadis, renamed the Democratic Army of Greece in December. By the end of the year it had about 16,000 fighters.": "La veille des élections du 31 mars 1946, une trentaine d’anciens combattants de l’ELAS ont attaqué le poste de police de Litochoro, au-dessous du mont Olympe, ce qui a généralement été pris comme début de la guerre civile. En octobre 1946, le KKE a établi un quartier général sous la direction de Markos Vafiadis, rebaptisé Armée démocratique de Grèce en décembre. À la fin de l’année, il comptait environ 16 000 combattants."
"Britain, short of money, told Washington in February 1947 that it could no longer support Greece. On 12 March President Harry Truman asked Congress for aid to Greece and Turkey, and American money, weapons and military advisers took Britain’s place. On 24 December 1947 the KKE announced a Provisional Democratic Government in the mountains, and the government in Athens outlawed the party. The next day the Democratic Army attacked Konitsa, near the Albanian border, hoping to make it a capital, but was beaten off with heavy losses by early January.": "La Grande-Bretagne, à court d’argent, a dit à Washington en février 1947 qu’elle ne pouvait plus soutenir la Grèce. Le 12 mars le président Harry Truman a demandé l’aide du Congrès à la Grèce et à la Turquie, et l’argent américain, les armes et les conseillers militaires ont pris la place de la Grande-Bretagne. Le lendemain, l’armée démocratique a attaqué Konitsa, près de la frontière albanaise, espérant en faire une capitale, mais a été battue avec de lourdes pertes au début du mois de janvier."
