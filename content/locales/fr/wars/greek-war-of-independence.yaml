"Methoni": "Méthoni"
"Ibrahim landed his first troops here, in winter, when the Greeks did not expect a campaign.": "Ibrahim a débarqué ses premières troupes ici, en hiver, quand les Grecs ne s’attendaient pas à une campagne."
"Sphacteria and Navarino": "Sphacteria et Navarino"
"May 1825": "mai 1825"
"The Egyptians took the island guarding Navarino Bay on 8 May and the fortresses soon after.": "Les Egyptiens prirent l’île qui gardait la baie de Navarino le 8 mai et les forteresses peu après."
"1 June 1825": "1er juin 1825"
"Papaflessas and most of his force died trying to stop Ibrahim’s advance into Messenia.": "Papaflessas et la plupart de ses forces sont morts en essayant d’empêcher Ibrahim d’avancer dans Messenia."
"Mills of Lerna": "Milles de Lerna"
"June 1825": "juin 1825"
"Makriyannis and Dimitrios Ypsilantis held the mills outside Nafplio, and Ibrahim turned back to Tripolitsa.": "Makriyannis et Dimitrios Ypsilantis tenaient les moulins à l’extérieur de Nafplio, et Ibrahim retourna à Tripolitsa."
"Ibrahim": "M. Ibrahim"
"Egyptian fleet": "flotte égyptienne"
"Held by Ibrahim’s army, end of 1825 (approximate)": "Tenu par l’armée d’Ibrahim, fin 1825 (approximative)"
"Missolonghi": "Missolonghi"
"April 1825 – December 1826": "avril 1825 – décembre 1826"
"In April 1825 Mehmed Reşid Pasha besieged Missolonghi, the rebels’ stronghold in western Greece, for the third time. Protected by its lagoon and earthworks and supplied by Miaoulis’s ships, the town held out until Ibrahim joined the siege and, in the spring of 1826, took the islets of the lagoon. Starving, the garrison and townspeople tried to break out together on the night of 22–23 April 1826. The besiegers had been warned; perhaps 1,800 got through, most of the rest were killed or enslaved, and some who stayed behind blew up the powder magazine with themselves and their attackers.": "En avril 1825, Mehmed Reşid Pasha assiégea pour la troisième fois Missolonghi, le bastion des rebelles dans l’ouest de la Grèce. Protégé par sa lagune et ses travaux terrestres et alimentés par les navires de Miaoulis, la ville s’arrêta jusqu’à ce que Ibrahim rejoigne le siège et, au printemps de 1826, prit les îlots de la lagune. À la faim, la garnison et les citadins essayèrent de sortir ensemble dans la nuit du 22 au 23 avril 1826. Les assiégeants avaient été avertis ; peut-être que 1 800 personnes passaient par là, la plupart des autres furent tuées ou asservises, et certains qui restèrent derrière firent sauter la poudrière avec eux-mêmes et leurs attaquants."
"The fall of Missolonghi caused an outcry across Europe. Britain and Russia had already agreed, in the Protocol of St Petersburg of 4 April 1826, to mediate for an autonomous Greece. Ibrahim tried to break into the Mani that summer but was beaten back at Vergas and at Diros, where Maniot women helped repel a landing. Reşid marched east and by August besieged the Acropolis of Athens. Georgios Karaiskakis destroyed an Ottoman force at Arachova in November, but every attempt to relieve the Acropolis failed. The Greeks gave command of their army to the British general Sir Richard Church and of their fleet to Lord Cochrane.": "La chute du Missolonghi a provoqué un tollé à travers l’Europe. La Grande-Bretagne et la Russie avaient déjà convenu, dans le Protocole de Saint-Pétersbourg du 4 avril 1826, de servir de médiateur pour une Grèce autonome. Ibrahim a tenté d’entrer par effraction dans le Mani cet été-là mais a été battu à Vergas et à Diros, où les femmes Maniot ont contribué à repousser un débarquement. Georgios Karaiskakis a détruit une force ottomane à Arachova en novembre, mais chaque tentative de soulager l’Acropole a échoué. Les Grecs ont donné le commandement de leur armée au général britannique Sir Richard Church et de leur flotte à Lord Cochrane."
"Third siege of Missolonghi": "Troisième siège de Missolonghi"
"April 1825 – April 1826": "avril 1825 – avril 1826"
"The exodus": "L’exode"
"Night of 22–23 April 1826 (10–11 April Old Style)": "Nuit du 22 au 23 avril 1826 (10 et 11 avril, ancien style)"
"Protocol of St Petersburg": "Protocole de Saint-Pétersbourg"
"4 April 1826, Britain and Russia": "4 avril 1826, Grande-Bretagne et Russie"
"22–23 April 1826": "22–23 avril 1826"
"After almost a year of siege, the defenders’ breakout ended in a massacre. The town became a symbol of the Greek cause in Europe.": "Après près d’un an de siège, la cassure des défenseurs s’est terminée par un massacre. La ville est devenue un symbole de la cause grecque en Europe."
"Vergas": "Vergas"
"June 1826": "juin 1826"
"Some 2,000 Maniots and refugees behind a wall across the coastal plain held off Ibrahim’s army until Kolokotronis attacked it from the rear.": "Quelque 2 000 Maniots et réfugiés derrière un mur à travers la plaine côtière ont retenu l’armée d’Ibrahim jusqu’à ce que Kolokotronis l’attaque de l’arrière."
"Diros": "Diros"
"An Egyptian landing at Diros was driven back to the ships by Maniot men and women.": "Un atterrissage égyptien à Diros a été conduit vers les navires par des hommes et des femmes Maniot."
"from summer 1826": "de l’été 1826"
"Reşid Pasha besieged the Greek garrison on the Acropolis, which held out until June 1827.": "Reşid Pacha assiégea la garnison grecque sur l’Acropole, qui se déroula jusqu’en juin 1827."
"Arachova": "Arachova"
"November 1826": "novembre 1826"
"Karaiskakis trapped an Ottoman column of about 2,000 men below Parnassus and destroyed most of it.": "Karaiskakis a piégé une colonne ottomane d’environ 2 000 hommes sous Parnasse et en a détruit la plupart."
"Reşid Pasha": "Reşid Pasha"
"Navarino": "Navarino"
"May – October 1827": "mai – octobre 1827"
"On 6 May 1827 a Greek army trying to relieve the Acropolis was routed at Phaleron, two days after Karaiskakis had been mortally wounded, and on 5 June the garrison surrendered on terms. The National Assembly at Troezen elected Ioannis Kapodistrias, a Corfiot who had been Russia’s foreign minister, as governor of Greece. By the Treaty of London of 6 July Britain, France and Russia agreed to demand an armistice and to impose one if either side refused. The Greeks accepted, but the Porte rejected the demand, and the allied admirals Edward Codrington, Henri de Rigny and Lodewijk van Heiden were sent to stop supplies reaching Ibrahim.": "Le 6 mai 1827, une armée grecque qui tentait de secourir l’Acropole fut acheminée à Phaleron, deux jours après que Karaiskakis eut été mortellement blessé, et le 5 juin la garnison s’est rendue aux termes. L’Assemblée nationale de Troezen a élu Ioannis Kapodistrias, un Corfiot qui avait été ministre russe des Affaires étrangères, comme gouverneur de Grèce. Par le traité de Londres du 6 juillet, la France et la Russie acceptèrent d’exiger une armistice et d’en imposer une si les deux parties refusaient. Les Grecs acceptèrent, mais la Porte rejeta la demande, et les amirals alliés Edward Codrington, Henri de Rigny et Lodewijk van Heiden furent envoyés pour arrêter les fournitures atteignant Ibrahim."
"The Ottoman and Egyptian fleet lay at anchor in Navarino Bay. On 20 October the 22 allied ships sailed in, and when a boat was fired on near an Egyptian fire ship a general battle began. In about four hours the heavier allied gunnery destroyed the fleet at anchor; of 78 Ottoman and Egyptian vessels just eight remained seaworthy. By one count about 3,000 Ottoman and Egyptian sailors were killed, against 181 allied dead. It was the last great battle fought entirely by sailing ships. George IV called it an “untoward event”, but it ended any chance of crushing the revolt, and in April 1828 Russia went to war with the Ottomans.": "La flotte ottomane et égyptienne se trouvait à l’ancre dans la baie de Navarino. Le 20 octobre, les 22 navires alliés s’embarquèrent, et lorsqu’un bateau fut tiré sur un chaloupe égyptien, une bataille générale commença. En quatre heures environ, la plus lourde fusillade alliée détruisit la flotte à l’ancre ; sur 78 navires ottomans et égyptiens seulement huit demeurèrent en état de navigabilité. C’était la dernière grande bataille menée entièrement par les voiliers. George IV l’a qualifié d’événement « untoward » mais il a mis fin à toute chance d’écraser la révolte, et en avril 1828 la Russie est partie en guerre avec les Ottomans."
"Treaty of London": "Traité de Londres"
"6 July 1827, Britain, France and Russia": "6 juillet 1827, Grande-Bretagne, France et Russie"
"Battle of Navarino": "Bataille de Navarino"
"20 October 1827 (8 October Old Style), allied victory": "20 octobre 1827 (8 octobre Old Style), victoire alliée"
"Losses at Navarino": "Pertes à Navarino"
"70 of 78 Ottoman and Egyptian ships; 181 allied dead": "70 des 78 navires ottomans et égyptiens ; 181 alliés morts"
"Battle of Phaleron": "Bataille de Phaléron"
"6 May 1827": "6 mai 1827"
"Church and Cochrane’s night march on Athens fell apart, and Ottoman cavalry cut down the scattered Greek troops on the plain.": "L’église et Cochrane la nuit marchent sur Athènes s’effondrent, et la cavalerie ottomane coupe les troupes grecques dispersées dans la plaine."
"5 June 1827": "5 juin 1827"
"The garrison marched out under safe conduct, the last Ottoman success of the war.": "La garnison a marché sous la conduite sûre, le dernier succès ottoman de la guerre."
"Troezen": "Troezen"
"April 1827": "avril 1827"
"The Third National Assembly passed a new constitution and chose Kapodistrias as governor.": "La troisième Assemblée nationale a adopté une nouvelle constitution et choisi les Kapodistrias comme gouverneur."
"20 October 1827": "20 octobre 1827"
"British, French and Russian squadrons destroyed the Ottoman and Egyptian fleet at anchor; no allied ship was lost.": "Des escadrons britanniques, français et russes ont détruit la flotte ottomane et égyptienne à l’ancre ; aucun navire allié n’a été perdu."
"Codrington, de Rigny, Heiden": "Codrington, de Rigny, Heiden"
"The French in the Morea and the London Protocol": "Les Français dans la Morea et le Protocole de Londres"
"1828 – February 1830": "1828 – février 1830"
"Kapodistrias arrived in January 1828 and set up his government on Aegina. With Russia now at war with the Ottomans, Codrington agreed with Muhammad Ali at Alexandria in August that the Egyptian army would leave the Peloponnese. A French expeditionary corps of about 15,000 men under General Nicolas-Joseph Maison landed at Petalidi on 29–30 August. Ibrahim embarked his army in September and October, and the French took over Navarino, Methoni, Koroni and Patras and stormed the Castle of the Morea at Rio on 30 October. The French lost about 1,500 men, mostly to fever and dysentery; a scientific commission came with them in 1829.": "Kapodistrias arrive en janvier 1828 et établit son gouvernement à Aegina. Avec la Russie maintenant en guerre avec les Ottomans, Codrington accepte avec Muhammad Ali à Alexandrie en août que l’armée égyptienne quitte le Péloponnèse. Un corps expéditionnaire français d’environ 15 000 hommes sous le général Nicolas-Joseph Maison débarque à Petalidi les 29-30 août. Ibrahim s’embarqua dans son armée en septembre et octobre, et les Français reprirent Navarino, Methoni, Koroni et Patras et prirent l’assaut du château de Morea à Rio le 30 octobre. Les Français perdirent environ 1 500 hommes, principalement à cause de la fièvre et de la dysenterie ; une commission scientifique vint avec eux en 1829."
"Kapodistrias built a regular army, which advanced into Central Greece, and in September 1829 Dimitrios Ypsilantis, Alexander’s brother, won at Petra in Boeotia, the last battle of the war. The Ottoman troops left the land south of the Spercheios. By the Treaty of Adrianople that month the Sultan accepted the powers’ plan for an autonomous Greece. Britain and France, wary of Russian influence, preferred full independence, and on 3 February 1830 the London Protocol recognised Greece as an independent state under the three powers’ protection, with a northern border from the mouth of the Achelous to the mouth of the Spercheios. Crete stayed outside it and was handed to Muhammad Ali.": "En septembre 1829, Dimitrios Ypsilantis, frère d’Alexandre, gagna à Petra en Boeotia la dernière bataille de la guerre. Les troupes ottomanes quittèrent le pays au sud des Spercheios. Par le traité d’Adrianople ce mois-là, le Sultan accepta les pouvoirs du plan pour une Grèce autonome. La Grande-Bretagne et la France, méfiant de l’influence russe, préféraient l’indépendance totale, et le 3 février 1830, le Protocole de Londres reconnaissait la Grèce comme un État indépendant sous les trois pouvoirs, avec une frontière nord de l’embouchure des Achelous à l’embouchure des Spercheios."
"French landing at Petalidi": "Atterrissage français à Petalidi"
"29–30 August 1828": "29–30 août 1828"
"Battle of Petra": "Bataille de Petra"
"September 1829, Greek victory": "Septembre 1829, victoire grecque"
"London Protocol": "Protocole de Londres"
"3 February 1830, Greek independence": "3 février 1830, indépendance grecque"
"Aegina": "Égine"
"January 1828": "janvier 1828"
"Kapodistrias took office here as governor and began building a state, a currency and a regular army.": "Kapodistrias a pris ses fonctions ici en tant que gouverneur et a commencé à construire un État, une monnaie et une armée régulière."
"Petalidi": "Pétalidi"
"General Maison’s corps landed on the Gulf of Messenia, and Ibrahim agreed to leave.": "Le corps de la Maison générale débarqua sur le golfe de Messenia, et Ibrahim accepta de partir."
"Navarino, Methoni and Koroni": "Navarino, Methoni et Koroni"
"October 1828": "octobre 1828"
"The Egyptian and Ottoman garrisons handed the fortresses over to the French.": "Les garnisons égyptienne et ottomane ont remis les forteresses aux Français."
"Castle of the Morea": "Château de Morea"
"30 October 1828": "30 octobre 1828"
"The French bombarded and took the fortress at Rio, the last Ottoman stronghold in the Peloponnese.": "Les Français bombardèrent et prirent la forteresse à Rio, le dernier bastion ottoman du Péloponnèse."
"September 1829": "septembre 1829"
"Ypsilantis’s regular troops defeated Aslan Bey’s force, which agreed to leave Central Greece in return for free passage.": "Les troupes régulières d’Ypsilantis ont vaincu la force d’Aslan Bey, qui a accepté de quitter la Grèce centrale en échange du libre passage."
"Maison": "Maison"
"The 1832 borders and King Otto": "Les frontières de 1832 et le roi Otto"
"1831 – 1833": "1831 – 1833"
"Kapodistrias ruled with a firm hand and made many enemies. In August 1831, during a revolt of the Hydriots, Miaoulis blew up the flagship Hellas and other ships at Poros rather than let them fall into government hands. On 9 October 1831 Kapodistrias was shot and stabbed at a church door in Nafplio by the brother and son of Petros Mavromichalis, whom he had imprisoned. Greece slid into civil war between the government of his brother Augustinos and the Roumeliot captains, while the powers looked for a king. Prince Leopold of Saxe-Coburg had turned the throne down in 1830, objecting among other things to the narrow frontier.": "En août 1831, lors d’une révolte des Hydriots, Miaoulis fit exploser le vaisseau amiral Hellas et d’autres navires à Poros plutôt que de les laisser tomber entre les mains du gouvernement. Le 9 octobre 1831, Kapodistrias fut abattu et poignardé à la porte d’une église de Nafplio par le frère et fils de Petros Mavromichalis, qu’il avait emprisonné. La Grèce passa à la guerre civile entre le gouvernement de son frère Augustins et les capitaines de Roumeliot, tandis que les pouvoirs cherchèrent un roi. Le prince Léopold de Saxe-Coburg avait refusé le trône en 1830, s’opposant entre autres à la frontière étroite."
"At the London Conference the powers chose Otto, the 17-year-old son of King Ludwig I of Bavaria, and by a treaty of 7 May 1832 made Greece a kingdom under their guarantee. By the Treaty of Constantinople of 21 July 1832 the Sultan accepted a wider border on the line from the Gulf of Arta to the Gulf of Volos, in return for an indemnity of 40 million piastres. Otto landed at Nafplio on 6 February 1833 with a Bavarian regency and some 3,500 Bavarian troops. The new kingdom had about 800,000 people, less than a third of the Greeks of the Ottoman Empire, and the hope of uniting the rest, the Megali Idea, long shaped its politics.": "Lors de la Conférence de Londres, les pouvoirs ont choisi Otto, le fils de 17 ans du roi Ludwig Ier de Bavière, et par un traité du 7 mai 1832 a fait de la Grèce un royaume sous leur garantie. Par le traité de Constantinople du 21 juillet 1832, le Sultan accepta une frontière plus large sur la ligne allant du golfe d’Arta au golfe de Volos, en échange d’une indemnité de 40 millions de piastres. Otto débarqua à Nafplio le 6 février 1833 avec une régence bavaroise et quelque 3 500 troupes bavaroises. Le nouveau royaume comptait environ 800 000 habitants, moins d’un tiers des Grecs de l’Empire ottoman, et l’espoir d’unir le reste, l’Idée Megali, a longtemps façonné sa politique."
"Kapodistrias assassinated": "Kapodistrias assassiné"
"9 October 1831 (27 September Old Style)": "9 octobre 1831 (27 septembre ancien style)"
"Treaty of Constantinople": "Traité de Constantinople"
"21 July 1832, Arta–Volos border": "21 juillet 1832, frontière Arta–Volos"
"Otto lands at Nafplio": "Otto débarque à Nafplio"
"6 February 1833 (25 January Old Style)": "6 février 1833 (25 janvier Old Style)"
"Poros": "Poros"
"August 1831": "août 1831"
"Miaoulis set fire to the frigate Hellas and other ships of the fleet to keep them from Kapodistrias’s government.": "Miaoulis a mis le feu à la frégate Hellas et autres navires de la flotte pour les garder du gouvernement Kapodistrias."
"1831–1833": "1831–1833"
"Kapodistrias was assassinated here on 9 October 1831. King Otto landed here on 6 February 1833, and the town was the capital until Athens took its place in 1834.": "Kapodistrias y fut assassiné le 9 octobre 1831. Le roi Otto y débarqua le 6 février 1833 et la ville fut la capitale jusqu’à ce qu’Athènes prenne sa place en 1834."
"Arta": "Arta"
"The border of 1832 ran from the Gulf of Arta, leaving the town itself in Ottoman hands.": "La frontière de 1832 s’étendait du golfe d’Arta, laissant la ville elle-même entre les mains des Ottomans."
"Volos": "Volos"
"The eastern end of the Arta–Volos line; Thessaly stayed Ottoman until 1881.": "L’extrémité est de la ligne Arta–Volos ; Thessalie resta Ottoman jusqu’en 1881."
"21 July 1832": "21 juillet 1832"
"The ambassadors of Britain, France and Russia and the Ottoman government agreed the Arta–Volos border.": "Les ambassadeurs de la Grande-Bretagne, de la France et de la Russie ainsi que le gouvernement ottoman se sont mis d’accord sur la frontière Arta-Volos."
"Added to Greece by the Arta–Volos line, 1832 (approximate)": "Ajouté à la Grèce par la ligne Arta-Volos, 1832 (approximation)"
