"March – October 1821": "mars – octobre 1821"
"The Peloponnese, the Morea, rose in late March 1821, while its governor, Hurshid Pasha, and many of his troops were away besieging Ali Pasha at Ioannina. The Maniots under Petros Mavromichalis declared war at Areopoli and, with Theodoros Kolokotronis and the priest Papaflessas, took Kalamata on 4 April; the story that Metropolitan Germanos raised the banner at Agia Lavra on 25 March (Julian) is doubted by historians. Within weeks the Greeks held the countryside. Muslims fled into the fortresses of Patras, Acrocorinth, Nafplio, Monemvasia, Navarino and Tripolitsa, and thousands who could not reach them were killed.": "La Péloponnèse, la Morea, s’éleva à la fin de mars 1821, tandis que son gouverneur, Hurshid Pacha, et plusieurs de ses troupes assiégèrent Ali Pacha à Ioannina. Les Maniots sous Petros Mavromichalis ont déclaré la guerre à Areopoli et, avec Theodoros Kolokotronis et le prêtre Papaflessas, a pris Kalamata le 4 avril ; l’histoire que le métropolite Germanos a élevé la bannière à Agia Lavra le 25 mars (Julienne) est douté par les historiens. Les musulmans ont fui dans les forteresses de Patras, Acrocorinthe, Nafplio, Monemvasia, Navarino et Tripolitsa, et des milliers de personnes qui ne pouvaient pas les atteindre ont été tuées."
"The rising spread to Central Greece and to the islands of Hydra, Spetses and Psara, whose merchant ships, fitted with light guns and fire ships, became the Greek navy. Athanasios Diakos was captured at Alamana and executed, but Odysseas Androutsos held up the Ottoman advance at the Gravia inn, and a relief army was destroyed at Vasilika in August. In the Morea Kolokotronis besieged Tripolitsa, the provincial capital, and beat off a sortie at Valtetsi in May. On 5 October the besiegers broke in and for days slaughtered the town’s Muslim and Jewish inhabitants; estimates of the dead range from about 6,000 to 8,000 or more.": "La montée s’est étendue à la Grèce centrale et aux îles d’Hydra, Spetses et Psara, dont les navires marchands, équipés de canons légers et de lance-feu, sont devenus la marine grecque. Athanasios Diakos a été capturé à Alamana et exécuté, mais Odyssées Androutos a retenu l’avance ottomane à l’auberge Gravia, et une armée de secours a été détruite à Vasilika en août. Dans la Morea Kolokotronis assiégé Tripolitsa, la capitale provinciale, et battu d’une sortie à Valtetsi en mai. Le 5 octobre les assiégeants sont entrés et pendant des jours massacrés les habitants musulmans et juifs de la ville ; les estimations des morts varient d’environ 6 000 à 8 000 ou plus."
