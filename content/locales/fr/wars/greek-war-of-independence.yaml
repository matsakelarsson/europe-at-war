# Some French text was translated automatically.
"Greek War of Independence": "Guerre d’indépendance grecque"
"A war in which Greek revolutionaries rose against Ottoman rule in 1821 and, after years of fighting, massacres on both sides and the near collapse of the revolt under Egyptian attack, won independence through the intervention of Britain, France and Russia at Navarino in 1827 and in the Morea in 1828. The London Protocol recognised Greece in 1830, and in 1832 its border was fixed on the Arta–Volos line, with Otto of Bavaria as king.": "Une guerre dans laquelle les révolutionnaires grecs se sont levés contre la domination ottomane en 1821 et, après des années de combats, des massacres des deux côtés et le quasi-effondrement de la révolte sous l’attaque égyptienne, a gagné l’indépendance par l’intervention de la Grande-Bretagne, de la France et de la Russie à Navarino en 1827 et dans la Morea en 1828. Le Protocole de Londres reconnaît la Grèce en 1830 et, en 1832, sa frontière est fixée à la ligne Arta–Volos, avec Otto de Bavière comme roi."
"Dates are New Style (Gregorian). The Greeks used the Julian calendar, then twelve days behind, so Greek accounts date the start of the rising in the Peloponnese to 25 March 1821 (6 April New Style), celebrated as Independence Day, and the exodus from Missolonghi to 10 April 1826. Some dates are given in both styles.": "Les Grecs ont utilisé le calendrier julien, puis douze jours de retard, donc les comptes grecs datent le début de la montée dans le Péloponnèse au 25 mars 1821 (6 avril nouveau style), célébré comme Jour de l’Indépendance, et l’exode de Missolonghi au 10 avril 1826. Certaines dates sont données dans les deux styles."
"Numbers of dead in the massacres, Greek and Ottoman alike, are disputed; the figures given are estimates.": "Le nombre de morts dans les massacres, grecs comme ottomans, est contesté ; les chiffres donnés sont des estimations."
"The Morea is the Peloponnese, Roumeli is Central Greece, Tripolitsa is today’s Tripoli, Navarino is Pylos and Missolonghi is Mesolongi.": "La Morea est la Péloponnèse, Roumeli est la Grèce centrale, Tripolitsa est aujourd'hui."
"Ali Pasha’s revolt of 1820–1822, Tudor Vladimirescu’s rising in Wallachia in 1821 and the Russo-Turkish War of 1828–1829 have their own entries.": "La révolte d’Ali Pacha de 1820–1822, la montée de Tudor Vladimirescu en Wallachie en 1821 et la guerre russo-turque de 1828–1829 ont leurs propres entrées."
