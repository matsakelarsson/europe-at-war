"1823 – 1825": "1823 – 1825"
"With the immediate danger past, the Greek leaders fell out. The captains and notables of the Peloponnese around Kolokotronis opposed the islanders and Roumeliots, and by early 1824 there were rival governments at Tripolitsa and Kranidi. The government of Georgios Kountouriotis won two short civil wars in 1824, helped by loans raised in London, and in early 1825 imprisoned Kolokotronis on Hydra. Lord Byron, who had come to Greece with money and supplies, died of fever at Missolonghi on 19 April 1824. Sultan Mahmud II, meanwhile, turned to Muhammad Ali of Egypt, whose French-trained army had already crushed the rising in Crete.": "Les capitaines et les notables du Péloponnèse autour de Kolokotronis s’opposèrent aux insulaires et aux Roumeliots, et au début de 1824 il y avait des gouvernements rivaux à Tripolitsa et à Kranidi. Le gouvernement de Georgios Kountouriotis a remporté deux guerres civiles courtes en 1824, aidé par des prêts levés à Londres, et au début de 1825 emprisonné Kolokotronis sur Hydra. Lord Byron, qui était venu en Grèce avec de l’argent et des fournitures, est mort de fièvre à Missolonghi le 19 avril 1824. Sultan Mahmud II, entre-temps, se tourna vers Muhammad Ali d’Egypte, dont l’armée formée par les Français avait déjà écrasé la montée en Crète."
"In June 1824 an Egyptian fleet took Kasos, and in the summer an Ottoman fleet stormed Psara; thousands of islanders were killed or enslaved, and the last defenders blew up the island’s fort with themselves and their attackers. A Greek victory at Gerontas in September saved Samos. In February 1825 Muhammad Ali’s son Ibrahim Pasha landed at Methoni. He took Sphacteria and Navarino in May, killed Papaflessas and his men at Maniaki on 1 June, and entered Tripolitsa and Argos, but was held at the mills of Lerna outside Nafplio. The government released Kolokotronis, but by the end of the year Ibrahim held much of the western Peloponnese and was burning the countryside.": "En juin 1824, une flotte égyptienne prit Kasos et, en été, une flotte ottomane s’empare de Psara ; des milliers d’habitants de l’île sont tués ou asservis, et les derniers défenseurs font sauter le fort de l’île avec eux-mêmes et leurs attaquants. Une victoire grecque à Gerontas en septembre sauve Samos. Il a pris Sphacteria et Navarino en mai, tué Papaflessas et ses hommes à Maniaki le 1er juin, et est entré dans Tripolitsa et Argos, mais a été tenu aux moulins de Lerna en dehors de Nafplio. Le gouvernement a libéré Kolokotronis, mais à la fin de l’année Ibrahim tenait une grande partie du Péloponnèse occidental et brûlait la campagne."
