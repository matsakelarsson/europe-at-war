"In January 1822 the First National Assembly at Epidaurus declared Greece independent and adopted a provisional constitution, with the Phanariot Alexandros Mavrokordatos at the head of the executive. In March armed men from Samos landed on Chios and roused part of the population. In April the Kapudan Pasha, Nasuhzade Ali Pasha, landed troops who over the following weeks killed or enslaved most of the island’s Greeks; estimates of the dead run from about 25,000 upwards, and tens of thousands more were sold as slaves. On the night of 18–19 June Konstantinos Kanaris steered a fire ship against the Ottoman flagship off Chios, and the Kapudan Pasha died with most of those on board.": "En janvier 1822, la première Assemblée nationale d’Epidaurus déclare la Grèce indépendante et adopte une constitution provisoire, avec le Phanariot Alexandros Mavrokordatos à la tête de l’exécutif. En avril, les Kapudan Pacha, Nasuhzade Ali Pacha, débarquèrent des troupes qui, au cours des semaines suivantes, tuèrent ou asservirent la plupart des Grecs de l’île ; selon les estimations, les morts passeraient d’environ 25 000 à la hausse, et des dizaines de milliers d’autres furent vendus comme esclaves. Dans la nuit du 18 au 19 juin, Konstantinos Kanaris dirigea un navire de tir contre le vaisseau ottoman au large de Chios, et le Kapudan Pacha mourut avec la plupart de ceux à bord."
"In the west, Mavrokordatos’s army and its battalion of foreign volunteers were routed at Peta near Arta on 16 July. That month Mahmud Dramali Pasha marched south from Larissa with more than 20,000 men, took Corinth and reached Argos, but the Greeks had burned the crops and held the hills. Short of food and water, Dramali turned back, and on 6–8 August Kolokotronis’s men ambushed his army in the Dervenakia defile and the passes near it, destroying much of it and taking its baggage. The Acropolis of Athens had surrendered to the Greeks in June, Nafplio followed in December, and Missolonghi beat off a first siege.": "Dans l’ouest, l’armée de Mavrokordatos et son bataillon de volontaires étrangers ont été acheminés à Peta près d’Arta le 16 juillet. Ce mois-là, Mahmud Dramali Pacha marchait au sud de Larissa avec plus de 20 000 hommes, prit Corinthe et atteignit Argos, mais les Grecs avaient brûlé les récoltes et tenu les collines. À court de nourriture et d’eau, Dramali se retourna, et les 6-8 août Kolokotronis a pris son armée en embuscade dans la souillure de Dervenakia et les cols près d’elle, détruisant une grande partie de celle-ci et prenant ses bagages. L’Acropole d’Athènes s’était rendue aux Grecs en juin, Nafplio suivit en décembre, et Missolonghi battit un premier siège."
