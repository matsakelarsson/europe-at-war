"Ypsilantis in the Danubian principalities": "Ypsilantis dans les principautés danubiennes"
"March – June 1821": "mars – juin 1821"
"The Filiki Eteria (Society of Friends), a secret society founded by three Greek merchants in Odessa in 1814, planned a rising of the Balkan Christians against Ottoman rule. In 1820 it chose as its leader Alexander Ypsilantis, a Phanariot Greek and general in the Russian army. On 6 March 1821 he crossed the Prut from Russian Bessarabia into Moldavia with a few hundred followers and at Iași called on Greeks and all Christians to rise, hinting at Russian support. Michael Soutzos, the prince of Moldavia and himself a member of the society, put his guard at Ypsilantis’s disposal, while Eterists killed Ottoman soldiers and merchants at Galați and elsewhere.": "La Filiki Eteria (Société des Amis), société secrète fondée par trois marchands grecs à Odessa en 1814, planifia une montée des chrétiens balkaniques contre la domination ottomane. En 1820, elle choisit comme chef Alexandre Ypsilantis, un Phanariot grec et général dans l’armée russe. Le 6 mars 1821, il traversa le Prut de la Bessarabie russe en Moldavie avec quelques centaines d’adeptes et à Iași appela les Grecs et tous les chrétiens à s’élever, laissant entendre que les Russes soutenaient. Michael Soutzos, prince de la Moldavie et lui-même membre de la société, mit sa garde à la disposition d’Ypsilantis, tandis que les Etéristes tuèrent des soldats et des marchands ottomans à Galați et ailleurs."
"Tsar Alexander I disowned the rising and struck Ypsilantis off the army list, and the Patriarch in Constantinople excommunicated him. In Bucharest Ypsilantis fell out with Tudor Vladimirescu, leader of a rising of Wallachian peasants and Pandurs, whom Eterists seized and killed on 7 June. Ottoman troops had entered the principalities in May. At Drăgășani on 19 June they routed Ypsilantis’s army and destroyed the Sacred Band, a corps of young Greek volunteers. Ypsilantis fled to Austria and was held prisoner there until 1827. In Constantinople Patriarch Gregory V, though he had condemned the revolt, was hanged on Easter Sunday, 22 April, and many Greeks there and in Smyrna were killed.": "A Bucarest, Ypsilantis tomba avec Tudor Vladimirescu, chef d’une montée des paysans et des Pandurs wallachiens, que les Etéristes saisirent et tuèrent le 7 juin. Les troupes ottomanes étaient entrées dans les principautés en mai. Au Drăgășani, le 19 juin, ils ont roué l’armée d’Ypsilantis et détruit la bande sacrée, un corps de jeunes volontaires grecs. Ypsilantis s’est enfui en Autriche et y a été détenu jusqu’en 1827. Dans Constantinople patriarche Grégoire V, bien qu’il ait condamné la révolte, a été pendu le dimanche de Pâques, 22 avril, et beaucoup de Grecs là et à Smyrne ont été tués."
