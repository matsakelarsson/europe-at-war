# French translations of the catalogue text (wave 12); step bodies follow later.
Gudit and the end of Aksum: Gudit et la fin d’Aksoum
? The tradition of a queen who destroyed the last Christian kingdom of Aksum in the second half of the 10th century. Ethiopian tradition calls her Gudit or Yodit (Judith) and remembers her as a non-Christian, in some versions Jewish, who burned the churches of Aksum, sacked the monastery of Debre Damo, killed the princes of the royal house and ruled for about forty years. Two outside sources seem to speak of her. The Arab geographer Ibn Hawqal, writing between about 943 and 977, says that a woman had ruled the land of the Habasha for many years, had killed their king, called the hadani, and still held her own country. The History of the Patriarchs of Alexandria tells of a king of Abyssinia who wrote to King George II of Makuria, in the time of Patriarch Philotheos (979–1003), that a queen of the Bani al-Hamwiya had ravaged his country, burned its churches and driven him from place to place, and asked him to obtain a new bishop. Who she was is not known. Scholars have proposed a queen of Damot, a non-Christian kingdom in the south (Carlo Conti Rossini), a Cushitic-speaking queen from the Lake Hayq region (Tekeste Negash) and a convert to Judaism; Steven Kaplan and others doubt that she was Jewish. The sources are few, late and contradictory, and the identification of the Arab writers’ queen with the Gudit of tradition is not certain. Most historians agree that Aksum’s power ended in this period and that the Zagwe dynasty rose in Lasta in the next century and a half.
: La tradition d’une reine qui détruisit le dernier royaume chrétien d’Aksoum dans la seconde moitié du Xe siècle. La tradition éthiopienne l’appelle Gudit ou Yodit (Judith) et garde d’elle le souvenir d’une non-chrétienne, juive selon certaines versions, qui incendia les églises d’Aksoum, pilla le monastère de Debre Damo, tua les princes de la maison royale et régna une quarantaine d’années. Deux sources extérieures semblent parler d’elle. Le géographe arabe Ibn Hawqal, qui écrivait entre 943 environ et 977, rapporte qu’une femme régnait depuis de nombreuses années sur le pays des Habasha, qu’elle avait tué leur roi, appelé le hadani, et qu’elle tenait toujours son propre pays. L’Histoire des patriarches d’Alexandrie évoque un roi d’Abyssinie qui écrivit au roi Georges II de Makurie, au temps du patriarche Philothée (979–1003), qu’une reine des Bani al-Hamwiya avait ravagé son pays, incendié ses églises et l’avait pourchassé de place en place, et qui lui demanda de lui obtenir un nouvel évêque. On ignore qui elle était. Les chercheurs ont proposé une reine du Damot, royaume non chrétien du sud (Carlo Conti Rossini), une reine de langue couchitique de la région du lac Hayq (Tekeste Negash) et une convertie au judaïsme ; Steven Kaplan et d’autres doutent qu’elle ait été juive. Les sources sont rares, tardives et contradictoires, et l’identification de la reine des auteurs arabes à la Gudit de la tradition n’est pas certaine. La plupart des historiens s’accordent à dire que la puissance d’Aksoum prit fin à cette époque et que la dynastie Zagoué s’éleva dans le Lasta au cours du siècle et demi suivant.
