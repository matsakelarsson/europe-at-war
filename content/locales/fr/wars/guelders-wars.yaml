"Guelders Wars": "Guerres de Guelders"
"Forty years of intermittent war between the dukes of Guelders and the Habsburg rulers of the Netherlands. Charles of Egmond, who had won back his duchy in 1492, fought Philip the Fair, Margaret of Austria and Charles V with French support, and for a time held Groningen, Friesland and the lands of Utrecht. The wars were mostly raids, ambushes and sieges rather than battles, but civilians suffered badly; the Guelders commander Maarten van Rossum sacked The Hague in 1528 and besieged Antwerp in 1542. Charles V gradually took Friesland, Utrecht and Groningen, and after he destroyed the town of Düren in 1543, Duke William of Jülich-Cleves gave up Guelders and Zutphen in the Treaty of Venlo, bringing all the northern Low Countries under Habsburg rule.": "Quarante ans de guerre intermittente entre les ducs de Guelders et les dirigeants des Habsbourg aux Pays-Bas. Charles d’Egmond, qui avait remporté son duché en 1492, a combattu Philippe la Foire, Margaret d’Autriche et Charles V avec le soutien français, et pendant un temps tenu Groningen, Friesland et les terres d’Utrecht. Les guerres étaient surtout des raids, des embuscades et des sièges plutôt que des batailles, mais les civils souffraient gravement ; le commandant Guelders Maarten van Rossum lança La Haye en 1528 et assiégea Anvers en 1542. Charles V prit peu à peu Friesland, Utrecht et Groningen, et après avoir détruit la ville de Düren en 1543, le duc William de Jülich-Cleves abandonna Guelders et Zutphen dans le traité de Venlo, faisant régner tous les pays bas du nord sous Habsbourg."
"Guelders had been sold to Charles the Bold of Burgundy in 1473 and passed to the Habsburgs in 1477. After Charles of Egmond’s death in 1538 the estates of Guelders chose William of Jülich-Cleves-Berg as duke.": "Guelders avait été vendu à Charles le Bold de Bourgogne en 1473 et passé aux Habsbourg en 1477. Après la mort de Charles d’Egmond, en 1538, les domaines de Guelders ont choisi William de Jülich-Cleves-Berg comme duc."
