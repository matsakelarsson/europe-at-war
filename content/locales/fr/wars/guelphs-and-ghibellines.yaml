"Guelph and Ghibelline wars in Tuscany": "Les guerres de Guelph et de Ghibelline en Toscane"
"The wars between the Guelph (papal and Angevin) and Ghibelline (imperial) parties in Tuscany after the death of Frederick II, in which Guelph Florence fought Ghibelline Siena, Arezzo, Pisa and Lucca. The Ghibellines won at Montaperti in 1260 and again under Uguccione della Faggiuola and Castruccio Castracani at Montecatini (1315) and Altopascio (1325), but the Guelphs’ victories after 1266 and at Campaldino in 1289 made Florence the leading power in Tuscany.": "Les guerres entre les parties de Guelph (papal et Angevin) et de Ghibelline (impériale) en Toscane après la mort de Frédéric II, dans lesquelles Guelph Florence combattit Ghibelline Sienne, Arezzo, Pise et Lucques. Les Ghibellines remportent à Montaperti en 1260 et de nouveau sous Uguccione della Faggiuola et Castruccio Castracani à Montecatini (1315) et Altopascio (1325), mais les victoires de Guelph après 1266 et à Campaldino en 1289 font de Florence la première puissance en Toscane."
"The parties took their names from the Welf dynasty and the Hohenstaufen castle of Waiblingen. In Tuscany they were as much about rivalries between cities and feuds between families as about pope and emperor, and the losing party in a city was usually exiled.": "Les partis ont pris leurs noms de la dynastie Welf et du château Hohenstaufen de Waiblingen. En Toscane, ils étaient autant sur les rivalités entre villes et querelles entre familles que sur le pape et l’empereur, et le parti perdant dans une ville était généralement exilé."
"Cities changed sides. Siena was Ghibelline until 1269–1270 and Guelph afterwards; Lucca was Guelph until Uguccione della Faggiuola and Castruccio Castracani ruled it (1314–1328). Arezzo and Pisa were the main Ghibelline cities.": "Les villes changent de camp. Sienne est Ghibelline jusqu’en 1269–1270 et Guelph après ; Lucca est Guelph jusqu’à Uguccione della Faggiuola et Castruccio Castracani la dirige (1314–1328). Arezzo et Pise sont les principales villes Ghibellines."
"The struggles in Lombardy, Romagna and the March of Treviso, and the split of Florence’s Guelphs into Whites and Blacks that exiled Dante in 1302, are not told here.": "Les luttes de Lombardie, de Romagne et de la Marche de Trévise, ainsi que la scission des Guelphs de Florence en Blancs et Noirs qui exilèrent Dante en 1302, ne sont pas racontées ici."
