"1310–1328": "1310–1328"
"The Ghibellines’ hopes revived when the King of the Romans, Henry VII, came to Italy in 1310 to be crowned emperor. Florence led the resistance. Henry besieged it in vain in the autumn of 1312 and died near Siena in August 1313, as he was preparing to attack Robert of Anjou, King of Naples. His captain Uguccione della Faggiuola became lord of Pisa and, in 1314, of Lucca. On 29 August 1315, at Montecatini, he routed the army of Florence and its Guelph allies, commanded by Robert’s brother Philip of Taranto; Philip’s brother Peter and his son Charles were among the dead.": "Les espoirs de Ghibellines ont repris lorsque le Roi des Romains, Henri VII, est venu en Italie en 1310 pour être couronné empereur. Florence a dirigé la résistance. Henry l’a assiégé en vain à l’automne de 1312 et est mort près de Sienne en août 1313, alors qu’il se préparait à attaquer Robert d’Anjou, roi de Naples. Son capitaine Uguccione della Faggiuola devint seigneur de Pise et, en 1314, de Lucques. Le 29 août 1315, à Montecatini, il dirigea l’armée de Florence et ses alliés de Guelph, commandés par le frère de Robert Philippe de Tarente ; le frère de Philip Pierre et son fils Charles étaient parmi les morts."
"In 1316 Pisa and Lucca threw out Uguccione, and Lucca came under one of his captains, Castruccio Castracani, a gifted soldier who built up a strong state in western Tuscany. On 23 September 1325 at Altopascio he beat a large Florentine army under the Catalan Ramon de Cardona, who was taken prisoner, and raided up to Florence’s walls, holding races outside its gates in mockery. Florence put itself under Robert’s son Charles of Calabria. The emperor Louis IV made Castruccio Duke of Lucca in 1327, but Castruccio died of fever on 3 September 1328, and his state fell apart.": "En 1316 Pise et Lucca jetèrent Uguccione, et Lucca tomba sous l’un de ses capitaines, Castruccio Castracani, un soldat doué qui bâtit un État fort dans l’ouest de la Toscane. Le 23 septembre 1325 à Altopascio, il battit une grande armée florentine sous le Ramon de Cardona catalan, qui fut fait prisonnier, et fit des raids jusqu’aux murs de Florence, tenant des courses hors de ses portes en moquerie. Florence se mit sous Robert Charles fils de Calabre. L’empereur Louis IV fit duc Castruccio de Lucques en 1327, mais Castruccio mourut de fièvre le 3 septembre 1328, et son état s’écroula."
