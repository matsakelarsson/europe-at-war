"1250–1266": "1250–1266"
"After Frederick II’s death the struggle between Guelphs and Ghibellines went on in every city of Tuscany, where it merged with family feuds and rivalries between neighbouring towns. In Florence a new popular government took power in 1250, and in 1258 the Guelphs drove out the leading Ghibelline families, headed by the Uberti, who went to Siena. Siena, Florence’s old rival, was Ghibelline and looked for help to Frederick’s son Manfred, who had made himself King of Sicily in 1258 and sent it German cavalry.": "Après la mort de Frédéric II, la lutte entre Guelphs et Ghibellines se poursuivit dans toutes les villes de Toscane, où elle fusionna avec des querelles familiales et des rivalités entre les villes voisines. À Florence, un nouveau gouvernement populaire prit le pouvoir en 1250, et en 1258 les Guelphs chassaient les familles Ghibellines principales, dirigées par les Ubertis, qui allèrent à Sienne. Sienne, l’ancien rival de Florence, était Ghibellline et cherchait de l’aide à Frédéric fils Manfred, qui s’était fait roi de Sicile en 1258 et lui avait envoyé la cavalerie allemande."
"In 1260 Florence and its Guelph allies, Lucca among them, marched on Siena with a large army. On 4 September, at Montaperti on the Arbia, the Sienese, the Florentine exiles under Farinata degli Uberti and Manfred’s Germans routed them. By tradition the battle turned when Bocca degli Abati, a Ghibelline in the Florentine ranks, cut off the hand of the standard-bearer. Thousands were killed or captured and the Florentine carroccio was taken. The Guelphs fled Florence, and at a meeting of the Ghibelline cities at Empoli, Farinata alone spoke against razing it. After Manfred fell at Benevento in 1266, the Guelphs returned to Florence for good.": "En 1260, Florence et ses alliés de Guelph, Lucques parmi eux, marchèrent sur Sienne avec une grande armée. Le 4 septembre, à Montaperti, sur l’Arbia, les Siennois, les exilés florentins sous Farinata degli Uberti et Manfred, les Allemands les roulèrent. Par tradition, la bataille tourna quand Bocca degli Abati, une Ghibelline dans les rangs florentins, coupa la main du porte-étendard. Des milliers furent tués ou capturés et le carroccio florentin fut pris. Après la chute de Manfred à Benevento en 1266, les Guelph retournèrent pour de bon à Florence."
