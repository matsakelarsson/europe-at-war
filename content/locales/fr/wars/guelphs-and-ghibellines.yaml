"1267–1289": "1267–1289"
"With Charles of Anjou, the papacy’s champion and now King of Sicily, as their protector, the Guelphs took over most of Tuscany. In June 1269 the Florentines and French knights beat the Sienese at Colle di Val d’Elsa, where Siena’s Ghibelline leader Provenzan Salvani was killed, and Siena itself soon came under Guelph rule. Pisa and Arezzo remained the Ghibellines’ strongholds. Pisa was crippled by its defeat by Genoa at Meloria in 1284, and the Guelph cities joined in the war against it. In Arezzo the Ghibelline nobles, led by the warlike bishop Guglielmino degli Ubertini, drove out the Guelphs in 1287.": "Avec Charles d’Anjou, le champion de papauté et maintenant roi de Sicile, comme leur protecteur, les Guelph ont pris en charge la majeure partie de la Toscane. En juin 1269, les Florentines et les chevaliers français battent les Siennois à Colle di Val d=Elsa, où le leader de Sienne Ghibelline Provenzan Salvani est tué, et Sienne elle-même arrive bientôt sous la domination de Guelph. Pise et Arezzo demeurèrent les bastions des Ghibellines. Pise fut paralysée par sa défaite par Gênes à Meloria en 1284, et les villes de Guelph s’unirent à la guerre contre elle. À Arezzo, les nobles des Ghibellines, dirigés par l’évêque guerrière Guglielmino degli Ubertini, chassaient les Guelph en 1287."
"In June 1289 Florence and its Guelph allies, under the Angevin captain Amerigo of Narbonne, marched over the hills into the Casentino against Arezzo. On 11 June they met the Aretines on the plain of Campaldino below Poppi. The Ghibelline cavalry charged and drove back the Florentine front line, in which the young Dante Alighieri rode, but the Guelph infantry held, and a flank attack by the reserve under Corso Donati decided the day. Bishop Guglielmino and Buonconte da Montefeltro were among the many Aretines killed. Ghibelline power in Tuscany never fully recovered.": "En juin 1289, Florence et ses alliés de Guelph, sous le capitaine Angevin Amerigo de Narbonne, marchèrent sur les collines jusqu’au Casentino contre Arezzo. Le 11 juin, ils rencontrèrent les Aretines dans la plaine de Campaldino, au-dessous de Poppi. La cavalerie de Ghibelline chargea et repoussa la ligne de front de Florentine, dans laquelle le jeune Dante Alighieri roulait, mais l’infanterie de Guelph tenu, et une attaque du flanc par la réserve sous Corso Donati décida le jour. Mgr Guglielmino et Buonconte da Montefeltro furent parmi les nombreux Aretins tués."
