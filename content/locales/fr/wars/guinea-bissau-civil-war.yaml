# French translations of the catalogue text (wave 13); step bodies follow later.
Guinea-Bissau Civil War: Guerre civile de Guinée-Bissau
? The war between President João Bernardo “Nino” Vieira and a military junta led by his former chief of staff, Brigadier Ansumane Mané. Vieira had suspended Mané in January 1998, accusing him of letting weapons from army depots reach the separatist rebels of Casamance in neighbouring Senegal. On 7 June 1998, the day after Vieira dismissed Mané and named a successor, troops loyal to him seized barracks and the airport in Bissau, and most of the army and many veterans of the independence war joined them. About 1,300 Senegalese and 400 Guinean troops intervened on Vieira’s side, and the fighting in and around Bissau drove some 200,000 people from the capital and 350,000 from their homes in all; more than 3,000 foreigners were evacuated. A truce in July and a ceasefire in August were followed by the Abuja accord of 1 November 1998, which provided for a government of national unity, elections and the replacement of the Senegalese and Guinean troops by an ECOMOG force from Togo, Benin, Niger and the Gambia. Fighting resumed briefly in early 1999; the foreign troops left in March, and in early May, in a dispute over disarmament, the junta attacked again and overthrew Vieira on 7 May 1999. He took refuge in the Portuguese embassy, signed an unconditional surrender on 10 May and went into exile in Portugal. At least 655 people were killed. Kumba Ialá won the presidential election of 1999–2000; Mané, who tried to take power again, was killed in November 2000, and Vieira returned to be elected president in 2005.
: La guerre entre le président João Bernardo « Nino » Vieira et une junte militaire menée par son ancien chef d’état-major, le brigadier Ansumane Mané. Vieira avait suspendu Mané en janvier 1998, l’accusant d’avoir laissé des armes des dépôts de l’armée parvenir aux rebelles séparatistes de Casamance, dans le Sénégal voisin. Le 7 juin 1998, au lendemain de la destitution de Mané et de la nomination d’un successeur par Vieira, des troupes fidèles à Mané s’emparèrent de casernes et de l’aéroport de Bissau, et la plus grande partie de l’armée ainsi que de nombreux anciens combattants de la guerre d’indépendance les rejoignirent. Environ 1 300 soldats sénégalais et 400 guinéens intervinrent aux côtés de Vieira, et les combats à Bissau et dans ses environs chassèrent quelque 200 000 personnes de la capitale et 350 000 de leurs foyers au total ; plus de 3 000 étrangers furent évacués. Une trêve en juillet et un cessez-le-feu en août furent suivis de l’accord d’Abuja du 1er novembre 1998, qui prévoyait un gouvernement d’union nationale, des élections et le remplacement des troupes sénégalaises et guinéennes par une force de l’ECOMOG composée de contingents du Togo, du Bénin, du Niger et de la Gambie. Les combats reprirent brièvement au début de 1999 ; les troupes étrangères partirent en mars et, au début de mai, à la suite d’un différend sur le désarmement, la junte attaqua de nouveau et renversa Vieira le 7 mai 1999. Il se réfugia à l’ambassade du Portugal, signa une reddition sans conditions le 10 mai et partit en exil au Portugal. Au moins 655 personnes furent tuées. Kumba Ialá remporta l’élection présidentielle de 1999–2000 ; Mané, qui tenta de reprendre le pouvoir, fut tué en novembre 2000, et Vieira revint pour être élu président en 2005.
