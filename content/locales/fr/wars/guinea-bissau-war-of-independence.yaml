# French translations of the catalogue text (wave 13); step bodies follow later.
Guinea-Bissau War of Independence: Guerre d’indépendance de la Guinée-Bissau
? The war of the African Party for the Independence of Guinea and Cape Verde (PAIGC) against Portuguese rule in Portuguese Guinea, the Guinean theatre of the Portuguese Colonial War. The PAIGC, founded in 1956 by Amílcar Cabral and others, turned to armed struggle after Portuguese police killed striking dockworkers at Pidjiguiti in Bissau in 1959, and opened the war with an attack on the barracks at Tite on 23 January 1963. Its guerrillas, based in neighbouring Guinea and later Senegal, held the island of Como against a large Portuguese offensive in 1964 and by the late 1960s claimed to control two-thirds of the countryside, where the party set up schools, clinics, courts and stores. Portugal kept some 30,000 soldiers in the colony, many of them Africans; from 1968 the governor, General António de Spínola, combined reforms with raids such as the attack on Conakry in 1970. Cabral was assassinated in Conakry in January 1973, but Soviet anti-aircraft missiles ended Portuguese air superiority that spring, and the PAIGC declared independence in the Boé hills on 24 September 1973. After the Carnation Revolution in Lisbon, Portugal recognised Guinea-Bissau on 10 September 1974. About 2,000 Portuguese soldiers, some 6,000 PAIGC fighters and about 5,000 civilians were killed.
: La guerre que le Parti africain pour l’indépendance de la Guinée et du Cap-Vert (PAIGC) mena contre la domination portugaise en Guinée portugaise, théâtre guinéen de la guerre coloniale portugaise. Le PAIGC, fondé en 1956 par Amílcar Cabral et d’autres, se tourna vers la lutte armée après que la police portugaise eut tué des dockers en grève à Pidjiguiti, à Bissau, en 1959, et ouvrit la guerre par une attaque contre la caserne de Tite le 23 janvier 1963. Ses guérilleros, basés en Guinée voisine, puis au Sénégal, tinrent l’île de Como contre une grande offensive portugaise en 1964 et, à la fin des années 1960, affirmaient contrôler les deux tiers des campagnes, où le parti mit en place écoles, dispensaires, tribunaux et magasins. Le Portugal maintenait quelque 30 000 soldats dans la colonie, dont beaucoup d’Africains ; à partir de 1968, le gouverneur, le général António de Spínola, associa réformes et raids, comme l’attaque de Conakry en 1970. Cabral fut assassiné à Conakry en janvier 1973, mais des missiles antiaériens soviétiques mirent fin à la supériorité aérienne portugaise au printemps de la même année, et le PAIGC proclama l’indépendance dans les collines du Boé le 24 septembre 1973. Après la révolution des Œillets à Lisbonne, le Portugal reconnut la Guinée-Bissau le 10 septembre 1974. Environ 2 000 soldats portugais, quelque 6 000 combattants du PAIGC et environ 5 000 civils furent tués.
