# French translations of the catalogue text (wave 13); step bodies follow later.
Gukurahundi: Gukurahundi
? The campaign of killings carried out by Zimbabwe’s government in Matabeleland and parts of the Midlands, mainly among the Ndebele-speaking supporters of Joshua Nkomo’s ZAPU. After independence in 1980 the rivalry between Robert Mugabe’s ZANU–PF and ZAPU and between their former armies broke out in clashes at Entumbane in Bulawayo in 1980–1981. In February 1982 the government announced the discovery of arms caches on ZAPU-owned properties, dismissed Nkomo from the cabinet and detained ZIPRA commanders; hundreds of former ZIPRA fighters deserted and took up arms as “dissidents”, whom Nkomo disowned, and who killed several hundred civilians in the following years. In January 1983 the government sent the Fifth Brigade, trained by North Korean instructors, answerable directly to the prime minister’s office and commanded by Perrance Shiri, into Matabeleland North, and later into Matabeleland South and the Midlands. Its soldiers killed villagers in public executions and mass shootings, as on the Cewale river in Lupane in March 1983, burned homesteads, and tortured detainees in camps such as Bhalagwe; in 1984, during a drought, the security forces blocked or tightly controlled food supplies into Matabeleland South, causing hunger. The name, Shona for “the early rain that washes away the chaff before the spring rains”, was the Fifth Brigade’s own. The Catholic Commission for Justice and Peace documented at least 2,000–2,750 deaths and thought the true number might be 8,000 or more; most later estimates are about 20,000, and some local estimates go higher. The killings ended when Mugabe and Nkomo signed the Unity Accord on 22 December 1987, merging ZAPU into ZANU–PF, followed by an amnesty in 1988. Mugabe later called the period “a moment of madness”; no one has been prosecuted, and many scholars and the International Association of Genocide Scholars describe it as genocide. In 2024 the government of Emmerson Mnangagwa, who was minister of state security at the time, began community hearings led by traditional chiefs, which critics say avoid accountability.
: La campagne de tueries menée par le gouvernement du Zimbabwe au Matabeleland et dans certaines parties des Midlands, principalement parmi les partisans de langue ndébélé de la ZAPU de Joshua Nkomo. Après l’indépendance en 1980, la rivalité entre la ZANU–PF de Robert Mugabe et la ZAPU, et entre leurs anciennes armées, dégénéra en affrontements à Entumbane, à Bulawayo, en 1980–1981. En février 1982, le gouvernement annonça la découverte de caches d’armes dans des propriétés appartenant à la ZAPU, renvoya Nkomo du gouvernement et fit arrêter des commandants de la ZIPRA ; des centaines d’anciens combattants de la ZIPRA désertèrent et prirent les armes en tant que « dissidents », que Nkomo désavoua, et qui tuèrent plusieurs centaines de civils au cours des années suivantes. En janvier 1983, le gouvernement envoya la Cinquième Brigade, formée par des instructeurs nord-coréens, relevant directement du cabinet du Premier ministre et commandée par Perrance Shiri, dans le Matabeleland-Nord, puis dans le Matabeleland-Sud et les Midlands. Ses soldats tuèrent des villageois lors d’exécutions publiques et de fusillades de masse, comme sur la rivière Cewale, à Lupane, en mars 1983, incendièrent des habitations et torturèrent des détenus dans des camps comme celui de Bhalagwe ; en 1984, pendant une sécheresse, les forces de sécurité bloquèrent ou contrôlèrent étroitement l’acheminement de vivres vers le Matabeleland-Sud, provoquant la faim. Le nom, qui signifie en shona « la première pluie qui emporte la paille avant les pluies de printemps », était celui que se donnait la Cinquième Brigade. La Commission catholique pour la justice et la paix a recensé au moins 2 000 à 2 750 morts et estimé que le nombre réel pourrait atteindre 8 000 ou davantage ; la plupart des estimations ultérieures sont d’environ 20 000, et certaines estimations locales vont au-delà. Les tueries cessèrent lorsque Mugabe et Nkomo signèrent l’accord d’unité le 22 décembre 1987, qui fondit la ZAPU dans la ZANU–PF, suivi d’une amnistie en 1988. Mugabe qualifia plus tard cette période de « moment de folie » ; personne n’a été poursuivi, et de nombreux chercheurs ainsi que l’Association internationale des spécialistes du génocide la qualifient de génocide. En 2024, le gouvernement d’Emmerson Mnangagwa, ministre de la Sécurité d’État à l’époque des faits, a lancé des audiences communautaires conduites par les chefs traditionnels, qui, selon leurs détracteurs, éludent la question des responsabilités.
