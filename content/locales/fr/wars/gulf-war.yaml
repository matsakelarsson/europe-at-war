# French translations of the catalogue text (wave 7); step bodies follow later.
Gulf War: Guerre du Golfe
The war that followed Iraq’s invasion and annexation of Kuwait on 2 August 1990. Saddam Hussein’s government, deep in debt after the war with Iran, accused Kuwait of overproducing oil and drilling into Iraq’s Rumaila field, and revived an old claim to the emirate. The UN Security Council condemned the invasion and imposed sanctions, and a coalition of some 35 countries led by the United States gathered more than 900,000 troops in Saudi Arabia. After Iraq ignored a UN deadline of 15 January 1991, the coalition bombed Iraq and Iraqi forces in Kuwait for five and a half weeks from 17 January, and in a ground offensive of 24–28 February drove them out of Kuwait in about 100 hours. Iraqi forces set fire to more than 600 Kuwaiti oil wells as they left. The ceasefire left Saddam in power, under UN sanctions and weapons inspections. Estimates of Iraqi military dead range from about 8,000 to 50,000 and more; the coalition lost about 300 killed.: La guerre qui suivit l’invasion et l’annexion du Koweït par l’Irak le 2 août 1990. Le gouvernement de Saddam Hussein, lourdement endetté après la guerre contre l’Iran, accusait le Koweït de surproduire du pétrole et de forer dans le champ irakien de Rumaila, et il ranima une ancienne revendication sur l’émirat. Le Conseil de sécurité de l’ONU condamna l’invasion et imposa des sanctions, et une coalition d’environ 35 pays dirigée par les États-Unis rassembla plus de 900 000 soldats en Arabie saoudite. L’Irak n’ayant pas tenu compte de l’ultimatum de l’ONU fixé au 15 janvier 1991, la coalition bombarda l’Irak et les forces irakiennes au Koweït pendant cinq semaines et demie à partir du 17 janvier, puis, lors d’une offensive terrestre du 24 au 28 février, les chassa du Koweït en une centaine d’heures. En partant, les forces irakiennes mirent le feu à plus de 600 puits de pétrole koweïtiens. Le cessez-le-feu laissa Saddam au pouvoir, soumis aux sanctions et aux inspections d’armement de l’ONU. Les estimations des pertes militaires irakiennes vont d’environ 8 000 à 50 000 morts, voire davantage ; la coalition eut environ 300 tués.
