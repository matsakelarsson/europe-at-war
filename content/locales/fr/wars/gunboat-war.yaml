# Some French text was translated automatically.
"Gunboat War": "Guerre des canonnières"
"A naval war between Denmark–Norway and Britain, begun by the British seizure of the Danish fleet at Copenhagen in 1807 and fought with gunboats, privateers and blockade until the Treaty of Kiel in 1814. It cut Norway off from Denmark, brought famine to Norway and ended with Norway ceded to the king of Sweden.": "Une guerre navale entre le Danemark et la Norvège et la Grande-Bretagne, commencée par la prise britannique de la flotte danoise à Copenhague en 1807 et combattue avec des canonnières, des corsaires et un blocus jusqu’au traité de Kiel en 1814."
"Dates are New Style.": "Les dates sont de nouveau style."
"In Denmark and Norway the years 1801–1814 are called the English Wars (Englandskrigene); the Gunboat War is their second, longer part.": "Au Danemark et en Norvège, les années 1801-1814 sont appelées les guerres anglaises (Englandskrigene) ; la guerre des canons est leur deuxième, plus longue partie."
