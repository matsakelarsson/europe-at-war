"August – October 1807": "août – octobre 1807"
"After the Peace of Tilsit in July 1807, the British government feared that Napoleon would force Denmark–Norway into his camp and take over its navy, one of the largest in Europe. Britain demanded that the fleet be handed over for safekeeping until the war was over. Crown Prince Frederick, who ruled for his ailing father, refused. Most of the Danish army was in Holstein, watching the French, when British troops began landing at Vedbæk, north of Copenhagen, on 16 August.": "Après la paix de Tilsit en juillet 1807, le gouvernement britannique craignait que Napoléon force le Danemark-Norvège à entrer dans son camp et à reprendre sa marine, l’un des plus importants d’Europe. La Grande-Bretagne exige que la flotte soit remise pour être gardée jusqu’à la fin de la guerre. La plupart de l’armée danoise était à Holstein, regardant les Français, quand les troupes britanniques ont commencé à atterrir à Vedbæk, au nord de Copenhague, le 16 août."
"Copenhagen had about 5,000 regular soldiers and as many militiamen. On 29 August Arthur Wellesley, the future Duke of Wellington, scattered a relief force of militia at Køge. From 2 to 5 September British guns and Congreve rockets bombarded the city, killing roughly 195 civilians and burning over a thousand buildings, among them the Church of Our Lady. On 7 September the city surrendered. The British sailed home in October with almost the whole Danish–Norwegian fleet, and Denmark–Norway allied itself with France.": "Le 29 août, Arthur Wellesley, futur duc de Wellington, dispersa une force de secours de la milice à Køge. Du 2 au 5 septembre, des canons britanniques et des roquettes Congreve bombardèrent la ville, tuant environ 195 civils et incendiant plus d’un millier de bâtiments, dont l’église Notre-Dame. Les Britanniques rentrèrent chez eux en octobre avec presque toute la flotte danoise-norvégienne, et le Danemark-Norvège s’alliait à la France."
