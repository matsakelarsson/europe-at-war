"1812–1814": "1812–1814"
"By 1813 Denmark–Norway was isolated. The war had ruined its trade and its finances, and in January 1813 the state went bankrupt. Sweden, under its new crown prince Charles John, had been promised Norway by Russia in 1812 and by Britain in 1813. Frederick VI refused to give Norway up and kept his alliance with Napoleon. After Napoleon’s defeat at Leipzig in October 1813, Charles John led a Swedish, Russian and German army north against the Danes in Holstein.": "En 1813, le Danemark et la Norvège étaient isolés. La guerre avait ruiné son commerce et ses finances, et en janvier 1813 l’État fit faillite. La Suède, sous son nouveau prince héritier Charles John, avait été promise à la Norvège par la Russie en 1812 et par la Grande-Bretagne en 1813. Frederick VI refusa de céder la Norvège et garda son alliance avec Napoléon. Après la défaite de Napoléon à Leipzig en octobre 1813, Charles John mène une armée suédoise, russe et allemande au nord contre les Danois à Holstein."
"At Sehested on 10 December the Danish corps fought its way through to the fortress of Rendsburg, but Holstein and much of Schleswig were overrun. By the Treaty of Kiel on 14 January 1814, Denmark made peace with Sweden and Britain. Frederick VI ceded Norway, though not Iceland, Greenland or the Faroes, to the king of Sweden, and Heligoland to Britain, and received Swedish Pomerania. The Norwegians rejected the treaty and adopted their own constitution at Eidsvoll on 17 May 1814.": "À Sehested, le 10 décembre, le corps danois s’engagea dans la forteresse de Rendsburg, mais Holstein et une grande partie du Schleswig furent envahis. Par le traité de Kiel, le 14 janvier 1814, le Danemark fit la paix avec la Suède et la Grande-Bretagne. Frederick VI céda la Norvège, bien que non l’Islande, le Groenland ou les îles Féroé, au roi de Suède, et Heligoland à la Grande-Bretagne, et reçut la Poméranie suédoise. Les Norvégiens ont rejeté le traité et adopté leur propre constitution à Eidsvoll le 17 mai 1814."
