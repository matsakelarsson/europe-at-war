"1808–1810": "1808–1810"
"With its battle fleet gone, Denmark–Norway built gunboats instead, well over 200 of them, rowed by crews of 20 to 80 men and armed with one or two heavy guns. They were cheap, quick to build and hard to hit, and in calm, shallow water they could swarm a becalmed warship. On 22 March 1808 the last Danish ship of the line, Prinds Christian Frederik, was destroyed by two British ships off Zealand Point. After that the war at sea was fought by gunboats, brigs and privateers.": "Avec sa flotte de combat disparue, le Danemark et la Norvège ont construit des canonnières, bien plus de 200 d’entre elles, ramées par des équipages de 20 à 80 hommes et armées d’un ou deux canons lourds. Le 22 mars 1808, le dernier navire danois de la ligne, Prinds Christian Frederik, fut détruit par deux navires britanniques au large de Zealand Point."
"The gunboats captured several British brigs, and on 9 June 1809 a flotilla off Saltholm took a dozen merchant ships from a British convoy. In Norway, gunboats drove off a British frigate at Bergen. But they could not break British control of Danish waters. Guarded by Admiral Saumarez’s Baltic fleet, convoys of hundreds of merchant ships passed the Sound and the Great Belt every summer, while privateers from Danish and Norwegian ports preyed on British and neutral shipping.": "Les canonnières capturèrent plusieurs brigands britanniques et, le 9 juin 1809, une flottille au large de Saltholm prit une douzaine de navires marchands d’un convoi britannique. En Norvège, des canonnières débarquaient d’une frégate britannique à Bergen. Guidés par la flotte balte de l’amiral Saumarez, les convois de centaines de navires marchands passent le Sound et la Great Belt chaque été, tandis que les corsaires des ports danois et norvégiens s’attaquent à la navigation britannique et neutre."
