"The British needed the Kattegat to be safe for their convoys. In May 1809 they took the small island of Anholt and relit its lighthouse, which the Danes had put out. On 27 March 1811 about 1,000 Danish soldiers crossed from Jutland in gunboats to retake it. They attacked Fort York without artillery or supplies and were beaten off by some 380 Royal Marines, helped by two frigates. Their commander was killed and more than 500 men were taken prisoner.": "Les Britanniques avaient besoin que le Kattegat soit en sécurité pour leurs convois. En mai 1809, ils prirent la petite île d’Anholt et relitent son phare que les Danois avaient mis dehors. Le 27 mars 1811, environ 1 000 soldats danois ont traversé le Jutland en canonnières pour le reprendre. Ils attaquèrent Fort York sans artillerie ni fournitures et furent battus par quelque 380 Marines royales, aidés par deux frégates. Leur commandant a été tué et plus de 500 hommes ont été faits prisonniers."
"Denmark–Norway’s last frigate, Najaden, was sent to Norway in 1812 to protect the grain traffic. On 6 July a British squadron led by the 64-gun Dictator trapped her among the skerries at Lyngør, and she blew up and sank; 133 of her crew were killed. The weather was a deadlier enemy to the British than the Danes. On 24 December 1811 the ships of the line St George and Defence were wrecked on the Jutland coast, and nearly 1,400 drowned men washed ashore.": "La dernière frégate du Danemark et de la Norvège, Najaden, fut envoyée en Norvège en 1812 pour protéger le trafic céréalier. Le 6 juillet, un escadron britannique dirigé par le 64-gun Dictator l’emprisonna parmi les écuries de Lyngør, et elle fit exploser et coula ; 133 de son équipage furent tués. Le 24 décembre 1811, les navires de la ligne Saint-Georges et de la Défense furent détruits sur la côte du Jutland, et près de 1 400 hommes noyés lavèrent à terre."
