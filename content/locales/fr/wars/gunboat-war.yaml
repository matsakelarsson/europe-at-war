"Blockade and hunger in Norway": "Blockade et faim en Norvège"
"1807–1813": "1807–1813"
"The war cut Norway off from Denmark. Norway relied on Danish grain and lived by selling timber and fish abroad, above all to Britain; now British warships patrolled the Skagerrak. For the first time in centuries Norway had to be governed from within, by a government commission in Christiania, with Prince Christian August as its president, ran the country from 1807 to 1810. Small boats tried to slip grain across from Jutland at night. Many were taken, and their crews spent years in British prisons.": "La guerre a coupé la Norvège du Danemark. La Norvège comptait sur le grain danois et vivait en vendant du bois et du poisson à l’étranger, surtout à la Grande-Bretagne ; maintenant les navires de guerre britanniques patrouillaient le Skagerrak. Pour la première fois depuis des siècles, la Norvège devait être gouvernée de l’intérieur, par une commission gouvernementale en Christiania, avec le prince Christian August comme président, a dirigé le pays de 1807 à 1810. Beaucoup ont été pris, et leurs équipages ont passé des années dans les prisons britanniques."
"Hunger turned into famine in 1808–1809 and again after the harvest failed in 1812, when spring came late and frost early. People in many districts mixed bark into their bread. Henrik Ibsen later set his poem Terje Vigen in these years, about a man who rows to Denmark for grain. The isolation also strengthened Norwegians’ sense of being a country of their own. A Norwegian university was founded in Christiania in 1811.": "La faim se transforme en famine en 1808–1809 et à nouveau après l’échec de la récolte en 1812, quand le printemps arrive tard et le gel tôt. Les gens dans beaucoup de districts mélangent l’écorce dans leur pain. Henrik Ibsen plus tard a mis son poème Terje Vigen dans ces années, sur un homme qui rame au Danemark pour le grain. L’isolement renforce également le sentiment des Norvégiens d’être leur propre pays."
