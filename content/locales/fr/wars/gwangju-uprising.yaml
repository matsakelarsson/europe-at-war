# French translations of the catalogue text (wave 10); step bodies follow later.
Gwangju uprising: Soulèvement de Gwangju
? A popular uprising in the city of Gwangju in South Korea in May 1980 against the military rule of General Chun Doo-hwan, put down by the army; in South Korea it is called the May 18 Democratization Movement. After President Park Chung-hee was assassinated in October 1979, Chun seized control of the army in a coup on 12 December, and on 17 May 1980 he extended martial law to the whole country, closed the universities and arrested opposition leaders, among them Kim Dae-jung, who came from the region. When students in Gwangju protested on 18 May, special forces paratroopers beat and bayoneted protesters and bystanders, and the city rose. On 21 May troops fired on a crowd in front of the provincial office; citizens took weapons from police stations and reservist armouries and drove the army out of the city, which was then sealed off and run for five days by citizens’ committees. In the early hours of 27 May troops retook the provincial office. The government counted 165 civilians killed and 76 missing, with 22 soldiers and 4 police officers dead; other estimates of the dead range from about 600 to 2,000. The killings shaped the democracy movement that ended military rule in 1987, and Chun was convicted for them in 1996.
: Un soulèvement populaire dans la ville de Gwangju, en Corée du Sud, en mai 1980, contre le régime militaire du général Chun Doo-hwan, réprimé par l’armée ; en Corée du Sud, on l’appelle le Mouvement de démocratisation du 18 mai. Après l’assassinat du président Park Chung-hee en octobre 1979, Chun prit le contrôle de l’armée par un coup d’État le 12 décembre et, le 17 mai 1980, il étendit la loi martiale à tout le pays, ferma les universités et fit arrêter les dirigeants de l’opposition, parmi lesquels Kim Dae-jung, originaire de la région. Lorsque les étudiants de Gwangju manifestèrent le 18 mai, des parachutistes des forces spéciales frappèrent manifestants et passants et les blessèrent à coups de baïonnette, et la ville se souleva. Le 21 mai, les troupes tirèrent sur la foule devant le siège du gouvernement provincial ; les habitants prirent des armes dans les commissariats et les arsenaux des réservistes et chassèrent l’armée de la ville, qui fut alors bouclée et administrée pendant cinq jours par des comités de citoyens. Aux premières heures du 27 mai, les troupes reprirent le siège du gouvernement provincial. Le gouvernement dénombra 165 civils tués et 76 disparus, ainsi que 22 soldats et 4 policiers morts ; d’autres estimations du nombre de morts vont d’environ 600 à 2 000. Ces tueries façonnèrent le mouvement démocratique qui mit fin au régime militaire en 1987, et Chun fut condamné pour ces faits en 1996.
