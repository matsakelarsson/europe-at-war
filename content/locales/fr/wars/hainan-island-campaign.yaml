# French translations of the catalogue text (wave 9); step bodies follow later.
Battle of Hainan Island: Bataille de l’île de Hainan
? The People’s Liberation Army’s capture of Hainan Island from the Republic of China in the spring of 1950, at the end of the Chinese Civil War. The Nationalist general Xue Yue held the coast with forces estimated at 100,000 to 200,000 troops and militia, with about 50 ships and 25 aircraft, while communist guerrillas of the Qiongya Column under Feng Baiju, allied with the Indigenous Hlai, controlled much of the interior. The 40th and 43rd Armies of Deng Hua’s 15th Corps trained for months on the Leizhou peninsula and, from late February and March, slipped small forces across the Qiongzhou Strait in junks to join the guerrillas. On the night of 16 April about 300 junks carried the main force across; it landed on the north-west coast, around Lingao, and took Haikou on 23 April. The defence collapsed, the ROC evacuated about 70,000 troops and civilians to Taiwan, Sanya and Yulin in the south fell within a week, and the PRC declared the island taken on 1 May; the ROC announced its withdrawal the next day. The PLA lost about 4,000 men, most of them during the crossing.
: La prise de l’île de Hainan à la République de Chine par l’Armée populaire de libération au printemps 1950, à la fin de la guerre civile chinoise. Le général nationaliste Xue Yue tenait la côte avec des forces estimées entre 100 000 et 200 000 soldats et miliciens, avec environ 50 navires et 25 avions, tandis que les guérilleros communistes de la colonne Qiongya de Feng Baiju, alliés aux Hlai autochtones, contrôlaient une grande partie de l’intérieur. Les 40e et 43e armées du 15e corps de Deng Hua s’entraînèrent pendant des mois sur la péninsule de Leizhou et, à partir de la fin février et en mars, firent passer en jonque de petits détachements à travers le détroit de Qiongzhou pour rejoindre les guérilleros. Dans la nuit du 16 avril, environ 300 jonques transportèrent le gros des forces ; celui-ci débarqua sur la côte nord-ouest, autour de Lingao, et prit Haikou le 23 avril. La défense s’effondra, la République de Chine évacua environ 70 000 soldats et civils vers Taïwan, Sanya et Yulin, dans le sud, tombèrent en une semaine, et la République populaire déclara l’île conquise le 1er mai ; la République de Chine annonça son retrait le lendemain. L’APL perdit environ 4 000 hommes, la plupart pendant la traversée.
