# French translations of the catalogue text (wave 14); step bodies follow later.
Haitian civil war (1807–1820): Guerre civile haïtienne (1807–1820)
? The war between the north and the south of Haiti after the assassination of Emperor Jean-Jacques Dessalines on 17 October 1806. The constitution drawn up in Port-au-Prince in December 1806 left the elected president, Henri Christophe, with little power and the Senate, led by Alexandre Pétion and the officers of colour of the West and South, with most of it. Christophe marched on Port-au-Prince and beat Pétion at Sibert on 1 January 1807 but could not take the city; he then made the north and the Artibonite a separate State of Haiti, which he proclaimed a kingdom with himself as King Henri I in March 1811, while the Senate made Pétion president of the Republic of Haiti in the West and South. Christophe besieged Port-au-Prince again in 1812 without success, André Rigaud set up a breakaway state in the South in 1810–1812, and in the mountains of the Grand’Anse an insurgent leader called Goman held out against the republic from 1807 to 1820. After 1812 the war settled into a standoff along a front near Saint-Marc. Christophe ruled by forced plantation labour and built the Citadelle Laferrière and the palace of Sans-Souci; Pétion divided state land among soldiers and peasants and gave help to Simón Bolívar in 1815–1816. Pétion died in 1818 and was succeeded by Jean-Pierre Boyer, who crushed Goman in 1820. When Christophe, partly paralysed by a stroke, faced mutinies in his army, he shot himself on 8 October 1820, and in October Boyer reunited Haiti.
: La guerre entre le nord et le sud d’Haïti après l’assassinat de l’empereur Jean-Jacques Dessalines le 17 octobre 1806. La constitution rédigée à Port-au-Prince en décembre 1806 ne laissait que peu de pouvoir au président élu, Henri Christophe, et en confiait l’essentiel au Sénat, conduit par Alexandre Pétion et les officiers de couleur de l’Ouest et du Sud. Christophe marcha sur Port-au-Prince et battit Pétion à Sibert le 1er janvier 1807, mais ne put prendre la ville ; il fit alors du Nord et de l’Artibonite un État d’Haïti distinct, qu’il érigea en royaume en mars 1811 en se proclamant roi sous le nom d’Henri Ier, tandis que le Sénat faisait de Pétion le président de la République d’Haïti, dans l’Ouest et le Sud. Christophe assiégea de nouveau Port-au-Prince en 1812, sans succès, André Rigaud établit un État dissident dans le Sud en 1810–1812, et dans les montagnes de la Grand’Anse un chef insurgé nommé Goman résista à la république de 1807 à 1820. Après 1812, la guerre se figea le long d’un front proche de Saint-Marc. Christophe gouverna en imposant le travail forcé sur les plantations et fit construire la citadelle Laferrière et le palais Sans-Souci ; Pétion distribua des terres de l’État aux soldats et aux paysans et apporta son aide à Simón Bolívar en 1815–1816. Pétion mourut en 1818 et eut pour successeur Jean-Pierre Boyer, qui écrasa Goman en 1820. Lorsque Christophe, en partie paralysé par une attaque, dut faire face à des mutineries dans son armée, il se tua d’un coup de pistolet le 8 octobre 1820, et en octobre Boyer réunifia Haïti.
