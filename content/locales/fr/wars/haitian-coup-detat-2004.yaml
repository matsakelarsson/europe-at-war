# French translations of the catalogue text (wave 14); step bodies follow later.
2004 Haitian coup d’état: Coup d’État de 2004 en Haïti
? The armed revolt that drove President Jean-Bertrand Aristide from Haiti for the second time, and the foreign interventions that followed. After disputed legislative elections in May 2000 and Aristide’s return to the presidency in February 2001, the opposition, backed by much of the business elite and civil society, demanded his resignation, while armed gangs loyal to his Fanmi Lavalas party (the chimères) attacked opponents, and former soldiers raided across the Dominican border. On 5 February 2004 the Gonaïves Resistance Front, a former pro-Aristide gang once called the Cannibal Army that had turned against him after its leader Amiot Métayer was murdered in 2003, seized Gonaïves under Amiot’s brother Buteur Métayer. Former army officers and FRAPH paramilitaries, among them Guy Philippe and Louis-Jodel Chamblain, joined them in what became the National Revolutionary Front for the Liberation and Reconstruction of Haiti (FLRN); the police fled or were overrun across the north, and on 22 February the rebels took Cap-Haïtien. As they threatened Port-au-Prince and pro-Aristide gangs barricaded the capital, the United States and France pressed Aristide to leave. In the early hours of 29 February 2004 he signed a letter of resignation and was flown out on an American plane to the Central African Republic; he has said that he was forced out in a coup and kidnapped, which the US government denies. The chief justice, Boniface Alexandre, became interim president and Gérard Latortue prime minister. The same day UN Security Council Resolution 1529 authorised a Multinational Interim Force of US, French, Canadian and Chilean troops, and on 1 June 2004 it handed over to the UN Stabilization Mission in Haiti (MINUSTAH), led by Brazil, which stayed until 2017. At least 80 people were killed in the revolt, and many more in the reprisals between Lavalas supporters, former soldiers and the police in the months that followed. MINUSTAH fought the gangs of Cité Soleil in 2005–2007, lost its head, Hédi Annabi, and about a hundred of its staff in the earthquake of January 2010, and was blamed for the cholera epidemic that Nepalese peacekeepers brought to Haiti later that year, which killed about 10,000 people; the United Nations apologised in 2016.
: La révolte armée qui chassa d’Haïti pour la seconde fois le président Jean-Bertrand Aristide, et les interventions étrangères qui suivirent. Après des élections législatives contestées en mai 2000 et le retour d’Aristide à la présidence en février 2001, l’opposition, soutenue par une grande partie de l’élite économique et de la société civile, réclama sa démission, tandis que des gangs armés fidèles à son parti, Fanmi Lavalas (les chimères), s’en prenaient à ses adversaires et que d’anciens soldats lançaient des raids depuis l’autre côté de la frontière dominicaine. Le 5 février 2004, le Front de résistance des Gonaïves, un ancien gang pro-Aristide autrefois appelé l’Armée cannibale, qui s’était retourné contre lui après l’assassinat de son chef Amiot Métayer en 2003, s’empara des Gonaïves sous la conduite de Buteur Métayer, le frère d’Amiot. D’anciens officiers de l’armée et des paramilitaires du FRAPH, parmi lesquels Guy Philippe et Louis-Jodel Chamblain, les rejoignirent au sein de ce qui devint le Front révolutionnaire national pour la libération et la reconstruction d’Haïti (FLRN) ; dans tout le nord, la police s’enfuit ou fut submergée, et le 22 février les rebelles prirent le Cap-Haïtien. Alors qu’ils menaçaient Port-au-Prince et que des gangs pro-Aristide barricadaient la capitale, les États-Unis et la France pressèrent Aristide de partir. Aux premières heures du 29 février 2004, il signa une lettre de démission et fut emmené à bord d’un avion américain vers la République centrafricaine ; il a affirmé avoir été chassé par un coup d’État et enlevé, ce que dément le gouvernement américain. Le président de la Cour de cassation, Boniface Alexandre, devint président par intérim et Gérard Latortue Premier ministre. Le même jour, la résolution 1529 du Conseil de sécurité des Nations unies autorisa une Force multinationale intérimaire composée de troupes américaines, françaises, canadiennes et chiliennes, qui passa le relais le 1er juin 2004 à la Mission des Nations unies pour la stabilisation en Haïti (MINUSTAH), dirigée par le Brésil, qui resta jusqu’en 2017. Au moins 80 personnes furent tuées pendant la révolte, et bien davantage dans les représailles entre partisans de Lavalas, anciens soldats et police au cours des mois suivants. La MINUSTAH combattit les gangs de Cité Soleil en 2005–2007, perdit son chef, Hédi Annabi, et une centaine de ses membres dans le séisme de janvier 2010, et fut tenue pour responsable de l’épidémie de choléra que des Casques bleus népalais apportèrent en Haïti plus tard la même année et qui fit environ 10 000 morts ; les Nations unies présentèrent des excuses en 2016.
Aristide’s government (the Haitian National Police and Lavalas supporters): Gouvernement d’Aristide (Police nationale d’Haïti et partisans de Lavalas)
Rebels (Gonaïves Resistance Front, from February 2004 the FLRN, with former soldiers under Guy Philippe): Rebelles (Front de résistance des Gonaïves, puis, à partir de février 2004, FLRN, avec d’anciens soldats menés par Guy Philippe)
Multinational Interim Force (United States, France, Canada and Chile), from June 2004 MINUSTAH: Force multinationale intérimaire (États-Unis, France, Canada et Chili), puis, à partir de juin 2004, MINUSTAH
2004 Haitian coup d’état (Wikipedia): Coup d’État de 2004 en Haïti (Wikipédia)
United Nations Stabilisation Mission in Haiti (Wikipedia): Mission des Nations unies pour la stabilisation en Haïti (Wikipédia)
MINUSTAH, United Nations Stabilization Mission in Haiti (United Nations Peacekeeping): MINUSTAH, Mission des Nations unies pour la stabilisation en Haïti (Maintien de la paix des Nations unies)
Security Council Resolution 1529 (2004) (United Nations): Résolution 1529 (2004) du Conseil de sécurité (Nations unies)
