# French translations of the catalogue text (wave 14); step bodies follow later.
Haitian occupation of Santo Domingo: Occupation haïtienne de Santo Domingo
? The rule of Haiti over the whole of Hispaniola from 1822 to 1844, called in Dominican history the Haitian occupation and in Haitian history the unification of the island. Spain had regained its former colony of Santo Domingo from the French in 1809, but neglected it, and on 1 December 1821 José Núñez de Cáceres proclaimed the independent State of Spanish Haiti and sought to join Simón Bolívar’s Gran Colombia. Several frontier towns and many in the Cibao preferred union with Haiti, whose constitution declared the island one and indivisible, and President Jean-Pierre Boyer marched east with an army of about 10,000 to 12,000 men; Núñez de Cáceres handed over the keys of Santo Domingo without a fight on 9 February 1822. Boyer abolished slavery in the east, gave land to freedmen, took over church property and the estates of emigrants, and applied Haitian law, including restrictions on land ownership by whites, the Rural Code and the taxes needed to pay the indemnity that France imposed in 1825 in return for recognising Haiti. Many landowning families emigrated, the university closed, and opposition grew, from a pro-Spanish plot at Los Alcarrizos in 1824 to the secret society La Trinitaria, founded by Juan Pablo Duarte in 1838. After the revolution of 1843 overthrew Boyer, the separatists proclaimed the Dominican Republic on 27 February 1844, which began the Dominican War of Independence. Historians disagree over how far the period was an occupation and how far a union that many easterners at first welcomed.
: La domination d’Haïti sur l’ensemble d’Hispaniola de 1822 à 1844, appelée occupation haïtienne dans l’historiographie dominicaine et unification de l’île dans l’historiographie haïtienne. L’Espagne avait repris aux Français son ancienne colonie de Santo Domingo en 1809, mais la délaissa, et le 1er décembre 1821 José Núñez de Cáceres proclama l’État indépendant d’Haïti espagnol et chercha à le rattacher à la Grande-Colombie de Simón Bolívar. Plusieurs villes frontalières et de nombreuses villes du Cibao préféraient l’union avec Haïti, dont la constitution déclarait l’île une et indivisible, et le président Jean-Pierre Boyer marcha vers l’est avec une armée d’environ 10 000 à 12 000 hommes ; Núñez de Cáceres lui remit les clés de Santo Domingo sans combat le 9 février 1822. Boyer abolit l’esclavage dans l’est, donna des terres aux affranchis, s’empara des biens de l’Église et des domaines des émigrés et appliqua la loi haïtienne, notamment les restrictions à la propriété foncière des Blancs, le Code rural et les impôts nécessaires pour payer l’indemnité que la France imposa en 1825 en échange de la reconnaissance d’Haïti. De nombreuses familles de propriétaires émigrèrent, l’université ferma et l’opposition grandit, d’un complot pro-espagnol à Los Alcarrizos en 1824 jusqu’à la société secrète La Trinitaria, fondée par Juan Pablo Duarte en 1838. Après que la révolution de 1843 eut renversé Boyer, les séparatistes proclamèrent la République dominicaine le 27 février 1844, ce qui ouvrit la guerre d’indépendance dominicaine. Les historiens ne s’accordent pas sur la mesure dans laquelle cette période fut une occupation ou une union que beaucoup d’habitants de l’est accueillirent d’abord favorablement.
