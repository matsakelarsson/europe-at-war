# French translations of the catalogue text (wave 14); step bodies follow later.
Haitian Revolution: Révolution haïtienne
? The revolution in which the enslaved people of Saint-Domingue, the French colony in the western third of Hispaniola and the richest colony in the Americas, overthrew slavery and French rule and founded Haiti, the first independent state in the Americas created by formerly enslaved people. Free people of colour led by Vincent Ogé took up arms for equal rights in 1790; on the night of 22–23 August 1791, about a week after the gathering at Bois Caïman, the enslaved people of the Northern Plain rose. In 1793, with Spain and Britain at war with the French Republic and invading the colony, the French commissioners Léger-Félicité Sonthonax and Étienne Polverel proclaimed the end of slavery, and on 4 February 1794 the National Convention abolished it in all French colonies. Toussaint Louverture, who had fought for Spain, joined the Republic in 1794, drove out the Spanish and, with André Rigaud, the British (1798), defeated Rigaud in the War of the South (1799–1800), took over Spanish Santo Domingo (1801) and gave the colony a constitution that made him governor for life. Napoleon Bonaparte sent an army under Charles Leclerc in 1802; Toussaint was captured and deported and died in a French prison, but when it became clear that France meant to restore slavery, the former slaves and the free people of colour rose again under Jean-Jacques Dessalines, Henri Christophe and Alexandre Pétion. War and yellow fever destroyed the French army, which was defeated at Vertières on 18 November 1803, and Dessalines declared Haiti’s independence on 1 January 1804. In the following months most of the French who remained were killed on his orders. Estimates of the dead range from about 200,000 to 350,000 people of the colony, with tens of thousands of French and British soldiers, most of whom died of disease.
: La révolution par laquelle la population réduite en esclavage de Saint-Domingue, la colonie française qui occupait le tiers occidental d’Hispaniola et la plus riche des Amériques, renversa l’esclavage et la domination française et fonda Haïti, le premier État indépendant des Amériques créé par d’anciens esclaves. Des libres de couleur menés par Vincent Ogé prirent les armes pour l’égalité des droits en 1790 ; dans la nuit du 22 au 23 août 1791, environ une semaine après l’assemblée du Bois-Caïman, les esclaves de la plaine du Nord se soulevèrent. En 1793, alors que l’Espagne et la Grande-Bretagne étaient en guerre contre la République française et envahissaient la colonie, les commissaires français Léger-Félicité Sonthonax et Étienne Polverel proclamèrent la fin de l’esclavage, et le 4 février 1794 la Convention nationale l’abolit dans toutes les colonies françaises. Toussaint Louverture, qui avait combattu pour l’Espagne, rallia la République en 1794, chassa les Espagnols puis, avec André Rigaud, les Britanniques (1798), vainquit Rigaud dans la guerre du Sud (1799–1800), prit possession de la partie espagnole de l’île, Santo Domingo (1801), et donna à la colonie une constitution qui le faisait gouverneur à vie. Napoléon Bonaparte envoya une armée commandée par Charles Leclerc en 1802 ; Toussaint fut capturé et déporté et mourut dans une prison française, mais lorsqu’il devint clair que la France entendait rétablir l’esclavage, les anciens esclaves et les libres de couleur se soulevèrent de nouveau sous la conduite de Jean-Jacques Dessalines, Henri Christophe et Alexandre Pétion. La guerre et la fièvre jaune anéantirent l’armée française, qui fut vaincue à Vertières le 18 novembre 1803, et Dessalines proclama l’indépendance d’Haïti le 1er janvier 1804. Dans les mois qui suivirent, la plupart des Français restés dans le pays furent tués sur son ordre. Les estimations des morts vont d’environ 200 000 à 350 000 habitants de la colonie, auxquels s’ajoutent des dizaines de milliers de soldats français et britanniques, morts pour la plupart de maladie.
