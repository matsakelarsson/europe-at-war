"Hats’ Russian War": "Chapeaux de guerre russe"
"Sweden, governed by the Hats party, attacked Russia to win back what it had lost in 1721. Its army was beaten at Villmanstrand and surrendered near Helsingfors, and Russia occupied Finland; at Åbo in 1743 Sweden got Finland back but gave up a strip of the south-east.": "La Suède, gouvernée par le parti des Hats, attaqua la Russie pour récupérer ce qu’elle avait perdu en 1721. Son armée fut battue à Villmanstrand et se rendit près d’Helsingfors, et la Russie occupa la Finlande ; à Åbo en 1743, la Suède ramena la Finlande mais abandonna une bande du sud-est."
