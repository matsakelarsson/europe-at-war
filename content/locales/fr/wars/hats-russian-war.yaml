"1741–1743": "1741–1743"
"The Hats, the party then in power in Sweden, wanted revenge for the Great Northern War and had French backing. Sweden declared war on Russia in the summer of 1741, but on 3 September a Russian army under Peter Lacy stormed Villmanstrand and routed the Swedish force there.": "Les Hats, le parti alors au pouvoir en Suède, voulaient se venger de la Grande Guerre du Nord et avaient le soutien des Français. La Suède déclara la guerre à la Russie à l’été 1741, mais le 3 septembre une armée russe sous Peter Lacy prit Villmanstrand et y dirigea la force suédoise."
"The main army, badly led and ravaged by disease, fell back across Finland. Surrounded near Helsingfors, it capitulated in August 1742, and Russia occupied all of Finland, a time Finns call the Lesser Wrath. At Åbo in August 1743 Sweden got Finland back but gave up a strip of the south-east beyond the Kymi river, with Fredrikshamn, Villmanstrand and Nyslott.": "La principale armée, gravement dirigée et ravagée par la maladie, est revenue à travers la Finlande. Entourée près d’Helsingfors, elle a capitulé en août 1742, et la Russie occupe toute la Finlande, une fois que les Finlandais appellent la Petite Crasse. A Åbo en août 1743, la Suède reprend la Finlande mais abandonne une bande du sud-est au-delà de la rivière Kymi, avec Fredrikshamn, Villmanstrand et Nyslott."
