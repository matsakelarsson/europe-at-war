# French translations of the catalogue text (wave 13); step bodies follow later.
Wars of the Hausa kingdoms: Guerres des royaumes haoussa
? "Wars among the Hausa kingdoms of today’s northern Nigeria and southern Niger, and with the empires around them, from about 1450 to 1650, as the Kano Chronicle and other Hausa, Bornu and Timbuktu writings tell them. Kano, Katsina, Zazzau (Zaria), Gobir and the other walled city-states grew rich on the trade between the forest and the Sahara and fought one another for routes, farmland and tribute, while Zazzau, on the southern frontier, raided southwards and supplied the others with slaves. Bornu claimed overlordship: the Kano Chronicle says that Abdullahi Burja (1438–1452 in its reckoning) paid tribute to Bornu, and that Muhammad Kisoki (1509–1565) raided the Bornu province of Birnin Unguru and beat off a Bornu army that attacked Kano soon after. The same chronicle tells of the first war between Kano and Katsina, under Muhammad Rumfa (1463–1499), which lasted eleven years without a victor. Songhai’s Askia Muhammad led an expedition to Katsina in 1512–1513, and Kanta Kotal of Kebbi broke away from Songhai to found a kingdom in the west (see Askia Muhammad’s wars); Leo Africanus wrote that the askia had conquered the Hausa states, which historians doubt. Hausa tradition remembers Amina, queen of Zazzau, as a conqueror who took tribute as far as Nupe and Kwararafa and built walled camps; the Kano Chronicle places her in the early fifteenth century, other traditions and the historian Abdullahi Smith in the sixteenth, after 1576, and the details of her life are debated. Under Muhammad Zaki (1582–1618), after years in which Katsina harried Kano, a Kano army defeated Katsina at Guraji and took about 400 horses; Kutumbi (1623–1648) besieged Katsina and, by the chronicle’s account, died of wounds after a later battle with it. Pressed by the raids of Kwararafa from the south, Kano and Katsina made peace about 1650."
: "Les guerres que se livrèrent, de 1450 environ à 1650, les royaumes haoussa du nord de l’actuel Nigeria et du sud de l’actuel Niger, et celles qu’ils menèrent contre les empires voisins, telles que les rapportent la Chronique de Kano et d’autres écrits haoussa, du Bornou et de Tombouctou. Kano, Katsina, Zazzau (Zaria), Gobir et les autres cités-États fortifiées s’enrichirent du commerce entre la forêt et le Sahara et se disputèrent routes, terres agricoles et tributs, tandis que le Zazzau, sur la frontière méridionale, razziait vers le sud et fournissait des esclaves aux autres. Le Bornou revendiquait la suzeraineté : la Chronique de Kano rapporte qu’Abdullahi Burja (1438–1452 selon sa chronologie) payait tribut au Bornou, et que Muhammad Kisoki (1509–1565) razzia la province bornouane de Birnin Unguru et repoussa une armée du Bornou qui attaqua Kano peu après. La même chronique relate la première guerre entre Kano et Katsina, sous Muhammad Rumfa (1463–1499), qui dura onze ans sans vainqueur. Askia Mohammed, souverain du Songhaï, mena une expédition contre Katsina en 1512–1513, et Kanta Kotal, du Kebbi, rompit avec le Songhaï pour fonder un royaume à l’ouest (voir les guerres d’Askia Mohammed) ; Léon l’Africain écrivit que l’askia avait conquis les États haoussa, ce dont les historiens doutent. La tradition haoussa se souvient d’Amina, reine du Zazzau, comme d’une conquérante qui leva tribut jusqu’au Nupe et au Kwararafa et bâtit des camps fortifiés ; la Chronique de Kano la place au début du XVe siècle, d’autres traditions et l’historien Abdullahi Smith au XVIe, après 1576, et les détails de sa vie sont débattus. Sous Muhammad Zaki (1582–1618), après des années pendant lesquelles Katsina avait harcelé Kano, une armée de Kano vainquit Katsina à Guraji et s’empara d’environ 400 chevaux ; Kutumbi (1623–1648) assiégea Katsina et, selon la chronique, mourut des blessures reçues lors d’une bataille ultérieure contre elle. Sous la pression des raids du Kwararafa venus du sud, Kano et Katsina firent la paix vers 1650."
