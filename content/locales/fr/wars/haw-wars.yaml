# French translations of the catalogue text (wave 11); step bodies follow later.
Haw wars: Guerres des Haw
? "Wars against armed Chinese bands in the uplands of Laos, northern Vietnam and northern Siam. “Haw” (Ho) is the Thai and Lao name for the Yunnanese Chinese, and was applied to these bands, most of whose men came from Guangxi and Guangdong: they were remnants of the armies of the Taiping and other mid-century risings, pushed south by the Qing from the 1860s. In Tonkin and the hills they formed rival bands under coloured flags (the Black Flags, the Yellow Flags, and later the Red and Striped Flags), which taxed trade, took tribute and raided; the French and Siamese often called them pirates or bandits, while the Vietnamese court at times employed them. In 1873–1874 the Striped Flags took Muang Phuan and the Plain of Jars, routed a force sent by Luang Prabang and Vietnam, and sacked the ruins of Vientiane. Siam, which held Luang Prabang and the Lao principalities as vassals, sent expeditions in 1875, 1884–1885 and 1885–1887; the first two failed against Haw stockades, and the third, under Chamuen Waiwonnat (later Chaophraya Surasak Montri), occupied Hua Phan and the Sipsong Chau Tai and carried off brothers of the Tai lord Đèo Văn Trị of Lai Châu as hostages. In June 1887 Đèo Văn Trị, with Haw and Black Flag fighters, sacked Luang Prabang; the French vice-consul Auguste Pavie got the old king Oun Kham away by boat. French troops from Tonkin then occupied the Sipsong Chau Tai, Đèo Văn Trị went over to the French, who recognised him as lord of the Sipsong Chau Tai in 1889–1890, and the last large bands broke up by about 1890, though raids went on into the mid-1890s. The wars weakened Siam’s hold on the left bank of the Mekong and prepared the ground for the French claims of 1893. In Thailand they are remembered as the suppression of the Haw (Prap Ho)."
: "Des guerres contre des bandes chinoises armées dans les hautes terres du Laos, du nord du Vietnam et du nord du Siam. « Haw » (Ho) est le nom que les Thaïs et les Lao donnent aux Chinois du Yunnan ; il fut appliqué à ces bandes, dont la plupart des hommes venaient du Guangxi et du Guangdong : c’étaient des restes des armées des Taiping et d’autres soulèvements du milieu du siècle, repoussés vers le sud par les Qing à partir des années 1860. Au Tonkin et dans les collines, ils formèrent des bandes rivales sous des pavillons de couleur (les Pavillons noirs, les Pavillons jaunes, puis les Pavillons rouges et les Pavillons rayés), qui taxaient le commerce, levaient tribut et pillaient ; les Français et les Siamois les qualifiaient souvent de pirates ou de bandits, tandis que la cour vietnamienne les employait parfois. En 1873–1874, les Pavillons rayés prirent Muang Phuan et la plaine des Jarres, mirent en déroute une force envoyée par Luang Prabang et le Vietnam, et pillèrent les ruines de Vientiane. Le Siam, qui tenait Luang Prabang et les principautés lao pour ses vassaux, envoya des expéditions en 1875, en 1884–1885 et en 1885–1887 ; les deux premières échouèrent devant les palissades des Haw, et la troisième, commandée par Chamuen Waiwonnat (plus tard Chaophraya Surasak Montri), occupa le Hua Phan et les Sipsong Chau Tai et emmena comme otages des frères du seigneur taï Đèo Văn Trị de Lai Châu. En juin 1887, Đèo Văn Trị, avec des combattants haw et des Pavillons noirs, saccagea Luang Prabang ; le vice-consul de France Auguste Pavie parvint à mettre à l’abri en bateau le vieux roi Oun Kham. Des troupes françaises venues du Tonkin occupèrent ensuite les Sipsong Chau Tai ; Đèo Văn Trị passa du côté des Français, qui le reconnurent comme seigneur des Sipsong Chau Tai en 1889–1890, et les dernières grandes bandes se disloquèrent vers 1890, même si les raids se poursuivirent jusqu’au milieu des années 1890. Ces guerres affaiblirent l’emprise du Siam sur la rive gauche du Mékong et préparèrent le terrain aux revendications françaises de 1893. En Thaïlande, on en garde le souvenir comme de la répression des Haw (Prap Ho)."
