# French translations of the catalogue text (wave 7); step bodies follow later.
Hazara uprisings: Soulèvements hazaras
? The risings of the Hazaras of central Afghanistan against the amir Abdur Rahman Khan, who was bringing the Hazarajat, until then ruled by its own chiefs, under the direct control of Kabul. A first rising in 1888–1890, when Hazara chiefs joined the revolt of the amir’s cousin Mohammad Ishaq Khan, was put down, and Afghan governors, garrisons and taxes followed. In the spring of 1892 a wider revolt, sparked by abuses by Afghan soldiers, spread across the Hazarajat. The amir, with the support of Sunni clerics, declared a holy war against the mostly Shia Hazaras and raised a large army of regular troops and tribal levies, which took the centre of the revolt in Uruzgan in 1892 and crushed a last rising against taxation in 1893. Many thousands of Hazaras were killed, thousands of men, women and children were enslaved and sold in Kabul and Kandahar, much of their land was given to Pashtun nomads and settlers, and large numbers fled to British India (Quetta), Persia (Mashhad) and Russian Turkestan. Historians often estimate that more than half of the Hazara population was killed or driven out; several call it the worst case of ethnic cleansing or genocide in modern Afghan history.
: Les soulèvements des Hazaras du centre de l’Afghanistan contre l’émir Abdur Rahman Khan, qui plaçait sous le contrôle direct de Kaboul le Hazarajat, jusque-là gouverné par ses propres chefs. Un premier soulèvement en 1888–1890, lorsque des chefs hazaras se joignirent à la révolte du cousin de l’émir, Mohammad Ishaq Khan, fut réprimé, et des gouverneurs, des garnisons et des impôts afghans suivirent. Au printemps 1892, une révolte plus large, déclenchée par les exactions de soldats afghans, s’étendit à tout le Hazarajat. L’émir, avec le soutien de religieux sunnites, déclara la guerre sainte contre les Hazaras, majoritairement chiites, et leva une grande armée de troupes régulières et de levées tribales, qui prit le centre de la révolte, en Uruzgan, en 1892 et écrasa en 1893 un dernier soulèvement contre l’impôt. De nombreux milliers de Hazaras furent tués, des milliers d’hommes, de femmes et d’enfants furent réduits en esclavage et vendus à Kaboul et à Kandahar, une grande partie de leurs terres fut donnée à des nomades et à des colons pachtounes, et beaucoup s’enfuirent vers l’Inde britannique (Quetta), la Perse (Mechhed) et le Turkestan russe. Les historiens estiment souvent que plus de la moitié de la population hazara fut tuée ou chassée ; plusieurs y voient le pire cas de nettoyage ethnique ou de génocide de l’histoire moderne de l’Afghanistan.
