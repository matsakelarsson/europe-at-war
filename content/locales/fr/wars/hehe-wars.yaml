# French translations of the catalogue text (wave 13); step bodies follow later.
Hehe wars: Guerres hehe
The war of the Hehe kingdom of the southern highlands of Tanzania against the German conquest. The Hehe, united by Munyigumba and his son Mkwawa in the 1870s and 1880s, dominated the country around Iringa and raided their neighbours and the caravan routes to the interior. In 1891 a German column under Emil von Zelewski marched against them, and on 17 August Mkwawa’s warriors ambushed it at Lugalo and killed Zelewski and most of his men, one of the worst defeats of German colonial troops in Africa. In October 1894 Governor Friedrich von Schele stormed Mkwawa’s walled capital at Kalenga, but Mkwawa escaped and fought a guerrilla war for almost four years, while the Germans burned crops and villages and set up a fort at Iringa. Cornered in July 1898, Mkwawa shot himself rather than be captured; his head was taken to Germany, and the Treaty of Versailles required its return. A skull believed to be his was handed back in 1954 and is kept at Kalenga.: La guerre du royaume hehe, dans les hautes terres du sud de la Tanzanie, contre la conquête allemande. Les Hehe, unifiés par Munyigumba et son fils Mkwawa dans les années 1870 et 1880, dominaient la région d’Iringa et razziaient leurs voisins ainsi que les routes caravanières vers l’intérieur. En 1891, une colonne allemande commandée par Emil von Zelewski marcha contre eux et, le 17 août, les guerriers de Mkwawa lui tendirent une embuscade à Lugalo et tuèrent Zelewski et la plupart de ses hommes, infligeant aux troupes coloniales allemandes l’une de leurs pires défaites en Afrique. En octobre 1894, le gouverneur Friedrich von Schele prit d’assaut Kalenga, la capitale fortifiée de Mkwawa, mais Mkwawa s’échappa et mena une guérilla pendant près de quatre ans, tandis que les Allemands brûlaient les récoltes et les villages et établissaient un fort à Iringa. Acculé en juillet 1898, Mkwawa se tira une balle plutôt que d’être capturé ; sa tête fut emportée en Allemagne, et le traité de Versailles en exigea la restitution. Un crâne que l’on pense être le sien fut rendu en 1954 et est conservé à Kalenga.
