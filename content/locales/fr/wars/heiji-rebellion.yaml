# French translations of the catalogue text (wave 10); step bodies follow later.
Heiji rebellion: Rébellion de Heiji
? "A coup and counter-coup in Heian-kyō (Kyoto) that left Taira no Kiyomori the dominant power at court and nearly destroyed the Minamoto. After the Hōgen rebellion, the retired emperor Go-Shirakawa’s adviser Fujiwara no Michinori (Shinzei) favoured Kiyomori, while his rival Fujiwara no Nobuyori found an ally in Minamoto no Yoshitomo, who resented the execution of his father in 1156 and the rewards given to the Taira. When Kiyomori left the capital on a pilgrimage to Kumano, Nobuyori and Yoshitomo struck on the night of 19 January 1160 (the ninth day of the twelfth month of Heiji 1, which began in 1159): they burned Go-Shirakawa’s Sanjō palace, held him and the young emperor Nijō in the imperial palace, and hunted down Shinzei, who was killed. Kiyomori hurried back, the emperor and the retired emperor escaped to his Rokuhara mansion, and on 5 February his son Shigemori lured the Minamoto out of the palace and defeated them at Rokuhara. Nobuyori was executed; Yoshitomo fled east and was murdered by a retainer in Owari, and his eldest sons were killed, but Kiyomori spared the twelve-year-old Yoritomo, who was exiled to Izu, and the infant Yoshitsune. Kiyomori rose to be chancellor in 1167, and the Minamoto rising of 1180 began the Genpei War."
: "Un coup d’État suivi d’un contre-coup à Heian-kyō (Kyoto), qui fit de Taira no Kiyomori la puissance dominante à la cour et faillit anéantir les Minamoto. Après la rébellion de Hōgen, Fujiwara no Michinori (Shinzei), conseiller de l’empereur retiré Go-Shirakawa, favorisait Kiyomori, tandis que son rival Fujiwara no Nobuyori trouva un allié en Minamoto no Yoshitomo, qui gardait rancune de l’exécution de son père en 1156 et des récompenses accordées aux Taira. Lorsque Kiyomori quitta la capitale pour un pèlerinage à Kumano, Nobuyori et Yoshitomo frappèrent dans la nuit du 19 janvier 1160 (le neuvième jour du douzième mois de la 1re année de l’ère Heiji, qui avait commencé en 1159) : ils incendièrent le palais Sanjō de Go-Shirakawa, retinrent celui-ci et le jeune empereur Nijō au palais impérial et pourchassèrent Shinzei, qui fut tué. Kiyomori revint en hâte, l’empereur et l’empereur retiré s’enfuirent dans sa résidence de Rokuhara et, le 5 février, son fils Shigemori attira les Minamoto hors du palais et les battit à Rokuhara. Nobuyori fut exécuté ; Yoshitomo s’enfuit vers l’est et fut assassiné par un vassal en Owari, et ses fils aînés furent tués, mais Kiyomori épargna Yoritomo, âgé de douze ans, qui fut exilé en Izu, ainsi que Yoshitsune, encore au berceau. Kiyomori s’éleva jusqu’à la charge de chancelier en 1167, et le soulèvement des Minamoto en 1180 ouvrit la guerre de Genpei."
