# Some French text was translated automatically.
"Kinship Wars (Heimosodat)": "Guerres des peuples frères (Heimosodat)"
"A series of expeditions by Finnish volunteers, and local uprisings they backed, in the Finnic-speaking borderlands of Soviet Russia in 1918–1922; the Viena expedition to White Karelia in 1918, the Petsamo expeditions of 1918 and 1920 and the Aunus expedition to Olonets Karelia in 1919 all failed, and the Treaty of Tartu of 14 October 1920 gave Finland Petsamo but returned the parishes of Repola and Porajärvi to Soviet Russia. An East Karelian uprising supported by Finnish volunteers from November 1921 was crushed by the Red Army in February 1922, and some 30,000 East Karelians fled to Finland.": "Une série d’expéditions de volontaires finlandais, et des soulèvements locaux qu’ils ont soutenus, dans les frontières finlandaises de la Russie soviétique en 1918-1922 ; l’expédition de Viena à Carélie blanche en 1918, les expéditions de Petsamo de 1918 et 1920 et l’expédition d’Aunus à Olonets Carélie en 1919 ont tous échoué, et le traité de Tartu du 14 octobre 1920 donne à la Finlande Petsamo mais retourne les paroisses de Repola et Porajärvi en Russie soviétique. En février 1922, l’Armée rouge a écrasé un soulèvement carélien de l’Est soutenu par des volontaires finlandais, et quelque 30 000 Karéliens de l’Est ont fui en Finlande."
"Finnish historians do not count these expeditions as wars between Finland and Soviet Russia, since most were private ventures of volunteers, with varying degrees of official backing. Finnish volunteers also fought for Estonia in 1919 and supported the Ingrian Finns’ uprising of 1919–1920.": "Les historiens finlandais ne considèrent pas ces expéditions comme des guerres entre la Finlande et la Russie soviétique, puisque la plupart étaient des entreprises privées de volontaires, avec divers degrés d’appui officiel."
"Finnish names are used, as in the sources. Viena is White Karelia, around Kalevala (Uhtua) and Kem; Aunus is Olonets Karelia, east of Lake Ladoga.": "Les noms finlandais sont utilisés, comme dans les sources. Viena est White Carelia, autour de Kalevala (Uhtua) et Kem ; Aunus est Olonets Karelia, à l’est du lac Ladoga."
