# French translations of the catalogue text (wave 13); step bodies follow later.
Herero and Nama war and genocide: Guerre et génocide des Héréros et des Namas
? The war of the Herero (Ovaherero) and Nama against German colonial rule in German South West Africa (Namibia), and the genocide with which Germany answered it. In January 1904 the Herero under Samuel Maharero rose against the loss of their land and cattle and the abuses of traders and settlers, killing more than a hundred German men. After the battle at the Waterberg (Ohamakari) on 11 August 1904 the German commander, General Lothar von Trotha, drove the Herero with their families and herds into the waterless Omaheke and ordered that every Herero found inside the colony be shot. In October 1904 the Nama under Hendrik Witbooi rose in the south and fought a guerrilla war that lasted, under leaders such as Jakob Marengo and Simon Kooper, into 1908. The survivors were held in concentration camps and made to work; about half of the prisoners died. Estimates of the dead range from 40,000 to 80,000 Herero, some 80 percent of the people, and about 10,000 Nama, half of them. The killings are widely regarded as the first genocide of the twentieth century; Germany acknowledged them as genocide in 2015.
: La guerre des Héréros (Ovaherero) et des Namas contre la domination coloniale allemande dans le Sud-Ouest africain allemand (Namibie), et le génocide par lequel l’Allemagne y répondit. En janvier 1904, les Héréros, menés par Samuel Maharero, se soulevèrent contre la perte de leurs terres et de leur bétail et contre les abus des marchands et des colons, tuant plus d’une centaine d’hommes allemands. Après la bataille du Waterberg (Ohamakari), le 11 août 1904, le commandant allemand, le général Lothar von Trotha, repoussa les Héréros, avec leurs familles et leurs troupeaux, dans l’Omaheke dépourvu d’eau et ordonna que tout Héréro trouvé à l’intérieur de la colonie soit abattu. En octobre 1904, les Namas, menés par Hendrik Witbooi, se soulevèrent dans le sud et livrèrent une guérilla qui se prolongea jusqu’en 1908 sous des chefs comme Jakob Marengo et Simon Kooper. Les survivants furent détenus dans des camps de concentration et astreints au travail ; environ la moitié des prisonniers moururent. Les estimations du nombre de morts vont de 40 000 à 80 000 Héréros, soit quelque 80 % du peuple, et environ 10 000 Namas, soit la moitié d’entre eux. Ces tueries sont largement considérées comme le premier génocide du XXe siècle ; l’Allemagne les a reconnues comme un génocide en 2015.
