"1875–1877": "1875–1877"
"Bosnia’s Christian peasants owed up to half their harvest to Muslim landlords, as well as taxes collected by tax farmers, and the bad harvest of 1874 and higher taxes in 1875 made their burden unbearable. In early July 1875 villagers around Nevesinje in Herzegovina clashed with Ottoman troops, and within weeks the revolt spread to Bileća, Stolac, Gacko and the Montenegrin border; Catholics around Gabela also rose, hoping for Austrian intervention. Bands of rebels destroyed border posts and the towers of the beys, and besieged Trebinje in August. In mid-August Serbs in the Bosnian Krajina rose too, around Kozara and Grmeč.": "Bosnie Les paysans chrétiens devaient jusqu’à la moitié de leur récolte aux propriétaires musulmans, ainsi que les impôts perçus par les fermiers fiscaux, et la mauvaise récolte de 1874 et les impôts plus élevés de 1875 rendaient leur fardeau insupportable. Au début de juillet 1875, des villageois autour de Nevesinje en Herzégovine s’affrontèrent avec les troupes ottomanes et, quelques semaines plus tard, la révolte se répandit à Bileća, Stolac, Gacko et à la frontière monténégrine ; les catholiques autour de Gabela s’élevaient également, espérant une intervention autrichienne. À la mi-août, les Serbes de la Krajina bosniaque se sont également levés autour de Kozara et de Grmeč."
"Montenegro and Serbia sent arms and volunteers, and Italians, Russians and others came to fight, while refugees fled to Austrian Dalmatia and Croatia and to Montenegro, between 100,000 and 250,000 by the end of 1876. The great powers tried to contain the crisis. The Andrássy Note of December 1875 and the Berlin Memorandum of May 1876 called for reforms, but the rebels would not lay down their arms without guarantees. Villages were burned and civilians driven out by both sides. In June 1876 Serbia and Montenegro went to war, and the rising merged into the wider wars that ended with the Austro-Hungarian occupation of 1878.": "Le Monténégro et la Serbie ont envoyé des armes et des volontaires, et les Italiens, les Russes et d’autres sont venus combattre, tandis que les réfugiés ont fui vers la Dalmatie autrichienne et la Croatie et vers le Monténégro, entre 100 000 et 250 000 à la fin de 1876. Les grandes puissances ont essayé de contenir la crise. Les villages furent brûlés et les civils chassés par les deux parties. En juin 1876, la Serbie-et-Monténégro partit en guerre, et la montée fusionna dans les guerres plus larges qui se terminèrent avec l’occupation austro-hongroise de 1878."
