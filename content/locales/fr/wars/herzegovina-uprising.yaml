# Some French text was translated automatically.
"Herzegovina Uprising of 1875–1877": "Herzégovine Inauguration de 1875–1877"
"A rising of Christian peasants, mostly Orthodox Serbs, against their Muslim landlords and Ottoman tax collectors, which began around Nevesinje in Herzegovina in July 1875 and spread to Bosnia. Aided by Montenegro and Serbia, it opened the Great Eastern Crisis that led to the Serbian and Montenegrin wars of 1876, the Russo-Turkish War of 1877–1878 and the Austro-Hungarian occupation of Bosnia and Herzegovina.": "Une montée des paysans chrétiens, principalement des Serbes orthodoxes, contre leurs propriétaires musulmans et les collecteurs d’impôt ottomans, qui ont commencé autour de Nevesinje en Herzégovine en juillet 1875 et se sont étendus à la Bosnie. Aidée par le Monténégro et la Serbie, elle a ouvert la Grande Crise orientale qui a conduit aux guerres serbe et monténégrine de 1876, la guerre russo-turque de 1877-1878 et l’occupation austro-hongroise de la Bosnie-Herzégovine."
"Dates are New Style (Gregorian); local Orthodox Christians used the Julian calendar, then 12 days behind. Numbers of refugees and dead are contemporary estimates and vary widely.": "Les dates sont New Style (Gregorian) ; les chrétiens orthodoxes locaux ont utilisé le calendrier julien, puis 12 jours derrière. Le nombre de réfugiés et de morts sont des estimations contemporaines et varient largement."
"Historians of the region still differ over how far the rising was a social revolt of peasants against landlords, a national rising and a religious war, and over the part played by Catholics, most of whom stayed out of it after the first months. Its fighting from June 1876 is told under the Montenegrin–Ottoman and Serbian–Ottoman wars.": "Les historiens de la région diffèrent encore quant à l’ampleur de la révolte sociale des paysans contre les propriétaires fonciers, à la montée nationale et à la guerre religieuse, et quant au rôle joué par les catholiques, dont la plupart sont restés en dehors après les premiers mois. Ses combats de juin 1876 sont racontés sous les guerres Monténégrin-Ottoman et Serbe-Ottoman."
