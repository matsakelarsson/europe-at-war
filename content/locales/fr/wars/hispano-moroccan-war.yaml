# French translations of the catalogue text (wave 12); step bodies follow later.
Hispano-Moroccan War: Guerre hispano-marocaine
? "A war between Spain and Morocco, called the African War (Guerra de África) in Spain and the War of Tetuán in Morocco. After tribesmen of the Anjera destroyed new fortifications outside Ceuta in August 1859, the government of Leopoldo O’Donnell declared war in October and landed an army of about 45,000 men at Ceuta. Through the winter it fought its way south along the coast, winning at Castillejos on 1 January 1860, and on 4–6 February it defeated the army of Mawlay al-Abbas, the sultan’s brother, and entered Tetuán. After a last Spanish victory at Wad-Ras on 23 March, Morocco made peace by the Treaty of Wad-Ras of 26 April 1860: it enlarged the territories of Ceuta and Melilla, promised Spain a fishing post at Santa Cruz de la Mar Pequeña on the Atlantic coast, and agreed to pay an indemnity of 20 million duros, with Tetuán held by Spain until it was paid. Spain lost about 4,000 dead, most of them to cholera and other disease, and Morocco about 6,000. The war was hugely popular in Spain, while in Morocco the indemnity emptied the treasury and opened the way to European loans and control of the customs."
: "Une guerre entre l’Espagne et le Maroc, appelée guerre d’Afrique (Guerra de África) en Espagne et guerre de Tétouan au Maroc. Après que des hommes de la tribu des Anjera eurent détruit de nouvelles fortifications aux abords de Ceuta en août 1859, le gouvernement de Leopoldo O’Donnell déclara la guerre en octobre et débarqua à Ceuta une armée d’environ 45 000 hommes. Durant l’hiver, celle-ci progressa vers le sud le long de la côte en combattant, l’emporta à Castillejos le 1er janvier 1860 et, du 4 au 6 février, battit l’armée de Mawlay al-Abbas, frère du sultan, et entra dans Tétouan. Après une dernière victoire espagnole à Wad-Ras le 23 mars, le Maroc fit la paix par le traité de Wad-Ras du 26 avril 1860 : il accepta l’agrandissement des territoires de Ceuta et de Melilla, promit à l’Espagne un poste de pêche à Santa Cruz de la Mar Pequeña, sur la côte atlantique, et s’engagea à payer une indemnité de 20 millions de douros, Tétouan restant aux mains de l’Espagne jusqu’à son paiement. L’Espagne perdit environ 4 000 morts, la plupart emportés par le choléra et d’autres maladies, et le Maroc environ 6 000. La guerre fut extrêmement populaire en Espagne, tandis qu’au Maroc l’indemnité vida le trésor et ouvrit la voie aux emprunts européens et au contrôle des douanes par les Européens."
