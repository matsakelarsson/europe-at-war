# French translations of the catalogue text (wave 10); step bodies follow later.
Hōgen rebellion: Rébellion de Hōgen
? "A short clash in Heian-kyō (Kyoto) over the imperial succession and the leadership of the Fujiwara regents’ house, in which warrior bands decided a dispute at court for the first time. When the retired emperor Toba died in the seventh month of 1156, his son the retired emperor Sutoku, whose line had been passed over in favour of his half-brother Go-Shirakawa, joined forces with the Minister of the Left Fujiwara no Yorinaga, who had lost out to his brother, the regent Fujiwara no Tadamichi. Both sides called in warriors, splitting families: Minamoto no Tameyoshi, his son Tametomo and Taira no Tadamasa joined Sutoku, while Tameyoshi’s eldest son Minamoto no Yoshitomo and Tadamasa’s nephew Taira no Kiyomori sided with Go-Shirakawa. Before dawn on 29 July 1156 (the eleventh day of the seventh month) Kiyomori and Yoshitomo attacked Sutoku’s headquarters at the Shirakawa palace with about 600 horsemen and set it on fire. Yorinaga died of an arrow wound; Sutoku was exiled to Sanuki on Shikoku, where he died in 1164; Tameyoshi and Tadamasa were beheaded, the first executions ordered by the court since 810, and Tametomo was exiled to Izu Ōshima. The victory made Kiyomori and Yoshitomo powers at court, and their rivalry led to the Heiji rebellion three years later."
: "Un bref affrontement à Heian-kyō (Kyoto) autour de la succession impériale et de la direction de la maison des régents Fujiwara, au cours duquel, pour la première fois, des bandes de guerriers tranchèrent un différend au sein de la cour. À la mort de l’empereur retiré Toba, au septième mois de 1156, son fils, l’empereur retiré Sutoku, dont la lignée avait été écartée au profit de son demi-frère Go-Shirakawa, fit cause commune avec le ministre de la Gauche Fujiwara no Yorinaga, qui avait été évincé au profit de son frère, le régent Fujiwara no Tadamichi. Les deux camps firent appel à des guerriers, ce qui divisa les familles : Minamoto no Tameyoshi, son fils Tametomo et Taira no Tadamasa rejoignirent Sutoku, tandis que le fils aîné de Tameyoshi, Minamoto no Yoshitomo, et le neveu de Tadamasa, Taira no Kiyomori, se rangèrent du côté de Go-Shirakawa. Avant l’aube du 29 juillet 1156 (le onzième jour du septième mois), Kiyomori et Yoshitomo attaquèrent le quartier général de Sutoku au palais de Shirakawa avec environ 600 cavaliers et y mirent le feu. Yorinaga mourut d’une blessure par flèche ; Sutoku fut exilé en Sanuki, à Shikoku, où il mourut en 1164 ; Tameyoshi et Tadamasa furent décapités, premières exécutions ordonnées par la cour depuis 810, et Tametomo fut exilé à Izu Ōshima. La victoire fit de Kiyomori et de Yoshitomo des puissances à la cour, et leur rivalité mena à la rébellion de Heiji trois ans plus tard."
