# French translations of the catalogue text (wave 11); step bodies follow later.
Holy Man’s rebellion: Rébellion du Saint Homme
? A millenarian rising in southern French Laos and north-eastern Siam, led by men who claimed to be phu mi bun, “people of merit” or holy men. In 1901 prophecies spread across the Mekong lands that a time of disaster was coming, when gravel would turn to gold and gold to gravel, and that a holy man would bring a just new order. They fell on ground prepared by French taxes and forced labour in Laos and by Siam’s new centralised provincial government, which was taking power from the old Lao lords of the Khorat plateau. In French Laos the movement was led by Ong Keo, a leader of the Mon-Khmer-speaking upland peoples (Lao Theung) of the Bolaven plateau, and his follower Ong Kommandam, an Alak; about 1,500 men ambushed a French column near Saravane in April 1901, and in April 1902 a crowd that marched on the French post at Savannakhet was fired upon, with about 150 killed. In Siam, Ong Man’s followers took Khemarat on 28 March 1902 and marched on Ubon, where Siamese troops with artillery, sent by the royal commissioner Prince Sanphasitthiprasong, routed them at Ban Saphue on 3–4 April, killing about 300 and capturing about 400; the leaders were executed and the rising in Siam ended that year. In Laos fighting went on in the uplands. Ong Keo was killed in 1910 during talks with the French commissioner, in circumstances the sources describe differently. Ong Kommandam escaped and led resistance from the Bolaven plateau for more than two decades, calling for the end of French rule and passing messages in a secret script he devised, until French troops killed him on 23 September 1936. His son Sithon Kommadam later became a leader of the Pathet Lao.
: Un soulèvement millénariste dans le sud du Laos français et le nord-est du Siam, mené par des hommes qui se disaient phu mi bun, « personnes de mérite » ou saints hommes. En 1901, des prophéties se répandirent dans les pays du Mékong, annonçant l’approche d’un temps de catastrophes, où le gravier se changerait en or et l’or en gravier, et la venue d’un saint homme qui instaurerait un nouvel ordre juste. Elles tombèrent sur un terrain préparé par les impôts et le travail forcé imposés par les Français au Laos et par la nouvelle administration provinciale centralisée du Siam, qui retirait le pouvoir aux anciens seigneurs lao du plateau de Khorat. Au Laos français, le mouvement fut mené par Ong Keo, un chef des peuples des hautes terres de langue môn-khmère (Lao Theung) du plateau des Bolovens, et par son disciple Ong Kommandam, un Alak ; environ 1 500 hommes tendirent une embuscade à une colonne française près de Saravane en avril 1901 et, en avril 1902, une foule qui marchait sur le poste français de Savannakhet essuya des tirs qui firent environ 150 morts. Au Siam, les partisans d’Ong Man prirent Khemarat le 28 mars 1902 et marchèrent sur Ubon, où des troupes siamoises appuyées par de l’artillerie, envoyées par le commissaire royal, le prince Sanphasitthiprasong, les mirent en déroute à Ban Saphue les 3 et 4 avril, en tuant environ 300 et en capturant environ 400 ; les chefs furent exécutés et le soulèvement prit fin au Siam cette année-là. Au Laos, les combats se poursuivirent dans les hautes terres. Ong Keo fut tué en 1910 au cours de pourparlers avec le commissaire français, dans des circonstances que les sources décrivent différemment. Ong Kommandam s’échappa et dirigea la résistance depuis le plateau des Bolovens pendant plus de deux décennies, appelant à la fin de la domination française et transmettant des messages dans une écriture secrète de son invention, jusqu’à ce que les troupes françaises le tuent le 23 septembre 1936. Son fils Sithon Kommadam devint plus tard l’un des dirigeants du Pathet Lao.
