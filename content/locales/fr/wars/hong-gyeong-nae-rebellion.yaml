# French translations of the catalogue text (wave 10); step bodies follow later.
Hong Gyeong-nae’s rebellion: Rébellion de Hong Gyeong-nae
A rising in Pyongan province, in north-western Korea, led by Hong Gyeong-nae, an impoverished yangban and geomancer, with discontented local gentry, merchants and miners, after a year of famine. They resented the discrimination of the court in Hanseong against men of the north-west and the burden of compulsory grain loans and taxes, and drew on prophecies of the fall of the Yi dynasty. Rising at Gasan on the night of 31 January 1812, they took eight towns north of the Cheongcheon River within days and opened the government granaries, but were beaten at Songnim near Bakcheon on 11 February and soon after near Gwaksan, and fell back into the walled town of Jeongju. There the rebels and the peasants who had fled to them held out against the government army for about a hundred days, until the wall was blown open by a mine on 29 May 1812. Hong was killed; of 2,983 people taken, 1,917 were executed. The rising is also called the Pyeongan or Gwanseo peasant war.: Un soulèvement dans la province de Pyongan, dans le nord-ouest de la Corée, mené après une année de famine par Hong Gyeong-nae, un yangban appauvri et géomancien, avec des notables locaux, des marchands et des mineurs mécontents. Ils s’indignaient de la discrimination exercée par la cour de Hanseong contre les hommes du nord-ouest et du poids des prêts de grain obligatoires et des impôts, et s’appuyaient sur des prophéties annonçant la chute de la dynastie Yi. Soulevés à Gasan dans la nuit du 31 janvier 1812, ils prirent en quelques jours huit villes au nord de la rivière Cheongcheon et ouvrirent les greniers du gouvernement, mais furent battus à Songnim, près de Bakcheon, le 11 février, puis peu après près de Gwaksan, et se replièrent dans la ville fortifiée de Jeongju. Les rebelles et les paysans qui s’étaient réfugiés auprès d’eux y résistèrent à l’armée gouvernementale pendant une centaine de jours, jusqu’à ce que la muraille soit éventrée par une mine le 29 mai 1812. Hong fut tué ; sur les 2 983 personnes capturées, 1 917 furent exécutées. Le soulèvement est aussi appelé guerre paysanne du Pyeongan ou du Gwanseo.
