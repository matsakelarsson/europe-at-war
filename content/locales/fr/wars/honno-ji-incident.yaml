# French translations of the catalogue text (wave 10); step bodies follow later.
Honnō-ji Incident and the Oda succession war: Incident du Honnō-ji et guerre de succession des Oda
The killing of Oda Nobunaga by his general Akechi Mitsuhide, and the year of fighting from which Hashiba (later Toyotomi) Hideyoshi emerged as Nobunaga’s heir in all but name. Before dawn on 21 June 1582 Mitsuhide, sent with his army to reinforce Hideyoshi against the Mōri, turned instead on Kyoto and surrounded the temple of Honnō-ji, where Nobunaga was staying with a small escort; Nobunaga died in the burning temple, and his heir Oda Nobutada was killed at the Nijō palace the same morning. Hideyoshi, besieging Takamatsu castle in Bitchū, made peace with the Mōri and marched his army back in about a week, and on 2 July he beat Mitsuhide at Yamazaki; Mitsuhide was killed as he fled. At the Kiyosu conference the Oda generals chose Nobutada’s infant son as heir, but Hideyoshi and Shibata Katsuie, the senior Oda general, soon fell out, and in June 1583 Hideyoshi defeated Shibata’s army at Shizugatake and took his castle of Kitanoshō, where Shibata and his wife Oichi, Nobunaga’s sister, killed themselves.: L’assassinat d’Oda Nobunaga par son général Akechi Mitsuhide, et l’année de combats d’où Hashiba (plus tard Toyotomi) Hideyoshi sortit héritier de Nobunaga en tout sauf le nom. Avant l’aube du 21 juin 1582, Mitsuhide, envoyé avec son armée renforcer Hideyoshi contre les Mōri, se retourna au contraire contre Kyoto et encercla le temple Honnō-ji, où Nobunaga séjournait avec une petite escorte ; Nobunaga périt dans le temple en flammes, et son héritier Oda Nobutada fut tué au palais Nijō le même matin. Hideyoshi, qui assiégeait le château de Takamatsu dans le Bitchū, fit la paix avec les Mōri et ramena son armée en une semaine environ, et le 2 juillet il battit Mitsuhide à Yamazaki ; Mitsuhide fut tué dans sa fuite. À la conférence de Kiyosu, les généraux des Oda choisirent comme héritier le fils en bas âge de Nobutada, mais Hideyoshi et Shibata Katsuie, le plus ancien des généraux des Oda, se brouillèrent bientôt et, en juin 1583, Hideyoshi défit l’armée de Shibata à Shizugatake et prit son château de Kitanoshō, où Shibata et son épouse Oichi, sœur de Nobunaga, se donnèrent la mort.
