# Some French text was translated automatically.
"Hook and Cod wars": "Guerre des Hameçons et des Cabillauds"
"A long series of feuds and civil wars in the County of Holland and Zeeland between two parties, the Hooks (Hoeken), mostly nobles, and the Cods (Kabeljauwen), drawn largely from the towns. They began in 1350 in a struggle between Countess Margaret and her son William V, flared again when Jacqueline of Bavaria fought her uncle John and then Philip the Good of Burgundy for the county, and became a lasting rivalry between factions in the towns. Philip, backed by the Cods, beat Jacqueline’s English allies at Brouwershaven in 1426 and took over Holland in 1433. The last rising, the Hook revolt of Frans van Brederode (1488–1490), ended with his defeat and death.": "Une longue série de querelles et de guerres civiles dans le comté de Hollande et Zélande entre deux partis, les Hooks (Hoeken), la plupart des nobles, et les Cods (Kabeljauwen), puisés largement dans les villes. Ils ont commencé en 1350 dans une lutte entre la comtesse Margaret et son fils William V, a éclaté à nouveau lorsque Jacqueline de Bavière a combattu son oncle John puis Philip le Bon de Bourgogne pour le comté, et est devenu une rivalité durable entre les factions dans les villes. Philippe, soutenu par les Cods, bat Jacqueline ís alliés anglais à Brouwershaven en 1426 et prend la Hollande en 1433. La dernière montée, la révolte de Hook de Frans van Brederode (1488-1490), se termina par sa défaite et sa mort."
"The origin of the party names is uncertain; one explanation is that the hook catches the cod. The parties’ make-up and loyalties changed over the 140 years, and the wars were mostly short campaigns, sieges and town riots separated by long truces.": "L’origine des noms du parti est incertaine ; une explication est que le hameçon capture la morue. Le maquillage et les loyautés des partis ont changé au cours des 140 ans, et les guerres ont été pour la plupart de courtes campagnes, siège et émeutes de villes séparées par de longues trêves."
