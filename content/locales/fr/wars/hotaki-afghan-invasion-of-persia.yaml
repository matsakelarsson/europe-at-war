# French translations of the catalogue text (wave 7); step bodies follow later.
Hotaki Afghan invasion of Persia: Invasion de la Perse par les Afghans hotaki
The revolt of the Ghilzai Afghans of Kandahar against Safavid Persia and their conquest of its capital. In 1709 the Hotaki chief Mirwais killed the Persian governor of Kandahar and beat off every army sent against him. His son Mahmud invaded Persia, routed the Safavid army at Gulnabad in March 1722 and starved Isfahan into surrender after a seven-month siege in which tens of thousands died; Shah Sultan Husayn gave him the crown. Russia and the Ottoman Empire seized the north and west of the country, while the Safavid prince Tahmasp held out in the north. Mahmud’s cousin Ashraf beat an Ottoman army in 1726, but from 1729 Tahmasp’s general Nader drove the Afghans out of Persia in a few months, and Ashraf was killed in 1730.: La révolte des Afghans ghilzai de Kandahar contre la Perse safavide et leur conquête de sa capitale. En 1709, le chef hotaki Mirwais tua le gouverneur persan de Kandahar et repoussa toutes les armées envoyées contre lui. Son fils Mahmud envahit la Perse, mit en déroute l’armée safavide à Gulnabad en mars 1722 et réduisit Ispahan à capituler par la famine au terme d’un siège de sept mois au cours duquel des dizaines de milliers de personnes moururent ; le shah Sultan Husayn lui remit la couronne. La Russie et l’Empire ottoman s’emparèrent du nord et de l’ouest du pays, tandis que le prince safavide Tahmasp résistait dans le nord. Ashraf, cousin de Mahmud, battit une armée ottomane en 1726, mais à partir de 1729 Nader, le général de Tahmasp, chassa les Afghans de Perse en quelques mois, et Ashraf fut tué en 1730.
