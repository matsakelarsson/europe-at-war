# French translations of the catalogue text (wave 9); step bodies follow later.
Huang Chao rebellion: Rébellion de Huang Chao
? "The great rising against the Tang dynasty led first by Wang Xianzhi and then by Huang Chao, salt smugglers from the eastern plain. Out of famine and heavy taxes, rebel bands formed in 874–875 between the Yellow River and the Huai. After Wang was killed in 878, Huang Chao led his army in a march of thousands of kilometres: across the Yangtze, through Fujian to Guangzhou, which he took in 879, and back north through Hunan and along the Yangtze. In the winter of 880–881 he took Luoyang and Chang’an, the emperor Xizong fled to Chengdu, and Huang proclaimed himself emperor of Qi. Tang armies and the regional governors closed in on Chang’an, where famine followed. In 883 the Shatuo Turk Li Keyong retook the capital, and Huang, pursued across Henan, was killed in a valley in Shandong in July 884. Huge numbers died, in the sack of Guangzhou, the massacres in Chang’an and the famine. The Tang survived in name, but power passed to the generals who had fought the rebels, among them Huang’s former officer Zhu Wen, who ended the dynasty in 907."
: "Le grand soulèvement contre la dynastie Tang mené d’abord par Wang Xianzhi puis par Huang Chao, contrebandiers de sel de la plaine orientale. Nées de la famine et du poids des impôts, des bandes rebelles se formèrent en 874–875 entre le fleuve Jaune et la Huai. Après la mort de Wang, tué en 878, Huang Chao entraîna son armée dans une marche de plusieurs milliers de kilomètres : au-delà du Yangtsé, à travers le Fujian jusqu’à Canton, qu’il prit en 879, puis de nouveau vers le nord par le Hunan et le long du Yangtsé. Au cours de l’hiver 880–881, il prit Luoyang et Chang’an, l’empereur Xizong s’enfuit à Chengdu, et Huang se proclama empereur de Qi. Les armées des Tang et les gouverneurs régionaux se resserrèrent autour de Chang’an, où la famine s’installa. En 883, le Turc shatuo Li Keyong reprit la capitale, et Huang, poursuivi à travers le Henan, fut tué dans une vallée du Shandong en juillet 884. Les morts furent innombrables, lors du sac de Canton, dans les massacres de Chang’an et pendant la famine. Les Tang survécurent de nom, mais le pouvoir passa aux généraux qui avaient combattu les rebelles, parmi lesquels Zhu Wen, ancien officier de Huang, qui mit fin à la dynastie en 907."
