# French translations of the catalogue text (wave 11); step bodies follow later.
Hukbalahap rebellion: Rébellion des Hukbalahap
? A communist-led peasant rebellion in Central Luzon against the government of the newly independent Philippines. The Hukbalahap (Hukbo ng Bayan Laban sa Hapon, the People’s Army against the Japanese) had been founded in 1942 by the Communist Party of the Philippines (PKP) and the peasant unions of the rice plains around Mount Arayat, where tenant farmers had long struggled with the landlords of the great estates, and it fought the Japanese occupation. After the war it was denied recognition, its elected congressmen, among them its commander Luis Taruc, were unseated in 1946, and the landlords’ private armies and the military police turned on its followers. From mid-1946 the Huks took up arms again, and by 1950, as the People’s Liberation Army (HMB), they had some 11,000–13,000 fighters and raided towns close to Manila. Mass arrests of the party leadership in Manila in October 1950, a reformed army, American aid and the policies of Defence Secretary and later President Ramon Magsaysay, who combined military pressure with offers of land, amnesty and resettlement, broke the movement. Taruc surrendered on 17 May 1954. Army figures give about 9,700 Huks and 1,600 soldiers killed.
: Une rébellion paysanne dirigée par les communistes dans le centre de Luçon contre le gouvernement des Philippines nouvellement indépendantes. Le Hukbalahap (Hukbo ng Bayan Laban sa Hapon, l’Armée du peuple contre les Japonais) avait été fondé en 1942 par le Parti communiste des Philippines (PKP) et les syndicats paysans des plaines rizicoles entourant le mont Arayat, où les métayers luttaient depuis longtemps contre les propriétaires des grands domaines, et il avait combattu l’occupation japonaise. Après la guerre, il se vit refuser toute reconnaissance, ses élus au Congrès, parmi lesquels son commandant Luis Taruc, furent privés de leur siège en 1946, et les milices privées des propriétaires et la police militaire s’en prirent à ses partisans. À partir de la mi-1946, les Huks reprirent les armes, et en 1950, devenus l’Armée populaire de libération (HMB), ils comptaient de 11 000 à 13 000 combattants et lançaient des raids sur des villes proches de Manille. Les arrestations massives de la direction du parti à Manille en octobre 1950, une armée réformée, l’aide américaine et la politique du secrétaire à la Défense, puis président, Ramon Magsaysay, qui associait la pression militaire à des offres de terres, d’amnistie et de réinstallation, brisèrent le mouvement. Taruc se rendit le 17 mai 1954. Selon les chiffres de l’armée, environ 9 700 Huks et 1 600 soldats furent tués.
