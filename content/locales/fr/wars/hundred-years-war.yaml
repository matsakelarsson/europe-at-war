"1341–1347": "1341–1347"
"The truce did not hold for long. In 1341 the death of Duke John III of Brittany without children set off a war of succession there, with France backing Charles of Blois, husband of the duke’s niece, and England backing the duke’s half-brother John of Montfort; it went on, with English garrisons in Brittany, until 1364. In 1345 Henry of Grosmont, Earl of Derby, won back much of the Dordogne and Garonne valleys for Edward and beat a larger French force at Auberoche. The next spring Philip’s son John, Duke of Normandy, besieged Aiguillon on the Garonne.": "La trêve n’a pas tenu longtemps. En 1341, la mort du duc Jean III de Bretagne sans enfants y a déclenché une guerre de succession, avec le soutien de la France Charles de Blois, mari de la nièce duc et l’Angleterre soutenant le demi-frère du duc Jean de Montfort ; elle a continué, avec les garnisons anglaises en Bretagne, jusqu’en 1364. En 1345, Henry de Grosmont, comte de Derby, remporta une grande partie des vallées de la Dordogne et de la Garonne pour Edward et battit une force française plus importante à Auberoche. Le printemps suivant, le fils de Philippe John, duc de Normandie, assiégea Aiguillon sur la Garonne."
"On 12 July 1346 Edward landed with some 10,000–15,000 men at Saint-Vaast-la-Hougue in the Cotentin. His army burned and plundered its way across Normandy, stormed and sacked Caen on 26 July and marched up the Seine to within sight of Paris before turning north. With Philip’s army in pursuit it forced the ford of Blanchetaque across the tidal Somme on 24 August. Two days later Edward drew up his army on a slope near Crécy-en-Ponthieu, his men-at-arms on foot and his archers on the flanks.": "Le 12 juillet 1346, Edward débarqua avec quelque 10 000 à 15 000 hommes à Saint-Vaast-la-Hougue dans le Cotentin. Son armée brûlait et pillait son chemin en Normandie, s’empara de Caen le 26 juillet et monta sur la Seine en vue de Paris avant de tourner vers le nord. Deux jours plus tard, Edward dessina son armée sur une pente près de Crécy-en-Ponthieu, ses hommes à pied et ses archers sur les flancs."
"Late on 26 August the French attacked before they were fully formed. Their Genoese crossbowmen were shot down by English and Welsh longbowmen, and charge after charge of mounted knights broke against the English line until nightfall. By one count more than 1,500 French knights and squires died, among them the blind King John of Bohemia. Edward went on to besiege Calais, which held out for eleven months; Philip came to relieve it but withdrew, and the starving town surrendered on 3 August 1347. Edward expelled most of its people and settled English in their place. A truce followed in September 1347, and the next year the Black Death reached France and England.": "À la fin du 26 août, les Français attaquèrent avant qu’ils ne fussent complètement formés. Leurs arbalètes génois furent abattus par des longbowmen anglais et gallois, et les chefs d’accusation de chevaliers montés se brisèrent contre la ligne anglaise jusqu’à la tombée de la nuit. Edward continua à assiéger Calais, qui se déroula pendant onze mois ; Philippe vint le soulager mais se retira, et la ville affamée se rendit le 3 août 1347. Edward expulsa la plupart de ses habitants et s’installa en anglais à leur place. Une trêve suivit en septembre 1347, et l’année suivante la mort noire atteignit la France et l’Angleterre."
