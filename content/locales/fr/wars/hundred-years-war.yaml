"Brétigny": "Brétigny"
"8 May 1360": "8 mai 1360"
"The terms were drawn up in a hamlet near Chartres, not far from where Black Monday’s storm had struck the English army.": "Les termes ont été rédigés dans un hameau près de Chartres, non loin de là où la tempête du lundi noir avait frappé l’armée anglaise."
"24 October 1360": "24 octobre 1360"
"The two kings ratified the treaty at Calais, and John was released on payment of the first part of his ransom.": "Les deux rois ont ratifié le traité à Calais, et Jean a été libéré sur paiement de la première partie de sa rançon."
"To Chartres": "Vers Chartres"
"Ceded to Edward III in full sovereignty, 1360": "Concédé à Edward III en pleine souveraineté, 1360"
"Charles V and Du Guesclin": "Charles V et Du Guesclin"
"1364–1380": "1364–1380"
"Charles V, king from 1364, chose to rebuild his kingdom rather than risk great battles. His captain Bertrand du Guesclin, a minor Breton noble, beat the Navarrese at Cocherel in May 1364, but in September an Anglo-Breton victory at Auray, where Charles of Blois was killed, ended the Breton war in favour of John of Montfort. To rid France of the free companies, Du Guesclin led many of them into Castile in 1366 to put Henry of Trastámara on the throne in place of his half-brother Peter. The Black Prince restored Peter by winning at Nájera on 3 April 1367, but Henry won the kingdom in 1369, and Castile became France’s ally.": "Charles V, roi de 1364, choisit de reconstruire son royaume plutôt que de risquer de grandes batailles. Son capitaine Bertrand du Guesclin, un noble breton mineur, bat la Navarre à Cocherel en mai 1364, mais en septembre une victoire anglo-bretonne à Auray, où Charles de Blois est tué, met fin à la guerre bretonne en faveur de Jean de Montfort. Pour débarrasser la France des compagnies libres, Du Guesclin conduisit beaucoup d’entre eux en Castille en 1366 pour mettre Henri de Trastámara sur le trône à la place de son demi-frère Pierre. Le Prince noir rétablit Pierre en remportant à Nájera le 3 avril 1367, mais Henry gagna le royaume en 1369, et la Castille devint alliée de France."
"The Nájera campaign left the prince ill and in debt, and a hearth tax he raised in Aquitaine led great Gascon lords to appeal to the king in Paris. Charles accepted the appeals as their overlord, since the renunciations of 1360 had never been made, and in 1369 the war resumed. The French avoided battle, wore down English garrisons and took towns by siege, bribery and persuasion. Du Guesclin, made Constable in 1370, destroyed part of Robert Knolles’s army at Pontvallain that December. The Black Prince retook Limoges, which had gone over to the French, and sacked it; Froissart’s figure of 3,000 dead is now thought much too high.": "La campagne de Nájera laissa le prince malade et endetté, et une taxe d’entrée qu’il éleva en Aquitaine conduisit les grands seigneurs de Gascon à faire appel au roi de Paris. Charles accepta les appels comme leur maître excessif, puisque les renonciations de 1360 n’avaient jamais été faites, et en 1369 la guerre reprit. Du Guesclin, fait gendarme en 1370, détruit une partie de l’armée de Robert Knolles à Pontvallain en décembre. Le prince noir reprend Limoges, qui était allé vers les Français, et l’a renvoyé ; Froissart , le chiffre de 3000 morts est maintenant considéré beaucoup trop élevé."
"In June 1372 a Castilian galley fleet destroyed an English fleet off La Rochelle, and Poitou and Saintonge fell to the French within months. John of Gaunt marched from Calais to Bordeaux in 1373 without bringing the French to battle, losing many men and most of his horses. A truce was agreed at Bruges in 1375; the Black Prince died in 1376 and Edward III in 1377. When Du Guesclin died at the siege of Châteauneuf-de-Randon in July 1380, and Charles V that September, England held little more than Calais, Bordeaux and Bayonne with a strip of the Gascon coast, and Brest and Cherbourg.": "En juin 1372, une flotte de galères castilliennes détruisit une flotte anglaise au large de La Rochelle, et Poitou et Saintonge tombèrent aux mains des Français en quelques mois. Jean de Gaunt marcha de Calais à Bordeaux en 1373 sans amener les Français au combat, perdant beaucoup d’hommes et la plupart de ses chevaux. Une trêve fut convenue à Bruges en 1375 ; le prince noir mourut en 1376 et Edward III en 1377. Quand Du Guesclin mourut au siège de Châteauneuf-de-Randon en juillet 1380, et Charles V ce septembre, l’Angleterre tenait peu plus que Calais, Bordeaux et Bayonne avec une bande de la côte de Gascon, et Brest et Cherbourg."
"Battle of Nájera": "Bataille de Nájera"
"3 April 1367, victory for the Black Prince and Peter of Castile": "3 avril 1367, victoire pour le Prince Noir et Pierre de Castille"
"Battle of La Rochelle": "Bataille de La Rochelle"
"22–23 June 1372, Castilian victory": "22-23 juin 1372, victoire castillane"
"Deaths of Du Guesclin and Charles V": "Décès de Du Guesclin et Charles V"
"13 July and 16 September 1380": "13 juillet et 16 septembre 1380"
"Cocherel": "Cocherel"
"16 May 1364": "16 mai 1364"
"Du Guesclin beat an army of Charles of Navarre’s supporters under the Gascon Captal de Buch, three days before Charles V’s coronation.": "Du Guesclin a battu une armée de partisans de Charles de Navarre sous la direction du Captal de Buch, trois jours avant le couronnement de Charles V."
"Auray": "À l’heure"
"29 September 1364": "29 septembre 1364"
"John of Montfort and his English allies under John Chandos beat Charles of Blois, who was killed. Du Guesclin was taken prisoner.": "John de Montfort et ses alliés anglais sous John Chandos ont battu Charles de Blois, qui a été tué. Du Guesclin a été fait prisonnier."
"3 April 1367": "3 avril 1367"
"The Black Prince routed Henry of Trastámara’s Castilian and French army and captured Du Guesclin, but Peter could not pay what he had promised.": "Le prince noir a fait route vers Henri de Trastámaras Castilian et l’armée française et capturé Du Guesclin, mais Pierre ne pouvait pas payer ce qu’il avait promis."
"Pontvallain": "Pontvallain"
"4 December 1370": "4 décembre 1370"
"Du Guesclin made a night march through rain and fell on part of Knolles’s army as it broke up into winter quarters.": "Du Guesclin a fait une marche nocturne à travers la pluie et est tombé sur une partie de l’armée de Knolles, car il s’est séparé en quartiers d’hiver."
"Limoges": "Limoges"
"19 September 1370": "19 septembre 1370"
"The Black Prince, too ill to ride and carried in a litter, stormed the city after its bishop had handed it to the French.": "Le Prince Noir, trop malade pour monter et porter dans une litière, s’empare de la ville après que son évêque l’ait remise aux Français."
"22–23 June 1372": "22–23 juin 1372"
"Castilian galleys under Ambrosio Boccanegra destroyed the Earl of Pembroke’s fleet, which carried money and men for Aquitaine. Pembroke was captured.": "Des galères castillaises sous Ambrosio Boccanegra ont détruit le comte de Pembroke, qui transportait de l’argent et des hommes pour l’Aquitaine. Pembroke a été capturé."
"Châteauneuf-de-Randon": "Châteauneuf-de-Randon"
"13 July 1380": "13 juillet 1380"
"Du Guesclin fell ill and died while besieging the castle. Its garrison is said to have laid the keys on his body.": "Du Guesclin est tombé malade et est mort en assiégeant le château. Sa garnison aurait posé les clés sur son corps."
"Brest": "Brest"
"From 1378": "A partir de 1378"
"The Duke of Brittany leased the port to the English, who held it until 1397.": "Le duc de Bretagne loua le port aux Anglais, qui le conservèrent jusqu’en 1397."
"Cherbourg": "Cherbourg"
"Leased to the English by Charles of Navarre and held until 1394.": "Loué aux Anglais par Charles de Navarre et détenu jusqu’en 1394."
"Black Prince, 1367": "Prince noir, 1367"
"Knolles, 1370": "Coquilles, 1370"
"John of Gaunt, 1373": "Jean de Gaunt, 1373"
"Agincourt": "Agincourt"
"1389–1415": "1389–1415"
"For a generation the war went on mostly in truces. One agreed at Leulinghem in 1389 was extended in 1396, when Richard II married the French king’s daughter Isabella. Richard was deposed in 1399 by his cousin Henry of Lancaster, while in France Charles VI suffered bouts of madness from 1392 and his kinsmen fought to control the government. After the Duke of Burgundy’s men murdered the king’s brother, Louis of Orléans, in 1407, the Burgundian and Armagnac factions slid into civil war, and both sought English help. Henry V, king from 1413, revived the claim to the French throne and demanded the Brétigny lands and Normandy.": "Pendant une génération, la guerre se poursuivit essentiellement en trêves. L’un d’eux fut décidé à Leulinghem en 1389, prolongé en 1396 lorsque Richard II épousa Isabella, fille du roi français. Richard fut déposé en 1399 par son cousin Henry de Lancaster, tandis qu’en France Charles VI souffrit de folies depuis 1392 et ses parents luttèrent pour contrôler le gouvernement. Après que le duc de Bourgogne eut assassiné le frère du roi, Louis d’Orléans, en 1407, les factions bourguignonne et armagnaque se mirent à la guerre civile, et tous deux cherchèrent l’aide anglaise. Henry V, roi de 1413, renoua avec le trône français et demanda les terres de Brétigny et la Normandie."
"On 13 August 1415 Henry landed near Harfleur, at the mouth of the Seine, with about 12,000 men. The town held out until 22 September, and dysentery killed or disabled many of his men. Henry left a garrison and set out with perhaps 6,000–9,000 men to march to Calais. Finding the fords of the Somme guarded, he had to go far upstream before crossing on 19 October, and on 24 October a much larger French army, led by the Constable Charles d’Albret and the great lords of the Armagnac party, blocked his road near Azincourt.": "Le 13 août 1415, Henry débarqua près de Harfleur, à l’embouchure de la Seine, avec environ 12 000 hommes. La ville s’arrêta jusqu’au 22 septembre, et la dysenterie tua ou handicapa beaucoup de ses hommes. Trouver les forts de la Somme gardés, il a dû aller loin en amont avant de traverser le 19 octobre, et le 24 octobre une armée française beaucoup plus grande, dirigée par le gendarme Charles d’Albret et les grands seigneurs du parti Armagnac, a bloqué sa route près d’Azincourt."
"On 25 October, St Crispin’s Day, the French men-at-arms advanced on foot across a narrow, freshly ploughed and rain-soaked field between two woods. Shot at by archers from both flanks, they crowded together and were cut down or crushed in the mud when they reached the English line. Fearing a renewed attack, Henry ordered many of the prisoners to be killed. Several thousand French died, among them the Constable and the dukes of Alençon, Bar and Brabant, and Charles of Orléans was taken prisoner. The English lost a few hundred at most, among them the Duke of York.": "Le 25 octobre, le jour de la St Crispin's, les hommes d’armes français avançaient à pied sur un champ étroit, fraîchement labouré et pluvieux entre deux bois. Tirés par des archers des deux flancs, ils se sont encombrés et ont été coupés ou écrasés dans la boue lorsqu’ils atteignirent la ligne anglaise. Craignant une nouvelle attaque, Henry ordonna la mort de nombreux prisonniers. Plusieurs milliers de Français sont morts, parmi lesquels le gendarme et les ducs d’Alençon, Bar et Brabant, et Charles d’Orléans a été fait prisonnier. Les Anglais ont perdu quelques centaines au plus, parmi eux le duc d’York."
"Siege of Harfleur": "Siège de Harfleur"
"18 August – 22 September 1415": "18 août – 22 septembre 1415"
"Battle of Agincourt": "Bataille d’Agincourt"
"25 October 1415, English victory": "25 octobre 1415, victoire anglaise"
"French dead": "Français morts"
"several thousand, including many great nobles": "plusieurs milliers, y compris beaucoup de grands nobles"
"Harfleur": "Harfleur"
"The port held out for five weeks against Henry’s guns. He expelled many of its people and made it an English base.": "Le port a tenu pendant cinq semaines contre les armes d’Henry. Il a expulsé beaucoup de ses gens et en a fait une base anglaise."
"Rouen": "Rouen"
"September–October 1415": "septembre–octobre 1415"
"The French army gathered at Rouen and then moved north to keep between Henry and Calais.": "L’armée française s’est rassemblée à Rouen puis a déménagé vers le nord pour garder entre Henry et Calais."
"Crossing of the Somme": "Traversée de la Somme"
"19 October 1415": "19 octobre 1415"
"After a week’s march upstream, the English crossed the river at unguarded fords near Béthencourt and Voyennes.": "Après une semaine de marche en amont, les Anglais traversèrent la rivière à des gués non protégés près de Béthencourt et de Voyennes."
"25 October 1415": "25 octobre 1415"
"About four-fifths of Henry’s army were archers. The French dead included a large part of the nobility of northern France.": "Environ les quatre cinquièmes de l’armée d’Henri étaient des archers. Les morts français comprenaient une grande partie de la noblesse du nord de la France."
"29 October 1415": "29 octobre 1415"
"Henry’s exhausted army reached Calais four days after the battle and sailed for England in November.": "L’armée épuisée de Henry atteignit Calais quatre jours après la bataille et s’embarqua pour l’Angleterre en novembre."
"Henry V": "Henry V"
"French army": "Armée française"
"Normandy and the Treaty of Troyes": "Normandie et Traité de Troyes"
"1417–1422": "1417–1422"
"Henry returned in August 1417 to conquer Normandy, landing at Touques. Caen was stormed on 4 September and many of its people killed. Town after town surrendered over the next year, while the Armagnac government was paralysed; in May 1418 the Burgundians seized Paris and killed hundreds of Armagnacs, among them the Count of Armagnac himself. From July 1418 Henry besieged Rouen. The city expelled more than 12,000 of its poor to save food, and Henry would not let them through his lines; many starved in the ditch below the walls. Rouen surrendered on 19 January 1419, and by the end of the year almost all of Normandy was in English hands.": "Henri retourna en août 1417 pour conquérir la Normandie, débarquant à Touques. Caen fut pris d’assaut le 4 septembre et beaucoup de ses habitants furent tués. Ville après ville se rendit l’année suivante, tandis que le gouvernement Armagnac était paralysé ; en mai 1418 les Burgundiens saisirent Paris et tuèrent des centaines d’Armagnacs, dont le comte d’Armagnac lui-même. La ville expulsa plus de 12 000 de ses pauvres pour sauver la nourriture, et Henry ne voulut pas les laisser traverser ses lignes ; beaucoup affamés dans le fossé sous les murs. Rouen se rendit le 19 janvier 1419, et à la fin de l’année presque toute la Normandie était entre les mains des Anglais."
"The dauphin Charles and the Duke of Burgundy, John the Fearless, met on the bridge at Montereau on 10 September 1419 to make common cause, and the dauphin’s men killed the duke. His son Philip the Good allied with England. By the Treaty of Troyes, sealed on 21 May 1420, Charles VI recognised Henry as his heir and as regent of France, disinheriting the dauphin, and Henry married the king’s daughter Catherine on 2 June. Henry took Montereau and Melun and entered Paris with Charles VI on 1 December 1420.": "Le dauphin Charles et le duc de Bourgogne, Jean l’Intrépide, se rencontrèrent sur le pont à Montereau le 10 septembre 1419 pour faire cause commune, et les dauphins tuèrent le duc. Son fils Philippe le Bon allié avec l’Angleterre. Par le traité de Troyes, scellé le 21 mai 1420, Charles VI reconnaît Henry comme son héritier et régent de France, déshérite du dauphin, et Henri épouse la fille du roi Catherine le 2 juin. Henry prend Montereau et Melun et entre à Paris avec Charles VI le 1er décembre 1420."
"The dauphin still held France south of the Loire, and with Scottish help his army beat the English at Baugé on 22 March 1421, killing Henry’s brother Thomas, Duke of Clarence. Henry came back to take Meaux after a siege of seven months, but he fell ill with dysentery and died at Vincennes on 31 August 1422, aged 35. Charles VI died seven weeks later. Henry’s nine-month-old son was proclaimed Henry VI, king of England and France, and the dauphin took the title Charles VII.": "Le dauphin tenait toujours la France au sud de la Loire, et avec l’aide écossaise son armée battait les Anglais à Baugé le 22 mars 1421, tuant Thomas, frère de Henry, duc de Clarence. Henri revint prendre Meaux après un siège de sept mois, mais il tomba malade de dysenterie et mourut à Vincennes le 31 août 1422, âgé de 35 ans. Charles VI mourut sept semaines plus tard. Henri VI, roi d’Angleterre et de France, fut proclamé fils de neuf mois. Le dauphin prit le titre de Charles VII."
"Siege of Rouen": "Siège de Rouen"
"29 July 1418 – 19 January 1419": "29 juillet 1418 – 19 janvier 1419"
"Treaty of Troyes": "Traité de Troyes"
"21 May 1420, Henry V heir and regent of France": "21 mai 1420, Henry V héritier et régent de France"
"Death of Henry V": "Décès d’Henry V"
"31 August 1422, at Vincennes": "31 août 1422, à Vincennes"
"Touques": "Touques"
"1 August 1417": "1er août 1417"
"Henry’s army landed at the mouth of the Touques, took the castles nearby and marched on Caen.": "L’armée de Henry débarqua à l’embouchure des Touques, prit les châteaux à proximité et marcha sur Caen."
"4 September 1417": "4 septembre 1417"
"The town was taken by storm and sacked. The castle surrendered a few weeks later.": "La ville a été prise par tempête et saccagée. Le château s’est rendu quelques semaines plus tard."
"Normandy’s capital, one of the largest cities in France, was starved into surrender after Burgundy failed to relieve it.": "La capitale de la Normandie, l’une des plus grandes villes de France, a été affamée de capitulation après que la Bourgogne n’a pas réussi à la soulager."
"29 May 1418": "29 mai 1418"
"Burgundian troops were let into the city, and mobs massacred Armagnac prisoners. The dauphin escaped to the south.": "Des troupes bourguignonnes furent laissées dans la ville, et des foules massacrérent des prisonniers d’Armagnac. Le dauphin s’échappa au sud."
"Montereau": "Montéreau"
"10 September 1419": "10 septembre 1419"
"John the Fearless was struck down during a meeting with the dauphin on the bridge over the Yonne.": "John the Fearless a été frappé lors d’une rencontre avec le dauphin sur le pont au-dessus de l’Yonne."
"Troyes": "Troyes"
"21 May 1420": "21 mai 1420"
"Charles VI, Queen Isabeau and Philip the Good agreed that Henry and his heirs would inherit the French crown.": "Charles VI, la reine Isabeau et Philippe le Bien ont convenu qu’Henry et ses héritiers hériteraient de la couronne française."
"Baugé": "Baugé"
"22 March 1421": "22 mars 1421"
"Clarence attacked a Franco-Scottish army under the Earl of Buchan without waiting for his archers and was killed.": "Clarence attaqua une armée franco-scottaise sous le comte de Buchan sans attendre ses archers et fut tué."
"October 1421 – May 1422": "octobre 1421 – mai 1422"
"Henry’s last siege. The town held out through the winter, and the king fell ill in the camp.": "Le dernier siège d’Henry. La ville a tenu l’hiver, et le roi est tombé malade dans le camp."
"Henry V, 1417": "Henry V, 1417"
"Henry V, 1418": "\"Henry V, 1418\""
"Clarence": "Clarence"
"Verneuil, Orléans and Reims": "Verneuil, Orléans et Reims"
"1423–1429": "1423–1429"
"Henry’s brother John, Duke of Bedford, governed Lancastrian France as regent for the infant Henry VI, in alliance with Burgundy. Charles VII, mocked as the “king of Bourges”, held the lands south of the Loire, and Scotland sent him thousands of soldiers. The allies won at Cravant in 1423, and on 17 August 1424 at Verneuil Bedford destroyed a Franco-Scottish army in one of the bloodiest battles of the war; some 6,000 French and Scots were killed, among them the earls of Douglas and Buchan. The English went on to conquer Maine.": "Le frère Henry John, duc de Bedford, dirigeait Lancastrian France comme régent pour l’enfant Henri VI, en alliance avec la Bourgogne. Charles VII, se moquait comme le roi de Bourges, tenait les terres au sud de la Loire, et l’Écosse lui envoya des milliers de soldats. Les alliés remportèrent à Cravant en 1423, et le 17 août 1424 à Verneuil Bedford détruisit une armée franco-scottaise dans l’une des batailles les plus sanglantes de la guerre ; quelque 6 000 Français et Écossais furent tués, dont les comtes de Douglas et de Buchan."
"In October 1428 the English laid siege to Orléans, which guarded the crossings of the Loire. The Earl of Salisbury was killed by a cannon shot early in the siege, and in February 1429 John Fastolf beat off an attack on a supply convoy at Rouvray, the Battle of the Herrings. In March a peasant girl from Domrémy, Joan of Arc, who said that the voices of saints had sent her to drive out the English and have the dauphin crowned, won over Charles at Chinon. She entered Orléans with a relief convoy on 29 April, the French took the English forts one by one, and on 8 May the English abandoned the siege.": "En octobre 1428, les Anglais assiégèrent Orléans, qui gardait les traversées de la Loire. Le comte de Salisbury fut tué par un canon tiré au début du siège et, en février 1429, John Fastolf battit une attaque contre un convoi d’approvisionnement à Rouvray, la bataille des Herrings. En mars, une paysanne de Domrémy, Jeanne d’Arc, qui disait que les voix des saints l’avaient envoyée chasser les Anglais et faire couronner le dauphin, a gagné sur Charles à Chinon. Elle est entrée à Orléans avec un convoi de secours le 29 avril, les Français ont pris les forts anglais un par un, et le 8 mai les Anglais ont abandonné le siège."
"In June the French took Jargeau, Meung and Beaugency, and on 18 June they caught the English army in the open at Patay before its archers could set their stakes; John Talbot was among those captured. Charles then marched through enemy-held Champagne, where Troyes and Châlons opened their gates, and on 17 July 1429 he was crowned in Reims Cathedral, with Joan beside him. An attack on Paris that September failed.": "En juin, les Français prirent Jargeau, Meung et Beaugency et, le 18 juin, ils s’emparèrent de l’armée anglaise à Patay avant que ses archers ne puissent poser leurs bûches ; John Talbot faisait partie de ceux qui étaient capturés. Charles marcha alors dans la Champagne tenue par l’ennemi, où Troyes et Châlons ouvrirent leurs portes, et le 17 juillet 1429 il fut couronné dans la cathédrale de Reims, avec Joan à ses côtés. Une attaque contre Paris en septembre a échoué."
"Battle of Verneuil": "Bataille de Verneuil"
"17 August 1424, English victory": "17 août 1424, victoire anglaise"
"Siege of Orléans": "Siège d’Orléans"
"12 October 1428 – 8 May 1429": "12 octobre 1428 – 8 mai 1429"
"Coronation of Charles VII": "Couronnement de Charles VII"
"17 July 1429, Reims": "17 juillet 1429, Reims"
"Cravant": "Cravates"
"31 July 1423": "31 juillet 1423"
"An English and Burgundian army under the Earl of Salisbury beat a Franco-Scottish army trying to take the town on the Yonne.": "Une armée anglaise et bourguignonne, sous le comte de Salisbury, a battu une armée franco-scottaise en essayant de prendre la ville sur l’Yonne."
"17 August 1424": "17 août 1424"
"Called a second Agincourt by the English. The Scots, who had said they would give no quarter, were given none.": "Appelé un second Agincourt par les Anglais. Les Écossais, qui avaient dit qu’ils ne donneraient pas de quart, n’ont reçu aucun."
"Orléans": "Orléans"
"The English ringed the city with forts but never closed it off. The storming of the Tourelles, the fort at the bridge, on 7 May decided the siege.": "Les Anglais sonnaient la ville avec des forts mais ne la fermaient jamais. L’assaut des Tourelles, le fort au pont, décida le siège le 7 mai."
"Battle of the Herrings": "Bataille des harengs"
"12 February 1429": "12 février 1429"
"Fastolf’s wagons, carrying salt fish for Lent, were drawn up as a fort, and the French and Scots attack on them failed.": "Les wagons de Fastolf, qui transportaient du poisson salé pour le Carême, furent dressés comme un fort, et les Français et les Écossais les attaquèrent."
"Battle of Patay": "Bataille de Patay"
"18 June 1429": "18 juin 1429"
"The French vanguard under La Hire and Poton de Xaintrailles charged before the English were ready, and the archers bore most of the losses. Joan was with the main army, behind.": "L’avant-garde française sous La Hire et Poton de Xaintrailles chargés avant les Anglais étaient prêts, et les archers supportaient la plupart des pertes. Joan était avec l’armée principale, derrière."
"Chinon": "Chinon"
"March 1429": "mars 1429"
"Joan met Charles in the castle and convinced him and his theologians, who questioned her at Poitiers, to let her go to Orléans.": "Joan rencontra Charles dans le château et le convainquit, lui et ses théologiens, qui la questionnèrent à Poitiers, de la laisser aller à Orléans."
"17 July 1429": "17 juillet 1429"
"Charles was anointed and crowned in the cathedral, the traditional place for French coronations, deep in territory held by his enemies.": "Charles fut oint et couronné dans la cathédrale, lieu traditionnel des couronnements français, au fond du territoire tenu par ses ennemis."
"8 September 1429": "8 septembre 1429"
"An attack on the walls by Charles’s army failed, and Joan was wounded by a crossbow bolt.": "Une attaque contre les murs par l’armée de Charles a échoué, et Joan a été blessée par un boulon d’arborescence."
"Joan of Arc": "Jeanne d’Arc"
"Charles VII": "Charles VII"
"Salisbury": "Salisbury"
"Held for Henry VI, early 1429": "Tenue pour Henry VI, début 1429"
"Joan’s death, Arras and Paris": "La mort de Joan, Arras et Paris"
"1430–1436": "1430–1436"
"On 23 May 1430 Joan was captured by Burgundian troops during a sortie from Compiègne, and John of Luxembourg, in whose hands she was held, sold her to the English. A church court at Rouen, led by Pierre Cauchon, Bishop of Beauvais, tried her for heresy, and she was burned in the city’s market place on 30 May 1431, aged about 19. Henry VI, aged ten, was crowned king of France in Notre-Dame in Paris that December, but the Lancastrian cause was weakening, and Philip the Good was tiring of the alliance.": "Le 23 mai 1430, Joan fut capturée par les troupes bourguignonnes lors d’une sortie de Compiègne et Jean du Luxembourg, entre les mains duquel elle était détenue, la vendit aux Anglais. Une cour d’église de Rouen, dirigée par Pierre Cauchon, évêque de Beauvais, la jugea pour hérésie, et elle fut brûlée sur le marché municipal le 30 mai 1431, âgée d’environ 19 ans. Henri VI, âgé de dix ans, est couronné roi de France à Notre-Dame à Paris en décembre, mais la cause Lancastrian s’affaiblit, et Philippe le Bien se fatigue de l’alliance."
"At a peace congress at Arras in 1435 the English would not give up the claim to the French throne and left. On 21 September, a week after Bedford died at Rouen, Philip made a separate peace with Charles VII, who disowned the murder at Montereau and ceded the towns on the Somme and the counties of Mâcon and Auxerre; Philip was released from homage for life. Risings broke out in Normandy, and the French took Dieppe and Harfleur. On 13 April 1436 the Constable, Arthur de Richemont, entered Paris with Burgundian help after the townspeople rose against the English garrison, which withdrew into the Bastille and was allowed to leave. Philip’s attempt to take Calais that summer failed.": "Lors d’un congrès de paix à Arras en 1435, les Anglais n’abandonnèrent pas la revendication du trône français et partirent. Le 21 septembre, une semaine après la mort de Bedford à Rouen, Philippe fit une paix séparée avec Charles VII, qui désavoue le meurtre à Montereau et céda les villes sur la Somme et les comtés de Mâcon et Auxerre ; Philip fut libéré d’hommage pour la vie. Le 13 avril 1436, le gendarme Arthur de Richemont entra à Paris avec l’aide bourguignonne après que les habitants se soient levés contre la garnison anglaise, qui s’est retirée dans la Bastille et a été autorisée à partir."
"Execution of Joan of Arc": "Exécution de Jeanne d’Arc"
"30 May 1431, Rouen": "30 mai 1431, Rouen"
"Treaty of Arras": "Traité d’Arras"
"21 September 1435, Burgundy makes peace with Charles VII": "21 septembre 1435, la Bourgogne fait la paix avec Charles VII"
"Paris retaken": "Reprise de Paris"
"13 April 1436": "13 avril 1436"
"Compiègne": "Compiègne"
"23 May 1430": "23 mai 1430"
"Joan was pulled from her horse outside the walls as she covered the retreat of a sortie against the besieging Burgundians.": "Joan a été tirée de son cheval à l’extérieur des murs alors qu’elle couvrait la retraite d’une sortie contre les Bourguignons assiégés."
"30 May 1431": "30 mai 1431"
"Seat of the English government of Normandy, where Joan was tried and burned. A retrial ordered by the pope declared her innocent in 1456, and she was made a saint in 1920.": "Siège du gouvernement anglais de Normandie, où Jeanne a été jugée et brûlée. Un nouveau procès ordonné par le pape l’a déclarée innocente en 1456, et elle est devenue sainte en 1920."
"Arras": "Arras"
"21 September 1435": "21 septembre 1435"
"The first great European peace congress, with envoys of the pope and the Council of Basel. It ended the Anglo-Burgundian alliance.": "Le premier grand congrès européen de la paix, avec les envoyés du pape et le Conseil de Bâle. Il a mis fin à l’alliance anglo-bourgogne."
"Dieppe": "Dieppe"
"October 1435": "octobre 1435"
"Taken in a surprise attack, as peasants in the Pays de Caux rose against the English.": "Pris dans une attaque surprise, alors que les paysans du Pays de Caux s’élèvent contre les Anglais."
"Parisians opened the Saint-Jacques gate to Richemont’s troops. Charles VII entered his capital in November 1437.": "Les Parisiens ouvrent la porte Saint-Jacques aux troupes de Richemont. Charles VII entre dans sa capitale en novembre 1437."
"July 1436": "juillet 1436"
"Philip the Good besieged the town with Flemish militia, who went home when an English relief army approached.": "Philippe le Bon a assiégé la ville avec des milices flamandes, qui sont rentrées chez elles quand une armée de secours anglaise s’est approchée."
"Richemont": "Richemont"
"Philip the Good": "Philippe le Bon"
"The Truce of Tours and Formigny": "La trêve de Tours et Formigny"
"1441–1450": "1441–1450"
"Charles VII took Pontoise in 1441. In 1444 a truce was agreed at Tours, and Henry VI married the French queen’s niece, Margaret of Anjou; Henry secretly promised to give up Maine, and Le Mans was handed over, under threat of a siege, in March 1448. Charles used the truce to reform his army, with standing companies of cavalry paid from permanent taxes, archers raised by the parishes and a powerful artillery train under the brothers Jean and Gaspard Bureau.": "Charles VII prit Pontoise en 1441. En 1444, une trêve fut conclue à Tours, et Henri VI épousa la reine française Margaret d’Anjou ; Henry promit secrètement de renoncer au Maine, et Le Mans fut remis, sous la menace d’un siège, en mars 1448. Charles a utilisé la trêve pour réformer son armée, avec des compagnies de cavalerie permanentes payées par les impôts permanents, des archers élevés par les paroisses et un puissant train d’artillerie sous les frères Jean et Gaspard Bureau."
"In March 1449 a captain in English pay, the Aragonese François de Surienne, sacked the Breton town of Fougères, and that summer Charles reopened the war. Town after town in Normandy surrendered, some to the guns, some to their own citizens. Rouen fell in October, and the Duke of Somerset bought his own freedom by giving up other towns and hostages, among them John Talbot. A relief army under Thomas Kyriell landed at Cherbourg in March 1450, and on 15 April it was caught at Formigny between the Count of Clermont’s army and Richemont’s Breton cavalry; most of the English were killed or captured. Caen surrendered on 1 July and Cherbourg, the last English stronghold in Normandy, on 12 August.": "En mars 1449, un capitaine à la solde anglaise, l’Aragonais François de Surienne, saccagea la ville bretonne de Fougères, et cet été-là Charles rouvrit la guerre. Ville après ville en Normandie se rendit, certains aux armes, d’autres à leurs propres citoyens. Rouen tomba en octobre, et le duc de Somerset acquit sa propre liberté en abandonnant d’autres villes et otages, dont John Talbot. Une armée de secours sous Thomas Kyriell débarqua à Cherbourg en mars 1450, et le 15 avril elle fut prise à Formigny entre l’armée du comte de Clermont et la cavalerie bretonne de Richemont ; la plupart des Anglais furent tués ou capturés. Caen se rendit le 1er juillet et Cherbourg, dernier bastion anglais en Normandie, le 12 août."
"Truce of Tours": "Trêve de Tours"
"28 May 1444": "28 mai 1444"
"Battle of Formigny": "Bataille de Formigny"
"15 April 1450, French victory": "15 avril 1450, victoire française"
"Fall of Cherbourg": "Chute de Cherbourg"
"12 August 1450, end of English Normandy": "12 août 1450, fin de la Normandie anglaise"
"Pontoise": "Pontoise"
"19 September 1441": "19 septembre 1441"
"The French stormed the last English stronghold near Paris after a three-month siege.": "Les Français s’emparent du dernier bastion anglais près de Paris après un siège de trois mois."
"The truce, sealed with Henry VI’s betrothal to Margaret of Anjou, was renewed until 1449.": "La trêve, scellée par Henry VI. Les fiançailles à Margaret d’Anjou, fut renouvelée jusqu’en 1449."
"Le Mans": "Le Mans"
"March 1448": "mars 1448"
"The English garrison handed over the capital of Maine, as Henry VI had promised, when a French army appeared outside it.": "La garnison anglaise a remis la capitale du Maine, comme l’avait promis Henry VI, lorsqu’une armée française est apparue en dehors de celle-ci."
"Fougères": "Fougères"
"24 March 1449": "24 mars 1449"
"Surienne’s surprise attack on the rich Breton town broke the truce and gave Charles the reason he wanted to renew the war.": "L’attaque surprise de Surienne contre la riche ville bretonne a brisé la trêve et donné à Charles la raison pour laquelle il voulait renouveler la guerre."
"October 1449": "octobre 1449"
"The citizens rose and let in the French; Somerset, holed up in the castle, capitulated in early November.": "Les citoyens se levèrent et laissèrent entrer les Français ; Somerset, troué dans le château, capitulé au début de novembre."
"15 April 1450": "15 avril 1450"
"Two French culverins fired on the English from beyond bowshot and drew the archers out of their position; then Richemont’s cavalry came up on their flank.": "Deux sculpteurs français tirèrent sur les Anglais d’au-delà et tirèrent les archers hors de leur position ; puis la cavalerie de Richemont s’éleva sur leur flanc."
"1 July 1450": "1er juillet 1450"
"Somerset surrendered the town after the Bureau brothers’ guns had battered its walls.": "Somerset rendit la ville après que les frères du Bureau eurent battu ses murs."
"12 August 1450": "12 août 1450"
"The last English-held town in Normandy surrendered after a siege in which the French set up guns on the beach below the walls.": "La dernière ville anglaise de Normandie s’est rendue après un siège dans lequel les Français ont installé des canons sur la plage sous les murs."
"Kyriell": "Kyriell"
"Clermont": "Clermont"
"Castillon and the fall of Bordeaux": "Castillon et la chute de Bordeaux"
"1451–1453": "1451–1453"
"In the spring of 1451 French armies under Jean de Dunois entered Guyenne. Blaye, Bourg and Fronsac fell, Bordeaux agreed terms and opened its gates on 30 June, and Bayonne surrendered in August. But the Gascons had been ruled by English kings for three hundred years, their wine trade with England was their living, and many resented the new king’s taxes. Bordeaux invited the English back, and on 23 October 1452 John Talbot, Earl of Shrewsbury, then in his sixties, was let into the city with 3,000 men. Much of western Gascony went over to him.": "Au printemps de 1451, les armées françaises sous Jean de Dunois entrèrent en Guyenne. Blaye, Bourg et Fronsac tombaient, Bordeaux accepta les conditions et ouvrit ses portes le 30 juin, et Bayonne se rendit en août. Mais les Gascons étaient gouvernés par des rois anglais pendant trois cents ans, leur commerce avec l’Angleterre était leur vie, et beaucoup ressentirent les nouvelles taxes du roi. Bordeaux invite les Anglais, et le 23 octobre 1452 John Talbot, comte de Shrewsbury, puis dans ses années soixante, est laissé dans la ville avec 3000 hommes."
"In 1453 three French armies converged on Guyenne. One besieged Castillon on the Dordogne, where Jean Bureau built a fortified camp packed with guns. On 17 July Talbot, told that the French were retreating, attacked the camp before all his troops had come up. His men were cut down by the guns and then routed by Breton cavalry, and Talbot and his son were killed. Bordeaux held out until 19 October 1453.": "En 1453, trois armées françaises convergent sur Guyenne. Une assiégée Castillon sur la Dordogne, où Jean Bureau construit un camp fortifié rempli de canons. Le 17 juillet Talbot, dit que les Français se retirent, attaque le camp avant que toutes ses troupes ne montent. Ses hommes sont abattus par les canons puis conduits par la cavalerie bretonne, et Talbot et son fils sont tués. Bordeaux tient jusqu’au 19 octobre 1453."
"No peace treaty ended the war, and no one at the time knew it was over. Calais stayed English until 1558, and English and later British monarchs called themselves kings of France until 1801. The war had devastated much of France. Many historians think it strengthened royal power and a sense of nationhood in both kingdoms, and in England defeat helped to bring on the Wars of the Roses, which began within two years.": "Aucun traité de paix n’a mis fin à la guerre, et personne à l’époque ne savait que c’était fini. Calais est resté en anglais jusqu’en 1558, et les monarques anglais et britanniques plus tard se nomment rois de France jusqu’en 1801. La guerre avait dévasté une grande partie de la France."
"Bordeaux surrenders": "Bordeaux se rend"
"30 June 1451, and again 19 October 1453": "30 juin 1451 et 19 octobre 1453"
"Battle of Castillon": "Bataille de Castillon"
