"May 1451": "mai 1451"
"The fortress on the Gironde estuary fell after a short siege, opening the way to Bordeaux.": "La forteresse de l’estuaire de la Gironde est tombée après un court siège, ouvrant le chemin à Bordeaux."
"Soulac": "Soulac"
"17 October 1452": "17 octobre 1452"
"Talbot’s fleet landed in the Médoc, north of Bordeaux, where the citizens opened the gates to him six days later.": "La flotte de Talbot a atterri dans le Médoc, au nord de Bordeaux, où les citoyens lui ont ouvert les portes six jours plus tard."
"30 June 1451 and 19 October 1453": "30 juin 1451 et 19 octobre 1453"
"The capital of English Gascony surrendered twice. After the second time Charles VII built new forts to hold it down and took away many of its privileges.": "La capitale de la Gascogne anglaise s’est rendue deux fois. Après la deuxième fois, Charles VII a construit de nouveaux forts pour le tenir à terre et a enlevé beaucoup de ses privilèges."
"Bayonne": "Bayonne"
"August 1451": "août 1451"
"The last English town in the south-west surrendered to Dunois and the Count of Foix.": "La dernière ville anglaise du sud-ouest s’est rendue à Dunois et au comte de Foix."
"17 July 1453": "17 juillet 1453"
"The last battle of the war and one of the first decided by gunpowder artillery. A monument marks the spot where Talbot is said to have fallen.": "La dernière bataille de la guerre et l’une des premières décidées par l’artillerie de poudre. Un monument marque l’endroit où Talbot serait tombé."
