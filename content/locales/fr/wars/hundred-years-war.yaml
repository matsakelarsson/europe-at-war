"1358–1360": "1358–1360"
"In Paris Étienne Marcel, provost of the merchants, led the Estates’ demands for reform, and on 22 February 1358 his followers murdered two of the dauphin’s marshals in front of him. The dauphin left the city. In late May the peasants of the Beauvaisis rose against the nobles, whom they blamed for the defeat and for the plundering of the countryside. Bands of rebels, the Jacques, burned manor houses and killed noble families. On 9–10 June the nobles struck back. Charles of Navarre routed the main rebel army near Mello, and knights relieved the fortified market of Meaux; thousands of peasants were killed in the reprisals. Marcel was killed in Paris on 31 July.": "A Paris Étienne Marcel, prévôt des marchands, dirigea les demandes de réforme des États et, le 22 février 1358, ses disciples assassinèrent deux des maréchaux du dauphin devant lui. Le dauphin quitta la ville. Fin mai, les paysans des Beauvaisis se soulevèrent contre les nobles, qu’ils blâmèrent pour la défaite et pour le pillage de la campagne. Des bandes de rebelles, les Jacques, brûlèrent des maisons de manoir et tuèrent des familles nobles. Les 9-10 juin, les nobles s’en retournèrent. Charles de Navarre dirigea la principale armée rebelle près de Mello, et des chevaliers soulagèrent le marché fortifié de Meaux ; des milliers de paysans furent tués dans les représailles. Marcel fut tué à Paris le 31 juillet."
"In London King John agreed to treaties ceding half his kingdom, but the Estates-General rejected the second of them in May 1359. Edward landed at Calais in October with one of the largest armies of the war and besieged Reims, where he probably meant to be crowned, from December to January. The city held. He moved into Burgundy, whose duke paid him to leave, and then towards Paris, but the dauphin would not fight. On 13 April 1360, near Chartres, a violent hailstorm killed many men and horses in the English army, a day remembered as Black Monday.": "À Londres, le roi Jean accepta les traités qui cèdent la moitié de son royaume, mais les Estates-General rejetèrent le second d’entre eux en mai 1359. Edward débarqua à Calais en octobre avec l’une des plus grandes armées de la guerre et assiégea Reims, où il entendit probablement être couronné, de décembre à janvier. Le 13 avril 1360, près de Chartres, une violente grêle a tué de nombreux hommes et chevaux dans l’armée anglaise, un jour dont on se souvient comme le lundi noir."
"At Brétigny near Chartres a treaty was drawn up on 8 May 1360 and ratified at Calais on 24 October. Edward was to give up his claim to the French throne, and John to give up sovereignty over an enlarged Aquitaine, which Edward would hold outright, with Calais, Guînes and Ponthieu. John’s ransom was set at three million gold écus. The two renunciations were put in a separate agreement that was never carried out, which left both kings grounds to reopen the war. John went home, but when a son left as a hostage broke his parole, he returned to captivity in London and died there in 1364.": "À Brétigny, près de Chartres, un traité a été rédigé le 8 mai 1360 et ratifié à Calais le 24 octobre. Edward devait renoncer à sa revendication au trône français, et Jean à renoncer à la souveraineté sur une Aquitaine élargie, qu’Edward tiendrait sans réserve, avec Calais, Guînes et Ponthieu. La rançon de John fut fixée à trois millions d’écus d’or. Les deux renonciations ont été mises dans un accord séparé qui n’a jamais été effectué, ce qui a laissé les deux rois sur le terrain pour rouvrir la guerre. John est rentré à la maison, mais quand un fils parti en otage a brisé sa libération conditionnelle, il est retourné en captivité à Londres et y est mort en 1364."
