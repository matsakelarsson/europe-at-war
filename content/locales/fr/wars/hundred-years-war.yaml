"1337–1340": "1337–1340"
"When Charles IV of France died in 1328 without a son, the French nobles chose his cousin Philip of Valois as king, passing over Edward III of England, whose claim came through his mother Isabella, Charles’s sister. Edward, who was also Duke of Aquitaine, did homage to Philip VI for Gascony. But quarrels over the duchy, French help for the Scots and Edward’s shelter of Philip’s enemy Robert of Artois led Philip to confiscate Gascony on 24 May 1337. Edward bought allies in the Low Countries and the Empire, and French and Genoese galleys raided the English coast, burning much of Southampton in October 1338.": "Lorsque Charles IV de France mourut en 1328 sans fils, les nobles français choisirent comme roi son cousin Philippe de Valois, qui passa au-dessus d’Edward III d’Angleterre, dont la revendication fut faite par sa mère Isabella, sœur de Charles. Edward, lui aussi duc d’Aquitaine, rend hommage à Philippe VI pour Gascony. Mais les querelles sur le duché, l’aide française pour l’abri écossais et Edward de Philippes l’ennemi Robert d’Artois amenèrent Philip à confisquer Gascony le 24 mai 1337. Edward acheta des alliés dans les Pays Bas et l’Empire, et des galères françaises et génoises pillèrent la côte anglaise, brûlant une grande partie de Southampton en octobre 1338."
"Flanders depended on English wool, but its count was loyal to France. In 1338 the cloth towns, led by Jacob van Artevelde of Ghent, took control of the county and came to terms with Edward. At Ghent on 26 January 1340 Edward took the title King of France, so that the Flemish could support him without breaking their oath to the French crown. On 24 June he attacked the French fleet gathered in the Zwin estuary at Sluys. Its ships, chained together in three lines, were taken one by one; most were captured, both French commanders died, and some 16,000–20,000 men were killed or drowned.": "La Flandre dépend de la laine anglaise, mais son comte est fidèle à la France. En 1338, les villes en tissu, dirigées par Jacob van Artevelde de Gand, prennent le contrôle du comté et s’accommodent avec Edward. Le 26 janvier 1340, à Gand, Édouard prend le titre de roi de France, afin que les flamands puissent le soutenir sans rompre leur serment devant la couronne française. Le 24 juin, il attaque la flotte française rassemblée dans l’estuaire du Zwin à Sluys. Ses navires, enchaînés en trois lignes, sont pris un par un ; la plupart sont capturés, les deux commandants français meurent et environ 16 000 à 20 000 hommes sont tués ou noyés."
"That summer Edward and his allies besieged Tournai, while a Flemish army under Robert of Artois was routed outside Saint-Omer. Tournai held out, Edward ran out of money, and on 25 September 1340 the two kings agreed the Truce of Esplechin. Sluys gave England command of the Channel, but the war had settled nothing.": "Cet été-là, Edward et ses alliés assiégèrent Tournai, alors qu’une armée flamande sous Robert d’Artois était acheminée à l’extérieur de Saint-Omer. Tournai tenu, Edward manqua d’argent, et le 25 septembre 1340, les deux rois s’entendirent sur la trêve d’Esplechin."
