"1355–1357": "1355–1357"
"After the plague the war went on in raids, sieges and fights between garrisons, and in 1350 John II succeeded Philip VI. In October 1355 Edward, Prince of Wales, the Black Prince, led an Anglo-Gascon army from Bordeaux on a great raid, a chevauchée, across Languedoc to Narbonne on the Mediterranean. It burned the lower town of Carcassonne and hundreds of villages and returned to Bordeaux in December laden with loot. Such raids were meant to ruin the French king’s lands and revenues, show his subjects he could not protect them and draw him into battle.": "Après la peste, la guerre se poursuit dans des raids, des sièges et des combats entre garnisons, et en 1350 Jean II succède à Philippe VI. En octobre 1355, Edward, prince de Galles, le Prince noir, dirige une armée anglo- gasconaise de Bordeaux lors d’un grand raid, un chevauchée, à travers le Languedoc à Narbonne sur la Méditerranée. Il a brûlé la ville inférieure de Carcassonne et des centaines de villages et est retourné à Bordeaux en décembre chargé de pillage. De tels raids étaient censés ruiner les terres et les revenus du roi français, montrer ses sujets qu’il ne pouvait pas les protéger et l’attirer dans la bataille."
"In August 1356 the prince marched north from Bergerac towards the Loire, while Henry of Grosmont, now Duke of Lancaster, raided Normandy. Finding the Loire crossings held near Tours, the prince turned back south, and King John caught up with him near Poitiers. On 19 September about 6,000 Anglo-Gascons, fighting on foot behind hedges and marshy ground, met an attack by some 14,000–16,000 French. They threw back several assaults; then, as the king’s own division attacked, a small mounted force came round the French rear and the army broke. John and his youngest son Philip were taken, with some 2,000 knights and men-at-arms.": "En août 1356, le prince marcha au nord de Bergerac vers la Loire, tandis qu’Henri de Grosmont, aujourd'hui duc de Lancaster, sillonnait la Normandie. Trouver les traversées de la Loire tenues près de Tours, le prince retourna vers le sud, et le roi John le rattrapé près de Poitiers. Le 19 septembre, environ 6 000 Anglo-Gascons, se battant à pied derrière des haies et des terrains marécageux, rencontrèrent une attaque de quelque 14 000 à 16 000 Français. Ils ont repoussé plusieurs assauts ; puis, alors que la division du roi attaquait, une petite force montée tourna l’arrière de la France et l’armée se brisa. John et son plus jeune fils Philippe furent emmenés, avec quelque 2 000 chevaliers et hommes d’armes."
"The prince took his royal prisoner to Bordeaux, where a two-year truce was agreed in March 1357, and then to London. In France the defeat discredited the nobility and the crown. The king’s son Charles, the dauphin, ruled as lieutenant, facing the Estates-General in Paris, a rival in his cousin Charles II of Navarre, and bands of unemployed soldiers who lived off the countryside.": "Le prince emmena son prisonnier royal à Bordeaux, où une trêve de deux ans fut conclue en mars 1357, puis à Londres. En France la défaite discréditait la noblesse et la couronne. Le fils du roi Charles, le dauphin, régnait comme lieutenant, face aux Estates-General à Paris, rival de son cousin Charles II de Navarre, et des groupes de soldats sans emploi qui vivaient hors de la campagne."
