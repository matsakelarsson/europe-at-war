# Some French text was translated automatically.
"Hundred Years’ War": "Guerre de Cent Ans"
"A long series of wars and truces between the kings of England and France, fought over the English king’s lands in France and his claim, from 1340, to the French crown. England won the great battles of Sluys, Crécy, Poitiers and Agincourt and at times ruled much of France, but France recovered its lost lands in the 1370s and again after Joan of Arc and the relief of Orléans in 1429, and by 1453 England held only Calais.": "Une longue série de guerres et de trêves entre les rois d’Angleterre et de France, ont combattu sur les terres du roi anglais en France et sa revendication, de 1340, à la couronne française. L’Angleterre a remporté les grandes batailles de Sluys, Crécy, Poitiers et Agincourt et a parfois gouverné une grande partie de la France, mais la France a récupéré ses terres perdues dans les années 1370 et encore après Jeanne d’Arc et le soulagement d’Orléans en 1429, et en 1453 l’Angleterre n’a tenu que Calais."
"The name Hundred Years’ War was coined in the 19th century. Historians often divide the fighting into an Edwardian phase (1337–1360), a Caroline phase (1369–1389) and a Lancastrian phase (1415–1453), separated by long truces. No peace treaty ended it.": "Les historiens divisent souvent les combats en une phase édouardienne (1337–1360), une phase Caroline (1369–1389) et une phase Lancastrienne (1415–1453), séparées par de longues trêves. Aucun traité de paix ne l’a terminée."
"Dates are Julian, as was usual at the time. The English year then began on 25 March, but years here begin on 1 January.": "Les dates sont Julian, comme d’habitude à l’époque. L’année anglaise a alors commencé le 25 mars, mais les années ici commencent le 1er janvier."
"Chronicles give armies and losses that are often far too large. Numbers here follow modern estimates where they exist, and historians still disagree about many of them, Agincourt’s in particular.": "Les Chroniques donnent des armées et des pertes qui sont souvent beaucoup trop grandes. Les chiffres ici suivent les estimations modernes où ils existent, et les historiens encore en désaccord sur beaucoup d’entre eux, Agincourt, en particulier."
"Sluys is today’s Sluis in the Netherlands and Agincourt is Azincourt. Guyenne was the French name for the English king’s duchy of Aquitaine, which by 1337 meant little more than Gascony around Bordeaux and Bayonne.": "Sluys est aujourd'hui Sluis aux Pays-Bas et Agincourt est Azincourt. Guyenne était le nom français du roi anglais duché d’Aquitaine, qui en 1337 signifiait peu plus que Gascogne autour de Bordeaux et Bayonne."
"The Breton War of Succession (1341–1365), the Jacquerie (1358) and the Armagnac–Burgundian Civil War (1407–1435) have their own entries.": "La guerre de succession bretonne (1341–1365), la Jacquerie (1358) et la guerre civile Armagnac–Burgundi (1407–1435) ont leurs propres entrées."
