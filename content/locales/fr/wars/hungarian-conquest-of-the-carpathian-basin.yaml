"c. 895–896": "c. 895–896"
"In the late 9th century the Magyars, a federation of seven tribes of horsemen joined by the Kabars, lived in Etelköz, the steppe between the Dnieper and the lower Danube. They already raided far to the west: in 892 they fought for the East Frankish king Arnulf against Great Moravia, and in 894 they plundered Pannonia as allies of the Moravians. That year the Byzantine emperor Leo VI hired them against Simeon of Bulgaria. In 895 Byzantine ships carried them across the Danube; they routed Simeon, who took refuge in Dristra, plundered Bulgaria and sold their captives to the Byzantines.": "À la fin du IXe siècle, les Magyars, une fédération de sept tribus de cavaliers rejointes par les Kabars, vivaient à Etelköz, la steppe entre le Dniepr et le Danube inférieur. Ils ont déjà fait des raids à l’ouest : en 892 ils combattaient pour le roi franc-oriental Arnulf contre la Grande Moravie, et en 894 ils pillaient Pannonia comme alliés des Moraves. Cette année-là, l’empereur byzantin Léon VI les engagea contre Siméon de Bulgarie. En 895, des navires byzantins les transportèrent à travers le Danube ; ils parcourirent Siméon, qui se réfugia à Dristra, pillèrent la Bulgarie et vendirent leurs captifs aux Byzantins."
"Simeon took his revenge. While the Magyar warriors were away, the Pechenegs, his allies, fell on their camps in Etelköz and killed or drove off their families, and the Bulgarians defeated the Magyars on the Southern Buh. The survivors crossed the Carpathians in search of new pastures, perhaps through the north-eastern passes such as Verecke, as the Gesta says, or into Transylvania, as the Illuminated Chronicle has it, where the chronicle says their leader Álmos was killed. They settled first along the upper Tisza, in a thinly peopled land on the edges of Bulgaria, Moravia and the Frankish march.": "Siméon prit sa revanche. Alors que les guerriers magyar étaient partis, les Pechenegs, ses alliés, tombèrent dans leurs camps à Etelköz et tuèrent ou chassaient leurs familles, et les Bulgares battèrent les Magyars sur le Buh du Sud. Les survivants ont traversé les Carpates à la recherche de nouveaux pâturages, peut-être à travers les passages nord-est tels que Verecke, comme dit la Gesta, ou en Transylvanie, comme l’a fait la Chronique illuminée, où la chronique dit que leur chef Álmos a été tué. Ils se sont installés d’abord le long de la haute Tisza, dans une terre peu peuplée sur les bords de Bulgarie, Moravia et la marche francaise."
