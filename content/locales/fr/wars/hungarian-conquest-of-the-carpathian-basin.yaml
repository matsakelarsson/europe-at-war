"Arnulf, crowned emperor in 896, put the Slav prince Braslav in charge of Pannonia, west of the Danube, while Great Moravia was torn by a war between the sons of Svatopluk I. The Magyars served Arnulf again, and in 899 they invaded Italy, apparently at his urging, and routed King Berengar on the Brenta. Arnulf died in December 899. Coming back from Italy in 900, the Magyars took Pannonia, the old Frankish march around Braslav’s fortress at Mosaburg (Zalavár), and raided Bavaria. On 20 November Margrave Luitpold beat one of their bands on the Danube, and the Bavarians built a fortress on the Enns.": "Arnulf, couronné empereur en 896, a placé le prince slave Braslav en charge de Pannonie, à l’ouest du Danube, tandis que la Grande Moravie a été déchirée par une guerre entre les fils de Svatopluk Ier. Les Magyars ont servi Arnulf à nouveau, et en 899 ils ont envahi l’Italie, apparemment à son exhortation, et dirigé le roi Berengar sur la Brenta. Arnulf est mort en décembre 899. De retour d’Italie en 900, les Magyars prennent la Pannonie, l’ancienne marche franquiste autour de la forteresse de Braslav, à Mosabourg (Zalavár), et font une descente en Bavière. Le 20 novembre Margrave Luitpold bat une de leurs bandes sur le Danube, et les Bavarois construisent une forteresse sur les Enns."
"Moravia, already plundered, made peace with East Francia at Regensburg in 901, but it was too late. Under 902 a German chronicle records a war with the Hungarians in Moravia in which “the land succumbed”, and the last Moravian ruler, Mojmír II, is not heard of after about 906. Its strongholds were destroyed and many of its people fled to Bulgaria, Croatia and elsewhere. The Bavarians murdered Kurszán at a banquet in 902 or 904, and the Magyars, now masters of the Carpathian Basin, turned to raiding the West.": "La Moravie, déjà pillée, fit la paix avec la Francie de l’Est à Ratisbonne en 901, mais il était trop tard. Sous 902, une chronique allemande rapporte une guerre avec les Hongrois en Moravie dans laquelle -la terre succomba, et le dernier souverain morave, Mojmír II, n’est pas entendu parler après environ 906. Ses bastions furent détruits et beaucoup de son peuple s’enfuirent en Bulgarie, Croatie et ailleurs. Les Bavarois ont assassiné Kurszán lors d’un banquet en 902 ou 904 et les Magyars, aujourd'hui maîtres du bassin des Carpates, se sont tournés vers la descente à l’ouest."
