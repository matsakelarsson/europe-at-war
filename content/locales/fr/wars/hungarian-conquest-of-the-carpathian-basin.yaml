"Hungarian conquest of the Carpathian Basin": "Conquête hongroise du bassin des Carpates"
"The migration of the Magyars (Hungarians) from the steppes north of the Black Sea into the Carpathian Basin. Driven out of their homeland by the Bulgarians and the Pechenegs after a war in Bulgaria in 895, they crossed the Carpathians, took Pannonia from the East Franks in 900 and destroyed Great Moravia in the early 900s, founding the Hungarian state. In Hungarian it is called the honfoglalás, the “taking of the homeland”.": "La migration des Magyars (hongrois) des steppes au nord de la mer Noire vers le bassin des Carpates. Sorti de leur patrie par les Bulgares et les Pechenegs après une guerre en Bulgarie en 895, ils traversèrent les Carpates, prirent la Pannonie des Francs Orientaux en 900 et détruisirent la Grande Moravie au début des années 900, créant l’État hongrois. En hongrois, il est appelé le honfoglalás, la prise de la patrie."
"The near-contemporary sources are foreign, chiefly the Annals of Fulda, Regino of Prüm and the Byzantine emperor Constantine VII; the Hungarian chronicles, the Gesta Hungarorum of about 1200 and the 14th-century Illuminated Chronicle, are much later and partly legendary. Hungary traditionally dates the conquest to 895–896 and celebrated its millennium in 1896.": "Les sources quasi contemporaines sont étrangères, principalement les Annales de Fulda, Regino de Prüm et l’empereur byzantin Constantin VII ; les chroniques hongroises, la Gesta Hungarorum d’environ 1200 et la Chronique illuminée du XIVe siècle, sont beaucoup plus tard et en partie légendaires. La Hongrie date traditionnellement de la conquête à 895–896 et a célébré son millénaire en 1896."
"The Magyars were then led by two rulers, the kende and the gyula; Árpád and Kurszán held these offices around 895, but which was which is disputed. Their route over the mountains is also disputed. The Magyars’ western raids and the battle of Pressburg in 907 are told in the Hungarian invasions of Europe, and their part in the Byzantine–Bulgarian war of 894–896 in that war’s own entry.": "Les Magyars furent alors conduits par deux dirigeants, la kende et la gyula ; Árpád et Kurszán occupèrent ces bureaux vers 895, mais ce qui est contesté. Leur route au-dessus des montagnes est également contestée. Les raids occidentaux Magyars et la bataille de Pressburg en 907 sont racontés dans les invasions hongroises de l’Europe, et leur part dans la guerre byzantine-bulgare de 894-896 dans cette guerre."
