"November 1918 – May 1919": "novembre 1918 – mai 1919"
"Czechoslovakia declared independence on 28 October 1918 and claimed the Slovak-inhabited north of the Kingdom of Hungary. Small Czechoslovak units crossed into Upper Hungary in early November, and Hungarian troops drove some of them back, but the Allies backed the Czechoslovak claim and drew a demarcation line. In December Czechoslovak forces, among them legionaries returned from Italy, took Žilina, Nitra, Banská Bystrica and, at the end of the month, Košice. On 1 January 1919 they entered Bratislava, whose largely German and Hungarian population had hoped to make it a free city.": "La Tchécoslovaquie a déclaré son indépendance le 28 octobre 1918 et a revendiqué l’inhabité slovaque au nord du Royaume de Hongrie. Les petites unités tchécoslovaques ont traversé la Haute-Hongrie au début novembre, et les troupes hongroises ont ramené certaines d’entre elles, mais les Alliés ont soutenu la revendication tchécoslovaque et tracé une ligne de démarcation. En décembre, les forces tchécoslovaques, parmi lesquelles des légionnaires sont revenus d’Italie, ont pris Žilina, Nitra, Banská Bystrica et, à la fin du mois, Košice. Le 1er janvier 1919, elles sont entrées à Bratislava, dont la population en grande partie allemande et hongroise avait espéré en faire une ville libre."
"After the Hungarian Soviet Republic was proclaimed in March, its enemies moved together. In late April, as the Romanian army advanced to the Tisza, Czechoslovak troops occupied Subcarpathian Ruthenia with the Romanians and pushed south over the demarcation line into northern Hungary, entering Miskolc on 2 May. The two armies threatened to meet and cut off the young Soviet Republic from the north-east. Instead, Budapest’s government signed a truce with Romania and turned its new Red Army against Czechoslovakia.": "À la fin du mois d’avril, alors que l’armée roumaine se dirigeait vers la Tisza, les troupes tchécoslovaques occupaient la Ruthénie des sous-carpates avec les Roumains et poussèrent au sud la ligne de démarcation dans le nord de la Hongrie, entrant à Miskolc le 2 mai. Les deux armées menaçaient de rencontrer et de couper la jeune République soviétique du nord-est. Au lieu de cela, le gouvernement de Budapest a signé une trêve avec la Roumanie et tourné sa nouvelle armée rouge contre la Tchécoslovaquie."
