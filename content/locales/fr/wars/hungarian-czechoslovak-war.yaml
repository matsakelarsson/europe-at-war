"May – July 1919": "mai – juillet 1919"
"The Hungarian Red Army, with Colonel Aurél Stromfeld as its chief of staff, attacked in force on 20 May. It retook Miskolc and the industrial towns of the north, then advanced deep into Slovakia, taking Košice on 6 June and pushing on to Prešov and Bardejov, and drove a wedge between the Czechoslovak and Romanian armies. Many former officers of the old army fought for the Soviet Republic in the hope of restoring Hungary’s borders. On 16 June a Slovak Soviet Republic was proclaimed in Prešov, dependent on Budapest.": "L’Armée rouge hongroise, avec le colonel Aurel Stromfeld comme chef d’état-major, a attaqué en vigueur le 20 mai. Elle a repris Miskolc et les villes industrielles du nord, puis a avancé profondément vers la Slovaquie, prenant Košice le 6 juin et allant à Prešov et Bardejov, et conduit un coin entre les armées tchécoslovaques et roumaines. De nombreux anciens officiers de l’ancienne armée ont combattu pour la République soviétique dans l’espoir de rétablir les frontières de la Hongrie. Le 16 juin, une République soviétique slovaque a été proclamée à Prešov, dépendant de Budapest."
"The Allies stepped in. In notes of 7 and 13 June, Georges Clemenceau ordered the Hungarians to leave Slovakia and promised that the Romanians would then pull back from the Tisza. Kun accepted, Stromfeld resigned in protest, and by the first days of July the Hungarian Red Army had withdrawn behind the demarcation line. The Slovak Soviet Republic collapsed on 7 July, and the Romanians stayed where they were. The Treaty of Trianon in June 1920 confirmed a border that left about a million Hungarians in Czechoslovakia.": "Dans des notes des 7 et 13 juin, Georges Clemenceau ordonna aux Hongrois de quitter la Slovaquie et promit que les Roumains se retireraient alors de la Tisza. Kun accepta, Stromfeld démissionna en signe de protestation, et dès les premiers jours de juillet l’armée rouge hongroise s’était retirée derrière la ligne de démarcation. La République soviétique slovaque s’est effondrée le 7 juillet, et les Roumains sont restés là où ils étaient. Le traité de Trianon en juin 1920 a confirmé une frontière qui laissait environ un million de Hongrois en Tchécoslovaquie."
