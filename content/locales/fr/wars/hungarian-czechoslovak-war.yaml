# Some French text was translated automatically.
"Hungarian–Czechoslovak War": "Guerre Hongrois-Tchécoslovaque"
"A war over Upper Hungary, today’s Slovakia, after the break-up of Austria-Hungary. Czechoslovak troops took over Slovakia in the winter of 1918–1919 and pushed into northern Hungary in May 1919, until the Hungarian Soviet Republic’s Northern Campaign drove them back deep into Slovakia; under Allied pressure the Hungarians withdrew in early July, and the Treaty of Trianon confirmed Czechoslovakia’s southern border.": "Une guerre sur la Haute Hongrie, aujourd'hui Slovaquie, après l’éclatement de l’Autriche-Hongrie. Les troupes tchécoslovaques ont repris la Slovaquie à l’hiver 1918-1919 et poussé dans le nord de la Hongrie en mai 1919, jusqu’à ce que la République soviétique hongroise de campagne nord les ramène profondément en Slovaquie ; sous la pression alliée les Hongrois se sont retirés au début de juillet, et le traité de Trianon a confirmé la frontière sud de Tchécoslovaquie."
"Known in Hungary as the war for Upper Hungary, and the 1919 offensive as the Northern Campaign (északi hadjárat). Places are named in their present-day forms; Bratislava was Pozsony (Pressburg), Košice was Kassa and Prešov was Eperjes.": "Connu en Hongrie comme la guerre pour la Haute-Hongrie, et l’offensive de 1919 comme la Campagne du Nord (északi hadjárat). Les lieux sont nommés dans leurs formes actuelles ; Bratislava était Pozsony (Pressburg), Košice était Kassa et Prešov était Eperjes."
"The base map shows Slovakia as part of Czechoslovakia from 28 October 1918; land the two armies held beyond the demarcation lines is shown as approximate areas.": "La carte de base montre la Slovaquie comme partie de la Tchécoslovaquie à partir du 28 octobre 1918 ; le territoire des deux armées tenues au-delà des lignes de démarcation est représenté par des zones approximatives."
