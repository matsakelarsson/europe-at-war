"899–910": "899–910"
"The Magyars were a federation of tribes of mounted archers from the steppes north of the Black Sea. In the 890s, pushed west by the Pechenegs and the Bulgarians, they crossed the Carpathians and took over the plains of the Danube basin. In 899 they rode into Italy and on 24 September routed the army of King Berengar I on the river Brenta. In 900 they took Pannonia from Bavaria, and by about 906 they had broken up Great Moravia, the Slav state to their north.": "Dans les années 890, poussés à l’ouest par les Pechenegs et les Bulgares, ils traversèrent les Carpates et s’emparèrent des plaines du bassin du Danube. En 899, ils montèrent en Italie et, le 24 septembre, orientèrent l’armée du roi Berengar Ier sur la rivière Brenta. En 900, ils prirent Pannonie de Bavière et vers 906, ils avaient rompu la Grande Moravie, l’État slave au nord."
"In 907 Margrave Luitpold of Bavaria led a large army down the Danube to drive them out. Near a place called Brezalauspurc, traditionally identified with Pressburg (Bratislava), it was destroyed in fighting that began on 4 July; Luitpold, Archbishop Theotmar of Salzburg and the bishops of Freising and Säben were among the dead. Bavaria lost everything east of the Enns. The Magyars beat the Thuringians near Eisenach in 908 and the army of the young King Louis the Child near Augsburg in 910, and for decades they raided almost at will.": "En 907 Margrave Luitpold de Bavière a conduit une grande armée dans le Danube pour les chasser. Près d’un endroit appelé Brezalauspurc, traditionnellement identifié à Pressburg (Bratislava), il a été détruit dans les combats qui ont commencé le 4 juillet ; Luitpold, Archevêque Théotmar de Salzbourg et les évêques de Freising et Säben étaient parmi les morts. Les Magyars ont battu les Thuringes près d’Eisenach en 908 et l’armée du jeune roi Louis l’Enfant près d’Augsbourg en 910, et pendant des décennies ils ont fait une descente presque à volonté."
