"Hungarian invasions of Europe": "Invasions hongroises en Europe"
"The raids of the Magyars (Hungarians), who settled in the Danube basin in the 890s and for over half a century raided Germany, Italy, Burgundy and France almost every year. After destroying a Bavarian army at Pressburg in 907 they were held off in Saxony by Henry I at Riade in 933, and Otto I’s victory on the Lechfeld in 955 ended their raids to the west.": "Les raids des Magyars (hongrois), qui s’installèrent dans le bassin du Danube dans les années 890 et pendant plus d’un demi-siècle, pillèrent presque chaque année l’Allemagne, l’Italie, la Bourgogne et la France. Après avoir détruit une armée bavaroise à Pressburg en 907, ils furent retenus en Saxe par Henry Ier à Riade en 933, et Otto Ié sur le Lechfeld en 955 termina leurs raids à l’ouest."
"The sources are almost all written by the Magyars’ victims, above all Liutprand of Cremona, Widukind of Corvey and the annals of Bavarian and Swabian monasteries; numbers and many places are uncertain. Hungarian accounts were written down only centuries later.": "Les sources sont presque toutes écrites par les victimes Magyars, surtout Liutprand de Cremona, Widukind de Corvey et les annales des monastères bavarois et souabe ; nombres et nombreux endroits sont incertains."
"East Francia, the eastern kingdom of the Franks, is the medieval German kingdom; its kings were crowned emperors from 962. The Magyars also raided the Byzantine Empire, until 970; those raids are not told here.": "La Francie orientale, le royaume oriental des Francs, est le royaume médiéval allemand ; ses rois ont été couronnés empereurs de 962. Les Magyars ont également fait une descente dans l’Empire byzantin, jusqu’à 970 ; ces raids ne sont pas racontés ici."
