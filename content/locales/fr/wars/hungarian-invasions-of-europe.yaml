"954–955": "954–955"
"The last great raids exploited a German civil war. In 954, during the revolt of Otto I’s son Liudolf and son-in-law Conrad the Red against him, a Hungarian army crossed Bavaria and Franconia. Conrad received it at Worms and sent it on into Lorraine against his enemies, and it went on to plunder what is now Belgium and northern France before going home through Burgundy and Italy. The rebels were blamed for inviting it, and the revolt collapsed. In the summer of 955 the Magyars, perhaps 8,000–10,000 strong, invaded Bavaria again and besieged Augsburg, which its bishop, Ulrich, held.": "Les derniers grands raids exploitèrent une guerre civile allemande. En 954, lors de la révolte d’Otto Iédolf, son fils et beau-fils Conrad le Rouge contre lui, une armée hongroise traversa la Bavière et la Franconie. Conrad l’accepta à Worms et l’envoya en Lorraine contre ses ennemis, puis pilla ce qui est maintenant la Belgique et le nord de la France avant de rentrer à la maison en Bourgogne et en Italie. Au cours de l’été 955, les Magyars, peut-être 8 000 à 10 000 forts, envahirent de nouveau la Bavière et assiégèrent Augsbourg, que son évêque Ulrich tenait."
"Otto came south with a small Saxon force, gathered Bavarians, Swabians, Franconians and a Bohemian contingent, and moved to relieve the city. On 10 August, on the Lechfeld plain by the river Lech, the Magyars routed his rearguard, but Conrad, now reconciled with Otto, drove them off, and Otto’s armoured horsemen broke the main Hungarian army. Conrad was killed by an arrow. Many fleeing Magyars were cut down over the next days, and their leaders were hanged at Regensburg. The raids to the west were over; Otto was crowned emperor in Rome in 962, and Hungary became a Christian kingdom under Stephen I around 1000.": "Otto vint vers le sud avec une petite force saxonne, rassembla les Bavarois, les Souabes, les Franconiens et un contingent bohémien, et s’installa pour soulager la ville. Le 10 août, sur la plaine de Lechfeld près du fleuve Lech, les Magyars roulèrent son arrière-garde, mais Conrad, maintenant réconcilié avec Otto, les chassèrent, et les cavaliers blindés d’Otto brisèrent l’armée hongroise principale. Beaucoup de Magyars fuyant ont été abattus les jours suivants, et leurs chefs ont été pendus à Ratisbonne. Les raids à l’ouest étaient terminés ; Otto a été couronné empereur à Rome en 962, et la Hongrie est devenue un royaume chrétien sous Stephen I vers 1000."
