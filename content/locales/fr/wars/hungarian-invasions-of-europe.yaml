"924–933": "924–933"
"In 924 a Magyar army rode into Saxony. King Henry I, the Saxon duke who had been elected king of East Francia in 919, took refuge in the fortress of Werla, but his men captured a Hungarian leader, and in 926 Henry bought a nine-year truce with his release and a yearly tribute. The truce protected Henry’s Saxony, not the south. That spring the raiders crossed Swabia, plundered the abbey of St. Gallen and rode on into Alsace and France.": "En 924, une armée de Magyar monta en Saxe. Le roi Henri Ier, le duc saxon élu roi de la Francie orientale en 919, se réfugia dans la forteresse de Werla, mais ses hommes prirent un dirigeant hongrois et, en 926, Henry acheta une trêve de neuf ans avec sa libération et un hommage annuel. Au printemps, les raideurs traversèrent la Souabe, pillèrent l’abbaye de Saint-Gall et montèrent en Alsace et en France."
"Henry used the truce to build and garrison strongholds and to train a force of armoured horsemen, which he tried out against the Slavs east of the Elbe. In 932, backed by a church synod at Erfurt, he stopped the tribute. The Magyars invaded the next year, and on 15 March 933 Henry’s army routed them at a place called Riade, somewhere near the Unstrut. Most of the Magyars fled before the horsemen could close with them. Raids on Saxony became rare, but the Magyars went on raiding elsewhere, reaching Reims in 937 and Catalonia in 942.": "En 932, soutenu par un synode d’église à Erfurt, il arrêta l’hommage. Les Magyars envahirent l’année suivante, et le 15 mars 933, l’armée Henry les dirigea dans un lieu appelé Riade, quelque part près de l’Unstrut. La plupart des Magyars s’enfuient avant que les cavaliers ne puissent se refermer avec eux. Les raids en Saxe devinrent rares, mais les Magyars continuèrent à faire des descentes ailleurs, atteignant Reims en 937 et la Catalogne en 942."
