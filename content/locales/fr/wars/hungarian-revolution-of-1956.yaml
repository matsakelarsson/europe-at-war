# Some French text was translated automatically.
"Hungarian Revolution of 1956": "Révolution hongroise de 1956"
"A nationwide revolt against Hungary’s communist government and Soviet domination, which began with a student demonstration in Budapest on 23 October 1956, brought the reform communist Imre Nagy to power and briefly ended one-party rule. On 4 November the Soviet army returned in force and crushed it within a week, installing János Kádár; about 2,500 Hungarians and 700 Soviet soldiers were killed, and some 200,000 people fled the country.": "Une révolte nationale contre le gouvernement communiste hongrois et la domination soviétique, qui a commencé par une manifestation d’étudiants à Budapest le 23 octobre 1956, a amené le communiste réformiste Imre Nagy au pouvoir et a brièvement mis fin au régime de parti unique. Le 4 novembre l’armée soviétique est revenue en force et l’a écrasée en une semaine, installant János Kádár ; environ 2 500 Hongrois et 700 soldats soviétiques ont été tués, et quelque 200 000 personnes ont fui le pays."
"Casualty figures vary; Hungarian research gives about 2,500–3,000 Hungarians killed, and Soviet figures about 720 Soviet soldiers killed.": "Les chiffres des pertes varient ; la recherche hongroise donne entre 2 500 et 3 000 Hongrois tués, et les chiffres soviétiques environ 720 soldats soviétiques tués."
"Imre Nagy, Pál Maléter and others were tried in secret and hanged on 16 June 1958. Their reburial on 16 June 1989 helped bring about the end of communist rule, and 23 October is now a national holiday in Hungary.": "Imre Nagy, Pál Maléter et d’autres ont été jugés en secret et pendus le 16 juin 1958. Leur réinhumation le 16 juin 1989 a contribué à la fin du régime communiste, et le 23 octobre est maintenant une fête nationale en Hongrie."
