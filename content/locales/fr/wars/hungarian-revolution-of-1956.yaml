"23–28 October 1956": "23–28 octobre 1956"
"Encouraged by the reforms in Poland that month, students in Budapest drew up sixteen demands, among them free elections, the withdrawal of Soviet troops and the return of Imre Nagy, a reform communist expelled from power in 1955. On 23 October a march in support of Poland grew into a crowd of some 200,000 outside parliament. Demonstrators pulled down the huge statue of Stalin, and outside the radio building, where students had gone to broadcast their demands, the state security police (ÁVH) opened fire. By the morning the city was in armed revolt, and Soviet tanks rolled in at the request of the party leadership.": "Encouragés par les réformes en Pologne ce mois-là, les étudiants de Budapest ont formulé seize revendications, parmi lesquelles des élections libres, le retrait des troupes soviétiques et le retour d’Imre Nagy, un communiste réformiste expulsé du pouvoir en 1955. Le 23 octobre une marche de soutien à la Pologne s’est développée dans une foule d’environ 200 000 personnes en dehors du parlement. Des manifestants ont abattu l’énorme statue de Staline, et à l’extérieur du bâtiment radio, où les étudiants étaient allés pour diffuser leurs demandes, la police de sécurité de l’État (ÁVH) a ouvert le feu. Le matin, la ville était en révolte armée, et des chars soviétiques ont roulé à la demande de la direction du parti."
"Nagy was made prime minister, but the fighting spread. Young workers and students with rifles and petrol bombs held out in the narrow streets around the Corvin Passage and Széna Square. On 25 October shooting into a crowd in front of parliament killed dozens, perhaps more than a hundred, and the next day state security men fired on a crowd at Mosonmagyaróvár. Revolutionary councils and workers’ councils took over towns and factories across the country. On 28 October Nagy announced a ceasefire, called the rising a national democratic movement and said Soviet troops would leave Budapest.": "Le 25 octobre, des jeunes travailleurs et des étudiants armés de fusils et de bombes à essence se sont abattus sur une foule devant le Parlement et, le lendemain, des agents de la sécurité de l’État ont tiré sur une foule à Mosonmagyaróvár. Les conseils révolutionnaires et les conseils ouvriers ont pris en charge des villes et des usines dans tout le pays. Le 28 octobre, Nagy annonça un cessez-le-feu appelé mouvement national démocratique en plein essor et déclara que les troupes soviétiques quitteraient Budapest."
