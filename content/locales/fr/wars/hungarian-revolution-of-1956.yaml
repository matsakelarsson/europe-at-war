"28 October – 3 November 1956": "28 octobre – 3 novembre 1956"
"Soviet troops withdrew from Budapest on 30 October, and Nagy announced the end of one-party rule and brought non-communist politicians into his government. The state security police was dissolved, political prisoners such as Cardinal József Mindszenty were freed, and new parties and newspapers appeared. There was also revenge. On 30 October insurgents stormed the Budapest party headquarters on Republic Square and lynched several of its defenders. In Moscow, the Soviet leadership first issued a conciliatory declaration, then on 31 October decided to crush the revolution, at a moment when the West was divided by the Suez crisis.": "Les troupes soviétiques se sont retirées de Budapest le 30 octobre, Nagy a annoncé la fin du régime d’un parti et a amené des politiciens non communistes dans son gouvernement. La police de sécurité de l’État a été dissoute, des prisonniers politiques tels que le cardinal József Mindszenty ont été libérés, et de nouveaux partis et journaux sont apparus. A Moscou, la direction soviétique a d’abord publié une déclaration conciliatoire, puis le 31 octobre a décidé d’écraser la révolution, à un moment où l’Occident était divisé par la crise de Suez."
"New Soviet divisions crossed the border from Ukraine and Romania. On 1 November Nagy declared Hungary neutral, announced its withdrawal from the Warsaw Pact and appealed to the United Nations. János Kádár, a member of his government, slipped away to the Soviets, who prepared to install him at the head of a new government. On the night of 3–4 November the defence minister, Pál Maléter, who had gone to talks on the Soviet withdrawal at the Soviet base at Tököl, was arrested there by the KGB.": "Le 1er novembre, Nagy déclara la Hongrie neutre, annonça son retrait du Pacte de Varsovie et fit appel aux Nations Unies. János Kádár, membre de son gouvernement, s’enfuit vers les Soviétiques, qui se préparèrent à l’installer à la tête d’un nouveau gouvernement. Dans la nuit du 3 au 4 novembre, le ministre de la Défense, Pál Maléter, qui était allé à des pourparlers sur le retrait soviétique à la base soviétique de Tököl, y a été arrêté par le KGB."
