"4–11 November 1956": "4–11 novembre 1956"
"At dawn on 4 November Soviet forces attacked Budapest and the other cities. Nagy broadcast a last appeal and took refuge in the Yugoslav embassy, and a radio station announced Kádár’s new government. Armed groups fought on for days at the Corvin Passage, in the industrial district of Csepel and in the new steel town of Sztálinváros, which both held out until 11 November, and in the Mecsek hills near Pécs, but they had no chance against tanks and artillery. Workers’ councils kept up a general strike into December.": "À l’aube du 4 novembre, les forces soviétiques ont attaqué Budapest et les autres villes. Nagy a diffusé un dernier appel et s’est réfugié à l’ambassade yougoslave. Des groupes armés ont combattu pendant des jours au Passage de Corvin, dans le quartier industriel de Csepel et dans la nouvelle ville sidérurgique de Sztálinváros, qui se sont tous deux tenus jusqu’au 11 novembre, ainsi que dans les collines de Mecsek près de Pécs, mais ils n’avaient aucune chance contre les chars et l’artillerie."
"About 2,500 Hungarians, most of them young workers, and some 700 Soviet soldiers were killed. Around 200,000 people fled, most of them across the Austrian border, many over the small bridge at Andau, until the border was closed again. Tens of thousands were arrested. Nagy left the embassy under a promise of safe conduct on 22 November and was seized by Soviet troops; after a secret trial he was hanged with Maléter and others in 1958, among some 230 people executed for their part in the revolution.": "Environ 2 500 Hongrois, dont la plupart étaient de jeunes travailleurs, et quelque 700 soldats soviétiques, ont été tués. Environ 200 000 personnes ont fui, la plupart passant par la frontière autrichienne, beaucoup au-dessus du petit pont d’Andau, jusqu’à ce que la frontière soit refermée à nouveau. Nagy quitta l’ambassade le 22 novembre et fut saisi par les troupes soviétiques ; après un procès secret, il fut pendu avec Maléter et d’autres en 1958, parmi quelque 230 personnes exécutées pour leur part dans la révolution."
