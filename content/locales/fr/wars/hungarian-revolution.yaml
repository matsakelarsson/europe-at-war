"June – August 1849": "juin – août 1849"
"On 21 May, in Warsaw, Francis Joseph thanked Tsar Nicholas I in person for his promise of help. In mid-June about 200,000 Russian troops under Field Marshal Ivan Paskevich crossed the Carpathians from Galicia, through the Dukla Pass and others, while a second Russian army under General Alexander von Lüders entered Transylvania from Wallachia. In the west the new Austrian commander, Julius Jacob von Haynau, took Győr on 28 June. Together the two empires had well over twice as many men as the Hungarians. Görgei held Haynau before Komárom on 2 July but failed to break through on 11 July, then marched east around the Russians, fighting them at Vác on 15–17 July and drawing them north before turning south towards Arad.": "Le 21 mai, à Varsovie, Francis Joseph a remercié personnellement le tsar Nicholas Ier pour sa promesse d’aide. A la mi-juin, environ 200 000 troupes russes sous le maréchal Ivan Patchevich ont traversé les Carpates de Galice, par le col de Dukla et d’autres, tandis qu’une deuxième armée russe sous le général Alexander von Lüders est entrée en Transylvanie de Wallachie. À l’ouest, le nouveau commandant autrichien, Julius Jacob von Haynau, prit Győr le 28 juin. Ensemble, les deux empires avaient plus de deux fois plus d’hommes que les Hongrois. Görgei tenait Haynau avant Komárom le 2 juillet mais n’a pas réussi à percer le 11 juillet, puis marchait vers l’est autour des Russes, les combattant à Vác du 15 au 17 juillet et les dessinant vers le nord avant de tourner vers Arad vers le sud."
"The government left Pest for Szeged, where on 28 July parliament passed laws allowing the nationalities to use their own languages in local government and schools and emancipating the Jews, too late to change the war. In Transylvania Lüders beat Bem at Segesvár on 31 July; the poet Petőfi was last seen alive on that battlefield. Haynau crossed the Tisza and beat Dembiński at Szőreg on 5 August, and on 9 August he routed the southern army, now under Bem, at Temesvár. Cholera swept through all the armies, and most of the Russian dead died of disease rather than in battle.": "Le gouvernement a quitté Pest pour Szeged, où le 28 juillet le parlement a adopté des lois permettant aux nationalités d’utiliser leurs propres langues dans l’administration locale et les écoles et émancipation des juifs, trop tard pour changer la guerre. En Transylvanie Lüders a battu Bem à Segesvár le 31 juillet ; le poète Petőfi a été vu pour la dernière fois vivant sur ce champ de bataille. Haynau a traversé la Tisza et battu Dembiński à Szőreg le 5 août, et le 9 août il a conduit l’armée du sud, maintenant sous Bem, à Temesvár. Choléra balayé toutes les armées, et la plupart des morts russes sont morts de maladie plutôt que dans la bataille."
"Russian army": "Armée russe"
"about 200,000 under Paskevich": "environ 200 000 sous Paskevich"
"Battle of Segesvár": "Bataille de Segesvár"
"31 July 1849, Russian victory": "31 juillet 1849, victoire russe"
"Battle of Temesvár": "Bataille de Temesvár"
"9 August 1849, Austrian victory": "9 août 1849, victoire autrichienne"
"Dukla Pass": "Pass Dukla"
"June 1849": "juin 1849"
"Paskevich’s main army crossed from Galicia into Hungary through this and neighbouring Carpathian passes.": "L’armée principale de Paskevitch a traversé la Galice en Hongrie par ce col carpatien et voisin."
"Győr": "Győr"
"28 June 1849": "28 juin 1849"
"Haynau’s offensive began by driving Poeltenberg’s corps out of the town, with Francis Joseph present.": "L’offensive de Haynau a commencé par faire sortir le corps de Poeltenberg, avec Francis Joseph présent."
"2 and 11 July 1849": "2 et 11 juillet 1849"
"Görgei’s army fought Haynau to a standstill outside the fortress, but its attempt to break out south-east failed.": "L’armée de Görgei-S a combattu Haynau à l’arrêt en dehors de la forteresse, mais sa tentative de briser le sud-est a échoué."
"15–17 July 1849": "15–17 juillet 1849"
"Görgei fought his way past Paskevich’s army and slipped away north-east, drawing the Russians after him.": "Görgei se battit devant l’armée de Paskevitch et s’enfuit au nord-est, tirant les Russes après lui."
"Szeged": "Étendue"
"28 July 1849": "28 juillet 1849"
"The last sitting of the Hungarian parliament passed a law on the rights of the nationalities and the emancipation of the Jews.": "La dernière séance du parlement hongrois a adopté une loi sur les droits des nationalités et l’émancipation des juifs."
"31 July 1849": "31 juillet 1849"
"Lüders’s Russians defeated Bem near Fehéregyháza. Sándor Petőfi went missing in the rout and was probably killed.": "Les Russes de Lüders ont battu Bem près de Fehéregyháza. Sándor Petőfi a disparu dans la rout et a probablement été tué."
"Szőreg": "Szőreg"
"5 August 1849": "5 août 1849"
"Haynau forced the crossing of the Tisza and defeated Dembiński’s army south-east of Szeged.": "Haynau a forcé la traversée de la Tisza et défait l’armée de Dembiński, au sud-est de Szeged."
"9 August 1849": "9 août 1849"
"Haynau routed the Hungarian southern army and relieved the imperial garrison, which had held the fortress against Hungarian sieges since the autumn of 1848.": "Haynau dirigea l’armée hongroise du sud et souligna la garnison impériale, qui tenait la forteresse contre les sièges hongrois depuis l’automne de 1848."
"Paskevich": "Paskevich"
"Lüders": "Lüders"
"Haynau": "Haynau"
"Világos and the Arad martyrs": "Világos et les martyrs d’Arad"
"August – October 1849": "août – octobre 1849"
"On 11 August Kossuth handed full power to Görgei and fled with other leaders across the Ottoman border; his minister Bertalan Szemere buried the Holy Crown near Orsova, where it was found in 1853. On 13 August, at Világos near Arad, Görgei surrendered his army of about 30,000 men to the Russian general Count Theodor von Rüdiger, choosing to lay down arms before the Russians rather than the Austrians. The Russians handed the prisoners over to the Austrians. The remaining corps and fortresses gave up in the following weeks; Klapka held Komárom until 2 October and won free passage for its garrison.": "Le 11 août, Kossuth donna le plein pouvoir à Görgei et s’enfuit avec d’autres dirigeants de l’autre côté de la frontière ottomane ; son ministre Bertalan Szemere enterra la Sainte Couronne près d’Orsova, où elle fut retrouvée en 1853. Le 13 août, à Világos près d’Arad, Görgei a remis son armée d’environ 30 000 hommes au général russe Theodor von Rüdiger, choisissant de déposer les armes devant les Russes plutôt que les Autrichiens. Les Russes ont livré les prisonniers aux Autrichiens. Le corps et les forteresses restants ont renoncé dans les semaines suivantes ; Klapka a tenu Komárom jusqu’au 2 octobre et a remporté le libre passage pour sa garnison."
"Haynau, given full powers, took harsh revenge. On 6 October, the anniversary of the Vienna rising, twelve generals and a colonel of the Hungarian army were executed at Arad, four by firing squad and nine on the gallows, and the same day Batthyány was shot in Pest. Over a hundred people were executed and many more imprisoned or forced into the imperial army. Görgei was spared at the tsar’s request and interned at Klagenfurt, and many Hungarians called him a traitor. Hungary was ruled as a conquered land until the Compromise of 1867, Kossuth died in exile, and 6 October is a day of mourning in Hungary.": "Le 6 octobre, l’anniversaire de Vienne s’étant levé, douze généraux et un colonel de l’armée hongroise ont été exécutés à Arad, quatre par peloton d’exécution et neuf sur la potence, et le même jour Batthyány a été abattu à Pest. Plus d’une centaine de personnes ont été exécutées et beaucoup plus emprisonnées ou forcées dans l’armée impériale. Görgei a été épargné à la demande du tsar et interné à Klagenfurt, et beaucoup de Hongrois l’ont qualifié de traître. La Hongrie a été gouvernée comme terre conquise jusqu’au compromis de 1867, Kossuth est mort en exil, et le 6 octobre est un jour de deuil en Hongrie."
"Surrender at Világos": "Rendez-vous à Világos"
"13 August 1849, to the Russians": "13 août 1849, aux Russes"
"Komárom surrenders": "Komárom se rend"
"2 October 1849": "2 octobre 1849"
"Executions at Arad": "Exécutions à Arad"
"6 October 1849": "6 octobre 1849"
"Orsova": "Orsova"
"August 1849": "août 1849"
"Kossuth crossed into Ottoman territory nearby, and Szemere hid the Holy Crown and the regalia in the ground outside the town.": "Kossuth a traversé le territoire ottoman à proximité, et Szemere a caché la Sainte Couronne et les régalia dans le sol en dehors de la ville."
"Világos": "Világos"
"13 August 1849": "13 août 1849"
"Görgei’s army laid down its arms before Rüdiger’s Russian corps on the fields of Szőlős, ending the war in the field.": "L’armée de Görgei a déposé ses armes devant le corps russe de Rüdiger sur les champs de Szőlős, mettant fin à la guerre dans le champ."
"Arad": "Arad"
"The thirteen martyrs of Arad, officers of the Hungarian army, were executed in the fortress on Haynau’s orders.": "Les treize martyrs d’Arad, officiers de l’armée hongroise, furent exécutés dans la forteresse sur les ordres de Haynau."
"Klapka surrendered the fortress on terms that let its defenders go free, the last Hungarian force to give up.": "Klapka a cédé la forteresse à des conditions qui ont permis à ses défenseurs de se libérer, la dernière force hongroise à abandonner."
"Lajos Batthyány, Hungary’s first prime minister, was shot by firing squad.": "Lajos Batthyány, le premier Premier ministre de Hongrie, a été abattu par un peloton d’exécution."
"Kossuth into exile": "Kossuth en exil"
