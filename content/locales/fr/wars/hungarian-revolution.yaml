"By late summer the court had turned against the Batthyány government, and on 11 September Jelačić crossed the Drava with an army of Croatian border regiments and volunteers. Batthyány resigned, and parliament gave power to a National Defence Committee led by Kossuth, which raised new honvéd battalions and printed its own money. On 28 September a crowd in Pest killed Count Franz Lamberg, sent by the king to take command of all troops in Hungary. The next day General János Móga’s army stopped Jelačić’s advance at Pákozd, near Lake Velence. The fight was small, but Jelačić asked for a three-day truce and slipped away towards Vienna, and on 7 October Artúr Görgei and Mór Perczel forced his rearguard of some 9,000 men to surrender at Ozora.": "À la fin de l’été, le tribunal s’était retourné contre le gouvernement Batthyány et, le 11 septembre, Jelačić avait traversé la Drava avec une armée de régiments et de volontaires croates. Batthyány démissionnait, et le parlement donnait le pouvoir à un comité de défense nationale dirigé par Kossuth, qui soulevait de nouveaux bataillons et imprimait son propre argent. Le 28 septembre, une foule à Pest a tué le comte Franz Lamberg, envoyé par le roi pour prendre le commandement de toutes les troupes en Hongrie. Le combat était petit, mais Jelačić a demandé une trêve de trois jours et a glissé vers Vienne, et le 7 octobre Artúr Görgei et Mór Perczel ont forcé son arrière-garde d’environ 9 000 hommes à se rendre à Ozora."
"The order sending troops from Vienna against Hungary set off a rising there on 6 October. The Hungarian army crossed the border late and was beaten at Schwechat on 30 October by Jelačić and Prince Alfred Windischgrätz, who took Vienna the next day. On 2 December Ferdinand abdicated in favour of his 18-year-old nephew Francis Joseph, whom the Hungarian parliament refused to recognise as king. In Transylvania, Romanian insurgents and imperial troops took most of the country by November. Both sides killed civilians. Hungarian townspeople were massacred at Zalatna in October and at Nagyenyed in January, and Hungarian troops and courts burned Romanian villages and hanged peasants.": "L’ordre d’envoyer des troupes de Vienne contre la Hongrie s’y est levé le 6 octobre. L’armée hongroise a traversé la frontière tard et a été battue à Schwechat le 30 octobre par Jelačić et le prince Alfred Windischgrätz, qui ont pris Vienne le lendemain. Le 2 décembre Ferdinand abdiqué en faveur de son neveu de 18 ans Francis Joseph, que le parlement hongrois a refusé de reconnaître comme roi. En Transylvanie, les insurgés roumains et les troupes impériales ont pris la majeure partie du pays en novembre. Les deux camps ont tué des civils. Des habitants de villes hongroises ont été massacrés à Zalatna en octobre et à Nagyenyed en janvier, et les troupes et tribunaux hongrois ont brûlé des villages roumains et pendu des paysans."
