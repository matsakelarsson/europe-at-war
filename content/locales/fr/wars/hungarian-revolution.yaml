"In mid-December Windischgrätz invaded Hungary with the main imperial army, while other corps closed in from Galicia, Styria, Croatia and the Serbian south. Görgei fell back from the border, and Perczel was beaten at Mór on 30 December. Parliament and the National Defence Committee moved to Debrecen, beyond the Tisza, taking the Holy Crown with them, and on 5 January 1849 Windischgrätz entered Buda and Pest. Görgei led his corps north into the mountains of Upper Hungary, drawing imperial troops after him, forced the Branyiszkó Pass on 5 February and joined György Klapka’s troops at Kassa.": "À la mi-décembre, Windischgrätz envahit la Hongrie avec l’armée impériale principale, tandis que d’autres corps fermèrent la Galice, la Styrie, la Croatie et le sud serbe. Görgei tomba de la frontière et Perczel fut battu à Mór le 30 décembre. Le 5 janvier 1849, Windischgrätz entra dans Buda et Pest. Görgei conduisit son corps vers le nord dans les montagnes de la Haute Hongrie, puis tira après lui des troupes impériales, força le col Branyiszkó le 5 février et rejoignit les troupes de György Klapka."
"In Transylvania the Polish general Józef Bem took Kolozsvár at Christmas and, after beating the Austrian commander Anton Puchner at Piski on 9 February, held his own against imperial troops and a Russian detachment called in from Wallachia by the Saxon towns. Kossuth gave command of the main army to another Pole, Henryk Dembiński, whom Windischgrätz defeated at Kápolna on 26–27 February. Believing the war won, the court issued a new constitution, dated 4 March, which made Hungary one crown land among many in a centralised empire and separated Transylvania, Croatia and the Serbian Vojvodina from it. The war became one for independence.": "En Transylvanie, le général polonais Józef Bem a pris Kolozsvár à Noël et, après avoir battu le commandant autrichien Anton Puchner à Piski le 9 février, a tenu ses propres contre les troupes impériales et un détachement russe appelé de Wallachie par les villes saxonnes. Kossuth donna le commandement de l’armée principale à un autre Polonais, Henryk Dembiński, que Windischgrätz défait à Kápolna les 26 et 27 février. Croyant la guerre gagnée, le tribunal publia une nouvelle constitution, datée du 4 mars, qui fit de la Hongrie une terre couronne parmi beaucoup dans un empire centralisé et en sépara la Transylvanie, la Croatie et la Voïvodine serbe. La guerre devint une pour l’indépendance."
