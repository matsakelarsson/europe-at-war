# Some French text was translated automatically.
"Hungarian Revolution of 1848–1849": "Révolution hongroise de 1848–1849"
"A revolution in which Hungary won a constitutional government of its own in the spring of 1848 and then fought the Austrian Empire, Croatia and the Serb and Romanian insurgents of the kingdom, declaring independence in April 1849. Its armies drove the imperial forces almost out of the country, but a Russian army of some 200,000 men joined the Austrians that summer, and the Hungarians surrendered at Világos in August 1849, followed by harsh reprisals.": "Une révolution au cours de laquelle la Hongrie a remporté son propre gouvernement constitutionnel au printemps de 1848, puis a combattu l’Empire autrichien, la Croatie et les insurgés serbes et roumains du royaume, déclarant l’indépendance en avril 1849. Ses armées ont chassé les forces impériales presque hors du pays, mais une armée russe d’environ 200 000 hommes a rejoint les Autrichiens cet été-là, et les Hongrois se sont rendus à Világos en août 1849, suivie par de violentes représailles."
"Dates are New Style (Gregorian). Russian accounts use the Julian calendar, then 12 days behind.": "Les dates sont New Style (Gregorian). Les comptes russes utilisent le calendrier julien, puis 12 jours derrière."
"Places are given their Hungarian names of the time, as in most accounts. Pozsony is Bratislava; Kassa is Košice and Nagysalló Tekovské Lužany in Slovakia; Kolozsvár is Cluj, Nagyszeben Sibiu, Segesvár Sighișoara, Piski Simeria, Temesvár Timișoara and Világos Șiria in Romania; Karlóca is Sremski Karlovci and Szenttamás Srbobran in Serbia.": "Les lieux reçoivent leur nom hongrois de l’époque, comme dans la plupart des comptes. Pozsony est Bratislava ; Kassa est Košice et Nagysalló Tekovské Lužany en Slovaquie ; Kolozsvár est Cluj, Nagyszeben Sibiu, Segesvár Sighișoara, Piski Simeria, Temesvár Timișoara et Világos Şiria en Roumanie ; Karlóca est Sremski Karlovci et Szenttamás Srbobran en Serbie."
"The risings in Vienna are told in the German revolutions of 1848–1849, and the revolution in Wallachia in its own entry. The war in Hungary was also a civil war between the kingdom’s nationalities; numbers of civilians killed, especially in Transylvania and the south, are disputed.": "Les montées à Vienne sont racontées dans les révolutions allemandes de 1848–1849, et la révolution en Wallachie dans sa propre entrée. La guerre en Hongrie était également une guerre civile entre les nationalités du royaume ; nombre de civils tués, en particulier en Transylvanie et au sud, sont contestés."
