"In March Bem drove the Austrians and Russians out of Transylvania, taking Nagyszeben on 11 March, and Perczel cleared much of the south of Serb and imperial troops. At the start of April the main army, now led in practice by Görgei, attacked east of Pest and won at Hatvan on 2 April, Tápióbicske on 4 April and Isaszeg on 6 April, where Windischgrätz himself was beaten. It then turned north, took Vác on 10 April, defeated General Ludwig von Wohlgemuth at Nagysalló on 19 April and on 26 April relieved the besieged fortress of Komárom. Windischgrätz was dismissed, and his successor withdrew almost all imperial troops from Hungary, leaving garrisons in Buda castle and a few fortresses.": "En mars, Bem a chassé les Autrichiens et les Russes de Transylvanie, prenant Nagyszeben le 11 mars, et Perczel a dégagé une grande partie du sud des troupes serbes et impériales. Au début du mois d’avril, l’armée principale, maintenant conduite en pratique par Görgei, a attaqué à l’est de Pest et gagné à Hatvan le 2 avril, Tápióbicske le 4 avril et Isaszeg le 6 avril, où Windischgrätz lui-même a été battu. Il se dirigea ensuite vers le nord, prit Vác le 10 avril, battit le général Ludwig von Wohlgemuth à Nagysalló le 19 avril et le 26 avril soula la forteresse assiégée de Komárom. Windischgrätz fut congédié, et son successeur retira presque toutes les troupes impériales de Hongrie, laissant des garnisons dans le château de Buda et quelques forteresses."
"On 14 April, in the Great Church of Debrecen, parliament declared the House of Habsburg-Lorraine deposed and Hungary independent, and elected Kossuth governor-president. Görgei, who thought the declaration ruled out a compromise, turned back to besiege Buda rather than follow the enemy towards Vienna, a choice still argued over. The castle’s commander, General Heinrich Hentzi, shelled Pest across the river; Buda was stormed on 21 May after a siege of 17 days, and Hentzi was mortally wounded. It was the height of Hungarian success, but Francis Joseph had already asked the tsar for help.": "Le 14 avril, dans la Grande Eglise de Debrecen, le Parlement a déclaré la Chambre des Habsbourg-Lorraine déposée et la Hongrie indépendante, et élu gouverneur-président Kossuth. Görgei, qui pensait que la déclaration excluait un compromis, retourna à assiége Buda plutôt que de suivre l’ennemi vers Vienne, choix encore débattu. Le commandant du château, le général Heinrich Hentzi, a bombardé Pest à travers la rivière ; Buda a été pris d’assaut le 21 mai après un siège de 17 jours, et Hentzi a été mortellement blessé. C’était la hauteur du succès hongrois, mais Francis Joseph avait déjà demandé l’aide du tsar."
