"March – August 1848": "mars – août 1848"
"News of the February revolution in Paris reached the Hungarian diet at Pozsony, where Lajos Kossuth called for a constitution on 3 March 1848. After the rising in Vienna on 13 March, young radicals in Pest, the poet Sándor Petőfi among them, met at the Pilvax café on 15 March, read out twelve demands and Petőfi’s National Song to growing crowds, printed them without the censor’s leave and freed the imprisoned writer Mihály Táncsics. The court gave way without bloodshed. On 17 March Count Lajos Batthyány was appointed prime minister of Hungary, and on 11 April King Ferdinand V signed the laws the diet had passed.": "Les nouvelles de la révolution de février à Paris ont atteint le régime hongrois à Pozsony, où Lajos Kossuth a demandé une constitution le 3 mars 1848. Après la montée à Vienne le 13 mars, les jeunes radicaux de Pest, le poète Sándor Petőfi parmi eux, se sont rencontrés au café Pilvax le 15 mars, ont lu douze revendications et le chant national de Petőfiês à des foules croissantes, les ont imprimés sans les censeurs partir et libéré l’écrivain emprisonné Mihály Táncsics. La cour a cédé la place sans effusion de sang. Le 17 mars, le comte Lajos Batthyány a été nommé Premier ministre de Hongrie et, le 11 avril, le roi Ferdinand V a signé les lois sur l’alimentation."
"The April Laws made Hungary a constitutional monarchy with a government answerable to an elected parliament in Pest, ended serfdom and the nobles’ freedom from tax, freed the press and united Transylvania with Hungary. But Hungarian stayed the only language of government in a kingdom where Magyars were fewer than half the people. Josip Jelačić, the new ban of Croatia, broke off relations with Pest. Serbs meeting at Karlóca in May proclaimed a Serbian Vojvodina and took up arms in June, and Romanians meeting at Balázsfalva claimed recognition as a nation and opposed the union with Transylvania, which its diet voted on 29 May. The court, recovering from its shock, began to back the nationalities against Pest.": "Les lois d’avril ont fait de la Hongrie une monarchie constitutionnelle avec un gouvernement responsable devant un parlement élu à Pest, mis fin au servage et les nobles à l’abri des impôts, libéré la presse et uni Transylvanie avec la Hongrie. Mais le hongrois est resté la seule langue du gouvernement dans un royaume où les Magyars étaient moins de la moitié du peuple. Josip Jelačić, la nouvelle interdiction de Croatie, a rompu les relations avec Pest. Les Serbes réunis à Karlóca en mai ont proclamé une Voïvodine serbe et pris les armes en juin, et les Roumains réunis à Balázsfalva ont revendiqué la reconnaissance comme nation et s’est opposé à l’union avec la Transylvanie, que son régime a voté le 29 mai."
