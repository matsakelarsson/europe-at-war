"July 1919 – March 1920": "juillet 1919 – mars 1920"
"After withdrawing from Slovakia under Allied pressure, the Hungarian Red Army turned on the Romanians, whom the Allies had promised to pull back but who had not moved. On 20 July it crossed the Tisza at several points and pushed east for a few days, but the Romanians stopped it, counter-attacked and crossed the river on the night of 29–30 July. The Hungarian army fell apart. Kun’s government resigned on 1 August and its leaders fled to Austria, and on 3–4 August Romanian troops entered Budapest.": "Après s’être retirée de Slovaquie sous la pression des Alliés, l’armée rouge hongroise a fait demi-tour aux Roumains, que les Alliés avaient promis de retirer mais qui n’avaient pas bougé. Le 20 juillet elle a traversé la Tisza à plusieurs points et poussé vers l’est pendant quelques jours, mais les Roumains l’ont arrêté, contre-attaqué et traversé le fleuve dans la nuit du 29 au 30 juillet. Le 1er août, le gouvernement Kuns a démissionné et ses dirigeants ont fui vers l’Autriche, et les 3 et 4 août, les troupes roumaines sont entrées à Budapest."
"The Romanian army occupied Budapest and most of Hungary as far as Győr. It took rolling stock, livestock, grain and factory equipment as reparations, in defiance of protests from the Allied Supreme Council in Paris. Short-lived governments followed in Budapest, while officers of the counter-revolutionary National Army carried out a White Terror against communists, Jews and others. The Romanians left Budapest on 14 November, Admiral Miklós Horthy rode in two days later, and the last Romanian troops left Hungary in March 1920, before the Treaty of Trianon fixed the new border.": "L’armée roumaine a occupé Budapest et la plupart de la Hongrie jusqu’à Győr. Il a pris le matériel roulant, le bétail, les céréales et l’équipement d’usine comme réparations, au mépris des protestations du Conseil suprême allié à Paris. Les gouvernements de courte durée ont suivi à Budapest, tandis que les officiers de l’Armée nationale contre-révolutionnaire ont effectué une terreur blanche contre les communistes, juifs et autres. Les Roumains quittèrent Budapest le 14 novembre, l’amiral Miklós Horthy monta deux jours plus tard et les dernières troupes roumaines quittèrent la Hongrie en mars 1920, avant que le traité de Trianon ne fixe la nouvelle frontière."
