# Some French text was translated automatically.
"Hungarian–Romanian War": "Guerre de Hongrie et de Roumanie"
"A war fought as the Kingdom of Hungary broke up after the First World War. Romanian troops advanced through Transylvania to the Tisza in the spring of 1919, defeated the Hungarian Soviet Republic’s offensive in July and occupied Budapest in August, staying in Hungary until early 1920; the Treaty of Trianon then gave Romania Transylvania and the lands to its west.": "Les troupes roumaines ont avancé par Transylvanie vers la Tisza au printemps 1919, ont défait l’offensive de la République soviétique hongroise en juillet et occupé Budapest en août, demeurant en Hongrie jusqu’au début de 1920 ; le traité de Trianon a ensuite donné la Roumanie Transylvanie et les terres à l’ouest."
"Places are named in their present-day forms; Oradea was Nagyvárad, Satu Mare was Szatmárnémeti and Cluj was Kolozsvár to Hungarians.": "Les lieux sont nommés sous leur forme actuelle ; Oradea était Nagyvárad, Satu Mare était Szatmárnémeti et Cluj était Kolozsvár pour les Hongrois."
"The base map follows the borders recognised at the time; land the Romanian army held beyond them is shown as approximate areas. Losses were small compared with the World War, about 3,670 Romanian soldiers killed and, by most estimates, between 2,000 and 6,000 Hungarians.": "La carte de base suit les frontières reconnues à l’époque ; les terres que l’armée roumaine détenait au-delà d’elles sont représentées par des zones approximatives. Les pertes ont été faibles par rapport à la guerre mondiale, environ 3 670 soldats roumains tués et, selon la plupart des estimations, entre 2 000 et 6 000 Hongrois."
