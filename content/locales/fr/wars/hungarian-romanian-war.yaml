"November 1918 – May 1919": "novembre 1918 – mai 1919"
"As Austria-Hungary collapsed, Romania re-entered the war on 10 November 1918, and its troops crossed into Transylvania three days later. On 1 December an assembly of Transylvanian Romanians at Alba Iulia declared union with Romania, and the Romanian army moved west to lines set by the Allies. Hungary’s new government under Mihály Károlyi had demobilised most of its army. When the Allied Vix note of 20 March 1919 demanded a further Hungarian withdrawal, Károlyi resigned, and on 21 March communists and social democrats proclaimed the Hungarian Soviet Republic, led in practice by Béla Kun.": "Alors que l’Autriche et la Hongrie s’effondrent, la Roumanie entre de nouveau dans la guerre le 10 novembre 1918, et ses troupes entrent en Transylvanie trois jours plus tard. Le 1er décembre, une assemblée de Roumains transylvaniens à Alba Iulia déclare union avec la Roumanie, et l’armée roumaine se déplace vers l’ouest jusqu’aux lignes fixées par les Alliés. Lorsque la note Allié Vix du 20 mars 1919 a exigé un nouveau retrait hongrois, Károlyi démissionne et le 21 mars les communistes et sociaux-démocrates proclament la République soviétique hongroise, conduite en pratique par Béla Kun."
"Kun’s government promised to defend Hungary’s borders and hoped for help from Soviet Russia. On 16 April, before the new Hungarian Red Army was ready, the Romanian army attacked. It took Oradea on 20 April and Debrecen on 23 April, the Székely Division of Transylvanian Hungarians laid down its arms, and by 1 May the Romanians stood along the Tisza. With Czechoslovak troops advancing from the north at the same time, the Soviet Republic seemed close to collapse, but a mass mobilisation of Budapest’s workers saved it.": "Le 16 avril, avant que la nouvelle armée rouge hongroise ne soit prête, l’armée roumaine a attaqué. Il a pris Oradea le 20 avril et Debrecen le 23 avril, la division de Székely des Hongrois transylvaniens a déposé ses armes, et au 1er mai les Roumains se tenaient le long de la Tisza. Avec les troupes tchécoslovaques qui avançaient du nord en même temps, la République soviétique semblait proche de s’effondrer, mais une mobilisation massive des ouvriers de Budapest l’avait sauvée."
