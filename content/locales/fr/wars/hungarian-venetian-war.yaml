# Some French text was translated automatically.
"Hungarian–Venetian War of 1356–1358": "Guerre Hongrois-Vénétien de 1356–1358"
"The war in which Louis I of Hungary took Dalmatia from Venice. Left out of the Venetian–Genoese peace of 1355, Louis claimed the Dalmatian towns as king of Croatia and in 1356 invaded the Venetian mainland with the support of the Patriarch of Aquileia, the Count of Gorizia and Francesco da Carrara of Padua, besieging Treviso, while Croatian and Hungarian forces attacked the coast. Split, Trogir and Šibenik went over to him, and Zadar was taken at the end of 1357. In the Treaty of Zadar of 18 February 1358 Venice gave up Dalmatia from the Kvarner to Durazzo and dropped Dalmatia from the doge’s title, though it kept Istria and its supremacy at sea. Ragusa (Dubrovnik) accepted Hungarian overlordship later that year and became, in practice, an independent republic.": "La guerre dans laquelle Louis Ier de Hongrie a pris la Dalmatie de Venise. Parti de la paix vénitienne-génoise de 1355, Louis a revendiqué les villes dalmates comme roi de Croatie et en 1356 envahi le continent vénitien avec l’appui du Patriarche d’Aquileia, le comte de Gorizia et Francesco da Carrara de Padoue, assiégeant Treviso, tandis que les forces croates et hongroises attaquaient la côte. Split, Trogir et Šibenik sont allés vers lui, et Zadar a été prise à la fin de 1357. Dans le traité de Zadar du 18 février 1358 Venise a donné Dalmatie du Kvarner à Durazzo et a abandonné Dalmatie du titre de doge, bien qu’il a gardé Istrie et sa suprématie en mer. Ragusa (Dubrovnik) a accepté la domination hongroise plus tard dans l’année et est devenue, en pratique, une république indépendante."
"Accounts differ on the southern limit of what Venice gave up, given as Durazzo or the Bay of Kotor. Louis I also fought Venice in alliance with Genoa in the War of Chioggia (1378–1381).": "Les comptes diffèrent sur la limite sud de ce que Venise a abandonné, donné comme Durazzo ou la baie de Kotor. Louis Ier a également combattu Venise en alliance avec Gênes dans la guerre de Chioggia (1378-1381)."
