# French translations of the catalogue text (wave 8); step bodies follow later.
Hussain Shah’s conquest of Kamata: Conquête du Kamata par Hussain Shah
"The conquest of the Kamata kingdom, in today’s northern West Bengal, western Assam and northern Bangladesh, by Alauddin Hussain Shah, sultan of Bengal. Its last king, Nilambar of the Khen dynasty, had enlarged his realm from Cooch Behar to Kamrup. Helped by a minister of Nilambar who had gone over to him, Hussain invaded with an army said to number 24,000 infantry and cavalry and a war flotilla, defeated the allied local rulers, and sent his general Shah Ismail Ghazi against Nilambar’s capital, Kamatapur. After a long siege the city fell, was sacked and destroyed, and Nilambar was taken prisoner. Hussain annexed Kamata and Kamrup as far as Hajo, near Guwahati, and made his son Danyal governor, styling himself on his coins conqueror of Kamarupa and Kamata. Bengal’s rule did not last: Danyal and his officers were killed by local chiefs, the Baro-Bhuyans, and in the 1510s the Koch kingdom rose in Kamata’s place.": "La conquête du royaume de Kamata, qui s’étendait sur l’actuel nord du Bengale-Occidental, l’ouest de l’Assam et le nord du Bangladesh, par Alauddin Hussain Shah, sultan du Bengale. Son dernier roi, Nilambar, de la dynastie Khen, avait agrandi son royaume de Cooch Behar jusqu’au Kamrup. Aidé par un ministre de Nilambar passé dans son camp, Hussain envahit le pays avec une armée qui aurait compté 24 000 fantassins et cavaliers ainsi qu’une flottille de guerre, vainquit les souverains locaux coalisés et envoya son général Shah Ismail Ghazi contre la capitale de Nilambar, Kamatapur. Au terme d’un long siège, la ville tomba, fut pillée et détruite, et Nilambar fut fait prisonnier. Hussain annexa le Kamata et le Kamrup jusqu’à Hajo, près de Guwahati, nomma gouverneur son fils Danyal et se fit appeler sur ses monnaies conquérant du Kamarupa et du Kamata. La domination bengalie ne dura pas : Danyal et ses officiers furent tués par des chefs locaux, les Baro-Bhuyans, et dans les années 1510 le royaume koch s’éleva à la place du Kamata."
