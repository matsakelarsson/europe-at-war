"Lipany and the Compacts": "Lipany et les Compacts"
"1434–1436": "1434–1436"
"The radicals, unwilling to compromise, had besieged Catholic Plzeň since July 1433 without success. In the spring of 1434 the Utraquist and Catholic lords formed a league, took the New Town of Prague from the radicals in May and forced Prokop to lift the siege. The Taborites and Orphans joined forces east of Prague. On 30 May 1434, near Lipany, the League’s army pretended to retreat and drew them out of their wagon fort; its hidden cavalry then broke in. Prokop the Great and Prokop the Lesser were killed, and hundreds of prisoners were burned to death in barns.": "Les radicaux, peu disposés à faire des compromis, avaient assiégé sans succès le catholique Plzea depuis juillet 1433. Au printemps de 1434, les seigneurs utraquis et catholiques formèrent une ligue, prirent la nouvelle ville de Prague des radicaux en mai et forcèrent Prokop à lever le siège. Les Taborites et les orphelins se joignirent aux forces à l’est de Prague. Le 30 mai 1434, près de Lipany, l’armée de la Ligue prétendait se retirer et les tirer de leur fort de chariot ; sa cavalerie cachée s’est alors effondrée. Prokop le Grand et Prokop le Petit ont été tués, et des centaines de prisonniers ont été brûlés à mort dans des granges."
"Lipany broke the radicals, and the moderates came to terms with Sigismund and the Church. On 5 July 1436 at Jihlava the Compacts of Basel were proclaimed, allowing communion in both kinds in Bohemia and Moravia, and the estates accepted Sigismund as king. He entered Prague that August and died the next year. The wars had devastated Bohemia and many neighbouring lands, but the Hussites kept their church; the Utraquist church remained Bohemia’s largest until after the battle of the White Mountain in 1620.": "Le 5 juillet 1436 à Jihlava, les pactes de Bâle ont été proclamés, permettant la communion dans les deux sortes en Bohême et en Moravie, et les domaines ont accepté Sigismond comme roi. Il est entré à Prague en août et est mort l’année suivante. Les guerres avaient dévasté la Bohême et de nombreux pays voisins, mais les Hussites gardaient leur église ; l’église d’Utraquist demeura la plus grande Bohème jusqu’à après la bataille de la Montagne Blanche en 1620."
