"1431–1433": "1431–1433"
"Talks between Sigismund and the Hussites came to nothing, and the pope called another crusade. On 1 August 1431 a large army under Frederick of Brandenburg, with the papal legate Cardinal Giuliano Cesarini, crossed into western Bohemia, and on 8 August it began to besiege Domažlice. When a Hussite relief army under Prokop came up on 14 August, the crusaders broke and fled back over the border forest before the battle had properly begun, by tradition at the sound of the Hussite hymn “Ye who are warriors of God”. Cesarini barely escaped, leaving behind his baggage and the papal bull.": "Les pourparlers entre Sigismond et les Hussites n’arrivèrent à rien, et le pape appela une autre croisade. Le 1er août 1431, une grande armée sous Frederick de Brandebourg, avec le légat papal du cardinal Giuliano Cesarini, traversa la Bohême occidentale, et le 8 août elle commença à assiéger Domažlice. Lorsqu'une armée de secours Hussite sous Prokop monta le 14 août, les croisés se brisèrent et s’enfuirent au-dessus de la forêt frontalière avant que la bataille ne commence correctement, par tradition au son de l’hymne Hussite, Ye qui sont des guerriers de Dieu. Cesarini s’échappa à peine, laissant derrière ses bagages et le taureau papale."
"Cesarini drew his own conclusion. As president of the new Council of Basel he worked for talks, and in May 1432, at Cheb, the council’s envoys accepted the Hussite demand that the Bible and the practice of the early Church should judge between them. A Hussite embassy led by Prokop debated at Basel from January 1433; a council delegation then went to Prague, and in November it agreed terms with the Bohemian diet allowing communion in both kinds. The moderates accepted them; the radicals did not. That year Hussite troops also fought for Poland against the Teutonic Order and reached the Baltic.": "Cesarini tira sa propre conclusion. En tant que président du nouveau Conseil de Bâle, il travailla pour les pourparlers, et en mai 1432, à Cheb, les envoyés du conseil acceptèrent l’exigence Hussite que la Bible et la pratique de l’Église primitive doivent juger entre eux. Une ambassade Hussite dirigée par Prokop a débattu à Bâle de janvier 1433 ; une délégation du conseil s’est ensuite rendue à Prague, et en novembre il a convenu avec le régime bohème permettant la communion dans les deux sortes. Les modérés les ont acceptés ; les radicaux ne l’ont pas. Cette année-là, les troupes Hussite se sont également battues pour la Pologne contre l’Ordre teutonique et ont atteint la Baltique."
