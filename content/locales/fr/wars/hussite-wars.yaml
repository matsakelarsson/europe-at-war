"The League’s forces took the New Town, the radicals’ stronghold in the capital.": "Les forces de la Ligue ont pris la Nouvelle Ville, le bastion des radicaux dans la capitale."
"30 May 1434": "30 mai 1434"
"Also called the battle of Český Brod. Sigismund is said to have remarked that the Bohemians could be beaten only by Bohemians.": "Aussi appelé la bataille de Český Brod. Sigismond aurait remarqué que les Bohèmes ne pouvaient être battus que par les Bohêmes."
