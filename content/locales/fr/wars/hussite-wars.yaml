"1421–1422": "1421–1422"
"By the summer of 1421 the Hussites held most of Bohemia, and in June a diet at Čáslav refused to accept Sigismund as king and set up a provisional government. Žižka, already blind in one eye, lost the other at the siege of Rabí castle but went on commanding. A second crusade, from the Rhineland and Saxony, besieged Žatec in September and fled when a Hussite army approached. In December Sigismund invaded from Moravia with Hungarians and Germans. Žižka was camped outside Kutná Hora when its mainly German townspeople turned against the Hussites, and the royal army closed in.": "À l’été 1421, les Hussites tenaient la plupart de la Bohême, et en juin un régime à Čáslav refusa d’accepter Sigismond comme roi et créa un gouvernement provisoire. Žižka, déjà aveugle dans un oeil, perdit l’autre au siège du château de Rabí mais continua à commander. Une deuxième croisade, de la Rhénanie et de la Saxe, a assiégé Žatec en septembre et s’est enfuie quand une armée hussite s’approchait. En décembre Sigismond envahit de Moravie avec des Hongrois et des Allemands. Žižka campait à l’extérieur de Kutná Hora lorsque ses habitants principalement allemands se retournèrent contre les Husites, et l’armée royale ferma."
"On the night of 21–22 December Žižka broke out, his wagons rolling forward with guns firing, and withdrew to Kolín. Sigismund thought the Hussites beaten and sent his troops into winter quarters. Reinforced, Žižka struck back on 6 January 1422, routing the royal army at Nebovidy, and pursued it south. On 10 January he caught it at Německý Brod. Hundreds of fleeing soldiers drowned when the ice of the Sázava broke, and against Žižka’s orders his men stormed the town and killed many of its people.": "Dans la nuit du 21 au 22 décembre Žižka a éclaté, ses wagons roulant en avant avec des coups de feu, et se sont retirés à Kolín. Sigismond pensait que les Hussites battaient et envoyaient ses troupes dans des quartiers d’hiver. Renforcé, Žižka a frappé le 6 janvier 1422, roulant l’armée royale à Nebovidy, et poursuivi au sud. Le 10 janvier, il a pris à Německý Brod. Des centaines de soldats en fuite se sont noyés lorsque la glace du Sázava s’est brisée, et contre Žižka, ses hommes ont pris l’assaut de la ville et tué beaucoup de sa population."
