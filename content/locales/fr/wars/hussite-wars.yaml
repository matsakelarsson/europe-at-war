"1419–1420": "1419–1420"
"Jan Hus, the Prague preacher who had attacked the wealth and corruption of the Church, was burned as a heretic at the Council of Constance on 6 July 1415, although King Sigismund had given him a safe conduct. Hundreds of Bohemian and Moravian nobles protested, and his followers took up communion in both kinds, bread and wine; the chalice became their sign. On 30 July 1419 a Hussite crowd led by the priest Jan Želivský stormed Prague’s New Town Hall and threw the councillors from the windows. When King Wenceslaus IV died on 16 August, his heir was his brother Sigismund, king of Hungary and of the Romans.": "Jan Hus, le prédicateur de Prague qui avait attaqué la richesse et la corruption de l’Église, fut brûlé comme hérétique au concile de Constance le 6 juillet 1415, bien que le roi Sigismond lui eût donné une conduite sûre. Des centaines de nobles bohèmes et moraves protestèrent, et ses disciples prirent communion dans les deux sortes, pain et vin ; le calice devint leur signe. Le 30 juillet 1419, une foule hussite dirigée par le prêtre Jan Želivský s’empare de la nouvelle mairie de Prague et jette les conseillers des fenêtres. Lorsque le roi Venceslaus IV meurt le 16 août, son héritier est Sigismund, son frère, roi de Hongrie et des Romains."
"On 17 March 1420 a papal bull calling a crusade against the Hussites was proclaimed at Breslau, and Sigismund led an army of Germans, Hungarians and others into Bohemia. Radicals gathered at the new hilltop town of Tábor, and their captain, the veteran soldier Jan Žižka, used wagons as a fort to beat royalist cavalry at Sudoměř. The crusaders besieged Prague, but on 14 July Žižka’s men on Vítkov hill threw back their attack and the army broke up. Sigismund had himself crowned in Prague Castle and withdrew; on 1 November the Hussites beat him again below Vyšehrad.": "Le 17 mars 1420, un taureau papale appelé une croisade contre les Hussites fut proclamé à Breslau, et Sigismond conduisit une armée d’Allemands, de Hongrois et d’autres en Bohême. Les radicaux se sont rassemblés à la nouvelle ville de Tábor, et leur capitaine, le soldat vétéran Jan Žižka, a utilisé des wagons comme un fort pour battre la cavalerie royaliste à Sudoměř. Les croisés ont assiégé Prague, mais le 14 juillet Žižka est les hommes sur la colline de Vítkov ont repoussé leur attaque et l’armée a rompu. Sigismond avait lui-même couronné au château de Prague et s’était retiré ; le 1er novembre, les Hussites l’avaient battu à nouveau sous Vyšehrad."
