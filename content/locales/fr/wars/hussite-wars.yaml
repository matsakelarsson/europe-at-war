"1422–1426": "1422–1426"
"Without a common enemy in the field, the Hussites fell out. In Prague the radical preacher Želivský was arrested and beheaded in March 1422. Seeking a king of their own faith, the Hussites offered the crown to Władysław II Jagiełło of Poland and then to Grand Duke Vytautas of Lithuania, who sent his nephew Sigismund Korybut to govern. Žižka, now leading the radicals of Tábor and the eastern Bohemian brotherhood of Orebites, beat the Prague Utraquists and their noble allies at Hořice in 1423 and at Malešov on 7 June 1424. He died of illness on 11 October 1424 while besieging Přibyslav; his followers called themselves the Orphans.": "Sans ennemi commun sur le terrain, les Hussites sont tombés. A Prague, le prédicateur radical Želivský a été arrêté et décapité en mars 1422. Cherchant un roi de leur propre foi, les Hussites offrirent la couronne à Władysław II Jagieło de Pologne, puis au Grand-Duc Vytautas de Lituanie, qui envoya son neveu Sigismund Korybut gouverner. Žižka, qui dirige maintenant les radicaux de Tábor et la fraternité bohème orientale d’Orebites, bat les Utraquistes de Prague et leurs nobles alliés à Hořice en 1423 et à Malešov le 7 juin 1424. Il mourut de maladie le 11 octobre 1424 alors qu’il assiégeait Přibyslav ; ses disciples se nommaient les orphelins."
"Prokop the Great, a married priest, became the leading commander of the radicals. In 1426 an army from Saxony and Meissen came to relieve Ústí nad Labem, an Elbe town that Sigismund had pledged to the Margrave of Meissen and which the Hussites were besieging. On 16 June it attacked the Hussite wagon fort on a hill near the town, broke through the chains between the wagons and was surrounded and cut down. The Hussites gave no quarter. The chronicles speak of tens of thousands; modern historians think the armies were much smaller, but the crusaders’ losses were heavy.": "Prokop le Grand, un prêtre marié, devint le chef des radicaux. En 1426 une armée de Saxe et Meissen vint soulager Ústí nad Labem, une ville d’Elbe que Sigismond avait promise au margrave de Meissen et que les Hussites assiégèrent. Le 16 juin, il attaqua le fort du wagon de Hussite sur une colline près de la ville, brisa les chaînes entre les wagons et fut encerclé et coupé. Les Hussite ne donnèrent pas de quart. Les chroniques parlent de dizaines de milliers ; les historiens modernes pensent que les armées étaient beaucoup plus petites, mais les croisades furent lourdes."
