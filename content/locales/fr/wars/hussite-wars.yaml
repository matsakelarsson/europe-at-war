"1427–1430": "1427–1430"
"In 1427 a new crusade under the papal legate Cardinal Henry Beaufort and the Elector Frederick of Brandenburg crossed into western Bohemia and besieged Stříbro. When a Hussite army under Prokop approached, the crusaders panicked and fled; on 4 August Beaufort tried and failed to rally them at Tachov. Later that year the Hussites imprisoned Korybut, suspected of plotting with Sigismund. No crusade came again for four years.": "En 1427, une nouvelle croisade sous la légation papale du cardinal Henry Beaufort et l’électeur Frederick de Brandenburg se sont croisés dans la Bohême occidentale et ont assiégé Stříbro. Lorsqu'une armée hussite sous Prokop s’est approchée, les croisés ont paniqué et fui ; le 4 août Beaufort a essayé et n’a pas réussi à les rallier à Tachov. Plus tard cette année-là, les Hussites ont emprisonné Korybut, soupçonné de complot avec Sigismund. Aucune croisade n’est revenue pendant quatre ans."
"The Hussites now carried the war abroad, in campaigns they called the beautiful or glorious rides. From 1428 Prokop and other captains led armies into Silesia and Lusatia, Austria, Upper Hungary and Saxony, burning towns and monasteries, taking ransoms and loot and punishing the lands that had sent men to the crusades; they made no attempt at lasting conquest. The greatest ride, in the winter of 1429–30, went through Saxony into Franconia, sacking Plauen and burning Hof and Bayreuth. At Kulmbach on 6 February 1430 Frederick of Brandenburg, burgrave of Nuremberg, agreed terms with Prokop, and the Hussites went home.": "À partir de 1428, Prokop et d’autres capitaines menèrent des armées en Silésie et en Lusatie, en Autriche, en Haute Hongrie et en Saxe, en brûlant des villes et des monastères, prenant rançons et pillages et punissant les terres qui avaient envoyé des hommes aux croisades ; ils ne firent aucune tentative de conquête durable. La plus grande promenade, en hiver de 1429–1430, a traversé la Saxe en Franconie, saccageant Plauen et brûlant Hof et Bayreuth. À Kulmbach le 6 février 1430 Frederick de Brandenburg, burgrave de Nuremberg, ont convenu des conditions avec Prokop, et les Hussite sont rentrés chez eux."
