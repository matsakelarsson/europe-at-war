"1420": "1420"
"Hussite Wars": "Guerres de Hussite"
"The wars that followed the burning of the Czech reformer Jan Hus in 1415, in which his followers in Bohemia defended their faith against King Sigismund and five crusades from across the Empire. Using wagon forts and early firearms, Hussite armies under Jan Žižka and Prokop the Great beat every crusade and raided deep into neighbouring lands, until moderate Hussites and Catholics crushed the radicals at Lipany in 1434 and made peace with the Church and Sigismund in the Compacts of 1436.": "Les guerres qui ont suivi l’incendie du réformateur tchèque Jan Hus en 1415, dans lequel ses disciples en Bohême défendaient leur foi contre le roi Sigismund et cinq croisades de tout l’Empire. En utilisant des forts de wagons et des armes à feu, les armées hussites sous Jan Žižka et Prokop le Grand battent toutes les croisades et font une descente profonde dans les pays voisins, jusqu’à ce que des Hussites modérés et des catholiques détruisent les radicaux à Lipany en 1434 et fassent la paix avec l’Église et Sigismond dans les pactes de 1436."
"Dates are Julian, as usual for the period. The chronicles give huge numbers for the armies, often tens of thousands; modern historians think they were much smaller.": "Les dates sont Julian, comme d’habitude pour la période. Les chroniques donnent un nombre énorme pour les armées, souvent des dizaines de milliers ; les historiens modernes pensent qu’ils étaient beaucoup plus petits."
"The Hussites soon split into moderates (Utraquists or Calixtines, strongest in Prague and among the nobles) and radicals (the Taborites, the eastern Bohemian brotherhood known after Žižka’s death as the Orphans, and others). Historians number the crusades differently, and the Hussites fought each other as well as the crusaders.": "Les Hussites se divisent rapidement en modérés (Utraquistes ou Calixtines, les plus forts à Prague et parmi les nobles) et radicaux (les Taborites, la fraternité bohème orientale connue après la mort de Žižka comme les Orphelins, et d’autres)."
"Places are named in Czech, with the German name where it is often used in English (Kutná Hora/Kuttenberg, Německý Brod/Deutschbrod, Ústí nad Labem/Aussig, Stříbro/Mies, Domažlice/Taus).": "Les lieux sont nommés en tchèque, avec le nom allemand où il est souvent utilisé en anglais (Kutná Hora/Kuttenberg, Německý Brod/Deutschbrod, Ústí nad Labem/Aussig, Stříbro/Mies, Domažlice/Taus)."
