# French translations of the catalogue text (wave 13); step bodies follow later.
Hut Tax War: Guerre de l’impôt de case
? The armed resistance of 1898 to British rule in the new Protectorate of Sierra Leone, set off by Governor Frederic Cardew’s tax on houses. Britain had ruled the coastal Colony around Freetown since 1808 and in 1896 declared a protectorate over the interior to secure it against other European powers; from 1 January 1898 every house there was to pay five or ten shillings a year, collected by the chiefs under the eye of district commissioners and the Frontier Police. Chiefs petitioned against it as an attack on their authority. In the north the Temne and Loko under Bai Bureh, ruler of Kasseh near Port Loko, fought a guerrilla war from February to November 1898 that tied down British and West Indian troops for months. In the south-east, from late April, Mende chiefs and warriors, organised through the Poro society, rose suddenly and killed several hundred Creole traders, missionaries, officials and others seen as agents of the government, before columns under Lieutenant-Colonel Marshall put the rising down in about two months. British troops burned villages and farms to break the resistance. Bai Bureh was captured on 11 November 1898 and exiled to the Gold Coast with the Mende leaders Nyagua and Kpana Lewis, and 96 men were hanged for murder. A royal commissioner, Sir David Chalmers, found that the tax and the way it was enforced had caused the rising, but the tax stayed.
: La résistance armée opposée en 1898 à la domination britannique dans le nouveau protectorat de la Sierra Leone, déclenchée par l’impôt de case du gouverneur Frederic Cardew. La Grande-Bretagne gouvernait la colonie côtière entourant Freetown depuis 1808 et avait proclamé en 1896 un protectorat sur l’intérieur pour la mettre à l’abri des autres puissances européennes ; à partir du 1er janvier 1898, chaque habitation devait y payer cinq ou dix shillings par an, perçus par les chefs sous la surveillance des commissaires de district et de la police des frontières. Les chefs adressèrent des pétitions contre cet impôt, qu’ils jugeaient attentatoire à leur autorité. Dans le nord, les Temné et les Loko, menés par Bai Bureh, souverain du Kasseh, près de Port Loko, livrèrent de février à novembre 1898 une guérilla qui immobilisa pendant des mois des troupes britanniques et antillaises. Dans le sud-est, à partir de la fin d’avril, des chefs et des guerriers mendé, organisés par l’intermédiaire de la société Poro, se soulevèrent brusquement et tuèrent plusieurs centaines de commerçants créoles, de missionnaires, de fonctionnaires et d’autres personnes considérées comme des agents du gouvernement, avant que des colonnes commandées par le lieutenant-colonel Marshall ne répriment le soulèvement en deux mois environ. Les troupes britanniques incendièrent villages et fermes pour briser la résistance. Bai Bureh fut capturé le 11 novembre 1898 et exilé en Côte-de-l’Or avec les chefs mendé Nyagua et Kpana Lewis, et 96 hommes furent pendus pour meurtre. Un commissaire royal, sir David Chalmers, conclut que l’impôt et la manière dont il avait été appliqué étaient à l’origine du soulèvement, mais l’impôt fut maintenu.
