# French translations of the catalogue text (wave 12); step bodies follow later.
Idris Alooma’s wars: Les guerres d’Idris Alooma
The campaigns of Mai Idris b. Ali, called Alooma after his burial place, the most famous king of Bornu. With a reorganised cavalry, a corps of musketeers trained by Turks, camel troops and large boats for crossing rivers and Lake Chad, he fought the peoples of the Bornu heartland who would not submit, expelling some of them and taking towns such as Amsaka by storm, raided as far as Kano, and in a series of expeditions to Kanem broke the power of the Bulala, who had driven his ancestors out two centuries earlier. Kanem was divided, with the Bulala under Bornu’s loose overlordship, and many Kanem peoples were moved to Bornu. Idris exchanged embassies with the Ottoman sultan Murad III and with Ahmad al-Mansur of Morocco, and was killed on campaign near present-day Maiduguri. His imam Ahmad ibn Furtu wrote an account of his first twelve years, the earliest detailed history of a West African king’s wars by a contemporary.: Les campagnes du maï Idris b. Ali, dit Alooma du nom du lieu où il fut enterré, le plus célèbre roi du Bornou. Avec une cavalerie réorganisée, un corps de mousquetaires formés par des Turcs, des méharistes et de grandes embarcations pour franchir les fleuves et le lac Tchad, il combattit les peuples du cœur du Bornou qui refusaient de se soumettre, expulsant certains d’entre eux et prenant d’assaut des villes comme Amsaka, lança des raids jusqu’à Kano et, par une série d’expéditions au Kanem, brisa la puissance des Boulala, qui avaient chassé ses ancêtres deux siècles plus tôt. Le Kanem fut partagé, les Boulala restant sous la suzeraineté lâche du Bornou, et de nombreux peuples du Kanem furent transférés au Bornou. Idris échangea des ambassades avec le sultan ottoman Mourad III et avec Ahmad al-Mansur du Maroc, et fut tué en campagne près de l’actuelle ville de Maiduguri. Son imam Ahmad ibn Furtu rédigea le récit de ses douze premières années de règne, la plus ancienne histoire détaillée des guerres d’un roi d’Afrique de l’Ouest écrite par un contemporain.
