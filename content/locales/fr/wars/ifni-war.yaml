# Some French text was translated automatically.
"Ifni War": "Guerre d’Ifni"
"A war between Spain and the Moroccan Army of Liberation, irregular forces backed by newly independent Morocco, over the Spanish enclave of Ifni and the Spanish Sahara. In November 1957 the irregulars attacked Sidi Ifni and the Spanish posts inland, and Spain withdrew to a small perimeter around the town, which was besieged; in the Sahara, a joint Spanish–French offensive in February 1958 broke the insurgents. By the Treaty of Angra de Cintra of April 1958 Spain ceded Cape Juby (the Tarfaya Strip) to Morocco, but it kept Sidi Ifni until 1969 and Western Sahara until 1975.": "Une guerre entre l’Espagne et l’Armée marocaine de libération, forces irrégulières soutenues par le Maroc nouvellement indépendant, sur l’enclave espagnole d’Ifni et du Sahara espagnol. En novembre 1957, les irréguliers attaquèrent Sidi Ifni et les postes espagnols à l’intérieur, et l’Espagne se retira dans un petit périmètre autour de la ville assiégée ; au Sahara, une offensive conjointe franco-espagnole en février 1958 brisa les insurgés. Par le Traité d’Angra de Cintra d’avril 1958 l’Espagne a cédé Cape Juby (la bande de Tarfaya) au Maroc, mais il a gardé Sidi Ifni jusqu’en 1969 et Sahara Occidental jusqu’en 1975."
"The fighting took place in south-western Morocco and Western Sahara, outside the map. Spain lost about 200 dead and 80 missing; the irregulars lost an estimated 800–1,000 dead.": "Les combats ont eu lieu dans le sud-ouest du Maroc et au Sahara occidental, en dehors de la carte. L’Espagne a perdu environ 200 morts et 80 disparus ; les irréguliers ont perdu environ 800 à 1 000 morts."
