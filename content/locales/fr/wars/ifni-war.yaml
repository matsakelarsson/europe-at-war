? A war between Spain and the Moroccan Army of Liberation, irregular forces that newly independent Morocco tolerated and in part armed, over the Spanish enclave of Ifni and the Spanish Sahara. After Morocco became independent in 1956, the southern units of the Army of Liberation, which had fought the French protectorate, turned on the Spanish territories that the Istiqlal party and the king claimed as part of a Greater Morocco, and many Sahrawi tribesmen joined them. On 23 November 1957 the irregulars attacked Sidi Ifni and the Spanish posts inland; Spain relieved the besieged posts of Tiliouine and Telata with paratroopers and the Legion, then pulled back to a perimeter around the town, which stayed under siege until June 1958. In the Sahara the irregulars drove the Spanish back to the coast, and Spanish legionnaires were ambushed at Edchera in January 1958. In February 1958 some 9,000 Spanish and 5,000 French troops with about 150 aircraft, the Spanish Operation Teide and the French Operation Écouvillon, swept the desert from El Aaiún, Villa Cisneros, Tindouf and Fort Gouraud and broke the irregulars. By the Treaty of Angra de Cintra of 1 April 1958 Spain handed Cape Juby, the Tarfaya Strip, to Morocco, but it kept Sidi Ifni until 1969 and Western Sahara until 1976. Spain lost about 200 dead and 80 missing; the irregulars lost an estimated 800–1,000 dead.
: Une guerre entre l’Espagne et l’Armée de libération marocaine, des forces irrégulières que le Maroc nouvellement indépendant tolérait et armait en partie, pour l’enclave espagnole d’Ifni et le Sahara espagnol. Après l’indépendance du Maroc en 1956, les unités méridionales de l’Armée de libération, qui avaient combattu le protectorat français, se retournèrent contre les territoires espagnols que le parti de l’Istiqlal et le roi revendiquaient comme partie d’un Grand Maroc, et de nombreux membres des tribus sahraouies les rejoignirent. Le 23 novembre 1957, les irréguliers attaquèrent Sidi Ifni et les postes espagnols de l’intérieur ; l’Espagne dégagea les postes assiégés de Tiliouine et de Telata avec des parachutistes et la Légion, puis se replia sur un périmètre autour de la ville, qui resta assiégée jusqu’en juin 1958. Au Sahara, les irréguliers refoulèrent les Espagnols vers la côte, et des légionnaires espagnols tombèrent dans une embuscade à Edchera en janvier 1958. En février 1958, quelque 9 000 soldats espagnols et 5 000 soldats français, appuyés par environ 150 avions, dans le cadre de l’opération espagnole Teide et de l’opération française Écouvillon, ratissèrent le désert à partir d’El Aaiún, de Villa Cisneros, de Tindouf et de Fort-Gouraud et brisèrent les irréguliers. Par le traité d’Angra de Cintra du 1er avril 1958, l’Espagne remit au Maroc le cap Juby, la bande de Tarfaya, mais elle conserva Sidi Ifni jusqu’en 1969 et le Sahara occidental jusqu’en 1976. L’Espagne perdit environ 200 morts et 80 disparus ; les pertes des irréguliers sont estimées entre 800 et 1 000 morts.
