# French translations of the catalogue text (wave 13); step bodies follow later.
Ijaye War: Guerre d’Ijaye
? A war among the Yoruba successor states of the Oyo Empire. When Alaafin Atiba died in 1859, his son Adelu succeeded him at New Oyo, against the old custom that the crown prince died with his father. Ibadan, the strongest of the new Yoruba towns, accepted Adelu; Kurunmi, the ruler of Ijaye and holder of Oyo’s highest military title, refused to do homage and seized a party of the alaafin’s men. In April 1860 Ibadan’s war chiefs, led by Balogun Ibikunle and Ogunmola, declared war on Ijaye. Abeokuta and its Egba army came to Ijaye’s help, and Ijebu also took its side, fearing Ibadan’s power. Ibadan besieged the city, which missionaries in the 1850s had estimated at 40,000–100,000 people, and cut off its food supplies; Kurunmi’s five sons were killed and he himself died in June 1861. Ijaye, starving, fell on 17 March 1862 and was destroyed; its survivors fled to Abeokuta, where they settled in a quarter still called Ago Ijaye, while many others were enslaved. The war went on between Ibadan and the Egba and Ijebu over the roads to the coast, which both sides closed to each other’s trade. Britain, which had annexed Lagos in 1861 and wanted the trade routes open, intervened in March 1865, when troops from Lagos drove the Egba from their camp outside Ikorodu, a town under Lagos’s protection. Ibadan emerged as the leading Yoruba military power, and the rivalries left unresolved led to the Kiriji War of 1877–1893.
: Une guerre entre les États yoruba issus de l’empire d’Oyo. À la mort de l’alaafin Atiba en 1859, son fils Adelu lui succéda au Nouvel Oyo, contrairement à l’ancienne coutume qui voulait que le prince héritier meure avec son père. Ibadan, la plus puissante des nouvelles villes yoruba, accepta Adelu ; Kurunmi, souverain d’Ijaye et détenteur du plus haut titre militaire d’Oyo, refusa de lui rendre hommage et s’empara d’un groupe d’hommes de l’alaafin. En avril 1860, les chefs de guerre d’Ibadan, menés par le balogun Ibikunle et par Ogunmola, déclarèrent la guerre à Ijaye. Abeokuta et son armée egba vinrent au secours d’Ijaye, et l’Ijebu se rangea lui aussi à ses côtés, par crainte de la puissance d’Ibadan. Ibadan assiégea la ville, dont des missionnaires avaient estimé la population à 40 000–100 000 habitants dans les années 1850, et coupa son ravitaillement ; les cinq fils de Kurunmi furent tués, et lui-même mourut en juin 1861. Affamée, Ijaye tomba le 17 mars 1862 et fut détruite ; ses survivants s’enfuirent à Abeokuta, où ils s’installèrent dans un quartier qui s’appelle toujours Ago Ijaye, tandis que beaucoup d’autres furent réduits en esclavage. La guerre se poursuivit entre Ibadan d’une part, les Egba et l’Ijebu de l’autre, pour les routes de la côte, que chaque camp ferma au commerce de l’autre. La Grande-Bretagne, qui avait annexé Lagos en 1861 et voulait que les routes commerciales restent ouvertes, intervint en mars 1865, lorsque des troupes venues de Lagos chassèrent les Egba de leur camp devant Ikorodu, ville placée sous la protection de Lagos. Ibadan s’imposa comme la première puissance militaire yoruba, et les rivalités restées sans solution conduisirent à la guerre de Kiriji de 1877–1893.
