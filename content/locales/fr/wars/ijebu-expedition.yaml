# French translations of the catalogue text (wave 13); step bodies follow later.
Ijebu expedition: Expédition de l’Ijebu
? A short British campaign from Lagos that conquered the Yoruba kingdom of Ijebu, in what is now south-western Nigeria. Ijebu lay across the roads between the British colony of Lagos and the interior, and it kept the trade in its own merchants’ hands, charging tolls and closing the roads to Lagos traders and missionaries when it chose. In January 1892, after the Awujale (king) of Ijebu had turned back a mission led by the acting governor George Denton the year before, he agreed to open the roads in return for £500 a year in compensation for lost tolls; when a missionary was refused passage soon afterwards, Governor Gilbert Carter’s government treated it as a breach of the agreement. On 12 May 1892 a force of several hundred colonial soldiers, mostly Hausa troops from Lagos and the Gold Coast and men of the West India Regiment, with carriers and some Ibadan irregulars, under Colonel Francis Scott, landed at Epe on the lagoon and marched inland. The Ijebu raised an army of about 8,000 armed mostly with old muskets, and fought hard at the crossing of the Yemoji river near Imagbon, where Maxim guns cut down their ranks; the Ijebu are reported to have lost over 900 men and the British force about 56 killed and 30 wounded. The Awujale submitted, the British flag was raised in Ijebu Ode, and Ijebu toll gates and several shrines were destroyed. Ijebu came under the Lagos government, the roads to Ibadan were opened, and in 1893 Carter toured the interior; treaties with Abeokuta, Oyo and Ibadan that year brought most of Yorubaland under British protection without further war.
: Une courte campagne britannique lancée depuis Lagos, qui conquit le royaume yoruba d’Ijebu, dans l’actuel sud-ouest du Nigeria. L’Ijebu s’étendait en travers des routes reliant la colonie britannique de Lagos à l’intérieur, et il réservait le commerce à ses propres marchands, percevant des péages et fermant à sa guise les routes aux commerçants et aux missionnaires de Lagos. En janvier 1892, après avoir refoulé l’année précédente une mission conduite par le gouverneur par intérim George Denton, l’Awujale (roi) de l’Ijebu accepta d’ouvrir les routes en échange de 500 livres sterling par an en compensation des péages perdus ; lorsqu’un missionnaire se vit refuser le passage peu après, le gouvernement du gouverneur Gilbert Carter considéra qu’il s’agissait d’une violation de l’accord. Le 12 mai 1892, une force de plusieurs centaines de soldats coloniaux, surtout des troupes haoussa de Lagos et de la Côte-de-l’Or et des hommes du West India Regiment, accompagnés de porteurs et de quelques irréguliers d’Ibadan, débarqua à Epe, sur la lagune, sous le commandement du colonel Francis Scott, et marcha vers l’intérieur. Les Ijebu levèrent une armée d’environ 8 000 hommes, armés pour la plupart de vieux mousquets, et se battirent âprement au passage de la rivière Yemoji, près d’Imagbon, où les mitrailleuses Maxim fauchèrent leurs rangs ; les Ijebu auraient perdu plus de 900 hommes, et la force britannique quelque 56 tués et 30 blessés. L’Awujale se soumit, le drapeau britannique fut hissé à Ijebu Ode, et les postes de péage de l’Ijebu ainsi que plusieurs sanctuaires furent détruits. L’Ijebu passa sous l’autorité du gouvernement de Lagos, les routes d’Ibadan furent ouvertes, et en 1893 Carter fit une tournée dans l’intérieur ; les traités conclus cette année-là avec Abeokuta, Oyo et Ibadan placèrent la plus grande partie du pays yoruba sous protection britannique sans nouvelle guerre.
