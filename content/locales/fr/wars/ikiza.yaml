# French translations of the catalogue text (wave 13); step bodies follow later.
Ikiza (1972 killings in Burundi): Ikiza (massacres de 1972 au Burundi)
? "A Hutu rising in southern Burundi in April 1972 and the mass killings of Hutu by the Tutsi-dominated army and government that followed, known in Kirundi as the Ikiza (“the catastrophe”) or Ubwicanyi (“the killings”). Since 1966 President Michel Micombero had ruled with a circle of Tutsi officers and officials from Bururi province, the Groupe de Bururi, and Hutu had been pushed out of the army and government after the killings and the attempted coup of 1965. On 30 March 1972 the deposed king Ntare V returned from exile in Uganda and was held at Gitega. Between 20:00 and 21:00 on 29 April Hutu militants, joined by exiled Zairean rebels whom Burundians called “Mulelists”, attacked in Bujumbura and in the south around Rumonge, Nyanza-Lac and Bururi, killing officials and every Tutsi they found and Hutu who would not join them: missionaries estimated 800–1,200 dead. That night Ntare V was killed at Gitega. Zaire’s President Mobutu sent paratroopers to hold Bujumbura airport and Tanzania sent ammunition; the army retook Rumonge on 1 May and Nyanza-Lac on 2 May. It then turned on the Hutu population across the country, above all educated Hutu: teachers, priests, civil servants, soldiers, pupils and university students were taken from lists and killed by the army and the ruling party’s youth wing, the Jeunesses Révolutionnaires Rwagasore, and buried in mass graves. The army declared operations over on 21 June. Conservative estimates of the dead range from 100,000 to 150,000; some go up to 300,000, about 10–15 per cent of Burundi’s Hutu men. Tens of thousands fled, most of them to Tanzania; by mid-1973 about 35,000 had reached Zaire and about 6,000 Rwanda. Historians disagree whether it was a genocide: Jean-Pierre Chrétien and Leo Kuper called it one, René Lemarchand a “selective genocide”, others “organised massacres”; in December 2021 Burundi’s Truth and Reconciliation Commission declared that the state had committed genocide against the Hutu in 1972. The Ikiza’s legacy, and the fear it left on both sides, shaped Burundi’s later crises of 1988 and 1993."
: "Un soulèvement hutu dans le sud du Burundi en avril 1972 et les massacres de Hutu perpétrés ensuite par l’armée et le gouvernement dominés par les Tutsi, appelés en kirundi Ikiza (« la catastrophe ») ou Ubwicanyi (« les tueries »). Depuis 1966, le président Michel Micombero gouvernait avec un cercle d’officiers et de responsables tutsi originaires de la province de Bururi, le Groupe de Bururi, et les Hutu avaient été écartés de l’armée et du gouvernement après les tueries et la tentative de coup d’État de 1965. Le 30 mars 1972, l’ancien roi Ntare V, qui avait été déposé, rentra d’exil en Ouganda et fut détenu à Gitega. Le 29 avril, entre 20 heures et 21 heures, des militants hutu, rejoints par des rebelles zaïrois exilés que les Burundais appelaient « mulélistes », attaquèrent à Bujumbura et dans le sud, autour de Rumonge, de Nyanza-Lac et de Bururi, tuant des responsables, tous les Tutsi qu’ils trouvaient et les Hutu qui refusaient de se joindre à eux : des missionnaires estimèrent le nombre de morts à 800–1 200. Cette nuit-là, Ntare V fut tué à Gitega. Le président zaïrois Mobutu envoya des parachutistes tenir l’aéroport de Bujumbura, et la Tanzanie envoya des munitions ; l’armée reprit Rumonge le 1er mai et Nyanza-Lac le 2 mai. Elle se retourna ensuite contre la population hutu dans tout le pays, et surtout contre les Hutu instruits : enseignants, prêtres, fonctionnaires, soldats, élèves et étudiants furent arrêtés d’après des listes et tués par l’armée et par l’organisation de jeunesse du parti au pouvoir, les Jeunesses révolutionnaires Rwagasore, puis enterrés dans des fosses communes. L’armée déclara les opérations terminées le 21 juin. Les estimations prudentes du nombre de morts vont de 100 000 à 150 000 ; certaines atteignent 300 000, soit environ 10 à 15 % des hommes hutu du Burundi. Des dizaines de milliers de personnes s’enfuirent, pour la plupart en Tanzanie ; au milieu de 1973, environ 35 000 avaient gagné le Zaïre et environ 6 000 le Rwanda. Les historiens sont partagés sur la qualification de génocide : Jean-Pierre Chrétien et Leo Kuper l’ont employée, René Lemarchand parle de « génocide sélectif », d’autres de « massacres organisés » ; en décembre 2021, la Commission vérité et réconciliation du Burundi a déclaré que l’État avait commis un génocide contre les Hutu en 1972. L’héritage de l’Ikiza, et la peur qu’il laissa dans les deux camps, façonnèrent les crises ultérieures du Burundi, en 1988 et en 1993."
