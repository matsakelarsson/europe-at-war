# French translations of the catalogue text (wave 9); step bodies follow later.
Russian occupation of Ili and the Ili crisis: Occupation russe de l’Ili et crise de l’Ili
? Russia’s ten-year occupation of the Ili valley in northern Xinjiang and the diplomatic crisis over its return. During the Dungan Revolt the Taranchi Muslims of Ili had set up a sultanate at Kulja (Yining). In 1871, fearing that Yakub Beg would take the valley and wanting to secure its trade and frontier, Russia sent troops under General Gerasim Kolpakovsky from Semirechye; after brief fighting they occupied Kulja on 4 July 1871 (22 June in the Julian calendar) and ended the sultanate, promising to hand the region back when the Qing could hold it. After Zuo Zongtang reconquered the rest of Xinjiang in 1877–1878, the Qing envoy Chonghou signed the Treaty of Livadia in 1879, which returned only part of the valley, ceded the Tekes valley and the passes to the south, and gave Russia large trade rights and 5 million roubles. Beijing refused to ratify it and sentenced Chonghou to death; for a time in 1880 war seemed near, with Russian warships sent to Chinese waters and Zuo moving his headquarters to Hami. Under the Treaty of Saint Petersburg, negotiated by Zeng Jize and signed on 24 February 1881, China recovered most of the valley, including the Tekes, for an indemnity of 9 million roubles, while Russia kept a strip in the west for the people who chose to move to Russia. Russian troops left in 1883, and many Taranchis and Dungans resettled in Semirechye.
: "L’occupation de la vallée de l’Ili, dans le nord du Xinjiang, par la Russie pendant dix ans, et la crise diplomatique suscitée par sa restitution. Pendant la révolte des Dounganes, les musulmans taranchis de l’Ili avaient établi un sultanat à Kouldja (Yining). En 1871, craignant que Yakub Beg ne s’empare de la vallée et voulant assurer son commerce et sa frontière, la Russie envoya depuis la Semiretchie des troupes commandées par le général Guerassim Kolpakovski ; après de brefs combats, elles occupèrent Kouldja le 4 juillet 1871 (22 juin dans le calendrier julien) et mirent fin au sultanat, en promettant de rendre la région lorsque les Qing seraient en mesure de la tenir. Après la reconquête du reste du Xinjiang par Zuo Zongtang en 1877–1878, l’envoyé Qing Chonghou signa en 1879 le traité de Livadia, qui ne restituait qu’une partie de la vallée, cédait la vallée de la Tekes et les cols situés au sud, et accordait à la Russie d’importants droits commerciaux et 5 millions de roubles. Pékin refusa de le ratifier et condamna Chonghou à mort ; pendant un temps, en 1880, la guerre parut proche : des navires de guerre russes furent envoyés dans les eaux chinoises et Zuo transféra son quartier général à Hami. Par le traité de Saint-Pétersbourg, négocié par Zeng Jize et signé le 24 février 1881, la Chine récupéra la plus grande partie de la vallée, y compris la Tekes, contre une indemnité de 9 millions de roubles, tandis que la Russie conservait une bande à l’ouest pour les habitants qui choisissaient de s’installer en Russie. Les troupes russes partirent en 1883, et de nombreux Taranchis et Dounganes s’établirent dans la Semiretchie."
