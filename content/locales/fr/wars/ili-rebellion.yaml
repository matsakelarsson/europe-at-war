# French translations of the catalogue text (wave 9); step bodies follow later.
Ili rebellion: Rébellion d’Ili
? A Soviet-backed revolt against Nationalist rule in northern Xinjiang that created the second East Turkestan Republic. On 7 November 1944 Uyghur, Kazakh and other rebels rose in Ghulja (Kulja), the main town of the Ili valley, and on 12 November proclaimed the East Turkestan Republic with the Uzbek scholar Elihan Tore as president. Its Ili National Army, with Soviet officers, arms and aircraft, took the Ili, Tarbagatai (Tacheng) and Altai districts, and in September 1945 reached the Manas River, little more than 100 km from Ürümqi, before Moscow called a halt. Soviet-mediated talks led in 1946 to a coalition provincial government, which broke down in 1947; the Three Districts governed themselves until 1949, while the Kazakh leader Ospan Batyr (Osman Batur) fought them for the Nationalists and clashed with Mongolian and Soviet forces at Beitashan. In 1949 the Ili leaders agreed to join the People’s Republic; five of them died in an air crash on the way to Beijing, and in December 1949 their army became part of the People’s Liberation Army.
: Une révolte soutenue par les Soviétiques contre le pouvoir nationaliste dans le nord du Xinjiang, qui donna naissance à la seconde République du Turkestan oriental. Le 7 novembre 1944, des rebelles ouïghours, kazakhs et d’autres peuples se soulevèrent à Ghulja (Kulja), la principale ville de la vallée de l’Ili, et proclamèrent le 12 novembre la République du Turkestan oriental, avec pour président le lettré ouzbek Elihan Tore. Son Armée nationale de l’Ili, dotée d’officiers, d’armes et d’avions soviétiques, prit les districts de l’Ili, du Tarbagatai (Tacheng) et de l’Altaï et atteignit en septembre 1945 la rivière Manas, à un peu plus de 100 km d’Ürümqi, avant que Moscou n’ordonne l’arrêt. Des pourparlers sous médiation soviétique aboutirent en 1946 à un gouvernement provincial de coalition, qui se disloqua en 1947 ; les Trois Districts se gouvernèrent eux-mêmes jusqu’en 1949, tandis que le chef kazakh Ospan Batyr (Osman Batur) les combattait pour le compte des nationalistes et affrontait les forces mongoles et soviétiques à Beitashan. En 1949, les dirigeants de l’Ili acceptèrent de rejoindre la République populaire ; cinq d’entre eux périrent dans un accident d’avion en route pour Pékin et, en décembre 1949, leur armée fut intégrée à l’Armée populaire de libération.
