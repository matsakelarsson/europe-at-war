Ilinden and Preobrazhenie: Ilinden et Préobrazhenie
August – October 1903: août – octobre 1903
The revolutionary organisation had been preparing a rising for Macedonian and Thracian autonomy for years, but in 1903 arrests and the death of its best-known leader, Gotse Delchev, in May weakened it. A congress at Smilevo set the date anyway. On the night of 2 August, Saint Elijah’s Day, bands rose across the Manastır vilayet, cutting telegraph lines and attacking Ottoman posts. Some 800 rebels under Nikola Karev and Pitu Guli took the town of Kruševo and set up a provisional government, the Kruševo Republic. Rebels also held Smilevo and villages around Kastoria and Florina, and on 19 August a second rising broke out in the Strandzha mountains.: L’organisation révolutionnaire préparait une montée de l’autonomie macédonienne et thracienne depuis des années, mais en 1903, les arrestations et la mort de son leader le plus connu, Gotse Delchev, l’affaiblissaient en mai. Un congrès à Smilevo fixa la date. Dans la nuit du 2 août, Saint Elijah, les groupes se sont levés sur le vilayet de Manastır, coupant des lignes télégraphiques et attaquant des postes ottomans. Quelque 800 rebelles sous Nikola Karev et Pitu Guli ont pris la ville de Kruševo et mis en place un gouvernement provisoire, la République de Kruševo. Les rebelles ont également tenu Smilevo et les villages autour de Kastoria et Florina, et le 19 août une deuxième montée a éclaté dans les montagnes de Strandzha.
The Ottoman government sent tens of thousands of soldiers, with irregular bashi-bazouks. Kruševo was retaken after ten days, and Pitu Guli fell defending the approaches at Mečkin Kamen. By October the rising had been crushed. By the organisation’s count about 200 villages were burned, more than 4,000 civilians killed and some 70,000 people left homeless, and thousands fled to Bulgaria. The outcry led Austria-Hungary and Russia to agree the Mürzsteg reform programme in October 1903, which put foreign officers in charge of a reformed gendarmerie in Macedonia.: Le gouvernement ottoman a envoyé des dizaines de milliers de soldats, avec des bashi-bazouks irréguliers. Kruševo a été repris après dix jours, et Pitu Guli est tombé en défendant les approches à Mečkin Kamen. En octobre la montée avait été écrasée. Par l’organisation environ 200 villages ont été brûlés, plus de 4 000 civils tués et quelque 70 000 personnes ont quitté sans abri, et des milliers ont fui vers la Bulgarie. Le tollé a conduit l’Autriche, la Hongrie et la Russie à approuver le programme de réforme de Mürzsteg en octobre 1903, qui place les officiers étrangers en charge d’une gendarmerie réformée en Macédoine.
