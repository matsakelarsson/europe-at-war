Ilinden–Preobrazhenie Uprising: Ilinden–Preobrazhenie Insurgissement
A rising against Ottoman rule in Macedonia and the Adrianople region, organised by the Internal Macedonian-Adrianople Revolutionary Organisation. It began on Saint Elijah’s Day (Ilinden), 2 August 1903, when rebels held Kruševo for ten days, spread to the Strandzha mountains on the Feast of the Transfiguration (Preobrazhenie), and was crushed by the autumn with the burning of some 200 villages; it led the powers to impose the Mürzsteg reforms on the Ottoman government.: Une montée contre la domination ottomane en Macédoine et dans la région d’Adrianople, organisée par l’organisation révolutionnaire interne Macédonienne-Adrianople. Elle a commencé le 2 août 1903 à la Saint-Elijah (Ilinden), lorsque les rebelles ont tenu Kruševo pendant dix jours, se sont étendus aux montagnes de Strandzha lors de la fête de la Transfiguration (Preobrazhenie), et a été écrasée par l’automne avec l’incendie de quelque 200 villages ; elle a conduit les pouvoirs à imposer les réformes Mürzsteg au gouvernement ottoman.
The organisation, founded in Thessaloniki in 1893, changed its name several times and is usually called IMRO or IMARO in English. Both Bulgaria and North Macedonia celebrate the uprising as part of their national history, and they disagree over the national identity of its leaders and fighters.: L’organisation, fondée à Thessalonique en 1893, a changé de nom plusieurs fois et est généralement appelée IMRO ou IMARO en anglais. La Bulgarie et la Macédoine du Nord célèbrent le soulèvement dans leur histoire nationale, et ils ne sont pas d’accord sur l’identité nationale de ses dirigeants et combattants.
The rising took place under the Julian calendar, by which Ilinden fell on 20 July and Preobrazhenie on 6 August; the dates here are New Style. Figures for villages burned and people killed come mainly from the organisation’s own reports and are approximate.: La montée a eu lieu sous le calendrier julien, par lequel Ilinden est tombé le 20 juillet et Preobrazhenie le 6 août ; les dates ici sont New Style. Les chiffres pour les villages brûlés et les personnes tuées viennent principalement de l’organisation propre rapports et sont approximatives.
