# French translations of the catalogue text (wave 10); step bodies follow later.
Japanese invasions of Korea (Imjin War): Invasions japonaises de la Corée (guerre d’Imjin)
Two invasions of Korea ordered by Toyotomi Hideyoshi, who had just unified Japan and meant to go on to conquer Ming China. In May 1592 about 160,000 men landed at Busan, took Hanseong (Seoul) within three weeks and Pyongyang in July, and pushed into the far north-east. At sea Yi Sun-sin’s fleet cut the Japanese supply route along the south coast, volunteer righteous armies rose behind the Japanese lines, and in February 1593 a Ming army retook Pyongyang. The Japanese fell back to forts on the south coast while Ming and Japanese envoys negotiated for three years. When the talks failed, Hideyoshi sent a second army in 1597; it destroyed the Korean fleet at Chilcheollyang and overran Jeolla, but was stopped short of Hanseong at Jiksan and at sea at Myeongnyang. After Hideyoshi’s death in September 1598 the Japanese withdrew, fighting a last sea battle at Noryang, where Yi Sun-sin was killed. Korea was devastated; estimates of the dead, soldiers and civilians, run to about a million.: Deux invasions de la Corée ordonnées par Toyotomi Hideyoshi, qui venait d’unifier le Japon et entendait poursuivre par la conquête de la Chine des Ming. En mai 1592, environ 160 000 hommes débarquèrent à Busan, prirent Hanseong (Séoul) en trois semaines et Pyongyang en juillet, et s’enfoncèrent jusqu’à l’extrême nord-est. En mer, la flotte de Yi Sun-sin coupa la route de ravitaillement japonaise le long de la côte sud, des armées vertueuses de volontaires se levèrent sur les arrières des lignes japonaises et, en février 1593, une armée Ming reprit Pyongyang. Les Japonais se replièrent dans des forts de la côte sud pendant que des envoyés Ming et japonais négociaient durant trois ans. Lorsque les pourparlers échouèrent, Hideyoshi envoya une seconde armée en 1597 ; elle anéantit la flotte coréenne à Chilcheollyang et submergea le Jeolla, mais fut arrêtée avant Hanseong, à Jiksan, et en mer à Myeongnyang. Après la mort de Hideyoshi en septembre 1598, les Japonais se retirèrent, livrant une dernière bataille navale à Noryang, où Yi Sun-sin fut tué. La Corée fut dévastée ; les estimations du nombre de morts, soldats et civils, atteignent environ un million.
