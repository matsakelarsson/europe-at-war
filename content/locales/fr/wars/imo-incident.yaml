# French translations of the catalogue text (wave 10); step bodies follow later.
Imo incident: Incident d’Imo
? A revolt of soldiers in Hanseong in 1882, the imo year of the sixty-year cycle. The soldiers of the old army units, who resented the favour shown to the new Special Skills Force trained by a Japanese officer, had gone unpaid for thirteen months; when they were finally given a month’s rice ration, it had been mixed with sand and husks. On 23 July 1882 they rioted, broke into the house of Min Gyeom-ho, the official in charge of their pay, seized weapons, freed prisoners and were joined by the poor of the city. Crowds killed the Japanese instructor Horimoto Reizō and attacked the Japanese legation; the minister Hanabusa Yoshitada and his staff burned it and fought their way to Incheon, losing several men, and escaped to sea, where a British survey ship picked them up. The next day the rioters entered the palace and killed Min Gyeom-ho and other officials. Queen Min escaped disguised as a court lady, and the king recalled his father, the Heungseon Daewongun, who had sympathised with the soldiers, to power. Japan sent troops and warships with Hanabusa, and the Qing sent about 4,500 troops under Wu Changqing, with Ma Jianzhong and Ding Ruchang. On 26 August the Chinese lured the Daewongun to their camp, arrested him and took him to China, where he was held for three years, and three days later Chinese troops attacked the soldiers’ quarters at Wangsimni and Itaewon. On 30 August Korea signed the Treaty of Chemulpo with Japan, agreeing to punish the culprits, pay an indemnity of 500,000 yen and let Japan station troops at its legation. Chinese troops stayed in Hanseong, and China reasserted its authority over Korea.
: Une révolte de soldats à Hanseong en 1882, année imo du cycle sexagésimal. Les soldats des anciennes unités de l’armée, qui supportaient mal la faveur accordée à la nouvelle Force des compétences spéciales, entraînée par un officier japonais, n’avaient pas été payés depuis treize mois ; lorsqu’on leur remit enfin un mois de ration de riz, celui-ci avait été mêlé de sable et de balle. Le 23 juillet 1882, ils déclenchèrent une émeute, forcèrent la maison de Min Gyeom-ho, le fonctionnaire chargé de leur solde, s’emparèrent d’armes, libérèrent des prisonniers et furent rejoints par les pauvres de la ville. La foule tua l’instructeur japonais Horimoto Reizō et attaqua la légation japonaise ; le ministre Hanabusa Yoshitada et son personnel l’incendièrent et se frayèrent un chemin jusqu’à Incheon, perdant plusieurs hommes, puis s’échappèrent en mer, où un navire hydrographique britannique les recueillit. Le lendemain, les émeutiers pénétrèrent dans le palais et tuèrent Min Gyeom-ho et d’autres fonctionnaires. La reine Min s’échappa déguisée en dame de cour, et le roi rappela au pouvoir son père, le Heungseon Daewongun, qui avait sympathisé avec les soldats. Le Japon envoya des troupes et des navires de guerre avec Hanabusa, et les Qing envoyèrent environ 4 500 hommes sous les ordres de Wu Changqing, avec Ma Jianzhong et Ding Ruchang. Le 26 août, les Chinois attirèrent le Daewongun dans leur camp, l’arrêtèrent et l’emmenèrent en Chine, où il fut détenu trois ans, et trois jours plus tard les troupes chinoises attaquèrent les quartiers des soldats à Wangsimni et à Itaewon. Le 30 août, la Corée signa avec le Japon le traité de Chemulpo, par lequel elle s’engageait à punir les coupables, à payer une indemnité de 500 000 yens et à laisser le Japon stationner des troupes à sa légation. Les troupes chinoises restèrent à Hanseong, et la Chine réaffirma son autorité sur la Corée.
