"Impresa di Fiume": "Impresa di Fiume"
"The seizure of the Adriatic port of Fiume (now Rijeka, Croatia) by the nationalist poet Gabriele D’Annunzio and some 2,500 mutinous Italian soldiers and volunteers in September 1919, to force its annexation to Italy while the peace conference was still deciding its fate. D’Annunzio ruled the city for over a year, proclaiming the Italian Regency of Carnaro in September 1920, and refused to accept the Treaty of Rapallo, by which Italy and Yugoslavia made Fiume a free state. In the “Bloody Christmas” of 24–29 December 1920 the Italian army and navy forced him out, at the cost of about 60 dead.": "La prise du port adriatique de Fiume (aujourd'hui Rijeka, Croatie) par le poète nationaliste Gabriele D. Annunzio et quelque 2 500 soldats et volontaires italiens mutineux en septembre 1919, pour forcer son annexion à l’Italie pendant que la conférence de paix décidait encore de son sort. D. Annunzio a dirigé la ville pendant plus d’un an, proclamant la Régence italienne de Carnaro en septembre 1920, et a refusé d’accepter le traité de Rapallo, par lequel l’Italie et la Yougoslavie ont fait Fiume un État libre."
"The regency’s style, with its balcony speeches, black shirts and mass rallies, was later copied by Mussolini’s Fascists. The Free State of Fiume was ended in 1924, when Italy annexed the city by agreement with Yugoslavia.": "Le style régence, avec ses discours de balcon, ses chemises noires et ses rassemblements de masse, fut ensuite copié par les fascistes Mussolini. L’État libre de Fiume a pris fin en 1924, lorsque l’Italie a annexé la ville par accord avec la Yougoslavie."
