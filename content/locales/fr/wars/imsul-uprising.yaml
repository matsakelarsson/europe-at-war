# French translations of the catalogue text (wave 10); step bodies follow later.
Imsul peasant uprisings: Soulèvements paysans d’Imsul
? A wave of peasant risings across southern Korea in 1862, the imsul year of the sixty-year cycle. Under the rule of the in-law Andong Kim clan the three main taxes, the land tax, the military cloth tax and the state grain loans, had become a means of extortion by magistrates and clerks, who added arbitrary levies and forced loans of grain at high interest. After a rising at Danseong on 4 March, peasants of Jinju led by Yu Gye-chun rose on 14 March against the extortions of the provincial army commander Baek Nak-sin. Wearing white headbands and armed with clubs, thousands of them entered the town on 18 March, humiliated the commander, killed several clerks and burned the houses of officials and rich landlords. The court sent Bak Gyu-su to investigate, but the unrest spread in the spring and summer to more than 70 towns in Gyeongsang, Jeolla and Chungcheong, among them Hamyang, Iksan, Gaeryeong, Hampyeong, Gongju and Hoedeok, and in the autumn to Jeju and Hamhung. Each rising was local, attacking the county office and dispersing within days. The government executed the leaders, punished corrupt officials, and set up an office to reform the three taxes, the Samjeong ijeongcheong, but abandoned its reforms within months.
: "Une vague de soulèvements paysans dans tout le sud de la Corée en 1862, l’année imsul du cycle sexagésimal. Sous la domination du clan Kim d’Andong, belle-famille des rois, les trois principaux impôts, l’impôt foncier, l’impôt militaire en toile et les prêts de grain de l’État, étaient devenus un moyen d’extorsion pour les magistrats et les commis, qui y ajoutaient des taxes arbitraires et imposaient des prêts forcés de grain à intérêt élevé. Après un soulèvement à Danseong le 4 mars, les paysans de Jinju, menés par Yu Gye-chun, se soulevèrent le 14 mars contre les extorsions du commandant de l’armée provinciale, Baek Nak-sin. Portant des bandeaux blancs et armés de gourdins, des milliers d’entre eux entrèrent dans la ville le 18 mars, humilièrent le commandant, tuèrent plusieurs commis et incendièrent les maisons de fonctionnaires et de riches propriétaires. La cour envoya Bak Gyu-su enquêter, mais les troubles s’étendirent au printemps et en été à plus de 70 villes du Gyeongsang, du Jeolla et du Chungcheong, parmi lesquelles Hamyang, Iksan, Gaeryeong, Hampyeong, Gongju et Hoedeok, et à l’automne à Jeju et à Hamhung. Chaque soulèvement restait local : il s’en prenait au bureau du district et se dispersait en quelques jours. Le gouvernement exécuta les meneurs, punit les fonctionnaires corrompus et créa un bureau chargé de réformer les trois impôts, le Samjeong ijeongcheong, mais abandonna ses réformes en quelques mois."
