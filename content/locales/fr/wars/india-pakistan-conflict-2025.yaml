# French translations of the catalogue text (wave 8); step bodies follow later.
India–Pakistan conflict of 2025: Conflit indo-pakistanais de 2025
? Four days of missile, drone and air strikes and artillery fire between India and Pakistan in May 2025, the most serious fighting between the two nuclear-armed states since 1971. On 22 April 2025 gunmen killed 26 people, nearly all of them Hindu tourists, at a meadow near Pahalgam in Indian-administered Kashmir. India blamed militants backed by Pakistan, suspended the Indus Waters Treaty and expelled Pakistani diplomats; Pakistan denied involvement and answered with measures of its own. On 7 May India struck nine sites in Pakistan and Pakistani-administered Kashmir that it called terrorist camps, in what it named Operation Sindoor; Pakistan said civilians and mosques had been hit and claimed to have shot down several Indian fighter jets. After days of shelling along the Line of Control and waves of drones, both sides struck each other’s air bases on 10 May, and that afternoon a ceasefire, first announced by US President Donald Trump, took effect. Officially, 21 civilians and 8 soldiers died on the Indian side and 40 civilians and 13 soldiers on the Pakistani side. Both countries claimed victory.
: Quatre jours de frappes de missiles, de drones et d’avions et de tirs d’artillerie entre l’Inde et le Pakistan en mai 2025, les combats les plus graves entre les deux puissances nucléaires depuis 1971. Le 22 avril 2025, des hommes armés tuèrent 26 personnes, presque toutes des touristes hindous, dans une prairie près de Pahalgam, au Cachemire sous administration indienne. L’Inde imputa l’attaque à des militants soutenus par le Pakistan, suspendit le traité des eaux de l’Indus et expulsa des diplomates pakistanais ; le Pakistan nia toute implication et répliqua par ses propres mesures. Le 7 mai, l’Inde frappa au Pakistan et au Cachemire sous administration pakistanaise neuf sites qu’elle qualifiait de camps terroristes, lors d’une opération baptisée Sindoor ; le Pakistan affirma que des civils et des mosquées avaient été touchés et déclara avoir abattu plusieurs avions de chasse indiens. Après plusieurs jours de tirs d’artillerie le long de la ligne de contrôle et des vagues de drones, les deux camps frappèrent les bases aériennes l’un de l’autre le 10 mai, et l’après-midi même un cessez-le-feu, annoncé en premier par le président américain Donald Trump, entra en vigueur. Selon les chiffres officiels, 21 civils et 8 soldats moururent du côté indien, et 40 civils et 13 soldats du côté pakistanais. Les deux pays revendiquèrent la victoire.
