# French translations of the catalogue text (wave 8); step bodies follow later.
India–Pakistan crisis of 2019: Crise indo-pakistanaise de 2019
? A brief military crisis between India and Pakistan, the first in which the two nuclear-armed states carried out air strikes on each other’s territory since 1971. On 14 February 2019 a young Kashmiri suicide bomber drove a car full of explosives into a convoy of the Central Reserve Police Force at Lethpora near Pulwama, killing 40 policemen; Jaish-e-Mohammed (JeM), a group based in Pakistan, claimed the attack. India blamed Pakistan, which denied involvement. On 26 February Indian Mirage 2000 jets bombed a site near Balakot in Khyber Pakhtunkhwa that India said was a large JeM training camp, claiming many militants killed; Pakistan said the bombs fell on empty forest, and satellite images examined by independent analysts showed the buildings still standing. The next day Pakistani aircraft struck open ground near Indian military sites in Jammu and Kashmir, and in the air battle that followed an Indian MiG-21 was shot down and its pilot, Wing Commander Abhinandan Varthaman, captured. India said he had shot down a Pakistani F-16, which Pakistan denied. The same day an Indian Mi-17 helicopter was brought down by an Indian missile over Budgam, killing six airmen and a civilian on the ground. Pakistan released the pilot on 1 March, and the crisis eased, although shelling across the Line of Control went on for weeks.
: Une brève crise militaire entre l’Inde et le Pakistan, la première depuis 1971 au cours de laquelle les deux puissances nucléaires menèrent des frappes aériennes sur le territoire l’une de l’autre. Le 14 février 2019, un jeune kamikaze cachemiri lança une voiture chargée d’explosifs contre un convoi de la Central Reserve Police Force à Lethpora, près de Pulwama, tuant 40 policiers ; le Jaish-e-Mohammed (JeM), un groupe basé au Pakistan, revendiqua l’attentat. L’Inde en rendit le Pakistan responsable, ce que celui-ci nia. Le 26 février, des Mirage 2000 indiens bombardèrent près de Balakot, dans le Khyber Pakhtunkhwa, un site que l’Inde présentait comme un grand camp d’entraînement du JeM, et elle affirma avoir tué de nombreux militants ; le Pakistan déclara que les bombes étaient tombées sur une forêt déserte, et des images satellites examinées par des analystes indépendants montraient les bâtiments toujours debout. Le lendemain, des avions pakistanais frappèrent des terrains découverts près de sites militaires indiens au Jammu-et-Cachemire, et lors du combat aérien qui suivit, un MiG-21 indien fut abattu et son pilote, le lieutenant-colonel Abhinandan Varthaman, capturé. L’Inde affirma qu’il avait abattu un F-16 pakistanais, ce que le Pakistan démentit. Le même jour, un hélicoptère indien Mi-17 fut abattu par un missile indien au-dessus de Budgam, ce qui tua six aviateurs et un civil au sol. Le Pakistan libéra le pilote le 1er mars et la crise s’apaisa, même si les tirs d’artillerie de part et d’autre de la ligne de contrôle se poursuivirent pendant des semaines.
