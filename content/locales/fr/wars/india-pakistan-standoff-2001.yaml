# French translations of the catalogue text (wave 8); step bodies follow later.
India–Pakistan standoff of 2001–2002: Confrontation indo-pakistanaise de 2001–2002
? The largest military confrontation between India and Pakistan since 1971, in which up to a million soldiers faced each other along the border and the Line of Control for ten months. On 13 December 2001 five gunmen attacked the Indian Parliament in New Delhi, killing nine people, most of them security staff, before they were killed. India blamed Lashkar-e-Taiba and Jaish-e-Mohammed, militant groups based in Pakistan, and demanded that Pakistan hand over suspects and shut them down; Pakistan condemned the attack and denied any role. India launched Operation Parakram, its largest mobilisation since 1971, moving some 500,000 troops to the border, and Pakistan answered in kind. Under American and British pressure, President Pervez Musharraf banned the two groups in January 2002, but the tension peaked again after gunmen killed 31 people, most of them soldiers’ wives and children, at an army camp at Kaluchak near Jammu on 14 May 2002. Fears of a war that could turn nuclear led many foreigners to leave both countries, until Pakistan promised to stop militants crossing into Indian-administered Kashmir and tensions eased in June. There was artillery fire across the Line of Control, but no war; India announced the end of its mobilisation on 16 October 2002. India said 798 of its soldiers died during the deployment, most in accidents and mine-laying.
: La plus grande confrontation militaire entre l’Inde et le Pakistan depuis 1971, au cours de laquelle jusqu’à un million de soldats se firent face pendant dix mois le long de la frontière et de la ligne de contrôle. Le 13 décembre 2001, cinq hommes armés attaquèrent le Parlement indien à New Delhi et tuèrent neuf personnes, pour la plupart des agents de sécurité, avant d’être eux-mêmes abattus. L’Inde accusa le Lashkar-e-Taiba et le Jaish-e-Mohammed, des groupes militants basés au Pakistan, et exigea que le Pakistan livre des suspects et démantèle ces groupes ; le Pakistan condamna l’attentat et nia y avoir joué le moindre rôle. L’Inde lança l’opération Parakram, sa plus grande mobilisation depuis 1971, en déployant quelque 500 000 soldats à la frontière, et le Pakistan fit de même. Sous la pression américaine et britannique, le président Pervez Musharraf interdit les deux groupes en janvier 2002, mais la tension atteignit un nouveau sommet après que des hommes armés eurent tué 31 personnes, pour la plupart des épouses et des enfants de soldats, dans un camp militaire à Kaluchak, près de Jammu, le 14 mai 2002. La crainte d’une guerre qui pourrait devenir nucléaire poussa de nombreux étrangers à quitter les deux pays, jusqu’à ce que le Pakistan promette d’empêcher les militants de passer au Cachemire sous administration indienne et que les tensions retombent en juin. Il y eut des tirs d’artillerie de part et d’autre de la ligne de contrôle, mais pas de guerre ; l’Inde annonça la fin de sa mobilisation le 16 octobre 2002. Selon l’Inde, 798 de ses soldats moururent pendant le déploiement, pour la plupart dans des accidents et lors de la pose de mines.
