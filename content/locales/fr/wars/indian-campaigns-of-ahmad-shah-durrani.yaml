# French translations of the catalogue text (wave 8); step bodies follow later.
Indian campaigns of Ahmad Shah Durrani: Campagnes indiennes d’Ahmad Shah Durrani
The invasions of northern India by Ahmad Shah Durrani, the Afghan commander of Nader Shah who made himself king at Kandahar in 1747 and founded the Durrani Empire. Beaten back by a Mughal army at Manupur in 1748, he returned again and again, took the Punjab, Multan and Kashmir from the Mughal Empire by 1752, and in 1757 sacked Delhi, Mathura and Vrindavan. When the Marathas, now the strongest power in India, drove his son out of the Punjab in 1758, he came back, and on 14 January 1761, at the Third Battle of Panipat, his Afghan army and its Rohilla and Awadh allies destroyed the main Maratha army in one of the largest and bloodiest battles of the century. He could not hold the Punjab, however. The Sikh misls fought on through repeated defeats, including the massacre of 1762, took Lahore in 1765 and held the country between the Indus and the Yamuna after his last campaigns.: Les invasions de l’Inde du Nord par Ahmad Shah Durrani, le commandant afghan de Nader Shah qui se proclama roi à Kandahar en 1747 et fonda l’Empire durrani. Repoussé par une armée moghole à Manupur en 1748, il revint à maintes reprises, enleva le Pendjab, Multan et le Cachemire à l’Empire moghol dès 1752 et, en 1757, pilla Delhi, Mathura et Vrindavan. Lorsque les Marathes, devenus la première puissance de l’Inde, chassèrent son fils du Pendjab en 1758, il revint, et le 14 janvier 1761, à la troisième bataille de Panipat, son armée afghane et ses alliés rohillas et de l’Awadh anéantirent la principale armée marathe, dans l’une des batailles les plus grandes et les plus sanglantes du siècle. Il ne put cependant conserver le Pendjab. Les misls sikhs poursuivirent la lutte malgré des défaites répétées, dont le massacre de 1762, prirent Lahore en 1765 et tinrent le pays entre l’Indus et la Yamuna après ses dernières campagnes.
