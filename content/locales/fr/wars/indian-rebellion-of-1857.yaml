# French translations of the catalogue text (wave 8); step bodies follow later.
Indian Rebellion of 1857: Rébellion indienne de 1857
The largest armed challenge to British rule in India in the 19th century, also called the Indian Mutiny, the Sepoy Mutiny, the Great Rebellion and the First War of Independence. It began on 10 May 1857 when Indian soldiers (sepoys) of the East India Company’s Bengal Army rose at Meerut and marched to Delhi, where they proclaimed the aged Mughal emperor Bahadur Shah II their leader. Most of the Bengal Army and much of the population of the upper Ganges plain, Awadh, Rohilkhand and Bundelkhand joined them. The Company held Calcutta, Bombay, Madras and the Punjab, retook Delhi in September 1857 after a three-month siege, and recovered Cawnpore, Lucknow and central India by mid-1858. Both sides killed prisoners and civilians, and British reprisals were heavy. In 1858 the British Crown took over the government of India from the Company.: Le plus grand défi armé lancé à la domination britannique en Inde au XIXe siècle, appelé aussi mutinerie indienne, révolte des cipayes, Grande Rébellion ou première guerre d’indépendance. Il commença le 10 mai 1857, lorsque des soldats indiens (cipayes) de l’armée du Bengale de la Compagnie des Indes orientales se soulevèrent à Meerut et marchèrent sur Delhi, où ils proclamèrent leur chef le vieil empereur moghol Bahadur Shah II. La plus grande partie de l’armée du Bengale et une bonne part de la population de la haute plaine du Gange, de l’Awadh, du Rohilkhand et du Bundelkhand se joignirent à eux. La Compagnie conserva Calcutta, Bombay, Madras et le Pendjab, reprit Delhi en septembre 1857 après un siège de trois mois et reconquit Cawnpore, Lucknow et l’Inde centrale vers le milieu de l’année 1858. Les deux camps tuèrent des prisonniers et des civils, et les représailles britanniques furent lourdes. En 1858, la Couronne britannique reprit à la Compagnie le gouvernement de l’Inde.
