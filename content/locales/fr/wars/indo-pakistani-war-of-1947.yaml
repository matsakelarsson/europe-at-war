# French translations of the catalogue text (wave 8); step bodies follow later.
Indo-Pakistani War of 1947–1948: Guerre indo-pakistanaise de 1947–1948
The first war between India and Pakistan, also called the First Kashmir War, fought over the princely state of Jammu and Kashmir after the partition of British India. A revolt in Poonch, communal massacres in Jammu and an invasion by Pashtun tribal forces from Pakistan in October 1947 led the Maharaja, Hari Singh, to accede to India, which flew troops into Srinagar. Pakistan disputed the accession, its officers directed the irregular forces and from May 1948 its regular army fought in Kashmir. In the north the Gilgit Scouts rose and joined Pakistan. A UN-arranged ceasefire on 1 January 1949 left India holding about two-thirds of the state, including the Kashmir valley, Jammu and Ladakh, and Pakistan about one-third, Azad Kashmir and Gilgit-Baltistan. The plebiscite both sides accepted in principle was never held, and the ceasefire line, now the Line of Control, still divides Kashmir.: La première guerre entre l’Inde et le Pakistan, appelée aussi première guerre du Cachemire, livrée pour l’État princier de Jammu-et-Cachemire après la partition de l’Inde britannique. Une révolte dans le Poonch, des massacres intercommunautaires au Jammu et l’invasion de forces tribales pachtounes venues du Pakistan en octobre 1947 conduisirent le maharaja, Hari Singh, à signer l’adhésion de son État à l’Inde, qui envoya des troupes par avion à Srinagar. Le Pakistan contesta cette adhésion ; ses officiers dirigèrent les forces irrégulières et, à partir de mai 1948, son armée régulière combattit au Cachemire. Dans le nord, les Gilgit Scouts se soulevèrent et se rallièrent au Pakistan. Un cessez-le-feu obtenu par l’ONU, le 1er janvier 1949, laissa à l’Inde environ les deux tiers de l’État, dont la vallée du Cachemire, le Jammu et le Ladakh, et au Pakistan environ un tiers, l’Azad Cachemire et le Gilgit-Baltistan. Le plébiscite accepté en principe par les deux parties n’eut jamais lieu, et la ligne de cessez-le-feu, devenue la ligne de contrôle, divise toujours le Cachemire.
