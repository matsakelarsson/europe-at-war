# French translations of the catalogue text (wave 8); step bodies follow later.
Indo-Pakistani War of 1965: Guerre indo-pakistanaise de 1965
The second war between India and Pakistan over Kashmir, also called the Second Kashmir War. After clashes in the Rann of Kutch in the spring, Pakistan sent several thousand irregulars across the ceasefire line in August 1965 (Operation Gibraltar) in the hope of a rising in Indian-held Kashmir, which did not come. India crossed the line and took the Haji Pir pass, and Pakistan attacked in the Chhamb sector towards Akhnoor. On 6 September India opened a front across the international border towards Lahore and then Sialkot, and great tank battles were fought at Asal Uttar and Chawinda. A UN-demanded ceasefire took effect on 23 September with neither side decisively ahead, and in the Tashkent Declaration of January 1966 both agreed to return to their pre-war positions. Each country still marks the war as a success.: La deuxième guerre entre l’Inde et le Pakistan pour le Cachemire, appelée aussi deuxième guerre du Cachemire. Après des affrontements dans le Rann de Kutch au printemps, le Pakistan envoya en août 1965 plusieurs milliers d’irréguliers au-delà de la ligne de cessez-le-feu (opération Gibraltar), dans l’espoir d’un soulèvement au Cachemire tenu par l’Inde, qui ne se produisit pas. L’Inde franchit la ligne et prit le col de Haji Pir, et le Pakistan attaqua dans le secteur de Chhamb en direction d’Akhnoor. Le 6 septembre, l’Inde ouvrit un front par-delà la frontière internationale en direction de Lahore, puis de Sialkot, et de grandes batailles de chars se livrèrent à Asal Uttar et à Chawinda. Un cessez-le-feu exigé par l’ONU entra en vigueur le 23 septembre sans qu’aucun des deux camps eût pris un avantage décisif, et par la déclaration de Tachkent de janvier 1966, les deux pays convinrent de revenir à leurs positions d’avant-guerre. Chacun d’eux présente encore cette guerre comme un succès.
