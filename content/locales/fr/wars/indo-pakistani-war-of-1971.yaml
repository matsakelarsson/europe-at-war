# French translations of the catalogue text (wave 8); step bodies follow later.
Indo-Pakistani War of 1971: Guerre indo-pakistanaise de 1971
"The third war between India and Pakistan, fought on both of Pakistan’s fronts from 3 to 17 December 1971. It grew out of the Bangladesh Liberation War: after months of Indian support for the Bengali guerrillas, Pakistan struck Indian air bases on 3 December, and India declared war. In the east Indian forces and the Mukti Bahini reached Dhaka in thirteen days, and Pakistan’s Eastern Command surrendered on 16 December; that campaign is told in the Bangladesh Liberation War. In the west the armies fought in Kashmir, the Punjab and the Rajasthan desert, with battles at Chhamb, Longewala and Basantar, and the Indian navy attacked Karachi with missile boats. India declared a ceasefire in the west on 17 December. About 93,000 Pakistani prisoners were taken, and the Simla Agreement of 1972 turned the ceasefire line in Kashmir into the Line of Control.": "La troisième guerre entre l’Inde et le Pakistan, livrée sur les deux fronts du Pakistan du 3 au 17 décembre 1971. Elle naquit de la guerre de libération du Bangladesh : après des mois de soutien indien aux guérilleros bengalis, le Pakistan frappa des bases aériennes indiennes le 3 décembre, et l’Inde déclara la guerre. À l’est, les forces indiennes et la Mukti Bahini atteignirent Dacca en treize jours, et le commandement oriental du Pakistan capitula le 16 décembre ; cette campagne est racontée dans la guerre de libération du Bangladesh. À l’ouest, les armées s’affrontèrent au Cachemire, au Pendjab et dans le désert du Rajasthan, avec des batailles à Chhamb, à Longewala et à Basantar, et la marine indienne attaqua Karachi avec des vedettes lance-missiles. L’Inde proclama un cessez-le-feu à l’ouest le 17 décembre. Environ 93 000 Pakistanais furent faits prisonniers, et l’accord de Simla de 1972 fit de la ligne de cessez-le-feu au Cachemire la ligne de contrôle."
