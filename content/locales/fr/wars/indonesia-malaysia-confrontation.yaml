# French translations of the catalogue text (wave 11); step bodies follow later.
Indonesia–Malaysia confrontation: Confrontation indonésio-malaisienne
? "The undeclared war Indonesia waged against the creation of Malaysia, known in Indonesia and Malaysia as Konfrontasi. Sukarno denounced the federation of Malaya, Singapore, Sarawak and North Borneo (Sabah) planned by Malaya and Britain as a British neo-colonial scheme, backed the Brunei revolt of December 1962 and on 20 January 1963 announced a policy of confrontation. From April 1963 Indonesian volunteers and then regular troops raided across the jungle border in Borneo, and after Malaysia was proclaimed on 16 September 1963 Sukarno vowed to “crush Malaysia”. British, Gurkha, Malaysian, Australian and New Zealand troops held the border and from 1964 struck back with secret raids into Indonesian Kalimantan; Indonesian landings and parachute drops on the Malay Peninsula in 1964 failed, and bombings in Singapore killed civilians. After the army under General Suharto took power in Indonesia in 1965–1966, it made peace: an agreement signed in Jakarta on 11 August 1966 ended the conflict, and Indonesia recognised Malaysia. British, Australian, New Zealand and Singaporean losses were about 180 killed, besides Malaysian losses; Indonesian dead are estimated at 590 to over 2,000, and 36 civilians were killed."
: "La guerre non déclarée que l’Indonésie mena contre la création de la Malaisie, connue en Indonésie et en Malaisie sous le nom de Konfrontasi. Sukarno dénonça la fédération réunissant la Malaya, Singapour, le Sarawak et le Bornéo du Nord (Sabah), que préparaient la Malaya et la Grande-Bretagne, comme une manœuvre néocoloniale britannique, soutint la révolte de Brunei de décembre 1962 et annonça le 20 janvier 1963 une politique de confrontation. À partir d’avril 1963, des volontaires indonésiens, puis des troupes régulières, lancèrent des raids de l’autre côté de la frontière, à travers la jungle de Bornéo, et après la proclamation de la Malaisie, le 16 septembre 1963, Sukarno jura d’« écraser la Malaisie ». Les troupes britanniques, gurkhas, malaisiennes, australiennes et néo-zélandaises tinrent la frontière et, à partir de 1964, ripostèrent par des raids secrets au Kalimantan indonésien ; les débarquements et parachutages indonésiens sur la péninsule Malaise en 1964 échouèrent, et des attentats à la bombe à Singapour tuèrent des civils. Après la prise du pouvoir en Indonésie par l’armée du général Suharto en 1965–1966, celle-ci fit la paix : un accord signé à Jakarta le 11 août 1966 mit fin au conflit, et l’Indonésie reconnut la Malaisie. Les pertes britanniques, australiennes, néo-zélandaises et singapouriennes s’élevèrent à environ 180 tués, sans compter les pertes malaisiennes ; les morts indonésiens sont estimés entre 590 et plus de 2 000, et 36 civils furent tués."
