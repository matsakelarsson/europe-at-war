# French translations of the catalogue text (wave 11); step bodies follow later.
Indonesian invasion and occupation of East Timor: Invasion et occupation du Timor oriental par l’Indonésie
? "Indonesia’s invasion of the Portuguese colony of East Timor in December 1975 and its occupation of the territory until 1999. After the Carnation Revolution in Portugal in 1974, East Timorese parties formed to decide the colony’s future; a short civil war in August 1975 left Fretilin, the party of independence, in control, and on 28 November it declared the Democratic Republic of East Timor. Indonesia, which feared a left-wing state in its midst and had already sent troops across the border, invaded on 7 December 1975, a day after President Gerald Ford and Henry Kissinger had visited Jakarta, and in July 1976 annexed the territory as its 27th province. The United Nations never recognised the annexation. Fretilin’s army, Falintil, fought on in the mountains; the Indonesian campaigns of 1977–1979 destroyed its bases and drove hundreds of thousands of people into camps, where many died of famine and disease. A truth commission later counted at least 102,800 conflict-related deaths between 1974 and 1999, out of a population of about 650,000 in 1975, most of them from hunger and illness. The killing of protesters at the Santa Cruz cemetery in Dili in 1991 drew the world’s attention, and after the fall of Suharto Indonesia agreed to a vote: on 30 August 1999, 78.5 per cent of voters chose independence. Militias organised by the Indonesian army then killed some 1,400 people, forced more than 200,000 into West Timor and burned much of the country, until an Australian-led international force (INTERFET) landed on 20 September. Indonesia gave up its claim in October 1999, and after two years of UN administration East Timor became independent as Timor-Leste on 20 May 2002."
: "L’invasion par l’Indonésie de la colonie portugaise du Timor oriental en décembre 1975 et son occupation du territoire jusqu’en 1999. Après la révolution des Œillets au Portugal en 1974, des partis est-timorais se formèrent pour décider de l’avenir de la colonie ; une brève guerre civile, en août 1975, laissa le contrôle au Fretilin, le parti de l’indépendance, qui proclama le 28 novembre la République démocratique du Timor oriental. L’Indonésie, qui craignait de voir un État de gauche s’établir en son sein et avait déjà envoyé des troupes de l’autre côté de la frontière, envahit le territoire le 7 décembre 1975, au lendemain d’une visite du président Gerald Ford et de Henry Kissinger à Jakarta, et l’annexa en juillet 1976 comme sa 27e province. Les Nations unies ne reconnurent jamais l’annexion. L’armée du Fretilin, les Falintil, poursuivit le combat dans les montagnes ; les campagnes indonésiennes de 1977–1979 détruisirent ses bases et chassèrent des centaines de milliers de personnes dans des camps, où beaucoup moururent de faim et de maladie. Une commission vérité dénombra plus tard au moins 102 800 morts liées au conflit entre 1974 et 1999, pour une population d’environ 650 000 habitants en 1975, la plupart dues à la faim et à la maladie. Le meurtre de manifestants au cimetière de Santa Cruz, à Dili, en 1991 attira l’attention du monde, et après la chute de Suharto l’Indonésie accepta un scrutin : le 30 août 1999, 78,5 % des votants choisirent l’indépendance. Des milices organisées par l’armée indonésienne tuèrent alors quelque 1 400 personnes, forcèrent plus de 200 000 autres à partir pour le Timor occidental et incendièrent une grande partie du pays, jusqu’au débarquement, le 20 septembre, d’une force internationale dirigée par l’Australie (INTERFET). L’Indonésie renonça à sa revendication en octobre 1999, et après deux ans d’administration de l’ONU, le Timor oriental devint indépendant sous le nom de Timor-Leste le 20 mai 2002."
