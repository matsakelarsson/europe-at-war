# French translations of the catalogue text (wave 11); step bodies follow later.
30 September Movement and the Indonesian mass killings: Mouvement du 30 Septembre et massacres de masse en Indonésie
? The failed coup of the 30 September Movement and the mass killings of communists and suspected communists that followed in Indonesia. In the early hours of 1 October 1965 a group of army officers calling itself the 30 September Movement kidnapped and killed six generals of the army high command in Jakarta and announced that it had taken power to protect President Sukarno. Major General Suharto crushed it within a day, and the army blamed the Communist Party of Indonesia (PKI), then the largest communist party outside the communist states. From October 1965 to early 1966 the army, together with civilian militias, Muslim and nationalist youth groups and local vigilantes, killed members and alleged supporters of the PKI and its affiliated unions and peasant, women’s and youth organisations across Java, Bali, Sumatra and other islands. Estimates of the dead range from about 78,500, the official figure of early 1966, to 3 million; most historians accept 500,000 to 1 million. Some 1 to 1.5 million people were imprisoned at one time or another, many for years without trial. The killings destroyed the PKI, which was banned on 12 March 1966, the day after Sukarno signed over much of his authority to Suharto, who went on to rule Indonesia as president until 1998.
: Le coup d’État manqué du Mouvement du 30 Septembre et les massacres de masse de communistes et de communistes présumés qui suivirent en Indonésie. Aux premières heures du 1er octobre 1965, un groupe d’officiers de l’armée se faisant appeler Mouvement du 30 Septembre enleva et tua six généraux du haut commandement de l’armée à Jakarta et annonça avoir pris le pouvoir pour protéger le président Sukarno. Le général de division Suharto l’écrasa en une journée, et l’armée en rejeta la responsabilité sur le Parti communiste indonésien (PKI), alors le plus grand parti communiste en dehors des États communistes. D’octobre 1965 au début de 1966, l’armée, avec des milices civiles, des groupes de jeunes musulmans et nationalistes et des groupes d’autodéfense locaux, tua des membres et des partisans présumés du PKI et des syndicats et organisations paysannes, féminines et de jeunesse qui lui étaient affiliés, à Java, à Bali, à Sumatra et dans d’autres îles. Les estimations des morts vont d’environ 78 500, le chiffre officiel du début de 1966, à 3 millions ; la plupart des historiens retiennent de 500 000 à 1 million. Quelque 1 à 1,5 million de personnes furent emprisonnées à un moment ou à un autre, beaucoup pendant des années sans procès. Les massacres anéantirent le PKI, qui fut interdit le 12 mars 1966, au lendemain du jour où Sukarno céda une grande partie de son autorité à Suharto, qui allait ensuite gouverner l’Indonésie comme président jusqu’en 1998.
