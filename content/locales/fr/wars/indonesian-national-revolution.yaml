# French translations of the catalogue text (wave 11); step bodies follow later.
Indonesian National Revolution: Révolution nationale indonésienne
? The war and the negotiations through which Indonesia won its independence from the Netherlands. Two days after Japan’s surrender, on 17 August 1945, Sukarno and Mohammad Hatta proclaimed the Republic of Indonesia in Jakarta. British and Indian troops landed from late September to take the Japanese surrender, and the Dutch returned with them; in the months that followed, armed youth groups killed thousands of Dutch, Eurasian, Chinese and other civilians in the violence known as the bersiap, and the British fought a three-week battle for Surabaya. After the British left in 1946 the Dutch, who had recognised the Republic’s authority over Java, Madura and Sumatra in the Linggadjati Agreement, launched two great offensives, which they called “police actions”, in July 1947 and December 1948; the second took the Republican capital, Yogyakarta, and its leaders. In between, the Republic put down a communist rising at Madiun. A guerrilla war, the pressure of the United Nations and the United States, and the failure of the Dutch to build a federation without the Republic led to the Round Table Conference in The Hague, and on 27 December 1949 the Netherlands transferred sovereignty over the Indies, except western New Guinea, to the Republic of the United States of Indonesia. About 100,000 Indonesians died, along with some 5,000 Dutch soldiers and several thousand Dutch-side civilians.
: La guerre et les négociations par lesquelles l’Indonésie obtint son indépendance des Pays-Bas. Deux jours après la capitulation du Japon, le 17 août 1945, Sukarno et Mohammad Hatta proclamèrent la République d’Indonésie à Jakarta. Des troupes britanniques et indiennes débarquèrent à partir de la fin septembre pour recevoir la reddition japonaise, et les Néerlandais revinrent avec elles ; dans les mois qui suivirent, des groupes armés de jeunes tuèrent des milliers de civils néerlandais, eurasiens, chinois et autres lors des violences connues sous le nom de bersiap, et les Britanniques livrèrent une bataille de trois semaines pour Surabaya. Après le départ des Britanniques en 1946, les Néerlandais, qui avaient reconnu l’autorité de la République sur Java, Madura et Sumatra par l’accord de Linggadjati, lancèrent deux grandes offensives, qu’ils appelèrent « actions de police », en juillet 1947 et en décembre 1948 ; la seconde s’empara de la capitale républicaine, Yogyakarta, et de ses dirigeants. Entre-temps, la République réprima un soulèvement communiste à Madiun. La guérilla, la pression des Nations unies et des États-Unis et l’échec des Néerlandais à bâtir une fédération sans la République conduisirent à la conférence de la Table ronde à La Haye, et le 27 décembre 1949 les Pays-Bas transférèrent la souveraineté sur les Indes, à l’exception de la Nouvelle-Guinée occidentale, à la République des États-Unis d’Indonésie. Environ 100 000 Indonésiens périrent, ainsi que quelque 5 000 soldats néerlandais et plusieurs milliers de civils du côté néerlandais.
