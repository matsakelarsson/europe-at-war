"In Russia’s Time of Troubles Sweden first sent troops to help Tsar Vasily Shuisky against Poland, then, after the defeat at Klushino, turned on Russia and occupied Novgorod. The Treaty of Stolbovo in 1617 gave Sweden Ingria and Kexholm and cut Russia off from the Baltic.": "En Russie Temps des troubles La Suède a d’abord envoyé des troupes pour aider le tsar Vasily Shuisky contre la Pologne, puis, après la défaite à Klushino, tourné sur la Russie et occupé Novgorod. Le traité de Stolbovo en 1617 a donné la Suède Ingria et Kexholm et couper la Russie de la Baltique."
