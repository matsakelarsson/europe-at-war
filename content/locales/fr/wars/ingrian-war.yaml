"In Russia’s Time of Troubles, Tsar Vasily Shuisky called in Swedish help against a Polish-backed pretender. In 1609 Jacob De la Gardie’s corps of Swedish and foreign mercenaries joined Prince Skopin-Shuisky’s Russian army and helped relieve Moscow. But on 4 July 1610 the Poles crushed the combined army at Klushino, between Moscow and Smolensk, and the unpaid mercenaries gave up.": "En Russie, le temps des troubles, le tsar Vasily Shuisky a appelé l’aide suédoise contre un prétendant soutenu par la Pologne. En 1609 Jacob De la Garde, les corps de mercenaires suédois et étrangers ont rejoint l’armée russe du prince Skopin-Shuisky et aidé à soulager Moscou. Mais le 4 juillet 1610, les Polonais ont écrasé l’armée combinée à Klushino, entre Moscou et Smolensk, et les mercenaires non rémunérés ont renoncé."
"Sweden then turned on Russia. De la Gardie stormed Novgorod on 16 July 1611, and the occupied city even talked of a Swedish prince as tsar. In 1615 the young Gustav II Adolf besieged Pskov but could not take it. At Stolbovo on 27 February 1617 Russia gave Sweden Ingria and Kexholm, cutting itself off from the Baltic, and got Novgorod back.": "La Suède se retourne alors contre la Russie. De la Gardie prend Novgorod d’assaut le 16 juillet 1611. Dans la ville occupée, on envisage même de donner à la Russie un tsar issu de la famille royale suédoise. En 1615, le jeune Gustave II Adolphe assiège Pskov sans pouvoir la prendre. Le 27 février 1617, à Stolbovo, la Russie cède l’Ingrie et Kexholm à la Suède, perd son accès à la Baltique et récupère Novgorod."
