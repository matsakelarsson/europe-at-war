# French translations of the catalogue text (wave 8); step bodies follow later.
Insurgency in Balochistan: Insurrection au Baloutchistan
? The armed struggle of Baloch nationalists against the Pakistani state in Balochistan, Pakistan’s largest and poorest province, rich in gas and minerals. It began with a revolt against the accession of the Khanate of Kalat in 1948 and flared in risings in 1958–1959, 1963–1969 and 1973–1977, the last a full-scale war in which the army, helped by Iran, fought tens of thousands of tribal guerrillas. The current insurgency began in the early 2000s, led by the Balochistan Liberation Army (BLA) and the Balochistan Liberation Front (BLF), and gained force after the army killed the tribal leader Akbar Bugti in 2006. The insurgents attack soldiers, police, settlers from other provinces and Chinese-funded projects; the security forces are accused of thousands of enforced disappearances. Pakistan accuses India of backing the insurgents, which India denies. Since 2024 the attacks have grown larger, with the hijacking of a passenger train in 2025 and coordinated offensives across the province. Last updated 27 November 2026.
: "La lutte armée des nationalistes baloutches contre l’État pakistanais au Baloutchistan, la province la plus vaste et la plus pauvre du Pakistan, riche en gaz et en minerais. Elle commença par une révolte contre le rattachement du khanat de Kalat en 1948 et se ranima lors des soulèvements de 1958–1959, de 1963–1969 et de 1973–1977, le dernier étant une véritable guerre au cours de laquelle l’armée, aidée par l’Iran, combattit des dizaines de milliers de guérilleros tribaux. L’insurrection actuelle commença au début des années 2000, menée par l’Armée de libération du Baloutchistan (BLA) et le Front de libération du Baloutchistan (BLF), et se renforça après que l’armée eut tué le chef tribal Akbar Bugti en 2006. Les insurgés attaquent des soldats, des policiers, des colons venus d’autres provinces et des projets financés par la Chine ; les forces de sécurité sont accusées de milliers de disparitions forcées. Le Pakistan accuse l’Inde de soutenir les insurgés, ce que l’Inde dément. Depuis 2024, les attaques ont gagné en ampleur, avec le détournement d’un train de voyageurs en 2025 et des offensives coordonnées dans toute la province. Dernière mise à jour : 27 novembre 2026."
