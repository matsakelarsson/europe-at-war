# French translations of the catalogue text (wave 13); step bodies follow later.
Insurgency in Cabo Delgado: Insurrection au Cabo Delgado
? The Islamist insurgency in Mozambique’s northernmost province, Cabo Delgado, waged since October 2017 by the group known locally as al-Shabaab (unrelated to the Somali movement) or Ansar al-Sunna, which has fought since 2019 under the banner of the Islamic State, from 2022 as its Mozambique Province. Rooted in the grievances of young Muslims of the coast, poverty and unemployment in a province rich in rubies and natural gas, and in local religious conflict, the insurgency began with an attack on police stations in Mocímboa da Praia. The insurgents took Mocímboa da Praia in August 2020 and attacked Palma in March 2021, forcing TotalEnergies to halt a $20 billion gas project. Rwanda sent troops in July 2021, followed by a force of the Southern African Development Community (SAMIM), and together with Mozambican forces they retook Mocímboa da Praia in August 2021. The insurgents spread into Niassa and Nampula and fought on in smaller groups; SAMIM left in 2024, and Rwanda, with several thousand troops (over 6,300 by its own count in 2026), became the main foreign force. By late 2026 more than 6,600 people had been killed and about 1.3 million displaced.
: L’insurrection islamiste menée depuis octobre 2017 dans la province la plus septentrionale du Mozambique, le Cabo Delgado, par le groupe connu localement sous le nom d’al-Shabaab (sans lien avec le mouvement somalien) ou d’Ansar al-Sunna, qui combat depuis 2019 sous la bannière de l’État islamique, et depuis 2022 en tant que sa province du Mozambique. Enracinée dans les griefs des jeunes musulmans de la côte, dans la pauvreté et le chômage d’une province riche en rubis et en gaz naturel, et dans des conflits religieux locaux, l’insurrection commença par une attaque contre des postes de police à Mocímboa da Praia. Les insurgés prirent Mocímboa da Praia en août 2020 et attaquèrent Palma en mars 2021, contraignant TotalEnergies à suspendre un projet gazier de 20 milliards de dollars. Le Rwanda envoya des troupes en juillet 2021, suivi d’une force de la Communauté de développement de l’Afrique australe (SAMIM) et, avec les forces mozambicaines, elles reprirent Mocímboa da Praia en août 2021. Les insurgés s’étendirent au Niassa et au Nampula et poursuivirent le combat en groupes plus réduits ; la SAMIM partit en 2024, et le Rwanda, avec plusieurs milliers de soldats (plus de 6 300 selon ses propres chiffres en 2026), devint la principale force étrangère. Fin 2026, plus de 6 600 personnes avaient été tuées et environ 1,3 million déplacées.
