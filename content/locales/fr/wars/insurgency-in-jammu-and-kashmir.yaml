# French translations of the catalogue text (wave 8); step bodies follow later.
Insurgency in Jammu and Kashmir: Insurrection au Jammu-et-Cachemire
? The armed insurgency against Indian rule in Jammu and Kashmir, the Muslim-majority region whose status India and Pakistan have disputed since 1947. It broke out in 1989 after a widely disputed state election, first led by the pro-independence JKLF and then by pro-Pakistan groups such as Hizbul Mujahideen and Pakistan-based organisations such as Lashkar-e-Taiba and Jaish-e-Mohammed. India accuses Pakistan of arming and sending the militants; Pakistan says it gives the Kashmiris only moral, political and diplomatic support. Most of the valley’s Kashmiri Hindus (Pandits) fled in 1990, and both the militants and the Indian security forces were accused of grave abuses. Violence peaked around 2001, fell during the peace process of 2004–2008, and revived in waves of protest and local militancy. In 2019 India revoked the region’s special status and divided the state. The Indian government counted about 41,000 deaths by 2017; other estimates are much higher. In 2026 violence was at its lowest level since 1989, but attacks continued.
: L’insurrection armée contre l’autorité indienne au Jammu-et-Cachemire, région à majorité musulmane dont le statut est disputé entre l’Inde et le Pakistan depuis 1947. Elle éclata en 1989 après des élections à l’assemblée de l’État largement contestées, menée d’abord par le JKLF, favorable à l’indépendance, puis par des groupes pro-pakistanais comme le Hizbul Mujahideen et par des organisations basées au Pakistan comme le Lashkar-e-Taiba et le Jaish-e-Mohammed. L’Inde accuse le Pakistan d’armer et d’envoyer les militants ; le Pakistan affirme n’apporter aux Cachemiris qu’un soutien moral, politique et diplomatique. La plupart des hindous cachemiris de la vallée (les pandits) s’enfuirent en 1990, et les militants comme les forces de sécurité indiennes furent accusés de graves exactions. La violence culmina vers 2001, recula pendant le processus de paix de 2004–2008, puis reprit à travers des vagues de manifestations et une lutte armée locale. En 2019, l’Inde révoqua le statut spécial de la région et divisa l’État. Le gouvernement indien dénombrait environ 41 000 morts en 2017 ; d’autres estimations sont bien plus élevées. En 2026, la violence était à son plus bas niveau depuis 1989, mais les attaques se poursuivaient.
