# French translations of the catalogue text (wave 8); step bodies follow later.
Insurgency in Khyber Pakhtunkhwa: Insurrection au Khyber Pakhtunkhwa
? The war between the Pakistani state and Islamist militants in the north-west of Pakistan, above all the Pakistani Taliban, Tehrik-i-Taliban Pakistan (TTP). It began in 2004, when the army entered the tribal areas on the Afghan border, where Taliban and al-Qaeda fighters had taken refuge after 2001, and grew after the storming of the Red Mosque in Islamabad in 2007 and the founding of the TTP that year. The militants took over the Swat valley until the army drove them out in 2009, and carried out hundreds of suicide bombings across Pakistan, while American drones struck their leaders. Large army offensives in South and North Waziristan in 2009 and 2014 and the national response to the massacre at the Army Public School in Peshawar pushed the TTP into Afghanistan. After the Afghan Taliban returned to power in 2021 it revived, and in 2024–2026 violence rose to its highest level in a decade and spilled into open war between Pakistan and Afghanistan. Tens of thousands of people have been killed and millions displaced.
: La guerre entre l’État pakistanais et des militants islamistes dans le nord-ouest du Pakistan, avant tout les talibans pakistanais du Tehrik-i-Taliban Pakistan (TTP). Elle commença en 2004, lorsque l’armée entra dans les zones tribales de la frontière afghane, où des combattants talibans et d’al-Qaïda s’étaient réfugiés après 2001, et s’étendit après l’assaut de la mosquée Rouge d’Islamabad en 2007 et la fondation du TTP la même année. Les militants prirent le contrôle de la vallée de Swat jusqu’à ce que l’armée les en chasse en 2009, et commirent des centaines d’attentats-suicides dans tout le Pakistan, tandis que des drones américains frappaient leurs chefs. Les grandes offensives de l’armée au Waziristan du Sud et du Nord en 2009 et en 2014, ainsi que la riposte nationale au massacre de l’école de l’armée (Army Public School) de Peshawar, repoussèrent le TTP en Afghanistan. Après le retour au pouvoir des talibans afghans en 2021, il se reconstitua, et en 2024–2026 la violence atteignit son plus haut niveau depuis une décennie et déboucha sur une guerre ouverte entre le Pakistan et l’Afghanistan. Des dizaines de milliers de personnes ont été tuées et des millions déplacées.
