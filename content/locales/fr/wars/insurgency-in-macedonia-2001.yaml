"July – November 2001": "juillet – novembre 2001"
"A ceasefire signed on 5 July and guaranteed by NATO held only in part. In late July fighting broke out again in and around Tetovo; on 8 August an NLA ambush at Karpalak killed ten soldiers, and on 10 August a landmine killed eight more near Ljuboten, north of Skopje. From 10 to 12 August police and irregulars attacked Ljuboten, an Albanian village; Human Rights Watch found that ten civilians were killed and more than 100 men arrested, many of them beaten in custody. The International Criminal Tribunal for the former Yugoslavia later sentenced a police officer, Johan Tarčulovski, to 12 years and acquitted the interior minister, Ljube Boškoski.": "Un cessez-le-feu signé le 5 juillet et garanti par l’OTAN n’a eu lieu qu’en partie. À la fin de juillet, des combats ont éclaté à nouveau dans et autour de Tetovo ; le 8 août, une embuscade de l’ALN à Karpalak a tué dix soldats, et le 10 août, une mine terrestre a tué huit autres soldats près de Ljuboten, au nord de Skopje. Du 10 au 12 août, la police et les clandestins ont attaqué Ljuboten, un village albanais ; Human Rights Watch a constaté que dix civils avaient été tués et plus de 100 hommes arrêtés, dont beaucoup ont été battus en détention. Le Tribunal pénal international pour l’ex-Yougoslavie a ensuite condamné à 12 ans un policier, Johan Tarčulovski, et acquitté le ministre de l’Intérieur, Ljube Boškoski."
"Talks at Ohrid, mediated by American and European envoys, ended on 13 August with the Ohrid Framework Agreement, signed by the leaders of the main Macedonian and Albanian parties. It promised more Albanians in the police and public service, official use of Albanian where Albanians made up more than a fifth of the population, more local self-government and changes to the constitution, in return for the NLA’s disarmament. In NATO’s Operation Essential Harvest, from 27 August to 26 September, several thousand troops collected nearly 4,000 weapons handed in by the NLA, which then announced that it had disbanded. Parliament adopted the constitutional amendments in November, and in 2002 Ahmeti founded a party, the Democratic Union for Integration.": "Les pourparlers d’Ohrid, sous la médiation des envoyés américains et européens, ont pris fin le 13 août avec l’accord-cadre d’Ohrid, signé par les dirigeants des principaux partis macédoniens et albanais. Il a promis plus d’Albanais dans la police et la fonction publique, l’usage officiel de l’Albanais où les Albanais formaient plus d’un cinquième de la population, plus d’autonomie locale et des modifications à la constitution, en échange du désarmement de l’ALN. Dans l’opération Essential Harvest de l’OTAN, du 27 août au 26 septembre, plusieurs milliers de soldats ont recueilli près de 4 000 armes remises par l’ALN, qui a ensuite annoncé sa dissolution. Le Parlement a adopté les amendements constitutionnels en novembre et en 2002 Ahmeti a fondé un parti, l’Union démocratique pour l’intégration."
