"January – June 2001": "janvier – juin 2001"
"Albanians, about a quarter of the Republic of Macedonia’s people, had long complained of being second-class citizens. The constitution of 1991 called the state the national state of the Macedonian people, Macedonian was the only official language, and few Albanians served in the police or the army. On 22 January 2001 a new armed group, the National Liberation Army (NLA), led by Ali Ahmeti and drawing on veterans of the Kosovo Liberation Army and the Preševo Valley, attacked the police station at Tearce near Tetovo, killing a policeman. In February and March its fighters held Tanuševci, a village on the Kosovo border, until Macedonian forces drove them out.": "Les Albanais, environ un quart du peuple de la République de Macédoine, se plaignaient depuis longtemps d’être des citoyens de seconde classe. La constitution de 1991 appelait l’État l’état national du peuple macédonien, le macédonien était la seule langue officielle, et peu d’Albanais servaient dans la police ou l’armée. Le 22 janvier 2001, un nouveau groupe armé, l’Armée de libération nationale (ALN), dirigé par Ali Ahmeti et faisant appel aux anciens combattants de l’Armée de libération du Kosovo et de la vallée de Preševo, a attaqué le poste de police de Tearce près de Tetovo, tuant un policier."
"In mid-March the NLA appeared on the hills above Tetovo, the largest Albanian town, and the army and police shelled the heights from 25 March until they declared the offensive over on 31 March. On 28 April an ambush at Vejce killed eight members of the security forces. From May the NLA held villages north of Kumanovo around Lipkovo, Vaksince and Slupčane, which the army shelled, and on 12 June it took Aračinovo, within reach of Skopje. Under a deal brokered by NATO some 350 fighters left on 25 June with their weapons, escorted by American troops; that night thousands of angry Macedonians stormed the parliament in Skopje.": "À la mi-mars, l’ALN est apparue sur les collines au-dessus de Tetovo, la plus grande ville albanaise, et l’armée et la police ont bombardé les hauteurs du 25 mars jusqu’à ce qu’ils aient déclaré l’offensive le 31 mars. De mai, l’ALN a tenu des villages au nord de Kumanovo autour de Lipkovo, Vakdisce et Slupčane, que l’armée a bombardés, et le 12 juin il a pris Aračinovo, à la portée de Skopje. Selon un accord négocié par l’OTAN quelque 350 combattants ont quitté le 25 juin avec leurs armes, escortés par les troupes américaines ; cette nuit-là des milliers de Macédoniens en colère ont pris l’assaut du parlement à Skopje."
