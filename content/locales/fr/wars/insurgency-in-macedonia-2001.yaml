"2001 insurgency in Macedonia": "2001 insurrection en Macédoine"
"An armed conflict in the Republic of Macedonia (now North Macedonia) between the security forces and the National Liberation Army (NLA), an ethnic Albanian armed group whose ranks included veterans of the wars in Kosovo and the Preševo Valley. The NLA said it was fighting for equal rights for Albanians, about a quarter of the population; the government called it a terrorist group bent on secession. After fighting around Tetovo, Kumanovo and Skopje, the Ohrid Framework Agreement of 13 August 2001 promised Albanians wider rights in return for the NLA’s disarmament, which NATO oversaw. Some 150–250 people were killed and about 140,000 fled their homes, most of whom returned.": "Un conflit armé en République de Macédoine (maintenant la Macédoine du Nord) entre les forces de sécurité et l’Armée nationale de libération (ALN), un groupe armé albanais de souche dont les rangs comprenaient des vétérans des guerres au Kosovo et dans la vallée de Preševo. L’ALN a déclaré qu’il se battait pour l’égalité des droits des Albanais, soit environ un quart de la population ; le gouvernement l’a qualifié de groupe terroriste plié à la sécession. Après avoir combattu autour de Tetovo, Kumanovo et Skopje, l’accord-cadre d’Ohrid du 13 août 2001 a promis aux Albanais des droits plus larges en échange du désarmement de l’ALN, que l’OTAN a supervisé."
"The country was admitted to the UN in 1993 as “the former Yugoslav Republic of Macedonia” and has been called North Macedonia since 2019. The NLA was known in Albanian as the UÇK (Ushtria Çlirimtare Kombëtare), the same initials as the Kosovo Liberation Army. Places are named in their Macedonian form.": "Le pays a été admis à l’ONU en 1993 en tant qu’ex-République yougoslave de Macédoine et est appelé Macédoine du Nord depuis 2019. L’ALN était connu en albanais sous le nom de UÇK (Ushtria Çlirimtare Kombëtare), les mêmes initiales que l’Armée de libération du Kosovo. Les lieux sont nommés sous leur forme macédonienne."
"Whether the NLA aimed at equal rights within Macedonia, as its leaders said, or at secession and a union with Kosovo or Albania, as the government claimed, is still disputed. Casualty figures vary between sources; most give 63–77 dead among the security forces and 64–105 among the NLA, besides civilians.": "Qu'il s’agisse de l’ALN visant à assurer l’égalité des droits en Macédoine, comme l’ont dit ses dirigeants, ou de la sécession et d’une union avec le Kosovo ou l’Albanie, comme l’a affirmé le gouvernement, est toujours contesté."
