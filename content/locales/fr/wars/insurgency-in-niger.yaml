# French translations of the catalogue text (wave 12); step bodies follow later.
Jihadist insurgency in Niger: Insurrection djihadiste au Niger
? "Last updated 27 November 2026. The jihadist insurgency in Niger, fought on two fronts. In the south-east, Boko Haram crossed from Nigeria into the Diffa region and attacked Bosso and Diffa in February 2015, after Niger joined the regional force against it; the war around Lake Chad has gone on there since, with Boko Haram and the Islamic State West Africa Province (ISWAP), which split from it in 2016. In the west, the Islamic State in the Greater Sahara (ISGS), founded in 2015 by Adnan Abu Walid al-Sahrawi, and later JNIM operated from Mali in the Tillabéri and Tahoua regions along the border, attacking army posts and villages. An ambush at Tongo Tongo on 4 October 2017 killed four American and at least four Nigerien soldiers; attacks on the bases of Inates on 10 December 2019 and Chinagodrar on 9 January 2020 killed 71 and 89 soldiers; six French aid workers and two Nigeriens were killed at Kouré in August 2020; about 100 villagers were killed at Tchoma Bangou and Zaroumdareye on 2 January 2021, and some 141 people in villages of the Tahoua region on 21 March 2021. ISGS became the Islamic State’s Sahel Province (IS Sahel) in 2022. Niger was then the main Western partner in the Sahel, with French troops and an American drone base at Agadez. On 26 July 2023 the presidential guard under General Abdourahamane Tiani overthrew President Mohamed Bazoum. The junta made French troops leave by December 2023 and American troops by September 2024, turned to Russia, whose Africa Corps arrived in April 2024, formed the Alliance of Sahel States with Mali and Burkina Faso and left ECOWAS in January 2025. The violence grew: ACLED recorded some 1,900 deaths in Niger in 2025, more than 1,200 of them in Tillabéri. In 2026 IS Sahel attacked the international airport and Air Base 101 at Niamey on the night of 28–29 January; JNIM overran an army post at Makalondi on 4 February, killing at least 36 soldiers; soldiers who mutinied in Niamey on 29 August attacked the airport, the presidency and the state broadcaster before loyal troops, helped by Russian forces, put the mutiny down. On 26 November 2026 an attack on a National Guard post at Sanam in Tillabéri killed at least 13 guardsmen, two days after an attack attributed to Boko Haram killed 11 soldiers in Diffa. JNIM and IS Sahel also fight each other along the borders with Mali and Burkina Faso. Most figures come from the government and from ACLED’s count of reported deaths and cannot be checked independently; how much of rural Tillabéri the state still controls is uncertain."
: "Dernière mise à jour : 27 novembre 2026. L’insurrection djihadiste au Niger, menée sur deux fronts. Dans le sud-est, Boko Haram est passé du Nigeria dans la région de Diffa et a attaqué Bosso et Diffa en février 2015, après que le Niger eut rejoint la force régionale déployée contre lui ; la guerre autour du lac Tchad s’y poursuit depuis, avec Boko Haram et l’État islamique en Afrique de l’Ouest (ISWAP), issu d’une scission de ce dernier en 2016. Dans l’ouest, l’État islamique dans le Grand Sahara (EIGS), fondé en 2015 par Adnan Abou Walid al-Sahraoui, puis le JNIM ont opéré depuis le Mali dans les régions de Tillabéri et de Tahoua, le long de la frontière, attaquant postes militaires et villages. Une embuscade à Tongo Tongo, le 4 octobre 2017, a tué quatre soldats américains et au moins quatre soldats nigériens ; les attaques contre les bases d’Inates, le 10 décembre 2019, et de Chinagodrar, le 9 janvier 2020, ont tué 71 et 89 soldats ; six humanitaires français et deux Nigériens ont été tués à Kouré en août 2020 ; une centaine de villageois ont été tués à Tchoma Bangou et à Zaroumdareye le 2 janvier 2021, et quelque 141 personnes dans des villages de la région de Tahoua le 21 mars 2021. L’EIGS est devenu en 2022 la province du Sahel de l’État islamique (EI Sahel). Le Niger était alors le principal partenaire occidental au Sahel, avec des troupes françaises et une base américaine de drones à Agadez. Le 26 juillet 2023, la garde présidentielle du général Abdourahamane Tiani a renversé le président Mohamed Bazoum. La junte a obtenu le départ des troupes françaises, achevé en décembre 2023, puis celui des troupes américaines, achevé en septembre 2024, s’est tournée vers la Russie, dont l’Africa Corps est arrivé en avril 2024, a formé l’Alliance des États du Sahel avec le Mali et le Burkina Faso et a quitté la CEDEAO en janvier 2025. La violence s’est accrue : ACLED a recensé quelque 1 900 morts au Niger en 2025, dont plus de 1 200 dans la région de Tillabéri. En 2026, l’EI Sahel a attaqué l’aéroport international et la base aérienne 101 de Niamey dans la nuit du 28 au 29 janvier ; le JNIM s’est emparé d’un poste militaire à Makalondi le 4 février, tuant au moins 36 soldats ; des soldats mutinés à Niamey le 29 août ont attaqué l’aéroport, la présidence et la radiotélévision publique avant que des troupes loyalistes, aidées par des forces russes, ne mettent fin à la mutinerie. Le 26 novembre 2026, une attaque contre un poste de la Garde nationale à Sanam, dans la région de Tillabéri, a tué au moins 13 gardes, deux jours après qu’une attaque attribuée à Boko Haram eut tué 11 soldats dans la région de Diffa. Le JNIM et l’EI Sahel se combattent aussi le long des frontières avec le Mali et le Burkina Faso. La plupart des chiffres proviennent du gouvernement et du décompte des morts signalés établi par ACLED, et ne peuvent être vérifiés de manière indépendante ; on ignore quelle part des campagnes de Tillabéri l’État contrôle encore."
