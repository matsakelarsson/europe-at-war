# French translations of the catalogue text (wave 8); step bodies follow later.
Insurgency in Northeast India: Insurrection dans le Nord-Est de l’Inde
The many armed conflicts in India’s north-eastern states, a region of hills and valleys linked to the rest of India only by a narrow corridor and home to peoples with their own languages and histories. The Naga National Council, which declared Naga independence in 1947, took up arms in the mid-1950s, the longest of the insurgencies; it was followed by the Mizo rising of 1966, Meitei insurgents in Manipur, tribal groups in Tripura, the United Liberation Front of Asom (ULFA) and Bodo groups in Assam, and many smaller movements. The Indian army fought them under the Armed Forces (Special Powers) Act, and most of the conflicts ended in ceasefires and accords, though the Naga talks are unresolved and ULFA’s hard-line faction fights on from Myanmar. Since May 2023 ethnic violence between Meitei and Kuki-Zo in Manipur, and from 2026 between Kuki and Naga groups, has killed hundreds and displaced some 60,000 people. Last updated 27 November 2026.: "Les nombreux conflits armés des États du nord-est de l’Inde, une région de collines et de vallées reliée au reste du pays par un simple corridor étroit et habitée par des peuples qui ont leurs propres langues et leur propre histoire. Le Conseil national naga, qui avait proclamé l’indépendance naga en 1947, prit les armes au milieu des années 1950, ouvrant la plus longue de ces insurrections ; suivirent le soulèvement mizo de 1966, les insurgés meitei au Manipur, des groupes tribaux au Tripura, le Front uni de libération de l’Asom (ULFA) et des groupes bodos en Assam, ainsi que de nombreux mouvements de moindre importance. L’armée indienne les combattit en vertu de l’Armed Forces (Special Powers) Act, et la plupart de ces conflits se terminèrent par des cessez-le-feu et des accords, même si les négociations avec les Nagas n’ont pas abouti et que la faction dure de l’ULFA poursuit le combat depuis la Birmanie. Depuis mai 2023, les violences ethniques entre Meitei et Kuki-Zo au Manipur, puis, à partir de 2026, entre groupes kuki et nagas, ont fait des centaines de morts et quelque 60 000 déplacés. Dernière mise à jour : 27 novembre 2026."
