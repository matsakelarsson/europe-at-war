# French translations of the catalogue text (wave 8); step bodies follow later.
Insurgency in Punjab: Insurrection au Pendjab
? The armed movement of Sikh militants for an independent Sikh state, Khalistan, in the Indian state of Punjab, and its suppression. It grew out of the Akali Dal’s campaign for more autonomy for Punjab and the rise of the preacher Jarnail Singh Bhindranwale, who with armed followers made the Golden Temple in Amritsar, the holiest shrine of Sikhism, his base. In June 1984 Prime Minister Indira Gandhi sent the army into the temple in Operation Blue Star, killing Bhindranwale and many militants and pilgrims. In October she was killed by two Sikh bodyguards, and mobs killed thousands of Sikhs in Delhi and other cities. Militant groups then waged a guerrilla war in Punjab, killing thousands of civilians, many of them Hindus and Sikhs who opposed them, and Sikh militants abroad bombed an Air India airliner in 1985, killing 329 people. The police under K. P. S. Gill crushed the insurgency in 1992–1993, with mass arrests and killings of suspects in staged encounters. The killing of Chief Minister Beant Singh in 1995 was its last major attack. About 21,000 people were killed by official figures.
: Le mouvement armé de militants sikhs pour un État sikh indépendant, le Khalistan, dans l’État indien du Pendjab, et sa répression. Il naquit de la campagne de l’Akali Dal pour une plus grande autonomie du Pendjab et de l’ascension du prédicateur Jarnail Singh Bhindranwale, qui s’établit avec des partisans armés dans le Temple d’or d’Amritsar, le sanctuaire le plus sacré du sikhisme, dont il fit sa base. En juin 1984, la Première ministre Indira Gandhi envoya l’armée dans le temple lors de l’opération Blue Star, au cours de laquelle Bhindranwale ainsi que de nombreux militants et pèlerins furent tués. En octobre, elle fut assassinée par deux de ses gardes du corps sikhs, et des foules tuèrent des milliers de sikhs à Delhi et dans d’autres villes. Des groupes militants menèrent ensuite une guérilla au Pendjab, tuant des milliers de civils, dont beaucoup d’hindous et de sikhs qui s’opposaient à eux, et des militants sikhs établis à l’étranger firent exploser en 1985 un avion de ligne d’Air India, tuant 329 personnes. La police, dirigée par K. P. S. Gill, écrasa l’insurrection en 1992–1993, au prix d’arrestations massives et d’exécutions de suspects lors d’affrontements mis en scène. L’assassinat du ministre en chef Beant Singh en 1995 fut sa dernière grande attaque. Selon les chiffres officiels, environ 21 000 personnes furent tuées.
