# French translations of the catalogue text (wave 12); step bodies follow later.
Insurgency in the Maghreb: Insurrection au Maghreb
? "Last updated 27 November 2026. The jihadist insurgency in Algeria and its neighbours that outlived the Algerian Civil War. Its core was the Salafist Group for Preaching and Combat (GSPC), founded in 1998 by Hassan Hattab and other commanders who broke with the Armed Islamic Group (GIA) over its massacres of civilians and who refused the amnesty of 1999. From the mountains of Kabylia and eastern Algeria it kept up ambushes of soldiers and police, while its Saharan units under Amari Saïfi and Mokhtar Belmokhtar lived from smuggling and from kidnapping Europeans, starting with 32 tourists seized in 2003, and in June 2005 killed 15 Mauritanian soldiers at Lemgheity. Under Abdelmalek Droukdel the GSPC pledged allegiance to al-Qaeda and in January 2007 renamed itself al-Qaeda in the Islamic Maghreb (AQIM). It then turned to suicide bombings in Algiers: on 11 April 2007 against the government palace and a police station (33 dead), and on 11 December 2007 against the Constitutional Council and the UN offices (41 dead, 17 of them UN staff). In Morocco, bombings in Casablanca on 16 May 2003 killed 33 people and the twelve bombers, and a bomb in a Marrakesh café killed 17 in 2011; in Tunisia a truck bomb at the El Ghriba synagogue on Djerba killed 19 in 2002. Driven out of most of northern Algeria by the army, AQIM moved its weight south into the Sahel, where its fighters took part in the war in Mali from 2012 and joined JNIM in 2017. In January 2013 Belmokhtar’s breakaway group seized the Tiguentourine gas plant near In Amenas; when the Algerian army stormed it, 40 hostages, almost all foreign workers, and 29 attackers died. After the Tunisian revolution, AQIM’s Okba Ibn Nafaa Brigade fought the Tunisian army on Mount Chambi near Kasserine from December 2012, and gunmen loyal to the Islamic State killed 22 people at the Bardo museum in Tunis and 38 tourists on the beach at Sousse in 2015, and attacked Ben Guerdane from Libya in March 2016. French troops killed Droukdel in northern Mali in June 2020; his successor was Abu Ubaidah Yusuf al-Annabi. By 2026 attacks in Algeria, Tunisia and Morocco had become rare, though the Algerian army still reported clashes and killings of militants in the mountains each year, as in Tébessa in March 2026, and Tunisian forces still hunted small groups near the Algerian border; AQIM’s main strength lay in the Sahel."
: "Dernière mise à jour : 27 novembre 2026. L’insurrection djihadiste en Algérie et dans les pays voisins qui a survécu à la guerre civile algérienne. Son noyau fut le Groupe salafiste pour la prédication et le combat (GSPC), fondé en 1998 par Hassan Hattab et d’autres commandants qui avaient rompu avec le Groupe islamique armé (GIA) en raison de ses massacres de civils et qui refusèrent l’amnistie de 1999. Depuis les montagnes de Kabylie et de l’est algérien, il multiplia les embuscades contre des soldats et des policiers, tandis que ses unités sahariennes, sous Amari Saïfi et Mokhtar Belmokhtar, vivaient de la contrebande et de l’enlèvement d’Européens, à commencer par 32 touristes enlevés en 2003, et tuèrent 15 soldats mauritaniens à Lemgheity en juin 2005. Sous Abdelmalek Droukdel, le GSPC prêta allégeance à al-Qaïda et prit en janvier 2007 le nom d’al-Qaïda au Maghreb islamique (AQMI). Il se tourna alors vers les attentats-suicides à Alger : le 11 avril 2007 contre le palais du gouvernement et un commissariat (33 morts), et le 11 décembre 2007 contre le Conseil constitutionnel et les bureaux de l’ONU (41 morts, dont 17 membres du personnel de l’ONU). Au Maroc, des attentats à Casablanca le 16 mai 2003 tuèrent 33 personnes ainsi que les douze kamikazes, et une bombe dans un café de Marrakech fit 17 morts en 2011 ; en Tunisie, un camion piégé lancé contre la synagogue de la Ghriba, à Djerba, fit 19 morts en 2002. Chassée par l’armée de la majeure partie du nord de l’Algérie, AQMI déplaça son centre de gravité vers le sud, au Sahel, où ses combattants prirent part à la guerre au Mali à partir de 2012 et rejoignirent le JNIM en 2017. En janvier 2013, le groupe dissident de Belmokhtar s’empara du site gazier de Tiguentourine, près d’In Amenas ; lors de l’assaut de l’armée algérienne, 40 otages, presque tous des travailleurs étrangers, et 29 assaillants trouvèrent la mort. Après la révolution tunisienne, la brigade Okba Ibn Nafaa d’AQMI combattit l’armée tunisienne sur le mont Chambi, près de Kasserine, à partir de décembre 2012 ; des hommes armés fidèles à l’État islamique tuèrent en 2015 22 personnes au musée du Bardo, à Tunis, et 38 touristes sur la plage de Sousse, puis attaquèrent Ben Guerdane depuis la Libye en mars 2016. Les troupes françaises tuèrent Droukdel dans le nord du Mali en juin 2020 ; son successeur fut Abu Ubaidah Yusuf al-Annabi. En 2026, les attaques étaient devenues rares en Algérie, en Tunisie et au Maroc, même si l’armée algérienne signalait encore chaque année des accrochages et des combattants tués dans les montagnes, comme à Tébessa en mars 2026, et si les forces tunisiennes traquaient encore de petits groupes près de la frontière algérienne ; la principale force d’AQMI se trouvait au Sahel."
