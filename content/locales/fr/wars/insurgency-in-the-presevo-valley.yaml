# Some French text was translated automatically.
"Insurgency in the Preševo Valley": "L’insurrection dans la vallée de Preševo"
"An ethnic Albanian insurgency in the municipalities of Preševo, Bujanovac and Medveđa in southern Serbia, on the border of Kosovo, after the Kosovo War. The Liberation Army of Preševo, Medveđa and Bujanovac (UÇPMB), many of whose fighters came from the disbanded Kosovo Liberation Army, attacked Serbian police from the 5-kilometre Ground Safety Zone along the boundary, where the Kumanovo Agreement allowed Yugoslav forces to carry only light arms. After the fall of Slobodan Milošević in October 2000, Belgrade offered the Čović plan of amnesty, Albanian recruits for the police and economic development, and NATO let the Yugoslav Army return to the zone sector by sector from March 2001. Under the Končulj agreement of May 2001 the UÇPMB disarmed and disbanded; some 400 fighters gave themselves up to KFOR, and by 1 June the army held the whole zone. Fewer than a hundred people were killed, among them about 18 Serbian police and soldiers and 15 civilians.": "Une insurrection albanaise de souche dans les municipalités de Preševo, Bujanovac et Medvea dans le sud de la Serbie, à la frontière du Kosovo, après la guerre du Kosovo. L’Armée de libération de Preševo, Medvea et Bujanovac (UPMB), dont beaucoup de combattants provenaient de l’armée de libération du Kosovo dissoute, ont attaqué la police serbe à partir de la zone de sécurité terrestre de 5 kilomètres le long de la frontière, où l’Accord de Kumanovo a permis aux forces yougoslaves de ne porter que des armes légères. Après la chute de Slobodan Milošević en octobre 2000, Belgrade a offert le plan d’amnistie Čović, des recrues albanaises pour la police et le développement économique, et l’OTAN a laissé l’armée yougoslave revenir dans le secteur par secteur à partir de mars 2001. En vertu de l’accord de Končulj de mai 2001, l’UCPMB a désarmé et démantelé ; quelque 400 combattants se sont livrés à la KFOR, et au 1er juin l’armée a tenu toute la zone. Moins d’une centaine de personnes ont été tuées, dont environ la police et les soldats serbes et 15 civils."
"The UÇPMB wanted the three municipalities, which have large Albanian populations (a majority in Preševo and Bujanovac), joined to Kosovo; Belgrade called it a terrorist group. Casualty and strength figures vary between sources, and the date of the Končulj agreement is given as both 20 and 21 May 2001.": "L’UÇPMB voulait que les trois municipalités, qui comptent une forte population albanaise (une majorité à Preševo et Bujanovac), se joignent au Kosovo ; Belgrade l’a qualifié de groupe terroriste. Les chiffres des pertes et des effectifs varient selon les sources, et la date de l’accord de Končulj est fixée aux 20 et 21 mai 2001."
"Many former UÇPMB fighters went on to join the National Liberation Army in the 2001 insurgency in Macedonia. Low-level incidents continued in the valley for years afterwards.": "De nombreux anciens combattants de l’UPMB ont rejoint l’Armée nationale de libération lors de l’insurrection de 2001 en Macédoine. Les incidents de bas niveau se sont poursuivis dans la vallée pendant des années après."
