# French translations of the catalogue text (wave 11); step bodies follow later.
Internal conflict in Myanmar: Conflit interne au Myanmar
? The armed conflicts that have gone on in Myanmar (Burma) almost without pause since independence, among the longest in the world. Within months of independence in January 1948 the Communist Party of Burma and then the Karen National Union took up arms, and for a time in 1949 the government held little more than Rangoon. Kuomintang troops driven out of China occupied much of the Shan State in the 1950s. From the 1960s, under the military rule of Ne Win, the army fought the communists, who held a base area on the Chinese border until 1989, and a growing number of ethnic armies, Kachin, Karen, Karenni, Shan, Mon and others, seeking independence or a federal union. Ceasefires from 1989 ended much of the fighting but not the conflict. The army crushed the democracy uprising of 1988 and the protests of 2007, and in 2016–2017 drove more than 700,000 Rohingya into Bangladesh in operations that UN investigators said should be examined as genocide, and that the International Court of Justice found in November 2026 to have been genocide. The coup of 1 February 2021 turned the conflict into a nationwide civil war between the military government and the resistance of the National Unity Government and the ethnic armies, which made large gains in 2023–2024; the army won back ground in 2025–2026. Hundreds of thousands have been killed since 1948, and millions displaced.
: Les conflits armés qui se poursuivent au Myanmar (Birmanie) presque sans interruption depuis l’indépendance, et qui comptent parmi les plus longs du monde. Quelques mois après l’indépendance de janvier 1948, le Parti communiste de Birmanie, puis l’Union nationale karen prirent les armes, et pendant un temps, en 1949, le gouvernement ne tenait guère plus que Rangoun. Des troupes du Kuomintang chassées de Chine occupèrent une grande partie de l’État shan dans les années 1950. À partir des années 1960, sous le régime militaire de Ne Win, l’armée combattit les communistes, qui tinrent une base sur la frontière chinoise jusqu’en 1989, ainsi qu’un nombre croissant d’armées ethniques (kachin, karen, karenni, shan, mon et autres) qui réclamaient l’indépendance ou une union fédérale. Les cessez-le-feu conclus à partir de 1989 mirent fin à une grande partie des combats, mais pas au conflit. L’armée écrasa le soulèvement démocratique de 1988 et les manifestations de 2007, et en 2016–2017 chassa plus de 700 000 Rohingyas vers le Bangladesh lors d’opérations qui, selon les enquêteurs de l’ONU, devraient être examinées en tant que génocide, et que la Cour internationale de justice a qualifiées de génocide en novembre 2026. Le coup d’État du 1er février 2021 a transformé le conflit en une guerre civile à l’échelle du pays entre le gouvernement militaire et la résistance formée par le gouvernement d’union nationale et les armées ethniques, qui ont réalisé d’importantes avancées en 2023–2024 ; l’armée a regagné du terrain en 2025–2026. Des centaines de milliers de personnes ont été tuées depuis 1948, et des millions déplacées.
