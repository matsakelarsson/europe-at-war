# French translations of the catalogue text (wave 13); step bodies follow later.
Armed struggle against apartheid: Lutte armée contre l’apartheid
? "The armed struggle of South Africa’s liberation movements against apartheid, and the state’s war against them at home and in neighbouring countries, from the Sharpeville massacre to the suspension of armed struggle in 1990. On 21 March 1960 police at Sharpeville fired on a crowd protesting against the pass laws, killing 69 people; the government banned the African National Congress (ANC) and the Pan Africanist Congress (PAC) on 8 April. Turning to violence after half a century of non-violent protest, ANC and Communist Party leaders, among them Nelson Mandela, formed Umkhonto we Sizwe (MK, the Spear of the Nation) in June 1961; it began a campaign of sabotage against installations on 16 December 1961, while the PAC’s Poqo killed whites and others it saw as collaborators. The police broke both: the leaders of MK were arrested at Liliesleaf Farm in Rivonia on 11 July 1963, and on 12 June 1964 Mandela and seven others were sentenced to life imprisonment. From exile in Tanzania, Zambia and later Angola, MK tried to infiltrate fighters, with ZIPRA in Rhodesia in 1967–1968. The Soweto uprising of 16 June 1976, in which police killed at least 176 people and by some estimates several hundred, sent thousands of young people abroad to join MK, which from 1977 attacked police stations, the Sasol oil-from-coal plants (1980), the Koeberg nuclear power station (1982) and, increasingly, places where civilians died, as in the Church Street car bomb in Pretoria on 20 May 1983 (19 killed). South Africa’s forces raided ANC houses and offices in Matola in Mozambique (1981), Maseru in Lesotho (1982, 42 killed), Gaborone in Botswana (1985, 12 killed) and elsewhere, and its death squads killed activists at home and abroad. From 1984 the townships rose in revolt under the United Democratic Front; the government declared states of emergency in 1985 and 1986, deployed the army in the townships and detained tens of thousands of people, and a bitter conflict between the ANC and Inkatha grew in Natal. President F. W. de Klerk lifted the bans on 2 February 1990 and released Mandela on 11 February; in the Pretoria Minute of 6 August 1990 the ANC suspended its armed struggle. Political violence, much of it between the ANC and Inkatha and fuelled by elements of the security forces, killed some 14,000 more people before the elections of April 1994; a widely cited estimate puts the dead of political violence between 1948 and 1994 at about 21,000."
: "La lutte armée des mouvements de libération d’Afrique du Sud contre l’apartheid, et la guerre que l’État leur livra dans le pays et dans les pays voisins, du massacre de Sharpeville à la suspension de la lutte armée en 1990. Le 21 mars 1960, à Sharpeville, la police tira sur une foule qui protestait contre les lois sur les laissez-passer, tuant 69 personnes ; le gouvernement interdit le Congrès national africain (ANC) et le Congrès panafricain (PAC) le 8 avril. Se tournant vers la violence après un demi-siècle de protestation non violente, des dirigeants de l’ANC et du Parti communiste, parmi lesquels Nelson Mandela, fondèrent Umkhonto we Sizwe (MK, « le Fer de lance de la nation ») en juin 1961 ; l’organisation lança une campagne de sabotage contre des installations le 16 décembre 1961, tandis que le Poqo, lié au PAC, tuait des Blancs et d’autres personnes qu’il considérait comme des collaborateurs. La police brisa les deux mouvements : les dirigeants de MK furent arrêtés à la ferme de Liliesleaf, à Rivonia, le 11 juillet 1963, et le 12 juin 1964 Mandela et sept autres accusés furent condamnés à la réclusion à perpétuité. Depuis l’exil, en Tanzanie, en Zambie et plus tard en Angola, MK tenta d’infiltrer des combattants, avec la ZIPRA en Rhodésie en 1967–1968. Le soulèvement de Soweto du 16 juin 1976, au cours duquel la police tua au moins 176 personnes, et plusieurs centaines selon certaines estimations, poussa des milliers de jeunes à partir à l’étranger pour rejoindre MK, qui à partir de 1977 attaqua des commissariats, les usines Sasol de conversion du charbon en carburant (1980), la centrale nucléaire de Koeberg (1982) et, de plus en plus, des lieux où des civils trouvèrent la mort, comme lors de l’attentat à la voiture piégée de Church Street à Pretoria le 20 mai 1983 (19 morts). Les forces sud-africaines attaquèrent des maisons et des bureaux de l’ANC à Matola au Mozambique (1981), à Maseru au Lesotho (1982, 42 morts), à Gaborone au Botswana (1985, 12 morts) et ailleurs, et leurs escadrons de la mort tuèrent des militants dans le pays et à l’étranger. À partir de 1984, les townships se soulevèrent sous l’égide du Front démocratique uni ; le gouvernement proclama l’état d’urgence en 1985 et en 1986, déploya l’armée dans les townships et fit détenir des dizaines de milliers de personnes, tandis qu’un conflit acharné entre l’ANC et l’Inkatha prenait de l’ampleur au Natal. Le président F. W. de Klerk leva les interdictions le 2 février 1990 et libéra Mandela le 11 février ; par le procès-verbal de Pretoria du 6 août 1990, l’ANC suspendit sa lutte armée. La violence politique, qui opposa en grande partie l’ANC et l’Inkatha et fut attisée par des éléments des forces de sécurité, fit encore quelque 14 000 morts avant les élections d’avril 1994 ; une estimation largement citée évalue à environ 21 000 le nombre de morts de la violence politique entre 1948 et 1994."
