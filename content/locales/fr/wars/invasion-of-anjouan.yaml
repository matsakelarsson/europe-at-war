# French translations of the catalogue text (wave 13); step bodies follow later.
Invasion of Anjouan: Invasion d’Anjouan
? "The amphibious landing by Comoran and African Union troops on the island of Anjouan (Nzwani) on 25 March 2008, code-named Operation Democracy in Comoros, which removed Colonel Mohamed Bacar, the island’s president, who had refused to leave office. Since independence from France in 1975 the Comoros had seen more than 20 coups and attempted coups, and Anjouan had broken away once before, in 1997. Under the 2001 constitution each island of the Union of the Comoros had its own president; in 2007 Bacar refused to step down at the end of his term, held his own election in June, claimed 90 per cent of the vote against the objections of the federal government and the AU, and declared Anjouan independent in July. After sanctions and talks failed, the AU backed military action. A small Comoran landing near Domoni in mid-March withdrew after a brief clash, and on 19 March a French police helicopter from Mayotte crashed off Anjouan on an unauthorised flight, which led to accusations that France was protecting Bacar. On the morning of 24 March about 1,500 troops sailed from Fomboni on Mohéli: Comoran soldiers with AU contingents from Tanzania, Sudan and Senegal, carried in part by French aircraft and supported by Libya and the United States. About 450 landed at dawn on 25 March on the north side of Anjouan Bay near Ouani, took the airport after some fighting and went on to the capital, Mutsamudu, the port and the second town, Domoni; much of the population welcomed them. Casualty figures were never clearly reported. Bacar escaped by speedboat to the French island of Mayotte on 26 March; France refused him asylum on 15 May but would not hand him over to the Comoros because of the risk of persecution, and in July 2008 flew him from Réunion to Benin. Moussa Toybou won the new island election held in June 2008."
: "Le débarquement amphibie de troupes comoriennes et de l’Union africaine sur l’île d’Anjouan (Nzwani) le 25 mars 2008, sous le nom de code d’opération Démocratie aux Comores, qui renversa le colonel Mohamed Bacar, président de l’île, lequel refusait de quitter ses fonctions. Depuis leur indépendance vis-à-vis de la France en 1975, les Comores avaient connu plus de 20 coups d’État et tentatives de coup d’État, et Anjouan avait déjà fait sécession une fois, en 1997. Selon la constitution de 2001, chaque île de l’Union des Comores avait son propre président ; en 2007, Bacar refusa de se retirer au terme de son mandat, organisa sa propre élection en juin, revendiqua 90 % des voix malgré les objections du gouvernement fédéral et de l’UA, et proclama l’indépendance d’Anjouan en juillet. Après l’échec des sanctions et des négociations, l’UA soutint une action militaire. Un petit débarquement comorien près de Domoni, à la mi-mars, se retira après un bref accrochage et, le 19 mars, un hélicoptère de la police française venu de Mayotte s’abîma au large d’Anjouan lors d’un vol non autorisé, ce qui suscita des accusations selon lesquelles la France protégeait Bacar. Le matin du 24 mars, environ 1 500 soldats embarquèrent à Fomboni, sur Mohéli : des soldats comoriens avec des contingents de l’UA venus de Tanzanie, du Soudan et du Sénégal, transportés en partie par des avions français et soutenus par la Libye et les États-Unis. Environ 450 d’entre eux débarquèrent à l’aube du 25 mars sur la rive nord de la baie d’Anjouan, près de Ouani, prirent l’aéroport après quelques combats et gagnèrent la capitale, Mutsamudu, le port et la deuxième ville, Domoni ; une grande partie de la population les accueillit favorablement. Le bilan des victimes ne fut jamais clairement établi. Bacar s’enfuit en vedette rapide vers l’île française de Mayotte le 26 mars ; la France lui refusa l’asile le 15 mai mais ne voulut pas le livrer aux Comores en raison du risque de persécution et, en juillet 2008, le transféra par avion de La Réunion au Bénin. Moussa Toybou remporta la nouvelle élection insulaire organisée en juin 2008."
