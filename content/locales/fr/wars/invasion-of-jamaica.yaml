# French translations of the catalogue text (wave 14); step bodies follow later.
Western Design and the conquest of Jamaica: Western Design et conquête de la Jamaïque
? Oliver Cromwell’s attack on Spain’s Caribbean empire, the Western Design, and the five-year war for Jamaica that followed. A fleet under Admiral William Penn and an army under General Robert Venables, swelled in Barbados and the Leeward Islands to some 7,000 to 8,000 poorly trained men, landed on Hispaniola in April 1655 to take Santo Domingo, but the army was routed by a few hundred Spanish militia lancers and lost about a thousand men. Unwilling to return empty-handed, the commanders sailed for lightly defended Jamaica, where they landed in May 1655 and forced Governor Juan Ramírez de Arellano to capitulate. The Spanish colonists had freed many of the people they held in slavery, who formed free communities in the mountains, and under Francisco de Proenza and then Cristóbal Arnaldo de Ysassi the Spanish fought a guerrilla war alongside these maroons, led by Juan de Bolas and Juan de Serras. Disease killed most of the English troops, but Edward D’Oyley defeated Spanish landings from Cuba at Ocho Rios in 1657 and Rio Nuevo in 1658, and in 1660 won over Juan de Bolas, after which Ysassi left the island. Spain recognised English rule in Jamaica in the Treaty of Madrid of 1670.
: L’attaque lancée par Oliver Cromwell contre l’empire espagnol des Caraïbes, le Western Design (« dessein occidental »), et la guerre de cinq ans pour la Jamaïque qui s’ensuivit. Une flotte commandée par l’amiral William Penn et une armée aux ordres du général Robert Venables, renforcée à la Barbade et dans les îles Sous-le-Vent jusqu’à compter quelque 7 000 à 8 000 hommes mal entraînés, débarquèrent sur Hispaniola en avril 1655 pour prendre Santo Domingo, mais l’armée fut mise en déroute par quelques centaines de lanciers de la milice espagnole et perdit environ un millier d’hommes. Ne voulant pas rentrer les mains vides, les commandants firent voile vers la Jamaïque, peu défendue, où ils débarquèrent en mai 1655 et contraignirent le gouverneur Juan Ramírez de Arellano à capituler. Les colons espagnols avaient libéré nombre des personnes qu’ils tenaient en esclavage, qui formèrent des communautés libres dans les montagnes ; sous Francisco de Proenza puis Cristóbal Arnaldo de Ysassi, les Espagnols menèrent une guérilla aux côtés de ces marrons, conduits par Juan de Bolas et Juan de Serras. Les maladies tuèrent la plupart des soldats anglais, mais Edward D’Oyley repoussa des débarquements espagnols venus de Cuba à Ocho Rios en 1657 et à Rio Nuevo en 1658, et rallia Juan de Bolas en 1660, après quoi Ysassi quitta l’île. L’Espagne reconnut la domination anglaise sur la Jamaïque par le traité de Madrid de 1670.
