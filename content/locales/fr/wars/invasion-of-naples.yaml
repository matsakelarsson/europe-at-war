"February – November 1806": "février – novembre 1806"
"In 1805 Ferdinand IV of Naples promised Napoleon to stay neutral, and then let some 20,000 British and Russian troops land at Naples. After Austerlitz the Russians sailed away and the British withdrew to Sicily, and on 27 December Napoleon declared that the Bourbon dynasty of Naples had ceased to reign. On 8 February 1806 a French army of more than 40,000 men under Marshal Masséna crossed the border. Ferdinand had already left for Palermo. Masséna entered Naples on 14 February, and on 9 March General Reynier routed the remains of the Neapolitan army in driving snow at Campo Tenese in the Calabrian mountains. Napoleon proclaimed his brother Joseph king of Naples on 30 March. But the fortress of Gaeta, under the hard-drinking Prince Louis of Hesse-Philippsthal, refused to surrender, and in Calabria, plunder and rape by French troops set off a peasant rising.": "En 1805, Ferdinand IV de Naples promit à Napoléon de rester neutre, puis laissa atterrir quelque 20 000 troupes britanniques et russes à Naples. Après Austerlitz les Russes s’embarquèrent et les Britanniques se retiraient en Sicile, et le 27 décembre Napoléon déclara que la dynastie Bourbon de Naples avait cessé de régner. Le 8 février 1806, une armée française de plus de 40 000 hommes sous le maréchal Masséna traversa la frontière. Ferdinand était déjà parti pour Palerme. Masséna entra à Naples le 14 février, et le 9 mars le général Reynier roula les restes de l’armée napolitaine en conduisant la neige à Campo Tenese dans les montagnes calabriennes. Napoléon proclama son frère Joseph roi de Naples le 30 mars. Mais la forteresse de Gaeta, sous le prince Louis de Hesse-Philippsthal, qui boit durement, refusa de se rendre et en Calabre, pillant et violant par les troupes françaises fit monter un paysan."
"On 1 July a British force of about 5,200 men under General John Stuart landed in the Gulf of Sant’Eufemia, and on 4 July it beat Reynier’s slightly larger force on the plain below Maida, with heavy French losses. But on 18 July Gaeta, its commander wounded and its walls breached, surrendered after a siege of nearly five months, freeing some 10,000 French troops. Stuart’s men took the French posts on the coast and went back to Sicily, leaving garrisons at Reggio and Scilla that held out until 1808. The French burned villages that resisted, and the guerrillas tortured and killed prisoners. On 8 August Masséna stormed Lauria, a guerrilla stronghold, and gave no quarter. The guerrilla leader Michele Pezza, known as Fra Diavolo, was caught and hanged in Naples in November 1806.": "Le 1er juillet, une force britannique d’environ 5 200 hommes sous la direction du général John Stuart débarqua dans le golfe de Sant-Eufemia et, le 4 juillet, elle battit Reynier avec de lourdes pertes françaises. Mais le 18 juillet, Gaeta, son commandant blessé et ses murs brisés se rendirent après un siège de près de cinq mois, libérant quelque 10 000 soldats français. Les hommes de Stuart ont pris les postes français sur la côte et sont retournés en Sicile, laissant des garnisons à Reggio et Scilla qui s’est tenu jusqu’en 1808. Les Français ont brûlé les villages qui résistaient, et la guérilla a torturé et tué des prisonniers. Le chef de la guérilla Michele Pezza, connu sous le nom de Fra Diavolo, fut pris et pendu à Naples en novembre 1806."
