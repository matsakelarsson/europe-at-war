# Some French text was translated automatically.
"French invasion of Naples": "Invasion française de Naples"
"The French conquest of the mainland Kingdom of Naples in 1806, after King Ferdinand IV had broken his neutrality and let British and Russian troops land. Marshal Masséna’s army took Naples in February and crushed the Neapolitan army at Campo Tenese, and Napoleon’s brother Joseph became king. Gaeta held out until July, a British force won at Maida, and a savage peasant war in Calabria went on for years, but Ferdinand kept only Sicily.": "La conquête française du royaume continental de Naples en 1806, après que le roi Ferdinand IV eut rompu sa neutralité et laissé les troupes britanniques et russes débarquer. L’armée du maréchal Masséna a pris Naples en février et écrasé l’armée napolitaine à Campo Tenese, et le frère de Napoléon Joseph est devenu roi. Gaeta a tenu jusqu’en juillet, une force britannique a gagné à Maida, et une guerre paysanne sauvage a continué en Calabre pendant des années, mais Ferdinand n’a gardé que la Sicile."
"Part of the War of the Third Coalition, told with the Napoleonic Wars. Ferdinand ruled Naples and Sicily as two kingdoms until 1816; the map keeps the Kingdom of Naples as one polity under its Bourbon and then its Napoleonic kings.": "Une partie de la guerre de la troisième coalition, racontée avec les guerres napoléoniennes. Ferdinand a gouverné Naples et Sicile comme deux royaumes jusqu’en 1816 ; la carte maintient le Royaume de Naples comme une seule politique sous son Bourbon puis ses rois napoléoniens."
"The guerrilla war in Calabria lasted until about 1811. Atrocities on both sides were common, and numbers of dead are unknown.": "La guerre de guérilla en Calabre a duré jusqu’à environ 1811. Les atrocités des deux côtés étaient fréquentes, et le nombre de morts est inconnu."
