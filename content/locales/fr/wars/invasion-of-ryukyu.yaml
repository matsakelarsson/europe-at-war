# French translations of the catalogue text (wave 10); step bodies follow later.
Invasion of Ryukyu: Invasion de Ryūkyū
? The conquest of the Ryukyu Kingdom by the Shimazu lords of Satsuma in the spring of 1609, with the permission of the Tokugawa shogunate. King Shō Nei had ignored repeated demands from Satsuma and from Tokugawa Ieyasu that he send an embassy to thank Ieyasu for returning shipwrecked Ryukyuan sailors and acknowledge the new regime, and Satsuma, deep in debt after the Korean wars, wanted a share of Ryukyu’s trade with China. About 3,000 Satsuma soldiers in some 100 ships under Kabayama Hisataka and Hirata Masumune sailed from Yamakawa in early April. They took Amami Ōshima without resistance, overcame armed islanders on Tokunoshima and passed Okinoerabu, then landed at Unten on Okinawa, burned the deserted castle of Nakijin and marched on the capital, Shuri, from the west coast while their ships forced the harbour of Naha. Shō Nei surrendered in early May. He was taken to Kagoshima, brought before Ieyasu at Sunpu and the shogun Hidetada at Edo in 1610, and in 1611 made to swear oaths of loyalty to the Shimazu and accept the Fifteen Injunctions, which put Ryukyu’s foreign trade under Satsuma control. Satsuma annexed the Amami Islands and took a yearly tribute, while the kingdom kept its king, its government and its tribute relations with China, which Satsuma and Ryukyu hid from the Chinese court. This dual subordination lasted until Japan annexed Ryukyu as Okinawa Prefecture in 1879.
: La conquête du royaume de Ryūkyū par les seigneurs Shimazu de Satsuma au printemps 1609, avec la permission du shogunat Tokugawa. Le roi Shō Nei avait ignoré les demandes répétées de Satsuma et de Tokugawa Ieyasu qui le pressaient d’envoyer une ambassade remercier Ieyasu d’avoir rapatrié des marins de Ryūkyū naufragés et reconnaître le nouveau régime, et Satsuma, lourdement endetté après les guerres de Corée, voulait une part du commerce de Ryūkyū avec la Chine. Environ 3 000 soldats de Satsuma, à bord d’une centaine de navires, sous les ordres de Kabayama Hisataka et de Hirata Masumune, appareillèrent de Yamakawa début avril. Ils prirent Amami Ōshima sans rencontrer de résistance, vinrent à bout d’insulaires armés à Tokunoshima et passèrent Okinoerabu, puis débarquèrent à Unten, sur Okinawa, incendièrent le château désert de Nakijin et marchèrent sur la capitale, Shuri, depuis la côte ouest, tandis que leurs navires forçaient le port de Naha. Shō Nei se rendit début mai. Il fut emmené à Kagoshima, présenté à Ieyasu à Sunpu et au shogun Hidetada à Edo en 1610 et, en 1611, contraint de jurer fidélité aux Shimazu et d’accepter les Quinze Injonctions, qui placèrent le commerce extérieur de Ryūkyū sous le contrôle de Satsuma. Satsuma annexa les îles Amami et préleva un tribut annuel, tandis que le royaume conservait son roi, son gouvernement et ses relations tributaires avec la Chine, que Satsuma et Ryūkyū dissimulèrent à la cour chinoise. Cette double subordination dura jusqu’en 1879, lorsque le Japon annexa Ryūkyū sous le nom de préfecture d’Okinawa.
