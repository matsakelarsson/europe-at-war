# French translations of the catalogue text (wave 10); step bodies follow later.
Toyotomi Invasion of Shikoku: Invasion de Shikoku par Toyotomi
? Hideyoshi’s conquest of Shikoku from Chōsokabe Motochika. From his home province of Tosa, Motochika had spent the 1570s and early 1580s overrunning Awa, Sanuki and Iyo; Oda Nobunaga had been about to send an army against him when he was killed in 1582, and in 1584 Motochika sided with Tokugawa Ieyasu and Oda Nobukatsu against Hideyoshi. By the spring of 1585, with the surrender of the Kōno of Iyo, he held nearly all of the island. Talks broke down over how much he would give up, and in the sixth month of 1585 Hideyoshi, who was ill, sent his brother Hashiba Hidenaga in his place with an army put at about 113,000 men, carried over the Inland Sea in hundreds of ships. Hidenaga and Hideyoshi’s nephew Hidetsugu crossed by way of Awaji and landed in Awa with some 60,000; Ukita Hideie’s army of about 23,000 landed at Yashima in Sanuki; and the Mōri, now Hideyoshi’s allies, sent 25,000 to 40,000 under Kobayakawa Takakage and Kikkawa Motonaga to Iyo, where they stormed Takao castle and killed Kaneko Motoie, Motochika’s chief ally in the east of the province. Motochika, with 20,000 to 40,000 men, had made his headquarters at Hakuchi castle in the west of Awa, where the four provinces meet, but the invaders came from three sides at once. The castle of Ichinomiya in Awa held out against Hidenaga for weeks until he cut off its water, and other Chōsokabe strongholds fell. Motochika wanted to fight on, but his retainers persuaded him that it was hopeless, and in the seventh month (August 1585) he submitted, keeping Tosa only. Awa went to Hachisuka Iemasa, Sanuki to Sengoku Hidehisa and Sogō Masayasu, and Iyo to Kobayakawa Takakage. Hideyoshi had become imperial regent (kampaku) during the campaign; Motochika and his men served him in Kyushu the next year.
: La conquête de Shikoku par Hideyoshi aux dépens de Chōsokabe Motochika. Depuis sa province natale de Tosa, Motochika avait passé les années 1570 et le début des années 1580 à envahir Awa, Sanuki et Iyo ; Oda Nobunaga s’apprêtait à envoyer une armée contre lui quand il fut tué en 1582, et en 1584 Motochika prit le parti de Tokugawa Ieyasu et d’Oda Nobukatsu contre Hideyoshi. Au printemps 1585, avec la reddition des Kōno d’Iyo, il tenait presque toute l’île. Les négociations échouèrent sur l’étendue de ce qu’il devait céder et, au sixième mois de 1585, Hideyoshi, malade, envoya à sa place son frère Hashiba Hidenaga avec une armée estimée à environ 113 000 hommes, transportée à travers la mer intérieure de Seto sur des centaines de navires. Hidenaga et Hidetsugu, neveu de Hideyoshi, passèrent par Awaji et débarquèrent en Awa avec quelque 60 000 hommes ; l’armée d’Ukita Hideie, forte d’environ 23 000 hommes, débarqua à Yashima, en Sanuki ; et les Mōri, désormais alliés de Hideyoshi, envoyèrent de 25 000 à 40 000 hommes sous Kobayakawa Takakage et Kikkawa Motonaga en Iyo, où ils prirent d’assaut le château de Takao et tuèrent Kaneko Motoie, principal allié de Motochika dans l’est de la province. Motochika, avec 20 000 à 40 000 hommes, avait établi son quartier général au château de Hakuchi, dans l’ouest d’Awa, là où se rejoignent les quatre provinces, mais les envahisseurs arrivèrent de trois côtés à la fois. Le château d’Ichinomiya, en Awa, résista à Hidenaga pendant des semaines, jusqu’à ce que celui-ci lui coupe l’eau, et d’autres places fortes des Chōsokabe tombèrent. Motochika voulait poursuivre la lutte, mais ses vassaux le persuadèrent que c’était sans espoir et, au septième mois (août 1585), il se soumit, ne conservant que Tosa. Awa revint à Hachisuka Iemasa, Sanuki à Sengoku Hidehisa et à Sogō Masayasu, et Iyo à Kobayakawa Takakage. Hideyoshi était devenu régent impérial (kampaku) pendant la campagne ; Motochika et ses hommes le servirent à Kyushu l’année suivante.
