# French translations of the catalogue text (wave 10); step bodies follow later.
Soviet invasion of South Sakhalin: Invasion soviétique du sud de Sakhaline
? "The Soviet conquest of Karafuto, the Japanese southern half of Sakhalin, in the last weeks of the Second World War. Japan had held Sakhalin south of the 50th parallel since the Treaty of Portsmouth of 1905, and by 1945 nearly 400,000 Japanese, Koreans and indigenous people lived there. At Yalta the Allies had promised South Sakhalin to the Soviet Union, which declared war on Japan on 8 August 1945. On 11 August the 56th Rifle Corps of the Soviet 16th Army attacked across the border into the fortified zone at Koton, defended by the Japanese 88th Division. Fighting went on after Emperor Hirohito announced Japan’s surrender on 15 August: the Soviet command wanted the island taken quickly, as a step towards a landing on Hokkaido that Stalin called off on 22 August, and the Japanese 5th Area Army in Sapporo ordered the division to keep defending it. The Koton garrison held out until it was ordered to lay down its arms on 19 August; Soviet troops landed at Tōro on 16 August and at Maoka on 20 August, where many civilians died, among them nine telephone operators who took their own lives. Soviet aircraft bombed Toyohara, the capital, on 22 August, the day a ceasefire was signed, and Soviet submarines sank or damaged three ships carrying evacuees off Rumoi on Hokkaido. Toyohara was occupied on 24 August and Ōtomari on 25 August. Japanese civilians in Karafuto also killed Korean neighbours suspected of spying, most notoriously at Mizuho. About 76,000 to 80,000 people had escaped to Hokkaido before the Soviets closed the island; most of the remaining Japanese were repatriated in 1946–1949, while some 43,000 Koreans were left behind. The Soviet Union annexed South Sakhalin on 2 February 1946."
: "La conquête par les Soviétiques de Karafuto, la moitié sud, japonaise, de Sakhaline, dans les dernières semaines de la Seconde Guerre mondiale. Le Japon tenait Sakhaline au sud du 50e parallèle depuis le traité de Portsmouth de 1905 et, en 1945, près de 400 000 Japonais, Coréens et autochtones y vivaient. À Yalta, les Alliés avaient promis le sud de Sakhaline à l’Union soviétique, qui déclara la guerre au Japon le 8 août 1945. Le 11 août, le 56e corps de fusiliers de la 16e armée soviétique franchit la frontière et attaqua la zone fortifiée de Koton, défendue par la 88e division japonaise. Les combats se poursuivirent après l’annonce de la capitulation du Japon par l’empereur Hirohito le 15 août : le commandement soviétique voulait s’emparer rapidement de l’île, comme étape vers un débarquement à Hokkaido auquel Staline renonça le 22 août, et la 5e armée régionale japonaise, à Sapporo, ordonna à la division de continuer à la défendre. La garnison de Koton tint jusqu’à ce qu’elle reçoive l’ordre de déposer les armes, le 19 août ; les troupes soviétiques débarquèrent à Tōro le 16 août et à Maoka le 20 août, où de nombreux civils périrent, parmi lesquels neuf téléphonistes qui se donnèrent la mort. L’aviation soviétique bombarda Toyohara, la capitale, le 22 août, jour de la signature d’un cessez-le-feu, et des sous-marins soviétiques coulèrent ou endommagèrent trois navires transportant des évacués au large de Rumoi, à Hokkaido. Toyohara fut occupée le 24 août et Ōtomari le 25 août. Des civils japonais de Karafuto tuèrent aussi des voisins coréens soupçonnés d’espionnage, le cas le plus tristement célèbre étant celui de Mizuho. Environ 76 000 à 80 000 personnes avaient fui vers Hokkaido avant que les Soviétiques ne ferment l’île ; la plupart des Japonais restants furent rapatriés en 1946–1949, tandis que quelque 43 000 Coréens furent laissés sur place. L’Union soviétique annexa le sud de Sakhaline le 2 février 1946."
