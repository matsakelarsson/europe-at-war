# French translations of the catalogue text (wave 10); step bodies follow later.
Soviet invasion of the Kuril Islands: Invasion soviétique des îles Kouriles
? The Soviet occupation of the Kuril Islands, the chain of volcanic islands between Kamchatka and Hokkaido, at the very end of the Second World War, and the expulsion of their Japanese inhabitants. The northern Kurils had been Japanese since the Treaty of Saint Petersburg of 1875, the southern islands since the Treaty of Shimoda of 1855, and at Yalta the Allies had promised the Kurils to the Soviet Union. Three days after Japan announced its surrender, on 18 August 1945, Soviet troops from Kamchatka landed on Shumshu, the northernmost island, where the Japanese 91st Division fought back with tanks until it was ordered to lay down its arms; the fighting, the last large battle of the war, ended on 23 August with heavy losses on the Soviet side. Soviet forces then occupied the islands southwards to Urup without resistance, and ships from Sakhalin landed troops on Iturup on 28 August, on Kunashir and Shikotan on 1 September and on the Habomai islets by 5 September, after Japan had signed the instrument of surrender on 2 September. About 50,000 Japanese soldiers were taken prisoner. Of the roughly 17,000 Japanese living on the four southern islands, about half fled to Hokkaido in small boats; the rest were deported to Japan in 1947–1949. The Soviet Union annexed the islands on 2 February 1946. Japan claims the four southern islands, Etorofu (Iturup), Kunashiri, Shikotan and the Habomai islands, as its Northern Territories, while Russia holds that they became Soviet by the post-war settlement; the dispute has prevented a peace treaty between the two countries.
: L’occupation soviétique des îles Kouriles, la chaîne d’îles volcaniques située entre le Kamtchatka et Hokkaido, à la toute fin de la Seconde Guerre mondiale, et l’expulsion de leurs habitants japonais. Les Kouriles du Nord étaient japonaises depuis le traité de Saint-Pétersbourg de 1875 et les îles du Sud depuis le traité de Shimoda de 1855, et à Yalta les Alliés avaient promis les Kouriles à l’Union soviétique. Le 18 août 1945, trois jours après que le Japon eut annoncé sa capitulation, des troupes soviétiques venues du Kamtchatka débarquèrent sur Choumchou, l’île la plus septentrionale, où la 91e division japonaise riposta avec des chars jusqu’à ce qu’elle reçoive l’ordre de déposer les armes ; les combats, la dernière grande bataille de la guerre, prirent fin le 23 août avec de lourdes pertes du côté soviétique. Les forces soviétiques occupèrent ensuite les îles vers le sud jusqu’à Ouroup sans rencontrer de résistance, et des navires venus de Sakhaline débarquèrent des troupes sur Itouroup le 28 août, sur Kounachir et Chikotan le 1er septembre et sur les îlots Habomai au plus tard le 5 septembre, après que le Japon eut signé l’acte de capitulation le 2 septembre. Environ 50 000 soldats japonais furent faits prisonniers. Sur les quelque 17 000 Japonais qui vivaient dans les quatre îles du Sud, la moitié environ s’enfuit à Hokkaido dans de petites embarcations ; les autres furent déportés au Japon en 1947–1949. L’Union soviétique annexa les îles le 2 février 1946. Le Japon revendique les quatre îles du Sud, Etorofu (Itouroup), Kunashiri, Shikotan et les îles Habomai, comme ses Territoires du Nord, tandis que la Russie soutient qu’elles sont devenues soviétiques en vertu du règlement d’après-guerre ; le différend a empêché la conclusion d’un traité de paix entre les deux pays.
