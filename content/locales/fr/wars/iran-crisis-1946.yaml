# French translations of the catalogue text (wave 7); step bodies follow later.
Iran crisis of 1946: Crise irano-soviétique de 1946
One of the first crises of the Cold War. Soviet troops, who had occupied northern Iran with the British since 1941, stayed on after the war, and under their protection the Azerbaijan Democratic Party of Ja’far Pishevari set up an autonomous Azerbaijan People’s Government in Tabriz in December 1945, while Kurdish nationalists under Qazi Muhammad proclaimed the Republic of Mahabad in January 1946. Iran took its case to the new UN Security Council, and Prime Minister Ahmad Qavam persuaded Stalin to withdraw his troops in return for the promise of an oil concession. Once the Soviet troops had left, in May 1946, the Iranian army moved in; the Tabriz government collapsed and Iranian troops entered Tabriz on 13 December and Mahabad on 15 December 1946. Qazi Muhammad was hanged in 1947, and the Iranian parliament rejected the Soviet oil concession.: L’une des premières crises de la guerre froide. Les troupes soviétiques, qui occupaient le nord de l’Iran avec les Britanniques depuis 1941, restèrent après la guerre et, sous leur protection, le Parti démocrate d’Azerbaïdjan de Ja’far Pishevari établit à Tabriz, en décembre 1945, un Gouvernement populaire d’Azerbaïdjan autonome, tandis que des nationalistes kurdes menés par Qazi Muhammad proclamaient la République de Mahabad en janvier 1946. L’Iran porta l’affaire devant le tout nouveau Conseil de sécurité de l’ONU, et le Premier ministre Ahmad Qavam persuada Staline de retirer ses troupes en échange de la promesse d’une concession pétrolière. Une fois les troupes soviétiques parties, en mai 1946, l’armée iranienne intervint ; le gouvernement de Tabriz s’effondra et les troupes iraniennes entrèrent à Tabriz le 13 décembre et à Mahabad le 15 décembre 1946. Qazi Muhammad fut pendu en 1947, et le Parlement iranien rejeta la concession pétrolière soviétique.
