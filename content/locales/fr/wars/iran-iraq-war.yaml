# French translations of the catalogue text (wave 7); step bodies follow later.
Iran–Iraq War: Guerre Iran-Irak
The war between Iraq under Saddam Hussein and the Islamic Republic of Iran, which Iraq began on 22 September 1980 by invading the Iranian oil province of Khuzestan, hoping to win the Shatt al-Arab waterway and to strike at the new revolutionary government before it could stir up Iraq’s Shia majority. Iran drove the invaders back by 1982 and then fought for six years on Iraqi soil, using waves of young volunteers against Iraqi defences, while Iraq used chemical weapons, attacked Iran’s cities and oil exports and, at home, killed tens of thousands of Kurds in the Anfal campaign. The war spread to Gulf shipping and drew in the US Navy. Iran accepted the UN’s ceasefire resolution in July 1988, after a last series of Iraqi victories, and the fighting stopped on 20 August 1988 with the borders unchanged. Estimates of the dead range from about 300,000 to well over half a million, most of them Iranian.: La guerre entre l’Irak de Saddam Hussein et la République islamique d’Iran, que l’Irak déclencha le 22 septembre 1980 en envahissant la province pétrolière iranienne du Khouzistan, dans l’espoir de s’emparer de la voie navigable du Chatt al-Arab et de frapper le nouveau gouvernement révolutionnaire avant qu’il ne puisse soulever la majorité chiite de l’Irak. L’Iran avait repoussé les envahisseurs en 1982 et combattit ensuite pendant six ans sur le sol irakien, lançant des vagues de jeunes volontaires contre les défenses irakiennes, tandis que l’Irak employait des armes chimiques, attaquait les villes et les exportations pétrolières de l’Iran et, sur son propre territoire, tuait des dizaines de milliers de Kurdes lors de la campagne d’Anfal. La guerre s’étendit à la navigation dans le Golfe et entraîna l’intervention de la marine américaine. L’Iran accepta la résolution de cessez-le-feu de l’ONU en juillet 1988, après une dernière série de victoires irakiennes, et les combats cessèrent le 20 août 1988, sans que les frontières aient changé. Les estimations du nombre de morts vont d’environ 300 000 à bien plus d’un demi-million, iraniens pour la plupart.
