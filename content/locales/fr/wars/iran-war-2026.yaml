# French translations of the catalogue text (wave 7); step bodies follow later.
2026 Iran war: Guerre d’Iran de 2026
? A war between Iran and the United States and Israel that began on 28 February 2026, eight months after the Twelve-Day War, when US and Israeli strikes (Operation Epic Fury and Operation Roaring Lion) killed Supreme Leader Ali Khamenei and much of Iran’s military leadership. Iran answered with missiles and drones fired at Israel, at US bases and at the Gulf states that host them, and closed the Strait of Hormuz, causing what the International Energy Agency called the largest oil supply disruption in history. Hezbollah in Lebanon, where Israel invaded the south, armed groups in Iraq and the Houthis in Yemen joined in on Iran’s side, and Khamenei’s son Mojtaba succeeded him as supreme leader. A ceasefire brokered by Pakistan on 7–8 April, failed talks in Islamabad and a US naval blockade of Iranian ports were followed on 17 June by the Islamabad Memorandum, which suspended the fighting for 60 days, but it collapsed in July after attacks on shipping. Since then the blockade and Iran’s closure of the strait have continued, with intermittent strikes and stalled talks. Thousands have been killed, most of them in Iran and Lebanon. Last updated 27 November 2026.
: "Une guerre opposant l’Iran aux États-Unis et à Israël, qui commença le 28 février 2026, huit mois après la guerre des Douze Jours, lorsque des frappes américaines et israéliennes (opérations Epic Fury et Roaring Lion) tuèrent le guide suprême Ali Khamenei et une grande partie de la direction militaire iranienne. L’Iran riposta en tirant des missiles et des drones sur Israël, sur les bases américaines et sur les États du Golfe qui les accueillent, et ferma le détroit d’Ormuz, provoquant ce que l’Agence internationale de l’énergie (AIE) qualifia de plus grande perturbation de l’approvisionnement pétrolier de l’histoire. Le Hezbollah au Liban, pays dont Israël envahit le sud, des groupes armés en Irak et les Houthis au Yémen entrèrent dans la guerre aux côtés de l’Iran, et Mojtaba, le fils de Khamenei, lui succéda comme guide suprême. Un cessez-le-feu négocié par le Pakistan les 7 et 8 avril, des pourparlers infructueux à Islamabad et un blocus naval des ports iraniens par les États-Unis furent suivis, le 17 juin, du mémorandum d’Islamabad, qui suspendit les combats pour 60 jours mais s’effondra en juillet après des attaques contre la navigation. Depuis, le blocus et la fermeture du détroit par l’Iran se poursuivent, ponctués de frappes intermittentes, et les négociations sont au point mort. Des milliers de personnes ont été tuées, pour la plupart en Iran et au Liban. Dernière mise à jour : 27 novembre 2026."
