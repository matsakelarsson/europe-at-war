# French translations of the catalogue text (wave 7); step bodies follow later.
Iranian Revolution: Révolution iranienne
? The revolution that overthrew Mohammad Reza Shah Pahlavi and made Iran an Islamic republic under Ayatollah Ruhollah Khomeini. Opposition to the Shah’s autocratic rule, his secret police (SAVAK), inequality and rapid Westernisation united clergy, bazaar merchants, students, liberals and leftists. After police fired on seminary students in Qom in January 1978, mourning ceremonies every forty days grew into nationwide protests; a fire at the Cinema Rex in Abadan in August, which killed more than 400 people and was blamed on the government, though Islamist militants were later convicted, and the shooting of demonstrators in Tehran’s Jaleh Square on “Black Friday”, 8 September 1978, turned many against the Shah. Strikes, above all in the oil industry, paralysed the country through the autumn, and millions marched in December. The Shah left Iran on 16 January 1979, Khomeini returned from exile on 1 February, and on 11 February the army declared itself neutral and the monarchy fell after two days of street fighting. An Islamic Republic was proclaimed after a referendum on 1 April 1979.
: La révolution qui renversa Mohammad Reza Shah Pahlavi et fit de l’Iran une république islamique sous l’autorité de l’ayatollah Rouhollah Khomeini. L’opposition au pouvoir autocratique du shah, à sa police secrète (la SAVAK), aux inégalités et à l’occidentalisation rapide unit religieux, marchands du bazar, étudiants, libéraux et militants de gauche. Après que la police eut tiré sur des étudiants en religion à Qom en janvier 1978, les cérémonies de deuil célébrées tous les quarante jours se transformèrent en manifestations dans tout le pays ; l’incendie du cinéma Rex à Abadan en août, qui fit plus de 400 morts et fut imputé au gouvernement, bien que des militants islamistes aient été condamnés par la suite, puis la fusillade de manifestants sur la place Jaleh, à Téhéran, lors du « Vendredi noir », le 8 septembre 1978, retournèrent beaucoup de gens contre le shah. Les grèves, surtout dans l’industrie pétrolière, paralysèrent le pays tout l’automne, et des millions de personnes défilèrent en décembre. Le shah quitta l’Iran le 16 janvier 1979, Khomeini rentra d’exil le 1er février et, le 11 février, l’armée se déclara neutre et la monarchie tomba après deux jours de combats de rue. Une République islamique fut proclamée le 1er avril 1979, à l’issue d’un référendum.
