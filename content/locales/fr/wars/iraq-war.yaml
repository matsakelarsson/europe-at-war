# French translations of the catalogue text (wave 7); step bodies follow later.
Iraq War: Guerre d’Irak
The war that began with the invasion of Iraq by the United States, Britain and their allies on 20 March 2003, without the explicit authorisation of the UN Security Council, to overthrow Saddam Hussein, whose government they accused of hiding weapons of mass destruction and of links to terrorism; no such weapons were found. Baghdad fell on 9 April, but the occupation that followed, the dissolution of the Iraqi army and the purge of Ba’ath party members were followed by a Sunni Arab insurgency, uprisings by the Shia cleric Muqtada al-Sadr’s Mahdi Army and, after the bombing of the Shia shrine at Samarra in 2006, a sectarian civil war in which tens of thousands of civilians were killed. A US troop “surge” in 2007 and the turn of Sunni tribes against al-Qaeda in Iraq reduced the violence, and under a 2008 agreement with the elected Iraqi government the last US troops left on 18 December 2011. Estimates of the violent deaths range from about 150,000 to several hundred thousand.: La guerre qui commença par l’invasion de l’Irak par les États-Unis, la Grande-Bretagne et leurs alliés le 20 mars 2003, sans autorisation explicite du Conseil de sécurité de l’ONU, afin de renverser Saddam Hussein, dont ils accusaient le gouvernement de cacher des armes de destruction massive et d’entretenir des liens avec le terrorisme ; aucune arme de ce type ne fut trouvée. Bagdad tomba le 9 avril, mais l’occupation qui suivit, la dissolution de l’armée irakienne et la purge des membres du parti Baas furent suivies d’une insurrection arabe sunnite, de soulèvements de l’armée du Mahdi du religieux chiite Moqtada al-Sadr et, après l’attentat contre le sanctuaire chiite de Samarra en 2006, d’une guerre civile confessionnelle au cours de laquelle des dizaines de milliers de civils furent tués. L’envoi de renforts américains en 2007 (le « surge ») et le retournement des tribus sunnites contre al-Qaïda en Irak firent reculer la violence et, en vertu d’un accord conclu en 2008 avec le gouvernement irakien élu, les dernières troupes américaines partirent le 18 décembre 2011. Les estimations du nombre de morts violentes vont d’environ 150 000 à plusieurs centaines de milliers.
