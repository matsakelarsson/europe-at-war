# French translations of the catalogue text (wave 7); step bodies follow later.
Iraqi Kurdish Civil War: Guerre civile kurde irakienne
? The war between the two main Kurdish parties of northern Iraq, Masoud Barzani’s Kurdistan Democratic Party (KDP) and Jalal Talabani’s Patriotic Union of Kurdistan (PUK), in the self-governing Kurdish region that had existed since 1991 under Western air protection. Quarrels over land and over the customs revenue from trade with Turkey turned into open fighting in May 1994, and the regional parliament and government split in two. In August 1996 the PUK, with Iranian support, drove towards Erbil, and Barzani called in Saddam Hussein. On 31 August some 30,000 Iraqi troops took Erbil for the KDP and executed many members of the opposition Iraqi National Congress, and the United States answered with cruise missile strikes on southern Iraq. The KDP went on to take Sulaymaniyah, which the PUK retook in October. Fighting flared again in 1997, with the Turkish army entering on the KDP’s side against the PUK and the PKK, until a ceasefire on 24 November 1997. The Washington Agreement of September 1998 ended the war, though the region stayed divided into KDP and PUK zones for years.
: La guerre entre les deux principaux partis kurdes du nord de l’Irak, le Parti démocratique du Kurdistan (PDK) de Massoud Barzani et l’Union patriotique du Kurdistan (UPK) de Jalal Talabani, dans la région kurde autonome qui existait depuis 1991 sous la protection aérienne occidentale. Des querelles à propos de terres et des recettes douanières tirées du commerce avec la Turquie dégénérèrent en combats ouverts en mai 1994, et le parlement et le gouvernement régionaux se scindèrent en deux. En août 1996, l’UPK, avec le soutien de l’Iran, progressa vers Erbil, et Barzani fit appel à Saddam Hussein. Le 31 août, quelque 30 000 soldats irakiens prirent Erbil pour le compte du PDK et exécutèrent de nombreux membres du Congrès national irakien, formation d’opposition, et les États-Unis ripostèrent par des frappes de missiles de croisière sur le sud de l’Irak. Le PDK prit ensuite Souleimaniye, que l’UPK reprit en octobre. Les combats se rallumèrent en 1997, l’armée turque intervenant aux côtés du PDK contre l’UPK et le PKK, jusqu’à un cessez-le-feu le 24 novembre 1997. L’accord de Washington de septembre 1998 mit fin à la guerre, même si la région resta pendant des années divisée en zones du PDK et de l’UPK.
Kurdistan Democratic Party (KDP): Parti démocratique du Kurdistan (PDK)
Patriotic Union of Kurdistan (PUK): Union patriotique du Kurdistan (UPK)
Iraq (1996, with the KDP): Irak (1996, aux côtés du PDK)
Iran (with the PUK): Iran (aux côtés de l’UPK)
