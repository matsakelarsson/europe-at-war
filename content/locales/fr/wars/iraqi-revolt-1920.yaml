# French translations of the catalogue text (wave 7); step bodies follow later.
Iraqi revolt of 1920: Révolte irakienne de 1920
A rising against British rule in Iraq, which Britain had conquered from the Ottoman Empire in the First World War and received as a League of Nations mandate in April 1920. Shia clerics, tribal sheikhs of the Euphrates and nationalist former Ottoman officers, Shia and Sunni together, demanded an Arab government. The tribes held most of the middle Euphrates for weeks before British and Indian reinforcements and the Royal Air Force put the revolt down by the end of October. Its cost led Britain to rule Iraq indirectly, through King Faisal I, from 1921.: Un soulèvement contre la domination britannique en Irak, que la Grande-Bretagne avait conquis sur l’Empire ottoman pendant la Première Guerre mondiale et reçu en mandat de la Société des Nations en avril 1920. Des religieux chiites, des cheikhs tribaux de l’Euphrate et d’anciens officiers ottomans nationalistes, chiites et sunnites réunis, réclamaient un gouvernement arabe. Les tribus tinrent la plus grande partie du moyen Euphrate pendant des semaines, avant que des renforts britanniques et indiens et la Royal Air Force ne viennent à bout de la révolte à la fin d’octobre. Son coût conduisit la Grande-Bretagne à gouverner l’Irak de manière indirecte, par l’intermédiaire du roi Fayçal Ier, à partir de 1921.
