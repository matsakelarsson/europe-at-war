# French translations of the catalogue text (wave 7); step bodies follow later.
1991 Iraqi uprisings: Soulèvements de 1991 en Irak
The revolts that broke out across southern and northern Iraq after the Gulf War ceasefire, against Saddam Hussein’s government. Beginning in Basra on 1 March 1991 among soldiers retreating from Kuwait, the uprising spread within days through the Shia cities of the south, and from 5 March the Kurds rose in the north, taking Sulaymaniyah, Erbil and, on 20 March, Kirkuk. At their height the rebels held 14 of Iraq’s 18 provinces. But the Republican Guard had survived the war, the coalition allowed Iraq to fly helicopters, and the United States, which had called on Iraqis to rise, did not intervene. By early April loyal forces had crushed the revolts with great brutality, shelling the shrine cities of Najaf and Karbala and executing thousands. Nearly two million people, most of them Kurds, fled towards Turkey and Iran, and the UN Security Council’s Resolution 688 led to a Western-protected safe haven in the north and, later, Kurdish self-rule.: Les révoltes qui éclatèrent dans le sud et le nord de l’Irak après le cessez-le-feu de la guerre du Golfe, contre le gouvernement de Saddam Hussein. Partie de Bassora le 1er mars 1991, parmi des soldats qui se repliaient du Koweït, l’insurrection gagna en quelques jours les villes chiites du sud, et à partir du 5 mars les Kurdes se soulevèrent dans le nord, prenant Souleimaniye, Erbil et, le 20 mars, Kirkouk. À leur apogée, les insurgés tenaient 14 des 18 provinces de l’Irak. Mais la Garde républicaine avait survécu à la guerre, la coalition autorisa l’Irak à faire voler des hélicoptères, et les États-Unis, qui avaient appelé les Irakiens à se soulever, n’intervinrent pas. Au début d’avril, les forces loyalistes avaient écrasé les révoltes avec une grande brutalité, bombardant les villes saintes de Nadjaf et de Kerbala et procédant à des milliers d’exécutions. Près de deux millions de personnes, kurdes pour la plupart, fuirent vers la Turquie et l’Iran, et la résolution 688 du Conseil de sécurité de l’ONU conduisit à la création d’une zone de sécurité sous protection occidentale dans le nord puis, plus tard, à l’autonomie kurde.
