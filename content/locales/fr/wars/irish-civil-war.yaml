# Some French text was translated automatically.
"Irish Civil War": "Guerre civile irlandaise"
? "A war between the government of the new Irish state, which accepted the Anglo-Irish Treaty of 1921, and the republicans of the anti-Treaty IRA, who saw the Treaty as a betrayal of the Irish Republic. Anti-Treaty fighters had occupied the Four Courts in Dublin in April 1922, and on 28 June the National Army began shelling them with field guns lent by Britain. The government took Dublin within a week and the towns of the self-styled “Munster Republic” in the south by August, but a bitter guerrilla war went on for months. Michael Collins, the army’s commander-in-chief, was killed in an ambush at Béal na Bláth in County Cork on 22 August 1922. Republicans killed a member of the Dáil and burned the houses of senators; the government executed 81 republican prisoners, and its troops killed others out of hand, as at Ballyseedy in Kerry. After the IRA’s chief of staff, Liam Lynch, was killed in April 1923, his successor Frank Aiken ordered his men on 24 May to dump their arms. Estimates of the dead range from about 1,500 to just under 2,000. The split shaped Irish politics for generations; Fine Gael and Fianna Fáil both trace their origins to the two sides."
: "Une guerre entre le gouvernement du nouvel État irlandais, qui a accepté le traité anglo-irlandais de 1921, et les républicains de l’IRA antitraitée, qui ont vu le traité comme une trahison de la République irlandaise. Les combattants contre traités avaient occupé les quatre tribunaux à Dublin en avril 1922, et le 28 juin l’armée nationale a commencé à les bombarder avec des armes de campagne prêtées par la Grande-Bretagne. Le gouvernement a pris Dublin en une semaine et les villes de l’auto-republique de Munster dans le sud en août, mais une guerre de guérilla amère a continué pendant des mois. Michael Collins, le commandant en chef de l’armée, a été tué dans une embuscade à Béal na Bláth dans le comté de Cork le 22 août 1922. Les républicains ont tué un membre du Dáil et brûlé les maisons des sénateurs ; le gouvernement a exécuté 81 prisonniers républicains, et ses troupes en ont tué d’autres hors de la main, comme à Ballyseedy à Kerry. Après le chef d’état-major de l’IRA, Liam Lynch, a été tué en avril 1923, son successeur Frank Aiken a ordonné à ses hommes le 24 mai de jeter leurs armes. La scission a façonné la politique irlandaise pendant des générations ; Fine Gael et Fianna Fáil retracent tous deux leurs origines aux deux côtés."
"The pro-Treaty government was the Provisional Government set up under the Treaty until the Irish Free State came into being on 6 December 1922.": "Le gouvernement pro-traité est le gouvernement provisoire créé en vertu du traité jusqu’à ce que l’État libre d’Irlande entre en vigueur le 6 décembre 1922."
