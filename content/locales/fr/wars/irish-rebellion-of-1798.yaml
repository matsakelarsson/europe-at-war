"May – July 1798": "mai – juillet 1798"
"The Society of United Irishmen, founded in Belfast in 1791 mainly by Presbyterian radicals, had turned from reform to republican revolution and sought help from France; a French fleet with Wolfe Tone on board reached Bantry Bay in December 1796 but could not land in the storms. In 1797 and 1798 the government broke up the movement in Ulster and Leinster under martial law, with house-burnings, floggings and pitch-capping, and in March 1798 it arrested most of the Leinster leaders. The rising began on the night of 23 May with attacks around Dublin and in Kildare, Meath and Carlow, which were quickly crushed; prisoners were shot at Dunlavin and Carnew, and the rebels were routed at Tara Hill on 26 May.": "La Société des Irlandais unis, fondée à Belfast en 1791 principalement par les radicaux presbytériens, s’était tournée vers la révolution républicaine et avait demandé l’aide de la France ; une flotte française avec Wolfe Tone à bord atteignit Bantry Bay en décembre 1796 mais ne pouvait atterrir dans les tempêtes. En 1797 et 1798, le gouvernement rompt le mouvement à Ulster et à Leinster en vertu de la loi martiale, avec des brûlures de maisons, des flagellations et des coups de pied, et en mars 1798 il arrêta la plupart des dirigeants de Leinster. La montée a commencé dans la nuit du 23 mai avec des attaques autour de Dublin et à Kildare, Meath et Carlow, qui ont été rapidement écrasés ; des prisonniers ont été abattus sur Dunlavin et Carnew, et les rebelles ont été acheminés à Tara Hill le 26 mai."
"In County Wexford, where Catholic priests such as Father John Murphy led many of them, the rising became a mass revolt. The rebels destroyed a militia detachment at Oulart Hill on 27 May, took Enniscorthy and Wexford town and held most of the county for three weeks. Their attacks on New Ross and Arklow failed with heavy losses. On the day of New Ross rebels killed at least 100 loyalist prisoners, most of them Protestants, at Scullabogue, and more on Wexford bridge on 20 June. In Ulster the rebels of Antrim and Down were beaten at Antrim on 7 June and Ballynahinch on 13 June. On 21 June General Gerard Lake’s army stormed the main rebel camp on Vinegar Hill above Enniscorthy, and government troops killed rebels and civilians in great numbers in the weeks that followed.": "Dans le comté de Wexford, où des prêtres catholiques comme le père John Murphy menaient beaucoup d’entre eux, la montée est devenue une révolte de masse. Les rebelles ont détruit un détachement de milice à Oulart Hill le 27 mai, a pris Enniscorthy et la ville de Wexford et tenu la plupart du comté pendant trois semaines. Leurs attaques sur New Ross et Arklow ont échoué avec de lourdes pertes. Le jour de New Ross, les rebelles ont tué au moins 100 prisonniers loyalistes, dont la plupart protestants, à Scullabogue, et d’autres sur le pont de Wexford le 20 juin. À Ulster, les rebelles d’Antrim et Down ont été battus à Antrim le 7 juin et Ballynahinch le 13 juin. Le 21 juin, l’armée du général Gerard Lake a pris d’assaut le principal camp rebelle sur la colline de Vinegar au-dessus d’Enniscorthy, et les troupes gouvernementales ont tué en grand nombre des rebelles et des civils dans les semaines qui ont suivi."
