# Some French text was translated automatically.
"Irish Rebellion of 1798": "Rébellion irlandaise de 1798"
"A rising led by the Society of United Irishmen against British rule in the Kingdom of Ireland, aiming at an independent republic with French help. Risings in Leinster and Ulster in May and June 1798 were crushed, most bloodily in County Wexford, and a small French force that landed in Mayo in August surrendered at Ballinamuck. Tens of thousands died, and the rebellion led to the union of Ireland with Great Britain in 1801.": "Une montée menée par la Society of United Irishmen contre le gouvernement britannique dans le Royaume d’Irlande, visant à une république indépendante avec l’aide de la France. Risings à Leinster et Ulster en mai et juin 1798 ont été écrasés, le plus sanglant dans le comté de Wexford, et une petite force française qui a atterri à Mayo en août se rend à Ballinamuck. Des dizaines de milliers sont morts, et la rébellion a conduit à l’union de l’Irlande avec la Grande-Bretagne en 1801."
"The government forces were mostly Irish militia and yeomanry, with British regular and fencible regiments and German mercenaries. The rebels were mostly Catholic in Leinster and Connacht and mostly Presbyterian in Ulster; sectarian killings took place on both sides.": "Les forces gouvernementales étaient pour la plupart des milices et des yeomanry irlandais, avec des régiments britanniques réguliers et fencibles et des mercenaires allemands. Les rebelles étaient principalement catholiques à Leinster et Connacht et surtout presbytériens à Ulster ; des meurtres sectaires ont eu lieu de part et d’autre."
"Estimates of the dead range from about 10,000 to 50,000, most of them rebels and civilians.": "On estime que les morts vont d’environ 10 000 à 50 000 personnes, dont la plupart sont des rebelles et des civils."
