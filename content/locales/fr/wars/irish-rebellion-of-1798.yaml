"The French at Killala": "Les Français à Killala"
"August – November 1798": "août – novembre 1798"
"The French Directory sent help too late. On 22 August 1798 General Jean Humbert landed about 1,000 French soldiers at Kilcummin near Killala in County Mayo, and some thousands of local men joined him. On 27 August he routed a larger force of militia and regulars under General Lake at Castlebar, where the government troops fled so fast that the battle became known as the “Races of Castlebar”. A Republic of Connacht was proclaimed, with John Moore as its president. Humbert then marched north-east through County Sligo and turned towards the midlands, where new risings broke out in Longford and Westmeath.": "Le 22 août 1798, le général Jean Humbert débarqua environ 1 000 soldats français à Kilcummin près de Killala dans le comté de Mayo, et quelques milliers d’hommes locaux s’y joignirent. Le 27 août, il dirigea une force plus importante de miliciens et de réguliers sous le lac général à Castlebar, où les troupes gouvernementales s’enfuirent si vite que la bataille devint connue sous le nom de \"Races de Castlebar\". Une République de Connacht fut proclamée, avec John Moore comme président. Humbert marcha ensuite au nord-est à travers le comté de Sligo et se tourna vers le milieu des terres, où de nouvelles montées éclatèrent à Longford et Westmeath."
"The new Lord Lieutenant, Lord Cornwallis, closed in with much larger forces. Humbert fought his way past a militia force at Collooney on 5 September, but on 8 September, surrounded at Ballinamuck in County Longford, he surrendered. The French were treated as prisoners of war and sent home; the Irish who had joined them were cut down or hanged. On 12 October a British squadron defeated a second French expedition off Tory Island, and Wolfe Tone, captured on board, was sentenced to death in Dublin and died of a self-inflicted wound on 19 November. The British government now pressed for union, and under the Acts of Union Ireland and Great Britain became the United Kingdom on 1 January 1801.": "Le nouveau lord lieutenant, Lord Cornwallis, ferma ses portes avec des forces beaucoup plus grandes. Humbert se battit devant une milice à Collooney le 5 septembre, mais le 8 septembre, entouré de Ballinamuck dans le comté de Longford, il se rendit. Les Français furent traités comme des prisonniers de guerre et renvoyés chez eux ; les Irlandais qui les avaient rejoints furent abattus ou pendus. Le 12 octobre, un escadron britannique défait une deuxième expédition française au large de Tory Island, et Wolfe Tone, capturé à bord, fut condamné à mort à Dublin et mourut d’une blessure auto-infligée le 19 novembre. Le gouvernement britannique pressa maintenant l’union, et sous les Actes de l’Union irlandaise et de la Grande-Bretagne devint le Royaume-Uni le 1er janvier 1801."
