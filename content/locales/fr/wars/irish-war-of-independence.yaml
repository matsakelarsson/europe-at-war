# Some French text was translated automatically.
"Irish War of Independence": "Guerre d’indépendance irlandaise"
"A guerrilla war between the Irish Republican Army, fighting for the Irish Republic declared by Dáil Éireann in January 1919, and British forces, including the police reinforcements known as the Black and Tans and the Auxiliaries. It ended in a truce in July 1921; the Anglo-Irish Treaty of December 1921 created the self-governing Irish Free State, while Northern Ireland, set up earlier that year, stayed in the United Kingdom.": "Une guerre de guérilla entre l’armée républicaine irlandaise, combattant pour la République irlandaise déclarée par Dáil Éireann en janvier 1919, et les forces britanniques, y compris les renforts policiers connus sous le nom de Black and Tans and the Auxiliarys. Elle a pris fin en juillet 1921 ; le traité anglo-irlandais de décembre 1921 créa l’État libre irlandais autogéré, tandis que l’Irlande du Nord, créée plus tôt cette année-là, restait au Royaume-Uni."
"Also called the Anglo-Irish War and, in Ireland, the Tan War. Britain did not recognise the Irish Republic, and all of Ireland remained part of the United Kingdom until the Irish Free State was established on 6 December 1922.": "Aussi appelé la guerre anglo-irlandaise et, en Irlande, la guerre de Tan. La Grande-Bretagne ne reconnaît pas la République irlandaise, et toute l’Irlande reste une partie du Royaume-Uni jusqu’à ce que l’État libre d’Irish soit créé le 6 décembre 1922."
"The British forces were the army and the Royal Irish Constabulary (RIC), reinforced by recruits from Britain, and in the north the mainly Protestant Ulster Special Constabulary. The figure of about 2,300 dead is based on research by the historian Eunan O’Halpin; other counts differ.": "Les forces britanniques étaient l’armée et le Royal Irish Constabulary (RIC), renforcé par des recrues de Grande-Bretagne, et dans le nord le principalement protestant Ulster Special Constabulary. Le chiffre d’environ 2300 morts est basé sur la recherche de l’historien Eunan O=Halpin ; d’autres chefs diffèrent."
