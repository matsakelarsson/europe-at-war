"Bloody Sunday, the burning of Cork and the Treaty": "Dimanche sanglant, le feu de Cork et le Traité"
"November 1920 – December 1921": "novembre 1920 – décembre 1921"
"On the morning of 21 November 1920, Bloody Sunday, Collins’s men shot dead about 15 men in Dublin, most of them British officers believed to be intelligence agents. That afternoon police and Auxiliaries opened fire on the crowd at a Gaelic football match in Croke Park, killing 14 civilians. A week later Tom Barry’s West Cork flying column wiped out a patrol of Auxiliaries at Kilmichael. Martial law was declared in four Munster counties on 10 December, and the next night, after an ambush in the city, Auxiliaries, Black and Tans and soldiers burned the centre of Cork.": "Dans la matinée du 21 novembre 1920, le dimanche sanglant Collins a tué une quinzaine d’hommes à Dublin, dont la plupart étaient des agents de renseignement britanniques. L’après-midi, la police et les auxiliaires ont ouvert le feu sur la foule lors d’un match de football gaélique à Croke Park, tuant 14 civils. La loi martiale a été déclarée dans quatre comtés de Munster le 10 décembre, et la nuit suivante, après une embuscade dans la ville, Auxiliaires, Noirs et Tans et des soldats ont brûlé le centre de Cork."
"About 1,000 people were killed between January and July 1921, the worst months of the war, most of them in Munster, Dublin and Belfast. Flying columns ambushed troops, as at Crossbarry in March; Britain executed IRA prisoners and burned houses in reprisal. In May the IRA burned the Custom House in Dublin, but five of its men were killed and more than 80 captured. Under the Government of Ireland Act, Northern Ireland was set up on 3 May 1921, and George V opened its parliament in Belfast on 22 June.": "Environ 1 000 personnes ont été tuées entre janvier et juillet 1921, les pires mois de la guerre, la plupart à Munster, Dublin et Belfast. Des colonnes volantes ont embusqué des troupes, comme à Crossbarry en mars ; la Grande-Bretagne a exécuté des prisonniers de l’IRA et brûlé des maisons en représailles. En vertu de la loi sur le Gouvernement irlandais, l’Irlande du Nord a été créée le 3 mai 1921 et George V a ouvert son parlement à Belfast le 22 juin."
"A truce began on 11 July 1921. Talks in London led to the Anglo-Irish Treaty, signed on 6 December, which created the Irish Free State, a self-governing dominion within the British Empire, and allowed Northern Ireland to opt out. The Dáil approved it on 7 January 1922 by 64 votes to 57, but the split over it, above all over the oath of fidelity to the king, led to civil war. In all, about 2,300 people had been killed, some 900 of them civilians.": "Une trêve a commencé le 11 juillet 1921. Les pourparlers à Londres ont conduit au traité anglo-irlandais, signé le 6 décembre, qui a créé l’État libre irlandais, un dominion autonome au sein de l’Empire britannique, et permis à l’Irlande du Nord de se retirer. Le Dáil l’a approuvé le 7 janvier 1922 par 64 voix contre 57, mais la scission, surtout sur le serment de fidélité au roi, a conduit à la guerre civile. En tout, environ 2300 personnes ont été tuées, dont 900 civils."
