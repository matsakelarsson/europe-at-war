"The Dáil, Soloheadbeg and the guerrilla war": "Le Dáil, le Soloheadbeg et la guérilla"
"January 1919 – October 1920": "janvier 1919 – octobre 1920"
"In the general election of December 1918 Sinn Féin won 73 of Ireland’s 105 seats. Its members refused to sit at Westminster, and on 21 January 1919 they met in Dublin’s Mansion House as Dáil Éireann and declared independence. The same day, at Soloheadbeg in County Tipperary, Volunteers led by Seán Treacy and Dan Breen, acting on their own initiative, shot dead two policemen guarding a cart of gelignite. Through 1919 the Volunteers, now called the Irish Republican Army, mostly raided for arms and freed prisoners, while Michael Collins’s “Squad” killed police detectives in Dublin. In September the British government banned the Dáil.": "Aux élections générales de décembre 1918, Sinn Féin remporte 73 des 105 sièges d’Irlande. Ses membres refusent de siéger à Westminster et le 21 janvier 1919 ils se rencontrent à Dublin dans la Maison de Mansion comme Dáil Éireann et déclarent l’indépendance. Le même jour, à Soloheadbeg dans le comté de Tipperary, des volontaires dirigés par Seán Treacy et Dan Breen, agissant de leur propre initiative, ont abattu deux policiers qui gardaient une charrette de gelignite. En septembre, le gouvernement britannique a interdit le Dáil."
"In 1920 the IRA moved on to attacking police barracks and ambushing patrols, and the RIC abandoned many isolated stations. Britain reinforced it with ex-servicemen recruited in Britain, from March the “Black and Tans” and from July the Auxiliary Division of former officers, who answered IRA attacks by killing suspects and burning creameries, homes and towns, among them Balbriggan. In March Tomás Mac Curtain, the Lord Mayor of Cork, was shot dead at home by men with blackened faces, and in October his successor, Terence MacSwiney, died on hunger strike in Brixton prison in London.": "En 1920, l’IRA est passée à attaquer des casernes de police et à embuscader des patrouilles, et la RIC a abandonné de nombreux postes isolés. La Grande-Bretagne l’a renforcé avec d’anciens militaires recrutés en Grande-Bretagne, à partir de mars le ─Black et les Tans, et à partir de juillet la Division auxiliaire des anciens officiers, qui ont répondu aux attaques de l’IRA en tuant des suspects et en brûlant des crèmeries, des maisons et des villes, parmi lesquelles Balbriggan. En mars, Tomás Mac Curtain, le Lord Mayor de Cork, a été abattu à la maison par des hommes aux visages noircis, et en octobre son successeur, Terence MacSwiney, est mort en grève de la faim à la prison Brixton à Londres."
"In Ulster the conflict took a sectarian turn. In July 1920 loyalists drove about 8,000 Catholics and left-wing Protestants out of the Belfast shipyards, and rioting, shootings and burnings in the city killed nearly 500 people by 1922, most of them Catholics. A mainly Protestant Ulster Special Constabulary was raised to support the police, and some of its members took part in reprisals.": "En juillet 1920, les loyalistes ont chassé environ 8 000 catholiques et protestants de gauche des chantiers navals de Belfast, et des émeutes, fusillades et incendies dans la ville ont tué près de 500 personnes en 1922, dont la plupart catholiques. Un constabulaire spécial d’Ulster principalement protestant a été élevé pour soutenir la police, et certains de ses membres ont pris part à des représailles."
