# Some French text was translated automatically.
"Irmandiño Revolts": "Révoltes d’Irmandiño"
"The great rising of the brotherhoods (irmandades) of Galicia against the nobles who ruled the countryside from their castles. With the approval of Henry IV of Castile, peasants, townspeople, lower clergy and some lesser nobles formed a Holy Brotherhood in 1467 and, led by men such as Alonso de Lanzós and Diego de Lemos, destroyed about 130 castles and towers of families like the Andrade, Lemos and Moscoso, while the lords fled to Portugal or Castile. In 1469 Pedro Álvarez de Sotomayor, “Pedro Madruga”, led a counter-attack from Portugal with the archbishop of Santiago, other nobles and support from the kings of Castile and Portugal, and the brotherhoods were crushed. The castles were rebuilt by forced labour, until the Catholic Monarchs curbed the Galician nobility in the 1480s. An earlier rising, the Irmandade Fusquenlla of 1431–1435, had been put down in the same way.": "La grande montée des fraternités (irmandades) de Galice contre les nobles qui gouvernaient la campagne de leurs châteaux. Avec l’approbation d’Henri IV de Castille, les paysans, les citadins, le clergé inférieur et quelques nobles moins élevés formèrent une Sainte Fraternité en 1467 et, sous la conduite d’hommes comme Alonso de Lanzós et Diego de Lemos, détruisirent environ 130 châteaux et tours de familles comme l’Andrade, Lemos et Moscoso, tandis que les seigneurs s’enfuirent au Portugal ou en Castille. En 1469 Pedro Álvarez de Sotomayor, Pedro Madruga, a mené une contre-attaque du Portugal avec l’archevêque de Santiago, d’autres nobles et le soutien des rois de Castille et du Portugal, et les fraternités ont été écrasées. Les châteaux ont été reconstruits par le travail forcé, jusqu’à ce que les monarques catholiques freinent la noblesse galicienne dans les 1480. Une montée plus tôt, l’Irmandade Fusquenlla de 1431–1435, avait été abattue de la même manière."
"Irmandiño is Galician for a member of an irmandade, a brotherhood.": "Irmandiño est galicien pour un membre d’une irmandade, une fraternité."
