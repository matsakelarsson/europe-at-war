# French translations of the catalogue text (wave 9); step bodies follow later.
Isatay Taimanuly’s rebellion: Rébellion d’Isatay Taimanuly
? A rising of the herders of the Bukey (Inner) Horde, the Kazakh khanate between the lower Volga and the Ural created under Russian protection in 1801, against Khan Zhangir and the Russian frontier authorities. The best land along the Bolshoy and Maly Uzen and around the Kamysh-Samar lakes had gone to Cossack settlements, the khan and his kinsmen and allies held most of the remaining pastures, the herders were barred from the Ural floodplain, and taxes and livestock losses were heavy. In February 1836 the elder Isatay Taimanuly and the poet Makhambet Utemisuly took the lead of scattered unrest, calling for the seizure of the khan’s and the Cossacks’ lands and herds. From 24 October to 6 November 1837 they besieged the khan’s headquarters (Khan Ordasy) for about two weeks, until troops arrived; Isatay then attacked a Russian detachment at Zhideli. On 15 November 1837 Ural and Astrakhan Cossacks and the khan’s men defeated the rebels at Tastobe. Part of the rebels broke through across the Ural into the lands of the Junior Zhuz, where Isatay’s following grew to 2,000–3,000 men by the spring of 1838, according to the military governor of Orenburg, Vasily Perovsky. On 12 July 1838 a Russian force defeated them on the Akbulak river, and Isatay was killed in the fighting. Makhambet, whose poems are classics of Kazakh literature, went on trying to raise support and was killed in October 1846 by a member of a detachment sent to capture him.
: Un soulèvement des éleveurs de la Horde de Bukey (Horde intérieure), le khanat kazakh situé entre la basse Volga et l’Oural, créé sous protection russe en 1801, contre le khan Zhangir et les autorités frontalières russes. Les meilleures terres le long du Grand et du Petit Ouzen et autour des lacs de Kamych-Samar étaient allées aux établissements cosaques, le khan, ses parents et ses alliés détenaient la plupart des pâturages restants, les éleveurs étaient exclus de la plaine inondable de l’Oural, et les impôts comme les pertes de bétail étaient lourds. En février 1836, l’ancien Isatay Taimanuly et le poète Makhambet Utemisuly prirent la tête de troubles épars, appelant à la saisie des terres et des troupeaux du khan et des Cosaques. Du 24 octobre au 6 novembre 1837, ils assiégèrent pendant environ deux semaines le quartier général du khan (Khan Ordasy), jusqu’à l’arrivée des troupes ; Isatay attaqua ensuite un détachement russe à Zhideli. Le 15 novembre 1837, des Cosaques de l’Oural et d’Astrakhan et les hommes du khan battirent les rebelles à Tastobe. Une partie des rebelles franchit l’Oural en forçant le passage vers les terres du Petit Jüz, où les partisans d’Isatay atteignirent 2 000–3 000 hommes au printemps 1838, selon le gouverneur militaire d’Orenbourg, Vassili Perovski. Le 12 juillet 1838, une force russe les battit sur la rivière Akboulak, et Isatay fut tué au combat. Makhambet, dont les poèmes sont des classiques de la littérature kazakhe, continua à chercher des appuis et fut tué en octobre 1846 par un membre d’un détachement envoyé pour le capturer.
