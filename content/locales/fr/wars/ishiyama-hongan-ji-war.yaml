# French translations of the catalogue text (wave 10); step bodies follow later.
Ishiyama Hongan-ji War: Guerre d’Ishiyama Hongan-ji
? "Oda Nobunaga’s ten-year war against the Ishiyama Hongan-ji, the fortified head temple of the Jōdo Shinshū at Osaka, and the leagues of its followers, the Ikkō-ikki. The Hongan-ji had moved to Ishiyama, on the site of today’s Osaka Castle, in 1532, and its abbot commanded the loyalty of hundreds of thousands of farmers, townsmen and local warriors from Kaga to Kii. When Nobunaga, master of Kyoto since 1568, demanded money and the temple’s site, the abbot Kennyo called on his followers to fight in 1570. The war was fought at Osaka, where Oda armies ringed the temple with forts for years, and in the provinces: the leagues of Nagashima in Owari and Ise were wiped out in 1574 and those of Echizen in 1575, with tens of thousands killed. The Mōri kept the temple supplied by sea and beat Nobunaga’s fleet at Kizugawaguchi in 1576, but after Nobunaga’s new fleet fought them again in 1578 and his enemies fell one by one, Kennyo accepted a peace arranged by the emperor in 1580 and left Osaka. The temple burned, and Hideyoshi later built Osaka Castle on its site."
: "La guerre de dix ans menée par Oda Nobunaga contre l’Ishiyama Hongan-ji, le temple principal fortifié du Jōdo Shinshū à Osaka, et contre les ligues de ses fidèles, les Ikkō-ikki. Le Hongan-ji s’était installé en 1532 à Ishiyama, sur le site de l’actuel château d’Osaka, et son abbé pouvait compter sur la loyauté de centaines de milliers de paysans, de citadins et de guerriers locaux, du Kaga au Kii. Lorsque Nobunaga, maître de Kyoto depuis 1568, exigea de l’argent et le site du temple, l’abbé Kennyo appela ses fidèles à combattre en 1570. La guerre se déroula à Osaka, où les armées d’Oda encerclèrent le temple de forts pendant des années, et dans les provinces : les ligues de Nagashima, dans l’Owari et l’Ise, furent anéanties en 1574 et celles de l’Echizen en 1575, faisant des dizaines de milliers de morts. Les Mōri ravitaillèrent le temple par mer et battirent la flotte de Nobunaga à Kizugawaguchi en 1576 mais, après que la nouvelle flotte de Nobunaga les eut affrontés de nouveau en 1578 et que ses ennemis furent tombés l’un après l’autre, Kennyo accepta en 1580 une paix arrangée par l’empereur et quitta Osaka. Le temple brûla, et Hideyoshi construisit plus tard le château d’Osaka sur son emplacement."
