"Frederick now made peace with the pope, his main opponent, partly at the cities’ expense. After preliminary talks at Anagni in November 1176 the parties met in Venice. On 24 July 1177 Frederick, freed from excommunication, knelt before Alexander III at the door of St Mark’s, and on 1 August the peace was sworn. Frederick recognised Alexander and abandoned his own antipope, and he agreed a fifteen-year truce with William II of Sicily and a six-year truce with the Lombard League.": "Frederick fait maintenant la paix avec le pape, son principal adversaire, en partie aux frais des villes. Après les pourparlers préliminaires à Anagni en novembre 1176, les parties se sont rencontrées à Venise. Le 24 juillet 1177 Frederick, libéré de l’excommunication, s’agenouille devant Alexandre III à la porte de Saint Marc, et le 1er août la paix est assermentée. Frederick reconnut Alexandre et abandonna son propre antipope, et il accepta une trêve de quinze ans avec Guillaume II de Sicile et une trêve de six ans avec la Lombard League."
"The truce gave time for a lasting settlement. In the Peace of Constance, sealed on 25 June 1183, Frederick granted the League’s cities the regalia within their walls and many outside them, and the right to fortify, to keep their league and to elect their own consuls, who would be invested by the emperor. The cities swore fealty, paid a sum of money and owed the emperor supplies when he came to Italy. Alessandria was refounded as Caesarea, the emperor’s city. The communes stayed in the Empire but governed themselves, and in 1186 Frederick’s son Henry married Constance, heiress to the Kingdom of Sicily, in Milan.": "Dans la Paix de Constance, scellée le 25 juin 1183, Frédéric accorda aux villes de la Ligue les regalia à l’intérieur de leurs murs et beaucoup en dehors d’eux, et le droit de fortifier, de garder leur ligue et d’élire leurs propres consuls, qui seraient investis par l’empereur. Alessandria fut refondé comme Césarée, ville de l’empereur. Les communes restèrent dans l’Empire mais se dirigèrent, et en 1186 le fils de Frédéric Henry épousa Constance, héritière du Royaume de Sicile, à Milan."
