"The imperial officials governed harshly, and resentment spread. In 1164 Verona, Vicenza, Padua and Venice formed the Veronese League, which Frederick, with few troops, could not break. In 1166 he returned with a new army and marched on Rome to install his own pope, besieging Ancona on the way. On 29 May 1167 his commanders Rainald of Dassel and Christian of Mainz routed a much larger Roman army at Monte Porzio near Tusculum, and in July Frederick stormed St Peter’s, held by Alexander III’s supporters. His antipope, Paschal III, crowned him and the empress there.": "En 1164 Vérone, Vicenza, Padoue et Venise formèrent la Veronèse Ligue, que Frederick, avec peu de troupes, ne put briser. En 1166 il retourna avec une nouvelle armée et marcha sur Rome pour installer son propre pape, assiégeant Ancona sur le chemin. Le 29 mai 1167, ses commandants Rainald de Dassel et Christian de Mayence acheminèrent une armée romaine beaucoup plus grande à Monte Porzio près de Tusculum, et en juillet Frederick s’empare de St Pierre, tenu par les partisans d’Alexandre III. Son antipope, Paschal III, le couronne et l’impératrice là-bas."
"Days later an epidemic swept the imperial army in the August heat, killing Rainald, thousands of soldiers and many princes. Frederick retreated north through a hostile Lombardy. In his absence the cities had united. In 1167, by tradition after an oath at the abbey of Pontida, Milan’s neighbours, Cremona among them, joined the Lombard League, and in April they helped the Milanese return and rebuild their walls. In March 1168 Frederick slipped back over the Alps in disguise, and the League founded a new fortified city on the Tanaro, naming it Alessandria after the pope.": "Quelques jours plus tard, une épidémie balaya l’armée impériale dans la chaleur du mois d’août, tuant Rainald, des milliers de soldats et de nombreux princes. Frederick se retira au nord par une Lombardie hostile. En son absence les villes s’étaient unies. En mars 1168, Frederick glissa en déguisement les Alpes et la Ligue fonda une nouvelle ville fortifiée sur le Tanaro, qu’elle nomma Alessandria après le pape."
