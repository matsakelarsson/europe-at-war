"1158–1162": "1158–1162"
"Frederick returned in 1158 with a much larger army, refounded Lodi on a new site and besieged Milan, which surrendered in early September. At a second diet at Roncaglia that November, lawyers from Bologna listed the regalia, the rights of the crown, which Frederick now claimed in full, among them tolls, mints and the appointment of magistrates. Imperial officials were sent to govern the cities, and when they reached Milan early in 1159 the city rose again. That autumn the papal election split, and Frederick backed Victor IV against Alexander III, who had the support of the Lombard cities, Sicily and most of Europe.": "Frederick retourna en 1158 avec une armée beaucoup plus grande, refonda Lodi sur un nouveau site et assiégea Milan, qui s’est rendu au début de Septembre. Lors d’un second régime à Roncaglia que Novembre, les avocats de Bologne énuméraient la régalia, les droits de la couronne, que Frederick revendiquait maintenant pleinement, parmi eux péages, menthes et la nomination des magistrats. Des fonctionnaires impériaux furent envoyés pour gouverner les villes, et lorsqu’ils atteignirent Milan au début de 1159 la ville se leva à nouveau. L’automne la division des élections papales, Frederick soutenait Victor IV contre Alexandre III, qui avait le soutien des villes Lombardes, Sicile et la plupart de l’Europe."
"From July 1159 Frederick besieged Crema, Milan’s ally. Both sides killed prisoners in sight of the walls, and the Germans tied hostages, children among them, to their siege towers. Crema surrendered in January 1160 and was destroyed. The Milanese beat an imperial army at Carcano that August, but Milan was blockaded and its harvests burned, and after a hungry winter it surrendered unconditionally on 1 March 1162. Its people were expelled, and from late March its walls and most of its buildings were pulled down, much of the work done by men from its old rivals Lodi, Cremona, Pavia, Novara and Como.": "À partir de juillet 1159, Frederick assiégea Crema, allié de Milan. Les deux camps tuèrent des prisonniers en vue des murs, et les Allemands lièrent des otages, des enfants parmi eux, à leurs tours de siège. Crema se rendit en janvier 1160 et fut détruite. Sa population a été expulsée, et de fin mars ses murs et la plupart de ses bâtiments ont été abattus, une grande partie du travail effectué par les hommes de ses anciens rivaux Lodi, Cremona, Pavia, Novara et Côme."
