"Frederick’s fifth expedition crossed the Mont Cenis pass in September 1174 and burned Susa, whose townspeople had nearly captured him in 1168. He besieged Alessandria through the winter, but the new city, defended by earthen ramparts, held out, and in April 1175 a League army came to relieve it. At Montebello the two sides agreed preliminaries of peace, which broke down over Alessandria and the pope. Frederick sent to Germany for reinforcements; his cousin Henry the Lion, Duke of Saxony and Bavaria, refused to come.": "La cinquième expédition de Frédéric traversa le col du Mont Cenis en septembre 1174 et brûla Susa, dont les habitants l’avaient presque capturé en 1168. Il assiégea Alessandria tout au long de l’hiver, mais la nouvelle ville, défendue par des remparts de terre, se tint, et en avril 1175 une armée de la Ligue vint la soulager. À Montebello, les deux parties se sont entendues sur des préliminaires de paix, qui ont brisé Alessandria et le pape. Frederick envoya en Allemagne chercher des renforts ; son cousin Henry le Lion, duc de Saxe et de Bavière, refusa de venir."
"In May 1176 Frederick met new troops from Germany at Como and set out for Pavia. On 29 May, between Legnano and Borsano, his knights scattered the League’s cavalry and charged the Milanese foot soldiers gathered round the carroccio, the sacred ox-drawn cart that carried the city’s standard. The infantry held until the League’s horsemen, reinforced from Brescia, came back and struck the imperial flank. Frederick’s army broke; he was unhorsed and believed dead, and reached Pavia only days later. Legnano showed that he could not win the war by force.": "En mai 1176, Frederick rencontra de nouvelles troupes d’Allemagne à Côme et partit pour Pavia. Le 29 mai, entre Legnano et Borsano, ses chevaliers dispersèrent la cavalerie de la Ligue et chargeèrent les soldats de pied milanais rassemblés autour du carroccio, le char sacré tiré par les boeufs qui portait la norme de la ville. L’infanterie a tenu jusqu’à ce que les cavaliers de la Ligue, renforcés de Brescia, sont revenus et ont frappé le flanc impérial. Frederick's armée s’est cassé ; il était sans chevaux et cru mort, et atteint Pavia seulement quelques jours plus tard. Legnano a montré qu’il ne pouvait pas gagner la guerre par la force."
