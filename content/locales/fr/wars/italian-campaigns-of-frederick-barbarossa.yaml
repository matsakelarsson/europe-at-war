"1154–1155": "1154–1155"
"Frederick I was elected King of the Romans in 1152 and meant to restore the emperor’s authority in Italy. The cities of Lombardy had grown rich and governed themselves through elected consuls, collecting tolls and dues that had once belonged to the crown. Milan, the largest, dominated its neighbours and had destroyed Lodi in 1111 and Como in 1127. Frederick crossed the Alps in October 1154 with a small army and held a diet at Roncaglia near Piacenza, where Lodi, Pavia and others brought their complaints against Milan.": "Frédéric Ier a été élu roi des Romains en 1152 et destiné à restaurer l’autorité de l’empereur en Italie. Les villes de Lombardie s’étaient enrichies et gouvernées par des consuls élus, recueillant des péages et des cotisations qui avaient autrefois appartenu à la couronne. Milan, le plus grand, a dominé ses voisins et avait détruit Lodi en 1111 et Côme en 1127. Frederick a traversé les Alpes en octobre 1154 avec une petite armée et a tenu un régime à Roncaglia près de Piacenza, où Lodi, Pavia et d’autres ont porté leurs plaintes contre Milan."
"Instead of attacking Milan itself, Frederick besieged its ally Tortona with the help of Pavia, Milan’s rival. The town surrendered in April 1155 after two months and was destroyed. Frederick was crowned King of Italy at Pavia and marched on Rome, where he handed over to the pope Arnold of Brescia, the preacher who had led the Roman commune against papal rule, to be executed. Adrian IV crowned him emperor in St Peter’s on 18 June 1155, while his troops beat off an attack by the Romans. Summer fever thinned his army, and he went home without fighting the Normans of Sicily as he had promised the pope.": "Au lieu d’attaquer Milan lui-même, Frederick assiégea son allié Tortona avec l’aide de Pavie, rival de Milan. La ville se rendit en avril 1155 après deux mois et fut détruite. Frédéric fut couronné roi d’Italie à Pavie et marcha sur Rome, où il livra au pape Arnold de Brescia, le prédicateur qui avait conduit la commune romaine contre la domination papale, à exécuter. Adrian IV l’a couronné empereur à Saint-Pierre le 18 juin 1155, tandis que ses troupes battaient une attaque des Romains. La fièvre estivale atténue son armée, et il est rentré chez lui sans combattre les Normands de Sicile comme il avait promis au pape."
