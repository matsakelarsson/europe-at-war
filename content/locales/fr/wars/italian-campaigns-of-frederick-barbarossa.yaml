"Italian campaigns of Frederick Barbarossa": "Campagnes italiennes de Frederick Barbarossa"
"The emperor Frederick I’s attempts to restore imperial rights over the self-governing cities of northern Italy. He destroyed Tortona, Crema and Milan, but the Lombard League, formed in 1167 with the backing of Pope Alexander III, defeated him at Legnano in 1176; he made peace with the pope at Venice in 1177 and recognised the cities’ self-government in the Peace of Constance in 1183.": "Il détruisit Tortona, Crema et Milan, mais la ligue Lombarde, formée en 1167 avec le soutien du pape Alexandre III, le battit à Legnano en 1176 ; il fit la paix avec le pape de Venise en 1177 et reconnut les villes „l’autonomie gouvernementale dans la Paix de Constance en 1183."
"Frederick, called Barbarossa (“red beard”) by the Italians, led six expeditions to Italy, in 1154–1155, 1158–1162, 1163–1164, 1166–1168, 1174–1178 and 1184–1186. The third and the sixth saw little fighting.": "Frederick, appelé Barbarossa par les Italiens, mena six expéditions en Italie, en 1154–1155, 1158–1162, 1163–1164, 1166–1168, 1174–1178 et 1184–1186. La troisième et la sixième vit peu de combats."
"The cities never stood together as a whole. Pavia, and until 1167 Cremona and Lodi, fought on Frederick’s side against Milan, and the League itself was an alliance of old rivals.": "Pavia, et jusqu’en 1167 Cremona et Lodi, ont combattu du côté de Frédéric contre Milan, et la Ligue elle-même était une alliance de vieux rivaux."
"On the map the cities of the League remain part of the Holy Roman Empire, as they did under the Peace of Constance.": "Sur la carte, les villes de la Ligue restent une partie du Saint Empire romain, comme elles l’ont fait sous la Paix de Constance."
