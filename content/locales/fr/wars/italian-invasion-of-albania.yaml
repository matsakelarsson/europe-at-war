"Italy’s occupation of Albania, long an Italian client state, in April 1939. On Good Friday, 7 April, some 22,000 Italian troops landed at Durrës, Vlorë, Shëngjin and Sarandë against brief resistance, and King Zog fled to Greece with his family. Tirana was occupied on 8 April, an Albanian assembly offered the crown to King Victor Emmanuel III on 12 April, and Albania became a protectorate in personal union with Italy, from which Mussolini attacked Greece in October 1940.": "Italie L’occupation de l’Albanie, longtemps un État client italien, en avril 1939. Le vendredi saint, 7 avril, quelque 22 000 soldats italiens ont débarqué à Durrës, Vlorë, Shëngjin et Sarandë contre une brève résistance, et le roi Zog a fui en Grèce avec sa famille. Tirana fut occupée le 8 avril, une assemblée albanaise offrit la couronne au roi Victor Emmanuel III le 12 avril et l’Albanie devint un protectorat en union personnelle avec l’Italie, d’où Mussolini attaqua la Grèce en octobre 1940."
"Italy claimed only a dozen or so dead; estimates of Albanian dead range from about 160 to several hundred.": "L’Italie n’a déclaré qu’une douzaine de morts ; les estimations des morts albanais vont d’environ 160 à plusieurs centaines."
