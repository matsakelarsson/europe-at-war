"1499–1500": "1499–1500"
"Charles VIII died in April 1498, and his cousin and successor Louis XII claimed Milan as well as Naples, through his grandmother Valentina Visconti. He bought the help of Venice, promised Cremona and the Ghiara d’Adda, and of Pope Alexander VI, whose son Cesare Borgia received a French duchy and French troops for his conquests in the Romagna. In August 1499 a French army under the Milanese exile Gian Giacomo Trivulzio invaded the duchy from Asti while the Venetians attacked from the east. Ludovico Sforza fled to the Tyrol, and Louis entered Milan on 6 October.": "Charles VIII est décédé en avril 1498, et son cousin et successeur Louis XII a revendiqué Milan ainsi que Naples, par l’intermédiaire de sa grand-mère Valentina Visconti. Il a acheté l’aide de Venise, promis Cremona et le Ghiara d=Adda, et du pape Alexandre VI, dont le fils Cesare Borgia a reçu un duché français et des troupes françaises pour ses conquêtes en Romagne. En août 1499, une armée française sous l’exil milanais Gian Giacomo Trivulzio envahit le duché d’Asti pendant que les Vénitiens attaquaient de l’est. Ludovico Sforza s’enfuit au Tyrol et Louis entra à Milan le 6 octobre."
"French rule soon made enemies, and in February 1500 Ludovico came back with Swiss and German mercenaries and was welcomed in Milan. When the French returned in force, the Swiss on both sides would not fight each other. At Novara on 10 April Ludovico’s Swiss marched off, and he was betrayed and captured while trying to slip away among them disguised as a pikeman. He died a prisoner in France in 1508. The men of Uri, Schwyz and Nidwalden kept Bellinzona, which France ceded to them in 1503.": "La domination française fit bientôt des ennemis, et en février 1500 Ludovico revint avec des mercenaires suisses et allemands et fut accueilli à Milan. Lorsque les Français retournèrent en force, les Suisses des deux côtés ne se battirent pas. À Novara, le 10 avril, Ludovico (Suisse) marcha, et il fut trahi et capturé tout en essayant de s’échapper déguisé en pikeman. Il mourut prisonnier en France en 1508. Les hommes d’Uri, Schwyz et Nidwalden gardèrent Bellinzona, que la France leur céda en 1503."
