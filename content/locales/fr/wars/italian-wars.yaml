"Brescia and Bergamo surrendered to Louis XII within days of the battle.": "Brescia et Bergamo se rendirent à Louis XII dans les jours qui suivirent la bataille."
"Verona": "Vérone"
"June 1509": "juin 1509"
"The city submitted to Maximilian’s representatives and stayed in imperial hands until 1517.": "La ville se soumet aux représentants de Maximilian et reste en mains impériales jusqu’en 1517."
"Padua": "Padoue"
"July–October 1509": "juillet–octobre 1509"
"Retaken by the Venetians on 17 July, the city held out against the imperial siege; Maximilian gave up in early October.": "Reprise par les Vénitiens le 17 juillet, la ville s’est tenue contre le siège impérial ; Maximilian a renoncé au début d’octobre."
"Ravenna": "Ravenne"
"May–June 1509": "mai–juin 1509"
"Venice handed back Ravenna, Cervia, Faenza and Rimini to the pope.": "Venise a remis Ravenne, Cervia, Faenza et Rimini au pape."
"Polesella": "Polesella"
"22 December 1509": "22 décembre 1509"
"Ferrarese guns on the riverbank wrecked the Venetian galleys that had sailed up the Po.": "Des canons ferrarais sur le bord de la rivière ont détruit les galères vénitiennes qui avaient navigué sur le Po."
"Louis XII": "Louis XII"
"Maximilian, 1509": "Maximilien, 1509"
"Retaking Padua": "Reprise de Padoue"
"Venetian lands taken by France, 1509": "Terres vénitiennes prises par la France, 1509"
"Venetian lands submitted to Maximilian, June 1509": "Terres vénitiennes soumises à Maximilian, juin 1509"
"Imperial success": "Succès impérial"
"Ferrarese success": "Le succès ferrarais"
"Maximilian’s moves": "Maximilians bouge"
"The Holy League and Ravenna": "La Sainte Ligue et Ravenne"
"1510–1512": "1510–1512"
"Julius II now meant to drive the French out of Italy; his reported watchword was “Out with the barbarians!” In January 1511, aged sixty-seven, he directed the siege of Mirandola in person through the snow. In October he formed a Holy League with Venice and Ferdinand of Aragon, and Henry VIII of England joined it. Louis XII’s young nephew Gaston de Foix, Duke of Nemours, answered with a lightning campaign. In February 1512 he relieved Bologna, then retook Brescia, which had gone back to Venice, and his troops sacked it, killing thousands of its people.": "Julius II voulait maintenant chasser les Français d’Italie ; son mot d’ordre rapporté était -Out avec les barbares ! . En janvier 1511, âgé de soixante-sept ans, il dirigeait le siège de Mirandola en personne à travers la neige. Le jeune neveu de Louis XII Gaston de Foix, duc de Nemours, répondit par une campagne d’éclair. En février 1512, il soula Bologne, puis reprit Brescia, qui était retourné à Venise, et ses troupes le labourèrent, tuant des milliers de son peuple."
"On Easter Sunday, 11 April 1512, Gaston attacked the Spanish and papal army of Ramón de Cardona, viceroy of Naples, outside Ravenna. After an artillery duel in which Alfonso d’Este’s guns raked the League cavalry from the flank, the French won the bloodiest battle Italy had yet seen, but Gaston was killed pursuing the retreating Spanish infantry, and Ravenna was sacked. Without him the French lost their grip. In May some 18,000 Swiss hired by the pope came down through the Alps, and by the summer the French had abandoned almost all of Lombardy.": "Le dimanche de Pâques, 11 avril 1512, Gaston attaqua l’armée espagnole et papale de Ramón de Cardona, vice-roi de Naples, en dehors de Ravenne. Après un duel d’artillerie dans lequel les canons Alfonso d=Este=ont arraché la cavalerie de la Ligue du flanc, les Français remportèrent la bataille la plus sanglante que l’Italie ait encore vue, mais Gaston fut tué pour poursuivre l’infanterie espagnole en retraite, et Ravenna fut renvoyé. Sans lui, les Français perdirent leur emprise. En mai, quelque 18 000 Suisses engagés par le pape descendirent dans les Alpes et, l’été, les Français abandonnèrent presque toute la Lombardie."
"The victors shared the spoils. The Swiss took Lugano, Locarno and the Ossola valley, and the Grisons the Valtellina, Bormio and Chiavenna; the pope took Parma, Piacenza and Reggio. Massimiliano Sforza, Ludovico’s son, entered Milan as duke in December. In August Cardona’s Spaniards sacked Prato, and Florence took back the Medici. Ferdinand of Aragon used the war to seize the Kingdom of Navarre, an ally of France; the Duke of Alba took Pamplona on 25 July 1512, and Upper Navarre was joined to Castile.": "Les Suisses ont pris Lugano, Locarno et la vallée de l’Ossola, et les Grisons la Valtellina, Bormio et Chiavenna ; le pape a pris Parma, Piacenza et Reggio. Massimiliano Sforza, fils de Ludovico, est entré à Milan comme duc en décembre. En août Cardona, les Espagnols saccagent Prato, et Florence reprend les Médicis. Ferdinand d’Aragon utilise la guerre pour saisir le royaume de Navarre, un allié de France ; le duc d’Alba prend Pampelune le 25 juillet 1512, et la Haute Navarre est rejointe en Castille."
"Holy League": "Sainte Ligue"
"proclaimed 4 October 1511": "proclamé le 4 octobre 1511"
"Battle of Ravenna": "Bataille de Ravenne"
"11 April 1512, French victory": "11 avril 1512, victoire française"
"Sack of Prato": "Sac de Prato"
"29 August 1512": "29 août 1512"
"Mirandola": "Mirandola"
"20 January 1511": "20 janvier 1511"
"Julius II, in armour, directed the siege in deep snow and entered through a breach when the town surrendered.": "Julius II, en armure, dirigea le siège dans la neige profonde et entra par une brèche lorsque la ville se rendit."
"February 1512": "février 1512"
"The French stormed the city, which had returned to Venice. The sack lasted for days, and thousands of people were killed.": "Les Français ont envahi la ville, qui était revenue à Venise. Le sac a duré des jours, et des milliers de personnes ont été tuées."
"11 April 1512": "11 avril 1512"
"Perhaps 10,000 men or more died in all. The French lost their commander, Gaston de Foix, and many officers.": "Les Français ont perdu leur commandant, Gaston de Foix, et de nombreux officiers."
"Prato": "Prato"
"Cardona’s Spanish troops sacked the town, killing many of its people. Florence gave in, and the Medici returned.": "Les troupes espagnoles de Cardona ont saccagé la ville, tuant beaucoup de ses habitants. Florence a cédé, et les Médicis sont revenus."
"29 December 1512": "29 décembre 1512"
"Massimiliano Sforza entered Milan as duke, a ruler kept in power by Swiss pikes.": "Massimiliano Sforza est entré à Milan en tant que duc, un dirigeant maintenu au pouvoir par les piques suisses."
"Gaston de Foix, February 1512": "Gaston de Foix, février 1512"
"Swiss, May–June 1512": "Suisse, mai-juin 1512"
"Taken by the Swiss and the Grisons, 1512": "Prise par les Suisses et les Grisons, 1512"
"Parma, Piacenza and Reggio, taken by the pope in 1512": "Parme, Piacenza et Reggio, pris par le pape en 1512"
"Novara and Marignano": "Novara et Marignano"
"1513–1516": "1513–1516"
"Louis XII tried again in 1513, now allied with Venice. On 6 June a Swiss army that had marched through the night attacked the French camp at Novara and routed it, and the French left Italy once more. That summer Henry VIII and Maximilian invaded northern France; at Guinegate on 16 August the French cavalry fled so fast that the English called it the Battle of the Spurs, and the allies took Thérouanne and Tournai. The Swiss besieged Dijon in September and were bought off, and the Scots, invading England as France’s allies, were crushed at Flodden. Louis made peace in 1514 and died on 1 January 1515.": "Louis XII essaya de nouveau en 1513, maintenant allié à Venise. Le 6 juin, une armée suisse qui avait marché dans la nuit attaqua le camp français de Novare et l’orienta, et les Français quittèrent l’Italie une fois de plus. Cet été-là, Henry VIII et Maximilien envahirent le nord de la France ; à Guinegate, le 16 août, la cavalerie française s’enfuit si vite que les Anglais l’appelèrent bataille des Spurs, et les alliés prirent Thérouanne et Tournai. Les Suisses assiégèrent Dijon en septembre et furent rachetés, et les Écossais, envahissant l’Angleterre comme alliés de la France, furent écrasés à Flodden. Louis fit la paix en 1514 et mourut le 1er janvier 1515."
"His successor Francis I, aged twenty, crossed the Alps in August 1515 by the high Col de l’Argentière, avoiding the Swiss who were waiting at Susa. On 13 September the Swiss attacked his camp at Marignano, now Melegnano, south-east of Milan, and fought on into the night. The next morning French guns and cavalry held them until Venetian troops under Alviano arrived, and the Swiss withdrew in good order, leaving perhaps 10,000 dead. The old Marshal Trivulzio called it a battle of giants.": "Son successeur François Ier, âgé de vingt ans, traversa les Alpes en août 1515 par le haut Col de l’Argentière, évitant les Suisses qui attendaient à Susa. Le 13 septembre, les Suisses attaquèrent son camp à Marignano, aujourd'hui Melegnano, au sud-est de Milan, et combattèrent dans la nuit. Le lendemain matin, les canons et la cavalerie français les retenaient jusqu’à l’arrivée des troupes vénitiennes sous Alviano, et les Suisses se retiraient en bon ordre, laissant peut-être 10 000 morts."
"Francis entered Milan, and Massimiliano Sforza retired to France on a pension. By the Treaty of Noyon (13 August 1516) Francis kept Milan and left Naples to the young Charles of Habsburg, who had inherited Spain that January; Venice recovered Brescia and, in January 1517, Verona. The Perpetual Peace of Fribourg on 29 November 1516 made the Swiss, who kept Ticino, France’s allies and suppliers of soldiers until the French Revolution.": "Francis entra à Milan, et Massimiliano Sforza se retira en France avec une pension. Par le traité de Noyon (13 août 1516) François garda Milan et laissa Naples au jeune Charles de Habsbourg, qui avait hérité l’Espagne ce janvier ; Venise récupéra Brescia et, en janvier 1517, Vérone. La paix perpétuelle de Fribourg, le 29 novembre 1516, fit des Suisses, qui gardèrent le Tessin, la France, alliés et fournisseurs de soldats jusqu’à la Révolution française."
"Battle of Novara": "Bataille de Novara"
"6 June 1513, Swiss victory": "6 juin 1513, victoire suisse"
"Battle of Marignano": "Bataille de Marignano"
"13–14 September 1515, French victory": "13-14 septembre 1515, victoire française"
"Perpetual Peace of Fribourg": "Paix perpétuelle de Fribourg"
"29 November 1516": "29 novembre 1516"
"6 June 1513": "6 juin 1513"
"Also called the battle of Ariotta. With no cavalry and few guns, the Swiss lost heavily but drove La Trémoille’s army from the field.": "Aussi appelé la bataille d’Ariotta. Sans cavalerie et peu de canons, les Suisses ont perdu lourdement mais ont conduit l’armée de La Trémouille du champ."
"Battle of the Spurs": "Bataille des Spurs"
"16 August 1513": "16 août 1513"
"Near Guinegate in Artois. French cavalry trying to bring supplies into besieged Thérouanne fled from English and imperial horsemen.": "Près de Guinegate à Artois. Cavalerie française essayant d’apporter des vivres dans Thérouanne assiégée fuit les cavaliers anglais et impériaux."
"Dijon": "Dijon"
"September 1513": "septembre 1513"
"A Swiss and imperial army besieged the Burgundian capital until Louis de La Trémoille paid it to leave, with promises Louis XII never kept.": "Une armée suisse et impériale assiégea la capitale bourguignonne jusqu’à ce que Louis de La Trémoille le paie pour partir, avec des promesses que Louis XII n’avait jamais tenues."
"Battle of La Motta": "Bataille de La Motta"
"7 October 1513": "7 octobre 1513"
"Cardona’s Spanish and imperial army, retreating towards Verona, turned on the Venetians blocking its way near Vicenza and routed them.": "L’armée espagnole et impériale de Cardona, se retirant vers Vérone, tourna sur les Vénitiens bloquant son chemin près de Vicenza et les roulait."
"Col de l’Argentière": "Col de l’argentière"
"August 1515": "août 1515"
"Francis I’s army and its guns crossed this high pass, now the Col de Larche, and came down the Stura valley behind the Swiss.": "L’armée et ses canons traversèrent ce col, maintenant le Col de Larche, et descendirent la vallée de la Stura derrière les Suisses."
"13–14 September 1515": "13–14 septembre 1515"
"The Swiss attacked the French camp and fought into the night. The arrival of the Venetians on the second day decided the battle.": "Les Suisses attaquèrent le camp français et combattirent dans la nuit. L’arrivée des Vénitiens le deuxième jour décida de la bataille."
"Henry VIII": "Henry VIII"
"Swiss, 1513": "Suisse, 1513"
"Francis I, 1515": "François I, 1515"
"Alviano": "Alviano"
"Charles V and Bicocca": "Charles V et Bicocca"
"1521–1524": "1521–1524"
"In 1519 Charles of Habsburg, already king of Spain, Naples and Sicily and lord of the Netherlands, was elected emperor as Charles V, defeating Francis I’s bid. War between them began in 1521 on several fronts. A French-backed army overran Navarre while Castile was in turmoil and was beaten at Noáin, near Pamplona, on 30 June. In Italy Charles allied with Pope Leo X, and in November an imperial and papal army under Prospero Colonna took Milan from the French commander Lautrec, restoring the Sforza under Francesco II, Ludovico’s younger son.": "En 1519, Charles de Habsbourg, déjà roi d’Espagne, Naples et Sicile et seigneur des Pays-Bas, fut élu empereur en tant que Charles V, battant la candidature de François I. La guerre entre eux commença en 1521 sur plusieurs fronts. Une armée soutenue par les Français envahit Navarre alors que Castille était dans le trouble et fut battue à Noáin, près de Pampelune, le 30 juin. En Italie Charles s’allie au pape Léon X, et en novembre une armée impériale et papale sous Prospero Colonna prend Milan du commandant français Lautrec, rétablissant la Sforza sous Francesco II, le fils cadet de Ludovico."
"Lautrec regrouped with Venetian help and Swiss mercenaries. The Swiss, unpaid, demanded battle, and on 27 April 1522 they attacked Colonna’s entrenched camp in the park of the Bicocca, north of Milan, head-on across open ground. Volleys from Spanish arquebusiers behind a sunken road and earthworks shot them down by the thousand, and the survivors marched home. Genoa fell to the imperialists and was sacked on 30 May. In 1524 a new French army was driven out of Lombardy, and the knight Bayard was killed covering its retreat across the Sesia. The imperialists followed it into Provence but failed to take Marseille.": "Lautrec se regroupa avec l’aide vénitienne et des mercenaires suisses. Les Suisses, non rémunérés, réclamèrent la bataille, et le 27 avril 1522 ils attaquèrent Colonna, camp retranché dans le parc de la Bicocca, au nord de Milan, en plein air. Gênes tomba aux impérialistes et fut renvoyé le 30 mai. En 1524, une nouvelle armée française fut chassée de Lombardie, et le chevalier Bayard fut tué couvrant sa retraite à travers la Sesia. Les impérialistes la suivirent en Provence mais ne prirent pas Marseille."
"Charles V elected emperor": "Charles V élu empereur"
"28 June 1519": "28 juin 1519"
"Battle of Bicocca": "Bataille de Bicocca"
"27 April 1522, imperial victory": "27 avril 1522, victoire impériale"
"Sack of Genoa": "Sac de Gênes"
"30 May 1522": "30 mai 1522"
"19 November 1521": "19 novembre 1521"
"Colonna and the Marquis of Pescara surprised the French defences, and Lautrec fell back to Venetian territory.": "Colonna et le marquis de Pescara ont surpris les défenses françaises, et Lautrec est retombé sur le territoire vénitien."
"27 April 1522": "27 avril 1522"
"The battle ended the reputation of the Swiss pike columns. Some 3,000 Swiss are said to have died in front of the Spanish lines.": "La bataille a mis fin à la réputation des colonnes de brochet suisses. Environ 3000 Suisses seraient morts devant les lignes espagnoles."
"Genoa": "Gênes"
"Imperial troops stormed and sacked the city, ending French rule there for a time.": "Les troupes impériales ont pris l’assaut et renvoyé la ville, mettant fin à la domination française pendant un certain temps."
"Battle of the Sesia": "Bataille de la Sesia"
"30 April 1524": "30 avril 1524"
"Pierre Terrail, seigneur de Bayard, the ‘knight without fear and beyond reproach’, was mortally wounded by an arquebus shot while covering the French retreat.": "Pierre Terrail, seigneur de Bayard, la nuit sans crainte et au-delà des reproches, a été mortellement blessé par un tir d’arquebus tout en couvrant la retraite française."
"Marseille": "Marseille"
"August–September 1524": "août–septembre 1524"
"The Duke of Bourbon, the French constable who had gone over to Charles V, and the Marquis of Pescara besieged the city for over a month and withdrew as Francis I approached.": "Le duc de Bourbon, le constable français qui était passé à Charles V, et le marquis de Pescara assiégea la ville pendant plus d’un mois et se retira à l’approche de François."
"Colonna, 1521": "Colonna, 1521"
"Bourbon, 1524": "Bourbon, 1524"
"Pavia": "Pavia"
"1524–1526": "1524–1526"
"Francis I came over the Alps himself in October 1524, retook plague-stricken Milan and laid siege to Pavia, held for the emperor by Antonio de Leyva with about 6,000 Spanish and German troops. The siege dragged on through the winter, while Francis sent part of his army south under the Duke of Albany to threaten Naples. In late January an imperial relief army under Charles de Lannoy, viceroy of Naples, the Duke of Bourbon and the Marquis of Pescara came up and dug in facing the French around the walled hunting park of Mirabello, north of the town.": "François Ier vint lui-même sur les Alpes en octobre 1524, reprit Milan frappé par la peste et assiégea Pavia, tenu pour l’empereur par Antonio de Leyva avec environ 6 000 troupes espagnoles et allemandes. Le siège traîné pendant l’hiver, tandis que Francis envoya une partie de son armée au sud sous le duc d’Albany pour menacer Naples. Fin janvier, une armée de secours impériale sous la direction de Charles de Lannoy, vice-roi de Naples, duc de Bourbon et marquis de Pescara monta et creusa face aux Français autour du parc de chasse fortifié de Mirabello, au nord de la ville."
"Before dawn on 24 February 1525, the emperor’s 25th birthday, imperial troops broke through the park wall. Francis led his heavy cavalry in a charge that masked his own guns, and in the fog Spanish arquebusiers and German landsknechts cut the French army apart. Many of France’s leading nobles were killed, and Francis, his horse killed under him, was taken prisoner. He wrote to his mother that nothing was left to him but honour and his life. Taken to Spain, he signed the Treaty of Madrid on 14 January 1526, giving up Burgundy, Milan and Naples, and left his two eldest sons as hostages. Freed in March, he declared that a promise made in prison did not bind him.": "Avant l’aube du 24 février 1525, les troupes impériales ont franchi le mur du parc le 25e anniversaire de l’empereur. François a dirigé sa cavalerie lourde dans une charge qui masquait ses propres canons, et dans la brume les arquebusiers espagnols et les Landsknechts allemands ont coupé l’armée française. Beaucoup de Frances chefs nobles ont été tués, et Francis, son cheval tué sous lui, a été fait prisonnier. Il écrit à sa mère qu’il ne lui reste que l’honneur et la vie. Porté en Espagne, il signe le traité de Madrid le 14 janvier 1526, abandonnant Bourgogne, Milan et Naples, et laissant ses deux fils aînés comme otages. Libéré en mars, il déclare qu’une promesse faite en prison ne le lie pas."
"Battle of Pavia": "Bataille de Pavie"
"24 February 1525, imperial victory": "24 février 1525, victoire impériale"
"Francis I a prisoner": "Francis I un prisonnier"
"February 1525 – March 1526": "février 1525 – mars 1526"
"Treaty of Madrid": "Traité de Madrid"
"14 January 1526": "14 janvier 1526"
"October 1524": "octobre 1524"
"The city, ravaged by plague, fell to the French without a fight; the imperial troops withdrew to Lodi and Pavia.": "La ville, ravagée par la peste, tomba aux Français sans se battre ; les troupes impériales se retiraient à Lodi et Pavia."
"October 1524 – February 1525": "octobre 1524 – février 1525"
"Leyva’s garrison held out for four months, paying its soldiers by melting down church silver.": "La garnison de Leyva a tenu quatre mois, payant ses soldats en fondant l’argent de l’église."
"24 February 1525": "24 février 1525"
"Fought in the hunting park of Mirabello. Among the French dead were Admiral Bonnivet, Jacques de La Palice and Louis de La Trémoille.": "Frappé dans le parc de chasse de Mirabello. Parmi les morts français se trouvaient l’amiral Bonnivet, Jacques de La Palice et Louis de La Trémoille."
"Pizzighettone": "Pizzighettone"
"February–May 1525": "février–mai 1525"
"Francis was held in the fortress on the Adda before being taken to Spain.": "François a été tenu dans la forteresse sur l’Adda avant d’être emmené en Espagne."
"Francis I, 1524": "François Ier, 1524"
"Lannoy and Bourbon": "Lannoy et Bourbon"
"The Sack of Rome and the siege of Florence": "Le sac de Rome et le siège de Florence"
"1526–1530": "1526–1530"
"Within weeks of his release Francis joined Pope Clement VII, Venice, Florence and Francesco Sforza in the League of Cognac (22 May 1526). German landsknechts under Georg von Frundsberg crossed the Alps and joined Bourbon’s Spaniards, and in the spring of 1527 this army, unpaid for months, marched south. On 6 May it stormed the walls of Rome; Bourbon was shot dead on the ladders. For months the soldiers, many of them Lutherans, killed, tortured and plundered, while the pope held out in Castel Sant’Angelo; most of the Swiss Guard died defending him. Rome’s population fell from about 55,000 to perhaps 10,000 through killing, flight, famine and plague.": "Dans les semaines qui suivirent sa libération, François rejoignit le pape Clément VII, Venise, Florence et Francesco Sforza dans la Ligue du Cognac (22 mai 1526). Des landsknechts allemands sous Georg von Frundsberg traversèrent les Alpes et se joignirent aux Espagnols de Bourbon. Au printemps 1527, cette armée, non rémunérée pendant des mois, marcha vers le sud. Pendant des mois, les soldats, dont beaucoup de luthériens, tuèrent, torturent et pillent, tandis que le pape se tenait à Castel Sant-Angelo ; la plupart des gardes suisses moururent pour le défendre. La population de Rome est tombée d’environ 55 000 à peut-être 10 000 par le meurtre, la fuite, la famine et la peste."
"Florence drove out the Medici and restored its republic. A French army under Lautrec besieged Naples in 1528, but the Genoese admiral Andrea Doria, whose galleys were blockading the city, went over to Charles V that summer; plague swept the French camp, Lautrec died in August and his army surrendered. Doria made Genoa an independent republic allied with Spain. After another French defeat at Landriano (21 June 1529), Francis made peace at Cambrai on 3 August. This Ladies’ Peace, negotiated by his mother and Charles’s aunt, gave up his claims in Italy.": "Florence a chassé les Médicis et restauré sa république. Une armée française sous Lautrec assiégé Naples en 1528, mais l’amiral génois Andrea Doria, dont les galères bloquaient la ville, est passée à Charles V cet été-là ; la peste a balayé le camp français, Lautrec est mort en août et son armée s’est rendue. Doria fait de Gênes une république indépendante alliée avec l’Espagne. Après une autre défaite française à Landriano (21 juin 1529), François fit la paix à Cambrai le 3 août. Cette Paix de Dames, négociée par sa mère et sa tante Charles, abandonna ses revendications en Italie."
"Charles and Clement were reconciled, and on 24 February 1530 the pope crowned him emperor at Bologna, the last coronation of an emperor by a pope. Florence, left alone, was besieged by an imperial army from October 1529. Its field commander Francesco Ferrucci was defeated and killed at Gavinana on 3 August 1530, in a battle where the imperial commander, the Prince of Orange, also fell, and the city surrendered on 12 August. The pope’s kinsman Alessandro de’ Medici became its ruler, and in 1532 its first duke.": "Charles et Clément furent réconciliés et, le 24 février 1530, le pape le couronne à Bologne, dernière couronne d’un empereur par un pape. Florence, laissée seule, fut assiégée par une armée impériale à partir d’octobre 1529. Son commandant de campagne Francesco Ferrucci fut vaincu et tué à Gavinana le 3 août 1530, dans une bataille où le commandant impérial, le prince d’Orange, tomba aussi, et la ville se rendit le 12 août. Le pape, le parent Alessandro dea Medici devint son chef et, en 1532, son premier duc."
"Sack of Rome": "Sac de Rome"
"from 6 May 1527": "à compter du 6 mai 1527"
"Peace of Cambrai": "Paix de Cambrai"
"3 August 1529": "3 août 1529"
"Siege of Florence": "Siège de Florence"
"October 1529 – August 1530": "octobre 1529 – août 1530"
"6 May 1527": "6 mai 1527"
"The mutinous imperial army broke in near the Vatican under cover of fog. It left only in February 1528, driven out by plague and the approach of a League army.": "L’armée impériale mutineuse s’est effondrée près du Vatican sous couvert de brouillard. Elle n’a quitté qu’en février 1528, chassée par la peste et l’approche d’une armée de la Ligue."
"April–August 1528": "avril–août 1528"
"Lautrec besieged the city by land while Genoese galleys blockaded it by sea, until Doria changed sides and plague destroyed the besiegers.": "Lautrec assiégea la ville par terre, tandis que les galères génoises l’obstruaient par mer, jusqu’à ce que Doria change de camp et que la peste détruise les assiégés."
"September 1528": "septembre 1528"
"Andrea Doria entered the city with his galleys, drove out the French garrison and set up an aristocratic republic allied with Charles V.": "Andrea Doria est entré dans la ville avec ses galères, a chassé la garnison française et mis en place une république aristocratique alliée à Charles V."
"Battle of Landriano": "Bataille de Landriano"
"21 June 1529": "21 juin 1529"
"Antonio de Leyva surprised and destroyed the French army of the Count of Saint-Pol south of Milan.": "Antonio de Leyva a surpris et détruit l’armée française du comte de Saint-Pol au sud de Milan."
"Bologna": "Bologne"
"24 February 1530": "24 février 1530"
"Clement VII crowned Charles V emperor in the basilica of San Petronio. At a congress there the two had agreed to restore the Medici in Florence.": "Clément VII a couronné Charles V empereur dans la basilique de San Petronio. Lors d’un congrès là-bas, les deux avaient convenu de restaurer les Médicis à Florence."
"Battle of Gavinana": "Bataille de Gavinana"
"3 August 1530": "3 août 1530"
"Ferrucci, marching to relieve Florence, was beaten in the mountains above Pistoia. Taken prisoner, he was killed on the spot.": "Ferrucci, marchant pour soulager Florence, a été battu dans les montagnes au-dessus de Pistoia. Prisonnier, il a été tué sur place."
"12 August 1530": "12 août 1530"
"After a siege of ten months the city surrendered; the republic was ended and the Medici restored.": "Après un siège de dix mois, la ville s’est rendue ; la république a été terminée et les Médicis restaurés."
"Bourbon, 1527": "Bourbon, 1527"
"Lautrec, 1528": "Lautrec, 1528"
"Prince of Orange, 1529": "Prince d’Orange, 1529"
"Savoy, Provence and Ceresole": "Savoie, Provence et Ceresole"
"1535–1546": "1535–1546"
"When Francesco II Sforza died childless on 1 November 1535, Charles V kept Milan for his own family, and Francis I went to war again. In 1536 French troops overran Savoy and most of Piedmont, whose duke, Charles III, was the emperor’s ally; France held them for twenty-three years. In July Charles invaded Provence, but Marshal Montmorency stripped the country bare and waited in a fortified camp near Avignon. Hunger and dysentery wrecked the imperial army, which retreated in September. Pope Paul III brought the two rulers to a ten-year truce at Nice on 18 June 1538.": "Quand Francesco II Sforza mourut sans enfant le 1er novembre 1535, Charles V garda Milan pour sa propre famille, et François Ier alla à nouveau en guerre. En 1536, les troupes françaises écrasent Savoie et la plupart du Piémont, dont le duc, Charles III, était l’allié de l’empereur ; la France les tenait pendant vingt-trois ans. En juillet, Charles envahit la Provence, mais le maréchal Montmorency dépouilla le pays et attendit dans un camp fortifié près d’Avignon. La faim et la dysenterie détruisirent l’armée impériale qui se retira en septembre. Le pape Paul III apporta les deux dirigeants à une trêve de dix ans à Nice le 18 juin 1538."
"War came again in 1542. Francis, now openly allied with the Ottoman sultan Suleiman, sent his son Henry to besiege Perpignan, without success, and in August 1543 a Franco-Ottoman fleet under Khair ad-Din Barbarossa bombarded and took the town of Nice, though its castle held out. The Ottoman fleet wintered at Toulon, whose inhabitants had been sent away. On 14 April 1544 the young Count of Enghien won a bloody victory over the Marquis del Vasto at Ceresole in Piedmont, but could not follow it up.": "La guerre reprit en 1542. François, maintenant ouvertement allié au sultan ottoman Suleiman, envoya son fils Henry pour assiéger Perpignan, sans succès, et, en août 1543, une flotte franco-otomane sous Khair ad-Din Barbarossa bombarda et prit la ville de Nice, bien que son château fût tenu. La flotte ottomane hiverna à Toulon, dont les habitants avaient été renvoyés. Le 14 avril 1544, le jeune comte d’Enghien remporte une victoire sanglante sur le marquis del Vasto à Ceresole dans le Piémont, mais ne peut pas la suivre."
"That summer Charles V and Henry VIII invaded northern France. Charles took Saint-Dizier after a six-week siege and advanced towards Paris; Henry took Boulogne in September. On 18 September Charles and Francis made peace at Crépy, giving back their conquests, but England kept Boulogne until 1550. The French stayed in Piedmont, and in 1545 Pope Paul III made his son Pier Luigi Farnese duke of Parma and Piacenza.": "Cet été-là, Charles V et Henry VIII envahirent le nord de la France. Charles prit Saint-Dizier après un siège de six semaines et se dirigea vers Paris ; Henri prit Boulogne en septembre. Le 18 septembre, Charles et François firent la paix à Crépy, rendant leurs conquêtes, mais l’Angleterre conserva Boulogne jusqu’en 1550. Les Français séjournèrent au Piémont, et en 1545 le pape Paul III fit son fils Pier Luigi Farnese duc de Parma et Piacenza."
"Truce of Nice": "Trêve de Nice"
"18 June 1538": "18 juin 1538"
"Battle of Ceresole": "Bataille de Ceresole"
"14 April 1544, French victory": "14 avril 1544, victoire française"
"Peace of Crépy": "Paix de Crépy"
"18 September 1544": "18 septembre 1544"
"Turin": "Turin"
"April 1536": "avril 1536"
"French troops occupied the Savoyard capital and kept it until 1562.": "Les troupes françaises occupèrent la capitale savoyarde et la conservèrent jusqu’en 1562."
"Montmorency’s camp": "Camp de Montmorency"
"July–September 1536": "juillet–septembre 1536"
"Montmorency waited here, between the Rhône and the Durance, while the imperial army starved in the stripped countryside.": "Montmorency attendait ici, entre le Rhône et la Durance, tandis que l’armée impériale était affamée dans les campagnes dépouillées."
"Perpignan": "Perpignan"
"August–October 1542": "août–octobre 1542"
"The dauphin Henry besieged the town for weeks and withdrew.": "Le dauphin Henry a assiégé la ville pendant des semaines et s’est retiré."
"Nice": "Joli"
"22 August 1543": "22 août 1543"
"The Franco-Ottoman fleet battered and plundered the town, but the Savoyard garrison in the castle held out, and the besiegers left as an imperial relief force approached.": "La flotte franco-ottomane battait et pillait la ville, mais la garnison savoyarde du château s’arrêtait, et les assiégers partaient alors qu’une force de secours impériale s’approchait."
"Toulon": "Toulon"
"winter 1543–1544": "hiver 1543-1544"
"Barbarossa’s fleet of over a hundred galleys wintered in the harbour as France’s guest; most of the townspeople had been sent away.": "Barbarossa, la flotte de plus d’une centaine de galères a passé l’hiver dans le port en tant qu’invité de France ; la plupart des citadins avaient été renvoyés."
"14 April 1544": "14 avril 1544"
"Columns of pikemen and arquebusiers met head-on in the centre, and both sides lost heavily before the imperial army broke.": "Des colonnes de pikemen et d’arquebusiers se rencontrèrent de front au centre, et les deux camps perdirent fortement avant la rupture de l’armée impériale."
"Saint-Dizier": "Saint-Dizier"
"17 August 1544": "17 août 1544"
"The small town held up Charles V’s army for six weeks before surrendering on terms.": "La petite ville a retenu l’armée de Charles V.S. pendant six semaines avant de se rendre."
"Boulogne": "Boulogne"
"September 1544": "septembre 1544"
"Henry VIII took the town after a two-month siege. England gave it back in 1550 for a payment.": "Henry VIII a pris la ville après un siège de deux mois. L’Angleterre l’a rendu en 1550 pour un paiement."
"French, 1536": "Français, 1536"
"Charles V, 1536": "Charles V, 1536"
"Barbarossa and the French fleet": "Barbarossa et la flotte française"
"Charles V, 1544": "Charles V, 1544"
"Savoy and Piedmont, held by France from 1536": "Savoie et Piémont, détenus par la France à partir de 1536"
"Savoyard success": "Succès de Savoyard"
"Siena and the pope’s war": "Sienne et la guerre du pape"
"1551–1557": "1551–1557"
"Henry II, who succeeded Francis I in 1547, renewed the war in 1551 in support of Ottavio Farnese, Duke of Parma, and in 1552 he allied with the German Protestant princes and occupied Metz, Toul and Verdun. In July 1552 the people of Siena rose against their Spanish garrison and, with French help, drove it out. In 1553 a French army, carried by the Ottoman fleet, invaded Corsica, which belonged to Genoa, and took most of the island.": "Henri II, qui succéda à François Ier en 1547, renouvela la guerre en 1551 pour soutenir Ottavio Farnese, duc de Parme, et en 1552 il s’allia avec les princes protestants allemands et occupa Metz, Toul et Verdun. En juillet 1552 le peuple de Sienne se leva contre leur garnison espagnole et, avec l’aide française, la chassait. En 1553, une armée française, portée par la flotte ottomane, envahit la Corse, qui appartenait à Gênes, et prit la plus grande partie de l’île."
"Cosimo I de’ Medici, Duke of Florence, joined Charles V against Siena. On 2 August 1554 his army under Gian Giacomo Medici, Marquis of Marignano, routed the Franco-Sienese army of the Florentine exile Piero Strozzi at Marciano in the Val di Chiana. Siena was besieged and starved; much of its countryside was laid waste, and many of its poor were driven out of the city to die between the lines. It surrendered on 17 April 1555, though republicans and French troops held out at Montalcino until 1559. In 1557 Charles’s son Philip II gave Siena to Cosimo as a fief, keeping its coastal fortresses for Spain.": "Le 2 août 1554, son armée sous Gian Giacomo Medici, marquis de Marignano, dirigea l’armée franco-sienne de l’exil florentin Piero Strozzi à Marciano dans le Val di Chiana. Sienne fut assiégée et affamée ; une grande partie de sa campagne fut gaspillée, et beaucoup de ses pauvres furent chassés de la ville pour mourir entre les lignes. Elle se rendit le 17 avril 1555, bien que les républicains et les troupes françaises tenaient à Montalcino jusqu’en 1559. En 1557 Charles fils Philippe II donna Sienne à Cosimo comme fief, conservant ses forteresses côtières pour l’Espagne."
"Charles V gave up his thrones in 1555–1556, leaving Spain, Italy and the Netherlands to Philip and the Empire to his brother Ferdinand. A truce agreed at Vaucelles in February 1556 was broken when Pope Paul IV, a Neapolitan bitterly hostile to Spain, called in the French. The Duke of Alba invaded the Papal States from Naples, and a French army under the Duke of Guise marched south in 1557 but failed before Civitella del Tronto. After the French defeat at Saint-Quentin Guise was recalled, and in September 1557 Paul IV made peace with Alba.": "Charles V abandonna ses trônes en 1555-1556, laissant l’Espagne, l’Italie et les Pays-Bas à Philippe et à l’Empire à son frère Ferdinand. Une trêve convenue à Vaucelles en février 1556 fut rompue lorsque le pape Paul IV, un napolitain amèrement hostile à l’Espagne, appela les Français. Le duc d’Alba envahit les États pontificaux de Naples, et une armée française sous le duc de Guise marcha vers le sud en 1557 mais échoua avant Civitella del Tronto. Après la défaite française à Saint-Quentin Guise fut rappelée, et en septembre 1557 Paul IV fit la paix avec Alba."
"Battle of Marciano": "Bataille de Marciano"
"2 August 1554, imperial and Florentine victory": "2 août 1554, victoire impériale et florentine"
"Siena surrenders": "Les capitulations de Sienne"
"17 April 1555": "17 avril 1555"
"Peace of Cave": "Paix de la grotte"
"September 1557, Paul IV and Philip II": "Septembre 1557, Paul IV et Philippe II"
"Bastia": "Bastia"
"August 1553": "août 1553"
"French troops and Corsican exiles under Sampiero Corso, landed by the Ottoman fleet, took Bastia and most of Corsica. Genoa held on at Calvi.": "Les troupes françaises et les exilés corse sous Sampiero Corso, débarqués par la flotte ottomane, prirent Bastia et la plupart de Corse. Gênes tenu à Calvi."
"2 August 1554": "2 août 1554"
"Also called the battle of Scannagallo. Strozzi’s army, retreating towards Siena, was caught and destroyed.": "Aussi appelé la bataille de Scannagallo. Strozzi, l’armée, en retraite vers Sienne, a été capturé et détruit."
"Siena": "Sienne"
"The Sienese had expelled their Spanish garrison in July 1552. After a siege of more than a year, the starving city surrendered.": "Les Siennois avaient expulsé leur garnison espagnole en juillet 1552. Après un siège de plus d’un an, la ville affamée se rendit."
"Montalcino": "Montalcino"
"1555–1559": "1555–1559"
"Sienese republicans and their French allies kept up a ‘Republic of Siena at Montalcino’ until the peace of 1559.": "Les républicains siennois et leurs alliés français ont maintenu une « République de Sienne à Montalcino » jusqu’à la paix de 1559."
"Ostia": "Ostie"
"November 1556": "novembre 1556"
"Alba’s army, marching up from Naples, took the fortress at the mouth of the Tiber and threatened Rome.": "L’armée d’Alba, marchant de Naples, prit la forteresse à l’embouchure du Tibre et menaça Rome."
"Civitella del Tronto": "Civitella del Tronto"
"April–May 1557": "avril–mai 1557"
"The Neapolitan border fortress held out against Guise’s army for three weeks, and the French invasion of Naples went no further.": "La forteresse frontalière napolitaine s’est tenue contre l’armée de Guise pendant trois semaines, et l’invasion française de Naples ne va pas plus loin."
"Strozzi": "Strozzi"
"Alba, 1556": "Alba, 1556"
"Guise, 1557": "Guise, 1557"
"Corsica, held by the French 1553–1559": "Corse, détenue par les Français 1553-1559"
"Spanish, imperial and Florentine success": "Succès espagnol, impérial et florentin"
"Saint-Quentin, Calais and Cateau-Cambrésis": "Saint-Quentin, Calais et Cateau-Cambrésis"
"1557–1559": "1557–1559"
"In the north the war turned on the frontier between France and the Netherlands. In August 1557 Philip II’s army under Emmanuel Philibert, the exiled Duke of Savoy, besieged Saint-Quentin. On 10 August, the feast of St Lawrence, it caught the relief army of Constable Montmorency as it withdrew and destroyed it; Montmorency was captured, and the town was stormed on 27 August despite Admiral Coligny’s defence. Philip later built the Escorial, dedicated to St Lawrence, in thanks. The road to Paris lay open, but Philip did not take it.": "Au nord, la guerre tourna à la frontière entre la France et les Pays-Bas. En août 1557 l’armée de Philippe II sous Emmanuel Philibert, le duc exilé de Savoie, assiégea Saint-Quentin. Le 10 août, la fête du Saint-Laurent a pris l’armée de secours du gendarme Montmorency alors qu’elle se retirait et la détruisait ; Montmorency fut capturée, et la ville fut envahie le 27 août malgré la défense de l’amiral Coligny. Philippe construisit plus tard l’escorial, dédié au Saint-Laurent, en remerciement. La route vers Paris était ouverte, mais Philip ne la prit pas."
"England had joined the war in June 1557, since its queen, Mary I, was Philip’s wife. In midwinter, when no attack was expected, the Duke of Guise struck at Calais, which surrendered on 7 January 1558 after a week’s siege, ending more than two centuries of English rule. In June Guise took Thionville. On 13 July 1558 a French army returning from a raid along the coast was destroyed at Gravelines by Count Egmont, with English ships firing into its flank. Both kings were bankrupt and alarmed by the spread of Protestantism in their lands, and talks began that autumn.": "L’Angleterre avait rejoint la guerre en juin 1557, depuis que sa reine, Mary Ier, était l’épouse de Philippe. Au milieu de l’hiver, quand aucune attaque n’était attendue, le duc de Guise frappa à Calais, qui se rendit le 7 janvier 1558 après une semaine de siège, mettant fin à plus de deux siècles de domination anglaise. Le 13 juillet 1558, une armée française revenant d’un raid le long de la côte fut détruite à Gravelines par le comte Egmont, avec des navires anglais tirant sur son flanc. Les deux rois furent en faillite et alarmés par la propagation du protestantisme dans leurs terres, et les pourparlers commencèrent cet automne-là."
"By the treaties of Cateau-Cambrésis (2 and 3 April 1559) France gave up its claims in Italy, handed back Savoy and Piedmont to Emmanuel Philibert, though it kept five fortresses for a time, and returned Corsica to Genoa; it kept Calais and, in practice, Metz, Toul and Verdun. Spain was left master of Milan, Naples, Sicily and Sardinia, and Italy stayed under its sway for a century and a half. At a tournament celebrating the marriages that sealed the peace, Henry II was wounded by a splintered lance and died on 10 July 1559.": "Par les traités de Cateau-Cambrésis (2 et 3 avril 1559), la France abandonna ses revendications en Italie, remit Savoy et Piémont à Emmanuel Philibert, bien qu’elle conservât cinq forteresses pendant un certain temps, et retourna la Corse à Gênes ; elle garda Calais et, dans la pratique, Metz, Toul et Verdun. L’Espagne a été laissée maître de Milan, Naples, Sicile et Sardaigne, et l’Italie est restée sous son emprise pendant un siècle et demi. Lors d’un tournoi célébrant les mariages qui ont scellé la paix, Henri II a été blessé par une lance éparpillée et est mort le 10 juillet 1559."
"Battle of Saint-Quentin": "Bataille de Saint-Quentin"
"10 August 1557, Spanish victory": "10 août 1557, victoire espagnole"
"Fall of Calais": "Chute de Calais"
"7 January 1558": "7 janvier 1558"
"Peace of Cateau-Cambrésis": "Paix de Cateau-Cambrésis"
"2–3 April 1559": "2–3 avril 1559"
"10 August 1557": "10 août 1557"
"The French army was caught on the march and cut to pieces; thousands were killed or captured, Montmorency among the prisoners.": "L’armée française a été prise sur la marche et coupée en morceaux ; des milliers ont été tués ou capturés, Montmorency parmi les prisonniers."
"Calais": "Calais"
"Guise took the outlying forts and the town in a week. The English garrison was small and the marshes around it were frozen.": "Guise a pris les forts et la ville en une semaine. La garnison anglaise était petite et les marais autour étaient gelés."
"Thionville": "Thionville"
"June 1558": "juin 1558"
"Guise took the strong Luxembourg fortress on the Moselle after a siege of three weeks. It went back to Spain at the peace.": "Guise prit la forte forteresse luxembourgeoise sur la Moselle après un siège de trois semaines. Il retourna en Espagne à la paix."
"Battle of Gravelines": "Bataille de Gravelines"
"13 July 1558": "13 juillet 1558"
"Marshal de Termes’s army, back from sacking Dunkirk, was trapped on the beach between Egmont’s cavalry, the sea and English warships.": "L’armée du maréchal de Termes, de retour de Dunkerque, était piégée sur la plage entre la cavalerie d’Egmont, la mer et les navires de guerre anglais."
"Cateau-Cambrésis": "Cateau-Cambrésis"
"The treaties ended the Italian Wars. Philip II married Henry II’s daughter Elisabeth, and Emmanuel Philibert married Henry’s sister Margaret.": "Les traités ont mis fin aux guerres italiennes. Philippe II a épousé la fille d’Henri II Elisabeth, et Emmanuel Philibert a épousé la sœur d’Henri Margaret."
