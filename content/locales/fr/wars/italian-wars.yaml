"1508–1510": "1508–1510"
"Julius II, pope from 1503, wanted back the Romagna towns that Venice had seized after Cesare Borgia’s fall, and Venice’s growth on the mainland worried all its neighbours. On 10 December 1508 Louis XII and Maximilian I agreed at Cambrai to partition the Venetian mainland, and Julius and Ferdinand of Aragon joined them. In April 1509 the pope placed Venice under an interdict. On 14 May a French army under Louis XII caught the Venetian rearguard of Bartolomeo d’Alviano at Agnadello, near the Adda, and destroyed it while the other Venetian commander, the Count of Pitigliano, kept his men out of the fight.": "Julius II, pape de 1503, a voulu revenir les villes de Romagne que Venise avait saisies après la chute de Cesare Borgia et Venise la croissance sur le continent inquiet tous ses voisins. Le 10 décembre 1508 Louis XII et Maximilian Ier ont convenu à Cambrai de partitionner le continent vénitien, et Julius et Ferdinand d’Aragon les ont rejoints. Le 14 mai, une armée française sous Louis XII s’empare de l’arrière-garde vénitienne de Bartolomeo d. Alviano à Agnadello, près de l’Adda, et la détruit tandis que l’autre commandant vénitien, le comte de Pitigliano, garde ses hommes hors du combat."
"Venice’s mainland empire collapsed in weeks. Bergamo, Brescia and Cremona opened their gates to the French; Verona, Vicenza and Padua submitted to Maximilian’s envoys; the Romagna towns went back to the pope and the Apulian ports to Ferdinand. But on 17 July Venetian troops retook Padua, and in September Maximilian besieged it with a huge army and failed. In December Duke Alfonso d’Este of Ferrara destroyed a Venetian river fleet on the Po at Polesella. Julius had got what he wanted; in February 1510 he made peace with Venice and soon turned against the French.": "L’empire continental de Venise s’est effondré en quelques semaines. Bergame, Brescia et Cremona ouvraient leurs portes aux Français ; Vérone, Vicenza et Padoue se soumettaient aux envoyés des Maximiliens ; les villes de Romagne retournaient au pape et aux ports des Pouilles à Ferdinand. Mais le 17 juillet les troupes vénitiennes reprirent Padoue et, en septembre, Maximilian l’assiégea avec une énorme armée et échoua. En décembre, le duc Alfonso d’Este de Ferrare détruisit une flotte vénitienne sur le Po à Polesella. Julius avait obtenu ce qu’il voulait ; en février 1510 il fit la paix avec Venise et se retourna bientôt contre les Français."
