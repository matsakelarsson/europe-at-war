"Italian Wars": "Guerres italiennes"
"Sixty-five years of war for mastery of Italy, fought mainly between the kings of France and the Spanish and Austrian Habsburgs, with Venice, the popes, the Swiss, Milan, Florence and the other Italian states changing sides as their interests shifted. The wars began when Charles VIII of France marched on Naples in 1494 and ended with the Peace of Cateau-Cambrésis in 1559, which left Spain dominant in Italy, holding Milan, Naples, Sicily and Sardinia, while France kept Calais and the bishoprics of Metz, Toul and Verdun.": "Soixante-cinq ans de guerre pour la maîtrise de l’Italie, ont combattu principalement entre les rois de France et les Habsbourg espagnols et autrichiens, avec Venise, les papes, les Suisses, Milan, Florence et les autres états italiens changer de camp au fur et à mesure que leurs intérêts changent. Les guerres ont commencé lorsque Charles VIII de France a marché sur Naples en 1494 et s’est terminé avec la paix de Cateau-Cambrésis en 1559, qui a laissé l’Espagne dominante en Italie, tenant Milan, Naples, Sicile et Sardaigne, tandis que la France gardait Calais et les évêques de Metz, Toul et Verdun."
"Dates are Julian, as usual for the period; the Gregorian calendar came into use only in 1582. Numbers of soldiers and dead come from chroniclers and are often uncertain.": "Les dates sont Julian, comme d’habitude pour la période ; le calendrier grégorien est entré en service seulement en 1582. Le nombre de soldats et de morts proviennent de chroniqueurs et sont souvent incertains."
"Historians divide the wars differently. A common scheme is the Italian War of 1494–1495, the war of 1499–1504, the War of the League of Cambrai (1508–1516), the war of 1521–1526, the War of the League of Cognac (1526–1530) and the wars of 1536–1538, 1542–1546 and 1551–1559. Alliances changed often, so a state shown as an ally of France in one step may be its enemy in the next.": "Les historiens divisent les guerres différemment. Un schéma commun est la guerre italienne de 1494–1495, la guerre de 1499–1504, la guerre de la Ligue de Cambrai (1508–1516), la guerre de 1521–1526, la guerre de la Ligue de Cognac (1526–1530) et les guerres de 1536–1538, 1542–1546 et 1551–1559. Les alliances ont souvent changé, de sorte qu’un État montré comme un allié de la France dans une étape peut être son ennemi dans l’autre."
"Related wars have their own entries, among them the Swabian War of 1499, Flodden (the Anglo-Scottish War of 1513), the Guelders Wars and the Princes’ Revolt of 1552, in which France took Metz. Charles V’s expeditions against Tunis (1535) and Algiers (1541) are not told here.": "Plusieurs conflits liés font l’objet de notices distinctes, dont la guerre de Souabe de 1499, la bataille de Flodden (guerre anglo-écossaise de 1513), les guerres de Gueldre et la révolte des princes de 1552, au cours de laquelle la France prend Metz. Les expéditions de Charles Quint contre Tunis (1535) et Alger (1541) ne sont pas abordées ici."
