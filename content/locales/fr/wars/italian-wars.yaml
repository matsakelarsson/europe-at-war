"1494–1496": "1494–1496"
"For forty years after the Peace of Lodi of 1454 the Italian states had kept an uneasy balance. Charles VIII of France had inherited the Angevin claim to the Kingdom of Naples, and Ludovico Sforza, who ruled Milan in his young nephew’s name and feared the nephew’s Neapolitan in-laws, encouraged him to press it. In early September 1494 Charles crossed the Alps by the Montgenèvre pass with perhaps 25,000 men and the best siege guns in Europe. His troops sacked Mordano and Fivizzano, killing many of their people, a shock to Italians used to less bloody wars.": "Pendant quarante ans après la paix de Lodi de 1454, les Etats italiens avaient gardé un équilibre précaire. Charles VIII de France avait hérité de la revendication Angevin au Royaume de Naples, et Ludovico Sforza, qui a dirigé Milan dans son jeune neveu , et craint le neveu , Napolitan in-laws, l’encourageait à la presser. Au début de septembre 1494, Charles traversa les Alpes par le col de Montgenèvre avec environ 25 000 hommes et les meilleurs canons de siège en Europe. Ses troupes saccagèrent Mordano et Fivizzano, tuant beaucoup de leur peuple, un choc pour les Italiens habitués à des guerres moins sanglantes."
"In Florence, Piero de’ Medici handed over the Tuscan fortresses and was driven out on 9 November; Pisa threw off Florentine rule the same day. Charles entered Florence on 17 November and Rome on 31 December. Alfonso II of Naples abdicated in favour of his son Ferdinand II, whose army melted away. The French stormed Monte San Giovanni in February, killing its garrison and many townspeople, and on 22 February 1495 Charles entered Naples. A new disease, syphilis, spread among the soldiers there and was carried across Europe as the “French disease”.": "A Florence, Piero de-. Médicis a remis les forteresses toscanes et a été chassé le 9 novembre ; Pise a jeté la règle florentine le même jour. Charles est entré à Florence le 17 novembre et Rome le 31 décembre. Alfonso II de Naples abdiqué en faveur de son fils Ferdinand II, dont l’armée s’est fondue. Les Français ont pris le Monte San Giovanni en février, tuant sa garnison et de nombreux citadins, et le 22 février 1495 Charles est entré à Naples. Une nouvelle maladie, la syphilis, se répand parmi les soldats là-bas et a été porté à travers l’Europe comme la maladie française."
"Alarmed, Venice, Milan, Pope Alexander VI, Ferdinand of Aragon and Maximilian I formed the League of Venice on 31 March. Charles left a garrison in Naples and marched north. On 6 July 1495, at Fornovo on the Taro, a larger League army, mostly Venetian and led by Francesco Gonzaga of Mantua, attacked him. It lost more men, but the French lost their baggage, and both sides claimed victory. Charles reached safety and made peace with Milan at Vercelli in October. In the south, Spanish troops under Gonzalo Fernández de Córdoba helped Ferdinand II win back his kingdom; the last French garrisons surrendered in 1496.": "Alarmé, Venise, Milan, le pape Alexandre VI, Ferdinand d’Aragon et Maximilien j’ai formé la Ligue de Venise le 31 mars. Charles a quitté une garnison à Naples et a marché au nord. Le 6 juillet 1495, à Fornovo sur le Taro, une plus grande armée de la Ligue, principalement vénitienne et dirigée par Francesco Gonzaga de Mantoue, l’a attaqué. Charles est arrivé en sécurité et a fait la paix avec Milan à Vercelli en octobre. Au sud, les troupes espagnoles sous Gonzalo Fernández de Córdoba ont aidé Ferdinand II à regagner son royaume ; les dernières garnisons françaises se sont rendues en 1496."
