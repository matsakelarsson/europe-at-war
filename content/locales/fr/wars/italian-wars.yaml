"1501–1504": "1501–1504"
"By the secret Treaty of Granada of 11 November 1500, Louis XII and Ferdinand of Aragon agreed to depose Frederick of Naples, their kinsman, and share his kingdom. Louis would take Naples, Campania and the Abruzzi with the royal title, and Ferdinand Apulia and Calabria. In the summer of 1501 a French army marched south, stormed Capua on 24 July with great slaughter and entered Naples; Frederick gave up and retired to France. The partners soon quarrelled over the Capitanata, the rich grazing plain the treaty had failed to assign, and by 1502 they were at war.": "Par le traité secret de Grenade du 11 novembre 1500, Louis XII et Ferdinand d’Aragon acceptèrent de déposer Frédéric de Naples, leur parent, et de partager son royaume. Louis prit Naples, Campanie et les Abruzzes avec le titre royal, et Ferdinand Pouilles et Calabre. Au cours de l’été 1501, une armée française marcha vers le sud, prit capua le 24 juillet avec un grand massacre et entra à Naples ; Frederick abandonna et se retira vers la France. Les associés se disputèrent bientôt sur les Capitanata, la riche plaine de pâturage que le traité n’avait pas assignée, et en 1502, ils étaient en guerre."
"Outnumbered, Gonzalo Fernández de Córdoba held out in Barletta through the winter. Reinforced in the spring, he marched out and on 28 April 1503 dug in behind a ditch and bank at Cerignola. The French heavy cavalry and Swiss pikemen of the Duke of Nemours attacked and were shot down by Spanish arquebusiers; Nemours was killed, and Gonzalo entered Naples on 16 May. A new French army came south that autumn and faced him across the Garigliano through weeks of rain.": "Plus nombreux, Gonzalo Fernández de Córdoba a tenu à Barletta pendant l’hiver. Renforcé au printemps, il est sorti et le 28 avril 1503 creusé derrière un fossé et une rive à Cerignola. La cavalerie lourde française et les pikemen suisses du duc de Nemours attaquèrent et furent abattus par les arquebusiers espagnols ; Nemours fut tué, et Gonzalo entra à Naples le 16 mai. Une nouvelle armée française vint au sud cet automne-là et lui fit face à travers le Garigliano pendant des semaines de pluie."
"On the night of 28–29 December Gonzalo crossed the river upstream on a bridge of boats, took the French by surprise and routed them. Gaeta surrendered on 1 January 1504, and an armistice signed at Lyon at the end of the month left the whole kingdom to Ferdinand. Naples, like Sicily and Sardinia, would be ruled by Spanish viceroys for two centuries. In 1505 Louis gave up his claim as the dowry of his niece Germaine de Foix, who married the widowed Ferdinand.": "Dans la nuit du 28 au 29 décembre Gonzalo traversa le fleuve en amont sur un pont de bateaux, prit les Français par surprise et les roula. Gaeta se rendit le 1er janvier 1504 et un armistice signé à Lyon à la fin du mois quitta tout le royaume à Ferdinand. Naples, comme la Sicile et la Sardaigne, serait gouverné par des vice-rois espagnols pendant deux siècles. En 1505, Louis abandonna sa demande de dot de sa nièce Germaine de Foix, qui épousa la veuve Ferdinand."
