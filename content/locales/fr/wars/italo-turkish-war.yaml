Libya: Libye
September 1911 – 1912: septembre 1911 – 1912
Italy had long claimed Libya, the last Ottoman province in North Africa, and had secured the consent of France and Britain. After the Agadir Crisis of 1911, and with nationalist newspapers promising an easy conquest, the government of Giovanni Giolitti sent an ultimatum and declared war on 29 September 1911. The navy shelled the forts of Tripoli and landed sailors, and in October troops took Tripoli, Tobruk, Derna, Benghazi and Homs. Instead of welcoming the Italians, many Arabs and Berbers joined the small Ottoman garrisons. On 23 October an attack at Shar al-Shatt, on the edge of Tripoli, killed some 500 Italian soldiers, and Italian troops took revenge on the people of the oasis, killing thousands of civilians.: L’Italie avait longtemps revendiqué la Libye, dernière province ottomane en Afrique du Nord, et avait obtenu le consentement de la France et de la Grande-Bretagne. Après la crise d’Agadir de 1911, et avec des journaux nationalistes promettant une conquête facile, le gouvernement de Giovanni Giolitti envoya un ultimatum et déclara la guerre le 29 septembre 1911. La marine bombarda les forts de Tripoli et débarqua des marins, et en octobre les troupes prirent Tripoli, Tobrouk, Derna, Benghazi et Homs. Au lieu d’accueillir les Italiens, de nombreux Arabes et Berbères se joignirent aux petites garnisons ottomanes. Le 23 octobre, une attaque à Shar al-Shatt, au bord de Tripoli, a tué quelque 500 soldats italiens, et les troupes italiennes se sont venger du peuple de l’oasis, tuant des milliers de civils.
On 5 November Italy declared Libya annexed, but its army, eventually some 100,000 men, held little more than the coast. Young Ottoman officers, among them Enver Bey and Mustafa Kemal, slipped into the country through Egypt and Tunisia to organise Arab and Berber fighters, including the Senussi religious order in Cyrenaica, and the war became one of trenches around the Italian-held towns. It was the first war in which aircraft were used. Captain Carlo Piazza flew the first reconnaissance flight on 23 October 1911, and on 1 November Lieutenant Giulio Gavotti dropped the first bombs from an aeroplane.: Le 5 novembre l’Italie a déclaré la Libye annexée, mais son armée, finalement quelque 100 000 hommes, n’a que peu plus tenu que la côte. De jeunes officiers ottomans, parmi lesquels Enver Bey et Mustafa Kemal, ont glissé dans le pays à travers l’Égypte et la Tunisie pour organiser des combattants arabes et berbères, y compris l’ordre religieux de Senussi à Cyrénaica, et la guerre est devenue une des tranchées autour des villes tenues par l’Italie. Le capitaine Carlo Piazza a effectué le premier vol de reconnaissance le 23 octobre 1911 et, le 1er novembre, le lieutenant Giulio Gavotti a largué les premières bombes d’un avion.
