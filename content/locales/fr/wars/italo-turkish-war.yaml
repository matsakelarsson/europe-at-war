The Dodecanese and the Treaty of Ouchy: Le Dodécanèse et le Traité de Ouchy
February – October 1912: février – octobre 1912
Unable to win in Libya, Italy carried the war to the eastern Mediterranean to force the Ottomans to make peace. In February 1912 Italian cruisers sank two Ottoman warships in the harbour of Beirut, killing civilians ashore, and in April they shelled the forts at the mouth of the Dardanelles, which the Ottomans closed to shipping. Between late April and May Italian forces occupied the Dodecanese islands off the Anatolian coast. On Rhodes troops landed on 4 May, and the Ottoman garrison surrendered in the mountains near Psithos on 16–17 May. In July Italian torpedo boats made a night raid into the Dardanelles.: Incapable de gagner en Libye, l’Italie a porté la guerre à l’est de la Méditerranée pour forcer les Ottomans à faire la paix. En février 1912, les croiseurs italiens ont coulé deux navires de guerre ottomans dans le port de Beyrouth, tuant des civils à terre, et en avril ils ont bombardé les forts à l’embouchure des Dardanelles, que les Ottomans fermèrent pour la navigation. Les troupes de Rhodes débarquèrent le 4 mai, et la garnison ottomane se rendit dans les montagnes près de Psithos les 16-17 mai. En juillet, des torpilles italiennes firent un raid nocturne dans les Dardanelles.
Talks opened in Switzerland in the summer, and with the Balkan states about to attack, the Ottomans signed the Treaty of Ouchy, near Lausanne, on 18 October 1912. They withdrew their troops and officials from Libya, while the Sultan kept a religious role there. Italy promised to return the Dodecanese once the last Ottoman forces had left Libya, but never did, and Turkey gave up the islands in 1923. In Libya, the Senussi and other fighters kept up their resistance, and Italy was not in control of the whole country until 1932, after a brutal campaign in which tens of thousands of Libyans died.: Les pourparlers ont commencé en Suisse l’été, et avec les Etats balkaniques sur le point d’attaquer, les Ottomans ont signé le traité de Ouchy, près de Lausanne, le 18 octobre 1912. Ils ont retiré leurs troupes et leurs officiels de Libye, tandis que le Sultan y conservait un rôle religieux. L’Italie a promis de retourner le Dodécanèse une fois que les dernières forces ottomanes avaient quitté la Libye, mais jamais, et la Turquie a abandonné les îles en 1923. En Libye, les Senussi et d’autres combattants ont maintenu leur résistance, et l’Italie n’a pas été en contrôle sur tout le pays avant 1932, après une campagne brutale au cours de laquelle des dizaines de milliers de Libyens sont morts.
