Italo-Turkish War: Guerre italo-turque
A war in which Italy seized the Ottoman provinces of Tripolitania and Cyrenaica, today’s Libya, and occupied the Dodecanese islands in the Aegean. The Ottomans gave up Libya by the Treaty of Ouchy in October 1912, but Libyan resistance to Italian rule went on for twenty years.: Une guerre dans laquelle l’Italie s’empare des provinces ottomanes de Tripolitanie et de Cyrénaïque, aujourd'hui Libye, et occupe les îles du Dodécanèse dans la mer Égée. Les Ottomans abandonnent la Libye par le traité d’Ouchy en octobre 1912, mais la résistance libyenne à la domination italienne dure vingt ans.
Known in Italy as the Libyan War (Guerra di Libia) and in Turkey as the Tripolitanian War. The Treaty of Ouchy, signed in the lakeside quarter of Lausanne, is also called the First Treaty of Lausanne. Its quick Ottoman defeat encouraged the Balkan states, and the First Balkan War began days before the peace was signed.: Connu en Italie comme la guerre de Libye (Guerra di Libia) et en Turquie comme la guerre Tripolitaine. Le traité d’Ouchy, signé au bord du lac de Lausanne, est également appelé le premier traité de Lausanne. Sa défaite ottomane rapide a encouragé les États des Balkans, et la première guerre balkanique a commencé quelques jours avant la signature de la paix.
Italian losses were about 3,400–6,000 dead, many of them from disease. Ottoman and Libyan losses are less certain; one estimate is about 14,000 killed in action or dead of disease and some 10,000 killed in reprisals and executions.: Les pertes italiennes ont été d’environ 3 400 à 6 000 morts, dont beaucoup sont dues à des maladies. Les pertes ottomanes et libyennes sont moins certaines ; on estime qu’il y en a environ 14 000 tués au combat ou morts de maladie et quelque 10 000 tués en représailles et exécutions.
