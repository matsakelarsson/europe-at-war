# French translations of the catalogue text (wave 13); step bodies follow later.
Ituri conflict: Conflit de l’Ituri
? "Last updated 27 November 2026. A conflict in the Ituri region of north-eastern DR Congo, rooted in disputes over land and local power between the mainly pastoralist Hema and the mainly farming Lendu, which became a war during the Second Congo War. In June 1999 the Ugandan army, which occupied the region, made Ituri a province under a Hema governor; Ugandan officers and traders took sides, and fighting between Hema and Lendu spread. Ethnic militias, among them Thomas Lubanga’s Hema UPC, the Lendu FNI, the Ngiti FRPI and PUSIC, backed at different times by Uganda, Rwanda and Kinshasa, fought over Bunia and the gold mines and committed massacres such as Nyankunde in 2002 and Bogoro and Drodro in 2003. When the Ugandan army withdrew in May 2003 and fighting engulfed Bunia, the European Union sent a French-led force (Operation Artemis, June to September 2003) before handing over to the UN mission. Most militias were disarmed by 2007, and in 2012 Lubanga became the first person convicted by the International Criminal Court. Estimates of the dead for 1999–2006 range from more than 50,000 to about 60,000, and some 500,000 people were displaced. From December 2017 violence returned: CODECO, an armed political-religious movement drawn from the Lendu, attacked Hema villages and displacement camps, among them Plaine Savo in 2022 and Djaiba in February 2025, and Hema militias formed in response. In 2025 Uganda sent troops to fight CODECO, and Lubanga, released in 2020, founded a new armed group, the Convention for the Popular Revolution (CRP). In late April 2026 CODECO attacks, in reprisal for a CRP attack, killed at least 69 people, among them militiamen and soldiers; on 23 November the CRP took Iga-Barrière, some 25 km north of Bunia, and on 24 November announced that it would halt its advance and withdraw, citing talks mediated by Uganda."
: "Dernière mise à jour : 27 novembre 2026. Un conflit dans la région de l’Ituri, dans le nord-est de la RD Congo, enraciné dans des différends fonciers et des rivalités de pouvoir local entre les Hema, majoritairement éleveurs, et les Lendu, majoritairement agriculteurs, et qui devint une guerre pendant la deuxième guerre du Congo. En juin 1999, l’armée ougandaise, qui occupait la région, fit de l’Ituri une province confiée à un gouverneur hema ; des officiers et des marchands ougandais prirent parti, et les combats entre Hema et Lendu s’étendirent. Des milices ethniques, parmi lesquelles l’UPC hema de Thomas Lubanga, le FNI lendu, la FRPI ngiti et le PUSIC, soutenues à divers moments par l’Ouganda, le Rwanda et Kinshasa, se disputèrent Bunia et les mines d’or et commirent des massacres comme ceux de Nyankunde en 2002 et de Bogoro et Drodro en 2003. Lorsque l’armée ougandaise se retira en mai 2003 et que les combats embrasèrent Bunia, l’Union européenne envoya une force sous commandement français (opération Artémis, de juin à septembre 2003) avant de passer le relais à la mission de l’ONU. La plupart des milices furent désarmées en 2007 et, en 2012, Lubanga devint la première personne condamnée par la Cour pénale internationale. Les estimations du nombre de morts pour 1999–2006 vont de plus de 50 000 à environ 60 000, et quelque 500 000 personnes furent déplacées. À partir de décembre 2017, la violence reprit : la CODECO, mouvement armé politico-religieux issu des Lendu, attaqua des villages hema et des camps de déplacés, dont Plaine Savo en 2022 et Djaiba en février 2025, et des milices hema se formèrent en réaction. En 2025, l’Ouganda a envoyé des troupes combattre la CODECO, et Lubanga, libéré en 2020, a fondé un nouveau groupe armé, la Convention pour la révolution populaire (CRP). Fin avril 2026, des attaques de la CODECO, en représailles à une attaque de la CRP, ont fait au moins 69 morts, parmi lesquels des miliciens et des soldats ; le 23 novembre, la CRP a pris Iga-Barrière, à quelque 25 km au nord de Bunia, et le 24 novembre, elle a annoncé qu’elle arrêtait son avance et se retirait, invoquant des pourparlers menés sous médiation ougandaise."
