# Some French text was translated automatically.
"Jacobite rising of 1689": "Jacobite levant de 1689"
"A rising in the Scottish Highlands for the deposed James VII (James II of England), led by John Graham of Claverhouse, Viscount Dundee, who raised the Stuart standard in April 1689 after the Scottish Convention offered the crown to William and Mary. On 27 July his Highlanders routed the government army of Hugh Mackay at Killiecrankie with a downhill charge, but Dundee was killed, and on 21 August the newly raised Cameronian regiment held Dunkeld against them. Major fighting ended when government cavalry surprised and scattered the Jacobites at Cromdale on 1 May 1690. The Highland chiefs agreed to swear allegiance to William and Mary in 1691, and the war is often taken to end with the Massacre of Glencoe in February 1692, when government soldiers killed more than 30 MacDonalds whose chief had been late to take the oath.": "Une montée dans les Highlands écossais pour le déposé James VII (James II d’Angleterre), dirigé par John Graham de Claverhouse, vicomte Dundee, qui a élevé la norme Stuart en avril 1689 après que la convention écossaise offre la couronne à William et Mary. Le 27 juillet, ses Highlanders acheminèrent l’armée gouvernementale de Hugh Mackay à Killiecrankie avec une charge de descente, mais Dundee fut tué, et le 21 août, le régiment Cameronien nouvellement élevé tenait Dunkeld contre eux. Les combats majeurs ont pris fin lorsque la cavalerie du gouvernement a surpris et dispersé les Jacobites à Cromdale le 1er mai 1690. Les chefs des Highlands acceptèrent de prêter allégeance à William et Mary en 1691, et la guerre prit souvent fin avec le massacre de Glencoe en février 1692, lorsque les soldats du gouvernement tuèrent plus de 30 MacDonald dont le chef avait été en retard pour prêter serment."
"Dates are Old Style (Julian). The rising was linked to the Williamite War in Ireland, where James himself fought.": "Les dates sont Old Style (Julian). L’ascension a été liée à la guerre des Williamites en Irlande, où James lui-même s’est battu."
