# Some French text was translated automatically.
"Jacobite rising of 1715": "Jacobite levant de 1715"
"A rising in Scotland and northern England to put James Francis Edward Stuart, son of the deposed James II and VII, on the British throne in place of the Hanoverian George I. The Earl of Mar raised James’s standard at Braemar on 6 September 1715 and soon held Perth and much of the north-east, but he moved slowly. A smaller force of Lowland Scots, Northumbrian and Lancashire Jacobites marched into England and surrendered at Preston on 14 November, the day after Mar’s larger army fought the Duke of Argyll to a draw at Sheriffmuir and then fell back. James himself landed at Peterhead in December, too late; with Dutch troops reinforcing Argyll, he and Mar sailed for France from Montrose on 4 February 1716. Two Jacobite earls were beheaded, and hundreds of prisoners were transported to the colonies.": "Une montée en Écosse et au nord de l’Angleterre pour placer James Francis Edward Stuart, fils du déposé Jacques II et VII, sur le trône britannique à la place du Hanovre George I. Le comte de Mar a élevé Jamess standard à Braemar le 6 septembre 1715 et bientôt tenu Perth et une grande partie du nord-est, mais il a déménagé lentement. Une force plus petite d’Écossais de Lowland, de Northumbrian et de Lancashire Jacobites marcha en Angleterre et se rendit à Preston le 14 novembre, au lendemain de la bataille du Duc d’Argyll par une armée plus importante, puis il tomba. James lui-même débarqua à Peterhead en décembre, trop tard ; avec les troupes néerlandaises qui renforçaient Argyll, lui et Mar s’embarquèrent pour la France à partir de Montrose le 4 février 1716. Deux oreillers jacobites furent décapités, et des centaines de prisonniers furent transportés vers les colonies."
"Dates are Old Style (Julian), as usual in British accounts; on the Continent, which used the Gregorian calendar, they were eleven days later.": "Les dates sont Old Style (Julien), comme d’habitude dans les comptes britanniques ; sur le continent, qui a utilisé le calendrier grégorien, ils étaient onze jours plus tard."
"Known in Scotland as “the Fifteen”. The death of Louis XIV on 1 September 1715 cost the Jacobites the French help they had hoped for.": "Connu en Écosse comme les Quinze. La mort de Louis XIV le 1er septembre 1715 a coûté aux Jacobites l’aide française qu’ils avaient espérée."
