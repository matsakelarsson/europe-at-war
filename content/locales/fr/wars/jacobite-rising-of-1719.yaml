# Some French text was translated automatically.
"Jacobite rising of 1719": "Jacobite levant de 1719"
"A Jacobite rising backed by Spain during the War of the Quadruple Alliance. Philip V’s minister, Cardinal Alberoni, planned to land some 5,000 Spanish troops under the exiled Duke of Ormonde in south-west England, with a smaller diversion in Scotland, but storms scattered the main fleet off Cape Finisterre in late March. The Scottish expedition, a few hundred Spanish marines with Jacobite exiles under the Earl Marischal and the Marquess of Tullibardine, landed on Lewis and then at Loch Alsh, using Eilean Donan castle as its base until Royal Navy ships bombarded the castle and blew it up in May. About 1,000 Highlanders joined, but on 10 June 1719 government troops under General Joseph Wightman beat the Jacobites at Glen Shiel. The Highlanders dispersed, and the Spaniards surrendered and were later sent home.": "Un jacobite soutenu par l’Espagne pendant la guerre de l’Alliance Quadruple. Philips ministre, Cardinal Alberoni, a prévu d’atterrir quelque 5 000 troupes espagnoles sous le duc exilé d’Ormonde dans le sud-ouest de l’Angleterre, avec une moindre diversion en Écosse, mais les tempêtes ont dispersé la flotte principale au large du cap Finisterre à la fin mars. L’expédition écossaise, quelques centaines de marines espagnols avec des exilés jacobites sous le comte Marischal et le marquis de Tullibardine, débarqua sur Lewis puis à Loch Alsh, utilisant le château d’Eilean Donan comme base jusqu’à ce que les navires de la Royal Navy bombardent le château et l’explosent en mai. Environ 1 000 Highlanders se joignirent, mais le 10 juin 1719 les troupes gouvernementales sous la direction du général Joseph Wightman battèrent les Jacobites à Glen Shiel. Les Highlanders se dispersèrent et les Espagnols se rendirent et furent ensuite renvoyés chez eux."
"Dates are Old Style (Julian), as usual in British accounts; Glen Shiel was fought on 21 June by the Gregorian calendar.": "Les dates sont Old Style (Julien), comme d’habitude dans les comptes britanniques ; Glen Shiel a été combattu le 21 Juin par le calendrier grégorien."
