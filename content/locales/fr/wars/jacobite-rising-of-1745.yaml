"Britain was at war with France, and in 1744 a French invasion planned in support of the Stuarts had been called off after storms wrecked its transports. Charles Edward Stuart, the 24-year-old son of the exiled James Francis Edward, decided to go anyway. He landed on Eriskay in the Outer Hebrides on 23 July 1745 with seven companions, and two days later on the mainland at Loch nan Uamh. Many clan chiefs urged him to go home, but Donald Cameron of Lochiel and the MacDonalds of Keppoch and Clanranald joined him, and on 19 August he raised his father’s standard at Glenfinnan.": "La Grande-Bretagne était en guerre avec la France et, en 1744, une invasion française planifiée pour soutenir les Stuart avait été déclenchée après que des tempêtes aient détruit ses transports. Charles Edward Stuart, le fils de 24 ans de l’exilé James Francis Edward, décida d’aller de toute façon. Il débarqua sur Eriskay dans les Hébrides extérieures le 23 juillet 1745 avec sept compagnons, et deux jours plus tard sur le continent à Loch nan Uamh. De nombreux chefs de clan l’exhortèrent à rentrer chez lui, mais Donald Cameron de Lochiel et les MacDonalds de Keppoch et Clanranald se joignirent à lui."
"Most of the British army was fighting in Flanders. Sir John Cope marched north with the small army in Scotland but avoided the Jacobites waiting in the Corrieyairack Pass and went on to Inverness, leaving the road south open. The Jacobites entered Perth and, on 17 September, Edinburgh, though its castle held out; Charles proclaimed his father king as James VIII. Cope brought his army back by sea to Dunbar, and at dawn on 21 September the Highlanders charged it across the fields at Prestonpans. Cope’s army broke within minutes and lost most of its infantry killed or captured, and for a time the Jacobites controlled most of Scotland.": "La plupart de l’armée britannique se battait en Flandre. Sir John Cope marchait vers le nord avec la petite armée en Écosse, mais évitait les Jacobites d’attendre dans le col de Corrieyairack et allait à Inverness, laissant la route au sud ouverte. Les Jacobites entrèrent à Perth et, le 17 septembre, Edimbourg, bien que son château tenait ; Charles proclama son père roi Jacques VIII. Cope ramena son armée par la mer à Dunbar, et à l’aube le 21 septembre les Highlanders l’inculpèrent dans les champs de Prestonpans. L’armée de Cope explosa en quelques minutes et perdit la plupart de son fantassin tué ou capturé, et pendant un temps les Jacobites contrôlèrent la majeure partie de l’Écosse."
