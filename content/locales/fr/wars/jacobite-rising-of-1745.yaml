"Jacobite rising of 1745": "Soulèvement jacobite de 1745"
"The last Jacobite rising, in which Charles Edward Stuart, the grandson of the deposed James II and VII, tried to win back the British thrones for his father. Raising the Highland clans in August 1745, he took Edinburgh, routed the government army at Prestonpans and marched into England as far as Derby, but turned back, and after a last victory at Falkirk his army was destroyed at Culloden in April 1746. Harsh repression in the Highlands followed.": "Le dernier jacobite se levant, dans lequel Charles Edward Stuart, petit-fils des Jacques II et VII déchus, tenta de reconquérir les trônes britanniques pour son père. En août 1745, il fit monter les clans des Highlands, prit Edimbourg, dirigea l’armée gouvernementale à Prestonpans et marcha en Angleterre jusqu’à Derby, mais se retourna, et après une dernière victoire à Falkirk, son armée fut détruite à Culloden en avril 1746."
"Dates are Old Style (Julian), as usual in British accounts; on the Continent, which used the Gregorian calendar, they were eleven days later, so Culloden was fought on 27 April 1746 New Style.": "Les dates sont Old Style (Julien), comme d’habitude dans les comptes britanniques ; sur le continent, qui a utilisé le calendrier grégorien, ils étaient onze jours plus tard, de sorte que Culloden a été combattu le 27 avril 1746 New Style."
"Known in Scotland as “the Forty-Five”. Britain and France were at war in the War of the Austrian Succession; France sent the Jacobites money, arms and a few hundred regular soldiers of its Scottish and Irish regiments, but its planned invasion of England never sailed. Many Scots, including whole clans and most of the Lowlands, sided with the government.": "Connu en Ecosse comme la quarante-cinquième. La Grande-Bretagne et la France étaient en guerre dans la guerre de la Succession d’Autriche ; la France envoya l’argent des Jacobites, les armes et quelques centaines de soldats réguliers de ses régiments écossais et irlandais, mais son invasion planifiée de l’Angleterre ne s’embarqua jamais. Beaucoup d’Écossais, y compris des clans entiers et la plupart des Lowlands, se joignirent au gouvernement."
