"Charles insisted on invading England, against the doubts of his commanders, hoping that English Jacobites would rise and that France would land an army in the south. On 8 November about 5,500 men crossed the border. They took Carlisle after a short siege on 15 November and marched south through Lancashire, avoiding Marshal Wade’s army at Newcastle. Few Englishmen joined them, apart from the 300 or so of the Manchester Regiment, raised in Manchester. On 4 December the Jacobites reached Derby, about 200 km from London, where the news caused alarm and a run on the Bank of England.": "Charles a insisté pour envahir l’Angleterre, contre les doutes de ses commandants, espérant que les Jacobites anglais s’élèveraient et que la France débarquerait une armée dans le sud. Le 8 novembre environ 5 500 hommes ont franchi la frontière. Ils ont pris Carlisle après un bref siège le 15 novembre et ont marché au sud à travers Lancashire, évitant l’armée du maréchal Wadeís à Newcastle. Peu d’Anglais se joignirent à eux, en dehors des quelque 300 du Manchester Regiment, élevé à Manchester. Le 4 décembre les Jacobites atteignirent Derby, à environ 200 km de Londres, où la nouvelle causa l’alarme et une course sur la Bank of England."
"By then the Duke of Cumberland’s army was in the Midlands, Wade’s was moving south behind the Jacobites, and a third was gathering to defend London. At a council of war in Derby on 5 December Lord George Murray and the other commanders, seeing no sign of an English rising or a French landing, insisted on retreat, and Charles bitterly gave way. A government agent had also falsely reported another army blocking the road at Northampton. The retreat began on 6 December. Murray’s rearguard fought off Cumberland’s advance guard at Clifton Moor on 18 December, and the army recrossed the border on 20 December, leaving a garrison in Carlisle that surrendered to Cumberland ten days later.": "À l’époque, l’armée du Duc de Cumberland se trouvait dans les Midlands, les Wade's se déplaçaient au sud derrière les Jacobites, et un troisième se rassemblait pour défendre Londres. Lors d’un conseil de guerre à Derby le 5 décembre, Lord George Murray et les autres commandants, ne voyant aucun signe d’une montée anglaise ou d’un débarquement français, insistèrent sur la retraite, et Charles abandonna amèrement la place. Un agent du gouvernement avait également faussement signalé une autre armée bloquant la route à Northampton. La retraite a commencé le 6 décembre. L’arrière-garde Murray s’est battue au large de Cumberland le garde avancé à Clifton Moor le 18 décembre, et l’armée a traversé la frontière le 20 décembre, laissant une garnison à Carlisle qui s’était rendue à Cumberland dix jours plus tard."
