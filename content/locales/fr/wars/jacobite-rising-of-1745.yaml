"Back in Scotland the Jacobites gathered reinforcements, among them French regulars of the Royal Écossais and the Irish Picquets who had landed on the east coast, and besieged Stirling Castle. On 17 January 1746 General Henry Hawley marched to relieve it and was beaten at Falkirk Muir in a storm of wind and rain, but the Jacobites did not follow up. Stirling held out, and as Cumberland advanced from Edinburgh the clan chiefs insisted on a retreat into the Highlands. They took Inverness and Fort Augustus but failed to take Fort William, while Cumberland drilled his army at Aberdeen and the Royal Navy stopped most French supplies from getting through.": "De retour en Écosse, les Jacobites rassemblèrent des renforts, parmi lesquels les Français réguliers de l’Écossais royal et les Picquets irlandais qui avaient débarqué sur la côte est, et assiégé le château Stirling. Le 17 janvier 1746, le général Henry Hawley marcha pour le soulager et fut battu à Falkirk Muir dans une tempête de vent et de pluie, mais les Jacobites ne suivirent pas. Stirling s’empara, et à mesure que Cumberland avançait d’Édimbourg, les chefs de clan insistèrent pour une retraite dans les Highlands. Ils prirent Inverness et Fort Augustus mais échouèrent à prendre le fort William, tandis que Cumberland forait son armée à Aberdeen et la Marine royale empêcha la plupart des fournitures françaises de passer."
"In April Cumberland marched west from Aberdeen. A Jacobite night march to surprise his camp at Nairn failed, and on 16 April the hungry and exhausted Jacobite army, about 5,000 strong, stood on open moorland at Culloden, east of Inverness, against about 8,000 government troops. Cumberland’s artillery tore into the Highland line, and its charge, when it came, broke on musketry and bayonets within an hour. Some 1,500 to 2,000 Jacobites died, many of them wounded men and fugitives killed after the battle; the government lost about 50 killed and 250 wounded. Charles, helped by Flora MacDonald among others, escaped to France in September. Government troops burned and plundered across the Highlands; about 120 Jacobites were executed and hundreds transported, and Parliament banned Highland dress and abolished the chiefs’ hereditary jurisdictions.": "En avril, Cumberland marcha à l’ouest d’Aberdeen. Une marche de nuit jacobite pour surprendre son camp à Nairn échoua et, le 16 avril, l’armée jacobite affamée et épuisée, environ 5 000 hommes forts, se tint sur un mouillage ouvert à Culloden, à l’est d’Inverness, contre environ 8 000 hommes du gouvernement. L’artillerie de Cumberland s’est déchirée dans la ligne Highland, et sa charge, lorsqu’elle est venue, a cassé sur le mousquet et les baïonnettes en une heure. Environ 1 500 à 2 000 Jacobites sont morts, beaucoup d’entre eux ont blessé des hommes et des fugitifs tués après la bataille ; le gouvernement a perdu environ 50 tués et 250 blessés. Charles, aidé par Flora MacDonald entre autres, s’est échappé en France en septembre. Les troupes gouvernementales ont brûlé et pillé à travers les Highlands ; environ 120 Jacobites ont été exécutés et des centaines transportés, et le Parlement a interdit l’habillement Highland et aboli les chefs des juridictions héréditaires."
