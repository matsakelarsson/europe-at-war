"Jacquerie": "Jacquerie"
"A peasant rising in the Beauvaisis and neighbouring districts north of Paris in late May and June 1358, two years after the capture of King John II at Poitiers. Led by Guillaume Cale, bands of rebels, called Jacques, burned noble houses and killed many nobles and their families, and Étienne Marcel’s Paris briefly made common cause with them. On 9–10 June the nobles, led by Charles II of Navarre, crushed the rebels at Mello and Meaux, and thousands of peasants were killed in the reprisals that followed.": "Un paysan qui s’élève dans les Beauvaisis et les districts voisins au nord de Paris à la fin mai et juin 1358, deux ans après la capture du roi Jean II à Poitiers. Dirigé par Guillaume Cale, des bandes de rebelles, appelés Jacques, brûlent des maisons nobles et tuent de nombreux nobles et leurs familles, et Étienne Marcélès fait brièvement cause commune avec eux. Les 9 et 10 juin, les nobles, dirigés par Charles II de Navarre, écrasèrent les rebelles à Mello et à Meaux, et des milliers de paysans furent tués dans les représailles qui suivirent."
"The name comes from Jacques Bonhomme, the nobles’ mocking name for a peasant. The best-known accounts, by Jean Froissart and Jean le Bel, were written from the nobles’ point of view.": "Le nom vient de Jacques Bonhomme, les nobles du nom moqueur d’un paysan. Les récits les plus connus, de Jean Froissart et Jean le Bel, ont été écrits du point de vue des nobles."
