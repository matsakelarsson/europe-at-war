# French translations of the catalogue text (wave 13); step bodies follow later.
Jaga invasion of Kongo: Invasion jaga du Kongo
? "The invasion of the Kingdom of Kongo by warriors the Portuguese called “Jaga”, and the Portuguese expedition that restored King Álvaro I. In the traditional account, taken from the book that Kongo’s ambassador Duarte Lopes gave to Filippo Pigafetta in Rome (1591), the Jaga crossed into Kongo from the east in 1568, soon after Álvaro I came to the throne, routed his army and sacked the capital, Mbanza Kongo. The king and his court fled to an island in the Congo River, where, Pigafetta wrote, hunger and disease killed many and starving refugees sold one another as slaves to Portuguese traders from São Tomé for food. Álvaro appealed to King Sebastian of Portugal, who sent about 600 soldiers, most of them from São Tomé, under Francisco de Gouveia Sottomaior, the island’s governor. With them and Kongo’s own forces Álvaro took back his capital and drove the invaders out by the mid-1570s; the Jaga remained a power on the eastern frontier and later served Kongo’s rival kings as mercenaries. The price of the rescue was Portuguese influence: Álvaro let Paulo Dias de Novais found a colony at Luanda in 1575–1576, on land that Kongo claimed, and Portuguese priests gained a voice at court. Who the Jaga were is debated. Older writers linked them with the Imbangala of Angola, whom the Portuguese also called Jaga; Joseph Miller (1972) showed that the two were different groups, and many historians have identified the invaders with people from the Kwango valley later known as the Yaka. John Thornton (2022), using newly found documents, among them a petition by the Jesuit João Ribeiro Gaio, who served with the Portuguese relief army from 1571 to 1575, argues that the invasion had begun by 1567, under King Bernardo I, whom a contemporary testimony says the Jaga killed; that the invaders were a small, skilled army that came through the empire of Mwene Muji, near Lake Mai-Ndombe, and had “no domicile nor a king of their own”, rather than a migrating people; and that they were expelled around 1575."
: "L’invasion du royaume du Kongo par des guerriers que les Portugais appelaient « Jaga », et l’expédition portugaise qui rétablit le roi Álvaro Ier. Selon le récit traditionnel, tiré du livre que l’ambassadeur du Kongo Duarte Lopes remit à Filippo Pigafetta à Rome (1591), les Jaga pénétrèrent au Kongo par l’est en 1568, peu après l’avènement d’Álvaro Ier, mirent son armée en déroute et saccagèrent la capitale, Mbanza Kongo. Le roi et sa cour se réfugièrent sur une île du fleuve Congo où, selon Pigafetta, la faim et la maladie firent de nombreux morts et où des réfugiés affamés se vendaient les uns les autres comme esclaves à des marchands portugais de São Tomé en échange de nourriture. Álvaro fit appel au roi Sébastien de Portugal, qui envoya environ 600 soldats, venus pour la plupart de São Tomé, sous le commandement de Francisco de Gouveia Sottomaior, gouverneur de l’île. Avec eux et les forces du Kongo, Álvaro reprit sa capitale et chassa les envahisseurs vers le milieu des années 1570 ; les Jaga restèrent une puissance sur la frontière orientale et servirent plus tard de mercenaires aux rois rivaux du Kongo. Ce secours eut pour prix l’influence portugaise : Álvaro laissa Paulo Dias de Novais fonder une colonie à Luanda en 1575–1576, sur des terres que revendiquait le Kongo, et des prêtres portugais obtinrent voix au chapitre à la cour. L’identité des Jaga est débattue. Les auteurs anciens les rapprochaient des Imbangala de l’Angola, que les Portugais appelaient aussi Jaga ; Joseph Miller (1972) montra qu’il s’agissait de groupes distincts, et de nombreux historiens ont identifié les envahisseurs à des habitants de la vallée du Kwango connus plus tard sous le nom de Yaka. John Thornton (2022), s’appuyant sur des documents nouvellement découverts, parmi lesquels une pétition du jésuite João Ribeiro Gaio, qui servit dans l’armée de secours portugaise de 1571 à 1575, soutient que l’invasion avait commencé dès 1567, sous le roi Bernardo Ier, que les Jaga tuèrent selon un témoignage contemporain ; que les envahisseurs étaient une petite armée aguerrie, venue par l’empire du Mwene Muji, près du lac Mai-Ndombe, et n’ayant « ni domicile ni roi à eux », plutôt qu’un peuple en migration ; et qu’ils furent chassés vers 1575."
