# French translations of the catalogue text (wave 7); step bodies follow later.
Campaigns of Jalal al-Din Mangburni: Campagnes de Jalal al-Din Mangburni
The wars of the last Khwarazmshah, Jalal al-Din Mangburni, after Genghis Khan destroyed his father’s empire. Having escaped across the Indus in 1221, he spent three years in the Punjab and Sind, then came back to Iran in 1224 and built a new realm in Kerman, Fars, central Iran and Azerbaijan, taking Tabriz from the Eldiguzids in 1225. He crushed the Georgians at Garni and sacked Tbilisi, fought the Abbasid caliph and the Mongols, and took the Ayyubid town of Akhlat in 1230 after a long siege. That conquest united the Seljuks of Rum and the Ayyubids against him, and they defeated him near Erzincan in August 1230. When a new Mongol army came in 1231 his followers scattered, and he was killed by a Kurd near Mayyafariqin in August 1231.: Les guerres du dernier shah du Khwarezm, Jalal al-Din Mangburni, après la destruction de l’empire de son père par Gengis Khan. Après avoir fui au-delà de l’Indus en 1221, il passa trois ans au Pendjab et dans le Sind, puis revint en Iran en 1224 et se constitua un nouveau royaume dans le Kerman, le Fars, le centre de l’Iran et l’Azerbaïdjan, prenant Tabriz aux Ildéguzides en 1225. Il écrasa les Géorgiens à Garni et mit à sac Tbilissi, combattit le calife abbasside et les Mongols, et prit la ville ayyoubide d’Akhlat en 1230 après un long siège. Cette conquête unit contre lui les Seldjoukides de Roum et les Ayyoubides, qui le battirent près d’Erzincan en août 1230. Lorsqu’une nouvelle armée mongole arriva en 1231, ses partisans se dispersèrent, et il fut tué par un Kurde près de Mayyafariqin en août 1231.
