# French translations of the catalogue text (wave 14); step bodies follow later.
Jamaat al Muslimeen coup attempt: Tentative de coup d’État du Jamaat al Muslimeen
? An attempt by the Jamaat al Muslimeen, a Muslim organisation led by Yasin Abu Bakr, a former police officer, to overthrow the government of Trinidad and Tobago. The group had long been in dispute with the state over land at No. 1 Mucurapo Road in Port of Spain, which it occupied and where a court had ordered it to leave, and it condemned the hardship caused by the austerity of Prime Minister A. N. R. Robinson’s government; its armed men had also run anti-drug patrols, and a police raid on its compound in 1988 deepened the quarrel. At about 6 p.m. on Friday 27 July 1990, shortly after a bomb went off at police headquarters, 42 armed members led by Bilaal Abdullah stormed the Red House, the seat of Parliament, during a sitting and took Robinson and most of his cabinet hostage, while Abu Bakr and 72 others seized the state television station, Trinidad and Tobago Television, from which he announced that the government had been overthrown. Robinson was beaten and shot in the leg after calling on the army to attack. While the police and the Trinidad and Tobago Defence Force surrounded the two buildings, widespread looting and arson broke out in Port of Spain and along the East–West Corridor, and a curfew was imposed. After six days of negotiation the insurgents released their hostages and surrendered on 1 August in return for a written amnesty. About 24 people died, among them the member of Parliament Leo Des Vignes, and many more were injured; losses from looting and arson were later estimated at TT$450 million. The insurgents were charged with treason, but the courts upheld the amnesty and they were freed in 1992; the Privy Council later held that the amnesty was invalid but that they could not be re-arrested. A Commission of Enquiry reported in 2014 that the security services had failed to act on warnings of the attack.
: Une tentative du Jamaat al Muslimeen, organisation musulmane dirigée par Yasin Abu Bakr, ancien policier, pour renverser le gouvernement de Trinité-et-Tobago. Le groupe était depuis longtemps en conflit avec l’État au sujet d’un terrain situé au n° 1 Mucurapo Road, à Port-d’Espagne, qu’il occupait et qu’un tribunal lui avait ordonné de quitter, et il dénonçait les difficultés causées par la politique d’austérité du gouvernement du Premier ministre A. N. R. Robinson ; ses hommes armés avaient aussi mené des patrouilles antidrogue, et une descente de police dans son enceinte, en 1988, avait envenimé la querelle. Vers 18 heures le vendredi 27 juillet 1990, peu après l’explosion d’une bombe au quartier général de la police, 42 membres armés menés par Bilaal Abdullah donnèrent l’assaut à la Red House, siège du Parlement, en pleine séance et prirent en otage Robinson et la plupart de ses ministres, tandis qu’Abu Bakr et 72 autres s’emparaient de la télévision d’État, Trinidad and Tobago Television, d’où il annonça que le gouvernement avait été renversé. Robinson fut battu et blessé par balle à la jambe après avoir appelé l’armée à donner l’assaut. Pendant que la police et la Force de défense de Trinité-et-Tobago encerclaient les deux bâtiments, des pillages et des incendies se répandirent à Port-d’Espagne et le long du corridor Est–Ouest, et un couvre-feu fut imposé. Après six jours de négociations, les insurgés libérèrent leurs otages et se rendirent le 1er août en échange d’une amnistie écrite. Environ 24 personnes moururent, dont le député Leo Des Vignes, et beaucoup d’autres furent blessées ; les pertes dues aux pillages et aux incendies furent plus tard estimées à 450 millions de dollars de Trinité-et-Tobago. Les insurgés furent inculpés de trahison, mais les tribunaux confirmèrent l’amnistie et ils furent libérés en 1992 ; le Conseil privé jugea plus tard que l’amnistie n’était pas valable, mais qu’ils ne pouvaient pas être arrêtés de nouveau. Une commission d’enquête conclut en 2014 que les services de sécurité n’avaient pas donné suite aux avertissements annonçant l’attaque.
