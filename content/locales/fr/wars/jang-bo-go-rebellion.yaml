# French translations of the catalogue text (wave 10); step bodies follow later.
Jang Bo-go and the fall of Cheonghaejin: Jang Bo-go et la chute de Cheonghaejin
? The conflict between the Silla court and Jang Bo-go, the commander of the Cheonghaejin garrison on Wando, which ended with his killing and the closing of the garrison. Jang Bo-go, a man of humble origins from the south-western islands, had served as an officer in Tang China and, after returning to Silla, persuaded King Heungdeok in 828 to let him set up a garrison of 10,000 men at Cheonghae (Wando) to stop the slave raiders who seized Silla people on the coasts. From there his fleet dominated the trade between Silla, Tang China and Heian Japan. In 838–839 he sent 5,000 men to help Kim U-jing seize the throne; they defeated the royal army, King Minae was killed, and Kim U-jing became King Sinmu. Sinmu’s son, King Munseong, promised to take Jang Bo-go’s daughter as a royal consort, but court nobles objected to his low birth. According to the Samguk sagi, Jang Bo-go then turned against the king, and the court sent Yeom Jang, a former follower of his, who pretended to defect to him and killed him at a banquet. Jang Bo-go’s officer Yi Chang-jin and others held out at Cheonghaejin until Yeom Jang defeated them. In 851 the court abolished the garrison and moved its people to Byeokgol (Gimje).
: Le conflit entre la cour de Silla et Jang Bo-go, commandant de la garnison de Cheonghaejin, à Wando, qui se termina par son assassinat et la fermeture de la garnison. Jang Bo-go, homme d’humble origine venu des îles du sud-ouest, avait servi comme officier dans la Chine des Tang et, de retour à Silla, avait persuadé le roi Heungdeok, en 828, de le laisser établir une garnison de 10 000 hommes à Cheonghae (Wando) pour arrêter les pillards esclavagistes qui enlevaient des habitants de Silla sur les côtes. De là, sa flotte domina le commerce entre Silla, la Chine des Tang et le Japon de Heian. En 838–839, il envoya 5 000 hommes aider Kim U-jing à s’emparer du trône ; ils vainquirent l’armée royale, le roi Minae fut tué et Kim U-jing devint le roi Sinmu. Le fils de Sinmu, le roi Munseong, promit de prendre la fille de Jang Bo-go comme épouse royale, mais les nobles de la cour s’y opposèrent en raison de sa basse naissance. Selon le Samguk sagi, Jang Bo-go se retourna alors contre le roi, et la cour envoya Yeom Jang, l’un de ses anciens partisans, qui feignit de passer dans son camp et le tua au cours d’un banquet. Yi Chang-jin, officier de Jang Bo-go, et d’autres tinrent bon à Cheonghaejin jusqu’à ce que Yeom Jang les défasse. En 851, la cour abolit la garnison et transféra sa population à Byeokgol (Gimje).
