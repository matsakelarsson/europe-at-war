# French translations of the catalogue text (wave 7); step bodies follow later.
Jangali movement: Mouvement jangali
A rising in the forests of Gilan, on Iran’s Caspian coast, led by Mirza Kuchik Khan, a veteran of the Constitutional Revolution. His Jangalis (“men of the forest”) fought for reform and against foreign occupation, first the Russian troops in the north, then the British force that crossed Gilan in 1918, which they fought at Manjil on 12 June 1918 before coming to terms. In May 1920 the Soviet Red Fleet landed at Anzali in pursuit of White Russian ships, and in early June Kuchik Khan proclaimed the Persian Socialist Soviet Republic in Rasht with Soviet support. The alliance with the Iranian communists broke up within weeks. After the Soviet–Iranian treaty of February 1921 the Soviets withdrew, the Cossack forces of Reza Khan retook Gilan, and Kuchik Khan died of cold in the Talysh mountains on 2 December 1921; his head was cut off and sent to Reza Khan in Tehran.: Un soulèvement dans les forêts du Gilan, sur la côte caspienne de l’Iran, mené par Mirza Kuchik Khan, un vétéran de la révolution constitutionnelle. Ses Jangalis (« hommes de la forêt ») luttaient pour des réformes et contre l’occupation étrangère, d’abord celle des troupes russes dans le nord, puis celle de la force britannique qui traversa le Gilan en 1918, qu’ils combattirent à Manjil le 12 juin 1918 avant de s’entendre avec elle. En mai 1920, la flotte rouge soviétique débarqua à Anzali à la poursuite de navires des Russes blancs, et début juin Kuchik Khan proclama à Racht, avec le soutien soviétique, la République socialiste soviétique de Perse. L’alliance avec les communistes iraniens se rompit en quelques semaines. Après le traité soviéto-iranien de février 1921, les Soviétiques se retirèrent, les forces cosaques de Reza Khan reprirent le Gilan, et Kuchik Khan mourut de froid dans les montagnes du Talych le 2 décembre 1921 ; sa tête fut coupée et envoyée à Reza Khan à Téhéran.
