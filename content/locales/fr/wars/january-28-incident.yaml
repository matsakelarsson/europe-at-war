# French translations of the catalogue text (wave 9); step bodies follow later.
January 28 Incident: Incident du 28 janvier
? Five weeks of fighting between Japan and China in and around Shanghai in early 1932, also called the Shanghai Incident or the Shanghai War of 1932. Anger at the Japanese seizure of Manchuria had brought a boycott of Japanese goods in Shanghai. On 18 January five Japanese Nichiren monks were beaten by a crowd in the city and one of them died; a Japanese officer, Tanaka Ryūkichi, later said he had paid for the attack. Japanese residents retaliated, Japan sent warships and demanded that the boycott end, and on the night of 28 January Japanese naval landing troops moved into the Chinese district of Zhabei. The Cantonese 19th Route Army under Jiang Guangnai and Cai Tingkai fought back, joined in February by the Fifth Army under Zhang Zhizhong. Japanese aircraft and guns bombed Zhabei, where the Commercial Press and the Oriental Library burned, and Japan brought in army divisions under Shirakawa Yoshinori, about 30,000 men against about 50,000 Chinese. After a landing at Liuhe on 1 March outflanked them, the Chinese armies withdrew, and Japan halted the fighting on 3 March. Japan reported 738 dead and 2,257 wounded; the Chinese reported 14,801 soldiers killed, wounded or missing, and Western estimates put civilian deaths at about 10,000. The Shanghai Ceasefire Agreement of 5 May 1932, brokered with League of Nations and Western help, made a zone around Shanghai in which China could keep no troops, only police. On 29 April the Korean independence activist Yun Bong-gil threw a bomb at a celebration in Hongkou Park; Shirakawa died of his wounds.
: Cinq semaines de combats entre le Japon et la Chine à Shanghai et dans ses environs au début de 1932, appelés aussi incident de Shanghai ou guerre de Shanghai de 1932. La colère suscitée par la mainmise japonaise sur la Mandchourie avait provoqué un boycott des produits japonais à Shanghai. Le 18 janvier, cinq moines japonais de la secte Nichiren furent battus par une foule dans la ville, et l’un d’eux mourut ; un officier japonais, Tanaka Ryūkichi, déclara plus tard avoir payé pour cette agression. Les résidents japonais exercèrent des représailles, le Japon envoya des navires de guerre et exigea la fin du boycott et, dans la nuit du 28 janvier, des troupes de débarquement de la marine japonaise pénétrèrent dans le quartier chinois de Zhabei. La 19e armée de route, cantonaise, commandée par Jiang Guangnai et Cai Tingkai, riposta, rejointe en février par la 5e armée de Zhang Zhizhong. Les avions et les canons japonais bombardèrent Zhabei, où brûlèrent la Commercial Press et la Bibliothèque orientale, et le Japon fit venir des divisions de l’armée de terre commandées par Shirakawa Yoshinori, environ 30 000 hommes contre environ 50 000 Chinois. Débordées par un débarquement à Liuhe le 1er mars, les armées chinoises se retirèrent, et le Japon arrêta les combats le 3 mars. Le Japon fit état de 738 morts et de 2 257 blessés ; les Chinois annoncèrent 14 801 soldats tués, blessés ou disparus, et les estimations occidentales évaluent à environ 10 000 le nombre de morts civils. L’accord de cessez-le-feu de Shanghai du 5 mai 1932, négocié avec l’aide de la Société des Nations et des pays occidentaux, créa autour de Shanghai une zone où la Chine ne pouvait maintenir aucune troupe, mais seulement de la police. Le 29 avril, le militant indépendantiste coréen Yun Bong-gil lança une bombe lors d’une célébration au parc Hongkou ; Shirakawa mourut de ses blessures.
