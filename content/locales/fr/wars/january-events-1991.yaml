# Some French text was translated automatically.
"January Events in Vilnius and Riga": "Evénements de janvier à Vilnius et Riga"
? "In January 1991 the Soviet leadership tried to reverse the independence moves of Lithuania, which had declared independence on 11 March 1990, and of Latvia. In Vilnius, in the early hours of 13 January, Soviet troops, among them paratroopers and the KGB’s Alpha unit, stormed the television tower and the radio and television building; 14 unarmed civilians died, 13 of them killed by Soviet fire, and hundreds were injured. A KGB officer was also killed, by a shot from his own side. Crowds kept watch around the parliament, which was not attacked. In Riga, from 13 January, tens of thousands of people built and guarded barricades around key buildings; six people died in Soviet attacks, five of them in the OMON assault on the Latvian interior ministry on 20 January. The violence drew international condemnation, and the Soviet Union recognised the independence of both states in September 1991."
: "En janvier 1991, les dirigeants soviétiques ont tenté de renverser les mouvements d’indépendance de la Lituanie, qui avait déclaré l’indépendance le 11 mars 1990, et de la Lettonie. À Vilnius, au début du 13 janvier, des troupes soviétiques, parmi lesquelles des parachutistes et l’unité Alpha du KGB, ont pris l’assaut de la tour de télévision et du bâtiment de la radio et de la télévision ; 14 civils non armés sont morts, 13 d’entre eux tués par des tirs soviétiques, et des centaines ont été blessés. Un officier du KGB a également été tué par un tir de son propre côté. Des foules ont surveillé autour du parlement, qui n’a pas été attaqué. À Riga, à partir du 13 janvier, des dizaines de milliers de personnes ont construit et gardé des barricades autour de bâtiments clés ; six personnes sont mortes dans des attaques soviétiques, dont cinq lors de l’assaut OMON contre le ministère letton de l’Intérieur le 20 janvier. La violence a suscité une condamnation internationale, et l’Union soviétique a reconnu l’indépendance des deux États en septembre 1991."
"Sources give different numbers of injured in Vilnius, from over 140 to about 700. The count of 14 civilian dead includes one man who died of a heart attack during the assault.": "Les sources donnent différents nombres de blessés à Vilnius, de plus de 140 à environ 700. Le dénombrement de 14 civils morts comprend un homme qui est mort d’une crise cardiaque pendant l’agression."
"The Latvian events are known as the Barricades (Barikādes), and the Lithuanian ones as the January Events (Sausio įvykiai).": "Les événements lettons sont connus sous le nom de Barricades (Barikādes), et les événements lituaniens comme étant les événements de janvier (Sausio Marevykiai)."
