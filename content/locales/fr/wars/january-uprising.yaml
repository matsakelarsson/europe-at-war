"October 1863 – May 1865": "octobre 1863 – mai 1865"
"In October 1863 Romuald Traugutt, a former officer of the Russian army, took the lead of the insurgent National Government and tried to turn the partisan bands into a regular army. By then the Russian forces were far stronger, and on 21 February 1864 they beat off an insurgent attack on Opatów. On 2 March the tsar abolished serfdom in the kingdom and gave peasants the land they farmed, undercutting the insurgents’ own promises, and the rising faded.": "En octobre 1863, Romuald Traugutt, ancien officier de l’armée russe, prit la tête du gouvernement national des insurgés et tenta de transformer les bandes partisanes en une armée régulière. À cette époque, les forces russes étaient beaucoup plus fortes et le 21 février 1864, elles battaient une attaque des insurgés contre Opatów. Le 2 mars, le tsar abolit le serf dans le royaume et donna aux paysans la terre qu’ils cultivaient, en abaissant les promesses des insurgés, et la montée se dissipa."
"Traugutt was arrested in April 1864 and hanged with four other members of the National Government at the Warsaw Citadel on 5 August. Kalinowski had been hanged in Vilnius in March. The last partisan leader, the priest Stanisław Brzóska, was caught in 1865 and hanged at Sokołów Podlaski in May. Official Russian figures counted 396 executions and 18,672 exiles to Siberia, and 3,454 estates were confiscated in Poland and Lithuania.": "Traugutt a été arrêté en avril 1864 et pendu avec quatre autres membres du gouvernement national à la Citadelle de Varsovie le 5 août. Kalinowski avait été pendu à Vilnius en mars. Le dernier chef partisan, le prêtre Stanisław Brzóska, a été pris en 1865 et pendu à Sokołów Podlaski en mai. Les chiffres officiels russes comptent 396 exécutions et 18 672 exilés en Sibérie, et 3 454 successions sont confisquées en Pologne et en Lituanie."
