"January Uprising": "Janvier Insurrection"
"A rising against Russian rule in Congress Poland, Lithuania and Belarus that began on 22 January 1863 and was fought for some 18 months as a partisan war in the forests. Russian forces crushed it with executions, deportations to Siberia and confiscations, and the Kingdom of Poland lost the last of its separate institutions.": "Une montée contre la domination russe au Congrès Pologne, Lituanie et Biélorussie qui a commencé le 22 janvier 1863 et a été combattu pendant environ 18 mois comme une guerre partisane dans les forêts. Les forces russes l’ont écrasé avec des exécutions, des déportations en Sibérie et des confiscations, et le Royaume de Pologne a perdu la dernière de ses institutions séparées."
"Dates are New Style (Gregorian). Russia used the Julian calendar, then 12 days behind.": "Les dates sont New Style (Gregorian). La Russie a utilisé le calendrier julien, puis 12 jours derrière."
"The numbers of insurgents and of the dead are estimates. About 25,000 insurgents are thought to have been killed in some 650 battles and skirmishes.": "Le nombre d’insurgés et de morts est estimé. Environ 25 000 insurgés auraient été tués dans quelque 650 batailles et escarmouches."
"The rising had many leaders in Lithuania and Belarus who are remembered there as national figures, among them Konstanty Kalinowski (Kastus Kalinoŭski) and Antanas Mackevičius.": "La montée a eu de nombreux dirigeants en Lituanie et Belarus qui sont rappelés là comme des figures nationales, parmi lesquels Konstanty Kalinowski (Kastus Kalino) et Antanas Mackevičius."
