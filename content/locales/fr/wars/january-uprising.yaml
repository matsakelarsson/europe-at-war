"The forest war spreads east": "La guerre des forêts s’étend à l’est"
"By late spring 1863 some 35,000 insurgents faced a Russian army of 145,000 in the kingdom. They could not hold towns, but small units moved through the forests, ambushed patrols and convoys and slipped away. At Żyrzyn on 8 August a force under Michał Heidenreich captured a Russian convoy carrying 140,000 roubles. France, Britain and Austria sent diplomatic notes in support of Polish rights in April, but none of them was willing to go further.": "Vers la fin du printemps 1863, quelque 35 000 insurgés affrontèrent une armée russe de 145 000 dans le royaume. Ils ne purent tenir les villes, mais de petites unités se déplaçaient à travers les forêts, embusqués les patrouilles et les convois et s’éloignaient. La France, la Grande-Bretagne et l’Autriche ont envoyé des notes diplomatiques pour soutenir les droits polonais en avril, mais aucun d’entre eux n’était disposé à aller plus loin."
"From February the rising spread into Lithuania and Belarus, led by Zygmunt Sierakowski, the priest Antanas Mackevičius and Konstanty Kalinowski. In May Russian troops destroyed Sierakowski’s force near Biržai, and he was hanged in Vilnius in June. The new governor-general, Mikhail Muravyov, put down the rising there with public executions and mass deportations, and became known as “the Hangman”. Mackevičius was captured and hanged in Kaunas in December.": "Depuis février la montée s’est répandue en Lituanie et en Biélorussie, dirigé par Zygmunt Sierakowski, le prêtre Antanas Mackevičius et Konstanty Kalinowski. En mai les troupes russes ont détruit la force de Sierakowski près de Biržai, et il a été pendu à Vilnius en juin. Le nouveau gouverneur général, Mikhaïl Muravyov, a mis à terre la montée avec des exécutions publiques et des déportations massives, et est devenu connu sous le nom de \"Hangman\". Mackevičius a été capturé et pendu à Kaunas en décembre."
