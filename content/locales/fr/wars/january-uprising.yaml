"A rising against conscription": "Une montée contre la conscription"
"January – March 1863": "janvier – mars 1863"
"In February 1861 Russian troops fired on a patriotic demonstration in Warsaw, and over the next two years a clandestine Central National Committee prepared a rising. To break the movement, Aleksander Wielopolski, head of the kingdom’s civil administration, brought forward a conscription of young activists into the Russian army for twenty years’ service. Rather than wait to be rounded up, the committee called the rising on the night of 22–23 January 1863.": "En février 1861, les troupes russes tirèrent sur une manifestation patriotique à Varsovie et, au cours des deux années suivantes, un comité national central clandestin prépara une montée. Pour briser le mouvement, Aleksander Wielopolski, chef de l’administration civile du royaume, présenta une conscription de jeunes militants dans l’armée russe pendant vingt ans."
"At first about 10,000 poorly armed men took to the forests against about 90,000 Russian troops. Volunteers and weapons came over the borders from Austrian Galicia and Prussian Poland, but on 8 February Prussia agreed in the Alvensleben Convention to help Russia. In the south Marian Langiewicz gathered the largest insurgent force in the Holy Cross Mountains. After fighting at Małogoszcz and Grochowiska he crossed into Galicia in March, where the Austrians interned him.": "Au début, environ 10 000 hommes mal armés ont pris dans les forêts contre environ 90 000 troupes russes. Des volontaires et des armes sont venus par-dessus les frontières de la Galice autrichienne et de la Pologne prussienne, mais le 8 février la Prusse a accepté dans la Convention d’Alvensleben pour aider la Russie. Après avoir combattu à Małogoszcz et Grochowiska, il a traversé la Galice en mars, où les Autrichiens l’ont interné."
