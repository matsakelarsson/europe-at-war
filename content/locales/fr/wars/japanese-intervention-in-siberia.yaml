# French translations of the catalogue text (wave 9); step bodies follow later.
Japanese intervention in Siberia: Intervention japonaise en Sibérie
? "The occupation of the Russian Far East and eastern Siberia by Japanese troops, alongside smaller American, British, French, Canadian, Italian and Chinese contingents, during the Russian Civil War. The Allies landed at Vladivostok in 1918 to guard war stores and help the Czechoslovak Legion leave Russia; Japan, which sent some 70,000 men, far more than agreed, occupied the ports and railway towns from the Pacific to Lake Baikal and backed the Cossack atamans Grigory Semyonov and Ivan Kalmykov. The other Allies left in 1919–1920, after Kolchak’s fall, while the Japanese fought a growing partisan war: they burned the village of Ivanovka in 1919, partisans destroyed their garrison at Nikolayevsk-on-Amur in 1920, and in April 1920 they struck at Russian forces across Primorye. Moscow set up the Far Eastern Republic as a buffer state; its army defeated the Whites at Volochayevka in February 1922, and when the last Japanese troops sailed from Vladivostok on 25 October 1922 it marched in. The republic joined Soviet Russia three weeks later. Japan held northern Sakhalin until 1925."
: "L’occupation de l’Extrême-Orient russe et de la Sibérie orientale par les troupes japonaises, aux côtés de contingents américains, britanniques, français, canadiens, italiens et chinois plus réduits, pendant la guerre civile russe. Les Alliés débarquèrent à Vladivostok en 1918 pour garder les stocks de guerre et aider la Légion tchécoslovaque à quitter la Russie ; le Japon, qui envoya quelque 70 000 hommes, bien plus que convenu, occupa les ports et les villes ferroviaires du Pacifique au lac Baïkal et soutint les atamans cosaques Grigori Semionov et Ivan Kalmykov. Les autres Alliés partirent en 1919–1920, après la chute de Koltchak, tandis que les Japonais affrontaient une guerre de partisans de plus en plus étendue : ils incendièrent le village d’Ivanovka en 1919, des partisans anéantirent leur garnison de Nikolaïevsk-sur-l’Amour en 1920 et, en avril 1920, ils frappèrent les forces russes dans tout le Primorié. Moscou créa la République d’Extrême-Orient comme État tampon ; son armée battit les Blancs à Volotchaïevka en février 1922 et, lorsque les dernières troupes japonaises quittèrent Vladivostok par la mer le 25 octobre 1922, elle y entra. La république fut rattachée à la Russie soviétique trois semaines plus tard. Le Japon conserva le nord de Sakhaline jusqu’en 1925."
