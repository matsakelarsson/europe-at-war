# French translations of the catalogue text (wave 11); step bodies follow later.
Japanese invasion of French Indochina and the coup of 1945: Invasion japonaise de l’Indochine française et coup de force de 1945
? Japan’s entry into French Indochina in 1940–1941 and its overthrow of the French administration in March 1945. After the fall of France in June 1940, Japan, at war with China, demanded that the colony stop supplies reaching China by the railway from Haiphong to Kunming. Governor-General Catroux gave way, and his successor, Admiral Decoux, loyal to the Vichy government, negotiated with General Nishihara Issaku over bases and troops. On 22 September 1940, hours after an agreement allowing 6,000 Japanese troops in Tonkin had been signed in Hanoi, the Japanese 5th Division crossed the Chinese border at Đồng Đăng and attacked the French posts; Lạng Sơn surrendered on 25 September, and on 26 September about 4,500 Japanese troops landed south of Haiphong while aircraft bombed the port. About 100 Japanese and several hundred French and Vietnamese soldiers were killed before Tokyo called a halt; Japan returned Lạng Sơn on 5 October and kept its bases in the north. On 28 July 1941, under an agreement with Vichy, some 140,000 Japanese troops occupied southern Indochina, and the United States answered by freezing Japanese assets and cutting off oil. The French administration stayed in place under Japanese military control for four more years; during the war Indochina was the base for the Japanese invasions of Malaya, Thailand and Burma. In 1944–1945 a famine in northern Vietnam, caused by Japanese and French requisitions of rice, Allied bombing of transport, the switch to industrial crops and floods and drought, killed an estimated 400,000 to 2 million people. On 9 March 1945 Japan disarmed the French in a surprise coup (Operation Meigō). The garrisons of Hanoi, Huế and Lạng Sơn resisted; at Lạng Sơn and Đồng Đăng hundreds of prisoners were executed, and General Lemonnier was beheaded after refusing to sign a surrender. General Alessandri’s column fought its way to China, where more than 3,000 colonial troops arrived by May. French losses were about 4,200 killed and 15,000 interned. Under Japanese sponsorship Emperor Bảo Đại declared the independence of the Empire of Vietnam on 11 March 1945, King Norodom Sihanouk that of Cambodia on 13 March, and King Sisavang Vong of Luang Prabang that of Laos on 8 April. The vacuum this left opened the way for the Viet Minh’s August Revolution after Japan’s surrender.
: L’entrée du Japon en Indochine française en 1940–1941 et le renversement par les Japonais de l’administration française en mars 1945. Après la chute de la France en juin 1940, le Japon, en guerre contre la Chine, exigea que la colonie cesse de laisser passer le ravitaillement destiné à la Chine par le chemin de fer de Haiphong à Kunming. Le gouverneur général Catroux céda, et son successeur, l’amiral Decoux, fidèle au gouvernement de Vichy, négocia avec le général Nishihara Issaku au sujet des bases et des troupes. Le 22 septembre 1940, quelques heures après la signature à Hanoï d’un accord autorisant la présence de 6 000 soldats japonais au Tonkin, la 5e division japonaise franchit la frontière chinoise à Đồng Đăng et attaqua les postes français ; Lạng Sơn capitula le 25 septembre, et le 26 septembre environ 4 500 soldats japonais débarquèrent au sud de Haiphong tandis que l’aviation bombardait le port. Une centaine de Japonais et plusieurs centaines de soldats français et vietnamiens furent tués avant que Tokyo n’ordonne l’arrêt des combats ; le Japon rendit Lạng Sơn le 5 octobre et conserva ses bases dans le Nord. Le 28 juillet 1941, en vertu d’un accord avec Vichy, quelque 140 000 soldats japonais occupèrent le sud de l’Indochine, et les États-Unis répliquèrent en gelant les avoirs japonais et en coupant les livraisons de pétrole. L’administration française resta en place sous contrôle militaire japonais pendant encore quatre ans ; pendant la guerre, l’Indochine servit de base aux invasions japonaises de la Malaisie, de la Thaïlande et de la Birmanie. En 1944–1945, une famine dans le nord du Vietnam, causée par les réquisitions de riz japonaises et françaises, les bombardements alliés sur les transports, le passage aux cultures industrielles, ainsi que les inondations et la sécheresse, fit entre 400 000 et 2 millions de morts selon les estimations. Le 9 mars 1945, le Japon désarma les Français par un coup de force surprise (opération Meigō). Les garnisons de Hanoï, de Huế et de Lạng Sơn résistèrent ; à Lạng Sơn et à Đồng Đăng, des centaines de prisonniers furent exécutés, et le général Lemonnier fut décapité après avoir refusé de signer une reddition. La colonne du général Alessandri se fraya un chemin jusqu’en Chine, où plus de 3 000 soldats coloniaux étaient parvenus en mai. Les pertes françaises s’élevèrent à environ 4 200 tués et 15 000 internés. Sous le patronage japonais, l’empereur Bảo Đại proclama l’indépendance de l’Empire du Vietnam le 11 mars 1945, le roi Norodom Sihanouk celle du Cambodge le 13 mars et le roi Sisavang Vong de Luang Prabang celle du Laos le 8 avril. Le vide ainsi créé ouvrit la voie à la révolution d’Août du Viêt Minh après la capitulation du Japon.
