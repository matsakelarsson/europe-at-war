# French translations of the catalogue text (wave 9); step bodies follow later.
Japanese invasion of Manchuria: Invasion japonaise de la Mandchourie
? The conquest of China’s three north-eastern provinces by Japan’s Kwantung Army in 1931–1932. On the night of 18 September 1931 officers of the Kwantung Army, which guarded Japan’s leased territory and the South Manchuria Railway, set off a small explosion on the railway near Shenyang (Mukden) and blamed Chinese soldiers. Acting without the approval of the government in Tokyo, the army seized Shenyang and the towns along the railway within a day, and troops from Japanese-ruled Korea crossed the border to join it. Zhang Xueliang’s Northeastern Army, far larger but ordered by Zhang and Chiang Kai-shek to avoid open war while China appealed to the League of Nations, mostly withdrew. Ma Zhanshan resisted at the Nenjiang bridge in November, but Qiqihar fell on 19 November, Jinzhou on 3 January 1932 and Harbin in early February, and organised Chinese resistance ended in late February. On 1 March 1932 Japan set up the state of Manchukuo, with the last Qing emperor, Puyi, at its head. Volunteer armies fought on for years. The League’s Lytton Commission refused to recognise Manchukuo, and Japan left the League in 1933. Clodfelter estimates about 50,000 Chinese military and civilian dead and about 10,000 Japanese dead, including the conquest of Rehe in 1933.
: La conquête des trois provinces du Nord-Est de la Chine par l’armée japonaise du Kwantung en 1931–1932. Dans la nuit du 18 septembre 1931, des officiers de l’armée du Kwantung, qui gardait le territoire à bail japonais et le chemin de fer de Mandchourie du Sud, firent exploser une petite charge sur la voie ferrée près de Shenyang (Moukden) et en accusèrent des soldats chinois. Agissant sans l’approbation du gouvernement de Tokyo, l’armée s’empara en un jour de Shenyang et des villes situées le long de la voie ferrée, et des troupes venues de la Corée sous domination japonaise franchirent la frontière pour la rejoindre. L’armée du Nord-Est de Zhang Xueliang, bien plus nombreuse mais ayant reçu de Zhang et de Tchang Kaï-chek l’ordre d’éviter une guerre ouverte pendant que la Chine en appelait à la Société des Nations, se retira pour l’essentiel. Ma Zhanshan résista au pont du Nenjiang en novembre, mais Qiqihar tomba le 19 novembre, Jinzhou le 3 janvier 1932 et Harbin au début de février, et la résistance chinoise organisée cessa à la fin de février. Le 1er mars 1932, le Japon créa l’État du Mandchoukouo, avec à sa tête le dernier empereur Qing, Puyi. Des armées de volontaires continuèrent à se battre pendant des années. La commission Lytton de la Société des Nations refusa de reconnaître le Mandchoukouo, et le Japon quitta la Société en 1933. Clodfelter estime à environ 50 000 le nombre de morts chinois, militaires et civils, et à environ 10 000 celui des morts japonais, conquête du Rehe en 1933 comprise.
