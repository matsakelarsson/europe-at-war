# French translations of the catalogue text (wave 9); step bodies follow later.
Japanese invasion of Taiwan (1874): Invasion japonaise de Taïwan (1874)
Japan’s first overseas military expedition of the Meiji era, also called the Taiwan Expedition or, in Taiwan and China, the Mudan Incident. In December 1871 a ship from the Ryukyu Kingdom was wrecked on the south-east coast of Taiwan, and 54 of its crew were killed by Paiwan people of Mudan and Kuskus. Japan, which was claiming the Ryukyus, argued that the indigenous lands of Taiwan lay outside Qing rule and in May 1874 landed some 3,600 troops under Saigō Jūdō in the south of the island. They defeated the Paiwan at Stone Gate on 22 May and burned their villages, but malaria killed 561 men while the soldiers waited in camp. The Qing sent troops to Taiwan, and in Beijing Ōkubo Toshimichi negotiated an agreement, signed at the end of October, by which China paid 500,000 taels and called the expedition an act to protect Japanese subjects. Japan withdrew in December; it later used the wording to support its annexation of the Ryukyus in 1879, and the Qing began to strengthen its hold on Taiwan.: La première expédition militaire du Japon outre-mer à l’ère Meiji, appelée aussi expédition de Taïwan ou, à Taïwan et en Chine, incident de Mudan. En décembre 1871, un navire du royaume de Ryukyu fit naufrage sur la côte sud-est de Taïwan, et 54 membres de son équipage furent tués par des Paiwan de Mudan et de Kuskus. Le Japon, qui revendiquait les Ryukyu, soutint que les terres autochtones de Taïwan échappaient à l’autorité des Qing et, en mai 1874, débarqua quelque 3 600 soldats commandés par Saigō Jūdō dans le sud de l’île. Ils battirent les Paiwan à Stone Gate le 22 mai et incendièrent leurs villages, mais le paludisme tua 561 hommes pendant que les soldats attendaient dans leur camp. Les Qing envoyèrent des troupes à Taïwan et, à Pékin, Ōkubo Toshimichi négocia un accord, signé fin octobre, par lequel la Chine versa 500 000 taels et qualifia l’expédition d’acte destiné à protéger des sujets japonais. Le Japon se retira en décembre ; il se servit plus tard de cette formulation pour appuyer son annexion des Ryukyu en 1879, et les Qing commencèrent à renforcer leur emprise sur Taïwan.
