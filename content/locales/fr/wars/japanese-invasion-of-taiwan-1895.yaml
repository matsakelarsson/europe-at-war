# French translations of the catalogue text (wave 9); step bodies follow later.
Japanese invasion of Taiwan (1895): Invasion japonaise de Taïwan (1895)
? The Japanese conquest of Taiwan after the First Sino-Japanese War, called the Yiwei War in Chinese. Japan seized the Penghu Islands in March 1895, and by the Treaty of Shimonoseki of 17 April China ceded Taiwan and Penghu to Japan. In late May officials and gentry in Taipei proclaimed a Republic of Formosa, with the Qing governor Tang Jingsong as president, to resist the handover. The Japanese landed near Keelung on 29 May; Tang fled, and Taipei was occupied on 7 June. The advance south was then slowed by Hakka militias around Hsinchu and Miaoli and by guerrilla attacks, but the Japanese won the decisive battle at Baguashan near Changhua on 27 August. In October three Japanese forces closed in on Tainan, where the general Liu Yongfu led the republic; he fled to the mainland, and Tainan surrendered on 21 October. Japan declared the island subdued in November, although armed resistance went on for years. About 14,000 Chinese and Taiwanese soldiers and militiamen are estimated to have died; Japan lost 164 killed in battle and thousands more to cholera and malaria.
: La conquête japonaise de Taïwan au lendemain de la première guerre sino-japonaise, appelée en chinois guerre de Yiwei. Le Japon s’empara des îles Penghu en mars 1895 et, par le traité de Shimonoseki du 17 avril, la Chine céda Taïwan et les Penghu au Japon. À la fin de mai, des fonctionnaires et des notables de Taipei proclamèrent une République de Formose, présidée par le gouverneur Qing Tang Jingsong, pour s’opposer à la cession. Les Japonais débarquèrent près de Keelung le 29 mai ; Tang s’enfuit et Taipei fut occupée le 7 juin. L’avance vers le sud fut ensuite ralentie par les milices hakka autour de Hsinchu et de Miaoli et par des attaques de guérilla, mais les Japonais remportèrent la bataille décisive de Baguashan, près de Changhua, le 27 août. En octobre, trois forces japonaises convergèrent sur Tainan, où le général Liu Yongfu dirigeait la république ; il s’enfuit sur le continent, et Tainan se rendit le 21 octobre. Le Japon déclara l’île soumise en novembre, bien que la résistance armée se soit poursuivie pendant des années. On estime qu’environ 14 000 soldats et miliciens chinois et taïwanais périrent ; le Japon perdit 164 hommes tués au combat et des milliers d’autres du choléra et du paludisme.
