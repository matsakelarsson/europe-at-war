# French translations of the catalogue text (wave 11); step bodies follow later.
Java War: Guerre de Java
? The rebellion of Prince Diponegoro of Yogyakarta against the Dutch colonial government and the Javanese courts allied with it, the last great war of the Javanese aristocracy against colonial rule. Diponegoro, eldest son of Sultan Hamengkubuwono III, drew on resentment of Dutch interference at court, of land rents, tolls and the Chinese toll-farmers, and on hopes of a Just King after cholera and the eruption of Merapi. When Dutch troops came to arrest him at Tegalrejo on 20 July 1825 he withdrew to Selarong and declared a holy war. His followers besieged Yogyakarta and rose across Central Java, and in 1826 his army threatened Surakarta until it was beaten at Gawok. The war became a guerrilla struggle that General Hendrik Merkus de Kock answered from 1827 with a network of more than 250 small forts, the benteng-stelsel, which slowly penned the rebels into the hills west of Yogyakarta. After his commanders were captured, killed or surrendered, Diponegoro agreed to talks and was arrested by de Kock at Magelang on 28 March 1830 and exiled to Sulawesi. At least 200,000 Javanese died, most of them civilians, and 15,000 soldiers of the colonial army. The Dutch annexed the outer provinces of the courts and introduced the Cultivation System, and Java saw no further large-scale revolt until the Indonesian revolution.
: La rébellion du prince Diponegoro de Yogyakarta contre le gouvernement colonial néerlandais et les cours javanaises qui lui étaient alliées, la dernière grande guerre de l’aristocratie javanaise contre la domination coloniale. Diponegoro, fils aîné du sultan Hamengkubuwono III, s’appuya sur le ressentiment suscité par l’ingérence néerlandaise à la cour, par les rentes foncières, par les péages et par les fermiers chinois qui les percevaient, ainsi que sur l’espoir d’un Roi juste après le choléra et l’éruption du Merapi. Lorsque des troupes néerlandaises vinrent l’arrêter à Tegalrejo le 20 juillet 1825, il se retira à Selarong et proclama la guerre sainte. Ses partisans assiégèrent Yogyakarta et se soulevèrent dans tout le centre de Java et, en 1826, son armée menaça Surakarta jusqu’à sa défaite à Gawok. La guerre se mua en une guérilla à laquelle le général Hendrik Merkus de Kock répondit à partir de 1827 par un réseau de plus de 250 petits forts, le benteng-stelsel, qui accula peu à peu les rebelles dans les collines à l’ouest de Yogyakarta. Après la capture, la mort ou la reddition de ses commandants, Diponegoro accepta de négocier ; il fut arrêté par de Kock à Magelang le 28 mars 1830 et exilé à Sulawesi. Au moins 200 000 Javanais périrent, pour la plupart des civils, ainsi que 15 000 soldats de l’armée coloniale. Les Néerlandais annexèrent les provinces extérieures des cours et instaurèrent le système des cultures, et Java ne connut plus de révolte de grande ampleur jusqu’à la révolution indonésienne.
