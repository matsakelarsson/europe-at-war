# French translations of the catalogue text (wave 11); step bodies follow later.
First and Second Javanese Wars of Succession: Première et deuxième guerres de succession javanaises
? Two wars over the throne of Mataram in which the Dutch East India Company (VOC) backed its own candidate and was paid in land and trade. When Amangkurat II died in 1703, his son Amangkurat III succeeded him, but the Company, suspecting him of sympathy for Surapati, the former slave who ruled a domain in East Java, recognised his uncle Pangeran Puger as king. Puger took the title Pakubuwono I in June 1704 and, in the First War of Succession (1704–1708), Company troops and Madurese allies put him in the capital, Kartasura, in August 1705. Amangkurat III fled east to Surapati, who was killed in 1706 when the allies stormed Bangil; the king held out in the hills of Malang until 1708, when he surrendered on a promise of lands and was exiled to Ceylon. In return Pakubuwono I confirmed the Company’s possession of Semarang and the Priangan highlands, ceded the eastern half of Madura and promised yearly deliveries of rice. The Second War of Succession (1719–1723) began when Pakubuwono I died and his son Amangkurat IV was challenged by his brothers, the princes Blitar and Purbaya, who attacked the palace in June 1719 and were driven off by the guns of the Company’s fort, and by his uncle Arya Mataram, who proclaimed himself king near Jepara and was put to death the same year. The rebels joined risings of the regents of Surabaya in East Java; Prince Blitar died in 1721, and in May–June 1723 the last rebel leaders surrendered. Most were exiled to Ceylon, while Purbaya was kept in Batavia as a possible replacement for the king. Each war left Mataram more dependent on the Company and the VOC deeper in Javanese politics; the third war followed in 1746.
: Deux guerres pour le trône de Mataram au cours desquelles la Compagnie néerlandaise des Indes orientales (VOC) soutint son propre candidat et se fit payer en terres et en avantages commerciaux. À la mort d’Amangkurat II en 1703, son fils Amangkurat III lui succéda, mais la Compagnie, le soupçonnant de sympathie pour Surapati, l’ancien esclave qui gouvernait un domaine à Java oriental, reconnut comme roi son oncle Pangeran Puger. Puger prit le titre de Pakubuwono Ier en juin 1704 et, lors de la première guerre de succession (1704–1708), les troupes de la Compagnie et leurs alliés madurais l’installèrent dans la capitale, Kartasura, en août 1705. Amangkurat III s’enfuit vers l’est auprès de Surapati, qui fut tué en 1706 lorsque les alliés prirent Bangil d’assaut ; le roi tint bon dans les collines de Malang jusqu’en 1708, quand il se rendit sur la promesse de recevoir des terres et fut exilé à Ceylan. En contrepartie, Pakubuwono Ier confirma la possession par la Compagnie de Semarang et des hautes terres de la Priangan, céda la moitié orientale de Madura et promit des livraisons annuelles de riz. La deuxième guerre de succession (1719–1723) commença lorsque Pakubuwono Ier mourut et que son fils Amangkurat IV fut contesté par ses frères, les princes Blitar et Purbaya, qui attaquèrent le palais en juin 1719 et furent repoussés par les canons du fort de la Compagnie, et par son oncle Arya Mataram, qui se proclama roi près de Jepara et fut mis à mort la même année. Les rebelles se joignirent aux soulèvements des régents de Surabaya, à Java oriental ; le prince Blitar mourut en 1721, et en mai–juin 1723 les derniers chefs rebelles se rendirent. La plupart furent exilés à Ceylan, tandis que Purbaya fut gardé à Batavia comme remplaçant possible du roi. Chaque guerre rendit Mataram plus dépendant de la Compagnie et engagea davantage la VOC dans la politique javanaise ; la troisième guerre suivit en 1746.
