# French translations of the catalogue text (wave 7); step bodies follow later.
Jebel Akhdar War: Guerre du Djebel Akhdar
? A war in the interior of Oman between the Imamate of Oman, which had ruled the inland tribes under the Treaty of Seeb of 1920, and Sultan Said bin Taimur of Muscat, supported by Britain. After the imam Muhammad al-Khalili died in May 1954 and Ghalib bin Ali al-Hinai was elected in his place, the sultan’s British-officered forces occupied the oil prospect at Fahud in October 1954 and took Nizwa, the imamate’s capital, in December 1955; Ghalib withdrew to his village. In 1957 his brother Talib returned from Saudi Arabia with several hundred trained fighters and raised the tribes again, and British troops and aircraft were called in to retake Nizwa in August 1957. The rebels held out on the high plateau of Jebel Akhdar (the “Green Mountain”), supplied from Saudi Arabia, until two squadrons of the British Special Air Service, with the sultan’s troops, climbed the mountain by night in late January 1959 and took the plateau. Ghalib and Talib went into exile in Saudi Arabia, and the imamate ended; its cause was raised at the United Nations for years afterwards. Estimates of the dead range from about 100 to several hundred.
: Une guerre dans l’intérieur d’Oman entre l’imamat d’Oman, qui gouvernait les tribus de l’arrière-pays en vertu du traité de Seeb de 1920, et le sultan Saïd ben Taïmour de Mascate, soutenu par la Grande-Bretagne. Après la mort de l’imam Muhammad al-Khalili en mai 1954 et l’élection de Ghalib ben Ali al-Hinai pour lui succéder, les forces du sultan, encadrées par des officiers britanniques, occupèrent la zone de prospection pétrolière de Fahud en octobre 1954 et prirent Nizwa, capitale de l’imamat, en décembre 1955 ; Ghalib se retira dans son village. En 1957, son frère Talib revint d’Arabie saoudite avec plusieurs centaines de combattants entraînés et souleva de nouveau les tribus, et l’on fit appel aux troupes et à l’aviation britanniques pour reprendre Nizwa en août 1957. Les rebelles tinrent bon sur le haut plateau du Djebel Akhdar (la « Montagne verte »), ravitaillés depuis l’Arabie saoudite, jusqu’à ce que deux escadrons du Special Air Service britannique, avec les troupes du sultan, escaladent la montagne de nuit à la fin de janvier 1959 et s’emparent du plateau. Ghalib et Talib s’exilèrent en Arabie saoudite, et l’imamat prit fin ; sa cause fut encore portée devant les Nations unies pendant des années. Les estimations du nombre de morts vont d’environ 100 à plusieurs centaines.
