# French translations of the catalogue text (wave 10); step bodies follow later.
Jeju uprising: Soulèvement de Jeju
? An armed rising on Jeju Island led by the Workers’ Party of South Korea, and its suppression by the South Korean army and police, the US military government and right-wing youth groups, known in Korea as Jeju 4·3 after its first day, 3 April 1948. Tension had grown since police shot six people at a rally on 1 March 1947 and the mass arrests and beatings that followed. Opposing the separate election in the South, several hundred insurgents attacked police stations across the island; the election of 10 May 1948 failed in two of Jeju’s three districts. From October 1948 the army declared the interior of the island a free-fire zone and burned most of the mountain villages; the winter of 1948–1949 was the deadliest period. The insurgency was broken by mid-1949, when its leader Yi Deok-gu was killed, though the island’s mountains stayed closed until 1954. A government committee in 2003 estimated 25,000–30,000 dead, about a tenth of the island’s people, and attributed some 86 percent of the deaths it could identify to the security forces and 14 percent to the insurgents. The subject was suppressed for decades; President Roh Moo-hyun apologised for the state’s actions in 2003.
: Un soulèvement armé dans l’île de Jeju, mené par le Parti du travail de Corée du Sud, et sa répression par l’armée et la police sud-coréennes, le gouvernement militaire américain et des groupes de jeunesse de droite, connu en Corée sous le nom de Jeju 4·3, d’après son premier jour, le 3 avril 1948. Les tensions s’étaient accrues depuis que des policiers avaient tiré sur six personnes lors d’un rassemblement le 1er mars 1947, et avec les arrestations massives et les passages à tabac qui suivirent. S’opposant à l’élection séparée dans le Sud, plusieurs centaines d’insurgés attaquèrent des commissariats dans toute l’île ; l’élection du 10 mai 1948 échoua dans deux des trois circonscriptions de Jeju. À partir d’octobre 1948, l’armée déclara l’intérieur de l’île zone de tir à volonté et incendia la plupart des villages de montagne ; l’hiver 1948–1949 fut la période la plus meurtrière. L’insurrection fut brisée vers le milieu de 1949, quand son chef Yi Deok-gu fut tué, même si les montagnes de l’île restèrent fermées jusqu’en 1954. En 2003, une commission gouvernementale estima le nombre de morts à 25 000–30 000, soit environ un dixième de la population de l’île, et attribua quelque 86 % des morts qu’elle put identifier aux forces de sécurité et 14 % aux insurgés. Le sujet fut étouffé pendant des décennies ; le président Roh Moo-hyun présenta en 2003 des excuses pour les actes de l’État.
