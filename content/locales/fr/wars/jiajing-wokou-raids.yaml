# French translations of the catalogue text (wave 9); step bodies follow later.
Jiajing wokou raids: Raids des wokou sous Jiajing
? "Raids on the coasts of Zhejiang, Jiangsu, Fujian and Guangdong in the reign of the Jiajing Emperor, at their height in the 1550s. The Ming had banned private sea trade since 1371 (the haijin), but Japanese silver and the demand for Chinese silk and porcelain made smuggling very profitable, and from about 1540 merchants of Fujian and Zhejiang ran an illegal trading port at Shuangyu off Ningbo with Japanese and Portuguese partners. When officials enforced the ban, destroying Shuangyu in 1548, the trade turned into raiding. The Ming called the raiders wokou, “Japanese pirates”, but most of them were Chinese: Chinese records put the Japanese at about three in ten. Fleets of up to 20,000 men plundered towns far inland in the 1550s. The supreme commander Hu Zongxian destroyed the band of Xu Hai in 1556 and lured the merchant chief Wang Zhi back from Japan, to be executed in 1560; the armies that Qi Jiguang and Yu Dayou trained drove the last large bands out of Zhejiang in 1561 and Fujian in 1563–1565. The raids ended for good after the court in 1567 allowed licensed merchants to trade overseas from Yuegang, except with Japan."
: "Raids sur les côtes du Zhejiang, du Jiangsu, du Fujian et du Guangdong sous le règne de l’empereur Jiajing, à leur apogée dans les années 1550. Les Ming interdisaient le commerce maritime privé depuis 1371 (le haijin), mais l’argent japonais et la demande de soie et de porcelaine chinoises rendaient la contrebande très lucrative et, à partir de 1540 environ, des marchands du Fujian et du Zhejiang tenaient un port de commerce illégal à Shuangyu, au large de Ningbo, avec des partenaires japonais et portugais. Lorsque les fonctionnaires firent appliquer l’interdiction, détruisant Shuangyu en 1548, le commerce se mua en pillage. Les Ming appelaient ces pillards wokou, « pirates japonais », mais la plupart étaient chinois : les sources chinoises estiment la part des Japonais à environ trois sur dix. Dans les années 1550, des flottes comptant jusqu’à 20 000 hommes pillèrent des villes loin à l’intérieur des terres. Le commandant suprême Hu Zongxian anéantit la bande de Xu Hai en 1556 et attira hors du Japon le chef marchand Wang Zhi, qui fut exécuté en 1560 ; les armées formées par Qi Jiguang et Yu Dayou chassèrent les dernières grandes bandes du Zhejiang en 1561 et du Fujian en 1563–1565. Les raids cessèrent définitivement après que la cour eut autorisé en 1567 des marchands munis d’une licence à commercer outre-mer depuis Yuegang, sauf avec le Japon."
