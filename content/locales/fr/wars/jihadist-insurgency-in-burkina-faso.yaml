# French translations of the catalogue text (wave 12); step bodies follow later.
Jihadist insurgency in Burkina Faso: Insurrection djihadiste au Burkina Faso
? "The war between the state of Burkina Faso and jihadist groups that spread into the country from Mali after 2015. It began in the Sahel region of the north, where Ansarul Islam, founded by the Fulani preacher Ibrahim Malam Dicko in 2016, drew on resentment of the state and of local elites, and widened as al-Qaeda’s JNIM and the Islamic State’s Sahel branch moved into the north, the east and the west. Attacks on the capital, Ouagadougou, in 2016–2018 were followed by a rural war in which jihadists killed soldiers, officials, teachers and villagers, while the army and the state-armed Volunteers for the Defence of the Homeland (VDP) were accused of massacring Fulani civilians. Anger at the army’s losses brought two coups in 2022; Captain Ibrahim Traoré, in power since September 2022, sent away the French forces, turned to Russia, mobilised the population and silenced critics. By the mid-2020s Burkina Faso was among the countries worst hit by terrorism in the world: some 2 million people had been displaced, towns such as Djibo were under blockade for years, and estimates of the dead run to 20,000–25,000."
: "La guerre entre l’État burkinabé et les groupes djihadistes qui se sont étendus au pays depuis le Mali après 2015. Elle a commencé dans la région du Sahel, au nord, où Ansarul Islam, fondé en 2016 par le prédicateur peul Ibrahim Malam Dicko, a exploité le ressentiment envers l’État et les élites locales, et s’est élargie à mesure que le JNIM, lié à al-Qaïda, et la branche sahélienne de l’État islamique gagnaient le nord, l’est et l’ouest. Les attaques contre la capitale, Ouagadougou, en 2016–2018 ont été suivies d’une guerre rurale dans laquelle les djihadistes ont tué soldats, fonctionnaires, enseignants et villageois, tandis que l’armée et les Volontaires pour la défense de la patrie (VDP), armés par l’État, étaient accusés de massacres de civils peuls. La colère suscitée par les pertes de l’armée a provoqué deux coups d’État en 2022 ; le capitaine Ibrahim Traoré, au pouvoir depuis septembre 2022, a renvoyé les forces françaises, s’est tourné vers la Russie, a mobilisé la population et réduit les critiques au silence. Au milieu des années 2020, le Burkina Faso comptait parmi les pays du monde les plus touchés par le terrorisme : quelque 2 millions de personnes avaient été déplacées, des villes comme Djibo étaient sous blocus depuis des années, et les estimations du nombre de morts atteignent 20 000 à 25 000."
