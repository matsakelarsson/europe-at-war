# French translations of the catalogue text (wave 9); step bodies follow later.
Jin–Liao war: Guerre entre les Jin et les Liao
? The war in which the Jurchens of Manchuria, united by the Wanyan chief Aguda, overthrew the Khitan Liao empire that had ruled them for two centuries. Aguda rose in 1114 with a few thousand horsemen, took the frontier fort of Ningjiang and routed a Liao army at Chuhedian. In January 1115 he proclaimed himself emperor of the Jin (“Gold”) dynasty, and that year he took Huanglong and destroyed the army that the Liao emperor Tianzuo led against him at Hubudagang. By 1116 the Jin held all of Liaodong. The Song, hoping to recover the Sixteen Prefectures, made an alliance with the Jin by envoys sent across the Bohai Sea. The Jin took the Liao Supreme Capital in 1120, the Central Capital in the winter of 1121–1122, and the Western and Southern Capitals in 1122, while Song attacks on the Southern Capital, Yanjing (Beijing), were beaten off by the Liao. In 1123 the Jin handed Yanjing and six prefectures to the Song for a large payment, after carrying off their people and wealth. Tianzuo fled into the steppe and was captured in March 1125; the Liao prince Yelü Dashi went west and founded the Qara Khitai empire in Central Asia. Before the year was out, the Jin turned on the Song.
: La guerre au cours de laquelle les Jürchen de Mandchourie, unis par le chef wanyan Aguda, renversèrent l’empire khitan des Liao qui les dominait depuis deux siècles. Aguda se souleva en 1114 avec quelques milliers de cavaliers, prit le fort frontalier de Ningjiang et mit en déroute une armée des Liao à Chuhedian. En janvier 1115, il se proclama empereur de la dynastie Jin (« Or ») et, la même année, prit Huanglong et anéantit à Hubudagang l’armée que l’empereur des Liao Tianzuo conduisait contre lui. En 1116, les Jin tenaient tout le Liaodong. Les Song, qui espéraient recouvrer les Seize Préfectures, s’allièrent aux Jin par l’intermédiaire d’envoyés dépêchés à travers la mer de Bohai. Les Jin prirent la Capitale suprême des Liao en 1120, la Capitale centrale au cours de l’hiver 1121–1122 et les Capitales occidentale et méridionale en 1122, tandis que les attaques des Song contre la Capitale méridionale, Yanjing (Pékin), étaient repoussées par les Liao. En 1123, les Jin remirent Yanjing et six préfectures aux Song contre un paiement important, après en avoir emmené la population et les richesses. Tianzuo s’enfuit dans la steppe et fut capturé en mars 1125 ; le prince des Liao Yelü Dashi partit vers l’ouest et fonda l’empire Kara Khitaï en Asie centrale. Avant la fin de l’année, les Jin se retournèrent contre les Song.
