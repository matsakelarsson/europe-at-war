# French translations of the catalogue text (wave 9); step bodies follow later.
Jin–Song war of 1161–1165: Guerre entre les Jin et les Song de 1161–1165
The war begun by the Jin emperor Wanyan Liang (Prince of Hailing), who broke the peace of Shaoxing to conquer the Southern Song. In the autumn of 1161 he led a huge army from Kaifeng to the Huai and the Yangtze and sent a fleet by sea against the Song capital Lin’an. The fleet was destroyed off the Shandong coast at Tangdao on 16 November, and on 26–27 November a Song force under the official Yu Yunwen, with paddle-wheel warships throwing gunpowder bombs, threw back the Jin attempt to cross the Yangtze at Caishi. While Wanyan Liang prepared a new crossing near Yangzhou, his cousin Wanyan Yong had been proclaimed emperor (Shizong) at Liaoyang, and on 15 December Wanyan Liang was killed by his own officers. The new Song emperor Xiaozong tried to reconquer the north in 1163, but his armies were routed at Fuli. The peace of Longxing (1164–1165) kept the Huai border, turned the Song emperor from a vassal into a “nephew” of the Jin emperor and cut the yearly payments; it held until 1206.: La guerre déclenchée par l’empereur Jin Wanyan Liang (prince de Hailing), qui rompit la paix de Shaoxing pour conquérir les Song du Sud. À l’automne 1161, il conduisit une immense armée de Kaifeng jusqu’à la Huai et au Yangtsé et envoya une flotte par mer contre la capitale des Song, Lin’an. La flotte fut détruite au large de la côte du Shandong, à Tangdao, le 16 novembre et, les 26 et 27 novembre, une force Song commandée par le fonctionnaire Yu Yunwen, avec des navires de guerre à roues à aubes qui lançaient des bombes à poudre, repoussa la tentative des Jin de franchir le Yangtsé à Caishi. Tandis que Wanyan Liang préparait une nouvelle traversée près de Yangzhou, son cousin Wanyan Yong avait été proclamé empereur (Shizong) à Liaoyang, et le 15 décembre Wanyan Liang fut tué par ses propres officiers. Le nouvel empereur Song Xiaozong tenta de reconquérir le nord en 1163, mais ses armées furent mises en déroute à Fuli. La paix de Longxing (1164–1165) maintint la frontière sur la Huai, fit de l’empereur Song non plus un vassal mais un « neveu » de l’empereur Jin et réduisit les versements annuels ; elle tint jusqu’en 1206.
