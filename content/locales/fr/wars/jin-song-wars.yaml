# French translations of the catalogue text (wave 9); step bodies follow later.
Jin–Song wars: Guerres entre les Jin et les Song
? The wars in which the Jurchen Jin dynasty, having destroyed the Liao with Song help, turned on its ally and conquered northern China. Jin armies besieged the Song capital Kaifeng in 1126, took it in January 1127 and carried the retired emperor Huizong, the reigning emperor Qinzong and some 14,000 members of the court north into captivity, the Jingkang incident. A surviving prince, Zhao Gou, was proclaimed emperor (Gaozong) and founded the Southern Song. In 1129–1130 the Jin general Wuzhu crossed the Yangtze and chased the court to the sea, but was trapped for 48 days at Huangtiandang on his way back; in the west the Wu brothers held the passes into Sichuan. The Jin ruled Henan and Shaanxi for a time through a client state, Qi, which they abolished in 1137. After a short-lived peace, Wuzhu attacked again in 1140; Liu Qi and Yue Fei defeated him at Shunchang, Yancheng and Yingchang, but the court of Gaozong and Qin Hui recalled Yue Fei, had him killed in prison and made the peace of Shaoxing (agreed 1141, ratified 1142). It fixed the border on the Huai River and the Dasan Pass, made the Song emperor a vassal of the Jin and bound the Song to yearly payments of silver and silk.
: "Les guerres au cours desquelles la dynastie jürchen des Jin, après avoir détruit les Liao avec l’aide des Song, se retourna contre son allié et conquit la Chine du Nord. Les armées Jin assiégèrent la capitale des Song, Kaifeng, en 1126, la prirent en janvier 1127 et emmenèrent en captivité dans le nord l’empereur retiré Huizong, l’empereur régnant Qinzong et quelque 14 000 membres de la cour : c’est l’incident de Jingkang. Un prince survivant, Zhao Gou, fut proclamé empereur (Gaozong) et fonda les Song du Sud. En 1129–1130, le général Jin Wuzhu franchit le Yangtsé et pourchassa la cour jusqu’à la mer, mais fut bloqué 48 jours à Huangtiandang sur le chemin du retour ; à l’ouest, les frères Wu tenaient les cols menant au Sichuan. Les Jin gouvernèrent un temps le Henan et le Shaanxi par l’intermédiaire d’un État client, le Qi, qu’ils abolirent en 1137. Après une paix éphémère, Wuzhu attaqua de nouveau en 1140 ; Liu Qi et Yue Fei le battirent à Shunchang, à Yancheng et à Yingchang, mais la cour de Gaozong et de Qin Hui rappela Yue Fei, le fit mettre à mort en prison et conclut la paix de Shaoxing (convenue en 1141, ratifiée en 1142). Celle-ci fixait la frontière sur la Huai et au col de Dasan, faisait de l’empereur Song un vassal des Jin et obligeait les Song à des versements annuels d’argent et de soie."
