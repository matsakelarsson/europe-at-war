# French translations of the catalogue text (wave 9); step bodies follow later.
Jinchuan campaigns: Campagnes du Jinchuan
? Two wars of the Qianlong Emperor against the Gyalrong chiefdoms of Greater and Lesser Jinchuan (Chuchen and Tsanlha), in the deep valleys of the upper Dadu River on the eastern edge of the Tibetan plateau, in today’s north-western Sichuan. The chiefs held their lands as hereditary Qing chieftains (tusi). In 1747 the emperor sent an army when Slob dpon of Greater Jinchuan attacked his neighbours; his commanders failed against the stone towers of the valleys, two of them were put to death, and in 1749 the chief submitted and kept his lands. In 1771 Slob dpon’s grandson Sonom and Senggesang of Lesser Jinchuan seized the lands of other chiefs. This time the war lasted five years. A Jinchuan attack destroyed the Qing camp at Muguomu in 1773 and killed the commander Wenfu, but Agui’s army took the valleys tower by tower with heavy cannon, and Sonom surrendered early in 1776. He was executed in Beijing, the chiefdoms were abolished and the region was put under Qing officials and military colonies. The second war, which cost the Qing tens of thousands of men and some 60 to 70 million taels of silver, was the most expensive of the Ten Great Campaigns.
: Deux guerres de l’empereur Qianlong contre les chefferies gyalrong du Grand et du Petit Jinchuan (Chuchen et Tsanlha), dans les vallées encaissées du cours supérieur de la rivière Dadu, à l’extrémité orientale du plateau tibétain, dans le nord-ouest de l’actuel Sichuan. Les chefs tenaient leurs terres en tant que chefs héréditaires (tusi) des Qing. En 1747, l’empereur envoya une armée lorsque Slob dpon, du Grand Jinchuan, attaqua ses voisins ; les commandants impériaux échouèrent devant les tours de pierre des vallées, deux d’entre eux furent mis à mort et, en 1749, le chef se soumit et conserva ses terres. En 1771, Sonom, petit-fils de Slob dpon, et Senggesang, du Petit Jinchuan, s’emparèrent des terres d’autres chefs. Cette fois, la guerre dura cinq ans. Une attaque du Jinchuan détruisit le camp Qing de Muguomu en 1773 et tua le commandant Wenfu, mais l’armée d’Agui prit les vallées tour après tour à l’aide d’une artillerie lourde, et Sonom se rendit au début de 1776. Il fut exécuté à Pékin, les chefferies furent abolies et la région fut placée sous l’autorité de fonctionnaires Qing et de colonies militaires. La seconde guerre, qui coûta aux Qing des dizaines de milliers d’hommes et quelque 60 à 70 millions de taels d’argent, fut la plus coûteuse des dix grandes campagnes.
