# French translations of the catalogue text (wave 9); step bodies follow later.
Jingnan campaign: Campagne de Jingnan
? The civil war in which Zhu Di, Prince of Yan, a son of the Hongwu Emperor, overthrew his nephew the Jianwen Emperor and took the throne as the Yongle Emperor. Jianwen, who succeeded his grandfather in 1398, set out with his advisers Qi Tai and Huang Zicheng to reduce the power of his uncles, the princes who commanded armies on the frontiers. Zhu Di, the strongest of them, rose at Beiping (Beijing) on 6 August 1399, claiming to rescue the throne from evil ministers; he called his campaign jingnan, “quelling the troubles”. With about 100,000 men against a government with three times as many, he beat the first imperial armies near Zhending and before Beiping in 1399, won a great battle on the Baigou River in 1400, but failed before Jinan and was badly beaten at Dongchang in January 1401. In 1402 he bypassed the fortified cities of Shandong, crossed the Huai and the Yangtze, and on 13 July entered Nanjing when its gates were opened to him. The palace burned and the Jianwen Emperor was never seen again. Zhu Di was enthroned on 17 July 1402 and purged the late emperor’s followers, killing thousands; he later moved the capital to Beijing.
: La guerre civile au cours de laquelle Zhu Di, prince de Yan, fils de l’empereur Hongwu, renversa son neveu l’empereur Jianwen et monta sur le trône sous le nom d’empereur Yongle. Jianwen, qui avait succédé à son grand-père en 1398, entreprit avec ses conseillers Qi Tai et Huang Zicheng de réduire le pouvoir de ses oncles, les princes qui commandaient des armées aux frontières. Zhu Di, le plus puissant d’entre eux, se souleva à Beiping (Pékin) le 6 août 1399, prétendant délivrer le trône de mauvais ministres ; il appela sa campagne jingnan, « apaiser les troubles ». Avec environ 100 000 hommes face à un gouvernement qui en avait trois fois plus, il battit les premières armées impériales près de Zhending et devant Beiping en 1399, remporta une grande bataille sur la rivière Baigou en 1400, mais échoua devant Jinan et subit une lourde défaite à Dongchang en janvier 1401. En 1402, il contourna les villes fortifiées du Shandong, franchit la Huai et le Yangtsé et, le 13 juillet, entra à Nankin, dont les portes lui furent ouvertes. Le palais brûla et l’empereur Jianwen ne fut jamais revu. Zhu Di fut intronisé le 17 juillet 1402 et purgea les partisans du défunt empereur, en tuant des milliers ; il transféra plus tard la capitale à Pékin.
