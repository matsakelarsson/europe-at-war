# French translations of the catalogue text (wave 10); step bodies follow later.
Jōhei–Tengyō rebellion: Rébellion de Jōhei–Tengyō
? "Two risings that broke out at almost the same time at opposite ends of Japan and shook the court in Heian-kyō: that of Taira no Masakado in the Kantō plain and that of Fujiwara no Sumitomo on the Inland Sea. Masakado, a grandson of an imperial prince who had settled in the east, won a long feud with his uncles in the 930s. In the eleventh month of 939 he took the side of a local strongman against the governor of Hitachi and seized the provincial headquarters, and within weeks he had driven the governors out of the eight Kantō provinces, appointed his own and taken the title Shinnō, “new emperor”. He was killed in battle by his cousin Taira no Sadamori and Fujiwara no Hidesato on 25 March 940. Sumitomo, a former provincial official of Iyo who had been sent to suppress raiders on the Inland Sea, became the leader of armed men of the coast and from the end of 939 attacked officials, provincial offices and granaries from Settsu to Tosa. In 941 he seized and burned the Dazaifu in Kyushu, but his fleet was destroyed in Hakata Bay, and he was captured in Iyo and died in prison. The court won both wars only by rewarding the provincial warriors who fought for it, which is why historians see the rebellion as the moment when the warrior class came of age."
: "Deux soulèvements qui éclatèrent presque en même temps aux deux extrémités du Japon et ébranlèrent la cour de Heian-kyō : celui de Taira no Masakado dans la plaine du Kantō et celui de Fujiwara no Sumitomo sur la mer intérieure de Seto. Masakado, petit-fils d’un prince impérial établi dans l’est, l’emporta dans une longue querelle avec ses oncles dans les années 930. Au onzième mois de 939, il prit le parti d’un homme fort local contre le gouverneur de Hitachi et s’empara du siège de la province ; en quelques semaines, il avait chassé les gouverneurs des huit provinces du Kantō, nommé les siens et pris le titre de Shinnō, « nouvel empereur ». Il fut tué au combat par son cousin Taira no Sadamori et par Fujiwara no Hidesato le 25 mars 940. Sumitomo, ancien fonctionnaire provincial d’Iyo qui avait été envoyé réprimer les pillards de la mer intérieure, devint le chef des hommes en armes de la côte et, à partir de la fin de 939, attaqua fonctionnaires, sièges provinciaux et greniers de Settsu à Tosa. En 941, il s’empara du Dazaifu, à Kyushu, et l’incendia, mais sa flotte fut détruite dans la baie de Hakata ; il fut capturé en Iyo et mourut en prison. La cour ne gagna les deux guerres qu’en récompensant les guerriers provinciaux qui combattaient pour elle, et c’est pourquoi les historiens voient dans cette rébellion le moment où la classe guerrière atteignit sa maturité."
