# French translations of the catalogue text (wave 14); step bodies follow later.
John Brown’s raid on Harpers Ferry: Raid de John Brown sur Harpers Ferry
? "An armed attempt by the abolitionist John Brown to start a war of liberation against slavery. On the night of 16 October 1859 Brown and 21 men, 16 white and five Black (Osborne Perry Anderson, Shields Green, John Anthony Copeland, Lewis Sheridan Leary and Dangerfield Newby, who hoped to free his enslaved wife and children), crossed the Potomac from their base at the Kennedy Farm in Maryland and seized the federal armory, arsenal and rifle works at Harpers Ferry, Virginia (now West Virginia). They meant to arm enslaved people who joined them and carry the fight south through the Appalachians, but few joined. They took hostages, among them Lewis Washington, a great-grandnephew of George Washington; the first man they killed was Heyward Shepherd, a free Black railway baggage master. Militia from Virginia and Maryland trapped the raiders in the armory’s engine house, and on the morning of 18 October a company of US Marines sent from Washington under Colonel Robert E. Lee, with Lieutenant J. E. B. Stuart, stormed it. Ten raiders were killed, among them two of Brown’s sons, and the raiders killed four townspeople and a Marine. Brown was tried by Virginia for treason against the state, murder and inciting enslaved people to rebel, and was hanged at Charles Town on 2 December 1859; six of his men were hanged after him, and five escaped. The raid deepened the divide between North and South: many Northerners came to see Brown as a martyr against slavery, while white Southerners saw proof of an abolitionist plot to raise a rebellion of the enslaved, and secessionists used it a year later."
: "Une tentative armée de l’abolitionniste John Brown pour déclencher une guerre de libération contre l’esclavage. Dans la nuit du 16 octobre 1859, Brown et 21 hommes, 16 Blancs et cinq Noirs (Osborne Perry Anderson, Shields Green, John Anthony Copeland, Lewis Sheridan Leary et Dangerfield Newby, qui espérait libérer sa femme et ses enfants réduits en esclavage), traversèrent le Potomac depuis leur base de la ferme Kennedy, dans le Maryland, et s’emparèrent de l’armurerie fédérale, de l’arsenal et de la fabrique de fusils de Harpers Ferry, en Virginie (aujourd’hui en Virginie-Occidentale). Ils comptaient armer les personnes réduites en esclavage qui les rejoindraient et porter la lutte vers le sud à travers les Appalaches, mais peu les rejoignirent. Ils prirent des otages, parmi lesquels Lewis Washington, arrière-petit-neveu de George Washington ; le premier homme qu’ils tuèrent fut Heyward Shepherd, un chef bagagiste noir et libre du chemin de fer. Des miliciens de Virginie et du Maryland bloquèrent les assaillants dans la remise des pompes à incendie de l’armurerie et, au matin du 18 octobre, une compagnie de Marines des États-Unis envoyée de Washington sous les ordres du colonel Robert E. Lee, avec le lieutenant J. E. B. Stuart, la prit d’assaut. Dix assaillants furent tués, dont deux fils de Brown, et les assaillants tuèrent quatre habitants de la ville et un Marine. Brown fut jugé par la Virginie pour trahison envers l’État, meurtre et incitation de personnes réduites en esclavage à la rébellion, et fut pendu à Charles Town le 2 décembre 1859 ; six de ses hommes furent pendus après lui, et cinq s’échappèrent. Le raid creusa le fossé entre le Nord et le Sud : beaucoup de Nordistes en vinrent à voir en Brown un martyr de la lutte contre l’esclavage, tandis que les Blancs du Sud y virent la preuve d’un complot abolitionniste visant à soulever les personnes réduites en esclavage, et les sécessionnistes s’en servirent un an plus tard."
