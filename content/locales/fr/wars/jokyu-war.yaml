# French translations of the catalogue text (wave 10); step bodies follow later.
Jōkyū War: Guerre de Jōkyū
? The short war in which the retired emperor Go-Toba tried to break the power of the Hōjō regents of the Kamakura shogunate and was crushed within a month, leaving the warrior government master of the court. After the assassination of the third Minamoto shōgun, Sanetomo, in 1219, the shogunate was run by his mother Hōjō Masako and her brother, the regent Hōjō Yoshitoki, with an infant from the Kujō family as nominal shōgun, while Go-Toba built up his own warrior guard and quarrelled with Kamakura over the stewards it placed on his estates. In the fifth month of 1221 Go-Toba had the shogunate’s deputy in Kyoto killed and declared Yoshitoki an outlaw, expecting the eastern warriors to abandon him. Instead, rallied by Masako, they marched on Kyoto in three armies, which the shogunate’s chronicle puts at 190,000 horsemen, against perhaps 17,500 for the court. The court’s forces were routed on the Kiso River on the fifth and sixth days of the sixth month and at Uji and Seta on the 13th and 14th, and Kamakura’s army entered Kyoto. Go-Toba was exiled to the Oki Islands, where he died in 1239, the retired emperors Juntoku and Tsuchimikado were sent to Sado and Tosa, and the child emperor Chūkyō was deposed. The shogunate confiscated more than 3,000 estates of the court’s supporters and set up the Rokuhara deputies to watch over the court.
: La courte guerre par laquelle l’empereur retiré Go-Toba tenta de briser le pouvoir des régents Hōjō du shogunat de Kamakura et fut écrasé en moins d’un mois, ce qui laissa le gouvernement guerrier maître de la cour. Après l’assassinat du troisième shōgun Minamoto, Sanetomo, en 1219, le shogunat fut dirigé par sa mère Hōjō Masako et par le frère de celle-ci, le régent Hōjō Yoshitoki, avec pour shōgun nominal un enfant en bas âge de la famille Kujō, tandis que Go-Toba constituait sa propre garde de guerriers et se querellait avec Kamakura au sujet des intendants que le shogunat plaçait sur ses domaines. Au cinquième mois de 1221, Go-Toba fit tuer le représentant du shogunat à Kyoto et déclara Yoshitoki hors-la-loi, comptant que les guerriers de l’Est l’abandonneraient. Au contraire, ralliés par Masako, ils marchèrent sur Kyoto en trois armées, que la chronique du shogunat chiffre à 190 000 cavaliers, contre peut-être 17 500 pour la cour. Les forces de la cour furent mises en déroute sur le fleuve Kiso les cinquième et sixième jours du sixième mois, puis à Uji et à Seta les 13 et 14, et l’armée de Kamakura entra dans Kyoto. Go-Toba fut exilé dans les îles Oki, où il mourut en 1239, les empereurs retirés Juntoku et Tsuchimikado furent envoyés à Sado et en Tosa, et l’enfant empereur Chūkyō fut déposé. Le shogunat confisqua plus de 3 000 domaines aux partisans de la cour et institua les représentants de Rokuhara pour surveiller la cour.
