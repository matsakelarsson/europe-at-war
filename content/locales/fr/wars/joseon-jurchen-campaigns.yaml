# French translations of the catalogue text (wave 10); step bodies follow later.
Joseon’s Jurchen campaigns: Campagnes du Joseon contre les Jürchen
The campaigns in which Joseon pushed its northern frontier to the Yalu and Tumen rivers and fought the Jurchen tribes beyond them. After Jianzhou Jurchens under Li Manzhu raided the upper Yalu in 1432, King Sejong sent Choe Yun-deok across the river in 1433 with 15,000 men against their villages on the Pojeo (Hun) River, and a second campaign followed in 1437; four new commanderies were set up along the upper Yalu. In the north-east, after the Jurchen chief Möngke Temür was killed in 1433, Kim Jong-seo built six fortified garrisons along the Tumen and settled them with people from the south. The upper-Yalu commanderies proved too costly and were abandoned in the 1450s, but the Tumen line held, and the two rivers became Korea’s border. Joseon joined Ming attacks on the Jianzhou Jurchens in 1467, when Li Manzhu was killed, and in 1479, and in 1491 Heo Jong led some 20,000 men across the Tumen against the Udige.: Les campagnes par lesquelles le Joseon repoussa sa frontière septentrionale jusqu’au Yalu et au Tumen et combattit les tribus jürchen établies au-delà. Après que des Jürchen de Jianzhou menés par Li Manzhu eurent lancé des raids sur le haut Yalu en 1432, le roi Sejong envoya en 1433 Choe Yun-deok franchir le fleuve avec 15 000 hommes contre leurs villages de la rivière Pojeo (Hun), et une seconde campagne suivit en 1437 ; quatre nouvelles commanderies furent créées le long du haut Yalu. Dans le nord-est, après que le chef jürchen Möngke Temür eut été tué en 1433, Kim Jong-seo construisit six garnisons fortifiées le long du Tumen et les peupla de gens venus du sud. Les commanderies du haut Yalu se révélèrent trop coûteuses et furent abandonnées dans les années 1450, mais la ligne du Tumen tint, et les deux fleuves devinrent la frontière de la Corée. Le Joseon se joignit aux attaques des Ming contre les Jürchen de Jianzhou en 1467, année où Li Manzhu fut tué, et en 1479, et en 1491 Heo Jong mena quelque 20 000 hommes au-delà du Tumen contre les Udige.
