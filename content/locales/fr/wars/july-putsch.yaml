# Some French text was translated automatically.
"July Putsch": "Juillet Putsch"
"A failed coup by Austrian Nazis against the government of Engelbert Dollfuss. On 25 July 1934 about 150 members of the SS-Standarte 89, disguised as soldiers and police, seized the Federal Chancellery in Vienna and shot Dollfuss, who died of his wounds, while others took the radio station and falsely announced a change of government. The putsch collapsed in Vienna within hours, but fighting went on in Carinthia, Styria and other provinces until 30 July. Mussolini moved troops to the Brenner Pass, and Hitler, whose regime had encouraged the Austrian Nazis, disowned them. Between about 220 and 270 people were killed. Thirteen putschists were executed, and Kurt Schuschnigg succeeded Dollfuss as chancellor.": "Le 25 juillet 1934, environ 150 membres du SS-Standarte 89, déguisés en soldats et policiers, s’emparèrent de la Chancellerie fédérale à Vienne et tirèrent sur Dollfuss, qui mourut de ses blessures, tandis que d’autres prirent la radio et annonçaient faussement un changement de gouvernement. Le putsch s’est effondré à Vienne en quelques heures, mais les combats se sont poursuivis en Carinthie, en Styrie et dans d’autres provinces jusqu’au 30 juillet. Mussolini a déplacé des troupes au col du Brenner, et Hitler, dont le régime avait encouragé les nazis autrichiens, les a reniés. Entre 220 et 270 personnes ont été tuées. Treize putschistes ont été exécutés, et Kurt Schuschnigg a succédé à Dollfuss comme chancelier."
"The Nazi Party had been banned in Austria since June 1933. Many Austrian Nazis had fled to Germany, where some joined the Austrian Legion; the putschists hoped to make the Christian Social politician Anton Rintelen chancellor.": "Le parti nazi avait été interdit en Autriche depuis juin 1933. De nombreux nazis autrichiens avaient fui vers l’Allemagne, où certains ont rejoint la Légion autrichienne ; les putschistes espéraient faire du politicien social chrétien Anton Rintelen chancelier."
