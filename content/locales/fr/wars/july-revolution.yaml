# Some French text was translated automatically.
"July Revolution": "Révolution de juillet"
? "The rising in Paris that overthrew Charles X, the last Bourbon king of France. On 26 July 1830 the government of Jules de Polignac published the July Ordinances, which suspended the freedom of the press, dissolved the newly elected Chamber of Deputies, in which the liberal opposition had won a large majority, and narrowed the franchise. On the “Three Glorious Days” of 27–29 July, printers, workers, students and former soldiers fought Marshal Auguste Marmont’s troops from barricades; as some line regiments went over to the crowd, the insurgents took the Hôtel de Ville, the Louvre and the Tuileries, and the royal forces left the city. Several hundred insurgents and soldiers were killed. Charles X abdicated on 2 August and went into exile in Britain. The liberal deputies passed over his grandson and on 9 August made his cousin Louis Philippe, Duke of Orléans, “King of the French” under a revised Charter, beginning the July Monarchy. The revolution helped inspire the Belgian Revolution and the November Uprising in Poland, and Eugène Delacroix commemorated it in Liberty Leading the People."
: "Le 26 juillet 1830, le gouvernement de Jules de Polignac publia les ordonnances de juillet qui suspendirent la liberté de la presse, dissout la Chambre des députés nouvellement élue, dans laquelle l’opposition libérale avait obtenu une grande majorité et réduit la franchise. Le 27 et le 29 juillet, des imprimeurs, des ouvriers, des étudiants et d’anciens soldats ont combattu les troupes du maréchal Auguste Marmont. Des régiments de ligne se sont rendus à la foule, les insurgés ont pris l’Hôtel de Ville, le Louvre et les Tuileries, et les forces royales ont quitté la ville. Plusieurs centaines d’insurgés et de soldats ont été tués. Charles X abdiqua le 2 août et s’exila en Grande-Bretagne. Les députés libéraux passèrent sur son petit-fils et, le 9 août, formèrent son cousin Louis Philippe, duc d’Orléans, roi des Français, en vertu d’une Charte révisée, commençant par la Monarchie de juillet. La révolution contribua à inspirer la Révolution belge et l’Insurrection de novembre en Pologne, et Eugène Delacroix le commémora dans Liberty Leading the People."
"Also called the French Revolution of 1830 or the Three Glorious Days (les Trois Glorieuses). The ordinances were signed on 25 July and published in Le Moniteur the next day.": "Aussi appelée la Révolution française de 1830 ou les Trois Glorieuses. Les ordonnances ont été signées le 25 juillet et publiées dans Le Moniteur le lendemain."
