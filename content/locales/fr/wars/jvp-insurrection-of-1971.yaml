# French translations of the catalogue text (wave 8); step bodies follow later.
JVP insurrection of 1971: Insurrection du JVP de 1971
An armed rising against the government of Ceylon (Sri Lanka from 1972) by the Janatha Vimukthi Peramuna (JVP, People’s Liberation Front), a Marxist movement of mostly young, educated and unemployed Sinhalese from the rural south. Its leader, Rohana Wijeweera, was arrested in March 1971, and the government of Sirimavo Bandaranaike declared a state of emergency. On 5 April, starting with the police station at Wellawaya, JVP groups attacked 92 police stations across the island, took five and forced the abandonment of dozens more, and for some weeks held much of the Southern and Sabaragamuwa provinces and parts of the interior. With arms, aircraft and helicopters sent by India, Pakistan, the United Kingdom, the Soviet Union and others, the army and police retook the rebel areas by June. Thousands of young people were killed, many after capture; the government’s figure at the time was about 1,200 dead, while unofficial estimates run from 4,000–5,000 to 10,000 or more.: Un soulèvement armé contre le gouvernement de Ceylan (Sri Lanka à partir de 1972) mené par le Janatha Vimukthi Peramuna (JVP, Front de libération du peuple), un mouvement marxiste composé surtout de jeunes Cinghalais instruits et sans emploi venus du sud rural. Son chef, Rohana Wijeweera, fut arrêté en mars 1971, et le gouvernement de Sirimavo Bandaranaike proclama l’état d’urgence. Le 5 avril, en commençant par le poste de police de Wellawaya, des groupes du JVP attaquèrent 92 postes de police dans toute l’île, en prirent cinq et en firent abandonner des dizaines d’autres, puis tinrent pendant quelques semaines une grande partie de la province du Sud et de celle de Sabaragamuwa ainsi que certaines régions de l’intérieur. Grâce aux armes, aux avions et aux hélicoptères envoyés par l’Inde, le Pakistan, le Royaume-Uni, l’Union soviétique et d’autres pays, l’armée et la police reprirent les zones rebelles en juin. Des milliers de jeunes furent tués, beaucoup après leur capture ; le chiffre officiel de l’époque était d’environ 1 200 morts, tandis que les estimations non officielles vont de 4 000–5 000 à 10 000, voire davantage.
