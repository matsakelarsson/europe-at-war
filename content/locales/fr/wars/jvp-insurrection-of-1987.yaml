# French translations of the catalogue text (wave 8); step bodies follow later.
JVP insurrection of 1987–1989: Insurrection du JVP de 1987–1989
? The second armed rising of the Janatha Vimukthi Peramuna (JVP, People’s Liberation Front), a Marxist movement of young Sinhalese from the rural south of Sri Lanka, and the state terror with which it was crushed. Banned after the riots of July 1983, the JVP went underground, and after the Indo-Sri Lanka Accord of July 1987 brought Indian troops to the north and east, it led a violent campaign against the accord, which it called a betrayal of the nation. Its armed wing, the Deshapremi Janatha Viyaparaya (DJV, Patriotic People’s Movement), killed politicians, officials, police and anyone who defied its orders to strike, and in 1988–1989 brought much of the south to a halt. The government of Ranasinghe Premadasa answered with a counter-insurgency in which the army, the police and death squads killed tens of thousands of young people, many of whom disappeared. The JVP’s leader Rohana Wijeweera was captured and killed in November 1989, and by the end of the year the rising was over. Estimates of the dead range from about 40,000 to 80,000.
: Le second soulèvement armé du Janatha Vimukthi Peramuna (JVP, Front de libération du peuple), un mouvement marxiste de jeunes Cinghalais du sud rural du Sri Lanka, et la terreur d’État par laquelle il fut écrasé. Interdit après les émeutes de juillet 1983, le JVP entra dans la clandestinité, et après que l’accord indo-sri-lankais de juillet 1987 eut amené des troupes indiennes dans le nord et l’est, il mena une campagne violente contre cet accord, qu’il qualifiait de trahison de la nation. Sa branche armée, le Deshapremi Janatha Viyaparaya (DJV, Mouvement patriotique du peuple), tua des hommes politiques, des fonctionnaires, des policiers et tous ceux qui défiaient ses ordres de grève, et paralysa en 1988–1989 une grande partie du sud. Le gouvernement de Ranasinghe Premadasa répondit par une contre-insurrection au cours de laquelle l’armée, la police et des escadrons de la mort tuèrent des dizaines de milliers de jeunes, dont beaucoup disparurent. Le chef du JVP, Rohana Wijeweera, fut capturé et tué en novembre 1989, et à la fin de l’année le soulèvement avait pris fin. Les estimations du nombre de morts vont d’environ 40 000 à 80 000.
