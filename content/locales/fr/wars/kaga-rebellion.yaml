# French translations of the catalogue text (wave 10); step bodies follow later.
Kaga Rebellion and the Ikkō-ikki province: Rébellion de Kaga et province des Ikkō-ikki
? The rising in which the leagues (ikki) of the Jōdo Shinshū followers of the Hongan-ji, the Ikkō-ikki, overthrew the governor of Kaga and ruled the province for almost a century. The preacher Rennyo, head of the Hongan-ji, had won a great following of farmers, village warriors (jizamurai), merchants and monks in Kaga and Echizen while he lived at Yoshizaki in 1471–1475. In 1473–1474 the leagues helped Togashi Masachika win the governorship (shugo) of Kaga from his brother Kōchiyo, but Masachika soon turned on them. In 1487 he marched to Ōmi with the shogun Ashikaga Yoshihisa against the Rokkaku, and the leagues, led by Rennyo’s sons and joined by Togashi vassals, rose in his absence. In the sixth month of 1488 an army put at 100,000 to 200,000 besieged him in Takao castle, near today’s Kanazawa, and he killed himself as it fell. The leagues set up his kinsman Togashi Yasutaka as a figurehead governor, and Kaga became known as “the province held by the peasants” (hyakushō no mochitaru kuni), governed by the leagues, the temples and the local warriors, and from 1546 from the Oyama Gobō, a fortified temple on the site of Kanazawa. The leagues fought among themselves in 1531, against the Asakura of Echizen and the Uesugi, and supported the Hongan-ji in its war with Oda Nobunaga. After the Hongan-ji made peace in 1580, Nobunaga’s general Shibata Katsuie took the Oyama Gobō; the last resistance in the mountains near Hakusan was crushed in 1582.
: Le soulèvement au cours duquel les ligues (ikki) des fidèles du Jōdo Shinshū attachés au Hongan-ji, les Ikkō-ikki, renversèrent le gouverneur du Kaga et gouvernèrent la province pendant près d’un siècle. Le prédicateur Rennyo, chef du Hongan-ji, s’était attaché de nombreux fidèles parmi les paysans, les guerriers de village (jizamurai), les marchands et les moines du Kaga et de l’Echizen lorsqu’il vivait à Yoshizaki, en 1471–1475. En 1473–1474, les ligues aidèrent Togashi Masachika à arracher le gouvernorat (shugo) du Kaga à son frère Kōchiyo, mais Masachika se retourna bientôt contre elles. En 1487, il partit pour l’Ōmi avec le shogun Ashikaga Yoshihisa contre les Rokkaku, et les ligues, menées par les fils de Rennyo et rejointes par des vassaux des Togashi, se soulevèrent en son absence. Au sixième mois de 1488, une armée estimée entre 100 000 et 200 000 hommes l’assiégea dans le château de Takao, près de l’actuelle Kanazawa, et il se donna la mort lorsque le château tomba. Les ligues installèrent son parent Togashi Yasutaka comme gouverneur de façade, et le Kaga devint connu comme « la province tenue par les paysans » (hyakushō no mochitaru kuni), gouvernée par les ligues, les temples et les guerriers locaux, et à partir de 1546 depuis l’Oyama Gobō, un temple fortifié sur le site de Kanazawa. Les ligues se combattirent entre elles en 1531, luttèrent contre les Asakura de l’Echizen et contre les Uesugi, et soutinrent le Hongan-ji dans sa guerre contre Oda Nobunaga. Après que le Hongan-ji eut fait la paix en 1580, Shibata Katsuie, général de Nobunaga, prit l’Oyama Gobō ; la dernière résistance, dans les montagnes proches du Hakusan, fut écrasée en 1582.
