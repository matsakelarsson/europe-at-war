# French translations of the catalogue text (wave 9); step bodies follow later.
Kaidu–Kublai war: Guerre entre Qaïdu et Kubilai
? The long war between Kaidu, a grandson of the Great Khan Ögedei, and Kublai Khan and his successor Temür, fought over the steppe and oases of Central Asia, the Uyghur lands and Mongolia. Kaidu, who held lands south-east of Lake Balkhash, never accepted Kublai’s victory over Ariq Böke. From 1268 he fought Kublai’s armies around Almaliq, won control of the Chagatai lands after the Chagatayid khan Baraq was defeated by the Ilkhan at Herat in 1270, and was recognised as ruler of the house of Ögedei in 1271. With the Chagatayid Du’a he raided the Uyghur kingdom of Qocho, took Beshbaliq from its Yuan garrison in 1286 and captured Karakorum in 1289, and he was allied with the Mongol princes of Manchuria in Nayan’s rebellion of 1287. Kublai held Mongolia and China but slowly gave up the Tarim oases. After Kublai’s death in 1294 the war went on under Temür Khan; in 1301 Kaidu was wounded in battle with the Yuan army under Khaishan and died soon after. Du’a and Kaidu’s son Chapar made peace with the Yuan in 1303–1304, recognising the Yuan emperor as nominal overlord.
: La longue guerre entre Qaïdu, petit-fils du grand khan Ögedei, et Kubilai Khan puis son successeur Temür, livrée dans les steppes et les oasis d’Asie centrale, les terres ouïghoures et la Mongolie. Qaïdu, qui tenait des terres au sud-est du lac Balkhach, n’accepta jamais la victoire de Kubilai sur Ariq Böke. À partir de 1268, il combattit les armées de Kubilai autour d’Almaliq, prit le contrôle des terres de Djaghataï après la défaite du khan djaghataïde Baraq face à l’ilkhan à Hérat en 1270, et fut reconnu comme chef de la maison d’Ögedei en 1271. Avec le Djaghataïde Du’a, il razzia le royaume ouïghour de Qocho, prit Beshbaliq à sa garnison Yuan en 1286 et s’empara de Karakorum en 1289, et il était allié aux princes mongols de Mandchourie lors de la rébellion de Nayan en 1287. Kubilai conserva la Mongolie et la Chine, mais abandonna peu à peu les oasis du Tarim. Après la mort de Kubilai en 1294, la guerre se poursuivit sous Temür Khan ; en 1301, Qaïdu fut blessé au combat contre l’armée Yuan commandée par Khaishan et mourut peu après. Du’a et Chapar, fils de Qaïdu, firent la paix avec les Yuan en 1303–1304, reconnaissant l’empereur Yuan comme suzerain nominal.
