# French translations of the catalogue text (wave 9); step bodies follow later.
Kaixi war: Guerre de Kaixi
? The Southern Song attempt to recover northern China from the Jin, named after the Song reign period Kaixi (1205–1207) and also called the Kaixi Northern Expedition. The chief minister Han Tuozhou, who had dominated the court since 1194, judged the Jin weakened by floods, unrest and the rising Mongols. Song troops crossed the border in May 1206, and war was formally declared on 14 June. Apart from Bi Zaiyu’s capture of Sizhou, the attacks on Suzhou, Shouzhou, Tangzhou and Caizhou failed, and in the autumn Jin armies under Pusan Kui crossed the Huai, besieged Xiangyang and reached the Yangtze. In December 1206 Wu Xi, the Song commander in Sichuan and grandson of Wu Lin, went over to the Jin, ceded four prefectures and was made King of Shu; Song loyalists led by Li Haoyi and Yang Juyuan killed him in his palace on 29 March 1207. With the war lost, a court faction around Shi Miyuan and Empress Yang had Han Tuozhou killed on 24 November 1207, and his head was later sent to the Jin as the price of peace. The peace of Jiading (1208) restored the border of 1142, raised the yearly payments to 300,000 taels of silver and 300,000 bolts of silk and added a war indemnity of three million taels. Dates are converted from the Chinese calendar as the sources give them.
: La tentative des Song du Sud pour reprendre la Chine du Nord aux Jin, nommée d’après l’ère Kaixi (1205–1207) des Song et appelée aussi expédition du Nord de Kaixi. Le chancelier Han Tuozhou, qui dominait la cour depuis 1194, jugeait les Jin affaiblis par les inondations, les troubles et la montée des Mongols. Les troupes Song franchirent la frontière en mai 1206, et la guerre fut officiellement déclarée le 14 juin. Hormis la prise de Sizhou par Bi Zaiyu, les attaques contre Suzhou, Shouzhou, Tangzhou et Caizhou échouèrent et, à l’automne, les armées Jin de Pusan Kui franchirent la Huai, assiégèrent Xiangyang et atteignirent le Yangtsé. En décembre 1206, Wu Xi, commandant des Song au Sichuan et petit-fils de Wu Lin, passa aux Jin, leur céda quatre préfectures et fut fait roi de Shu ; des loyalistes Song menés par Li Haoyi et Yang Juyuan le tuèrent dans son palais le 29 mars 1207. La guerre perdue, une faction de la cour réunie autour de Shi Miyuan et de l’impératrice Yang fit tuer Han Tuozhou le 24 novembre 1207, et sa tête fut plus tard envoyée aux Jin comme prix de la paix. La paix de Jiading (1208) rétablit la frontière de 1142, porta les versements annuels à 300 000 taels d’argent et 300 000 pièces de soie et y ajouta une indemnité de guerre de trois millions de taels. Les dates sont converties du calendrier chinois telles que les sources les donnent.
