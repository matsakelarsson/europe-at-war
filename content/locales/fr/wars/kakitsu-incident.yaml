# French translations of the catalogue text (wave 10); step bodies follow later.
Kakitsu Incident: Incident de Kakitsu
? "The murder of the shogun Ashikaga Yoshinori by Akamatsu Mitsusuke, and the campaign that destroyed the Akamatsu. Yoshinori, chosen by lot in 1428, ruled harshly: he meddled in the successions of the great houses, crushed the Kamakura kubō in 1439, and punished courtiers and warriors for small offences, so that a contemporary diarist wrote of “terror for all men”. Mitsusuke, governor of Harima, Bizen and Mimasaka and one of the senior lords, feared that his provinces would go to a favoured kinsman, Akamatsu Sadamura. On 12 July 1441 (the 24th day of the sixth month of Kakitsu 1) his son Noriyasu invited the shogun and many lords to his house in Kyoto to celebrate the victory at Yūki castle. During a performance armed men burst in and killed Yoshinori; several of his companions, among them Kyōgoku Takakazu and Ōuchi Mochiyo, died or were mortally wounded, and the other guests were let go. Mitsusuke set fire to his house and withdrew to Harima with the shogun’s head, set up a descendant of Ashikaga Tadafuyu, Ashikaga Yoshitaka, as a rival lord, and waited. The leaders in Kyoto were slow to act; Yoshinori’s eight-year-old son Yoshikatsu was named shogun, and the court issued an order to punish the Akamatsu only after a delay. Armies under Yamana Mochitoyo (later known as Sōzen) and Hosokawa Mochitsune invaded Harima and Mimasaka in the seventh and eighth months, the Akamatsu’s men deserted, and on 25 September 1441 Mitsusuke took his own life in Shiroyama castle near Tatsuno. The Yamana took Harima, Bizen and Mimasaka, which made them the rivals of the Hosokawa, and in the confusion a great debt rising (the Kakitsu tokusei ikki) forced the shogunate to cancel debts. With child shoguns the shogunate never regained Yoshinori’s power."
: "L’assassinat du shogun Ashikaga Yoshinori par Akamatsu Mitsusuke, et la campagne qui anéantit les Akamatsu. Yoshinori, désigné par tirage au sort en 1428, gouverna durement : il s’immisça dans les successions des grandes maisons, écrasa le Kamakura kubō en 1439 et punit courtisans et guerriers pour de menues fautes, si bien qu’un diariste de l’époque parla d’une « terreur pour tous les hommes ». Mitsusuke, gouverneur du Harima, du Bizen et du Mimasaka et l’un des principaux seigneurs, craignait que ses provinces ne passent à un parent en faveur, Akamatsu Sadamura. Le 12 juillet 1441 (le 24e jour du sixième mois de Kakitsu 1), son fils Noriyasu invita le shogun et de nombreux seigneurs dans sa demeure de Kyoto pour célébrer la victoire au château de Yūki. Pendant un spectacle, des hommes armés firent irruption et tuèrent Yoshinori ; plusieurs de ses compagnons, dont Kyōgoku Takakazu et Ōuchi Mochiyo, furent tués ou mortellement blessés, et les autres invités furent laissés libres de partir. Mitsusuke mit le feu à sa demeure et se retira dans le Harima avec la tête du shogun, installa un descendant d’Ashikaga Tadafuyu, Ashikaga Yoshitaka, comme seigneur rival, et attendit. Les dirigeants de Kyoto tardèrent à réagir ; Yoshikatsu, le fils de Yoshinori âgé de huit ans, fut nommé shogun, et la cour ne publia qu’après un certain délai l’ordre de châtier les Akamatsu. Des armées commandées par Yamana Mochitoyo (plus tard connu sous le nom de Sōzen) et Hosokawa Mochitsune envahirent le Harima et le Mimasaka aux septième et huitième mois, les hommes des Akamatsu désertèrent et, le 25 septembre 1441, Mitsusuke se donna la mort au château de Shiroyama, près de Tatsuno. Les Yamana prirent le Harima, le Bizen et le Mimasaka, ce qui fit d’eux les rivaux des Hosokawa, et, à la faveur de la confusion, un grand soulèvement pour l’annulation des dettes (le Kakitsu tokusei ikki) contraignit le shogunat à les annuler. Avec des shoguns enfants, le shogunat ne retrouva jamais la puissance qu’il avait eue sous Yoshinori."
