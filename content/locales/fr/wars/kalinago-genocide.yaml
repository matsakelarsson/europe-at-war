# French translations of the catalogue text (wave 14); step bodies follow later.
Kalinago genocide on Saint Kitts: Génocide des Kalinagos à Saint-Christophe
? The killing of the Kalinago of Saint Kitts (Liamuiga) by English and French colonists in 1626, two years after the island became the first English and French colony in the Caribbean. The English under Thomas Warner had landed in 1624 with the consent of the Kalinago leader Ouboutou Tegremante (Tegremond), and the French under Pierre Belain d’Esnambuc followed in 1625; as the colonists cleared more land for tobacco, relations broke down. In 1626, in August by local tradition, a Kalinago woman named Barbe told Warner and d’Esnambuc that Tegremond was summoning warriors from other islands to drive the colonists out. Acting on this report, which the historian Melanie Newton calls “slim intelligence”, the English and French attacked the Kalinago by night after a feast, killing about 120 people, Tegremond among them. They then drove the remaining Kalinago, some 3,000 to 4,000 people by the usual estimates, towards the river and point on the west coast still called Bloody River and Bloody Point, and killed most of them; the historian Vincent Hubbard puts the dead at about 2,000, many of them killed as they tried to surrender, while about 100 colonists also died. The survivors fled into the mountains; by 1640 those who had not been enslaved had been forced to leave for Dominica. In 1627 the English and French divided the island between them. Historians such as Andreas Buser have argued that the killings meet the definition of genocide; Saint Kitts and Nevis marked their 400th anniversary at Challengers, beside the Bloody River, in August 2026.
: La tuerie des Kalinagos de Saint-Christophe (Liamuiga) par des colons anglais et français en 1626, deux ans après que l’île fut devenue la première colonie anglaise et française des Caraïbes. Les Anglais de Thomas Warner y avaient débarqué en 1624 avec l’accord du chef kalinago Ouboutou Tegremante (Tegremond), et les Français de Pierre Belain d’Esnambuc les avaient suivis en 1625 ; à mesure que les colons défrichaient davantage de terres pour le tabac, les relations se dégradèrent. En 1626, au mois d’août selon la tradition locale, une femme kalinago nommée Barbe rapporta à Warner et à d’Esnambuc que Tegremond faisait venir des guerriers d’autres îles pour chasser les colons. Sur la foi de ce rapport, que l’historienne Melanie Newton qualifie de « maigre renseignement », les Anglais et les Français attaquèrent les Kalinagos de nuit, après un festin, et tuèrent environ 120 personnes, dont Tegremond. Ils repoussèrent ensuite les autres Kalinagos, quelque 3 000 à 4 000 personnes selon les estimations habituelles, vers la rivière et la pointe de la côte ouest que l’on appelle encore Bloody River et Bloody Point, et en tuèrent la plupart ; l’historien Vincent Hubbard évalue le nombre de morts à environ 2 000, dont beaucoup furent tués alors qu’ils tentaient de se rendre, tandis qu’une centaine de colons périrent également. Les survivants s’enfuirent dans les montagnes ; en 1640, ceux qui n’avaient pas été réduits en esclavage avaient été contraints de partir pour la Dominique. En 1627, Anglais et Français se partagèrent l’île. Des historiens comme Andreas Buser ont soutenu que ces tueries répondent à la définition du génocide ; Saint-Christophe-et-Niévès en a commémoré le 400e anniversaire à Challengers, au bord de la Bloody River, en août 2026.
