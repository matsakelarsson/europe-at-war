"Wars of the Kalmar Union": "Guerres de l’Union Kalmar"
"The wars over the Scandinavian thrones from the deposition of Magnus Eriksson in 1364 to the Stockholm Bloodbath of 1520. Queen Margaret united Denmark, Norway and Sweden in the Kalmar Union in 1397, but Swedish nobles, peasants and miners fought the union kings again and again.": "Les guerres sur les trônes scandinaves de la déposition de Magnus Eriksson en 1364 au bain de sang de Stockholm de 1520. La reine Margaret a uni le Danemark, la Norvège et la Suède dans l’Union Kalmar en 1397, mais les nobles, paysans et mineurs suédois ont combattu les rois d’union encore et encore."
"Medieval dates are as given in the chronicles.": "Les dates médiévales sont celles données dans les chroniques."
