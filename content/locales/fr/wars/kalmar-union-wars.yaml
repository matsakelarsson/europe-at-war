"1448–1471": "1448–1471"
"For decades Swedish nobles fought over whether to stay in the union. Karl Knutsson was elected king three times between 1448 and 1467, in between struggles with Christian I of Denmark. After Karl died, his nephew Sten Sture the Elder became regent, and in 1471 Christian sailed to Stockholm with an army to reclaim the Swedish crown.": "Pendant des décennies, les nobles suédois se sont battus pour savoir s’il fallait rester dans l’union. Karl Knutsson a été élu roi trois fois entre 1448 et 1467, entre les luttes avec Christian Ier du Danemark. Après la mort de Karl, son neveu Sten Sture the Elder est devenu régent, et en 1471 Christian a navigué à Stockholm avec une armée pour récupérer la couronne suédoise."
"On 10 October 1471 Sture’s army of peasants, miners and townsmen attacked Christian’s camp on the Brunkeberg ridge just north of the city, while the Stockholm garrison struck from inside. Christian was hit in the face and his army was routed. Sweden stayed in the union in name, but Sture ruled it in practice.": "Le 10 octobre 1471, l’armée de paysans, de mineurs et de citadins de Sture attaqua le camp de Christians sur la crête de Brunkeberg juste au nord de la ville, tandis que la garnison de Stockholm frappait de l’intérieur. Christian fut frappé au visage et son armée fut rouée."
