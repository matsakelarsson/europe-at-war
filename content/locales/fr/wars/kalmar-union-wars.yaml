"1517–1520": "1517–1520"
"Sten Sture the Younger, regent from 1512, fought off Christian II of Denmark twice, winning at Brännkyrka outside Stockholm in 1518. In January 1520 Christian came again with a large mercenary army. On the ice of Lake Åsunden near Bogesund on 19 January, a cannonball struck Sture in the leg. He died on 3 February, and resistance collapsed except in Stockholm, held by his widow Christina Gyllenstierna.": "Sten Sture the Younger, régent de 1512, s’est battu deux fois contre Christian II du Danemark, remportant à Brännkyrka en dehors de Stockholm en 1518. En janvier 1520, Christian est revenu avec une grande armée mercenaire. Sur la glace du lac Åsunden près de Bogesund le 19 janvier, un boulet frappe Sture dans la jambe. Il est mort le 3 février, et la résistance s’est effondrée sauf à Stockholm, tenue par sa veuve Christina Gyllenstierna."
"Stockholm surrendered that autumn in return for an amnesty, and Christian was crowned king. Days later, on 7–9 November 1520, he had more than 80 nobles, clergy and burghers of the Sture party executed in the Stockholm Bloodbath. Among the dead was the father of a young nobleman, Gustav Eriksson Vasa.": "Stockholm se rendit cet automne-là en échange d’une amnistie, et Christian fut couronné roi. Quelques jours plus tard, les 7-9 novembre 1520, il fit exécuter plus de 80 nobles, clergés et bourgeons du parti Sture dans le bain de sang de Stockholm. Parmi les morts, il y avait le père d’un jeune noble, Gustav Eriksson Vasa."
