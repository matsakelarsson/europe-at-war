"1364–1397": "1364–1397"
"In 1364 Swedish nobles deposed Magnus Eriksson and chose a German prince, Albert of Mecklenburg, as king. By the 1380s Albert had fallen out with the same nobles, and the Swedish council turned for help to Margaret, the widowed queen who already ruled Denmark and Norway.": "En 1364, des nobles suédois déposèrent Magnus Eriksson et choisirent comme roi un prince allemand, Albert de Mecklembourg. Vers les années 1380, Albert était tombé avec les mêmes nobles, et le conseil suédois se tourna vers Margaret, la reine veuve qui dirigeait déjà le Danemark et la Norvège."
"On 24 February 1389 Margaret’s army defeated Albert at Åsle near Falköping and captured him and his son. His German supporters held out in Stockholm, supplied by the Victual Brothers, until the Hanseatic League stepped in. Albert was released in 1395 and Stockholm passed to Margaret in 1398. In June 1397 her great-nephew Eric of Pomerania was crowned at Kalmar as king of all three kingdoms.": "Le 24 février 1389, l’armée de Margaret a vaincu Albert à Åsle près de Falköping et l’a capturé ainsi que son fils. Ses partisans allemands ont tenu à Stockholm, fourni par les Frères Victuels, jusqu’à ce que la Ligue hanséatique entre en jeu. Albert a été libéré en 1395 et Stockholm est passé à Margaret en 1398. En juin 1397 son grand-néphée Eric de Poméranie a été couronné à Kalmar comme roi des trois royaumes."
