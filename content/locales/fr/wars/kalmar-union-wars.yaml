"1434–1436": "1434–1436"
"Under Eric of Pomerania, Swedes complained of heavy taxes and harsh foreign bailiffs. In the summer of 1434 miners and peasants of Dalarna and Bergslagen rose under Engelbrekt Engelbrektsson, a mine owner from Norberg, and burned Borganäs castle.": "Sous Éric de Poméranie, les Suédois se plaignaient d’impôts lourds et de dures huissiers étrangers. L’été 1434 mineurs et paysans de Dalarna et Bergslagen se sont levés sous Engelbrekt Engelbrektsson, un propriétaire minier de Norberg, et ont brûlé le château de Borganäs."
"The revolt spread through Svealand and Götaland, castle after castle was attacked, and Engelbrekt was chosen captain of the realm. On 4 May 1436 he was murdered on an islet in Lake Hjälmaren by the nobleman Måns Bengtsson. The council chose Karl Knutsson as regent, and Eric was deposed a few years later.": "La révolte se répandit à travers Svealand et Götaland, château après l’attaque du château, et Engelbrekt fut choisi capitaine du royaume. Le 4 mai 1436, il fut assassiné sur un îlot dans le lac Hjälmaren par le noble Måns Bengtsson. Le conseil choisit Karl Knutsson comme régent, et Eric fut déposé quelques années plus tard."
