"Christian IV of Denmark–Norway declared war in 1611, partly over Charles IX’s claims to the far north of Norway. The Danes besieged and took Kalmar that summer, and Charles IX died in October, leaving the throne to his 16-year-old son Gustav II Adolf.": "Christian IV du Danemark-Norvège a déclaré la guerre en 1611, en partie au-dessus des revendications de Charles IX. Les Danois ont assiégé et pris Kalmar cet été-là, et Charles IX est mort en octobre, laissant le trône à son fils de 16 ans Gustav II Adolf."
"In 1612 the Danes held the sea, took Öland and in May captured Älvsborg and Gullberg, cutting Sweden off from the west coast again. The young king raided Danish Scania and narrowly escaped at Vittsjö. At Knäred on 20 January 1613, Sweden had to agree to a ransom of one million riksdaler to get Älvsborg back, a sum that took six years to pay.": "En 1612 les Danois tenaient la mer, prirent Öland et, en mai, capturèrent Älvsborg et Gullberg, coupant à nouveau la Suède de la côte ouest. À Knäred le 20 janvier 1613, la Suède a dû accepter une rançon d’un million de rksdaler pour récupérer Älvsborg, somme qui a pris six ans à payer."
