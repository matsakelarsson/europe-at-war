"Kalmar War": "Guerre de Kalmar"
"A war between Denmark–Norway and Sweden, begun by Christian IV partly over Swedish claims to the far north of Norway. The Danes took Kalmar and Älvsborg, and by the Peace of Knäred in 1613 Sweden had to pay one million riksdaler to get Älvsborg back.": "Une guerre entre le Danemark et la Norvège et la Suède, commencée par Christian IV en partie sur les revendications suédoises à l’extrême nord de la Norvège. Les Danois ont pris Kalmar et Älvsborg, et par la paix de Knäred en 1613 la Suède a dû payer un million de riksdaler pour obtenir Älvsborg retour."
"Dates in Germany and Poland are New Style (Gregorian); Scandinavian dates are mostly Old Style (Julian), as usually cited, which ran ten days behind.": "Les dates en Allemagne et en Pologne sont New Style (Gregorian) ; les dates scandinaves sont pour la plupart Old Style (Julian), comme on le cite habituellement, qui a duré dix jours."
"Migrated from Sweden at War, so the story is told from Sweden’s side.": "Migré de Suède à la guerre, l’histoire est donc racontée du côté suédois."
