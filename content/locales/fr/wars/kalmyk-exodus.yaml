# French translations of the catalogue text (wave 9); step bodies follow later.
Kalmyk (Torghut) exodus: Exode des Kalmouks (Torghouts)
? The flight of most of the Kalmyks of the lower Volga, led by Ubashi Khan, across the Kazakh steppe to Dzungaria, then under the Qing. The Kalmyks, Oirat Mongols who had come to the Volga in the 1630s, saw their pastures taken by Russian and German settlers and Cossack lines, their khan’s power curbed by a council the Russian government imposed, their horsemen called up for Russia’s wars and their people pressed to convert to Orthodoxy. With the blessing of the Dalai Lama, who chose the date, the uluses on the left (eastern) bank of the Volga set out in January 1771; the ice on the Volga was too weak for those on the right bank, mostly Dörbets, to cross, and they stayed in Russia. Estimates of the number who left range from about 140,000 to 200,000 people, with millions of animals. They crossed the Ural, where they killed Cossacks at Vetlyaninskaya, and were harried across the steppe by Kazakhs of the Junior Zhuz under Nurali Khan and later by Ablai Khan’s men, while a Russian corps under Traubenberg set out from Orsk and gave up the pursuit. Fighting, cold, thirst and hunger killed tens of thousands; estimates of those who reached the Ili valley in July 1771 range from about 70,000–85,000 to, in some Kazakh accounts, only 15,000–20,000. The Qianlong emperor received them as subjects, gave Ubashi the title of khan and settled the Torghuts in separate banners across Dzungaria. In October 1771 Catherine II abolished the Kalmyk Khanate; the Kalmyks who remained on the Volga came under the governor of Astrakhan.
: La fuite de la plupart des Kalmouks de la basse Volga, conduits par Oubachi Khan, à travers la steppe kazakhe jusqu’en Dzoungarie, alors sous domination Qing. Les Kalmouks, Mongols oïrats arrivés sur la Volga dans les années 1630, voyaient leurs pâturages pris par des colons russes et allemands et par les lignes cosaques, le pouvoir de leur khan bridé par un conseil que le gouvernement russe avait imposé, leurs cavaliers appelés pour les guerres de la Russie et leur peuple poussé à se convertir à l’orthodoxie. Avec la bénédiction du dalaï-lama, qui en choisit la date, les oulous de la rive gauche (orientale) de la Volga se mirent en route en janvier 1771 ; la glace de la Volga était trop mince pour que ceux de la rive droite, pour la plupart des Dörbet, puissent traverser, et ils restèrent en Russie. Les estimations du nombre de partants vont d’environ 140 000 à 200 000 personnes, avec des millions de bêtes. Ils franchirent le fleuve Oural, où ils tuèrent des Cosaques à Vetlianinskaïa, et furent harcelés à travers la steppe par les Kazakhs du Petit Jüz de Nurali Khan, puis par les hommes d’Ablai Khan, tandis qu’un corps russe commandé par Traubenberg partait d’Orsk avant de renoncer à la poursuite. Les combats, le froid, la soif et la faim firent des dizaines de milliers de morts ; les estimations du nombre de ceux qui atteignirent la vallée de l’Ili en juillet 1771 vont d’environ 70 000–85 000 à, selon certains récits kazakhs, 15 000–20 000 seulement. L’empereur Qianlong les reçut comme sujets, donna à Oubachi le titre de khan et installa les Torghouts dans des bannières distinctes à travers la Dzoungarie. En octobre 1771, Catherine II abolit le khanat kalmouk ; les Kalmouks restés sur la Volga passèrent sous l’autorité du gouverneur d’Astrakhan.
