# French translations of the catalogue text (wave 13); step bodies follow later.
Kamerun campaign: Campagne du Kamerun
? The British, French and Belgian conquest of the German colony of Kamerun in the First World War, a campaign of 18 months fought across forest, mountains and savanna by African soldiers under European officers and tens of thousands of African carriers. The French attacked from Equatorial Africa and Chad on 6 August 1914 and British columns from Nigeria on 25 August, but the Germans beat the British at Garua and Nsanakang and held the mountain of Mora. An Allied squadron took the port of Duala on 27 September 1914, and the Allies occupied the coast and the railways. In 1915 the British took Garua and Ngaoundéré in the north, while the Germans, who had raised their force to about 6,000 men, held the forested hills around their new capital at Yaoundé and threw back the first advance on it. French and Belgian columns overran the eastern lands Germany had gained from France in 1911. The converging advance of late 1915 took Yaoundé on 1 January 1916, and in January and February the German troops, officials and thousands of Cameroonians crossed into neutral Spanish Guinea, where they were interned. The last German garrison, on Mora, surrendered on 18 February 1916. Britain and France divided the colony, and in 1922 it became the League of Nations mandates of British and French Cameroons.
: La conquête britannique, française et belge de la colonie allemande du Kamerun pendant la Première Guerre mondiale, une campagne de 18 mois menée à travers forêts, montagnes et savanes par des soldats africains encadrés par des officiers européens et par des dizaines de milliers de porteurs africains. Les Français attaquèrent depuis l’Afrique-Équatoriale française et le Tchad le 6 août 1914 et des colonnes britanniques depuis le Nigeria le 25 août, mais les Allemands battirent les Britanniques à Garoua et à Nsanakang et tinrent la montagne de Mora. Une escadre alliée prit le port de Douala le 27 septembre 1914, et les Alliés occupèrent la côte et les voies ferrées. En 1915, les Britanniques prirent Garoua et Ngaoundéré dans le nord, tandis que les Allemands, qui avaient porté leurs effectifs à environ 6 000 hommes, tenaient les collines boisées entourant leur nouvelle capitale, Yaoundé, et repoussèrent une première offensive contre elle. Des colonnes françaises et belges envahirent les territoires de l’est que l’Allemagne avait obtenus de la France en 1911. L’offensive convergente de la fin de 1915 prit Yaoundé le 1er janvier 1916, et en janvier et février les troupes et les fonctionnaires allemands, ainsi que des milliers de Camerounais, passèrent en Guinée espagnole, neutre, où ils furent internés. La dernière garnison allemande, celle de Mora, se rendit le 18 février 1916. La Grande-Bretagne et la France se partagèrent la colonie, qui devint en 1922 les mandats de la Société des Nations du Cameroun britannique et du Cameroun français.
