# French translations of the catalogue text (wave 8); step bodies follow later.
Kandyan–Dutch war: Guerre entre Kandy et les Néerlandais
? The war between the Kingdom of Kandy, in the highlands of Sri Lanka, and the Dutch East India Company, which held the island’s coasts. In 1760–1761 a great rising broke out in the Dutch-ruled lowlands, and in 1761 King Kirti Sri Rajasinha’s forces came down to support it, overrunning Matara and Hanwella and destroying Dutch forts in the south. The new governor, Lubbert Jan van Eck, retook them in 1762 and Puttalam and Chilaw in 1763. A first Dutch expedition against Kandy in 1764 was turned back by bad weather and roads, but a second, of some 7,000 to 8,000 men, took the abandoned capital in February 1765 and plundered the palace. The Kandyans fought on from the hills, attacking supply lines while disease weakened the Dutch, until the king, his kingdom close to starvation, accepted the Treaty of Batticaloa (Hanguranketha) on 14 February 1766. Kandy recognised Dutch sovereignty over the whole coastline to a depth of about four miles inland, lost its access to the sea and allowed the Dutch to peel cinnamon in its forests. The Dutch held these lands until the British took them in 1795–1796.
: La guerre entre le royaume de Kandy, dans les hautes terres du Sri Lanka, et la Compagnie néerlandaise des Indes orientales, qui tenait les côtes de l’île. En 1760–1761, un grand soulèvement éclata dans les basses terres sous domination néerlandaise, et en 1761 les forces du roi Kirti Sri Rajasinha descendirent le soutenir, s’emparant de Matara et de Hanwella et détruisant des forts néerlandais dans le sud. Le nouveau gouverneur, Lubbert Jan van Eck, les reprit en 1762, puis Puttalam et Chilaw en 1763. Une première expédition néerlandaise contre Kandy, en 1764, dut rebrousser chemin à cause du mauvais temps et de l’état des routes, mais une seconde, forte de quelque 7 000 à 8 000 hommes, prit la capitale abandonnée en février 1765 et pilla le palais. Les Kandyens poursuivirent la lutte depuis les collines, attaquant les lignes de ravitaillement tandis que la maladie affaiblissait les Néerlandais, jusqu’à ce que le roi, dont le royaume était au bord de la famine, accepte le traité de Batticaloa (Hanguranketha) le 14 février 1766. Kandy reconnut la souveraineté néerlandaise sur tout le littoral jusqu’à environ quatre milles à l’intérieur des terres, perdit son accès à la mer et autorisa les Néerlandais à écorcer les cannelliers dans ses forêts. Les Néerlandais conservèrent ces terres jusqu’à ce que les Britanniques s’en emparent en 1795–1796.
