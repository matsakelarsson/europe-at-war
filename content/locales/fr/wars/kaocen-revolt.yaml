# French translations of the catalogue text (wave 12); step bodies follow later.
Kaocen revolt: Révolte de Kaocen
? A Tuareg rising against French rule in the Aïr mountains of northern Niger in 1916–1917, during the First World War, led by Kaocen ag Mohammed (Kawsen), a noble of the Ikazkazan of the Kel Owey confederation and a follower of the Senussi order, which had declared a holy war against the French in October 1914. Many Tuareg had fought the French since the 1890s; others were driven to revolt by the drought of 1911–1914, by French taxes and the seizure of camels, and by the end of the slave trade and the revolt of the settled peoples who had paid them tribute. In the west, the Iwellemmeden Kel Ataram of the Ménaka region under their amenokal Fihirun (Firhoun) rose in 1914–1916 and were crushed with the help of the Kel Adagh. In December 1916 Kaocen, with more than 1,000 fighters, repeating rifles and a cannon taken from the Italians in Libya, laid siege to the French garrison of Agadez with the help of the sultan of Aïr, Tegama, defeated French relief columns and took the towns of the Aïr. A large French force from Zinder relieved Agadez on 3 March 1917 and retook the towns, with heavy reprisals; Kaocen withdrew north and was hanged by local forces at Murzuq in Libya in 1919. Tuareg remember the rising as part of a longer struggle against colonial rule and for self-government.
: Un soulèvement touareg contre la domination française dans les montagnes de l’Aïr, dans le nord du Niger, en 1916–1917, pendant la Première Guerre mondiale, mené par Kaocen ag Mohammed (Kawsen), noble des Ikazkazan de la confédération des Kel Owey et adepte de la confrérie senoussie, qui avait proclamé la guerre sainte contre les Français en octobre 1914. Beaucoup de Touareg combattaient les Français depuis les années 1890 ; d’autres furent poussés à la révolte par la sécheresse de 1911–1914, par les impôts français et la saisie des chameaux, ainsi que par la fin de la traite des esclaves et la révolte des populations sédentaires qui leur payaient tribut. À l’ouest, les Iwellemmeden Kel Ataram de la région de Ménaka, conduits par leur amenokal Fihirun (Firhoun), se soulevèrent en 1914–1916 et furent écrasés avec l’aide des Kel Adagh. En décembre 1916, Kaocen, avec plus de 1 000 combattants, des fusils à répétition et un canon pris aux Italiens en Libye, assiégea la garnison française d’Agadez avec l’aide du sultan de l’Aïr, Tegama, battit les colonnes françaises de secours et prit les villes de l’Aïr. Une importante force française venue de Zinder dégagea Agadez le 3 mars 1917 et reprit les villes, en exerçant de lourdes représailles ; Kaocen se retira vers le nord et fut pendu par des forces locales à Mourzouk, en Libye, en 1919. Les Touareg se souviennent de ce soulèvement comme d’un épisode d’une lutte plus longue contre la domination coloniale et pour l’autonomie.
