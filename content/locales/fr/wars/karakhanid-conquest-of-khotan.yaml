# French translations of the catalogue text (wave 9); step bodies follow later.
Kara-Khanid conquest of Khotan: Conquête de Khotan par les Karakhanides
The long war between the Muslim Turkic Karakhanids of Kashgar and the Buddhist kingdom of Khotan, the last independent state of the old Iranian-speaking oasis peoples of the Tarim Basin. After the Karakhanid prince Satuq Bughra Khan converted to Islam in 934 and took Kashgar, he and his son Musa pressed on Khotan, and a war of raids and sieges followed between the two oases, some 500 km apart along the southern edge of the Taklamakan. Khotan, allied by marriage with the Cao rulers of Dunhuang and in contact with the Song court, took Kashgar for a time in about 970 and in 971 offered the Song emperor a dancing elephant captured there. The Karakhanids recovered, and sometime before or in 1006 Yusuf Qadir Khan of Kashgar conquered Khotan. The conquest ended Buddhism in Khotan and with it a thousand years of the kingdom’s history, and the western Tarim Basin became Turkic-speaking and Muslim. Much of what is known of the war comes from later Muslim legends and from Mahmud al-Kashgari’s dictionary of the 1070s.: La longue guerre entre les Karakhanides de Kachgar, Turcs musulmans, et le royaume bouddhiste de Khotan, dernier État indépendant des anciens peuples iranophones des oasis du bassin du Tarim. Après que le prince karakhanide Satuq Bughra Khan se fut converti à l’islam en 934 et eut pris Kachgar, lui et son fils Musa firent pression sur Khotan, et une guerre de raids et de sièges s’ensuivit entre les deux oasis, distantes d’environ 500 km le long de la bordure sud du Taklamakan. Khotan, alliée par mariage aux Cao, souverains de Dunhuang, et en contact avec la cour des Song, prit un temps Kachgar vers 970 et offrit en 971 à l’empereur Song un éléphant dansant capturé là-bas. Les Karakhanides se ressaisirent, et Yusuf Qadir Khan de Kachgar conquit Khotan au plus tard en 1006. La conquête mit fin au bouddhisme à Khotan, et avec lui à mille ans d’histoire du royaume, et l’ouest du bassin du Tarim devint turcophone et musulman. Une grande partie de ce que l’on sait de cette guerre provient de légendes musulmanes postérieures et du dictionnaire de Mahmoud al-Kachgari, des années 1070.
