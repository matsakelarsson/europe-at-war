# French translations of the catalogue text (wave 8); step bodies follow later.
Kargil War: Guerre de Kargil
A war between India and Pakistan in the Kargil district of Ladakh, then part of the Indian state of Jammu and Kashmir, the first fought between two nuclear-armed states. Over the winter of 1998–1999 Pakistani soldiers of the Northern Light Infantry, presented by Pakistan at first as Kashmiri fighters, crossed the Line of Control and occupied heights overlooking the Srinagar–Leh road. After the intrusion was discovered in May 1999, India drove them back in costly mountain assaults supported by air strikes, retaking Tololing, Tiger Hill and most other positions. Under American and international pressure Prime Minister Nawaz Sharif agreed on 4 July to withdraw, and India declared its operation complete on 26 July. India put its dead at 527 and Pakistan at 453; other estimates of Pakistan’s losses are higher. The war contributed to the military coup that overthrew Sharif in October 1999.: Une guerre entre l’Inde et le Pakistan dans le district de Kargil, au Ladakh, qui faisait alors partie de l’État indien du Jammu-et-Cachemire, et la première livrée entre deux puissances nucléaires. Au cours de l’hiver 1998–1999, des soldats pakistanais de la Northern Light Infantry, que le Pakistan présenta d’abord comme des combattants cachemiris, franchirent la ligne de contrôle et occupèrent des hauteurs dominant la route Srinagar–Leh. Après la découverte de l’infiltration en mai 1999, l’Inde les repoussa par de coûteux assauts en montagne appuyés par des frappes aériennes, reprenant Tololing, Tiger Hill et la plupart des autres positions. Sous la pression américaine et internationale, le Premier ministre Nawaz Sharif accepta le 4 juillet de se retirer, et l’Inde déclara son opération achevée le 26 juillet. L’Inde chiffra ses morts à 527, et le Pakistan les siens à 453 ; d’autres estimations des pertes pakistanaises sont plus élevées. La guerre contribua au coup d’État militaire qui renversa Sharif en octobre 1999.
