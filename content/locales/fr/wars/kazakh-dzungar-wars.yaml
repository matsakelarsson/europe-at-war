# French translations of the catalogue text (wave 9); step bodies follow later.
Kazakh–Dzungar wars: Guerres kazakho-dzoungares
? A century of wars between the Kazakh Khanate and the Dzungar Khanate, the last great Oirat (western Mongol) steppe empire, for the pastures of Zhetysu (Semirechye) and the towns of the middle Syr Darya. The Dzungars, better organised and with firearms of their own, won most of the campaigns, though the Kazakhs held them at the gorge of Orbulaq in 1643. Galdan took Sayram and Tashkent in the 1680s, Tsewang Rabtan defeated the Senior Zhuz on the Chu and Talas in 1698, and in 1723 a sudden Dzungar invasion took Turkestan, Tashkent and Sayram and drove many Kazakh clans from their lands in what Kazakhs remember as the Aqtaban Shubyryndy, the “barefoot flight”. A united Kazakh militia under Abulkhair won battles at Bulanty and Anyrakay in 1727–1730, but rivalry among the khans ended the alliance. Abulkhair’s Junior Zhuz swore allegiance to Russia in 1731, the Senior Zhuz paid tribute to the Dzungars, and Galdan Tseren’s armies invaded the Middle Zhuz again in 1739–1742. The wars ended when the Dzungar Khanate fell apart after 1745 and was destroyed by the Qing in 1755–1758; the Kazakh sultan Ablai, after supporting rival Dzungar princes, came to terms with the Qing in 1757, and Kazakh clans moved into the emptied pastures.
: Un siècle de guerres entre le khanat kazakh et le khanat dzoungar, dernier grand empire oïrat (mongol occidental) des steppes, pour les pâturages du Zhetysu (Semiretchie) et les villes du cours moyen du Syr-Daria. Les Dzoungars, mieux organisés et dotés de leurs propres armes à feu, remportèrent la plupart des campagnes, même si les Kazakhs les arrêtèrent dans la gorge d’Orbulaq en 1643. Galdan prit Sayram et Tachkent dans les années 1680, Tsewang Rabtan battit le Grand Jüz sur le Tchou et le Talas en 1698 et, en 1723, une invasion dzoungare soudaine s’empara de la ville de Turkestan, de Tachkent et de Sayram et chassa de nombreux clans kazakhs de leurs terres, épisode dont les Kazakhs gardent la mémoire sous le nom d’Aqtaban Shubyryndy, la « fuite aux pieds nus ». Une milice kazakhe unie sous Abulkhair remporta des batailles à Bulanty et à Anyrakay en 1727–1730, mais les rivalités entre les khans mirent fin à l’alliance. Le Petit Jüz d’Abulkhair prêta allégeance à la Russie en 1731, le Grand Jüz paya tribut aux Dzoungars, et les armées de Galdan Tseren envahirent de nouveau le Moyen Jüz en 1739–1742. Les guerres prirent fin lorsque le khanat dzoungar se désagrégea après 1745 et fut détruit par les Qing en 1755–1758 ; le sultan kazakh Ablai, après avoir soutenu des princes dzoungars rivaux, s’entendit avec les Qing en 1757, et des clans kazakhs s’installèrent dans les pâturages vidés de leurs occupants.
