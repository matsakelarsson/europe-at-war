# French translations of the catalogue text (wave 9); step bodies follow later.
2022 Kazakh unrest: Troubles de 2022 au Kazakhstan
? "Nationwide protests and riots in Kazakhstan in January 2022, known there as the January events or “Bloody January” (Qandy Qañtar). They began on 2 January in the oil town of Zhanaozen in Mangystau, after the lifting of a price cap nearly doubled the price of liquefied gas used to fuel cars, and spread within days to most cities, with demands that widened to direct elections of governors and the departure of the former president Nursultan Nazarbayev, who still chaired the Security Council. On 4–5 January protests in Almaty turned violent: the city hall and offices of the ruling Nur Otan party were set on fire, the airport was seized for a time and weapons were taken from police and security buildings. President Kassym-Jomart Tokayev dismissed the government, took over the Security Council from Nazarbayev, declared a state of emergency and asked the Russian-led Collective Security Treaty Organization (CSTO) for help; about 2,000 troops from Russia, Belarus, Armenia, Kyrgyzstan and Tajikistan arrived from 6 January to guard strategic sites. On 7 January Tokayev said he had ordered the security forces to “shoot to kill without warning” and called the rioters “terrorists” and “bandits”; he later described the events as an attempted coup. Official death tolls rose from 225 in mid-January to between 232 and 238 in later counts, 19 of them security personnel; more than 9,900 people were detained, and hundreds said they had been beaten or tortured in custody. The CSTO troops left by 19 January, when the state of emergency ended. The former head of the National Security Committee, Karim Massimov, was later convicted of treason and attempting to seize power; Human Rights Watch and others criticised the lack of an independent investigation into the killings."
: "Des manifestations et des émeutes dans tout le Kazakhstan en janvier 2022, appelées dans le pays les événements de janvier ou « Janvier sanglant » (Qandy Qañtar). Elles commencèrent le 2 janvier dans la ville pétrolière de Janaozen, dans le Manguistaou, après que la levée d’un plafonnement des prix eut presque doublé le prix du gaz liquéfié utilisé comme carburant automobile, et s’étendirent en quelques jours à la plupart des villes, avec des revendications élargies à l’élection directe des gouverneurs et au départ de l’ancien président Noursoultan Nazarbaïev, qui présidait toujours le Conseil de sécurité. Les 4 et 5 janvier, les manifestations à Almaty tournèrent à la violence : l’hôtel de ville et des bureaux du parti au pouvoir, Nur Otan, furent incendiés, l’aéroport fut occupé un temps et des armes furent prises dans des bâtiments de la police et des services de sécurité. Le président Kassym-Jomart Tokaïev limogea le gouvernement, reprit à Nazarbaïev la présidence du Conseil de sécurité, décréta l’état d’urgence et demanda l’aide de l’Organisation du traité de sécurité collective (OTSC), dirigée par la Russie ; environ 2 000 soldats venus de Russie, de Biélorussie, d’Arménie, du Kirghizistan et du Tadjikistan arrivèrent à partir du 6 janvier pour garder des sites stratégiques. Le 7 janvier, Tokaïev déclara avoir ordonné aux forces de sécurité de « tirer pour tuer sans sommation » et qualifia les émeutiers de « terroristes » et de « bandits » ; il décrivit plus tard les événements comme une tentative de coup d’État. Les bilans officiels passèrent de 225 morts à la mi-janvier à un chiffre compris entre 232 et 238 dans des décomptes ultérieurs, dont 19 membres des forces de sécurité ; plus de 9 900 personnes furent arrêtées, et des centaines déclarèrent avoir été battues ou torturées en détention. Les troupes de l’OTSC étaient reparties le 19 janvier, date de la fin de l’état d’urgence. L’ancien chef du Comité de sécurité nationale, Karim Massimov, fut ensuite condamné pour trahison et tentative de prise du pouvoir ; Human Rights Watch et d’autres organisations critiquèrent l’absence d’enquête indépendante sur les tueries."
