# French translations of the catalogue text (wave 9); step bodies follow later.
Kazakh–Uzbek wars: Guerres entre Kazakhs et Ouzbeks
? The wars between the Kazakh sultans Kerei and Janibek and their successors and the Uzbek descendants of Abu’l-Khayr Khan, in which the Kazakh Khanate was founded and took the steppe north of the Syr Darya. In 1457 or soon after, Kerei and Janibek, Jochid princes of a rival line, left Abu’l-Khayr’s Uzbek Khanate with their followers and settled in the Chu and Talas valleys with the permission of the khan of Moghulistan; the Kazakh Khanate is usually dated from about 1465. When Abu’l-Khayr died on a campaign against them in 1468, his realm broke up and many of his people joined the Kazakhs. His grandson Muhammad Shaybani fought the Kazakh khans Burunduk and Kasym for the towns of the middle Syr Darya (Sighnaq, Sauran, Otrar, Yasi) for three decades, then turned south and conquered Mawarannahr in 1500–1507. His last campaign against the Kazakhs failed in the winter of 1509–1510, months before he was killed fighting the Safavids at Merv, and under Kasym Khan the Kazakh Khanate became the leading power of the steppe.
: Les guerres entre les sultans kazakhs Kereï et Janibek, puis leurs successeurs, et les descendants ouzbeks d’Abu’l-Khayr Khan, au cours desquelles fut fondé le khanat kazakh, qui prit la steppe au nord du Syr-Daria. En 1457 ou peu après, Kereï et Janibek, princes djötchides d’une lignée rivale, quittèrent le khanat ouzbek d’Abu’l-Khayr avec leurs partisans et s’établirent dans les vallées du Tchou et du Talas avec la permission du khan du Moghulistan ; on date habituellement le khanat kazakh de 1465 environ. Lorsqu’Abu’l-Khayr mourut en 1468 au cours d’une campagne contre eux, son royaume se disloqua et beaucoup de ses gens rejoignirent les Kazakhs. Son petit-fils Muhammad Chaybani disputa pendant trois décennies aux khans kazakhs Burunduk et Kasym les villes du moyen Syr-Daria (Sighnaq, Sauran, Otrar, Yasi), puis se tourna vers le sud et conquit le Mawarannahr en 1500–1507. Sa dernière campagne contre les Kazakhs échoua au cours de l’hiver 1509–1510, quelques mois avant qu’il ne soit tué en combattant les Safavides à Merv, et sous Kasym Khan le khanat kazakh devint la principale puissance de la steppe.
