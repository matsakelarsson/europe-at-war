# French translations of the catalogue text (wave 9); step bodies follow later.
Kenesary’s rebellion: Rébellion de Kenesary
The longest Kazakh rising against Russian rule, led by Kenesary Kasymov (Kenesary Kasymuly), a grandson of Ablai Khan, against the district administration that had replaced the khans of the Middle Zhuz in 1822 and against the Khanate of Kokand in the south. Kenesary burned the Russian fortress of Akmola in 1838, and in 1841 an assembly of the three zhuzes elected him khan. For a few years he ruled much of the central steppe, fought Kokand for the towns of the Syr Darya and the Karatau, and eluded the Russian columns and loyal Kazakh sultans sent against him; at its height his army numbered about 20,000. Pushed south-east by new forts and by sultans who went over to Russia, he invaded the lands of the northern Kyrgyz in 1847, was defeated by Ormon Khan near Tokmok, captured and put to death. His death opened Semirechye to the Russian advance. In Kazakhstan he is honoured as the last khan of the Kazakhs; in Kyrgyz tradition his invasion is remembered for the burning of auls and Ormon’s victory over him.: Le plus long soulèvement kazakh contre la domination russe, mené par Kenesary Kasymov (Kenesary Kasymuly), petit-fils d’Ablai Khan, contre l’administration de district qui avait remplacé les khans du Moyen Jüz en 1822 et contre le khanat de Kokand au sud. Kenesary incendia la forteresse russe d’Akmola en 1838 et, en 1841, une assemblée des trois jüz l’élut khan. Pendant quelques années, il gouverna une grande partie de la steppe centrale, disputa à Kokand les villes du Syr-Daria et le Karataou, et échappa aux colonnes russes et aux sultans kazakhs loyalistes envoyés contre lui ; à son apogée, son armée comptait environ 20 000 hommes. Repoussé vers le sud-est par de nouveaux forts et par des sultans passés à la Russie, il envahit les terres des Kirghiz du Nord en 1847, fut battu par Ormon Khan près de Tokmok, capturé et mis à mort. Sa mort ouvrit la Semiretchie à l’avancée russe. Au Kazakhstan, il est honoré comme le dernier khan des Kazakhs ; dans la tradition kirghize, son invasion est restée dans les mémoires pour les aouls incendiés et pour la victoire d’Ormon sur lui.
