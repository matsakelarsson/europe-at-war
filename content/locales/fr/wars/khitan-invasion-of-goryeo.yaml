# French translations of the catalogue text (wave 10); step bodies follow later.
Khitan invasion of Goryeo: Invasion khitane du Goryeo
? The invasion of Goryeo by Khitans fleeing the Mongols, which ended in Goryeo’s first alliance with the Mongol Empire. After the Khitan prince Yelü Liuge rebelled against the Jin in Manchuria in 1211 and allied himself with Genghis Khan, his brother Yelü Sibu and other Khitan leaders broke away and set up a rival Liao state (Later Liao). Driven out of Liaodong by the Mongols and by Yelü Liuge, these Khitans, led by the princes Jinshan and Jinshi, crossed the Yalu into Goryeo in the eighth month of 1216, an estimated 90,000 people. They plundered the north-west and in 1217 raided deep into the centre of the country, until defeats at the hands of Kim Chwi-ryeo and other generals drove them back north. In the winter of 1218, 10,000 Mongol troops under Hajin and Jala, with 20,000 Jurchens of Eastern Xia under Wanyan Ziyuan, entered Goryeo from the north-east in pursuit, and the remaining Khitans shut themselves up in the fortress of Gangdong, east of Pyongyang. Snow cut the Mongols’ supplies, and the Goryeo commander of the north-west, Jo Chung, sent them 1,000 sacks of rice and then troops under Kim Chwi-ryeo. Early in 1219 the Khitan leader Hamsa hanged himself and about 50,000 Khitans surrendered. Hajin and Jo Chung swore an oath of brotherhood between the Mongols and Goryeo, which was soon followed by heavy Mongol demands for tribute.
: L’invasion du Goryeo par des Khitans fuyant les Mongols, qui aboutit à la première alliance du Goryeo avec l’Empire mongol. Après que le prince khitan Yelü Liuge se fut révolté contre les Jin en Mandchourie en 1211 et allié à Gengis Khan, son frère Yelü Sibu et d’autres chefs khitans firent sécession et fondèrent un État Liao rival (les Liao postérieurs). Chassés du Liaodong par les Mongols et par Yelü Liuge, ces Khitans, menés par les princes Jinshan et Jinshi, franchirent le Yalu et entrèrent au Goryeo au huitième mois de 1216, au nombre estimé de 90 000 personnes. Ils pillèrent le nord-ouest et, en 1217, lancèrent des raids jusqu’au centre du pays, avant que des défaites infligées par Kim Chwi-ryeo et d’autres généraux ne les repoussent vers le nord. Durant l’hiver 1218, 10 000 soldats mongols commandés par Hajin et Jala, avec 20 000 Jurchen du Xia oriental sous les ordres de Wanyan Ziyuan, entrèrent au Goryeo par le nord-est à leur poursuite, et les Khitans restants s’enfermèrent dans la forteresse de Gangdong, à l’est de Pyongyang. La neige coupa le ravitaillement des Mongols, et le commandant du Goryeo pour le nord-ouest, Jo Chung, leur envoya 1 000 sacs de riz, puis des troupes commandées par Kim Chwi-ryeo. Au début de 1219, le chef khitan Hamsa se pendit et environ 50 000 Khitans se rendirent. Hajin et Jo Chung prêtèrent un serment de fraternité entre les Mongols et le Goryeo, bientôt suivi de lourdes exigences de tribut de la part des Mongols.
