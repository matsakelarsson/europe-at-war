"War resumed in 1651. From 28 June the Commonwealth army, led by the king, fought Khmelnytsky and the khan at Berestechko in Volhynia, one of the largest battles of 17th-century Europe. On 30 June the Tatars fled, taking Khmelnytsky with them as a virtual prisoner. The leaderless Cossacks held a fortified camp beside the marshes for ten days; when Ivan Bohun led a breakout on 10 July the peasants panicked, and thousands were killed or drowned. That summer a Lithuanian army took Kyiv.": "La guerre reprit en 1651. À partir du 28 juin, l’armée du Commonwealth, dirigée par le roi, combattit Khmelnytsky et le khan à Berestéchko en Volhynie, une des plus grandes batailles de l’Europe du XVIIe siècle. Les Cosaques sans chef tenaient un camp fortifié près des marais pendant dix jours ; quand Ivan Bohun a mené une cassure le 10 juillet, les paysans ont paniqué, et des milliers ont été tués ou noyés."
"The Treaty of Bila Tserkva in September cut the register to 20,000 and Cossack rule to the Kyiv voivodeship, but the Sejm never ratified it. In June 1652, at Batih in Podolia, Cossacks and Tatars overran the army of Hetman Kalinowski, who was killed. On Khmelnytsky’s orders thousands of Polish prisoners, many of them bought from the Tatars, were then killed. A royal campaign in 1653 ended inconclusively at Zhvanets when the khan again made a separate peace.": "Le traité de Bila Tserkva en septembre coupa le registre à 20 000 et la règle de Cosaque à la voïvodie de Kiev, mais le Sejm ne l’avait jamais ratifié. En juin 1652, à Batih à Podolia, Cosaques et Tatars ont envahi l’armée d’Hetman Kalinowski, qui a été tué. Sur Khmelnytsky, les ordres de milliers de prisonniers polonais, dont beaucoup ont été achetés aux Tatars, furent alors tués. Une campagne royale en 1653 se termina inconcevablement à Zhvanets lorsque le khan fit de nouveau une paix séparée."
