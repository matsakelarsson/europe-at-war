"January – May 1648": "janvier – mai 1648"
"In the Dnieper lands of Poland–Lithuania, Orthodox Ruthenian peasants worked the estates of mostly Catholic, Polish or Polonised magnates, often under Jewish leaseholders who collected the dues. The Cossacks, frontier soldiers who had risen several times, were bitter that only a few thousand of them were recognised as registered, paid soldiers. Bohdan Khmelnytsky, a Cossack officer whose estate at Subotiv had been seized by a local Polish official, could get no redress, and in January 1648 he fled to the Zaporozhian Sich.": "Dans les terres de Dniepr en Pologne-Lituanie, les paysans orthodoxes ruthéniens travaillaient les domaines des magnats pour la plupart catholiques, polonais ou polonisés, souvent sous les baux juifs qui recueillaient les cotisations. Les cosaques, soldats frontaliers qui s’étaient levés plusieurs fois, étaient amers que seulement quelques milliers d’entre eux soient reconnus comme des soldats enregistrés et payés. Bohdan Khmelnytsky, un officier cosaque dont la succession à Subotiv avait été saisie par un fonctionnaire polonais local, ne pouvait obtenir aucune réparation, et en janvier 1648 il s’enfuit dans le Sich Zaporozhian."
"Elected hetman, he won an alliance with the Crimean khan İslam III Giray. At Zhovti Vody in May the registered Cossacks sent against him changed sides, and the Polish vanguard under Stefan Potocki was destroyed on 16 May. On 26 May, at Korsun, Cossacks and Tatars ambushed the main Crown army; both its hetmans, Mikołaj Potocki and Marcin Kalinowski, were captured and handed over to the Tatars. King Władysław IV had died six days earlier, and the Commonwealth was left without a king or an army in Ukraine.": "Élu hetman, il a gagné une alliance avec la Crimée khan İslam III Giray. À Zhovti Vody en mai les cosaques enregistrés envoyés contre lui ont changé de camp, et l’avant-garde polonaise sous Stefan Potocki a été détruit le 16 mai. Le 26 mai, à Korsun, les Cosaques et les Tatars s’emparèrent de l’armée principale de la Couronne ; ses hetmans, Mikołaj Potocki et Marcin Kalinowski, furent capturés et remis aux Tatars. Le roi Władysław IV était mort six jours plus tôt, et le Commonwealth fut laissé sans roi ni armée en Ukraine."
