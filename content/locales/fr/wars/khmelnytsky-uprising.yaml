"Zbarazh and Zboriv": "Zbarazh et Zboriv"
"Talks over the winter failed. In the summer of 1649 Khmelnytsky and Khan İslam Giray, with a huge Cossack, peasant and Tatar army, besieged a small Polish army in the castle of Zbarazh. The defenders held out for more than a month. In the north the Lithuanian army under Janusz Radziwiłł beat a Cossack force at Loyew on the Dnieper in July and kept the war away from Lithuania.": "Au cours de l’été 1649, Khmelnytsky et Khan İslam Giray, avec une énorme armée cosaque, paysanne et tatare, ont assiégé une petite armée polonaise dans le château de Zbarazh. Les défenseurs se sont tenus pendant plus d’un mois. Dans le nord, l’armée lituanienne sous Janusz Radziwiłł a battu une force de Cosaques à Loyew sur le Dniepr en juillet et maintenu la guerre loin de Lituanie."
"John Casimir led a relief force of about 15,000–20,000 men, and on 15 August he was caught crossing the Strypa at Zboriv and surrounded. He saved himself by buying off the khan, and on 18 August he accepted the Treaty of Zboriv. The register was raised to 40,000 Cossacks, the voivodeships of Kyiv, Bratslav and Chernihiv were to be run by Orthodox nobles under the hetman, and Jews and Jesuits were barred from living there. Neither side was satisfied, and on their way home the Tatars carried off thousands of local people.": "John Casimir a dirigé une force de secours d’environ 15 000 à 20 000 hommes, et le 15 août il a été pris à travers la Strypa à Zboriv et encerclé. Il s’est sauvé en achetant le khan, et le 18 août il a accepté le traité de Zboriv. Le registre a été élevé à 40 000 cosaques, les voïvodies de Kiev, Bratslav et Chernihiv devaient être gérés par des nobles orthodoxes sous l’hetman, et juifs et jésuites ont été empêchés de vivre là. Aucune partie n’a été satisfaite, et sur leur chemin de retour les Tatars ont emporté des milliers de personnes locales."
