"The victories set off a peasant war. Bands of Cossacks and peasants, some led by colonels such as Maksym Kryvonis, killed Polish and Polonised nobles, Catholic priests, Uniate clergy and above all Jews, often whole communities, at Nemyriv, Tulchyn, Polonne and many other towns. Jewish chroniclers of the time gave figures from tens of thousands to well over 100,000; modern historians mostly estimate that tens of thousands of Jews were killed or carried off, perhaps 15,000–30,000, out of some 40,000–50,000 living in the region. The prince Jeremi Wiśniowiecki answered with his own terror, impaling and hanging rebels as he retreated west.": "Les victoires ont déclenché une guerre paysanne. Des bandes de cosaques et de paysans, dont certaines dirigées par des colonels tels que Maksym Kryvonis, ont tué des nobles polonais et polonisés, des prêtres catholiques, un clergé unifié et surtout des juifs, souvent des communautés entières, à Nemyriv, Tulkyn, Polonne et bien d’autres villes. Les chroniqueurs juifs de l’époque ont donné des chiffres de dizaines de milliers à bien plus de 100 000 ; les historiens modernes estiment principalement que des dizaines de milliers de Juifs ont été tués ou emportés, peut-être 15 000 à 30 000, sur quelque 40 000 à 50 000 habitants de la région."
"On 23 September 1648, at Pyliavtsi in Podolia, a large Polish army led by three noble commanders broke in panic after two days of fighting and fled. Khmelnytsky marched west, took a heavy ransom from Lviv and besieged Zamość. After John II Casimir was elected king in November he turned back, and on 2 January 1649 he rode into Kyiv to be hailed as the ruler of Rus’. The Tatars took many thousands of captives, Ruthenians as well as Poles and Jews, to the slave markets of Crimea.": "Le 23 septembre 1648, à Pyliavtsi à Podolia, une grande armée polonaise dirigée par trois nobles commandants s’est effondrée après deux jours de combats et s’est enfuie. Khmelnytsky marchait vers l’ouest, prenait une lourde rançon de Lviv et assiégea Zamość. Après que Jean II Casimir fut élu roi en novembre, il retourna, et le 2 janvier 1649, il monta à Kiev pour être salué comme le chef de Rus. Les Tatars emmenèrent des milliers de captifs, Ruthéniens ainsi que des Polonais et des Juifs, sur les marchés esclaves de la Crimée."
