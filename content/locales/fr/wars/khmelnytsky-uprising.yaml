"1654–1657": "1654–1657"
"Unable to beat Poland alone and abandoned again and again by the Tatars, Khmelnytsky turned to the Orthodox tsar. On 18 January 1654 a Cossack council at Pereiaslav accepted Tsar Alexis’s protection. The tsar’s envoy Vasily Buturlin refused to swear any oath in return, and the terms, settled in Moscow that spring, left the Hetmanate wide self-government. Ukrainian and Russian historians have argued ever since over whether it was a military alliance, a protectorate or a union.": "Incapable de battre la Pologne seule et abandonnée encore et encore par les Tatars, Khmelnytsky se tourna vers le tsar orthodoxe. Le 18 janvier 1654, un conseil de cosaques à Pereiaslav accepta la protection du tsar Alexis. L’envoyé de tsar Vasily Buturlin refusa de prêter serment en retour, et les termes, établis à Moscou ce printemps-là, quittèrent l’autonomie de l’Hetmanate. Les historiens ukrainiens et russes ont toujours argumenté pour savoir si c’était une alliance militaire, un protectorat ou une union."
"Russia went to war with Poland–Lithuania that year, and Cossack troops fought beside the Russians in Belarus. The Tatars switched to Poland’s side, and the armies met in deep frost at Okhmativ in January 1655. Khmelnytsky soon fell out with Moscow and drew closer to Sweden. He died at Chyhyryn on 6 August 1657. Much of Ukraine had been laid waste by war, famine, plague and slave raids, and the struggle over the Hetmanate went on for decades.": "La Russie est partie en guerre avec la Pologne-Lituanie cette année-là, et les troupes de Cosaques ont combattu aux côtés des Russes en Biélorussie. Les Tatars sont passés au côté de la Pologne, et les armées se sont rencontrées dans le gel profond à Okhmativ en Janvier 1655. Khmelnytsky est rapidement tombé avec Moscou et s’est rapproché de la Suède. Il est mort à Chyryn le 6 août 1657. Une grande partie de l’Ukraine a été gaspillée par la guerre, la famine, la peste et les raids d’esclaves, et la lutte pour l’Hetmanate a continué pendant des décennies."
