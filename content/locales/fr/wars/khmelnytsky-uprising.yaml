"1649": "1649"
"Khmelnytsky Uprising": "Soulèvement de Khmelnytsky"
"A Cossack rising led by Bohdan Khmelnytsky, allied at first with the Crimean Tatars, became a peasant war across Ukraine, with mass killings of Jews, Polish nobles and Catholic clergy and brutal reprisals. It created a Cossack state, the Hetmanate, which placed itself under the Russian tsar at Pereiaslav in 1654.": "Une révolte cosaque menée par Bohdan Khmelnytsky, d’abord allié aux Tatars de Crimée, se transforme en guerre paysanne à travers l’Ukraine. Elle s’accompagne de massacres de Juifs, de nobles polonais et de membres du clergé catholique, ainsi que de représailles brutales. Le soulèvement donne naissance à un État cosaque, l’Hetmanat, qui se place sous l’autorité du tsar de Russie à Pereïaslav en 1654."
"Dates are New Style (Gregorian), as used in Poland–Lithuania. The Cossacks and Russia used the Julian calendar, ten days behind, so Ukrainian and Russian accounts often give dates ten days earlier.": "Les dates sont New Style (Gregorian), comme utilisé en Pologne-Lituanie. Les cosaques et la Russie ont utilisé le calendrier julien, dix jours de retard, donc les comptes ukrainiens et russes donnent souvent des dates dix jours plus tôt."
"Casualty figures for this war, above all for the killings of Jews, have been disputed for centuries. The text gives ranges where historians differ.": "Pendant des siècles, des figures de victimes de cette guerre, surtout pour les meurtres de juifs, ont été contestées. Le texte donne des gammes où les historiens diffèrent."
