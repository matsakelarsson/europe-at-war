# French translations of the catalogue text (wave 11); step bodies follow later.
Khmer–Cham wars: Guerres entre Khmers et Chams
Seventy-five years of war between the Khmer Empire of Angkor and the Cham kingdoms on the coast of today’s central and southern Vietnam. In 1145 Suryavarman II, the builder of Angkor Wat, took the Cham capital Vijaya, but by 1150 Jaya Harivarman I had driven the Khmer and their Cham allies out. In 1177 Jaya Indravarman IV sent a fleet up the Mekong and across the Tonle Sap lake, took the Khmer capital Yaśodharapura by surprise and killed its king. Jayavarman VII drove the Chams out in a series of battles, among them a battle on the water shown on the walls of the Bayon, was crowned in 1181 and rebuilt the capital as Angkor Thom. In 1190 a Khmer army under the Cham prince Vidyanandana took Vijaya; after years of revolts and new invasions Champa was ruled as a Khmer province from 1203 until the Khmer withdrew in 1220 and Jaya Paramesvaravarman II restored its independence.: Soixante-quinze ans de guerre entre l’Empire khmer d’Angkor et les royaumes chams de la côte du centre et du sud de l’actuel Vietnam. En 1145, Suryavarman II, le bâtisseur d’Angkor Vat, prit la capitale chame, Vijaya, mais dès 1150 Jaya Harivarman Ier avait chassé les Khmers et leurs alliés chams. En 1177, Jaya Indravarman IV envoya une flotte remonter le Mékong et traverser le lac Tonlé Sap ; elle prit par surprise la capitale khmère, Yaśodharapura, et tua son roi. Jayavarman VII chassa les Chams au terme d’une série de batailles, dont une bataille sur l’eau représentée sur les murs du Bayon, fut couronné en 1181 et rebâtit la capitale sous le nom d’Angkor Thom. En 1190, une armée khmère conduite par le prince cham Vidyanandana prit Vijaya ; après des années de révoltes et de nouvelles invasions, le Champa fut gouverné comme une province khmère de 1203 jusqu’au retrait des Khmers en 1220, lorsque Jaya Paramesvaravarman II restaura son indépendance.
