# French translations of the catalogue text (wave 13); step bodies follow later.
Khoikhoi–Dutch wars: Guerres entre Khoïkhoï et Néerlandais
? Two wars between the Dutch East India Company’s station at the Cape of Good Hope and the Khoikhoi, the herding peoples of the south-western Cape. The Company founded its refreshment station on Table Bay in 1652 to supply its ships with meat bought from the Khoikhoi. In 1657 it settled free burghers on farms along the Liesbeek River, on the dry-season grazing of the Peninsula Khoikhoi, and in May 1659 Doman (Nommoa), a Khoikhoi interpreter who had been to Batavia, led the Goringhaiqua and Gorachouqua in raids on the farms’ cattle, striking in the rain when the settlers’ matchlocks would not fire. The Company built a line of watch-houses and later planted a hedge of wild almond to close the settlement, and the peace of April 1660 left the settlers on the land they had taken. In 1673–1677 the Company fought the Cochoqua of the chief Gonnema, the largest Khoikhoi community near the Cape, who had killed hunting parties and attacked the Company’s post at Saldanha Bay. Company soldiers, burghers and Khoikhoi allies, the Chainouqua among them, raided the Cochoqua and carried off thousands of cattle and sheep, until Gonnema made peace in June 1677 and agreed to a yearly tribute of cattle. The wars opened the way for Dutch settlement beyond the peninsula; over the next decades the Khoikhoi of the south-western Cape lost their herds and grazing, and with the smallpox epidemic of 1713 their independence, and most became labourers on colonial farms.
: Deux guerres entre le poste de la Compagnie néerlandaise des Indes orientales au cap de Bonne-Espérance et les Khoïkhoï, les peuples pasteurs du sud-ouest du Cap. La Compagnie fonda en 1652 sa station de ravitaillement sur la baie de la Table afin de fournir à ses navires de la viande achetée aux Khoïkhoï. En 1657, elle installa des colons libres (free burghers) sur des fermes le long de la rivière Liesbeek, sur les pâturages de saison sèche des Khoïkhoï de la péninsule et, en mai 1659, Doman (Nommoa), un interprète khoïkhoï qui avait séjourné à Batavia, mena les Goringhaiqua et les Gorachouqua dans des raids contre le bétail des fermes, frappant sous la pluie, quand les mousquets à mèche des colons ne pouvaient pas faire feu. La Compagnie construisit une ligne de postes de guet, puis planta une haie d’amandiers sauvages pour clore la colonie, et la paix d’avril 1660 laissa aux colons les terres qu’ils avaient prises. En 1673–1677, la Compagnie combattit les Cochoqua du chef Gonnema, la plus grande communauté khoïkhoï des environs du Cap, qui avaient tué des groupes de chasseurs et attaqué le poste de la Compagnie à la baie de Saldanha. Soldats de la Compagnie, colons et alliés khoïkhoï, parmi lesquels les Chainouqua, razzièrent les Cochoqua et emmenèrent des milliers de bovins et de moutons, jusqu’à ce que Gonnema fasse la paix en juin 1677 et accepte de verser un tribut annuel en bétail. Ces guerres ouvrirent la voie à la colonisation néerlandaise au-delà de la péninsule ; au cours des décennies suivantes, les Khoïkhoï du sud-ouest du Cap perdirent leurs troupeaux et leurs pâturages, puis, avec l’épidémie de variole de 1713, leur indépendance, et la plupart devinrent ouvriers agricoles dans les fermes coloniales.
