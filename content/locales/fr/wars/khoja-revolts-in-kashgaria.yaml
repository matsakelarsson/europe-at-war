# French translations of the catalogue text (wave 9); step bodies follow later.
Khoja revolts in Kashgaria: Révoltes des khodjas en Kachgarie
? A series of invasions of Qing Kashgaria (the western Tarim basin) by descendants of the Afaqi Khojas, the Sufi family the Qing had driven out in 1759, launched from the Khanate of Kokand with Kyrgyz and Kokandi support. Jahangir Khoja, a grandson of Burhan al-Din, raided Kashgar in 1820 and in 1826 took Kashgar, Yangi Hissar, Yarkand and Khotan, killing the Qing garrison of Kashgar. A Qing army of more than 20,000 men retook the cities in the spring of 1827, and Jahangir was captured and executed in Beijing in 1828. In 1830 a Kokandi army with his brother Yusuf occupied Kashgar for three months; the settlement of 1832 gave Kokand the right to tax foreign merchants in Kashgaria and to station its agents there. Further invasions followed, by the Seven Khojas in 1847 and by Wali Khan, who held Kashgar for about four months in 1857 and beheaded the German traveller Adolf Schlagintweit. Each brought destruction, reprisals and the flight of thousands of townspeople to Kokand, and weakened Qing rule before the great Muslim revolt of 1864.
: Une série d’invasions de la Kachgarie Qing (l’ouest du bassin du Tarim) par des descendants des khodjas afaqis, la famille soufie que les Qing avaient chassée en 1759, lancées depuis le khanat de Kokand avec l’appui de Kirghiz et de Kokandais. Jahangir Khoja, petit-fils de Burhan al-Din, lança un raid sur Kachgar en 1820 et, en 1826, prit Kachgar, Yangi Hissar, Yarkand et Khotan, tuant la garnison Qing de Kachgar. Une armée Qing de plus de 20 000 hommes reprit les villes au printemps 1827, et Jahangir fut capturé et exécuté à Pékin en 1828. En 1830, une armée kokandaise accompagnée de son frère Yusuf occupa Kachgar pendant trois mois ; l’accord de 1832 donna à Kokand le droit de taxer les marchands étrangers en Kachgarie et d’y établir ses agents. D’autres invasions suivirent, celle des Sept Khodjas en 1847 et celle de Wali Khan, qui tint Kachgar pendant environ quatre mois en 1857 et décapita le voyageur allemand Adolf Schlagintweit. Chacune entraîna destructions, représailles et la fuite de milliers de citadins vers Kokand, et affaiblit la domination Qing avant la grande révolte musulmane de 1864.
