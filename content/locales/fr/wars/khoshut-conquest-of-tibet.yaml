# French translations of the catalogue text (wave 9); step bodies follow later.
Khoshut conquest of Tibet: Conquête du Tibet par les Khoshuts
The campaigns in which Güshi Khan, chief of the Khoshut Oirats, made the Gelug school of Tibetan Buddhism and its leader, the Fifth Dalai Lama, rulers of Tibet. In the early 17th century the Tsangpa kings of Shigatse, patrons of the Karma Kagyu school, ruled most of central Tibet and were hostile to the Gelug. When the Khalkha prince Choghtu Khong Tayiji, an ally of the Tsangpa, settled at Kokonor (Qinghai Lake) in 1634, the Gelug turned to the Oirats. Güshi Khan defeated and killed Choghtu in Kokonor in 1637, destroyed the Bön-patron king of Beri in Kham in 1640–1641, and in 1641–1642 invaded Tsang and took Shigatse after a long siege. In 1642 the Dalai Lama was installed as ruler of Tibet, with his regent Sonam Rapten running the new Ganden Phodrang government and Güshi Khan as king and protector, the start of the Khoshut Khanate and of the Dalai Lamas’ government, which lasted until 1959.: "Les campagnes par lesquelles Güshi Khan, chef des Oïrats khoshuts, fit de l’école gelug du bouddhisme tibétain et de son chef, le cinquième dalaï-lama, les maîtres du Tibet. Au début du XVIIe siècle, les rois Tsangpa de Shigatsé, protecteurs de l’école karma-kagyu, régnaient sur la plus grande partie du Tibet central et étaient hostiles aux Gelug. Lorsque le prince khalkha Choghtu Khong Tayiji, allié des Tsangpa, s’établit au Kokonor (lac Qinghai) en 1634, les Gelug se tournèrent vers les Oïrats. Güshi Khan vainquit et tua Choghtu au Kokonor en 1637, anéantit en 1640–1641 le roi de Beri, au Kham, protecteur du bön, puis en 1641–1642 envahit le Tsang et prit Shigatsé après un long siège. En 1642, le dalaï-lama fut installé comme souverain du Tibet, avec son régent Sonam Rapten à la tête du nouveau gouvernement du Ganden Phodrang et Güshi Khan comme roi et protecteur : ce fut le début du khanat khoshut et du gouvernement des dalaï-lamas, qui dura jusqu’en 1959."
