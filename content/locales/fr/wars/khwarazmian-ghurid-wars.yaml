# French translations of the catalogue text (wave 7); step bodies follow later.
Khwarazmian–Ghurid wars: Guerres entre Khwarezmiens et Ghurides
The struggle between the Khwarazmshah Ala al-Din Muhammad II and the Ghurid sultans for Khorasan after the collapse of Seljuk rule there. The Ghurid brothers Ghiyath al-Din and Mu’izz al-Din overran Khorasan in 1201, but the Khwarazmshah won most of it back. In 1204 Mu’izz al-Din invaded Khwarazm itself, was forced back from its capital Gurganj and was routed at Andkhud by the Qara Khitai, the Khwarazmshah’s overlords. After his assassination in 1206 the Ghurid state broke up, and by 1215–1216 Muhammad had taken Herat, Firuzkuh, Bamyan and Ghazni, while the Ghurids’ Indian conquests passed to their Turkish commanders in Delhi, Multan and Lahore.: La lutte entre le shah du Khwarezm Ala al-Din Muhammad II et les sultans ghurides pour le Khorassan, après l’effondrement de la domination seldjoukide dans la région. Les frères ghurides Ghiyath al-Din et Mu’izz al-Din envahirent le Khorassan en 1201, mais le shah du Khwarezm en reprit la plus grande partie. En 1204, Mu’izz al-Din envahit le Khwarezm lui-même, fut repoussé devant sa capitale, Gurganj, et fut mis en déroute à Andkhud par les Qara Khitaï, suzerains du shah du Khwarezm. Après son assassinat en 1206, l’État ghuride se désagrégea et, en 1215–1216, Muhammad avait pris Hérat, Firuzkuh, Bamiyan et Ghazni, tandis que les conquêtes indiennes des Ghurides passaient à leurs commandants turcs de Delhi, de Multan et de Lahore.
