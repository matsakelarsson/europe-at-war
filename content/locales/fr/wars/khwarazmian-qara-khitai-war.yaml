# French translations of the catalogue text (wave 7); step bodies follow later.
Khwarazmian–Qara Khitai war: Guerre entre Khwarezmiens et Qara Khitaï
? The war in which the Khwarazmshah Ala al-Din Muhammad II threw off the overlordship of the Qara Khitai, the non-Muslim Khitan empire of Central Asia whose vassals the Khwarazmshahs had been since the Battle of Qatwan in 1141. Having driven the Ghurids out of Khorasan with Qara Khitai help, Muhammad turned on his overlords in 1207, when he entered Bukhara and the Karakhanid ruler of Samarkand, Uthman, went over to him. The first campaigns beyond the Oxus went badly; in one battle Muhammad was captured, unrecognised, and escaped by passing himself off as a servant. He stopped paying tribute, had a Qara Khitai envoy killed, and in 1210 defeated the Qara Khitai army on the Ilamish plain and captured its general Tayangu. The Qara Khitai empire was also attacked from within by the Naiman prince Kuchlug, a refugee from Genghis Khan, who seized its ruler Yelü Zhilugu in 1211. When Uthman of Samarkand turned against him in 1212 and had the Khwarazmians in the city killed, Muhammad stormed Samarkand, sacked it and executed Uthman, ending Karakhanid rule there. Transoxiana became Khwarazmian, and the Syr Darya the border with Kuchlug’s realm, which the Mongols conquered in 1218.
: "La guerre par laquelle le shah du Khwarezm Ala al-Din Muhammad II secoua la suzeraineté des Qara Khitaï, l’empire khitan non musulman d’Asie centrale dont les shahs du Khwarezm étaient les vassaux depuis la bataille de Qatwan, en 1141. Après avoir chassé les Ghurides du Khorassan avec l’aide des Qara Khitaï, Muhammad se retourna contre ses suzerains en 1207 : il entra à Boukhara, et le souverain karakhanide de Samarcande, Uthman, se rallia à lui. Les premières campagnes au-delà de l’Oxus tournèrent mal ; lors d’une bataille, Muhammad fut capturé sans être reconnu et s’échappa en se faisant passer pour un serviteur. Il cessa de payer le tribut, fit tuer un envoyé des Qara Khitaï et, en 1210, battit leur armée dans la plaine d’Ilamish et captura leur général Tayangu. L’empire des Qara Khitaï était aussi attaqué de l’intérieur par le prince naïman Kütchlüg, qui avait fui Gengis Khan et qui s’empara de son souverain, Yelü Zhilugu, en 1211. Lorsque Uthman de Samarcande se retourna contre lui en 1212 et fit massacrer les Khwarezmiens de la ville, Muhammad prit Samarcande d’assaut, la mit à sac et fit exécuter Uthman, mettant fin à la domination karakhanide sur la ville. La Transoxiane devint khwarezmienne, et le Syr-Daria marqua la frontière avec le royaume de Kütchlüg, que les Mongols conquirent en 1218."
