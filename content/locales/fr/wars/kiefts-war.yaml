# French translations of the catalogue text (wave 14); step bodies follow later.
Kieft’s War (Wappinger War): Guerre de Kieft (guerre des Wappingers)
? A war between the Dutch colony of New Netherland and the Munsee-speaking Lenape and Wappinger peoples around New Amsterdam (New York), named after the colony’s director, Willem Kieft. From 1639 Kieft demanded tribute in corn, furs and wampum from the nations around Manhattan, and quarrels over stray livestock, killings and revenge followed. In February 1643, against the advice of the colonists’ elected council, he sent soldiers against Wecquaesgeek and Tappan refugees who had fled from Mohawk raids to Pavonia and Corlears Hook; some 120 men, women and children were killed in the night. The nations of the lower Hudson and Long Island rose, burned farms and villages from Staten Island to Westchester and killed many colonists, among them Anne Hutchinson and most of her family. Hired by Kieft, the Pequot War veteran John Underhill led Dutch and English soldiers who attacked Native villages in the winter of 1643–1644, killing some 500 to 700 people at Pound Ridge in March 1644. Peace was made at Fort Amsterdam on 30 August 1645. The Native losses in the war are usually put at more than a thousand; New Netherland’s farms were ruined and the West India Company recalled Kieft, who drowned on his way home in 1647.
: Une guerre entre la colonie néerlandaise de la Nouvelle-Néerlande et les Lenapes de langue munsee et les Wappingers des environs de la Nouvelle-Amsterdam (New York), qui porte le nom du directeur de la colonie, Willem Kieft. À partir de 1639, Kieft exigea des nations des environs de Manhattan un tribut en maïs, en fourrures et en wampum, et des querelles à propos de bétail errant, des meurtres et des vengeances s’ensuivirent. En février 1643, contre l’avis du conseil élu par les colons, il envoya des soldats contre des réfugiés wecquaesgeeks et tappans qui, fuyant les raids des Mohawks, s’étaient réfugiés à Pavonia et à Corlears Hook ; quelque 120 hommes, femmes et enfants furent tués pendant la nuit. Les nations du bas Hudson et de Long Island se soulevèrent, incendièrent fermes et villages de Staten Island à Westchester et tuèrent de nombreux colons, parmi lesquels Anne Hutchinson et la plupart des membres de sa famille. Engagé par Kieft, John Underhill, vétéran de la guerre des Pequots, mena des soldats néerlandais et anglais qui attaquèrent des villages autochtones au cours de l’hiver 1643–1644 et tuèrent quelque 500 à 700 personnes à Pound Ridge en mars 1644. La paix fut conclue au fort Amsterdam le 30 août 1645. Les pertes autochtones de la guerre sont généralement estimées à plus d’un millier ; les fermes de la Nouvelle-Néerlande étaient ruinées, et la Compagnie des Indes occidentales rappela Kieft, qui se noya en 1647 sur le chemin du retour.
