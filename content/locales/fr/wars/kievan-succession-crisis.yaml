# Some French text was translated automatically.
"Kievan succession crisis, 1015–1019": "Crise de la succession à Kiev, 1015-1019"
"A war among the sons of Vladimir I of Kiev after his death in 1015. Sviatopolk seized Kiev, and three of his brothers, Boris, Gleb and Sviatoslav, were murdered; Boris and Gleb were later venerated as the first saints of Rus’. Yaroslav of Novgorod drove Sviatopolk out after a battle at Liubech, lost Kiev in 1018 to Sviatopolk and his father-in-law, Bolesław I of Poland, who is said to have taken the Cherven towns on his way home, and won the throne for good on the Alta in 1019.": "Une guerre parmi les fils de Vladimir Ier de Kiev après sa mort en 1015. Sviatopolk a saisi Kiev, et trois de ses frères, Boris, Gleb et Sviatoslav, ont été assassinés ; Boris et Gleb ont ensuite été vénérés comme les premiers saints de Rus. Yaroslav de Novgorod a chassé Sviatopolk après une bataille à Liubech, a perdu Kiev en 1018 à Sviatopolk et son beau-père, Bolesław Ier de Pologne, qui aurait pris les villes Cherven sur le chemin du retour, et gagné le trône pour de bon sur l’Alta en 1019."
"The Primary Chronicle, compiled about a century later under Yaroslav’s descendants, blames Sviatopolk, whom it calls “the Accursed”, for the murders. Thietmar of Merseburg and the Norse Eymund saga tell different stories, and some historians think Yaroslav was behind the death of Boris.": "La Chronique Primaire, compilée environ un siècle plus tard sous les descendants de Yaroslav, blâme Sviatopolk, qu’il appelle \"l’Accursed\", pour les meurtres. Thietmar de Merseburg et la saga du Norse Eymund racontent différentes histoires, et certains historiens pensent que Yaroslav était derrière la mort de Boris."
"The battle at Liubech is dated to the autumn of 1015 or to 1016. Bolesław’s march on Kiev in 1018 is also told under the German–Polish War, 1002–1018.": "La bataille à Liubech est datée de l’automne de 1015 ou de 1016. Bolesławs marche sur Kiev en 1018 est également racontée sous la guerre germano-polonaise, 1002-1018."
