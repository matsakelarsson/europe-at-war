# Some French text was translated automatically.
"Kildare Rebellion": "Rébellion de Kildare"
"The revolt of Thomas FitzGerald, Lord Offaly, known as Silken Thomas, against Henry VIII. Left in charge of the government in Dublin when his father, the Earl of Kildare, was summoned to London, Thomas renounced his allegiance on 11 June 1534 after hearing a false rumour that his father had been executed; the earl in fact died in the Tower that September. Thomas’s men murdered Archbishop John Alen and besieged Dublin Castle without success. In March 1535 the new lord deputy, Sir William Skeffington, battered the FitzGerald stronghold of Maynooth with artillery, and most of the surrendered garrison were executed, the “pardon of Maynooth”. Thomas surrendered that August on a promise of his life, and was executed at Tyburn in 1537 with five of his uncles. The fall of the house of Kildare opened the way for direct Tudor rule and, in 1542, the Kingdom of Ireland.": "La révolte de Thomas FitzGerald, Lord Offaly, connu sous le nom de Silken Thomas, contre Henry VIII. A gauche en charge du gouvernement à Dublin quand son père, le comte de Kildare, a été convoqué à Londres, Thomas a renoncé à son allégeance le 11 juin 1534 après avoir entendu une fausse rumeur selon laquelle son père avait été exécuté ; le comte est effectivement mort dans la Tour ce septembre. En mars 1535, le nouveau lord adjoint, sir William Skeffington, battit avec artillerie la forteresse de FitzGerald de Maynooth, et la plupart de la garnison cédée furent exécutés, le -pardon de Maynooth. Thomas se rendit en août sur une promesse de sa vie, et fut exécuté à Tyburn en 1537 avec cinq de ses oncles. La chute de la maison de Kildare ouvrit la voie à la domination directe de Tudor et, en 1542, au Royaume d’Irlande."
"Dates are Julian (Old Style). The earls of Kildare had governed Ireland as the king’s deputies for most of the previous sixty years.": "Dates sont Julian (Ancien Style). Les comtes de Kildare avait gouverné l’Irlande comme le roi des députés pendant la plupart des soixante années précédentes."
