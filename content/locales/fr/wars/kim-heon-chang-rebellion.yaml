# French translations of the catalogue text (wave 10); step bodies follow later.
Kim Heon-chang’s rebellion: Rébellion de Kim Heon-chang
? A rising against the Silla king led by Kim Heon-chang, governor of Ungcheon-ju (today’s Gongju), and renewed by his son three years later. Kim Heon-chang’s father, Kim Ju-won, a descendant of King Muyeol, had been chosen to succeed King Seondeok in 785 but was pushed aside by Kim Gyeong-sin, who became King Wonseong. In the third month of 822 Kim Heon-chang rose at Ungjin, citing that wrong as his cause, proclaimed a state called Jangan with the era name Gyeongun, and brought under his control the counties of four of Silla’s nine provinces (Mujin, Wansan, Cheong and Sabeol) and of three of its secondary capitals (Gugwon, Seowon and Geumgwan, today’s Chungju, Cheongju and Gimhae); Hansan, Udu and Sapnyang provinces, the Paegang garrison and Bugwon held out for the king. King Heondeok sent armies under Jang Ung, Wigong, Kim Gyun-jeong and Kim U-jing, which beat the rebels at Dodong pass, at Samnyeon fortress and Mount Songni, and at Seongsan, and besieged Ungjin. After about ten days Kim Heon-chang killed himself; when the city fell, 239 of his kin and leading followers were put to death and the rest were released. In the first month of 825 his son Kim Beom-mun rose again with about a hundred men, among them the outlaw leader Su-sin of Mount Godal, and attacked Bukhansan-ju, meaning to make Namp’yeongyang (in today’s Seoul) his capital, but he was defeated and killed by the provincial governor. The rebellion, which for a few weeks held almost half of Silla, is counted as the start of the long decline of the Silla state in the ninth century.
: Un soulèvement contre le roi de Silla mené par Kim Heon-chang, gouverneur d’Ungcheon-ju (l’actuelle Gongju), et repris par son fils trois ans plus tard. Le père de Kim Heon-chang, Kim Ju-won, descendant du roi Muyeol, avait été choisi pour succéder au roi Seondeok en 785, mais avait été écarté par Kim Gyeong-sin, devenu le roi Wonseong. Au troisième mois de 822, Kim Heon-chang se souleva à Ungjin en invoquant cette injustice, proclama un État nommé Jangan, avec le nom d’ère Gyeongun, et prit le contrôle des districts de quatre des neuf provinces du Silla (Mujin, Wansan, Cheong et Sabeol) et de trois de ses capitales secondaires (Gugwon, Seowon et Geumgwan, les actuelles Chungju, Cheongju et Gimhae) ; les provinces de Hansan, d’Udu et de Sapnyang, la garnison de Paegang et Bugwon restèrent fidèles au roi. Le roi Heondeok envoya des armées commandées par Jang Ung, Wigong, Kim Gyun-jeong et Kim U-jing, qui battirent les rebelles au col de Dodong, à la forteresse de Samnyeon et au mont Songni, ainsi qu’à Seongsan, et assiégèrent Ungjin. Au bout d’une dizaine de jours, Kim Heon-chang se donna la mort ; à la chute de la ville, 239 de ses parents et de ses principaux partisans furent mis à mort et les autres furent relâchés. Au premier mois de 825, son fils Kim Beom-mun se souleva à son tour avec une centaine d’hommes, parmi lesquels le chef de brigands Su-sin du mont Godal, et attaqua Bukhansan-ju, dans l’intention de faire de Namp’yeongyang (dans l’actuelle Séoul) sa capitale, mais il fut vaincu et tué par le gouverneur de la province. La rébellion, qui tint pendant quelques semaines près de la moitié du Silla, est considérée comme le début du long déclin de l’État de Silla au IXe siècle.
