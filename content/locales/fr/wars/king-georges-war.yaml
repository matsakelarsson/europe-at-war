# French translations of the catalogue text (wave 14); step bodies follow later.
King George’s War: Guerre du roi George
? The North American part of the War of the Austrian Succession, fought between Britain and France and their colonies and allies in Nova Scotia, Cape Breton and on the frontier of New England and New York. When France declared war in March 1744, troops from the French fortress of Louisbourg on Cape Breton burned the New England fishing post of Canso, and French troops and Mi’kmaq and Wolastoqiyik warriors twice besieged Annapolis Royal, the capital of British Nova Scotia, without taking it. In 1745 some 4,200 New England volunteers under William Pepperrell, with a Royal Navy squadron under Peter Warren, besieged Louisbourg for 47 days and took it, the greatest victory of colonial New England. A great French fleet sent to retake it in 1746 under the Duc d’Anville was destroyed by storms and disease. French, Canadian and Native war parties raided the frontier from Maine to Saratoga, and in February 1747 a Canadian and Mi’kmaq force surprised and defeated a New England detachment at Grand-Pré. The Treaty of Aix-la-Chapelle in 1748 returned Louisbourg to France in exchange for Madras, to the fury of New England.
: "Le volet nord-américain de la guerre de Succession d’Autriche, qui opposa la Grande-Bretagne et la France, leurs colonies et leurs alliés en Nouvelle-Écosse, sur l’île du Cap-Breton et sur la frontière de la Nouvelle-Angleterre et de New York. Lorsque la France déclara la guerre en mars 1744, des troupes de la forteresse française de Louisbourg, sur l’île du Cap-Breton, incendièrent le poste de pêche néo-anglais de Canso, et des troupes françaises et des guerriers micmacs et wolastoqiyik assiégèrent à deux reprises, sans la prendre, Annapolis Royal, la capitale de la Nouvelle-Écosse britannique. En 1745, quelque 4 200 volontaires de la Nouvelle-Angleterre commandés par William Pepperrell, appuyés par une escadre de la Royal Navy sous les ordres de Peter Warren, assiégèrent Louisbourg pendant 47 jours et s’en emparèrent : ce fut la plus grande victoire de la Nouvelle-Angleterre coloniale. Une grande flotte française envoyée en 1746 pour la reprendre, sous le commandement du duc d’Anville, fut détruite par les tempêtes et la maladie. Des partis de guerre français, canadiens et autochtones lancèrent des raids sur la frontière, du Maine à Saratoga, et, en février 1747, une troupe de Canadiens et de Micmacs surprit et défit un détachement de la Nouvelle-Angleterre à Grand-Pré. Le traité d’Aix-la-Chapelle de 1748 rendit Louisbourg à la France en échange de Madras, à la grande fureur de la Nouvelle-Angleterre."
