# French translations of the catalogue text (wave 14); step bodies follow later.
King Philip’s War (Metacom’s War): Guerre du roi Philip (guerre de Metacom)
? A war between the English colonies of New England and the Wampanoag under their sachem Metacom, whom the English called King Philip, joined by the Nipmuc, the Pocumtuck and, after the colonists attacked them, the Narragansett, while the Mohegan, the Pequot, many Christian Indians and the Mohawk fought against them. Half a century of English expansion over Native land, the colonies’ claims to judge and disarm their Native neighbours, and the hanging of three Wampanoag men by Plymouth in June 1675 led to the first attacks at Swansea. Native forces struck more than half of New England’s towns and destroyed a dozen of them, among them Springfield, Lancaster and Providence, and won at Bloody Brook and Sudbury. The colonists burned the Narragansett fort in the Great Swamp in December 1675, killing hundreds of women and children, and from the spring of 1676, with their Native allies, hunger and a Mohawk attack on Metacom’s winter camp, they wore the coalition down. Metacom was killed at Mount Hope on 12 August 1676; the war in Maine went on until the Treaty of Casco in April 1678. Estimates of the dead range from about 600 to over 1,000 colonists and from about 3,000 to more than 5,000 Native people, killed or dead of hunger and disease; hundreds, perhaps over a thousand, Native captives were sold into slavery in the West Indies and elsewhere. In proportion to population it was among the deadliest wars in American history.
: Une guerre entre les colonies anglaises de la Nouvelle-Angleterre et les Wampanoags de leur sachem Metacom, que les Anglais appelaient le roi Philip, rejoints par les Nipmucs, les Pocumtucks et, après que les colons les eurent attaqués, les Narragansetts, tandis que les Mohegans, les Pequots, de nombreux Indiens chrétiens et les Mohawks combattaient contre eux. Un demi-siècle d’expansion anglaise sur les terres autochtones, la prétention des colonies à juger et à désarmer leurs voisins autochtones et la pendaison de trois Wampanoags par Plymouth en juin 1675 conduisirent aux premières attaques, à Swansea. Les forces autochtones frappèrent plus de la moitié des villes de la Nouvelle-Angleterre, en détruisirent une douzaine, parmi lesquelles Springfield, Lancaster et Providence, et l’emportèrent à Bloody Brook et à Sudbury. Les colons incendièrent le fort narragansett du Grand Marais en décembre 1675, tuant des centaines de femmes et d’enfants et, à partir du printemps 1676, avec l’aide de leurs alliés autochtones, de la faim et d’une attaque mohawk contre le camp d’hiver de Metacom, ils usèrent la coalition. Metacom fut tué à Mount Hope le 12 août 1676 ; la guerre se poursuivit dans le Maine jusqu’au traité de Casco, en avril 1678. Les estimations du nombre de morts vont d’environ 600 à plus de 1 000 colons et d’environ 3 000 à plus de 5 000 Autochtones, tués ou morts de faim et de maladie ; des centaines, peut-être plus d’un millier, de captifs autochtones furent vendus comme esclaves aux Antilles et ailleurs. Rapportée à la population, elle compte parmi les guerres les plus meurtrières de l’histoire américaine.
