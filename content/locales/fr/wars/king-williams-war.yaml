# French translations of the catalogue text (wave 14); step bodies follow later.
King William’s War: Guerre du roi Guillaume
? "The North American part of the Nine Years’ War between Louis XIV’s France and William III’s England, fought between New France and its Wabanaki and other Native allies on one side and the English colonies of New England, New York and Hudson Bay and their Haudenosaunee allies on the other. It grew out of border quarrels in Maine and Acadia and the war between New France and the Haudenosaunee: Wabanaki warriors under leaders such as Kancamagus and Madockawando, with the French officer Saint-Castin, attacked English towns in Maine and New Hampshire from 1688, and after the Haudenosaunee raid on Lachine in 1689 Governor Frontenac sent French and Native war parties against Schenectady and the New England frontier in the winter of 1690. Sir William Phips and the Massachusetts militia took Port Royal in Acadia in May 1690 but were beaten off at Quebec in October, and an overland attack on Montreal failed. For the rest of the war the frontier from Maine to the Mohawk valley suffered raids and counter-raids; Pierre Le Moyne d’Iberville took the fort at Pemaquid in 1696, destroyed most English settlements in Newfoundland in the winter of 1696–1697, and won York Factory on Hudson Bay in 1697. The Peace of Ryswick in September 1697 restored the pre-war borders. The Haudenosaunee, left to fight alone, made peace with New France and its allies at Montreal in 1701, and the Wabanaki with Massachusetts in 1699."
: "Le volet nord-américain de la guerre de Neuf Ans (ou de la Ligue d’Augsbourg) entre la France de Louis XIV et l’Angleterre de Guillaume III, qui opposa la Nouvelle-France et ses alliés wabanakis et autres alliés autochtones, d’un côté, aux colonies anglaises de la Nouvelle-Angleterre, de New York et de la baie d’Hudson et à leurs alliés haudenosaunee, de l’autre. Elle naquit des querelles frontalières dans le Maine et en Acadie et de la guerre entre la Nouvelle-France et les Haudenosaunee : des guerriers wabanakis menés par des chefs tels que Kancamagus et Madockawando, avec l’officier français Saint-Castin, attaquèrent des villes anglaises du Maine et du New Hampshire à partir de 1688 et, après le raid haudenosaunee sur Lachine en 1689, le gouverneur Frontenac envoya des partis de guerre français et autochtones contre Schenectady et la frontière de la Nouvelle-Angleterre au cours de l’hiver 1690. Sir William Phips et la milice du Massachusetts prirent Port-Royal, en Acadie, en mai 1690, mais furent repoussés devant Québec en octobre, et une attaque par voie de terre contre Montréal échoua. Pendant le reste de la guerre, la frontière, du Maine à la vallée de la Mohawk, subit raids et contre-raids ; Pierre Le Moyne d’Iberville prit le fort de Pemaquid en 1696, détruisit la plupart des établissements anglais de Terre-Neuve au cours de l’hiver 1696–1697 et s’empara de York Factory, sur la baie d’Hudson, en 1697. La paix de Ryswick, en septembre 1697, rétablit les frontières d’avant-guerre. Les Haudenosaunee, laissés seuls face à l’ennemi, firent la paix avec la Nouvelle-France et ses alliés à Montréal en 1701, et les Wabanakis avec le Massachusetts en 1699."
