# French translations of the catalogue text (wave 13); step bodies follow later.
Kiriji War: Guerre de Kiriji
? The last and longest of the 19th-century Yoruba wars, also called the Ekiti Parapo war. By the 1870s Ibadan, the military city-state that had defeated Ilorin and destroyed Ijaye, ruled much of eastern Yorubaland, the Ekiti, Ijesha, Igbomina and Akoko country, through resident agents, the ajele, whose exactions were deeply resented. In 1877 Ibadan, under Are Latosisa, went to war with the Egba and Ijebu, who blocked its roads to the coast. In the east the towns rose against the ajele and formed an alliance, the Ekiti Parapo (‘Ekiti together’), led from 1879 by the Ijesha war chief Ogedengbe and armed with breech-loading rifles bought through Lagos by Ekiti and Ijesha emigrants there; the noise of their guns gave the war its name. Ilorin, the Egba and Ijebu joined against Ibadan. From 1879 the two armies faced each other for seven years in fortified camps on the hills near Igbajo and Imesi-Ile, which grew into towns of tens of thousands. War-weariness, the death of Latosisa in 1885 and the mediation of the British governor of Lagos, through the Yoruba clergymen Samuel Johnson and Charles Phillips, led to a peace treaty in 1886, but Ilorin fought on around Offa, and the camps were finally broken up only in March 1893, when British officials took over the mediation and Yorubaland passed under British protection.
: La dernière et la plus longue des guerres yoruba du XIXe siècle, appelée aussi guerre de l’Ekiti Parapo. Dans les années 1870, Ibadan, la cité-État militaire qui avait vaincu Ilorin et détruit Ijaye, dominait une grande partie de l’est du pays yoruba, les pays ekiti, ijesha, igbomina et akoko, par l’intermédiaire d’agents résidents, les ajele, dont les exactions suscitaient un profond ressentiment. En 1877, Ibadan, sous l’Are Latosisa, entra en guerre contre les Egba et les Ijebu, qui lui barraient les routes de la côte. À l’est, les villes se soulevèrent contre les ajele et formèrent une alliance, l’Ekiti Parapo (« Ekiti ensemble »), dirigée à partir de 1879 par le chef de guerre ijesha Ogedengbe et armée de fusils à chargement par la culasse achetés à Lagos par des émigrés ekiti et ijesha qui y vivaient ; le bruit de leurs fusils donna son nom à la guerre. Ilorin, les Egba et les Ijebu se joignirent à la lutte contre Ibadan. À partir de 1879, les deux armées se firent face pendant sept ans dans des camps fortifiés établis sur les collines proches d’Igbajo et d’Imesi-Ile, qui devinrent des villes de plusieurs dizaines de milliers d’habitants. La lassitude de la guerre, la mort de Latosisa en 1885 et la médiation du gouverneur britannique de Lagos, par l’intermédiaire des pasteurs yoruba Samuel Johnson et Charles Phillips, aboutirent à un traité de paix en 1886, mais Ilorin poursuivit les combats autour d’Offa, et les camps ne furent finalement levés qu’en mars 1893, lorsque des fonctionnaires britanniques reprirent la médiation et que le pays yoruba passa sous protection britannique.
