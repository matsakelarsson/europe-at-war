# French translations of the catalogue text (wave 13); step bodies follow later.
Kivu conflict: Conflit du Kivu
? "The wars in the provinces of North and South Kivu in the eastern Democratic Republic of the Congo since the end of the Second Congo War. Their roots are older: disputes over land and over the citizenship of Kinyarwanda-speaking Congolese, the presence since 1994 of Rwandan Hutu forces that took part in the genocide, and the Kivus’ wealth in tin, coltan and gold. In 2004 Laurent Nkunda, a Tutsi officer of the former rebel RCD, took up arms; his CNDP fought the government until Rwanda and the Congo made a deal in 2009, and its former officers rebelled again as the M23, which took Goma in 2012 before a UN Intervention Brigade defeated it in 2013. The M23 returned in 2021 with Rwandan backing documented by UN experts; in January and February 2025 it took Goma and Bukavu, and it has kept them despite peace agreements signed in Washington and Doha. More than a hundred other armed groups, the Rwandan Hutu FDLR, Mai-Mai and Wazalendo militias, the Congolese army and foreign forces have also fought in the Kivus. No overall death toll is known; millions of people have been displaced."
: "Les guerres qui se déroulent dans les provinces du Nord-Kivu et du Sud-Kivu, dans l’est de la République démocratique du Congo, depuis la fin de la deuxième guerre du Congo. Leurs racines sont plus anciennes : les différends fonciers et la question de la nationalité des Congolais de langue kinyarwanda, la présence depuis 1994 de forces hutu rwandaises ayant pris part au génocide, et la richesse des deux Kivu en étain, en coltan et en or. En 2004, Laurent Nkunda, officier tutsi de l’ancienne rébellion du RCD, prit les armes ; son CNDP combattit le gouvernement jusqu’à ce que le Rwanda et le Congo concluent un accord en 2009, et ses anciens officiers se rebellèrent de nouveau sous le nom de M23, qui prit Goma en 2012 avant d’être vaincu en 2013 par une brigade d’intervention de l’ONU. Le M23 est revenu en 2021 avec un soutien rwandais documenté par les experts de l’ONU ; en janvier et février 2025, il a pris Goma et Bukavu, qu’il a conservées malgré les accords de paix signés à Washington et à Doha. Plus d’une centaine d’autres groupes armés, les FDLR hutu rwandaises, les milices maï-maï et wazalendo, l’armée congolaise et des forces étrangères ont également combattu dans les Kivu. Aucun bilan global des morts n’est connu ; des millions de personnes ont été déplacées."
