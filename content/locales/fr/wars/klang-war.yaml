# French translations of the catalogue text (wave 11); step bodies follow later.
Klang War: Guerre de Klang
? A civil war in Selangor, also called the Selangor Civil War, between rival Malay princes, each allied with Chinese tin-mining groups, over the revenues of the Klang valley and its tin mines. In 1866–1867 Raja Mahdi, a grandson of an earlier sultan who felt he had been passed over, quarrelled with Raja Abdullah, the governor of Klang, over the right to tax the opium and tin trade, and took Klang in March 1867. Sultan Abdul Samad stayed largely aloof at Langat. On 26 June 1868 he made his new son-in-law Tengku Kudin, a prince of Kedah, viceroy (Wakil Yamtuan) to end the war; Kudin backed Raja Abdullah’s son Raja Ismail, and with his help Ismail retook Klang in March 1870, while Mahdi fell back on Kuala Selangor. In Kuala Lumpur the Hakka leader Yap Ah Loy, the Kapitan China, sided with Kudin, while rival Chinese miners under Chong Chong joined Mahdi. In July 1871, after the crew of a Penang junk were killed off Selangor in an attack the British traced to Kuala Selangor, British warships bombarded the town and it was handed to Kudin; Raja Musa, who had claimed it, went over to Mahdi. In 1872 Mahdi’s side, with the Mandailing leaders Raja Asal and Sutan Puasa and the commander Syed Mashhor, besieged Kudin’s men at Bukit Nanas and took Kuala Lumpur, which was burned; Yap Ah Loy escaped to Klang. With about 1,000 men raised by Yap and about 1,000 Pahang fighters under Tok Gajah, sent by the Bendahara Wan Ahmad, Kudin retook Kuala Lumpur in March 1873, and the Pahang forces captured Kuala Selangor on 8 November 1873, which largely ended the war. Mahdi went into exile in Johor and Singapore. The war, with the Larut Wars in Perak, led the British government to give up its policy of non-intervention in the Malay states in September 1873; Selangor accepted a British Resident in 1875, and Yap Ah Loy rebuilt Kuala Lumpur.
: Une guerre civile au Selangor, également appelée guerre civile du Selangor, entre princes malais rivaux, chacun allié à des groupes chinois exploitant l’étain, pour les revenus de la vallée de la Klang et de ses mines d’étain. En 1866–1867, Raja Mahdi, petit-fils d’un ancien sultan, qui s’estimait lésé, se querella avec Raja Abdullah, gouverneur de Klang, au sujet du droit de taxer le commerce de l’opium et de l’étain, et prit Klang en mars 1867. Le sultan Abdul Samad resta largement à l’écart, à Langat. Le 26 juin 1868, il nomma son nouveau gendre, Tengku Kudin, un prince du Kedah, vice-roi (Wakil Yamtuan) pour mettre fin à la guerre ; Kudin soutint le fils de Raja Abdullah, Raja Ismail, qui reprit Klang avec son aide en mars 1870, tandis que Mahdi se repliait sur Kuala Selangor. À Kuala Lumpur, le chef hakka Yap Ah Loy, le Kapitan China, se rangea du côté de Kudin, tandis que des mineurs chinois rivaux menés par Chong Chong rejoignaient Mahdi. En juillet 1871, après le massacre de l’équipage d’une jonque de Penang au large du Selangor lors d’une attaque que les Britanniques attribuèrent à Kuala Selangor, des navires de guerre britanniques bombardèrent la ville, qui fut remise à Kudin ; Raja Musa, qui la revendiquait, passa dans le camp de Mahdi. En 1872, le camp de Mahdi, avec les chefs mandailing Raja Asal et Sutan Puasa et le commandant Syed Mashhor, assiégea les hommes de Kudin à Bukit Nanas et prit Kuala Lumpur, qui fut incendiée ; Yap Ah Loy s’enfuit à Klang. Avec environ 1 000 hommes levés par Yap et environ 1 000 combattants du Pahang menés par Tok Gajah, envoyés par le bendahara Wan Ahmad, Kudin reprit Kuala Lumpur en mars 1873, et les forces du Pahang s’emparèrent de Kuala Selangor le 8 novembre 1873, ce qui mit pratiquement fin à la guerre. Mahdi partit en exil au Johor et à Singapour. Cette guerre, ajoutée aux guerres de Larut au Perak, amena le gouvernement britannique à renoncer en septembre 1873 à sa politique de non-intervention dans les États malais ; le Selangor accepta un résident britannique en 1875, et Yap Ah Loy reconstruisit Kuala Lumpur.
