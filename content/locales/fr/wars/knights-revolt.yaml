# Some French text was translated automatically.
"Knights’ Revolt": "Les chevaliers"
"A rising of imperial knights from the Rhineland and Swabia, led by Franz von Sickingen and supported by the humanist Ulrich von Hutten, who hoped to win the Electorate of Trier for the Reformation and restore the declining power of the lesser nobility against the princes. Sickingen’s siege of Trier in September 1522 failed, and in the spring of 1523 the Archbishop-Elector of Trier, the Elector Palatine and Landgrave Philip of Hesse besieged him in his castle of Nanstein at Landstuhl. Mortally wounded by cannon fire, he surrendered on 6 May 1523 and died the next day. That summer the Swabian League destroyed some two dozen knights’ castles in Franconia, and Hutten died in exile on the island of Ufenau in Lake Zürich.": "Une montée des chevaliers impériaux de la Rhénanie et de la Souabe, menée par Franz von Sickingen et soutenue par l’humaniste Ulrich von Hutten, qui espérait gagner l’Électorat de Trèves pour la Réforme et restaurer le pouvoir déclinant de la moindre noblesse contre les princes. Sickingen Le siège de Trèves en septembre 1522 échoua, et au printemps de 1523 l’archevêque-électeur de Trèves, l’Électeur Palatine et Landgrave Philippe de Hesse l’assiégea dans son château de Nanstein à Landstuhl. Mortalement blessé par un feu de canon, il se rendit le 6 mai 1523 et mourut le lendemain. Cet été-là, la Ligue souabe a détruit quelques deux douzaines de châteaux chevaliers en Franconie, et Hutten est mort en exil sur l’île d’Ufenau dans le lac Zürich."
"Also called the Knights’ War (Ritterkrieg) or Sickingen’s Feud. It is often seen as a forerunner of the Peasants’ War of 1524–1525, as the last attempt of the imperial knights to assert themselves by force.": "Aussi appelé la guerre des Chevaliers (Ritterkrieg) ou les Sickingens Feud. Il est souvent considéré comme un précurseur de la guerre des paysans de 1524-1525, comme la dernière tentative des chevaliers impériaux pour s’affirmer par la force."
