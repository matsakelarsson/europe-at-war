# French translations of the catalogue text (wave 13); step bodies follow later.
Wars of Koli Tenguella: Guerres de Koli Tenguella
? The wars by which the Fulbe leader Tenguella and his son Koli Tenguella built a kingdom in the Senegal valley, founding the Denianke dynasty that ruled Futa Toro until 1776. Tenguella, a Fulbe chief from Futa Toro, had led his followers east into the lands of the kingdom of Diara (Zara), in today’s western Mali, where he founded the state of Futa Kingi, and by about 1490 his raids on the upper Gambia threatened Mali’s routes to Kaabu and the Bambuk gold fields. In 1511 he invaded Diara itself; its rulers appealed to Songhai, and in 1512 an army under the askia’s brother Umar Komdiagho defeated and killed him (see Askia Muhammad’s wars). His son Koli had gathered Fulbe, Mandinka and others in the highlands of Futa Jallon, at Dena (Badiar), from where he raided Wuli and Niani on the Gambia and fought Saloum. After his father’s death, driven by Malian pressure and famine, he led his people north, defeated the small kingdoms of eastern Senegal one by one, overcame the governors (farba) whom the buurba of Jolof and the rulers of Diara kept in Futa Toro, made Anyam-Godo his capital and reconquered Kingi. He defeated Jolof several times, which helped bring about its breakup at Danki in 1549. The Portuguese called his kingdom that of the “Great Fulo”. Koli died in 1537 and was succeeded by his brother Labba. The dates rest on the Timbuktu chronicles and later Fulbe and Mandinka traditions and are approximate; some accounts put Koli’s arrival in Futa Toro in 1512–1513, others earlier.
: Les guerres par lesquelles le chef peul Tenguella et son fils Koli Tenguella bâtirent un royaume dans la vallée du Sénégal, fondant la dynastie des Denianké, qui régna sur le Fouta-Toro jusqu’en 1776. Tenguella, chef peul originaire du Fouta-Toro, avait conduit ses partisans vers l’est, sur les terres du royaume du Diara (Zara), dans l’ouest de l’actuel Mali, où il fonda l’État du Fouta-Kingi, et vers 1490 ses raids sur la haute Gambie menaçaient les routes du Mali vers le Kaabu et les gisements aurifères du Bambouk. En 1511, il envahit le Diara lui-même ; ses souverains firent appel au Songhaï, et en 1512 une armée commandée par le frère de l’askia, Umar Komdiagho, le vainquit et le tua (voir les guerres d’Askia Mohammed). Son fils Koli avait rassemblé des Peuls, des Mandingues et d’autres dans les hautes terres du Fouta-Djalon, à Dena (Badiar), d’où il razziait le Wuli et le Niani, sur la Gambie, et combattait le Saloum. Après la mort de son père, poussé par la pression malienne et la famine, il conduisit son peuple vers le nord, vainquit un à un les petits royaumes de l’est du Sénégal, l’emporta sur les gouverneurs (farba) que le bourba du Djolof et les souverains du Diara entretenaient au Fouta-Toro, fit d’Anyam-Godo sa capitale et reconquit le Kingi. Il vainquit le Djolof à plusieurs reprises, ce qui contribua à son éclatement à Danki en 1549. Les Portugais appelaient son royaume celui du « Grand Fulo ». Koli mourut en 1537 et eut pour successeur son frère Labba. Les dates reposent sur les chroniques de Tombouctou et sur des traditions peules et mandingues plus tardives, et sont approximatives ; certains récits placent l’arrivée de Koli au Fouta-Toro en 1512–1513, d’autres plus tôt.
