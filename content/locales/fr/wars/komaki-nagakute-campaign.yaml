# French translations of the catalogue text (wave 10); step bodies follow later.
Komaki–Nagakute Campaign: Campagne de Komaki–Nagakute
? The only war between the two men who would unify Japan, Hashiba (later Toyotomi) Hideyoshi and Tokugawa Ieyasu. After Shizugatake (1583) Hideyoshi treated Nobunaga’s second son, Oda Nobukatsu, as a subordinate, and in the third month of 1584 Nobukatsu had three of his senior retainers, suspected of dealing with Hideyoshi, put to death and called on Ieyasu for help. Hideyoshi’s ally Ikeda Tsuneoki seized Inuyama castle in Owari, but Ieyasu beat Mori Nagayoshi at Haguro and fortified Mount Komaki, a hill commanding the Owari plain. Hideyoshi arrived with a much larger army, put at up to 100,000 against about 30,000, and the two sides dug lines of earthworks facing each other. To break the deadlock Ikeda Tsuneoki proposed a raid on Ieyasu’s home province of Mikawa, and a force of about 20,000 under Hideyoshi’s nephew Miyoshi (later Toyotomi) Hidetsugu set out in secret. Ieyasu learned of it and followed, and on the 9th day of the fourth month (May 1584) he routed Hidetsugu’s column and destroyed the troops of Ikeda and Mori at Nagakute; Ikeda Tsuneoki, his son Motosuke and Mori Nagayoshi were killed, with losses put at 2,500 by some sources and far more by others. The armies then faced each other again, and the war moved to Ise and to Kanie castle, which Ieyasu and Nobukatsu retook in the summer. Hideyoshi instead put pressure on Nobukatsu’s lands in Ise, and in the eleventh month (December) Nobukatsu made a separate peace and submitted. Ieyasu, left without a cause, made peace too and sent his son Ogimaru (later Yūki Hideyasu) to Hideyoshi as an adopted son and hostage. Ieyasu had won the battles but Hideyoshi the war; in 1586 Ieyasu came to Osaka and did homage.
: La seule guerre entre les deux hommes qui allaient unifier le Japon, Hashiba (plus tard Toyotomi) Hideyoshi et Tokugawa Ieyasu. Après Shizugatake (1583), Hideyoshi traita le deuxième fils de Nobunaga, Oda Nobukatsu, en subordonné et, au troisième mois de 1584, Nobukatsu fit mettre à mort trois de ses principaux vassaux, soupçonnés d’intelligence avec Hideyoshi, et appela Ieyasu à l’aide. Ikeda Tsuneoki, allié de Hideyoshi, s’empara du château d’Inuyama, en Owari, mais Ieyasu battit Mori Nagayoshi à Haguro et fortifia le mont Komaki, une colline qui domine la plaine d’Owari. Hideyoshi arriva avec une armée bien plus nombreuse, estimée jusqu’à 100 000 hommes contre environ 30 000, et les deux camps creusèrent face à face des lignes de terrassements. Pour sortir de l’impasse, Ikeda Tsuneoki proposa un raid sur la province natale d’Ieyasu, Mikawa, et une force d’environ 20 000 hommes commandée par le neveu de Hideyoshi, Miyoshi (plus tard Toyotomi) Hidetsugu, partit en secret. Ieyasu l’apprit et la suivit et, le 9e jour du quatrième mois (mai 1584), il mit en déroute la colonne de Hidetsugu et anéantit les troupes d’Ikeda et de Mori à Nagakute ; Ikeda Tsuneoki, son fils Motosuke et Mori Nagayoshi furent tués, et les pertes sont estimées à 2 500 hommes par certaines sources et à bien davantage par d’autres. Les armées se firent de nouveau face, puis la guerre se déplaça vers Ise et le château de Kanie, qu’Ieyasu et Nobukatsu reprirent pendant l’été. Hideyoshi préféra faire pression sur les terres de Nobukatsu en Ise et, au onzième mois (décembre), Nobukatsu conclut une paix séparée et se soumit. Ieyasu, privé de sa cause, fit lui aussi la paix et envoya son fils Ogimaru (plus tard Yūki Hideyasu) à Hideyoshi comme fils adoptif et otage. Ieyasu avait gagné les batailles, mais Hideyoshi la guerre ; en 1586, Ieyasu vint à Osaka et lui rendit hommage.
