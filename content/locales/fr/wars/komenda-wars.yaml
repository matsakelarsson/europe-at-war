# French translations of the catalogue text (wave 13); step bodies follow later.
Komenda Wars: Guerres de Komenda
? Four wars fought in 1694–1700 round Komenda, on the Gold Coast between Elmina and Cape Coast, in which the Dutch West India Company and the English Royal African Company, rivals for the trade of the kingdom of Eguafo, paid and armed African allies against each other and against Eguafo’s kings. The Dutch had built Fort Vredenburgh at Komenda in 1682 and in 1688 helped put a prince, Takyi, on Eguafo’s throne. In November 1694 John Kabes (Cabess), a Komenda merchant long at odds with the Dutch, brought the English back to build a fort beside theirs and attacked Dutch miners outside the town. In the first war (1694–1695) his men besieged Vredenburgh and on 28 April 1695 defeated an army from Twifo hired by the Dutch. In the second (1696) a young claimant, Takyi Kuma, rose against the king with Dutch, Adom and Akani support and was defeated on 20 March 1696. In the third (1698) forces paid by the English from Asebu, Kabes’s town and Akani attacked; Takyi was killed in November 1698, but the kingdom’s forces routed Takyi Kuma’s army. In the fourth, from November 1699, a larger force paid by the English took Eguafo on 9 May 1700 and made Takyi Kuma king. The English came out with the better trade position, though little land changed hands. The wars, the hiring of armies, the seizure of people as pledges for debts (panyarring) and a smallpox epidemic in the early 1700s depopulated the coast; historians see in them part of the change by which the slave trade overtook the gold trade on the Gold Coast, and of the disorder that let Asante expand. The Dutch chief factor Willem Bosman, who took part, wrote the main contemporary account.
: Quatre guerres livrées en 1694–1700 autour de Komenda, sur la Côte-de-l’Or, entre Elmina et Cape Coast, au cours desquelles la Compagnie néerlandaise des Indes occidentales et la Royal African Company anglaise, rivales pour le commerce du royaume d’Eguafo, payèrent et armèrent des alliés africains les uns contre les autres et contre les rois d’Eguafo. Les Néerlandais avaient construit le fort Vredenburgh à Komenda en 1682 et aidé en 1688 un prince, Takyi, à monter sur le trône d’Eguafo. En novembre 1694, John Kabes (Cabess), marchand de Komenda depuis longtemps en conflit avec les Néerlandais, fit revenir les Anglais pour qu’ils bâtissent un fort à côté du leur et attaqua des mineurs néerlandais à l’extérieur de la ville. Lors de la première guerre (1694–1695), ses hommes assiégèrent Vredenburgh et, le 28 avril 1695, vainquirent une armée du Twifo engagée par les Néerlandais. Lors de la deuxième (1696), un jeune prétendant, Takyi Kuma, se souleva contre le roi avec le soutien des Néerlandais, d’Adom et des Akani, et fut battu le 20 mars 1696. Lors de la troisième (1698), des forces d’Asebu, de la ville de Kabes et des Akani, payées par les Anglais, attaquèrent ; Takyi fut tué en novembre 1698, mais les forces du royaume mirent en déroute l’armée de Takyi Kuma. Lors de la quatrième, à partir de novembre 1699, une force plus importante payée par les Anglais prit Eguafo le 9 mai 1700 et fit roi Takyi Kuma. Les Anglais en sortirent avec une meilleure position commerciale, bien que peu de terres aient changé de mains. Les guerres, le recours à des armées à gages, la saisie de personnes en gage de dettes (le panyarring) et une épidémie de variole au début des années 1700 dépeuplèrent la côte ; les historiens y voient un aspect de la transformation par laquelle la traite des esclaves supplanta le commerce de l’or sur la Côte-de-l’Or, et du désordre qui permit l’expansion de l’Ashanti. Le facteur en chef néerlandais Willem Bosman, qui y prit part, en rédigea le principal récit contemporain.
