"Komnenian reconquest of Anatolia": "Reconquête komménienne d’Anatolie"
"The campaigns in which the Byzantine emperors of the Komnenos dynasty, Alexios I, John II and Manuel I, recovered the coasts and river valleys of western and northern Anatolia from the Seljuk Turks after the First Crusade and pushed into Cilicia and Syria. Their attempt to destroy the Sultanate of Rum ended with Manuel’s defeat at Myriokephalon in 1176, which left the central plateau to the Turks.": "Les campagnes dans lesquelles les empereurs byzantins de la dynastie Komnenos, Alexios I, Jean II et Manuel I, ont récupéré les côtes et les vallées fluviales de l’Anatolie occidentale et septentrionale des Turcs Seljuk après la première croisade et poussé en Cilicie et en Syrie. Leur tentative de détruire le Sultanat de Rhum s’est terminée par la défaite de Manuels à Myriokephalon en 1176, qui a laissé le plateau central aux Turcs."
"The main Byzantine sources are Anna Komnene’s Alexiad and the histories of John Kinnamos and Niketas Choniates; dates, especially for John II’s campaigns, are often known only to the year.": "Les principales sources byzantines sont Anna Komneenes Alexiad et les histoires de John Kinnamos et Niketas Choniates ; les dates, en particulier pour les campagnes de Jean II, ne sont souvent connues que jusqu’à l’année."
"The frontier was never a line. Turkish nomads grazed and raided far inside the lands the empire claimed, and towns changed hands repeatedly; the map shows the broad picture.": "La frontière n’a jamais été une ligne. Des nomades turcs ont piqué et attaqué loin à l’intérieur des terres revendiquées par l’empire, et les villes ont changé de mains à plusieurs reprises ; la carte montre l’image large."
