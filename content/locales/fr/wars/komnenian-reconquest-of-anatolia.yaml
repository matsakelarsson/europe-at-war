"1119–1143": "1119–1143"
"Alexios’s son John II Komnenos spent most of his reign on campaign. He took Laodicea in 1119 and Sozopolis in 1120, reopening the road to Attaleia on the south coast. In the 1130s he fought the Danishmendids of the north, taking Kastamonu in 1133 and Gangra soon after, though Kastamonu was lost again. In 1137 he marched into Cilicia and conquered the Armenian principality there, taking Tarsus, Adana, Mopsuestia and Anazarbus; its prince, Levon I, was taken prisoner to Constantinople with his family.": "Alexios son fils John II Komnenos a passé la majeure partie de son règne en campagne. Il a pris Laodicée en 1119 et Sozopolis en 1120, rouvrant la route à Attaleia sur la côte sud. Dans les années 1130, il a combattu les mendides danois du nord, prenant Kastamonu en 1133 et Gangra peu après, bien que Kastamonu ait été perdu à nouveau. En 1137, il marcha en Cilicie et y conquit la principauté arménienne, prenant Tarse, Adana, Mopsuestia et Anazarbus ; son prince, Levon Ier, fut fait prisonnier à Constantinople avec sa famille."
"From Cilicia John marched on Antioch, besieged it and made its prince, Raymond of Poitiers, accept him as overlord. In 1138 he led a Byzantine and Frankish army into Muslim Syria, but the siege of Shaizar failed, while his Frankish allies held back, and when Zengi’s army approached John accepted the emir’s tribute and withdrew. A campaign against Neocaesarea in 1140 failed in bad weather. In 1142 John came back to Cilicia, intending to take Antioch itself, but in April 1143 he died after a hunting accident in the Taurus mountains.": "De Cilicie John marcha sur Antioche, l’assiégea et fit accepter son prince, Raymond de Poitiers. En 1138, il conduisit une armée byzantine et franque en Syrie musulmane, mais le siège de Shaizar échoua, tandis que ses alliés franquais retenaient, et quand l’armée de Zengis s’approchait de Jean accepta l’hommage des émirs et se retira. Une campagne contre Neocaesarea en 1140 a échoué par mauvais temps. En 1142, John est revenu à Cilicie, ayant l’intention de prendre Antioche lui-même, mais en avril 1143 il est mort après un accident de chasse dans les montagnes du Taureau."
