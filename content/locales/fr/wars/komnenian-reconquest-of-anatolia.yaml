"1097–1118": "1097–1118"
"The First Crusade gave Alexios I Komnenos his chance. After Nicaea surrendered to him in June 1097 and the crusaders marched east, his brother-in-law John Doukas led an army and a fleet down the west coast. Smyrna, held by the emir Tzachas, gave up without a fight, and in 1097–1098 Ephesus, Sardis, Philadelphia and Laodicea were taken from the Turks, restoring imperial rule over the rich valleys of western Anatolia. The Seljuks of Rum, who had lost Nicaea, moved their capital to Iconium and kept the central plateau.": "La première croisade a donné sa chance à Alexios I Komnenos. Après que Nicée se soit rendu à lui en juin 1097 et les croisés ont marché vers l’est, son beau-frère John Doukas a dirigé une armée et une flotte sur la côte ouest. Smyrne, tenue par l’émir Tzachas, abandonna sans se battre, et en 1097-1098 Éphèse, Sardis, Philadelphie et Laodicée furent enlevés aux Turcs, rétablissant la domination impériale sur les riches vallées de l’Anatolie occidentale. Les Seljuks de Rum, qui avaient perdu Nicée, emmenèrent leur capitale à Iconium et gardèrent le plateau central."
"For the rest of his reign Alexios defended these gains against Turkish raids while also fighting Bohemond and the Normans. In 1116, already ill, he led an army into the interior and beat Sultan Malik Shah near Philomelion. The sultan agreed to a peace, and Alexios brought the Greek inhabitants of the region back with him to settle inside the empire. When he died in August 1118, the Byzantines again held the northern and western coastlands of Anatolia, though the frontier with the Turks remained open to raids.": "Pendant le reste de son règne Alexios a défendu ces gains contre les raids turcs tout en combattant Bohemond et les Normands. En 1116, déjà malade, il a conduit une armée dans l’intérieur et battu Sultan Malik Shah près de Philomelion. Le sultan a accepté la paix, et Alexios a ramené les habitants grecs de la région avec lui pour s’installer à l’intérieur de l’empire. Lorsqu'il mourut en août 1118, les Byzantins retenaient les côtes nord et ouest de l’Anatolie, bien que la frontière avec les Turcs restait ouverte aux raids."
