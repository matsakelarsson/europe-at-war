"1146–1177": "1146–1177"
"John’s son Manuel I Komnenos mostly kept the peace with the Seljuks of Rum, leading an army to the walls of Iconium only once, in 1146. Sultan Kilij Arslan II visited Constantinople in 1161–1162 and accepted Manuel as his overlord, but used the peace to conquer the Danishmendid emirates. In 1176 Manuel set out with a large army and a siege train to take Iconium and end the sultanate. On 17 September the Turks ambushed the long column in the Tzybritze pass, near the ruined fortress of Myriokephalon in the mountains west of Iconium.": "Le fils de Jean Manuel I Komnenos a surtout gardé la paix avec les Seljuks de Rum, conduisant une armée aux murs de l’Iconium une seule fois, en 1146. Sultan Kilij Arslan II visite Constantinople en 1161–1162 et accepte Manuel comme son souverain, mais utilise la paix pour conquérir les émirats danois. En 1176 Manuel partit avec une grande armée et un train de siège pour prendre Iconium et terminer le sultanat. Le 17 septembre, les Turcs embusqués la longue colonne dans le col Tzybritze, près de la forteresse ruinée de Myriokephalon dans les montagnes à l’ouest d’Iconium."
"The baggage train and the right wing, led by Manuel’s brother-in-law Baldwin of Antioch, were cut to pieces. The main army fought its way through, and Kilij Arslan offered peace on condition that Manuel demolished the forts he had built at Dorylaeum and Sublaeum. Manuel himself compared the defeat to Manzikert, but most of his army survived, and in 1177 a Byzantine army destroyed a Turkish raiding force at Hyelion and Leimocheir on the Meander. Myriokephalon nonetheless ended the Byzantine hope of recovering the plateau, and after Manuel’s death in 1180 the empire’s hold on Anatolia weakened again.": "Le train à bagages et l’aile droite, dirigé par le beau-frère d’Antioche de Manuels Baldwin, ont été coupés en morceaux. L’armée principale a combattu son passage, et Kilij Arslan a offert la paix à condition que Manuel démolisse les forts qu’il avait construits à Dorylaeum et Sublaeum. Manuel lui-même a comparé la défaite à Manzikert, mais la plupart de son armée a survécu, et en 1177 une armée byzantine a détruit une force de raid turque à Hyélion et Leimocheir sur le Meander. Myriokephalon a néanmoins mis fin à l’espoir byzantin de récupérer le plateau, et après la mort de Manuel en 1180 l’empire tient à nouveau sur Anatolie affaiblie."
