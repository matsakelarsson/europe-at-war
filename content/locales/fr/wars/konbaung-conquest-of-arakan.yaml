# French translations of the catalogue text (wave 11); step bodies follow later.
Konbaung conquest of Arakan: Conquête de l’Arakan par les Konbaung
? "The campaign in which King Bodawpaya of Burma ended the independence of Arakan, the coastal kingdom of Mrauk U on the Bay of Bengal, which had been weakened by decades of factional strife between its kings and nobles. On 2 December 1784 the crown prince Thado Minsaw led more than 20,000 men, with 2,500 horse and 200 elephants, across the Arakan Yoma by three passes, while a flotilla sailed up the coast from Negrais and landed on Ramree island. On 31 December the Arakanese king attacked the Burmese camp at Laungkyet, near his capital, and was defeated; Mrauk U fell on 1 or 2 January 1785 (some sources say 31 December 1784). Maha Thammada was taken to Amarapura with his family and died there a captive. The Burmese carried off the Mahamuni image, the palladium of Arakan, to Amarapura, along with other bronzes, and deported more than 20,000 people. Arakan became a Burmese province under four governors. Burmese rule was harsh and resisted: some 35,000 Arakanese fled to British-ruled Chittagong, revolts broke out in 1794 and under Chin Byan from 1811, and the border with British Bengal became one of the grievances that led to the First Anglo-Burmese War in 1824."
: "La campagne au cours de laquelle le roi Bodawpaya de Birmanie mit fin à l’indépendance de l’Arakan, le royaume côtier de Mrauk U sur le golfe du Bengale, affaibli par des décennies de luttes de factions entre ses rois et ses nobles. Le 2 décembre 1784, le prince héritier Thado Minsaw conduisit plus de 20 000 hommes, avec 2 500 cavaliers et 200 éléphants, à travers l’Arakan Yoma par trois cols, tandis qu’une flottille remontait la côte depuis Negrais et débarquait sur l’île de Ramree. Le 31 décembre, le roi d’Arakan attaqua le camp birman de Laungkyet, près de sa capitale, et fut battu ; Mrauk U tomba le 1er ou le 2 janvier 1785 (le 31 décembre 1784 selon certaines sources). Maha Thammada fut emmené à Amarapura avec sa famille et y mourut en captivité. Les Birmans emportèrent à Amarapura la statue du Mahamuni, palladium de l’Arakan, ainsi que d’autres bronzes, et déportèrent plus de 20 000 personnes. L’Arakan devint une province birmane confiée à quatre gouverneurs. La domination birmane fut dure et contestée : quelque 35 000 Arakanais s’enfuirent vers Chittagong, sous domination britannique, des révoltes éclatèrent en 1794 puis, sous Chin Byan, à partir de 1811, et la frontière avec le Bengale britannique devint l’un des griefs qui menèrent à la première guerre anglo-birmane en 1824."
