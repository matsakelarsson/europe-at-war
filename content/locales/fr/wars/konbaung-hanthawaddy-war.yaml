# French translations of the catalogue text (wave 11); step bodies follow later.
Mon revolt and the Konbaung–Hanthawaddy War: Révolte môn et guerre Konbaung–Hanthawaddy
? The war in which the Mon south of Burma broke away from the declining Toungoo kingdom of Ava, destroyed it, and was in turn conquered by Alaungpaya, the founder of the Konbaung dynasty. In 1740 the people of Pegu killed Ava’s governor and restored the old kingdom of Hanthawaddy, which by 1745 held Lower Burma up to Prome and Toungoo. Under Binnya Dala, with French arms, it invaded the north in 1751 and took Ava in March 1752, ending the Toungoo dynasty. But a village headman of Moksobo (Shwebo), Aung Zeya, proclaimed himself king as Alaungpaya, beat the Hanthawaddy garrisons and by January 1754 had retaken Ava. A Hanthawaddy counter-offensive in 1754 failed; Pegu’s execution of the captive Toungoo king and persecution of southern Burmans turned the war into a conflict between Burmans and Mon. In 1755 Alaungpaya overran the Irrawaddy delta and founded Yangon; the French-held port of Syriam fell in July 1756 after fourteen months, and Pegu was stormed on 6 May 1757, its people massacred and its walls razed. Burma was united under the Konbaung dynasty, and thousands of Mon fled to Siam.
: La guerre au cours de laquelle le sud môn de la Birmanie se détacha du royaume taungû déclinant d’Ava, le détruisit, puis fut à son tour conquis par Alaungpaya, fondateur de la dynastie Konbaung. En 1740, les habitants de Pégou tuèrent le gouverneur d’Ava et restaurèrent l’ancien royaume de Hanthawaddy, qui en 1745 tenait la Basse-Birmanie jusqu’à Prome et Toungoo. Sous Binnya Dala, avec des armes françaises, il envahit le nord en 1751 et prit Ava en mars 1752, mettant fin à la dynastie Taungû. Mais un chef de village de Moksobo (Shwebo), Aung Zeya, se proclama roi sous le nom d’Alaungpaya, battit les garnisons de Hanthawaddy et, en janvier 1754, avait repris Ava. Une contre-offensive de Hanthawaddy échoua en 1754 ; l’exécution par Pégou du roi taungû captif et la persécution des Birmans du sud firent de la guerre un conflit entre Birmans et Môns. En 1755, Alaungpaya conquit le delta de l’Irrawaddy et fonda Yangon ; le port de Syriam, tenu par les Français, tomba en juillet 1756 au bout de quatorze mois, et Pégou fut prise d’assaut le 6 mai 1757, ses habitants massacrés et ses murailles rasées. La Birmanie fut unifiée sous la dynastie Konbaung, et des milliers de Môns s’enfuirent au Siam.
