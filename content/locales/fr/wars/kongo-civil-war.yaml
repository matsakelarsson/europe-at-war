# French translations of the catalogue text (wave 13); step bodies follow later.
Kongo Civil War: Guerre civile du Kongo
? "The war of succession that divided the Kingdom of Kongo for more than forty years after King António I was killed by the Portuguese at Mbwila in 1665. Two branches of the royal family, the House of Kinlaza, to which António belonged, and the House of Kimpanzu, fought for the throne, while the rulers of Soyo, the da Silva, made and unmade kings. In 1678 the Kinlaza king Pedro III, with hired Jaga soldiers, attacked São Salvador (Mbanza Kongo), killed the Kimpanzu king Daniel I and burned the city, and the old capital was abandoned. For a generation rival kings ruled from mountain strongholds: the Kinlaza at Mbula (Lemba) and Kibangu, the Kimpanzu at Mbamba Lovata on Soyo’s border. From 1704 a young noblewoman, Beatriz Kimpa Vita, who said that St Anthony had possessed her, led thousands of followers, the Antonians, to resettle the ruined capital and demand a reunited kingdom; King Pedro IV of Kibangu had her burned as a heretic on 2 July 1706. On 15 February 1709 Pedro IV took São Salvador from the Antonians, and on 4 October 1709 he defeated his last Kinlaza rival, João II, at Mbula. He pardoned the Kimpanzu and arranged for the crown to rotate between the branches, which kept a fragile peace for half a century, but Kongo never regained its former power. The war fed the Atlantic slave trade: every faction sold captives, and more than 30,000 Antonians are said to have been sold after Pedro IV’s victory, through Loango to Dutch and English ships bound for the Caribbean and North America and through Luanda to Brazil."
: "La guerre de succession qui divisa le royaume du Kongo pendant plus de quarante ans après la mort du roi António Ier, tué par les Portugais à Mbwila en 1665. Deux branches de la famille royale, la maison des Kinlaza, à laquelle appartenait António, et celle des Kimpanzu, se disputèrent le trône, tandis que les souverains du Soyo, les da Silva, faisaient et défaisaient les rois. En 1678, le roi kinlaza Pedro III, avec des soldats jaga à sa solde, attaqua São Salvador (Mbanza Kongo), tua le roi kimpanzu Daniel Ier et incendia la ville, et l’ancienne capitale fut abandonnée. Pendant une génération, des rois rivaux régnèrent depuis des places fortes de montagne : les Kinlaza à Mbula (Lemba) et à Kibangu, les Kimpanzu à Mbamba Lovata, à la frontière du Soyo. À partir de 1704, une jeune noble, Beatriz Kimpa Vita, qui se disait possédée par saint Antoine, conduisit des milliers de fidèles, les antoniens, à repeupler la capitale en ruine et à exiger la réunification du royaume ; le roi Pedro IV de Kibangu la fit brûler comme hérétique le 2 juillet 1706. Le 15 février 1709, Pedro IV prit São Salvador aux antoniens et, le 4 octobre 1709, il battit son dernier rival kinlaza, João II, à Mbula. Il pardonna aux Kimpanzu et organisa une alternance de la couronne entre les branches, ce qui maintint une paix fragile pendant un demi-siècle, mais le Kongo ne retrouva jamais son ancienne puissance. La guerre alimenta la traite atlantique : chaque faction vendait des captifs, et plus de 30 000 antoniens auraient été vendus après la victoire de Pedro IV, par Loango à des navires hollandais et anglais en partance pour les Caraïbes et l’Amérique du Nord, et par Luanda vers le Brésil."
