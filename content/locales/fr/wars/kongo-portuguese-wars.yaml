# French translations of the catalogue text (wave 13); step bodies follow later.
Kongo–Portuguese wars: Guerres entre le Kongo et le Portugal
? "Three wars between the Kingdom of Kongo, Christian since the early 16th century and long Portugal’s partner in trade, and the Portuguese colony of Angola, founded in 1575 on land that Kongo claimed. In 1622 the governor João Correia de Sousa, hoping for captives as his predecessor had taken them from Ndongo, sent an army with Imbangala mercenaries into Kongo’s southern province of Mbamba; it won at Mbumbi on 18 December 1622, killing the duke of Mbamba, but King Pedro II beat it at Mbanda Kasi in January 1623, the governor was driven out by Luanda’s own settlers, and Kongo captives were returned. Pedro II then proposed an alliance to the Dutch, which bore fruit when the Dutch held Luanda in 1641–1648 (see the Dutch occupation of Luanda). After the Portuguese came back, the rivalry turned on the Dembos, the small states between the two powers. In 1665 a succession dispute in one of them, Mbwila, brought both armies into the field, and on 29 October 1665 the Portuguese under Luís Lopes de Sequeira destroyed the Kongo army; King António I was killed and beheaded, and his death opened the Kongo Civil War. In 1670 an Angolan army invaded Soyo, the breakaway coastal province that dominated Kongo’s politics, but on 18 October 1670 the Soyo army, with troops from Ngoyo and guns from the Dutch, annihilated it at Kitombo. Portugal did not attack Kongo again until the 19th century, and a papal mediation later secured recognition of Soyo’s independence. Each war fed the Atlantic slave trade: captives taken by the Angolan armies and their Imbangala allies were shipped from Luanda, mostly to Brazil."
: "Trois guerres entre le royaume du Kongo, chrétien depuis le début du XVIe siècle et longtemps partenaire commercial du Portugal, et la colonie portugaise de l’Angola, fondée en 1575 sur des terres que revendiquait le Kongo. En 1622, le gouverneur João Correia de Sousa, qui espérait faire des captifs comme son prédécesseur en avait fait au Ndongo, envoya une armée accompagnée de mercenaires imbangala dans le Mbamba, province méridionale du Kongo ; elle l’emporta à Mbumbi le 18 décembre 1622, tuant le duc de Mbamba, mais le roi Pedro II la battit à Mbanda Kasi en janvier 1623, le gouverneur fut chassé par les colons mêmes de Luanda, et les captifs kongo furent rendus. Pedro II proposa ensuite une alliance aux Hollandais, qui porta ses fruits lorsque ceux-ci tinrent Luanda en 1641–1648 (voir l’occupation hollandaise de Luanda). Après le retour des Portugais, la rivalité se porta sur les Dembos, les petits États situés entre les deux puissances. En 1665, une querelle de succession dans l’un d’eux, le Mbwila, fit entrer les deux armées en campagne et, le 29 octobre 1665, les Portugais commandés par Luís Lopes de Sequeira anéantirent l’armée kongo ; le roi António Ier fut tué et décapité, et sa mort ouvrit la guerre civile du Kongo. En 1670, une armée angolaise envahit le Soyo, la province côtière sécessionniste qui dominait la vie politique du Kongo, mais le 18 octobre 1670, l’armée du Soyo, renforcée de troupes du Ngoyo et de fusils fournis par les Hollandais, l’anéantit à Kitombo. Le Portugal n’attaqua plus le Kongo avant le XIXe siècle, et une médiation pontificale obtint plus tard la reconnaissance de l’indépendance du Soyo. Chaque guerre alimenta la traite atlantique : les captifs faits par les armées angolaises et leurs alliés imbangala étaient embarqués à Luanda, pour la plupart vers le Brésil."
