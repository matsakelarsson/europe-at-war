# French translations of the catalogue text (wave 13); step bodies follow later.
Kongo-Wara rebellion: Rébellion du Kongo-Wara
? The largest rising in French Equatorial Africa and French Cameroon between the world wars, also called the War of the Hoe Handle or the Gbaya (Baya) war. In the western part of today’s Central African Republic and the neighbouring parts of Cameroon, Chad and the Republic of the Congo, the Gbaya and their neighbours suffered under concession companies that forced them to collect rubber, under head tax and porterage, and from 1921 under the recruitment of forced labourers for the Congo–Ocean railway, whose construction killed an estimated 17,000 to more than 20,000 workers. From about 1924 the Gbaya healer and prophet Karnou (Barka Ngaïnoumbey) of Nahing, between Bouar and Baboua, preached refusal of work for Europeans and of taxes, a boycott of European goods and solidarity among Black people, and gave his followers a small hooked stick shaped like a hoe handle (kongo wara) as a medicine against bullets. Fighting broke out in mid-1928; Karnou’s followers burned Bouar, and the French sent troops. Karnou was killed at Nahing on 11 December 1928, but the rising spread to the Lobaye, southern Chad, eastern Cameroon and the northern French Congo and lasted until 1931, ending with the “war of the caves”. The insurgents’ dead have been estimated at more than 10,000; French losses are not known. France imprisoned and executed the movement’s leaders, forced villagers into designated settlements where they could be watched, and afterwards did not renew the leases of the concession companies in the region. The war was little noticed in France, where communists used it to attack colonial rule; Barthélemy Boganda later presented himself as Karnou’s heir.
: Le plus grand soulèvement qu’aient connu l’Afrique-Équatoriale française et le Cameroun français dans l’entre-deux-guerres, appelé aussi guerre du manche de houe ou guerre des Gbaya (Baya). Dans l’ouest de l’actuelle République centrafricaine et dans les régions voisines du Cameroun, du Tchad et de la République du Congo, les Gbaya et leurs voisins souffraient des compagnies concessionnaires qui les forçaient à récolter le caoutchouc, de l’impôt de capitation et du portage et, à partir de 1921, du recrutement de travailleurs forcés pour le chemin de fer Congo-Océan, dont la construction coûta la vie à un nombre d’ouvriers estimé entre 17 000 et plus de 20 000. À partir de 1924 environ, le guérisseur et prophète gbaya Karnou (Barka Ngaïnoumbey), de Nahing, entre Bouar et Baboua, prêcha le refus du travail pour les Européens et de l’impôt, le boycott des marchandises européennes et la solidarité entre Noirs, et remit à ses fidèles un petit bâton crochu en forme de manche de houe (kongo wara), censé les protéger des balles. Les combats éclatèrent au milieu de l’année 1928 ; les partisans de Karnou incendièrent Bouar, et les Français envoyèrent des troupes. Karnou fut tué à Nahing le 11 décembre 1928, mais le soulèvement s’étendit à la Lobaye, au sud du Tchad, à l’est du Cameroun et au nord du Congo français, et dura jusqu’en 1931, s’achevant par la « guerre des grottes ». Les morts parmi les insurgés ont été estimés à plus de 10 000 ; les pertes françaises ne sont pas connues. La France emprisonna et exécuta les chefs du mouvement, regroupa de force les villageois dans des localités désignées où ils pouvaient être surveillés, et ne renouvela pas ensuite les baux des compagnies concessionnaires de la région. La guerre passa presque inaperçue en France, où les communistes s’en servirent pour attaquer la domination coloniale ; Barthélemy Boganda se présenta plus tard comme l’héritier de Karnou.
