# French translations of the catalogue text (wave 11); step bodies follow later.
Kongsi wars in West Borneo: Guerres des kongsis de Bornéo occidental
? "Wars between the Dutch East Indies and the self-governing Chinese gold-mining federations (kongsis) of West Borneo: the Second Kongsi War of 1850–1854 against the kongsis of Montrado, and the Mandor rising of 1884–1885 that ended the last of them, the Lanfang kongsi. Hakka miners had organised kongsis around Montrado and Mandor since the 1770s, with their own councils, courts and militias; the largest were the Heshun federation (Fosjoen) of Montrado, led by the Thaikong (Dagang) kongsi, the Samtiaokioe (Santiaogou) kongsi, which had broken away and held Sepang, Seminis and the port of Pamangkat, and the Lanfang kongsi at Mandor. In 1850, as the Dutch moved against the Montrado kongsis’ trade outside their control and tried to bring them under the new residency of Sambas and Pontianak, the Thaikong overran Sepang and Pamangkat, and the Samtiaokioe turned to the Sultan of Sambas and the Dutch. A Dutch force of about 400 men took the fortified Pamangkat in September 1850, its commander dying of his wounds, and a second attack in November failed; envoys of the three kongsis then made a settlement that the resident took to Batavia in February 1851. When a government commissioner deposed the Montrado headman and occupied Sepang in early 1853, fighting broke out again and went against the Dutch in May and June. In May 1854 Lieutenant Colonel Augustus Andresen landed about 2,200 men at Sambas and Pontianak, took Singkawang and entered Montrado on 2 June 1854; the kongsis were declared dissolved, the Samtiaokioe with them, and anyone found with arms faced death. Resistance through secret societies went on until 1856. The Lanfang kongsi, which had not fought the Dutch, kept its autonomy until its head, Liu Asheng, died in 1884. When the Dutch took over Mandor, Chinese and Dayak fighters killed the controller J. C. de Rijk on 23 October 1884 and fought on until February 1885; the Lanfang lands were divided among Pontianak, Mempawah and Landak, and many of its people left for Sumatra, Singapore and Sarawak."
: "Les guerres entre les Indes orientales néerlandaises et les fédérations autonomes de mineurs d’or chinois (kongsis) de Bornéo occidental : la deuxième guerre des kongsis, en 1850–1854, contre les kongsis de Montrado, et le soulèvement de Mandor, en 1884–1885, qui mit fin au dernier d’entre eux, le kongsi Lanfang. Depuis les années 1770, les mineurs hakkas s’étaient organisés en kongsis autour de Montrado et de Mandor, avec leurs propres conseils, tribunaux et milices ; les plus grands étaient la fédération Heshun (Fosjoen) de Montrado, dirigée par le kongsi Thaikong (Dagang), le kongsi Samtiaokioe (Santiaogou), qui avait fait sécession et tenait Sepang, Seminis et le port de Pamangkat, et le kongsi Lanfang à Mandor. En 1850, alors que les Néerlandais s’en prenaient au commerce des kongsis de Montrado qui échappait à leur contrôle et cherchaient à les soumettre à la nouvelle résidence de Sambas et Pontianak, le Thaikong s’empara de Sepang et de Pamangkat, et le Samtiaokioe se tourna vers le sultan de Sambas et les Néerlandais. Une force néerlandaise d’environ 400 hommes prit la place fortifiée de Pamangkat en septembre 1850, son commandant succombant à ses blessures, et une seconde attaque échoua en novembre ; des envoyés des trois kongsis conclurent alors un accord que le résident porta à Batavia en février 1851. Lorsqu’un commissaire du gouvernement destitua le chef de Montrado et occupa Sepang au début de 1853, les combats reprirent et tournèrent au désavantage des Néerlandais en mai et juin. En mai 1854, le lieutenant-colonel Augustus Andresen débarqua environ 2 200 hommes à Sambas et à Pontianak, prit Singkawang et entra dans Montrado le 2 juin 1854 ; les kongsis furent déclarés dissous, le Samtiaokioe compris, et quiconque était trouvé en possession d’armes encourait la mort. La résistance menée par des sociétés secrètes se poursuivit jusqu’en 1856. Le kongsi Lanfang, qui n’avait pas combattu les Néerlandais, conserva son autonomie jusqu’à la mort de son chef, Liu Asheng, en 1884. Lorsque les Néerlandais prirent en main Mandor, des combattants chinois et dayaks tuèrent le contrôleur J. C. de Rijk le 23 octobre 1884 et poursuivirent la lutte jusqu’en février 1885 ; les terres du Lanfang furent partagées entre Pontianak, Mempawah et Landak, et nombre de ses habitants partirent pour Sumatra, Singapour et le Sarawak."
