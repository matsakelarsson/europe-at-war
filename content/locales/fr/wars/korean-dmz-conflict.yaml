# French translations of the catalogue text (wave 10); step bodies follow later.
Korean DMZ conflict: Conflit de la DMZ coréenne
? A low-level war between North Korea and the South Korean and American forces in South Korea from 1966 to 1969, sometimes called the Second Korean War. With the United States and South Korea heavily committed in Vietnam, Kim Il-sung set out in October 1966 to challenge the armistice and to stir up a guerrilla movement in the South. North Korean units ambushed patrols along the Demilitarized Zone, landed agents on the coasts and, in January 1968, sent a commando unit to kill President Park Chung-hee in Seoul; two days later North Korean warships seized the American intelligence ship Pueblo off Wonsan. In late 1968 some 120 commandos landed on the east coast between Uljin and Samcheok to set up guerrilla bases in the mountains and were hunted down. South Korea answered with fences, patrols, a reservist militia and secret raids of its own across the line. The fighting killed 299 South Korean and 81 American soldiers and 47 South Korean civilians, and North Korea lost at least 397 dead; the uprising Kim hoped for never came, and the campaign died down in 1969.
: Une guerre de faible intensité, parfois appelée la seconde guerre de Corée, qui opposa de 1966 à 1969 la Corée du Nord aux forces sud-coréennes et américaines stationnées en Corée du Sud. Alors que les États-Unis et la Corée du Sud étaient lourdement engagés au Vietnam, Kim Il-sung entreprit en octobre 1966 de défier l’armistice et de susciter un mouvement de guérilla dans le Sud. Des unités nord-coréennes tendirent des embuscades aux patrouilles le long de la zone démilitarisée, débarquèrent des agents sur les côtes et, en janvier 1968, envoyèrent un commando tuer le président Park Chung-hee à Séoul ; deux jours plus tard, des navires de guerre nord-coréens s’emparèrent du navire de renseignement américain Pueblo au large de Wonsan. À la fin de 1968, quelque 120 commandos débarquèrent sur la côte est entre Uljin et Samcheok pour établir des bases de guérilla dans les montagnes, et furent traqués. La Corée du Sud répondit par des clôtures, des patrouilles, une milice de réservistes et ses propres raids secrets de l’autre côté de la ligne. Les combats tuèrent 299 soldats sud-coréens et 81 soldats américains ainsi que 47 civils sud-coréens, et la Corée du Nord perdit au moins 397 morts ; le soulèvement qu’espérait Kim ne se produisit jamais, et la campagne s’essouffla en 1969.
