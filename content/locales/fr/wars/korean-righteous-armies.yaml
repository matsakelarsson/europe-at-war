# French translations of the catalogue text (wave 10); step bodies follow later.
Korean righteous armies (1895–1915): Armées vertueuses coréennes (1895–1915)
? "Armed resistance to Japanese control of Korea by volunteer “righteous armies” (uibyeong), named after the militias that had fought the Japanese invasions of the 1590s. The first wave rose in 1896 after Japanese agents murdered Queen Min in the palace in Seoul in October 1895 and the government ordered men to cut their topknots; it faded after King Gojong took refuge in the Russian legation. A second wave followed the protectorate treaty of 1905, and the largest after Japan forced Gojong to abdicate and disbanded the Korean army in 1907: thousands of former soldiers joined the scholars, peasants, hunters and miners in the hills. A combined army of thirteen provinces tried to march on Seoul in January 1908 and was driven back, and a Japanese sweep through Jeolla in 1909 broke the strongest remaining bands. After the annexation of 1910 the survivors went to Manchuria and the Russian Far East, and the last leader in Korea, Chae Eung-eon, was captured in 1915. Japanese figures count some 17,800 Korean fighters killed between 1906 and 1911."
: "La résistance armée à la mainmise japonaise sur la Corée, menée par des « armées vertueuses » (uibyeong) de volontaires, ainsi nommées d’après les milices qui avaient combattu les invasions japonaises des années 1590. La première vague se leva en 1896, après que des agents japonais eurent assassiné la reine Min dans le palais de Séoul en octobre 1895 et que le gouvernement eut ordonné aux hommes de couper leur chignon ; elle retomba après que le roi Gojong se fut réfugié à la légation russe. Une deuxième vague suivit le traité de protectorat de 1905, et la plus importante éclata après que le Japon eut contraint Gojong à abdiquer et dissous l’armée coréenne en 1907 : des milliers d’anciens soldats rejoignirent dans les collines les lettrés, les paysans, les chasseurs et les mineurs. Une armée unifiée des treize provinces tenta de marcher sur Séoul en janvier 1908 et fut repoussée, et un ratissage japonais dans le Jeolla en 1909 brisa les plus fortes bandes restantes. Après l’annexion de 1910, les survivants gagnèrent la Mandchourie et l’Extrême-Orient russe, et le dernier chef en Corée, Chae Eung-eon, fut capturé en 1915. Les chiffres japonais font état de quelque 17 800 combattants coréens tués entre 1906 et 1911."
