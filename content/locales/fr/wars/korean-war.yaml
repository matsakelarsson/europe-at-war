# French translations of the catalogue text (wave 10); step bodies follow later.
Korean War: Guerre de Corée
? The war between North Korea, backed by China and the Soviet Union, and South Korea, backed by the United States and a United Nations Command of sixteen countries. On 25 June 1950 the North Korean army crossed the 38th parallel, the line along which the Soviet Union and the United States had divided Korea in 1945, and within six weeks it had pressed the South Korean and American forces into a perimeter around Busan. The landing at Incheon in September turned the war. UN forces crossed the parallel and drove towards the Chinese border, until Chinese armies entered the war in October and November and pushed them back south of Seoul. From mid-1951 the front settled near the parallel, and two years of armistice talks, deadlocked over the return of prisoners, went on alongside costly fighting for hills and a bombing campaign that destroyed most of the North’s towns. Both sides killed large numbers of civilians they suspected of supporting the other. The armistice of 27 July 1953 ended the fighting and created the Demilitarized Zone, but no peace treaty has ever been signed, and the war has formally never ended. Perhaps 3 million Koreans died, most of them civilians, along with some 180,000–400,000 Chinese and about 36,500 Americans.
: La guerre qui opposa la Corée du Nord, soutenue par la Chine et l’Union soviétique, à la Corée du Sud, soutenue par les États-Unis et par un Commandement des Nations unies regroupant seize pays. Le 25 juin 1950, l’armée nord-coréenne franchit le 38e parallèle, la ligne le long de laquelle l’Union soviétique et les États-Unis avaient divisé la Corée en 1945, et en six semaines elle avait repoussé les forces sud-coréennes et américaines dans un périmètre autour de Busan. Le débarquement d’Incheon, en septembre, renversa le cours de la guerre. Les forces de l’ONU franchirent le parallèle et avancèrent vers la frontière chinoise, jusqu’à ce que des armées chinoises entrent en guerre en octobre et en novembre et les repoussent au sud de Séoul. À partir du milieu de 1951, le front se stabilisa près du parallèle, et deux années de négociations d’armistice, bloquées sur la question du retour des prisonniers, s’accompagnèrent de coûteux combats pour des collines et d’une campagne de bombardements qui détruisit la plupart des villes du Nord. Les deux camps tuèrent un grand nombre de civils qu’ils soupçonnaient de soutenir l’adversaire. L’armistice du 27 juillet 1953 mit fin aux combats et créa la zone démilitarisée, mais aucun traité de paix n’a jamais été signé, et la guerre n’a officiellement jamais pris fin. Peut-être 3 millions de Coréens moururent, pour la plupart des civils, ainsi que quelque 180 000 à 400 000 Chinois et environ 36 500 Américains.
