"July – October 1794": "juillet – octobre 1794"
"From 13 July about 41,000 Russians and 25,000 Prussians, the latter led by Frederick William II, besieged Warsaw, defended by Kościuszko behind earthworks. In August Greater Poland rose behind the Prussian lines, and on 6 September the besiegers withdrew. Jan Henryk Dąbrowski led a raid into Greater Poland and took Bydgoszcz on 2 October. In Lithuania, though, the Russians took back Vilnius on 12 August.": "À partir du 13 juillet, environ 41 000 Russes et 25 000 Prussiens, ce dernier dirigé par Frederick William II, assiégé Varsovie, défendu par Kościuszko derrière les travaux de terre. En août la Grande Pologne s’élève derrière les lignes prussiennes, et le 6 septembre les assiéges se retirent. En Lituanie, cependant, les Russes ont repris Vilnius le 12 août."
"Catherine II sent her best general, Alexander Suvorov, north from Ukraine. He beat the Lithuanian corps of Karol Sierakowski near Brest in September. To stop Ivan Fersen’s army joining him, Kościuszko moved to block it at Maciejowice, where Fersen attacked on 10 October before Polish reinforcements arrived. The Polish army was beaten, and Kościuszko was wounded and taken prisoner. He was held in St Petersburg until 1796.": "Catherine II envoya son meilleur général, Alexander Suvorov, du nord de l’Ukraine. Il battit le corps lituanien de Karol Sierakowski près de Brest en septembre. Pour arrêter l’armée d’Ivan Fersen, Kościuszko emménagea pour le bloquer à Maciejuwice, où Fersen attaqua le 10 octobre avant l’arrivée des renforts polonais. Il fut détenu à Saint-Pétersbourg jusqu’en 1796."
