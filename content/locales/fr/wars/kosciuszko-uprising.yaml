"March – April 1794": "mars – avril 1794"
"After the Second Partition, Russian troops garrisoned what was left of Poland–Lithuania, and its army was ordered to shrink. In March 1794 General Antoni Madaliński refused to disband his cavalry brigade and marched it south towards Kraków. On 24 March, in Kraków’s market square, Tadeusz Kościuszko, a veteran of the American War of Independence and of the war of 1792, proclaimed an Act of Insurrection and took supreme command.": "Après la deuxième partition, les troupes russes ont garré ce qui restait de la Pologne-Lituanie, et son armée a reçu l’ordre de se rétrécir. En mars 1794, le général Antoni Madaliński refusa de dissoudre sa brigade de cavalerie et marcha vers le sud en direction de Cracovie. Le 24 mars, sur la place du marché de Cracovie, Tadeusz Kościuszko, ancien combattant de la guerre d’indépendance américaine et de la guerre de 1792, proclama un acte d’insurrection et prit le commandement suprême."
"He called up peasants as well as soldiers. On 4 April, at Racławice north of Kraków, his army of about 4,000 regulars and some 2,000 peasants armed with scythes beat a Russian corps. A charge by the scythemen took the Russian guns, and one of them, Wojciech Bartosz Głowacki, became a national hero. The victory was small in military terms but spread the rising across the country.": "Le 4 avril, à Racławice au nord de Cracovie, son armée d’environ 4 000 réguliers et quelque 2 000 paysans armés de faux ont battu un corps russe. Une charge par les faux a pris les armes russes, et l’un d’eux, Wojciech Bartosz Głowacki, est devenu un héros national. La victoire a été faible en termes militaires, mais a répandu la montée à travers le pays."
