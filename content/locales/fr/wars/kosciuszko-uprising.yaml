"Warsaw and Vilnius rise": "Varsovie et Vilnius se lèvent"
"April – June 1794": "avril – juin 1794"
"On 17 April the people of Warsaw, led among others by the shoemaker Jan Kiliński, rose against the Russian garrison. After two days of street fighting the Russians had lost 2,000–4,000 of about 5,000 men killed, wounded or captured, and their commander Iosif Igelström fled. On the night of 22–23 April Colonel Jakub Jasiński led a rising in Vilnius, and Lithuania joined the insurrection. Leaders of the Targowica Confederation were hanged in both cities, some after trials and some by mobs.": "Le 17 avril, le peuple de Varsovie, dirigé entre autres par le cordonnier Jan Kiliński, s’est levé contre la garnison russe. Après deux jours de combats de rue, les Russes avaient perdu entre 2000 et 4 000 sur environ 5 000 hommes tués, blessés ou capturés, et leur commandant Iosif Igelström s’était enfui. Dans la nuit du 22 au 23 avril, le colonel Jakub Jasiński a mené une montée à Vilnius et la Lituanie s’est jointe à l’insurrection. Les dirigeants de la Confédération de Targowica ont été pendus dans les deux villes, certains après des procès et d’autres par des foules."
"On 7 May, at Połaniec, Kościuszko freed the peasants from personal serfdom and cut their labour dues, though many nobles ignored the decree. Prussia now joined Russia. On 6 June a Russian and Prussian army, with King Frederick William II present, beat Kościuszko at Szczekociny, and on 15 June the Prussians occupied Kraków without a fight.": "Le 7 mai, à Połaniec, Kościuszko a libéré les paysans du servage personnel et coupé leurs droits de travail, bien que beaucoup de nobles ont ignoré le décret. La Prusse est maintenant entré en Russie. Le 6 juin, une armée russe et prussienne, avec le roi Frederick William II présent, battre Kościuszko à Szczekociny, et le 15 juin, les Prussiens ont occupé Cracovie sans se battre."
