"November 1794 – 1795": "novembre 1794 – 1795"
"Suvorov joined Fersen and on 4 November stormed Praga, the fortified suburb of Warsaw on the east bank of the Vistula. Russian troops then killed defenders and inhabitants alike; some estimates put the dead, soldiers and civilians together, at up to 20,000. Warsaw capitulated the next day to avoid the same fate. The last insurgent army, under Tomasz Wawrzecki, surrendered near Radoszyce on 16 November.": "Suvorov rejoint Fersen et le 4 novembre s’empare de Praga, la banlieue fortifiée de Varsovie sur la rive est de la Vistule. Les troupes russes tuent alors les défenseurs et les habitants ; certaines estimations mettent les morts, les soldats et les civils ensemble, jusqu’à 20 000. Varsovie capitule le lendemain pour éviter le même sort. La dernière armée insurgée, sous Tomasz Wawrzecki, s’est rendue près de Radoszyce le 16 novembre."
"Russia, Prussia and Austria divided what remained. Russia and Austria agreed terms in January 1795, and the final convention was signed on 24 October. Russia took Lithuania, western Belarus, western Volhynia and Courland; Prussia took Warsaw, Masovia and Podlasie; Austria took Kraków, Lublin and the lands between. Stanisław August abdicated at Grodno on 25 November 1795. Poland–Lithuania disappeared from the map, and no Polish state existed again until 1807.": "La Russie, la Prusse et l’Autriche ont convenu des conditions en janvier 1795, et la convention finale a été signée le 24 octobre. La Russie a pris la Lituanie, le Belarus occidental, la Volhynie occidentale et Courland ; la Prusse a pris Varsovie, Masovia et Podlasie ; l’Autriche a pris Cracovie, Lublin et les terres entre. Stanisław Août abdiquée à Grodno le 25 novembre 1795. Pologne–Lituanie disparut de la carte, et aucun État polonais n’existait à nouveau jusqu’en 1807."
