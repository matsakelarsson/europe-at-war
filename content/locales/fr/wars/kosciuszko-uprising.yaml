"Kościuszko Uprising": "Inauguration de Kościuszko"
"A national rising led by Tadeusz Kościuszko against Russian control after the Second Partition. It won at Racławice and drove the Russians out of Warsaw and Vilnius, but Russian and Prussian armies crushed it by November 1794, and in 1795 the Third Partition divided what was left of Poland–Lithuania between Russia, Prussia and Austria.": "Une montée nationale menée par Tadeusz Kościuszko contre le contrôle russe après la Seconde Partition. Il a gagné à Racławice et chassé les Russes de Varsovie et Vilnius, mais les armées russes et prussiennes l’ont écrasé en novembre 1794, et en 1795 la Troisième Partition a divisé ce qui restait de la Pologne-Lituanie entre la Russie, la Prusse et l’Autriche."
"Dates are New Style (Gregorian).": "Les dates sont New Style (Gregorian)."
