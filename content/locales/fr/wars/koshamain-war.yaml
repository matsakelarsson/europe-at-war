# French translations of the catalogue text (wave 10); step bodies follow later.
Koshamain’s War: Guerre de Koshamain
? An Ainu rising against the Japanese (Wajin) settlements in the far south of Ezo (Hokkaido). From the early 1400s traders and warriors from northern Honshu, under the Andō of Tsugaru, had settled along the coast of the Oshima peninsula, and by the 1450s their lords held a chain of fortified residences (tate) from Shinori, east of today’s Hakodate, to Hanazawa at Kaminokuni, later remembered as the twelve forts (Dōnan jūni-tate). Trade with them mattered more to the Ainu after Ming China’s hold on the lands to the north weakened, and quarrels grew. In 1456 at Shinori a Japanese smith killed an Ainu man in a dispute over the quality and price of a knife (makiri) he had ordered. In the fifth month of 1457 the Ainu, led by Koshamain, a chief of the east, rose from Mukawa in the east to Yoichi in the west, took the fort at Shinori and went on to take ten of the twelve forts; only Mobetsu, held by Andō Iemasa, and Hanazawa, held by Kakizaki Sueshige, did not fall. In 1458 Takeda Nobuhiro, a warrior who had crossed from northern Honshu with the Andō in 1454 and served at Hanazawa, killed Koshamain and his son with arrows at Nanaehama near Hakodate, and the rising fell apart. Nobuhiro married into the Kakizaki as Sueshige’s son-in-law and heir, and his descendants, renamed Matsumae, later ruled the Japanese enclave and its trade with the Ainu as the Matsumae domain. Fighting between Ainu and Wajin flared up again and again for about a century.
: Un soulèvement aïnou contre les établissements japonais (wajin) de l’extrême sud d’Ezo (Hokkaido). À partir du début des années 1400, des marchands et des guerriers du nord de Honshu, sous l’autorité des Andō de Tsugaru, s’étaient établis le long de la côte de la péninsule d’Oshima et, dans les années 1450, leurs seigneurs tenaient une chaîne de résidences fortifiées (tate) allant de Shinori, à l’est de l’actuelle Hakodate, à Hanazawa, à Kaminokuni, dont on se souviendrait plus tard comme des douze forts (Dōnan jūni-tate). Le commerce avec eux prit plus d’importance pour les Aïnous après l’affaiblissement de l’emprise de la Chine des Ming sur les terres situées au nord, et les querelles se multiplièrent. En 1456, à Shinori, un forgeron japonais tua un Aïnou au cours d’une dispute sur la qualité et le prix d’un couteau (makiri) que celui-ci lui avait commandé. Au cinquième mois de 1457, les Aïnous, menés par Koshamain, un chef de l’est, se soulevèrent de Mukawa à l’est jusqu’à Yoichi à l’ouest, prirent le fort de Shinori et s’emparèrent ensuite de dix des douze forts ; seuls Mobetsu, tenu par Andō Iemasa, et Hanazawa, tenu par Kakizaki Sueshige, ne tombèrent pas. En 1458, Takeda Nobuhiro, un guerrier venu du nord de Honshu avec les Andō en 1454 et qui servait à Hanazawa, tua Koshamain et son fils à coups de flèches à Nanaehama, près de Hakodate, et le soulèvement s’effondra. Nobuhiro entra dans la famille Kakizaki comme gendre et héritier de Sueshige, et ses descendants, qui prirent le nom de Matsumae, gouvernèrent plus tard l’enclave japonaise et son commerce avec les Aïnous sous la forme du domaine de Matsumae. Les combats entre Aïnous et Wajin reprirent à maintes reprises pendant environ un siècle.
