"1989 – March 1998": "1989 – mars 1998"
"In 1989 Serbia, led by Slobodan Milošević, took away most of the autonomy Kosovo had held under the Yugoslav constitution of 1974. Kosovo Albanians, the great majority of the province’s people, were dismissed in their tens of thousands from state jobs, and Albanian-language schools and the university moved into private houses. Under Ibrahim Rugova they voted for independence in an unofficial referendum in 1991, built parallel institutions and kept to peaceful resistance. When the Dayton Agreement of 1995 left Kosovo out, a small armed group, the Kosovo Liberation Army (KLA), began attacking Serbian police, and in 1997 it armed itself with weapons looted from depots in Albania during that country’s collapse into unrest.": "En 1989, la Serbie, dirigée par Slobodan Milošević, a enlevé la plus grande partie de l’autonomie du Kosovo en vertu de la constitution yougoslave de 1974. Les Albanais du Kosovo, la grande majorité des habitants de la province, ont été licenciés dans leurs dizaines de milliers d’emplois publics, et les écoles de langue albanaise et l’université ont emménagé dans des maisons privées. Lorsque l’Accord de Dayton de 1995 a quitté le Kosovo, un petit groupe armé, l’Armée de libération du Kosovo (ALK), a commencé à attaquer la police serbe et, en 1997, elle s’est armée d’armes pillées dans des dépôts en Albanie pendant que ce pays s’effondre dans les troubles."
"The KLA was strongest in Drenica, a hilly district west of Priština. On 28 February 1998 an ambush there killed four Serbian policemen, and police attacking the villages of Likoshan and Qirez killed more than two dozen Albanians, many of them civilians; the war is usually dated from that day. On 5–7 March special police besieged the compound of the KLA leader Adem Jashari at Prekaz and killed him and almost 60 members of his family, women and children among them. Belgrade called the operation a strike against terrorists; Albanians remembered it as a massacre, and thousands joined the KLA. On 31 March the UN Security Council placed an arms embargo on Yugoslavia.": "Le 28 février 1998, une embuscade a tué quatre policiers serbes et la police qui attaquait les villages de Likoshan et Qirez a tué plus de deux douzaine d’Albanais, dont beaucoup de civils ; la guerre date généralement de ce jour. Les 5 et 7 mars, la police spéciale a assiégé le complexe du dirigeant de l’UCK Adem Jashari à Prekaz et l’a tué ainsi que près de 60 membres de sa famille, femmes et enfants parmi eux. Belgrade a qualifié cette opération de frappe contre des terroristes ; les Albanais se sont souvenus qu’elle était un massacre et des milliers d’entre eux ont rejoint l’UCK. Le 31 mars, le Conseil de sécurité des Nations unies a imposé un embargo sur les armes à la Yougoslavie."
