"On 14 December 1998 gunmen killed six Serb teenagers in a café in Peć; no one was ever convicted. On 15 January 1999, after the KLA had killed several policemen nearby, Serbian police attacked the village of Račak, and the next day verifiers found the bodies of 45 Albanians, among them a woman and a 12-year-old boy. The head of the verification mission, William Walker, called it a massacre of civilians. Belgrade said the dead were KLA fighters killed in combat and ordered him out of the country. A Finnish forensic team found no evidence that the victims were anything other than unarmed civilians, but Serbian accounts still dispute what happened, and Račak became a turning point in Western policy.": "Le 14 décembre 1998, des hommes armés ont tué six adolescents serbes dans un café de Peć ; personne n’a jamais été condamné. Le 15 janvier 1999, après que l’UCK eut tué plusieurs policiers à proximité, la police serbe a attaqué le village de Račak, et le lendemain les vérificateurs ont trouvé les corps de 45 Albanais, dont une femme et un garçon de 12 ans. Belgrade a déclaré que les morts étaient des combattants de l’UCK tués au combat et lui ont ordonné de quitter le pays. Une équipe médico-légale finlandaise n’a trouvé aucune preuve que les victimes étaient autres que des civils non armés, mais les récits serbes continuent de contester ce qui s’est passé, et Račak est devenu un tournant dans la politique occidentale."
"The Contact Group of the great powers summoned both sides to the château of Rambouillet, near Paris, on 6 February. The draft agreement offered Kosovo broad autonomy within Yugoslavia for three years, guarded by a NATO-led force of about 30,000, with an appendix giving NATO troops free movement throughout Yugoslavia. The Kosovo Albanian delegation, led by the KLA’s Hashim Thaçi, signed it in Paris on 18 March; the Yugoslav and Serbian delegation refused any foreign troops. Yugoslav forces were already massing around Kosovo, and on 20 March the verifiers withdrew.": "Le 6 février, le Groupe de contact des grandes puissances a convoqué les deux parties au château de Rambouillet, près de Paris. Le projet d’accord offrait au Kosovo une large autonomie en Yougoslavie pendant trois ans, sous la garde d’une force dirigée par l’OTAN d’environ 30 000 hommes, avec un appendice donnant aux troupes de l’OTAN la liberté de mouvement dans toute la Yougoslavie. La délégation albanaise du Kosovo, dirigée par l’ALK Hashim Thaçi, l’a signée à Paris le 18 mars ; la délégation yougoslave et serbe a refusé toute troupes étrangères. Les forces yougoslaves se rassemblaient déjà autour du Kosovo et les vérificateurs se sont retirés le 20 mars."
