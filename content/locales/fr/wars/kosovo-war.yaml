"Through the spring the KLA spread from Drenica across central and western Kosovo, cutting roads and setting up checkpoints, and in July it claimed to hold up to 40 per cent of the province, though its hold on much of it was thin. On 17 July it seized the town of Orahovac, which police retook within days; dozens of Serbs abducted in the fighting were never seen again. From late July the Yugoslav Army and Serbian police counter-attacked with artillery, retook Mališevo and the KLA’s border stronghold of Junik, and burned villages as they went. By autumn some 200,000–300,000 people had been driven from their homes, tens of thousands of them sheltering in the hills.": "Au printemps, l’UCK s’est propagée de Drenica à travers le centre et l’ouest du Kosovo, coupant les routes et établissant des points de contrôle, et en juillet elle a prétendu maintenir jusqu’à 40 % de la province, bien que sa détention sur une grande partie de celle-ci fût mince. Le 17 juillet, elle a saisi la ville d’Orahovac, que la police reprit en quelques jours ; des dizaines de Serbes enlevés dans les combats n’ont jamais été revus. À partir de la fin juillet, l’armée yougoslave et la police serbe ont contre-attaqué avec l’artillerie, repris Mališevo et le bastion de la frontière de l’ALK à Junik, et brûlé des villages."
"On 26 September Serbian forces killed 21 members of the Deliaj family at Gornje Obrinje, and the images of the dead helped harden Western opinion. The UN Security Council had demanded a ceasefire and the withdrawal of security forces three days earlier, and on 13 October NATO authorised air strikes. The same day the American envoy Richard Holbrooke and Milošević agreed that Yugoslav forces would be cut back and that up to 2,000 unarmed monitors of the OSCE’s Kosovo Verification Mission would watch the ceasefire, with NATO aircraft flying over. The KLA moved back into the ground the police left, and by December the fighting had flared again.": "Le 26 septembre, les forces serbes ont tué 21 membres de la famille Deliaj à Gornje Obrinje et les images des morts ont aidé à endurcir l’opinion occidentale. Le même jour, l’envoyé américain Richard Holbrooke et Milošević ont convenu que les forces yougoslaves seraient réduites et que jusqu’à 2 000 observateurs non armés de la Mission de vérification du Kosovo de l’OSCE surveilleraient le cessez-le-feu, les avions de l’OTAN survolant."
