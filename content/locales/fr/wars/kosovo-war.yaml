"1999–2008": "1999–2008"
"Most of the Kosovo Albanian refugees came home within weeks, to burned villages and mined fields. As they returned, Serbs, Roma, Ashkali and other non-Albanians were attacked, their houses burned and Orthodox churches damaged, and about 200,000 of them fled, most to Serbia. On 23 July 1999 fourteen Serb farmers were shot dead while harvesting at Staro Gracko; the killers were never found. Serbs held on in enclaves guarded by KFOR and in the north, where Mitrovica was divided at the Ibar river. The Kosovo Memory Book counts 13,535 people killed or missing in 1998–2000, about four-fifths of them Albanians.": "La plupart des réfugiés albanais du Kosovo sont rentrés chez eux en quelques semaines, pour brûler des villages et des champs minés. À leur retour, les Serbes, les Roms, les Ashkali et d’autres non-Albanais ont été attaqués, leurs maisons brûlées et les églises orthodoxes endommagées, et environ 200 000 d’entre eux ont fui, la plupart en Serbie. Les Serbes détenus dans des enclaves gardées par la KFOR et dans le nord, où Mitrovica était divisé sur la rivière Ibar. Le livre de mémoire du Kosovo compte 13 535 personnes tuées ou portées disparues en 1998-2000, dont environ les quatre cinquièmes Albanais."
"UNMIK governed Kosovo for almost nine years, the KLA became a civil emergency corps and its leaders went into politics, and some of its veterans fought on in the Preševo Valley and Macedonia. Riots in March 2004 killed 19 people and drove thousands of Serbs from their homes. After UN-led talks on Kosovo’s status failed, it declared independence on 17 February 2008, which Serbia rejects. The Hague tribunal convicted senior Yugoslav and Serbian officers of crimes against Kosovo Albanians; Milošević died in 2006 before his trial ended. In September 2026 a special court in The Hague convicted Thaçi and three other former KLA leaders of war crimes against detainees.": "La MINUK a gouverné le Kosovo pendant près de neuf ans, l’UCK est devenue un corps civil d’urgence et ses dirigeants sont allés en politique, et certains de ses anciens combattants ont combattu dans la vallée de Preševo et la Macédoine. Les émeutes de mars 2004 ont tué 19 personnes et chassé des milliers de Serbes de leurs maisons. Le tribunal de La Haye a condamné des officiers yougoslaves et serbes de haut rang pour crimes contre les Albanais du Kosovo ; Milošević est mort en 2006 avant la fin de son procès. En septembre 2026, un tribunal spécial de La Haye a reconnu Thaçi et trois autres anciens dirigeants de l’UCK coupables de crimes de guerre contre des détenus."
