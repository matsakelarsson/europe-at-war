# Some French text was translated automatically.
"Kosovo War": "Guerre du Kosovo"
"A war in Kosovo, then a province of Serbia within the Federal Republic of Yugoslavia, between Yugoslav and Serbian forces and the Kosovo Liberation Army (KLA), which fought for independence after a decade of Serbian rule that had stripped the province of its autonomy. After a year of fighting and failed talks at Rambouillet, NATO bombed Yugoslavia for 78 days in 1999 without a UN Security Council mandate, while Yugoslav forces drove some 850,000 Kosovo Albanians out of the province. The war ended in June 1999 with the Kumanovo Agreement and UN Security Council Resolution 1244, which put Kosovo under UN administration and a NATO-led force; about 200,000 Serbs, Roma and other non-Albanians then fled or were driven out.": "Après une année de combats et d’échecs à Rambouillet, l’OTAN a bombardé la Yougoslavie pendant 78 jours en 1999 sans mandat du Conseil de sécurité des Nations unies, tandis que les forces yougoslaves ont chassé quelque 850 000 Albanais du Kosovo de la province. La guerre s’est terminée en juin 1999 avec l’accord de Kumanovo et la résolution 1244 du Conseil de sécurité des Nations unies, qui ont placé le Kosovo sous l’administration de l’ONU et une force dirigée par l’OTAN ; environ 200 000 Serbes, Roms et autres non-Albanais ont alors fui ou ont été chassés."
"Kosovo is shown as part of the Federal Republic of Yugoslavia on the map until its declaration of independence on 17 February 2008, which Serbia and a number of other states do not recognise. The UN administration of 1999–2008 is drawn as an area.": "Le Kosovo fait partie de la République fédérale de Yougoslavie sur la carte jusqu’à sa déclaration d’indépendance le 17 février 2008, que la Serbie et un certain nombre d’autres États ne reconnaissent pas. L’administration des Nations unies de 1999 à 2008 est dessinée comme une zone."
"Places are named in their Serbian form, with the Albanian form where it is often used in English, as in Račak (Reçak), Orahovac (Rahovec), Peć (Peja), Đakovica (Gjakova) and Priština (Prishtina).": "Les lieux sont nommés sous leur forme serbe, avec la forme albanaise où il est souvent utilisé en anglais, comme à Račak (Reçak), Orahovac (Rahovec), Peć (Peja), шakovica (Gjakova) et Priština (Prishtina)."
"The NATO bombing had no UN Security Council mandate, and whether it was lawful is still disputed; an independent international commission chaired by Richard Goldstone called it “illegal but legitimate” in 2000. Serbian and Kosovo Albanian accounts of the war differ sharply, above all on the KLA, which Belgrade called a terrorist organisation.": "Les bombardements de l’OTAN n’avaient pas de mandat du Conseil de sécurité des Nations unies, et la question de savoir s’il était légal est toujours contestée ; une commission internationale indépendante présidée par Richard Goldstone l’a qualifiée d’illégalité mais légitime en 2000."
"Casualty figures are uncertain. The Kosovo Memory Book, a name-by-name count by the Humanitarian Law Center, lists 13,535 people killed or missing from January 1998 to December 2000, among them 10,812 Albanians, 2,197 Serbs and 526 Roma, Bosniaks, Montenegrins and others. Human Rights Watch counted about 490–530 civilians killed by NATO strikes; the Yugoslav government gave much higher figures.": "Les chiffres relatifs aux victimes sont incertains : le Kosovo Memory Book, dont le nom a été attribué au Centre de droit humanitaire, énumère 13 535 personnes tuées ou portées disparues entre janvier 1998 et décembre 2000, dont 10 812 Albanais, 2 197 Serbes et 526 Roms, Bosniaques, Monténégrins et autres. Human Rights Watch comptait environ 490 à 530 civils tués par des frappes de l’OTAN ; le gouvernement yougoslave en a donné beaucoup plus."
