"3–20 June 1999": "3–20 juin 1999"
"On 3 June Milošević accepted a peace plan brought to Belgrade by Finland’s president, Martti Ahtisaari, for the European Union, and Russia’s envoy, Viktor Chernomyrdin, and the Serbian parliament approved it the same day. On 9 June NATO and Yugoslav generals signed the Military Technical Agreement at Kumanovo in Macedonia. All Yugoslav forces were to leave Kosovo within eleven days, and a five-kilometre ground safety zone and a 25-kilometre air safety zone were set along its boundary inside Serbia. NATO stopped the bombing on 10 June, and the same day the UN Security Council adopted Resolution 1244, with China abstaining.": "Le 3 juin, Milošević a accepté un plan de paix présenté à Belgrade par Martti Ahtisaari, président de la Finlande, pour l’Union européenne, et Viktor Chernomyrdin, envoyé de la Russie, et le parlement serbe l’a approuvé le même jour. Toutes les forces yougoslaves devaient quitter le Kosovo dans un délai de onze jours, et une zone de sécurité terrestre de cinq kilomètres et une zone de sécurité aérienne de 25 kilomètres ont été établies le long de sa frontière à l’intérieur de la Serbie."
"The resolution reaffirmed Yugoslavia’s sovereignty and territorial integrity but put Kosovo under an interim UN administration (UNMIK), with “substantial autonomy” pending a decision on its final status, and an international security force, KFOR. On 12 June KFOR began entering from Macedonia. Some 200 Russian peacekeepers from Bosnia had driven through Serbia overnight and reached Priština airport first; the British general Mike Jackson refused an order from NATO’s commander, Wesley Clark, to block the runway, and Russia later took part in KFOR. The last Yugoslav forces left on 20 June, and the KLA agreed to disarm, which it completed by 20 September.": "La résolution réaffirme la souveraineté et l’intégrité territoriale de la Yougoslavie, mais place le Kosovo sous une administration intérimaire des Nations unies (MINUK), avec une autonomie substantielle en attendant une décision sur son statut final, et une force internationale de sécurité, la KFOR. Quelque 200 soldats de la paix russes venus de Bosnie avaient traversé la Serbie pendant la nuit et ont atteint l’aéroport de Priština en premier ; le général britannique Mike Jackson a refusé l’ordre du commandant de l’OTAN, Wesley Clark, de bloquer la piste, et la Russie a par la suite pris part à la KFOR."
