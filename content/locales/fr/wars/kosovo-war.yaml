"24 March – 10 June 1999": "24 mars – 10 juin 1999"
"On the night of 24 March NATO began Operation Allied Force, the first war in the alliance’s history, without a mandate from the UN Security Council, where Russia and China opposed it; NATO justified it as necessary to stop a humanitarian catastrophe. Over 78 days its aircraft and missiles struck air defences and troops, then bridges, factories, refineries, power stations and the state television building in Belgrade, where 16 staff were killed on 23 April. Strikes also hit a passenger train at Grdelica, refugee columns near Đakovica and at Koriša, and on 7 May the Chinese embassy, killing three. Human Rights Watch counted about 500 civilian dead. A US stealth bomber was shot down, but NATO lost no one in combat.": "Dans la nuit du 24 mars, l’OTAN a commencé l’opération Force alliée, première guerre de l’histoire de l’alliance, sans mandat du Conseil de sécurité des Nations unies, où la Russie et la Chine s’y sont opposées ; l’OTAN a justifié la nécessité d’arrêter une catastrophe humanitaire. Des frappes ont également frappé un train de passagers à Grdelica, des colonnes de réfugiés près de Čakovica et à Koriša, et le 7 mai l’ambassade chinoise, tuant trois. Human Rights Watch a compté environ 500 morts civils. Un bombardier furtif américain a été abattu, mais l’OTAN n’a perdu personne au combat."
"Within days of the first strikes, Yugoslav army, police and paramilitary units began driving Kosovo Albanians out of the province, emptying towns and villages, burning houses and taking identity papers at the borders; many were packed onto trains to the Macedonian border. By early June about 850,000 had fled or been deported to Albania, Macedonia and Montenegro, and hundreds of thousands more were hiding inside Kosovo. Mass killings took place at Bela Crkva and the Kruša villages, Suva Reka, Izbica and, on 27 April, Meja, where more than 300 men and boys were taken from a refugee column and shot. Many of the bodies were later found in mass graves near Belgrade.": "Dans les jours qui ont suivi les premières frappes, l’armée yougoslave, la police et les unités paramilitaires ont commencé à chasser les Albanais du Kosovo de la province, à vider les villes et les villages, à brûler des maisons et à prendre des papiers d’identité aux frontières ; beaucoup étaient emballés dans des trains jusqu’à la frontière macédonienne. Des massacres ont eu lieu à Bela Crkva et dans les villages de Kruša, Suva Reka, Izbica et, le 27 avril, Meja, où plus de 300 hommes et garçons ont été enlevés d’une colonne de réfugiés et abattus."
"Belgrade said people were fleeing NATO bombs and the fighting, but in 2009 the Yugoslav war crimes tribunal at The Hague convicted senior Yugoslav and Serbian commanders of deportation and murder as crimes against humanity. The rearmed KLA, meanwhile, fought Yugoslav troops along the Albanian border at Košare and Mount Paštrik. On 27 May the tribunal announced its indictment of Milošević for crimes in Kosovo.": "Selon Belgrade, les habitants fuient les bombardements de l’OTAN et les combats. En 2009, le Tribunal pénal international pour l’ex-Yougoslavie, à La Haye, condamne toutefois de hauts commandants yougoslaves et serbes pour déportation et meurtre, qualifiés de crimes contre l’humanité. Entre-temps, l’Armée de libération du Kosovo, qui s’est réarmée, affronte les forces yougoslaves le long de la frontière albanaise, à Košare et au mont Paštrik. Le 27 mai, le tribunal annonce la mise en accusation de Milošević pour des crimes commis au Kosovo."
