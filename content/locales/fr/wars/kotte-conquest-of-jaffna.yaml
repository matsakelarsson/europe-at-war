# French translations of the catalogue text (wave 8); step bodies follow later.
Kotte conquest of Jaffna: Conquête de Jaffna par Kotte
The conquest of the Tamil Jaffna Kingdom in northern Sri Lanka by Parakramabahu VI of Kotte, the last Sinhalese king to rule the whole island. His adopted son Sapumal Kumaraya (Chempaka Perumal), a prince of South Indian descent, first subdued the Vanni chiefs who lay between the two kingdoms. A first invasion of Jaffna failed; a second, around 1450 (some sources say 1447), took the kingdom, and its king Kanakasuriya Cinkaiariyan fled to South India with his family. Sapumal ruled Jaffna for Kotte for some seventeen years. Around 1467, when he went south after Parakramabahu’s death (he later reigned at Kotte as Bhuvanaikabahu VI), Kanakasuriya came back from Madurai with mercenaries and restored the Jaffna Kingdom’s independence.: La conquête du royaume tamoul de Jaffna, dans le nord du Sri Lanka, par Parakramabahu VI de Kotte, le dernier roi cinghalais à régner sur l’ensemble de l’île. Son fils adoptif Sapumal Kumaraya (Chempaka Perumal), un prince d’ascendance sud-indienne, soumit d’abord les chefs du Vanni, dont les terres s’étendaient entre les deux royaumes. Une première invasion de Jaffna échoua ; une seconde, vers 1450 (1447 selon certaines sources), s’empara du royaume, dont le roi, Kanakasuriya Cinkaiariyan, s’enfuit en Inde du Sud avec sa famille. Sapumal gouverna Jaffna au nom de Kotte pendant quelque dix-sept ans. Vers 1467, lorsqu’il partit pour le sud après la mort de Parakramabahu (il régna plus tard à Kotte sous le nom de Bhuvanaikabahu VI), Kanakasuriya revint de Madurai avec des mercenaires et rétablit l’indépendance du royaume de Jaffna.
