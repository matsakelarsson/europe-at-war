# French translations of the catalogue text (wave 9); step bodies follow later.
Zheng Chenggong’s northern expedition: Expédition vers le nord de Zheng Chenggong
? The greatest attempt of the Ming loyalists to win back the lower Yangtze from the Qing. Zheng Chenggong (Koxinga), who held Xiamen and Kinmen on the Fujian coast in the name of the Southern Ming Yongli emperor, sailed north with a large fleet in the summer of 1658, but a typhoon off the Yangshan islands in Zhejiang that autumn sank many of his ships; Chinese accounts speak of more than 8,000 drowned, among them three of his sons. He sailed again in July 1659 with, by the loyalists’ own count, well over 100,000 men, entered the Yangtze, broke the river barriers at Guazhou and took Zhenjiang in early August, while his ally Zhang Huangyan went upriver past Nanjing to Wuhu and won the submission of four prefectures and some two dozen counties in southern Anhui. Koxinga reached Nanjing in mid-August and invested it from 24 August, but he waited for the city to surrender instead of storming it, and his troops grew careless. Reinforced, the Qing garrison under the governor-general Lang Tingzuo sallied out on 9–10 September 1659 and routed the besiegers; Koxinga lost thousands of men and several of his best commanders, among them Gan Hui, who was captured and executed. He fell back to Xiamen, where he beat off a Qing fleet in June 1660, and Zhang Huangyan escaped overland to the coast. The defeat ended hopes of a Ming restoration in the south-east and led Koxinga to turn to Taiwan in 1661.
: La plus grande tentative des loyalistes Ming pour reprendre aux Qing le cours inférieur du Yangzi. Zheng Chenggong (Koxinga), qui tenait Xiamen et Kinmen sur la côte du Fujian au nom de l’empereur Yongli des Ming du Sud, fit voile vers le nord avec une grande flotte à l’été 1658, mais à l’automne un typhon coula nombre de ses navires au large des îles Yangshan, au Zhejiang ; les récits chinois font état de plus de 8 000 noyés, dont trois de ses fils. Il reprit la mer en juillet 1659 avec, selon le décompte des loyalistes eux-mêmes, bien plus de 100 000 hommes, entra dans le Yangzi, força les barrages du fleuve à Guazhou et prit Zhenjiang début août, tandis que son allié Zhang Huangyan remontait le fleuve au-delà de Nankin jusqu’à Wuhu et obtenait la soumission de quatre préfectures et de quelque deux douzaines de districts dans le sud de l’Anhui. Koxinga atteignit Nankin à la mi-août et l’investit à partir du 24 août, mais il attendit la reddition de la ville au lieu de la prendre d’assaut, et ses troupes se relâchèrent. Renforcée, la garnison Qing du gouverneur général Lang Tingzuo fit une sortie les 9 et 10 septembre 1659 et mit les assiégeants en déroute ; Koxinga perdit des milliers d’hommes et plusieurs de ses meilleurs commandants, dont Gan Hui, qui fut capturé et exécuté. Il se replia sur Xiamen, où il repoussa une flotte Qing en juin 1660, et Zhang Huangyan regagna la côte par voie de terre. La défaite mit fin aux espoirs d’une restauration Ming dans le Sud-Est et poussa Koxinga à se tourner vers Taïwan en 1661.
