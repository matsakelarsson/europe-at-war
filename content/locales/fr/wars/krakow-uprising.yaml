"Kraków Uprising": "Cracovie Élevée"
"A Polish rising for national independence and the end of serfdom, launched in the Free City of Kraków on the night of 20 February 1846 and put down by Austrian and Russian troops within about nine days. In neighbouring Galicia, peasants encouraged by Austrian officials turned on the Polish nobility in the Galician slaughter, killing by some estimates about 1,000 nobles, and in November 1846 Austria annexed Kraków with Russian and Prussian consent.": "Une montée polonaise pour l’indépendance nationale et la fin du servage, lancée dans la ville libre de Cracovie dans la nuit du 20 février 1846 et mise à terre par les troupes autrichiennes et russes dans un délai d’environ neuf jours. Dans la Galice voisine, les paysans encouragés par les autorités autrichiennes se sont tournés vers la noblesse polonaise dans le massacre galicien, tuant par certaines estimations environ 1000 nobles, et en novembre 1846 l’Autriche a annexé Cracovie avec le consentement russe et prussien."
"Risings planned at the same time elsewhere, above all in Prussian Greater Poland, were broken up by arrests before they began. The insurgent leader Jan Tyssowski crossed into Prussia with about 1,500 men on 4 March and was interned.": "Les hausses prévues en même temps ailleurs, surtout dans la grande Pologne prussienne, ont été interrompues par des arrestations avant de commencer. Le leader insurgé Jan Tyssowski est entré en Prusse avec environ 1 500 hommes le 4 mars et a été interné."
