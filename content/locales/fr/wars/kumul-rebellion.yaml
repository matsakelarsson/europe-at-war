# French translations of the catalogue text (wave 9); step bodies follow later.
Kumul rebellion: Rébellion de Kumul
A series of wars in Xinjiang in 1931–1937 that began with a rising of the Uyghurs of Kumul (Hami) against the provincial governor Jin Shuren. The revolt drew in the Hui commander Ma Zhongying and his 36th Division from Gansu and spread to the oases of the south, where Uyghur and Kyrgyz leaders proclaimed the Turkic Islamic Republic of East Turkestan in Kashgar in November 1933. Jin was overthrown in April 1933 by his own officers, and his successor Sheng Shicai turned to the Soviet Union, whose troops invaded in January 1934 and drove Ma Zhongying from the north. Ma’s Hui troops destroyed the East Turkestan Republic in 1934, and he himself crossed into the Soviet Union. A second rising in the south in 1937 was crushed by Sheng with Soviet help. Fighting and massacres between Uyghurs, Kyrgyz, Hui and Han killed thousands, and Sheng Shicai was left ruling Xinjiang as a Soviet client within the Republic of China.: Une série de guerres au Xinjiang en 1931–1937, qui commença par un soulèvement des Ouïghours de Kumul (Hami) contre le gouverneur provincial Jin Shuren. La révolte entraîna dans le conflit le commandant hui Ma Zhongying et sa 36e division, venue du Gansu, et s’étendit aux oasis du Sud, où des chefs ouïghours et kirghiz proclamèrent la République islamique turque du Turkestan oriental à Kachgar en novembre 1933. Jin fut renversé en avril 1933 par ses propres officiers, et son successeur Sheng Shicai se tourna vers l’Union soviétique, dont les troupes envahirent la province en janvier 1934 et chassèrent Ma Zhongying du Nord. Les troupes hui de Ma détruisirent la République du Turkestan oriental en 1934, et lui-même passa en Union soviétique. Un second soulèvement dans le Sud, en 1937, fut écrasé par Sheng avec l’aide soviétique. Les combats et les massacres entre Ouïghours, Kirghiz, Hui et Han firent des milliers de morts, et Sheng Shicai resta maître du Xinjiang en tant que client de l’Union soviétique au sein de la République de Chine.
