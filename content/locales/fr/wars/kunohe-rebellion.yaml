# French translations of the catalogue text (wave 10); step bodies follow later.
Kunohe Rebellion: Rébellion de Kunohe
? The rising of Kunohe Masazane against the Nanbu lord and Toyotomi Hideyoshi in the far north of Honshu, the last campaign of the unification of Japan. When Nanbu Harumasa died in 1582 the great northern house of the Nanbu split over the succession; Masazane, head of the powerful Kunohe branch, backed his brother against Nanbu Nobunao, who won. In 1590, after the fall of Odawara, Hideyoshi confirmed Nobunao as lord of the Nanbu lands and ordered the other branches to obey him, while his settlement of the north (the Ōshu shioki) took land from many local lords and set off risings across Mutsu and Dewa. Masazane refused to attend Nobunao’s New Year ceremony in 1591, and in the third month rose with about 5,000 men and attacked castles loyal to Nobunao. Unable to defeat him, Nobunao appealed to Hideyoshi, who sent a second northern expedition under his nephew Toyotomi Hidetsugu and Tokugawa Ieyasu, with Gamō Ujisato, Asano Nagamasa and other lords, an army put at about 60,000 that also put down risings in the Waga and Hienuki districts. Gamō and Asano besieged Kunohe castle at the beginning of the ninth month. After four days Masazane surrendered on a promise, carried by an envoy of Asano, that the defenders would be spared, but the men left in the castle were killed in its second bailey and the castle burned, and Masazane and the other leaders were executed at Sanhasama, in today’s Kurihara (Miyagi). Nobunao took over the castle, renamed it Fukuoka, and later moved his seat south to Morioka. With the end of the rebellion no lord in Japan was left in arms against Hideyoshi, who began his invasion of Korea the next spring.
: Le soulèvement de Kunohe Masazane contre le seigneur Nanbu et Toyotomi Hideyoshi dans l’extrême nord de Honshu, dernière campagne de l’unification du Japon. À la mort de Nanbu Harumasa en 1582, la grande maison septentrionale des Nanbu se divisa au sujet de la succession ; Masazane, chef de la puissante branche Kunohe, soutint son frère contre Nanbu Nobunao, qui l’emporta. En 1590, après la chute d’Odawara, Hideyoshi confirma Nobunao comme seigneur des terres des Nanbu et ordonna aux autres branches de lui obéir, tandis que son règlement du Nord (l’Ōshu shioki) retirait des terres à de nombreux seigneurs locaux et déclenchait des soulèvements dans toutes les provinces de Mutsu et de Dewa. Masazane refusa d’assister à la cérémonie du Nouvel An de Nobunao en 1591 et, au troisième mois, se souleva avec environ 5 000 hommes et attaqua des châteaux fidèles à Nobunao. Incapable de le vaincre, Nobunao fit appel à Hideyoshi, qui envoya une seconde expédition dans le Nord sous les ordres de son neveu Toyotomi Hidetsugu et de Tokugawa Ieyasu, avec Gamō Ujisato, Asano Nagamasa et d’autres seigneurs, une armée estimée à environ 60 000 hommes qui réprima aussi des soulèvements dans les districts de Waga et de Hienuki. Gamō et Asano assiégèrent le château de Kunohe au début du neuvième mois. Au bout de quatre jours, Masazane se rendit sur la promesse, transmise par un envoyé d’Asano, que les défenseurs auraient la vie sauve, mais les hommes restés dans le château furent tués dans sa deuxième enceinte et le château incendié, et Masazane et les autres chefs furent exécutés à Sanhasama, dans l’actuelle ville de Kurihara (Miyagi). Nobunao prit possession du château, le rebaptisa Fukuoka et transféra plus tard son siège plus au sud, à Morioka. Avec la fin de la rébellion, plus aucun seigneur au Japon ne restait en armes contre Hideyoshi, qui lança son invasion de la Corée au printemps suivant.
