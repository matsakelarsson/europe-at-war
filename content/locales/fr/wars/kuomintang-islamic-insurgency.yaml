# French translations of the catalogue text (wave 9); step bodies follow later.
Kuomintang Islamic insurgency: Insurrection islamique du Kuomintang
? Armed resistance to the People’s Republic in north-west China after 1949 by remnants of the Nationalist armies of the Hui Ma clique, by Kazakh fighters and by other anti-communist groups, in Gansu, Qinghai, Ningxia and Xinjiang. When the PLA took the north-west in 1949, the Ma clique’s leaders Ma Bufang and Ma Hongkui left China and the Nationalist commanders in Xinjiang declared for the Communists, but some officers took to the mountains. The ROC government on Taiwan sent agents and gave them ranks and commands, and the CIA dropped arms, radios and gold to one of them, Ma Liang. In Xinjiang the Kazakh leader Ospan Batyr (Osman Batur) and Yulbars Khan, the former chancellor of Kumul, fought the PLA in 1950. Yulbars Khan escaped through Tibet and India to Taiwan, where he served as the ROC’s governor of Xinjiang in exile; Ospan was captured in Qinghai and executed at Ürümqi on 29 April 1951, and many of his followers fled across Tibet and the Himalayas and were later resettled in Turkey. In Qinghai and Gansu Ma Yuanxiang was killed in battle in Tongde county on 16 May 1953, and Ma Hushan, the former ruler of southern Xinjiang, was captured and executed at Lanzhou in 1954. The main bands had been destroyed by the mid-1950s; some sources date the last fighting to 1958, when revolts broke out among the Tibetans and Hui of Amdo.
: La résistance armée à la République populaire dans le nord-ouest de la Chine après 1949, menée par les restes des armées nationalistes de la clique hui des Ma, par des combattants kazakhs et par d’autres groupes anticommunistes, dans le Gansu, le Qinghai, le Ningxia et le Xinjiang. Lorsque l’APL prit le Nord-Ouest en 1949, les chefs de la clique des Ma, Ma Bufang et Ma Hongkui, quittèrent la Chine et les commandants nationalistes du Xinjiang se rallièrent aux communistes, mais certains officiers gagnèrent les montagnes. Le gouvernement de la République de Chine à Taïwan leur envoya des agents et leur conféra grades et commandements, et la CIA parachuta des armes, des radios et de l’or à l’un d’eux, Ma Liang. Au Xinjiang, le chef kazakh Ospan Batyr (Osman Batur) et Yulbars Khan, ancien chancelier de Kumul, combattirent l’APL en 1950. Yulbars Khan s’enfuit par le Tibet et l’Inde jusqu’à Taïwan, où il fut gouverneur du Xinjiang en exil pour la République de Chine ; Ospan fut capturé dans le Qinghai et exécuté à Ürümqi le 29 avril 1951, et nombre de ses partisans s’enfuirent à travers le Tibet et l’Himalaya avant d’être réinstallés plus tard en Turquie. Dans le Qinghai et le Gansu, Ma Yuanxiang fut tué au combat dans le district de Tongde le 16 mai 1953, et Ma Hushan, ancien maître du sud du Xinjiang, fut capturé et exécuté à Lanzhou en 1954. Les principales bandes avaient été détruites vers le milieu des années 1950 ; certaines sources datent les derniers combats de 1958, lorsque des révoltes éclatèrent parmi les Tibétains et les Hui de l’Amdo.
