"Kurdish–Turkish conflict (PKK insurgency)": "Conflit kurde-turque (insurrection du PKK)"
"The armed conflict between the Turkish state and the Kurdistan Workers’ Party (PKK), which took up arms in south-eastern Turkey in 1984, first for an independent Kurdish state and later for autonomy and Kurdish rights; more than 40,000 people were killed, most of them in the 1990s, and the fighting spread into northern Iraq and Syria. The PKK declared its dissolution and the end of its armed struggle in May 2025, but as of November 2026 Turkey had not confirmed that its disarmament was complete.": "Le conflit armé entre l’État turc et le Parti des travailleurs du Kurdistan (PKK), qui a pris les armes dans le sud-est de la Turquie en 1984, d’abord pour un État kurde indépendant, puis pour l’autonomie et les droits kurdes ; plus de 40 000 personnes ont été tuées, la plupart dans les années 90, et les combats se sont étendus au nord de l’Irak et de la Syrie. Le PKK a déclaré sa dissolution et la fin de sa lutte armée en mai 2025, mais en novembre 2026 la Turquie n’avait pas confirmé que son désarmement était complet."
"The PKK is listed as a terrorist organisation by Turkey, the European Union and the United States. Both sides were accused of grave abuses; the PKK killed civilians, village guards and teachers, and the European Court of Human Rights ruled against Turkey in many cases of village destruction, torture and killings in the 1990s.": "Le PKK est classé organisation terroriste par la Turquie, l’Union européenne et les États-Unis. Les deux parties ont été accusées d’abus graves ; le PKK a tué des civils, des gardes de village et des enseignants, et la Cour européenne des droits de l’homme s’est prononcée contre la Turquie dans de nombreux cas de destruction de villages, de torture et d’assassinats dans les années 1990."
"The death toll is usually given as more than 40,000 since 1984, including soldiers, police, village guards, PKK fighters and civilians.": "Le nombre de morts est généralement supérieur à 40 000 depuis 1984, y compris des soldats, des policiers, des gardes de village, des combattants du PKK et des civils."
"This entry treats the conflict as ongoing because the disarmament process begun in 2025 had not been declared complete. It will be updated when it is.": "Cette rubrique traite le conflit comme étant en cours parce que le processus de désarmement entamé en 2025 n’a pas été déclaré complet et qu’il sera mis à jour quand il l’est."
