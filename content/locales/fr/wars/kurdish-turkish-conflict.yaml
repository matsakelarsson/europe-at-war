"1999 – November 2026": "1999 – novembre 2026"
"Last updated 19 November 2026. After Öcalan’s capture the PKK called a ceasefire and changed its aim from independence to autonomy and rights within Turkey, while Turkey, seeking to join the European Union, eased restrictions on the Kurdish language. Fighting resumed in 2004. A peace process begun in 2013 broke down in July 2015. In 2015–2016 PKK youth units dug in inside towns, and army sieges and curfews destroyed much of the old city of Diyarbakır, Cizre and Nusaybin, killing hundreds of civilians. Turkey also struck PKK-linked Kurdish forces in Syria and built a chain of bases in northern Iraq.": "Dernière mise à jour le 19 novembre 2026. Après la prise d’Öcalan, le PKK a appelé un cessez-le-feu et a changé son objectif de l’indépendance à l’autonomie et les droits en Turquie, tandis que la Turquie, cherchant à rejoindre l’Union européenne, a assoupli les restrictions sur la langue kurde. En 2015-2016, des unités de jeunes du PKK ont creusé dans les villes et des sièges et couvre-feux de l’armée ont détruit une grande partie de la vieille ville de Diyarbakır, Cizre et Nusaybin, tuant des centaines de civils."
"In October 2024 Devlet Bahçeli, leader of the nationalist party allied with President Erdoğan, proposed that Öcalan call on the PKK to lay down its arms. Öcalan did so on 27 February 2025. The PKK declared a ceasefire and on 12 May announced that it was dissolving itself and ending its armed struggle. On 11 July some 30 fighters burned their weapons at a ceremony near Sulaymaniyah in Iraqi Kurdistan, and in October the PKK said it was withdrawing its fighters from Turkey. In August 2026 Turkey’s parliament passed a law on the return of PKK members, conditional on verified disarmament, which Turkey had not yet confirmed.": "En octobre 2024, Devlet Bahçeli, chef du parti nationaliste allié au président Erdoğan, propose que Öcalan appelle le PKK à déposer ses armes. Öcalan l’a fait le 27 février 2025. Le PKK a déclaré un cessez-le-feu et le 12 mai a annoncé qu’il se dissolvait et mettait fin à sa lutte armée. Le 11 juillet, une trentaine de combattants ont brûlé leurs armes lors d’une cérémonie près de Souleimaniyeh au Kurdistan iraquien et, en octobre, le PKK a déclaré qu’il retirait ses combattants de Turquie. En août 2026, le parlement turc a adopté une loi sur le retour des membres du PKK, sous réserve d’un désarmement vérifié, que la Turquie n’avait pas encore confirmé."
