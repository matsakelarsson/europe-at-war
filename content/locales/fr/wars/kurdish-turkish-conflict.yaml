"1984–1999": "1984–1999"
"The PKK was founded in 1978 by Abdullah Öcalan as a Marxist–Leninist party seeking an independent Kurdistan, at a time when the Kurdish language was restricted in public life in Turkey. After the military coup of 1980 its leaders worked from Syria and the Syrian-controlled Beqaa valley in Lebanon. On 15 August 1984 its fighters attacked gendarmerie posts and barracks in Eruh and Şemdinli. The state answered by arming Kurdish villagers as paid village guards and from 1987 placed the south-eastern provinces under emergency rule. The PKK attacked village guards and their families, teachers and others it saw as agents of the state.": "Le PKK a été fondé en 1978 par Abdullah Öcalan en tant que parti marxiste-léniniste à la recherche d’un Kurdistan indépendant, au moment où la langue kurde était limitée dans la vie publique en Turquie. Après le coup d’État militaire de 1980, ses dirigeants travaillaient depuis la Syrie et la vallée de la Beqaa contrôlée par la Syrie au Liban. L’État a répondu en armant les villageois kurdes comme des gardiens de village payés et, à partir de 1987, a placé les provinces du sud-est sous le régime d’urgence."
"The war was at its worst in the early and mid-1990s. Security forces emptied or burned some 3,000 villages, uprooting hundreds of thousands of people, and thousands of Kurdish activists, journalists and businessmen were killed in murders that were never solved. The army struck PKK bases in northern Iraq, in 1997 with tens of thousands of troops. In 1998 Turkey threatened Syria with war unless it expelled Öcalan; he left and was seized by Turkish agents in Nairobi on 15 February 1999. Sentenced to death, a sentence later commuted to life, he was imprisoned on the island of İmralı.": "Les forces de sécurité ont vidé ou brûlé quelque 3 000 villages, déraciner des centaines de milliers de personnes, et des milliers de militants kurdes, de journalistes et d’hommes d’affaires ont été tués dans des meurtres qui n’ont jamais été résolus. L’armée a frappé les bases du PKK dans le nord de l’Irak, en 1997 avec des dizaines de milliers de soldats. En 1998, la Turquie a menacé la Syrie de guerre à moins qu’elle n’expulse Öcalan ; il est parti et a été saisi par des agents turcs à Nairobi le 15 février 1999."
