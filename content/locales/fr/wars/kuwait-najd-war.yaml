# French translations of the catalogue text (wave 7); step bodies follow later.
Kuwait–Najd War: Guerre entre le Koweït et le Nejd
A border war between Kuwait and Ibn Saud’s Sultanate of Najd, fought mainly by the Ikhwan warriors of Faisal al-Duwaish. After the death of Kuwait’s ruler Mubarak al-Sabah in 1915, relations with his former protégé Ibn Saud soured over the border and over tribes and trade. In May 1920 about 2,000 Ikhwan routed a Kuwaiti force of a few hundred at Hamdh, and Kuwait’s people built a mud wall around the town in a few weeks. On 10 October 1920 several thousand Ikhwan attacked Jahra, west of the town; its defenders under Sheikh Salim al-Mubarak held out in the Red Fort, and the Ikhwan withdrew as British warships, aircraft and troops arrived. The Uqair Protocol of December 1922, drawn up by Britain, gave Najd about two-thirds of the land Kuwait had claimed, and a Saudi trade blockade of Kuwait followed from 1923 to 1937.: Une guerre frontalière entre le Koweït et le sultanat du Nejd d’Ibn Saoud, menée surtout par les guerriers ikhwan de Faisal al-Duwaish. Après la mort du souverain du Koweït, Moubarak al-Sabah, en 1915, les relations avec son ancien protégé Ibn Saoud se dégradèrent à propos de la frontière, des tribus et du commerce. En mai 1920, environ 2 000 Ikhwan mirent en déroute une troupe koweïtienne de quelques centaines d’hommes à Hamdh, et les Koweïtiens élevèrent en quelques semaines une muraille de terre crue autour de leur ville. Le 10 octobre 1920, plusieurs milliers d’Ikhwan attaquèrent Jahra, à l’ouest de la ville ; ses défenseurs, commandés par le cheikh Salim al-Mubarak, tinrent bon dans le Fort rouge, et les Ikhwan se retirèrent à l’arrivée de navires de guerre, d’avions et de troupes britanniques. Le protocole d’Uqair de décembre 1922, établi par la Grande-Bretagne, attribua au Nejd environ les deux tiers des terres revendiquées par le Koweït, et un blocus commercial saoudien du Koweït suivit de 1923 à 1937.
