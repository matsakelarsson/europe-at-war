# French translations of the catalogue text (wave 13); step bodies follow later.
Kwararafa wars with Kano and Bornu: Guerres du Kwararafa contre Kano et le Bornou
? "Raids and invasions of the Hausa kingdoms and of Bornu by Kwararafa, a state or confederation in the Benue valley of central Nigeria, from the late sixteenth century to about 1680. The Kano Chronicle tells that under Sarki Muhammad Zaki (1582–1618 in its reckoning) the king of Kwararafa attacked Kano and ravaged the country, and that the people fled to Daura; in the 1650s, under Muhammad Kukuna, Kwararafa forces under their king Adashu attacked Kano again and damaged its Kawayi gate while the sarki was away, and in 1653, by one account, Kano’s ruler was forced into exile; in 1671 the people of Kano fled once more to Daura. Kano and Katsina, long at war with each other, made peace about 1650 to face the threat. About 1680 Kwararafa armies attacked Katsina and Zazzau and invaded Bornu, reaching its capital, Birni Ngazargamu; Mai Ali ibn Umar drove them out, and some accounts say the city was sacked. Kwararafa then declined: by the end of the eighteenth century it paid tribute to Bornu, and a Jukun kingdom at Wukari later claimed its succession. Almost everything known about these wars comes from the chronicles of the Hausa and Bornu states that Kwararafa attacked; the Benue valley’s own traditions say little about them. The identification of Kwararafa with the Jukun was first made by the colonial officer Richmond Palmer, and a minority of historians doubt that a single confederation existed."
: "Raids et invasions menés contre les royaumes haoussa et le Bornou par le Kwararafa, État ou confédération de la vallée de la Bénoué, dans le centre du Nigeria, de la fin du XVIe siècle à 1680 environ. La Chronique de Kano rapporte que, sous le sarki Muhammad Zaki (1582–1618 selon sa chronologie), le roi du Kwararafa attaqua Kano et ravagea le pays, et que la population s’enfuit à Daura ; dans les années 1650, sous Muhammad Kukuna, les forces du Kwararafa menées par leur roi Adashu attaquèrent de nouveau Kano et endommagèrent sa porte de Kawayi en l’absence du sarki, et en 1653, selon un récit, le souverain de Kano fut contraint à l’exil ; en 1671, les habitants de Kano s’enfuirent une fois de plus à Daura. Kano et Katsina, longtemps en guerre l’une contre l’autre, firent la paix vers 1650 pour faire face à la menace. Vers 1680, les armées du Kwararafa attaquèrent Katsina et le Zazzau et envahirent le Bornou, atteignant sa capitale, Birni Ngazargamu ; le maï Ali ibn Umar les en chassa, et certains récits affirment que la ville fut mise à sac. Le Kwararafa déclina ensuite : à la fin du XVIIIe siècle, il payait tribut au Bornou, et un royaume jukun établi à Wukari en revendiqua plus tard la succession. Presque tout ce que l’on sait de ces guerres provient des chroniques des États haoussa et du Bornou que le Kwararafa attaqua ; les traditions de la vallée de la Bénoué elles-mêmes en disent peu. L’identification du Kwararafa aux Jukun fut d’abord proposée par l’administrateur colonial Richmond Palmer, et une minorité d’historiens doutent qu’une confédération unique ait existé."
