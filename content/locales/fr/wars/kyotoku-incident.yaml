# French translations of the catalogue text (wave 10); step bodies follow later.
Kyōtoku Incident: Incident de Kyōtoku
? "A war of almost thirty years in the Kantō between Ashikaga Shigeuji, the Kamakura kubō, and the Uesugi, backed by the shogunate, which broke eastern Japan into rival camps and began its Sengoku period. Shigeuji, the surviving son of Ashikaga Mochiuji, was made kubō in 1449 with Uesugi Noritada, son of his father’s enemy Norizane, as his deputy (Kantō kanrei). After an armed clash in 1450 the two sides made an uneasy peace, but at the end of Kyōtoku 3 (January 1455) Shigeuji had Noritada killed at his residence in Kamakura and attacked the Uesugi mansions. He won at Bubaigawara and elsewhere in the first months of 1455, but the shogunate declared him a rebel, and in the sixth month Imagawa Noritada of Suruga took and burned Kamakura. Shigeuji made Koga, in Shimōsa, his seat, and he and his successors became known as the Koga kubō. The Uesugi built strongholds against him at Kawagoe and Edo, the second traditionally credited to Ōta Dōkan, and from about 1459 the two camps faced each other along the Tone River, Shigeuji’s allies (the Chiba, Utsunomiya, Oyama and Yūki among them) holding the east and the Uesugi the west. The shogun Yoshimasa sent his brother Ashikaga Masatomo as a new kubō in 1457–1458, but Masatomo could not enter Kamakura and stayed at Horigoe in Izu (the Horigoe kubō). The war dragged on through the Ōnin War, which kept the shogunate from helping; the Uesugi took Koga in 1471, Shigeuji won it back, and from 1476 the revolt of Nagao Kageharu split the Uesugi side. A peace between the shogunate and Shigeuji was finally agreed at the end of Bunmei 14 (January 1483): Shigeuji was recognised as kubō at Koga and Masatomo kept Izu. The Kantō remained divided, and in the 1490s Ise Sōzui (Hōjō Sōun) took Izu from Masatomo’s heirs, the first step of the Later Hōjō."
: "Une guerre de près de trente ans dans le Kantō entre Ashikaga Shigeuji, le kubō de Kamakura, et les Uesugi, soutenus par le shogunat, qui divisa l’est du Japon en camps rivaux et y ouvrit l’époque Sengoku. Shigeuji, fils survivant d’Ashikaga Mochiuji, fut fait kubō en 1449, avec pour adjoint (Kantō kanrei) Uesugi Noritada, fils de Norizane, l’ennemi de son père. Après un affrontement armé en 1450, les deux camps conclurent une paix précaire, mais à la fin de la 3e année de l’ère Kyōtoku (janvier 1455), Shigeuji fit tuer Noritada dans sa résidence de Kamakura et attaqua les demeures des Uesugi. Il l’emporta à Bubaigawara et ailleurs dans les premiers mois de 1455, mais le shogunat le déclara rebelle et, au sixième mois, Imagawa Noritada, de Suruga, prit et incendia Kamakura. Shigeuji fit de Koga, en Shimōsa, son siège, et lui et ses successeurs furent connus sous le nom de kubō de Koga. Les Uesugi bâtirent contre lui des places fortes à Kawagoe et à Edo, la seconde traditionnellement attribuée à Ōta Dōkan, et à partir de 1459 environ les deux camps se firent face le long du fleuve Tone, les alliés de Shigeuji (parmi lesquels les Chiba, les Utsunomiya, les Oyama et les Yūki) tenant l’est et les Uesugi l’ouest. Le shogun Yoshimasa envoya son frère Ashikaga Masatomo comme nouveau kubō en 1457–1458, mais Masatomo ne put entrer dans Kamakura et resta à Horigoe, en Izu (le kubō de Horigoe). La guerre se prolongea pendant la guerre d’Ōnin, qui empêcha le shogunat de prêter son aide ; les Uesugi prirent Koga en 1471, Shigeuji la reprit et, à partir de 1476, la révolte de Nagao Kageharu divisa le camp des Uesugi. Une paix entre le shogunat et Shigeuji fut enfin conclue à la fin de la 14e année de l’ère Bunmei (janvier 1483) : Shigeuji fut reconnu comme kubō à Koga et Masatomo garda Izu. Le Kantō resta divisé et, dans les années 1490, Ise Sōzui (Hōjō Sōun) enleva Izu aux héritiers de Masatomo, premier pas des Hōjō postérieurs."
