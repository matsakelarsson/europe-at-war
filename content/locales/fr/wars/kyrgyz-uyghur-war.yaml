# French translations of the catalogue text (wave 9); step bodies follow later.
Fall of the Uyghur Khaganate: Chute du khaganat ouïghour
? The war in which the Yenisei Kyrgyz destroyed the Uyghur Khaganate, the empire that had ruled the Mongolian steppe since 744, and the Tang campaigns against the Uyghur refugees that followed. From about 820, according to the Tang histories, the Kyrgyz ruler on the upper Yenisei called himself khagan and fought the Uyghurs for some twenty years. After a coup, a famine and a hard winter had weakened the khaganate, a Kyrgyz army of about 80,000 horsemen, guided by a rebel Uyghur minister, sacked the Uyghur capital Ordu-Baliq in the Orkhon valley in 840 and killed the khagan. The Uyghurs scattered. Some went west to the Karluks, others to Turfan and the Gansu oases, where they founded the kingdoms of Qocho and Ganzhou; the largest group, under the new khagan Wujie, moved south to the Tang frontier in the great bend of the Yellow River. The Tang, allied with the Kyrgyz, attacked Wujie’s camp at Shahu in February 843 and broke his following; he was killed in 846, and the last Uyghur remnants on the frontier were defeated in 847. The Kyrgyz did not take over the steppe empire, and Mongolia was left without a dominant power until the Khitans.
: La guerre au cours de laquelle les Kirghizes de l’Ienisseï détruisirent le khaganat ouïghour, l’empire qui dominait la steppe mongole depuis 744, et les campagnes des Tang contre les réfugiés ouïghours qui suivirent. À partir de 820 environ, selon les histoires des Tang, le souverain kirghize du haut Ienisseï se fit appeler khagan et combattit les Ouïghours pendant une vingtaine d’années. Après qu’un coup d’État, une famine et un hiver rigoureux eurent affaibli le khaganat, une armée kirghize d’environ 80 000 cavaliers, guidée par un ministre ouïghour rebelle, mit à sac en 840 la capitale ouïghoure, Ordu-Baliq, dans la vallée de l’Orkhon, et tua le khagan. Les Ouïghours se dispersèrent. Certains partirent vers l’ouest chez les Karlouks, d’autres vers Tourfan et les oasis du Gansu, où ils fondèrent les royaumes de Qocho et de Ganzhou ; le groupe le plus nombreux, sous le nouveau khagan Wujie, gagna au sud la frontière des Tang, dans la grande boucle du fleuve Jaune. Les Tang, alliés aux Kirghizes, attaquèrent le camp de Wujie à Shahu en février 843 et dispersèrent ses partisans ; il fut tué en 846, et les derniers restes ouïghours de la frontière furent vaincus en 847. Les Kirghizes ne prirent pas la relève de l’empire des steppes, et la Mongolie resta sans puissance dominante jusqu’aux Khitans.
