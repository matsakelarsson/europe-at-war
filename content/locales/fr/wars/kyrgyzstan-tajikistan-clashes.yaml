# French translations of the catalogue text (wave 7); step bodies follow later.
Kyrgyzstan–Tajikistan border clashes: Affrontements frontaliers entre le Kirghizistan et le Tadjikistan
Two short wars between Kyrgyzstan and Tajikistan over their disputed border in the Fergana Valley, in April 2021 and September 2022. Of the roughly 970-kilometre border inherited from the Soviet Union, more than a third had never been agreed, and the patchwork of villages, roads, pastures and canals around Kyrgyzstan’s Batken region and the Tajik exclave of Vorukh had produced repeated clashes. In April 2021 a quarrel over a water facility on the Isfara river turned into fighting between the two armies that killed about 55 people. In September 2022 much heavier fighting, with tanks, artillery and drones, spread along the whole Batken border and killed about 100 or more people, among them dozens of civilians, and more than 130,000 people were evacuated on the Kyrgyz side. Human Rights Watch found that forces on both sides had apparently committed war crimes. After long negotiations the two presidents signed a treaty settling the entire border on 13 March 2025.: Deux courtes guerres entre le Kirghizistan et le Tadjikistan au sujet de leur frontière contestée dans la vallée de Ferghana, en avril 2021 et en septembre 2022. Sur les quelque 970 kilomètres de frontière hérités de l’Union soviétique, plus d’un tiers n’avaient jamais fait l’objet d’un accord, et la mosaïque de villages, de routes, de pâturages et de canaux autour de la région kirghize de Batken et de l’exclave tadjike de Vorukh avait provoqué des affrontements répétés. En avril 2021, une querelle au sujet d’une installation hydraulique sur l’Isfara dégénéra en combats entre les deux armées, qui firent environ 55 morts. En septembre 2022, des combats beaucoup plus violents, avec chars, artillerie et drones, s’étendirent à toute la frontière de Batken et firent environ 100 morts ou davantage, dont des dizaines de civils, et plus de 130 000 personnes furent évacuées du côté kirghiz. Human Rights Watch constata que les forces des deux camps avaient apparemment commis des crimes de guerre. Après de longues négociations, les deux présidents signèrent le 13 mars 2025 un traité réglant le tracé de l’ensemble de la frontière.
