# French translations of the catalogue text (wave 10); step bodies follow later.
Kyushu Campaign: Campagne de Kyushu
? "Toyotomi Hideyoshi’s conquest of Kyushu from the Shimazu of Satsuma. From their base in the far south the Shimazu had beaten the Ōtomo at Mimikawa (1578) and the Ryūzōji at Okitanawate (1584) and by 1586 were close to ruling the whole island. The Ōtomo lord Sōrin appealed to Hideyoshi, who ordered the Shimazu to stop and, when they refused his division of the island, sent an advance force to Bungo. The Shimazu took Iwaya in Chikuzen, invaded Bungo and beat Hideyoshi’s vanguard at Hetsugigawa in January 1587. In the spring Hideyoshi came himself with an army put at 200,000 or more, in two great columns: his brother Hidenaga marched down the east coast and beat the Shimazu at Nejirozaka in Hyūga, while Hideyoshi went down the west through Higo into Satsuma. On 13 June 1587 Shimazu Yoshihisa came to Hideyoshi’s camp at the temple of Taihei-ji in Sendai, his head shaved as a monk, and surrendered. The Shimazu kept Satsuma, Ōsumi and part of Hyūga; the rest of Kyushu was shared among Hideyoshi’s vassals, and at Hakozaki he issued his edict expelling the Jesuit missionaries."
: "La conquête de Kyushu par Toyotomi Hideyoshi aux dépens des Shimazu de Satsuma. Depuis leur base de l’extrême sud, les Shimazu avaient battu les Ōtomo à Mimikawa (1578) et les Ryūzōji à Okitanawate (1584) et, en 1586, étaient près de dominer toute l’île. Le seigneur des Ōtomo, Sōrin, fit appel à Hideyoshi, qui ordonna aux Shimazu de s’arrêter et, lorsqu’ils refusèrent le partage de l’île qu’il imposait, envoya une avant-garde dans le Bungo. Les Shimazu prirent Iwaya dans le Chikuzen, envahirent le Bungo et battirent l’avant-garde de Hideyoshi à Hetsugigawa en janvier 1587. Au printemps, Hideyoshi vint en personne avec une armée estimée à 200 000 hommes ou plus, en deux grandes colonnes : son frère Hidenaga descendit la côte est et battit les Shimazu à Nejirozaka, dans le Hyūga, tandis que Hideyoshi descendait par l’ouest, à travers le Higo, jusqu’au Satsuma. Le 13 juin 1587, Shimazu Yoshihisa se présenta au camp de Hideyoshi, au temple Taihei-ji de Sendai, le crâne rasé comme un moine, et se rendit. Les Shimazu conservèrent le Satsuma, l’Ōsumi et une partie du Hyūga ; le reste de Kyushu fut partagé entre les vassaux de Hideyoshi, et à Hakozaki celui-ci promulgua son édit d’expulsion des missionnaires jésuites."
