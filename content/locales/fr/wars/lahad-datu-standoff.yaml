# French translations of the catalogue text (wave 11); step bodies follow later.
Lahad Datu standoff: Crise de Lahad Datu
? The armed incursion into eastern Sabah of followers of Jamalul Kiram III, one of several claimants to the title of Sultan of Sulu. The sultans of Sulu had granted or leased North Borneo to a British company in 1878, and Malaysia still paid the heirs 5,300 ringgit (about US$1,000) a year, which the heirs regarded as rent and Malaysia as payment for a cession; the Philippines has kept a dormant claim to Sabah since 1962. Feeling left out of the peace talks between Manila and the Moro Islamic Liberation Front, Kiram sent his brother Agbimuddin Kiram with about 200 men, some of them armed, by boat from Simunul in Tawi-Tawi to the village of Tanduo near Lahad Datu, where they landed on 11 February 2013 and declared themselves the Royal Security Forces of the Sultanate of Sulu and North Borneo. Malaysian police surrounded them, and the Philippine government urged them to return home. After three weeks of negotiation, a firefight at Tanduo on 1 March killed two Malaysian commandos and twelve of Kiram’s men; on 2 March gunmen ambushed police in the water village of Sri Jaya Siminul at Semporna, killing six. On 5 March Malaysia launched Operation Daulat with air strikes by fighter aircraft and an assault by army and police; Tanduo was taken on 11 March and the fighting ended in late March. Malaysian figures put the dead at ten members of the security forces, six civilians and 56–68 of Kiram’s men; about 150 people were detained, and nine Filipinos were later sentenced to death in Malaysia for waging war against the king. Malaysia set up the Eastern Sabah Security Command (ESSCOM) and stopped the annual payment; the heirs’ later claim in a European arbitration, which in 2022 awarded them US$14.9 billion, was set aside by French courts in 2023–2024.
: L’incursion armée dans l’est du Sabah des partisans de Jamalul Kiram III, l’un des prétendants au titre de sultan de Sulu. Les sultans de Sulu avaient concédé ou loué le Bornéo du Nord à une compagnie britannique en 1878, et la Malaisie versait encore aux héritiers 5 300 ringgits (environ 1 000 dollars américains) par an, somme que les héritiers considéraient comme un loyer et la Malaisie comme le paiement d’une cession ; les Philippines maintiennent depuis 1962 une revendication en sommeil sur le Sabah. S’estimant tenu à l’écart des pourparlers de paix entre Manille et le Front Moro islamique de libération, Kiram envoya son frère Agbimuddin Kiram avec environ 200 hommes, dont certains armés, par bateau depuis Simunul, à Tawi-Tawi, jusqu’au village de Tanduo, près de Lahad Datu, où ils débarquèrent le 11 février 2013 et se proclamèrent Forces royales de sécurité du sultanat de Sulu et du Bornéo du Nord. La police malaisienne les encercla, et le gouvernement philippin les exhorta à rentrer chez eux. Après trois semaines de négociations, une fusillade à Tanduo, le 1er mars, tua deux commandos malaisiens et douze hommes de Kiram ; le 2 mars, des hommes armés tendirent une embuscade à des policiers dans le village sur pilotis de Sri Jaya Siminul, à Semporna, et en tuèrent six. Le 5 mars, la Malaisie lança l’opération Daulat, avec des frappes d’avions de chasse et un assaut de l’armée et de la police ; Tanduo fut pris le 11 mars et les combats cessèrent à la fin de mars. Selon les chiffres malaisiens, les morts s’élevèrent à dix membres des forces de sécurité, six civils et 56 à 68 hommes de Kiram ; environ 150 personnes furent détenues, et neuf Philippins furent ensuite condamnés à mort en Malaisie pour avoir fait la guerre au roi. La Malaisie créa le Commandement de sécurité de l’est du Sabah (ESSCOM) et cessa le paiement annuel ; la demande présentée ensuite par les héritiers devant un arbitrage européen, qui leur accorda en 2022 14,9 milliards de dollars américains, fut annulée par les tribunaux français en 2023–2024.
