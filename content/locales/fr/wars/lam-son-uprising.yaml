# French translations of the catalogue text (wave 11); step bodies follow later.
Lam Sơn uprising: Soulèvement de Lam Sơn
? The rising led by Lê Lợi, a landowner of Lam Sơn in the hills of Thanh Hóa, against Ming rule in Jiaozhi, the former Đại Việt annexed by the Ming in 1407. For six years his small army survived in the mountains, at times close to destruction, and in 1423 accepted a truce. In late 1424, on Nguyễn Chích’s advice, it turned south to Nghệ An, where Ming garrisons were thin, and by the end of 1425 held the whole country from Thanh Hóa to Thuận Hóa except a few walled towns. In 1426 the Lam Sơn armies came north, destroyed the army of the new Ming commander Wang Tong at Tốt Động–Chúc Động on 7 November and besieged him in Đông Quan (Hanoi). In the autumn of 1427 they took Xương Giang and destroyed the relief army from Guangxi, whose commander Liu Sheng was killed at Chi Lăng, and the army from Yunnan withdrew. Wang Tong agreed to leave, and the last Ming troops went home in January 1428. Lê Lợi took the throne as the first emperor of the Later Lê dynasty, and Nguyễn Trãi’s proclamation, the Bình Ngô đại cáo, declared the restored Đại Việt the equal of China.
: Le soulèvement conduit par Lê Lợi, un propriétaire terrien de Lam Sơn, dans les collines du Thanh Hóa, contre la domination Ming sur le Jiaozhi, l’ancien Đại Việt annexé par les Ming en 1407. Pendant six ans, sa petite armée survécut dans les montagnes, parfois au bord de l’anéantissement, et accepta une trêve en 1423. À la fin de 1424, sur le conseil de Nguyễn Chích, elle se tourna vers le sud, vers le Nghệ An, où les garnisons Ming étaient clairsemées, et à la fin de 1425 elle tenait tout le pays du Thanh Hóa au Thuận Hóa, à l’exception de quelques villes fortifiées. En 1426, les armées de Lam Sơn remontèrent vers le nord, anéantirent le 7 novembre à Tốt Động–Chúc Động l’armée du nouveau commandant Ming, Wang Tong, et l’assiégèrent dans Đông Quan (Hanoï). À l’automne 1427, elles prirent Xương Giang et détruisirent l’armée de secours venue du Guangxi, dont le commandant Liu Sheng fut tué à Chi Lăng, et l’armée venue du Yunnan se retira. Wang Tong accepta de partir, et les dernières troupes Ming rentrèrent chez elles en janvier 1428. Lê Lợi monta sur le trône comme premier empereur de la dynastie des Lê postérieurs, et la proclamation de Nguyễn Trãi, le Bình Ngô đại cáo, déclara le Đại Việt restauré l’égal de la Chine.
