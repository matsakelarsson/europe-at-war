# French translations of the catalogue text (wave 11); step bodies follow later.
Lao rebellion (Anouvong’s war): Rébellion lao (guerre d’Anouvong)
"A war between King Anouvong of Vientiane and Siam, to which Vientiane and Champasak had been tributary since 1779. Angered by Siamese demands on the Lao of the Khorat plateau, and believing that Siam was about to be attacked by Britain, Anouvong sent his armies across the Mekong in the winter of 1826–1827. They took Nakhon Ratchasima and came within three days’ march of Bangkok, and began to move the Lao population of the plateau back across the river. Siam struck back with three armies: the Lao were beaten at Nong Bua Lamphu in May 1827, the Siamese took Vientiane, and Anouvong fled to Vietnam. When he returned with a small force in August 1828, the Siamese came back, razed Vientiane and carried off its people. Anouvong was handed over to them by the ruler of Muang Phuan and died a prisoner in Bangkok. The kingdom of Vientiane was abolished, and in the following decades well over 100,000 Lao were moved from the left bank of the Mekong to the Khorat plateau and central Siam.": "Une guerre entre le roi Anouvong de Vientiane et le Siam, dont Vientiane et Champassak étaient tributaires depuis 1779. Irrité par les exigences siamoises envers les Lao du plateau de Khorat, et persuadé que le Siam allait être attaqué par la Grande-Bretagne, Anouvong fit franchir le Mékong à ses armées pendant l’hiver 1826–1827. Elles prirent Nakhon Ratchasima, arrivèrent à trois jours de marche de Bangkok et commencèrent à ramener la population lao du plateau sur l’autre rive du fleuve. Le Siam riposta avec trois armées : les Lao furent battus à Nong Bua Lamphu en mai 1827, les Siamois prirent Vientiane et Anouvong s’enfuit au Vietnam. Lorsqu’il revint avec une petite troupe en août 1828, les Siamois revinrent à leur tour, rasèrent Vientiane et en emmenèrent les habitants. Anouvong leur fut livré par le souverain de Muang Phuan et mourut prisonnier à Bangkok. Le royaume de Vientiane fut aboli et, au cours des décennies suivantes, bien plus de 100 000 Lao furent déplacés de la rive gauche du Mékong vers le plateau de Khorat et le centre du Siam."
