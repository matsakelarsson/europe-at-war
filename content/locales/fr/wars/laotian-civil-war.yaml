# French translations of the catalogue text (wave 11); step bodies follow later.
Laotian Civil War: Guerre civile laotienne
? The war between the Royal Lao Government and the communist Pathet Lao, a proxy front of the Vietnam War. Attempts to bring the Pathet Lao into the kingdom’s government and army broke down in 1959, and a neutralist coup by Captain Kong Le in 1960 led to a three-sided war in which the United States and Thailand backed the right-wing army and the Soviet Union and North Vietnam the Pathet Lao and the neutralists. The Geneva agreement of 1962 declared Laos neutral, but the fighting resumed within a year. North Vietnam kept its troops in the east of the country to guard the Ho Chi Minh trail, while the American Central Intelligence Agency waged a “secret war” with an army of Hmong and other highlanders under Vang Pao, based at Long Tieng. From 1964 to 1973 American aircraft dropped more than 2 million tonnes of bombs on Laos, making it, per person, the most heavily bombed country in history. After the ceasefire of 1973 the Pathet Lao took power step by step, and on 2 December 1975 they abolished the monarchy and proclaimed the Lao People’s Democratic Republic.
: La guerre entre le gouvernement royal lao et le Pathet Lao communiste, un front de la guerre du Vietnam mené par puissances interposées. Les tentatives d’intégrer le Pathet Lao au gouvernement et à l’armée du royaume échouèrent en 1959, et un coup d’État neutraliste du capitaine Kong Le en 1960 déboucha sur une guerre à trois camps, dans laquelle les États-Unis et la Thaïlande soutenaient l’armée de droite, et l’Union soviétique et le Nord-Vietnam le Pathet Lao et les neutralistes. L’accord de Genève de 1962 proclama la neutralité du Laos, mais les combats reprirent en moins d’un an. Le Nord-Vietnam maintint ses troupes dans l’est du pays pour protéger la piste Hô Chi Minh, tandis que la Central Intelligence Agency américaine menait une « guerre secrète » avec une armée de Hmong et d’autres montagnards commandée par Vang Pao et basée à Long Tieng. De 1964 à 1973, l’aviation américaine largua plus de 2 millions de tonnes de bombes sur le Laos, ce qui en fit, rapporté au nombre d’habitants, le pays le plus bombardé de l’histoire. Après le cessez-le-feu de 1973, le Pathet Lao prit le pouvoir pas à pas, et le 2 décembre 1975 il abolit la monarchie et proclama la République démocratique populaire lao.
