# Some French text was translated automatically.
"Lapland War": "Guerre de Laponie"
"A war between Finland and Germany in northern Finland, fought because the Moscow Armistice required Finland to drive out the German troops still in the country. The Germans withdrew to Norway, burning much of Lapland as they went, and the last of them left Finnish soil in April 1945.": "Une guerre entre la Finlande et l’Allemagne dans le nord de la Finlande, a combattu parce que l’armistice de Moscou a exigé de la Finlande de chasser les troupes allemandes encore dans le pays. Les Allemands se sont retirés en Norvège, brûlant une grande partie de Laponie pendant qu’ils allaient, et le dernier d’entre eux a quitté le sol finlandais en avril 1945."
"The war began with a German attempt to seize the island of Suursaari (Gogland) in the Gulf of Finland on 15 September 1944, which failed. Fighting in Lapland began at the end of September.": "La guerre a commencé par une tentative allemande de saisir l’île de Suursaari (Gogland) dans le golfe de Finlande, le 15 septembre 1944, qui a échoué."
"Finnish dead numbered 774, with 262 missing; the Germans lost about 1,000 dead and some 1,300 missing or captured.": "Les Finlandais sont morts au 774, avec 262 disparus ; les Allemands ont perdu environ 1 000 morts et quelque 1 300 disparus ou capturés."
