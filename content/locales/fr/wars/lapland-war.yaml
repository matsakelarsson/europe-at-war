"September – October 1944": "septembre – octobre 1944"
"Under the Moscow Armistice Finland had to disarm or expel the German 20th Mountain Army, some 200,000 men under General Lothar Rendulic, which held northern Finland. At first the two armies kept up a staged “autumn manoeuvre”, the Germans pulling back north and the Finns following without fighting, while most of Lapland’s civilians were evacuated, some 56,000 of them to Sweden. The Germans’ attempt to seize the island of Suursaari on 15 September, which the Finns beat off, and pressure from the Soviet Control Commission ended the pretence. The first shots in Lapland were fired near Pudasjärvi on 28 September.": "Sous l’armistice de Moscou, la Finlande a dû désarmer ou expulser la 20ème armée de montagne allemande, quelque 200 000 hommes sous le général Lothar Rendulic, qui tenait le nord de la Finlande. Au début, les deux armées ont poursuivi une manœuvre d’automne, les Allemands se retirant vers le nord et les Finlandais après avoir suivi sans combattre, tandis que la plupart des civils de Laponie ont été évacués, environ 56 000 d’entre eux en Suède. Les Allemands tentent de s’emparer de l’île de Suursaari le 15 septembre, que les Finlandais battent, et la pression de la Commission soviétique de contrôle met fin à la prétention."
"On 1 October Finnish troops landed at Tornio, at the head of the Gulf of Bothnia, behind the German lines. A week of hard fighting followed around Tornio and Kemi before the Germans withdrew. On 13 October German commanders ordered the burning of everything of military use, which in practice meant whole towns and villages. When Finnish troops reached Rovaniemi, the capital of Lapland, on 16 October, almost all of it was in ashes, and the roads and bridges behind the retreating Germans had been mined and blown up.": "Le 1er octobre, les troupes finlandaises débarquent à Tornio, à la tête du golfe de Botnie, derrière les lignes allemandes. Une semaine de combats acharnés a suivi autour de Tornio et Kemi avant que les Allemands se retirent. Lorsque les troupes finlandaises ont atteint Rovaniemi, la capitale de la Laponie, le 16 octobre, presque tout était en cendres, et les routes et ponts derrière les Allemands en retraite avaient été minés et explosés."
