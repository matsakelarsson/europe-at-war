"Retreat to Norway": "Retraite en Norvège"
"October 1944 – April 1945": "octobre 1944 – avril 1945"
"After Rovaniemi the Germans withdrew along two roads, north-west through Muonio towards Norway and north through Ivalo towards the Norwegian Arctic. The Red Army, meanwhile, drove them out of Petsamo in October and followed them some way into Finnish territory along Lake Inari. The Finnish army followed slowly. Under the armistice it also had to demobilise much of its own force, and the retreating Germans destroyed the roads, bridges and buildings as they left. By November most German troops had left Finland, but from late November a rearguard held a fortified line on the Lätäseno river in the far north-west, and later positions near Kilpisjärvi, through the winter.": "Après Rovaniemi, les Allemands se sont retirés le long de deux routes, au nord-ouest par Muonio vers la Norvège et au nord par Ivalo vers l’Arctique norvégien. L’armée rouge, quant à elle, les a chassés de Petsamo en octobre et les a suivis quelque part dans le territoire finlandais le long du lac Inari. Sous l’armistice, il fallut aussi démobiliser une grande partie de sa propre force, et les Allemands en retraite détruisirent les routes, les ponts et les bâtiments à leur sortie. En novembre la plupart des troupes allemandes avaient quitté la Finlande, mais à partir de fin novembre une arrière-garde tenait une ligne fortifiée sur le fleuve Lätäseno dans l’extrême nord-ouest, puis des positions près de Kilpisjärvi, pendant l’hiver."
"On 27 April 1945 the last German troops left Finnish soil near Kilpisjärvi, and Finnish soldiers raised the flag on the cairn where Finland, Sweden and Norway meet. About 1,000 Finns had been killed or gone missing, and some 1,300 German prisoners were handed over to the Soviet Union under the armistice. Lapland was devastated. Around 40 per cent of its buildings had been destroyed, with hundreds of bridges and thousands of kilometres of road, Rovaniemi had to be rebuilt almost from scratch, and the clearing of mines and explosives went on for decades.": "Le 27 avril 1945, les dernières troupes allemandes ont quitté le sol finlandais près de Kilpisjärvi et des soldats finlandais ont levé le drapeau sur le cairn où se rencontrent la Finlande, la Suède et la Norvège. Environ 1 000 Finlandais avaient été tués ou portés disparus, et quelque 1 300 prisonniers allemands ont été remis à l’Union soviétique sous l’armistice. Environ 40 % de ses bâtiments ont été détruits, avec des centaines de ponts et des milliers de kilomètres de route, Rovaniemi a dû être reconstruit presque à partir de zéro, et le déminage des mines et des explosifs s’est poursuivi pendant des décennies."
