# French translations of the catalogue text (wave 13); step bodies follow later.
Lat Dior’s wars: Guerres de Lat Dior
? The 25-year struggle of Lat Dior Ngoné Latyr Diop, damel (king) of the Wolof kingdom of Cayor between Saint-Louis and Dakar, to keep his throne and his country’s independence against France and its candidates for the throne. Lat Dior took power in the civil wars that followed the death of Damel Birima in 1859, when France was pushing for a telegraph line and then a road across Cayor. He destroyed a French column at Ngolgol in December 1863 but was beaten at Loro in January 1864 and driven out, and France annexed Cayor in 1865. In exile he joined Maba Diakhou Bâ, converted to Islam and became his general; back in Cayor, he and Shaikh Amadou Ba beat the French at Mékhé in 1869, and France recognised him as damel in 1871. For a decade he was France’s ally, and with French artillery he crushed Amadou Ba at Samba Sadio in 1875. He broke with France over the Dakar–Saint-Louis railway, which he had accepted in 1879 and then saw as the end of Cayor’s independence; deposed at the turn of 1883, he fought a guerrilla war while the railway was built. He was killed in battle at Dekhelé in October 1886, and Cayor was divided into French-ruled provinces. Senegal remembers him as a national hero of the resistance to colonial rule.
: La lutte que mena pendant 25 ans Lat Dior Ngoné Latyr Diop, damel (roi) du royaume wolof du Cayor, entre Saint-Louis et Dakar, pour conserver son trône et l’indépendance de son pays face à la France et à ses candidats au trône. Lat Dior prit le pouvoir dans les guerres civiles qui suivirent la mort du damel Birima en 1859, alors que la France réclamait une ligne télégraphique, puis une route à travers le Cayor. Il anéantit une colonne française à Ngolgol en décembre 1863, mais fut battu à Loro en janvier 1864 et chassé, et la France annexa le Cayor en 1865. En exil, il rejoignit Maba Diakhou Bâ, se convertit à l’islam et devint son général ; de retour au Cayor, il battit les Français à Mékhé en 1869 avec Cheikh Amadou Bâ, et la France le reconnut comme damel en 1871. Pendant une décennie, il fut l’allié de la France et, avec l’artillerie française, il écrasa Amadou Bâ à Samba Sadio en 1875. Il rompit avec la France à cause du chemin de fer Dakar–Saint-Louis, qu’il avait accepté en 1879 avant d’y voir la fin de l’indépendance du Cayor ; déposé au tournant de l’année 1883, il mena une guérilla pendant la construction de la ligne. Il fut tué au combat à Dekhelé en octobre 1886, et le Cayor fut divisé en provinces sous administration française. Le Sénégal honore sa mémoire comme celle d’un héros national de la résistance à la domination coloniale.
