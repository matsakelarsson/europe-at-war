# French translations of the catalogue text (wave 9); step bodies follow later.
Late Ming peasant rebellions: Rébellions paysannes de la fin des Ming
? "The risings of famine victims, deserters and unpaid soldiers that began in Shaanxi in 1627–1628 and, over sixteen years, overthrew the Ming dynasty. Bands under leaders such as Wang Jiayin, Gao Yingxiang, Li Zicheng and Zhang Xianzhong roamed across northern and central China, surrendering when cornered and rising again, while the Ming armies were stretched between them and the Later Jin (Qing) in Liaodong. In 1635 they burned the Ming ancestral city of Fengyang; in 1636 Gao Yingxiang was captured and executed, and by 1638 the rebels seemed beaten. Famine in Henan and the Qing raids in the north revived them: Li Zicheng took Luoyang in 1641, Zhang Xianzhong Xiangyang the same year, and the siege of Kaifeng ended in October 1642 with a flood from the broken Yellow River dykes that killed most of the city’s people. In 1643 Li took Xiangyang and Xi’an, and Zhang Wuchang and Changsha. Li proclaimed the Shun dynasty at Xi’an in February 1644 and took Beijing on 24–25 April, when the Chongzhen Emperor hanged himself; Zhang founded the Great Xi in Chengdu later that year. Within weeks Li was defeated at Shanhai Pass by the Ming general Wu Sangui and the Qing, who took the empire for themselves."
: "Les soulèvements de victimes de la famine, de déserteurs et de soldats impayés qui commencèrent au Shaanxi en 1627–1628 et, en seize ans, renversèrent la dynastie Ming. Des bandes menées par des chefs comme Wang Jiayin, Gao Yingxiang, Li Zicheng et Zhang Xianzhong parcoururent le nord et le centre de la Chine, se rendant lorsqu’elles étaient acculées puis se soulevant de nouveau, tandis que les armées Ming étaient tiraillées entre elles et les Jin postérieurs (Qing) au Liaodong. En 1635, elles incendièrent Fengyang, la ville ancestrale des Ming ; en 1636, Gao Yingxiang fut capturé et exécuté et, en 1638, les rebelles semblaient vaincus. La famine au Henan et les raids des Qing dans le Nord les ranimèrent : Li Zicheng prit Luoyang en 1641, Zhang Xianzhong Xiangyang la même année, et le siège de Kaifeng s’acheva en octobre 1642 par une inondation due à la rupture des digues du fleuve Jaune, qui tua la plupart des habitants de la ville. En 1643, Li prit Xiangyang et Xi’an, et Zhang Wuchang et Changsha. Li proclama la dynastie Shun à Xi’an en février 1644 et prit Pékin les 24 et 25 avril, tandis que l’empereur Chongzhen se pendait ; Zhang fonda le Grand Xi à Chengdu plus tard la même année. En quelques semaines, Li fut battu à la passe de Shanhai par le général Ming Wu Sangui et par les Qing, qui s’emparèrent de l’empire pour eux-mêmes."
