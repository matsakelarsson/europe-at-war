# French translations of the catalogue text (wave 10); step bodies follow later.
Peasant rebellions of late Silla: Rébellions paysannes de la fin de Silla
? The wave of risings that broke Silla’s hold on its provinces under Queen Jinseong. After a drought in 888 the provinces stopped sending their taxes, and in 889 the court, its storehouses empty, sent officials to press for payment. Revolts broke out across the country. The first recorded was that of Wonjong and Aeno, who held the fortress of Sabeol-ju (today’s Sangju) in 889; the official sent against them, the naema Yeonggi, did not dare to attack, and the village head U-ryeon was killed fighting them. The queen had Yeonggi executed and gave U-ryeon’s son, about ten years old, his father’s post; what became of the rebels is not recorded. About 891 Gi Hwon rose at Jukju (Juksan) and Yanggil at Bugwon (Wonju); Gung Ye served first Gi Hwon, then Yanggil. In 892 the Silla officer Gyeon Hwon seized Mujinju (Gwangju) in the south-west. In 896 a band known for its red trousers, the Jeokgojeok (“Red Trousers”), plundered the counties south-west of the capital and reached Moryang-ri, on the western edge of Geumseong (Gyeongju) itself. By then Silla controlled little beyond the area around its capital, and the local strongmen who had risen during these years founded the kingdoms of the Later Three Kingdoms period.
: La vague de soulèvements qui brisa l’emprise de Silla sur ses provinces sous la reine Jinseong. Après une sécheresse en 888, les provinces cessèrent d’envoyer leurs impôts et, en 889, la cour, dont les entrepôts étaient vides, envoya des fonctionnaires exiger le paiement. Des révoltes éclatèrent dans tout le pays. La première dont les sources gardent la trace fut celle de Wonjong et Aeno, qui tinrent la forteresse de Sabeol-ju (l’actuelle Sangju) en 889 ; le fonctionnaire envoyé contre eux, le naema Yeonggi, n’osa pas attaquer, et le chef de village U-ryeon fut tué en les combattant. La reine fit exécuter Yeonggi et donna au fils d’U-ryeon, âgé d’une dizaine d’années, le poste de son père ; les sources ne disent pas ce qu’il advint des rebelles. Vers 891, Gi Hwon se souleva à Jukju (Juksan) et Yanggil à Bugwon (Wonju) ; Gung Ye servit d’abord Gi Hwon, puis Yanggil. En 892, l’officier de Silla Gyeon Hwon s’empara de Mujinju (Gwangju), dans le sud-ouest. En 896, une bande connue pour ses pantalons rouges, les Jeokgojeok (« Pantalons rouges »), pilla les districts situés au sud-ouest de la capitale et atteignit Moryang-ri, à la lisière occidentale de Geumseong (Gyeongju) même. Silla ne contrôlait plus alors guère que les environs de sa capitale, et les hommes forts locaux qui s’étaient imposés pendant ces années fondèrent les royaumes de la période des Trois Royaumes postérieurs.
