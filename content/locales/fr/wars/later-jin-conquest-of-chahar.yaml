# French translations of the catalogue text (wave 9); step bodies follow later.
Later Jin conquest of Chahar: Conquête des Chahar par les Jin postérieurs
The wars in which Ligdan Khan of the Chahar, the last Mongol great khan of the line of Kublai and Dayan Khan, lost the southern Mongols to Hong Taiji’s Later Jin. Ligdan, khan from 1604, tried to rule the other Mongol tümens directly and took Ming silver to fight the Jurchens; instead the Khorchin, the Kharachin, the Tümed and others allied with the Later Jin. In 1627–1628 he moved his people west from the Shira Muren to Köke Khota (Hohhot) and fought a coalition of the western tümens there, and in 1628 Hong Taiji made his first campaign against him. In 1632 Hong Taiji and his Mongol allies marched west; Ligdan fled across the Yellow River without fighting, and in 1634 he died of smallpox on his way to Kokonor. In 1635 a Later Jin army under Dorgon received the surrender of his son Ejei and a seal said to be that of the Yuan emperors. Hong Taiji, acknowledged as khan by the southern Mongol princes, proclaimed the Qing dynasty in 1636.: Les guerres au cours desquelles Ligdan Khan des Chahar, dernier grand khan mongol de la lignée de Kubilai et de Dayan Khan, perdit les Mongols du Sud au profit des Jin postérieurs de Hong Taiji. Ligdan, khan depuis 1604, tenta de gouverner directement les autres tümens mongols et accepta l’argent des Ming pour combattre les Jürchens ; au lieu de se soumettre, les Khorchin, les Kharachin, les Tümed et d’autres s’allièrent aux Jin postérieurs. En 1627–1628, il déplaça son peuple vers l’ouest, de la Shira Muren à Köke Khota (Hohhot), où il combattit une coalition des tümens occidentaux, et en 1628 Hong Taiji mena sa première campagne contre lui. En 1632, Hong Taiji et ses alliés mongols marchèrent vers l’ouest ; Ligdan s’enfuit au-delà du fleuve Jaune sans combattre et mourut de la variole en 1634, en route vers le Kokonor. En 1635, une armée des Jin postérieurs commandée par Dorgon reçut la reddition de son fils Ejei, ainsi qu’un sceau que l’on disait être celui des empereurs Yuan. Hong Taiji, reconnu comme khan par les princes mongols du Sud, proclama la dynastie Qing en 1636.
