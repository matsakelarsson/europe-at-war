# French translations of the catalogue text (wave 10); step bodies follow later.
Later Jin invasion of Joseon: Invasion de Joseon par les Jin postérieurs
The first Manchu invasion of Korea, called Jeongmyo Horan in Korean after the year 1627 in the sixty-year cycle. Hong Taiji, the new khan of the Later Jin, wanted to secure his rear before fighting the Ming, to stop Korean support for the Ming general Mao Wenlong, who raided Liaodong from Ka Island off the Korean coast, and to obtain grain and trade for his people. At the end of February 1627 about 30,000 men under his cousin Amin crossed the Yalu, guided by the Korean general Gang Hong-rip, who had surrendered at Sarhu in 1619, and by fugitives from Yi Gwal’s rebellion. They took Uiju, Anju and Pyongyang within two weeks, and King Injo fled to Ganghwa Island. With militias active behind his lines and the war with the Ming in mind, Amin made peace at Ganghwa on 18 April 1627. Joseon and the Later Jin became “elder and younger brothers”, Korea opened border markets and sent tribute, but kept its ties with the Ming, which led to the second invasion of 1636.: La première invasion mandchoue de la Corée, appelée en coréen Jeongmyo Horan, d’après l’année 1627 dans le cycle sexagésimal. Hong Taiji, le nouveau khan des Jin postérieurs, voulait assurer ses arrières avant de combattre les Ming, mettre fin au soutien coréen au général Ming Mao Wenlong, qui lançait des raids sur le Liaodong depuis l’île de Ka, au large de la côte coréenne, et obtenir du grain et des échanges commerciaux pour son peuple. À la fin de février 1627, environ 30 000 hommes commandés par son cousin Amin franchirent le Yalu, guidés par le général coréen Gang Hong-rip, qui s’était rendu à Sarhu en 1619, et par des fugitifs de la rébellion de Yi Gwal. Ils prirent Uiju, Anju et Pyongyang en deux semaines, et le roi Injo s’enfuit dans l’île de Ganghwa. Avec des milices actives derrière ses lignes et la guerre contre les Ming en tête, Amin fit la paix à Ganghwa le 18 avril 1627. Joseon et les Jin postérieurs devinrent « frère aîné et frère cadet », la Corée ouvrit des marchés frontaliers et envoya un tribut, mais conserva ses liens avec les Ming, ce qui entraîna la seconde invasion de 1636.
