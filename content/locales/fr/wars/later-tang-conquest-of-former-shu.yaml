# French translations of the catalogue text (wave 9); step bodies follow later.
Later Tang conquest of Former Shu: Conquête des Shu antérieurs par les Tang postérieurs
? "The campaign in which the Later Tang, newly master of northern China, conquered the Former Shu kingdom in Sichuan in little more than two months at the end of 925. Li Cunxu (Emperor Zhuangzong) gave the nominal command to his son Li Jiji and the real command to his chief of staff Guo Chongtao. The Shu emperor Wang Yan, son of the founder Wang Jian, had paid little heed to the threat and was touring his realm when the invasion came. The Later Tang army marched south from Fengxiang over the Qinling, defeated the Shu forces sent against it and took the passes and the frontier towns as their garrisons surrendered. In Chengdu the general Wang Zongbi, Wang Yan’s adoptive brother, seized the palace and the treasury and surrendered the realm, and Wang Yan submitted in December 925. Shu, with its large population and wealth, became part of the Later Tang. The victory brought little lasting gain: in 926 the emperor had Guo Chongtao and Wang Yan’s family killed, risings spread through the army, and Li Cunxu himself was killed in Luoyang. Sichuan broke away again under Meng Zhixiang, who founded the Later Shu in 934."
: "La campagne au cours de laquelle les Tang postérieurs, depuis peu maîtres de la Chine du Nord, conquirent le royaume des Shu antérieurs, au Sichuan, en un peu plus de deux mois, à la fin de 925. Li Cunxu (l’empereur Zhuangzong) confia le commandement nominal à son fils Li Jiji et le commandement effectif à son chef d’état-major Guo Chongtao. L’empereur des Shu, Wang Yan, fils du fondateur Wang Jian, avait fait peu de cas de la menace et parcourait son royaume lorsque l’invasion survint. L’armée des Tang postérieurs marcha vers le sud depuis Fengxiang à travers les monts Qinling, battit les forces des Shu envoyées contre elle et prit les cols et les villes frontalières à mesure que leurs garnisons se rendaient. À Chengdu, le général Wang Zongbi, frère adoptif de Wang Yan, s’empara du palais et du trésor et livra le royaume, et Wang Yan fit sa soumission en décembre 925. Le pays de Shu, riche et très peuplé, fut intégré aux Tang postérieurs. La victoire n’apporta guère de gain durable : en 926, l’empereur fit tuer Guo Chongtao et la famille de Wang Yan, des soulèvements gagnèrent l’armée, et Li Cunxu lui-même fut tué à Luoyang. Le Sichuan fit de nouveau sécession sous Meng Zhixiang, qui fonda les Shu postérieurs en 934."
