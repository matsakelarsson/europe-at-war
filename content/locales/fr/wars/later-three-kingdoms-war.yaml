# French translations of the catalogue text (wave 10); step bodies follow later.
Wars of the Later Three Kingdoms: Guerres des Trois Royaumes postérieurs
? The wars in which Silla broke apart and Korea was reunited under Goryeo. As Silla’s authority collapsed in the late 880s, local strongmen took over the provinces. Gyeon Hwon, a Silla officer, seized the south-west in 892 and proclaimed the kingdom of Baekje (Later Baekje) at Jeonju in 900; Gung Ye, a former monk, built up a state in the centre and north and proclaimed himself king in 901, naming it Goryeo, then Majin and Taebong. Silla was left with the south-east around its capital, Gyeongju. In 918 Gung Ye’s generals overthrew him and made Wang Geon king of a new Goryeo. Later Baekje held the upper hand in the 920s, sacking Gyeongju in 927 and routing Wang Geon at Gongsan, but Goryeo’s victory at Gochang in 930 brought the east coast over to it. In 935 Gyeon Hwon was deposed by his son Singeom and fled to Goryeo, and the last Silla king, Gyeongsun, handed his kingdom over to Wang Geon. In 936 Goryeo destroyed the Later Baekje army at Illicheon, near today’s Gumi, and Singeom surrendered, leaving Goryeo the master of the peninsula south of the Taedong River.
: Les guerres au cours desquelles le Silla se désagrégea et la Corée fut réunifiée sous le Goryeo. Lorsque l’autorité du Silla s’effondra à la fin des années 880, des potentats locaux prirent le contrôle des provinces. Gyeon Hwon, un officier du Silla, s’empara du sud-ouest en 892 et proclama le royaume de Baekje (Baekje postérieur) à Jeonju en 900 ; Gung Ye, un ancien moine, constitua un État dans le centre et le nord et se proclama roi en 901, lui donnant le nom de Goryeo, puis de Majin et de Taebong. Le Silla ne conserva que le sud-est, autour de sa capitale, Gyeongju. En 918, les généraux de Gung Ye le renversèrent et firent de Wang Geon le roi d’un nouveau Goryeo. Le Baekje postérieur eut l’avantage dans les années 920, mettant Gyeongju à sac en 927 et infligeant une déroute à Wang Geon à Gongsan, mais la victoire du Goryeo à Gochang en 930 lui rallia la côte est. En 935, Gyeon Hwon fut déposé par son fils Singeom et s’enfuit au Goryeo, et le dernier roi de Silla, Gyeongsun, remit son royaume à Wang Geon. En 936, le Goryeo anéantit l’armée du Baekje postérieur à Illicheon, près de l’actuelle Gumi, et Singeom se rendit, laissant le Goryeo maître de la péninsule au sud du fleuve Taedong.
