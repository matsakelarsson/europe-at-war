# French translations of the catalogue text (wave 10); step bodies follow later.
Later Three Years’ War: Guerre de Gosannen
? A succession war within the Kiyohara, the family that had ruled northern Mutsu and Dewa since the Former Nine Years’ War, in which the governor of Mutsu, Minamoto no Yoshiie, took sides and Fujiwara no Kiyohira emerged as master of the north. When Yoshiie arrived as governor in 1083 the Kiyohara chief Sanehira was fighting his half-brother Iehira and his step-brother Kiyohira. Sanehira died suddenly on campaign, and Yoshiie divided his six districts between the two brothers; in 1086 Iehira burned Kiyohira’s house and killed his wife and children, and Yoshiie took up Kiyohira’s cause. Yoshiie failed against Iehira at the fort of Numa in the winter of 1086, and in 1087 besieged Iehira and his uncle Takehira in the fort of Kanazawa in Dewa. After a siege through the autumn, in which women and children who came out were killed so that the defenders’ food would run out faster, the starving garrison set fire to the fort and fled on 11 December 1087; Takehira was captured and beheaded and Iehira was killed in flight. The court refused to treat the war as a public campaign, gave Yoshiie no reward and dismissed him, but his generosity to his eastern warriors from his own purse built the loyalty on which his descendant Yoritomo would draw. Kiyohira took his father’s name of Fujiwara and founded the Northern Fujiwara of Hiraizumi.
: Une guerre de succession au sein des Kiyohara, la famille qui gouvernait le nord du Mutsu et le Dewa depuis la guerre de Zenkunen, dans laquelle le gouverneur du Mutsu, Minamoto no Yoshiie, prit parti et dont Fujiwara no Kiyohira sortit maître du Nord. Lorsque Yoshiie arriva comme gouverneur en 1083, le chef des Kiyohara, Sanehira, combattait son demi-frère Iehira et Kiyohira, le fils de sa belle-mère. Sanehira mourut subitement en campagne, et Yoshiie partagea ses six districts entre les deux frères ; en 1086, Iehira incendia la maison de Kiyohira et tua sa femme et ses enfants, et Yoshiie prit fait et cause pour Kiyohira. Yoshiie échoua contre Iehira au fort de Numa au cours de l’hiver 1086 et, en 1087, assiégea Iehira et son oncle Takehira dans le fort de Kanazawa, dans le Dewa. Après un siège qui dura tout l’automne, au cours duquel les femmes et les enfants qui sortaient du fort furent tués afin que les vivres des défenseurs s’épuisent plus vite, la garnison affamée mit le feu au fort et s’enfuit le 11 décembre 1087 ; Takehira fut capturé et décapité, et Iehira fut tué dans sa fuite. La cour refusa de considérer la guerre comme une campagne publique, ne donna aucune récompense à Yoshiie et le destitua, mais la générosité dont il fit preuve envers ses guerriers de l’Est, sur ses propres deniers, forgea la loyauté sur laquelle son descendant Yoritomo allait s’appuyer. Kiyohira prit le nom de son père, Fujiwara, et fonda la lignée des Fujiwara du Nord de Hiraizumi.
