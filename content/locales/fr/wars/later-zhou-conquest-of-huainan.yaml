# French translations of the catalogue text (wave 9); step bodies follow later.
Later Zhou campaigns against Southern Tang and Liao: Campagnes des Zhou postérieurs contre les Tang du Sud et les Liao
? The wars of Chai Rong (Emperor Shizong of Later Zhou), the strongest ruler of the Five Dynasties, which set the stage for the Song reunification of China. Having beaten the Northern Han and the Liao at Gaoping in 954 and taken four prefectures from Later Shu in 955, he turned on the Southern Tang, the largest southern state, in early 956. His armies crossed the Huai on a pontoon bridge, crushed the Tang relief army at Zhengyang, and took Chuzhou and Yangzhou, with Zhao Kuangyin, the future founder of the Song, among the leading generals; Wuyue joined in from the south-east. The fortress of Shouzhou on the Huai held out for fourteen months until April 957, after the Tang relief army was destroyed at Purple Mountain. In 958 the Southern Tang ruler Li Jing ceded all his land north of the Yangtze, some quarter of a million households, gave up the title of emperor and became the vassal King of Jiangnan. In 959 Chai Rong marched north against the Liao and took the prefectures of Ning, Mo and Ying and the frontier passes south of Youzhou, but he fell ill before reaching the city and died on 27 July 959. Six months later Zhao Kuangyin took the throne.
: Les guerres de Chai Rong (l’empereur Shizong des Zhou postérieurs), le plus puissant souverain des Cinq Dynasties, qui préparèrent la réunification de la Chine par les Song. Après avoir battu les Han du Nord et les Liao à Gaoping en 954 et pris quatre préfectures aux Shu postérieurs en 955, il se tourna au début de 956 contre les Tang du Sud, le plus grand des États du Sud. Ses armées franchirent la Huai sur un pont de bateaux, écrasèrent l’armée de secours des Tang à Zhengyang et prirent Chuzhou et Yangzhou ; Zhao Kuangyin, le futur fondateur des Song, comptait parmi les principaux généraux, et le Wuyue entra dans la guerre depuis le sud-est. La forteresse de Shouzhou, sur la Huai, résista quatorze mois et ne tomba qu’en avril 957, après l’anéantissement de l’armée de secours des Tang à la Montagne Pourpre. En 958, le souverain des Tang du Sud, Li Jing, céda toutes ses terres au nord du Yangtsé, quelque 250 000 foyers, renonça au titre d’empereur et devint le roi vassal du Jiangnan. En 959, Chai Rong marcha vers le nord contre les Liao et prit les préfectures de Ning, de Mo et de Ying ainsi que les cols frontaliers au sud de Youzhou, mais il tomba malade avant d’atteindre la ville et mourut le 27 juillet 959. Six mois plus tard, Zhao Kuangyin s’empara du trône.
