"December 1918 – July 1919": "décembre 1918 – juillet 1919"
"Latvia was proclaimed independent in Riga on 18 November 1918, with Kārlis Ulmanis as head of a provisional government, but it had almost no army. The Red Army, with the Latvian Riflemen at its core, invaded in December and took Riga on 3 January 1919. Pēteris Stučka’s Latvian Socialist Soviet Republic ruled most of the country through revolutionary tribunals, requisitions and terror, and Riga went hungry. Ulmanis’s government fell back to Liepāja, where the remaining German troops, the Baltic German volunteers of the Landeswehr and a small Latvian force held the line of the Venta.": "La Lettonie a été proclamée indépendante à Riga le 18 novembre 1918, avec Kārlis Ulmanis comme chef d’un gouvernement provisoire, mais elle n’avait presque pas d’armée. L’Armée rouge, avec les Riflemen lettons à son cœur, envahit en décembre et prit Riga le 3 janvier 1919. Le gouvernement d’Ulmanis est retombé à Liepāja, où les troupes allemandes restantes, les volontaires allemands baltes de la Landeswehr et une petite force lettone ont maintenu la ligne de Venta."
"In March the Germans under General Rüdiger von der Goltz and the Latvians counter-attacked. On 16 April Baltic Germans staged a coup in Liepāja and set up a puppet government under Andrievs Niedra, and Ulmanis’s ministers took refuge on the steamer Saratov under British protection. The Landeswehr and the Iron Division took Riga on 22 May and shot suspected Bolsheviks, then pushed north, where Estonian troops and the North Latvian Brigade beat them at Cēsis on 19–23 June. Under the armistice of 3 July the Germans were to leave Latvia, and Ulmanis returned to Riga on 8 July.": "En mars, les Allemands sous le général Rüdiger von der Goltz et les Lettons contre-attaquent. Le 16 avril, les Allemands de la Baltique ont organisé un coup d’État à Liepāja et mis en place un gouvernement de marionnettes sous Andrievs Niedra, et les ministres d’Ulmani se sont réfugiés sur le vapeur Saratov sous protection britannique. Les Landeswehr et la division de fer ont pris Riga le 22 mai et tiré sur des bolcheviks soupçonnés, puis ont poussé vers le nord, où les troupes estoniennes et la brigade nord- lettone les ont battus à Cysis les 19-23 juin. Sous l’armistice du 3 juillet, les Allemands devaient quitter la Lettonie, et Ulmanis est retourné à Riga le 8 juillet."
