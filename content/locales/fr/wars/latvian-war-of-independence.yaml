"Bermondt’s attack on Riga": "Attaque de Bermondt sur Riga"
"October – December 1919": "octobre – décembre 1919"
"The German troops did not leave. Many joined the West Russian Volunteer Army of Pavel Bermondt-Avalov, some 30,000 men or more, most of them German Freikorps soldiers with Russian former prisoners of war. Nominally it was to fight the Bolsheviks for the Whites, but its aim was to keep the Baltic under German control. On 8 October 1919 it attacked Riga from Jelgava and took Pārdaugava, the part of the city on the left bank of the Daugava. The Latvian government left the city, but the army held the right bank and the bridges, helped by British and French warships at the river mouth.": "Les troupes allemandes ne partirent pas. Beaucoup se joignirent à l’armée de volontaires de Russie occidentale de Pavel Bermondt-Avalov, quelque 30 000 hommes ou plus, la plupart d’entre eux soldats allemands de Freikorps avec des anciens prisonniers de guerre russes. Le 8 octobre 1919, il attaque Riga à partir de Jelgava et prend Pārdaugava, la partie de la ville sur la rive gauche du Daugava. Le gouvernement letton quitte la ville, mais l’armée tient la rive droite et les ponts, aidés par des navires de guerre britanniques et français à l’embouchure du fleuve."
"Estonian armoured trains came to help, and after a month of fighting the Latvians counter-attacked. On 11 November they drove the Bermontians out of Pārdaugava; the day is now Lāčplēsis Day, when Latvia remembers its soldiers. The Latvians pursued the Bermontians south and took Jelgava on 21 November, while Lithuanian troops beat them at Radviliškis on 21–22 November. By mid-December the last of Bermondt’s troops had withdrawn to Germany under Allied supervision.": "Les trains blindés estoniens sont venus aider, et après un mois de combats les Lettons ont contre-attaqué. Le 11 novembre, ils ont chassé les Bermontiens de Pārdaugava ; le jour est maintenant Lāčplasis, où la Lettonie se souvient de ses soldats. Les Lettons poursuivirent les Bermontiens au sud et prirent Jelgava le 21 novembre, tandis que les troupes lituaniennes les battaient à Radviliškis les 21-22 novembre. À la mi-décembre, les dernières troupes de Bermondt s’étaient retirées en Allemagne sous la supervision des Alliés."
