"Latgale and the Treaty of Riga": "Latgale et le Traité de Riga"
"January – August 1920": "janvier – août 1920"
"The Red Army still held Latgale, Latvia’s eastern province. In January 1920 Latvian troops and Polish forces under Edward Rydz-Śmigły attacked together, crossing the frozen Daugava, and Daugavpils fell on 3 January. Poland handed the town to Latvia. By the end of January the Latvians had cleared the rest of Latgale, and on 1 February a ceasefire with Soviet Russia came into force. Latvia and Lithuania, meanwhile, disputed the border between them, which a British arbitrator settled in 1921.": "En janvier 1920, les troupes lettones et les forces polonaises sous Edward Rydz-.Migły attaquèrent ensemble, traversant le Daugava gelé, et Daugavpils tomba le 3 janvier. La Pologne remit la ville à la Lettonie. Fin janvier, les Lettons avaient défriché le reste du Latgale et un cessez-le-feu avec la Russie soviétique est entré en vigueur le 1er février. Entre-temps, la Lettonie et la Lituanie contestaient la frontière entre elles, qu’un arbitre britannique avait établie en 1921."
"Peace talks began in April, and on 11 August 1920, as the Red Army was advancing on Warsaw, Soviet Russia and Latvia signed the Treaty of Riga. Soviet Russia recognised Latvia’s independence and renounced all claims to its territory for ever, and Latvia received the Abrene district around Pytalovo, formerly part of Pskov province. About 3,000 Latvian soldiers had been killed in the war. As in Estonia, a land reform broke up the large estates, most of them owned by Baltic German nobles, and gave the land to soldiers and landless peasants.": "Les pourparlers de paix ont commencé en avril et le 11 août 1920, alors que l’Armée rouge progressait sur Varsovie, la Russie soviétique et la Lettonie ont signé le traité de Riga. La Russie soviétique a reconnu l’indépendance de la Lettonie et renoncé à toute revendication sur son territoire pour toujours, et la Lettonie a reçu le district d’Abrene autour de Pytalovo, anciennement partie de la province de Pskov. Comme en Estonie, une réforme agraire a brisé les grands domaines, dont la plupart appartenaient à des nobles allemands de la Baltique, et a donné la terre aux soldats et aux paysans sans terres."
