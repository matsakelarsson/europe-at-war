# Some French text was translated automatically.
"Latvian War of Independence": "Guerre d’indépendance lettone"
"A war for the new Republic of Latvia, proclaimed in November 1918, against Soviet Russia and its Latvian Soviet Republic and against German Freikorps, the Baltic German Landeswehr and the Bermontians, who sought to keep the country under German control. With Estonian, Polish and British help, Latvia drove out its enemies by early 1920, and Soviet Russia recognised its independence in the Treaty of Riga of 11 August 1920.": "Une guerre pour la nouvelle République de Lettonie, proclamée en novembre 1918, contre la Russie soviétique et sa République soviétique lettone et contre les Freikorps allemands, les Landeswehrs allemands baltes et les Bermontiens, qui cherchaient à garder le pays sous contrôle allemand.Avec l’aide estonienne, polonaise et britannique, la Lettonie a chassé ses ennemis au début de 1920, et la Russie soviétique a reconnu son indépendance dans le traité de Riga du 11 août 1920."
"Also called Latvia’s freedom battles (brīvības cīņas). Dates are New Style.": "Aussi appelé la Lettonie batailles pour la liberté (brīvības cīшas). Les dates sont Nouveau style."
"The Landeswehr fought the Red Army alongside the Latvians in early 1919 and fought them at Cēsis in June; from July 1919 it served under Latvian command.": "Au début de 1919, les Landeswehr combattirent l’Armée rouge aux côtés des Lettons et les combattèrent à Cysis en juin ; à partir de juillet 1919, elle servit sous le commandement letton."
"The taking of Daugavpils in January 1920 was also part of the Polish–Soviet War, which has its own entry. Front lines are approximate.": "La prise de Daugavpils en janvier 1920 faisait également partie de la guerre polonaise-soviétique, qui a sa propre entrée. Les lignes de front sont approximatives."
