# French translations of the catalogue text (wave 11); step bodies follow later.
Lê–Mạc war: Guerre entre les Lê et les Mạc
The civil war between the Mạc dynasty, founded when the general Mạc Đăng Dung took the throne of Đại Việt in 1527, and supporters of the Later Lê dynasty, a period Vietnamese historians call the Southern and Northern Dynasties. In 1533 the general Nguyễn Kim, from exile in Lan Xang, proclaimed a Lê prince emperor and won back Thanh Hóa and Nghệ An. The Mạc, who held the Red River delta and the capital Đông Kinh (Hanoi), bought off a Ming invasion in 1540–1541 by submitting to the Ming at the border. For half a century the two courts fought along the Mã River and on the coasts of Thanh Hóa, while real power on the Lê side passed after Nguyễn Kim’s death to his son-in-law Trịnh Kiểm and the Trịnh lords. In 1592 Trịnh Tùng took Đông Kinh and the Mạc ruler Mạc Mậu Hợp was captured and executed. Members of the Mạc family held out in Cao Bằng on the Chinese border, under Ming and then Qing protection, until 1677.: La guerre civile entre la dynastie Mạc, fondée lorsque le général Mạc Đăng Dung s’empara du trône du Đại Việt en 1527, et les partisans de la dynastie des Lê postérieurs, période que les historiens vietnamiens appellent l’époque des dynasties du Sud et du Nord. En 1533, le général Nguyễn Kim, exilé au Lan Xang, proclama empereur un prince Lê et reconquit le Thanh Hóa et le Nghệ An. Les Mạc, qui tenaient le delta du fleuve Rouge et la capitale Đông Kinh (Hanoï), désamorcèrent une invasion Ming en 1540–1541 en se soumettant aux Ming à la frontière. Pendant un demi-siècle, les deux cours s’affrontèrent le long du fleuve Mã et sur les côtes du Thanh Hóa, tandis que, dans le camp Lê, le pouvoir réel passait après la mort de Nguyễn Kim à son gendre Trịnh Kiểm et aux seigneurs Trịnh. En 1592, Trịnh Tùng prit Đông Kinh, et le souverain Mạc, Mạc Mậu Hợp, fut capturé et exécuté. Des membres de la famille Mạc tinrent bon à Cao Bằng, à la frontière chinoise, sous la protection des Ming puis des Qing, jusqu’en 1677.
