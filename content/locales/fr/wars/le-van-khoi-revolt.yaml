# French translations of the catalogue text (wave 11); step bodies follow later.
Lê Văn Khôi revolt: Révolte de Lê Văn Khôi
? A revolt in southern Vietnam against the emperor Minh Mạng. The south had been governed almost on its own by the general Lê Văn Duyệt, who had opposed Minh Mạng’s accession and protected Catholic missionaries and Chinese merchants. After Duyệt’s death in 1832 the court abolished his governorship of Gia Định and opened a case against him. On the night of 5 July 1833 his adopted son Lê Văn Khôi broke out of prison with his followers, killed the new governor and the court’s investigator, and seized the Phiên An citadel at Saigon; within a month the rebels held all six southern provinces. Khôi gave his support to the line of Gia Long’s eldest son, Prince Cảnh, promised to protect Christianity, and asked Siam for help, which led to the Siamese invasion of Cambodia and southern Vietnam in November 1833. Imperial armies under Trương Minh Giảng and others retook the provinces and besieged the citadel, where Khôi died of illness in 1834. The citadel was stormed on 8 September 1835. About 550 defenders were killed in the assault, and the prisoners were executed and buried in a mass grave known as Mả Ngụy, the rebels’ grave; estimates of the number buried there range from about 1,300 to 1,831. Khôi’s young son Lê Văn Cù, the French missionary Joseph Marchand and four leaders were taken to Huế and put to death by slow slicing; Marchand died on 30 November 1835. Minh Mạng had the citadel razed, Duyệt’s tomb desecrated, and stepped up the persecution of Catholics.
: Une révolte dans le sud du Vietnam contre l’empereur Minh Mạng. Le Sud avait été gouverné de façon presque autonome par le général Lê Văn Duyệt, qui s’était opposé à l’avènement de Minh Mạng et protégeait les missionnaires catholiques et les marchands chinois. Après la mort de Duyệt en 1832, la cour supprima son gouvernorat de Gia Định et ouvrit une procédure contre lui. Dans la nuit du 5 juillet 1833, son fils adoptif Lê Văn Khôi s’évada de prison avec ses partisans, tua le nouveau gouverneur et l’enquêteur de la cour et s’empara de la citadelle de Phiên An, à Saïgon ; en un mois, les rebelles tenaient les six provinces du Sud. Khôi apporta son soutien à la lignée du fils aîné de Gia Long, le prince Cảnh, promit de protéger le christianisme et demanda l’aide du Siam, ce qui entraîna l’invasion siamoise du Cambodge et du sud du Vietnam en novembre 1833. Les armées impériales commandées notamment par Trương Minh Giảng reprirent les provinces et assiégèrent la citadelle, où Khôi mourut de maladie en 1834. La citadelle fut prise d’assaut le 8 septembre 1835. Environ 550 défenseurs furent tués lors de l’assaut, et les prisonniers furent exécutés et enterrés dans une fosse commune appelée Mả Ngụy, la tombe des rebelles ; les estimations du nombre de personnes qui y furent enterrées vont d’environ 1 300 à 1 831. Le jeune fils de Khôi, Lê Văn Cù, le missionnaire français Joseph Marchand et quatre chefs furent emmenés à Huế et mis à mort par le supplice des cent morceaux ; Marchand mourut le 30 novembre 1835. Minh Mạng fit raser la citadelle et profaner le tombeau de Duyệt, et intensifia la persécution des catholiques.
