# French translations of the catalogue text (wave 9); step bodies follow later.
Li Jiqian’s revolt: Révolte de Li Jiqian
? The twenty-year struggle in which the Tangut chief Li Jiqian resisted the Song and laid the foundations of the Western Xia state. The Tangut Li family had ruled the Dingnan circuit around Xiazhou in the Ordos, on the north-western frontier, almost independently since the late Tang. In 982 its head, Li Jipeng, facing opposition among the Tangut elite, went to the Song court and handed over his lands. His kinsman Li Jiqian refused to submit and fled into the steppe with a band of followers. A Song attack on his camp in 984 captured his mother and wife, but in 985 he took Yinzhou and its stores, and his following grew. He paid tribute to the Liao from 986, married a Khitan princess in 989 and was named King of Xia by the Liao in 990, while making gestures of submission to the Song when it suited him. He defeated Li Jipeng, sent against him by the Song, in 994, and raided Lingzhou in 996 and 997. In 998 the new Song emperor Zhenzong recognised him as governor of Dingnan, but he soon began raiding again, and in 1002 took Lingzhou, the great Song stronghold on the Yellow River, which he made his capital as Xiping. He was wounded fighting the Tibetans of Liangzhou and died on 6 January 1004. His son Li Deming kept peace with the Song, and his grandson Li Yuanhao proclaimed the Western Xia empire in 1038.
: La lutte de vingt ans au cours de laquelle le chef tangoute Li Jiqian résista aux Song et jeta les bases de l’État des Xia occidentaux. La famille tangoute des Li gouvernait de façon presque indépendante, depuis la fin des Tang, le circuit de Dingnan, autour de Xiazhou dans l’Ordos, sur la frontière nord-ouest. En 982, son chef, Li Jipeng, confronté à l’opposition d’une partie de l’élite tangoute, se rendit à la cour des Song et lui remit ses terres. Son parent Li Jiqian refusa de se soumettre et s’enfuit dans la steppe avec une troupe de partisans. Une attaque des Song contre son camp en 984 permit de capturer sa mère et son épouse, mais en 985 il prit Yinzhou et ses réserves, et le nombre de ses partisans grandit. Il versa tribut aux Liao à partir de 986, épousa une princesse khitane en 989 et fut nommé roi de Xia par les Liao en 990, tout en faisant acte de soumission aux Song quand cela l’arrangeait. Il battit en 994 Li Jipeng, envoyé contre lui par les Song, et lança des raids sur Lingzhou en 996 et en 997. En 998, le nouvel empereur Song Zhenzong le reconnut comme gouverneur du Dingnan, mais il reprit bientôt ses raids et, en 1002, prit Lingzhou, la grande place forte des Song sur le fleuve Jaune, dont il fit sa capitale sous le nom de Xiping. Blessé en combattant les Tibétains de Liangzhou, il mourut le 6 janvier 1004. Son fils Li Deming maintint la paix avec les Song, et son petit-fils Li Yuanhao proclama l’empire des Xia occidentaux en 1038.
