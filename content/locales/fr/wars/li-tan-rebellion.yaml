# French translations of the catalogue text (wave 9); step bodies follow later.
Li Tan’s rebellion: Rébellion de Li Tan
? "A rising in Shandong against Kublai Khan while he was fighting his brother Ariq Böke for the throne. Li Tan, son of the Shandong warlord Li Quan, had governed Yidu (Qingzhou) for the Mongols for some thirty years as a hereditary lord, commanding the coast and the border with the Song; his father-in-law Wang Wentong was one of Kublai’s chief ministers. After recovering his son, who had been held at the Mongol court, Li Tan rose on 22 February 1262, killed the Mongol troops in his territory and handed Lianshui, Haizhou and Donghai on the Huai frontier to the Song, which made him a military governor. He then seized Jinan. Kublai sent Prince Qabichi and the Chinese generals Shi Tianze, Shi Shu and Zhang Hongfan against him; Song relief troops turned back, though the Song general Xia Gui took a number of towns along the border. From about May Jinan was ringed with walls and ditches and starved. When it fell in early August, Li Tan tried to drown himself in Daming Lake, was pulled out and was executed on 6 August 1262, beheaded according to most accounts or trampled by horses according to others. Wang Wentong was executed for corresponding with him. The revolt left Kublai distrustful of the Chinese lords of the north: he separated civil from military authority, ended many of their hereditary commands and relied more on Mongol and Central Asian officials."
: "Un soulèvement au Shandong contre Kubilai Khan, alors que celui-ci disputait le trône à son frère Ariq Böke. Li Tan, fils du seigneur de guerre du Shandong Li Quan, gouvernait Yidu (Qingzhou) pour les Mongols depuis une trentaine d’années en seigneur héréditaire, commandant la côte et la frontière avec les Song ; son beau-père Wang Wentong était l’un des principaux ministres de Kubilai. Après avoir récupéré son fils, retenu à la cour mongole, Li Tan se souleva le 22 février 1262, massacra les troupes mongoles de son territoire et livra Lianshui, Haizhou et Donghai, sur la frontière de la Huai, aux Song, qui le nommèrent gouverneur militaire. Il s’empara ensuite de Jinan. Kubilai envoya contre lui le prince Qabichi et les généraux chinois Shi Tianze, Shi Shu et Zhang Hongfan ; les troupes de secours Song rebroussèrent chemin, même si le général Song Xia Gui prit un certain nombre de villes le long de la frontière. À partir de mai environ, Jinan fut encerclée de murs et de fossés et affamée. Lorsque la ville tomba au début d’août, Li Tan tenta de se noyer dans le lac Daming, fut repêché et fut exécuté le 6 août 1262, décapité selon la plupart des récits, piétiné par des chevaux selon d’autres. Wang Wentong fut exécuté pour avoir correspondu avec lui. La révolte laissa Kubilai méfiant envers les seigneurs chinois du Nord : il sépara l’autorité civile de l’autorité militaire, mit fin à beaucoup de leurs commandements héréditaires et s’appuya davantage sur des fonctionnaires mongols et centrasiatiques."
