# French translations of the catalogue text (wave 9); step bodies follow later.
Later Liang–Jin war: Guerre entre les Liang postérieurs et les Jin
The sixteen-year war for northern China between the Later Liang, founded in 907 by Zhu Wen when he deposed the last Tang emperor, and the Jin state of the Shatuo Turk Li Keyong and his son Li Cunxu in Shanxi, which refused to recognise him. Jin held out at the siege of Luzhou (907–908), and Li Cunxu, who succeeded his father in 908, relieved the city in a surprise attack. With the Hebei governors of Zhao and Yiwu as allies, he crushed the Liang army at Baixiang in 911, conquered the Yan state of Liu Shouguang at Youzhou (Beijing) in 913, and in 915 won the great Weibo circuit when its army rose against Liang. Years of fighting along the Yellow River followed, including the costly battle of Huliupo (918–919). In 923 Li Cunxu proclaimed himself emperor of a restored Tang (the Later Tang), sent Li Siyuan behind the Liang lines to take Yunzhou, and marched on the undefended Liang capital Daliang (Kaifeng), where the last Liang emperor had himself killed on 18 November 923.: La guerre de seize ans pour la Chine du Nord entre les Liang postérieurs, fondés en 907 par Zhu Wen lorsqu’il déposa le dernier empereur Tang, et l’État de Jin, au Shanxi, du Turc shatuo Li Keyong et de son fils Li Cunxu, qui refusait de le reconnaître. Le Jin tint bon au siège de Luzhou (907–908), et Li Cunxu, qui succéda à son père en 908, dégagea la ville par une attaque surprise. Allié aux gouverneurs de Zhao et de Yiwu, au Hebei, il écrasa l’armée des Liang à Baixiang en 911, conquit en 913 l’État de Yan de Liu Shouguang à Youzhou (Pékin) et, en 915, gagna le grand circuit de Weibo, dont l’armée s’était soulevée contre les Liang. Suivirent des années de combats le long du fleuve Jaune, dont la coûteuse bataille de Huliupo (918–919). En 923, Li Cunxu se proclama empereur d’une dynastie Tang restaurée (les Tang postérieurs), envoya Li Siyuan prendre Yunzhou derrière les lignes des Liang et marcha sur Daliang (Kaifeng), la capitale des Liang laissée sans défense, où le dernier empereur Liang se fit donner la mort le 18 novembre 923.
