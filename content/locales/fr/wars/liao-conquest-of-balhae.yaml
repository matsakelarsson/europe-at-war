# French translations of the catalogue text (wave 9); step bodies follow later.
Liao conquest of Balhae: Conquête du Balhae par les Liao
The Khitan campaign that destroyed Balhae (Bohai, Parhae), the kingdom that had ruled Manchuria, the Russian Far East and north-eastern Korea since about 698. The Khitan ruler Abaoji (Emperor Taizu of Liao) had fought Balhae over the Liao River valley since the 900s. At the end of 925 he marched east with his sons Yelü Bei and Yelü Deguang. In February 926 his army took the western stronghold of Fuyu after a three-day siege, defeated the Balhae army and besieged the capital Huhan (the Upper Capital, near today’s Ning’an), whose king Da Yinzhuan surrendered after three days. Abaoji turned Balhae into a client kingdom, Dongdan (“Eastern Dan”), under Yelü Bei, and died at Fuyu on his way home on 6 September 926. Risings followed in the conquered lands. In 929 the Liao moved Dongdan’s capital and much of its people west to Liaoyang, and the kingdom was absorbed into the Liao in the 930s. Tens of thousands of Balhae families fled to Goryeo, among them the last crown prince.: La campagne khitane qui détruisit le Balhae (Bohai, Parhae), le royaume qui dominait la Mandchourie, l’Extrême-Orient russe et le nord-est de la Corée depuis 698 environ. Le souverain khitan Abaoji (l’empereur Taizu des Liao) disputait au Balhae la vallée du Liao depuis les années 900. À la fin de 925, il marcha vers l’est avec ses fils Yelü Bei et Yelü Deguang. En février 926, son armée prit la place forte occidentale de Fuyu après un siège de trois jours, battit l’armée du Balhae et assiégea la capitale, Huhan (la Capitale supérieure, près de l’actuelle Ning’an), dont le roi, Da Yinzhuan, se rendit au bout de trois jours. Abaoji fit du Balhae un royaume client, le Dongdan (« Dan oriental »), confié à Yelü Bei, et mourut à Fuyu sur le chemin du retour, le 6 septembre 926. Des soulèvements éclatèrent ensuite dans les terres conquises. En 929, les Liao transférèrent la capitale du Dongdan et une grande partie de sa population vers l’ouest, à Liaoyang, et le royaume fut absorbé par les Liao dans les années 930. Des dizaines de milliers de familles du Balhae s’enfuirent au Goryeo, et avec elles le dernier prince héritier.
