# French translations of the catalogue text (wave 9); step bodies follow later.
Liao–Later Jin war: Guerre entre les Liao et les Jin postérieurs
? The war in which the Khitan Liao empire destroyed the Later Jin, the dynasty it had put on the throne of northern China in 936. Shi Jingtang’s nephew and successor Shi Chonggui, urged on by his minister Jing Yanguang, refused to call himself the Liao emperor’s subject, arrested the Liao trade envoy and killed Khitan merchants. The Liao emperor Yelü Deguang (Taizong) invaded in 944 and again in the winter of 944–945, reaching the Yellow River, but his armies were held at Majiakou and Qicheng and in 945 were routed at Yangcheng, where the emperor is said to have escaped on a camel. In 946 the Jin court sent almost its whole army north under Du Chongwei to retake the Sixteen Prefectures; surrounded by Deguang on the Hutuo River, Du surrendered it in the hope of being made emperor himself. Deguang entered the undefended capital Daliang (Kaifeng) early in 947, sent Shi Chonggui into exile and ruled as emperor of China, but the plundering of his troops set off risings everywhere. Liu Zhiyuan, governor at Taiyuan, proclaimed himself emperor (the Later Han), and Deguang withdrew north and died on the way, on 18 May 947.
: La guerre au cours de laquelle l’empire khitan des Liao détruisit les Jin postérieurs, la dynastie qu’il avait placée sur le trône de la Chine du Nord en 936. Neveu et successeur de Shi Jingtang, Shi Chonggui, poussé par son ministre Jing Yanguang, refusa de se dire le sujet de l’empereur des Liao, fit arrêter l’envoyé commercial des Liao et tuer des marchands khitans. L’empereur des Liao Yelü Deguang (Taizong) envahit le pays en 944, puis de nouveau au cours de l’hiver 944–945, et atteignit le fleuve Jaune, mais ses armées furent arrêtées à Majiakou et à Qicheng et, en 945, mises en déroute à Yangcheng, où l’empereur se serait enfui à dos de chameau. En 946, la cour des Jin envoya presque toute son armée vers le nord, sous Du Chongwei, pour reprendre les Seize Préfectures ; encerclé par Deguang sur la rivière Hutuo, Du la fit capituler dans l’espoir d’être lui-même fait empereur. Deguang entra au début de 947 dans la capitale sans défense, Daliang (Kaifeng), envoya Shi Chonggui en exil et régna comme empereur de Chine, mais les pillages de ses troupes provoquèrent partout des soulèvements. Liu Zhiyuan, gouverneur à Taiyuan, se proclama empereur (les Han postérieurs), et Deguang se retira vers le nord et mourut en chemin, le 18 mai 947.
