"Liberal Wars": "Guerres libérales"
"A civil war in Portugal between the liberal constitutionalists of Pedro IV and his daughter Maria II and the absolutists of Pedro’s brother Miguel, who had made himself king in 1828. Pedro’s small army, landed near Porto in 1832, survived a year-long siege, took Lisbon in 1833 and forced Miguel to give up the throne at Evoramonte in May 1834.": "Une guerre civile au Portugal entre les constitutionnalistes libéraux de Pedro IV et sa fille Maria II et les absolutistes de Pedros, frère Miguel, qui s’était fait roi en 1828. Pedros petite armée, atterrit près de Porto en 1832, survécut à un siège d’un an, prit Lisbonne en 1833 et força Miguel à abandonner le trône à Evoramonte en mai 1834."
"Also called the Portuguese Civil War or the War of the Two Brothers. Many foreign volunteers and mercenaries, British, French and Belgian among them, fought for the Liberals, and their fleet was commanded by British officers, George Sartorius and then Charles Napier.": "Aussi appelé la guerre civile portugaise ou la guerre des deux frères. Beaucoup de volontaires et mercenaires étrangers, britanniques, français et belges parmi eux, ont combattu pour les libéraux, et leur flotte a été commandée par des officiers britanniques, George Sartorius et puis Charles Napier."
"The base map shows Portugal unchanged throughout; who held what is told in the steps. Some sources date the start of the war to the Porto rising of 16 May 1828, others to 18 May.": "La carte de base montre le Portugal inchangé dans l’ensemble ; qui a tenu ce que l’on dit dans les étapes. Certaines sources datent du début de la guerre à Porto le 16 mai 1828, d’autres au 18 mai."
