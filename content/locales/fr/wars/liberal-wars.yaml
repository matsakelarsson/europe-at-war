"1828 – 1833": "1828 – 1833"
"When King John VI died in 1826, his elder son Pedro, Emperor of Brazil, granted Portugal a Constitutional Charter and abdicated in favour of his seven-year-old daughter Maria, who was to marry his younger brother Miguel. Miguel returned from exile in February 1828 as regent and swore to uphold the Charter, but his supporters, backed by most of the nobility and the Church, acclaimed him absolute king, and a traditional Cortes of the three estates confirmed him that summer. A liberal rising in Porto in May 1828 collapsed, and thousands of liberals were imprisoned or fled abroad.": "Lorsque le roi Jean VI mourut en 1826, son fils aîné Pedro, empereur du Brésil, accorda au Portugal une Charte constitutionnelle et abdiqua en faveur de sa fille Maria, âgée de sept ans, qui devait se marier avec son frère cadet Miguel. Miguel revint d’exil en février 1828 comme régent et jura de respecter la Charte, mais ses partisans, soutenus par la plupart des nobles et de l’Église, l’acclamèrent roi absolu, et une Cortes traditionnelle des trois domaines le confirma cet été-là. Une montée libérale à Porto en mai 1828 s’effondra, et des milliers de libéraux furent emprisonnés ou fuyèrent à l’étranger."
"Only the island of Terceira in the Azores held out for Maria, and in 1829 its defenders beat off a Miguelist landing at Praia. In 1831 Pedro abdicated the Brazilian throne, raised money and volunteers in Britain and France and gathered a small army in the Azores. On 8 July 1832 about 7,500 men landed at Mindelo, north of Porto, and occupied the city, which Miguel’s troops had abandoned. They were soon besieged by a much larger Miguelist army. For a year Porto was shelled and starved, and cholera broke out in 1833, but the defenders held their lines.": "En 1831, Pedro abdique le trône brésilien, recueille de l’argent et des volontaires en Grande-Bretagne et en France et rassemble une petite armée dans les Açores. Le 8 juillet 1832, environ 7 500 hommes débarquent à Mindelo, au nord de Porto, et occupent la ville que les troupes de Miguel avaient abandonnée. Ils furent bientôt assiégés par une armée beaucoup plus grand de Miguel. Porto fut bombardé et affamé pendant un an, et le choléra éclata en 1833, mais les défenseurs tenaient leurs lignes."
