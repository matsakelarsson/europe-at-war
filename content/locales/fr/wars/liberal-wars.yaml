"June 1833 – May 1834": "juin 1833 – mai 1834"
"To break the deadlock the Liberals sent a force under the Duke of Terceira by sea to the Algarve in June 1833. On 5 July Charles Napier’s small squadron captured most of the Miguelist fleet off Cape St Vincent, and Terceira marched north through the Alentejo, defeated a Miguelist force across the Tagus from the capital on 23 July and entered Lisbon the next day. Pedro moved his government there, and Miguelist attacks on Lisbon and Porto failed that summer and autumn. Miguel’s army still held much of the interior, with Santarém as his base, and guerrilla bands remained strong in the countryside.": "Pour sortir de l’impasse, les libéraux envoyèrent une force sous le duc de Terceira par mer à l’Algarve en juin 1833. Le 5 juillet, Charles Napier s’empara de la flotte Migueliste au large du cap St Vincent, et Terceira marcha vers le nord à travers l’Alentejo. Pedro y déplaça son gouvernement, et les attaques Miguelistes contre Lisbonne et Porto échouèrent cet été-là et cet automne. L’armée de Miguel tenait toujours une grande partie de l’intérieur, avec Santarém comme base, et les guérillas demeuraient fortes dans la campagne."
"In 1833 the death of Ferdinand VII turned Spain against Miguel, who had sheltered the Spanish pretender Don Carlos. In April 1834 Britain, France, Spain and Portugal formed the Quadruple Alliance, and Spanish troops entered Portugal. On 16 May the Duke of Terceira beat the Miguelist army at Asseiceira near Tomar, and on 26 May, at Evoramonte, Miguel accepted a pension and exile in return for giving up his claim. Pedro restored the Charter and dissolved the religious orders, but died in September 1834, and Maria II, aged 15, began her personal rule.": "En 1833, la mort de Ferdinand VII tourna l’Espagne contre Miguel, qui avait abrité le prétendant espagnol Don Carlos. En avril 1834, la Grande-Bretagne, la France, l’Espagne et le Portugal formèrent la Quadruple Alliance, et les troupes espagnoles entrèrent au Portugal. Le 16 mai, le duc de Terceira battit l’armée Migueliste à Asseiceira près de Tomar, et le 26 mai, à Evoramonte, Miguel accepta une pension et un exil en échange de son abandon. Pedro rétablit la Charte et dissout les ordres religieux, mais mourut en septembre 1834, et Maria II, âgée de 15 ans, commença son règne personnel."
