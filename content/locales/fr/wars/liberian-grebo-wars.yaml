# French translations of the catalogue text (wave 13); step bodies follow later.
Wars of the Grebo and Kru against Liberia: Guerres des Grebo et des Kru contre le Liberia
? "Eighty years of intermittent war on the south-eastern coast of Liberia between the Americo-Liberian settler states and the Grebo and Kru, coastal peoples who had long traded with European ships and whose men worked as sailors and dockers along the whole West African coast. The settlers, freed and freeborn African Americans sent by colonisation societies, claimed authority over the coast through treaties that the Grebo and Kru understood differently, and they fought over land, trade, customs duties and taxes. In 1856 the Grebo and Kru around Cape Palmas attacked Maryland in Liberia, the separate settler republic at Harper that had declared independence on 29 May 1854. Unable to defend itself, Maryland asked Liberia for help; President Joseph Jenkins Roberts sent militia, the joint force drove the attackers back, and after a referendum in February 1857 Maryland joined Liberia as Maryland County on 6 April 1857. The Grebo, who had hoped to form a united Grebo state, rose again in 1875 over the loss of their land: on 8 September 1875 they attacked Cape Palmas and were beaten off, the United States sent the USS Alaska to Liberia in February 1876, and on 1 March 1876 the Grebo chiefs signed a treaty acknowledging the authority of the Liberian government. When the First World War ended German shipping to Liberia and threw thousands of Kru out of work, the government’s demands for taxes set off the Kru Coast revolt: from 28 September 1915 Kru fighters besieged the port of Sinoe (Greenville) and burned its customs house, and the small Liberian Frontier Force, led by American officers and supported by the cruiser USS Chester, burned towns and drove the Kru into the forest until the rising died out in 1916. President Daniel Howard’s government sentenced 67 Kru chiefs and leaders to death, and 47 had been hanged before foreign appeals for clemency arrived, and fines, forced labour and garrisons followed. After the League of Nations inquiry of 1930 into forced labour, to which Kru witnesses had testified, the government’s crackdown led to the Sasstown war of 1931–1936, in which the Kru of Sasstown under Paramount Chief Juah Nimley held out against the Frontier Force."
: "Quatre-vingts ans de guerre intermittente sur la côte sud-est du Liberia entre les États des colons américano-libériens et les Grebo et les Kru, peuples côtiers qui commerçaient depuis longtemps avec les navires européens et dont les hommes travaillaient comme marins et dockers tout le long de la côte ouest-africaine. Les colons, Afro-Américains affranchis ou nés libres envoyés par des sociétés de colonisation, revendiquaient l’autorité sur la côte en vertu de traités que les Grebo et les Kru comprenaient autrement, et l’on se battit pour la terre, le commerce, les droits de douane et les impôts. En 1856, les Grebo et les Kru des environs du cap Palmas attaquèrent le Maryland au Liberia, république de colons distincte établie à Harper, qui avait proclamé son indépendance le 29 mai 1854. Incapable de se défendre, le Maryland demanda l’aide du Liberia ; le président Joseph Jenkins Roberts envoya la milice, les forces réunies repoussèrent les assaillants et, après un référendum en février 1857, le Maryland rejoignit le Liberia sous le nom de comté de Maryland le 6 avril 1857. Les Grebo, qui avaient espéré former un État grebo uni, se soulevèrent de nouveau en 1875 à la suite de la perte de leurs terres : le 8 septembre 1875, ils attaquèrent le cap Palmas et furent repoussés, les États-Unis envoyèrent l’USS Alaska au Liberia en février 1876, et le 1er mars 1876 les chefs grebo signèrent un traité reconnaissant l’autorité du gouvernement libérien. Lorsque la Première Guerre mondiale mit fin à la navigation allemande vers le Liberia et priva de travail des milliers de Kru, les exigences fiscales du gouvernement déclenchèrent la révolte de la côte kru : à partir du 28 septembre 1915, des combattants kru assiégèrent le port de Sinoe (Greenville) et incendièrent sa douane, et la petite Liberian Frontier Force, commandée par des officiers américains et appuyée par le croiseur USS Chester, incendia des villes et refoula les Kru dans la forêt jusqu’à ce que le soulèvement s’éteigne en 1916. Le gouvernement du président Daniel Howard condamna à mort 67 chefs et meneurs kru, dont 47 avaient déjà été pendus lorsque arrivèrent les appels à la clémence venus de l’étranger, et des amendes, le travail forcé et des garnisons suivirent. Après l’enquête de la Société des Nations sur le travail forcé, en 1930, devant laquelle des témoins kru avaient déposé, la répression gouvernementale entraîna la guerre de Sasstown de 1931–1936, au cours de laquelle les Kru de Sasstown, menés par le chef suprême Juah Nimley, tinrent tête à la Frontier Force."
