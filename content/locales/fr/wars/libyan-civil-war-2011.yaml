# French translations of the catalogue text (wave 12); step bodies follow later.
Libyan Civil War (2011): Guerre civile libyenne (2011)
? The uprising and civil war that overthrew Muammar Gaddafi, who had ruled Libya since 1969. Inspired by the revolutions in Tunisia and Egypt, protests broke out in Benghazi on 15 February 2011, and within days the east of the country and several towns in the west were in the hands of rebels, soldiers and officials who had changed sides. A National Transitional Council (NTC) formed in Benghazi on 27 February. Gaddafi’s forces crushed the rising in Zawiya, drove the rebels back along the coast and reached the outskirts of Benghazi on 19 March, two days after the UN Security Council authorised all necessary measures to protect civilians. French, British and American air strikes stopped them, and NATO took command of the air campaign at the end of March. Misrata held out through a siege of nearly three months, and the Berber and Arab towns of the Nafusa Mountains through the summer. In August the rebels advanced from the mountains to the coast, and Tripoli fell between 20 and 28 August. Gaddafi’s last strongholds, Bani Walid and his home town of Sirte, fell in October; on 20 October Gaddafi was captured outside Sirte and killed, and the NTC declared the war over on 23 October. Estimates of the dead range from about 10,000 to well over 20,000.
: Le soulèvement et la guerre civile qui renversèrent Mouammar Kadhafi, au pouvoir en Libye depuis 1969. Inspirées par les révolutions de Tunisie et d’Égypte, des manifestations éclatèrent à Benghazi le 15 février 2011 et, en quelques jours, l’est du pays et plusieurs villes de l’ouest passèrent aux mains de rebelles, de soldats et de responsables qui avaient changé de camp. Un Conseil national de transition (CNT) se forma à Benghazi le 27 février. Les forces de Kadhafi écrasèrent le soulèvement à Zaouïa, repoussèrent les rebelles le long de la côte et atteignirent les abords de Benghazi le 19 mars, deux jours après que le Conseil de sécurité de l’ONU eut autorisé toutes les mesures nécessaires pour protéger les civils. Des frappes aériennes françaises, britanniques et américaines les arrêtèrent, et l’OTAN prit le commandement de la campagne aérienne à la fin de mars. Misrata tint bon pendant un siège de près de trois mois, et les villes berbères et arabes du djebel Nefoussa pendant tout l’été. En août, les rebelles descendirent des montagnes vers la côte, et Tripoli tomba entre le 20 et le 28 août. Les derniers bastions de Kadhafi, Bani Walid et sa ville natale de Syrte, tombèrent en octobre ; le 20 octobre, Kadhafi fut capturé aux abords de Syrte et tué, et le CNT proclama la fin de la guerre le 23 octobre. Les estimations du nombre de morts vont d’environ 10 000 à bien plus de 20 000.
