# French translations of the catalogue text (wave 12); step bodies follow later.
Second Libyan Civil War: Seconde guerre civile libyenne
? "The war between rival governments and armed coalitions that divided Libya from 2014 to 2020. After Gaddafi’s fall the state never controlled the brigades that had fought him. In May 2014 General Khalifa Haftar launched Operation Dignity against Islamist militias in Benghazi, and in July Libya Dawn, a coalition of Misratan and Islamist brigades, drove his allies from Tripoli’s airport and took the capital. The newly elected House of Representatives moved to Tobruk and backed Haftar’s Libyan National Army (LNA), while the old General National Congress set up a rival government in Tripoli. The Islamic State took Derna and then Sirte, where it was destroyed in 2016 by forces of the UN-backed Government of National Accord (GNA) with American air support. Haftar won Benghazi in 2017 and Derna in 2018, took the oil ports and the south, and in April 2019 attacked Tripoli. The battle drew in foreign powers: the United Arab Emirates, Egypt and Russia’s Wagner Group backed the LNA, Turkey and Syrian fighters the GNA, which drove the LNA back to Sirte and Jufra in June 2020. A permanent ceasefire was signed on 23 October 2020. The country remained divided between rival governments in Tripoli and the east, and at least 15,000 people were killed in the war by incomplete counts."
: "La guerre entre gouvernements rivaux et coalitions armées qui divisa la Libye de 2014 à 2020. Après la chute de Kadhafi, l’État ne parvint jamais à contrôler les brigades qui l’avaient combattu. En mai 2014, le général Khalifa Haftar lança l’opération Dignité contre les milices islamistes de Benghazi et, en juillet, Aube de la Libye, une coalition de brigades de Misrata et de brigades islamistes, chassa ses alliés de l’aéroport de Tripoli et prit la capitale. La Chambre des représentants, nouvellement élue, s’installa à Tobrouk et soutint l’Armée nationale libyenne (ANL) de Haftar, tandis que l’ancien Congrès général national mettait en place un gouvernement rival à Tripoli. L’État islamique prit Derna puis Syrte, où il fut anéanti en 2016 par les forces du gouvernement d’union nationale (GNA), soutenu par l’ONU, avec un appui aérien américain. Haftar remporta Benghazi en 2017 et Derna en 2018, prit les ports pétroliers et le sud et, en avril 2019, attaqua Tripoli. La bataille entraîna des puissances étrangères dans le conflit : les Émirats arabes unis, l’Égypte et le groupe russe Wagner soutinrent l’ANL, la Turquie et des combattants syriens le GNA, qui repoussa l’ANL jusqu’à Syrte et à Jufra en juin 2020. Un cessez-le-feu permanent fut signé le 23 octobre 2020. Le pays resta divisé entre des gouvernements rivaux à Tripoli et dans l’est, et au moins 15 000 personnes furent tuées pendant la guerre, selon des décomptes incomplets."
