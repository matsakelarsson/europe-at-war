# French translations of the catalogue text (wave 12); step bodies follow later.
Libyan–Egyptian War: Guerre libyo-égyptienne
? "A four-day border war between Libya and Egypt, also called the Four Day War. Muammar Gaddafi had pressed Egypt to unite with Libya, and when Anwar Sadat turned away from him after the October War of 1973, moved towards peace with Israel and drew closer to the United States, relations broke down. Each accused the other of plotting against it: Libya backed Egyptian opponents of Sadat and Egypt backed opponents of Gaddafi, and from 1976 there were clashes on the frontier. On 21 July 1977 a Libyan tank battalion raided the Egyptian border town of Sallum and was ambushed by the Egyptian army, which struck back with a mechanised force that pushed some 24 km into Libya towards Musaid and then withdrew, while Egyptian aircraft bombed the Gamal Abdel Nasser air base at al-Adem near Tobruk and radar stations at Bardia and Jaghbub. Over the next days Egyptian aircraft and helicopter-borne commandos raided al-Adem again, the air base at Kufra, Jaghbub and camps in eastern Libya, and Libyan aircraft attacked Mersa Matruh. Under pressure from Arab governments and the United States, and after mediation by Algeria’s President Houari Boumediène and the PLO leader Yasser Arafat, Sadat declared a ceasefire on 24 July. Both sides claimed victory; Egypt lost about 100 men killed or wounded and Libya about 400, with dozens of tanks and armoured vehicles and, by different estimates, between six and twenty aircraft. Prisoners were exchanged in August 1977, but no peace treaty followed, and relations worsened again after Sadat’s visit to Jerusalem that November."
: "Une guerre frontalière de quatre jours entre la Libye et l’Égypte, appelée aussi guerre des Quatre Jours. Mouammar Kadhafi avait pressé l’Égypte de s’unir à la Libye, et lorsqu’Anouar el-Sadate se détourna de lui après la guerre d’Octobre de 1973, s’orienta vers la paix avec Israël et se rapprocha des États-Unis, les relations se rompirent. Chacun accusait l’autre de comploter contre lui : la Libye soutenait des opposants égyptiens à Sadate et l’Égypte des opposants à Kadhafi, et à partir de 1976 des accrochages eurent lieu à la frontière. Le 21 juillet 1977, un bataillon de chars libyen lança un raid sur la ville frontalière égyptienne de Salloum et tomba dans une embuscade de l’armée égyptienne, qui riposta avec une force mécanisée ; celle-ci s’enfonça d’environ 24 km en Libye en direction de Musaid, puis se retira, tandis que l’aviation égyptienne bombardait la base aérienne Gamal Abdel Nasser d’al-Adem, près de Tobrouk, et des stations radar à Bardia et à Jaghbub. Les jours suivants, l’aviation et des commandos héliportés égyptiens attaquèrent de nouveau al-Adem, la base aérienne de Koufra, Jaghbub et des camps de l’est de la Libye, et l’aviation libyenne attaqua Marsa Matrouh. Sous la pression de gouvernements arabes et des États-Unis, et après une médiation du président algérien Houari Boumediène et du dirigeant de l’OLP Yasser Arafat, Sadate proclama un cessez-le-feu le 24 juillet. Les deux camps revendiquèrent la victoire ; l’Égypte perdit environ 100 hommes tués ou blessés et la Libye environ 400, ainsi que des dizaines de chars et de véhicules blindés et, selon les estimations, entre six et vingt avions. Les prisonniers furent échangés en août 1977, mais aucun traité de paix ne suivit, et les relations se dégradèrent de nouveau après la visite de Sadate à Jérusalem en novembre de la même année."
