"Liège Revolution": "Révolution de Liège"
"A revolution in the Prince-Bishopric of Liège, an ecclesiastical state of the Holy Roman Empire, which began on 18 August 1789, five weeks after the fall of the Bastille. Townspeople took over the city hall and installed new burgomasters, and the prince-bishop, César-Constantin-François de Hoensbroeck, fled to Trier. The Imperial Chamber Court at Wetzlar ordered his restoration and called on neighbouring princes to enforce it. Prussian troops occupied Liège at the end of 1789 but showed sympathy for the revolutionaries and withdrew in 1790, and the Liégeois held off the troops of other imperial princes through that year. After Leopold II had crushed the Brabant Revolution, Austrian troops entered Liège in January 1791 and restored the prince-bishop. French armies overran the country in 1792 and again in 1794, and France annexed it in 1795.": "Une révolution dans le Prince-évêque de Liège, un état ecclésiastique du Saint Empire romain, qui a commencé le 18 août 1789, cinq semaines après la chute de la Bastille. Les habitants ont repris l’hôtel de ville et installé de nouveaux bourgmestres, et le prince-évêque César-Constantin-François de Hoensbroeck, s’est enfui à Trèves. Les troupes prussiennes occupèrent Liège à la fin de 1789 mais manifestaient de la sympathie pour les révolutionnaires et se retiraient en 1790, et les Liégeois retenaient les troupes d’autres princes impériaux pendant toute l’année. Après que Léopold II eut écrasé la Révolution Brabante, les troupes autrichiennes entrèrent à Liège en janvier 1791 et rétablirent le prince-évêque. Les armées françaises ont envahi le pays en 1792 et de nouveau en 1794, et la France l’a annexé en 1795."
"Known in French as the Heureuse Révolution, the “Happy Revolution”.": "Connu en français sous le nom d’Heureuse Révolution, la \"Bonne révolution\"."
