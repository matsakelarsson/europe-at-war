# Some French text was translated automatically.
"Liège Wars": "Guerres de Liège"
"Three risings of the city and Prince-Bishopric of Liège against Burgundian control, encouraged by Louis XI of France. Liège rejected its prince-bishop, Louis of Bourbon, a nephew of Duke Philip the Good, and was defeated at Montenaken in 1465. In 1466 Charles the Bold destroyed the allied town of Dinant and had many of its men drowned in the Meuse, and in 1467 he beat the Liégeois at Brustem and tore down their walls. When the city rose again in 1468, Charles took it by storm with Louis XI, his virtual prisoner after their meeting at Péronne, at his side. A desperate night attack on the duke’s camp by about 600 men of Franchimont failed, and Liège was sacked and burned over several weeks; many of its people were killed.": "Trois montées de la ville et le prince-évêque de Liège contre le contrôle bourguignon, encouragé par Louis XI de France. Liège rejette son prince-évêque, Louis de Bourbon, neveu du duc Philippe le Bon, et est défait à Montenaken en 1465. En 1466, Charles le Bold détruisit la ville alliée de Dinant et fit noyer plusieurs de ses hommes dans la Meuse, et en 1467 il battit les Liégeois à Brustem et déchira leurs murs. Lorsque la ville s’éleva de nouveau en 1468, Charles prit l’assaut avec Louis XI, son prisonnier virtuel après leur rencontre à Péronne, à ses côtés. Une attaque de nuit désespérée sur le camp du duc par environ 600 hommes de Franchimont échoua, et Liège fut larguée et brûlée pendant plusieurs semaines ; beaucoup de ses habitants furent tués."
"Liège was an ecclesiastical principality of the Holy Roman Empire, ruled by its bishop but with powerful towns. The prince-bishopric was restored under Bourbon after 1468, and the city was rebuilt in the following decades.": "Liège était une principauté ecclésiastique du Saint Empire romain, gouverné par son évêque mais avec des villes puissantes. Le prince-évêque fut restauré sous Bourbon après 1468, et la ville fut reconstruite dans les décennies suivantes."
