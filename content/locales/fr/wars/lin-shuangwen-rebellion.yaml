# French translations of the catalogue text (wave 9); step bodies follow later.
Lin Shuangwen rebellion: Rébellion de Lin Shuangwen
? The largest rising in Taiwan under Qing rule, led by Lin Shuangwen, a settler of Zhangzhou origin and a leader of the Heaven and Earth Society (Tiandihui), a sworn brotherhood that the authorities had begun to hunt down. When troops moved against the society around Dali in central Taiwan in January 1787, Lin rose, took the county seats of Changhua and Zhuluo and the town of Zhuqian, and proclaimed a reign of his own; in the south Zhuang Datian took Fengshan. Tens of thousands joined them, while settlers of Quanzhou origin, the Hakka and many villages of the plains peoples raised militias on the Qing side, and the war became in part a feud between communities. Qing reinforcements held the prefectural city, the port of Lugang and, after months of siege, Zhuluo, which the Qianlong emperor renamed Jiayi (“commended for loyalty”). Fuk’anggan landed at Lugang in December 1787 with fresh troops, relieved Jiayi, took Lin’s base at Dali and captured Lin in February 1788 and Zhuang in March. The leaders were executed. The court counted the campaign among the Ten Great Campaigns of the Qianlong reign; it is the rising dated 1786 in many lists, from the year in the Chinese calendar in which it began (the 51st year of Qianlong).
: Le plus grand soulèvement de Taïwan sous la domination Qing, mené par Lin Shuangwen, un colon originaire de Zhangzhou et l’un des chefs de la Société du Ciel et de la Terre (Tiandihui), une fraternité jurée que les autorités avaient commencé à pourchasser. Lorsque des troupes marchèrent contre la société autour de Dali, dans le centre de Taïwan, en janvier 1787, Lin se souleva, prit les chefs-lieux de district de Changhua et de Zhuluo ainsi que la ville de Zhuqian, et proclama son propre règne ; dans le sud, Zhuang Datian prit Fengshan. Des dizaines de milliers de personnes les rejoignirent, tandis que les colons originaires de Quanzhou, les Hakka et de nombreux villages des peuples des plaines levaient des milices du côté des Qing, et la guerre devint en partie une querelle entre communautés. Des renforts Qing tinrent la ville préfectorale, le port de Lugang et, après des mois de siège, Zhuluo, que l’empereur Qianlong rebaptisa Jiayi (« louée pour sa loyauté »). Fuk’anggan débarqua à Lugang en décembre 1787 avec des troupes fraîches, délivra Jiayi, prit la base de Lin à Dali et captura Lin en février 1788, puis Zhuang en mars. Les chefs furent exécutés. La cour compta la campagne parmi les dix grandes campagnes du règne de Qianlong ; c’est le soulèvement que de nombreuses listes datent de 1786, d’après l’année du calendrier chinois au cours de laquelle il commença (la 51e année de Qianlong).
