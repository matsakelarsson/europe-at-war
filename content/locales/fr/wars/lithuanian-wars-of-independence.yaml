# Some French text was translated automatically.
"Lithuanian Wars of Independence": "Guerres d’indépendance lituaniennes"
"The wars the new Lithuanian state fought for its independence against the Red Army in 1918–1919 and against the German-led Bermontians in the autumn of 1919. Lithuanian volunteers, with Saxon help, drove the Red Army back to the Daugava by the end of August 1919 and beat the Bermontians at Radviliškis in November, and in the treaty of 12 July 1920 Soviet Russia recognised Lithuania’s independence and its claim to Vilnius, which Poland seized that October.": "Les guerres que le nouvel État lituanien combattit pour son indépendance contre l’Armée rouge en 1918-1919 et contre les Bermontiens dirigés par les Allemands à l’automne 1919. Des volontaires lituaniens, avec l’aide de Saxon, ont ramené l’Armée rouge à la Daugava fin août 1919 et battu les Bermontiens à Radviliškis en novembre, et dans le traité du 12 juillet 1920 la Russie soviétique a reconnu l’indépendance de la Lituanie et sa revendication à Vilnius, que la Pologne a saisi en octobre."
"The third war, with Poland over Vilnius and the Suwałki region in 1919–1920, is told in the Polish–Lithuanian War.": "La troisième guerre, avec la Pologne sur Vilnius et la région de Suwałki en 1919-1920, est racontée dans la guerre polonaise-lituanienne."
"Historian Alfonsas Eidintas gives about 1,400 Lithuanian dead for the wars of independence.": "L’historien Alfonsas Eidintas donne environ 1 400 morts lituaniens pour les guerres d’indépendance."
