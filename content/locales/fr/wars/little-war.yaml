# French translations of the catalogue text (wave 14); step bodies follow later.
Little War (Guerra Chiquita): Petite Guerre (Guerra Chiquita)
? The second Cuban war for independence, fought in 1879–1880 by veterans who had not accepted the Pact of Zanjón that ended the Ten Years’ War. It was organised from New York by the Cuban Revolutionary Committee of Calixto García, who had refused the pact, with the support of Antonio Maceo in exile and of José Martí in Havana, until Martí was arrested and deported to Spain in September 1879. The rising began in Oriente in late August 1879 (sources give 24 or 26 August) under José Maceo, Guillermo Moncada and Quintín Banderas, and spread to Las Villas, where Emilio Núñez and Francisco Carrillo led it. The rebels, a few thousand at most, were short of arms and of experienced leaders, and the people of the countryside were exhausted by ten years of war. The Spanish commanders, among them Camilo García de Polavieja in Oriente, combined pursuit with offers of pardon, and Spanish authorities presented the rising as a race war, since many of its leaders were Black, which kept many white Cubans away from it. Antonio Maceo never managed to land; Calixto García landed on the south coast of Oriente in May 1880, but after months in the Sierra Maestra and the Cauto valley he surrendered and was again deported to Spain. Most leaders had capitulated by September 1880, and the last, Emilio Núñez, laid down his arms on 3 December 1880. Hundreds of rebels were killed. The failure convinced José Martí that a new war needed one organisation uniting the exiles and the island, which he founded in 1892 as the Cuban Revolutionary Party.
: La deuxième guerre d’indépendance cubaine, menée en 1879–1880 par des vétérans qui n’avaient pas accepté le pacte de Zanjón, par lequel s’était achevée la guerre des Dix Ans. Elle fut organisée depuis New York par le Comité révolutionnaire cubain de Calixto García, qui avait refusé le pacte, avec le soutien d’Antonio Maceo, alors en exil, et de José Martí à La Havane, jusqu’à ce que Martí soit arrêté et déporté en Espagne en septembre 1879. Le soulèvement commença dans l’Oriente à la fin d’août 1879 (les sources donnent le 24 ou le 26 août) sous la conduite de José Maceo, Guillermo Moncada et Quintín Banderas, et s’étendit à Las Villas, où Emilio Núñez et Francisco Carrillo le dirigèrent. Les rebelles, quelques milliers tout au plus, manquaient d’armes et de chefs expérimentés, et la population des campagnes était épuisée par dix ans de guerre. Les commandants espagnols, parmi lesquels Camilo García de Polavieja dans l’Oriente, combinèrent la poursuite et les offres de pardon, et les autorités espagnoles présentèrent le soulèvement comme une guerre raciale, nombre de ses chefs étant noirs, ce qui en tint éloignés beaucoup de Cubains blancs. Antonio Maceo ne parvint jamais à débarquer ; Calixto García débarqua sur la côte sud de l’Oriente en mai 1880, mais après des mois dans la Sierra Maestra et la vallée du Cauto, il se rendit et fut de nouveau déporté en Espagne. La plupart des chefs avaient capitulé en septembre 1880, et le dernier, Emilio Núñez, déposa les armes le 3 décembre 1880. Des centaines de rebelles furent tués. Cet échec convainquit José Martí qu’une nouvelle guerre exigeait une organisation unique réunissant les exilés et l’île, qu’il fonda en 1892 sous le nom de Parti révolutionnaire cubain.
