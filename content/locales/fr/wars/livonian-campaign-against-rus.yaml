"In July 1240 Prince Alexander Yaroslavich of Novgorod beat a Swedish landing on the Neva, a victory that later earned him the name Nevsky. Bishop Hermann of Dorpat, knights of the Livonian Order, vassals of the Danish king and Yaroslav Vladimirovich, an exiled claimant to the throne of Pskov, took the border fortress of Izborsk by storm in September. The Pskovians marched out to retake it and were routed; the Rhymed Chronicle says 800 of them fell. The Livonians burned the villages around Pskov for a week, and the boyar Tverdilo Ivankovich and his party opened the gates.": "En juillet 1240, le prince Alexandre Yaroslavich de Novgorod battit un débarquement suédois sur la Neva, une victoire qui lui valut plus tard le nom de Nevsky. Mgr Hermann de Dorpat, chevaliers de l’Ordre Livonien, vassaux du roi danois et Yaroslav Vladimirovich, demandeur exilé au trône de Pskov, prirent la forteresse frontalière d’Izborsk par tempête en septembre. Les Pskoviens marchèrent pour le reprendre et furent chassés ; la Chronique de Rhymed dit que 800 d’entre eux sont tombés. Les Livoniens ont brûlé les villages autour de Pskov pendant une semaine, et le boyar Tverdilo Ivankovich et son parti ont ouvert les portes."
"Pskov was left under Yaroslav, with two knights of the Order and a small garrison. That winter Alexander quarrelled with the Novgorodians and left the city. The Order and the Bishop of Ösel–Wiek then occupied Votia, the land of the Votes between Narva and the Neva, built a fort at Koporye and raided as far as Tesovo, close to Novgorod. Alarmed, the Novgorodians asked Alexander’s father, Grand Prince Yaroslav of Vladimir, to send him back. In 1241 Alexander stormed Koporye. He took some of its Germans to Novgorod, let others go and hanged the Votes and Estonians who had served the Order.": "Pskov fut laissé sous Yaroslav, avec deux chevaliers de l’Ordre et une petite garnison. Cet hiver-là Alexandre se disputa avec les Novgorodiens et quitta la ville. L’Ordre et l’évêque d’Ösel–Wiek occupèrent alors Votia, le pays des Votes entre Narva et Neva, construisit un fort à Koporye et fit une descente jusqu’à Tesovo, près de Novgorod. Alarmées, les Novgorodiens ont demandé au père d’Alexandre, le Grand Prince Yaroslav de Vladimir, de le renvoyer. En 1241 Alexandre a pris Koporye. Il a emmené certains de ses Allemands à Novgorod, laisser d’autres aller et pendu les Votes et Estoniens qui avaient servi l’Ordre."
