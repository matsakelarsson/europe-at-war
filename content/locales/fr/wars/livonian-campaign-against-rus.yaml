"A war in which the Livonian Order and the Bishopric of Dorpat, with an exiled prince of Pskov, took Izborsk and Pskov in 1240 and occupied Votia on the Gulf of Finland. Alexander Nevsky of Novgorod won both back and defeated the Order’s army at Lake Peipus, the “Battle on the Ice”, on 5 April 1242.": "Une guerre dans laquelle l’Ordre Livonien et l’Évêque de Dorpat, avec un prince exilé de Pskov, ont pris Izborsk et Pskov en 1240 et occupé Votia sur le golfe de Finlande. Alexandre Nevsky de Novgorod a gagné à la fois et a vaincu l’armée de l’Ordre au lac Peipus, la bataille sur la glace, le 5 avril 1242."
"Dates follow the Novgorod First Chronicle. The other main source, the Livonian Rhymed Chronicle, was written in the 1290s from the Order’s side, and the two disagree on numbers.": "Les dates suivent la première Chronique de Novgorod. L’autre source principale, la Chronique de Rhymed livonienne, a été écrite dans les années 1290 du côté de l’Ordre, et les deux ne sont pas d’accord sur les chiffres."
"The Livonian Order was the former Order of the Brothers of the Sword, merged into the Teutonic Order in 1237. Vassals of the Danish king in northern Estonia joined its campaigns, and the exiled Prince Yaroslav Vladimirovich and his supporters fought on its side, so that Rus’ fought on both sides.": "L’Ordre livonien était l’ancien Ordre des Frères de l’Épée, fusionné dans l’Ordre teutonique en 1237. Vassaux du roi danois dans le nord de l’Estonie rejoint ses campagnes, et le prince exilé Yaroslav Vladimirovich et ses partisans combattent de son côté, de sorte que Rusa combattu des deux côtés."
"The Battle of the Neva in July 1240, in which Alexander defeated a Swedish force, is told under the Swedish crusades into Finland.": "La bataille de la Neva en juillet 1240, au cours de laquelle Alexandre a vaincu une force suédoise, est racontée sous les croisades suédoises en Finlande."
"Pskov, Izborsk and Koporye are in Russia today; Dorpat is Tartu, Odenpäh is Otepää and Fellin is Viljandi, all in Estonia.": "Pskov, Izborsk et Koporye sont en Russie aujourd'hui ; Dorpat est Tartu, Odenpäh est Otepää et Fellin est Viljandi, tout en Estonie."
