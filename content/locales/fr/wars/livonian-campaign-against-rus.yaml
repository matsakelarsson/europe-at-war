"In March 1242 Alexander and his brother Andrei, who had brought troops from Vladimir-Suzdal, drove the small garrison out of Pskov and sent the captured knights to Novgorod. Alexander then carried the war into the land of the Estonians around Dorpat. An advance party under Domash Tverdislavich, the brother of Novgorod’s posadnik, was caught by the Germans and beaten, and Domash was killed. Alexander fell back to the shore of Lake Peipus and drew up his army “at Uzmen, by the Raven’s Rock”, near the narrow strait between the main lake and Lake Pskov.": "En mars 1242, Alexandre et son frère Andrei, qui avaient amené des troupes de Vladimir-Suzdal, ont chassé la petite garnison de Pskov et envoyé les chevaliers capturés à Novgorod. Alexander a ensuite porté la guerre dans le pays des Estoniens autour de Dorpat. Un parti d’avance sous Domash Tverdislavich, le frère de Novgorods posadnik, a été pris par les Allemands et battu, et Domash a été tué. Alexandre est retombé sur la rive du lac Peipus et a dressé son armée à Uzmen, par le rocher Ravens, près de l’étroit détroit entre le lac principal et le lac Pskov."
"On 5 April 1242 the Order’s knights and the bishop’s men, with Estonian foot soldiers, charged the Novgorodian line. The Novgorod chronicle says they drove through it like a wedge but were then surrounded, and that 400 Germans were killed and 50 captured, along with countless Estonians; the Rhymed Chronicle admits to 20 brothers dead and six taken. The story of knights drowning when the ice broke is not in any medieval source and seems to come from Eisenstein’s 1938 film. Later in 1242 the Order made peace, gave up its claims to Pskov and Votia and exchanged prisoners.": "Le 5 avril 1242, les chevaliers de l’Ordre et les hommes de l’évêque, avec des soldats de pied estoniens, chargeaient la ligne de Novgorodian. La chronique de Novgorod dit qu’ils conduisaient à travers elle comme un coin mais étaient alors encerclés, et que 400 Allemands ont été tués et 50 capturés, avec d’innombrables Estoniens ; la Chronique de Rhymed admet à 20 frères morts et six pris. L’histoire des chevaliers noyés quand la glace s’est brisée n’est dans aucune source médiévale et semble venir d’Eisenstein 1938 film. Plus tard en 1242 l’Ordre fait la paix, a renoncé à ses revendications à Pskov et Votia et échangé prisonniers."
