"1558–1583": "1558–1583"
"When Russia invaded Livonia in 1558, the old Livonian Order collapsed and its neighbours carved up its lands. In 1561 Reval and the nobles of northern Estonia placed themselves under Swedish rule, Sweden’s first foothold south of the Gulf of Finland.": "Lorsque la Russie envahit la Livonie en 1558, l’ancien ordre livonien s’effondre et ses voisins creusent ses terres. En 1561 Reval et les nobles du nord de l’Estonie se placent sous la domination suédoise, Suède's premier pied au sud du golfe de Finlande."
"From 1570 Sweden fought Russia for Estonia. Reval beat off Russian sieges, and in 1580–81 Pontus De la Gardie went on the offensive, taking Kexholm, Wesenberg and, on 6 September 1581, Narva, where many inhabitants were massacred. Ivangorod, Jama and Koporye followed. The Truce of Plussa on 10 August 1583 left Sweden holding Estonia, Ingria and Kexholm.": "De 1570, la Suède combattra la Russie pour l’Estonie. Reval battit les sièges russes, et en 1580–1581 Pontus De la Gardie poursuivit l’offensive, prenant Kexholm, Wesenberg et, le 6 septembre 1581, Narva, où de nombreux habitants furent massacrés. Ivangorod, Jama et Koporye suivirent. La Trêve de Plussa, le 10 août 1583, quitta la Suède en Estonie, en Ingrie et à Kexholm."
