"Livonian War": "Guerre livonienne"
"A war for Old Livonia, today’s Estonia and Latvia, between Russia, Poland–Lithuania, Sweden and Denmark–Norway. Ivan IV’s early conquests broke up the Livonian Confederation, but Polish–Lithuanian and Swedish offensives from 1578 reversed them, and the truces of Jam Zapolski (1582) and Plussa (1583) divided Livonia between Poland–Lithuania and Sweden.": "Une guerre pour l’ancienne Livonie, aujourd'hui Estonie et Lettonie, entre la Russie, la Pologne-Lituanie, la Suède et le Danemark-Norvège. Les premières conquêtes d’Ivan IV ont rompu la Confédération livonienne, mais les offensives polonaises-lituaniennes et suédoises de 1578 les ont inversées, et les trêves de Jam Zapolski (1582) et Plussa (1583) ont divisé la Livonie entre la Pologne-Lituanie et la Suède."
"Dates are Old Style (Julian), the only calendar in the region until Poland adopted the Gregorian calendar in October 1582. Russian sources give some dates differently.": "Les dates sont Old Style (Julien), le seul calendrier de la région jusqu’à ce que la Pologne ait adopté le calendrier grégorien en octobre 1582."
"The first steps are migrated from Sweden at War and told from Sweden’s side; the last two follow Poland–Lithuania.": "Les premiers pas sont migrés de Suède à la guerre et racontés du côté de Suède ; les deux derniers suivent Pologne-Lituanie."
