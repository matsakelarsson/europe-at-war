"1562–1570": "1562–1570"
"Lithuania had taken southern Livonia under its protection in 1559, and in 1561 the Livonian Order was dissolved: its last master became Duke of Courland as a vassal of Sigismund II Augustus, and the rest of its land passed to the Grand Duchy. When a truce ran out in 1562, Ivan IV struck at Lithuania itself. A large Russian army laid siege to Polotsk on the Dvina at the end of January 1563, and after a heavy bombardment the town surrendered on 15 February. According to widely repeated accounts, Jews of Polotsk who refused baptism were drowned in the river on Ivan’s orders.": "La Lituanie avait pris le sud de la Livonie sous sa protection en 1559, et en 1561 l’ordre livonien fut dissous : son dernier maître devint duc de Courland comme vassal de Sigismond II Auguste, et le reste de ses terres passa au Grand-Duché. Quand une trêve s’est terminée en 1562, Ivan IV frappa la Lituanie elle-même. Une grande armée russe a assiégé Polotsk sur la Dvina à la fin de janvier 1563, et après un bombardement lourd la ville s’est rendue le 15 février. Selon des récits très répétés, les Juifs de Polotsk qui refusaient le baptême ont été noyés dans la rivière sur les ordres d’Ivan."
"On 26 January 1564 a Lithuanian army under Mikołaj Radziwiłł the Red surprised and destroyed a Russian force on the Ula river, but Polotsk stayed Russian for sixteen years. The war convinced the Lithuanian nobles that they could not hold out alone. At a joint diet in Lublin in 1569 King Sigismund II Augustus moved Podlasie, Volhynia and the Kiev region from Lithuania to the Polish crown, and on 1 July the two states became one Commonwealth, with a single elected king and parliament but separate armies, treasuries and laws. A truce with Russia followed in 1570.": "Le 26 janvier 1564, une armée lituanienne sous la direction de Mikołaj Radziwił les Rouges surprirent et détruisirent une force russe sur le fleuve Oula, mais Polotsk resta russe pendant seize ans. La guerre convainquit les nobles lituaniens qu’ils ne pouvaient pas tenir seuls. Lors d’une diète commune à Lublin en 1569, le roi Sigismund II Auguste a déplacé Podlasie, Volhynie et la région de Kiev de Lituanie à la couronne polonaise, et le 1er juillet les deux États sont devenus un seul Commonwealth, avec un seul roi élu et parlement mais des armées séparées, des trésors et des lois."
