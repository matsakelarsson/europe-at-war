"The wooden fortress caught fire under bombardment and surrendered on 5 September. As the attackers looted it, the fire reached the powder store, which blew up and killed many on both sides. It was returned to Russia in 1582.": "La forteresse en bois a pris feu sous les bombardements et s’est rendue le 5 septembre. Alors que les agresseurs l’ont pillé, le feu est arrivé au magasin de poudre, qui a explosé et tué beaucoup des deux côtés."
"Prince Ivan Shuisky’s defenders repelled more than thirty assaults. The last Polish–Lithuanian troops left on 4 February 1582.": "Les défenseurs du prince Ivan Shuisky ont repoussé plus de trente assauts. Les dernières troupes polonaises-lituaniennes sont parties le 4 février 1582."
