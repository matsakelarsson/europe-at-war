"1579–1582": "1579–1582"
"Stefan Báthory, Prince of Transylvania, was elected king of Poland and grand duke of Lithuania in 1576. With Polish hussars, Hungarian and German mercenary infantry and Lithuanian troops, he struck not at Livonia, which Ivan IV had largely overrun in 1577, but at the Russian strongholds behind it. On 30 August 1579 he took Polotsk back after a three-week siege. In 1580 his army took Velizh and Usvyaty, and on 5 September the burning fortress of Velikiye Luki.": "Stefan Báthory, prince de Transylvanie, est élu roi de Pologne et grand duc de Lituanie en 1576. Avec des hussards polonais, des infanteries mercenaires hongroises et allemandes et des troupes lituaniennes, il frappe non pas à Livonia, que Ivan IV avait largement dépassé en 1577, mais aux bastions russes derrière elle. Le 30 août 1579, il reprend Polotsk après un siège de trois semaines. En 1580 son armée prit Velizh et Usvyaty, et le 5 septembre la forteresse incendiaire de Velikiye Luki."
"In August 1581 Báthory laid siege to Pskov, one of the strongest towns in Russia. Its garrison and townspeople under Prince Ivan Shuisky beat off every assault, and through the winter Jan Zamoyski kept up a blockade while Polish raiders ranged deep into Russia. With the papal envoy Antonio Possevino as mediator, a ten-year truce was signed at Jam Zapolski on 15 January 1582. Ivan gave up all his Livonian conquests and Polotsk, and Báthory handed back Velikiye Luki and lifted the siege.": "En août 1581, Báthory assiégea Pskov, l’une des villes les plus fortes de Russie. Sa garnison et ses habitants sous le prince Ivan Shuisky battaient toutes les attaques et, pendant l’hiver, Jan Zamoyski maintenait un blocus tandis que les assaillants polonais se rendaient profondément en Russie. Ivan a renoncé à toutes ses conquêtes livoniennes et Polotsk, et Báthory a remis Velikiye Luki et levé le siège."
