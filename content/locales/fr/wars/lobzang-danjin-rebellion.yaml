# French translations of the catalogue text (wave 9); step bodies follow later.
Lobzang Danjin’s rebellion: Rébellion de Lobzang Danjin
? A rising of the Khoshut Mongols of Kokonor (Qinghai) against the Qing, which ended their autonomy. The Khoshut princes of Kokonor, descendants of Güshi Khan, had ruled Tibet until the Dzungar invasion of 1717, and when the Qing expedition of 1720 drove out the Dzungars, Güshi’s grandson Lobzang Danjin hoped to take his forebears’ place in Lhasa. Instead the Qing ruled Tibet through Tibetan ministers and kept the Kokonor princes as titled vassals. In the summer of 1723 Lobzang Danjin called the princes to an assembly, told them to drop their Qing titles and took the old Mongol title of Dalai Hong Taiji; princes who refused, among them Erdeni Erke Toqtonai and Chaghan Danjin, were attacked and fled into Gansu. The rebels raided the forts and villages around Xining, and many monks of the great monasteries of Amdo, among them Gönlung and Kumbum, joined them. The Yongzheng emperor gave command to Nian Gengyao, governor-general of Sichuan and Shaanxi, with Yue Zhongqi as his field commander. In the winter of 1723–1724 Qing troops stormed the rebel monasteries; at Gönlung, burned on 11 February 1724, estimates of the dead range from some thirty monks in the monastery’s own chronicle to more than 6,000 monks and lay people in other accounts. In March 1724 Yue Zhongqi led a fast column of picked cavalry deep into the Tsaidam and scattered the rebel camps in a few weeks; Lobzang Danjin escaped to the Dzungar ruler Tsewang Rabtan. Nian’s regulations of 1724 then divided the Kokonor Mongols into banners under Qing control, limited the size of monasteries and opened supervised border markets, and from 1725 an imperial commissioner (amban) at Xining governed Kokonor. Lobzang Danjin was handed over to the Qing when Dzungaria fell in 1755 and was pardoned by the Qianlong emperor.
: Un soulèvement des Mongols khoshuts du Kokonor (Qinghai) contre les Qing, qui mit fin à leur autonomie. Les princes khoshuts du Kokonor, descendants de Güshi Khan, avaient gouverné le Tibet jusqu’à l’invasion dzoungare de 1717 et, lorsque l’expédition Qing de 1720 chassa les Dzoungars, le petit-fils de Güshi, Lobzang Danjin, espéra prendre à Lhassa la place de ses ancêtres. Mais les Qing gouvernèrent le Tibet par l’intermédiaire de ministres tibétains et maintinrent les princes du Kokonor dans un statut de vassaux titrés. À l’été 1723, Lobzang Danjin convoqua les princes en assemblée, leur ordonna de renoncer à leurs titres Qing et prit l’ancien titre mongol de Dalai Hong Taiji ; les princes qui refusèrent, parmi lesquels Erdeni Erke Toqtonai et Chaghan Danjin, furent attaqués et s’enfuirent au Gansu. Les rebelles razzièrent les forts et les villages des environs de Xining, et de nombreux moines des grands monastères de l’Amdo, notamment Gönlung et Kumbum, se joignirent à eux. L’empereur Yongzheng confia le commandement à Nian Gengyao, gouverneur général du Sichuan et du Shaanxi, avec Yue Zhongqi comme commandant sur le terrain. Pendant l’hiver 1723–1724, les troupes Qing prirent d’assaut les monastères rebelles ; à Gönlung, incendié le 11 février 1724, les estimations du nombre de morts vont d’une trentaine de moines selon la chronique du monastère lui-même à plus de 6 000 moines et laïcs selon d’autres récits. En mars 1724, Yue Zhongqi mena une colonne rapide de cavaliers d’élite au cœur du Tsaidam et dispersa les campements rebelles en quelques semaines ; Lobzang Danjin s’enfuit auprès du souverain dzoungar Tsewang Rabtan. Les règlements de Nian de 1724 répartirent ensuite les Mongols du Kokonor en bannières sous contrôle Qing, limitèrent la taille des monastères et ouvrirent des marchés frontaliers surveillés, et à partir de 1725 un commissaire impérial (amban) établi à Xining gouverna le Kokonor. Lobzang Danjin fut livré aux Qing lors de la chute de la Dzoungarie en 1755 et gracié par l’empereur Qianlong.
