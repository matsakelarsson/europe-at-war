# French translations of the catalogue text (wave 11); step bodies follow later.
Dutch intervention in Lombok and Karangasem: Intervention néerlandaise à Lombok et à Karangasem
? The Dutch conquest of Lombok, ruled since the 18th century by a Balinese dynasty from Karangasem, and with it of Karangasem in eastern Bali. The Muslim Sasak majority of Lombok resented the Balinese court at Cakranegara, and when it conscripted men for a war against Klungkung in 1891, the Sasak of Praya and eastern Lombok rose; the court sent more than 12,000 men against them, and in October 1892 several Sasak chiefs asked the Dutch for help. Governor-General Aart van der Wijck approved an expedition on 27 May 1894, and about 2,400 European and Indonesian soldiers, under General Jacobus Vetter with General P. P. H. van Ham, landed at Ampenan. The Dutch demanded that the old raja, Ratu Agung Gede Ngurah Karangasem, abdicate in favour of the crown prince and give up his son Anak Agung Made, whose harsh rule the Sasak blamed; the court put Made to death and accepted most of the demands. But on the night of 25–26 August 1894 Balinese forces, led by the crown prince Anak Agung Ketut without the raja’s knowledge, attacked the Dutch camp at the Mayura palace in Cakranegara and killed more than 500 soldiers, sailors and labourers, van Ham among them. The Dutch fell back to Ampenan, returned with reinforcements, destroyed the palaces of Mataram and Pagesangan in September and bombarded Cakranegara from 8 November; about 2,000 Balinese and 166 Dutch soldiers died in its capture. Many of the Balinese nobility died in puputan (fights to the death); the raja surrendered on 20 November, was taken to Batavia on 23 November and died there in 1895. Lombok and Karangasem became part of the Dutch East Indies, Karangasem under the Balinese lord Gusti Gede Jelantik as a Dutch regent. The Dutch carried off the court treasury, about 230 kg of gold and 7,199 kg of silver coin with about 1,000 krisses, and some 400 manuscripts, among them a copy of the Nagarakretagama that the Netherlands returned to Indonesia in 1970.
: La conquête néerlandaise de Lombok, gouvernée depuis le XVIIIe siècle par une dynastie balinaise originaire de Karangasem, et avec elle de Karangasem, dans l’est de Bali. La majorité musulmane sasak de Lombok supportait mal la cour balinaise de Cakranegara et, lorsque celle-ci enrôla des hommes pour une guerre contre Klungkung en 1891, les Sasak de Praya et de l’est de Lombok se soulevèrent ; la cour envoya plus de 12 000 hommes contre eux et, en octobre 1892, plusieurs chefs sasak demandèrent l’aide des Néerlandais. Le gouverneur général Aart van der Wijck approuva une expédition le 27 mai 1894, et environ 2 400 soldats européens et indonésiens, commandés par le général Jacobus Vetter, secondé par le général P. P. H. van Ham, débarquèrent à Ampenan. Les Néerlandais exigèrent que le vieux raja, Ratu Agung Gede Ngurah Karangasem, abdique en faveur du prince héritier et leur livre son fils Anak Agung Made, dont les Sasak dénonçaient la dureté ; la cour fit mettre Made à mort et accepta la plupart des exigences. Mais dans la nuit du 25 au 26 août 1894, des forces balinaises menées par le prince héritier Anak Agung Ketut, à l’insu du raja, attaquèrent le camp néerlandais établi au palais de Mayura, à Cakranegara, et tuèrent plus de 500 soldats, marins et travailleurs, dont van Ham. Les Néerlandais se replièrent sur Ampenan, revinrent avec des renforts, détruisirent les palais de Mataram et de Pagesangan en septembre et bombardèrent Cakranegara à partir du 8 novembre ; environ 2 000 Balinais et 166 soldats néerlandais périrent lors de sa prise. Nombre de nobles balinais moururent dans des puputan (combats jusqu’à la mort) ; le raja se rendit le 20 novembre, fut emmené à Batavia le 23 novembre et y mourut en 1895. Lombok et Karangasem furent intégrés aux Indes orientales néerlandaises, Karangasem sous l’autorité du seigneur balinais Gusti Gede Jelantik, régent pour le compte des Néerlandais. Les Néerlandais emportèrent le trésor de la cour, environ 230 kg d’or et 7 199 kg de pièces d’argent avec environ 1 000 kriss, ainsi que quelque 400 manuscrits, dont un exemplaire du Nagarakretagama que les Pays-Bas restituèrent à l’Indonésie en 1970.
