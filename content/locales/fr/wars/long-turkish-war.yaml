"1593–1594": "1593–1594"
"Along the Croatian border the fighting had never really stopped. In 1592 Telli Hasan Pasha, the Ottoman governor of Bosnia, took Bihać, and on 15 June 1593 he crossed the Kupa to besiege Sisak, a fortress where the Kupa meets the Sava, with perhaps 12,000–16,000 men. A relief army of 5,000–6,000 Croats, Styrians and Carniolans under Ruprecht von Eggenberg, the ban Tamás Erdődy and Andreas von Auersperg attacked on 22 June while the garrison sallied out. The Ottomans were routed; Hasan Pasha and some 8,000 of his men were killed or drowned in the Kupa.": "En 1592, Telli Hasan Pacha, gouverneur ottoman de Bosnie, prit Bihać et le 15 juin 1593 il traversa le Kupa pour assiéger Sisak, une forteresse où le Kupa rencontre la Save, avec peut-être 12 000 à 16 000 hommes. Une armée de secours composée de 5 000 à 6 000 Croates, Styriens et Carniolans sous la direction de Ruprecht von Eggenberg, l’interdiction Tamás Erdődy et Andreas von Auersperg attaquèrent le 22 juin tandis que la garnison s’enfuit. Les Ottomans furent chassés ; Hasan Pacha et quelque 8 000 de ses hommes furent tués ou noyés dans le Kupa."
"Sultan Murad III answered with open war. In August the Ottomans took Sisak, and in October the grand vizier Koca Sinan Pasha took Veszprém and Várpalota in Transdanubia, while an imperial winter campaign won back Fülek and other castles in Upper Hungary. In 1594 the imperial army besieged Esztergom without success, and Sinan marched up the Danube and took Győr on 29 September. Győr, the strongest fortress on the road to Vienna, was a heavy loss, and Emperor Rudolf II and the Imperial Diet voted large sums for what Germans called the Turkish war.": "En août, les Ottomans prirent Sisak, et en octobre, le grand vizier Koca Sinan Pacha prit Veszprém et Várpalota en Transdanubie, tandis qu’une campagne d’hiver impériale remporta Fülek et d’autres châteaux de la Haute Hongrie. En 1594 l’armée impériale assiégea Esztergom sans succès, et Sinan marcha vers le Danube et prit Győr le 29 septembre. Győr, la forteresse la plus forte sur la route de Vienne, fut une lourde perte, et l’empereur Rudolf II et la Diète Impériale votèrent de grandes sommes pour ce que les Allemands appelaient la guerre turque."
