"Sigismund Báthory gave up Transylvania twice, and in 1599 handed it to his cousin, Cardinal Andrew Báthory, who looked to Poland and demanded that Michael step down. Michael, with the emperor’s approval, crossed the Carpathians and beat Andrew at Șelimbăr near Sibiu on 28 October 1599; Andrew was killed by Székelys as he fled. On 1 November Michael entered Alba Iulia and ruled Transylvania as the emperor’s governor. In May 1600 he drove Ieremia Movilă out of Moldavia, and for a few months he styled himself prince of Wallachia, Transylvania and Moldavia.": "Sigismund Báthory abandonna la Transylvanie deux fois et, en 1599, il le remit à son cousin, le cardinal Andrew Báthory, qui regarda vers la Pologne et demanda que Michael démissionne. Michel, avec l’approbation de l’empereur, traversa les Carpates et battit André à Şelimbăr près de Sibiu le 28 octobre 1599 ; Andrew fut tué par Székelys alors qu’il s’enfuit. Le 1er novembre, Michael entra dans Alba Iulia et régna sur la Transylvanie en tant que gouverneur de l’empereur. En mai 1600, il conduisit Ieremia Movilă hors de Moldavie, et pendant quelques mois il se nomma prince de Wallachia, de Transylvanie et de Moldavie."
"Since the 19th century Romanian nationalists have seen this as the first union of the lands that now form Romania. In his own time Michael relied on the Hungarian, Székely and Saxon estates and did not give new rights to the Romanian peasants, and his rule was short. The Transylvanian nobles rose against him and, with the imperial general Giorgio Basta, beat him at Mirăslău on 18 September 1600, while the Polish chancellor Jan Zamoyski restored Movilă in Moldavia and defeated Michael at Bucov in October. Michael won back the emperor’s support and, with Basta, beat Sigismund Báthory at Guruslău on 3 August 1601, but days later Basta’s soldiers killed him near Câmpia Turzii.": "Depuis le 19ème siècle, les nationalistes roumains ont vu cela comme la première union des terres qui forment aujourd'hui la Roumanie. À son époque, Michael comptait sur les propriétés hongroise, székely et saxonne et ne donnait pas de nouveaux droits aux paysans roumains, et son gouvernement était court. Les nobles transylvaniens se sont levés contre lui et, avec le général impérial Giorgio Basta, l’ont battu à Mirăslău le 18 septembre 1600, tandis que le chancelier polonais Jan Zamoyski a restauré Movilă en Moldavie et défait Michael à Bucov en octobre. Michael remporta le soutien de l’empereur et, avec Basta, battit Sigismund Báthory à Guruslău le 3 août 1601, mais quelques jours plus tard, les soldats de Basta vinrent le tuer près de Câmpia Turzii."
