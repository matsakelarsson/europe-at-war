"Pope Clement VIII worked to bring the Ottoman vassals into the war, and in the winter of 1594–1595 Sigismund Báthory of Transylvania, Michael of Wallachia and Aron of Moldavia joined the emperor. In November 1594 Michael had the Ottoman creditors and soldiers in Bucharest killed and attacked the Ottoman fortresses on the Danube, among them Giurgiu, Brăila and Silistra. In the summer of 1595 Koca Sinan Pasha crossed the Danube with a large army to make Wallachia an Ottoman province, and on 23 August Michael, with about 16,000 men, met him in the marshy valley of the Neajlov at Călugăreni.": "Le pape Clément VIII a travaillé pour amener les vassaux ottomans dans la guerre, et au cours de l’hiver 1594-1595 Sigismond Báthory de Transylvanie, Michel de Wallachia et Aron de Moldavie ont rejoint l’empereur. En novembre 1594 Michael a fait tuer les créanciers et les soldats ottomans à Bucarest et attaquer les forteresses ottomanes sur le Danube, parmi lesquelles Giurgiu, Brăila et Silistra. Au cours de l’été 1595, Koca Sinan Pacha traversa le Danube avec une grande armée pour faire de Wallachie une province ottomane et, le 23 août, Michael, avec environ 16 000 hommes, le rencontra dans la vallée marécageuse du Neajlov à Călugăreni."
"The Wallachians held the field and drove back the Ottoman attacks, but Michael was too weak to follow up and withdrew to the mountains. Sinan occupied Bucharest and Târgoviște and fortified them. In October Sigismund Báthory came down from Transylvania with his army, joined by Michael and by imperial and Tuscan troops; they retook Târgoviște on 18 October and Bucharest soon after, and caught Sinan’s army as it crossed the Danube at Giurgiu, destroying its rearguard. In Hungary the imperial army had taken Esztergom on 2 September.": "Les Wallachiens ont tenu le champ et repoussé les attaques ottomanes, mais Michel était trop faible pour suivre et se retirer dans les montagnes. Sinan a occupé Bucarest et Târgoviște et les a fortifiés. En octobre, Sigismond Báthory descendit de Transylvanie avec son armée, rejointe par Michael et par des troupes impériales et toscanes ; ils reprirent Târgoviște le 18 octobre et Bucarest peu après, et prirent l’armée Sinan-Sienne alors qu’elle traversait le Danube à Giurgiu, détruisant son arrière-garde."
