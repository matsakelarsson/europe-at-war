"In 1596 Mehmed III became the first sultan in thirty years to lead his army in person. The imperial army under Archduke Maximilian had taken Hatvan in September and killed its garrison and inhabitants, women and children among them. The Ottomans besieged Eger, which had held out against them in 1552, from 21 September, and on 12 October the fortress capitulated. Its defenders, mostly foreign mercenaries, were then killed in revenge for Hatvan.": "En 1596, Mehmed III devint le premier sultan en trente ans à diriger son armée en personne. L’armée impériale sous l’archiduc Maximilien avait pris Hatvan en septembre et tué sa garnison et ses habitants, femmes et enfants parmi eux. Les Ottomans assiégèrent Eger, qui s’était tenu contre eux en 1552, du 21 septembre et le 12 octobre la forteresse capitulait. Ses défenseurs, pour la plupart des mercenaires étrangers, ont ensuite été tués en vengeance contre Hatvan."
"Maximilian and Sigismund Báthory joined forces and met the Ottoman army on the marshy plain of Mezőkeresztes, south of the Bükk hills, on 24–26 October. On the last day the Christian army broke into the Ottoman camp, but its soldiers turned to plunder; the camp servants fought back with whatever came to hand, and cavalry under Cığalazade Sinan Pasha struck the scattered troops and routed them. Both sides lost tens of thousands of men. It was the only great field battle of the war, but Mehmed went home without following it up.": "Maximilian et Sigismond Báthory se joignirent à l’armée ottomane sur la plaine marécageuse de Mezőkeresztes, au sud des collines de Bükk, les 24 et 26 octobre. Le dernier jour, l’armée chrétienne est entrée dans le camp ottoman, mais ses soldats se sont tournés vers le pillage ; les serviteurs du camp ont combattu avec tout ce qui venait à la main, et la cavalerie sous Cığalazade Sinan Pacha a frappé les troupes dispersées et les a roués. Les deux camps ont perdu des dizaines de milliers d’hommes."
