"Long Turkish War": "Longue guerre turque"
"A war of thirteen years between the Habsburg Monarchy and the Ottoman Empire, fought mainly in Hungary, Croatia and the Danubian principalities, and known in Hungary as the Fifteen Years’ War. Transylvania, Wallachia and Moldavia joined the Habsburg side in 1594–1595, and Michael the Brave of Wallachia briefly ruled all three principalities in 1600. Neither empire could break the other’s chain of fortresses, and after the Hungarian rising led by Stephen Bocskai the war ended in the Peace of Zsitvatorok of 1606, which left the border much as it had been.": "Une guerre de treize ans entre la monarchie des Habsbourg et l’Empire ottoman, a combattu principalement en Hongrie, Croatie et les principautés danubiennes, et connu en Hongrie comme la guerre de quinze ans. Transylvanie, Wallachia et Moldavie ont rejoint le côté des Habsburg en 1594-1595, et Michael le Brave de Wallachia a brièvement gouverné les trois principautés en 1600. Aucun empire ne pouvait briser l’autre chaîne de forteresses, et après la montée hongroise menée par Stephen Bocskai la guerre s’est terminée dans la paix de Zsitvatorok de 1606, qui a quitté la frontière beaucoup comme elle avait été."
"Dates are Gregorian, which the Habsburg lands, Hungary and Transylvania used by then. Wallachia and Moldavia kept the Julian calendar, ten days behind, so Romanian sources often give Michael the Brave’s battles ten days earlier (Călugăreni 13 August, Șelimbăr 18 October).": "Les dates sont Grégoriennes, que les Habsbourg pays, la Hongrie et Transylvanie utilisé à l’époque. Wallachia et la Moldavie ont gardé le calendrier julien, dix jours derrière, de sorte que les sources roumaines donnent souvent Michael les Braves batailles dix jours plus tôt (Călugăreni 13 août, 18 octobre)."
"The sides changed during the war. Transylvania fought with the Habsburgs in 1595–1598 but later turned against them; Moldavia was ruled in turn by princes allied to Transylvania, to Poland and to Michael the Brave. Numbers of soldiers and dead come mostly from accounts of the time and are uncertain.": "Les parties ont changé pendant la guerre. La Transylvanie a combattu avec les Habsbourg en 1595–1598, mais plus tard elle s’est retournée contre eux ; la Moldavie a été gouvernée à son tour par des princes alliés à la Transylvanie, à la Pologne et à Michael le Brave."
"The rising led by Stephen Bocskai in 1604–1606 has its own entry. The Hundred Years’ Croatian–Ottoman War, which ended at Sisak, has its own entry too.": "La montée menée par Stephen Bocskai en 1604–1606 a sa propre entrée. La guerre de Cent Ans – Ottoman, qui s’est terminée à Sisak, a aussi sa propre entrée."
