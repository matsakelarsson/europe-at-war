"The war in Hungary became a war of sieges. On 29 March 1598 imperial troops under Adolf von Schwarzenberg and Miklós Pálffy blew open a gate of Győr with a petard and took it back by surprise. In the autumn of 1600 the grand vizier Damat İbrahim Pasha besieged Kanizsa, the main fortress covering Styria and Croatia, and in October its commander Georg Paradeiser surrendered; he was later tried and executed for it. Kanizsa became the seat of a new Ottoman province only a few days’ march from Graz.": "La guerre en Hongrie est devenue une guerre de siège. Le 29 mars 1598 les troupes impériales sous Adolf von Schwarzenberg et Miklós Pálffy ont ouvert une porte de Győr avec un pétard et l’ont repris par surprise. À l’automne de 1600, le grand vizier Damat Ibrahim Pacha assiégea Kanizsa, la forteresse principale couvrant la Styrie et la Croatie, et en octobre son commandant Georg Paradeiser s’est rendu ; il a ensuite été jugé et exécuté pour elle. Kanizsa est devenu le siège d’une nouvelle province ottomane à seulement quelques jours de marche de Graz."
"In September 1601 Archduke Ferdinand of Inner Austria laid siege to Kanizsa with an army of perhaps 30,000–35,000, including papal troops under Gian Francesco Aldobrandini and soldiers from Mantua, Tuscany and Spain. The garrison under Tiryaki Hasan Pasha, a few thousand strong, held out against bombardment and assaults while rain, disease and desertion wore the besiegers down. Aldobrandini died, and in mid-November, with snow falling, the army retreated, leaving its guns and many sick behind. The same autumn an army under the Duke of Mercœur took Székesfehérvár, which the Ottomans won back in 1602.": "En septembre 1601, l’archiduc Ferdinand d’Autriche intérieure assiégea Kanizsa avec une armée de 30 000 à 35 000 hommes, dont des troupes papales sous Gian Francesco Aldobrandini et des soldats de Mantoue, Toscane et Espagne. La garnison sous Tiryaki Hasan Pacha, quelques milliers de forts, s’est tenue contre les bombardements et les assauts tandis que la pluie, la maladie et la désertion portaient les assiéges. Aldobrandini est mort, et à la mi-novembre, avec la chute de neige, l’armée a reculé, laissant ses canons et beaucoup malades derrière. À l’automne même, une armée sous le duc de Merceur prit Székesfehérvár, que les Ottomans remportèrent en 1602."
