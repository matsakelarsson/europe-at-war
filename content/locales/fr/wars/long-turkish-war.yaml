"Bocskai’s rising and the Ottoman recovery": "Bocskaï s’élève et la reprise ottomane"
"1602–1605": "1602–1605"
"By 1602 both empires were exhausted. Unpaid mercenaries plundered the country they were meant to defend; in Transylvania Basta’s soldiers and the Tatars left famine behind them, and in the Ottoman Empire the Celali revolts spread across Anatolia and war with Persia began in 1603. Imperial troops took Pest in 1602 but could not take Buda. Meanwhile Rudolf II’s officials tried Protestant nobles for treason and seized churches from the Lutheran towns of Upper Hungary.": "En 1602, les deux empires furent épuisés. Des mercenaires non payés pillèrent le pays qu’ils étaient censés défendre ; en Transylvanie Basta, les soldats et les Tatars laissèrent la famine derrière eux, et dans l’Empire ottoman, les révoltes Celali se répandirent à travers l’Anatolie et la guerre avec la Perse commença en 1603. Pendant ce temps Rudolf II, les fonctionnaires ont essayé les nobles protestants pour trahison et saisi des églises des villes luthériennes de la Haute Hongrie."
"In October 1604 Stephen Bocskai, a Calvinist lord in Bihar, rose against the emperor with the hajdús, the free soldiers of the plain, and defeated an imperial column at Álmosd. He took Kassa in November, was elected prince of Transylvania in February 1605 and prince of Hungary at Szerencs in April, and his horsemen raided Moravia, Styria and Lower Austria. The Ottomans backed him, and their grand vizier, Lala Mehmed Pasha, took Esztergom back in October 1605 and in November handed Bocskai a crown on the field of Rákos near Pest.": "En octobre 1604, Stephen Bocskaï, un seigneur calviniste à Bihar, se leva contre l’empereur avec les hajdús, les soldats libres de la plaine, et battit une colonne impériale à Álmosd. Il prit Kassa en novembre, fut élu prince de Transylvanie en février 1605 et prince de Hongrie à Szerencs en avril, et ses cavaliers pillèrent Moravie, Styrie et Basse-Autriche. Les Ottomans l’ont soutenu, et leur grand vizier, Lala Mehmed Pacha, a repris Esztergom en octobre 1605 et a remis en novembre Bocskaï une couronne sur le champ de Rákos près de Pest."
"Battle of Álmosd": "Bataille d’Almosd"
"14–15 October 1604, Bocskai’s victory": "14-15 octobre 1604, victoire de Bocskaï"
"Bocskai elected prince of Hungary": "Bocskaï élu prince de Hongrie"
"17 April 1605, at Szerencs": "17 avril 1605, à Szerencs"
"Esztergom retaken by the Ottomans": "Esztergom repris par les Ottomans"
"October 1605": "octobre 1605"
"14–15 October 1604": "14–15 octobre 1604"
"In a night attack in the woods, Bocskai’s hajdús destroyed an imperial column sent to arrest him.": "Dans une attaque de nuit dans les bois, Bocskaïs hajdús a détruit une colonne impériale envoyée pour l’arrêter."
"Kassa": "Kassa"
"11 November 1604": "11 novembre 1604"
"The chief town of Upper Hungary opened its gates to Bocskai and became his headquarters.": "Le chef-lieu de la Haute Hongrie a ouvert ses portes à Bocskaï et est devenu son quartier général."
"Szerencs": "Szerencs"
"17 April 1605": "17 avril 1605"
"A diet of the Hungarian estates who had joined the rising elected Bocskai prince of Hungary.": "Un régime des successions hongroises qui avait rejoint le prince de Bocskaï, élu à la hausse, de Hongrie."
"Esztergom": "Esztergom"
"Lala Mehmed Pasha took back the fortress lost in 1595, after a siege of more than a month.": "Lala Mehmed Pasha reprit la forteresse perdue en 1595, après un siège de plus d’un mois."
"Rákos": "Rákos"
"November 1605": "novembre 1605"
"The grand vizier presented Bocskai with a jewelled crown from the sultan. Bocskai accepted it as a gift but never had himself crowned.": "Le grand vizier a présenté Bocskai avec une couronne joaillée du sultan. Bocskaï l’a accepté comme un cadeau mais ne s’était jamais couronné lui-même."
"Held by Bocskai’s forces in 1605 (approximate)": "Tenue par les forces de Bocskaï en 1605 (approximative)"
"The peace of Zsitvatorok": "La paix de Zsitvatorok"
"With Rudolf II unable to govern, the Habsburg archdukes made his brother Matthias head of the family in 1606, and Matthias made peace first with the rebels. In the Peace of Vienna of 23 June 1606 Lutherans and Calvinists in Hungary were promised freedom of worship, Hungarians were to hold the kingdom’s offices, and Bocskai was recognised as prince of Transylvania with several counties of eastern Hungary. Bocskai settled his hajdús on the land as free men, and died that December.": "Avec Rudolf II incapable de gouverner, les archdukes de Habsbourg ont fait son frère Matthias chef de la famille en 1606, et Matthias fait la paix d’abord avec les rebelles. Dans la Paix de Vienne du 23 juin 1606 Lutherans et Calvinistes en Hongrie ont été promis la liberté de culte, Hongrois devaient tenir les bureaux du royaume, et Bocskaï a été reconnu comme prince de Transylvanie avec plusieurs comtés de l’est de la Hongrie. Bocskai a installé ses hajdús sur la terre en tant qu’hommes libres, et est mort en décembre."
"Talks with the Ottomans began on 24 October at the mouth of the Zsitva on the Danube, and the peace was signed there on 11 November 1606, for twenty years. The border stayed much as it was. The Ottomans kept Eger, Kanizsa and Esztergom, and the Habsburgs Győr and Komárom. The emperor no longer paid a yearly tribute but sent a single gift of 200,000 florins, and for the first time the sultan addressed him as an equal, as padishah rather than as a king of Vienna. The peace held, with border raids, for more than half a century.": "Les pourparlers avec les Ottomans ont commencé le 24 octobre à l’embouchure de la Zsitva sur le Danube, et la paix y a été signée le 11 novembre 1606, pendant vingt ans. La frontière est restée telle qu’elle était. L’empereur ne payait plus un tribut annuel, mais envoyait un don unique de 200 000 florins, et pour la première fois le sultan l’adressa comme égal, comme padicha plutôt que comme roi de Vienne. La paix a tenu, avec les raids frontaliers, pendant plus d’un demi-siècle."
"Peace of Vienna": "Paix à Vienne"
