"Kept by the Ottomans at the peace, with Kanizsa and Esztergom.": "Conservé par les Ottomans à la paix, avec Kanizsa et Esztergom."
"Kept by the Habsburgs, with Komárom, as the main fortresses guarding Vienna.": "Conservé par les Habsbourg, avec Komárom, comme les principales forteresses de Vienne."
