# French translations of the catalogue text (wave 14); step bodies follow later.
Lord Dunmore’s War: Guerre de Lord Dunmore
? "A war between the colony of Virginia and the Shawnee and Mingo of the Ohio country. At the Treaty of Fort Stanwix in 1768 the Haudenosaunee sold Britain the land south of the Ohio River, which the Shawnee, Lenape and Mingo who hunted there had never agreed to give up, and Virginian surveyors and settlers moved into Kentucky and the upper Ohio valley. After years of killings on both sides, a party of frontiersmen under Daniel Greathouse murdered a group of Mingo at Yellow Creek on 30 April 1774, among them relatives of the Mingo leader Logan, who took revenge on the settlements with Shawnee and Mingo war parties. Virginia’s governor, John Murray, Earl of Dunmore, sent two armies: about 1,700 men under his own command down the Ohio from Fort Pitt, and about 1,100 under Andrew Lewis down the Kanawha. On 10 October 1774 the Shawnee leader Cornstalk attacked Lewis’s camp at Point Pleasant, where the Kanawha joins the Ohio; after a day of fighting the Shawnee withdrew across the Ohio, having lost about 40 men against some 75 Virginians killed and 140 wounded. At Camp Charlotte on 19 October the Shawnee agreed to stop hunting south of the Ohio and to leave travellers on the river alone. Logan refused to attend; the speech sent in his name, “Logan’s Lament”, became famous. The peace opened Kentucky to settlement and lasted only until the Shawnee joined the wars of the American Revolution."
: "Une guerre entre la colonie de Virginie et les Shawnees et les Mingos du pays de l’Ohio. Au traité de Fort Stanwix, en 1768, les Haudenosaunee vendirent à la Grande-Bretagne les terres situées au sud de l’Ohio, que les Shawnees, les Lenapes et les Mingos qui y chassaient n’avaient jamais accepté de céder, et des arpenteurs et des colons virginiens s’installèrent au Kentucky et dans la haute vallée de l’Ohio. Après des années de meurtres de part et d’autre, une bande d’hommes de la frontière menés par Daniel Greathouse assassina un groupe de Mingos à Yellow Creek le 30 avril 1774, parmi lesquels des parents du chef mingo Logan, qui se vengea sur les établissements avec des partis de guerre shawnees et mingos. Le gouverneur de la Virginie, John Murray, comte de Dunmore, envoya deux armées : environ 1 700 hommes sous son propre commandement, qui descendirent l’Ohio depuis Fort Pitt, et environ 1 100 sous les ordres d’Andrew Lewis, qui descendirent la Kanawha. Le 10 octobre 1774, le chef shawnee Cornstalk attaqua le camp de Lewis à Point Pleasant, au confluent de la Kanawha et de l’Ohio ; après une journée de combats, les Shawnees se replièrent de l’autre côté de l’Ohio : ils avaient perdu une quarantaine d’hommes, contre quelque 75 Virginiens tués et 140 blessés. À Camp Charlotte, le 19 octobre, les Shawnees acceptèrent de ne plus chasser au sud de l’Ohio et de laisser en paix les voyageurs sur le fleuve. Logan refusa d’y assister ; le discours envoyé en son nom, la « Complainte de Logan » (Logan’s Lament), devint célèbre. La paix ouvrit le Kentucky à la colonisation et ne dura que jusqu’à l’entrée des Shawnees dans les guerres de la Révolution américaine."
