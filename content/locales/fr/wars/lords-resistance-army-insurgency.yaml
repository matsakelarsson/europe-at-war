# French translations of the catalogue text (wave 13); step bodies follow later.
Lord’s Resistance Army insurgency: Insurrection de l’Armée de résistance du Seigneur
? "The war waged by Joseph Kony’s Lord’s Resistance Army (LRA), first against the government of Yoweri Museveni in northern Uganda and later in the borderlands of South Sudan, the Democratic Republic of the Congo and the Central African Republic. It grew out of the defeat of the northern army in 1986 and of Alice Lakwena’s Holy Spirit Movement, and drew on Acholi grievances, Christian and spiritual beliefs and Kony’s own claims of prophecy. The LRA became known for the abduction of children to serve as fighters, porters and “wives”: a University of California, Berkeley study estimated that by 2006 it had taken 24,000–38,000 children and 28,000–37,000 adults. Sudan armed it from 1994 in return for Uganda’s support of southern Sudanese rebels. To deny it support, the Ugandan government forced most of the Acholi population, up to 1.5–2 million people, into camps where disease and hunger killed far more people than the rebels did, according to World Health Organization data. The UN estimates that more than 100,000 people were killed. Museveni referred the LRA to the International Criminal Court, which issued its first ever arrest warrants in 2005 against Kony and four commanders. Peace talks in Juba in 2006–2008 brought calm to northern Uganda, but Kony never signed the final agreement. Driven from Garamba in the Congo by a regional offensive in December 2008, the LRA massacred hundreds of Congolese civilians and spread into the CAR and Sudan’s Kafia Kingi enclave, pursued by Ugandan troops, an African Union task force and US special forces until 2017. It has since shrunk to a small band, but Kony remains at large; in November 2025 the ICC confirmed 39 counts of war crimes and crimes against humanity against him in his absence, and in 2026 attacks and abductions in the south-east of the CAR were again attributed to the LRA."
: "La guerre menée par l’Armée de résistance du Seigneur (LRA) de Joseph Kony, d’abord contre le gouvernement de Yoweri Museveni dans le nord de l’Ouganda, puis dans les confins du Soudan du Sud, de la République démocratique du Congo et de la République centrafricaine. Elle naquit de la défaite de l’armée du Nord en 1986 et du Mouvement du Saint-Esprit d’Alice Lakwena, et se nourrit des griefs des Acholi, de croyances chrétiennes et spirituelles et des prétentions prophétiques de Kony lui-même. La LRA se fit connaître par l’enlèvement d’enfants destinés à servir de combattants, de porteurs et d’« épouses » : une étude de l’université de Californie à Berkeley estima qu’en 2006, elle avait enlevé 24 000 à 38 000 enfants et 28 000 à 37 000 adultes. Le Soudan l’arma à partir de 1994 en réponse au soutien apporté par l’Ouganda aux rebelles du Sud-Soudan. Pour la priver de soutien, le gouvernement ougandais regroupa de force la majeure partie de la population acholi, jusqu’à 1,5 à 2 millions de personnes, dans des camps où, selon les données de l’Organisation mondiale de la santé, la maladie et la faim tuèrent bien plus de gens que les rebelles. L’ONU estime que plus de 100 000 personnes ont été tuées. Museveni saisit la Cour pénale internationale du cas de la LRA, et la Cour délivra en 2005 ses tout premiers mandats d’arrêt, contre Kony et quatre commandants. Les pourparlers de paix de Juba, en 2006–2008, ramenèrent le calme dans le nord de l’Ouganda, mais Kony ne signa jamais l’accord final. Chassée de Garamba, au Congo, par une offensive régionale en décembre 2008, la LRA massacra des centaines de civils congolais et se répandit en Centrafrique et dans l’enclave soudanaise de Kafia Kingi, poursuivie jusqu’en 2017 par les troupes ougandaises, une force d’intervention de l’Union africaine et des forces spéciales américaines. Elle s’est depuis réduite à une petite bande, mais Kony court toujours ; en novembre 2025, la CPI a confirmé contre lui, en son absence, 39 chefs de crimes de guerre et de crimes contre l’humanité et, en 2026, des attaques et des enlèvements dans le sud-est de la Centrafrique ont de nouveau été attribués à la LRA."
