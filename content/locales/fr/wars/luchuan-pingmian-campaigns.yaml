# French translations of the catalogue text (wave 11); step bodies follow later.
Luchuan–Pingmian campaigns: Campagnes de Luchuan–Pingmian
? Four Ming campaigns against Möng Mao, the Tai (Shan) state of the Shweli valley on today’s border between Yunnan and Myanmar, which the Ming called the Luchuan–Pingmian pacification commission. Its ruler Si Renfa (Thonganbwa in Burmese) stopped paying tribute and from 1437 annexed the lands of neighbouring chiefs under Ming protection. A first campaign under Mu Sheng and Fang Zheng ended in defeat in 1439. Under the influence of the palace eunuch Wang Zhen the court sent a much larger army under the minister of war Wang Ji, which took Si Renfa’s base in January 1442. Si Renfa fled to Ava, whose king Narapati held him as a bargaining counter and handed him over in 1445–1446, after Ming armies had come into Burma. Two more campaigns, in 1443 and 1449, pursued his son Si Jifa to Mong Yang (Mohnyin), west of the Irrawaddy, without capturing him; the Shan were allowed to stay there if they never crossed the river eastwards. The wars broke Möng Mao but cost the Ming dearly, and the Tumu crisis, in which the Mongols captured the emperor and killed Wang Zhen, followed months after the last campaign.
: Quatre campagnes Ming contre Möng Mao, l’État taï (shan) de la vallée de la Shweli, sur l’actuelle frontière entre le Yunnan et le Myanmar, que les Ming appelaient la commission de pacification de Luchuan–Pingmian. Son souverain Si Renfa (Thonganbwa en birman) cessa de payer tribut et, à partir de 1437, annexa les terres de chefs voisins placés sous la protection des Ming. Une première campagne menée par Mu Sheng et Fang Zheng se solda par une défaite en 1439. Sous l’influence de l’eunuque du palais Wang Zhen, la cour envoya une armée bien plus nombreuse sous le ministre de la Guerre Wang Ji, qui prit la base de Si Renfa en janvier 1442. Si Renfa s’enfuit à Ava, dont le roi Narapati le garda comme monnaie d’échange et le livra en 1445–1446, après l’entrée d’armées Ming en Birmanie. Deux autres campagnes, en 1443 et 1449, poursuivirent son fils Si Jifa jusqu’à Mong Yang (Mohnyin), à l’ouest de l’Irrawaddy, sans le capturer ; les Shans furent autorisés à y rester à condition de ne jamais franchir le fleuve vers l’est. Ces guerres brisèrent Möng Mao, mais coûtèrent cher aux Ming, et la crise de Tumu, au cours de laquelle les Mongols capturèrent l’empereur et tuèrent Wang Zhen, survint quelques mois après la dernière campagne.
