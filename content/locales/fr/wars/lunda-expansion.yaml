# French translations of the catalogue text (wave 13); step bodies follow later.
Lunda expansion: Expansion lunda
? "The growth of the Lunda state of the mwant yav (Mwata Yamvo), from its heartland on the upper Kasai and Bushimaie rivers in south-western Katanga, into a commonwealth of tributary chiefdoms that reached from the Kwango in the west to the Luapula in the east. Lunda traditions trace the kingship to the marriage of Ilunga Tshibinda, a hunter-prince from the Luba country, with the Lunda princess Ruwej (Lueji). The first ruler whom historians regard as well attested is Nawej, from about 1695: he campaigned against the Sala Mpasu to the north and was killed when an army of the Luba-speaking Kanyok kingdom invaded Lunda, until his successor Muland drove the Kanyok out. Under Yav a Nawej, in the 1720s or thereabouts, the war leader Mai pushed the frontier west across the Kasai against the Lulua, and Muteb led settlers and soldiers north-west along the Kwilu. Around 1740 a Lunda general, the first Mwata Kazembe, Ng’anga Bilonda, led a force east in pursuit of a rival; his successor Kanyembo crossed the Luapula, conquered the Shila and founded the Kingdom of Kazembe, which grew rich on the fisheries of Lake Mweru, the copper of Katanga and trade with the east coast, and which the Portuguese said could raise 20,000 men. The Lunda absorbed conquered chiefs as tributaries rather than replacing them, and their state reached perhaps 300,000 km² at its height in the 19th century. Their wars fed the Atlantic slave trade: Lunda caravans sold captives and ivory to the Imbangala kingdom of Kasanje and to Matamba, which passed them on to Portuguese traders at Luanda, and in the 1760s the Lunda attacked Kasanje and Matamba, apparently to trade with the Portuguese directly, but could not subdue them. Kazembe traded with Portuguese Mozambique and with Swahili and Arab merchants, and turned away the Portuguese missions of 1798 (Francisco de Lacerda, who died at Kazembe’s court) and 1831 (José Monteiro and António Gamito). From the 1850s the Yeke of Msiri took Kazembe’s lands west of the Luapula, and in the 1880s Chokwe hunters and traders, armed with guns bought from the Ovimbundu, overran the Lunda heartland."
: "L’essor de l’État lunda du mwant yav (Mwata Yamvo) qui, depuis son cœur sur le haut Kasaï et la Bushimaie, dans le sud-ouest du Katanga, devint une confédération de chefferies tributaires s’étendant du Kwango à l’ouest jusqu’au Luapula à l’est. Les traditions lunda font remonter la royauté au mariage d’Ilunga Tshibinda, prince chasseur venu du pays luba, avec la princesse lunda Ruwej (Lueji). Le premier souverain que les historiens jugent bien attesté est Nawej, à partir de 1695 environ : il fit campagne contre les Sala Mpasu au nord et fut tué lorsqu’une armée du royaume kanyok, de langue luba, envahit le pays lunda, d’où son successeur Muland finit par chasser les Kanyok. Sous Yav a Nawej, vers les années 1720, le chef de guerre Mai repoussa la frontière vers l’ouest au-delà du Kasaï, aux dépens des Lulua, et Muteb mena colons et soldats vers le nord-ouest le long du Kwilu. Vers 1740, un général lunda, le premier Mwata Kazembe, Ng’anga Bilonda, conduisit une troupe vers l’est à la poursuite d’un rival ; son successeur Kanyembo franchit le Luapula, soumit les Shila et fonda le royaume de Kazembe, qui s’enrichit des pêcheries du lac Mweru, du cuivre du Katanga et du commerce avec la côte orientale, et qui pouvait, selon les Portugais, lever 20 000 hommes. Les Lunda intégraient les chefs vaincus comme tributaires plutôt que de les remplacer, et leur État atteignit peut-être 300 000 km² à son apogée, au XIXe siècle. Leurs guerres alimentèrent la traite atlantique : les caravanes lunda vendaient captifs et ivoire au royaume imbangala de Kasanje et au Matamba, qui les revendaient aux marchands portugais de Luanda et, dans les années 1760, les Lunda attaquèrent le Kasanje et le Matamba, apparemment pour commercer directement avec les Portugais, mais sans parvenir à les soumettre. Le Kazembe commerçait avec le Mozambique portugais ainsi qu’avec des marchands swahilis et arabes, et éconduisit les missions portugaises de 1798 (Francisco de Lacerda, qui mourut à la cour du Kazembe) et de 1831 (José Monteiro et António Gamito). À partir des années 1850, les Yeke de Msiri s’emparèrent des terres du Kazembe à l’ouest du Luapula et, dans les années 1880, des chasseurs et marchands tchokwé, armés de fusils achetés aux Ovimbundu, envahirent le cœur du pays lunda."
