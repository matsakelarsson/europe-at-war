# French translations of the catalogue text (wave 11); step bodies follow later.
Lý–Champa war of 1069: Guerre entre les Lý et le Champa (1069)
? "A seaborne expedition against Champa led by the Lý emperor Lý Thánh Tông of Đại Việt, with the eunuch general Lý Thường Kiệt in command of the vanguard. The Vietnamese chronicles give as its cause the Cham raids on the border that followed a tribute mission in 1068. In the spring of 1069 the fleet sailed south, defeated the Cham army and burned the capital, Vijaya (in today’s Bình Định); the king, whom the chronicles call Chế Củ and modern historians usually identify with Rudravarman III, fled towards Cambodia and was captured. Brought to Thăng Long, he bought his release by ceding three northern districts, Địa Lý, Ma Linh and Bố Chính, which make up most of today’s Quảng Bình and northern Quảng Trị; thousands of Cham captives were settled near the capital. It was Đại Việt’s first lasting gain of Cham land, though Vietnamese settlement there was slow. The account rests almost entirely on the Vietnamese chronicles: the historian Michael Vickery argued that the raid may have struck a regional Cham ruler at Amaravati rather than the king at Vijaya, and the chronicles’ claim that Champa then paid tribute until 1074 has no Cham confirmation. After a civil war, Harivarman IV reunited Champa by 1074 and fought off a new Vietnamese attack."
: "Une expédition maritime contre le Champa conduite par l’empereur Lý Thánh Tông du Đại Việt, le général eunuque Lý Thường Kiệt commandant l’avant-garde. Les chroniques vietnamiennes lui donnent pour cause les raids chams sur la frontière qui suivirent une mission tributaire en 1068. Au printemps 1069, la flotte fit voile vers le sud, vainquit l’armée chame et incendia la capitale, Vijaya (dans l’actuel Bình Định) ; le roi, que les chroniques appellent Chế Củ et que les historiens modernes identifient généralement à Rudravarman III, s’enfuit vers le Cambodge et fut capturé. Emmené à Thăng Long, il acheta sa libération en cédant trois districts du nord, Địa Lý, Ma Linh et Bố Chính, qui forment la majeure partie de l’actuelle province de Quảng Bình et le nord de celle de Quảng Trị ; des milliers de captifs chams furent installés près de la capitale. Ce fut le premier gain durable de terres chames par le Đại Việt, même si la colonisation vietnamienne y fut lente. Le récit repose presque entièrement sur les chroniques vietnamiennes : l’historien Michael Vickery a soutenu que le raid avait peut-être frappé un souverain cham régional à Amaravati plutôt que le roi à Vijaya, et l’affirmation des chroniques selon laquelle le Champa paya ensuite tribut jusqu’en 1074 n’est confirmée par aucune source chame. Après une guerre civile, Harivarman IV réunifia le Champa en 1074 et repoussa une nouvelle attaque vietnamienne."
