# French translations of the catalogue text (wave 11); step bodies follow later.
Lý–Song war: Guerre entre les Lý et les Song
? "A war between Đại Việt under the Lý dynasty and the Song dynasty of China over the hill country between them, home of the Tai-speaking Nùng (Zhuang) clans whose allegiance both courts claimed. As the Song tightened its hold on the frontier under Wang Anshi’s New Policies, the Lý regent Lý Thường Kiệt struck first: in late 1075 one army of upland troops under Nùng Tông Đán marched down the Zuo River while a fleet took Qinzhou and Lianzhou on the coast, and in March 1076, after a siege of 42 days, the Vietnamese stormed Yongzhou (Nanning), destroyed the city and carried off thousands of captives. Song accounts put the dead of the campaign at 80,000 to 100,000. The Song answered with an invasion under Guo Kui at the end of 1076. It took the border districts and reached the Như Nguyệt (Cầu) river within a day’s march of Thăng Long, but failed to break Lý Thường Kiệt’s line, lost more than half its men to fighting and disease, and withdrew in the spring of 1077 after a peace offer. Talks over the captives and the border districts ended in 1084 with a line that the modern border largely follows."
: "Une guerre entre le Đại Việt de la dynastie Lý et la dynastie chinoise des Song pour la région de collines qui les séparait, peuplée par les clans nùng (zhuang) de langue taï dont les deux cours revendiquaient l’allégeance. Alors que les Song resserraient leur emprise sur la frontière dans le cadre des Nouvelles Politiques de Wang Anshi, le régent des Lý, Lý Thường Kiệt, frappa le premier : à la fin de 1075, une armée de troupes montagnardes conduite par Nùng Tông Đán descendit la rivière Zuo tandis qu’une flotte prenait Qinzhou et Lianzhou sur la côte, et en mars 1076, après un siège de 42 jours, les Vietnamiens prirent d’assaut Yongzhou (Nanning), détruisirent la ville et emmenèrent des milliers de captifs. Selon les sources Song, la campagne fit entre 80 000 et 100 000 morts. Les Song répliquèrent par une invasion conduite par Guo Kui à la fin de 1076. Elle prit les districts frontaliers et atteignit la rivière Như Nguyệt (Cầu), à une journée de marche de Thăng Long, mais ne parvint pas à rompre la ligne de Lý Thường Kiệt, perdit plus de la moitié de ses hommes au combat et par la maladie, et se retira au printemps 1077 après une offre de paix. Les négociations sur les captifs et les districts frontaliers aboutirent en 1084 à une ligne que la frontière actuelle suit en grande partie."
