# French translations of the catalogue text (wave 13); step bodies follow later.
Maba Diakhou Bâ’s jihad: Djihad de Maba Diakhou Bâ
? "The war of the Muslim cleric Maba Diakhou Bâ, who took over the Mandinka kingdom of Badibu on the north bank of the Gambia, renamed it Rip and carried a jihad into the Wolof and Serer kingdoms to the north. A teacher of the Qur’an of Fula descent and a follower of the Tijaniyya order, whom Umar Tall is said to have made its leader in the region, he led the Muslim villages of Badibu against the raids of the king’s warriors and by 1861 ruled the country from his new capital, Nioro. He then conquered most of Saloum, sheltered the deposed kings of Cayor, among them Lat Dior, who converted to his strict Islam, and briefly took Jolof in 1865. His forces burned and enslaved villages that resisted, and he aimed to replace the Serer and Wolof kingdoms and their warrior aristocracies with a single Muslim state. France and Britain, which feared him and also armed him at times, could not stop him: France recognised him as almami of Badibu and Saloum in 1864, and his army, led by Lat Dior, drove off a large French column at Pathé Badiane in 1865. His invasion of the Serer kingdom of Sine ended on 18 July 1867, when the army of Maad a Sinig Kumba Ndoffene Famak Joof routed his forces in the rain near Somb and Maba was killed."
: "La guerre du clerc musulman Maba Diakhou Bâ, qui s’empara du royaume mandingue du Badibu, sur la rive nord de la Gambie, le rebaptisa Rip et porta le djihad dans les royaumes wolof et sérères situés au nord. Maître coranique d’ascendance peule et adepte de la confrérie tidjaniyya, à la tête de laquelle Oumar Tall l’aurait placé dans la région, il mena les villages musulmans du Badibu contre les raids des guerriers du roi et, en 1861, gouvernait le pays depuis sa nouvelle capitale, Nioro. Il conquit ensuite la plus grande partie du Saloum, accueillit les rois déchus du Cayor, parmi lesquels Lat Dior, qui se convertit à son islam rigoriste, et prit brièvement le Djolof en 1865. Ses forces incendiaient les villages qui résistaient et en réduisaient les habitants en esclavage, et il visait à remplacer les royaumes sérères et wolof et leurs aristocraties guerrières par un État musulman unique. La France et la Grande-Bretagne, qui le craignaient et parfois aussi l’armaient, ne purent l’arrêter : la France le reconnut comme almamy du Badibu et du Saloum en 1864, et son armée, menée par Lat Dior, repoussa une importante colonne française à Pathé Badiane en 1865. Son invasion du royaume sérère du Sine prit fin le 18 juillet 1867, lorsque l’armée du Maad a Sinig Kumba Ndoffene Famak Joof mit ses forces en déroute sous la pluie près de Somb et que Maba fut tué."
