# Some French text was translated automatically.
"Macedonian Struggle": "Lutte macédonienne"
"An irregular war in Ottoman Macedonia after the failed Ilinden rising of 1903, in which armed bands backed by Greece and pro-Bulgarian bands, chiefly those of the Internal Macedonian-Adrianople Revolutionary Organisation (IMRO), fought each other, Serbian bands and Ottoman troops for the loyalty of the Slavic-speaking Christian villages. Villages were burned and priests, teachers and notables murdered on all sides until the Young Turk Revolution of July 1908 largely ended the fighting, though it went on at a lower level until the Balkan Wars.": "Une guerre irrégulière en Macédoine ottomane après l’échec de la montée d’Ilinden de 1903, au cours de laquelle des bandes armées soutenues par la Grèce et des bandes probulgares, principalement celles de l’Organisation révolutionnaire interne macédonienne-Adrianople (IMRO), se sont combattues, des bandes serbes et des troupes ottomanes pour la loyauté des villages chrétiens slaves. Les villages furent brûlés et les prêtres, les enseignants et les notables assassinés de tous côtés jusqu’à la jeune révolution turque de juillet 1908 ont largement mis fin aux combats, bien qu’il ait continué à un niveau inférieur jusqu’aux guerres balkaniques."
"Known in Greece as the Makedonikos Agonas. The wider rivalry over Macedonia ran from the 1890s to 1912; 1904–1908 were the years of open guerrilla war between the bands.": "Connu en Grèce sous le nom de Makedonikos Agonas. La rivalité plus large sur la Macédoine a couru entre les années 1890 et 1912 ; 1904-1908 étaient les années de guerre ouverte entre les bandes."
"Villages were pressed to declare for the Greek Patriarchate or the Bulgarian Exarchate. The death of the Greek officer Pavlos Melas in October 1904 drew many volunteers from Greece.": "Les villages sont pressés de déclarer pour le Patriarcat grec ou l’Exarchate bulgare. La mort de l’officier grec Pavlos Melas en octobre 1904 a attiré de nombreux volontaires de Grèce."
