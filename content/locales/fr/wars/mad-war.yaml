# Some French text was translated automatically.
"Mad War and the Franco-Breton War": "Guerre folle et guerre franco-bretonne"
"The last revolt of the great French princes against the crown, and the war that ended Brittany’s independence. During the regency of Anne of Beaujeu for the young Charles VIII, Louis of Orléans, Francis II of Brittany and their allies rose in what was called the Mad War (la Guerre folle). On 28 July 1488 the royal army under Louis de La Trémoille routed the Breton army at Saint-Aubin-du-Cormier and captured Orléans, and the Treaty of Le Verger forbade the duke to marry off his daughters without the king’s consent. Francis died weeks later, and his heir, the young Duchess Anne, fought on with English, Spanish and Habsburg help and married Maximilian of Austria by proxy. The French besieged her in Rennes in 1491, and on 6 December she married Charles VIII, bringing Brittany to the French crown.": "La dernière révolte des grands princes français contre la couronne, et la guerre qui a mis fin à l’indépendance de la Bretagne. Pendant la régence d’Anne de Beaujeu pour le jeune Charles VIII, Louis d’Orléans, François II de Bretagne et leurs alliés se sont levés dans ce qu’on appelait la Guerre folle (la Guerre folle). Le 28 juillet 1488, l’armée royale sous Louis de La Trémoille dirigea l’armée bretonne à Saint-Aubin-du-Cormier et captura Orléans, et le traité du Verger interdit au duc d’épouser ses filles sans le consentement du roi. Francis mourut quelques semaines plus tard, et son héritier, la jeune duchesse Anne, se battit avec l’aide anglaise, espagnole et habsbourgeoise et épousa par procuration Maximilien d’Autriche. La française l’assiégea à Rennes en 1491, et le 6 décembre elle épousa Charles VIII, portant la Bretagne à la couronne française."
"Brittany was formally united with France in 1532. The duchy’s distinct institutions survived until the French Revolution.": "La Bretagne est officiellement unie à la France en 1532. Les institutions distinctes duchés ont survécu jusqu’à la Révolution française."
