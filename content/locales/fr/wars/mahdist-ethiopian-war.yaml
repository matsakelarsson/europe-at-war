# French translations of the catalogue text (wave 12); step bodies follow later.
Mahdist–Ethiopian War: Guerre entre les mahdistes et l’Éthiopie
? War between Emperor Yohannes IV of Ethiopia and the Mahdist state of the Sudan. By the Hewett Treaty of June 1884 Ethiopia agreed to help evacuate the Egyptian garrisons cut off by the Mahdist rising on its border, in return for the Bogos country and free transit through Massawa; the Mahdists treated this as an act of war. Ras Alula defeated Osman Digna at Kufit in September 1885. In January 1887 King Tekle Haymanot of Gojjam sacked the Mahdist border town of Gallabat, and in reply the Mahdist general Abu Anja defeated him at Sar Weha in January 1888 and sacked Gondar, burning its churches and carrying off captives. Yohannes, who had also to face the Italians on the coast and a restless Menelik of Shewa, led a great army against the Mahdist fortifications at Gallabat in March 1889. His army was close to victory when he was mortally wounded; it broke up in retreat, and the Mahdists sent his head to Omdurman. The war exhausted both sides and opened the way for Menelik’s accession and Italy’s advance into Eritrea.
: La guerre entre l’empereur d’Éthiopie Yohannes IV et l’État mahdiste du Soudan. Par le traité Hewett de juin 1884, l’Éthiopie accepta d’aider à évacuer les garnisons égyptiennes coupées par le soulèvement mahdiste à sa frontière, en échange du pays des Bogos et du libre transit par Massaoua ; les mahdistes y virent un acte de guerre. Le ras Alula battit Osman Digna à Kufit en septembre 1885. En janvier 1887, le roi Tekle Haymanot du Godjam pilla la ville frontalière mahdiste de Gallabat ; en riposte, le général mahdiste Abu Anja le battit à Sar Weha en janvier 1888 et mit Gondar à sac, incendiant ses églises et emmenant des captifs. Yohannes, qui devait aussi faire face aux Italiens sur la côte et à un Ménélik du Choa remuant, mena une grande armée contre les fortifications mahdistes de Gallabat en mars 1889. Son armée était près de la victoire lorsqu’il fut mortellement blessé ; elle se débanda dans la retraite, et les mahdistes envoyèrent sa tête à Omdurman. La guerre épuisa les deux camps et ouvrit la voie à l’avènement de Ménélik et à l’avancée de l’Italie en Érythrée.
