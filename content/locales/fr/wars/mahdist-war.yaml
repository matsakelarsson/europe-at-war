# French translations of the catalogue text (wave 12); step bodies follow later.
Mahdist War: Guerre des mahdistes
? The rising that ended Egyptian rule in Sudan, the Mahdist State that followed, and its conquest by an Anglo-Egyptian army. In 1881 Muhammad Ahmad, a Sufi teacher from Dongola, proclaimed himself the Mahdi, the guide expected to restore Islam before the end of time, and called for war against the “Turks”, the Egyptian government whose taxes, officials and campaigns against the slave trade had made it hated. His followers, the Ansar, destroyed the Egyptian forces sent against them, took El Obeid in January 1883 and annihilated William Hicks’s army at Shaykan in November. Britain, which had occupied Egypt in 1882, decided to give up Sudan and sent Charles Gordon to Khartoum to organise the withdrawal; he stayed, was besieged, and was killed when the Mahdists stormed the city on 26 January 1885, two days before a British relief force arrived. The Mahdi died that June, and his successor, the Khalifa Abdallahi, ruled the Mahdist State from Omdurman for thirteen years of war with Ethiopia, Egypt and Italy, and of famine. From 1896 Herbert Kitchener led an Egyptian and British army up the Nile, building a railway as it went; it destroyed the Mahdist army at Omdurman on 2 September 1898, and the Khalifa was killed at Umm Diwaykarat in November 1899. Sudan became an Anglo-Egyptian condominium. How many people died in the wars and famines of these years is unknown; contemporary British claims that the population fell by more than half are now thought exaggerated.
: Le soulèvement qui mit fin à la domination égyptienne au Soudan, l’État mahdiste qui lui succéda et sa conquête par une armée anglo-égyptienne. En 1881, Muhammad Ahmad, un maître soufi originaire de Dongola, se proclama Mahdi, le guide attendu pour restaurer l’islam avant la fin des temps, et appela à la guerre contre les « Turcs », le gouvernement égyptien, que ses impôts, ses fonctionnaires et ses campagnes contre la traite des esclaves avaient rendu odieux. Ses partisans, les Ansar, détruisirent les forces égyptiennes envoyées contre eux, prirent El Obeid en janvier 1883 et anéantirent l’armée de William Hicks à Shaykan en novembre. La Grande-Bretagne, qui occupait l’Égypte depuis 1882, décida d’abandonner le Soudan et envoya Charles Gordon à Khartoum pour organiser l’évacuation ; il resta, fut assiégé et fut tué lorsque les mahdistes prirent la ville d’assaut le 26 janvier 1885, deux jours avant l’arrivée d’une colonne de secours britannique. Le Mahdi mourut en juin de la même année, et son successeur, le khalifa Abdallahi, gouverna l’État mahdiste depuis Omdurman pendant treize années de guerre contre l’Éthiopie, l’Égypte et l’Italie, et de famine. À partir de 1896, Herbert Kitchener remonta le Nil à la tête d’une armée égyptienne et britannique, construisant une voie ferrée à mesure qu’il avançait ; cette armée anéantit l’armée mahdiste à Omdurman le 2 septembre 1898, et le khalifa fut tué à Umm Diwaykarat en novembre 1899. Le Soudan devint un condominium anglo-égyptien. On ignore combien de personnes moururent dans les guerres et les famines de ces années ; les affirmations britanniques de l’époque selon lesquelles la population aurait diminué de plus de moitié sont aujourd’hui jugées exagérées.
