# French translations of the catalogue text (wave 13); step bodies follow later.
Maitatsine uprisings: Soulèvements de Maitatsine
? "A series of violent clashes in northern Nigeria between the followers of the preacher Muhammad Marwa, known as Maitatsine (Hausa for “the one who damns”), and the security forces. Marwa, who came from Marwa (Maroua) in northern Cameroon, had preached in Kano since the 1940s against the use of radios, watches, bicycles and cars and against wealth, rejected much of the Islamic tradition and denounced the established religious and political authorities; he was deported by the colonial government, returned after independence and gathered a following, the ’Yan Tatsine, mostly among poor young migrants and Qur’anic students. In December 1980 attacks by his followers on other Muslims and on the police in Kano led to fighting that the police could not contain; the army crushed the uprising, and Marwa died, of his wounds or of a heart attack. The official toll was 4,177 civilians and about 135 police and soldiers killed; other estimates are around 5,000. Survivors carried the movement to other towns: riots in Bulumkutu near Maiduguri and in Kaduna in October 1982 killed over 3,000 people; in Yola and Jimeta in February–March 1984, under Marwa’s successor Musa Makaniki, about 1,000 died and half the town was left homeless; and in Gombe in April 1985 several hundred more were killed. Makaniki fled to Cameroon and was arrested in Nigeria in 2004. Some analysts see the uprisings as a forerunner of Boko Haram."
: "Une série d’affrontements violents dans le nord du Nigeria entre les disciples du prédicateur Muhammad Marwa, dit Maitatsine (« celui qui maudit » en haoussa), et les forces de sécurité. Marwa, originaire de Marwa (Maroua), dans le nord du Cameroun, prêchait à Kano depuis les années 1940 contre l’usage des radios, des montres, des bicyclettes et des voitures et contre la richesse, rejetait une grande partie de la tradition islamique et dénonçait les autorités religieuses et politiques établies ; expulsé par le gouvernement colonial, il revint après l’indépendance et rassembla des fidèles, les ’Yan Tatsine, surtout parmi de jeunes migrants pauvres et des élèves d’écoles coraniques. En décembre 1980, les attaques de ses disciples contre d’autres musulmans et contre la police à Kano provoquèrent des combats que la police ne put contenir ; l’armée écrasa le soulèvement, et Marwa mourut, de ses blessures ou d’une crise cardiaque. Le bilan officiel fut de 4 177 civils et d’environ 135 policiers et soldats tués ; d’autres estimations avancent environ 5 000 morts. Des survivants portèrent le mouvement dans d’autres villes : les émeutes de Bulumkutu, près de Maiduguri, et de Kaduna, en octobre 1982, firent plus de 3 000 morts ; à Yola et Jimeta, en février–mars 1984, sous le successeur de Marwa, Musa Makaniki, environ 1 000 personnes moururent et la moitié de la ville se retrouva sans abri ; et à Gombe, en avril 1985, plusieurs centaines d’autres furent tuées. Makaniki s’enfuit au Cameroun et fut arrêté au Nigeria en 2004. Certains analystes voient dans ces soulèvements un précurseur de Boko Haram."
