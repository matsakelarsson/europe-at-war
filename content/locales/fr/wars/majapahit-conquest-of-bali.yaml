# French translations of the catalogue text (wave 11); step bodies follow later.
Majapahit conquest of Bali: Conquête de Bali par Majapahit
? "The invasion that brought the Balinese kingdom of Bedulu (Bedahulu) under the rule of Majapahit, the empire of eastern Java. Bali had long been linked to Java: Airlangga was a son of the Balinese king Udayana, and Kertanagara of Singhasari had attacked the island in 1284. Under Queen Tribhuwana Wijayatunggadewi, her chief minister Gajah Mada, who had sworn not to rest until the islands of the archipelago were united under Majapahit, sent a fleet against Bali. According to the Babad Arya Tabanan, a later Balinese chronicle, the army landed in 1342 under Gajah Mada with Arya Damar, the regent of Palembang, as his second in command, and after seven months of fighting took the royal centre at Bedulu, near today’s Gianyar, in 1343. Balinese tradition names the last king of Bedulu as Sri Astasura Ratna Bumi Banten and tells how Majapahit first got rid of his great minister Kebo Iwa and then defeated the last commander to hold out, Pasung Grigis. Majapahit gave the government of the island to Arya Damar’s brothers, among them Arya Kenceng, the ancestor of the royal houses of Tabanan and Badung, and in about 1352 installed a Javanese prince, Sri Aji Kresna Kepakisan, as vassal king at Samprangan. His descendants ruled Bali from Gelgel and kept the Hindu-Javanese court culture of Majapahit after Java itself became Muslim."
: "L’invasion qui fit passer le royaume balinais de Bedulu (Bedahulu) sous la domination de Majapahit, l’empire de Java oriental. Bali était depuis longtemps liée à Java : Airlangga était le fils du roi balinais Udayana, et Kertanagara de Singhasari avait attaqué l’île en 1284. Sous la reine Tribhuwana Wijayatunggadewi, son premier ministre Gajah Mada, qui avait juré de ne prendre aucun repos avant que les îles de l’archipel ne soient unies sous Majapahit, envoya une flotte contre Bali. Selon le Babad Arya Tabanan, une chronique balinaise plus tardive, l’armée débarqua en 1342 sous les ordres de Gajah Mada, secondé par Arya Damar, régent de Palembang, et, après sept mois de combats, prit en 1343 le centre royal de Bedulu, près de l’actuelle Gianyar. La tradition balinaise donne au dernier roi de Bedulu le nom de Sri Astasura Ratna Bumi Banten et raconte comment Majapahit se débarrassa d’abord de son grand ministre Kebo Iwa, puis vainquit le dernier chef à résister, Pasung Grigis. Majapahit confia le gouvernement de l’île aux frères d’Arya Damar, parmi lesquels Arya Kenceng, ancêtre des maisons royales de Tabanan et de Badung, et vers 1352 installa un prince javanais, Sri Aji Kresna Kepakisan, comme roi vassal à Samprangan. Ses descendants régnèrent sur Bali depuis Gelgel et conservèrent la culture de cour hindou-javanaise de Majapahit après que Java elle-même fut devenue musulmane."
