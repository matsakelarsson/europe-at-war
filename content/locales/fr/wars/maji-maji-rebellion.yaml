# French translations of the catalogue text (wave 13); step bodies follow later.
Maji Maji war: Guerre des Maji-Maji
? The largest rising against German rule in Africa, fought across the south of German East Africa (mainland Tanzania). Head taxes, forced labour and above all the communal cotton fields that Governor Gustav Adolf von Götzen imposed from 1902 had made German rule hated, and the drought of 1905 brought hunger. The healer Kinjikitile Ngwale gave his followers maji, water that was to turn German bullets to water. In late July 1905 the Matumbi people of the hills north-west of Kilwa uprooted the cotton and attacked traders and officials, and within weeks the rising spread across much of the south of the colony, uniting peoples of many languages, among them the Ngindo, Pogoro, Mbunga and the Ngoni of Songea. The machine guns of the German stations, above all at Mahenge on 30 August, broke the great assaults, and from October German columns of African soldiers (askari) and auxiliaries burned villages, crops and food stores to starve the rebels into surrender. The main fighting ended in April 1906 and the last bands in 1907–1908. Estimates of the dead, most of whom died of the famine that followed, range from 75,000 to 300,000; German losses were 15 Europeans and about 390 African soldiers and auxiliaries.
: Le plus grand soulèvement contre la domination allemande en Afrique, qui embrasa le sud de l’Afrique orientale allemande (la Tanzanie continentale). L’impôt de capitation, le travail forcé et surtout les champs de coton communaux imposés à partir de 1902 par le gouverneur Gustav Adolf von Götzen avaient rendu la domination allemande odieuse, et la sécheresse de 1905 apporta la faim. Le guérisseur Kinjikitile Ngwale donnait à ses fidèles le maji, une eau censée changer les balles allemandes en eau. À la fin de juillet 1905, les Matumbi des collines situées au nord-ouest de Kilwa arrachèrent le coton et attaquèrent marchands et fonctionnaires et, en quelques semaines, le soulèvement s’étendit à une grande partie du sud de la colonie, unissant des peuples de nombreuses langues, parmi lesquels les Ngindo, les Pogoro, les Mbunga et les Ngoni de Songea. Les mitrailleuses des postes allemands, surtout à Mahenge le 30 août, brisèrent les grands assauts et, à partir d’octobre, des colonnes allemandes de soldats africains (askaris) et d’auxiliaires incendièrent villages, récoltes et réserves de vivres pour réduire les rebelles à la reddition par la faim. Les principaux combats prirent fin en avril 1906, et les dernières bandes furent réduites en 1907–1908. Les estimations du nombre de morts, emportés pour la plupart par la famine qui suivit, vont de 75 000 à 300 000 ; les pertes allemandes s’élevèrent à 15 Européens et environ 390 soldats et auxiliaires africains.
