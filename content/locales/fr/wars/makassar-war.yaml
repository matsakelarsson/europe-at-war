# French translations of the catalogue text (wave 11); step bodies follow later.
Makassar War: Guerre de Makassar
? The war in which the Dutch East India Company (VOC) and the Bugis of Bone under Arung Palakka broke the power of Gowa, the Makassar sultanate of South Sulawesi. Under Sultan Hasanuddin Gowa ruled a maritime empire from the fortified port of Makassar, open to all traders, and stood in the way of the Company’s spice monopoly. Arung Palakka, a Bone prince who had led a failed Bugis revolt against Gowa in 1660, took refuge with the Company in Batavia. In November 1666 Admiral Cornelis Speelman sailed with 21 ships and about 1,860 men, among them Ambonese and Bugis troops. He forced a Makassarese army that had invaded Buton to surrender (January 1667), and Arung Palakka raised the Bugis of Bone and Soppeng. On 18 November 1667 Hasanuddin signed the Treaty of Bungaya, which gave the Company a trade monopoly and Makassar’s fort of Ujung Pandang and made Gowa a vassal. The war broke out again in 1668, and only after a long siege did Bugis and Company troops storm Gowa’s citadel, Somba Opu, on 22 June 1669. Gowa’s empire ended; Speelman built Fort Rotterdam as the Company’s base, and Arung Palakka, king of Bone from 1672, became the most powerful man in South Sulawesi. Thousands of Makassarese went into exile across the archipelago, where many fought on against the Company.
: La guerre au cours de laquelle la Compagnie néerlandaise des Indes orientales (VOC) et les Bugis de Bone, conduits par Arung Palakka, brisèrent la puissance de Gowa, le sultanat makassar du sud de Sulawesi. Sous le sultan Hasanuddin, Gowa dominait un empire maritime depuis le port fortifié de Makassar, ouvert à tous les marchands, et faisait obstacle au monopole des épices de la Compagnie. Arung Palakka, prince de Bone qui avait mené en 1660 une révolte bugis manquée contre Gowa, se réfugia auprès de la Compagnie à Batavia. En novembre 1666, l’amiral Cornelis Speelman appareilla avec 21 navires et environ 1 860 hommes, dont des troupes ambonaises et bugis. Il contraignit à se rendre une armée makassaraise qui avait envahi Buton (janvier 1667), et Arung Palakka souleva les Bugis de Bone et de Soppeng. Le 18 novembre 1667, Hasanuddin signa le traité de Bungaya, qui accordait à la Compagnie un monopole commercial et le fort makassarais d’Ujung Pandang, et faisait de Gowa un vassal. La guerre reprit en 1668, et ce n’est qu’après un long siège que les troupes bugis et celles de la Compagnie prirent d’assaut la citadelle de Gowa, Somba Opu, le 22 juin 1669. L’empire de Gowa prit fin ; Speelman construisit le fort Rotterdam pour servir de base à la Compagnie, et Arung Palakka, roi de Bone à partir de 1672, devint l’homme le plus puissant du sud de Sulawesi. Des milliers de Makassarais partirent en exil à travers l’archipel, où beaucoup continuèrent à combattre la Compagnie.
