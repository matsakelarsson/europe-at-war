# French translations of the catalogue text (wave 8); step bodies follow later.
Malabar rebellion: Rébellion du Malabar
An armed rising of Mappila Muslims in the southern taluks of Malabar district, in the Madras Presidency, in 1921–1922, also called the Moplah rebellion or the Mappila rebellion. It grew out of the Khilafat movement and long-standing grievances of Mappila tenants against Hindu landlords (jenmis) backed by British courts. On 20 August 1921 a police raid on a mosque at Tirurangadi to arrest Khilafat leaders led to clashes, and rebels under Ali Musliyar and then Variyankunnath Kunjahammad Haji attacked police stations, courts and treasuries and for some months ruled much of Eranad and Valluvanad. Martial law was declared and troops and the Malabar Special Police suppressed the rising by early 1922. By official figures 43 soldiers and police and about 2,337 rebels were killed and some 45,000 people imprisoned; unofficial estimates of all deaths reach about 10,000. Rebels also killed Hindus and forced conversions, and on 19–20 November 1921 some 70 Mappila prisoners died after being shut in a railway goods wagon.: Un soulèvement armé des musulmans mappila dans les taluks méridionaux du district de Malabar, dans la présidence de Madras, en 1921–1922, appelé aussi rébellion moplah ou rébellion mappila. Il naquit du mouvement du Khilafat et des griefs anciens des tenanciers mappila contre les propriétaires fonciers hindous (jenmis), soutenus par les tribunaux britanniques. Le 20 août 1921, une descente de police dans une mosquée de Tirurangadi pour arrêter des dirigeants du Khilafat provoqua des affrontements, et les rebelles, menés par Ali Musliyar puis par Variyankunnath Kunjahammad Haji, attaquèrent des postes de police, des tribunaux et des trésoreries et gouvernèrent pendant quelques mois une grande partie de l’Eranad et du Valluvanad. La loi martiale fut proclamée, et la troupe et la Malabar Special Police réprimèrent le soulèvement au début de 1922. Selon les chiffres officiels, 43 soldats et policiers et environ 2 337 rebelles furent tués et quelque 45 000 personnes emprisonnées ; les estimations non officielles de l’ensemble des morts atteignent environ 10 000. Les rebelles tuèrent aussi des hindous et procédèrent à des conversions forcées, et les 19–20 novembre 1921, quelque 70 prisonniers mappila moururent après avoir été enfermés dans un wagon de marchandises.
