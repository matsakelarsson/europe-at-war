# French translations of the catalogue text (wave 13); step bodies follow later.
Malagasy Uprising: Insurrection malgache
? "An armed nationalist rising against French colonial rule in eastern Madagascar, and its suppression. After the Second World War, Madagascar’s elected deputies in the French National Assembly, Joseph Raseta, Joseph Ravoahangy and Jacques Rabemananjara of the Democratic Movement for Malagasy Renewal (MDRM), sought independence by legal means and were rebuffed. On the night of 29 March 1947 fighters organised by the secret societies Panama and Jiny attacked French military posts and plantations around Moramanga and Manakara; at its height the rising held about a third of the island. France raised its forces from about 8,000 to 18,000 and later to about 30,000, mostly colonial troops from Africa, and crushed it with summary executions, torture, the burning of villages and massacres such as that at Moramanga station on 6 May 1947. The last leaders were taken in late 1948 and early 1949. The French authorities blamed the MDRM, dissolved it and had its deputies tried and sentenced, two of them to death, though their role in the rising remains disputed. The death toll is one of the most debated questions of French colonial history: the first official estimate was 89,000 Malagasy dead, revised in 1950 to 11,342 “known dead”, while the historian Jean Fremigacci estimates 30,000–40,000, many of them victims of hunger and disease among people who fled to the forests."
: "Un soulèvement nationaliste armé contre la domination coloniale française dans l’est de Madagascar, et sa répression. Après la Seconde Guerre mondiale, les députés élus de Madagascar à l’Assemblée nationale française, Joseph Raseta, Joseph Ravoahangy et Jacques Rabemananjara, du Mouvement démocratique de la rénovation malgache (MDRM), cherchèrent à obtenir l’indépendance par des moyens légaux et furent éconduits. Dans la nuit du 29 mars 1947, des combattants organisés par les sociétés secrètes Panama et Jiny attaquèrent des postes militaires et des plantations françaises autour de Moramanga et de Manakara ; à son apogée, l’insurrection tenait environ un tiers de l’île. La France porta ses effectifs d’environ 8 000 à 18 000 hommes, puis à environ 30 000, pour la plupart des troupes coloniales venues d’Afrique, et l’écrasa par des exécutions sommaires, la torture, l’incendie de villages et des massacres comme celui de la gare de Moramanga le 6 mai 1947. Les derniers chefs furent pris à la fin de 1948 et au début de 1949. Les autorités françaises rendirent le MDRM responsable, le dissolvèrent et firent juger et condamner ses députés, dont deux à mort, bien que leur rôle dans l’insurrection reste discuté. Le bilan humain est l’une des questions les plus débattues de l’histoire coloniale française : la première estimation officielle était de 89 000 morts malgaches, révisée en 1950 à 11 342 « morts connus », tandis que l’historien Jean Fremigacci l’estime à 30 000–40 000 morts, dont beaucoup furent victimes de la faim et de la maladie parmi les populations réfugiées dans les forêts."
