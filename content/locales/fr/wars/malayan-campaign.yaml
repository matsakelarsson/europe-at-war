# French translations of the catalogue text (wave 11); step bodies follow later.
Malayan campaign and the fall of Singapore: Campagne de Malaisie et chute de Singapour
? Japan’s conquest of British Malaya and Singapore in seventy days. In the first hours of 8 December 1941, about an hour before the attack on Pearl Harbor, the Japanese 25th Army under Lieutenant General Yamashita Tomoyuki landed at Kota Bharu in Malaya and at Singora (Songkhla) and Patani in southern Thailand, which let the Japanese through after a few hours of resistance. Two days later Japanese naval aircraft sank the battleships Prince of Wales and Repulse off Kuantan. With command of the air and sea, light tanks and troops on bicycles, the Japanese drove the British, Indian, Australian and Malay forces of Lieutenant General Arthur Percival down the peninsula, through the defeats at Jitra and Slim River and the battles of Gemas and Muar, and across the causeway to Singapore, the great naval base on which British strategy in the East had rested. They crossed the Johor Strait on 8 February 1942, and on 15 February Percival surrendered some 80,000 men, the largest surrender in British military history. In the following weeks the Japanese killed tens of thousands of Chinese men in Singapore and Malaya in the Sook Ching massacre. Malaya and Singapore stayed under Japanese occupation until September 1945.
: La conquête japonaise de la Malaisie britannique et de Singapour en soixante-dix jours. Aux premières heures du 8 décembre 1941, environ une heure avant l’attaque de Pearl Harbor, la 25e armée japonaise du lieutenant-général Yamashita Tomoyuki débarqua à Kota Bharu, en Malaisie, ainsi qu’à Singora (Songkhla) et à Patani, dans le sud de la Thaïlande, qui laissa passer les Japonais après quelques heures de résistance. Deux jours plus tard, l’aéronavale japonaise coula les cuirassés Prince of Wales et Repulse au large de Kuantan. Maîtres des airs et de la mer, disposant de chars légers et de troupes à bicyclette, les Japonais refoulèrent les forces britanniques, indiennes, australiennes et malaises du lieutenant-général Arthur Percival tout le long de la péninsule, à travers les défaites de Jitra et de Slim River et les batailles de Gemas et de Muar, puis au-delà de la chaussée jusqu’à Singapour, la grande base navale sur laquelle reposait la stratégie britannique en Orient. Ils franchirent le détroit de Johor le 8 février 1942, et le 15 février Percival capitula avec quelque 80 000 hommes, la plus grande reddition de l’histoire militaire britannique. Dans les semaines qui suivirent, les Japonais tuèrent des dizaines de milliers d’hommes chinois à Singapour et en Malaisie lors du massacre de Sook Ching. La Malaisie et Singapour restèrent sous occupation japonaise jusqu’en septembre 1945.
