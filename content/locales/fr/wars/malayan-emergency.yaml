# French translations of the catalogue text (wave 11); step bodies follow later.
Malayan Emergency: État d’urgence malais
? The guerrilla war between the Malayan Communist Party’s army, the Malayan National Liberation Army, and the British colonial government of the Federation of Malaya, with troops from across the Commonwealth, and from 1957 the independent Federation. The MCP, which had led the armed resistance to the Japanese occupation and drew most of its members from the Chinese community, turned to armed struggle in 1948, and after the killing of three European planters at Sungai Siput on 16 June the government declared a state of emergency. The guerrillas, a few thousand strong and supplied by a civilian network among the rural Chinese, attacked estates, mines, police posts and roads; the war reached its height in 1951, when they killed the High Commissioner, Sir Henry Gurney. Under the Briggs Plan some half a million people, most of them Chinese squatters, were forcibly resettled into guarded “New Villages”, and under General Sir Gerald Templer political concessions went together with food control, collective punishments and small-unit jungle warfare. Malaya’s march to independence in 1957 took away the communists’ main cause; talks at Baling in 1955 failed, but surrenders grew, and the government declared the Emergency over on 31 July 1960, with the remaining guerrillas across the Thai border. About 11,000 people were killed.
: La guerre de guérilla qui opposa l’armée du Parti communiste malais, l’Armée de libération nationale malaise, au gouvernement colonial britannique de la Fédération de Malaisie, appuyé par des troupes venues de tout le Commonwealth, puis, à partir de 1957, à la Fédération indépendante. Le PCM, qui avait mené la résistance armée à l’occupation japonaise et recrutait la plupart de ses membres dans la communauté chinoise, se tourna vers la lutte armée en 1948, et après le meurtre de trois planteurs européens à Sungai Siput le 16 juin, le gouvernement proclama l’état d’urgence. Les guérilleros, forts de quelques milliers d’hommes et ravitaillés par un réseau civil parmi les Chinois des campagnes, attaquèrent plantations, mines, postes de police et routes ; la guerre atteignit son paroxysme en 1951, lorsqu’ils tuèrent le haut-commissaire, Sir Henry Gurney. En application du plan Briggs, environ un demi-million de personnes, pour la plupart des squatters chinois, furent réinstallées de force dans des « nouveaux villages » gardés, et sous le général Sir Gerald Templer les concessions politiques allèrent de pair avec le contrôle de la nourriture, les punitions collectives et la guerre de jungle menée par de petites unités. La marche de la Malaisie vers l’indépendance, obtenue en 1957, priva les communistes de leur principale cause ; les pourparlers de Baling échouèrent en 1955, mais les redditions se multiplièrent, et le gouvernement déclara la fin de l’état d’urgence le 31 juillet 1960, alors que les derniers guérilleros se trouvaient de l’autre côté de la frontière thaïlandaise. Environ 11 000 personnes furent tuées.
