# French translations of the catalogue text (wave 12); step bodies follow later.
Mali and Gao: Le Mali et Gao
? "The long contest for Gao and the middle Niger between the Mali Empire and the Songhai kings of Gao. Malian armies probably conquered the kingdom of Gao in the late thirteenth century, between about 1275 and 1300; the Timbuktu chronicles date its submission to Mansa Musa’s pilgrimage of 1324–1325, when he built a mosque at Gao on his way home, and Ibn Battuta, who passed through Gao in 1353, still found it part of Mali. Malian rule was not continuous: the ruler of Gao paid tribute and broke away whenever Mali was in difficulty. Songhai tradition tells how two princes held at the Mali court, Ali Kolon and Sulayman Nar, slipped away, beat off the horsemen sent after them and made themselves independent at Gao, founding the Sonni dynasty; its date is uncertain, but Gao seems to have been free of Mali by the end of the fourteenth century, when Mali was weakened by succession quarrels. Mali held Timbuktu and the inland Niger delta for longer. A Mossi army sacked Timbuktu in the 1330s, but Malian governors returned and stayed until the Tuareg took the town in 1433. The last Sonni kings before Sonni Ali carried the war west: Sonni Madawu raided Niani, the Malian capital, and carried off twenty-four groups of the mansa’s servile people, and Sonni Sulayman Dama sacked Mema, the centre of Mali’s Soninke province. Sonni Ali’s conquests from 1464 made Gao the master of the Niger bend."
: "La longue lutte entre l’empire du Mali et les rois songhaï de Gao pour Gao et le moyen Niger. Les armées maliennes conquirent probablement le royaume de Gao à la fin du XIIIe siècle, entre 1275 et 1300 environ ; les chroniques de Tombouctou datent sa soumission du pèlerinage de Mansa Moussa en 1324–1325, au retour duquel il fit bâtir une mosquée à Gao, et Ibn Battûta, qui passa par Gao en 1353, le trouva encore rattaché au Mali. La domination malienne ne fut pas continue : le souverain de Gao payait tribut et faisait sécession chaque fois que le Mali était en difficulté. La tradition songhaï raconte comment deux princes retenus à la cour du Mali, Ali Kolon et Sulayman Nar, s’échappèrent, repoussèrent les cavaliers lancés à leur poursuite et se rendirent indépendants à Gao, fondant la dynastie des Sonni ; la date en est incertaine, mais Gao semble s’être libéré du Mali à la fin du XIVe siècle, alors que le Mali était affaibli par des querelles de succession. Le Mali conserva plus longtemps Tombouctou et le delta intérieur du Niger. Une armée mossi saccagea Tombouctou dans les années 1330, mais les gouverneurs maliens revinrent et y restèrent jusqu’à la prise de la ville par les Touareg en 1433. Les derniers rois sonni avant Sonni Ali portèrent la guerre vers l’ouest : Sonni Madawu attaqua Niani, la capitale malienne, et emmena vingt-quatre groupes de gens de condition servile appartenant au mansa, et Sonni Sulayman Dama saccagea Mema, le centre de la province soninké du Mali. Les conquêtes de Sonni Ali, à partir de 1464, assurèrent à Gao la maîtrise de la boucle du Niger."
