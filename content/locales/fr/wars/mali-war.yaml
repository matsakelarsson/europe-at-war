# French translations of the catalogue text (wave 12); step bodies follow later.
Mali War: Guerre du Mali
? The war that began in January 2012 when the National Movement for the Liberation of Azawad (MNLA), a Tuareg separatist movement strengthened by fighters returning from Libya, rose in northern Mali together with the jihadist groups Ansar Dine, al-Qaeda in the Islamic Maghreb (AQIM) and MUJAO. After soldiers angry at their defeats overthrew the government in Bamako in March 2012, the rebels took the whole north and the MNLA declared an independent Azawad, but the jihadists soon drove it out and ruled the north under their law. When they advanced south in January 2013, France intervened with Operation Serval and, with Chadian and Malian troops, retook the towns of the north within weeks. A UN mission, MINUSMA, and France’s Sahel-wide Operation Barkhane followed, and the Algiers Accord of 2015 made peace with the Tuareg and Arab movements. But the jihadists, united from 2017 in JNIM, an al-Qaeda affiliate, and rivalled by the Islamic State in the Greater Sahara, spread into central Mali and into Burkina Faso and Niger, and communal massacres followed. Two coups in 2020 and 2021 brought Colonel Assimi Goïta’s junta to power; it turned to Russia’s Wagner Group, made the French and the UN leave, ended the Algiers Accord and took Kidal in 2023. Since 2025 JNIM has blockaded fuel supplies to the south, and in April 2026 JNIM and the Azawad Liberation Front (FLA) launched a nationwide offensive in which the defence minister was killed and the FLA took Kidal, which the army retook in October 2026. Some 20,000 people or more have been killed, and more than 400,000 were displaced inside Mali by 2025.
: La guerre qui commença en janvier 2012 lorsque le Mouvement national de libération de l’Azawad (MNLA), mouvement séparatiste touareg renforcé par des combattants revenus de Libye, se souleva dans le nord du Mali aux côtés des groupes djihadistes Ansar Dine, al-Qaïda au Maghreb islamique (AQMI) et MUJAO. Après que des soldats exaspérés par leurs défaites eurent renversé le gouvernement à Bamako en mars 2012, les rebelles prirent tout le nord et le MNLA proclama l’indépendance de l’Azawad, mais les djihadistes l’en chassèrent bientôt et gouvernèrent le nord selon leur loi. Lorsqu’ils avancèrent vers le sud en janvier 2013, la France intervint avec l’opération Serval et, avec des troupes tchadiennes et maliennes, reprit en quelques semaines les villes du nord. Une mission de l’ONU, la MINUSMA, et l’opération Barkhane, menée par la France dans tout le Sahel, suivirent, et l’accord d’Alger de 2015 fit la paix avec les mouvements touareg et arabes. Mais les djihadistes, unis à partir de 2017 au sein du JNIM, affilié à al-Qaïda, et concurrencés par l’État islamique dans le Grand Sahara, gagnèrent le centre du Mali ainsi que le Burkina Faso et le Niger, et des massacres intercommunautaires suivirent. Deux coups d’État, en 2020 et 2021, portèrent au pouvoir la junte du colonel Assimi Goïta ; celle-ci se tourna vers le groupe russe Wagner, fit partir les Français et l’ONU, mit fin à l’accord d’Alger et prit Kidal en 2023. Depuis 2025, le JNIM soumet le sud à un blocus des approvisionnements en carburant et, en avril 2026, le JNIM et le Front de libération de l’Azawad (FLA) ont lancé une offensive à l’échelle du pays, au cours de laquelle le ministre de la Défense a été tué et le FLA a pris Kidal, que l’armée a reprise en octobre 2026. Quelque 20 000 personnes, voire davantage, ont été tuées, et plus de 400 000 personnes étaient déplacées à l’intérieur du Mali en 2025.
