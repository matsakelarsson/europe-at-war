# French translations of the catalogue text (wave 11); step bodies follow later.
Sectarian conflict in Maluku: Conflit confessionnel aux Moluques
? "The fighting between Christians and Muslims in the Maluku Islands of eastern Indonesia after the fall of Suharto. On 19 January 1999, the day of Idul Fitri, a quarrel between a Christian bus driver and a Muslim youth at the Batu Merah terminal in Ambon turned into riots between the city’s Christian and Muslim quarters, and the violence spread to Seram, Haruku, Saparua, Buru and the Kei Islands. Behind it lay old balances upset by the crisis of 1997–1998: competition for jobs and posts, the arrival of Muslim migrants from Sulawesi, and rivalries within the security forces, parts of which were accused of taking sides. In North Maluku, made a separate province in 1999, a land dispute at Malifut in August 1999 began a cycle of killings in Halmahera; at the end of December 1999 hundreds of Muslims were killed in and around Tobelo, and Christians were killed in Galela in reprisal. From April–May 2000 several thousand fighters of Laskar Jihad, a militia founded in Java by Ja’far Umar Thalib, arrived in Ambon despite the government’s ban and joined attacks on Christian villages; Christian militias fought back. President Abdurrahman Wahid declared a civil emergency in June 2000. Talks brokered by the minister Jusuf Kalla led to the Malino II agreement of February 2002, after which the fighting died down, though bombings and riots recurred, notably in Ambon in April 2004; Laskar Jihad disbanded in October 2002. Estimates of the dead range from about 5,000 to 10,000, and up to 700,000 people were displaced. In Poso in Central Sulawesi a related conflict between Christians and Muslims (December 1998 – December 2001) killed an estimated 1,000–2,500 people, among them many Muslims massacred at the Walisongo boarding school in May 2000; it was ended by the Malino I declaration of 20 December 2001, but small Islamist armed groups remained active around Poso for years."
: "Les combats entre chrétiens et musulmans dans les îles Moluques, dans l’est de l’Indonésie, après la chute de Suharto. Le 19 janvier 1999, jour de l’Idul Fitri, une querelle entre un chauffeur de bus chrétien et un jeune musulman au terminal de Batu Merah, à Ambon, dégénéra en émeutes entre les quartiers chrétiens et musulmans de la ville, et la violence gagna Seram, Haruku, Saparua, Buru et les îles Kei. Elle avait pour toile de fond d’anciens équilibres bouleversés par la crise de 1997–1998 : la concurrence pour les emplois et les postes, l’arrivée de migrants musulmans venus de Sulawesi et les rivalités au sein des forces de sécurité, dont certaines composantes furent accusées de prendre parti. Aux Moluques du Nord, érigées en province distincte en 1999, un litige foncier à Malifut en août 1999 déclencha un cycle de tueries à Halmahera ; à la fin de décembre 1999, des centaines de musulmans furent tués à Tobelo et dans ses environs, et des chrétiens furent tués à Galela en représailles. À partir d’avril–mai 2000, plusieurs milliers de combattants du Laskar Jihad, une milice fondée à Java par Ja’far Umar Thalib, arrivèrent à Ambon malgré l’interdiction du gouvernement et prirent part aux attaques contre des villages chrétiens ; les milices chrétiennes ripostèrent. Le président Abdurrahman Wahid proclama l’état d’urgence civile en juin 2000. Des pourparlers menés sous l’égide du ministre Jusuf Kalla aboutirent à l’accord de Malino II en février 2002, après quoi les combats s’apaisèrent, bien que des attentats et des émeutes se soient reproduits, notamment à Ambon en avril 2004 ; le Laskar Jihad annonça sa dissolution en octobre 2002. Les estimations des morts vont d’environ 5 000 à 10 000, et jusqu’à 700 000 personnes furent déplacées. À Poso, dans le Sulawesi central, un conflit apparenté entre chrétiens et musulmans (décembre 1998 – décembre 2001) fit entre 1 000 et 2 500 morts selon les estimations, parmi lesquels de nombreux musulmans massacrés au pensionnat de Walisongo en mai 2000 ; il prit fin avec la déclaration de Malino I du 20 décembre 2001, mais de petits groupes armés islamistes restèrent actifs autour de Poso pendant des années."
