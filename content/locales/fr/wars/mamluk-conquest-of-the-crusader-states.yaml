"Baibars": "Baibars"
"1265–1271": "1265–1271"
"After the Mamluks beat the Mongols at Ain Jalut in 1260, their commander Baibars murdered Sultan Qutuz and took the throne. Master of Egypt and Syria, he turned on the Frankish states, which were divided among themselves and had sometimes sided with the Mongols. In 1265 he took Caesarea and Arsuf, and in 1266 the Templar castle of Safed, whose garrison was killed after it had surrendered. In August 1266 his army crushed the Armenians of Cilicia at Mari, in the mountains north of Antioch, and sacked their towns.": "Après que les Mamelouks eurent battu les Mongols à Ain Jalut en 1260, leur commandant Baibars assassina le Sultan Qutuz et prit le trône. Maître d’Égypte et de Syrie, il se tourna vers les états franquais, qui étaient divisés entre eux et avaient parfois pris parti pour les Mongols. En 1265, il prit Césarée et Arsuf, et en 1266 le château templier de Safed, dont la garnison fut tuée après sa reddition. En août 1266 son armée a écrasé les Arméniens de Cilicie à Mari, dans les montagnes au nord d’Antioche, et saccagé leurs villes."
"In 1268 Baibars took Jaffa in March and the castle of Beaufort in April, then marched north. Antioch, whose prince Bohemond VI was away in Tripoli, fell on 18 May 1268 after a siege of a few days. Much of its population was killed or enslaved, and the great city, a Frankish principality for 170 years, never recovered. In 1271 Baibars took the Hospitaller castle of Krak des Chevaliers and the Teutonic Knights’ castle of Montfort, and the arrival of the Lord Edward of England that year brought only a truce.": "En 1268 Baibars prit Jaffa en mars et le château de Beaufort en avril, puis marcha vers le nord. Antioche, dont le prince Bohemond VI était parti à Tripoli, tomba le 18 mai 1268 après un siège de quelques jours. Une grande partie de sa population fut tuée ou asservie, et la grande ville, une principauté francaise pendant 170 ans, ne se rétablit jamais. En 1271, Baibars prit le château Hospitalier de Cracovie des Chevaliers et le château Teutonic Knights de Montfort, et l’arrivée du seigneur Édouard d’Angleterre cette année-là n’apporta qu’une trêve."
