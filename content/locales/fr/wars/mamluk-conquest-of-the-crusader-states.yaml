# Some French text was translated automatically.
"Mamluk conquest of the crusader states": "Conquête mamelouke des états croisés"
"The campaigns in which the Mamluk sultans of Egypt and Syria, Baibars, Qalawun and al-Ashraf Khalil, conquered the remaining crusader states on the Syrian and Palestinian coast. Baibars took Caesarea, Arsuf, Safed, Jaffa and Antioch in 1265–1268 and Krak des Chevaliers in 1271; Qalawun took Tripoli in 1289; and the fall of Acre on 18 May 1291 was followed by the surrender of the last Frankish towns and castles on the mainland.": "Les campagnes dans lesquelles les sultans mamelouks d’Égypte et de Syrie, Baibars, Qalawun et al-Ashraf Khalil ont conquis les autres États croisés sur la côte syrienne et palestinienne. Baibars prit Césarée, Arsuf, Safed, Jaffa et Antioche en 1265–1268 et Cracovie des Chevaliers en 1271 ; Qalawun prit Tripoli en 1289 ; et la chute d’Acre le 18 mai 1291 fut suivie par la reddition des dernières villes et châteaux franquais sur le continent."
"Dates are Julian. The Mamluk campaigns are described in detail by Arabic historians, some of them eyewitnesses such as Abu’l-Fida, who fought at Acre; the main Frankish account of the fall of Acre is by an author known as the Templar of Tyre.": "Les campagnes mameloukes sont décrites en détail par des historiens arabes, dont certains témoins oculaires tels qu’Abu=l-Fida, qui ont combattu à Acre ; le principal récit francish de la chute d’Acre est un auteur connu sous le nom de Templier de Tyr."
"The Mamluks also fought the Mongols of the Ilkhanate, with whom the Franks and the Armenians of Cilicia sometimes allied; the threat of Mongol invasion explains much of the timing of the Mamluk campaigns. The crusades of Louis IX to Tunis (1270) and of the Lord Edward to Acre (1271–1272) have their own entries.": "Les Mamelouks ont aussi combattu les Mongols de l’Ilkhanate, avec lesquels les Francs et les Arméniens de Cilicie se sont parfois alliés ; la menace d’invasion mongole explique en grande partie le calendrier des campagnes mameloukes. Les croisades de Louis IX à Tunis (1270) et du Seigneur Édouard à Acre (1271-1272) ont leurs propres entrées."
