"1290–1291": "1290–1291"
"In August 1290 newly arrived Italian crusaders killed Muslim merchants and peasants in Acre, and Qalawun prepared to punish the city. He died in November, but his son al-Ashraf Khalil brought a vast army from Egypt and Syria, with dozens of siege engines, before Acre on 6 April 1291. The city was held by the military orders, the Italian communes, troops of the kingdom and men sent from Cyprus by King Henry II, perhaps 15,000 in all. For six weeks the Mamluks bombarded and mined its double walls.": "En août 1290, des croisés italiens nouvellement arrivés tuèrent des marchands et paysans musulmans à Acre, et Qalawun se prépara à punir la ville. Il mourut en novembre, mais son fils al-Ashraf Khalil apporta une vaste armée d’Égypte et de Syrie, avec des dizaines de moteurs de siège, avant Acre le 6 avril 1291. La ville était tenue par les ordres militaires, les communes italiennes, les troupes du royaume et les hommes envoyés de Chypre par le roi Henri II, peut-être 15 000 au total. Pendant six semaines, les Mamelouks bombardèrent et minèrent ses doubles murs."
"On 18 May the Mamluks broke through at the Accursed Tower and poured into the city. The Templar master William of Beaujeu was killed, thousands of townspeople crowded onto ships in the harbour, many drowned, and those left behind were killed or enslaved. The Templars held their fortress by the sea until 28 May, when it collapsed during the final assault. Tyre, Sidon, Beirut, Haifa, Tortosa and the Templar castle of Athlit were given up without a fight by mid-August. The crusader states on the mainland were at an end, though the Templars held the island of Ruad until 1302 and the Latin kingdom of Cyprus lived on.": "Le 18 mai, les mamelouks parcourent la tour Accursed et se déversent dans la ville. Le maître templier William de Beaujeu est tué, des milliers de citadins envahissent les navires du port, beaucoup se noient, et ceux qui restent sont tués ou asservis. Les Templiers tiennent leur forteresse près de la mer jusqu’au 28 mai, lorsqu’elle s’effondre lors de l’assaut final. Tyre, Sidon, Beyrouth, Haïfa, Tortosa et le château Templier d’Athlit ont été abandonnés sans un combat à la mi-août. Les états croisés sur le continent étaient à une fin, bien que les Templiers tenaient l’île de Ruad jusqu’à 1302, et le royaume Latin de Chypre a vécu sur."
