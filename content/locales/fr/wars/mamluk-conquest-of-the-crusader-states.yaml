"1277–1289": "1277–1289"
"Baibars died in 1277. His successor Qalawun beat a Mongol invasion at Homs in 1281 and renewed truces with the Franks while he dealt with his rivals, then resumed the conquest. He took the Hospitaller fortress of Margat in 1285 and Latakia, the last town of the old Principality of Antioch, in 1287. In Tripoli, after Bohemond VII died in 1287, the townspeople, the heiress Lucia and the Genoese fought over the government, and some of the Franks themselves urged Qalawun to intervene.": "Baibars mourut en 1277. Son successeur Qalawun battit une invasion mongolne à Homs en 1281 et renouvela les trêves avec les Francs pendant qu’il traitait avec ses rivaux, puis reprit la conquête. Il prit la forteresse hospitalière de Margat en 1285 et Latakia, la dernière ville de la vieille Principauté d’Antioche, en 1287. À Tripoli, après la mort de Bohemond VII en 1287, les citadins, l’héritière Lucia et les Génois se sont battus contre le gouvernement, et certains des Frank eux-mêmes ont exhorté Qalawun à intervenir."
"In March 1289 Qalawun besieged Tripoli with a large army and many siege engines. Reinforcements came from Cyprus and Acre, but the walls were breached, and on 26 April the city was stormed. Many of its people were killed or enslaved, and others escaped by ship to Cyprus. Qalawun had the city destroyed and a new Tripoli built a few kilometres inland, and the remaining towns of the county surrendered soon after.": "En mars 1289, Qalawun assiégea Tripoli avec une grande armée et de nombreux moteurs de siège. Des renforts venaient de Chypre et d’Acre, mais les murs ont été brisés, et le 26 avril la ville a été prise d’assaut. Qalawun fit détruire la ville et un nouveau Tripoli construisit quelques kilomètres à l’intérieur du pays, et les autres villes du comté se rendirent peu de temps après."
