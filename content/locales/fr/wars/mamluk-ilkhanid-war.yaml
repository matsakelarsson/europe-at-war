# French translations of the catalogue text (wave 7); step bodies follow later.
Mamluk–Ilkhanid war: Guerre entre Mamelouks et Ilkhanides
The sixty-year conflict between the Mongol Ilkhanate of Iran and the Mamluk Sultanate of Egypt and Syria. In 1260 Hülegü took Aleppo and Damascus and ended Ayyubid rule in Syria, but when he withdrew most of his army, the Mamluks destroyed the force he had left behind at Ain Jalut. The Euphrates became the frontier, fortified on both sides and crossed by raiders almost every year. The Ilkhans invaded Syria in strength, with Armenian and Georgian allies, in 1281, 1299–1300 and 1303, and the Mamluks struck into Cilician Armenia and Seljuk Anatolia, winning at Elbistan in 1277. The Mongols won only once in the field, at Wadi al-Khaznadar in 1299, after which they held Damascus for a few months; their defeat at Marj al-Saffar in 1303 ended their attempts to conquer Syria. After a last siege of al-Rahba in 1312–1313, the Ilkhan Abu Sa’id made peace with the sultan al-Nasir Muhammad in 1322–1323.: Le conflit de soixante ans entre l’Ilkhanat mongol d’Iran et le sultanat mamelouk d’Égypte et de Syrie. En 1260, Houlagou prit Alep et Damas et mit fin à la domination ayyoubide en Syrie, mais lorsqu’il eut retiré la plus grande partie de son armée, les Mamelouks anéantirent à Aïn Djalout les troupes qu’il avait laissées sur place. L’Euphrate devint la frontière, fortifiée des deux côtés et franchie presque chaque année par des pillards. Les ilkhans envahirent la Syrie en force, avec des alliés arméniens et géorgiens, en 1281, en 1299–1300 et en 1303, et les Mamelouks lancèrent des offensives en Arménie cilicienne et en Anatolie seldjoukide, remportant la victoire d’Elbistan en 1277. Les Mongols ne gagnèrent qu’une seule bataille rangée, à Wadi al-Khaznadar en 1299, après quoi ils tinrent Damas quelques mois ; leur défaite à Marj al-Saffar en 1303 mit fin à leurs tentatives de conquête de la Syrie. Après un dernier siège d’al-Rahba en 1312–1313, l’ilkhan Abu Sa’id fit la paix avec le sultan al-Nasir Muhammad en 1322–1323.
