# French translations of the catalogue text (wave 12); step bodies follow later.
Mamluk invasions of Makuria: Invasions mameloukes de la Makurie
A series of wars in which the Mamluk sultans of Egypt broke the Christian Nubian kingdom of Makuria and made it a vassal. For six centuries a treaty, the baqt, had kept the peace between Egypt and Makuria. In 1272 King David of Makuria raided the Red Sea port of Aidhab and later Aswan; in 1276 Sultan Baybars answered with an army that defeated the Nubians at Dongola, sacked the capital and put David’s rival Shakanda on the throne as a tributary. Under Qalawun the Mamluks sent at least two more expeditions (1287 and 1289 in the usual dating) against King Semamun, and the land between the Second Cataract and Dongola was laid waste. In 1316 Sultan al-Nasir Muhammad installed a Muslim Nubian prince, Abdallah Barshambu, and on 29 May 1317 the throne hall of Dongola was consecrated as a mosque. Christian kings reappeared after him, but Makuria never recovered; Arab Bedouin moved south along the Nile, and by the 15th century only a small kingdom remained in Lower Nubia.: Une série de guerres au cours desquelles les sultans mamelouks d’Égypte brisèrent le royaume chrétien nubien de Makurie et en firent un vassal. Pendant six siècles, un traité, le baqt, avait maintenu la paix entre l’Égypte et la Makurie. En 1272, le roi David de Makurie lança un raid contre Aidhab, port de la mer Rouge, puis contre Assouan ; en 1276, le sultan Baybars riposta en envoyant une armée qui battit les Nubiens à Dongola, saccagea la capitale et plaça sur le trône Shakanda, rival de David, comme tributaire. Sous Qalawun, les Mamelouks envoyèrent au moins deux autres expéditions (en 1287 et 1289 selon la datation habituelle) contre le roi Semamun, et le pays entre la deuxième cataracte et Dongola fut dévasté. En 1316, le sultan al-Nasir Muhammad installa un prince nubien musulman, Abdallah Barshambu, et le 29 mai 1317, la salle du trône de Dongola fut consacrée comme mosquée. Des rois chrétiens réapparurent après lui, mais la Makurie ne s’en releva jamais ; des Bédouins arabes remontèrent le Nil vers le sud et, au XVe siècle, il ne restait plus qu’un petit royaume en Basse-Nubie.
