# French translations of the catalogue text (wave 12); step bodies follow later.
Mandingo Wars: Guerres mandingues
? The wars between France and the Wassoulou Empire of Samori Touré (Samory Ture), the longest resistance France met in its conquest of West Africa. Samori, a Malinke trader turned war leader, built a state in the upper Niger basin in the 1860s and 1870s, with its capital at Bissandougou, an army of sofa infantry and cavalry armed with rifles bought through Sierra Leone and made in his own workshops, and Islam as the state religion from 1884. The French first fought him in 1882 at Kéniéran and in 1883 near Bamako; after he turned back a French column in 1885, the Treaty of Kéniéba-Koura (1886) left him the right bank of the Niger. His fifteen-month siege of Sikasso, capital of Kénédougou (1887–1888), failed and set off revolts at home. In 1891 Louis Archinard took Kankan and Bissandougou, and Samori fought a war of manoeuvre and scorched earth, moving his whole state east between 1892 and 1895 to the lands of the Bandama and the Comoé, where he defeated a French column, took Kong and destroyed it in 1897, and clashed with the British at Wa. After the fall of Sikasso in May 1898 the French closed in; his columns starved in the forest on the way to Liberia, and Captain Henri Gouraud captured him at Guélémou on 29 September 1898. He died in exile in Gabon in 1900. Samori is honoured in Guinea and much of West Africa as a hero of resistance, and remembered in other places for the devastation and the mass enslavement his wars brought.
: Les guerres entre la France et l’empire du Wassoulou de Samory Touré (Samori Ture), la plus longue résistance que la France rencontra lors de sa conquête de l’Afrique de l’Ouest. Samory, commerçant malinké devenu chef de guerre, bâtit dans les années 1860 et 1870 un État dans le bassin du haut Niger, avec pour capitale Bissandougou, une armée de fantassins sofas et de cavaliers dotés de fusils achetés par l’intermédiaire de la Sierra Leone ou fabriqués dans ses propres ateliers, et l’islam pour religion d’État à partir de 1884. Les Français le combattirent pour la première fois en 1882 à Kéniéran et en 1883 près de Bamako ; après qu’il eut repoussé une colonne française en 1885, le traité de Kéniéba-Koura (1886) lui laissa la rive droite du Niger. Son siège de Sikasso, capitale du Kénédougou, qui dura quinze mois (1887–1888), échoua et déclencha des révoltes dans ses propres terres. En 1891, Louis Archinard prit Kankan et Bissandougou, et Samory mena une guerre de mouvement et de terre brûlée, transférant tout son État vers l’est entre 1892 et 1895, dans les pays de la Bandama et de la Comoé, où il battit une colonne française, prit Kong et la détruisit en 1897, et se heurta aux Britanniques à Wa. Après la chute de Sikasso en mai 1898, les Français resserrèrent l’étau ; ses colonnes moururent de faim dans la forêt sur la route du Liberia, et le capitaine Henri Gouraud le captura à Guélémou le 29 septembre 1898. Il mourut en exil au Gabon en 1900. Samory est honoré en Guinée et dans une grande partie de l’Afrique de l’Ouest comme un héros de la résistance ; ailleurs, on garde le souvenir des dévastations et de la mise en esclavage massive que ses guerres entraînèrent.
