# French translations of the catalogue text (wave 11); step bodies follow later.
Mangrai’s conquest of Hariphunchai: Conquête de Hariphunchai par Mangrai
? The conquest of Hariphunchai, the old Mon kingdom of the Ping valley centred on today’s Lamphun, by Mangrai, the Tai ruler of Ngoenyang in the far north of Thailand, and the founding of Chiang Mai. Mangrai, who became king of Ngoenyang in 1259 and founded Chiang Rai as his capital in about 1262, extended his rule over the Tai principalities of the Kok valley and around Fang. To take Hariphunchai, the chronicles say, he sent a merchant, Ai Fa, as a spy; Ai Fa rose to be chief minister of King Yi Ba and spread discontent among the people. Mangrai’s army then took the city and Yi Ba fled south to Lampang. Some accounts date the fall to 1281, others to 1291 or 1292. In 1287 Mangrai made a pact of friendship with Ngam Mueang of Phayao and Ram Khamhaeng of Sukhothai, which kept the peace between the three Tai kings. After a first capital at Wiang Kum Kam, which flooded, he founded Chiang Mai, the “new city”, on the Ping in 1296, with the advice, the chronicles say, of his two allies. A later attack on Chiang Mai by Yi Ba’s son, the ruler of Lampang, was beaten by Mangrai’s son Khram, and Lampang came under Lan Na. Chiang Mai remained the capital of the kingdom of Lan Na until the Burmese conquest of 1558.
: La conquête de Hariphunchai, l’ancien royaume môn de la vallée de la Ping, centré sur l’actuelle Lamphun, par Mangrai, souverain taï du Ngoenyang, à l’extrême nord de la Thaïlande, et la fondation de Chiang Mai. Mangrai, devenu roi du Ngoenyang en 1259, et qui fonda Chiang Rai pour en faire sa capitale vers 1262, étendit son autorité sur les principautés taïes de la vallée de la Kok et des environs de Fang. Pour prendre Hariphunchai, disent les chroniques, il envoya comme espion un marchand, Ai Fa, qui devint premier ministre du roi Yi Ba et sema le mécontentement parmi la population. L’armée de Mangrai prit ensuite la ville, et Yi Ba s’enfuit vers le sud, à Lampang. Certains récits datent la chute de 1281, d’autres de 1291 ou 1292. En 1287, Mangrai conclut un pacte d’amitié avec Ngam Mueang de Phayao et Ram Khamhaeng de Sukhothaï, qui maintint la paix entre les trois rois taïs. Après une première capitale à Wiang Kum Kam, qui fut inondée, il fonda en 1296 Chiang Mai, la « ville nouvelle », sur la Ping, sur les conseils, selon les chroniques, de ses deux alliés. Une attaque ultérieure contre Chiang Mai par le fils de Yi Ba, souverain de Lampang, fut repoussée par Khram, fils de Mangrai, et Lampang passa sous la domination du Lan Na. Chiang Mai resta la capitale du royaume de Lan Na jusqu’à la conquête birmane de 1558.
