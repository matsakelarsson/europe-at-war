# French translations of the catalogue text (wave 8); step bodies follow later.
Maratha conquest of Malwa: Conquête marathe du Malwa
The campaigns by which the Peshwa Baji Rao I carried Maratha power north of the Narmada into the Mughal province of Malwa and into Bundelkhand. Maratha armies raided Malwa from 1723; in 1728 Baji Rao’s brother Chimaji Appa defeated and killed its governor, Giridhar Bahadur, at Amjhera, and Maratha chiefs, Holkar, Scindia and the Pawars, began to collect its revenue. In 1729 Baji Rao relieved the Bundela king Chhatrasal, besieged by the Mughal general Muhammad Khan Bangash, and was rewarded with a third of his kingdom. In 1737 he rode to the outskirts of Delhi, and when the Nizam of Hyderabad came north with an imperial army, the Marathas surrounded him at Bhopal and forced him to agree, at Doraha in January 1738, that Malwa would be ceded to them. The emperor formally made the Peshwa deputy governor of Malwa in 1741.: Les campagnes par lesquelles le peshwa Baji Rao Ier porta la puissance marathe au nord de la Narmada, dans la province moghole du Malwa et dans le Bundelkhand. À partir de 1723, les armées marathes lancèrent des raids sur le Malwa ; en 1728, Chimaji Appa, frère de Baji Rao, vainquit et tua son gouverneur, Giridhar Bahadur, à Amjhera, et des chefs marathes, Holkar, Scindia et les Pawar, commencèrent à en percevoir les revenus. En 1729, Baji Rao secourut le roi bundela Chhatrasal, assiégé par le général moghol Muhammad Khan Bangash, et fut récompensé par un tiers de son royaume. En 1737, il chevaucha jusqu’aux abords de Delhi, et lorsque le nizam de Hyderabad remonta vers le nord avec une armée impériale, les Marathes l’encerclèrent à Bhopal et le contraignirent à accepter, à Doraha en janvier 1738, que le Malwa leur soit cédé. En 1741, l’empereur nomma officiellement le peshwa gouverneur adjoint du Malwa.
