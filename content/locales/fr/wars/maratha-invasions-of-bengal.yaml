# French translations of the catalogue text (wave 8); step bodies follow later.
Maratha invasions of Bengal: Invasions marathes du Bengale
The raids of the Maratha armies of Raghuji Bhonsle of Nagpur into the Mughal province of Bengal, Bihar and Orissa, ruled by the Nawab Alivardi Khan. Known in Bengal as the bargis, from the Persian word for a mounted soldier, the Maratha horsemen came almost every year from 1742, led at first by Raghuji’s general Bhaskar Ram Kolhatkar, plundering western Bengal and Bihar and demanding chauth, a quarter of the revenue. Alivardi won many battles, surprised the Maratha camp at Katwa in 1742 and had Bhaskar and his officers killed at a meeting in 1744, but could not stop the raids, which joined forces with a revolt of Alivardi’s own Afghan officers. A Dutch East India Company official estimated that some 400,000 people died. In 1751 Alivardi made peace, giving up the revenue of Orissa and agreeing to pay 12 lakh rupees a year for Bengal.: Les raids des armées marathes de Raghuji Bhonsle de Nagpur dans la province moghole du Bengale, du Bihar et de l’Orissa, gouvernée par le nawab Alivardi Khan. Appelés au Bengale bargis, d’après le mot persan qui désigne un soldat monté, les cavaliers marathes vinrent presque chaque année à partir de 1742, menés d’abord par le général de Raghuji, Bhaskar Ram Kolhatkar, pour piller l’ouest du Bengale et le Bihar et exiger le chauth, le quart des revenus. Alivardi remporta de nombreuses batailles, surprit le camp marathe à Katwa en 1742 et fit tuer Bhaskar et ses officiers lors d’une entrevue en 1744, mais ne put arrêter les raids, qui firent leur jonction avec une révolte des propres officiers afghans d’Alivardi. Un agent de la Compagnie néerlandaise des Indes orientales estima à quelque 400 000 le nombre des morts. En 1751, Alivardi fit la paix, renonçant aux revenus de l’Orissa et acceptant de verser 12 lakhs de roupies par an pour le Bengale.
