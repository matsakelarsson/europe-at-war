# French translations of the catalogue text (wave 8); step bodies follow later.
Maratha–Mysore War: Guerre entre les Marathes et le Mysore
? A war between Tipu Sultan’s Mysore and the Maratha state, allied with the Nizam of Hyderabad, over the lands between the Krishna and the Tungabhadra that Hyder Ali had taken from the Marathas in the 1770s. It began in 1785, when Tipu besieged and took Nargund, whose chief, a tributary of Mysore since Hyder’s conquest of 1778, had refused a higher tribute and turned to the Marathas, and occupied Kittur. Nana Phadnavis, the leading minister at Pune (Poona), allied with the Nizam, and in May 1786 their armies stormed Badami. Tipu answered by taking the Nizam’s fortress of Adoni after the allied relief army withdrew, crossing the flooded Tungabhadra and defeating the Maratha army of Haripant Phadke at Savanur in October 1786; in January 1787 he took Bahadur Benda. Both sides feared the British more than each other, and in April 1787 they made peace at Gajendragad. Tipu agreed to pay the Marathas tribute, gave up Badami, and returned Nargund, Kittur and Adoni to their former holders, but kept most of his other conquests. Three years later the Marathas and the Nizam joined the British against him.
: Une guerre entre le Mysore de Tipu Sultan et l’État marathe, allié au nizam de Hyderabad, pour les terres situées entre la Krishna et la Tungabhadra que Haidar Ali avait prises aux Marathes dans les années 1770. Elle commença en 1785, lorsque Tipu assiégea et prit Nargund, dont le chef, tributaire du Mysore depuis la conquête de Haidar en 1778, avait refusé un tribut plus élevé et s’était tourné vers les Marathes, puis occupa Kittur. Nana Phadnavis, le principal ministre de Pune (Poona), s’allia au nizam, et en mai 1786 leurs armées prirent d’assaut Badami. Tipu riposta en prenant la forteresse d’Adoni, qui appartenait au nizam, après le retrait de l’armée de secours alliée, puis en franchissant la Tungabhadra en crue et en battant l’armée marathe de Haripant Phadke à Savanur en octobre 1786 ; en janvier 1787, il prit Bahadur Benda. Les deux camps craignaient les Britanniques plus encore que l’un l’autre, et en avril 1787 ils firent la paix à Gajendragad. Tipu accepta de payer un tribut aux Marathes, renonça à Badami et restitua Nargund, Kittur et Adoni à leurs anciens détenteurs, mais conserva la plupart de ses autres conquêtes. Trois ans plus tard, les Marathes et le nizam se joignirent aux Britanniques contre lui.
