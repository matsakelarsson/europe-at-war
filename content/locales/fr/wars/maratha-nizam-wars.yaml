# French translations of the catalogue text (wave 8); step bodies follow later.
Maratha–Nizam wars: Guerres entre les Marathes et les nizams
The wars between the Marathas and the Nizams of Hyderabad, the Mughal viceroys who made the Deccan their own state after 1724. The first Nizam, Asaf Jah I, refused the Marathas’ claim to a share of the Deccan revenue and backed a rival Maratha king; Peshwa Baji Rao I outmanoeuvred him and cornered his army at Palkhed in 1728, forcing him to recognise Shahu and the Maratha claims. In 1737–1738 the Marathas surrounded the Nizam again at Bhopal. After his death in 1748 his sons fought over the succession, and the Marathas under Peshwa Balaji Rao fought Salabat Jang and his French allies in 1751–1752, won land in the treaty of Bhalki and defeated the Nizam’s armies at Sindkhed in 1757 and decisively at Udgir in 1760, which gave them much of the northern Deccan. The two powers fought again later, and were allies as often as enemies.: Les guerres entre les Marathes et les nizams de Hyderabad, ces vice-rois moghols qui firent du Dekkan leur propre État après 1724. Le premier nizam, Asaf Jah Ier, refusa aux Marathes la part des revenus du Dekkan qu’ils revendiquaient et soutint un roi marathe rival ; le peshwa Baji Rao Ier le déjoua par ses manœuvres et accula son armée à Palkhed en 1728, le contraignant à reconnaître Shahu et les prétentions marathes. En 1737–1738, les Marathes encerclèrent de nouveau le nizam à Bhopal. Après sa mort en 1748, ses fils se disputèrent la succession, et les Marathes du peshwa Balaji Rao combattirent Salabat Jang et ses alliés français en 1751–1752, gagnèrent des terres par le traité de Bhalki et battirent les armées du nizam à Sindkhed en 1757, puis de façon décisive à Udgir en 1760, ce qui leur valut une grande partie du nord du Dekkan. Les deux puissances s’affrontèrent encore par la suite, et furent alliées aussi souvent qu’ennemies.
