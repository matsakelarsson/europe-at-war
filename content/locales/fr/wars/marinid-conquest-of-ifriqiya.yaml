# French translations of the catalogue text (wave 12); step bodies follow later.
Marinid conquests of Ifriqiya: Conquêtes mérinides de l’Ifriqiya
Two attempts by the Marinid sultans of Fez to add Hafsid Ifriqiya to their empire and rebuild the unity of the Maghreb that the Almohads had lost. After taking Tlemcen in 1337, Abu al-Hasan used a succession dispute among the Hafsids to march east, and in September 1347 he entered Tunis. His attempt to bring the Arab tribes of the steppe under control led to a revolt, and in April 1348 they routed his army near Kairouan; his son Abu Inan seized the throne in Fez, the Zayyanids took back Tlemcen, and Abu al-Hasan, shipwrecked off Bougie on his way home, died a fugitive in 1351. Abu Inan, having retaken Tlemcen, took Bougie in 1353 and Tunis in August 1357, but his troops forced him to turn back, and he was murdered in Fez in January 1358. The Hafsids recovered, and no Moroccan ruler tried again.: Deux tentatives des sultans mérinides de Fès pour ajouter l’Ifriqiya hafside à leur empire et reconstituer l’unité du Maghreb que les Almohades avaient perdue. Après avoir pris Tlemcen en 1337, Abu al-Hasan profita d’une querelle de succession chez les Hafsides pour marcher vers l’est, et en septembre 1347 il entra dans Tunis. Sa tentative de soumettre les tribus arabes de la steppe provoqua une révolte, et en avril 1348 celles-ci mirent son armée en déroute près de Kairouan ; son fils Abu Inan s’empara du trône à Fès, les Zianides reprirent Tlemcen, et Abu al-Hasan, qui fit naufrage au large de Bougie sur le chemin du retour, mourut en fugitif en 1351. Abu Inan, après avoir repris Tlemcen, prit Bougie en 1353 et Tunis en août 1357, mais ses troupes le contraignirent à faire demi-tour, et il fut assassiné à Fès en janvier 1358. Les Hafsides se rétablirent, et aucun souverain marocain ne renouvela la tentative.
