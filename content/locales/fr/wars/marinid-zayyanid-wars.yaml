# French translations of the catalogue text (wave 12); step bodies follow later.
Marinid–Zayyanid wars: Guerres entre Mérinides et Zianides
"Three centuries of intermittent war between the two Zenata Berber dynasties that rose from the ruins of the Almohad Caliphate: the Marinids of Fez and the Zayyanids (Abdalwadids) of Tlemcen. Yaghmurasen ibn Zayyan, who took Tlemcen in 1236, fought the Marinids over Sijilmasa and eastern Morocco and lost Oujda in 1272. The Marinid sultan Abu Yaqub Yusuf besieged Tlemcen for eight years (1299–1307) from a new city he built beside it, al-Mansura, until he was murdered in his camp. Abu al-Hasan took Tlemcen in May 1337 after a two-year siege and went on to Tunis, and his son Abu Inan took it again in 1352, but each time the Zayyanids returned, under Abu Hammu II from 1359. From about 1389 Tlemcen accepted Marinid and then Hafsid overlordship. In the 16th century the struggle passed to new powers: Spain held Oran from 1509, the Ottoman rulers of Algiers and the Saadian sultans of Morocco fought over Tlemcen, and in 1551–1554 the Ottomans took it and ended the Zayyanid kingdom.": "Trois siècles de guerre intermittente entre les deux dynasties berbères zénètes issues des ruines du califat almohade : les Mérinides de Fès et les Zianides (Abdalwadides) de Tlemcen. Yaghmurasen ibn Zayyan, qui prit Tlemcen en 1236, combattit les Mérinides pour Sijilmassa et l’est du Maroc et perdit Oujda en 1272. Le sultan mérinide Abu Yaqub Yusuf assiégea Tlemcen pendant huit ans (1299–1307) depuis une ville nouvelle qu’il avait bâtie à côté, al-Mansura, jusqu’à ce qu’il soit assassiné dans son camp. Abu al-Hasan prit Tlemcen en mai 1337 après un siège de deux ans et poursuivit jusqu’à Tunis, et son fils Abu Inan la reprit en 1352, mais chaque fois les Zianides revinrent, sous Abu Hammu II à partir de 1359. À partir de 1389 environ, Tlemcen accepta la suzeraineté mérinide, puis hafside. Au XVIe siècle, la lutte passa à de nouvelles puissances : l’Espagne tint Oran à partir de 1509, les souverains ottomans d’Alger et les sultans saadiens du Maroc se disputèrent Tlemcen, et en 1551–1554 les Ottomans la prirent et mirent fin au royaume zianide."
