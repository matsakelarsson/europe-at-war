# French translations of the catalogue text (wave 12); step bodies follow later.
Massina jihad: Djihad du Macina
? The holy war by which the Fulbe scholar Seku Amadu (Ahmadu Lobbo) founded the Caliphate of Hamdullahi, also called the Dina or the Massina Empire, in the inland delta of the Niger. Massina’s Fulbe chiefs, the ardos, were tributaries of the Bamana kings of Ségou, and Seku Amadu, a preacher from a minor scholarly family, accused them of tolerating unbelief and of oppressing their people. When one of his followers killed the son of the leading ardo in 1816 or 1817, the ardos and Ségou sent an army against his small community at Noukouma, where on 21 March 1818 it was routed. Seku Amadu’s following grew quickly; Djenné opened its gates, the Fulbe of Massina rose against their ardos, and about 1820 he founded a new capital, Hamdullahi (“praise be to God”). The Dina was governed by a council of forty scholars under strict Maliki law, settled the pastoral Fulbe and fixed the rules for herders and farmers in the delta that are still remembered. In 1826 Timbuktu, where the descendants of the Moroccan conquerors, the Arma, still held a nominal authority under Tuareg protection, accepted Hamdullahi’s overlordship, and the Dina fought the Tuareg and the Arma for control of the city until 1846. Its third ruler, Amadu III, refused to join Umar Tall against Ségou and sent his army to help it; in May 1862 Umar defeated the Massina army at Cayawal, took Hamdullahi and had Amadu III executed. The Massina rising against Umar that followed is part of the story of Umar Tall’s jihad.
: La guerre sainte par laquelle le lettré peul Sékou Amadou (Ahmadou Lobbo) fonda le califat de Hamdallahi, appelé aussi la Dina ou empire du Macina, dans le delta intérieur du Niger. Les chefs peuls du Macina, les ardos, étaient tributaires des rois bambara de Ségou, et Sékou Amadou, prédicateur issu d’une modeste famille de lettrés, les accusait de tolérer l’incroyance et d’opprimer leur peuple. Lorsqu’un de ses disciples tua le fils du principal ardo en 1816 ou 1817, les ardos et Ségou envoyèrent une armée contre sa petite communauté de Noukouma, où, le 21 mars 1818, cette armée fut mise en déroute. Les partisans de Sékou Amadou se multiplièrent rapidement ; Djenné lui ouvrit ses portes, les Peuls du Macina se soulevèrent contre leurs ardos et, vers 1820, il fonda une nouvelle capitale, Hamdallahi (« louange à Dieu »). La Dina était gouvernée par un conseil de quarante lettrés selon un droit malikite strict ; elle sédentarisa les Peuls pasteurs et fixa pour les éleveurs et les cultivateurs du delta des règles dont on se souvient encore. En 1826, Tombouctou, où les descendants des conquérants marocains, les Arma, conservaient une autorité nominale sous la protection des Touareg, reconnut la suzeraineté de Hamdallahi, et la Dina disputa le contrôle de la ville aux Touareg et aux Arma jusqu’en 1846. Son troisième souverain, Amadou III, refusa de se joindre à Oumar Tall contre Ségou et envoya son armée au secours de cette dernière ; en mai 1862, Oumar vainquit l’armée du Macina à Cayawal, prit Hamdallahi et fit exécuter Amadou III. Le soulèvement du Macina contre Oumar qui s’ensuivit relève de l’histoire du djihad d’Oumar Tall.
