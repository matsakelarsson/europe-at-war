# French translations of the catalogue text (wave 11); step bodies follow later.
Mat Salleh rebellion: Rébellion de Mat Salleh
? A rebellion in North Borneo (today’s Sabah) against the British North Borneo Chartered Company, led by Mat Salleh (Datu Muhammad Salleh), a chief of Suluk and Bajau descent from the Sugut River. The Company’s new taxes on rice, boats and trade passes, and its rules that took authority from local chiefs, bore hard on the coastal and river peoples, and Mat Salleh kept collecting the tolls on the Sugut himself. In 1894 he was suspected of the killing of two Iban traders on the Sugut and refused arrest. In August 1895 he took a petition against the taxes to Sandakan and was refused a hearing; on 29 August Company men tried to arrest him on Jambongan Island, and when he escaped they burned his village. He built forts in the interior, which the Company took one after another without catching him, and gathered Bajau, Suluk and Dusun (Kadazan) followers. On 9 July 1897 his men raided the Company station on Gaya Island, burned it and carried off its treasury and a clerk as hostage; in November they burned the residency at Ambong. Company troops were beaten back at his fort at Ranau on 13 December 1897 and took it on 9 January 1898, after he had moved to Tambunan. In April 1898 the Company’s managing director, William Clarke Cowie, met him and agreed that he could settle in Tambunan and run the district, but the written terms did not match what Mat Salleh understood, and when the Company began to set up its own post in Tambunan, fighting resumed in 1899. A Company force reached Tambunan at the end of December 1899, diverted the river that supplied his fort with water and shelled it for four days; Mat Salleh was killed on 31 January 1900 (some accounts say 1 February). About 1,000 of his followers and people of the nearby villages are reported killed in the campaign. Some of his followers fought on until about 1903–1905. He is remembered in Malaysia as a fighter against colonial rule, and a memorial stands at the site of his fort in Tambunan.
: Une rébellion au Bornéo du Nord (l’actuel Sabah) contre la Compagnie à charte britannique du Bornéo du Nord, menée par Mat Salleh (Datu Muhammad Salleh), un chef d’ascendance suluk et bajau originaire de la rivière Sugut. Les nouveaux impôts de la Compagnie sur le riz, les bateaux et les laissez-passer commerciaux, et ses règlements qui retiraient leur autorité aux chefs locaux, pesaient lourdement sur les peuples des côtes et des rivières, et Mat Salleh continuait de percevoir lui-même les péages sur la Sugut. En 1894, il fut soupçonné du meurtre de deux commerçants iban sur la Sugut et refusa de se laisser arrêter. En août 1895, il porta à Sandakan une pétition contre les impôts et se vit refuser une audience ; le 29 août, des hommes de la Compagnie tentèrent de l’arrêter sur l’île de Jambongan et, quand il s’échappa, incendièrent son village. Il construisit des forts dans l’intérieur, que la Compagnie prit l’un après l’autre sans parvenir à le capturer, et rassembla des partisans bajau, suluk et dusun (kadazan). Le 9 juillet 1897, ses hommes attaquèrent le poste de la Compagnie sur l’île de Gaya, l’incendièrent et emportèrent son trésor ainsi qu’un employé pris en otage ; en novembre, ils incendièrent la résidence d’Ambong. Les troupes de la Compagnie furent repoussées devant son fort de Ranau le 13 décembre 1897 et le prirent le 9 janvier 1898, après qu’il se fut replié sur Tambunan. En avril 1898, le directeur général de la Compagnie, William Clarke Cowie, le rencontra et convint qu’il pourrait s’établir à Tambunan et administrer le district, mais les termes écrits ne correspondaient pas à ce que Mat Salleh avait compris et, lorsque la Compagnie commença à installer son propre poste à Tambunan, les combats reprirent en 1899. Une force de la Compagnie atteignit Tambunan à la fin de décembre 1899, détourna la rivière qui alimentait son fort en eau et le bombarda pendant quatre jours ; Mat Salleh fut tué le 31 janvier 1900 (le 1er février selon certains récits). Environ 1 000 de ses partisans et habitants des villages voisins auraient été tués au cours de la campagne. Certains de ses partisans poursuivirent la lutte jusque vers 1903–1905. Il est resté dans les mémoires en Malaisie comme un combattant contre la domination coloniale, et un mémorial se dresse sur le site de son fort à Tambunan.
