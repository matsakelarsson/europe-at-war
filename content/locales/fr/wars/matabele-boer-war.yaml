# French translations of the catalogue text (wave 13); step bodies follow later.
Matabele–Boer war: Guerre entre Matabélés et Boers
? "The war between the Ndebele kingdom of Mzilikazi and the Voortrekkers, the emigrant Boers of the Great Trek, which ended Ndebele rule south of the Limpopo. In 1836 trekker parties crossed the Vaal into lands the Ndebele claimed, and in August Ndebele regiments attacked families camped near the river, among them most of the Liebenberg party, and carried off three children. On 16 October 1836 an Ndebele army of several thousand, sent by Mzilikazi under his general Mkalipi, attacked the laager of Hendrik Potgieter and Sarel Cilliers at Vegkop, near present-day Heilbron: about 40 men behind some 50 wagons beat off the assault, losing two killed against several hundred Ndebele dead, but the Ndebele drove off nearly all their livestock, about 5,000 cattle and 50,000 sheep and goats, and the laager survived on oxen sent by the Rolong chief Moroka of Thaba Nchu. On 17 January 1837 Potgieter and Gerrit Maritz, with about 100 Boers, Griqua and some 60 Rolong, surprised and burned Mosega in the Marico valley, killing several hundred people and taking 6,000 to 7,000 cattle; the American missionaries there left with the commando. A Zulu army sent by Dingane attacked the Ndebele in mid-1837, and in November 1837 Potgieter and Piet Uys, with several hundred men, fought a nine-day running campaign against Mzilikazi around his stronghold of eGabeni (Kapain) on the Marico. Early in 1838 Mzilikazi led his people north across the Limpopo; they settled in what is now western Zimbabwe, where he founded a new kingdom. Potgieter claimed the lands between the Vaal and the Limpopo by right of conquest, the start of the trekker settlements that became the South African Republic."
: "La guerre entre le royaume ndébélé de Mzilikazi et les Voortrekkers, les Boers émigrants du Grand Trek, qui mit fin à la domination ndébélé au sud du Limpopo. En 1836, des groupes de trekkers franchirent le Vaal pour entrer sur des terres que revendiquaient les Ndébélés et, en août, des régiments ndébélés attaquèrent des familles campées près du fleuve, dont la plus grande partie du groupe Liebenberg, et enlevèrent trois enfants. Le 16 octobre 1836, une armée ndébélé de plusieurs milliers d’hommes, envoyée par Mzilikazi sous les ordres de son général Mkalipi, attaqua le laager de Hendrik Potgieter et Sarel Cilliers à Vegkop, près de l’actuelle Heilbron : environ 40 hommes retranchés derrière quelque 50 chariots repoussèrent l’assaut, perdant deux tués contre plusieurs centaines de morts chez les Ndébélés, mais ceux-ci emmenèrent presque tout leur bétail, environ 5 000 bovins et 50 000 moutons et chèvres, et le laager ne survécut que grâce aux bœufs envoyés par Moroka, chef des Rolong de Thaba Nchu. Le 17 janvier 1837, Potgieter et Gerrit Maritz, avec environ 100 Boers, des Griqua et quelque 60 Rolong, surprirent et incendièrent Mosega, dans la vallée du Marico, tuant plusieurs centaines de personnes et s’emparant de 6 000 à 7 000 têtes de bétail ; les missionnaires américains qui s’y trouvaient partirent avec le commando. Une armée zouloue envoyée par Dingane attaqua les Ndébélés au milieu de 1837 et, en novembre 1837, Potgieter et Piet Uys, avec plusieurs centaines d’hommes, menèrent pendant neuf jours une campagne de poursuite contre Mzilikazi autour de sa place forte d’eGabeni (Kapain), sur le Marico. Au début de 1838, Mzilikazi conduisit son peuple vers le nord, au-delà du Limpopo ; ils s’établirent dans l’actuel ouest du Zimbabwe, où il fonda un nouveau royaume. Potgieter revendiqua par droit de conquête les terres situées entre le Vaal et le Limpopo, point de départ des établissements de trekkers qui devinrent la République sud-africaine."
