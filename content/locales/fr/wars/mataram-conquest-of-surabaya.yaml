# French translations of the catalogue text (wave 11); step bodies follow later.
Mataram’s conquest of Surabaya and the east: Conquête de Surabaya et de l’Est par Mataram
? The wars in which Sultan Agung of Mataram, the inland kingdom of Central Java, brought the trading cities and principalities of East Java and Madura under his rule. Surabaya, the richest port of the north coast, led a league of the eastern states and had resisted Agung’s father and grandfather. In 1614, a year after his accession, Agung raided the lands of Surabaya and Malang and the eastern end of Java; in 1615 he took Wirasaba (near today’s Mojokerto), and in 1616 an army sent by Surabaya and its allies against Mataram was crushed at Siwalan near Pajang. Lasem fell in 1616, Pasuruan in 1617 and Tuban, one of the oldest ports of Java, in 1619; Pajang, which rose against Mataram in 1617, was destroyed. To isolate Surabaya, Agung took its ally Sukadana in south-western Borneo in 1622 and in 1624 conquered Madura after hard fighting, deporting its princes to his court and installing one of them, Prince Prasena (Cakraningrat I), as his vassal. Surabaya itself was besieged for years; its water supply was cut by damming the Brantas river, and the starving city surrendered in 1625. Its ruler’s son, Pangeran Pekik, was taken to the Mataram court and married to Agung’s sister. Mataram now ruled all of Central and East Java except Banten, the new Dutch base at Batavia and the Balinese-ruled east, and Agung took the title of susuhunan; his attempts on Batavia followed in 1628–1629. The conquests ruined the old north-coast ports, and the grievances of Madura and Surabaya resurfaced fifty years later in the Trunajaya rebellion.
: Les guerres par lesquelles le sultan Agung de Mataram, royaume de l’intérieur de Java central, soumit les cités marchandes et les principautés de Java oriental et de Madura. Surabaya, le port le plus riche de la côte nord, dirigeait une ligue des États de l’Est et avait résisté au père et au grand-père d’Agung. En 1614, un an après son avènement, Agung lança des raids sur les terres de Surabaya et de Malang et sur l’extrémité orientale de Java ; en 1615, il prit Wirasaba (près de l’actuelle Mojokerto), et en 1616 une armée envoyée contre Mataram par Surabaya et ses alliés fut écrasée à Siwalan, près de Pajang. Lasem tomba en 1616, Pasuruan en 1617 et Tuban, l’un des plus anciens ports de Java, en 1619 ; Pajang, qui s’était soulevée contre Mataram en 1617, fut détruite. Pour isoler Surabaya, Agung prit en 1622 son alliée Sukadana, dans le sud-ouest de Bornéo, et en 1624 conquit Madura après de durs combats, déportant ses princes à sa cour et installant l’un d’eux, le prince Prasena (Cakraningrat Ier), comme vassal. Surabaya elle-même fut assiégée pendant des années ; son approvisionnement en eau fut coupé par un barrage sur le Brantas, et la ville affamée se rendit en 1625. Le fils de son souverain, Pangeran Pekik, fut emmené à la cour de Mataram et marié à la sœur d’Agung. Mataram dominait désormais tout Java central et oriental, à l’exception de Banten, de la nouvelle base néerlandaise de Batavia et de l’Est sous domination balinaise, et Agung prit le titre de susuhunan ; ses tentatives contre Batavia suivirent en 1628–1629. Les conquêtes ruinèrent les anciens ports de la côte nord, et les griefs de Madura et de Surabaya resurgirent cinquante ans plus tard lors de la rébellion de Trunajaya.
