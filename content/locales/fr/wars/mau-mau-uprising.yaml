# French translations of the catalogue text (wave 13); step bodies follow later.
Mau Mau war: Guerre des Mau Mau
? The armed rising of the Kenya Land and Freedom Army, known as Mau Mau, against British colonial rule and the African chiefs and “loyalists” who supported it, and the State of Emergency the British government imposed to defeat it. The rising grew out of the Kikuyu, Embu and Meru peoples’ loss of land to European settlers in the “White Highlands”, the eviction of squatters from settler farms and the failure of peaceful politics; from the late 1940s hundreds of thousands took oaths of unity. After the killing of Senior Chief Waruhiu, Governor Evelyn Baring declared an Emergency on 20 October 1952 and had Jomo Kenyatta and other leaders arrested. Fighters went into the forests of the Aberdares and Mount Kenya under leaders such as Dedan Kimathi and Waruhiu Itote (“General China”). Mau Mau killed loyalists and their families, most notoriously at Lari in March 1953, and 32 European settlers. British and colonial forces, a Kikuyu Home Guard and RAF bombers fought the forest armies; Operation Anvil emptied Nairobi of Kikuyu in 1954, tens of thousands of suspects were held without trial in a system of detention camps known as the Pipeline, where torture was widespread, and more than a million people were forced into fortified villages. Kimathi’s capture in October 1956 ended the forest war, and 1,090 Kenyans were hanged. Official figures counted at least 11,000 Mau Mau killed; estimates of all deaths caused by the Emergency range from about 25,000 to 50,000, and some historians argue for far more. The Emergency ended on 12 January 1960, the year Britain accepted African majority rule; Kenya became independent in 1963. In 2013 the British government paid compensation to 5,228 Kenyans who had been tortured and abused.
: Le soulèvement armé de la Kenya Land and Freedom Army (Armée de la terre et de la liberté du Kenya), connue sous le nom de Mau Mau, contre la domination coloniale britannique et contre les chefs africains et les « loyalistes » qui la soutenaient, ainsi que l’état d’urgence que le gouvernement britannique imposa pour le vaincre. Le soulèvement naquit de la perte de terres subie par les peuples kikuyu, embu et meru au profit des colons européens des « Hautes Terres blanches », de l’expulsion des squatters des fermes de colons et de l’échec de l’action politique pacifique ; à partir de la fin des années 1940, des centaines de milliers de personnes prêtèrent des serments d’unité. Après l’assassinat du chef supérieur Waruhiu, le gouverneur Evelyn Baring proclama l’état d’urgence le 20 octobre 1952 et fit arrêter Jomo Kenyatta et d’autres dirigeants. Des combattants gagnèrent les forêts des Aberdares et du mont Kenya sous la conduite de chefs comme Dedan Kimathi et Waruhiu Itote (« général China »). Les Mau Mau tuèrent des loyalistes et leurs familles, en particulier à Lari, en mars 1953, l’épisode le plus tristement célèbre, ainsi que 32 colons européens. Les forces britanniques et coloniales, une garde territoriale kikuyu (Home Guard) et des bombardiers de la RAF combattirent les armées de la forêt ; l’opération Anvil vida Nairobi de ses Kikuyu en 1954, des dizaines de milliers de suspects furent détenus sans procès dans un réseau de camps de détention appelé le Pipeline, où la torture était répandue, et plus d’un million de personnes furent regroupées de force dans des villages fortifiés. La capture de Kimathi en octobre 1956 mit fin à la guerre de la forêt, et 1 090 Kényans furent pendus. Les chiffres officiels recensèrent au moins 11 000 Mau Mau tués ; les estimations du nombre total de morts dus à l’état d’urgence vont d’environ 25 000 à 50 000, et certains historiens avancent des chiffres bien plus élevés. L’état d’urgence prit fin le 12 janvier 1960, l’année où la Grande-Bretagne accepta le principe d’un gouvernement de la majorité africaine ; le Kenya devint indépendant en 1963. En 2013, le gouvernement britannique indemnisa 5 228 Kényans qui avaient été torturés et maltraités.
