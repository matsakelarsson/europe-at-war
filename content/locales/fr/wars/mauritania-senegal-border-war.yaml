# French translations of the catalogue text (wave 12); step bodies follow later.
Mauritania–Senegal Border War: Guerre frontalière mauritano-sénégalaise
? A conflict between Mauritania and Senegal that began with a quarrel over grazing land on the Senegal River in April 1989 and grew into riots, killings and mass expulsions in both countries and two years of clashes along the river. After Mauritanian border guards killed two Senegalese farmers at Diawara on 9 April 1989, crowds in Senegal attacked the shops of Mauritanian traders, and in Nouakchott and Nouadhibou mobs and security forces killed Senegalese residents; hundreds died in the last weeks of April, by most estimates some 200 Senegalese in Mauritania and dozens of Mauritanians in Senegal. With help from France, Spain, Algeria and Morocco about 250,000 people were taken home by air and sea. Mauritania also expelled tens of thousands of its own Black citizens, most of them Halpulaar (Fulani) of the river valley, into Senegal and Mali. The two countries broke off relations in August 1989, and from October their armies exchanged fire across the river, Mauritania with Iraqi arms and Senegal backing the African Liberation Forces of Mauritania (FLAM). In 1990–1991 the Mauritanian government arrested some 3,000 Black soldiers and officials, of whom more than 500 were killed in detention. A peace treaty was signed on 18 July 1991 and the border reopened in May 1992. Between 2008 and 2012 some 24,000 refugees returned to Mauritania with UNHCR’s help; about 14,000 chose to stay in Senegal.
: Un conflit entre la Mauritanie et le Sénégal qui commença par une querelle au sujet de pâturages au bord du fleuve Sénégal en avril 1989 et dégénéra en émeutes, en tueries et en expulsions massives dans les deux pays, puis en deux années d’affrontements le long du fleuve. Après que des gardes-frontières mauritaniens eurent tué deux paysans sénégalais à Diawara le 9 avril 1989, des foules s’en prirent au Sénégal aux boutiques des commerçants mauritaniens, et à Nouakchott et à Nouadhibou des émeutiers et les forces de sécurité tuèrent des résidents sénégalais ; des centaines de personnes moururent au cours des dernières semaines d’avril, selon la plupart des estimations quelque 200 Sénégalais en Mauritanie et plusieurs dizaines de Mauritaniens au Sénégal. Avec l’aide de la France, de l’Espagne, de l’Algérie et du Maroc, environ 250 000 personnes furent rapatriées par air et par mer. La Mauritanie expulsa aussi vers le Sénégal et le Mali des dizaines de milliers de ses propres citoyens noirs, pour la plupart des Halpulaar (Peuls) de la vallée du fleuve. Les deux pays rompirent leurs relations en août 1989 et, à partir d’octobre, leurs armées échangèrent des tirs de part et d’autre du fleuve, la Mauritanie disposant d’armes irakiennes et le Sénégal soutenant les Forces de libération africaines de Mauritanie (FLAM). En 1990–1991, le gouvernement mauritanien arrêta quelque 3 000 militaires et fonctionnaires noirs, dont plus de 500 furent tués en détention. Un traité de paix fut signé le 18 juillet 1991 et la frontière rouvrit en mai 1992. Entre 2008 et 2012, quelque 24 000 réfugiés rentrèrent en Mauritanie avec l’aide du HCR ; environ 14 000 choisirent de rester au Sénégal.
