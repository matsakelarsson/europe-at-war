# French translations of the catalogue text (wave 7); step bodies follow later.
Revolt of Mazyar: Révolte de Mazyar
The revolt of Mazyar ibn Qarin, the Qarinvandid prince who ruled the mountains of Tabaristan, south of the Caspian Sea, under the Abbasid caliphs. Abdallah ibn Tahir, the Tahirid governor of Khorasan, claimed Tabaristan and its taxes; Mazyar refused to pay and rose in 839, relying on the Zoroastrian peasantry and imprisoning those he distrusted. Abdallah and the caliph al-Mu’tasim sent five armies into Tabaristan from different directions. The Bavandid prince Qarin went over to the Abbasids, the people of Sari rose against Mazyar, and his brother Quhyar captured him and handed him over. Mazyar was taken to Samarra and executed, and his body was hung beside Babak’s. Tabaristan passed under Tahirid rule until the Zaydi revolt of 864, and al-Afshin, the conqueror of Babak, was accused of having encouraged Mazyar and died in prison in 841.: La révolte de Mazyar ibn Qarin, le prince qarinvandide qui gouvernait les montagnes du Tabaristan, au sud de la mer Caspienne, sous l’autorité des califes abbassides. Abdallah ibn Tahir, le gouverneur tahiride du Khorassan, revendiquait le Tabaristan et ses impôts ; Mazyar refusa de payer et se souleva en 839, en s’appuyant sur la paysannerie zoroastrienne et en emprisonnant ceux dont il se méfiait. Abdallah et le calife al-Mu’tasim envoyèrent cinq armées dans le Tabaristan par différents côtés. Le prince bavandide Qarin passa aux Abbassides, les habitants de Sari se soulevèrent contre Mazyar, et son frère Quhyar le captura et le livra. Mazyar fut conduit à Samarra et exécuté, et son corps fut pendu à côté de celui de Babak. Le Tabaristan passa sous domination tahiride jusqu’à la révolte zaydite de 864, et al-Afshin, le vainqueur de Babak, accusé d’avoir encouragé Mazyar, mourut en prison en 841.
