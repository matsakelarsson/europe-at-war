# French translations of the catalogue text (wave 10); step bodies follow later.
Meitoku Rebellion: Rébellion de Meitoku
? A rising of the Yamana clan against the Ashikaga shogun Yoshimitsu, fought out in a single day in Kyoto. The Yamana held the military governorships (shugo) of eleven of Japan’s sixty-six provinces and were called “the lords of one-sixth” (rokubun-no-ichi dono), but after the death of their head Yamana Tokiyoshi in 1389 the branches of the family fell out. Yoshimitsu, who was cutting the great governors down to size, first backed Yamana Ujikiyo and Yamana Mitsuyuki against their kinsmen Tokihiro and Ujiyuki, then received the latter back into favour and in late 1391 took Izumo from Mitsuyuki for seizing an estate of the retired emperor. Mitsuyuki and Ujikiyo raised their men, obtained a banner from the Southern Court, and marched on the capital from Tanba and from Sakai. On the last day of the twelfth month of Meitoku 2 (January 1392) they attacked Kyoto and were beaten at Uchino, the empty ground of the old imperial palace, and on Ōmiya avenue by the shogun’s own guards and the troops of Hosokawa Yoriyuki, Ōuchi Yoshihiro, the Hatakeyama, the Isshiki and the Kyōgoku. Ujikiyo was killed. The Yamana were left with three provinces, Tajima, Inaba and Hōki; Izumi and Kii went to Ōuchi Yoshihiro and the rest to other supporters of the shogun. Mitsuyuki escaped, but was caught in 1395 and executed. The victory strengthened Yoshimitsu, who brought the Southern Court to end the schism later in 1392.
: Un soulèvement du clan Yamana contre le shogun Ashikaga Yoshimitsu, livré en une seule journée à Kyoto. Les Yamana détenaient les gouvernorats militaires (shugo) de onze des soixante-six provinces du Japon et étaient surnommés « les seigneurs d’un sixième » (rokubun-no-ichi dono), mais après la mort de leur chef, Yamana Tokiyoshi, en 1389, les branches de la famille se divisèrent. Yoshimitsu, qui s’employait à rabaisser les grands gouverneurs, soutint d’abord Yamana Ujikiyo et Yamana Mitsuyuki contre leurs parents Tokihiro et Ujiyuki, puis rendit sa faveur à ces derniers et, à la fin de 1391, retira l’Izumo à Mitsuyuki pour s’être emparé d’un domaine de l’empereur retiré. Mitsuyuki et Ujikiyo levèrent leurs hommes, obtinrent une bannière de la cour du Sud et marchèrent sur la capitale depuis le Tanba et depuis Sakai. Le dernier jour du douzième mois de Meitoku 2 (janvier 1392), ils attaquèrent Kyoto et furent battus à Uchino, le terrain vide de l’ancien palais impérial, et sur l’avenue Ōmiya par la garde personnelle du shogun et les troupes de Hosokawa Yoriyuki, d’Ōuchi Yoshihiro, des Hatakeyama, des Isshiki et des Kyōgoku. Ujikiyo fut tué. Il ne resta aux Yamana que trois provinces, le Tajima, l’Inaba et le Hōki ; l’Izumi et le Kii allèrent à Ōuchi Yoshihiro et le reste à d’autres partisans du shogun. Mitsuyuki s’échappa, mais fut pris en 1395 et exécuté. La victoire renforça Yoshimitsu, qui amena la cour du Sud à mettre fin au schisme plus tard en 1392.
