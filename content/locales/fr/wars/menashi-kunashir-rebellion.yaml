# French translations of the catalogue text (wave 10); step bodies follow later.
Menashi–Kunashir rebellion: Rébellion de Menashi–Kounachir
? "An Ainu rising on Kunashir and in the Menashi district on the facing coast of eastern Ezo (Hokkaido). By the 18th century the Matsumae domain let Japanese merchants run its trading posts in return for a fee, and in 1788 the merchant Hidaya Kyūbei began fishing for salmon and trout in the Menashi–Kunashir area with Ainu labour. Ainu workers were driven so hard that they could not lay up food for the winter, supervisors took Ainu wives as mistresses, and rumours spread that Ainu had been poisoned. In the fifth month of 1789 (May–June), while the Kunashir chief Tsukinoe was away hunting sea otters on Urup, young Ainu killed 71 Japanese, 22 on Kunashir and the rest in Menashi and on ships, all of them Hidaya’s employees except one Matsumae soldier. The daimyo Matsumae Michihiro sent about 260 men with firearms, who reached Nokkamappu near Nemuro on 8 July 1789. There was no battle: Tsukinoe, Ikotoi of Akkeshi and Shonko of Nokkamappu persuaded the rebels to lay down their arms, 314 Ainu came in, and 37 men named as leaders were put to death at Nokkamappu. The Matsumae had portraits painted of twelve chiefs who had helped them (the Ishūretsuzō of Kakizaki Hakyō). It was the last large armed rising of the Ainu. Concern that Russian traders were reaching the Ainu of the Kurils was one of the reasons the shogunate took eastern Ezo under its own rule in 1799."
: "Un soulèvement aïnou sur Kounachir et dans le district de Menashi, sur la côte qui lui fait face, dans l’est d’Ezo (Hokkaido). Dès le XVIIIe siècle, le domaine de Matsumae laissait des marchands japonais exploiter ses comptoirs moyennant redevance et, en 1788, le marchand Hidaya Kyūbei commença à pêcher le saumon et la truite dans la région de Menashi–Kounachir avec une main-d’œuvre aïnoue. Les travailleurs aïnous étaient si durement exploités qu’ils ne pouvaient pas constituer de réserves de nourriture pour l’hiver, les contremaîtres prenaient des épouses aïnoues pour maîtresses, et le bruit courut que des Aïnous avaient été empoisonnés. Au cinquième mois de 1789 (mai–juin), alors que le chef de Kounachir, Tsukinoe, était parti chasser la loutre de mer sur Ouroup, de jeunes Aïnous tuèrent 71 Japonais, 22 sur Kounachir et les autres à Menashi et sur des navires, tous employés de Hidaya à l’exception d’un soldat de Matsumae. Le daimyo Matsumae Michihiro envoya environ 260 hommes armés de fusils, qui atteignirent Nokkamappu, près de Nemuro, le 8 juillet 1789. Il n’y eut pas de bataille : Tsukinoe, Ikotoi d’Akkeshi et Shonko de Nokkamappu persuadèrent les rebelles de déposer les armes, 314 Aïnous se présentèrent, et 37 hommes désignés comme meneurs furent mis à mort à Nokkamappu. Les Matsumae firent peindre les portraits de douze chefs qui les avaient aidés (l’Ishūretsuzō de Kakizaki Hakyō). Ce fut le dernier grand soulèvement armé des Aïnous. La crainte de voir des marchands russes atteindre les Aïnous des Kouriles fut l’une des raisons pour lesquelles le shogunat plaça l’est d’Ezo sous son administration directe en 1799."
