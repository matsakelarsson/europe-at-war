# French translations of the catalogue text (wave 12); step bodies follow later.
Expansion of Shewa and Ethiopia under Menelik II: Expansion du Choa et de l’Éthiopie sous Ménélik II
? The wars by which Menelik, king of Shewa from 1865 and emperor of Ethiopia from 1889, brought the lands to the south, west and east of the old Christian highlands under his rule, greatly enlarging the empire and giving Ethiopia most of its present borders. With firearms bought through the Red Sea ports and generals such as Ras Gobana Dacche, Ras Darge, Ras Makonnen and Ras Wolde Giyorgis, his armies took or forced the submission of southern Wollo, the Gurage, the Oromo kingdoms of the Gibe and the Leqa states of Wollega (1875–1886), defeated the king of Gojjam at Embabo (1882), conquered the Arsi Oromo after six campaigns (1881–1886) and the emirate of Harar at Chelenqo (1887), and then, through the great famine of 1888–1892, Bale, Sidamo and Wolaita (1891–1894) and, after the victory over Italy at Adwa, Kaffa (1897), Bela Shangul and the borderlands down to Lake Turkana and the Ogaden. Some peoples submitted by agreement and kept their rulers, as Jimma did; others resisted and suffered heavy losses, enslavement and the loss of their land to soldier-settlers under the gebbar system. Ethiopian national history has long presented the expansion as the building, or the reunification, of the modern state; many Oromo and other southern historians describe it as a colonial conquest comparable to the European conquests of the same years.
: Les guerres par lesquelles Ménélik, roi du Choa à partir de 1865 et empereur d’Éthiopie à partir de 1889, soumit à son autorité les terres situées au sud, à l’ouest et à l’est des anciens hauts plateaux chrétiens, agrandissant considérablement l’empire et donnant à l’Éthiopie l’essentiel de ses frontières actuelles. Grâce à des armes à feu achetées par les ports de la mer Rouge et à des généraux tels que le ras Gobana Dacche, le ras Darge, le ras Makonnen et le ras Wolde Giyorgis, ses armées conquirent ou contraignirent à la soumission le sud du Wollo, les Gurage, les royaumes oromo du Gibe et les États leqa du Wollega (1875–1886), battirent le roi du Godjam à Embabo (1882), conquirent les Oromo arsi au terme de six campagnes (1881–1886) et l’émirat de Harar à Chelenqo (1887), puis, en pleine grande famine de 1888–1892, le Bale, le Sidamo et le Wolaita (1891–1894) et, après la victoire sur l’Italie à Adoua, le Kaffa (1897), le Bela Shangul et les confins jusqu’au lac Turkana et à l’Ogaden. Certains peuples se soumirent par accord et conservèrent leurs souverains, comme Jimma ; d’autres résistèrent et subirent de lourdes pertes, la réduction en esclavage et la perte de leurs terres au profit de soldats-colons, dans le cadre du système gebbar. L’histoire nationale éthiopienne a longtemps présenté cette expansion comme la construction, ou la réunification, de l’État moderne ; de nombreux historiens oromo et d’autres peuples du sud la décrivent comme une conquête coloniale comparable aux conquêtes européennes des mêmes années.
