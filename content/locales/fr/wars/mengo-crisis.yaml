# French translations of the catalogue text (wave 13); step bodies follow later.
Mengo crisis (Buganda crisis): Crise de Mengo (crise du Bouganda)
? "The power struggle between Uganda’s prime minister, Milton Obote, and the Kabaka (king) of Buganda, Mutesa II, which ended with the army storming the Kabaka’s palace on Mengo Hill in Kampala in May 1966. At independence in 1962 Buganda kept wide autonomy in a federal constitution, and in 1963 Mutesa became Uganda’s ceremonial president. Relations broke over the “lost counties”, two counties that Buganda had gained from Bunyoro in the colonial period and that voted to return to Bunyoro in a referendum on 4 November 1964, and over a scandal raised in Parliament in February 1966, when Daudi Ochieng accused Colonel Idi Amin, Obote and two ministers of profiting from gold and ivory from the Congo. Obote answered with what amounted to a coup against his own government: on 22 February 1966 he had five ministers arrested at a cabinet meeting, on 24 February he suspended Mutesa as president and took full powers himself, and in April he imposed a new constitution that ended Buganda’s federal status. On 20 May the Buganda parliament, the Lukiiko, demanded that the central government leave Buganda’s soil within ten days. The government issued an emergency decree and sent troops into the kingdom, and on 24 May 1966 troops under Amin attacked the Lubiri palace at Mengo, defended by 120–160 guards with old rifles and a few machine guns. The guards held out until about 2 pm; Mutesa escaped over the wall, hid at Rubaga Cathedral and fled via Burundi to Britain, where he died in 1969. Volunteers carried over 200 bodies to the morgue and soldiers buried others in mass graves; some estimates put the dead at up to 1,000. The 1967 constitution abolished Uganda’s kingdoms, and the army, and Amin within it, gained the weight that let Amin seize power in 1971. The Buganda monarchy was restored in 1993."
: "La lutte de pouvoir entre le Premier ministre de l’Ouganda, Milton Obote, et le kabaka (roi) du Bouganda, Mutesa II, qui s’acheva par l’assaut de l’armée contre le palais du kabaka sur la colline de Mengo, à Kampala, en mai 1966. À l’indépendance, en 1962, le Bouganda conserva une large autonomie dans le cadre d’une constitution fédérale et, en 1963, Mutesa devint président de l’Ouganda, une fonction honorifique. Les relations se rompirent à propos des « comtés perdus », deux comtés que le Bouganda avait obtenus aux dépens du Bounyoro pendant la période coloniale et qui votèrent leur retour au Bounyoro lors d’un référendum le 4 novembre 1964, et à propos d’un scandale soulevé au Parlement en février 1966, lorsque Daudi Ochieng accusa le colonel Idi Amin, Obote et deux ministres d’avoir tiré profit d’or et d’ivoire venus du Congo. Obote répondit par ce qui équivalait à un coup d’État contre son propre gouvernement : le 22 février 1966, il fit arrêter cinq ministres en plein conseil des ministres, le 24 février, il suspendit Mutesa de ses fonctions de président et s’arrogea les pleins pouvoirs et, en avril, il imposa une nouvelle constitution qui mit fin au statut fédéral du Bouganda. Le 20 mai, le parlement du Bouganda, le Lukiiko, exigea que le gouvernement central quitte le sol du Bouganda dans un délai de dix jours. Le gouvernement promulgua un décret d’urgence et envoya des troupes dans le royaume et, le 24 mai 1966, des troupes commandées par Amin attaquèrent le palais du Lubiri à Mengo, défendu par 120 à 160 gardes munis de vieux fusils et de quelques mitrailleuses. Les gardes tinrent jusque vers 14 heures ; Mutesa s’échappa par-dessus le mur, se cacha à la cathédrale de Rubaga et s’enfuit par le Burundi vers la Grande-Bretagne, où il mourut en 1969. Des volontaires transportèrent plus de 200 corps à la morgue et des soldats en enterrèrent d’autres dans des fosses communes ; selon certaines estimations, il y aurait eu jusqu’à 1 000 morts. La constitution de 1967 abolit les royaumes de l’Ouganda, et l’armée, et Amin en son sein, acquirent le poids qui permit à Amin de s’emparer du pouvoir en 1971. La monarchie du Bouganda fut rétablie en 1993."
