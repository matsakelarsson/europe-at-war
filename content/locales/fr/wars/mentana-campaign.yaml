"Mentana campaign": "Campagne de Mentana"
"Giuseppe Garibaldi’s attempt in autumn 1867 to take Rome, the last remnant of the Papal States, after the French garrison had left under the September Convention of 1864. The Italian government, bound by the convention, had Garibaldi arrested in September and sent to Caprera, but he escaped, and volunteer columns crossed into Papal territory. A rising in Rome on 22 October failed, the brothers Enrico and Giovanni Cairoli were defeated at Villa Glori, and Garibaldi took Monterotondo on 26 October. France sent troops back to Rome, and on 3 November Papal troops and a French brigade armed with the new Chassepot rifle defeated Garibaldi’s volunteers at Mentana. Garibaldi was arrested again on Italian soil, and the French garrison stayed in Rome until 1870.": "Giuseppe Garibaldi tente à l’automne 1867 de prendre Rome, le dernier reste des États pontificaux, après que la garnison française soit partie en vertu de la Convention de septembre 1864. Le gouvernement italien, lié par la convention, a fait arrêter Garibaldi en septembre et envoyé à Caprera, mais il s’est échappé, et des colonnes volontaires ont traversé le territoire papal. Une montée à Rome le 22 octobre échoua, les frères Enrico et Giovanni Cairoli furent défaits à Villa Glori, et Garibaldi prit Monterotondo le 26 octobre. La France renvoya des troupes à Rome, et, le 3 novembre, des troupes papales et une brigade française armée du nouveau fusil Chassepot défont des volontaires Garibaldi ès Mentana. Garibaldi fut de nouveau arrêté sur le sol italien, et la garnison française resta à Rome jusqu’en 1870."
"The French commander, General Pierre de Failly, reported that the Chassepots had “done wonders”, a phrase that angered Italian opinion. A bomb attack by Roman patriots on the Serristori barracks on 22 October killed more than 20 Papal Zouaves; two of the men responsible were executed in 1868.": "Le commandant français, le général Pierre de Failly, rapporte que les Chassepots ont fait des merveilles, une phrase qui a irrité l’opinion italienne. Une attaque à la bombe par des patriotes romains sur la caserne Serristori le 22 octobre a tué plus de 20 Zouaves papales ; deux des hommes responsables ont été exécutés en 1868."
