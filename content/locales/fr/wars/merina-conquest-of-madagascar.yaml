# French translations of the catalogue text (wave 13); step bodies follow later.
Merina conquest of Madagascar: Conquête merina de Madagascar
? "The wars in which the Merina kingdom of the central highlands united Imerina and conquered much of Madagascar. In about 1787 Andrianampoinimerina took power at Ambohimanga, one of four rival Merina kingdoms, and by diplomacy and war reunited Imerina, taking Antananarivo in 1793 and pushing south into the Betsileo country; he paid for firearms by selling captives to French slave traders for Mauritius and Réunion. His son Radama I (1810–1828) made Madagascar an ally of Britain: by the treaty of 23 October 1817 he banned the export of slaves in return for arms, money and military instructors, and Britain recognised him as King of Madagascar. With his new army he took the Betsimisaraka east coast and Toamasina (1817), fought the Sakalava of Menabe (1820–1822), took Mahajanga, the port of the Sakalava kingdom of Boina (1824), and Fort Dauphin in the far south (1825). When he died in 1828 the Merina ruled about two thirds of the island, though the Sakalava and the peoples of the south and west remained unconquered."
: "Les guerres par lesquelles le royaume merina des hautes terres centrales unifia l’Imerina et conquit une grande partie de Madagascar. Vers 1787, Andrianampoinimerina prit le pouvoir à Ambohimanga, l’un des quatre royaumes merina rivaux, et réunifia l’Imerina par la diplomatie et par la guerre, prenant Antananarivo en 1793 et poussant vers le sud en pays betsileo ; il payait ses armes à feu en vendant des captifs à des négriers français à destination de Maurice et de La Réunion. Son fils Radama Ier (1810–1828) fit de Madagascar une alliée de la Grande-Bretagne : par le traité du 23 octobre 1817, il interdit l’exportation d’esclaves en échange d’armes, d’argent et d’instructeurs militaires, et la Grande-Bretagne le reconnut comme roi de Madagascar. Avec sa nouvelle armée, il prit la côte est betsimisaraka et Toamasina (1817), combattit les Sakalava du Menabe (1820–1822), prit Mahajanga, le port du royaume sakalava du Boina (1824), puis Fort-Dauphin, dans l’extrême sud (1825). À sa mort, en 1828, les Merina dominaient environ les deux tiers de l’île, même si les Sakalava et les peuples du sud et de l’ouest n’étaient pas soumis."
