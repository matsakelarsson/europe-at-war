"January 1676 – March 1678": "janvier 1676 – mars 1678"
"De Ruyter, now nearly seventy, brought 18 Dutch warships, too lightly manned after years of war. On 8 January 1676 he fought Abraham Duquesne’s French fleet of 20 ships for eight hours off Stromboli and Alicudi, without result. On 22 April the Dutch and Spanish, under the Spanish admiral de la Cerda, met Duquesne again off Augusta. The Spanish centre hung back, the Dutch van bore the brunt, and de Ruyter was hit in the legs by a cannonball; he died at Syracuse a week later. On 2 June Vivonne caught the battered allied fleet at anchor in the bay of Palermo and sent fireships among it. Several Spanish and Dutch ships blew up, and both Spanish admirals and the Dutch commander, Jan den Haen, were killed.": "Le 8 janvier 1676, il combat la flotte française d’Abraham Duquesne de 20 navires pendant huit heures au large de Stromboli et Alicudi, sans résultat. Le 22 avril, les Hollandais et les Espagnols, sous l’amiral espagnol de la Cerda, rencontrèrent encore Duquesne au large d’Augusta. Le centre espagnol s’accrochait, la fourgonnette hollandaise portait le coup et de Ruyter fut frappé dans les jambes par un boulet de canon ; il mourut à Syracuse une semaine plus tard. Le 2 juin, Vivonne prit la flotte alliée battue à l’ancre dans la baie de Palerme et envoya des bateaux de feu parmi elle. Plusieurs navires espagnols et néerlandais firent exploser, et les deux amirals espagnols et le commandant néerlandais, Jan den Haen, furent tués."
"France now ruled the seas around Sicily, but Louis XIV had never meant to conquer the island. When England and the Dutch Republic allied in January 1678, he decided to pull out. The Duke of La Feuillade arrived in February, supposedly as the new viceroy, and on 13 March 1678 embarked the French troops on the pretext of an attack on Palermo, then told the city that the French were leaving for good. A few hundred leading families sailed with them. The Spanish viceroy returned unopposed, promising an amnesty that was not kept. Messina lost its privileges and its senate, and the Spanish built a citadel to hold it down. The Peace of Nijmegen that summer left Sicily Spanish.": "Lorsque l’Angleterre et la République néerlandaise s’allièrent en janvier 1678, il décida de se retirer. Le duc de La Feuillade arriva en février, supposément comme le nouveau vice-roi, et, le 13 mars 1678, embarqua les troupes françaises sous prétexte d’une attaque contre Palerme, puis dit à la ville que les Français partaient pour de bon. Quelques centaines de grandes familles s’embarquèrent avec elles. Le vice-roi espagnol retourna sans opposition, promettant une amnistie qui n’était pas maintenue. Messine perdit ses privilèges et son sénat, et les Espagnols construisirent une citadelle pour la tenir à terre."
