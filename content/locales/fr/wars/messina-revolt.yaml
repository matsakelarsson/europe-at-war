# Some French text was translated automatically.
"Messina revolt": "Révolte de Messine"
"The rising of the Sicilian port of Messina against Spanish rule in 1674, which drew in France during the Franco-Dutch War. French squadrons broke the Spanish blockade, and the French fleet beat the Spanish and their Dutch allies off Sicily, killing the great Dutch admiral de Ruyter. But Louis XIV saw Sicily as a sideshow, and in March 1678 his troops sailed away, leaving Messina to Spanish reprisals.": "La montée du port sicilien de Messine contre la domination espagnole en 1674, qui a attiré en France pendant la guerre franco-néerlandaise. Des escadrons français ont brisé le blocus espagnol, et la flotte française a battu les Espagnols et leurs alliés hollandais au large de la Sicile, tuant le grand amiral néerlandais de Ruyter. Mais Louis XIV voit la Sicile comme un spectacle parallèle, et en mars 1678 ses troupes s’envolent, laissant Messine aux représailles espagnoles."
"The unrest began in 1672 as a revolt of Messina’s artisans against the patricians who ran the city, which the Spanish authorities had at first encouraged. It turned against Spain in July 1674.": "Les troubles commencèrent en 1672 comme une révolte des artisans de Messine contre les patriciens qui dirigeaient la ville, que les autorités espagnoles avaient d’abord encouragé. Il se retourna contre l’Espagne en juillet 1674."
"The naval war off Sicily belongs to the Franco-Dutch War of 1672–1678, which is told separately; Sicily stayed Spanish at the Peace of Nijmegen.": "La guerre navale au large de la Sicile appartient à la guerre franco-néerlandaise de 1672–1678, qui est racontée séparément ; la Sicile est restée espagnole à la Paix de Nimègue."
