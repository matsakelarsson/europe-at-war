"July 1674 – December 1675": "juillet 1674 – décembre 1675"
"Messina, a city of some 120,000 people, proud of its privileges and run by a few patrician families, had been at odds with the Spanish viceroys of Sicily for years. On 7 July 1674 its trade guilds and patricians joined forces, besieged the Spanish governor in his palace and drove the garrison out of the city and four of its five forts. Spanish troops and galleys closed in by land and sea, and the city appealed to Louis XIV, then at war with Spain and the Dutch Republic. On 27 September a small French squadron under the Chevalier de Valbelle ran past the Spanish galleys into the harbour with provisions for about five weeks and helped take the last fort, at the harbour mouth.": "Messine, une ville d’environ 120.000 personnes, fière de ses privilèges et dirigée par quelques familles patriciennes, était en conflit avec les vice-rois espagnols de Sicile depuis des années. Le 7 juillet 1674, ses guildes commerciales et les patriciens se joignirent aux forces, assiégèrent le gouverneur espagnol dans son palais et chassaient la garnison hors de la ville et quatre de ses cinq forts. Les troupes et les galères espagnoles fermèrent par terre et par mer, et la ville fit appel à Louis XIV, puis en guerre avec l’Espagne et la République Néerlandaise. Le 27 septembre, un petit escadron français sous le Chevalier de Valbelle courut au-delà des galères espagnoles dans le port avec des provisions pendant environ cinq semaines et aida à prendre le dernier fort, à l’embouchure du port."
"Valbelle came back in January 1675 with a few troops, and found the Spanish camped outside the city and about to take it. On 11 February the Duke of Vivonne arrived with more warships, and with a combined fleet of 20 sail the French beat Melchor de la Cueva’s Spanish fleet off the Lipari Islands and sailed into Messina with large convoys of food. Vivonne governed the city as Louis XIV’s viceroy. The French were too few to march inland, but in August they took the port of Augusta, south of Catania, and the war on Sicily became mainly a war at sea. Spain asked its Dutch allies for help, and Michiel de Ruyter sailed for the Mediterranean.": "Valbelle revint en janvier 1675 avec quelques troupes, et trouva les Espagnols campés à l’extérieur de la ville et sur le point de la prendre. Le 11 février, le duc de Vivonne arriva avec plus de navires de guerre, et avec une flotte combinée de 20 voiles la flotte française de Melchor de la Cuevas au large des îles Lipari et s’embarqua dans Messine avec de grands convois de nourriture. Les Français étaient trop peu nombreux pour marcher à l’intérieur des terres, mais en août ils ont pris le port d’Augusta, au sud de Catane, et la guerre sur la Sicile est devenue principalement une guerre en mer."
