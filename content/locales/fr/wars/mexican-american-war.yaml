# French translations of the catalogue text (wave 14); step bodies follow later.
Mexican–American War: Guerre américano-mexicaine
? The war of 1846–1848 in which the United States conquered the northern half of Mexico. The United States annexed Texas in 1845, which Mexico still regarded as a rebel province, and President James K. Polk, who wanted California and New Mexico as well, sent an army under Zachary Taylor to the Rio Grande, into land between the Nueces and the Rio Grande that both countries claimed. After Mexican cavalry attacked a US patrol there in April 1846, Congress declared war. Taylor won at Palo Alto, Resaca de la Palma, Monterrey and Buena Vista; Stephen W. Kearny took New Mexico and, with the navy and volunteers, California, where the Californios rose and were put down; and in 1847 Winfield Scott landed at Veracruz and fought his way inland to Mexico City, which fell in September. By the Treaty of Guadalupe Hidalgo of 2 February 1848 Mexico recognised the Rio Grande as the border of Texas and ceded California and New Mexico, together with Texas about half of its territory, for $15 million. About 13,000 Americans died, most of disease; Mexican losses are less certain but were higher. The war deepened the conflict over slavery in the United States, and in Mexico it is remembered as the US intervention, a national trauma.
: La guerre de 1846–1848 au cours de laquelle les États-Unis conquirent la moitié nord du Mexique. Les États-Unis avaient annexé en 1845 le Texas, que le Mexique considérait toujours comme une province rebelle, et le président James K. Polk, qui voulait aussi la Californie et le Nouveau-Mexique, envoya une armée commandée par Zachary Taylor jusqu’au Rio Grande, dans les terres situées entre la Nueces et le Rio Grande que revendiquaient les deux pays. Après que la cavalerie mexicaine y eut attaqué une patrouille américaine en avril 1846, le Congrès déclara la guerre. Taylor l’emporta à Palo Alto, Resaca de la Palma, Monterrey et Buena Vista ; Stephen W. Kearny prit le Nouveau-Mexique puis, avec la marine et des volontaires, la Californie, où les Californios se soulevèrent et furent réprimés ; en 1847, Winfield Scott débarqua à Veracruz et se fraya un chemin vers l’intérieur jusqu’à Mexico, qui tomba en septembre. Par le traité de Guadalupe Hidalgo du 2 février 1848, le Mexique reconnut le Rio Grande comme frontière du Texas et céda la Californie et le Nouveau-Mexique (soit, avec le Texas, environ la moitié de son territoire) contre 15 millions de dollars. Environ 13 000 Américains moururent, la plupart de maladie ; les pertes mexicaines sont moins bien connues, mais furent plus lourdes. La guerre aggrava le conflit sur l’esclavage aux États-Unis ; au Mexique, on s’en souvient comme de l’intervention américaine, un traumatisme national.
