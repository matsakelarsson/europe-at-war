# French translations of the catalogue text (wave 14); step bodies follow later.
Mexican Dirty War: Guerre sale au Mexique
? "The conflict between the Mexican state, ruled by the Institutional Revolutionary Party (PRI), and left-wing guerrillas and the student and peasant movements it treated as subversive, known in Mexico as the guerra sucia. In Chihuahua the Grupo Popular Guerrillero of the teacher Arturo Gámiz took up arms for landless peasants in 1964, and on 23 September 1965 attacked the army barracks at Ciudad Madera, where Gámiz and most of his comrades were killed. In Mexico City soldiers and the plain-clothes Olympia Battalion opened fire on a student rally in the Plaza de las Tres Culturas at Tlatelolco on 2 October 1968, ten days before the Olympic Games; the government spoke of about 30 dead, and estimates range up to 300 or more. On 10 June 1971 the Halcones, a paramilitary group trained by the state, attacked a student march in the capital (the Corpus Christi massacre or Halconazo), killing dozens of people; some estimates exceed 100. Repression drove many young people to arms. In the mountains of Guerrero two schoolteachers led guerrilla wars: Genaro Vázquez of the National Revolutionary Civic Association (ACNR), who died after a car crash in 1972, and Lucio Cabañas of the Party of the Poor (PDLP), who kidnapped the senator and candidate for governor Rubén Figueroa in 1974 and was killed by the army on 2 December 1974. In the cities the Liga Comunista 23 de Septiembre, founded in Guadalajara in 1973 and named after the Madera attack, robbed banks and kidnapped businessmen and diplomats; its attempt to kidnap the Monterrey industrialist Eugenio Garza Sada left him dead in September 1973. The army, the Federal Security Directorate (DFS) and, from 1976, the police unit known as the Brigada Blanca answered with torture, secret prisons, extrajudicial killings and disappearances, including “death flights” over the Pacific; in and around Atoyac de Álvarez in Guerrero alone, relatives have documented more than 470 people who disappeared. A political reform and an amnesty in 1978 legalised left-wing parties and freed many prisoners, but disappearances went on into the early 1980s. Estimates of the victims range from about 1,200 disappeared, the figure most often given, to some 3,000 killed or disappeared and 7,000 tortured. A special prosecutor’s office (FEMOSPP, 2002–2006) documented the abuses but convicted no senior official, and a case against the former president Luis Echeverría for the killings of 1968 and 1971 was dismissed; in 2019 the government opened the DFS archives and apologised, and in 2021 it set up a truth commission for the abuses of 1965–1990."
: "Le conflit qui opposa l’État mexicain, dirigé par le Parti révolutionnaire institutionnel (PRI), aux guérillas de gauche et aux mouvements étudiants et paysans qu’il traitait comme subversifs, connu au Mexique sous le nom de guerra sucia. Dans le Chihuahua, le Grupo Popular Guerrillero de l’instituteur Arturo Gámiz prit les armes pour les paysans sans terre en 1964 et attaqua le 23 septembre 1965 la caserne de Ciudad Madera, où Gámiz et la plupart de ses compagnons furent tués. À Mexico, des soldats et le bataillon Olympia, en civil, ouvrirent le feu sur un rassemblement étudiant sur la place des Trois-Cultures, à Tlatelolco, le 2 octobre 1968, dix jours avant les Jeux olympiques ; le gouvernement parla d’une trentaine de morts, et les estimations vont jusqu’à 300 ou davantage. Le 10 juin 1971, les Halcones, un groupe paramilitaire entraîné par l’État, attaquèrent une manifestation étudiante dans la capitale (le massacre de Corpus Christi, ou Halconazo), tuant des dizaines de personnes ; certaines estimations dépassent 100 morts. La répression poussa de nombreux jeunes à prendre les armes. Dans les montagnes du Guerrero, deux instituteurs menèrent des guérillas : Genaro Vázquez, de l’Association civique nationale révolutionnaire (ACNR), qui mourut des suites d’un accident de voiture en 1972, et Lucio Cabañas, du Parti des pauvres (PDLP), qui enleva en 1974 le sénateur Rubén Figueroa, candidat au poste de gouverneur, et fut tué par l’armée le 2 décembre 1974. Dans les villes, la Liga Comunista 23 de Septiembre, fondée à Guadalajara en 1973 et nommée d’après l’attaque de Madera, braqua des banques et enleva des hommes d’affaires et des diplomates ; sa tentative d’enlèvement de l’industriel de Monterrey Eugenio Garza Sada coûta la vie à celui-ci en septembre 1973. L’armée, la Direction fédérale de sécurité (DFS) et, à partir de 1976, l’unité de police appelée Brigada Blanca répondirent par la torture, les prisons secrètes, les exécutions extrajudiciaires et les disparitions, y compris des « vols de la mort » au-dessus du Pacifique ; dans la seule région d’Atoyac de Álvarez, dans le Guerrero, des proches ont recensé plus de 470 disparus. Une réforme politique et une amnistie, en 1978, légalisèrent les partis de gauche et permirent la libération de nombreux prisonniers, mais les disparitions se poursuivirent jusqu’au début des années 1980. Les estimations des victimes vont d’environ 1 200 disparus, le chiffre le plus souvent cité, à quelque 3 000 tués ou disparus et 7 000 torturés. Un parquet spécial (FEMOSPP, 2002–2006) documenta les exactions mais ne fit condamner aucun haut responsable, et une procédure contre l’ancien président Luis Echeverría pour les tueries de 1968 et de 1971 fut rejetée ; en 2019, le gouvernement ouvrit les archives de la DFS et présenta des excuses, et en 2021 il créa une commission de la vérité sur les exactions de 1965–1990."
