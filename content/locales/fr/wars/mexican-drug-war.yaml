# French translations of the catalogue text (wave 14); step bodies follow later.
Mexican drug war: Guerre de la drogue au Mexique
? "The armed conflict between the Mexican state and the drug-trafficking organisations known as cartels, and among the cartels themselves, since President Felipe Calderón sent the army against them in Michoacán on 11 December 2006. Mexican traffickers had grown rich smuggling Colombian cocaine, and later methamphetamine and fentanyl, into the United States, long protected by corrupt officials. Calderón’s offensive, backed by the United States through the Mérida Initiative, captured or killed many leaders, but the big organisations split and fought each other for routes and towns: the Sinaloa Cartel against the Juárez, Tijuana and Beltrán Leyva organisations, the Gulf Cartel against its former enforcers, Los Zetas, and later the fast-growing Jalisco New Generation Cartel (CJNG) against nearly everyone. Cartels moved into extortion, kidnapping, fuel theft and the control of local governments, and the violence was marked by massacres, mass graves and the disappearance of tens of thousands of people, among them the 43 students of Ayotzinapa in 2014. Neither Enrique Peña Nieto’s policies nor Andrés Manuel López Obrador’s “hugs, not bullets” brought the killing down: Mexico recorded more than 30,000 homicides a year from 2018 to 2024. In 2024 the abduction of the Sinaloa Cartel’s co-founder Ismael “El Mayo” Zambada to the United States set off a war inside the cartel, and under President Claudia Sheinbaum, pressed by the Trump administration, which designated the main cartels as terrorist organisations, the army killed the CJNG’s leader, Nemesio Oseguera, “El Mencho”, in February 2026. Homicides fell in 2025 to about 29,500, the fewest since 2016, but disappearances did not, and more than 130,000 people are registered as missing. How many of the dead since 2006 were killed in the drug war is disputed; estimates of all homicides in the period run to several hundred thousand."
: "Le conflit armé qui oppose l’État mexicain aux organisations de trafic de drogue appelées cartels, ainsi que les cartels entre eux, depuis que le président Felipe Calderón a envoyé l’armée contre eux dans le Michoacán, le 11 décembre 2006. Les trafiquants mexicains, longtemps protégés par des fonctionnaires corrompus, s’étaient enrichis en faisant passer aux États-Unis la cocaïne colombienne, puis la méthamphétamine et le fentanyl. L’offensive de Calderón, soutenue par les États-Unis dans le cadre de l’initiative Mérida, permit de capturer ou de tuer de nombreux chefs, mais les grandes organisations se divisèrent et se combattirent pour le contrôle des routes et des villes : le cartel de Sinaloa contre les organisations de Juárez, de Tijuana et des Beltrán Leyva, le cartel du Golfe contre ses anciens hommes de main, Los Zetas, puis le cartel Jalisco Nouvelle Génération (CJNG), en pleine expansion, contre presque tous les autres. Les cartels se lancèrent dans l’extorsion, l’enlèvement, le vol de carburant et la prise de contrôle des administrations locales, et la violence fut marquée par des massacres, des fosses communes et la disparition de dizaines de milliers de personnes, parmi lesquelles les 43 étudiants d’Ayotzinapa en 2014. Ni la politique d’Enrique Peña Nieto ni la stratégie d’Andrés Manuel López Obrador, « des câlins, pas des balles », ne firent baisser le nombre de morts : le Mexique enregistra plus de 30 000 homicides par an de 2018 à 2024. En 2024, l’enlèvement du cofondateur du cartel de Sinaloa, Ismael « El Mayo » Zambada, emmené aux États-Unis, déclencha une guerre au sein du cartel et, sous la présidente Claudia Sheinbaum, pressée par l’administration Trump, qui désigna les principaux cartels comme organisations terroristes, l’armée tua le chef du CJNG, Nemesio Oseguera, « El Mencho », en février 2026. Les homicides tombèrent en 2025 à environ 29 500, leur plus bas niveau depuis 2016, mais les disparitions ne diminuèrent pas, et plus de 130 000 personnes sont enregistrées comme disparues. La part des morts imputables à la guerre de la drogue depuis 2006 est contestée ; les estimations de l’ensemble des homicides sur la période atteignent plusieurs centaines de milliers."
Mexican government (the army, the navy, the Federal Police and, from 2019, the National Guard), with American intelligence and aid: Gouvernement mexicain (armée, marine, Police fédérale et, à partir de 2019, Garde nationale), avec le renseignement et l’aide des États-Unis
