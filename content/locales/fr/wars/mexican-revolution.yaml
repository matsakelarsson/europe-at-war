# French translations of the catalogue text (wave 14); step bodies follow later.
Mexican Revolution: Révolution mexicaine
? A decade of risings and civil wars that ended the long rule of Porfirio Díaz, destroyed the old federal army and produced the constitution of 1917 and the state that ruled Mexico for most of the 20th century. Francisco I. Madero’s call to arms in November 1910 brought down Díaz in May 1911, but Madero kept the federal army and faced risings by Emiliano Zapata, who demanded the return of village lands in Morelos, and by Pascual Orozco in Chihuahua. In February 1913 General Victoriano Huerta overthrew Madero, who was murdered. Northern governors and revolutionaries rose under Venustiano Carranza as the Constitutionalists, with Francisco “Pancho” Villa and Álvaro Obregón as their best generals, while Zapata fought on in the south; with US pressure, including the occupation of Veracruz, they drove Huerta out in July 1914. The winners then split. Villa and Zapata, joined in the Convention of Aguascalientes, took Mexico City in December 1914, but Obregón crushed Villa’s army at Celaya and León in 1915, and the United States recognised Carranza. Villa’s raid on Columbus, New Mexico, in 1916 brought a US punitive expedition into Chihuahua. Carranza’s constitution of 1917 promised land reform, labour rights and national ownership of the subsoil, but fighting went on; Zapata was killed in 1919, and in 1920 the Sonoran generals rose under the Plan of Agua Prieta and Carranza was killed while fleeing. Obregón became president in December 1920. Between one million and 1.5 million people died, most of them civilians, of violence, hunger and disease.
: Une décennie de soulèvements et de guerres civiles qui mit fin au long règne de Porfirio Díaz, détruisit l’ancienne armée fédérale et donna naissance à la constitution de 1917 et à l’État qui gouverna le Mexique pendant la majeure partie du XXe siècle. L’appel aux armes lancé par Francisco I. Madero en novembre 1910 fit tomber Díaz en mai 1911, mais Madero conserva l’armée fédérale et dut faire face aux soulèvements d’Emiliano Zapata, qui exigeait la restitution des terres villageoises dans le Morelos, et de Pascual Orozco dans le Chihuahua. En février 1913, le général Victoriano Huerta renversa Madero, qui fut assassiné. Des gouverneurs et des révolutionnaires du Nord se soulevèrent derrière Venustiano Carranza sous le nom de constitutionnalistes, avec Francisco « Pancho » Villa et Álvaro Obregón pour meilleurs généraux, tandis que Zapata poursuivait la lutte dans le Sud ; aidés par la pression des États-Unis, notamment l’occupation de Veracruz, ils chassèrent Huerta en juillet 1914. Les vainqueurs se divisèrent ensuite. Villa et Zapata, réunis au sein de la convention d’Aguascalientes, prirent Mexico en décembre 1914, mais Obregón écrasa l’armée de Villa à Celaya et à León en 1915, et les États-Unis reconnurent Carranza. Le raid de Villa sur Columbus, au Nouveau-Mexique, en 1916, entraîna l’entrée d’une expédition punitive américaine dans le Chihuahua. La constitution de Carranza, en 1917, promettait une réforme agraire, des droits pour les travailleurs et la propriété nationale du sous-sol, mais les combats continuèrent ; Zapata fut tué en 1919 et, en 1920, les généraux sonoriens se soulevèrent derrière le plan d’Agua Prieta, et Carranza fut tué dans sa fuite. Obregón devint président en décembre 1920. Entre un million et 1,5 million de personnes moururent, des civils pour la plupart, victimes de la violence, de la faim et des maladies.
