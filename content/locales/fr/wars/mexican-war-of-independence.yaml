# French translations of the catalogue text (wave 14); step bodies follow later.
Mexican War of Independence: Guerre d’indépendance du Mexique
? The eleven-year war that ended Spanish rule in New Spain. Napoleon’s invasion of Spain in 1808 left the viceroyalty without a legitimate king and set American-born criollos against the Spanish-born officials and merchants who ruled it. On 16 September 1810 the priest Miguel Hidalgo called his parishioners at Dolores to rise (the Grito de Dolores), and a mass army of Indigenous and mestizo farmworkers, miners and townspeople took Guanajuato and marched on Mexico City before royalist troops under Félix María Calleja broke it at Puente de Calderón in January 1811; Hidalgo and the other first leaders were captured and shot. The priest José María Morelos then led a disciplined insurgent army in the south, called a congress that declared independence in 1813 and wrote the Constitution of Apatzingán, but he was captured and executed in 1815. Guerrillas under Vicente Guerrero and others held out in the mountains. In 1821 the royalist officer Agustín de Iturbide made common cause with Guerrero in the Plan of Iguala, most of the army went over to him, and the Army of the Three Guarantees entered Mexico City on 27 September 1821. Estimates of the dead range from about 250,000 to 600,000 in a population of about six million.
: La guerre de onze ans qui mit fin à la domination espagnole en Nouvelle-Espagne. L’invasion de l’Espagne par Napoléon en 1808 laissa la vice-royauté sans roi légitime et dressa les criollos, nés en Amérique, contre les fonctionnaires et les marchands nés en Espagne qui la gouvernaient. Le 16 septembre 1810, le curé Miguel Hidalgo appela ses paroissiens de Dolores au soulèvement (le Grito de Dolores), et une armée de masse d’ouvriers agricoles, de mineurs et de citadins autochtones et métis prit Guanajuato et marcha sur Mexico, avant que les troupes royalistes de Félix María Calleja ne la mettent en pièces à Puente de Calderón en janvier 1811 ; Hidalgo et les autres premiers chefs furent capturés et fusillés. Le prêtre José María Morelos mena ensuite une armée insurgée disciplinée dans le Sud et réunit un congrès qui proclama l’indépendance en 1813 et rédigea la Constitution d’Apatzingán, mais il fut capturé et exécuté en 1815. Des guérillas menées par Vicente Guerrero et d’autres tinrent bon dans les montagnes. En 1821, l’officier royaliste Agustín de Iturbide fit cause commune avec Guerrero par le plan d’Iguala, la majeure partie de l’armée se rallia à lui, et l’armée des Trois Garanties entra dans Mexico le 27 septembre 1821. Les estimations du nombre de morts vont d’environ 250 000 à 600 000, pour une population d’environ six millions d’habitants.
