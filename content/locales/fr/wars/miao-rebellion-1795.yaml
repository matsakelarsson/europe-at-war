# French translations of the catalogue text (wave 9); step bodies follow later.
Miao rebellion (1795–1806): Rébellion miao (1795–1806)
? A rising of the Miao (Hmong and related peoples) of the mountains where western Hunan meets north-eastern Guizhou, around Songtao, Yongsui, Qianzhou and Fenghuang. Through the 18th century the Qing had replaced the hereditary native chiefs of the region with regular officials, and Han Chinese settlers and moneylenders had taken much of the best land, often with the help of officials who extorted and over-taxed the Miao. Early in 1795 Miao villages rose under leaders such as Shi Liudeng in Guizhou and Shi Sanbao and Wu Bayue in Hunan, killed settlers and besieged towns. The Qianlong Emperor sent two of his leading commanders, Fuk’anggan and Helin, with banner troops, Green Standard battalions from neighbouring provinces and local militia; both died in camp in 1796, and the withdrawal of troops from Hubei to fight the Miao is thought to have helped the White Lotus rising there. The main Miao forces were broken by 1797 and their leaders killed or captured, but resistance went on in the hills for years. Under the official Fu Nai, the Qing confiscated rebel land for military colonies, built forts and watchtowers and rebuilt the old Ming frontier wall, the Southern Great Wall, to separate Miao and Han villages, and the region was declared settled in 1806. Losses on both sides are not known.
: Un soulèvement des Miao (Hmong et peuples apparentés) des montagnes où l’ouest du Hunan rejoint le nord-est du Guizhou, autour de Songtao, Yongsui, Qianzhou et Fenghuang. Au cours du XVIIIe siècle, les Qing avaient remplacé les chefs indigènes héréditaires de la région par des fonctionnaires réguliers, et des colons et des prêteurs chinois han s’étaient emparés d’une grande partie des meilleures terres, souvent avec l’aide de fonctionnaires qui rançonnaient les Miao et les accablaient d’impôts. Au début de 1795, des villages miao se soulevèrent sous des chefs comme Shi Liudeng au Guizhou, Shi Sanbao et Wu Bayue au Hunan, tuèrent des colons et assiégèrent des villes. L’empereur Qianlong envoya deux de ses principaux commandants, Fuk’anggan et Helin, avec des troupes des bannières, des bataillons de l’Étendard vert venus des provinces voisines et des milices locales ; tous deux moururent au camp en 1796, et l’on pense que le retrait de troupes du Hubei pour combattre les Miao favorisa le soulèvement du Lotus blanc dans cette province. Les principales forces miao furent brisées en 1797 et leurs chefs tués ou capturés, mais la résistance se poursuivit dans les collines pendant des années. Sous la direction du fonctionnaire Fu Nai, les Qing confisquèrent les terres des rebelles pour en faire des colonies militaires, construisirent des forts et des tours de guet et reconstruisirent l’ancien mur frontalier des Ming, la Grande Muraille du Sud, pour séparer les villages miao et han, et la région fut déclarée pacifiée en 1806. Les pertes des deux camps ne sont pas connues.
