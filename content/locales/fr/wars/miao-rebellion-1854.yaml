# French translations of the catalogue text (wave 9); step bodies follow later.
Miao rebellion (1854–1873): Rébellion miao (1854–1873)
? A long series of risings in Guizhou, also called the Qian rebellion after the province’s short name, in which Miao and other non-Han peoples, as well as Han and Hui rebels and religious sects, fought the Qing. Poverty, competition for land with Han settlers, corrupt officials and new taxes for the war against the Taiping lay behind it, and the Qing had withdrawn troops from the province. A rising of Buyi farmers under Yang Yuanbao at Dushan in March 1854 was quickly put down, but in March 1855 Zhang Xiumei led the Miao of Taigong in south-eastern Guizhou in revolt, and rebellion spread across much of the province. Rebel bands, some of them allied with Taiping forces passing through, took many towns and threatened the capital Guiyang. After the defeat of the Taiping, Hunan armies under Xi Baotian were sent in during the late 1860s and reconquered the province district by district; Zhang Xiumei was captured in 1872 and executed, and the last resistance ended in 1873. Large parts of Guizhou were left depopulated, and many Miao (Hmong) moved south into what are now Vietnam and Laos.
: Une longue série de soulèvements au Guizhou, appelée aussi rébellion de Qian, d’après le nom abrégé de la province, au cours desquels les Miao et d’autres peuples non han, ainsi que des rebelles han et hui et des sectes religieuses, combattirent les Qing. La pauvreté, la concurrence pour la terre avec les colons han, la corruption des fonctionnaires et de nouveaux impôts levés pour la guerre contre les Taiping en furent les causes, et les Qing avaient retiré des troupes de la province. Un soulèvement de paysans buyi mené par Yang Yuanbao à Dushan en mars 1854 fut rapidement réprimé, mais en mars 1855 Zhang Xiumei entraîna dans la révolte les Miao de Taigong, dans le sud-est du Guizhou, et la rébellion s’étendit à une grande partie de la province. Des bandes rebelles, dont certaines s’allièrent à des forces taiping de passage, prirent de nombreuses villes et menacèrent la capitale, Guiyang. Après la défaite des Taiping, des armées du Hunan commandées par Xi Baotian furent envoyées à la fin des années 1860 et reconquirent la province district par district ; Zhang Xiumei fut capturé en 1872 et exécuté, et la dernière résistance prit fin en 1873. De vastes parties du Guizhou restèrent dépeuplées, et de nombreux Miao (Hmong) migrèrent vers le sud, dans les actuels Vietnam et Laos.
