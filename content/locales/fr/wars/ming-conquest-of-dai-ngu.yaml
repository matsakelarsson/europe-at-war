# French translations of the catalogue text (wave 11); step bodies follow later.
Ming conquest of Đại Ngu and the Later Trần risings: Conquête du Đại Ngu par les Ming et soulèvements des Trần postérieurs
The Ming conquest of the kingdom of Đại Ngu, as Hồ Quý Ly had renamed Đại Việt after taking the Trần throne in 1400, and the risings of the Later Trần princes against Ming rule. When Hồ troops ambushed a Ming escort bringing back a Trần claimant in April 1406, the Yongle Emperor sent two armies, from Guangxi under Zhang Fu and from Yunnan under Mu Sheng, with about 215,000 men and a large train of firearms. They stormed the Hồ fortress of Đa Bang on the Red River in January 1407, took both capitals within days, destroyed the Hồ fleets and in June 1407 captured Hồ Quý Ly and his sons. Instead of restoring the Trần, the Ming annexed the country as the province of Jiaozhi. In 1407 the Trần prince Trần Ngỗi rose in the south and defeated Mu Sheng at Bô Cô in December 1408; after his capture his nephew Trần Quý Khoáng fought on from Nghệ An and Thuận Hóa until Zhang Fu captured him in 1414.: La conquête par les Ming du royaume de Đại Ngu, nom que Hồ Quý Ly avait donné au Đại Việt après s’être emparé du trône des Trần en 1400, et les soulèvements des princes Trần postérieurs contre la domination Ming. Lorsque des troupes des Hồ tendirent une embuscade, en avril 1406, à une escorte Ming qui ramenait un prétendant Trần, l’empereur Yongle envoya deux armées, l’une depuis le Guangxi sous Zhang Fu, l’autre depuis le Yunnan sous Mu Sheng, avec environ 215 000 hommes et un important train d’armes à feu. Elles prirent d’assaut la forteresse Hồ de Đa Bang, sur le fleuve Rouge, en janvier 1407, s’emparèrent des deux capitales en quelques jours, détruisirent les flottes des Hồ et capturèrent Hồ Quý Ly et ses fils en juin 1407. Au lieu de restaurer les Trần, les Ming annexèrent le pays sous le nom de province de Jiaozhi. En 1407, le prince Trần Ngỗi se souleva dans le sud et battit Mu Sheng à Bô Cô en décembre 1408 ; après sa capture, son neveu Trần Quý Khoáng poursuivit la lutte depuis le Nghệ An et le Thuận Hóa jusqu’à ce que Zhang Fu le capture en 1414.
