# French translations of the catalogue text (wave 9); step bodies follow later.
Ming conquest of Sichuan: Conquête du Sichuan par les Ming
? The campaign in which the Ming dynasty took Sichuan from the Xia state founded by Ming Yuzhen, whose family name has nothing to do with the dynasty’s name. Ming Yuzhen, a Red Turban commander, had made himself master of Sichuan, declared himself king in 1360 and emperor of the Great Xia in 1362, with his capital at Chongqing; at his death in 1366 his nine-year-old son Ming Sheng succeeded him. Xia refused to submit to the Hongwu Emperor, and when its general Wu Youren raided Xingyuan and Hanzhong in 1370, the Ming prepared an invasion from two sides. Early in 1371 Tang He and Liao Yongzhong led a fleet up the Yangtze, while Fu Youde marched south from Shaanxi and Gansu. Fu Youde took Jiezhou, Mianzhou and Hanzhou (Guanghan) between May and July; on the river, the Xia defences in the Qutang Gorge, with chained bridges and catapults, held up Tang He until Liao Yongzhong broke them with cannon fire. The fleets reached Chongqing, where Ming Sheng surrendered on 3 August 1371, and Chengdu, whose defenders had used war elephants against Fu Youde, gave up about a month later. Ming Sheng was given a title and sent in 1372 to live in Goryeo (Korea), and Wu Youren was executed in Nanjing. The conquest opened the way to Yunnan, taken in 1381–1382.
: La campagne au cours de laquelle la dynastie Ming prit le Sichuan à l’État de Xia fondé par Ming Yuzhen, dont le nom de famille n’a rien à voir avec le nom de la dynastie. Ming Yuzhen, un commandant des Turbans rouges, s’était rendu maître du Sichuan et s’était proclamé roi en 1360, puis empereur du Grand Xia en 1362, avec Chongqing pour capitale ; à sa mort, en 1366, son fils de neuf ans, Ming Sheng, lui succéda. Le Xia refusa de se soumettre à l’empereur Hongwu et, lorsque son général Wu Youren lança un raid sur Xingyuan et Hanzhong en 1370, les Ming préparèrent une invasion sur deux fronts. Au début de 1371, Tang He et Liao Yongzhong remontèrent le Yangtsé avec une flotte, tandis que Fu Youde marchait vers le sud depuis le Shaanxi et le Gansu. Fu Youde prit Jiezhou, Mianzhou et Hanzhou (Guanghan) entre mai et juillet ; sur le fleuve, les défenses des Xia dans la gorge de Qutang, avec leurs ponts de chaînes et leurs catapultes, arrêtèrent Tang He jusqu’à ce que Liao Yongzhong les brise à coups de canon. Les flottes atteignirent Chongqing, où Ming Sheng se rendit le 3 août 1371, et Chengdu, dont les défenseurs avaient lancé des éléphants de guerre contre Fu Youde, capitula environ un mois plus tard. Ming Sheng reçut un titre et fut envoyé en 1372 vivre au Goryeo (Corée), et Wu Youren fut exécuté à Nankin. La conquête ouvrit la voie au Yunnan, pris en 1381–1382.
