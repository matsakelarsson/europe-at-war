# French translations of the catalogue text (wave 9); step bodies follow later.
Ming conquest of Yunnan: Conquête du Yunnan par les Ming
The campaign that brought Yunnan, the last province held for the Yuan inside China, under the Ming dynasty. Basalawarmi, the Yuan Prince of Liang, governed Yunnan from Kunming and stayed loyal to the Yuan court in Mongolia, refusing the Hongwu Emperor’s embassies and killing his envoy Wang Wei in 1374. In September 1381 the emperor sent Fu Youde with Lan Yu and Mu Ying and an army of about 250,000–300,000 men through Guizhou. Mu Ying defeated the Yuan army of more than 100,000 at the Baishi River near Qujing, and Basalawarmi killed himself on 6 January 1382 as Kunming surrendered. In April Lan Yu and Mu Ying stormed the passes of Dali and captured Duan Shi, the last of the hereditary Duan governors; the final stronghold fell in February 1383. Mu Ying stayed in Yunnan with a large military colony, and his descendants commanded the province until the end of the dynasty.: La campagne qui plaça sous l’autorité de la dynastie Ming le Yunnan, dernière province de Chine tenue pour les Yuan. Basalawarmi, prince de Liang de la dynastie Yuan, gouvernait le Yunnan depuis Kunming et resta fidèle à la cour des Yuan en Mongolie, repoussant les ambassades de l’empereur Hongwu et faisant tuer son envoyé Wang Wei en 1374. En septembre 1381, l’empereur envoya Fu Youde, avec Lan Yu et Mu Ying et une armée d’environ 250 000 à 300 000 hommes, à travers le Guizhou. Mu Ying battit l’armée Yuan, forte de plus de 100 000 hommes, sur la rivière Baishi près de Qujing, et Basalawarmi se donna la mort le 6 janvier 1382 tandis que Kunming capitulait. En avril, Lan Yu et Mu Ying forcèrent les cols de Dali et capturèrent Duan Shi, le dernier des gouverneurs héréditaires Duan ; la dernière place forte tomba en février 1383. Mu Ying resta au Yunnan avec une importante colonie militaire, et ses descendants commandèrent la province jusqu’à la fin de la dynastie.
