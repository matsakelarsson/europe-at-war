# French translations of the catalogue text (wave 8); step bodies follow later.
Ming–Kotte war: Guerre entre les Ming et Kotte
A brief war in Sri Lanka between the treasure fleet of Ming China under Admiral Zheng He and the Sinhalese ruler Alakeshvara (Vira Alakeshvara), of the Alagakkonara family, who held power at Kotte. The Chinese accused Alakeshvara of piracy against the shipping of the Indian Ocean and of hostility to Ming envoys and to neighbouring states that traded with China. On one of the fleet’s voyages, most authorities say on its way home in 1411, Alakeshvara drew Zheng He and about 2,000 soldiers inland to Kotte and then cut them off from the fleet at Colombo. The Chinese stormed Kotte instead, captured Alakeshvara and his family, beat off the Sinhalese armies that surrounded them and fought their way back to the ships in six days. Zheng He reached Nanjing on 6 July 1411 with his prisoners. The Yongle Emperor freed them and sent them home, and the Ming court recognised a new ruler; Parakramabahu VI, who took the throne of Kotte in 1412, kept good relations with China.: Une brève guerre au Sri Lanka entre la flotte des trésors de la Chine des Ming, commandée par l’amiral Zheng He, et le souverain cinghalais Alakeshvara (Vira Alakeshvara), de la famille Alagakkonara, qui détenait le pouvoir à Kotte. Les Chinois accusaient Alakeshvara de se livrer à la piraterie contre la navigation de l’océan Indien et de se montrer hostile aux envoyés des Ming et aux États voisins qui commerçaient avec la Chine. Lors de l’un des voyages de la flotte, au retour en 1411 selon la plupart des spécialistes, Alakeshvara attira Zheng He et environ 2 000 soldats à l’intérieur des terres jusqu’à Kotte, puis les coupa de la flotte, restée à Colombo. Les Chinois prirent alors Kotte d’assaut, capturèrent Alakeshvara et sa famille, repoussèrent les armées cinghalaises qui les encerclaient et se frayèrent un chemin jusqu’aux navires en six jours. Zheng He atteignit Nankin le 6 juillet 1411 avec ses prisonniers. L’empereur Yongle les libéra et les renvoya chez eux, et la cour des Ming reconnut un nouveau souverain ; Parakramabahu VI, qui monta sur le trône de Kotte en 1412, entretint de bonnes relations avec la Chine.
