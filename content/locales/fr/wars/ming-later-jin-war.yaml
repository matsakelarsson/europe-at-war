# French translations of the catalogue text (wave 9); step bodies follow later.
Ming–Later Jin war: Guerre entre les Ming et les Jin postérieurs
? The war in which the Jurchen state of Nurhaci and his son Hong Taiji, the Later Jin, renamed Qing in 1636, took the Ming province of Liaodong and brought Ming China to the edge of collapse. Nurhaci declared war with his Seven Grievances in May 1618 and took Fushun; in April 1619 he destroyed a Ming army of about 90,000 men with a Joseon contingent at Sarhu, and in 1621 he took Shenyang (Mukden) and Liaoyang, the heart of Liaodong. The Ming fell back on a line of fortresses from Shanhai Pass to Ningyuan and Jinzhou, armed with Portuguese-type cannon, and Yuan Chonghuan beat off Nurhaci at Ningyuan (1626) and Hong Taiji at Ningyuan and Jinzhou (1627). Hong Taiji then went round the line through Mongol lands, raiding to the walls of Beijing in 1629–1630, deep into north China in 1636, 1638–1639 and 1642–1643, while his new Han Chinese artillery took Dalinghe (1631) and his allies from the Ming navy brought him Lüshun (1633). After the siege of Jinzhou and the battle of Songshan (1640–1642) only Ningyuan and the approaches to Shanhai Pass were left to the Ming. When Li Zicheng’s rebels took Beijing in April 1644, the Ming general Wu Sangui let the Qing through Shanhai Pass, and the battle there on 27 May 1644 opened the Qing conquest of China.
: La guerre au cours de laquelle l’État jürchen de Nurhaci et de son fils Hong Taiji, les Jin postérieurs, rebaptisé Qing en 1636, prit aux Ming la province du Liaodong et mena la Chine des Ming au bord de l’effondrement. Nurhaci déclara la guerre avec ses Sept Griefs en mai 1618 et prit Fushun ; en avril 1619, il anéantit à Sarhu une armée Ming d’environ 90 000 hommes, appuyée par un contingent du Joseon, et en 1621 il prit Shenyang (Moukden) et Liaoyang, le cœur du Liaodong. Les Ming se replièrent sur une ligne de forteresses allant de la passe de Shanhai à Ningyuan et Jinzhou, armées de canons de type portugais, et Yuan Chonghuan repoussa Nurhaci à Ningyuan (1626), puis Hong Taiji à Ningyuan et Jinzhou (1627). Hong Taiji contourna alors la ligne en passant par les terres mongoles et poussa ses raids jusqu’aux murs de Pékin en 1629–1630, puis loin dans la Chine du Nord en 1636, 1638–1639 et 1642–1643, tandis que sa nouvelle artillerie chinoise han prenait Dalinghe (1631) et que ses alliés venus de la marine Ming lui livraient Lüshun (1633). Après le siège de Jinzhou et la bataille de Songshan (1640–1642), il ne restait plus aux Ming que Ningyuan et les abords de la passe de Shanhai. Lorsque les rebelles de Li Zicheng prirent Pékin en avril 1644, le général Ming Wu Sangui laissa les Qing franchir la passe de Shanhai, et la bataille qui s’y livra le 27 mai 1644 ouvrit la conquête de la Chine par les Qing.
