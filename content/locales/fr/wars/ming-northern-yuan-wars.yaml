# French translations of the catalogue text (wave 9); step bodies follow later.
Ming campaigns against the Northern Yuan: Campagnes des Ming contre les Yuan du Nord
The wars between the new Ming dynasty and the Yuan court after it left China. When Ming armies took Dadu (Beijing) in September 1368, the last Yuan emperor, Toghon Temür, withdrew to the steppe, and the dynasty lived on in Mongolia as what Chinese historians call the Northern Yuan. In 1369–1370 the Ming took Shanxi, Shaanxi and Gansu, captured the summer capital Shangdu and the refuge at Yingchang, and defeated the Yuan general Köke Temür near Dingxi. A great Ming expedition into Mongolia in 1372 ended in defeat on the Tuul River, and for fifteen years the Hongwu Emperor held a defensive frontier while the Mongol commander Naghachu kept Manchuria for the Yuan. In 1387 a Ming army of about 200,000 forced Naghachu to surrender, and in May 1388 Lan Yu surprised the camp of the khan Tögüs Temür at Buir Lake, taking tens of thousands of prisoners. Tögüs Temür was murdered by a rival soon afterwards. The Yuan line survived, but its power in the steppe was broken and the Oirats rose in the west.: Les guerres entre la nouvelle dynastie Ming et la cour des Yuan après son départ de Chine. Lorsque les armées Ming prirent Dadu (Pékin) en septembre 1368, le dernier empereur Yuan, Toghon Temür, se retira dans la steppe, et la dynastie survécut en Mongolie sous la forme de ce que les historiens chinois appellent les Yuan du Nord. En 1369–1370, les Ming prirent le Shanxi, le Shaanxi et le Gansu, s’emparèrent de la capitale d’été, Shangdu, et du refuge de Yingchang, et battirent le général Yuan Köke Temür près de Dingxi. Une grande expédition Ming en Mongolie s’acheva en 1372 par une défaite sur la Tuul et, pendant quinze ans, l’empereur Hongwu tint une frontière défensive tandis que le commandant mongol Naghachu conservait la Mandchourie pour les Yuan. En 1387, une armée Ming d’environ 200 000 hommes contraignit Naghachu à se rendre et, en mai 1388, Lan Yu surprit le camp du khan Tögüs Temür au lac Buir, faisant des dizaines de milliers de prisonniers. Tögüs Temür fut assassiné par un rival peu après. La lignée des Yuan survécut, mais sa puissance dans la steppe était brisée, et les Oïrats s’élevèrent à l’ouest.
