# French translations of the catalogue text (wave 9); step bodies follow later.
Ming–Turfan conflicts: Conflits entre les Ming et Tourfan
A long struggle between Ming China and the Turfan Khanate, the eastern successor of Moghulistan, over the oasis of Hami (Kumul) at the western end of the Gansu corridor. Hami, ruled by a branch of the Chinggisid house known in Chinese as the Hami Guard, was the Ming’s gate to Central Asia and a vassal that sent tribute. Sultan Ali of Turfan seized it in 1473; Ming-backed Hami princes retook it in 1482, Ali’s son Ahmad took it again in 1488 and 1493, and the Ming answered with trade embargoes, the closing of the Jiayu Pass and, in 1495, a raid that briefly retook the oasis. Under Mansur Khan, Turfan annexed Hami in 1513 and raided the Gansu corridor in 1516–1517, 1524 and 1528, besieging Suzhou (Jiuquan). The garrisons held, but in 1529 the Ming court decided not to restore the Hami Guard and to accept Turfan’s tribute, leaving Hami to Turfan.: Une longue lutte entre la Chine des Ming et le khanat de Tourfan, successeur oriental du Moghulistan, pour l’oasis de Hami (Kumul), à l’extrémité occidentale du corridor du Gansu. Hami, gouvernée par une branche de la maison gengiskhanide connue en chinois sous le nom de garde de Hami, était la porte des Ming vers l’Asie centrale et un vassal qui leur envoyait tribut. Le sultan Ali de Tourfan s’en empara en 1473 ; des princes de Hami soutenus par les Ming la reprirent en 1482, Ahmad, fils d’Ali, s’en empara de nouveau en 1488 et en 1493, et les Ming répondirent par des embargos commerciaux, la fermeture du col de Jiayu et, en 1495, un raid qui reprit brièvement l’oasis. Sous Mansur Khan, Tourfan annexa Hami en 1513 et lança des raids sur le corridor du Gansu en 1516–1517, en 1524 et en 1528, assiégeant Suzhou (Jiuquan). Les garnisons tinrent bon, mais en 1529 la cour des Ming décida de ne pas rétablir la garde de Hami et d’accepter le tribut de Tourfan, laissant Hami à Tourfan.
