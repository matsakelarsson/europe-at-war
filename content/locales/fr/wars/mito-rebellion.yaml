# French translations of the catalogue text (wave 10); step bodies follow later.
Mito rebellion: Rébellion de Mito
? A civil war in the Mito domain north-east of Edo, and the long march of its radical faction, the Tengutō (Tengu party), towards Kyoto. Mito, a senior branch of the Tokugawa house, was the home of the Mito school that taught reverence for the emperor, and its samurai were split between radicals who demanded that the shogunate carry out the court’s order to expel the foreigners and conservatives, the Shoseitō, who backed the shogunate. On 2 May 1864 (the 27th day of the third month of Genji 1) Fujita Koshirō, son of the scholar Fujita Tōko, raised a band of 62 men on Mount Tsukuba; it grew to some 1,400 samurai, villagers and rōnin. While some units levied money from towns of the northern Kantō and burned part of Tochigi, the Shoseitō under Ichikawa Sanzaemon took power in Mito. The shogunate sent an army against the rebels, and when the daimyo of the branch domain of Shishido, Matsudaira Yorinori, came to mediate with a large following, he was drawn into the fighting around Nakaminato, forced to surrender and made to commit seppuku. About 1,000 of the rebels gathered at Daigo under Takeda Kōunsai and at the beginning of the eleventh month (late November) set out for Kyoto along the Nakasendō, hoping to put their case to Tokugawa Yoshinobu, a son of the late Mito lord. They beat the Takasaki domain’s troops at Shimonita and the Takashima and Matsumoto troops at Wada Pass, then turned aside through Mino and Echizen in the snow. Yoshinobu himself led troops against them, and on 14 January 1865, cornered at Shinbo near Tsuruga, the 828 who remained surrendered to the Kaga domain. The shogunate took them over, and in March 1865 352 of them were beheaded at Tsuruga, Takeda among them. In Mito the Shoseitō put to death the rebels’ families, women and small children included; when the radicals returned to power in 1868 they took the same revenge on the families of the Shoseitō, and the feud went on into the Boshin War.
: Une guerre civile dans le domaine de Mito, au nord-est d’Edo, et la longue marche de sa faction radicale, le Tengutō (parti des Tengu), vers Kyoto. Mito, branche aînée de la maison Tokugawa, était le berceau de l’école de Mito, qui enseignait la vénération de l’empereur, et ses samouraïs étaient divisés entre les radicaux, qui exigeaient que le shogunat exécute l’ordre de la cour d’expulser les étrangers, et les conservateurs, le Shoseitō, qui soutenaient le shogunat. Le 2 mai 1864 (le 27e jour du troisième mois de Genji 1), Fujita Koshirō, fils du lettré Fujita Tōko, leva une troupe de 62 hommes sur le mont Tsukuba ; elle grossit jusqu’à quelque 1 400 samouraïs, villageois et rōnin. Tandis que certaines unités levaient de l’argent dans les villes du nord du Kantō et incendiaient une partie de Tochigi, le Shoseitō, mené par Ichikawa Sanzaemon, prit le pouvoir à Mito. Le shogunat envoya une armée contre les rebelles et, lorsque le daimyo du domaine secondaire de Shishido, Matsudaira Yorinori, vint servir de médiateur avec une suite nombreuse, il fut entraîné dans les combats autour de Nakaminato, contraint de se rendre et forcé de faire seppuku. Environ 1 000 rebelles se rassemblèrent à Daigo sous la conduite de Takeda Kōunsai et, au début du onzième mois (fin novembre), partirent pour Kyoto par le Nakasendō, dans l’espoir de plaider leur cause auprès de Tokugawa Yoshinobu, fils du défunt seigneur de Mito. Ils battirent les troupes du domaine de Takasaki à Shimonita et celles de Takashima et de Matsumoto au col de Wada, puis se détournèrent par le Mino et l’Echizen, dans la neige. Yoshinobu mena lui-même des troupes contre eux et, le 14 janvier 1865, acculés à Shinbo, près de Tsuruga, les 828 hommes qui restaient se rendirent au domaine de Kaga. Le shogunat les prit en charge et, en mars 1865, 352 d’entre eux furent décapités à Tsuruga, dont Takeda. À Mito, le Shoseitō fit mettre à mort les familles des rebelles, femmes et jeunes enfants compris ; lorsque les radicaux revinrent au pouvoir en 1868, ils exercèrent la même vengeance sur les familles du Shoseitō, et la vendetta se prolongea jusque dans la guerre de Boshin.
