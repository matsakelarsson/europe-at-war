# French translations of the catalogue text (wave 14); step bodies follow later.
Mixtón War: Guerre des Mixtón
A rising of the Caxcanes of New Galicia, in today’s Jalisco and southern Zacatecas, and their Zacateco and other allies against Spanish rule, named after the fortified hill of Mixtón where many of them made their stand. Ten years after Nuño de Guzmán’s conquest of the west, slave raids and forced labour drove the Caxcanes to revolt in 1540. They beat off the first Spanish attacks, and Pedro de Alvarado, conqueror of Guatemala, died of injuries received in a failed assault in June 1541. Viceroy Antonio de Mendoza then led 450 Spaniards and tens of thousands of Indigenous warriors from central Mexico against the strongholds, taking Nochistlán in November 1541 and Mixtón early in 1542. Thousands of captives were executed or enslaved; the Caxcan leader Francisco Tenamaztle held out in the mountains until 1550 or 1551.: Un soulèvement des Caxcanes de Nouvelle-Galice, dans l’actuel Jalisco et le sud de l’actuel Zacatecas, et de leurs alliés zacatecos et autres contre la domination espagnole, qui doit son nom à la colline fortifiée du Mixtón, où nombre d’entre eux se retranchèrent pour résister. Dix ans après la conquête de l’Ouest par Nuño de Guzmán, les razzias d’esclaves et le travail forcé poussèrent les Caxcanes à la révolte en 1540. Ils repoussèrent les premières attaques espagnoles, et Pedro de Alvarado, le conquérant du Guatemala, mourut des blessures reçues lors d’un assaut manqué en juin 1541. Le vice-roi Antonio de Mendoza mena alors 450 Espagnols et des dizaines de milliers de guerriers autochtones du centre du Mexique contre les places fortes, prenant Nochistlán en novembre 1541 et le Mixtón au début de 1542. Des milliers de captifs furent exécutés ou réduits en esclavage ; le chef caxcan Francisco Tenamaztle tint bon dans les montagnes jusqu’en 1550 ou 1551.
Caxcanes, Zacatecos and their allies (Francisco Tenamaztle, Don Diego the Zacateco): Caxcanes, Zacatecos et leurs alliés (Francisco Tenamaztle, don Diego le Zacateco)
