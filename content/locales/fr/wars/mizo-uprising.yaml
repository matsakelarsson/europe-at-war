# French translations of the catalogue text (wave 8); step bodies follow later.
Mizo National Front uprising: Soulèvement du Front national mizo
An armed rising for the independence of the Mizo Hills, then a district of Assam, led by the Mizo National Front (MNF) of Laldenga, and the twenty-year insurgency that followed; in Mizoram it is remembered as the Rambuai, the troubled years. The MNF grew out of anger at the government’s handling of the famine of 1959. On the night of 28 February 1966 its fighters attacked government posts across the district and on 1 March declared independence. The Indian army retook the towns within weeks, with the air force bombing and strafing Aizawl, and in the following years the government forced most of the villagers into guarded grouping centres. The insurgency continued from bases in East Pakistan and Burma until the Mizoram Peace Accord of 30 June 1986, after which Laldenga became chief minister of the new state of Mizoram.: Un soulèvement armé pour l’indépendance des Mizo Hills, alors district de l’Assam, mené par le Front national mizo (MNF) de Laldenga, et l’insurrection de vingt ans qui suivit ; au Mizoram, on s’en souvient comme du Rambuai, les années de troubles. Le MNF naquit de la colère suscitée par la manière dont le gouvernement avait géré la famine de 1959. Dans la nuit du 28 février 1966, ses combattants attaquèrent des postes gouvernementaux dans tout le district et, le 1er mars, proclamèrent l’indépendance. L’armée indienne reprit les villes en quelques semaines, tandis que l’aviation bombardait et mitraillait Aizawl, et dans les années qui suivirent, le gouvernement contraignit la plupart des villageois à s’installer dans des centres de regroupement gardés. L’insurrection se poursuivit depuis des bases au Pakistan oriental et en Birmanie jusqu’à l’accord de paix du Mizoram du 30 juin 1986, après quoi Laldenga devint ministre en chef du nouvel État du Mizoram.
