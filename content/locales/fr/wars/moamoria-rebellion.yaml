# French translations of the catalogue text (wave 8); step bodies follow later.
Moamoria rebellion: Rébellion des Moamorias
? A series of risings in the Ahom kingdom of Assam by the Moamorias, the followers of the Mayamara Vaishnava monastery (satra), most of them Morans and other peasant groups who resented the forced-labour (paik) system and the court’s persecution of their sect. In November 1769 rebels led by Ragha Neog took the capital, Rangpur, and captured King Lakshmi Singha, ruling in his name until royalists retook the city in April 1770 and executed the leaders. A second rising was put down in 1782 with mass killings. In 1786–1788 the rebels rose again, King Gaurinath Singha fled from Rangpur to Guwahati, and rebel leaders held much of Upper Assam. At Gaurinath’s request the East India Company sent Captain Thomas Welsh with a small force, which retook Guwahati in November 1792 and Rangpur in March 1794 before it was recalled. The prime minister Purnananda Burhagohain fought on until a settlement in 1805 left the Moran country around Bengmara self-governing under its own chief, the Barsenapati, who paid tribute. The kingdom is estimated to have lost as much as half of its people to war, famine and flight, which left it open to the Burmese invasions of 1817–1826.
: Une série de soulèvements dans le royaume ahom de l’Assam, menés par les Moamorias, les fidèles du monastère vishnouite (satra) de Mayamara, pour la plupart des Morans et d’autres groupes paysans qui supportaient mal le système de travail forcé (paik) et la persécution de leur secte par la cour. En novembre 1769, des rebelles conduits par Ragha Neog prirent la capitale, Rangpur, et capturèrent le roi Lakshmi Singha, gouvernant en son nom jusqu’à ce que des royalistes reprennent la ville en avril 1770 et exécutent les meneurs. Un deuxième soulèvement fut écrasé en 1782 par des massacres. En 1786–1788, les rebelles se soulevèrent de nouveau, le roi Gaurinath Singha s’enfuit de Rangpur à Guwahati, et les chefs rebelles tinrent une grande partie du Haut-Assam. À la demande de Gaurinath, la Compagnie des Indes orientales envoya le capitaine Thomas Welsh avec une petite troupe, qui reprit Guwahati en novembre 1792 et Rangpur en mars 1794 avant d’être rappelée. Le Premier ministre Purnananda Burhagohain poursuivit la lutte jusqu’à un accord qui, en 1805, laissa le pays moran autour de Bengmara s’administrer lui-même sous son propre chef, le Barsenapati, qui versait un tribut. On estime que le royaume perdit jusqu’à la moitié de sa population du fait de la guerre, de la famine et de l’exode, ce qui le laissa à la merci des invasions birmanes de 1817–1826.
