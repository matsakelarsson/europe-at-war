# French translations of the catalogue text (wave 14); step bodies follow later.
Modoc War: Guerre des Modocs
? The war of 1872–1873 between a band of Modoc under Kintpuash (Captain Jack) and the United States Army in the lava beds south of Tule Lake, on the California–Oregon border. By the treaty of 1864 the Modoc gave up their lands on the Lost River and Tule Lake and were moved onto the Klamath Reservation with the Klamath, their old rivals; Kintpuash’s band of about 150 people went back to the Lost River, where settlers demanded their removal. On 29 November 1872 cavalry sent to bring them back tried to disarm them, fighting broke out, and the band fled to a natural fortress of lava trenches and caves, Captain Jack’s Stronghold, while Hooker Jim’s men killed 14 to 18 settlers on the way. With no more than about 53 fighting men, the Modoc beat off an attack by some 300 to 400 soldiers and volunteers on 17 January 1873 without loss. During peace talks on 11 April, under pressure from the band’s war faction, Kintpuash shot General Edward Canby, the only general killed in the wars against Native nations, and Boston Charley killed the Reverend Eleazer Thomas. Reinforced troops drove the Modoc from the Stronghold in April, but Scarfaced Charley’s warriors destroyed a patrol at Sand Butte on 26 April; after the Modoc’s first defeat at Dry Lake on 10 May the band split, Hooker Jim’s group surrendered and helped track Kintpuash, who was captured in early June. He and three others were hanged at Fort Klamath on 3 October 1873, and the 153 survivors of the band were sent as prisoners of war to Indian Territory, where they were held until 1909.
: La guerre de 1872–1873 qui opposa une bande de Modocs menée par Kintpuash (Captain Jack) à l’armée des États-Unis dans les champs de lave au sud du lac Tule, à la frontière entre la Californie et l’Oregon. Par le traité de 1864, les Modocs cédèrent leurs terres de la Lost River et du lac Tule et furent installés dans la réserve Klamath avec les Klamaths, leurs vieux rivaux ; la bande de Kintpuash, environ 150 personnes, retourna sur la Lost River, où les colons exigèrent son déplacement. Le 29 novembre 1872, des cavaliers de l’armée envoyés pour la ramener tentèrent de la désarmer, des combats éclatèrent, et la bande s’enfuit vers une forteresse naturelle de tranchées et de grottes de lave, le bastion de Captain Jack, tandis que les hommes de Hooker Jim tuaient 14 à 18 colons en chemin. Avec au plus 53 combattants environ, les Modocs repoussèrent sans perte, le 17 janvier 1873, l’assaut de quelque 300 à 400 soldats et volontaires. Lors de pourparlers de paix, le 11 avril, sous la pression de la faction belliciste de la bande, Kintpuash abattit le général Edward Canby, le seul général tué dans les guerres contre les nations amérindiennes, et Boston Charley tua le révérend Eleazer Thomas. Des troupes renforcées chassèrent les Modocs du bastion en avril, mais les guerriers de Scarfaced Charley anéantirent une patrouille à Sand Butte le 26 avril ; après la première défaite des Modocs à Dry Lake, le 10 mai, la bande se scinda, et le groupe de Hooker Jim se rendit et aida à traquer Kintpuash, qui fut capturé au début de juin. Lui et trois autres hommes furent pendus à Fort Klamath le 3 octobre 1873, et les 153 survivants de la bande furent envoyés comme prisonniers de guerre dans le territoire indien, où ils furent détenus jusqu’en 1909.
