# Some French text was translated automatically.
"Moldavian Campaign of 1574": "Campagne moldave de 1574"
? "The revolt of John III the Terrible (Ioan Vodă cel Cumplit), voivode of Moldavia, against Ottoman overlordship, and its suppression. John, who had taken the throne in 1572 with Ottoman backing and ruled harshly against the boyars, refused a demand to double Moldavia’s tribute, and the Porte named Peter the Lame as voivode in his place. With an army of perhaps 30,000–40,000 Moldavians, joined by about 1,200 Zaporozhian Cossacks under Ivan Svirhovsky, he struck first, and on 24 April 1574 routed an Ottoman, Wallachian and Tatar army at Jiliște near Focșani, then sacked Brăila, overran Wallachia and attacked the Ottoman fortresses of Tighina and Cetatea Albă (Bender and Akkerman). A much larger Ottoman and Crimean Tatar army then entered Moldavia. In June, at Lake Cahul near the Danube, part of the Moldavian army under the boyar Ieremia Cernevici, reportedly bribed, went over to the enemy; John fought on, then retreated to a fortified camp at Roșcani, where he surrendered after several days on a promise that his men would be spared. He was executed, according to tradition by being tied to camels driven apart, and much of his army was massacred. Moldavia remained an Ottoman vassal, and John became a Romanian hero of resistance to the Ottomans."
: "La révolte de Jean III le Terrible (Ioan Vodă cel Cumplit), voïvode de Moldavie, contre l’emprise ottomane, et sa répression. John, qui avait pris le trône en 1572 avec le soutien Ottoman et gouverné durement contre les boyars, a refusé une demande de double tribut moldavien, et la Porte a nommé Pierre lame comme voïvode à sa place. Avec une armée d’environ 30 000 à 40 000 moldaves, rejointe par environ 1 200 cosaques zaporozhien sous Ivan Svirhovski, il frappe d’abord, et le 24 avril 1574 conduit une armée ottomane, wallachienne et tatare à Jiliște près de Focșani, puis saccage Brăila, overran Wallachia et attaque les forteresses ottomanes de Tighina et Cetatea Albă (Bender et Akkerman). En juin, au lac Cahul près du Danube, une partie de l’armée moldave sous le boyar Ieremia Cenevici, qui aurait été soudoyé, est allée vers l’ennemi ; John a combattu, puis il s’est retiré dans un camp fortifié à Roșcani, où il s’est rendu après plusieurs jours en promettant que ses hommes seraient épargnés. Il a été exécuté, selon la tradition en étant lié à des chameaux chassés, et une grande partie de son armée a été massacrée. La Moldavie est restée un vassal ottoman, et John est devenu un héros roumain de résistance aux Ottomans."
"Dates are Julian. Romanian historians often give double dates, such as 14/24 April 1574 for Jiliște; sources also differ on the dates of the battle at Lake Cahul (9 or 10 June) and of John’s death (11 or 14 June). The size of the Ottoman army is very uncertain, with estimates from about 50,000 to 200,000.": "Les historiens roumains donnent souvent des dates doubles, comme 14/24 avril 1574 pour Jiliște ; les sources diffèrent également sur les dates de la bataille au lac Cahul (9 ou 10 juin) et de la mort de Jean (11 ou 14 juin). La taille de l’armée ottomane est très incertaine, avec des estimations d’environ 50 000 à 200 000."
"Wallachia fought on the Ottoman side under its voivode Alexander II Mircea, the brother of Peter the Lame.": "La Wallachie combattit du côté ottoman sous sa voïvode Alexandre II Mircea, le frère de Pierre lame."
