"Moldavian–Ottoman War, 1474–1476": "Guerre moldave-ottomane, 1474–1476"
"The war between Stephen III (the Great) of Moldavia and Mehmed II after Stephen stopped paying tribute and fought for control of Wallachia. In January 1475 Stephen destroyed an Ottoman army in the fog at Vaslui, one of the worst Ottoman defeats of the century. The next year Mehmed invaded in person and beat Stephen at Valea Albă, but he could not take Suceava or Neamț, and hunger and plague forced him to withdraw.": "La guerre entre Étienne III (le Grand) de Moldavie et Mehmed II après que Étienne ait cessé de rendre hommage et combattu pour le contrôle de la Wallachie. En janvier 1475 Étienne a détruit une armée ottomane dans le brouillard à Vaslui, l’une des pires défaites ottomanes du siècle. L’année suivante Mehmed envahit en personne et bat Stephen à Valea Albă, mais il ne pouvait pas prendre Suceava ou Neamț, et la faim et la peste l’obligent à se retirer."
"The figures are uncertain. Polish and Venetian reports of 40,000 to 100,000 Ottoman dead at Vaslui are surely exaggerated, though the defeat was severe. A Polish chronicler put Stephen’s army at 30,000–40,000, including Székely, Polish and Hungarian contingents.": "Les chiffres sont incertains. Des rapports polonais et vénitiens de 40 000 à 100 000 morts ottomans à Vaslui sont certainement exagérés, bien que la défaite ait été sévère. Un chroniqueur polonais a mis l’armée Étienne de 30 000 à 40 000, y compris les contingents Székely, polonais et hongrois."
"Wallachia changed rulers several times in these years. Basarab Laiotă, first Stephen’s candidate, went over to the Ottomans and joined their army in 1475 and 1476.": "La Wallachie changea plusieurs fois de dirigeant au cours de ces années. Basarab Laiotă, premier candidat d’Étienne, se rendit aux Ottomans et entra dans leur armée en 1475 et 1476."
