"Valea Albă": "Valea Albă"
"In the summer of 1476 Mehmed II led a large army into Moldavia, with Wallachians under Basarab Laiotă, while the Crimean Tatars attacked from the north; the Moldavians drove the Tatars back. With many of his men away defending their homes, Stephen faced the sultan with a small army near Neamț. On 26 July, at Valea Albă (Războieni), he was surrounded and defeated, and escaped with few followers.": "À l’été 1476, Mehmed II conduisit une grande armée en Moldavie, avec les Wallachiens sous Basarab Laiotă, tandis que les Tatars de Crimée attaquaient du nord ; les Moldaves chassaient les Tatars. Le 26 juillet, à Valea Albă (Războieni), il fut encerclé et défait, et s’échappa avec peu de disciples."
"Mehmed advanced to Suceava, which he burned, but the citadel held out, as did the fortresses of Neamț and Hotin. The Ottoman army ran short of food, plague broke out, and a Hungarian and Transylvanian army under Stephen Báthory and Vlad III approached. In August Mehmed withdrew across the Danube. Stephen soon rebuilt his army and helped Vlad back onto the Wallachian throne in November, though Vlad was killed within weeks. Moldavia kept its independence for now, but in 1484 the Ottomans took Kiliia and Cetatea Albă, its ports on the Black Sea.": "Mehmed a avancé à Suceava, qu’il a brûlé, mais la citadelle a tenu, ainsi que les forteresses de Neamț et Hotin. L’armée ottomane a manqué de nourriture, la peste a éclaté, et une armée hongroise et transylvanienne sous Stephen Báthory et Vlad III s’est approchée. Stephen rebâtit bientôt son armée et aida Vlad à revenir sur le trône wallachien en novembre, bien que Vlad fût tué en quelques semaines. La Moldavie conserva son indépendance pour l’instant, mais en 1484 les Ottomans prirent Kiliia et Cetatea Albă, ses ports sur la mer Noire."
