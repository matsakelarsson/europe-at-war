"Stephen III had fought his way into Wallachia to drive out the Ottoman vassal Radu the Handsome, and in 1473 he stopped paying tribute. Late in 1474 Mehmed II ordered Hadım Süleyman Pasha, the governor of Rumelia, to break off the siege of Shkodër and march on Moldavia. His tired army, joined by Wallachians, crossed the frozen country towards Vaslui. Stephen, with Moldavian peasants and boyars, Székelys and Polish and Hungarian contingents, waited at Podul Înalt, the high bridge over the Bârlad river.": "Stephen III avait combattu son chemin vers la Wallachie pour chasser le vassal ottoman Radu the Handsome, et en 1473 il a cessé de rendre hommage. Fin 1474 Mehmed II ordonna à Hadım Süleyman Pasha, gouverneur de Rumelia, de rompre le siège de Shkodër et de marcher sur la Moldavie. Son armée fatiguée, rejointe par les Wallachiens, traversa le pays gelé vers Vaslui. Stephen, avec les paysans et les boyards moldaves, Székelys et les contingents polonais et hongrois, a attendu à Podul Înalt, le pont supérieur au-dessus de la rivière Bârlad."
"On the foggy morning of 10 January 1475 the Moldavians lured the Ottoman army into the marshy valley with the sound of drums and bugles, then attacked it from the woods on all sides. The Ottomans broke and fled with heavy losses. Stephen sent captured standards to the king of Poland and the pope, who praised him as a champion of Christendom, but little help followed. That summer an Ottoman fleet took the Genoese port of Caffa in the Crimea, and in December Mangup, capital of the Greek principality of Theodoro, whose ruler was Stephen’s brother-in-law, fell after a long siege.": "Le matin brumeux du 10 janvier 1475, les Moldaves ont attiré l’armée ottomane dans la vallée marécageuse avec le bruit de tambours et de punaises, puis l’ont attaqué des bois de tous côtés. Les Ottomans se sont brisés et ont fui avec de lourdes pertes. Stephen a envoyé des normes capturées au roi de Pologne et au pape, qui l’a loué comme un champion de la chrétienté, mais peu d’aide a suivi. Cet été-là, une flotte ottomane prit le port génois de Caffa en Crimée et, en décembre, Mangup, capitale de la principauté grecque de Theodoro, dont le chef était Stephens beau-frère, tomba après un long siège."
