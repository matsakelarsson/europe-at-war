# French translations of the catalogue text (wave 7); step bodies follow later.
Mongol campaign against the Nizaris: Campagne mongole contre les Nizarites
The campaign in which the Mongols destroyed the Nizari Ismaili state, a network of mountain castles in northern and eastern Iran that had resisted the Seljuks and the Khwarazmshahs for more than 150 years and whose fida’is were known in the West as the Assassins. The Great Khan Möngke sent his brother Hülegü west in 1253 with orders to destroy the Nizaris and bring the Abbasid caliph to heel. His general Kitbuqa took castles in Quhistan and besieged Gerdkuh from 1253, and in 1256 Hülegü himself entered the Nizari heartland of Rudbar in the Alborz. The imam Rukn al-Din Khurshah surrendered at Maymun-Diz on 19 November 1256 and ordered his castles to give up; Alamut capitulated in December. Some castles held out for years, but Khurshah was killed in 1257 on Möngke’s orders, and many Nizaris in Mongol hands were massacred.: La campagne au cours de laquelle les Mongols détruisirent l’État ismaélien nizarite, un réseau de châteaux de montagne du nord et de l’est de l’Iran qui avait résisté aux Seldjoukides et aux shahs du Khwarezm pendant plus de 150 ans et dont les fidaïs étaient connus en Occident sous le nom d’Assassins. Le grand khan Möngke envoya son frère Houlagou vers l’ouest en 1253, avec l’ordre de détruire les Nizarites et de mettre au pas le calife abbasside. Son général Kitbuqa prit des châteaux du Quhistan et assiégea Gerdkuh à partir de 1253, et en 1256 Houlagou pénétra lui-même dans le Rudbar, cœur du pays nizarite, dans l’Elbourz. L’imam Rukn al-Din Khurshah se rendit à Maymun-Diz le 19 novembre 1256 et ordonna à ses châteaux de déposer les armes ; Alamut capitula en décembre. Certains châteaux tinrent encore des années, mais Khurshah fut tué en 1257 sur ordre de Möngke, et de nombreux Nizarites tombés aux mains des Mongols furent massacrés.
