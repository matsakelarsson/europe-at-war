# French translations of the catalogue text (wave 10); step bodies follow later.
Mongol campaigns against the Ainu: Campagnes mongoles contre les Aïnous
? An intermittent war on Sakhalin and the lower Amur between the Mongol Yuan dynasty and the Ainu. In 1263 the Mongols set up a post at Nurgan on the lower Amur and received the submission of the Nivkh (Gilyaks), who complained that they were attacked every year by the Guwei, the Ainu, who had been moving north from Hokkaido into southern Sakhalin. A Mongol force attacked the Ainu on Sakhalin in late 1264. Attempts to cross the Strait of Tartary failed in 1272–1273, and later expeditions crossed in winter, when the strait froze. Large campaigns followed in 1284–1286, with up to 10,000 men in a thousand small boats; a fort of continental type at Cape Crillon, at the southern tip of Sakhalin, may date from them. After the rebellion of Nayan in 1287 drew Mongol troops away, some Nivkh went over to the Ainu, and in 1297 an Ainu force under the chief Waying crossed to the mainland and raided the Amur estuary before it was defeated near Lake Kizi; it raided again in 1305. In 1308 Waying and another chief, Yushannu, offered submission through the Nivkh and promised a yearly tribute of furs at Nurgan, which became a trade in furs, silk and iron that linked the Amur with Hokkaido and Japan. Whether the campaigns had anything to do with Kublai’s invasions of Japan is doubted by most historians.
: Une guerre intermittente à Sakhaline et sur le cours inférieur de l’Amour entre la dynastie mongole des Yuan et les Aïnous. En 1263, les Mongols établirent un poste à Nurgan, sur le bas Amour, et reçurent la soumission des Nivkhes (Ghiliaks), qui se plaignaient d’être attaqués chaque année par les Guwei, c’est-à-dire les Aïnous, qui s’étendaient vers le nord depuis Hokkaido jusque dans le sud de Sakhaline. Une force mongole attaqua les Aïnous à Sakhaline à la fin de 1264. Les tentatives de traverser le détroit de Tartarie échouèrent en 1272–1273, et les expéditions suivantes le franchirent en hiver, lorsque le détroit était gelé. De grandes campagnes suivirent en 1284–1286, avec jusqu’à 10 000 hommes à bord d’un millier de petits bateaux ; un fort de type continental situé au cap Crillon, à la pointe sud de Sakhaline, pourrait dater de cette époque. Après que la rébellion de Nayan, en 1287, eut détourné les troupes mongoles, certains Nivkhes passèrent du côté des Aïnous et, en 1297, une troupe aïnoue menée par le chef Waying passa sur le continent et lança des raids sur l’estuaire de l’Amour avant d’être vaincue près du lac Kizi ; elle revint en 1305. En 1308, Waying et un autre chef, Yushannu, offrirent leur soumission par l’intermédiaire des Nivkhes et promirent un tribut annuel de fourrures à Nurgan, qui devint un commerce de fourrures, de soie et de fer reliant l’Amour à Hokkaido et au Japon. La plupart des historiens doutent que ces campagnes aient eu un quelconque lien avec les invasions du Japon par Kubilai.
