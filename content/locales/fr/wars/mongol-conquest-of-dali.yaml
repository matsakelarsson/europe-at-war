# French translations of the catalogue text (wave 9); step bodies follow later.
Mongol conquest of the Dali Kingdom: Conquête du royaume de Dali par les Mongols
The campaign in which the Mongols conquered the Dali Kingdom, the Bai state in today’s Yunnan that had succeeded Nanzhao in 937. To outflank the Southern Song from the west, the Great Khan Möngke sent his brother Kublai south through the Tibetan borderlands in 1253 with the general Uriyangkhadai. After the Dali court, dominated by the Gao family of chief ministers, had killed the Mongol envoys, three Mongol columns crossed the upper Yangtze (the Jinsha) and converged on the capital, Dali, which was taken around the turn of 1253–1254 and spared. The chief minister Gao Taixiang was caught and executed, and King Duan Xingzhi fled east to Shanchan (Kunming), where Uriyangkhadai captured him in 1254. Möngke kept Duan as ruler under Mongol overlordship, with the title of maharaja, and Uriyangkhadai subdued the rest of Yunnan by 1256. Yunnan became a Mongol base for attacks on the Song and Đại Việt, and later a province of the Yuan.: La campagne au cours de laquelle les Mongols conquirent le royaume de Dali, l’État bai de l’actuel Yunnan qui avait succédé au Nanzhao en 937. Pour prendre à revers les Song du Sud par l’ouest, le grand khan Möngke envoya en 1253 son frère Kubilai vers le sud à travers les marches tibétaines, avec le général Uriyangkhadai. La cour de Dali, dominée par la famille Gao, qui fournissait les chanceliers, ayant fait tuer les envoyés mongols, trois colonnes mongoles franchirent le cours supérieur du Yangtsé (le Jinsha) et convergèrent sur la capitale, Dali, qui fut prise à la charnière de 1253 et de 1254 et épargnée. Le chancelier Gao Taixiang fut capturé et exécuté, et le roi Duan Xingzhi s’enfuit vers l’est à Shanchan (Kunming), où Uriyangkhadai le captura en 1254. Möngke maintint Duan comme souverain sous la suzeraineté mongole, avec le titre de maharaja, et Uriyangkhadai acheva de soumettre le reste du Yunnan en 1256. Le Yunnan devint une base mongole pour les attaques contre les Song et le Đại Việt, puis une province des Yuan.
