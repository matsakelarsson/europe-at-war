# French translations of the catalogue text (wave 9); step bodies follow later.
Mongol conquest of Qara Khitai: Conquête du Kara Khitaï par les Mongols
? "The campaign in which the Mongol general Jebe destroyed the realm of Kuchlug, the Naiman prince who had taken over the Qara Khitai (Western Liao) empire of Central Asia. After his defeat by Genghis Khan in 1204 and on the Irtysh in 1208–1209, Kuchlug had fled to the Qara Khitai, married into the ruling family and in 1211 seized the gurkhan Yelü Zhilugu while he was out hunting, ruling in his name until the old ruler’s death in 1213. The Karluks of Qayaliq and the Uyghurs of Qocho had already gone over to the Mongols. Kuchlug, a convert from Christianity to Buddhism, turned the Muslim towns of Kashgar and Khotan against him by quartering troops on their people, burning their harvests and, according to Juvaini, forcing Muslims to give up their faith or their dress; he is said to have crucified the imam of Khotan on the door of his college. When he besieged Almaliq and killed its Karluk ruler, Ozar, a Mongol vassal married into Genghis Khan’s family, Almaliq appealed to Genghis Khan. Jebe, with about 20,000 men and Uyghur and Karluk allies, relieved Almaliq, defeated a Qara Khitai army of about 30,000 near Balasagun and marched on Kashgar, proclaiming that everyone might keep his own religion. The townspeople killed Kuchlug’s soldiers quartered among them, and Kuchlug fled across the Pamirs; hunters caught him on the borders of Badakhshan and Wakhan and handed him to the Mongols, who beheaded him in 1218. The conquest gave the Mongol Empire a long border with the Khwarazmian Empire, which it invaded in 1219. Sources differ on the dates: Jebe’s campaign is put in 1216, 1217 or 1218, and Kuchlug’s death in 1217 or 1218."
: "La campagne au cours de laquelle le général mongol Jebe détruisit le royaume de Kütchlüg, le prince naïman qui s’était emparé de l’empire Kara Khitaï (Liao occidentaux) d’Asie centrale. Après ses défaites face à Gengis Khan en 1204 et sur l’Irtych en 1208–1209, Kütchlüg s’était réfugié chez les Kara Khitaï, était entré par mariage dans la famille régnante et, en 1211, s’était saisi du gurkhan Yelü Zhilugu pendant une partie de chasse, régnant ensuite en son nom jusqu’à la mort du vieux souverain en 1213. Les Karlouks de Qayaliq et les Ouïghours de Qocho étaient déjà passés aux Mongols. Kütchlüg, un chrétien converti au bouddhisme, dressa contre lui les villes musulmanes de Kachgar et de Khotan en logeant des troupes chez leurs habitants, en brûlant leurs récoltes et, selon Juvaini, en forçant les musulmans à renoncer à leur foi ou à leur costume ; il aurait crucifié l’imam de Khotan sur la porte de son collège. Lorsqu’il assiégea Almaliq et tua son souverain karlouk, Ozar, vassal des Mongols entré par mariage dans la famille de Gengis Khan, Almaliq fit appel à Gengis Khan. Jebe, avec environ 20 000 hommes et des alliés ouïghours et karlouks, dégagea Almaliq, battit une armée kara khitaï d’environ 30 000 hommes près de Balasagun et marcha sur Kachgar, proclamant que chacun pouvait garder sa religion. Les habitants tuèrent les soldats de Kütchlüg logés chez eux, et Kütchlüg s’enfuit à travers le Pamir ; des chasseurs le capturèrent aux confins du Badakhchan et du Wakhan et le livrèrent aux Mongols, qui le décapitèrent en 1218. La conquête donna à l’Empire mongol une longue frontière avec l’Empire khwarezmien, qu’il envahit en 1219. Les sources divergent sur les dates : la campagne de Jebe est placée en 1216, 1217 ou 1218, et la mort de Kütchlüg en 1217 ou 1218."
