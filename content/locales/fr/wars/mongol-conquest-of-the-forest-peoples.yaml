# French translations of the catalogue text (wave 9); step bodies follow later.
Mongol conquest of the forest peoples: Conquête des peuples de la forêt par les Mongols
? The campaigns in which the Mongols brought the “forest peoples” (hoi-yin irgen) of southern Siberia under their rule, from Lake Baikal to the upper Yenisei. In 1207 Genghis Khan sent his eldest son Jochi north-west. The Oirat chief Qutuqa Beki submitted first and guided the Mongols, and the Buryats, Barguts, Ursut, Qabqanas, Tuba (Tuvans) and the Yenisei Kyrgyz submitted without a battle, sending white gyrfalcons, white horses and sables as tribute; the Oirats were bound to Genghis Khan’s family by marriages. In 1217 the Tumad (Khori-Tumed) west of Lake Baikal, ruled by their queen Botoqui Tarqun, rose and seized the Mongol commanders sent to them, Qorchi and Qutuqa Beki, according to the Secret History; Boroqul, one of Genghis Khan’s oldest companions, led a force against them and was ambushed and killed in the forest. The Kyrgyz refused to send troops and joined the rising, as did several smaller peoples. In the winter of 1217–1218 Dörbei Doqshin surprised the Tumad by cutting a new path through the forest, and Jochi subdued the Kyrgyz and the other peoples of the upper Yenisei. Botoqui was given to Qutuqa Beki as a wife, and a hundred Tumad were handed over to Boroqul’s family in atonement (some accounts say they were killed). The Kyrgyz lands became a Mongol province of craftsmen and farmers. Dates and the order of events follow the Secret History of the Mongols and Rashid al-Din, which do not always agree.
: Les campagnes au cours desquelles les Mongols soumirent les « peuples de la forêt » (hoi-yin irgen) de la Sibérie méridionale, du lac Baïkal au haut Ienisseï. En 1207, Gengis Khan envoya son fils aîné Djötchi vers le nord-ouest. Le chef oïrat Qutuqa Beki se soumit le premier et guida les Mongols, et les Bouriates, les Barguts, les Ursut, les Qabqanas, les Tuba (Touvains) et les Kirghizes de l’Ienisseï se soumirent sans combat, envoyant en tribut des gerfauts blancs, des chevaux blancs et des zibelines ; les Oïrats furent liés à la famille de Gengis Khan par des mariages. En 1217, les Tumad (Khori-Tumed) de l’ouest du lac Baïkal, gouvernés par leur reine Botoqui Tarqun, se soulevèrent et s’emparèrent des commandants mongols envoyés chez eux, Qorchi et Qutuqa Beki, selon l’Histoire secrète ; Boroqul, l’un des plus anciens compagnons de Gengis Khan, conduisit une troupe contre eux et périt dans une embuscade en forêt. Les Kirghizes refusèrent d’envoyer des troupes et rejoignirent le soulèvement, comme plusieurs peuples moins nombreux. Au cours de l’hiver 1217–1218, Dörbei Doqshin surprit les Tumad en ouvrant un nouveau chemin à travers la forêt, et Djötchi soumit les Kirghizes et les autres peuples du haut Ienisseï. Botoqui fut donnée pour épouse à Qutuqa Beki, et cent Tumad furent livrés à la famille de Boroqul en expiation (selon certains récits, ils furent tués). Les terres kirghizes devinrent une province mongole d’artisans et de cultivateurs. Les dates et l’ordre des événements suivent l’Histoire secrète des Mongols et Rachid al-Din, qui ne concordent pas toujours.
