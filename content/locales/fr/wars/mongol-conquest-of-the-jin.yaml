# French translations of the catalogue text (wave 9); step bodies follow later.
Mongol conquest of the Jin dynasty: Conquête de la dynastie Jin par les Mongols
? The 23-year war in which the Mongols destroyed the Jurchen Jin dynasty, which ruled northern China and Manchuria. Genghis Khan invaded in 1211, routed the Jin field army at Yehuling, and in 1213–1214 his armies ravaged the north China plain while the Jin court was torn by a coup. The Jin bought a truce in 1214 with a princess and tribute, then moved their capital from Zhongdu (today Beijing) to Kaifeng; the Mongols returned and took Zhongdu on 31 May 1215. In the north-east the Khitan Yelü Liuge and the Jurchen general Puxian Wannu, founder of Eastern Xia, broke away. From 1217 Muqali turned raiding into occupation north of the Yellow River, helped by Chinese and Khitan commanders who changed sides, while the Jin fought the Song and Western Xia as well. Under Ögedei the Mongols outflanked the Jin defences by marching through Song territory, destroyed the last Jin army at Sanfengshan in February 1232 and besieged Kaifeng, which surrendered in May 1233 after an epidemic. The last Jin emperor, Aizong, killed himself at Caizhou on 9 February 1234 as a Mongol and Song army broke in. The war devastated northern China, though how many died is unknown.
: La guerre de 23 ans au cours de laquelle les Mongols détruisirent la dynastie jürchen des Jin, qui régnait sur la Chine du Nord et la Mandchourie. Gengis Khan envahit le pays en 1211 et mit en déroute l’armée de campagne des Jin à Yehuling ; en 1213–1214, ses armées ravagèrent la plaine de Chine du Nord tandis qu’un coup d’État déchirait la cour des Jin. Les Jin achetèrent une trêve en 1214 au prix d’une princesse et d’un tribut, puis transférèrent leur capitale de Zhongdu (l’actuelle Pékin) à Kaifeng ; les Mongols revinrent et prirent Zhongdu le 31 mai 1215. Dans le nord-est, le Khitan Yelü Liuge et le général jürchen Puxian Wannu, fondateur des Xia orientaux, firent sécession. À partir de 1217, Muqali transforma les raids en occupation au nord du fleuve Jaune, avec l’aide de commandants chinois et khitans qui avaient changé de camp, tandis que les Jin combattaient aussi les Song et les Xia occidentaux. Sous Ögedei, les Mongols contournèrent les défenses des Jin en traversant le territoire des Song, anéantirent la dernière armée Jin à Sanfengshan en février 1232 et assiégèrent Kaifeng, qui se rendit en mai 1233 après une épidémie. Le dernier empereur Jin, Aizong, se donna la mort à Caizhou le 9 février 1234, au moment où une armée mongole et Song forçait la ville. La guerre dévasta la Chine du Nord, mais on ignore combien de personnes périrent.
