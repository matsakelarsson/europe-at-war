# French translations of the catalogue text (wave 9); step bodies follow later.
Mongol conquest of the Song dynasty: Conquête de la dynastie Song par les Mongols
? The 45-year war in which the Mongols, from 1271 the Yuan dynasty of Kublai Khan, conquered the Southern Song, the richest and most populous state of its time. After the Song and the Mongols had destroyed the Jin together in 1234, a Song army tried to occupy the old capitals of Kaifeng and Luoyang and was driven out, and in 1235 Ögedei sent his sons against the Song. For two decades the Song held the line of the Huai, the Han and the Yangtze, and in Sichuan a chain of mountain fortresses wore down every invasion; the Great Khan Möngke died before one of them, Diaoyucheng, in 1259. Kublai then changed his strategy, built a fleet and besieged the twin cities of Xiangyang and Fancheng on the Han River for five years (1268–1273). Their fall opened the Yangtze. Bayan led the Yuan army down the river in 1274–1275, destroyed the Song army at Dingjiazhou and received the surrender of the capital, Lin’an (Hangzhou), in February 1276. Loyalists carried two boy emperors south along the coast, until the last Song fleet was destroyed at Yamen near Guangzhou on 19 March 1279. For the first time all of China was ruled by a dynasty from the steppe.
: La guerre de 45 ans au cours de laquelle les Mongols, devenus en 1271 la dynastie Yuan de Kubilai Khan, conquirent les Song du Sud, l’État le plus riche et le plus peuplé de son temps. Après que les Song et les Mongols eurent détruit ensemble les Jin en 1234, une armée Song tenta d’occuper les anciennes capitales de Kaifeng et de Luoyang et en fut chassée, et en 1235 Ögedei envoya ses fils contre les Song. Pendant deux décennies, les Song tinrent la ligne de la Huai, de la Han et du Yangtsé, et au Sichuan une chaîne de forteresses de montagne usa chaque invasion ; le grand khan Möngke mourut devant l’une d’elles, Diaoyucheng, en 1259. Kubilai changea alors de stratégie, construisit une flotte et assiégea pendant cinq ans (1268–1273) les villes jumelles de Xiangyang et de Fancheng, sur la Han. Leur chute ouvrit le Yangtsé. Bayan conduisit l’armée Yuan en aval du fleuve en 1274–1275, anéantit l’armée Song à Dingjiazhou et reçut la reddition de la capitale, Lin’an (Hangzhou), en février 1276. Des loyalistes emmenèrent deux empereurs enfants vers le sud le long de la côte, jusqu’à la destruction de la dernière flotte Song à Yamen, près de Canton, le 19 mars 1279. Pour la première fois, toute la Chine était gouvernée par une dynastie venue de la steppe.
