# French translations of the catalogue text (wave 9); step bodies follow later.
Mongol conquest of Western Xia: Conquête des Xia occidentaux par les Mongols
The wars in which the Mongols under Genghis Khan raided, subdued and finally destroyed Western Xia, the Tangut kingdom of the Ordos, the Helan Mountains and the Hexi Corridor. After raids in 1205 and 1207, a full invasion in 1209 defeated the Xia armies and besieged the capital, Zhongxing (today Yinchuan); the siege failed when a dike the Mongols had built to flood the city burst, but the Xia ruler submitted in 1210 and became a Mongol vassal and ally against the Jin dynasty. When Western Xia refused troops for the campaign against Khwarazm and later made peace with the Jin, Genghis Khan returned. In 1226 his armies took the towns of the Hexi Corridor one by one and destroyed the Xia field army near Lingzhou on 4 December; Zhongxing was besieged through 1227. Genghis Khan died in August 1227, and the last Xia ruler, who surrendered the next month, was killed on his orders. The capital and much of the country were devastated, and the Tangut state, which had lasted since 1038, came to an end.: Les guerres au cours desquelles les Mongols de Gengis Khan razzièrent, soumirent puis détruisirent les Xia occidentaux, le royaume tangoute de l’Ordos, des monts Helan et du corridor du Hexi. Après des raids en 1205 et en 1207, une invasion de grande ampleur vainquit en 1209 les armées des Xia et mit le siège devant la capitale, Zhongxing (l’actuelle Yinchuan) ; le siège échoua lorsque céda une digue que les Mongols avaient construite pour inonder la ville, mais le souverain des Xia se soumit en 1210 et devint le vassal des Mongols et leur allié contre la dynastie Jin. Lorsque les Xia occidentaux refusèrent de fournir des troupes pour la campagne contre le Khwarezm, puis firent la paix avec les Jin, Gengis Khan revint. En 1226, ses armées prirent une à une les villes du corridor du Hexi et anéantirent l’armée de campagne des Xia près de Lingzhou le 4 décembre ; Zhongxing fut assiégée tout au long de 1227. Gengis Khan mourut en août 1227, et le dernier souverain des Xia, qui se rendit le mois suivant, fut tué sur son ordre. La capitale et une grande partie du pays furent dévastées, et l’État tangoute, qui existait depuis 1038, disparut.
