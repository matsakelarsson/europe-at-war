"The Mongols sacked Pest within days and spent the rest of 1241 east of the Danube, plundering and killing across the Great Hungarian Plain and organising the conquered land as their own. Béla fled to Austria, where Duke Frederick II, known as the Quarrelsome, took his treasure and forced him to pledge three western counties. Béla appealed to the pope, the emperor Frederick II and the kings of the West, but no help came. The Danube held the Mongols back, and on the far bank the Hungarians guarded the crossings.": "Les Mongols laissèrent Pest en quelques jours et passèrent le reste de 1241 à l’est du Danube, pillant et tuant à travers la grande plaine hongroise et organisant la terre conquise comme leur propre. Béla s’enfuit en Autriche, où le duc Frédéric II, connu sous le nom de Quarresome, prit son trésor et le força à promettre trois comtés occidentaux. Le Danube retenait les Mongols, et sur la rive lointaine les Hongrois gardaient les passages."
"In the hard winter of 1241–1242 the Danube froze, and around Christmas the Mongols crossed on the ice. They stormed Esztergom, the royal seat, though its citadel held out, and burned Buda. Székesfehérvár, protected by marshes, held out, as did the abbey of Pannonhalma and other stone fortresses. Hungary had few such castles, and the lesson was not lost; after the invasion Béla encouraged nobles and towns to build them. Meanwhile, on 11 December 1241, the Great Khan Ögedei had died in Mongolia.": "Pendant l’hiver dur de 1241–1242, le Danube s’est gelé et, vers Noël, les Mongols ont traversé la glace. Ils ont pris Esztergom, le siège royal, bien que sa citadelle ait tenu, et brûlé Buda. Székesfehérvár, protégé par des marais, a tenu dehors, comme l’abbaye de Pannonhalma et d’autres forteresses en pierre. La Hongrie avait peu de tels châteaux, et la leçon n’était pas perdue ; après l’invasion Béla a encouragé les nobles et les villes à les construire. Entre-temps, le 11 décembre 1241, le Grand Khan Ögedei était mort en Mongolie."
