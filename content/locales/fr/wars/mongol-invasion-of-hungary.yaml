"From Zagreb Béla fled to the Dalmatian coast with his family, and a Mongol force under Kadan pursued him across Croatia. In March 1242 it attacked the fortress of Klis above Split, believing the king was there, and threatened Split and Trogir, while Béla waited on an island off Trogir, ready to flee by sea. Finding him out of reach, the Mongols rode south through the hinterland of the coast, sacking Kotor and other towns, and turned inland.": "De Zagreb Béla s’enfuit sur la côte dalmate avec sa famille, et une force mongol sous Kadan le poursuivit à travers la Croatie. En mars 1242 il attaqua la forteresse de Klis au-dessus de Split, croyant que le roi était là, et menaça Split et Trogir, tandis que Béla attendait sur une île au large de Trogir, prête à fuir par la mer. En le trouvant hors de portée, les Mongols montèrent vers le sud à travers l’arrière-pays de la côte, saccageant Kotor et d’autres villes, et se retournèrent à l’intérieur des terres."
"In the spring of 1242 the Mongols left Hungary as suddenly as they had come, the main army withdrawing through Serbia and Bulgaria, which they plundered and forced to pay tribute, to the steppe north of the Black Sea. Why Batu left is still debated. The death of Ögedei, losses and Cuman unrest, and a cold, wet spring that flooded the plains have all been suggested. Hungary was devastated; estimates of the dead range from 15 to 25 per cent of the population. Béla rebuilt the kingdom, building castles and inviting settlers, and is remembered as its second founder.": "Au printemps de 1242, les Mongols quittèrent la Hongrie aussi soudainement qu’ils étaient venus, l’armée principale se retirant à travers la Serbie et la Bulgarie, qu’ils pillèrent et forcèrent à rendre hommage, à la steppe au nord de la mer Noire. La Hongrie a été dévastée ; les estimations des morts vont de 15 à 25 pour cent de la population. Béla reconstruit le royaume, construisant des châteaux et invitant les colons, et est rappelé comme son deuxième fondateur."
