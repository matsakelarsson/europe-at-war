"In 1239 King Béla IV of Hungary took in Köten and tens of thousands of Cumans fleeing the Mongols, which angered both the Mongols and many Hungarian nobles. Having conquered the Rus’ principalities, the Mongols attacked Hungary in March 1241. Batu and Subutai’s main army broke through the barricades at the Verecke Pass on 12 March, while other columns crossed the Carpathians into Transylvania, destroying Rodna and Várad, and a northern force came down from Poland. At Pest, where Béla was gathering his army, a mob killed Köten, suspected of treachery, and the Cumans left, plundering as they went.": "En 1239, le roi de Hongrie Béla IV prit à Köten et des dizaines de milliers de Cumans fuyant les Mongols, ce qui irrité à la fois les Mongols et de nombreux nobles hongrois. L’armée principale de Batu et Subutai a traversé les barricades du col de Verecke le 12 mars, tandis que d’autres colonnes ont traversé les Carpates en Transylvanie, détruisant Rodna et Várad, et une force nord est descendue de Pologne. À Pest, où Béla rassemblait son armée, une foule a tué Köten, soupçonné de trahison, et les Cumans sont partis, pillant au fur et à mesure qu’ils allaient."
"Béla marched east after the Mongol vanguard to the river Sajó, where his army camped near the village of Mohi inside a ring of wagons. On the night of 10–11 April the Mongols forced the bridge with the help of stone-throwers, while Subutai crossed further south. At dawn they surrounded the camp, leaving a gap through which the Hungarians fled, and cut them down along the road to Pest. Many thousands were killed, among them the archbishops of Esztergom and Kalocsa. Béla escaped; his brother Coloman died of his wounds.": "Béla marcha vers l’est après l’avant-garde mongol jusqu’à la rivière Sajó, où son armée campait près du village de Mohi à l’intérieur d’un anneau de wagons. Dans la nuit du 10 au 11 avril, les Mongols forçèrent le pont avec l’aide de lanceurs de pierres, tandis que Subutai traversait plus au sud. Des milliers de personnes ont été tuées, parmi lesquelles les archevêques d’Esztergom et Kalocsa. Béla s’est échappé ; son frère Coloman est mort de ses blessures."
