# Some French text was translated automatically.
"Mongol invasion of Hungary": "Invasion mongole de la Hongrie"
"The invasion of the Kingdom of Hungary by the Mongol armies of Batu and Subutai in 1241–1242. They destroyed King Béla IV’s army at Mohi on the Sajó on 11 April 1241, ravaged the country east of the Danube for most of the year, crossed the frozen river in the winter and pursued Béla to the Dalmatian coast, before withdrawing through Serbia and Bulgaria in the spring of 1242. Perhaps a fifth of Hungary’s people died.": "L’invasion du Royaume de Hongrie par les armées mongols de Batu et Subutai en 1241-1242. Ils détruisirent l’armée du roi Béla IV à Mohi sur le Sajó le 11 avril 1241, ravageèrent le pays à l’est du Danube pendant la majeure partie de l’année, traversèrent le fleuve gelé en hiver et poursuivirent Béla jusqu’à la côte dalmate, avant de se retirer à travers la Serbie et la Bulgarie au printemps de 1242. Peut-être qu’un cinquième des Hongrois est mort."
"The main sources are the Carmen miserabile of Master Roger, a canon of Várad who was captured by the Mongols and escaped, the history of Thomas, archdeacon of Split, and the Persian historians who wrote for the Mongols, among them Rashid al-Din. Numbers of soldiers and of the dead are very uncertain.": "Les principales sources sont la Carmen miserabile de Maître Roger, un canon de Várad qui a été capturé par les Mongols et échappé, l’histoire de Thomas, archidiacre de Split, et les historiens perses qui ont écrit pour les Mongols, parmi eux Rashid al-Din. Nombres de soldats et des morts sont très incertains."
"The invasion of Poland in the same months, with the battle of Legnica, has its own entry. Hungary was invaded again by the Golden Horde in 1285–1286.": "L’invasion de la Pologne dans les mêmes mois, avec la bataille de Legnica, a sa propre entrée. La Hongrie a été envahie à nouveau par la Horde d’Or en 1285-1286."
