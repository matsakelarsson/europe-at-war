# French translations of the catalogue text (wave 11); step bodies follow later.
Mongol invasion of Java: Invasion mongole de Java
? "The Yuan expedition that Kublai Khan sent to Java to punish King Kertanagara of Singhasari, who had refused to submit and had sent back the emperor’s envoy Meng Qi with his face branded. Before the fleet arrived, Kertanagara had been overthrown and killed in 1292 by Jayakatwang, the vassal king of Kediri, and his son-in-law Raden Wijaya had submitted to Jayakatwang and founded a settlement at Majapahit in the Tarik forest on the Brantas. When the Yuan army of 20,000 to 30,000 men landed at Tuban early in 1293, Wijaya offered his submission to the emperor and his help against Kediri. Together they defeated Jayakatwang’s fleet at the mouth of the Brantas, beat off his attack on Majapahit and in April took his capital, Daha, where he surrendered. Wijaya then turned on his allies: he ambushed a Yuan escort, attacked their camp and harried them back to their ships, and the Yuan army sailed home with heavy losses, killing Jayakatwang before it left. On 10 November 1293 Wijaya was crowned at Majapahit as Kertarajasa Jayawardhana, the first king of the empire that was to dominate the archipelago for two centuries. It was the last of Kublai Khan’s overseas expeditions."
: "L’expédition Yuan que Kubilai Khan envoya à Java pour punir le roi Kertanagara de Singhasari, qui avait refusé de se soumettre et renvoyé l’envoyé de l’empereur, Meng Qi, le visage marqué au fer. Avant l’arrivée de la flotte, Kertanagara avait été renversé et tué en 1292 par Jayakatwang, roi vassal de Kediri, et son gendre Raden Wijaya s’était soumis à Jayakatwang et avait fondé un établissement à Majapahit, dans la forêt de Tarik, sur le Brantas. Lorsque l’armée Yuan, forte de 20 000 à 30 000 hommes, débarqua à Tuban au début de 1293, Wijaya offrit sa soumission à l’empereur et son aide contre Kediri. Ensemble, ils vainquirent la flotte de Jayakatwang à l’embouchure du Brantas, repoussèrent son attaque contre Majapahit et prirent en avril sa capitale, Daha, où il se rendit. Wijaya se retourna alors contre ses alliés : il tendit une embuscade à une escorte Yuan, attaqua leur camp et les harcela jusqu’à leurs navires, et l’armée Yuan reprit la mer après de lourdes pertes, non sans avoir tué Jayakatwang avant son départ. Le 10 novembre 1293, Wijaya fut couronné à Majapahit sous le nom de Kertarajasa Jayawardhana, premier roi de l’empire qui allait dominer l’archipel pendant deux siècles. Ce fut la dernière des expéditions outre-mer de Kubilai Khan."
