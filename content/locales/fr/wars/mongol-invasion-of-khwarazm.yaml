# French translations of the catalogue text (wave 7); step bodies follow later.
Mongol invasion of the Khwarazmian Empire: Invasion mongole de l’Empire khwarezmien
The invasion in which Genghis Khan destroyed the Khwarazmian Empire, which stretched from the Syr Darya to the Persian Gulf and from the Zagros to the Indus. After the governor of Otrar killed the merchants of a Mongol caravan in 1218 and the Khwarazmshah Muhammad II killed one of Genghis Khan’s envoys, the Mongols crossed the Syr Darya in the autumn of 1219. The Shah spread his troops among the cities, and the Mongols took them one by one, Otrar, Bukhara and Samarkand in 1220, Gurganj, Merv, Nishapur and Herat in 1221, killing much of their populations. Muhammad fled west and died on a Caspian island at the end of 1220. His son Jalal al-Din beat a Mongol army at Parwan but was routed by Genghis Khan on the Indus in November 1221. The war was among the most destructive in history; Khorasan and Transoxiana took generations to recover.: L’invasion au cours de laquelle Gengis Khan détruisit l’Empire khwarezmien, qui s’étendait du Syr-Daria au golfe Persique et du Zagros à l’Indus. Après que le gouverneur d’Otrar eut tué les marchands d’une caravane mongole en 1218 et que le shah du Khwarezm Muhammad II eut tué l’un des envoyés de Gengis Khan, les Mongols franchirent le Syr-Daria à l’automne 1219. Le shah répartit ses troupes entre les villes, et les Mongols les prirent l’une après l’autre – Otrar, Boukhara et Samarcande en 1220, Gurganj, Merv, Nichapur et Hérat en 1221 –, massacrant une grande partie de leurs habitants. Muhammad s’enfuit vers l’ouest et mourut sur une île de la Caspienne à la fin de 1220. Son fils Jalal al-Din battit une armée mongole à Parwan, mais fut mis en déroute par Gengis Khan sur l’Indus en novembre 1221. Cette guerre compte parmi les plus destructrices de l’histoire ; le Khorassan et la Transoxiane mirent des générations à s’en remettre.
