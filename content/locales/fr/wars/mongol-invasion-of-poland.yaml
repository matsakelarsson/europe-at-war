"Sandomierz and Kraków": "Sandomierz et Cracovie"
"Winter 1240 – March 1241": "Hiver 1240 – mars 1241"
"In the winter of 1240–1241, as the main Mongol armies under Batu and Subutai prepared to invade Hungary, a smaller force under Baidar, Kadan and Orda turned on the Polish duchies to keep their princes from helping the Hungarians. Riding out of Volhynia, which the Mongols had just conquered, it destroyed the stronghold of Sutiejsk and sacked Lublin. In February 1241 it crossed the frozen Vistula, beat a Polish force near Tursko and took Sandomierz, which was sacked after it surrendered on 13 February.": "Au cours de l’hiver 1240-1241, alors que les principales armées mongoles sous Batu et Subutai se préparaient à envahir la Hongrie, une force plus petite sous Baidar, Kadan et Orda tournèrent sur les duchés polonais pour empêcher leurs princes d’aider les Hongrois. En février 1241, il a traversé la Vistule gelée, battu une force polonaise près de Tursko et pris Sandomierz, qui a été renvoyé après qu’il se soit rendu le 13 février."
"The force then split. Orda’s men ravaged central Poland as far as Łęczyca, while Baidar and Kadan headed for Kraków. On 18 March at Chmielnik they destroyed the knightly levies of Kraków and Sandomierz, whose voivodes were killed; Duke Bolesław V had already withdrawn. Many people fled Kraków for the forests and hills, and the Mongols burned the nearly empty city by 24 March. They crossed the Oder near Racibórz and rode on towards Wrocław, where, according to tradition, the townspeople burned their own town and held out in the castle.": "Les hommes d’Orda ont ravagé le centre de la Pologne jusqu’à Łęczyca, tandis que Baidar et Kadan se dirigeaient vers Cracovie. Le 18 mars à Chmielnik, ils détruisirent les prélèvements chevaliers de Cracovie et Sandomierz, dont les voïvodes furent tués ; le duc Bolesław V s’était déjà retiré. Beaucoup de gens ont fui Cracovie pour les forêts et les collines, et les Mongols ont brûlé la ville presque vide le 24 mars. Ils ont traversé l’Oder près de Racibórz et monté sur vers Wrocław, où, selon la tradition, les habitants ont brûlé leur propre ville et tenu dans le château."
