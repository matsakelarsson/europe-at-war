"Legnica, 9 April 1241": "Legnica, 9 avril 1241"
"April 1241": "avril 1241"
"Duke Henry II the Pious of Silesia, the strongest of the Polish princes, gathered his Silesians, survivors from Kraków and levies from Greater Poland, troops from Opole under Mieszko II the Fat, Moravians, miners from Złotoryja and a few dozen Templars. Estimates of his army range from about 2,000 to 25,000. His brother-in-law, King Wenceslaus I of Bohemia, was marching to join him with a larger army. The Mongols left Wrocław to strike before the two could meet, and on 9 April they caught Henry at Legnickie Pole, south-east of Legnica.": "Le duc Henri II le Pieux de la Silésie, le plus fort des princes polonais, a rassemblé ses Silésiens, survivants de Cracovie et prélèvements de la Grande Pologne, troupes d’Opole sous Mieszko II le Fat, Moraves, mineurs de Złottoryja et quelques dizaines de Templiers. Son beau-frère, le roi Wenceslaus Ier de Bohême, marchait pour le rejoindre avec une armée plus grande. Les Mongols quittèrent Wrocław pour frapper avant que les deux ne puissent se rencontrer, et le 9 avril ils attrapent Henry à Legnickie Pole, au sud-est de Legnica."
"Mongol horsemen drew the Polish cavalry out with feigned retreats, cut it off from the infantry behind a smokescreen and destroyed the army piece by piece. Henry was killed as he tried to escape, and his head was carried on a spear before the walls of Legnica. The Mongols did not stay. After a clash with Bohemian cavalry near Kłodzko they rode south through Moravia to join the main army, which had crushed the Hungarians at Mohi on 11 April. Henry’s death set back the reunification of Poland for decades.": "Les cavaliers mongols tirèrent la cavalerie polonaise avec des retraites feignées, la coupèrent de l’infanterie derrière un écran de fumée et détruisirent le morceau de l’armée par pièce. Henry fut tué alors qu’il tentait de s’échapper, et sa tête fut portée sur une lance devant les murs de Legnica. Après un affrontement avec la cavalerie bohème près de Kłodzko, ils montèrent au sud à travers la Moravie pour rejoindre l’armée principale qui avait écrasé les Hongrois à Mohi le 11 avril. La mort d’Henry a retardé la réunification de la Pologne pendant des décennies."
