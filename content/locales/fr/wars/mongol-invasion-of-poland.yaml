# Some French text was translated automatically.
"Mongol invasion of Poland": "Invasion mongole de la Pologne"
"A Mongol raid on the divided Polish duchies, sent to protect the flank of the main Mongol invasion of Hungary. In early 1241 the Mongols sacked Sandomierz and Kraków and destroyed a Polish and allied army at Legnica on 9 April, killing Duke Henry II the Pious, before riding south to join the main army.": "Un raid mongol sur les duchés polonais divisés, envoyé pour protéger le flanc de la principale invasion mongole de Hongrie. Au début de 1241 les Mongols ont renvoyé Sandomierz et Cracovie et détruit une armée polonaise et alliée à Legnica le 9 avril, tuant le Duc Henri II le Pieux, avant de monter au sud pour rejoindre l’armée principale."
"Much of the detail comes from Jan Długosz, writing more than two centuries later, and the sources often disagree on dates and numbers. Some give 3 March rather than 13 February for the fight at Tursko.": "Une grande partie du détail vient de Jan Długosz, qui écrit plus de deux siècles plus tard, et les sources souvent en désaccord sur les dates et les chiffres. Certains donnent 3 mars plutôt que 13 février pour la lutte à Tursko."
"Poland was then divided among several dukes of the Piast dynasty; Henry the Pious of Silesia also ruled Kraków as high duke.": "La Pologne fut ensuite divisée entre plusieurs ducs de la dynastie Piast ; Henry le pieux de Silésie gouverna aussi Cracovie comme haut duc."
