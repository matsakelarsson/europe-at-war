"January – March 1238": "janvier – mars 1238"
"From Ryazan the Mongols moved up the frozen rivers into the grand principality of Vladimir. In January 1238 they beat Yuri II’s army under his son Vsevolod at Kolomna, where Kulkan, a son of Genghis Khan, was killed. Moscow, then a small fortified town, was burned and Yuri’s son Vladimir taken prisoner. Yuri had left his capital to raise troops in the north. On 3 February the Mongols reached Vladimir and on 7 February they stormed it. The grand prince’s wife and family, who had taken refuge in the Dormition Cathedral, died when it was set on fire.": "De Ryazan les Mongols ont monté les rivières gelées dans la grande principauté de Vladimir. En Janvier 1238, ils battent Yuri II's armée sous son fils Vsevolod à Kolomna, où Kulkan, un fils de Genghis Khan, a été tué. Moscou, puis une petite ville fortifiée, a été brûlée et le fils Yurií Vladimir fait prisonnier. Yuri avait quitté sa capitale pour élever des troupes au nord. Le 3 février, les Mongols arrivèrent à Vladimir et le 7 février, ils l’entraînèrent. L’épouse et la famille du grand prince, qui s’étaient réfugiées dans la cathédrale de Dormition, moururent quand elle fut incendiée."
"Suzdal fell the same week, and Mongol columns spread out across the north-east. The chronicles list fourteen towns taken that February, from Rostov and Yaroslavl to Tver; some, such as Rostov and Uglich, seem to have submitted and escaped the worst. Yuri gathered his army on the Sit, a river north of the Volga. On 4 March 1238 a Mongol force under Burundai caught it unprepared and destroyed it, and Yuri was killed. His brother Yaroslav, prince of Kiev, came north to take over the ruined principality.": "Suzdal tomba la même semaine, et les colonnes mongols s’étendirent à travers le nord-est. Les chroniques énumèrent quatorze villes prises en février, de Rostov et Yaroslavl à Tver ; certaines, comme Rostov et Uglich, semblent avoir soumis et échappé au pire. Yuri rassembla son armée sur la Sit, une rivière au nord de la Volga. Le 4 mars 1238, une force mongole sous Burundai l’attrape et la détruit, et Yuri est tué. Son frère Yaroslav, prince de Kiev, vient au nord pour prendre le contrôle de la principauté ruinée."
