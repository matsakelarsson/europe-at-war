"1236–1237": "1236–1237"
"In 1235 a kurultai, the great council of the Mongols, sent Batu, a grandson of Genghis Khan, with the veteran general Subutai and many princes of Genghis’s line to conquer the lands to the west. Their armies, which included many Turkic troops, gathered on the lower Volga in 1236. That autumn they destroyed Volga Bulgaria and its great trading city of Bilär. In 1237 they fought the Cumans and Alans in the steppe and subdued the Mordvins and Burtas on the forest edge, and by the end of the year they stood on the border of Ryazan, the southernmost Rus’ principality.": "En 1235, un kurultai, le grand conseil des Mongols, envoya Batu, petit-fils de Genghis Khan, avec l’ancien général Subutai et de nombreux princes de la ligne de Gengis pour conquérir les terres à l’ouest. Leurs armées, qui comprenait beaucoup de troupes turques, se rassemblèrent sur la basse Volga en 1236. Cet automne ils détruisirent Volga Bulgarie et sa grande ville commerçante de Bilär. En 1237, ils combattirent les Cumans et les Alans dans la steppe et subduisirent les Mordvins et Burtas à la lisière de la forêt."
"According to the Novgorod chronicle, Mongol envoys demanded a tenth of everything: people, horses and goods. The princes of Ryazan refused, and Grand Prince Yuri II of Vladimir sent no help. The Mongols beat Ryazan’s forces on the Voronezh river and on 16 December 1237 surrounded its capital. Catapults broke the wooden walls, and on 21 December the city was stormed. Prince Yuri Igorevich and his family were killed with most of the inhabitants, and archaeologists have found mass graves from the sack. Old Ryazan never fully recovered; its princes later moved to Pereyaslavl-Ryazansky, today’s Ryazan.": "Selon la chronique de Novgorod, les envoyés mongols exigeaient un dixième de tout : des gens, des chevaux et des biens. Les princes de Ryazan refusèrent, et le Grand Prince Yuri II de Vladimir n’envoya aucune aide. Les Mongols battèrent les forces de Ryazan sur la rivière Voronezh et, le 16 décembre 1237, entourèrent sa capitale. Le prince Igorevitch et sa famille ont été tués avec la plupart des habitants, et les archéologues ont trouvé des fosses communes dans le sac. Vieux Riazan ne s’est jamais complètement rétabli ; ses princes plus tard se sont déplacés à Pereyaslavl-Ryazansky, aujourd'hui de Ryazan."
