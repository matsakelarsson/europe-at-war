"Another Mongol force besieged Torzhok, Novgorod’s outpost on the road to the grain lands of the south. It held out for two weeks, hoping for help from Novgorod that never came, and fell on 5 March. The Mongols then rode north-west towards Novgorod itself, but about a hundred versts from the city, at a place the chronicles call the Ignach Cross, they turned back. The spring thaw was coming, which would turn the forests and marshes into a morass, and the army had suffered heavy losses. Novgorod, the richest city of the north, was spared.": "Une autre force mongole a assiégé Torzhok, avant-poste de Novgorod sur la route vers les terres céréalières du sud. Il s’est tenu pendant deux semaines, espérant l’aide de Novgorod qui n’est jamais venu, et est tombé le 5 Mars. Les Mongols montèrent ensuite vers le nord-ouest en direction de Novgorod elle-même, mais une centaine de verstes de la ville, à un endroit que les chroniques appellent la Croix d’Ignach, se retournèrent. Le dégel printanier venait, qui allait transformer les forêts et les marais en un morose, et l’armée avait subi de lourdes pertes."
"Heading south, the Mongols passed east of Smolensk, which was also spared, and at the end of March reached Kozelsk, a small town of the Chernigov lands whose prince, Vasily, was a boy of about twelve. Protected by its ramparts and the flooded rivers, the town held out for seven weeks and is said to have killed 4,000 of the besiegers. When it fell in May, the Mongols killed everyone; the chronicle says the young prince drowned in blood, and that the Mongols called Kozelsk the “evil town”. They then withdrew into the steppe to rest.": "Vers le sud, les Mongols passèrent à l’est de Smolensk, qui fut également épargnée, et à la fin du mois de mars atteignirent Kozelsk, une petite ville des terres de Chernigov dont le prince, Vasily, était un garçon d’environ douze. Protégé par ses remparts et les rivières inondées, la ville s’arrêta pendant sept semaines et aurait tué 4 000 assiéges. Quand il est tombé en mai, les Mongols ont tué tout le monde ; la chronique dit que le jeune prince noyé dans le sang, et que les Mongols appelaient Kozelsk la ville du mal. Ils se sont alors retirés dans la steppe pour se reposer."
