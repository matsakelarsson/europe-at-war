"1240–1243": "1240–1243"
"Batu’s cousin Möngke had demanded Kiev’s surrender, and his envoys were killed. Its prince, Michael of Chernigov, fled to Hungary, and by 1240 the city was held for Prince Daniel of Galicia by his commander, Dmytro. In late November 1240, once the river had frozen, Batu’s whole army crossed and surrounded Kiev. Catapults battered the walls, and on 6 December the Mongols broke in. The last defenders crowded into the Church of the Tithes, which collapsed under their weight. Most of the people were killed; a papal envoy who passed in 1246 saw countless skulls and bones and only about 200 houses.": "Son prince, Michael de Chernigov, s’est enfui en Hongrie et, vers 1240, la ville a été retenue pour le Prince Daniel de Galice par son commandant, Dmytro. Fin novembre 1240, une fois que le fleuve avait gelé, toute l’armée de Batu arrivait à traverser et encerclé Kiev. Les catapultes battaient les murs et, le 6 décembre, les Mongols entraient par effraction. Les derniers défenseurs se pressaient dans l’église des Tithes, qui s’écroulait sous leur poids. La plupart des gens furent tués ; un envoyé papal qui passa en 1246 vit d’innombrables crânes et os et seulement environ 200 maisons."
"The Mongols moved on through Volhynia and Galicia in the winter of 1240–1241, taking Volodymyr and Halych, though Kremenets and a few other strongholds held out. In 1241 they invaded Poland and Hungary. News of the death of the Great Khan Ögedei reached them, and in 1242 Batu led his army back to the lower Volga, leaving Rus’ in ruins. Many towns had been burned, many thousands of people killed or carried off, and stone building stopped for decades.": "En 1241, ils envahirent la Pologne et la Hongrie. Des nouvelles de la mort du Grand Khan Ögedei les atteignirent, et en 1242, Batu conduisit son armée vers la basse Volga, laissant Rus dans les ruines. De nombreuses villes ont été incendiées, des milliers de personnes tuées ou emportées, et la construction de pierres a cessé pendant des décennies."
"Batu’s realm, the ulus of Jochi, later known as the Golden Horde, held the steppe from the lower Danube to beyond the Urals, with its capital at Sarai on the Volga. The Rus’ principalities kept their own princes, but each prince had to travel to the khan, and sometimes on to Karakorum in Mongolia, to receive a patent to rule, the yarlik. In 1243 Yaroslav of Vladimir was the first to be confirmed as senior prince of Rus’. Censuses were taken in the 1250s, and tribute was paid to the Horde for more than two centuries.": "Le royaume de Bâtou, le ulus de Jotchi, plus tard connu comme la Horde d’Or, tenait la steppe du Danube inférieur jusqu’au-delà de l’Oural, avec sa capitale à Saraï sur la Volga. Les principautés de Ruso gardaient leurs propres princes, mais chaque prince devait se rendre au khan, et parfois à Karakorum en Mongolie, pour recevoir un brevet pour gouverner, le yarlik. En 1243 Yaroslav de Vladimir a été le premier à être confirmé comme prince senior de Rus. Recensements ont été pris dans les 1250, et hommage a été rendu à la Horde pendant plus de deux siècles."
