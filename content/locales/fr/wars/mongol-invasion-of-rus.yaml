"1239": "1239"
"Mongol invasion of Rus’": "Invasion mongole de la Rus"
"The conquest of the Rus’ principalities by the Mongol armies of Batu Khan, who sacked Ryazan, Vladimir, Chernigov and Kiev between 1237 and 1240. The principalities kept their own princes but became tributaries of the Golden Horde, whose khans confirmed each prince with a patent, the yarlik, for more than two centuries.": "La conquête des principautés de Rus par les armées mongoles de Batu Khan, qui ont limogé Ryazan, Vladimir, Chernigov et Kiev entre 1237 et 1240. Les principautés gardaient leurs propres princes mais sont devenus affluents de la Horde d’Or, dont les khans confirmèrent chaque prince avec un brevet, le yarlik, pendant plus de deux siècles."
"The dates come from the Rus’ chronicles, which use the Julian calendar and often contradict one another; Persian and Chinese sources, such as Rashid al-Din, add some details from the Mongol side. Numbers in all of them are unreliable.": "Les dates viennent des chroniques Rus, qui utilisent le calendrier julien et souvent se contredisent ; des sources persanes et chinoises, comme Rashid al-Din, ajoutent quelques détails du côté mongol."
"The Rus’ chroniclers called the invaders Tatars. The raid on Poland and Hungary that followed in 1241 is told under the Mongol invasion of Poland.": "Les chroniqueurs de Rus-Tatar appelés les envahisseurs. Le raid sur la Pologne et la Hongrie qui a suivi en 1241 est raconté sous l’invasion mongol de la Pologne."
"Rus’ was divided into many principalities ruled by branches of the Rurikid dynasty. The strongest were Vladimir-Suzdal in the north-east, Novgorod in the north, and Chernigov, Kiev and Galicia–Volhynia in the south.": "Rus a été divisé en plusieurs principautés gouvernées par des branches de la dynastie rurikide. Les plus forts étaient Vladimir-Suzdal dans le nord-est, Novgorod dans le nord, et Chernigov, Kiev et Galice–Volhynie dans le sud."
