"The Mongols spent 1238 and 1239 subduing the steppe. They drove the Cumans west, and their khan Köten fled to Hungary with, it is said, 40,000 families. Other forces conquered the Alans in the north Caucasus and the Crimean steppe, and raiding parties struck the north again in 1239, burning Murom and Gorokhovets and fighting along the Klyazma. By then most of the princes of Rus’ were quarrelling over Kiev and Galicia rather than preparing to defend themselves.": "Les Mongols ont passé 1238 et 1239 sous la steppe. Ils ont conduit les Cumans à l’ouest, et leur khan Köten s’est enfui en Hongrie avec, dit-on, 40 000 familles. D’autres forces ont conquis les Alans dans le nord du Caucase et la steppe de Crimée, et les parties attaquant frappent de nouveau le nord en 1239, brûlant Murom et Gorokhovets et combattant le long de la Klyazma. À l’époque, la plupart des princes de Rus étaient en querelle pour Kiev et Galice plutôt que de se préparer à se défendre."
"On 3 March 1239 the Mongols stormed Pereyaslavl, south-east of Kiev, burned it and killed Bishop Simeon and many of the townspeople. In the autumn they besieged Chernigov, one of the largest cities of Rus’. A relief army under Prince Mstislav Glebovich was beaten outside the walls, and the city was taken and burned on 18 October 1239. Its bishop was taken prisoner and later let go. The left bank of the Dnieper was now in Mongol hands, and Kiev lay across the river.": "Le 3 mars 1239, les Mongols s’emparèrent de Pereyaslavl, au sud-est de Kiev, le brûlèrent et tuèrent Mgr Simeon et beaucoup de citadins. À l’automne, ils assiégea Chernigov, une des plus grandes villes de Rus. Une armée de secours sous le prince Mstislav Glebovich fut battue à l’extérieur des murs, et la ville fut prise et brûlée le 18 octobre 1239. Son évêque a été fait prisonnier et plus tard relâché. La rive gauche du Dniepr était maintenant entre les mains de Mongol, et Kiev se trouvait en face de la rivière."
