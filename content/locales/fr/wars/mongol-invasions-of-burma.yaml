# French translations of the catalogue text (wave 11); step bodies follow later.
Mongol invasions of Burma: Invasions mongoles de la Birmanie
The wars between the Mongol Yuan dynasty, which had made the old Dali Kingdom its province of Yunnan, and the Pagan Kingdom of Burma. After King Narathihapate refused Kublai Khan’s demands for tribute, Mongol troops defeated a Burmese army at Ngasaunggyan on the frontier in 1277. In 1283–1285 a Mongol army took the forts of the upper Irrawaddy and Tagaung, and Narathihapate fled to Lower Burma. A treaty of 1287 accepted Mongol overlordship, but the king was murdered by one of his sons that July and a Mongol army marched south again; whether it reached Pagan is disputed. The Pagan empire broke apart, and power in central Burma passed to three brothers based at Myinsaing. When they deposed the king the Mongols had recognised, a Yuan army of about 12,000 besieged Myinsaing in 1301 but withdrew after the brothers paid it off, and in 1303 the Mongols left northern Burma.: Les guerres entre la dynastie mongole des Yuan, qui avait fait de l’ancien royaume de Dali sa province du Yunnan, et le royaume birman de Pagan. Après que le roi Narathihapate eut refusé le tribut exigé par Kubilai Khan, les troupes mongoles vainquirent une armée birmane à Ngasaunggyan, à la frontière, en 1277. En 1283–1285, une armée mongole prit les forts du haut Irrawaddy et Tagaung, et Narathihapate s’enfuit en Basse-Birmanie. Un traité de 1287 accepta la suzeraineté mongole, mais le roi fut assassiné par l’un de ses fils en juillet de la même année et une armée mongole repartit vers le sud ; la question de savoir si elle atteignit Pagan est débattue. L’empire de Pagan se disloqua, et le pouvoir en Birmanie centrale passa à trois frères établis à Myinsaing. Lorsqu’ils déposèrent le roi que les Mongols avaient reconnu, une armée Yuan d’environ 12 000 hommes assiégea Myinsaing en 1301, mais se retira après que les frères l’eurent achetée, et en 1303 les Mongols quittèrent le nord de la Birmanie.
