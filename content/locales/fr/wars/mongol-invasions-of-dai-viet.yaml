# French translations of the catalogue text (wave 11); step bodies follow later.
Mongol invasions of Đại Việt and Champa: Invasions mongoles du Đại Việt et du Champa
Four campaigns of the Mongol Empire and Kublai Khan’s Yuan dynasty against Đại Việt, ruled by the Trần dynasty, and Champa. In January 1258 Uriyangkhadai, coming from the newly conquered kingdom of Dali, routed the Trần army and took Thăng Long, which he left after a few days; the Trần then sent tribute. In 1283 a Yuan fleet under Sogetu landed in Champa and took its capital Vijaya, but the Cham king withdrew to the hills and fought on. In 1285 Kublai’s son Toghon invaded Đại Việt, took Thăng Long and, with Sogetu marching north from Champa, drove the Trần court to the coast; by June a Vietnamese counter-offensive led by Trần Hưng Đạo had killed Sogetu and driven the Yuan armies out. A third invasion in 1287–1288 again took the capital, but the loss of its supply fleet at Vân Đồn forced a retreat, and on 9 April 1288 its fleet was destroyed on the stakes of the Bạch Đằng. Đại Việt and Champa kept their independence and sent tribute to the Yuan; Vietnam remembers the wars as a national victory.: Quatre campagnes de l’Empire mongol et de la dynastie Yuan de Kubilai Khan contre le Đại Việt, gouverné par la dynastie Trần, et contre le Champa. En janvier 1258, Uriyangkhadai, venu du royaume de Dali récemment conquis, mit en déroute l’armée des Trần et prit Thăng Long, qu’il quitta au bout de quelques jours ; les Trần envoyèrent ensuite un tribut. En 1283, une flotte Yuan commandée par Sogetu débarqua au Champa et prit sa capitale, Vijaya, mais le roi cham se retira dans les collines et poursuivit la lutte. En 1285, Toghon, fils de Kubilai, envahit le Đại Việt, prit Thăng Long et, tandis que Sogetu remontait vers le nord depuis le Champa, repoussa la cour des Trần jusqu’à la côte ; dès juin, une contre-offensive vietnamienne menée par Trần Hưng Đạo avait tué Sogetu et chassé les armées Yuan. Une troisième invasion, en 1287–1288, prit de nouveau la capitale, mais la perte de sa flotte de ravitaillement à Vân Đồn la contraignit à la retraite, et le 9 avril 1288 sa flotte fut détruite sur les pieux du Bạch Đằng. Le Đại Việt et le Champa conservèrent leur indépendance et envoyèrent un tribut aux Yuan ; le Vietnam garde le souvenir de ces guerres comme d’une victoire nationale.
