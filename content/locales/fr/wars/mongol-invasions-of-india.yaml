# French translations of the catalogue text (wave 8); step bodies follow later.
Mongol invasions of India: Invasions mongoles de l’Inde
"The Mongol attacks on the Delhi Sultanate after Jalal al-Din’s flight across the Indus. In 1241 a Mongol army sacked Lahore, and for two decades the western Punjab and Sindh lay open to raids from Mongol-held Afghanistan. Sultan Balban answered with a chain of frontier forts, and his son Prince Muhammad was killed fighting the Mongols in 1285. The great invasions came from the Chagatai Khanate under its khan Duwa: Alauddin Khalji’s armies beat them at Jaran-Manjur (1298) and Sivistan, held them at Kili outside Delhi (1299), outlasted a two-month siege of Delhi in 1303 and crushed them at Amroha (1305) and on the Ravi (1306), killing or enslaving tens of thousands of prisoners. After Duwa’s death in 1307 the raids dwindled; the last major one, under the Chagatai prince Tarmashirin in 1327, reached the Yamuna.": "Les attaques mongoles contre le sultanat de Delhi après la fuite de Djalal ad-Din au-delà de l’Indus. En 1241, une armée mongole pilla Lahore, et pendant deux décennies l’ouest du Pendjab et le Sind restèrent exposés aux raids lancés depuis l’Afghanistan tenu par les Mongols. Le sultan Balban répondit par une chaîne de forts frontaliers, et son fils, le prince Muhammad, fut tué en combattant les Mongols en 1285. Les grandes invasions vinrent du khanat de Djaghataï, sous son khan Duwa : les armées d’Alauddin Khalji les battirent à Jaran-Manjur (1298) et à Sivistan, les arrêtèrent à Kili, aux portes de Delhi (1299), tinrent bon pendant un siège de Delhi de deux mois en 1303 et les écrasèrent à Amroha (1305) et sur la Ravi (1306), tuant ou réduisant en esclavage des dizaines de milliers de prisonniers. Après la mort de Duwa en 1307, les raids s’espacèrent ; le dernier grand raid, mené par le prince djaghataïde Tarmashirin en 1327, atteignit la Yamuna."
