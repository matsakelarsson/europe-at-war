# French translations of the catalogue text (wave 10); step bodies follow later.
Mongol invasions of Japan: Invasions mongoles du Japon
? The two attempts by Kublai Khan, the Mongol emperor of the Yuan dynasty, to conquer Japan, with armies drawn from Mongols, Chinese, Jurchens and Koreans and ships and sailors levied from Goryeo and southern China. After the Kamakura shogunate, led by the young regent Hōjō Tokimune, ignored six embassies between 1266 and 1273, a fleet of some 900 ships sailed from Korea in November 1274, overran Tsushima and Iki and landed in Hakata Bay on 19 November. The invaders drove the Kyushu warriors inland and burned Hakata, but withdrew to their ships the same night, and many ships were wrecked by a storm on the way home. The shogunate executed Kublai’s next envoys and built a stone wall around Hakata Bay. In 1281, after the conquest of Song China, Kublai sent two fleets, an Eastern Route army from Korea and a much larger Southern Route army from China; Yuan records give 140,000 men, a figure modern historians think greatly inflated. The Eastern Route army could not get past the wall and was harried at sea and on the islands of Shika and Iki for weeks. When the two fleets had joined off Takashima in Imari Bay, a typhoon on the night of 15–16 August 1281 destroyed most of the ships, and the Japanese killed or captured the men left stranded on the island. The storms became the kamikaze, the “divine wind” sent by the gods to protect Japan, while the cost of the defence, which brought no conquered land to reward its warriors, weakened the shogunate.
: Les deux tentatives de Kubilai Khan, empereur mongol de la dynastie Yuan, pour conquérir le Japon, avec des armées composées de Mongols, de Chinois, de Jürchen et de Coréens, et des navires et des marins levés au Goryeo et dans le sud de la Chine. Après que le shogunat de Kamakura, dirigé par le jeune régent Hōjō Tokimune, eut ignoré six ambassades entre 1266 et 1273, une flotte de quelque 900 navires quitta la Corée en novembre 1274, submergea Tsushima et Iki et débarqua dans la baie de Hakata le 19 novembre. Les envahisseurs repoussèrent les guerriers du Kyushu vers l’intérieur des terres et incendièrent Hakata, mais regagnèrent leurs navires la nuit même, et de nombreux navires firent naufrage dans une tempête sur le chemin du retour. Le shogunat fit exécuter les envoyés suivants de Kubilai et construisit un mur de pierre autour de la baie de Hakata. En 1281, après la conquête de la Chine des Song, Kubilai envoya deux flottes, une armée de la route de l’Est partie de Corée et une armée de la route du Sud, bien plus nombreuse, partie de Chine ; les sources Yuan donnent 140 000 hommes, un chiffre que les historiens modernes jugent très exagéré. L’armée de la route de l’Est ne parvint pas à franchir le mur et fut harcelée en mer et sur les îles de Shika et d’Iki pendant des semaines. Alors que les deux flottes s’étaient rejointes au large de Takashima, dans la baie d’Imari, un typhon détruisit la plupart des navires dans la nuit du 15 au 16 août 1281, et les Japonais tuèrent ou capturèrent les hommes restés bloqués sur l’île. Les tempêtes devinrent le kamikaze, le « vent divin » envoyé par les dieux pour protéger le Japon, tandis que le coût de la défense, qui n’apporta aucune terre conquise pour récompenser ses guerriers, affaiblit le shogunat.
