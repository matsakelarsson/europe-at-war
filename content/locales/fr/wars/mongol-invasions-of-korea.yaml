# French translations of the catalogue text (wave 10); step bodies follow later.
Mongol invasions of Korea: Invasions mongoles de la Corée
? "A series of Mongol invasions of Goryeo over nearly three decades, which ended with Goryeo becoming a subordinate ally of the Mongol Yuan empire but keeping its own dynasty. After a Mongol envoy was killed on his way home from Goryeo in 1225, Saritai invaded in 1231, defeated the Goryeo army and forced the court to submit. In 1232 the military ruler Choe U moved the court to Ganghwa Island, off the west coast, which the Mongols never attacked, and told the people to take refuge in mountain fortresses and on islands; Saritai was killed by an arrow at Cheoin later that year. Further invasions in 1235–1239, 1247–1248 and 1253–1257 spread devastation across the country while the court held out on Ganghwa. Mountain fortresses such as Kuju and Chungju resisted long sieges, but the countryside was stripped: the chronicles record 206,800 people carried off in 1254 alone, and the nine-storey pagoda of Hwangnyongsa and the first printing blocks of the Buddhist canon were burned. In 1258 the last of the Choe dictators was killed, the north-east went over to the Mongols, and in 1259 the court made peace and sent the crown prince to the Mongol court. The court moved back to the old capital, Kaegyong, in 1270, which set off the Sambyeolcho rebellion."
: "Une série d’invasions mongoles du Goryeo étalées sur près de trois décennies, à l’issue desquelles le Goryeo devint un allié subordonné de l’empire mongol des Yuan, tout en conservant sa propre dynastie. Après qu’un envoyé mongol eut été tué sur le chemin du retour du Goryeo en 1225, Saritai envahit le pays en 1231, battit l’armée du Goryeo et força la cour à se soumettre. En 1232, le dirigeant militaire Choe U transféra la cour sur l’île de Ganghwa, au large de la côte ouest, que les Mongols n’attaquèrent jamais, et ordonna à la population de se réfugier dans des forteresses de montagne et sur des îles ; Saritai fut tué d’une flèche à Cheoin plus tard la même année. De nouvelles invasions, en 1235–1239, 1247–1248 et 1253–1257, répandirent la dévastation dans tout le pays tandis que la cour tenait bon à Ganghwa. Des forteresses de montagne comme Kuju et Chungju résistèrent à de longs sièges, mais les campagnes furent dépouillées : les chroniques rapportent que 206 800 personnes furent emmenées pour la seule année 1254, et la pagode à neuf étages du Hwangnyongsa ainsi que les premières planches d’impression du canon bouddhique furent brûlées. En 1258, le dernier des dictateurs Choe fut tué, le nord-est passa aux Mongols et, en 1259, la cour fit la paix et envoya le prince héritier à la cour mongole. La cour regagna l’ancienne capitale, Kaegyong, en 1270, ce qui déclencha la rébellion des Sambyeolcho."
