# French translations of the catalogue text (wave 9); step bodies follow later.
Mongol invasions of Tibet: Invasions mongoles du Tibet
? "The first Mongol campaign into central Tibet and the submission that followed. Tibet then had no central government; power was shared among the great monasteries and the noble families allied with them. In 1240 Köten (Godan), a son of Ögedei who held the former Tangut lands around Liangzhou, sent his general Doorda Darkhan, himself a Tangut, into central Tibet with a force given as 30,000 men, though probably much smaller. It reached the Phanyul valley north of Lhasa, burned the temple of Gyal Lhakhang and killed many monks at Reting; one account gives about 500 dead. The monastery of Drikung was spared. The Mongols withdrew, perhaps after the death of Ögedei in 1241. In 1244 Köten summoned Sakya Pandita, head of the Sakya school, who set out with his nephews Phagpa and Chakna Dorje, reached Liangzhou in 1246 and met Köten early in 1247. He accepted Mongol overlordship and in a letter of 1249 urged the lords of Tibet to submit and pay tribute, with the Sakya as their intermediaries. Further Mongol armies under Möngke in 1251–1255 brought most of Tibet under Mongol control, and from 1264 the Sakya governed it for the Yuan. Historians disagree on the date and purpose of the 1240 campaign, which some see as a reconnaissance or a raid for tribute, and on how far Tibet then became part of the Mongol state. The meaning of the relationship that began in 1247 is also contested: Chinese official histories treat it as the start of Chinese sovereignty over Tibet, while Tibetan and many Western historians describe it as a bond between a religious teacher and a lay patron, or as submission to the Mongol Empire rather than to China."
: "La première campagne mongole au Tibet central et la soumission qui suivit. Le Tibet n’avait alors pas de gouvernement central ; le pouvoir était partagé entre les grands monastères et les familles nobles qui leur étaient alliées. En 1240, Köten (Godan), un fils d’Ögedei qui tenait les anciennes terres tangoutes autour de Liangzhou, envoya au Tibet central son général Doorda Darkhan, lui-même tangoute, avec une force que les sources chiffrent à 30 000 hommes, mais sans doute bien moins nombreuse. Elle atteignit la vallée du Phanyul, au nord de Lhassa, incendia le temple de Gyal Lhakhang et tua de nombreux moines à Reting ; un récit fait état d’environ 500 morts. Le monastère de Drikung fut épargné. Les Mongols se retirèrent, peut-être après la mort d’Ögedei en 1241. En 1244, Köten convoqua Sakya Pandita, chef de l’école Sakya, qui se mit en route avec ses neveux Phagpa et Chakna Dorje, atteignit Liangzhou en 1246 et rencontra Köten au début de 1247. Il accepta la suzeraineté mongole et, dans une lettre de 1249, exhorta les seigneurs du Tibet à se soumettre et à payer tribut, les Sakya servant d’intermédiaires. Sous Möngke, de nouvelles armées mongoles placèrent en 1251–1255 la plus grande partie du Tibet sous contrôle mongol et, à partir de 1264, les Sakya le gouvernèrent pour le compte des Yuan. Les historiens ne s’accordent ni sur la date et le but de la campagne de 1240, que certains voient comme une reconnaissance ou un raid destiné à lever un tribut, ni sur la mesure dans laquelle le Tibet devint alors partie de l’État mongol. Le sens de la relation nouée en 1247 est lui aussi contesté : les histoires officielles chinoises y voient le début de la souveraineté chinoise sur le Tibet, tandis que les historiens tibétains et de nombreux historiens occidentaux la décrivent comme un lien entre un maître religieux et un protecteur laïc, ou comme une soumission à l’Empire mongol plutôt qu’à la Chine."
