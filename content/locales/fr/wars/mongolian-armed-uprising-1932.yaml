# French translations of the catalogue text (wave 9); step bodies follow later.
Armed uprising of 1932 in Mongolia: Soulèvement armé de 1932 en Mongolie
? A rising of herders, lamas and local officials in western and central Mongolia against the “leftist” policies of the Mongolian People’s Revolutionary Party. From 1929 the party, guided by the Comintern, confiscated the herds and property of nobles and monasteries, executed some 700 heads of households, forced herders into collectives and pressed young lamas to leave the monasteries; many herders slaughtered their animals rather than give them up. On 10–11 April 1932 lamas and herders rose at the Khyalganat monastery in Rashaant district of Khövsgöl province, and the revolt spread to Arkhangai, Zavkhan, Övörkhangai and Dörvöd. The insurgents, more than 3,000 of them with old rifles and flintlocks, killed party members and officials and destroyed 35 district centres and 45 cooperatives; some hoped for help from the Ninth Panchen Lama or Japan, though archives show no such support. Government troops under Jambyn Lkhümbe, with machine guns, armoured cars and aircraft supplied by the Soviet Union and Soviet advisers in some battles, defeated them in about fifteen battles by July; a second wave in southern Khövsgöl and northern Arkhangai in August was put down by the autumn. More than 1,500 people were killed, by most estimates; one Soviet document gives 8,000–10,000. In June 1932, on Moscow’s instructions, the party abandoned the leftist course for a “New Turn” policy, suspending collectivisation and easing the pressure on the monasteries, and blamed the leaders it had expelled in May.
: Un soulèvement d’éleveurs, de lamas et de fonctionnaires locaux dans l’ouest et le centre de la Mongolie contre la politique « gauchiste » du Parti révolutionnaire du peuple mongol. À partir de 1929, le parti, guidé par le Komintern, confisqua les troupeaux et les biens des nobles et des monastères, exécuta quelque 700 chefs de famille, contraignit les éleveurs à entrer dans des collectifs et poussa les jeunes lamas à quitter les monastères ; de nombreux éleveurs abattirent leurs bêtes plutôt que de les céder. Les 10 et 11 avril 1932, des lamas et des éleveurs se soulevèrent au monastère de Khyalganat, dans le district de Rashaant de la province de Khövsgöl, et la révolte s’étendit à l’Arkhangai, au Zavkhan, à l’Övörkhangai et au Dörvöd. Les insurgés, plus de 3 000, armés de vieux fusils et de fusils à silex, tuèrent des membres du parti et des fonctionnaires et détruisirent 35 centres de district et 45 coopératives ; certains espéraient l’aide du 9e panchen-lama ou du Japon, mais les archives ne montrent aucun soutien de ce genre. Les troupes gouvernementales de Jambyn Lkhümbe, dotées de mitrailleuses, d’automitrailleuses et d’avions fournis par l’Union soviétique, et appuyées dans certaines batailles par des conseillers soviétiques, les battirent au cours d’une quinzaine de combats, jusqu’en juillet ; une seconde vague dans le sud du Khövsgöl et le nord de l’Arkhangai, en août, fut réprimée à l’automne. Plus de 1 500 personnes furent tuées, selon la plupart des estimations ; un document soviétique avance le chiffre de 8 000 à 10 000. En juin 1932, sur instruction de Moscou, le parti abandonna la ligne gauchiste pour la politique du « Nouveau Tournant », suspendant la collectivisation et relâchant la pression sur les monastères, et rejeta la faute sur les dirigeants qu’il avait exclus en mai.
