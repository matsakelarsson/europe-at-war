# French translations of the catalogue text (wave 9); step bodies follow later.
Mongolian Revolution of 1911: Révolution mongole de 1911
? The movement by which Outer Mongolia broke away from the Qing empire during the Xinhai Revolution. Qing plans in the 1900s to settle Chinese farmers in Mongolia, raise an army and govern it directly alarmed the Mongol nobles and the Buddhist clergy, and in 1911 a group of them sent a secret mission to Russia to ask for help. When the revolution broke out in China, they formed a provisional government in Urga (today Ulaanbaatar) on 30 November 1911, disarmed the small garrison of the Qing amban Sandowa and sent him away under Russian escort. On 29 December the Jebtsundamba Khutuktu, the head of the Buddhist church in Mongolia, was enthroned as Bogd Khan of an independent Mongolian state. Qing officials at Uliastai left under Russian protection, the Barga Mongols of Hulunbuir took Hailar in January 1912, and in August 1912 Mongol forces took Khovd, the last Qing post in western Mongolia. Russia backed Mongolian autonomy, not full independence, and by the agreements of 1913 and 1915 Outer Mongolia was recognised as autonomous under Chinese suzerainty.
: Le mouvement par lequel la Mongolie-Extérieure se détacha de l’empire Qing pendant la révolution Xinhai. Les projets des Qing, dans les années 1900, d’installer des paysans chinois en Mongolie, d’y lever une armée et de l’administrer directement inquiétèrent les nobles mongols et le clergé bouddhiste, et en 1911 un groupe d’entre eux envoya une mission secrète en Russie pour demander de l’aide. Lorsque la révolution éclata en Chine, ils formèrent un gouvernement provisoire à Ourga (aujourd’hui Oulan-Bator) le 30 novembre 1911, désarmèrent la petite garnison de l’amban Qing Sandowa et le renvoyèrent sous escorte russe. Le 29 décembre, le Jebtsundamba Khutuktu, chef de l’Église bouddhiste de Mongolie, fut intronisé Bogdo Khan d’un État mongol indépendant. Les fonctionnaires Qing d’Uliastai partirent sous protection russe, les Mongols bargas du Hulunbuir prirent Hailar en janvier 1912 et, en août 1912, les forces mongoles prirent Khovd, le dernier poste Qing de l’ouest de la Mongolie. La Russie soutint l’autonomie mongole, et non une indépendance complète, et, par les accords de 1913 et de 1915, la Mongolie-Extérieure fut reconnue comme autonome sous suzeraineté chinoise.
