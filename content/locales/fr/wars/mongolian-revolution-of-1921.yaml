# French translations of the catalogue text (wave 9); step bodies follow later.
Mongolian Revolution of 1921: Révolution mongole de 1921
? The struggle over Outer Mongolia after the Russian Revolution, which ended with a Soviet-backed revolutionary government in Urga. In 1919 the Beiyang government of the Republic of China sent troops under Xu Shuzheng, who made the Mongolian nobles give up the autonomy Mongolia had won in 1911–1915. In February 1921 the White general Roman von Ungern-Sternberg and his Asiatic Cavalry Division drove the Chinese out of Urga and restored the Bogd Khan, the head of the Mongolian Buddhist church, as monarch, while killing Jews and suspected Bolsheviks. In March the Mongolian People’s Party, under Damdin Sükhbaatar, formed a provisional government on the Soviet border and took the Chinese post at Kyakhta. When Ungern attacked Soviet territory in June, the Red Army and the Mongolian partisans defeated him and entered Urga on 6 July 1921. The Bogd Khan stayed on as a limited monarch under a people’s government, Ungern was captured and shot, and Soviet troops remained until 1925; after the Bogd Khan’s death in 1924 the Mongolian People’s Republic was proclaimed.
: La lutte pour la Mongolie-Extérieure après la révolution russe, qui s’acheva par l’installation à Ourga d’un gouvernement révolutionnaire soutenu par les Soviétiques. En 1919, le gouvernement de Beiyang de la République de Chine envoya des troupes commandées par Xu Shuzheng, qui contraignit les nobles mongols à renoncer à l’autonomie acquise par la Mongolie en 1911–1915. En février 1921, le général blanc Roman von Ungern-Sternberg et sa division de cavalerie asiatique chassèrent les Chinois d’Ourga et rétablirent comme monarque le Bogdo Khan, chef de l’Église bouddhiste mongole, tout en tuant des Juifs et des bolcheviks présumés. En mars, le Parti du peuple mongol, dirigé par Damdin Sükhbaatar, forma un gouvernement provisoire à la frontière soviétique et prit le poste chinois de Kiakhta. Lorsque Ungern attaqua le territoire soviétique en juin, l’Armée rouge et les partisans mongols le battirent et entrèrent à Ourga le 6 juillet 1921. Le Bogdo Khan resta en place comme monarque aux pouvoirs limités sous un gouvernement populaire, Ungern fut capturé et fusillé, et les troupes soviétiques restèrent jusqu’en 1925 ; après la mort du Bogdo Khan en 1924, la République populaire de Mongolie fut proclamée.
