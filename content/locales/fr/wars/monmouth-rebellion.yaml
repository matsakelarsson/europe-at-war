"Monmouth Rebellion": "Rébellion de Monmouth"
"A rising in the West Country by James Scott, Duke of Monmouth, the Protestant illegitimate son of Charles II, against his Catholic uncle, James II. Monmouth landed at Lyme Regis on 11 June 1685 with 82 followers and raised an army of several thousand, mostly farm workers and craftsmen, and was proclaimed king at Taunton. He failed to take Bristol, and on 6 July his night attack on the royal army under the Earl of Feversham and John Churchill at Sedgemoor was beaten off and his army routed. Monmouth was captured and beheaded on Tower Hill on 15 July. At the “Bloody Assizes” led by Judge George Jeffreys, more than 1,400 prisoners were tried; fewer than 300 were hanged and some 800 transported to the West Indies. A linked rising in Scotland by the Earl of Argyll failed in June.": "Une montée dans le pays occidental par James Scott, duc de Monmouth, le fils illégitime protestant de Charles II, contre son oncle catholique, Jacques II. Monmouth atterrit à Lyme Regis le 11 Juin 1685 avec 82 disciples et a élevé une armée de plusieurs milliers, principalement des ouvriers agricoles et des artisans, et a été proclamé roi à Taunton. Il ne prit pas Bristol et, le 6 juillet, son attaque nocturne contre l’armée royale sous le comte de Feversham et John Churchill à Sedgemoor fut battue et son armée rouée. Monmouth fut capturé et décapité sur Tower Hill le 15 juillet. À l’Assises Bloody, conduite par le juge George Jeffreys, plus de 1 400 prisonniers ont été jugés ; moins de 300 ont été pendus et environ 800 ont été transportés vers les Antilles. Une montée liée en Écosse par le comte d’Argyll a échoué en juin."
"Dates are Old Style (Julian). Sedgemoor is often called the last pitched battle fought on English soil.": "Dates sont Old Style (Julian). Sedgemoor est souvent appelé la dernière bataille poncée combattu sur le sol anglais."
