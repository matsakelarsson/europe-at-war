# Some French text was translated automatically.
"Montenegrin–Ottoman War of 1852–1853": "Montenegrin–Ottoman Guerre de 1852-1853"
"A war that followed Danilo Petrović-Njegoš’s transformation of Montenegro from a prince-bishopric into a secular principality in 1852 and his secret help to the Herzegovinian rebels of Luka Vukalović. After the Montenegrins seized the fortress of Žabljak near Lake Scutari, the Porte declared war, and in the winter of 1852–1853 Omer Pasha invaded Montenegro from Herzegovina and Albania with a much larger army. The Montenegrins held out, winning near Ostrog, and in February 1853 an Austrian envoy, Count Christian Leiningen, delivered an ultimatum in Constantinople, supported by Russia, that made the Ottomans withdraw. Like the dispute over the Holy Places, the crisis helped bring on the Crimean War.": "Une guerre qui a suivi la transformation du Monténégro d’un prince-évêque en une principauté laïc en 1852 et son aide secrète aux rebelles Herzegoviniens de Luka Vukalović. Après que les Monténégrins se soient emparés de la forteresse de Žabljak près du lac Scutari, la Porte a déclaré la guerre et pendant l’hiver 1852–1853 Omer Pacha a envahi le Monténégro d’Herzégovine et d’Albanie avec une armée beaucoup plus grande. Les Monténégrins se déroulèrent, remportant près d’Ostrog, et en février 1853, un envoyé autrichien, le comte Christian Leiningen, livra à Constantinople un ultimatum, soutenu par la Russie, qui fit retirer les Ottomans."
