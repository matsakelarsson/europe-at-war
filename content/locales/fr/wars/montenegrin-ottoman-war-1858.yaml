"May 1858": "mai 1858"
"From 1852 Luka Vukalović led the Orthodox clans of eastern Herzegovina in revolt against the Ottoman authorities, encouraged by Prince Danilo of Montenegro, who had turned the old prince-bishopric into a secular principality. When Vukalović rose again in late 1857 and beat off an Ottoman attack with Montenegrin help, the Porte sent an army under Hussein Pasha to settle accounts with Montenegro itself. On 10 May 1858 it took Vilusi and Grahovo, in the disputed borderland above the Bay of Kotor. About 7,500 Montenegrins under the prince’s elder brother, Mirko Petrović-Njegoš, held the plateau of Grahovac above them.": "A partir de 1852, Luka Vukalović conduisit les clans orthodoxes de l’est de l’Herzégovine en révolte contre les autorités ottomanes, encouragées par le prince Danilo du Monténégro, qui avait transformé l’ancien prince-bishopric en une principauté laïque. Le 10 mai 1858, il prit Vilusi et Grahovo, dans la frontière contestée au-dessus de la baie de Kotor. Environ 7 500 Monténégrins sous le prince frère aîné, Mirko Petrović-Njegoš, tenait le plateau de Grahovac au-dessus d’eux."
"The Ottomans attacked on 11 May, and most of the casualties, some 3,000 Ottoman and 1,000 Montenegrin by one account, fell that day. Mirko refused a truce but let the Ottomans bury their dead. On 13 May, as Ottoman reinforcements arrived from Bosnia, the Montenegrins charged the Ottoman guns and routed the army, capturing a great quantity of arms. The victory, celebrated in South Slav songs, brought the great powers in. A commission marked out the border, giving Montenegro Grahovo, Rudine, the Župa of Nikšić, much of Drobnjaci, Upper Vasojevići and other districts, a de facto recognition of its independence.": "Les Ottomans attaquèrent le 11 mai, et la plupart des victimes, quelque 3000 Ottomans et 1000 Monténégrins par un seul compte, tombaient ce jour-là. Mirko refusa une trêve mais laissa les Ottomans enterrer leurs morts. Le 13 mai, alors que les renforts ottomans arrivaient de Bosnie, les Monténégrins chargeaient les canons ottomans et roulaient l’armée, capturant une grande quantité d’armes. Une commission a marqué la frontière, donnant au Monténégro Grahovo, Rudine, la Župa de Nikšić, une grande partie de Drobnjaci, Haut Vasojevići et d’autres districts, une reconnaissance de facto de son indépendance."
