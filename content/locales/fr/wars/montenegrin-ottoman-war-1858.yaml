"Montenegrin–Ottoman War of 1858": "Guerre entre le Monténégro et l’Empire ottoman en 1858"
"A short war in which an Ottoman army sent to crush Montenegrin support for the Herzegovinian rebels of Luka Vukalović was routed at Grahovac in May 1858 by Montenegrins under Grand Duke Mirko Petrović-Njegoš. The victory led the great powers to fix Montenegro’s border with the Ottoman Empire in 1858–1859, enlarging the principality and amounting to de facto recognition of its independence.": "Une courte guerre dans laquelle une armée ottomane a été envoyée pour écraser le soutien monténégrin aux rebelles Herzegoviniens de Luka Vukalović a été acheminée à Grahovac en mai 1858 par les Monténégrins sous le Grand-duc Mirko Petrović-Njegoš. La victoire conduisit les grandes puissances à fixer la frontière du Monténégro avec l’Empire ottoman en 1858–1859, ce qui élargissait la principauté et équivalait à une reconnaissance de facto de son indépendance."
"Dates are New Style (Gregorian). Montenegro used the Julian calendar, then 12 days behind, and Montenegrin sources date the decisive day of the battle 1 May 1858. Casualty figures come from Montenegrin accounts.": "Les dates sont New Style (Gregorian). Le Monténégro a utilisé le calendrier julien, puis 12 jours derrière, et les sources monténégrines datent du jour décisif de la bataille 1 mai 1858."
