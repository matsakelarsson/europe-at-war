# Some French text was translated automatically.
"Montenegrin–Ottoman War of 1861–1862": "Montenegrin–Ottoman Guerre de 1861-1862"
"A war between Montenegro under Prince Nicholas and the Ottoman Empire, which grew out of Luka Vukalović’s renewed rising in Herzegovina, backed by Montenegro. Omer Pasha’s forces were at first held, but under pressure from the great powers Montenegro stopped fighting in Herzegovina, and in 1862 Ottoman armies invaded from Herzegovina and Albania, took the Ostrog monastery from the defenders under Mirko Petrović-Njegoš and pushed into the heart of the country. The Convention of Scutari of 31 August 1862 made Montenegro acknowledge Ottoman suzerainty, but on mild terms, restoring the borders of 1859 and letting Montenegrins import goods other than arms through Ottoman territory.": "Une guerre entre le Monténégro sous le prince Nicholas et l’Empire ottoman, qui a vu le jour à partir de Luka Vukalovićs renoué en Herzégovine, soutenue par le Monténégro. Les forces d’Omer Pashah furent d’abord tenues, mais sous la pression des grandes puissances Le Monténégro arrêta de combattre en Herzégovine, et en 1862 les armées ottomanes envahirent d’Herzégovine et d’Albanie, prirent le monastère Ostrog des défenseurs sous Mirko Petrović-Njegoš et poussèrent au cœur du pays. La Convention de Scutari du 31 août 1862 fait reconnaître la suzeraineté ottomane, mais à des conditions douces, rétablissant les frontières de 1859 et laissant les Monténégrins importer des marchandises autres que des armes sur le territoire ottoman."
"Dates are New Style (Gregorian); Montenegro used the Julian calendar, then 12 days behind.": "Les dates sont New Style (Gregorian) ; le Monténégro a utilisé le calendrier julien, puis 12 jours de retard."
