"June 1876 – July 1878": "juin 1876 – juillet 1878"
"Montenegro had armed the Herzegovinian rebels since 1875, and at the end of June 1876 it declared war together with Serbia. Prince Nicholas’s army of mountain clans, joined by Herzegovinian insurgents, won its greatest victory in late July at Vučji Do near Nikšić, where an Ottoman army under Ahmed Muhtar Pasha was routed; Selim Pasha was killed and Osman Pasha taken prisoner. On 2 August Marko Miljanov and Ilija Plamenac threw back a larger force from Scutari at Fundina in the Kuči lands. When Serbia was beaten, Montenegro too accepted the armistice of November 1876, but no peace followed.": "Le Monténégro avait armé les rebelles Herzegoviniens depuis 1875, et à la fin de juin 1876 il a déclaré la guerre avec la Serbie. L’armée des clans de montagne du prince Nicholas, rejointe par les insurgés Herzégoviniens, a remporté sa plus grande victoire fin juillet à Vučji Do près de Nikšić, où une armée ottomane sous Ahmed Muhtar Pacha a été rouée ; Selim Pacha a été tué et Osman Pacha fait prisonnier. Le 2 août, Marko Miljanov et Ilija Plamenac renversèrent une force plus importante de Scutari à Fundina dans les terres de Kuči. Lorsque la Serbie fut battue, le Monténégro accepta lui aussi l’armistice de novembre 1876, mais aucune paix ne suivit."
"In June 1877, as Russia went to war, an Ottoman army under Suleiman Pasha fought its way through the Duga pass to relieve Nikšić and then across Montenegro down the Zeta valley, before being shipped to Bulgaria to face the Russians. Nicholas then besieged Nikšić, which surrendered on 8 September after 47 days, and in January 1878 his troops took Bar and Ulcinj on the coast and the forts on Lake Scutari. Many Albanian and Slav Muslim inhabitants left or were driven from Podgorica, Spuž and other places. At Berlin Montenegro won independence, Nikšić, Podgorica, Kolašin and Bar; Ulcinj followed in 1880.": "En juin 1877, alors que la Russie allait à la guerre, une armée ottomane sous Suleiman Pacha se battait en passant par le col de Duga pour libérer Nikšić puis traverser le Monténégro dans la vallée de Zeta, avant d’être envoyée en Bulgarie pour affronter les Russes. Nicholas assiégea ensuite Nikšić, qui se rendit le 8 septembre après 47 jours, et en janvier 1878 ses troupes prirent Bar et Ulcinj sur la côte et les forts du lac Scutari. Beaucoup d’Albanais et de musulmans slaves partirent ou furent chassés de Podgorica, Spuž et d’autres endroits. À Berlin, le Monténégro gagna l’indépendance, Nikšić, Podgorica, Kolašin et Bar ; Ulcinj suivit en 1880."
