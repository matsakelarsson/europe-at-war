# Some French text was translated automatically.
"Montenegrin–Ottoman War of 1876–1878": "Montenegrin–Ottoman Guerre de 1876-1878"
"A war in which the Principality of Montenegro, allied with Serbia and the Herzegovinian rebels and later fighting alongside Russia, beat Ottoman armies at Vučji Do and Fundina in 1876, took Nikšić in 1877 and Bar and Ulcinj on the coast in 1878. Known in Montenegro as the Great War, it ended with Montenegro’s independence recognised at the Congress of Berlin and its territory roughly doubled, with an outlet to the Adriatic.": "Une guerre dans laquelle la Principauté du Monténégro, alliée à la Serbie et aux rebelles Herzégoviniens et plus tard aux côtés de la Russie, bat les armées ottomanes à Vučji Do et Fundina en 1876, prend Nikšić en 1877 et Bar et Ulcinj sur la côte en 1878. Connu au Monténégro comme la Grande Guerre, il se termine avec l’indépendance du Monténégro reconnue au Congrès de Berlin et son territoire a grosso modo doublé, avec un débouché vers l’Adriatique."
"Dates are New Style (Gregorian). Montenegro used the Julian calendar, then 12 days behind, so Montenegrin accounts date the fall of Nikšić 27 August 1877. Several battle dates appear in either style in the literature, and some are given here only by month.": "Les dates sont New Style (Gregorian). Le Monténégro a utilisé le calendrier julien, puis 12 jours derrière, de sorte que les comptes monténégrins datent la chute de Nikšić 27 août 1877. Plusieurs dates de bataille apparaissent dans l’un ou l’autre style dans la littérature, et certains sont donnés ici seulement par mois."
"The Herzegovina Uprising, the Serbian–Ottoman Wars and the Russo-Turkish War of 1877–1878 have their own entries.": "L’insurrection en Herzégovine, les guerres serbo-ottomanes et la guerre russo-turque de 1877–1878 ont leurs propres entrées."
