# French translations of the catalogue text (wave 14); step bodies follow later.
Morant Bay rebellion: Rébellion de Morant Bay
? "The rising of 11 October 1865 in the parish of Saint Thomas-in-the-East, Jamaica, and its suppression. Thirty years after the end of slavery, most Black Jamaicans were small farmers and labourers with little land, low wages and no vote: in 1864 fewer than 2,000 Black men could vote, out of a population of more than 436,000. Floods, drought and epidemics had deepened their poverty, and the governor, Edward John Eyre, answered their petitions with a message from the Queen telling them to work harder. Paul Bogle, a Black Baptist deacon of Stony Gut, and his followers, allies of the mixed-race assemblyman George William Gordon, marched on the courthouse at Morant Bay on 11 October after warrants were issued for their arrest. The volunteer militia fired on them, and in the fighting that followed the crowd burned the courthouse and killed 18 officials and militiamen, among them the custos, Baron von Ketelhodt, while seven of the marchers died. For two days the rebels held much of the parish. Eyre declared martial law, and soldiers, sailors and Maroons from Moore Town put down the rising with extreme violence: 439 people were killed, 354 of them after courts martial, more than 600 were flogged and about 1,000 homes were burned. Gordon, arrested in Kingston where martial law did not apply, was tried by court martial at Morant Bay and hanged on 23 October, and Bogle the next day. A royal commission found the punishments excessive, Eyre was recalled amid a fierce debate in Britain, and in 1866 the Jamaican Assembly gave up its powers and the island became a Crown colony ruled from London. Jamaica made Bogle and Gordon National Heroes in 1969."
: "Le soulèvement du 11 octobre 1865 dans la paroisse de Saint Thomas-in-the-East, en Jamaïque, et sa répression. Trente ans après la fin de l’esclavage, la plupart des Jamaïcains noirs étaient de petits cultivateurs et des journaliers qui avaient peu de terre, de bas salaires et pas le droit de vote : en 1864, moins de 2 000 hommes noirs pouvaient voter, sur une population de plus de 436 000 habitants. Les inondations, la sécheresse et les épidémies avaient aggravé leur pauvreté, et le gouverneur, Edward John Eyre, répondit à leurs pétitions par un message de la reine les invitant à travailler davantage. Paul Bogle, diacre baptiste noir de Stony Gut, et ses partisans, alliés du député métis George William Gordon, marchèrent sur le tribunal de Morant Bay le 11 octobre après que des mandats d’arrêt eurent été lancés contre eux. La milice de volontaires ouvrit le feu, et dans les combats qui suivirent la foule incendia le tribunal et tua 18 fonctionnaires et miliciens, dont le custos, le baron von Ketelhodt, tandis que sept des manifestants périrent. Pendant deux jours, les rebelles tinrent une grande partie de la paroisse. Eyre proclama la loi martiale, et des soldats, des marins et des Marrons de Moore Town réprimèrent le soulèvement avec une extrême violence : 439 personnes furent tuées, dont 354 après avoir été condamnées par des cours martiales, plus de 600 furent fouettées et environ 1 000 maisons furent incendiées. Gordon, arrêté à Kingston, où la loi martiale ne s’appliquait pas, fut jugé par une cour martiale à Morant Bay et pendu le 23 octobre, et Bogle le lendemain. Une commission royale jugea les châtiments excessifs, Eyre fut rappelé au milieu d’un vif débat en Grande-Bretagne, et en 1866 l’Assemblée jamaïcaine renonça à ses pouvoirs et l’île devint une colonie de la Couronne gouvernée depuis Londres. La Jamaïque a fait de Bogle et de Gordon des héros nationaux en 1969."
