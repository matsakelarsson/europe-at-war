"Granada’s Muslims had been made to convert after the revolt of 1499–1501, but most of the Moriscos, as the converts were called, still spoke Arabic and kept their own dress and customs. Philip II’s Pragmatic Sanction of 1 January 1567 banned all of these, and appeals to suspend it failed. On Christmas Eve 1568 the mountain villages of the Alpujarras rose in arms and proclaimed a young nobleman, Fernando de Válor, king under the name Aben Humeya. An attempt to raise the Albaicín, Granada’s Morisco quarter, the same night failed.": "Les musulmans de Grenade avaient été faits pour se convertir après la révolte de 1499-1501, mais la plupart des Moriscos, comme les convertis étaient appelés, parlaient encore l’arabe et gardaient leur propre tenue et coutumes. La veille de Noël 1568, les villages de montagne de l’Alpujarras se levèrent en armes et proclamèrent un jeune noble, Fernando de Válor, roi sous le nom d’Aben Humeya."
"The rebels killed priests and many other Old Christians in the villages, often with great cruelty. In January 1569 the Marquis of Mondéjar marched in from Granada through the snow and broke the rising in the western Alpujarras, while the Marquis of Los Vélez attacked from Almería. Their troops, mostly unpaid volunteers, plundered, killed and enslaved, and in March a crowd murdered more than a hundred Morisco prisoners in Granada’s jail. The revolt flared up again and spread east to the Almanzora valley and west towards Málaga. In October Aben Humeya was murdered by rivals, and his cousin Aben Aboo took his place.": "Les rebelles tuèrent des prêtres et beaucoup d’autres anciens chrétiens dans les villages, souvent avec une grande cruauté. En janvier 1569, le marquis de Mondéjar marcha de Grenade à travers la neige et brisa la montée dans l’ouest de l’Alpujarras, tandis que le marquis de Los Vélez attaquait d’Almería. Leurs troupes, pour la plupart des volontaires non rémunérés, pillèrent, tuèrent et asservis, et en mars une foule assassina plus d’une centaine de prisonniers de Morisco dans la prison de Grenade. La révolte s’enflamma à nouveau et se répandit vers l’est vers la vallée d’Almanzora et vers l’ouest vers Málaga."
