"Philip II replaced Mondéjar with his half-brother, Don John of Austria, aged twenty-two, and in October 1569 declared a war “of fire and blood”, letting soldiers keep the plunder and captives they took. A few thousand volunteers and some arms came from Algiers and Morocco, but the Ottomans sent their fleets against Tunis and Cyprus instead. In January 1570 Don John took the field with about 12,000 men and besieged Galera, a hill town near Huéscar. When it fell on 10 February most of its people were killed or enslaved, and the town was razed and its ground sown with salt.": "Philippe II remplaça Mondéjar par son demi-frère, Don Jean d’Autriche, âgé de vingt-deux ans, et en octobre 1569 déclara une guerre de feu et de sang, laissant les soldats garder le pillage et les captifs qu’ils prirent. Quelques milliers de volontaires et quelques armes venaient d’Alger et du Maroc, mais les Ottomans envoyaient plutôt leurs flottes contre Tunis et Chypre. En janvier 1570, Don John prit le champ avec environ 12 000 hommes et assiégea Galera, une ville de colline près de Huéscar. Lorsqu'elle tomba le 10 février, la plupart de ses habitants furent tués ou asservis, et la ville fut rasée et sa terre semée de sel."
"Serón fell in March, and in the spring Don John and the Duke of Sessa swept through the Alpujarras from both ends, burning crops and villages. Thousands of Moriscos surrendered; others fled to North Africa or hid in caves, where many were suffocated by fires lit at the entrances. From November 1570 the crown deported the Moriscos of Granada, rebels or not, to towns across Castile. About 80,000 were marched away in winter, and many died on the road. Aben Aboo was killed by his own men in a cave near Bérchules in March 1571, and settlers from the north were brought in to farm the emptied villages.": "Serón est tombé en mars, et au printemps Don John et le duc de Sessa ont balayé les Alpujarras des deux extrémités, des récoltes brûlantes et des villages. Des milliers de Moriscos se sont rendus ; d’autres ont fui vers l’Afrique du Nord ou se sont cachés dans des grottes, où beaucoup ont été étouffés par des incendies allumés aux entrées. Environ 80 000 personnes ont marché en hiver, et beaucoup sont mortes sur la route. Aben Aboo a été tué par ses propres hommes dans une grotte près de Bérchules en mars 1571, et des colons du nord ont été amenés à la ferme des villages vidés."
