"Rebellion of the Alpujarras": "Rébellion des Alpujarras"
"The revolt of the Moriscos of the Kingdom of Granada, descendants of Muslims forced to convert to Christianity, against Philip II’s ban on their language, dress and customs. Beginning in the Alpujarras, the mountain valleys south of the Sierra Nevada, it was fought with great cruelty on both sides and put down by Don John of Austria; afterwards about 80,000 of Granada’s Moriscos were deported to other parts of Castile.": "La révolte des Moriscos du Royaume de Grenade, descendants de musulmans forcés à se convertir au christianisme, contre Philippe II's interdiction de leur langue, tenue et coutumes. Commençant dans les Alpujarras, les vallées de montagne au sud de la Sierra Nevada, il a été combattu avec une grande cruauté des deux côtés et mis à bas par Don Jean d’Autriche ; après environ 80 000 de Granada's Moriscos ont été déportés vers d’autres parties de Castille."
"Dates are Julian, as usual for the period. It is also called the War of the Alpujarras or the second rebellion of the Alpujarras, after the rising of 1499–1501.": "Les dates sont Julian, comme d’habitude pour la période. Il est aussi appelé la guerre des Alpujarras ou la deuxième rébellion des Alpujarras, après la montée de 1499–1501."
"The three main chronicles, by Luis del Mármol Carvajal, Ginés Pérez de Hita and Diego Hurtado de Mendoza, were all written from the Christian side; there is no contemporary account by the Moriscos. Numbers of rebels and dead are uncertain.": "Les trois chroniques principales, de Luis del Mármol Carvajal, Ginés Pérez de Hita et Diego Hurtado de Mendoza, ont toutes été écrites du côté chrétien ; il n’y a pas de récit contemporain par les Moriscos."
"The Moriscos of all Spain were expelled in 1609–1614.": "Les Moriscos de toute l’Espagne furent expulsés en 1609–1614."
