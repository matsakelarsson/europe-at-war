# French translations of the catalogue text (wave 14); step bodies follow later.
Mormon War: Guerre mormone
? A conflict in northern Missouri in 1838 between members of the Church of Jesus Christ of Latter Day Saints led by Joseph Smith and their non-Mormon neighbours, the state militia and the state government. Driven out of Jackson County in 1833, the Latter Day Saints had been given Caldwell County as a refuge in 1836, but as thousands more arrived from Ohio in 1838 they settled in neighbouring Daviess and Carroll counties, where the older inhabitants feared their numbers, their votes and their opposition to slavery. A brawl at the polls in Gallatin on 6 August began months of violence. Vigilantes besieged the Mormon town of DeWitt until it was abandoned on 11 October; armed Mormons, among them the secret society of the Danites, then raided Gallatin and Millport, burning homes and stores and driving out non-Mormon families. On 25 October a Mormon force attacked a militia company at Crooked River, where Apostle David W. Patten and two others were killed. Governor Lilburn Boggs then issued Executive Order 44, declaring that the Mormons “must be treated as enemies, and must be exterminated or driven from the State if necessary for the public peace”. On 30 October some 240 militiamen and vigilantes attacked the settlement at Haun’s Mill and killed 17 Latter Day Saints, among them two boys aged ten and nine, in what is known as the Haun’s Mill massacre. Surrounded at Far West by some 2,500 militia, the Mormon leaders surrendered on 1 November; a court martial sentenced Joseph Smith to death, but General Alexander Doniphan refused to carry out the order, and Smith was held in Liberty Jail until April 1839, when he and the other prisoners escaped while being moved to another county. About 22 people were killed in all. Some 10,000 Latter Day Saints were expelled from Missouri in the winter of 1838–1839 and founded Nauvoo in Illinois. Executive Order 44 was formally rescinded by Governor Kit Bond in 1976.
: Un conflit qui opposa en 1838, dans le nord du Missouri, les membres de l’Église de Jésus-Christ des saints des derniers jours, conduits par Joseph Smith, à leurs voisins non mormons, à la milice et au gouvernement de l’État. Chassés du comté de Jackson en 1833, les saints des derniers jours avaient reçu en 1836 le comté de Caldwell comme refuge, mais lorsque des milliers d’autres arrivèrent de l’Ohio en 1838, ils s’installèrent dans les comtés voisins de Daviess et de Carroll, où les habitants plus anciens redoutaient leur nombre, leurs votes et leur opposition à l’esclavage. Une rixe aux urnes à Gallatin, le 6 août, ouvrit des mois de violences. Des justiciers autoproclamés assiégèrent la ville mormone de DeWitt jusqu’à son abandon le 11 octobre ; des mormons armés, parmi lesquels la société secrète des Danites, attaquèrent alors Gallatin et Millport, incendiant maisons et magasins et chassant des familles non mormones. Le 25 octobre, une troupe mormone attaqua une compagnie de la milice à Crooked River, où l’apôtre David W. Patten et deux autres hommes furent tués. Le gouverneur Lilburn Boggs promulgua alors l’ordre exécutif n° 44, qui déclarait que les mormons « doivent être traités en ennemis, et doivent être exterminés ou chassés de l’État si nécessaire pour la paix publique ». Le 30 octobre, quelque 240 miliciens et justiciers attaquèrent la colonie de Haun’s Mill et tuèrent 17 saints des derniers jours, dont deux garçons de dix et neuf ans, dans ce que l’on appelle le massacre de Haun’s Mill. Encerclés à Far West par quelque 2 500 miliciens, les chefs mormons se rendirent le 1er novembre ; une cour martiale condamna Joseph Smith à mort, mais le général Alexander Doniphan refusa d’exécuter l’ordre, et Smith fut détenu à la prison de Liberty jusqu’en avril 1839, quand lui et les autres prisonniers s’évadèrent pendant leur transfert vers un autre comté. Environ 22 personnes furent tuées en tout. Quelque 10 000 saints des derniers jours furent expulsés du Missouri pendant l’hiver 1838–1839 et fondèrent Nauvoo, en Illinois. L’ordre exécutif n° 44 fut formellement abrogé par le gouverneur Kit Bond en 1976.
