# French translations of the catalogue text (wave 11); step bodies follow later.
Moro conflict: Conflit moro
? "The armed struggle of the Muslim peoples of the southern Philippines, the Moros, for independence and later autonomy, and the wars of the groups that came out of it. Decades of settlement by Christians from the north had made Muslims a minority in much of Mindanao, and land disputes, poverty and the massacre of Muslim army trainees on Corregidor in 1968 led to the founding of the Moro National Liberation Front (MNLF) under Nur Misuari. Its war against Ferdinand Marcos’s martial-law regime (1972–1976) was the bloodiest phase. The Tripoli Agreement of 1976 promised autonomy, but fighting resumed; the Moro Islamic Liberation Front (MILF) split away in 1977, and an autonomous region was created in 1989–1990. The MNLF signed a final peace agreement in 1996; the MILF fought on, with full-scale offensives against it in 2000, 2003 and 2008, until the Comprehensive Agreement on the Bangsamoro of 2014. Small groups rejected every settlement: Abu Sayyaf, known for kidnappings and bombings, and fighters allied to the Islamic State, who seized Marawi in 2017. In 2019 the Bangsamoro Autonomous Region replaced the old autonomous region, led by the MILF, which began to disarm. Estimates of the dead since the early 1970s range from about 100,000 to 150,000, with 120,000 the figure most often given, and more than two million people have been displaced at one time or another. Last updated 27 November 2026: the Bangsamoro region elected its first parliament in September 2026, but the disarmament of the last MILF fighters has stalled and small armed groups linked to the Islamic State are still fought by the army."
: "La lutte armée des peuples musulmans du sud des Philippines, les Moros, pour l’indépendance puis pour l’autonomie, et les guerres des groupes qui en sont issus. Des décennies de colonisation par des chrétiens venus du Nord avaient rendu les musulmans minoritaires dans une grande partie de Mindanao, et les conflits fonciers, la pauvreté et le massacre de recrues musulmanes de l’armée à Corregidor en 1968 conduisirent à la fondation du Front Moro de libération nationale (MNLF), dirigé par Nur Misuari. Sa guerre contre le régime de loi martiale de Ferdinand Marcos (1972–1976) en fut la phase la plus sanglante. L’accord de Tripoli de 1976 promettait l’autonomie, mais les combats reprirent ; le Front Moro islamique de libération (MILF) fit sécession en 1977, et une région autonome fut créée en 1989–1990. Le MNLF signa un accord de paix définitif en 1996 ; le MILF poursuivit la lutte et dut faire face à des offensives de grande ampleur en 2000, 2003 et 2008, jusqu’à l’accord global sur le Bangsamoro de 2014. De petits groupes rejetèrent tous les accords : Abu Sayyaf, connu pour ses enlèvements et ses attentats à la bombe, et des combattants alliés à l’État islamique, qui s’emparèrent de Marawi en 2017. En 2019, la région autonome du Bangsamoro remplaça l’ancienne région autonome ; elle est dirigée par le MILF, qui a commencé à désarmer. Les estimations des morts depuis le début des années 1970 vont d’environ 100 000 à 150 000, 120 000 étant le chiffre le plus souvent avancé, et plus de deux millions de personnes ont été déplacées à un moment ou à un autre. Dernière mise à jour le 27 novembre 2026 : la région du Bangsamoro a élu son premier parlement en septembre 2026, mais le désarmement des derniers combattants du MILF est au point mort et l’armée combat toujours de petits groupes armés liés à l’État islamique."
