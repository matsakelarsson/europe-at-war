# French translations of the catalogue text (wave 11); step bodies follow later.
Moro Rebellion: Rébellion moro
? The war between the United States and the Muslim peoples of Mindanao and the Sulu archipelago, whom Spain had never fully conquered. American troops replaced the Spanish garrisons at Jolo and Zamboanga in 1899, and to keep the south quiet while it fought the Philippine Republic in Luzon the American army signed the Bates agreement with the Sultan of Sulu, whose English text spoke of American sovereignty and whose Tausug text of protection. From 1902 American columns fought the Maranao around Lake Lanao, and from 1903 the Moro Province, under military governors Leonard Wood, Tasker Bliss and John J. Pershing, imposed a head tax, outlawed slavery, abrogated the Bates agreement (1904) and fought datus who resisted, among them Datu Ali in the Cotabato valley. In March 1906 American troops killed nearly all of the 800 to 1,000 Tausug men, women and children who had taken refuge in the crater of Bud Dajo on Jolo. Pershing’s disarmament order of 1911 led to the last great battle, at Bud Bagsak in June 1913, after which the province was handed to a civilian government; in 1915 the sultan gave up his temporal power. American losses were about 130 killed and some 500 dead of disease, while the Philippine Scouts lost more than 110 killed and the Philippine Constabulary several hundred; Moro losses were never counted, but ran to thousands.
: La guerre entre les États-Unis et les peuples musulmans de Mindanao et de l’archipel de Sulu, que l’Espagne n’avait jamais entièrement soumis. Les troupes américaines remplacèrent les garnisons espagnoles de Jolo et de Zamboanga en 1899 et, pour maintenir le calme dans le Sud pendant qu’elle combattait la République philippine à Luçon, l’armée américaine signa avec le sultan de Sulu l’accord Bates, dont le texte anglais parlait de souveraineté américaine et le texte tausug de protection. À partir de 1902, des colonnes américaines combattirent les Maranao autour du lac Lanao et, à partir de 1903, la province moro, sous les gouverneurs militaires Leonard Wood, Tasker Bliss et John J. Pershing, instaura une capitation, interdit l’esclavage, abrogea l’accord Bates (1904) et combattit les datus qui résistaient, parmi lesquels Datu Ali dans la vallée de Cotabato. En mars 1906, les troupes américaines tuèrent la quasi-totalité des 800 à 1 000 hommes, femmes et enfants tausug qui s’étaient réfugiés dans le cratère du Bud Dajo, à Jolo. L’ordre de désarmement donné par Pershing en 1911 mena à la dernière grande bataille, au Bud Bagsak, en juin 1913, après quoi la province fut confiée à un gouvernement civil ; en 1915, le sultan renonça à son pouvoir temporel. Les pertes américaines s’élevèrent à environ 130 tués et quelque 500 morts de maladie, tandis que les Philippine Scouts perdirent plus de 110 tués et la Philippine Constabulary plusieurs centaines ; les pertes des Moros ne furent jamais comptées, mais se chiffrèrent en milliers.
