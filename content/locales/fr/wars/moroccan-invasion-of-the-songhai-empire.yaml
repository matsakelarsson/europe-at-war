# French translations of the catalogue text (wave 12); step bodies follow later.
Moroccan invasion of the Songhai Empire: Invasion marocaine de l’empire songhaï
? The conquest of the Niger bend by an army sent across the Sahara by the Saadian sultan Ahmad al-Mansur of Morocco, which destroyed the Songhai Empire and founded the Pashalik of Timbuktu. Al-Mansur wanted the gold and the salt trade of the Sudan and recognition as caliph; a quarrel over the Taghaza salt mines gave him his pretext. In October 1590 Judar Pasha left Marrakesh with some 3,000–4,000 soldiers, most of them musketeers, many of them Spanish-born renegades and Andalusi exiles, and after a march of about five months across the desert defeated the far larger army of Askia Ishaq II at Tondibi, near Gao, on 13 March 1591. Gao and Timbuktu were occupied; al-Mansur rejected the askiya’s offer of tribute and sent Mahmud ibn Zarqun, who beat Ishaq again in October 1591, seized his successor Muhammad Gao by treachery and fought the new askiya, Nuh, in Dendi for two years. Timbuktu rose against its garrison, and in 1593 its leading scholars, among them Ahmad Baba, were arrested and deported to Marrakesh. Mahmud was killed in the hills of al-Hajar in 1595; his successor routed Nuh, and in 1599 a Malian attempt on Djenné failed. The Moroccans held the river from Djenné to Gao and Kukiya, but never ruled the countryside; the Songhai kept an independent kingdom in Dendi, and the descendants of the soldiers, the Arma, ruled Timbuktu under their own pashas until the nineteenth century.
: La conquête de la boucle du Niger par une armée envoyée à travers le Sahara par le sultan saadien du Maroc Ahmad al-Mansur ; elle détruisit l’empire songhaï et fonda le pachalik de Tombouctou. Al-Mansur convoitait l’or et le commerce du sel du Soudan et voulait être reconnu comme calife ; une querelle au sujet des mines de sel de Taghaza lui fournit un prétexte. En octobre 1590, Djouder Pacha quitta Marrakech avec quelque 3 000 à 4 000 soldats, pour la plupart des mousquetaires, dont beaucoup de renégats d’origine espagnole et d’exilés andalous, et, après une marche d’environ cinq mois à travers le désert, vainquit l’armée bien plus nombreuse d’Askia Ishaq II à Tondibi, près de Gao, le 13 mars 1591. Gao et Tombouctou furent occupées ; al-Mansur rejeta l’offre de tribut de l’askia et envoya Mahmud ibn Zarqun, qui battit de nouveau Ishaq en octobre 1591, s’empara par traîtrise de son successeur Muhammad Gao et combattit pendant deux ans le nouvel askia, Nuh, dans le Dendi. Tombouctou se souleva contre sa garnison et, en 1593, ses principaux lettrés, parmi lesquels Ahmed Baba, furent arrêtés et déportés à Marrakech. Mahmud fut tué dans les collines d’al-Hajar en 1595 ; son successeur mit Nuh en déroute et, en 1599, une tentative malienne contre Djenné échoua. Les Marocains tenaient le fleuve de Djenné à Gao et à Kukiya, mais ne gouvernèrent jamais les campagnes ; les Songhaï conservèrent un royaume indépendant dans le Dendi, et les descendants des soldats, les Arma, gouvernèrent Tombouctou sous leurs propres pachas jusqu’au XIXe siècle.
