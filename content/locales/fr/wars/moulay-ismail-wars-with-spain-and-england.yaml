# French translations of the catalogue text (wave 12); step bodies follow later.
Moulay Ismail’s wars with Spain and England: Guerres de Moulay Ismail contre l’Espagne et l’Angleterre
The campaigns in which Sultan Moulay Ismail (r. 1672–1727) won back most of the Atlantic and Mediterranean ports that Portugal, Spain and England held in Morocco. His commanders, leading the Rifian volunteers of the Jaysh al-Rifi and the sultan’s troops, besieged English Tangier in 1680, took Spanish La Mamora (Mehdya) in 1681 and saw the English give up Tangier, after blowing up its mole and walls, in February 1684. Larache fell to them in November 1689, with some 1,600 Spanish prisoners, and Asilah in 1691. In October 1694 they laid siege to Ceuta, a siege that went on, with a Spanish relief in 1720, until after Ismail’s death in 1727; Melilla also held out. The captives of these wars were put to work on Ismail’s buildings at Meknes or ransomed through envoys and the redemptionist religious orders.: Les campagnes par lesquelles le sultan Moulay Ismail (règne 1672–1727) reprit la plupart des ports atlantiques et méditerranéens que le Portugal, l’Espagne et l’Angleterre tenaient au Maroc. Ses commandants, à la tête des volontaires rifains du Jaysh al-Rifi et des troupes du sultan, assiégèrent Tanger, alors anglaise, en 1680, prirent La Mamora (Mehdya), alors espagnole, en 1681 et virent les Anglais abandonner Tanger en février 1684, après en avoir fait sauter le môle et les murailles. Larache tomba entre leurs mains en novembre 1689, avec quelque 1 600 prisonniers espagnols, puis Asilah en 1691. En octobre 1694, ils mirent le siège devant Ceuta, un siège qui se prolongea, marqué par une expédition de secours espagnole en 1720, jusqu’après la mort d’Ismail en 1727 ; Melilla résista elle aussi. Les captifs de ces guerres furent employés aux constructions d’Ismail à Meknès ou rachetés par l’intermédiaire d’émissaires et des ordres religieux rédempteurs.
