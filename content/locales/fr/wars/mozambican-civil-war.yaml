# French translations of the catalogue text (wave 13); step bodies follow later.
Mozambican Civil War: Guerre civile du Mozambique
? The war between Mozambique’s FRELIMO government and the Mozambican National Resistance (RENAMO), which began two years after independence and lasted until 1992. RENAMO was created by Rhodesia’s Central Intelligence Organisation in 1976–1977 to strike back at Mozambique for supporting the Zimbabwean guerrillas, with André Matsangaissa and then Afonso Dhlakama as its leaders. After Zimbabwe’s independence in 1980 South Africa’s military intelligence took it over, and it spread through the centre and south of the country, attacking roads, railways, schools, clinics and villages. The Nkomati Accord of 1984, in which South Africa promised to stop helping RENAMO, did not end that help. Zimbabwe sent troops to guard the Beira corridor and helped take RENAMO’s headquarters at Casa Banana in 1985; Tanzania and Malawi also sent troops. President Samora Machel died in a plane crash at Mbuzini in 1986. RENAMO’s massacres, as at Homoine in 1987, and the government’s forced removals, together with drought, brought famine. After the Cold War ended FRELIMO gave up Marxism–Leninism and adopted a multiparty constitution, and talks mediated by the Community of Sant’Egidio led to the Rome General Peace Accords of 4 October 1992 and elections in 1994. About a million people died, most of them from hunger and disease, some five million were displaced and 1.7 million fled abroad.
: La guerre entre le gouvernement mozambicain du FRELIMO et la Résistance nationale mozambicaine (RENAMO), qui commença deux ans après l’indépendance et dura jusqu’en 1992. La RENAMO fut créée en 1976–1977 par la Central Intelligence Organisation rhodésienne pour riposter au soutien que le Mozambique apportait aux guérilleros zimbabwéens, avec à sa tête André Matsangaissa, puis Afonso Dhlakama. Après l’indépendance du Zimbabwe en 1980, le renseignement militaire sud-africain la prit en charge, et elle s’étendit dans le centre et le sud du pays, attaquant routes, voies ferrées, écoles, dispensaires et villages. L’accord de Nkomati de 1984, par lequel l’Afrique du Sud promettait de cesser d’aider la RENAMO, ne mit pas fin à cette aide. Le Zimbabwe envoya des troupes garder le corridor de Beira et aida à prendre le quartier général de la RENAMO à Casa Banana en 1985 ; la Tanzanie et le Malawi envoyèrent aussi des troupes. Le président Samora Machel mourut dans un accident d’avion à Mbuzini en 1986. Les massacres de la RENAMO, comme à Homoine en 1987, et les déplacements forcés imposés par le gouvernement, joints à la sécheresse, provoquèrent la famine. Après la fin de la guerre froide, le FRELIMO renonça au marxisme-léninisme et adopta une constitution pluraliste, et des négociations menées sous la médiation de la Communauté de Sant’Egidio aboutirent aux accords généraux de paix de Rome du 4 octobre 1992 et à des élections en 1994. Environ un million de personnes moururent, la plupart de faim et de maladie, quelque cinq millions furent déplacées et 1,7 million s’enfuirent à l’étranger.
