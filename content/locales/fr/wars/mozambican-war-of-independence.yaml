# French translations of the catalogue text (wave 13); step bodies follow later.
Mozambican War of Independence: Guerre d’indépendance du Mozambique
? The guerrilla war fought by the Mozambique Liberation Front (FRELIMO) against Portuguese rule. Formed in Dar es Salaam in 1962 under Eduardo Mondlane, FRELIMO began the war on 25 September 1964 with an attack on the administrative post at Chai in Cabo Delgado. From bases in Tanzania it built liberated zones among the Makonde of the Mueda plateau and in northern Niassa, and in 1968 opened a front in Tete, where Portugal was building the Cahora Bassa dam. Mondlane was killed by a parcel bomb in 1969, and Samora Machel became FRELIMO’s leader. Portugal answered with a large conscript army, a growing share of it recruited in Mozambique, with resettlement of villagers into fortified aldeamentos and with General Kaúlza de Arriaga’s Operation Gordian Knot of 1970, the largest offensive of the war; Rhodesian forces fought FRELIMO in Tete. In December 1972 Portuguese commandos massacred hundreds of villagers at Wiriyamu. FRELIMO crossed the Zambezi into Manica and Sofala in 1972–1973. After army officers overthrew the dictatorship in Lisbon on 25 April 1974, Portugal and FRELIMO signed the Lusaka Accord on 7 September 1974, and Mozambique became independent on 25 June 1975. About 1,800 Portuguese soldiers were killed, some 10,000 FRELIMO fighters and tens of thousands of civilians.
: La guérilla menée par le Front de libération du Mozambique (FRELIMO) contre la domination portugaise. Fondé à Dar es Salam en 1962 sous la direction d’Eduardo Mondlane, le FRELIMO déclencha la guerre le 25 septembre 1964 par une attaque contre le poste administratif de Chai, dans le Cabo Delgado. Depuis ses bases en Tanzanie, il constitua des zones libérées chez les Makonde du plateau de Mueda et dans le nord du Niassa et, en 1968, ouvrit un front dans la province de Tete, où le Portugal construisait le barrage de Cahora Bassa. Mondlane fut tué par un colis piégé en 1969, et Samora Machel prit la tête du FRELIMO. Le Portugal riposta par une grande armée de conscrits, recrutée pour une part croissante au Mozambique même, par le regroupement des villageois dans des aldeamentos fortifiés et par l’opération Nœud gordien du général Kaúlza de Arriaga en 1970, la plus grande offensive de la guerre ; des forces rhodésiennes combattirent le FRELIMO dans la province de Tete. En décembre 1972, des commandos portugais massacrèrent des centaines de villageois à Wiriyamu. Le FRELIMO franchit le Zambèze pour gagner le Manica et le Sofala en 1972–1973. Après que des officiers eurent renversé la dictature à Lisbonne le 25 avril 1974, le Portugal et le FRELIMO signèrent l’accord de Lusaka le 7 septembre 1974, et le Mozambique devint indépendant le 25 juin 1975. Environ 1 800 soldats portugais furent tués, ainsi que quelque 10 000 combattants du FRELIMO et des dizaines de milliers de civils.
