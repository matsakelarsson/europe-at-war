# Some French text was translated automatically.
"Mudéjar Revolt of 1264–1266": "Révolte de Mudéjar de 1264 à 1266"
"A rising of the Muslims living under Castilian rule (Mudéjars) in Lower Andalusia and Murcia against Alfonso X, whose policy of removing them from towns and resettling Christians in their place had bred resentment. Encouraged and supplied by Muhammad I of Granada, with some North African volunteers, the rebels took Jerez in August 1264, then Arcos, Lebrija, Medina-Sidonia and the city of Murcia. Castile retook Jerez that autumn and invaded the Vega of Granada in 1265, while Alfonso’s father-in-law, James I of Aragon, besieged Murcia from January 1266; it surrendered on 31 January, and James handed it back to Castile. A rebellion of the Banu Ashqilula against Muhammad I forced Granada to make peace and pay a heavy tribute. The Muslims of the retaken towns were expelled and Christians settled in their place.": "Une montée des musulmans vivant sous le règne castillien (Mudéjars) en Basse-Andalousie et Murcie contre Alfonso X, dont la politique de les expulser des villes et de réinstaller les chrétiens à leur place avait suscité le ressentiment. Encouragé et fourni par Muhammad Ier de Grenade, avec quelques volontaires nord-africains, les rebelles ont pris Jerez en août 1264, puis Arcos, Lebrija, Medina-Sidonia et la ville de Murcie. La Castille reprit Jerez cet automne et envahit la Vega de Grenade en 1265, tandis que le beau-père d’Alfonso, Jacques Ier d’Aragon, assiégea Murcie à partir de janvier 1266 ; elle se rendit le 31 janvier, et James la remit à Castille. Une rébellion du Banu Ashqilula contre Muhammad Ier força Grenade à faire la paix et à rendre un lourd tribut. Les musulmans des villes reprises ont été expulsés et les chrétiens installés à leur place."
"The date of the peace between Alfonso X and Muhammad I at Alcalá de Benzaide (Alcalá la Real) is uncertain; it was probably made in 1266 or 1267. The wider story is told in the Reconquista.": "La date de la paix entre Alfonso X et Muhammad I à Alcalá de Benzaide (Alcalá la Real) est incertaine ; elle a probablement été faite en 1266 ou 1267. L’histoire plus large est racontée dans la Reconquista."
