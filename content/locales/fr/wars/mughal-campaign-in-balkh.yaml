# French translations of the catalogue text (wave 7); step bodies follow later.
Mughal campaign in Balkh: Campagne moghole de Balkh
Shah Jahan’s attempt to win Balkh and Badakhshan, the land north of the Hindu Kush that his Timurid ancestors had once ruled. In 1645 the Uzbek khan of Bukhara, Nadr (Nazr) Muhammad, was overthrown by his son Abd al-Aziz and kept only Balkh. In February 1646 Shah Jahan sent an army of some 60,000 under his son Murad Bakhsh from Kabul across the mountains, nominally to help Nadr Muhammad; it occupied Badakhshan and Balkh, while Nadr Muhammad, distrusting the Mughals, fled to Persia. Murad soon left his post, and in 1647 Prince Aurangzeb took command. He defeated the Uzbek armies of Abd al-Aziz outside Balkh, but the Mughals could not hold a hostile and poor country against constant raids, and in the autumn of 1647 Aurangzeb withdrew, losing many men and animals in the snow of the Hindu Kush passes. Balkh was handed back to the Uzbeks. The campaign cost some 20 million rupees and weakened the Mughal frontier, which helped Persia take Kandahar in 1649.: La tentative de Shah Jahan pour s’emparer de Balkh et du Badakhshan, la région située au nord de l’Hindou Kouch que ses ancêtres timourides avaient autrefois gouvernée. En 1645, le khan ouzbek de Boukhara, Nadr (Nazr) Muhammad, fut renversé par son fils Abd al-Aziz et ne conserva que Balkh. En février 1646, Shah Jahan envoya de Kaboul, à travers les montagnes, une armée de quelque 60 000 hommes commandée par son fils Murad Bakhsh, officiellement pour venir en aide à Nadr Muhammad ; elle occupa le Badakhshan et Balkh, tandis que Nadr Muhammad, qui se méfiait des Moghols, s’enfuyait en Perse. Murad abandonna bientôt son poste, et en 1647 le prince Aurangzeb prit le commandement. Il battit les armées ouzbèkes d’Abd al-Aziz devant Balkh, mais les Moghols ne purent tenir un pays hostile et pauvre face à des raids incessants, et à l’automne 1647 Aurangzeb se retira, perdant beaucoup d’hommes et de bêtes dans la neige des cols de l’Hindou Kouch. Balkh fut rendue aux Ouzbeks. La campagne coûta quelque 20 millions de roupies et affaiblit la frontière moghole, ce qui aida la Perse à prendre Kandahar en 1649.
