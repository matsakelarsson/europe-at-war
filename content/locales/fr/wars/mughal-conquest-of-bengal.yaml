# French translations of the catalogue text (wave 8); step bodies follow later.
Mughal conquest of Bengal: Conquête moghole du Bengale
The long conquest of Bihar and Bengal by the Mughal Empire. In 1574 Akbar took Patna from Daud Khan Karrani, the Afghan sultan of Bengal, and his generals pursued Daud into Odisha and defeated him at Tukaroi in March 1575. Daud broke the peace that followed, and at Rajmahal on 12 July 1576 he was defeated again, captured and executed, ending the Karrani dynasty and the Bengal Sultanate. The Mughals held western and northern Bengal, but the river country of the east, the Bhati, stayed in the hands of local lords known as the Baro-Bhuyans, led by Isa Khan of Sonargaon, who beat back Mughal fleets in 1584 and 1597. Only under Jahangir did the governor Islam Khan Chishti, with a large river fleet, subdue Isa Khan’s son Musa Khan in 1610–1611 and make Dhaka the capital of Mughal Bengal. The last Afghan chief, Khwaja Usman, was killed in Sylhet in 1612.: La longue conquête du Bihar et du Bengale par l’Empire moghol. En 1574, Akbar prit Patna à Daud Khan Karrani, le sultan afghan du Bengale, et ses généraux poursuivirent Daud jusqu’en Odisha et le battirent à Tukaroi en mars 1575. Daud rompit la paix qui suivit et, à Rajmahal, le 12 juillet 1576, il fut de nouveau vaincu, capturé et exécuté, ce qui mit fin à la dynastie Karrani et au sultanat du Bengale. Les Moghols tenaient l’ouest et le nord du Bengale, mais le pays des fleuves, à l’est, le Bhati, resta aux mains de seigneurs locaux appelés Baro-Bhuyans, menés par Isa Khan de Sonargaon, qui repoussa les flottes mogholes en 1584 et en 1597. Ce n’est que sous Jahangir que le gouverneur Islam Khan Chishti, à la tête d’une grande flotte fluviale, soumit le fils d’Isa Khan, Musa Khan, en 1610–1611 et fit de Dacca la capitale du Bengale moghol. Le dernier chef afghan, Khwaja Usman, fut tué dans le Sylhet en 1612.
