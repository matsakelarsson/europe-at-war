# French translations of the catalogue text (wave 8); step bodies follow later.
Mughal conquest of Bijapur and Golconda: Conquête moghole de Bijapur et de Golconde
Aurangzeb’s conquest of the last two Deccan sultanates, the Adil Shahi kingdom of Bijapur and the Qutb Shahi kingdom of Golconda, which had paid tribute to the Mughals for decades but kept their independence and were accused of helping the Marathas. A Mughal army besieged Bijapur from April 1685; Aurangzeb took command himself in July 1686, and the starving city surrendered on 12 September. His son Shah Alam had already occupied Hyderabad in 1685, and in January 1687 the emperor laid siege to the fortress of Golconda, which held out for eight months against mines, famine and plague until one of its officers opened a gate on the night of 21 September 1687. Both kingdoms were annexed, bringing the Mughal empire to its greatest extent and leaving the Marathas as Aurangzeb’s only enemy in the Deccan.: La conquête par Aurangzeb des deux derniers sultanats du Dekkan, le royaume adil shahi de Bijapur et le royaume qutb shahi de Golconde, qui payaient tribut aux Moghols depuis des décennies mais avaient conservé leur indépendance et étaient accusés d’aider les Marathes. Une armée moghole assiégea Bijapur à partir d’avril 1685 ; Aurangzeb en prit lui-même le commandement en juillet 1686, et la ville affamée capitula le 12 septembre. Son fils Shah Alam avait déjà occupé Hyderabad en 1685, et en janvier 1687 l’empereur mit le siège devant la forteresse de Golconde, qui résista huit mois aux mines, à la famine et à la peste, jusqu’à ce que l’un de ses officiers ouvre une porte dans la nuit du 21 septembre 1687. Les deux royaumes furent annexés, ce qui porta l’Empire moghol à sa plus grande extension et laissa les Marathes seuls ennemis d’Aurangzeb dans le Dekkan.
