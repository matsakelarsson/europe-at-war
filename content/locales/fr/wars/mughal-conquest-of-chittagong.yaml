# French translations of the catalogue text (wave 8); step bodies follow later.
Mughal conquest of Chittagong: Conquête moghole de Chittagong
The campaign in which the Mughal governor of Bengal, Shaista Khan, took Chittagong from the kingdom of Arakan (Mrauk U). For decades Arakanese fleets and the Portuguese freebooters settled at Chittagong had raided the rivers of lower Bengal for slaves and plunder, and Arakan had sheltered Aurangzeb’s fugitive brother Shah Shuja. Shaista Khan built a new war fleet at Dhaka, took the island of Sandwip in November 1665 with Dutch help and won over the Portuguese of Chittagong, who changed sides with their ships. His son Buzurg Umed Khan advanced with an army along the coast while the fleet beat the Arakanese navy at the mouth of the Karnaphuli; after a short siege the fort of Chittagong surrendered on 27 January 1666. The town was renamed Islamabad and became the seat of a Mughal faujdar. Arakan’s attempts to retake it failed, and Chittagong remained part of Mughal Bengal until it was ceded to the East India Company in 1760.: La campagne au cours de laquelle le gouverneur moghol du Bengale, Shaista Khan, prit Chittagong au royaume d’Arakan (Mrauk U). Pendant des décennies, les flottes arakanaises et les flibustiers portugais établis à Chittagong avaient écumé les fleuves du bas Bengale en quête d’esclaves et de butin, et l’Arakan avait accueilli Shah Shuja, le frère fugitif d’Aurangzeb. Shaista Khan construisit une nouvelle flotte de guerre à Dacca, prit l’île de Sandwip en novembre 1665 avec l’aide des Néerlandais et gagna à sa cause les Portugais de Chittagong, qui changèrent de camp avec leurs navires. Son fils Buzurg Umed Khan avança avec une armée le long de la côte tandis que la flotte battait la marine arakanaise à l’embouchure de la Karnaphuli ; après un bref siège, le fort de Chittagong capitula le 27 janvier 1666. La ville fut rebaptisée Islamabad et devint le siège d’un faujdar moghol. Les tentatives de l’Arakan pour la reprendre échouèrent, et Chittagong resta rattachée au Bengale moghol jusqu’à sa cession à la Compagnie des Indes orientales en 1760.
