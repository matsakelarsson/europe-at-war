# French translations of the catalogue text (wave 8); step bodies follow later.
Mughal conquest of Gujarat: Conquête moghole du Goujarat
? Akbar’s conquest of the Gujarat Sultanate, the rich kingdom of western India with the ports of Cambay and Surat. Gujarat had been torn by rivalries among its nobles under the young sultan Muzaffar Shah III, and one faction leader, Itimad Khan, invited Akbar in. Akbar left Fatehpur Sikri in July 1572 and reached Ahmedabad in November with little resistance; Muzaffar Shah was taken prisoner and Itimad Khan and the nobles submitted. The Mirzas, rebel Timurid cousins of Akbar who had taken refuge in Gujarat, fought on. Akbar, with only a few hundred men, defeated Ibrahim Husain Mirza at Sarnal in December 1572, and Surat surrendered on 26 February 1573 after a siege of about six weeks. Soon after Akbar went home, Muhammad Husain Mirza and Gujarati nobles under Ikhtiyar-ul-Mulk rose and besieged Ahmedabad. Akbar rode from Fatehpur Sikri to Ahmedabad, about 900 km, in some eleven days, and routed them outside the city in early September 1573; both rebel leaders were killed. Gujarat became a Mughal province, and the Buland Darwaza at Fatehpur Sikri was later built to mark the conquest. Muzaffar Shah escaped from captivity in 1583 and retook Ahmedabad, but Abdul Rahim Khan-i-Khanan defeated him near Sarkhej in 1584; captured in 1592, he took his own life.
: La conquête par Akbar du sultanat du Goujarat, le riche royaume de l’Inde occidentale, avec les ports de Cambaye et de Surate. Sous le jeune sultan Muzaffar Shah III, le Goujarat était déchiré par les rivalités entre ses nobles, et l’un des chefs de faction, Itimad Khan, fit appel à Akbar. Akbar quitta Fatehpur Sikri en juillet 1572 et atteignit Ahmedabad en novembre sans rencontrer beaucoup de résistance ; Muzaffar Shah fut fait prisonnier, et Itimad Khan et les nobles se soumirent. Les Mirza, cousins timourides d’Akbar entrés en rébellion et réfugiés au Goujarat, poursuivirent la lutte. Akbar, avec quelques centaines d’hommes seulement, battit Ibrahim Husain Mirza à Sarnal en décembre 1572, et Surate capitula le 26 février 1573 après un siège d’environ six semaines. Peu après le retour d’Akbar, Muhammad Husain Mirza et des nobles goujaratis menés par Ikhtiyar-ul-Mulk se soulevèrent et assiégèrent Ahmedabad. Akbar chevaucha de Fatehpur Sikri à Ahmedabad, soit environ 900 km, en quelque onze jours, et les mit en déroute sous les murs de la ville au début de septembre 1573 ; les deux chefs rebelles furent tués. Le Goujarat devint une province moghole, et le Buland Darwaza de Fatehpur Sikri fut construit plus tard pour commémorer la conquête. Muzaffar Shah s’évada en 1583 et reprit Ahmedabad, mais Abdul Rahim Khan-i-Khanan le battit près de Sarkhej en 1584 ; capturé en 1592, il se donna la mort.
