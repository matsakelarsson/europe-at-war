# French translations of the catalogue text (wave 8); step bodies follow later.
Babur’s conquest of Hindustan: Conquête de l’Hindoustan par Babur
The campaigns in which Babur, the Timurid ruler of Kabul, conquered the heart of northern India and founded the Mughal Empire. Invited by rebels against the Delhi sultan Ibrahim Lodi, he crossed the Indus in December 1525 with about 12,000 men and, with field guns and a line of carts lashed together, destroyed Ibrahim’s much larger army at Panipat on 21 April 1526. He went on to defeat the Rajput confederacy of Rana Sanga of Mewar at Khanwa in 1527, stormed the fortress of Chanderi in 1528 and broke the Afghan chiefs of the east and the army of Bengal on the Ghaghra in 1529. When he died at Agra in December 1530, his son Humayun inherited a new and unsettled realm that reached from Kabul and Kandahar to the borders of Bihar.: Les campagnes au cours desquelles Babur, souverain timouride de Kaboul, conquit le cœur de l’Inde du Nord et fonda l’Empire moghol. Appelé par des rebelles en lutte contre le sultan de Delhi Ibrahim Lodi, il franchit l’Indus en décembre 1525 avec environ 12 000 hommes et, grâce à ses canons de campagne et à une ligne de chariots attachés les uns aux autres, anéantit l’armée bien plus nombreuse d’Ibrahim à Panipat le 21 avril 1526. Il vainquit ensuite la confédération rajpoute de Rana Sanga du Mewar à Khanwa en 1527, prit d’assaut la forteresse de Chanderi en 1528 et brisa les chefs afghans de l’Est et l’armée du Bengale sur la Ghaghra en 1529. Lorsqu’il mourut à Agra en décembre 1530, son fils Humayun hérita d’un royaume neuf et mal affermi, qui s’étendait de Kaboul et Kandahar jusqu’aux confins du Bihar.
