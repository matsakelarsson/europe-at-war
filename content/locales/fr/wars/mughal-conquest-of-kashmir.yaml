# French translations of the catalogue text (wave 8); step bodies follow later.
Mughal conquest of Kashmir: Conquête moghole du Cachemire
Akbar’s annexation of the Kashmir Sultanate, ruled since 1561 by the Chak dynasty. In December 1585, while Akbar was at Attock on the Indus, he sent an army of about 5,000 horsemen under Raja Bhagwant Das of Amber and Mirza Shah Rukh across the mountains in winter. Sultan Yusuf Shah Chak met them at the Buliasa pass, but with his nobles divided he came to the Mughal camp and agreed terms on 14 February 1586. Akbar would not accept the agreement and kept Yusuf Shah a prisoner; he later held a Mughal rank in Bihar and died in exile in 1592. The Kashmiri nobles made his son Yaqub Shah sultan and fought on. A second Mughal army under Qasim Khan entered the valley later in 1586 and took Srinagar in the autumn, while Yaqub Shah kept up resistance from the hills until he submitted in 1589. Akbar visited the valley that year, and Kashmir became part of the Mughal province of Kabul and a favourite summer retreat of the Mughal emperors.: L’annexion par Akbar du sultanat du Cachemire, gouverné depuis 1561 par la dynastie Chak. En décembre 1585, alors qu’il se trouvait à Attock, sur l’Indus, Akbar envoya à travers les montagnes, en plein hiver, une armée d’environ 5 000 cavaliers commandée par le raja Bhagwant Das d’Amber et Mirza Shah Rukh. Le sultan Yusuf Shah Chak l’affronta au col de Buliasa, mais, ses nobles étant divisés, il se rendit au camp moghol et accepta des conditions le 14 février 1586. Akbar refusa l’accord et garda Yusuf Shah prisonnier ; celui-ci reçut plus tard un rang moghol au Bihar et mourut en exil en 1592. Les nobles cachemiris proclamèrent sultan son fils Yaqub Shah et poursuivirent la lutte. Une seconde armée moghole, commandée par Qasim Khan, entra dans la vallée plus tard en 1586 et prit Srinagar à l’automne, tandis que Yaqub Shah maintenait la résistance depuis les collines jusqu’à sa soumission en 1589. Akbar visita la vallée cette année-là, et le Cachemire fut rattaché à la province moghole de Kaboul et devint l’une des retraites estivales favorites des empereurs moghols.
