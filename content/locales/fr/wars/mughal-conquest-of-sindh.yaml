# French translations of the catalogue text (wave 8); step bodies follow later.
Mughal conquest of Sindh: Conquête moghole du Sind
Akbar’s conquest of lower Sindh, the kingdom of Thatta in the Indus delta, ruled by Mirza Jani Beg of the Tarkhan dynasty. Upper Sindh, with the island fortress of Bhakkar, had been Mughal since 1574. In 1591 Akbar, then at Lahore, sent his leading noble, Abdul Rahim Khan-i-Khanan, down the Indus with an army and river boats, partly to secure the route to Kandahar. Jani Beg raised tribal levies and a war fleet, partly built and manned with the help of Portuguese mercenaries from the coast, and fought the Mughals several times on the borders of Sehwan and on the river. He held out for about two years, but after defeats, a siege of his fortified camp and growing hunger he came to terms; Thatta was handed over in late 1592, and in 1593 Jani Beg went to Akbar’s court at Lahore. Akbar made him a commander of 5,000 and left him Thatta and Sehwan to govern as a Mughal officer, and his family governed it until 1612. Sindh became part of the Mughal province of Multan, and later a province of its own, Thatta.: La conquête par Akbar du bas Sind, le royaume de Thatta dans le delta de l’Indus, gouverné par Mirza Jani Beg, de la dynastie Tarkhan. Le haut Sind, avec la forteresse insulaire de Bhakkar, était moghol depuis 1574. En 1591, Akbar, qui se trouvait alors à Lahore, envoya son principal noble, Abdul Rahim Khan-i-Khanan, descendre l’Indus avec une armée et des bateaux fluviaux, en partie pour assurer la route de Kandahar. Jani Beg leva des contingents tribaux et une flotte de guerre, construite et armée en partie avec l’aide de mercenaires portugais venus de la côte, et affronta les Moghols à plusieurs reprises aux confins de Sehwan et sur le fleuve. Il résista environ deux ans, mais après plusieurs défaites, le siège de son camp fortifié et une faim grandissante, il traita ; Thatta fut livrée à la fin de 1592, et en 1593 Jani Beg se rendit à la cour d’Akbar à Lahore. Akbar fit de lui un commandant de 5 000 et lui laissa le gouvernement de Thatta et de Sehwan en tant qu’officier moghol, et sa famille gouverna le pays jusqu’en 1612. Le Sind fut rattaché à la province moghole de Multan, puis devint une province à part entière, celle de Thatta.
