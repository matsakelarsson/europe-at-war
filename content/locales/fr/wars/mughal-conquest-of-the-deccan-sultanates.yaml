# French translations of the catalogue text (wave 8); step bodies follow later.
Mughal wars in the Deccan (1595–1636): Guerres mogholes dans le Dekkan (1595–1636)
The Mughal Empire’s first push into the Deccan, against the sultanates of Ahmadnagar and Khandesh, and the settlement that followed with Bijapur and Golconda. Akbar’s armies besieged Ahmadnagar in 1595–96, when it was famously defended by Chand Bibi, and forced it to cede Berar. In 1600 they stormed Ahmadnagar fort, and in January 1601 Akbar took Asirgarh, the fortress of Khandesh, which was annexed. But the Ahmadnagar state survived under the Ethiopian-born regent Malik Ambar, who with Maratha light cavalry held the Mughals at bay for a quarter of a century and beat a Mughal and Bijapuri army at Bhatvadi in 1624. After his death in 1626 the sultanate weakened. Shah Jahan’s general Mahabat Khan took the fortress of Daulatabad in 1633, and in 1636 Ahmadnagar was divided between the Mughals and Bijapur, while Bijapur and Golconda accepted Mughal overlordship by treaty.: La première poussée de l’Empire moghol dans le Dekkan, contre les sultanats d’Ahmadnagar et du Khandesh, et le règlement qui s’ensuivit avec Bijapur et Golconde. Les armées d’Akbar assiégèrent Ahmadnagar en 1595–1596, lors de la célèbre défense de la ville par Chand Bibi, et la contraignirent à céder le Berar. En 1600, elles prirent d’assaut le fort d’Ahmadnagar, et en janvier 1601 Akbar s’empara d’Asirgarh, la forteresse du Khandesh, qui fut annexé. Mais l’État d’Ahmadnagar survécut sous le régent d’origine éthiopienne Malik Ambar, qui, avec la cavalerie légère marathe, tint les Moghols en échec pendant un quart de siècle et battit une armée moghole et bijapurie à Bhatvadi en 1624. Après sa mort en 1626, le sultanat s’affaiblit. Le général de Shah Jahan, Mahabat Khan, prit la forteresse de Daulatabad en 1633, et en 1636 Ahmadnagar fut partagé entre les Moghols et Bijapur, tandis que Bijapur et Golconde acceptaient par traité la suzeraineté moghole.
