# French translations of the catalogue text (wave 8); step bodies follow later.
Mughal–Maratha wars: Guerres entre les Moghols et les Marathes
The twenty-seven years’ war in the Deccan between the Mughal emperor Aurangzeb and the Maratha kingdom founded by Shivaji. Aurangzeb came south in 1681 with the court and an army of several hundred thousand, sheltered by no city, and stayed for the rest of his life. After conquering Bijapur and Golconda he captured Shivaji’s son and successor Sambhaji in 1689 and had him executed, and took the Maratha capital Raigad. Sambhaji’s brother Rajaram escaped to Gingee in the far south, which held out until 1698, while Maratha cavalry under Santaji Ghorpade and Dhanaji Jadhav raided across the Deccan and beat Mughal armies in the field. From 1699 the aged emperor besieged the Maratha hill forts one by one; under Rajaram’s widow Tarabai the Marathas retook them as soon as he left and carried their raids north of the Narmada. Aurangzeb died at Ahmednagar in 1707 with the war unwon, his treasury drained and the Deccan devastated.: La guerre de vingt-sept ans que se livrèrent dans le Dekkan l’empereur moghol Aurangzeb et le royaume marathe fondé par Shivaji. Aurangzeb descendit vers le sud en 1681 avec la cour et une armée de plusieurs centaines de milliers d’hommes, sans résider dans aucune ville, et y resta jusqu’à la fin de sa vie. Après avoir conquis Bijapur et Golconde, il captura en 1689 Sambhaji, fils et successeur de Shivaji, qu’il fit exécuter, et prit Raigad, la capitale marathe. Le frère de Sambhaji, Rajaram, s’enfuit à Gingee, dans l’extrême sud, qui résista jusqu’en 1698, tandis que la cavalerie marathe de Santaji Ghorpade et de Dhanaji Jadhav lançait des raids à travers le Dekkan et battait les armées mogholes en rase campagne. À partir de 1699, le vieil empereur assiégea une à une les forteresses de montagne marathes ; sous la conduite de Tarabai, veuve de Rajaram, les Marathes les reprenaient dès qu’il s’en éloignait, et portèrent leurs raids au nord de la Narmada. Aurangzeb mourut à Ahmednagar en 1707 sans avoir gagné la guerre, le trésor épuisé et le Dekkan dévasté.
