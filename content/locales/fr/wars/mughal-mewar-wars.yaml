# French translations of the catalogue text (wave 8); step bodies follow later.
Mughal–Mewar wars: Guerres entre les Moghols et le Mewar
"The wars between the Mughal emperors Akbar and Jahangir and the Rajput kingdom of Mewar, the one major Rajput state that refused to accept Mughal overlordship. Akbar stormed Mewar’s fortress capital, Chittorgarh, in February 1568 after a four-month siege, and many of its people were killed. Rana Udai Singh II and then his son Pratap Singh fought on from the Aravalli hills. A Mughal army under Raja Man Singh of Amber defeated Pratap at Haldighati in 1576, but he escaped and in later years won back most of Mewar except Chittorgarh. Under Jahangir, repeated campaigns, the last led by Prince Khurram, the future Shah Jahan, exhausted the country, and in February 1615 Pratap’s son Amar Singh I made peace on honourable terms: he was excused from attending the Mughal court and Chittorgarh was returned, though it was not to be refortified.": "Les guerres entre les empereurs moghols Akbar et Jahangir et le royaume rajpoute du Mewar, le seul grand État rajpoute à refuser la suzeraineté moghole. Akbar prit d’assaut la capitale fortifiée du Mewar, Chittorgarh, en février 1568 après un siège de quatre mois, et nombre de ses habitants furent tués. Le rana Udai Singh II, puis son fils Pratap Singh, poursuivirent la lutte depuis les monts Aravalli. Une armée moghole commandée par le raja Man Singh d’Amber battit Pratap à Haldighati en 1576, mais il s’échappa et reconquit dans les années suivantes la plus grande partie du Mewar, à l’exception de Chittorgarh. Sous Jahangir, des campagnes répétées, dont la dernière fut menée par le prince Khurram, le futur Shah Jahan, épuisèrent le pays, et en février 1615 le fils de Pratap, Amar Singh Ier, fit la paix à des conditions honorables : il fut dispensé de paraître à la cour moghole et Chittorgarh lui fut rendue, mais elle ne devait pas être refortifiée."
