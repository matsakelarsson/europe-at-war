# French translations of the catalogue text (wave 7); step bodies follow later.
Mughal–Safavid wars over Kandahar: Guerres entre Moghols et Safavides pour Kandahar
The struggle between Safavid Persia and the Mughal Empire for Kandahar, the fortress city on the trade road between India and Iran. Shah Abbas I took it from the Mughals in 1622 after a 45-day siege. Its Persian governor, Ali Mardan Khan, handed it to Shah Jahan in 1638, but Shah Abbas II won it back in February 1649. Three great Mughal sieges, two under Prince Aurangzeb and one under Prince Dara Shikoh, failed in 1649, 1652 and 1653, and Kandahar stayed Persian until the Hotaki revolt of 1709.: La lutte entre la Perse safavide et l’Empire moghol pour Kandahar, ville forteresse située sur la route commerciale entre l’Inde et l’Iran. Le shah Abbas Ier la prit aux Moghols en 1622 après un siège de 45 jours. Son gouverneur persan, Ali Mardan Khan, la livra à Shah Jahan en 1638, mais le shah Abbas II la reprit en février 1649. Trois grands sièges moghols, deux sous le prince Aurangzeb et un sous le prince Dara Shikoh, échouèrent en 1649, 1652 et 1653, et Kandahar resta persane jusqu’à la révolte des Hotaki en 1709.
