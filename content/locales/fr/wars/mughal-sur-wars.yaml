# French translations of the catalogue text (wave 8); step bodies follow later.
Mughal–Sur wars: Guerres entre Moghols et Sur
The struggle between Babur’s son Humayun and the Afghan Sur dynasty for northern India. Sher Khan Sur, an Afghan chief of Bihar, took Bengal in 1538, destroyed Humayun’s army at Chausa in 1539 and beat him again at Kannauj in 1540, driving the Mughals out of India. As Sher Shah he ruled from Bengal to the Indus until his death in 1545, building roads, forts and a new silver coinage. Humayun wandered through Sindh and the desert, where his son Akbar was born, and found help in Safavid Persia, which let him take Kandahar and Kabul in 1545. When the Sur empire split between rival claimants after 1554, he came back, won at Sirhind and re-entered Delhi in July 1555, but died six months later. Hemu, general of the Sur ruler Adil Shah, then took Agra and Delhi, until the Mughal army of the 13-year-old Akbar and his regent Bairam Khan defeated him at the Second Battle of Panipat on 5 November 1556.: La lutte entre Humayun, fils de Babur, et la dynastie afghane des Sur pour la domination de l’Inde du Nord. Sher Khan Sur, chef afghan du Bihar, prit le Bengale en 1538, anéantit l’armée d’Humayun à Chausa en 1539 et le battit de nouveau à Kannauj en 1540, chassant les Moghols de l’Inde. Sous le nom de Sher Shah, il régna du Bengale à l’Indus jusqu’à sa mort en 1545, faisant construire des routes et des forts et créant une nouvelle monnaie d’argent. Humayun erra à travers le Sind et le désert, où naquit son fils Akbar, et trouva de l’aide auprès de la Perse safavide, ce qui lui permit de prendre Kandahar et Kaboul en 1545. Lorsque l’empire des Sur se divisa entre prétendants rivaux après 1554, il revint, l’emporta à Sirhind et rentra dans Delhi en juillet 1555, mais mourut six mois plus tard. Hemu, général d’Adil Shah, souverain de la dynastie Sur, prit alors Agra et Delhi, avant d’être vaincu par l’armée moghole d’Akbar, alors âgé de 13 ans, et de son régent Bairam Khan à la deuxième bataille de Panipat, le 5 novembre 1556.
