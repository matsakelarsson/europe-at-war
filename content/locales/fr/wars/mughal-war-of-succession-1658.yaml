# French translations of the catalogue text (wave 8); step bodies follow later.
Mughal war of succession (1658–1659): Guerre de succession moghole (1658–1659)
The war between the four sons of the Mughal emperor Shah Jahan after he fell ill in September 1657. The eldest, Dara Shikoh, held the court as his father’s favourite; Shah Shuja in Bengal and Murad Bakhsh in Gujarat crowned themselves, and Aurangzeb, viceroy of the Deccan, joined Murad. Dara’s son Sulaiman Shikoh beat Shuja at Bahadurpur, but Aurangzeb and Murad routed the imperial army at Dharmat and Dara himself at Samugarh near Agra in 1658. Aurangzeb confined Shah Jahan in Agra fort, arrested Murad and had himself proclaimed emperor. He defeated Shuja at Khajwa and Dara again at Deorai near Ajmer in 1659; Dara was betrayed, paraded through Delhi and executed for apostasy, and Shuja fled to Arakan in 1660. Aurangzeb ruled until 1707.: La guerre entre les quatre fils de l’empereur moghol Shah Jahan, après que celui-ci fut tombé malade en septembre 1657. L’aîné, Dara Shikoh, favori de son père, tenait la cour ; Shah Shuja au Bengale et Murad Bakhsh au Goujarat se couronnèrent eux-mêmes, et Aurangzeb, vice-roi du Dekkan, s’allia à Murad. Le fils de Dara, Sulaiman Shikoh, battit Shuja à Bahadurpur, mais Aurangzeb et Murad mirent en déroute l’armée impériale à Dharmat, puis Dara lui-même à Samugarh, près d’Agra, en 1658. Aurangzeb fit enfermer Shah Jahan dans le fort d’Agra, fit arrêter Murad et se fit proclamer empereur. Il vainquit Shuja à Khajwa, puis de nouveau Dara à Deorai, près d’Ajmer, en 1659 ; Dara fut trahi, promené dans les rues de Delhi et exécuté pour apostasie, et Shuja s’enfuit en Arakan en 1660. Aurangzeb régna jusqu’en 1707.
