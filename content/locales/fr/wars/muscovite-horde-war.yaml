"After 1359 the Golden Horde fell into two decades of civil war, the “Great Troubles”, in which more than twenty khans came and went. In the west the beylerbey Mamai ruled through puppet khans. Dmitry Ivanovich of Moscow, who had kept the khan’s patent for the grand principality of Vladimir against the princes of Tver, broke with Mamai in 1374 and later stopped paying tribute. In 1376 a Muscovite army forced the town of Bulgar on the middle Volga to pay tribute, and in 1377 Mamai’s Tatars surprised and destroyed a Russian army on the Pyana river, then plundered Nizhny Novgorod.": "Après 1359 la Horde d’Or est tombée dans deux décennies de guerre civile, les Grandes Troubles, dans lequel plus de vingt khans sont venus et allé. Dans l’ouest le bellerbey Mamai a dirigé par des khans marionnettes. Dmitri Ivanovitch de Moscou, qui avait gardé le brevet khans pour la grande principauté de Vladimir contre les princes de Tver, a rompu avec Mamai en 1374 et a ensuite cessé de rendre hommage. En 1376, une armée de Muscovite força la ville de Bulgar sur la Volga du milieu à rendre hommage, et en 1377, les Tatars de Mamai ont surpris et détruit une armée russe sur le fleuve Pyana, puis pillé Nijni Novgorod."
"In 1378 Mamai sent an army under Murza Begich to bring Moscow to heel. Dmitry met it in the Ryazan lands on the Vozha, a tributary of the Oka, and held the ford. On 11 August, after a long wait, Begich crossed the river. His cavalry was beaten back by the Russian centre under Dmitry and the wings under Timofey Velyaminov and Andrei of Polotsk, and a counter-attack drove the Tatars into the river, where many drowned. Begich was killed. It was Moscow’s first victory over a large Horde army. That autumn Mamai took his revenge on Ryazan and burned its capital.": "En 1378, Mamai envoya une armée sous Murza Begich pour amener Moscou au talon. Dmitry la rencontra dans les terres de Ryazan sur le Vozha, un affluent de l’Oka, et tenu le gué. Le 11 août, après une longue attente, Begich traversa le fleuve. Sa cavalerie a été battue par le centre russe sous Dmitry et les ailes sous Timofey Velyaminov et Andrei de Polotsk, et une contre-attaque a conduit les Tatars dans la rivière, où beaucoup se sont noyés. Begich a été tué. C’était Moscou , première victoire sur une grande armée de Horde. Cet automne Mamai a pris sa vengeance sur Riazan et brûlé sa capitale."
