"In 1380 Mamai, threatened in the east by Tokhtamysh, led a large army north himself. He allied with Grand Duke Jogaila of Lithuania, and Prince Oleg of Ryazan, caught between the two sides, nominally joined him. Dmitry gathered troops from most of north-eastern Rus’ at Kolomna and refused the higher tribute Mamai’s envoys demanded. He marched west along the Oka, crossed it at Lopasnya in late August and headed south to fight before Mamai and Jogaila could join forces. On the morning of 8 September his army crossed the Don to Kulikovo Field, the “snipe field”, near the mouth of the Nepryadva.": "En 1380, Mamai, menacé à l’est par Tokhtamysh, mena une grande armée au nord lui-même. Il s’allia avec le Grand Duc Jogaila de Lituanie, et le prince Oleg de Riazan, pris entre les deux côtés, nominalment rejoint lui. Il marcha vers l’ouest le long de l’Oka, la traversa à Lopasnya fin août et se dirigea vers le sud pour combattre avant que Mamai et Jogaila puissent unir leurs forces. Le matin du 8 septembre, son armée traversa le champ Don jusqu’à Kulikovo, le champ de -Snipe, près de l’embouchure de la Nepryadva."
"Later tales begin the battle with a duel in which the monk Peresvet and a Tatar champion killed each other. The armies then fought a long, bloody mêlée until an ambush regiment under Prince Vladimir Andreyevich and Dmitry Bobrok fell on the Tatars’ flank and routed them. Dmitry was found wounded among the dead. Chroniclers wrote of hundreds of thousands of men; modern estimates range from a few thousand to several tens of thousands. Jogaila turned back, and Mamai, beaten soon afterwards by Tokhtamysh, was killed at Caffa in the Crimea. Dmitry became known as Donskoy, “of the Don”.": "Des contes plus tard commencent la bataille avec un duel dans lequel le moine Peresvet et un champion tatar se tuent. Les armées combattent alors une longue mêlée sanglante jusqu’à ce qu’un régiment d’embuscade sous le prince Vladimir Andreyevitch et Dmitry Bobrok tombe sur le flanc des Tatars et les déroute. Les chroniqueurs ont écrit des centaines de milliers d’hommes ; les estimations modernes vont de quelques milliers à plusieurs dizaines de milliers. Jogaila tourné en arrière, et Mamaï, battu peu après par Tokhtamysh, a été tué à Caffa dans la Crimée. Dmitry est devenu connu sous le nom Donskoï, \"du don\" ."
