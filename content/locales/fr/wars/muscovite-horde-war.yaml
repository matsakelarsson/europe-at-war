"Tokhtamysh, now khan of a reunited Horde, demanded that Moscow submit. In the summer of 1382 he moved north so fast that Dmitry could not gather an army, and the princes of Nizhny Novgorod and Ryazan, hoping to save their own lands, helped him; Oleg of Ryazan is said to have shown him the fords of the Oka. Dmitry left for Kostroma to raise troops, and the metropolitan also left the city. After riots, the townspeople chose a Lithuanian prince, Ostey, a grandson of Algirdas, to lead the defence of the Kremlin, which Dmitry had rebuilt in stone in 1367.": "Tokhtamysh, maintenant khan d’une Horde réunie, a exigé que Moscou se soumette. À l’été de 1382, il s’est déplacé au nord si vite que Dmitry ne pouvait pas rassembler une armée, et les princes de Nijny Novgorod et Riazan, espérant sauver leurs propres terres, l’aidèrent ; Oleg de Ryazan aurait montré les forts de l’Oka. Après les émeutes, les habitants de la ville ont choisi un prince lituanien, Ostey, petit-fils d’Algirdas, pour diriger la défense du Kremlin que Dmitry avait reconstruit en pierre en 1367."
"The Tatars arrived on 23 August and failed to storm the walls. On 26 August the princes of Nizhny Novgorod who rode with the khan swore that the city would be spared if it opened its gates. Ostey went out to negotiate and was killed, and the Tatars broke in, massacred the people and burned the city; a figure of 24,000 dead is often cited. Detachments sacked Pereslavl, Kolomna and other towns, though Vladimir Andreyevich beat one near Volok Lamsky. Dmitry kept his title but paid tribute again, and in 1383 sent his son Vasily to the Horde as a hostage.": "Le 26 août, les princes de Nijni Novgorod qui montèrent avec le khan juraient que la ville serait épargnée si elle ouvrait ses portes. Ostey sortit pour négocier et fut tué, et les Tatars arrivèrent, massacrérent le peuple et incendièrent la ville ; une figure de 24 000 morts est souvent citée. Les détachements ont renvoyé Pereslavl, Kolomna et d’autres villes, bien que Vladimir Andreyevich en ait battu un près de Volok Lamsky. Dmitry a gardé son titre mais a rendu hommage à nouveau, et en 1383 a envoyé son fils Vasily à la Horde comme otage."
