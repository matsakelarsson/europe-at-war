"Moscow against the Horde, 1378–1382": "Moscou contre la Horde, 1378–1382"
"The war between Grand Prince Dmitry of Moscow and the Golden Horde during its civil war. Dmitry beat Mamai’s armies on the Vozha in 1378 and at Kulikovo in 1380, but in 1382 Khan Tokhtamysh, who had reunited the Horde, burned Moscow and forced Dmitry to pay tribute again.": "La guerre entre le Grand Prince Dmitry de Moscou et la Horde d’or pendant sa guerre civile. Dmitry bat les armées de Mamaï sur la Vozha en 1378 et à Kulikovo en 1380, mais en 1382, Khan Tokhtamysh, qui a réuni la Horde, brûlé Moscou et forcé Dmitry à rendre hommage à nouveau."
"Dates are Julian (Old Style), as in the Russian chronicles. Most of the detail about Kulikovo comes from tales written decades or centuries later, and their numbers are not reliable; one recent historian has even questioned whether the battle on the Vozha took place as described.": "Les dates sont Julian (Ancien Style), comme dans les chroniques russes. La plupart des détails sur Kulikovo provient de contes écrits des décennies ou des siècles plus tard, et leurs chiffres ne sont pas fiables ; un historien récent a même questionné si la bataille sur le Vozha a eu lieu comme décrit."
"Mamai was not a descendant of Genghis Khan and ruled the western Horde through puppet khans. Tokhtamysh, a Genghisid backed by Timur, took over the eastern Horde in the late 1370s and reunited it after Kulikovo.": "Mamai n’était pas un descendant de Genghis Khan et a gouverné la Horde occidentale par des khans marionnettes. Tokhtamysh, un Genghisid soutenu par Timur, a repris la Horde orientale à la fin des années 1370 et l’a réuni après Kulikovo."
"Moscow’s rulers held the title of grand prince of Vladimir, granted by the khans, and led the princes of north-eastern Rus’ who joined them.": "Moscou a tenu le titre de grand prince de Vladimir, accordé par les khans, et a conduit les princes du nord-est Rus."
