"1500–1503": "1500–1503"
"Ivan III of Moscow called himself sovereign of all Russia and claimed the lands of the old Kievan Rus’, many of them ruled by Lithuania. A first border war in 1492–1494 cost Lithuania Vyazma and towns on the upper Oka. In May 1500, citing the treatment of the Orthodox in Lithuania, Ivan attacked again, and several Orthodox border princes went over to him. Bryansk, Dorogobuzh, Putyvl and other towns fell quickly. On 14 July 1500 his army crushed a Lithuanian force on the Vedrosha river near Dorogobuzh and captured its commander, Grand Hetman Konstanty Ostrogski.": "Ivan III de Moscou s’est appelé souverain de toute la Russie et a revendiqué les terres du vieux Kievan Rus, beaucoup d’entre eux gouvernés par la Lituanie. Une première guerre frontalière en 1492–1494 a coûté la Lituanie Vyazma et les villes sur le haut Oka. En mai 1500, citant le traitement des orthodoxes en Lituanie, Ivan a attaqué à nouveau, et plusieurs princes frontière orthodoxes sont allés vers lui. Bryansk, Dorogobuzh, Putyvl et d’autres villes sont rapidement tombés. Le 14 juillet 1500 son armée a écrasé une force lituanienne sur la rivière Vedrosha près de Dorogobuzh et capturé son commandant, Grand Hetman Konstanty Ostrogski."
"Lithuania was beaten again at Mstsislaw in 1501. The Livonian Order came in on its side and won on the Seritsa in August 1501, and a Muscovite siege of Smolensk in 1502 failed. A six-year truce was agreed on 25 March 1503, the feast of the Annunciation. Moscow kept Chernihiv, Novhorod-Siverskyi, Starodub, Bryansk and the upper Oka lands, by some estimates about a third of the Grand Duchy.": "La Lituanie a été battue à nouveau à Mstsislaw en 1501. L’Ordre livonien est entré sur son côté et a gagné sur la Seritsa en août 1501, et un siège Muscovite de Smolensk en 1502 a échoué. Une trêve de six ans a été convenue le 25 mars 1503, la fête de l’Annonciation. Moscou a gardé Chernihiv, Novhorod-Siverskyi, Starodub, Bryansk et les terres de la haute Oka, selon certaines estimations environ un tiers du Grand-Duché."
