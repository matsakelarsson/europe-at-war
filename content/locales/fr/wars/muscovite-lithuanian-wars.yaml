"Muscovite–Lithuanian Wars, 1492–1537": "Guerres entre la Moscovie et la Lituanie, 1492–1537"
"A series of wars in which the Grand Duchy of Moscow, claiming the lands of the old Kievan Rus’, took a large part of eastern Lithuania. The peace of 1494 and the truce of 1503 cost Lithuania Vyazma, Chernihiv and Siveria, and Smolensk fell in 1514 despite the Polish–Lithuanian victory at Orsha; a last war in 1534–1537 changed little.": "Au cours d’une série de guerres, la grande-principauté de Moscou revendique les terres de l’ancienne Rus’ de Kiev et s’empare d’une grande partie de l’est de la Lituanie. La paix de 1494 et la trêve de 1503 coûtent à la Lituanie Viazma, Tchernihiv et la Sévérie. Smolensk tombe en 1514 malgré la victoire polono-lituanienne à Orcha. Une dernière guerre, de 1534 à 1537, change peu la situation."
"Dates are Julian (Old Style), as the sources give them.": "Les dates sont Julian (Ancien Style), comme les sources leur donnent."
"Lithuania and Poland were separate states under one dynasty; Polish troops fought in strength only from 1514. Moscow was often allied with the Crimean Khanate, and Lithuania at times with the Livonian Order.": "La Lituanie et la Pologne étaient des États séparés sous une dynastie ; les troupes polonaises combattaient en force seulement à partir de 1514. Moscou était souvent allié avec le khanate de Crimée, et la Lituanie parfois avec l’Ordre Livonien."
"The wars are usually counted as five, in 1487–1494, 1500–1503, 1507–1508, 1512–1522 and 1534–1537. Only the two that changed the border most are told here.": "Les guerres sont généralement comptées comme cinq, en 1487-1494, 1500-1503, 1507-1508, 1512-1522 et 1534-1537. Seuls les deux qui ont changé la frontière le plus sont racontés ici."
