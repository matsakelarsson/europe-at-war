"Ivan’s son Vasily III renewed the war in December 1512, aiming at Smolensk, the great fortress on the upper Dnieper. Sieges in 1513 failed, but a third, with heavy artillery, forced the town to surrender on 30 July 1514. Muscovite forces pushed on towards Orsha and Mstsislaw. King Sigismund I raised an army of about 35,000, more than half of them Poles, and gave the field command to Konstanty Ostrogski, who had escaped from Muscovite captivity.": "Le fils d’Ivans Vasily III renouvela la guerre en décembre 1512, visant Smolensk, la grande forteresse sur le Dniepr supérieur. Siéges en 1513 échoua, mais un tiers, avec de l’artillerie lourde, força la ville à se rendre le 30 juillet 1514. Le roi Sigismund J’ai élevé une armée d’environ 35 000, dont plus de la moitié de Polonais, et donné le commandement sur le terrain à Konstanty Ostrogski, qui avait échappé de la captivité Muscovite."
"On 8 September 1514 Ostrogski crossed the Dnieper near Orsha on pontoon bridges and routed the Muscovite army, whose commander Ivan Chelyadnin was captured. Sigismund celebrated the victory across Europe, but his army could not retake Smolensk. The war dragged on in raids until a truce in 1522 left Smolensk with Moscow, which kept it until 1611. A further war in 1534–1537 ended with Lithuania regaining Homel and Moscow keeping Sebezh.": "Le 8 septembre 1514, Ostrogski traversa le Dniepr près d’Orsha sur les ponts ponton et dirigea l’armée de Muscovite, dont le commandant Ivan Chelyadnin fut capturé. Sigismond célébra la victoire à travers l’Europe, mais son armée ne put reprendre Smolensk. La guerre traînée dans des raids jusqu’à ce qu’une trêve en 1522 quitte Smolensk avec Moscou, qui la conserva jusqu’en 1611. Une nouvelle guerre en 1534–1537 s’est terminée avec la reprise par la Lituanie de Homel et Moscou, qui gardait Sebezh."
