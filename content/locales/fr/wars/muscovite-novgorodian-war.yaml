# Some French text was translated automatically.
"Muscovite–Novgorodian War": "Muscovite – Guerre néogorodienne"
"The war in which Ivan III of Moscow ended the independence of the Novgorod Republic. After Novgorod turned to Lithuania for support, Ivan’s army routed the Novgorodians on the Shelon in 1471, and in January 1478 a second campaign forced the city to surrender; its assembly was abolished and its vast northern lands passed to Moscow.": "La guerre dans laquelle Ivan III de Moscou a mis fin à l’indépendance de la République de Novgorod. Après que Novgorod s’est tourné vers la Lituanie pour obtenir du soutien, l’armée d’Ivan a conduit les Novgorodiens sur le Shelon en 1471, et en janvier 1478 une deuxième campagne a forcé la ville à se rendre ; son assemblée a été abolie et ses vastes terres du nord passé à Moscou."
"Dates are Julian (Old Style). Most of the chronicles were written or revised in Moscow after the conquest and are hostile to Novgorod; the Moscow account claims a Novgorodian army of 40,000 at the Shelon and 12,000 dead, figures historians consider exaggerated.": "Les dates sont Julian (Ancien Style). La plupart des chroniques ont été écrites ou révisées à Moscou après la conquête et sont hostiles à Novgorod ; le récit de Moscou réclame une armée novorode de 40 000 au Shelon et 12 000 morts, figures historiens considèrent exagéré."
"Novgorod, called “Lord Novgorod the Great”, was governed by its assembly, the veche, its archbishop and its boyars. Its princes, by then the grand princes of Moscow, were bound by treaty and had limited powers.": "Novgorod, appelé le Seigneur Novgorod le Grand, était gouverné par son assemblée, la veche, son archevêque et ses boyards. Ses princes, à l’époque les grands princes de Moscou, étaient liés par traité et avaient des pouvoirs limités."
