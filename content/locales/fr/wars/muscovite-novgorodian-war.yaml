"May – August 1471": "mai – août 1471"
"Novgorod, the great trading republic of the north, accepted the grand princes of Moscow as its princes but ran its own affairs. After Vasily II imposed the Treaty of Yazhelbitsy on it in 1456, a party led by the Boretsky family and the widow Marfa Boretskaya looked to Lithuania for protection. In 1470 Novgorod invited the Lithuanian prince Mikhailo Olelkovich, and a treaty was drafted placing the city under King Casimir IV, who probably never ratified it. Ivan III called this treason and apostasy from Orthodoxy, and in May 1471 he went to war, joined by Pskov and Tver.": "Novgorod, la grande république commerçante du nord, accepta les grands princes de Moscou comme ses princes mais gérait ses propres affaires. Après Vasily II lui imposa le traité de Yazhelbitsy en 1456, un parti dirigé par la famille Boretsky et la veuve Marfa Boretskaya chercha à se protéger en Lituanie. En 1470 Novgorod invita le prince lituanien Mikhailo Olelkovich, et un traité fut rédigé plaçant la ville sous le roi Casimir IV, qui ne l’avait probablement jamais ratifiée. Ivan III appela cette trahison et apostasie de l’orthodoxie, et en mai 1471 il alla à la guerre, rejoint par Pskov et Tver."
"Muscovite armies converged on Novgorod from several sides. Prince Daniil Kholmsky’s vanguard burned Staraya Russa and on 14 July met the Novgorodian army on the Shelon river, west of Lake Ilmen. The Novgorodians, at least 10,000 men and many of them untrained townsmen, outnumbered Kholmsky’s 4,000–5,000, but a charge by Tatar horsemen from Kasimov broke them and they were pursued for miles. Their commander, Dmitry Boretsky, was captured and beheaded on Ivan’s orders. Another Muscovite force won on the Shilenga in the Dvina land. By the Treaty of Korostyn in August, Novgorod gave up Lithuania and recognised itself as Ivan’s patrimony.": "L’avant-garde du prince Daniil Kholmsky a brûlé Staraya Russa et le 14 juillet a rencontré l’armée novgorodienne sur la rivière Shelon, à l’ouest du lac Ilmen. Les Novgorodiens, au moins 10 000 hommes et beaucoup d’entre eux sans formation, étaient plus nombreux que Kholmsky 4000–5 000, mais une charge par les cavaliers tatars de Kasimov les a brisés et ils ont été poursuivis pendant des miles. Leur commandant, Dmitri Boretsky, a été capturé et décapité sur les ordres Ivan. Une autre force Muscovite a gagné sur le Shilenga dans la terre de Dvina. Par le traité de Korostyn en août, Novgorod a abandonné la Lituanie et s’est reconnu comme le patrimoine d’Ivan."
