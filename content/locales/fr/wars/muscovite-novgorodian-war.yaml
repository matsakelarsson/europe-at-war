"1475–1478": "1475–1478"
"Moscow’s hold tightened. In 1475 Ivan came to Novgorod to hear lawsuits and had leading boyars of the anti-Muscovite party arrested and sent to Moscow. In 1477 two envoys from Novgorod addressed him as gosudar, “sovereign”, instead of the customary “lord”. Novgorod said they had no authority to do so, but Ivan took them at their word and demanded the powers the title implied. When the veche refused, he set out with a large army in October 1477, accusing the city of breaking its oath.": "En 1475 Ivan est venu à Novgorod pour entendre des poursuites et a eu les principaux boyars du parti anti-Muscovite arrêté et envoyé à Moscou. En 1477, deux envoyés de Novgorod s’adressèrent à lui comme gosudar, \"sovereign\" au lieu de l’habituel \"lord\". Novgorod a dit qu’ils n’avaient aucune autorité pour le faire, mais Ivan les a pris à leur parole et a exigé les pouvoirs que le titre impliquait. Lorsque la veche refusa, il partit avec une grande armée en octobre 1477, accusant la ville de rompre son serment."
"By late November Ivan’s troops surrounded Novgorod and cut off its supplies. Divided and short of food, the city did not fight, and on 15 January 1478 it submitted to his terms. The veche was abolished, its bell was taken down and carried to Moscow, and Ivan’s governors replaced the elected officials. Marfa Boretskaya was arrested and her lands taken, and in the 1480s thousands of boyars, merchants and landowners were deported to central Russia, their estates given to Ivan’s servitors. Novgorod’s lands, stretching to the White Sea and the Urals, became part of the Muscovite state.": "Fin novembre, les troupes d’Ivan ont encerclé Novgorod et coupé ses provisions. Divisée et à court de nourriture, la ville n’a pas combattu, et le 15 janvier 1478 elle s’est soumise à ses conditions. La veche a été abolie, sa cloche a été abattue et portée à Moscou, et les gouverneurs d’Ivans ont remplacé les élus. Marfa Boretskaya a été arrêtée et ses terres prises, et dans les années 1480 des milliers de boyars, marchands et propriétaires ont été déportés vers la Russie centrale, leurs propriétés données à Ivan ès serviteurs. Novgorod ès terres, s’étendant à la mer Blanche et l’Oural, est devenu partie de l’État Muscovite."
