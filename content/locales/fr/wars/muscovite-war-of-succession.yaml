# Some French text was translated automatically.
"Muscovite War of Succession": "La guerre de succession Muscovite"
"A civil war in the grand principality of Moscow between Vasily II and his uncle, Yury of Zvenigorod and Galich, and then Yury’s sons Vasily Kosoy and Dmitry Shemyaka, who claimed the throne under the older custom of succession from brother to brother. Moscow changed hands several times, and both sides blinded captured rivals, Vasily II himself in 1446. Vasily regained his throne in 1447, and after Shemyaka was poisoned in Novgorod in 1453 succession from father to son was secure.": "Une guerre civile dans la grande principauté de Moscou entre Vassily II et son oncle, Yury de Zvenigorod et Galich, puis Yury des fils Vassily Kosoy et Dmitri Shemyaka, qui ont revendiqué le trône sous l’ancienne coutume de succession de frère en frère. Moscou a changé de mains plusieurs fois, et les deux côtés aveuglés capturé rival, Vassily II lui-même en 1446. Vasily reprit son trône en 1447, et après que Shemyaka fut empoisonné à Novgorod en 1453 succession de père en fils était sûr."
"Also called the Muscovite Civil War. Dates are Julian (Old Style), as in the Russian chronicles.": "Aussi appelé la guerre civile Muscovite. Dates sont Julian (ancien style), comme dans les chroniques russes."
"Both sides sought the backing of the khans. The capture of Vasily II by the Tatars of Ulugh Muhammad at Suzdal in 1445, which weakened him before Shemyaka’s coup, is told under the Russo-Kazan Wars.": "Les deux parties ont cherché le soutien des khans. La capture de Vasily II par les Tatars d’Ulugh Muhammad à Suzdal en 1445, qui l’a affaibli avant le coup d’État de Shemyaka, est racontée sous les guerres russo-kazan."
