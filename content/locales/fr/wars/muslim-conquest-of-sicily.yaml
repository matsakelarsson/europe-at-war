"In 826 Euphemius, commander of the Byzantine fleet in Sicily, rebelled against Emperor Michael II, took Syracuse and had himself proclaimed emperor. Driven out by loyalist officers, he sailed to Ifriqiya and offered the Aghlabid emir Ziyadat Allah a yearly tribute for an army to win the island for him. The emir’s council was divided, but the elderly judge of Kairouan, Asad ibn al-Furat, argued for a holy war and was given command. In June 827 his fleet, carrying about 10,000 foot soldiers and 700 horsemen, sailed from Sousse and landed at Mazara.": "En 826 Euphéme, commandant de la flotte byzantine en Sicile, se rebelle contre l’empereur Michael II, prend Syracuse et a lui-même proclamé empereur. Poussé par des officiers loyalistes, il navigue à Ifriqiya et offre à l’émir d’Aghlabid Ziyadat Allah un hommage annuel pour une armée pour gagner l’île pour lui. Le conseil de l’émir fut divisé, mais le juge âgé de Kairouan, Asad ibn al-Furat, se disputa pour une guerre sainte et reçut le commandement. En juin 827 sa flotte, transportant environ 10 000 pieds soldats et 700 cavaliers, partit de Sousse et débarqua à Mazara."
"Asad beat the Byzantine governor in the field and besieged Syracuse, but in the spring of 828 disease swept the camp and killed him, and a Byzantine fleet arrived. The Muslims burned their ships and retreated inland to Mineo. Euphemius, who had stayed with them, was murdered outside Enna while negotiating with its garrison. In 829 a new Byzantine army nearly drove the invaders out, until a raiding fleet from al-Andalus joined them in 830. Palermo, besieged for a year, surrendered in September 831; it became the capital of a new Aghlabid province, and western Sicily soon followed.": "Asad battit le gouverneur byzantin dans les champs et assiégea Syracuse, mais au printemps de 828 la maladie balaya le camp et le tua, et une flotte byzantine arriva. Les musulmans brûlèrent leurs navires et se replièrent à l’intérieur de Mineo. Euphémius, qui était resté avec eux, fut assassiné en dehors d’Enna tout en négociant avec sa garnison. En 829 une nouvelle armée byzantine a failli chasser les envahisseurs, jusqu’à ce qu’une flotte de raid d’al-Andalus les rejoigne en 830. Palerme, assiégé pendant un an, s’est rendu en septembre 831 ; il est devenu la capitale d’une nouvelle province d’Aghlabid, et l’ouest de la Sicile a bientôt suivi."
