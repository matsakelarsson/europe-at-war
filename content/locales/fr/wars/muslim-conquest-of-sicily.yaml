"842–871": "842–871"
"With Neapolitan help the Muslims took Messina in 842 or 843, and in 845 they crushed a Byzantine army near Butera. Bands from Sicily had also crossed to the mainland as mercenaries in the civil war that split the Lombard principality of Benevento, and stayed to take Taranto in 840 and Bari in about 847. Bari became an emirate, recognised by the Abbasid caliph, whose raiders ranged across southern Italy. In August 846 a raiding fleet landed at Ostia and Portus and sacked St Peter’s and St Paul’s, which lay outside the walls of Rome; the city itself held. Pope Leo IV walled in the Vatican, and in 849 a fleet from Naples, Amalfi and Gaeta beat another raid off Ostia.": "Avec l’aide napolitaine, les musulmans ont pris Messine en 842 ou 843, et en 845 ils ont écrasé une armée byzantine près de Butera. Des bandes de Sicile avaient également traversé le continent comme mercenaires dans la guerre civile qui a divisé la principauté lombarde de Benevento, et sont restés pour prendre Tarente en 840 et Bari en environ 847. Bari devint un émirat, reconnu par le calife abbasside, dont les raideurs s’étendaient à travers le sud de l’Italie. En août 846, une flotte de raids atterrit à Ostia et Portus et largué St Pierre et St Paul, qui se trouvaient en dehors des murs de Rome ; la ville elle-même tenait. Le pape Léon IV s’est muré au Vatican, et en 849 une flotte de Naples, Amalfi et Gaeta ont battu un autre raid au large d’Ostia."
"In Sicily the war was a slow round of raids and sieges. In January 859 the Muslims took Enna, the Byzantines’ main stronghold in the interior, with the help of a prisoner who showed them a way in, and slaughtered its defenders. Byzantine Sicily shrank to the east coast between Syracuse and Taormina. On the mainland the Carolingian emperor Louis II, king of Italy, besieged Bari from 867 with Frankish, Lombard and Slav troops, and in February 871 its citadel fell. Its last emir, Sawdan, was led away in chains to Benevento.": "En janvier 859, les musulmans prirent Enna, la principale forteresse byzantine à l’intérieur, avec l’aide d’un prisonnier qui leur montra un chemin et massacré ses défenseurs. La Sicile byzantine s’est éclipsée sur la côte est entre Syracuse et Taormina. Sur le continent, l’empereur carolingien Louis II, roi d’Italie, assiégea Bari de 867 avec les troupes francaises, lombardes et slaves, et en février 871 sa citadelle tomba. Son dernier émir, Sawdan, fut emmené dans des chaînes à Benevento."
