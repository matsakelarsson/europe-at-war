"Muslim conquest of Sicily": "La conquête musulmane de la Sicile"
"The conquest of Byzantine Sicily by the Aghlabid emirs of Ifriqiya (Tunisia), who landed at Mazara in 827 to help a rebel Byzantine admiral. Palermo fell in 831, Enna in 859, Syracuse in 878 and Taormina in 902; from Sicily, Muslim raiders also held Bari as an emirate from about 847 to 871 and sacked the churches outside the walls of Rome in 846.": "La conquête de la Sicile byzantine par les émirs aghlabides d’Ifriqiya (Tunisie), qui débarquèrent à Mazara en 827 pour aider un amiral Byzantin rebelle. Palerme est tombé en 831, Enna en 859, Syracuse en 878 et Taormina en 902 ; depuis la Sicile, les raideurs musulmans ont également tenu Bari comme un émirat d’environ 847 à 871 et a renvoyé les églises en dehors des murs de Rome en 846."
"The conquest was slow and piecemeal. Apart from a few sieges, the war was mostly raids on Byzantine strongholds and the countryside around them, for plunder, tribute and captives. Many dates come from Arab chronicles written centuries later and are approximate.": "La conquête fut lente et fragmentaire. Outre quelques sièges, la guerre fut surtout des raids sur les bastions byzantins et les campagnes autour d’eux, pour le pillage, l’hommage et les captifs. De nombreuses dates viennent de chroniques arabes écrites des siècles plus tard et sont approximatives."
"The Aghlabids ruled Ifriqiya in the name of the Abbasid caliphs. In 909 Sicily passed with Ifriqiya to the Fatimids, under whom (from the 950s through the Kalbid governors) the island became a largely independent emirate.": "Les Aghlabides gouvernaient Ifriqiya au nom des califes abbasside. En 909 la Sicile passa avec Ifriqiya aux Fatimides, sous lesquels (des années 950 par les gouverneurs Kalbid) l’île devint un émirat largement indépendant."
"The Muslim states on the mainland, at Bari and Taranto and later on the Garigliano, often grew out of mercenary bands hired by the Lombard princes and the duchy of Naples in their own wars.": "Les États musulmans sur le continent, à Bari et Tarente puis sur le Garigliano, ont souvent grandi à partir de groupes mercenaires engagés par les princes lombards et le duché de Naples dans leurs propres guerres."
