"870–902": "870–902"
"A fleet from Sicily took Malta on 29 August 870, plundering its capital and razing the walls, and Byzantine Sicily was cut off. After Louis II’s death in 875 the Byzantines took over Bari, and over the next years they won back much of southern Italy. In Sicily the energetic emir Ibrahim II sent a new governor to finish the war. Syracuse was besieged from 877 with siege engines, received little help from Constantinople, and was stormed on 21 May 878 after nine months. Its people were killed or enslaved, and the city was looted for two months.": "Une flotte de Sicile a pris Malte le 29 août 870, pillant sa capitale et rasant les murs, et la Sicile byzantine a été coupée. Après la mort de Louis II en 875 les Byzantins ont repris Bari, et au cours des années suivantes ils ont gagné une grande partie du sud de l’Italie. Syracuse a été assiégée de 877 avec des moteurs de siège, a reçu peu d’aide de Constantinople, et a été prise d’assaut le 21 mai 878 après neuf mois. Ses gens ont été tués ou esclaves, et la ville a été pillée pendant deux mois."
"The conquest then stalled. Taormina beat off attack after attack, and from 886 the Muslims of Sicily fought among themselves, Palermo against Agrigento and against the governors from Africa, until Ibrahim’s son Abu’l-Abbas Abdallah took Palermo in 900 and sacked Reggio across the strait in 901. In 902 Ibrahim, forced to abdicate, came to Sicily himself as a volunteer for the holy war. Taormina fell on 1 August. He crossed into Calabria and died of dysentery while besieging Cosenza on 24 October. A few forts in the north-east held out; the last, Rometta, fell only in 965.": "Taormina battit l’attaque après l’attaque, et à partir de 886 les musulmans de Sicile se disputèrent entre eux, Palerme contre Agrigento et contre les gouverneurs d’Afrique, jusqu’à ce que le fils d’Ibrahim Aboul-Abbas Abdallah prenne Palerme en 900 et largue Reggio à travers le détroit en 901. En 902 Ibrahim, forcé d’abdiquer, vint en Sicile lui-même comme volontaire pour la guerre sainte. Taormina est tombé le 1er août. Il a traversé la Calabre et est mort de dysenterie alors qu’il assiégeait Cosenza le 24 octobre. Quelques forts dans le nord-est se sont tenus ; le dernier, Rometta, n’est tombé qu’en 965."
