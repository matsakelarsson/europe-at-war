# French translations of the catalogue text (wave 10); step bodies follow later.
Myocheong’s rebellion: Rébellion de Myocheong
? A rising at the Western Capital, Seogyeong (Pyongyang), led by the Buddhist monk Myocheong. After the palace fire of 1126 and Goryeo’s submission to the Jin, Myocheong and his allies, the officials Jeong Ji-sang and Baek Su-han, urged King Injong to move the capital to Seogyeong, which they said had better geomantic power, to call himself emperor and to attack the Jin. A new palace, Daehwagung, was built there in 1128–1129, but officials of the capital, Kaegyong, led by Kim Bu-sik, opposed the move, and the king held back. In the first month of 1135 Myocheong and his supporters seized Seogyeong, proclaimed a state called Daewi with the era name Cheongae, and called their army the “heaven-sent loyal and righteous army”. The court made Kim Bu-sik commander and had Jeong Ji-sang and others killed in Kaegyong. Within weeks Jo Gwang, one of the rebel leaders, killed Myocheong and sent his head to the court hoping for pardon, but when the court would not pardon him he fought on. Kim Bu-sik besieged the city for more than a year, and Seogyeong fell in the second month of 1136. The defeat ended the Western Capital faction, and Kim Bu-sik went on to compile the Samguk sagi.
: Un soulèvement dans la capitale de l’Ouest, Seogyeong (Pyongyang), mené par le moine bouddhiste Myocheong. Après l’incendie du palais en 1126 et la soumission de Goryeo aux Jin, Myocheong et ses alliés, les fonctionnaires Jeong Ji-sang et Baek Su-han, pressèrent le roi Injong de transférer la capitale à Seogyeong, qui, disaient-ils, jouissait d’une meilleure énergie géomantique, de prendre le titre d’empereur et d’attaquer les Jin. Un nouveau palais, le Daehwagung, y fut construit en 1128–1129, mais les fonctionnaires de la capitale, Kaegyong, menés par Kim Bu-sik, s’opposèrent au transfert, et le roi temporisa. Au premier mois de 1135, Myocheong et ses partisans s’emparèrent de Seogyeong, proclamèrent un État nommé Daewi, avec le nom d’ère Cheongae, et appelèrent leur armée l’« armée loyale et vertueuse envoyée par le Ciel ». La cour nomma Kim Bu-sik commandant et fit tuer Jeong Ji-sang et d’autres à Kaegyong. En quelques semaines, Jo Gwang, l’un des chefs rebelles, tua Myocheong et envoya sa tête à la cour dans l’espoir d’être gracié mais, la cour refusant de lui pardonner, il poursuivit le combat. Kim Bu-sik assiégea la ville pendant plus d’un an, et Seogyeong tomba au deuxième mois de 1136. La défaite mit fin à la faction de la capitale de l’Ouest, et Kim Bu-sik compila ensuite le Samguk sagi.
