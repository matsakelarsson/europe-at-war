# French translations of the catalogue text (wave 10); step bodies follow later.
Nanboku-chō wars: Guerres du Nanboku-chō
? "The civil wars of the Northern and Southern Courts, in which the Ashikaga shogunate and the emperors it set up in Kyoto fought the line of Emperor Go-Daigo, which kept its court in the mountains of Yoshino, for more than half a century. Ashikaga Takauji, who had helped Go-Daigo overthrow the Kamakura shogunate in 1333, broke with him in 1335. Driven to Kyushu early in 1336, he returned with a new army, destroyed Kusunoki Masashige at Minatogawa on 4 July 1336, took Kyoto and put Kōmyō of the rival imperial line on the throne. Go-Daigo escaped to Yoshino in January 1337 and proclaimed himself the true emperor. His generals Kitabatake Akiie and Nitta Yoshisada were killed in 1338, the year Takauji became shōgun, and Go-Daigo died in 1339, but the Southern Court survived, aided by the quarrel between Takauji and his brother Tadayoshi in the Kannō disturbance of 1350–1352, when both brothers allied with the South in turn and southern armies took Kyoto four times. In Kyushu, Go-Daigo’s son Prince Kaneyoshi and the Kikuchi family defeated the shogunate’s supporters on the Chikugo River in 1359 and ruled most of the island until Imagawa Sadayo retook the Dazaifu in 1372. The third shōgun, Ashikaga Yoshimitsu, ended the war by negotiation: on 19 November 1392 the southern emperor Go-Kameyama returned to Kyoto and handed the regalia to the northern emperor Go-Komatsu."
: "Les guerres civiles des cours du Nord et du Sud, au cours desquelles le shogunat Ashikaga et les empereurs qu’il avait installés à Kyoto combattirent pendant plus d’un demi-siècle la lignée de l’empereur Go-Daigo, qui tenait sa cour dans les montagnes de Yoshino. Ashikaga Takauji, qui avait aidé Go-Daigo à renverser le shogunat de Kamakura en 1333, rompit avec lui en 1335. Chassé vers Kyushu au début de 1336, il revint avec une nouvelle armée, écrasa Kusunoki Masashige à Minatogawa le 4 juillet 1336, prit Kyoto et plaça sur le trône Kōmyō, de la lignée impériale rivale. Go-Daigo s’enfuit à Yoshino en janvier 1337 et se proclama le véritable empereur. Ses généraux Kitabatake Akiie et Nitta Yoshisada furent tués en 1338, l’année où Takauji devint shōgun, et Go-Daigo mourut en 1339, mais la cour du Sud survécut, aidée par la querelle entre Takauji et son frère Tadayoshi lors des troubles de Kannō, en 1350–1352, durant lesquels les deux frères s’allièrent tour à tour au Sud et les armées du Sud prirent Kyoto à quatre reprises. À Kyushu, le fils de Go-Daigo, le prince Kaneyoshi, et la famille Kikuchi battirent les partisans du shogunat sur la rivière Chikugo en 1359 et dominèrent la plus grande partie de l’île jusqu’à ce qu’Imagawa Sadayo reprenne le Dazaifu en 1372. Le troisième shōgun, Ashikaga Yoshimitsu, mit fin à la guerre par la négociation : le 19 novembre 1392, l’empereur du Sud Go-Kameyama revint à Kyoto et remit les insignes impériaux à l’empereur du Nord Go-Komatsu."
