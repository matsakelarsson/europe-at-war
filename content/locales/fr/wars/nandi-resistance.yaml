# French translations of the catalogue text (wave 13); step bodies follow later.
Nandi resistance: Résistance nandi
? The Nandi of the highlands west of the Rift Valley in Kenya resisted British occupation for more than ten years. In July 1895 Nandi warriors destroyed the camp of the trader Peter West after quarrels with traders’ caravans, and British expeditions of several hundred African soldiers with Maxim guns in 1895 and 1897 burned villages and seized cattle without subduing them. When the Uganda Railway was built across their land towards Lake Victoria from 1899, the Nandi took its iron and telegraph wire, and attacked posts and travellers; a column sent in 1900 killed dozens of Nandi and seized their cattle, but the raids went on. Their leader was the orkoiyot (spiritual leader) Koitalel Arap Samoei. On 19 October 1905 the British officer Richard Meinertzhagen shot him dead at a meeting at Ket Parak, in the Nandi Hills, that had been called to negotiate a truce; Meinertzhagen claimed self-defence, but Nandi accounts and later historians describe a planned killing. A large expedition that followed, in the British term a punitive one, broke the resistance, and in 1906 the Nandi were confined to a reserve while much of their land was given to European settlers.
: Les Nandi des hautes terres situées à l’ouest de la vallée du Rift, au Kenya, résistèrent à l’occupation britannique pendant plus de dix ans. En juillet 1895, des guerriers nandi détruisirent le camp du marchand Peter West après des querelles avec des caravanes de marchands, et des expéditions britanniques de plusieurs centaines de soldats africains équipés de mitrailleuses Maxim incendièrent des villages et saisirent du bétail en 1895 et en 1897 sans parvenir à les soumettre. Lorsque le chemin de fer de l’Ouganda fut construit à travers leurs terres en direction du lac Victoria à partir de 1899, les Nandi s’emparèrent de son fer et de ses fils télégraphiques, et attaquèrent postes et voyageurs ; une colonne envoyée en 1900 tua des dizaines de Nandi et saisit leur bétail, mais les raids continuèrent. Leur chef était l’orkoiyot (chef spirituel) Koitalel Arap Samoei. Le 19 octobre 1905, l’officier britannique Richard Meinertzhagen l’abattit lors d’une rencontre à Ket Parak, dans les collines nandi, convoquée pour négocier une trêve ; Meinertzhagen invoqua la légitime défense, mais les récits nandi et les historiens ultérieurs décrivent un meurtre prémédité. Une grande expédition qui suivit, « punitive » selon le terme britannique, brisa la résistance et, en 1906, les Nandi furent cantonnés dans une réserve tandis qu’une grande partie de leurs terres était donnée à des colons européens.
