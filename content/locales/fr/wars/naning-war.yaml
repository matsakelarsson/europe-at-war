# French translations of the catalogue text (wave 11); step bodies follow later.
Naning War: Guerre de Naning
? A war between the British East India Company’s government at Malacca and Naning, a small Minangkabau district in Malacca’s hinterland ruled by its own penghulu (chief), Dol Said. Under Dutch rule Naning had paid Malacca a token tribute of 400 gantangs of rice a year. After the Anglo-Dutch Treaty of 1824 gave Malacca to Britain, Governor Robert Fullerton treated Naning as British territory, demanded a tenth of its produce and curbed the penghulu’s powers; Dol Said, who held that Naning had never been more than a tributary, refused to come to Malacca and was held to be defying the Company. On 6 August 1831 about 150 Indian sepoys under British officers, with six-pounder guns, marched from Malacca. Felled trees, sniping and supply boats stranded on the Malacca River halted them, Naning received men from Rembau and other neighbouring states, and on 24 August the column was back in Malacca, having left its guns and stores behind. Governor Robert Ibbetson then won Rembau over on 20 January 1832 by recognising it as independent, gathered about 1,500 troops with reinforcements from India, and sent a second expedition on 7 February 1832, joined by a Rembau contingent. It advanced slowly from post to post through abandoned villages, refused Dol Said’s offers to negotiate, and on 15 June 1832 reached his village of Taboh, which its defenders had already left. Dol Said surrendered on 4 February 1834 in return for a pardon and lived in Malacca on a pension until his death in 1849. Naning became a district of Malacca under British law. The cost of the war made the British wary of armed intervention in the Malay states for forty years; in Malaysia Dol Said is remembered as an early fighter against colonial rule.
: Une guerre entre le gouvernement de la Compagnie britannique des Indes orientales à Malacca et Naning, un petit district minangkabau de l’arrière-pays de Malacca gouverné par son propre penghulu (chef), Dol Said. Sous la domination néerlandaise, Naning versait à Malacca un tribut symbolique de 400 gantangs de riz par an. Après que le traité anglo-néerlandais de 1824 eut donné Malacca à la Grande-Bretagne, le gouverneur Robert Fullerton traita Naning comme un territoire britannique, exigea le dixième de ses récoltes et restreignit les pouvoirs du penghulu ; Dol Said, pour qui Naning n’avait jamais été qu’un tributaire, refusa de venir à Malacca et fut considéré comme en rébellion contre la Compagnie. Le 6 août 1831, environ 150 cipayes indiens commandés par des officiers britanniques partirent de Malacca avec des canons de six livres. Les arbres abattus, les tireurs embusqués et les bateaux de ravitaillement échoués sur la rivière de Malacca les arrêtèrent, Naning reçut des hommes de Rembau et d’autres États voisins, et le 24 août la colonne était de retour à Malacca, ayant laissé derrière elle ses canons et ses approvisionnements. Le gouverneur Robert Ibbetson rallia alors Rembau le 20 janvier 1832 en reconnaissant son indépendance, rassembla environ 1 500 hommes grâce à des renforts venus de l’Inde et lança une seconde expédition le 7 février 1832, rejointe par un contingent de Rembau. Elle avança lentement de poste en poste à travers des villages abandonnés, repoussa les offres de négociation de Dol Said et atteignit le 15 juin 1832 son village de Taboh, que ses défenseurs avaient déjà quitté. Dol Said se rendit le 4 février 1834 en échange de son pardon et vécut à Malacca d’une pension jusqu’à sa mort en 1849. Naning devint un district de Malacca soumis au droit britannique. Le coût de la guerre rendit les Britanniques méfiants envers toute intervention armée dans les États malais pendant quarante ans ; en Malaisie, Dol Said est resté dans les mémoires comme l’un des premiers combattants contre la domination coloniale.
