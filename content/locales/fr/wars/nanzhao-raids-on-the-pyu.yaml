# French translations of the catalogue text (wave 11); step bodies follow later.
Nanzhao’s raids on the Pyu: Raids du Nanzhao contre les Pyu
? "Raids by Nanzhao, the kingdom of the Erhai lake in Yunnan, on the Pyu city-states of the Irrawaddy valley in today’s Myanmar. Nanzhao armies had raided Upper Burma since the 750s or 760s, and the Pyu had sent embassies with musicians to the Tang court in 800–802. According to the Manshu, written by the Tang official Fan Chuo in the 860s, Nanzhao plundered the Pyu kingdom (Biao) in the sixth year of the Dahe reign, about 832, and carried off more than 3,000 people, who were settled at Tuodong (Kunming) and made to support themselves. The raid is usually linked to Halin (Hanlin), the great walled Pyu city near Shwebo, though the Chinese text does not name the town; radiocarbon dates show that people went on living at Halin until about 870. In 835, the Manshu says, Nanzhao defeated the kingdoms of Mi-chen and Mi-nuo, took gold and silver and sent two to three thousand prisoners to Lishui to pan for gold; whether these were Pyu states is disputed. Historians no longer see the raids as the sudden end of the Pyu: there is no sign of a violent overthrow at Sri Ksetra, the largest Pyu city, but the raids weakened the city-states while Burman settlers moved into the dry zone. By the eleventh century Pagan had taken their place. Halin, Beikthano and Sri Ksetra were inscribed together as the Pyu Ancient Cities on the UNESCO World Heritage List in 2014."
: "Raids menés par le Nanzhao, royaume du lac Erhai au Yunnan, contre les cités-États pyu de la vallée de l’Irrawaddy, dans l’actuel Myanmar. Les armées du Nanzhao lançaient des raids sur la Haute-Birmanie depuis les années 750 ou 760, et les Pyu avaient envoyé à la cour des Tang, en 800–802, des ambassades accompagnées de musiciens. Selon le Manshu, rédigé dans les années 860 par le fonctionnaire Tang Fan Chuo, le Nanzhao pilla le royaume pyu (Biao) la sixième année de l’ère Dahe, vers 832, et emmena plus de 3 000 personnes, qui furent installées à Tuodong (Kunming) et contraintes de subvenir elles-mêmes à leurs besoins. On rattache généralement ce raid à Halin (Hanlin), la grande cité pyu fortifiée proche de Shwebo, bien que le texte chinois ne nomme pas la ville ; les datations au radiocarbone montrent que Halin resta habitée jusque vers 870. En 835, selon le Manshu, le Nanzhao vainquit les royaumes de Mi-chen et de Mi-nuo, s’empara d’or et d’argent et envoya deux à trois mille prisonniers à Lishui pour y laver l’or à la batée ; l’identification de ces royaumes à des États pyu est discutée. Les historiens ne voient plus dans ces raids la fin brutale des Pyu : rien n’indique un renversement violent à Sri Ksetra, la plus grande cité pyu, mais les raids affaiblirent les cités-États tandis que des colons birmans s’installaient dans la zone sèche. Au XIe siècle, Pagan avait pris leur place. Halin, Beikthano et Sri Ksetra ont été inscrites ensemble en 2014 sur la Liste du patrimoine mondial de l’UNESCO sous le nom de Villes anciennes pyu."
