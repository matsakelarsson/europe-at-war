"1805–1807": "1805–1807"
"Gustav IV Adolf, who loathed Napoleon, joined the Third Coalition in 1805. A British, Russian and Swedish force marched from Swedish Pomerania toward French-held Hanover, but the coalition fell apart after Austerlitz, and in November 1806 Swedish troops were caught up in the French storming of Lübeck.": "Gustav IV Adolf, qui détestait Napoléon, rejoint la troisième coalition en 1805. Une force britannique, russe et suédoise se dirigea de Poméranie suédoise vers Hanovre, mais la coalition s’écroula après Austerlitz, et en novembre 1806 les troupes suédoises furent prises dans l’assaut français de Lübeck."
"In January 1807 Marshal Mortier’s French army blockaded Stralsund. The garrison made a great sortie in April, but after the Peace of Tilsit the French returned in strength. Stralsund fell in August 1807, and Swedish Pomerania stayed under French occupation until 1810.": "En janvier 1807, le maréchal Mortier a bloqué Stralsund. La garnison a fait une grande sortie en avril, mais après la paix de Tilsit les Français sont revenus en force. Stralsund est tombé en août 1807, et la Poméranie suédoise reste sous occupation française jusqu’en 1810."
