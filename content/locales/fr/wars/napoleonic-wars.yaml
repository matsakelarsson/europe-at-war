"To invade Britain, Napoleon gathered his Army of England in camps around Boulogne, but he needed command of the Channel to get it across. Spain, at war with Britain again from December 1804, added its fleet to his. In March 1805 Admiral Pierre-Charles Villeneuve slipped out of Toulon and sailed for the West Indies to draw the British fleets away, with Horatio Nelson in pursuit. On his way back Villeneuve fought an indecisive action with Admiral Robert Calder off Cape Finisterre on 22 July, then put into Ferrol and, in August, into Cádiz. Soon afterwards Napoleon gave up the invasion and turned his army against Austria.": "Pour envahir la Grande-Bretagne, Napoléon rassembla son armée d’Angleterre dans des camps autour de Boulogne, mais il avait besoin du commandement de la Manche pour traverser. L’Espagne, à nouveau en guerre avec la Grande-Bretagne à partir de décembre 1804, ajouta sa flotte à la sienne. Sur son chemin retour Villeneuve a combattu une action indécise avec l’amiral Robert Calder au large du cap Finisterre le 22 juillet, puis mis à Ferrol et, en août, à Cadix. Peu de temps après Napoléon a abandonné l’invasion et tourné son armée contre l’Autriche."
"Ordered to sail for Naples, Villeneuve led 33 French and Spanish ships of the line out of Cádiz in mid-October, and on 21 October Nelson, with 27, met him off Cape Trafalgar. Instead of fighting line against line, the British attacked in two columns that broke through the allied line. In about five hours of close fighting they captured 17 ships and destroyed one without losing any of their own, though a storm in the following days wrecked most of the prizes. Nelson was shot by a marksman on the French Redoutable and died as the battle ended. Britain kept command of the sea for the rest of the war, and Napoleon turned to economic warfare against it.": "Ordonnés à la voile pour Naples, Villeneuve conduisit 33 navires français et espagnols de la ligne hors de Cadix à la mi-octobre, et le 21 octobre Nelson, avec 27, le rencontra au large du cap Trafalgar. Au lieu de combattre la ligne contre la ligne, les Britanniques attaquèrent dans deux colonnes qui brisèrent la ligne alliée. Dans environ cinq heures de combats rapprochés, ils ont capturé 17 navires et en ont détruit un sans perdre aucun de leurs propres, bien qu’une tempête dans les jours suivants a détruit la plupart des prix. Nelson a été abattu par un tireur sur le redoutable français et est mort à la fin de la bataille."
