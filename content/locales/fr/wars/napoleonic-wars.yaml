"Eylau, Friedland and Tilsit": "Eylau, Friedland et Tilsit"
"November 1806 – July 1807": "novembre 1806 – juillet 1807"
"After Jena the war moved east. Russia came to Prussia’s aid, and on 28 November 1806 French troops entered Warsaw, welcomed by Poles who hoped Napoleon would restore their state. A winter campaign followed in mud and snow. At Pułtusk on 26 December Marshal Lannes failed to break General Levin von Bennigsen’s Russians, and on 7–8 February 1807 Napoleon attacked Bennigsen at Eylau, today’s Bagrationovsk, in a snowstorm. Augereau’s corps was cut to pieces, and Murat saved the French centre with a mass charge of more than 10,000 cavalry. When the Russians and a Prussian corps withdrew in the night, each side had lost at least 15,000 men, and nothing had been decided.": "Après Jéna la guerre s’est déplacée vers l’Est. La Russie est venue en aide à Prusse, et le 28 novembre 1806 les troupes françaises sont entrées à Varsovie, accueillies par des Polonais qui espéraient que Napoléon rétablirait leur état. À Pułtusk, le 26 décembre, le maréchal Lannes ne parvint pas à briser le général Levin von Bennigsen. Les 7 et 8 février 1807, Napoléon attaqua Bennigsen à Eylau, aujourd'hui Bagrationovsk, dans une tempête de neige. Lorsque les Russes et un corps prussien se sont retirés dans la nuit, chaque camp avait perdu au moins 15 000 hommes, et rien n’avait été décidé."
"In the spring the French took Danzig after a two-month siege. On 14 June Napoleon caught Bennigsen’s army with its back to the River Alle at Friedland and routed it; the Russians lost at least 20,000 men. Alexander I asked for an armistice, and on 25 June he and Napoleon met on a raft moored in the Niemen at Tilsit. By the treaties of 7 and 9 July Russia recognised Napoleon’s new states, secretly promised to join his blockade of Britain if Britain refused peace, and gained a free hand against Sweden. Prussia paid the price: its Polish lands became the Duchy of Warsaw under the King of Saxony, and Danzig a free city under French protection.": "Au printemps, les Français prirent Danzig après un siège de deux mois. Le 14 juin, Napoléon prit l’armée de Bennigsen avec son dos à la rivière Alle au Friedland et l’achemina ; les Russes perdirent au moins 20 000 hommes. Alexandre je demandai un armistice, et le 25 juin, lui et Napoléon rencontrèrent sur un radeau amarré dans les Niémens à Tilsit. Par les traités des 7 et 9 juillet la Russie a reconnu Napoléon de nouveaux États, secrètement promis de se joindre à son blocus de Grande-Bretagne si la Grande-Bretagne refusait la paix, et a gagné une main libre contre la Suède. La Prusse a payé le prix : ses terres polonaises sont devenues le duché de Varsovie sous le roi de Saxe, et Danzig une ville libre sous protection française."
"Battle of Eylau": "Bataille d’Eylau"
"7–8 February 1807, inconclusive": "7–8 février 1807, non concluant"
"Battle of Friedland": "Bataille de Friedland"
"14 June 1807, French victory": "14 juin 1807, victoire française"
"Treaties of Tilsit": "Traités de Tilsit"
"7 July (Russia) and 9 July 1807 (Prussia)": "7 juillet (Russie) et 9 juillet 1807 (Prusse)"
"The Finnish War, 1808–1809": "La guerre de Finlande, 1808–1809"
"Warsaw": "Varsovie"
"28 November 1806": "28 novembre 1806"
"Murat’s cavalry entered the city as the Prussians and Russians withdrew. Napoleon arrived in December and spent much of the winter there.": "La cavalerie de Murat entra dans la ville alors que les Prussiens et les Russes se retiraient. Napoléon arriva en décembre et y passa une grande partie de l’hiver."
"Battle of Pułtusk": "Bataille de Pułtusk"
"26 December 1806": "26 décembre 1806"
"Lannes attacked Bennigsen’s army in deep mud. Both sides claimed victory, and the Russians withdrew north.": "Lannes attaqua l’armée de Bennigsen dans la boue profonde. Les deux camps revendiquèrent la victoire, et les Russes se retiraient au nord."
"7–8 February 1807": "7–8 février 1807"
"One of the bloodiest battles of the age, fought in snow. The French held the field, but the Russian army escaped intact.": "L’une des batailles les plus sanglantes de l’âge, a combattu dans la neige. Les Français ont tenu le champ, mais l’armée russe s’est échappée intacte."
"Danzig": "Danszig"
"19 March – 24 May 1807": "19 mars – 24 mai 1807"
"Marshal Lefebvre’s corps forced the Prussian and Russian garrison to surrender, and Napoleon made him Duke of Danzig.": "Le maréchal Lefebvre a forcé la garnison prussienne et russe à se rendre, et Napoléon l’a fait duc de Danzig."
"14 June 1807": "14 juin 1807"
"Lannes held the Russians until Napoleon arrived. Ney’s corps then stormed the town, and the Russians fled across the Alle, many drowning.": "Lannes tenait les Russes jusqu’à l’arrivée de Napoléon. Le corps de Ney a ensuite envahi la ville, et les Russes ont fui à travers l’Alle, beaucoup se noyant."
"7 and 9 July 1807": "7 et 9 juillet 1807"
"Napoleon and Alexander met on a raft in the river on 25 June. Frederick William III of Prussia was left waiting on the bank.": "Napoléon et Alexandre se rencontrèrent sur un radeau dans la rivière le 25 juin. Frederick Guillaume III de Prusse fut laissé en attente sur la rive."
"Napoleon, February": "Napoléon, février"
"Napoleon, June": "Napoléon, juin"
"Bennigsen": "Bennigsen"
"Aspern-Essling and Wagram": "Aspern-Essling et Wagram"
"April – October 1809": "avril – octobre 1809"
"Hoping to rouse the Germans while Napoleon’s best troops were in Spain, Austria went to war again in April 1809. Archduke Charles invaded Bavaria on 10 April, but Napoleon hurried from Paris and beat him in five days of fighting around Abensberg, Landshut, Eckmühl and Regensburg, and Charles withdrew into Bohemia. Napoleon took Vienna on 13 May. On 21 May he crossed the Danube below the city by the island of Lobau, but Charles attacked the bridgehead at Aspern and Essling, and the swollen river broke the French bridges. Napoleon had to fall back to the island, his first major defeat in more than ten years.": "Dans l’espoir de réveiller les Allemands pendant que Napoléon était les meilleures troupes en Espagne, l’Autriche partit à nouveau en guerre en avril 1809. L’archiduc Charles envahit la Bavière le 10 avril, mais Napoléon se précipita de Paris et le battit en cinq jours de combats autour d’Abensberg, Landshut, Eckmühl et Regensburg, et Charles se retira en Bohême. Le 21 mai, il traversa le Danube en dessous de la ville par l’île de Lobau, mais Charles attaqua la tête de pont à Aspern et Essling, et la rivière gonflée brisa les ponts français. Napoléon dut retomber sur l’île, sa première défaite majeure en plus de dix ans."
"Six weeks later, reinforced from Italy, he crossed again and on 5–6 July beat Charles at Wagram, on the Marchfeld plain north-east of Vienna, in one of the largest battles yet fought in Europe, with some 300,000 men engaged. Charles agreed an armistice at Znaim on 12 July. By the Peace of Schönbrunn on 14 October Austria lost about 3.5 million subjects. Salzburg, Berchtesgaden and the Innviertel went to Bavaria. Carniola, western Carinthia, Trieste and Croatia south of the Sava went to France as the Illyrian Provinces, cutting Austria off from the sea, and Galician lands went to the Duchy of Warsaw and Russia.": "Six semaines plus tard, renforcé d’Italie, il croise à nouveau et les 5-6 juillet bat Charles à Wagram, dans la plaine de Marchfeld au nord-est de Vienne, dans l’une des plus grandes batailles encore en Europe, avec quelque 300 000 hommes engagés. Charles accepte un armistice à Znaim le 12 juillet. Par la Paix de Schönbrunn le 14 octobre l’Autriche perdit environ 3,5 millions de sujets. Salzbourg, Berchtesgaden et l’Innviertel sont allés en Bavière. Carniola, la Carinthie occidentale, Trieste et la Croatie au sud de la Save sont allés en France comme les provinces Illyriennes, coupant l’Autriche de la mer, et les terres galiciennes sont allés au duché de Varsovie et la Russie."
"Battle of Aspern-Essling": "Bataille de Aspern-Essling"
"21–22 May 1809, Austrian victory": "21-22 mai 1809, victoire autrichienne"
"Battle of Wagram": "Bataille de Wagram"
"5–6 July 1809, French victory": "5-6 juillet 1809, victoire française"
"Peace of Schönbrunn": "Paix de Schönbrunn"
"14 October 1809": "14 octobre 1809"
"Battle of Eckmühl": "Bataille d’Eckmühl"
"22 April 1809": "22 avril 1809"
"The climax of Napoleon’s counter-attack in Bavaria. Charles retreated across the Danube at Regensburg into Bohemia.": "L’apogée de la contre-attaque de Napoléon en Bavière. Charles recula sur le Danube à Ratisbonne en Bohême."
"21–22 May 1809": "21–22 mai 1809"
"The Austrians drove the French back across the Danube to the island of Lobau. Marshal Lannes was mortally wounded.": "Les Autrichiens ont ramené les Français à travers le Danube jusqu’à l’île de Lobau. Le maréchal Lannes a été mortellement blessé."
"5–6 July 1809": "5–6 juillet 1809"
"After two days of fighting on the Marchfeld, Charles withdrew his beaten army in good order towards Moravia.": "Après deux jours de combats sur le Marchfeld, Charles retira son armée battue en bon ordre vers la Moravie."
"Armistice of Znaim": "Armistice de Znaim"
"12 July 1809": "12 juillet 1809"
"The armistice agreed at today’s Znojmo ended the fighting between France and Austria.": "L’armistice convenu aujourd'hui à Znojmo a mis fin aux combats entre la France et l’Autriche."
"Napoleon, who had made the Habsburg palace his headquarters, imposed the peace there. Austria also paid a heavy indemnity and joined the blockade of Britain.": "Napoléon, qui avait fait du palais des Habsbourg son quartier général, y imposa la paix. L’Autriche paya également une lourde indemnité et se joignit au blocus de la Grande-Bretagne."
"Archduke Charles": "Archduke Charles"
"Charles, May": "Charles, mai"
"Ceded by Austria to Bavaria, 1809": "Concédé par l’Autriche à la Bavière, 1809"
"The Continental System and Napoleon’s Europe": "Le système continental et l’Europe Napoléon"
"1806–1811": "1806–1811"
"With no fleet left to challenge Britain after Trafalgar, Napoleon set out to ruin its trade. The Berlin Decree of 21 November 1806 closed the ports of France and its allies to British ships and goods, and the Milan Decree of December 1807 extended the ban to neutral ships that obeyed British rules; Britain answered with Orders in Council. Enforcing this Continental System drew Napoleon ever further. He sent an army into Portugal in 1807 and in 1808 made his brother Joseph King of Spain, starting a long war there. He annexed the Papal States in 1809, Holland in 1810 after his brother Louis, its king, refused to enforce the blockade, and in December 1810 the North Sea coast to Hamburg and Lübeck.": "Le décret de Berlin du 21 novembre 1806 ferma les ports de France et ses alliés aux navires et aux marchandises britanniques, et le décret de Milan de décembre 1807 étendit l’interdiction à des navires neutres qui obéissaient aux règles britanniques ; la Grande-Bretagne répondit par des ordres en conseil. Il envoya une armée au Portugal en 1807 et, en 1808, fit son frère Joseph King d’Espagne, y commençant une longue guerre. En 1809, il annexa les États pontificaux, la Hollande en 1810 après que son frère Louis, son roi, eut refusé de faire respecter le blocus et, en décembre 1810, la côte de la mer du Nord à Hambourg et Lübeck."
"At the end of 1811 Napoleon’s power was at its height. The French Empire, with about 130 departments, reached from Lübeck to Rome and across the Adriatic to the Illyrian Provinces. Around it lay dependent states, the Kingdom of Italy, Naples under Joachim Murat, Spain under Joseph, Westphalia under Jérôme, the rest of the Confederation of the Rhine, Switzerland and the Duchy of Warsaw. In 1810 he married Marie Louise, daughter of the Austrian emperor, who bore him a son in March 1811. But smuggling and hardship eroded the blockade, the war in Spain drained his armies, and when Russia opened its ports to neutral ships at the end of 1810, the quarrel led to war.": "À la fin de 1811, le pouvoir napoléonien était à son apogée. L’Empire français, avec environ 130 départements, atteint de Lübeck à Rome et de l’autre côté de l’Adriatique aux provinces illyriennes. Autour de lui se trouvaient les états dépendants, le Royaume d’Italie, Naples sous Joachim Murat, l’Espagne sous Joseph, Westphalie sous Jérôme, le reste de la Confédération du Rhin, la Suisse et le Duché de Varsovie. En 1810, il épousa Marie Louise, fille de l’empereur autrichien, qui lui enfanta un fils en mars 1811. Mais la contrebande et les difficultés érodent le blocus, la guerre en Espagne draine ses armées, et lorsque la Russie ouvre ses ports à des navires neutres à la fin de 1810, la querelle conduit à la guerre."
"Berlin Decree": "Décret de Berlin"
"21 November 1806": "21 novembre 1806"
"Milan Decree": "Décret de Milan"
"17 December 1807": "17 décembre 1807"
"French Empire at its largest": "L’Empire français à son plus grand"
"about 130 departments, 1811–1812": "environ 130 ministères, 1811–1812"
"The Peninsular War": "La guerre de la péninsule"
"From the captured Prussian capital Napoleon declared the British Isles under blockade and banned all trade with them.": "De la capitale prussienne capturée Napoléon a déclaré les îles britanniques sous blocus et interdit tout commerce avec eux."
"Lisbon": "Lisbonne"
"30 November 1807": "30 novembre 1807"
"General Junot occupied the city to close Portugal to British trade. The royal family had sailed for Brazil the day before.": "Le général Junot a occupé la ville pour fermer le Portugal au commerce britannique. La famille royale avait navigué pour le Brésil la veille."
"Madrid": "Madrid"
"May – July 1808": "mai – juillet 1808"
"Madrid rose against the French on 2 May. Napoleon forced the Spanish Bourbons to abdicate at Bayonne and made Joseph king in their place.": "Madrid s’élève contre les Français le 2 mai. Napoléon force les Bourbons espagnols à abdiquer à Bayonne et fait roi Joseph à leur place."
"Rome": "Rome"
"May – July 1809": "mai – juillet 1809"
"The Papal States were annexed to France. Pope Pius VII excommunicated Napoleon and was arrested and held in Savona and Fontainebleau until 1814.": "Les États pontificaux furent annexés à la France. Le pape Pie VII excommunia Napoléon et fut arrêté et détenu à Savona et Fontainebleau jusqu’en 1814."
"Amsterdam": "Amsterdam"
"9 July 1810": "9 juillet 1810"
"King Louis abdicated rather than enforce the blockade, and Napoleon annexed the Kingdom of Holland.": "Le roi Louis abdique plutôt que d’appliquer le blocus, et Napoléon annexe le Royaume de Hollande."
"Hamburg": "Hambourg"
"December 1810": "décembre 1810"
"Annexed with Bremen, Lübeck, Oldenburg and the North Sea coast to close the last gaps in the blockade.": "En annexe avec Brême, Lübeck, Oldenburg et la côte de la mer du Nord pour combler les derniers écarts dans le blocus."
"Heligoland": "Héligoland"
"1807–1814": "1807–1814"
"Taken by Britain from Denmark in 1807, the island became a depot for smuggling British goods into Germany.": "Prise par la Grande-Bretagne du Danemark en 1807, l’île est devenue un dépôt pour contrebande de marchandises britanniques vers l’Allemagne."
"Napoleon’s empire and the states dependent on it, end of 1811 (approximate)": "L’empire Napoléon et les Etats en dépendent, fin 1811 (approximatif)"
"Bernadotte and the Army of the North": "Bernadotte et l’Armée du Nord"
"1810–1813": "1810–1813"
"In 1810 Sweden chose the French marshal Jean-Baptiste Bernadotte as crown prince, and as Charles John he soon ran the country. When Napoleon occupied Swedish Pomerania again in 1812, Charles John allied with Russia, which agreed to help Sweden take Norway from Denmark.": "En 1810, la Suède choisit le maréchal français Jean-Baptiste Bernadotte comme prince héritier et, comme Charles John, il dirigea bientôt le pays. Lorsque Napoléon occupera de nouveau la Poméranie suédoise en 1812, Charles John s’allia à la Russie, qui accepta d’aider la Suède à prendre la Norvège du Danemark."
"In 1813 he commanded the allied Army of the North, made up of Swedes, Prussians and Russians, against his old master. It beat the French at Grossbeeren on 23 August and Dennewitz on 6 September, protecting Berlin, and took part in the decisive Battle of Leipzig on 16–19 October 1813.": "En 1813, il commanda l’Armée alliée du Nord, composée de Suédois, de Prusses et de Russes, contre son ancien maître. Il battit les Français à Grossbeeren le 23 août et Dennewitz le 6 septembre, protégeant Berlin, et prit part à la bataille décisive de Leipzig du 16 au 19 octobre 1813."
"Army of the North": "Armée du Nord"
"Swedish, Prussian and Russian troops": "Des troupes suédoises, prussiennes et russes"
"Battle of Leipzig": "Bataille de Leipzig"
"16–19 October 1813": "16–19 octobre 1813"
"Battle of Grossbeeren": "Bataille de Grossbeeren"
"23 August 1813": "23 août 1813"
"Marshal Oudinot’s drive on Berlin was beaten back, mostly by the Prussian troops of the Army of the North.": "Le maréchal Oudinot a été battu à Berlin, principalement par les troupes prussiennes de l’armée du Nord."
"Battle of Dennewitz": "Bataille de Dennewitz"
"6 September 1813": "6 septembre 1813"
"Marshal Ney’s Army of Berlin was routed south of the Prussian capital.": "L’armée de Berlin du maréchal Ney, a été acheminée au sud de la capitale prussienne."
"The Battle of the Nations, Napoleon’s first great defeat. The Army of the North joined the final attacks.": "La bataille des Nations, Napoléon est la première grande défaite. L’Armée du Nord s’est jointe aux attaques finales."
"Charles John": "Charles John"
"The invasion of Russia": "L’invasion de la Russie"
"June – December 1812": "juin – décembre 1812"
"Napoleon and Alexander had fallen out over the blockade, over Poland and over the annexation of Oldenburg, whose ruling family was related to the tsar’s. On 24 June 1812 Napoleon crossed the Niemen with the largest army Europe had yet seen, more than 600,000 men in all. It was drawn from all over his empire and his allies, with Germans, Poles, Italians and others beside the French, while Austrian and Prussian corps guarded its flanks. The Russian armies fell back, fought at Smolensk in August and at Borodino on 7 September, and gave up Moscow, which burned after the French entered it on 14 September.": "Napoléon et Alexandre étaient tombés sur le blocus, sur la Pologne et sur l’annexion d’Oldenburg, dont la famille dirigeante était liée aux tsar. Le 24 juin 1812, Napoléon traversa les Niémens avec la plus grande armée que l’Europe ait encore vue, soit plus de 600 000 hommes au total. Elle a été tirée de tout son empire et de ses alliés, avec des Allemands, des Polonais, des Italiens et d’autres à côté des Français, tandis que le corps autrichien et prussien gardait ses flancs. Les armées russes sont tombées en arrière, ont combattu à Smolensk en août et à Borodino le 7 septembre, et ont abandonné Moscou, qui a brûlé après l’entrée des Français le 14 septembre."
"Alexander refused to make peace, and on 19 October Napoleon left Moscow. Hunger, cold, disease and constant attacks by Cossacks, peasant partisans and the pursuing Russian armies destroyed most of his army on the retreat, and after the crossing of the Berezina in late November only a small fraction of the men who had entered Russia came back across the Niemen in December. The disaster broke Napoleon’s hold on Germany. Within weeks the Prussian corps had stood aside, and in 1813 Prussia changed sides.": "Alexandre refusa de faire la paix et, le 19 octobre, Napoléon quitta Moscou. La faim, le froid, la maladie et les attaques constantes des Cosaques, des partisans paysans et des armées russes poursuivantes détruisirent la majeure partie de son armée lors de la retraite, et après la traversée de la Berezina à la fin du mois de novembre, seule une petite fraction des hommes entrés en Russie traversèrent les Niémens en décembre. En quelques semaines, le corps prussien s’était écarté et, en 1813, la Prusse avait changé de camp."
"Crossing of the Niemen": "Traversée des Niémens"
"24 June 1812": "24 juin 1812"
"Battle of Borodino": "Bataille de Borodino"
"7 September 1812": "7 septembre 1812"
"more than 600,000 men; only a small fraction came back": "plus de 600 000 hommes ; seule une petite fraction est revenue"
"The French invasion of Russia": "L’invasion française de la Russie"
"The Grande Armée crossed the river near Kovno, today’s Kaunas, on pontoon bridges.": "La Grande Armée a traversé la rivière près de Kovno, aujourd'hui à Kaunas, sur des ponts ponton."
"Smolensk": "Smolensk"
"16–18 August 1812": "16–18 août 1812"
"The French stormed the burning city, but the Russian armies, now united, got away east.": "Les Français ont pris l’assaut de la ville en feu, mais les armées russes, maintenant unies, se sont enfuies vers l’est."
"The bloodiest day of the war. Kutuzov’s army withdrew after the battle, leaving the road to Moscow open.": "Le jour le plus sanglant de la guerre. L’armée de Kutuzov s’est retirée après la bataille, laissant la route vers Moscou ouverte."
"Moscow": "Moscou"
"14 September 1812": "14 septembre 1812"
"Napoleon entered a city its people had largely abandoned. Fires destroyed most of it in the following days.": "Napoléon est entré dans une ville que son peuple avait largement abandonné. Les incendies ont détruit la plupart d’entre eux dans les jours suivants."
"Berezina": "Bérezina"
"26–29 November 1812": "26–29 novembre 1812"
"The remains of the Grande Armée escaped over two improvised bridges, at a terrible cost in lives.": "Les restes de la Grande Armée se sont échappés sur deux ponts improvisés, à un terrible coût en vies humaines."
"Retreat": "Retraite"
"Prussia rises, Lützen and Bautzen": "La Prusse s’élève, Lützen et Bautzen"
"December 1812 – August 1813": "décembre 1812 – août 1813"
"Napoleon’s Grande Armée was destroyed in Russia in 1812. On 30 December General Ludwig Yorck, commanding the Prussian corps that had marched with it, agreed at Tauroggen to stand aside, without his king’s permission. Frederick William III hesitated, then allied with Russia at Kalisz on 28 February 1813 and declared war on France in March. Prussia called up volunteers and a militia, the Landwehr, and many young men joined free corps such as Lützow’s. Russian and Prussian troops entered Berlin, Dresden and Hamburg. Napoleon raised a new army, made up largely of young conscripts and short of cavalry, and marched into Saxony.": "Le 30 décembre, le général Ludwig Yorck, commandant le corps prussien qui avait marché avec lui, accepta à Tauroggen de se tenir à l’écart, sans la permission de son roi. Frederick William III hésita, puis s’allia avec la Russie à Kalisz le 28 février 1813 et déclara la guerre à la France en mars. La Prusse appela des volontaires et une milice, la Landwehr, et beaucoup de jeunes hommes se joignirent au corps libre comme Lützow. Les troupes russes et prussiennes entrèrent à Berlin, Dresde et Hambourg. Napoléon éleva une nouvelle armée, composée en grande partie de jeunes conscrits et à court de cavalerie, et marcha en Saxe."
"On 2 May he beat the Russians and Prussians under Wittgenstein and Blücher at Lützen and retook Dresden, and the King of Saxony rejoined him. On 20–21 May he won again at Bautzen, but the allies escaped into Silesia in good order, and his army had lost more men than theirs. On 4 June both sides agreed an armistice at Pläswitz and used it, until August, to rebuild their armies. Austria, which had offered to mediate, promised at Reichenbach to join the allies if Napoleon refused its terms. He did, and Austria declared war on 12 August; the autumn campaign ended with his defeat at Leipzig in October.": "Le 2 mai, il battit les Russes et les Prussiens sous Wittgenstein et Blücher à Lützen et reprit Dresde, et le roi de Saxe le rejoignit. Le 20-21 mai, il gagna à nouveau à Bautzen, mais les alliés s’échappèrent en bon ordre dans la Silésie, et son armée avait perdu plus d’hommes que la leur. Le 4 juin, les deux parties se sont mises d’accord sur un armistice à Pläswitz et l’ont utilisé jusqu’au mois d’août pour reconstruire leurs armées. L’Autriche, qui avait offert la médiation, promettait à Reichenbach de rejoindre les alliés si Napoléon refusait ses conditions."
"Treaty of Kalisz": "Traité de Kalisz"
"28 February 1813, Prussia allies with Russia": "28 février 1813, Prusse alliés avec la Russie"
"Battle of Lützen": "Bataille de Lützen"
"2 May 1813, French victory": "2 mai 1813, victoire française"
"Battle of Bautzen": "Bataille de Bautzen"
"20–21 May 1813, French victory": "20-21 mai 1813, victoire française"
"28 February 1813": "28 février 1813"
"Russia and Prussia allied against Napoleon. Russia promised to help Prussia regain its strength of 1806.": "La Russie et la Prusse alliées contre Napoléon. La Russie a promis d’aider la Prusse à retrouver sa force de 1806."
"4 March 1813": "4 mars 1813"
"The French garrison left, and Russian Cossacks rode into the Prussian capital, followed by Wittgenstein’s army.": "La garnison française partit, et les cosaques russes montèrent dans la capitale prussienne, puis l’armée de Wittgenstein."
"30 May 1813": "30 mai 1813"
"Russian troops under Friedrich Karl von Tettenborn entered the city in March, but Marshal Davout retook it in May and held it until 1814.": "Les troupes russes sous Friedrich Karl von Tettenborn entrèrent dans la ville en mars, mais le maréchal Davout la reprit en mai et la conserva jusqu’en 1814."
"2 May 1813": "2 mai 1813"
"Fought around Grossgörschen. Napoleon’s young conscripts held, and the allies withdrew. Gerhard von Scharnhorst, the reformer of the Prussian army, died of his wounds weeks later.": "Les jeunes conscrits de Napoléon se retirèrent. Gerhard von Scharnhorst, réformateur de l’armée prussienne, mourut de ses blessures quelques semaines plus tard."
"20–21 May 1813": "20–21 mai 1813"
"Napoleon forced the allies from their positions on the Spree, but a slow flank attack let them get away.": "Napoléon a forcé les alliés à quitter leurs positions sur la Spree, mais une lente attaque de flanc les a laissés s’échapper."
"Armistice of Pläswitz": "Armistice de Pläswitz"
"4 June 1813": "4 juin 1813"
"The armistice, first to 20 July and then extended into August, gave the allies time to bring Austria in.": "L’armistice, d’abord jusqu’au 20 juillet puis étendu au mois d’août, a donné aux alliés le temps de faire entrer l’Autriche."
"Reichenbach": "Reichenbach"
"27 June 1813": "27 juin 1813"
"In today’s Dzierżoniów Austria agreed with Russia and Prussia to join the war if Napoleon rejected its peace terms.": "Dans aujourd'hui, Dziersoniów Autriche a convenu avec la Russie et la Prusse d’adhérer à la guerre si Napoléon rejetait ses conditions de paix."
"Allied retreat": "Retraite des Alliés"
"Russian and Prussian success": "Succès russe et prussien"
"Russian and Prussian moves": "Mouvements russes et prussiens"
"Leipzig, the Battle of the Nations": "Leipzig, la bataille des Nations"
"August – October 1813": "août – octobre 1813"
"When the armistice ended in August 1813, Austria joined Russia, Prussia and Sweden against Napoleon, with Britain paying subsidies. Three allied armies closed on him in Saxony, Schwarzenberg’s Army of Bohemia from the south, Blücher’s Army of Silesia from the east and Crown Prince Charles John’s Army of the North from Berlin. Under the Trachenberg plan they avoided battle with Napoleon himself and struck at his marshals. Napoleon beat Schwarzenberg at Dresden on 26–27 August, his last great victory in Germany, but in the same days Blücher routed Macdonald on the Katzbach, the allies trapped Vandamme’s pursuing corps at Kulm, and the French drives on Berlin failed. On 8 October Bavaria changed sides.": "Lorsque l’armistice a pris fin en août 1813, l’Autriche s’est jointe à la Russie, la Prusse et la Suède contre Napoléon, la Grande-Bretagne payant des subventions. Trois armées alliées ont fermé sur lui en Saxe, Schwarzenberg de l’Armée de Bohême du sud, Blücher de l’Armée de Silésie de l’est et le prince héritier Charles John de l’Armée du nord de Berlin. Dans le cadre du plan Trachenberg, ils évitent la bataille avec Napoléon lui-même et frappent ses maréchals. Napoléon bat Schwarzenberg à Dresde les 26-27 août, sa dernière grande victoire en Allemagne, mais dans les mêmes jours Blücher fait route Macdonald sur le Katzbach, les alliés s’empare Vandamme de poursuivre le corps à Kulm, et les pilotes français sur Berlin échouent."
"In October the allies converged on Leipzig. On 16–19 October more than half a million men fought the largest battle of the Napoleonic Wars there, Napoleon’s army of fewer than 200,000, with Germans, Poles and Italians in its ranks, against more than 300,000 Austrians, Russians, Prussians and Swedes. Schwarzenberg attacked from the south and Blücher from the north, and on 18 October Bennigsen’s Army of Poland and the Army of the North closed the ring from the east as Saxon troops went over to the allies. As Napoleon retreated on the 19th, the bridge over the Elster was blown too early, trapping his rearguard, and Marshal Józef Poniatowski drowned. Napoleon fell back to the Rhine, and the Confederation of the Rhine fell apart.": "En octobre, les alliés convergeaient vers Leipzig. Du 16 au 19 octobre, plus d’un demi-million d’hommes y combattirent la plus grande bataille des guerres napoléoniennes, l’armée Napoléonienne de moins de 200 000 hommes, avec des Allemands, des Polonais et des Italiens dans ses rangs, contre plus de 300 000 Autrichiens, Russes, Prusses et Suédois. Schwarzenberg attaqua du sud et Blücher du nord, et le 18 octobre l’armée de Pologne et l’Armée du Nord fermèrent l’anneau de l’est alors que les troupes saxonnes allaient vers les alliés. Napoléon se retira le 19, le pont sur l’Elster fut soufflé trop tôt, piétinant son arrière-garde, et le maréchal Józef Poniatowski noya. Napoléon est retombé au Rhin, et la Confédération du Rhin s’est effondrée."
"Battle of Dresden": "Bataille de Dresde"
"26–27 August 1813, French victory": "26-27 août 1813, victoire française"
"16–19 October 1813, allied victory": "16-19 octobre 1813, victoire alliée"
"Losses at Leipzig": "Pertes à Leipzig"
"Some 60,000–80,000 on each side killed, wounded or captured": "Quelque 60 000 à 80 000 de chaque côté tués, blessés ou capturés"
"26–27 August 1813": "26–27 août 1813"
"Napoleon threw back Schwarzenberg’s attack on the Saxon capital in heavy rain but could not follow up his victory.": "Napoléon renvoya l’attaque de Schwarzenberg sur la capitale saxonne sous une forte pluie, mais ne put pas suivre sa victoire."
"Battle of the Katzbach": "Bataille du Katzbach"
"26 August 1813": "26 août 1813"
"Blücher’s army caught Macdonald’s corps crossing the swollen Katzbach in a downpour and routed it.": "L’armée de Blücher attrape le corps de Macdonald qui traverse le Katzbach enflé dans une averse et l’oriente."
"Battle of Kulm": "Bataille de Kulm"
"29–30 August 1813": "29–30 août 1813"
"Vandamme’s corps, pursuing the allies into Bohemia, was surrounded by Russian, Prussian and Austrian troops. He was captured with several thousand of his men.": "Le corps de Vandamme, poursuivant les alliés en Bohême, était entouré de troupes russes, prussiennes et autrichiennes. Il a été capturé avec plusieurs milliers de ses hommes."
"The Battle of the Nations. The allies attacked Napoleon’s army from three sides and drove it out of the city with heavy losses.": "La bataille des Nations. Les alliés attaquèrent l’armée Napoléon de trois côtés et la chassèrent de la ville avec de lourdes pertes."
"Battle of Hanau": "Bataille de Hanau"
"30–31 October 1813": "30–31 octobre 1813"
"Napoleon broke through General Wrede’s Bavarian and Austrian army, which tried to block his retreat to the Rhine.": "Napoléon franchit le général Wrede.L’armée bavaroise et autrichienne, qui tenta de bloquer sa retraite vers le Rhin."
"Schwarzenberg": "Schwarzenberg"
"Blücher": "Blücher"
"Retreat to the Rhine": "Retraite vers le Rhin"
"Allied success (Schwarzenberg’s Army of Bohemia)": "Succès allié (Armée de Bohême de Schwarzenberg)"
"Allied success (Blücher’s Army of Silesia)": "Réussite alliée (Armée de Silésie Blücher)"
"Army of Bohemia (Austrians, Russians and Prussians)": "Armée de Bohême (Autrichiens, Russes et Prussiens)"
"Army of Silesia (Prussians and Russians)": "Armée de la Silésie (Prussiens et Russes)"
"Army of the North (Swedes, Prussians and Russians)": "Armée du Nord (suédois, prussiens et russes)"
"Army of Poland (Russians)": "Armée de Pologne (russes)"
"Kiel: Norway for Pomerania": "Kiel : Norvège pour la Poméranie"
"1813–1814": "1813–1814"
"After Leipzig, Charles John turned north against Denmark–Norway, Napoleon’s last ally, and invaded Holstein in December 1813. Swedish cavalry won a clash at Bornhöved on 7 December, but the Danes fought their way past the allies at Sehested on 10 December and reached the fortress of Rendsburg.": "Après Leipzig, Charles John tourne vers le nord contre le Danemark-Norvège, Napoléon dernier allié, et envahi Holstein en décembre 1813. La cavalerie suédoise gagne un affrontement à Bornhöved le 7 décembre, mais les Danois se battent devant les alliés à Sehested le 10 décembre et atteignent la forteresse de Rendsburg."
"Denmark could not hold out. By the Treaty of Kiel on 14 January 1814, King Frederick VI gave Norway to the king of Sweden, and Sweden handed Swedish Pomerania and Rügen to Denmark. It was the last war between Sweden and Denmark. The Norwegians, though, refused to be handed over.": "Par le traité de Kiel du 14 janvier 1814, le roi Frederick VI donna la Norvège au roi de Suède, et la Suède livra la Poméranie suédoise et Rügen au Danemark. C’était la dernière guerre entre la Suède et le Danemark."
"Treaty of Kiel": "Traité de Kiel"
"14 January 1814": "14 janvier 1814"
"Exchange": "Échange"
"Norway to Sweden, Swedish Pomerania to Denmark": "Norvège à Suède, Poméranie suédoise au Danemark"
"Battle of Bornhöved": "Bataille de Bornhöved"
"7 December 1813": "7 décembre 1813"
"Swedish cavalry charged the Danish rearguard, which got away toward Kiel.": "La cavalerie suédoise a chargé l’arrière-garde danoise, qui s’est enfuie vers Kiel."
"Battle of Sehested": "Bataille de Sehested"
"10 December 1813": "10 décembre 1813"
"The Danish corps broke through the allies and reached the fortress of Rendsburg.": "Le corps danois a traversé les alliés et atteint la forteresse de Rendsburg."
"Frederick VI ceded Norway, but not Iceland, Greenland or the Faroes, to the king of Sweden.": "Frederick VI cède la Norvège, mais pas l’Islande, le Groenland ou les Féroé, au roi de Suède."
"Ceded to Sweden at Kiel": "Ceded en Suède à Kiel"
"Lost by Sweden in this peace": "Perdu par la Suède dans cette paix"
"The campaign of France and the first abdication": "La campagne de France et la première abdication"
"December 1813 – May 1814": "décembre 1813 – mai 1814"
"After Leipzig the allies reached the Rhine, and Napoleon let slip their offer of peace with France’s “natural frontiers”. From late December 1813 Schwarzenberg’s Army of Bohemia crossed the upper Rhine through Switzerland and Blücher’s Army of Silesia crossed the middle Rhine, while Wellington, coming from Spain, had already crossed the Pyrenees into south-western France. Napoleon, with perhaps 70,000 men in the field, many of them young conscripts, struck at the allied armies in turn. He was beaten at La Rothière on 1 February 1814, but between 10 and 14 February he defeated Blücher’s scattered corps four times in five days, at Champaubert, Montmirail, Château-Thierry and Vauchamps, and on 18 February he drove Schwarzenberg back at Montereau.": "Après Leipzig, les alliés arrivèrent au Rhin et Napoléon laissa glisser leur offre de paix avec la France. À partir de fin décembre 1813 Schwarzenberg, l’Armée de Bohême traversa le Rhin supérieur par la Suisse et Blücher, l’Armée de Silésie traversa le Rhin moyen, tandis que Wellington, venant d’Espagne, avait déjà traversé les Pyrénées dans le sud-ouest de la France. Napoléon, avec peut-être 70 000 hommes dans les champs, beaucoup d’entre eux jeunes conscrits, frappa à leur tour les armées alliées. Il fut battu à La Rothière le 1er février 1814, mais entre le 10 et le 14 février il battit quatre fois les corps dispersés de Blücher en cinq jours, à Champaubert, Montmirail, Château-Thierry et Vauchamps, et, le 18 février, il conduisit Schwarzenberg à Montereau."
"The allies held together, binding themselves in the Treaty of Chaumont in March not to make a separate peace. Blücher checked Napoleon at Laon on 9–10 March and Schwarzenberg at Arcis-sur-Aube on 20–21 March, and when Napoleon moved east to threaten their communications, they marched on Paris instead. After a day’s fighting on 30 March Marshal Marmont surrendered the city, and the allied monarchs rode in the next day. The Senate deposed Napoleon, his marshals refused to fight on, and on 6 April at Fontainebleau he abdicated. Napoleon was given the island of Elba, and Louis XVIII, a brother of Louis XVI, returned as king. By the Treaty of Paris on 30 May France kept its borders of 1792, with small additions.": "Les alliés se sont réunis, s’engageant dans le traité de Chaumont en mars pour ne pas faire une paix séparée. Blücher a vérifié Napoléon à Laon les 9-10 mars et Schwarzenberg à Arcis-sur-Aube les 20-21 mars, et lorsque Napoléon est parti menacer leurs communications, ils ont marché sur Paris à la place. Après un jour de combat le 30 mars Marmont Marshal a rendu la ville, et les monarques alliés monté dans le lendemain. Le Sénat a déposé Napoléon, ses maréchals ont refusé de se battre, et le 6 avril à Fontainebleau il abdique. Napoléon a été donné l’île d’Elbe, et Louis XVIII, un frère de Louis XVI, est revenu comme roi. Par le traité de Paris du 30 mai, la France conserva ses frontières de 1792, avec quelques ajouts."
"Six Days’ Campaign": "Campagne de six jours"
"10–14 February 1814, four French victories": "10-14 février 1814, quatre victoires françaises"
"Paris surrenders": "La reddition de Paris"
"31 March 1814": "31 mars 1814"
"Napoleon abdicates": "Napoléon abdique"
"6 April 1814; Treaty of Paris, 30 May 1814": "6 avril 1814 ; Traité de Paris, 30 mai 1814"
"Battle of La Rothière": "Bataille de La Rothière"
"1 February 1814": "1er février 1814"
"Blücher, with Austrian, Russian and Württemberg corps, attacked Napoleon in snowstorms near Brienne and forced him to retreat.": "Blücher, avec les corps autrichien, russe et wurtemberg, attaqua Napoléon dans des tempêtes de neige près de Brienne et le força à se retirer."
"Champaubert, Montmirail and Vauchamps": "Champaubert, Montmirail et Vauchamps"
"10–14 February 1814": "10–14 février 1814"
"The Six Days’ Campaign. Napoleon caught Blücher’s corps strung out along the Marne valley and beat them one by one, inflicting far heavier losses than he suffered.": "La campagne des Six Jours. Napoléon a pris Blücher, le corps de Blücher et les a battus un par un le long de la vallée de la Marne, infligeant des pertes beaucoup plus lourdes qu’il n’a souffert."
"Château-Thierry": "Château-Thierry"
"12 February 1814": "12 février 1814"
"The third victory of the Six Days, over the retreating Prussian corps of Yorck and the Russians of Sacken.": "La troisième victoire des Six Jours, sur le corps prussien en retraite de Yorck et les Russes de Sacken."
"Battle of Montereau": "Bataille de Montereau"
"18 February 1814": "18 février 1814"
"Napoleon stormed the bridges over the Seine and the Yonne, and Schwarzenberg fell back towards Troyes.": "Napoléon s’empare des ponts sur la Seine et l’Yonne, et Schwarzenberg recule vers Troyes."
"Battle of Laon": "Bataille de Laon"
"9–10 March 1814": "9–10 mars 1814"
"Napoleon attacked Blücher’s much larger army on its hilltop and was repulsed; a night attack routed Marmont’s corps.": "Napoléon attaqua Blücher, sur sa colline, une armée beaucoup plus grande et fut repoussée ; une attaque nocturne roulait le corps de Marmont."
"Battle of Arcis-sur-Aube": "Bataille d’Arcis-sur-Aube"
"20–21 March 1814": "20–21 mars 1814"
"Napoleon, expecting only a rearguard, ran into Schwarzenberg’s whole army and had to withdraw across the Aube.": "Napoléon, n’attendant qu’un arrière-garde, courut dans toute l’armée de Schwarzenberg et dut se retirer à travers l’Aube."
"Paris": "Paris"
"30–31 March 1814": "30–31 mars 1814"
"After fighting on the heights of Montmartre and Belleville, Marmont signed the capitulation. Tsar Alexander I and King Frederick William III entered Paris on 31 March.": "Après avoir combattu sur les hauteurs de Montmartre et Belleville, Marmont signe la capitulation. Le tsar Alexandre Ier et le roi Frederick Guillaume III entrent à Paris le 31 mars."
"Fontainebleau": "Fontainebleau"
"6 April 1814": "6 avril 1814"
"Napoleon abdicated in the palace. By the Treaty of Fontainebleau he kept the title of emperor and received Elba.": "Napoléon abdique dans le palais. Par le traité de Fontainebleau, il garde le titre d’empereur et reçoit l’Elbe."
"Battle of Toulouse": "Bataille de Toulouse"
"10 April 1814": "10 avril 1814"
"Wellington’s British, Portuguese and Spanish troops drove Soult out of the city, in a battle fought after the abdication.": "Wellington Les troupes britanniques, portugaises et espagnoles ont chassé Soult de la ville, dans une bataille menée après l’abdication."
"Napoleon, March": "Napoléon, mars"
"On to Paris": "Vers Paris"
"Wellington": "Wellington"
"Success for Schwarzenberg’s Army of Bohemia": "Succès de l’Armée de Bohême Schwarzenberg"
"Success for Blücher’s Army of Silesia": "Succès de l’Armée de Silésie Blücher"
"Moves of the Army of Bohemia (Austrians, Russians and Germans)": "Déplacements de l’armée de Bohême (Autrichiens, Russes et Allemands)"
"Moves of the Army of Silesia (Prussians and Russians)": "Mouvements de l’Armée de la Silésie (Prussiens et Russes)"
"The Congress of Vienna": "Le Congrès de Vienne"
"September 1814 – June 1815": "septembre 1814 – juin 1815"
"After Napoleon’s first abdication the victors met in Vienna to remake the map of Europe. From September 1814 the four great powers, Austria, Britain, Prussia and Russia, represented by Metternich, Castlereagh, Hardenberg and Tsar Alexander himself, decided the main questions, and France’s foreign minister Talleyrand soon won a place beside them. Amid balls and receptions the Congress nearly broke up over Poland and Saxony, for Russia wanted the whole Duchy of Warsaw and Prussia the whole of Saxony. On 3 January 1815 Austria, Britain and France signed a secret alliance against them. In the compromise Russia took most of the duchy as a Kingdom of Poland under the tsar, Kraków became a free city, and Prussia received about two-fifths of Saxony.": "Après la première abdication de Napoléon, les vainqueurs se rencontrèrent à Vienne pour refaire la carte de l’Europe. À partir de septembre 1814, les quatre grandes puissances, l’Autriche, la Grande-Bretagne, la Prusse et la Russie, représentées par Metternich, Castlereagh, Hardenberg et Tsar Alexander lui-même, décidèrent les questions principales, et le ministre des Affaires étrangères français Talleyrand gagna bientôt une place à côté d’eux. Au milieu des bals et des réceptions, le Congrès a failli rompre avec la Pologne et la Saxe, car la Russie voulait tout le duché de Varsovie et la Prusse toute la Saxe. Le 3 janvier 1815, l’Autriche, la Grande-Bretagne et la France signèrent une alliance secrète contre eux. Dans le compromis, la Russie a pris la plupart du duché comme un royaume de Pologne sous le tsar, Cracovie est devenue une ville libre, et la Prusse a reçu environ deux cinquièmes de Saxe."
"The Final Act was signed on 9 June 1815, nine days before Waterloo. Prussia also gained Westphalia and the Rhineland, which made it France’s neighbour on the Rhine, and Austria took Lombardy and Venetia and recovered its Alpine and Illyrian lands. The southern Netherlands, today’s Belgium, were joined to the Dutch provinces as a barrier against France, Sardinia received Genoa, and the Pope and the Bourbon king of Naples returned. In place of the Holy Roman Empire a German Confederation of 39 states was formed under Austrian presidency. The settlement paid little heed to national feeling, but no war between the great powers broke out again until the Crimean War of 1853.": "L’Acte final a été signé le 9 juin 1815, neuf jours avant Waterloo. La Prusse a également gagné la Westphalie et la Rhénanie, qui en faisait des Frances voisines sur le Rhin, et l’Autriche a pris Lombardie et Vénétie et récupéré ses terres alpines et illyriennes. Le sud des Pays-Bas, aujourd'hui la Belgique, ont été rejoints dans les provinces néerlandaises comme une barrière contre la France, la Sardaigne a reçu Gênes, et le pape et le roi Bourbon de Naples est revenu. A la place du Saint Empire romain, une Confédération allemande de 39 Etats a été formée sous présidence autrichienne. La colonie n’a guère tenu compte des sentiments nationaux, mais aucune guerre entre les grandes puissances n’a éclaté jusqu’à la guerre de Crimée de 1853."
"Congress of Vienna": "Congrès de Vienne"
"Final Act": "Acte final"
"9 June 1815": "9 juin 1815"
"German Confederation": "Confédération allemande"
"39 states under Austrian presidency": "39 États sous présidence autrichienne"
"Murat’s war for Naples, 1815": "La guerre de Murat pour Naples, 1815"
"Final Act of the Congress of Vienna": "Acte final du Congrès de Vienne"
"The Final Act gathered the Congress’s treaties into one document, signed by Austria, Britain, France, Portugal, Prussia, Russia and Sweden. Spain signed only in 1817.": "L’Acte final a rassemblé les traités du Congrès en un seul document, signé par l’Autriche, la Grande-Bretagne, la France, le Portugal, la Prusse, la Russie et la Suède."
"The Kingdom of Poland, known as Congress Poland, was joined to Russia with the tsar as its king and its own constitution and army.": "Le Royaume de Pologne, connu sous le nom de Congrès Pologne, a été rejoint en Russie avec le tsar comme son roi et sa propre constitution et armée."
"Saxony": "Saxe"
"The King of Saxony, who had stood by Napoleon, kept his throne and Dresden but lost the north of his kingdom to Prussia.": "Le roi de Saxe, qui s’était tenu près de Napoléon, garda son trône et Dresde mais perdit le nord de son royaume en Prusse."
"Cologne": "Cologne"
"Prussia’s new lands on the Rhine and in Westphalia made it the guardian of Germany’s western border.": "Prusses nouvelles terres sur le Rhin et en Westphalie en fait le gardien de l’Allemagne à la frontière occidentale."
"Brussels": "Bruxelles"
"The United Kingdom of the Netherlands under William I of Orange joined the former Austrian Netherlands to the Dutch provinces.": "Le Royaume-Uni des Pays-Bas, sous William Ier d’Orange, a rejoint les anciens Pays-Bas autrichiens dans les provinces néerlandaises."
"Frankfurt": "Francfort"
"The Federal Assembly of the German Confederation met in the free city from 1816, chaired by Austria.": "L’Assemblée fédérale de la Confédération allemande s’est réunie dans la ville libre à partir de 1816, présidée par l’Autriche."
"Milan": "Milan"
"Lombardy and Venetia became the Kingdom of Lombardy–Venetia under the Austrian emperor.": "La Lombardie et la Vénétie sont devenues le royaume de Lombardie-Vénétie sous l’empereur autrichien."
"Genoa": "Gênes"
"The old republic was given to the Kingdom of Sardinia, against the wishes of many of its people.": "La vieille république a été donnée au Royaume de Sardaigne, contre la volonté de beaucoup de son peuple."
"Austrian gains": "Bénéfices autrichiens"
"Prussian gains": "Gains prussiens"
"Russian gains": "Gains russes"
"Gains for the Netherlands": "Gains pour les Pays-Bas"
"The Hundred Days and Waterloo": "Les Cent Jours et Waterloo"
"March – November 1815": "mars – novembre 1815"
"Napoleon left Elba with about 1,000 men and landed at Golfe-Juan near Cannes on 1 March 1815. He marched north through the Alps, avoiding royalist Provence, and at Laffrey, near Grenoble, the troops sent to stop him went over to him. Marshal Ney, who had promised Louis XVIII to bring him back in an iron cage, joined him too, and Napoleon entered Paris on 20 March as the king fled to Ghent. The powers meeting at the Congress of Vienna declared him an outlaw and each promised 150,000 men. Napoleon decided to strike first, at the two allied armies in Belgium, the British, Dutch and German army of the Duke of Wellington and the Prussian army of Blücher, before the Austrians and Russians could arrive.": "Napoléon quitta l’Elbe avec environ 1 000 hommes et débarqua à Golfe-Juan près de Cannes le 1er mars 1815. Il marcha au nord dans les Alpes, évitant la Provence royaliste, et à Laffrey, près de Grenoble, les troupes envoyées pour l’arrêter s’en allèrent vers lui. Le maréchal Ney, qui avait promis à Louis XVIII de le ramener dans une cage en fer, le rejoignit aussi, et Napoléon entra à Paris le 20 mars alors que le roi s’était enfui à Gand. Napoléon décida de frapper d’abord, aux deux armées alliées en Belgique, l’armée britannique, néerlandaise et allemande du duc de Wellington et l’armée prussienne de Blücher, avant que les Autrichiens et les Russes puissent arriver."
"On 15 June the French crossed the Sambre at Charleroi. The next day Napoleon beat Blücher at Ligny while Ney held Wellington at Quatre Bras, but the Prussians fell back north to Wavre, staying within reach of Wellington. On 18 June Wellington’s army of about 68,000 held the ridge of Mont-Saint-Jean, south of Waterloo, against Napoleon’s 73,000 until the Prussians struck the French right in the afternoon; when the Imperial Guard’s last attack failed that evening, the French army broke. Napoleon abdicated again on 22 June, surrendered to the British on 15 July and was exiled to Saint Helena, where he died in 1821. The second Treaty of Paris on 20 November 1815 cut France back to its borders of 1790 and imposed an indemnity and an allied occupation.": "Le 15 juin, les Français traversèrent le Sambre à Charleroi. Le lendemain Napoléon battit Blücher à Ligny tandis que Ney tenait Wellington au Quatre Bras, mais les Prussiens retournèrent au nord jusqu’à Wavre, restant à portée de Wellington. Le 18 juin, l’armée de Wellington, d’environ 68 000 hommes, tenait la crête du Mont-Saint-Jean, au sud de Waterloo, contre Napoléon 73 000, jusqu’à ce que les Prussiens frappent la droite française dans l’après-midi ; lorsque la dernière attaque de la Garde impériale échoua ce soir-là, l’armée française éclata. Napoléon abdiqua de nouveau le 22 juin, se rendit aux Britanniques le 15 juillet et fut exilé à Sainte-Hélène où il mourut en 1821. Le deuxième traité de Paris, le 20 novembre 1815, coupe la France à ses frontières de 1790 et impose une indemnité et une occupation alliée."
"Battle of Waterloo": "Bataille de Waterloo"
"18 June 1815, allied victory": "18 juin 1815, victoire alliée"
"Losses at Waterloo": "Pertes à Waterloo"
"About 24,000 allied and Prussian and some 30,000 or more French killed, wounded or captured (estimates vary)": "Environ 24 000 alliés et prussiens et environ 30 000 Français tués, blessés ou capturés (les estimations varient)"
"Second Treaty of Paris": "Deuxième traité de Paris"
"20 November 1815": "20 novembre 1815"
"Golfe-Juan": "Golfe-Juan"
"1 March 1815": "1er mars 1815"
"Napoleon came ashore with the soldiers of his guard from Elba and set off north on the mountain road through Digne and Gap.": "Napoléon est venu à terre avec les soldats de sa garde d’Elbe et s’est mis en route vers le nord sur la route de montagne par Digne et Gap."
"Laffrey": "Laffrey"
"7 March 1815": "7 mars 1815"
"Napoleon walked up to the infantry sent to stop him and invited them to shoot their emperor. They joined him instead.": "Napoléon se rendit à l’infanterie envoyée pour l’arrêter et les invita à tirer sur leur empereur. Ils le rejoignirent à la place."
"20 March 1815": "20 mars 1815"
"Napoleon returned to the Tuileries the night after Louis XVIII had fled.": "Napoléon retourna aux Tuileries la nuit après que Louis XVIII eut fui."
"Battle of Ligny": "Bataille de Ligny"
"16 June 1815": "16 juin 1815"
"Napoleon’s last victory. Blücher, unhorsed and nearly captured, rallied his army and led it north towards Wavre.": "La dernière victoire de Napoléon. Blücher, sans chevaux et presque capturé, rallia son armée et la conduisit vers le nord en direction de Wavre."
"Quatre Bras": "Quatre Bras"
"Ney failed to take the crossroads from Wellington’s gathering army, which fell back to Mont-Saint-Jean the next day.": "Ney n’a pas réussi à prendre le carrefour de l’armée de rassemblement Wellington, qui est retombée au Mont-Saint-Jean le lendemain."
"18 June 1815": "18 juin 1815"
"Wellington’s British, Dutch, Belgian, Hanoverian, Brunswick and Nassau troops held their ridge all day; Blücher’s Prussians, attacking at Plancenoit, decided the battle.": "Wellingtons Britanniques, Hollandais, Belges, Hanovres, Brunswick et Nassau tenaient leur crête toute la journée ; Blüchers Prussiens, attaquant à Plancenoit, décida de la bataille."
"Battle of Wavre": "Bataille de Wavre"
"18–19 June 1815": "18–19 juin 1815"
"Marshal Grouchy’s wing pushed back the Prussian rearguard but was too far away to help Napoleon.": "L’aile du maréchal Grouchy a repoussé l’arrière-garde prussienne mais était trop loin pour aider Napoléon."
"Rochefort": "Rochefort"
"15 July 1815": "15 juillet 1815"
"Unable to escape to America past the British blockade, Napoleon surrendered to Captain Maitland of HMS Bellerophon off the Île d’Aix.": "Incapable d’échapper à l’Amérique après le blocus britannique, Napoléon s’est rendu au capitaine Maitland du HMS Bellerophon au large de l’île d’Aix."
"Armée du Nord": "Armée du Nord"
"Success for Wellington’s allied army": "Succès de l’armée alliée Wellington"
"Moves of Wellington’s allied army": "Mouvements de l’armée alliée Wellington"
