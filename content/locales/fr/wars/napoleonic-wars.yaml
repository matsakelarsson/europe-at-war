"July 1806 – July 1807": "juillet 1806 – juillet 1807"
"After Austerlitz Napoleon reshaped Germany. On 12 July 1806 sixteen princes, led by the new kings of Bavaria and Württemberg, formed the Confederation of the Rhine under his protection and left the Holy Roman Empire. Under a French ultimatum Francis II laid down the imperial crown on 6 August, ending an empire that had lasted, in some form, for a thousand years; he kept the title of Emperor of Austria he had taken in 1804. Prussia, neutral in 1805, was angered by Napoleon’s offer to return Hanover to Britain, and in October it went to war with Saxony at its side.": "Après Austerlitz Napoléon remodelé l’Allemagne. Le 12 juillet 1806, seize princes, dirigés par les nouveaux rois de Bavière et de Wurtemberg, formèrent la Confédération du Rhin sous sa protection et quittèrent le Saint-Empire romain. Sous un ultimatum français, François II établit la couronne impériale le 6 août, mettant fin à un empire qui avait duré, sous une forme ou une autre, pendant mille ans ; il conserva le titre d’empereur d’Autriche qu’il avait pris en 1804. La Prusse, neutre en 1805, fut irrité par l’offre de Napoléon de retourner Hanovre en Grande-Bretagne, et en octobre elle alla à la guerre avec la Saxe à ses côtés."
"On 14 October Napoleon beat Prince Hohenlohe’s Prussians and Saxons at Jena, while 20 km to the north Marshal Davout’s corps of 26,000 routed the main Prussian army, twice its size, at Auerstedt. Napoleon entered Berlin on 27 October, and Hohenlohe surrendered at Prenzlau the next day. Saxony changed sides and became a kingdom. After further fighting in Poland, Russia and Prussia made peace with Napoleon at Tilsit in July 1807. Prussia lost about half its land and people. Its lands west of the Elbe went to the new Kingdom of Westphalia and other French clients, and most of its Polish lands to the Duchy of Warsaw.": "Le 14 octobre, Napoléon battit le prince Hohenlohe à Jéna les Prussiens et les Saxons, tandis que 20 km au nord du maréchal Davout de 26 000 roulait la principale armée prussienne, deux fois sa taille, à Auerstedt. Napoléon entra à Berlin le 27 octobre et Hohenlohe se rendit à Prenzlau le lendemain. La Saxe changea de camp et devint royaume. Après de nouveaux combats en Pologne, la Russie et la Prusse ont fait la paix avec Napoléon à Tilsit en juillet 1807. La Prusse a perdu environ la moitié de ses terres et de son peuple. Ses terres à l’ouest de l’Elbe sont allées au nouveau royaume de Westphalie et d’autres clients français, et la plupart de ses terres polonaises au duché de Varsovie."
