"In 1805 Austria joined Britain, Russia and Sweden in the Third Coalition against Napoleon, who had crowned himself Emperor of the French the year before. On 10 September an Austrian army under Karl Mack crossed the Inn into Bavaria, whose elector sided with France, and advanced to Ulm to wait for the Russians. Napoleon marched his Grande Armée from the Channel coast to the Rhine and in early October swung it across Württemberg to the Danube behind Mack, while Bavaria, Württemberg and Baden joined him. Surrounded, Mack surrendered at Ulm on 20 October; in all the campaign cost Austria some 60,000 men taken prisoner.": "En 1805, l’Autriche a rejoint la Grande-Bretagne, la Russie et la Suède dans la troisième coalition contre Napoléon, qui s’était couronné Empereur des Français l’année précédente. Le 10 septembre, une armée autrichienne sous Karl Mack a traversé l’auberge en Bavière, dont les électeurs se sont associés à la France, et a avancé à Ulm pour attendre les Russes. Napoléon marcha sa Grande Armée de la côte de la Manche jusqu’au Rhin et, au début d’octobre, il traversa Wurtemberg jusqu’au Danube derrière Mack, tandis que la Bavière, Wurtemberg et Baden le rejoignirent. Entouré, Mack se rendit à Ulm le 20 octobre ; dans toute la campagne, l’Autriche a coûté environ 60 000 hommes faits prisonniers."
"The French entered Vienna on 13 November, and Kutuzov’s Russians and the remaining Austrians fell back into Moravia, where Tsar Alexander I and Emperor Francis II joined them. On 2 December near Austerlitz the allies attacked Napoleon’s right, which he had left weak on purpose, and he broke through their centre on the Pratzen heights. The allies lost at least 27,000 men, about a third of their army, against some 9,000 French. At Pressburg on 26 December Austria gave up Venetia, Istria and Dalmatia to Napoleon’s Kingdom of Italy, and Tyrol, Vorarlberg and its Swabian lands to Bavaria, Württemberg and Baden. It received Salzburg in return.": "Les Français entrèrent à Vienne le 13 novembre, et les Russes de Kutuzov et les autres Autrichiens retournèrent en Moravie, où le tsar Alexandre Ier et l’empereur François II se joignirent à eux. Le 2 décembre près d’Austerlitz, les alliés attaquèrent à droite Napoléon, qu’il avait laissé faible exprès, et il brisa leur centre sur les hauteurs de Pratzen. Les alliés ont perdu au moins 27 000 hommes, environ un tiers de leur armée, contre quelque 9 000 Français. À Pressburg le 26 décembre l’Autriche a abandonné Venetia, Istrie et Dalmatie au royaume Napoléon d’Italie, et Tyrol, Vorarlberg et ses terres souabe en Bavière, Wurtemberg et Baden. Il a reçu Salzbourg en retour."
