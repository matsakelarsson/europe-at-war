# Some French text was translated automatically.
"Napoleonic Wars": "Guerres napoléoniennes"
"The wars between Napoleon’s France and its allies and changing coalitions of Britain, Austria, Prussia, Russia, Sweden and others. Napoleon’s victories over Austria and Prussia ended the Holy Roman Empire and remade the map of Germany until the allies drove him back across the Rhine in 1813; Sweden lost Swedish Pomerania in 1807 and, after the campaign of 1813, gained Norway from Denmark at Kiel in 1814. Britain’s victory at Trafalgar in 1805 left it master of the seas, and Napoleon’s blockade of its trade drew him into Spain and Russia; after the destruction of his army in Russia in 1812 and his defeat at Leipzig in 1813 he abdicated, and the Congress of Vienna and his final defeat at Waterloo in 1815 settled the map of Europe.": "Les guerres entre Napoléon et ses alliés et les coalitions changeantes de la Grande-Bretagne, de l’Autriche, de la Prusse, de la Russie, de la Suède et d’autres. Les victoires de Napoléon sur l’Autriche et la Prusse ont mis fin au Saint Empire romain et ont refait la carte de l’Allemagne jusqu’à ce que les alliés le ramènent à travers le Rhin en 1813 ; la Suède a perdu la Poméranie suédoise en 1807 et, après la campagne de 1813, a gagné la Norvège du Danemark à Kiel en 1814. La victoire de la Grande-Bretagne à Trafalgar en 1805 le laissa maître des mers, et le blocus de Napoléon de son commerce l’attira vers l’Espagne et la Russie ; après la destruction de son armée en Russie en 1812 et sa défaite à Leipzig en 1813 il abdiqua, et le Congrès de Vienne et sa défaite finale à Waterloo en 1815 installèrent la carte de l’Europe."
"Dates are New Style.": "Les dates sont de nouveau style."
"Migrated from Sweden at War, so the story is told from Sweden’s side.": "Migré de Suède à la guerre, l’histoire est donc racontée du côté suédois."
"The steps on the war in Germany and Austria were added for Europe at War. Bavaria, Württemberg, Baden and, from December 1806, Saxony fought on France’s side until 1813.": "Les étapes de la guerre en Allemagne et en Autriche ont été ajoutées pour l’Europe à la guerre. Bavière, Wurtemberg, Baden et, de décembre 1806, la Saxe a combattu sur le côté France jusqu’à 1813."
"The steps on the campaign of 1814 and the Hundred Days were also added for Europe at War. The war in Spain and Portugal, at sea and in Italy is only outlined.": "Les étapes de la campagne de 1814 et des Cent Jours ont également été ajoutées pour l’Europe en temps de guerre. La guerre en Espagne et au Portugal, en mer et en Italie est seulement décrite."
"The steps on Trafalgar, Eylau, Friedland and Tilsit, the Continental System, the invasion of Russia, Leipzig and the Congress of Vienna were added later to tell the war as a European story. The Peninsular War and the invasion of Russia have their own pages.": "Les pas sur Trafalgar, Eylau, Friedland et Tilsit, le système continental, l’invasion de la Russie, Leipzig et le Congrès de Vienne ont été ajoutés plus tard pour raconter la guerre comme une histoire européenne."
