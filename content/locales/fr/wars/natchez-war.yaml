# French translations of the catalogue text (wave 14); step bodies follow later.
Natchez War: Guerre des Natchez
? The rising of the Natchez against French Louisiana and the French war that followed. The Natchez, whose towns lay along St. Catherine Creek near the Mississippi, were among the last peoples of the river ruled by a hereditary chief, the Great Sun. French tobacco plantations worked by enslaved Africans had spread over their land, and in 1729 the commandant of Fort Rosalie demanded the village of White Apple, with its temple and ancestral graves, for his own plantation. On 28 November 1729 the Natchez rose, killing about 230 French men, women and children at the fort and the plantations and taking the other women and children and most of the enslaved Africans captive; the Yazoo destroyed the French post on their river. The governor, Étienne Périer, struck back with Choctaw allies, who attacked the Natchez in January 1730, and a French siege of the Natchez forts; the Natchez escaped across the Mississippi. In January 1731 Périer besieged their new fort near Sicily Island, and about 500 Natchez who surrendered, among them the Great Sun, were shipped to Saint-Domingue and sold as slaves. The others found refuge among the Chickasaw, the Muscogee and the Cherokee, and the war led on to the French wars against the Chickasaw.
: Le soulèvement des Natchez contre la Louisiane française et la guerre française qui suivit. Les Natchez, dont les villages s’étendaient le long du St. Catherine Creek, près du Mississippi, étaient l’un des derniers peuples du fleuve gouvernés par un chef héréditaire, le Grand Soleil. Des plantations de tabac françaises exploitées par des Africains réduits en esclavage s’étaient étendues sur leurs terres et, en 1729, le commandant du fort Rosalie exigea le village de la Pomme Blanche, avec son temple et les tombes des ancêtres, pour sa propre plantation. Le 28 novembre 1729, les Natchez se soulevèrent, tuèrent environ 230 Français, hommes, femmes et enfants, au fort et dans les plantations, et firent prisonniers les autres femmes et enfants et la plupart des Africains réduits en esclavage ; les Yazous détruisirent le poste français établi sur leur rivière. Le gouverneur, Étienne Périer, riposta avec l’aide d’alliés chactas, qui attaquèrent les Natchez en janvier 1730, et par un siège des forts natchez ; les Natchez s’échappèrent de l’autre côté du Mississippi. En janvier 1731, Périer assiégea leur nouveau fort près de Sicily Island, et environ 500 Natchez qui s’étaient rendus, parmi lesquels le Grand Soleil, furent déportés à Saint-Domingue et vendus comme esclaves. Les autres trouvèrent refuge chez les Chicachas, les Muscogees et les Cherokees, et la guerre déboucha sur les guerres françaises contre les Chicachas.
