# French translations of the catalogue text (wave 8); step bodies follow later.
Nathu La and Cho La clashes: Affrontements de Nathu La et de Cho La
Two armed clashes between Indian and Chinese troops in 1967 on the border between Sikkim, then an Indian protectorate, and Tibet. At the Nathu La pass, after weeks of scuffles over trenches and wire, fighting broke out on 11 September when Indian soldiers began laying barbed wire along the crest to mark the border. It grew into days of artillery and machine-gun duels, in which the Indian positions on the heights of Sebu La and Camel’s Back destroyed many Chinese bunkers, until the firing died down by 14–15 September. On 1 October a second clash at the Cho La pass, further north, ended with the Chinese pulling back. By Indian figures India lost 88 killed and 163 wounded and China about 340 killed and 450 wounded; Chinese figures give 32 Chinese and about 100 Indian dead. The clashes were India’s first success against China after 1962, and the Sikkim border stayed quiet for decades.: Deux affrontements armés entre troupes indiennes et chinoises en 1967, à la frontière entre le Sikkim, alors protectorat indien, et le Tibet. Au col de Nathu La, après des semaines d’échauffourées autour de tranchées et de fils de fer, les combats éclatèrent le 11 septembre, lorsque des soldats indiens commencèrent à poser des barbelés le long de la crête pour marquer la frontière. Ils dégénérèrent en plusieurs jours de duels d’artillerie et de mitrailleuses, au cours desquels les positions indiennes établies sur les hauteurs de Sebu La et de Camel’s Back détruisirent de nombreux bunkers chinois, jusqu’à ce que les tirs s’apaisent vers les 14–15 septembre. Le 1er octobre, un second affrontement au col de Cho La, plus au nord, se termina par le repli des Chinois. Selon les chiffres indiens, l’Inde perdit 88 tués et 163 blessés, et la Chine environ 340 tués et 450 blessés ; les chiffres chinois font état de 32 morts chinois et d’environ 100 morts indiens. Ces affrontements furent le premier succès de l’Inde face à la Chine après 1962, et la frontière du Sikkim resta calme pendant des décennies.
India: Inde
China: Chine
