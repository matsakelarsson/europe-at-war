# French translations of the catalogue text (wave 9); step bodies follow later.
National Protection War: Guerre de protection nationale
? The war, also called the Anti-Monarchy War or Third Revolution, that ended Yuan Shikai’s attempt to make himself emperor. In December 1915 Yuan accepted the throne of a new Empire of China, with the reign name Hongxian from 1 January 1916. On 25 December 1915 the military leaders of Yunnan, Cai E and Tang Jiyao, with Li Liejun, declared the province independent at Kunming and raised the National Protection Army; the scholar Liang Qichao, Cai E’s former teacher, was among the organisers. Cai E led a small army into Sichuan, where it held its own against a much larger Beiyang force, about 80,000 men, in hard fighting around Luzhou and Naxi in February and March 1916. Guizhou joined in January and Guangxi under Lu Rongting in March, and Yuan’s own generals refused to support him. On 22 March 1916 Yuan gave up the monarchy and returned to the presidency, but more provinces, Guangdong, Zhejiang, Shaanxi, Sichuan and Hunan among them, declared independence, and in May the southern provinces set up a military council at Zhaoqing in Guangdong. Yuan died on 6 June 1916; Li Yuanhong succeeded him as president, the 1912 constitution was restored, and the southern provinces withdrew their declarations by 14 July. The war left the provinces in the hands of their military governors and opened the warlord era.
: La guerre, appelée aussi guerre antimonarchique ou troisième révolution, qui mit fin à la tentative de Yuan Shikai de se faire empereur. En décembre 1915, Yuan accepta le trône d’un nouvel Empire de Chine, avec le nom de règne Hongxian à partir du 1er janvier 1916. Le 25 décembre 1915, les chefs militaires du Yunnan, Cai E et Tang Jiyao, avec Li Liejun, proclamèrent l’indépendance de la province à Kunming et levèrent l’Armée de protection nationale ; le lettré Liang Qichao, ancien professeur de Cai E, figurait parmi les organisateurs. Cai E conduisit une petite armée dans le Sichuan, où elle tint tête à une force de Beiyang bien plus nombreuse, environ 80 000 hommes, lors de durs combats autour de Luzhou et de Naxi en février et mars 1916. Le Guizhou se joignit au mouvement en janvier et le Guangxi de Lu Rongting en mars, et les propres généraux de Yuan refusèrent de le soutenir. Le 22 mars 1916, Yuan renonça à la monarchie et reprit la présidence, mais d’autres provinces, dont le Guangdong, le Zhejiang, le Shaanxi, le Sichuan et le Hunan, proclamèrent leur indépendance et, en mai, les provinces du Sud établirent un conseil militaire à Zhaoqing, dans le Guangdong. Yuan mourut le 6 juin 1916 ; Li Yuanhong lui succéda à la présidence, la constitution de 1912 fut rétablie et les provinces du Sud retirèrent leurs déclarations au plus tard le 14 juillet. La guerre laissa les provinces aux mains de leurs gouverneurs militaires et ouvrit l’ère des seigneurs de la guerre.
