# French translations of the catalogue text (wave 14); step bodies follow later.
Navajo Wars and the Long Walk: Guerres navajos et Longue Marche
? The United States’ war of 1863–1864 against the Navajo (Diné) and their forced removal to Bosque Redondo, which ended with the treaty of 1868. Raids and counter-raids for livestock and captives between the Navajo, the New Mexicans, the Pueblos and the Ute had gone on for generations under Spanish and Mexican rule, and continued after the American conquest of New Mexico in 1846, with the killing of the Navajo leader Narbona during talks in 1849, a Navajo attack on Fort Defiance in 1860 and the killing of Navajo women and children at Fort Fauntleroy in 1861. In 1863 General James Carleton ordered the Navajo to surrender for removal to Bosque Redondo on the Pecos River, where he had already confined the Mescalero Apache. Colonel Christopher “Kit” Carson’s New Mexico volunteers and Ute scouts destroyed crops, orchards, homes and herds across the Navajo country, entering Canyon de Chelly in January 1864, while Ute and New Mexican raiders carried off Navajo women and children. Starving, some 8,000 to 9,000 people surrendered and were marched about 500 km east in more than fifty groups between 1864 and 1866, the Long Walk, on which at least 200 died. At Bosque Redondo (Hwéeldi), with brackish water, failed harvests, disease and raids, deaths during the march and the captivity are estimated at about 3,000, and up to 3,500 by some counts. Others held out in the canyons and mountains of the west, among them Manuelito, who surrendered in 1866. By the Treaty of Bosque Redondo of 1 June 1868, negotiated by Barboncito, the Navajo were allowed to return to part of their homeland, the beginning of today’s Navajo Nation.
: "La guerre que les États-Unis menèrent en 1863–1864 contre les Navajos (Diné) et leur déplacement forcé à Bosque Redondo, qui prit fin avec le traité de 1868. Raids et contre-raids pour le bétail et les captifs entre les Navajos, les Néo-Mexicains, les Pueblos et les Utes duraient depuis des générations sous la domination espagnole puis mexicaine, et se poursuivirent après la conquête américaine du Nouveau-Mexique en 1846, avec le meurtre du chef navajo Narbona lors de pourparlers en 1849, une attaque navajo contre Fort Defiance en 1860 et le meurtre de femmes et d’enfants navajos à Fort Fauntleroy en 1861. En 1863, le général James Carleton ordonna aux Navajos de se rendre pour être transférés à Bosque Redondo, sur le Pecos, où il avait déjà confiné les Apaches Mescaleros. Les volontaires du Nouveau-Mexique du colonel Christopher « Kit » Carson et leurs éclaireurs utes détruisirent récoltes, vergers, habitations et troupeaux dans tout le pays navajo, pénétrant dans le canyon de Chelly en janvier 1864, tandis que des groupes de raid utes et néo-mexicains enlevaient des femmes et des enfants navajos. Affamées, quelque 8 000 à 9 000 personnes se rendirent et furent conduites à pied sur environ 500 km vers l’est, en plus de cinquante groupes, entre 1864 et 1866 : ce fut la Longue Marche, au cours de laquelle au moins 200 personnes moururent. À Bosque Redondo (Hwéeldi), entre l’eau saumâtre, les récoltes perdues, les maladies et les raids, le nombre de morts pendant la marche et la captivité est estimé à environ 3 000, et jusqu’à 3 500 selon certains décomptes. D’autres tinrent bon dans les canyons et les montagnes de l’ouest, parmi lesquels Manuelito, qui se rendit en 1866. Par le traité de Bosque Redondo du 1er juin 1868, négocié par Barboncito, les Navajos furent autorisés à regagner une partie de leur terre natale : ce fut le début de l’actuelle Nation navajo."
