# Some French text was translated automatically.
"Navarrese Civil War": "Guerre civile en Navarre"
"A war in Navarre between King John II, who had ruled since the death of his wife Queen Blanche in 1441, and their son Charles, Prince of Viana, who by his grandparents’ marriage settlement should have inherited the kingdom. The nobility split into two parties, the Beaumonteses, who backed Charles, and the Agramonteses, who backed John. Castile, at odds with John, sent troops to help Charles. In 1451 John’s forces beat and captured Charles at Aibar; he was released in 1453, and in 1455 John disinherited him in favour of his daughter Eleanor and her husband, Gaston IV of Foix. Charles fled to France and then to his uncle Alfonso V at Naples. He was reconciled with his father only briefly, and his imprisonment and death in Barcelona in 1461 set off the Catalan Civil War. The feud between Beaumonteses and Agramonteses went on until the Castilian conquest of Upper Navarre in 1512.": "Une guerre en Navarre entre le roi Jean II, qui gouvernait depuis la mort de sa femme la reine Blanche en 1441, et leur fils Charles, prince de Viana, qui par ses grands-parents du mariage aurait dû hériter du royaume. La noblesse s’est divisée en deux partis, les Beaumontese, qui soutenaient Charles, et les Agramontese, qui soutenaient John. Castille, en désaccord avec John, envoya des troupes pour aider Charles. En 1451, les forces de John ont battu et capturé Charles à Aibar ; il a été libéré en 1453, et en 1455 John l’a déshérité en faveur de sa fille Eleanor et son mari, Gaston IV de Foix. Charles s’est enfui en France puis à son oncle Alfonso V à Naples. Il n’a été réconcilié avec son père que brièvement, et son emprisonnement et sa mort à Barcelone en 1461 ont déclenché la guerre civile catalane. La querelle entre Beaumontese et Agramontese se poursuit jusqu’à la conquête castillanienne de la Haute Navarre en 1512."
"John was also king of Aragon from 1458. Some accounts date the battle of Aibar to 1452.": "Jean fut aussi roi d’Aragon à partir de 1458. Certains comptes datent la bataille d’Aibar à 1452."
