# French translations of the catalogue text (wave 8); step bodies follow later.
Naxalite–Maoist insurgency: Insurrection naxalite-maoïste
? The armed movement of India’s Maoist revolutionaries, called Naxalites after the village of Naxalbari in West Bengal, where a peasant rising in 1967 began it. The first wave, of land seizures and killings of landlords and police in West Bengal, Andhra Pradesh and Calcutta, was crushed by 1972. Regrouped in the forests of central and eastern India among the Adivasi (tribal) peoples, the movement merged in 2004 into the Communist Party of India (Maoist), whose guerrillas were active at their peak in some 180 districts of a “Red Corridor” and inflicted heavy losses on the security forces. A government-backed militia and large paramilitary offensives followed, and violence declined after 2010. In 2024 the government set a deadline of 31 March 2026 to end the insurgency; its forces killed the party’s general secretary in 2025, most other leaders were killed or surrendered, and in March 2026 the government declared the country free of the insurgency. The last active member of the party’s politburo was arrested in July 2026, but the party has not declared an end to its armed struggle. Last updated 27 November 2026.
: "Le mouvement armé des révolutionnaires maoïstes de l’Inde, appelés naxalites d’après le village de Naxalbari, au Bengale-Occidental, où il naquit d’un soulèvement paysan en 1967. La première vague, faite d’occupations de terres et d’assassinats de propriétaires fonciers et de policiers au Bengale-Occidental, en Andhra Pradesh et à Calcutta, était écrasée dès 1972. Reconstitué dans les forêts du centre et de l’est de l’Inde, parmi les peuples adivasis (tribaux), le mouvement fusionna en 2004 au sein du Parti communiste d’Inde (maoïste), dont les guérilleros étaient actifs, à leur apogée, dans quelque 180 districts d’un « corridor rouge » et infligèrent de lourdes pertes aux forces de sécurité. Une milice soutenue par le gouvernement et de grandes offensives paramilitaires suivirent, et la violence diminua après 2010. En 2024, le gouvernement fixa au 31 mars 2026 la date butoir pour mettre fin à l’insurrection ; ses forces tuèrent le secrétaire général du parti en 2025, la plupart des autres dirigeants furent tués ou se rendirent, et en mars 2026 le gouvernement déclara le pays libéré de l’insurrection. Le dernier membre actif du bureau politique du parti fut arrêté en juillet 2026, mais le parti n’a pas proclamé la fin de sa lutte armée. Dernière mise à jour : 27 novembre 2026."
