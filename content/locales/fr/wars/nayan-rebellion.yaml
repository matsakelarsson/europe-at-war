# French translations of the catalogue text (wave 9); step bodies follow later.
Nayan’s rebellion: Rébellion de Nayan
? The rising of the Mongol princes of the eastern wing against Kublai Khan in Manchuria. Nayan, a descendant of one of Genghis Khan’s brothers, probably Temüge, held large appanage lands between the Khingan mountains and the Liao river. In the spring of 1287 he rose with Shiktür, of the line of Qasar, and Qadan, of the line of Qachiun, and was in contact with Kaidu, who had been at war with Kublai since the 1260s. Kublai, then 72, sent his general Bayan to hold Karakorum so that Kaidu could not join the rebels, and marched into Manchuria himself with Mongol and Chinese troops, supplied by ships that sailed to the mouth of the Liao. Around 16 July 1287 his army surprised Nayan’s camp, protected by a ring of wagons, and after a morning’s fighting the rebels broke. Kublai, who directed the battle from a palanquin carried by elephants, had Nayan executed at once without shedding his blood, by having him rolled in a carpet. Nayan was a Christian of the Church of the East, and Marco Polo says his standards bore the cross. After the victory Kublai reorganised Manchuria as the province of Liaoyang. Qadan and other rebels fought on against Yuan troops in Liaodong, among them those of Kublai’s grandson Temür, and in 1290–1291 Qadan invaded Goryeo until a Yuan and Korean army defeated him at Yeongi in May 1291.
: Le soulèvement des princes mongols de l’aile orientale contre Kubilai Khan en Mandchourie. Nayan, descendant de l’un des frères de Gengis Khan, probablement Temüge, détenait de vastes apanages entre les monts Khingan et le Liao. Au printemps 1287, il se souleva avec Shiktür, de la lignée de Qasar, et Qadan, de la lignée de Qachiun, et était en contact avec Qaïdu, en guerre contre Kubilai depuis les années 1260. Kubilai, alors âgé de 72 ans, envoya son général Bayan tenir Karakorum pour empêcher Qaïdu de rejoindre les rebelles, et marcha lui-même en Mandchourie avec des troupes mongoles et chinoises, ravitaillées par des navires qui gagnèrent l’embouchure du Liao. Vers le 16 juillet 1287, son armée surprit le camp de Nayan, protégé par un cercle de chariots, et après une matinée de combats les rebelles cédèrent. Kubilai, qui dirigeait la bataille depuis un palanquin porté par des éléphants, fit exécuter Nayan sur-le-champ sans verser son sang, en le faisant rouler dans un tapis. Nayan était un chrétien de l’Église de l’Orient, et Marco Polo rapporte que ses étendards portaient la croix. Après la victoire, Kubilai réorganisa la Mandchourie en province du Liaoyang. Qadan et d’autres rebelles continuèrent à combattre les troupes Yuan au Liaodong, parmi lesquelles celles de Temür, petit-fils de Kubilai, et en 1290–1291 Qadan envahit le Goryeo, jusqu’à sa défaite face à une armée Yuan et coréenne à Yeongi en mai 1291.
