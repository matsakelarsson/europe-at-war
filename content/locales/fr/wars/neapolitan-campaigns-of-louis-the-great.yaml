# Some French text was translated automatically.
"Neapolitan campaigns of Louis the Great": "Campagnes napolitaines de Louis le Grand"
"Two invasions of the Kingdom of Naples by Louis I (the Great) of Hungary, to avenge his brother Andrew, husband of Queen Joanna I, who was murdered at Aversa in September 1345, and to claim the kingdom. Louis marched through Italy in late 1347, beat Joanna’s new husband Louis of Taranto at Capua on 11 January 1348 and entered Naples, after having Joanna’s cousin Charles of Durazzo executed at Aversa. Joanna fled to Provence and sold Avignon to the pope to pay for her return. The Black Death and the Neapolitans’ dislike of Hungarian rule drove Louis home that spring. He returned in 1350 and took Aversa after a long siege, but left again; after a papal court cleared Joanna of the murder, peace was made on 23 March 1352, leaving her the kingdom.": "Deux invasions du Royaume de Naples par Louis Ier (le Grand) de Hongrie, pour venger son frère Andrew, mari de la reine Joanna Ier, qui a été assassiné à Aversa en septembre 1345, et pour réclamer le royaume. Louis marcha en Italie à la fin de 1347, battit le nouveau mari de Joanna, Louis de Tarente, à Capoue, le 11 janvier 1348 et entra à Naples, après avoir fait exécuter à Aversa le cousin de Joanna Charles de Durazzo. Joanna s’enfuit en Provence et vendit Avignon au pape pour payer son retour. Il revint en 1350 et prit Aversa après un long siège, mais il partit de nouveau ; après qu’une cour pontificale eut éludé Joanna du meurtre, la paix fut faite le 23 mars 1352, laissant son royaume."
"Louis’s armies included many German and Hungarian mercenaries, among them the company of Werner of Urslingen, who changed sides more than once.": "Les armées de Louis's comprenaient de nombreux mercenaires allemands et hongrois, parmi lesquels la compagnie Werner d’Urslingen, qui a changé de camp plus d’une fois."
