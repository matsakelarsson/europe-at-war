# Some French text was translated automatically.
"Neapolitan Revolt of 1647": "Révolte napolitaine de 1647"
"A popular rising in Naples against Spanish rule and the taxes raised for Philip IV’s wars, first led by the young fisherman Masaniello. After his murder the revolt revived, and rebels proclaimed a Neapolitan Republic under French protection, led by the Duke of Guise; Spanish forces retook the city in April 1648.": "À Naples, un soulèvement populaire éclate contre la domination espagnole et les impôts levés pour financer les guerres de Philippe IV. Le jeune pêcheur Masaniello en prend d’abord la tête. Après son assassinat, le mouvement reprend et les insurgés proclament une république napolitaine sous protection française, dirigée par le duc de Guise. Les forces espagnoles reprennent la ville en avril 1648."
"Dates are Gregorian. Sicily had risen first, in Palermo in May 1647, and the revolt in Naples spread to the provinces, where peasants rose against their barons.": "Les dates sont grégoriennes. La Sicile s’était d’abord levée à Palerme en mai 1647, et la révolte de Naples s’est étendue aux provinces où les paysans se sont levés contre leurs barons."
"The Kingdom of Naples stays a separate polity on the base map, ruled by Spanish viceroys. The rebel republic held only the city and parts of the countryside and is not drawn.": "Le Royaume de Naples reste une politique distincte sur la carte de base, gouvernée par les vice-rois espagnols. La république rebelle n’a tenu que la ville et les parties de la campagne et n’est pas dessinée."
