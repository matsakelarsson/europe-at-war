"1647–1648": "1647–1648"
"Naples, one of the largest cities in Europe, had been squeezed for decades to pay for Spain’s wars, and in 1647 the viceroy, the Duke of Arcos, put a new tax on fruit, the food of the poor. On 7 July a quarrel between fruit sellers and tax collectors in the market square turned into a riot. Led by Tommaso Aniello, called Masaniello, a 27-year-old fish seller, and advised by the old priest Giulio Genoino, crowds burned the tax offices and the houses of tax farmers, and Arcos took refuge in the castles. On 13 July he agreed to abolish the new taxes and pardon the rebels.": "Naples, l’une des plus grandes villes d’Europe, avait été pressée pendant des décennies pour payer les guerres espagnoles, et en 1647 le vice-roi, le duc d’Arcos, a mis une nouvelle taxe sur les fruits, la nourriture des pauvres. Dirigé par Tommaso Aniello, appelé Masaniello, un marchand de poisson âgé de 27 ans, et conseillé par le vieux prêtre Giulio Genoino, les foules ont brûlé les bureaux des impôts et les maisons des fiscalistes, et Arcos s’est réfugié dans les châteaux. Le 13 juillet, il a accepté d’abolir les nouveaux impôts et pardonner les rebelles."
"Masaniello, now ‘captain-general of the people’, began to behave erratically, and on 16 July he was killed by a band of armed men. In October a Spanish fleet under Don Juan José of Austria bombarded the city, which rose again, and on 22 October the gunsmith Gennaro Annese proclaimed a republic. Henry, Duke of Guise, who claimed descent from the Angevin kings of Naples, arrived in November to lead it. But the Spanish held the castles, and the barons controlled the provinces. On 6 April 1648, while Guise was outside the walls, Spanish troops entered the city with the help of rebels who had changed sides. Guise was captured, and Annese was executed in June.": "Masaniello, aujourd'hui « capitaine générale du peuple », commença à se comporter de manière erratique et, le 16 juillet, il fut tué par une bande d’hommes armés. En octobre, une flotte espagnole sous la direction de Don Juan José d’Autriche bombarda la ville, qui s’élevait de nouveau, et, le 22 octobre, l’armurier Gennaro Annese proclama une république. Le 6 avril 1648, alors que Guise était hors des murs, les troupes espagnoles entrèrent dans la ville avec l’aide de rebelles qui avaient changé de camp. Guise fut capturé et Annese fut exécutée en juin."
