"Neapolitan Revolution of 1820–1821": "Révolution napolitaine de 1820–1821"
"A constitutional revolution in the Kingdom of the Two Sicilies, ended by an Austrian army. On 1–2 July 1820 army officers and members of the secret society of the Carbonari rose at Nola, General Guglielmo Pepe joined them, and King Ferdinand I accepted a constitution modelled on the Spanish one of 1812. A separate rising in Palermo for Sicilian independence was put down by Neapolitan troops in the autumn. At the congresses of Troppau and Laibach the conservative powers of the Holy Alliance agreed to intervene, and Ferdinand, who had gone to Laibach, disowned the constitution. An Austrian army under General Johann Frimont marched south, routed Pepe’s forces near Rieti on 7 March 1821 and entered Naples on 23 March. Absolute rule was restored, the leaders of the rising were executed or exiled, and Austrian troops stayed in the kingdom until 1827.": "Une révolution constitutionnelle dans le Royaume des Deux Sicilies, terminée par une armée autrichienne. Du 1er au 2 juillet 1820, des officiers de l’armée et des membres de la société secrète du Carbonari se sont levés à Nola, le général Guglielmo Pepe les a rejoints, et le roi Ferdinand j’ai accepté une constitution calquée sur l’espagnol de 1812. Aux congrès de Toppau et de Laibach, les puissances conservatrices de la Sainte Alliance acceptèrent d’intervenir, et Ferdinand, qui s’était rendu à Laibach, désapprouva la constitution. Une armée autrichienne sous le commandement du général Johann Frimont marchait vers le sud, roulait les forces Pepe-S près de Rieti le 7 mars 1821 et entra à Naples le 23 mars. La domination absolue fut rétablie, les chefs de la montée furent exécutés ou exilés, et les troupes autrichiennes restèrent dans le royaume jusqu’en 1827."
"The leaders of the Nola rising, the lieutenants Michele Morelli and Giuseppe Silvati, were hanged in 1822. The revolution was one of several in southern Europe in 1820–1821, with those in Spain, Portugal and Piedmont.": "En 1822, les chefs des Nola, les lieutenants Michele Morelli et Giuseppe Silvati, furent pendus. La révolution fut l’une de plusieurs en Europe du Sud en 1820–1821, avec ceux d’Espagne, du Portugal et du Piémont."
