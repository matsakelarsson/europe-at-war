# Some French text was translated automatically.
"Neapolitan War": "Guerre napolitaine"
"The war of 1815 in which Joachim Murat, King of Naples, sided with Napoleon during the Hundred Days, attacked Austria and called on Italians to rise for a united Italy. Beaten at Occhiobello and Tolentino, he lost his kingdom to the restored Bourbon Ferdinand IV by the Treaty of Casalanza, and was shot after a failed landing in Calabria in October.": "La guerre de 1815, au cours de laquelle Joachim Murat, roi de Naples, prit parti pour Napoléon pendant les Cent Jours, attaqua l’Autriche et appela les Italiens à se lever pour une Italie unie. Battu à Occhiobello et Tolentino, il perdit son royaume au profit du Bourbon Ferdinand IV restauré par le traité de Casalanza, et fut abattu après un débarquement raté en Calabre en octobre."
"Also called the Austro-Neapolitan War. Britain, which protected the Bourbon court in Sicily and had never recognised Murat, declared war on him in April 1815.": "La Grande-Bretagne, qui protégeait la cour de Bourbon en Sicile et n’avait jamais reconnu Murat, lui déclara la guerre en avril 1815."
"Murat’s strength is uncertain; he claimed 82,000 men to encourage recruits, but the real figure was probably about 50,000.": "La force de Murat est incertaine ; il a réclamé 82 000 hommes pour encourager les recrues, mais le chiffre réel était probablement d’environ 50 000."
