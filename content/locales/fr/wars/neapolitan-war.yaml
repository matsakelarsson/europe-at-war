"April – October 1815": "avril – octobre 1815"
"Murat fell back down the Adriatic coast, with Neipperg’s Austrian corps following, while Bianchi marched through Florence and over the Apennines to Foligno to cut off his retreat. Hoping to beat Bianchi before Neipperg arrived, Murat attacked him near Tolentino on 2 May. After two days of indecisive fighting he learned that Neipperg had beaten his rearguard at Scapezzano and was close, and he ordered a retreat that became a rout. With another Austrian force under Nugent coming down from Rome, and a British fleet off Naples, Murat fled in disguise. On 20 May his generals signed the Treaty of Casalanza near Capua, and on 23 May the Austrians entered Naples for King Ferdinand.": "Murat est retombé sur la côte adriatique, suivi par le corps autrichien de Neipperg, tandis que Bianchi a traversé Florence et les Apennins à Foligno pour couper sa retraite. En espérant battre Bianchi avant l’arrivée de Neipperg, Murat l’a attaqué près de Tolentino le 2 mai. Après deux jours de combats indécis, il a appris que Neipperg avait battu son arrière-garde à Scapezzano et était proche, et il a commandé une retraite qui est devenue un rout. Avec une autre force autrichienne sous Nugent descendant de Rome, et une flotte britannique au large de Naples, Murat a fui déguisé. Le 20 mai, ses généraux signèrent le traité de Casalanza près de Capua et, le 23 mai, les Autrichiens entrèrent à Naples pour le roi Ferdinand."
"Murat escaped to France and then to Corsica. In October he sailed for Calabria with some 30 followers, hoping to repeat Napoleon’s return from Elba. He landed at Pizzo on 8 October, but the people did not rally to him; he was seized and handed to Bourbon troops, condemned by a military court, and shot in the castle of Pizzo on 13 October 1815. In December 1816 Ferdinand united his two kingdoms of Naples and Sicily as the Kingdom of the Two Sicilies and became Ferdinand I. Murat’s campaign had failed, but it was the first war fought, at least in name, for Italian unity.": "Murat s’échappa en France puis en Corse. En octobre, il partit pour la Calabre avec une trentaine d’adeptes, espérant reprendre le retour de Napoléon d’Elbe. Il débarqua à Pizzo le 8 octobre, mais le peuple ne se rassembla pas ; il fut saisi et remis aux troupes bourbonaises, condamné par un tribunal militaire, et abattu dans le château de Pizzo le 13 octobre 1815. En décembre 1816, Ferdinand unit ses deux royaumes de Naples et de Sicile comme le Royaume des Deux Sicilies et devint Ferdinand I. La campagne de Murat avait échoué, mais c’était la première guerre menée, du moins au nom, pour l’unité italienne."
