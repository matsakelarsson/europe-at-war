"The Rimini Proclamation": "La Proclamation de Rimini"
"March – April 1815": "mars – avril 1815"
"Joachim Murat, Napoleon’s brother-in-law and King of Naples since 1808, had deserted Napoleon in January 1814 by a treaty with Austria that let him keep his throne. But at the Congress of Vienna the Bourbons, and Britain, which had never recognised him, pressed for his removal. When Napoleon escaped from Elba, Murat sided with him again and declared war on Austria on 15 March 1815. He sent his two Guard divisions through the Papal States, and Pope Pius VII fled to Genoa, while he led his main army up the Adriatic coast from Ancona. At Rimini on 30 March he called on all Italians to rise and fight for an independent and united Italy.": "Joachim Murat, beau-frère de Napoléon et roi de Naples depuis 1808, avait déserté Napoléon en janvier 1814 par un traité avec l’Autriche qui le laissait garder son trône. Mais au Congrès de Vienne les Bourbons, et la Grande-Bretagne, qui ne l’avait jamais reconnu, ont insisté pour qu’il soit expulsé. Il envoya ses deux divisions de garde à travers les États pontificaux, et le pape Pie VII s’enfuit à Gênes, tandis qu’il menait son armée principale sur la côte adriatique depuis Ancône."
"Few answered. Murat’s troops took Bologna on 3 April and then beat the Austrian vanguard under General Bianchi on the Panaro near Modena, and his Guard divisions entered Florence. But the citadel of Ferrara held out against him, and when he tried to force a crossing of the Po at Occhiobello on 8–9 April, the main Austrian army under General Frimont threw him back with more than 2,000 casualties. Britain declared war and sent a fleet. On 12 April the Austrians drove the Neapolitans from their lines before Ferrara, and a few days later Murat ordered a general retreat.": "Les troupes de Murat ont pris Bologne le 3 avril et ont ensuite battu l’avant-garde autrichienne sous la direction du général Bianchi sur le Panaro près de Modène, et ses divisions de garde sont entrées à Florence. Mais la citadelle de Ferrare s’est tenue contre lui, et quand il a essayé de forcer une traversée du Po à Occhiobello les 8-9 avril, la principale armée autrichienne sous le général Frimont l’a renvoyé avec plus de 2000 victimes. La Grande-Bretagne a déclaré la guerre et envoyé une flotte. Le 12 avril, les Autrichiens ont chassé les Néapolitains de leurs lignes avant Ferrare, et quelques jours plus tard Murat a ordonné une retraite générale."
