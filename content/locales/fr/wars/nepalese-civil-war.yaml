# French translations of the catalogue text (wave 8); step bodies follow later.
Nepalese Civil War: Guerre civile népalaise
The armed rebellion of the Communist Party of Nepal (Maoist), which launched a “People’s War” against the constitutional monarchy in 1996 from the hills of the mid-west. Drawing on rural poverty and caste and ethnic exclusion, the Maoists spread their control over much of the countryside. After the royal massacre of 2001 the army was sent in and the war grew much bloodier, with large attacks on district towns, extrajudicial killings and disappearances. King Gyanendra’s seizure of absolute power in 2005 drove the parliamentary parties into an alliance with the Maoists; a popular uprising in April 2006 forced him to restore parliament, and the Comprehensive Peace Accord of November 2006 ended the war. More than 17,000 people were killed and about 1,300 disappeared. The Maoists entered the government, and in 2008 an elected assembly abolished the monarchy.: La rébellion armée du Parti communiste du Népal (maoïste), qui lança en 1996, depuis les collines du Moyen-Ouest, une « guerre populaire » contre la monarchie constitutionnelle. S’appuyant sur la pauvreté rurale et sur l’exclusion fondée sur la caste et l’appartenance ethnique, les maoïstes étendirent leur contrôle sur une grande partie des campagnes. Après le massacre de la famille royale en 2001, l’armée fut engagée et la guerre devint beaucoup plus sanglante, marquée par de grandes attaques contre des chefs-lieux de district, des exécutions extrajudiciaires et des disparitions. La prise du pouvoir absolu par le roi Gyanendra en 2005 poussa les partis parlementaires à s’allier aux maoïstes ; un soulèvement populaire en avril 2006 le contraignit à rétablir le Parlement, et l’accord de paix global de novembre 2006 mit fin à la guerre. Plus de 17 000 personnes furent tuées et environ 1 300 disparurent. Les maoïstes entrèrent au gouvernement et, en 2008, une assemblée élue abolit la monarchie.
