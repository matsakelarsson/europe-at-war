# French translations of the catalogue text (wave 8); step bodies follow later.
Nepalese revolution of 1950–1951: Révolution népalaise de 1950–1951
The rising that ended the rule of the Rana family, hereditary prime ministers who had governed Nepal since 1846 while the Shah kings were kept as figureheads. On 6 November 1950 King Tribhuvan took refuge in the Indian embassy in Kathmandu and was flown to Delhi four days later; the Ranas declared his three-year-old grandson Gyanendra king. On 11 November the Liberation Army of the Nepali Congress, formed in India by B. P. Koirala and others, attacked from across the Indian border and took Birgunj, and fighting spread to the Terai towns and the hills of the east and west, where some local garrisons and officials went over to the rebels. Under Indian pressure the Rana prime minister, Mohan Shumsher, accepted a settlement negotiated in Delhi. Tribhuvan returned to Kathmandu on 15 February 1951 and on 18 February proclaimed a new order under a coalition of Ranas and the Nepali Congress, with elections promised.: Le soulèvement qui mit fin au pouvoir de la famille Rana, Premiers ministres héréditaires qui gouvernaient le Népal depuis 1846 en ne laissant aux rois Shah qu’un rôle de façade. Le 6 novembre 1950, le roi Tribhuvan se réfugia à l’ambassade de l’Inde à Katmandou et fut emmené par avion à Delhi quatre jours plus tard ; les Rana proclamèrent roi son petit-fils Gyanendra, âgé de trois ans. Le 11 novembre, l’Armée de libération du Congrès népalais, formée en Inde par B. P. Koirala et d’autres, attaqua depuis l’autre côté de la frontière indienne et prit Birgunj, et les combats s’étendirent aux villes du Teraï et aux collines de l’est et de l’ouest, où certaines garnisons et certains fonctionnaires locaux passèrent aux rebelles. Sous la pression de l’Inde, le Premier ministre rana, Mohan Shumsher, accepta un règlement négocié à Delhi. Tribhuvan revint à Katmandou le 15 février 1951 et proclama le 18 février un nouvel ordre fondé sur une coalition des Rana et du Congrès népalais, avec la promesse d’élections.
