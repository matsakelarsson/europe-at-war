# French translations of the catalogue text (wave 11); step bodies follow later.
New People’s Army rebellion: Rébellion de la Nouvelle Armée du peuple
? "The Maoist “people’s war” of the Communist Party of the Philippines (CPP) and its New People’s Army (NPA), one of the longest communist insurgencies in the world. Re-founded in December 1968 by José Maria Sison, the party formed the NPA on 29 March 1969 in Tarlac with a few dozen fighters. Under Ferdinand Marcos’s martial law (1972–1981) it grew into a guerrilla army of perhaps 25,000 by the mid-1980s, active in most provinces, while bloody internal purges and the end of the dictatorship in 1986 began its decline. A split in 1992, decades of on-and-off peace talks with Norway as facilitator, a terrorist designation by the government in 2017 and sustained military pressure reduced it to a few thousand and then, by government counts, to a few hundred fighters in scattered remnants. Estimates of the dead since 1969 run to about 40,000. Last updated 27 November 2026: the government says the NPA has been all but defeated and refuses to resume talks, the CPP insists its armed struggle continues, and clashes still occur, notably in Negros."
: "La « guerre populaire » maoïste du Parti communiste des Philippines (PCP) et de sa Nouvelle Armée du peuple (NPA), l’une des plus longues insurrections communistes au monde. Refondé en décembre 1968 par José Maria Sison, le parti forma la NPA le 29 mars 1969 à Tarlac avec quelques dizaines de combattants. Sous la loi martiale de Ferdinand Marcos (1972–1981), elle devint une armée de guérilla forte de peut-être 25 000 combattants au milieu des années 1980, active dans la plupart des provinces, tandis que de sanglantes purges internes et la fin de la dictature en 1986 amorcèrent son déclin. Une scission en 1992, des décennies de pourparlers de paix intermittents avec la Norvège pour facilitatrice, son classement comme organisation terroriste par le gouvernement en 2017 et une pression militaire soutenue la réduisirent à quelques milliers de combattants, puis, selon les décomptes gouvernementaux, à quelques centaines, répartis en vestiges épars. Les estimations des morts depuis 1969 atteignent environ 40 000. Dernière mise à jour le 27 novembre 2026 : le gouvernement affirme que la NPA est pratiquement vaincue et refuse de reprendre les pourparlers, le PCP soutient que sa lutte armée se poursuit, et des affrontements ont toujours lieu, notamment à Negros."
