# French translations of the catalogue text (wave 14); step bodies follow later.
Nez Perce War: Guerre des Nez-Percés
? The war of June–October 1877 between the non-treaty bands of the Nez Perce (Nimiipuu), with a small band of Palouse, and the United States Army, a fighting retreat of about 1,900 km from Idaho to within 64 km of the Canadian border. The treaty of 1855 had left the Nez Perce a reservation of some 7.5 million acres, but after gold was found on it the treaty of 1863, signed by leaders of other bands, cut it by nine-tenths. The bands that had not signed, among them the Wallowa band of Joseph (Hinmatóowyalahtqit) and his brother Ollokot, refused to leave their land, and in May 1877 General Oliver Otis Howard ordered them onto the reservation within thirty days. On 14–15 June young men of White Bird’s band killed settlers on the Salmon River in revenge for earlier killings, and on 17 June the Nez Perce routed the troops sent against them at White Bird Canyon. After the battle of the Clearwater some 750 people, about 250 of them fighting men, crossed the Lolo Trail into Montana with more than 2,000 horses, hoping for help from the Crow. At the Big Hole on 9 August Colonel John Gibbon’s troops attacked their sleeping camp, killing many women and children, but the warriors held the soldiers off while the camp escaped. The Nez Perce crossed Yellowstone National Park and, refused by the Crow, turned north to join Sitting Bull in Canada, but Colonel Nelson Miles caught them at the Bears Paw Mountains on 30 September. After a five-day siege Joseph surrendered on 5 October 1877, while White Bird and some 150 to 200 others escaped to Canada. The 418 who surrendered were sent not home, as Miles had promised, but to Kansas and Indian Territory; in 1885 the 268 survivors were allowed back to the Northwest.
: "La guerre de juin à octobre 1877 qui opposa les bandes non signataires des Nez-Percés (Nimiipuu), avec une petite bande de Palouses, à l’armée des États-Unis : une retraite combattante d’environ 1 900 km, depuis l’Idaho jusqu’à 64 km de la frontière canadienne. Le traité de 1855 avait laissé aux Nez-Percés une réserve d’environ 7,5 millions d’acres, mais après la découverte d’or sur ces terres, le traité de 1863, signé par des chefs d’autres bandes, la réduisit des neuf dixièmes. Les bandes non signataires, parmi lesquelles la bande de la Wallowa de Joseph (Hinmatóowyalahtqit) et de son frère Ollokot, refusèrent de quitter leurs terres et, en mai 1877, le général Oliver Otis Howard leur ordonna de rejoindre la réserve dans un délai de trente jours. Les 14 et 15 juin, de jeunes hommes de la bande de White Bird tuèrent des colons sur la Salmon River pour venger des meurtres antérieurs et, le 17 juin, les Nez-Percés mirent en déroute à White Bird Canyon les troupes envoyées contre eux. Après la bataille de la Clearwater, quelque 750 personnes, dont environ 250 combattants, franchirent la piste Lolo vers le Montana avec plus de 2 000 chevaux, dans l’espoir d’obtenir l’aide des Crows. À Big Hole, le 9 août, les troupes du colonel John Gibbon attaquèrent leur camp endormi, tuant de nombreuses femmes et de nombreux enfants, mais les guerriers tinrent les soldats en respect pendant que le camp s’échappait. Les Nez-Percés traversèrent le parc national de Yellowstone puis, éconduits par les Crows, se dirigèrent vers le nord pour rejoindre Sitting Bull au Canada, mais le colonel Nelson Miles les rattrapa dans les monts Bears Paw le 30 septembre. Après un siège de cinq jours, Joseph se rendit le 5 octobre 1877, tandis que White Bird et quelque 150 à 200 autres personnes s’enfuyaient au Canada. Les 418 personnes qui s’étaient rendues furent envoyées non pas chez elles, comme Miles l’avait promis, mais au Kansas et dans le territoire indien ; en 1885, les 268 survivants furent autorisés à revenir dans le Nord-Ouest."
