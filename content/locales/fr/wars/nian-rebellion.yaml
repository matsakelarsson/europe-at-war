# French translations of the catalogue text (wave 9); step bodies follow later.
Nian Rebellion: Rébellion des Nian
A rising of armed bands, the Nian, in the Huaibei region of northern Anhui and the neighbouring parts of Henan, Shandong and Jiangsu, at the same time as the Taiping Rebellion. Poverty, raiding and the disastrous floods of the Yellow River, which broke its banks in 1851 and changed its course to the north in 1855, swelled the bands, which raided far and wide from fortified villages. In 1856 they formed an alliance under Zhang Lexing, who accepted titles from the Taiping. The Mongol general Senggelinqin defeated and executed Zhang in 1863, but Taiping veterans reorganised the Nian as a fast-moving cavalry army that killed Senggelinqin in 1865. Zeng Guofan’s strategy of hemming them in with fortified river lines was carried through by Li Hongzhang and Zuo Zongtang, and in 1868 the Eastern Nian were destroyed in Shandong and Jiangsu and the Western Nian, after a raid towards Beijing, in north-western Shandong.: Un soulèvement de bandes armées, les Nian, dans la région du Huaibei, au nord de l’Anhui, et dans les régions voisines du Henan, du Shandong et du Jiangsu, à l’époque de la révolte des Taiping. La pauvreté, les razzias et les crues désastreuses du fleuve Jaune, qui rompit ses digues en 1851 et déplaça son cours vers le nord en 1855, grossirent les bandes, qui razziaient au loin depuis des villages fortifiés. En 1856, elles formèrent une alliance sous Zhang Lexing, qui accepta des titres des Taiping. Le général mongol Senggelinqin vainquit et exécuta Zhang en 1863, mais des vétérans taiping réorganisèrent les Nian en une armée de cavalerie très mobile qui tua Senggelinqin en 1865. La stratégie de Zeng Guofan, qui consistait à les enfermer derrière des lignes fluviales fortifiées, fut menée à bien par Li Hongzhang et Zuo Zongtang, et en 1868 les Nian de l’Est furent anéantis au Shandong et au Jiangsu, et les Nian de l’Ouest, après un raid en direction de Pékin, dans le nord-ouest du Shandong.
