"1246–1261": "1246–1261"
"Vatatzes took Thessalonica in 1246 and much of Macedonia from Bulgaria and Epirus. In 1258 the general Michael Palaiologos became regent for the boy emperor John IV Laskaris, and soon co-emperor. Against him gathered Michael II of Epirus, William II of Villehardouin, prince of Achaea, and Manfred of Sicily, who sent German knights. In 1259 the Nicaean army under Michael’s brother John Palaiologos met them at Pelagonia in western Macedonia. The allies fell out, Michael II and his son left the field, and the Nicaeans destroyed the Achaean and German knights. William was captured and in 1262 gave up the fortresses of Mistras, Monemvasia and Maina as his ransom.": "En 1258, le général Michael Palaiologos devint régent pour l’empereur Jean IV Laskaris, et bientôt co-empereur. Contre lui rassembla Michel II d’Epire, Guillaume II de Villehardouin, prince d’Achée, et Manfred de Sicile, qui envoya des chevaliers allemands. En 1259, l’armée nicaïenne sous le commandement de Michael John Palaiologos les rencontra à Pelagonie dans l’ouest de la Macédoine. Les alliés s’éteignirent, Michel II et son fils quittèrent le champ, et les Nicéens détruisirent les chevaliers achaéens et allemands. William fut capturé et, en 1262, abandonna les forteresses de Mistras, Monemvasia et Maina comme rançon."
"Constantinople, held by a small Latin garrison and the Venetian fleet, was now isolated. In March 1261 Michael VIII allied with Genoa, Venice’s rival, by the Treaty of Nymphaeum. In July the general Alexios Strategopoulos, passing near the city with some 800 soldiers, learned that the Venetian fleet and much of the garrison had sailed to attack the Nicaean-held island of Daphnousia in the Black Sea. On the night of 24–25 July his men slipped in through a passage near the Gate of the Spring and opened the gates, and the city was taken almost without a fight. Baldwin II fled on a Venetian ship. Michael VIII entered Constantinople on 15 August 1261.": "Constantinople, tenu par une petite garnison latine et la flotte vénitienne, a été maintenant isolé. En mars 1261 Michel VIII allié avec Gênes, Venise rivaux, par le traité de Nymphaeum. En juillet, le général Alexios Strategopoulos, en passant près de la ville avec quelque 800 soldats, a appris que la flotte vénitienne et une grande partie de la garnison avaient navigué pour attaquer l’île de Daphnousia tenue par les Nicées dans la mer Noire. Dans la nuit du 24 au 25 juillet, ses hommes ont glissé à travers un passage près de la porte du printemps et ouvert les portes, et la ville a été prise presque sans combat. Baldwin II s’enfuit sur un navire vénitien. Michael VIII entra Constantinople le 15 août 1261."
