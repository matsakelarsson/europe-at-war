"1204–1225": "1204–1225"
"After 1204 Theodore Laskaris built a Byzantine state in exile at Nicaea, and in 1208 he was crowned emperor. The Latins, who claimed north-western Asia Minor, beat him at Poimanenon in 1204 and on the Rhyndacus in 1211, just after he had defeated the Seljuks of Rum at Antioch on the Meander, where their sultan was killed. The Treaty of Nymphaeum of 1214 divided the region, leaving the Latins the coast from Nicomedia to Adramyttion. When Theodore died in 1221, his son-in-law John III Doukas Vatatzes succeeded him.": "Après 1204 Theodore Laskaris a construit un État byzantin en exil à Nicée, et en 1208 il a été couronné empereur. Les latins, qui ont réclamé l’Asie Mineure du nord-ouest, le battent à Poimanenon en 1204 et sur le Rhyndacus en 1211, juste après avoir vaincu les Seljuks de rhum à Antioche sur le Meander, où leur sultan a été tué. Le traité de Nymphaeum de 1214 divise la région, laissant les Latins la côte de Nicomedia à Adramyttion. Quand Theodore meurt en 1221, son gendre Jean III Doukas Vatatzes lui succède."
"Theodore’s brothers Alexios and Isaac Laskaris, who had opposed the succession, fled to the Latins, and in 1224 a Latin army marched with them against Vatatzes. At Poimanenon, south of Cyzicus, Vatatzes won a decisive victory, and the two brothers were captured and blinded. In the peace of 1225 the Latins gave up all their lands in Asia except the shore opposite Constantinople and the region of Nicomedia. The Nicaean fleet took Lesbos, Chios, Samos and other islands, and Nicaean troops entered Adrianople, but had to hand it over to Theodore Komnenos Doukas of Epirus, who had taken Thessalonica in 1224.": "Les frères Théodores Alexios et Isaac Laskaris, qui s’étaient opposés à la succession, ont fui vers les Latins, et en 1224 une armée latine a marché avec eux contre Vatatzes. À Poimanenon, au sud de Cyzicus, Vatatzes a remporté une victoire décisive, et les deux frères ont été capturés et aveuglés. Dans la paix de 1225, les Latins abandonnèrent toutes leurs terres en Asie, à l’exception de la rive située en face de Constantinople et de la région de Nicomedia. La flotte nicaéenne prit Lesbos, Chios, Samos et d’autres îles, et les troupes nicaéennes entrèrent dans Adrianople, mais durent le remettre à Theodore Komnenos Doukas d’Epirus, qui avait pris Thessalonique en 1224."
