"1230–1237": "1230–1237"
"After Ivan Asen II of Bulgaria crushed Theodore of Epirus at Klokotnitsa in 1230, Bulgaria was the strongest power in the Balkans. The Latin barons, who had hinted that Asen might become regent for their boy emperor Baldwin II, chose instead the aged John of Brienne, a former king of Jerusalem, as co-emperor. In 1235 Asen allied with Vatatzes. Asen’s daughter married Vatatzes’s son, the Bulgarian Church was recognised as a patriarchate, and Vatatzes crossed into Europe and took Gallipoli and the Latin lands in Thrace.": "Après que Ivan Asen II de Bulgarie a écrasé Théodore d’Epirus à Klokotnitsa en 1230, la Bulgarie était le pouvoir le plus fort dans les Balkans. Les barons latins, qui avaient laissé entendre qu’Asen pourrait devenir régent pour leur garçon empereur Baldwin II, ont choisi plutôt le vieux Jean de Brienne, un ancien roi de Jérusalem, comme co-Empereur. La fille d’Asen, qui épousa Vatatzes, le fils de l’Église bulgare, fut reconnue patriarcat.Vatatzes passa en Europe et prit Gallipoli et les terres latines de Thrace."
"In 1235 and again in 1236 the allies besieged Constantinople by land and sea. John of Brienne, with a few hundred knights, held the walls, and fleets from Venice, Achaea, Genoa and Pisa broke the Nicaean blockade and destroyed many of its ships. Asen, who had come to fear that a Nicaean Constantinople would be a stronger neighbour than a Latin one, changed sides in 1237, then made peace with Vatatzes again. The Latin Empire survived, but it was now little more than the city itself, kept alive by Venetian ships and Western money; Baldwin II pawned the Crown of Thorns and even his own son to Venetian merchants.": "En 1235 et de nouveau en 1236 les alliés assiégeaient Constantinople par terre et par mer. Jean de Brienne, avec quelques centaines de chevaliers, tenait les murs, et des flottes de Venise, Achée, Gênes et Pise brisèrent le blocus nicaéen et détruisirent beaucoup de ses navires. Asen, qui était venu à craindre qu’un Constantinople nicaéen soit un voisin plus fort que le Latin, changea de camp en 1237, puis fit la paix avec Vatatzes. L’Empire latin survécut, mais il était maintenant peu plus que la ville elle-même, maintenu en vie par les navires vénitiens et l’argent occidental ; Baldwin II pionna la couronne de Thorns et même son propre fils aux marchands vénitiens."
