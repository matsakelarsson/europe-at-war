"Nicaean–Latin wars": "Guerres nicaéennes et latines"
"The long struggle between the Empire of Nicaea, the main Byzantine successor state, and the Latin Empire of Constantinople. After early Latin successes, John III Vatatzes beat the Latins at Poimanenon in 1224 and drove them from Asia Minor; with Bulgaria he besieged Constantinople in vain in 1235–1236. Michael VIII Palaiologos defeated the Latins of Greece and their allies at Pelagonia in 1259, and his general Alexios Strategopoulos took Constantinople almost without a fight on 25 July 1261, restoring the Byzantine Empire.": "La longue lutte entre l’Empire de Nicée, le principal État successeur byzantin, et l’empire latin de Constantinople. Après les premiers succès latins, Jean III Vatatzes battait les Latins à Poimanon en 1224 et les chassait d’Asie Mineure ; avec la Bulgarie il assiégea Constantinople en vain en 1235–1236. Michael VIII Palaiologis battit les Latins de Grèce et leurs alliés à Pelagonie en 1259, et son général Alexios Strategopoulos prit Constantinople presque sans se battre le 25 juillet 1261, rétablissant l’Empire byzantin."
"On the map the Empire of Nicaea is shown as the continuation of the Byzantine Empire, which is how it saw itself. The main source is the Nicaean official George Akropolites, who was taken prisoner by the Epirotes and later served Michael VIII.": "Sur la carte l’Empire de Nicée est montré comme la continuation de l’empire byzantin, qui est comment il a vu lui-même. La principale source est l’officiel nicaïen George Akropolites, qui a été fait prisonnier par les Epirotes et plus tard servi Michael VIII."
"Alliances shifted constantly. Bulgaria fought both Nicaea and the Latins at different times, and Epirus was a rival of Nicaea for the Byzantine inheritance; the battle of Klokotnitsa (1230) has its own entry.": "Les alliances se sont déplacées constamment. La Bulgarie a combattu à la fois Nicée et les Latins à différents moments, et Epirus était un rival de Nicée pour l’héritage byzantine ; la bataille de Klokotnitsa (1230) a sa propre entrée."
