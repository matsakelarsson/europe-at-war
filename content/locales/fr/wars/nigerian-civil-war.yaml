# French translations of the catalogue text (wave 13); step bodies follow later.
Nigerian Civil War: Guerre civile nigériane
? The war between the Federal Military Government of Nigeria and the Republic of Biafra, the state proclaimed by the former Eastern Region, also called the Biafran War. Two coups in 1966 and the massacres of thousands of Igbo and other easterners in the North that year drove the east, led by its military governor Lieutenant Colonel Odumegwu Ojukwu, to break away; Ojukwu declared Biafra independent on 30 May 1967, three days after the federal head of state, Lieutenant Colonel Yakubu Gowon, divided the region into three states. Federal troops attacked in July 1967. A Biafran thrust into the Midwest reached Ore, within about 210 km of Lagos, in August, but was driven back, and the federal army took Enugu, Calabar, Onitsha and, in May 1968, Port Harcourt, cutting Biafra off from the sea. Under a federal blockade the shrinking enclave suffered a famine that relief flights to the airstrip at Uli could only partly relieve; most of the war’s dead were civilians who died of hunger and disease, with estimates ranging from about 500,000 to 3 million. A final federal offensive in January 1970 broke Biafra’s resistance; Ojukwu left for Côte d’Ivoire, and his deputy, Philip Effiong, surrendered in Lagos on 15 January 1970.
: La guerre, appelée aussi guerre du Biafra, qui opposa le gouvernement militaire fédéral du Nigeria à la république du Biafra, l’État proclamé par l’ancienne région de l’Est. Deux coups d’État en 1966 et les massacres, cette année-là, de milliers d’Igbo et d’autres originaires de l’Est dans le Nord poussèrent l’Est, mené par son gouverneur militaire, le lieutenant-colonel Odumegwu Ojukwu, à faire sécession ; Ojukwu proclama l’indépendance du Biafra le 30 mai 1967, trois jours après que le chef de l’État fédéral, le lieutenant-colonel Yakubu Gowon, eut divisé la région en trois États. Les troupes fédérales attaquèrent en juillet 1967. Une offensive biafraise dans le Centre-Ouest atteignit Ore, à environ 210 km de Lagos, en août, mais fut repoussée, et l’armée fédérale prit Enugu, Calabar, Onitsha et, en mai 1968, Port Harcourt, coupant le Biafra de la mer. Soumise à un blocus fédéral, l’enclave, de plus en plus réduite, connut une famine que les vols humanitaires vers la piste d’Uli ne purent soulager qu’en partie ; la plupart des morts de la guerre furent des civils emportés par la faim et la maladie, et les estimations vont d’environ 500 000 à 3 millions. Une dernière offensive fédérale, en janvier 1970, brisa la résistance du Biafra ; Ojukwu partit pour la Côte d’Ivoire, et son adjoint, Philip Effiong, capitula à Lagos le 15 janvier 1970.
