# French translations of the catalogue text (wave 11); step bodies follow later.
Nine Armies War (Burmese–Siamese War of 1785–1787): Guerre des Neuf Armées (guerre birmano-siamoise de 1785–1787)
? "King Bodawpaya’s attempt to conquer Siam, three years after Rama I had founded Bangkok and the Chakri dynasty. Fresh from the conquest of Arakan, Bodawpaya sent nine armies, about 144,000 men by the count of the Thai chronicles, against Siam from five directions in the dry season of 1785–1786: through the Three Pagodas Pass to Kanchanaburi, by the Bong Ti pass to Ratchaburi, from Chiang Saen against Lampang, through Tak into the upper Chao Phraya valley, and by sea against Thalang and the peninsula. The Siamese, outnumbered, concentrated their forces against the main army. Rama I’s brother, the Front Palace prince Maha Sura Singhanat, held the Burmese at Lat Ya, the old site of Kanchanaburi, cut their supply lines and broke them on 18 February 1786; on 21 February Bodawpaya ordered a general retreat. Lampang held under Kawila until relieved, the Burmese were beaten at Pakphing in March, and on Phuket the widow Chan and her sister Muk led the defence of Thalang until the Burmese withdrew on 13 March 1786. A second, smaller invasion under the crown prince Thado Minsaw was defeated at Tha Din Daeng and Samsop near the Three Pagodas Pass in early 1787. These were the last full-scale Burmese invasions of Siam, though the war left the western borderlands depopulated for decades."
: "La tentative du roi Bodawpaya de conquérir le Siam, trois ans après que Rama Ier eut fondé Bangkok et la dynastie Chakri. Fort de sa conquête de l’Arakan, Bodawpaya lança contre le Siam neuf armées, environ 144 000 hommes selon le décompte des chroniques thaïes, venues de cinq directions pendant la saison sèche de 1785–1786 : par le col des Trois Pagodes vers Kanchanaburi, par le col de Bong Ti vers Ratchaburi, depuis Chiang Saen contre Lampang, par Tak dans la haute vallée de la Chao Phraya, et par la mer contre Thalang et la péninsule. Les Siamois, en infériorité numérique, concentrèrent leurs forces contre l’armée principale. Le frère de Rama Ier, le prince du Palais de l’Avant Maha Sura Singhanat, arrêta les Birmans à Lat Ya, l’ancien site de Kanchanaburi, coupa leurs lignes de ravitaillement et les mit en déroute le 18 février 1786 ; le 21 février, Bodawpaya ordonna une retraite générale. Lampang tint sous Kawila jusqu’à l’arrivée des secours, les Birmans furent battus à Pakphing en mars, et à Phuket la veuve Chan et sa sœur Muk dirigèrent la défense de Thalang jusqu’au retrait des Birmans, le 13 mars 1786. Une seconde invasion, plus modeste, menée par le prince héritier Thado Minsaw, fut repoussée à Tha Din Daeng et à Samsop, près du col des Trois Pagodes, au début de 1787. Ce furent les dernières invasions birmanes de grande envergure du Siam, même si la guerre laissa les marches occidentales dépeuplées pendant des décennies."
