"1602": "1602"
"Nine Years’ War in Ireland": "Neuf ans de guerre en Irlande"
"A war between a confederacy of Gaelic Irish lords, led by Hugh O’Neill, Earl of Tyrone, and Hugh Roe O’Donnell, and the English crown, which was extending its rule into Ulster, the last part of Ireland under Gaelic lordship. The Irish won at Clontibret and the Yellow Ford, but after Lord Mountjoy’s scorched-earth campaign and the defeat of the Irish and their Spanish allies at Kinsale in 1601, O’Neill submitted at Mellifont in 1603, completing the Tudor conquest of Ireland.": "Une guerre entre une confédération de seigneurs gaéliques irlandais, dirigée par Hugh O-Neill, comte de Tyrone, et Hugh Roe O-Donnell, et la couronne anglaise, qui étendait sa domination à Ulster, la dernière partie d’Irlande sous lordage gaélique. Les Irlandais ont gagné à Clontibret et la Ford jaune, mais après la campagne de lord Mountjoys terre brûlée et la défaite des Irlandais et de leurs alliés espagnols à Kinsale en 1601, O.Neill a soumis à Mellifont en 1603, complétant la conquête tudor de l’Irlande."
"Also called Tyrone’s Rebellion. Dates are Old Style, as used by the English in Ireland; the Spanish at Kinsale used the Gregorian calendar, ten days ahead, so the battle there is also dated 3 January 1602.": "Aussi appelé Rébellion Tyrone. Dates sont vieux style, comme utilisé par les Anglais en Irlande ; l’espagnol à Kinsale a utilisé le calendrier grégorien, dix jours avant, donc la bataille il est également daté 3 Janvier 1602."
"The war began with Hugh Maguire’s rising in Fermanagh in 1593; O’Neill joined openly only in 1595. It was also part of the wider Anglo-Spanish War of 1585–1604.": "La guerre a commencé avec Hugh Maguire, qui s’est levé à Fermanagh en 1593 ; O-Neill n’a rejoint ouvertement qu’en 1595."
