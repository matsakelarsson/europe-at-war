"After Kinsale the confederacy fell apart. In the south Sir George Carew took Dunboy, the O’Sullivan castle on Bantry Bay, in June 1602 and hanged most of its defenders. In midwinter Donal Cam O’Sullivan Beare led about 1,000 of his people north from Glengarriff, fighting off attacks across Munster and Connacht, to O’Rourke’s country in Leitrim; about 35 arrived. In Ulster Mountjoy’s armies burned crops, killed cattle and broke the stone chair at Tullaghoge on which the O’Neills had been inaugurated. Famine killed many thousands, and O’Neill retreated into the woods of Glenconkeyne.": "Après que Kinsale la confédération s’est effondrée. Dans le sud sir George Carew a pris Dunboy, le château O-Sullivan sur Bantry Bay, en juin 1602 et pendu la plupart de ses défenseurs. Au milieu de l’hiver, Donal Cam O-Sullivan Beare conduisit environ 1 000 de ses habitants au nord de Glengarriff, combattant les attaques contre Munster et Connacht, au pays d’O-Rourke à Leitrim ; environ 35 sont arrivés. La famine a tué des milliers de personnes, et O=Neill s’est retiré dans les bois de Glenconkeyne."
"On 30 March 1603, at Mellifont Abbey near Drogheda, O’Neill submitted to Mountjoy, not knowing that Elizabeth had died six days before. The terms were lenient. He kept most of his lands as Earl of Tyrone but gave up the Gaelic title of The O’Neill and his power over lesser lords, and Ulster came under English law and sheriffs, completing the Tudor conquest of Ireland. In 1607 O’Neill, O’Donnell’s brother and other northern lords left for the Continent in the Flight of the Earls, and their lands were confiscated for the Plantation of Ulster.": "Le 30 mars 1603, à l’abbaye de Mellifont près de Drogheda, O. Neill se présenta à Mountjoy, ne sachant pas qu’Elizabeth était morte six jours auparavant. Il conserva la plupart de ses terres comme comte de Tyrone mais abandonna le titre gaélique de The O-Neill et son pouvoir sur les petits seigneurs, et Ulster tomba sous la loi anglaise et les shérifs, finissant la conquête de Tudor de l’Irlande. En 1607, le frère et d’autres seigneurs du nord de l’O.Donnellill partirent pour le continent dans la fuite des comtes, et leurs terres furent confisquées pour la plantation d’Ulster."
