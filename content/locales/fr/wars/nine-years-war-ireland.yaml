"After the Tudor conquest of Munster and Connacht, English sheriffs, garrisons and officials pressed into Ulster, the last region still ruled by Gaelic lords. In 1593 Hugh Maguire of Fermanagh rose against a newly appointed sheriff, and in August 1594 his men ambushed a column bringing supplies to the English garrison of Enniskillen. Hugh O’Neill, Earl of Tyrone, brought up at the English court but the most powerful lord in Ulster, kept in the background while he trained a modern army of musketeers and pikemen. In 1595 he joined openly with Hugh Roe O’Donnell, lord of Tír Chonaill, and in May ambushed Sir Henry Bagenal’s column at Clontibret.": "Après la conquête Tudor de Munster et Connacht, les shérifs anglais, les garnisons et les fonctionnaires ont pressé dans Ulster, la dernière région encore gouvernée par les seigneurs gaéliques. En 1593 Hugh Maguire de Fermanagh s’est levé contre un nouveau shérif, et en août 1594 ses hommes embusqué une colonne apportant des fournitures à la garnison anglaise d’Enniskillen. Hugh O-Neill, comte de Tyrone, élevé à la cour anglaise mais le seigneur le plus puissant d’Ulster, gardé dans l’arrière-plan pendant qu’il a formé une armée moderne de mousquetaires et de brochets. En 1595, il rejoint ouvertement Hugh Roe O-Donnell, seigneur de Tír Chonaill, et en mai embuscade Sir Henry Bagenal."
"Truces and talks alternated with fighting while O’Neill sought help from Spain. On 14 August 1598 Bagenal led about 4,000 men from Armagh to relieve the besieged Blackwater Fort. At the Yellow Ford O’Neill’s army cut the column apart; Bagenal was shot dead, a powder wagon exploded, and about 1,500 English soldiers were killed. It was the worst defeat English arms had suffered in Ireland. The fort surrendered, many lords who had stayed neutral joined O’Neill, and in October revolt swept through Munster. The English settlers there fled to the walled towns, among them the poet Edmund Spenser, whose castle at Kilcolman was burned.": "Le 14 août 1598, Bagenal conduisit environ 4 000 hommes d’Armagh pour soulager le fort assiégé de Blackwater. À l’armée de la Ford jaune O=Neill, l’armée coupa la colonne ; Bagenal fut abattu, un wagon à poudre explosé et environ 1 500 soldats anglais furent tués. C’était la pire défaite des armes anglaises en Irlande. Le fort s’est rendu, de nombreux seigneurs restés neutres se joignirent à O-Neill, et en octobre la révolte balaya Munster. Les colons anglais s’enfuirent dans les villes fortifiées, dont le poète Edmund Spenser, dont le château de Kilcolman fut brûlé."
