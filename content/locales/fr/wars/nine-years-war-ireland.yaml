"1599–1601": "1599–1601"
"In 1599 Elizabeth sent the Earl of Essex with the largest English army yet seen in Ireland, about 16,000 men. He spent months in Leinster and Munster while his troops dwindled through disease and desertion, and on 15 August O’Donnell destroyed a column at the Curlew Pass. Essex agreed a truce with O’Neill and went home against orders. His successor, Lord Mountjoy, who arrived in 1600, waged a different war. He planted garrisons deep in Ulster, at Derry on Lough Foyle and along the Blackwater, campaigned through the winter, and destroyed crops and cattle so as to starve the country into submission.": "En 1599, Elizabeth envoya le comte d’Essex avec la plus grande armée anglaise encore vue en Irlande, environ 16 000 hommes. Il passa des mois à Leinster et Munster pendant que ses troupes se mêlaient à la maladie et à la désertion, et le 15 août O-Donnell détruisit une colonne au col de Curlew. Essex accepta une trêve avec O-Neill et rentra chez lui contre ordre. Son successeur, Lord Mountjoy, qui est arrivé en 1600, a mené une guerre différente. Il a planté des garnisons au fond d’Ulster, à Derry sur Lough Foyle et le long de l’eau noire, a fait campagne pendant l’hiver, et détruit les récoltes et le bétail afin de mourir de faim dans la soumission du pays."
"In September 1601 about 3,500 Spanish soldiers under Juan del Águila landed at Kinsale, at the far end of Ireland from O’Neill’s country. Mountjoy besieged them, and O’Neill and O’Donnell marched the length of the island in winter to relieve the town. On 24 December 1601 their army was caught as it moved into position, and Mountjoy’s cavalry broke it. Del Águila surrendered on terms and sailed home with his men in early 1602. O’Donnell went to Spain to plead for more help and died there that September.": "En septembre 1601, environ 3 500 soldats espagnols sous Juan del Águila débarquèrent à Kinsale, à l’extrémité de l’Irlande du pays d’O-Neill. Mountjoy les assiégea, et O-Neill et O-Donnell marchèrent la longueur de l’île en hiver pour soulager la ville. Le 24 décembre 1601, leur armée est prise en position, et la cavalerie de Mountjoy. Del Águila s’est rendu à son domicile avec ses hommes au début de 1602. O-Donnell se rend en Espagne pour demander plus d’aide et y meurt en septembre."
