"1690–1692": "1690–1692"
"In the Spanish Netherlands, the main theatre of the war, Marshal Luxembourg crushed the allied army of the Prince of Waldeck at Fleurus on 1 July 1690. Nine days later Admiral Tourville’s fleet beat the Anglo-Dutch fleet off Beachy Head, where the Dutch squadron suffered most, and for a time France commanded the Channel. But William’s victory at the Boyne the next day secured Ireland for him. In 1691 Louis took Mons, and in June 1692 Namur, after a siege directed by Vauban.": "Aux Pays-Bas espagnols, théâtre principal de la guerre, le maréchal Luxembourg a écrasé l’armée alliée du prince de Waldeck à Fleurus le 1er juillet 1690. Neuf jours plus tard, la flotte de l’amiral Tourville a battu la flotte anglo-néerlandaise au large de Beachy Head, où l’escadron hollandais a souffert le plus, et pendant un certain temps la France a commandé la Manche. En 1691 Louis prit Mons, et en juin 1692 Namur, après un siège dirigé par Vauban."
"Louis planned to land James II in England with a French and Irish army in 1692. Tourville, ordered to fight whatever the odds, met a much larger Anglo-Dutch fleet under Edward Russell off Cape Barfleur on 29 May. He held it off, but in the retreat many of his ships were trapped, and at La Hogue on 2–4 June English boats burned twelve French ships of the line in sight of James and his army. The invasion was abandoned. On land Luxembourg beat William again at Steenkerque on 3 August 1692.": "Louis planifia de débarquer James II en Angleterre avec une armée française et irlandaise en 1692. Tourville, ordonné de combattre quelles que soient les chances, rencontra une flotte anglo-néerlandaise beaucoup plus grande sous Edward Russell au large du cap Barfleur le 29 mai. Il l’empêcha, mais dans la retraite plusieurs de ses navires furent piégés, et à La Hogue les 2-4 juin des bateaux anglais brûlèrent douze navires français de la ligne en vue de James et de son armée. L’invasion fut abandonnée. Sur terre, le Luxembourg battit à nouveau William à Steenkerque le 3 août 1692."
