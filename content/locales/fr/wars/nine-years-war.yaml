"1693–1697": "1693–1697"
"Luxembourg won his last great victory at Neerwinden (Landen) on 29 July 1693, one of the bloodiest battles of the century, and took Charleroi in October. But France was exhausted. The harvest failures of 1693–1694 caused a famine that killed perhaps 1.3 million people in France, and the navy turned from fleet battles to privateering. In 1695 William besieged Namur, defended by Marshal Boufflers, and took the citadel at the start of September. To draw him off, Marshal Villeroi bombarded Brussels on 13–15 August, destroying thousands of buildings around the Grand Place.": "Le Luxembourg remporte sa dernière grande victoire à Neerwinden (Landen) le 29 juillet 1693, l’une des batailles les plus sanglantes du siècle, et prend Charleroi en octobre. Mais la France est épuisée. L’échec de la récolte de 1693–1694 provoque une famine qui tue peut-être 1,3 million de personnes en France, et la marine passe des batailles de flotte au cortège. En 1695, William assiégea Namur, défendu par le maréchal Boufflers, et prit la citadelle au début du mois de septembre. Pour le tirer, le maréchal Villeroi bombarda Bruxelles les 13-15 août, détruisant des milliers de bâtiments autour de la Grand Place."
"Savoy made a separate peace in 1696, and in 1697 the French took Ath and Barcelona. Peace talks met at Rijswijk near The Hague, and the Peace of Ryswick was signed on 20 September 1697 with the Dutch, England and Spain, and on 30 October with the Emperor. Louis recognised William as king, returned Luxembourg, Mons, Charleroi, Courtrai and the Catalan conquests to Spain, gave Lorraine back to its duke and gave up Freiburg, Breisach and Philippsburg on the right bank of the Rhine, but kept Strasbourg and the rest of Alsace. The Dutch won the right to garrison fortresses in the Spanish Netherlands.": "Savoy fit une paix séparée en 1696, et en 1697 les Français prirent Ath et Barcelone. Les pourparlers de paix se rencontrèrent à Rijswijk près de La Haye, et la Paix du Ryswick fut signée le 20 septembre 1697 avec les Hollandais, l’Angleterre et l’Espagne, et le 30 octobre avec l’empereur. Louis reconnut William comme roi, retourna le Luxembourg, Mons, Charleroi, Courtrai et les conquêtes catalanes en Espagne, remit la Lorraine à son duc et abandonna Fribourg, Breisach et Philippsburg sur la rive droite du Rhin, mais garda Strasbourg et le reste de l’Alsace. Les Hollandais remportèrent le droit de garnisonr des forteresses aux Pays-Bas espagnols."
