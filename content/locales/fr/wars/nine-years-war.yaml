# Some French text was translated automatically.
"Nine Years’ War": "Guerre de la Ligue d’Augsbourg"
"A war between Louis XIV’s France and a European coalition, the Grand Alliance, led by William III of the Dutch Republic and England, fought in the Spanish Netherlands, on the Rhine, in Italy and Catalonia, at sea, in Ireland and in North America. After the devastation of the Palatinate and years of costly sieges, the Peace of Ryswick in 1697 made France give back most of its gains since 1678, except Strasbourg, and recognise William as King of England.": "Une guerre entre Louis XIV et une coalition européenne, la Grande Alliance, dirigée par Guillaume III de la République néerlandaise et l’Angleterre, a combattu aux Pays-Bas espagnols, sur le Rhin, en Italie et en Catalogne, en mer, en Irlande et en Amérique du Nord. Après la dévastation du Palatinat et des années de siège coûteux, la paix du Ryswick en 1697 fit que la France redonne la plus grande partie de ses gains depuis 1678, à l’exception de Strasbourg, et reconnaît William comme roi d’Angleterre."
"Also called the War of the Grand Alliance, the War of the League of Augsburg and the War of the Palatine Succession. Its campaigns in Ireland (the Williamite War) and Scotland (the Jacobite rising of 1689) have their own entries; those in Italy, Catalonia and North America (King William’s War) are not shown here.": "Aussi appelé la guerre de la Grande Alliance, la guerre de la Ligue d’Augsbourg et la guerre de la Succession Palatine. Ses campagnes en Irlande (la Guerre Williamite) et en Écosse (le lever Jacobite de 1689) ont leurs propres entrées ; ceux en Italie, Catalogne et l’Amérique du Nord (la Guerre King Guillaume) ne sont pas montrés ici."
"Dates are New Style (Gregorian), as used on the Continent. English accounts give Old Style dates, ten days earlier; Beachy Head, for example, was 30 June 1690 Old Style.": "Les dates sont New Style (Gregorian), comme utilisé sur le Continent. Les comptes anglais donnent les dates Old Style, dix jours plus tôt ; Beachy Head, par exemple, était 30 Juin 1690 Old Style."
