"1688–1689": "1688–1689"
"Louis XIV wanted the Emperor, victorious against the Ottomans since the siege of Vienna, to turn the twenty-year Truce of Ratisbon into a permanent peace that would confirm the reunions, and he claimed part of the Palatinate for his sister-in-law, the Duchess of Orléans. In late September 1688 French armies crossed the Rhine, besieged Philippsburg, which fell on 30 October, and occupied Mainz, Heidelberg, Mannheim and much of the Rhineland, expecting a short war. Instead William of Orange sailed for England, and the German princes, the Emperor, the Dutch and England combined against France.": "Louis XIV voulait que l’empereur, vainqueur des Ottomans depuis le siège de Vienne, transforme la trêve de Ratisbon en une paix permanente qui confirmerait les retrouvailles, et il revendiqua une partie du Palatinat pour sa belle-soeur, la duchesse d’Orléans. Fin septembre 1688, les armées françaises traversent le Rhin, assiégé Philippsburg, qui tombe le 30 octobre, et occupent Mayence, Heidelberg, Mannheim et une grande partie de la Rhénanie, attendant une courte guerre. Au lieu de William d’Orange navigue pour l’Angleterre, et les princes allemands, l’empereur, les Hollandais et l’Angleterre se combinent contre la France."
"To deny the allied armies food and shelter, the war minister Louvois ordered the systematic destruction of the land the French could not hold. In the winter and spring of 1689 French troops burned Mannheim, Heidelberg, Speyer, Worms, Oppenheim and dozens of other towns and villages, driving out their people. The devastation united Germany against Louis and was remembered there for centuries. In May 1689 the Emperor and the Dutch formed the Grand Alliance, which England soon joined, and that year the allies beat a French army at Walcourt on 25 August, retook Mainz on 8 September and Bonn in October.": "Pour priver les armées alliées de nourriture et d’abri, le ministre de la guerre Louvois ordonna la destruction systématique du pays que les Français ne pouvaient tenir. L’hiver et le printemps de 1689, les troupes françaises brûlèrent Mannheim, Heidelberg, Speyer, Worms, Oppenheim et des dizaines d’autres villes et villages, chassant leur peuple. En mai 1689, l’Empereur et les Hollandais formèrent la Grande Alliance, que l’Angleterre rejoignit bientôt, et cette année-là, les alliés battèrent une armée française à Walcourt le 25 août, reprirent Mayence le 8 septembre et Bonn en octobre."
