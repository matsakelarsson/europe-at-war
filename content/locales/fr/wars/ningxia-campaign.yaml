# French translations of the catalogue text (wave 9); step bodies follow later.
Ningxia campaign: Campagne de Ningxia
? A rising of the Ming garrison at Ningxia, on the Yellow River at the north-western frontier, put down after a siege of six months; it is counted as the first of the Wanli Emperor’s Three Great Campaigns. Its leading figure was Pubei, a Mongol chief from the Chahar who had gone over to the Ming at the end of the Jiajing reign (before 1567) with a few hundred followers and risen to be regional vice commander of Ningxia, with a guard of some 3,000 men. Long disputes over pay and supplies with the grand coordinator Dang Xin ended in late March 1592, when soldiers led by Liu Dongyang killed Dang Xin and took the city, with Pubei as their adviser and his son Bo Cheng’en as a deputy. The rebels, 20,000 to 30,000 strong, took 47 forts around Ningxia and brought in Ordos Mongols under Jorightu. Ming forces under Wei Xuezeng retook the forts but failed in assaults on the city in May and July, even after Li Rusong arrived with reinforcements at the end of July and Ye Mengxiong with artillery and Miao troops. Under Ye Mengxiong the besiegers then built a dike about 5 km long around the city and flooded it from September; an attempt by 18,000 Mongols to relieve it was driven off. On 12 October the water broke through the walls and Ming troops entered, and on 20 October 1592 the city was taken. The rebel leaders had already turned on each other; Pubei killed himself, and Bo Cheng’en surrendered and was executed. Many of the troops were then sent with Li Rusong to fight the Japanese in Korea.
: Un soulèvement de la garnison Ming de Ningxia, sur le fleuve Jaune, à la frontière nord-ouest, réprimé après un siège de six mois ; on le compte comme la première des trois grandes campagnes de l’empereur Wanli. Sa figure principale était Pubei, un chef mongol des Chahar passé aux Ming à la fin du règne de Jiajing (avant 1567) avec quelques centaines de partisans, et devenu vice-commandant régional de Ningxia, à la tête d’une garde d’environ 3 000 hommes. De longs différends sur la solde et le ravitaillement avec le grand coordinateur Dang Xin connurent leur dénouement fin mars 1592, lorsque des soldats menés par Liu Dongyang tuèrent Dang Xin et s’emparèrent de la ville, Pubei leur servant de conseiller et son fils Bo Cheng’en d’adjoint. Les rebelles, forts de 20 000 à 30 000 hommes, prirent 47 forts autour de Ningxia et firent venir les Mongols de l’Ordos de Jorightu. Les forces Ming de Wei Xuezeng reprirent les forts mais échouèrent dans leurs assauts contre la ville en mai et en juillet, même après l’arrivée de Li Rusong avec des renforts fin juillet, puis celle de Ye Mengxiong avec de l’artillerie et des troupes miao. Sous la direction de Ye Mengxiong, les assiégeants construisirent alors autour de la ville une digue d’environ 5 km de long et l’inondèrent à partir de septembre ; une tentative de 18 000 Mongols pour la secourir fut repoussée. Le 12 octobre, l’eau perça les murailles et les troupes Ming entrèrent, et le 20 octobre 1592 la ville fut prise. Les chefs rebelles s’étaient déjà retournés les uns contre les autres ; Pubei se donna la mort, et Bo Cheng’en se rendit et fut exécuté. Une grande partie des troupes fut ensuite envoyée avec Li Rusong combattre les Japonais en Corée.
