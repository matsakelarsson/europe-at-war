# Some French text was translated automatically.
"Ninth Crusade": "Neuvième croisade"
"The expedition of the Lord Edward, heir to the English throne and later Edward I, who reached Acre in May 1271 with about a thousand men after his uncle Louis IX died at Tunis. He raided Mamluk territory and tried to work with the Mongol Ilkhan Abaqa, whose horsemen raided around Aleppo, but could not stop Sultan Baibars, and in May 1272 the Kingdom of Jerusalem made a ten-year truce with him at Caesarea. Edward survived an assassin’s poisoned dagger in June 1272 and sailed home that September, learning on the way that his father had died.": "L’expédition du Lord Edward, héritier du trône anglais et plus tard d’Edward Ier, qui atteignit Acre en mai 1271 avec environ un millier d’hommes après la mort de son oncle Louis IX à Tunis. Il fit une descente sur le territoire de Mamelouk et tenta de travailler avec le Mongol Ilkhan Abaqa, dont les cavaliers firent une descente autour d’Alep, mais ne purent arrêter Sultan Baibars. En mai 1272, le Royaume de Jérusalem fit une trêve de dix ans avec lui à Césarée. Edward survécut à un assassin empoisonné poignardé en juin 1272 et rentra chez lui en septembre, apprenant comment son père était mort."
"The expedition is often counted as part of the Eighth Crusade. Its forces were too small to change the balance of power; the experience may have shaped Edward’s later wars in Wales and Scotland, where he used castles and crossbowmen much as the Franks of the east did.": "L’expédition est souvent comptée comme faisant partie de la huitième croisade. Ses forces étaient trop petites pour changer l’équilibre du pouvoir ; l’expérience peut avoir façonné Edwards guerres plus tard au Pays de Galles et en Écosse, où il a utilisé châteaux et arbalètes beaucoup comme les Franks de l’est."
