# French translations of the catalogue text (wave 10); step bodies follow later.
Nitanggae’s rebellion: Rébellion de Nitanggae
? A rising of the Jurchens of the Tumen valley against Joseon, the largest conflict on the northern frontier since the six garrisons were set up there in the 15th century. In early 1583 Ueulji, a Jurchen chief living under Korean protection, attacked the outpost of Asanbo, and with some ten thousand horsemen took and plundered the town of Gyeongwon and the forts around it. Sin Rip, the magistrate of Onseong, broke the siege of Hunyung and pursued the raiders across the Tumen. In the early summer Nitanggae, another chief settled at Hoeryeong, united several Jurchen groups and attacked Jongseong from three sides with perhaps twenty thousand men; the scattered Korean garrisons were overrun one by one, but Jongseong held with its firearms, and Nitanggae fell back when a rival chief raided his villages, then attacked Donggwan. Other Jurchen chiefs fought on the Korean side. Ueulji was captured and beheaded in the seventh lunar month and Nitanggae fled. The court punished the commanders who had lost Gyeongwon, and the experience led Joseon to replace its system of local garrison commands with the jeseung bangnyak, the gathering of provincial troops under commanders sent from the capital, which it used against Japan in 1592. Sin Rip, Yi Il and Yi Sun-sin all gained their first experience of war on this frontier.
: Un soulèvement des Jürchen de la vallée du Tumen contre Joseon, le plus grand conflit sur la frontière nord depuis l’établissement des six garnisons au XVe siècle. Au début de 1583, Ueulji, un chef jürchen vivant sous protection coréenne, attaqua l’avant-poste d’Asanbo et, avec quelque dix mille cavaliers, prit et pilla la ville de Gyeongwon et les forts environnants. Sin Rip, magistrat d’Onseong, brisa le siège de Hunyung et poursuivit les pillards au-delà du Tumen. Au début de l’été, Nitanggae, un autre chef établi à Hoeryeong, unit plusieurs groupes jürchen et attaqua Jongseong de trois côtés avec peut-être vingt mille hommes ; les garnisons coréennes dispersées furent submergées l’une après l’autre, mais Jongseong tint grâce à ses armes à feu, et Nitanggae se replia quand un chef rival attaqua ses villages, puis il s’en prit à Donggwan. D’autres chefs jürchen combattirent du côté coréen. Ueulji fut capturé et décapité au septième mois lunaire, et Nitanggae prit la fuite. La cour punit les commandants qui avaient perdu Gyeongwon, et l’expérience conduisit Joseon à remplacer son système de commandements de garnison locaux par le jeseung bangnyak, le regroupement des troupes provinciales sous des commandants envoyés de la capitale, qu’il employa contre le Japon en 1592. Sin Rip, Yi Il et Yi Sun-sin firent tous leurs premières armes sur cette frontière.
