# French translations of the catalogue text (wave 7); step bodies follow later.
Nizari–Seljuk conflict: Conflit entre Nizarites et Seldjoukides
The struggle between the Seljuk sultans and the Nizari Ismailis of Iran, led by Hasan-i Sabbah, who seized the mountain castle of Alamut in 1090 and built a state of scattered fortresses in the Alborz, in Quhistan and near Isfahan. A Seljuk army failed to take Alamut in 1092, and in the same year the vizier Nizam al-Mulk was killed, the first of the assassinations for which the Nizaris became notorious. They gained more castles during the Seljuk succession wars. Sultan Muhammad Tapar took Shahdiz near Isfahan in 1107 and laid waste the country around Alamut for years, but his siege of Alamut was abandoned when he died in 1118, and the Nizari state survived.: La lutte entre les sultans seldjoukides et les ismaéliens nizarites d’Iran, menés par Hasan-i Sabbah, qui s’empara en 1090 du château de montagne d’Alamut et bâtit un État fait de forteresses dispersées dans l’Elbourz, au Quhistan et près d’Ispahan. Une armée seldjoukide échoua à prendre Alamut en 1092 et, la même année, le vizir Nizam al-Mulk fut tué, premier des assassinats auxquels les Nizarites doivent leur sinistre réputation. Ils gagnèrent d’autres châteaux pendant les guerres de succession seldjoukides. Le sultan Muhammad Tapar prit Shahdiz, près d’Ispahan, en 1107 et dévasta pendant des années la région d’Alamut, mais le siège d’Alamut fut abandonné à sa mort en 1118, et l’État nizarite survécut.
