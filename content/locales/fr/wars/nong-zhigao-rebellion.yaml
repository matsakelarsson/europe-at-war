# French translations of the catalogue text (wave 9); step bodies follow later.
Nong Zhigao’s rebellion: Rébellion de Nong Zhigao
? The rising of Nong Zhigao (Nùng Trí Cao), a chief of the Tai-speaking Nong clan of the hills on today’s border between Guangxi and Vietnam, ancestors of the Zhuang and the Nùng. Caught between the Lý emperors of Đại Việt, who had killed his father and twice crushed his attempts to found a kingdom, and the Song, which refused to accept him as a vassal, he proclaimed the Kingdom of the Great South (Danan) in 1052. With a few thousand followers who had burned their own villages, he took Yongzhou (Nanning), swept down the West River and besieged Guangzhou, the greatest port of the Song, for 57 days with an army that had grown to some 50,000. Failing to take it, he fell back to Yongzhou and beat several Song armies sent against him. Early in 1053 the Song general Di Qing, a veteran of the wars with the Xia, crossed the Kunlun Pass by night and routed the rebels outside Yongzhou. Nong Zhigao fled to the Dali kingdom, where his fate is unknown; his mother and sons were captured and executed. He is honoured today as a hero by many Zhuang and Nùng.
: Le soulèvement de Nong Zhigao (Nùng Trí Cao), chef des Nong, clan de langue taï des collines de l’actuelle frontière entre le Guangxi et le Vietnam et ancêtres des Zhuang et des Nùng. Pris entre les empereurs Lý du Đại Việt, qui avaient tué son père et écrasé à deux reprises ses tentatives de fonder un royaume, et les Song, qui refusaient de l’accepter comme vassal, il proclama le royaume du Grand Sud (Danan) en 1052. Avec quelques milliers de partisans qui avaient brûlé leurs propres villages, il prit Yongzhou (Nanning), descendit le Xi Jiang et assiégea pendant 57 jours Canton, le plus grand port des Song, avec une armée qui comptait désormais quelque 50 000 hommes. Faute de pouvoir la prendre, il se replia sur Yongzhou et battit plusieurs armées Song envoyées contre lui. Au début de 1053, le général Song Di Qing, vétéran des guerres contre les Xia, franchit de nuit le col de Kunlun et mit les rebelles en déroute devant Yongzhou. Nong Zhigao s’enfuit dans le royaume de Dali, où l’on ignore ce qu’il advint de lui ; sa mère et ses fils furent capturés et exécutés. Il est aujourd’hui honoré comme un héros par beaucoup de Zhuang et de Nùng.
