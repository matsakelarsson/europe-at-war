"William rewarded his followers with the lands of the English who had fought at Hastings, and his men built castles to hold down the towns. Resistance broke out while he was away. In 1067 Eadric the Wild, a Shropshire thegn, joined the Welsh kings of Gwynedd and Powys to ravage Herefordshire, and rebels in Kent called in Count Eustace of Boulogne, who attacked Dover castle and was beaten off. William returned in December. Early in 1068 Exeter, where Harold’s mother Gytha had taken refuge, refused to take an oath to him; he besieged it for eighteen days, with heavy losses, before it surrendered on terms. Gytha escaped by boat.": "William récompensa ses disciples avec les terres des Anglais qui avaient combattu à Hastings, et ses hommes construisirent des châteaux pour tenir les villes. La résistance éclata alors qu’il était parti. En 1067, Eadric the Wild, un thégn du Shropshire, rejoignit les rois gallois de Gwynedd et de Powys pour ravager le Herefordshire, et les rebelles du Kent appelèrent le comte Eustace de Boulogne, qui attaqua le château de Dover et fut battu. William retourna en décembre. Au début de 1068 Exeter, où la mère d’Harold Gytha s’était réfugiée, refusa de lui prêter serment ; il l’assiégea pendant dix-huit jours, avec de lourdes pertes, avant qu’il ne se rendît à terme."
"In the summer of 1068 Earls Edwin and Morcar rose in Mercia with Welsh help, while the north, not yet occupied, stirred under its new earl, Gospatric. William marched north, building castles at Warwick and Nottingham, and York submitted without a fight. Edwin and Morcar gave in again, and Gospatric and Edgar Ætheling fled to King Malcolm III in Scotland. On the way south William ordered castles at Lincoln, Huntingdon and Cambridge. Meanwhile Harold’s sons, who had fled to Ireland, raided Somerset and Devon from the sea.": "Au cours de l’été 1068, Earls Edwin et Morcar se sont levés en Mercie avec l’aide galloise, tandis que le nord, non encore occupé, a remué sous son nouveau comte, Gospatric. William a marché au nord, construisant des châteaux à Warwick et Nottingham, et York soumis sans un combat. Edwin et Morcar a cédé, et Gospatric et Edgar Ætheling ont fui au roi Malcolm III en Écosse. En route vers le sud William commanda des châteaux à Lincoln, Huntingdon et Cambridge. Pendant ce temps, les fils d’Harold, qui s’étaient enfuis en Irlande, pillèrent Somerset et Devon de la mer."
