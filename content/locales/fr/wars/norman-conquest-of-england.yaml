"1070–1072": "1070–1072"
"In the spring of 1070 King Sweyn came to England himself. His men went into the fens around the Isle of Ely, then an island in the marshes, and joined local rebels led by Hereward, a Lincolnshire landholder. Together they plundered Peterborough Abbey, whose new abbot was a Norman, and carried its treasure to the ships. Sweyn then made peace with William, took a payment and sailed home with the loot, leaving the English in the fens on their own.": "Au printemps de 1070, le roi Sweyn vint en Angleterre lui-même. Ses hommes allèrent dans les fens autour de l’île d’Ely, puis une île dans les marais, et se joignirent aux rebelles locaux dirigés par Hereward, un propriétaire du Lincolnshire. Ensemble, ils pillèrent Peterborough Abbey, dont le nouvel abbé était normand, et transportèrent son trésor aux navires. Sweyn fit alors la paix avec William, prit un paiement et rentra chez lui avec le butin, laissant les Anglais seuls dans les fens."
"In 1071 Edwin and Morcar fled from William’s court. Edwin was betrayed and killed by his own men; Morcar reached Ely, where Bishop Æthelwine of Durham and other exiles had joined Hereward. William came with an army and a fleet. According to later accounts his first causeway sank into the marsh, and the Normans got across only when the monks showed them a way; the island surrendered. Morcar spent the rest of his life in prison, while Hereward escaped into legend. In 1072 William marched into Scotland, and at Abernethy Malcolm III submitted to him. By the time of Domesday Book in 1086 almost all the great estates and bishoprics of England were held by Normans and other Frenchmen.": "En 1071, Edwin et Morcar s’enfuirent de la cour William. Edwin fut trahi et tué par ses propres hommes ; Morcar atteignit Ely, où Mgr Æthelwine de Durham et d’autres exilés s’étaient joints à lui. William vint avec une armée et une flotte. Morcar passa le reste de sa vie en prison, tandis qu’Hereward s’échappait dans la légende. En 1072 William marcha en Écosse, et à Abernethy Malcolm III lui soumis. Au temps de Domesday Book en 1086 presque tous les grands domaines et évêchés d’Angleterre étaient détenus par Normands et d’autres Français."
