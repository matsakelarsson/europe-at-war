"Edward the Confessor died childless on 5 January 1066, and the next day Harold Godwinson, earl of Wessex and the most powerful man in England, was crowned king. William, duke of Normandy, a great-nephew of Edward’s Norman mother, Emma, claimed that Edward had promised him the throne, probably in 1051, and that Harold had sworn on holy relics to support him during a visit to Normandy around 1064. Norman writers later said the pope had blessed the invasion with a banner, but no other source supports this. A third claimant, Harald Hardrada of Norway, invaded the north in September; that story is told in the Norwegian invasion of England.": "Edward le Confesseur est mort sans enfant le 5 janvier 1066, et le lendemain Harold Godwinson, comte de Wessex et l’homme le plus puissant d’Angleterre, a été couronné roi. William, duc de Normandie, une grande-néphreie d’Edwards Normand mère, Emma, a affirmé qu’Édouard lui avait promis le trône, probablement en 1051, et que Harold avait juré sur les reliques saintes de le soutenir lors d’une visite en Normandie vers 1064. Les écrivains normands ont plus dit que le pape avait béni l’invasion avec une bannière, mais aucune autre source ne soutient cela. Un troisième demandeur, Harald Hardrada de Norvège, a envahi le nord en septembre ; cette histoire est racontée dans l’invasion norvégienne de l’Angleterre."
"William gathered knights from Normandy, Brittany, Flanders and other parts of France and built a fleet of several hundred ships. The army was ready by August, but contrary winds, and perhaps caution, kept it waiting at the mouth of the Dives and then at Saint-Valery-sur-Somme. Harold guarded the south coast all summer but sent his levies home on 8 September when their supplies ran out, then hurried north to destroy the Norwegians at Stamford Bridge on 25 September. Three days later William landed unopposed at Pevensey. He built a timber castle at Hastings and ravaged the countryside around it, much of it Harold’s own land.": "William rassembla des chevaliers de Normandie, Bretagne, Flandre et d’autres régions de France et construisit une flotte de plusieurs centaines de navires. L’armée était prête en août, mais les vents contraires, et peut-être la prudence, l’attendirent à l’embouchure des Dives puis à Saint-Valery-sur-Somme. Harold a gardé la côte sud tout l’été mais a envoyé ses prélèvements maison le 8 septembre quand leurs approvisionnements s’est épuisé, puis a précipité vers le nord pour détruire les Norvégiens au pont Stamford le 25 septembre. Trois jours plus tard William atterrit sans opposition à Pevensey. Il a construit un château en bois à Hastings et ravagé la campagne autour de lui, dont une grande partie Harold possède des terres."
