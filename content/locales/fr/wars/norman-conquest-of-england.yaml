"14 October 1066": "14 octobre 1066"
"Harold came back to London and stayed about a week gathering men, then marched into Sussex, perhaps hoping to surprise William as he had surprised the Norwegians. Norman scouts gave warning, and on the morning of 14 October William led his army out of Hastings. Harold had taken up position on a ridge about ten kilometres to the north-west, where the town of Battle now stands. The armies were probably of similar size, but the English all fought on foot, the housecarls and the fyrd levies, with few archers, while William had archers, infantry and mounted knights.": "Harold revint à Londres et resta environ une semaine pour rassembler des hommes, puis marcha dans le Sussex, espérant peut-être surprendre William comme il avait surpris les Norvégiens. Les scouts normands donnèrent l’avertissement et, au matin du 14 octobre, William conduisit son armée hors de Hastings. Harold avait pris position sur une crête d’une dizaine de kilomètres au nord-ouest, où se trouve maintenant la ville de Battle. Les armées étaient probablement de taille semblable, mais les Anglais se battaient tous à pied, les carles et les prélèvements de fyrds, avec peu d’archers, tandis que William avait des archers, de l’infanterie et des chevaliers montés."
"The battle lasted from about nine in the morning until dusk. The English shield wall held against arrows and charges, and part of William’s army, the Bretons on the left, broke and fled until William showed himself to quell a rumour that he was dead; the English who ran after them were cut down. Norman writers say the knights twice more feigned flight to draw men out of the line. Late in the day Harold was killed, with his brothers Gyrth and Leofwine. How he died is not known; the arrow in the eye may be a later story. The English broke, though many of the housecarls fought on around their dead king.": "La bataille dura environ neuf heures du matin jusqu’au crépuscule. Le mur de bouclier anglais s’empara des flèches et des charges, et une partie de l’armée de Williams, les bretons à gauche, se rompirent et s’enfuirent jusqu’à ce que William se montre pour éteindre une rumeur selon laquelle il était mort ; les Anglais qui couraient après eux furent abattus. Plus tard dans le jour où Harold fut tué, avec ses frères Gyrth et Leofwine. Comment il est mort n’est pas connu ; la flèche dans les yeux peut être une histoire plus tard."
