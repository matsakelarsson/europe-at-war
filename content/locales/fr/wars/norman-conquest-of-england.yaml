"1069–1070": "1069–1070"
"On 28 January 1069 the Northumbrians broke into Durham and killed the new Norman earl, Robert de Comines, and many of his several hundred men. Rebels joined by Edgar Ætheling besieged York’s castle until William hurried north, relieved it and built a second one. In late summer a Danish fleet of 240 or 300 ships, sent by King Sweyn Estridsson, a nephew of Cnut, came down the coast under his brother Asbjørn and his sons. Beaten off at Dover, Sandwich, Ipswich and Norwich, it entered the Humber, where Edgar, Gospatric and Earl Waltheof joined it with the men of Yorkshire. In September they stormed York and destroyed the garrisons of both castles. Risings followed at Shrewsbury, Exeter and Montacute.": "Le 28 janvier 1069, les Northumbriens arrivèrent à Durham et tuèrent le nouveau comte normand Robert de Comines, ainsi que plusieurs de ses centaines d’hommes. Les rebelles rejoints par Edgar Ætheling assiégeèrent le château de York jusqu’à ce que William se précipite vers le nord, le soulagée et en construisit un second. À la fin de l’été, une flotte danoise de 240 ou 300 navires, envoyée par le roi Sweyn Estridsson, neveu de Cnut, descendit la côte sous son frère Asbjørn et ses fils. Battue au large à Dover, Sandwich, Ipswich et Norwich, elle entra dans le Humber, où Edgar, Gospatric et Earl Waltheof se joignirent aux hommes du Yorkshire. En septembre, ils ont pris l’assaut de York et détruit les garnisons des deux châteaux. L’ascension suit à Shrewsbury, Exeter et Montacute."
"William dealt with them in turn. He drove the Danes back across the Humber, beat the Mercian rebels at Stafford, forced the crossing of the Aire at Pontefract and retook York, where he wore his crown at Christmas. He paid the Danes, who agreed to leave in the spring. Through the winter his troops laid waste the land between the Humber and the Tees and beyond, burning villages, crops and livestock so that the north could not feed another rebellion. Famine followed. Orderic Vitalis, writing some fifty years later, said that more than 100,000 people died, a figure historians treat as rhetoric, and in 1086 Domesday Book still recorded much of Yorkshire as waste. Early in 1070 William crossed the Pennines in deep winter and built castles at Chester and Stafford.": "William les traita à son tour. Il conduisit les Danois à travers le Humber, battit les rebelles des Merciens à Stafford, força la traversée de l’Aire à Pontefratt et reprit York, où il porta sa couronne à Noël. Pendant l’hiver, ses troupes ont gaspillé la terre entre le Humber et les Tees et au-delà, brûlant des villages, des cultures et du bétail pour que le nord ne puisse nourrir une autre rébellion. Famine suivit. Orderic Vitalis, écrivant environ cinquante ans plus tard, a dit que plus de 100 000 personnes sont mortes, un personnage historien traite comme rhétorique, et en 1086 Domesday Book enregistre encore beaucoup de Yorkshire comme déchets. Au début de 1070, William traversa les Pennines en hiver profond et construisit des châteaux à Chester et Stafford."
