"No one came to submit. In London the leading men, with the earls Edwin and Morcar and the archbishops Stigand and Ealdred, chose as king Edgar Ætheling, a teenage great-nephew of Edward the Confessor. William waited at Hastings for some days, then moved along the Kent coast, punishing Romney, where some of his men had been killed. Dover castle surrendered and Canterbury submitted, while a detachment took the submission of Winchester, the old royal city. At Southwark William beat off an English force and burned the suburb, but he could not cross London Bridge.": "À Londres, les hommes les plus importants, avec les comtes Edwin et Morcar et les archevêques Stigand et Ealdred, ont choisi comme roi Edgar Ætheling, un grand-néphage adolescent d’Edward le Confesseur. William a attendu à Hastings pendant quelques jours, puis s’est déplacé sur la côte du Kent, puni Romney, où certains de ses hommes avaient été tués. Le château de Dover s’est rendu et Canterbury a soumis, tandis qu’un détachement a pris la soumission de Winchester, la vieille ville royale. À Southwark William battu une force anglaise et brûlé la banlieue, mais il ne pouvait pas traverser le pont de Londres."
"Instead he circled London to the west, ravaging the land as he went, crossed the Thames at Wallingford, where Archbishop Stigand submitted, and turned east. At Berkhamsted Edgar, Ealdred, Edwin, Morcar and the leading Londoners came to submit. William was crowned in Westminster Abbey on Christmas Day 1066 by Ealdred. When the congregation shouted their acclamation in English and French, Norman guards outside took it for a riot and set fire to houses nearby. In March 1067 William went back to Normandy, taking Edgar, the earls and Stigand with him, and left his half-brother Odo and William FitzOsbern in charge.": "Au lieu de cela, il tourna Londres vers l’ouest, ravageant la terre pendant qu’il allait, traversa la Tamise à Wallingford, où l’archevêque Stigand se présenta et se dirigea vers l’est. À Berkhamsted Edgar, Ealdred, Edwin, Morcar et les principaux Londoniens vinrent se soumettre. William fut couronné à Westminster Abbey le jour de Noël 1066 par Ealdred. En mars 1067, William retourna en Normandie, prenant avec lui Edgar, les comtes et Stigand, et laissa son demi-frère Odo et William FitzOsbern en charge."
