"Hereward and the Danes sacked the abbey to keep its treasure from the new Norman abbot, Turold. The town was burned.": "Ici, et les Danois ont renvoyé l’abbaye pour garder son trésor du nouvel abbé Normand, Turold. La ville a été brûlée."
"Isle of Ely": "Île d’Ely"
"The last English stronghold, ringed by fens. The abbey on the island was the rebels’ base.": "La dernière forteresse anglaise, sonnée de fens. L’abbaye sur l’île était la base des rebelles."
"Aldreth": "Aldreth"
"Tradition places William’s causeway here, on the old route from Cambridge. An earthwork nearby is still called Belsar’s Hill after one of his knights.": "La tradition place ici la chaussée de William, sur l’ancienne route de Cambridge. Un travail de terre à proximité est toujours appelé Belsars Hill après un de ses chevaliers."
