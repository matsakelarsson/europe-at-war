"Norman Conquest of England": "Conquête normande de l’Angleterre"
"The conquest of England by William, duke of Normandy, who landed in Sussex in September 1066, defeated and killed King Harold at Hastings and was crowned at Westminster on Christmas Day. Over the next five years he put down a series of English risings, some backed by the Danes and the Welsh, laid waste to the north and took the last rebel stronghold, the Isle of Ely, in 1071. A French-speaking Norman aristocracy and church replaced the English ruling class.": "La conquête de l’Angleterre par William, duc de Normandie, qui débarqua à Sussex en septembre 1066, battit et tua le roi Harold à Hastings et fut couronné à Westminster le jour de Noël. Au cours des cinq années suivantes, il fit tomber une série d’ascensions anglaises, certaines soutenues par les Danois et les Gallois, gaspillèrent le nord et prit la dernière forteresse rebelle, l’île d’Ely, en 1071. Une aristocratie et une église normandes de langue française ont remplacé la classe dirigeante anglaise."
"The main sources are the Anglo-Saxon Chronicle and, on the Norman side, William of Poitiers and William of Jumièges, both writing to justify the conquest; Orderic Vitalis and the chroniclers of the next generation add detail. The Bayeux Tapestry, made in England probably in the 1070s for William’s half-brother Odo, tells the Norman story in pictures.": "Les sources principales sont la Chronique anglo-saxonne et, du côté normand, Guillaume de Poitiers et Guillaume de Jumièges, tous deux écrivant pour justifier la conquête ; Orderic Vitalis et les chroniqueurs de la génération suivante ajoutent des détails. La tapisserie Bayeux, fabriquée en Angleterre probablement dans les années 1070 pour William's demi-frère Odo, raconte l’histoire normande en images."
"Numbers are uncertain. Writers of the time give impossible figures; modern estimates for each army at Hastings range from about 5,000 to more than 10,000 men.": "Les chiffres sont incertains. Les rédacteurs de l’époque donnent des chiffres impossibles ; les estimations modernes pour chaque armée à Hastings vont d’environ 5 000 à plus de 10 000 hommes."
"The Norwegian invasion of September 1066 and the Battle of Stamford Bridge are told in their own story, the Norwegian invasion of England.": "L’invasion norvégienne de septembre 1066 et la bataille du pont Stamford sont racontées dans leur propre histoire, l’invasion norvégienne de l’Angleterre."
