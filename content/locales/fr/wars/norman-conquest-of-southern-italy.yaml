"Norman conquest of southern Italy": "Conquête normande du sud de l’Italie"
"The piecemeal conquest of southern Italy and Sicily by Norman adventurers, who came as mercenaries for Lombard rebels and princes and made themselves lords. Led by the Hauteville brothers and the Drengots of Aversa and Capua, they took Byzantine Apulia and Calabria (Bari fell in 1071), the last Lombard principalities and Muslim Sicily (1061–1091), and in 1130 Roger II united their lands as the Kingdom of Sicily, which the papacy recognised in 1139.": "La conquête fragmentaire du sud de l’Italie et de la Sicile par les aventuriers normands, qui sont venus comme mercenaires pour les rebelles et les princes lombards et se sont fait seigneurs. Dirigés par les frères Hauteville et les Drengots d’Aversa et de Capua, ils prirent les Pouilles byzantines et la Calabre (Bari tomba en 1071), les dernières principautés lombardes et la Sicile musulmane (1061-1091), et en 1130 Roger II unifia leurs terres comme le Royaume de Sicile, que la papauté reconnut en 1139."
"The Normans did not come as one army. Bands led by different families fought for themselves, for whoever paid them and often against each other; the Hautevilles in Apulia, Calabria and Sicily and the Drengots at Aversa and Capua became the leading families.": "Les Normands ne sont pas venus comme une seule armée. Des bandes dirigées par différentes familles se battent pour eux-mêmes, car ceux qui les payaient et souvent s’y opposaient ; les Hautevilles d’Apulia, de Calabre et de Sicile et les Drengots d’Aversa et de Capua deviennent les principales familles."
"The main narrative sources, Amatus of Montecassino, William of Apulia and Geoffrey Malaterra, wrote for Norman patrons and often exaggerate the odds the Normans faced. Their numbers are not reliable.": "Les principales sources narratives, Amatus of Montecassino, William of Apulia et Geoffrey Malaterra, ont écrit pour les mécènes normands et exagèrent souvent les chances auxquelles les Normands étaient confrontés."
"Capua was a Lombard principality until Richard of Aversa made himself its prince in 1058. Benevento passed to the papacy in 1051 and for good in 1077.": "Capua fut une principauté lombarde jusqu’à ce que Richard d’Aversa se fasse prince en 1058. Bénévent passa à la papauté en 1051 et pour de bon en 1077."
