"February 1091, end of the conquest of Sicily": "Février 1091, fin de la conquête de la Sicile"
"18 October 1081": "18 octobre 1081"
"The Normans broke Alexios’s army, whose Varangian Guard, many of them English exiles, was cut down after charging too far ahead.": "Les Normands ont brisé l’armée d’Alexios, dont la garde varangienne, dont beaucoup d’exilés anglais, a été coupée après avoir chargé trop loin devant."
"Rome": "Rome"
"Henry IV withdrew as Guiscard approached. The Normans freed Gregory VII, but their sack turned the Romans against the pope, who died in exile at Salerno in 1085.": "Henri IV se retira alors que Guiscard s’approcha. Les Normands libèrent Grégoire VII, mais leur sac tourna les Romains contre le pape, qui mourut en exil à Salerno en 1085."
"Cephalonia": "Céphalonie"
"17 July 1085": "17 juillet 1085"
"Guiscard died of fever on the island during his second campaign against Byzantium, and the Balkan venture was given up.": "Guiscard est mort de fièvre sur l’île lors de sa deuxième campagne contre Byzance, et l’aventure balkanique a été abandonnée."
"October 1086": "octobre 1086"
"Roger’s fleet sailed from Messina and his son Jordan besieged the city by land for five months.": "La flotte de Roger a navigué de Messine et son fils Jordan a assiégé la ville par terre pendant cinq mois."
"The emir Ibn Hamud surrendered Castrogiovanni and became a Christian.": "L’émir Ibn Hamud a rendu Castrogiovanni et est devenu un chrétien."
"Noto": "Noto"
"February 1091": "février 1091"
"The last Muslim stronghold surrendered, thirty years after the Normans first crossed the strait.": "Le dernier bastion musulman s’est rendu, trente ans après la première traversée du détroit par les Normands."
"Malta": "Malte"
"Roger landed, freed Christian captives and made the island’s Muslim ruler his tributary. Malta was fully annexed only in 1127.": "Roger a débarqué, libéré les prisonniers chrétiens et fait de l’île le souverain musulman son affluent. Malte n’a été entièrement annexée qu’en 1127."
"Guiscard, 1081": "C’est pourquoi je voudrais vous faire part de mes remarques."
"Guiscard, 1084": "Le Président. — L’ordre du jour appelle le rapport (doc."
"Roger, 1086": "Bien reçu, 1086"
"Roger II’s kingdom": "Roi Roger II"
"1127–1139": "1127–1139"
"Count Roger’s son Roger II, Count of Sicily since 1105, claimed Apulia when Guiscard’s grandson Duke William died childless in 1127. The pope and the mainland barons opposed him, but in 1128 Pope Honorius II had to invest him as duke. When the papal election of 1130 split the Church, Roger backed Anacletus II, who made him king, and he was crowned in Palermo on Christmas Day 1130. The rival pope, Innocent II, whom most of Europe recognised, and the Emperor Lothair III refused to accept the new kingdom, and the mainland barons rose under Roger’s brother-in-law Ranulf of Alife and Prince Robert II of Capua.": "Le comte Roger, fils de Roger II, comte de Sicile depuis 1105, revendiqua les Pouilles quand le petit-fils de Guiscard, duc William mourut sans enfant en 1127. Le pape et les barons continentaux s’opposèrent à lui, mais en 1128 le Pape Honorius II dut l’investir comme duc. Lorsque les élections papales de 1130 ont divisé l’Église, Roger a soutenu Anacletus II, qui l’a fait roi, et il a été couronné à Palerme le jour de Noël 1130. Le pape rival, Innocent II, que la plupart des Européens reconnurent, et l’empereur Lothair III refusèrent d’accepter le nouveau royaume, et les barons continentaux se sont levés sous Rogers beau-frère Ranulf d’Alife et Prince Robert II de Capua."
"Ranulf beat Roger at Nocera on 24 July 1132. In 1137 Lothair and Innocent marched south through Apulia, took Bari and Salerno and made Ranulf duke. When Lothair turned for home, Roger struck back, but Ranulf beat him again at Rignano on 30 October 1137. Lothair died that December and Ranulf in April 1139. On 22 July 1139 Roger’s son ambushed the papal army at Galluccio and captured Innocent II, who three days later at Mignano recognised Roger as King of Sicily, Duke of Apulia and Prince of Capua. Naples submitted that year and the Abruzzi were conquered in 1140.": "En 1137 Lothair et Innocent marchèrent vers le sud à travers les Pouilles, prirent Bari et Salerno et firent Ranulf duke. Lorsque Lothair retourna pour la maison, Roger frappa, mais Ranulf le battit de nouveau à Rignano le 30 octobre 1137. Lothair mourut en décembre et Ranulf en avril 1139. Le 22 juillet 1139, le fils de Roger a embusqué l’armée papale à Galluccio et capturé Innocent II, qui trois jours plus tard à Mignano a reconnu Roger comme roi de Sicile, duc des Pouilles et prince de Capoue. Naples a soumis cette année-là et les Abruzzes ont été conquis en 1140."
"Coronation of Roger II": "Couronnement de Roger II"
"Palermo, 25 December 1130": "Palerme, 25 décembre 1130"
