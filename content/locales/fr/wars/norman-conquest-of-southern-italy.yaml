"Ranulf and Robert of Capua routed Roger’s army near the Sarno, and Roger fled to Salerno.": "Ranulf et Robert de Capua ont acheminé l’armée de Roger près du Sarno, et Roger s’est enfui à Salerno."
"The townspeople rose against Roger, and Lothair’s army took the citadel after a siege.": "Les habitants se levèrent contre Roger, et l’armée de Lothair prit la citadelle après un siège."
"30 October 1137": "30 octobre 1137"
"Roger’s second defeat by Ranulf. Duke Sergius VII of Naples, fighting for Roger, was killed.": "La deuxième défaite de Roger par Ranulf. Duc Sergius VII de Naples, se battant pour Roger, a été tué."
"Battle of Galluccio": "Bataille de Galluccio"
"22 July 1139": "22 juillet 1139"
"Roger’s son, Duke Roger of Apulia, fell on the papal army with about a thousand knights and took the pope prisoner.": "Le fils de Roger, duc Roger des Pouilles, tomba sur l’armée papale avec un millier de chevaliers et prit le pape prisonnier."
"Mignano": "Mignano"
"25 July 1139": "25 juillet 1139"
"The captive pope recognised the kingdom, which lasted, in one form or another, until 1861.": "Le pape captif reconnut le royaume, qui dura, sous une forme ou une autre, jusqu’en 1861."
"Naples": "Naples"
"Without a duke since Rignano, the city accepted Roger’s rule and his son Alfonso as its duke.": "Sans duc depuis Rignano, la ville accepte le règne de Roger et son fils Alfonso comme duc."
