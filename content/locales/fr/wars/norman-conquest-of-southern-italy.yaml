"1068–1080": "1068–1080"
"By 1068 the Byzantines held only a few towns on the Apulian coast. In August Guiscard laid siege to Bari, the capital of Byzantine Italy, closing its harbour with a line of ships. The town held out for nearly three years, and a relief fleet was beaten off. On 16 April 1071 Bari surrendered, ending more than five centuries of Byzantine rule in Italy. That August the Byzantines were routed by the Seljuk Turks at Manzikert, and they never came back. In 1073 Amalfi, afraid of its neighbour Salerno, accepted Guiscard as its lord.": "En 1068, les Byzantins ne tenaient que quelques villes sur la côte des Pouilles. En août, Guiscard assiégea Bari, capitale de l’Italie byzantine, fermant son port avec une ligne de navires. La ville s’arrêta pendant près de trois ans et une flotte de secours fut battue. Le 16 avril 1071, Bari se rendit, mettant fin à plus de cinq siècles de règne byzantin en Italie. En août, les Byzantins furent conduits par les Turcs de Seljuk à Manzikert, et ils ne revinrent jamais. En 1073, Amalfi, effrayé de son voisin Salerno, accepta Guiscard comme son seigneur."
"The last Lombard principality, Salerno, was ruled by Gisulf II, brother of Guiscard’s wife Sichelgaita. Guiscard besieged it in 1076; the starving city surrendered on 13 December, and Gisulf held out in the citadel until May 1077. Guiscard made Salerno his capital. The last Lombard prince of Benevento died the same year, and the city passed to the pope. Gregory VII, who had excommunicated Guiscard for raiding papal lands, needed him against the Emperor Henry IV, and at Ceprano in June 1080 he lifted the ban and invested Guiscard with his lands again.": "La dernière principauté lombarde, Salerno, fut gouvernée par Gisulf II, frère de la femme de Guiscard, Sichelgaita. Guiscard l’assiégea en 1076 ; la ville affamée se rendit le 13 décembre et Gisulf se tint dans la citadelle jusqu’en mai 1077. Le dernier prince lombard de Benevento mourut la même année, et la ville passa au pape. Grégoire VII, qui avait excommunié Guiscard pour faire des raids sur les terres papales, avait besoin de lui contre l’empereur Henri IV, et à Ceprano en juin 1080 il leva l’interdiction et investi Guiscard avec ses terres."
