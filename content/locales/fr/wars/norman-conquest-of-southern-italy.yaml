"1038–1047": "1038–1047"
"In 1038 the Byzantine general George Maniakes invaded Muslim Sicily, then torn between rival emirs. With him went Lombard troops and a few hundred Norman knights, among them William and Drogo, sons of Tancred of Hauteville, a minor lord from the Cotentin in Normandy. Maniakes took Messina and Syracuse and won a battle at Troina in 1040, but he quarrelled with his allies, the Normans went home unpaid, and he was recalled to Constantinople. The Muslims soon won back everything except Messina, which fell in 1042.": "En 1038, le général byzantin George Maniakes envahit la Sicile musulmane, puis déchiré entre des émirs rivaux. Avec lui s’en alla les troupes lombardes et quelques centaines de chevaliers normands, dont William et Drogo, fils de Tancred de Hauteville, un seigneur mineur du Cotentin en Normandie. Maniakes prit Messine et Syracuse et gagna une bataille à Troina en 1040, mais il se disputa avec ses alliés, les Normands rentrèrent chez eux sans solde, et on le rappela à Constantinople. Les musulmans remportèrent bientôt tout sauf Messine, qui tombait en 1042."
"In 1041 the Normans joined a new Lombard rising in Apulia. From Melfi, a hill town on the Byzantine frontier, they beat the Byzantines three times in a year, on the Olivento on 16 March, at Montemaggiore near Cannae on 4 May and at Montepeloso on 3 September, where they captured the catepan. In September 1042 the Norman leaders met at Melfi and chose William Iron Arm as Count of Apulia, and soon afterwards they shared out the towns they had taken among twelve chiefs. William died in 1046, and in 1047 the Emperor Henry III recognised his brother Drogo as count.": "En 1041, les Normands se joignirent à un nouveau Lombard qui montait aux Pouilles. De Melfi, ville de montagne à la frontière byzantine, ils battaient les Byzantins trois fois par an, sur l’Olivento le 16 mars, à Montemaggiore près de Cannae le 4 mai et à Montepeloso le 3 septembre, où ils capturèrent la catepan. En septembre 1042, les chefs normands se rencontrèrent à Melfi et choisirent William Iron Arm comme comte des Pouilles. Peu de temps après, ils partagèrent les villes qu’ils avaient prises parmi douze chefs. Guillaume mourut en 1046, et en 1047 l’empereur Henri III reconnut son frère Drogo comme comte."
