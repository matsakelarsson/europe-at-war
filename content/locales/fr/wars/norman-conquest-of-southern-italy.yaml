"1009–1030": "1009–1030"
"On 9 May 1009 Melus, a Lombard noble of Bari, led a revolt against Byzantine rule in Apulia. It failed, and he fled. The chroniclers tell how in about 1016 he met Norman pilgrims at the shrine of St Michael on Monte Gargano and asked them to bring fighting men; whatever the truth of the story, Norman knights, many of them younger sons with no land at home, were soon serving in the south. In 1017 Melus rose again with their help and won several battles in northern Apulia.": "Le 9 mai 1009, Melus, un noble lombard de Bari, mena une révolte contre la domination byzantine dans les Pouilles. Il échoua, et s’enfuit. Les chroniqueurs racontent comment vers 1016 il rencontra les pèlerins normands au sanctuaire Saint Michel sur le Monte Gargano et leur demanda d’amener des combattants ; quelle que soit la vérité de l’histoire, les chevaliers normands, beaucoup de jeunes fils sans terre à la maison, servaient bientôt dans le sud. En 1017, Melus se relève avec leur aide et remporte plusieurs batailles dans le nord des Pouilles."
"In 1018 the new Byzantine catepan, Basil Boioannes, crushed Melus and his Normans on the Ofanto near Cannae, where Hannibal had beaten the Romans. Melus fled to the Emperor Henry II and died in 1020. The surviving Normans hired themselves out to whoever would pay, the abbots of Montecassino, the Lombard princes of Capua and Salerno, the dukes of Naples and the Byzantines themselves. In early 1030 Duke Sergius IV of Naples gave one of their leaders, Rainulf Drengot, the town of Aversa, the first Norman lordship in Italy.": "En 1018, la nouvelle catepan byzantine, Basil Boioannes, a écrasé Melus et ses Normands sur l’Ofanto près de Cannae, où Hannibal avait battu les Romains. Melus s’est enfui vers l’empereur Henri II et est mort en 1020. Les Normands survivants s’engageaient auprès de qui paierait, les abbés de Montecassino, les princes lombards de Capoue et de Salerne, les ducs de Naples et les Byzantins eux-mêmes. Au début de 1030, le duc Sergius IV de Naples donna à un de leurs dirigeants, Rainulf Drengot, la ville d’Aversa, la première seigneurie normande en Italie."
