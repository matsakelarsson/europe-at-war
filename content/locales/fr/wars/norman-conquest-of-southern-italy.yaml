"In 1081 Guiscard attacked the Byzantine Empire itself, crossing the Adriatic with his son Bohemond. He beat the Emperor Alexios I Komnenos outside Dyrrhachium (Durrës) on 18 October and took the city in February 1082, but revolts in Apulia, encouraged with Byzantine money, called him home. In May 1084 he marched on Rome to rescue Gregory VII, besieged in Castel Sant’Angelo by Henry IV. His army freed the pope and then sacked the city, burning much of it, and Gregory had to leave with the Normans. Guiscard died of fever on Cephalonia on 17 July 1085, during a second Balkan campaign.": "En 1081, Guiscard attaqua l’Empire byzantin lui-même, traversant l’Adriatique avec son fils Bohemond. Il battit l’empereur Alexios I Komnenos en dehors de Dyrrachium (Durrës) le 18 octobre et prit la ville en février 1082, mais des révoltes en Pouilles, encouragées par l’argent byzantin, l’appelèrent chez lui. En mai 1084, il marcha sur Rome pour sauver Grégoire VII, assiégé à Castel Sant-Angelo par Henri IV. Son armée libéra le pape, puis la congédia, en brûlant une grande partie, et Grégoire dut partir avec les Normands. Guiscard mourut de fièvre sur Céphalonie le 17 juillet 1085, lors d’une deuxième campagne balkanique."
"In Sicily Count Roger finished the conquest. Trapani fell in 1077 and Taormina in 1079. In May 1086 Roger attacked Syracuse, whose emir, known to the Normans as Benavert, was killed in a sea fight off the harbour; the city surrendered in October. The emir of Enna gave up his fortress in 1087 and became a Christian, Butera fell in 1088, and in February 1091 Noto, the last Muslim town, surrendered. That summer Roger raided Malta and made its emir pay tribute. Sicily’s Muslims, still perhaps the majority of its people, kept their faith and much of their law under Norman rule.": "En Sicile, le comte Roger a terminé la conquête. Trapani est tombé en 1077 et Taormina en 1079. En mai 1086 Roger a attaqué Syracuse, dont l’émir, connu par les Normands sous le nom de Benavert, a été tué dans un combat maritime au large du port ; la ville s’est rendue en octobre. L’émir d’Enna abandonna sa forteresse en 1087 et devint chrétien, Butera tomba en 1088, et en février 1091 Noto, la dernière ville musulmane, se rendit. Cet été-là Roger fit une descente à Malte et fit rendre hommage à son émir."
"Battle of Dyrrhachium": "Bataille de Dyrrachium"
"18 October 1081, Norman victory": "18 octobre 1081, victoire normande"
"Sack of Rome": "Sac de Rome"
"May 1084": "mai 1084"
