"1061–1072": "1061–1072"
"Muslim Sicily had broken up among rival emirs, and in 1061 one of them, Ibn al-Thumna of Syracuse and Catania, asked the Normans for help against his rival Ibn al-Hawwas of Enna. In May Robert Guiscard and his youngest brother Roger crossed the strait and took Messina. They pushed inland but could not take Enna. Roger held on in the north-east, where in the winter of 1062–63 he and his wife were besieged in Troina by its own Greek townspeople. In June 1063, at Cerami, his small force routed a much larger army of Sicilian Muslims and Zirid troops from Africa.": "La Sicile musulmane avait rompu parmi les émirs rivaux, et en 1061 l’un d’eux, Ibn al-Thumna de Syracuse et Catane, a demandé l’aide des Normands contre son rival Ibn al-Hawwas d’Enna. En mai Robert Guiscard et son plus jeune frère Roger ont traversé le détroit et pris Messine. Ils ont poussé à l’intérieur mais ne pouvaient pas prendre Enna. Roger se tenait dans le nord-est, où, durant l’hiver de 1062–1063, lui et sa femme furent assiégés à Troina par ses propres habitants grecs. En juin 1063, à Cerami, sa petite armée dirigea une armée beaucoup plus importante de musulmans siciliens et de troupes Zirid d’Afrique."
"Progress was slow while Guiscard was busy in Apulia. Roger won again at Misilmeri in 1068, and after Bari fell in 1071 the brothers turned on Palermo with an army and a fleet. The city was besieged by land and sea from August, and on 7 January 1072 the Normans broke into the outer city; the inner city surrendered a few days later, on terms that let the Muslims keep their religion and laws. Guiscard kept Palermo and parts of the north-east for himself and invested Roger with the rest as Count of Sicily.": "Les progrès étaient lents pendant que Guiscard était occupé à Pouilles. Roger gagna de nouveau à Misilmeri en 1068, et après la chute de Bari en 1071 les frères se tournèrent vers Palerme avec une armée et une flotte. La ville fut assiégée par terre et par mer à partir d’août, et le 7 janvier 1072, les Normands permirent de pénétrer dans la ville extérieure ; le centre-ville se rendit quelques jours plus tard, selon des conditions qui permettaient aux musulmans de garder leur religion et leurs lois. Guiscard a gardé Palerme et des parties du nord-est pour lui-même et a investi Roger avec le reste comme comte de Sicile."
