"1051–1059": "1051–1059"
"The Normans’ plundering made them hated in Apulia and feared by their neighbours. Drogo was murdered in 1051, and Pope Leo IX, who had just taken Benevento under papal rule, raised an army against them, with the Byzantine governor Argyrus, Melus’s son, as his ally. Before the two could join forces, the Normans under Drogo’s brother Humphrey, Richard of Aversa and Robert Guiscard, another son of Tancred, met the pope’s Italian levies and Swabian foot soldiers at Civitate on 18 June 1053. The Swabians fought almost to the last man, and the pope was taken and held at Benevento for nine months.": "Le pillage des Normands les fit haïr en Pouilles et redouter par leurs voisins. Drogo fut assassiné en 1051, et le pape Léon IX, qui venait de prendre Benevento sous domination papale, souleva une armée contre eux, avec le gouverneur byzantin Argyrus, fils de Melus, comme son allié. Avant que les deux ne puissent unir leurs forces, les Normands, sous la direction de Humphrey, frère de Drogos, Richard d’Aversa et Robert Guiscard, autre fils de Tancred, rencontrèrent le pape des prélèvements italiens et des soldats souabe à Civitate le 18 juin 1053. Les Souabes combattirent presque au dernier homme, et le pape fut pris et tenu à Benevento pendant neuf mois."
"Leo’s successors made their peace with the Normans. Humphrey died in 1057 and Robert Guiscard took over in Apulia; Reggio fell to him in 1060, completing the conquest of Calabria. Richard of Aversa made himself Prince of Capua in 1058. Pope Nicholas II, who needed allies against the Roman nobles and the German court, came to Melfi in 1059. On 23 August he invested Robert as “by the grace of God and St Peter Duke of Apulia and Calabria and, with their help, hereafter of Sicily”, and confirmed Richard in Capua. Both swore fealty to the pope.": "Humphrey mourut en 1057 et Robert Guiscard prit la relève à Pouilles ; Reggio tomba à lui en 1060, complétant la conquête de la Calabre. Richard d’Aversa se fit prince de Capoue en 1058. Le pape Nicolas II, qui avait besoin d’alliés contre les nobles romains et la cour allemande, vint à Melfi en 1059. Le 23 août, il investit Robert comme par la grâce de Dieu et de saint Pierre duc d’Apulie et de Calabre et, avec leur aide, ci-après de Sicile, et confirma Richard à Capoue. Tous deux juraient féalité au pape."
