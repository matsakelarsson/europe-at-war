"30 October 1137, victory for Ranulf": "30 octobre 1137, victoire pour Ranulf"
"Treaty of Mignano": "Traité de Mignano"
"25 July 1139, Roger recognised as king": "25 juillet 1139, Roger reconnu comme roi"
"25 December 1130": "25 décembre 1130"
"Roger was crowned in the cathedral by a cardinal sent by Anacletus II. Palermo, with its Arab, Greek and Latin courtiers, became the capital of the kingdom.": "Roger fut couronné dans la cathédrale par un cardinal envoyé par Anacletus II. Palerme, avec ses courtisans arabes, grecs et latins, devint la capitale du royaume."
"Battle of Nocera": "Bataille de Nocera"
