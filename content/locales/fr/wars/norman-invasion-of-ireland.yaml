"In 1166 Diarmait Mac Murchada, king of Leinster, was driven out by a coalition led by the high king, Ruaidrí Ua Conchobair of Connacht, and Tigernán Ua Ruairc of Bréifne, whose wife Diarmait had carried off years before. Diarmait went to Henry II, who let him recruit among his subjects. In south Wales he found Norman lords ready to fight for land, chief among them Richard de Clare, earl of Pembroke, known as Strongbow, to whom he promised his daughter Aífe and the succession to Leinster. On 1 May 1169 Robert FitzStephen landed at Bannow Bay with some 40 knights, 60 men-at-arms and 360 archers, and the Norse-Irish town of Wexford surrendered after two days.": "En 1166, Diarmait Mac Murchada, roi de Leinster, fut chassé par une coalition dirigée par le grand roi Ruaidrí Ua Conchobair de Connacht et Tigernán Ua Ruairc de Bréifne, dont l’épouse Diarmait avait emporté des années auparavant. Au sud du pays de Galles, il trouva des seigneurs normands prêts à se battre pour la terre, dont le chef Richard de Clare, comte de Pembroke, connu sous le nom de Strongbow, auquel il promettait sa fille Aífe et la succession à Leinster. Le 1er mai 1169, Robert FitzStephen débarqua à Bannow Bay avec une quarantaine de chevaliers, 60 hommes d’armes et 360 archers, et la ville nordique-irlandaise de Wexford se rendit après deux jours."
"In May 1170 Raymond FitzGerald dug in on the headland of Baginbun and routed a much larger force from Waterford. Strongbow landed nearby on 23 August with about 200 knights and 1,000 other soldiers, stormed Waterford and married Aífe in the town. On 21 September, while Diarmait was negotiating with Dublin’s Norse king, Ascall mac Ragnaill, Norman knights broke in and took the city. Diarmait died in May 1171, and Strongbow claimed Leinster, against Irish custom. Ascall returned with a Norse fleet and was beaten and executed. Then Ruaidrí besieged Dublin with an army from most of Ireland for two months, until a sortie routed his camp at Castleknock.": "En mai 1170, Raymond FitzGerald creusa sur le cap de Baginbun et dirigea une force beaucoup plus importante de Waterford. Strongbow débarqua à proximité le 23 août avec environ 200 chevaliers et 1 000 autres soldats, s’empare de Waterford et épousa Aífe dans la ville. Le 21 septembre, alors que Diarmait négociait avec le roi de Dublin, Ascall mac Ragnaill, les chevaliers normands ont fait irruption et ont pris la ville. Diarmait est mort en mai 1171, et Strongbow a revendiqué Leinster, contre la coutume irlandaise. Ruaidrí a ensuite assiégé Dublin avec une armée de la majeure partie de l’Irlande pendant deux mois, jusqu’à ce qu’une sortie parcoure son camp à Castleknock."
