"Norman invasion of Ireland": "Invasion normande de l’Irlande"
"The arrival of Cambro-Norman knights in Ireland, invited in 1169 by Diarmait Mac Murchada, the exiled king of Leinster. They took Wexford, Waterford and Dublin, and their leader Strongbow claimed Leinster; in 1171 King Henry II came himself and received the submission of the Normans and of many Irish kings. The Treaty of Windsor of 1175 left Henry lord of the conquered east and the high king Ruaidrí Ua Conchobair overlord of the rest under him, the start of English rule in Ireland.": "L’arrivée des chevaliers Cambro-Norman en Irlande, invités en 1169 par Diarmait Mac Murchada, le roi exilé de Leinster. Ils ont pris Wexford, Waterford et Dublin, et leur chef Strongbow a réclamé Leinster ; en 1171 le Roi Henry II est venu lui-même et a reçu la soumission des Normands et de nombreux rois irlandais. Le traité de Windsor de 1175 laissa Henry seigneur de l’est conquis et le grand roi Ruaidrí Ua Conchobair surplombait le reste sous lui, le début de la domination anglaise en Irlande."
"The invaders are often called Anglo-Normans; many came from the Norman lordships of south Wales and had Welsh and Flemish soldiers with them, so historians also call them Cambro-Normans. The main accounts are Gerald of Wales’s Expugnatio Hibernica, written by a relative of several of the leaders, the Old French Song of Dermot and the Earl, and the Irish annals.": "Les envahisseurs sont souvent appelés Anglo-Normans ; beaucoup viennent des seigneuries normandes du sud du pays de Galles et ont des soldats gallois et flamands avec eux, donc les historiens les appellent aussi Cambro-Normans. Les principaux récits sont Gerald of Wales. Expugnatio Hibernica, écrit par un parent de plusieurs des dirigeants, le vieux chant français de Dermot et le comte, et les annales irlandaises."
"Henry claimed papal backing from the bull Laudabiliter, said to have been issued by Pope Adrian IV in about 1155; its authenticity has long been debated, but Pope Alexander III endorsed Henry’s lordship in 1172.": "Henry a revendiqué le soutien pontifical du taureau Laudabiliter, qui aurait été émis par le pape Adrian IV vers 1155 ; son authenticité a longtemps été débattue, mais le pape Alexandre III a approuvé la seigneurie d’Henri en 1172."
