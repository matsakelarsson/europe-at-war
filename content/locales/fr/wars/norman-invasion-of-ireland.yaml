"Henry feared that Strongbow would make himself an independent king across the Irish Sea, and came himself. On 17 October 1171 he landed near Waterford with at least 500 knights and 4,000 men-at-arms and archers, the first reigning king of England to set foot in Ireland. Strongbow did homage and kept Leinster as a fief, while Henry kept Dublin, Wexford and Waterford for the crown. Many Irish kings submitted to him at Waterford and Dublin, probably hoping he would restrain the barons; Ruaidrí did not. A synod at Cashel brought the Irish church into line with English practice. Henry granted Meath, still unconquered, to Hugh de Lacy, and sailed home in April 1172.": "Le 17 octobre 1171, il débarqua près de Waterford avec au moins 500 chevaliers et 4 000 hommes d’armes et archers, le premier roi régnant d’Angleterre à mettre les pieds en Irlande. Strongbow fit un hommage et garda Leinster comme fief, tandis qu’Henry conserva Dublin, Wexford et Waterford pour la couronne. De nombreux rois irlandais se soumettaient à lui à Waterford et Dublin, espérant probablement qu’il retiendrait les barons ; Ruaidrí ne le fit pas. Un synode à Cashel a mis l’église irlandaise en conformité avec la pratique anglaise. Henry a accordé Meath, encore non conquis, à Hugh de Lacy, et il est rentré chez lui en avril 1172."
"The barons kept pushing outwards. De Lacy’s men killed Tigernán Ua Ruairc at a parley in 1172, and Strongbow raided Offaly. When many Normans left in 1173 to fight in the great revolt against Henry, the Irish struck back. In 1174 Domnall Ua Briain of Thomond beat Strongbow’s army at Thurles, the townsmen of Waterford killed its garrison, and Ruaidrí’s army destroyed the castles at Trim and Duleek and marched on Dublin before reinforcements arrived. By the Treaty of Windsor of 6 October 1175 Henry kept Dublin, Meath, Leinster and Waterford to Dungarvan, while Ruaidrí ruled the rest as his vassal and paid a tribute in hides. It soon broke down as the barons pushed on.": "De Lacy, les hommes tuèrent Tigernán Ua Ruairc à un parloir en 1172, et Strongbow fit une descente à Offaly. Quand de nombreux Normands partirent en 1173 pour se battre dans la grande révolte contre Henry, les Irlandais renversèrent. En 1174, Domnall Ua Briain de Thomond battit l’armée de Strongbow à Thurles, les habitants de Waterford tuèrent sa garnison, et l’armée de Ruaidrís détruisit les châteaux de Trim et Duleek et marcha sur Dublin avant que des renforts n’arrivent. Par le traité de Windsor du 6 octobre 1175, Henry garda Dublin, Meath, Leinster et Waterford à Dungarvan, tandis que Ruaidrí gouvernait le reste comme son vassal et rendait un hommage en cachette."
