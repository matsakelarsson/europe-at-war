# French translations of the catalogue text (wave 12); step bodies follow later.
Norman conquests in Ifriqiya: Conquêtes normandes en Ifriqiya
The conquest of the coast of Ifriqiya and Tripolitania by the Norman kings of Sicily, and its loss to the Almohads. Weakened by the Hilalian migration, famine and civil strife, the Zirid emirs of Mahdia came to depend on Sicilian grain and trade. After a failed landing near Mahdia in 1123, Roger II took the island of Djerba in 1135 and Tripoli in 1146, and in June 1148 his admiral George of Antioch occupied Mahdia, the Zirid capital, without a fight, followed by Sousse, Sfax and Gabès. Roger styled himself king of Africa and ruled the towns through Muslim governors and judges, in return for tribute. From 1156 the towns rose against William I, Roger’s successor, and asked the Almohad caliph Abd al-Mu’min for help. His army and fleet took Tunis in 1159 and besieged Mahdia, whose Norman garrison surrendered in January 1160 and was allowed to sail home, ending the Norman kingdom in Africa.: La conquête des côtes de l’Ifriqiya et de la Tripolitaine par les rois normands de Sicile, et leur perte au profit des Almohades. Affaiblis par la migration hilalienne, la famine et les luttes intestines, les émirs zirides de Mahdia en vinrent à dépendre du blé et du commerce siciliens. Après un débarquement manqué près de Mahdia en 1123, Roger II prit l’île de Djerba en 1135 et Tripoli en 1146 et, en juin 1148, son amiral Georges d’Antioche occupa sans combat Mahdia, la capitale ziride, puis Sousse, Sfax et Gabès. Roger prit le titre de roi d’Afrique et gouverna les villes par l’intermédiaire de gouverneurs et de juges musulmans, en échange d’un tribut. À partir de 1156, les villes se soulevèrent contre Guillaume Ier, successeur de Roger, et demandèrent l’aide du calife almohade Abd al-Mu’min. Son armée et sa flotte prirent Tunis en 1159 et assiégèrent Mahdia, dont la garnison normande se rendit en janvier 1160 et fut autorisée à rentrer par la mer, ce qui mit fin au royaume normand d’Afrique.
