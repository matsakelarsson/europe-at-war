# French translations of the catalogue text (wave 14); step bodies follow later.
Norse encounters with the Skrælings in Vinland: Rencontres entre les Norrois et les Skrælings au Vinland
? The first recorded fighting between Europeans and the peoples of the Americas, during the Norse voyages from Greenland to the lands they called Helluland, Markland and Vinland in the early eleventh century. The two Icelandic sagas of Vinland, the Saga of the Greenlanders and the Saga of Erik the Red, written down some two centuries later, tell that Leif Eriksson’s brother Thorvald and his men killed eight people they found sleeping under three skin boats; the next day a large party attacked the Norse ships and Thorvald was killed by an arrow. A few years later Thorfinn Karlsefni tried to settle Vinland with, by one saga’s count, three ships and 140 or more people. At first they traded red cloth and milk for furs with the people the Norse called Skrælings, but after a quarrel, or by the other saga after a bull frightened them, the Skrælings came back in force; two Norse were killed and many of the attackers, and Karlsefni’s people, outnumbered and with no hope of help, went back to Greenland after about three years. The site at L’Anse aux Meadows in northern Newfoundland, where wood was cut with metal tools in 1021, is the only confirmed Norse site in North America outside Greenland. The people the Norse met in Vinland were probably ancestors of the Beothuk, the Innu or the Mi’kmaq; in Greenland, where the word skræling was later used for the Thule ancestors of the Inuit, the Norse traded and sometimes fought with them until the Norse settlements were abandoned in the fifteenth century.
: Les premiers combats connus entre des Européens et des peuples des Amériques, lors des voyages des Norrois partis du Groenland vers les terres qu’ils appelaient Helluland, Markland et Vinland, au début du XIe siècle. Les deux sagas islandaises du Vinland, la Saga des Groenlandais et la Saga d’Érik le Rouge, mises par écrit quelque deux siècles plus tard, racontent que Thorvald, le frère de Leif Eriksson, et ses hommes tuèrent huit personnes qu’ils avaient trouvées endormies sous trois bateaux de peau ; le lendemain, une troupe nombreuse attaqua les navires norrois et Thorvald fut tué d’une flèche. Quelques années plus tard, Thorfinn Karlsefni tenta de s’établir au Vinland avec, selon le décompte de l’une des sagas, trois navires et 140 personnes ou plus. Ils échangèrent d’abord du drap rouge et du lait contre des fourrures avec ceux que les Norrois appelaient Skrælings, mais après une querelle ou, selon l’autre saga, après qu’un taureau les eut effrayés, les Skrælings revinrent en force ; deux Norrois furent tués, ainsi que beaucoup d’assaillants, et les gens de Karlsefni, inférieurs en nombre et sans espoir de secours, regagnèrent le Groenland au bout d’environ trois ans. Le site de L’Anse aux Meadows, dans le nord de Terre-Neuve, où du bois fut coupé avec des outils de métal en 1021, est le seul site norrois attesté en Amérique du Nord en dehors du Groenland. Les gens que les Norrois rencontrèrent au Vinland étaient probablement des ancêtres des Béothuks, des Innus ou des Micmacs ; au Groenland, où le mot skræling désigna plus tard les ancêtres thuléens des Inuits, les Norrois commercèrent et se battirent parfois avec ces derniers jusqu’à l’abandon des établissements norrois au XVe siècle.
