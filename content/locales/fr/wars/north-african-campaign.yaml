# French translations of the catalogue text (wave 12); step bodies follow later.
North African campaign: Campagne d’Afrique du Nord
? The Second World War in North Africa, fought from June 1940 to May 1943 between the British Commonwealth, Free France and from 1942 the United States on one side and Italy and Germany on the other. Italy invaded Egypt from Libya in September 1940 and was routed in Operation Compass. German forces under Erwin Rommel arrived in 1941, and for two years the armies swung back and forth along the coast road of Libya and western Egypt, around the besieged port of Tobruk, until the Axis advance was stopped at El Alamein in July 1942. Bernard Montgomery’s Eighth Army broke the Axis line at El Alamein in November 1942, just as American and British troops landed in Vichy French Morocco and Algeria in Operation Torch. Germany and Italy poured troops into Tunisia, where they held out until 13 May 1943, when some 250,000 of their soldiers surrendered. The war was fought across the lands of Libyans, Egyptians, Tunisians, Algerians and Moroccans, many of whom served in the armies on both sides; the Jews of Libya and Tunisia suffered persecution, internment and forced labour.
: La Seconde Guerre mondiale en Afrique du Nord, menée de juin 1940 à mai 1943 entre le Commonwealth britannique, la France libre et, à partir de 1942, les États-Unis d’un côté, et l’Italie et l’Allemagne de l’autre. L’Italie envahit l’Égypte depuis la Libye en septembre 1940 et fut mise en déroute lors de l’opération Compass. Des forces allemandes commandées par Erwin Rommel arrivèrent en 1941 et, pendant deux ans, les armées avancèrent et reculèrent tour à tour le long de la route côtière de la Libye et de l’ouest de l’Égypte, autour du port assiégé de Tobrouk, jusqu’à ce que l’avance de l’Axe soit arrêtée à El-Alamein en juillet 1942. La 8e armée de Bernard Montgomery enfonça la ligne de l’Axe à El-Alamein en novembre 1942, au moment même où des troupes américaines et britanniques débarquaient au Maroc et en Algérie, sous l’autorité de la France de Vichy, lors de l’opération Torch. L’Allemagne et l’Italie envoyèrent massivement des troupes en Tunisie, où elles tinrent jusqu’au 13 mai 1943, date à laquelle quelque 250 000 de leurs soldats se rendirent. La guerre se déroula sur les terres des Libyens, des Égyptiens, des Tunisiens, des Algériens et des Marocains, dont beaucoup servirent dans les armées des deux camps ; les Juifs de Libye et de Tunisie subirent persécutions, internement et travail forcé.
