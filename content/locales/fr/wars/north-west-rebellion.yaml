# French translations of the catalogue text (wave 14); step bodies follow later.
North-West Rebellion: Rébellion du Nord-Ouest
? The armed resistance of the Métis of the Saskatchewan valley, led by Louis Riel and Gabriel Dumont, and of some Cree and Assiniboine (Nakoda) bands against the government of Canada in the spring of 1885, also called the North-West Resistance. The Métis, many of whom had left Manitoba after 1870, petitioned in vain for title to their river-lot farms, while the Cree, Assiniboine and other First Nations of the plains, who had signed Treaty 6 in 1876, were starving after the buffalo disappeared and the government cut their rations. Riel, called back from Montana, declared a provisional government at Batoche on 19 March 1885, and on 26 March the Métis defeated the North-West Mounted Police at Duck Lake. Warriors of Big Bear’s band killed nine men at Frog Lake on 2 April, and Cree and Assiniboine looted Battleford. The government sent some 5,000 troops west, many of them by the nearly finished Canadian Pacific Railway. The Métis stopped General Frederick Middleton at Fish Creek on 24 April, and Cree and Assiniboine under Fine Day drove off Colonel William Otter at Cut Knife on 2 May, but Middleton took Batoche on 12 May, and Riel surrendered. Poundmaker gave himself up on 26 May, Big Bear on 2 July. Riel was hanged for high treason at Regina on 16 November 1885, and eight Cree and Assiniboine men were hanged at Battleford on 27 November, the largest mass execution in Canadian history. The conflict confirmed Canadian control of the prairies, deepened the divide between English and French Canada and was followed by harsh controls on the First Nations of the plains.
: La résistance armée des Métis de la vallée de la Saskatchewan, menés par Louis Riel et Gabriel Dumont, et de quelques bandes cries et assiniboines (nakodas) contre le gouvernement du Canada au printemps 1885, appelée aussi résistance du Nord-Ouest. Les Métis, dont beaucoup avaient quitté le Manitoba après 1870, demandaient en vain des titres de propriété pour leurs terres en lots riverains, tandis que les Cris, les Assiniboines et d’autres Premières Nations des Plaines, signataires du Traité n° 6 en 1876, souffraient de la famine depuis la disparition des bisons et la réduction de leurs rations par le gouvernement. Rappelé du Montana, Riel proclama un gouvernement provisoire à Batoche le 19 mars 1885 et, le 26 mars, les Métis battirent la Police à cheval du Nord-Ouest à Duck Lake. Des guerriers de la bande de Gros-Ours tuèrent neuf hommes à Frog Lake le 2 avril, et des Cris et des Assiniboines pillèrent Battleford. Le gouvernement envoya quelque 5 000 soldats vers l’ouest, dont beaucoup par le chemin de fer Canadien Pacifique, alors presque achevé. Les Métis arrêtèrent le général Frederick Middleton à Fish Creek le 24 avril, et des Cris et des Assiniboines menés par Fine Day repoussèrent le colonel William Otter à Cut Knife le 2 mai, mais Middleton prit Batoche le 12 mai, et Riel se rendit. Poundmaker se livra le 26 mai, Gros-Ours le 2 juillet. Riel fut pendu pour haute trahison à Regina le 16 novembre 1885, et huit hommes cris et assiniboines furent pendus à Battleford le 27 novembre, la plus grande exécution collective de l’histoire du Canada. Le conflit confirma l’emprise canadienne sur les Prairies, creusa le fossé entre le Canada anglais et le Canada français et fut suivi de contrôles sévères imposés aux Premières Nations des Plaines.
