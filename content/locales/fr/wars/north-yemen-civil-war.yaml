# French translations of the catalogue text (wave 7); step bodies follow later.
North Yemen Civil War: Guerre civile du Yémen du Nord
The war between the Yemen Arab Republic, proclaimed by army officers who overthrew the Zaydi imam Muhammad al-Badr on 26 September 1962, and the royalists who rallied to the imam in the northern highlands. Egypt under Gamal Abdel Nasser sent an expeditionary force that grew to some 70,000 men to defend the republic, while Saudi Arabia, Jordan and, covertly, Britain armed the royalists, making the war a proxy struggle between Arab republics and monarchies, sometimes called “Egypt’s Vietnam”. Egyptian forces held the towns and roads but could not defeat the tribes, and used chemical weapons. After its defeat by Israel in June 1967 Egypt agreed to withdraw; the republicans held Sanaa through a 70-day royalist siege in 1967–1968, and in 1970 a compromise brought royalists into the government and Saudi recognition of the republic. Estimates of the dead range from about 100,000 to 200,000.: La guerre entre la République arabe du Yémen, proclamée par des officiers de l’armée qui renversèrent l’imam zaydite Muhammad al-Badr le 26 septembre 1962, et les royalistes qui se rallièrent à l’imam dans les hautes terres du nord. L’Égypte de Gamal Abdel Nasser envoya un corps expéditionnaire qui atteignit quelque 70 000 hommes pour défendre la république, tandis que l’Arabie saoudite, la Jordanie et, en secret, la Grande-Bretagne armaient les royalistes, faisant de la guerre un affrontement par procuration entre républiques et monarchies arabes, parfois appelé le « Vietnam de l’Égypte ». Les forces égyptiennes tenaient les villes et les routes mais ne parvinrent pas à vaincre les tribus, et elles utilisèrent des armes chimiques. Après sa défaite face à Israël en juin 1967, l’Égypte accepta de se retirer ; les républicains résistèrent dans Sanaa à un siège royaliste de 70 jours en 1967–1968 et, en 1970, un compromis fit entrer des royalistes au gouvernement et valut à la république la reconnaissance saoudienne. Les estimations du nombre de morts vont d’environ 100 000 à 200 000.
