# French translations of the catalogue text (wave 9); step bodies follow later.
Northern Expedition: Expédition du Nord
? "The campaign in which the Kuomintang’s National Revolutionary Army marched from Guangzhou to Beijing in 1926–1928, defeated the warlord armies of Wu Peifu, Sun Chuanfang and Zhang Zuolin, and brought China under the Nationalist government in Nanjing. Launched on 9 July 1926 with about 100,000 men, Soviet advisers and Chinese Communists inside the alliance of the first united front, it took Hunan and Hubei in the summer and autumn of 1926 and Jiangxi, Fujian and Zhejiang by early 1927. When it reached Shanghai and Nanjing in March 1927, the movement split: Chiang Kai-shek turned on the Communists in the Shanghai massacre of 12 April and set up his own government in Nanjing, against the left-wing Kuomintang government in Wuhan, which broke with the Communists in July. Reunited under Chiang and joined by Feng Yuxiang, Yan Xishan and the Guangxi clique, the Nationalist armies, about a million men, resumed the advance in April 1928. Japanese troops clashed with them at Jinan in May, killing thousands of Chinese, and on 4 June officers of Japan’s Kwantung Army killed Zhang Zuolin by blowing up his train as he withdrew to Manchuria. Beijing was taken in June and renamed Beiping, and on 29 December 1928 Zhang’s son Zhang Xueliang raised the Nationalist flag over the north-east. Estimates of deaths, including civilians, range from about 370,000 to over 900,000."
: "La campagne au cours de laquelle l’Armée nationale révolutionnaire du Kuomintang marcha de Canton à Pékin en 1926–1928, battit les armées des seigneurs de la guerre Wu Peifu, Sun Chuanfang et Zhang Zuolin, et plaça la Chine sous l’autorité du gouvernement nationaliste de Nankin. Lancée le 9 juillet 1926 avec environ 100 000 hommes, des conseillers soviétiques et des communistes chinois membres de l’alliance du premier front uni, elle prit le Hunan et le Hubei à l’été et à l’automne 1926, puis le Jiangxi, le Fujian et le Zhejiang au début de 1927. Lorsqu’elle atteignit Shanghai et Nankin en mars 1927, le mouvement se divisa : Tchang Kaï-chek se retourna contre les communistes lors du massacre de Shanghai du 12 avril et établit son propre gouvernement à Nankin, face au gouvernement du Kuomintang de gauche installé à Wuhan, qui rompit avec les communistes en juillet. Réunies sous Tchang et rejointes par Feng Yuxiang, Yan Xishan et la clique du Guangxi, les armées nationalistes, fortes d’environ un million d’hommes, reprirent leur avance en avril 1928. Des troupes japonaises les affrontèrent à Jinan en mai, tuant des milliers de Chinois, et le 4 juin des officiers de l’armée japonaise du Kwantung tuèrent Zhang Zuolin en faisant sauter son train alors qu’il se repliait en Mandchourie. Pékin fut prise en juin et rebaptisée Beiping, et le 29 décembre 1928 le fils de Zhang, Zhang Xueliang, hissa le drapeau nationaliste sur le Nord-Est. Les estimations du nombre de morts, civils compris, vont d’environ 370 000 à plus de 900 000."
