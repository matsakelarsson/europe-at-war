# French translations of the catalogue text (wave 10); step bodies follow later.
Northern Limit Line clashes: Affrontements de la ligne de limite du Nord
? A series of armed clashes between North and South Korea in the Yellow Sea (West Sea) along the Northern Limit Line (NLL), the sea boundary that the UN Command drew after the armistice of 1953 and that North Korea does not recognise. The line keeps five islands off the North Korean coast, among them Baengnyeong and Yeonpyeong, under South Korean control, and runs through rich crab grounds. Naval battles near Yeonpyeong in June 1999 and June 2002, both fought when North Korean patrol boats crossed the line with fishing boats, cost a North Korean torpedo boat and a South Korean patrol boat and dozens of lives, and a further clash followed near Daecheong in November 2009. On 26 March 2010 the South Korean corvette Cheonan broke in two and sank near Baengnyeong with the loss of 46 sailors; an international investigation led by South Korea blamed a North Korean torpedo, which North Korea denies. On 23 November 2010 North Korean artillery shelled Yeonpyeong Island, killing two marines and two civilians, the first attack on South Korean civilians on land since the Korean War.
: "Une série d’affrontements armés entre la Corée du Nord et la Corée du Sud en mer Jaune (mer de l’Ouest) le long de la ligne de limite du Nord (NLL), la frontière maritime que le Commandement des Nations unies traça après l’armistice de 1953 et que la Corée du Nord ne reconnaît pas. La ligne maintient sous contrôle sud-coréen cinq îles situées au large de la côte nord-coréenne, parmi lesquelles Baengnyeong et Yeonpyeong, et traverse de riches zones de pêche au crabe. Des batailles navales près de Yeonpyeong en juin 1999 et en juin 2002, livrées toutes deux lorsque des patrouilleurs nord-coréens franchirent la ligne avec des bateaux de pêche, coûtèrent un torpilleur nord-coréen, un patrouilleur sud-coréen et des dizaines de vies, et un nouvel affrontement eut lieu près de Daecheong en novembre 2009. Le 26 mars 2010, la corvette sud-coréenne Cheonan se brisa en deux et coula près de Baengnyeong, entraînant la mort de 46 marins ; une enquête internationale menée par la Corée du Sud attribua le naufrage à une torpille nord-coréenne, ce que la Corée du Nord dément. Le 23 novembre 2010, l’artillerie nord-coréenne bombarda l’île de Yeonpyeong, tuant deux fusiliers marins et deux civils : ce fut la première attaque contre des civils sud-coréens sur terre depuis la guerre de Corée."
