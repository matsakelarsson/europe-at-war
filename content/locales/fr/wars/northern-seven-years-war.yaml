"1566–1570": "1566–1570"
"In the winter of 1567–68 Daniel Rantzau led some 4,000 men on one of the most destructive raids of the war, deep into central Sweden, until supply problems forced him back. The Swedes in turn attacked south-eastern Norway in 1567, took Hamar and besieged Akershus. In 1568 Eric XIV, by now unstable and guilty of murdering nobles, was deposed by his brothers.": "À l’hiver de 1567–1568, Daniel Rantzau conduisit quelque 4 000 hommes dans l’un des raids les plus destructeurs de la guerre, au centre de la Suède, jusqu’à ce que les problèmes d’approvisionnement le contraignent à revenir. Les Suédois attaquèrent à leur tour le sud-est de la Norvège en 1567, prirent Hamar et assiégèrent Akershus."
"Peace came at Stettin on 13 December 1570. No land changed hands, but Sweden had to buy back Älvsborg for 150,000 riksdaler, the First Älvsborg Ransom.": "La paix est venue à Stettin le 13 décembre 1570. Aucune terre n’a changé de mains, mais la Suède a dû racheter Älvsborg pour 150 000 raksdaler, le premier Älvsborg Ransom."
