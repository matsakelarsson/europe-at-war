"1567": "1567"
"Northern Seven Years’ War": "Sept ans de guerre dans le Nord"
"A war between Sweden and an alliance of Denmark–Norway, Lübeck and Poland–Lithuania over the control of the Baltic and the legacy of the Kalmar Union. After seven years of destructive fighting the Peace of Stettin in 1570 left the borders unchanged, but Sweden had to pay a ransom for the fortress of Älvsborg.": "Une guerre entre la Suède et une alliance Danemark-Norvège, Lübeck et Pologne-Lituanie sur le contrôle de la Baltique et l’héritage de l’Union Kalmar. Après sept années de lutte destructrice contre la paix de Stettin en 1570 a laissé les frontières inchangées, mais la Suède a dû payer une rançon pour la forteresse d’Älvsborg."
"Dates in Germany and Poland are New Style (Gregorian); Scandinavian dates are mostly Old Style (Julian), as usually cited, which ran ten days behind.": "Les dates en Allemagne et en Pologne sont New Style (Gregorian) ; les dates scandinaves sont pour la plupart Old Style (Julian), comme on le cite habituellement, qui a duré dix jours."
