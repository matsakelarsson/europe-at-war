"1563–1565": "1563–1565"
"Frederick II of Denmark resented the end of the Kalmar Union, and Eric XIV of Sweden wanted to break Denmark’s hold on the Baltic. Denmark–Norway, Lübeck and Poland–Lithuania went to war with Sweden in 1563. The Danes took Älvsborg, Sweden’s only port on the west coast, in September 1563, and beat a Swedish force at Mared in November.": "Frederick II du Danemark a ressenti la fin de l’Union Kalmar, et Eric XIV de la Suède a voulu briser le Danemark sur la mer Baltique. Danemark-Norvège, Lübeck et Pologne-Lituanie sont allés en guerre contre la Suède en 1563. Les Danois ont pris Älvsborg, Suède , seulement port sur la côte ouest, en septembre 1563, et battu une force suédoise à Mared en Novembre."
"The Swedes did better at sea, and in August 1565 they took the Halland fortress of Varberg. But on 20 October 1565 a Danish army under Daniel Rantzau defeated a larger Swedish army at Axtorna nearby, the only major land battle of the war.": "Les Suédois firent mieux en mer, et en août 1565 ils prirent la forteresse Halland de Varberg. Mais le 20 octobre 1565 une armée danoise sous Daniel Rantzau battit une plus grande armée suédoise à Axtorna, la seule bataille terrestre majeure de la guerre."
