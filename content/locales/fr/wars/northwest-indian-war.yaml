# French translations of the catalogue text (wave 14); step bodies follow later.
Northwest Indian War: Guerre amérindienne du Nord-Ouest
? The war between the United States and a confederacy of Native nations of the Great Lakes and the Ohio country for the land north-west of the Ohio River. At the peace of 1783 Britain gave the United States a claim to the region, but the Shawnee, Miami (Myaamia), Lenape, Wyandot, Odawa, Ojibwe, Potawatomi and others who lived there had not been defeated. They rejected the land cessions that American commissioners dictated to a few of their leaders in 1784–1786, insisted that the Ohio River was the boundary, and, supplied from the British posts that Britain kept on American soil, fought the settlers who crossed it. Under the Miami leader Little Turtle and the Shawnee leader Blue Jacket the Western Confederacy defeated Josiah Harmar’s expedition in 1790 and destroyed Arthur St. Clair’s army on 4 November 1791, killing more than 600 soldiers, the heaviest defeat the United States Army ever suffered at the hands of Native forces. Anthony Wayne then built a new, trained army, the Legion of the United States, held off an attack on Fort Recovery and on 20 August 1794 broke the confederacy’s forces at Fallen Timbers, near a British fort whose gates stayed shut. By the Treaty of Greenville of 3 August 1795 the nations ceded most of present-day Ohio.
: "La guerre entre les États-Unis et une confédération de nations autochtones des Grands Lacs et du pays de l’Ohio pour les terres situées au nord-ouest de l’Ohio. À la paix de 1783, la Grande-Bretagne avait reconnu aux États-Unis un droit sur la région, mais les Shawnees, les Miamis (Myaamia), les Lenapes, les Wyandots, les Outaouais, les Ojibwés, les Potawatomis et les autres peuples qui y vivaient n’avaient pas été vaincus. Ils rejetèrent les cessions de terres que des commissaires américains imposèrent à quelques-uns de leurs chefs en 1784–1786, exigèrent que l’Ohio serve de frontière et, ravitaillés depuis les postes que la Grande-Bretagne conservait en territoire américain, combattirent les colons qui le franchissaient. Sous la conduite du chef miami Little Turtle et du chef shawnee Blue Jacket, la Confédération de l’Ouest battit l’expédition de Josiah Harmar en 1790 et anéantit l’armée d’Arthur St. Clair le 4 novembre 1791, tuant plus de 600 soldats : ce fut la plus lourde défaite jamais subie par l’armée des États-Unis face à des forces autochtones. Anthony Wayne forma alors une nouvelle armée entraînée, la Légion des États-Unis, repoussa une attaque contre Fort Recovery et, le 20 août 1794, brisa les forces de la confédération à Fallen Timbers, près d’un fort britannique dont les portes restèrent closes. Par le traité de Greenville du 3 août 1795, les nations cédèrent la plus grande partie de l’actuel Ohio."
Western Confederacy (Shawnee, Miami, Lenape, Wyandot, Odawa, Ojibwe, Potawatomi, Mingo, Kickapoo and others): Confédération de l’Ouest (Shawnees, Miamis, Lenapes, Wyandots, Outaouais, Ojibwés, Potawatomis, Mingos, Kickapous et d’autres)
United States (the Army, the Legion of the United States and Kentucky militia, with Chickasaw and Choctaw scouts): États-Unis (armée, Légion des États-Unis et milice du Kentucky, avec des éclaireurs chicachas et chactas)
Great Britain (posts on American soil, supplies and agents; not at war): Grande-Bretagne (postes en territoire américain, ravitaillement et agents ; pas en guerre)
