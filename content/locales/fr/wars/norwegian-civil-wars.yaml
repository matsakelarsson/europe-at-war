# Some French text was translated automatically.
"Norwegian civil wars": "Guerres civiles norvégiennes"
"More than a century of wars between rival kings and pretenders to the Norwegian throne, begun when Harald Gille broke his oath and claimed the crown on the death of Sigurd the Crusader in 1130. From the 1170s the wars were fought between two parties, the Birkebeiner, who brought King Sverre to power, and the church-backed Bagler. The parties were reconciled in 1217 under Haakon IV, and the defeat of Duke Skule Bårdsson’s rising in 1240 ended the era, leaving a stronger monarchy and clearer rules of succession.": "Plus d’un siècle de guerres entre rois rivaux et prétendants sur le trône norvégien, commencé lorsque Harald Gille a rompu son serment et revendiqué la couronne à la mort de Sigurd le croisé en 1130. Dès les années 1170, les guerres ont été menées entre deux partis, le Birkebeiner, qui a amené le roi Sverre au pouvoir, et l’église-appuie Bagler. Les partis se réconcilièrent en 1217 sous Haakon IV, et la défaite du Duc Skule Bårdsson, qui s’élevait en 1240, mit fin à l’ère, laissant une monarchie plus forte et des règles de succession plus claires."
"The main sources are the kings’ sagas, notably Snorri Sturluson’s Heimskringla and Sverris saga, which was written with King Sverre’s help. Some two dozen kings and pretenders took part, and the parties changed over time, so they are not shown as fixed sides here.": "Les principales sources sont les sagas de rois, notamment Snorri Sturluson , Heimskringla et Sverris saga, qui a été écrit avec l’aide du roi Sverre , quelque deux douzaines de rois et de prétendants ont pris part, et les parties ont changé au fil du temps, donc ils ne sont pas montrés comme des côtés fixes ici."
