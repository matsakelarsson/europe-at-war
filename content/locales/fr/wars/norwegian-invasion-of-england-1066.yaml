"September 1066": "septembre 1066"
"When Edward the Confessor died in January 1066, the English chose Harold Godwinson as king. Two foreign rulers also claimed the throne, William of Normandy and Harald Hardrada of Norway, a veteran warrior who had served the Byzantine emperor. Harold’s brother Tostig, driven out as earl of Northumbria in 1065, had raided the English coast that spring and now joined Hardrada. In September a Norwegian fleet, 300 ships according to the Chronicle, sailed by way of Orkney to the coast of Yorkshire.": "Lorsque Edward le Confesseur est mort en janvier 1066, les Anglais ont choisi Harold Godwinson comme roi. Deux dirigeants étrangers ont également revendiqué le trône, William de Normandie et Harald Hardrada de Norvège, un guerrier vétéran qui avait servi l’empereur byzantin. En septembre, une flotte norvégienne, 300 navires selon la Chronique, navigua en passant par Orkney jusqu’à la côte du Yorkshire."
"The fleet rowed up the Humber and the Ouse to Riccall, south of York. On 20 September the northern earls, Edwin of Mercia and Morcar of Northumbria, met the invaders at Fulford, just outside the city. After heavy fighting on both sides the English broke. York surrendered on condition that it would not be sacked, and agreed to hand over hostages and supplies. The Norwegians went back to their ships to wait.": "La flotte rama le Humber et l’Ouse à Riccall, au sud de York. Le 20 septembre, les comtes du nord, Edwin de la Mercie et Morcar de Northumbria, rencontrèrent les envahisseurs à Fulford, juste en dehors de la ville. Après de violents combats des deux côtés, les Anglais se sont brisés. Les Norvégiens sont retournés à leurs navires pour attendre."
