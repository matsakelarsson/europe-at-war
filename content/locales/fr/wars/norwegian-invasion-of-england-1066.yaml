# Some French text was translated automatically.
"Norwegian invasion of England": "Invasion norvégienne de l’Angleterre"
"King Harald Hardrada of Norway invaded England in September 1066 to claim its throne, together with the exiled Earl Tostig. He won at Fulford but was killed with most of his army at Stamford Bridge by King Harold Godwinson, three weeks before Harold’s own defeat at Hastings.": "Le roi Harald Hardrada de Norvège a envahi l’Angleterre en septembre 1066 pour revendiquer son trône, avec l’exilé Earl Tostig. Il a gagné à Fulford mais a été tué avec la plupart de son armée au pont Stamford par le roi Harold Godwinson, trois semaines avant Harold , sa propre défaite à Hastings."
"The English sources are the Anglo-Saxon Chronicle and later Anglo-Norman writers; the Norwegian story is told in Snorri Sturluson’s saga of Harald Hardrada, written about 170 years later. Numbers of ships and men are uncertain.": "Les sources anglaises sont la Chronique anglo-saxonne et plus tard les écrivains anglo-normains ; l’histoire norvégienne est racontée dans la saga Snorri Sturluson, de Harald Hardrada, écrite environ 170 ans plus tard."
"The battle is traditionally seen as the end of the Viking Age, though Danish and Norwegian kings still sent fleets to Britain and Ireland in the following decades.": "La bataille est traditionnellement considérée comme la fin de l’âge viking, bien que les rois danois et norvégiens envoient encore des flottes en Grande-Bretagne et en Irlande dans les décennies suivantes."
