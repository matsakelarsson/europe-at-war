"25 September 1066": "25 septembre 1066"
"King Harold had spent the summer guarding the south coast against William. Hearing of the invasion, he marched north from London, covering some 185 miles in about four days, and passed through York on the morning of 25 September. The Norwegians had gone to Stamford Bridge on the Derwent to collect the hostages, many of them without their mail shirts in the warm weather. They were taken completely by surprise.": "Le roi Harold avait passé l’été à garder la côte sud contre William. En entendant parler de l’invasion, il marcha au nord de Londres, couvrant environ quatre jours et passa par York le matin du 25 septembre. Les Norvégiens étaient allés au pont Stamford sur le Derwent pour recueillir les otages, beaucoup d’entre eux sans leurs chemises postales par temps chaud. Ils avaient été pris complètement par surprise."
"The fighting lasted most of the day. Hardrada was killed early, struck in the throat by an arrow according to the sagas, and Tostig soon after. Men from the ships at Riccall under Eystein Orre ran to join the battle and were cut down in turn. Harold let the survivors, among them Hardrada’s son Olaf and the earl of Orkney, sail home; only 24 ships were needed to carry them. Three days later William landed in Sussex, and on 14 October Harold was killed at Hastings.": "Les combats durent la plupart de la journée. Hardrada fut tué tôt, frappé dans la gorge par une flèche selon les sagas, et Tostig peu après. Des hommes des navires à Riccall sous Eystein Orre couraient pour rejoindre la bataille et ont été coupés à leur tour. Harold laissa les survivants, parmi eux le fils de Hardradau Olaf et le comte d’Orkney, naviguer à la maison ; seulement 24 navires étaient nécessaires pour les transporter. Trois jours plus tard, William débarqua à Sussex, et le 14 octobre Harold fut tué à Hastings."
