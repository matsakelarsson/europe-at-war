"A rising in Russian-ruled Congress Poland that began with an attack by officer cadets in Warsaw on 29 November 1830 and grew into a full war between the kingdom’s army and the Russian Empire. After hard-fought battles at Olszynka Grochowska and Ostrołęka, Russian troops took Warsaw in September 1831; the kingdom lost its constitution and army, and thousands of Poles went into exile in the Great Emigration.": "Une montée au Congrès russe Pologne qui a commencé avec une attaque par des officiers cadets à Varsovie le 29 Novembre 1830 et est devenu une guerre complète entre l’armée du royaume et l’Empire russe. Après des batailles acharnées à Olszynka Grochowska et Ostrołęka, les troupes russes ont pris Varsovie en septembre 1831 ; le royaume a perdu sa constitution et son armée, et des milliers de Polonais sont allés en exil dans la Grande Emigration."
"Dates are New Style (Gregorian), as used in the Kingdom of Poland. Russia still used the Julian calendar, then 12 days behind.": "Les dates sont New Style (Gregorian), comme utilisé dans le Royaume de Pologne. La Russie utilise toujours le calendrier julien, puis 12 jours derrière."
"Casualty figures for the battles vary between sources and are given here as approximate.": "Les chiffres des pertes pour les batailles varient d’une source à l’autre et sont donnés ici comme approximatifs."
