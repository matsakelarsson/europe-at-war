"In the spring the new Polish commander, General Jan Skrzynecki, won at Wawer and Dębe Wielkie on 31 March and at Iganie on 10 April, but did not follow up his successes. Risings broke out in Lithuania, where Countess Emilia Plater led a partisan unit, and in Volhynia and Podolia, but they were put down. On 26 May Diebitsch caught Skrzynecki’s army at Ostrołęka on the Narew; the Poles lost about 8,000 men and fell back on Warsaw.": "Au printemps, le nouveau commandant polonais, le général Jan Skrzynecki, a gagné à Wawer et Dębe Wielkie le 31 mars et à Iganie le 10 avril, mais n’a pas suivi ses succès. Le soulèvement a éclaté en Lituanie, où la comtesse Emilia Plater a dirigé une unité partisane, et à Volhynia et Podolia, mais ils ont été abattus. Le 26 mai, Diebitsch a pris l’armée de Skrzynecki à Ostrołęka sur le Narew ; les Polonais ont perdu environ 8 000 hommes et sont retombés à Varsovie."
"Diebitsch died of cholera in June. His successor, Ivan Paskevich, marched west and crossed the Vistula close to the Prussian border to attack Warsaw from the west, while Prussia and Austria stayed benevolently neutral towards Russia. On 6 September the suburb of Wola fell after General Józef Sowiński was killed defending it, and that night Count Jan Krukowiecki capitulated. The army withdrew to Modlin and Płock, and on 5 October more than 20,000 men crossed into Prussia and laid down their arms.": "Diebitsch mourut du choléra en juin. Son successeur, Ivan Paskevitch, marcha à l’ouest et traversa la Vistule près de la frontière prussienne pour attaquer Varsovie depuis l’ouest, tandis que la Prusse et l’Autriche demeurèrent neutres envers la Russie. Le 6 septembre, la banlieue de Wola tomba après que le général Józef Sowiński fut tué pour la défendre, et cette nuit-là le comte Jan Krukowiecki capitula. L’armée s’est retirée à Modlin et Płock, et le 5 octobre plus de 20 000 hommes ont traversé la Prusse et déposé leurs armes."
