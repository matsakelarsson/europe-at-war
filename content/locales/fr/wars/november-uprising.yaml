"Congress Poland, the kingdom created at the Congress of Vienna in 1815, had its own constitution, parliament and army, but its king was the Russian tsar, and his brother Grand Duke Constantine commanded the army. On the evening of 29 November 1830 officer cadets led by Piotr Wysocki attacked Constantine’s residence, the Belweder palace in Warsaw, while crowds seized the Arsenal. Constantine escaped and left the city with his Russian troops, and the Polish army went over to the rising.": "Congrès La Pologne, le royaume créé au congrès de Vienne en 1815, avait sa propre constitution, parlement et armée, mais son roi était le tsar russe, et son frère Grand-Duc Constantin commandait l’armée. Le soir du 29 novembre 1830, des officiers cadets dirigés par Piotr Wysocki attaquèrent la résidence de Constantin, le palais Belweder à Varsovie, tandis que les foules s’emparaient de l’Arsenal. Constantin s’est échappé et a quitté la ville avec ses troupes russes, et l’armée polonaise est passée à la montée."
"General Józef Chłopicki took power as dictator on 5 December and tried to negotiate, but Tsar Nicholas I demanded unconditional surrender. On 25 January 1831 the Sejm declared Nicholas dethroned, and on 4 February Field Marshal Hans Karl von Diebitsch crossed the border with about 115,000 men. Polish cavalry under Józef Dwernicki won at Stoczek, and on 25 February about 40,000 Poles held off some 60,000 Russians at Olszynka Grochowska outside Warsaw. Both sides lost more than 7,000 men.": "Le général Józef Chłopicki prit le pouvoir en tant que dictateur le 5 décembre et tenta de négocier, mais le tsar Nicolas I demanda la reddition inconditionnelle.Le 25 janvier 1831, le Sejm déclara Nicholas détrôné, et le 4 février, le maréchal Hans Karl von Diebitsch passa la frontière avec environ 115 000 hommes. La cavalerie polonaise sous Józef Dwernicki a gagné à Stoczek, et le 25 février, environ 40 000 Polonais ont disputé quelque 60 000 Russes à Olszynka Grochowska en dehors de Varsovie. Les deux camps ont perdu plus de 7 000 hommes."
