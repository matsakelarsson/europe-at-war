"Nicholas I abolished the kingdom’s constitution. The Organic Statute of 1832 kept some separate institutions but ended the Sejm and the Polish army, and Warsaw University was closed. Estates of insurgents were confiscated, many participants were exiled to Siberia or conscripted into the Russian army, and a new citadel was built over Warsaw to hold the city down.": "Nicholas Ier abolit la constitution du royaume. Le Statut organique de 1832 conserva quelques institutions distinctes mais termina le Sejm et l’armée polonaise, et l’Université de Varsovie fut fermée. Des successions d’insurgés furent confisquées, de nombreux participants furent exilés en Sibérie ou conscrits dans l’armée russe, et une nouvelle citadelle fut construite au-dessus de Varsovie pour maintenir la ville."
"Thousands of soldiers, politicians and writers chose exile rather than submission. They crossed the German states in small groups, greeted by enthusiastic crowds, and most settled in France. In Paris Prince Adam Czartoryski led a conservative government-in-exile, later known by his house, the Hôtel Lambert, while the historian Joachim Lelewel led the democrats. The poets Adam Mickiewicz and Juliusz Słowacki made the emigration the centre of Polish literature for a generation.": "Des milliers de soldats, de politiciens et d’écrivains ont choisi l’exil plutôt que la soumission. Ils ont traversé les états allemands en petits groupes, accueillis par des foules enthousiastes, et les plus installés en France. A Paris le prince Adam Czartoryski a dirigé un gouvernement conservateur en exil, plus tard connu par sa maison, l’Hôtel Lambert, tandis que l’historien Joachim Lelewel dirigeait les démocrates. Les poètes Adam Mickiewicz et Juliusz Słowacki ont fait de l’émigration le centre de la littérature polonaise pour une génération."
