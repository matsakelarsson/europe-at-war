# French translations of the catalogue text (wave 13); step bodies follow later.
Nupe wars with Oyo: Guerres entre le Nupe et Oyo
? Wars between the Nupe kingdom, on the middle Niger, and the Yoruba kingdom of Oyo, which drove the alaafins (kings) of Oyo from their capital for about three quarters of a century. Oyo tradition, recorded by the Yoruba historian Samuel Johnson in the nineteenth century, tells that in the reign of Alaafin Onigbogi the Nupe, whom the Yoruba call Tapa, defeated Oyo’s armies, besieged the capital, Oyo-Ile, and entered it almost unopposed; the historian Robert Smith dates this to about 1535. Onigbogi fled to Borgu, where he died, and his son Ofinran led the court from place to place on the borders of Borgu and Yorubaland. Eguguojo founded a new capital at Igboho, protected by hills and three walls, where four alaafins were buried. Orompoto, whom some traditions remember as a woman, and Ajiboyede won victories over Borgu and the Nupe, and Oyo rearmed with horses and armour on the Nupe model; the cavalry it built up later made it the strongest power of the savanna west of the Niger. About 1610, in Smith’s chronology, Alaafin Abipa brought the court back to rebuild Oyo-Ile. All dates come from king lists and oral tradition and are approximate; other chronologies put the start of Onigbogi’s reign as early as about 1500.
: Des guerres entre le royaume nupe, sur le moyen Niger, et le royaume yoruba d’Oyo, qui chassèrent les alaafins (rois) d’Oyo de leur capitale pendant environ trois quarts de siècle. La tradition d’Oyo, recueillie au XIXe siècle par l’historien yoruba Samuel Johnson, rapporte que sous le règne de l’alaafin Onigbogi les Nupe, que les Yoruba appellent Tapa, vainquirent les armées d’Oyo, assiégèrent la capitale, Oyo-Ile, et y entrèrent presque sans résistance ; l’historien Robert Smith situe ces événements vers 1535. Onigbogi s’enfuit au Borgou, où il mourut, et son fils Ofinran conduisit la cour de lieu en lieu aux confins du Borgou et du pays yoruba. Eguguojo fonda une nouvelle capitale à Igboho, protégée par des collines et trois enceintes, où quatre alaafins furent inhumés. Orompoto, dont certaines traditions font une femme, et Ajiboyede remportèrent des victoires sur le Borgou et les Nupe, et Oyo se réarma de chevaux et d’armures sur le modèle nupe ; la cavalerie ainsi constituée en fit plus tard la première puissance de la savane à l’ouest du Niger. Vers 1610, dans la chronologie de Smith, l’alaafin Abipa ramena la cour pour reconstruire Oyo-Ile. Toutes les dates proviennent de listes royales et de la tradition orale et sont approximatives ; d’autres chronologies font commencer le règne d’Onigbogi dès 1500 environ.
