# French translations of the catalogue text (wave 10); step bodies follow later.
Oda Nobunaga’s campaigns: Campagnes d’Oda Nobunaga
? The wars by which Oda Nobunaga, lord of Owari and Mino, made himself master of central Japan between 1568 and 1582, the first stage of the unification of the country after a century of civil war. In 1568 he marched on Kyoto and installed Ashikaga Yoshiaki as shogun, but within two years he faced a coalition of the Azai and Asakura, the Miyoshi, the Ikkō-ikki of the Hongan-ji, the monks of Mount Hiei, Takeda Shingen and finally the shogun himself. He burned the monastery of Enryaku-ji in 1571, survived the advance of Shingen, who beat his ally Tokugawa Ieyasu at Mikatagahara in 1573, drove Yoshiaki out of Kyoto in the same year and destroyed the Asakura and Azai. In 1575 Oda and Tokugawa musketeers behind palisades broke the Takeda army at Nagashino. From his new castle at Azuchi, Nobunaga’s generals then fought the Uesugi in the north, the Mōri in the west and the Hongan-ji at Osaka, which surrendered in 1580. In the spring of 1582 his armies destroyed the Takeda; weeks later Nobunaga was killed at Honnō-ji by his general Akechi Mitsuhide.
: Les guerres par lesquelles Oda Nobunaga, seigneur de l’Owari et du Mino, se rendit maître du centre du Japon entre 1568 et 1582, première étape de l’unification du pays après un siècle de guerre civile. En 1568, il marcha sur Kyoto et installa Ashikaga Yoshiaki comme shogun, mais en moins de deux ans il dut faire face à une coalition réunissant les Azai et les Asakura, les Miyoshi, les Ikkō-ikki du Hongan-ji, les moines du mont Hiei, Takeda Shingen et finalement le shogun lui-même. Il incendia le monastère Enryaku-ji en 1571, survécut à l’avancée de Shingen, qui battit son allié Tokugawa Ieyasu à Mikatagahara en 1573, chassa Yoshiaki de Kyoto la même année et anéantit les Asakura et les Azai. En 1575, les arquebusiers des Oda et des Tokugawa, postés derrière des palissades, brisèrent l’armée des Takeda à Nagashino. Depuis son nouveau château d’Azuchi, Nobunaga lança ensuite ses généraux contre les Uesugi au nord, les Mōri à l’ouest et le Hongan-ji à Osaka, qui se rendit en 1580. Au printemps 1582, ses armées anéantirent les Takeda ; quelques semaines plus tard, Nobunaga fut tué au Honnō-ji par son général Akechi Mitsuhide.
