# French translations of the catalogue text (wave 10); step bodies follow later.
Ōei invasion (Gihae eastern expedition): Invasion d’Ōei (expédition orientale de Gihae)
? A Joseon expedition against the island of Tsushima, the main base of the wokou who raided Korea. In May 1419 a wokou fleet attacked Biin on the west coast of Korea and then Haeju. The retired king Taejong, who still controlled the army under his son Sejong, decided to strike the island while many of its fighting men were away raiding. On 11 July 1419 Yi Jong-mu sailed from Geoje with 227 ships and 17,285 men, and the next day the fleet landed in Asō Bay. The Koreans burned houses and ships, freed Chinese captives and fenced off the island’s narrow neck at Funakoshi. On 21 July a Korean column was ambushed at Nukadake and lost heavily, and with the typhoon season coming and the lord of the island, Sō Sadamori, asking for peace, the fleet sailed home on 25 July. Joseon dropped its demand that Tsushima submit, and the island’s trade with Korea was regulated through the Sō, by the Treaty of Gyehae in 1443. The invasion is known in Japan by its era name, Ōei, and in Korea as the eastern expedition of the gihae year.
: Une expédition du Joseon contre l’île de Tsushima, principale base des wokou qui lançaient des raids sur la Corée. En mai 1419, une flotte de wokou attaqua Biin, sur la côte ouest de la Corée, puis Haeju. Le roi retiré Taejong, qui contrôlait encore l’armée sous le règne de son fils Sejong, décida de frapper l’île pendant que nombre de ses combattants étaient partis en raid. Le 11 juillet 1419, Yi Jong-mu appareilla de Geoje avec 227 navires et 17 285 hommes, et le lendemain la flotte débarqua dans la baie d’Asō. Les Coréens incendièrent maisons et navires, libérèrent des captifs chinois et barrèrent l’isthme étroit de l’île à Funakoshi. Le 21 juillet, une colonne coréenne tomba dans une embuscade à Nukadake et subit de lourdes pertes et, comme la saison des typhons approchait et que le seigneur de l’île, Sō Sadamori, demandait la paix, la flotte rentra le 25 juillet. Le Joseon renonça à exiger la soumission de Tsushima, et le commerce de l’île avec la Corée fut réglementé par l’intermédiaire des Sō, par le traité de Gyehae en 1443. L’invasion est connue au Japon sous le nom de son ère, Ōei, et en Corée comme l’expédition orientale de l’année gihae.
