# French translations of the catalogue text (wave 10); step bodies follow later.
Ōei Rebellion: Rébellion d’Ōei
? "The rising of Ōuchi Yoshihiro against the retired shogun Ashikaga Yoshimitsu, ended by the siege and burning of the port of Sakai. Yoshihiro was governor (shugo) of six provinces, Suō, Nagato, Iwami, Buzen, Izumi and Kii, grew rich on trade with Korea, and had served the shogunate well: in Kyushu, against the Yamana in 1391 and as a go-between in the reunion of the Northern and Southern Courts in 1392. He fell out with Yoshimitsu, who was reducing the great governors one by one. He refused to send men to build Yoshimitsu’s Kitayama villa, resented that his brother Mitsuhiro had died fighting in Kyushu without reward, and heard rumours that he would lose Izumi and Kii or be killed if he went to Kyoto. Through Imagawa Ryōshun he made a secret pact with the Kamakura kubō Ashikaga Mitsukane, and he sounded out other discontented lords and the old supporters of the Southern Court. In the tenth month of Ōei 6 (November 1399) he landed his army at Sakai but would not go on to the capital, and on 18 November Yoshimitsu ordered his punishment. Yoshihiro fortified Sakai with a wooden wall and 48 towers. The chronicle Ōeiki gives the shogun’s army about 30,000 horsemen against about 5,000, while ships from Shikoku and Awaji closed the port from the sea. Risings in his support in Ōmi and Mino failed, and Mitsukane, who marched with over 10,000 men into Musashi, stopped there. On the 21st day of the twelfth month (January 1400) the besiegers set fire to the defences with the wind behind them, and Yoshihiro was killed in the last fight. Yoshimitsu took away Izumi, Kii, Iwami and Buzen; Suō and Nagato went to Yoshihiro’s brother Hiromo, who had surrendered, but another brother, Ōuchi Morimi, fought on, defeated Hiromo in 1402 and was soon recognised by the shogunate as head of the house."
: "Le soulèvement d’Ōuchi Yoshihiro contre le shogun retiré Ashikaga Yoshimitsu, qui prit fin avec le siège et l’incendie du port de Sakai. Yoshihiro était gouverneur (shugo) de six provinces, Suō, Nagato, Iwami, Buzen, Izumi et Kii, s’était enrichi grâce au commerce avec la Corée et avait bien servi le shogunat : à Kyushu, contre les Yamana en 1391 et comme intermédiaire lors de la réunification des cours du Nord et du Sud en 1392. Il se brouilla avec Yoshimitsu, qui affaiblissait un à un les grands gouverneurs. Il refusa d’envoyer des hommes pour construire la villa de Kitayama de Yoshimitsu, acceptait mal que son frère Mitsuhiro fût mort au combat à Kyushu sans avoir été récompensé, et entendit dire qu’il perdrait Izumi et Kii, ou serait tué, s’il se rendait à Kyoto. Par l’intermédiaire d’Imagawa Ryōshun, il conclut un pacte secret avec le kubō de Kamakura Ashikaga Mitsukane, et il sonda d’autres seigneurs mécontents ainsi que les anciens partisans de la cour du Sud. Au dixième mois de la 6e année de l’ère Ōei (novembre 1399), il débarqua son armée à Sakai, mais refusa de poursuivre jusqu’à la capitale et, le 18 novembre, Yoshimitsu ordonna son châtiment. Yoshihiro fortifia Sakai d’un mur de bois et de 48 tours. La chronique Ōeiki attribue à l’armée du shogun environ 30 000 cavaliers contre environ 5 000, tandis que des navires de Shikoku et d’Awaji fermaient le port du côté de la mer. Les soulèvements en sa faveur en Ōmi et en Mino échouèrent, et Mitsukane, qui était entré en Musashi avec plus de 10 000 hommes, s’y arrêta. Le 21e jour du douzième mois (janvier 1400), les assiégeants mirent le feu aux défenses, le vent dans le dos, et Yoshihiro fut tué dans le dernier combat. Yoshimitsu reprit Izumi, Kii, Iwami et Buzen ; Suō et Nagato revinrent à Hiromo, frère de Yoshihiro, qui s’était rendu, mais un autre frère, Ōuchi Morimi, poursuivit la lutte, battit Hiromo en 1402 et fut bientôt reconnu par le shogunat comme chef de la maison."
