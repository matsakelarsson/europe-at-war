# French translations of the catalogue text (wave 12); step bodies follow later.
Ogaden War: Guerre de l’Ogaden
? War between Somalia and Ethiopia over the Ogaden, the Somali-inhabited east of Ethiopia, which Somalia claimed as Western Somalia. In 1976–1977 the Western Somali Liberation Front (WSLF), armed and trained by Somalia, drove Ethiopian forces into their garrisons while the Derg, Ethiopia’s new military government, was fighting rebellions across the country. In July 1977 the Somali National Army invaded. Within two months Somali and WSLF forces held most of the Ogaden, took Jijiga and the Marda Pass, and laid siege to Harar and Dire Dawa. The Soviet Union, which had armed Somalia, then switched to Ethiopia; Somalia expelled its Soviet advisers in November 1977, and a Soviet airlift brought arms, about 1,500 Soviet advisers and some 12,000–18,000 Cuban troops to Ethiopia, with a South Yemeni contingent. The Ethiopian and Cuban counteroffensive of February–March 1978 retook Jijiga, and on 9 March Siad Barre ordered his army home. Some 5,000–6,500 soldiers were killed on each side and hundreds of thousands of Ogadeni Somalis fled to Somalia. The defeat discredited Siad Barre’s government and opened the way to the rebellions that destroyed the Somali state in 1991.
: La guerre entre la Somalie et l’Éthiopie pour l’Ogaden, l’est de l’Éthiopie peuplé de Somalis, que la Somalie revendiquait sous le nom de Somalie occidentale. En 1976–1977, le Front de libération de la Somalie occidentale (FLSO), armé et entraîné par la Somalie, refoula les forces éthiopiennes dans leurs garnisons tandis que le Derg, le nouveau gouvernement militaire éthiopien, combattait des rébellions dans tout le pays. En juillet 1977, l’Armée nationale somalienne lança l’invasion. En deux mois, les forces somaliennes et celles du FLSO tenaient la plus grande partie de l’Ogaden ; elles prirent Jijiga et le col de Marda et mirent le siège devant Harar et Dire Dawa. L’Union soviétique, qui avait armé la Somalie, se rangea alors du côté de l’Éthiopie ; la Somalie expulsa ses conseillers soviétiques en novembre 1977, et un pont aérien soviétique amena en Éthiopie des armes, environ 1 500 conseillers soviétiques et quelque 12 000–18 000 soldats cubains, ainsi qu’un contingent sud-yéménite. La contre-offensive éthiopienne et cubaine de février–mars 1978 reprit Jijiga et, le 9 mars, Siad Barre ordonna à son armée de rentrer. Quelque 5 000–6 500 soldats furent tués de chaque côté, et des centaines de milliers de Somalis de l’Ogaden se réfugièrent en Somalie. La défaite discrédita le gouvernement de Siad Barre et ouvrit la voie aux rébellions qui détruisirent l’État somalien en 1991.
