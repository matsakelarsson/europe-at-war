# French translations of the catalogue text (wave 7); step bodies follow later.
Oghuz revolt and the captivity of Sanjar: Révolte des Oghouzes et captivité de Sanjar
? In 1153 Oghuz (Ghuzz) Turkmen tribes who grazed their flocks in the uplands around Balkh rose against the Seljuk sultan Ahmad Sanjar, the last ruler of the Great Seljuk Empire, after a quarrel over the tribute of sheep they owed his court and the killing of one of his officials. Sanjar’s governor of Balkh, Qumach, attacked them and was beaten, and when Sanjar marched out with his army in the spring of 1153 he too was defeated near Balkh and taken prisoner. The Oghuz then plundered Khorasan for several years. Merv and Nishapur were largely destroyed and, according to the chroniclers, tens of thousands of people were killed. Sanjar was carried around with the tribes as a captive sultan for two to three years, the sources differ, until he escaped in 1156; he died at Merv in May 1157. His death ended Seljuk rule in the east. Khorasan was divided among his former slave commanders, such as Mu’ayyad Ay-Aba at Nishapur, Oghuz bands held towns such as Ghazni and moved into Kerman, and the Khwarazmshahs and the Ghurids competed for what was left.
: En 1153, des tribus turkmènes oghouzes (Ghuzz) qui faisaient paître leurs troupeaux sur les hauteurs autour de Balkh se soulevèrent contre le sultan seldjoukide Ahmad Sanjar, dernier souverain du Grand Empire seldjoukide, à la suite d’une querelle sur le tribut en moutons qu’elles devaient à sa cour et du meurtre de l’un de ses fonctionnaires. Le gouverneur de Balkh nommé par Sanjar, Qumach, les attaqua et fut battu ; quand Sanjar se mit en campagne avec son armée au printemps 1153, il fut lui aussi vaincu près de Balkh et fait prisonnier. Les Oghouzes pillèrent ensuite le Khorassan pendant plusieurs années. Merv et Nichapur furent en grande partie détruites et, selon les chroniqueurs, des dizaines de milliers de personnes furent tuées. Sanjar fut emmené par les tribus dans leurs déplacements, sultan captif, pendant deux à trois ans – les sources divergent –, jusqu’à son évasion en 1156 ; il mourut à Merv en mai 1157. Sa mort mit fin à la domination seldjoukide à l’est. Le Khorassan fut partagé entre ses anciens commandants esclaves, comme Mu’ayyad Ay-Aba à Nichapur, des bandes oghouzes tinrent des villes comme Ghazni et pénétrèrent dans le Kerman, et les shahs du Khwarezm et les Ghurides se disputèrent ce qui restait.
