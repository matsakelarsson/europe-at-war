# French translations of the catalogue text (wave 12); step bodies follow later.
Oromo Liberation Army insurgency: Insurrection de l’Armée de libération oromo
? "Last updated 27 November 2026. The armed struggle of the Oromo Liberation Army (OLA) against the Ethiopian government in Oromia, Ethiopia’s largest region. The OLA began as the armed wing of the Oromo Liberation Front (OLF), founded in 1973, which had fought the Derg and left the transitional government in 1992. When Abiy Ahmed became prime minister in 2018 the OLF returned from exile under a peace deal, but many of its fighters, led by Kumsa Diriba (Jaal Marroo), refused to disarm and broke with the party in 2019. The insurgency grew in western Oromia (the Wollega zones) and in Guji and Borana in the south, and spread when federal troops went north to the Tigray War in 2020. Ethiopia’s parliament designated the OLA a terrorist organisation in May 2021; the government calls it “Shene”. In 2021 the OLA allied with the TPLF, and at the end of October 2021 its fighters briefly entered Kemise, on the main road to Addis Ababa, as Tigrayan forces advanced south. All sides have been accused of grave abuses: armed men killed scores of Amhara civilians at Gida Kiremu in 2021 and hundreds at Gimbi in June 2022, attacks the OLA denied and blamed on government-backed militias; government forces and Amhara militias killed Oromo civilians, and drone strikes and mass arrests hit Oromo villages; Amnesty International reported in March 2026 on sexual violence, summary killings and torture by OLA fighters. Talks in Tanzania in April and November 2023 failed, but in December 2024 a breakaway faction under Sanyi Nagassa made peace with the Oromia regional government and clashes declined in 2025. Since September 2026 the OLA has been part of a coalition of seven armed groups with the TPLF and the Amhara Fano National Movement, the Ethiopian Peoples’ Forces Coalition for Survival (EPFAS), which aims to remove Abiy Ahmed’s government, though the OLA calls its role a “procedural consensus”. Fighting continues in western and southern Oromia, where the OLA is strongest in the countryside of the Wollega zones and the south. Reports from Oromia are hard to verify: the region is largely closed to journalists and communications are often cut."
: "Dernière mise à jour : 27 novembre 2026. La lutte armée de l’Armée de libération oromo (OLA) contre le gouvernement éthiopien en Oromia, la plus grande région d’Éthiopie. L’OLA est née comme branche armée du Front de libération oromo (OLF), fondé en 1973, qui avait combattu le Derg puis quitté le gouvernement de transition en 1992. Lorsqu’Abiy Ahmed est devenu Premier ministre, en 2018, l’OLF est rentré d’exil à la faveur d’un accord de paix, mais nombre de ses combattants, menés par Kumsa Diriba (Jaal Marroo), ont refusé de désarmer et ont rompu avec le parti en 2019. L’insurrection s’est développée dans l’ouest de l’Oromia (les zones du Wollega) ainsi que dans le Guji et le Borana, au sud, et s’est étendue lorsque les troupes fédérales sont parties vers le nord pour la guerre du Tigré, en 2020. Le Parlement éthiopien a désigné l’OLA comme organisation terroriste en mai 2021 ; le gouvernement l’appelle « Shene ». En 2021, l’OLA s’est alliée au TPLF et, fin octobre 2021, ses combattants sont brièvement entrés dans Kemise, sur la grande route d’Addis-Abeba, tandis que les forces tigréennes avançaient vers le sud. Toutes les parties ont été accusées d’exactions graves : des hommes armés ont tué des dizaines de civils amharas à Gida Kiremu en 2021 et des centaines à Gimbi en juin 2022, attaques que l’OLA a niées et imputées à des milices soutenues par le gouvernement ; les forces gouvernementales et des milices amharas ont tué des civils oromo, et des frappes de drones et des arrestations massives ont touché des villages oromo ; en mars 2026, Amnesty International a fait état de violences sexuelles, d’exécutions sommaires et d’actes de torture commis par des combattants de l’OLA. Des pourparlers en Tanzanie, en avril et en novembre 2023, ont échoué, mais en décembre 2024, une faction dissidente dirigée par Sanyi Nagassa a fait la paix avec le gouvernement régional de l’Oromia, et les affrontements ont diminué en 2025. Depuis septembre 2026, l’OLA fait partie, avec le TPLF et le Mouvement national fano amhara, d’une coalition de sept groupes armés, la Coalition des forces des peuples éthiopiens pour la survie (EPFAS), qui vise à renverser le gouvernement d’Abiy Ahmed, même si l’OLA qualifie son rôle de « consensus procédural ». Les combats se poursuivent dans l’ouest et le sud de l’Oromia, où l’OLA est la plus forte dans les campagnes des zones du Wollega et du sud. Les informations en provenance de l’Oromia sont difficiles à vérifier : la région est largement fermée aux journalistes et les communications y sont souvent coupées."
