# Some French text was translated automatically.
"Old Zurich War": "Ancienne guerre de Zurich"
"A war within the Swiss Confederacy over the lands of the last Count of Toggenburg, who died in 1436 without heir or will. Zurich claimed them against Schwyz and Glarus, was beaten by the other cantons in 1440 and in 1442 allied with the Habsburg king Frederick III. The Confederates routed Zurich at St. Jakob an der Sihl in 1443, besieged the city and in 1444 beheaded the surrendered garrison of Greifensee. Frederick called in France, whose Armagnac mercenaries under the Dauphin Louis wiped out some 1,500 Swiss at St. Jakob an der Birs near Basel on 26 August 1444, but lost so many men that the Dauphin made peace. A truce in 1446 ended the fighting, and in 1450 Zurich rejoined the Confederacy and gave up its alliance with the Habsburgs.": "Une guerre au sein de la Confédération suisse sur les terres du dernier comte de Toggenburg, qui est mort en 1436 sans héritier ni volonté. Zurich les a réclamés contre Schwyz et Glarus, a été battu par les autres cantons en 1440 et en 1442 allié avec le roi Habsbourg Frederick III. Jakob an der Sihl en 1443, assiégé la ville et en 1444 décapité la garnison cédée de Greifensee. Frederick a appelé en France, dont les mercenaires d’Armagnac sous le Dauphin Louis ont essuyé quelque 1 500 Suisses à Saint-Jakob an der Birs près de Bâle le 26 août 1444, mais ont perdu tellement d’hommes que le Dauphin a fait la paix. Une trêve en 1446 a mis fin aux combats, et en 1450 Zurich rejoint la Confédération et renonce à son alliance avec les Habsbourg."
"Dates are Julian, as usual for the period. The Dauphin, later King Louis XI, was leading an army of unemployed mercenaries, the Armagnacs or écorcheurs, left idle by a truce in the Hundred Years’ War; numbers are uncertain.": "Les dates sont Julian, comme d’habitude pour l’époque. Le Dauphin, plus tard le roi Louis XI, dirigeait une armée de mercenaires au chômage, les Armagnacs ou les écorcheurs, laissés oisifs par une trêve dans la guerre des Cent Ans ; les chiffres sont incertains."
"Zurich’s burgomaster Rudolf Stüssi was killed at St. Jakob an der Sihl on 22 July 1443. At Greifensee, which surrendered at the end of May 1444 after a four-week siege, some sixty of the defenders were beheaded, which shocked contemporaries.": "Le bourreau de Zurich Rudolf Stüssi a été tué à Saint-Jakob an der Sihl le 22 juillet 1443. À Greifensee, qui s’est rendu à la fin du mois de mai 1444 après un siège de quatre semaines, une soixantaine des défenseurs ont été décapités, ce qui a choqué les contemporains."
"The war showed that the Confederacy had become a league whose members could not go their own way against the rest. France and the Confederates made peace at Ensisheim in October 1444.": "La guerre a montré que la Confédération était devenue une ligue dont les membres ne pouvaient pas aller à leur guise contre le reste. La France et les Confédérés ont fait la paix à Ensisheim en octobre 1444."
