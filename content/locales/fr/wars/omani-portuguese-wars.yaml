# French translations of the catalogue text (wave 7); step bodies follow later.
Omani–Portuguese wars: Guerres omano-portugaises
The wars in which the Ya‘rubi imams of Oman drove the Portuguese from the Omani coast and then fought them across the western Indian Ocean. Imam Nasir bin Murshid, elected in 1624, united the tribes of the interior and took Julfar in 1633, Sohar in 1643 and the other ports until only Muscat was left. His successor Sultan bin Saif captured Muscat in January 1650, ending Portuguese rule in Oman. With captured ships the Omanis built a navy that raided Portuguese ports in India and East Africa, and in 1698, after a siege of almost three years, took Fort Jesus at Mombasa, which made Oman the leading power on the Swahili coast.: Les guerres par lesquelles les imams ya‘rubides d’Oman chassèrent les Portugais de la côte omanaise, puis les combattirent dans tout l’ouest de l’océan Indien. L’imam Nasir bin Murshid, élu en 1624, unit les tribus de l’intérieur et prit Julfar en 1633, Sohar en 1643, puis les autres ports, jusqu’à ce qu’il ne reste plus aux Portugais que Mascate. Son successeur, Sultan bin Saif, s’empara de Mascate en janvier 1650, mettant fin à la domination portugaise en Oman. Avec les navires capturés, les Omanais se dotèrent d’une marine qui attaqua les ports portugais de l’Inde et de l’Afrique de l’Est, et en 1698, après un siège de près de trois ans, ils prirent Fort Jesus, à Mombasa, ce qui fit d’Oman la première puissance de la côte swahilie.
