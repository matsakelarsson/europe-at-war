# French translations of the catalogue text (wave 10); step bodies follow later.
Ōnin War: Guerre d’Ōnin
"The civil war of 1467–1477 between the great lords of the Ashikaga shogunate, fought mainly in the streets of Kyoto, which left the capital in ruins and opened the Sengoku period, the age of warring states. Quarrels over the succession in the Hatakeyama and Shiba families and in the shogun’s own house drew the two most powerful men at court into opposing camps: the Eastern army of Hosokawa Katsumoto, which held the shogun Ashikaga Yoshimasa and the emperor, and the Western army of Yamana Sōzen, joined in 1467 by Ōuchi Masahiro from the far west. After the first battles of 1467 the armies faced each other across trenches inside the city for years, while hired foot soldiers burned and looted and the fighting spread to the provinces. Both commanders died in 1473, but the war dragged on until the last Western lords simply went home in December 1477. The shogunate never recovered its authority, and for more than a century real power in Japan lay with provincial warlords.": "La guerre civile de 1467–1477 entre les grands seigneurs du shogunat Ashikaga, livrée surtout dans les rues de Kyoto, qui laissa la capitale en ruines et ouvrit l’époque Sengoku, l’âge des États en guerre. Des querelles de succession dans les familles Hatakeyama et Shiba et dans la propre maison du shogun entraînèrent les deux hommes les plus puissants de la cour dans des camps opposés : l’armée de l’Est de Hosokawa Katsumoto, qui tenait le shogun Ashikaga Yoshimasa et l’empereur, et l’armée de l’Ouest de Yamana Sōzen, rejointe en 1467 par Ōuchi Masahiro, venu de l’extrême ouest. Après les premières batailles de 1467, les armées se firent face pendant des années de part et d’autre de tranchées creusées dans la ville, tandis que des fantassins mercenaires incendiaient et pillaient et que les combats gagnaient les provinces. Les deux commandants moururent en 1473, mais la guerre se prolongea jusqu’à ce que les derniers seigneurs de l’Ouest rentrent tout simplement chez eux en décembre 1477. Le shogunat ne recouvra jamais son autorité et, pendant plus d’un siècle, le pouvoir réel au Japon appartint aux seigneurs de la guerre provinciaux."
Eastern army (Hosokawa Katsumoto, Hatakeyama Masanaga, Shiba Yoshitoshi, Akamatsu Masanori; the shogun Ashikaga Yoshimasa): Armée de l’Est (Hosokawa Katsumoto, Hatakeyama Masanaga, Shiba Yoshitoshi, Akamatsu Masanori ; le shogun Ashikaga Yoshimasa)
Western army (Yamana Sōzen, Hatakeyama Yoshinari, Shiba Yoshikado, Ōuchi Masahiro; from 1468 Ashikaga Yoshimi): Armée de l’Ouest (Yamana Sōzen, Hatakeyama Yoshinari, Shiba Yoshikado, Ōuchi Masahiro ; à partir de 1468, Ashikaga Yoshimi)
