# French translations of the catalogue text (wave 13); step bodies follow later.
South African intervention in Lesotho (Operation Boleas): Intervention sud-africaine au Lesotho (opération Boleas)
? The military intervention by South Africa, later joined by Botswana, in Lesotho in September 1998, carried out in the name of the Southern African Development Community (SADC). In the elections of May 1998 the ruling Lesotho Congress for Democracy (LCD) of Prime Minister Pakalitha Mosisili won 79 of the 80 seats. The opposition parties called the vote rigged and their supporters besieged the royal palace in Maseru for weeks; a SADC commission under the South African judge Pius Langa found no evidence that the result had been falsified. In September junior officers of the Lesotho Defence Force mutinied, detained or forced out their commanders and sided with the protesters, and Mosisili’s government, fearing a coup, asked SADC for help. On 22 September 1998, with President Nelson Mandela abroad and Mangosuthu Buthelezi acting as president, about 600 South African troops crossed the border; more followed, and Botswana sent soldiers too. They met heavier resistance than expected at the Makoanyane barracks in Maseru and at the Katse dam of the Lesotho Highlands Water Project, which supplies water to South Africa’s industrial heartland, where 17 Lesotho soldiers were killed. In Maseru opposition supporters and others looted and burned much of the city centre, and towns such as Mafeteng and Mohale’s Hoek were also damaged. Eight to eleven South African soldiers were killed; estimates of the Basotho dead, soldiers and civilians, range from several dozen to well over a hundred. An agreement in October and November 1998 kept the LCD in government and set up an interim political authority of all the parties to prepare new elections, held in 2002 under a mixed electoral system. The last South African troops left in May 1999. South Africa and SADC called the operation a peace mission to prevent a coup; critics in Lesotho and South Africa called it an invasion to protect a friendly government and the water project.
: L’intervention militaire de l’Afrique du Sud, rejointe ensuite par le Botswana, au Lesotho en septembre 1998, menée au nom de la Communauté de développement de l’Afrique australe (SADC). Aux élections de mai 1998, le Congrès du Lesotho pour la démocratie (LCD), le parti au pouvoir du Premier ministre Pakalitha Mosisili, remporta 79 des 80 sièges. Les partis d’opposition dénoncèrent un scrutin truqué et leurs partisans assiégèrent pendant des semaines le palais royal à Maseru ; une commission de la SADC présidée par le juge sud-africain Pius Langa ne trouva aucune preuve d’une falsification des résultats. En septembre, de jeunes officiers des Forces de défense du Lesotho se mutinèrent, arrêtèrent ou chassèrent leurs chefs et se rangèrent du côté des manifestants, et le gouvernement de Mosisili, craignant un coup d’État, demanda l’aide de la SADC. Le 22 septembre 1998, alors que le président Nelson Mandela était à l’étranger et que Mangosuthu Buthelezi assurait l’intérim de la présidence, environ 600 soldats sud-africains franchirent la frontière ; d’autres suivirent, et le Botswana envoya lui aussi des soldats. Ils rencontrèrent une résistance plus forte que prévu à la caserne de Makoanyane, à Maseru, et au barrage de Katse, ouvrage du projet hydraulique des hautes terres du Lesotho (Lesotho Highlands Water Project) qui alimente en eau le cœur industriel de l’Afrique du Sud, où 17 soldats du Lesotho furent tués. À Maseru, des partisans de l’opposition et d’autres pillèrent et incendièrent une grande partie du centre-ville, et des villes comme Mafeteng et Mohale’s Hoek subirent elles aussi des dégâts. De huit à onze soldats sud-africains furent tués ; les estimations des morts basotho, soldats et civils, vont de plusieurs dizaines à bien plus d’une centaine. Un accord conclu en octobre et novembre 1998 maintint le LCD au gouvernement et créa une autorité politique intérimaire réunissant tous les partis pour préparer de nouvelles élections, qui se tinrent en 2002 selon un système électoral mixte. Les derniers soldats sud-africains partirent en mai 1999. L’Afrique du Sud et la SADC qualifièrent l’opération de mission de paix destinée à empêcher un coup d’État ; ses détracteurs, au Lesotho et en Afrique du Sud, y virent une invasion visant à protéger un gouvernement ami et le projet hydraulique.
South Africa and Botswana (SADC forces), at the request of Lesotho’s government: Afrique du Sud et Botswana (forces de la SADC), à la demande du gouvernement du Lesotho
Mutinous soldiers of the Lesotho Defence Force and armed opposition supporters: Soldats mutinés des Forces de défense du Lesotho et partisans armés de l’opposition
