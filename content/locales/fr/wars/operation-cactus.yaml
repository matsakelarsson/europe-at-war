# French translations of the catalogue text (wave 8); step bodies follow later.
1988 Maldives coup attempt (Operation Cactus): Tentative de coup d’État de 1988 aux Maldives (opération Cactus)
? "An attempt to overthrow President Maumoon Abdul Gayoom of the Maldives, defeated by an Indian intervention that India called Operation Cactus. Before dawn on 3 November 1988 between 80 and 200 armed members of the People’s Liberation Organisation of Tamil Eelam (PLOTE), a Sri Lankan Tamil militant group hired by the Maldivian businessman Abdullah Luthufi, who lived in Sri Lanka, landed in Malé from a ship. They seized parts of the capital, but failed to take the headquarters of the National Security Service, whose men held out, or to capture Gayoom, who went into hiding and appealed for help abroad. India answered within hours: about nine hours after the appeal, paratroopers of its 50th Independent Parachute Brigade, flown non-stop from Agra, landed at Hulhulé airport, crossed to Malé by boat and restored the government’s control that night. Some of the mercenaries fled with hostages on the hijacked freighter Progress Light; Indian frigates and aircraft caught it off Sri Lanka, fired on it after the mercenaries killed hostages, and on 6 November Indian navy commandos took the ship and its crew. Nineteen people died, most of them mercenaries, among them eight members of the Maldivian security service; India lost no one. The captured mercenaries were tried in the Maldives in 1989 and sentenced to death, later commuted to life imprisonment."
: "Une tentative de renversement du président des Maldives, Maumoon Abdul Gayoom, mise en échec par une intervention indienne que l’Inde baptisa opération Cactus. Avant l’aube du 3 novembre 1988, entre 80 et 200 membres armés de l’Organisation populaire de libération de l’Îlam tamoul (PLOTE), un groupe armé tamoul sri-lankais engagé par l’homme d’affaires maldivien Abdullah Luthufi, qui vivait au Sri Lanka, débarquèrent d’un navire à Malé. Ils s’emparèrent de plusieurs quartiers de la capitale, mais ne parvinrent ni à prendre le quartier général du Service de sécurité nationale, dont les hommes tinrent bon, ni à capturer Gayoom, qui se cacha et appela l’étranger à l’aide. L’Inde réagit en quelques heures : environ neuf heures après l’appel, des parachutistes de sa 50e brigade parachutiste indépendante, transportés sans escale depuis Agra, atterrirent à l’aéroport de Hulhulé, gagnèrent Malé en bateau et rétablirent le contrôle du gouvernement dans la nuit. Une partie des mercenaires s’enfuit avec des otages à bord du cargo détourné Progress Light ; des frégates et des avions indiens le rattrapèrent au large du Sri Lanka, ouvrirent le feu sur lui après que les mercenaires eurent tué des otages et, le 6 novembre, des commandos de la marine indienne s’emparèrent du navire et de son équipage. Dix-neuf personnes périrent, en majorité des mercenaires, et parmi elles huit membres du service de sécurité maldivien ; l’Inde ne perdit personne. Les mercenaires capturés furent jugés aux Maldives en 1989 et condamnés à mort, peine plus tard commuée en réclusion à perpétuité."
