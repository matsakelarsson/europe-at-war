# French translations of the catalogue text (wave 13); step bodies follow later.
Operation Green Sea: Opération Mar Verde
? "The Portuguese raid on Conakry, the capital of the Republic of Guinea, on the night of 21–22 November 1970, during the Guinea-Bissau War of Independence. Planned in Portuguese Guinea under the governor, General António de Spínola, and led by the naval officer Alpoim Calvão, a force of about 220 Portuguese soldiers, most of them African commandos and marines from Portuguese Guinea, and about 200 Guinean exiles of the National Liberation Front of Guinea (FLNG), sailed in unmarked ships and landed at several points in the city. Its aims were to free Portuguese prisoners held by the PAIGC, destroy the PAIGC’s boats and Guinea’s MiG fighters, capture or kill Amílcar Cabral and bring down President Ahmed Sékou Touré’s government. The raiders freed 26 Portuguese prisoners from Camp Boiro and burned PAIGC supply boats and Touré’s summer residence, but Cabral was abroad, the raiders did not destroy Guinea’s MiGs, the exiles attacked a radio station that was no longer in use, and no uprising followed; the force withdrew the next day, having lost a handful of men. Guinean deaths are estimated at between about 50 and 500. The UN Security Council condemned Portugal in Resolution 290 of 8 December 1970, and the Organisation of African Unity did the same; Portugal denied involvement. In Guinea, Sékou Touré used the attack to purge real and supposed opponents: a revolutionary tribunal sentenced dozens to death in January 1971, and many more were imprisoned in Camp Boiro, where many died."
: "Le raid portugais contre Conakry, capitale de la république de Guinée, dans la nuit du 21 au 22 novembre 1970, pendant la guerre d’indépendance de la Guinée-Bissau. Le raid, planifié en Guinée portugaise sous l’autorité du gouverneur, le général António de Spínola, et dirigé par l’officier de marine Alpoim Calvão, fut mené par une force d’environ 220 soldats portugais, pour la plupart des commandos et des fusiliers marins africains de Guinée portugaise, et d’environ 200 exilés guinéens du Front de libération nationale de Guinée (FLNG), qui embarqua sur des navires banalisés et débarqua en plusieurs points de la ville. Elle avait pour objectifs de libérer des prisonniers portugais détenus par le PAIGC, de détruire les embarcations du PAIGC et les chasseurs MiG guinéens, de capturer ou de tuer Amílcar Cabral et de renverser le gouvernement du président Ahmed Sékou Touré. Les assaillants libérèrent 26 prisonniers portugais du camp Boiro et incendièrent des bateaux de ravitaillement du PAIGC ainsi que la résidence d’été de Touré, mais Cabral était à l’étranger, les assaillants ne détruisirent pas les MiG guinéens, les exilés attaquèrent une station de radio qui n’était plus en service, et aucun soulèvement ne suivit ; la force se retira le lendemain, après avoir perdu une poignée d’hommes. Le nombre de morts guinéens est estimé entre 50 et 500 environ. Le Conseil de sécurité de l’ONU condamna le Portugal par la résolution 290 du 8 décembre 1970, et l’Organisation de l’unité africaine fit de même ; le Portugal nia toute implication. En Guinée, Sékou Touré se servit de l’attaque pour purger ses opposants réels ou supposés : un tribunal révolutionnaire condamna à mort des dizaines de personnes en janvier 1971, et beaucoup d’autres furent emprisonnées au camp Boiro, où nombre d’entre elles moururent."
