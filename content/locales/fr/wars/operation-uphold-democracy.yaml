# French translations of the catalogue text (wave 14); step bodies follow later.
1991 Haitian coup and Operation Uphold Democracy: Coup d’État de 1991 en Haïti et opération Uphold Democracy
? The military coup that overthrew Haiti’s first freely elected president, Jean-Bertrand Aristide, and the US-led intervention that restored him three years later. Aristide, a Catholic priest from the slums of Port-au-Prince and leader of the Lavalas movement, won the election of December 1990 with about two-thirds of the vote and took office in February 1991. On 29–30 September 1991 the army under General Raoul Cédras seized power, and Aristide went into exile, first in Venezuela and then in the United States. Under the military government soldiers and the paramilitary Front for the Advancement and Progress of Haiti (FRAPH), led by Emmanuel “Toto” Constant, killed, tortured and raped supporters of Aristide; estimates of the dead range from about 3,000 to 5,000. Tens of thousands of Haitians fled by boat; the US Coast Guard intercepted about 38,000 by the end of 1992 and returned most of them or held them at Guantánamo Bay. The Organization of American States and then the United Nations imposed embargoes, and in the Governors Island Accord of July 1993 Cédras agreed to step down, but when the USS Harlan County arrived with US and Canadian troops to help carry it out in October 1993, armed demonstrators kept it from landing, and the justice minister, Guy Malary, was murdered days later. On 31 July 1994 UN Security Council Resolution 940 authorised a multinational force to remove the military leaders. With invasion forces already in the air, a delegation of the former US president Jimmy Carter, Senator Sam Nunn and General Colin Powell persuaded Cédras on 18 September to step down, and on 19 September 1994 US troops landed unopposed; the force grew to about 20,000–25,000, with contingents from Caribbean and other countries. On 24 September US Marines killed ten Haitian soldiers in a firefight at Cap-Haïtien. Cédras resigned in October and left for Panama, Aristide returned to Port-au-Prince on 15 October 1994, disbanded the army in 1995, and on 31 March 1995 the multinational force handed over to the UN Mission in Haiti (UNMIH).
: Le coup d’État militaire qui renversa le premier président librement élu d’Haïti, Jean-Bertrand Aristide, et l’intervention menée par les États-Unis qui le rétablit trois ans plus tard. Aristide, prêtre catholique issu des bidonvilles de Port-au-Prince et chef du mouvement Lavalas, remporta l’élection de décembre 1990 avec environ deux tiers des voix et prit ses fonctions en février 1991. Les 29 et 30 septembre 1991, l’armée du général Raoul Cédras s’empara du pouvoir, et Aristide partit en exil, d’abord au Venezuela, puis aux États-Unis. Sous le gouvernement militaire, des soldats et les paramilitaires du Front pour l’avancement et le progrès haïtien (FRAPH), dirigé par Emmanuel « Toto » Constant, tuèrent, torturèrent et violèrent des partisans d’Aristide ; les estimations du nombre de morts vont d’environ 3 000 à 5 000. Des dizaines de milliers d’Haïtiens s’enfuirent par la mer ; la garde côtière américaine en intercepta environ 38 000 jusqu’à la fin de 1992 et en renvoya la plupart ou les retint dans la baie de Guantánamo. L’Organisation des États américains, puis les Nations unies imposèrent des embargos et, par l’accord de Governors Island de juillet 1993, Cédras accepta de se retirer, mais lorsque l’USS Harlan County arriva en octobre 1993 avec des soldats américains et canadiens chargés d’aider à son application, des manifestants armés l’empêchèrent d’accoster, et le ministre de la Justice, Guy Malary, fut assassiné quelques jours plus tard. Le 31 juillet 1994, la résolution 940 du Conseil de sécurité des Nations unies autorisa une force multinationale à écarter les chefs militaires. Alors que les forces d’invasion étaient déjà en vol, une délégation formée de l’ancien président américain Jimmy Carter, du sénateur Sam Nunn et du général Colin Powell persuada Cédras, le 18 septembre, de se retirer, et le 19 septembre 1994 les troupes américaines débarquèrent sans rencontrer de résistance ; la force atteignit environ 20 000 à 25 000 hommes, avec des contingents de pays caribéens et d’autres pays. Le 24 septembre, des Marines américains tuèrent dix soldats haïtiens lors d’un échange de tirs au Cap-Haïtien. Cédras démissionna en octobre et partit pour le Panama ; Aristide revint à Port-au-Prince le 15 octobre 1994 et prononça la dissolution de l’armée en 1995, et le 31 mars 1995 la force multinationale passa le relais à la Mission des Nations unies en Haïti (MINUHA).
