# French translations of the catalogue text (wave 12); step bodies follow later.
Oromo expansion: Expansion oromo
? "The great movement of the Oromo from their homelands in the southern highlands, around the lakes and the Bale and Borana country, into much of what is now central, western and eastern Ethiopia in the 16th and early 17th centuries. The Oromo had no kings; they were organised in the gadaa system, in which age-sets of men took over leadership and warfare every eight years, and each gadaa period was expected to make its own raid (butta). The monk Bahrey, writing in about 1593 and the main written source, names the gadaa periods from Melbah (1522–1530) on, and his dates are the basis of the usual chronology, although some are questioned. Early raids reached Bale and Dawaro and returned home; from the 1550s the Oromo began to settle the lands they took. The Borana groups moved west and north into Shewa, Damot, Gojjam and the Gibe region, the Barentu east and north-east against Adal, Harar, Fatagar, Wollo and Angot. Both the Christian empire and the Muslim sultanate of Adal had been weakened by their war of 1529–1543, and neither could stop them: the emir Nur ibn Mujahid built the wall of Harar against Oromo raids, and the emperors Gelawdewos, Sarsa Dengel and Susenyos fought them for decades, while Sarsa Dengel and Susenyos also enlisted Oromo groups as allies and settled them in Gojjam and Begemder. The Ethiopian kingdom lost Fatagar, Bale, Dawaro and much of Shewa, and the Harari population fell sharply. Over time many Oromo adopted Christianity or Islam and settled as farmers, and Oromo lords became powerful at the Gondar court. Oromo historians such as Asafa Jalata count twelve butta wars between 1522 and 1618 and describe them as a recovery as well as an expansion, into lands lost to earlier Christian and Muslim conquests; the movement continued in places after that, and the Macha reached Ennarea in the early 18th century. Older works call these events the “Galla invasions”, using a name the Oromo reject; historians now speak of the Oromo expansion or migrations."
: "Le grand mouvement qui porta les Oromo de leurs terres d’origine, dans les hauts plateaux du sud, autour des lacs et dans les pays du Bale et du Borana, vers une grande partie de ce qui est aujourd’hui le centre, l’ouest et l’est de l’Éthiopie, au XVIe et au début du XVIIe siècle. Les Oromo n’avaient pas de rois ; ils étaient organisés selon le système gadaa, dans lequel des classes d’âge d’hommes prenaient en charge le commandement et la guerre tous les huit ans, et chaque période gadaa devait mener son propre raid (butta). Le moine Bahrey, qui écrivait vers 1593 et constitue la principale source écrite, nomme les périodes gadaa à partir de Melbah (1522–1530), et ses dates fondent la chronologie habituelle, bien que certaines soient contestées. Les premiers raids atteignirent le Bale et le Dawaro, puis rentrèrent ; à partir des années 1550, les Oromo commencèrent à s’établir sur les terres qu’ils prenaient. Les groupes borana se dirigèrent vers l’ouest et le nord, dans le Choa, le Damot, le Godjam et la région du Gibe, les Barentu vers l’est et le nord-est, contre l’Adal, Harar, le Fatagar, le Wollo et l’Angot. L’empire chrétien comme le sultanat musulman d’Adal avaient été affaiblis par leur guerre de 1529–1543, et aucun des deux ne put les arrêter : l’émir Nur ibn Mujahid fit construire la muraille de Harar contre les raids oromo, et les empereurs Gelawdewos, Sarsa Dengel et Susenyos les combattirent pendant des décennies, tandis que Sarsa Dengel et Susenyos enrôlaient aussi des groupes oromo comme alliés et les établissaient dans le Godjam et le Begemder. Le royaume éthiopien perdit le Fatagar, le Bale, le Dawaro et une grande partie du Choa, et la population harari diminua fortement. Avec le temps, de nombreux Oromo adoptèrent le christianisme ou l’islam et se sédentarisèrent comme agriculteurs, et des seigneurs oromo devinrent puissants à la cour de Gondar. Des historiens oromo comme Asafa Jalata comptent douze guerres butta entre 1522 et 1618 et y voient une reconquête autant qu’une expansion, vers des terres perdues lors de conquêtes chrétiennes et musulmanes antérieures ; le mouvement se poursuivit par endroits après cette date, et les Macha atteignirent l’Ennarea au début du XVIIIe siècle. Les ouvrages anciens appellent ces événements les « invasions galla », d’un nom que les Oromo rejettent ; les historiens parlent aujourd’hui d’expansion ou de migrations oromo."
