# French translations of the catalogue text (wave 10); step bodies follow later.
Ōshio Heihachirō’s rebellion: Rébellion d’Ōshio Heihachirō
? "A one-day rising in Osaka during the Tenpō famine, led by a former shogunate official. Ōshio Heihachirō had served as a police magistrate (yoriki) in the Osaka city administration and then taught the Neo-Confucian philosophy of Wang Yangming (Yōmeigaku), which held that knowledge must be put into action. After failed harvests from 1833 rice prices soared and people starved in the streets of Osaka, while rice merchants hoarded and the city magistrates shipped rice to Edo. Ōshio sold his books to feed the poor, trained his students and nearby villagers in arms and sent round a long manifesto calling for heaven’s punishment of corrupt officials and rich merchants. Betrayed by one of his followers, he struck early on 25 March 1837 (the 19th day of the second month of Tenpō 8): he set fire to his house in the Tenma quarter and led about 300 students, villagers and townspeople under a banner reading “Save the people” against the great merchant houses of Senba, among them the Mitsui and the Kōnoike, firing cannon and scattering money and rice. The magistrates’ troops dispersed the rebels within half a day, but the fire spread and burned for a day and a night. Japanese accounts say that about a fifth of the city burned, some 70,000 people lost their homes and at least 270 died; English accounts speak of more than 3,000 houses destroyed. Ōshio and his son hid for about forty days until they were found in a merchant’s house on 1 May 1837 and killed themselves, setting the house on fire. In 1838 nineteen of the rebels, among them Ōshio, most of them already dead and preserved in salt, were crucified. That an official of the shogunate had risen in its second city shook the regime, and smaller risings in his name followed, among them Ikuta Yorozu’s attack on the Kashiwazaki office in Echigo that summer."
: "Un soulèvement d’une journée à Osaka pendant la famine de Tenpō, mené par un ancien fonctionnaire du shogunat. Ōshio Heihachirō avait servi comme magistrat de police (yoriki) dans l’administration de la ville d’Osaka, puis enseigné la philosophie néoconfucéenne de Wang Yangming (Yōmeigaku), selon laquelle la connaissance doit se traduire en action. Après les mauvaises récoltes qui se succédèrent à partir de 1833, le prix du riz s’envola et des gens mouraient de faim dans les rues d’Osaka, tandis que les marchands de riz stockaient et que les magistrats de la ville expédiaient du riz à Edo. Ōshio vendit ses livres pour nourrir les pauvres, entraîna au maniement des armes ses élèves et des villageois des environs et fit circuler un long manifeste appelant au châtiment céleste des fonctionnaires corrompus et des riches marchands. Trahi par l’un de ses partisans, il passa à l’action plus tôt que prévu, le 25 mars 1837 (le 19e jour du deuxième mois de Tenpō 8) : il mit le feu à sa maison, dans le quartier de Tenma, et conduisit environ 300 élèves, villageois et citadins, sous une bannière portant « Sauver le peuple », contre les grandes maisons marchandes de Senba, parmi lesquelles les Mitsui et les Kōnoike, en tirant au canon et en répandant argent et riz. Les troupes des magistrats dispersèrent les rebelles en une demi-journée, mais l’incendie se propagea et brûla un jour et une nuit. Selon les récits japonais, environ un cinquième de la ville brûla, quelque 70 000 personnes perdirent leur logement et au moins 270 moururent ; les récits en anglais parlent de plus de 3 000 maisons détruites. Ōshio et son fils restèrent cachés une quarantaine de jours, jusqu’à ce qu’on les découvre dans la maison d’un marchand le 1er mai 1837 ; ils se donnèrent la mort en mettant le feu à la maison. En 1838, dix-neuf des rebelles, dont Ōshio, pour la plupart déjà morts et conservés dans le sel, furent crucifiés. Qu’un fonctionnaire du shogunat se soit soulevé dans sa deuxième ville ébranla le régime, et de plus petits soulèvements suivirent en son nom, dont l’attaque d’Ikuta Yorozu contre le bureau de Kashiwazaki, dans l’Echigo, le même été."
