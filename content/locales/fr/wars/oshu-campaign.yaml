# French translations of the catalogue text (wave 10); step bodies follow later.
Ōshū campaign: Campagne d’Ōshū
? The campaign in which Minamoto no Yoritomo destroyed the Northern Fujiwara of Hiraizumi, who had ruled Mutsu and Dewa for a century, and brought the warriors of all Japan under his regime in Kamakura. Yoritomo’s brother Yoshitsune, who had fallen out with him after the Genpei War, had found refuge with Fujiwara no Hidehira at Hiraizumi. After Hidehira’s death his son Yasuhira gave in to pressure from Kamakura and the court and attacked Yoshitsune at his residence on the Koromo River in the leap fourth month of 1189; Yoshitsune killed himself. Yoritomo marched north anyway, without waiting for an imperial mandate, with three armies, along the Pacific coast, the inland road and the Sea of Japan coast, raised from across the country. On the tenth day of the eighth month his army stormed the earthworks the Fujiwara had built at Atsukashiyama, where Yasuhira’s half-brother Kunihira was killed; Yasuhira abandoned Taga and set fire to Hiraizumi, which the Kamakura army entered on the 22nd. Fleeing north, Yasuhira was killed by one of his own retainers, Kawada Jirō, early in the ninth month. Yoritomo executed the killer, displayed Yasuhira’s head as his ancestor Minamoto no Yoriyoshi had displayed Abe no Sadato’s, and made Kasai Kiyoshige his commissioner for Mutsu. A rising by a former Fujiwara vassal, Ōkawa Kanetō, was put down in 1190. Yoritomo was appointed shōgun in 1192.
: La campagne au cours de laquelle Minamoto no Yoritomo anéantit les Fujiwara du Nord de Hiraizumi, qui gouvernaient le Mutsu et le Dewa depuis un siècle, et soumit les guerriers de tout le Japon à son régime de Kamakura. Le frère de Yoritomo, Yoshitsune, qui s’était brouillé avec lui après la guerre de Genpei, avait trouvé refuge auprès de Fujiwara no Hidehira à Hiraizumi. Après la mort de Hidehira, son fils Yasuhira céda aux pressions de Kamakura et de la cour et attaqua Yoshitsune dans sa résidence au bord de la rivière Koromo, au quatrième mois intercalaire de 1189 ; Yoshitsune se donna la mort. Yoritomo marcha néanmoins vers le nord, sans attendre de mandat impérial, avec trois armées levées dans tout le pays, par la côte du Pacifique, par la route de l’intérieur et par la côte de la mer du Japon. Le dixième jour du huitième mois, son armée prit d’assaut les terrassements que les Fujiwara avaient élevés à Atsukashiyama, où Kunihira, demi-frère de Yasuhira, fut tué ; Yasuhira abandonna Taga et mit le feu à Hiraizumi, où l’armée de Kamakura entra le 22. Fuyant vers le nord, Yasuhira fut tué par l’un de ses propres vassaux, Kawada Jirō, au début du neuvième mois. Yoritomo fit exécuter le meurtrier, exposa la tête de Yasuhira comme son ancêtre Minamoto no Yoriyoshi avait exposé celle d’Abe no Sadato, et fit de Kasai Kiyoshige son commissaire pour le Mutsu. Un soulèvement d’un ancien vassal des Fujiwara, Ōkawa Kanetō, fut réprimé en 1190. Yoritomo fut nommé shōgun en 1192.
