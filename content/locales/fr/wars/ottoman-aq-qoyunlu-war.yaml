# Some French text was translated automatically.
"Ottoman–Aq Qoyunlu War": "Guerre ottomane-Aq Qoyunlu"
"The war between Mehmed II and Uzun Hasan, ruler of the Aq Qoyunlu (White Sheep) Turkmen, who had made himself master of eastern Anatolia, Iran and Iraq. Allied with Venice and the Karamanids, Uzun Hasan sent an army into Anatolia in 1472 that sacked Tokat and drove into Karaman before it was beaten back. In 1473 Mehmed marched east with a large army and his sons Bayezid and Mustafa. On the upper Euphrates near Tercan, an Ottoman force that crossed the river was routed early in August, but on 11 August 1473 at Otlukbeli the Ottoman janissaries, guns and firearms broke Uzun Hasan’s army. Mehmed did not pursue him into Iran, but the Aq Qoyunlu never again threatened Ottoman Anatolia, and the Karamanids and Venice lost their eastern ally.": "La guerre entre Mehmed II et Uzun Hasan, le chef du Turkmène d’Aq Qoyunlu (Ovin blanc), qui s’était fait maître de l’Anatolie orientale, de l’Iran et de l’Irak. Allié avec Venise et les Karamanides, Uzun Hasan envoya une armée en Anatolie en 1472 qui lança Tokat et conduisit à Karaman avant qu’elle ne soit battue. En 1473 Mehmed marcha vers l’est avec une grande armée et ses fils Bayezid et Mustafa. Sur l’Euphrate supérieur près de Tercan, une force ottomane qui traversait la rivière fut rouée au début du mois d’août, mais le 11 août 1473 à Otlukbeli les janissaires ottomans, armes et armes à feu brisèrent l’armée d’Uzun Hasan. Mehmed ne le poursuivit pas en Iran, mais l’Aq Qoyunlu ne menaça plus jamais l’Anatolie ottomane, et les Karamanids et Venise perdirent leur allié oriental."
"The size of both armies is very uncertain; the sources give anything from 70,000 to several hundred thousand. Otlukbeli is also called the Battle of Başkent or of Tercan.": "La taille des deux armées est très incertaine ; les sources donnent quelque chose de 70.000 à plusieurs centaines de milliers. Otlukbeli est également appelé la bataille de Başkent ou de Tercan."
