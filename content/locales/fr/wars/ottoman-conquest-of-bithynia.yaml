"In 1329 Andronikos III, now sole emperor, and his chief minister John Kantakouzenos crossed to Asia with about 4,000 men, the largest army they could raise, to relieve Nicaea and Nicomedia. At Pelekanon, on the coast of the Gulf of Nicomedia, Orhan’s army blocked the road from the hills. After a day of skirmishing on 10 June the Byzantines began to withdraw; both leaders were slightly wounded, a rumour spread that the emperor was dying, and on 11 June the retreat became a rout. Kantakouzenos brought the survivors home by sea.": "En 1329, Andronikos III, aujourd'hui seul empereur, et son ministre en chef John Kantakouzenos ont traversé l’Asie avec environ 4000 hommes, la plus grande armée qu’ils pouvaient lever, pour soulager Nicée et Nicomedia. À Pelekanon, sur la côte du golfe de Nicomédia, l’armée Orhan a bloqué la route des collines. Après une journée d’escarmouches le 10 juin, les Byzantins ont commencé à se retirer ; les deux dirigeants ont été légèrement blessés, une rumeur s’est répandue que l’empereur était mourant, et le 11 juin la retraite est devenue un rout. Kantakouzenos a ramené les survivants chez eux par mer."
"No Byzantine army tried to win back Asia Minor again. Nicaea, where the church council of 325 had met and the emperors had ruled in exile after 1204, surrendered on 2 March 1331, and many of its people soon became Muslims; Orhan turned its great church into a mosque. Andronikos offered tribute in return for peace, but Orhan went on to besiege Nicomedia, which surrendered in 1337. With the annexation of the neighbouring beylik of Karasi, the Ottomans held most of the Asian shore of the Sea of Marmara.": "Nicée, où le conseil d’église de 325 s’était réuni et les empereurs avaient gouverné en exil après 1204, se sont rendus le 2 mars 1331, et beaucoup de son peuple est rapidement devenu musulmans ; Orhan a transformé sa grande église en mosquée. Andronikos a offert hommage en échange de la paix, mais Orhan a continué à assiége Nicomedia, qui s’est rendu en 1337. Avec l’annexion du béylik voisin de Karasi, les Ottomans tenaient la plupart des rives asiatiques de la mer de Marmara."
