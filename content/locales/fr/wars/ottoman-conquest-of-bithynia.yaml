"1317–1326": "1317–1326"
"The Ottomans had no siege engines able to break the walls of Prusa, the rich city at the foot of Mount Olympus (Uludağ), so from about 1317 they starved it, building forts around it and cutting its roads. The Byzantines, caught up from 1321 in the civil war between Andronikos II and his grandson, sent no relief. Osman, old and ill, left the war to his son Orhan.": "Les Ottomans n’avaient pas de moteurs de siège capables de briser les murs de Prusa, la ville riche au pied du mont Olympe (Uludağ), donc, à partir d’environ 1317, ils l’affaiblirent, construisirent des forts autour de lui et coupèrent ses routes. Les Byzantins, pris à partir de 1321 dans la guerre civile entre Andronikos II et son petit-fils, n’envoyèrent aucun soulagement. Osman, vieux et malades, laissa la guerre à son fils Orhan."
"On 6 April 1326, after years of blockade, the city surrendered to Orhan. Osman died about this time; by some accounts he heard of the victory on his deathbed, and he was buried in Bursa. Orhan made Bursa his capital, built mosques, baths and inns, and drew merchants to it, and the Moroccan traveller Ibn Battuta, who visited it in about 1331, praised its bazaars and wide streets. It remained the chief Ottoman city until the 1360s, and the early sultans were buried there.": "Le 6 avril 1326, après des années de blocus, la ville s’est rendue à Orhan. Osman est mort vers cette époque ; selon certains témoignages il a entendu parler de la victoire sur son lit de mort, et il a été enterré à Bursa. Orhan fit de Bursa sa capitale, construisit des mosquées, des bains et des auberges et y tira des marchands, et le voyageur marocain Ibn Battuta, qui la visita vers 1331, loua ses bazars et ses larges rues. Il resta la ville ottomane en chef jusqu’aux années 1360, et les premiers sultans y furent enterrés."
