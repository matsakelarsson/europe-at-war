"Ottoman conquest of Bithynia": "Conquête ottomane de la Bithynie"
"The conquest of Byzantine Bithynia, the north-western corner of Anatolia facing Constantinople, by Osman, founder of the Ottoman dynasty, and his son Orhan. After Osman’s victory at Bapheus in 1302 the Byzantines lost the countryside and kept only walled towns, which fell one by one after long blockades; Bursa in 1326, Nicaea in 1331 and Nicomedia in 1337. Andronikos III’s attempt to relieve them was beaten at Pelekanon in 1329, the last Byzantine campaign in Asia Minor.": "La conquête de la bithynie byzantine, le coin nord-ouest de l’Anatolie face à Constantinople, par Osman, fondateur de la dynastie ottomane, et son fils Orhan. Après la victoire d’Osman à Bapheus en 1302, les Byzantins perdirent la campagne et ne gardèrent que des villes fortifiées, qui tombaient une par une après de longs blocus ; Bursa en 1326, Nicée en 1331 et Nicomédia en 1337. Andronikos III=Ses tentatives de les soulager furent battues à Pelekanon en 1329, la dernière campagne byzantine en Asie Mineure."
"The early history of the Ottomans is known mainly from Byzantine historians such as George Pachymeres and from Ottoman chronicles written more than a century later, which mix fact and legend. Many dates are uncertain; the battle of Bapheus is dated 1302 by most modern historians, but 1299 by some older ones, and Osman’s death is placed between 1323 and 1326.": "L’histoire ancienne des Ottomans est connue principalement d’historiens byzantins tels que George Pachymeres et de chroniques ottomanes écrites plus d’un siècle plus tard, qui mélangent faits et légende. Beaucoup de dates sont incertaines ; la bataille de Baphée est datée de 1302 par la plupart des historiens modernes, mais 1299 par certains plus âgés, et Osman est placé entre 1323 et 1326."
