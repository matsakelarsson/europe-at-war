"Osman was one of many Turkish warlords on the Byzantine frontier after the decline of the Seljuk sultanate of Rum. From his base at Söğüt in the Sakarya valley he raided ever deeper into Bithynia, and Ottoman tradition credits him with taking Bilecik, İnegöl and Yenişehir around 1299. By 1301 his men were blockading Nicaea and plundering the outskirts of Prusa (Bursa), and they kept the people of Nicomedia from bringing in their harvest. Shortly before, the co-emperor Michael IX had led an army into western Anatolia, but it melted away at Magnesia without fighting.": "Osman était l’un des nombreux seigneurs de guerre turcs à la frontière byzantine après le déclin du sultanate de Seljuk de Rum. De sa base à Söğüt dans la vallée de Sakarya, il a fait une descente toujours plus profonde en Bithynie, et la tradition ottomane lui crédite avec prendre Bilecik, ìnegöl et Yenişehir vers 1299. En 1301, ses hommes bloquaient Nicée et pillaient la périphérie de Prusa (Bursa), et ils empêchaient le peuple de Nicomédia d’apporter sa récolte. Peu avant, l’empereur Michel IX avait conduit une armée dans l’Anatolie occidentale, mais elle a fondu à Magnésie sans se battre."
"To relieve Nicomedia, Andronikos II sent some 2,000 men across the Bosporus under George Mouzalon, about half of them newly hired Alan mercenaries. On 27 July 1302, at Bapheus, a plain near Nicomedia, they met perhaps 5,000 Turkish horsemen led by Osman. The Alans stood aside, the Turks broke the Byzantine line and Mouzalon fled into the city. Bapheus was the first Ottoman victory over an imperial army. The Byzantines kept only their walled towns, and refugees crowded across the strait to Constantinople.": "Pour soulager Nicomedia, Andronikos II a envoyé quelque 2 000 hommes à travers le Bosporus sous George Mouzalon, dont la moitié venait d’engager des mercenaires Alan. Le 27 juillet 1302, à Bapheus, une plaine près de Nicomedia, ils ont rencontré peut-être 5 000 cavaliers turcs dirigés par Osman. Les Alans se tenaient à l’écart, les Turcs brisaient la ligne byzantine et Mouzalon s’enfuit dans la ville. Bapheus fut la première victoire ottomane sur une armée impériale. Les Byzantins ne gardèrent que leurs villes fortifiées, et les réfugiés encombrés à travers le détroit de Constantinople."
