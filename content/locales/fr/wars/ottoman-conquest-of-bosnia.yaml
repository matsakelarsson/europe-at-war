"Ottoman conquest of Bosnia": "Conquête ottomane de la Bosnie"
"Mehmed II’s rapid conquest of the Kingdom of Bosnia in 1463. King Stephen Tomašević had refused to pay tribute, trusting in help from Hungary and the pope, but when the sultan invaded in May the royal fortress of Bobovac fell within days, and the king was captured at Ključ and beheaded. Matthias Corvinus of Hungary retook Jajce and the north at the end of the year, and the duchy of Herzegovina to the south held out in part until its last fortress fell in 1481–1482.": "Mehmed II, la conquête rapide du Royaume de Bosnie en 1463. Le roi Stephen Tomašević avait refusé de rendre hommage, confiant dans l’aide de la Hongrie et du pape, mais quand le sultan envahit en mai la forteresse royale de Bobovac tomba en quelques jours, et le roi fut capturé à Ključ et décapité. Matthias Corvinus de Hongrie a repris Jajce et le nord à la fin de l’année, et le duché d’Herzégovine au sud tenu en partie jusqu’à ce que sa dernière forteresse tombe en 1481–1482."
"Accounts of the king’s death differ. One version says Mehmed’s scholar Ali al-Bistami ruled that the promise of safety was not binding on the sultan and beheaded the king himself; others say Mehmed did it. Later stories that he was flayed or used as a target are not supported by contemporary sources.": "Les récits de la mort du roi diffèrent. Une version dit Mehmed , le savant Ali al-Bistami a statué que la promesse de sécurité ne liait pas au sultan et décapité le roi lui-même ; d’autres disent Mehmed l’a fait."
"The Hungarian conquest of Jajce is dated 16 or 25 December 1463 in different sources. Herzegovina’s last fortress, Novi (Herceg Novi), fell at the end of 1481, and the duchy is often said to have ended in 1482.": "La conquête hongroise de Jajce est datée du 16 ou 25 décembre 1463 dans différentes sources. Herzégovine dernière forteresse, Novi (Herceg Novi), tombé à la fin de 1481, et on dit souvent que le duché a pris fin en 1482."
