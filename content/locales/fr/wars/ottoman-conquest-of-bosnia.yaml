"May – December 1463": "mai – décembre 1463"
"Stephen Tomašević, crowned in 1461 with a crown sent by Pope Pius II, refused the customary tribute to the sultan, counting on Hungarian help that did not come in time. His kingdom was divided, his people largely indifferent and the powerful Duke Stjepan Vukčić Kosača of Herzegovina at war with his own son. In the spring of 1463 Mehmed II marched into Bosnia with a large army. His grand vizier Mahmud Pasha Angelović besieged the royal fortress of Bobovac on 19 May, and it surrendered within days. The king fled west, but Mahmud Pasha caught up with him at Ključ, where after a four-day siege he gave himself up in return for a written promise of safety.": "Stephen Tomašević, couronné en 1461 par une couronne envoyée par le pape Pie II, a refusé l’hommage coutumier au sultan, comptant sur l’aide hongroise qui n’est pas venue à temps. Son royaume a été divisé, son peuple largement indifférent et le puissant duc Stjepan Vukčić Kosača d’Herzégovine en guerre avec son propre fils. Au printemps de 1463 Mehmed II a marché en Bosnie avec une grande armée. Son grand vizier Mahmud Pasha Angelović a assiégé la forteresse royale de Bobovac le 19 mai, et il s’est rendu en quelques jours. Le roi a fui à l’ouest, mais Mahmud Pasha a pris avec lui à Ključ, où après un siège de quatre jours, il s’est livré en échange d’une promesse écrite de sécurité."
"Taken before the sultan at Jajce, Stephen ordered his commanders to give up their castles, and some seventy towns surrendered in a week. On 25 May he was beheaded, and Bosnia became an Ottoman province. Mahmud Pasha then attacked Herzegovina, where the old duke had to give up his lands north of Blagaj. When the sultan’s army had gone home, Matthias Corvinus invaded in the autumn, besieged Jajce and took it in December, forming a Hungarian frontier province that held until 1527. Herzegovina was conquered piece by piece; its last fortress, Herceg Novi on the Bay of Kotor, fell at the end of 1481.": "Pris avant le sultan à Jajce, Stephen ordonna à ses commandants de renoncer à leurs châteaux, et quelque soixante-dix villes se rendirent en une semaine. Le 25 mai il fut décapité, et la Bosnie devint une province ottomane. Mahmud Pacha attaqua alors l’Herzégovine, où le vieux duc dut abandonner ses terres au nord de Blagaj. Lorsque l’armée du sultan est rentrée, Matthias Corvinus a envahi à l’automne, assiégé Jajce et l’a prise en décembre, formant une province frontalière hongroise qui tenait jusqu’en 1527.L’Herzégovine a été conquise pièce par pièce ; sa dernière forteresse, Herceg Novi sur la baie de Kotor, est tombée à la fin de 1481."
