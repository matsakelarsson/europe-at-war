"In 1537 a Habsburg army under Johann Katzianer was destroyed at Gorjani in Slavonia. By the secret Treaty of Nagyvárad in February 1538 the two kings agreed to keep what they held, with Ferdinand to inherit Zápolya’s share. But in July 1540, days after the birth of his son John Sigismund, Zápolya died. His supporters, led by his widow Isabella and the monk George Martinuzzi, made the baby king, and the sultan accepted him. Ferdinand sent an army under Roggendorf to besiege Buda in May 1541.": "En 1537, une armée de Habsbourg sous Johann Katzianer fut détruite à Gorjani en Slavonie. Par le traité secret de Nagyvárad en février 1538, les deux rois acceptèrent de garder ce qu’ils détenaient, avec Ferdinand pour hériter la part de Zápolya. Mais en juillet 1540, quelques jours après la naissance de son fils John Sigismund, Zápolya mourut. Ses partisans, dirigés par sa veuve Isabella et le moine George Martinuzzi, firent roi du bébé, et le sultan l’accepta. Ferdinand envoya une armée sous Roggendorf pour assiéger Buda en mai 1541."
"Suleiman came to the city’s relief and routed the besiegers on 21 August. On 29 August, the anniversary of Mohács, while the Hungarian lords were in his tent, Ottoman soldiers took over Buda, and the city became the seat of an Ottoman province. Isabella and her son were sent east to rule the lands beyond the Tisza and Transylvania as Ottoman vassals. In 1543 the Ottomans took Pécs, Siklós, Esztergom and Székesfehérvár, and in 1544 Visegrád, Nógrád and Hatvan. By the Truce of Adrianople in 1547 Ferdinand agreed to pay 30,000 florins a year for his part of Hungary, which was now split three ways.": "Le 29 août, date anniversaire de Mohács, alors que les seigneurs hongrois étaient dans sa tente, les soldats ottomans ont repris Buda, et la ville est devenue le siège d’une province ottomane. Isabella et son fils ont été envoyés à l’est pour gouverner les terres au-delà de Tisza et Transylvanie comme vassaux ottomans. En 1543, les Ottomans prirent Pécs, Siklós, Esztergom et Székesfehérvár, et en 1544 Visegrád, Nógrád et Hatvan. Par la trêve d’Adrianople en 1547 Ferdinand accepta de payer 30 000 florins par an pour sa partie de la Hongrie, qui était maintenant divisée trois façons."
