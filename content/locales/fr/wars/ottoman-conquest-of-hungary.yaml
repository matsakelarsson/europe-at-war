"9 October 1537": "9 octobre 1537"
"After failing to take Osijek, Katzianer’s army of about 24,000 was caught in the marshes near Đakovo and destroyed. Katzianer fled and was later killed for treason.": "Après avoir omis de prendre Osijek, l’armée de Katzianer d’environ 24 000 a été capturée dans les marais près de Ikovovo et détruite. Katzianer s’est enfuie et a ensuite été tuée pour trahison."
"A secret agreement between the two kings. Zápolya kept his lands for life, and Ferdinand was to inherit them.": "Un accord secret entre les deux rois. Zápolya garda ses terres pour la vie, et Ferdinand devait les hériter."
"After routing Roggendorf’s besieging army, the Ottomans took the city by surprise. It was the seat of an Ottoman province until 1686.": "Après avoir rouillé Roggendorf, les Ottomans prirent la ville par surprise. C’était le siège d’une province ottomane jusqu’en 1686."
"Esztergom": "Esztergom"
"August 1543": "août 1543"
"The seat of Hungary’s archbishops fell after a short siege, followed in September by the coronation city of Székesfehérvár.": "Le siège des archevêques hongrois est tombé après un bref siège, suivi en septembre par la ville de couronnement de Székesfehérvár."
"Pécs": "Pécs"
