"Ottoman conquest of Hungary": "La conquête ottomane de la Hongrie"
"The wars in which Suleiman the Magnificent broke the medieval Kingdom of Hungary. After taking Belgrade in 1521 the Ottomans destroyed the Hungarian army at Mohács in 1526, where King Louis II died; two rival kings, John Zápolya and the Habsburg Ferdinand I, then fought for the crown, Zápolya with Ottoman backing. Suleiman besieged Vienna in 1529 and was held up at Kőszeg in 1532, and in 1541 he occupied Buda, leaving Hungary divided between Habsburg Royal Hungary, Ottoman Hungary and the eastern kingdom that became the Principality of Transylvania.": "Après avoir pris Belgrade en 1521, les Ottomans ont détruit l’armée hongroise à Mohács en 1526, où le roi Louis II est mort ; deux rois rivaux, John Zápolya et le Habsbourg Ferdinand Ier, ont ensuite combattu pour la couronne, Zápolya avec le soutien ottoman. Suleiman assiégea Vienne en 1529 et fut retenu à Kőszeg en 1532, et en 1541 il occupera Buda, laissant la Hongrie divisée entre la Hongrie royale de Habsbourg, la Hongrie ottomane et le royaume oriental qui devint la Principauté de Transylvanie."
"Dates are Julian, as usual for the period. The numbers of soldiers come mostly from chroniclers and are uncertain; modern estimates are often much lower than the figures of the time.": "Les dates sont Julian, comme d’habitude pour la période. Le nombre de soldats provient principalement de chroniqueurs et sont incertains ; les estimations modernes sont souvent beaucoup plus basses que les chiffres de l’époque."
"Places are given by their usual English or modern names, with the Hungarian or German name where it is often used (Buda, Pozsony/Pressburg for Bratislava, Kőszeg/Güns, Nagyvárad for Oradea, Eszék for Osijek).": "Les lieux sont donnés par leurs noms anglais ou modernes habituels, avec le nom hongrois ou allemand où il est souvent utilisé (Buda, Pozsony/Pressburg pour Bratislava, Kőszeg/Güns, Nagyvárad pour Oradea, Eszék pour Osijek)."
"The fighting between the two kings and their backers in 1527–1538 is often called the Little War in Hungary. The later wars in Hungary have their own entries, among them the war of 1551–1562, the war of 1565–1568 with the siege of Szigetvár, the Long Turkish War of 1593–1606 and the Great Turkish War of 1683–1699.": "Les combats entre les deux rois et leurs partisans en 1527–1538 sont souvent appelés la Petite Guerre en Hongrie. Les guerres ultérieures en Hongrie ont leurs propres entrées, parmi lesquelles la guerre de 1551–1562, la guerre de 1565–1568 avec le siège de Szigetvár, la longue guerre turque de 1593–1606 et la Grande guerre turque de 1683–1699."
