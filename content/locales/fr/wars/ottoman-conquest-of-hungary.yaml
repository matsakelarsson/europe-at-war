"With Louis dead and childless, Hungary had two kings. The lesser nobles, who wanted a native ruler, proclaimed John Zápolya, voivode of Transylvania and the country’s richest lord, at Székesfehérvár on 10 November 1526, and he was crowned the next day. On 17 December a rival diet at Pozsony, led by magnates and churchmen, elected Ferdinand of Habsburg, archduke of Austria and brother of the Emperor Charles V, who had married Louis’s sister and claimed the throne by family treaties. The Croatian estates chose Ferdinand at Cetin on 1 January 1527, while many Slavonian nobles backed Zápolya.": "Avec Louis mort et sans enfant, la Hongrie avait deux rois. Les plus petits nobles, qui voulaient un chef autochtone, proclamèrent John Zápolya, voivode de Transylvanie et le plus riche seigneur du pays, à Székesfehérvár le 10 novembre 1526, et il fut couronné le lendemain. Le 17 décembre, un régime rival à Pozsony, dirigé par des magnats et des ecclésiastiques, a élu Ferdinand de Habsbourg, archiduc d’Autriche et frère de l’empereur Charles V, qui avait épousé la sœur de Louis et revendiqué le trône par des traités familiaux. Les biens croates ont choisi Ferdinand à Cetin le 1er janvier 1527, tandis que de nombreux nobles slaves soutenaient Zápolya."
"In the south a Serbian soldier, Jovan Nenad, who called himself emperor, ruled much of the Bačka from Subotica until he was killed in 1527. That summer Ferdinand’s German mercenaries entered Hungary, took Buda and beat Zápolya at Tokaj on 27 September; Ferdinand was crowned at Székesfehérvár on 3 November. Defeated again at Szina in March 1528, Zápolya fled to Poland. From there he sent the Polish nobleman Hieronim Łaski to Constantinople, and in 1528 Suleiman agreed to support him as his vassal.": "Dans le sud, un soldat serbe, Jovan Nenad, qui s’appelle lui-même empereur, dirigeait une grande partie de la Bačka de Subotica jusqu’à ce qu’il soit tué en 1527. L’été Ferdinand est entré en Hongrie, a pris Buda et a battu Zápolya à Tokaj le 27 septembre ; Ferdinand a été couronné à Székesfehérvár le 3 novembre. Défait à nouveau à Szina en mars 1528, Zápolya s’enfuit en Pologne. De là, il envoya le noble polonais Hieronim Łaski à Constantinople, et en 1528 Suleiman accepta de le soutenir comme son vassal."
