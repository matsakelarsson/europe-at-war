"In 1530 Ferdinand’s army besieged Buda but could not take it. In April 1532 Suleiman led another huge army north, aiming, he said, to fight Charles V himself. In early August it stopped before Kőszeg, a small town near the Austrian border. Its captain, the Croatian nobleman Nikola Jurišić, had a handful of soldiers and several hundred townspeople and peasants, with almost no guns. For more than three weeks they beat off assault after assault while mines brought down parts of the walls.": "En 1530, l’armée de Ferdinand assiégea Buda mais ne put pas la prendre.En avril 1532, Suleiman mena une autre énorme armée au nord, visant, dit-il, à combattre Charles V lui-même. Au début du mois d’août, elle s’arrêta devant Kőszeg, petite ville près de la frontière autrichienne. Pendant plus de trois semaines, ils ont battu l’assaut après l’agression tandis que les mines abaissaient des parties des murs."
"How the siege ended is told two ways. In one account Jurišić refused to surrender; in the other he accepted a token surrender in which a few Ottoman soldiers raised their flag on the walls. Either way the sultan, with the season late, did not go on to Vienna, where Charles was gathering an imperial army of some 80,000 men. He turned south through Styria, plundering the land, while part of his raiding cavalry was destroyed at Leobersdorf. In 1533 a truce at Constantinople left Ferdinand the west and north of Hungary that he held, and Zápolya the rest as the sultan’s vassal.": "Dans un compte Jurišić a refusé de se rendre ; dans l’autre il a accepté une reddition symbolique dans laquelle quelques soldats ottomans ont levé leur drapeau sur les murs. De toute façon, le sultan, avec la saison tardive, n’est pas allé à Vienne, où Charles rassemblait une armée impériale d’environ 80 000 hommes. En 1533, une trêve à Constantinople quitta Ferdinand à l’ouest et au nord de la Hongrie qu’il tenait, et Zápolya le reste comme le sultan."
