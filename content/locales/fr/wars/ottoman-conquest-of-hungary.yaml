"The fall of Belgrade": "La chute de Belgrade"
"Belgrade, where the Sava meets the Danube, had been the key to Hungary’s southern defences since John Hunyadi held it against Mehmed II in 1456. In 1520 the young Suleiman I became sultan, and Hungary was weak; its king, Louis II, was fifteen, and its great nobles were divided and its treasury empty. When Louis’s council refused the sultan’s demand for tribute and held his envoy, Suleiman led an army north from Constantinople in May 1521, with little help coming to Hungary from the rest of Christendom.": "Belgrade, où la Save rencontre le Danube, avait été la clé des défenses sud de la Hongrie depuis que John Hunyadi la tenait contre Mehmed II en 1456. En 1520 le jeune Suleiman Ier devint sultan, et la Hongrie était faible ; son roi, Louis II, était quinze, et ses grands nobles étaient divisés et son trésor vide. Lorsque le concile de Louis refusa la demande du sultan pour l’hommage et tenu son envoyé, Suleiman conduisit une armée au nord de Constantinople en mai 1521, avec peu d’aide venant en Hongrie du reste de la chrétienté."
"Suleiman himself took Šabac on the Sava, where the defenders were killed to the last man, while the grand vizier Piri Mehmed Pasha took Zemun and laid siege to Belgrade. The fortress had only about 700 defenders, and no relief army came. After weeks of bombardment and mining the citadel surrendered at the end of August; most sources give 29 August. About 70 defenders survived and were spared, and many of the Serbian townspeople were deported to Constantinople. The road up the Danube into Hungary was open.": "Suleiman lui-même a pris Šabac sur la Save, où les défenseurs ont été tués au dernier homme, tandis que le grand vizier Piri Mehmed Pasha a pris Zemun et a posé siège à Belgrade. La forteresse n’avait qu’environ 700 défenseurs, et aucune armée de secours est venue. Après des semaines de bombardement et d’exploitation minière la citadelle s’est rendue à la fin du mois d’août ; la plupart des sources donnent 29 août. Environ 70 défenseurs ont survécu et ont été épargnés, et beaucoup des habitants serbes ont été déportés à Constantinople. La route vers le Danube en Hongrie était ouverte."
