"In April 1526 Suleiman marched again with a large army, probably 50,000–60,000 fighting men and perhaps many more with the irregulars. Petrovaradin on the Danube fell in July after a stubborn defence, and in August the Ottomans crossed the Drava at Osijek on a bridge of boats. King Louis gathered some 25,000–30,000 men, Hungarians, Croats, Poles, Germans, Czechs and Serbs, at Mohács, but the Transylvanian army of John Zápolya and the Croatian troops of Christoph Frankopan were still far away. His commanders, among them Pál Tomori, archbishop of Kalocsa, chose to fight on the open plain rather than retreat to Buda.": "En avril 1526, Suleiman marcha de nouveau avec une grande armée, probablement entre 50 000 et 60 000 combattants et peut-être beaucoup plus avec les irréguliers. Petrovaradin sur le Danube tomba en juillet après une défense tenace, et en août, les Ottomans traversèrent la Drava à Osijek sur un pont de bateaux. Le roi Louis a rassemblé entre 25 000 et 30 000 hommes, Hongrois, Croates, Polonais, Allemands, Tchèques et Serbes, à Mohács, mais l’armée transylvanienne de John Zápolya et les troupes croates de Christoph Frankopan étaient encore loin. Ses commandants, parmi eux Pál Tomori, archevêque de Kalocsa, ont choisi de se battre sur la plaine ouverte plutôt que de se replier vers Buda."
"The battle was fought on the afternoon of 29 August. A Hungarian charge broke into the Ottoman front line, but was caught by the janissaries and the guns and then surrounded; within a few hours the royal army was destroyed. More than 14,000 Hungarian soldiers died, among them seven bishops and archbishops, Tomori one of them, and 28 barons, and about 2,000 prisoners were killed after the battle. Louis drowned in the flooded Csele stream as he fled. Suleiman entered Buda, which had been abandoned, on 11 September; his troops burned it and Pest, and the army went home in October with much plunder and many captives, keeping only a few fortresses in Syrmia.": "La bataille a eu lieu dans l’après-midi du 29 août. Une charge hongroise s’est effondrée sur la ligne de front ottomane, mais elle a été prise par les janissaires et les canons puis encerclée ; en quelques heures, l’armée royale a été détruite. Plus de 14 000 soldats hongrois sont morts, dont sept évêques et archevêques, Tomori l’un d’eux, et 28 barons, et environ 2 000 prisonniers ont été tués après la bataille. Louis s’est noyé dans le ruisseau Csele inondé en fuyant. Suleiman est entré dans Buda, qui avait été abandonné, le 11 septembre ; ses troupes l’ont brûlé et Pest, et l’armée est rentrée chez elle en octobre avec beaucoup de pillages et beaucoup de captifs, gardant seulement quelques forteresses en Syrmie."
