"The siege of Vienna": "Le siège de Vienne"
"Suleiman set out from Constantinople on 10 May 1529, but the spring rains were so heavy that he had to leave his largest siege guns behind and lost many camels on the way. On 18 August Zápolya met him on the field of Mohács and paid homage, and on 8 September Buda surrendered and was handed back to Zápolya. Most of the castles Ferdinand had taken gave up without a fight, and the army marched on up the Danube into Austria, its light cavalry raiding far ahead.": "Suleiman partit de Constantinople le 10 mai 1529, mais les pluies printanières étaient si lourdes qu’il dut laisser derrière lui ses plus grands fusils de siège et perdre beaucoup de chameaux en route. Le 18 août Zápolya le rencontra sur le champ de Mohács et rendit hommage, et le 8 septembre Buda se rendit et fut remis à Zápolya. La plupart des châteaux de Ferdinand avaient abandonné sans se battre, et l’armée marchait sur le Danube vers l’Autriche, sa légère cavalerie s’avançant loin devant."
"The siege of Vienna began on 27 September. Count Niklas Salm and Wilhelm von Roggendorf had perhaps 16,000 soldiers, with Spanish arquebusiers and German landsknechts among them, and some 5,000 armed citizens; the Ottomans may have had 75,000–100,000 men at the walls. Their miners blew several breaches, but every assault was thrown back. With winter coming, supplies short and more rain falling, a last great attack on 14 October failed, and the next day the army began its retreat, killing many of its captives as it went.": "Le siège de Vienne a commencé le 27 septembre. Les comtes Niklas Salm et Wilhelm von Roggendorf avaient peut-être 16 000 soldats, dont des arquebusiers espagnols et des landsknechts allemands, et quelque 5 000 citoyens armés ; les Ottomans ont peut-être eu 75 000 à 100 000 hommes aux murs. L’hiver étant venu, les approvisionnements sont courts et de plus en plus pluvieux, la dernière grande attaque du 14 octobre échoua, et le lendemain l’armée commença sa retraite, tuant beaucoup de ses captifs au fur et à mesure."
