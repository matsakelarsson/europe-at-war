# Some French text was translated automatically.
"Ottoman conquest of Karaman": "Conquête ottomane de Karaman"
"The Ottoman annexation of the Karamanid beylik of central and southern Anatolia, for two centuries the Ottomans’ strongest Turkish rival. After the death of İbrahim Bey in 1464 his sons fought over the succession, and Mehmed II backed first one and then another. In 1468 he occupied Konya and Karaman (Larende) and made the country an Ottoman province under his son Mustafa, but Pir Ahmed and his brother Kasım held out in the Taurus mountains with the help of the Turkmen tribes and of Uzun Hasan of the Aq Qoyunlu, whose army drove into Karaman in 1472. After Uzun Hasan’s defeat at Otlukbeli in 1473, Gedik Ahmed Pasha took the remaining castles in the mountains and on the coast, such as Silifke, by 1474. Karamanid pretenders kept up resistance for some years more.": "L’annexion ottomane du béylik karamanide de l’Anatolie centrale et méridionale, pendant deux siècles le plus fort rival turc des Ottomans. Après la mort d’Ibrahim Bey en 1464 ses fils ont combattu sur la succession, et Mehmed II a soutenu d’abord un et puis un autre. En 1468, il occupe Konya et Karaman (Larende) et fait du pays une province ottomane sous son fils Mustafa, mais Pir Ahmed et son frère Kasım se tiennent dans les montagnes du Taureau avec l’aide des tribus turkmènes et d’Uzun Hasan de l’Aq Qoyunlu, dont l’armée s’est rendue à Karaman en 1472. Après la défaite d’Uzun Hasan, en 1473, à Otlukbeli, Gedik Ahmed Pasha prit les châteaux restants dans les montagnes et sur la côte, comme Silifke, en 1474."
"Dates for the end of the Karamanid state vary between 1474 and 1487, depending on whether the last pretenders are counted.": "Les dates pour la fin de l’état Karamanide varient entre 1474 et 1487, selon que les derniers prétendants sont comptés."
