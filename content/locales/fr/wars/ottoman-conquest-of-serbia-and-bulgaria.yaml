"The site is uncertain; most historians place it near the Argeș river. Both sides suffered heavily, and both claimed the victory.": "Le site est incertain ; la plupart des historiens le placent près de la rivière Argeș. Les deux camps ont beaucoup souffert, et les deux ont revendiqué la victoire."
"Bayezid took the fortress by surprise from the north. Ivan Shishman was executed, or by some accounts died in prison.": "Bayezid a pris la forteresse par surprise du nord. Ivan Shishman a été exécuté, ou d’après certains récits est mort en prison."
"Battle of Nicopolis": "Bataille de Nicopolis"
"25 September 1396": "25 septembre 1396"
"Bayezid destroyed the crusader army of Sigismund of Hungary and John of Nevers outside the town (see the crusade of Nicopolis).": "Bayezid a détruit l’armée de croisés de Sigismond de Hongrie et Jean de Nevers en dehors de la ville (voir la croisade de Nicopolis)."
"Vidin": "Vivin"
"Ivan Sratsimir, who had sided with the crusaders, was deposed and taken to Bursa. It was the end of the Bulgarian state.": "Ivan Sratsimir, qui avait pris parti pour les croisés, fut déposé et emmené à Bursa. C’était la fin de l’État bulgare."
