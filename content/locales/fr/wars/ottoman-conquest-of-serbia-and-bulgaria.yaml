"The sultan’s demands and the plundering of his raiders pushed the Serbian lords together. In 1386 or 1387 an Ottoman raiding army entered the Toplica valley; while most of its men were scattered plundering, Lazar’s army caught it near Pločnik, close to Prokuplje, and routed it. In August 1388 Lala Şahin Pasha, called in by Đurađ II Balšić of Zeta against King Tvrtko I of Bosnia, plundered Hum in the south of Tvrtko’s kingdom. Ragusa took in refugees, and near Bileća the Bosnian grand duke Vlatko Vuković destroyed the raiders; Şahin escaped with a few men.": "En 1386 ou 1387, une armée ottomane entra dans la vallée de Toplica ; tandis que la plupart de ses hommes étaient éparpillés, l’armée de Lazare l’attrape près de Pločnik, près de Prokuplje, et la dirigea. En août 1388, Lala Şahin Pasha, appelé par le roi de Zeta contre le roi Tvrtko Ier de Bosnie, pilla Hum dans le sud du royaume de Tvrtko. Ragusa prit des réfugiés, et près de Bileća le grand-duc bosniaque Vlatko Vuković détruisit les raideurs ; Şahin s’échappa avec quelques hommes."
"Encouraged, Ivan Shishman of Tarnovo refused to send troops to the sultan. In 1388 the grand vizier Çandarlı Ali Pasha crossed the Balkan Mountains with a large army, took Shumen and other fortresses and besieged Shishman in Nicopolis on the Danube. Shishman promised to give up Silistra, then broke his word; Ali Pasha returned, took more towns and besieged him again, and this time he submitted on harder terms, with Ottoman garrisons in Silistra and Shumen. His half-brother Ivan Sratsimir of Vidin also accepted Ottoman overlordship and a garrison.": "Encouragé, Ivan Shishman de Tarnovo a refusé d’envoyer des troupes au sultan. En 1388 le grand vizier Çandarlı Ali Pacha a traversé les montagnes des Balkans avec une grande armée, pris Shumen et autres forteresses et assiégé Shishman à Nicopolis sur le Danube. Shishman promit de renoncer à Silistra, puis rompit sa parole ; Ali Pacha revint, prit plus de villes et l’assiégea de nouveau, et cette fois il se présenta à des conditions difficiles, avec des garnisons ottomanes à Silistra et à Choumen. Son demi-frère Ivan Sratsimir de Vidin accepta également la domination ottomane et une garnison."
