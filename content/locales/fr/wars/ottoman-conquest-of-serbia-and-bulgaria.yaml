"Ottoman conquest of Serbia and Bulgaria": "Conquête ottomane de la Serbie et de la Bulgarie"
"The quarter-century in which the Ottomans broke the Serbian and Bulgarian states that had dominated the central Balkans. After the Serbian lords of Macedonia were destroyed at the Maritsa in 1371, their heirs and the tsar of Tarnovo became Ottoman vassals; Sofia and Niš fell in the 1380s, and although the Serbs and Bosnians won at Pločnik and Bileća, the battle of Kosovo in 1389, in which both Prince Lazar and Sultan Murad I were killed, left Serbia a vassal state. Bayezid I took Tarnovo in 1393 and Nicopolis in 1395, and after the crusade of Nicopolis in 1396 he annexed Vidin, the last Bulgarian realm.": "Le quart de siècle au cours duquel les Ottomans ont brisé les États serbes et bulgares qui avaient dominé les Balkans centraux. Après la destruction des seigneurs serbes de Macédoine au Maritsa en 1371, leurs héritiers et le tsar de Tarnovo sont devenus des vassaux ottomans ; Sofia et Niš sont tombés dans les années 1380, et bien que les Serbes et les Bosniaques aient gagné à Pločnik et Bileća, la bataille du Kosovo en 1389, où le prince Lazar et le sultan Murad I ont été tués, a quitté la Serbie un État vassal. Bayezid J’ai pris Tarnovo en 1393 et Nicopolis en 1395, et après la croisade de Nicopolis en 1396 il a annexé Vidin, le dernier royaume bulgare."
"Dates are Julian, as usual for the period. The battle of Kosovo was fought on 15 June 1389 by the Julian calendar; it is commemorated on St Vitus’ Day (Vidovdan), now 28 June.": "Les dates sont Julian, comme d’habitude pour la période. La bataille du Kosovo a été combattue le 15 Juin 1389 par le calendrier julien ; il est commémoré le Saint Vitus (Vidovdan), maintenant 28 juin."
"Sources for these years are scarce and often written long afterwards, and many dates are uncertain. The chronicles’ numbers are much too large; modern historians think most armies of the time numbered a few thousand to a few tens of thousands.": "Les sources pour ces années sont rares et souvent écrites longtemps après, et de nombreuses dates sont incertaines.Les nombres des chroniques sont beaucoup trop grands ; les historiens modernes pensent que la plupart des armées de l’époque ont compté quelques milliers à quelques dizaines de milliers."
"The battle of Kosovo became the centre of a Serbian national tradition, the Kosovo myth, that grew in the 19th century; Albanian, Bosnian and other historians stress their own peoples’ part in Lazar’s army. Who fought, and how the battle went, is still argued over.": "La bataille du Kosovo est devenue le centre d’une tradition nationale serbe, le mythe du Kosovo, qui a grandi au 19ème siècle ; les Albanais, les Bosniaques et d’autres historiens soulignent leur propre peuple."
"Places are given their usual English names, with others in brackets where helpful (Chernomen/Ormenio, Velbazhd/Kyustendil, Tarnovo/Veliko Tarnovo, Nicopolis/Nikopol). The crusade of Nicopolis (1396) has its own entry.": "Les lieux sont donnés leur nom anglais habituel, avec d’autres entre parenthèses où utile (Chernomen/Ormenio, Velbazhd/Kyustendil, Tarnovo/Veliko Tarnovo, Nicopolis/Nikopol). La croisade de Nicopolis (1396) a sa propre entrée."
