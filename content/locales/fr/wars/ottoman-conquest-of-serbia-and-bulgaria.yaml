"Bayezid I, called Yıldırım, the Thunderbolt, replaced vassal rule with direct rule wherever he could. Vuk Branković, who had refused to submit after Kosovo, lost Skopje in 1392 and was forced to pay tribute; Ottoman forces took Thessaly in 1393. Ivan Shishman, who was negotiating in secret with King Sigismund of Hungary, was the next target. In the spring of 1393 Bayezid gathered troops from Anatolia and the Balkans and sent his son Süleyman Çelebi to besiege Tarnovo, the Bulgarian capital.": "Bayezid Ier, appelé Yıldırım, le Thunderbolt, a remplacé la domination vassale par une règle directe où qu’il puisse. Vuk Branković, qui avait refusé de se soumettre après le Kosovo, a perdu Skopje en 1392 et a été forcé de rendre hommage ; les forces ottomanes ont pris Thessalie en 1393. Ivan Shishman, qui négociait en secret avec le roi Sigismund de Hongrie, était la prochaine cible. Au printemps de 1393, Bayezid rassembla des troupes d’Anatolie et des Balkans et envoya son fils Süleyman Çelebi pour assiéger Tarnovo, la capitale bulgare."
"Shishman was at Nicopolis, and Patriarch Euthymius led the defence. After three months Tarnovo fell on 17 July 1393. Its churches were turned into mosques, leading citizens were killed and Euthymius was sent into exile; the Bulgarian patriarchate ceased to exist and its sees came under Constantinople. Shishman kept only Nicopolis and a few towns on the Danube. That winter Bayezid summoned his Christian vassals, among them Emperor Manuel II and Stefan Lazarević, to Serres, where by Byzantine accounts he thought of having them killed.": "Au bout de trois mois, Tarnovo tomba le 17 juillet 1393. Ses églises furent transformées en mosquées, les principaux citoyens furent tués et Euthymius fut envoyé en exil ; le patriarcat bulgare cessa d’exister et ses vues vinrent sous Constantinople. Shishman ne conserva que Nicopolis et quelques villes sur le Danube. Cet hiver-là, Bayezid convoqua ses vassaux chrétiens, parmi lesquels l’empereur Manuel II et Stefan Lazarević, à Serres, où il songea par des récits byzantins à les faire tuer."
