"Rovine and the end of Vidin": "Rovine et la fin de Vidin"
"1395–1396": "1395–1396"
"Mircea the Elder of Wallachia had seized Silistra and Dobruja and raided across the Danube. In 1395 Bayezid crossed into Wallachia with his Serbian vassals, among them Stefan Lazarević, Marko and Konstantin Dejanović. On 17 May 1395 Mircea’s army, its archers to the fore, met the Ottomans at Rovine, a marshy place probably near the Argeș; Marko and Konstantin were killed. The battle’s outcome is disputed: Christian sources speak of a Wallachian victory, Ottoman ones of their own, and many historians of a bloody draw. Bayezid set up a rival prince, Vlad, but Mircea soon regained his throne.": "Mircea, l’aîné de Wallachie, avait saisi Silistra et Dobruja et a fait une descente sur le Danube. En 1395, Bayezid a traversé Wallachia avec ses vassaux serbes, dont Stefan Lazarević, Marko et Konstantin Dejanović. Le 17 mai 1395, l’armée de Mircea, ses archers au premier plan, rencontra les Ottomans à Rovine, un lieu marécageux probablement près de l’Argeș ; Marko et Konstantin furent tués. L’issue de la bataille est contestée : des sources chrétiennes parlent d’une victoire wallachienne, des ottomans à eux, et de nombreux historiens d’un tirage sanglant. Bayezid a établi un prince rival, Vlad, mais Mircea a bientôt retrouvé son trône."
"On his way back Bayezid took Nicopolis, and Ivan Shishman was put to death, on 3 June 1395 according to a Bulgarian chronicle. The last Bulgarian ruler, Ivan Sratsimir of Vidin, joined King Sigismund’s crusade the next year and opened Vidin to the crusaders. After the Ottoman victory at Nicopolis on 25 September 1396, Bayezid marched on Vidin, took it and sent Sratsimir to prison in Bursa, where he probably died. His son Konstantin claimed the title of tsar in exile until 1422; Bulgaria remained under Ottoman rule until 1878.": "Sur son chemin retour Bayezid a pris Nicopolis, et Ivan Shishman a été mis à mort, le 3 juin 1395 selon une chronique bulgare. Le dernier dirigeant bulgare, Ivan Sratsimir de Vidin, rejoint le roi Sigismund , l’année suivante croisade et ouvre Vidin aux croisés. Après la victoire ottomane à Nicopolis le 25 septembre 1396, Bayezid marcha sur Vidin, l’emmena et envoya Sratsimir en prison à Bursa, où il mourut probablement. Son fils Konstantin revendiqua le titre de tsar en exil jusqu’en 1422 ; la Bulgarie resta sous domination ottomane jusqu’en 1878."
