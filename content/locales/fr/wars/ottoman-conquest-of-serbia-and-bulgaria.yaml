"After the death of Stefan Dušan in 1355 his Serbian empire broke up among regional lords. In 1371 two brothers who ruled the south, Vukašin Mrnjavčević, king alongside the weak emperor Uroš V, and Despot Jovan Uglješa, lord of Serres, led an army east to strike at the Ottomans in Thrace while Sultan Murad I was in Anatolia. On 26 September 1371 Ottoman frontier troops under Lala Şahin Pasha and Hacı İlbey fell on their camp by night near Chernomen on the Maritsa, west of Adrianople. Both brothers were killed and their army destroyed. Uroš V died in December, the last of the Nemanjić dynasty.": "Après la mort de Stefan Dušan en 1355, son empire serbe s’est rompu entre les seigneurs régionaux. En 1371, deux frères qui gouvernaient le sud, Vukašin Mrnjavčević, roi aux côtés du faible empereur Uroš V, et Despot Jovan Uglješa, seigneur de Serres, menèrent une armée à l’Est pour frapper les Ottomans de Thrace tandis que le Sultan Murad I était en Anatolie. Le 26 septembre 1371, les troupes de la frontière ottomane sous Lala Şahin Pacha et Hacı ìlbey tombèrent sur leur camp de nuit près de Chernomen sur le Maritsa, à l’ouest d’Adrianople. Les deux frères furent tués et leur armée détruite."
"The lords of Macedonia submitted to the sultan, paying tribute and sending troops when called. Vukašin’s son Marko ruled from Prilep and the brothers Jovan Dragaš and Konstantin Dejanović held the lands around Velbazhd (Kyustendil) as Ottoman vassals; Byzantium recovered Serres for a time, but the Ottomans took it in 1383. In Bulgaria, Ivan Shishman of Tarnovo lost northern Thrace and in 1373 accepted Ottoman overlordship, marrying his sister Kera Tamara to Murad. In the north Prince Lazar Hrebeljanović built up a strong state in the Morava valley, and his men drove off Ottoman raiders at Dubravnica.": "Les seigneurs de Macédoine se soumettaient au sultan, rendant hommage et envoyant des troupes lorsqu’on les appelait. Le fils de Vukašin Marko régnait de Prilep et les frères Jovan Dragaš et Konstantin Dejanović détenaient les terres autour de Velbazhd (Kyustendil) comme vassaux ottomans ; Byzantium récupérait Serres pendant un certain temps, mais les Ottomans le prirent en 1383. En Bulgarie, Ivan Shishman de Tarnovo a perdu Thrace du nord et en 1373 a accepté l’hommage ottoman, épousant sa sœur Kera Tamara à Murad. Dans le nord Prince Lazar Hrebeljanović construit un État fort dans la vallée de Morava, et ses hommes ont chassé les raideurs ottomans à Dubravnica."
