"In the spring of 1389 Murad gathered his army at Philippopolis and, with his sons Bayezid and Yakub, marched west by way of Ihtiman, Velbazhd and Kratovo, where vassal contingents probably joined him, and on through Kumanovo to Pristina, which he reached on 14 June. Lazar, who had assembled his army near Niš, moved through Prokuplje to meet him. With him came his son-in-law Vuk Branković, lord of Kosovo, and Bosnian troops under Vlatko Vuković sent by Tvrtko; Albanian lords and others may also have fought. Modern estimates give Murad perhaps 27,000–30,000 men and Lazar 15,000–20,000.": "Au printemps de 1389, Murad rassembla son armée à Philippopolis et, avec ses fils Bayezid et Yakub, marcha vers l’ouest en passant par Ihtiman, Velbazhd et Kratovo, où les contingents vassaux se joignirent probablement à lui, et par Kumanovo jusqu’à Pristina, qu’il atteignit le 14 juin. Lazar, qui avait assemblé son armée près de Niš, s’est déplacé à travers Prokuplje pour le rencontrer. Avec lui est venu son gendre Vuk Branković, seigneur du Kosovo, et les troupes bosniaques sous Vlatko Vuković envoyé par Tvrtko ; les seigneurs albanais et d’autres ont peut-être également combattu."
"On 15 June 1389 the armies met on the Field of Blackbirds north-west of Pristina. Few reliable details survive. The Serbian cavalry broke into the Ottoman left before the Ottomans, with Bayezid on the right, gained the upper hand. Murad was killed, by a Serbian knight whom later tradition calls Miloš Obilić; Lazar was captured and executed, and Bayezid had his brother Yakub strangled to secure the throne. Both armies lost heavily. Tvrtko proclaimed a victory, but Serbia could not raise such an army again: Lazar’s widow Milica, ruling for their son Stefan Lazarević, accepted Ottoman overlordship, and Stefan’s sister Olivera was married to Bayezid.": "Le 15 juin 1389, les armées se rencontrèrent sur le champ des Blackbirds au nord-ouest de Pristina. Peu de détails fiables survivent. La cavalerie serbe s’est effondrée dans la gauche ottomane avant que les Ottomans, avec Bayezid à droite, ne prennent le dessus. Murad a été tué par un chevalier serbe que la tradition appelle plus tard Miloš Obilić ; Lazar a été capturé et exécuté, et Bayezid a fait étrangler son frère Yakub pour sécuriser le trône. Les deux armées ont fortement perdu. Tvrtko a proclamé une victoire, mais la Serbie n’a pas pu réunir une telle armée à nouveau : La veuve de Lazare Milica, qui régnait pour leur fils Stefan Lazarević, acceptait l’expropriété ottomane, et la sœur de Stefan Olivera était mariée à Bayezid."
