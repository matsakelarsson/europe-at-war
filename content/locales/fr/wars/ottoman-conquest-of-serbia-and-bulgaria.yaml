"In the early 1380s the Ottomans pressed west along the great road from Adrianople towards Belgrade. Sofia, which commanded the routes into Serbia and Macedonia, beat off Lala Şahin Pasha until a renegade lured its governor, Yanuka, out of the town to hunt; he was captured and the leaderless defenders surrendered. The fall is dated to 1382 or to 1385. The walls were pulled down and Sofia became the seat of an Ottoman governor. In 1386 Murad himself took Pirot and, after a siege, Niš, driving a wedge between Bulgaria and Lazar’s Serbia.": "Au début des années 1380, les Ottomans pressèrent vers l’ouest le long de la grande route qui allait d’Adrianople à Belgrade. Sofia, qui commandait les routes en Serbie et en Macédoine, battit Lala Şahin Pasha jusqu’à ce qu’un renégat attire son gouverneur, Yanuka, hors de la ville pour chasser ; il fut capturé et les défenseurs sans chef se rendirent. En 1386, Murad lui-même prit Pirot et, après un siège, Niš, conduisant un coin entre la Bulgarie et la Serbie de Lazare."
"The Ottomans were also drawn into the feuds of the Albanian and Serbian lords on the Adriatic. Called in by Karl Thopia against Balša II of Zeta, who had taken Durrës from him, Hayreddin Pasha brought an army from Ohrid into the plain near Lushnjë. On 18 September 1385 Balša rode out against it with a small force and was killed in the battle of Savra. Afterwards many lords of the region accepted Ottoman overlordship, and in 1386 Ottoman raiders appeared for the first time in Bosnia.": "Les Ottomans ont également été attirés dans les querelles des seigneurs albanais et serbes sur l’Adriatique. Appelés par Karl Thopia contre Balša II de Zeta, qui lui avait enlevé Durrës, Hayreddin Pacha a amené une armée d’Ohrid dans la plaine près de Lushnjë. Le 18 septembre 1385, Balša s’élança contre elle avec une petite force et fut tué dans la bataille de Savra. Par la suite, de nombreux seigneurs de la région acceptèrent la domination ottomane et, en 1386, des raideurs ottomans apparurent pour la première fois en Bosnie."
