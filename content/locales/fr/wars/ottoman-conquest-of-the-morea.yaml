# Some French text was translated automatically.
"Ottoman conquest of the Morea": "Conquête ottomane de la Morea"
"The conquest of the Despotate of the Morea, the last Byzantine state in Greece, by Mehmed II. The despots Thomas and Demetrios Palaiologos, brothers of the last emperor, quarrelled constantly and neglected their tribute. In May 1458 Mehmed invaded, took the Acrocorinth after a siege and annexed the north of the peninsula, including Corinth and Patras, leaving the brothers the south as tributaries. When they went to war with each other again, Thomas seeking help from the West and Demetrios from the Ottomans, Mehmed returned in 1460. Demetrios surrendered Mystras on 29 May 1460 and went into Ottoman service; Thomas fled to Corfu and Rome. Castles such as Salmeniko held out until July 1461. Venice kept Modon, Coron, Nauplia and Argos, and Monemvasia placed itself under the pope and later Venice.": "La conquête du Despotate de la Morea, le dernier état byzantin en Grèce, par Mehmed II. Les despotes Thomas et Demetrios Palaiologis, frères du dernier empereur, se disputèrent constamment et négligeaient leur tribut. En mai 1458 Mehmed envahit, prit l’Acrocorinthe après un siège et annexe le nord de la péninsule, y compris Corinthe et Patras, laissant les frères du sud comme affluents. Lorsqu'ils allèrent à nouveau en guerre entre eux, Thomas cherchant l’aide de l’Occident et Demetrios des Ottomans, Mehmed revint en 1460. Demetrios a rendu Mystras le 29 mai 1460 et est allé au service ottoman ; Thomas s’est enfui à Corfou et Rome. Des châteaux comme Salmeniko ont tenu jusqu’en juillet 1461. Venise a gardé Modon, Coron, Nauplia et Argos, et Monemvasia se place sous le pape et plus tard Venise."
"Mystras fell on 29 May 1460, seven years to the day after Constantinople. Venice’s attempt to take the peninsula in the war of 1463–1479 has its own entry.": "Mystras est tombé le 29 mai 1460, sept ans après Constantinople. Venise a tenté de prendre la péninsule dans la guerre de 1463–1479 a sa propre entrée."
