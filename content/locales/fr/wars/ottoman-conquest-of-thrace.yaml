"1357": "1357"
"Ottoman conquest of Thrace": "Conquête ottomane de Thrace"
"The Ottoman advance from a first foothold on the Gallipoli peninsula across the plains of Thrace. Turkish troops hired by John VI Kantakouzenos were given the fortress of Tzympe around 1352, and after an earthquake ruined Gallipoli in March 1354 Orhan’s son Süleyman occupied it and refused to leave. Within fifteen years Didymoteicho, Philippopolis and Adrianople had fallen, the last at a date that sources give between 1361 and 1369, and Adrianople became the Ottomans’ main base in Europe.": "L’avancée ottomane d’un premier pied sur la péninsule de Gallipoli à travers les plaines de Thrace. Les troupes turques embauchées par John VI Kantakouzenos ont reçu la forteresse de Tzympe vers 1352, et après un tremblement de terre a ruiné Gallipoli en mars 1354 Orhan, le fils Süleyman l’occupa et refusa de partir. En quinze ans, Didymoteicho, Philippopolis et Adrianople étaient tombés, le dernier à une date que les sources donnent entre 1361 et 1369, et Adrianople est devenu la base principale des Ottomans en Europe."
"Dates for the conquest of Thrace are very uncertain. Later Ottoman chronicles put the fall of Adrianople in 1361 or 1362; Byzantine sources studied by Elisabeth Zachariadou point to 1369, which most modern historians accept. Some of the conquests may have been made by independent bands of frontier warriors rather than by the Ottoman ruler’s own troops.": "Les dates de la conquête de Thrace sont très incertaines. Des chroniques ottomanes plus tard ont mis la chute d’Adrianople en 1361 ou 1362 ; des sources byzantines étudiées par Elisabeth Zachariadou point à 1369, que la plupart des historiens modernes acceptent."
"Ottoman tradition tells of a great victory over a Serbian and Hungarian army near Adrianople, at Sırp Sındığı (“the rout of the Serbs”), in 1364; historians think the story may be a confused memory of the battle of the Maritsa in 1371, and it is not told here.": "La tradition ottomane raconte une grande victoire sur une armée serbe et hongroise près d’Adrianople, à Sırp Sındığı (la rout des Serbes), en 1364 ; les historiens pensent que l’histoire peut être un souvenir confus de la bataille du Maritsa en 1371, et il n’est pas raconté ici."
