"The Byzantine civil wars brought Turkish soldiers into Europe as allies of John VI Kantakouzenos, and their plundering of Thrace showed them its wealth. In about 1352, as a reward for help against John V and his Serbian allies, Kantakouzenos let Orhan’s son Süleyman Pasha garrison Tzympe, a small fortress on the Gallipoli peninsula. On 2 March 1354 a severe earthquake destroyed hundreds of villages and towns in the area. The walls of Gallipoli collapsed and its Greek inhabitants fled; within a month Süleyman occupied the town, repaired its defences and brought in Turkish settlers from Anatolia.": "Les guerres civiles byzantines ont amené des soldats turcs en Europe comme alliés de John VI Kantakouzenos, et leur pillage de Thrace leur a montré sa richesse. Dans environ 1352, comme une récompense pour l’aide contre John V et ses alliés serbes, Kantakouzenos a laissé Orhans fils Süleyman Pasha garnison Tzympe, une petite forteresse sur la péninsule Gallipoli. Le 2 mars 1354, un grave tremblement de terre a détruit des centaines de villages et de villes dans la région. Les murs de Gallipoli s’est effondré et ses habitants grecs ont fui ; en moins d’un mois, Süleyman a occupé la ville, réparé ses défenses et amené des colons turcs d’Anatolie."
"Kantakouzenos offered money to have it back, but Orhan replied that God had given him the town. Panic spread in Constantinople, and in November 1354 John V seized the city and Kantakouzenos abdicated and became a monk. From Gallipoli, the gateway between Asia and Europe, Süleyman’s men raided and settled the Thracian plain, taking towns such as Rodosto (Tekirdağ), Malkara and İpsala. Süleyman died in a hunting accident in 1357, and the advance slowed for a time when Orhan’s young son Halil was kidnapped by pirates and held at Phocaea until 1359.": "Kantakouzenos offrit de l’argent pour le récupérer, mais Orhan répondit que Dieu lui avait donné la ville. Panic se répandit à Constantinople, et en novembre 1354 Jean V saisit la ville et Kantakouzenos abdiqué et devint moine. De Gallipoli, porte d’entrée entre l’Asie et l’Europe, les hommes de Süleyman ont fait une descente dans la plaine thracienne et s’y sont installés, prenant des villes comme Rodosto (Tekirdağ), Malkara et İpsala. Süleyman est mort dans un accident de chasse en 1357, et l’avance ralenti pendant un temps où Orhans jeune fils Halil a été enlevé par des pirates et maintenu à Phocée jusqu’à 1359."
