"1359–1369": "1359–1369"
"Under Orhan’s son Murad I, who succeeded him in about 1362, Ottoman forces and independent frontier warriors pushed up the valley of the Maritsa. Didymoteicho fell in 1360 or 1361. Philippopolis, held by Bulgaria since 1344, was taken in about 1363 by Lala Şahin Pasha, Murad’s tutor and commander in Europe. Turkish settlers and nomads followed the soldiers onto the Thracian plain, and the Ottomans pushed towards the Rhodopes and the Balkan Mountains.": "Sous le fils d’Orhan, Murad Ier, qui lui succéda dans environ 1362, les forces ottomanes et les guerriers frontaliers indépendants poussèrent la vallée de la Maritsa. Didymoteicho tomba en 1360 ou 1361. Philippopolis, détenu par la Bulgarie depuis 1344, fut pris en 1363 par Lala Şahin Pasha, tuteur de Murade et commandant en Europe. Des colons et des nomades turcs suivirent les soldats dans la plaine thrace, et les Ottomans poussèrent vers les Rhodopes et les Balkans."
"In 1366 Count Amadeus VI of Savoy, the emperor’s cousin, led a small crusade that retook Gallipoli, but it was not enough to reverse the tide; Andronikos IV handed the town back to the Ottomans in 1376 or 1377 for their help in his own bid for the throne. Adrianople, the third city of the empire, surrendered after its ruler fled by boat; Ottoman tradition dates this to 1361–1362, Byzantine sources to 1369. Many of its people were carried off into captivity. Renamed Edirne, it became the Ottoman military centre in Europe and later the sultans’ capital.": "En 1366, le comte Amadeus VI de Savoie, cousin de l’empereur, conduisit une petite croisade qui reprenait Gallipoli, mais il ne suffisait pas d’inverser la marée ; Andronikos IV remit la ville aux Ottomans en 1376 ou 1377 pour leur aide dans sa propre demande de trône. Adrianople, la troisième ville de l’empire, s’est rendu après que son chef ait fui par bateau ; la tradition ottomane date de 1361–1362, sources byzantines à 1369. Beaucoup de ses habitants ont été emmenés en captivité."
