# French translations of the catalogue text (wave 12); step bodies follow later.
Ottoman conquest of Tripoli: Conquête ottomane de Tripoli
? The siege in which an Ottoman fleet took Tripoli from the Knights of St John (the Hospitallers) in August 1551. Spain had captured the city in 1510 and handed it to the Knights, with Malta and Gozo, in 1530. After a Spanish and Hospitaller force drove the corsair captain Turgut Reis (Dragut) out of Mahdia in 1550, Sultan Suleiman sent a fleet of about 145 ships with 10,000–12,000 soldiers under Sinan Pasha, with Turgut. It struck Malta first, landing on 18 July and failing before Mdina, then took the citadel of Gozo on 26 July and carried off some 5,000–7,000 of the island’s people into slavery. On 8 August it landed before Tripoli, joined by Murad Agha and the people of Tajura, who had resisted the Knights for years. The governor, Gaspard de Vallier, held only a few dozen knights and 500–600 soldiers, many of them Calabrian and Sicilian mercenaries who mutinied, and he surrendered on 14 August after six days of bombardment. The French ambassador to the Porte, Gabriel d’Aramon, who had come to dissuade the Ottomans, obtained the release of the knights and some others, who sailed to Malta; about 200 local auxiliaries of the Knights were executed and the rest of the garrison was enslaved. Sinan made Murad Agha governor; Turgut, who had hoped for the post, received it in the 1550s and made Tripoli a base for the corsairs and for the Ottoman fleet. Tripoli stayed Ottoman, directly or under the Karamanli dynasty (1711–1835), until the Italian invasion of 1911.
: Le siège au cours duquel une flotte ottomane prit Tripoli aux chevaliers de Saint-Jean (les Hospitaliers) en août 1551. L’Espagne avait pris la ville en 1510 et l’avait remise aux chevaliers, avec Malte et Gozo, en 1530. Après qu’une force espagnole et hospitalière eut chassé de Mahdia le capitaine corsaire Turgut Reis (Dragut) en 1550, le sultan Soliman envoya une flotte d’environ 145 navires portant 10 000 à 12 000 soldats sous Sinan Pacha, accompagné de Turgut. Elle frappa d’abord Malte, où elle débarqua le 18 juillet et échoua devant Mdina, puis prit la citadelle de Gozo le 26 juillet et emmena en esclavage quelque 5 000 à 7 000 habitants de l’île. Le 8 août, elle débarqua devant Tripoli, rejointe par Murad Agha et les habitants de Tajoura, qui résistaient aux chevaliers depuis des années. Le gouverneur, Gaspard de Vallier, ne disposait que de quelques dizaines de chevaliers et de 500 à 600 soldats, dont beaucoup de mercenaires calabrais et siciliens qui se mutinèrent, et il capitula le 14 août après six jours de bombardement. L’ambassadeur de France auprès de la Porte, Gabriel d’Aramon, venu dissuader les Ottomans, obtint la libération des chevaliers et de quelques autres, qui partirent pour Malte ; environ 200 auxiliaires locaux des chevaliers furent exécutés et le reste de la garnison fut réduit en esclavage. Sinan nomma Murad Agha gouverneur ; Turgut, qui avait espéré ce poste, l’obtint dans les années 1550 et fit de Tripoli une base pour les corsaires et pour la flotte ottomane. Tripoli resta ottomane, directement ou sous la dynastie des Karamanli (1711–1835), jusqu’à l’invasion italienne de 1911.
