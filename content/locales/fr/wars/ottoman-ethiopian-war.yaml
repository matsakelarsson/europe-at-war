# French translations of the catalogue text (wave 12); step bodies follow later.
Ottoman–Ethiopian border wars: Guerres frontalières ottomano-éthiopiennes
Wars between the Ottoman Empire and the Ethiopian emperors for the Red Sea coast and the highlands behind it in the second half of the 16th century. To shut the Portuguese out of the Red Sea, the Ottomans proclaimed a province of Habesh and in 1557 sent Özdemir Pasha, who took Massawa, Arqiqo and Debarwa, the capital of the Bahr Negash, ruler of the coastal highlands of Medri Bahri. The Bahr Negash Yeshaq first fought the Ottomans with Emperor Gelawdewos, then rebelled against Emperor Minas and joined them, and with Ottoman musketeers defeated Minas in Enderta in 1562. Emperor Sarsa Dengel defeated Yeshaq and the Ottomans at Addi Qarro in 1578, killing both Yeshaq and the pasha, and destroyed the Ottoman fort at Debarwa; after a last Ottoman push inland he raided Arqiqo in 1589, and the two sides made peace. The Ottomans kept Massawa and the coast, soon governed for them by the local na’ibs, and gave up their ambitions in the highlands.: Les guerres que se livrèrent l’Empire ottoman et les empereurs d’Éthiopie pour la côte de la mer Rouge et les hauts plateaux de l’arrière-pays dans la seconde moitié du XVIe siècle. Pour fermer la mer Rouge aux Portugais, les Ottomans proclamèrent une province d’Habesh et envoyèrent en 1557 Özdemir Pacha, qui prit Massaoua, Arqiqo et Debarwa, la capitale du Bahr Negash, souverain des hauts plateaux côtiers du Medri Bahri. Le Bahr Negash Yeshaq combattit d’abord les Ottomans aux côtés de l’empereur Gelawdewos, puis se révolta contre l’empereur Minas et se rallia à eux, et battit Minas dans l’Enderta en 1562 avec l’aide de mousquetaires ottomans. L’empereur Sarsa Dengel battit Yeshaq et les Ottomans à Addi Qarro en 1578, tuant à la fois Yeshaq et le pacha, et détruisit le fort ottoman de Debarwa ; après une dernière poussée ottomane vers l’intérieur, il lança un raid sur Arqiqo en 1589, et les deux camps firent la paix. Les Ottomans conservèrent Massaoua et la côte, bientôt gouvernées en leur nom par les na’ibs locaux, et renoncèrent à leurs ambitions sur les hauts plateaux.
