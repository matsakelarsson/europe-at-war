"Ottoman–Habsburg War (1565–1568)": "Guerre ottomane-habsbourg (1565-1568)"
"A short war between the Habsburg emperor Maximilian II and the Ottoman Empire, allied with John Sigismund of Transylvania. Suleiman the Magnificent led his last campaign in 1566 and died in his tent during the siege of Szigetvár, whose defender, Nikola Zrinski, fell in a final sortie; the Ottomans also took Gyula. The Treaty of Adrianople of 1568 began a quarter of a century of uneasy peace in Hungary.": "Une courte guerre entre l’empereur des Habsbourg Maximilien II et l’Empire ottoman, allié avec John Sigismond de Transylvanie. Suleiman le Magnifique a mené sa dernière campagne en 1566 et est mort dans sa tente pendant le siège de Szigetvár, dont le défenseur, Nikola Zrinski, est tombé dans une sortie finale ; les Ottomans ont également pris Gyula. Le traité d’Adrianople de 1568 a commencé un quart de siècle de paix précaire en Hongrie."
"Dates are Julian. Sources differ by a day on the date of Suleiman’s death (5–7 September) and on the date of Zrinski’s last sortie (7 or 8 September 1566).": "Les sources diffèrent d’un jour à la date de la mort de Suleiman (5-7 septembre) et à la date de la dernière sortie de Zrinski (7 ou 8 septembre 1566)."
"Zrinski is a hero to both Croats and Hungarians, who know him as Nikola Šubić Zrinski and Zrínyi Miklós. His great-grandson, the poet and general Miklós Zrínyi, wrote the epic The Siege of Sziget about him, and Ivan Zajc’s opera Nikola Šubić Zrinski (1876) is one of the best known Croatian operas.": "Zrinski est un héros pour les Croates et les Hongrois, qui le connaissent comme Nikola Šubić Zrinski et Zrínyi Miklós. Son arrière-petit-fils, le poète et général Miklós Zrínyi, a écrit l’épopée Le siège de Sziget à son sujet, et Ivan Zajc. L’opéra Nikola Šubić Zrinski (1876) est un des opéras croates les plus connus."
