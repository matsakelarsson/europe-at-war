"1565–1568": "1565–1568"
"After Ferdinand I died in 1564, fighting broke out over the borderlands between his son Maximilian II and John Sigismund of Transylvania, and in 1565 the imperial general Lazarus von Schwendi took Tokaj. Suleiman, over seventy and ill, set out on his last campaign in May 1566. He meant to attack Eger, but turned on Szigetvár after its captain, Nikola Zrinski, raided an Ottoman camp at Siklós. From 5 August the Ottoman army, led in practice by the grand vizier Sokollu Mehmed Pasha, besieged the fortress, held by Zrinski with about 2,300 Croatian and Hungarian soldiers. Further east Pertev Pasha took Gyula on 2 September.": "Après la mort de Ferdinand en 1564, des combats éclatèrent au-dessus des frontières entre son fils Maximilien II et Jean Sigismond de Transylvanie, et en 1565 le général impérial Lazarus von Schwendi prit Tokaj. Suleiman, plus de soixante-dix malades, partit à sa dernière campagne en mai 1566. Il voulait attaquer Eger, mais se tourna vers Szigetvár après que son capitaine, Nikola Zrinski, fit une descente dans un camp ottoman à Siklós. A partir du 5 août l’armée ottomane, conduite en pratique par le grand vizier Sokollu Mehmed Pacha, assiégea la forteresse, tenue par Zrinski avec environ 2300 soldats croates et hongrois."
"The defenders lost the new town and the old town and withdrew into the castle, which mines and fire slowly destroyed. On 6 September Suleiman died in his tent; Sokollu kept his death secret for weeks so that the army would not break up. On 8 September, with the castle in flames, Zrinski led his last few hundred men out and was killed, and almost all of the garrison died; more than 20,000 Ottomans are thought to have died in the siege. Maximilian’s army lay at Győr and did not move. In February 1568 the Treaty of Adrianople made an eight-year truce, renewed for many years after.": "Les défenseurs ont perdu la nouvelle ville et la vieille ville et se sont retirés dans le château, que les mines et le feu ont lentement détruit. Le 6 septembre Suleiman est mort dans sa tente ; Sokollu a gardé son secret de mort pendant des semaines afin que l’armée ne rompe pas. Le 8 septembre, avec le château en flammes, Zrinski a conduit ses dernières centaines d’hommes et a été tué, et presque toute la garnison est morte ; plus de 20 000 Ottomans sont censés être morts dans le siège. L’armée Maximilienne était à Győr et ne bougeait pas. En février 1568 le traité d’Adrianople fait une trêve de huit ans, renouvelée pour plusieurs années après."
