# Some French text was translated automatically.
"Ottoman–Habsburg War in Hungary (1551–1562)": "Guerre ottoman-habsbourgeoise en Hongrie (1551-1562)"
"The war that followed Ferdinand I’s attempt to take over Transylvania in 1551. The Ottomans answered in 1552 by taking Temesvár, Szolnok and many castles, founding a new province in the Banat, but were held at Eger by István Dobó’s small garrison. Transylvania returned to John Sigismund Zápolya under Ottoman protection in 1556, and after years of border fighting a truce of 1562 confirmed the Ottoman gains.": "La guerre qui suivit la tentative de Ferdinand I, en 1551, pour prendre le contrôle de Transylvanie. Les Ottomans répondirent en 1552 en prenant Temesvár, Szolnok et de nombreux châteaux, créant une nouvelle province dans le Banat, mais ont été tenus à Eger par la petite garnison d’István Dobó. La Transylvanie est revenue à John Sigismond Zápolya sous la protection ottomane en 1556, et après des années de lutte contre une trêve de 1562 a confirmé les gains ottomans."
"Dates are Julian. Hungarian historians often treat these years as the last phase of the wars of 1526–1568 for the Hungarian crown.": "Dates sont Julian. Les historiens hongrois considèrent souvent ces années comme la dernière phase des guerres de 1526-1568 pour la couronne hongroise."
"The defence of Eger is the subject of Géza Gárdonyi’s novel Egri csillagok (1901, in English Eclipse of the Crescent Moon), one of the best-loved books in Hungary.": "La défense d’Eger est le sujet du roman de Géza Gárdonyi, Egri csillagok (1901, en anglais Eclipse of the Crescent Moon), l’un des livres les plus aimés de Hongrie."
