"1551–1552": "1551–1552"
"In 1551 the monk George Martinuzzi, who governed Transylvania for the young John Sigismund, persuaded Queen Isabella to hand the eastern kingdom and the Holy Crown to Ferdinand I, and imperial troops under Giovanni Battista Castaldo moved in. Martinuzzi, now a cardinal, went on negotiating with the Ottomans, and on 17 December 1551 Castaldo’s men murdered him at Alvinc, with Ferdinand’s consent. In 1552 two Ottoman armies invaded. Hadım Ali Pasha, governor of Buda, took Veszprém and Drégely, whose captain György Szondi died rather than surrender, while Kara Ahmed Pasha took Temesvár on 27 July and killed most of its garrison as it marched out, its commander István Losonczy among them.": "En 1551, le moine George Martinuzzi, qui dirigeait la Transylvanie pour le jeune John Sigismond, persuada la reine Isabella de remettre le royaume oriental et la Sainte Couronne à Ferdinand Ier, et les troupes impériales sous Giovanni Battista Castaldo emménagèrent. Martinuzzi, aujourd'hui cardinal, poursuivit la négociation avec les Ottomans et le 17 décembre 1551 Castaldo, les hommes le tuèrent à Alvinc, avec le consentement de Ferdinand. En 1552 deux armées ottomanes envahirent. Hadım Ali Pasha, gouverneur de Buda, a pris Veszprém et Drégely, dont le capitaine György Szondi est mort plutôt que de se rendre, tandis que Kara Ahmed Pasha a pris Temesvár le 27 juillet et tué la plupart de sa garnison alors qu’elle sortait, son commandant István Losonczy parmi eux."
"Lippa and Szolnok fell too, and the two armies, perhaps 35,000–40,000 strong, joined to besiege Eger in September. Its captain, István Dobó, had about 2,000 defenders, soldiers, peasants and townspeople, women among them. For five weeks they repaired the walls by night and threw back five great assaults, and on 18 October the Ottomans withdrew. The defence became a Hungarian legend. Still, the campaign had won the Ottomans the Banat, which became the province of Temesvár, and dozens of castles in northern Hungary.": "Lippa et Szolnok sont tombés aussi, et les deux armées, peut-être 35 000 à 40 000, se sont jointes pour assiéger Eger en septembre. Son capitaine, István Dobó, comptait environ 2 000 défenseurs, soldats, paysans et citadins, dont des femmes. Pendant cinq semaines, ils ont réparé les murs de nuit et repoussé cinq grandes attaques, et le 18 octobre les Ottomans se sont retirés. La défense est devenue une légende hongroise. Pourtant, la campagne avait gagné les Ottomans le Banat, qui est devenu la province de Temesvár, et des dizaines de châteaux dans le nord de la Hongrie."
