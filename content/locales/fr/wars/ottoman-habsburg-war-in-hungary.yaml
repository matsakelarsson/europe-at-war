"1553–1562": "1553–1562"
"Fighting went on along a frontier of castles. The Ottomans took Fülek in 1554 and made it the seat of a sanjak. In 1556, with Castaldo’s unpaid troops gone, the Transylvanian estates called back Isabella and John Sigismund, who ruled again as Ottoman vassals. That summer the governor of Buda besieged Szigetvár; Nikola Zrinski, ban of Croatia, attacked the nearby Ottoman fort of Babócsa, beat the pasha’s army when it came to its rescue, and the siege was given up.": "Les Ottomans prirent Fülek en 1554 et en firent le siège d’un sanjak. En 1556, avec la disparition des troupes impayées de Castaldo, les domaines transylvaniens appelèrent Isabella et John Sigismund, qui gouvernèrent de nouveau comme vassaux ottomans. Cet été-là, le gouverneur de Buda assiégea Szigetvár ; Nikola Zrinski, interdit de Croatie, attaqua le fort ottoman voisin de Babócsa, battit l’armée pacha à son secours, et le siège fut abandonné."
"Suleiman, busy with Persia and with a struggle between his sons, wanted peace, and Ferdinand, emperor since his brother Charles V had abdicated, could not afford war. His envoy in Constantinople, the Flemish scholar Ogier Ghiselin de Busbecq, spent years negotiating. In 1562, after an Ottoman victory at Szécsény in March, a truce of eight years was agreed. The Ottomans kept their conquests, and Ferdinand went on paying 30,000 florins a year for his part of Hungary.": "Suleiman, occupé avec la Perse et avec une lutte entre ses fils, voulait la paix, et Ferdinand, empereur depuis que son frère Charles V avait abdiqué, ne pouvait pas se permettre la guerre. Son envoyé à Constantinople, l’érudit flamand Ogier Ghiselin de Busbecq, a passé des années à négocier. Les Ottomans ont gardé leurs conquêtes, et Ferdinand a continué à payer 30 000 florins par an pour sa partie de la Hongrie."
