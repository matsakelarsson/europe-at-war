"Ottoman Interregnum": "Interregnum ottoman"
"The civil war among the sons of Bayezid I after his defeat and capture by Timur at Ankara. Süleyman ruled the European provinces from Edirne, while İsa held Bursa and Mehmed Amasya; Mehmed defeated İsa, and their brother Musa, sent by Mehmed into the Balkans, overthrew and killed Süleyman in 1411. Allied with the Byzantine emperor and the Serbian despot, Mehmed finally defeated Musa at Çamurlu in 1413 and reunited the Ottoman state as Mehmed I.": "La guerre civile parmi les fils de Bayezid I après sa défaite et prise par Timur à Ankara. Süleyman a dirigé les provinces européennes d’Edirne, tandis que ìsa tenait Bursa et Mehmed Amasya ; Mehmed défait İsa, et leur frère Musa, envoyé par Mehmed dans les Balkans, a renversé et tué Süleyman en 1411. Allié avec l’empereur byzantin et le despote serbe, Mehmed a finalement vaincu Musa à Çamurlu en 1413 et réuni l’État ottoman comme Mehmed Ier."
"Ottoman chronicles written later, under Mehmed’s descendants, present him as the rightful heir; only he called himself sultan on his coins during the civil war. Many dates are uncertain. A fifth brother, Mustafa, who had been captured at Ankara, reappeared in 1416 and again in 1421–1422 to challenge Mehmed and his son Murad II.": "Les chroniques ottomanes écrites plus tard, sous les descendants de Mehmeds, le présentent comme l’héritier légitime ; seul il s’est appelé sultan sur ses pièces pendant la guerre civile. De nombreuses dates sont incertaines. Un cinquième frère, Mustafa, qui avait été capturé à Ankara, réapparut en 1416 et de nouveau en 1421–1422 pour défier Mehmed et son fils Murad II."
"The Christian neighbours changed sides as suited them. Byzantium, Venice and Genoa backed Süleyman, who gave back Thessalonica and other places in the Treaty of Gallipoli of 1403. Mircea of Wallachia and, by most accounts, the Serbian despot Stefan Lazarević backed Musa against him, but when Musa turned on his former allies, Stefan and Manuel II helped Mehmed defeat him.": "Byzance, Venise et Gênes ont soutenu Süleyman, qui a rendu Thessalonique et d’autres endroits dans le traité de Gallipoli de 1403. Mircea de Wallachia et, selon la plupart des témoignages, le despot serbe Stefan Lazarević a soutenu Musa contre lui, mais quand Musa s’est retourné sur ses anciens alliés, Stefan et Manuel II ont aidé Mehmed à le vaincre."
