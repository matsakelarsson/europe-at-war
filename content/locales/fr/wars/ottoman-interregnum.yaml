"After Ankara, Bayezid’s eldest son Süleyman held the European provinces from Edirne. To win friends he signed the Treaty of Gallipoli early in 1403 with Byzantium, Venice, Genoa, the Knights of Rhodes and the Duke of Naxos, returning Thessalonica and part of the Black Sea and Marmara coasts to the emperor. In Anatolia, İsa took Bursa and Mehmed ruled from Amasya. In 1403 Mehmed beat İsa at Ulubad and took Bursa; İsa fled and was later killed by Mehmed’s agents. Süleyman then crossed into Anatolia, took Bursa and Ankara in 1404, and for some years held Mehmed in check.": "Après Ankara, le fils aîné de Bayezid. Süleyman tenait les provinces européennes d’Edirne. Pour gagner des amis, il a signé le traité de Gallipoli au début de 1403 avec Byzance, Venise, Gênes, les Chevaliers de Rhodes et le duc de Naxos, retour Thessalonica et une partie des côtes de la mer Noire et de Marmara à l’empereur. En 1403, Mehmed battit İsa à Ulubad et prit Bursa ; il s’enfuit et fut tué par des agents de Mehmed. Süleyman croisa ensuite l’Anatolie, prit Bursa et Ankara en 1404, et tenu pendant quelques années Mehmed en contrôle."
"Mehmed sent their brother Musa, released from Timurid captivity, across the Black Sea to attack Süleyman’s European lands with the help of Mircea of Wallachia. Süleyman returned to Thrace and beat Musa on 15 June 1410 at Kosmidion, just outside the walls of Constantinople, but by the chroniclers’ account his idleness and drinking cost him support. In February 1411 his army went over to Musa at Edirne, and Süleyman was caught and strangled on 17 February. Musa now ruled the Ottoman Balkans and turned on Süleyman’s allies, besieging Constantinople and attacking Serbia and Thessalonica.": "Mehmed envoya leur frère Musa, libéré de la captivité de Timurid, à travers la mer Noire pour attaquer les terres européennes de Süleyman avec l’aide de Mircea de Wallachia. Süleyman retourna à Thrace et battit Musa le 15 juin 1410 à Kosmidion, juste en dehors des murs de Constantinople, mais par les chroniqueurs de rendre compte de son oisiveté et de sa consommation d’alcool lui coûtèrent du soutien. En février 1411, son armée est passée à Musa à Edirne, et Süleyman a été pris et étranglé le 17 février. Musa dirige maintenant les Balkans ottomans et s’est retourné contre les alliés de Süleyman, assiégeant Constantinople et attaquant la Serbie et Thessalonique."
