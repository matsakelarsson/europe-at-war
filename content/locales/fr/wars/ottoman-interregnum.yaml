"Musa’s attacks drove his enemies together. Emperor Manuel II called on Mehmed, whose troops crossed to defend Constantinople; after failed sorties and a revolt at home Mehmed had to withdraw, but in 1413 he crossed again with Byzantine help and joined forces with the Serbian despot Stefan Lazarević, whose lands Musa had ravaged. Many of Musa’s commanders in the Balkans, alienated by his harsh rule, went over to Mehmed.": "L’empereur Manuel II appela Mehmed, dont les troupes traversèrent pour défendre Constantinople ; après des sorties ratées et une révolte chez lui Mehmed dut se retirer, mais en 1413 il passa de nouveau avec l’aide byzantine et s’unit au despote serbe Stefan Lazarević, dont les terres avaient ravagé Musa. De nombreux commandants de Musa's dans les Balkans, aliénés par sa dure domination, sont allés à Mehmed."
"On 5 July 1413 the armies met at Çamurlu, near Samokov in the mountains of western Bulgaria. Hasan, aga of Mehmed’s janissaries, rode out to urge Musa’s men to change sides; Musa cut him down but was wounded by one of Hasan’s companions. Musa’s men fought well, but Mehmed won, and Musa fled and was caught and strangled. Mehmed, now sole sultan, kept peace with Byzantium and Serbia and spent his eight-year reign restoring Ottoman rule in Anatolia and the Balkans.": "Le 5 juillet 1413, les armées se rencontrèrent à Çamurlu, près de Samokov dans les montagnes de la Bulgarie occidentale. Hasan, aga de Mehmeds janissaires, monta pour exhorter les hommes de Musa ; Musa le coupa mais fut blessé par l’un des compagnons de Hasan. Les hommes de Musa ont bien combattu, mais Mehmed a gagné, et Musa s’est enfui et a été pris et étranglé. Mehmed, maintenant seul sultan, a gardé la paix avec Byzance et Serbie et a passé son règne de huit ans à restaurer le pouvoir ottoman en Anatolie et dans les Balkans."
