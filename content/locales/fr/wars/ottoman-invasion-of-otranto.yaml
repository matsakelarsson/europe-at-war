"In the summer of 1480 Gedik Ahmed Pasha, who had just taken the Ionian islands, gathered a fleet at Vlorë and crossed the strait of Otranto. He had meant to land near Brindisi but turned south, and on 28 July his army came ashore near Otranto, the easternmost town of the Kingdom of Naples. The town was bombarded, and on 11 August it was stormed. Many of its people were killed or enslaved, and on 14 August, according to tradition, some 800 men who refused to convert were beheaded. Ottoman raiders rode towards Lecce, Brindisi and Taranto.": "Au cours de l’été 1480, Gedik Ahmed Pasha, qui venait de prendre les îles Ioniennes, rassembla une flotte à Vlorë et traversa le détroit d’Otranto. Il avait voulu atterrir près de Brindisi mais se retourna vers le sud, et le 28 juillet son armée vint à terre près d’Otranto, la ville la plus orientale du royaume de Naples. Beaucoup de ses habitants ont été tués ou réduits en esclavage, et le 14 août, selon la tradition, quelque 800 hommes qui refusaient de se convertir ont été décapités."
"King Ferdinand of Naples recalled his son Alfonso, Duke of Calabria, from Tuscany, and Pope Sixtus IV called for a league of the Italian states; Hungary sent troops, but Venice stayed out. Over the winter the Ottomans held the town while Gedik Ahmed went back to Albania for reinforcements. The news that Mehmed II had died on 3 May 1481 ended any hope of relief, and the Neapolitan and Hungarian besiegers tightened their grip. On 10 September 1481 the garrison surrendered, and the threat of an Ottoman invasion of Italy passed for a generation.": "Le roi Ferdinand de Naples a rappelé son fils Alfonso, duc de Calabre, de Toscane, et le pape Sixte IV a appelé à une ligue des États italiens ; la Hongrie a envoyé des troupes, mais Venise est restée dehors. La nouvelle que Mehmed II était mort le 3 mai 1481 a mis fin à tout espoir de soulagement, et les assiégeants napolitains et hongrois ont serré leur emprise. Le 10 septembre 1481 la garnison s’est rendue, et la menace d’une invasion ottomane de l’Italie est passée pour une génération."
