# Some French text was translated automatically.
"Ottoman invasion of Otranto": "Invasion ottomane d’Otranto"
"The Ottoman landing in southern Italy in 1480, when Gedik Ahmed Pasha crossed from Albania and stormed the Neapolitan port of Otranto. The capture, and the killing of many of its people, caused panic in Italy and led the pope to call the Italian states and Hungary to its defence. After Mehmed II’s death in May 1481 the isolated garrison surrendered to Alfonso of Calabria in September.": "Le débarquement ottoman dans le sud de l’Italie en 1480, lorsque Gedik Ahmed Pacha a traversé d’Albanie et pris d’assaut le port napolitain d’Otranto. La capture, et l’assassinat de beaucoup de son peuple, a causé la panique en Italie et conduit le pape à appeler les États italiens et la Hongrie à sa défense."
"The traditional account, followed by the Church, says that on 14 August 1480 about 800 men of Otranto were beheaded on a nearby hill for refusing to give up their faith; they were canonised in 2013. Some modern historians question the religious motive and the larger figures given for the population and the dead, such as 12,000 killed out of 22,000, which are much exaggerated.": "Le récit traditionnel, suivi par l’Église, dit que le 14 août 1480 environ 800 hommes d’Otranto ont été décapités sur une colline voisine pour avoir refusé de renoncer à leur foi ; ils ont été canonisés en 2013. Certains historiens modernes remettent en question les motivations religieuses et les chiffres plus grands donnés pour la population et les morts, tels que 12 000 tués sur 22 000, qui sont beaucoup exagérés."
"Some contemporaries suspected that Venice, then at peace with the Ottomans, had encouraged the attack on its rival Naples; this has never been proved.": "Certains contemporains soupçonnaient que Venise, alors en paix avec les Ottomans, avait encouragé l’attaque contre son rival Naples ; cela n’a jamais été prouvé."
