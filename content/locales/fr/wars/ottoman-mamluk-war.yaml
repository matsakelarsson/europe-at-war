"Marj Dabiq and Syria": "Marj Dabiq et la Syrie"
"After Chaldiran, the Mamluk Sultanate, which ruled Egypt, Syria and the Hejaz, stood between the Ottomans and their Safavid enemy, and the two had long quarrelled over the Turkmen beyliks between them. In the summer of 1516 the old sultan Qansuh al-Ghawri marched north to Aleppo with his Mamluk cavalry. Selim I, who had set out as if against Persia, turned south. On 24 August the armies met on the plain of Marj Dabiq, north of Aleppo. The Mamluk right drove back the Ottoman wing, but the governor of Aleppo, Khayr Bey, who had secretly gone over to Selim, left the field with the left wing, and the Ottoman guns broke the rest.": "Après Chaldiran, le Sultanat mamelouk, qui gouvernait l’Égypte, la Syrie et le Hejaz, se tenait entre les Ottomans et leur ennemi safavide, et les deux avaient longtemps disputé les beliks turkmènes entre eux. L’été 1516, le vieux sultan Qansuh al-Ghawri marcha vers le nord à Alep avec sa cavalerie mamelouke. Le 24 août, les armées se rencontrèrent sur la plaine de Marj Dabiq, au nord d’Alep. Les Mamelouks regagnèrent à droite l’aile ottomane, mais le gouverneur d’Alep, Khayr Bey, qui s’était secrètement rendu à Selim, a quitté le champ avec l’aile gauche, et les canons ottomans ont brisé le reste."
"Al-Ghawri died on the battlefield, perhaps of a stroke. Aleppo opened its gates to Selim, and the Abbasid caliph, who had come with the Mamluk army, fell into his hands. Damascus surrendered in October without a fight, and Tripoli, Beirut and Jerusalem followed. In Cairo the Mamluks chose Tuman Bay as their sultan, but on 28 October the Ottoman vizier Hadım Sinan Pasha defeated a Mamluk army at Khan Yunis near Gaza, opening the road to Egypt.": "Al-Ghawri est mort sur le champ de bataille, peut-être d’une attaque. Alep a ouvert ses portes à Selim, et le calife Abbasid, qui était venu avec l’armée mamelouke, est tombé entre ses mains. Damas s’est rendu en octobre sans se battre, et Tripoli, Beyrouth et Jérusalem ont suivi. Au Caire, les Mamelouks ont choisi Tuman Bay comme sultan, mais le 28 octobre, le vizir ottoman Hadım Sinan Pacha a vaincu une armée mamelouke à Khan Yunis près de Gaza, ouvrant la route vers l’Égypte."
