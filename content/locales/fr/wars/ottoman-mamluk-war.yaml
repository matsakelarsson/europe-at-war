"Ridaniya and Cairo": "Ridaniya et Le Caire"
"In January 1517 Selim crossed the Sinai desert, with water carried by camels. Tuman Bay had dug in at Ridaniya on the edge of Cairo with guns and fresh recruits, but on 22 January the Ottomans went round his position and attacked it from the flank and rear, and his army broke. Hadım Sinan Pasha was among the Ottoman dead. Ottoman troops entered Cairo, and for days there was fighting in the streets as Tuman Bay’s men attacked them by night; many of the city’s people were killed.": "En janvier 1517, Selim traversa le désert du Sinaï avec de l’eau portée par des chameaux. La baie de Tuman avait creusé à Ridaniya au bord du Caire avec des canons et de nouvelles recrues, mais le 22 janvier les Ottomans allèrent autour de sa position et l’attaquèrent du flanc et de l’arrière, et son armée se brisa. Hadım Sinan Pacha était parmi les morts ottomans. Les troupes ottomanes entrèrent au Caire, et pendant des jours il y eut des combats dans les rues alors que les hommes de Tuman Bay arrivaient à les attaquer la nuit ; beaucoup de gens de la ville furent tués."
"Tuman Bay kept up the fight from the countryside with Bedouin help until he was betrayed and captured. On 15 April he was hanged at Bab Zuwayla, one of Cairo’s gates. Egypt became an Ottoman province, governed at first by Khayr Bey, and the sharif of Mecca sent his submission, making the sultan protector of the holy cities. Selim returned home with the caliph and with many of Cairo’s craftsmen and scholars, having nearly doubled the size of his empire.": "Le 15 avril, il fut pendu à Bab Zuwayla, l’une des portes du Caire. L’Egypte devint une province ottomane, gouvernée d’abord par Khayr Bey, et le sharif de la Mecque envoya sa soumission, faisant le protecteur sultan des villes saintes. Selim rentra chez lui avec le calife et avec beaucoup d’artisans et de savants du Caire, ayant presque doublé la taille de son empire."
