"Ottoman–Mamluk War": "Guerre ottomane-mamelouke"
"The war in which Sultan Selim I destroyed the Mamluk Sultanate of Egypt and Syria. The Ottomans won at Marj Dabiq near Aleppo in August 1516, where the Mamluk sultan Qansuh al-Ghawri died, took Syria and Palestine, crossed the Sinai and beat the last Mamluk sultan, Tuman Bay, at Ridaniya outside Cairo in January 1517. Egypt, Syria and the protection of Mecca and Medina passed to the Ottoman Empire.": "Les Ottomans ont gagné à Marj Dabiq près d’Alep en août 1516, où le sultan mamelouk Qansuh al-Ghawri est mort, pris la Syrie et la Palestine, traversé le Sinaï et battu le dernier sultan mamelouk, dans la baie de Tuman, à Ridaniya hors du Caire en janvier 1517. L’Égypte, la Syrie et la protection de la Mecque et de Medina sont passées à l’Empire ottoman."
"Dates are Julian. Some sources date the battle of Ridaniya to 24 January 1517 rather than 22 January, and Tuman Bay’s execution to 13 or 15 April; some place the battle of Khan Yunis in December 1516.": "Les dates sont Julian. Certaines sources datent la bataille de Ridaniya au 24 janvier 1517 plutôt que le 22 janvier, et Tuman Bay's exécution au 13 ou 15 avril ; certains placent la bataille de Khan Yunis en décembre 1516."
"A later story held that the last Abbasid caliph, whom Selim took to Constantinople, formally handed the caliphate to the Ottoman sultans. Historians regard this as a legend from the 18th century, though the conquest did make the Ottoman sultan the guardian of the holy cities.": "Par la suite, le dernier calife abbasside, que Selim a emmené à Constantinople, a officiellement remis le califat aux sultans ottomans. Les historiens considèrent cela comme une légende du 18ème siècle, bien que la conquête ait fait du sultan ottoman le gardien des villes saintes."
