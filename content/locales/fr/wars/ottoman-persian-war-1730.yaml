# French translations of the catalogue text (wave 7); step bodies follow later.
Ottoman–Persian War (1730–1735): Guerre ottomano-persane (1730–1735)
The war in which Nader, the general of the restored Safavid shah Tahmasp II, won back the lands the Ottomans had taken from Persia during the Afghan invasion. In 1730 he cleared western Iran and Azerbaijan, but while he was fighting the Abdali Afghans in the east, Tahmasp lost a campaign and gave up the Caucasus in a treaty, and Nader deposed him in 1732. Nader besieged Baghdad in 1733 and suffered his only defeat in battle against Topal Osman Pasha, then defeated and killed him at Kirkuk. In 1735 his victory at Yeghevard won back Armenia and Georgia, and the Treaty of Constantinople (1736) restored the frontier of 1639.: La guerre par laquelle Nader, le général du shah safavide restauré Tahmasp II, reprit les terres que les Ottomans avaient enlevées à la Perse pendant l’invasion afghane. En 1730, il chassa les Ottomans de l’ouest de l’Iran et de l’Azerbaïdjan, mais tandis qu’il combattait les Afghans abdali dans l’est, Tahmasp perdit une campagne et céda le Caucase par un traité, et Nader le déposa en 1732. Nader assiégea Bagdad en 1733 et subit face à Topal Osman Pacha sa seule défaite sur un champ de bataille, puis le vainquit et le tua à Kirkouk. En 1735, sa victoire à Yeghevard lui rendit l’Arménie et la Géorgie, et le traité de Constantinople (1736) rétablit la frontière de 1639.
