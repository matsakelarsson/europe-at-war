# French translations of the catalogue text (wave 7); step bodies follow later.
Ottoman–Persian War (1743–1746): Guerre ottomano-persane (1743–1746)
Nader Shah’s last war, fought to win Iraq from the Ottomans and to force them to recognise Persia’s Ja‘fari form of Shi‘ism as a fifth school of Islam. In 1743 his army took Kirkuk and Erbil and besieged Mosul from 14 September, killing many Yazidis in the countryside, but the city held out for 40 days under its governor Hajji Husayn al-Jalili, and Nader withdrew as revolts against his taxes spread in Persia. His siege of Kars in 1744 also failed. In August 1745 he destroyed an Ottoman army near Kars, but his own country was in revolt. By the Treaty of Kerden, signed near Qazvin on 4 September 1746, the frontier of the Treaty of Zuhab (1639) was restored, Nader dropped the Ja‘fari demand, and the Ottomans recognised his dynasty and promised to protect Persian pilgrims. Nader was assassinated the following year.: La dernière guerre de Nader Shah, menée pour enlever l’Irak aux Ottomans et les forcer à reconnaître le chiisme ja‘fari pratiqué en Perse comme une cinquième école de l’islam. En 1743, son armée prit Kirkouk et Erbil et assiégea Mossoul à partir du 14 septembre, tuant de nombreux Yézidis dans les campagnes, mais la ville résista 40 jours sous son gouverneur, Hajji Husayn al-Jalili, et Nader se retira tandis que les révoltes contre ses impôts gagnaient la Perse. Son siège de Kars, en 1744, échoua également. En août 1745, il anéantit une armée ottomane près de Kars, mais son propre pays était en révolte. Par le traité de Kerden, signé près de Qazvin le 4 septembre 1746, la frontière du traité de Zuhab (1639) fut rétablie, Nader renonça à faire reconnaître le rite ja‘fari, et les Ottomans reconnurent sa dynastie et promirent de protéger les pèlerins persans. Nader fut assassiné l’année suivante.
