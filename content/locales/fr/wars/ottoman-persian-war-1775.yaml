# French translations of the catalogue text (wave 7); step bodies follow later.
Ottoman–Persian War of 1775–1779: Guerre ottomano-persane de 1775–1779
? A war between Zand Iran under Karim Khan and the Ottoman Empire, whose province of Iraq was ruled by Mamluk pashas in Baghdad. Karim Khan’s grievances were the pasha’s treatment of Iranian pilgrims to the Shia shrines of Najaf and Karbala, his interference in the Kurdish emirate of Baban, and the trade of Basra, which had drawn the East India Company away from Iran’s port of Bushehr. After a Zand force was beaten in Kurdistan in 1774, Karim Khan’s brother Sadeq Khan crossed the Shatt al-Arab with about 30,000 men and besieged Basra from 6 April 1775. The garrison under Sulayman Agha held out for a year, helped for a time by an Omani fleet, until hunger forced it to surrender in April 1776 (on 16 or 20 April, by different accounts). Fighting went on in Kurdistan, where an Ottoman–Baban army defeated the Zands at Marivan in 1777. Basra stayed under Zand rule until Karim Khan’s death in 1779, when its garrison withdrew and Sulayman Agha, released from Shiraz, went on to rule Baghdad as Büyük Süleyman Pasha. The borders of the Treaty of Zuhab (1639) were left unchanged; Basra never fully recovered.
: Une guerre entre l’Iran zand de Karim Khan et l’Empire ottoman, dont la province d’Irak était gouvernée par des pachas mamelouks à Bagdad. Karim Khan reprochait au pacha le traitement des pèlerins iraniens se rendant aux sanctuaires chiites de Nadjaf et de Kerbala, son ingérence dans l’émirat kurde de Baban et le commerce de Bassora, qui avait détourné la Compagnie des Indes orientales du port iranien de Bouchehr. Après la défaite d’une troupe zand au Kurdistan en 1774, Sadeq Khan, frère de Karim Khan, franchit le Chatt-el-Arab avec environ 30 000 hommes et assiégea Bassora à partir du 6 avril 1775. La garnison de Sulayman Agha tint un an, aidée un temps par une flotte omanaise, jusqu’à ce que la faim la contraigne à se rendre en avril 1776 (le 16 ou le 20 avril, selon les récits). Les combats se poursuivirent au Kurdistan, où une armée conjointe des Ottomans et de Baban battit les Zand à Marivan en 1777. Bassora resta sous domination zand jusqu’à la mort de Karim Khan en 1779 ; sa garnison se retira alors, et Sulayman Agha, libéré de Chiraz, gouverna ensuite Bagdad sous le nom de Büyük Süleyman Pacha. Les frontières du traité de Zuhab (1639) restèrent inchangées ; Bassora ne se remit jamais entièrement.
