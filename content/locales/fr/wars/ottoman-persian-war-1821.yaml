# French translations of the catalogue text (wave 7); step bodies follow later.
Ottoman–Persian War of 1821–1823: Guerre ottomano-persane de 1821–1823
? The last war between the Ottoman Empire and Iran. Border tribes such as the Kurdish Haydaranlu and Sipki had crossed into Ottoman territory and been given refuge, Iranian pilgrims complained of mistreatment, and the two sides competed for influence over the Kurdish emirate of Baban; after clashes in 1820, Russia, at odds with the Ottomans over the Greek revolt, encouraged Iran to fight. In the autumn of 1821 Crown Prince Abbas Mirza, governor of Azerbaijan, invaded eastern Anatolia from Tabriz and took Bayazid and Toprakkale, while his elder half-brother Mohammad Ali Mirza, governor of Kermanshah, overran Shahrizor, defeated the army of Dawud Pasha of Baghdad and advanced on Baghdad, until cholera broke out in his army and he died of it in November 1821. Abbas Mirza defeated a larger Ottoman army near Toprakkale in May 1822, but cholera and the lack of money stopped both sides. The Treaty of Erzurum of 28 July 1823 restored the frontier of the Treaty of Zuhab (1639), with no change of territory, and promised Iranian pilgrims protection.
: La dernière guerre entre l’Empire ottoman et l’Iran. Des tribus frontalières, comme les Kurdes Haydaranlu et Sipki, étaient passées en territoire ottoman et y avaient reçu asile, les pèlerins iraniens se plaignaient de mauvais traitements, et les deux pays se disputaient l’influence sur l’émirat kurde de Baban ; après des affrontements en 1820, la Russie, en conflit avec les Ottomans au sujet de l’insurrection grecque, poussa l’Iran à la guerre. À l’automne 1821, le prince héritier Abbas Mirza, gouverneur de l’Azerbaïdjan, envahit l’est de l’Anatolie depuis Tabriz et prit Bayazid et Toprakkale, tandis que son demi-frère aîné Mohammad Ali Mirza, gouverneur de Kermanshah, envahissait le Shahrizor, battait l’armée de Dawud Pacha de Bagdad et marchait sur Bagdad, jusqu’à ce que le choléra éclate dans son armée ; il en mourut en novembre 1821. Abbas Mirza battit une armée ottomane plus nombreuse près de Toprakkale en mai 1822, mais le choléra et le manque d’argent arrêtèrent les deux camps. Le traité d’Erzurum du 28 juillet 1823 rétablit la frontière du traité de Zuhab (1639), sans changement territorial, et promit protection aux pèlerins iraniens.
