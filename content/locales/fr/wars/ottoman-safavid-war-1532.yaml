Ottoman–Safavid War (1532–1555): Guerre ottomano-safavide (1532–1555)
The second great war between Suleiman the Magnificent and Shah Tahmasp I of Persia, fought in three Ottoman campaigns. In 1534 Suleiman and his grand vizier Ibrahim Pasha took Tabriz and then Baghdad, in 1548 the Ottomans took Tabriz again and the fortress of Van, and in 1553–1554 they ravaged Armenia and Karabakh. Tahmasp avoided pitched battles and laid waste to the land in the Ottoman path. The Peace of Amasya (1555) left Tabriz and the eastern Caucasus to Persia, while the Ottomans kept Baghdad and Iraq, Van and western Armenia and Georgia.: La deuxième grande guerre entre Soliman le Magnifique et le shah Tahmasp Ier de Perse, menée en trois campagnes ottomanes. En 1534, Soliman et son grand vizir Ibrahim Pacha prirent Tabriz, puis Bagdad ; en 1548, les Ottomans reprirent Tabriz et s’emparèrent de la forteresse de Van ; et en 1553–1554, ils ravagèrent l’Arménie et le Karabagh. Tahmasp évita les batailles rangées et dévasta le pays sur le passage des Ottomans. La paix d’Amasya (1555) laissa Tabriz et l’est du Caucase à la Perse, tandis que les Ottomans gardaient Bagdad et l’Irak, Van, ainsi que l’ouest de l’Arménie et de la Géorgie.
