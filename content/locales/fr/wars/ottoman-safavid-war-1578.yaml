# French translations of the catalogue text (wave 7); step bodies follow later.
Ottoman–Safavid War (1578–1590): Guerre ottomano-safavide (1578–1590)
A war in which the Ottoman Empire, under Murad III, exploited the turmoil in Safavid Persia after the death of Shah Tahmasp I to conquer the Caucasus and north-western Iran. Lala Mustafa Pasha won at Çıldır in 1578 and took Tiflis and Shirvan; Özdemiroğlu Osman Pasha secured Shirvan and Dagestan in the Battle of Torches (1583) and took Tabriz in 1585. With the Uzbeks overrunning Khorasan at the same time, the young Shah Abbas I made peace at Constantinople in 1590, giving up Tabriz, Azerbaijan, the Caucasus and parts of western Iran.: Guerre au cours de laquelle l’Empire ottoman de Mourad III profita des troubles qui agitèrent la Perse safavide après la mort du shah Tahmasp Ier pour conquérir le Caucase et le nord-ouest de l’Iran. Lala Mustafa Pacha l’emporta à Çıldır en 1578 et prit Tiflis et le Chirvan ; Özdemiroğlu Osman Pacha s’assura du Chirvan et du Daghestan à la bataille des Torches (1583) et prit Tabriz en 1585. Alors que les Ouzbeks envahissaient au même moment le Khorassan, le jeune shah Abbas Ier fit la paix à Constantinople en 1590, cédant Tabriz, l’Azerbaïdjan, le Caucase et une partie de l’ouest de l’Iran.
