# French translations of the catalogue text (wave 7); step bodies follow later.
Ottoman–Safavid War (1603–1618): Guerre ottomano-safavide (1603–1618)
The war in which Shah Abbas I of Persia, with his reorganised army of slave soldiers, musketeers and artillery, won back the provinces lost to the Ottomans in 1590. While the Ottomans were tied down by their long war with the Habsburgs and the Celali revolts in Anatolia, Abbas took Tabriz in 1603, Erivan in 1604 after a long siege and Shirvan in 1606, and defeated an Ottoman army near Lake Urmia in 1605. The Treaty of Nasuh Pasha (1612) restored the frontier of 1555. Fighting resumed in 1615; the Ottomans failed before Erivan in 1616 and the Treaty of Serav (1618) confirmed the settlement.: La guerre par laquelle le shah Abbas Ier de Perse, avec son armée réorganisée de soldats esclaves, de mousquetaires et d’artillerie, reprit les provinces perdues face aux Ottomans en 1590. Tandis que les Ottomans étaient retenus par leur longue guerre contre les Habsbourg et par les révoltes des Celali en Anatolie, Abbas prit Tabriz en 1603, Erevan en 1604 après un long siège et le Chirvan en 1606, et vainquit une armée ottomane près du lac d’Ourmia en 1605. Le traité de Nasuh Pacha (1612) rétablit la frontière de 1555. Les combats reprirent en 1615 ; les Ottomans échouèrent devant Erevan en 1616, et le traité de Serav (1618) confirma ce règlement.
