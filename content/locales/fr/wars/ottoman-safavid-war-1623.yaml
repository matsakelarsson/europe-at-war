# French translations of the catalogue text (wave 7); step bodies follow later.
Ottoman–Safavid War (1623–1639): Guerre ottomano-safavide (1623–1639)
The last of the great wars between the Ottoman Empire and Safavid Persia, fought mainly over Iraq. Shah Abbas I took Baghdad in January 1624, exploiting a mutiny there, and held it against Ottoman sieges in 1625–1626 and 1630. Sultan Murad IV took Erivan and plundered Tabriz in 1635 and retook Baghdad after a 40-day siege in December 1638. The Treaty of Zuhab (1639) left Iraq to the Ottomans and drew a frontier that still roughly divides Iran from Turkey and Iraq.: La dernière des grandes guerres entre l’Empire ottoman et la Perse safavide, livrée surtout pour l’Irak. Le shah Abbas Ier prit Bagdad en janvier 1624 en profitant d’une mutinerie dans la ville, et la conserva face aux sièges ottomans de 1625–1626 et de 1630. Le sultan Mourad IV prit Erevan et pilla Tabriz en 1635, puis reprit Bagdad en décembre 1638 après un siège de 40 jours. Le traité de Zuhab (1639) laissa l’Irak aux Ottomans et traça une frontière qui sépare encore, à peu de chose près, l’Iran de la Turquie et de l’Irak.
