"1514–1517": "1514–1517"
"Selim I, who had pushed his father from the throne in 1512, saw a deadly danger in Ismail I, the young shah who had made Shi‘i Islam the faith of Persia. Ismail’s Qizilbash followers were strong among the Turkmen tribes of Anatolia and had risen in a great revolt there in 1511. Armed with rulings that called them heretics, Selim had many of them killed or imprisoned; chroniclers speak of 40,000, a figure historians treat with caution. In the spring of 1514 he marched east. On 23 August, at Chaldiran north-east of Lake Van, the Safavid cavalry charged the Ottoman wings and was shot down by guns and janissary muskets behind a barrier of carts. Ismail was wounded and fled.": "Selim Ier, qui avait poussé son père du trône en 1512, a vu un danger mortel dans Ismail Ier, le jeune chah qui avait fait de l’Islam chiite la foi de Perse. Ismail Les disciples Qizilbash étaient forts parmi les tribus turkmènes d’Anatolie et s’y était levé dans une grande révolte en 1511. Le 23 août, à Chaldiran, au nord-est du lac Van, la cavalerie safavide chargea les ailes ottomanes et fut abattue par des canons et des mousquets janissaires derrière une barrière de chars. Ismail a été blessé et s’est enfui."
"Selim entered Tabriz in early September and carried off its treasury and many of its craftsmen, but his janissaries refused to winter there and he withdrew. In 1515 he took the fortress of Kemah, and his vizier Hadım Sinan Pasha destroyed the army of Dulkadir at Turnadağ; its ruler was killed and replaced by a vassal. Diyarbakır and many Kurdish lords went over to the Ottomans, won over by the scholar Idris Bitlisi, and in 1516 Bıyıklı Mehmed Pasha beat a Safavid army near Mardin, which fell soon after. Tabriz stayed Persian, but eastern Anatolia was now Ottoman.": "Selim entra à Tabriz au début de septembre et transporta son trésor et beaucoup de ses artisans, mais ses janissaires refusèrent d’y hiverner et se retira. En 1515, il prit la forteresse de Kemah, et son vizier Hadım Sinan Pacha détruisit l’armée de Dulkadir à Turnadağ ; son chef fut tué et remplacé par un vassal. Diyarbakır et beaucoup de seigneurs kurdes sont allés aux Ottomans, conquis par l’érudit Idris Bitlisi, et en 1516 Bıyıklı Mehmed Pasha a battu une armée safavide près de Mardin, qui est tombée peu après. Tabriz est resté persan, mais l’Anatolie orientale était maintenant ottomane."
