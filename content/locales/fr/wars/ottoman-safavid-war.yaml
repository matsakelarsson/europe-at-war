# Some French text was translated automatically.
"Ottoman–Safavid War (1514–1517)": "Guerre ottomane-safavide (1514-1517)"
"The first war between the Ottoman sultan Selim I and the Safavid shah Ismail I of Persia, whose Shi‘i Qizilbash followers had a large following among the Turkmen of Anatolia. Selim’s guns and janissaries routed Ismail at Chaldiran in 1514 and briefly occupied Tabriz, and in the following years the Ottomans conquered the Dulkadir beylik and eastern Anatolia from Erzincan to Diyarbakır, a frontier fought over until the Peace of Amasya in 1555.": "La première guerre entre le sultan ottoman Selim Ier et le safavid shah Ismail Ier de Perse, dont les adeptes Shi'i Qizilbash avaient une grande suite parmi les Turkmènes d’Anatolie. Les fusils et les janissaires de Selim ont conduit Ismail à Chaldiran en 1514 et occupé brièvement Tabriz, et dans les années suivantes les Ottomans ont conquis l’Beylik Dulkadir et l’Anatolie orientale d’Erzincan à Diyarbakır, une frontière combattue jusqu’à la paix d’Amasya en 1555."
"Dates are Julian. Sources differ on some dates, such as the Ottoman entry into Tabriz (5 or 7 September 1514).": "Les dates sont Julian. Les sources diffèrent à certaines dates, comme l’entrée ottomane dans Tabriz (5 ou 7 septembre 1514)."
"The size of both armies at Chaldiran is uncertain; modern estimates run from about 60,000 to 100,000 Ottomans and 40,000 to 80,000 Safavids. No peace was made, and the later Ottoman–Safavid wars, which began again in 1532, are not told here.": "La taille des deux armées à Chaldiran est incertaine ; les estimations modernes vont d’environ 60 000 à 100 000 Ottomans et de 40 000 à 80 000 Safavides. Aucune paix n’a été faite, et les guerres ottoman-Safavide ultérieures, qui ont repris en 1532, ne sont pas racontées ici."
