# French translations of the catalogue text (wave 7); step bodies follow later.
Ottoman–Saudi War: Guerre ottomano-saoudienne
The war in which the Ottoman Empire, through its governor of Egypt, Muhammad Ali Pasha, destroyed the first Saudi state, the Emirate of Diriyah. Allied with the reformer Muhammad ibn Abd al-Wahhab, the Saudi emirs had united most of Arabia and in 1803–1805 taken Mecca and Medina, ending the Ottoman sultan’s role as protector of the holy cities. Egyptian armies under Muhammad Ali’s sons retook the Hejaz in 1812–1813 after an early defeat, fought the Saudis and their tribal allies in the mountains east of Mecca, and in 1816–1818, under Ibrahim Pasha, marched across Najd and besieged Diriyah. Abdullah ibn Saud surrendered on 11 September 1818 and was beheaded in Istanbul; Diriyah was razed. A second Saudi state rose at Riyadh in 1824.: La guerre au cours de laquelle l’Empire ottoman, par l’intermédiaire de son gouverneur d’Égypte, Méhémet Ali, détruisit le premier État saoudien, l’émirat de Diriyah. Alliés au réformateur Mohammed ben Abdelwahhab, les émirs saoudiens avaient uni la plus grande partie de l’Arabie et pris La Mecque et Médine entre 1803 et 1805, mettant fin au rôle du sultan ottoman comme protecteur des villes saintes. Les armées égyptiennes commandées par les fils de Méhémet Ali reprirent le Hedjaz en 1812–1813 après une première défaite, combattirent les Saoudiens et leurs alliés tribaux dans les montagnes à l’est de La Mecque puis, en 1816–1818, sous Ibrahim Pacha, traversèrent le Nejd et assiégèrent Diriyah. Abdallah ben Saoud se rendit le 11 septembre 1818 et fut décapité à Istanbul ; Diriyah fut rasée. Un second État saoudien naquit à Riyad en 1824.
