"In the 1390s Bayezid annexed the Turkish beyliks of western and central Anatolia and in 1398 took Sivas and the lands of Kadi Burhan al-Din, and then Malatya, reaching the frontier of Timur’s empire. Rulers he had driven out, among them the lords of Aydın, Germiyan and Menteşe, fled to Timur, and the lord of Erzincan, Taharten, was Timur’s vassal. Insulting letters passed between the two rulers. In August 1400 Timur invaded Anatolia and besieged Sivas, which surrendered after about three weeks. According to the chroniclers, he had the Christian soldiers of the garrison, said to number some 4,000, mostly Armenians, buried alive, and the town was destroyed.": "Dans les années 1390 Bayezid a annexé les béyliks turcs de l’ouest et du centre Anatolie et en 1398 pris Sivas et les terres de Kadi Burhan al-Din, puis Malatya, atteindre la frontière de l’empire Timur. Il avait chassé les chefs, parmi eux les seigneurs d’Aydın, Germiyan et Menteşe, s’enfuir à Timur, et le seigneur d’Erzincan, Taharten, était le vassal de Timur. Lettres insultantes passa entre les deux dirigeants. En août 1400 Timur envahit Anatolie et assiégé Sivas, qui se rendit après environ trois semaines. Selon les chroniqueurs, il avait les soldats chrétiens de la garnison, dit qu’il y avait environ 4 000, pour la plupart des Arméniens, enterrés vivants, et la ville a été détruite."
"Timur did not march west at once. He turned south against the Mamluks of Egypt and Syria, sacked Aleppo in late 1400 and took Damascus early in 1401, massacring much of its population and carrying off its craftsmen to Samarkand, and then stormed Baghdad. Bayezid used the respite to attack Taharten and take the castle of Kemah on the upper Euphrates, while keeping up his blockade of Constantinople. In 1402 Timur retook Kemah and set out for central Anatolia.": "Timur ne marcha pas à l’ouest en même temps. Il se retourna vers le sud contre les Mamelouks d’Égypte et de Syrie, largua Alep à la fin de 1400 et prit Damas au début de 1401, masquant une grande partie de sa population et transportant ses artisans à Samarkand, puis s’empare de Bagdad. Bayezid a utilisé le répit pour attaquer Taharten et prendre le château de Kemah sur l’Euphrate supérieur, tout en maintenant son blocus de Constantinople. En 1402 Timur reprend Kemah et part pour l’Anatolie centrale."
