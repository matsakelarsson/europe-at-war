"Ottoman–Timurid War": "Guerre ottomane-timuride"
"The war between Sultan Bayezid I and the Central Asian conqueror Timur (Tamerlane), whose empire stretched from Samarkand to eastern Anatolia. After years of insulting letters and quarrels over the Turkish lords of eastern Anatolia, Timur sacked Sivas in 1400, and in 1402 he destroyed the Ottoman army near Ankara and took Bayezid prisoner. Timur restored the Turkish beyliks that Bayezid had annexed, and the Ottoman state nearly fell apart in the civil war that followed.": "La guerre entre le sultan Bayezid Ier et le conquérant d’Asie centrale Timur (Tamerlane), dont l’empire s’étendait de Samarkand à l’est de l’Anatolie. Après des années de lettres insultantes et de querelles sur les seigneurs turcs de l’Est de l’Anatolie, Timur largua Sivas en 1400, et en 1402, il détruisit l’armée ottomane près d’Ankara et fit prisonnier Bayezid. Timur restaure les béyliks turcs que Bayezid avait annexés, et l’État ottoman faillit s’effondrer dans la guerre civile qui suivit."
"The battle of Ankara is dated 28 July 1402 in many accounts and 20 July in others. The size of the armies is unknown; the chroniclers’ figures of hundreds of thousands are impossible, and modern guesses range widely.": "La bataille d’Ankara est datée du 28 juillet 1402, dans de nombreux récits et le 20 juillet dans d’autres. La taille des armées est inconnue ; les chroniqueurs (chiffres de centaines de milliers) sont impossibles, et les suppositions modernes s’étendent largement."
"The story that Timur carried Bayezid around in an iron cage comes from later writers and is doubted; historians at Timur’s court said that the sultan was treated well.": "L’histoire que Timur a porté Bayezid autour dans une cage de fer vient d’auteurs plus tard et est douteuse ; les historiens à la cour de Timure dit que le sultan a été bien traité."
