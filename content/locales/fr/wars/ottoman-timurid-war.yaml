"In the summer of 1402 Timur marched by way of Sivas and Kayseri towards Ankara. Bayezid broke off his blockade of Constantinople and hurried east in the heat, but Timur slipped round behind him and camped in the plain of Çubuk, north-east of Ankara, where he controlled the water. When the armies met on 28 July, the Tatars in Bayezid’s army and the soldiers of the beyliks he had annexed went over to Timur, whose horse archers wore down the tired and thirsty Ottomans. The Serbian knights of Stefan Lazarević fought hard and broke out with Bayezid’s son Süleyman, but Bayezid was surrounded and captured with another son, Musa.": "Au cours de l’été 1402, Timur marcha en passant par Sivas et Kayseri vers Ankara. Bayezid rompit son blocus de Constantinople et se précipita vers l’est dans la chaleur, mais Timur glissa derrière lui et campa dans la plaine de Çaubuk, au nord-est d’Ankara, où il contrôlait l’eau. Lorsque les armées se rencontrèrent le 28 juillet, les Tatars de l’armée de Bayezid , et les soldats des Béyliks qu’il avait annexés, allèrent vers Timur, dont les archers portaient les Ottomans fatigués et soif. Les chevaliers serbes de Stefan Lazarević combattirent fort et éclatèrent avec le fils de Bayezid Süleyman, mais Bayezid fut encerclé et capturé avec un autre fils, Musa."
"Timur’s grandson Muhammad Sultan sacked Bursa and its treasury, and in December Timur took the Hospitallers’ sea castle at Smyrna after a two-week siege and had many of its people killed. He gave back their lands to the lords of Karaman, Germiyan, Aydın, Saruhan, Menteşe and the other beyliks. Bayezid died in captivity at Akşehir on 8 March 1403, and Timur went home to Samarkand. The Ottoman realm in Europe survived, but Bayezid’s sons were soon fighting each other for what was left.": "Le petit-fils de Timur, Muhammad Sultan, a largué Bursa et son trésor, et en décembre Timur a pris le château des Hospitaliers à Smyrne après un siège de deux semaines et a fait tuer beaucoup de ses habitants. Il a rendu leurs terres aux seigneurs de Karaman, Germiyan, Aydın, Saruhan, Menteşe et les autres beyliks. Bayezid mourut en captivité à Akşehir le 8 mars 1403 et Timur rentra chez lui à Samarkand. Le royaume ottoman d’Europe survécut, mais les fils de Bayezid se battaient bientôt pour ce qui restait."
