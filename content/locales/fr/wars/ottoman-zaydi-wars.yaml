# French translations of the catalogue text (wave 7); step bodies follow later.
Ottoman–Zaydi wars in Yemen: Guerres ottomano-zaydites au Yémen
The century-long struggle between the Ottoman Empire and the Zaydi imams of the Yemeni highlands. The Ottomans took Aden and the coastal plain of the Tihama in 1538–1539, as a base against the Portuguese in the Indian Ocean, and Sanaa in 1547. Imam al-Mutahhar drove them almost out of the country in 1567–1568, but Sinan Pasha reconquered it in 1569–1570 and by 1583–1585 the whole of Yemen was Ottoman. In 1597 Imam al-Mansur al-Qasim began a new revolt, and his son al-Mu’ayyad Muhammad took Sanaa in 1629 and forced the last Ottoman garrisons to leave Zabid and Mocha by 1636. Yemen remained an independent Zaydi state until the Ottomans returned in 1849.: La lutte, longue d’un siècle, entre l’Empire ottoman et les imams zaydites des hautes terres du Yémen. Les Ottomans prirent Aden et la plaine côtière de la Tihama en 1538–1539, pour en faire une base contre les Portugais dans l’océan Indien, puis Sanaa en 1547. L’imam al-Mutahhar les chassa presque entièrement du pays en 1567–1568, mais Sinan Pacha le reconquit en 1569–1570, et en 1583–1585 tout le Yémen était ottoman. En 1597, l’imam al-Mansur al-Qasim lança une nouvelle révolte ; son fils al-Mu’ayyad Muhammad prit Sanaa en 1629 et, dès 1636, avait contraint les dernières garnisons ottomanes à quitter Zabid et Moka. Le Yémen resta un État zaydite indépendant jusqu’au retour des Ottomans en 1849.
