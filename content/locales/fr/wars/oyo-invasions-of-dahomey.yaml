# French translations of the catalogue text (wave 13); step bodies follow later.
Oyo invasions of Dahomey: Invasions du Dahomey par Oyo
? The campaigns by which the Yoruba empire of Oyo forced Dahomey, which had just conquered the coastal kingdoms of Allada and Whydah, to accept its overlordship. Oyo had taken tribute from the Aja kingdoms since the 1680s, and states threatened by King Agaja asked it for help. In April 1726 Oyo’s army, strong in cavalry, invaded, took and burned Abomey, while Agaja escaped into the marshes; it came again in 1728, when Agaja evacuated and burned his capital rather than defend it, and with larger armies in 1729 and 1730. Dahomey had no horses but many muskets, whose fire frightened the Oyo horses, and it dug trenches against them. In 1730 Agaja agreed to pay a yearly tribute, sent his son Tegbesu to Oyo as a guarantee, by tradition, and moved his capital to Allada. War broke out again in 1739 and went on under Tegbesu, until Oyo, after eleven invasions in all, brought Dahomey to submit in 1748. Dahomey paid tribute to Oyo until the reign of Ghezo, in the 1820s or 1830s, while it grew rich on the sale of captives through Ouidah.
: Les campagnes par lesquelles l’empire yoruba d’Oyo contraignit le Dahomey, qui venait de conquérir les royaumes côtiers d’Allada et de Ouidah, à reconnaître sa suzeraineté. Oyo prélevait un tribut sur les royaumes aja depuis les années 1680, et des États menacés par le roi Agadja lui demandèrent son aide. En avril 1726, l’armée d’Oyo, forte de sa cavalerie, envahit le pays, prit et incendia Abomey, tandis qu’Agadja s’échappait dans les marais ; elle revint en 1728, quand Agadja évacua et incendia sa capitale plutôt que de la défendre, puis avec des armées plus nombreuses en 1729 et en 1730. Le Dahomey n’avait pas de chevaux mais de nombreux mousquets, dont le feu effrayait les chevaux d’Oyo, et il creusa des tranchées contre eux. En 1730, Agadja accepta de payer un tribut annuel, envoya à Oyo, selon la tradition, son fils Tegbessou comme garant et transféra sa capitale à Allada. La guerre reprit en 1739 et se poursuivit sous Tegbessou, jusqu’à ce qu’Oyo, après onze invasions en tout, obtienne la soumission du Dahomey en 1748. Le Dahomey paya tribut à Oyo jusqu’au règne de Ghézo, dans les années 1820 ou 1830, tout en s’enrichissant de la vente de captifs par Ouidah.
