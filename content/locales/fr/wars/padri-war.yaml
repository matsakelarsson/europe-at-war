# French translations of the catalogue text (wave 11); step bodies follow later.
Padri War: Guerre des Padri
? A war in the Minangkabau highlands of West Sumatra that began as a struggle within Minangkabau society and ended in Dutch conquest. From about 1803 the Padri, Islamic reformers inspired by pilgrims returning from Mecca, set out to impose Islamic law and stamp out customs they held un-Islamic, such as cockfighting, gambling, opium, drink and parts of the matrilineal adat (customary law). Their war against the adat chiefs and the royal house of Pagaruyung, which they largely destroyed in 1815, turned many villages against each other. In 1821 adat leaders who had fled to Padang ceded their lands to the Dutch in return for help, and Dutch troops took Pagaruyung in 1822, but the Padri held them off, and the Treaty of Masang of 1824 left the war in abeyance during the Java War. From 1831 the Dutch, eager for the highlands’ coffee, conquered the Minangkabau heartland. A general rising of Padri and adat villages in January 1833 showed that the adat chiefs, too, had turned against Dutch rule. The Padri centre, Bonjol, fell on 16 August 1837 after a long siege; its leader, Tuanku Imam Bonjol, was seized during talks in October and exiled, and the last Padri stronghold, Tuanku Tambusai’s fort at Dalu-Dalu, fell in December 1838. The war left West Sumatra under Dutch rule and forced coffee cultivation, and produced the reconciliation of adat and Islam summed up in the saying that custom rests on Islamic law and Islamic law on the Qur’an.
: Une guerre dans les hautes terres minangkabau de Sumatra occidental, qui commença comme une lutte au sein de la société minangkabau et s’acheva par la conquête néerlandaise. À partir de 1803 environ, les Padri, des réformateurs musulmans inspirés par des pèlerins revenus de La Mecque, entreprirent d’imposer la loi islamique et d’extirper les coutumes qu’ils jugeaient contraires à l’islam, comme les combats de coqs, les jeux d’argent, l’opium, l’alcool et certains aspects de l’adat (droit coutumier) matrilinéaire. Leur guerre contre les chefs de l’adat et la maison royale de Pagaruyung, qu’ils anéantirent en grande partie en 1815, dressa de nombreux villages les uns contre les autres. En 1821, des chefs de l’adat réfugiés à Padang cédèrent leurs terres aux Néerlandais en échange de leur aide, et les troupes néerlandaises prirent Pagaruyung en 1822, mais les Padri leur tinrent tête, et le traité de Masang de 1824 mit la guerre en suspens pendant la guerre de Java. À partir de 1831, les Néerlandais, avides du café des hautes terres, conquirent le cœur du pays minangkabau. Un soulèvement général des villages, padri comme fidèles à l’adat, en janvier 1833, montra que les chefs de l’adat s’étaient eux aussi retournés contre la domination néerlandaise. Le centre des Padri, Bonjol, tomba le 16 août 1837 après un long siège ; son chef, Tuanku Imam Bonjol, fut arrêté au cours de pourparlers en octobre et exilé, et le dernier bastion padri, le fort de Tuanku Tambusai à Dalu-Dalu, tomba en décembre 1838. La guerre laissa Sumatra occidental sous la domination néerlandaise et soumis à la culture forcée du café, et aboutit à la réconciliation de l’adat et de l’islam, résumée par l’adage selon lequel la coutume repose sur la loi islamique, et la loi islamique sur le Coran.
