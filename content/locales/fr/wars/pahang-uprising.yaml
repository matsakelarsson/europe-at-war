# French translations of the catalogue text (wave 11); step bodies follow later.
Pahang Uprising: Soulèvement du Pahang
? A rising of Malay chiefs in Pahang against the British Residency set up in 1888. Under growing British pressure Sultan Ahmad accepted a British protectorate and a Resident, John Pickersgill Rodger, in 1888. The new administration took over the collection of taxes, which the territorial chiefs had held, and set up courts and police that cut into their authority. Dato’ Bahaman, the Orang Kaya of Semantan, would not accept the new order in his district; when some of his followers were arrested in December 1891, he attacked the Sikh police at Lubuk Terua, burned the police post and sacked Temerloh. Tok Gajah of Pulau Tawar, who had led Pahang’s fighters in the Klang War, and his son Mat Kilau joined him, and on 10 April 1892 Mat Kilau’s men sacked Kuala Lipis. Sikh police and Malay levies, reinforced from Perak and Selangor, burned Mat Kilau’s stronghold at Budu in May 1892, and an amnesty followed on 16 October 1892 for all but the leaders, who withdrew with about 100 men to the borders of Kelantan and Terengganu, then under Siamese overlordship. In June 1894 they came back, seized the stockade at Kuala Tembeling on 14 June and were defeated at Jeram Ampai on 29 June; Hugh Clifford led a column into Kelantan and Terengganu after them. In October–November 1895 Siamese officials, who had agreed to stop harbouring them, captured Bahaman and four other leaders and deported them to Chiang Mai; Mat Kilau and Tok Gajah were reported dead. The exiles were allowed to return in 1913. In 1970 the Pahang government accepted the claim of an old man who had come forward as Mat Kilau; he died ten days later. Bahaman and Mat Kilau are remembered in Malaysia as fighters against colonial rule.
: Un soulèvement de chefs malais du Pahang contre la résidence britannique instaurée en 1888. Sous une pression britannique croissante, le sultan Ahmad accepta en 1888 un protectorat britannique et un résident, John Pickersgill Rodger. La nouvelle administration prit en main la perception des impôts, jusque-là aux mains des chefs territoriaux, et mit en place des tribunaux et une police qui empiétaient sur leur autorité. Le Dato’ Bahaman, Orang Kaya de Semantan, refusa d’accepter le nouvel ordre dans son district ; lorsque certains de ses partisans furent arrêtés en décembre 1891, il attaqua la police sikhe à Lubuk Terua, incendia le poste de police et mit à sac Temerloh. Tok Gajah de Pulau Tawar, qui avait commandé les combattants du Pahang pendant la guerre de Klang, et son fils Mat Kilau le rejoignirent et, le 10 avril 1892, les hommes de Mat Kilau mirent à sac Kuala Lipis. La police sikhe et des levées malaises, renforcées depuis le Perak et le Selangor, incendièrent la place forte de Mat Kilau à Budu en mai 1892, et une amnistie suivit le 16 octobre 1892 pour tous, sauf pour les chefs, qui se retirèrent avec environ 100 hommes aux confins du Kelantan et du Terengganu, alors sous suzeraineté siamoise. En juin 1894, ils revinrent, s’emparèrent de la palissade de Kuala Tembeling le 14 juin et furent battus à Jeram Ampai le 29 juin ; Hugh Clifford mena une colonne à leur poursuite au Kelantan et au Terengganu. En octobre–novembre 1895, des fonctionnaires siamois, qui avaient accepté de cesser de leur donner asile, capturèrent Bahaman et quatre autres chefs et les déportèrent à Chiang Mai ; Mat Kilau et Tok Gajah furent signalés comme morts. Les exilés furent autorisés à rentrer en 1913. En 1970, le gouvernement du Pahang reconnut les affirmations d’un vieil homme qui s’était présenté comme étant Mat Kilau ; il mourut dix jours plus tard. Bahaman et Mat Kilau sont restés dans les mémoires en Malaisie comme des combattants contre la domination coloniale.
