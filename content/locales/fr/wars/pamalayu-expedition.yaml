# French translations of the catalogue text (wave 11); step bodies follow later.
Pamalayu expedition: Expédition Pamalayu
? "The expedition that King Kertanagara of Singhasari in eastern Java sent to Malayu (Melayu), the kingdom on the Batang Hari river in Sumatra that had taken over much of Srivijaya’s place in the Strait of Malacca and whose capital was then Dharmasraya. The Pararaton, a Javanese chronicle, dates the order to 1275 and calls it the pamalayu, “the Malayu affair”. How much fighting there was is unknown: Britannica describes envoys, while other historians date a military campaign to around 1290. In 1286 Kertanagara sent a statue of the bodhisattva Amoghapasa with fourteen attendant figures from Java to Dharmasraya, and the inscription on its base (the Padang Roco inscription) says that the people of Malayu, and above all their king Tribhuwanaraja Mauliwarmadewa, rejoiced at the gift; historians read it as a sign of Javanese overlordship or of an alliance between equals. Kertanagara’s aim was probably to control the trade of the strait and to build a bloc of island states against the Yuan, whose envoy he humiliated in 1289. With much of his army overseas, he was overthrown and killed by Jayakatwang of Kediri in 1292. The expedition, led according to Javanese poems by Mahisa Anabrang, came back in 1293, after Raden Wijaya and the Yuan army had defeated Jayakatwang, bringing two princesses of Malayu, Dara Petak and Dara Jingga. Dara Petak married Raden Wijaya, the founder of Majapahit, and was the mother of its second king, Jayanagara; Dara Jingga was the mother of Adityawarman, who later ruled Malayu and the Minangkabau highlands."
: "L’expédition que le roi Kertanagara de Singhasari, à Java oriental, envoya au Malayu (Melayu), le royaume de la rivière Batang Hari à Sumatra, qui avait repris une grande partie de la place de Srivijaya dans le détroit de Malacca et dont la capitale était alors Dharmasraya. Le Pararaton, une chronique javanaise, date l’ordre de 1275 et le nomme pamalayu, « l’affaire du Malayu ». On ignore l’ampleur des combats : Britannica évoque des envoyés, tandis que d’autres historiens placent une campagne militaire vers 1290. En 1286, Kertanagara envoya de Java à Dharmasraya une statue du bodhisattva Amoghapasa accompagnée de quatorze figures d’assistants, et l’inscription de son socle (l’inscription de Padang Roco) dit que le peuple du Malayu, et surtout son roi Tribhuwanaraja Mauliwarmadewa, se réjouit de ce présent ; les historiens y voient le signe d’une suzeraineté javanaise ou d’une alliance entre égaux. Le but de Kertanagara était sans doute de contrôler le commerce du détroit et de constituer un bloc d’États insulaires face aux Yuan, dont il humilia l’envoyé en 1289. Alors qu’une grande partie de son armée se trouvait outre-mer, il fut renversé et tué par Jayakatwang de Kediri en 1292. L’expédition, conduite selon les poèmes javanais par Mahisa Anabrang, revint en 1293, après que Raden Wijaya et l’armée Yuan eurent vaincu Jayakatwang, et ramena deux princesses du Malayu, Dara Petak et Dara Jingga. Dara Petak épousa Raden Wijaya, le fondateur de Majapahit, et fut la mère de son deuxième roi, Jayanagara ; Dara Jingga fut la mère d’Adityawarman, qui régna plus tard sur le Malayu et les hautes terres minangkabau."
