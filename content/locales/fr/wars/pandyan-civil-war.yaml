# French translations of the catalogue text (wave 8); step bodies follow later.
Pandyan civil war: Guerre civile pandya
? A war of succession in the Pandya kingdom of Madurai that drew in the two great powers of the south, the Sinhalese kingdom of Polonnaruwa and the Chola Empire. In 1169 Kulasekhara Pandya besieged Madurai, and the reigning king, Parakrama Pandya, appealed to Parakramabahu I of Polonnaruwa but was killed before help came. A Sinhalese army under the general Lankapura Dandanatha landed at Rameswaram, joined Parakrama’s son Vira Pandya and took Madurai, and Kulasekhara turned to the Chola king Rajadhiraja II. Chola armies under the generals Tiruchirrambalamudaiyan Perumanambi and Annan Pallavarayan defeated the Sinhalese, set up the heads of Lankapura and other commanders on the gates of Madurai in about 1174, and raided northern Sri Lanka. The alliances then shifted. Parakramabahu won Kulasekhara over, the Cholas drove him out and put Vira Pandya on the throne as their client, and fighting went on into the late 1170s, with Sinhalese and Pandya forces holding Rameswaram until 1182. The Cholas came out on top, but the war revived the Pandyas, who within a century overshadowed both their former patrons.
: Une guerre de succession dans le royaume pandya de Madurai, qui entraîna les deux grandes puissances du Sud, le royaume cingalais de Polonnaruwa et l’Empire chola. En 1169, Kulasekhara Pandya assiégea Madurai, et le roi régnant, Parakrama Pandya, fit appel à Parakramabahu Ier de Polonnaruwa, mais fut tué avant l’arrivée des secours. Une armée cingalaise commandée par le général Lankapura Dandanatha débarqua à Rameswaram, rejoignit Vira Pandya, fils de Parakrama, et prit Madurai, et Kulasekhara se tourna vers le roi chola Rajadhiraja II. Les armées chola, commandées par les généraux Tiruchirrambalamudaiyan Perumanambi et Annan Pallavarayan, vainquirent les Cingalais, exposèrent vers 1174 les têtes de Lankapura et d’autres chefs sur les portes de Madurai et lancèrent des raids dans le nord du Sri Lanka. Les alliances changèrent alors. Parakramabahu rallia Kulasekhara à sa cause, les Chola le chassèrent et placèrent Vira Pandya sur le trône comme leur vassal, et les combats se poursuivirent jusqu’à la fin des années 1170, les forces cingalaises et pandya tenant Rameswaram jusqu’en 1182. Les Chola l’emportèrent, mais la guerre fit renaître la puissance des Pandya, qui en moins d’un siècle éclipsèrent leurs deux anciens protecteurs.
