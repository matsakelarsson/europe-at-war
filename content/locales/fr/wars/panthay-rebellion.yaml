# French translations of the catalogue text (wave 9); step bodies follow later.
Panthay Rebellion: Rébellion des Panthay
A rising of the Hui (Chinese-speaking Muslims) of Yunnan, joined by other peoples of the province, against the Qing. After years of violence between Hui and Han miners and settlers, officials and militias massacred Hui in and around Kunming in 1856, and risings broke out across the province. In western Yunnan Du Wenxiu took Dali and founded a state he called Pingnan Guo, the “Pacified South”, with himself as its ruler, known to Muslims and foreigners as Sultan Suleiman; it governed with Hui and Han officials and held much of the west for sixteen years. In the east the rebel leader Ma Rulong went over to the Qing in 1862. Du’s armies besieged Kunming in 1867–1868 but failed, and the Qing governor Cen Yuying, with modern artillery, slowly took back the province. Dali fell in January 1873 after Du Wenxiu had poisoned himself; thousands of its people were massacred. Estimates of the dead run as high as a million.: Un soulèvement des Hui (musulmans de langue chinoise) du Yunnan, rejoints par d’autres peuples de la province, contre les Qing. Après des années de violences entre mineurs et colons hui et han, des fonctionnaires et des milices massacrèrent des Hui à Kunming et dans ses environs en 1856, et des soulèvements éclatèrent dans toute la province. Dans l’ouest du Yunnan, Du Wenxiu prit Dali et fonda un État qu’il appela Pingnan Guo, le « Sud pacifié », dont il fut lui-même le souverain, connu des musulmans et des étrangers sous le nom de sultan Suleiman ; cet État gouverna avec des fonctionnaires hui et han et tint une grande partie de l’ouest pendant seize ans. Dans l’est, le chef rebelle Ma Rulong passa aux Qing en 1862. Les armées de Du assiégèrent Kunming en 1867–1868, sans succès, et le gouverneur Qing Cen Yuying, doté d’une artillerie moderne, reprit lentement la province. Dali tomba en janvier 1873, après que Du Wenxiu se fut empoisonné ; des milliers de ses habitants furent massacrés. Les estimations du nombre de morts vont jusqu’à un million.
