# French translations of the catalogue text (wave 11); step bodies follow later.
Papua conflict: Conflit de Papouasie
? The long, low-level war between Indonesia and Papuan independence fighters in the western half of New Guinea, which Indonesia took over from a UN administration in 1963 and formally integrated after the disputed Act of Free Choice of 1969. The Free Papua Movement (Organisasi Papua Merdeka, OPM) has fought since 1965 with small, scattered guerrilla bands, often armed with bows, arrows and old rifles, and today mainly through the West Papua National Liberation Army (TPNPB); its political wing abroad is the United Liberation Movement for West Papua. Indonesia has answered with military operations in the highlands, a heavy security presence and restrictions on foreign journalists, and since 2001 with special autonomy and, in 2022, a division of the region into six provinces. Papuans’ grievances include the 1969 vote, killings and abuses by the security forces, the arrival of migrants from other islands, who now make up a large part of the population, and the exploitation of resources such as the Grasberg copper and gold mine. The fighting has intensified since 2018 in the central highlands, where tens of thousands have been displaced. Estimates of the total dead since the 1960s vary enormously, from about 100,000 to several hundred thousand, and none rests on a systematic count. Last updated 27 November 2026.
: "La longue guerre de faible intensité qui oppose l’Indonésie aux combattants indépendantistes papous dans la moitié occidentale de la Nouvelle-Guinée, que l’Indonésie reçut d’une administration de l’ONU en 1963 et intégra formellement après le contesté Acte de libre choix de 1969. Le Mouvement pour une Papouasie libre (Organisasi Papua Merdeka, OPM) combat depuis 1965 au moyen de petites bandes de guérilla dispersées, souvent armées d’arcs, de flèches et de vieux fusils, et aujourd’hui principalement par l’intermédiaire de l’Armée de libération nationale de Papouasie occidentale (TPNPB) ; sa branche politique à l’étranger est le Mouvement uni de libération pour la Papouasie occidentale. L’Indonésie a répondu par des opérations militaires dans les hautes terres, une forte présence sécuritaire et des restrictions imposées aux journalistes étrangers, puis, depuis 2001, par un statut d’autonomie spéciale et, en 2022, par la division de la région en six provinces. Les griefs des Papous portent sur le vote de 1969, les meurtres et les abus commis par les forces de sécurité, l’arrivée de migrants venus d’autres îles, qui forment aujourd’hui une grande partie de la population, et l’exploitation de ressources comme la mine de cuivre et d’or de Grasberg. Les combats se sont intensifiés depuis 2018 dans les hautes terres centrales, où des dizaines de milliers de personnes ont été déplacées. Les estimations du nombre total de morts depuis les années 1960 varient énormément, d’environ 100 000 à plusieurs centaines de milliers, et aucune ne repose sur un décompte systématique. Dernière mise à jour : 27 novembre 2026."
