# French translations of the catalogue text (wave 8); step bodies follow later.
Paramara–Chaulukya wars: Guerres entre Paramara et Chaulukya
? The wars, on and off for two centuries, between the Paramaras of Malwa, ruling from Dhara, and their western neighbours, the Chaulukyas (Solankis) of Gujarat, ruling from Anahilapataka (Patan). Under the scholar-king Bhoja (about 1010–1055) the Paramaras had the upper hand; a later Jain chronicle says his general Kulachandra sacked the Chaulukya capital while Bhima I was away fighting in Sindh. Bhima allied with the Kalachuri king Lakshmi-Karna, and the two invaded Malwa from both sides as Bhoja lay dying in about 1055. In 1135–1136 Jayasimha Siddharaja took Dhara and annexed Malwa after a long war with the Paramara kings Naravarman and Yashovarman, and in about 1150 his successor Kumarapala defeated the usurper Ballala and kept Malwa as a Chaulukya province. The Paramara Vindhyavarman restored the kingdom between the 1170s and 1190s, defeating Mularaja II, and his successors carried the war into Gujarat. Subhatavarman invaded it in about 1204, when the Chaulukyas were weakened by the Ghurid invasions, and Arjunavarman defeated the usurper Jayantasimha in the early 1210s.
: Les guerres qui opposèrent par intermittence, pendant deux siècles, les Paramara du Malwa, qui régnaient depuis Dhara, à leurs voisins de l’ouest, les Chaulukya (Solanki) du Goujarat, qui régnaient depuis Anahilapataka (Patan). Sous le roi lettré Bhoja (vers 1010–1055), les Paramara eurent le dessus ; une chronique jaïne plus tardive rapporte que son général Kulachandra saccagea la capitale chaulukya pendant que Bhima Ier combattait au loin dans le Sind. Bhima s’allia au roi kalachuri Lakshmi-Karna, et tous deux envahirent le Malwa des deux côtés alors que Bhoja se mourait, vers 1055. En 1135–1136, Jayasimha Siddharaja prit Dhara et annexa le Malwa après une longue guerre contre les rois paramara Naravarman et Yashovarman et, vers 1150, son successeur Kumarapala vainquit l’usurpateur Ballala et conserva le Malwa comme province chaulukya. Le Paramara Vindhyavarman restaura le royaume entre les années 1170 et 1190, battant Mularaja II, et ses successeurs portèrent la guerre au Goujarat. Subhatavarman l’envahit vers 1204, alors que les Chaulukya étaient affaiblis par les invasions ghurides, et Arjunavarman vainquit l’usurpateur Jayantasimha au début des années 1210.
