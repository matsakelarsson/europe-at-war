# Some French text was translated automatically.
"Paris Commune": "Commune de Paris"
? "The revolutionary government that ruled Paris from 18 March to 28 May 1871, after France’s defeat in the Franco-Prussian War. When Adolphe Thiers’s government sent troops to remove the National Guard’s cannon from Montmartre on 18 March, crowds and guardsmen stopped them, two generals were shot dead, and the government withdrew to Versailles. A council elected on 26 March took power as the Commune. It separated church and state, suspended rents and let workers take over workshops their owners had left, while short-lived communes in Lyon, Marseille and other cities were soon put down. The army, rebuilt under Marshal Patrice de MacMahon with soldiers freed from German captivity, entered Paris on 21 May. In the “Bloody Week” that followed, Communards burned the Tuileries Palace and the Hôtel de Ville and shot about a hundred hostages, among them the Archbishop of Paris, while government troops killed Communards in the street fighting and in mass executions. Estimates of the Communards killed range from about 7,000 to 20,000; the army lost 877 dead from April to May. Over 43,000 people were taken prisoner, and some 13,500 were convicted, many of them deported to New Caledonia, until an amnesty in 1880."
: "Le gouvernement révolutionnaire qui gouverna Paris du 18 mars au 28 mai 1871, après la défaite de la France dans la guerre franco-prussienne. Lorsque le gouvernement d’Adolphe Thiers envoya des troupes pour retirer le canon de la Garde nationale de Montmartre le 18 mars, les foules et les gardes les arrêtèrent, deux généraux furent abattus et le gouvernement se retira à Versailles. Un conseil élu le 26 mars prit le pouvoir en tant que Commune. Elle sépare l’église et l’État, suspend les loyers et laisse les ouvriers reprendre les ateliers que leurs propriétaires avaient quittés, tandis que des communes de Lyon, Marseille et d’autres villes furent bientôt détruites. L’armée, reconstruite sous le maréchal Patrice de MacMahon avec des soldats libérés de la captivité allemande, entre à Paris le 21 mai. Au cours de la semaine suivante, les Communards ont brûlé le Palais des Tuileries et l’Hôtel de Ville et abattu une centaine d’otages, dont l’Archevêque de Paris, tandis que les troupes gouvernementales tuaient les Communards dans les combats de rue et dans les exécutions massives. Plus de 43 000 personnes ont été détenues et quelque 13 500 ont été condamnées, dont beaucoup ont été expulsées en Nouvelle-Calédonie jusqu’à une amnistie en 1880."
"The Franco-Prussian War, told separately, ended with the Treaty of Frankfurt on 10 May 1871. German troops still held the forts north and east of Paris during the fighting and did not take part.": "La guerre franco-prussienne, racontée séparément, s’est terminée avec le traité de Francfort le 10 mai 1871. Les troupes allemandes ont toujours tenu les forts au nord et à l’est de Paris pendant les combats et n’ont pas participé."
"Some of the last Communards were shot against a wall in Père Lachaise cemetery, now known as the Communards’ Wall (Mur des Fédérés).": "Certaines des dernières Communards ont été abattues contre un mur du cimetière du Père Lachaise, aujourd'hui connu sous le nom de Mur des communes (Mur des Fédérés)."
