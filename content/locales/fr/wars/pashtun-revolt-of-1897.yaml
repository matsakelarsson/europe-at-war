# French translations of the catalogue text (wave 8); step bodies follow later.
Pashtun revolt of 1897: Révolte pachtoune de 1897
A wave of risings by Pashtun tribes along the North-West Frontier of British India in 1897–1898, the largest the British faced there. Resentment of the Durand Line of 1893 and of new British posts in tribal country, preached against by religious leaders, broke out in attacks in the Tochi valley in June, on the British camps at Malakand and the fort of Chakdara in July, on Shabqadar in August, on the Khyber posts held by Afridi levies and on the forts of the Samana range, where 21 Sikh soldiers died defending Saragarhi in September. The British sent several field forces; the largest, about 35,000 strong under Sir William Lockhart, marched into the Afridi and Orakzai valleys of Tirah in October, stormed the Dargai heights and burned villages before withdrawing through the snow in December. The tribes submitted and paid fines in the spring of 1898.: Une vague de soulèvements des tribus pachtounes le long de la frontière du Nord-Ouest de l’Inde britannique en 1897–1898, la plus importante à laquelle les Britanniques y furent confrontés. Le ressentiment contre la ligne Durand de 1893 et contre les nouveaux postes britanniques en territoire tribal, que dénonçaient les prêches de chefs religieux, éclata en attaques dans la vallée de la Tochi en juin, contre les camps britanniques du Malakand et le fort de Chakdara en juillet, contre Shabqadar en août, puis contre les postes de la passe de Khyber tenus par des levées afridis et contre les forts de la chaîne du Samana, où 21 soldats sikhs moururent en défendant Saragarhi en septembre. Les Britanniques envoyèrent plusieurs forces de campagne ; la plus importante, forte d’environ 35 000 hommes sous le commandement de Sir William Lockhart, pénétra en octobre dans les vallées afridis et orakzaïs du Tirah, prit d’assaut les hauteurs de Dargai et incendia des villages avant de se retirer dans la neige en décembre. Les tribus se soumirent et payèrent des amendes au printemps 1898.
