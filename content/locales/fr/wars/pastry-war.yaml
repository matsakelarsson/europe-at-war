# French translations of the catalogue text (wave 14); step bodies follow later.
Pastry War: Guerre des Pâtisseries
? A French blockade and attack on Mexico in 1838–1839 to force payment of claims by French citizens. Among the claims was one from a French pastry cook, Remontel, whose shop at Tacubaya near Mexico City had been looted by soldiers in 1828, which gave the war its name; France demanded 600,000 pesos in all, as well as trade privileges, after years of unpaid damages from Mexico’s civil wars. When Mexico refused, a French squadron blockaded the Gulf ports from April 1838. On 27 November 1838 ships under Rear Admiral Charles Baudin bombarded the island fortress of San Juan de Ulúa off Veracruz, which surrendered the next day, and Mexico declared war. On 5 December French troops landed at Veracruz to seize the Mexican commander; Antonio López de Santa Anna, back from disgrace after the loss of Texas, led the defence and drove them back to their boats, losing his left leg to grapeshot, and used the episode to restore his reputation. Britain, whose trade suffered from the blockade, mediated, and by the treaty of 9 March 1839 Mexico agreed to pay the 600,000 pesos and France returned the fortress. In 1861 French claims against Mexico again led to war, the French intervention.
: "Le blocus et l’attaque du Mexique par la France en 1838–1839 pour obtenir le paiement de réclamations de citoyens français. Parmi celles-ci figurait celle d’un pâtissier français, Remontel, dont la boutique de Tacubaya, près de Mexico, avait été pillée par des soldats en 1828, ce qui donna son nom à la guerre ; la France réclamait au total 600 000 pesos, ainsi que des privilèges commerciaux, après des années de dommages impayés causés par les guerres civiles mexicaines. Devant le refus du Mexique, une escadre française bloqua les ports du golfe à partir d’avril 1838. Le 27 novembre 1838, les navires du contre-amiral Charles Baudin bombardèrent la forteresse insulaire de San Juan de Ulúa, au large de Veracruz, qui se rendit le lendemain, et le Mexique déclara la guerre. Le 5 décembre, des troupes françaises débarquèrent à Veracruz pour s’emparer du commandant mexicain ; Antonio López de Santa Anna, revenu de sa disgrâce après la perte du Texas, dirigea la défense et les repoussa jusqu’à leurs embarcations, perdant sa jambe gauche, emportée par la mitraille, et se servit de l’épisode pour restaurer sa réputation. La Grande-Bretagne, dont le commerce souffrait du blocus, servit de médiatrice et, par le traité du 9 mars 1839, le Mexique accepta de payer les 600 000 pesos et la France rendit la forteresse. En 1861, des réclamations françaises contre le Mexique menèrent de nouveau à la guerre : ce fut l’intervention française, l’expédition du Mexique."
