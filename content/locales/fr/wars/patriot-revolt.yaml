"Patriot revolt and the Prussian invasion of Holland": "La révolte patriotique et l’invasion prussienne des Pays-Bas"
? "A struggle in the Dutch Republic between the Patriots, who wanted to curb the power of the stadtholder William V of Orange and his court, and the Orangists, which became a low-level civil war and ended with a Prussian invasion. From 1785 armed Patriot free corps took power in a number of towns and won majorities in the States of Holland, Groningen and Utrecht; William V left The Hague in September 1785, and in 1786 his troops occupied the Patriot towns of Hattem and Elburg in Guelders. On 9 May 1787 Patriot volunteers beat off troops loyal to the stadtholder at Jutphaas near Utrecht. When a Patriot free corps stopped William’s wife, Wilhelmina of Prussia, at Goejanverwellesluis on her way to The Hague on 28 June 1787, her brother, Frederick William II of Prussia, demanded satisfaction. With British backing, some 26,000 Prussian troops under the Duke of Brunswick invaded on 13 September; France, which had encouraged the Patriots, did nothing. Utrecht was abandoned without a fight, Amsterdam surrendered on 10 October, and William V was restored. Thousands of Patriots fled to France and the Austrian Netherlands, and many returned with the French armies in 1795."
: "Une lutte dans la République néerlandaise entre les Patriotes, qui voulaient freiner le pouvoir du propriétaire destadt William V d’Orange et sa cour, et les Orangistes, qui est devenu une guerre civile de bas niveau et s’est terminée par une invasion prussienne. À partir de 1785, le corps libre patriote armé prend le pouvoir dans un certain nombre de villes et remporte des majorités dans les États de Hollande, Groningue et Utrecht ; William V quitte La Haye en septembre 1785 et, en 1786, ses troupes occupent les villes patriotes de Hattem et d’Elburg à Guelders. Lorsqu'un corps libre patriote arrêta la femme de William, Wilhelmina de Prusse, à Goejanverwellesluis sur son chemin vers La Haye le 28 juin 1787, son frère, Frederick Guillaume II de Prusse, demanda satisfaction. Avec le soutien britannique, quelque 26 000 troupes prussiennes sous le duc de Brunswick envahirent le 13 septembre ; la France, qui avait encouragé les Patriotes, ne fit rien. Utrecht fut abandonné sans combat, Amsterdam se rendit le 10 octobre et William V fut restauré. Des milliers de patriotes s’enfuirent en France et aux Pays-Bas autrichiens, et beaucoup retournèrent avec les armées françaises en 1795."
"In Dutch the years of the Patriot movement, about 1780–1787, are called the Patriottentijd. After the invasion Britain, Prussia and the restored stadtholder formed the Triple Alliance of 1788.": "Aux Pays-Bas, les années du mouvement patriote, vers 1780–1787, sont appelées le Patriottentijd. Après l’invasion de la Grande-Bretagne, la Prusse et le propriétaire restauré forment la Triple Alliance de 1788."
