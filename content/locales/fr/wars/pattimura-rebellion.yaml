# French translations of the catalogue text (wave 11); step bodies follow later.
Pattimura’s rebellion: Rébellion de Pattimura
? A rising in the islands of the central Moluccas against the return of Dutch rule after the British occupation of 1810–1817. Under the Convention of London of 1814 Britain handed the Moluccas back to the Netherlands, and the transfer took place at Ambon in March 1817. People on Saparua and the other Lease islands feared a return to the Company-era burdens of forced deliveries and forced labour, and the conscription of Ambonese men, many of them former soldiers of the British Amboina Corps, for service in Java. On 14 May 1817 village leaders meeting on Saparua chose Thomas Matulessy, a Protestant former sergeant-major of the Amboina Corps, as their captain, Kapitan Pattimura. On 15–16 May they took Fort Duurstede, the Dutch post on Saparua, and killed its garrison and the young Resident, Johannes Rudolph van den Berg, with his wife and children; one five-year-old son survived. A relief force of about 300 men under Major Beetjes landed on Saparua on 20 May and was destroyed; most of its men, Beetjes among them, were killed. The rising spread to Haruku, Nusalaut, parts of Ambon and the coast of Seram, Christian and Muslim villages fighting together, and on 1 June the rebels attacked Fort Nieuw Zeelandia on Haruku but were beaten off. Dutch warships with reinforcements, helped by fleets of the sultans of Ternate and Tidore, retook Fort Duurstede on 3 August, and by November the rising had been crushed. Pattimura was betrayed and captured at Booi on Saparua on 12 November, and on 16 December 1817 he was hanged with four other leaders in front of Fort Nieuw Victoria in Ambon; Kapitan Paulus Tiahahu of Nusalaut was executed, and his daughter Martha Christina Tiahahu, who had fought beside him, died on a Dutch ship taking her to forced labour in Java in January 1818. Pattimura was declared a National Hero of Indonesia in 1973, and both he and Martha Christina Tiahahu are commemorated in Maluku.
: "Un soulèvement dans les îles du centre des Moluques contre le retour de la domination néerlandaise après l’occupation britannique de 1810–1817. En vertu de la convention de Londres de 1814, la Grande-Bretagne rendit les Moluques aux Pays-Bas, et la passation des pouvoirs eut lieu à Ambon en mars 1817. Les habitants de Saparua et des autres îles Lease craignaient un retour aux charges de l’époque de la Compagnie, livraisons forcées et travail forcé, ainsi que la conscription d’hommes ambonais, dont beaucoup étaient d’anciens soldats du corps britannique d’Amboine, pour servir à Java. Le 14 mai 1817, des chefs de village réunis à Saparua choisirent pour capitaine Thomas Matulessy, un protestant, ancien sergent-major du corps d’Amboine : ce fut le Kapitan Pattimura. Les 15 et 16 mai, ils prirent le fort Duurstede, le poste néerlandais de Saparua, et tuèrent sa garnison ainsi que le jeune résident, Johannes Rudolph van den Berg, avec sa femme et ses enfants ; un fils de cinq ans survécut. Une force de secours d’environ 300 hommes commandée par le major Beetjes débarqua à Saparua le 20 mai et fut anéantie ; la plupart de ses hommes, dont Beetjes, furent tués. Le soulèvement s’étendit à Haruku, à Nusalaut, à certaines parties d’Ambon et à la côte de Seram, villages chrétiens et musulmans combattant côte à côte, et le 1er juin les rebelles attaquèrent le fort Nieuw Zeelandia, à Haruku, mais furent repoussés. Des navires de guerre néerlandais chargés de renforts, aidés par les flottes des sultans de Ternate et de Tidore, reprirent le fort Duurstede le 3 août et, en novembre, le soulèvement avait été écrasé. Pattimura fut trahi et capturé à Booi, sur Saparua, le 12 novembre, et le 16 décembre 1817 il fut pendu avec quatre autres chefs devant le fort Nieuw Victoria, à Ambon ; le Kapitan Paulus Tiahahu, de Nusalaut, fut exécuté, et sa fille Martha Christina Tiahahu, qui avait combattu à ses côtés, mourut en janvier 1818 à bord d’un navire néerlandais qui l’emmenait aux travaux forcés à Java. Pattimura fut proclamé héros national de l’Indonésie en 1973, et lui comme Martha Christina Tiahahu sont commémorés aux Moluques."
