# Some French text was translated automatically.
"Pazzi War": "Guerre de Pazzi"
"The war that followed the Pazzi conspiracy of 26 April 1478, in which conspirators backed by Pope Sixtus IV killed Giuliano de’ Medici in Florence cathedral and wounded his brother Lorenzo; the Florentines hanged the Archbishop of Pisa and others in revenge. The pope excommunicated Lorenzo, put Florence under interdict and, with Ferdinand I of Naples, made war on it. Neapolitan and papal armies under Alfonso, Duke of Calabria, invaded Tuscany, while Florence’s allies Milan and Venice gave little help; on 7 September 1479 Alfonso routed the Florentines at Poggio Imperiale near Poggibonsi and went on to take Colle di Val d’Elsa. In December 1479 Lorenzo sailed to Naples and in three months of talks won Ferdinand over to peace. The Ottoman capture of Otranto in August 1480 then pushed Sixtus to make his own peace with Florence in December 1480.": "La guerre qui a suivi la conspiration de Pazzi du 26 avril 1478, au cours de laquelle des conspirateurs soutenus par le pape Sixte IV ont tué Giuliano des Médicis dans la cathédrale de Florence et blessé son frère Lorenzo ; les Florentins pendu l’archevêque de Pise et d’autres en vengeance. Les armées napolitaines et papales sous Alfonso, duc de Calabre, envahissent la Toscane, tandis que les alliés de Florence Milan et Venise ne donnent guère d’aide ; le 7 septembre 1479, Alfonso fait route vers les Florentines à Poggio Imperiale près de Poggibonsi et prend Colle di Val d-Elsa. En décembre 1479 Lorenzo s’embarqua à Naples et, en trois mois de pourparlers, Ferdinand gagna la paix. La prise ottomane d’Otranto en août 1480 poussa alors Sixte à faire sa propre paix avec Florence en décembre 1480."
"The war has no settled English name; it is also called the war of the Pazzi conspiracy. Siena fought on the papal and Neapolitan side.": "La guerre n’a pas de nom anglais établi ; elle est également appelée la guerre du complot Pazzi. Sienne a combattu du côté papal et napolitain."
