# Some French text was translated automatically.
"Peasant revolt in Flanders": "Révolte paysanne en Flandre"
"A rising of the peasants of coastal Flanders against the taxes and officials of Count Louis of Nevers, partly levied to pay the fines of the Treaty of Athis-sur-Orge. It began with rural riots in late 1323 and grew into a rebellion led by the farmer Nicolaas Zannekin, joined by Bruges and Ypres, which captured the count at Kortrijk in 1325. A peace made at Arques in 1326 soon broke down, and in 1328 the new French king, Philip VI, came to the count’s aid and crushed the rebel army at Cassel on 23 August, followed by harsh reprisals.": "Une montée des paysans de Flandre côtière contre les impôts et les fonctionnaires du comte Louis de Nevers, en partie prélevé pour payer les amendes du traité d’Athis-sur-Orge. Il a commencé avec les émeutes rurales à la fin 1323 et est devenu une rébellion dirigée par le fermier Nicolaas Zannekin, rejoint par Bruges et Ypres, qui ont capturé le compte à Kortrijk en 1325. Une paix faite à Arques en 1326 s’écroula bientôt, et en 1328 le nouveau roi français Philippe VI vint au secours du comte et écrasera l’armée rebelle de Cassel le 23 août, suivie par de violentes représailles."
"Ghent stayed loyal to the count throughout. Zannekin was killed at Cassel, and Bruges’ leader Willem de Deken was executed in Paris.": "Gand est resté fidèle au comte tout au long. Zannekin a été tué à Cassel, et le leader de Bruges, Willem de Deken, a été exécuté à Paris."
