"Peasants’ Revolt": "Paysans"
"A rising in England in the summer of 1381, set off by the third poll tax in four years, raised to pay for the war with France. Rebels from Essex and Kent, led by Wat Tyler and inspired by the preacher John Ball, entered London on 13 June, burned John of Gaunt’s Savoy Palace and killed the Archbishop of Canterbury and the Treasurer. The fourteen-year-old Richard II met the rebels at Mile End and at Smithfield, where Tyler was killed on 15 June. The king’s promises to end serfdom were revoked, and the revolt, which had spread to East Anglia and beyond, was put down.": "Les rebelles d’Essex et Kent, dirigés par Wat Tyler et inspiré par le prédicateur John Ball, sont entrés à Londres le 13 juin, ont brûlé Jean de Gaunt. Savoy Palace et tué l’archevêque de Canterbury et le trésorier. Richard II, quatorze ans, rencontra les rebelles à Mile End et à Smithfield, où Tyler fut tué le 15 juin. Les promesses du roi de mettre fin au servage furent révoquées, et la révolte, qui s’était étendue à l’est d’Anglie et au-delà, fut réprimée."
"Also called Wat Tyler’s Rebellion or the Great Rising. John Ball was executed at St Albans on 15 July 1381.": "Aussi appelé la Rébellion de Wat Tyler, ou le Grand Rising. John Ball a été exécuté à St Albans le 15 juillet 1381."
