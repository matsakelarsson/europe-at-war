"In March 1809 Soult invaded northern Portugal and on 29 March stormed Porto. In the panic a bridge of boats over the Douro collapsed under the fleeing townspeople, and hundreds, perhaps thousands, drowned. Wellesley returned to Lisbon in April to command the British and Portuguese forces, and on 12 May he surprised Soult by ferrying troops across the Douro in wine barges above the city. Soult fled into the mountains, abandoning his guns and baggage. Meanwhile the Portuguese army was rebuilt under a British general, William Beresford, with British officers serving in its ranks.": "En mars 1809, Soult envahit le nord du Portugal et, le 29 mars, s’empare de Porto. Dans la panique, un pont d’embarcations sur le Douro s’écroula sous les habitants des villes fuyantes, et des centaines, peut-être des milliers, se noyèrent. Wellesley retourna à Lisbonne en avril pour commander les forces britanniques et portugaises et, le 12 mai, il surprit Soult en transbordant les troupes du Douro dans des barges au-dessus de la ville. Soult s’enfuit dans les montagnes, abandonnant ses armes et ses bagages. Pendant ce temps, l’armée portugaise fut reconstruite sous un général britannique, William Beresford, avec des officiers britanniques qui servaient dans ses rangs."
"Wellesley then marched into Spain to join General Cuesta’s Spanish army in a drive on Madrid. At Talavera on 27–28 July the allies beat off the attacks of Marshal Victor and King Joseph, with heavy losses on both sides; many wounded burned to death when the dry grass caught fire. Wellesley, made Viscount Wellington for the victory, fell back to Portugal when more French armies closed in. In November the main Spanish army was destroyed at Ocaña, losing nearly 19,000 men. In Catalonia, Girona had resisted a French siege since May; starving and sick, it surrendered in December, after seven months.": "Wellesley marcha ensuite en Espagne pour rejoindre l’armée espagnole du général Cuesta dans une promenade sur Madrid. À Talavera les 27 et 28 juillet, les alliés battèrent les attaques du maréchal Victor et du roi Joseph, avec de lourdes pertes des deux côtés ; beaucoup de blessés brûlés à mort lorsque l’herbe sèche prit feu. En novembre, la principale armée espagnole a été détruite à Ocaña, perdant près de 19 000 hommes. En Catalogne, Gérone avait résisté à un siège français depuis mai ; affamé et malade, il s’est rendu en décembre, après sept mois."
