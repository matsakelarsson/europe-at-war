# Some French text was translated automatically.
"Peninsular War": "Guerre d’indépendance espagnole"
"The war for the Iberian Peninsula between Napoleonic France and the allied armies of Spain, Portugal and Britain. It began with the French occupation of Portugal in 1807 and grew into a national war in Spain when Napoleon put his brother Joseph on the Spanish throne in 1808. Spanish armies, guerrillas and sieges tied down hundreds of thousands of French troops, while Wellington’s British and Portuguese army, safe behind the Lines of Torres Vedras, wore the French down and then drove them out of Spain, winning at Salamanca in 1812 and Vitoria in 1813 and ending the war at Toulouse in April 1814.": "La guerre pour la péninsule ibérique entre la France napoléonienne et les armées alliées de l’Espagne, du Portugal et de la Grande-Bretagne. Elle a commencé avec l’occupation française du Portugal en 1807 et s’est transformée en une guerre nationale en Espagne lorsque Napoléon a mis son frère Joseph sur le trône espagnol en 1808. Les armées, les guérilleros et les sièges espagnols attachaient des centaines de milliers de troupes françaises, tandis que l’armée britannique et portugaise Wellington, en sécurité derrière les lignes de Torres Vedras, portait les Français vers le bas et les chassait d’Espagne, remportant à Salamanque en 1812 et Vitoria en 1813 et mettant fin à la guerre à Toulouse en avril 1814."
"In Spain the war is called the War of Independence (Guerra de la Independencia), in Portugal the French Invasions, and in Catalonia the War of the French. The wider Napoleonic Wars are told separately.": "En Espagne, la guerre est appelée la guerre d’indépendance (Guerra de la Independencia), au Portugal les invasions françaises et en Catalogne la guerre des Français. Les guerres napoléoniennes plus larges sont racontées séparément."
"The Spain side stands for the patriot juntas, the Regency and the Cortes that fought in Ferdinand VII’s name. Joseph Bonaparte’s Kingdom of Spain, recognised only by France and its allies, is counted with France.": "La partie espagnole représente les juntes patriotiques, la Regency et les Cortes qui ont combattu au nom de Ferdinand VII. Le Royaume d’Espagne Joseph Bonaparte, reconnu uniquement par la France et ses alliés, est compté avec la France."
"The war killed hundreds of thousands of soldiers and civilians, through battle, sieges, reprisals, famine and disease. Estimates vary widely.": "La guerre a tué des centaines de milliers de soldats et de civils, par la bataille, les sièges, les représailles, la famine et la maladie."
