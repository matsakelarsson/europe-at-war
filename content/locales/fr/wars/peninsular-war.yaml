"October 1807 – May 1808": "octobre 1807 – mai 1808"
"Portugal, Britain’s oldest ally, would not join Napoleon’s blockade of British trade. On 27 October 1807, by the secret Treaty of Fontainebleau, France and Spain agreed to conquer it and divide it into three parts, one of them a principality for Charles IV’s chief minister, Manuel Godoy. General Junot marched across Spain and invaded Portugal on 19 November with three Spanish divisions in support. The Portuguese did not resist. On 29 November the Prince Regent John, his mentally ill mother, Queen Maria, and much of the court sailed for Brazil under British escort, and the next day Junot’s exhausted advance guard entered Lisbon.": "Le 27 octobre 1807, par le traité secret de Fontainebleau, la France et l’Espagne acceptèrent de le conquérir et de le diviser en trois parties, dont une principauté pour Manuel Godoy, premier ministre de Charles IV. Le général Junot marcha à travers l’Espagne et envahit le Portugal le 19 novembre avec trois divisions espagnoles de soutien. Les Portugais ne résistèrent pas. Le 29 novembre, le prince régent John, sa mère mentalement malade, la reine Maria, et une grande partie de la cour s’embarquèrent pour le Brésil sous escorte britannique."
"Meanwhile French troops poured into Spain, Napoleon’s ally, and in February and March 1808 seized the frontier fortresses of Pamplona, Barcelona, Figueres and San Sebastián by trickery. On 17–19 March a riot at the palace of Aranjuez toppled Godoy and forced Charles IV to abdicate in favour of his son Ferdinand VII. Napoleon summoned both to Bayonne, where in early May he made them give up the crown, which he handed to his brother Joseph. On 2 May, as the last members of the royal family were being taken from Madrid, the people of the city rose against Marshal Murat’s troops. The rising was crushed, and through the night and the next day the French shot hundreds of prisoners.": "Pendant ce temps, les troupes françaises versèrent en Espagne, l’allié de Napoléon et, en février et mars 1808, s’emparèrent des forteresses frontalières de Pampelune, Barcelone, Figueres et San Sebastián par la ruse. Napoléon convoqua les deux à Bayonne, où au début de mai il fit abandonner la couronne qu’il confia à son frère Joseph. Le 2 mai, alors que les derniers membres de la famille royale étaient emmenés de Madrid, les habitants de la ville se levèrent contre les troupes du maréchal Murat. La montée fut écrasée, et la nuit et le lendemain, les Français tirèrent des centaines de prisonniers."
