"Wellington’s men, hidden behind the crest of the ridge, threw back five French assaults. The French lost up to 4,500 men, the allies about 1,300.": "Les hommes de Wellington, cachés derrière la crête, ont repoussé cinq assauts français. Les Français ont perdu jusqu’à 4 500 hommes, les alliés environ 1300."
"October 1810 – March 1811": "octobre 1810 – mars 1811"
"Some 150 forts and redoubts with hundreds of guns, linked by a semaphore system. The French never seriously attacked them.": "Quelque 150 forts et doutes avec des centaines de canons, liés par un système sémaphore. Les Français ne les ont jamais sérieusement attaqués."
"Masséna": "Masséna"
"Wellington": "Wellington"
"Andalusia, 1810": "Andalousie, 1810"
"First line of Torres Vedras": "Première ligne de Torres Vedras"
"Albuera, Fuentes and the sieges": "Albuera, Fuentes et les sièges"
"March 1811 – April 1812": "mars 1811 – avril 1812"
"With Portugal free, Wellington turned to the border fortresses that guarded the roads into Spain, Ciudad Rodrigo and Almeida in the north and Badajoz in the south. In March 1811 a British and Spanish force from Cádiz won a bloody fight at Barrosa but failed to lift the siege. In May Masséna tried to relieve Almeida and was beaten at Fuentes de Oñoro, and twelve days later, at Albuera near Badajoz, a British, Portuguese and Spanish army under Beresford held off Soult in one of the bloodiest battles of the war. In the east Marshal Suchet stormed Tarragona in June, massacring defenders and townspeople, and took Valencia in January 1812. Napoleon annexed Catalonia to France that same month.": "Avec le Portugal libre, Wellington se tourna vers les forteresses frontalières qui gardaient les routes vers l’Espagne, Ciudad Rodrigo et Almeida dans le nord et Badajoz dans le sud. En mars 1811, une force britannique et espagnole de Cadix a gagné un combat sanglant à Barrosa mais n’a pas réussi à lever le siège. En mai, Masséna tenta de soulager Almeida et fut battu à Fuentes de Oñoro, et douze jours plus tard, à Albuera près de Badajoz, une armée britannique, portugaise et espagnole sous Beresford retint Soult dans l’une des batailles les plus sanglantes de la guerre. Napoléon a annexé la Catalogne à la France le même mois."
"All over Spain guerrilla bands such as those of Francisco Espoz y Mina in Navarre and Juan Martín Díez, “El Empecinado”, in Castile ambushed convoys, killed couriers and stragglers, and tied down tens of thousands of French troops; the French answered with hostage-taking, hangings and burned villages. In January 1812 Wellington stormed Ciudad Rodrigo. On the night of 6 April his troops stormed the breaches of Badajoz, losing some 4,800 men in a few hours. Maddened, they then sacked the town for three days, raping, looting and killing its Spanish inhabitants.": "Dans toute l’Espagne, des groupes de guérilla comme ceux de Francisco Espoz y Mina en Navarre et Juan Martín Díez, en Castille, ont embusqué des convois, tué des coursiers et des traînards et attaché des dizaines de milliers de troupes françaises ; les Français ont répondu par des prises d’otages, des pendaisons et des villages brûlés. Dans la nuit du 6 avril, ses troupes ont pris d’assaut les brèches de Badajoz, perdant quelque 4 800 hommes en quelques heures. Maddened, ils ont ensuite renvoyé la ville pendant trois jours, violant, pillant et tuant ses habitants espagnols."
"Battle of Fuentes de Oñoro": "Bataille de Fuentes de Oñoro"
"3–5 May 1811, Anglo-Portuguese victory": "3-5 mai 1811, victoire anglo-portugaise"
"Battle of Albuera": "Bataille d’Albuera"
"16 May 1811, allied victory": "16 mai 1811, victoire alliée"
"Storming of Badajoz": "Tempête de Badajoz"
"6 April 1812": "6 avril 1812"
"Battle of Barrosa": "Bataille de Barrosa"
"5 March 1811": "5 mars 1811"
"Sir Thomas Graham’s single division beat two French divisions and took a French eagle, but the Spanish commander did not follow up.": "La division unique de Sir Thomas Graham a battu deux divisions françaises et pris un aigle français, mais le commandant espagnol n’a pas suivi."
"3–5 May 1811": "3–5 mai 1811"
"Wellington held the village and ridge against Masséna’s attempt to relieve Almeida. “If Boney had been there, we should have been beat,” he said.": "Wellington tenait le village et la crête contre Masséna's tentative de soulager Almeida. -Si Boney avait été là, nous aurions dû être battus, , a-t-il dit."
"16 May 1811": "16 mai 1811"
"Polish lancers cut a British brigade to pieces in a hailstorm. Each side lost some 6,000 men.": "Les lanceurs polonais coupèrent une brigade britannique en morceaux dans une tempête de grêle. Chaque côté perdit quelque 6 000 hommes."
"Tarragona": "Tarragone"
"5 May – 29 June 1811": "5 mai – 29 juin 1811"
"Suchet won a marshal’s baton for taking the city. In the final assault his men killed some 450 women and children.": "Suchet a gagné un maréchal pour avoir pris la ville. Lors de l’assaut final ses hommes ont tué quelque 450 femmes et enfants."
"Ciudad Rodrigo": "Ciudad Rodrigo"
"7–19 January 1812": "7–19 janvier 1812"
"Stormed by night after a twelve-day siege. Two British generals, Craufurd and Mackinnon, were killed.": "Deux généraux britanniques, Craufurd et Mackinnon, furent tués."
"Badajoz": "Badajoz"
"16 March – 6 April 1812": "16 mars – 6 avril 1812"
"One of the bloodiest sieges of the Napoleonic Wars, followed by a sack that took three days to bring under control.": "Un des sièges les plus sanglants des guerres napoléoniennes, suivi d’un sac qui a pris trois jours pour prendre le contrôle."
"Suchet": "Telet"
"Annexed to France, 1812–1814": "Annexe à la France, 1812–1814"
"Salamanca and Madrid": "Salamanque et Madrid"
"March – November 1812": "mars – novembre 1812"
"On 19 March 1812 the Cortes at Cádiz proclaimed a constitution, nicknamed “La Pepa” after the feast of St Joseph. It declared the sovereignty of the nation, divided the powers of government, freed the press and gave the vote to most men, though it kept Catholicism as the only lawful religion. In the summer, with Napoleon’s best troops gone to Russia, Wellington advanced into León. At the Arapiles south of Salamanca on 22 July he caught Marshal Marmont’s army strung out on the march and broke it in a few hours, the victory that made his reputation as an attacking general.": "Le 19 mars 1812, les Cortes de Cadix proclamèrent une constitution, surnommée « La Pepa » après la fête de saint Joseph. Elle déclara la souveraineté de la nation, divisa les pouvoirs du gouvernement, libéra la presse et donna le vote à la plupart des hommes, bien qu’elle conservât le catholicisme comme seule religion légale. Aux Arapiles au sud de Salamanque, le 22 juillet, il a pris l’armée du maréchal Marmont et l’a brisée en quelques heures, victoire qui a fait sa réputation de général attaquant."
"Joseph fled Madrid, and Wellington entered the capital on 12 August to wild celebrations. The French gave up the siege of Cádiz on 24 August and evacuated Andalusia. But Wellington then failed to take the castle of Burgos in a month-long siege, and with French armies converging on him from north and south he had to abandon Madrid and retreat to the Portuguese border in November. The retreat in the autumn rain cost him thousands of men. Still, the year had cleared the French from southern Spain for good.": "Joseph s’enfuit de Madrid, et Wellington entra dans la capitale le 12 août pour des célébrations sauvages. Les Français abandonnèrent le siège de Cadix le 24 août et évacuèrent l’Andalousie. Mais Wellington échoua alors à prendre le château de Burgos dans un mois de siège, et avec les armées françaises convergeant sur lui du nord et du sud il dut abandonner Madrid et se replier vers la frontière portugaise en novembre. La retraite dans la pluie d’automne lui coûta des milliers d’hommes. Pourtant, l’année avait permis aux Français de quitter le sud de l’Espagne pour de bon."
"Constitution of Cádiz": "Constitution de Cádiz"
"19 March 1812": "19 mars 1812"
"Battle of Salamanca": "Bataille de Salamanque"
"22 July 1812, Anglo-Portuguese victory": "22 juillet 1812, victoire anglo-portugaise"
"Siege of Burgos": "Siège de Burgos"
"19 September – 21 October 1812, failed": "19 septembre – 21 octobre 1812, échoué"
"One of the most liberal constitutions of its time, and a model for liberals across Europe and Latin America.": "Une des constitutions les plus libérales de son temps, et un modèle pour les libéraux en Europe et en Amérique latine."
"22 July 1812": "22 juillet 1812"
"Known in Spain and France as the Battle of the Arapiles, after two hills on the battlefield. Marmont was wounded early in the battle.": "Connu en Espagne et en France comme la bataille des Arapiles, après deux collines sur le champ de bataille. Marmont a été blessé au début de la bataille."
"12 August 1812": "12 août 1812"
"The allies were greeted with flowers and cheering crowds. They held the city for less than three months.": "Les alliés ont été accueillis avec des fleurs et des foules encourageantes. Ils ont tenu la ville pendant moins de trois mois."
"Burgos": "Les bourgeons"
"19 September – 21 October 1812": "19 septembre – 21 octobre 1812"
"General Dubreton’s small garrison beat off every assault on the castle. Wellington lacked heavy guns.": "La petite garnison du général Dubreton a battu chaque assaut sur le château. Wellington manque de fusils lourds."
"Retreat, November 1812": "Retraite, novembre 1812"
"Vitoria and San Sebastián": "Vitoria et San Sebastián"
"May – September 1813": "mai – septembre 1813"
"In the spring of 1813 Napoleon, rebuilding his armies after Russia, drew men out of Spain. On 22 May Wellington, now commanding Spanish as well as British and Portuguese troops, advanced again. While he marched on Salamanca, the left wing under Sir Thomas Graham crossed the mountains of Trás-os-Montes, and the allies turned the French out of every line they tried to hold. On 21 June they caught King Joseph’s armies at Vitoria and broke them. The French lost 151 of their guns and their whole baggage train, “the loot of a kingdom”, which many British soldiers stopped to plunder instead of pursuing.": "Au printemps de 1813, Napoléon, rebâtissant ses armées après la Russie, tira des hommes d’Espagne. Le 22 mai, Wellington, qui commandait les troupes espagnoles ainsi que britanniques et portugaises, avança à nouveau. Pendant qu’il marchait sur Salamanque, l’aile gauche sous sir Thomas Graham traversait les montagnes de Trás-os-Montes, et les alliés tournaient les Français hors de chaque ligne qu’ils essayaient de tenir. Le 21 juin, ils ont pris les armées du roi Joseph à Vitoria et les ont brisés. Les Français ont perdu 151 de leurs armes et leur train de bagages entier, le butin d’un royaume, que de nombreux soldats britanniques se sont arrêtés à piller au lieu de poursuivre."
"The French fell back over the Pyrenees, leaving garrisons in San Sebastián and Pamplona. At the end of July Marshal Soult, sent to restore the situation, struck through the passes of Maya and Roncesvalles to relieve Pamplona, but was beaten back at Sorauren on 28 and 30 July. On 31 August, the day Spanish troops beat off a last French relief attempt at San Marcial, the British and Portuguese stormed San Sebastián. They then sacked and burned the town, killing perhaps 1,000 of its people. The castle held out until 8 September.": "Les Français sont tombés au-dessus des Pyrénées, laissant des garnisons à San Sebastián et Pampelune. Fin juillet, le maréchal Soult, envoyé pour rétablir la situation, a frappé par les cols de Maya et Roncesvalles pour soulager Pampelune, mais a été battu à Sorauren les 28 et 30 juillet. Le 31 août, le jour où les troupes espagnoles ont battu une dernière tentative de secours française à San Marcial, les Britanniques et les Portugais ont pris la fuite de San Sebastián. Ils ont ensuite saccagé et brûlé la ville, tuant peut-être 1 000 personnes."
"Battle of Vitoria": "Bataille de Vitoria"
"21 June 1813, allied victory": "21 juin 1813, victoire alliée"
"Battle of Sorauren": "Bataille de Sorauren"
"28 and 30 July 1813, allied victory": "28 et 30 juillet 1813, victoire alliée"
"San Sebastián stormed": "San Sebastián a pris la fuite"
"31 August 1813": "31 août 1813"
"21 June 1813": "21 juin 1813"
"The allies attacked in four columns across the Zadorra. Joseph barely escaped, and the French lost some 8,000 men and almost all their artillery.": "Les alliés attaquèrent dans quatre colonnes à travers la Zadorra. Joseph s’échappa à peine, et les Français perdirent quelque 8 000 hommes et presque toute leur artillerie."
"28 and 30 July 1813": "28 et 30 juillet 1813"
"The French attacked uphill against Wellington’s position on the Oricain ridge, a few miles from Pamplona, and failed.": "Les Français attaquèrent la montée contre Wellington sur la crête d’Oricain, à quelques kilomètres de Pampelune, et échouèrent."
"San Sebastián": "San Sebastián"
"7 July – 8 September 1813": "7 juillet – 8 septembre 1813"
"The breach was stormed at low tide. In the sack that followed almost the whole town burned.": "La brèche a été envahie à marée basse. Dans le sac qui a suivi presque toute la ville a brûlé."
"Battle of San Marcial": "Bataille de San Marcial"
"Spanish troops under General Freire threw back Soult’s last attempt to relieve San Sebastián.": "Les troupes espagnoles du général Freire ont repoussé la dernière tentative de Soult, pour soulager San Sebastián."
"Graham": "M. Graham"
"Into France": "En France"
"October 1813 – April 1814": "octobre 1813 – avril 1814"
"On 7 October Wellington crossed the Bidasoa into France, and on 31 October the starving French garrison of Pamplona surrendered. Soult was driven from his lines on the Nivelle on 10 November and from those south of Bayonne on the Nive in December. Napoleon, losing in Germany, released Ferdinand VII by the Treaty of Valençay in December, hoping to make peace with Spain, but the Regency refused to ratify it. In February 1814 Wellington left a corps to besiege Bayonne and pushed east, beating Soult at Orthez on 27 February, and on 12 March a British force entered Bordeaux, whose mayor declared for Louis XVIII.": "Le 7 octobre, Wellington traversa la Bidasoa en France et le 31 octobre, la garnison française affamée de Pampelune se rendit. Soult fut chassé de ses lignes sur la Nivelle le 10 novembre et de celles du sud de Bayonne sur la Nive en décembre. Napoléon, perdant en Allemagne, libéra Ferdinand VII par le traité de Valençay en décembre, espérant faire la paix avec l’Espagne, mais la Regency refusa de la ratifier. En février 1814 Wellington quitta un corps pour assiéger Bayonne et poussa vers l’est, battant Soult à Orthez le 27 février, et le 12 mars une force britannique entra à Bordeaux, dont le maire déclara pour Louis XVIII."
"Soult made his last stand at Toulouse. On 10 April Wellington took the heights east of the city after a bloody fight, and Soult withdrew. Napoleon had already abdicated on 6 April, but the news reached the armies only on 12 April. Two days later the garrison of Bayonne made a sortie that cost both sides hundreds of men. Soult accepted an armistice on 17 April. Ferdinand came back to Spain in March and on 4 May annulled the constitution of Cádiz, restored absolute rule and had the leading liberals arrested.": "Le 10 avril Wellington prit les hauteurs à l’est de la ville après un combat sanglant, et Soult se retira. Napoléon avait déjà abdiqué le 6 avril, mais la nouvelle n’arriva que le 12 avril. Deux jours plus tard, la garnison de Bayonne fit une sortie qui coûtait aux deux côtés des centaines d’hommes. Soult accepta un armistice le 17 avril. Ferdinand est revenu en Espagne en mars et le 4 mai a annulé la constitution de Cadix, rétabli le régime absolu et fait arrêter les principaux libéraux."
"Battle of the Nivelle": "Bataille de la Nivelle"
"10 November 1813, allied victory": "10 novembre 1813, victoire alliée"
"Battle of Orthez": "Bataille d’Orthez"
"27 February 1814, allied victory": "27 février 1814, victoire alliée"
"Battle of Toulouse": "Bataille de Toulouse"
"10 April 1814": "10 avril 1814"
"Battle of the Bidasoa": "Bataille de la Bidasoa"
"7 October 1813": "7 octobre 1813"
"Wellington’s army forded the river near its mouth at low tide and took the French positions on the heights beyond, setting foot on French soil.": "L’armée de Wellington ferma la rivière près de son embouchure à marée basse et prit les positions françaises sur les hauteurs au-delà, mettant le pied sur le sol français."
"Pamplona": "Pampelune"
"31 October 1813": "31 octobre 1813"
"A Spanish army had blockaded the city since June. Its French garrison surrendered when its food ran out.": "Une armée espagnole a bloqué la ville depuis juin. Sa garnison française s’est rendue quand sa nourriture est épuisée."
"10 November 1813": "10 novembre 1813"
"The allies broke through Soult’s fortified line between the mountains and the sea.": "Les alliés ont franchi la ligne fortifiée de Soult entre les montagnes et la mer."
"27 February 1814": "27 février 1814"
"Soult’s centre and left gave way, and his retreat ended in a rush in which many French soldiers were captured.": "Le centre et la gauche de Soult ont cédé, et sa retraite s’est terminée dans une ruée où de nombreux soldats français ont été capturés."
"Fought four days after Napoleon’s abdication. The allies lost almost 3,000 more men than the French, but Soult left the city to them.": "Quatre jours après l’abdication de Napoléon, les alliés ont perdu près de 3 000 hommes de plus que les Français, mais Soult leur a laissé la ville."
"Bayonne": "Bayonne"
"February – April 1814": "février – avril 1814"
"The garrison’s sortie of 14 April, after news of the abdication had arrived, was the last battle of the war.": "La sortie de la garnison du 14 avril, après l’arrivée des nouvelles de l’abdication, fut la dernière bataille de la guerre."
"Beresford": "Beresford"
"Peninsular War (National Army Museum)": "Guerre d’Espagne et du Portugal (National Army Museum)"
