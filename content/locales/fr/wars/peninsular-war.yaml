"In January 1810 the French overran Andalusia and took Seville on 1 February. The Spanish government fled to Cádiz, on its island off the coast, and from 5 February the French besieged it, but with British and Spanish ships holding the sea, they could not take it. Napoleon now sent Marshal Masséna with some 65,000 men to drive the British out of Portugal. Masséna took Ciudad Rodrigo in July, and at Almeida on 26 August a shell set off the great powder magazine, killing some 600 defenders and forcing the fortress to surrender. At Bussaco on 27 September Wellington beat off Masséna’s attacks, then fell back towards Lisbon, ordering the country to be stripped of food as he went.": "En janvier 1810, les Français envahirent l’Andalousie et emmenèrent Séville le 1er février. Le gouvernement espagnol s’enfuit à Cadix, sur son île au large de la côte, et à partir du 5 février, les Français l’assiégeaient, mais avec des navires britanniques et espagnols tenant la mer, ils ne pouvaient pas le prendre. Napoléon envoya maintenant le maréchal Masséna avec quelque 65 000 hommes pour chasser les Britanniques hors du Portugal. Masséna a pris Ciudad Rodrigo en juillet, et à Almeida le 26 août un obus a déclenché le grand magazine de poudre, tuant quelque 600 défenseurs et forçant la forteresse à se rendre. À Bussaco le 27 septembre Wellington a battu les attaques de Masséna, puis est retombé vers Lisbonne, ordonnant au pays d’être dépouillé de nourriture pendant qu’il allait."
"On 11 October the French came up against the Lines of Torres Vedras, chains of forts and earthworks across the peninsula north of Lisbon, built in secret by Portuguese labourers through the past year. Masséna judged them too strong to attack. His army starved in front of them through the winter, foraging in a land already emptied, while Portuguese refugees behind the lines also died in great numbers. In March 1811 Masséna retreated, burning towns as he went, having lost some 25,000 men in Portugal.": "Le 11 octobre, les Français montèrent contre les Lignes de Torres Vedras, chaînes de forts et d’ouvrages à travers la péninsule au nord de Lisbonne, construites en secret par des ouvriers portugais au cours de l’année écoulée. Masséna les jugeait trop fortes pour attaquer. Son armée les a privés de faim durant l’hiver, se nourrissant dans une terre déjà vidée, tandis que les réfugiés portugais derrière les lignes moururent également en grand nombre. En mars 1811, Masséna s’enfuit et brûla les villes au fur et à mesure qu’il allait, après avoir perdu quelque 25 000 hommes au Portugal."
