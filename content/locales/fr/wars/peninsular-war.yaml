"May – December 1808": "mai – décembre 1808"
"The news from Madrid and Bayonne set Spain alight. Provincial juntas sprang up and declared war on France, and in June Portugal rose too. Zaragoza beat off a French siege through the summer. In Andalusia, General Dupont was surrounded at Bailén by General Castaños’s army, and on 22 July he surrendered with some 17,000 men, the first time a Napoleonic army had surrendered in open battle. Joseph fled Madrid after eleven days as king, and the French fell back behind the Ebro. In August a British army under Sir Arthur Wellesley landed in Portugal and beat Junot at Roliça and Vimeiro, but by the Convention of Cintra Junot’s army was shipped home to France in British ships.": "Les nouvelles de Madrid et Bayonne ont mis l’Espagne en lumière. Des juntes provinciales sont apparues et ont déclaré la guerre à la France, et en juin le Portugal s’est aussi levé. Saragosse a battu un siège français pendant l’été. En Andalousie, le général Dupont a été entouré à Bailén par l’armée du général Castaños, et le 22 juillet il s’est rendu avec quelque 17 000 hommes, la première fois qu’une armée napoléonienne s’était rendue dans une bataille ouverte. Joseph a fui Madrid après onze jours de roi, et les Français sont tombés derrière l’Èbre. En août une armée britannique sous sir Arthur Wellesley atterrit au Portugal et bat Junot à Roliça et Vimeiro, mais par la Convention de Cintra Junot est expédiée en France dans des navires britanniques."
"In the autumn Napoleon came to Spain himself with some 200,000 men, including much of his veteran Grande Armée. He scattered the badly coordinated Spanish armies one after another, and on 30 November forced the pass of Somosierra, where Polish light horse of the Imperial Guard charged straight up the road at the Spanish guns. Madrid surrendered on 4 December. Napoleon abolished the Inquisition and the feudal rights of the nobility, and put Joseph back on the throne. The prisoners of Bailén, promised repatriation, were instead held on the barren island of Cabrera in the Balearics, where thousands died.": "À l’automne, Napoléon vint en Espagne lui-même avec quelque 200 000 hommes, dont une grande partie de son vétéran Grande Armée. Il dispersa les armées espagnoles mal coordonnées l’une après l’autre et, le 30 novembre, força le passage de Somosierra, où le cheval léger polonais de la Garde impériale chargea la route aux canons espagnols. Madrid se rendit le 4 décembre. Napoléon abolit l’Inquisition et les droits féodaux de la noblesse, et remit Joseph sur le trône. Les prisonniers de Bailén, promis de rapatrier, ont plutôt été détenus sur l’île stérile de Cabrera dans les Baléares, où des milliers sont morts."
