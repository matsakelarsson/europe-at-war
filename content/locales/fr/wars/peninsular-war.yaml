"A British army under Sir John Moore had advanced from Portugal into León to help the Spanish, and on 21 December its cavalry routed a French force at Sahagún. When Moore learned that Madrid had fallen and that Napoleon was marching north to cut him off, he turned back towards the coast of Galicia. The retreat through the snowbound mountains became an ordeal. Discipline broke down, soldiers looted and drank, and stragglers by the hundred were left to the French cavalry. Napoleon followed as far as Astorga and then handed the pursuit to Marshal Soult, leaving for France to deal with Austria.": "Une armée britannique sous Sir John Moore avait avancé du Portugal vers León pour aider les Espagnols, et le 21 décembre sa cavalerie a conduit une force française à Sahagún. Lorsque Moore apprit que Madrid était tombé et que Napoléon marchait au nord pour l’égorger, il retourna vers la côte de Galice. La retraite à travers les montagnes enneigées devint une épreuve. La discipline s’est effondrée, les soldats ont pillé et bu, et les traînards par cent ont été laissés à la cavalerie française. Napoléon a suivi jusqu’à Astorga puis a remis la poursuite au maréchal Soult, laissant la France pour traiter avec l’Autriche."
"Moore’s army reached Corunna on 11 January 1809, and when the transports arrived it began to embark. On 16 January Soult attacked, and was beaten off outside the town. Moore was mortally wounded by a cannonball and buried on the ramparts, and the army, some 26,000 men, sailed home that night and the next day; about 7,000 had been lost on the campaign. In Aragon the French had besieged Zaragoza again since 20 December. Its defenders held out street by street, while typhus raged in the city, until 20 February. By then a large part of the city lay in ruins, and some estimates put the dead, soldiers and civilians together, at over 50,000.": "L’armée de Moore atteignit Corunna le 11 janvier 1809, et quand les transports arrivèrent, elle commença à s’embarquer. Le 16 janvier, Soult attaqua et fut battue hors de la ville. Moore fut mortellement blessé par un boulet de canon et enterré sur les remparts, et l’armée, quelque 26 000 hommes, rentra chez elle cette nuit-là et le lendemain ; environ 7 000 personnes avaient été perdues lors de la campagne. En Aragon, les Français assiégeaient de nouveau Zaragoza depuis le 20 décembre. Ses défenseurs tenaient rue par rue, tandis que le typhus faisait rage dans la ville, jusqu’au 20 février. Une grande partie de la ville était alors en ruines, et certaines estimations mettaient les morts, les soldats et les civils ensemble, à plus de 50 000."
