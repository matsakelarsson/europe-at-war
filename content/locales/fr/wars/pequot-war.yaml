# French translations of the catalogue text (wave 14); step bodies follow later.
Pequot War: Guerre des Pequots
? A war between the Pequot, the strongest nation of what is now eastern Connecticut, and the English colonies of Massachusetts Bay, Plymouth and Connecticut, with the Mohegan under Uncas and the Narragansett as their allies. After years of rivalry over the trade in furs and wampum, the killing of two English traders, John Stone in 1634 and John Oldham in 1636, led Massachusetts to send John Endecott to burn villages on Block Island and on the Pequot coast in August 1636. The Pequot besieged Fort Saybrook and raided the Connecticut River towns. On 26 May 1637 a force under John Mason and John Underhill, with Mohegan and Narragansett warriors, set fire to the fortified Pequot town on the Mystic River and killed most of the people inside; estimates of the dead, most of them women, children and old people, range from 400 to 700. The surviving Pequot fled west and were defeated near Fairfield in July; their sachem Sassacus was killed by the Mohawk. Hundreds of captives were enslaved in New England or shipped to Bermuda and the West Indies, and the Treaty of Hartford in 1638 divided the survivors between the Mohegan and the Narragansett and forbade them to call themselves Pequot. The Mashantucket and Eastern Pequot nations survive today.
: Une guerre entre les Pequots, la nation la plus puissante de ce qui est aujourd’hui l’est du Connecticut, et les colonies anglaises de la baie du Massachusetts, de Plymouth et du Connecticut, alliées aux Mohegans d’Uncas et aux Narragansetts. Après des années de rivalité pour le commerce des fourrures et du wampum, le meurtre de deux marchands anglais, John Stone en 1634 et John Oldham en 1636, conduisit le Massachusetts à envoyer John Endecott incendier des villages sur Block Island et sur la côte des Pequots en août 1636. Les Pequots assiégèrent Fort Saybrook et lancèrent des raids contre les villes de la vallée du Connecticut. Le 26 mai 1637, une troupe commandée par John Mason et John Underhill, accompagnée de guerriers mohegans et narragansetts, mit le feu au village fortifié des Pequots sur la Mystic et tua la plupart de ses occupants ; les estimations du nombre de morts, pour la plupart des femmes, des enfants et des vieillards, vont de 400 à 700. Les Pequots survivants s’enfuirent vers l’ouest et furent vaincus près de Fairfield en juillet ; leur sachem Sassacus fut tué par les Mohawks. Des centaines de captifs furent réduits en esclavage en Nouvelle-Angleterre ou envoyés aux Bermudes et aux Antilles, et le traité de Hartford de 1638 répartit les survivants entre les Mohegans et les Narragansetts et leur interdit de se dire Pequots. Les nations des Pequots de Mashantucket et des Pequots de l’Est existent toujours aujourd’hui.
