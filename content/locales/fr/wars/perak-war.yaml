# French translations of the catalogue text (wave 11); step bodies follow later.
Perak War: Guerre du Perak
? A brief war in the Malay state of Perak that followed the killing of the first British Resident, J. W. W. Birch, at Pasir Salak on 2 November 1875. Under the Pangkor Engagement of January 1874, the British had recognised Raja Abdullah as sultan over his rival Raja Ismail, and Abdullah had accepted a Resident whose advice he was bound to follow except in matters of religion and Malay custom. Birch’s attempts to take over the collection of taxes, to free debt-bondsmen and to rule through proclamations angered the sultan and the chiefs, who agreed in July 1875 that he should be removed; followers of the Maharaja Lela speared him in his bath-house on the Perak River. The British brought troops from the Straits, India and Hong Kong, took Pasir Salak on 15 November 1875 after a first attack had failed, and broke the resistance along the Perak River in the following months. The Maharaja Lela surrendered in July 1876 and was hanged at Matang with the Dato’ Sagor on 20 January 1877; Sultan Abdullah, the Mantri of Larut and other chiefs were exiled to the Seychelles. Perak remained under a British Resident, and the war fixed the pattern of British rule through Residents in the Malay states.
: Une brève guerre dans l’État malais du Perak, consécutive au meurtre du premier résident britannique, J. W. W. Birch, à Pasir Salak le 2 novembre 1875. Par l’engagement de Pangkor de janvier 1874, les Britanniques avaient reconnu Raja Abdullah comme sultan au détriment de son rival Raja Ismail, et Abdullah avait accepté un résident dont il était tenu de suivre les avis, sauf en matière de religion et de coutume malaise. Les tentatives de Birch pour prendre en main la perception des impôts, libérer les personnes réduites en servitude pour dettes et gouverner par proclamations irritèrent le sultan et les chefs, qui convinrent en juillet 1875 qu’il fallait l’écarter ; des partisans du Maharaja Lela le tuèrent à coups de lance dans sa maison de bains, au bord de la rivière Perak. Les Britanniques firent venir des troupes des Établissements des détroits, de l’Inde et de Hong Kong, prirent Pasir Salak le 15 novembre 1875 après l’échec d’une première attaque, et brisèrent la résistance le long de la rivière Perak dans les mois qui suivirent. Le Maharaja Lela se rendit en juillet 1876 et fut pendu à Matang avec le Dato’ Sagor le 20 janvier 1877 ; le sultan Abdullah, le Mantri de Larut et d’autres chefs furent exilés aux Seychelles. Le Perak resta sous l’autorité d’un résident britannique, et la guerre fixa le modèle de la domination britannique exercée par des résidents dans les États malais.
