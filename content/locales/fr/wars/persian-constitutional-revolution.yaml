# French translations of the catalogue text (wave 7); step bodies follow later.
Persian Constitutional Revolution: Révolution constitutionnelle persane
The revolution that gave Iran its first constitution and parliament, and the civil war that followed. Protests by merchants, clerics and reformers forced Mozaffar ad-Din Shah to grant an elected assembly (Majlis) in 1906. His son Mohammad Ali Shah had the Majlis shelled in 1908, but Tabriz held out through a long siege, and in 1909 constitutionalist forces from Gilan and the Bakhtiari tribes took Tehran and deposed him. Russian intervention, with British acquiescence, ended the revolutionary period in December 1911.: La révolution qui donna à l’Iran sa première constitution et son premier parlement, et la guerre civile qui suivit. Les protestations des marchands, des religieux et des réformateurs obligèrent Mozaffar ad-Din Shah à accorder une assemblée élue (Majlis) en 1906. Son fils Mohammad Ali Shah fit bombarder le Majlis en 1908, mais Tabriz tint bon pendant un long siège, et en 1909 les forces constitutionnalistes venues du Gilan et les tribus bakhtiaries prirent Téhéran et le déposèrent. L’intervention russe, avec l’assentiment britannique, mit fin à la période révolutionnaire en décembre 1911.
