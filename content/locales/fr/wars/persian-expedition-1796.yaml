# Some French text was translated automatically.
"Persian Expedition of 1796": "Expédition perse de 1796"
"In September 1795 Agha Mohammad Khan Qajar, who was restoring Persian rule over the Caucasus, defeated King Erekle II of Kartli-Kakheti at Krtsanisi and sacked Tbilisi, because Erekle had placed eastern Georgia under Russian protection in the Treaty of Georgievsk (1783). The city was burned, many of its people were massacred and some 15,000 captives were carried off to Persia, while Russia sent no help. In 1796 Catherine the Great sent an army under Count Valerian Zubov, which stormed Derbent in May and occupied Baku, Shamakhi and Ganja without a fight, but after Catherine’s death in November Emperor Paul recalled it. Agha Mohammad Khan was murdered at Shusha in 1797, and Russia annexed eastern Georgia in 1801.": "En septembre 1795, Agha Mohammad Khan Qajar, qui rétablissait la domination persane sur le Caucase, défait le roi Erekle II de Kartli-Kakheti à Krtsanisi et renvoyait Tbilissi parce qu’Erkle avait placé la Géorgie orientale sous la protection russe dans le Traité de Georgievsk (1783). La ville fut brûlée, beaucoup de son peuple furent massacrés et quelque 15 000 captifs furent emmenés en Perse, tandis que la Russie n’envoya aucune aide.En 1796 Catherine la Grande envoya une armée sous le comte Valérian Zubov, qui prit Derbent en mai et occupa Bakou, Shamakhi et Ganja sans se battre, mais après la mort de Catherine en novembre l’oublia l’empereur Paul. Agha Mohammad Khan a été assassiné à Shusha en 1797, et la Russie a annexé l’est de la Géorgie en 1801."
"The Battle of Krtsanisi was fought on 8–11 September 1795, with the decisive attack and the fall of Tbilisi on 11 September. Numbers for the armies and the dead differ between Georgian, Persian and Russian sources.": "La bataille de Krtsanisi a été combattue les 8-11 septembre 1795, avec l’attaque décisive et la chute de Tbilissi le 11 septembre. Les chiffres pour les armées et les morts diffèrent entre les sources géorgienne, persane et russe."
"Zubov’s army set out from Kizlyar in April 1796 and had reached the junction of the Kura and the Aras by November, when Paul ordered it home.": "L’armée de Zubov est partie de Kizlyar en avril 1796 et avait atteint la jonction de la Kura et de l’Aras en novembre, lorsque Paul lui a ordonné de rentrer chez elle."
