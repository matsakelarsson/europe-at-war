# French translations of the catalogue text (wave 7); step bodies follow later.
British campaigns against the Qawasim: Campagnes britanniques contre les Qawasim
Two expeditions sent by the East India Company’s government in Bombay, with Royal Navy ships, against the Qawasim (Al Qasimi), the maritime power of Ras al-Khaimah and Sharjah on the Arabian side of the Strait of Hormuz, with branches at Lingeh and on Qeshm on the Persian side. The British accused the Qawasim of piracy against Indian and British shipping, a charge that the historian and ruler of Sharjah Sultan bin Muhammad Al Qasimi has disputed as a pretext to end Arab competition in the India trade. The 1809 expedition burnt Ras al-Khaimah, Lingeh and Laft but did not end the conflict. In 1819 a much larger force took Ras al-Khaimah and Dhayah and destroyed the forts and larger ships along the coast, and in 1820 the sheikhs signed the General Maritime Treaty, the beginning of the British protectorate over what became known as the Trucial States, today’s United Arab Emirates.: Deux expéditions envoyées par le gouvernement de la Compagnie des Indes orientales à Bombay, avec des navires de la Royal Navy, contre les Qawasim (Al Qasimi), la puissance maritime de Ras el-Khaïmah et de Charjah, sur la rive arabe du détroit d’Ormuz, qui avait des branches à Lingeh et sur l’île de Qeshm, du côté persan. Les Britanniques accusaient les Qawasim de piraterie contre la navigation indienne et britannique, accusation que l’historien et souverain de Charjah Sultan bin Muhammad Al Qasimi a contestée, y voyant un prétexte pour éliminer la concurrence arabe dans le commerce des Indes. L’expédition de 1809 incendia Ras el-Khaïmah, Lingeh et Laft sans mettre fin au conflit. En 1819, une force bien plus importante prit Ras el-Khaïmah et Dhayah et détruisit les forts et les plus grands navires le long de la côte, et en 1820 les cheikhs signèrent le traité maritime général, début du protectorat britannique sur ce que l’on appela les États de la Trêve, aujourd’hui les Émirats arabes unis.
