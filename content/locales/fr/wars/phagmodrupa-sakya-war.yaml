# French translations of the catalogue text (wave 9); step bodies follow later.
Phagmodrupa–Sakya war: Guerre entre les Phagmodrupa et les Sakya
? The struggle in which Changchub Gyaltsen, lord of the Phagmodru myriarchy in Ü, overthrew the Sakya regime that had governed Tibet for the Yuan emperors. He had fought the neighbouring Yazang myriarchy over land since the 1330s, and when he drove back a new Yazang attack in 1346, the Sakya ponchen (chief administrator) Gyalwa Zangpo lured him to a meeting at a bridge, seized him and took him to Sakya, where he was tortured; his retainers still refused to give up his castle at Nedong. Gyalwa Zangpo, who feared his rival Wangtson more, released him after some months to gain an ally. Changchub Gyaltsen beat off Wangtson’s attack and by 1349 held most of Ü, Lhasa included. In 1353 a coalition of Sakya, Drikung, Yazang and other lords attacked him and was driven back, and in 1354, when Gyalwa Zangpo asked for his help against his enemies in Tsang, Changchub Gyaltsen’s general Rinchen Zangpo won a battle on the Shab river and marched on Sakya. Fighting was halted; Sakya kept only its own lands, and most of Tsang came under Phagmodru. Tibetan tradition dates the end of Sakya rule to 1354, though feuds within Sakya went on until 1358, when Changchub Gyaltsen defeated Wangtson and left a garrison at Sakya. The Yuan court, fighting the Red Turbans, accepted the change and gave him the title tai situ in 1357. Ruling from Nedong as regent (desi), he replaced the Mongol administration with districts under castle governors (dzongpon) and revived the laws of the old Tibetan kings; the Phagmodrupa were the leading power in Tibet until the civil war of 1434.
: La lutte au cours de laquelle Changchub Gyaltsen, seigneur de la myriarchie de Phagmodru dans l’Ü, renversa le régime des Sakya, qui gouvernait le Tibet pour le compte des empereurs Yuan. Il disputait des terres à la myriarchie voisine de Yazang depuis les années 1330 et, lorsqu’il repoussa une nouvelle attaque de Yazang en 1346, le ponchen (administrateur en chef) des Sakya, Gyalwa Zangpo, l’attira à une rencontre sur un pont, se saisit de lui et l’emmena à Sakya, où il fut torturé ; ses fidèles refusèrent néanmoins de livrer son château de Nedong. Gyalwa Zangpo, qui craignait davantage son rival Wangtson, le relâcha au bout de quelques mois pour s’en faire un allié. Changchub Gyaltsen repoussa l’attaque de Wangtson et tenait en 1349 la plus grande partie de l’Ü, Lhassa comprise. En 1353, une coalition formée par Sakya, Drikung, Yazang et d’autres seigneurs l’attaqua et fut repoussée et, en 1354, lorsque Gyalwa Zangpo lui demanda son aide contre ses ennemis du Tsang, le général de Changchub Gyaltsen, Rinchen Zangpo, remporta une bataille sur la rivière Shab et marcha sur Sakya. Les combats furent suspendus ; Sakya ne conserva que ses propres terres, et la plus grande partie du Tsang passa sous l’autorité de Phagmodru. La tradition tibétaine date de 1354 la fin de la domination des Sakya, bien que les querelles internes à Sakya se soient poursuivies jusqu’en 1358, lorsque Changchub Gyaltsen vainquit Wangtson et laissa une garnison à Sakya. La cour des Yuan, aux prises avec les Turbans rouges, accepta le changement et lui conféra le titre de tai situ en 1357. Gouvernant depuis Nedong en tant que régent (desi), il remplaça l’administration mongole par des districts confiés à des gouverneurs de forteresse (dzongpon) et remit en vigueur les lois des anciens rois tibétains ; les Phagmodrupa furent la principale puissance du Tibet jusqu’à la guerre civile de 1434.
