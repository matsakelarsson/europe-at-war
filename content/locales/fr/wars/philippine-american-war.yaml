# French translations of the catalogue text (wave 11); step bodies follow later.
Philippine–American War: Guerre américano-philippine
? The war between the First Philippine Republic and the United States, which had bought the Philippines from Spain in the Treaty of Paris of December 1898. Fighting broke out around Manila on 4 February 1899, two days before the United States Senate ratified the treaty. In 1899 the American army drove the Republic’s forces from Malolos and the plain of central Luzon, took the main towns of the Visayas, and in November forced President Emilio Aguinaldo to disband his army and flee into the mountains of the north; at Tirad Pass his rearguard under Gregorio del Pilar died covering his escape. The Republic’s generals then fought a guerrilla war in their own provinces, which the Americans met with garrisons in hundreds of towns, the burning of villages, torture, and the concentration of civilians in zones where many died of hunger and disease. Aguinaldo was captured at Palanan in March 1901. After the killing of most of an American company at Balangiga on Samar in September 1901, General Jacob H. Smith ordered Samar turned into “a howling wilderness”; in Batangas General J. Franklin Bell’s reconcentration forced Miguel Malvar to surrender in April 1902. President Theodore Roosevelt declared the war over on 4 July 1902, but resistance went on for years, and the Moros of the south fought on in the Moro Rebellion. More than 4,200 American soldiers and some 16,000 to 20,000 Filipino soldiers died; modern estimates of Filipino civilian deaths, mostly from famine and disease, are around 200,000 to 250,000, with older estimates far higher.
: La guerre entre la Première République des Philippines et les États-Unis, qui avaient acheté les Philippines à l’Espagne par le traité de Paris de décembre 1898. Les combats éclatèrent autour de Manille le 4 février 1899, deux jours avant que le Sénat des États-Unis ne ratifie le traité. En 1899, l’armée américaine chassa les forces de la République de Malolos et de la plaine du centre de Luçon, prit les principales villes des Visayas et, en novembre, contraignit le président Emilio Aguinaldo à dissoudre son armée et à fuir dans les montagnes du Nord ; au col de Tirad, son arrière-garde commandée par Gregorio del Pilar périt en couvrant sa fuite. Les généraux de la République menèrent alors une guérilla dans leurs propres provinces, à laquelle les Américains répondirent par des garnisons dans des centaines de villes, l’incendie de villages, la torture et le regroupement des civils dans des zones où beaucoup moururent de faim et de maladie. Aguinaldo fut capturé à Palanan en mars 1901. Après que la plus grande partie d’une compagnie américaine eut été tuée à Balangiga, sur Samar, en septembre 1901, le général Jacob H. Smith ordonna de faire de Samar « un désert hurlant » ; dans le Batangas, la reconcentration ordonnée par le général J. Franklin Bell força Miguel Malvar à se rendre en avril 1902. Le président Theodore Roosevelt déclara la guerre terminée le 4 juillet 1902, mais la résistance se poursuivit pendant des années, et les Moros du Sud continuèrent le combat dans la rébellion moro. Plus de 4 200 soldats américains et quelque 16 000 à 20 000 soldats philippins périrent ; les estimations modernes du nombre de civils philippins morts, surtout de famine et de maladie, se situent autour de 200 000 à 250 000, et des estimations plus anciennes sont bien plus élevées.
