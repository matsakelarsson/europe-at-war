# French translations of the catalogue text (wave 11); step bodies follow later.
Philippine Revolution: Révolution philippine
? The armed revolt against Spanish rule that made the Philippines the first republic in Asia. The Katipunan, a secret society founded in Manila in 1892 by Andrés Bonifacio and others, rose in August 1896 after it was discovered. Around Manila the rising was soon contained, but in Cavite the revolutionaries held most of the province and defeated the Spanish at Binakayan in November. Spain executed the reformist writer José Rizal in December 1896 and sent reinforcements; its offensive of 1897 retook Cavite, and the rivalry between Bonifacio and Emilio Aguinaldo ended with Bonifacio’s execution in May. Aguinaldo held out at Biak-na-Bato until the pact of December 1897 sent him into exile in Hong Kong. When the United States went to war with Spain in 1898, he returned with American help after the battle of Manila Bay, his forces took most of Luzon, and on 12 June 1898 he proclaimed independence at Kawit. The Americans took Manila from the Spanish in August without letting the Filipinos in, the revolution spread to the Visayas, and in January 1899 the First Philippine Republic was inaugurated at Malolos, a month after Spain had ceded the islands to the United States in the Treaty of Paris.
: La révolte armée contre la domination espagnole qui fit des Philippines la première république d’Asie. Le Katipunan, une société secrète fondée à Manille en 1892 par Andrés Bonifacio et d’autres, se souleva en août 1896 après avoir été découvert. Autour de Manille, le soulèvement fut rapidement contenu, mais dans la province de Cavite les révolutionnaires tenaient l’essentiel du territoire et battirent les Espagnols à Binakayan en novembre. L’Espagne fit exécuter l’écrivain réformiste José Rizal en décembre 1896 et envoya des renforts ; son offensive de 1897 reprit Cavite, et la rivalité entre Bonifacio et Emilio Aguinaldo s’acheva par l’exécution de Bonifacio en mai. Aguinaldo tint bon à Biak-na-Bato jusqu’à ce que le pacte de décembre 1897 l’envoie en exil à Hong Kong. Lorsque les États-Unis entrèrent en guerre contre l’Espagne en 1898, il revint avec l’aide américaine après la bataille de la baie de Manille ; ses forces prirent la majeure partie de Luçon et, le 12 juin 1898, il proclama l’indépendance à Kawit. Les Américains prirent Manille aux Espagnols en août sans y laisser entrer les Philippins, la révolution gagna les Visayas et, en janvier 1899, la Première République des Philippines fut inaugurée à Malolos, un mois après que l’Espagne eut cédé l’archipel aux États-Unis par le traité de Paris.
