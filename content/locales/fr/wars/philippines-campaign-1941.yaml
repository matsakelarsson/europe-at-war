# French translations of the catalogue text (wave 11); step bodies follow later.
Philippines campaign (1941–1942): Campagne des Philippines (1941–1942)
? Japan’s conquest of the Philippines, then a self-governing Commonwealth under American sovereignty, promised independence in 1946. Hours after the attack on Pearl Harbor, Japanese bombers from Formosa destroyed much of the American air force in the islands on the ground at Clark Field on 8 December 1941. The Japanese 14th Army under Lieutenant General Homma Masaharu landed in northern Luzon and on 22 December at Lingayen Gulf, and General Douglas MacArthur withdrew his United States Army Forces in the Far East (USAFFE), most of them Filipino soldiers, to the Bataan peninsula and the island fortress of Corregidor, leaving Manila an open city. Short of food and medicine and with no hope of relief, the defenders of Bataan held out until 9 April 1942, when some 76,000 Filipino and American soldiers surrendered, the largest surrender in American history; thousands of them died on the Bataan Death March. Corregidor fell on 6 May, and the last forces in the southern islands surrendered by early June. Many Filipino soldiers who escaped the surrender became guerrillas, and the islands stayed under Japanese occupation until the American return in October 1944.
: La conquête japonaise des Philippines, alors Commonwealth autonome sous souveraineté américaine, auquel l’indépendance avait été promise pour 1946. Quelques heures après l’attaque de Pearl Harbor, le 8 décembre 1941, des bombardiers japonais venus de Formose détruisirent au sol, à Clark Field, une grande partie de l’aviation américaine stationnée dans l’archipel. La 14e armée japonaise du lieutenant-général Homma Masaharu débarqua dans le nord de Luçon, puis, le 22 décembre, dans le golfe de Lingayen, et le général Douglas MacArthur replia ses Forces armées des États-Unis en Extrême-Orient (USAFFE), composées pour la plupart de soldats philippins, dans la péninsule de Bataan et sur l’île-forteresse de Corregidor, laissant Manille ville ouverte. Manquant de vivres et de médicaments et sans espoir de secours, les défenseurs de Bataan tinrent jusqu’au 9 avril 1942, date à laquelle quelque 76 000 soldats philippins et américains se rendirent, la plus grande reddition de l’histoire américaine ; des milliers d’entre eux moururent lors de la marche de la mort de Bataan. Corregidor tomba le 6 mai, et les dernières forces des îles du Sud capitulèrent au début de juin. Beaucoup de soldats philippins qui avaient échappé à la reddition devinrent des guérilleros, et l’archipel resta sous occupation japonaise jusqu’au retour des Américains en octobre 1944.
