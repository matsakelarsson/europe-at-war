# French translations of the catalogue text (wave 11); step bodies follow later.
Philippines campaign (1944–1945): Campagne des Philippines (1944–1945)
? The American and Filipino reconquest of the Philippines from Japan. On 20 October 1944 the US Sixth Army landed on Leyte, and General Douglas MacArthur, who had left in 1942 promising to return, waded ashore with President Sergio Osmeña of the Commonwealth. Japan threw its navy against the landing, and in the battle of Leyte Gulf on 23–26 October, the largest naval battle in history, the Japanese fleet was defeated and ceased to be a fighting force; the first organised kamikaze attacks were made there. After two months of fighting on Leyte, American forces landed on Mindoro in December and at Lingayen Gulf on Luzon on 9 January 1945. Manila was retaken in a month of street fighting in February, in which Japanese naval troops killed many thousands of civilians and the old city was destroyed; some 100,000 people died. While the Eighth Army and Filipino guerrillas took the southern islands, General Yamashita Tomoyuki’s army held out in the mountains of northern Luzon until Japan’s surrender, and Yamashita surrendered at Baguio on 3 September 1945. The campaign cost Japan over 300,000 dead, many of them from hunger and disease, and devastated the islands; the Philippines became independent on 4 July 1946.
: La reconquête des Philippines sur le Japon par les Américains et les Philippins. Le 20 octobre 1944, la 6e armée américaine débarqua à Leyte, et le général Douglas MacArthur, qui était parti en 1942 en promettant de revenir, gagna le rivage à pied dans l’eau avec le président du Commonwealth, Sergio Osmeña. Le Japon lança sa marine contre le débarquement, et lors de la bataille du golfe de Leyte, du 23 au 26 octobre, la plus grande bataille navale de l’histoire, la flotte japonaise fut vaincue et cessa d’être une force combattante ; c’est là que furent menées les premières attaques kamikazes organisées. Après deux mois de combats à Leyte, les forces américaines débarquèrent à Mindoro en décembre, puis dans le golfe de Lingayen, à Luçon, le 9 janvier 1945. Manille fut reprise en février au terme d’un mois de combats de rue, au cours desquels les troupes de la marine japonaise tuèrent de nombreux milliers de civils et la vieille ville fut détruite ; quelque 100 000 personnes périrent. Tandis que la 8e armée et les guérilleros philippins prenaient les îles du Sud, l’armée du général Yamashita Tomoyuki tint bon dans les montagnes du nord de Luçon jusqu’à la capitulation du Japon, et Yamashita se rendit à Baguio le 3 septembre 1945. La campagne coûta au Japon plus de 300 000 morts, dont beaucoup moururent de faim et de maladie, et dévasta l’archipel ; les Philippines devinrent indépendantes le 4 juillet 1946.
