# Some French text was translated automatically.
"Piedmontese Revolution of 1821": "Révolution piémontaise de 1821"
"A short-lived liberal revolution in the Kingdom of Sardinia. On 10 March 1821 officers led by Count Santorre di Santarosa raised the garrison of Alessandria, demanding the Spanish constitution of 1812 and war with Austria, and Turin followed two days later. King Victor Emmanuel I abdicated in favour of his brother Charles Felix, who was away in Modena, and the young regent, Prince Charles Albert, proclaimed the constitution. Charles Felix disowned it and ordered Charles Albert to leave. Loyal troops under General Vittorio Sallier de La Tour, with an Austrian corps under Ferdinand von Bubna, defeated the constitutionalists near Novara on 8 April 1821, and Austrian troops occupied Alessandria until 1823. Santarosa and many others went into exile; he was killed fighting for Greek independence in 1825.": "Une révolution libérale de courte durée dans le royaume de Sardaigne. Le 10 mars 1821, des officiers dirigés par le comte Santorre di Santarosa élevèrent la garnison d’Alessandria, exigeant la constitution espagnole de 1812 et la guerre avec l’Autriche, et Turin suivit deux jours plus tard. Charles Felix le renonça et ordonna à Charles Albert de partir. Des troupes loyalistes sous la direction du général Vittorio Sallier de La Tour, avec un corps autrichien sous Ferdinand von Bubna, défont les constitutionnalistes près de Novara le 8 avril 1821, et des troupes autrichiennes occupèrent Alessandria jusqu’en 1823. Santarosa et beaucoup d’autres se rendirent en exil ; il fut tué pour l’indépendance grecque en 1825."
"The revolution was one of several in southern Europe in 1820–1821, with those in Spain, Portugal and Naples.": "La révolution fut l’une des plus nombreuses en Europe du Sud en 1820–1821, avec celles d’Espagne, du Portugal et de Naples."
