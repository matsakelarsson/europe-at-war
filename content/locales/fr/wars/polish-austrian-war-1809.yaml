"April – May 1809": "avril – mai 1809"
"When Austria went to war with Napoleon in April 1809, it sent Archduke Ferdinand of Austria-Este with an army corps into the Duchy of Warsaw, the Polish state Napoleon had created two years earlier. On 19 April Prince Józef Poniatowski met him at Raszyn, just south-west of Warsaw, with Polish and Saxon troops numbering about half as many. The Poles held their positions along the marshy Utrata until nightfall, then withdrew, and neither side was decisively beaten.": "Lorsque l’Autriche est entrée en guerre avec Napoléon en avril 1809, elle a envoyé l’archiduc Ferdinand d’Autriche-Este avec un corps d’armée dans le duché de Varsovie, l’État polonais Napoléon avait créé deux ans plus tôt. Le 19 avril, le prince Józef Poniatowski l’a rencontré à Raszyn, juste au sud-ouest de Varsovie, avec des troupes polonaises et saxonnes comptant environ la moitié de ses effectifs. Les Polonais ont maintenu leurs positions le long de l’Utrata marécageux jusqu’à la tombée de la nuit, puis se sont retirés, et aucune des deux parties n’a été résolument battue."
"Poniatowski judged Warsaw too hard to defend. He let the Austrians occupy the capital and took his army across the Vistula, keeping it whole. On the east bank General Michał Sokolnicki beat the Austrians besieging the suburb of Praga at Grochów on 26 April, and on 2–3 May routed them at Góra Kalwaria, destroying their half-built bridge. An Austrian thrust down the Vistula towards the fortress of Toruń also came to nothing.": "Poniatowski a jugé Varsovie trop difficile à défendre. Il a laissé les Autrichiens occuper la capitale et a pris son armée à travers la Vistule, le garder entier. Sur la rive est général Michał Sokolnicki battu les Autrichiens assiégeant la banlieue de Praga à Grochów le 26 avril, et les 2-3 mai ont roué à Góra Kalwaria, détruisant leur pont semi-construit. Une poussée autrichienne sur la Vistule vers la forteresse de Toruń n’est pas non plus arrivée à rien."
