"May – October 1809": "mai – octobre 1809"
"Instead of retaking Warsaw, Poniatowski marched south-east into Austrian Galicia, the lands Austria had taken in the partitions. His troops took Lublin on 14 May, Sandomierz on 18 May and the fortress of Zamość on 20 May, and a cavalry force reached Lwów on 27 May. Archduke Ferdinand left Warsaw on 1 June and came south. He beat General Józef Zajączek at Jedlińsk on 11 June and retook Sandomierz and Lwów.": "Au lieu de reprendre Varsovie, Poniatowski marcha vers le sud-est en Galice autrichienne, les terres que l’Autriche avait prises dans les cloisons. Ses troupes prirent Lublin le 14 mai, Sandomierz le 18 mai et la forteresse de Zamość le 20 mai, et une cavalerie atteignit Lwów le 27 mai. Archduke Ferdinand quitta Varsovie le 1er juin et vint au sud. Il a battu le général Józef Zajaczek à Jedlińsk le 11 juin et a repris Sandomierz et Lwów."
"On 3 June a Russian army entered Galicia as France’s ally, though its commander, Prince Sergei Golitsyn, did little to help the Poles. After Napoleon’s victory at Wagram in early July Austria sought an armistice, and on 15 July Poniatowski entered Kraków. By the Peace of Schönbrunn on 14 October, Austria ceded West Galicia with Kraków to the Duchy of Warsaw and the Tarnopol district to Russia. The two states also shared the income of the Wieliczka salt mines.": "Le 3 juin, une armée russe entra en Galice comme allié de la France, bien que son commandant, le prince Sergei Golitsyn, n’aidât guère les Polonais. Après la victoire de Napoléon à Wagram début juillet l’Autriche cherchait un armistice, et le 15 juillet Poniatowski entra dans Cracovie. Par la paix de Schönbrunn le 14 octobre, l’Autriche a cédé la Galice occidentale avec Cracovie au duché de Varsovie et le district de Tarnopol à la Russie. Les deux États ont également partagé les revenus des mines de sel Wieliczka."
