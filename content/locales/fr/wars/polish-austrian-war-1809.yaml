# Some French text was translated automatically.
"Polish–Austrian War": "Guerre polonaise-autrichienne"
"A campaign of the War of the Fifth Coalition in which an Austrian corps invaded the Duchy of Warsaw and took its capital, while the Polish army under Prince Józef Poniatowski struck south into Austrian Galicia. At the Peace of Schönbrunn the Duchy gained West Galicia with Kraków, and Russia, nominally France’s ally, took the Tarnopol district.": "Une campagne de la guerre de la cinquième coalition dans laquelle un corps autrichien a envahi le duché de Varsovie et pris sa capitale, tandis que l’armée polonaise sous le prince Józef Poniatowski a frappé au sud en Galice autrichienne. À la paix de Schönbrunn le Duché a gagné la Galice occidentale avec Cracovie, et la Russie, nominalement Frances alliée, a pris le district de Tarnopol."
"The result of Raszyn is disputed. The Austrians took Warsaw, which was their aim; Polish historians stress that the Polish army escaped intact and went on to win the campaign.": "Le résultat de Raszyn est contesté. Les Autrichiens ont pris Varsovie, ce qui était leur but ; les historiens polonais soulignent que l’armée polonaise s’est échappée intacte et a continué à gagner la campagne."
"Russia entered the war in June 1809 as France’s ally under the Treaty of Tilsit, but its commander in Galicia had orders to help the Poles as little as possible.": "La Russie entra dans la guerre en juin 1809 comme alliée de la France sous le traité de Tilsit, mais son commandant en Galice avait pour ordre d’aider les Polonais aussi peu que possible."
