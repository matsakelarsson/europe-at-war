# Some French text was translated automatically.
"Polish–Czechoslovak War": "Guerre polonais-tchèquelovaque"
"A short war, known in Czech as the Seven-Day War, over Teschen (Cieszyn Silesia), a former Austrian duchy with valuable coal mines and the railway linking Bohemia with Slovakia. Czechoslovak troops attacked the Polish-administered part of the region on 23 January 1919, while most of Poland’s army was fighting in eastern Galicia, and advanced to the Vistula before Allied pressure stopped them on 30–31 January. About 140 soldiers were killed, and Czechoslovak troops killed some 20 Polish prisoners at Stonava. A plebiscite planned for 1920 was abandoned, and on 28 July 1920 the Allied Conference of Ambassadors divided Teschen along the Olza, leaving the coalfield and a large Polish minority in Czechoslovakia. Poland seized that part, Zaolzie, in October 1938.": "Une courte guerre, connue en tchèque comme la guerre de sept jours, au-dessus de Teschen (Cieszyn Silesia), un ancien duché autrichien avec des mines de charbon précieuses et le chemin de fer reliant la Bohême à la Slovaquie. Les troupes tchécoslovaques ont attaqué la partie de la région administrée par la Pologne le 23 janvier 1919, tandis que la plupart des troupes polonaises combattaient en Galice orientale, et se dirigeaient vers la Vistule avant que les forces alliées ne les arrêtent les 30 et 31 janvier. Un plébiscite prévu pour 1920 fut abandonné, et le 28 juillet 1920 la Conférence alliée des ambassadeurs divisa Teschen le long de l’Olza, laissant le champ de charbon et une grande minorité polonaise en Tchécoslovaquie. La Pologne prit cette partie, Zaolzie, en octobre 1938."
"Teschen is Cieszyn in Polish and Těšín in Czech. The town itself was divided in 1920, into Cieszyn in Poland and Český Těšín in Czechoslovakia. The 1920 decision also divided the small regions of Spiš and Orava between the two states.": "Teschen est Cieszyn en polonais et Těšín en tchèque. La ville elle-même a été divisée en 1920, en Cieszyn en Pologne et Český Těšín en Tchécoslovaquie. La décision de 1920 a également divisé les petites régions de Spiš et Orava entre les deux États."
"A ceasefire agreement followed in Paris on 3 February 1919, setting a new demarcation line until the final division.": "Un accord de cessez-le-feu a suivi à Paris le 3 février 1919, fixant une nouvelle ligne de démarcation jusqu’à la division finale."
