"Polish–Teutonic War, 1431–1435": "Polish–Teutonic War, 1431-1435"
"A war fought alongside the Lithuanian civil war that followed Vytautas’s death, in which the Teutonic Order backed Švitrigaila against Poland and, from 1432, against Sigismund Kęstutaitis, Poland’s ally in Lithuania. The Order ravaged the Dobrzyń Land in 1431 before being beaten at Dąbki, and in 1433 a Polish army with Hussite allies from Bohemia marched through Pomerelia to the Baltic near Gdańsk. On 1 September 1435 Sigismund and his Polish allies routed Švitrigaila and the Livonian Order at Wiłkomierz (Pabaiskas), and the Peace of Brześć Kujawski on 31 December 1435 kept the border of 1422 and bound the Order to stop meddling in Lithuania.": "Une guerre a combattu aux côtés de la guerre civile lituanienne qui a suivi la mort de Vytautas, dans laquelle l’Ordre teutonique a soutenu Švitrigaila contre la Pologne et, à partir de 1432, contre Sigismund Kęstutaitis, l’allié polonais en Lituanie. L’Ordre a ravagé la terre de Dobrzyń en 1431 avant d’être battu à Dlbki, et en 1433 une armée polonaise avec des alliés hussites de Bohême marcha par Pomerelia jusqu’à la Baltique près de Gdańsk. Le 1er septembre 1435, Sigismond et ses alliés polonais ont fait route vers Švitrigaila et l’Ordre Livonien à Wiłkomierz (Pabaiskas), et la Paix de Brześć Kujawski le 31 décembre 1435 a gardé la frontière de 1422 et lié l’Ordre pour arrêter de s’immiscer en Lituanie."
"Dates are Julian (Old Style), as the sources give them.": "Les dates sont Julian (Ancien Style), comme les sources leur donnent."
"Some Polish historians count two wars, in 1431–1433 and 1435, separated by the Truce of Łęczyca of December 1433.": "Certains historiens polonais comptent deux guerres, en 1431–1433 et 1435, séparées par la Trêve de Łęczyca de décembre 1433."
