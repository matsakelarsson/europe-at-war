"Polish–Lithuanian War": "La guerre polonaise-lituanienne"
"An undeclared war between Poland and Lithuania over Vilnius and the Suwałki region, fought alongside the Polish–Soviet War and ended by a League of Nations ceasefire on 29 November 1920. Two days after the Suwałki Agreement of 7 October 1920 had left Vilnius on the Lithuanian side, General Lucjan Żeligowski, with Józef Piłsudski’s secret backing, staged a “mutiny” and took the city, where the Republic of Central Lithuania was proclaimed; Poland annexed it in 1922, and Lithuania refused diplomatic relations until 1938.": "Une guerre non déclarée entre la Pologne et la Lituanie sur Vilnius et la région de Suwałki, a combattu aux côtés de la guerre polonais-soviétique et s’est terminée par un cessez-le-feu de la Société des Nations le 29 novembre 1920. Deux jours après l’accord de Suwałki du 7 octobre 1920 avait quitté Vilnius de la partie lituanienne, le général Lucjan Ieligowski, avec le soutien secret de Józef Piłsudski, a mis en scène une Mutiny et a pris la ville, où la République de Lituanie centrale a été proclamée ; la Pologne l’a annexée en 1922, et la Lituanie a refusé les relations diplomatiques jusqu’en 1938."
"Vilnius was Wilno to Poles and Vilna to many of its Jewish and Russian-speaking inhabitants.": "Vilnius était Wilno pour les Polonais et Vilna pour beaucoup de ses habitants juifs et russophones."
