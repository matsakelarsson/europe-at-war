"Władysław still claimed the Russian crown, and in 1617 the Sejm finally paid for one more campaign. With Chodkiewicz in real command, his army took Dorogobuzh and Vyazma that autumn but stalled before Mozhaysk. In 1618 Hetman Petro Sahaidachny’s Zaporozhian Cossacks swept up from the south, sacking Livny and Yelets, and joined the prince outside Moscow. A night assault on 10–11 October failed.": "Władysław toujours revendiqué la couronne russe, et en 1617 le Sejm a finalement payé pour une campagne de plus. Avec Chodkiewicz en vrai commandement, son armée a pris Dorogobuzh et Vyazma cet automne-là mais s’est arrêté avant Mojaysk. En 1618, Hetman Petro Sahaidachny, les cosaques Zaporozhian balayèrent du sud, lançant Livny et Yelets, et rejoignirent le prince hors de Moscou. Une attaque nocturne du 10 au 11 octobre échoua."
"Both sides were exhausted. At Deulino, near the Trinity Monastery, they signed a truce on 11 December 1618 for fourteen and a half years. The Commonwealth kept Smolensk and gained the Chernihiv and Seversk lands, and reached its greatest extent. Prisoners were exchanged in 1619, among them the tsar’s father Filaret. Władysław did not give up his claim, and the next war came in 1632.": "À Deulino, près du monastère de la Trinité, ils signent une trêve le 11 décembre 1618 pendant quatorze ans et demi. Le Commonwealth garde Smolensk et acquiert les terres de Chernihiv et Seversk, et atteint sa plus grande étendue. Władysław n’abandonna pas sa revendication, et la guerre suivante arriva en 1632."
