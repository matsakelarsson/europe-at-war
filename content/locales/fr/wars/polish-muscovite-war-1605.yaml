"Russia’s old ruling dynasty died out in 1598, and a terrible famine in 1601–1603 undermined the elected tsar, Boris Godunov. In 1603 a young man appeared in Poland–Lithuania claiming to be Dmitry, the son of Ivan the Terrible who had died at Uglich in 1591. Magnates such as Jerzy Mniszech, whose daughter Marina he promised to marry, raised private troops for him. King Sigismund III gave quiet encouragement but kept the Commonwealth officially out of it.": "La vieille dynastie dirigeante de la Russie est morte en 1598, et une terrible famine en 1601–1603 a miné le tsar élu Boris Godunov. En 1603 un jeune homme est apparu en Pologne-Lituanie prétendant être Dmitry, le fils d’Ivan le Terrible qui était mort à Uglich en 1591. Des magnats comme Jerzy Mniszech, dont il a promis de se marier avec sa fille Marina, lui ont donné des troupes privées. Le roi Sigismond III a donné un encouragement tranquille mais a gardé officiellement le Commonwealth hors de lui."
"In the autumn of 1604 “Dmitry” crossed into Muscovy with about 3,500 men from magnates’ private armies and hired troops, later joined by Cossacks. Beaten at Dobrynichi in January 1605, he was saved when Tsar Boris Godunov died that April and the tsar’s army went over to him. He entered Moscow on 30 June 1605 and was crowned, but his Polish entourage made him unpopular. On 27 May 1606, soon after his wedding to Marina, boyars led by Vasily Shuisky killed him, and several hundred Poles in Moscow were massacred. Shuisky became tsar.": "À l’automne de 1604, Dmitry a traversé Muscovy avec environ 3 500 hommes de magnats d’armées privées et engagé des troupes, plus tard rejointes par Cosaques. Battu à Dobrynich en janvier 1605, il a été sauvé quand Tsar Boris Godunov est mort en avril et l’armée tsarl'est allé vers lui. Il entra à Moscou le 30 juin 1605 et fut couronné, mais son entourage polonais le fit impopulaire. Le 27 mai 1606, peu de temps après son mariage avec Marina, des boyars menés par Vasily Shuisky le tuèrent, et plusieurs centaines de Polonais à Moscou furent massacrés."
