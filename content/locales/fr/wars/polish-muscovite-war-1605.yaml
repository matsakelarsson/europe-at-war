"Shuisky’s brother Dmitry marched west with a large Russian army and De la Gardie’s mercenaries to relieve Smolensk. Hetman Żółkiewski left the siege with a small, mostly cavalry force and met them at Klushino on 4 July 1610. About 7,000 Poles and Lithuanians, led by winged hussars, routed an army several times larger, by some estimates 30,000 or more, and many of the unpaid mercenaries changed sides or went home.": "Le frère de Shuisky Dmitry marcha vers l’ouest avec une grande armée russe et des mercenaires de De la Garde pour soulager Smolensk. Hetman шółkiewski quitta le siège avec une petite force de cavalerie et les rencontra à Klushino le 4 juillet 1610. Environ 7 000 Polonais et Lituaniens, dirigés par des hussards ailés, ont acheminé une armée plusieurs fois plus grande, d’après certaines estimations 30 000 ou plus, et beaucoup de mercenaires non rémunérés ont changé de camp ou sont rentrés chez eux."
"Tsar Vasily lost all support. The boyars deposed him in July and forced him to become a monk, and in August they agreed to make Sigismund’s son Władysław tsar, provided he became Orthodox. In early October Polish–Lithuanian troops were let into Moscow and garrisoned the Kremlin. Sigismund, still at Smolensk, then refused to let his son convert and began to claim the throne for himself, and Russian goodwill drained away.": "Tsar Vasily a perdu tout soutien. Les boysars l’ont déposé en juillet et l’ont forcé à devenir moine, et en août ils ont accepté de faire le fils de Sigismond Władysław tsar, à condition qu’il devienne orthodoxe. Sigismond, toujours à Smolensk, refusa alors de laisser son fils se convertir et commença à revendiquer le trône pour lui-même, et la bonne volonté russe s’évanouissait."
