"A second pretender, the “Thief of Tushino”, appeared in 1607 and was again backed by Polish and Lithuanian adventurers such as Roman Różyński and Jan Piotr Sapieha, and by Cossacks. From 1608 his camp at Tushino, just outside Moscow, rivalled the tsar’s court, and Marina Mniszech recognised him as her husband. Sapieha besieged the fortified Trinity Monastery north of Moscow for sixteen months, without success.": "Un second prétendant, le thief de Tushino, apparut en 1607 et fut à nouveau soutenu par des aventuriers polonais et lituaniens tels que Roman Róшyński et Jan Piotr Sapieha, et par Cosaques. Dès 1608 son camp à Tushino, juste en dehors de Moscou, rivalisait avec la cour du tsarin, et Marina Mniszech le reconnut comme son mari. Sapieha a assiégé le monastère de la Trinité fortifié au nord de Moscou pendant seize mois, sans succès."
"Tsar Vasily Shuisky turned to Sweden, Poland’s enemy, and in February 1609 hired an army under Jacob De la Gardie. Sigismund III answered by invading Russia openly. On 29 September 1609 his army laid siege to Smolensk, the great fortress Lithuania had lost in 1514, defended by Mikhail Shein. The Tushino camp broke up, while Prince Mikhail Skopin-Shuisky and De la Gardie fought their way down from Novgorod and relieved Moscow in March 1610.": "Le 29 septembre 1609, son armée assiégea Smolensk, la grande forteresse que la Lituanie avait perdue en 1514, défendue par Mikhail Shein. Le camp de Tushino s’est rompu, tandis que le prince Mikhail Skopin-Shuisky et De la Garde se sont battus pour descendre de Novgorod et ont relevé Moscou en mars 1610."
