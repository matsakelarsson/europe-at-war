"In March 1611 Muscovites rose against the garrison. The Poles held the Kremlin, and the fighting set large parts of Moscow on fire. A first Russian militia then besieged the Kremlin, but quarrels among its leaders broke it up. On 13 June 1611 Smolensk finally fell to an assault after twenty months, when a mine blew a breach in its walls. Many of the last defenders died when the powder stored in the cathedral exploded, and Shein was taken prisoner.": "En mars 1611, Muscovites s’est levé contre la garnison. Les Polonais ont tenu le Kremlin et les combats ont mis le feu à de grandes parties de Moscou. Une première milice russe a ensuite assiégé le Kremlin, mais des querelles entre ses dirigeants l’ont rompue. Le 13 juin 1611 Smolensk est finalement tombé à une attaque après vingt mois, quand une mine a explosé une brèche dans ses murs. Beaucoup des derniers défenseurs sont morts lorsque la poudre stockée dans la cathédrale a explosé, et Shein a été fait prisonnier."
"In the autumn of 1611 the merchant Kuzma Minin and Prince Dmitry Pozharsky raised a second militia at Nizhny Novgorod. It reached Moscow in August 1612 and drove off Hetman Jan Karol Chodkiewicz’s relief army in hard fighting in early September. The starving garrison, reduced according to its own diarists to cannibalism, surrendered in early November 1612. Early in 1613 an assembly of the land elected the 16-year-old Michael Romanov tsar.": "À l’automne de 1611, le marchand Kuzma Minin et le prince Dmitry Pozharsky élevèrent une seconde milice à Nijni Novgorod. Il atteignit Moscou en août 1612 et se retira de l’armée de secours de Hetman Jan Karol Chodkiewicz au début de septembre. La garnison affamée, réduite selon ses propres diaristes au cannibalisme, se rendit au début novembre 1612. Au début de 1613, une assemblée du pays a élu le tsar Michael Romanov âgé de 16 ans."
