"Polish–Muscovite War, 1605–1618": "La guerre polonaise-muscovite, 1605-1618"
"During Russia’s Time of Troubles, Polish and Lithuanian backers of two pretenders, and then King Sigismund III himself, intervened in Muscovy. They won at Klushino and held the Moscow Kremlin for two years before being driven out, and the Truce of Deulino in 1618 left Smolensk and the Chernihiv–Seversk lands with the Commonwealth.": "Pendant la Russie Temps des troubles, les partisans polonais et lituaniens de deux prétendants, puis le roi Sigismond III lui-même, sont intervenus à Muscovy. Ils ont gagné à Klushino et tenu le Kremlin Moscou pendant deux ans avant d’être chassés, et la trêve de Deulino en 1618 a quitté Smolensk et les terres Chernihiv–Seversk avec le Commonwealth."
"Russia used the Julian calendar, ten days behind the Gregorian calendar used in Poland–Lithuania. Dates are New Style unless marked; Russian accounts of the same events are often ten days earlier.": "La Russie a utilisé le calendrier julien, dix jours derrière le calendrier grégorien utilisé en Pologne-Lituanie. Les dates sont New Style à moins de marquer ; les récits russes des mêmes événements sont souvent dix jours plus tôt."
"Polish historians often treat the pretenders’ campaigns of 1604–1609 (the “Dymitriads”) as separate from the royal war of 1609–1618.": "Les historiens polonais traitent souvent les campagnes des prétendants de 1604–1609 (les \"Dymitriades\") comme séparées de la guerre royale de 1609–1618."
