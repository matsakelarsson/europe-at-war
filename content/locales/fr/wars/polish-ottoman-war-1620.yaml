"Disaster at Cecora": "Catastrophe à Cecora"
"For decades Polish magnates had meddled in Moldavia, an Ottoman vassal, while Zaporozhian Cossacks raided Ottoman ports on the Black Sea and Tatars raided Poland–Lithuania in return. In 1620 the Moldavian prince Gaspar Graziani rebelled against the sultan and asked for help. The elderly Crown Grand Hetman Stanisław Żółkiewski crossed the Dniester with perhaps 5,000–9,000 men, many of them magnates’ private troops, but few Moldavians joined him.": "Pendant des décennies, les magnats polonais se sont mêlés en Moldavie, un vassal ottoman, tandis que Zaporozhian Cosaques a fait une descente dans les ports ottomans sur la mer Noire et que les Tatars ont fait une descente en Pologne-Lituanie. Le vieux Grand Hetman Stanisław, Grand-Crown, a traversé le Dniestr avec peut-être entre 5 000 et 9 000 hommes, dont beaucoup sont des magnats, mais peu de Moldaviens l’ont rejoint."
"From 17 September his camp at Cecora (Țuțora) on the Prut was attacked by Ottoman troops under Iskender Pasha and Tatars of Khan Temir. On 29 September the Poles began to retreat in a moving fort of wagons, fighting off attacks for a week. Close to the Dniester, on 6–7 October, the column broke up. Żółkiewski was killed and his head was sent to the sultan. Field Hetman Stanisław Koniecpolski was among the many taken prisoner, as was the young Bohdan Khmelnytsky, whose father died in the battle.": "À partir du 17 septembre, son camp de Cecora sur le Prut a été attaqué par les troupes ottomanes sous Iskender Pacha et Tatars de Khan Temir. Le 29 septembre, les Polonais ont commencé à se retirer dans un fort mobile de wagons, en combattant les attaques pendant une semaine. Près du Dniestr, les 6 et 7 octobre, la colonne s’est rompue. Le jeune Bohdan Khmelnytsky, dont le père est mort, a été tué et sa tête a été envoyée au sultan."
