"A war over Moldavia and over Cossack and Tatar raiding. The Ottomans destroyed a Polish army at Cecora in 1620, but a year later the Commonwealth and the Zaporozhian Cossacks held their camp at Khotyn against Sultan Osman II, and the peace left the border on the Dniester.": "Les Ottomans détruisirent une armée polonaise à Cecira en 1620, mais un an plus tard, le Commonwealth et les Cosaques Zaporozhiens tenaient leur camp à Khotyn contre le sultan Osman II, et la paix quitta la frontière sur le Dniestr."
