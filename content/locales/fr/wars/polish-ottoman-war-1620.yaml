"The camp at Khotyn": "Le camp de Khotyn"
"September – October 1621": "septembre – octobre 1621"
"In 1621 the young Sultan Osman II led a huge army north, with Tatar and Moldavian and Wallachian contingents, by most estimates well over 100,000 men. Lithuanian Grand Hetman Jan Karol Chodkiewicz entrenched about 30,000 Polish and Lithuanian troops beside the fortress of Khotyn on the Dniester, and some 25,000–40,000 Zaporozhian Cossacks under Hetman Petro Sahaidachny joined him.": "En 1621, le jeune Sultan Osman II dirigeait une énorme armée au nord, avec les contingents tatar et moldave et wallachien, selon la plupart des estimations, bien plus de 100 000 hommes. Le Grand Hetman lituanien Jan Karol Chodkiewicz a retranché environ 30 000 troupes polonaises et lituaniennes à côté de la forteresse de Khotyn sur le Dniestr, et entre 25 000 et 40 000 cosaques Zaporozhian sous Hetman Petro Sahaidachny l’ont rejoint."
"From 2 September the Ottomans attacked the camp again and again and were beaten off with heavy losses. Chodkiewicz, ill, handed over command to Stanisław Lubomirski and died on 24 September. With autumn coming and his army shrinking, Osman agreed to the Treaty of Khotyn on 9 October. The border stayed on the Dniester, the Commonwealth promised to curb the Cossacks and stop meddling in Moldavia, and the sultan to restrain the Tatars. Osman blamed his janissaries, and they killed him in a revolt the next year.": "Depuis le 2 septembre, les Ottomans attaquent de nouveau le camp et sont battus avec de lourdes pertes. Chodkiewicz, malade, remet le commandement à Stanisław Lubomirski et meurt le 24 septembre. L’automne venant et son armée rétrécissant, Osman accepte le traité de Khotyn le 9 octobre. La frontière est restée sur le Dniestr, le Commonwealth a promis de freiner les cosaques et d’arrêter de se mêler à la Moldavie, et le sultan pour retenir les Tatars. Osman a blâmé ses janissaires, et ils l’ont tué dans une révolte l’année suivante."
