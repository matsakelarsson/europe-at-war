"Sultan Mehmed IV, backing the Cossack hetman Petro Doroshenko, took the fortress of Kamianets and forced Poland–Lithuania to cede Podolia at Buchach in 1672. Jan Sobieski’s victory at Khotyn in 1673 helped make him king, but the Treaty of Żurawno in 1676 left Podolia Ottoman.": "Le sultan Mehmed IV, soutenant le cosaque hetman Petro Dorochenko, prit la forteresse de Kamianets et força la Pologne-Lituanie à cede Podolia à Buchach en 1672. La victoire de Jan Sobieski à Khotyn en 1673 contribua à faire de lui un roi, mais le traité d’Urawno en 1676 quitta Podolia Ottoman."
