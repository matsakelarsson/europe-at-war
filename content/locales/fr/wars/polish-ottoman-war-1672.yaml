"The Sejm voted money for an army instead of tribute. In November 1673 Sobieski, with about 30,000 Polish and Lithuanian troops, marched on the fortified Ottoman camp at Khotyn. After a freezing night his men stormed it at dawn on 11 November, and much of Hüseyin Pasha’s army was killed or drowned when the bridge over the Dniester collapsed. King Michael had died the day before, and in May 1674 the nobles elected Sobieski king as John III.": "En novembre 1673, Sobieski, avec environ 30 000 troupes polonaises et lituaniennes, marcha sur le camp ottoman fortifié de Khotyn. Après une nuit glaciale, ses hommes l’ont pris à l’aube le 11 novembre, et une grande partie de l’armée de Hüseyin Pacha a été tuée ou noyée lorsque le pont au-dessus du Dniestr s’est effondré. Le roi Michel était mort la veille, et en mai 1674 les nobles ont élu le roi Sobieski comme Jean III."
"He could not win back Kamianets. In 1675 an Ottoman and Tatar army advanced again, and Sobieski beat it outside Lviv in August, while the small garrison of Terebovlia held out for three weeks. In 1676 a much larger Ottoman army besieged his camp at Żurawno on the Dniester for two weeks, and on 17 October the two sides made peace. Poland–Lithuania no longer had to pay tribute and got back part of Ukraine, but Podolia stayed Ottoman.": "En 1675, une armée ottomane et tatare redevance, et Sobieski la bat à l’extérieur de Lviv en août, tandis que la petite garnison de Terebovlia se tient pendant trois semaines. En 1676, une armée ottomane beaucoup plus grande assiégea son camp au Dniestr pendant deux semaines, et le 17 octobre les deux parties firent la paix. Pologne-Lituanie n’a plus à rendre hommage et a fait partie de l’Ukraine, mais Podolia est resté ottoman."
