"Kamianets and the Peace of Buchach": "Kamianets et la paix de Buchach"
"Ukraine west of the Dnieper was still fought over after the Truce of Andrusovo. Its hetman, Petro Doroshenko, placed himself under the sultan in 1669, and in August 1672 Mehmed IV and his grand vizier Köprülü Fazıl Ahmed Pasha invaded with an army of perhaps 80,000. The Commonwealth, under the weak King Michael Korybut Wiśniowiecki and divided by noble feuds, was unready. Kamianets, the great fortress of Podolia, surrendered on 27 August after a siege of about ten days, and its cathedral became a mosque.": "L’Ukraine, à l’ouest du Dniepr, se battait encore après la trêve d’Andrusovo. Son hetman, Petro Dorochenko, s’est placé sous le sultan en 1669 et en août 1672 Mehmed IV et son grand vizier Köprülü Fazıl Ahmed Pasha a envahi avec une armée peut-être de 80 000. Le Commonwealth, sous le faible roi Michael Korybut Wiśniowiecki et divisé par de nobles querelles, n’était pas prêt. Kamianets, la grande forteresse de Podolia, s’est rendu le 27 août après un siège d’environ dix jours, et sa cathédrale est devenue une mosquée."
"The Ottomans then besieged Lviv, while Tatar raiders spread across south-eastern Poland. Crown Grand Hetman Jan Sobieski, with only about 3,000 horsemen, struck at the raiding parties in October and freed many thousands of captives. But on 18 October the king’s envoys signed the Peace of Buchach. Podolia became an Ottoman province, the Bratslav lands and southern Kyiv region went to Doroshenko, and the Commonwealth was to pay an annual tribute of 22,000 ducats. The Sejm refused to ratify it.": "Les Ottomans assiégèrent alors Lviv, tandis que les raideurs tatars s’étendaient dans le sud-est de la Pologne. Le Grand Hetman Jan Sobieski, avec seulement 3 000 cavaliers, frappait les groupes d’attaque en octobre et libéra des milliers de captifs. Podolia devint une province ottomane, les terres de Bratslav et la région du sud de Kiev se rendirent à Doroshenko, et le Commonwealth devait rendre un hommage annuel à 22 000 ducats. Le Sejm refusa de la ratifier."
