"Zieleńce, Dubienka and the Second Partition": "Zieleńce, Dubienka et la deuxième partition"
"June 1792 – 1793": "juin 1792 – 1793"
"The smaller Polish army fell back in Ukraine. On 18 June Prince Józef Poniatowski, the king’s nephew, turned on a Russian column at Zieleńce and beat it, and the king founded the Virtuti Militari order to reward the victors. On 18 July Tadeusz Kościuszko held the line of the Bug at Dubienka against a Russian force several times larger before withdrawing. In Lithuania the Russians beat the defenders at Mir and took Vilnius. In late July King Stanisław August, believing the war lost, joined the Confederation of Targowica, and the army was ordered to stop fighting.": "Le 18 juin, le prince Józef Poniatowski, neveu du roi, tourna sur une colonne russe à Zieleńce et la battit, et le roi fonda l’ordre de Virtuti Militari pour récompenser les vainqueurs. Le 18 juillet, Tadeusz Kościuszko tenait la ligne du Bug à Dubienka contre une force russe plusieurs fois plus grande avant de se retirer. En Lituanie, les Russes ont battu les défenseurs à Mir et pris Vilnius. Fin juillet, le roi Stanisław août, croyant la guerre perdue, a rejoint la Confédération de Targowica, et l’armée a reçu l’ordre d’arrêter les combats."
"The Targowica leaders had expected to rule under Russian protection. Instead, Prussia sent troops into Greater Poland in January 1793 and agreed a second partition with Russia. Surrounded by Russian soldiers, the last Sejm of the Commonwealth, at Grodno, approved it that summer and autumn. Russia took about 250,000 km² in Belarus and Ukraine, and Prussia about 58,000 km² with Poznań, Danzig and Toruń. The constitution was annulled.": "Les dirigeants de Targowica s’attendaient à régner sous la protection russe. Au lieu de cela, la Prusse envoya des troupes en Grande Pologne en janvier 1793 et accepta une deuxième partition avec la Russie. Entouré par les soldats russes, le dernier Sejm du Commonwealth, à Grodno, l’approuva cet été et cet automne-là. La Russie a pris environ 250 000 km2 en Biélorussie et en Ukraine, et la Prusse environ 58 000 km2 avec Poznań, Danzig et Toruń."
