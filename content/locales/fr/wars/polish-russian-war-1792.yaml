"War in Defence of the Constitution": "La guerre dans la défense de la Constitution"
"Also called the Polish–Russian War of 1792. Catherine II sent her armies into Poland–Lithuania in support of the Confederation of Targowica, magnates opposed to the reforming Constitution of 3 May 1791. After three months the king gave in, and in 1793 Russia and Prussia carried out the Second Partition.": "Catherine II envoya ses armées en Pologne-Lituanie pour soutenir la Confédération de Targowica, des magnats opposés à la réforme constitutionnelle du 3 mai 1791. Après trois mois, le roi céda, et en 1793, la Russie et la Prusse effectuèrent la Seconde Partition."
