"1788 – May 1792": "1788 – mai 1792"
"While Russia was busy fighting the Ottomans and Sweden, the Great Sejm that met in Warsaw from 1788 set out to rebuild the state left weak after the First Partition of 1772. It allied with Prussia in 1790, and on 3 May 1791 it passed a new constitution, the first of its kind in Europe. It made the throne hereditary, abolished the liberum veto that let one deputy block the Sejm, gave townspeople new rights, placed peasants under the protection of the law and planned an army of 100,000.": "Alors que la Russie était occupée à combattre les Ottomans et la Suède, le Grand Sejm qui s’est réuni à Varsovie de 1788 a entrepris de reconstruire l’État laissé faible après la Première Partition de 1772. Il allié avec la Prusse en 1790, et le 3 mai 1791 il a adopté une nouvelle constitution, la première du genre en Europe. Il a fait du trône héréditaire, aboli le veto libérum qui a permis à un député de bloquer le Sejm, donné aux citadins de nouveaux droits, placé les paysans sous la protection de la loi et prévu une armée de 100 000."
"Catherine II saw the reforms as a threat to Russian control. Once peace with the Ottomans was signed in January 1792, she backed a group of magnates led by Stanisław Szczęsny Potocki, Franciszek Ksawery Branicki and Seweryn Rzewuski. Their act of confederation, drawn up in St Petersburg in April, was proclaimed in the border town of Targowica on 14 May, and on 18 May nearly 100,000 Russian troops crossed into Poland and Lithuania. Prussia refused to honour its alliance.": "Catherine II voit les réformes comme une menace pour le contrôle russe. Une fois la paix signée avec les Ottomans en janvier 1792, elle soutient un groupe de magnats dirigé par Stanisław Szczęsny Potocki, Franciszek Ksawery Branicki et Seweryn Rzewuski. Leur acte de confédération, rédigé à Saint-Pétersbourg en avril, a été proclamé dans la ville frontalière de Targowica le 14 mai et, le 18 mai, près de 100 000 soldats russes ont traversé la Pologne et la Lituanie. La Prusse a refusé d’honorer son alliance."
