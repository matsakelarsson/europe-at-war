"Polish–Soviet War": "Pologne – Guerre soviétique"
"A war between the reborn Polish state and Soviet Russia for the lands between them, today in Belarus, Lithuania and Ukraine. After Polish forces reached Kyiv and the Red Army reached the gates of Warsaw, Poland won the Battle of Warsaw in August 1920, and the Peace of Riga in March 1921 divided Belarus and Ukraine between Poland and the Soviet republics.": "Une guerre entre l’État polonais renaissant et la Russie soviétique pour les terres entre eux, aujourd'hui en Biélorussie, Lituanie et Ukraine. Après que les forces polonaises sont arrivées à Kiev et l’armée rouge a atteint les portes de Varsovie, la Pologne a gagné la bataille de Varsovie en août 1920, et la paix de Riga en mars 1921 a divisé la Biélorussie et l’Ukraine entre la Pologne et les républiques soviétiques."
"Also called the Polish–Bolshevik War. Soviet Russia had adopted the Gregorian calendar in February 1918, so all dates are New Style.": "La Russie soviétique avait adopté le calendrier grégorien en février 1918, donc toutes les dates sont New Style."
"Lwów is today’s Lviv in Ukraine, and Vilnius was Wilno to Poles. Other places are named in their present-day forms.": "Lwów est aujourd'hui Lviv en Ukraine, et Vilnius était Wilno aux Polonais. D’autres lieux sont nommés dans leurs formes actuelles."
"The base map does not follow the moving front, which is shown instead by approximate front lines drawn from general accounts.": "La carte de base ne suit pas le front en mouvement, qui est plutôt montré par des lignes de front approximatives tirées des comptes généraux."
