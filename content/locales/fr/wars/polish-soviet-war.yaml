"On 14 May Mikhail Tukhachevsky’s Western Front attacked in northern Belarus and drove about 100 km into Polish-held territory before a Polish counter-attack pushed it back by 8 June. In the south Semyon Budyonny’s First Cavalry Army broke the Polish front on 5 June and wrecked Zhytomyr behind it. The Poles abandoned Kyiv on 10 June, destroying its bridges and power stations, and fell back west with Petliura’s army.": "Le 14 mai, le Front occidental Mikhail Tukhachevsky a attaqué dans le nord de la Biélorussie et a conduit environ 100 km dans un territoire tenu par la Pologne avant qu’une contre-attaque polonaise ne le repousse le 8 juin. Les Polonais ont abandonné Kiev le 10 juin, détruisant ses ponts et ses centrales, et sont retombés à l’ouest avec l’armée de Petliura."
"Tukhachevsky attacked again on 4 July with a much larger force. His order of the day declared that “over the corpse of White Poland lies the path to world conflagration”. Minsk fell on 11 July, Vilnius on 14 July, Grodno on 19 July and Brest on 29 July. On 11 July Britain proposed an armistice along a line later named after its foreign secretary, Lord Curzon, but the Soviet leadership pressed on. A Provisional Polish Revolutionary Committee, set up on 23 July, began to govern captured Polish territory from Białystok.": "Tukhachevsky attaqua de nouveau le 4 juillet avec une force beaucoup plus grande. Son ordre du jour déclara que, sur le cadavre de la Pologne blanche se trouve le chemin vers la conflagration mondiale. Minsk tomba le 11 juillet, Vilnius le 14 juillet, Grodno le 19 juillet et Brest le 29 juillet. Le 11 juillet, la Grande-Bretagne proposa un armistice le long d’une ligne nommée plus tard d’après son secrétaire étranger, Lord Curzon, mais les dirigeants soviétiques insistèrent. Un comité révolutionnaire polonais provisoire, créé le 23 juillet, commença à gouverner le territoire polonais capturé depuis Białystok."
