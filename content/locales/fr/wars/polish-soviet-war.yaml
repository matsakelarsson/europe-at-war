"Budyonny’s cavalry army, ordered north too late to help at Warsaw, turned on Zamość, which a Ukrainian division and Polish units held from 29 to 31 August. On 31 August Polish cavalry under Juliusz Rómmel beat Budyonny at Komarów, often called the greatest cavalry battle of the 20th century. In the north Tukhachevsky, reinforced, tried to hold a new line on the Niemen. From 20 September the Poles attacked at Grodno, while a flanking force marched through Lithuanian-held ground to Druskininkai and on towards Lida, behind the Soviet lines.": "L’armée de la cavalerie de Budyonny, commandée au nord trop tard pour aider à Varsovie, tourna sur Zamość, qu’une division ukrainienne et des unités polonaises tenues du 29 au 31 août. Le 31 août la cavalerie polonaise sous Juliusz Rómmel a battu Budyonny à Komarów, souvent appelé la plus grande bataille de cavalerie du 20ème siècle. Dans le nord de Tukhachevsky, renforcé, a essayé de tenir une nouvelle ligne sur les Niémens. À partir du 20 septembre, les Polonais ont attaqué à Grodno, tandis qu’une force flanquée marchait par la terre lituanienne jusqu’à Druskininkai et en direction de Lida, derrière les lignes soviétiques."
"Grodno fell on 26 September and the Western Front fell back east in disorder, some of its divisions breaking up; Polish troops entered Minsk in mid-October. Both governments were exhausted. A preliminary peace was signed in Riga on 12 October and an armistice came into force on 18 October, with the front far east of the Curzon Line. Meanwhile, on 9 October, Polish troops under General Lucjan Żeligowski staged a “mutiny” and seized Vilnius from Lithuania.": "Grodno est tombé le 26 septembre et le Front occidental est retombé dans le désordre, certaines de ses divisions se rompent ; les troupes polonaises sont entrées à Minsk à la mi-octobre. Les deux gouvernements ont été épuisés. Une paix préliminaire a été signée à Riga le 12 octobre et une armistice est entrée en vigueur le 18 octobre, avec le front à l’est de la ligne Curzon. Pendant ce temps, le 9 octobre, les troupes polonaises sous la direction du général Lucjan шeligowski ont mis en scène un Đmutiny et saisi Vilnius de Lituanie."
