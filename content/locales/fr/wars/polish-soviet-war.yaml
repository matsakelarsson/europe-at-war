"12–25 August 1920": "12–25 août 1920"
"By mid-August three Soviet armies were closing on Warsaw from the east and north-east, while the 4th Army and a cavalry corps swung west along the East Prussian border towards the lower Vistula. Piłsudski and his chief of staff, Tadeusz Rozwadowski, planned to hold the bridgehead before the capital while a strike force gathered to the south-east on the Wieprz. Polish codebreakers were reading Soviet radio messages. The assault began on 12 August. Radzymin changed hands several times, and on 14 August General Władysław Sikorski’s 5th Army counter-attacked across the Wkra.": "Vers la mi-août, trois armées soviétiques fermaient Varsovie depuis l’est et le nord-est, tandis que la 4e armée et un corps de cavalerie s’élançaient vers l’ouest le long de la frontière prussienne orientale en direction de la Vistule inférieure. Piłsudski et son chef d’état-major, Tadeusz Rozwadowski, prévoyaient de tenir la tête de pont avant la capitale alors qu’une force de frappe se rassemblait au sud-est sur le Wieprz. Les violeurs polonais lisaient des messages radio soviétiques. L’assaut a commencé le 12 août. Radzymin a changé de mains plusieurs fois, et le 14 août, le général Władysław Sikorski a contre-attaqué la 5ème armée à travers le Wkra."
"On 16 August Piłsudski’s strike force attacked north from the Wieprz into the thinly held Soviet flank, scattered the Mozyr Group and cut behind the armies before Warsaw. The Red Army fell back in disorder. By 25 August the pursuit had reached the East Prussian border, where the Soviet 4th Army and the cavalry corps crossed and were interned. Poland took more than 50,000 prisoners. Piłsudski’s political opponents called the victory the “Miracle on the Vistula”, crediting providence rather than him.": "Le 16 août, la force de frappe de Piłsudski a attaqué le nord du Wieprz dans le flanc soviétique, éparpillé le groupe Mozyr et coupé derrière les armées avant Varsovie. L’armée rouge est retombée dans le désordre. Au 25 août, la poursuite avait atteint la frontière prussienne orientale, où la 4ème armée soviétique et le corps de cavalerie ont traversé et ont été internés. La Pologne a pris plus de 50 000 prisonniers. Les opposants politiques de Piłsudski ont appelé la victoire le Miracle sur la Vistule, créditant providence plutôt que lui."
