"18 March 1921": "18 mars 1921"
"The Peace of Riga was signed on 18 March 1921 by Poland and by Soviet Russia, acting also for Soviet Belarus, and Soviet Ukraine. It fixed a border far east of the Curzon Line, leaving western Belarus and western Volhynia in Poland, while Minsk and central Ukraine stayed Soviet. Poland recognised the Soviet republics and abandoned its alliance with Petliura, whose soldiers in Poland were interned. Belarusians and Ukrainians, who had hoped for states of their own, were divided between Poland and the Soviet Union.": "La paix de Riga a été signée le 18 mars 1921 par la Pologne et la Russie soviétique, agissant également pour la Biélorussie soviétique, et l’Ukraine soviétique. Il a fixé une frontière à l’extrême est de la ligne Curzon, laissant la Biélorussie occidentale et la Volhynie occidentale en Pologne, tandis que Minsk et l’Ukraine centrale sont restés soviétiques. Les Biélorusses et les Ukrainiens, qui avaient espéré avoir leurs propres États, étaient divisés entre la Pologne et l’Union soviétique."
"About 100,000 Polish soldiers had been killed or gone missing, and Soviet losses were also heavy. Prisoners on both sides died in large numbers of disease, hunger and neglect, among them some 16,000–20,000 of about 80,000 Soviet prisoners held in Polish camps. Jewish communities suffered pogroms by soldiers of several armies, among them the shooting of 35 Jews by Polish troops in Pinsk in April 1919 and massacres by Budyonny’s cavalry in Ukraine.": "Environ 100 000 soldats polonais avaient été tués ou portés disparus, et les pertes soviétiques étaient également lourdes. Des prisonniers des deux côtés sont morts dans un grand nombre de maladies, la faim et la négligence, parmi lesquels environ 16 000 à 20 000 des quelque 80 000 prisonniers soviétiques détenus dans des camps polonais. Les communautés juives ont souffert de pogroms par des soldats de plusieurs armées, dont le tir de 35 juifs par les troupes polonaises à Pinsk en avril 1919 et les massacres de Budyonny's cavalry en Ukraine."
