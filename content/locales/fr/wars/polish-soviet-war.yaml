"February 1919 – May 1920": "février 1919 – mai 1920"
"As German troops withdrew from the east after the First World War, Polish and Soviet forces moved into the lands between them, and they first clashed at Bereza Kartuska on 14 February 1919. Poland’s head of state, Józef Piłsudski, hoped to build a federation with Lithuania, Belarus and Ukraine that would keep Russia at a distance. Polish troops took Vilnius in April 1919 and Minsk in August, and in January 1920, with Latvian forces, Daugavpils on the Daugava.": "Alors que les troupes allemandes se retiraient de l’est après la Première Guerre mondiale, les forces polonaises et soviétiques s’installèrent dans les terres entre elles, et elles battirent pour la première fois à Bereza Kartuska le 14 février 1919. Les troupes polonaises ont pris Vilnius en avril 1919 et Minsk en août, et en janvier 1920, avec les forces lettones, Daugavpils sur le Daugava."
"On 21 April 1920 Piłsudski allied with Symon Petliura’s Ukrainian People’s Republic, which gave up its claim to eastern Galicia in return for military help against the Soviets. Polish and Ukrainian troops attacked four days later, took Zhytomyr on 26 April and entered Kyiv on 7 May. Many towns fell without a fight, because the Red Army withdrew rather than give battle. Its forces had not been destroyed, and few Ukrainians came forward to join Petliura.": "Le 21 avril 1920 Piłsudski allié avec Symon Petliura, République populaire d’Ukraine, qui a renoncé à sa revendication à l’est de la Galice en échange de l’aide militaire contre les Soviétiques. Les troupes polonaises et ukrainiennes attaquent quatre jours plus tard, prennent Zhytomyr le 26 avril et entrent à Kiev le 7 mai. De nombreuses villes tombent sans combat, parce que l’armée rouge se retire plutôt que de livrer bataille. Ses forces n’avaient pas été détruites, et peu d’Ukrainiens se présentèrent pour rejoindre Petliura."
