"Duke Charles, king as Charles IX from 1604, carried the feud with Sigismund into Livonia, invading in 1600. The Polish-Lithuanian commander Jan Karol Chodkiewicz fought back.": "Le duc Charles, roi de Charles IX à partir de 1604, transporta la querelle avec Sigismond en Livonie, envahissant en 1600."
"In September 1605 Charles left part of his army at Riga and went after Chodkiewicz’s much smaller force. At Kircholm on the Düna on 27 September 1605, the Polish-Lithuanian cavalry, winged hussars among them, smashed the Swedish army. Some historians call it the worst defeat in Swedish history. A truce in 1611 ended this round of the war with little changed.": "En septembre 1605, Charles quitta une partie de son armée à Riga et poursuivit la force beaucoup plus petite de Chodkiewicz. A Kircholm sur la Düna le 27 septembre 1605, la cavalerie lithuanienne-polonaise, parmi lesquelles des hussars ailés, brisa l’armée suédoise. Certains historiens appellent cela la pire défaite de l’histoire suédoise."
