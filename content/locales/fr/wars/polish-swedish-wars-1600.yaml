"1617–1629": "1617–1629"
"Gustav II Adolf renewed the war on Sigismund. In September 1621 he took Riga, which his father had failed to capture, and by 1625 he had overrun Livonia, including Dorpat. On 17 January 1626 he beat a Polish-Lithuanian army at Wallhof, the first Swedish victory over the Commonwealth in open battle.": "Gustav II Adolf renouvela la guerre contre Sigismond. En septembre 1621, il prit Riga, que son père n’avait pas capturée, et en 1625, il avait envahi Livonia, y compris Dorpat. Le 17 janvier 1626, il battit une armée polonaise-lithuane à Wallhof, première victoire suédoise sur le Commonwealth dans une bataille ouverte."
"In July 1626 he landed in Prussia to strike at Danzig and the Vistula trade. There were Swedish successes at Mewe and Dirschau, where the king was badly wounded in 1627, but the Danzig fleet beat a Swedish squadron off Oliwa that November, and in June 1629 Stanisław Koniecpolski and Imperial troops mauled his army at Trzciana. France helped broker the Truce of Altmark on 26 September 1629: Sweden kept Livonia and tolls from the Prussian ports, and Gustav Adolf was free to turn to Germany.": "En juillet 1626, il débarqua en Prusse pour frapper Danzig et le commerce de Vistule. Il y eut des succès suédois à Mewe et Dirschau, où le roi fut gravement blessé en 1627, mais la flotte de Danzig battit un escadron suédois au large d’Oliwa en novembre, et en juin 1629 Stanisław Koniecpolski et les troupes impériales maulèrent son armée à Trzciana. La France aidait à négocier la trêve d’Altmark le 26 septembre 1629 : la Suède gardait Livonie et les péages des ports prussiens, et Gustav Adolf était libre de se tourner vers l’Allemagne."
