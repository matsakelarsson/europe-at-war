"Polish–Swedish wars, 1600–1629": "Guerres polonaises-suédoises, 1600-1629"
"Sweden and Poland–Lithuania, ruled by rival branches of the Vasa dynasty, fought on and off for Livonia and the Prussian coast. After a crushing Polish–Lithuanian victory at Kircholm in 1605, Gustav II Adolf took Riga and Livonia and invaded Prussia, and the Truce of Altmark in 1629 left most of Livonia Swedish.": "La Suède et la Pologne–Lituanie, gouvernées par des branches rivales de la dynastie Vasa, se sont battues pour la Livonie et la côte prussienne. Après une victoire polonaise-lituanienne écrasante à Kircholm en 1605, Gustav II Adolf a pris Riga et Livonie et envahi la Prusse, et la Trêve d’Altmark en 1629 a laissé la plupart de Livonie suédoise."
"Dates in Germany and Poland are New Style (Gregorian); Scandinavian dates are mostly Old Style (Julian), as usually cited, which ran ten days behind.": "Les dates en Allemagne et en Pologne sont New Style (Gregorian) ; les dates scandinaves sont pour la plupart Old Style (Julian), comme on le cite habituellement, qui a duré dix jours."
