# Some French text was translated automatically.
"Polish–Teutonic War, 1326–1332": "Polish–Teutonic War, 1326-1332"
"A war between the Kingdom of Poland under Władysław I the Elbow-high and the Teutonic Order, which had seized Gdańsk Pomerania in 1308 and was allied with King John of Bohemia. The Order overran Kuyavia and the Dobrzyń Land; the battle of Płowce on 27 September 1331 was hard fought and indecisive, and a truce in 1332 left the Order holding its conquests. By the Treaty of Kalisz in 1343 it returned Kuyavia and Dobrzyń, while Poland gave up its claim to Pomerania and the Chełmno Land.": "Une guerre entre le royaume de Pologne sous Władysław I l’ordre Elbow-haut et Teutonic, qui avait saisi Gdańsk Pomerania en 1308 et était allié avec le roi Jean de Bohême. La bataille de Płowce, le 27 septembre 1331, fut dure et indécise, et une trêve en 1332 quitta l’Ordre pour tenir ses conquêtes. Par le traité de Kalisz en 1343, il renvoya Kuyavia et Dobrzyń, tandis que la Pologne abandonna sa revendication à Poméranie et à la Terre de Chełmno."
"Dates are Julian (Old Style), as the sources give them.": "Les dates sont Julian (Ancien Style), comme les sources leur donnent."
