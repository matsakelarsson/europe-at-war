"Polish–Lithuanian–Teutonic War, 1409–1411": "Pologne–Lithuanien–Guerre teutonique, 1409-1411"
"A war between the Teutonic Order and the allied Kingdom of Poland and Grand Duchy of Lithuania, sparked by a revolt in Samogitia. The allies crushed the Order at Grunwald in July 1410 but failed to take Malbork, and the First Peace of Thorn in 1411 changed little on the map while leaving the Order heavily in debt.": "Une guerre entre l’Ordre teutonique et le Royaume allié de Pologne et le Grand-Duché de Lituanie, déclenchée par une révolte en Samogice. Les alliés ont écrasé l’Ordre à Grunwald en juillet 1410 mais n’ont pas réussi à prendre Malbork, et la Première Paix de Thorn en 1411 a peu changé sur la carte tout en laissant l’Ordre lourdement endetté."
"Dates are Julian (Old Style), as the sources give them; the Gregorian calendar came only in 1582.": "Les dates sont Julian (Ancien Style), comme les sources leur donnent ; le calendrier grégorien est venu seulement en 1582."
"Places are given their modern names, with the German names of the time where useful, such as Malbork (Marienburg) and Toruń (Thorn).": "Les lieux sont donnés leurs noms modernes, avec les noms allemands de l’époque où utile, tels que Malbork (Marienburg) et Toruń (Thorn)."
"Also called the Great War, and in Lithuania the war of Žalgiris.": "Aussi appelé la Grande Guerre, et en Lituanie la guerre de Žalgiris."
