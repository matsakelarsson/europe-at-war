"The victors stayed three days on the battlefield and moved slowly, reaching Malbork only on 26 July. By then Heinrich von Plauen, left with about 3,000 men at Świecie, had reached the castle and organised its defence. Most Prussian towns and castles, Gdańsk, Toruń and Elbląg among them, submitted to Jagiełło, and only eight castles held out. But Malbork resisted. The besiegers ran short of powder, suffered from dysentery and wanted to be home for the harvest, and the siege was lifted on 19 September.": "Les vainqueurs sont restés trois jours sur le champ de bataille et se sont déplacés lentement, atteignant Malbork seulement le 26 juillet. Alors Heinrich von Plauen, parti avec environ 3 000 hommes à -wiecie, avait atteint le château et organisé sa défense. La plupart des villes et châteaux prussiens, Gdańsk, Toruń et Elblig parmi eux, soumis à Jagiełło, et seulement huit châteaux tenu dehors. Mais Malbork résista. Les assiégeants manquaient de poudre, souffraient de dysenterie et voulaient être à la maison pour la moisson, et le siège fut levé le 19 septembre."
"The Order quickly won back most of its castles. A fresh Polish army beat a Teutonic force at Koronowo on 10 October, and von Plauen, elected Grand Master in November, agreed to talk. By the First Peace of Thorn on 1 February 1411 the Order returned the Dobrzyń Land and gave up Samogitia, but only for the lifetimes of Jagiełło and Vytautas, and paid 100,000 kopas of Prague groschen for its prisoners. Its losses of land were slight, but the payments and the taxes raised for them weakened the Order for good.": "L’Ordre a rapidement remporté la plupart de ses châteaux. Une armée polonaise fraîche a battu une force teutonique à Koronowo le 10 octobre, et von Plauen, élu Grand Maître en novembre, a accepté de parler. Par la première paix d’épine, le 1er février 1411, l’Ordre retourna la terre Dobrzyń et abandonna Samogitia, mais seulement pour les vies de Jagiełło et Vytautas, et paya 100 000 kopas de Prague pour ses prisonniers. Ses pertes de terres étaient faibles, mais les paiements et les impôts levés pour eux affaiblissaient l’Ordre pour de bon."
