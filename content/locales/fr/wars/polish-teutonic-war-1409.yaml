"In the 1220s Duke Konrad of Masovia invited the Teutonic Knights, a German crusading order, to help him against the pagan Prussians. From the Chełmno Land the knights conquered Prussia by the 1280s and made it a state of their own. In 1308–1309 they seized Gdańsk Pomerania from Poland and moved their headquarters to Malbork. By the Treaty of Kalisz in 1343 Poland won back Kuyavia and Dobrzyń but gave up its claim to Pomerania, while the Order kept up a long crusade against pagan Lithuania.": "Dans les années 1220, le duc Konrad de Masovia invita les Chevaliers teutoniques, un ordre de croisade allemand, à l’aider contre les Prusses païens. De la terre de Chełmno, les chevaliers conquirent la Prusse vers les années 1280 et en firent un état propre. En 1308–1309, ils saisirent Gdańsk Pomerania de Pologne et s’installèrent à Malbork. Par le traité de Kalisz en 1343 la Pologne a remporté Kuyavia et Dobrzyń mais a renoncé à sa revendication à Poméranie, tandis que l’Ordre a maintenu une longue croisade contre la Lituanie païenne."
"That crusade lost its purpose in 1385. At Krewo the Lithuanian grand duke Jogaila agreed to become a Catholic and marry the young Queen Jadwiga of Poland. He was crowned in Kraków in 1386 as Władysław II Jagiełło, and Lithuania was baptised the next year. The Order doubted the conversion and fought on over Samogitia, the Lithuanian land that separated Prussia from Livonia. Jogaila’s cousin Vytautas, who ruled Lithuania, ceded it to the Order in 1398 and again in 1404. In May 1409 the Samogitians rose in revolt, with his support.": "Cette croisade a perdu son but en 1385. A Krewo le grand duc lituanien Jogaila a accepté de devenir catholique et d’épouser la jeune reine Jadwiga de Pologne. Il a été couronné à Cracovie en 1386 comme Władysław II Jagiełło, et la Lituanie a été baptisée l’année suivante. L’Ordre doutait de la conversion et se battait sur Samogitia, la terre lituanienne qui séparait la Prusse de Livonie. Le cousin de Jogaila Vytautas, qui régnait en Lituanie, l’avait cédée à l’Ordre en 1398 et à nouveau en 1404. En mai 1409 les Samogites se levèrent en révolte, avec son soutien."
