"The allies did what the Order did not expect and joined forces. Between 24 and 30 June 1410 the Polish army and Vytautas’s Lithuanians and Ruthenians, with Tatar and Czech contingents, crossed the Vistula at Czerwińsk on a pontoon bridge. Joined by the Masovians, they marched north and entered Prussia on 9 July. Ulrich von Jungingen blocked the crossing of the Drwęca at Kurzętnik, so Jagiełło turned east around the river’s headwaters, and his troops plundered the small town of Dąbrówno (Gilgenburg) on the way.": "Entre le 24 et le 30 juin 1410, l’armée polonaise et les Vytautas lituaniens et ruthènes, avec des troupes tatares et tchèques, traversèrent la Vistule à Czerwińsk sur un ponton. Rejoints par les masoviens, ils marchèrent vers le nord et entrèrent en Prusse le 9 juillet. Ulrich von Jungingen a bloqué la traversée de la Drwęca à Kurzętnik, alors Jagiełło tourna vers l’est autour des eaux d’amont de la rivière, et ses troupes pillèrent la petite ville de Dėbrówno (Gilgenburg) sur le chemin."
"On 15 July the armies met in the fields near Grunwald and Stębark (Tannenberg). Modern estimates range from about 16,500 to 39,000 men on the allied side and from 11,000 to 27,000 for the Order. After more than an hour of heavy fighting the Lithuanian wing fell back, in flight or as a planned feint, which is still debated, but it returned to the field, and the Grand Master was killed trying to break through. The Order’s camp was overrun. Some 200 of its brother knights died, with most of its leaders, and thousands were taken prisoner.": "Le 15 juillet, les armées se sont réunies dans les champs près de Grunwald et de Stębark (Tannenberg). Les estimations modernes vont d’environ 16 500 à 39 000 hommes du côté allié et de 11 000 à 27 000 hommes pour l’Ordre. Après plus d’une heure de combats violents, l’aile lituanienne est tombée en vol ou comme une feinte planifiée, qui est encore débattue, mais elle est revenue sur le terrain, et le Grand Maître a été tué en essayant de percer. Le camp de l’Ordre a été envahi. Environ 200 de ses frères chevaliers sont morts, avec la plupart de ses dirigeants, et des milliers ont été faits prisonniers."
