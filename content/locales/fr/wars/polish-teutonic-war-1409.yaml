"August 1409 – June 1410": "août 1409 – juin 1410"
"On 6 August 1409 Ulrich von Jungingen declared war on Poland and Lithuania, hoping to beat them one at a time. His army overran the Dobrzyń Land, burned the castle at Dobrzyń, took Bobrowniki after a fourteen-day siege and seized Bydgoszcz, while other forces raided Kuyavia and Greater Poland. The Poles, caught unprepared, gathered their levies and won Bydgoszcz back in the autumn. In the north the Samogitians attacked Memel.": "Le 6 août 1409, Ulrich von Jungingen déclara la guerre à la Pologne et à la Lituanie, espérant les battre une fois à la fois. Son armée envahit la Terre de Dobrzyń, brûla le château à Dobrzyń, prit Bobrowniki après un siège de quatorze jours et saisit Bydgoszcz, tandis que d’autres forces pillèrent Kuyavia et la Grande Pologne. Les Polonais, pris sans préparation, ont recueilli leurs prélèvements et gagné Bydgoszcz à l’automne. Au nord, les Samogitiens attaquèrent Memel."
"Neither side was ready for a long war. Wenceslaus, King of the Romans and of Bohemia, arranged a truce on 8 October 1409 that was to last until 24 June 1410, and offered to judge the dispute. Early in 1410 he ruled that Samogitia belonged to the Order and only Dobrzyń should go back to Poland; the Order had given him 60,000 florins. The allies rejected the verdict and spent the winter planning a joint campaign against Malbork, while the Order hired mercenaries across the Empire.": "Wenceslaus, roi des Romains et de Bohême, arrangea une trêve le 8 octobre 1409 qui devait durer jusqu’au 24 juin 1410, et offrit de juger le différend. Au début de 1410, il régna que Samogitia appartenait à l’Ordre et seul Dobrzyń devait retourner en Pologne ; l’Ordre lui avait donné 60 000 fleurs. Les alliés ont rejeté le verdict et passé l’hiver à planifier une campagne commune contre Malbork, tandis que l’Ordre engageait des mercenaires dans tout l’Empire."
