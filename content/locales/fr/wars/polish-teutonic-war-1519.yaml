"Polish–Teutonic War, 1519–1521": "Polish–Teutonic War, 1519-1521"
"The last war between Poland and the Teutonic Order, fought after Grand Master Albert of Hohenzollern refused the homage owed under the Second Peace of Thorn and allied with Moscow. Neither side won, and a four-year truce was agreed at Toruń in April 1521. In 1525 Albert became a Lutheran, turned the Order’s Prussia into a hereditary duchy and did homage for it to his uncle, King Sigismund I, in the Prussian Homage at Kraków on 10 April.": "La dernière guerre entre la Pologne et l’Ordre teutonique, combattue après que le Grand Maître Albert de Hohenzollern a refusé l’hommage dû sous la Deuxième Paix de Thorn et allié avec Moscou. Aucune partie n’a gagné, et une trêve de quatre ans a été convenue à Toruń en avril 1521. En 1525 Albert devint luthérien, transforma la Prusse de l’Ordre en duché héréditaire et fit un hommage à son oncle, le roi Sigismond Ier, dans l’Hommage prussien à Cracovie le 10 avril."
"Known in German as the Reiterkrieg, the Riders’ War. Among the defenders of Olsztyn against the Order in 1521 was the astronomer Nicolaus Copernicus.": "Connu en allemand comme le Reiterkrieg, la guerre des cavaliers. Parmi les défenseurs d’Olsztyn contre l’Ordre en 1521 était l’astronome Nicolaus Copernic."
