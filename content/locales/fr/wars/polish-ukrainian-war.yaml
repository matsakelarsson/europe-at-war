# Some French text was translated automatically.
"Polish–Ukrainian War": "Guerre polonaise-ukrainienne"
"A war for eastern Galicia between the new Polish state and the West Ukrainian People’s Republic, proclaimed in Lwów (Lviv) on 1 November 1918. Polish defenders, many of them students and schoolchildren, held part of the city until relief arrived on 21–22 November, after which Polish soldiers and civilians killed an estimated 52–150 Jews in a pogrom; in July 1919 a Polish offensive, reinforced by Józef Haller’s army from France, drove the Ukrainian Galician Army across the Zbruch.": "Une guerre pour l’est de la Galice entre le nouvel État polonais et la République populaire d’Ukraine occidentale, proclamée à Lwów (Lviv) le 1er novembre 1918. Les défenseurs polonais, dont beaucoup d’élèves et d’écoliers, ont tenu une partie de la ville jusqu’à ce que les secours arrivent du 21 au 22 novembre, après quoi des soldats et des civils polonais ont tué 52 à 150 juifs dans un pogrom ; en juillet 1919, une offensive polonaise, renforcée par l’armée française Józef Haller, a conduit l’Armée galicienne ukrainienne à travers le Zbruch."
"Lwów is today’s Lviv in Ukraine. The Allies recognised Polish sovereignty over eastern Galicia only in 1923.": "Lwów est aujourd'hui à Lviv en Ukraine. Les Alliés ont reconnu la souveraineté polonaise sur la Galice orientale seulement en 1923."
