Polygar Wars: Guerres des polygars
? Wars between the East India Company and the palayakkarars (polygars), the hereditary chiefs of fortified domains in the Tamil south, who resisted the Company’s collection of the revenues of the Nawab of Arcot. In 1799 Veerapandiya Kattabomman, chief of Panchalankurichi, who had refused to pay tribute and whose men had killed a British officer at a meeting in Ramanathapuram, was besieged by Major John Bannerman. The fort held out against the first assault in September, but Kattabomman fled, was handed over by the Raja of Pudukkottai and was hanged at Kayathar on 16 October 1799. In 1800–1801 a wider league led by the Marudu brothers of Sivaganga, with Kattabomman’s brother Oomaithurai, chiefs in Dindigul and the Kongu country, and contacts as far as Malabar, rose again; in June 1801 the Marudu brothers issued a proclamation at Tiruchirappalli calling on all the people of the south to drive out the Company. After months of jungle fighting the Company took the rebuilt fort of Panchalankurichi in May 1801 and Kalayarkoil in October. The Marudu brothers were hanged at Tiruppattur on 24 October 1801 and Oomaithurai soon after. In the west Dheeran Chinnamalai fought on until he was captured and hanged at Sankagiri in July 1805. In July 1801 the Nawab of Arcot ceded the Carnatic to the Company, the polygars’ forts were pulled down and their armed retainers disbanded, and the palayams became zamindari estates. In Tamil Nadu these leaders are remembered as early fighters against British rule.
: Les guerres entre la Compagnie anglaise des Indes orientales et les palayakkarars (polygars), chefs héréditaires de domaines fortifiés du Sud tamoul, qui s’opposaient à la perception par la Compagnie des revenus du nabab d’Arcot. En 1799, Veerapandiya Kattabomman, chef de Panchalankurichi, qui avait refusé de payer le tribut et dont les hommes avaient tué un officier britannique lors d’une rencontre à Ramanathapuram, fut assiégé par le major John Bannerman. Le fort résista au premier assaut, en septembre, mais Kattabomman s’enfuit, fut livré par le raja de Pudukkottai et fut pendu à Kayathar le 16 octobre 1799. En 1800–1801, une ligue plus large, menée par les frères Marudu de Sivaganga, avec Oomaithurai, frère de Kattabomman, des chefs du Dindigul et du pays kongu, et des contacts jusqu’au Malabar, se souleva de nouveau ; en juin 1801, les frères Marudu publièrent à Tiruchirappalli une proclamation appelant tous les habitants du Sud à chasser la Compagnie. Après des mois de combats dans la jungle, la Compagnie prit le fort reconstruit de Panchalankurichi en mai 1801 et Kalayarkoil en octobre. Les frères Marudu furent pendus à Tiruppattur le 24 octobre 1801, et Oomaithurai peu après. À l’ouest, Dheeran Chinnamalai poursuivit la lutte jusqu’à sa capture ; il fut pendu à Sankagiri en juillet 1805. En juillet 1801, le nabab d’Arcot céda le Carnatic à la Compagnie, les forts des polygars furent démantelés, leurs hommes d’armes licenciés, et les palayams devinrent des domaines de zamindars. Au Tamil Nadu, la mémoire de ces chefs est celle de combattants de la première heure contre la domination britannique.
