"1757–1762": "1757–1762"
"In the Seven Years’ War Sweden joined France, Austria and Russia against Prussia, hoping to win back the Pomeranian lands lost in 1720. Swedish troops crossed into Prussian territory on 13 September 1757, but were driven back and blockaded in Stralsund until a Russian army came to their rescue in 1758.": "Dans les sept années de guerre la Suède rejoint la France, l’Autriche et la Russie contre la Prusse, espérant récupérer les terres Poméranies perdues en 1720. Les troupes suédoises franchissent le territoire prussien le 13 septembre 1757, mais sont repoussées et bloquées à Stralsund jusqu’à ce qu’une armée russe vienne à leur secours en 1758."
"The war went back and forth across Pomerania, Brandenburg and Mecklenburg in small battles such as Tornow and Fehrbellin in September 1758, and Swedish ships beat a Prussian flotilla on the Stettin Lagoon in 1759. When Russia made peace and allied with Prussia in May 1762, Sweden had to give up. The Treaty of Hamburg on 22 May 1762 restored the pre-war borders.": "La guerre traversa la Poméranie, le Brandebourg et le Mecklembourg dans de petites batailles comme Tornow et Fehrbellin en septembre 1758, et des navires suédois battèrent une flottille prussienne sur la lagune Stettin en 1759. Lorsque la Russie fit la paix et s’allia avec la Prusse en mai 1762, la Suède dut abandonner. Le traité de Hambourg le 22 mai 1762 rétablit les frontières d’avant-guerre."
