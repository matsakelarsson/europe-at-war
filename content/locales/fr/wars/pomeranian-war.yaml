"Pomeranian War": "Guerre de Poméranie"
"Sweden’s part in the Seven Years’ War: it joined France, Austria and Russia against Prussia, hoping to regain the Pomeranian lands lost in 1720. Five years of inconclusive fighting in Pomerania and Brandenburg ended with the Treaty of Hamburg in 1762, which restored the pre-war borders.": "La Suède participe à la guerre de Sept Ans : elle rejoint la France, l’Autriche et la Russie contre la Prusse, espérant retrouver les terres Poméranies perdues en 1720. Cinq années de combats non concluants en Poméranie et Brandebourg se terminent par le traité de Hambourg en 1762, qui rétablit les frontières d’avant-guerre."
