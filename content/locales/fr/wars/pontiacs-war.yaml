# French translations of the catalogue text (wave 14); step bodies follow later.
Pontiac’s War: Guerre de Pontiac
? "A war in which a loose confederacy of the Native nations of the Great Lakes, the Ohio country and the Illinois country rose against British rule after the fall of New France. Britain had taken over the French posts, and its commander, Jeffery Amherst, cut back the gifts and the gunpowder that the alliance with France had provided, while British traders and settlers pressed west and the Lenape prophet Neolin called for a return to the old ways and the expulsion of the British. In May 1763 the Odawa leader Pontiac besieged Detroit, and within weeks Wendat, Potawatomi, Miami, Wea, Ojibwe and Seneca warriors had taken eight British forts, while Lenape and Shawnee war parties drove thousands of settlers from the frontier of Pennsylvania, Maryland and Virginia. Detroit, Fort Pitt and Niagara held. Henry Bouquet won at Bushy Run in August 1763, but the Seneca destroyed a convoy at Devil’s Hole, Pontiac’s men beat a sortie from Detroit at Bloody Run, and at Fort Pitt the British gave Lenape envoys blankets from their smallpox hospital. The Royal Proclamation of October 1763 reserved the land west of the Appalachians for the Native nations. Peace came by stages: Johnson’s congress at Niagara in 1764, Bouquet’s expedition to the Muskingum, which brought the return of over 200 captives, the British occupation of the Illinois country in 1765 and Pontiac’s treaty at Oswego in 1766. Apart from the Niagara portage, given up by the Seneca, no land was ceded, and Britain restored the gifts it had stopped."
: "Une guerre au cours de laquelle une confédération peu structurée des nations autochtones des Grands Lacs, du pays de l’Ohio et du pays des Illinois se souleva contre la domination britannique après la chute de la Nouvelle-France. La Grande-Bretagne avait repris les postes français, et son commandant, Jeffery Amherst, réduisit les présents et la poudre que fournissait l’alliance avec la France, tandis que marchands et colons britanniques avançaient vers l’ouest et que le prophète lenape Neolin appelait à revenir aux anciennes coutumes et à chasser les Britanniques. En mai 1763, le chef outaouais Pontiac assiégea Détroit et, en quelques semaines, des guerriers wendats, potawatomis, miamis, weas, ojibwés et senecas prirent huit forts britanniques, tandis que des partis de guerre lenapes et shawnees chassaient des milliers de colons de la frontière de la Pennsylvanie, du Maryland et de la Virginie. Détroit, Fort Pitt et Niagara tinrent bon. Henry Bouquet l’emporta à Bushy Run en août 1763, mais les Senecas détruisirent un convoi à Devil’s Hole, les hommes de Pontiac battirent une sortie de la garnison de Détroit à Bloody Run et, à Fort Pitt, les Britanniques donnèrent à des envoyés lenapes des couvertures provenant de leur hôpital de varioleux. La Proclamation royale d’octobre 1763 réserva aux nations autochtones les terres situées à l’ouest des Appalaches. La paix vint par étapes : le congrès réuni par Johnson à Niagara en 1764, l’expédition de Bouquet vers la Muskingum, qui obtint la restitution de plus de 200 captifs, l’occupation britannique du pays des Illinois en 1765 et le traité conclu par Pontiac à Oswego en 1766. Hormis le portage du Niagara, abandonné par les Senecas, aucune terre ne fut cédée, et la Grande-Bretagne rétablit les présents qu’elle avait supprimés."
