# French translations of the catalogue text (wave 13); step bodies follow later.
Pool War: Guerre du Pool
A conflict in the Pool department of the Republic of the Congo, around Brazzaville, between the government and the Ninja militia of Frédéric Bintsamou, known as Pastor Ntumi. A 2015 referendum allowed President Denis Sassou Nguesso to run again, and his re-election in March 2016 was rejected by the opposition. On 4 April 2016 armed men attacked police and military posts in the southern quarters of Brazzaville; the government blamed Ntumi’s Ninjas, who denied it, and the army bombed and attacked their strongholds in the Pool. The Ninjas attacked trains and cut the railway between Brazzaville and Pointe-Noire, and in April 2017 killed 18 soldiers. The Pool was closed to journalists and aid workers for long periods; at least 115 people were killed, and estimates of the displaced range from about 13,000 to more than 100,000. A ceasefire signed on 23 December 2017 provided for the Ninjas’ disarmament and the reopening of the railway, which resumed service in November 2018.: Un conflit dans le département du Pool, en République du Congo, autour de Brazzaville, entre le gouvernement et la milice des Ninjas de Frédéric Bintsamou, dit le pasteur Ntumi. Un référendum organisé en 2015 permit au président Denis Sassou Nguesso de se représenter, et sa réélection en mars 2016 fut rejetée par l’opposition. Le 4 avril 2016, des hommes armés attaquèrent des postes de police et des postes militaires dans les quartiers sud de Brazzaville ; le gouvernement en attribua la responsabilité aux Ninjas de Ntumi, qui démentirent, et l’armée bombarda et attaqua leurs bastions dans le Pool. Les Ninjas attaquèrent des trains et coupèrent la voie ferrée entre Brazzaville et Pointe-Noire et, en avril 2017, tuèrent 18 soldats. Le Pool resta fermé aux journalistes et aux humanitaires pendant de longues périodes ; au moins 115 personnes furent tuées, et les estimations du nombre de déplacés vont d’environ 13 000 à plus de 100 000. Un cessez-le-feu signé le 23 décembre 2017 prévoyait le désarmement des Ninjas et la réouverture de la voie ferrée, dont le trafic reprit en novembre 2018.
