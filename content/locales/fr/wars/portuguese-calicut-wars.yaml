# French translations of the catalogue text (wave 8); step bodies follow later.
Portuguese–Calicut wars: Guerres entre le Portugal et Calicut
The wars between Portugal and the Zamorin of Calicut, the ruler of the greatest pepper port on the Malabar Coast, which began when Pedro Álvares Cabral bombarded Calicut in December 1500 and made an alliance with its rival Cochin. Vasco da Gama returned in 1502 with a war fleet and burned a pilgrim ship with hundreds aboard. The Zamorin’s armies burned Cochin in 1503 but were held off at its fords in 1504 by Duarte Pacheco Pereira’s small garrison, and Portuguese fleets beat Calicut’s at Cannanore (1506) and elsewhere. Albuquerque’s assault on Calicut failed in 1510, but the Portuguese blockade forced a peace in 1513 that gave Portugal a fortress there. War broke out again in the 1520s; the Zamorin took the fort at Calicut in 1526, and in 1531 the Portuguese built a new one at Chaliyam. Truces and wars followed for the rest of the century.: Les guerres entre le Portugal et le zamorin de Calicut, souverain du plus grand port du poivre de la côte de Malabar, qui commencèrent lorsque Pedro Álvares Cabral bombarda Calicut en décembre 1500 et s’allia avec sa rivale, Cochin. Vasco de Gama revint en 1502 avec une flotte de guerre et incendia un navire de pèlerins avec des centaines de personnes à bord. Les armées du zamorin incendièrent Cochin en 1503, mais furent tenues en échec à ses gués en 1504 par la petite garnison de Duarte Pacheco Pereira, et les flottes portugaises battirent celles de Calicut à Cannanore (1506) et ailleurs. L’assaut d’Albuquerque contre Calicut échoua en 1510, mais le blocus portugais imposa en 1513 une paix qui donna au Portugal une forteresse dans la ville. La guerre reprit dans les années 1520 ; le zamorin prit le fort de Calicut en 1526 et, en 1531, les Portugais en construisirent un nouveau à Chaliyam. Trêves et guerres se succédèrent jusqu’à la fin du siècle.
