# French translations of the catalogue text (wave 13); step bodies follow later.
Portuguese campaigns in Guinea: Campagnes portugaises en Guinée
? The wars by which Portugal turned a handful of trading posts on the rivers of Guinea into the colony of Portuguese Guinea, today’s Guinea-Bissau. For centuries Portugal had held only forts and river towns such as Cacheu, Bissau and Bolama, often paying the surrounding Papel, Manjaco, Balanta, Felupe (Jola) and Bijagó peoples for the right to trade, and these towns had been centres of the Atlantic slave trade. On 30 December 1878 a Portuguese force sent up the Cacheu river to punish the Felupe for an attack on the post of Bolol (Bolor) was almost wiped out, and the shock led Lisbon to separate Guinea from Cape Verde as a colony of its own in 1879, governed from Bolama. Between 1879 and 1891 gunboats and landing parties fought the coastal and river peoples; the convention with France of 12 May 1886 fixed the borders but gave up the Casamance. In 1892 Guinea became a military district, and the Muslim Fula rulers of the interior recognised Portuguese sovereignty in return for autonomy and supplied auxiliaries against their non-Muslim neighbours. Portugal called the campaigns that followed “pacification”. The most violent were those of Captain João Teixeira Pinto, who arrived in 1912 and from 1913 to 1915 used African soldiers and the irregulars of the Wolof war leader Abdul Injai to break resistance to the hut tax in Oio, among the Manjaco of the Cacheu region and among the Papel around Bissau, burning villages and seizing cattle; many people fled to Senegal or into the forests. The cost of his forces led to his recall in 1915, and a Portuguese lawyer later published a report on the killing of fleeing villagers by the irregulars. Abdul Injai, rewarded with power in Oio, ruled it almost independently until August 1919, when colonial troops defeated his force at Mansabá on 1–2 August and deported him to Cape Verde. Resistance continued in the north-west and the Bijagós islands in the 1920s and 1930s, and Portugal treated the conquest of Canhabaque in the Bijagós, after a campaign from November 1935 to February 1936, as the end of the occupation of the colony.
: Les guerres par lesquelles le Portugal fit d’une poignée de comptoirs établis sur les fleuves de Guinée la colonie de la Guinée portugaise, l’actuelle Guinée-Bissau. Pendant des siècles, le Portugal n’avait tenu que des forts et des villes fluviales comme Cacheu, Bissau et Bolama, payant souvent les peuples environnants, Papels, Manjaques, Balantes, Feloupes (Diolas) et Bijagos, pour le droit de commercer, et ces villes avaient été des centres de la traite atlantique. Le 30 décembre 1878, une force portugaise envoyée sur le Cacheu pour punir les Feloupes d’une attaque contre le poste de Bolol (Bolor) fut presque anéantie, et le choc conduisit Lisbonne à séparer la Guinée du Cap-Vert pour en faire une colonie distincte en 1879, administrée depuis Bolama. Entre 1879 et 1891, canonnières et détachements de débarquement combattirent les peuples de la côte et des fleuves ; la convention du 12 mai 1886 avec la France fixa les frontières, mais abandonna la Casamance. En 1892, la Guinée devint un district militaire, et les souverains peuls musulmans de l’intérieur reconnurent la souveraineté portugaise en échange de leur autonomie et fournirent des auxiliaires contre leurs voisins non musulmans. Le Portugal qualifia les campagnes qui suivirent de « pacification ». Les plus violentes furent celles du capitaine João Teixeira Pinto, arrivé en 1912, qui de 1913 à 1915 se servit de soldats africains et des irréguliers du chef de guerre wolof Abdul Injai pour briser la résistance à l’impôt de case dans l’Oio, chez les Manjaques de la région de Cacheu et chez les Papels des environs de Bissau, incendiant des villages et saisissant le bétail ; beaucoup de gens s’enfuirent au Sénégal ou dans les forêts. Le coût de ses forces entraîna son rappel en 1915, et un avocat portugais publia plus tard un rapport sur les meurtres de villageois en fuite commis par les irréguliers. Abdul Injai, récompensé par le pouvoir dans l’Oio, le gouverna de manière presque indépendante jusqu’en août 1919, lorsque les troupes coloniales battirent ses forces à Mansabá les 1er et 2 août et le déportèrent au Cap-Vert. La résistance se poursuivit dans le nord-ouest et dans l’archipel des Bijagos dans les années 1920 et 1930, et le Portugal considéra la conquête de Canhabaque, dans les Bijagos, au terme d’une campagne menée de novembre 1935 à février 1936, comme la fin de l’occupation de la colonie.
