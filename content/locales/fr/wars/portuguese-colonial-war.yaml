# Some French text was translated automatically.
"Portuguese Colonial War": "Guerre coloniale portugaise"
"The wars fought by Portugal’s Estado Novo dictatorship against independence movements in its African colonies, in Angola from 1961, Portuguese Guinea (Guinea-Bissau) from 1963 and Mozambique from 1964. Portugal held most of the territory with large conscript armies, by one count mobilising some 1.4 million men for military and support service over the years, but the guerrillas of the MPLA, FNLA and UNITA in Angola, the PAIGC in Guinea and FRELIMO in Mozambique could not be defeated. Weariness with the war led army officers to overthrow the regime in the Carnation Revolution of 25 April 1974, and all five African colonies became independent in 1974–1975.": "Les guerres menées par le Portugal Estado Novo dictature contre les mouvements d’indépendance dans ses colonies africaines, en Angola de 1961, en Guinée portugaise (Guinée-Bissau) de 1963 et au Mozambique de 1964. Le Portugal détenait la plus grande partie du territoire avec de grandes armées conscrites, d’un chef mobilisant environ 1,4 million d’hommes pour le service militaire et de soutien au fil des ans, mais les guérilleros du MPLA, de la FNLA et de l’UNITA en Angola, du PAIGC en Guinée et du FRELIMO au Mozambique n’ont pu être vaincus. La fatigue avec la guerre a conduit les officiers de l’armée à renverser le régime dans la révolution des œillets du 25 avril 1974, et les cinq colonies africaines sont devenues indépendantes en 1974-1975."
"The fighting took place in Africa, outside the map. Portugal lost about 8,000–9,000 soldiers killed; losses among the guerrillas and especially civilians were far higher, with estimates of civilian deaths ranging from about 70,000 to 110,000. Atrocities were committed on all sides, among them the massacre of settlers and others by the UPA in northern Angola in March 1961 and the massacre of villagers by Portuguese troops at Wiriyamu in Mozambique in 1972.": "Les combats ont eu lieu en Afrique, hors de la carte. Le Portugal a perdu entre 8 000 et 9 000 soldats tués ; les pertes parmi les guérillas et surtout parmi les civils ont été beaucoup plus élevées, avec des estimations de morts civiles allant d’environ 70 000 à 110 000. Des atrocités ont été commises de toutes parts, notamment le massacre de colons et autres par l’UPA dans le nord de l’Angola en mars 1961 et le massacre de villageois par des troupes portugaises à Wiriyamu au Mozambique en 1972."
