# French translations of the catalogue text (wave 8); step bodies follow later.
Portuguese conquest of Goa: Conquête portugaise de Goa
? The capture of Goa, the main port of the Bijapur Sultanate on India’s west coast, by Afonso de Albuquerque, governor of Portuguese India. Encouraged by Timoji, a Hindu privateer, and taking advantage of the recent death of Bijapur’s founder, Yusuf Adil Shah, Albuquerque sailed into the Mandovi river and took the fort of Pangim on 16 February 1510; the next day he occupied Goa without a fight. In May the new sultan, Ismail Adil Shah, sent an army of tens of thousands under Pulad Khan across the Banastarim ford, and on 31 May the Portuguese abandoned the city, killing many of its Muslim inhabitants as they left. Trapped at the river mouth by the monsoon, they sailed south in August. On 25 November 1510, St Catherine’s Day, Albuquerque returned with about 1,700 men and 34 ships and stormed Goa. The Portuguese lost about 50 dead; Albuquerque himself wrote that some 6,000 Muslim defenders and townspeople were killed. Bijapur tried to retake Goa in 1511–1512 and failed. It became the capital of Portuguese India in 1530 and stayed Portuguese until India annexed it in 1961.
: La prise de Goa, principal port du sultanat de Bijapur sur la côte occidentale de l’Inde, par Afonso de Albuquerque, gouverneur de l’Inde portugaise. Encouragé par Timoji, un corsaire hindou, et profitant de la mort récente du fondateur du sultanat de Bijapur, Yusuf Adil Shah, Albuquerque remonta le fleuve Mandovi et prit le fort de Pangim le 16 février 1510 ; le lendemain, il occupa Goa sans combat. En mai, le nouveau sultan, Ismail Adil Shah, envoya une armée de plusieurs dizaines de milliers d’hommes, commandée par Pulad Khan, franchir le gué de Banastarim et, le 31 mai, les Portugais abandonnèrent la ville, tuant en partant nombre de ses habitants musulmans. Bloqués à l’embouchure du fleuve par la mousson, ils firent voile vers le sud en août. Le 25 novembre 1510, jour de la Sainte-Catherine, Albuquerque revint avec environ 1 700 hommes et 34 navires et prit Goa d’assaut. Les Portugais eurent environ 50 tués ; Albuquerque écrivit lui-même que quelque 6 000 défenseurs et habitants musulmans avaient été tués. Bijapur tenta en vain de reprendre Goa en 1511–1512. La ville devint la capitale de l’Inde portugaise en 1530 et resta portugaise jusqu’à son annexion par l’Inde en 1961.
