# French translations of the catalogue text (wave 7); step bodies follow later.
Portuguese conquest of Hormuz: Conquête portugaise d’Ormuz
Afonso de Albuquerque’s campaigns to bring the island kingdom of Hormuz, which controlled the trade between India, Persia and Arabia at the mouth of the Persian Gulf, under Portuguese control. In 1507 his small squadron sacked Qurayyat, Muscat and Khor Fakkan on the Omani coast, a dependency of Hormuz, and forced the king of Hormuz to accept Portuguese overlordship, but the mutiny of his captains forced him to leave early in 1508. In 1515 he returned with a larger fleet, had the strongman of Hormuz killed and built a fortress there. Hormuz, with the ports of Oman, stayed a Portuguese protectorate until 1622.: Les campagnes menées par Afonso de Albuquerque pour placer sous contrôle portugais le royaume insulaire d’Ormuz, qui commandait le commerce entre l’Inde, la Perse et l’Arabie à l’entrée du golfe Persique. En 1507, sa petite escadre mit à sac Qurayyat, Mascate et Khor Fakkan, sur la côte omanaise, qui dépendait d’Ormuz, et contraignit le roi d’Ormuz à accepter la suzeraineté portugaise, mais la mutinerie de ses capitaines l’obligea à repartir au début de 1508. En 1515, il revint avec une flotte plus nombreuse, fit tuer l’homme fort d’Ormuz et y construisit une forteresse. Ormuz et les ports d’Oman restèrent un protectorat portugais jusqu’en 1622.
