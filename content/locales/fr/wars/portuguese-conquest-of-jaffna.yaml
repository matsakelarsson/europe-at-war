# French translations of the catalogue text (wave 8); step bodies follow later.
Portuguese conquest of the Jaffna Kingdom: Conquête portugaise du royaume de Jaffna
? The Portuguese conquest of the Tamil kingdom of Jaffna in the north of Sri Lanka. A first expedition under the viceroy Constantino de Bragança in 1560 took the capital, Nallur, but could not hold it and withdrew, keeping only the island of Mannar. In 1591 an expedition from Goa under André Furtado de Mendonça defeated and killed King Puviraja Pandaram and put his son Ethirimana Cinkam on the throne as a vassal paying tribute. After his death in 1617, his nephew Cankili II seized power by killing the regent and other princes, refused to pay tribute, and relied on troops sent by Raghunatha Nayak of Thanjavur. In 1619 two Portuguese expeditions were sent against him; a naval force was beaten off, but a land army of about 5,000 under Phillippe de Oliveira defeated him and annexed the kingdom. Cankili was taken to Goa, tried for treason and executed, in 1621 according to the chronicler Queiroz. Risings in the 1620s, some backed by the Thanjavur Nayak, were put down, and the Portuguese ruled Jaffna until the Dutch took it in 1658.
: La conquête par les Portugais du royaume tamoul de Jaffna, dans le nord du Sri Lanka. Une première expédition conduite par le vice-roi Constantino de Bragança prit en 1560 la capitale, Nallur, mais ne put la tenir et se retira, ne conservant que l’île de Mannar. En 1591, une expédition partie de Goa sous les ordres d’André Furtado de Mendonça vainquit et tua le roi Puviraja Pandaram et plaça sur le trône son fils Ethirimana Cinkam, comme vassal tributaire. Après la mort de celui-ci en 1617, son neveu Cankili II s’empara du pouvoir en tuant le régent et d’autres princes, refusa de payer le tribut et s’appuya sur des troupes envoyées par Raghunatha Nayak de Thanjavur. En 1619, deux expéditions portugaises furent envoyées contre lui ; une force navale fut repoussée, mais une armée de terre d’environ 5 000 hommes commandée par Phillippe de Oliveira le vainquit et annexa le royaume. Cankili fut emmené à Goa, jugé pour trahison et exécuté, en 1621 selon le chroniqueur Queiroz. Des soulèvements dans les années 1620, dont certains soutenus par le nayak de Thanjavur, furent réprimés, et les Portugais gouvernèrent Jaffna jusqu’à sa prise par les Hollandais en 1658.
