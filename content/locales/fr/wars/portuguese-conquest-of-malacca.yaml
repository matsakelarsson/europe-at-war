# French translations of the catalogue text (wave 11); step bodies follow later.
Portuguese conquest of Malacca: Conquête de Malacca par les Portugais
? The Portuguese capture of Malacca, the greatest port of Southeast Asia, and Sultan Mahmud Shah’s fifteen-year war to win it back. Malacca, a Muslim sultanate founded around 1400, controlled the strait through which the trade between India and China passed, and ruled much of the Malay Peninsula and parts of the east coast of Sumatra. In 1509 Mahmud Shah received a Portuguese trading mission under Diogo Lopes de Sequeira, then, urged on by Gujarati and Javanese merchants who feared Portuguese competition, attacked it and held about twenty men prisoner. In 1511 Afonso de Albuquerque, governor of Portuguese India, came with 18 ships and about 1,000 men, stormed the city in two assaults on 25 July and in August, and after ten days of bombardment took it on 24 August. The city was plundered, and Albuquerque built the fortress later called A Famosa. Mahmud Shah fought on from the Muar river, from Pahang and from Bintan, at the head of a league of former vassals, besieging Malacca in 1518 and 1524, while a Javanese fleet under Pati Unus of Japara attacked it in 1513. In 1526 the Portuguese destroyed his capital on Bintan, and he died in exile at Kampar in Sumatra in 1528. His sons founded the sultanates of Johor and Perak, which, with Aceh, fought the Portuguese at Malacca for another century.
: La prise de Malacca, le plus grand port d’Asie du Sud-Est, par les Portugais, et la guerre de quinze ans menée par le sultan Mahmud Shah pour la reconquérir. Malacca, un sultanat musulman fondé vers 1400, contrôlait le détroit par lequel passait le commerce entre l’Inde et la Chine, et dominait une grande partie de la péninsule Malaise et certaines parties de la côte orientale de Sumatra. En 1509, Mahmud Shah reçut une mission commerciale portugaise conduite par Diogo Lopes de Sequeira, puis, poussé par des marchands gujaratis et javanais qui craignaient la concurrence portugaise, l’attaqua et retint une vingtaine d’hommes prisonniers. En 1511, Afonso de Albuquerque, gouverneur de l’Inde portugaise, vint avec 18 navires et environ 1 000 hommes, donna deux assauts à la ville, le 25 juillet et en août, et la prit le 24 août après dix jours de bombardement. La ville fut pillée, et Albuquerque fit construire la forteresse appelée plus tard A Famosa. Mahmud Shah poursuivit la lutte depuis la rivière Muar, depuis Pahang et depuis Bintan, à la tête d’une ligue d’anciens vassaux, assiégeant Malacca en 1518 et en 1524, tandis qu’une flotte javanaise conduite par Pati Unus de Japara l’attaquait en 1513. En 1526, les Portugais détruisirent sa capitale sur Bintan, et il mourut en exil à Kampar, à Sumatra, en 1528. Ses fils fondèrent les sultanats de Johor et de Perak, qui, avec Aceh, combattirent les Portugais à Malacca pendant encore un siècle.
