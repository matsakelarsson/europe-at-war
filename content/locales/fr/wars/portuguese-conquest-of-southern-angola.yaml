# French translations of the catalogue text (wave 13); step bodies follow later.
Portuguese conquests in Angola: Conquêtes portugaises en Angola
? "The wars by which Portugal brought the central highlands, the south and the Dembos hills of Angola under its rule. The Berlin agreements of 1884–1885 had given Portugal a claim to the whole of Angola, but in 1900 its rule beyond the coast and a chain of forts was thin. On the Benguela highlands, where the Ovimbundu kingdoms had grown rich on the caravan trade in slaves, ivory, wax and rubber, Portuguese troops had deposed the king of Bié in 1890. When the price of rubber collapsed in 1902, the new king of Bailundo, Kalandula, crowned on 7 April 1902, quarrelled with the commander of the local fort over a trader’s debt claim against his councillor Mutu ya Kevela; on 15 May the Portuguese imprisoned Kalandula and his delegation, and the Bailundo war (the Bailundo revolt or Second Portuguese–Ovimbundu War) began. Mutu ya Kevela rallied Bié, Huambo and other Ovimbundu kingdoms and neighbouring peoples; up to 6,000 men besieged the Bailundo fort between May and July and attacked trading posts, killing about 20 Portuguese and 100 African loyalists, until three columns of Portuguese, African and Boer troops with repeating rifles and mountain guns relieved the fort in July and September. Mutu ya Kevela was killed on 4 August 1902, the kings began to surrender in large numbers at the end of September, and the last resistance was crushed on 22 March 1904; Ovimbundu losses were at least 2,000. In the south the Ovambo kingdoms of the Kunene valley, well armed with rifles bought from traders, resisted for longer: on 25 September 1904, at Vau de Pembe on the Kunene, Kwamato and Kwanyama fighters ambushed a Portuguese column of about 500 men and killed some 300. Portugal conquered Ombandja, the country of the Kwamato (Cuamato), in 1907, after the battle of Mufilo on 27 August, and Evale in 1912. In the First World War, after German troops from South West Africa defeated the Portuguese at Naulila on 18 December 1914, the Kwanyama king Mandume ya Ndemufayo, king since 1911, sacked the Portuguese fort at Kafima, and the whole Ovambo region rose, in a year of famine. A Portuguese army of about 5,000 under General António Pereira de Eça crossed the Kunene on 12 August 1915; at Mongua (Omongwa), on 18–20 August 1915, Mandume’s army attacked its camp for three days and was driven off, and on 2 September the Portuguese took Mandume’s capital, N’giva (Ondjiva). Mandume fought on from across the border until he was killed by South African troops on 6 February 1917, by machine-gun fire according to South African records and by his own hand according to Kwanyama oral tradition. In the north the Dembos, chiefdoms of the forested hills about 150 km north-east of Luanda, threw back repeated expeditions and were subdued only in campaigns of 1907–1910, begun under governor-general Henrique de Paiva Couceiro, although Portugal did not complete its occupation until 1917. Portuguese officers called these campaigns “pacification”; for the Ovimbundu, Ovambo and Dembos rulers they were wars to keep their independence, and Mandume is honoured as a national hero in both Angola and Namibia."
: "Les guerres par lesquelles le Portugal soumit à sa domination les hauts plateaux du centre, le sud et les collines des Dembos en Angola. Les accords de Berlin de 1884–1885 avaient donné au Portugal un titre sur l’ensemble de l’Angola, mais en 1900 son autorité au-delà de la côte et d’un chapelet de forts restait ténue. Sur les hauts plateaux de Benguela, où les royaumes ovimbundu s’étaient enrichis du commerce caravanier des esclaves, de l’ivoire, de la cire et du caoutchouc, les troupes portugaises avaient déposé le roi du Bié en 1890. Lorsque le prix du caoutchouc s’effondra en 1902, le nouveau roi du Bailundo, Kalandula, couronné le 7 avril 1902, se brouilla avec le commandant du fort local au sujet d’une créance qu’un marchand réclamait à son conseiller Mutu ya Kevela ; le 15 mai, les Portugais emprisonnèrent Kalandula et sa délégation, et la guerre du Bailundo (révolte du Bailundo ou deuxième guerre luso-ovimbundu) commença. Mutu ya Kevela rallia le Bié, le Huambo et d’autres royaumes ovimbundu ainsi que des peuples voisins ; jusqu’à 6 000 hommes assiégèrent le fort du Bailundo entre mai et juillet et attaquèrent des comptoirs, tuant une vingtaine de Portugais et une centaine d’Africains loyalistes, jusqu’à ce que trois colonnes de troupes portugaises, africaines et boers, dotées de fusils à répétition et de canons de montagne, dégagent le fort en juillet et en septembre. Mutu ya Kevela fut tué le 4 août 1902, les rois commencèrent à se rendre en grand nombre à la fin de septembre, et la dernière résistance fut écrasée le 22 mars 1904 ; les pertes ovimbundu s’élevèrent à au moins 2 000 hommes. Au sud, les royaumes ovambo de la vallée du Kunene, bien pourvus en fusils achetés à des marchands, résistèrent plus longtemps : le 25 septembre 1904, à Vau de Pembe, sur le Kunene, des combattants kwamato et kwanyama tendirent une embuscade à une colonne portugaise d’environ 500 hommes et en tuèrent quelque 300. Le Portugal conquit l’Ombandja, le pays des Kwamato (Cuamato), en 1907, après la bataille de Mufilo le 27 août, puis l’Evale en 1912. Pendant la Première Guerre mondiale, après que les troupes allemandes du Sud-Ouest africain eurent battu les Portugais à Naulila le 18 décembre 1914, le roi kwanyama Mandume ya Ndemufayo, sur le trône depuis 1911, saccagea le fort portugais de Kafima, et toute la région ovambo se souleva, au cours d’une année de famine. Une armée portugaise d’environ 5 000 hommes commandée par le général António Pereira de Eça franchit le Kunene le 12 août 1915 ; à Mongua (Omongwa), du 18 au 20 août 1915, l’armée de Mandume attaqua son camp pendant trois jours avant d’être repoussée et, le 2 septembre, les Portugais prirent la capitale de Mandume, N’giva (Ondjiva). Mandume poursuivit la lutte depuis l’autre côté de la frontière jusqu’à sa mort face aux troupes sud-africaines, le 6 février 1917 : il fut fauché par une mitrailleuse selon les archives sud-africaines, il se donna la mort selon la tradition orale kwanyama. Au nord, les Dembos, chefferies des collines boisées situées à environ 150 km au nord-est de Luanda, repoussèrent des expéditions répétées et ne furent soumis qu’au cours des campagnes de 1907–1910, lancées sous le gouverneur général Henrique de Paiva Couceiro, même si le Portugal n’acheva son occupation qu’en 1917. Les officiers portugais appelaient ces campagnes « pacification » ; pour les souverains ovimbundu, ovambo et dembos, c’étaient des guerres pour préserver leur indépendance, et Mandume est honoré comme un héros national en Angola comme en Namibie."
