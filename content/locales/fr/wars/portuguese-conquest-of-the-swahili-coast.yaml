# French translations of the catalogue text (wave 13); step bodies follow later.
Portuguese conquest of the Swahili coast: Conquête portugaise de la côte swahilie
? "The Portuguese campaigns that forced the Swahili city-states of East Africa into tribute in the first years of the sixteenth century. The towns of the coast, Muslim trading cities from Mogadishu to Sofala, lived on the Indian Ocean trade in gold, ivory and slaves from the interior and cloth, beads and porcelain from India and beyond. Vasco da Gama found an ally in Malindi in 1498 and frightened Kilwa into paying tribute in 1502; Zanzibar was bombarded into submission in 1503. In 1505 Francisco de Almeida, sailing to India as the first viceroy, sacked Kilwa on 24 July, built a fort there and set up a ruler of his own, then stormed and burned Mombasa in August. Pêro de Anaia built a fort at Sofala, the outlet of the gold of the Zimbabwe plateau, and in 1507 the Portuguese moved their main base to Mozambique Island. Tristão da Cunha and Afonso de Albuquerque sacked Oja and Barawa in 1507, and by 1509 most towns north of Mozambique paid tribute. The Portuguese gave up their fort at Kilwa in 1512. They held the sea and a few forts, but not the coast itself: Mombasa was rebuilt and defied them again, and only Malindi stayed their constant ally."
: "Les campagnes par lesquelles les Portugais contraignirent les cités-États swahilies d’Afrique de l’Est à leur payer tribut dans les premières années du XVIe siècle. Les villes de la côte, cités marchandes musulmanes de Mogadiscio à Sofala, vivaient du commerce de l’océan Indien : l’or, l’ivoire et les esclaves de l’intérieur, les tissus, les perles et la porcelaine de l’Inde et d’au-delà. Vasco de Gama trouva un allié à Malindi en 1498 et intimida Kilwa au point de lui faire payer tribut en 1502 ; Zanzibar fut soumise par un bombardement en 1503. En 1505, Francisco de Almeida, qui faisait route vers l’Inde comme premier vice-roi, mit Kilwa à sac le 24 juillet, y construisit un fort et y installa un souverain de son choix, puis prit d’assaut et incendia Mombasa en août. Pêro de Anaia construisit un fort à Sofala, débouché de l’or du plateau du Zimbabwe, et en 1507 les Portugais transférèrent leur base principale sur l’île de Mozambique. Tristão da Cunha et Afonso de Albuquerque saccagèrent Oja et Barawa en 1507 et, en 1509, la plupart des villes situées au nord de l’île de Mozambique payaient tribut. Les Portugais abandonnèrent leur fort de Kilwa en 1512. Ils tenaient la mer et quelques forts, mais non la côte elle-même : Mombasa fut reconstruite et les défia de nouveau, et seule Malindi resta leur alliée constante."
