# French translations of the catalogue text (wave 12); step bodies follow later.
Portuguese conquests in Morocco: Conquêtes portugaises au Maroc
"More than a century of Portuguese war on the coasts of Morocco after the capture of Ceuta in 1415. An attack on Tangier in 1437 ended in a humiliating capitulation, and Prince Ferdinand, left as a hostage, died a captive in Fez. Afonso V, “the African”, took Ksar es-Seghir in 1458 and, after failed attacks on Tangier in 1463–1464, stormed Asilah in August 1471 and occupied Tangier, while the Wattasid Muhammad al-Shaykh, fighting for Fez, made a truce with him. Under John II and Manuel I Portugal turned to the Atlantic coast, with its wheat, horses and cloth, and built or took forts at Santa Cruz do Cabo de Gué (Agadir, 1505), Safi (1508), Azemmour (1513) and Mazagan (1514). A disaster at Mamora in 1515 stopped the advance, and the rise of the Saadian sharifs, who preached holy war against the Portuguese from the Sous, turned it back: Agadir fell to the Saadians in 1541, after which Portugal abandoned Safi and Azemmour (1541), Ksar es-Seghir (1549) and Asilah (1550), keeping only Ceuta, Tangier and Mazagan.": "Plus d’un siècle de guerre portugaise sur les côtes du Maroc après la prise de Ceuta en 1415. Une attaque contre Tanger en 1437 se termina par une capitulation humiliante, et l’infant Ferdinand, laissé en otage, mourut captif à Fès. Alphonse V, « l’Africain », prit Ksar es-Seghir en 1458 et, après des attaques manquées contre Tanger en 1463–1464, prit Asilah d’assaut en août 1471 et occupa Tanger, tandis que le Wattasside Muhammad al-Shaykh, qui luttait pour Fès, concluait une trêve avec lui. Sous Jean II et Manuel Ier, le Portugal se tourna vers la côte atlantique, avec son blé, ses chevaux et ses étoffes, et bâtit ou prit des forts à Santa Cruz do Cabo de Gué (Agadir, 1505), Safi (1508), Azemmour (1513) et Mazagan (1514). Un désastre à Mamora en 1515 arrêta l’avance, et l’essor des chérifs saadiens, qui prêchaient depuis le Souss la guerre sainte contre les Portugais, la fit refluer : Agadir tomba aux mains des Saadiens en 1541, après quoi le Portugal abandonna Safi et Azemmour (1541), Ksar es-Seghir (1549) et Asilah (1550), ne gardant que Ceuta, Tanger et Mazagan."
