"At Coimbra, on 6 April 1385, the Cortes heard the lawyer João das Regras argue that neither Beatrice nor the sons of Ferdinand’s father by Inês de Castro had a valid claim, and proclaimed the Master of Aviz king as John I. In May a Castilian raiding force was beaten at Trancoso, and in June John I of Castile invaded with a large army, including French knights, and marched by Coimbra and Leiria towards Lisbon. On 14 August John of Aviz and Nuno Álvares, now his constable, barred its road at Aljubarrota, south of Leiria, with a few thousand Portuguese and some hundreds of English and Gascon soldiers, among them longbowmen.": "À Coimbra, le 6 avril 1385, les Cortes ont entendu l’avocat João das Regras argumenter que ni Béatrice ni les fils de Ferdinands père par Inês de Castro avaient une revendication valide, et a proclamé le maître du roi Aviz comme Jean Ier. En mai, une force de raid castillan a été battue à Trancoso et en juin, John Ier de Castille a envahi avec une grande armée, y compris des chevaliers français, et a marché par Coimbra et Leiria vers Lisbonne. Le 14 août, Jean d’Aviz et Nuno Álvares, maintenant son constable, barraient sa route à Aljubarrota, au sud de Leiria, avec quelques milliers de Portugais et quelques centaines de soldats anglais et gasconais, parmi lesquels des longbowmen."
"The Portuguese and English fought on foot behind ditches and pits on a narrow front. The French vanguard charged and was cut down, and prisoners taken from it were killed for fear of an attack from behind. When the main Castilian army came up late in the day it broke within about an hour, and many Castilian nobles were among the dead. John of Castile fled to Santarém and by sea to Seville. That October Nuno Álvares carried the war into Castile and won at Valverde. John I founded the monastery of Batalha near the battlefield, and in 1386 he made an alliance with England at Windsor.": "Les Portugais et les Anglais se sont battus à pied derrière des fossés et des fosses sur un front étroit. L’avant-garde française a accusé et a été abattu, et des prisonniers ont été enlevés de peur d’une attaque par derrière. Lorsque l’armée principale castillane est montée tard dans le jour où elle s’est rompue en environ une heure, et beaucoup de nobles castillan étaient parmi les morts. Jean de Castille a fui à Santarém et par la mer à Séville. En octobre, Nuno Álvares a porté la guerre en Castille et a gagné à Valverde. John Ier a fondé le monastère de Batalha près du champ de bataille, et en 1386 il a fait une alliance avec l’Angleterre à Windsor."
