"The succession war, also called the 1383–1385 Crisis, that followed the death of Ferdinand I of Portugal, whose only child, Beatrice, was married to John I of Castile. Fearing union with Castile, Lisbon and much of the country rallied to John, Master of the Order of Aviz, Ferdinand’s illegitimate half-brother. The Castilians failed to take Lisbon in 1384, the Cortes of Coimbra proclaimed the Master king as John I in 1385, and on 14 August 1385 he and his constable Nuno Álvares Pereira, with English help, routed the Castilian army at Aljubarrota, securing Portugal’s independence and the new house of Aviz. Border fighting went on until truces in 1389–1393 and a final peace in 1411.": "La guerre de succession, également appelée la crise 1383-1385, qui a suivi la mort de Ferdinand Ier du Portugal, dont l’enfant unique, Béatrice, était marié à Jean Ier de Castille. Crainsant union avec la Castille, Lisbonne et une grande partie du pays se sont ralliés à John, maître de l’Ordre d’Aviz, Ferdinands demi-frère illégitime. Les Castiliens n’ont pas pris Lisbonne en 1384, les Cortes de Coimbra ont proclamé le roi maître comme Jean Ier en 1385, et le 14 août 1385, lui et son constable Nuno Álvares Pereira, avec l’aide anglaise, a dirigé l’armée castilienne à Aljubarrota, assurant l’indépendance du Portugal et la nouvelle maison d’Aviz. Les combats aux frontières se poursuivent jusqu’aux trêves en 1389–1393 et à la paix finale en 1411."
"The main account is the chronicle of Fernão Lopes, written for the house of Aviz some fifty years later. Many Portuguese nobles and towns took Beatrice’s side, so this was a civil war as well as a war with Castile.": "Le récit principal est la chronique de Fernão Lopes, écrite pour la maison d’Aviz une cinquantaine d’années plus tard. Beaucoup de nobles et de villes portugaises ont pris le côté de Béatrice, il s’agissait donc d’une guerre civile ainsi que d’une guerre avec la Castille."
"The chronicles say John I of Castile invaded in 1385 with 31,000 men; modern estimates are lower, but his army was much larger than the Portuguese one.": "Les chroniques disent que Jean Ier de Castille envahit en 1385 avec 31 000 hommes ; les estimations modernes sont plus basses, mais son armée était beaucoup plus grande que celle portugaise."
"Dates are Julian.": "Les dates sont Julian."
