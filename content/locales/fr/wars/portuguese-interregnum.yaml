"Ferdinand I of Portugal died on 22 October 1383, leaving one child, Beatrice, who that May had married John I of Castile. By the marriage treaty her mother, Queen Leonor Teles, became regent until Beatrice had a son old enough to reign. Many Portuguese, above all in Lisbon and Porto, feared that Portugal would be swallowed by Castile, and the queen and her favourite, the Galician-born Count João Fernandes Andeiro, were widely hated. On 6 December John, Master of the Order of Aviz, Ferdinand’s illegitimate half-brother, killed Andeiro in the palace, and Lisbon made him Defender of the Realm.": "Ferdinand Ier, du Portugal, mourut le 22 octobre 1383, laissant un enfant, Béatrice, qui ce mai avait épousé Jean Ier de Castille. Par le traité de mariage sa mère, la reine Léonor Teles, devint régente jusqu’à ce que Béatrice eut un fils assez vieux pour régner. Beaucoup de Portugais, surtout à Lisbonne et Porto, craignaient que le Portugal ne soit avalé par la Castille, et la reine et son préféré, le comte de Galice João Fernandes Andeiro, étaient largement détestés. Le 6 décembre, Jean, maître de l’Ordre d’Aviz, demi-frère illégitime de Ferdinand, a tué Andeiro dans le palais, et Lisbonne en a fait le défenseur du Royaume."
"Leonor called on her son-in-law, and John I of Castile entered Portugal and took over the regency; much of the nobility and many towns sided with him. On 6 April 1384 the Master’s young commander, Nuno Álvares Pereira, beat a Castilian force at Atoleiros, his men fighting on foot as the English did. From May the Castilians besieged Lisbon by land and from the Tagus. A Portuguese fleet from Porto fought its way through with food in July, and hunger in the Castilian camp was followed by plague. On 3 September John of Castile lifted the siege and went home.": "Leonor fit appel à son gendre, et Jean Ier de Castille entra au Portugal et prit la relève ; une grande partie de la noblesse et beaucoup de villes se rallièrent à lui. Le 6 avril 1384, le jeune commandant du Maître, Nuno Álvares Pereira, battit une force castillanienne à Atoleiros, ses hommes combattant à pied comme les Anglais. De mai les Castiliens assiégèrent Lisbonne par terre et du Tage. Une flotte portugaise de Porto se battit avec la nourriture en juillet, et la faim dans le camp castillan fut suivie par la peste. Le 3 septembre, Jean de Castille souleva le siège et rentra chez lui."
