# French translations of the catalogue text (wave 8); step bodies follow later.
Portuguese–Maratha war (1737–1740): Guerre entre Portugais et Marathes (1737–1740)
The war in which the Marathas under Chimaji Appa, brother of the Peshwa Baji Rao I, conquered the Portuguese Northern Province, the coastal strip north of Bombay that Portugal had held for two hundred years. In 1737 the Marathas took the island fort of Arnala, Thane and most of Salsette island. In 1738–1739 they captured the forts of the coast up to Daman one after another and besieged Bassein, the capital of the province, which surrendered on 16 May 1739 after a three-month siege and costly assaults. Another Maratha army attacked the outer districts of Goa itself. By the peace of 1740, mediated by the English at Bombay, Portugal also gave up Chaul, keeping only Daman, Diu and Goa on the Indian coast.: La guerre au cours de laquelle les Marathes, commandés par Chimaji Appa, frère du peshwa Baji Rao Ier, conquirent la Province du Nord de l’Inde portugaise, la bande côtière au nord de Bombay que le Portugal tenait depuis deux cents ans. En 1737, les Marathes prirent le fort insulaire d’Arnala, Thane et la majeure partie de l’île de Salsette. En 1738–1739, ils s’emparèrent l’un après l’autre des forts de la côte jusqu’à Daman et assiégèrent Bassein, capitale de la province, qui capitula le 16 mai 1739 après un siège de trois mois et des assauts coûteux. Une autre armée marathe attaqua les districts extérieurs de Goa même. Par la paix de 1740, conclue grâce à la médiation des Anglais de Bombay, le Portugal céda également Chaul, ne conservant que Daman, Diu et Goa sur la côte indienne.
