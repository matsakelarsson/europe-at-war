# French translations of the catalogue text (wave 13); step bodies follow later.
Portuguese–Mutapa wars: Guerres entre le Portugal et le Mutapa
? "More than a century of Portuguese attempts to reach and control the gold of the Zimbabwe plateau, and of resistance by its rulers. The Portuguese, established at Sofala and Mozambique Island since the early 1500s and as traders at Sena and Tete on the Zambezi, sent Francisco Barreto with a royal army in 1569 to conquer the mines of the Mwenemutapa, the ruler of the kingdom of Mutapa; disease and the Tonga peoples of the Zambezi valley destroyed the expedition, and his successor Vasco Fernandes Homem found only modest gold workings in Manyika. In the 1600s the Portuguese exploited Mutapa’s succession wars: Gatsi Rusere granted them the mines for help against rebels, and in 1629 they drove out the Mwenemutapa Kapararidze and made his rival Mavura sign a treaty of vassalage to the Portuguese crown. Portuguese traders and backland adventurers then spread over the plateau, living at trading fairs such as Masapa and Dambarare. Their power there was broken by Changamire Dombo, the founder of the Rozvi state, who defeated a Portuguese army at Maungwe in about 1684, sacked Dambarare in 1693 and drove the Portuguese from the plateau; they kept only the Zambezi towns and, later, the fairs of Manyika and Zumbo."
: "Plus d’un siècle de tentatives portugaises pour atteindre et contrôler l’or du plateau du Zimbabwe, et de résistance de ses souverains. Les Portugais, établis à Sofala et sur l’île de Mozambique depuis le début du XVIe siècle et présents comme marchands à Sena et Tete sur le Zambèze, envoyèrent en 1569 Francisco Barreto à la tête d’une armée royale pour conquérir les mines du Mwenemutapa, le souverain du royaume du Mutapa ; la maladie et les peuples tonga de la vallée du Zambèze anéantirent l’expédition, et son successeur Vasco Fernandes Homem ne trouva que de modestes exploitations aurifères dans le Manyika. Au XVIIe siècle, les Portugais tirèrent parti des guerres de succession du Mutapa : Gatsi Rusere leur concéda les mines en échange de leur aide contre des rebelles et, en 1629, ils chassèrent le Mwenemutapa Kapararidze et firent signer à son rival Mavura un traité de vassalité envers la couronne portugaise. Marchands portugais et aventuriers de l’arrière-pays se répandirent alors sur le plateau, vivant dans des foires de traite comme Masapa et Dambarare. Leur puissance y fut brisée par Changamire Dombo, le fondateur de l’État rozvi, qui vainquit une armée portugaise à Maungwe vers 1684, mit à sac Dambarare en 1693 et chassa les Portugais du plateau ; ils ne conservèrent que les villes du Zambèze et, plus tard, les foires du Manyika et de Zumbo."
