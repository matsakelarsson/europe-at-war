# French translations of the catalogue text (wave 13); step bodies follow later.
Portuguese–Ndongo wars: Guerres entre le Portugal et le Ndongo
? "The near-century of wars by which Portugal turned its trading post at Luanda into the colony of Angola and destroyed the Mbundu kingdom of Ndongo, whose kings bore the title ngola. Paulo Dias de Novais, sent to found a colony, landed in 1575, and war broke out in 1579 when the ngola had the Portuguese at his capital, Kabasa, killed. With few soldiers of their own, the Portuguese fought with the levies of African lords (sobas) who submitted to them and, from about 1615, with the Imbangala, warrior bands from south of the Kwanza. They built a line of forts up the Kwanza (Massangano, Cambambe, Ambaca) and in 1618–1619 sacked Kabasa. Ndongo’s great war leader was Njinga (Nzinga) Mbande, who negotiated peace in Luanda in 1622, took power in 1624 and fought Portugal and its puppet king of Ndongo, based at the rock fortress of Pungo Andongo, from 1626. Driven out, she conquered the kingdom of Matamba, allied with the Dutch when they took Luanda in 1641 and won at Kombi in 1647, before the Portuguese recovered Luanda in 1648; in 1656 she made peace as queen of Matamba. In 1671 the Portuguese stormed Pungo Andongo, whose king had turned against them, and annexed what remained of Ndongo; Matamba accepted Portuguese overlordship in 1683. The wars were above all slave wars: captives taken by the Portuguese, their allies and their enemies made Luanda one of the largest slave ports of the Atlantic, from which hundreds of thousands of people were shipped, most of them to Brazil."
: "Les guerres, longues de près d’un siècle, par lesquelles le Portugal fit de son comptoir de Luanda la colonie de l’Angola et détruisit le royaume mbundu du Ndongo, dont les rois portaient le titre de ngola. Paulo Dias de Novais, envoyé pour fonder une colonie, débarqua en 1575, et la guerre éclata en 1579 lorsque le ngola fit tuer les Portugais présents dans sa capitale, Kabasa. Disposant de peu de soldats, les Portugais combattirent avec les levées des seigneurs africains (sobas) qui s’étaient soumis à eux et, à partir de 1615 environ, avec les Imbangala, bandes guerrières venues du sud du Kwanza. Ils élevèrent une ligne de forts en remontant le Kwanza (Massangano, Cambambe, Ambaca) et mirent Kabasa à sac en 1618–1619. La grande figure militaire du Ndongo fut Njinga (Nzinga) Mbande, qui négocia la paix à Luanda en 1622, prit le pouvoir en 1624 et combattit à partir de 1626 le Portugal et le roi fantoche que celui-ci avait placé à la tête du Ndongo, établi dans la forteresse rocheuse de Pungo Andongo. Chassée, elle conquit le royaume du Matamba, s’allia aux Hollandais lorsqu’ils prirent Luanda en 1641 et l’emporta à Kombi en 1647, avant que les Portugais ne reprennent Luanda en 1648 ; en 1656, elle fit la paix en tant que reine du Matamba. En 1671, les Portugais prirent d’assaut Pungo Andongo, dont le roi s’était retourné contre eux, et annexèrent ce qui restait du Ndongo ; le Matamba accepta la suzeraineté portugaise en 1683. Ces guerres furent avant tout des guerres de capture d’esclaves : les captifs faits par les Portugais, par leurs alliés et par leurs ennemis firent de Luanda l’un des plus grands ports négriers de l’Atlantique, d’où des centaines de milliers de personnes furent embarquées, pour la plupart vers le Brésil."
