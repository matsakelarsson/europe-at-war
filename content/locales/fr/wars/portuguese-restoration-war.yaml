Montes Claros and the Treaty of Lisbon: Montes Claros et le traité de Lisbonne
1664–1668: 1664–1668
In the north, on 7 July 1664, Pedro Jacques de Magalhães beat the Duke of Osuna, who was besieging Castelo Rodrigo, near the border of Beira. In June 1665 a new Spanish commander, the Marquis of Caracena, marched into the Alentejo with some 23,000 men and took the town of Vila Viçosa, though its citadel held out. On 17 June the Portuguese army under Meneses, now Marquis of Marialva, and Schomberg met him at Montes Claros, between Vila Viçosa and Estremoz. Their infantry and guns threw back repeated cavalry charges, and the Spanish army was destroyed.: Dans le nord, le 7 juillet 1664, Pedro Jacques de Magalhães battit le duc d’Osuna, qui assiégeait Castelo Rodrigo, près de la frontière de Beira. En juin 1665, un nouveau commandant espagnol, le marquis de Caracéna, marcha dans l’Alentejo avec quelque 23 000 hommes et prit la ville de Vila Viçosa, bien que sa citadelle fût tenue. Le 17 juin, l’armée portugaise sous Meneses, aujourd'hui marquise de Marialva, et Schomberg le rencontrèrent à Montes Claros, entre Vila Viçosa et Estremoz. Leur infanterie et leurs canons renvoyèrent des charges répétées de cavalerie, et l’armée espagnole fut détruite.
It was the last great battle of the war. Philip IV died that September, leaving a sickly three-year-old son, Charles II, and his regents wanted peace. In Portugal Afonso VI was pushed aside in 1667–1668 by his brother Peter, who became regent. With English mediation, the Treaty of Lisbon was signed on 13 February 1668. Spain recognised the House of Braganza and Portugal’s independence, and each side gave back what it had taken, except that Ceuta, which had stayed loyal to Philip IV, remained Spanish.: C’était la dernière grande bataille de la guerre. Philippe IV est mort en septembre, laissant un fils malade de trois ans, Charles II, et ses régents voulaient la paix. Au Portugal Afonso VI a été écarté en 1667–1668 par son frère Peter, qui est devenu régent. Avec la médiation anglaise, le traité de Lisbonne fut signé le 13 février 1668. L’Espagne reconnaît l’indépendance de la Maison de Braganza et du Portugal, et chaque partie rend ce qu’elle a pris, sauf que Ceuta, qui est resté fidèle à Philippe IV, reste espagnol.
