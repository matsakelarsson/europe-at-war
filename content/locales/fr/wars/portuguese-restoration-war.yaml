Portuguese Restoration War: Guerre de Restauration portugaise
The war by which Portugal broke away from the Spanish monarchy after sixty years of union under the same kings. Begun by a coup in Lisbon on 1 December 1640 that made the Duke of Braganza King John IV, it was fought mostly along the border of the Alentejo and Spanish Extremadura, and ended after Portuguese victories at Elvas, Ameixial and Montes Claros with the Treaty of Lisbon of 1668, in which Spain recognised Portugal’s independence.: Le Portugal se sépare de la monarchie espagnole après soixante ans d’union sous les mêmes souverains. Le 1er décembre 1640, un coup de force à Lisbonne porte au trône le duc de Bragance, qui devient Jean IV. Les combats se déroulent surtout à la frontière de l’Alentejo et de l’Estrémadure espagnole. Après les victoires portugaises d’Elvas, d’Ameixial et de Montes Claros, l’Espagne reconnaît l’indépendance du Portugal par le traité de Lisbonne de 1668.
Dates are Gregorian. Portuguese historians call the war the Guerra da Restauração, and 1 December is a public holiday in Portugal.: Les historiens portugais appellent la guerre la Guerra da Restauração, et le 1er décembre est un jour férié au Portugal.
Portugal stays a separate kingdom on the base map during the union with Spain, so the coup of 1640 does not change the map. Ceuta, which kept its loyalty to Philip IV in 1640, is shown as Spanish only from the treaty of 1668.: Le Portugal reste un royaume distinct sur la carte de base pendant l’union avec l’Espagne, de sorte que le coup d’État de 1640 ne change pas la carte. Ceuta, qui a gardé sa loyauté à Philippe IV en 1640, est montré comme espagnol seulement du traité de 1668.
France helped Portugal with money and officers, and England sent a brigade after the marriage of Charles II and Catherine of Braganza in 1662. Their soldiers fought under Portuguese command.: La France aidait le Portugal avec de l’argent et des officiers, et l’Angleterre envoya une brigade après le mariage de Charles II et Catherine de Braganza en 1662.
