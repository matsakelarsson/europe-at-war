The revolution of 1640: La révolution de 1640
1640–1656: 1640–1656
Under the Spanish kings Portugal had kept its own laws and institutions, but by the 1630s many Portuguese felt their empire was being lost to the Dutch while Olivares raised new taxes and tried to draw Portugal into Castile’s wars. In 1640, with Spain fighting France and facing revolt in Catalonia, Portuguese nobles struck. On 1 December a group of conspirators burst into the palace in Lisbon, killed the hated Secretary of State, Miguel de Vasconcelos, and arrested the vicereine, Margaret of Savoy. The Duke of Braganza was acclaimed King John IV, and almost all of the empire followed, except Ceuta.: Sous les rois espagnols, le Portugal avait gardé ses propres lois et institutions, mais dans les années 1630 beaucoup de Portugais sentaient leur empire perdu par les Hollandais tandis que Olivares soulevait de nouvelles taxes et tentait d’attirer le Portugal dans les guerres de Castille. Le 1er décembre, un groupe de conspirateurs explosèrent dans le palais de Lisbonne, tuèrent Miguel de Vasconcelos, secrétaire d’État détesté, et arrêtèrent la vice-réine Margaret de Savoie. Le duc de Braganza fut acclamé par le roi Jean IV, et presque tout l’empire suivit, sauf Ceuta.
Spain could not spare a large army, and for years the war along the frontier of the Alentejo and Extremadura was one of raids, cattle-rustling and burnt villages. Portugal rebuilt its border fortresses, above all Elvas, facing the Spanish base at Badajoz. On 26 May 1644 Matias de Albuquerque, a veteran of the wars in Brazil, beat a Spanish army under the Marquis of Torrecuso at Montijo, and that autumn Elvas held out against a nine-day siege. Through the following decade neither side could mount a major campaign; Portugal used the time to win back north-eastern Brazil from the Dutch, who surrendered there in 1654.: L’Espagne ne pouvait pas épargner une grande armée, et pendant des années la guerre le long de la frontière de l’Alentejo et de l’Estrémadure fut l’un des raids, rugissements de bétail et villages brûlés. Portugal reconstruit ses forteresses frontalières, surtout Elvas, face à la base espagnole à Badajoz. Le 26 mai 1644, Matias de Albuquerque, un vétéran des guerres au Brésil, battit une armée espagnole sous le marquis de Torrecuso à Montijo et cet automne Elvas se tenait contre un siège de neuf jours. Au cours de la décennie suivante, aucune partie ne put monter une grande campagne ; le Portugal profita du temps pour reconquérir le nord-est du Brésil des Hollandais, qui s’y rendirent en 1654.
