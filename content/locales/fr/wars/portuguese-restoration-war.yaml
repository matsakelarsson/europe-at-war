1657–1663: 1657–1663
After John IV died in November 1656, leaving his widow Luisa de Guzmán as regent for the young Afonso VI, Spain went on the offensive and in 1657 took Olivença after a long siege. A Portuguese siege of Badajoz in 1658 failed, and Luis de Haro, Philip IV’s chief minister, besieged Elvas, whose garrison was dying of disease. On 14 January 1659 a relief army under António Luís de Meneses, Count of Cantanhede, stormed the Spanish siege lines and routed the besiegers. That November, however, the Peace of the Pyrenees ended the war with France and freed Spain’s armies, and France formally left Portugal to its fate.: Après la mort de Jean IV en novembre 1656, laissant sa veuve Luisa de Guzmán comme régent pour le jeune Afonso VI, l’Espagne poursuivit l’offensive et, en 1657, prit Olivença après un long siège. Un siège portugais de Badajoz en 1658 échoua, et Luis de Haro, ministre en chef de Philippe IV, assiégea Elvas, dont la garnison mourait de maladie. Le 14 janvier 1659, une armée de secours d’António Luís de Meneses, comte de Cantanhede, s’empare des lignes de siège espagnoles et dirige les assiégeants. Cependant, en novembre, la paix des Pyrénées met fin à la guerre avec la France et libère les armées espagnoles.
Portugal turned to England. In 1662 Charles II married Afonso’s sister Catherine of Braganza, who brought Tangier and Bombay as her dowry, and an English brigade came to Portugal, while the German-born Frederick Schomberg, a soldier in French service, came to train the Portuguese army. In May 1663 Don Juan José of Austria invaded the Alentejo with a large army and took Évora, alarming Lisbon. On 8 June, as he fell back towards the border, a Portuguese and English army under the Count of Vila Flor and Schomberg routed him at Ameixial, and Évora was soon retaken.: Le Portugal se tourna vers l’Angleterre. En 1662, Charles II épousa Catherine de Braganza, sœur d’Afonso, qui apporta Tanger et Bombay comme dot, et une brigade anglaise vint au Portugal, tandis que Frederick Schomberg, né en Allemagne, arrivait à entraîner l’armée portugaise. Le 8 juin, alors qu’il se repliait vers la frontière, une armée portugaise et anglaise sous le comte de Vila Flor et Schomberg l’a roué à Ameixial, et Évora fut bientôt repris.
