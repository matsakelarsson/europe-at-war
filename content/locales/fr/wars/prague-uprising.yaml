# Some French text was translated automatically.
"Prague uprising": "Le soulèvement de Prague"
"A rising by the people of Prague against the German occupation in the last days of the Second World War in Europe. It broke out on 5 May 1945 around the radio building, and the insurgents, most of them civilians with few weapons, put up hundreds of barricades. German forces, reinforced by Waffen-SS units, counter-attacked. On 6–7 May the 1st Division of the Russian Liberation Army, former Soviet prisoners who had served Germany, turned against the Germans before withdrawing west, while the US Third Army, which had reached Plzeň, was ordered not to advance. On 8 May the Czech National Council agreed a ceasefire that let the Germans leave the city, but some SS units fought on until the Red Army arrived on 9 May. Between about 1,700 and 2,900 insurgents and many civilians were killed, as were 1,000 or more German soldiers. Both sides committed massacres, and violence against German civilians went on after the fighting.": "Une montée par le peuple de Prague contre l’occupation allemande dans les derniers jours de la Seconde Guerre mondiale en Europe. Il a éclaté le 5 mai 1945 autour du bâtiment radio, et les insurgés, la plupart des civils avec peu d’armes, ont mis en place des centaines de barricades. Les 6 et 7 mai, la 1ère Division de l’Armée russe de libération, anciens prisonniers soviétiques qui avaient servi l’Allemagne, s’est retournée contre les Allemands avant de se retirer vers l’ouest, tandis que la 3ème Armée américaine, qui avait atteint Plzea, a reçu l’ordre de ne pas avancer. Le 8 mai, le Conseil national tchèque a convenu d’un cessez-le-feu permettant aux Allemands de quitter la ville, mais certaines unités SS ont combattu jusqu’à ce que l’armée rouge arrive le 9 mai. Entre 1 700 et 2 900 insurgés et de nombreux civils ont été tués, tout comme 1 000 soldats allemands ou plus. Les deux parties se sont livrées à des massacres et des violences contre des civils allemands ont continué après les combats."
"The Russian Liberation Army (ROA) was led by Andrey Vlasov, a captured Soviet general. Its men left Prague before the Red Army arrived, hoping to surrender to the Americans; many were handed over to the Soviet Union and executed or imprisoned.": "L’Armée russe de libération (ROA) était dirigée par Andrey Vlasov, un général soviétique capturé. Ses hommes ont quitté Prague avant l’arrivée de l’armée rouge, espérant se rendre aux Américains ; beaucoup ont été remis à l’Union soviétique et exécutés ou emprisonnés."
"Numbers of dead are uncertain. The lower figure for the insurgents is the official count of 1946, which included only identified dead.": "Les nombres de morts sont incertains. Le chiffre inférieur pour les insurgés est le dénombrement officiel de 1946, qui comprenait seulement les morts identifiés."
