# French translations of the catalogue text (wave 11); step bodies follow later.
PRRI and Permesta rebellions: Rébellions du PRRI et de Permesta
? "The regional rebellions in Sumatra and Sulawesi against the central government of President Sukarno. Army commanders and politicians in the outer islands resented Jakarta’s control of their export earnings, the growing influence of the Communist Party (PKI) and Sukarno’s turn towards “Guided Democracy”; from December 1956 military councils took over local government in Sumatra, and on 2 March 1957 Lieutenant Colonel Ventje Sumual proclaimed the Permesta charter in Makassar. On 15 February 1958, after a five-day ultimatum, Lieutenant Colonel Ahmad Husein proclaimed the Revolutionary Government of the Republic of Indonesia (PRRI) in Padang, with Sjafruddin Prawiranegara as prime minister and the support of leaders of the Masyumi and Socialist parties such as Mohammad Natsir and Sumitro Djojohadikusumo; Permesta, by then based in Manado, joined it two days later. The American CIA secretly supplied the rebels with arms and a small air force. General Abdul Haris Nasution’s army answered with seaborne and airborne landings: Pekanbaru and its oil fields were taken on 12 March, Padang on 17 April and Bukittinggi on 4 May 1958. On 18 May an American pilot, Allen Pope, was shot down and captured after a bombing raid on Ambon, and Washington dropped the rebels. Manado fell at the end of June 1958, and the rebels fought on as guerrillas in the hills of Sumatra and Minahasa until an amnesty brought their surrender in 1961: Husein in May, Natsir on 28 September and Sumual on 20 October. Estimates of the dead range from about 7,000, the figure Nasution gave, to more than 30,000 in both rebellions, many of them civilians. The defeat strengthened the army and Sukarno, who banned Masyumi and the Socialist Party in 1960 and turned to the Soviet Union for arms."
: "Les rébellions régionales de Sumatra et de Sulawesi contre le gouvernement central du président Sukarno. Les commandants militaires et les responsables politiques des îles extérieures supportaient mal le contrôle de Jakarta sur leurs recettes d’exportation, l’influence croissante du Parti communiste (PKI) et le tournant de Sukarno vers la « démocratie dirigée » ; à partir de décembre 1956, des conseils militaires prirent en main l’administration locale à Sumatra, et le 2 mars 1957 le lieutenant-colonel Ventje Sumual proclama la charte Permesta à Makassar. Le 15 février 1958, après un ultimatum de cinq jours, le lieutenant-colonel Ahmad Husein proclama à Padang le Gouvernement révolutionnaire de la République d’Indonésie (PRRI), avec Sjafruddin Prawiranegara pour Premier ministre et le soutien de dirigeants du Masyumi et du Parti socialiste tels que Mohammad Natsir et Sumitro Djojohadikusumo ; Permesta, dont le centre se trouvait alors à Manado, s’y rallia deux jours plus tard. La CIA américaine fournit secrètement aux rebelles des armes et une petite aviation. L’armée du général Abdul Haris Nasution riposta par des débarquements par mer et par air : Pekanbaru et ses champs pétrolifères furent pris le 12 mars, Padang le 17 avril et Bukittinggi le 4 mai 1958. Le 18 mai, un pilote américain, Allen Pope, fut abattu et capturé après un raid de bombardement sur Ambon, et Washington lâcha les rebelles. Manado tomba à la fin de juin 1958, et les rebelles poursuivirent la lutte en guérilla dans les collines de Sumatra et de la Minahasa jusqu’à ce qu’une amnistie entraîne leur reddition en 1961 : Husein en mai, Natsir le 28 septembre et Sumual le 20 octobre. Les estimations des morts des deux rébellions vont d’environ 7 000, le chiffre avancé par Nasution, à plus de 30 000, dont de nombreux civils. La défaite renforça l’armée et Sukarno, qui interdit le Masyumi et le Parti socialiste en 1960 et se tourna vers l’Union soviétique pour s’armer."
