# French translations of the catalogue text (wave 14); step bodies follow later.
Pueblo Revolt: Révolte des Pueblos
? The rising of the Pueblo peoples of the upper Rio Grande against Spanish rule in the province of Santa Fe de Nuevo México, and the Spanish reconquest that followed. After eighty years of forced labour and tribute under the encomienda, the suppression of Pueblo religion by Franciscan missionaries, drought, famine and Apache raids, leaders of some two dozen pueblos speaking six languages, among them Popé (Po’pay) of Ohkay Owingeh, coordinated a revolt with runners carrying knotted cords. On 10 August 1680 they rose together and killed about 400 colonists, among them 21 of the province’s 33 Franciscans, besieged Governor Antonio de Otermín in Santa Fe and forced some 2,000 survivors to retreat to El Paso del Norte. For twelve years the Pueblos governed themselves, though drought, raids and quarrels divided them. Diego de Vargas returned in 1692 and won the submission of most pueblos without a battle; when he brought colonists back in 1693 he retook Santa Fe by force, executed seventy defenders and gave their families to colonists as servants. A second revolt in 1696 was put down by the end of the year, but the Spanish did not restore the encomienda, granted land to each pueblo and largely left Pueblo religion alone. The Hopi stayed independent.
: Le soulèvement des peuples pueblos du haut Rio Grande contre la domination espagnole dans la province de Santa Fe de Nuevo México, et la reconquête espagnole qui suivit. Après quatre-vingts ans de travail forcé et de tribut sous le régime de l’encomienda, la répression de la religion des Pueblos par les missionnaires franciscains, la sécheresse, la famine et les raids apaches, les chefs de quelque deux douzaines de pueblos parlant six langues, parmi lesquels Popé (Po’pay) d’Ohkay Owingeh, coordonnèrent une révolte au moyen de coureurs porteurs de cordelettes à nœuds. Le 10 août 1680, ils se soulevèrent ensemble et tuèrent environ 400 colons, dont 21 des 33 franciscains de la province, assiégèrent le gouverneur Antonio de Otermín à Santa Fe et forcèrent quelque 2 000 survivants à se replier sur El Paso del Norte. Pendant douze ans, les Pueblos se gouvernèrent eux-mêmes, même si la sécheresse, les raids et les querelles les divisaient. Diego de Vargas revint en 1692 et obtint la soumission de la plupart des pueblos sans livrer bataille ; lorsqu’il ramena des colons en 1693, il reprit Santa Fe par la force, fit exécuter soixante-dix défenseurs et donna leurs familles aux colons comme serviteurs. Une seconde révolte, en 1696, fut réprimée avant la fin de l’année, mais les Espagnols ne rétablirent pas l’encomienda, accordèrent des terres à chaque pueblo et laissèrent dans une large mesure la religion des Pueblos en paix. Les Hopis restèrent indépendants.
