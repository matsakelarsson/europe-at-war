# French translations of the catalogue text (wave 14); step bodies follow later.
Puerto Rican Nationalist revolts of 1950: Révoltes nationalistes portoricaines de 1950
? Armed risings by the Puerto Rican Nationalist Party of Pedro Albizu Campos, which sought independence from the United States. The party rejected the commonwealth status that Public Law 600, signed by President Harry S. Truman on 3 July 1950, allowed Puerto Ricans to adopt under a constitution of their own, and called it a continuation of colonial rule; it had been under pressure since the Ponce massacre of 1937, and the Gag Law (Ley de la Mordaza) of 1948 made it a crime even to display the Puerto Rican flag. After a police raid at Peñuelas on 29 October, Nationalists rose in several towns on 30 October 1950. In Jayuya, Blanca Canales proclaimed the Republic of Puerto Rico in the town square while her followers burned the police station and post office, and the town was held for some days until the Puerto Rico National Guard retook it after attacks by P-47 fighter-bombers and artillery. In Utuado guardsmen shot nine Nationalists who had surrendered, killing five, and aircraft strafed the town. In San Juan four Nationalists were killed attacking La Fortaleza, the residence of Governor Luis Muñoz Marín, and police and guardsmen besieged the barber Vidal Santiago Díaz in his shop, the Salón Boricua, in a gunfight broadcast live on the radio. There was fighting in Arecibo, Mayagüez, Ponce and Naranjito, where a guerrilla band under José Antonio Negrón held out in the hills until 6 November; Negrón was arrested on 10 November. On 1 November two Nationalists from New York, Oscar Collazo and Griselio Torresola, attacked Blair House in Washington to kill Truman; Torresola and the White House policeman Leslie Coffelt were killed. The risings left 28 dead (16 Nationalists, 7 policemen, a National Guardsman and 4 civilians) and 49 wounded, and hundreds of independence supporters, Albizu Campos among them, were imprisoned. In 1952 about 82 per cent of voters approved the constitution of the Commonwealth (Estado Libre Asociado); the Nationalists rejected the vote, which offered neither independence nor statehood, and in 1954 four of them opened fire in the US House of Representatives, wounding five congressmen.
: Soulèvements armés du Parti nationaliste portoricain de Pedro Albizu Campos, qui réclamait l’indépendance vis-à-vis des États-Unis. Le parti rejetait le statut de commonwealth que la loi publique 600, signée par le président Harry S. Truman le 3 juillet 1950, permettait aux Portoricains d’adopter en se dotant de leur propre constitution, et il y voyait une prolongation de la domination coloniale ; il subissait des pressions depuis le massacre de Ponce, en 1937, et la loi du bâillon (Ley de la Mordaza) de 1948 faisait un crime du simple fait d’arborer le drapeau portoricain. Après une descente de police à Peñuelas le 29 octobre, des nationalistes se soulevèrent dans plusieurs villes le 30 octobre 1950. À Jayuya, Blanca Canales proclama la république de Porto Rico sur la place de la ville tandis que ses partisans incendiaient le poste de police et le bureau de poste, et la ville fut tenue pendant quelques jours, jusqu’à ce que la Garde nationale de Porto Rico la reprenne après des attaques de chasseurs-bombardiers P-47 et de l’artillerie. À Utuado, des gardes nationaux tirèrent sur neuf nationalistes qui s’étaient rendus, en tuant cinq, et des avions mitraillèrent la ville. À San Juan, quatre nationalistes furent tués en attaquant La Fortaleza, la résidence du gouverneur Luis Muñoz Marín, et des policiers et des gardes nationaux assiégèrent le barbier Vidal Santiago Díaz dans sa boutique, le Salón Boricua, lors d’une fusillade retransmise en direct à la radio. On se battit aussi à Arecibo, à Mayagüez, à Ponce et à Naranjito, où une bande de guérilleros menée par José Antonio Negrón tint les collines jusqu’au 6 novembre ; Negrón fut arrêté le 10 novembre. Le 1er novembre, deux nationalistes venus de New York, Oscar Collazo et Griselio Torresola, attaquèrent Blair House, à Washington, pour tuer Truman ; Torresola et le policier de la Maison-Blanche Leslie Coffelt furent tués. Les soulèvements firent 28 morts (16 nationalistes, 7 policiers, un garde national et 4 civils) et 49 blessés, et des centaines de partisans de l’indépendance, dont Albizu Campos, furent emprisonnés. En 1952, environ 82 % des votants approuvèrent la constitution du Commonwealth, ou État libre associé (Estado Libre Asociado) ; les nationalistes rejetèrent ce vote, qui ne proposait ni l’indépendance ni le statut d’État fédéré, et en 1954 quatre d’entre eux ouvrirent le feu dans la Chambre des représentants des États-Unis, blessant cinq membres du Congrès.
