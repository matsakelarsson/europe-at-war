# Some French text was translated automatically.
"Pugachev’s Rebellion": "Rébellion de Pugachev"
"The largest popular rising in the history of the Russian Empire, led by the Don Cossack Yemelyan Pugachev, who claimed to be the overthrown emperor Peter III. Begun by the Yaik Cossacks in 1773 and joined by Bashkirs, Tatars, Ural factory serfs and finally peasants of the Volga lands, it besieged Orenburg, burned Kazan and killed many landowners before it was crushed in 1774. Pugachev was executed in Moscow in January 1775.": "Le plus grand ascension populaire de l’histoire de l’Empire russe, dirigé par le Don Cosaque Yemelyan Pugachev, qui a prétendu être l’empereur renversé Pierre III. Arrivé par les cosaques de Yaik en 1773 et rejoint par les serfs d’usines de Bachkirs, Tatars, Oural et finalement les paysans des terres de la Volga, il assiégea Orenburg, brûla Kazan et tua de nombreux propriétaires avant qu’il ne soit écrasé en 1774."
"Dates are New Style (Gregorian). Russia used the Julian calendar, eleven days behind, and Russian accounts give the Old Style dates, such as 17 September 1773 for the start of the rising and 10 January 1775 for Pugachev’s execution.": "Les dates sont New Style (Gregorian). La Russie a utilisé le calendrier julien, onze jours de retard, et les comptes russes donnent les dates Old Style, comme 17 septembre 1773 pour le début de la montée et 10 janvier 1775 pour l’exécution de Pugachev."
"Also called the Peasants’ War of 1773–1775. Yaitsk is today’s Oral in Kazakhstan, and Tsaritsyn is Volgograd.": "Aussi appelé la guerre paysanne de 1773–1775. Yaitsk est aujourd'hui Oral au Kazakhstan, et Tsaritsyn est Volgograd."
