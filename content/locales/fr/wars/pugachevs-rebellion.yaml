"July 1774 – January 1775": "juillet 1774 – janvier 1775"
"On the right bank of the Volga, among the serf villages, the rising became a peasant war. On 11 August Pugachev issued a manifesto granting the serfs their freedom and calling on them to deal with their landlords, and hundreds of manor houses were burned and many noble families killed. Penza and Saratov fell as he swept south along the river, and there was alarm in Moscow. But the Treaty of Küçük Kaynarca had ended the Turkish war in July, and regular troops were coming back to deal with him, among them Alexander Suvorov.": "Sur la rive droite de la Volga, parmi les villages serfs, la montée est devenue une guerre paysanne. Le 11 août, Pugatchev a publié un manifeste accordant aux serfs leur liberté et les appelant à traiter avec leurs propriétaires, et des centaines de maisons de manoir ont été brûlées et de nombreuses familles nobles tuées. Penza et Saratov sont tombés alors qu’il balayait le sud le long du fleuve, et il y avait une alarme à Moscou. Mais le traité de Küçük Kaynarca avait mis fin à la guerre turque en juillet, et des troupes régulières revenaient avec lui, parmi lesquelles Alexandre Suvorov."
"On 1 September Pugachev failed to take Tsaritsyn, and on 5 September Mikhelson caught and destroyed his army at Solenikova Vataga, downstream from the town. Pugachev fled into the steppe east of the Volga, where his own Cossack lieutenants seized him and handed him over at Yaitsk later that month. He was taken to Moscow in a cage and executed on Bolotnaya Square on 21 January 1775. Troops under Count Pyotr Panin hanged rebels across the Volga lands. The Yaik was renamed the Ural, and Yaitsk became Uralsk.": "Le 1er septembre, Pugachev n’a pas pris Tsaritsyn et le 5 septembre, Mikhelson a pris et détruit son armée à Solenikova Vataga, en aval de la ville. Pugachev s’est enfui dans la steppe à l’est de la Volga, où ses propres lieutenants cosaques l’ont saisi et l’ont livré à Yaitsk plus tard ce mois-là. Il fut emmené à Moscou dans une cage et exécuté sur la place Bolotnaya le 21 janvier 1775. Des troupes sous le comte Pyotr Panin pendirent des rebelles à travers les terres de la Volga. Le Yaik fut rebaptisé l’Oural, et Yaitsk devint Ouralsk."
