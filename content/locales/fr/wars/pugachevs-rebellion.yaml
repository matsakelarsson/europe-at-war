"September 1773 – April 1774": "septembre 1773 – avril 1774"
"Yemelyan Pugachev, a Don Cossack who had deserted from the army, appeared among the Yaik Cossacks in 1773 claiming to be Peter III, Catherine II’s husband, who had been overthrown and killed in 1762. The Yaik Cossacks, many of them Old Believers, had risen in 1772 against the government’s inroads on their freedoms and been harshly punished. In September 1773 a small band of them followed Pugachev against Yaitsk. He could not take its fortress, but he swept up the line of small forts along the Yaik, whose garrisons often went over to him. Officers who resisted were hanged.": "Yemelyan Pugachev, un Don Cosaque qui avait déserté de l’armée, est apparu parmi les Yaik Cosaques en 1773 prétendant être Pierre III, le mari de Catherine II, qui avait été renversé et tué en 1762. Les Yaik Cosaques, beaucoup d’entre eux vieux croyants, s’étaient levés en 1772 contre le gouvernement impunis sur leurs libertés et ont été sévèrement punis. En septembre 1773, une petite bande d’entre eux suivit Pugachev contre Yaitsk. Il ne put prendre sa forteresse, mais il balaya la ligne de petits forts le long du Yaik, dont les garnisons allaient souvent vers lui."
"In October he laid siege to Orenburg, the seat of government in the region, and set up his camp and his own “War College” at nearby Berda. Bashkirs under Salawat Yulayev, Tatars, Kalmyks and serfs from the Ural ironworks joined him, his bands besieged Ufa, and the revolt spread into the Urals and western Siberia. A government force was beaten in November. Orenburg went hungry for six months, until a larger army under General Aleksandr Bibikov arrived. On 2 April 1774 Prince Pyotr Golitsyn crushed Pugachev at the Tatishchev fortress, Orenburg and Ufa were relieved, and Pugachev fled into the southern Urals.": "En octobre, il assiégea Orenburg, le siège du gouvernement dans la région, et mit en place son camp et son propre collège de guerre à Berda tout près. Baskkirs sous Salawat Yulayev, Tatars, Kalmyks et serfs de l’Oural ferronworks se joignirent à lui, ses bandes assiégées Ufa, et la révolte se répandit dans l’Oural et la Sibérie occidentale. Une force gouvernementale a été battue en novembre. Orenburg a eu faim pendant six mois, jusqu’à ce qu’une plus grande armée sous le général Aleksandr Bibikov arrive. Le 2 avril 1774, le prince Pyotr Golitsyn a écrasé Pugachev à la forteresse de Tatishchev, Orenburg et Ufa ont été soulagés, et Pugachev a fui dans l’Oural sud."
