"April – July 1774": "avril – juillet 1774"
"In the Urals and Bashkiria Pugachev raised a new army. Bibikov died of fever in April, and the government’s troops were spread thin over a vast country. The rebels, joined by Bashkirs and ironworkers, burned factories and took towns and works such as Krasnoufimsk, Osa and Izhevsk, and Pugachev turned west towards the Volga with a large but poorly armed host. On 23 July he stormed Kazan, one of the empire’s largest cities, and burned much of it, though the garrison held out in the kremlin.": "Dans l’Oural et Bashkiria Pugachev a soulevé une nouvelle armée. Bibikov est mort de fièvre en avril, et les troupes du gouvernement ont été dispersées sur un vaste pays. Les rebelles, rejoints par Bashkirs et ferryworkers, ont brûlé des usines et pris des villes et des travaux tels que Krasnoufimsk, Osa et Izhevsk, et Pugachev tourné vers l’ouest vers la Volga avec une grande mais mal armée hôte. Le 23 juillet, il s’empare de Kazan, l’une des plus grandes villes de l’empire, et en brûle une grande partie, bien que la garnison se tienne dans le kremlin."
"Ivan Mikhelson, who had chased Pugachev through the Urals, arrived the same day and beat the rebels in three days of fighting outside the city. Pugachev’s army was killed, captured or scattered, but he escaped and crossed the Volga with a few hundred men on 28 July. Across the river, in the lands of the serf-owning nobility, he found a new following.": "Ivan Mikhelson, qui avait poursuivi Pugachev à travers l’Oural, est arrivé le même jour et a battu les rebelles en trois jours de combats hors de la ville. L’armée de Pugachev a été tuée, capturée ou dispersée, mais il s’est échappé et a traversé la Volga avec quelques centaines d’hommes le 28 juillet."
