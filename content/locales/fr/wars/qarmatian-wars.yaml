# French translations of the catalogue text (wave 7); step bodies follow later.
Qarmatian wars: Guerres des Qarmates
The wars of the Qarmatians of Bahrayn, a radical Ismaili Shi’i movement that built a state in eastern Arabia around the oasis of al-Ahsa, against the Abbasid caliphate. Abu Sa’id al-Jannabi took Qatif and Hajar in 899–903 and destroyed a caliphal army in 900. Under his son Abu Tahir the Qarmatians sacked Basra in 923, plundered the pilgrim caravans, came within sight of Baghdad in 928 and in January 930 sacked Mecca during the pilgrimage and carried off the Black Stone of the Kaaba, which they gave back only in 951. In the 970s they fought the Fatimids for Syria and Egypt.: Les guerres menées contre le califat abbasside par les Qarmates de Bahreïn, un mouvement chiite ismaélien radical qui fonda un État dans l’est de l’Arabie, autour de l’oasis d’al-Ahsa. Abu Sa’id al-Jannabi prit Qatif et Hajar entre 899 et 903 et anéantit une armée califale en 900. Sous son fils Abu Tahir, les Qarmates mirent Bassora à sac en 923, pillèrent les caravanes de pèlerins, arrivèrent en vue de Bagdad en 928 et, en janvier 930, saccagèrent La Mecque pendant le pèlerinage et emportèrent la Pierre noire de la Kaaba, qu’ils ne rendirent qu’en 951. Dans les années 970, ils disputèrent la Syrie et l’Égypte aux Fatimides.
