# French translations of the catalogue text (wave 9); step bodies follow later.
Qing conquest of the Dzungar Khanate: Conquête du khanat dzoungar par les Qing
? "The campaigns in which the Qing empire destroyed the Dzungar Khanate, the last great nomad state of Inner Asia, and most of the Dzungar people with it. After the death of Galdan Tseren in 1745 the khanate broke up in succession wars, and in 1754 the defeated prince Amursana went over to the Qing. In 1755 two Qing armies, with Amursana, marched to the Ili valley almost unopposed; the khan Dawachi was captured and the khanate dissolved. When the Qianlong emperor offered Amursana only a share of the Dzungar lands, he rebelled in September 1755, and the Khalkha prince Chingünjav rose in 1756. In 1757–1758 the Qing crushed both risings, and the emperor ordered that the Dzungar men be killed. War, massacre, a smallpox epidemic, Kazakh raids and flight destroyed the Dzungars as a people: of a population put at about 600,000, most estimates of the dead range from about 420,000 to 480,000. Amursana died in Russian exile in 1757. The Qing resettled Dzungaria with soldiers and farmers from elsewhere in the empire and, after conquering the Tarim basin in 1759, called the new territory Xinjiang."
: "Les campagnes au cours desquelles l’empire des Qing détruisit le khanat dzoungar, dernier grand État nomade de l’Asie intérieure, et avec lui la plus grande partie du peuple dzoungar. Après la mort de Galdan Tseren en 1745, le khanat se disloqua dans des guerres de succession et, en 1754, le prince vaincu Amoursana passa aux Qing. En 1755, deux armées Qing, accompagnées d’Amoursana, marchèrent sur la vallée de l’Ili presque sans rencontrer de résistance ; le khan Dawachi fut capturé et le khanat dissous. Lorsque l’empereur Qianlong n’offrit à Amoursana qu’une part des terres dzoungares, celui-ci se révolta en septembre 1755, et le prince khalkha Chingünjav se souleva en 1756. En 1757–1758, les Qing écrasèrent les deux soulèvements, et l’empereur ordonna que les hommes dzoungars soient tués. La guerre, les massacres, une épidémie de variole, les raids kazakhs et la fuite détruisirent les Dzoungars en tant que peuple : sur une population estimée à environ 600 000 personnes, la plupart des estimations du nombre de morts vont d’environ 420 000 à 480 000. Amoursana mourut en exil en Russie en 1757. Les Qing repeuplèrent la Dzoungarie avec des soldats et des paysans venus d’autres régions de l’empire et, après avoir conquis le bassin du Tarim en 1759, donnèrent au nouveau territoire le nom de Xinjiang."
