# French translations of the catalogue text (wave 9); step bodies follow later.
Qing conquest of the Ming: Conquête des Ming par les Qing
? The war in which the Manchu Qing dynasty, with the help of the Ming generals who went over to it, took China from the rebels who had overthrown the Ming and from the Ming princes who tried to restore it. In April 1644 the rebel leader Li Zicheng took Beijing and the last Ming emperor at Beijing hanged himself. The Ming commander at Shanhai Pass, Wu Sangui, let the Qing army through the Great Wall, and on 27 May 1644 their combined armies routed Li Zicheng; the Qing regent Dorgon entered Beijing in June and made it the capital of the Qing. Over the next two years Qing armies drove Li Zicheng out of Shaanxi, took Yangzhou, where the city was sacked, and Nanjing, and put down risings in the Yangtze delta against the order that all men shave their heads in the Manchu style. A succession of Ming princes, the Southern Ming, held parts of the south, helped from 1648 by Ming generals who changed sides again and from 1652 by the armies of the late rebel Zhang Xianzhong under Li Dingguo. In 1658–1659 Qing armies took Guizhou and Yunnan, and the last Ming claimant, the Yongli Emperor, fled to Burma. Handed over to Wu Sangui in January 1662, he was executed at Kunming that June. Ming loyalists held Taiwan until 1683.
: La guerre au cours de laquelle la dynastie mandchoue des Qing, avec l’aide des généraux Ming qui s’étaient ralliés à elle, prit la Chine aux rebelles qui avaient renversé les Ming et aux princes Ming qui tentaient de restaurer la dynastie. En avril 1644, le chef rebelle Li Zicheng prit Pékin et le dernier empereur Ming à Pékin se pendit. Le commandant Ming de la passe de Shanhai, Wu Sangui, laissa l’armée Qing franchir la Grande Muraille et, le 27 mai 1644, leurs armées réunies mirent Li Zicheng en déroute ; le régent Qing Dorgon entra dans Pékin en juin et en fit la capitale des Qing. Au cours des deux années suivantes, les armées Qing chassèrent Li Zicheng du Shaanxi, prirent Yangzhou, qui fut mise à sac, et Nankin, et réprimèrent des soulèvements dans le delta du Yangzi contre l’ordre obligeant tous les hommes à se raser la tête à la manière mandchoue. Une succession de princes Ming, les Ming du Sud, tinrent des parties du Sud, aidés à partir de 1648 par des généraux Ming qui changèrent de nouveau de camp, et à partir de 1652 par les armées du défunt rebelle Zhang Xianzhong, commandées par Li Dingguo. En 1658–1659, les armées Qing prirent le Guizhou et le Yunnan, et le dernier prétendant Ming, l’empereur Yongli, s’enfuit en Birmanie. Livré à Wu Sangui en janvier 1662, il fut exécuté à Kunming en juin de la même année. Des loyalistes Ming tinrent Taïwan jusqu’en 1683.
