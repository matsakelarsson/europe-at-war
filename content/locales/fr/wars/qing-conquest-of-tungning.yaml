# French translations of the catalogue text (wave 9); step bodies follow later.
Qing conquest of Taiwan: Conquête de Taïwan par les Qing
The campaign that ended the Zheng kingdom on Taiwan, the Kingdom of Tungning, the last state to keep the Ming calendar. After the Three Feudatories were defeated, the Kangxi emperor gave command of the Fujian fleet to Shi Lang, a former officer of Zheng Chenggong (Koxinga) who had gone over to the Qing. In July 1683 Shi sailed from Tongshan with about 240 ships and 21,000 men and, on 16–17 July, destroyed the Zheng fleet under Liu Guoxuan in the bay of Magong in the Penghu islands; Qing reports counted about 12,000 Zheng dead against a few hundred of their own. The court of the young king Zheng Keshuang, divided since a succession coup in 1681, offered unconditional surrender in September, and Shi Lang took over Taiwan without further fighting in October 1683. Zheng Keshuang was taken to Beijing and given a dukedom. In 1684 the Qing made Taiwan a prefecture of Fujian province, its first rule over the island.: La campagne qui mit fin au royaume des Zheng à Taïwan, le royaume de Tungning, dernier État à conserver le calendrier des Ming. Après la défaite des Trois Feudataires, l’empereur Kangxi confia le commandement de la flotte du Fujian à Shi Lang, ancien officier de Zheng Chenggong (Koxinga) passé aux Qing. En juillet 1683, Shi appareilla de Tongshan avec environ 240 navires et 21 000 hommes et, les 16 et 17 juillet, anéantit la flotte des Zheng commandée par Liu Guoxuan dans la baie de Magong, aux îles Penghu ; les rapports Qing font état d’environ 12 000 morts du côté des Zheng, contre quelques centaines du leur. La cour du jeune roi Zheng Keshuang, divisée depuis un coup de force successoral en 1681, offrit une reddition sans condition en septembre, et Shi Lang prit possession de Taïwan sans autre combat en octobre 1683. Zheng Keshuang fut emmené à Pékin et reçut un titre de duc. En 1684, les Qing firent de Taïwan une préfecture de la province du Fujian, première forme de leur domination sur l’île.
