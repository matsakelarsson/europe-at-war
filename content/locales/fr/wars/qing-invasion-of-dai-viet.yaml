# French translations of the catalogue text (wave 11); step bodies follow later.
Qing invasion of Đại Việt: Invasion du Đại Việt par les Qing
? The Qing intervention to restore the last Lê emperor, Lê Chiêu Thống, who had fled from the Tây Sơn and appealed to the Qianlong Emperor. In November 1788 armies from Guangxi under the governor-general Sun Shiyi and from Yunnan under Wu Dajing crossed the border, and the Tây Sơn garrison of the north fell back to the Tam Điệp pass; on 17 December the Qing entered Thăng Long and installed Lê Chiêu Thống as king. Nguyễn Huệ answered by proclaiming himself Emperor Quang Trung at Phú Xuân on 22 December and marching north, gathering troops on the way. Over the Lunar New Year his army stormed the Qing forts south of the capital, at Hà Hồi, Ngọc Hồi and Đống Đa, and on 30 January 1789 retook Thăng Long. Several Qing generals were killed, and Sun Shiyi and Lê Chiêu Thống fled to China. Quang Trung then sought peace, and the Qianlong Emperor recognised him as king of Annam later in 1789. Vietnam remembers the battle as one of its greatest victories; in China the campaign was counted among Qianlong’s Ten Great Campaigns.
: L’intervention des Qing pour rétablir le dernier empereur Lê, Lê Chiêu Thống, qui avait fui devant les Tây Sơn et appelé à l’aide l’empereur Qianlong. En novembre 1788, des armées venues du Guangxi, sous le gouverneur général Sun Shiyi, et du Yunnan, sous Wu Dajing, franchirent la frontière, et la garnison des Tây Sơn dans le Nord se replia sur le col de Tam Điệp ; le 17 décembre, les Qing entrèrent dans Thăng Long et installèrent Lê Chiêu Thống comme roi. Nguyễn Huệ riposta en se proclamant empereur sous le nom de Quang Trung à Phú Xuân le 22 décembre, puis en marchant vers le nord, rassemblant des troupes en chemin. Pendant le Nouvel An lunaire, son armée prit d’assaut les forts Qing au sud de la capitale, à Hà Hồi, Ngọc Hồi et Đống Đa, et reprit Thăng Long le 30 janvier 1789. Plusieurs généraux Qing furent tués, et Sun Shiyi et Lê Chiêu Thống s’enfuirent en Chine. Quang Trung rechercha ensuite la paix, et l’empereur Qianlong le reconnut comme roi d’Annam plus tard en 1789. Le Vietnam garde le souvenir de cette bataille comme l’une de ses plus grandes victoires ; en Chine, la campagne fut comptée parmi les Dix Grandes Campagnes de Qianlong.
