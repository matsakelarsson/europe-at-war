# French translations of the catalogue text (wave 10); step bodies follow later.
Qing invasion of Joseon: Invasion de Joseon par les Qing
The second Manchu invasion of Korea, called Byeongja Horan in Korean after the year 1636 in the sixty-year cycle. Hong Taiji had proclaimed the Qing dynasty in 1636, and the Joseon court, loyal to the Ming, refused to recognise him as emperor. He set out from Mukden at the end of December 1636 with Manchu, Mongol and Han banner troops, about 120,000 men by Korean accounts, crossed the Yalu at the start of January 1637 and, bypassing the northern fortresses, reached Hanseong within two weeks. Cut off from Ganghwa Island, King Injo shut himself up in the mountain fortress of Namhansanseong with about 13,800 men. Relief armies from the provinces were beaten one by one, and when Ganghwa fell on 16 February with the king’s family, Injo came out and submitted to Hong Taiji at Samjeondo on the Han River on 24 February 1637. Joseon broke with the Ming, became a tributary of the Qing and sent two princes as hostages to Mukden, and large numbers of Koreans were carried off as captives.: La seconde invasion mandchoue de la Corée, appelée en coréen Byeongja Horan, d’après l’année 1636 dans le cycle sexagésimal. Hong Taiji avait proclamé la dynastie Qing en 1636, et la cour de Joseon, fidèle aux Ming, refusa de le reconnaître comme empereur. Il partit de Moukden à la fin de décembre 1636 avec des troupes des bannières mandchoues, mongoles et han, environ 120 000 hommes selon les sources coréennes, franchit le Yalu au début de janvier 1637 et, contournant les forteresses du nord, atteignit Hanseong en deux semaines. Coupé de l’île de Ganghwa, le roi Injo s’enferma dans la forteresse de montagne de Namhansanseong avec environ 13 800 hommes. Les armées de secours venues des provinces furent battues l’une après l’autre et, quand Ganghwa tomba le 16 février avec la famille du roi, Injo sortit et se soumit à Hong Taiji à Samjeondo, sur le fleuve Han, le 24 février 1637. Joseon rompit avec les Ming, devint tributaire des Qing et envoya deux princes comme otages à Moukden, et un grand nombre de Coréens furent emmenés en captivité.
