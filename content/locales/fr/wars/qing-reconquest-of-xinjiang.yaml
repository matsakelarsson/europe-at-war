# French translations of the catalogue text (wave 9); step bodies follow later.
Qing reconquest of Xinjiang: Reconquête du Xinjiang par les Qing
The campaign in which the Qing general Zuo Zongtang destroyed Yakub Beg’s state of Yettishar (Kashgaria) and restored Qing rule in Xinjiang, the last phase of the Dungan Revolt. After the court decided in 1875, against the advice of Li Hongzhang, to spend the money on the north-west rather than on coastal defence, Zuo’s armies, financed by foreign loans and armed with modern rifles and Krupp guns, took Ürümqi and Manas in 1876. In April 1877 they took Dabancheng, Turfan and Toksun, and in May Yakub Beg died at Korla. His state broke up in a struggle among his sons, and between October 1877 and January 1878 Liu Jintang’s troops advanced through Karashahr, Kucha and Aksu to Kashgar, Yarkand and Khotan. The Ili valley, occupied by Russia since 1871, was recovered by treaty in 1881, and Xinjiang became a province of the Qing empire in 1884.: La campagne au cours de laquelle le général Qing Zuo Zongtang détruisit l’État de Yettishar (Kachgarie) de Yakub Beg et rétablit la domination Qing au Xinjiang, dernière phase de la révolte des Dounganes. Après que la cour eut décidé en 1875, contre l’avis de Li Hongzhang, de consacrer les fonds au Nord-Ouest plutôt qu’à la défense côtière, les armées de Zuo, financées par des emprunts étrangers et équipées de fusils modernes et de canons Krupp, prirent Ürümqi et Manas en 1876. En avril 1877, elles prirent Dabancheng, Tourfan et Toksun, et en mai Yakub Beg mourut à Korla. Son État se disloqua dans une lutte entre ses fils et, entre octobre 1877 et janvier 1878, les troupes de Liu Jintang avancèrent par Karachahr, Koutcha et Aksou jusqu’à Kachgar, Yarkand et Khotan. La vallée de l’Ili, occupée par la Russie depuis 1871, fut récupérée par traité en 1881, et le Xinjiang devint une province de l’empire des Qing en 1884.
