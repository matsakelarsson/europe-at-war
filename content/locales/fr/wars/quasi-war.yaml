# French translations of the catalogue text (wave 14); step bodies follow later.
Quasi-War: Quasi-guerre
? An undeclared naval war between the United States and the French Republic, fought mostly in the Caribbean. France, at war with Britain, saw the Jay Treaty of 1795 between the United States and Britain as a betrayal of the alliance of 1778, and French warships and privateers, many of them based on Guadeloupe and in Saint-Domingue, seized hundreds of American merchant ships. When the French foreign minister Talleyrand’s agents demanded a bribe before they would even talk with American envoys, the “XYZ affair”, Congress in 1798 created a Navy Department, cancelled the treaties with France and authorised the navy and privateers to capture armed French ships. The small new navy, working alongside the Royal Navy, captured or sank many French privateers, captured the frigate L’Insurgente in 1799 and badly damaged La Vengeance in 1800, and the United States supported Toussaint Louverture in Saint-Domingue. President John Adams, against much of his own Federalist party, sent new envoys to Paris, and Napoleon’s government agreed to the Convention of 1800 at Mortefontaine on 30 September 1800, which ended the war and the old alliance.
: Une guerre navale non déclarée entre les États-Unis et la République française, livrée surtout dans les Caraïbes. La France, en guerre contre la Grande-Bretagne, vit dans le traité de Jay, conclu en 1795 entre les États-Unis et la Grande-Bretagne, une trahison de l’alliance de 1778, et des navires de guerre et des corsaires français, dont beaucoup étaient basés à la Guadeloupe et à Saint-Domingue, s’emparèrent de centaines de navires marchands américains. Lorsque les agents du ministre français des Relations extérieures, Talleyrand, exigèrent un pot-de-vin avant même d’accepter de discuter avec les envoyés américains (l’« affaire XYZ »), le Congrès créa en 1798 un département de la Marine, annula les traités avec la France et autorisa la marine et des corsaires à capturer les navires français armés. La petite marine nouvellement créée, opérant aux côtés de la Royal Navy, captura ou coula de nombreux corsaires français, s’empara de la frégate L’Insurgente en 1799 et endommagea gravement La Vengeance en 1800, et les États-Unis soutinrent Toussaint Louverture à Saint-Domingue. Le président John Adams, contre une grande partie de son propre parti fédéraliste, envoya de nouveaux émissaires à Paris, et le gouvernement de Napoléon accepta la convention de 1800, signée à Mortefontaine le 30 septembre 1800, qui mit fin à la guerre et à l’ancienne alliance.
