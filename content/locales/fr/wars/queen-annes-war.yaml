# French translations of the catalogue text (wave 14); step bodies follow later.
Queen Anne’s War: Guerre de la reine Anne
? The North American part of the War of the Spanish Succession, fought between England (Great Britain from 1707) and its colonies on one side and France, Spain and their colonies on the other, each with Native allies who fought for their own reasons. In the south, Governor James Moore of Carolina burned the town of Saint Augustine in 1702 but could not take its stone fort; in 1704 he and some 1,000 Muscogee (Creek) warriors destroyed the Apalachee missions of Spanish Florida and carried thousands of people into slavery, and a French and Spanish attack on Charles Town in 1706 was beaten off. In the north, French officers and Wabanaki, Kahnawake Mohawk and Wendat warriors raided the New England frontier, most famously at Deerfield in 1704, and the French twice ravaged the English settlements of Newfoundland. New England failed twice to take Port Royal in 1707 but captured it in 1710, renaming it Annapolis Royal. A great British expedition against Quebec in 1711 ended when Admiral Walker’s fleet ran onto the reefs of the St. Lawrence, drowning about 890 people. At the Peace of Utrecht in 1713 France ceded Acadia (Nova Scotia), Newfoundland and Hudson Bay to Britain but kept Cape Breton, where it built Louisbourg; the Wabanaki made a separate peace at Portsmouth. The unclear borders of Acadia and the slave trade on the southern frontier led directly to the wars that followed.
: Le volet nord-américain de la guerre de Succession d’Espagne, qui opposa l’Angleterre (la Grande-Bretagne à partir de 1707) et ses colonies, d’un côté, à la France, à l’Espagne et à leurs colonies, de l’autre, chaque camp ayant des alliés autochtones qui combattaient pour leurs propres raisons. Au sud, le gouverneur de la Caroline, James Moore, incendia la ville de Saint-Augustin en 1702 mais ne put prendre son fort de pierre ; en 1704, avec quelque 1 000 guerriers muscogees (creeks), il détruisit les missions apalachees de la Floride espagnole et emmena des milliers de personnes en esclavage, et une attaque franco-espagnole contre Charles Town fut repoussée en 1706. Au nord, des officiers français et des guerriers wabanakis, mohawks de Kahnawake et wendats lancèrent des raids contre la frontière de la Nouvelle-Angleterre, dont le plus célèbre frappa Deerfield en 1704, et les Français ravagèrent à deux reprises les établissements anglais de Terre-Neuve. La Nouvelle-Angleterre échoua deux fois à prendre Port-Royal en 1707, mais s’en empara en 1710 et le rebaptisa Annapolis Royal. Une grande expédition britannique contre Québec, en 1711, prit fin lorsque la flotte de l’amiral Walker se jeta sur les récifs du Saint-Laurent, où environ 890 personnes se noyèrent. À la paix d’Utrecht, en 1713, la France céda l’Acadie (Nouvelle-Écosse), Terre-Neuve et la baie d’Hudson à la Grande-Bretagne, mais conserva l’île du Cap-Breton, où elle construisit Louisbourg ; les Wabanakis conclurent une paix séparée à Portsmouth. Le flou des frontières de l’Acadie et la traite des esclaves sur la frontière méridionale menèrent directement aux guerres suivantes.
England (Great Britain from 1707), its colonies and their Native allies (Muscogee, Yamasee and others in the south): Angleterre (Grande-Bretagne à partir de 1707), ses colonies et leurs alliés autochtones (Muscogees, Yamasees et d’autres au sud)
France, New France and their Native allies (Wabanaki, Kahnawake Mohawk, Wendat, Mi’kmaq and others): France, Nouvelle-France et leurs alliés autochtones (Wabanakis, Mohawks de Kahnawake, Wendats, Micmacs et d’autres)
Spain and Spanish Florida, with the Apalachee and Timucua mission towns: Espagne et Floride espagnole, avec les villages de mission apalachees et timucuas
