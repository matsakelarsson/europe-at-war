# French translations of the catalogue text (wave 8); step bodies follow later.
Rajput war (1679–1707): Guerre des Rajputs (1679–1707)
The war between Aurangzeb and the Rajput kingdoms of Marwar and Mewar. When Maharaja Jaswant Singh of Marwar died at Jamrud in 1678 without a living heir, Aurangzeb took Jodhpur under direct rule and tried to bring Jaswant’s posthumous son, Ajit Singh, up at his court. The Rathor nobles under Durgadas Rathore smuggled the boy out of Delhi, and Rana Raj Singh of Mewar took up their cause. Mughal armies occupied both kingdoms in 1679–1680, and in 1681 Aurangzeb’s son Prince Akbar went over to the Rajputs and proclaimed himself emperor, but his army melted away and he fled to the Marathas. Mewar made peace in 1681; the Rathors fought on in a guerrilla war for a quarter of a century, until Ajit Singh retook Jodhpur days after Aurangzeb’s death in 1707.: La guerre entre Aurangzeb et les royaumes rajputs du Marwar et du Mewar. Lorsque le maharaja Jaswant Singh du Marwar mourut à Jamrud en 1678 sans héritier vivant, Aurangzeb plaça Jodhpur sous son administration directe et voulut faire élever à sa cour le fils posthume de Jaswant, Ajit Singh. Les nobles rathor, conduits par Durgadas Rathore, firent sortir l’enfant de Delhi en secret, et le rana Raj Singh du Mewar prit leur parti. Les armées mogholes occupèrent les deux royaumes en 1679–1680 et, en 1681, le fils d’Aurangzeb, le prince Akbar, passa aux Rajputs et se proclama empereur, mais son armée se dispersa et il s’enfuit chez les Marathes. Le Mewar fit la paix en 1681 ; les Rathor poursuivirent la guérilla pendant un quart de siècle, jusqu’à ce qu’Ajit Singh reprenne Jodhpur quelques jours après la mort d’Aurangzeb, en 1707.
