"In September 1705 a diet near Szécsény formed the Confederated Estates of Hungary and elected Rákóczi their ruling prince, with a senate to share the conduct of the war and of peace talks. Emperor Joseph I, who had succeeded Leopold I in May, opened negotiations through English and Dutch mediators, but neither side would give up Transylvania. In November an imperial army under Ludwig Herbeville, with Danish auxiliaries and Serbian light cavalry, forced its way into Transylvania and beat Rákóczi at Zsibó, while in December János Bottyán’s Kurucs won at Szentgotthárd. Rákóczi paid his troops in copper coins that quickly lost their value.": "En septembre 1705, une diète près de Szécsény forma les Confédérés de Hongrie et élu Rákóczi leur prince au pouvoir, avec un sénat pour partager la conduite de la guerre et des pourparlers de paix. L’empereur Joseph Ier, qui avait succédé à Léopold Ier en mai, ouvrit des négociations par l’intermédiaire de médiateurs anglais et néerlandais, mais aucune partie n’abandonnerait la Transylvanie. En novembre, une armée impériale sous la direction de Ludwig Herbeville, avec des auxiliaires danois et une cavalerie légère serbe, a forcé son chemin vers la Transylvanie et battu Rákóczi à Zsibó, tandis qu’en décembre János Bottyán-S Kurucs a gagné à Szentgotthárd."
"Believing that only a clean break would win him foreign allies, Rákóczi had the diet at Ónod declare the House of Habsburg deposed from the Hungarian throne on 13 June 1707; two county delegates who argued for peace were cut down in the hall. Louis XIV still refused a treaty, and talks with Peter the Great of Russia came to nothing. In August 1708, marching north to reach Silesia, Rákóczi attacked Heister at Trencsén. His horse stumbled at a ditch and threw him unconscious, and his army, thinking him dead, broke and fled, losing about 3,000 killed and wounded and all its guns.": "Croyant que seule une pause pure lui gagnerait des alliés étrangers, Rákóczi a eu le régime à Ónod déclarer la Maison de Habsbourg déposé du trône hongrois le 13 juin 1707 ; deux délégués de comté qui se plaignaient pour la paix ont été coupés dans la salle. Louis XIV refusa toujours un traité, et les pourparlers avec Pierre le Grand de Russie n’arrivèrent à rien. En août 1708, marchant vers le nord pour atteindre la Silésie, Rákóczi attaqua Heister à Trencsén. Son cheval trébucha dans un fossé et le jeta inconscient, et son armée, pensant qu’il était mort, s’est cassée et a fui, perdant environ 3 000 morts et blessés et tous ses canons."
