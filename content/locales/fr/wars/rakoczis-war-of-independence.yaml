"1703–1704": "1703–1704"
"After the Ottomans were driven out of Hungary, Habsburg rule weighed heavily on the country. Taxes were raised, soldiers were quartered on the villages, Protestants were pressed to convert, and reconquered estates were returned only to owners who could prove their title and pay a tenth of their value. Francis II Rákóczi, the richest landowner in Hungary and grandson of princes of Transylvania, was arrested in 1700 for contacts with France, escaped from prison at Wiener Neustadt and fled to Poland. When the War of the Spanish Succession drew most imperial troops west, peasants and former soldiers of the north-east, led by Tamás Esze, rose in the spring of 1703 and asked Rákóczi to lead them.": "Après que les Ottomans furent chassés de la Hongrie, la domination des Habsbourg pesait lourdement sur le pays. Les impôts étaient levés, les soldats étaient cantonnés dans les villages, les protestants étaient pressés de se convertir et les successions reconquises n’étaient restituées qu’aux propriétaires qui pouvaient prouver leur titre et payer un dixième de leur valeur. François II Rákóczi, le propriétaire foncier le plus riche de Hongrie et petit-fils des princes de Transylvanie, a été arrêté en 1700 pour contacts avec la France, s’est évadé de prison à Wiener Neustadt et s’est enfui en Pologne. Lorsque la guerre de la Succession espagnole a attiré la plupart des troupes impériales à l’ouest, les paysans et anciens soldats du nord-est, dirigés par Tamás Esze, se sont levés au printemps de 1703 et ont demandé à Rákóczi de les diriger."
"On 15 June 1703 Rákóczi met Esze’s men at Lavochne, on the Polish side of the Carpathians, and led them into Hungary by the Verecke Pass; his friend Count Miklós Bercsényi brought French money and Polish mercenaries. Most nobles at first held back from what looked like a peasant revolt, but by late September the Kurucs held most of Hungary east and north of the Danube. In 1704 they crossed into Transdanubia and raided Lower Austria, Styria and Moravia, and Vienna threw up an earthwork, the Linienwall, against them. The Transylvanian diet elected Rákóczi prince on 8 July 1704. The allied victory at Blenheim in August ended hopes of joining the French and Bavarians, and on 26 December General Sigbert Heister beat the Kurucs at Nagyszombat.": "Le 15 juin 1703, Rákóczi rencontra des hommes d’Esze à Lavochne, du côté polonais des Carpates, et les conduisit en Hongrie par le col de Verecke ; son ami le comte Miklós Bercsényi apporta de l’argent français et des mercenaires polonais. La plupart des nobles ont d’abord retenu ce qui ressemblait à une révolte paysanne, mais fin septembre les Kurucs ont tenu la plus grande partie de la Hongrie à l’est et au nord du Danube. En 1704, ils ont traversé la Transdanubie pour attaquer la Basse-Autriche, la Styrie et la Moravie, et Vienne ont jeté contre eux un ouvrage terrestre, le Linienwall. La victoire alliée à Blenheim en août a mis fin aux espoirs de rejoindre les Français et les Bavarois, et le 26 décembre le général Sigbert Heister a battu les Kurucs à Nagyszombat."
