"1704": "1704"
"Rákóczi’s War of Independence": "La guerre d’indépendance de Rákóczi"
"A rising of Hungarian nobles, soldiers and peasants, the Kurucs, led by Prince Francis II Rákóczi against Habsburg rule, fought while most imperial troops were away in the War of the Spanish Succession. At its height the rebels held most of Hungary and Transylvania and raided Austria and Moravia, but after their defeat at Trencsén in 1708 the rising collapsed, and the Peace of Szatmár in 1711 brought an amnesty and a promise to respect Hungary’s constitution.": "Une montée des nobles, des soldats et des paysans hongrois, les Kurucs, dirigés par le prince François II Rákóczi contre la domination de Habsbourg, se sont battus tandis que la plupart des troupes impériales étaient absentes dans la guerre de la Succession espagnole. À son apogée, les rebelles détenaient la plus grande partie de la Hongrie et de la Transylvanie et pillaient l’Autriche et la Moravie, mais après leur défaite à Trencsén en 1708, la montée s’est effondrée, et la paix de Szatmár en 1711 apportait une amnistie et une promesse de respecter la constitution hongroise."
"Dates are New Style (Gregorian).": "Les dates sont New Style (Gregorian)."
"The rebels were called kuruc, a name first used for crusading peasants in 1514; Hungarians loyal to the Habsburgs were called labanc. Serbs of the southern border, Croats, the Transylvanian Saxons and Danish auxiliaries fought on the imperial side, while Slovaks, Rusyns, many Romanians, Polish volunteers and French officers served with the Kurucs.": "Les rebelles ont été appelés kuruc, un nom utilisé pour les paysans croisés en 1514 ; les Hongrois fidèles aux Habsbourg ont été appelés labanc. Serbes de la frontière sud, Croates, les Transylvaniens Saxons et auxiliaires danois se sont battus du côté impérial, tandis que les Slovaques, Rusyns, beaucoup de Roumains, volontaires polonais et officiers français ont servi avec les Kurucs."
"Places are given their Hungarian names, as in most accounts; Trencsén is Trenčín and Nagyszombat Trnava in Slovakia, Munkács is Mukachevo in Ukraine, and Szatmár is Satu Mare, Zsibó Jibou and Gyulafehérvár Alba Iulia in Romania.": "Les lieux sont donnés leur nom hongrois, comme dans la plupart des comptes ; Trencsén est Trenčín et Nagyszombat Trnava en Slovaquie, Munkács est Mukachevo en Ukraine, et Szatmár est Satu Mare, Zsibó Jibou et Gyulafehérvár Alba Iulia en Roumanie."
