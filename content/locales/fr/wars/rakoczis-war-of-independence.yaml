"1709–1711": "1709–1711"
"After Trencsén the imperial armies won back the country fortress by fortress, while plague spread across Hungary from 1708 to 1711 and killed far more people than the fighting. Many nobles made their peace with the emperor. At Romhány on 22 January 1710 Rákóczi’s last field army, with Polish, Swedish and French soldiers among its ranks, came close to beating an imperial force before being driven back. Érsekújvár surrendered that autumn, and the Kurucs were pushed back to the north-east, around Munkács and Szatmár.": "Après Trencsén, les armées impériales remportèrent la forteresse par la forteresse, tandis que la peste s’étendit à travers la Hongrie de 1708 à 1711 et tua beaucoup plus de gens que les combats. Beaucoup de nobles firent leur paix avec l’empereur. Érsekújvár s’est rendu cet automne, et les Kurucs ont été repoussés vers le nord-est, autour de Munkács et de Szatmár."
"Field Marshal János Pálffy, a loyalist Hungarian, opened talks with the Kuruc commander Sándor Károlyi in late 1710. Rákóczi rejected the terms and left for Poland on 21 February 1711 to seek help from Peter the Great, forbidding further talks, but Károlyi went on. Joseph I died in April, and his brother Charles VI wanted peace. Under the Peace of Szatmár, agreed on 29 April and signed on 1 May 1711, the Kurucs who swore loyalty received an amnesty and their estates, and the crown promised to respect the laws, diet and religious freedoms of Hungary and Transylvania. About 12,000 Kurucs laid down their flags at Majtény. Rákóczi refused the amnesty and died in exile at Rodosto on the Sea of Marmara in 1735.": "Le maréchal de campagne János Pálffy, un Hongrois loyaliste, a ouvert des pourparlers avec le commandant Kuruc Sándor Károlyi à la fin de 1710. Rákóczi a rejeté les conditions et est parti pour la Pologne le 21 février 1711 pour demander l’aide de Pierre le Grand, interdisant d’autres discussions, mais Károlyi a continué. Joseph Ier est mort en avril, et son frère Charles VI voulait la paix. Sous la paix de Szatmár, convenue le 29 avril et signée le 1er mai 1711, les Kuruques qui juraient fidélité reçurent une amnistie et leurs successions, et la couronne promit de respecter les lois, l’alimentation et les libertés religieuses de la Hongrie et de la Transylvanie. Rákóczi refusa l’amnistie et mourut en exil à Rodosto sur la mer de Marmara en 1735."
