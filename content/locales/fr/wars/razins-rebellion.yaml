# Some French text was translated automatically.
"Razin’s Rebellion": "La rébellion des Razins"
"A rising of Cossacks, runaway peasants, townspeople and the non-Russian peoples of the Volga led by the Don Cossack Stepan (Stenka) Razin, who took Astrakhan, Saratov and Samara in 1670 and called on the people to kill the boyars and officials. Beaten at Simbirsk in October 1670, Razin was handed over by the Don Cossack elders and executed in Moscow in June 1671, and the rising was put down with mass executions.": "Une montée de Cosaques, paysans fugueurs, citadins et non-russes de la Volga menée par le Don Cosaque Stepan (Stenka) Razin, qui a pris Astrakhan, Saratov et Samara en 1670 et appelé le peuple à tuer les boyars et les officiels. Battu à Simbirsk en octobre 1670, Razin fut remis par les anciens de Don Cosaque et exécuté à Moscou en juin 1671."
"Dates are Old Style (Julian), as used in Russia, which ran ten days behind the Gregorian calendar.": "Les dates sont Old Style (Julien), comme utilisé en Russie, qui a couru dix jours derrière le calendrier grégorien."
