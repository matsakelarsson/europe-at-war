"July 1670 – November 1671": "juillet 1670 – novembre 1671"
"In late July Razin left Astrakhan and sailed up the Volga with some 200 boats. Saratov and Samara opened their gates, and his agents spread letters calling on the people to kill the boyars, nobles and officials. Peasants rose across the middle Volga, joined by Chuvash, Mari, Mordvins and Tatars, and the rising spread west towards Tambov, Penza and Nizhny Novgorod. In September Razin laid siege to Simbirsk, but its governor, Ivan Miloslavsky, held the citadel. On 1 and 4 October a relief army under Prince Yury Baryatinsky beat the rebels on the Sviyaga, and Razin, wounded, fled down the Volga to the Don.": "Fin juillet, Razin quitta Astrakhan et remonta la Volga avec quelque 200 bateaux. Saratov et Samara ouvrirent leurs portes, et ses agents répandirent des lettres appelant le peuple à tuer les boyars, les nobles et les fonctionnaires. Les paysans se levèrent à travers la Volga centrale, rejointe par Chuvash, Mari, Mordvins et Tatars, et la montée s’étendit vers l’ouest vers Tambov, Penza et Nijni Novgorod. En septembre Razin assiégea Simbirsk, mais son gouverneur, Ivan Miloslavsky, tenait la citadelle. Les 1er et 4 octobre, une armée de secours dirigée par le prince Yury Baryatinsky a battu les rebelles sur la Sviyaga, et Razin, blessé, a fui la Volga vers le Don."
"His followers fought on into 1671, and the government’s revenge was savage. From Arzamas, Prince Yury Dolgorukov’s troops burned rebel villages and hanged, quartered or impaled thousands of people. Razin’s prestige was broken, the Church anathematised him, and in April 1671 the Don Cossack elders, led by his godfather Kornila Yakovlev, captured him at Kagalnik and handed him over. He was quartered on Red Square in Moscow on 6 June 1671. Astrakhan held out under his lieutenants until November.": "Ses disciples se battaient en 1671, et la vengeance du gouvernement était sauvage. De Arzamas, les troupes du prince Yury Dolgorukov ont brûlé des villages rebelles et pendu, cantonné ou empalé des milliers de personnes. Le prestige de Razin fut brisé, l’Église l’anathématisa et, en avril 1671, les anciens de Don Cosaque, dirigés par son parrain Kornila Yakovlev, le prirent à Kagalnik et le livrèrent. Il fut cantonné sur la place rouge à Moscou le 6 juin 1671. Astrakhan se tint sous ses lieutenants jusqu’en novembre."
