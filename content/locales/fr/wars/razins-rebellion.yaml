"1667 – July 1670": "1667 – juillet 1670"
"Stepan Razin, known as Stenka, was a Don Cossack who in 1667 led a band of Cossacks and runaway peasants down the Volga on a raiding expedition. They seized Yaitsk on the Yaik (today’s Oral in Kazakhstan), plundered the Persian shores of the Caspian Sea and in 1669 destroyed a Persian fleet sent against them. Razin came back rich to Astrakhan, where the tsar’s governors pardoned him. His fame spread among the poor of the south, many of them peasants who had fled the taxes, conscription and tightened serfdom of the years after the Law Code of 1649.": "Stepan Razin, connu sous le nom de Stenka, était un Don Cosaque qui, en 1667, a dirigé une bande de cosaques et de paysans fuyants dans la Volga lors d’une expédition de raids. Ils ont saisi Yaitsk sur le Yaik (aujourd'hui Oral au Kazakhstan), pillé les rives perses de la mer Caspienne et détruit en 1669 une flotte persane envoyée contre eux. Razin revint riche à Astrakhan, où les gouverneurs du tsar lui pardonnèrent. Sa renommée se répandit parmi les pauvres du sud, beaucoup d’entre eux paysans qui avaient fui les impôts, conscription et resserré le serf des années après le Code de Loi de 1649."
"In the spring of 1670 he turned against the government. He declared war on the boyars and officials, though not on the tsar, took Tsaritsyn and sailed down the Volga with about 7,000 men. At Cherny Yar in June the streltsy (musketeers) rose against their officers and joined him. On 24 June the rebels broke into Astrakhan, again helped by a rising inside the city. The governor, Prince Ivan Prozorovsky, and many nobles and officials were killed, the bazaars were looted, and Razin set up a Cossack government under a general assembly, which proclaimed him its sovereign.": "Au printemps de 1670, il se retourna contre le gouvernement. Il déclara la guerre aux boyards et aux officiers, bien que non sur le tsar, prit Tsaritsyn et descendit la Volga avec environ 7 000 hommes. A Cherny Yar en juin, la streltsie (mousquetaires) s’éleva contre leurs officiers et le rejoignit. Le 24 juin, les rebelles firent irruption à Astrakhan, encore aidé par une montée dans la ville. Le gouverneur, le prince Ivan Prozorovsky, et beaucoup de nobles et d’officiers furent tués, les bazars furent pillés, et Razin établit un gouvernement cosaque sous une assemblée générale qui lui proclama son souverain."
