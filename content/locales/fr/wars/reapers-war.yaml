# Some French text was translated automatically.
"Reapers’ War": "Guerre des Faucheurs"
"The revolt of Catalonia against the government of Philip IV and his minister Olivares, set off by the billeting of royal troops during the war with France. The Catalans placed themselves under the French king in 1641 and were ruled by France for over a decade, until Spanish troops retook Barcelona in 1652; at the Peace of the Pyrenees in 1659 Spain ceded Roussillon and northern Cerdanya to France.": "Le logement forcé des troupes royales pendant la guerre contre la France déclenche le soulèvement de la Catalogne contre Philippe IV et son ministre Olivares. En 1641, les Catalans se placent sous l’autorité du roi de France. La domination française dure plus de dix ans, jusqu’à la reprise de Barcelone par les troupes espagnoles en 1652. Par le traité des Pyrénées de 1659, l’Espagne cède à la France le Roussillon et le nord de la Cerdagne."
"Dates are Gregorian. The revolt is named after the reapers, segadors, who sparked the riot of June 1640; the song Els Segadors is now the anthem of Catalonia.": "Les dates sont grégoriennes. La révolte porte le nom des moissonneurs, segadors, qui ont déclenché l’émeute de juin 1640 ; la chanson Els Segadors est maintenant l’hymne de Catalogne."
"The revolt was part of the wider Franco-Spanish War of 1635–1659, which has its own entry. This entry follows events in Catalonia and Roussillon.": "La révolte faisait partie de la guerre franco-espagnole de 1635-1659, qui a sa propre entrée. Cette entrée fait suite aux événements en Catalogne et Roussillon."
"On the base map Catalonia stays under Spain throughout; the rule of the rebel government and of France is drawn in areas.": "Sur la carte de base, la Catalogne reste sous l’Espagne tout au long ; le gouvernement rebelle et de France est dessiné dans les zones."
