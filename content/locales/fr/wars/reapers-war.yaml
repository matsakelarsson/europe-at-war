"1640–1641": "1640–1641"
"Olivares wanted the other kingdoms of the Spanish crown to share the burden of Castile’s wars, and Catalonia, with its own laws and parliament, resisted. After the French took the border fortress of Salses in 1639, royal troops were sent to win it back and then quartered on Catalan villages through the winter, and quarrels over billeting turned into violence. In May 1640 peasants rose against the soldiers. On 7 June, Corpus Christi, reapers who had come to Barcelona for the harvest rioted, and the viceroy, the Count of Santa Coloma, was killed on the shore while trying to escape. Royal judges and officials were hunted down.": "Olivares voulait que les autres royaumes de la couronne espagnole partagent le fardeau des guerres de Castille, et la Catalogne, avec ses propres lois et le parlement, résistèrent. Après avoir pris la forteresse frontalière de Salsès en 1639, des troupes royales furent envoyées pour la reconquérir puis cantonné dans les villages catalans pendant l’hiver, et les querelles sur le billet se transformèrent en violence. Le 7 juin, Corpus Christi, moissonneurs venus à Barcelone pour la récolte s’est émeute, et le vice-roi, comte de Santa Coloma, a été tué sur la rive en essayant de s’échapper."
"The Diputació, Catalonia’s standing government, led by its president Pau Claris, raised troops and sought help from France. In December a royal army under the Marquis of Los Vélez marched up the coast from Tortosa. At Cambrils, on 16 December, hundreds of defenders were killed after they had surrendered. On 16 January 1641 Claris proclaimed a Catalan Republic under French protection, and a week later Louis XIII was declared Count of Barcelona. Los Vélez beat the Catalans at Martorell, but on 26 January his assault on the hill of Montjuïc above Barcelona was thrown back, and his army retreated to Tarragona.": "Le Diputació, gouvernement permanent de Catalogne, dirigé par son président Pau Claris, a levé des troupes et demandé l’aide de la France. En décembre, une armée royale sous le marquis de Los Vélez a marché sur la côte de Tortosa. À Cambrils, le 16 décembre, des centaines de défenseurs ont été tués après leur reddition. Le 16 janvier 1641, Claris proclama une République catalane sous protection française et, une semaine plus tard, Louis XIII fut déclaré comte de Barcelone. Los Vélez battit les Catalans à Martorell, mais le 26 janvier son assaut sur la colline de Montjuïc au-dessus de Barcelone fut repoussé, et son armée se retira à Tarragone."
