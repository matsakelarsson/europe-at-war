"1641–1648": "1641–1648"
"Claris died in February 1641, and by a treaty agreed at Péronne in September Catalonia accepted Louis XIII as its sovereign, keeping its own laws. In 1642 a French army besieged Perpignan, with Louis XIII and Cardinal Richelieu present for part of the time; the starving town surrendered on 9 September, leaving all Roussillon in French hands. On 7 October a Franco-Catalan army under Philippe de La Mothe-Houdancourt beat a larger Spanish army at Lleida. But French viceroys and troops soon made themselves as unpopular as the Castilians had been.": "Claris mourut en février 1641, et par un traité conclu à Péronne en septembre la Catalogne accepta Louis XIII comme souverain, gardant ses propres lois. En 1642 une armée française assiégea Perpignan, avec Louis XIII et le cardinal Richelieu présents pour une partie du temps ; la ville affamée se rendit le 9 septembre, laissant tout Roussillon entre les mains françaises. Le 7 octobre, une armée franco-catalanaise sous la direction de Philippe de La Mothe-Houdancourt battit une plus grande armée espagnole à Lleida. Mais les vice-rois et les troupes français se sont vite rendus aussi impopulaires que les Castiliens."
"After Olivares fell in 1643, Philip IV came to Aragon himself. His army retook Lleida on 30 July 1644, and he swore to respect Catalonia’s laws, which won back many Catalans. A French attack on Tarragona failed that year, and so did French sieges of Lleida in 1646 and 1647, the second led by the young Prince of Condé. The French took Roses on the coast in 1645 and Tortosa, near the mouth of the Ebro, in 1648. By then the front had settled across the middle of Catalonia, and both sides were exhausted.": "Après la chute d’Olivares en 1643, Philippe IV vint à Aragon lui-même. Son armée reprit Lleida le 30 juillet 1644, et il jura de respecter les lois catalanes qui remportèrent de nombreux Catalans. Une attaque française sur Tarragona échoua cette année-là, et les sièges français de Lleida en 1646 et 1647, second dirigé par le jeune prince de Condé. Les Français emmenèrent Roses sur la côte en 1645 et Tortosa, près de l’embouchure de l’Èbre, en 1648. Le front s’était alors installé au milieu de la Catalogne, et les deux côtés étaient épuisés."
