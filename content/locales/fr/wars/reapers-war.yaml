"1650–1659": "1650–1659"
"From 1648 the Fronde, a series of revolts against the regency government, kept France from sending help, while famine and plague killed many in Catalonia from 1650. The Spanish retook Tortosa late that year, and in the summer of 1651 Don Juan José of Austria, Philip IV’s illegitimate son, laid siege to Barcelona by land and sea. After fifteen months the city surrendered on 11 October 1652. Philip pardoned most of the rebels and confirmed Catalonia’s laws, but kept a garrison in Barcelona and control over who could hold office. The French held on in the north and attacked Girona in 1653 without success.": "À partir de 1648, la Fronde, une série de révoltes contre le gouvernement régence, empêcha la France d’envoyer de l’aide, tandis que la famine et la peste tuèrent beaucoup en Catalogne à partir de 1650. L’espagnol reprit Tortosa vers la fin de cette année-là, et à l’été de 1651 Don Juan José d’Autriche, fils illégitime de Philippe IV, assiégea Barcelone par terre et par mer. Philippe pardonna la plupart des rebelles et confirma les lois de Catalogne, mais garda une garnison à Barcelone et le contrôle sur ceux qui pouvaient occuper un poste. Les Français occupèrent dans le nord et attaquèrent Girona en 1653 sans succès."
"Fighting along the Pyrenees went on until the Franco-Spanish War ended. By the Treaty of the Pyrenees, signed on Pheasant Island in the Bidassoa on 7 November 1659, Spain ceded Roussillon and the northern part of Cerdanya to France, and the border was drawn along the crest of the mountains. The town of Llívia, which was not counted among the villages ceded, stayed Spanish as an enclave. In the ceded lands French institutions replaced the Catalan ones, and in 1700 Louis XIV made French compulsory in official documents.": "Par le traité des Pyrénées, signé sur l’île Pheasant dans la Bidassoa le 7 novembre 1659, l’Espagne céda Roussillon et la partie nord de Cerdanya à la France, et la frontière fut tracée le long de la crête des montagnes. La ville de Llívia, qui n’a pas été comptée parmi les villages cédés, est restée espagnole comme enclave. Dans les terres cédées, les institutions françaises ont remplacé celles catalanes, et en 1700 Louis XIV a rendu le français obligatoire dans les documents officiels."
