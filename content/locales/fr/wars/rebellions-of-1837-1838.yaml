# French translations of the catalogue text (wave 14); step bodies follow later.
Rebellions of 1837–1838: Rébellions de 1837–1838
? Armed risings in the British colonies of Lower Canada (Quebec) and Upper Canada (Ontario) against their appointed governments. In Lower Canada the Parti patriote of Louis-Joseph Papineau, which held a large majority in the elected assembly, had demanded control of the colony’s revenues and an elected upper house in its Ninety-two Resolutions of 1834; when the British Parliament rejected them in the Russell Resolutions of March 1837, protest meetings turned into armed resistance. The Patriotes won at Saint-Denis on 23 November 1837 but were crushed at Saint-Charles and Saint-Eustache. In Upper Canada William Lyon Mackenzie led a smaller rising against the oligarchy known as the Family Compact, which was dispersed at Montgomery’s Tavern north of Toronto on 7 December. Exiled rebels and American sympathisers organised in the Hunters’ Lodges then raided the Canadas from the United States through 1838, and a second Patriote rising in November 1838 was defeated within a week. Twelve Patriotes were hanged in Montreal; in Upper Canada two leaders of the 1837 rising and a number of the raiders of 1838 were hanged; and some 150 prisoners were transported to Australia. Lord Durham’s report of 1839 led to the union of the two colonies as the Province of Canada in 1841, and in 1848 to responsible government.
: Des soulèvements armés dans les colonies britanniques du Bas-Canada (Québec) et du Haut-Canada (Ontario) contre leurs gouvernements nommés. Au Bas-Canada, le Parti patriote de Louis-Joseph Papineau, largement majoritaire à l’assemblée élue, avait réclamé dans ses Quatre-vingt-douze Résolutions de 1834 le contrôle des revenus de la colonie et une chambre haute élue ; lorsque le Parlement britannique les rejeta par les résolutions Russell de mars 1837, les assemblées de protestation se muèrent en résistance armée. Les Patriotes l’emportèrent à Saint-Denis le 23 novembre 1837, mais furent écrasés à Saint-Charles et à Saint-Eustache. Au Haut-Canada, William Lyon Mackenzie mena contre l’oligarchie appelée Family Compact un soulèvement de moindre ampleur, qui fut dispersé à la taverne Montgomery, au nord de Toronto, le 7 décembre. Des rebelles exilés et des sympathisants américains regroupés dans les loges des Chasseurs (Hunters’ Lodges) lancèrent ensuite, tout au long de 1838, des raids sur les Canadas depuis les États-Unis, et un second soulèvement patriote, en novembre 1838, fut défait en moins d’une semaine. Douze Patriotes furent pendus à Montréal ; au Haut-Canada, deux chefs du soulèvement de 1837 et un certain nombre d’assaillants de 1838 furent pendus ; et quelque 150 prisonniers furent déportés en Australie. Le rapport de lord Durham, en 1839, conduisit à l’union des deux colonies en une province du Canada en 1841, puis, en 1848, au gouvernement responsable.
