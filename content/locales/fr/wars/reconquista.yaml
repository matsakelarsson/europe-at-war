"By 800 the Umayyad emirate of Córdoba ruled most of the Iberian Peninsula, which Muslim armies had conquered from the Visigoths after 711. Two Christian frontiers faced it. In the north-east the Franks pushed south from the Pyrenees, and in 801, after a siege of several months, Louis the Pious, Charlemagne’s son and king of Aquitaine, took Barcelona. It became the seat of a count in the Frankish Spanish March. In the north-west the small kingdom of Asturias, ruled from Oviedo by Alfonso II (791–842), held the mountains between Galicia and the Basque lands.": "Vers 800, l’émirat omeyyade de Cordoue dirigeait la plupart de la péninsule ibérique, que les armées musulmanes avaient conquis des Visigoths après 711. Deux frontières chrétiennes l’affrontèrent. Au nord-est, les Francs poussaient au sud des Pyrénées, et en 801, après un siège de plusieurs mois, Louis le Pieux, fils de Charlemagne, roi d’Aquitaine, prit Barcelone. Il devint le siège d’un comte dans la Marche espagnole francaise. Au nord-ouest, le petit royaume des Asturies, gouverné d’Oviedo par Alfonso II (791–842), tenait les montagnes entre Galice et les terres basques."
"Early in the 9th century a tomb in Galicia was proclaimed to be that of the apostle James, and Santiago de Compostela grew into a great shrine. While the emirate was distracted by revolts, Asturian kings and counts settled the thinly peopled lands to the south, taking over or refounding towns. León was resettled in 856, Porto taken in 868, Coimbra in 878, Burgos founded in 884 and Zamora resettled in 893. By about 910 the frontier ran along the Duero, and Alfonso III’s sons moved the court south to León, which gave the kingdom its new name.": "Au début du IXe siècle, une tombe en Galice fut proclamée comme celle de l’apôtre Jacques, et Santiago de Compostelle devint un grand sanctuaire. Alors que l’émirat était distrait par des révoltes, les rois asturiens et les comtes installèrent les terres peu peuplées au sud, prenant ou refondant les villes. León fut réinstallé en 856, Porto pris en 868, Coimbra en 878, Burgos fondé en 884 et Zamora réinstallé en 893. Vers 910 la frontière courut le long du Duero, et les fils d’Alfonso III-S déplacé la cour au sud à León, qui donna au royaume son nouveau nom."
