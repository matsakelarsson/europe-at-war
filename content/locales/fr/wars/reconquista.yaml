"Reconquista": "Reconquista"
"The centuries of war in which the Christian kingdoms of the north of the Iberian Peninsula, Asturias–León, Castile, Navarre, Aragon, Catalonia and Portugal, conquered the Muslim lands of al-Andalus. Under the caliphs of Córdoba and the North African Almoravids and Almohads the Muslims long held the upper hand, but after the fall of Toledo in 1085, Lisbon in 1147, the battle of Las Navas de Tolosa in 1212 and the conquests of Córdoba, Valencia and Seville in 1236–1248, only the Nasrid emirate of Granada remained. The struggle for the Strait of Gibraltar followed, and the Granada War of 1482–1492 completed the conquest.": "Pendant plusieurs siècles, les royaumes chrétiens du nord de la péninsule Ibérique, les Asturies et le León, la Castille, la Navarre, l’Aragon, la Catalogne et le Portugal, conquièrent les terres musulmanes d’al-Andalus. Les musulmans gardent longtemps l’avantage sous les califes de Cordoue, puis sous les Almoravides et les Almohades d’Afrique du Nord. Après la prise de Tolède en 1085 et de Lisbonne en 1147, la bataille de Las Navas de Tolosa en 1212 et les conquêtes de Cordoue, de Valence et de Séville entre 1236 et 1248, seul subsiste l’émirat nasride de Grenade. La lutte pour le détroit de Gibraltar suit, puis la guerre de Grenade de 1482–1492 achève la conquête."
"The name Reconquista, “reconquest”, became usual only in the 19th century. It reflects the claim of the Christian kings to be restoring the Visigothic kingdom that the Muslims had conquered after 711. Historians debate how far the wars were one long religious struggle; Christian and Muslim rulers often allied with each other, and Christians fought Christians and Muslims fought Muslims at least as often as they fought each other.": "Le nom de Reconquista, « reconquête » n’est devenu habituel qu’au XIXe siècle. Il reflète la revendication des rois chrétiens de restaurer le royaume visigothique que les musulmans avaient conquis après 711. Les historiens discutent jusqu’où les guerres ont été une longue lutte religieuse ; les dirigeants chrétiens et musulmans s’allient souvent les uns aux autres, et les chrétiens combattent les chrétiens et les musulmans au moins aussi souvent qu’ils se battent."
"This story begins around 800, where the map begins. The traditional starting point is the battle of Covadonga in Asturias, about 718–722. It ends in the 1460s; the Granada War (1482–1492), the fitna of al-Andalus (1009–1031) and the Mudéjar revolt of 1264–1266 have their own entries.": "Cette histoire commence autour de 800, où la carte commence. Le point de départ traditionnel est la bataille de Covadonga en Asturies, environ 718–722. Elle se termine dans les années 1460 ; la guerre de Grenade (1482–1492), la fitna d’al-Andalus (1009–1031) et la révolte mudéjar de 1264–1266 ont leurs propres entrées."
"Christian documents of the time are dated by the Spanish era, 38 years ahead of the year of Christ, and Arabic sources by the Islamic calendar. Dates here are converted to the Julian calendar, as usual. Chronicles on both sides give armies and losses that are far too large.": "Les documents chrétiens du temps sont datés de l’époque espagnole, 38 ans avant l’année du Christ, et les sources arabes par le calendrier islamique. Les dates ici sont converties au calendrier julien, comme d’habitude. Chroniques des deux côtés donnent des armées et des pertes qui sont beaucoup trop grandes."
"Arabic names are simplified (Abd al-Rahman, al-Mansur). Places are given their modern names, with the Arabic name where it is often used (Madina Mayurqa for Palma).": "Les noms arabes sont simplifiés (Abd al-Rahman, al-Mansur) et les lieux reçoivent leur nom moderne, avec le nom arabe où il est souvent utilisé (Madina Mayurqa pour Palma)."
