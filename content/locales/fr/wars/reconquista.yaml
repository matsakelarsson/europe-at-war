"Under Abd al-Rahman’s son al-Hakam II the frontier was quiet, but when he died in 976 his heir Hisham II was a boy. Within a few years power passed to the chamberlain, Muhammad ibn Abi Amir, who took the title al-Mansur, “the victorious”, and is known to the Christians as Almanzor. He built a professional army of Berber troops from North Africa and paid Christian mercenaries, and he led raids against the Christian north almost every year, about fifty-six in all, for captives, cattle and loot.": "Sous Abd al-Rahman, le fils al-Hakam II la frontière était calme, mais quand il est mort en 976 son héritier Hisham II était un garçon. Quelques années plus tard, le pouvoir est passé au chambellan, Muhammad ibn Abi Amir, qui a pris le titre d’al-Mansur, le vainqueur, et est connu des chrétiens comme Almanzor. Il construisit une armée professionnelle de troupes berbères d’Afrique du Nord et payait des mercenaires chrétiens, et il menait des raids contre le nord chrétien presque chaque année, environ cinquante-six en tout, pour les captifs, le bétail et le butin."
"His raids reached every Christian capital. In July 985 he took Barcelona and killed or enslaved many of its people; when the Frankish king sent no help, the counts of Barcelona drifted out of his kingdom. He took Coimbra in 987 and sacked León, and in August 997 he sacked Santiago de Compostela, which its bishop had evacuated, sparing the apostle’s tomb but carrying the cathedral’s bells to Córdoba. He fell ill on a raid into the Rioja in 1002 and died at Medinaceli that August. The later Christian story of his defeat at Calatañazor is a legend.": "Ses raids atteignirent toutes les capitales chrétiennes. En juillet 985, il prit Barcelone et tua ou asservis beaucoup de ses habitants ; quand le roi franc n’envoya aucune aide, les comtes de Barcelone s’éloignèrent de son royaume. Il prit Coimbra en 987 et largua León, et en août 997 il latta Santiago de Compostelle, que son évêque avait évacué, épargnant le tombeau de l’apôtre mais portant les cloches de la cathédrale à Cordoue. Il tomba malade lors d’un raid dans la Rioja en 1002 et mourut à Medinaceli en août."
