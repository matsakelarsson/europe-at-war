"1086–1102": "1086–1102"
"The fall of Toledo alarmed the taifa kings. Al-Mutamid of Seville and others called on Yusuf ibn Tashfin, emir of the Almoravids, a strict Berber religious movement that had conquered Morocco. His army crossed to Algeciras in the summer of 1086, and on 23 October, at Sagrajas (al-Zallaqa) near Badajoz, it routed Alfonso VI, who escaped wounded. Yusuf went home, but he returned in 1088 and, finding the taifa rulers as divided as ever, deposed them one by one from 1090, beginning with Granada and Seville, until al-Andalus was an Almoravid province.": "Al-Mutamid de Séville et d’autres ont appelé Yusuf ibn Tashfin, émir des Almoravids, un mouvement religieux berbère strict qui avait conquis le Maroc. Son armée a traversé à Algeciras pendant l’été 1086, et le 23 octobre, à Sagrajas (al-Zallaqa) près de Badajoz, il a roué Alfonso VI, qui s’est échappé blessé. Yusuf rentra chez lui, mais il revint en 1088 et trouva les chefs de la taifa plus divisés que jamais, les déposa un par un de 1090, à commencer par Grenade et Séville, jusqu’à ce qu’al-Andalus fût une province d’Almoravid."
"In the east one Christian leader held his ground. Rodrigo Díaz de Vivar, El Cid, a Castilian noble twice exiled by Alfonso VI, had served the Muslim rulers of Zaragoza and built up a following of his own. He besieged Valencia from 1092, starved it into surrender in June 1094, beat an Almoravid army at Cuarte that October and ruled the city as an independent lord. After his death in 1099 his widow, Jimena, held it until 1102, when Alfonso VI judged it indefensible, evacuated it and set it on fire. The Almoravids entered on 5 May.": "Dans l’est, un chef chrétien tenait son terrain. Rodrigo Díaz de Vivar, El Cid, noble castillan deux fois exilé par Alfonso VI, avait servi les dirigeants musulmans de Saragosse et construit une suite de ses propres. Il assiégea Valence à partir de 1092, l’abandonna en juin 1094, battit une armée d’Almoravid à Cuarte en octobre et régna la ville comme un seigneur indépendant. Après sa mort en 1099, sa veuve, Jimena, la conserva jusqu’à 1102, quand Alfonso VI la jugeait indéfendable, l’évacue et le met en feu."
"Battle of Sagrajas": "Bataille de Sagrajas"
"23 October 1086, Almoravid victory": "23 octobre 1086, victoire d’Almoravid"
"El Cid takes Valencia": "El Cid prend Valence"
"June 1094": "juin 1094"
"Valencia abandoned": "Valence abandonnée"
"May 1102": "mai 1102"
"Algeciras": "Algésiques"
"July 1086": "juillet 1086"
"Al-Mutamid of Seville handed over the port so that Yusuf’s army could land.": "Al-Mutamid de Séville a remis le port pour que l’armée de Yusufs puisse atterrir."
"23 October 1086": "23 octobre 1086"
"Yusuf’s Almoravids and the taifa armies routed Alfonso VI, who escaped with a leg wound. Christian losses were heavy.": "Les Almoravids de Yusuf et les armées taifa ont fait route vers Alfonso VI, qui s’est échappé avec une blessure à la jambe."
"Aledo": "Alédo"
"A Castilian garrison in this castle held out against Yusuf and the taifa kings, whose quarrels during the siege persuaded him to depose them.": "Une garnison castillane dans ce château s’est tenue contre Yusuf et les rois de la taifa, dont les querelles pendant le siège l’ont persuadé de les déposer."
"Seville": "Séville"
"September 1091": "septembre 1091"
"Almoravid troops took the city and sent al-Mutamid into exile at Aghmat in Morocco, where he died in 1095.": "Les troupes d’Almoravid ont pris la ville et envoyé al-Mutamid en exil à Aghmat au Maroc, où il est mort en 1095."
"Valencia": "Valence"
"After a siege of almost two years the starving city surrendered to the Cid, who later had its qadi, Ibn Jahhaf, burned alive.": "Après un siège de près de deux ans, la ville affamée s’est rendue au Cid, qui a plus tard fait brûler vif son qadi, Ibn Jahhaf."
"Battle of Cuarte": "Bataille de Cuarte"
"21 October 1094": "21 octobre 1094"
"The Cid broke the Almoravid army that had come to retake Valencia, the first defeat of a large Almoravid army in the peninsula.": "Le Cid a brisé l’armée Almoravid qui était venue reprendre Valence, la première défaite d’une grande armée Almoravid dans la péninsule."
"Yusuf ibn Tashfin": "Yusuf ibn Tashfin"
"El Cid": "Tél."
"Zaragoza and Alfonso the Battler": "Zaragoza et Alfonso le Batailleur"
"1108–1134": "1108–1134"
"The Almoravids pressed on against Castile. At Uclés, on 29 May 1108, they destroyed a Castilian army, and Sancho, Alfonso VI’s only son, was killed in the flight. When the old king died the next year his daughter Urraca married Alfonso I of Aragon and Navarre, a match that soon turned into war between them. In 1110 the Almoravids took Zaragoza, the last independent taifa. Its fall threatened the Ebro valley, where Aragon had been advancing for decades and had taken Huesca in 1096.": "Les Almoravid ont poursuivi contre la Castille. A Uclé, le 29 mai 1108, ils ont détruit une armée castillane, et Sancho, fils unique d’Alfonso VI, a été tué dans le vol. Quand le vieux roi est mort l’année suivante sa fille Urraca a épousé Alfonso I d’Aragon et Navarre, un match qui s’est rapidement transformé en guerre entre eux. En 1110, les Almoravids prirent Saragosse, la dernière taifa indépendante. Sa chute menaça la vallée de l’Ebre, où Aragon progressait depuis des décennies et avait pris Huesca en 1096."
"Alfonso I, the Battler, answered with a crusade. With French lords such as Gaston of Béarn, a veteran of the capture of Jerusalem, he besieged Zaragoza from May 1118 and took it on 18 December. Tudela, Tarazona and Calatayud followed, and in 1120 he beat an Almoravid relief army at Cutanda. In 1125–1126 he led a raid deep into Andalusia, bringing back thousands of Mozarab Christians to settle his new lands. In July 1134 the Almoravids routed him at Fraga, and he died that September, leaving his kingdoms to the military orders; nobody obeyed the will, and Aragon and Navarre went separate ways.": "Avec des seigneurs français comme Gaston de Béarn, vétéran de la capture de Jérusalem, il assiégea Saragosse à partir de mai 1118 et le prit le 18 décembre. Tudela, Tarazona et Calatayud suivirent, et en 1120 il battit une armée de secours Almoravid à Cutanda. En 1125–1126, il conduisit un raid profond en Andalousie, ramenant des milliers de chrétiens mozarabes pour établir ses nouvelles terres. En juillet 1134, les Almoravids l’orientèrent à Fraga, et il mourut en septembre, laissant ses royaumes aux ordres militaires ; personne n’obéissait à la volonté, et Aragon et Navarre allaient de différentes façons."
"Battle of Uclés": "Bataille d’Uclés"
"29 May 1108, Almoravid victory": "29 mai 1108, victoire d’Almoravid"
"Zaragoza taken": "Zaragoza prise"
"18 December 1118": "18 décembre 1118"
"Battle of Fraga": "Bataille de Fraga"
"17 July 1134, Almoravid victory": "17 juillet 1134, victoire d’Almoravid"
"29 May 1108": "29 mai 1108"
"The Almoravid governor Tamim beat the Castilians. Many Leonese and Castilian nobles were killed, and the young prince Sancho was murdered by villagers as he fled.": "Le gouverneur de l’Almoravid Tamim battit les Castiliens. Beaucoup de nobles léonais et castillais furent tués, et le jeune prince Sancho fut assassiné par des villageois alors qu’il s’enfuit."
"Huesca": "Huesca"
"Peter I of Aragon took the town after beating a relief army from Zaragoza at Alcoraz.": "Pierre Ier d’Aragon a pris la ville après avoir battu une armée de secours de Saragosse à Alcoraz."
"Zaragoza": "Zaragoza"
"After a seven-month siege the city surrendered on terms, and Alfonso made it his capital. Many of its Muslims left.": "Après un siège de sept mois, la ville s’est rendue dans les conditions, et Alfonso en a fait sa capitale."
"Tudela": "Tudelas"
"The Ebro town fell soon after Zaragoza, with Tarazona and the rest of the lower Ebro valley.": "La ville d’Ebro tombe peu après Zaragoza, avec Tarazona et le reste de la vallée inférieure de l’Èbre."
"Battle of Cutanda": "Bataille de Cutanda"
"17 June 1120": "17 juin 1120"
"Alfonso and Duke William IX of Aquitaine beat an Almoravid army marching to relieve Calatayud, which then surrendered.": "Alfonso et le duc Guillaume IX d’Aquitaine ont battu une armée almoravie marchant pour soulager Calatayud, qui s’est ensuite rendu."
"17 July 1134": "17 juillet 1134"
"An Almoravid relief army caught Alfonso’s besieging army outside Fraga. He escaped but died seven weeks later.": "Une armée de secours d’Almoravid a pris Alfonso, assiégeant l’armée devant Fraga. Il s’est échappé mais est mort sept semaines plus tard."
"Alfonso I, 1125–26": "Alfonso I, 1125–26"
"Lisbon, Almería and Tortosa": "Lisbonne, Almería et Tortosa"
"1139–1149": "1139–1149"
"By the 1140s Almoravid rule was collapsing. In Morocco the Almohads, a rival reform movement from the Atlas mountains, were taking the cities one by one, and in al-Andalus local leaders rebelled and set up new taifas. The Christian rulers moved fast. Afonso Henriques, count of Portugal, had won a battle at Ourique in 1139 and called himself king, a title Castile accepted in 1143, and on 15 March 1147 his men took Santarém by a night assault.": "Au Maroc, les Almohades, un mouvement de réforme rival des montagnes de l’Atlas, emmenaient les villes un par un, et les dirigeants locaux d’al-Andalus se rebellèrent et instituèrent de nouvelles taifas. Les dirigeants chrétiens passèrent rapidement. Afonso Henriques, comte du Portugal, avait gagné une bataille à Ourique en 1139 et s’appelait roi, titre de Castille accepté en 1143, et le 15 mars 1147 ses hommes prirent Santarém par un assaut nocturne."
"That summer a fleet of crusaders bound for the Holy Land, from England, Flanders and the Rhineland, put in at Porto and agreed to help him take Lisbon. After a siege of four months the city surrendered on 24 October, and the crusaders plundered it and killed many people, among them its Mozarab bishop. A week earlier Alfonso VII of León–Castile, with Genoese, Catalan and Navarrese help, had taken Almería, and Count Ramon Berenguer IV of Barcelona, ruler of Aragon by his betrothal to its heiress, went on to take Tortosa in December 1148 and Lleida in October 1149.": "Cet été-là, une flotte de croisés à destination de la Terre Sainte, d’Angleterre, de Flandre et de Rhénanie, s’installa à Porto et accepta de l’aider à prendre Lisbonne. Après un siège de quatre mois, la ville se rendit le 24 octobre, et les croisés le pillèrent et tuèrent beaucoup de gens, dont son évêque Mozarab. Une semaine plus tôt, Alfonso VII de León–Castil, avec l’aide de Genoese, Catalan et Navarrese, avait pris Almería, et le comte Ramon Berenguer IV de Barcelone, chef d’Aragon par sa fiancée à son héritière, a continué à prendre Tortosa en décembre 1148 et Lleida en octobre 1149."
"Siege of Lisbon": "Siège de Lisbonne"
"1 July – 25 October 1147": "1er juillet – 25 octobre 1147"
"Almería taken": "Almería prise"
"17 October 1147": "17 octobre 1147"
"Tortosa and Lleida taken": "Tortosa et Lleida prises"
"30 December 1148 and 24 October 1149": "30 décembre 1148 et 24 octobre 1149"
"Santarém": "Père Noël"
"15 March 1147": "15 mars 1147"
"Afonso Henriques’s men scaled the walls at night and took the town, opening the way to Lisbon.": "Les hommes d’Afonso Henriques ont escaladé les murs la nuit et ont pris la ville, ouvrant le chemin à Lisbonne."
"Lisbon": "Lisbonne"
"Portuguese troops and the crews of some 160 crusader ships besieged the city until hunger forced it to surrender. The Englishman Gilbert of Hastings became its first bishop.": "Les troupes portugaises et les équipages de quelque 160 navires croisés assiégèrent la ville jusqu’à ce que la faim l’oblige à se rendre. L’Anglais Gilbert de Hastings devint son premier évêque."
"Almería": "Almería"
"The rich port, a base for corsairs and the silk trade, fell to Alfonso VII and his allies, with a Genoese fleet. The Almohads retook it in 1157.": "Le riche port, base pour les corsaires et le commerce de la soie, est tombé à Alfonso VII et ses alliés, avec une flotte génoise. Les Almohades l’ont repris en 1157."
"Tortosa": "Tortosa"
"30 December 1148": "30 décembre 1148"
"Ramon Berenguer IV and the Genoese took the city near the mouth of the Ebro after a six-month siege.": "Ramon Berenguer IV et les Génois ont pris la ville près de l’embouchure de l’Èbre après un siège de six mois."
"Lleida": "Lleida"
"24 October 1149": "24 octobre 1149"
"Lleida, Fraga and Mequinenza surrendered on the same day, completing the conquest of the lower Ebro.": "Lleida, Fraga et Mequinenza se rendirent le même jour, complétant la conquête de l’Èbre inférieure."
"Crusader fleet": "Flotte de croisés"
"Alfonso VII": "Alfonso VII"
"Ramon Berenguer IV": "Ramon Berenguer IV"
"Alarcos and Las Navas de Tolosa": "Alarcos et Las Navas de Tolosa"
"1172–1212": "1172–1212"
"The Almohads, ruling from Marrakesh, took over al-Andalus, and by 1172 they had absorbed the last independent kingdom, Ibn Mardanish’s Murcia. Castile, León and Portugal, now separate kingdoms, fought them and each other along a frontier guarded by new military orders such as Calatrava and Santiago. Alfonso VIII of Castile took Cuenca in 1177. But on 18 July 1195, at Alarcos, near today’s Ciudad Real, the caliph Abu Yusuf Yaqub al-Mansur routed him, and Almohad armies then raided as far as Toledo and Madrid.": "Les Almohades, qui gouvernaient de Marrakech, reprirent al-Andalus et, en 1172, ils avaient absorbé le dernier royaume indépendant, Ibn Mardanish. Murcie. Castille, León et Portugal, maintenant des royaumes séparés, les combattirent ensemble le long d’une frontière gardée par de nouveaux ordres militaires tels que Calatrava et Santiago. Alfonso VIII de Castille prit Cuenca en 1177. Mais le 18 juillet 1195, à Alarcos, près d’aujourd'hui Ciudad Real, le calife Abu Yusuf Yaqub al-Mansur l’a roué, et les armées d’Almohad ont ensuite fait des raids jusqu’à Tolède et Madrid."
"Pope Innocent III proclaimed a crusade, and in 1212 Alfonso VIII, Peter II of Aragon and Sancho VII of Navarre gathered at Toledo with the military orders, a Portuguese contingent and crusaders from beyond the Pyrenees, most of whom went home after the capture of Calatrava. Crossing the Sierra Morena by a little-used pass, the army met the caliph Muhammad al-Nasir at Las Navas de Tolosa on 16 July 1212 and broke his army. Baeza was abandoned and Úbeda stormed, many of its people killed or enslaved. Almohad power never recovered.": "Le pape Innocent III proclama une croisade, et en 1212 Alfonso VIII, Pierre II d’Aragon et Sancho VII de Navarre se rassemblèrent à Tolède avec les ordres militaires, un contingent portugais et des croisés venant du-delà des Pyrénées, dont la plupart rentrèrent chez eux après la capture de Calatrava. Traversant la Sierra Morena par un col peu utilisé, l’armée a rencontré le calife Muhammad al-Nasir à Las Navas de Tolosa le 16 juillet 1212 et a brisé son armée. Baeza a été abandonné et Úbeda a pris l’assaut, beaucoup de ses gens tués ou esclaves. Almohad pouvoir ne s’est jamais rétabli."
"Battle of Alarcos": "Bataille d’Alarcos"
"18 July 1195, Almohad victory": "18 juillet 1195, victoire d’Almohad"
"Battle of Las Navas de Tolosa": "Bataille de Las Navas de Tolosa"
"16 July 1212, Christian victory": "16 juillet 1212, victoire chrétienne"
"Cuenca": "Cuenca"
"21 September 1177": "21 septembre 1177"
"Alfonso VIII took the hilltop town after a siege of nine months, with help from Aragon.": "Alfonso VIII a pris la ville au sommet de la colline après un siège de neuf mois, avec l’aide d’Aragon."
"18 July 1195": "18 juillet 1195"
"Alfonso VIII attacked before his Leonese and Navarrese allies arrived and was routed. The castle of Calatrava was lost soon after.": "Alfonso VIII attaqua avant que ses alliés léonais et navarsiens n’arrivent et fut roué. Le château de Calatrava fut perdu peu après."
"Calatrava": "Calatrava"
"1 July 1212": "1er juillet 1212"
"The crusaders retook the castle and let its garrison go. Many of the foreign knights, discontented with the heat and the terms, went home soon after.": "Les croisés reprirent le château et laissèrent partir sa garnison. Beaucoup de chevaliers étrangers, mécontents de la chaleur et des termes, rentrèrent chez eux peu après."
"16 July 1212": "16 juillet 1212"
"The Christian armies broke the Almohad lines and the caliph’s guard. Al-Nasir fled, and he died in Marrakesh the next year.": "Les armées chrétiennes ont brisé les lignes d’Almohad et le garde du calife. Al-Nasir s’est enfui, et il est mort à Marrakech l’année suivante."
"Úbeda": "Úbeda"
"July 1212": "juillet 1212"
"The town was stormed after the battle, and many of its people were killed or enslaved.": "La ville fut envahie après la bataille, et beaucoup de ses habitants furent tués ou réduits en esclavage."
"Abu Yusuf Yaqub, 1195": "Abu Yusuf Yaqub, 1195"
"Alfonso VIII, 1212": "Alfonso VIII, 1212"
"Al-Nasir, 1212": "Al-Nasir, 1212"
"Mallorca and Valencia": "Majorque et Valence"
"1229–1245": "1229–1245"
"James I of Aragon, who had come to the throne as a child in 1213, turned to the sea. The merchants of Barcelona wanted an end to raids from the Muslim taifa of Mallorca, and in September 1229 a fleet of about 150 ships sailed from Salou, Cambrils and Tarragona. The army landed at Santa Ponsa, won a battle at Portopí and on 31 December stormed Madina Mayurqa, today’s Palma, with great slaughter. Resistance in the mountains lasted until 1232; Menorca submitted as a tributary in 1231, and Ibiza was taken in 1235.": "Jacques Ier d’Aragon, qui était venu sur le trône comme un enfant en 1213, se tourna vers la mer. Les marchands de Barcelone voulaient la fin des raids de la taifa musulmane de Majorque, et en septembre 1229 une flotte d’environ 150 navires naviguait de Salou, Cambrils et Tarragone. L’armée débarque à Santa Ponsa, gagne une bataille à Portopí et le 31 décembre prend Madina Mayurqa, aujourd'hui Palma, avec un grand massacre. La résistance dans les montagnes dura jusqu’en 1232 ; Menorca soumis comme affluent en 1231, et Ibiza a été prise en 1235."
"James then took the Muslim lands of Valencia piece by piece. Morella and Burriana fell in 1232–1233, and in 1237 his garrison on the Puig, a hill north of the city, held off a counter-attack. Valencia, besieged from April 1238, surrendered on 28 September, and its ruler, Zayyan ibn Mardanish, and many of its people left. The conquest went on south towards Xàtiva and Biar, and in 1244 the Treaty of Almizra fixed the line between Aragon’s conquests and Castile’s. Valencia became a separate kingdom of the Crown of Aragon, where a Muslim majority lived on under Christian rule.": "Jacques prit ensuite les terres musulmanes de Valence pièce par morceau. Morella et Burriana tombaient en 1232-1233, et en 1237 sa garnison sur le Puig, une colline au nord de la ville, retenait une contre-attaque. Valencia, assiégée à partir d’avril 1238, se rendit le 28 septembre, et son chef, Zayyan ibn Mardanish, et beaucoup de son peuple partie. La conquête partit vers le sud vers Xàtiva et Biar, et en 1244 le traité d’Almizra fixa la ligne entre les conquêtes d’Aragon et de Castille. Valence devint un royaume séparé de la Couronne d’Aragon, où une majorité musulmane vivait sous domination chrétienne."
"Madina Mayurqa stormed": "Madina Mayurqa a pris la fuite"
"31 December 1229": "31 décembre 1229"
"Valencia surrenders": "La capitulation de Valence"
"28 September 1238": "28 septembre 1238"
"Treaty of Almizra": "Traité d’Almizra"
"26 March 1244": "26 mars 1244"
"Santa Ponsa": "Père Noël Ponsa"
"10 September 1229": "10 septembre 1229"
"The Catalan and Aragonese army landed in the bay south-west of the city.": "L’armée catalane et aragonaise débarque dans la baie au sud-ouest de la ville."
"Palma (Madina Mayurqa)": "Palma (Madina Mayurqa)"
"After a siege of three months the city was stormed. Many of its people were killed, and its ruler, Abu Yahya, was captured.": "Après un siège de trois mois, la ville fut prise d’assaut. Beaucoup de ses habitants furent tués, et son chef, Abou Yahya, fut capturé."
"Burriana": "Burriana"
"July 1233": "juillet 1233"
"James took the coastal town after a two-month siege, opening the road south along the coast.": "James prit la ville côtière après un siège de deux mois, ouvrant la route au sud le long de la côte."
"Battle of the Puig": "Bataille du Puig"
"August 1237": "août 1237"
"The garrison that James had left in the fort on the hill beat an army sent from Valencia to drive it out.": "La garnison que James avait laissée dans le fort sur la colline a battu une armée envoyée de Valence pour la chasser."
"Zayyan surrendered the city after a five-month siege. James entered on 9 October, a date still celebrated as the day of the Valencian Community.": "Zayyan a cédé la ville après un siège de cinq mois. James est entré le 9 octobre, une date encore célébrée comme le jour de la communauté valencienne."
"Almizra": "Almizra"
"James I and the Castilian heir, the future Alfonso X, agreed the line south of which the conquests, Murcia among them, would go to Castile.": "James Ier et l’héritier castillan, le futur Alfonso X, ont convenu de la ligne au sud de laquelle les conquêtes, Murcie parmi eux, iraient à Castille."
"James I, 1229": "James I, 1229"
"James I, 1233–38": "Jacques Ier, 1233–1838"
"Córdoba and Seville": "Córdoba et Séville"
"1224–1262": "1224–1262"
"After Las Navas the Almohad empire broke up. From 1224 rival caliphs fought each other, and in al-Andalus Ibn Hud of Murcia rose against them. Ferdinand III, king of Castile and from 1230 also of León, uniting the two kingdoms for good, made the most of the chaos. In January 1236 frontier fighters seized a suburb of Córdoba by surprise, Ferdinand hurried south, and the old caliphal capital surrendered on 29 June. Its great mosque became a cathedral. Murcia accepted Castilian overlordship in 1243, and in 1246 Muhammad ibn al-Ahmar, founder of the Nasrid emirate of Granada, gave up Jaén and became Ferdinand’s vassal.": "Après la rupture de l’empire Almohade Las Navas. A partir de 1224 les califes rivales se combattaient, et à al-Andalus Ibn Hud de Murcie se levèrent contre eux. Ferdinand III, roi de Castille et à partir de 1230 aussi de León, unissant les deux royaumes pour le bien, tira le meilleur parti du chaos. En janvier 1236, des combattants de la frontière s’emparèrent d’une banlieue de Cordoue par surprise, Ferdinand se précipita vers le sud et l’ancienne capitale califale se rendit le 29 juin. Sa grande mosquée devint cathédrale. Murcie accepta l’hommage de Castille en 1243, et en 1246 Muhammad ibn al-Ahmar, fondateur de l’émirat nasride de Grenade, abandonna Jaén et devint Ferdinand."
"Seville, the Almohads’ Iberian capital, was besieged from the summer of 1247, with Nasrid troops in the Castilian camp. On 3 May 1248 a fleet from the ports of the Cantabrian coast under Ramón Bonifaz broke the bridge of boats that linked the city with Triana across the Guadalquivir, and Seville surrendered on 23 November. Most of its Muslims left. In 1249 Afonso III of Portugal took Faro and the last towns of the Algarve, completing Portugal’s conquests, and Ferdinand’s son Alfonso X took Niebla and Cádiz in 1262. Only Granada remained independent.": "Séville, la capitale ibérique des Almohads, a été assiégée de l’été 1247, avec les troupes nasrides dans le camp castillien. Le 3 mai 1248 une flotte des ports de la côte cantabrienne sous Ramón Bonifaz a cassé le pont de bateaux qui relie la ville avec Triana à travers le Guadalquivir, et Séville s’est rendu le 23 novembre. La plupart de ses musulmans sont partis. En 1249, Afonso III du Portugal a pris Faro et les dernières villes de l’Algarve, complétant les conquêtes du Portugal, et Ferdinand le fils Alfonso X a pris Niebla et Cádiz en 1262."
"Córdoba surrenders": "Córdoba se rend"
"29 June 1236": "29 juin 1236"
"Seville surrenders": "Seville capitule"
"23 November 1248": "23 novembre 1248"
"Faro taken": "Faro pris"
"1249, by Portugal": "1249, par le Portugal"
"Córdoba": "Córdoba"
"The city surrendered after a siege of five months, and its people were allowed to leave. Ferdinand III had the great mosque consecrated as a cathedral.": "La ville s’est rendue après un siège de cinq mois, et son peuple a été autorisé à partir. Ferdinand III avait la grande mosquée consacrée comme une cathédrale."
"Granada": "Grenade"
"Ibn al-Ahmar made Granada his capital and began building the Alhambra.": "Ibn al-Ahmar fit de Grenade sa capitale et commença à construire l’Alhambra."
"Jaén": "Jaén"
"Ibn al-Ahmar surrendered Jaén after a long siege and agreed to pay tribute and to serve Castile in war.": "Ibn al-Ahmar rendit Jaén après un long siège et accepta de rendre hommage et de servir la Castille en guerre."
"Bridge of Triana": "Pont de Triana"
"3 May 1248": "3 mai 1248"
"Driven by the wind and the tide, Bonifaz’s largest ships rammed and broke the chained bridge of boats, cutting Seville off from the land to the west.": "Conduits par le vent et la marée, les plus grands navires de Bonifaz ont décollé et brisé le pont enchaîné des bateaux, coupant Séville de la terre à l’ouest."
"After a siege of sixteen months the city surrendered. Ferdinand entered on 22 December, and he was buried in its cathedral in 1252.": "Après un siège de seize mois la ville s’est rendue. Ferdinand est entré le 22 décembre, et il a été enterré dans sa cathédrale en 1252."
"Faro": "Faro"
"Afonso III took the town, the last Muslim stronghold of the Algarve.": "Afonso III a pris la ville, la dernière forteresse musulmane de l’Algarve."
"Ferdinand III": "Ferdinand III"
"Ramón Bonifaz": "Ramón Bonifaz"
"Afonso III": "Afonso III"
"The battle of the Strait": "La bataille du détroit"
"1275–1350": "1275–1350"
"The last great struggle was for the Strait of Gibraltar. Granada’s emirs, squeezed by Castile, called on the Marinids, who had replaced the Almohads in Morocco, and from 1275 Marinid armies crossed to Algeciras and Tarifa to raid Andalusia. Castile fought for the ports. Sancho IV took Tarifa in 1292, and in 1294 its commander, Alonso Pérez de Guzmán, held it against a Marinid siege, refusing, by a famous tradition, to surrender it even to save his captive son. Ferdinand IV took Gibraltar in 1309, but the Marinids won it back in 1333.": "La dernière grande lutte fut pour le détroit de Gibraltar. Granadas émirs, pressé par la Castille, appela les Marinides, qui avaient remplacé les Almohades au Maroc, et de 1275 armées Marinides traversèrent à Algeciras et Tarifa pour attaquer l’Andalousie. Sancho IV prit Tarifa en 1292, et en 1294 son commandant, Alonso Pérez de Guzmán, le tenait contre un siège Marinid, refusant, par une célèbre tradition, de la remettre même pour sauver son fils captif. Ferdinand IV prit Gibraltar en 1309, mais les Marinides le remportèrent en 1333."
"In 1340 the Marinid sultan Abu al-Hasan destroyed the Castilian fleet off Algeciras, crossed with a large army and, with Yusuf I of Granada, besieged Tarifa. Alfonso XI of Castile and Afonso IV of Portugal marched to its relief, and on 30 October they routed the two Muslim rulers on the Río Salado. It was the last great invasion from North Africa. Alfonso then besieged Algeciras from 1342; crusaders from many lands joined him, the defenders used early gunpowder weapons, and the city surrendered in March 1344. In March 1350 Alfonso died of the Black Death while besieging Gibraltar.": "En 1340, le sultan Marinid Abu al-Hasan détruisit la flotte castillane au large d’Algeciras, traversa avec une grande armée et, avec Yusuf I de Grenade, assiégea Tarifa. Alfonso XI de Castille et Afonso IV du Portugal marchèrent à son secours, et le 30 octobre ils acheminèrent les deux dirigeants musulmans sur le Río Salado. C’était la dernière grande invasion d’Afrique du Nord. Alfonso assiégea Algeciras de 1342 ; des croisés venus de nombreux pays le rejoignirent, les défenseurs utilisaient des armes à poudre et la ville se rendit en mars 1344. En mars 1350 Alfonso mourut de la mort noire tout en assiégé Gibraltar."
"Tarifa taken": "Tarif pris"
"13 October 1292": "13 octobre 1292"
"Battle of Río Salado": "Bataille de Río Salado"
"30 October 1340, Castilian and Portuguese victory": "30 octobre 1340, victoire castillane et portugaise"
"Algeciras surrenders": "Algeciras se rend"
"26 March 1344": "26 mars 1344"
"Tarifa": "Tarifa"
"Guzmán “el Bueno” held the town against the Marinids and their ally, the Castilian prince John, who had his son in his power. The boy was killed.": "Guzmán, qui avait son fils au pouvoir, a tenu la ville contre les Marinidés et leur allié, le prince castillan Jean."
"30 October 1340": "30 octobre 1340"
"Alfonso XI attacked across the river while the Tarifa garrison sallied out, and the Portuguese beat the Granadans. The sultan’s camp was overrun.": "Alfonso XI attaqua le fleuve pendant que la garnison de Tarifa s’enfuit, et les Portugais battèrent les Granadas. Le camp de sultan fut envahi."
"After a siege of twenty months the garrison and people left under a truce. Granada retook the town in 1369 and later razed it.": "Après un siège de vingt mois, la garnison et le peuple sont partis sous une trêve. Grenade a repris la ville en 1369 et l’a rasée plus tard."
"Gibraltar": "Gibraltar"
"1309 and 1333": "1309 et 1333"
"Castile took Gibraltar in 1309 and lost it to the Marinids in 1333. Alfonso XI died of plague in his camp before the rock in March 1350.": "La Castille a pris Gibraltar en 1309 et l’a perdu à cause des Marinidés en 1333. Alfonso XI est mort de peste dans son camp avant la roche en mars 1350."
"Abu al-Hasan": "Abu al-Hasan"
"Alfonso XI and Afonso IV": "Alfonso XI et Afonso IV"
"Antequera and Gibraltar": "Antequera et Gibraltar"
"1350–1462": "1350–1462"
"For a century after Alfonso XI’s death Castile was taken up with civil wars, the war with England and quarrels with Portugal and Aragon. The frontier with Granada saw truces broken by raids and the occasional campaign, and Granada paid tribute when it had to and flourished; the Alhambra’s great courts were built under Yusuf I and Muhammad V. In 1410 Ferdinand, regent for his infant nephew John II of Castile, besieged Antequera, beat a relief army and took the town in September. Two years later, as Ferdinand of Antequera, he was chosen king of Aragon.": "Pendant un siècle après la mort d’Alfonso XI, la Castille fut envahie par les guerres civiles, la guerre avec l’Angleterre et les querelles avec le Portugal et l’Aragon. La frontière avec Grenade vit des trêves brisées par les raids et la campagne occasionnelle, et Grenade rendit hommage quand elle dut et prospéra ; les grandes cours de l’Alhambra furent construites sous Yusuf I et Muhammad V. En 1410, Ferdinand, régent pour son neveu enfant Jean II de Castille, assiégea Antequera, battit une armée de secours et prit la ville en septembre. Deux ans plus tard, comme Ferdinand d’Antequera, il fut élu roi d’Aragon."
"In 1431 John II’s favourite, Álvaro de Luna, led a great army to the walls of Granada and won the battle of La Higueruela on 1 July, but Castile used the victory only to stir up Granada’s dynastic quarrels. Frontier lords did more. In August 1462 a surprise attack by the governor of Tarifa, reinforced by the Duke of Medina Sidonia and the Count of Arcos, won Gibraltar, held by Muslims since 1333, and Archidona fell the same year. Granada, weakened by feuds within the Nasrid family, was left with the mountains and coast between Ronda and Almería. The Granada War of 1482–1492 would finish it.": "En 1431 le favori de Jean II, Álvaro de Luna, a mené une grande armée aux murs de Grenade et remporté la bataille de La Higueruela le 1er juillet, mais Castille n’a utilisé la victoire que pour émouvoir les querelles dynastiques de Grenade. En août 1462, une attaque surprise du gouverneur de Tarifa, renforcée par le duc de Medina Sidonia et le comte d’Arcos, remporte Gibraltar, tenu par les musulmans depuis 1333, et Archidona tombe la même année. Grenade, affaiblie par les querelles au sein de la famille Nasride, est laissée avec les montagnes et la côte entre Ronda et Almería. La guerre de Grenade de 1482–1492 allait la terminer."
"Antequera taken": "Antequera pris"
"September 1410": "septembre 1410"
"Battle of La Higueruela": "Bataille de La Higueruela"
"1 July 1431, Castilian victory": "1er juillet 1431, victoire castillane"
"Gibraltar taken": "Gibraltar prise"
"August 1462": "août 1462"
"Antequera": "Antequera"
"Ferdinand’s army besieged the town for five months, with siege towers and early cannon, until the garrison surrendered and left for Granada.": "L’armée de Ferdinand a assiégé la ville pendant cinq mois, avec des tours de siège et des canons précoces, jusqu’à ce que la garnison se rende et parte pour Grenade."
"Archidona": "Archidona"
"The hilltop town north-east of Antequera fell to the Master of the Order of Calatrava.": "La ville au sommet de la colline au nord-est d’Antequera tomba au maître de l’ordre de Calatrava."
"1 July 1431": "1er juillet 1431"
"Fought by the Sierra Elvira, in sight of Granada. The battle is painted on the walls of the Hall of Battles in the Escorial.": "Frappé par la Sierra Elvira, en vue de Grenade. La bataille est peinte sur les murs de la salle des batailles dans l’Escorial."
"Much of the garrison was away, and the rest surrendered after a few days of talks. By tradition the town fell on the feast of Saint Bernard, 20 August, and he became its patron saint.": "Une grande partie de la garnison était absente, et les autres se rendirent après quelques jours de pourparlers. Par tradition, la ville tomba le jour de la fête de saint Bernard, 20 août, et il devint son saint patron."
"Ferdinand of Antequera": "Ferdinand d’Antequera"
