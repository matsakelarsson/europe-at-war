"1031–1085": "1031–1085"
"Almanzor’s sons could not hold his regime together, and from 1009 al-Andalus fell into a civil war, the fitna, in which Berber, Slav and Andalusi factions made and unmade caliphs, and Christian troops fought on both sides. In 1031 the caliphate was abolished. Its lands split into more than twenty taifas, kingdoms ruled from cities such as Zaragoza, Toledo, Badajoz, Seville and Granada, rich in trade and learning but weak, and often at war with each other.": "A partir de 1009 al-Andalus tomba dans une guerre civile, la fitna, dans laquelle les factions berbères, slaves et andalouses firent des califes immuables, et les troupes chrétiennes combattirent des deux côtés. En 1031 le califat fut aboli. Ses terres se divisent en plus de vingt taifas, des royaumes régnèrent de villes telles que Saragosse, Tolède, Badajoz, Séville et Grenade, riches en commerce et en apprentissage mais faibles, et souvent en guerre les uns avec les autres."
"The Christian kings now took tribute instead of paying it. Ferdinand I, count of Castile and from 1037 king of León, made the taifa rulers pay parias, protection money in gold, and took Coimbra in 1064. That year knights from France, Normandy and Catalonia, encouraged by the pope, took Barbastro, though Zaragoza won it back in 1065. His son Alfonso VI installed a client, al-Qadir, in Toledo, and when al-Qadir’s subjects turned against him Alfonso besieged the city. The old Visigothic capital surrendered in May 1085; its Muslims were promised their property and their great mosque, which was nevertheless made a cathedral the next year.": "Ferdinand Ier, comte de Castille et à partir de 1037 roi de León, fit payer les chefs de la taifa parias, argent de protection en or, et prit Coimbra en 1064. Cette année-là, des chevaliers de France, de Normandie et de Catalogne, encouragés par le pape, prirent Barbastro, bien que Saragosse l’ait gagnée en 1065. Son fils Alfonso VI a installé un client, al-Qadir, à Tolède, et quand les sujets d’al-Qadir ont tourné contre lui Alfonso assiégé la ville. L’ancienne capitale visigothique s’est rendue en mai 1085 ; ses musulmans ont été promis leurs biens et leur grande mosquée, qui a néanmoins été fait une cathédrale l’année suivante."
