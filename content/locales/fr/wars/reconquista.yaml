"Abd al-Rahman III, emir from 912, spent his first years crushing rebels, above all the sons of Umar ibn Hafsun in their mountain fortress of Bobastro, which fell in 928. In January 929 he took the title of caliph, setting himself up against the Abbasids of Baghdad and the Fatimids of North Africa. His summer campaigns beat León and Pamplona at Valdejunquera in 920 and sacked Pamplona in 924, and from 936 he built a palace city, Madinat al-Zahra, outside Córdoba.": "Abd al-Rahman III, émir de 912, passa ses premières années à écraser les rebelles, surtout les fils d’Umar ibn Hafsun dans leur forteresse de montagne de Bobastro, qui tomba en 928. En janvier 929 il prit le titre de calife, se mettant contre les Abbasides de Bagdad et les Fatimidés d’Afrique du Nord. Ses campagnes d’été ont battu León et Pampelune à Valdejunquera en 920 et a renvoyé Pampelune en 924 et à partir de 936 il a construit une ville de palais, Madinat al-Zahra, en dehors de Cordoue."
"In 939 he led a great expedition against León. Near Simancas, on the Duero, Ramiro II of León, with Count Fernán González of Castile and troops from Pamplona, met him in a battle that began on 19 July, the day of a solar eclipse, and lasted several days. The caliph’s army was beaten and then routed on its retreat at a place the Arab sources call al-Khandaq, “the ditch”. Abd al-Rahman barely escaped and never again campaigned in person. León settled the lands south of the Duero, and Fernán González made Castile a hereditary county that went its own way.": "En 939, il mena une grande expédition contre León. Près de Simancas, sur le Duero, Ramiro II de León, avec le comte Fernán González de Castille et les troupes de Pampelune, le rencontra dans une bataille qui commença le 19 juillet, jour d’une éclipse solaire, et dura plusieurs jours. L’armée du calife a été battue puis rouée sur sa retraite dans un endroit où les sources arabes appellent al-Khandaq, le fossé. Abd al-Rahman s’est à peine échappé et n’a plus jamais fait campagne en personne. León a établi les terres au sud du Duero, et Fernán González a fait de Castille un comté héréditaire qui allait à sa manière."
