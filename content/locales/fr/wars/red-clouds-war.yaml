# French translations of the catalogue text (wave 14); step bodies follow later.
Red Cloud’s War: Guerre de Red Cloud
? "The war of 1866–1868 between the Lakota, Northern Cheyenne and Northern Arapaho and the United States over the Bozeman Trail, the road from the Oregon Trail to the Montana gold fields through the Powder River country east of the Bighorn Mountains. The Treaty of Fort Laramie of 1851 had recognised that country as Crow land, but by 1860 the Lakota and their allies had taken it from the Crow as their best remaining buffalo range. When the army began building forts along the trail in June 1866, during peace talks at Fort Laramie, the Oglala leader Red Cloud (Mahpiya Luta) and others left the council and made war. Lakota, Cheyenne and Arapaho warriors harassed the forts, their wood trains and travellers for two years, and on 21 December 1866 a decoy party that included the young Crazy Horse drew Captain William Fetterman and 80 men into an ambush near Fort Phil Kearny, where all were killed. Soldiers with new breech-loading rifles held off attacks at the Hayfield and Wagon Box fights in August 1867, but the trail stayed closed. With the Union Pacific Railroad offering another way west, the government gave in: by the Treaty of Fort Laramie of 1868 it abandoned the forts, which the Lakota and Cheyenne burned, closed the Powder River country to whites as unceded Indian territory and created the Great Sioux Reservation, including the Black Hills. Red Cloud signed on 6 November 1868. It is often called one of the few wars the United States lost to a Native nation; the treaty’s breach over the Black Hills led to the Great Sioux War of 1876."
: "La guerre de 1866–1868 qui opposa les Lakotas, les Cheyennes du Nord et les Arapahos du Nord aux États-Unis au sujet de la piste Bozeman, la route qui menait de la piste de l’Oregon aux champs aurifères du Montana à travers la région de la Powder River, à l’est des monts Bighorn. Le traité de Fort Laramie de 1851 avait reconnu cette région comme terre crow, mais dès 1860 les Lakotas et leurs alliés l’avaient prise aux Crows, car c’était le meilleur territoire de chasse au bison qui leur restait. Lorsque l’armée commença à construire des forts le long de la piste en juin 1866, en pleins pourparlers de paix à Fort Laramie, le chef oglala Red Cloud (Mahpiya Luta) et d’autres quittèrent le conseil et entrèrent en guerre. Pendant deux ans, des guerriers lakotas, cheyennes et arapahos harcelèrent les forts, leurs convois de bois et les voyageurs et, le 21 décembre 1866, un groupe de leurres dont faisait partie le jeune Crazy Horse attira le capitaine William Fetterman et 80 hommes dans une embuscade près de Fort Phil Kearny, où tous furent tués. Des soldats armés de nouveaux fusils à chargement par la culasse repoussèrent des attaques lors des combats du Hayfield et du Wagon Box en août 1867, mais la piste resta fermée. Le chemin de fer Union Pacific offrant une autre voie vers l’ouest, le gouvernement céda : par le traité de Fort Laramie de 1868, il abandonna les forts, que les Lakotas et les Cheyennes incendièrent, ferma la région de la Powder River aux Blancs en tant que territoire indien non cédé et créa la Grande Réserve sioux, y compris les Black Hills. Red Cloud signa le 6 novembre 1868. On la décrit souvent comme l’une des rares guerres que les États-Unis aient perdues face à une nation amérindienne ; la violation du traité à propos des Black Hills conduisit à la Grande Guerre sioux de 1876."
