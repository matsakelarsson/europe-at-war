# French translations of the catalogue text (wave 14); step bodies follow later.
Red River Rebellion: Rébellion de la rivière Rouge
? The resistance of the Métis of the Red River Settlement, in what is now Manitoba, to the transfer of Rupert’s Land from the Hudson’s Bay Company to Canada in 1869–1870, also called the Red River Resistance. The Canadian government agreed to buy the company’s territory without consulting its people, of whom some 10,000 of about 12,000 at Red River were Métis, and sent surveyors and a lieutenant governor, William McDougall, before the transfer took effect. In October 1869 the Métis, led by Louis Riel, stopped the survey, formed a National Committee, turned McDougall back at the border and seized Upper Fort Garry. In December they declared a provisional government, which a convention of French- and English-speaking delegates endorsed in February 1870. The government imprisoned members of the pro-Canadian party and on 4 March 1870 executed one of them, Thomas Scott, which caused fury in Ontario. Delegates sent to Ottawa negotiated the Manitoba Act, by which Manitoba joined Canada as a province on 15 July 1870 with guarantees for land, the French language and Catholic schools. A military expedition under Colonel Garnet Wolseley reached Fort Garry on 24 August 1870; Riel had fled to the United States, and he was never granted the amnesty the delegates believed they had been promised.
: La résistance des Métis de la colonie de la rivière Rouge, dans l’actuel Manitoba, au transfert de la Terre de Rupert de la Compagnie de la Baie d’Hudson au Canada en 1869–1870, appelée aussi résistance de la rivière Rouge. Le gouvernement canadien accepta d’acheter le territoire de la compagnie sans consulter ses habitants, dont quelque 10 000 sur environ 12 000 à la rivière Rouge étaient des Métis, et envoya des arpenteurs et un lieutenant-gouverneur, William McDougall, avant que le transfert ne prenne effet. En octobre 1869, les Métis, menés par Louis Riel, arrêtèrent l’arpentage, formèrent un Comité national, refoulèrent McDougall à la frontière et s’emparèrent d’Upper Fort Garry. En décembre, ils proclamèrent un gouvernement provisoire, qu’une convention de délégués francophones et anglophones approuva en février 1870. Ce gouvernement emprisonna des membres du parti procanadien et, le 4 mars 1870, fit exécuter l’un d’eux, Thomas Scott, ce qui souleva la fureur de l’Ontario. Des délégués envoyés à Ottawa négocièrent la Loi sur le Manitoba, par laquelle le Manitoba devint une province canadienne le 15 juillet 1870, avec des garanties pour les terres, la langue française et les écoles catholiques. Une expédition militaire commandée par le colonel Garnet Wolseley atteignit Fort Garry le 24 août 1870 ; Riel s’était enfui aux États-Unis, et il n’obtint jamais l’amnistie dont les délégués croyaient avoir reçu la promesse.
