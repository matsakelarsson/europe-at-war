# French translations of the catalogue text (wave 14); step bodies follow later.
Red River War: Guerre de la Red River
? "The United States Army’s campaign of 1874–1875 that forced the last free bands of the Comanche, Kiowa, Southern Cheyenne and Arapaho onto reservations in Indian Territory, ending the wars of the southern plains. The Medicine Lodge treaties of 1867 had assigned the four nations reservations in Indian Territory with rations and hunting rights south of the Arkansas, but the rations fell short and from 1873 commercial hunters slaughtered the last great buffalo herds of the southern plains for their hides. Inspired by the Comanche prophet Isatai, several hundred Comanche, Cheyenne and Kiowa warriors (estimates range from about 250 to 700) led by Quanah Parker attacked the hunters’ post at Adobe Walls in the Texas Panhandle on 27 June 1874 and were driven off by the hunters’ long-range rifles; raids across Texas, Kansas and Colorado followed. Generals Sherman and Sheridan sent five columns from Kansas, Indian Territory, Texas and New Mexico to converge on the headwaters of the Red River and keep the bands moving without rest. Most fights were small, but the army destroyed what the bands could not carry: on 28 September Colonel Ranald Mackenzie’s 4th Cavalry surprised Comanche, Kiowa and Cheyenne camps in Palo Duro Canyon, burned their lodges and winter food and killed most of some 1,400 captured horses. Hungry and on foot, band after band surrendered through the winter and spring, the last, Quanah’s Quahadi Comanche, at Fort Sill on 2 June 1875. About seventy men and women chosen as leaders or wrongdoers were sent without trial to prison at Fort Marion in Florida."
: "La campagne de 1874–1875 de l’armée des États-Unis qui contraignit les dernières bandes libres des Comanches, des Kiowas, des Cheyennes du Sud et des Arapahos à entrer dans les réserves du territoire indien, mettant fin aux guerres des plaines du Sud. Les traités de Medicine Lodge de 1867 avaient attribué aux quatre nations des réserves dans le territoire indien, avec des rations et des droits de chasse au sud de l’Arkansas, mais les rations étaient insuffisantes et, à partir de 1873, des chasseurs professionnels abattirent en masse, pour leurs peaux, les derniers grands troupeaux de bisons des plaines du Sud. Inspirés par le prophète comanche Isatai, plusieurs centaines de guerriers comanches, cheyennes et kiowas (les estimations vont d’environ 250 à 700), menés par Quanah Parker, attaquèrent le 27 juin 1874 le poste des chasseurs d’Adobe Walls, dans le Panhandle du Texas, et furent repoussés par les fusils à longue portée des chasseurs ; des raids au Texas, au Kansas et au Colorado suivirent. Les généraux Sherman et Sheridan envoyèrent depuis le Kansas, le territoire indien, le Texas et le Nouveau-Mexique cinq colonnes chargées de converger vers les sources de la Red River et de maintenir les bandes en mouvement sans leur laisser de répit. La plupart des combats furent de faible ampleur, mais l’armée détruisit ce que les bandes ne pouvaient emporter : le 28 septembre, le 4e de cavalerie du colonel Ranald Mackenzie surprit des campements comanches, kiowas et cheyennes dans le canyon de Palo Duro, brûla leurs tipis et leurs vivres d’hiver et abattit la plupart des quelque 1 400 chevaux capturés. Affamées et à pied, les bandes se rendirent l’une après l’autre au cours de l’hiver et du printemps, la dernière, celle des Comanches Quahadis de Quanah, à Fort Sill le 2 juin 1875. Environ soixante-dix hommes et femmes désignés comme meneurs ou comme coupables furent envoyés sans procès en prison à Fort Marion, en Floride."
