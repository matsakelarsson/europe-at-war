# French translations of the catalogue text (wave 10); step bodies follow later.
Red Turban invasions of Goryeo: Invasions du Goryeo par les Turbans rouges
? Two invasions of Goryeo by a northern army of the Red Turbans, the rebel movement that rose against the Yuan dynasty in China in 1351. After failing to take the Yuan capital Dadu in 1358, Red Turban forces under Guan Xiansheng and others burned the summer capital Shangdu and moved into Liaodong; pressed by the Yuan, they turned on Goryeo. In the twelfth month of 1359 Mao Jujing crossed the frozen Yalu with 40,000 men and took the Western Capital, Pyongyang, but Goryeo retook it within weeks and drove the invaders out early in 1360. In the tenth month of 1361 a much larger army, said to number over 100,000, under Pan Cheng, Sha Liu, Guan Xiansheng and others swept south. King Gongmin fled to Bokju (Andong), and the Red Turbans held Kaegyong for about two months, burning the palace. In the first month of 1362 a Goryeo army of about 200,000 under Jeong Se-un stormed the city, killing Sha Liu and Guan Xiansheng, and the survivors fled across the Yalu. The war left the north devastated, and generals such as Choe Yeong and Yi Seong-gye rose to prominence.
: Deux invasions du Goryeo par une armée des Turbans rouges du Nord, le mouvement rebelle qui s’était soulevé contre la dynastie Yuan en Chine en 1351. Après avoir échoué à prendre la capitale des Yuan, Dadu, en 1358, des forces des Turbans rouges commandées notamment par Guan Xiansheng incendièrent la capitale d’été, Shangdu, et passèrent dans le Liaodong ; pressées par les Yuan, elles se tournèrent contre le Goryeo. Au douzième mois de 1359, Mao Jujing franchit le Yalu gelé avec 40 000 hommes et prit la capitale de l’Ouest, Pyongyang, mais le Goryeo la reprit en quelques semaines et chassa les envahisseurs au début de 1360. Au dixième mois de 1361, une armée bien plus nombreuse, forte, disait-on, de plus de 100 000 hommes, sous les ordres de Pan Cheng, Sha Liu, Guan Xiansheng et d’autres, déferla vers le sud. Le roi Gongmin s’enfuit à Bokju (Andong), et les Turbans rouges tinrent Kaegyong pendant environ deux mois, incendiant le palais. Au premier mois de 1362, une armée du Goryeo d’environ 200 000 hommes commandée par Jeong Se-un prit la ville d’assaut, tuant Sha Liu et Guan Xiansheng, et les survivants s’enfuirent de l’autre côté du Yalu. La guerre laissa le nord dévasté, et des généraux comme Choe Yeong et Yi Seong-gye s’imposèrent au premier plan.
