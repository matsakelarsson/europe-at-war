# French translations of the catalogue text (wave 9); step bodies follow later.
Red Turban rebellion in Guangdong: Rébellion des Turbans rouges au Guangdong
? A rising of the Heaven and Earth Society (Tiandihui) lodges of Guangdong, whose fighters wore red headbands, inspired by the Taiping capture of Nanjing. Hard times, heavy taxes for the war against the Taiping and floods drove the lodges to revolt in the summer of 1854. He Liu took Dongguan, Chen Kai took Foshan on 4 July 1854, and Li Wenmao and others joined him; by the autumn Red Turban armies held much of the Pearl River delta and besieged Guangzhou. The provincial capital held out, defended by militia raised by the gentry and with the British navy guarding the river. In 1855 the governor-general Ye Mingchen drove the rebels out of the delta and carried out mass executions at the Guangzhou execution ground; estimates of those put to death in the province range from more than 100,000, the figure Ye himself gave, to as many as a million. Many Red Turbans marched north to join the Taiping, while Chen Kai and Li Wenmao went west into Guangxi, took Xunzhou (Guiping) in 1855 and founded the Dacheng kingdom there, which held out until 1861.
: Un soulèvement des loges de la Société du Ciel et de la Terre (Tiandihui) du Guangdong, dont les combattants portaient des bandeaux rouges, inspiré par la prise de Nankin par les Taiping. Les temps difficiles, les lourds impôts levés pour la guerre contre les Taiping et les inondations poussèrent les loges à la révolte à l’été 1854. He Liu prit Dongguan, Chen Kai prit Foshan le 4 juillet 1854, et Li Wenmao et d’autres se joignirent à lui ; à l’automne, les armées des Turbans rouges tenaient une grande partie du delta de la rivière des Perles et assiégeaient Canton. La capitale provinciale tint bon, défendue par des milices levées par les notables, tandis que la marine britannique gardait le fleuve. En 1855, le gouverneur général Ye Mingchen chassa les rebelles du delta et procéda à des exécutions de masse sur le lieu d’exécution de Canton ; les estimations du nombre de personnes mises à mort dans la province vont de plus de 100 000, le chiffre donné par Ye lui-même, jusqu’à un million. De nombreux Turbans rouges marchèrent vers le nord pour rejoindre les Taiping, tandis que Chen Kai et Li Wenmao partirent vers l’ouest, au Guangxi, prirent Xunzhou (Guiping) en 1855 et y fondèrent le royaume de Dacheng, qui tint jusqu’en 1861.
