# French translations of the catalogue text (wave 9); step bodies follow later.
Red Turban rebellions: Rébellions des Turbans rouges
? "The risings that ended Mongol rule in China. In 1351, as the Yuan government put 170,000 men to work on new dykes for the Yellow River in a decade of floods, famine and epidemics, followers of the White Lotus teaching, who awaited the coming of the Buddha Maitreya, rose in the Huai valley under Liu Futong; in Hubei Xu Shouhui proclaimed the state of Tianwan. The rebels wore red headcloths and became known as the Red Turbans. The chancellor Toghto came close to crushing them, but was dismissed in the middle of the siege of Gaoyou in 1355, and the rebellion spread. In the north the Song state of Han Lin’er and Liu Futong sent armies as far as Shangdu and Liaoyang before Yuan commanders such as Chaghan Temür and Köke Temür drove them back. In the Yangtze valley rival regimes fought each other: Zhu Yuanzhang, a former monk who took Nanjing in 1356, defeated Chen Youliang’s Han at Lake Poyang in 1363 and Zhang Shicheng’s Wu at Suzhou in 1367, proclaimed the Ming dynasty in January 1368 and took the Yuan capital Dadu (Beijing) in September 1368."
: "Les soulèvements qui mirent fin à la domination mongole en Chine. En 1351, alors que le gouvernement Yuan employait 170 000 hommes à construire de nouvelles digues sur le fleuve Jaune, au cours d’une décennie d’inondations, de famines et d’épidémies, les adeptes de l’enseignement du Lotus blanc, qui attendaient la venue du Bouddha Maitreya, se soulevèrent dans la vallée de la Huai sous la conduite de Liu Futong ; au Hubei, Xu Shouhui proclama l’État de Tianwan. Les rebelles portaient des foulards rouges et furent appelés les Turbans rouges. Le chancelier Toghto fut près de les écraser, mais il fut destitué en plein siège de Gaoyou en 1355, et la rébellion s’étendit. Dans le nord, l’État Song de Han Lin’er et de Liu Futong envoya des armées jusqu’à Shangdu et Liaoyang avant que des commandants Yuan comme Chaghan Temür et Köke Temür ne les repoussent. Dans la vallée du Yangtsé, des régimes rivaux s’affrontèrent : Zhu Yuanzhang, un ancien moine qui avait pris Nankin en 1356, vainquit le Han de Chen Youliang sur le lac Poyang en 1363 et le Wu de Zhang Shicheng à Suzhou en 1367, proclama la dynastie Ming en janvier 1368 et prit la capitale des Yuan, Dadu (Pékin), en septembre 1368."
