# French translations of the catalogue text (wave 14); step bodies follow later.
Reform War: Guerre de Réforme
? The civil war of 1857–1861 between Mexico’s Liberals and Conservatives over the Constitution of 1857 and the Liberal laws that ended the special courts of the Church and the army and forced the sale of church and communal lands. In December 1857 General Félix Zuloaga proclaimed the Plan of Tacubaya against the constitution and the Conservatives took Mexico City, while Benito Juárez, as president of the Supreme Court, claimed the presidency and set up a constitutional government, from May 1858 at Veracruz. For three years Mexico had two governments. The Conservative armies of Miguel Miramón, Leonardo Márquez and Tomás Mejía won most of the early battles, but twice failed to take Veracruz, and in 1859 Juárez answered with the Laws of Reform, which nationalised church property and separated church and state. In 1860 the Liberal armies of Jesús González Ortega and Ignacio Zaragoza won at Silao, took Guadalajara and destroyed Miramón’s army at Calpulalpan on 22 December, and Juárez returned to the capital on 11 January 1861. The war left the treasury empty and the Conservatives looking to Europe for a monarch, which led to the French intervention.
: La guerre civile de 1857–1861 entre libéraux et conservateurs mexicains au sujet de la Constitution de 1857 et des lois libérales qui supprimaient les tribunaux spéciaux de l’Église et de l’armée et imposaient la vente des biens de l’Église et des terres communales. En décembre 1857, le général Félix Zuloaga proclama le plan de Tacubaya contre la constitution et les conservateurs prirent Mexico, tandis que Benito Juárez, en tant que président de la Cour suprême, revendiquait la présidence et établissait un gouvernement constitutionnel, installé à partir de mai 1858 à Veracruz. Pendant trois ans, le Mexique eut deux gouvernements. Les armées conservatrices de Miguel Miramón, Leonardo Márquez et Tomás Mejía remportèrent la plupart des premières batailles, mais échouèrent par deux fois à prendre Veracruz, et en 1859 Juárez riposta par les lois de Réforme, qui nationalisaient les biens de l’Église et séparaient l’Église et l’État. En 1860, les armées libérales de Jesús González Ortega et d’Ignacio Zaragoza l’emportèrent à Silao, prirent Guadalajara et anéantirent l’armée de Miramón à Calpulalpan le 22 décembre, et Juárez rentra dans la capitale le 11 janvier 1861. La guerre laissa le trésor vide et poussa les conservateurs à chercher un monarque en Europe, ce qui conduisit à l’intervention française.
