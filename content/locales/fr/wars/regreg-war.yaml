# French translations of the catalogue text (wave 11); step bodies follow later.
Regreg war: Guerre de Regreg
? "A civil war in Majapahit between the western court at Trowulan, ruled by King Wikramawardhana, and the eastern court of Bhre Wirabhumi, the lord of the Blambangan region in the east of Java. Since the 1370s Majapahit had had two courts, both of which sent their own envoys to the Ming: an eastern court had grown up under Wijayarajasa, the husband of Hayam Wuruk’s aunt, and after his death in 1398 passed to Bhre Wirabhumi, Hayam Wuruk’s son by a concubine, who believed he had a better right to the throne than Wikramawardhana, Hayam Wuruk’s nephew and son-in-law. A quarrel over titles in 1400–1402 led to a breach, and Wirabhumi received recognition and a seal from the Ming court. Fighting began in 1404 and went on with halts and reverses, which is what regreg means. In 1406 the western army under Wikramawardhana’s son Bhre Tumapel broke into the eastern court; Wirabhumi fled by boat at night, was overtaken and killed by Raden Gajah, and his head was brought to Trowulan. During the fighting about 170 men of a Ming mission sent by Zheng He’s fleet were killed at the eastern court; the Yongle emperor demanded 60,000 taels of gold in compensation, of which Majapahit paid 10,000 by 1408 before the rest was forgiven. Majapahit was reunited, but the war hastened the loss of its overseas dependencies as Malacca, Palembang and Brunei went their own way."
: "Une guerre civile au sein de Majapahit entre la cour occidentale de Trowulan, où régnait le roi Wikramawardhana, et la cour orientale de Bhre Wirabhumi, seigneur de la région de Blambangan, dans l’est de Java. Depuis les années 1370, Majapahit avait deux cours, qui envoyaient chacune leurs propres ambassadeurs aux Ming : une cour orientale s’était formée sous Wijayarajasa, mari de la tante de Hayam Wuruk, et passa après sa mort en 1398 à Bhre Wirabhumi, fils de Hayam Wuruk et d’une concubine, qui estimait avoir plus de droits au trône que Wikramawardhana, neveu et gendre de Hayam Wuruk. Une querelle de titres en 1400–1402 aboutit à la rupture, et Wirabhumi obtint de la cour des Ming une reconnaissance et un sceau. Les combats commencèrent en 1404 et se poursuivirent avec des pauses et des retournements, ce que signifie regreg. En 1406, l’armée occidentale commandée par Bhre Tumapel, fils de Wikramawardhana, pénétra de force dans la cour orientale ; Wirabhumi s’enfuit de nuit en bateau, fut rattrapé et tué par Raden Gajah, et sa tête fut apportée à Trowulan. Pendant les combats, environ 170 hommes d’une mission Ming envoyée par la flotte de Zheng He furent tués à la cour orientale ; l’empereur Yongle exigea 60 000 taels d’or en dédommagement, dont Majapahit avait payé 10 000 en 1408 avant que le reste ne soit remis. Majapahit fut réunifié, mais la guerre accéléra la perte de ses dépendances d’outre-mer, Malacca, Palembang et Brunei s’émancipant."
