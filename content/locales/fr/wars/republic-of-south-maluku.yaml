# French translations of the catalogue text (wave 11); step bodies follow later.
Republic of South Maluku: République des Moluques du Sud
? The attempt to make the southern Moluccas an independent state, and its suppression by Indonesia. Under the Round Table agreement of 1949 Indonesia became a federation, the Republic of the United States of Indonesia, in which the Moluccas belonged to the State of East Indonesia. In 1950 the federal states were rapidly absorbed into a unitary Republic. In Makassar, the capital of East Indonesia, the former colonial army captain Andi Aziz seized the city on 5 April 1950 to stop the landing of Republican troops; he was arrested when he went to Jakarta to negotiate on 14 April, and fighting between former Dutch colonial (KNIL) soldiers and the Indonesian army went on in Makassar into August. On Ambon, where many Christian Ambonese had served in the KNIL and feared their place in a Javanese-dominated republic, former East Indonesian justice minister Chris Soumokil and other leaders, backed by some 1,700 KNIL soldiers stationed there, proclaimed the Republic of South Maluku (Republik Maluku Selatan, RMS) on 25 April 1950, with J. H. Manuhutu as president. Indonesia blockaded the islands, landed on Buru and Seram in July and on Ambon on 28 September 1950, and took the town of Ambon in November after heavy fighting, in which the Indonesian commander Lieutenant Colonel Slamet Riyadi was killed. The RMS government withdrew to Seram and kept up a guerrilla war in its forests until Soumokil was captured there on 2 December 1963; a few fighters held out longer. Soumokil was sentenced to death by a military court and executed in April 1966. In 1951 the Netherlands shipped some 12,500 Moluccan KNIL soldiers and their families to the Netherlands, intending a temporary stay; a government in exile was formed among them, and in the 1970s young Moluccans seized trains, a school and buildings in the Netherlands in protest at Dutch policy.
: La tentative de faire des Moluques du Sud un État indépendant, et sa répression par l’Indonésie. En vertu de l’accord de la Table ronde de 1949, l’Indonésie devint une fédération, la République des États-Unis d’Indonésie, dans laquelle les Moluques faisaient partie de l’État d’Indonésie orientale. En 1950, les États fédérés furent rapidement absorbés dans une République unitaire. À Makassar, capitale de l’Indonésie orientale, l’ancien capitaine de l’armée coloniale Andi Aziz s’empara de la ville le 5 avril 1950 pour empêcher le débarquement de troupes républicaines ; il fut arrêté le 14 avril, lorsqu’il se rendit à Jakarta pour négocier, et les combats entre anciens soldats coloniaux néerlandais (KNIL) et armée indonésienne se poursuivirent à Makassar jusqu’en août. À Ambon, où de nombreux Ambonais chrétiens avaient servi dans le KNIL et craignaient pour leur place dans une république dominée par les Javanais, l’ancien ministre de la Justice de l’Indonésie orientale Chris Soumokil et d’autres dirigeants, soutenus par quelque 1 700 soldats du KNIL stationnés sur l’île, proclamèrent la République des Moluques du Sud (Republik Maluku Selatan, RMS) le 25 avril 1950, avec J. H. Manuhutu pour président. L’Indonésie imposa un blocus aux îles, débarqua sur Buru et Seram en juillet et sur Ambon le 28 septembre 1950, et prit la ville d’Ambon en novembre après de violents combats, au cours desquels le commandant indonésien, le lieutenant-colonel Slamet Riyadi, fut tué. Le gouvernement de la RMS se replia à Seram et mena une guérilla dans ses forêts jusqu’à la capture de Soumokil, le 2 décembre 1963 ; quelques combattants tinrent plus longtemps. Soumokil fut condamné à mort par un tribunal militaire et exécuté en avril 1966. En 1951, les Pays-Bas transportèrent quelque 12 500 soldats moluquois du KNIL et leurs familles aux Pays-Bas, pour un séjour qu’ils voulaient temporaire ; un gouvernement en exil se forma parmi eux, et dans les années 1970 de jeunes Moluquois s’emparèrent de trains, d’une école et de bâtiments aux Pays-Bas pour protester contre la politique néerlandaise.
