# French translations of the catalogue text (wave 13); step bodies follow later.
Republic of the Congo Civil War (1997–1999): Guerre civile de la République du Congo (1997–1999)
The war in Congo-Brazzaville between the militias of the country’s three main politicians, the elected president Pascal Lissouba (the Cocoyes), the former military ruler Denis Sassou Nguesso (the Cobras) and Brazzaville’s mayor Bernard Kolélas (the Ninjas). It began on 5 June 1997, a few weeks before a presidential election, when government forces surrounded Sassou Nguesso’s residence in Brazzaville, and turned the capital into a battlefield divided between the militias. In October 1997 Angola, which accused Lissouba of helping UNITA, sent troops and aircraft, and Sassou Nguesso took power. Fighting resumed in 1998–1999 in the south, the Pool region and the southern quarters of Brazzaville, where Ninjas and Cocoyes fought the new government, its Angolan allies and Chadian troops; hundreds of thousands of people fled to the forests. Ceasefires signed in November and December 1999 ended the war. Estimates of the dead range from about 14,000 to 25,000.: "La guerre qui opposa, au Congo-Brazzaville, les milices des trois principaux hommes politiques du pays : le président élu Pascal Lissouba (les Cocoyes), l’ancien dirigeant militaire Denis Sassou Nguesso (les Cobras) et le maire de Brazzaville Bernard Kolélas (les Ninjas). Elle commença le 5 juin 1997, quelques semaines avant une élection présidentielle, lorsque les forces gouvernementales encerclèrent la résidence de Sassou Nguesso à Brazzaville, et fit de la capitale un champ de bataille partagé entre les milices. En octobre 1997, l’Angola, qui accusait Lissouba d’aider l’UNITA, envoya des troupes et des avions, et Sassou Nguesso prit le pouvoir. Les combats reprirent en 1998–1999 dans le sud, dans la région du Pool et dans les quartiers sud de Brazzaville, où Ninjas et Cocoyes combattaient le nouveau gouvernement, ses alliés angolais et des troupes tchadiennes ; des centaines de milliers de personnes se réfugièrent dans les forêts. Des cessez-le-feu signés en novembre et en décembre 1999 mirent fin à la guerre. Les estimations du nombre de morts vont d’environ 14 000 à 25 000."
Denis Sassou Nguesso’s Cobras, from October 1997 the government (with Angola and Chad): Cobras de Denis Sassou Nguesso, au pouvoir à partir d’octobre 1997 (avec l’Angola et le Tchad)
