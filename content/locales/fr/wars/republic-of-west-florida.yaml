# French translations of the catalogue text (wave 14); step bodies follow later.
Republic of West Florida: République de Floride occidentale
? A short-lived revolt in the westernmost part of Spanish West Florida, between the Mississippi and the Pearl River, and its annexation by the United States. The district of Baton Rouge had been settled mostly by English-speaking Americans and Britons since the 1780s, many of them planters who held enslaved people, and the United States claimed it as part of the Louisiana Purchase, which Spain denied. After Napoleon’s invasion of Spain in 1808 weakened Spanish rule, the settlers held conventions from June 1810 under the governor, Carlos de Hault de Lassus, while some of them plotted rebellion. Early on 23 September 1810 a force of mounted militia under Philemon Thomas took the Spanish fort of San Carlos at Baton Rouge, killing two Spanish soldiers and capturing de Lassus. On 26 September the convention declared the Republic of West Florida independent; it adopted a constitution, made St. Francisville its capital and elected Fulwar Skipwith governor, under a flag with a white star on a blue field, a design revived in 1861 as the Bonnie Blue Flag. An expedition under Reuben Kemper failed to take Mobile. On 27 October President James Madison proclaimed that the United States would take possession of the region as part of the Territory of Orleans, and American officials and troops under Governor William C. C. Claiborne of the Territory of Orleans and David Holmes of the Mississippi Territory took over St. Francisville on 6 December and Baton Rouge on 10 December 1810; the republic, which had hoped to join the United States on its own terms, gave way after about 74 days. Spain protested, but its remaining West Florida, with Mobile, was occupied by American troops in 1813, and it ceded the Floridas by the Adams–Onís Treaty of 1819. The republic’s territory is today’s Florida Parishes of Louisiana.
: Une révolte éphémère dans la partie la plus occidentale de la Floride occidentale espagnole, entre le Mississippi et la Pearl, et son annexion par les États-Unis. Le district de Baton Rouge avait été peuplé surtout d’Américains et de Britanniques anglophones depuis les années 1780, dont beaucoup étaient des planteurs possédant des esclaves, et les États-Unis le revendiquaient comme partie de l’achat de la Louisiane, ce que l’Espagne contestait. Après que l’invasion de l’Espagne par Napoléon en 1808 eut affaibli la domination espagnole, les colons tinrent à partir de juin 1810 des conventions sous l’autorité du gouverneur, Carlos de Hault de Lassus, tandis que certains d’entre eux préparaient une rébellion. Au petit matin du 23 septembre 1810, une troupe de miliciens à cheval commandée par Philemon Thomas prit le fort espagnol de San Carlos, à Baton Rouge, tuant deux soldats espagnols et capturant de Lassus. Le 26 septembre, la convention proclama l’indépendance de la république de Floride occidentale ; elle adopta une constitution, fit de St. Francisville sa capitale et élut Fulwar Skipwith gouverneur, sous un drapeau orné d’une étoile blanche sur fond bleu, un motif repris en 1861 sous le nom de Bonnie Blue Flag. Une expédition menée par Reuben Kemper ne parvint pas à prendre Mobile. Le 27 octobre, le président James Madison proclama que les États-Unis prendraient possession de la région comme partie du territoire d’Orléans, et des fonctionnaires et des troupes américains, sous les ordres du gouverneur du territoire d’Orléans, William C. C. Claiborne, et de celui du territoire du Mississippi, David Holmes, prirent le contrôle de St. Francisville le 6 décembre et de Baton Rouge le 10 décembre 1810 ; la république, qui avait espéré rejoindre les États-Unis à ses propres conditions, s’effaça au bout d’environ 74 jours. L’Espagne protesta, mais le reste de sa Floride occidentale, avec Mobile, fut occupé par des troupes américaines en 1813, et elle céda les Florides par le traité d’Adams-Onís de 1819. Le territoire de la république correspond aujourd’hui aux Florida Parishes de la Louisiane.
