# French translations of the catalogue text (wave 12); step bodies follow later.
Revolt of Abu Yazid: Révolte d’Abu Yazid
? The great Kharijite rising against the Fatimid caliphs in Ifriqiya, led by Abu Yazid Makhlad ibn Kaydad, an Ibadi schoolmaster of the Nukkari school from the oases of the Djerid, called “the man on the donkey” after the animal he rode. Coming down from the Aurès mountains with the Hawwara Berbers early in 944, his followers took the fortress towns of the west, beat the Fatimid armies and in October 944 entered Kairouan, whose Sunni townspeople at first welcomed them. For eight months in 945 they blockaded the Fatimid capital, al-Mahdiya, and Abu Yazid recognised the Umayyad caliph of Córdoba. But his peasant army melted away, his men’s plunder and abductions turned the cities against him, and the siege of Sousse in 946 failed. The young caliph al-Mansur, who had kept his father’s death secret, broke the rebels outside Kairouan in August 946 and hunted Abu Yazid through the Zab and the Hodna mountains to the fortress of Kiyana, which he stormed on 14 August 947. Abu Yazid died of his wounds five days later; his stuffed skin was paraded through the towns. Militant Kharijism never again threatened the Maghreb, and the Fatimids went on to conquer Egypt.
: Le grand soulèvement kharidjite contre les califes fatimides en Ifriqiya, mené par Abu Yazid Makhlad ibn Kaydad, maître d’école ibadite de l’école nukkarite originaire des oasis du Djérid, surnommé « l’homme à l’âne » d’après l’animal qu’il montait. Descendus des Aurès avec les Berbères Hawwara au début de 944, ses partisans prirent les villes fortifiées de l’ouest, battirent les armées fatimides et, en octobre 944, entrèrent dans Kairouan, dont les habitants sunnites les accueillirent d’abord favorablement. Pendant huit mois, en 945, ils bloquèrent la capitale fatimide, al-Mahdiya, et Abu Yazid reconnut le calife omeyyade de Cordoue. Mais son armée paysanne fondit, les pillages et les enlèvements commis par ses hommes retournèrent les villes contre lui, et le siège de Sousse échoua en 946. Le jeune calife al-Mansur, qui avait tenu secrète la mort de son père, écrasa les rebelles devant Kairouan en août 946 et pourchassa Abu Yazid à travers le Zab et les monts du Hodna jusqu’à la forteresse de Kiyana, qu’il prit d’assaut le 14 août 947. Abu Yazid mourut de ses blessures cinq jours plus tard ; sa peau empaillée fut promenée à travers les villes. Le kharidjisme militant ne menaça plus jamais le Maghreb, et les Fatimides allaient ensuite conquérir l’Égypte.
