# Some French text was translated automatically.
"Revolt of Ali Pasha": "Révolte d’Ali Pacha"
"The war in which Sultan Mahmud II destroyed Ali Pasha of Yanina, the Albanian-born governor who had made Epirus, Albania and much of mainland Greece a virtually independent state. Declared a rebel in 1820, Ali was abandoned by his sons and commanders and besieged in Ioannina by an Ottoman army under Ismail Pashabey and then Hurshid Pasha; he allied briefly with the Souliotes and the Greek rebels, but was killed in January 1822 after leaving his citadel under a promise of safety. The siege tied down Ottoman troops just as the Greek War of Independence broke out.": "La guerre dans laquelle le Sultan Mahmud II a détruit Ali Pacha de Yanina, gouverneur d’origine albanaise qui avait fait d’Epire, d’Albanie et d’une grande partie de la Grèce continentale un État pratiquement indépendant. Déclaré rebelle en 1820, Ali fut abandonné par ses fils et ses commandants et assiégé à Ioannina par une armée ottomane sous Ismail Pashabey puis Hurshid Pacha ; il s’allia brièvement avec les Souliotes et les rebelles grecs, mais fut tué en janvier 1822 après avoir quitté sa citadelle sous la promesse de sécurité."
"Ali Pasha’s death is dated 24 January 1822 in most accounts and 5 February in others, the twelve days between the Julian and Gregorian calendars; accounts of how he died also differ.": "La mort d’Ali Pacha est datée du 24 janvier 1822 dans la plupart des comptes et le 5 février dans d’autres, les douze jours entre les calendriers julien et grégorien ; les récits de sa mort diffèrent également."
