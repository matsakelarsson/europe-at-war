# Some French text was translated automatically.
"Revolt of Bardas Phokas": "Révolte de Bardas Phokas"
"The rebellion of Bardas Phokas, who in 987, after Basil II’s defeat by the Bulgarians at the Gates of Trajan, had himself proclaimed emperor in Asia Minor. He made an alliance with the returning rebel Bardas Skleros, then imprisoned him, took over almost all of Asia Minor and besieged Abydos on the Dardanelles. Basil II obtained 6,000 Varangian warriors from Prince Vladimir of Kiev, who was promised the emperor’s sister Anna in marriage and accepted baptism. The Varangians routed a rebel army at Chrysopolis, and at Abydos on 13 April 989 Phokas died, apparently of a seizure, as he rode out to attack Basil. His army broke up, and Skleros submitted later that year. The Varangians became the emperors’ guard.": "La rébellion de Bardas Phokas, qui en 987, après la défaite de Basil II par les Bulgares aux Portes de Trajan, avait lui-même proclamé empereur en Asie Mineure. Il a fait une alliance avec le rebelle retour Bardas Skleros, puis l’a emprisonné, a repris presque toute l’Asie Mineure et assiégé Abydos sur les Dardanelles. Basil II a obtenu 6 000 guerriers varangiens du prince Vladimir de Kiev, qui a été promis à la soeur de l’empereur Anna en mariage et accepté le baptême. Les Varangiens ont fait route une armée rebelle à Chrysopolis, et à Abydos le 13 avril 989 Phokas est mort, apparemment d’une saisie, alors qu’il sortait pour attaquer Basil. Son armée a rompu, et Skleros soumis plus tard cette année-là. Les Varangiens devinrent les empereurs."
"The main sources are Michael Psellos, John Skylitzes, Yahya of Antioch and the Armenian Stepanos Taronetsi. Phokas was proclaimed emperor in the summer of 987; the battle of Chrysopolis is dated to 988 or early 989. Some writers suspected that he had been poisoned.": "Les sources principales sont Michael Psellos, John Skylitzes, Yahya d’Antioche et les Arméniens Stepanos Taronetsi. Phokas a été proclamé empereur à l’été de 987 ; la bataille de Chrysopolis est datée à 988 ou au début de 989. Certains écrivains soupçonnaient qu’il avait été empoisonné."
