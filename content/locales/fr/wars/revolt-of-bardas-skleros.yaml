# Some French text was translated automatically.
"Revolt of Bardas Skleros": "Révolte de Bardas Skleros"
"The rebellion of Bardas Skleros, the leading general of the East, who was proclaimed emperor by his troops in 976 after the regent Basil Lekapenos, ruling for the young Basil II, removed him from his command. Skleros won over the eastern frontier, defeated the loyalist armies and took most of Asia Minor; his fleet tried to close the Dardanelles and he besieged Nicaea. The government released his old rival Bardas Phokas, who, with 12,000 Georgian horsemen sent by David III of Tao, was beaten twice before defeating Skleros on 24 March 979 in a battle decided, the chroniclers say, by single combat between the two Bardases. Skleros fled to Baghdad. The revolt kept Byzantium from stopping the rise of Samuel’s Bulgaria.": "La rébellion de Bardas Skleros, le chef général de l’Est, qui a été proclamé empereur par ses troupes en 976 après que le régent Basil Lekapenos, dirigeant pour le jeune Basil II, l’a retiré de son commandement. Skleros a gagné la frontière orientale, a vaincu les armées loyalistes et pris la plupart de l’Asie Mineure ; sa flotte a essayé de fermer les Dardanelles et il a assiégé Nicée. Le gouvernement a libéré son ancien rival Bardas Phokas, qui, avec 12 000 cavaliers géorgiens envoyés par David III de Tao, a été battu deux fois avant de battre Skleros le 24 mars 979 dans une bataille décidée, disent les chroniqueurs, par un seul combat entre les deux Bardases. Skleros s’est enfui à Bagdad. La révolte a empêché Byzance d’arrêter la montée de Samuels Bulgarie."
"The main sources are Leo the Deacon, Michael Psellos and John Skylitzes on the Byzantine side, with Yahya of Antioch and other Arabic writers. Accounts of the battles differ; the last is said to have been decided by single combat between the two Bardases, in which Skleros was wounded.": "Les principales sources sont Leo le diacre, Michael Psellos et John Skylitzes du côté byzantin, avec Yahya d’Antioche et d’autres écrivains arabes. Les récits des batailles diffèrent ; la dernière aurait été décidée par un seul combat entre les deux Bardases, dans lequel Skleros a été blessé."
"Skleros returned in 987 and joined, then was imprisoned by, Bardas Phokas; see the revolt of Bardas Phokas.": "Skleros est revenu en 987 et s’est joint, puis a été emprisonné par Bardas Phokas ; voir la révolte de Bardas Phokas."
