# French translations of the catalogue text (wave 9); step bodies follow later.
Revolt of the Altishahr Khojas: Révolte des khodjas de l’Altishahr
The war in which the Qing empire conquered Altishahr, the oasis cities of the Tarim basin, from the Afaqi Khojas, a family of Sufi leaders who had ruled them under the Dzungars. Released from Dzungar captivity by the Qing in 1755, the brothers Burhan al-Din and Khoja Jahan returned to Kashgar and Yarkand as Qing vassals, but in 1757, while the Qing were fighting Amursana, they declared their independence and killed a Qing envoy. In 1758 a Qing army took Kucha, Aksu and Uch Turfan, but the brothers escaped, and Zhaohui’s army was besieged for three months at the Black River camp outside Yarkand until relieved in February 1759. In the summer of 1759 the Qing took Kashgar and Yarkand, and the khojas fled over the Pamirs to Badakhshan, where the ruler Sultan Shah had them killed and sent Khoja Jahan’s head to the Qing. Altishahr was joined to Dzungaria as Xinjiang and governed through local begs under Qing military officials; the khojas’ descendants in exile led new invasions from Kokand in the 19th century.: La guerre au cours de laquelle l’empire des Qing conquit l’Altishahr, les villes-oasis du bassin du Tarim, sur les khodjas afaqis, une famille de chefs soufis qui les avaient gouvernées sous les Dzoungars. Libérés par les Qing de leur captivité chez les Dzoungars en 1755, les frères Burhan al-Din et Khoja Jahan revinrent à Kachgar et à Yarkand en tant que vassaux des Qing mais, en 1757, alors que les Qing combattaient Amoursana, ils proclamèrent leur indépendance et tuèrent un envoyé Qing. En 1758, une armée Qing prit Koutcha, Aksou et Uch Turfan, mais les frères s’échappèrent, et l’armée de Zhaohui fut assiégée pendant trois mois dans le camp de la rivière Noire, devant Yarkand, jusqu’à sa délivrance en février 1759. À l’été 1759, les Qing prirent Kachgar et Yarkand, et les khodjas s’enfuirent par le Pamir jusqu’au Badakhchan, dont le souverain, Sultan Shah, les fit tuer et envoya la tête de Khoja Jahan aux Qing. L’Altishahr fut réuni à la Dzoungarie sous le nom de Xinjiang et gouverné par l’intermédiaire de begs locaux placés sous l’autorité d’officiers militaires Qing ; les descendants des khodjas en exil menèrent de nouvelles invasions depuis Kokand au XIXe siècle.
