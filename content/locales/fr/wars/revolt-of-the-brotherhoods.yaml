# Some French text was translated automatically.
"Revolt of the Brotherhoods": "Révolte des Frères"
? "A revolt of the armed guilds, the germanies, of the Kingdom of Valencia against the nobles and the royal government of Charles I, with a related rising on Majorca. In 1519, when plague drove many nobles from the city of Valencia, the guilds took over its government through a Council of Thirteen, and in 1520 they forced out the new viceroy, Diego Hurtado de Mendoza. Open war came in 1521. The agermanats under Vicent Peris beat the viceroy at Gandia in July and forcibly baptised the Muslim peasants of the region, but within weeks they were crushed by the Marquis of Los Vélez at Oriola, and the city of Valencia surrendered on 1 November. Peris, trying to revive the revolt, was captured after a night of street fighting and executed in March 1522; Xàtiva and Alzira held out until December, and the Majorcan rebels surrendered Palma on 8 March 1523. Hundreds of rebels were executed, and the forced baptisms were upheld, turning Valencia’s Muslims into Moriscos."
: "Une révolte des guildes armées, les germanies, du royaume de Valence contre les nobles et le gouvernement royal de Charles Ier, avec une montée connexe sur Majorque. En 1519, quand la peste a chassé beaucoup de nobles de la ville de Valence, les guildes ont pris son gouvernement par l’intermédiaire d’un Conseil de treize, et en 1520 ils ont forcé le nouveau vice-roi, Diego Hurtado de Mendoza. La guerre ouverte eut lieu en 1521. Les agermanats sous le vice-roi Peris batirent le vice-roi à Gandia en juillet et baptisèrent de force les paysans musulmans de la région, mais en quelques semaines ils furent écrasés par le marquis de Los Vélez à Oriola, et la ville de Valence se rendit le 1er novembre. Peris, essayant de relancer la révolte, fut capturé après une nuit de combats de rue et exécuté en mars 1522 ; Xàtiva et Alzira se tint jusqu’en décembre, et les rebelles majorcains rendirent Palma le 8 mars 1523. Des centaines de rebelles furent exécutés, et les baptêmes forcés furent maintenus, transformant les musulmans de Valence en Moriscos."
"Dates are Julian, as usual for the period. The revolt is known in Catalan as the Germanies and in Spanish as the Germanías, from germania, brotherhood.": "Les dates sont Julian, comme d’habitude pour l’époque. La révolte est connue en catalan comme les Allemands et en espagnol comme les Germanías, de la germanie, fraternité."
"King Ferdinand and Charles I had allowed the guilds to arm against Barbary corsairs raiding the coast. The revolt ran alongside the Revolt of the Comuneros in Castile but had different aims and no common leadership.": "Le roi Ferdinand et Charles Ier avaient permis aux guildes d’armer contre les corsaires de Barbary qui sillonnaient la côte. La révolte courait le long de la Révolution des Comuneros en Castille, mais avait des buts différents et aucune direction commune."
