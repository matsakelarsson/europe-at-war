# Some French text was translated automatically.
"Revolt of the Comuneros": "Révolte des Comuneros"
"A rising of the cities of Castile against the government of the young Charles I, the emperor Charles V, his Flemish advisers and the taxes he demanded before leaving for Germany. The rebel towns formed a Holy Junta and tried to rule in the name of his mother, Queen Joanna, but the great nobles rallied to the crown, and the comunero army was crushed at Villalar on 23 April 1521. Toledo held out under María Pacheco into 1522.": "Une montée des villes de Castille contre le gouvernement du jeune Charles Ier, l’empereur Charles V, ses conseillers flamands et les impôts qu’il exigeait avant de partir pour l’Allemagne. Les villes rebelles formèrent une Junte sainte et essayèrent de gouverner au nom de sa mère, la reine Joanna, mais les grands nobles se rallièrent à la couronne, et l’armée comunero fut écrasée à Villalar le 23 avril 1521. Toledo tenu sous María Pacheco en 1522."
"Dates are Julian, as usual for the period.": "Les dates sont Julian, comme d’habitude pour la période."
"The comunidades were the councils that took over the rebel cities. At its height the Holy Junta spoke for fourteen cities, among them Toledo, Segovia, Salamanca, Valladolid, Ávila, León, Zamora, Toro and Madrid; Burgos left it in the autumn of 1520. Andalusia stayed loyal to the crown.": "Les comunidades étaient les conseils qui ont pris le contrôle des villes rebelles. A son sommet, la Junte sainte parlait pour quatorze villes, parmi lesquelles Tolède, Ségovie, Salamanque, Valladolid, Ávila, León, Zamora, Toro et Madrid ; Burgos l’a quittée à l’automne de 1520. L’Andalousie est restée fidèle à la couronne."
"The revolt ran alongside the Revolt of the Brotherhoods in the Kingdom of Valencia, which had different causes. Since the 19th century the comuneros have been remembered as defenders of Castile’s liberties, and 23 April is now the regional day of Castile and León.": "La révolte a couru aux côtés de la Révolte des Frères dans le Royaume de Valence, qui avait des causes différentes. Depuis le 19ème siècle les comuneros ont été rappelés comme défenseurs des libertés de Castille, et 23 avril est maintenant la journée régionale de Castille et León."
