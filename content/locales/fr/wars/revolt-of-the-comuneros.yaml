"April–December 1520": "avril–décembre 1520"
"Charles of Habsburg, who had grown up in Flanders, came to Castile in 1517 with Flemish advisers who took its richest offices, and in 1519 he was elected emperor. To pay for the election and his journey to Germany he asked the Cortes, meeting at Santiago and A Coruña in the spring of 1520, for a large subsidy, and got it only by pressure and bribes. He sailed on 20 May, leaving his old tutor, Cardinal Adrian of Utrecht, as regent. Toledo had already risen in April. At Segovia on 30 May a crowd of wool workers killed the city’s deputy who had voted for the tax, and other cities drove out royal officials.": "Charles de Habsbourg, qui avait grandi en Flandre, est venu en Castille en 1517 avec des conseillers flamands qui ont pris ses plus riches fonctions, et en 1519 il a été élu empereur. Pour payer l’élection et son voyage en Allemagne, il a demandé aux Cortes, réunion à Santiago et A Coruña au printemps de 1520, pour une grande subvention, et a obtenu seulement par la pression et les pots-de-vin. Il a navigué le 20 mai, laissant son ancien tuteur, le cardinal Adrian d’Utrecht, comme régent. Tolède avait déjà augmenté en avril. À Ségovie, le 30 mai, une foule de travailleurs de la laine ont tué le député municipal qui avait voté pour la taxe, et d’autres villes ont chassé les fonctionnaires royaux."
"In August royal troops sent to seize the artillery at Medina del Campo set fire to the great market town, and the outrage swung opinion behind the rebels. Their Holy Junta, first meeting at Ávila, moved to Tordesillas, where Juan de Padilla’s comunero army had taken charge of Queen Joanna, Charles’s mother, long kept there as unfit to rule. The Junta claimed to govern in her name, but she would sign nothing. As peasants rose against their lords, the great nobles sided with the crown. Charles made the Constable and the Admiral of Castile co-regents, and on 5 December the royalists stormed Tordesillas.": "En août, les troupes royales dépêchèrent l’artillerie de Medina del Campo pour mettre le feu à la grande ville du marché, et l’indignation tourna derrière les rebelles. Leur sainte Junta, première réunion à Ávila, s’installa à Tordesillas, où Juan de Padillas comunero armée avait pris en charge la reine Joanna, la mère Charles, longtemps gardée là comme inapte à gouverner. La Junte prétendait gouverner en son nom, mais elle ne signerait rien. Tandis que les paysans se levaient contre leurs seigneurs, les grands nobles s’appuyaient sur la couronne. Charles fit le gendarme et l’amiral des co-régents de Castille, et le 5 décembre les royalistes prirent Tordesillas à l’assaut."
