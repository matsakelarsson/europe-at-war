"1521–1522": "1521–1522"
"The comuneros regrouped at Valladolid. In the north the warlike Bishop of Zamora, Antonio de Acuña, raised the peasants against their lords around Palencia and then went on to Toledo, where crowds hailed him as archbishop. In February 1521 Padilla stormed and plundered the small town of Torrelobatón, west of Valladolid, but the rebels then hesitated while the Constable brought his army from Burgos to join the Admiral’s. On 23 April, as Padilla tried to fall back on Toro through heavy rain, the royal cavalry caught his army near Villalar, and it broke almost at once.": "Les comuneros se regroupèrent à Valladolid. Au nord, l’évêque guerrière de Zamora, Antonio de Acuña, éleva les paysans contre leurs seigneurs autour de Palencia et se rendit ensuite à Tolède, où la foule l’applaudit comme archevêque. En février 1521, Padilla s’empare et pille la petite ville de Torrelobatón, à l’ouest de Valladolid, mais les rebelles hésitent alors que le gendarme amène son armée de Burgos pour rejoindre l’amiral. Le 23 avril, alors que Padilla tente de retomber sur Toro sous une forte pluie, la cavalerie royale capture son armée près de Villalar, et elle éclate presque immédiatement."
"Padilla, Juan Bravo of Segovia and Francisco Maldonado of Salamanca were beheaded at Villalar the next day, and the revolt collapsed. A French army that invaded Navarre in May, hoping to profit from it, was beaten at Noáin on 30 June. Toledo held out under Padilla’s widow, María Pacheco, until it surrendered on terms in October, and after a last rising on 3 February 1522 she fled to Portugal. Charles returned in July 1522 and on 1 November pardoned all but 293 rebels; Bishop Acuña was executed in 1526. The Castilian cities never again challenged the crown.": "Padilla, Juan Bravo de Segovia et Francisco Maldonado de Salamanque ont été décapités à Villalar le lendemain, et la révolte s’est effondrée. Une armée française qui a envahi Navarre en mai, espérant en tirer profit, a été battue à Noáin le 30 juin. Après une dernière montée le 3 février 1522, elle s’enfuit au Portugal. Charles rentra en juillet 1522 et pardonna tous les rebelles sauf 293 le 1er novembre ; Mgr Acuña fut exécuté en 1526. Les villes castilliennes ne contestèrent plus jamais la couronne."
