# French translations of the catalogue text (wave 9); step bodies follow later.
Revolt of the Three Feudatories: Révolte des Trois Feudataires
? "A civil war in southern and western China between the Kangxi Emperor of the Qing and the three Chinese generals who had conquered the south for the dynasty and ruled it as princes: Wu Sangui in Yunnan and Guizhou, Shang Kexi and his son Shang Zhixin in Guangdong, and Geng Jingzhong in Fujian. When the young emperor accepted their offers to retire in 1673 and ordered their domains abolished, Wu Sangui rose at Kunming in December 1673 and took Hunan and Sichuan within months; Geng Jingzhong in Fujian, Sun Yanling in Guangxi and Wang Fuchen in Shaanxi joined him, and Zheng Jing crossed from Taiwan to the Fujian coast. The rebels never crossed the Yangtze, and the Qing defeated them one at a time: Wang Fuchen and Geng Jingzhong surrendered in 1676 and Shang Zhixin in 1677. Wu Sangui proclaimed himself emperor of Zhou at Hengzhou in March 1678 but died that October. Qing armies, most of them Chinese Green Standard troops, retook Hunan in 1679 and Sichuan and Guizhou in 1680, and in December 1681 Kunming fell and Wu’s grandson Wu Shifan killed himself. The victory left the Kangxi Emperor master of all China except Taiwan, which the Qing took in 1683."
: "Une guerre civile dans le sud et l’ouest de la Chine entre l’empereur Kangxi des Qing et les trois généraux chinois qui avaient conquis le Sud pour la dynastie et le gouvernaient en princes : Wu Sangui au Yunnan et au Guizhou, Shang Kexi et son fils Shang Zhixin au Guangdong, et Geng Jingzhong au Fujian. Lorsque le jeune empereur accepta en 1673 leurs offres de se retirer et ordonna l’abolition de leurs domaines, Wu Sangui se souleva à Kunming en décembre 1673 et prit le Hunan et le Sichuan en quelques mois ; Geng Jingzhong au Fujian, Sun Yanling au Guangxi et Wang Fuchen au Shaanxi le rejoignirent, et Zheng Jing passa de Taïwan sur la côte du Fujian. Les rebelles ne franchirent jamais le Yangzi, et les Qing les vainquirent l’un après l’autre : Wang Fuchen et Geng Jingzhong se rendirent en 1676, et Shang Zhixin en 1677. Wu Sangui se proclama empereur des Zhou à Hengzhou en mars 1678, mais mourut en octobre de la même année. Les armées Qing, composées pour la plupart de troupes chinoises de l’Étendard vert, reprirent le Hunan en 1679, puis le Sichuan et le Guizhou en 1680 ; en décembre 1681, Kunming tomba et le petit-fils de Wu, Wu Shifan, se donna la mort. La victoire laissa l’empereur Kangxi maître de toute la Chine à l’exception de Taïwan, que les Qing prirent en 1683."
