# French translations of the catalogue text (wave 8); step bodies follow later.
Revolts against Muhammad bin Tughluq: Révoltes contre Muhammad bin Tughluq
The break-up of the Delhi Sultanate’s empire in the south and east under Muhammad bin Tughluq (1325–1351), whose realm at its height reached from the Punjab to Madurai. In 1334–1335 the governor of Ma’bar founded the Madurai Sultanate, and an epidemic forced the sultan’s army back from the Deccan. In 1336 Kapaya Nayaka drove the Delhi governor out of Warangal, and Harihara and Bukka founded the Vijayanagara kingdom on the Tungabhadra; the Hoysalas recovered for a time, and Bengal went its own way from 1338. In 1345–1347 the commanders of the Deccan and Gujarat rose against the sultan’s tax officials, seized Daulatabad and, after defeating his generals, crowned Zafar Khan as Alauddin Bahman Shah, founder of the Bahmani Sultanate, on 3 August 1347.: L’éclatement de l’empire du sultanat de Delhi dans le Sud et l’Est sous Muhammad bin Tughluq (1325–1351), dont les domaines s’étendaient à leur apogée du Pendjab à Madurai. En 1334–1335, le gouverneur du Ma’bar fonda le sultanat de Madurai, et une épidémie contraignit l’armée du sultan à se retirer du Dekkan. En 1336, Kapaya Nayaka chassa de Warangal le gouverneur de Delhi, et Harihara et Bukka fondèrent le royaume de Vijayanagar sur la Tungabhadra ; les Hoysala se relevèrent un temps, et le Bengale suivit sa propre voie à partir de 1338. En 1345–1347, les commandants du Dekkan et du Goujarat se soulevèrent contre les agents fiscaux du sultan, s’emparèrent de Daulatabad et, après avoir vaincu ses généraux, couronnèrent le 3 août 1347 Zafar Khan sous le nom d’Alauddin Bahman Shah, fondateur du sultanat bahmanide.
