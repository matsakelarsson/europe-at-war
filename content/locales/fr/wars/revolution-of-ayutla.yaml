# French translations of the catalogue text (wave 14); step bodies follow later.
Revolution of Ayutla: Révolution d’Ayutla
? The liberal revolt of 1854–1855 that overthrew Antonio López de Santa Anna for the last time. Recalled by the Conservatives in 1853, Santa Anna had ruled as a dictator with the title His Most Serene Highness, exiled opponents, taxed doors, windows and dogs, and sold the Mesilla valley to the United States (the Gadsden Purchase) to pay his army. On 1 March 1854 Colonel Florencio Villarreal proclaimed the Plan of Ayutla in the village of Ayutla in Guerrero, calling for Santa Anna’s removal and a congress to write a new constitution, with the backing of Juan Álvarez, the old insurgent who dominated Guerrero; on 11 March Ignacio Comonfort, former customs chief of Acapulco, issued a revised version at Acapulco. Santa Anna marched south with a large army in the spring of 1854 but failed to take Acapulco, held by Comonfort in the fort of San Diego, and his troops burned villages on their retreat. The revolt spread through Michoacán, the north under Santiago Vidaurri, and the centre, and in August 1855 Santa Anna left Mexico City and sailed into exile. Álvarez became interim president in October 1855, with Benito Juárez, Melchor Ocampo and Comonfort in his government. Their reforms, the Juárez and Lerdo laws and the Constitution of 1857, led to the Reform War.
: La révolte libérale de 1854–1855 qui renversa Antonio López de Santa Anna pour la dernière fois. Rappelé par les conservateurs en 1853, Santa Anna avait gouverné en dictateur avec le titre de Son Altesse Sérénissime, exilé ses opposants, taxé les portes, les fenêtres et les chiens, et vendu la vallée de la Mesilla aux États-Unis (l’achat Gadsden) pour payer son armée. Le 1er mars 1854, le colonel Florencio Villarreal proclama dans le village d’Ayutla, dans le Guerrero, le plan d’Ayutla, qui réclamait la destitution de Santa Anna et la réunion d’un congrès chargé de rédiger une nouvelle constitution, avec l’appui de Juan Álvarez, l’ancien insurgé qui dominait le Guerrero ; le 11 mars, Ignacio Comonfort, ancien chef des douanes d’Acapulco, en publia une version révisée à Acapulco. Santa Anna marcha vers le sud avec une grande armée au printemps 1854, mais ne parvint pas à prendre Acapulco, que Comonfort tenait depuis le fort de San Diego, et ses troupes incendièrent des villages pendant leur retraite. La révolte s’étendit au Michoacán, au Nord sous la conduite de Santiago Vidaurri et au Centre et, en août 1855, Santa Anna quitta Mexico et partit en exil par la mer. Álvarez devint président par intérim en octobre 1855, avec Benito Juárez, Melchor Ocampo et Comonfort dans son gouvernement. Leurs réformes, les lois Juárez et Lerdo et la Constitution de 1857, conduisirent à la guerre de Réforme.
