# French translations of the catalogue text (wave 13); step bodies follow later.
Rhodesian Bush War: Guerre du Bush de Rhodésie
? The war between the white-minority government of Rhodesia and the African nationalist movements that fought for majority rule, known in Zimbabwe as the Second Chimurenga or the liberation war. After Ian Smith’s government declared independence from Britain unilaterally (UDI) on 11 November 1965 to avoid majority rule, the Zimbabwe African National Union (ZANU), with its army ZANLA, and the Zimbabwe African People’s Union (ZAPU), with its army ZIPRA, sent guerrillas from Zambia. The early incursions, at Sinoia in 1966 and Wankie in 1967, were crushed. From December 1972 ZANLA, working with FRELIMO in Mozambique, spread the war through the north-east and, after Mozambique’s independence in 1975, along the whole eastern border, while ZIPRA operated from Zambia and Botswana in the west. Rhodesia answered with conscription, the Fireforce, the Selous Scouts, protected villages and raids on guerrilla camps in Mozambique and Zambia that killed thousands, many of them refugees. ZIPRA shot down two Air Rhodesia airliners. Smith’s internal settlement with Abel Muzorewa produced the unrecognised Zimbabwe Rhodesia in 1979. The Lancaster House Agreement of 21 December 1979 brought a ceasefire, British-run elections that Robert Mugabe’s ZANU won, and the independence of Zimbabwe on 18 April 1980. Some 20,000 people were killed.
: La guerre entre le gouvernement de la minorité blanche de Rhodésie et les mouvements nationalistes africains qui luttaient pour le gouvernement de la majorité, connue au Zimbabwe sous le nom de deuxième Chimurenga ou de guerre de libération. Après que le gouvernement d’Ian Smith eut déclaré unilatéralement l’indépendance vis-à-vis de la Grande-Bretagne (UDI) le 11 novembre 1965 pour échapper au gouvernement de la majorité, l’Union nationale africaine du Zimbabwe (ZANU), avec son armée, la ZANLA, et l’Union du peuple africain du Zimbabwe (ZAPU), avec son armée, la ZIPRA, envoyèrent des guérilleros depuis la Zambie. Les premières incursions, à Sinoia en 1966 et à Wankie en 1967, furent écrasées. À partir de décembre 1972, la ZANLA, en lien avec le FRELIMO au Mozambique, étendit la guerre à tout le nord-est puis, après l’indépendance du Mozambique en 1975, à toute la frontière orientale, tandis que la ZIPRA opérait depuis la Zambie et le Botswana dans l’ouest. La Rhodésie riposta par la conscription, la Fireforce, les Selous Scouts, les villages protégés et des raids contre les camps de la guérilla au Mozambique et en Zambie, qui firent des milliers de morts, dont beaucoup de réfugiés. La ZIPRA abattit deux avions de ligne d’Air Rhodesia. Le règlement interne conclu par Smith avec Abel Muzorewa donna naissance en 1979 au Zimbabwe-Rhodésie, qui ne fut pas reconnu. L’accord de Lancaster House du 21 décembre 1979 apporta un cessez-le-feu, des élections organisées par les Britanniques, que remporta la ZANU de Robert Mugabe, et l’indépendance du Zimbabwe le 18 avril 1980. Quelque 20 000 personnes furent tuées.
