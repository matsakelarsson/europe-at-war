# French translations of the catalogue text (wave 11); step bodies follow later.
Riau War: Guerre de Riau
? A war between the Dutch East India Company (VOC) and the Johor-Riau sultanate, led by its Bugis viceroy (Yang Dipertuan Muda) Raja Haji, with Selangor and Rembau as allies. Riau, on the island of Bintan near today’s Tanjungpinang, had grown into a busy free port that drew trade away from Dutch Malacca. During the Fourth Anglo-Dutch War, in 1782, Raja Haji helped the VOC seize the British ship Betsy and its cargo of opium in Riau’s harbour, but the Company refused him a share of the prize; he made a show of force with a large fleet off Muar, and the governor of Malacca, Pieter Gerardus de Bruijn, pressed for war. In June 1783 a VOC squadron declared war and blockaded Riau. On 6 January 1784 an attempt to land troops failed when the flagship Malakka’s Welvaaren ran aground on the defenders’ stone barriers and blew up, killing its commander, Arnoldus Lemker, and hundreds of men. Selangor and Rembau forces then landed near Malacca, and from February Raja Haji besieged the town, taking its suburbs. On 18 June 1784 a fleet from the Netherlands under Jacob Pieter van Braam, with about 1,400 European soldiers, landed and attacked the besiegers’ camp at Teluk Ketapang; Raja Haji was killed and the siege collapsed. Van Braam took Kuala Selangor and installed a ruler from Siak, then attacked Riau; after the fort on Penyengat fell, Raja Haji’s successor Raja Ali left for Borneo on 31 October 1784. The sultan of Johor had to banish the Bugis leaders and accept a VOC resident and garrison at Riau, but a rising in 1787 drove them out, Sultan Ibrahim of Selangor retook his capital in 1785 and made peace in 1786, and the war hastened the decline of Dutch power in the Strait of Malacca. Raja Haji was buried on Penyengat and is a National Hero of Indonesia.
: Une guerre entre la Compagnie néerlandaise des Indes orientales (VOC) et le sultanat de Johor-Riau, dirigé par son vice-roi bugis (Yang Dipertuan Muda) Raja Haji et allié à Selangor et à Rembau. Riau, sur l’île de Bintan, près de l’actuelle Tanjungpinang, était devenu un port franc animé qui détournait le commerce de la Malacca néerlandaise. Pendant la quatrième guerre anglo-néerlandaise, en 1782, Raja Haji aida la VOC à s’emparer du navire britannique Betsy et de sa cargaison d’opium dans le port de Riau, mais la Compagnie lui refusa une part de la prise ; il fit une démonstration de force avec une grande flotte au large de Muar, et le gouverneur de Malacca, Pieter Gerardus de Bruijn, poussa à la guerre. En juin 1783, une escadre de la VOC déclara la guerre et établit le blocus de Riau. Le 6 janvier 1784, une tentative de débarquement tourna court lorsque le navire amiral Malakka’s Welvaaren s’échoua sur les barrages de pierre des défenseurs et explosa, tuant son commandant, Arnoldus Lemker, et des centaines d’hommes. Des forces de Selangor et de Rembau débarquèrent alors près de Malacca et, à partir de février, Raja Haji assiégea la ville, dont il prit les faubourgs. Le 18 juin 1784, une flotte venue des Pays-Bas sous les ordres de Jacob Pieter van Braam, avec environ 1 400 soldats européens, débarqua et attaqua le camp des assiégeants à Teluk Ketapang ; Raja Haji fut tué et le siège s’effondra. Van Braam prit Kuala Selangor, où il installa un souverain venu de Siak, puis attaqua Riau ; après la chute du fort de Penyengat, le successeur de Raja Haji, Raja Ali, partit pour Bornéo le 31 octobre 1784. Le sultan de Johor dut bannir les chefs bugis et accepter un résident et une garnison de la VOC à Riau, mais un soulèvement les chassa en 1787, le sultan Ibrahim de Selangor reprit sa capitale en 1785 et fit la paix en 1786, et la guerre précipita le déclin de la puissance néerlandaise dans le détroit de Malacca. Raja Haji fut enterré à Penyengat ; il est un héros national de l’Indonésie.
