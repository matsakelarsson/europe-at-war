Franco-Spanish cooperation in the Rif War (Hespéris-Tamuda): La collaboration franco-espagnole pendant la guerre du Rif (Hespéris-Tamuda)
A colonial war in northern Morocco in which the Berber tribes of the Rif, led by Muhammad ibn Abd al-Karim al-Khattabi, known as Abd el-Krim, destroyed a Spanish army at Annual in 1921 and set up the Republic of the Rif. Spain, which held northern Morocco as a protectorate, lost about 13,000 soldiers in the disaster of 1921, retook the land around Melilla but could not defeat the Rif, and from 1924 its army dropped mustard gas and other chemical weapons on Rifian villages and markets. In late 1924 it withdrew from the western interior around Chefchaouen. After the Rifians attacked the French zone in April 1925 and came close to Fez, France sent Marshal Pétain with a large army and joined Spain. A Spanish landing at Alhucemas in September 1925 and converging French and Spanish offensives forced Abd el-Krim to surrender to the French on 27 May 1926; he was exiled to Réunion. The last resistance ended in July 1927.: Une guerre coloniale dans le nord du Maroc au cours de laquelle les tribus berbères du Rif, menées par Muhammad ibn Abd al-Karim al-Khattabi, dit Abd el-Krim, anéantirent une armée espagnole à Anoual en 1921 et fondèrent la République du Rif. L’Espagne, qui tenait le nord du Maroc sous la forme d’un protectorat, perdit environ 13 000 soldats lors du désastre de 1921, reprit les terres autour de Melilla mais ne put vaincre le Rif et, à partir de 1924, son armée largua du gaz moutarde et d’autres armes chimiques sur des villages et des marchés rifains. À la fin de 1924, elle se retira de l’intérieur occidental, autour de Chefchaouen. Après que les Rifains eurent attaqué la zone française en avril 1925 et se furent approchés de Fès, la France envoya le maréchal Pétain avec une armée nombreuse et s’allia à l’Espagne. Un débarquement espagnol à Alhucemas en septembre 1925 et des offensives française et espagnole convergentes contraignirent Abd el-Krim à se rendre aux Français le 27 mai 1926 ; il fut exilé à La Réunion. Les dernières résistances cessèrent en juillet 1927.
