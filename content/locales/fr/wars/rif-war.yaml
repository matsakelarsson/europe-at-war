# Some French text was translated automatically.
"Rif War": "La guerre du Rif"
"A colonial war in northern Morocco in which the Berber tribes of the Rif, led by Abd el-Krim, destroyed a Spanish army at Annual in 1921 and set up the Republic of the Rif. After the Rifians attacked the French zone in 1925, France joined Spain; a Spanish landing at Alhucemas and a French offensive from the south forced Abd el-Krim to surrender in May 1926.": "Une guerre coloniale dans le nord du Maroc, au cours de laquelle les tribus berbères du Rif, dirigées par Abd el-Krim, ont détruit une armée espagnole à Annual en 1921 et mis en place la République du Rif. Après l’attaque de la zone française en 1925, la France a rejoint l’Espagne ; un débarquement espagnol à Alhucemas et une offensive française du sud ont forcé Abd el-Krim à se rendre en mai 1926."
"Northern Morocco had been a Spanish protectorate since 1912, while the rest of the country was a French protectorate; the base map cannot show the protectorates, so the areas in the steps show approximate zones of control. Some accounts date the war from Spain’s campaigns in the Rif in 1920, and fighting against the last Rifian holdouts went on until July 1927.": "Le nord du Maroc a été un protectorat espagnol depuis 1912, tandis que le reste du pays était un protectorat français ; la carte de base ne peut pas montrer les protectorats, de sorte que les zones dans les étapes montrent des zones approximatives de contrôle. Certains comptes datent la guerre d’Espagne campagnes dans le Rif en 1920, et se battre contre les derniers holdouts rifiens a continué jusqu’en juillet 1927."
"Spain and France lost tens of thousands of men killed, wounded, missing or sick, Spain about 43,500–63,000 and France 10,000–18,000 by different counts; Rifian losses were about 30,000, some 10,000 of them dead. Civilian deaths are not known. Sources give 26 or 27 May 1926 for Abd el-Krim’s surrender.": "L’Espagne et la France ont perdu des dizaines de milliers d’hommes tués, blessés, portés disparus ou malades, l’Espagne entre 43 500 et 63 000 et la France entre 10 000 et 18 000 par différents chefs d’accusation ; les pertes du Rifian se sont élevées à environ 30 000, dont quelque 10 000 morts."
