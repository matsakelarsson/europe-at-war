"1924 – May 1926": "1924 – mai 1926"
"The Spanish retook the country around Melilla but could not defeat the Rif, and from 1924 their army used chemical weapons, among them mustard gas, which aircraft dropped on villages, markets and rivers as well as on fighters. In late 1924 Primo de Rivera withdrew the troops in the west from Chefchaouen to a fortified line nearer the coast, a retreat that cost heavy losses. In April 1925 Abd el-Krim, at the height of his power, attacked the French posts on the Ouergha river, overran many of them and threatened Fez. France then sent Marshal Philippe Pétain with a large army and agreed to act together with Spain.": "Les Espagnols ont repris le pays autour de Melilla mais n’ont pas pu vaincre le Rif, et à partir de 1924 leur armée a utilisé des armes chimiques, parmi lesquelles le gaz moutarde, qui avion a lâché sur les villages, les marchés et les rivières ainsi que sur les combattants. En avril 1925, Abd el-Krim, au plus fort de son pouvoir, attaqua les postes français sur la rivière Ouergha, en envahit beaucoup et menaça Fez. La France envoya alors le maréchal Philippe Pétain avec une grande armée et accepta d’agir avec l’Espagne."
"On 8 September 1925 about 13,000 Spanish troops, supported by the Spanish and French fleets, aircraft and tanks, landed on the beaches west of Alhucemas Bay, in what is considered the first amphibious landing to use tanks and aircraft, and on 2 October they took Ajdir. French forces advanced from the south. Surrounded and short of supplies, Abd el-Krim surrendered to the French on 27 May 1926 and was exiled to the island of Réunion. The last resistance ended in 1927. Many officers who later led the Nationalists in the Spanish Civil War, Francisco Franco among them, made their careers in this war.": "Le 8 septembre 1925, environ 13 000 soldats espagnols, soutenus par les flottes espagnole et française, des avions et des chars, ont atterri sur les plages à l’ouest de la baie d’Alhucemas, dans ce qui est considéré comme le premier atterrissage amphibie à utiliser des chars et des aéronefs, et le 2 octobre ils ont pris Ajdir. Entouré et à court de provisions, Abd el-Krim se rendit aux Français le 27 mai 1926 et fut exilé sur l’île de la Réunion. La dernière résistance prit fin en 1927."
