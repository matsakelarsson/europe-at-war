"Annual": "Annual"
"June – August 1921": "juin – août 1921"
"In 1920–21 General Manuel Fernández Silvestre, the commander at Melilla, pushed west into the Rif with a chain of small, badly supplied outposts, aiming for the bay of Alhucemas. The tribes of the central Rif united under Abd el-Krim, a former official of the Spanish administration and a leader of the Aith Waryaghar. On 1 June 1921 they overran a new outpost on Mount Abarrán, and in July they besieged Igueriben, which fell on 21 July. The next day, with water and ammunition running out, Silvestre ordered the main camp at Annual to retreat, and the retreat turned into a rout in which he was killed.": "En 1920–1921, le général Manuel Fernández Silvestre, commandant à Melilla, poussa vers l’ouest dans le Rif avec une chaîne de petits avant-postes mal approvisionnés, visant la baie d’Alhucemas. Les tribus du Rif central s’unirent sous Abd el-Krim, ancien fonctionnaire de l’administration espagnole et chef de l’Aith Waryaghar. Le 1er juin 1921, ils envahirent un nouvel avant-poste sur le mont Abarrán, et en juillet, ils assiégèrent Igueriben, qui tombait le 21 juillet. Le lendemain, avec l’eau et les munitions qui couraient, Silvestre ordonna au camp principal d’Annual de se retirer, et la retraite devint une rout dans laquelle il fut tué."
"The whole Spanish line east of Annual collapsed as outposts fell one after another and local tribes rose. Survivors gathered at Monte Arruit, 35 km south of Melilla, which surrendered on 9 August; most of its garrison was then massacred. By the official count about 13,000 soldiers of the Spanish army died. Melilla itself was almost undefended, but the Rifians did not attack it, and reinforcements from the Spanish Legion arrived by sea. Abd el-Krim proclaimed the Republic of the Rif in September. In Spain the disaster and the inquiry into it shook the monarchy and helped bring about General Miguel Primo de Rivera’s coup of 1923.": "Toute la ligne espagnole à l’est de Annual s’écroulait alors que les avant-postes tombaient les uns après les autres et que les tribus locales s’élevaient. Des survivants se rassemblaient à Monte Arruit, 35 km au sud de Melilla, qui se rendait le 9 août ; la plupart de sa garnison fut massacrée. Melilla elle-même n’a presque pas été défendue, mais les Rifiens ne l’ont pas attaqué, et des renforts de la Légion espagnole sont arrivés par mer. Abd el-Krim a proclamé la République du Rif en septembre. En Espagne le désastre et l’enquête sur lui ont secoué la monarchie et contribué à faire venir le général Miguel Primo de Rivera , coup d’État de 1923."
