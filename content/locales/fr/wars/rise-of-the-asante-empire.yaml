# French translations of the catalogue text (wave 13); step bodies follow later.
Rise of the Asante Empire: Essor de l’empire ashanti
? The wars by which Asante grew, in half a century, from a coalition of small Akan states round Kumasi into the strongest power of the Gold Coast forest. In the 1690s Osei Tutu of Kwaaman led the northern tributaries of Denkyira, the great gold- and slave-trading kingdom of the Ofin and Oda valleys, against its king Ntim Gyakari, and many Denkyira towns went over to him. At Feyiase in 1701 Ntim Gyakari was defeated and killed and his capital Abankeseso sacked; Osei Tutu became the first Asantehene, and the Golden Stool, which tradition says the priest Okomfo Anokye called down from the sky, became the symbol of the union. Asante then subdued Denkyira’s old subjects, Twifo, Wassa and Aowin, until Osei Tutu was killed fighting Akyem on the Pra in 1717 and an Aowin army sacked Kumasi in 1718. His successor Opoku Ware conquered Bono (1723), forced Gyaman, western Gonja and Banda to pay tribute, defeated Akyem in 1742 and took over the rents the Europeans paid at Accra, and in 1744–1745 sent armies into eastern Gonja and Dagbon. By his death about 1750 Asante ruled, or took tribute from, most of the forest and southern savanna of today’s Ghana except the Fante coast. Its wars yielded gold, tribute and captives, many of whom were sold to the Dutch, English and Danish forts.
: Les guerres par lesquelles l’Ashanti passa en un demi-siècle d’une coalition de petits États akan groupés autour de Kumasi au rang de première puissance de la forêt de la Côte-de-l’Or. Dans les années 1690, Osei Tutu, de Kwaaman, mena les tributaires septentrionaux du Denkyira, grand royaume du commerce de l’or et des esclaves dans les vallées de l’Ofin et de l’Oda, contre leur roi Ntim Gyakari, et de nombreuses villes du Denkyira se rallièrent à lui. À Feyiase, en 1701, Ntim Gyakari fut vaincu et tué et sa capitale, Abankeseso, saccagée ; Osei Tutu devint le premier Asantehene, et le Tabouret d’or, que le prêtre Okomfo Anokye, selon la tradition, fit descendre du ciel, devint le symbole de l’union. L’Ashanti soumit ensuite les anciens sujets du Denkyira, Twifo, Wassa et Aowin, jusqu’à ce qu’Osei Tutu soit tué en combattant l’Akyem sur le Pra en 1717 et qu’une armée aowin saccage Kumasi en 1718. Son successeur Opoku Ware conquit le Bono (1723), imposa un tribut au Gyaman, au Gonja occidental et au Banda, vainquit l’Akyem en 1742 et s’appropria les redevances que les Européens versaient à Accra, puis envoya en 1744–1745 des armées dans le Gonja oriental et le Dagbon. À sa mort, vers 1750, l’Ashanti gouvernait la plus grande partie de la forêt et de la savane méridionale de l’actuel Ghana, ou en tirait tribut, à l’exception de la côte fanti. Ses guerres lui rapportaient de l’or, des tributs et des captifs, dont beaucoup furent vendus aux forts néerlandais, anglais et danois.
