# French translations of the catalogue text (wave 12); step bodies follow later.
Rise of the Bamana Empire of Ségou: Essor du royaume bambara de Ségou
? "The wars by which Mamari Coulibaly, known as Biton, made the Bamana (Bambara) kingdom of Ségou on the middle Niger the strongest state between the Senegal and the Niger bend. About 1712 he was chosen leader of the ton, the association of young men of Ségou, and turned it into a standing army: the tonjon, warriors who were in principle captives of the ton but in practice formed a military class, reinforced with runaway slaves and men taken in war or given as tribute. Biton fortified Ségou, kept a fleet of war canoes on the Niger and paid his men from the booty and tribute of yearly campaigns. His greatest danger came from the south, when Famagan Watara of the Kong Empire marched up from the Black Volta, besieged Ségou for about nine months and was driven off with the help of a Fulbe relief force; the sources date this invasion about 1739, and some give 1725. Biton fought a long war with the Massassi Coulibaly of Kaarta to the north-west, capturing their king Foulakoro outside Mourdiah about 1754 (he died in captivity), and imposed tribute on the Fulbe of Massina, the towns of the Marka and Somono and the country around Djenné and Bamako; he took Timbuktu, but held it only briefly. War captives were the main product of these campaigns: some were enrolled in the army or settled on the king’s farms, and many were sold north into the Saharan trade and west towards the Atlantic. After Biton’s death in 1755 his sons were killed or deposed by the tonjon, and after a decade of disorder one of the tonjon’s own commanders, Ngolo Diarra, took the throne in 1766 and founded the dynasty that ruled Ségou until Umar Tall took it in 1861."
: "Les guerres par lesquelles Mamari Coulibaly, dit Biton, fit du royaume bambara de Ségou, sur le moyen Niger, l’État le plus puissant entre le Sénégal et la boucle du Niger. Vers 1712, il fut choisi comme chef du ton, l’association des jeunes gens de Ségou, et le transforma en armée permanente : les tonjon, guerriers qui étaient en principe des captifs du ton mais formaient en pratique une classe militaire, renforcée par des esclaves fugitifs et par des hommes pris à la guerre ou livrés en tribut. Biton fortifia Ségou, entretint une flotte de pirogues de guerre sur le Niger et paya ses hommes grâce au butin et au tribut de campagnes annuelles. Le plus grand danger vint du sud, lorsque Famagan Watara, de l’empire de Kong, remonta depuis la Volta Noire, assiégea Ségou pendant environ neuf mois et fut repoussé avec l’aide d’une force de secours peule ; les sources datent cette invasion de 1739 environ, certaines de 1725. Biton mena une longue guerre contre les Massassi Coulibaly du Kaarta, au nord-ouest, capturant leur roi Foulakoro devant Mourdiah vers 1754 (il mourut en captivité), et imposa un tribut aux Peuls du Macina, aux villes des Marka et des Somono et au pays autour de Djenné et de Bamako ; il prit Tombouctou, mais ne la garda que peu de temps. Les captifs de guerre étaient le principal produit de ces campagnes : certains étaient enrôlés dans l’armée ou installés sur les domaines du roi, et beaucoup étaient vendus vers le nord dans le commerce saharien et vers l’ouest en direction de l’Atlantique. Après la mort de Biton en 1755, ses fils furent tués ou déposés par les tonjon et, après une décennie de désordres, l’un des chefs des tonjon eux-mêmes, Ngolo Diarra, monta sur le trône en 1766 et fonda la dynastie qui régna sur Ségou jusqu’à sa prise par Oumar Tall en 1861."
