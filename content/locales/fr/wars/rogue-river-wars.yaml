# French translations of the catalogue text (wave 14); step bodies follow later.
Rogue River Wars: Guerres de la Rogue River
? The war of 1855–1856 in south-western Oregon between the United States Army, Oregon volunteers and miners’ militias and the peoples of the Rogue River valley and the coast, the Takelma, the Upland Takelma or Latgawa, the Shasta, the Tututni and their neighbours, whom American sources grouped as the Rogue River Indians. Gold strikes near Jacksonville from 1851 brought thousands of miners and settlers onto their land, destroying the fish runs, game and oak groves they lived on. After fighting in 1853, including the Battle of Evans Creek, the Takelma leaders Apserkahar (Joe), Toquahear (Sam) and Anachaharah (Jim) signed the Treaty of Table Rock, which left them a small reservation beside the army’s Fort Lane. On 8 October 1855 volunteers under James Lupton attacked a Takelma camp at the mouth of Little Butte Creek and killed about two dozen people, most of them women, children and old men; in reply Takelma fighters killed about 27 settlers along the Rogue from Gold Hill to Galice Creek. On 31 October and 1 November 1855 some 200 Native fighters held off more than 300 soldiers and volunteers at Hungry Hill (Grave Creek Hills). On 22 February 1856 Tututni and other coastal peoples killed about 30 people near the mouth of the Rogue, among them the Indian agent Ben Wright, and besieged the survivors. At Big Bend on 27–28 May 1856, fighters under Tecumtum (Chief John) attacked Captain Andrew Jackson Smith’s company, which had come to receive their surrender, until another army force relieved it; within weeks most bands surrendered. About 1,400 people were removed to the new Coast Reservation (Siletz) and some 325 to 400 from Table Rock to the Grand Ronde Reservation, some marched overland and some taken by sea, and many died in the first years there.
: La guerre de 1855–1856 qui opposa, dans le sud-ouest de l’Oregon, l’armée des États-Unis, des volontaires de l’Oregon et des milices de mineurs aux peuples de la vallée de la Rogue River et de la côte (les Takelmas, les Takelmas des hautes terres ou Latgawas, les Shastas, les Tututnis et leurs voisins), que les sources américaines regroupaient sous le nom d’Indiens de la Rogue River. Les découvertes d’or près de Jacksonville à partir de 1851 amenèrent des milliers de mineurs et de colons sur leurs terres, détruisant les remontées de poissons, le gibier et les chênaies dont ils vivaient. Après des combats en 1853, dont la bataille d’Evans Creek, les chefs takelmas Apserkahar (Joe), Toquahear (Sam) et Anachaharah (Jim) signèrent le traité de Table Rock, qui leur laissait une petite réserve à côté de Fort Lane, un poste de l’armée. Le 8 octobre 1855, des volontaires menés par James Lupton attaquèrent un camp takelma à l’embouchure de la Little Butte Creek et tuèrent environ deux douzaines de personnes, pour la plupart des femmes, des enfants et des vieillards ; en représailles, des combattants takelmas tuèrent environ 27 colons le long de la Rogue, de Gold Hill à Galice Creek. Les 31 octobre et 1er novembre 1855, quelque 200 combattants autochtones tinrent tête à plus de 300 soldats et volontaires à Hungry Hill (Grave Creek Hills). Le 22 février 1856, des Tututnis et d’autres peuples de la côte tuèrent environ 30 personnes près de l’embouchure de la Rogue, parmi lesquelles l’agent des Affaires indiennes Ben Wright, et assiégèrent les survivants. À Big Bend, les 27 et 28 mai 1856, des combattants menés par Tecumtum (Chief John) attaquèrent la compagnie du capitaine Andrew Jackson Smith, venue recevoir leur reddition, jusqu’à ce qu’une autre troupe de l’armée la dégage ; en quelques semaines, la plupart des bandes se rendirent. Environ 1 400 personnes furent déplacées vers la nouvelle réserve de la Côte (Siletz) et quelque 325 à 400 personnes de Table Rock vers la réserve de Grand Ronde, les unes à pied par voie de terre, les autres par mer, et beaucoup moururent pendant les premières années.
