# French translations of the catalogue text (wave 8); step bodies follow later.
Rohilla War: Guerre des Rohilla
? A war in which Shuja-ud-Daula, Nawab of Awadh, with a brigade of East India Company troops, conquered Rohilkhand, the land east of the upper Ganges ruled by Afghan Rohilla chiefs. In 1772 the Rohilla regent Hafiz Rahmat Khan had promised Shuja 40 lakh rupees for help against a Maratha invasion; when the Marathas withdrew in 1773 the money was not paid. By the Treaty of Benares (September 1773) the Governor of Bengal, Warren Hastings, agreed to lend Company troops for the conquest in return for a subsidy. On 23 April 1774 the Company brigade under Colonel Alexander Champion defeated the Rohillas at Miranpur Katra, where Hafiz Rahmat Khan was killed. Awadh annexed Rohilkhand, and many Rohillas were driven across the Ganges or left the country. Faizullah Khan, holding out in the hills at Lal Dang, kept the small state of Rampur by the Treaty of Lal Dang of 7 October 1774. Reports of plunder and cruelty by Awadh’s troops made the war a charge against Hastings in his impeachment (1787–1795), at which he was acquitted.
: Une guerre au cours de laquelle Shuja-ud-Daula, nabab de l’Awadh, aidé d’une brigade de troupes de la Compagnie anglaise des Indes orientales, conquit le Rohilkhand, la région située à l’est du cours supérieur du Gange que gouvernaient des chefs afghans rohilla. En 1772, le régent rohilla Hafiz Rahmat Khan avait promis à Shuja 40 lakhs de roupies en échange de son aide contre une invasion marathe ; lorsque les Marathes se retirèrent en 1773, la somme ne fut pas versée. Par le traité de Bénarès (septembre 1773), le gouverneur du Bengale, Warren Hastings, accepta de prêter des troupes de la Compagnie pour la conquête en échange d’un subside. Le 23 avril 1774, la brigade de la Compagnie commandée par le colonel Alexander Champion vainquit les Rohilla à Miranpur Katra, où Hafiz Rahmat Khan fut tué. L’Awadh annexa le Rohilkhand, et de nombreux Rohilla furent chassés au-delà du Gange ou quittèrent le pays. Faizullah Khan, qui résistait dans les collines de Lal Dang, conserva le petit État de Rampur par le traité de Lal Dang du 7 octobre 1774. Les récits de pillages et de cruautés commis par les troupes de l’Awadh firent de cette guerre l’un des chefs d’accusation retenus contre Hastings lors de sa mise en accusation (1787–1795), au terme de laquelle il fut acquitté.
