# Some French text was translated automatically.
"Romanian Peasants’ Revolt of 1907": "Paysans roumains Révolte de 1907"
"A rising of Romanian peasants against the great landowners and the leaseholders (arendași) who sub-let their estates on harsh terms, which began in northern Moldavia in February 1907, at first directed largely against Jewish leaseholders, and in March spread south through Wallachia to Oltenia. The Liberal government of Dimitrie Sturdza mobilised 140,000 soldiers and crushed it by early April; the official count was about 420 dead, while a figure of some 10,000 peasants killed, widely accepted at the time, has never been proven.": "Une montée des paysans roumains contre les grands propriétaires fonciers et les baux (arendași) qui sous-louent leurs propriétés à des conditions difficiles, qui ont commencé dans le nord de la Moldavie en février 1907, d’abord dirigé largement contre les baux juifs, et en mars s’est étendue au sud par Wallachie à Oltenia. Le gouvernement libéral de Dimitrie Sturdza a mobilisé 140 000 soldats et l’a écrasé au début d’avril ; le décompte officiel était d’environ 420 morts, alors qu’un chiffre de quelque 10 000 paysans tués, largement accepté à l’époque, n’a jamais été prouvé."
"Romania still used the Julian calendar in 1907; Romanian accounts date the start of the revolt, at Flămânzești, to 8 February. The dates here are New Style.": "La Roumanie utilise toujours le calendrier julien en 1907 ; les comptes roumains datent le début de la révolte, à Flămânzești, au 8 février. Les dates ici sont New Style."
"Land reform followed only after the First World War.": "La réforme agraire n’a suivi qu’après la Première Guerre mondiale."
