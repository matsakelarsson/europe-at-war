"Timișoara": "Timișoara"
"16–20 December 1989": "16–20 décembre 1989"
"By 1989 Romanians lived with food and fuel rationing, imposed by Ceaușescu to pay off the foreign debt, and under close watch by the Securitate, the secret police, while communist rule was collapsing elsewhere in Eastern Europe. In Timișoara, members of the Hungarian Reformed congregation gathered to stop the authorities evicting their pastor, László Tőkés, a critic of the regime. On 16 December the crowd grew, Romanians joined the Hungarians, and the protest turned into a march against Ceaușescu.": "En 1989, les Roumains vivaient avec le rationnement de la nourriture et du carburant, imposé par Ceaușescu pour rembourser la dette extérieure, et sous une étroite surveillance par le Securitate, la police secrète, tandis que le régime communiste s’effondre ailleurs en Europe orientale. À Timișoara, des membres de la congrégation réformée hongroise se sont réunis pour empêcher les autorités d’expulser leur pasteur, László Tőkés, un critique du régime. Le 16 décembre, la foule grandit, les Roumains rejoignent les Hongrois et la manifestation se transforme en marche contre Ceaușescu."
"On 17 December the army, the Securitate and the militia opened fire on the crowds in the city centre, killing dozens of people. The bodies of more than 40 victims were secretly taken to Bucharest and cremated to hide what had happened. Ceaușescu left for a visit to Iran the next day. In Timișoara the workers went on strike, and on 20 December some 100,000 people filled Opera Square, the army withdrew to its barracks, and protesters declared the first city free of communist rule.": "Le 17 décembre, l’armée, le Securitate et la milice ont ouvert le feu sur les foules du centre-ville, tuant des dizaines de personnes. Les corps de plus de 40 victimes ont été emmenés secrètement à Bucarest et incinérés pour cacher ce qui s’était passé. À Timișoara, les travailleurs ont fait grève et, le 20 décembre, quelque 100 000 personnes ont rempli la place de l’Opéra, l’armée s’est retirée dans ses casernes et les manifestants ont déclaré la première ville libre du régime communiste."
