"21–27 December 1989": "21–27 décembre 1989"
"Back from Iran, Ceaușescu called a mass rally outside the party’s Central Committee building in Bucharest on 21 December. Minutes into his speech, broadcast live, the crowd began to boo and jeer, and he stopped, visibly stunned. That evening protesters in University Square were shot down by security forces and the army. On the morning of 22 December the defence minister, Vasile Milea, was found shot, officially a suicide, and the army went over to the crowds, which stormed the building. Nicolae and Elena Ceaușescu fled from its roof by helicopter.": "De retour d’Iran, Ceaușescu a appelé un rassemblement de masse à l’extérieur du bâtiment du comité central du parti à Bucarest le 21 décembre. Minutes dans son discours, diffusé en direct, la foule a commencé à huer et jeer, et il s’est arrêté, visiblement stupéfait. Dans la matinée du 22 décembre, le ministre de la Défense, Vasile Milea, a été trouvé abattu, officiellement un suicide, et l’armée est passée aux foules, qui ont pris l’assaut du bâtiment. Nicolae et Elena Ceaușescu ont fui son toit par hélicoptère."
"A group of former party officials led by Ion Iliescu appeared on television as the National Salvation Front and took power. For several days shooting went on in Bucharest, Sibiu and other cities, blamed on Securitate “terrorists”, and soldiers, militia and armed civilians often fired on each other; most of the 1,104 dead were killed in these days. The Ceaușescus were caught near Târgoviște, tried there by a military tribunal on 25 December and shot immediately. The shooting stopped on 27 December.": "Un groupe d’anciens responsables du parti dirigé par Ion Iliescu est apparu à la télévision sous le nom de Front national du salut et a pris le pouvoir. Pendant plusieurs jours, des tirs se sont poursuivis à Bucarest, Sibiu et dans d’autres villes, blâmés contre les terroristes de Securitate, et des soldats, des milices et des civils armés ont souvent tiré l’un sur l’autre ; la plupart des 1 104 morts ont été tués ces jours-ci. Les Ceaușescu ont été arrêtés près de Târgoviște, jugés par un tribunal militaire le 25 décembre et abattus immédiatement. La fusillade s’est arrêtée le 27 décembre."
