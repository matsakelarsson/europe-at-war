# Some French text was translated automatically.
"Romanian Revolution": "Révolution roumaine"
"The violent overthrow of Nicolae Ceaușescu’s communist dictatorship in December 1989, after protests that began in Timișoara on 16 December spread to Bucharest, where the army turned against the regime on 22 December. Ceaușescu and his wife Elena fled, were captured, tried by a military tribunal and shot on 25 December; most of the 1,104 people killed died in confused fighting after the National Salvation Front had taken power.": "Le renversement violent de la dictature communiste de Nicolae Ceaușescu en décembre 1989, après des manifestations qui ont commencé à Timișoara le 16 décembre, s’est étendu à Bucarest, où l’armée s’est tournée contre le régime le 22 décembre. Ceaușescu et son épouse Elena ont fui, ont été capturés, jugés par un tribunal militaire et abattus le 25 décembre ; la plupart des 1 104 personnes tuées sont mortes dans des combats confus après que le Front national du salut eut pris le pouvoir."
"Who fired on the crowds and the army after 22 December, the so-called terrorists, has never been fully established. Many deaths were caused by soldiers, militiamen and armed civilians firing on each other in confusion, and whether the revolution was a popular uprising or was taken over by a group within the party and army is still debated in Romania. Ion Iliescu and others were indicted in 2019 for crimes against humanity over the events after 22 December.": "Après le 22 décembre, les soi-disant terroristes, qui ont tiré sur la foule et l’armée, n’ont jamais été pleinement établis. De nombreux morts ont été causés par des soldats, des miliciens et des civils armés tirant l’un sur l’autre dans la confusion, et la question de savoir si la révolution était un soulèvement populaire ou a été reprise par un groupe au sein du parti et de l’armée est toujours débattue en Roumanie."
"Official figures give 1,104 dead, 162 of them in the protests up to 22 December and 942 afterwards, and some 3,350 wounded.": "Les chiffres officiels donnent 1 104 morts, 162 d’entre eux dans les manifestations jusqu’au 22 décembre et 942 par la suite, et quelque 3 350 blessés."
