"1547–1551": "1547–1551"
"Henry VIII died in January 1547, and Hertford, now Duke of Somerset and Protector for the nine-year-old Edward VI, invaded Scotland that September with about 16,000 men and a fleet. On 10 September he met the larger Scottish army of the regent, the Earl of Arran, at Pinkie near Musselburgh. The Scots crossed the Esk to attack, came under fire from the English ships and guns, and broke under cavalry charges; thousands were killed in the pursuit, and the Scots remembered the day as Black Saturday. Somerset did not march on Stirling, where Mary was kept, but planted garrisons, at Haddington, Broughty Castle on the Tay, Lauder and elsewhere, to hold the Lowlands down.": "Henry VIII mourut en janvier 1547, et Hertford, maintenant duc de Somerset et protecteur pour le jeune Edward VI de neuf ans, envahit l’Écosse en septembre avec environ 16 000 hommes et une flotte. Le 10 septembre, il rencontra la plus grande armée écossaise du régent, le comte d’Arran, à Pinkie près de Musselburgh. Les Écossais traversèrent l’Esk pour attaquer, furent incendiés par les navires et les canons anglais, et rompirent sous des charges de cavalerie ; des milliers furent tués dans la poursuite, et les Écossais se souvinrent du jour comme le samedi noir. Somerset ne marcha pas sur Stirling, où Mary était gardée, mais planta des garnisons, à Haddington, au château Broughty sur le Tay, Lauder et ailleurs, pour tenir les Lowlands vers le bas."
"The Scots turned to France. A French army landed at Leith in June 1548, and on 7 July, by the Treaty of Haddington, signed in the camp besieging the English-held town, the Scots agreed that Mary would marry the Dauphin Francis. She sailed from Dumbarton in August and grew up at the French court. Short of supplies and wasted by disease, the English abandoned Haddington in September 1549. Henry II of France attacked Boulogne, and by the Treaty of Boulogne in March 1550 England returned it to France and withdrew from Scotland; the Treaty of Norham restored the border in 1551. The war had driven Scotland towards France, not England.": "Les Écossais se tournèrent vers la France. Une armée française débarqua à Leith en juin 1548, et le 7 juillet, par le traité de Haddington, signé dans le camp assiégeant la ville anglaise, les Écossais acceptèrent que Marie épouserait le Dauphin François. En septembre 1549, les Anglais abandonnèrent Haddington. Henri II de France attaqua Boulogne et, par le traité de Boulogne en mars 1550, l’Angleterre retourna en France et se retira d’Écosse ; le traité de Norham rétablit la frontière en 1551. La guerre avait conduit l’Ecosse vers la France, pas vers l’Angleterre."
