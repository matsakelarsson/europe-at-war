# Some French text was translated automatically.
"Rough Wooing": "Guerre du Rough Wooing"
"The war in which Henry VIII and then the Duke of Somerset tried to force Scotland to marry its infant queen, Mary, to the English heir, Edward, and break Scotland’s alliance with France. English armies burned Edinburgh in 1544 and won at Pinkie in 1547, but the Scots called in the French, sent Mary to France to marry the Dauphin, and wore down the English garrisons until England withdrew in 1550.": "La guerre dans laquelle Henry VIII puis le duc de Somerset essayèrent d’obliger l’Écosse à épouser sa petite reine, Mary, à l’héritier anglais, Edward, et à rompre l’alliance d’Ecosse avec la France. Les armées anglaises brûlèrent Edimbourg en 1544 et remportèrent à Pinkie en 1547, mais les Écossais appelèrent les Français, envoyèrent Marie en France pour épouser le Dauphin, et portèrent les garnisons anglaises jusqu’à ce que l’Angleterre se retire en 1550."
"Also called the Eight Years’ War. The name “Rough Wooing” is usually traced to a remark attributed to the Earl of Huntly, who is said to have disliked not the marriage but the manner of the wooing.": "Aussi appelé la guerre de huit ans. Le nom -Rough Wooing est généralement tracé à une remarque attribuée au comte de Huntly, qui est dit d’avoir n’aimaient pas le mariage mais la manière de la wooing."
"Dates are Julian (Old Style), as used in both countries at the time. Some Scots, especially Protestants, sided with England, and some English borderers changed sides as raiding offered.": "Les dates sont Julian (Old Style), tel qu’utilisé dans les deux pays à l’époque. Certains Écossais, en particulier protestants, ont pris parti pour l’Angleterre, et certains frontaliers anglais ont changé de camp comme des raids offerts."
