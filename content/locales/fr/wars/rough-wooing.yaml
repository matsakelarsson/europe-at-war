"1542–1547": "1542–1547"
"James V of Scotland died in December 1542, weeks after his army was routed by an English force at Solway Moss, leaving a daughter a few days old, Mary, as queen. Henry VIII wanted her as a bride for his son Edward, and in July 1543 the Treaty of Greenwich promised the marriage. But the party around Cardinal David Beaton, which favoured France and the old Church, gained the upper hand, and in December the Scottish Parliament rejected the treaty and renewed the alliance with France. Henry answered with force. In May 1544 an English army under the Earl of Hertford landed at Leith, sacked the port and burned Edinburgh.": "James V d’Écosse est décédé en décembre 1542, des semaines après que son armée fut dirigée par une force anglaise à Solway Moss, laissant une fille de quelques jours, Mary, comme reine. Henry VIII voulait qu’elle soit mariée pour son fils Edward, et en juillet 1543 le traité de Greenwich promettait le mariage. Mais le parti autour du cardinal David Beaton, qui favorisait la France et l’ancienne Église, a gagné le dessus, et en décembre le Parlement écossais a rejeté le traité et renouvelé l’alliance avec la France. Henry a répondu avec force. En mai 1544 une armée anglaise sous le comte d’Hertford atterrit à Leith, saccage le port et brûlé Edimbourg."
"Raids across the border went on through the year, while Henry himself took Boulogne. On 27 February 1545 a Scottish army under the Earl of Angus routed an English raiding force at Ancrum Moor, and its commander, Sir Ralph Eure, was killed. That September Hertford came back and laid waste to the Borders, burning abbeys, towns and villages. In May 1546 Protestant conspirators murdered Cardinal Beaton in St Andrews Castle and held it, hoping for English help, until a French fleet forced its surrender in July 1547. Among the prisoners sent to the French galleys was the preacher John Knox.": "Le 27 février 1545, une armée écossaise dirigée par le comte d’Angus dirigea une force de raid anglaise à Ancrum Moor, et son commandant, sir Ralph Eure, fut tué. Hertford revint en septembre et mit en ruines les Frontières, incendiant des abbayes, des villes et des villages. En mai 1546, des conspirateurs protestants tuèrent le cardinal Beaton dans le château de St Andrews et le conservèrent, en espérant l’aide anglaise, jusqu’à ce qu’une flotte française force sa reddition en juillet 1547. Parmi les prisonniers envoyés aux galères françaises se trouvait le prédicateur John Knox."
