# Some French text was translated automatically.
"Rus’–Byzantine War of 1043": "Rus-Byzantine Guerre de 1043"
"The last Rus’ attack on Constantinople, sent by Yaroslav the Wise of Kiev under his eldest son, Vladimir of Novgorod, after a quarrel in the city in which, according to one account, a Rus’ merchant was killed. The Emperor Constantine IX’s fleet met the Rus’ boats at the entrance to the Bosporus and destroyed many with Greek fire, and a storm wrecked more. Some 6,000 men who were cast ashore and tried to march home under Vyshata were caught near Varna, and 800 of them were blinded. Peace was restored about 1046 and sealed by the marriage of Yaroslav’s son Vsevolod to a Byzantine princess of Constantine IX’s family; their son was Vladimir Monomakh.": "La dernière attaque de Rus sur Constantinople, envoyée par Yaroslav le Sage de Kiev sous son fils aîné, Vladimir de Novgorod, après une querelle dans la ville où, selon un récit, un marchand de Rus a été tué. La flotte de l’Empereur Constantin IX de rencontrer les bateaux de Rus à l’entrée du Bospore et détruit beaucoup avec le feu grec, et une tempête a plus ravagé. Quelque 6 000 hommes qui furent jetés à terre et essayèrent de rentrer chez eux sous Vyshata furent capturés près de Varna, et 800 d’entre eux furent aveuglés. La paix fut rétablie vers 1046 et scellée par le mariage de Vsevolod, fils de Yaroslav, avec une princesse byzantine de Constantin IX ; leur fils était Vladimir Monomakh."
"Michael Psellos, who watched the sea battle with the emperor, credits the Byzantine fleet; the Rus’ chronicles blame a storm. The causes of the war are disputed, and some historians link it to a Rus’ attack on Cherson in Crimea the following year.": "Michael Psellos, qui a regardé la bataille de mer avec l’empereur, crédite la flotte byzantine ; les chroniques Rus. Les causes de la guerre sont contestées, et certains historiens le relient à une attaque Rus sur Cherson en Crimée l’année suivante."
