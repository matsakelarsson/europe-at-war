"941–944": "941–944"
"In 941 Igor, prince of Kiev, sent a great fleet of boats down the Dnieper and across the Black Sea. The Bulgarians sent warning, but the Byzantine navy was away fighting the Arabs and the army was on the eastern frontier. The Emperor Romanos I had fifteen old warships fitted with tubes for Greek fire and sent them out under the protovestiarios Theophanes. On 11 June, near Hieron at the mouth of the Bosporus, the Rus’ surrounded the ships to capture them and were met with fire. Liudprand of Cremona writes that men leapt into the sea to escape the flames and sank under their armour.": "En 941 Igor, prince de Kiev, a envoyé une grande flotte de bateaux en bas du Dniepr et à travers la mer Noire. Les Bulgares ont envoyé des avertissements, mais la marine byzantine était loin combattre les Arabes et l’armée était sur la frontière orientale. L’empereur Romanos I avait quinze vieux navires de guerre équipés de tubes pour le feu grec et les a envoyés sous les protovestiarios Théophanes. Le 11 juin, près de Hieron à l’embouchure du Bospore, le Rus a entouré les navires pour les capturer et ont été rencontré avec le feu. Liudprand de Cremona écrit que les hommes sautent dans la mer pour échapper aux flammes et coulé sous leurs armures."
"The survivors landed on the Asian shore and for months plundered Bithynia and Paphlagonia as far as Nicomedia; the chroniclers describe captives crucified and nailed to the ground. Bardas Phokas and then John Kourkouas, recalled with the army of the east, hemmed them in. In September, as the Rus’ tried to slip home, Theophanes’ fleet caught them off the Thracian coast and burned most of their boats; prisoners were beheaded in Constantinople. In 944 Igor came again with Rus’ and Pecheneg allies, but Romanos sent envoys with gifts to meet him on the Danube. In the treaty that followed, Rus’ merchants were let back into Constantinople, but on stricter terms than before.": "Les survivants débarquèrent sur la côte asiatique et pillèrent pendant des mois Bithynia et Paphlagonia jusqu’à Nicomedia ; les chroniqueurs décrivent des captifs crucifiés et cloués au sol. Bardas Phokas, puis John Kourkouas, rappelé avec l’armée de l’est, les entassent. En septembre, alors que les Rus ont essayé de rentrer chez eux, la flotte des Theophanes les a pris au large de la côte thrace et brûlé la plupart de leurs bateaux ; des prisonniers ont été décapités à Constantinople. En 944 Igor est revenu avec Rus et les alliés de Pecheneg, mais Romanos a envoyé des envoyés avec des cadeaux pour le rencontrer sur le Danube. Dans le traité qui suivit, les marchands de Rus ont été remis à Constantinople, mais à des conditions plus strictes qu’auparavant."
