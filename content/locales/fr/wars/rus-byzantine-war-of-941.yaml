# Some French text was translated automatically.
"Rus’–Byzantine War of 941": "Rus-Byzantine Guerre de 941"
"A raid on Constantinople by the fleet of Prince Igor of Kiev, which was burned with Greek fire at the mouth of the Bosporus in June 941. The survivors plundered the Asian coast for months before their last boats were destroyed off Thrace. A second expedition in 944 was bought off, and a treaty restored trade between Kiev and the empire on stricter terms.": "Un raid sur Constantinople par la flotte du prince Igor de Kiev, qui a été brûlé avec le feu grec à l’embouchure du Bospore en juin 941. Les survivants ont pillé la côte asiatique pendant des mois avant que leurs derniers bateaux ne soient détruits au large de Thrace. Une seconde expédition en 944 a été rachetée, et un traité restauré commerce entre Kiev et l’empire à des conditions plus strictes."
"The main accounts are the Byzantine chronicle of Theophanes Continuatus, Liudprand of Cremona, whose stepfather saw the Rus’ prisoners executed in Constantinople, and the Rus’ Primary Chronicle, compiled about 1113, which preserves the text of the treaty. Their figures for the Rus’ fleet, from about 1,000 ships (Liudprand) to 10,000, are far too high to trust.": "Les principaux récits sont la chronique byzantine de Theophanes Continuatus, Liudprand de Cremona, dont le beau-père a vu les prisonniers Rus , exécuté à Constantinople, et la Chronique primaire Rus , compilée vers 1113, qui préserve le texte du traité. Leurs chiffres pour la flotte Rus , d’environ 1000 bateaux (Liudprand) à 10 000 , sont beaucoup trop élevés pour faire confiance."
"The treaty is dated 944 or 945. Hieron was a customs post at the Black Sea entrance of the Bosporus, near today’s Anadolu Kavağı.": "Le traité est daté de 944 ou 945. Hieron était un poste de douane à l’entrée de la mer Noire du Bospore, près d’aujourd'hui."
