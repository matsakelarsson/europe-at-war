# Some French text was translated automatically.
"Rus’ siege of Constantinople (860)": "Le siège de Constantinople (860)"
"The first recorded attack by the Rus’ on the Byzantine Empire. On 18 June 860, while the Emperor Michael III and the army were away fighting the Arabs in Asia Minor and the fleet was in the Mediterranean, a fleet of about 200 Rus’ ships sailed down the Bosporus and plundered the suburbs of Constantinople and the Princes’ Islands, killing many of the people they caught. They withdrew some weeks later; in a sermon of early August Patriarch Photios gave thanks for the city’s deliverance. Later tradition credited a miracle of the Virgin’s robe, and the Byzantines soon sent missionaries to the Rus’.": "Le 18 juin 860, alors que l’empereur Michael III et l’armée combattaient les Arabes en Asie Mineure et que la flotte se trouvait en Méditerranée, une flotte d’environ 200 navires Rus a navigué dans le Bospore et pillé les banlieues de Constantinople et des îles Princes, tuant beaucoup des personnes qu’ils ont prises. Ils se retiraient quelques semaines plus tard ; dans un sermon du patriarche Photios au début d’août, ils rendirent grâces pour la délivrance de la ville."
"The best evidence is two sermons by Patriarch Photios, who witnessed the attack, and a short Byzantine chronicle that gives the date. The Rus’ Primary Chronicle, compiled about 1113, dates the raid to 866 and names Askold and Dir of Kiev as its leaders; where the raiders came from is disputed. The story of the storm raised by the robe of the Virgin appears only in later writers.": "La meilleure preuve est deux sermons du patriarche Photios, qui a été témoin de l’attaque, et une courte chronique byzantine qui donne la date. La Chronique primaire de Rus, compilée vers 1113, date le raid à 866 et nomme Askold et Dir de Kiev comme ses dirigeants ; d’où les raideurs sont venus est contestée. L’histoire de la tempête soulevée par la robe de la Vierge apparaît seulement dans des écrivains plus tard."
