Russian–Chukchi wars: Guerres russo-tchouktches
The long and, for Russia, unsuccessful attempt to bring the Chukchi of the far north-east of Siberia under fur tribute (yasak). From the fort of Anadyrsk, founded on the Anadyr river in the 1650s, Cossack expeditions against the Chukchi began in 1701. In 1730 the Chukchi killed Afanasy Shestakov, commander of a new expedition, near the mouth of the Penzhina, and his successor Dmitry Pavlutsky led punitive campaigns in 1731 and 1744–1747 that burned camps, took reindeer and captives and killed many, but never forced the Chukchi to submit. Pavlutsky himself was killed in battle near Anadyrsk in March 1747. Judging the war too costly, Catherine II’s government ordered Anadyrsk abandoned in 1764; it was burned and evacuated in 1771. At Gizhiga in 1778 Chukchi leaders agreed to become Russian subjects on their own terms, and the empress freed them from tribute. Trade at fairs on the Kolyma and the Anyui replaced war, and Russian rule over the Chukchi remained largely nominal until the Soviet period.: La longue tentative, infructueuse pour la Russie, de soumettre au tribut en fourrures (iassak) les Tchouktches de l’extrême nord-est de la Sibérie. Les expéditions cosaques contre les Tchouktches commencèrent en 1701 à partir du fort d’Anadyrsk, fondé sur l’Anadyr dans les années 1650. En 1730, les Tchouktches tuèrent Afanassi Chestakov, commandant d’une nouvelle expédition, près de l’embouchure de la Penjina, et son successeur Dmitri Pavloutski mena en 1731 et en 1744–1747 des campagnes punitives qui incendièrent des campements, s’emparèrent de rennes et de captifs et firent de nombreux morts, sans jamais contraindre les Tchouktches à se soumettre. Pavloutski lui-même fut tué au combat près d’Anadyrsk en mars 1747. Jugeant la guerre trop coûteuse, le gouvernement de Catherine II ordonna l’abandon d’Anadyrsk en 1764 ; le fort fut incendié et évacué en 1771. À Guijiga, en 1778, des chefs tchouktches acceptèrent de devenir sujets russes à leurs propres conditions, et l’impératrice les exempta du tribut. Le commerce lors des foires de la Kolyma et de l’Anioui remplaça la guerre, et la domination russe sur les Tchouktches resta largement nominale jusqu’à l’époque soviétique.
