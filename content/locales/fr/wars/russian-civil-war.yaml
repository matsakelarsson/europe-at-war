"The Red Terror and the intervention": "La terreur rouge et l’intervention"
"1918–1919": "1918–1919"
"On 30 August 1918 a young officer cadet shot Moisei Uritsky, head of the Petrograd Cheka, and the same day Lenin was badly wounded by shots blamed on the Socialist Revolutionary Fanny Kaplan. On 5 September the government decreed a Red Terror. The Cheka, the political police under Felix Dzerzhinsky, shot hostages and “class enemies” and set up concentration camps; 10,000–15,000 people were executed in the first two months alone, and estimates for the whole war run from about 50,000 to 200,000 or more. White forces also shot prisoners and suspected Bolsheviks, and in Ukraine soldiers of several armies, most often Ukrainian nationalist troops, murdered tens of thousands of Jews in pogroms.": "Le 30 août 1918, un jeune officier cadet a tiré sur Moisei Uritsky, chef du Cheka de Petrograd, et le même jour Lénine a été gravement blessé par des coups de feu imputés à la Fanny Kaplan révolutionnaire socialiste. La Cheka, la police politique sous Félix Dzerjinsky, a tiré sur des otages et des ennemis de classe et mis en place des camps de concentration ; 10 000 à 15 000 personnes ont été exécutées au cours des deux premiers mois seulement, et les estimations pour toute la guerre vont d’environ 50 000 à 200 000 personnes ou plus. Les forces blanches ont également abattu des prisonniers et soupçonné des bolcheviks, et en Ukraine des soldats de plusieurs armées, le plus souvent des troupes nationalistes ukrainiennes, ont assassiné des dizaines de milliers de Juifs dans des pogroms."
"The Allies first landed to keep war supplies from the Germans and to revive the Eastern Front, and after Germany’s defeat they stayed to help the Whites. British marines landed at Murmansk in March 1918, and British, French and American troops at Arkhangelsk in August. Japanese and American troops occupied Vladivostok, the Japanese eventually with some 70,000 men, and French and Greek troops held Odessa from December 1918 to April 1919. The Allies sent the Whites large stocks of weapons, but their own soldiers fought only in a few places, mainly in the north. Most had left by the end of 1919; the Japanese stayed in the Far East until 1922.": "Les Alliés débarquent d’abord pour garder les provisions de guerre des Allemands et pour relancer le front est, et après la défaite de l’Allemagne, ils restent pour aider les Blancs. Marines britanniques atterrissent à Murmansk en mars 1918, et troupes britanniques, françaises et américaines à Arkhangelsk en août. Les troupes japonaises et américaines occupaient Vladivostok, les Japonais avec quelque 70 000 hommes, et les troupes françaises et grecques détenaient Odessa de décembre 1918 à avril 1919. Les Alliés envoyaient aux Blancs de gros stocks d’armes, mais leurs propres soldats ne combattaient que dans quelques endroits, principalement au nord. La plupart étaient partis à la fin de 1919 ; les Japonais restaient en Extrême-Orient jusqu’en 1922."
