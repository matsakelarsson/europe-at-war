"1920: Wrangel and the Crimea": "1920 : Wrangel et la Crimée"
"March – November 1920": "mars – novembre 1920"
"Denikin’s armies fell back to the Black Sea in the winter of 1919–1920, and in late March tens of thousands of troops and refugees were shipped from Novorossiysk to the Crimea in chaos, leaving thousands behind. Denikin resigned, and Wrangel took command of what was left. While the Red Army was fighting Poland, Wrangel broke out of the Crimea in June 1920 into Northern Taurida, the grain lands north of the peninsula, and promised land to the peasants. The Reds held a bridgehead across the Dnieper at Kakhovka, where the fighting came close to the trench battles of the World War.": "Les armées de Denikin sont retournées à la mer Noire à l’hiver 1919-1920, et à la fin mars des dizaines de milliers de troupes et de réfugiés ont été expédiés de Novorossiysk à la Crimée dans le chaos, laissant des milliers de derrière. Pendant que l’Armée rouge combattait la Pologne, Wrangel est sorti de la Crimée en juin 1920 dans le nord de Taurida, les terres céréalières au nord de la péninsule, et a promis la terre aux paysans. Les rouges ont tenu une tête de pont en face du Dniepr à Kakhovka, où les combats sont arrivés près des batailles de tranchées de la guerre mondiale."
"After the armistice with Poland in October, Frunze’s Southern Front, with Makhno’s insurgents as temporary allies, attacked the Crimea. On the night of 7–8 November Red troops crossed the shallow Sivash lagoon in freezing wind to outflank the fortified Perekop isthmus, and by 11 November the White lines had broken. Wrangel had prepared an evacuation, and between 13 and 16 November about 146,000 soldiers and civilians left the Crimean ports on 126 ships for Constantinople. In the months that followed, the Cheka shot former White soldiers and civilians in the Crimea; estimates of the dead run from about 12,000 to more than 50,000.": "Après l’armistice avec la Pologne en octobre, le Front Sud de Frunze, avec les insurgés de Makhno, comme alliés temporaires, attaqua la Crimée. Dans la nuit du 7 au 8 novembre, les troupes rouges traversèrent la lagune peu profonde de Sivash sous un vent glacial pour déjouer l’isthme fortifié de Perekop et, le 11 novembre, les lignes blanches s’étaient brisées. Wrangel avait préparé une évacuation et, entre le 13 et le 16 novembre, environ 146 000 soldats et civils avaient quitté les ports de Crimée sur 126 navires pour Constantinople. Au cours des mois qui ont suivi, la Cheka a tiré sur d’anciens soldats et civils blancs en Crimée ; on estime que les morts sont passés d’environ 12 000 à plus de 50 000."
