"The end: Kronstadt, the famine and the USSR": "La fin : Kronstadt, la famine et l’URSS"
"1921–1922": "1921–1922"
"With the Whites beaten, the Bolsheviks faced revolt from their own supporters. Peasants rose against grain requisitioning, most widely in Tambov province under Alexander Antonov, where the Red Army under Mikhail Tukhachevsky crushed them in 1921 with mass hostage-taking and poison gas. In March 1921 the sailors of Kronstadt, once heroes of the revolution, demanded free elections and soviets without Bolshevik control. After failed first assaults, Red troops crossed the ice of the Gulf of Finland and took the fortress on 18 March. Thousands of rebels were shot or imprisoned, and about 8,000 escaped across the ice to Finland.": "Avec les Blancs battus, les bolcheviks affrontèrent la révolte de leurs propres partisans. Les paysans s’élevaient contre la réquisition des céréales, le plus largement dans la province de Tambov sous Alexander Antonov, où l’armée rouge sous Mikhail Tukhachevsky les a écrasés en 1921 avec prise massive d’otages et gaz empoisonné. Après avoir échoué les premiers assauts, les troupes rouges ont traversé la glace du golfe de Finlande et pris la forteresse le 18 mars. Des milliers de rebelles ont été abattus ou emprisonnés, et environ 8 000 se sont échappés à travers la glace vers la Finlande."
"The same month Lenin replaced requisitioning with a tax in kind, the start of the New Economic Policy. Drought and years of seizures brought a famine to the Volga region and southern Ukraine in 1921–1922 that killed about five million people, despite food aid from the American Relief Administration and others. In the Far East the Japanese left Vladivostok in October 1922. On 30 December 1922 Soviet Russia, Ukraine, Belarus and the Transcaucasian republic formed the Union of Soviet Socialist Republics. With terror, hunger and epidemics, the war had cost an estimated 7–12 million lives, and one to two million people had left the country.": "Le même mois Lénine a remplacé la réquisition par une taxe en nature, le début de la nouvelle politique économique. La sécheresse et les années de saisies ont apporté une famine dans la région de Volga et le sud de l’Ukraine en 1921-1922 qui a tué environ cinq millions de personnes, malgré l’aide alimentaire de l’administration américaine de secours et d’autres. Le 30 décembre 1922, la Russie soviétique, l’Ukraine, le Bélarus et la République transcaucasienne formèrent l’Union des républiques socialistes soviétiques. Avec la terreur, la faim et les épidémies, la guerre avait coûté environ 7 à 12 millions de vies, et un ou deux millions de personnes avaient quitté le pays."
