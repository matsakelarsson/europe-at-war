"May – November 1918": "mai – novembre 1918"
"About 40,000 Czech and Slovak soldiers, most of them former Austro-Hungarian prisoners of war, were travelling east along the Trans-Siberian Railway to sail from Vladivostok to the Western Front. After a brawl at Chelyabinsk in May 1918, Leon Trotsky, the commissar for war, ordered them disarmed, and the Legion rose instead, seizing the railway towns from the Volga to the Pacific. Behind its lines anti-Bolshevik governments formed, among them the Socialist Revolutionaries’ Komuch at Samara. In early August Czechoslovak and Komuch troops took Kazan, with much of the imperial gold reserve.": "Environ 40 000 soldats tchèques et slovaques, dont la plupart étaient d’anciens prisonniers de guerre austro-hongrois, se rendaient à l’est le long du chemin de fer transsibérien pour naviguer de Vladivostok jusqu’au front occidental. Après une bagarre à Tcheliabinsk en mai 1918, Léon Trotsky, commissaire à la guerre, leur ordonna de les désarmer, et la Légion s’éleva pour saisir les villes ferroviaires de la Volga au Pacifique. Derrière ses lignes se formèrent des gouvernements anti-bolcheviks, parmi lesquels les révolutionnaires socialistes : Komuch à Samara. Début août, les troupes tchécoslovaques et Komuch prirent Kazan, avec une grande partie de la réserve d’or impériale."
"As the Legion neared Yekaterinburg, local Bolsheviks shot the former tsar Nicholas II, his wife, their five children and four servants in the cellar of the Ipatiev House on the night of 16–17 July. Trotsky rebuilt the Red Army with conscripts and former tsarist officers watched by political commissars, and it retook Kazan on 10 September and Samara in October. In the south the Volunteer Army lost Kornilov, killed outside Yekaterinodar in April, but took the city in August under Anton Denikin, while Don Cossacks besieged Tsaritsyn on the Volga. In November Admiral Alexander Kolchak seized power over the Whites in Siberia at Omsk.": "Alors que la Légion s’approchait d’Ekaterinbourg, les bolcheviks locaux tirèrent sur l’ancien tsar Nicolas II, sa femme, leurs cinq enfants et quatre serviteurs dans la cave de la Maison Ipatiev dans la nuit du 16 au 17 juillet. Trotsky rebâti l’Armée rouge avec des conscrits et d’anciens officiers tsaristes surveillés par des commissaires politiques, et il reprit Kazan le 10 septembre et Samara en octobre. Dans le sud, l’armée volontaire a perdu Kornilov, tué à l’extérieur d’Ekaterinodar en avril, mais a pris la ville en août sous Anton Denikin, tandis que Don Cosaques a assiégé Tsaritsyn sur la Volga. En novembre, l’amiral Alexander Kolchak s’est emparé du pouvoir sur les Blancs en Sibérie à Omsk."
