"March – November 1919": "mars – novembre 1919"
"In 1919 the Whites attacked from three sides. In March Kolchak’s armies advanced from Siberia across the Urals, took Ufa and came within reach of the Volga, but a Red counter-offensive under Mikhail Frunze retook Ufa on 9 June and Yekaterinburg and Chelyabinsk in July. In the south Denikin’s Armed Forces of South Russia, supplied by Britain, took Kharkiv and, under Pyotr Wrangel, Tsaritsyn at the end of June. On 3 July Denikin ordered an advance on Moscow. His armies took Kyiv, Kursk and Voronezh, and on 14 October entered Oryol, about 360 km from the capital.": "En 1919, les Blancs attaquèrent de trois côtés. En mars, les armées de Kolchak avançaient de la Sibérie à travers l’Oural, prirent Ufa et entrèrent à portée de la Volga, mais une contre-offensive rouge sous Mikhail Frunze reprit Ufa le 9 juin et Ekaterinburg et Tcheliabinsk en juillet. Dans le sud de Denikin, les forces armées de la Russie du Sud, fournies par la Grande-Bretagne, ont pris Kharkiv et, sous Pyotr Wrangel, Tsaritsyn à la fin juin. Le 3 juillet Denikin a commandé une avance sur Moscou. Ses armées ont pris Kyiv, Kursk et Voronezh, et le 14 octobre est entré Oryol, à environ 360 km de la capitale."
"In October Nikolai Yudenich’s Northwestern Army, based in Estonia, reached Gatchina and the Pulkovo Heights on the edge of Petrograd before Trotsky rallied the city’s defence and drove it back. In the south the Reds, who held the railway hub of central Russia and more men, counter-attacked. They retook Oryol on 20 October, and Semyon Budyonny’s cavalry took Voronezh on 24 October, while behind the White lines Nestor Makhno’s anarchist insurgents cut supply routes in Ukraine. Kolchak lost Omsk on 14 November; handed over at Irkutsk, he was shot by the Bolsheviks there on 7 February 1920.": "En octobre Nikolai Yudenich, l’armée du Nord-Ouest, basée en Estonie, a atteint Gatchina et les hauteurs Pulkovo sur le bord de Petrograd avant que Trotsky rallie la défense de la ville et la ramène. Dans le sud les rouges, qui tenait le centre ferroviaire de la Russie centrale et plus d’hommes, contre-attaque. Ils reprirent Oryol le 20 octobre, et Semyon Budyonny's cavalry prit Voronezh le 24 octobre, tandis que derrière les lignes blanches Nestor Makhno's les insurgés anarchistes coupèrent les routes d’approvisionnement en Ukraine. Kolchak perd Omsk le 14 novembre ; remis à Irkoutsk, il fut abattu par les bolcheviks là-bas le 7 février 1920."
