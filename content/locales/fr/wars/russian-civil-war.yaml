# Some French text was translated automatically.
"Russian Civil War": "Guerre civile russe"
"A war for control of the former Russian Empire after the Bolshevik seizure of power in November 1917, fought between the Red Army and the anti-Bolshevik Whites, with peasant armies, national movements and foreign troops drawn in. The Reds had won in European Russia by the end of 1920 and in the Far East by 1922; with terror, famine and epidemics the war cost an estimated 7–12 million lives, most of them civilians, and ended in the founding of the Soviet Union.": "Une guerre pour le contrôle de l’ancien Empire russe après la prise du pouvoir par les bolcheviks en novembre 1917, entre l’Armée rouge et les Blancs anti-bolcheviks, avec des armées paysannes, des mouvements nationaux et des troupes étrangères. Les rouges avaient gagné en Russie européenne à la fin de 1920 et en Extrême-Orient en 1922 ; avec la terreur, la famine et les épidémies, la guerre a coûté environ 7-12 millions de vies, dont la plupart sont des civils, et s’est terminée par la fondation de l’Union soviétique."
"Russia used the Julian (Old Style) calendar until 31 January 1918, which was followed by 14 February. The October Revolution of 25 October Old Style fell on 7 November New Style. Dates here are New Style.": "La Russie a utilisé le calendrier julien (ancien style) jusqu’au 31 janvier 1918, qui a été suivi par 14 février. La révolution d’octobre du 25 octobre Old Style est tombée le 7 novembre Nouveau style."
"The map shows European Russia and the Urals. The war in Siberia and the Far East, where Kolchak governed from Omsk and Japanese and American troops held Vladivostok, is described in the text.": "La carte montre la Russie européenne et l’Oural. La guerre en Sibérie et en Extrême-Orient, où Kolchak a gouverné d’Omsk et les troupes japonaises et américaines tenu Vladivostok, est décrite dans le texte."
"The base map does not follow the moving fronts. Front lines are approximate, drawn from general accounts.": "La carte de base ne suit pas les fronts en mouvement. Les lignes de front sont approximatives, tirées des comptes généraux."
"The Polish–Soviet War, the Finnish Civil War and the wars of independence of Estonia, Latvia and Lithuania have their own entries.": "La guerre polonais-soviétique, la guerre civile finlandaise et les guerres d’indépendance de l’Estonie, de Lettonie et de Lituanie ont leurs propres entrées."
