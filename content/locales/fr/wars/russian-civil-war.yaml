"October 1917 and Brest-Litovsk": "Octobre 1917 et Brest-Litovsk"
"November 1917 – March 1918": "novembre 1917 – mars 1918"
"On the night of 6–7 November 1917, 24–25 October in the Russian calendar of the time, the Bolsheviks’ Military Revolutionary Committee seized Petrograd’s bridges, stations and telegraph office, and then the Winter Palace, where the ministers of Alexander Kerensky’s Provisional Government were arrested. A Congress of Soviets approved a new government, the Council of People’s Commissars under Vladimir Lenin. In Moscow the Bolsheviks won only after a week of street fighting. Elections to a Constituent Assembly gave the Socialist Revolutionaries the most votes, and when the Assembly met in January 1918 the Bolsheviks dispersed it after a single day.": "Dans la nuit du 6 au 7 novembre 1917, du 24 au 25 octobre dans le calendrier russe de l’époque, le Comité révolutionnaire militaire bolchevik s’empare des ponts, stations et bureaux télégraphiques de Petrograd, puis du Palais d’hiver, où les ministres d’Alexandre Kerensky furent arrêtés. Un Congrès des Soviétiques approuva un nouveau gouvernement, le Conseil des commissaires populaires sous Vladimir Lénine. A Moscou, les bolcheviks n’ont gagné qu’après une semaine de combats de rue. Les élections à l’Assemblée constituante ont donné le plus de voix aux révolutionnaires socialistes, et lorsque l’Assemblée s’est réunie en janvier 1918, les bolcheviks l’ont dispersé après un seul jour."
"Lenin wanted peace with the Central Powers almost at any price. When talks at Brest-Litovsk stalled, German and Austro-Hungarian armies advanced from 18 February 1918 against little resistance, taking Minsk, Tallinn and Pskov and entering Kyiv on 1 March. In the treaty signed on 3 March, Soviet Russia gave up Poland, Lithuania and Courland, left Livonia and Estonia under German occupation, and recognised Finland and Ukraine, lands with about a third of the old empire’s population. The government moved to Moscow. On the Don, former tsarist generals were raising a Volunteer Army, which set out in February on its “Ice March” into the Kuban.": "Lorsque les pourparlers à Brest-Litovsk se sont arrêtés, les armées allemandes et austro-hongroise ont avancé à partir du 18 février 1918 contre peu de résistance, prenant Minsk, Tallinn et Pskov et entrant à Kiev le 1er mars. Dans le traité signé le 3 mars, la Russie soviétique abandonna la Pologne, la Lituanie et Courlande, quitta la Livonie et l’Estonie sous occupation allemande, et reconnut la Finlande et l’Ukraine, avec environ un tiers de la population de l’ancien empire. Le gouvernement s’installa à Moscou. Sur le Don, d’anciens généraux tsaristes élevèrent une armée volontaire, qui partit en février sur sa Marche vers le Kuban."
