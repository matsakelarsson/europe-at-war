# French translations of the catalogue text (wave 7); step bodies follow later.
Russian conquest of Central Asia: Conquête russe de l’Asie centrale
The campaigns in which the Russian Empire, advancing south from the Kazakh steppe and east from the Caspian Sea, conquered the khanates of Kokand, Bukhara and Khiva and the Turkmen tribes between 1839 and 1885. After a failed winter march on Khiva in 1839–1840, Russia built a line of forts along the Syr Darya, took Tashkent from Kokand in 1865, defeated Bukhara in 1866–1868, made Bukhara and Khiva protectorates, annexed Kokand in 1876 and conquered the Turkmen after the storming of Geok Tepe in 1881. The clash with Afghan troops at Panjdeh in 1885 nearly led to war with Britain and set the frontier of Russian Turkestan with Afghanistan.: Les campagnes par lesquelles l’Empire russe, avançant vers le sud depuis la steppe kazakhe et vers l’est depuis la mer Caspienne, conquit entre 1839 et 1885 les khanats de Kokand, de Boukhara et de Khiva ainsi que les tribus turkmènes. Après l’échec d’une marche d’hiver sur Khiva en 1839–1840, la Russie bâtit une ligne de forts le long du Syr-Daria, prit Tachkent au Kokand en 1865, vainquit Boukhara en 1866–1868, fit de Boukhara et de Khiva des protectorats, annexa le Kokand en 1876 et soumit les Turkmènes après l’assaut de Geok Tepe en 1881. L’affrontement avec les troupes afghanes à Pandjeh en 1885 faillit déclencher une guerre avec la Grande-Bretagne et fixa la frontière entre le Turkestan russe et l’Afghanistan.
