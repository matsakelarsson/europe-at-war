# French translations of the catalogue text (wave 9); step bodies follow later.
Russian conquest of eastern Siberia: Conquête russe de la Sibérie orientale
The advance of Russian Cossacks and fur traders from the Ob to the Pacific in the 17th century, and the resistance of the peoples of eastern Siberia. Small parties of servicemen built forts (ostrogs) along the rivers, from Turukhansk (1607) and Yeniseysk (1619) to Krasnoyarsk (1628), Bratsk (1631), Yakutsk (1632), Okhotsk (1647) and Irkutsk (1661), and forced the Kets, Evenks, Yakuts (Sakha), Buryats, Yukaghirs and others to pay a tribute in furs (yasak), taking hostages to make sure it was paid. The Yakuts rose in 1634 and 1642, the Evens burned Okhotsk in 1653, the Buryats fought the Russians for decades and some of their clans fled to Mongolia, and on the upper Yenisei the Kyrgyz princes and the Dzungars, who claimed the same tribute, attacked Krasnoyarsk. Epidemics of smallpox killed far more people than the fighting. By the Treaty of Nerchinsk with the Qing in 1689, Russia kept the lands around Lake Baikal and east to the Pacific north of the Amur basin.: L’avancée des Cosaques et des marchands de fourrures russes de l’Ob jusqu’au Pacifique au XVIIe siècle, et la résistance des peuples de Sibérie orientale. De petits détachements d’hommes de service construisirent des forts (ostrogs) le long des fleuves, de Touroukhansk (1607) et Ienisseïsk (1619) à Krasnoïarsk (1628), Bratsk (1631), Iakoutsk (1632), Okhotsk (1647) et Irkoutsk (1661), et contraignirent les Kètes, les Evenks, les Iakoutes (Sakha), les Bouriates, les Youkaguirs et d’autres peuples à payer un tribut en fourrures (iassak), en prenant des otages pour en garantir le paiement. Les Iakoutes se soulevèrent en 1634 et en 1642, les Évènes incendièrent Okhotsk en 1653, les Bouriates combattirent les Russes pendant des décennies et certains de leurs clans s’enfuirent en Mongolie, tandis que sur le haut Ienisseï, les princes kirghiz et les Dzoungars, qui réclamaient le même tribut, attaquaient Krasnoïarsk. Les épidémies de variole firent bien plus de victimes que les combats. Par le traité de Nertchinsk, conclu avec les Qing en 1689, la Russie conserva les terres situées autour du lac Baïkal et, vers l’est, jusqu’au Pacifique, au nord du bassin de l’Amour.
