# French translations of the catalogue text (wave 9); step bodies follow later.
Russian invasion of Manchuria: Invasion russe de la Mandchourie
The Russian conquest of Manchuria during the Boxer Rebellion. When Boxers and Qing troops attacked the Chinese Eastern Railway, which Russia was building across Manchuria to Vladivostok and Port Arthur, and Qing guns at Aigun shelled Blagoveshchensk across the Amur in July 1900, Russia sent columns into Manchuria from the Amur, the Ussuri, Transbaikalia and the Liaodong peninsula. In Blagoveshchensk the Russian authorities drove the Chinese residents into the Amur, where thousands drowned, and the Sixty-Four Villages east of the river were emptied of their Manchu, Daur and Han inhabitants. The Russians took Aigun, relieved Harbin, and by October held Qiqihar, Jilin and Mukden (Shenyang), with all of Manchuria. Russia’s failure to withdraw as it had promised was a main cause of the Russo-Japanese War of 1904.: La conquête russe de la Mandchourie pendant la révolte des Boxers. Lorsque des Boxers et des troupes Qing attaquèrent le chemin de fer de l’Est chinois, que la Russie construisait à travers la Mandchourie jusqu’à Vladivostok et Port-Arthur, et que les canons Qing d’Aigun bombardèrent Blagovechtchensk, de l’autre côté de l’Amour, en juillet 1900, la Russie envoya des colonnes en Mandchourie depuis l’Amour, l’Oussouri, la Transbaïkalie et la péninsule du Liaodong. À Blagovechtchensk, les autorités russes poussèrent les habitants chinois dans l’Amour, où des milliers se noyèrent, et les Soixante-Quatre Villages à l’est du fleuve furent vidés de leurs habitants mandchous, daurs et han. Les Russes prirent Aigun, dégagèrent Harbin et, en octobre, tenaient Qiqihar, Jilin et Moukden (Shenyang), avec toute la Mandchourie. Le fait que la Russie ne se soit pas retirée comme elle l’avait promis fut l’une des principales causes de la guerre russo-japonaise de 1904.
