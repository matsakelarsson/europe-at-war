# French translations of the catalogue text (wave 10); step bodies follow later.
Russian raids on Sakhalin and Iturup: Raids russes sur Sakhaline et Itouroup
? Raids by two Russian naval officers in the service of the Russian-American Company on Japanese posts in Sakhalin, the Kurils and northern Ezo in 1806–1807, known in Japan as the Bunka Russian incursion (Bunka rokō), and the capture of the Russian captain Vasily Golovnin that followed in 1811–1813. In 1804–1805 the envoy Nikolai Rezanov waited six months at Nagasaki for permission to open trade, and the shogunate refused. On his way back he ordered Lieutenant Nikolai Khvostov to strike at the Japanese in the north, then tried to take the order back. In October 1806 Khvostov in the Yunona landed at Kushunkotan on Aniva Bay in southern Sakhalin, seized four guards, carried off rice and burned the post. In 1807 he returned with Midshipman Gavriil Davydov in the Yunona and the Avos, looted and burned Naibo on Iturup (Etorofu), and in June drove off some 200–300 shogunate, Nanbu and Tsugaru men from Shana, Iturup’s main post; the officer Toda Matadayū killed himself during the retreat, and the young surveyor Mamiya Rinzō was among the defenders. The raiders burned ships and stores on Rishiri and Rebun and left a letter threatening more attacks if Japan refused trade. In Okhotsk Khvostov and Davydov were arrested for acting without the emperor’s authority, but the shogunate, which had taken all of Ezo under its direct rule in 1807, mobilised about 3,000 men from the northern domains and ordered Russian ships driven away. In July 1811 the garrison of Kunashir seized Golovnin of the sloop Diana, who had come ashore for supplies, and held him and seven companions in Hakodate and Matsumae. His deputy Pyotr Rikord took the Japanese merchant Takadaya Kahei hostage in 1812; Takadaya helped arrange an exchange, and once Russian officials had assured the Japanese in writing that Khvostov had acted without authority, Golovnin and his men were released at Hakodate in the autumn of 1813.
: Les raids menés en 1806–1807 par deux officiers de marine russes au service de la Compagnie russe d’Amérique contre des postes japonais à Sakhaline, dans les Kouriles et dans le nord d’Ezo, connus au Japon sous le nom d’incursion russe de l’ère Bunka (Bunka rokō), et la capture du capitaine russe Vassili Golovnine qui s’ensuivit en 1811–1813. En 1804–1805, l’envoyé Nikolaï Rezanov attendit six mois à Nagasaki l’autorisation d’ouvrir le commerce, et le shogunat refusa. Sur le chemin du retour, il ordonna au lieutenant Nikolaï Khvostov de frapper les Japonais dans le nord, puis tenta de revenir sur cet ordre. En octobre 1806, Khvostov, à bord de la Yunona, débarqua à Kushunkotan, dans la baie d’Aniva, au sud de Sakhaline, captura quatre gardes, emporta du riz et incendia le poste. En 1807, il revint avec l’aspirant Gavriil Davydov, à bord de la Yunona et de l’Avos, pilla et incendia Naibo, à Itouroup (Etorofu), et en juin chassa de Shana, le principal poste d’Itouroup, quelque 200 à 300 hommes du shogunat, des Nanbu et des Tsugaru ; l’officier Toda Matadayū se donna la mort pendant la retraite, et le jeune arpenteur Mamiya Rinzō figurait parmi les défenseurs. Les assaillants incendièrent navires et entrepôts à Rishiri et à Rebun et laissèrent une lettre menaçant de nouvelles attaques si le Japon refusait le commerce. À Okhotsk, Khvostov et Davydov furent arrêtés pour avoir agi sans l’autorisation de l’empereur, mais le shogunat, qui avait placé tout Ezo sous son autorité directe en 1807, mobilisa environ 3 000 hommes des domaines du nord et ordonna de repousser les navires russes. En juillet 1811, la garnison de Kounachir s’empara de Golovnine, commandant du sloop Diana, qui était descendu à terre pour se ravitailler, et le détint avec sept compagnons à Hakodate et à Matsumae. Son second, Piotr Rikord, prit en otage en 1812 le marchand japonais Takadaya Kahei ; celui-ci aida à organiser un échange et, une fois que des responsables russes eurent assuré par écrit aux Japonais que Khvostov avait agi sans autorisation, Golovnine et ses hommes furent libérés à Hakodate à l’automne 1813.
