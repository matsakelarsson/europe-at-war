# French translations of the catalogue text (wave 14); step bodies follow later.
Russian–Tlingit War: Guerre russo-tlingit
? The war between the Tlingit (Lingít) of south-eastern Alaska and the Russian-American Company, which hunted sea otters along their coast with Alutiiq and Aleut hunters. In 1799 Alexander Baranov built Redoubt Saint Michael on Sitka Sound, in the country of the Sitka Kiks.ádi clan. Angered by Russian hunting in their waters, by demands for labour and by the treatment of Tlingit women, Tlingit warriors destroyed the post in June 1802, killing most of the people there, and attacked Russian hunting parties. In 1804 Baranov returned with a fleet of baidarkas and the Russian Navy sloop Neva. The Kiks.ádi, led in war by K’alyáan, held their new fort, Shís’gi Noow, at the mouth of the Indian River against the first assault on 1 October 1804, but had lost their reserve of gunpowder, and after days of bombardment and talks they left it by night and walked across Baranof Island to Point Craven, the “Survival March”. The Russians founded New Archangel (Novo-Arkhangelsk, today’s Sitka), from 1808 the capital of Russian America; in 1805 Tlingit and Eyak warriors destroyed the Russian post at Yakutat. The Kiks.ádi returned to Sitka in 1822.
: "La guerre entre les Tlingits (Lingít) du sud-est de l’Alaska et la Compagnie russe d’Amérique, qui chassait la loutre de mer le long de leur côte avec des chasseurs alutiiqs et aléoutes. En 1799, Alexandre Baranov construisit la redoute Saint-Michel sur le détroit de Sitka, dans le pays du clan Kiks.ádi de Sitka. Irrités par la chasse russe dans leurs eaux, par les exigences de travail et par le traitement infligé aux femmes tlingits, des guerriers tlingits détruisirent le poste en juin 1802, tuant la plupart de ses occupants, et attaquèrent des groupes de chasseurs russes. En 1804, Baranov revint avec une flotte de baïdarkas et le sloop Neva de la marine impériale russe. Les Kiks.ádi, menés au combat par K’alyáan, tinrent leur nouveau fort, Shís’gi Noow, à l’embouchure de l’Indian River, face au premier assaut, le 1er octobre 1804, mais ils avaient perdu leur réserve de poudre et, après des jours de bombardements et de pourparlers, ils l’abandonnèrent de nuit et traversèrent à pied l’île Baranof jusqu’à Point Craven : ce fut la « marche de la survie ». Les Russes fondèrent la Nouvelle-Arkhangelsk (Novo-Arkhangelsk, l’actuelle Sitka), capitale de l’Amérique russe à partir de 1808 ; en 1805, des guerriers tlingits et eyaks détruisirent le poste russe de Yakutat. Les Kiks.ádi revinrent à Sitka en 1822."
