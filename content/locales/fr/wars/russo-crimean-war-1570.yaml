# Some French text was translated automatically.
"Russo-Crimean War, 1570–1572": "Guerre russo-crime, 1570–1572"
"A war in which the Crimean khan Devlet I Giray, backed by the Ottoman Empire, tried to force Russia to give up Kazan and Astrakhan. In 1571, with most of the Russian army in Livonia, he slipped past the defences on the Oka and burned Moscow; in 1572 he came again and was defeated at Molodi, south of the city.": "Une guerre dans laquelle la Crimée khan Devlet I Giray, soutenue par l’Empire ottoman, a essayé de forcer la Russie à abandonner Kazan et Astrakhan. En 1571, avec la plupart de l’armée russe en Livonie, il a passé les défenses sur l’Oka et brûlé Moscou ; en 1572, il est revenu et a été défait à Molodi, au sud de la ville."
"Dates are Julian (Old Style). The sources disagree on the dates of the fighting at Molodi as well as on numbers; Russian historians usually date it from 29 or 30 July to 2 August 1572.": "Les sources ne sont pas d’accord sur les dates des combats à Molodi ainsi que sur les chiffres ; les historiens russes datent habituellement du 29 ou 30 juillet au 2 août 1572."
"The Crimean army included Nogai and Circassian contingents and, in 1572, Ottoman janissaries and guns. Russia was at the same time fighting the Livonian War against Sweden and Poland–Lithuania.": "L’armée de Crimée comprenait des contingents de Nogai et de Circassien et, en 1572, des janissaires et des canons ottomans. La Russie combattait en même temps la guerre livonienne contre la Suède et la Pologne-Lituanie."
"The Crimean raids, which were above all slave raids, continued after Molodi, and in 1591 a Crimean army again reached the outskirts of Moscow.": "Les raids de Crimée, qui étaient avant tout des raids d’esclaves, ont continué après Molodi, et en 1591 une armée de Crimée a de nouveau atteint la périphérie de Moscou."
