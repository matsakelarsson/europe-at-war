"July – August 1572": "juillet – août 1572"
"Devlet now demanded Kazan and Astrakhan as the price of peace. Ivan rebuilt the southern defences under Prince Mikhail Vorotynsky, and in July 1572 the khan came back with perhaps 40,000–60,000 men, including Nogais, Circassians and Ottoman janissaries. The Russians held the main fords, but around 27 July the Tatars crossed the Oka at Senkin ford, above Serpukhov, scattered a small detachment and rode for Moscow, leaving Vorotynsky’s army behind them. Vorotynsky followed, and his vanguard under Prince Dmitry Khvorostinin caught the Tatar rear near the village of Molodi, about 50 kilometres south of the city.": "Devlet exige maintenant Kazan et Astrakhan comme le prix de la paix. Ivan reconstruit les défenses du sud sous le prince Mikhail Vorotynsky, et en juillet 1572 le khan est revenu avec peut-être 40 000 à 60 000 hommes, y compris Nogais, Circassiens et janissaires ottomans. Les Russes tenaient les principaux gués, mais vers le 27 juillet, les Tatars traversèrent l’Oka à Senkin, au-dessus de Serpukhov, dispersèrent un petit détachement et montèrent pour Moscou, laissant derrière eux l’armée de Vorotynsky. Vorotynski suivit, et son avant-garde sous le prince Dmitry Khvorostinin prit le Tatar arrière près du village de Molodi, à environ 50 kilomètres au sud de la ville."
"With an army at his back, Devlet turned round. For several days the Tatars attacked the Russian gulyay-gorod, a mobile fortress of wooden shields mounted on carts, on a hill by the Rozhayka river, while musketeers and cannon fired from behind it. Divey Murza, the khan’s chief commander, was captured early in the fighting. On 2 August, as the Tatars made a last assault, Vorotynsky led part of his army round the hill and fell on their rear. The Tatars fled back across the Oka with heavy losses, and Russia kept Kazan and Astrakhan.": "Pendant plusieurs jours, les Tatars attaquèrent le goulyay-gorod russe, une forteresse mobile de boucliers en bois montée sur des charrettes, sur une colline près de la rivière Rozhayka, tandis que les mousquetaires et les canons tiraient derrière lui. Le 2 août, alors que les Tatars faisaient un dernier assaut, Vorotynsky menait une partie de son armée autour de la colline et tombait sur leur arrière. Les Tatars s’enfuirent à travers l’Oka avec de lourdes pertes, et la Russie garda Kazan et Astrakhan."
