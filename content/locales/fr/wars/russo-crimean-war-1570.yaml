"1570 – May 1571": "1570 – mai 1571"
"After Russia took Kazan and Astrakhan, the Crimean khan Devlet I Giray, a vassal of the Ottoman sultan, demanded them back. A Crimean and Ottoman expedition against Astrakhan failed in 1569, and in 1570 the khan’s sons ravaged the lands of Ryazan and Kashira. Russia was badly placed: most of its army was fighting in Livonia, famine and plague had struck in 1570, and Ivan IV’s oprichnina terror had divided the country. In the spring of 1571 Devlet led perhaps 40,000 men north, and Russian defectors showed him a way across the upper Oka and the Ugra, round the army waiting at Serpukhov.": "Après que la Russie a pris Kazan et Astrakhan, le khan de Crimée Devlet I Giray, un vassal du sultan ottoman, les a réclamés. Une expédition de Crimée et Ottoman contre Astrakhan échoua en 1569, et en 1570 les fils khans ont ravagé les terres de Riazan et Kashira. La Russie était mal placée : la plupart de son armée se battait en Livonie, la famine et la peste avaient frappé en 1570, et Ivan IV.s oprichnina terreur avait divisé le pays. Au printemps de 1571 Devlet conduisait peut-être 40 000 hommes au nord, et les transfuges russes lui montrèrent un chemin à travers la haute Oka et l’Ugra, autour de l’armée attendant à Serpukhov."
"Ivan fled north to Rostov, and the Russian commanders fell back on Moscow. On 24 May the Tatars set fire to its wooden suburbs, and a strong wind carried the flames into the city, which burned down in about six hours. People who took refuge in stone churches and cellars died there, others drowned in the Moskva river, and the powder magazine in the Kremlin exploded, though the Kremlin itself was not taken. The Tatars left by the Ryazan road. Estimates of the dead range from 10,000 to 120,000, with 60,000–150,000 people carried off into slavery.": "Ivan s’enfuit vers le nord à Rostov, et les commandants russes retombèrent sur Moscou. Le 24 mai, les Tatars incendient sa banlieue en bois, et un fort vent transporte les flammes dans la ville, qui brûle en environ six heures. Des gens qui se réfugient dans des églises en pierre et des caves y meurent, d’autres se noyent dans la rivière Moskva, et le magazine de poudre au Kremlin explose, bien que le Kremlin lui-même ne soit pas pris. Les Tatars laissés par la route de Riazan. Selon les estimations, les morts vont de 10 000 à 120 000 personnes, dont 60 000 à 150 000 ont été emmenées en esclavage."
