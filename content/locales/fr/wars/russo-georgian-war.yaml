"11 August – 8 October 2008": "11 août – 8 octobre 2008"
"On 11 August Russian forces moved beyond the conflict zones into the rest of Georgia. From Abkhazia they entered Zugdidi and the military base at Senaki and occupied the port of Poti, where they sank Georgian ships; from South Ossetia they took Gori on 13 August, cutting the country’s main east–west road. In and around South Ossetia militias burned and looted ethnic Georgian villages, and their inhabitants fled; the EU inquiry concluded that ethnic Georgians had been subjected to ethnic cleansing. About 192,000 people were displaced at the height of the war.": "Le 11 août, les forces russes se sont déplacées au-delà des zones de conflit dans le reste de la Géorgie. De l’Abkhazie, elles ont pénétré Zugdidi et la base militaire à Senaki et occupé le port de Poti, où elles ont coulé des navires géorgiens ; de l’Ossétie du Sud, elles ont pris Gori le 13 août, coupant la route principale est-ouest du pays. Dans et autour de l’Ossétie du Sud, des milices ont brûlé et pillé des villages géorgiens de souche, et leurs habitants ont fui ; l’enquête de l’UE a conclu que les Géorgiens de souche avaient été soumis à un nettoyage ethnique."
"France’s president Nicolas Sarkozy, holding the EU presidency, brokered a six-point ceasefire on 12 August, signed by Saakashvili on 15 August and by Russia’s president Dmitry Medvedev the next day. On 26 August Russia recognised Abkhazia and South Ossetia as independent states, which only a handful of other countries followed. Russian troops left Gori on 22 August and the “buffer zones” on 8 October, when EU monitors arrived, but stayed in both regions. Georgia counted about 400 dead, among them 224 civilians; Russia reported 67 soldiers killed, and South Ossetia said 365 of its people died.": "Nicolas Sarkozy, président de l’UE, a négocié un cessez-le-feu en six points le 12 août, signé par Saakashvili le 15 août et par le président russe Dmitry Medvedev le lendemain. Les troupes russes ont quitté Gori le 22 août et les zones tampons le 8 octobre, lorsque des observateurs de l’UE sont arrivés, mais sont restés dans les deux régions. La Géorgie comptait environ 400 morts, parmi lesquels 224 civils ; la Russie a signalé 67 soldats tués, et l’Ossétie du Sud a déclaré 365 de ses habitants morts."
