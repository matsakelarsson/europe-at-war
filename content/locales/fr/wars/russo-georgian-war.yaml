"Russo-Georgian War": "Guerre russo-géorgienne"
"A short war in August 2008 that began with a Georgian assault on Tskhinvali, capital of breakaway South Ossetia, and turned into a Russian counter-offensive deep into Georgia. After a ceasefire brokered by France, Russia recognised South Ossetia and Abkhazia as independent states and kept troops in both, while most ethnic Georgians were driven out of South Ossetia.": "Une courte guerre en août 2008 qui a commencé par un assaut géorgien sur Tskhinvali, capitale de l’Ossétie du Sud et s’est transformée en une contre-offensive russe profonde en Géorgie. Après un cessez-le-feu négocié par la France, la Russie a reconnu l’Ossétie du Sud et l’Abkhazie comme États indépendants et a gardé des troupes dans les deux, tandis que la plupart des Géorgiens de souche ont été chassés d’Ossétie du Sud."
"South Ossetia and Abkhazia are shown as part of Georgia on the map, as they are internationally recognised. The outline of South Ossetia and the Russian-held zones are approximate.": "L’Ossétie du Sud et l’Abkhazie figurent sur la carte en tant que partie intégrante de la Géorgie, car elles sont reconnues au niveau international."
"Exchanges of fire had escalated from 1 August, and some sources date the war from then. Each side’s casualty figures come from its own government.": "Les échanges de tirs s’étaient intensifiés à partir du 1er août, et certaines sources datent de la guerre."
