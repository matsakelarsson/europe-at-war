"7–10 August 2008": "7–10 août 2008"
"Since the wars of the early 1990s South Ossetia and Abkhazia had been outside Georgian control, with Russian peacekeepers in both. Mikheil Saakashvili, president from 2004, promised to restore Georgia’s territorial integrity and sought NATO membership, while Russia gave its passports to most people in the two regions. In early August 2008 exchanges of fire around Tskhinvali grew heavier. Late on 7 August, hours after declaring a unilateral ceasefire, Georgia began an artillery bombardment and ground assault on the town, saying it was answering attacks on Georgian villages and Russian troop movements through the Roki Tunnel. Russian peacekeepers were among those killed.": "Depuis les guerres du début des années 90, l’Ossétie du Sud et l’Abkhazie n’étaient pas sous contrôle géorgien, les soldats de la paix russes étant dans les deux. Mikheil Saakashvili, président de 2004, a promis de restaurer l’intégrité territoriale de la Géorgie et a cherché à adhérer à l’OTAN, tandis que la Russie a donné ses passeports à la plupart des gens dans les deux régions. À la fin du 7 août, quelques heures après avoir déclaré un cessez-le-feu unilatéral, la Géorgie a lancé un bombardement d’artillerie et une attaque au sol contre la ville en disant qu’elle répondait aux attaques contre les villages géorgiens et les mouvements de troupes russes à travers le tunnel de Roki."
"On 8 August Russia sent units of its 58th Army through the tunnel and began bombing targets across Georgia. Georgian forces were driven out of Tskhinvali by 10 August. A second front opened in the west, where Russian warships sank a Georgian boat off Abkhazia and Abkhaz forces, backed by Russia, drove Georgian troops from the upper Kodori Gorge. An EU inquiry, the Tagliavini report of 2009, found that the war began with the Georgian attack, which it judged unjustified under international law, but that Russia’s response went far beyond reasonable defence and that the blame could not be laid on one side alone.": "Le 8 août, la Russie a envoyé des unités de sa 58e armée à travers le tunnel et a commencé à bombarder des cibles à travers la Géorgie. Les forces géorgiennes ont été chassées de Tskhinvali avant le 10 août. Une enquête de l’UE, le rapport Tagliavini de 2009, a conclu que la guerre avait commencé avec l’attaque géorgienne, qu’elle jugeait injustifiée en vertu du droit international, mais que la réponse de la Russie allait bien au-delà d’une défense raisonnable et que la faute ne pouvait être imputée à un seul camp."
