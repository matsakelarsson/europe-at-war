# French translations of the catalogue text (wave 9); step bodies follow later.
Russo-Japanese War: Guerre russo-japonaise
A war between the Russian Empire and the Empire of Japan over Manchuria and Korea, fought mostly on Chinese soil and in the seas around Korea. Japan opened it with a surprise torpedo attack on the Russian fleet at Port Arthur (Lüshun) in February 1904, landed armies in Korea and on the Liaodong peninsula, crossed the Yalu and drove the Russians north at Liaoyang. After a five-month siege Port Arthur surrendered in January 1905; in March the Japanese won the vast battle of Mukden (Shenyang), and in May Admiral Tōgō Heihachirō destroyed the Russian Baltic Fleet at Tsushima. With both sides exhausted and Russia shaken by revolution, the Treaty of Portsmouth, mediated by President Theodore Roosevelt, gave Japan the Kwantung lease, the South Manchuria Railway and southern Sakhalin and a free hand in Korea. It was the first victory of an Asian power over a European great power in modern times. Some 80,000 Japanese and 40,000–70,000 Russian soldiers died, as did many Chinese civilians.: Une guerre entre l’Empire russe et l’Empire du Japon pour la Mandchourie et la Corée, livrée surtout sur le sol chinois et dans les mers qui entourent la Corée. Le Japon l’ouvrit par une attaque surprise à la torpille contre la flotte russe de Port-Arthur (Lüshun) en février 1904, débarqua des armées en Corée et dans la péninsule du Liaodong, franchit le Yalu et repoussa les Russes vers le nord à Liaoyang. Après un siège de cinq mois, Port-Arthur capitula en janvier 1905 ; en mars, les Japonais remportèrent l’immense bataille de Moukden (Shenyang) et, en mai, l’amiral Tōgō Heihachirō anéantit la flotte russe de la Baltique à Tsushima. Les deux camps étant épuisés et la Russie ébranlée par la révolution, le traité de Portsmouth, conclu grâce à la médiation du président Theodore Roosevelt, donna au Japon le territoire à bail du Kwantung, le chemin de fer de Mandchourie du Sud et le sud de Sakhaline, ainsi que les mains libres en Corée. Ce fut la première victoire d’une puissance asiatique sur une grande puissance européenne à l’époque moderne. Quelque 80 000 soldats japonais et 40 000 à 70 000 soldats russes périrent, de même que de nombreux civils chinois.
