"1467–1530": "1467–1530"
"Moscow and Kazan fought a string of short wars, usually over who should be khan. In 1469 Prince Daniil Kholmsky besieged Kazan and forced Khan Ibrahim to free his Russian captives, and nearly twenty years of peace followed. When Ibrahim died, Ivan III, allied with Mengli Giray of Crimea, backed Ibrahim’s son Muhammad Amin, Mengli’s stepson, against his half-brother Ilham. In 1487 Kholmsky took Kazan after a siege of several weeks. Ilham was sent in chains to Vologda, and for most of the next thirty years Kazan was ruled by khans who were allies or protégés of Moscow.": "Moscou et Kazan ont combattu une série de guerres courtes, généralement sur qui devrait être khan. En 1469 le prince Daniil Kholmsky a assiégé Kazan et forcé Khan Ibrahim à libérer ses captifs russes, et près de vingt ans de paix ont suivi. À la mort d’Ibrahim, Ivan III, allié à Mengli Giray de Crimée, a soutenu le fils d’Ibrahim Muhammad Amin, le beau-fils de Mengli, contre son demi-frère Ilham. En 1487 Kholmsky a pris Kazan après un siège de plusieurs semaines. Ilham fut envoyé enchaîné à Vologda, et pendant la plupart des trente années suivantes Kazan fut gouverné par des khans qui étaient alliés ou protégés de Moscou."
"Muhammad Amin himself broke with Moscow in 1505. The Russian merchants at the Kazan fair were massacred, a Tatar and Nogai army besieged Nizhny Novgorod, and in 1506 a Russian army was routed outside Kazan. In 1521 Sahib Giray, a brother of the Crimean khan, took the throne, and that summer Crimean and Kazan Tatars raided to the outskirts of Moscow and carried off many thousands of captives. Vasily III answered by founding Vasilsursk on the Volga in 1523, banning his subjects from the Kazan fair and sending large armies against Kazan in 1524 and 1530.": "Muhammad Amin lui-même a rompu avec Moscou en 1505. Les marchands russes à la foire de Kazan ont été massacrés, une armée tatare et Nogai assiégé Nijny Novgorod, et en 1506 une armée russe a été acheminée hors de Kazan. En 1521, Sahib Giray, un frère du khan de Crimée, prit le trône, et cet été-là, la Crimée et les Tatars de Kazan firent une descente à la périphérie de Moscou et emmenèrent des milliers de captifs. Vasily III répondit en fondant Vasilsursk sur la Volga en 1523, interdisant ses sujets de la foire de Kazan et envoyant de grandes armées contre Kazan en 1524 et 1530."
