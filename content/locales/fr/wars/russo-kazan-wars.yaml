"Russo-Kazan Wars": "Guerres russo-kazan"
"A series of wars between Moscow and the Kazan khanate on the middle Volga, founded by Ulugh Muhammad after he beat a Muscovite army at Belyov in 1437. For a century they fought mostly over who should rule in Kazan, with Moscow installing friendly khans whenever it could, until Ivan IV besieged and took Kazan in 1552 and annexed the khanate.": "Une série de guerres entre Moscou et le khanate Kazan sur la Volga moyenne, fondée par Ulugh Muhammad après qu’il a battu une armée Muscovite à Belyov en 1437. Pendant un siècle, ils ont combattu principalement pour qui devrait régner à Kazan, avec Moscou installer des khans amis chaque fois que cela pouvait, jusqu’à Ivan IV assiégé et pris Kazan en 1552 et annexe le khanat."
"Dates are Julian (Old Style), as in the Russian chronicles, which are the main source; Tatar accounts are few. The khanate’s founding is dated variously from 1438 to 1445.": "Les dates sont Julian (Ancien Style), comme dans les chroniques russes, qui sont la source principale ; les comptes tatars sont peu. La fondation du khanate est datée de 1438 à 1445."
"Moscow was allied with the Crimean khans from the 1470s until about 1519 and backed the candidates they favoured in Kazan. Later the Crimean Girays put their own relatives on the Kazan throne and the two khanates fought Moscow together.": "Moscou était allié avec les Khans de Crimée des années 1470 jusqu’aux environs 1519 et a soutenu les candidats qu’ils favorisaient à Kazan. Plus tard, les Girays de Crimée ont mis leurs propres parents sur le trône de Kazan et les deux khanats ont combattu Moscou ensemble."
"Rebellions in the countryside after the fall of Kazan lasted until 1556.": "Les rébellions à la campagne après la chute de Kazan durent jusqu’en 1556."
