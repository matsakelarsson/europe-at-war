"1437–1445": "1437–1445"
"Ulugh Muhammad, once khan of the Golden Horde, lost the struggle for its throne and came north with a small army in 1437. When his Tatars, camped near Belyov on the upper Oka, began raiding, Vasily II of Moscow sent his cousins Dmitry Shemyaka and Dmitry Krasny to drive them off. The Tatars held out in a fort of wicker walls packed with snow and frozen with water, and on 5 December 1437, during peace talks, they attacked through a fog and routed the larger Russian army. Ulugh Muhammad moved to the middle Volga and made Kazan the capital of a new khanate.": "Ulugh Muhammad, autrefois khan de la Horde d’Or, a perdu la lutte pour son trône et est venu au nord avec une petite armée en 1437. Lorsque ses Tatars, campé près de Belyov sur le haut Oka, a commencé à attaquer, Vasily II de Moscou a envoyé ses cousins Dmitry Shemyaka et Dmitry Krasny pour les chasser. Le 5 décembre 1437, au cours des pourparlers de paix, ils attaquèrent à travers un brouillard et allouèrent l’armée russe. Ulugh Muhammad s’installa au milieu de la Volga et fit de Kazan la capitale d’un nouveau khanate."
"In 1439 his Tatars ravaged the outskirts of Moscow while Vasily fled across the Volga, and in 1445 they took Nizhny Novgorod. On 7 July 1445, near the Monastery of St Euthymius at Suzdal, the khan’s sons Mahmud and Yakub beat Vasily’s hastily gathered army and took him prisoner. He was freed in the autumn for an enormous ransom, which weakened him in his war with Shemyaka. Two other sons of the khan later entered Vasily’s service, and in 1452 one of them, Qasim, was given the town later named Kasimov, the seat of a Tatar khanate loyal to Moscow.": "En 1439, ses Tatars ravagent la banlieue de Moscou tandis que Vasily s’enfuit à travers la Volga, et en 1445, ils prennent Nijni Novgorod. Le 7 juillet 1445, près du monastère de Saint-Euthymius à Suzdal, les fils de Khanoud Mahmud et Yakub battent rapidement Vasily's pour le faire prisonnier. Il fut libéré à l’automne pour une énorme rançon, qui l’affaiblit dans sa guerre avec Shemyaka. Deux autres fils du khan entrèrent plus tard dans le service de Vasily et, en 1452, un d’entre eux, Qasim, reçut la ville plus tard nommée Kasimov, le siège d’un khanat tatar fidèle à Moscou."
