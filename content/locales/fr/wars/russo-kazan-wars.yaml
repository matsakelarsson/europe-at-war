"1545–1552": "1545–1552"
"When Ivan IV came of age, Moscow set out to end the threat from Kazan for good. His winter campaigns of 1547–1548 and 1549–1550 failed for lack of supplies. In 1551 a wooden fortress, cut and fitted at Uglich, was floated down the Volga and put up in four weeks at Sviyazhsk, about 30 kilometres above Kazan. The peoples on the right bank of the Volga went over to Moscow, and the pro-Russian Shah Ali was briefly restored as khan, but the Kazan nobles soon drove him out and called in a new khan, Yadegar Muhammad, who brought Nogai horsemen.": "À l’âge d’Ivan IV, Moscou se mit à mettre fin à la menace de Kazan pour de bon. Ses campagnes hivernales de 1547-1548 et 1549-1550 échouèrent faute d’approvisionnement. En 1551, une forteresse en bois, taillée et installée à Uglich, fut lancée sur la Volga et mise en place en quatre semaines à Sviyajsk, à environ 30 kilomètres au-dessus de Kazan. Les peuples sur la rive droite de la Volga sont allés à Moscou, et le pro-russe Shah Ali a été brièvement restauré en tant que khan, mais les nobles Kazan l’ont rapidement chassé dehors et appelé dans un nouveau khan, Yadegar Muhammad, qui a amené des cavaliers Nogai."
"In June 1552 Ivan led a large army, said to number 150,000, from Moscow. A Crimean attack meant to divert him was beaten off at Tula, and in late August the Russians surrounded Kazan. Their engineers built a wooden siege tower carrying cannon, and sappers blew up the passage to the city’s water source. On 2 October mines brought down the walls, and after hard street fighting the city was taken. Many defenders and inhabitants were killed, and Yadegar Muhammad was captured. Resistance in the countryside lasted until 1556, and Ivan celebrated the victory by building St Basil’s Cathedral in Moscow.": "En juin 1552 Ivan a dirigé une grande armée, dit au nombre 150 000, de Moscou. Une attaque de Crimée destiné à le détourner a été battu à Tula, et fin août les Russes ont entouré Kazan. Leurs ingénieurs ont construit une tour de siège en bois portant canon, et les sapeurs ont fait sauter le passage vers la source d’eau de la ville. De nombreux défenseurs et habitants ont été tués, et Yadegar Muhammad a été capturé. La résistance dans la campagne a duré jusqu’en 1556, et Ivan a célébré la victoire en construisant la cathédrale Saint-Basile à Moscou."
