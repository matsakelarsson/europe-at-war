# Some French text was translated automatically.
"Russo-Persian War of 1722–1723": "Guerre russo-persienne de 1722–1723"
"Peter the Great’s campaign along the western shore of the Caspian Sea, launched as Safavid Persia collapsed under an Afghan invasion. Russian forces took Derbent in 1722 and Rasht and Baku in 1723, and by the Treaty of Saint Petersburg that September the shah’s envoy ceded Derbent, Baku and the provinces of Shirvan, Gilan, Mazandaran and Astarabad. Disease killed many thousands of the occupying troops, and Russia gave the lands back in 1732 and 1735.": "Les forces russes ont pris Derbent en 1722 et Rasht et Bakou en 1723, et par le traité de Saint-Pétersbourg que septembre l’envoyé des chah ê a cédé Derbent, Bakou et les provinces de Shirvan, Gilan, Mazandaran et Astarabad. La maladie a tué des milliers de troupes d’occupation, et la Russie a rendu les terres en 1732 et 1735."
"Russian accounts date events in the Julian calendar, eleven days behind the Gregorian; the Treaty of Saint Petersburg was signed on 12 September 1723 Old Style, 23 September New Style.": "Les comptes russes datent les événements dans le calendrier julien, onze jours derrière le grégorien ; le traité de Saint-Pétersbourg a été signé le 12 Septembre 1723 Old Style, 23 Septembre New Style."
"Known in Russian historiography as the Persian campaign of Peter the Great. The 1724 Treaty of Constantinople then divided the Persian lands in the Caucasus between Russia and the Ottoman Empire.": "Connu dans l’historiographie russe comme la campagne perse de Pierre le Grand. Le traité de Constantinople de 1724 a ensuite divisé les terres perses dans le Caucase entre la Russie et l’Empire ottoman."
