"1812–1813": "1812–1813"
"For six years neither side could win. Abbas Mirza modernised his army with French and then British officers, a Russian assault on Erivan failed in 1808, and early in 1812 a Persian force captured a whole Russian battalion near Sultanabad in Karabakh. Peace with the Ottomans at Bucharest in May 1812 freed Russian troops. On the night of 31 October General Pyotr Kotlyarevsky, with about 2,000 men, crossed the Aras and routed Abbas Mirza’s much larger army at Aslanduz.": "Pendant six ans, aucune des deux parties n’a pu gagner. Abbas Mirza a modernisé son armée avec des officiers français puis britanniques, un assaut russe sur Erivan a échoué en 1808, et au début de 1812 une force perse a capturé tout un bataillon russe près de Sultanabad dans le Karabakh. La paix avec les Ottomans à Bucarest en mai 1812 a libéré les troupes russes. Dans la nuit du 31 octobre, le général Pyotr Kotlyarevsky, avec environ 2 000 hommes, traversa l’Aras et roula vers Aslanduz Abbas Mirza."
"Kotlyarevsky then marched across the snow-covered Mughan steppe and on 13 January 1813 stormed the new Persian fort at Lankaran. Almost all of its garrison of about 4,000 were killed, and the Russians lost some two-thirds of their attacking force. With Napoleon in retreat, Britain urged its Persian ally to make peace. The Treaty of Gulistan, signed on 24 October 1813 with a British envoy as mediator, gave Russia Dagestan, eastern Georgia and the khanates north of the Aras, and the sole right to keep warships on the Caspian Sea.": "Kotlyarevsky marcha alors à travers la steppe de Mughan enneigée et, le 13 janvier 1813, s’empara du nouveau fort persan au Lankaran. Presque toute sa garnison d’environ 4 000 personnes furent tuées, et les Russes perdirent les deux tiers de leur force d’attaque. Le traité de Gulistan, signé le 24 octobre 1813 avec un envoyé britannique en tant que médiateur, confia à la Russie le Daghestan, l’est de la Géorgie et aux khanates au nord de l’Aras, le seul droit de garder des navires de guerre sur la mer Caspienne."
