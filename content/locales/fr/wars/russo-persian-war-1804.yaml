"1804–1806": "1804–1806"
"Russia annexed the eastern Georgian kingdom of Kartli-Kakheti in 1801, and its new commander in the Caucasus, the Georgian-born Prince Pavel Tsitsianov, set out to bring the neighbouring khanates under Russian rule. On 15 January 1804 he stormed Ganja after a month’s siege. Javad Khan died fighting on the walls, and between 1,500 and 3,000 of the defenders and townspeople were killed. Fath-Ali Shah demanded that the Russians leave the Caucasus, and in June his heir, Abbas Mirza, marched on Erivan with a large army.": "La Russie a annexé le royaume géorgien oriental de Kartli-Kakheti en 1801, et son nouveau commandant dans le Caucase, le prince d’origine géorgienne Pavel Tsitsianov, s’est mis à amener les khanates voisins sous la domination russe. Le 15 janvier 1804, il a pris Ganja après un mois de siège. Javad Khan est mort aux combats sur les murs, et entre 1 500 et 3 000 des défenseurs et citadins ont été tués. Fath-Ali Shah a exigé que les Russes quittent le Caucase, et en juin son héritier, Abbas Mirza, a marché sur Erivan avec une grande armée."
"Tsitsianov fought Abbas Mirza at Echmiadzin and besieged Erivan, but ran short of food and fell back to Tiflis in September, having lost about half his men. In 1805 the khans of Karabakh, Sheki and Shirvan accepted Russian overlordship, and small Russian detachments held off Persian attacks in Karabakh. In February 1806 Tsitsianov was shot dead outside Baku while receiving the keys of the city, but later that year Russian troops took Derbent, Quba and Baku. War with the Ottomans from December 1806 then drew Russian forces west.": "Tsitsianov a combattu Abbas Mirza à Echmiadzin et assiégé Erivan, mais a manqué de nourriture et est retombé à Tiflis en septembre, après avoir perdu environ la moitié de ses hommes. En 1805 les khans du Karabakh, Sheki et Shirvan ont accepté le commandement russe, et de petits détachements russes ont retenu les attaques persanes dans le Karabakh. En février 1806, Tsitsianov a été abattu hors de Bakou alors qu’il recevait les clés de la ville, mais plus tard cette année-là, les troupes russes ont pris Derbent, Quba et Bakou."
