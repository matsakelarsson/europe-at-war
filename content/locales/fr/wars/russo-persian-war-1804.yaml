# Some French text was translated automatically.
"Russo-Persian War of 1804–1813": "Guerre russo-persienne de 1804–1813"
"A war between the Russian Empire and Qajar Persia over eastern Georgia, which Russia had annexed in 1801, and the khanates of the eastern Caucasus. After a long and mostly indecisive struggle, Russian victories at Aslanduz and Lankaran forced Persia to accept the Treaty of Gulistan in 1813, which gave Russia Dagestan, eastern Georgia and most of today’s Azerbaijan.": "Une guerre entre l’Empire russe et la Perse de Qajar sur la Géorgie orientale, que la Russie avait annexée en 1801, et les khanats du Caucase oriental. Après une longue et surtout indecisive lutte, les victoires russes à Aslanduz et Lankaran ont forcé la Perse à accepter le traité de Gulistan en 1813, qui a donné la Russie Daghestan, la Géorgie orientale et la plupart d’aujourd'hui Azerbaïdjan."
"Dates are New Style (Gregorian). Russian accounts use the Julian calendar, then 12 days behind, so the storming of Ganja is 3 January 1804 and the Battle of Aslanduz 19–20 October 1812 in Russian sources.": "Les comptes russes utilisent le calendrier julien, puis 12 jours derrière, de sorte que l’assaut de Ganja est 3 janvier 1804 et la bataille d’Aslanduz 19-20 octobre 1812 dans des sources russes."
"The khanates were local Muslim principalities under Persian overlordship. Persia did not accept their loss until 1813, so the base map shows them as Persian until the Treaty of Gulistan.": "Les khanates étaient des principautés musulmanes locales sous la domination persane. Perse n’a pas accepté leur perte avant 1813, de sorte que la carte de base les montre comme persan jusqu’au traité de Gulistan."
"Ganja, renamed Yelizavetpol by the Russians, is shown under its present name.": "Ganja, rebaptisée Yelizavetpol par les Russes, est représentée sous son nom actuel."
