# Some French text was translated automatically.
"Russo-Persian War of 1826–1828": "Guerre russo-persienne de 1826–1828"
"The last war between the Russian Empire and Qajar Persia, begun by Persia to win back the lands it had lost in 1813. After early Persian successes, Russian victories at Ganja and the capture of Erivan and Tabriz led to the Treaty of Turkmenchay in 1828, by which Persia gave up the khanates of Erivan and Nakhchivan and accepted the Aras as its border.": "La dernière guerre entre l’Empire russe et la Perse Qajar, commencée par la Perse pour reconquérir les terres qu’elle avait perdues en 1813. Après les premiers succès perses, les victoires russes à Ganja et la capture d’Erivan et Tabriz conduisent au traité de Turkmenchay en 1828, par lequel Perse abandonne les khanates d’Erivan et Nakhchivan et accepte l’Aras comme sa frontière."
"Dates are New Style (Gregorian). Russian accounts use the Julian calendar, then 12 days behind, so the Battle of Ganja is 13 September 1826 and the fall of Erivan 1 October 1827 in Russian sources. The Treaty of Turkmenchay is usually dated 22 February 1828 (10 February Old Style); some sources give 21 February.": "Les comptes russes utilisent le calendrier julien, puis 12 jours derrière, de sorte que la bataille de Ganja est 13 septembre 1826 et la chute d’Erivan 1 octobre 1827 dans des sources russes. Le traité de Turkmenchay est généralement daté du 22 février 1828 (10 février Old Style) ; certaines sources donnent 21 février."
"Ganja, then called Yelizavetpol by the Russians, and Erivan, today’s Yerevan, are given their usual names of the time in the text.": "Ganja, alors appelé Yelizavetpol par les Russes, et Erivan, aujourd'hui , Erevan, sont donnés leurs noms habituels de l’époque dans le texte."
