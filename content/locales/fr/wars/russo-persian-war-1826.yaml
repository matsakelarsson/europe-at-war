"1827–1828": "1827–1828"
"Paskevich replaced Yermolov in 1827 and carried the war south. He took Echmiadzin in April and Nakhchivan in June, and in July the fortress of Abbasabad on the Aras surrendered after he beat a Persian relief army. In August Abbas Mirza besieged Echmiadzin, and General Afanasy Krasovsky’s column broke through to it at Oshakan, with heavy losses. Erivan’s citadel surrendered on 13 October 1827 after a short siege and bombardment, and late that month Russian troops entered Tabriz, the chief city of Persian Azerbaijan, without a fight.": "Paskevich remplaça Yermolov en 1827 et porta la guerre au sud. Il prit Echmiadzin en avril et Nakhchivan en juin, et en juillet la forteresse d’Abbasabad sur l’Aras se rendit après avoir battu une armée de secours perse. En août Abbas Mirza assiégea Echmiadzin, et la colonne du général Afanasy Krasovsky a traversé à Oshakan, avec de lourdes pertes. La citadelle d’Erivan s’est rendue le 13 octobre 1827 après un court siège et des bombardements, et à la fin du mois les troupes russes sont entrées dans Tabriz, la ville principale de l’Azerbaïdjan perse, sans se battre."
"With Russian forces able to advance on Tehran, Persia made peace. The Treaty of Turkmenchay, signed in a village between Tabriz and Tehran on 22 February 1828, gave Russia the khanates of Erivan and Nakhchivan and set the border on the Aras. Persia paid 20 million silver roubles, confirmed Russia’s sole right to warships on the Caspian and granted Russian subjects legal privileges. Tens of thousands of Armenians moved from Persia into the new Russian lands, while many Muslims left them. In 1829 a mob in Tehran killed the Russian envoy, the playwright Alexander Griboyedov, and most of his mission.": "Avec les forces russes capables d’avancer sur Téhéran, la Perse fait la paix. Le Traité de Turkmenchay, signé dans un village entre Tabriz et Téhéran le 22 février 1828, donne à la Russie les khanates d’Erivan et Nakhchivan et fixe la frontière sur l’Aras. La Perse paie 20 millions de roubles d’argent, confirme la Russie seul droit aux navires de guerre sur la Caspienne et accorde des privilèges juridiques aux sujets russes. Des dizaines de milliers d’Arméniens se sont déplacés de Perse dans les nouvelles terres russes, tandis que de nombreux musulmans les ont quittés. En 1829, une foule à Téhéran a tué l’envoyé russe, le dramaturge Alexander Griboyedov, et la plupart de sa mission."
