"July – September 1826": "juillet – septembre 1826"
"Persia had never accepted the loss of the khanates in 1813, and the border was vague in places. When Russian troops occupied the north shore of Lake Sevan in 1825, the clergy and the exiled khans at the shah’s court called for holy war. News of Alexander I’s death and of the Decembrist revolt suggested that Russia was weak. In July 1826 the crown prince, Abbas Mirza, crossed the Aras with a large army. Much of the Muslim population of Karabakh, Ganja, Shirvan, Sheki and Talysh rose against Russian rule, and the Persians took Lankaran.": "La Perse n’avait jamais accepté la perte des khanates en 1813, et la frontière était vague dans les endroits. Lorsque les troupes russes occupèrent la rive nord du lac Sevan en 1825, le clergé et les khans exilés à la cour de Shah-S appelaient à la guerre sainte. En juillet 1826, le prince héritier, Abbas Mirza, traversa l’Aras avec une grande armée. Une bonne partie de la population musulmane du Karabakh, Ganja, Shirvan, Sheki et Talysh s’éleva contre la domination russe, et les Perses prirent le Lankaran."
"Yermolov, short of troops, pulled many of his garrisons back towards Tiflis. In Karabakh only the fortress of Shusha held out, for seven weeks, under Colonel Iosif Reut with the help of local Armenians. Reinforcements arrived from Russia, and in September General Valerian Madatov beat a Persian force at Shamkir and retook Ganja. On 25 September General Ivan Paskevich, with about 10,000 men, defeated Abbas Mirza’s main army of some 30,000 outside Ganja. The Persians lifted the siege of Shusha and fell back across the Aras.": "Yermolov, à court de troupes, a retiré beaucoup de ses garnisons en direction de Tiflis. Dans le Karabakh, seule la forteresse de Shusha a tenu, pendant sept semaines, sous le colonel Iosif Reut avec l’aide des Arméniens locaux. Les renforts sont arrivés de Russie, et en septembre le général Valérien Madatov a battu une force perse à Shamkir et repris Ganja. Le 25 septembre, le général Ivan Pasquivith, avec environ 10 000 hommes, a battu l’armée principale d’Abbas Mirza de quelque 30 000 hommes en dehors de Ganja. Les Perses ont levé le siège de Shusha et sont tombés à travers l’Aras."
