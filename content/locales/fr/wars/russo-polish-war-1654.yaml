"Russo-Polish War, 1654–1667": "Guerre russo-polonaise, 1654–1667"
"After the Cossack Hetmanate accepted the tsar’s protection, Russia invaded Poland–Lithuania, took Smolensk and Vilnius and occupied much of the Grand Duchy. The Commonwealth fought back from 1658, but at Andrusovo in 1667 it gave up Smolensk, Kyiv and Ukraine east of the Dnieper.": "Après que le Cosaque Hetmanate ait accepté la protection du tsar, la Russie a envahi la Pologne-Lituanie, pris Smolensk et Vilnius et occupé une grande partie du Grand Duché. Le Commonwealth s’est battu à partir de 1658, mais à Andrusovo en 1667 il a abandonné Smolensk, Kiev et l’Ukraine à l’est du Dniepr."
"Dates are New Style (Gregorian), as used in Poland–Lithuania. Russian sources, in the Julian calendar, give dates ten days earlier.": "Les dates sont New Style (Gregorian), comme utilisé en Pologne-Lituanie. Les sources russes, dans le calendrier julien, donnent des dates dix jours plus tôt."
"The Cossacks fought on Russia’s side until 1658, then split, some hetmans siding with Poland and others with Russia.": "Les cosaques se sont battus sur le côté russe jusqu’en 1658, puis se sont séparés, certains hetmans s’étant rangés avec la Pologne et d’autres avec la Russie."
