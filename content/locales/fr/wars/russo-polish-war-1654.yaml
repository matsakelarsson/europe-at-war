"1658–1661": "1658–1661"
"War resumed in 1658. That September Hetman Ivan Vyhovsky signed the Treaty of Hadiach, which was to make the Cossack lands a third member of the Commonwealth, and in 1659 his Cossacks and their Tatar allies inflicted a heavy defeat on a Russian army at Konotop. The Hetmanate soon split again, but the Commonwealth, at peace with Sweden from May 1660, could now turn east.": "La guerre reprit en 1658. En septembre, Hetman Ivan Vyhovsky signa le Traité d’Hadiach, qui devait faire du Cosaque un troisième membre du Commonwealth et, en 1659, ses cosaques et leurs alliés tatars infligeèrent une lourde défaite à l’armée russe à Konotop. L’Hetmanate se sépara bientôt, mais le Commonwealth, en paix avec la Suède à partir de mai 1660, put maintenant tourner vers l’est."
"On 27 June 1660 Stefan Czarniecki and Paweł Sapieha crushed Ivan Khovansky’s army at Polonka in Lithuania. In Ukraine Stanisław Potocki and Jerzy Lubomirski, with Tatar help, surrounded Vasily Sheremetev’s army at Chudniv; the Cossacks of Yurii Khmelnytsky changed sides, and Sheremetev surrendered in early November. In December 1661 the Russian garrison in Vilnius castle gave up after a long siege.": "Le 27 juin 1660, Stefan Czariecki et Paweł Sapieha ont écrasé l’armée Ivan Khovansky à Polonka en Lituanie. En Ukraine, Stanisław Potocki et Jerzy Lubomirski, avec l’aide du Tatar, encerclent l’armée de Vasily Sheremetev à Chudniv ; les cosaques de Yurii Khmelnytsky changent de camp, et Sheremetev se rend au début de novembre."
