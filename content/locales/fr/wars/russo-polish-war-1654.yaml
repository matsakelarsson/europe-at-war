"1654–1656": "1654–1656"
"Having taken the Cossack Hetmanate under his protection at Pereiaslav, Tsar Alexis went to war with Poland–Lithuania in 1654. Russian armies, joined by Cossacks under Ivan Zolotarenko, poured into the Grand Duchy of Lithuania. They beat Janusz Radziwiłł at Shepeleviche in August, and Smolensk, lost to Lithuania in 1611, surrendered that autumn after a long siege. Polotsk, Vitebsk and Mogilev fell too.": "Après avoir pris le Cosaque Hetmanate sous sa protection à Pereiaslav, Tsar Alexis est allé en guerre avec la Pologne-Lituanie en 1654. Armées russes, rejointes par les Cosaques sous Ivan Zolotarenko, versé dans le Grand Duché de Lituanie. Ils ont battu Janusz Radziwiłł à Shepeleviche en août, et Smolensk, perdu contre la Lituanie en 1611, s’est rendu cet automne après un long siège. Polotsk, Vitebsk et Mogilev sont tombés aussi."
"In 1655 the invaders took Minsk, and on 8 August Vilnius, the capital, fell for the first time in its history. For days soldiers and Cossacks looted the city and killed its people, and the Jewish quarter was burned; an eyewitness’s figures of a 17-day fire and over 20,000 dead are thought exaggerated. Alexis styled himself Grand Duke of Lithuania. When Sweden overran the rest of the Commonwealth that summer, Russia came to see it as the greater threat, and in November 1656 the two sides agreed a truce near Vilnius.": "En 1655, les envahisseurs prirent Minsk, et le 8 août Vilnius, la capitale, tomba pour la première fois de son histoire. Pendant des jours, les soldats et les cosaques pillèrent la ville et tuèrent son peuple, et le quartier juif fut brûlé ; un témoin oculaire d’un incendie de 17 jours et plus de 20 000 morts sont considérés exagérés. Alexis s’appelait Grand-Duc de Lituanie. Lorsque la Suède a envahi le reste du Commonwealth cet été-là, la Russie en est venue à voir la plus grande menace, et en novembre 1656 les deux parties ont convenu d’une trêve près de Vilnius."
