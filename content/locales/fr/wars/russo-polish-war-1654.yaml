"1662–1667": "1662–1667"
"Neither side could finish the war. John II Casimir led an army across the Dnieper in the winter of 1663–1664 but failed before Hlukhiv and had to retreat with heavy losses. Ukraine was now split between rival hetmans on the two banks of the Dnieper, a time Ukrainians call the Ruin, and in 1665–1666 the Commonwealth was paralysed by Jerzy Lubomirski’s rebellion against the king.": "John II Casimir a mené une armée à travers le Dniepr en hiver de 1663–1664 mais a échoué avant Hlukhiv et a dû se retirer avec de lourdes pertes. L’Ukraine est maintenant divisée entre des hetmans rivaux sur les deux rives du Dniepr, une époque où les Ukrainiens appellent la Ruine, et en 1665–1666 le Commonwealth est paralysé par la rébellion de Jerzy Lubomirski."
"At the village of Andrusovo near Smolensk the two sides signed a truce for thirteen and a half years in January 1667. Russia kept Smolensk and the Chernihiv–Seversk lands and gained Ukraine east of the Dnieper, while the Commonwealth kept the right bank and got back Vitebsk, Polotsk and Daugavpils. Kyiv, on the right bank, was to stay Russian for two years only, but it was never returned, and the Eternal Peace of 1686 made the settlement permanent.": "Au village d’Andrusovo près de Smolensk, les deux parties ont signé une trêve pendant treize ans et demi en janvier 1667. La Russie a gardé Smolensk et les terres Chernihiv-Seversk et a gagné l’Ukraine à l’est du Dniepr, tandis que le Commonwealth a conservé la rive droite et est revenu Vitebsk, Polotsk et Daugavpils. Kyiv, sur la rive droite, devait rester russe pendant deux ans seulement, mais il n’a jamais été retourné, et la paix éternelle de 1686 a rendu la colonie permanente."
