"1495–1497": "1495–1497"
"Moscow had swallowed Novgorod in 1478 and inherited its quarrel with Sweden. In 1495 Ivan III, allied with King Hans of Denmark against Sten Sture, sent a large army to besiege Viborg. The commander Knut Posse held out, and the siege is remembered for the “Viborg Bang”, a huge explosion that, according to legend, scattered the attackers.": "Moscou avait avalé Novgorod en 1478 et hérité de sa querelle avec la Suède. En 1495, Ivan III, allié au roi Hans du Danemark contre Sten Sture, envoya une grande armée pour assiéger Viborg. Le commandant Knut Posse tenait, et le siège est rappelé pour le Bang de Viborg, une explosion énorme qui, selon la légende, dispersa les attaquants."
"In August 1496 a Swedish force crossed the Gulf of Finland and stormed the new Russian fortress of Ivangorod opposite Narva. A six-year truce ended the war in March 1497. That same year King Hans defeated Sture and took the Swedish throne, though only for a few years.": "En août 1496, une force suédoise franchit le golfe de Finlande et s’empare de la nouvelle forteresse russe d’Ivangorod face à Narva. Une trêve de six ans mit fin à la guerre en mars 1497."
