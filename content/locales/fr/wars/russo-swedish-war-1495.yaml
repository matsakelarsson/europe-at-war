"A war between Sweden under the regent Sten Sture and Ivan III’s Muscovy, allied with King Hans of Denmark. The Russians besieged Viborg in 1495 and the Swedes stormed Ivangorod in 1496, before a truce in 1497 left the border unchanged.": "Une guerre entre la Suède sous le régent Sten Sture et Ivan III, Muscovy, allié avec le roi Hans du Danemark. Les Russes ont assiégé Viborg en 1495 et les Suédois ont pris Ivangorod en 1496, avant qu’une trêve en 1497 ne quitte la frontière sans changement."
