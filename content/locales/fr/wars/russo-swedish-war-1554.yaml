"Border clashes in Karelia turned into war in 1554. Ivan IV, “the Terrible”, refused to treat Gustav as an equal and made his envoys deal with the governor of Novgorod instead. In 1555 a Swedish army under Admiral Jakob Bagge besieged Nöteborg, but the siege was badly planned and failed.": "Les affrontements à la frontière de la Carélie dégénèrent en guerre en 1554. Ivan IV, dit « le Terrible », refuse de traiter Gustave en égal et oblige ses envoyés à s’adresser au gouverneur de Novgorod. En 1555, une armée suédoise commandée par l’amiral Jakob Bagge assiège Nöteborg, mais le siège, mal préparé, échoue."
"That winter a Russian army struck back, plundering the land around Viborg without trying to take the town. Gustav asked for peace, and the Treaty of Novgorod in 1557 brought a forty-year truce, with the border unchanged.": "Cet hiver-là, une armée russe s’en retourna, pillant les terres autour de Viborg sans essayer de prendre la ville. Gustav demanda la paix, et le traité de Novgorod en 1557 apporta une trêve de quarante ans, avec la frontière inchangée."
