"Gustav III’s attempt to win back land from Russia while it was fighting the Ottomans, which briefly brought Denmark–Norway into the war as Russia’s ally. After sea battles in the Gulf of Finland, including the great Swedish victory at Svensksund, the Treaty of Värälä in 1790 restored the pre-war borders.": "Gustav III tente de regagner la Russie alors qu’elle combattait les Ottomans, qui ont brièvement amené le Danemark-Norvège à la guerre comme allié de la Russie. Après les batailles maritimes dans le golfe de Finlande, y compris la grande victoire suédoise à Svensksund, le traité de Värälä en 1790 rétablit les frontières d’avant-guerre."
