"In 1790 Gustav III tried again to strike at St Petersburg by sea. The Swedish battle fleet and galley fleet, with the king aboard, were trapped by the Russians in the Bay of Viborg for a month. On 3–4 July they broke out through the Russian lines, but lost six ships of the line and four frigates.": "En 1790, Gustav III tenta de nouveau de frapper à Saint-Pétersbourg par la mer. La flotte de combat et la flotte de galères suédoises, avec le roi à bord, furent piégées par les Russes dans la baie de Viborg pendant un mois. Les 3-4 juillet ils éclatèrent par les lignes russes, mais perdirent six navires de la ligne et quatre frégates."
"Days later, on 9–10 July 1790, the Swedish galley fleet turned on its pursuers at Svensksund and won the biggest naval victory in Swedish history, the largest naval battle ever fought in the Baltic. Russia agreed to talk, and the Treaty of Värälä on 14 August 1790 ended the war without any change of borders.": "Quelques jours plus tard, du 9 au 10 juillet 1790, la flotte de galères suédoise se mit en marche à Svensksund et remporta la plus grande victoire navale de l’histoire suédoise, la plus grande bataille navale jamais menée dans la Baltique. La Russie accepta de parler, et le traité de Värälä du 14 août 1790 mit fin à la guerre sans changement de frontières."
