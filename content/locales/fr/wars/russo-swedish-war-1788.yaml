"Gustav III attacked Russia in June 1788 while it was busy fighting the Ottomans, hoping for a quick success. On 17 July the Swedish and Russian battle fleets fought an indecisive battle off Hogland in the Gulf of Finland, and the plan to land near St Petersburg came to nothing. In August officers of the army in Finland signed the Anjala declaration and wrote to Catherine II behind the king’s back.": "Gustav III attaqua la Russie en juin 1788 alors qu’elle était occupée à combattre les Ottomans, espérant un succès rapide. Le 17 juillet, les flottes de combat suédoise et russe menèrent une bataille indécise au large de Hogland dans le golfe de Finlande, et le plan d’atterrissage près de Saint-Pétersbourg n’arriva à rien."
"Denmark–Norway, Russia’s ally, then invaded western Sweden from Norway in September 1788. Within a week the invaders took Uddevalla, Vänersborg and Åmål, but they were stopped at Gothenburg and soon withdrew under British and Prussian pressure. Swedes call it the Theatre War. In 1789 a Russian galley fleet beat the Swedish one at the first Battle of Svensksund on 24 August.": "En une semaine, les envahisseurs ont pris Uddevalla, Vänersborg et Åmål, mais ils ont été arrêtés à Göteborg et se sont rapidement retirés sous la pression britannique et prussienne. Les Suédois l’appellent la guerre de théâtre. En 1789, une flotte russe a battu la Suède lors de la première bataille de Svensksund le 24 août."
