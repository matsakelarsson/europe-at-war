# Some French text was translated automatically.
"Russo-Turkish War of 1676–1681": "Guerre russo-turque de 1676–1681"
"A war between Russia and the Cossack Hetmanate of left-bank Ukraine on one side and the Ottoman Empire and the Crimean Khanate on the other, fought above all for Chyhyryn, the Cossack capital that the Ottoman vassal hetman Petro Doroshenko surrendered to Russian and Cossack forces in 1676. The Ottomans failed to take it in 1677 but took and destroyed it in 1678. The Treaty of Bakhchisarai of 1681, a twenty-year truce, made the Dnieper the border and left Kyiv to Russia.": "Une guerre entre la Russie et le Cosaque Hetmanate de gauche Ukraine d’un côté et l’Empire ottoman et le Khanat de Crimée de l’autre, a combattu surtout pour Chyryn, la capitale du Cosaque que le vassal ottoman hetman Petro Doroshenko s’est livré aux forces russes et cosaques en 1676. Les Ottomans ne l’ont pas prise en 1677 mais l’ont prise et détruite en 1678. Le traité de Bakhchisarai de 1681, une trêve de vingt ans, a fait le Dniepr la frontière et a quitté Kiev à la Russie."
"Also called the Chyhyryn campaigns. Some accounts date the war from 1672, when the Ottomans invaded Podolia.": "Aussi appelé les campagnes de Chyryn. Certains comptes datent de la guerre de 1672, quand les Ottomans ont envahi Podolia."
"The Treaty of Bakhchisarai is dated 3 January 1681 in the Julian calendar used in Russia, 13 January in the Gregorian calendar.": "Le Traité de Bakhchisaraï est daté du 3 janvier 1681 dans le calendrier julien utilisé en Russie, 13 janvier dans le calendrier grégorien."
