"July 1711 – June 1713": "juillet 1711 – juin 1713"
"Peter marched south along the right bank of the Pruth, while a detachment under General Carl Ewald von Rönne, joined by Wallachian troops whose commander Toma Cantacuzino had defied his prince, took the Ottoman port of Brăila on 14 July. On 18–19 July janissaries and Tatars crossed the Pruth and drove back the Russian advance guard, and Peter fell back into a fortified camp at Stănilești. The Ottomans surrounded it. Their assaults were beaten off with heavy losses, but their guns kept the Russians from the river, and the army, fewer than 40,000 Russians and a few thousand Moldavians, was soon short of water and food.": "Pierre marcha vers le sud le long de la rive droite de la Pruth, tandis qu’un détachement sous le général Carl Ewald von Rönne, rejoint par les troupes wallachiennes dont le commandant Toma Cantacuzino avait défié son prince, prit le port ottoman de Brăila le 14 juillet. Les 18 et 19 juillet, les janissaires et les Tatars traversèrent la Pruth et regagnèrent l’avant-garde russe, et Pierre retourna dans un camp fortifié à Stănilești. Les Ottomans l’entourèrent. Leurs assauts furent battus avec de lourdes pertes, mais leurs armes gardèrent les Russes de la rivière, et l’armée, moins de 40 000 Russes et quelques milliers de Moldaves, fut bientôt à court d’eau et de nourriture."
"Peter sent his vice-chancellor, Pyotr Shafirov, to the grand vizier, ready to give up a great deal. Under the Treaty of the Pruth, signed on 23 July, Russia was to hand back Azov, raze Taganrog and other new forts in the south, keep out of Polish affairs and let Charles XII go home. Shafirov and Mikhail Sheremetev, the field marshal’s son, went to Constantinople as hostages, and to Charles’s fury the Russian army was allowed to march away. Peter delayed handing over Azov, the Ottomans declared war twice more, and the Treaty of Adrianople in June 1713 confirmed the terms. Cantemir went into exile in Russia.": "Pierre envoya son vice-chancelier, Pyotr Shafirov, au grand vizir, prêt à abandonner beaucoup. En vertu du traité de la Pruth, signé le 23 juillet, la Russie devait rendre Azov, raze Taganrog et d’autres nouveaux forts dans le sud, se tenir hors des affaires polonaises et laisser Charles XII rentrer chez lui. Shafirov et Mikhail Sheremetev, le fils du maréchal de campagne, se rendirent à Constantinople en otages et à Charles furie l’armée russe fut autorisée à partir. Pierre retarda la remise d’Azov, les Ottomans déclaraient la guerre deux fois plus, et le traité d’Adrianople en juin 1713 confirma les termes. Cantemir s’exila en Russie."
