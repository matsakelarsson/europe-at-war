"November 1710 – July 1711": "novembre 1710 – juillet 1711"
"After his defeat at Poltava in 1709, Charles XII of Sweden took refuge with the Ottomans at Bender on the Dniester. With the Crimean khan Devlet II Giray, he urged Sultan Ahmed III to fight Russia, and when Peter the Great kept demanding that Charles be sent away, the Ottomans declared war on 20 November 1710. Early in 1711 Tatars, Zaporozhian Cossacks under Pylyp Orlyk, the exiled successor of Hetman Mazepa, and Polish supporters of Stanisław Leszczyński raided right-bank Ukraine, but they failed to take Bila Tserkva.": "Après sa défaite à Poltava en 1709, Charles XII de Suède s’est réfugié avec les Ottomans à Bender sur le Dniestr. Avec la Crimée khan Devlet II Giray, il a exhorté Sultan Ahmed III à combattre la Russie, et quand Peter le Grand a continué à exiger que Charles soit renvoyé, les Ottomans ont déclaré la guerre le 20 novembre 1710. Au début de 1711, les Tatars Zaporozhian Cosaques sous la direction de Pylyp Orlyk, le successeur exilé de Hetman Mazepa, et les partisans polonais de Stanisław Leszczyński ont fait une descente en Ukraine, mais ils n’ont pas réussi à prendre Bila Tserkva."
"Peter decided to carry the war to the Danube, hoping the sultan’s Orthodox subjects would rise. On 13 April 1711 at Lutsk he made a treaty with Dimitrie Cantemir, the prince of Moldavia, who promised troops and supplies in return for Russian protection. Constantin Brâncoveanu, prince of Wallachia, held back. In June the Russian army crossed the Dniester and joined Cantemir near Iași, but it was short of food. Field Marshal Boris Sheremetev failed to stop the grand vizier, Baltacı Mehmed Pasha, from crossing the Danube at Isaccea with a far larger Ottoman army.": "Le 13 avril 1711 à Lutsk, il fit un traité avec Dimitrie Cantemir, le prince de Moldavie, qui promit des troupes et des fournitures en échange d’une protection russe. Constantin Brâncoveanu, prince de Wallachie, retenait. En juin l’armée russe a traversé le Dniestr et rejoint Cantemir près de Iași, mais il était à court de nourriture. Le maréchal de campagne Boris Sheremetev n’a pas réussi à arrêter le grand vizier, Baltacı Mehmed Pasha, de traverser le Danube à Isaccea avec une armée ottomane beaucoup plus grande."
