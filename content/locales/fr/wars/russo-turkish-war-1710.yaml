# Some French text was translated automatically.
"Russo-Turkish War of 1710–1711": "Guerre russo-turque de 1710–1711"
"A war that grew out of the Great Northern War, after Charles XII of Sweden took refuge in the Ottoman Empire following his defeat at Poltava. Peter the Great marched into Moldavia in 1711, allied with its prince Dimitrie Cantemir, but was surrounded by a much larger Ottoman army on the Pruth and had to agree to hand back Azov, terms confirmed at Adrianople in 1713.": "Une guerre qui est née de la Grande Guerre du Nord, après que Charles XII de Suède se soit réfugié dans l’Empire ottoman suite à sa défaite à Poltava. Pierre le Grand a marché en Moldavie en 1711, allié avec son prince Dimitrie Cantemir, mais était entouré par une armée ottomane beaucoup plus grande sur la Pruth et a dû accepter de rendre Azov, termes confirmés à Adrianople en 1713."
"Also called the Pruth River Campaign. Further Ottoman declarations of war in 1711–1713 led to no fighting, and some accounts date the war 1710–1713.": "D’autres déclarations de guerre ottomanes en 1711–1713 ne conduisirent à aucun combat, et certains récits datent la guerre de 1710–1713."
"Dates are New Style (Gregorian). Russia used the Julian calendar, eleven days behind, so Russian sources date the Treaty of the Pruth 12 July 1711.": "Les dates sont New Style (Gregorian). La Russie a utilisé le calendrier julien, onze jours derrière, de sorte que les sources russes datent le traité de la Prût 12 Juillet 1711."
"The war is also told briefly, from Sweden’s side, in the Great Northern War.": "La guerre est aussi racontée brièvement, du côté suédois, dans la Grande Guerre du Nord."
