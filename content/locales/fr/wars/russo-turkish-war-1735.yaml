"Stavuchany and the Peace of Belgrade": "Stavuchany et la paix de Belgrade"
"In 1739 Münnich took the war west. He led about 60,000 men across Polish territory and over the Dniester, and on 28 August, near Khotyn, he outflanked and routed an Ottoman and Tatar army under Veli Pasha at Stavuchany. Münnich reported only a handful of dead, but other estimates put Russian casualties at about 2,000. Khotyn surrendered two days later. Münnich crossed the Pruth, entered the Moldavian capital, Iași, on 14 September and pressed the boyars to accept Russian rule.": "En 1739, Münnich prit la guerre à l’ouest. Il conduisit environ 60 000 hommes à travers le territoire polonais et au-dessus du Dniestr, et le 28 août, près de Khotyn, il battit et dirigea une armée ottomane et tatare sous Veli Pacha à Stavuchany. Münnich rapporta seulement quelques morts, mais d’autres estimations firent des victimes russes à environ 2 000. Khotyn rendit deux jours plus tard. Münnich a traversé la Pruth, est entré dans la capitale moldave, Iași, le 14 septembre et a pressé les boyars d’accepter la règle russe."
"Austria, meanwhile, had been beaten at Grocka in July. On 18 September it made peace at Belgrade, giving up Belgrade, northern Serbia and Oltenia. Threatened by Sweden and left on its own, Russia accepted terms the French ambassador, the Marquis de Villeneuve, had negotiated for it, signed in Belgrade the same day and confirmed at Niš on 3 October. Russia kept Azov, but only as a razed fortress in an empty border zone, and it could keep no ships on the Black Sea. Khotyn and Moldavia went back to the Ottomans, and Kabarda in the Caucasus was to stay independent between the two empires.": "L’Autriche, entre-temps, avait été battue à Grocka en juillet. Le 18 septembre elle a fait la paix à Belgrade, abandonnant Belgrade, le nord de la Serbie et Oltenia. Menacée par la Suède et laissée seule, la Russie a accepté les conditions que l’ambassadeur français, le marquis de Villeneuve, avait négociées pour elle, signé à Belgrade le même jour et confirmé à Niš le 3 octobre. La Russie gardait Azov, mais seulement comme une forteresse rasée dans une zone frontalière vide, et elle ne pouvait garder aucun navire sur la mer Noire. Khotyn et la Moldavie retournèrent aux Ottomans, et Kabarda dans le Caucase devait rester indépendant entre les deux empires."
