"1735–1736": "1735–1736"
"Crimean Tatar raids on the Hetmanate, and the khan’s march across the North Caucasus in 1735 to fight Persia for the Ottomans, gave Russia its pretext. The Polish succession had been settled in Russia’s favour, and Persia had become an ally when Russia handed back its Caspian conquests. Empress Anna’s government struck first. A raid on the Crimea under General Mikhail Leontiev set out too late in October 1735, was caught by cold and snow on the steppe and turned back, having lost some 9,000 of its 40,000 men.": "Les raids tatars de Crimée sur l’Hetmanate, et les khans marchent à travers le Caucase du Nord en 1735 pour combattre la Perse pour les Ottomans, donne son prétexte à la Russie. La succession polonaise avait été établie en faveur de la Russie, et la Perse était devenue un allié lorsque la Russie a remis ses conquêtes Caspiennes. Un raid sur la Crimée sous le commandement du général Mikhail Leontiev a commencé trop tard en octobre 1735, a été pris par le froid et la neige sur la steppe et retourné en arrière, ayant perdu quelque 9 000 de ses 40 000 hommes."
"In the spring of 1736 Field Marshal Burkhard Christoph von Münnich led about 54,000 men south along the Dnieper. They stormed the Perekop lines at the end of May and, for the first time, a Russian army entered the Crimea. It burned Gözleve (Yevpatoria) and the khan’s capital, Bakhchisarai, but with dysentery spreading and food and water short Münnich turned back after a month. About half his army was lost, only some 2,000 men of them in battle. Meanwhile General Peter Lacy, helped by the Don flotilla, took Azov, and another detachment took Kinburn at the mouth of the Dnieper.": "Au printemps de 1736, le maréchal Burkhard Christoph von Münnich conduisit environ 54 000 hommes au sud le long du Dniepr. Ils s’emparèrent des lignes de Perekop à la fin du mois de mai et, pour la première fois, une armée russe entra dans la Crimée. Il brûla Gözleve (Yevpatoria) et la capitale du khan, Bakhchisarai, mais avec la dysenterie se répandit et la nourriture et l’eau court Münnich retourné après un mois. Environ la moitié de son armée a été perdue, seulement quelque 2000 hommes dans le combat. Pendant ce temps, le général Peter Lacy, aidé par la flottille Don, prit Azov et un autre détachement prit Kinburn à l’embouchure du Dniepr."
