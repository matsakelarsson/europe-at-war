"1737–1738": "1737–1738"
"In 1737 Münnich marched on Ochakov, the Ottoman fortress where the Dnieper and the Bug flow into the sea, with about 70,000 men. On the third day of the siege, in July, red-hot shot set the town on fire, the powder magazine blew up, killing thousands, and the garrison of some 20,000 surrendered, though many were cut down in the slaughter that followed. An Ottoman attempt to retake the fortress that autumn failed. Lacy invaded the Crimea again from the east, bridging the Henichesk strait with casks to march down the Arabat Spit behind the khan’s army at Perekop, and burned Karasubazar before lost supplies and sickness drove him back.": "En 1737, Münnich marcha sur Ochakov, la forteresse ottomane où le Dniepr et le Bug s’écoulent dans la mer, avec environ 70 000 hommes. Le troisième jour du siège, en juillet, un coup de feu rouge a mis le feu à la ville, la poudrière a explosé, tuant des milliers, et la garnison d’environ 20 000 personnes s’est rendue, bien que beaucoup aient été abattus dans l’abattage qui a suivi. Une tentative ottomane de reprendre la forteresse cet automne échoua. Lacy envahit de nouveau la Crimée de l’est, en traversant le détroit d’Henichek avec des fûts pour marcher sur la craque Arabat derrière l’armée du khan à Perekop, et il brûla Karasubazar avant de perdre des vivres et la maladie le ramène."
"Austria entered the war that summer, but after early gains in Serbia its armies were beaten in Bosnia, and peace talks at Nemyriv in Poland broke down. In 1738 plague spread through the Black Sea lands and into Moldavia, Poland and Ukraine. Münnich’s march towards the Dniester came to nothing, and Lacy’s third raid into the Crimea, across the shallows of the Syvash, achieved little. In September the Russians abandoned Ochakov and Kinburn rather than lose their garrisons to plague and a new Ottoman attack.": "L’Autriche est entrée en guerre cet été-là, mais après les premiers progrès en Serbie ses armées ont été battues en Bosnie, et les pourparlers de paix à Nemyriv en Pologne se sont effondrés. En 1738, la peste s’est propagée dans les terres de la mer Noire et en Moldavie, en Pologne et en Ukraine. En septembre, les Russes ont abandonné Ochakov et Kinburn plutôt que de perdre leurs garnisons pour la peste et une nouvelle attaque ottomane."
