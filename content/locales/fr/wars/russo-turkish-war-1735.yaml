"Russo-Turkish War of 1735–1739": "Guerre russo-turque de 1735–1739"
"A war in which Russia, joined by the Habsburg Monarchy in 1737, fought the Ottoman Empire and the Crimean Khanate for the northern shore of the Black Sea. Russian armies took Azov and Ochakov, burned the Crimean capital and beat the Ottomans at Stavuchany in 1739, but lost tens of thousands of men to disease. After Austria made a separate peace, the treaties of Belgrade and Niš left Russia little more than Azov, with its walls razed, and no right to keep ships on the Black Sea.": "Une guerre dans laquelle la Russie, rejoint par la monarchie des Habsbourg en 1737, combat l’Empire ottoman et le Khanat de Crimée pour la rive nord de la mer Noire. Les armées russes prennent Azov et Ochakov, brûlent la capitale de Crimée et battent les Ottomans à Stavuchany en 1739, mais perdent des dizaines de milliers d’hommes à la maladie. Après que l’Autriche eut fait une paix séparée, les traités de Belgrade et de Niš ont quitté la Russie un peu plus qu’Azov, avec ses murs rasés, et aucun droit de garder des navires sur la mer Noire."
"Dates are New Style (Gregorian). Russia used the Julian calendar, eleven days behind, so Russian sources date the battle of Stavuchany 17 August 1739, for example, and the Treaty of Belgrade 18 (29) September.": "Les dates sont New Style (Gregorian). La Russie a utilisé le calendrier julien, onze jours derrière, de sorte que les sources russes datent la bataille de Stavuchany 17 août 1739, par exemple, et le traité de Belgrade 18 (29) Septembre."
"Austria’s war of 1737–1739 against the Ottomans in Serbia, Bosnia and Wallachia is only touched on here.": "La guerre d’Autriche de 1737–1739 contre les Ottomans en Serbie, en Bosnie et en Wallachie n’est abordée ici que."
