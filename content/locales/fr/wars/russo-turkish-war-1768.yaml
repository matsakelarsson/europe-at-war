# Some French text was translated automatically.
"Russo-Turkish War of 1768–1774": "Guerre russo-turque de 1768–1774"
"A war between the Russian Empire and the Ottoman Empire, with its vassal the Crimean Khanate, that grew out of Russia’s intervention in Poland–Lithuania. Russian armies overran Moldavia, Wallachia and the Crimea, and a Russian fleet sent from the Baltic destroyed the Ottoman fleet at Chesma. At Küçük Kaynarca in 1774 the Ottomans gave up the Crimean Khanate, which became independent, and ceded Kerch, Kinburn and Kabarda to Russia.": "Une guerre entre l’Empire russe et l’Empire ottoman, avec son vassal le khanate de Crimée, qui est née de l’intervention de la Russie en Pologne-Lituanie. Les armées russes ont envahi la Moldavie, la Wallachie et la Crimée, et une flotte russe envoyée de la Baltique a détruit la flotte ottomane à Chesma. À Küçük Kaynarca, en 1774, les Ottomans abandonnèrent le khanat de Crimée, devenu indépendant, et céda Kerch, Kinburn et Kabarda à la Russie."
"Dates are New Style (Gregorian). Russia used the Julian calendar, eleven days behind, so Russian sources date the battle of Kagul, for example, 21 July 1770 and the Treaty of Küçük Kaynarca 10 July 1774.": "Les dates sont New Style (Gregorian). La Russie a utilisé le calendrier julien, onze jours derrière, de sorte que les sources russes datent la bataille de Kagul, par exemple, le 21 juillet 1770 et le traité de Küçük Kaynarca 10 juillet 1774."
"Russia’s parallel campaigns in Georgia (1769–1772) and the Russian fleet’s actions off Syria and Lebanon are not followed here.": "Russie Les campagnes parallèles en Géorgie (1769-1772) et les actions de la flotte russe au large de la Syrie et du Liban ne sont pas suivies ici."
"Place names are given in their present-day forms, except for a few towns better known by their historical names, such as Kefe (Feodosia), Kiliya (Kiliia) and Akkerman (Bilhorod-Dnistrovskyi).": "Les noms de lieux sont donnés sous leur forme actuelle, à l’exception de quelques villes mieux connues par leurs noms historiques, comme Kefe (Féodosie), Kiliya (Kilia) et Akkerman (Bilhorod-Dnistrovskyi)."
