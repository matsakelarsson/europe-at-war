"1771–1772": "1771–1772"
"In June 1771 the Second Army, now under Prince Vasily Dolgorukov, stormed the Perekop lines and entered the Crimea, while another column came down the Arabat Spit from the north-east. On 10 July it beat an Ottoman and Tatar army outside Kefe (Feodosia), the main Ottoman stronghold, and the Ottomans then abandoned Kerch, Yenikale, Arabat and Balaklava. Khan Selim III Giray fled to Constantinople, and the Ottoman garrisons were driven out of the peninsula. Dolgorukov was later given the honorary surname Krymsky, “of the Crimea”.": "En juin 1771, la deuxième armée, maintenant sous le prince Vasily Dolgoroukov, s’empare des lignes du Perekop et entre dans la Crimée, tandis qu’une autre colonne descend le Spit Arabat du nord-est. Le 10 juillet, elle bat une armée ottomane et tatare à l’extérieur de Kéfe (Féodose), principale forteresse ottomane, puis les Ottomans abandonnent Kerch, Yenikale, Arabat et Balaklava. Khan Selim III Giray s’enfuit à Constantinople, et les garnisons ottomanes furent chassées de la péninsule. Dolgoroukov reçut plus tard le nom honorifique de famille Krymsky, \"de la Crimée\"."
"Crimean notables chose a new khan acceptable to Russia, Sahib II Giray, and in November 1772 at Karasubazar he signed a treaty that made the khanate independent of the Ottomans under Russian protection, with Russian garrisons in Kerch and Yenikale. Meanwhile plague, brought from the Danube front, spread to Moscow and killed tens of thousands there in 1770–1772; in September 1771 it set off a riot in which the city’s archbishop was killed. A truce was agreed in May 1772, but peace talks at Focșani and Bucharest broke down over the Crimea.": "Les notables de Crimée ont choisi un nouveau khan acceptable pour la Russie, Sahib II Giray, et en novembre 1772 à Karasubazar il a signé un traité qui a rendu le khanate indépendant des Ottomans sous protection russe, avec les garnisons russes à Kerch et Yenikale. Pendant ce temps, la peste, apportée du front du Danube, s’est étendue à Moscou et y a tué des dizaines de milliers en 1770–1772 ; en septembre 1771 elle a déclenché une émeute au cours de laquelle l’archevêque de la ville a été tué. Une trêve a été convenue en mai 1772, mais les pourparlers de paix à Focșani et Bucarest ont éclaté sur la Crimée."
