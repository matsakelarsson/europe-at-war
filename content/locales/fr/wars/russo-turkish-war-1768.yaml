"1769–1770": "1769–1770"
"To strike the Ottomans from another side, Catherine sent squadrons of the Baltic Fleet around Europe to the Mediterranean, the first Russian fleet ever to sail there. Count Alexei Orlov was to raise the Greeks against the sultan, and British officers served in the fleet. In February 1770 Russian ships landed troops in the Mani, and Greeks rose across the Peloponnese. But the Russians were too few, the siege of Methoni failed, and the rising collapsed. Albanian irregulars brought in by the Ottomans took savage revenge on the Greek population.": "Pour frapper les Ottomans d’un autre côté, Catherine envoya des escadrons de la flotte baltique autour de l’Europe vers la Méditerranée, la première flotte russe à y naviguer. Le comte Alexei Orlov devait élever les Grecs contre le sultan, et des officiers britanniques servirent dans la flotte. Mais les Russes étaient trop peu nombreux, le siège de Methoni a échoué, et la montée s’est effondrée."
"On 5 July the fleet, under Orlov with Admiral Grigory Spiridov and Rear Admiral John Elphinstone, attacked the Ottoman fleet in the strait between Chios and the Anatolian coast. In the fighting the Russian Sviatoi Evstafii and the Ottoman flagship blew up, and the Ottomans withdrew into the crowded bay of Çeşme. In the night of 6–7 July Russian ships bombarded them and sent in fire ships. Almost the entire Ottoman fleet burned, and thousands of sailors died. The victory gave Russia control of the Aegean, but it could not force the Dardanelles, and its fleet stayed in the islands, based on Paros, until the end of the war.": "Le 5 juillet, sous la direction d’Orlov, avec l’amiral Grigory Spiridov et le contre-amiral John Elphinstone, la flotte ottomane s’attaqua dans le détroit entre Chios et la côte anatolienne. Dans la nuit du 6 au 7 juillet, des navires russes les bombardèrent et envoyèrent des pompiers. Presque toute la flotte ottomane brûla, et des milliers de marins moururent. La victoire donna à la Russie le contrôle de l’Égée, mais elle ne put forcer les Dardanelles, et sa flotte resta dans les îles, sur la base de Paros, jusqu’à la fin de la guerre."
