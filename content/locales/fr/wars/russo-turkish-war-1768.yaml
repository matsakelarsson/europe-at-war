"June – November 1770": "juin – novembre 1770"
"In 1770 Field Marshal Pyotr Rumyantsev, now in command of the First Army, marched south along the Pruth with fewer than 40,000 men. He drove back the khan’s Tatars at Ryabaya Mogila in June, and on 18 July he routed an army of some 65,000 Tatars and 15,000 Ottomans under Qaplan II Giray on the Larga, a tributary of the Pruth. The grand vizier, Ivazzade Halil Pasha, then crossed the Danube with the main Ottoman army, put at 100,000–150,000 men, and advanced to the Kagul, near today’s Cahul, to attack him.": "En 1770, le maréchal de campagne Pyotr Rumyantsev, qui commandait la Première Armée, marcha vers le sud le long de la Pruth avec moins de 40 000 hommes. En juin, il conduit les khans Tatars à Ryabaya Mogila et, le 18 juillet, il dirige une armée de quelque 65 000 tatars et 15 000 Ottomans sous Qaplan II Giray sur la Larga, un affluent du Pruth. Le grand vizier, Ivazzade Halil Pacha, a ensuite traversé le Danube avec la principale armée ottomane, mis de 100 000 à 150 000 hommes, et s’est avancé vers le Kagul, près d’aujourd'hui de Cahul, pour l’attaquer."
"Rumyantsev struck first. On 1 August he advanced with about 17,000 men in squares, while the rest of his army guarded his supplies and his rear against the Tatars. His artillery broke up the Ottoman attacks, and his infantry stormed the Ottoman camp. The Ottoman army fled to the Danube, where many men drowned trying to escape. In the following months the Russians took the Danube fortresses of Izmail, Kiliya and Brăila and the port of Akkerman, and on 27 September Count Pyotr Panin’s Second Army stormed Bender on the Dniester after a two-month siege. About 7,000 of its defenders were killed, and the Russians lost some 6,000 dead and wounded.": "Le 1er août, il avança avec environ 17 000 hommes sur des places, tandis que le reste de son armée gardait ses provisions et son arrière contre les Tatars. Son artillerie rompit les attaques ottomanes, et son infanterie s’empare du camp ottoman. L’armée ottomane s’enfuit au Danube où beaucoup d’hommes se noyaient en tentant de s’échapper. Au cours des mois suivants, les Russes ont pris les forteresses du Danube d’Izmail, Kiliya et Brăila et le port d’Akkerman, et le 27 septembre, le comte Pyotr Panin. Deuxième armée a pris Bender sur le Dniestr après un siège de deux mois. Environ 7.000 de ses défenseurs ont été tués, et les Russes ont perdu environ 6.000 morts et blessés."
