"1768–1769": "1768–1769"
"In 1768 Russian troops in Poland–Lithuania were fighting the Bar Confederation, nobles in arms against Russian domination, while a Cossack and peasant rising, the Koliivshchyna, swept right-bank Ukraine with massacres of Poles and Jews, above all at Uman. That summer Cossacks pursuing confederates crossed into the Ottoman border town of Balta and, according to Ottoman reports, sacked it and killed many of its people. Russia denied responsibility, but the confederates and the French ambassador were urging war, and on 6 October Sultan Mustafa III had the Russian envoy, Aleksei Obreskov, imprisoned. It amounted to a declaration of war.": "En 1768, les troupes russes en Pologne-Lituanie combattaient la Confédération du barreau, les nobles en armes contre la domination russe, tandis qu’un cosaque et un paysan se levaient, les Koliivshchyna, balayaient l’Ukraine à droite avec des massacres de Polonais et de Juifs, surtout à Uman. Cet été, les cosaques poursuivant des confédérés ont traversé la ville frontalière ottomane de Balta et, selon les rapports ottomans, l’ont renvoyé et tué beaucoup de son peuple. La Russie a nié sa responsabilité, mais les confédérés et l’ambassadeur français exhortaient à la guerre, et le 6 octobre, le Sultan Mustafa III a fait emprisonner l’envoyé russe, Aleksei Obreskov, ce qui équivaut à une déclaration de guerre."
"In January 1769 the Crimean khan, Qırım Giray, led some 70,000 Tatars, Nogais and Ottoman troops into New Serbia, the Russian frontier province on the steppe of central Ukraine, burning villages and carrying off many captives. It proved to be the last great Tatar raid. That year Russian armies moved south. After a long struggle the Ottomans abandoned Khotyn in September, and Russian troops entered Iași in October and Bucharest in November, while a second army took over Azov and Taganrog. In both Moldavia and Wallachia many boyars swore allegiance to Catherine II.": "En janvier 1769, le Khan de Crimée, Qırım Giray, a conduit quelque 70 000 Tatars, Nogais et troupes ottomanes en Nouvelle Serbie, la province frontalière russe sur la steppe du centre de l’Ukraine, des villages brûlants et transportant de nombreux captifs. Après une longue lutte, les Ottomans ont abandonné Khotyn en septembre, et les troupes russes sont entrées à Iași en octobre et Bucarest en novembre, tandis qu’une seconde armée a repris Azov et Taganrog."
