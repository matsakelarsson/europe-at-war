"1773–1774": "1773–1774"
"In 1773 Rumyantsev crossed the Danube but failed before Silistra and withdrew, and that autumn Pugachev’s rebellion broke out in the east of Russia. The new sultan, Abdul Hamid I, decided to fight on. In June 1774 Rumyantsev crossed the river again. On 20 June Alexander Suvorov and Mikhail Kamensky met an Ottoman army of about 40,000 at Kozludzha. Suvorov attacked at once and routed it, though only some 8,000 Russians were engaged, and the Ottomans fled to Shumen, where Rumyantsev blockaded the grand vizier, Muhsinzade Mehmed Pasha.": "En 1773, Rumyantsev traversa le Danube mais échoua avant Silistra et se retira. L’automne, la rébellion de Pugachev fut déclenchée dans l’est de la Russie. Le nouveau sultan, Abdul Hamid Ier, décida de combattre. En juin 1774, Rumyantsev traversa à nouveau la rivière. Suvorov attaqua immédiatement et l’attaqua, même si seulement 8 000 Russes étaient engagés, et les Ottomans s’enfuirent à Shumen, où Rumyantsev barricade le grand vizier, Muhsinzade Mehmed Pacha."
"On 21 July 1774 the two sides made peace at the village of Küçük Kaynarca near Silistra. The Crimean Khanate became independent of the Ottoman Empire, though the sultan kept religious authority over its Muslims as caliph. Russia gained Kerch and Yenikale on the strait into the Sea of Azov, Kinburn at the mouth of the Dnieper with a strip of steppe between the Dnieper and the Bug, full possession of Azov, and Kabarda in the North Caucasus. Its merchant ships won the right to sail through the Straits, it was paid 4.5 million rubles, and it gained a voice in the affairs of the sultan’s Orthodox subjects. Moldavia and Wallachia were returned.": "Le 21 juillet 1774, les deux parties firent la paix dans le village de Küçük Kaynarca près de Silistra. Le khanate de Crimée devint indépendant de l’Empire ottoman, bien que le sultan gardât l’autorité religieuse sur ses musulmans comme calife. La Russie a gagné Kerch et Yenikale sur le détroit dans la mer d’Azov, Kinburn à l’embouchure du Dniepr avec une bande de steppe entre le Dniepr et le Bug, pleine possession d’Azov, et Kabarda dans le Caucase du Nord. Ses navires marchands ont gagné le droit de naviguer à travers le détroit, il a été payé 4,5 millions de roubles, et il a gagné une voix dans les affaires des sultans sujets orthodoxes."
