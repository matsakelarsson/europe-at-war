"Focșani and Rymnik": "Focșani et Rymnik"
"In 1789 the Ottomans, under a new sultan, Selim III, struck at the Austrians in Moldavia. Their commander, Prince Josias of Saxe-Coburg, called on Suvorov, whose corps lay at Bârlad. Suvorov marched about 60 km in little more than a day with 7,000 men, and on 1 August the allies routed some 30,000 Ottomans under Osman Pasha at Focșani. In September the grand vizier, Cenaze Hasan Pasha, advanced against Coburg with up to 100,000 men. Suvorov came again, and on 22 September about 25,000 Russians and Austrians attacked and broke the Ottoman army on the Râmnic river. Suvorov was made a count, with the title Rymniksky.": "En 1789, les Ottomans, sous un nouveau sultan, Selim III, frappent les Autrichiens en Moldavie. Leur commandant, le prince Josias de Saxe-Coburg, fait appel à Suvorov, dont le corps se trouvait à Bârlad. Suvorov marchait environ 60 km en un peu plus d’une journée avec 7 000 hommes, et le 1er août les alliés acheminaient quelque 30 000 Ottomans sous Osman Pacha à Focșani. En septembre le grand vizier, Cénaze Hasan Pacha, s’est avancé contre Coburg avec jusqu’à 100 000 hommes. Suvorov est revenu, et le 22 septembre environ 25 000 Russes et Autrichiens ont attaqué et brisé l’armée ottomane sur la rivière Râmnic. Suvorov a été fait un compte, avec le titre Rymniksky."
"The Austrians went on to take Belgrade and occupy Wallachia, entering Bucharest in November. Potemkin’s army cleared the Ottomans from the Dniester. On 25 September a detachment under José de Ribas took the castle of Hajibey on the coast, where the city of Odesa was founded in 1794, Akkerman surrendered in October, and Bender gave up without a fight in November.": "Les Autrichiens prirent Belgrade et occupèrent la Wallachie, entrant à Bucarest en novembre. L’armée de Potemkine délivra les Ottomans du Dniestr. Le 25 septembre, un détachement sous José de Ribas prit le château de Hajibey sur la côte, où la ville d’Odesa fut fondée en 1794, Akkerman se rendit en octobre, et Bender abandonna sans combat en novembre."
