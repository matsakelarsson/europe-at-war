"Russo-Turkish War of 1787–1792": "Guerre russo-turque de 1787–1792"
"An attempt by the Ottoman Empire to win back the Crimea, annexed by Russia in 1783, against Russia and, from 1788 to 1791, the Habsburg Monarchy. Russian armies and the new Black Sea Fleet won at Kinburn, Ochakov, Focșani, Rymnik, Izmail and at sea, and at Jassy in 1792 the Ottomans recognised the annexation and ceded the land between the Southern Bug and the Dniester.": "Une tentative de l’Empire ottoman pour reconquérir la Crimée, annexée par la Russie en 1783, contre la Russie et, de 1788 à 1791, la Monarchie des Habsbourg. Les armées russes et la nouvelle flotte de la mer Noire ont gagné à Kinburn, Ochakov, Focșani, Rymnik, Izmail et en mer, et à Jassy en 1792 les Ottomans ont reconnu l’annexion et cédé la terre entre le Bug du Sud et le Dniestr."
"Dates are New Style (Gregorian). Russia used the Julian calendar, eleven days behind, so Russian sources date the storming of Izmail 11 December 1790 and the Treaty of Jassy 29 December 1791.": "Les dates sont New Style (Gregorian). La Russie a utilisé le calendrier julien, onze jours derrière, de sorte que les sources russes datent l’assaut d’Izmail 11 Décembre 1790 et le traité de Jassy 29 Décembre 1791."
"Austria’s campaigns against the Ottomans in Serbia and Bosnia are not followed here. Sweden’s attack on Russia in 1788 is told in the Russo-Swedish War of 1788–1790.": "Les campagnes de l’Autriche contre les Ottomans en Serbie et en Bosnie ne sont pas suivies ici. La Suède attaque la Russie en 1788 est racontée dans la guerre russo-suédoise de 1788–1790."
