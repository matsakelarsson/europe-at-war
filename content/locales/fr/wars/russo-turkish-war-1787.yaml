"1787–1788": "1787–1788"
"Russia had annexed the Crimean Khanate in 1783, and in the summer of 1787 Catherine II toured her new southern lands and the Crimea with her ally, Emperor Joseph II. In Constantinople the war party, encouraged by the British and French ambassadors, demanded that Russia give up the Crimea, and in August the Porte imprisoned the Russian ambassador, Yakov Bulgakov. On 12 October about 6,000 Ottoman troops landed on the Kinburn spit opposite Ochakov, at the mouth of the Dnieper. Alexander Suvorov, wounded twice in the fighting, drove them back into the sea.": "La Russie avait annexé le khanat de Crimée en 1783, et à l’été de 1787 Catherine II tourna ses nouvelles terres du sud et la Crimée avec son allié, l’empereur Joseph II. À Constantinople le parti de guerre, encouragé par les ambassadeurs britanniques et français, exigeait que la Russie abandonne la Crimée, et en août la Porte emprisonnait l’ambassadeur russe Yakov Boulgakov. Le 12 octobre, environ 6 000 soldats ottomans ont atterri sur le Kinburn craché face à Ochakov, à l’embouchure du Dniepr. Alexandre Suvorov, blessé deux fois dans les combats, les a ramenés à la mer."
"Austria entered the war in February 1788. That summer Prince Grigory Potemkin laid siege to Ochakov. In June Russian oared ships under the Prince of Nassau-Siegen, with John Paul Jones commanding the sailing squadron, beat the Ottoman flotilla in the Dnieper estuary, and on 14 July the young Sevastopol squadron under Marko Voinovich and Fyodor Ushakov beat the Ottoman fleet off Fidonisi (Snake Island). Potemkin put off the assault for months while his troops suffered from disease and cold, and Ochakov was finally stormed on 17 December. Most of the garrison and many of the townspeople were killed. In the west, Russian and Austrian troops took Khotyn in September.": "L’Autriche entra dans la guerre en février 1788. Cet été-là, le prince Grigory Potemkin assiégea Ochakov. En juin, des navires russes sous le prince de Nassau-Siegen, avec John Paul Jones commandant l’escadron de voile, ont battu la flottille ottomane dans l’estuaire du Dniepr, et le 14 juillet, le jeune escadron Sébastopol sous Marko Voinovich et Fyodor Ushakov ont battu la flotte ottomane au large de Fidonisi (île du serpent). Potemkine a repoussé l’assaut pendant des mois alors que ses troupes souffraient de maladies et de froid, et Ochakov a finalement été pris d’assaut le 17 décembre. La plupart de la garnison et beaucoup des habitants ont été tués."
