"1790–1792": "1790–1792"
"After Joseph II died in 1790, Austria agreed a truce and left the war at Sistova in 1791. At sea Ushakov beat the Ottoman fleet in the Kerch Strait in July 1790 and off Tendra in September. In December Potemkin sent Suvorov to Izmail, the great Ottoman fortress on the Danube, which had held out against a Russian siege. Suvorov drilled his troops on mock ramparts, sent the commander an ultimatum, and on 22 December stormed the walls. Almost the whole garrison, more than 26,000 men, was killed or wounded, and many townspeople died in the sack that followed. Russian losses were at least 4,000.": "Après la mort de Joseph II en 1790, l’Autriche s’accorda une trêve et laissa la guerre à Sistova en 1791. En mer, Ushakov battit la flotte ottomane dans le détroit de Kerch en juillet 1790 et au large de Tendra en septembre. Suvorov forait ses troupes sur de faux remparts, envoyait un ultimatum au commandant et, le 22 décembre, s’empare des murs. Presque toute la garnison, plus de 26 000 hommes, fut tuée ou blessée, et beaucoup de citadins moururent dans le sac qui suivit."
"In 1791 Prince Nikolai Repnin beat the grand vizier at Măcin on 9 July, Ushakov beat the Ottoman fleet off Cape Kaliakra on 11 August, and in the Kuban Ivan Gudovich stormed Anapa. Britain threatened war to make Russia give up Ochakov, but backed down. Potemkin died near Iași in October, and Alexander Bezborodko signed the Treaty of Jassy on 9 January 1792. The Ottomans recognised the annexation of the Crimea and ceded Yedisan, the land between the Bug and the Dniester with Ochakov, making the Dniester the border. Russia gave back its other conquests, including Bender, Akkerman and Izmail.": "En 1791, le prince Nikolai Repnin battit le grand vizier à Măcin le 9 juillet, Ushakov battit la flotte ottomane au large du cap Kaliakra le 11 août, et dans le Kuban Ivan Gudovitch prit Anapa. Potemkin mourut près d’Iași en octobre, et Alexandre Bezborodko signa le traité de Jassy le 9 janvier 1792. Les Ottomans reconnurent l’annexion de la Crimée et céda Yedisan, la terre entre le Bug et le Dniestr avec Ochakov, faisant du Dniestr la frontière. La Russie rendit ses autres conquêtes, y compris Bender, Akkerman et Izmail."
