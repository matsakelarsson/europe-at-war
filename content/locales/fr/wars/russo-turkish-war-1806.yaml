"1806–1809": "1806–1809"
"In August 1806 Sultan Selim III, encouraged by France after Napoleon’s victory at Austerlitz, deposed the pro-Russian princes of Moldavia and Wallachia. In November a Russian army under General Ivan Michelson crossed the Dniester, took Khotyn and Bender and occupied both principalities, and in December the Ottomans declared war. In Serbia, where rebels led by Karađorđe had been fighting Ottoman forces since 1804, Russia found an ally. The rebels took Belgrade that winter, and Russian troops fought beside them from 1807.": "En août 1806, le sultan Selim III, encouragé par la France après la victoire de Napoléon à Austerlitz, déposa les princes pro-russes de Moldavie et de Wallachie. En novembre, une armée russe sous la direction du général Ivan Michelson traversa le Dniestr, prit Khotyn et Bender et occupa les deux principautés, et en décembre les Ottomans déclaraient la guerre. En Serbie, où les rebelles dirigés par Kara-or-Est combattaient les forces ottomanes depuis 1804, la Russie a trouvé un allié. Les rebelles ont pris Belgrade cet hiver et les troupes russes se sont battues à leurs côtés à partir de 1807."
"In June 1807 a small Russian force under Mikhail Miloradovich stopped an Ottoman army marching on Bucharest at Obilești, and in the Caucasus Count Ivan Gudovich routed a much larger Ottoman army on the Arpachay. At sea, Vice-Admiral Dmitry Senyavin’s squadron blockaded the Dardanelles and beat the Ottoman fleet off the straits in May and near Mount Athos in July. After making peace with Napoleon at Tilsit, Russia agreed to an armistice in August 1807. When fighting resumed in 1809, Prince Pyotr Bagration took Izmail but failed before Silistra.": "En juin 1807, une petite force russe sous Mikhail Miloradovich arrêta une armée ottomane qui marchait sur Bucarest à Obilești et, dans le Caucase, le comte Ivan Gudovich dirigea une armée ottomane beaucoup plus grande sur l’Arpachay. Après avoir fait la paix avec Napoléon à Tilsit, la Russie accepta un armistice en août 1807. Lorsque les combats reprirent en 1809, le prince Pyotr Bagration prit Izmail mais échoua devant Silistra."
