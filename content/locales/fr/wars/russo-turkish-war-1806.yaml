"1810–1812": "1810–1812"
"In 1810 General Nikolay Kamensky crossed into Bulgaria and took Silistra, but his assaults on Shumla and Ruse failed with heavy losses. After he routed an Ottoman force at Batin in September, Ruse surrendered. In the Caucasus Russian forces took Sukhum on the Abkhazian coast, and Russia deposed King Solomon II of Imereti and annexed his kingdom. Kamensky fell ill and died early in 1811. With war against Napoleon looming, Alexander I gave the command to Mikhail Kutuzov and told him to make peace quickly.": "En 1810, le général Nikolay Kamensky a traversé la Bulgarie et pris Silistra, mais ses attaques sur Shumla et Ruse ont échoué avec de lourdes pertes. Après avoir conduit une force ottomane à Batin en septembre, Ruse s’est rendu. Dans le Caucase les forces russes ont pris Sukhum sur la côte abkhaze, et la Russie a déposé le roi Salomon II d’Imereti et annexé son royaume. Kamensky est tombé malade et est mort au début de 1811. Avec la guerre contre Napoléon, Alexandre Ier donna le commandement à Mikhail Kutuzov et lui dit de faire rapidement la paix."
"Kutuzov beat the grand vizier, Ahmed Pasha, outside Ruse on 4 July 1811, then gave up the fortress and drew back across the Danube. When some 36,000 Ottoman troops followed him over the river, a Russian force crossed behind them, took their camp and cut them off at Slobozia. Hungry and sick, the survivors surrendered at the end of the year. By the Treaty of Bucharest, signed on 28 May 1812, Russia handed back Wallachia, western Moldavia and its gains in the Caucasus except Sukhum, but kept the eastern half of Moldavia, which it named Bessarabia. The Serbs were promised self-government, but in 1813 Ottoman forces reconquered Serbia.": "Kutuzov battit le grand vizier Ahmed Pasha, en dehors de Ruse, le 4 juillet 1811, puis abandonna la forteresse et retraça le Danube. Quand quelque 36 000 soldats ottomans l’ont suivi sur la rivière, une force russe a traversé derrière eux, pris leur camp et les a coupés à Slobozia. Faim et malade, les survivants se sont rendus à la fin de l’année. Par le traité de Bucarest, signé le 28 mai 1812, la Russie a remis la Wallachie, la Moldavie occidentale et ses gains dans le Caucase sauf Sukhum, mais a gardé la moitié orientale de la Moldavie, qu’elle a nommée Bessarabia. Les Serbes ont été promis l’autonomie, mais en 1813 les forces ottomanes ont reconquis la Serbie."
