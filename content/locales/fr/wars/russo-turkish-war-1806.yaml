# Some French text was translated automatically.
"Russo-Turkish War of 1806–1812": "Guerre russo-turque de 1806–1812"
"A war between the Russian Empire and the Ottoman Empire, fought mainly on the lower Danube, at sea in the Aegean and in the Caucasus, in which Russia occupied Moldavia and Wallachia. Kutuzov’s victory at Ruse and Slobozia in 1811 led to the Treaty of Bucharest, signed weeks before Napoleon’s invasion of Russia, which gave Russia Bessarabia, the land between the Prut and the Dniester.": "Une guerre entre l’Empire russe et l’Empire ottoman, a principalement combattu sur le Danube inférieur, en mer dans la mer Égée et dans le Caucase, où la Russie occupait la Moldavie et la Wallachie. La victoire de Kutuzov à Ruse et Slobozia en 1811 a conduit au traité de Bucarest, signé des semaines avant l’invasion de Napoléon de la Russie, qui a donné à la Russie Bessarabia, le pays entre le Prut et le Dniestr."
"Dates are New Style (Gregorian). Russian accounts use the Julian calendar, then 12 days behind, so the Treaty of Bucharest is dated 16 May 1812 in Russian sources. Some dates of the Danube campaigns are given in either style in the literature; uncertain ones are given here only by month.": "Les comptes russes utilisent le calendrier julien, puis 12 jours de retard, donc le traité de Bucarest est daté du 16 mai 1812 dans les sources russes. Certaines dates des campagnes sur le Danube sont données dans l’un ou l’autre style dans la littérature ; celles incertaines ne sont données ici que par mois."
"The Serbian rising of 1804–1813 under Karađorđe is a war of its own; it appears here only where it joined the Russian war.": "La montée serbe de 1804–1813 sous la direction de Karasorh est une guerre à part entière ; elle n’apparaît ici que là où elle a rejoint la guerre russe."
