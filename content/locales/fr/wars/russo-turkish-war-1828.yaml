"Varna and Akhaltsikhe": "Varna et Akhaltsikhe"
"At Navarino in October 1827 British, French and Russian squadrons destroyed the Ottoman and Egyptian fleet that was fighting the Greek rising. Sultan Mahmud II answered by repudiating his recent agreements with Russia and closing the Bosporus to Russian ships, and on 26 April 1828 Russia declared war. The Ottomans had abolished the Janissaries only two years before, and their new army was still being formed. Field Marshal Peter Wittgenstein’s army occupied Moldavia and Wallachia, and in June, with Nicholas I present, it crossed the Danube into Dobruja.": "À Navarino, en octobre 1827, des escadrons britanniques, français et russes détruisirent la flotte ottomane et égyptienne qui combattait la montée grecque. Le sultan Mahmud II répondit en répudiant ses récents accords avec la Russie et en fermant le Bospore aux navires russes, et le 26 avril 1828, la Russie déclara la guerre. L’armée du maréchal de campagne Peter Wittgenstein occupa la Moldavie et la Wallachie, et en juin, avec Nicolas Ier présent, elle traversa le Danube pour rejoindre Dobruja."
"Brăila surrendered in June, but Shumla was too strong to take and Silistra held out. Varna, besieged from the land and from the sea by Admiral Aleksey Greig’s Black Sea Fleet, surrendered on 11 October. Disease and hunger killed many Russian soldiers, and the army fell back for the winter. In the Caucasus General Ivan Paskevich, with fewer than 20,000 men, took Kars in July and Akhalkalaki, then defeated a relief army and stormed Akhaltsikhe in late August. The burning town was taken street by street. Anapa and Poti on the Black Sea coast also fell.": "Brăila s’est rendu en juin, mais Shumla était trop fort pour prendre et Silistra a tenu. Varna, assiégée de la terre et de la mer par l’amiral Aleksey Greigs flotte de la mer Noire, s’est rendue le 11 octobre. Maladie et faim ont tué beaucoup de soldats russes, et l’armée est retombée pour l’hiver. Dans le Caucase, le général Ivan Pasquivith, avec moins de 20 000 hommes, a pris Kars en juillet et Akhalkalaki, puis a défait une armée de secours et a pris Akhaltsikhe à la fin d’août. La ville incendiaire a été prise rue par rue. Anapa et Poti sur la côte de la mer Noire également tombé."
