"In 1829 General Hans Karl von Diebitsch replaced Wittgenstein and laid siege to Silistra. On 11 June he defeated the grand vizier, Reshid Mehmed Pasha, at Kulevcha as the Ottoman army marched out of Shumla, and Silistra surrendered at the end of the month. In July Diebitsch led about 35,000 men across the Balkan mountains, bypassing Shumla, took Burgas and the coastal towns with the help of the fleet, and on 20 August entered Adrianople, the second city of the empire, without a fight. His army was dwindling from disease, but the Ottomans did not know how weak it was.": "En 1829, le général Hans Karl von Diebitsch remplaça Wittgenstein et assiégea Silistra. Le 11 juin il battit le grand vizir, Reshid Mehmed Pacha, à Kulevcha alors que l’armée ottomane sortait de Shumla, et Silistra se rendit à la fin du mois. En juillet Diebitsch conduisit environ 35 000 hommes à travers les montagnes des Balkans, contournant Shumla, prit Burgas et les villes côtières avec l’aide de la flotte, et le 20 août entra Adrianople, la deuxième ville de l’empire, sans se battre. Son armée diminuait de maladie, mais les Ottomans ne savaient pas à quel point elle était faible."
"In the east Paskevich beat the Ottoman army in the Saganlug mountains and entered Erzurum on 9 July. By the Treaty of Adrianople, signed on 14 September 1829, Russia returned Kars, Erzurum and its other conquests in Anatolia and Europe, but gained the mouths of the Danube, Akhaltsikhe and Akhalkalaki, and the Black Sea coast from the Kuban to Adjara. Moldavia and Wallachia became self-governing under Russian protection, and Russian troops stayed there until 1834. The sultan accepted the powers’ settlement for Greece, which became independent in 1830, and confirmed Serbia’s self-rule. Some 90,000 Armenians moved from Ottoman to Russian territory.": "Dans l’est de la Paskevich a battu l’armée ottomane dans les montagnes de Saganlug et est entré Erzurum le 9 juillet. Par le traité d’Adrianople, signé le 14 septembre 1829, la Russie renvoya Kars, Erzurum et ses autres conquêtes en Anatolie et en Europe, mais gagna l’embouchure du Danube, Akhaltsikhe et Akhalkalaki, et la côte de la mer Noire du Kuban à Adjara. La Moldavie et la Wallachie devinrent autonomes sous protection russe, et les troupes russes y restèrent jusqu’en 1834. Le sultan accepta le règlement des pouvoirs de la Grèce, qui devint indépendante en 1830, et confirma l’autonomie de la Serbie. Environ 90 000 Arméniens passèrent du territoire ottoman au territoire russe."
