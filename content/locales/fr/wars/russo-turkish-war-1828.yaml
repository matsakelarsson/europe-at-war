"A war between the Russian Empire and the Ottoman Empire that grew out of the Greek War of Independence. After the capture of Varna and Akhaltsikhe in 1828, Diebitsch’s march over the Balkan mountains to Adrianople in 1829 forced the Ottomans to make peace, giving Russia the mouths of the Danube, the eastern Black Sea coast and Akhaltsikhe, and opening the way to Greek independence.": "Après la prise de Varna et d’Akhatsikhe en 1828, les Diebtschs marchent sur les montagnes balkaniques jusqu’à Adrianople en 1829, forçant les Ottomans à faire la paix, donnant à la Russie l’embouchure du Danube, la côte orientale de la mer Noire et Akhaltsikhe, et ouvrant la voie à l’indépendance grecque."
"Dates are New Style (Gregorian). Russian accounts use the Julian calendar, then 12 days behind, so the fall of Varna is 29 September 1828 and the Treaty of Adrianople 2 September 1829 in Russian sources.": "Les comptes russes utilisent le calendrier julien, puis 12 jours derrière, de sorte que la chute de Varna est 29 septembre 1828 et le traité d’Adrianople 2 septembre 1829 dans des sources russes."
"Adrianople is today’s Edirne, and Shumla is Shumen in Bulgaria.": "Adrianople est aujourd'hui Édirne, et Shumla est Shumen en Bulgarie."
