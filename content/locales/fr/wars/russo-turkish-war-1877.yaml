San Stefano and Berlin: San Stefano et Berlin
January – July 1878: janvier – juillet 1878
After Sheynovo the Russians advanced fast. Gurko took Plovdiv in January, and Adrianople fell without a fight. An armistice was signed on 31 January, with Russian troops close to Constantinople and a British fleet in the Sea of Marmara. Hundreds of thousands of Muslims fled before the Russian armies, and many were killed by Russian troops, Cossacks and Bulgarian bands. The Treaty of San Stefano, signed on 3 March 1878, created a large Bulgarian state stretching to the Aegean and Macedonia, and gave Russia southern Bessarabia and Kars, Ardahan, Batumi and Bayazid.: Après Sheynovo les Russes ont avancé rapidement. Gurko a pris Plovdiv en janvier, et Adrianople est tombé sans un combat. Un armistice a été signé le 31 Janvier, avec des troupes russes près de Constantinople et une flotte britannique dans la mer de Marmara. Des centaines de milliers de musulmans ont fui avant les armées russes, et beaucoup ont été tués par les troupes russes, les cosaques et les bandes bulgares. Le traité de San Stefano, signé le 3 mars 1878, créa un grand État bulgare s’étendant à la mer Égée et à la Macédoine, et donna à la Russie du sud Bessarabie et Kars, Ardahan, Batumi et Bayazid.
Britain and Austria-Hungary feared that Bulgaria would be a Russian client, and the powers revised the treaty at the Congress of Berlin, which ended on 13 July. Bulgaria became a self-governing principality between the Danube and the Balkan mountains, with Sofia; Eastern Rumelia to the south stayed an autonomous Ottoman province, and Macedonia was returned to the sultan. Romania, Serbia and Montenegro became independent and gained land. Russia took back southern Bessarabia, giving Romania northern Dobruja instead, and kept Kars, Ardahan and Batumi. Austria-Hungary occupied Bosnia and Herzegovina, and Britain took Cyprus.: La Grande-Bretagne et l’Autriche-Hongrie craignaient que la Bulgarie ne soit un client russe, et les pouvoirs ont révisé le traité au Congrès de Berlin qui s’est terminé le 13 juillet. La Bulgarie est devenue une principauté autonome entre le Danube et les montagnes des Balkans, avec Sofia ; Rumelia orientale au sud est restée une province ottomane autonome, et la Macédoine a été retournée au sultan. La Russie a repris le sud de Bessarabia, donnant à la Roumanie le nord de Dobruja, et a gardé Kars, Ardahan et Batumi. L’Autriche-Hongrie a occupé la Bosnie-Herzégovine, et la Grande-Bretagne a pris Chypre.
