Plevna: Plevna
July – December 1877: juillet – décembre 1877
Osman Pasha marched an Ottoman army from Vidin to Plevna, a road junction west of the Russian advance, and dug in. Two Russian assaults in July were beaten off with heavy losses, and the Russians had to ask Romania for help. On 11 September a combined Russian and Romanian army made a third assault, with Prince Carol of Romania in nominal command. The Romanians took the Grivitsa redoubt and Skobelev’s troops broke into the defences in the south, but the attack failed with very heavy Russian and Romanian losses.: Osman Pacha a marché une armée ottomane de Vidin à Plevna, un carrefour routier à l’ouest de l’avancée russe, et a creusé dans. Deux attaques russes en juillet ont été battues avec de lourdes pertes, et les Russes ont dû demander de l’aide à la Roumanie. Le 11 septembre une armée mixte russe et roumaine a fait un troisième assaut, avec le prince Carol de Roumanie en commandement nominal. Les Roumains ont pris les Grivitsa redoubt et Skobelev's les troupes se sont effondrées dans les défenses dans le sud, mais l’attaque a échoué avec des pertes russes et roumaines très lourdes.
The allies then besieged the town under the engineer General Eduard Totleben, the defender of Sevastopol. Gurko cut its supply road at Gorni Dubnik in October. Starving and short of ammunition, Osman Pasha tried to break out on 10 December, was wounded and surrendered with about 40,000 men. The five-month siege had held up the Russian advance, but its end freed some 100,000 troops. Serbia re-entered the war a few days later, and in January Gurko crossed the mountains in deep snow and took Sofia.: Les alliés ont ensuite assiégé la ville sous l’ingénieur général Eduard Totleben, le défenseur de Sébastopol. Gurko a coupé sa route d’approvisionnement à Gorni Dubnik en octobre. Meurtant et à court de munitions, Osman Pacha a tenté de se briser le 10 décembre, a été blessé et livré avec environ 40 000 hommes. La Serbie est revenue à la guerre quelques jours plus tard, et en janvier Gurko a traversé les montagnes dans la neige profonde et a pris Sofia.
