Across the Danube: Sur le Danube
April – July 1877: avril – juillet 1877
In 1875 Christian peasants rose against Ottoman rule in Herzegovina and Bosnia, and in April 1876 the Bulgarians followed. Ottoman irregulars put down the April Uprising with massacres; at Batak alone some 5,000 people are thought to have been killed. Serbia and Montenegro went to war with the Ottomans in the summer of 1876, and Serbia was beaten. When a conference of the powers in Constantinople failed to impose reforms, Russia, having secured Austria-Hungary’s neutrality, declared war on 24 April 1877.: En 1875, des paysans chrétiens se sont levés contre la domination ottomane en Herzégovine et en Bosnie et, en avril 1876, les Bulgares ont suivi. Des irrégularités ottomanes ont abattu l’insurrection d’avril avec des massacres ; à Batak seul, on pense que quelque 5 000 personnes auraient été tuées. Lorsqu'une conférence des puissances de Constantinople n’a pas réussi à imposer des réformes, la Russie, ayant obtenu la neutralité de l’Autriche-Hongrie, a déclaré la guerre le 24 avril 1877.
Romania let Russian troops pass through its territory and on 21 May declared itself independent. On the night of 26–27 June General Mikhail Dragomirov’s division crossed the Danube in boats from Zimnicea and took Svishtov, and the army followed over a pontoon bridge. One column under General Iosif Gurko pushed south, took the old Bulgarian capital of Tarnovo on 7 July and crossed the Balkan mountains by a little-used pass, while another took the Danube fortress of Nikopol.: La Roumanie a laissé les troupes russes passer par son territoire et le 21 mai s’est déclarée indépendante. Dans la nuit du 26 au 27 juin, la division du général Mikhail Dragomirovís a traversé le Danube en bateaux de Zimnicea et a pris Svishtov, et l’armée a suivi sur un pont ponton. Une colonne sous le général Iosif Gurko poussa vers le sud, prit la vieille capitale bulgare de Tarnovo le 7 juillet et traversa les montagnes des Balkans par un col peu utilisé, tandis qu’une autre prit la forteresse du Danube de Nikopol.
