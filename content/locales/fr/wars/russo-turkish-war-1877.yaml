Shipka and the Balkan passes: Les cols de Shipka et des Balkans
July 1877 – January 1878: juillet 1877 – janvier 1878
Gurko took the Shipka Pass from the south on 19 July and raided into the valley beyond, but he was driven back after the battle of Stara Zagora at the end of July. Ottoman troops then burned the town and killed thousands of its Bulgarian inhabitants; some estimates put the dead at about 14,000. As the Russians withdrew, many Bulgarians fled north with them. The pass was left to a small force of Russians and Bulgarian volunteers, the opalchentsi, while the main army was held at Plevna.: Gurko a pris le col de Shipka du sud le 19 juillet et a fait une descente dans la vallée au-delà, mais il a été repoussé après la bataille de Stara Zagora fin juillet. Les troupes ottomanes ont ensuite brûlé la ville et tué des milliers de ses habitants bulgares ; certaines estimations ont mis les morts à environ 14 000. Le col a été laissé à une petite force de Russes et de volontaires bulgares, l’opalchentsi, tandis que l’armée principale était tenue à Plevna.
On 21–26 August Suleiman Pasha’s army of some 30,000 men attacked the pass again and again. The defenders, about 5,000 Bulgarian volunteers and 2,500 Russians, ran out of ammunition and threw stones and the bodies of the dead before reinforcements arrived. A further attack in September also failed. Through the winter the defenders held the pass in snow and bitter cold, losing thousands to frostbite and disease. On 8–9 January 1878 Russian columns came down on both sides of the Ottoman camp at Sheynovo, and its army surrendered.: Les 21 et 26 août, l’armée de Suleiman Pasha a attaqué encore et encore le col. Les défenseurs, environ 5 000 volontaires bulgares et 2 500 Russes, ont manqué de munitions et jeté des pierres et les corps des morts avant l’arrivée des renforts. Une nouvelle attaque en septembre a également échoué. Les 8 et 9 janvier 1878, des colonnes russes descendirent des deux côtés du camp ottoman de Sheynovo, et son armée se rendit.
