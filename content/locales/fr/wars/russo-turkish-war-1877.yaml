Russo-Turkish War of 1877–1878: Guerre russo-turque de 1877–1878
A war in which the Russian Empire, joined by Romania, Serbia and Montenegro, fought the Ottoman Empire after the bloody suppression of the Bulgarian April Uprising. Russian victories at Plevna, Shipka and Kars brought the Ottomans to the Treaty of San Stefano, revised at the Congress of Berlin in 1878, which created a Bulgarian principality and made Romania, Serbia and Montenegro independent.: Une guerre dans laquelle l’Empire russe, rejoint par la Roumanie, la Serbie-et-Monténégro, a combattu l’empire ottoman après la répression sanglante de l’insurrection d’avril bulgare. Les victoires russes à Plevna, Shipka et Kars ont amené les Ottomans au Traité de San Stefano, révisé au Congrès de Berlin en 1878, qui a créé une principauté bulgare et rendu la Roumanie, la Serbie-et-Monténégro indépendante.
Dates are New Style (Gregorian). Russia and the Balkan states used the Julian calendar, then 12 days behind, so the crossing of the Danube is 15 June 1877, the fall of Plevna 28 November 1877 and the Treaty of San Stefano 19 February 1878 in their sources. Bulgaria celebrates its liberation on 3 March.: La Russie et les États des Balkans ont utilisé le calendrier julien, puis 12 jours derrière, donc la traversée du Danube est 15 juin 1877, la chute de Plevna 28 novembre 1877 et le traité de San Stefano 19 février 1878 dans leurs sources. La Bulgarie célèbre sa libération le 3 mars.
Numbers of dead and of refugees are estimates and vary widely between sources.: Le nombre de morts et de réfugiés est estimé et varie considérablement d’une source à l’autre.
Plevna is today’s Pleven, Adrianople is Edirne, and San Stefano is Yeşilköy, now part of Istanbul.: Plevna est aujourd'hui Pleven, Adrianople est Edirne, et San Stefano est Yeşilköy, qui fait maintenant partie d’Istanbul.
