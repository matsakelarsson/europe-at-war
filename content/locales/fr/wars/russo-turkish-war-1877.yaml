Kars and the Caucasus: Kars et Caucase
April – November 1877: avril – novembre 1877
In the Caucasus Russian columns under General Mikhail Loris-Melikov crossed the border at the start of the war. They took Ardahan in May and laid siege to Kars, while another column took Bayazid. In June the Ottoman commander, Ahmed Muhtar Pasha, beat the Russians at Zivin and drove them back to the border, relieving Kars, and Russian troops were themselves besieged in Bayazid. An Ottoman landing on the Black Sea coast set off a rising in Abkhazia.: Dans les colonnes russes du Caucase sous le général Mikhail Loris-Melikov a traversé la frontière au début de la guerre. Ils ont pris Ardahan en mai et posé siège à Kars, tandis qu’une autre colonne a pris Bayazid. En juin le commandant ottoman, Ahmed Muhtar Pacha, battu les Russes à Zivin et les a ramenés à la frontière, soulageant Kars, et les troupes russes étaient eux-mêmes assiégées à Bayazid. Un débarquement ottoman sur la côte de la mer Noire a déclenché une montée en Abkhazie.
With reinforcements, the Russians broke Ahmed Muhtar Pasha’s army in the Aladzha heights east of Kars in October. On the night of 17–18 November they stormed Kars, taking thousands of prisoners. Russian troops then advanced on Erzurum, which they did not take before the armistice, and failed to take Batumi. Many Armenians welcomed the Russian advance, and many Muslims fled the lands Russia conquered.: Avec des renforts, les Russes ont brisé l’armée d’Ahmed Muhtar Pasha. Dans la nuit du 17 au 18 novembre, ils ont pris des milliers de prisonniers. Les troupes russes ont ensuite avancé sur Erzurum, qu’ils n’ont pas pris avant l’armistice, et n’ont pas pris Batoumi. Beaucoup d’Arméniens se sont félicités de l’avancée russe, et beaucoup de musulmans ont fui les terres conquises par la Russie.
