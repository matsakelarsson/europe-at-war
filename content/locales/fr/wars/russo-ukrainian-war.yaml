"In January 2015 the separatists, backed by Russian troops, opened a winter offensive. They took the ruins of Donetsk airport, and on 24 January rockets fired from separatist-held ground killed about 30 civilians in Mariupol. After talks in Minsk between the leaders of Ukraine, Russia, France and Germany, a new package of measures, Minsk II, was signed on 12 February. It provided for a ceasefire, the withdrawal of heavy weapons, an amnesty, local elections and a constitutional reform giving the separatist areas a special status, after which Ukraine would regain control of its border. The separatists went on attacking the Debaltseve salient, and Ukrainian forces withdrew on 18 February.": "En janvier 2015, les séparatistes, soutenus par les troupes russes, ont ouvert une offensive hivernale. Ils ont pris les ruines de l’aéroport de Donetsk et le 24 janvier, des roquettes tirées sur un terrain séparatiste ont tué environ 30 civils à Marioupol. Après des pourparlers à Minsk entre les dirigeants ukrainien, russe, français et allemand, un nouveau train de mesures, Minsk II, a été signé le 12 février. Elle prévoyait un cessez-le-feu, le retrait des armes lourdes, une amnistie, des élections locales et une réforme constitutionnelle accordant aux zones séparatistes un statut spécial, après quoi l’Ukraine reprendrait le contrôle de sa frontière."
"The line of contact, more than 400 kilometres long, then barely moved for seven years. Ceasefires were declared and broken, OSCE monitors recorded violations almost daily, and the political parts of Minsk II were never carried out, as Kyiv and Moscow disagreed over their order. From 2019 Russia gave passports to hundreds of thousands of people in the separatist areas. Volodymyr Zelensky, elected president that year, promised peace, and a ceasefire in July 2020 brought the quietest months of the war. By the end of 2021 the UN estimated that 14,200–14,400 people had been killed since 2014, about 3,400 of them civilians, including those aboard MH17.": "La ligne de contact, longue de plus de 400 kilomètres, puis à peine déplacée pendant sept ans. Les cessez-le-feu ont été déclarés et brisés, les observateurs de l’OSCE ont enregistré des violations presque tous les jours, et les parties politiques de Minsk II n’ont jamais été exécutées, comme Kiev et Moscou ne sont pas d’accord sur leur ordre. Volodymyr Zelensky, président élu cette année-là, a promis la paix et un cessez-le-feu en juillet 2020 a apporté les mois les plus calmes de la guerre. À la fin de 2021, l’ONU a estimé que 14 200–14 400 personnes avaient été tuées depuis 2014, environ 3 400 civils, y compris ceux à bord du MH17."
