"Ukrainian forces withdrew from Avdiivka on 17 February 2024 after a four-month assault that cost Russia heavy losses, while a new American aid package was held up in Congress until April. On 10 May Russia opened a new front north of Kharkiv, around Vovchansk, and Ukraine’s allies then allowed it to strike targets in Russia near the border with their weapons. Through the summer and autumn Russian forces pressed west towards Pokrovsk, a logistics hub, taking Vuhledar in October and Selydove soon after. On 8 July a missile hit Okhmatdyt, Ukraine’s largest children’s hospital, in Kyiv, and in November Russia fired a new intermediate-range missile, the Oreshnik, at Dnipro.": "Les forces ukrainiennes se sont retirées d’Avdiivka le 17 février 2024 après un assaut de quatre mois qui a coûté de lourdes pertes à la Russie, tandis qu’un nouveau paquet d’aide américain a été retenu au Congrès jusqu’en avril. Le 10 mai, la Russie a ouvert un nouveau front au nord de Kharkiv, autour de Vovchansk, et les alliés de l’Ukraine lui ont ensuite permis de frapper des cibles en Russie près de la frontière avec leurs armes. Au cours de l’été et de l’automne, les forces russes ont pressé vers l’ouest vers Pokrovsk, un centre logistique, prenant Vuhledar en octobre et Selydove peu après. Le 8 juillet, un missile a frappé Okhmatdyt, Ukraine, le plus grand hôpital pour enfants, à Kiev, et en novembre, la Russie a tiré un nouveau missile à portée intermédiaire, l’Oreshnik, à Dnipro."
"On 6 August Ukrainian troops crossed the border into Russia’s Kursk region, the first invasion of Russian territory by a foreign army since the Second World War, and took the town of Sudzha and, by Ukraine’s account, more than 1,000 square kilometres. Russia brought in thousands of North Korean soldiers, some 11,000–12,000 by Western and South Korean estimates, to help win the ground back. Ukraine hoped the incursion would draw Russian troops away from the Donbas, but the advance on Pokrovsk went on, and by the end of the year Russia had made its largest gains since 2022.": "Le 6 août, les troupes ukrainiennes ont franchi la frontière avec la Russie dans la région de Kursk, première invasion du territoire russe par une armée étrangère depuis la Seconde Guerre mondiale, et ont pris la ville de Sudzha et, par le compte de l’Ukraine, plus de 1 000 kilomètres carrés. L’Ukraine espérait que l’incursion éloignerait les troupes russes des Donbas, mais l’avance sur Pokrovsk se poursuivait, et à la fin de l’année, la Russie avait réalisé ses plus grands gains depuis 2022."
