"In March and April pro-Russian protesters seized government buildings across eastern Ukraine, and armed separatists proclaimed a Donetsk People’s Republic on 7 April and a Luhansk People’s Republic on 27 April. On 12 April armed men led by Igor Girkin, a former officer of Russia’s security service, took Sloviansk and Kramatorsk, and Ukraine’s interim government began what it called an anti-terrorist operation. On 2 May 48 people died in Odesa, most of them pro-Russian activists trapped in a burning trade union building after street clashes. The separatists held referendums on 11 May that Kyiv and Western governments rejected, and on 25 May Petro Poroshenko was elected president.": "En mars et avril, des manifestants pro-russes ont saisi des bâtiments du gouvernement à travers l’est de l’Ukraine, et des séparatistes armés ont proclamé la République populaire de Donetsk le 7 avril et la République populaire de Louhansk le 27 avril. Le 12 avril, des hommes armés dirigés par Igor Girkin, un ancien officier du service de sécurité russe, ont pris Sloviansk et Kramatsk, et le gouvernement intérimaire ukrainien a commencé ce qu’il appelait une opération antiterroriste. Le 2 mai, 48 personnes sont mortes à Odesa, la plupart des militants pro-russes piégés dans un bâtiment syndical en feu après les affrontements de rue. Les séparatistes ont tenu des référendums le 11 mai que Kiev et les gouvernements occidentaux ont rejeté, et Petro Porochenko a été élu président le 25 mai."
"Ukrainian forces retook Mariupol in June and Sloviansk and Kramatorsk on 5 July, when Girkin’s men fell back on Donetsk. On 17 July Malaysia Airlines flight MH17, from Amsterdam to Kuala Lumpur, was shot down over separatist-held ground; all 298 people on board, 196 of them Dutch, were killed. A Dutch-led international investigation found that it was hit by a Buk missile from a Russian army brigade, brought across the border and taken back afterwards. A Dutch court convicted two Russians and a Ukrainian separatist of murder in their absence in 2022, and the council of the UN’s civil aviation organisation found Russia responsible in 2025. Russia denies any part in it.": "Les forces ukrainiennes ont repris Mariupol en juin et Sloviansk et Kramatorsk le 5 juillet, lorsque les hommes de Girkin sont tombés sur Donetsk. Le 17 juillet, le vol MH17 de Malaysia Airlines, d’Amsterdam à Kuala Lumpur, a été abattu au-dessus d’un sol séparatiste ; les 298 personnes à bord, dont 196 hollandais, ont été tuées. Une enquête internationale menée par les Hollandais a révélé qu’il avait été touché par un missile Buk d’une brigade de l’armée russe, ramené à la frontière et repris après. Un tribunal néerlandais a condamné deux Russes et un séparatiste ukrainien pour meurtre en leur absence en 2022, et le conseil de l’organisation de l’aviation civile des Nations Unies a déclaré la Russie responsable en 2025."
