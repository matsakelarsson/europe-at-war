"The invasion of 24 February 2022": "L’invasion du 24 février 2022"
"February – March 2022": "février – mars 2022"
"Through 2021 Russia massed troops on Ukraine’s borders and in Belarus, some 150,000–190,000 by Western estimates, while demanding guarantees that NATO would never admit Ukraine. On 21 February 2022 Vladimir Putin recognised the Donetsk and Luhansk people’s republics as independent states, and before dawn on 24 February he announced a “special military operation” to “demilitarise and denazify” Ukraine. Missiles struck cities and airfields across the country, and Russian columns crossed the border from Belarus, Russia and Crimea. Zelensky stayed in Kyiv and declared martial law and a general mobilisation, and Western governments imposed sweeping sanctions on Russia and began sending arms.": "Le 21 février 2022, Vladimir Poutine a reconnu les républiques de Donetsk et de Louhansk comme des États indépendants, et avant l’aube du 24 février, il a annoncé une opération militaire spéciale à l’Ukraine. Les missiles ont frappé des villes et des aérodromes à travers le pays, et les colonnes russes ont traversé la frontière du Bélarus, de la Russie et de la Crimée. Zelensky est resté à Kiev et a déclaré la loi martiale et une mobilisation générale, et les gouvernements occidentaux ont imposé des sanctions massives sur la Russie et commencé à envoyer des armes."
"From Belarus the invaders drove past Chornobyl towards Kyiv, and airborne troops landed at the Antonov airfield at Hostomel on the first day. Further east they surrounded Chernihiv, bypassed Sumy and Kharkiv and pushed to the eastern edge of Kyiv. From Crimea they took Kherson on 2 March, the only regional capital they captured in 2022, along with Melitopol and Berdiansk, seized the Zaporizhzhia nuclear power plant, Europe’s largest, on 4 March, and closed in on Mariupol. On 2 March the UN General Assembly demanded Russia’s withdrawal by 141 votes to 5. By the end of March more than four million Ukrainians had fled abroad.": "De Biélorussie, les envahisseurs ont passé Chornobyl en direction de Kiev, et des troupes aéroportées ont atterri à l’aérodrome Antonov à Hostomel le premier jour. Plus à l’est, ils ont entouré Chernihiv, contourné Sumy et Kharkiv et poussé à la limite orientale de Kyiv. De Crimée, ils ont pris Kherson le 2 mars, la seule capitale régionale qu’ils ont capturée en 2022, avec Melitopol et Berdiansk, a saisi la centrale nucléaire de Zaporizhzhia, la plus grande d’Europe, le 4 mars, et s’est refermée sur Mariupol. Le 2 mars l’Assemblée générale des Nations Unies a exigé le retrait de la Russie par 141 voix contre 5."
