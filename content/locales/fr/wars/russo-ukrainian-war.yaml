"Mariupol, surrounded by early March, was pounded for weeks and largely destroyed. On 9 March a strike hit a maternity hospital, and on 16 March a bomb struck the Drama Theatre, where hundreds of civilians were sheltering and the word “children” had been painted in Russian on the ground outside; estimates of the dead there range from about a dozen to some 600. The last defenders, holed up in the Azovstal steelworks, surrendered between 16 and 20 May, and Russia said 2,439 had laid down their arms. The UN verified more than 1,300 civilian deaths in the city and believed the true figure to be thousands higher.": "Mariupol, entouré de début mars, a été frappé pendant des semaines et largement détruit. Le 9 mars une grève a frappé un hôpital de maternité, et le 16 mars une bombe a frappé le théâtre dramatique, où des centaines de civils abritaient et le mot \"enfants\" avait été peint en russe sur le terrain à l’extérieur ; les estimations des morts là-bas vont d’une douzaine à environ 600. Les derniers défenseurs, troués dans les aciéries d’Azovstal, se sont rendus entre le 16 et le 20 mai, et la Russie a dit que 2 439 avaient déposé leurs armes. L’ONU a vérifié plus de 1 300 morts civiles dans la ville et croyait que le chiffre réel était des milliers plus élevé."
"From 18 April Russia turned its main effort to the Donbas, grinding forward behind massed artillery. It took Popasna in May, Sievierodonetsk on 25 June and Lysychansk on 3 July, which gave it almost all of the Luhansk region, while its push south from Izium stalled before Sloviansk. On 30 June it abandoned Snake Island in the Black Sea. From June Ukraine received American HIMARS rocket launchers and used them against ammunition depots far behind the front. On 29 July an explosion killed some 50 Ukrainian prisoners of war, many of them from Azovstal, in a prison camp at Olenivka; each side blamed the other.": "A partir du 18 avril, la Russie s’est tournée vers les Donbas, se mouillant derrière l’artillerie de masse. Popasna a pris en mai, Sievierodonetsk le 25 juin et Lysychansk le 3 juillet, ce qui lui a donné presque toute la région de Luhansk, tandis que sa poussée au sud d’Izium était bloquée avant Sloviansk. Le 30 juin, elle a abandonné Snake Island dans la mer Noire. De juin, l’Ukraine a reçu des lance-roquettes américains HIMARS et les a utilisés contre des dépôts de munitions loin derrière le front. Le 29 juillet, une explosion a tué une cinquantaine de prisonniers de guerre ukrainiens, dont beaucoup venaient d’Azovstal, dans un camp de détention à Olenivka ; chaque partie a blâmé l’autre."
