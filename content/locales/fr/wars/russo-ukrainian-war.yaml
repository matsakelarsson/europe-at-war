"Last updated 19 November 2026. Through the winter Russian strikes on power stations left much of Kyiv without heat in freezing weather, and Ukraine declared an energy emergency in January. Russia took Huliaipole in January and by February had, by most accounts, completed the capture of Pokrovsk and Myrnohrad, but its advance then slowed sharply. Ukraine won back ground early in the year, its first gains since 2023, and by ISW’s count Russia’s gains from January to October came to only about 117 square kilometres, against more than 5,000 in 2025; in September and October it lost more ground than it took, as Ukrainian forces pushed back north of Lyman. Fighting went on for Kostiantynivka.": "Dernière mise à jour le 19 novembre 2026. Pendant l’hiver les frappes russes sur les centrales ont laissé une grande partie de Kiev sans chaleur par temps glacial, et l’Ukraine a déclaré une urgence énergétique en janvier. La Russie a pris Huliaipole en janvier et en février avait, selon la plupart des comptes, terminé la capture de Pokrovsk et Myrnohrad, mais son avance a ensuite ralenti fortement. L’Ukraine a gagné du terrain au début de l’année, ses premiers gains depuis 2023, et par ISW-S compter Russie $ les gains de janvier à octobre est venu à seulement environ 117 kilomètres carrés, contre plus de 5 000 en 2025 ; en septembre et Octobre il a perdu plus de terrain qu’il a pris, alors que les forces ukrainiennes ont repoussé au nord de Lyman."
"Russian air attacks went on. A strike on an apartment building in Kyiv on 14 May killed 24 people, and on 2 November a strike on a school in Komyshuvakha, in the Zaporizhzhia region, that was being used as an aid centre and shelter killed 72 people, according to Ukrainian authorities. The UN said in November that 17,994 civilians had been confirmed killed and 57,854 injured since February 2022. In April the European Union approved a loan of €90 billion to fund Ukraine in 2026 and 2027, and in July Zelensky replaced the commander-in-chief, Oleksandr Syrskyi, with Mykhailo Drapatyi.": "Des attaques aériennes russes se sont poursuivies. Une attaque contre un immeuble d’habitation à Kiev le 14 mai a tué 24 personnes, et le 2 novembre une grève sur une école à Komyshuvakha, dans la région de Zaporizhzhia, qui était utilisée comme centre d’aide et abri a tué 72 personnes, selon les autorités ukrainiennes. L’ONU a déclaré en novembre que 17 994 civils avaient été confirmés tués et 57 854 blessés depuis février 2022. En avril, l’Union européenne a approuvé un prêt de 90 milliards d’euros pour financer l’Ukraine en 2026 et 2027, et en juillet Zelensky a remplacé le commandant en chef, Oleksandr Syrskyi, par Mykhailo Drapati."
"Talks between the United States, Ukraine and Russia in Abu Dhabi and Geneva in January and February brought prisoner exchanges but no breakthrough. On 10–11 November Russian and Ukrainian delegations met again in Abu Dhabi, for the first time in nine months, and agreed a large prisoner exchange, but not a ceasefire; the American envoys Steve Witkoff and Jared Kushner then met Putin in Moscow and Zelensky in Dublin. On 17 November Ukrainian drone and missile strikes brought down a section of the road bridge to Crimea. Russia holds about a fifth of Ukraine, including Crimea.": "Les discussions entre les États-Unis, l’Ukraine et la Russie à Abu Dhabi et Genève en janvier et février ont apporté des échanges de prisonniers mais aucune percée.Les 10-11 novembre, les délégations russes et ukrainiennes se sont réunies à nouveau à Abou Dhabi, pour la première fois en neuf mois, et ont convenu d’un important échange de prisonniers, mais pas un cessez-le-feu ; les envoyés américains Steve Witkoff et Jared Kushner ont ensuite rencontré Poutine à Moscou et Zelensky à Dublin. Le 17 novembre, des tirs de drone et de missiles ukrainiens ont fait tomber une partie du pont routier vers la Crimée. La Russie détient environ un cinquième de l’Ukraine, y compris la Crimée."
