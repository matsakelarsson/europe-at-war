"Russo-Ukrainian War": "Guerre russo-ukrainienne"
? "The war began in February 2014, after the Euromaidan protests and the flight of President Viktor Yanukovych, when Russian troops without insignia took control of Crimea, which Russia annexed in March after a referendum held under its military control; Ukraine and most members of the United Nations do not recognise the annexation. From April 2014 Russian-backed separatists, joined from August by regular Russian troops whose presence Russia denied, fought Ukrainian forces in the Donbas. The Minsk agreements of 2014 and 2015 reduced the fighting but did not end it, and by early 2022 some 14,000 people had been killed. On 24 February 2022 Russia launched a full-scale invasion. Its forces were driven back from around Kyiv that spring and lost ground near Kharkiv and Kherson in the autumn, but held much of the south and east, and in September 2022 Russia proclaimed the annexation of the Donetsk, Luhansk, Zaporizhzhia and Kherson regions, which it did not fully control. The UN has confirmed well over 10,000 civilian deaths since 2022 and believes the real number is considerably higher, military losses on both sides are estimated in the hundreds of thousands killed and wounded, and millions of Ukrainians have fled abroad. The fighting continued through 2023–2026; peace talks mediated by the United States in November 2026 ended without a ceasefire. Last updated 19 November 2026."
: "La guerre a commencé en février 2014, après les manifestations d’Euromaidan et la fuite du président Viktor Ianoukovitch, lorsque les troupes russes sans insignes ont pris le contrôle de la Crimée, que la Russie a annexée en mars après un référendum tenu sous son contrôle militaire ; l’Ukraine et la plupart des membres des Nations Unies ne reconnaissent pas l’annexion. A partir d’avril 2014, des séparatistes soutenus par la Russie, rejoints depuis août par des troupes russes régulières dont la présence était niée par la Russie, ont combattu les forces ukrainiennes dans les Donbas. Les accords de Minsk de 2014 et 2015 ont réduit les combats mais ne l’ont pas mis fin, et au début de 2022 quelque 14 000 personnes ont été tuées. Ses forces ont été repoussées des environs de Kiev ce printemps-là et ont perdu du terrain près de Kharkiv et Kherson à l’automne, mais ont tenu une grande partie du sud et de l’est, et en septembre 2022 la Russie a proclamé l’annexion des régions de Donetsk, Louhansk, Zaporizhzhia et Kherson, qu’elle n’a pas entièrement contrôlé. L’ONU a confirmé bien plus de 10 000 morts civiles depuis 2022 et estime que le nombre réel est considérablement plus élevé, les pertes militaires des deux côtés sont estimées à des centaines de milliers de morts et de blessés, et des millions d’Ukrainiens ont fui à l’étranger. Les combats se sont poursuivis jusqu’en 2023-2026 ; les pourparlers de paix menés par la médiation des États-Unis en novembre 2026 ont pris fin sans cessez-le-feu."
"Crimea and the other occupied areas are shown as part of Ukraine on the map, as they are internationally recognised.": "La Crimée et les autres zones occupées figurent sur la carte en Ukraine, car elles sont reconnues au niveau international."
"Casualty figures are uncertain. Neither government publishes full figures for its own military losses, and the UN counts only civilian deaths it has verified.": "Les chiffres relatifs aux pertes sont incertains : aucun gouvernement ne publie de chiffres complets pour ses propres pertes militaires, et l’ONU ne compte que les morts civiles qu’il a vérifiées."
"Russia claims Crimea and Sevastopol (from 2014) and the Donetsk, Luhansk, Zaporizhzhia and Kherson regions (from 2022) as its own territory, after votes held under its control; Ukraine, the UN General Assembly and most states regard the annexations as invalid. The separatist “people’s republics” of 2014–2022 are shown as a side of their own, though they depended on Russian support.": "La Russie revendique la Crimée et Sébastopol (à partir de 2014) et les régions de Donetsk, Louhansk, Zaporizhzhia et Kherson (à partir de 2022) comme son propre territoire, après des votes tenus sous son contrôle ; l’Ukraine, l’Assemblée générale des Nations Unies et la plupart des États considèrent les annexions comme invalides."
"The zones of control and front lines are approximate, drawn from published maps and news reports. Fronts move constantly, and since 2023 a wide grey zone, covered by drones, has separated the armies in many places. Places are named in their Ukrainian form (Kyiv, Kharkiv, Luhansk).": "Les zones de contrôle et les lignes de front sont approximatives, tirées de cartes publiées et de reportages. Les fronts se déplacent constamment, et depuis 2023 une large zone grise, couverte par des drones, a séparé les armées dans de nombreux endroits."
