"Kharkiv, Kherson and the annexation claims": "Kharkiv, Kherson et les demandes d’annexion"
"September – November 2022": "septembre – novembre 2022"
"On 6 September Ukraine broke through the thinly held Russian line near Balakliia, in the Kharkiv region, and within days retook Izium, Kupiansk and most of the region; Lyman followed on 1 October. Near Izium investigators exhumed more than 400 bodies from a burial site in a forest, most of them civilians, some with signs of torture. On 21 September Putin ordered a “partial mobilisation” of 300,000 reservists, and hundreds of thousands of Russian men left the country. On 8 October a lorry bomb damaged the Kerch bridge to Crimea, and from 10 October Russia struck Ukraine’s power stations and grid with waves of missiles and drones.": "Le 6 septembre, l’Ukraine a franchi la ligne russe très étroite près de Balakliia, dans la région de Kharkiv, et en quelques jours, elle a repris Izium, Kupiansk et la plupart des habitants de la région ; Lyman a suivi le 1er octobre. Le 21 septembre, Poutine a ordonné une mobilisation partielle de 300 000 réservistes, et des centaines de milliers d’hommes russes ont quitté le pays. Le 8 octobre, une bombe de camion a endommagé le pont Kerch vers la Crimée, et à partir du 10 octobre, la Russie a frappé l’Ukraine des centrales électriques et du réseau avec des vagues de missiles et de drones."
"From 23 to 27 September Russian-installed authorities held votes in the occupied parts of the Donetsk, Luhansk, Zaporizhzhia and Kherson regions and announced large majorities for joining Russia, and on 30 September Putin proclaimed their annexation, although his forces did not hold all of their territory. On 12 October the UN General Assembly, by 143 votes to 5, called the annexations invalid. In the south Ukrainian forces had for months struck the bridges over the Dnipro that supplied the Russian troops on its western bank. On 9 November Russia announced a withdrawal across the river, and on 11 November Ukrainian troops entered Kherson.": "Du 23 au 27 septembre, les autorités russes ont voté dans les parties occupées des régions de Donetsk, Louhansk, Zaporizhzhia et Kherson et annoncé de grandes majorités pour rejoindre la Russie. Le 30 septembre, Poutine a proclamé leur annexion, bien que ses forces n’aient pas tenu tout leur territoire. Dans le sud de l’Ukraine les forces ont frappé pendant des mois les ponts sur le Dnipro qui a fourni les troupes russes sur sa rive occidentale. Le 9 novembre la Russie a annoncé un retrait à travers le fleuve, et le 11 novembre les troupes ukrainiennes sont entrées Kherson."
