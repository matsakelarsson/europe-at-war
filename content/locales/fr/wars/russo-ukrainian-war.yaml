"By August Ukrainian forces had nearly surrounded Donetsk and Luhansk and were cutting the separatists off from the Russian border. In the second half of the month regular Russian units crossed into Ukraine; Moscow denied it, saying that any Russian soldiers there were volunteers. At Ilovaisk, east of Donetsk, Ukrainian troops, many of them from volunteer battalions, were encircled, and on 29 August they were cut down as they left by a corridor they had been promised; Ukrainian official figures put the dead at more than 360. A new thrust along the coast took Novoazovsk on 27 August and reached the outskirts of Mariupol.": "En août, les forces ukrainiennes avaient presque encerclé Donetsk et Luhansk et ont coupé les séparatistes de la frontière russe. Dans la seconde moitié du mois, des unités russes régulières ont traversé l’Ukraine ; Moscou a nié, disant que tous les soldats russes il y avait des volontaires. À Ilonaisk, à l’est de Donetsk, des troupes ukrainiennes, dont beaucoup de bataillons volontaires, ont été encerclées et, le 29 août, elles ont été coupées par un couloir qu’on leur avait promis ; des personnalités ukrainiennes ont mis les morts à plus de 360. Une nouvelle poussée le long de la côte a pris Novoazovsk le 27 août et a atteint la périphérie de Mariupol."
"On 5 September representatives of Ukraine, Russia, the OSCE and the separatists signed the Minsk Protocol, which provided for a ceasefire, an exchange of prisoners, monitoring by the OSCE and a special status for parts of the Donetsk and Luhansk regions. The fighting slowed but never stopped. The separatists held elections of their own on 2 November, which Ukraine and Western governments rejected, and the battle for Donetsk airport, where Ukrainian troops had held out since May, went on through the winter. By then several thousand people had been killed and hundreds of thousands had fled their homes.": "Le 5 septembre, des représentants de l’Ukraine, de la Russie, de l’OSCE et des séparatistes ont signé le Protocole de Minsk qui prévoyait un cessez-le-feu, un échange de prisonniers, une surveillance par l’OSCE et un statut spécial pour certaines parties des régions de Donetsk et de Louhansk. Les séparatistes ont tenu leurs propres élections le 2 novembre, ce que l’Ukraine et les gouvernements occidentaux ont rejeté, et la bataille pour l’aéroport de Donetsk, où les troupes ukrainiennes avaient tenu depuis mai, a continué pendant l’hiver. Plusieurs milliers de personnes avaient été tuées et des centaines de milliers avaient fui leurs maisons."
