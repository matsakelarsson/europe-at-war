"Bakhmut, the Kakhovka dam and the counteroffensive": "Bakhmut, le barrage de Kakhovka et la contre-offensive"
"Through the winter Russian forces, many of them convicts recruited by the Wagner Group, a private military company, attacked Bakhmut in the longest and one of the bloodiest battles of the war. They took Soledar in January and Bakhmut, by then in ruins, in May; Wagner’s chief, Yevgeny Prigozhin, claimed it on 20 May. On 23–24 June Prigozhin led a mutiny, seized Rostov-on-Don and marched towards Moscow before turning back, and he died when his plane crashed in August. In March the International Criminal Court issued an arrest warrant for Putin over the unlawful deportation of children from occupied Ukraine.": "Au cours de l’hiver, les forces russes, dont beaucoup sont des prisonniers recrutés par le Groupe Wagner, une compagnie militaire privée, ont attaqué Bakhmut dans la plus longue et l’une des batailles les plus sanglantes de la guerre. Ils ont pris Soledar en janvier et Bakhmut, puis en ruines, en mai ; le chef Wagner, Yevgeny Prigojin, l’a réclamé le 20 mai. Les 23 et 24 juin, Prigojin mène une mutinerie, saisit Rostov-on-Don et marche vers Moscou avant de revenir en arrière, et il meurt lorsque son avion s’écrase en août. En mars, la Cour pénale internationale a émis un mandat d’arrêt pour Poutine au sujet de l’expulsion illégale d’enfants d’Ukraine occupée."
"On 6 June the Kakhovka dam on the Dnipro, held by Russian forces, was destroyed, flooding towns and villages downstream and draining the reservoir; dozens of people drowned. Ukraine and Western governments blamed Russia, which blamed Ukraine. The same week Ukraine opened its long-awaited counteroffensive in the south, but deep minefields, trenches and drones held it to a few villages, Robotyne among them. Ukraine did better at sea, driving much of the Black Sea Fleet from Sevastopol with drones and missiles and opening a corridor for grain ships after Russia left the UN-brokered grain deal in July. In October Russia began a costly offensive against Avdiivka.": "Le 6 juin, le barrage de Kakhovka sur le Dnipro, tenu par les forces russes, a été détruit, inondant des villes et des villages en aval et drainant le réservoir ; des dizaines de personnes se sont noyées. L’Ukraine et les gouvernements occidentaux ont blâmé la Russie, qui a accusé l’Ukraine. La même semaine, l’Ukraine a ouvert sa contre-offensive tant attendue dans le sud, mais les champs de mines profonds, les tranchées et les drones l’ont détenu à quelques villages, Robotyne parmi eux. L’Ukraine a fait mieux en mer, conduisant une grande partie de la flotte de la mer Noire de Sébastopol avec des drones et des missiles et ouvrant un couloir pour les navires à grains après que la Russie a quitté l’accord de l’ONU sur les céréales en juillet."
