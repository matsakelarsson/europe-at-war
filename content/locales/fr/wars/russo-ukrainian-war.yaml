"In November 2013 President Viktor Yanukovych, under pressure from Russia, dropped an association agreement with the European Union that he had promised to sign. Protests on Kyiv’s Maidan Nezalezhnosti, the Euromaidan, swelled after riot police beat students, and clashes grew through the winter. Between 18 and 20 February 2014 more than a hundred people were killed in central Kyiv, most of them protesters shot by the security forces. Yanukovych fled the capital on 21 February, and the next day parliament voted to remove him. Russia called the change of government an unconstitutional coup.": "En novembre 2013, le président Viktor Ianoukovitch, sous la pression de la Russie, a abandonné un accord d’association avec l’Union européenne qu’il avait promis de signer. Entre le 18 et le 20 février 2014, plus d’une centaine de personnes ont été tuées dans le centre de Kiev, la plupart des manifestants abattus par les forces de sécurité. Ianoukovitch a fui la capitale le 21 février, et le lendemain le Parlement a voté pour l’expulser."
"From 27 February Russian soldiers without insignia, whom Moscow at first described as local self-defence forces, seized Crimea’s parliament and government buildings, its airports and the roads to the mainland, and surrounded Ukrainian bases. Under their control the regional parliament installed a new premier, Sergei Aksyonov, and called a referendum, held on 16 March, which the new authorities said had returned 97 per cent for joining Russia. Russia signed a treaty annexing Crimea and Sevastopol on 18 March, and most Ukrainian troops left without a fight. On 27 March the UN General Assembly, by 100 votes to 11, affirmed Ukraine’s territorial integrity and said the referendum had no validity.": "À partir du 27 février, des soldats russes sans insignes, que Moscou a tout d’abord décrit comme des forces locales d’autodéfense, ont saisi le parlement et les bâtiments gouvernementaux de la Crimée, ses aéroports et les routes vers le continent, et ont encerclé les bases ukrainiennes. Sous leur contrôle, le Parlement régional a installé un nouveau premier ministre, Sergei Aksionov, et appelé un référendum, tenu le 16 mars, que les nouvelles autorités ont déclaré avoir rendu 97 % pour rejoindre la Russie. La Russie a signé un traité annexant la Crimée et Sébastopol le 18 mars, et la plupart des troupes ukrainiennes sont parties sans combat. Le 27 mars l’Assemblée générale de l’ONU, par 100 voix contre 11, a affirmé l’intégrité territoriale de l’Ukraine et a déclaré que le référendum n’avait aucune validité."
