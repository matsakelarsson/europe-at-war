"Russia retook Sudzha in March 2025 and said in April that it had cleared the Kursk region, which Ukraine disputed; North Korea then confirmed that its troops had fought there. On 1 June Ukrainian drones, smuggled into Russia in lorries, struck strategic bombers at airfields as far away as Siberia. Russia’s summer offensive pushed into the Dnipropetrovsk region and closed on Pokrovsk, and by the counts of DeepState and ISW it gained some 4,300–5,300 square kilometres in the year. In December Ukraine withdrew from Siversk, and Russia claimed Pokrovsk, Vovchansk and Huliaipole, though Ukraine still held parts of Pokrovsk and had retaken Kupiansk.": "La Russie a repris Sudzha en mars 2025 et a déclaré en avril qu’elle avait défriché la région de Kursk, ce que l’Ukraine contestait ; la Corée du Nord a ensuite confirmé que ses troupes y avaient combattu. L’offensive d’été de la Russie a poussé dans la région de Dnipropetrovsk et fermé sur Pokrovsk, et par les comtes de DeepState et ISW il a gagné environ 4 300-5 300 kilomètres carrés dans l’année. En Décembre Ukraine se retira de Siversk, et la Russie a réclamé Pokrovsk, Vovchansk et Huliaipole, bien que l’Ukraine tenait encore des parties de Pokrovsk et avait repris Kupiansk."
"Donald Trump’s new administration opened talks with Russia in Riyadh in February. After a clash between Trump and Zelensky at the White House on 28 February the United States briefly halted military aid, and on 11 March Ukraine accepted an American proposal for a 30-day ceasefire, which Russia did not. Direct Russian–Ukrainian talks in Istanbul from May to July produced the largest prisoner exchanges of the war, and Trump met Putin in Alaska on 15 August, but there was no ceasefire. An American peace plan in November led to talks in Geneva, Berlin and Florida; by the end of December Zelensky said a 20-point framework was 90 per cent agreed, but not territory.": "La nouvelle administration de Donald Trump a ouvert des pourparlers avec la Russie à Riyad en février. Après un affrontement entre Trump et Zelensky à la Maison Blanche le 28 février, les États-Unis ont brièvement arrêté l’aide militaire, et le 11 mars l’Ukraine a accepté une proposition américaine pour un cessez-le-feu de 30 jours, ce que la Russie n’a pas fait. Les pourparlers directs russo-ukrainiens à Istanbul de mai à juillet ont produit les plus grands échanges de prisonniers de la guerre, et Trump a rencontré Poutine en Alaska le 15 août, mais il n’y avait pas de cessez-le-feu. Un plan de paix américain en novembre a conduit à des pourparlers à Genève, Berlin et Floride ; fin décembre Zelensky a déclaré qu’un cadre de 20 points était convenu 90 %, mais non territoire."
"Russian drone and missile attacks grew heavier. On 7 September Russia launched a record 810 drones, and the government building in Kyiv was damaged. On the night of 9–10 September drones crossed into Poland, where Polish and allied aircraft shot some down, and NATO launched Eastern Sentry to guard its eastern flank. A strike on apartment blocks in Ternopil on 19 November killed at least 38 people. The UN counted 2,514 civilians killed in 2025, the highest yearly toll since 2022.": "Le 7 septembre, la Russie a lancé un record de 810 drones et le bâtiment du gouvernement à Kiev a été endommagé. Dans la nuit du 9 au 10 septembre, des drones ont traversé la Pologne, où des avions polonais et alliés en ont abattu, et l’OTAN a lancé la Sentry orientale pour protéger son flanc est. Une attaque sur les blocs d’appartements à Ternopil le 19 novembre a tué au moins 38 personnes. L’ONU a dénombré 2 514 civils tués en 2025, ce qui représente le plus fort bilan annuel depuis 2022."
