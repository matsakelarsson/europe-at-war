"The advance on Kyiv stalled in the north-western suburbs of Irpin, Bucha and Hostomel and on the roads from the east, as Ukrainian troops struck its long supply columns. On 25 March the Russian general staff said the first phase was over and that it would concentrate on the Donbas, and after talks in Istanbul on 29 March it announced that it would cut back its operations around Kyiv and Chernihiv. By early April Russian forces had left the Kyiv, Chernihiv and Sumy regions for Belarus and Russia. On 14 April the cruiser Moskva, flagship of the Black Sea Fleet, sank; Ukraine said it had hit her with missiles, while Russia spoke of a fire.": "Le 25 mars, l’état-major russe a déclaré que la première phase était terminée et qu’elle se concentrerait sur les Donbas, et après des pourparlers à Istanbul le 29 mars, il a annoncé qu’il couperait ses opérations autour de Kiev et Chernihiv. Au début d’avril, les forces russes avaient quitté les régions de Kiev, Chernihiv et Sumy pour la Biélorussie et la Russie. Le 14 avril, le croiseur Moskva, amiral de la flotte de la mer Noire, a coulé ; l’Ukraine a dit qu’elle avait frappé avec des missiles, tandis que la Russie parlait d’un incendie."
"In the towns the Russians left behind, Ukrainian troops and journalists found the bodies of civilians in streets, yards and mass graves. In Bucha alone local officials counted more than 400 dead, many of them shot. UN human rights monitors documented the unlawful killing of dozens of civilians there, and a UN commission of inquiry later found that Russian forces had committed war crimes, including executions, in the Kyiv region. Russia denied it and called the images staged. On 8 April a missile carrying cluster munitions struck crowds waiting to be evacuated at Kramatorsk railway station, killing about 60 people; Russia blamed Ukraine.": "Dans les villes laissées par les Russes, les troupes et les journalistes ukrainiens ont trouvé les cadavres de civils dans les rues, les cours et les fosses communes. A Bucha seul, des responsables locaux ont dénombré plus de 400 morts, dont un grand nombre ont été abattus. Des observateurs des droits de l’homme de l’ONU ont documenté le meurtre illégal de dizaines de civils là-bas, et une commission d’enquête de l’ONU a constaté plus tard que les forces russes avaient commis des crimes de guerre, y compris des exécutions, dans la région de Kiev. Le 8 avril, un missile portant des armes à sous-munitions a frappé des foules qui attendaient d’être évacuées à la gare de Kramatorsk, tuant une soixantaine de personnes ; la Russie blâmait l’Ukraine."
