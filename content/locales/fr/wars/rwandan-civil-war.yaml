# French translations of the catalogue text (wave 13); step bodies follow later.
Rwandan Civil War: Guerre civile rwandaise
? The war between the Rwandan government of President Juvénal Habyarimana and the Rwandan Patriotic Front (RPF), a rebel army formed mostly of Tutsi refugees in Uganda, during which extremists in the government carried out the genocide against the Tutsi in 1994. Hundreds of thousands of Tutsi had fled Rwanda after the revolution of 1959–1962, and many of their children grew up in Uganda, where Fred Rwigyema and Paul Kagame rose in Yoweri Museveni’s army. On 1 October 1990 the RPF invaded from Uganda; with French, Belgian and Zairian help the Rwandan army threw it back, and Rwigyema was killed. Under Kagame the RPF fought a guerrilla war from the Virunga mountains and the northern border, while the government arrested thousands of Tutsi and local officials organised massacres of them. A ceasefire in July 1992 led to talks at Arusha, and after a new RPF offensive in February 1993 brought it within 30 kilometres of Kigali, the Arusha Accords of 4 August 1993 provided for power-sharing, a merged army and a UN peacekeeping force, UNAMIR. Extremists of the Hutu Power movement, with their militias, the Interahamwe and Impuzamugambi, and the radio station RTLM, rejected the deal. On 6 April 1994 Habyarimana’s plane was shot down over Kigali, and within hours soldiers and militias began killing Tutsi and moderate Hutu across the country. In about 100 days they killed between 500,000 and 662,000 Tutsi according to most scholarly estimates (the Rwandan government counts 1,074,017 victims of the genocide), as well as many Hutu opponents. The RPF resumed the war on 7–8 April, took Kigali on 4 July and the last government stronghold, Gisenyi, on 18 July, ending the genocide and the war; France’s Opération Turquoise held a zone in the south-west until August. About 2 million Hutu fled to Zaire, Tanzania and Burundi, and RPF soldiers also killed civilians, by some estimates tens of thousands. The war and the refugee camps in Zaire led directly to the Congo wars.
: La guerre qui opposa le gouvernement rwandais du président Juvénal Habyarimana au Front patriotique rwandais (FPR), une armée rebelle formée surtout de réfugiés tutsi en Ouganda, et au cours de laquelle des extrémistes au sein du gouvernement perpétrèrent le génocide des Tutsi en 1994. Des centaines de milliers de Tutsi avaient fui le Rwanda après la révolution de 1959–1962, et beaucoup de leurs enfants grandirent en Ouganda, où Fred Rwigyema et Paul Kagame firent carrière dans l’armée de Yoweri Museveni. Le 1er octobre 1990, le FPR envahit le pays depuis l’Ouganda ; avec l’aide de la France, de la Belgique et du Zaïre, l’armée rwandaise le repoussa, et Rwigyema fut tué. Sous la direction de Kagame, le FPR mena une guérilla depuis les monts Virunga et la frontière nord, tandis que le gouvernement arrêtait des milliers de Tutsi et que des responsables locaux organisaient des massacres contre eux. Un cessez-le-feu conclu en juillet 1992 ouvrit des négociations à Arusha et, après qu’une nouvelle offensive du FPR en février 1993 l’eut amené à 30 kilomètres de Kigali, les accords d’Arusha du 4 août 1993 prévirent un partage du pouvoir, la fusion des armées et une force de maintien de la paix de l’ONU, la MINUAR. Les extrémistes du mouvement Hutu Power, avec leurs milices, les Interahamwe et les Impuzamugambi, et la station de radio RTLM, rejetèrent l’accord. Le 6 avril 1994, l’avion de Habyarimana fut abattu au-dessus de Kigali et, en quelques heures, soldats et miliciens commencèrent à tuer des Tutsi et des Hutu modérés dans tout le pays. En une centaine de jours, ils tuèrent entre 500 000 et 662 000 Tutsi selon la plupart des estimations des chercheurs (le gouvernement rwandais dénombre 1 074 017 victimes du génocide), ainsi que de nombreux opposants hutu. Le FPR reprit la guerre les 7 et 8 avril, prit Kigali le 4 juillet et le dernier bastion gouvernemental, Gisenyi, le 18 juillet, mettant fin au génocide et à la guerre ; l’opération Turquoise française tint une zone dans le sud-ouest jusqu’en août. Environ 2 millions de Hutu s’enfuirent au Zaïre, en Tanzanie et au Burundi, et des soldats du FPR tuèrent eux aussi des civils, des dizaines de milliers selon certaines estimations. La guerre et les camps de réfugiés au Zaïre menèrent directement aux guerres du Congo.
