# French translations of the catalogue text (wave 13); step bodies follow later.
Rwandan Revolution and the Inyenzi raids: Révolution rwandaise et raids des Inyenzi
? "The violent overthrow of the Tutsi monarchy in Rwanda, then a Belgian-administered UN trust territory, and the armed attempts of Tutsi exiles to return, from 1959 to the late 1960s. Under Belgian rule the Tutsi elite around the king (mwami) held almost all chiefships, and in 1957 Hutu intellectuals led by Grégoire Kayibanda answered with the Bahutu Manifesto. After King Mutara III Rudahigwa died in July 1959, his brother Kigeli V was installed against Belgian wishes and monarchists formed UNAR, while Kayibanda founded PARMEHUTU. On 1 November 1959 UNAR youths attacked the Hutu sub-chief Dominique Mbonyumutwa at Byimana; rumours of his death set off Hutu attacks on Tutsi officials and the burning of Tutsi homes across the country, and from 7 November the king’s militias struck back, killing Hutu leaders. The Belgian Colonel Guy Logiest restored order and then replaced Tutsi chiefs with Hutu, and PARMEHUTU won the communal elections of mid-1960; Kigeli left the country in July 1960. On 28 January 1961, with Logiest’s backing, Hutu councillors meeting at Gitarama proclaimed a republic, confirmed by a referendum on 25 September 1961 that abolished the monarchy, and Rwanda became independent on 1 July 1962 with Kayibanda as president. Local massacres of Tutsi went on through 1960 and 1961, and by late 1964 at least 336,000 Tutsi had fled to Burundi, Uganda, Tanganyika and the Congo. From late 1960 armed exiles, called Inyenzi (“cockroaches”), raided Rwanda from these countries. On 21 December 1963 several hundred crossed from Burundi, took the army camp at Gako in Bugesera and advanced towards Kigali before they were beaten. The government’s reprisals were the largest killing of Tutsi before 1994: estimates for December 1963 and January 1964 range from 1,000–3,000 (UN) and at least 10,000 (René Lemarchand) to 10,000–14,000 (World Council of Churches) and higher, many of them in Gikongoro prefecture, and the Tutsi politicians still in the country were executed. Smaller Inyenzi raids were repelled until about 1966–1967. The exiles and their children later formed the Rwandan Patriotic Front, which invaded in 1990."
: "Le renversement violent de la monarchie tutsi au Rwanda, alors territoire sous tutelle de l’ONU administré par la Belgique, et les tentatives armées des exilés tutsi pour revenir, de 1959 à la fin des années 1960. Sous la domination belge, l’élite tutsi qui entourait le roi (mwami) détenait presque toutes les chefferies et, en 1957, des intellectuels hutu menés par Grégoire Kayibanda répondirent par le Manifeste des Bahutu. Après la mort du roi Mutara III Rudahigwa en juillet 1959, son frère Kigeli V fut intronisé contre la volonté des Belges et les monarchistes fondèrent l’UNAR, tandis que Kayibanda créait le PARMEHUTU. Le 1er novembre 1959, des jeunes de l’UNAR agressèrent le sous-chef hutu Dominique Mbonyumutwa à Byimana ; la rumeur de sa mort déclencha des attaques de Hutu contre des responsables tutsi et l’incendie de maisons tutsi dans tout le pays et, à partir du 7 novembre, les milices du roi ripostèrent en tuant des dirigeants hutu. Le colonel belge Guy Logiest rétablit l’ordre puis remplaça les chefs tutsi par des Hutu, et le PARMEHUTU remporta les élections communales du milieu de 1960 ; Kigeli quitta le pays en juillet 1960. Le 28 janvier 1961, avec l’appui de Logiest, des conseillers hutu réunis à Gitarama proclamèrent la république, confirmée par un référendum le 25 septembre 1961 qui abolit la monarchie, et le Rwanda devint indépendant le 1er juillet 1962, avec Kayibanda pour président. Des massacres locaux de Tutsi se poursuivirent tout au long de 1960 et de 1961 et, à la fin de 1964, au moins 336 000 Tutsi avaient fui au Burundi, en Ouganda, au Tanganyika et au Congo. À partir de la fin de 1960, des exilés armés, appelés Inyenzi (« cafards »), lancèrent depuis ces pays des raids contre le Rwanda. Le 21 décembre 1963, plusieurs centaines d’entre eux passèrent la frontière depuis le Burundi, prirent le camp militaire de Gako, dans le Bugesera, et avancèrent vers Kigali avant d’être battus. Les représailles du gouvernement furent le plus grand massacre de Tutsi avant 1994 : les estimations pour décembre 1963 et janvier 1964 vont de 1 000–3 000 morts (ONU) et d’au moins 10 000 (René Lemarchand) jusqu’à 10 000–14 000 (Conseil œcuménique des Églises), voire davantage, en grande partie dans la préfecture de Gikongoro, et les responsables politiques tutsi encore présents dans le pays furent exécutés. Des raids inyenzi de moindre ampleur furent repoussés jusque vers 1966–1967. Les exilés et leurs enfants formèrent plus tard le Front patriotique rwandais, qui envahit le pays en 1990."
