# French translations of the catalogue text (wave 12); step bodies follow later.
Saadian succession war: Guerre de succession saadienne
? The war among the sons of Ahmad al-Mansur that split Saadian Morocco for a quarter of a century. When al-Mansur died of plague in August 1603, his sons Zidan, Abu Faris and Mohammed al-Shaykh al-Ma’mun fought over the throne, and the realm divided between a sultanate ruled from Marrakesh and one ruled from Fez. Marrakesh changed hands again and again; al-Ma’mun fled to Spain in 1608 and in 1610 handed over the port of Larache in return for Spanish help, a cession that cost him and the dynasty much of their standing. A scholar who proclaimed himself the Mahdi, Ahmad ibn Abi Mahalli, drove Zidan out of Marrakesh in 1612–1613; Spain took al-Ma’mura (Mehdya) in 1614; Moriscos expelled from Spain built a corsair state at Salé; and religious war leaders such as Muhammad al-Ayyashi fought the Spanish and Portuguese garrisons and defied the sultans. Plague added to the toll. The two Saadian states were reunited in 1627 under Zidan’s son Abd al-Malik II, but the dynasty never recovered its authority, and the zawiya of Dila and the Alaouites of Tafilalt divided the country after it.
: La guerre entre les fils d’Ahmad al-Mansur qui divisa le Maroc saadien pendant un quart de siècle. Lorsqu’al-Mansur mourut de la peste en août 1603, ses fils Zidan, Abu Faris et Mohammed al-Shaykh al-Ma’mun se disputèrent le trône, et le royaume se scinda en un sultanat gouverné depuis Marrakech et un autre gouverné depuis Fès. Marrakech changea de mains à maintes reprises ; al-Ma’mun s’enfuit en Espagne en 1608 et, en 1610, livra le port de Larache en échange de l’aide espagnole, une cession qui lui coûta, ainsi qu’à la dynastie, une grande partie de leur prestige. Un lettré qui se proclama Mahdi, Ahmad ibn Abi Mahalli, chassa Zidan de Marrakech en 1612–1613 ; l’Espagne prit al-Ma’mura (Mehdya) en 1614 ; des Morisques expulsés d’Espagne fondèrent un État corsaire à Salé ; et des chefs de guerre religieux comme Muhammad al-Ayyashi combattirent les garnisons espagnoles et portugaises et défièrent les sultans. La peste alourdit encore le bilan. Les deux États saadiens furent réunifiés en 1627 sous Abd al-Malik II, fils de Zidan, mais la dynastie ne retrouva jamais son autorité, et la zaouïa de Dila et les Alaouites du Tafilalet se partagèrent le pays après elle.
