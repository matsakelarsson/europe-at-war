# French translations of the catalogue text (wave 12); step bodies follow later.
Saadian rise to power: Avènement des Saadiens
? The rise of the Saadians, a family of sharifs (descendants of the Prophet) from the Draa valley, from leaders of the holy war against the Portuguese in the Sous to rulers of all Morocco. Recognised as war leader by the tribes and Sufi brotherhoods of the Sous in 1510, Muhammad al-Qa’im left the movement to his sons Ahmad al-Araj and Muhammad al-Shaykh, who took Marrakesh in 1524 or 1525. After the treaty of Tadla (1527) Morocco was divided between them and the Wattasid sultans of Fez, until the Saadians routed the Wattasids in 1536. In 1541 Muhammad al-Shaykh took the Portuguese fortress at Agadir, which made his name and led Portugal to abandon Safi and Azemmour; he then pushed his brother aside and in January 1549 took Fez. His attempt to take Tlemcen in 1550 brought him into conflict with the Ottomans of Algiers, who drove his army out in 1551 and in January 1554 took Fez and restored the Wattasid Abu Hassun. Muhammad al-Shaykh defeated and killed Abu Hassun and retook Fez in September 1554, ending the Wattasid dynasty.
: L’ascension des Saadiens, une famille de chérifs (descendants du Prophète) de la vallée du Drâa, qui passèrent du rang de chefs de la guerre sainte contre les Portugais dans le Souss à celui de souverains de tout le Maroc. Reconnu comme chef de guerre par les tribus et les confréries soufies du Souss en 1510, Muhammad al-Qa’im laissa le mouvement à ses fils Ahmad al-Araj et Muhammad al-Shaykh, qui prirent Marrakech en 1524 ou 1525. Après le traité de Tadla (1527), le Maroc fut partagé entre eux et les sultans wattassides de Fès, jusqu’à ce que les Saadiens mettent les Wattassides en déroute en 1536. En 1541, Muhammad al-Shaykh prit la forteresse portugaise d’Agadir, ce qui fit sa renommée et poussa le Portugal à abandonner Safi et Azemmour ; il écarta ensuite son frère et, en janvier 1549, prit Fès. Sa tentative de prendre Tlemcen en 1550 le mit en conflit avec les Ottomans d’Alger, qui chassèrent son armée en 1551 et, en janvier 1554, prirent Fès et rétablirent le Wattasside Abu Hassun. Muhammad al-Shaykh vainquit et tua Abu Hassun et reprit Fès en septembre 1554, mettant fin à la dynastie wattasside.
