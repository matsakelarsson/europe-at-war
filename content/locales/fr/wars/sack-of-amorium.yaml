"837": "837"
"Sack of Amorium": "Sac d’Amorium"
"The Abbasid caliph al-Mu’tasim’s revenge for the Byzantine sack of Sozopetra in 837. His armies beat the Emperor Theophilos at Anzen, took Ancyra and in August 838 stormed and destroyed Amorium, the home city of the ruling dynasty and one of the largest cities of Byzantine Asia Minor.": "En 837, le calife abbasside al-Mu. Tasim se venge du sac byzantin de Sozopetra. Ses armées battent l’empereur Théophile à Anzen, prennent Ancyra et en août 838 s’empare et détruit Amorium, ville natale de la dynastie dominante et une des plus grandes villes de Byzantine Asie Mineure."
"The campaign is described by Byzantine chroniclers and, in more detail, by the Arab historian al-Tabari; Michael the Syrian gives what is thought the most reliable figure for the caliph’s army, about 80,000 fighting men. Other writers give far larger numbers, as they do for the dead of Amorium (30,000 according to al-Mas’udi, 70,000 according to Theophanes Continuatus).": "La campagne est décrite par les chroniqueurs byzantins et, plus en détail, par l’historien arabe al-Tabari ; Michael le Syrien donne ce que l’on pense la figure la plus fiable pour l’armée calife, environ 80 000 hommes de combat. D’autres écrivains donnent beaucoup plus de nombre, comme ils le font pour les morts d’Amorium (30 000 selon al-Masoudi, 70 000 selon Theophanes Continuatus)."
"The date of the fall of Amorium is given by modern historians as 12, 13 or 15 August 838. Ancyra is today’s Ankara; Amorium lay near Emirdağ in Afyonkarahisar province, and the site of Sozopetra (Zibatra) is uncertain.": "La date de la chute d’Amorium est donnée par les historiens modernes comme 12, 13 ou 15 août 838. Ancyra est aujourd'hui Ankara ; Amorium se trouve près d’Emirdağ dans la province d’Afyonkarahisar, et le site de Sozopetra (Zibatra) est incertain."
