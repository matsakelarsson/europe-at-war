"837–838": "837–838"
"In 837 the Emperor Theophilos raided the Abbasid frontier on the upper Euphrates, encouraged by the Khurramite rebels then fighting the caliph. He sacked Sozopetra, said by some sources to be the caliph’s birthplace, killed its men and enslaved its women and children. Once the revolt was crushed, al-Mu’tasim gathered a great army at Tarsus and chose as his target Amorium, the home of Theophilos’s family. One army under Afshin, with the emir of Melitene and Armenian princes, crossed the frontier in the north-east; the caliph led the other through the Cilician Gates. On 22 July Theophilos attacked Afshin at Anzen, near Dazimon. His army broke, and he escaped with difficulty.": "En 837, l’Empereur Théophilos fit une descente dans la frontière abbasside sur le haut de l’Euphrate, encouragé par les rebelles Khurramites, puis combattit le calife. Il saccagea Sozopetra, dit par certaines sources être le lieu de naissance du califat, tua ses hommes et asservit ses femmes et ses enfants. Une fois la révolte écrasée, al-Mu=tasim rassembla une grande armée à Tarse et choisit comme cible Amorium, la maison de la famille Théophile. Une armée sous Afshin, avec l’émir de Mélithène et les princes arméniens, franchit la frontière dans le nord-est ; le calife conduisit l’autre par les Portes ciliciennes. Le 22 juillet, Théophilos attaqua Afshin à Anzen, près de Dazimon. Son armée se rompit et il s’échappa avec difficulté."
"The caliph’s army found Ancyra abandoned, plundered it and laid siege to Amorium on 1 August. A defector showed the besiegers a stretch of wall that had been badly repaired, and they made a breach. After about two weeks Boiditzes, the officer holding the breach, went to bargain with the caliph on his own, and the Arabs broke in. The city was sacked and burned and its people killed or enslaved. Al-Mu’tasim turned home on hearing of a plot against him; many captives died on the march across the dry plateau. Forty-two officers who refused to convert were executed at Samarra in 845 and are venerated as the 42 Martyrs of Amorium.": "L’armée du calife trouva Ancyra abandonné, pillé et assiégé à Amorium le 1er août. Un transfuge montra aux assiégeurs une partie de mur qui avait été mal réparée, et ils firent une brèche. Après environ deux semaines Boiditzes, l’officier tenant la brèche, alla négocier avec le calife lui-même, et les Arabes entrèrent. La ville a été saccagée et brûlée et son peuple tué ou esclave. Al-Muatasim est retourné à la maison après avoir entendu parler d’un complot contre lui ; de nombreux captifs sont morts sur la marche à travers le plateau sec. Quarante-deux officiers qui ont refusé de convertir ont été exécutés à Samarra en 845 et sont vénérés comme les 42 martyrs de l’Amorium."
