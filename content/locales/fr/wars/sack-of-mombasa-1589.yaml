# French translations of the catalogue text (wave 13); step bodies follow later.
Mir Ali Bey’s expeditions and the sack of Mombasa: Les expéditions de Mir Ali Bey et le sac de Mombasa
The Ottoman challenge to Portugal on the Swahili coast in the 1580s and its end at Mombasa. The corsair Mir Ali Bey sailed from Yemen with a single galliot in 1585–1586 and was welcomed by town after town, from Mogadishu to Mombasa, as a deliverer from Portuguese tribute; only Malindi held out. He returned to Mocha with captured Portuguese ships, plunder and prisoners. A Portuguese fleet from Goa sacked Faza in 1587 and fined Mombasa. In 1588 Mir Ali Bey came back with five galleys and fortified Mombasa, and in March 1589 a fleet under Tomé de Sousa Coutinho attacked him there just as the Zimba, a mysterious army that had come up the coast from the Zambezi, crossed from the mainland. Caught between them, the Ottomans were destroyed and Mir Ali Bey surrendered to the Portuguese; Mombasa was sacked, and the Zimba were then beaten at Malindi by the Segeju. The Portuguese punished the towns that had joined the Ottomans, made Mombasa their headquarters and in 1593 began Fort Jesus.: Le défi ottoman lancé au Portugal sur la côte swahilie dans les années 1580, et son dénouement à Mombasa. Le corsaire Mir Ali Bey partit du Yémen avec une seule galiote en 1585–1586 et fut accueilli de ville en ville, de Mogadiscio à Mombasa, comme un libérateur du tribut portugais ; seule Malindi résista. Il regagna Moka avec des navires portugais capturés, du butin et des prisonniers. Une flotte portugaise venue de Goa mit Faza à sac en 1587 et frappa Mombasa d’une amende. En 1588, Mir Ali Bey revint avec cinq galères et fortifia Mombasa et, en mars 1589, une flotte commandée par Tomé de Sousa Coutinho l’y attaqua au moment même où les Zimba, une mystérieuse armée qui avait remonté la côte depuis le Zambèze, passaient du continent sur l’île. Pris entre les deux, les Ottomans furent anéantis et Mir Ali Bey se rendit aux Portugais ; Mombasa fut mise à sac, puis les Zimba furent battus à Malindi par les Segeju. Les Portugais punirent les villes qui s’étaient ralliées aux Ottomans, firent de Mombasa leur quartier général et entreprirent en 1593 la construction de Fort Jesus.
