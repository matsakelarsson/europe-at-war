# French translations of the catalogue text (wave 7); step bodies follow later.
Safavid conquest of Iran: Conquête safavide de l’Iran
The campaigns in which Ismail, the teenage head of the Safavid Sufi order of Ardabil, and his Turkmen followers, the Qizilbash, conquered Iran in ten years. In 1500–1501 they killed the Shirvanshah, defeated the Aq Qoyunlu at Sharur and took Tabriz, where Ismail was proclaimed shah and made Twelver Shi‘ism the religion of the state. His victory at Hamadan in 1503 gave him western and central Iran; by 1508 he had taken Diyarbakır and Baghdad, ending the Aq Qoyunlu; and in 1510 he defeated and killed the Uzbek ruler Muhammad Shaybani at Merv and annexed Khorasan. The Safavid state lasted until 1736, and its frontiers roughly foreshadowed those of modern Iran.: Les campagnes par lesquelles Ismaïl, chef encore adolescent de l’ordre soufi safavide d’Ardabil, et ses partisans turkmènes, les Qizilbash, conquirent l’Iran en dix ans. En 1500–1501, ils tuèrent le chirvanchah, battirent les Aq Qoyunlu à Charour et prirent Tabriz, où Ismaïl fut proclamé shah et fit du chiisme duodécimain la religion de l’État. Sa victoire à Hamadan en 1503 lui donna l’ouest et le centre de l’Iran ; en 1508, il avait pris Diyarbakır et Bagdad, mettant fin aux Aq Qoyunlu ; et en 1510, il vainquit et tua le souverain ouzbek Muhammad Chaybani à Merv et annexa le Khorassan. L’État safavide dura jusqu’en 1736, et ses frontières préfiguraient à peu près celles de l’Iran moderne.
