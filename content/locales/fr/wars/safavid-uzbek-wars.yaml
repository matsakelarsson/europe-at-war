# French translations of the catalogue text (wave 7); step bodies follow later.
Safavid–Uzbek wars: Guerres entre Safavides et Ouzbeks
The long struggle for Khorasan between Safavid Persia and the Shaybanid Uzbeks of Bukhara, which began when Shah Ismail I defeated and killed Muhammad Shaybani at Merv in 1510. The Uzbeks raided and besieged Herat, Mashhad and Astarabad again and again whenever Persia was weak or busy fighting the Ottomans. The young Shah Tahmasp beat Ubaydullah Khan at Jam in 1528, but in 1588–1589 Abdullah Khan II took Herat and his son sacked Mashhad, and the Uzbeks held most of Khorasan for a decade. After Abdullah’s death Shah Abbas I won it back with his reformed army, retaking Mashhad and defeating the Uzbeks outside Herat in August 1598.: La longue lutte pour le Khorassan entre la Perse safavide et les Ouzbeks chaybanides de Boukhara, qui commença lorsque le shah Ismaïl Ier vainquit et tua Muhammad Chaybani à Merv en 1510. Les Ouzbeks ne cessèrent de razzier et d’assiéger Hérat, Mechhed et Astarabad chaque fois que la Perse était affaiblie ou occupée à combattre les Ottomans. Le jeune shah Tahmasp battit Ubaydullah Khan à Jam en 1528, mais en 1588–1589 Abdullah Khan II prit Hérat et son fils mit à sac Mechhed, et les Ouzbeks tinrent la plus grande partie du Khorassan pendant une décennie. Après la mort d’Abdullah, le shah Abbas Ier le reconquit avec son armée réformée, reprenant Mechhed et battant les Ouzbeks devant Hérat en août 1598.
