# French translations of the catalogue text (wave 7); step bodies follow later.
Saffarid conquests: Conquêtes saffarides
The conquests of Ya’qub ibn al-Layth, a coppersmith (saffar) from Sistan who rose from the local volunteer bands to build an empire across eastern Iran and Afghanistan, and of his brother Amr. Ya’qub took power in Sistan in 861, fought the Kharijites and the Zunbils, took Herat, Kerman and Kabul, ended Tahirid rule in Khorasan in 873 and took Fars, but when he marched on Baghdad the caliph’s army beat him at Dayr al-Aqul in 876. Amr made peace with the caliphs and ruled Khorasan, Fars, Kerman and Sistan until the caliph granted him Transoxiana, held by the Samanids. In 900 the Samanid Ismail ibn Ahmad defeated and captured him near Balkh, and Khorasan passed to the Samanids.: Les conquêtes de Ya’qub ibn al-Layth, un chaudronnier (saffar) du Sistan qui, parti des bandes de volontaires locales, bâtit un empire s’étendant sur l’est de l’Iran et l’Afghanistan, puis celles de son frère Amr. Ya’qub prit le pouvoir au Sistan en 861, combattit les kharidjites et les Zunbils, prit Hérat, Kerman et Kaboul, mit fin à la domination tahiride au Khorassan en 873 et s’empara du Fars, mais lorsqu’il marcha sur Bagdad, l’armée du calife le battit à Dayr al-Aqul en 876. Amr fit la paix avec les califes et gouverna le Khorassan, le Fars, le Kerman et le Sistan jusqu’à ce que le calife lui concède la Transoxiane, que tenaient les Samanides. En 900, le Samanide Ismail ibn Ahmad le vainquit et le captura près de Balkh, et le Khorassan passa aux Samanides.
