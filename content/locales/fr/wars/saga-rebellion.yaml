# French translations of the catalogue text (wave 10); step bodies follow later.
Saga rebellion: Rébellion de Saga
? The first of the armed risings of former samurai (shizoku) against the Meiji government, in the former Saga (Hizen) domain in northern Kyushu. The samurai had lost their stipends, their status and their monopoly of arms, and when the government refused in 1873 to send an expedition against Korea (the Seikanron debate), the former justice minister Etō Shinpei and other councillors resigned in protest. In January 1874 Etō returned to Saga, where he led the Seikantō, the party for war with Korea, while the former Akita governor Shima Yoshitake led the Yūkokutō, conservatives who wanted the old order back. On 16 February their followers seized a bank and the government offices in the old Saga castle; estimates of their strength range from about 3,000 to 11,000. The interior minister Ōkubo Toshimichi took personal command, set up his headquarters at Hakata on 19 February and brought in some 5,000 soldiers and police with steamships and the telegraph. After the rebels lost a battle on the Saga–Fukuoka border on 22 February Etō disbanded his followers and fled; the rest fought on in the streets of Saga on 27 February, and government troops took the castle on 1 March. Government losses were 147 killed and 209 wounded, rebel losses 173 killed and 160 wounded. Etō was caught in Tosa on 28 March and Shima in Kagoshima; after a military trial they and eleven others were executed on 13 April, and Etō’s head was put on public display. Satsuma and Tosa did not rise with Saga, and the government’s speed set the pattern for the risings of 1876 and 1877.
: Le premier des soulèvements armés d’anciens samouraïs (shizoku) contre le gouvernement de Meiji, dans l’ancien domaine de Saga (Hizen), au nord de Kyushu. Les samouraïs avaient perdu leurs pensions, leur statut et leur monopole des armes et, lorsque le gouvernement refusa en 1873 d’envoyer une expédition contre la Corée (le débat du Seikanron), l’ancien ministre de la Justice Etō Shinpei et d’autres conseillers démissionnèrent en signe de protestation. En janvier 1874, Etō revint à Saga, où il prit la tête du Seikantō, le parti favorable à la guerre contre la Corée, tandis que l’ancien gouverneur d’Akita Shima Yoshitake dirigeait le Yūkokutō, des conservateurs qui voulaient le retour de l’ordre ancien. Le 16 février, leurs partisans s’emparèrent d’une banque et des bureaux du gouvernement dans l’ancien château de Saga ; les estimations de leurs effectifs vont d’environ 3 000 à 11 000 hommes. Le ministre de l’Intérieur Ōkubo Toshimichi prit personnellement le commandement, établit son quartier général à Hakata le 19 février et fit venir quelque 5 000 soldats et policiers en s’appuyant sur les navires à vapeur et le télégraphe. Après la défaite des rebelles dans une bataille à la limite entre Saga et Fukuoka le 22 février, Etō dispersa ses partisans et s’enfuit ; les autres continuèrent le combat dans les rues de Saga le 27 février, et les troupes gouvernementales prirent le château le 1er mars. Les pertes gouvernementales s’élevèrent à 147 tués et 209 blessés, celles des rebelles à 173 tués et 160 blessés. Etō fut pris en Tosa le 28 mars et Shima à Kagoshima ; après un procès militaire, ils furent exécutés avec onze autres le 13 avril, et la tête d’Etō fut exposée publiquement. Satsuma et Tosa ne se soulevèrent pas avec Saga, et la rapidité du gouvernement servit de modèle face aux soulèvements de 1876 et 1877.
