"Saintonge War": "Guerre de Saintonge"
"A revolt of the lords of Poitou, led by Hugh X of Lusignan, count of La Marche, against Louis IX’s brother Alphonse, newly installed as count of Poitou, which Henry III of England joined in the hope of winning back his family’s lost lands. Louis took the Lusignan castles and beat the English and the rebels at the bridge of Taillebourg on the Charente on 21–22 July 1242 and at Saintes the next day. Henry withdrew to Bordeaux, Hugh submitted on 24 July, and a rising by Raymond VII of Toulouse collapsed by the end of the year. A truce followed in 1243, and the Treaty of Paris of 1259 settled the English king’s claims.": "Une révolte des seigneurs de Poitou, dirigée par Hugh X de Lusignan, comte de La Marche, contre le frère Louis IX, Alphonse, nouvellement installé comme comte de Poitou, que Henri III d’Angleterre a rejoint dans l’espoir de récupérer sa famille. Louis prit les châteaux de Lusignan et battit les Anglais et les rebelles au pont de Taillebourg sur la Charente du 21 au 22 juillet 1242 et à Saintes le lendemain. Henry se retira à Bordeaux, Hugh soumetta le 24 juillet, et une montée par Raymond VII de Toulouse s’effondra à la fin de l’année. Une trêve suivit en 1243, et le traité de Paris de 1259 régla les revendications du roi anglais."
