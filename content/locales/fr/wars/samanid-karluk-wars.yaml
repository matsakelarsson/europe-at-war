# French translations of the catalogue text (wave 7); step bodies follow later.
Samanid campaigns against the Karluks: Campagnes samanides contre les Karlouks
The campaigns of the Samanid rulers of Transoxiana against the Karluk Turks of the steppes to the north-east, which culminated in 893, when Ismail ibn Ahmad marched beyond the Syr Darya and took Taraz (Talas), the Karluks’ chief town. His troops carried off large numbers of slaves and livestock, and a Nestorian church in the town was turned into a mosque. With Ismail’s annexation of the principality of Ushrusana in the same years, the campaign secured the Samanid frontier on the Syr Darya and opened the steppe to Muslim merchants and missionaries. Many Turkic groups north of the river became Muslim in the following century, among them the Kara-Khanids, who overthrew the Samanids in 999.: Les campagnes des souverains samanides de Transoxiane contre les Turcs karlouks des steppes du nord-est, qui culminèrent en 893, quand Ismail ibn Ahmad marcha au-delà du Syr-Daria et prit Taraz (Talas), la principale ville des Karlouks. Ses troupes emmenèrent un grand nombre d’esclaves et de têtes de bétail, et une église nestorienne de la ville fut transformée en mosquée. Avec l’annexion par Ismail de la principauté d’Ushrusana dans les mêmes années, la campagne assura la frontière samanide sur le Syr-Daria et ouvrit la steppe aux marchands et aux missionnaires musulmans. De nombreux groupes turcs au nord du fleuve se convertirent à l’islam au siècle suivant, parmi lesquels les Karakhanides, qui renversèrent les Samanides en 999.
