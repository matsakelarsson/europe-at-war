# French translations of the catalogue text (wave 10); step bodies follow later.
Sambyeolcho rebellion: Rébellion des Sambyeolcho
The last resistance to the peace between Goryeo and the Mongols, led by the Sambyeolcho, the elite units that had served Goryeo’s military rulers. When the court moved back from Ganghwa Island to Kaegyong in 1270 and ordered the units disbanded, their commander Bae Jung-son rebelled, made a royal relative, Wang On, king, and sailed south with more than 1,000 ships to the island of Jindo. From the fortress of Yongjang there the Sambyeolcho controlled the south-western coasts and islands and raided the provinces, and they took Jeju. In the fifth month of 1271 a Goryeo and Mongol army stormed Jindo; Wang On and Bae Jung-son were killed and more than 10,000 people were carried off. Kim Tong-jeong carried on the fight from Jeju until a force of 12,000 Goryeo, Mongol and Chinese troops took the island in 1273. Jeju then came under direct Yuan rule until 1294, and the way was clear for the Mongol invasions of Japan.: La dernière résistance à la paix entre Goryeo et les Mongols, menée par les Sambyeolcho, les unités d’élite qui avaient servi les dirigeants militaires de Goryeo. Lorsque la cour quitta l’île de Ganghwa pour revenir à Kaegyong en 1270 et ordonna la dissolution de ces unités, leur commandant Bae Jung-son se rebella, fit roi un parent de la famille royale, Wang On, et fit voile vers le sud avec plus de 1 000 navires jusqu’à l’île de Jindo. Depuis la forteresse de Yongjang, les Sambyeolcho contrôlèrent les côtes et les îles du sud-ouest, lancèrent des raids sur les provinces et s’emparèrent de Jeju. Au cinquième mois de 1271, une armée de Goryeo et des Mongols prit Jindo d’assaut ; Wang On et Bae Jung-son furent tués et plus de 10 000 personnes furent emmenées en captivité. Kim Tong-jeong poursuivit le combat depuis Jeju jusqu’à ce qu’une force de 12 000 soldats de Goryeo, mongols et chinois prenne l’île en 1273. Jeju passa alors sous l’administration directe des Yuan jusqu’en 1294, et la voie fut libre pour les invasions mongoles du Japon.
