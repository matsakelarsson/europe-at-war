# French translations of the catalogue text (wave 10); step bodies follow later.
Revolt of the three ports (Sampo waeran): Révolte des trois ports (Sampo waeran)
? A revolt by the Japanese living in the three Korean ports open to Japanese trade, and the later clashes that grew out of it. From the early fifteenth century Joseon allowed Japanese ships to trade only at Busanpo (Busan), Jepo (Naeipo, in today’s Changwon) and Yeompo (Ulsan). Japanese from Tsushima settled there in growing numbers, from 206 in 1436 to more than 3,000 by 1494, while Joseon restricted the trade and from 1506 under King Jungjong enforced its laws strictly. In 1510, after Korean officials killed Japanese fishermen as suspected raiders, the residents rose on the fourth day of the fourth month with reinforcements from Tsushima under a member of the Sō family, about 4,500 men in all. They took the forts at Busanpo, killing its commander, and Jepo, capturing its commander, and attacked Dongnae and Ungcheon. Joseon troops retook Jepo on the nineteenth day of the month and the Japanese withdrew to Tsushima; a second landing at the end of the sixth month was beaten off. Relations were broken off until the Treaty of Imsin of 1512 reopened Jepo alone and halved the Sō’s trading ships. In the fourth month of 1544 some twenty Japanese ships raided the fort of Saryangjin (in today’s Tongyeong), and Joseon again cut off relations until 1547, when trade was limited to Busanpo. In the fifth month of 1555 a raiding fleet of more than seventy ships attacked Dalyangpo in Haenam and the forts of the south-west coast. Ten forts fell and the Jeolla army commander Won Jeok was killed before Yi Jun-gyeong’s army drove the raiders off, and an attack on Jeju was repulsed. After this Eulmyo incident Joseon made its Border Defence Council (Bibyeonsa) permanent.
: Une révolte des Japonais résidant dans les trois ports coréens ouverts au commerce japonais, et les affrontements ultérieurs qui en découlèrent. Depuis le début du XVe siècle, le Joseon n’autorisait les navires japonais à commercer qu’à Busanpo (Busan), Jepo (Naeipo, dans l’actuelle Changwon) et Yeompo (Ulsan). Des Japonais de Tsushima s’y installèrent en nombre croissant, de 206 en 1436 à plus de 3 000 en 1494, tandis que le Joseon restreignait le commerce et, à partir de 1506, sous le roi Jungjong, appliquait strictement ses lois. En 1510, après que des fonctionnaires coréens eurent tué des pêcheurs japonais soupçonnés d’être des pillards, les résidents se soulevèrent le quatrième jour du quatrième mois avec des renforts venus de Tsushima sous les ordres d’un membre de la famille Sō, soit environ 4 500 hommes en tout. Ils prirent les forts de Busanpo, dont ils tuèrent le commandant, et de Jepo, dont ils capturèrent le commandant, et attaquèrent Dongnae et Ungcheon. Les troupes du Joseon reprirent Jepo le dix-neuvième jour du mois et les Japonais se retirèrent à Tsushima ; un second débarquement, à la fin du sixième mois, fut repoussé. Les relations restèrent rompues jusqu’à ce que le traité d’Imsin de 1512 rouvre le seul port de Jepo et réduise de moitié les navires de commerce des Sō. Au quatrième mois de 1544, une vingtaine de navires japonais attaquèrent le fort de Saryangjin (dans l’actuelle Tongyeong), et le Joseon rompit de nouveau les relations jusqu’en 1547, date à laquelle le commerce fut limité à Busanpo. Au cinquième mois de 1555, une flotte de pillards de plus de soixante-dix navires attaqua Dalyangpo, à Haenam, et les forts de la côte sud-ouest. Dix forts tombèrent et le commandant de l’armée du Jeolla, Won Jeok, fut tué avant que l’armée de Yi Jun-gyeong ne chasse les assaillants, et une attaque contre Jeju fut repoussée. Après cet incident d’Eulmyo, le Joseon rendit permanent son Conseil de défense des frontières (Bibyeonsa).
