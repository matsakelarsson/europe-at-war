# French translations of the catalogue text (wave 12); step bodies follow later.
Sand War: Guerre des Sables
? "A short border war between Morocco and Algeria in the autumn of 1963, a year after Algeria’s independence. France had never fixed the border south of Figuig and had attached the Sahara around Tindouf and Colomb-Béchar, with its iron ore and possible oil, to Algeria. Morocco, where the Istiqlal party’s idea of a Greater Morocco was widely held, claimed these lands and said that Algeria’s wartime leaders had promised to settle the question after independence; Ahmed Ben Bella’s government held to the colonial borders. On 25 September 1963 Moroccan troops seized the Algerian border posts of Hassi Beida and Tinjoub on the road from Colomb-Béchar to Tindouf. Algeria retook them on 8 October and Morocco took them back the following week, while a Moroccan push towards Tindouf stalled; Algeria opened a second front in the north, taking Ich near Figuig on 18 October. Egypt sent some 1,000 troops to help Algeria, and Cuba sent about 700 soldiers with tanks, who arrived at Oran on 22 October but saw little fighting. Mediation by the Organisation of African Unity, Haile Selassie of Ethiopia and Modibo Keïta of Mali brought Hassan II and Ben Bella to Bamako, where on 30 October they agreed a ceasefire from 2 November and a demilitarised zone watched by Ethiopian and Malian officers, the OAU’s first peacekeeping mission; fighting near Figuig went on for two more days. The losses were small: Algeria gave about 60 dead and Morocco 39, though later works give some 300 and 200. The border stayed in place: the two countries signed a border convention in 1972, which Morocco ratified only in 1989, and the war left a lasting distrust between them that shaped the Western Sahara conflict."
: "Une courte guerre frontalière entre le Maroc et l’Algérie à l’automne 1963, un an après l’indépendance de l’Algérie. La France n’avait jamais fixé la frontière au sud de Figuig et avait rattaché à l’Algérie le Sahara autour de Tindouf et de Colomb-Béchar, avec son minerai de fer et son pétrole éventuel. Le Maroc, où l’idée d’un Grand Maroc défendue par le parti de l’Istiqlal était largement partagée, revendiquait ces territoires et affirmait que les dirigeants algériens du temps de la guerre avaient promis de régler la question après l’indépendance ; le gouvernement d’Ahmed Ben Bella s’en tenait aux frontières coloniales. Le 25 septembre 1963, des troupes marocaines s’emparèrent des postes frontaliers algériens de Hassi Beida et de Tinjoub, sur la route de Colomb-Béchar à Tindouf. L’Algérie les reprit le 8 octobre et le Maroc les reconquit la semaine suivante, tandis qu’une poussée marocaine vers Tindouf s’enlisait ; l’Algérie ouvrit un second front dans le nord, prenant Ich, près de Figuig, le 18 octobre. L’Égypte envoya quelque 1 000 soldats pour aider l’Algérie, et Cuba environ 700 soldats avec des chars, qui arrivèrent à Oran le 22 octobre mais ne prirent guère part aux combats. La médiation de l’Organisation de l’unité africaine, d’Hailé Sélassié d’Éthiopie et de Modibo Keïta du Mali réunit Hassan II et Ben Bella à Bamako, où ils convinrent le 30 octobre d’un cessez-le-feu à partir du 2 novembre et d’une zone démilitarisée surveillée par des officiers éthiopiens et maliens, la première mission de maintien de la paix de l’OUA ; les combats près de Figuig se poursuivirent encore deux jours. Les pertes furent faibles : l’Algérie fit état d’environ 60 morts et le Maroc de 39, bien que des travaux ultérieurs avancent quelque 300 et 200 morts. La frontière resta en place : les deux pays signèrent une convention frontalière en 1972, que le Maroc ne ratifia qu’en 1989, et la guerre laissa entre eux une méfiance durable qui façonna le conflit du Sahara occidental."
