# Some French text was translated automatically.
"Sanfedist campaign of 1799": "Campagne sanfédiste de 1799"
? "The royalist peasant rising that destroyed the Parthenopean Republic, set up in Naples under French protection in January 1799. On 7 February Cardinal Fabrizio Ruffo, named vicar-general by the exiled King Ferdinand IV, landed in Calabria with eight companions and a banner bearing the royal arms and the cross. Within a month his Army of the Holy Faith (Armata della Santa Fede) had grown to some 17,000 men – peasants, priests, brigands and adventurers – and as the French withdrew most of their troops north to face the Austrians and Russians, it took Catanzaro, Crotone and Cosenza, sacked Altamura and by the end of April held Calabria, Basilicata and most of Apulia. Suspected republicans were killed in many of the towns it took. Supported by British ships and by Russian and Ottoman troops, the Sanfedisti fought their way into Naples on 13 June, and for weeks they and the city’s poor, the lazzaroni, pillaged and massacred. The republicans in the castles surrendered on terms that let them sail to Toulon, but Nelson, arriving on 24 June, refused to honour the capitulation and had them seized. The republican admiral Francesco Caracciolo was hanged from the yardarm of a Neapolitan frigate on 29 June. Of some 8,000 political prisoners, 99 were executed, among them the jurist Mario Pagano, the physician Domenico Cirillo and the journalist Eleonora Fonseca Pimentel, and hundreds more were imprisoned, deported or exiled."
: "Le 7 février, le cardinal Fabrizio Ruffo, nommé vicaire général par le roi exilé Ferdinand IV, débarqua en Calabre avec huit compagnons et une bannière portant les armes royales et la croix. En un mois, son Armée de la Sainte Foi (Armata della Santa Fede) s’était développée pour atteindre quelque 17 000 hommes – paysans, prêtres, brigands et aventuriers – et alors que les Français se retiraient la plupart de leurs troupes au nord pour affronter les Autrichiens et les Russes, il prit Catanzaro, Crotone et Cosenza, saccagé Altamura et à la fin du mois d’avril tenu Calabre, Basilicate et la plupart des Pouilles. Soutenus par des navires britanniques et par des troupes russes et ottomanes, les Sanfedisti se sont battus à Naples le 13 juin, et pendant des semaines, eux et la ville pauvres, les lazzaroni, pillés et massacrés. Les républicains dans les châteaux se rendirent à des conditions qui leur laissaient naviguer vers Toulon, mais Nelson, arrivant le 24 juin, refusa d’honorer la capitulation et les fit saisir. L’amiral républicain Francesco Caracciolo fut pendu à l’armure d’une frégate napolitaine le 29 juin. Sur quelque 8 000 prisonniers politiques, 99 ont été exécutés, dont le juriste Mario Pagano, le médecin Domenico Cirillo et la journaliste Eleonora Fonseca Pimentel, et des centaines d’autres ont été emprisonnés, expulsés ou exilés."
"The French conquest of Naples and the proclamation of the Parthenopean Republic in January 1799 are told with the French Revolutionary Wars. The republic was a French client state and is not drawn as a separate polity.": "La conquête française de Naples et la proclamation de la République parthenopéenne en janvier 1799 sont racontées aux guerres révolutionnaires françaises. La république était un État client français et n’est pas considérée comme une politique distincte."
"Ferdinand rewarded Nelson with the Sicilian dukedom of Bronte. Nelson’s part in breaking the capitulation has been debated ever since.": "Ferdinand a récompensé Nelson avec le duc sicilien de Bronte. La participation de Nelson à briser la capitulation a été débattue depuis."
