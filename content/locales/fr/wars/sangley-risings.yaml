# French translations of the catalogue text (wave 11); step bodies follow later.
Chinese risings in Manila (Sangley risings): Soulèvements chinois à Manille (soulèvements des Sangleys)
? Risings of the Chinese of Spanish Manila, whom the Spanish called Sangleys, and the massacres that ended them. The Chinese traders and craftsmen who came with the junks from Fujian far outnumbered the Spanish in and around Manila, lived under fees, curfews and limits on their numbers, and were confined to their own quarter, the Parián, outside the walls. In March 1603 a Ming mission came to look for a “mountain of gold” said to be at Cavite; the Spanish took it for a scouting party for an invasion, and the Chinese of Manila were threatened by Spaniards, Tagalogs and Japanese alike. On 3 October 1603 they rose. They beat back an attack led by Luis Pérez Dasmariñas, who was killed with his men, but their assault on the walls on 6 October was stopped by artillery, and in the following weeks Spanish soldiers, Japanese residents of Dilao and Tagalog auxiliaries hunted them down. Estimates of the Chinese dead range from 15,000 to 25,000; about 128 of the Spanish side died. Trade with Fujian soon resumed and the Chinese community grew again. On 20 November 1639 Chinese labourers who had been settled by force on the crown estate at Calamba, in Laguna, and made to pay heavy rents rose in their turn; they took the church of San Pedro Macati, held the north bank of the Pasig for a week, and on 5 December Governor Sebastián Hurtado de Corcuera ordered every Chinese found to be killed. The last 6,000 to 7,000 surrendered on the shore of Laguna de Bay on 15 March 1640; estimates of the dead range from 17,000 to 24,000. In 1662 Zheng Chenggong (Koxinga), who had just taken Taiwan from the Dutch, sent the Dominican Vittorio Riccio to demand tribute from Manila. The Spanish withdrew their garrisons from Zamboanga and the Moluccas to defend the city, a clash in the Chinese quarter on 24 May led to the expulsion of the non-Christian Chinese, and on 4 June the governor ordered the killing of those who had not reported; many who fled to the hills died of hunger. Koxinga died in Taiwan on 23 June 1662 before any attack was made. Killings of Chinese followed again in 1762–1763, when Simón de Anda ordered the execution of Chinese who had sided with the British during their occupation of Manila.
: Les soulèvements des Chinois de la Manille espagnole, que les Espagnols appelaient Sangleys, et les massacres qui y mirent fin. Les marchands et artisans chinois arrivés avec les jonques du Fujian étaient bien plus nombreux que les Espagnols à Manille et dans ses environs ; ils vivaient soumis à des redevances, à des couvre-feux et à des quotas, et étaient confinés dans leur propre quartier, le Parián, hors les murs. En mars 1603, une mission Ming vint chercher une « montagne d’or » qui se serait trouvée à Cavite ; les Espagnols y virent une mission de reconnaissance préparant une invasion, et les Chinois de Manille furent menacés aussi bien par les Espagnols que par les Tagalogs et les Japonais. Le 3 octobre 1603, ils se soulevèrent. Ils repoussèrent une attaque conduite par Luis Pérez Dasmariñas, qui fut tué avec ses hommes, mais leur assaut contre les murailles, le 6 octobre, fut arrêté par l’artillerie, et dans les semaines qui suivirent, des soldats espagnols, des résidents japonais de Dilao et des auxiliaires tagalogs les traquèrent. Les estimations du nombre de morts chinois vont de 15 000 à 25 000 ; environ 128 personnes périrent du côté espagnol. Le commerce avec le Fujian reprit bientôt et la communauté chinoise se reconstitua. Le 20 novembre 1639, des travailleurs chinois installés de force sur le domaine de la Couronne à Calamba, dans la Laguna, et contraints de payer de lourds fermages, se soulevèrent à leur tour ; ils prirent l’église de San Pedro Macati, tinrent la rive nord du Pasig pendant une semaine, et le 5 décembre le gouverneur Sebastián Hurtado de Corcuera ordonna de tuer tous les Chinois qu’on trouverait. Les 6 000 à 7 000 derniers se rendirent sur la rive de la Laguna de Bay le 15 mars 1640 ; les estimations du nombre de morts vont de 17 000 à 24 000. En 1662, Zheng Chenggong (Koxinga), qui venait de prendre Taïwan aux Néerlandais, envoya le dominicain Vittorio Riccio exiger un tribut de Manille. Les Espagnols retirèrent leurs garnisons de Zamboanga et des Moluques pour défendre la ville ; un affrontement dans le quartier chinois, le 24 mai, entraîna l’expulsion des Chinois non chrétiens, et le 4 juin le gouverneur ordonna de tuer ceux qui ne s’étaient pas présentés ; beaucoup de ceux qui s’enfuirent dans les collines moururent de faim. Koxinga mourut à Taïwan le 23 juin 1662 avant qu’aucune attaque n’ait été lancée. Des tueries de Chinois eurent de nouveau lieu en 1762–1763, lorsque Simón de Anda ordonna l’exécution des Chinois qui avaient pris le parti des Britanniques pendant leur occupation de Manille.
