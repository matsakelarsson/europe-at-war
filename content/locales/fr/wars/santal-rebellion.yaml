# French translations of the catalogue text (wave 8); step bodies follow later.
Santal rebellion: Révolte des Santal
? A rising of the Santals of the Rajmahal hills and the Damin-i-koh, in today’s Jharkhand, known to the Santals as the Hul (“rebellion”). Settled in the Damin-i-koh under East India Company rule from the 1830s, many Santals had fallen into debt to moneylenders and traders from the plains, lost land to zamindars and suffered from the police and the courts. On 30 June 1855 the brothers Sidhu and Kanhu Murmu of Bhognadih, with their brothers Chand and Bhairav, called on the Santals to drive out the outsiders, and thousands rose against moneylenders, zamindars and the Company, attacking police posts, plundering markets and cutting the roads and railway works between Bhagalpur and Rajmahal. They defeated several Company detachments in July, but were beaten at Maheshpur on 24 July. Company troops and landholders’ levies then crushed the rising, burning villages and killing many; martial law was in force from November 1855 to January 1856. Sidhu and Kanhu were captured and executed. Estimates of the number of Santals killed range from about 10,000 to more than 15,000. Afterwards the Company made the area a separate district with its own administration, the Santal Parganas, under Act XXXVII of 1855.
: Un soulèvement des Santal des collines du Rajmahal et du Damin-i-koh, dans l’actuel Jharkhand, connu chez les Santal sous le nom de Hul (« rébellion »). Installés dans le Damin-i-koh sous l’autorité de la Compagnie anglaise des Indes orientales à partir des années 1830, de nombreux Santal s’étaient endettés auprès d’usuriers et de marchands venus des plaines, avaient perdu des terres au profit des zamindars et pâtissaient de la police et des tribunaux. Le 30 juin 1855, les frères Sidhu et Kanhu Murmu, de Bhognadih, avec leurs frères Chand et Bhairav, appelèrent les Santal à chasser les étrangers, et des milliers d’entre eux se soulevèrent contre les usuriers, les zamindars et la Compagnie, attaquant des postes de police, pillant des marchés et coupant les routes et les chantiers ferroviaires entre Bhagalpur et Rajmahal. Ils battirent plusieurs détachements de la Compagnie en juillet, mais furent vaincus à Maheshpur le 24 juillet. Les troupes de la Compagnie et les levées des propriétaires terriens écrasèrent ensuite le soulèvement, incendiant des villages et faisant de nombreux morts ; la loi martiale fut en vigueur de novembre 1855 à janvier 1856. Sidhu et Kanhu furent capturés et exécutés. Les estimations du nombre de Santal tués vont d’environ 10 000 à plus de 15 000. Par la suite, la Compagnie fit de la région un district distinct doté de sa propre administration, les Santal Parganas, en vertu de l’Act XXXVII de 1855.
