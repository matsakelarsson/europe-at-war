# French translations of the catalogue text (wave 11); step bodies follow later.
Communist insurgency in Sarawak: Insurrection communiste au Sarawak
? "The guerrilla war of Sarawak’s communist movement against the British colony and then Malaysia. A clandestine communist organisation had grown among the Chinese of Sarawak since the 1950s, through trade unions, Chinese schools and the left wing of the Sarawak United People’s Party; the British called it the Clandestine Communist Organisation. After the Brunei revolt of December 1962 and the start of Indonesia’s confrontation with Malaysia, hundreds of young Chinese crossed into Indonesian Borneo, where with Indonesian army and communist help they formed the Sarawak People’s Guerrilla Force (PGRS, March 1964) and the North Kalimantan People’s Army (PARAKU, October 1965), and fought alongside Indonesian troops in raids across the border. To cut them off from supporters, the government moved some 7,500 rural Chinese into guarded settlements along the Kuching–Serian road in 1965. After 1965 Suharto’s Indonesia turned on its former allies: in 1967 Indonesian troops and Malaysian forces hunted the guerrillas in West Kalimantan, where Dayak attacks, widely believed to have been instigated by the army, killed many Chinese villagers in October–November 1967 and drove tens of thousands from the interior. The movement, organised from 1970 as the North Kalimantan Communist Party, fell back on the Rajang delta, where Malaysia set up the Rajang Area Security Command (RASCOM) at Sibu in 1972. In 1973–1974 the party’s leader Bong Kee Chok and 481 followers, about three quarters of its fighters, laid down their arms under the Sri Aman agreement; the last remaining guerrillas signed a peace agreement with the Sarawak government in Kuching on 17 October 1990. Casualty figures are uncertain: the government side counted about 100 dead, the guerrillas several hundred."
: "La guérilla menée par le mouvement communiste du Sarawak contre la colonie britannique, puis contre la Malaisie. Une organisation communiste clandestine s’était développée parmi les Chinois du Sarawak depuis les années 1950, à travers les syndicats, les écoles chinoises et l’aile gauche du Parti uni du peuple du Sarawak ; les Britanniques la nommaient « Clandestine Communist Organisation ». Après la révolte de Brunei de décembre 1962 et le début de la confrontation entre l’Indonésie et la Malaisie, des centaines de jeunes Chinois passèrent dans le Bornéo indonésien, où, avec l’aide de l’armée et des communistes indonésiens, ils formèrent la Force de guérilla populaire du Sarawak (PGRS, mars 1964) et l’Armée populaire du Kalimantan du Nord (PARAKU, octobre 1965), et combattirent aux côtés des troupes indonésiennes lors de raids de l’autre côté de la frontière. Pour les couper de leurs soutiens, le gouvernement regroupa en 1965 quelque 7 500 Chinois des campagnes dans des villages gardés le long de la route Kuching–Serian. Après 1965, l’Indonésie de Suharto se retourna contre ses anciens alliés : en 1967, troupes indonésiennes et forces malaisiennes traquèrent les guérilleros au Kalimantan occidental, où des attaques de Dayaks, dont on pense généralement qu’elles furent fomentées par l’armée, tuèrent de nombreux villageois chinois en octobre–novembre 1967 et chassèrent des dizaines de milliers de personnes de l’intérieur. Le mouvement, organisé à partir de 1970 en Parti communiste du Kalimantan du Nord, se replia sur le delta du Rajang, où la Malaisie établit en 1972, à Sibu, le commandement de sécurité de la zone du Rajang (RASCOM). En 1973–1974, le chef du parti, Bong Kee Chok, et 481 de ses partisans, soit environ les trois quarts de ses combattants, déposèrent les armes en vertu de l’accord de Sri Aman ; les derniers guérilleros signèrent un accord de paix avec le gouvernement du Sarawak à Kuching le 17 octobre 1990. Les chiffres des pertes sont incertains : le camp gouvernemental compta une centaine de morts, les guérilleros plusieurs centaines."
Sarawak, Malaysia and Britain, with Indonesia after 1966: Sarawak, Malaisie et Grande-Bretagne, avec l’Indonésie après 1966
