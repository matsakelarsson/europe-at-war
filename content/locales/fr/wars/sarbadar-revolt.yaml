# French translations of the catalogue text (wave 7); step bodies follow later.
Sarbadar revolt and the wars of the Sarbadars: Révolte et guerres des Sarbadars
? After the death of the Ilkhan Abu Sa’id in 1335 the Mongol state in Iran fell apart, and in western Khorasan, where the Ilkhanid claimant Togha Temür and his emirs taxed the countryside heavily, the people of the Bayhaq district rose in revolt. In 1337 a local notable, Abd al-Razzaq, killed a tax official and took to the hills with followers who called themselves sarbadar, “heads on the gallows”, and that summer they seized Sabzevar. Under his brother Mas’ud, who shared power with the Shi’i dervish leader Hasan Juri, the Sarbadars drove Togha Temür’s forces out of Nishapur, Jajarm, Damghan and Gorgan. On 18 July 1342 they attacked the Kartids of Herat at Zawa; Hasan Juri was killed in the battle, perhaps on Mas’ud’s orders, his followers left the field and the Kartids won. In 1344 Mas’ud was captured and executed while campaigning against Togha Temür in Mazandaran, and most of the conquests were lost. Ruled by a succession of commanders and dervish leaders, several of whom were murdered, the Sarbadars killed Togha Temür in 1353, fought the Kartids, the Ja’un-i Qurban Mongols of Tus and the emir Vali of Astarabad, and lost Sabzevar for a time in about 1376 to dervishes armed by the Muzaffarids of Shiraz. In 1381 their last ruler, Ali-yi Mu’ayyad, besieged by Vali, submitted to Timur, who left him to govern Sabzevar.
: Après la mort de l’ilkhan Abu Sa’id en 1335, l’État mongol d’Iran se désagrégea et, dans l’ouest du Khorassan, où le prétendant ilkhanide Togha Temür et ses émirs accablaient les campagnes d’impôts, la population du district de Bayhaq se révolta. En 1337, un notable local, Abd al-Razzaq, tua un agent du fisc et gagna les collines avec des partisans qui se donnaient le nom de sarbadar, « têtes au gibet » ; cet été-là, ils s’emparèrent de Sabzevar. Sous son frère Mas’ud, qui partageait le pouvoir avec le chef derviche chiite Hasan Juri, les Sarbadars chassèrent les forces de Togha Temür de Nichapur, de Jajarm, de Damghan et de Gorgan. Le 18 juillet 1342, ils attaquèrent les Kartides d’Hérat à Zawa ; Hasan Juri fut tué pendant la bataille, peut-être sur ordre de Mas’ud, ses partisans quittèrent le champ de bataille et les Kartides l’emportèrent. En 1344, Mas’ud fut capturé et exécuté alors qu’il faisait campagne contre Togha Temür dans le Mazandéran, et la plupart des conquêtes furent perdues. Gouvernés par une succession de chefs militaires et de chefs derviches, dont plusieurs furent assassinés, les Sarbadars tuèrent Togha Temür en 1353, combattirent les Kartides, les Mongols Ja’un-i Qurban de Tus et l’émir Vali d’Astarabad, et perdirent un temps Sabzevar, vers 1376, au profit de derviches armés par les Muzaffarides de Chiraz. En 1381, leur dernier souverain, Ali-yi Mu’ayyad, assiégé par Vali, se soumit à Tamerlan, qui lui laissa le gouvernement de Sabzevar.
