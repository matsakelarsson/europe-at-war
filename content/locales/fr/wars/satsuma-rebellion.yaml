# French translations of the catalogue text (wave 10); step bodies follow later.
Satsuma Rebellion: Rébellion de Satsuma
? The last and largest of the armed risings of former samurai against the Meiji government, known in Japan as the Seinan War (the south-western war). Saigō Takamori, a leader of the Meiji Restoration and chief of staff of the imperial army in the Boshin War, left the government in 1873 after it rejected his plan for a confrontation with Korea and returned to Kagoshima, where his private academies (shigakkō) trained thousands of young former samurai. Resentment grew as the government abolished the samurai’s stipends and their right to wear swords. In January 1877 academy students seized the arms in the government arsenals at Kagoshima, and when they believed they had uncovered a government plot to murder Saigō, he agreed to lead them to Tokyo. About 13,000 men left Kagoshima in mid-February and laid siege to Kumamoto Castle, but they could not take it. The new conscript army and militarised police, led by Yamagata Aritomo, fought its way through the Satsuma lines at Tabaruzaka in March and relieved Kumamoto in April, and over the summer drove the rebels back through Hitoyoshi, Miyakonojō and Miyazaki to Nobeoka. Saigō broke out of encirclement at Mount Enodake with a few hundred men and returned to Kagoshima, where he died in the final assault on Shiroyama on 24 September 1877. About 6,400 government and 6,800 rebel soldiers were killed. The war showed that a peasant conscript army could defeat the samurai, and ended armed resistance to the Meiji state.
: Le dernier et le plus important des soulèvements armés d’anciens samouraïs contre le gouvernement de Meiji, connu au Japon sous le nom de guerre du Seinan (la guerre du Sud-Ouest). Saigō Takamori, l’un des chefs de la restauration de Meiji et chef d’état-major de l’armée impériale pendant la guerre de Boshin, quitta le gouvernement en 1873 après que celui-ci eut rejeté son projet de confrontation avec la Corée, et retourna à Kagoshima, où ses écoles privées (shigakkō) formèrent des milliers de jeunes anciens samouraïs. Le ressentiment grandit à mesure que le gouvernement supprimait les pensions des samouraïs et leur droit de porter le sabre. En janvier 1877, des élèves des écoles s’emparèrent des armes des arsenaux gouvernementaux de Kagoshima et, lorsqu’ils crurent avoir découvert un complot du gouvernement visant à assassiner Saigō, celui-ci accepta de les mener à Tokyo. Environ 13 000 hommes quittèrent Kagoshima à la mi-février et assiégèrent le château de Kumamoto, mais ne purent le prendre. La nouvelle armée de conscrits et la police militarisée, menées par Yamagata Aritomo, percèrent les lignes de Satsuma à Tabaruzaka en mars et dégagèrent Kumamoto en avril, puis, au cours de l’été, repoussèrent les rebelles par Hitoyoshi, Miyakonojō et Miyazaki jusqu’à Nobeoka. Saigō sortit de l’encerclement au mont Enodake avec quelques centaines d’hommes et regagna Kagoshima, où il mourut lors de l’assaut final contre Shiroyama, le 24 septembre 1877. Environ 6 400 soldats gouvernementaux et 6 800 rebelles furent tués. La guerre montra qu’une armée de conscrits paysans pouvait vaincre les samouraïs, et mit fin à la résistance armée contre l’État de Meiji.
