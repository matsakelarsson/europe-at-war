# French translations of the catalogue text (wave 7); step bodies follow later.
Saudi–Yemeni War: Guerre saoudo-yéménite
A short war between Saudi Arabia and the Mutawakkilite Kingdom of Yemen over Asir and Najran. After Imam Yahya sheltered the Idrisid ruler of Asir and occupied Najran, Saudi armies invaded Yemen in the spring of 1934. Crown Prince Saud’s advance in the northern mountains stalled, but Prince Faisal swept down the Tihama coast and took Hodeidah. By the Treaty of Taif, Yemen accepted Saudi rule over Asir, Jizan and Najran, and the Saudis withdrew from the Tihama.: Une courte guerre entre l’Arabie saoudite et le royaume mutawakkilite du Yémen au sujet de l’Asir et du Najran. Après que l’imam Yahya eut accueilli le souverain idrisside de l’Asir et occupé le Najran, les armées saoudiennes envahirent le Yémen au printemps 1934. L’avance du prince héritier Saoud dans les montagnes du nord s’enlisa, mais le prince Fayçal descendit rapidement la côte de la Tihama et prit Hodeïda. Par le traité de Taëf, le Yémen accepta la souveraineté saoudienne sur l’Asir, le Jizan et le Najran, et les Saoudiens se retirèrent de la Tihama.
