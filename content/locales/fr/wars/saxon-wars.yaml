# Some French text was translated automatically.
"Saxon Wars": "Guerres saxonnes"
"The wars in which Charlemagne conquered the pagan Saxons of what is now north-west Germany, in some eighteen campaigns over more than thirty years. Led for years by Widukind, the Saxons rose again and again; the Franks answered with forced baptism, the death penalty for pagan practice and, at Verden in 782, the execution of about 4,500 prisoners, as the Frankish annals tell it. Widukind was baptised in 785, and after the last risings and mass deportations Saxony was part of the Frankish realm by 804.": "En quelque dix-huit campagnes menées sur plus de trente ans, Charlemagne soumet les Saxons païens du nord-ouest de l’Allemagne actuelle. Longtemps menés par Widukind, les Saxons se soulèvent à plusieurs reprises. Les Francs répliquent par des baptêmes forcés, la peine de mort pour la pratique du paganisme et, à Verden en 782, par l’exécution d’environ 4 500 prisonniers selon les annales franques. Widukind est baptisé en 785. Après les derniers soulèvements et les déportations de masse, la Saxe fait partie du royaume franc en 804."
"Almost everything known comes from Frankish writers, above all the Royal Frankish Annals and Einhard’s Life of Charlemagne; there is no Saxon account. Some historians have doubted the number killed at Verden, or suggested a scribal error, but most accept that a mass execution took place.": "Presque tout ce que l’on sait vient des écrivains franquistes, surtout les Annales royales franquistes et les Vies d’Einhard de Charlemagne ; il n’y a pas de récit saxon. Certains historiens ont douté du nombre tué à Verden, ou suggéré une erreur scribale, mais la plupart acceptent qu’une exécution de masse ait eu lieu."
"The war began with the destruction of the Saxon sanctuary of the Irminsul, near the Eresburg (Marsberg), in 772. The Saxons’ last rising, the Stellinga of 841–845, came after Charlemagne’s death.": "La guerre a commencé avec la destruction du sanctuaire saxon de l’Irminsul, près de l’Eresburg (Marsberg), en 772. Les Saxons, la dernière montée, le Stellinga de 841-845, sont venus après Charlemagne."
