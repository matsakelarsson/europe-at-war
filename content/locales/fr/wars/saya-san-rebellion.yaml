# French translations of the catalogue text (wave 11); step bodies follow later.
Saya San rebellion: Rébellion de Saya San
? A peasant rising against British rule in Burma, then a province of British India, led by Saya San, a former monk and healer who had been crowned as a Buddhist king. The Great Depression halved the price of rice, Burma’s main export, while the capitation and household taxes stayed the same, and many cultivators were losing their land to moneylenders. Saya San, who had investigated rural grievances for the nationalist General Council of Burmese Associations, took the title of Galon (Garuda) king in October 1930, and on 22 December 1930 his followers rose in the Tharrawaddy district north of Rangoon, attacking headmen, forest officers and police posts. The rising spread in 1931 to Insein, Pegu, Toungoo, Prome, Thayetmyo, Henzada and Pyapon and into the Shan states. The colonial government brought in troops from India and gave itself emergency powers. Saya San was arrested in the Shan states in August 1931, tried by a special tribunal and hanged at Tharrawaddy on 28 November 1931. By the government’s count, more than 1,000 rebels had been killed by the end of 1932, about 9,000 had surrendered or been captured, and Saya San and 125 others had been hanged; other estimates of the dead run to more than 10,000. The rising is remembered in Myanmar as an early stand of the independence movement.
: Un soulèvement paysan contre la domination britannique en Birmanie, alors province de l’Inde britannique, mené par Saya San, ancien moine et guérisseur qui avait été couronné roi bouddhiste. La Grande Dépression divisa par deux le prix du riz, principale exportation de la Birmanie, tandis que la capitation et l’impôt sur les foyers restaient inchangés, et de nombreux cultivateurs perdaient leurs terres au profit des prêteurs. Saya San, qui avait enquêté sur les griefs des campagnes pour le Conseil général des associations birmanes, organisation nationaliste, prit le titre de roi Galon (Garuda) en octobre 1930 et, le 22 décembre 1930, ses partisans se soulevèrent dans le district de Tharrawaddy, au nord de Rangoun, attaquant des chefs de village, des agents forestiers et des postes de police. Le soulèvement s’étendit en 1931 à Insein, Pégou, Toungoo, Prome, Thayetmyo, Henzada et Pyapon, ainsi qu’aux États shans. Le gouvernement colonial fit venir des troupes de l’Inde et s’attribua des pouvoirs d’urgence. Saya San fut arrêté dans les États shans en août 1931, jugé par un tribunal spécial et pendu à Tharrawaddy le 28 novembre 1931. Selon le décompte du gouvernement, plus de 1 000 rebelles avaient été tués à la fin de 1932, environ 9 000 s’étaient rendus ou avaient été capturés, et Saya San et 125 autres avaient été pendus ; d’autres estimations du nombre de morts dépassent 10 000. Le soulèvement est resté dans les mémoires au Myanmar comme l’un des premiers combats du mouvement pour l’indépendance.
