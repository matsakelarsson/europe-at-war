"Lund, the bloodiest battle": "Lund, la bataille la plus sanglante"
"1676–1677": "1676–1677"
"Charles XI marched back into Scania in October 1676 with about 12,000 men. On 4 December, north of Lund, the two kings met in one of the bloodiest battles ever fought in Scandinavia. By some estimates nearly half of the men engaged were killed, and the Swedes won.": "Charles XI retourna en Scanie en octobre 1676 avec environ 12 000 hommes. Le 4 décembre, au nord de Lund, les deux rois se rencontrèrent dans l’une des batailles les plus sanglantes jamais menées en Scandinavie. Selon certaines estimations, près de la moitié des hommes engagés furent tués et les Suédois gagnèrent."
"Lund saved Scania but not the sea. On 1–2 July 1677 the Danish admiral Niels Juel smashed the Swedish fleet in Køge Bay. On land the Danes failed to storm Malmö in June and were beaten again at Landskrona on 14 July, while Gyldenløve’s Norwegians took Marstrand and won at Uddevalla. Far to the south, the Elector of Brandenburg forced Stettin to surrender in December 1677.": "Lund a sauvé Scania mais pas la mer. Du 1er au 2 juillet 1677, l’amiral danois Niels Juel a brisé la flotte suédoise dans la baie de Køge. Sur terre, les Danois n’ont pas réussi à prendre Malmö en juin et ont été battus à nouveau à Landskrona le 14 juillet, tandis que les Norvégiens de Gyldenløve arrivèrent à Marstrand et remportèrent à Uddevalla. Loin au sud, l’électeur de Brandebourg força Stettin à se rendre en décembre 1677."
