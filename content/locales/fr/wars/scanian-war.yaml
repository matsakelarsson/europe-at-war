"Scanian War": "Guerre de Scanie"
"A war in which Denmark–Norway, Brandenburg and the Dutch Republic fought Sweden, an ally of France, and the Danes tried to win back Scania. Despite Danish victories at sea and the loss of Sweden’s German lands, French pressure restored almost all the pre-war borders in the peace of 1679.": "Le Danemark-Norvège, le Brandebourg et les Provinces-Unies combattent la Suède, alliée de la France. Les Danois tentent de reconquérir la Scanie. Malgré leurs victoires navales et la perte des possessions suédoises en Allemagne, la pression française permet de rétablir la quasi-totalité des frontières d’avant-guerre lors de la paix de 1679."
"Dates in Germany and Poland are New Style (Gregorian); Scandinavian dates are mostly Old Style (Julian), as usually cited, which ran ten days behind.": "Les dates en Allemagne et en Pologne sont New Style (Gregorian) ; les dates scandinaves sont pour la plupart Old Style (Julian), comme on le cite habituellement, qui a duré dix jours."
"Migrated from Sweden at War, so the story is told from Sweden’s side.": "Migré de Suède à la guerre, l’histoire est donc racontée du côté suédois."
