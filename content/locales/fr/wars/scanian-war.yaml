"Brandenburg’s cavalry attacked the retreating Swedes and beat them. The Swedes fell back to Pomerania, and Fehrbellin became a founding legend of the Prussian army.": "La cavalerie du Brandebourg attaque et bat les Suédois en retraite. Ceux-ci se replient en Poméranie. Fehrbellin devient un épisode fondateur de l’histoire de l’armée prussienne."
