"A Danish-Dutch fleet under the Dutch admiral Cornelis Tromp beat the Swedes. The flagship Kronan, one of the largest warships of its day, capsized in a sharp turn and exploded, and most of its crew died.": "Une flotte danoise-néerlandaise sous l’amiral néerlandais Cornelis Tromp a battu les Suédois. Le vaisseau-phare Kronan, l’un des plus grands navires de guerre de son temps, a chaviré à un tournant aigu et a explosé, et la plupart de son équipage est mort."
"Danes land at Råå": "Terrain Danois à Råå"
