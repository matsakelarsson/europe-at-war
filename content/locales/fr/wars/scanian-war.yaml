"1675–1676": "1675–1676"
"Swedish Germany crumbled. Allied troops marched into Bremen-Verden and Pomerania from September 1675, and Stade, the last Swedish stronghold in Bremen-Verden, surrendered on 13 August 1676.": "L’Allemagne suédoise s’est effondrée. Les troupes alliées ont marché à Brême-Verden et Poméranie à partir de septembre 1675, et le Stade, dernier bastion suédois à Brême-Verden, s’est rendu le 13 août 1676."
"The Danes and Dutch won control of the Baltic. They took Gotland in the spring of 1676, and off Öland on 1 June the giant Swedish flagship Kronan capsized and blew up. On 29 June about 14,000 Danish troops landed at Råå near Helsingborg; many Scanians welcomed them, and Kristianstad fell in August. Charles XI beat a Danish force at Halmstad, while a Norwegian army under Ulrik Frederik Gyldenløve took Uddevalla and Vänersborg.": "Les Danois et les Hollandais ont pris le contrôle de la Baltique. Ils ont pris Gotland au printemps 1676, et au large d’Öland le 1er juin, le géant suédois Kronan a chaviré et explosé. Le 29 juin environ 14 000 troupes danoises ont atterri à Råå près d’Helsingborg ; de nombreux Scaniens les ont accueillis, et Kristianstad est tombée en août. Charles XI bat une force danoise à Halmstad, tandis qu’une armée norvégienne sous Ulrik Frederik Gyldenløve prend Uddevalla et Vänersborg."
