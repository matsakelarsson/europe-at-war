"1678–1679": "1678–1679"
"In 1678 the Swedes won back Kristianstad, though the Danes held on to Helsingborg. In Germany everything was lost: Brandenburg took Stralsund in October and Greifswald in November. That winter a Swedish army from Livonia invaded Ducal Prussia, and in January 1679 the Elector chased it out, moving his troops on sledges across the frozen lagoons. It got home having lost nearly half its men.": "En 1678, les Suédois remportèrent Kristianstad, bien que les Danois s’attachèrent à Helsingborg. En Allemagne, tout fut perdu : Brandenburg prit Stralsund en octobre et Greifswald en novembre. L’hiver, une armée suédoise de Livonie envahit la Prusse ducale et, en janvier 1679, l’électeur la poursuivit en déplaçant ses troupes sur des traîneaux à travers les lagons gelés. Il est rentré chez lui après avoir perdu près de la moitié de ses hommes."
"France, not Sweden, decided the peace. At Saint-Germain on 29 June 1679 Brandenburg gave back Pomerania except a strip east of the Oder. French pressure then forced Denmark to return all its conquests at Fontainebleau, confirmed at Lund on 26 September 1679. Sweden came out with almost no losses, but only because Louis XIV insisted.": "À Saint-Germain, le 29 juin 1679, Brandebourg remit la Poméranie à l’exception d’une bande située à l’est de l’Oder. La pression française força alors le Danemark à reprendre toutes ses conquêtes à Fontainebleau, confirmée à Lund le 26 septembre 1679."
