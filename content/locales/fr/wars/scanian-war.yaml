"Sweden was allied to France, then at war with the Dutch, and was paid French subsidies to help. In December 1674, at Louis XIV’s urging, a Swedish army marched from Pomerania into Brandenburg and occupied the Uckermark.": "La Suède est alliée à la France, alors en guerre contre les Provinces-Unies, et reçoit des subsides français en échange de son aide. En décembre 1674, à la demande de Louis XIV, une armée suédoise quitte la Poméranie, pénètre dans le Brandebourg et occupe l’Uckermark."
"The Elector Frederick William hurried north from his winter quarters in Franconia. On 28 June 1675 his cavalry caught the Swedes under Waldemar Wrangel at Fehrbellin and beat them. It was a small battle, but it showed that the Swedish army could be beaten, and Sweden’s enemies piled in: Denmark–Norway declared war that autumn, joined by the Dutch, the Emperor and several German princes.": "Le prince-électeur Frédéric-Guillaume quitte en hâte ses quartiers d’hiver en Franconie et remonte vers le nord. Le 28 juin 1675, sa cavalerie rattrape et bat les Suédois de Waldemar Wrangel à Fehrbellin. Cette bataille de faible ampleur montre que l’armée suédoise peut être vaincue. Le Danemark-Norvège déclare la guerre à l’automne et reçoit le soutien des Provinces-Unies, de l’empereur et de plusieurs princes allemands."
