"January – June 1547": "janvier – juin 1547"
"John Frederick won back his lands over the winter and overran most of Maurice’s duchy, though Leipzig held out, and on 2 March he captured Margrave Albert Alcibiades of Brandenburg-Kulmbach, fighting for the Emperor, at Rochlitz. In April Charles marched north from Eger in Bohemia with the Duke of Alba’s Spanish veterans, joined by Ferdinand and Maurice. On 24 April, at Mühlberg on the Elbe, his cavalry crossed by a ford while Spanish soldiers swam out to seize boats. The Elector’s retreating army was overtaken and routed on the Lochau heath, and John Frederick, wounded in the face, was taken prisoner.": "John Frederick remporta ses terres au cours de l’hiver et envahit la plupart des duchés de Maurice, bien que Leipzig se détachât, et le 2 mars il prit le margrave Albert Alcibiades de Brandenburg-Kulmbach, combattant pour l’empereur, à Rochlitz. En avril Charles marcha au nord d’Eger en Bohême avec le duc d’Alba, rejoint par Ferdinand et Maurice. Le 24 avril, à Mühlberg sur l’Elbe, sa cavalerie traversée par un gué tandis que les soldats espagnols nageaient pour saisir des bateaux. L’armée de retraite de l’électeur a été dépassée et rouée sur la lande de Lochau, et John Frederick, blessé au visage, a été fait prisonnier."
"Sentenced to death by a court martial, John Frederick signed the Capitulation of Wittenberg on 19 May. He gave up the electoral title and the lands around Wittenberg to Maurice, keeping only Thuringian territories for his sons, and stayed a prisoner until 1552. Philip of Hesse gave himself up at Halle in June and was imprisoned too. The League was finished, though Bremen and Magdeburg held out and a League army beat imperial troops at Drakenburg on the Weser. At the diet of Augsburg in 1548 Charles imposed the Augsburg Interim, a stopgap religious settlement that pleased neither side.": "Condamné à mort par une cour martiale, John Frederick signa la Capitulation de Wittenberg le 19 mai. Il abandonna le titre électoral et les terres autour de Wittenberg à Maurice, ne gardant que des territoires thuringiens pour ses fils, et resta prisonnier jusqu’en 1552. Philippe de Hesse se rendit à Halle en juin et fut emprisonné lui aussi. La Ligue a été terminée, bien que Brême et Magdeburg se sont tenus et une armée de la Ligue a battu les troupes impériales à Drakenburg sur le Weser. Au régime d’Augsbourg en 1548 Charles a imposé l’Interim d’Augsbourg, un règlement religieux stopgap qui n’a pas plu aux deux côtés."
