"Schmalkaldic War": "Guerre de Schmalkaldic"
"A war in which the Emperor Charles V, allied with the Lutheran Duke Maurice of Saxony, defeated the Schmalkaldic League of Protestant princes and cities. After the Elector John Frederick of Saxony was captured at Mühlberg in April 1547, the Saxon electorate passed from his Ernestine line of the House of Wettin to Maurice’s Albertine line.": "Une guerre dans laquelle l’empereur Charles V, allié avec le duc luthérien Maurice de Saxe, a vaincu la Ligue Schmalkaldic des princes protestants et des villes. Après l’électeur John Frederick de Saxe a été capturé à Mühlberg en avril 1547, l’électorat saxonne est passé de sa ligne Ernestine de la Maison de Wettin à la ligne d’Albertine Maurice."
"The League’s leaders were John Frederick, Elector of Saxony, of the Ernestine branch of the Wettins, which ruled Wittenberg and most of Thuringia, and Landgrave Philip of Hesse. Maurice, of the Albertine branch, ruled the duchy of Saxony around Dresden, Meissen and Leipzig.": "Les dirigeants de la Ligue étaient John Frederick, Électeur de Saxe, de la branche Ernestine des Wettins, qui dirigeait Wittenberg et la plupart de Thuringe, et Landgrave Philip de Hesse. Maurice, de la branche Albertine, dirigeait le duché de Saxe autour de Dresde, Meissen et Leipzig."
"Pope Paul III sent troops and money for the campaign of 1546 but withdrew his troops early in 1547.": "Le pape Paul III envoya des troupes et de l’argent pour la campagne de 1546 mais retira ses troupes au début de 1547."
