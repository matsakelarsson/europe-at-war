"July – December 1546": "juillet – décembre 1546"
"The Schmalkaldic League, the alliance of Lutheran princes and cities formed in 1531 under Elector John Frederick of Saxony and Landgrave Philip of Hesse, had grown strong while Charles V was busy with France and the Ottomans. Once he had made peace with France at Crépy in 1544, Charles prepared to break it, with papal money and troops and a secret pact with the Lutheran Duke Maurice of Saxony, who was promised his cousin John Frederick’s electoral title. In July 1546 League troops seized Füssen and the passes towards Tyrol, and on 20 July Charles outlawed John Frederick and Philip.": "La Ligue Schmalkaldic, l’alliance des princes et des villes luthériennes formée en 1531 sous l’élection de John Frederick de Saxe et Landgrave Philippe de Hesse, s’était renforcée tandis que Charles V était occupé avec la France et les Ottomans. Une fois qu’il eut fait la paix avec la France à Crépy en 1544, Charles se prépara à la rompre, avec de l’argent et des troupes papales et un pacte secret avec le duc luthérien Maurice de Saxe, promis à son cousin John Frederick. En juillet 1546 les troupes de la Ligue saisirent Füssen et les passes vers Tyrol, et le 20 juillet Charles proscrit John Frederick et Philip."
"The League’s army, at first larger than the Emperor’s, was led by a divided council and missed its chance. Papal troops joined Charles at Landshut in mid-August. At the end of the month the League bombarded his entrenched camp at Ingolstadt but did not storm it, and in September the Count of Buren brought him reinforcements from the Netherlands. Through the autumn the armies manoeuvred along the Danube without a battle. In late October Maurice and King Ferdinand invaded Electoral Saxony, John Frederick hurried home, and the League’s southern army broke up. That winter Ulm, Augsburg, Württemberg and the Elector Palatine submitted to Charles one by one and paid heavy fines.": "L’armée de la Ligue, d’abord plus nombreuse que celle de l’empereur, manqua son occasion, faute d’accord entre ses chefs. Les troupes pontificales rejoignirent Charles Quint à Landshut à la mi-août. À la fin du mois, la Ligue bombarda son camp retranché à Ingolstadt sans le prendre d’assaut. En septembre, le comte de Buren amena des renforts des Pays-Bas. Tout l’automne, les armées manœuvrèrent le long du Danube sans livrer bataille. À la fin d’octobre, Maurice et le roi Ferdinand envahirent la Saxe électorale. Jean-Frédéric rentra en hâte et l’armée de la Ligue dans le sud se dispersa. Cet hiver-là, Ulm, Augsbourg, le Wurtemberg et l’électeur palatin se soumirent tour à tour à Charles Quint et payèrent de lourdes amendes."
