# Some French text was translated automatically.
"Scottish–Norwegian War": "Guerre écossaise-norvégienne"
"A war between Scotland and Norway over the Hebrides and the Isle of Man, Norwegian since 1098. In 1263 King Haakon IV sailed with more than 120 ships to defend the isles, but the clash at Largs on 2 October was indecisive and Haakon died in Orkney that winter. By the Treaty of Perth in 1266 Norway sold the Hebrides and Man to Scotland for 4,000 marks and an annual payment of 100 marks, while Scotland recognised Norwegian rule over Orkney and Shetland.": "Une guerre entre l’Écosse et la Norvège sur les Hébrides et l’île de Man, Norvégien depuis 1098. En 1263 le roi Haakon IV navigua avec plus de 120 navires pour défendre les îles, mais l’affrontement à Largs le 2 octobre était indécis et Haakon mourut à Orkney cet hiver-là. Par le traité de Perth en 1266 la Norvège a vendu les Hebrides et Man à l’Écosse pour 4 000 marks et un paiement annuel de 100 marks, tandis que l’Ecosse a reconnu la domination norvégienne sur Orkney et Shetland."
"Largs is often remembered in Scotland as a great victory, but the Norwegian sources describe a skirmish fought by part of the army on the shore after storms drove ships aground; most historians see it as indecisive.": "On se souvient souvent des Largs en Écosse comme d’une grande victoire, mais les sources norvégiennes décrivent un escarmouche combattu par une partie de l’armée sur le rivage après que les tempêtes ont fait échouer les navires ; la plupart des historiens le considèrent comme indécis."
