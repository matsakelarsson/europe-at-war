# French translations of the catalogue text (wave 7); step bodies follow later.
Second Anglo-Afghan War: Deuxième guerre anglo-afghane
The war in which British India invaded Afghanistan to force the amir Sher Ali Khan, who had received a Russian mission, to accept British control of his foreign relations. British and Indian columns took the Khyber, the Kurram and Kandahar in 1878–1879, and Sher Ali’s son Yaqub Khan signed the Treaty of Gandamak. The killing of the British envoy in Kabul in September 1879 brought a second invasion, Afghan risings around Kabul and the British defeat at Maiwand in July 1880, before Roberts’s march from Kabul to Kandahar ended the fighting. Britain withdrew, recognising Abdur Rahman Khan as amir, but kept the Kurram, Pishin and Sibi districts and control of Afghanistan’s foreign policy.: La guerre au cours de laquelle l’Inde britannique envahit l’Afghanistan pour contraindre l’émir Sher Ali Khan, qui avait reçu une mission russe, à accepter le contrôle britannique de ses relations extérieures. Des colonnes britanniques et indiennes prirent la passe de Khyber, la vallée de la Kurram et Kandahar en 1878–1879, et Yaqub Khan, fils de Sher Ali, signa le traité de Gandamak. Le meurtre de l’envoyé britannique à Kaboul en septembre 1879 entraîna une seconde invasion, des soulèvements afghans autour de Kaboul et la défaite britannique de Maiwand en juillet 1880, avant que la marche de Roberts de Kaboul à Kandahar ne mette fin aux combats. La Grande-Bretagne se retira en reconnaissant Abdur Rahman Khan comme émir, mais garda les districts de Kurram, de Pishin et de Sibi ainsi que le contrôle de la politique étrangère afghane.
