# French translations of the catalogue text (wave 13); step bodies follow later.
Second Anglo-Ashanti War: Deuxième guerre anglo-ashanti
? A brief war between the Asante Empire and Britain, which had ruled the Gold Coast forts and a protectorate over the coastal states since the peace of 1831. In 1862 Kwesi Gyani, an Asante subject accused of keeping a gold nugget that belonged by law to the king, fled south across the Pra river into the British Protectorate. Asantehene Kwaku Dua I demanded his return; Governor Richard Pine refused. Early in 1863 Asante armies crossed the Pra, defeated the forces of the coastal states sent against them, burnt villages in the Protectorate and withdrew with the rains. Pine sent troops of the West India Regiment and local levies to the Pra in 1864 to prepare an advance on Kumasi, but they could not cross the river in strength, and fever and dysentery killed far more of them than any fighting. London, unwilling to pay for a war in the interior, ordered the force withdrawn in mid-1864. Neither side claimed victory; a parliamentary select committee in 1865 even recommended that Britain prepare to leave most of West Africa, and the question of who ruled the coast was left to the war of 1873.
: Une brève guerre entre l’empire ashanti et la Grande-Bretagne, qui gouvernait les forts de la Côte-de-l’Or et exerçait un protectorat sur les États côtiers depuis la paix de 1831. En 1862, Kwesi Gyani, sujet ashanti accusé d’avoir gardé une pépite d’or qui revenait de droit au roi, s’enfuit vers le sud, au-delà du Pra, dans le protectorat britannique. L’Asantehene Kwaku Dua Ier exigea qu’il lui soit rendu ; le gouverneur Richard Pine refusa. Au début de 1863, des armées ashanti franchirent le Pra, vainquirent les forces des États côtiers envoyées contre elles, incendièrent des villages du protectorat et se retirèrent avec les pluies. Pine envoya en 1864 des troupes du West India Regiment et des levées locales sur le Pra pour préparer une marche sur Kumasi, mais elles ne purent franchir le fleuve en force, et la fièvre et la dysenterie en tuèrent bien plus que les combats. Londres, peu disposé à financer une guerre dans l’intérieur, ordonna le retrait des troupes au milieu de 1864. Aucun des deux camps ne revendiqua la victoire ; une commission d’enquête parlementaire recommanda même en 1865 que la Grande-Bretagne se prépare à quitter la plus grande partie de l’Afrique de l’Ouest, et la question de savoir qui gouvernait la côte fut laissée à la guerre de 1873.
