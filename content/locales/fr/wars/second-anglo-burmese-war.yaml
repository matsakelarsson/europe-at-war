# French translations of the catalogue text (wave 11); step bodies follow later.
Second Anglo-Burmese War: Deuxième guerre anglo-birmane
The East India Company’s conquest of Pegu, the Irrawaddy delta and the lands up to Prome and Toungoo from the Konbaung kingdom of Burma. A dispute over fines that the governor of Rangoon had imposed on two British sea captains led the Governor-General, Lord Dalhousie, to send Commodore George Lambert, who blockaded Rangoon and seized a royal ship in January 1852. When King Pagan did not meet the Company’s demands, an expedition under Major-General Henry Godwin took Martaban and Rangoon in April 1852, Bassein and Pegu in May and June, and Prome in October. Dalhousie annexed the province of Pegu by a proclamation dated 20 December 1852 and read out at Rangoon on 20 January 1853. In Burma the war brought down Pagan Min, who was overthrown by his half-brother Mindon in February 1853. Mindon wanted peace but would not sign away Burmese land, so the war ended with a ceasefire in mid-1853 and no treaty. Local resistance continued for some months, notably under Myat Toon near Danubyu.: La conquête par la Compagnie des Indes orientales de Pégou, du delta de l’Irrawaddy et des terres jusqu’à Prome et Toungoo, aux dépens du royaume Konbaung de Birmanie. Un différend sur des amendes que le gouverneur de Rangoun avait infligées à deux capitaines de navire britanniques conduisit le gouverneur général, Lord Dalhousie, à envoyer le commodore George Lambert, qui établit le blocus de Rangoun et s’empara d’un navire royal en janvier 1852. Le roi Pagan n’ayant pas satisfait aux exigences de la Compagnie, une expédition commandée par le major-général Henry Godwin prit Martaban et Rangoun en avril 1852, Bassein et Pégou en mai et juin, et Prome en octobre. Dalhousie annexa la province de Pégou par une proclamation datée du 20 décembre 1852 et lue à Rangoun le 20 janvier 1853. En Birmanie, la guerre provoqua la chute de Pagan Min, renversé par son demi-frère Mindon en février 1853. Mindon voulait la paix mais refusait de céder par traité des terres birmanes, si bien que la guerre s’acheva au milieu de 1853 par un cessez-le-feu, sans traité. La résistance locale se poursuivit pendant quelques mois, notamment sous Myat Toon, près de Danubyu.
