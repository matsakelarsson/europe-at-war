"The Medway and the Peace of Breda": "Le Medway et la paix de Breda"
"Short of money after the plague and the fire, Charles II laid up his largest ships at Chatham while peace talks went on at Breda. Johan de Witt decided to force the issue. In June 1667 a Dutch fleet under de Ruyter, with de Witt’s brother Cornelis on board, entered the Thames estuary, took the unfinished fort at Sheerness on 20 June and pushed up the Medway. On 22–23 June Dutch sailors broke the chain across the river at Gillingham, burned several of the greatest English warships off Chatham and towed away the flagship Royal Charles.": "En juin 1667, une flotte néerlandaise sous de Ruyter, avec le frère de Witts Cornelis à bord, entra dans l’estuaire de la Tamise, prit le fort inachevé à Sheerness le 20 juin et poussa le Medway. Les 22 et 23 juin, des marins hollandais brisèrent la chaîne de l’autre côté de la rivière à Gillingham, brûlèrent plusieurs des plus grands navires de guerre anglais au large de Chatham et remorquèrent le Royal Charles."
"It was one of the worst defeats in the history of the Royal Navy, and the Dutch fleet blockaded the Thames for weeks, causing panic in London. The Treaty of Breda was signed on 31 July 1667. Each side kept what it held, so England kept New York and the Dutch kept Suriname, which they had taken that year, and the spice island of Run in the East Indies. The Navigation Acts were eased to let Dutch ships carry goods from Germany to England. The stern of the Royal Charles is still on show in the Rijksmuseum in Amsterdam.": "C’était l’une des pires défaites de l’histoire de la Royal Navy, et la flotte néerlandaise a bloqué la Tamise pendant des semaines, provoquant une panique à Londres. Le traité de Breda fut signé le 31 juillet 1667. Chaque partie conserva ce qu’il tenait, de sorte que l’Angleterre garda New York et les Hollandais gardèrent le Suriname, qu’ils avaient pris cette année-là, et l’île piquante de Run dans les Antilles orientales. Les lois sur la navigation ont été assouplies pour permettre aux navires néerlandais de transporter des marchandises d’Allemagne à l’Angleterre. La poupe du Royal Charles est toujours en spectacle dans le Rijksmuseum à Amsterdam."
