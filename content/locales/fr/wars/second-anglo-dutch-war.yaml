"Rivalry over trade in Africa, Asia and America brought the two Protestant sea powers back to war, eleven years after their first. English ships seized Dutch trading posts in West Africa in 1664 and New Amsterdam, which became New York, in September, and England declared war in March 1665. On 13 June 1665 the fleets met off Lowestoft. The English, under the King’s brother James, Duke of York, won. The Dutch flagship blew up with Lieutenant-Admiral van Wassenaer van Obdam, and the Dutch lost about 17 ships. The Grand Pensionary, Johan de Witt, rebuilt the fleet under Michiel de Ruyter, while England was struck by the Great Plague.": "La rivalité sur le commerce en Afrique, en Asie et en Amérique a ramené les deux puissances de la mer protestante à la guerre, onze ans après leur premier. Des navires anglais ont saisi des postes de traite néerlandais en Afrique de l’Ouest en 1664 et New Amsterdam, qui est devenu New York, en septembre, et l’Angleterre a déclaré la guerre en mars 1665. Le vaisseau amiral néerlandais a explosé avec le lieutenant-amiral van Wassenaer van Obdam, et les Hollandais ont perdu environ 17 navires. Le Grand Pensionnaire, Johan de Witt, a reconstruit la flotte sous Michiel de Ruyter, tandis que l’Angleterre a été frappée par la Grande Plague."
"France and Denmark–Norway joined the Dutch in 1666, though France did little. On 11–14 June 1666 de Ruyter beat the English fleet under George Monck and Prince Rupert in the Four Days’ Battle, one of the longest sea battles ever fought; the English lost about ten ships and thousands of men killed or captured. The English replied by winning the St James’s Day Battle on 4–5 August, and on 19–20 August Sir Robert Holmes burned about 150 merchant ships in the Vlie and the town of West-Terschelling, a raid remembered as Holmes’s Bonfire. Weeks later the Great Fire destroyed much of London.": "La France et le Danemark-Norvège se joignirent aux Hollandais en 1666, mais la France ne fit que peu.Les 11 et 14 juin 1666 de Ruyter battit la flotte anglaise sous George Monck et Prince Rupert lors de la bataille des Quatre Jours, l’une des plus longues batailles maritimes jamais menées ; les Anglais perdirent environ dix navires et des milliers d’hommes tués ou capturés. Les Anglais répliquèrent en remportant la bataille de St James's Day les 4 et 5 août, et les 19 et 20 août sir Robert Holmes brûla environ 150 navires marchands dans la Vlie et la ville d’Ouest-Terschelling, un raid dont on se souvient comme Holmes's Bonfire."
