"1667": "1667"
"Second Anglo-Dutch War": "Deuxième guerre anglo-néerlandaise"
"A naval war between England and the Dutch Republic over trade and colonies, in which France and Denmark–Norway joined the Dutch and the Bishop of Münster attacked them by land. After an English victory off Lowestoft and a Dutch one in the Four Days’ Battle, the Dutch raid on the Medway in 1667 hastened the Treaty of Breda, which left England with New York and the Dutch with Suriname.": "Une guerre navale entre l’Angleterre et la République néerlandaise au sujet du commerce et des colonies, dans laquelle la France et le Danemark-Norvège se joignirent aux Hollandais et l’évêque de Münster les attaqua par terre.Après une victoire anglaise au large de Basaloft et une bataille hollandaise au cours des quatre jours, le raid néerlandais sur la Medway en 1667 hâta le traité de Breda qui quitta l’Angleterre avec New York et les Hollandais avec le Suriname."
"Dates are New Style (Gregorian), as used in the Dutch Republic. English accounts usually give Old Style dates, ten days earlier; the Four Days’ Battle, for example, was 1–4 June 1666 Old Style.": "Les dates sont New Style (Gregorian), tel qu’utilisé en République Néerlandaise. Les comptes anglais donnent généralement des dates Old Style, dix jours plus tôt ; la bataille de Four Days, par exemple, était du 1er au 4 juin 1666 Old Style."
"The war was also fought off West Africa, in North America and in the Caribbean, which are not shown on the map.": "La guerre a également été menée au large de l’Afrique de l’Ouest, en Amérique du Nord et dans les Caraïbes, qui ne sont pas indiquées sur la carte."
