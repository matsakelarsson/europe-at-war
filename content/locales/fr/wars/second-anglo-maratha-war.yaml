# French translations of the catalogue text (wave 8); step bodies follow later.
Second Anglo-Maratha War: Deuxième guerre anglo-marathe
"A war between the British East India Company and the Maratha chiefs Daulat Rao Scindia of Gwalior and Raghoji II Bhonsle of Nagpur, and from 1804 Yashwantrao Holkar of Indore. It began after the Peshwa, Baji Rao II, driven from Pune by Holkar, accepted Company protection in the Treaty of Bassein (1802). In 1803 Arthur Wellesley won at Assaye and Argaon in the Deccan, Gerard Lake took Aligarh, Delhi and Agra and destroyed Scindia’s European-trained brigades at Laswari, and other columns took Cuttack and Broach. By the treaties of Deogaon and Surji-Anjangaon the Company gained Odisha, the upper Ganges–Yamuna Doab, Delhi and Agra, and became protector of the Mughal emperor. Holkar’s war of 1804–1805 went less well for the Company: Monson’s column was routed in Rajputana and Lake failed four times to storm Bharatpur. The Treaty of Rajghat (December 1805) ended the war with Holkar’s power reduced but intact.": "Une guerre entre la Compagnie britannique des Indes orientales et les chefs marathes Daulat Rao Scindia de Gwalior et Raghoji II Bhonsle de Nagpur, ainsi que, à partir de 1804, Yashwantrao Holkar d’Indore. Elle éclata après que le peshwa Baji Rao II, chassé de Pune par Holkar, eut accepté la protection de la Compagnie par le traité de Bassein (1802). En 1803, Arthur Wellesley l’emporta à Assaye et à Argaon, dans le Dekkan, Gerard Lake prit Aligarh, Delhi et Agra et anéantit à Laswari les brigades de Scindia formées à l’européenne, et d’autres colonnes prirent Cuttack et Broach. Par les traités de Deogaon et de Surji-Anjangaon, la Compagnie obtint l’Odisha, le haut Doab entre le Gange et la Yamuna, Delhi et Agra, et devint la protectrice de l’empereur moghol. La guerre de Holkar, en 1804–1805, tourna moins bien pour la Compagnie : la colonne de Monson fut mise en déroute au Rajputana et Lake échoua à quatre reprises à prendre Bharatpur d’assaut. Le traité de Rajghat (décembre 1805) mit fin à la guerre, laissant la puissance de Holkar amoindrie mais intacte."
