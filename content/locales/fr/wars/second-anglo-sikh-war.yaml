# French translations of the catalogue text (wave 8); step bodies follow later.
Second Anglo-Sikh War: Deuxième guerre anglo-sikhe
The war that ended the Sikh Empire. It began in April 1848 as a revolt at Multan, where the governor, Diwan Mulraj, had been forced to resign and two British officers sent to take over were killed, and became a general rising when the Sikh army under Sher Singh Attariwala joined it in September. The Company’s army under Lord Gough fought indecisive and costly battles at Ramnagar and Chillianwala, took Multan in January 1849 after a long siege, and won a decisive victory at Gujrat in February. The Sikh army surrendered in March, and on 29 March 1849 the Punjab was annexed to British India.: La guerre qui mit fin à l’Empire sikh. Elle commença en avril 1848 par une révolte à Multan, où le gouverneur, le diwan Mulraj, avait été contraint de démissionner et où deux officiers britanniques envoyés pour prendre la relève avaient été tués, et devint un soulèvement général lorsque l’armée sikhe commandée par Sher Singh Attariwala s’y joignit en septembre. L’armée de la Compagnie, sous Lord Gough, livra des batailles indécises et coûteuses à Ramnagar et à Chillianwala, prit Multan en janvier 1849 après un long siège et remporta une victoire décisive à Gujrat en février. L’armée sikhe se rendit en mars et, le 29 mars 1849, le Pendjab fut annexé à l’Inde britannique.
