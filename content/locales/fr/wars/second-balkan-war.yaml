# Some French text was translated automatically.
"Second Balkan War": "Deuxième guerre des Balkans"
"A six-week war over the division of Macedonia, in which Bulgaria attacked its former allies Serbia and Greece and was defeated, while Romania and the Ottoman Empire invaded from the north and east. By the Treaty of Bucharest of August 1913 Bulgaria lost most of Macedonia to Serbia and Greece and Southern Dobruja to Romania, and in September it returned Adrianople to the Ottomans.": "Une guerre de six semaines sur la division de Macédoine, au cours de laquelle la Bulgarie attaqua ses anciens alliés la Serbie et la Grèce et fut vaincue, tandis que la Roumanie et l’Empire ottoman envahirent du nord et de l’est. Par le traité de Bucarest d’août 1913, la Bulgarie perdit la plus grande partie de la Macédoine à la Serbie et à la Grèce et au sud de Dobruja à la Roumanie, et en septembre elle retourna Adrianople aux Ottomans."
"Bulgaria, Serbia, Greece, Montenegro and Romania still used the Julian (Old Style) calendar; Bulgarian and Greek accounts often date the start of the war to 16–17 June and the Battle of Kilkis–Lachanas to 19–21 June. All dates here are New Style.": "La Bulgarie, la Serbie, la Grèce, le Monténégro et la Roumanie utilisaient toujours le calendrier julien (ancien style) ; les comptes bulgares et grecs datent souvent du début de la guerre jusqu’au 16-17 juin et de la bataille de Kilkis–Lachanas jusqu’au 19-21 juin."
"The Carnegie Commission of 1914 found that every army in the war, and the irregulars with them, had killed civilians and burned villages, Bulgarian, Greek, Muslim and others alike.": "La Commission Carnegie de 1914 a constaté que toutes les armées de la guerre, et les irréguliers avec elles, avaient tué des civils et brûlé des villages, bulgares, grecs, musulmans et autres."
