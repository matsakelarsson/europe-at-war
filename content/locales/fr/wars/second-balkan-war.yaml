"July 1913": "juillet 1913"
"Romania had stayed out of the first war but claimed Southern Dobruja in return for Bulgaria’s gains. On 10 July it declared war, and its army occupied Southern Dobruja without a fight. On the night of 14–15 July Romanian troops crossed the Danube into northern Bulgaria and marched on Sofia almost unopposed, since the Bulgarian army was fighting in the south and west. Their cavalry reached Vrazhdebna, on the edge of the capital. Cholera, rather than the Bulgarians, caused most of the Romanian army’s losses.": "La Roumanie est restée en dehors de la première guerre, mais a revendiqué Dobruja du Sud en échange des gains de la Bulgarie. Le 10 juillet, elle a déclaré la guerre et son armée a occupé Dobruja du Sud sans se battre. Dans la nuit du 14 au 15 juillet, les troupes roumaines ont traversé le Danube dans le nord de la Bulgarie et ont marché sur Sofia presque sans opposition, puisque l’armée bulgare combattait dans le sud et l’ouest. Leur cavalerie a atteint Vrazhdebna, au bord de la capitale. Le choléra, plutôt que les Bulgares, a causé la plupart des pertes de l’armée roumaine."
"The Ottoman Empire seized its chance. On 12 July its army crossed the Enos–Midia line and reoccupied Eastern Thrace, which had few Bulgarian troops left, and on 23 July Enver Bey rode into Adrianople unopposed, calling himself its second conqueror. Reprisals by Ottoman troops and irregulars drove most of the Bulgarians of Eastern Thrace from their homes. With enemies on every side, Bulgaria’s government resigned, and the new prime minister, Vasil Radoslavov, sought an armistice.": "Le 12 juillet, son armée franchit la ligne d’Enos-Midia et réoccupa la Thrace orientale, qui avait laissé peu de troupes bulgares, et le 23 juillet, Enver Bey monta sans opposition dans Adrianople, se disant son deuxième conquérant. Les représailles des troupes ottomanes et les irrégularités chassaient la plupart des Bulgares de Thrace orientale. Avec des ennemis de tous côtés, le gouvernement bulgare démissionna et le nouveau premier ministre Vasil Radoslavov chercha un armistice."
