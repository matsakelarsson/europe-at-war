"July – September 1913": "juillet – septembre 1913"
"The Greek army, advancing up the Struma valley into Bulgaria itself, was counter-attacked from both flanks in the Kresna Gorge from 21 July and came close to being surrounded, while the Serbs were held at Kalimanci on the Bregalnica. Both sides were exhausted, and King Constantine, who had planned to march on Sofia, accepted an armistice that came into force on 31 July. A peace conference met in Bucharest, where the Romanian prime minister, Titu Maiorescu, presided over the division of the spoils.": "L’armée grecque, qui remontait la vallée de Struma en Bulgarie elle-même, a été contre-attaquée des deux flancs dans la gorge de Kresna à partir du 21 juillet et s’est approchée d’être encerclée, tandis que les Serbes étaient détenus à Kalimanci sur la Bregalnica. Les deux côtés ont été épuisés, et le roi Constantin, qui avait prévu de marcher sur Sofia, a accepté un armistice qui est entré en vigueur le 31 juillet. Une conférence de paix s’est réunie à Bucarest, où le Premier ministre roumain, Titu Maiorescu, a présidé la division du butin."
"By the Treaty of Bucharest of 10 August Romania took Southern Dobruja. Serbia kept northern and central Macedonia, Greece the south with Thessaloniki and Kavala, and Bulgaria only the Pirin region, the Strumica valley and Western Thrace with an outlet to the Aegean at Dedeagach. In the Treaty of Constantinople of 29 September Bulgaria gave Adrianople and most of Eastern Thrace back to the Ottomans. Bulgarians called the outcome their first national catastrophe, and the quarrel over Macedonia helped draw Bulgaria into the First World War on the side of the Central Powers.": "Par le traité de Bucarest du 10 août, la Roumanie a pris Dobruja du Sud. La Serbie a gardé le nord et le centre de la Macédoine, la Grèce le sud avec Thessalonique et Kavala, et la Bulgarie seulement la région Pirin, la vallée de Strumica et la Thrace occidentale avec une sortie vers l’Egée à Dedeagach. Dans le traité de Constantinople du 29 septembre, la Bulgarie a remis Adrianople et la plupart de Thrace orientale aux Ottomans. Les Bulgares ont qualifié le résultat de leur première catastrophe nationale, et la querelle sur la Macédoine a aidé à attirer la Bulgarie dans la Première Guerre mondiale du côté des puissances centrales."
