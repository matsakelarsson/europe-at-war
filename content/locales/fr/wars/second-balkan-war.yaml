"June – July 1913": "juin – juillet 1913"
"The victors of the First Balkan War fell out over Macedonia. Serbia, denied a port in Albania, wanted to keep the central Macedonian lands its army held, which the 1912 treaty had promised to Bulgaria, and on 1 June 1913 it signed a secret alliance with Greece. Bulgaria, confident in its army, would not wait for Russian arbitration. On the night of 29–30 June, without a declaration of war, Bulgarian troops attacked Serbian positions on the Bregalnica river and Greek positions east of Thessaloniki. The Serbs held, and in a week of fighting along the Bregalnica drove the Bulgarians back.": "Les vainqueurs de la Première Guerre des Balkans se sont abattus sur la Macédoine. La Serbie, niée dans un port d’Albanie, voulait garder les terres centrales macédoniennes que son armée avait tenues, ce que le traité de 1912 avait promis à la Bulgarie, et le 1er juin 1913 elle a signé une alliance secrète avec la Grèce. Dans la nuit du 29 au 30 juin, sans déclaration de guerre, les troupes bulgares ont attaqué des positions serbes sur le fleuve Bregalnica et des positions grecques à l’est de Thessalonique."
"In Thessaloniki, Greek troops overwhelmed the small Bulgarian garrison on 30 June and 1 July. The Greek army under King Constantine, who had come to the throne after his father’s assassination in March, attacked at Kilkis and Lachanas on 2–4 July and won after heavy losses on both sides. It pushed north past Lake Doiran and up the Struma valley. As they retreated, Bulgarian troops burned much of Serres, while Kilkis was burned by the Greeks, and civilians of every community were killed or driven from their homes.": "À Thessalonique, les troupes grecques ont envahi la petite garnison bulgare les 30 juin et 1er juillet. L’armée grecque sous le roi Constantin, qui était venu sur le trône après l’assassinat de son père en mars, a attaqué à Kilkis et Lachanas les 2-4 juillet et a gagné après de lourdes pertes des deux côtés. En retraite, les troupes bulgares ont brûlé une grande partie de Serres, tandis que Kilkis a été brûlé par les Grecs, et des civils de chaque communauté ont été tués ou chassés de leurs maisons."
