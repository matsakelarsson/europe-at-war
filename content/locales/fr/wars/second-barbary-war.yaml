# French translations of the catalogue text (wave 12); step bodies follow later.
Second Barbary War: Seconde guerre barbaresque
? "A short war between the United States and the Regency of Algiers that ended American tribute to the North African regencies. In 1812, as the United States went to war with Britain, the dey of Algiers rejected his treaty of 1795 and declared war, and Algerian corsairs took American ships and crews. After peace with Britain, Congress authorised force against Algiers on 3 March 1815, and Commodore Stephen Decatur sailed from New York on 20 May with a squadron of ten ships, the largest American fleet yet assembled. On 17 June, off the south-east coast of Spain, he took the Algerian flagship Meshouda, whose commander, Rais Hamidou, was killed, and two days later the brig Estedio. Arriving off Algiers at the end of June, he dictated a treaty to Dey Omar Agha, signed on 30 June and 3 July aboard the Guerriere: no more American tribute, the release of the American captives (about ten) in exchange for some 500 Algerian prisoners and the return of the two ships, and $10,000 in compensation. Decatur then sailed to Tunis and Tripoli and obtained compensation for American prizes lost in their ports during the War of 1812. The dey later repudiated the treaty, but after the Anglo-Dutch bombardment of 1816 the American consul William Shaler, backed by a second squadron, obtained a new treaty with the same terms in December 1816."
: "Une courte guerre entre les États-Unis et la régence d’Alger qui mit fin au tribut américain versé aux régences d’Afrique du Nord. En 1812, alors que les États-Unis entraient en guerre contre la Grande-Bretagne, le dey d’Alger dénonça son traité de 1795 et déclara la guerre, et des corsaires algériens s’emparèrent de navires et d’équipages américains. Après la paix avec la Grande-Bretagne, le Congrès autorisa le recours à la force contre Alger le 3 mars 1815, et le commodore Stephen Decatur quitta New York le 20 mai avec une escadre de dix navires, la plus grande flotte américaine jamais réunie jusque-là. Le 17 juin, au large de la côte sud-est de l’Espagne, il prit le navire amiral algérien, le Meshouda, dont le commandant, Raïs Hamidou, fut tué, et deux jours plus tard le brick Estedio. Arrivé devant Alger à la fin de juin, il dicta au dey Omar Agha un traité, signé le 30 juin et le 3 juillet à bord du Guerriere : fin du tribut américain, libération des captifs américains (une dizaine) en échange de quelque 500 prisonniers algériens et de la restitution des deux navires, et 10 000 dollars d’indemnité. Decatur fit ensuite voile vers Tunis et Tripoli et obtint une indemnisation pour les prises américaines perdues dans leurs ports pendant la guerre de 1812. Le dey répudia plus tard le traité, mais après le bombardement anglo-néerlandais de 1816, le consul américain William Shaler, appuyé par une seconde escadre, obtint en décembre 1816 un nouveau traité aux mêmes conditions."
