"Second Barons’ War": "Deuxième guerre des Barons"
? "A civil war in England between Henry III and barons led by Simon de Montfort, earl of Leicester, who wanted to hold the king to the Provisions of Oxford of 1258, which put royal government under a baronial council. After Louis IX of France annulled the Provisions in the Mise of Amiens in January 1264, war broke out, and Montfort’s followers attacked the Jewish communities of London and other towns. On 14 May 1264 Montfort defeated and captured the king and his son Edward at Lewes, and ruled in the king’s name, summoning a parliament in January 1265 that included representatives of the towns. Edward escaped in May 1265 and on 4 August killed Montfort at Evesham, where his body was mutilated. Rebels held out at Kenilworth until December 1266 and in the Isle of Ely until 1267; the Dictum of Kenilworth let them buy back their lands, and the Treaty of Montgomery of September 1267 recognised Montfort’s ally Llywelyn ap Gruffudd as Prince of Wales."
: "Une guerre civile en Angleterre entre Henri III et des barons conduits par Simon de Montfort, comte de Leicester, qui voulait tenir le roi aux dispositions d’Oxford de 1258, qui mettent le gouvernement royal sous un conseil Baronial. Après Louis IX de France a annulé les dispositions dans la Mise d’Amiens en Janvier 1264, la guerre éclate, et les disciples de Montfortl attaquent les communautés juives de Londres et d’autres villes. Le 14 mai 1264, Montfort battit et prit le roi et son fils Edward à Lewes, et régna au nom du roi, convoquant un parlement en janvier 1265 qui comprenait des représentants des villes. Edward s’échappa en mai 1265 et, le 4 août, tua Montfort à Evesham, où son corps fut mutilé. Les rebelles se déroulèrent à Kenilworth jusqu’en décembre 1266 et dans l’île d’Ely jusqu’en 1267 ; le Dictum de Kenilworth les laissa racheter leurs terres, et le traité de Montgomery de septembre 1267 reconnut Montforts allié Llywelyn ap Gruffudd comme Prince de Galles."
