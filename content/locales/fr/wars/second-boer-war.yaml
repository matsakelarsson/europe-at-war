# French translations of the catalogue text (wave 13); step bodies follow later.
Second Boer War: Seconde guerre des Boers
? The war in which the British Empire conquered the two Boer republics, the South African Republic (Transvaal) and the Orange Free State. The discovery of gold on the Witwatersrand in 1886 had made the Transvaal the richest state in southern Africa; Britain, pressed by the mining houses and by its high commissioner Alfred Milner, demanded the vote for the mostly British immigrants (Uitlanders), and the republics struck first in October 1899. Boer commandos besieged Ladysmith, Kimberley and Mafeking and defeated three British armies in “Black Week” (December 1899), but a huge imperial army under Lord Roberts relieved the towns and took Bloemfontein, Johannesburg and Pretoria by June 1900. The Boers then fought a guerrilla war for two more years. Lord Kitchener answered with blockhouse lines, the burning of farms and the internment of Boer and African civilians in camps, where some 28,000 Boers, most of them children, and at least 14,000 and probably more than 20,000 Africans died. The Peace of Vereeniging (31 May 1902) made the republics British colonies; in 1910 they joined the Union of South Africa. About 22,000 soldiers of the empire and some 6,000–7,000 Boer fighters died. Many South Africans now call it the South African War, since Africans fought, worked and died on both sides.
: La guerre par laquelle l’Empire britannique conquit les deux républiques boers, la République sud-africaine (Transvaal) et l’État libre d’Orange. La découverte d’or sur le Witwatersrand en 1886 avait fait du Transvaal l’État le plus riche d’Afrique australe ; la Grande-Bretagne, poussée par les grandes compagnies minières et par son haut-commissaire Alfred Milner, exigea le droit de vote pour les immigrants, britanniques pour la plupart (les Uitlanders), et les républiques frappèrent les premières en octobre 1899. Les commandos boers assiégèrent Ladysmith, Kimberley et Mafeking et battirent trois armées britanniques lors de la « Semaine noire » (décembre 1899), mais une immense armée impériale commandée par lord Roberts dégagea les villes et, en juin 1900, avait pris Bloemfontein, Johannesburg et Pretoria. Les Boers menèrent ensuite une guérilla pendant deux années encore. Lord Kitchener riposta par des lignes de blockhaus, l’incendie des fermes et l’internement des civils boers et africains dans des camps, où moururent quelque 28 000 Boers, des enfants pour la plupart, et au moins 14 000 Africains, et probablement plus de 20 000. La paix de Vereeniging (31 mai 1902) fit des républiques des colonies britanniques ; en 1910, elles entrèrent dans l’Union sud-africaine. Environ 22 000 soldats de l’Empire et quelque 6 000 à 7 000 combattants boers moururent. Beaucoup de Sud-Africains l’appellent aujourd’hui la guerre d’Afrique du Sud, puisque des Africains combattirent, travaillèrent et moururent dans les deux camps.
