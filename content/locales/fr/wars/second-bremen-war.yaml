"1665–1666": "1665–1666"
"Bremen refused to swear allegiance to the new boy king, Charles XI, and in March 1665 the Swedish council decided on war. Early in 1666 Carl Gustaf Wrangel marched from Pomerania with about 14,000 men, and by the summer Swedish troops held all of Bremen’s lands except the city itself.": "Brême refusa de jurer allégeance au nouveau roi garçon, Charles XI, et en mars 1665 le conseil suédois décida de la guerre. Au début de 1666 Carl Gustaf Wrangel marcha de Poméranie avec environ 14 000 hommes, et par l’été les troupes suédoises détenaient toutes les terres de Brême sauf la ville elle-même."
"Bremen found allies. Brunswick-Lüneburg and the Elector of Cologne raised a relief army, and Brandenburg, Denmark–Norway and the Dutch Republic joined against Sweden. Wrangel could not take the city and opened talks at his headquarters in Habenhausen.": "Brême a trouvé des alliés. Brunswick-Lüneburg et l’électeur de Cologne ont élevé une armée de secours, et Brandenburg, Danemark-Norvège et la République néerlandaise se sont joints contre la Suède. Wrangel n’a pas pu prendre la ville et ont ouvert des pourparlers à son quartier général à Habenhausen."
