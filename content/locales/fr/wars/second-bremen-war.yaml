"Second Bremen War": "Deuxième guerre de Brême"
"A second Swedish attempt to subdue the city of Bremen, which refused to do homage to the young Charles XI. German princes, Denmark–Norway and the Dutch Republic backed the city, and Sweden had to give up the attempt at the Peace of Habenhausen in 1666.": "Une deuxième tentative suédoise pour soumettre la ville de Brême, qui a refusé de rendre hommage au jeune Charles XI. Les princes allemands, le Danemark-Norvège et la République néerlandaise ont soutenu la ville, et la Suède a dû renoncer à la tentative de paix de Habenhausen en 1666."
"Dates in Germany and Poland are New Style (Gregorian); Scandinavian dates are mostly Old Style (Julian), as usually cited, which ran ten days behind.": "Les dates en Allemagne et en Pologne sont New Style (Gregorian) ; les dates scandinaves sont pour la plupart Old Style (Julian), comme on le cite habituellement, qui a duré dix jours."
