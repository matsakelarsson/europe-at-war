# French translations of the catalogue text (wave 14); step bodies follow later.
Second Carib War: Seconde guerre caraïbe
? The last war of the Garifuna (the “Black Caribs”) for their land on Saint Vincent, fought in alliance with Revolutionary France, which ended in the deportation of almost the whole people. British planters had pressed ever further into the lands left to the Garifuna in 1773, and in March 1795, with the encouragement of Victor Hugues, the Republican commissioner on Guadeloupe, the Garifuna rose under Joseph Chatoyer and his brother Duvallé, joined by many of the island’s French inhabitants. They burned estates on both coasts and advanced on Kingstown, but on the night of 14 March 1795 Chatoyer was killed in a British attack on his camp on Dorsetshire Hill. The Garifuna and the French, reinforced from Guadeloupe, still held most of the island for more than a year, until General Sir Ralph Abercromby landed with a large army, stormed the Vigie and received the French surrender on 11 June 1796. The Garifuna fought on until October 1796. The British then shipped 4,195 Garifuna (by some counts about 5,000) to the small, dry island of Baliceaux, where about half of them died of disease and hunger; in 1797 the 2,248 survivors were carried to the island of Roatán off the coast of Central America, where they landed on 12 April 1797. A few hundred Kalinago and Garifuna remained on Saint Vincent, and in 1804 the colony took their remaining land. Historians such as Hilary Beckles describe the deportation as ethnic cleansing and genocide; Chatoyer is the national hero of Saint Vincent and the Grenadines.
: La dernière guerre des Garifunas (les « Caraïbes noirs ») pour leurs terres de Saint-Vincent, menée en alliance avec la France révolutionnaire, qui s’acheva par la déportation de presque tout le peuple. Les planteurs britanniques empiétaient toujours davantage sur les terres laissées aux Garifunas en 1773, et en mars 1795, encouragés par Victor Hugues, commissaire de la République en Guadeloupe, les Garifunas se soulevèrent sous la conduite de Joseph Chatoyer et de son frère Duvallé, rejoints par de nombreux habitants français de l’île. Ils incendièrent des domaines sur les deux côtes et marchèrent sur Kingstown, mais dans la nuit du 14 mars 1795 Chatoyer fut tué lors d’une attaque britannique contre son camp de Dorsetshire Hill. Les Garifunas et les Français, renforcés depuis la Guadeloupe, tinrent encore la plus grande partie de l’île pendant plus d’un an, jusqu’à ce que le général Sir Ralph Abercromby débarque avec une grande armée, prenne d’assaut la Vigie et reçoive la reddition française le 11 juin 1796. Les Garifunas poursuivirent le combat jusqu’en octobre 1796. Les Britanniques transportèrent alors 4 195 Garifunas (environ 5 000 selon certains décomptes) sur la petite île aride de Baliceaux, où environ la moitié d’entre eux moururent de maladie et de faim ; en 1797, les 2 248 survivants furent emmenés sur l’île de Roatán, au large de l’Amérique centrale, où ils débarquèrent le 12 avril 1797. Quelques centaines de Kalinagos et de Garifunas restèrent à Saint-Vincent, et en 1804 la colonie s’empara de leurs dernières terres. Des historiens comme Hilary Beckles qualifient la déportation de nettoyage ethnique et de génocide ; Chatoyer est le héros national de Saint-Vincent-et-les-Grenadines.
