"Second Carlist War": "Deuxième guerre carliste"
"A Carlist rising fought mainly in Catalonia, where it was called the War of the Matiners (“early risers”), after the guerrillas’ dawn raids. It broke out in 1846, after the plan to marry Isabella II to the Carlist claimant Carlos Luis, Count of Montemolín (“Carlos VI”), came to nothing, and the veteran general Ramón Cabrera returned from exile to lead it in 1848. Government armies under Fernando Fernández de Córdova wore the bands down, smaller risings elsewhere failed, Cabrera crossed back into France in the spring of 1849, and an amnesty followed that June.": "Une montée carliste combattit principalement en Catalogne, où on l’appela la guerre des Matiners, après les raids de l’aube des guérilleros. Elle éclata en 1846, après que le projet d’épouser Isabella II au demandeur carliste Carlos Luis, comte de Montemolín, vint à rien, et le général vétéran Ramón Cabrera revint d’exil pour la mener en 1848. Les armées gouvernementales sous Fernando Fernández de Córdova ont porté les bandes vers le bas, de plus petites montées ailleurs échouèrent, Cabrera retourna en France au printemps de 1849 et une amnistie suivit en juin."
"Casualty estimates range from about 3,000 to 10,000. Some Catalan republicans and progressives fought alongside the Carlists against the moderate government, and some historians see the war as much a Catalan revolt as a dynastic one.": "Des républicains et des progressistes catalans ont combattu aux côtés des carlistes contre le gouvernement modéré, et certains historiens voient la guerre autant une révolte catalane qu’une révolte dynastique."
