"August – October 1999": "août – octobre 1999"
"After 1996 Chechnya, independent in all but name under President Aslan Maskhadov, slid into lawlessness, with kidnappings for ransom common, and radical Islamist commanders such as Shamil Basayev and the Saudi-born Ibn al-Khattab defied the government. On 7 August 1999 they led some 1,500–2,000 fighters into the mountains of neighbouring Dagestan and proclaimed an Islamic state there. Russian forces, under the new prime minister Vladimir Putin, drove them out by late August and then stormed the Islamist villages of Karamakhi and Chabanmakhi; a second incursion in September was also beaten back.": "Après 1996, la Tchétchénie, indépendante en tous autres noms sous le président Aslan Maskhadov, a glissé dans l’illégalité, avec des enlèvements pour rançon commune, et les commandants islamistes radicaux tels que Shamil Basayev et Ibn al-Khattab, né en Arabie saoudite, ont défié le gouvernement. Les forces russes, sous le nouveau Premier ministre Vladimir Poutine, les ont chassés à la fin du mois d’août et ont ensuite pris l’assaut des villages islamistes de Karamakhi et de Chabanmakhi ; une deuxième incursion en septembre a également été repoussée."
"Between 4 and 16 September bombs destroyed apartment blocks in Buynaksk, Moscow and Volgodonsk, killing about 300 people. The government blamed Chechen militants, and Russian courts later convicted men linked to Khattab. But on 22 September residents in Ryazan found a bomb-like device in a basement, which the FSB, the security service, said was a training exercise, and some historians and journalists have accused the service of staging the bombings. Amid public anger Russian aircraft began bombing Chechnya, and on 1 October ground troops crossed the border.": "Entre le 4 et le 16 septembre, des bombes ont détruit des blocs d’appartements à Buynaksk, Moscou et Volgodonsk, tuant environ 300 personnes. Mais le 22 septembre, des résidents de Riazan ont trouvé un dispositif semblable à une bombe dans un sous-sol, que le FSB, le service de sécurité, a déclaré être un exercice d’entraînement, et certains historiens et journalistes ont accusé le service d’organiser les bombardements."
