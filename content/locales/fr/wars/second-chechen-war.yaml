"The fall of Grozny": "La chute de Grozny"
"October 1999 – June 2000": "octobre 1999 – juin 2000"
"This time Russian commanders advanced slowly and relied on artillery and air power. By mid-October they held the plains north of the Terek, and by December they had surrounded Grozny, while hundreds of thousands of civilians fled, many of them to Ingushetia. The assault on the city, held by a few thousand fighters, began on 25 December. Bombardment flattened what was left of it after the first war, and estimates of the civilians killed in the siege run from about 5,000 to 8,000. In 2003 the United Nations called Grozny the most destroyed city on Earth.": "Cette fois-ci, les commandants russes avançaient lentement et dépendaient de l’artillerie et de la puissance aérienne. Vers la mi-octobre, ils tenaient les plaines au nord du Terek, et en décembre, ils avaient entouré Grozny, tandis que des centaines de milliers de civils s’étaient enfuis, dont beaucoup en Ingouchie. Le bombardement a aplati ce qui en restait après la première guerre, et les estimations des civils tués lors du siège sont passées d’environ 5 000 à 8 000. En 2003, l’ONU a appelé Grozny la ville la plus détruite sur Terre."
"At the end of January 2000 the main Chechen force broke out south-west through a minefield towards Alkhan-Kala, losing hundreds of men; Basayev lost a foot. Russia declared Grozny taken on 6 February, and the day before, Russian police killed at least 50 civilians in the Novye Aldi district. In the southern mountains Chechen fighters nearly wiped out a company of paratroopers on Height 776 near Ulus-Kert at the start of March. In May Putin imposed direct rule, and in June he appointed Akhmad Kadyrov, a former separatist mufti who had changed sides, to head the administration.": "Fin janvier 2000, la principale force tchétchène a éclaté dans le sud-ouest à travers un champ de mines en direction d’Alkhan-Kala, perdant des centaines d’hommes ; Basaïev a perdu un pied. La Russie a déclaré Grozny pris le 6 février et la veille, la police russe a tué au moins 50 civils dans le district de Novye Aldi. Dans les montagnes du sud, des combattants tchétchènes ont failli anéantir une compagnie de parachutistes sur la hauteur 776 près d’Ulus-Kert au début de mars. En mai Poutine a imposé le pouvoir direct et en juin il a nommé Akhmad Kadyrov, un ancien mufti séparatiste qui avait changé de camp, pour diriger l’administration."
