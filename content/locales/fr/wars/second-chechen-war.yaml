# Some French text was translated automatically.
"Second Chechen War": "Deuxième guerre tchétchène"
"A war that began when Chechnya-based Islamist fighters invaded Dagestan in August 1999 and deadly apartment bombings struck Russian cities. Russian forces reconquered Chechnya, destroying Grozny in the winter of 1999–2000, and then fought a long insurgency, marked by atrocities against civilians and by terrorist attacks such as the Beslan school siege, while power in Chechnya passed to the Kadyrov family. Russia ended its counter-terrorism operation in 2009.": "Une guerre qui a commencé lorsque des combattants islamistes basés en Tchétchénie ont envahi le Daghestan en août 1999 et des bombardements d’appartements meurtriers ont frappé les villes russes. Les forces russes ont reconquis la Tchétchénie, détruisant Grozny à l’hiver de 1999-2000, puis ont combattu une longue insurrection, marquée par des atrocités contre des civils et des attaques terroristes telles que le siège de l’école de Beslan, tandis que le pouvoir en Tchétchénie est passé à la famille Kadyrov."
"Chechnya is shown as part of Russia on the map, as it is internationally recognised.": "La Tchétchénie figure sur la carte en tant que partie intégrante de la Russie, car elle est reconnue au niveau international."
"Casualty figures are uncertain and disputed. Russia gives about 6,000 soldiers killed; Amnesty International estimated about 25,000 civilians killed and 5,000 missing, and other estimates are higher.": "Les chiffres des pertes sont incertains et contestés. La Russie compte environ 6 000 soldats tués ; Amnesty International estime à 25 000 le nombre de civils tués et 5 000 disparus, et d’autres estimations sont plus élevées."
"The cause of the 1999 apartment bombings remains disputed.": "La cause des bombardements d’appartements de 1999 reste contestée."
