"2000–2009": "2000–2009"
"The war turned into an insurgency of ambushes, assassinations and suicide bombings, met by sweeps of villages, filtration camps and thousands of enforced disappearances, documented by Human Rights Watch and the Russian group Memorial. Attacks reached Moscow, where in October 2002 gunmen took more than 800 people hostage in a theatre and about 130 hostages died, most of them from a gas pumped in by special forces. Moscow handed power to loyal Chechens. A new constitution was approved in March 2003, and Akhmad Kadyrov was elected president that October, but a bomb killed him in a Grozny stadium on 9 May 2004.": "La guerre s’est transformée en une insurrection d’embuscades, d’assassinats et d’attentats-suicides auxquels se sont heurtés des villages, des camps de filtration et des milliers de disparitions forcées, documentés par Human Rights Watch et le groupe russe Memorial. Les attaques ont atteint Moscou, où, en octobre 2002, des hommes armés ont pris plus de 800 personnes en otage dans un théâtre et environ 130 otages sont morts, la plupart d’entre eux à partir d’un gaz pompé par des forces spéciales. Une nouvelle constitution a été approuvée en mars 2003 et Akhmad Kadyrov a été élu président en octobre, mais une bombe l’a tué dans un stade de Grozny le 9 mai 2004."
"On 1 September 2004 a group sent by Basayev seized School No. 1 in Beslan, North Ossetia, with more than 1,100 hostages, most of them children and parents at the start of the school year. On the third day explosions in the gym set off a chaotic battle, and 334 hostages died, 186 of them children. Maskhadov was killed in March 2005 and Basayev in July 2006. Akhmad Kadyrov’s son Ramzan built up a powerful militia and became president in 2007, as the insurgency spread to Dagestan, Ingushetia and Kabardino-Balkaria. Russia formally ended its counter-terrorism operation in Chechnya on 16 April 2009.": "Le 1er septembre 2004, un groupe envoyé par Basaïev s’est emparé de l’école no 1 à Beslan, en Ossétie du Nord, avec plus de 1100 otages, dont la plupart étaient des enfants et des parents au début de l’année scolaire. Le troisième jour, des explosions dans le gymnase ont déclenché une bataille chaotique et 334 otages sont morts, dont 186 enfants. Maskhadov a été tué en mars 2005 et Basaïev en juillet 2006. Ramzan, fils d’Akhmad Kadyrov, a fondé une milice puissante et est devenu président en 2007, alors que l’insurrection s’est étendue au Daghestan, à l’Ingouchie et au Kabardino-Balkaria. La Russie a officiellement mis fin à son opération antiterroriste en Tchétchénie le 16 avril 2009."
