# French translations of the catalogue text (wave 13); step bodies follow later.
Second Congo War: Deuxième guerre du Congo
? "The largest war in modern African history, sometimes called Africa’s World War, fought in the Democratic Republic of the Congo by nine African states and dozens of armed groups. In July 1998 President Laurent-Désiré Kabila ordered out the Rwandan troops who had brought him to power; on 2 August soldiers in Goma rebelled, and Rwanda and Uganda backed a new rebel movement, the Rally for Congolese Democracy (RCD), and flew troops across the country to Kitona in an attempt to take Kinshasa. Angola, Zimbabwe and Namibia, and for a time Chad, sent troops to save Kabila, and the war settled into a front of some 2,400 km dividing the country between the government, the RCD and Rwanda in the east, and Uganda and Jean-Pierre Bemba’s MLC in the north. All sides exploited the Congo’s diamonds, gold, timber and coltan. The Lusaka ceasefire of 1999 was widely broken, and Rwanda and Uganda fought each other at Kisangani. After Kabila was assassinated in January 2001, his son Joseph Kabila revived the peace process: the Pretoria and Luanda agreements of 2002 brought the withdrawal of Rwandan and Ugandan troops, and a transitional government took office in July 2003. Millions died, most of hunger and disease; how many is disputed: the International Rescue Committee estimated 5.4 million excess deaths for 1998–2007, a figure other researchers argue is far too high."
: "La plus grande guerre de l’histoire moderne de l’Afrique, parfois appelée « guerre mondiale africaine », livrée en République démocratique du Congo par neuf États africains et des dizaines de groupes armés. En juillet 1998, le président Laurent-Désiré Kabila ordonna le départ des troupes rwandaises qui l’avaient porté au pouvoir ; le 2 août, des soldats se rebellèrent à Goma, et le Rwanda et l’Ouganda soutinrent un nouveau mouvement rebelle, le Rassemblement congolais pour la démocratie (RCD), et transportèrent par avion des troupes à travers le pays jusqu’à Kitona pour tenter de prendre Kinshasa. L’Angola, le Zimbabwe et la Namibie, ainsi que, un temps, le Tchad, envoyèrent des troupes pour sauver Kabila, et la guerre se figea sur un front d’environ 2 400 km qui partageait le pays entre le gouvernement, le RCD et le Rwanda à l’est, et l’Ouganda et le MLC de Jean-Pierre Bemba au nord. Tous les camps exploitèrent les diamants, l’or, le bois et le coltan du Congo. Le cessez-le-feu de Lusaka de 1999 fut largement violé, et le Rwanda et l’Ouganda s’affrontèrent à Kisangani. Après l’assassinat de Kabila en janvier 2001, son fils Joseph Kabila relança le processus de paix : les accords de Pretoria et de Luanda de 2002 entraînèrent le retrait des troupes rwandaises et ougandaises, et un gouvernement de transition entra en fonction en juillet 2003. Des millions de personnes moururent, pour la plupart de faim et de maladie ; leur nombre est contesté : l’International Rescue Committee estima la surmortalité à 5,4 millions de décès pour 1998–2007, un chiffre que d’autres chercheurs jugent bien trop élevé."
