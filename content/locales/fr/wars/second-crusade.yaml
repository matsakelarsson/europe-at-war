"The crusade called after Zengi took Edessa in 1144, led by Louis VII of France and Conrad III of Germany. Both armies were badly beaten by the Seljuks of Rum in Anatolia, Conrad’s near Dorylaeum and Louis’s at Mount Cadmus, and the survivors’ siege of Damascus in July 1148 was abandoned after four days. Other crusaders took Lisbon in 1147 and campaigned against the Wends on the Baltic.": "La croisade appelée après que Zengi a pris Edessa en 1144, dirigé par Louis VII de France et Conrad III d’Allemagne. Les deux armées ont été gravement battues par les Seljuks de Rum en Anatolie, Conradís près de Dorylaeum et Louisís au mont Cadmus, et les survivants du siège de Damas en Juillet 1148 a été abandonné après quatre jours. D’autres croisés ont pris Lisbonne en 1147 et ont fait campagne contre les Wends sur la Baltique."
"Dates are Julian. The main Western account of the French march is by Odo of Deuil, Louis VII’s chaplain; the siege of Damascus is described by William of Tyre and by Ibn al-Qalanisi, a citizen of Damascus.": "Dates sont Julian. Le récit occidental principal de la marche française est par Odo de Deuil, aumônier de Louis VII ; le siège de Damas est décrit par Guillaume de Tyr et par Ibn al-Qalanisi, un citoyen de Damas."
"Damascus was ruled by the Burid dynasty, in practice by the commander Mu‘in al-Din Unur, a rival of the Zengids until the crusade drove him to seek their help.": "Damas était gouverné par la dynastie des Burides, en pratique par le commandant Mu'in al-Din Unur, un rival des Zengides jusqu’à ce que la croisade l’amène à chercher leur aide."
"The capture of Lisbon in 1147 is told under the Reconquista, and the crusade against the Wends has its own entry.": "La capture de Lisbonne en 1147 est racontée sous la Reconquista, et la croisade contre les Wends a sa propre entrée."
