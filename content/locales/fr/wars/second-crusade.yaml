"On 24 December 1144 Zengi, atabeg of Mosul and Aleppo, took Edessa, the first of the crusader states. Pope Eugenius III called a new crusade, and Bernard of Clairvaux preached it with great effect, at Vézelay before Louis VII of France in March 1146 and then in Germany, where King Conrad III took the cross at Christmas. Other crusaders were sent against the Moors in Iberia, where they helped take Lisbon in October 1147, and against the pagan Wends on the Baltic.": "Le 24 décembre 1144, Zengi, atabeg de Mossoul et d’Alep, prend Edessa, le premier des états croisés. Le pape Eugenius III appelle une nouvelle croisade, et Bernard de Clairvaux la prêche avec grand effet, à Vézelay avant Louis VII de France en mars 1146, puis en Allemagne, où le roi Conrad III prend la croix à Noël. D’autres croisés ont été envoyés contre les Maures d’Iberia, où ils ont aidé à prendre Lisbonne en octobre 1147, et contre les Wends païens sur la Baltique."
"Conrad left in May 1147 with a large German army, marched through Hungary and the Byzantine Balkans, plundering as he went, and crossed to Asia in September without waiting for the French. The emperor Manuel I, who had just made a truce with the Seljuks of Rum, advised him to keep to the coast road. Instead Conrad struck across the plateau towards Iconium. Near Dorylaeum, on 25 October 1147, short of food and water, his army was attacked by Turkish horse archers and destroyed. Conrad, wounded, led the remnant back to Nicaea.": "Conrad partit en mai 1147 avec une grande armée allemande, marcha à travers la Hongrie et les Balkans byzantins, pillant pendant qu’il allait, et passa en Asie en septembre sans attendre les Français. L’empereur Manuel Ier, qui venait de faire une trêve avec les Seljuks de Rum, lui conseilla de garder la route côtière. Près de Dorylaeum, le 25 octobre 1147, à court de nourriture et d’eau, son armée fut attaquée par des archers turcs et détruite. Conrad, blessé, ramena le reste à Nicée."
