"Louis VII reached Constantinople in October 1147 and crossed to Asia, where he met the survivors of Conrad’s army near Nicaea. The French took the longer road along the coast by way of Pergamon and Smyrna to Ephesus, where Conrad, ill, turned back to Constantinople; he later sailed to the Holy Land. Turning inland up the Meander valley at the end of December, the French beat off Turkish attacks and forced a crossing of the river.": "Louis VII atteignit Constantinople en octobre 1147 et traversa l’Asie où il rencontra les survivants de l’armée de Conrad, près de Nicée. Les Français prirent la route plus longue le long de la côte par Pergamon et Smyrne à Ephèse, où Conrad, malade, retourna à Constantinople ; il partit ensuite en Terre Sainte. Vers la fin du mois de décembre, à l’intérieur de la vallée de Meander, les Français ont battu les attaques turques et forcé une traversée du fleuve."
"On 6 January 1148, as the army crossed Mount Cadmus east of Laodicea, the vanguard pushed on too far, against orders, and the Turks fell on the strung-out column. Louis himself barely escaped, and many were killed. The army reached the Byzantine port of Attaleia in late January, starving. There were not enough ships for everyone, and in March Louis sailed for Antioch with his knights, leaving most of the foot soldiers and pilgrims to march overland. Most of them died or were captured, though some, Odo of Deuil wrote, were fed and helped by the Turks.": "Le 6 janvier 1148, alors que l’armée traversait le mont Cadmus à l’est de Laodicée, l’avant-garde poussa trop loin, contre les ordres, et les Turcs tombèrent sur la colonne en panne. Louis lui-même s’échappa à peine, et beaucoup furent tués. L’armée atteignit le port byzantin d’Ataleia fin janvier, affamée. Il n’y avait pas assez de navires pour tout le monde, et en mars Louis navigua pour Antioche avec ses chevaliers, laissant la plupart des soldats et pèlerins marcher sur terre. La plupart d’entre eux moururent ou furent capturés, bien que certains, écrit Odo de Deuil, furent nourris et aidés par les Turcs."
