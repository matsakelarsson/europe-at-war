"At Antioch Prince Raymond, uncle of Louis’s queen Eleanor of Aquitaine, urged an attack on Aleppo, now ruled by Zengi’s son Nur al-Din. Louis refused and, after a quarrel with Eleanor, went on to Jerusalem. On 24 June 1148 a great council near Acre, with Louis, Conrad, the young King Baldwin III and the barons of the kingdom, decided to attack Damascus, the largest Muslim city near the kingdom, although its ruler, Unur, had been the Franks’ ally against Zengi.": "À Antioche, le prince Raymond, oncle de la reine Louis-Eléanor d’Aquitaine, exhorta une attaque contre Alep, maintenant gouverné par le fils Zengi. Louis refusa et, après une querelle avec Eléanor, alla à Jérusalem. Le 24 juin 1148, un grand concile près d’Acre, avec Louis, Conrad, le jeune roi Baldwin III et les barons du royaume, décida d’attaquer Damas, la plus grande ville musulmane près du royaume, bien que son chef, Unur, eût été l’allié des Francs contre Zengi."
"The crusaders reached Damascus on 24 July and advanced through the orchards west of the city, where they had water and timber but were harried from the walls and gardens. On 27 July they moved to the open plain on the eastern side, where the walls were weaker but there was no water. As Nur al-Din’s army approached and the leaders quarrelled over who should have the city, they gave up the siege on 28 July. The crusade ended in failure and mutual blame, and in 1154 Nur al-Din took Damascus, uniting Muslim Syria against the Franks.": "Les croisés arrivèrent à Damas le 24 juillet et passèrent par les vergers à l’ouest de la ville, où ils avaient de l’eau et du bois, mais ils furent chassés des murs et des jardins. Le 27 juillet, ils se dirigèrent vers la plaine ouverte du côté oriental, où les murs étaient plus faibles mais il n’y avait pas d’eau. La croisade s’est terminée par un échec et une faute mutuelle, et en 1154 Nur al-Din a pris Damas, unissant la Syrie musulmane contre les Francs."
