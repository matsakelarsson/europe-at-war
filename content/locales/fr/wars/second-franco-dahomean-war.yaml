# French translations of the catalogue text (wave 13); step bodies follow later.
Second Franco-Dahomean War: Seconde guerre du Dahomey
? The French conquest of the Kingdom of Dahomey, in what is now southern Benin. After the war of 1890 both sides rearmed. When Dahomey resumed its raids in the Ouémé valley, claimed by France for its protectorate of Porto-Novo, and fired on a French gunboat, France sent Colonel Alfred-Amédée Dodds with about 2,000 soldiers, Foreign Legionnaires, marines and West African tirailleurs armed with the new Lebel rifle. Advancing up the Ouémé river and then west towards Abomey from August 1892, his column fought its way through a series of battles at Dogba, Poguessa, Adégon, Akpa, Cotopa and Cana against King Béhanzin’s army, in which Dahomey’s women soldiers, the Agojie, called Amazons by Europeans, fought in the front line and suffered terrible losses to French rifles and bayonets. On 17 November 1892 the French entered Abomey, which Béhanzin had set on fire and abandoned. He fought on from the north for more than a year, until the French made his brother Agoli-Agbo king and he surrendered in January 1894. Béhanzin died in exile in 1906; Dahomey became a French colony, and the monarchy was abolished in 1900.
: "La conquête française du royaume du Dahomey, dans l’actuel sud du Bénin. Après la guerre de 1890, les deux camps réarmèrent. Lorsque le Dahomey reprit ses raids dans la vallée de l’Ouémé, revendiquée par la France pour son protectorat de Porto-Novo, et tira sur une canonnière française, la France envoya le colonel Alfred-Amédée Dodds avec environ 2 000 soldats : légionnaires, troupes de marine et tirailleurs ouest-africains, armés du nouveau fusil Lebel. Remontant l’Ouémé, puis marchant vers l’ouest en direction d’Abomey à partir d’août 1892, sa colonne se fraya un chemin au fil d’une série de batailles, à Dogba, Poguessa, Adégon, Akpa, Cotopa et Cana, contre l’armée du roi Béhanzin, dans laquelle les femmes soldats du Dahomey, les Agojie, que les Européens appelaient Amazones, combattaient en première ligne ; elles subirent des pertes terribles sous les fusils et les baïonnettes français. Le 17 novembre 1892, les Français entrèrent dans Abomey, que Béhanzin avait incendiée et abandonnée. Il poursuivit la lutte depuis le nord pendant plus d’un an, jusqu’à ce que les Français fassent roi son frère Agoli-Agbo et qu’il se rende en janvier 1894. Béhanzin mourut en exil en 1906 ; le Dahomey devint une colonie française, et la monarchie fut abolie en 1900."
