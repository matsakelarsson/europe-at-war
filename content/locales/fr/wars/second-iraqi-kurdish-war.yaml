# French translations of the catalogue text (wave 7); step bodies follow later.
Second Iraqi–Kurdish War: Seconde guerre kurdo-irakienne
The renewed war between the Ba’athist government of Iraq and the Kurdish rebels of Mustafa Barzani’s Kurdistan Democratic Party (KDP). In March 1974 Baghdad imposed its own autonomy law, which left oil-rich Kirkuk outside the Kurdish region, and the KDP rejected it. The Iraqi army, rebuilt with Soviet weapons, attacked in strength, while the Kurds were supplied by Iran, Israel and, secretly, the United States, and Iranian artillery and troops fought across the border. Iraqi bombing of Qala Diza in April 1974 killed more than a hundred civilians. The war ended suddenly when Iraq and Iran signed the Algiers Agreement on 6 March 1975, in which Iraq accepted the middle of the Shatt al-Arab as the border, and the Shah cut off all aid to the Kurds. The revolt collapsed within weeks. Barzani went into exile, more than 100,000 Kurds fled to Iran, and the government razed villages along the borders and moved Arabs into Kirkuk. Jalal Talabani founded the Patriotic Union of Kurdistan (PUK) in exile in June 1975.: La reprise de la guerre entre le gouvernement baasiste d’Irak et les rebelles kurdes du Parti démocratique du Kurdistan (PDK) de Moustafa Barzani. En mars 1974, Bagdad imposa sa propre loi d’autonomie, qui laissait Kirkouk, riche en pétrole, en dehors de la région kurde, et le PDK la rejeta. L’armée irakienne, reconstruite avec des armes soviétiques, attaqua en force, tandis que les Kurdes étaient ravitaillés par l’Iran, Israël et, en secret, les États-Unis, et que l’artillerie et des troupes iraniennes combattaient au-delà de la frontière. Le bombardement irakien de Qala Diza, en avril 1974, tua plus d’une centaine de civils. La guerre prit fin brusquement lorsque l’Irak et l’Iran signèrent l’accord d’Alger, le 6 mars 1975, par lequel l’Irak acceptait le milieu du Chatt al-Arab comme frontière, et le shah coupa toute aide aux Kurdes. La révolte s’effondra en quelques semaines. Barzani partit en exil, plus de 100 000 Kurdes s’enfuirent en Iran, et le gouvernement rasa des villages le long des frontières et installa des Arabes à Kirkouk. Jalal Talabani fonda l’Union patriotique du Kurdistan (UPK) en exil en juin 1975.
