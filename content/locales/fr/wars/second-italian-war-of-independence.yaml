"April – June 1859": "avril – juin 1859"
"In July 1858, at Plombières, the French emperor Napoleon III secretly promised Count Camillo Cavour, Sardinia’s prime minister, to help drive Austria out of northern Italy in return for Savoy and Nice, provided Austria could be made to look the aggressor. Sardinia mobilised and enrolled volunteers from all over Italy, and on 23 April 1859 Austria demanded that it disarm. When Sardinia refused, Austria declared war, and on 29 April General Ferenc Gyulai’s army crossed the Ticino into Piedmont. He advanced slowly through flooded country, while French troops arrived by rail over the Alps and by sea at Genoa.": "En juillet 1858, à Plombières, l’empereur français Napoléon III a secrètement promis au comte Camillo Cavour, Premier ministre de la Sardaigne, d’aider à chasser l’Autriche du nord de l’Italie en échange de Savoie et de Nice, pourvu que l’Autriche puisse regarder l’agresseur. La Sardaigne mobilisa et enregistra des volontaires de toute l’Italie, et le 23 avril 1859, l’Autriche exigeait qu’elle désarme. Lorsque la Sardaigne refusa, l’Autriche déclara la guerre et le 29 avril, l’armée du général Ferenc Gyulai traversa le Tessin au Piémont. Il progressa lentement dans un pays inondé, tandis que les troupes françaises arrivèrent par rail sur les Alpes et par mer à Gênes."
"After clashes at Montebello on 20 May and Palestro on 30–31 May the allies swung north and crossed the Ticino, while Giuseppe Garibaldi’s volunteers, the Hunters of the Alps, beat the Austrians at Varese and San Fermo near Como. On 4 June the French under Napoleon III and General Patrice de MacMahon defeated Gyulai at Magenta, and on 8 June Napoleon and King Victor Emmanuel II rode into Milan. The Austrians fell back east towards the fortresses of the Quadrilateral, and risings drove out the rulers of Tuscany, Parma and Modena and the Papal governors of the Romagna.": "Après des affrontements à Montebello le 20 mai et à Palestro les 30 et 31 mai, les alliés ont balayé vers le nord et traversé le Tessin, tandis que Giuseppe Garibaldi's, volontaires, les Chasseurs des Alpes, battaient les Autrichiens à Varese et San Fermo près de Côme. Le 4 juin, les Français sous Napoléon III et le général Patrice de MacMahon défont Gyulai à Magenta, et le 8 juin, Napoléon et le roi Victor Emmanuel II montèrent à Milan. Les Autrichiens retournèrent vers l’est en direction des forteresses du Quadrilatéral, et des montées chassaient les dirigeants de la Toscane, du Parme et de Modène et les gouverneurs pontificaux de la Romagne."
