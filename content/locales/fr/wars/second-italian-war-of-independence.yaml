"Shaken by the slaughter, by the strength of the Austrian fortresses and by Prussia’s mobilisation on the Rhine, Napoleon III proposed an armistice without consulting his ally and met Francis Joseph at Villafranca on 11 July. Austria would cede Lombardy, without Mantua and Peschiera, to France, which would hand it to Sardinia, and the rulers of Tuscany and Modena were to return to their thrones. Cavour, furious, resigned. The Treaty of Zürich confirmed the terms on 10 November 1859.": "Baptisé par le massacre, par la force des forteresses autrichiennes et par la mobilisation de la Prusse sur le Rhin, Napoléon III propose un armistice sans consulter son allié et rencontre François Joseph à Villafranca le 11 juillet. L’Autriche cèdera la Lombardie, sans Mantua et Peschiera, à la France qui la remettra en Sardaigne, et les dirigeants de Toscane et Modène retourneront sur leurs trônes. Cavour, furieux, démissionna. Le traité de Zurich confirma les termes le 10 novembre 1859."
"The restorations never happened. Assemblies in Tuscany, Parma, Modena and the Romagna voted to join Sardinia, and after plebiscites in March 1860, held under Cavour, now back in office, they were annexed. In return, by the Treaty of Turin of 24 March 1860, Sardinia ceded Savoy and Nice to France, which plebiscites confirmed in April. Garibaldi, who had been born in Nice, never forgave Cavour. The pope excommunicated those who had taken part in seizing the Romagna.": "Les restaurations n’ont jamais eu lieu. Les assemblées en Toscane, Parme, Modène et la Romagne ont voté pour rejoindre la Sardaigne, et après des plébiscites en mars 1860, tenues sous Cavour, maintenant de retour en fonction, ils ont été annexés. En contrepartie, par le traité de Turin du 24 mars 1860, la Sardaigne a cédé Savoie et Nice à la France, que les plébiscites ont confirmé en avril. Garibaldi, né à Nice, n’a jamais pardonné Cavour. Le pape excommunia ceux qui avaient pris part à la saisie de la Romagne."
