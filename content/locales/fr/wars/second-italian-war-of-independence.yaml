"Second Italian War of Independence": "Deuxième guerre d’indépendance italienne"
"A war in 1859 in which France under Napoleon III and the Kingdom of Sardinia defeated Austria at Magenta and Solferino. By the armistice of Villafranca and the Treaty of Zürich Austria gave up Lombardy, which passed to Sardinia; Tuscany, Parma, Modena and the Papal Romagna then voted to join Sardinia, and in 1860 Sardinia ceded Savoy and Nice to France.": "Une guerre en 1859 dans laquelle la France sous Napoléon III et le Royaume de Sardaigne ont vaincu l’Autriche à Magenta et Solferino. Par l’armistice de Villafranca et le traité de Zurich Autriche a renoncé à la Lombardie, qui est passée à la Sardaigne ; Toscane, Parme, Modène et la Romagne papale ont ensuite voté pour rejoindre la Sardaigne, et en 1860 la Sardaigne a cédé Savoie et Nice à la France."
"Also called the Franco-Austrian War, the Austro-Sardinian War or the Italian War of 1859. Austria declared war on 27 April and its troops crossed the Ticino on 29 April.": "Aussi appelé la guerre franco-autrichienne, la guerre austro-sardine ou la guerre italienne de 1859. L’Autriche a déclaré la guerre le 27 avril et ses troupes ont traversé le Tessin le 29 avril."
