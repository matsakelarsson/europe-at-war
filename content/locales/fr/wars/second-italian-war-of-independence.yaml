"24 June 1859": "24 juin 1859"
"Emperor Francis Joseph took command of the Austrian army himself and on 23 June led it back across the Mincio, meeting the advancing allies the next morning in the hills south of Lake Garda. Together the armies had well over a quarter of a million men, and all three were led by their monarchs. The French stormed the hill and tower of Solferino in the centre after hours of fighting, while the Sardinians fought all day for the heights of San Martino to the north. In the afternoon a violent storm broke over the battlefield, and the Austrians withdrew across the Mincio.": "L’empereur François Joseph prit lui-même le commandement de l’armée autrichienne et, le 23 juin, il la conduisit à travers le Mincio, rencontrant les alliés avançants le lendemain matin dans les collines au sud du lac de Garde. Ensemble, les armées avaient plus d’un quart de million d’hommes, et les trois étaient dirigés par leurs monarques. Les Français ont pris la montagne et la tour de Solferino dans le centre après des heures de combats, tandis que les sardes se battaient toute la journée pour les hauteurs de San Martino au nord. L’après-midi une violente tempête a éclaté sur le champ de bataille, et les Autrichiens se sont retirés à travers le Mincio."
"Nearly 40,000 men were killed, wounded or missing. Thousands of wounded lay for days without care in Castiglione delle Stiviere and the villages around, where a Swiss businessman, Henri Dunant, organised help from the townspeople. His book A Memory of Solferino, published in 1862, led to the founding of the International Committee of the Red Cross in 1863 and the first Geneva Convention in 1864. The Austrians held the Quadrilateral, and the war seemed likely to go on.": "Près de 40 000 hommes ont été tués, blessés ou portés disparus. Des milliers de blessés sont restés sans soins pendant des jours à Castiglione delle Stiviere et dans les villages, où un homme d’affaires suisse, Henri Dunant, a organisé l’aide des citadins. Son livre A Memory of Solferino, publié en 1862, a conduit à la fondation du Comité international de la Croix-Rouge en 1863 et à la première Convention de Genève en 1864. Les Autrichiens tenaient le Quadrilatéral, et la guerre semblait susceptible de se poursuivre."
