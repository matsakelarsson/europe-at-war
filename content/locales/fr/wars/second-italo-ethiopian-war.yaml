# Some French text was translated automatically.
"Second Italo-Ethiopian War": "Deuxième guerre italo-éthiopienne"
"Fascist Italy’s invasion of Ethiopia, a member of the League of Nations, from its colonies of Eritrea and Italian Somaliland in October 1935. With overwhelming superiority in aircraft, armour and artillery, and the use of mustard gas against soldiers and civilians in breach of the Geneva Protocol, the Italian armies under Pietro Badoglio and Rodolfo Graziani defeated the Ethiopian forces, and Addis Ababa fell on 5 May 1936. Emperor Haile Selassie went into exile and appealed in vain to the League, whose sanctions against Italy had been limited and soon lifted; Ethiopia was joined to Eritrea and Somalia as Italian East Africa, and resistance continued until British and Ethiopian forces liberated the country in 1941.": "L’invasion fasciste de l’Éthiopie, membre de la Société des Nations, de ses colonies d’Erythrée et du Somaliland italien en octobre 1935. Avec une supériorité écrasante dans les avions, les armures et l’artillerie, et l’utilisation de gaz moutarde contre les soldats et les civils en violation du Protocole de Genève, les armées italiennes sous Pietro Badoglio et Rodolfo Graziani ont vaincu les forces éthiopiennes, et Addis-Abeba est tombé le 5 mai 1936. L’empereur Haile Selassie s’exila et fit appel en vain à la Ligue, dont les sanctions contre l’Italie avaient été limitées et bientôt levées ; l’Éthiopie fut rejointe par l’Érythrée et la Somalie en tant qu’Afrique orientale italienne, et la résistance se poursuivit jusqu’à ce que les forces britanniques et éthiopiennes libèrent le pays en 1941."
"The fighting took place in East Africa, outside the map. Estimates of Ethiopian deaths run from about 70,000 soldiers killed to 250,000–270,000 deaths in all, civilians included; Italian figures give about 8,200 killed.": "Les combats ont eu lieu en Afrique de l’Est, en dehors de la carte. Selon les estimations, le nombre de morts éthiopiennes est passé d’environ 70 000 soldats tués à 250 000 à 270 000 morts en tout, y compris des civils ; les chiffres italiens donnent environ 8 200 morts."
