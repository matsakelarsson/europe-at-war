Second Italo-Ethiopian War: Deuxième guerre italo-éthiopienne
Second Italo-Ethiopian War (Wikipedia): Deuxième guerre italo-éthiopienne (Wikipédia)
Italy: Italie
Ethiopia: Éthiopie
? Fascist Italy’s conquest of Ethiopia, a member of the League of Nations. After a clash at the wells of Walwal in the Ogaden in December 1934, Italy invaded from Eritrea and Italian Somaliland on 3 October 1935 without a declaration of war. The League named Italy the aggressor but its sanctions left out oil and the Suez Canal. With far more aircraft, artillery and motor transport, and with mustard gas dropped from the air on soldiers and civilians in breach of the Geneva Protocol, the armies of Pietro Badoglio in the north and Rodolfo Graziani in the south destroyed the Ethiopian armies at Amba Aradam, Tembien, Shire and Maychew and in the Ogaden in the first months of 1936. Emperor Haile Selassie left for exile on 2 May, Badoglio entered Addis Ababa on 5 May, and on 9 May Mussolini proclaimed Ethiopia part of the Italian empire, joined with Eritrea and Somalia as Italian East Africa. Ethiopian armies and nobles fought on in the west and south until their last forces were destroyed in February 1937. On 19 February 1937, after an attempt on Graziani’s life, Italians killed thousands of people in Addis Ababa in three days of reprisals, remembered as Yekatit 12. Estimates of Ethiopian deaths in the war run from about 70,000 soldiers killed (an Italian estimate) to 275,000 killed in battle by the Ethiopian government’s count; Italian and colonial troops lost some 8,000–9,000 killed. Resistance continued until 1941 (see Ethiopian resistance to Italian rule and the East African campaign).
: La conquête de l’Éthiopie, membre de la Société des Nations, par l’Italie fasciste. Après un affrontement aux puits de Walwal, dans l’Ogaden, en décembre 1934, l’Italie envahit le pays depuis l’Érythrée et la Somalie italienne le 3 octobre 1935, sans déclaration de guerre. La SDN désigna l’Italie comme agresseur, mais ses sanctions épargnaient le pétrole et le canal de Suez. Disposant de beaucoup plus d’avions, d’artillerie et de véhicules à moteur, et larguant du gaz moutarde sur les soldats et les civils en violation du protocole de Genève, les armées de Pietro Badoglio au nord et de Rodolfo Graziani au sud anéantirent les armées éthiopiennes à l’Amba Aradam, au Tembien, à Shire et à Maychew, ainsi que dans l’Ogaden, au cours des premiers mois de 1936. L’empereur Hailé Sélassié partit en exil le 2 mai, Badoglio entra dans Addis-Abeba le 5 mai et, le 9 mai, Mussolini proclama l’Éthiopie partie intégrante de l’empire italien, réunie à l’Érythrée et à la Somalie sous le nom d’Afrique orientale italienne. Des armées et des nobles éthiopiens poursuivirent le combat dans l’ouest et le sud jusqu’à la destruction de leurs dernières forces en février 1937. Le 19 février 1937, après un attentat contre Graziani, des Italiens tuèrent des milliers de personnes à Addis-Abeba au cours de trois jours de représailles, restés dans les mémoires sous le nom de Yekatit 12. Les estimations des pertes éthiopiennes dans la guerre vont d’environ 70 000 soldats tués (estimation italienne) à 275 000 tués au combat selon le gouvernement éthiopien ; les troupes italiennes et coloniales perdirent quelque 8 000–9 000 tués. La résistance se poursuivit jusqu’en 1941 (voir Résistance éthiopienne à la domination italienne et Campagne d’Afrique de l’Est).
