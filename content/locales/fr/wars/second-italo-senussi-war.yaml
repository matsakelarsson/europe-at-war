# French translations of the catalogue text (wave 12); step bodies follow later.
Italian reconquest of Libya: Reconquête italienne de la Libye
? The war in which Fascist Italy reconquered Libya, which it had invaded in 1911 but held only along the coast after 1915. Also called the Second Italo-Senussi War and, in Italy, the “pacification” of Libya. From 1922 Italian columns with aircraft and motor transport retook Tripolitania, the Sirtica and in 1929–1930 the Fezzan, while in Cyrenaica the guerrilla bands of the Senussi order, led by the elderly sheikh Omar al-Mukhtar, held out in the Jebel Akhdar with the support of the population. In 1930 General Rodolfo Graziani had the people of the Jebel and the plateau, some 100,000 men, women and children, marched into concentration camps on the coast, where about 40,000 of them died; their herds were destroyed, a barbed-wire fence was built along the Egyptian border to cut off supplies, and in January 1931 the Senussi oasis of Kufra was taken. Omar al-Mukhtar was captured in September 1931 and hanged before thousands of internees, and Italy declared the war over in January 1932. Estimates of the Libyan dead range from about 20,000 to 100,000; perhaps a quarter of the people of Cyrenaica died.
: La guerre par laquelle l’Italie fasciste reconquit la Libye, qu’elle avait envahie en 1911 mais dont elle ne tenait plus que la côte après 1915. Elle est appelée aussi seconde guerre italo-senoussie et, en Italie, « pacification » de la Libye. À partir de 1922, des colonnes italiennes appuyées par l’aviation et des transports motorisés reprirent la Tripolitaine, la Syrtique et, en 1929–1930, le Fezzan, tandis qu’en Cyrénaïque les bandes de guérilla de la confrérie senoussie, menées par le vieux cheikh Omar al-Mokhtar, tenaient le Djebel Akhdar avec le soutien de la population. En 1930, le général Rodolfo Graziani fit conduire à pied la population du Djebel et du plateau, quelque 100 000 hommes, femmes et enfants, jusqu’à des camps de concentration sur la côte, où environ 40 000 d’entre eux moururent ; leurs troupeaux furent détruits, une clôture de barbelés fut construite le long de la frontière égyptienne pour couper les approvisionnements et, en janvier 1931, l’oasis senoussie de Koufra fut prise. Omar al-Mokhtar fut capturé en septembre 1931 et pendu devant des milliers d’internés, et l’Italie déclara la guerre terminée en janvier 1932. Les estimations du nombre de morts libyens vont d’environ 20 000 à 100 000 ; peut-être un quart de la population de la Cyrénaïque périt.
