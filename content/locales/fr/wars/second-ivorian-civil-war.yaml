# French translations of the catalogue text (wave 13); step bodies follow later.
Second Ivorian Civil War: Seconde guerre civile ivoirienne
? The war that followed Côte d’Ivoire’s disputed presidential election of 2010. After the run-off of 28 November 2010 the electoral commission declared Alassane Ouattara the winner, and the United Nations, which had certified the vote, the African Union and ECOWAS recognised him; but the Constitutional Council, headed by an ally of the incumbent, Laurent Gbagbo, annulled results from the north and declared Gbagbo re-elected. Both men were sworn in. Ouattara’s government sat in the Golf Hotel in Abidjan under UN protection while fighting spread in the city’s northern suburbs and in the west. In late March 2011 the former rebels of the north, now the Republican Forces of Côte d’Ivoire (FRCI), swept south to Yamoussoukro, San-Pédro and Abidjan; at Duékoué hundreds of civilians were massacred. After UN and French helicopters destroyed Gbagbo’s heavy weapons, the FRCI captured him in his residence on 11 April 2011. About 3,000 people were killed and more than a million displaced; Gbagbo was tried at the International Criminal Court and acquitted.
: La guerre qui suivit l’élection présidentielle contestée de 2010 en Côte d’Ivoire. Après le second tour du 28 novembre 2010, la commission électorale proclama Alassane Ouattara vainqueur, et les Nations unies, qui avaient certifié le scrutin, l’Union africaine et la CEDEAO le reconnurent ; mais le Conseil constitutionnel, présidé par un allié du président sortant, Laurent Gbagbo, annula les résultats du nord et proclama Gbagbo réélu. Les deux hommes prêtèrent serment. Le gouvernement de Ouattara siégeait à l’hôtel du Golf, à Abidjan, sous la protection de l’ONU, tandis que les combats s’étendaient aux quartiers nord de la ville et à l’ouest du pays. Fin mars 2011, les anciens rebelles du nord, devenus les Forces républicaines de Côte d’Ivoire (FRCI), déferlèrent vers le sud jusqu’à Yamoussoukro, San-Pédro et Abidjan ; à Duékoué, des centaines de civils furent massacrés. Après la destruction des armes lourdes de Gbagbo par des hélicoptères de l’ONU et de la France, les FRCI le capturèrent dans sa résidence le 11 avril 2011. Environ 3 000 personnes furent tuées et plus d’un million déplacées ; Gbagbo fut jugé par la Cour pénale internationale et acquitté.
