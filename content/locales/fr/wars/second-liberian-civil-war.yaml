# French translations of the catalogue text (wave 13); step bodies follow later.
Second Liberian Civil War: Seconde guerre civile libérienne
? The war against President Charles Taylor’s government by two rebel movements, Liberians United for Reconciliation and Democracy (LURD), which attacked from Guinea from 1999, and the Movement for Democracy in Liberia (MODEL), which entered from Côte d’Ivoire in 2003. LURD fought its way through Lofa County to the outskirts of Monrovia by 2002, while United Nations sanctions punished Taylor for arming Sierra Leone’s RUF; in 2003 MODEL took the south-east and LURD besieged the capital in three assaults from June to August, killing hundreds of civilians with mortar fire. On 4 June 2003 the Special Court for Sierra Leone announced its indictment of Taylor for war crimes. A West African force, ECOMIL, landed in August; Taylor resigned on 11 August and went into exile in Nigeria, and the factions signed a comprehensive peace agreement at Accra on 18 August 2003. A United Nations mission, UNMIL, disarmed more than 100,000 fighters, and Ellen Johnson Sirleaf was elected president in 2005. About 50,000 people were killed in the war.
: La guerre menée contre le gouvernement du président Charles Taylor par deux mouvements rebelles, les Libériens unis pour la réconciliation et la démocratie (LURD), qui attaquèrent depuis la Guinée à partir de 1999, et le Mouvement pour la démocratie au Liberia (MODEL), entré depuis la Côte d’Ivoire en 2003. Le LURD se fraya un chemin à travers le comté de Lofa jusqu’aux abords de Monrovia en 2002, tandis que des sanctions des Nations unies punissaient Taylor pour avoir armé le RUF sierra-léonais ; en 2003, le MODEL prit le sud-est et le LURD assiégea la capitale en trois assauts, de juin à août, tuant des centaines de civils par des tirs de mortier. Le 4 juin 2003, le Tribunal spécial pour la Sierra Leone annonça l’inculpation de Taylor pour crimes de guerre. Une force ouest-africaine, l’ECOMIL, débarqua en août ; Taylor démissionna le 11 août et partit en exil au Nigeria, et les factions signèrent un accord de paix global à Accra le 18 août 2003. Une mission des Nations unies, la MINUL, désarma plus de 100 000 combattants, et Ellen Johnson Sirleaf fut élue présidente en 2005. La guerre fit environ 50 000 morts.
