# Some French text was translated automatically.
"Princes’ Revolt and Second Margrave War": "Révolte des princes et seconde guerre des margraves"
"In the spring of 1552 Elector Maurice of Saxony, who had helped Charles V win the Schmalkaldic War, turned against him with other Protestant princes and an alliance with Henry II of France, who occupied the bishoprics of Metz, Toul and Verdun. The rebels nearly captured the Emperor at Innsbruck, and the Peace of Passau in August 1552 freed the imprisoned John Frederick of Saxony and Philip of Hesse and prepared the way for the religious Peace of Augsburg in 1555; Charles’s siege of Metz that winter failed. One of the rebels, Margrave Albert Alcibiades of Brandenburg-Kulmbach, refused the peace and went on plundering Franconia and the Rhineland, extorting land and money from Nuremberg and the bishops of Bamberg and Würzburg. Maurice and Henry of Brunswick-Wolfenbüttel beat him at Sievershausen on 9 July 1553, a battle in which Maurice was killed, and by June 1554 Albert had been driven from Franconia and his lands confiscated.": "Au printemps 1552, l’électeur Maurice de Saxe, qui avait aidé Charles V à remporter la guerre de Schmalkaldic, se retourna contre lui avec d’autres princes protestants et une alliance avec Henri II de France, qui occupait les évêchés de Metz, Toul et Verdun. Les rebelles ont failli capturer l’Empereur à Innsbruck, et la paix de Passau en août 1552 a libéré John Frederick de Saxe et Philippe de Hesse emprisonnés et préparé la voie pour la paix religieuse d’Augsbourg en 1555 ; le siège Charles de Metz cet hiver a échoué. L’un des rebelles, Margrave Albert Alcibiades de Brandebourg-Kulmbach, a refusé la paix et a continué à piller Franconia et la Rhénanie, extorquant des terres et de l’argent de Nuremberg et les évêques de Bamberg et Würzburg. Maurice et Henry de Brunswick-Wolfenbüttel l’ont battu à Sievershausen le 9 juillet 1553, bataille au cours de laquelle Maurice a été tué, et en juin 1554 Albert avait été chassé de Franconie et ses terres confisquées."
"The revolt of 1552 is also called the Second Schmalkaldic War. Albert Alcibiades took part in it before going his own way, and Maurice, who led it, later fought and died against him; the sides above changed in the course of the war.": "La révolte de 1552 est aussi appelée la Seconde Guerre Schmalkaldique. Albert Alcibiades y a pris part avant d’aller à sa façon, et Maurice, qui l’a mené, plus tard a combattu et est mort contre lui ; les côtés ci-dessus ont changé au cours de la guerre."
"France held the Three Bishoprics from 1552, and the Peace of Westphalia confirmed them as French in 1648. Some historians date the end of the Margrave War to 1555, when the confiscation of Albert’s lands was settled.": "La France tient les Trois Bishopriques à partir de 1552, et la Paix de Westphalie les confirme comme Français en 1648. Certains historiens datent de la fin de la guerre de Margrave à 1555, quand la confiscation des terres d’Albert est établie."
