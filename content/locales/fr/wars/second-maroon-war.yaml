# French translations of the catalogue text (wave 14); step bodies follow later.
Second Maroon War: Seconde guerre des Marrons
? "The war of 1795–1796 between the Maroons of Trelawny Town and the colonial government of Jamaica. Trelawny Town (formerly Cudjoe’s Town), in the hills south of Montego Bay, was the largest of the Leeward Maroon towns whose independence the British had recognised in the treaties of 1739 that ended the First Maroon War. In July 1795 two of its men, convicted of stealing pigs, were flogged at Montego Bay by an enslaved man, an insult that brought long grievances over land and over the town’s white superintendent to a head. The governor, Lord Balcarres, who feared that revolutionary ideas from Saint-Domingue and France would spread among the island’s enslaved people, seized six Maroon leaders who came to negotiate, among them Montague James, and in August sent troops against the town. The Maroons burned it and fought from the Cockpit Country, where a few hundred fighters held off some 5,000 soldiers and militia for five months, killing three colonels in ambushes, while the Accompong Maroons fought for the colony and the Windward towns stayed neutral. Major-General George Walpole’s destruction of their provision grounds and the arrival of about 100 hunting dogs and their handlers from Cuba led the Maroons to accept peace in December 1795, on Walpole’s private promise that they would not be sent off the island. Most came in only by March 1796, and Balcarres and the Assembly used the delay to deport them: in June 1796 between 550 and 600 Trelawny Town Maroons were shipped to Nova Scotia, and in 1800 most of them went on to Sierra Leone. Walpole resigned in protest."
: "La guerre de 1795–1796 entre les Marrons de Trelawny Town et le gouvernement colonial de la Jamaïque. Trelawny Town (anciennement Cudjoe’s Town), dans les collines au sud de Montego Bay, était la plus grande des villes des Marrons sous le Vent dont les Britanniques avaient reconnu l’indépendance par les traités de 1739 qui mirent fin à la première guerre des Marrons. En juillet 1795, deux de ses hommes, condamnés pour vol de porcs, furent fouettés à Montego Bay par un esclave, un affront qui fit éclater de vieux griefs sur les terres et sur le surintendant blanc de la ville. Le gouverneur, Lord Balcarres, qui craignait que les idées révolutionnaires venues de Saint-Domingue et de France ne se répandent parmi les esclaves de l’île, fit arrêter six chefs marrons venus négocier, parmi lesquels Montague James, et envoya en août des troupes contre la ville. Les Marrons l’incendièrent et combattirent depuis le Cockpit Country, où quelques centaines de combattants tinrent en échec quelque 5 000 soldats et miliciens pendant cinq mois, tuant trois colonels dans des embuscades, tandis que les Marrons d’Accompong combattaient pour la colonie et que les villes des Marrons du Vent restaient neutres. La destruction de leurs cultures vivrières par le major général George Walpole et l’arrivée de Cuba d’une centaine de chiens de chasse et de leurs maîtres-chiens amenèrent les Marrons à accepter la paix en décembre 1795, sur la promesse privée de Walpole qu’ils ne seraient pas envoyés hors de l’île. La plupart ne se rendirent qu’en mars 1796, et Balcarres et l’Assemblée profitèrent de ce retard pour les déporter : en juin 1796, entre 550 et 600 Marrons de Trelawny Town furent embarqués pour la Nouvelle-Écosse, et en 1800 la plupart d’entre eux repartirent pour la Sierra Leone. Walpole démissionna en signe de protestation."
