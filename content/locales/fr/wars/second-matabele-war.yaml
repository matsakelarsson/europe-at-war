# French translations of the catalogue text (wave 13); step bodies follow later.
Second Matabele War (First Chimurenga): Seconde guerre matabélé (première Chimurenga)
? The armed rising of the Ndebele and of many Shona chiefdoms against the British South Africa Company’s rule in what is now Zimbabwe, called in Zimbabwe the First Chimurenga (“war of liberation”). Three years after the conquest of the Ndebele kingdom, people had lost much of their land and almost all their cattle, were forced to work for settlers and beaten by the company’s African police, and were then struck by drought, locusts and the cattle plague rinderpest. When most of the company’s armed police were captured in the Jameson Raid on the Transvaal, the Ndebele rose in March 1896, killing settlers across Matabeleland and besieging Bulawayo; in June the Shona of Mashonaland, whom the settlers had thought friendly, rose too. Priests of the Mwari shrines such as Mkwati and spirit mediums such as Nehanda and Kaguvi helped to bind the risings together. Imperial troops relieved Bulawayo; Cecil Rhodes ended the Ndebele war by negotiating with the izinDuna in the Matobo Hills in August–October 1896, while in Mashonaland the company dynamited the caves of the chiefs one by one until late 1897. About one in ten of the settlers in the country was killed; African deaths, in battle, in executions and from the hunger that followed, were far higher and were never counted.
: Le soulèvement armé des Ndébélés et de nombreuses chefferies shona contre la domination de la British South Africa Company dans l’actuel Zimbabwe, appelé au Zimbabwe la première Chimurenga (« guerre de libération »). Trois ans après la conquête du royaume ndébélé, la population avait perdu une grande partie de ses terres et presque tout son bétail, était contrainte de travailler pour les colons et battue par la police africaine de la compagnie, puis elle fut frappée par la sécheresse, les criquets et la peste bovine. Lorsque la plus grande partie de la police armée de la compagnie fut capturée lors du raid Jameson contre le Transvaal, les Ndébélés se soulevèrent en mars 1896, tuant des colons dans tout le Matabeleland et assiégeant Bulawayo ; en juin, les Shona du Mashonaland, que les colons croyaient amicaux, se soulevèrent à leur tour. Des prêtres des sanctuaires de Mwari comme Mkwati et des médiums des esprits comme Nehanda et Kaguvi contribuèrent à unir les soulèvements. Des troupes impériales dégagèrent Bulawayo ; Cecil Rhodes mit fin à la guerre ndébélé en négociant avec les izinDuna dans les monts Matobo en août–octobre 1896, tandis qu’au Mashonaland la compagnie fit sauter à la dynamite, l’une après l’autre, les grottes des chefs jusqu’à la fin de 1897. Environ un colon sur dix dans le pays fut tué ; les morts africains, au combat, lors d’exécutions et du fait de la famine qui suivit, furent bien plus nombreux et ne furent jamais comptés.
