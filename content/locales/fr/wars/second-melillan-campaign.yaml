"Second Melillan campaign": "Deuxième campagne Melillan"
"A war between Spain and the Rifian tribes around Melilla in 1909, set off by a tribal attack on Spanish workers building a railway to iron mines in the Rif on 9 July. The government called up reservists, many of them working men with families, and the departure of troops from Barcelona set off the rising known as the Tragic Week. In Morocco a Spanish column suffered heavy losses at the Barranco del Lobo on 27 July, but reinforced to some 35,000–40,000 men the army took Mount Gurugú and the country south of Melilla by the end of the year.": "Une guerre entre l’Espagne et les tribus rifiennes autour de Melilla en 1909, déclenchée par une attaque tribale contre des ouvriers espagnols construisant un chemin de fer pour les mines de fer dans le Rif le 9 juillet. Le gouvernement a appelé des réservistes, dont beaucoup travaillent avec des familles, et le départ des troupes de Barcelone a déclenché la montée connue sous le nom de Semaine Tragique. Au Maroc, une colonne espagnole a subi de lourdes pertes au Barranco del Lobo le 27 juillet, mais l’armée a renforcé à environ 35 000-40 000 hommes le mont Gurugú et le pays au sud de Melilla à la fin de l’année."
"The Tragic Week in Barcelona, from 26 July to 2 August 1909, began as a general strike against the call-up and turned into riots in which dozens of churches and convents were burned; over 100 people were killed, and the anarchist educator Francesc Ferrer was executed afterwards, which caused protests across Europe.": "La Semaine Tragique de Barcelone, du 26 juillet au 2 août 1909, a commencé par une grève générale contre l’appel et s’est transformée en émeutes dans lesquelles des dizaines d’églises et de couvents ont été brûlés ; plus de 100 personnes ont été tuées, et l’éducateur anarchiste Francesc Ferrer a été exécuté par la suite, ce qui a provoqué des manifestations à travers l’Europe."
