"The drone war in the south": "La guerre des drones dans le sud"
"27 September – 7 November 2020": "27 septembre – 7 novembre 2020"
"Talks under the OSCE Minsk Group had brought no settlement since 1994, and the fortified ceasefire line had flared up several times, most seriously in April 2016. On 27 September 2020 heavy fighting broke out along the whole line. Each side blamed the other, but Azerbaijan, with strong political and military backing from Turkey, quickly went over to a large offensive. Turkish Bayraktar TB2 drones and Israeli-made loitering munitions destroyed Armenian air defences, tanks and artillery, and Azerbaijan published the videos. There were reports, denied by Azerbaijan and Turkey, that Syrian fighters had been recruited for the war.": "Les pourparlers menés dans le cadre du Groupe de Minsk de l’OSCE n’ont pas abouti à un règlement depuis 1994, et la ligne de cessez-le-feu fortifiée s’est multipliée plusieurs fois, le plus sérieusement en avril 2016. Le 27 septembre 2020, de violents combats ont éclaté le long de toute la ligne. Des drones turcs du Bayraktar TB2 et des munitions de hiboux fabriquées par Israël ont détruit les défenses aériennes, les chars et l’artillerie arméniennes, et l’Azerbaïdjan a publié les vidéos."
"The main advance came in the open country of the south, along the Iranian border. Azerbaijani forces announced the capture of Jabrayil on 9 October, Fuzuli on 17 October, Zangilan on 20 October and Qubadli on 25 October, fought their way into Hadrut, and then turned north through wooded hills towards Shusha and the Lachin road. Elsewhere the front hardly moved. Both sides shelled towns. Stepanakert was hit repeatedly, including with cluster munitions, and Armenian missile strikes on Ganja and a cluster attack on Barda killed dozens of Azerbaijani civilians. Three humanitarian ceasefires in October broke down within hours.": "Les forces azerbaïdjanaises ont annoncé la prise de Jabrayil le 9 octobre, de Fuzuli le 17 octobre, de Zangilan le 20 octobre et de Qubadli le 25 octobre, se sont battus pour entrer dans Hadrut, puis ont tourné vers le nord à travers des collines boisées en direction de Shusha et de la route Lachin. Ailleurs, le front n’a guère bougé. Stepanakert a été frappé à plusieurs reprises, y compris avec des armes à sous-munitions, et des tirs de missiles arméniens sur Ganja et une attaque en grappe contre Barda ont tué des dizaines de civils azerbaïdjanais."
