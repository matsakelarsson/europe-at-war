"November 2020 – September 2023": "novembre 2020 – septembre 2023"
"Azerbaijani troops climbed through the forests below Shusha and took the town on 8 November, putting the road from Stepanakert to Armenia within range. On the night of 9–10 November Ilham Aliyev, Nikol Pashinyan and Vladimir Putin signed a statement ending the war. Armenia agreed to hand back the Agdam, Kalbajar and Lachin districts by 1 December, and about 2,000 Russian peacekeepers deployed along the new line and the Lachin corridor. About 2,900 Azerbaijani and 3,800 Armenian soldiers had been killed, and about 100 civilians on each side. Crowds in Yerevan denounced the agreement as a capitulation.": "Dans la nuit du 9 au 10 novembre, Ilham Aliyev, Nikol Pashinyan et Vladimir Poutine ont signé une déclaration mettant fin à la guerre. L’Arménie a accepté de rendre les districts d’Agdam, Kalbajar et Latchin avant le 1er décembre, et environ 2 000 soldats de la paix russes déployés le long de la nouvelle ligne et du corridor Latchine. Environ 2 900 soldats azerbaïdjanais et 3 800 soldats arméniens ont été tués, et une centaine de civils de chaque côté."
"The rest of Karabakh stayed under its Armenian authorities, linked to Armenia only by the corridor. In December 2022 Azerbaijani protesters presented as environmental activists blocked it, and in April 2023 Azerbaijan set up a checkpoint, causing severe shortages of food, fuel and medicine. On 19 September 2023 Azerbaijan attacked, and the next day the Karabakh forces agreed to disarm. Within a week more than 100,000 people, nearly the whole Armenian population, fled to Armenia, and a fuel depot explosion near Stepanakert killed more than 170 of them. On 28 September the Artsakh president signed a decree dissolving the republic from 1 January 2024.": "Le reste du Karabakh est resté sous ses autorités arméniennes, liées à l’Arménie seulement par le couloir. En décembre 2022 les manifestants azerbaïdjanais présentés comme des militants de l’environnement l’ont bloqué, et en avril 2023 l’Azerbaïdjan a mis en place un point de contrôle, causant de graves pénuries de nourriture, de carburant et de médicaments. En une semaine, plus de 100 000 personnes, presque toute la population arménienne, ont fui vers l’Arménie, et une explosion de dépôt de carburant près de Stepanakert a tué plus de 170 d’entre elles. Le 28 septembre le président des Artsakhs a signé un décret dissolvant la République à partir du 1er janvier 2024."
