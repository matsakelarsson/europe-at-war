# Some French text was translated automatically.
"Second Nagorno-Karabakh War": "Deuxième guerre du Haut-Karabakh"
"A 44-day war in which Azerbaijan, with strong Turkish support, retook the districts around Nagorno-Karabakh that Armenian forces had held since 1994, along with Hadrut and Shusha. A ceasefire brokered by Russia on 9–10 November 2020 returned further districts to Azerbaijan and brought in Russian peacekeepers; in September 2023 an Azerbaijani offensive ended the Republic of Artsakh, and almost all of Karabakh’s Armenians fled to Armenia.": "Une guerre de 44 jours dans laquelle l’Azerbaïdjan, avec un fort soutien turc, a repris les districts autour du Haut-Karabakh que les forces arméniennes avaient tenu depuis 1994, avec Hadrut et Shusha. Un cessez-le-feu négocié par la Russie les 9-10 novembre 2020 est retourné d’autres districts en Azerbaïdjan et a amené des soldats de la paix russes ; en septembre 2023 une offensive azerbaïdjanaise a mis fin à la République d’Artakh et presque tous les Arméniens du Karabakh ont fui vers l’Arménie."
"Nagorno-Karabakh and the surrounding districts are shown as part of Azerbaijan on the map, as they are internationally recognised. Areas of control are drawn approximately.": "Le Haut-Karabakh et les districts environnants font partie de l’Azerbaïdjan sur la carte, car ils sont reconnus au niveau international."
"Many places have both Armenian and Azerbaijani names, such as Stepanakert (Khankendi) and Shusha (Shushi). The more common English forms are used here.": "Beaucoup d’endroits ont des noms arméniens et azerbaïdjanais, comme Stepanakert (Khankendi) et Shusha (Shushi)."
"Each side played down its own losses and exaggerated the other’s; the figures given are those the two governments published after the war.": "Chaque partie a réduit ses propres pertes et exagéré les autres ; les chiffres donnés sont ceux des deux gouvernements publiés après la guerre."
