Dec 1655 – Jul 1656: déc. 1655 – juil. 1656
Swedish requisitions and plunder, and the attack on Jasna Góra, turned many Poles who had submitted against Charles X Gustav. On 29 December 1655 nobles and soldiers loyal to John II Casimir formed the Confederation of Tyszowce and called the country to arms, and the Crown hetmans went back to the king. John Casimir returned from Silesia through the mountains to Lwów. In its cathedral, on 1 April 1656, he vowed to place the kingdom under the protection of the Virgin Mary and to ease the burdens of the peasants.: Le 29 décembre 1655, des nobles et des soldats fidèles à Jean II Casimir formèrent la Confédération de Tyzowce et appelèrent le pays aux armes, et les hetmans de la Couronne retournèrent au roi. John Casimir revint de Silésie par les montagnes à Lwów. Dans sa cathédrale, le 1er avril 1656, il s’engage à placer le royaume sous la protection de la Vierge Marie et à alléger les fardeaux des paysans.
Charles X Gustav struck deep into the south-east that winter. He beat Stefan Czarniecki at Gołąb in February, but failed to take Zamość, and in late March he was nearly trapped where the San meets the Vistula, escaping with heavy losses. Czarniecki’s raids and ambushes wore down the Swedish columns, and on 1 July 1656 a Polish–Lithuanian army retook Warsaw, capturing the Swedish commander Arvid Wittenberg.: Charles X Gustav a frappé profondément dans le sud-est de l’hiver. Il a battu Stefan Czanniecki à GołŁb en février, mais n’a pas réussi à prendre Zamość, et à la fin de mars il était presque piégé là où le San rencontre la Vistule, s’échappant avec de lourdes pertes. Le 1er juillet 1656, une armée polonaise et lituanienne reprit Varsovie, capturant le commandant suédois Arvid Wittenberg.
