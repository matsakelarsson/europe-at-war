Gained by Sweden in this peace: Acquis par la Suède dans cette paix
The siege of Copenhagen: Le siège de Copenhague
Aug 1658 – Feb 1659: août 1658 – février 1659
Barely six months later Charles broke the peace, now aiming to wipe out Denmark as an independent state. His army landed at Korsør on 7 August 1658 and laid siege to Copenhagen, and Kronborg fell on 6 September.: À peine six mois plus tard, Charles rompit la paix, visant maintenant à éliminer le Danemark en tant qu’État indépendant. Son armée débarqua à Korsør le 7 août 1658 et assiégea Copenhague, et Kronborg tomba le 6 septembre.
The Dutch would not let one power hold both shores of the Sound. Their relief fleet of about 45 ships beat the Swedish fleet in the Battle of the Sound on 29 October 1658 and got supplies and troops into the city. On the night of 10–11 February 1659 a Swedish storming of Copenhagen was thrown back with heavy losses.: Les Hollandais ne laisseront pas une seule puissance tenir les deux rives du détroit. Leur flotte de secours d’environ 45 navires a battu la flotte suédoise lors de la bataille du détroit le 29 octobre 1658 et obtenu des provisions et des troupes dans la ville. La nuit du 10 au 11 février 1659, une tempête suédoise de Copenhague a été repoussée avec de lourdes pertes.
