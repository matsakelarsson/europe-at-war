Lithuania between Russia and Sweden: Lituanie entre la Russie et la Suède
1655–1656: 1655–1656
Lithuania was invaded from two sides. Russian armies and Cossacks had taken Smolensk, Vitebsk and Mogilev in 1654, and in the summer of 1655 they took Minsk, Grodno and Kaunas. On 8 August they captured Vilnius, the capital, and looted and burned it for days, killing many of its people. Tsar Alexis took the title Grand Duke of Lithuania. It was in the shadow of these defeats that Janusz Radziwiłł turned to Sweden at Kėdainiai.: La Lituanie a été envahie de deux côtés. Les armées russes et les cosaques ont pris Smolensk, Vitebsk et Mogilev en 1654, et à l’été de 1655 ils ont pris Minsk, Grodno et Kaunas. Le 8 août ils ont capturé Vilnius, la capitale, et pillé et brûlé pendant des jours, tuant beaucoup de son peuple. Tsar Alexis a pris le titre Grand Duc de Lituanie. C’est à l’ombre de ces défaites que Janusz Radziwiłł se tourna vers la Suède à Kėdainiai.
Many Lithuanian nobles rejected his union with Sweden and stayed loyal to John II Casimir, led by Paweł Sapieha, voivode of Vitebsk. Radziwiłł died on 31 December 1655 in his castle at Tykocin while Sapieha’s troops besieged it, and in 1656 Samogitia rose against its Swedish garrisons. Alarmed by Swedish gains, Russia turned on Sweden, and in November 1656 Russian and Polish–Lithuanian envoys agreed a truce at Niemież near Vilnius. Russian troops stayed in much of the Grand Duchy until 1661.: De nombreux nobles lituaniens ont rejeté son union avec la Suède et sont restés fidèles à Jean II Casimir, dirigé par Paweł Sapieha, voivode de Vitebsk. Radziwiłł est mort le 31 décembre 1655 dans son château à Tykocin tandis que les troupes de Sapieha assiégeaient, et en 1656 Samogitia s’est élevé contre ses garnisons suédoises. Alarmée par les gains de la Suède, la Russie s’est tournée vers la Suède et en novembre 1656, des envoyés russes et polonais-lituaniens ont convenu d’une trêve à Niemie. Les troupes russes sont restées dans une grande partie du Grand-Duché jusqu’en 1661.
