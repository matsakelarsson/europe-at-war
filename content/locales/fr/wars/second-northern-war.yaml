Returned: Renvoyé
Trøndelag and Bornholm: Trøndelag et Bornholm
Charles X Gustav dies: Charles X Gustav meurt
13 February 1660: 13 février 1660
The king fell ill and died while the Riksdag was meeting in Gothenburg.: Le roi tomba malade et mourut pendant que le Riksdag se réunissait à Göteborg.
Treaty of Oliva: Traité d’Oliva
3 May 1660: 3 mai 1660
Peace with Poland–Lithuania, the Emperor and Brandenburg. Brandenburg’s sovereignty over Ducal Prussia was also confirmed.: La paix avec la Pologne-Lituanie, l’empereur et le Brandebourg. La souveraineté de Brandebourg sur la Prusse ducale a également été confirmée.
Treaty of Copenhagen: Traité de Copenhague
27 May 1660: 27 mai 1660
Sweden kept everything east of the Sound and its exemption from the Sound Dues. Four days later the remaining Swedish troops began to leave the outskirts of the city.: La Suède a gardé tout à l’est du Sound et son exemption des droits sonores. Quatre jours plus tard, les troupes suédoises restantes ont commencé à quitter la périphérie de la ville.
Treaty of Cardis: Traité de Cardis
Russia handed back its conquests in Livonia, confirming the 1617 Treaty of Stolbovo.: La Russie a remis ses conquêtes en Livonie, confirmant le traité de Stolbovo de 1617.
