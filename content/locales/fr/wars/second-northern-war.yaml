Enemies on every side: Ennemis de tous les côtés
Charles X Gustav allied with George II Rákóczi of Transylvania, whose army of about 25,000 invaded Poland in January 1657 and even took Warsaw in June. The campaign then fell apart and Rákóczi had to surrender. Austria joined Poland, and Brandenburg switched sides in return for full sovereignty over Ducal Prussia.: Charles X Gustav s’allie avec George II Rákóczi de Transylvanie, dont l’armée d’environ 25 000 hommes envahit la Pologne en janvier 1657 et prit même Varsovie en juin. La campagne s’effondre alors et Rákóczi doit se rendre. L’Autriche rejoint la Pologne, et Brandenburg change de camp en échange de toute souveraineté sur Ducal Prusse.
Denmark declared war in June 1657, hoping to win back its losses. Charles welcomed the chance to leave Poland. He marched his army across Germany into Holstein and Jutland, and in late October his troops stormed the fortress of Frederiksodde.: Le Danemark a déclaré la guerre en juin 1657, espérant regagner ses pertes. Charles s’est félicité de la chance de quitter la Pologne. Il a marché son armée à travers l’Allemagne dans Holstein et Jutland, et à la fin d’octobre ses troupes ont pris la forteresse de Frederiksodde.
