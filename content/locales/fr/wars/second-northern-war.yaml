The March across the Belts: La marche à travers les Ceintures
Jan – Feb 1658: Janv. – Fév 1658
The winter was so harsh that the Danish straits froze and the Danish fleet was stuck in port. On 30 January 1658 Charles led his army across the ice of the Little Belt from Jutland to Funen and overwhelmed the defenders.: L’hiver était si rude que les détroits danois gelèrent et la flotte danoise fut coincée au port. Le 30 janvier 1658, Charles conduisit son armée à travers la glace de la Petite Ceinture de Jutland à Funen et submergea les défenseurs.
On 5 February he crossed the Great Belt via Langeland to Lolland, then over Falster to Zealand, losing two cavalry squadrons through the ice on the way. Copenhagen had not expected an attack before spring, and Denmark asked for peace. A preliminary treaty was signed at Taastrup in mid-February.: Le 5 février, il traverse la Grande Ceinture via Langeland pour Lolland, puis Falster en Zélande, perdant deux escadrons de cavalerie à travers la glace sur le chemin. Copenhague n’avait pas prévu une attaque avant le printemps, et le Danemark a demandé la paix.
