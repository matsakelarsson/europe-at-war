Warned of the plan, the Danes and Dutch beat off the night attack. Afterwards Charles tried to starve the city out instead.: Averti du plan, les Danois et les Hollandais ont battu l’attaque de nuit. Charles a ensuite essayé de mourir de faim à la place de la ville.
Norway and Bornholm fight back: La Norvège et Bornholm se battent contre eux
1658 – 1660: 1658 – 1660
"Swedish rule over the newly ceded lands began to crumble once the war restarted. The Norwegian commander Jørgen Bjelke marched on Trondheim and won it back in 1658. On Bornholm the islanders rose on 8–9 December 1658: the Swedish commandant Johan Printzensköld was shot in Rønne and his garrison gave up.": "La domination suédoise sur les terres nouvellement cédées commença à s’effondrer lorsque la guerre reprit. Le commandant norvégien Jørgen Bjelke marcha sur Trondheim et le remporta en 1658. À Bornholm, les insulaires se levèrent les 8 et 9 décembre 1658 : le commandant suédois Johan Printzensköld fut abattu à Rønne et sa garnison abandonna."
Further south, the Norwegian border town of Halden beat off Swedish attacks in 1658, 1659 and 1660.: Plus au sud, la ville frontalière norvégienne de Halden a battu les attaques suédoises en 1658, 1659 et 1660.
Norwegian name: Nom norvégien
Bjelkefeiden: Bjelkefeiden
Halden attacked: Halden attaqué
1658, 1659 and 1660: 1658, 1659 et 1660
Siege of Trondheim: Siège de Trondheim
Norwegian troops under Jørgen Bjelke besieged and retook the city that had been handed to Sweden at Roskilde.: Les troupes norvégiennes sous Jørgen Bjelke ont assiégé et repris la ville qui avait été remise à la Suède à Roskilde.
Bornholm uprising: Révolte de Bornholm
8–9 December 1658: 8–9 décembre 1658
Islanders led by men such as Jens Kofoed and Villum Clausen seized the Swedish commandant, who was shot in Rønne’s main street.: Des insulaires dirigés par des hommes comme Jens Kofoed et Villum Clausen ont saisi le commandant suédois, qui a été abattu dans la rue principale de Rønne.
Halden: Halden
1658–1660: 1658–1660
Swedish forces attacked in September 1658 and again in February 1659 with 4,000 men, and tried a third time in 1660. The town held each time.: Les forces suédoises attaquèrent en septembre 1658 et de nouveau en février 1659 avec 4 000 hommes, et essayèrent une troisième fois en 1660.
Bjelke: Bjelke
Won back by Denmark–Norway: Récupéré par le Danemark et la Norvège
The allies close in: Les alliés se rapprochent
1658 – 1659: 1658 – 1659
An allied army of about 30,000 Brandenburg, Imperial and Polish troops marched into Jutland in late 1658 and stormed the island of Als. By 1659 all of Jutland was in allied hands, and Imperial troops besieged Stettin in the autumn.: Une armée alliée d’environ 30 000 hommes de Brandebourg, impérial et polonais est entrée dans le Jutland à la fin de 1658 et a pris l’île d’Als. En 1659 tout le Jutland était entre les mains alliées, et les troupes impériales ont assiégé Stettin à l’automne.
After a failed landing in June, the allies crossed to Funen in November 1659. On 14 November they crushed the Swedish army at Nyborg, with Dutch ships under Michiel de Ruyter in support. The Swedes lost Funen and were left holding Zealand.: Après un atterrissage raté en juin, les alliés ont traversé à Funen en novembre 1659. Le 14 novembre ils ont écrasé l’armée suédoise à Nyborg, avec des navires néerlandais sous Michiel de Ruyter en soutien.
Allied army: Armée alliée
14,500 Brandenburg, 10,600 Imperial, 5,000 Polish: 14 500 Brandebourg, 10 600 Impérial, 5 000 Polonais
Last major battle: Dernière grande bataille
Nyborg, 14 November 1659: Nyborg, 14 novembre 1659
Als stormed: Als a pris la tempête
Polish and Brandenburg troops invaded the island off the Jutland coast.: Les troupes polonaises et Brandebourges ont envahi l’île au large de la côte du Jutland.
Siege of Stettin: Siège de Stettin
Autumn 1659: Automne 1659
About 5,000 Imperial troops crossed the Oder in mid-September 1659 to besiege the capital of Swedish Pomerania.: Environ 5 000 troupes impériales ont traversé l’Oder à la mi-septembre 1659 pour assiéger la capitale de la Poméranie suédoise.
Battle of Nyborg: Bataille de Nyborg
14 November 1659: 14 novembre 1659
Danish, Imperial, Brandenburg and Polish troops defeated the Swedes on Funen. Polish cavalry under Kazimierz Piaseczyński played a key part.: Les troupes danoise, impériale, brandebourgeoise et polonaise ont vaincu les Suédois sur Funen. La cavalerie polonaise sous Kazimierz Piaseczyński a joué un rôle clé.
Peace at Oliva and Copenhagen: Paix à Oliva et Copenhague
Charles X Gustav died at Gothenburg on 13 February 1660, aged 37, while planning yet another campaign. His son Charles XI was four, and the regency quickly made peace. At Oliva near Danzig on 3 May 1660, Poland–Lithuania recognised Swedish Livonia, John II Casimir gave up his claim to the Swedish crown, and all occupied land was returned.: Charles X Gustav est décédé à Göteborg le 13 février 1660, âgé de 37 ans, tout en planifiant une nouvelle campagne. Son fils Charles XI avait quatre ans, et la régence a rapidement fait la paix. À Oliva près de Danzig le 3 mai 1660, Pologne-Lituanie reconnut la livonie suédoise, Jean II Casimir abandonna sa revendication à la couronne suédoise, et toutes les terres occupées furent restituées.
In the Treaty of Copenhagen on 27 May 1660, Sweden gave back Trøndelag and Bornholm but kept Scania, Halland, Blekinge and Bohuslän. Peace with Russia followed at Cardis in 1661, restoring the borders of 1617.: Dans le traité de Copenhague du 27 mai 1660, la Suède a rendu Trøndelag et Bornholm mais a gardé Scania, Halland, Blekinge et Bohuslän. La paix avec la Russie a suivi à Cardis en 1661, restaurant les frontières de 1617.
Kept by Sweden: Conservé par la Suède
