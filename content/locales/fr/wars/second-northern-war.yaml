The Deluge: Le déluge
Charles X Gustav invaded Poland–Lithuania in July 1655, while it was already fighting Russia and the Cossacks. At Ujście on 25 July the nobles of Greater Poland surrendered without a real fight, and on 17 August Janusz Radziwiłł placed Lithuania under Swedish protection at Kėdainiai.: Charles X Gustav a envahi la Pologne-Lituanie en juillet 1655, alors qu’il combattait déjà la Russie et les Cosaques. A Ujście le 25 juillet, les nobles de la Grande Pologne se sont rendus sans véritable combat, et le 17 août Janusz Radziwiłł a placé la Lituanie sous protection suédoise à Kėdainiai.
Charles entered Warsaw on 8 September. Kraków fell in October, and King John II Casimir fled to Silesia. Only the fortified monastery of Jasna Góra at Częstochowa held out, and its defence rallied Polish resistance. Far away, on the Delaware, the Dutch took the colony of New Sweden that September.: Charles entra à Varsovie le 8 septembre. Cracovie tomba en octobre, et le roi Jean II Casimir s’enfuit en Silésie. Seul le monastère fortifié de Jasna Góra à Częstochowa se dressa, et sa défense rallia la résistance polonaise.
