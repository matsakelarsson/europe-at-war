Victory at Warsaw, and Russia attacks: Victoire à Varsovie et attaques de la Russie
"Polish resistance grew fast, and a Swedish force was destroyed at Warka in April. Frederick William of Brandenburg had already become Charles’s vassal for Ducal Prussia, and on 28–30 July 1656 their combined army beat a larger Polish-Lithuanian army at Warsaw. The victory changed little: the allies were beaten at Prostki in October, and in November Charles had to grant Frederick William full sovereignty in Prussia at Labiau.": "La résistance polonaise grandit rapidement, et une force suédoise fut détruite à Warka en avril. Frederick William de Brandenburg était déjà devenu vassal Charles pour Ducal Prusse, et les 28-30 juillet 1656, leur armée combinée battait une plus grande armée polonaise-lithuane à Varsovie. La victoire n’a guère changé : les alliés ont été battus à Prostki en octobre, et en novembre Charles a dû accorder à Frederick William la pleine souveraineté en Prusse à Labiau."
Meanwhile Tsar Alexis declared war in May 1656. A Russian army besieged Riga from August to October without success, but another took Dorpat.: Pendant ce temps, le tsar Alexis déclara la guerre en mai 1656. Une armée russe assiégea Riga d’août à octobre sans succès, mais une autre prit Dorpat.
