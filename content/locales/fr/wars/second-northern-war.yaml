The Treaty of Roskilde: Le traité de Roskilde
26 February 1658: 26 février 1658
"Denmark–Norway lost about a third of its territory: Scania, Blekinge and Halland, the island of Bornholm, and from Norway the provinces of Bohuslän and Trøndelag (then including Nordmøre and Romsdal). Halland, held since 1645 on a 30-year pledge, became Swedish for good.": "Le Danemark et la Norvège ont perdu environ un tiers de leur territoire : Scania, Blekinge et Halland, l’île de Bornholm, et de Norvège les provinces de Bohuslän et Trøndelag (alors y compris Nordmøre et Romsdal)."
Denmark also had to renounce its anti-Swedish alliances and keep hostile warships out of the Baltic. Sweden had never been larger.: Le Danemark a également dû renoncer à ses alliances anti-suédoises et garder les navires de guerre hostiles hors de la Baltique. La Suède n’a jamais été plus grande.
