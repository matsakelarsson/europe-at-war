Second Northern War: Deuxième guerre du Nord
Charles X Gustav’s invasion of Poland–Lithuania in 1655, the Deluge, drew in Russia, Brandenburg, Transylvania, the Habsburgs, Denmark–Norway and the Dutch. Sweden could not hold Poland, but after marching across the frozen Danish straits it won Scania, Halland, Blekinge and Bohuslän from Denmark–Norway, which it kept at the peace of 1660.: L’invasion de la Pologne-Lituanie en 1655 par Charles X Gustav, le déluge, a attiré en Russie, Brandebourg, Transylvanie, les Habsbourg, Danemark-Norvège et les Hollandais. La Suède n’a pas pu tenir la Pologne, mais après avoir traversé les détroits danois gelés, elle a gagné Scania, Halland, Blekinge et Bohuslän du Danemark-Norvège, qu’elle a gardé en paix en 1660.
Dates in Germany and Poland are New Style (Gregorian); Scandinavian dates are mostly Old Style (Julian), as usually cited, which ran ten days behind.: Les dates en Allemagne et en Pologne sont New Style (Gregorian) ; les dates scandinaves sont pour la plupart Old Style (Julian), comme on le cite habituellement, qui a duré dix jours.
Migrated from Sweden at War, so the story is told from Sweden’s side.: Migré de Suède à la guerre, l’histoire est donc racontée du côté suédois.
