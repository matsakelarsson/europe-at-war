# French translations of the catalogue text (wave 14); step bodies follow later.
Second Occupation of Cuba: Seconde occupation de Cuba
? The American intervention of 1906–1909, also called the Provisional Government of Cuba or the Cuban Pacification. The Platt Amendment, which the United States made a condition of its withdrawal in 1902 and which Cuba wrote into its constitution and into a treaty of 1903, gave the United States a right to intervene to preserve Cuban independence and a stable government. In 1905 President Tomás Estrada Palma and his Moderates won re-election by fraud, and in August 1906 the Liberals rose in arms in the August revolution (the Little August War), with columns under Faustino “Pino” Guerra in Pinar del Río and other veterans of the war of independence; the old general Quintín Banderas was killed by the Rural Guard. Both sides appealed to Washington. President Theodore Roosevelt sent Secretary of War William Howard Taft and Assistant Secretary of State Robert Bacon, who arrived on 19 September 1906. When they proposed a compromise, Estrada Palma resigned on 28 September and Congress chose no successor, and on 29 September Taft proclaimed a provisional government with himself as governor, under the Cuban flag and laws. Charles E. Magoon succeeded him on 13 October 1906 and governed for more than two years, backed by an Army of Cuban Pacification that never exceeded about 6,600 American soldiers. The rebels disarmed without a battle. Magoon’s government built roads and drafted new laws, and Cuban critics blamed it for spreading government sinecures and debt. After elections in 1908 the Liberal José Miguel Gómez became president on 28 January 1909, and the last American troops left in the following weeks.
: L’intervention américaine de 1906–1909, appelée aussi Gouvernement provisoire de Cuba ou pacification de Cuba. L’amendement Platt, dont les États-Unis avaient fait une condition de leur retrait en 1902 et que Cuba avait inscrit dans sa constitution et dans un traité de 1903, donnait aux États-Unis le droit d’intervenir pour préserver l’indépendance cubaine et un gouvernement stable. En 1905, le président Tomás Estrada Palma et ses modérés obtinrent leur réélection par la fraude, et en août 1906 les libéraux prirent les armes lors de la révolution d’Août (la petite guerre d’Août), avec des colonnes menées par Faustino « Pino » Guerra dans la province de Pinar del Río et par d’autres vétérans de la guerre d’indépendance ; le vieux général Quintín Banderas fut tué par la Garde rurale. Les deux camps en appelèrent à Washington. Le président Theodore Roosevelt envoya le secrétaire à la Guerre William Howard Taft et le secrétaire d’État adjoint Robert Bacon, qui arrivèrent le 19 septembre 1906. Lorsqu’ils proposèrent un compromis, Estrada Palma démissionna le 28 septembre, le Congrès ne lui désigna aucun successeur, et le 29 septembre Taft proclama un gouvernement provisoire dont il prit la tête comme gouverneur, sous le drapeau et les lois de Cuba. Charles E. Magoon lui succéda le 13 octobre 1906 et gouverna plus de deux ans, appuyé par une armée de pacification de Cuba qui ne dépassa jamais environ 6 600 soldats américains. Les rebelles désarmèrent sans combat. Le gouvernement de Magoon construisit des routes et rédigea de nouvelles lois, et des critiques cubains lui reprochèrent d’avoir multiplié les sinécures publiques et accru la dette. Après les élections de 1908, le libéral José Miguel Gómez devint président le 28 janvier 1909, et les dernières troupes américaines partirent dans les semaines suivantes.
