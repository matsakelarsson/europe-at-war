# French translations of the catalogue text (wave 9); step bodies follow later.
Second Opium War: Seconde guerre de l’opium
? A war of Britain and France against Qing China, also called the Arrow War. Britain wanted to revise the treaties of the First Opium War to open all of China to trade, legalise opium and station an ambassador in Beijing. The seizure of the Chinese-owned, Hong Kong-registered lorcha Arrow at Guangzhou (Canton) in October 1856 gave it a pretext, and France joined after the execution of a French missionary in Guangxi. The allies took Guangzhou at the end of 1857 and the Dagu (Taku) forts in May 1858, and imposed the Treaties of Tianjin. When the Qing repulsed their envoys at Dagu in 1859, an Anglo-French army of about 18,000 men returned in 1860, beat the Mongol general Senggelinqin at Baliqiao and occupied Beijing, where Lord Elgin had the Old Summer Palace looted and burned. The Conventions of Peking of October 1860 opened more ports, legalised the opium trade, allowed Christian missions, ceded Kowloon to Britain and, in a separate treaty, confirmed Russia’s annexation of the lands north of the Amur and east of the Ussuri.
: Une guerre de la Grande-Bretagne et de la France contre la Chine des Qing, appelée aussi guerre de l’Arrow. La Grande-Bretagne voulait réviser les traités de la première guerre de l’opium pour ouvrir toute la Chine au commerce, légaliser l’opium et installer un ambassadeur à Pékin. La saisie à Canton (Guangzhou), en octobre 1856, de la lorcha Arrow, propriété chinoise immatriculée à Hong Kong, lui fournit un prétexte, et la France se joignit à elle après l’exécution d’un missionnaire français au Guangxi. Les alliés prirent Canton à la fin de 1857 et les forts de Dagu (Taku) en mai 1858, et imposèrent les traités de Tianjin. Lorsque les Qing repoussèrent leurs envoyés à Dagu en 1859, une armée franco-britannique d’environ 18 000 hommes revint en 1860, battit le général mongol Senggelinqin à Palikao (Baliqiao) et occupa Pékin, où lord Elgin fit piller et incendier l’ancien palais d’Été. Les conventions de Pékin d’octobre 1860 ouvrirent de nouveaux ports, légalisèrent le commerce de l’opium, autorisèrent les missions chrétiennes, cédèrent Kowloon à la Grande-Bretagne et, par un traité distinct, confirmèrent l’annexion par la Russie des terres situées au nord de l’Amour et à l’est de l’Oussouri.
