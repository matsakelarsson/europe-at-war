"Zonchio and Lepanto": "Zonchio et Lepanto"
"In the summer of 1499 Bayezid II sent a great fleet, some 260 ships under the kapudan pasha Davud with the corsair captain Kemal Reis, to support the siege of Venetian Lepanto at the mouth of the Gulf of Corinth. The Venetian captain-general Antonio Grimani, with a smaller but heavier fleet, met it off Cape Zonchio near Navarino on 12 August. His captains failed to attack together, the great carrack of Andrea Loredan burned with an Ottoman ship locked to it, and in clashes over the following two weeks the Venetians could not stop the Ottoman fleet as it worked its way north along the coast.": "Au cours de l’été 1499 Bayezid II envoya une grande flotte, quelque 260 navires sous le kapudan pasha Davud avec le capitaine corsair Kemal Reis, pour soutenir le siège de Lepanto vénitien à l’embouchure du golfe de Corinthe. Le capitaine-général vénitien Antonio Grimani, avec une flotte plus petite mais plus lourde, la rencontra au large du cap Zonchio près de Navarino le 12 août. Ses capitaines n’ont pas réussi à attaquer ensemble, la grande carcasse d’Andrea Loredan a brûlé avec un navire ottoman verrouillé à lui, et dans les affrontements au cours des deux semaines suivantes, les Vénitiens ne pouvaient pas arrêter la flotte ottomane comme elle travaillait son chemin vers le nord le long de la côte."
"With the Ottoman fleet and its guns in the Gulf of Corinth, Lepanto surrendered to the sultan’s army at the end of August. Ottoman horsemen from Bosnia raided Venetian Friuli that autumn, burning villages as far as the Tagliamento. In Venice the defeat caused uproar; Grimani was arrested, tried and exiled, though he later returned and became doge. Venetian attacks on Lepanto in the winter failed.": "Avec la flotte ottomane et ses canons dans le golfe de Corinthe, Lepanto se rendit à l’armée sultanienne à la fin du mois d’août. Des cavaliers ottomans de Bosnie firent une descente au Frioul vénitien cet automne-là, brûlant des villages jusqu’au Tagliamento."
