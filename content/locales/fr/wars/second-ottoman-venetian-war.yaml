"1499": "1499"
"Second Ottoman–Venetian War": "Deuxième guerre ottomane-vénétienne"
"A war between the Republic of Venice and the Ottoman Empire of Bayezid II, fought at sea off western Greece and in the Venetian outposts of the Morea and Albania. The Ottoman fleet beat the Venetians at Zonchio in 1499 and took Lepanto, Modon, Coron and Durazzo, while Venice, with Spanish help, won Kefalonia; the peace of 1502–1503 confirmed the Ottoman conquests and showed that the sultan was now a naval power.": "Une guerre entre la République de Venise et l’Empire ottoman de Bayezid II, a combattu en mer au large de la Grèce occidentale et dans les avant-postes vénitiens de Morea et d’Albanie. La flotte ottomane battit les Vénitiens à Zonchio en 1499 et prit Lepanto, Modon, Coron et Durazzo, tandis que Venise, avec l’aide des Espagnols, gagna Kefalonia ; la paix de 1502-1503 confirma les conquêtes ottomanes et montra que le sultan était maintenant une puissance navale."
"Dates are Julian. The sources give different dates for the end of the war; the peace was agreed at the end of 1502 and confirmed in 1503.": "Dates sont Julian. Les sources donnent différentes dates pour la fin de la guerre ; la paix a été convenue à la fin de 1502 et confirmée en 1503."
"Venetian Dalmatia was raided from Ottoman Bosnia throughout the war, and in 1501 Venice agreed to pay the king of Hungary to defend Croatia, which shielded its Dalmatian towns.": "La Dalmatie vénitienne a été attaquée de Bosnie ottomane tout au long de la guerre, et en 1501 Venise a accepté de payer le roi de Hongrie pour défendre la Croatie, qui a protégé ses villes dalmates."
