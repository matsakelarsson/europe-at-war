"1500–1503": "1500–1503"
"In 1500 Bayezid II led his army against Modon, Venice’s chief port in the Morea, while Kemal Reis blockaded it from the sea and beat off a Venetian relief fleet. On 9 August the town was stormed and sacked, and many of its people were killed. Coron and Navarino surrendered soon after. Venice had lost the “two eyes of the Republic”, its stations on the route to the Levant. In December a Venetian and Spanish fleet under Benedetto Pesaro and Gonzalo Fernández de Córdoba took the castle of St George on Kefalonia.": "En 1500, Bayezid II dirigea son armée contre Modon, Venise, le port principal dans la Morea, tandis que Kemal Reis l’obstruait de la mer et battait une flotte de secours vénitienne. Le 9 août la ville fut prise d’assaut et saccagée, et beaucoup de ses habitants furent tués. Coron et Navarino se rendirent peu après. Venise avait perdu les deux yeux de la République, ses stations sur la route du Levant. En décembre, une flotte vénitienne et espagnole sous Benedetto Pesaro et Gonzalo Fernández de Córdoba a pris le château de St George sur la Kefalonia."
"In 1501 Ottoman forces took Durazzo, Venice’s last important port in Albania. A French and Venetian attack on Mytilene failed, and in 1502 Pesaro took Lefkada. Venice, short of money and facing war in Italy, made peace at the end of 1502, confirmed in 1503. It kept Kefalonia but gave back Lefkada and recognised the loss of Lepanto, Modon, Coron and Durazzo. The Ottomans had shown that their fleet could defeat Venice’s.": "En 1501 les forces ottomanes ont pris Durazzo, Venise le dernier port important en Albanie. Une attaque française et vénitienne sur Mytilene a échoué, et en 1502 Pesaro a pris Lefkada. Venise, à court d’argent et face à la guerre en Italie, fait la paix à la fin de 1502, confirmé en 1503. Il conserva Kefalonia, mais remit Lefkada et reconnut la perte de Lepanto, Modon, Coron et Durazzo. Les Ottomans avaient montré que leur flotte pouvait vaincre Venise."
