# French translations of the catalogue text (wave 9); step bodies follow later.
Second Revolution: Seconde révolution
? A short civil war in 1913 in which southern governors loyal to the Kuomintang rose against President Yuan Shikai. The Kuomintang had won the first parliamentary elections of the Republic in early 1913, and its leader Song Jiaoren, who was expected to become premier, was shot at Shanghai railway station on 20 March and died two days later; many suspected Yuan, though it was never proven. Yuan then took a large Reorganisation Loan from a consortium of foreign banks without the consent of parliament and dismissed the Kuomintang governors of Jiangxi, Guangdong and Anhui. On 12 July 1913 Li Liejun declared Jiangxi independent at Hukou, and Huang Xing in Nanjing, Anhui, Guangdong, Fujian, Shanghai, Hunan and Chongqing followed. The rising had little popular support and its armies were badly coordinated. The Beiyang army beat the rebels near Xuzhou on 22 July and repulsed attacks on the Jiangnan Arsenal in Shanghai in late July; Long Jiguang took Guangzhou on 13 August and Beiyang troops took Nanchang on 18 August. Zhang Xun’s troops stormed Nanjing on 1 September and plundered the city, and the revolt ended when Tang Jiyao’s Yunnan troops entered Chongqing on 12 September. Sun Yat-sen and Huang Xing fled to Japan. Yuan had himself elected president in October, banned the Kuomintang in November and dissolved parliament in January 1914.
: Une courte guerre civile, en 1913, au cours de laquelle des gouverneurs du Sud fidèles au Kuomintang se soulevèrent contre le président Yuan Shikai. Le Kuomintang avait remporté les premières élections législatives de la République au début de 1913, et son dirigeant Song Jiaoren, pressenti pour devenir Premier ministre, fut abattu à la gare de Shanghai le 20 mars et mourut deux jours plus tard ; beaucoup soupçonnèrent Yuan, sans que cela ait jamais été prouvé. Yuan contracta ensuite auprès d’un consortium de banques étrangères un important emprunt, dit « de réorganisation », sans l’accord du parlement, et révoqua les gouverneurs Kuomintang du Jiangxi, du Guangdong et de l’Anhui. Le 12 juillet 1913, Li Liejun proclama l’indépendance du Jiangxi à Hukou, et Huang Xing à Nankin, l’Anhui, le Guangdong, le Fujian, Shanghai, le Hunan et Chongqing suivirent. Le soulèvement avait peu de soutien populaire, et ses armées étaient mal coordonnées. L’armée de Beiyang battit les rebelles près de Xuzhou le 22 juillet et repoussa les attaques contre l’arsenal du Jiangnan, à Shanghai, à la fin de juillet ; Long Jiguang prit Canton le 13 août, et les troupes de Beiyang prirent Nanchang le 18 août. Les troupes de Zhang Xun prirent Nankin d’assaut le 1er septembre et pillèrent la ville, et la révolte prit fin lorsque les troupes du Yunnan de Tang Jiyao entrèrent à Chongqing le 12 septembre. Sun Yat-sen et Huang Xing s’enfuirent au Japon. Yuan se fit élire président en octobre, interdit le Kuomintang en novembre et dissolut le parlement en janvier 1914.
