Herwarth: Sa guerre
Jutland overrun; the Treaty of Vienna: Jutland dépassé ; Traité de Vienne
July – October 1864: juillet – octobre 1864
In July Prussian and Austrian troops crossed the Limfjord and occupied all of Jutland, reaching Skagen on 14 July. At Lundby on 3 July a Danish company charged a Prussian position and was shot down, in the last fight of the war. In Copenhagen the government fell, and its successor asked for peace. Preliminary terms were signed on 1 August.: En juillet, les troupes prussiennes et autrichiennes ont traversé le Limfjord et occupé tout le Jutland, atteignant Skagen le 14 juillet. A Lundby le 3 juillet une compagnie danoise a chargé une position prussienne et a été abattue, dans le dernier combat de la guerre.
By the Treaty of Vienna on 30 October 1864 the king of Denmark gave up Schleswig, Holstein and Lauenburg to the emperor of Austria and the king of Prussia jointly. Denmark lost about two-fifths of its territory, and its population fell from about 2.6 to 1.6 million. Some 200,000 Danish speakers in Schleswig came under German rule; the northern part returned to Denmark after a plebiscite in 1920. Within two years Prussia had taken the duchies for itself, after defeating Austria in the war of 1866.: Par le traité de Vienne, le 30 octobre 1864, le roi du Danemark abandonna Schleswig, Holstein et Lauenburg à l’empereur d’Autriche et au roi de Prusse ensemble. Le Danemark perdit environ les deux cinquièmes de son territoire, et sa population tomba d’environ 2,6 à 1,6 million. Quelque 200 000 Danois vinrent sous la domination allemande ; la partie nord retourna au Danemark après un plébiscite en 1920. En deux ans, la Prusse avait pris les duches pour elle-même, après avoir vaincu l’Autriche dans la guerre de 1866.
