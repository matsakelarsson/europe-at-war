Second Schleswig War: Deuxième guerre du Schleswig
A war in which Prussia and Austria defeated Denmark after it tried to tie Schleswig more closely to the kingdom. By the Treaty of Vienna Denmark gave up Schleswig, Holstein and Lauenburg, about two-fifths of its territory, and some 200,000 Danish speakers came under German rule.: Une guerre dans laquelle la Prusse et l’Autriche ont vaincu le Danemark après avoir essayé de lier Schleswig plus étroitement au royaume. Par le traité de Vienne, le Danemark a abandonné Schleswig, Holstein et Lauenburg, environ les deux cinquièmes de son territoire, et quelque 200 000 Danois ont été sous la domination allemande.
Known in Denmark simply as “1864” and in Germany as the German–Danish War (Deutsch-Dänischer Krieg).: Connu au Danemark simplement comme 1864 et en Allemagne comme la guerre germano-danish (Deutsch-Dänischer Krieg).
Most places have a Danish and a German name (Dybbøl/Düppel, Als/Alsen, Danevirke/Danewerk).: La plupart des endroits ont un nom danois et allemand (Dybbøl/Düppel, Als/Alsen, Danevirke/Danewerk).
