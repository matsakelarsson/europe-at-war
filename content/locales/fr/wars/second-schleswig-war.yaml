Dybbøl: Dybbøl
March – April 1864: mars – avril 1864
The Danish army dug in at Dybbøl, a line of ten redoubts covering the bridge to the island of Als. The Prussians besieged it from February, and their rifled guns, firing from across the inlet at Broager, shelled the position and the town of Sønderborg day and night, the bombardment growing heavier from early April. The redoubts had too few shelters, and the defenders were worn down. In the north the Austrians and Prussians pushed into Jutland and invested the fortress of Fredericia.: L’armée danoise a creusé à Dybbøl, une ligne de dix redouttes couvrant le pont à l’île d’Als. Les Prussiens l’ont assiégée à partir de février, et leurs fusils fusillés, tirant de l’autre côté de l’entrée à Broager, ont bombardé la position et la ville de Sønderborg jour et nuit, le bombardement de plus en plus lourd depuis début avril. Les redouttes avaient trop peu d’abris, et les défenseurs étaient usés. Au nord, les Autrichiens et les Prussiens poussèrent dans le Jutland et investirent la forteresse de Fredericia.
At 10 o’clock on 18 April the guns fell silent and Prussian columns stormed the redoubts. Within a quarter of an hour the forward line was taken; a counterattack by the Danish 8th Brigade bought time for the rest to escape to Als. By one count about 3,600 Danes and 1,200 Prussians were killed, wounded or missing, and thousands of Danes were taken prisoner. The government had ordered the army to hold on so that Denmark could bargain from strength at the coming peace conference. Within two weeks the Danes had evacuated Fredericia.: Le 18 avril à 10 heures, les canons sont tombés silencieux et les colonnes prussiennes ont pris la fuite. Dans un quart d’heure la ligne avant a été prise ; une contre-attaque de la 8e Brigade danoise a acheté du temps pour le reste pour s’échapper à Als. D’un chef environ 3 600 Danois et 1 200 Prussiens ont été tués, blessés ou disparus, et des milliers de Danois ont été faits prisonniers. Le gouvernement avait ordonné à l’armée de tenir pour que le Danemark puisse négocier de la force lors de la prochaine conférence de paix. En deux semaines les Danois avaient évacué Fredericia.
