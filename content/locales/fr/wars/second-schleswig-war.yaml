The Danevirke abandoned: Le Danevirke abandonné
February 1864: février 1864
On 1 February 1864 Prussian and Austrian troops under the elderly Field Marshal Wrangel crossed the Eider into Schleswig. The Danes stopped a Prussian attempt to cross the Schlei at Mysunde on 2 February, and the Austrians pushed up to the Danevirke the next day. But the line was too long to hold with the troops available, the frozen marshes and inlets could be crossed, and the Prussians were preparing to cross the Schlei further east.: Le 1er février 1864, les troupes prussiennes et autrichiennes sous le vieux maréchal Wrangel traversèrent l’Eider dans le Schleswig. Les Danois arrêtèrent une tentative prussienne pour traverser le Schlei à Mysunde le 2 février, et les Autrichiens poussèrent vers le Danevirke le lendemain. Mais la ligne était trop longue pour tenir avec les troupes disponibles, les marais gelés et les entrées pouvaient être franchis, et les Prussiens se préparaient à traverser le Schlei plus à l’est.
On the night of 5 February the Danish commander, General de Meza, abandoned the Danevirke and retreated north in snow and frost, leaving his heavy guns behind. The Austrians caught the rearguard at Oeversee on 6 February, but the army escaped to Dybbøl and Fredericia. The retreat saved the army but shocked the Danish public, which had been taught to see the Danevirke as the country’s shield, and de Meza was dismissed. On 18 February Prussian troops crossed into Jutland at Kolding.: Dans la nuit du 5 février, le commandant danois, le général de Meza, a abandonné le Danevirke et s’est retiré au nord dans la neige et le gel, laissant derrière lui ses lourdes armes. Les Autrichiens ont pris l’arrière-garde à Oeversee le 6 février, mais l’armée s’est échappée à Dybbøl et Fredericia. La retraite a sauvé l’armée mais a choqué le public danois, qui avait appris à voir le Danevirke comme le bouclier du pays, et de Meza a été congédié. Le 18 février les troupes prussiennes ont traversé le Jutland à Kolding.
