January 1864: janvier 1864
The Danish army, about 38,000 strong, waited behind the old earthwork, rebuilt at great cost across the neck of the peninsula.: L’armée danoise, forte d’environ 38 000 hommes, attendait derrière les vieux travaux de terre, reconstruits à un prix très élevé au-dessus du cou de la péninsule.
