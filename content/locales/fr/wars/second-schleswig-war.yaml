The November Constitution: Constitution de novembre
November 1863 – January 1864: novembre 1863 – janvier 1864
Frederick VII, the last king of the old line, died on 15 November 1863. Three days later his successor, Christian IX, signed a new constitution for Denmark and Schleswig together, leaving Holstein and Lauenburg outside. Danish nationalists had long wanted this, but it broke the promise of 1852 not to bind Schleswig more closely to the kingdom than Holstein. In the duchies many backed a rival heir, Frederick of Augustenburg, and German opinion was outraged.: Frédéric VII, le dernier roi de l’ancienne lignée, mourut le 15 novembre 1863. Trois jours plus tard son successeur, Christian IX, signa une nouvelle constitution pour le Danemark et le Schleswig ensemble, laissant Holstein et Lauenburg dehors. Les nationalistes danois avaient longtemps voulu cela, mais il rompit la promesse de 1852 de ne pas lier Schleswig plus étroitement au royaume que Holstein. Dans les duchés beaucoup ont soutenu un héritier rival, Frederick d’Augustebourg, et l’opinion allemande a été outragée.
The German Confederation ordered a “federal execution” against Holstein and Lauenburg, which were its members. On 24 December Saxon and Hanoverian troops marched in, and the Danish army withdrew behind the Eider without a fight. Prussia’s chief minister, Otto von Bismarck, then went further. On 16 January 1864 Prussia and Austria gave Denmark 48 hours to withdraw the constitution in Schleswig. The Danish government refused, trusting in help from Britain or Sweden that never came.: La Confédération allemande ordonne une exécution fédérale contre Holstein et Lauenburg, qui sont ses membres. Le 24 décembre les troupes saxonnes et Hanovres entrent, et l’armée danoise se retire derrière l’Eider sans se battre. Le ministre en chef de la Prusse, Otto von Bismarck, va ensuite plus loin. Le 16 janvier 1864 la Prusse et l’Autriche donnent au Danemark 48 heures pour retirer la constitution à Schleswig. Le gouvernement danois a refusé, confiant dans l’aide de la Grande-Bretagne ou de la Suède qui n’est jamais venue.
