Heligoland, London and Als: Heligoland, Londres et Als
May – June 1864: mai – juin 1864
On 25 April a peace conference opened in London. On 9 May Danish and Austrian–Prussian squadrons fought off Heligoland, then a British island. The Austrian flagship Schwarzenberg caught fire and the allied squadron withdrew, but Denmark had to give up its blockade of the German North Sea coast. An armistice began on 12 May. In London, Britain and others proposed splitting Schleswig along a national line. The Danish government would not accept the lines on offer, and the conference broke up on 25 June.: Le 25 avril, une conférence de paix s’est ouverte à Londres. Le 9 mai, des escadrons danois et autrichien-prussien se sont battus au large d’Helgoland, puis d’une île britannique. L’amiral autrichien Schwarzenberg a pris feu et l’escadron allié s’est retiré, mais le Danemark a dû abandonner son blocus sur la côte allemande de la mer du Nord. Le gouvernement danois n’acceptera pas les lignes proposées, et la conférence s’est interrompue le 25 juin.
The fighting resumed at once. In the early hours of 29 June Prussian troops crossed the narrow sound to Als in rowing boats and took the island from its 9,000 Danish defenders, who lost nearly 3,000 men killed, wounded or captured. With Als gone and no help from abroad, the Danish islands themselves now seemed open to attack.: Les combats reprirent immédiatement. Au début du 29 juin, les troupes prussiennes traversèrent l’étroit son à Als dans des bateaux d’aviron et prirent l’île de ses 9 000 défenseurs danois, qui perdirent près de 3 000 hommes tués, blessés ou capturés.
