# French translations of the catalogue text (wave 14); step bodies follow later.
Second Seminole War: Deuxième guerre séminole
? The longest and costliest of the wars the United States fought against Native nations, waged in Florida from 1835 to 1842. Under the Indian Removal Act of 1830 the United States demanded that the Seminoles leave Florida for Indian Territory, west of the Mississippi, citing the Treaty of Payne’s Landing (1832), which most Seminole leaders said they had never agreed to. The Seminoles and Miccosukees, with the Black Seminoles, people of African descent who lived among them as free allies and who faced enslavement if they went west, chose to fight. The war opened on 28 December 1835 with the destruction of Major Francis Dade’s column and the killing of the agent Wiley Thompson by Osceola. In a guerrilla war fought from the swamps and hammocks of the peninsula and later the Everglades, leaders such as Osceola, Micanopy, Jumper, Alligator, Abiaka (Sam Jones), Coacoochee (Wild Cat) and the Black Seminoles Abraham and John Horse held off a succession of US generals, of whom Thomas Jesup seized Osceola and other leaders under flags of truce. The war ended without a peace treaty on 14 August 1842. About 4,000 Seminoles and Black Seminoles had been removed to Indian Territory, while several hundred stayed in southern Florida; about 1,500 US soldiers died, most of them of disease, and the war cost the United States between $20 million and $40 million.
: La plus longue et la plus coûteuse des guerres menées par les États-Unis contre des nations amérindiennes, livrée en Floride de 1835 à 1842. En vertu de l’Indian Removal Act de 1830, les États-Unis exigèrent que les Séminoles quittent la Floride pour le territoire indien, à l’ouest du Mississippi, en invoquant le traité de Payne’s Landing (1832), que la plupart des chefs séminoles affirmaient n’avoir jamais accepté. Les Séminoles et les Miccosukees, avec les Séminoles noirs, des personnes d’ascendance africaine qui vivaient parmi eux en alliés libres et qui risquaient l’asservissement s’ils partaient vers l’ouest, choisirent de se battre. La guerre s’ouvrit le 28 décembre 1835 par l’anéantissement de la colonne du major Francis Dade et le meurtre de l’agent Wiley Thompson par Osceola. Dans une guérilla menée depuis les marais et les îlots boisés (hammocks) de la péninsule, puis depuis les Everglades, des chefs tels qu’Osceola, Micanopy, Jumper, Alligator, Abiaka (Sam Jones), Coacoochee (Wild Cat) et les Séminoles noirs Abraham et John Horse tinrent en échec une succession de généraux américains, parmi lesquels Thomas Jesup, qui fit arrêter Osceola et d’autres chefs venus sous drapeau blanc. La guerre prit fin sans traité de paix le 14 août 1842. Environ 4 000 Séminoles et Séminoles noirs avaient été déplacés vers le territoire indien, tandis que plusieurs centaines restaient dans le sud de la Floride ; environ 1 500 soldats américains moururent, la plupart de maladie, et la guerre coûta aux États-Unis entre 20 et 40 millions de dollars.
