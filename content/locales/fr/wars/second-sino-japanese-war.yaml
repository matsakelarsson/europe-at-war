# French translations of the catalogue text (wave 9); step bodies follow later.
Second Sino-Japanese War: Seconde guerre sino-japonaise
? "The war between China and Japan from 1937 to 1945, known in China as the War of Resistance against Japan. It began with a clash at the Marco Polo Bridge near Beiping on 7 July 1937 and grew into full-scale war when fighting spread to Shanghai in August. Japan took Beiping, Tianjin, Shanghai and the Nationalist capital Nanjing in 1937, where its troops massacred prisoners and civilians, and Xuzhou, Wuhan and Guangzhou in 1938, but China did not surrender: Chiang Kai-shek’s government moved to Chongqing, Communist guerrillas spread behind the Japanese lines, and the war settled into a long stalemate. Japan ruled the occupied east through collaborationist governments, from 1940 Wang Jingwei’s in Nanjing. From December 1941 the war became part of the Second World War, with American and British aid to China. Japan’s last great offensive, Ichi-Go, overran Henan, Hunan and Guangxi in 1944, but Japan surrendered in August 1945 after the atomic bombings and the Soviet invasion of Manchuria, and its armies in China surrendered at Nanjing on 9 September. Estimates of Chinese deaths, military and civilian, range from about 14 to over 20 million, and tens of millions became refugees; Japanese military deaths in China were about 450,000–700,000."
: "La guerre entre la Chine et le Japon de 1937 à 1945, appelée en Chine guerre de résistance contre le Japon. Elle commença par un accrochage au pont Marco-Polo, près de Beiping, le 7 juillet 1937, et devint une guerre générale lorsque les combats s’étendirent à Shanghai en août. Le Japon prit en 1937 Beiping, Tianjin, Shanghai et Nankin, la capitale nationaliste, où ses troupes massacrèrent prisonniers et civils, puis en 1938 Xuzhou, Wuhan et Canton, mais la Chine ne capitula pas : le gouvernement de Tchang Kaï-chek s’installa à Chongqing, les guérillas communistes s’étendirent derrière les lignes japonaises, et la guerre s’enlisa dans une longue impasse. Le Japon gouverna l’Est occupé par l’intermédiaire de gouvernements collaborationnistes, à partir de 1940 celui de Wang Jingwei à Nankin. À partir de décembre 1941, la guerre s’inscrivit dans la Seconde Guerre mondiale, et la Chine reçut l’aide américaine et britannique. La dernière grande offensive japonaise, Ichi-Go, submergea le Henan, le Hunan et le Guangxi en 1944, mais le Japon capitula en août 1945 après les bombardements atomiques et l’invasion soviétique de la Mandchourie, et ses armées en Chine se rendirent à Nankin le 9 septembre. Les estimations des morts chinois, militaires et civils, vont d’environ 14 millions à plus de 20 millions, et des dizaines de millions de personnes devinrent des réfugiés ; les pertes militaires japonaises en Chine s’élevèrent à environ 450 000 à 700 000 morts."
