# French translations of the catalogue text (wave 12); step bodies follow later.
Second Sudanese Civil War: Deuxième guerre civile soudanaise
? One of the longest and deadliest wars of the late 20th century, fought between the government of Sudan and the Sudan People’s Liberation Movement and Army (SPLM/SPLA), mainly in the south but also in the Nuba Mountains, Blue Nile and the east. It began in May 1983 when southern soldiers mutinied at Bor; their officers, led by John Garang, founded the SPLA in Ethiopia with the support of the Derg. Gaafar Nimeiry had just divided the self-governing Southern Region and was about to impose Islamic law. Garang called not for southern independence but for a secular, democratic “New Sudan”. Successive governments, above all the Islamist regime of Omar al-Bashir and Hassan al-Turabi after 1989, fought with the army, Arab militias and a jihad, and used hunger as a weapon; militia raids carried off women and children as slaves. The SPLA lost its Ethiopian bases in 1991 and split along ethnic lines, and Nuer and Dinka factions killed each other’s civilians. Oil, exported from 1999, financed the government’s war and drove the clearing of the oil fields. Under pressure from the United States and the regional body IGAD, the two sides signed the Comprehensive Peace Agreement in Nairobi on 9 January 2005, which gave the south autonomy and a referendum on independence. About 2 million people died, most of them from famine and disease, and some 4 million were displaced.
: L’une des guerres les plus longues et les plus meurtrières de la fin du XXe siècle, qui opposa le gouvernement du Soudan au Mouvement et à l’Armée populaire de libération du Soudan (SPLM/SPLA), principalement dans le Sud, mais aussi dans les monts Nouba, le Nil Bleu et l’est du pays. Elle commença en mai 1983, lorsque des soldats sudistes se mutinèrent à Bor ; leurs officiers, menés par John Garang, fondèrent la SPLA en Éthiopie avec le soutien du Derg. Gaafar Nimeiry venait de diviser la Région autonome du Sud et s’apprêtait à imposer la loi islamique. Garang ne réclamait pas l’indépendance du Sud, mais un « Nouveau Soudan » laïque et démocratique. Les gouvernements successifs, et surtout le régime islamiste d’Omar el-Béchir et de Hassan al-Tourabi après 1989, firent la guerre avec l’armée, des milices arabes et un djihad, et se servirent de la faim comme d’une arme ; les raids des milices emmenaient des femmes et des enfants en esclavage. La SPLA perdit ses bases éthiopiennes en 1991 et se scinda selon des lignes ethniques, et les factions nuer et dinka tuèrent les civils de l’autre camp. Le pétrole, exporté à partir de 1999, finança la guerre du gouvernement et fut le moteur de l’expulsion des habitants des champs pétrolifères. Sous la pression des États-Unis et de l’organisation régionale IGAD, les deux parties signèrent à Nairobi, le 9 janvier 2005, l’accord de paix global, qui accordait au Sud l’autonomie et un référendum sur l’indépendance. Environ 2 millions de personnes moururent, pour la plupart de faim et de maladie, et quelque 4 millions furent déplacées.
