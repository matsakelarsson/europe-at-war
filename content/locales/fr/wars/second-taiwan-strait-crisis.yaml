# French translations of the catalogue text (wave 9); step bodies follow later.
Second Taiwan Strait Crisis: Deuxième crise du détroit de Taïwan
An artillery bombardment and blockade of the ROC-held islands of Kinmen (Quemoy) and Matsu by the People’s Republic of China from 23 August 1958, meant to cut them off and test the American commitment to the Republic of China on Taiwan. The United States reinforced its Seventh Fleet, escorted ROC supply convoys to the islands and sent modern weapons, among them heavy howitzers and Sidewinder air-to-air missiles, which ROC pilots used for the first time in combat on 24 September. With the blockade broken, Beijing announced a ceasefire on 6 October and on 25 October declared that it would not shell on even-numbered days, beginning two decades of alternate-day shelling that ended only in 1979. About 600 ROC soldiers and civilians were killed and some 460 PLA troops were killed or wounded.: Un bombardement d’artillerie et un blocus des îles de Kinmen (Quemoy) et de Matsu, tenues par la République de Chine, menés par la République populaire de Chine à partir du 23 août 1958 pour les isoler et mettre à l’épreuve l’engagement américain envers la République de Chine à Taïwan. Les États-Unis renforcèrent leur 7e flotte, escortèrent les convois de ravitaillement de la République de Chine vers les îles et envoyèrent des armes modernes, dont des obusiers lourds et des missiles air-air Sidewinder, que les pilotes de la République de Chine utilisèrent pour la première fois au combat le 24 septembre. Le blocus étant brisé, Pékin annonça un cessez-le-feu le 6 octobre et déclara le 25 octobre qu’il ne bombarderait pas les jours pairs, ouvrant deux décennies de bombardements un jour sur deux qui ne prirent fin qu’en 1979. Environ 600 soldats et civils de la République de Chine furent tués, et quelque 460 soldats de l’APL furent tués ou blessés.
