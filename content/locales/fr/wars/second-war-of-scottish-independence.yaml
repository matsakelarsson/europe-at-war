# Some French text was translated automatically.
"Second War of Scottish Independence": "Deuxième guerre d’indépendance écossaise"
"The war that followed the death of Robert I, when Edward Balliol, son of King John, and the “Disinherited” nobles invaded Scotland in 1332 with English backing and routed the regent’s army at Dupplin Moor. Edward III joined in and won at Halidon Hill in 1333, and Balliol ceded much of southern Scotland to him, but supporters of the young David II, who was sent to safety in France, won back most of the kingdom by 1341. David was captured at Neville’s Cross in 1346 and released by the Treaty of Berwick in 1357 for a ransom of 100,000 marks.": "La guerre qui a suivi la mort de Robert Ier, quand Edward Balliol, fils du roi Jean, et les nobles -déshéritée-l’ont envahi l’Écosse en 1332 avec le soutien anglais et dirigé l’armée régente à Dupplin Moor. Edward III s’est joint à lui et a gagné à Halidon Hill en 1333, et Balliol a cédé une grande partie du sud de l’Écosse à lui, mais les partisans du jeune David II, qui a été envoyé en sécurité en France, a remporté la majeure partie du royaume en 1341. David a été capturé à Nevilles Cross en 1346 et libéré par le traité de Berwick en 1357 pour une rançon de 100 000 marks."
"The war became bound up with the Hundred Years’ War, as France backed David II and the Scots invaded England in 1346 to help Philip VI. Balliol gave up his claim to the Scottish crown to Edward III in 1356, the year of the English raid on Lothian remembered as the Burnt Candlemas. Berwick stayed in English hands.": "La guerre s’est liée à la guerre de Cent Ans, alors que la France soutenait David II et que les Écossais envahissaient l’Angleterre en 1346 pour aider Philip VI. Balliol abandonna sa revendication de la couronne écossaise à Edward III en 1356, année du raid anglais sur Lothian dont on se souvient comme les Burnt Candlemas. Berwick resta aux mains des Anglais."
