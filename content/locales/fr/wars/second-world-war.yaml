"D-Day and Normandy": "Jour J et Normandie"
"6 June – 21 August 1944": "6 juin – 21 août 1944"
"On 6 June 1944, D-Day, the Western Allies landed in Normandy in the largest seaborne invasion in history. After airborne landings in the night, nearly 160,000 American, British and Canadian troops, with Free French and other Allied contingents, came ashore on five beaches, codenamed Utah, Omaha, Gold, Juno and Sword. At Omaha the Americans were pinned down under heavy fire before they forced their way inland. Allied casualties on the day were at least 10,000, with some 4,400 dead. By 12 June the beachheads had been joined into a single front.": "Le 6 juin 1944, le jour J, les Alliés de l’Ouest débarquèrent en Normandie lors de la plus grande invasion maritime de l’histoire. Après des débarquements aéroportés dans la nuit, près de 160 000 soldats américains, britanniques et canadiens, avec des contingents français libres et d’autres Alliés, débarquent sur cinq plages, nommées Utah, Omaha, Gold, Juno et Sword. À Omaha, les Américains ont été abattus sous de lourds tirs avant d’être contraints de se rendre à l’intérieur des terres. Les victimes alliées le jour étaient au moins 10 000, avec quelque 4 400 morts."
"The fighting in the bocage, small fields walled by thick hedges, was slow and costly. The Americans took Cherbourg at the end of June, but its port had been wrecked, while the British and Canadians fought for Caen until July. Operation Cobra broke the German line west of Saint-Lô on 25 July, and Patton’s Third Army raced south through Avranches. A German counter-attack at Mortain failed, and in August the Allies closed a pocket near Falaise. When Polish and American troops met at Chambois on 19 August, some 50,000 Germans were trapped, though perhaps 20,000–50,000 had escaped.": "Les combats dans le bocage, petits champs murés par des haies épaisses, furent lents et coûteux.Les Américains prirent Cherbourg à la fin de juin, mais son port avait été détruit, tandis que les Britanniques et les Canadiens combattirent pour Caen jusqu’en juillet. L’opération Cobra brisa la ligne allemande à l’ouest de Saint-Lô le 25 juillet, et Patton's Third Army courut vers le sud par Avranches. Une contre-attaque allemande à Mortain échoua, et en août les Alliés fermèrent une poche près de Falaise. Lorsque les troupes polonaises et américaines se rencontrèrent à Chambois le 19 août, quelque 50 000 Allemands furent pris au piège, bien que quelque 20 000 à 50 000 se fussent échappés."
"The campaign cost the Allies about 226,000 casualties, and German losses were as heavy. Between about 13,600 and 19,900 French civilians were killed, many by Allied bombing and shelling of towns such as Caen and Saint-Lô, which were largely destroyed. In the first days soldiers of the 12th SS Panzer Division murdered Canadian prisoners near Caen, among them at the Ardenne Abbey; about one in seven of the Canadians killed between 6 and 11 June died after they had surrendered.": "La campagne a coûté aux Alliés environ 226 000 victimes, et les pertes allemandes ont été aussi lourdes. Entre 13 600 et 19 900 civils français ont été tués, beaucoup par les bombardements alliés et le pilonnage de villes comme Caen et Saint-Lô, qui ont été en grande partie détruites. Dans les premiers jours, des soldats de la 12e division SS Panzer ont assassiné des prisonniers canadiens près de Caen, parmi eux à l’abbaye d’Ardenne ; environ un Canadien sur sept tué entre le 6 et le 11 juin est mort après qu’ils se soient rendus."
