"Cluj (Kolozsvár)": "Cluj (Kolozsvár)"
"About 18,000 Jews were held in a brickyard on the edge of the city before they were deported.": "Environ 18 000 Juifs étaient détenus dans un jardin de briques en bordure de la ville avant d’être expulsés."
"Košice (Kassa)": "Košice (Kassa)"
"May – July 1944": "mai – juillet 1944"
