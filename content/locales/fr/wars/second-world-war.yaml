"The bombing of Germany and the V-weapons": "Les bombardements de l’Allemagne et des armes V"
"From February 1942 RAF Bomber Command, led by Arthur Harris, bombed German cities at night, aiming at whole urban areas to destroy industry and break civilian morale. A thousand bombers struck Cologne on 30–31 May 1942. In 1943 the US Eighth Air Force joined by day, though its raids on the ball-bearing factories of Schweinfurt cost heavy losses, and in May British bombers breached the Möhne and Eder dams; the floods killed about 1,600 people, most of them forced labourers. In late July 1943 raids on Hamburg raised a firestorm that killed some 35,000–40,000 people.": "À partir de février 1942, le commandement des bombardiers de la RAF, dirigé par Arthur Harris, a bombardé les villes allemandes la nuit, visant des zones urbaines entières pour détruire l’industrie et briser le moral civil. En 1943, la 8e armée de l’air américaine s’est jointe le jour même, bien que ses raids sur les usines à billes de Schweinfurt aient coûté de lourdes pertes, et en mai, des bombardiers britanniques ont violé les barrages de Möhne et d’Eder ; les inondations ont tué environ 1 600 personnes, dont la plupart étaient des travailleurs forcés."
"The bombing grew heavier until 1945, against Berlin from November 1943, oil plants and railways, and cities such as Dresden, where raids on 13–15 February 1945 killed up to 25,000 people. Estimates of German civilian deaths range from about 305,000 to 350,000 or more, and Bomber Command lost 55,573 aircrew. Germany struck back with “vengeance weapons”. From June 1944 V-1 flying bombs killed about 6,200 people in the London area, and from September V-2 rockets hit London, Antwerp and Liège, killing about 9,000; some 12,000 forced labourers died building them.": "Les bombardements ont augmenté jusqu’en 1945, contre Berlin à partir de novembre 1943, les usines pétrolières et ferroviaires, et des villes comme Dresde, où les raids du 13 au 15 février 1945 ont tué jusqu’à 25 000 personnes. À partir de juin 1944, des bombes volantes V-1 ont tué environ 6 200 personnes dans la région de Londres et des roquettes V-2 de septembre ont frappé Londres, Anvers et Liège, tuant environ 9 000 personnes ; quelque 12 000 travailleurs forcés sont morts en les construisant."
