"Remains found in anti-tank trenches here in 2007 point to some 15,000 victims, by the estimate of a Slovenian commission; some historians think the number lower.": "Les restes trouvés dans les tranchées antichar ici en 2007 indiquent quelque 15 000 victimes, selon l’estimation d’une commission slovène ; certains historiens pensent que le nombre est inférieur."
"Kočevski Rog": "Kočevski Rog"
