"Most of the Jews deported from Hungary were gassed on arrival. They were the largest single group of people murdered at the camp.": "La plupart des Juifs expulsés de Hongrie ont été gazés à leur arrivée. Ils étaient le plus grand groupe de personnes assassinées au camp."
"Deportation trains, May – July 1944": "Trains de déportation, mai – juillet 1944"
