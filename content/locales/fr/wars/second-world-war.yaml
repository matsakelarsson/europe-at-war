"Soviet front, 31 December 1944 (approximate)": "Front soviétique, 31 décembre 1944 (approximatif)"
"The Warsaw Uprising": "L’insurrection de Varsovie"
"1 August – 2 October 1944": "1er août – 2 octobre 1944"
"By the end of July 1944 the Red Army had reached the Vistula south of Warsaw and was approaching the eastern suburb of Praga. The Home Army, the underground force loyal to the government-in-exile in London, rose in the city on 1 August, hoping to free it before the Soviets arrived and to show that Poland meant to be independent. Between 20,000 and 49,000 fighters, few of them well armed, took much of the centre and Old Town, but failed to capture the bridges and the main German strongpoints.": "À la fin de juillet 1944, l’armée rouge avait atteint la Vistule au sud de Varsovie et s’approchait de la banlieue orientale de Praga. L’Armée intérieure, la force souterraine fidèle au gouvernement en exil à Londres, se levait dans la ville le 1er août, espérant la libérer avant l’arrivée des Soviétiques et montrer que la Pologne voulait être indépendante. Entre 20 000 et 49 000 combattants, peu d’entre eux bien armés, ont pris une grande partie du centre et de la vieille ville, mais n’ont pas réussi à capturer les ponts et les principaux points forts allemands."
"Germany sent SS and police units to crush the rising, and in the Wola district they massacred some 40,000–50,000 civilians in the first days. The Soviet army halted east of the river and at first refused Allied supply aircraft the use of its airfields. It took Praga in mid-September, and Polish troops under Soviet command crossed to Czerniaków but were driven back. The Home Army surrendered on 2 October after 63 days. The Germans then drove out the remaining inhabitants and systematically destroyed the city.": "L’Allemagne a envoyé des SS et des unités de police pour écraser la montée, et dans le district de Wola, ils ont massacré environ 40 000 à 50 000 civils dans les premiers jours. L’armée soviétique s’est arrêtée à l’est du fleuve et a d’abord refusé l’utilisation de ses aérodromes par des avions alliés. Les Allemands ont ensuite chassé les habitants restants et systématiquement détruit la ville."
"Warsaw Uprising": "L’insurrection de Varsovie"
"Insurgents killed": "Des insurgés tués"
"about 16,000": "environ 16 000"
"about 150,000–200,000": "environ 150 000 à 200 000"
"The Home Army held parts of the city for 63 days. In the first days German units massacred tens of thousands of civilians in Wola.": "L’armée de l’intérieur a tenu des parties de la ville pendant 63 jours. Dans les premiers jours les unités allemandes massacré des dizaines de milliers de civils à Wola."
"Praga": "Praga"
"mid-September 1944": "mi-septembre 1944"
