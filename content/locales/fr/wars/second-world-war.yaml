"Omaha Beach": "Plage d’Omaha"
"The Americans suffered some 2,400 casualties here before they fought their way off the beach.": "Les Américains ont subi quelque 2 400 victimes ici avant de se battre pour quitter la plage."
"Sainte-Mère-Église": "Sainte-Mère-Église"
