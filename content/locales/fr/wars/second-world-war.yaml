"Bagration and the Baltic": "Bagage et la Baltique"
"June – December 1944": "juin – décembre 1944"
"By the spring of 1944 the Red Army had freed most of Ukraine and the Crimea and lifted the siege of Leningrad. On 22 June, three years to the day after the German invasion and two weeks after the Allied landings in Normandy, it opened Operation Bagration against Army Group Centre in Belarus, where the Germans had not expected the main blow. Their front collapsed. Soviet armies encircled German forces at Vitebsk and Bobruisk and east of Minsk, which they took on 3 July, and destroyed 28 German divisions. On 17 July some 57,000 German prisoners were marched through Moscow. By August the Red Army stood on the Vistula and at the border of East Prussia.": "Au printemps 1944, l’armée rouge avait libéré la majeure partie de l’Ukraine et de la Crimée et levé le siège de Leningrad. Le 22 juin, trois ans après l’invasion allemande et deux semaines après les débarquements alliés en Normandie, elle a ouvert l’opération Bagration contre le Centre du Groupe de l’Armée en Biélorussie, où les Allemands n’avaient pas prévu le coup principal. Leur front s’est effondré. Les armées soviétiques encerclèrent les forces allemandes à Vitebsk et Bobruisk et à l’est de Minsk, qu’elles prirent le 3 juillet, et détruisirent 28 divisions allemandes. Le 17 juillet, quelque 57 000 prisonniers allemands traversèrent Moscou. En août, l’armée rouge se tenait sur la Vistule et à la frontière de la Prusse orientale."
"In the north the Red Army pushed into the Baltic states. German troops and Estonian units held the Narva isthmus at the Tannenberg Line in July and August, but in September the Germans left Estonia, and Soviet troops entered Tallinn on 22 September and Riga on 13 October. Tens of thousands of Estonians and Latvians fled by sea to Sweden and Germany, and the returning Soviet rule brought new arrests and deportations. Army Group North, cut off in western Latvia, held out in the Courland pocket until the end of the war. In the south the Jassy–Kishinev offensive broke through in August and drove Romania out of the war on the German side.": "Les troupes allemandes et les unités estoniennes ont tenu l’isthme Narva à la ligne Tannenberg en juillet et août, mais en septembre les Allemands ont quitté l’Estonie, et les troupes soviétiques sont entrées à Tallinn le 22 septembre et à Riga le 13 octobre. Des dizaines de milliers d’Estoniens et de Lettons ont fui par mer vers la Suède et l’Allemagne, et le régime soviétique de retour a provoqué de nouvelles arrestations et déportations. Le groupe de l’armée nord, coupé dans l’ouest de la Lettonie, s’est tenu dans la poche de Courland jusqu’à la fin de la guerre."
"Operation Bagration": "Opération Bagration"
"22 June – 19 August 1944": "22 juin – 19 août 1944"
"German divisions destroyed": "Les divisions allemandes détruites"
"28, from Army Group Centre": "28, du Centre du Groupe de l’Armée"
"Tallinn and Riga retaken": "Tallinn et Riga ont repris"
"22 September and 13 October 1944": "22 septembre et 13 octobre 1944"
