"Aurunci Mountains": "Montagnes Aurunci"
"14–17 May 1944": "14–17 mai 1944"
"Moroccan and Algerian troops of the French Expeditionary Corps broke through mountains the Germans thought impassable.": "Les troupes marocaines et algériennes du Corps expéditionnaire français ont franchi les montagnes que les Allemands jugeaient impraticables."
"The Germans left Rome without a fight, and the US Fifth Army entered two days before the Normandy landings.": "Les Allemands quittèrent Rome sans se battre, et la cinquième armée américaine entra deux jours avant les débarquements de Normandie."
