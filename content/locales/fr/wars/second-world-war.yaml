"Sicily and the fall of Mussolini": "La Sicile et la chute de Mussolini"
"July – October 1943": "juillet – octobre 1943"
"After the Axis surrender in Tunisia, American, British and Canadian troops landed in Sicily on 10 July 1943. Patton’s Seventh Army took Palermo on 22 July while Montgomery’s Eighth Army fought its way up the east coast past Catania and Mount Etna. On 24–25 July the Fascist Grand Council turned against Mussolini, and the king dismissed and arrested him; Marshal Pietro Badoglio formed a government that secretly sought terms. Allied troops entered Messina on 17 August, but by then the Germans and Italians had ferried more than 100,000 men across the strait to the mainland.": "Après la reddition de l’Axe en Tunisie, les troupes américaines, britanniques et canadiennes débarquèrent en Sicile le 10 juillet 1943. Patton's Seventh Army prit Palerme le 22 juillet tandis que Montgomery's Huitth Army se battait sur la côte est après Catane et l’Etna. Les 24-25 juillet le Grand Conseil fasciste se retourna contre Mussolini, et le roi le congédia et l’arrêta ; le maréchal Pietro Badoglio forma un gouvernement qui chercha secrètement des termes. Les troupes alliées entrèrent dans Messine le 17 août, mais à l’époque les Allemands et les Italiens avaient envoyé plus de 100 000 hommes à travers le détroit vers le continent."
"The armistice signed at Cassibile on 3 September, the day the Eighth Army crossed into Calabria, was announced on 8 September, as the Allies prepared to land at Salerno. Germany was ready. Its troops disarmed the Italian army, occupied Rome and the north, and sent some 600,000 Italian soldiers who refused to fight on to Germany as military internees, where tens of thousands died. The king and Badoglio fled south. German paratroopers freed Mussolini from the Gran Sasso on 12 September to head a new Fascist state, the Italian Social Republic, governed from Salò on Lake Garda.": "L’armistice signé à Cassibile le 3 septembre, jour où la huitième armée a traversé la Calabre, a été annoncé le 8 septembre, alors que les Alliés se préparaient à atterrir à Salerno. L’Allemagne était prête. Ses troupes ont désarmé l’armée italienne, occupé Rome et le nord, et envoyé quelque 600 000 soldats italiens qui ont refusé de combattre en Allemagne comme internés militaires, où des dizaines de milliers sont morts. Le roi et Badoglio ont fui vers le sud. Les parachutistes allemands ont libéré Mussolini du Gran Sasso le 12 septembre pour diriger un nouvel État fasciste, la République sociale italienne, gouverné de Salò sur le lac de Garde."
"At Salerno the Germans counter-attacked the beachhead hard before withdrawing north. In Naples the population rose against the occupiers in the Four Days of 27–30 September, and Allied troops entered the city on 1 October. By early October the front ran along the Volturno and across to Termoli on the Adriatic. In Corsica the resistance, Free French troops and Italian units drove out the Germans by the start of October. On 16 October the SS raided the Rome ghetto and deported 1,023 Jews to Auschwitz; only 16 survived.": "A Salerno, les Allemands ont contre-attaqué la tête de plage avant de se retirer vers le nord. À Naples, la population s’est élevée contre les occupants des quatre jours du 27 au 30 septembre et les troupes alliées sont entrées dans la ville le 1er octobre. Au début d’octobre, le front a couru le long du Volturno et à travers Termoli sur l’Adriatique. Le 16 octobre, les SS ont attaqué le ghetto de Rome et expulsé 1 023 Juifs à Auschwitz ; seulement 16 ont survécu."
