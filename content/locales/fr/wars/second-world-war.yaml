"Marseille": "Marseille"
"28 August 1944": "28 août 1944"
"French troops and the Resistance freed the port after a week of street fighting, the same day as Toulon.": "Les troupes françaises et la Résistance ont libéré le port après une semaine de combats de rue, le même jour que Toulon."
"Leclerc’s division and the Resistance freed the city; Choltitz signed the surrender at the Gare Montparnasse.": "La division de Leclerc et la Résistance ont libéré la ville ; Choltitz a signé la reddition à la Gare Montparnasse."
"Oradour-sur-Glane": "Oradour-sur-Glane"
"SS troops killed 642 men, women and children and burned the village, which has been left in ruins as a memorial.": "Les soldats SS ont tué 642 hommes, femmes et enfants et brûlé le village, qui a été laissé en ruines comme mémorial."
"Vercors": "Vercors"
"July 1944": "juillet 1944"
"German airborne and mountain troops crushed the maquis on the plateau, killing more than 600 fighters and about 200 civilians.": "Les troupes allemandes aéroportées et montagnardes ont écrasé le maquis sur le plateau, tuant plus de 600 combattants et environ 200 civils."
"Brussels": "Bruxelles"
"3 September 1944": "3 septembre 1944"
"The British Guards Armoured Division entered the city to a jubilant welcome.": "La division blindée de la Garde britannique est entrée dans la ville pour un accueil joyeux."
"4 September 1944": "4 septembre 1944"
"The British took the port almost undamaged with help from the Belgian resistance, but it could not be used until the Scheldt was cleared.": "Les Britanniques ont pris le port presque intact avec l’aide de la résistance belge, mais il ne pouvait pas être utilisé avant que l’Escaut soit libéré."
"Luxembourg": "Luxembourg"
"10 September 1944": "10 septembre 1944"
"American troops freed the capital, ending two years of German annexation.": "Les troupes américaines ont libéré la capitale, mettant fin à deux années d’annexion allemande."
"Dragoon": "Dragoon"
"Leclerc": "Leclerc"
"Hodges": "Bougies"
"Allied front, mid-September 1944 (approximate)": "Front allié, mi-septembre 1944 (approximatif)"
"German garrisons holding out until 1945": "Garçons allemands tenant jusqu’en 1945"
"Romania and Bulgaria change sides": "La Roumanie et la Bulgarie changent de camp"
"August – October 1944": "août – octobre 1944"
"Romania had sent its armies against the Soviet Union in 1941, and two of them were shattered at Stalingrad. Under Marshal Ion Antonescu, Romanian forces and officials also murdered Jews on a vast scale, in the Iași pogrom of June 1941 and in Bessarabia, Bukovina and Transnistria; most estimates of the dead range from 250,000 to 380,000. When the Soviet offensive broke through near Iași in August 1944, King Michael had Antonescu arrested on 23 August and took Romania over to the Allies. German aircraft bombed Bucharest in reply, Romania declared war on Germany, and the Red Army reached the Ploiești oilfields on 30 August and Bucharest the next day.": "La Roumanie avait envoyé ses armées contre l’Union soviétique en 1941, et deux d’entre eux ont été brisés à Stalingrad. Sous le maréchal Ion Antonescu, les forces roumaines et les officiels ont également assassiné des juifs à grande échelle, dans le pogrom de Iași de juin 1941 et à Bessarabia, Bukovina et Transnistrie ; la plupart des estimations des morts vont de 250 000 à 380 000. Lorsque l’offensive soviétique a éclaté près d’Iași en août 1944, le roi Michael a arrêté Antonescu le 23 août et conduit la Roumanie aux Alliés. Des avions allemands ont bombardé Bucarest en réponse, la Roumanie a déclaré la guerre à l’Allemagne, et l’armée rouge a atteint les champs de pétrole de Ploiești le 30 août et Bucarest le lendemain."
"Bulgaria had joined the Axis but never declared war on the Soviet Union, and its army occupied parts of Yugoslavia and Greece rather than fighting in the east. After protests by members of parliament and church leaders in 1943 it did not hand over its own 48,000 Jews, but it deported more than 11,000 from the occupied lands to be murdered at Treblinka. On 5 September 1944 the Soviet Union declared war on Bulgaria, and Soviet troops crossed the border three days later without meeting resistance. On 9 September the communist-led Fatherland Front seized power in Sofia, Bulgaria changed sides, and its army fought on against the Germans in Yugoslavia and Hungary.": "La Bulgarie avait rejoint l’Axe mais n’avait jamais déclaré la guerre à l’Union soviétique, et son armée occupait des parties de Yougoslavie et de Grèce plutôt que de se battre à l’est. Après les protestations des parlementaires et des chefs religieux en 1943, elle n’a pas livré ses propres 48 000 juifs, mais a expulsé plus de 11 000 des terres occupées pour être assassinées à Treblinka. Le 5 septembre 1944, l’Union soviétique déclare la guerre à la Bulgarie et les troupes soviétiques franchissent la frontière trois jours plus tard sans rencontrer de résistance.Le 9 septembre, le Front communiste de la Patrie prend le pouvoir à Sofia, la Bulgarie change de camp et son armée combat contre les Allemands en Yougoslavie et en Hongrie."
"With Romania’s turn the German front in the Balkans fell apart. Romanian and Soviet troops pushed into northern Transylvania, held by Hungary since 1940, fought for a month around Turda and took Cluj on 11 October. On the plains of eastern Hungary a great tank battle around Debrecen in October slowed the Soviet advance but did not stop it. In both Romania and Bulgaria Soviet occupation opened the way to communist rule.": "Les troupes roumaines et soviétiques ont poussé dans le nord de la Transylvanie, tenue par la Hongrie depuis 1940, a combattu pendant un mois autour de Turda et pris Cluj le 11 octobre. Dans les plaines de l’est de la Hongrie, une grande bataille de chars autour de Debrecen en octobre a ralenti l’avance soviétique mais ne l’a pas arrêtée."
"Romanian coup": "Coup d’État roumain"
"23 August 1944": "23 août 1944"
"Fatherland Front coup in Bulgaria": "Coup d’État du Front de la Patrie en Bulgarie"
"9 September 1944": "9 septembre 1944"
"Jews killed under Romanian rule": "Juifs tués sous le régime roumain"
"about 250,000–380,000 (estimates)": "environ 250 000 à 380 000 (estimations)"
"Bucharest": "Bucarest"
"King Michael had Antonescu arrested at the palace and announced the change of sides on the radio. German bombers struck the city on 24–26 August.": "Le roi Michael fit arrêter Antonescu au palais et annonça le changement de camp à la radio. Les bombardiers allemands frappaient la ville du 24 au 26 août."
"Ploiești": "Ploiești"
"30 August 1944": "30 août 1944"
"The refineries that had supplied much of Germany’s oil, bombed by the Americans since 1943, fell to Soviet and Romanian troops.": "Les raffineries qui avaient fourni une grande partie du pétrole allemand, bombardé par les Américains depuis 1943, sont tombées aux troupes soviétiques et roumaines."
"Iași": "Iași"
"June – July 1941": "juin – juillet 1941"
"Romanian police and soldiers, with German troops, killed more than 13,000 Jews in the city and in sealed ‘death trains’.": "La police et les soldats roumains, avec des troupes allemandes, ont tué plus de 13 000 Juifs dans la ville et dans des trains scellés de mort."
"Sofia": "Sofia"
"The Fatherland Front, with army officers of the Zveno group, took power overnight, and Kimon Georgiev became prime minister.": "Le Front de la Patrie, avec des officiers de l’armée du groupe Zveno, a pris le pouvoir pendant la nuit, et Kimon Georgiev est devenu premier ministre."
"Turda": "Turda"
"5 September – 8 October 1944": "5 septembre – 8 octobre 1944"
"Soviet and Romanian troops fought for a month against Hungarian and German forces holding the approaches to Cluj.": "Les troupes soviétiques et roumaines se sont battues pendant un mois contre les forces hongroises et allemandes tenant les approches de Cluj."
"Debrecen": "Debrecen"
"6–29 October 1944": "6–29 octobre 1944"
"One of the largest tank battles of the war in the south. The Soviets took Debrecen on 20 October, though German counter-attacks around Nyíregyháza cost them heavily.": "L’une des plus grandes batailles de chars de la guerre dans le sud. Les Soviétiques ont pris Debrecen le 20 octobre, bien que les contre-attaques allemandes autour de Nyíregyháza leur coûtent lourd."
"2nd Ukrainian Front": "2e Front ukrainien"
"3rd Ukrainian Front": "3e Front ukrainien"
"The Slovak National Uprising": "Le soulèvement national slovaque"
"29 August – 28 October 1944": "29 août – 28 octobre 1944"
"Slovakia, a German client state under the priest Jozef Tiso, had handed some 58,000 of its Jews over to the Germans in 1942, nearly all of whom were murdered. By 1944 army officers, communists and democrats had formed an underground Slovak National Council and planned a rising for when the Red Army reached the Carpathians. Partisan attacks brought German troops into the country first, and on 29 August 1944 the council called the rising from Banská Bystrica. Some 60,000 soldiers and up to 18,000 partisans held much of central Slovakia, but the two divisions in the east that were to open the Carpathian passes to the Soviets were disarmed by the Germans.": "La Slovaquie, un État client allemand sous le prêtre Jozef Tiso, avait remis quelque 58 000 de ses juifs aux Allemands en 1942, dont presque tous ont été assassinés. En 1944, les officiers de l’armée, les communistes et les démocrates avaient formé un Conseil national slovaque clandestin et planifié une montée pour quand l’Armée rouge a atteint les Carpates. Les attaques partisanes ont amené les troupes allemandes dans le pays d’abord, et le 29 août 1944 le conseil a appelé la montée de Banská Bystrica. Environ 60 000 soldats et jusqu’à 18 000 partisans ont tenu une grande partie du centre de la Slovaquie, mais les deux divisions à l’est qui devaient ouvrir les passes carpatiennes aux Soviétiques ont été désarmés par les Allemands."
"The Soviet army and the 1st Czechoslovak Army Corps attacked across the Dukla Pass on 8 September to reach the insurgents, but it took them until 6 October to fight their way through, with heavy losses, and they could not break through to central Slovakia. Supplies and the 2nd Czechoslovak Parachute Brigade were flown in to the Tri Duby airfield. Reinforced German forces closed in during October, and Banská Bystrica fell on 27 October. The insurgent army dissolved into the mountains; its commanders, Generals Ján Golian and Rudolf Viest, were captured and died in German hands.": "L’armée soviétique et le 1er Corps de l’Armée tchécoslovaque ont attaqué le col de Dukla le 8 septembre pour atteindre les insurgés, mais il leur a fallu jusqu’au 6 octobre pour se battre, avec de lourdes pertes, et ils n’ont pas pu passer par le centre de la Slovaquie. Les forces allemandes renforcées se sont fermées en octobre et Banská Bystrica est tombée le 27 octobre. L’armée insurgée s’est dissoute dans les montagnes ; ses commandants, les généraux Ján Golian et Rudolf Viest, ont été capturés et sont morts entre les mains allemandes."
"Reprisals followed. Einsatzkommando 14 and the Hlinka Guard’s emergency units shot 747 people at Kremnička, near Banská Bystrica, and killed and burned some 900 at Nemecká; many of the dead were Jews and Roma. The rising gave the Germans a pretext to deport most of Slovakia’s remaining Jews, more than 10,000 of them, to Auschwitz and other camps. In the insurgent area itself up to 1,500 people, most of them local Germans, had been killed.": "Einsatzkommando 14 et les unités d’urgence de la Garde Hlinka ont abattu 747 personnes à Kremnička, près de Banská Bystrica, et tué et brûlé environ 900 à Nemecká ; beaucoup des morts étaient juifs et Roms. La montée a donné aux Allemands un prétexte pour expulser la plupart des autres Juifs de Slovaquie, plus de 10 000 d’entre eux, vers Auschwitz et d’autres camps. Dans la région des insurgés elle-même jusqu’à 1 500 personnes, dont la plupart des Allemands locaux, ont été tués."
"Slovak National Uprising": "Slovaquie"
"Insurgent forces": "Forces insurgées"
"about 60,000 soldiers and 7,000–18,000 partisans": "environ 60 000 soldats et 7 000 à 18 000 partisans"
"Dukla Pass reached": "Le col de Dukla atteint"
"6 October 1944": "6 octobre 1944"
"Banská Bystrica": "Banská Bystrica"
"29 August – 27 October 1944": "29 août – 27 octobre 1944"
"Seat of the Slovak National Council and headquarters of the insurgent army, until German troops took the town on 27 October.": "Siège du Conseil national slovaque et siège de l’armée des insurgés, jusqu’à ce que les troupes allemandes prennent la ville le 27 octobre."
"Tri Duby": "Tri Duby"
"September – October 1944": "septembre – octobre 1944"
"The insurgents’ airfield near Sliač, where Soviet and American aircraft landed supplies and the 2nd Czechoslovak Parachute Brigade.": "L’aérodrome des insurgés près de Sliač, où des avions soviétiques et américains ont atterri des fournitures et la 2e Brigade tchécoslovaque du parachute."
"Martin": "Le Président"
"27–28 August 1944": "27–28 août 1944"
"Slovak soldiers stopped a train carrying a German military mission back from Romania and shot its 22 officers, one of the events that set off the rising.": "Des soldats slovaques ont arrêté un train transportant une mission militaire allemande de retour de Roumanie et abattu ses 22 officiers, l’un des événements qui a déclenché la montée."
"Dukla Pass": "Pass Dukla"
"8 September – 6 October 1944": "8 septembre – 6 octobre 1944"
"The Soviet 38th Army and the 1st Czechoslovak Army Corps under Ludvík Svoboda fought for a month to cross the Carpathians, at a cost of tens of thousands killed and wounded.": "La 38e armée soviétique et le 1er corps d’armée tchécoslovaque sous la direction de Ludvík Svoboda se sont battus pendant un mois pour traverser les Carpates, au prix de dizaines de milliers de morts et de blessés."
"Kremnička and Nemecká": "Kremnička et Nemecká"
"November 1944 – February 1945": "novembre 1944 – février 1945"
"Einsatzkommando 14 and Hlinka Guard units shot 747 people at Kremnička and killed about 900 at Nemecká, where the bodies were burned in a lime kiln.": "Les unités d’Einsatzkommando 14 et de Hlinka Guard ont abattu 747 personnes à Kremnička et tué environ 900 personnes à Nemecká, où les corps ont été brûlés dans un four à chaux."
"German forces": "Forces allemandes"
"Soviet and Czechoslovak troops": "Des troupes soviétiques et tchécoslovaques"
"Held by the insurgents, early September 1944 (approximate)": "Tenue par les insurgés, début septembre 1944 (approximative)"
"Insurgent success": "Succès des insurgés"
"Insurgent moves": "Mouvements des insurgés"
"Market Garden and the hunger winter": "Jardin du marché et l’hiver de la faim"
"September 1944 – May 1945": "septembre 1944 – mai 1945"
"Montgomery hoped to end the war in 1944 by outflanking the German frontier defences through the Netherlands. In Operation Market Garden, launched on 17 September, some 35,000 American, British and Polish airborne troops were landed to seize the bridges between Eindhoven and Arnhem, while the British XXX Corps drove north along a single road to join them. The Americans took most of their bridges, and the Waal bridge at Nijmegen fell on 20 September. But at Arnhem the British 1st Airborne Division had landed close to two SS panzer divisions, and only one battalion reached the Rhine bridge.": "Montgomery espérait mettre fin à la guerre en 1944 en dépassant les défenses de la frontière allemande à travers les Pays-Bas. Dans l’opération Market Garden, lancée le 17 septembre, quelque 35 000 soldats américains, britanniques et polonais furent débarqués pour s’emparer des ponts entre Eindhoven et Arnhem, tandis que le XXX Corps britannique conduisait vers le nord sur une seule route pour les rejoindre. Les Américains ont pris la plupart de leurs ponts, et le pont Waal à Nimègue est tombé le 20 septembre. Mais à Arnhem la 1ère Division aéroportée britannique avait atterri près de deux divisions SS panzer, et un seul bataillon a atteint le pont du Rhin."
"The battalion held the north end of the bridge for four days, and XXX Corps could not break through in time. On the night of 25–26 September about 2,400 survivors of the 1st Airborne were taken back across the Rhine; the division had lost nearly three-quarters of its men. Further west, Canadian and British troops cleared the Scheldt estuary between October and early November, opening Antwerp to Allied shipping. In reprisal for a resistance attack, German troops rounded up the men of Putten on 1–2 October and deported 602 of them to camps; only 48 came back.": "Dans la nuit du 25 au 26 septembre, environ 2 400 survivants du 1er Airborne ont été ramenés à travers le Rhin ; la division avait perdu près des trois quarts de ses hommes. Plus à l’ouest, les troupes canadiennes et britanniques ont déminé l’estuaire de l’Escaut entre octobre et début novembre, ouvrant Anvers à la navigation alliée. En représailles à une attaque de résistance, les troupes allemandes ont rassemblé les hommes de Putten le 1er-2 octobre et expulsé 602 d’entre eux dans des camps ; seulement 48 sont revenus."
"The north and west of the Netherlands stayed occupied. After the Dutch government in exile called a railway strike in support of the offensive, the Germans blocked food transport, and in the “hunger winter” of 1944–1945 about 20,000 people died of hunger and cold, most of them in the cities of Holland. People walked into the countryside to barter for food and ate tulip bulbs. In late April 1945, under a truce with the Germans, Allied bombers dropped food in Operation Manna, and on 5 May the German forces in the Netherlands surrendered.": "Le nord et l’ouest des Pays-Bas sont restés occupés. Après que le gouvernement néerlandais en exil a appelé une grève ferroviaire à l’appui de l’offensive, les Allemands ont bloqué le transport de nourriture, et dans le \"hunger hiver\" 1944-1945 environ 20 000 personnes sont mortes de faim et de froid, la plupart d’entre eux dans les villes de Hollande. Fin avril 1945, sous une trêve avec les Allemands, des bombardiers alliés larguèrent des vivres dans l’opération Manna et, le 5 mai, les forces allemandes se rendirent aux Pays-Bas."
"Market Garden": "Jardin du marché"
"17–25 September 1944": "17–25 septembre 1944"
"Dead in the hunger winter": "Mort dans la faim hiver"
"about 20,000": "environ 20 000"
"Liberation of the western Netherlands": "Libération de l’ouest des Pays-Bas"
"5 May 1945": "5 mai 1945"
"Arnhem bridge": "Pont d’Arnhem"
"17–21 September 1944": "17–21 septembre 1944"
"British paratroopers held the north end of the road bridge for four days before they were overwhelmed.": "Les parachutistes britanniques ont maintenu l’extrémité nord du pont routier pendant quatre jours avant d’être dépassés."
"Oosterbeek": "Oosterbeek"
"18–26 September 1944": "18–26 septembre 1944"
"The rest of the 1st Airborne held a shrinking perimeter here until its survivors were ferried across the Rhine.": "Le reste de la 1ère Airborne tenait un périmètre rétrécissant jusqu’à ce que ses survivants soient transbordés à travers le Rhin."
"Nijmegen": "Nimègue"
"20 September 1944": "20 septembre 1944"
"American paratroopers crossed the Waal in canvas boats under fire, and British tanks took the road bridge.": "Des parachutistes américains ont traversé le Waal en bateaux en toile sous le feu, et des chars britanniques ont pris le pont routier."
"Eindhoven": "Eindhoven"
"18 September 1944": "18 septembre 1944"
"The first large Dutch city to be freed, by American paratroopers and British tanks.": "La première grande ville néerlandaise à être libérée, par les parachutistes américains et les chars britanniques."
"Putten": "Putten"
"1–2 October 1944": "1–2 octobre 1944"
"German troops deported 602 men from the village to camps in reprisal for a resistance attack; 48 returned.": "Les troupes allemandes ont expulsé 602 hommes du village dans des camps en représailles pour une attaque de résistance ; 48 sont revenus."
"Westkapelle": "Westkapelle"
"1 November 1944": "1er novembre 1944"
"British commandos landed on Walcheren, flooded by Allied bombing of its sea dyke, in the last stage of the Battle of the Scheldt.": "Des commandos britanniques débarquent sur Walcheren, inondés par les bombardements alliés de sa digue maritime, dans la dernière étape de la bataille de l’Escaut."
"winter 1944–1945": "hiver 1944-1945"
"In the hunger winter thousands died of starvation and cold in the cities of the west, where food and fuel ran out.": "Pendant l’hiver de la faim, des milliers de personnes sont mortes de faim et de froid dans les villes de l’ouest, où la nourriture et le carburant étaient épuisés."
"XXX Corps": "XXX Corps"
"Occupied by Germany until April – May 1945": "Occupé par l’Allemagne jusqu’à avril – mai 1945"
"Allied front, late September 1944 (approximate)": "Front allié, fin septembre 1944 (approximatif)"
"American, British, Canadian and Polish moves": "Mouvements américains, britanniques, canadiens et polonais"
"The liberation of Greece, Belgrade and Albania": "La libération de la Grèce, Belgrade et l’Albanie"
"May – November 1944": "mai – novembre 1944"
"In May 1944 German paratroopers landed at Drvar in an attempt to seize Tito, who escaped and moved to the Adriatic island of Vis, protected by the Allies. Britain and the United States now supplied the Partisans and flew out their wounded, and King Peter’s government in exile came to terms with Tito. In September, as Romania and Bulgaria changed sides, Germany ordered its armies in Greece and the southern Balkans to withdraw north before they were cut off. Tito flew secretly to Moscow and agreed with Stalin that the Red Army would help to free Belgrade and leave the civil administration to the Partisans.": "En mai 1944, des parachutistes allemands débarquent à Drvar pour tenter de saisir Tito, qui s’est échappé et a déménagé sur l’île Adriatique de Vis, protégée par les Alliés. La Grande-Bretagne et les États-Unis fournissent maintenant les Partisans et volent leurs blessés. En septembre, alors que la Roumanie et la Bulgarie ont changé de camp, l’Allemagne a ordonné à ses armées en Grèce et dans les Balkans du Sud de se retirer du nord avant d’être coupées. Tito s’est rendu secrètement à Moscou et a convenu avec Staline que l’Armée rouge aiderait à libérer Belgrade et laisserait l’administration civile aux Partisans."
"The Germans left Athens on 12 October, British troops landed at Piraeus two days later, and the government of national unity under Georgios Papandreou arrived on 18 October. ELAS entered Thessaloniki on 30 October, and by early November the Germans had left mainland Greece, though they held western Crete and some islands until May 1945. In Albania communist-led partisans under Enver Hoxha took Tirana on 17 November and the whole country by the end of the month. In Greece the uneasy truce between ELAS and the government lasted only weeks.": "Les Allemands quittèrent Athènes le 12 octobre, les troupes britanniques débarquèrent au Pirée deux jours plus tard, et le gouvernement d’unité nationale sous Georgios Papandreou arriva le 18 octobre. ELAS entra à Thessalonique le 30 octobre et, au début de novembre, les Allemands avaient quitté la Grèce continentale, bien qu’ils aient conservé la Crète occidentale et certaines îles jusqu’en mai 1945. En Albanie, des partisans dirigés par les communistes sous Enver Hoxha ont pris Tirana le 17 novembre et l’ensemble du pays à la fin du mois."
"In Serbia the Soviet 3rd Ukrainian Front and the Partisans’ 1st Army Group, with Bulgarian armies to the south, attacked in October, and after a week of street fighting Belgrade was freed on 20 October. Soviet troops then turned north into Hungary, while the Partisans faced a German front across Syrmia. Behind the front the new authorities shot thousands of people accused of collaboration across Serbia, and in Vojvodina Partisan units killed thousands of ethnic Hungarians and interned the local Germans in camps, where many died.": "En Serbie, le 3e Front soviétique ukrainien et le groupe des Partisans (le 1er Groupe de l’Armée), avec des armées bulgares au sud, ont attaqué en octobre, et après une semaine de combats de rue Belgrade a été libéré le 20 octobre. Derrière le front, les nouvelles autorités ont abattu des milliers de personnes accusées de collaboration à travers la Serbie et, en Voïvodine, des unités du Parti ont tué des milliers de Hongrois de souche et interné les Allemands locaux dans des camps où beaucoup sont morts."
"Athens freed": "Athènes libérée"
"12 October 1944": "12 octobre 1944"
"Belgrade freed": "Belgrade libéré"
"20 October 1944": "20 octobre 1944"
"Tirana freed": "Tirana libéré"
"17 November 1944": "17 novembre 1944"
"The December fighting in Athens and the Greek Civil War": "Les combats de décembre à Athènes et la guerre civile grecque"
"Drvar": "Drvar"
"25 May 1944": "25 mai 1944"
"German paratroopers and glider troops attacked Tito’s headquarters in a cave above the town. Tito escaped, but many Partisans and civilians were killed.": "Des parachutistes allemands et des soldats de planeurs ont attaqué le quartier général de Tito dans une grotte au-dessus de la ville."
"Vis": "Visuel"
"June – September 1944": "juin – septembre 1944"
"Tito’s headquarters under Allied protection, with an airfield for supply flights. From here he flew to Moscow in September.": "Le QG de Tito est sous la protection des Alliés, avec un aérodrome pour les vols d’approvisionnement."
"Niš": "Niš"
"14 October 1944": "14 octobre 1944"
"Bulgarian, Partisan and Soviet troops took the city, cutting one of the main German routes of retreat from Greece.": "Les troupes bulgares, partisanes et soviétiques ont pris la ville, coupant l’une des principales routes allemandes de retraite de la Grèce."
"Partisan units and the Soviet 4th Guards Mechanised Corps freed the capital after a week of fighting in its streets.": "Les unités du Parti et le Corps mécanisé de la 4e Garde soviétique ont libéré la capitale après une semaine de combats dans ses rues."
"12–14 October 1944": "12–14 octobre 1944"
"The Germans left on 12 October. British paratroopers and seaborne troops arrived over the next days to cheering crowds.": "Les Allemands sont partis le 12 octobre. Des parachutistes britanniques et des troupes maritimes sont arrivés les jours suivants pour encourager la foule."
"30 October 1944": "30 octobre 1944"
"ELAS units entered the city as the last German troops pulled out.": "Les unités d’ELAS sont entrées dans la ville à mesure que les dernières troupes allemandes se retiraient."
"Tirana": "Tirana"
"Albanian partisans took the capital after three weeks of fighting. The communists then ruled Albania until 1991.": "Les partisans albanais ont pris la capitale après trois semaines de combats. Les communistes ont ensuite gouverné l’Albanie jusqu’en 1991."
"German withdrawal": "Retrait allemand"
"1st Army Group": "1er Groupe de l’Armée"
"Partisan and resistance success": "Partisan et succès de résistance"
"Liberation in Denmark and Norway": "Libération au Danemark et en Norvège"
"In October 1944 the Soviet army drove the Germans out of the far north-east of Norway and freed Kirkenes on 25 October. As they withdrew, the Germans forced thousands of people in Finnmark and northern Troms to leave and burned their homes, harbours and bridges. In Denmark the resistance stepped up sabotage of railways and factories. On 21 March 1945 British bombers destroyed the Gestapo headquarters in Copenhagen, but in the raid a school was also hit, and 87 children and 18 adults there were killed.": "En octobre 1944, l’armée soviétique a chassé les Allemands de l’extrême nord-est de la Norvège et libéré Kirkenes le 25 octobre. Alors qu’ils se retiraient, les Allemands ont forcé des milliers de personnes au Finnmark et au Nord Troms à quitter et brûler leurs maisons, ports et ponts. Le 21 mars 1945, des bombardiers britanniques ont détruit le quartier général de la Gestapo à Copenhague, mais lors du raid une école a également été touchée et 87 enfants et 18 adultes y ont été tués."
"On 4 May 1945 the German forces in north-west Germany, the Netherlands and Denmark surrendered to Field Marshal Montgomery at Lüneburg Heath, and those in Norway capitulated on 8 May. The large German garrison in Norway laid down its arms without fighting. King Haakon returned on 7 June, five years to the day after he had left. Bornholm was bombed by Soviet aircraft on 7–8 May; Soviet troops landed on 9 May and stayed until April 1946.": "Le 4 mai 1945, les forces allemandes dans le nord-ouest de l’Allemagne, les Pays-Bas et le Danemark se rendirent au maréchal Montgomery à Lüneburg Heath, et celles de Norvège capitulèrent le 8 mai. La grande garnison allemande en Norvège laissa ses armes sans se battre. Bornholm a été bombardé par des avions soviétiques les 7-8 mai ; les troupes soviétiques ont atterri le 9 mai et sont restées jusqu’en avril 1946."
"German surrender for Denmark": "La reddition allemande pour le Danemark"
"4 May 1945, in force 5 May": "4 mai 1945, en vigueur le 5 mai"
"German capitulation in Norway": "Capitulation allemande en Norvège"
"8 May 1945": "8 mai 1945"
"Soviet troops leave Bornholm": "Les troupes soviétiques quittent Bornholm"
"5 April 1946": "5 avril 1946"
"Kirkenes": "Kirkenes"
"25 October 1944": "25 octobre 1944"
"The first Norwegian town to be freed, taken in the Soviet Petsamo–Kirkenes offensive.": "Première ville norvégienne libérée, prise dans l’offensive soviétique Petsamo–Kirkenes."
"Finnmark": "Finnmark"
"October 1944 – February 1945": "octobre 1944 – février 1945"
"The retreating Germans burned towns and villages and forced the population south. Thousands hid in the hills rather than leave.": "Les Allemands en retraite ont brûlé des villes et des villages et forcé la population au sud. Des milliers se sont cachés dans les collines plutôt que de partir."
"21 March 1945": "21 mars 1945"
"RAF Mosquitoes destroyed the Gestapo headquarters in the Shellhus. A crashed aircraft set fire near a school, which later bombers hit.": "La RAF Mosquitoes a détruit le quartier général de la Gestapo dans les Shellhus. Un avion accidenté a mis le feu près d’une école, qui plus tard bombardait."
"Lüneburg Heath": "Lüneburg Heath"
"4 May 1945": "4 mai 1945"
"German commanders signed the surrender of their forces in north-west Germany, the Netherlands and Denmark to Montgomery.": "Les commandants allemands ont signé la reddition de leurs forces dans le nord-ouest de l’Allemagne, aux Pays-Bas et au Danemark à Montgomery."
"The German command in Norway accepted the surrender, and the Norwegian resistance took over key points as the occupiers laid down their arms.": "Le commandement allemand en Norvège accepta la reddition, et la résistance norvégienne reprit des points clés alors que les occupants déposent leurs armes."
"Rønne": "Rønne"
"9 May 1945": "9 mai 1945"
"After bombing Rønne and Nexø, Soviet troops landed and took the surrender of the German garrison of about 12,000.": "Après avoir bombardé Rønne et Nexø, les troupes soviétiques ont débarqué et pris la reddition de la garnison allemande d’environ 12 000."
"Soviet-occupied until April 1946": "Occupé par les Soviétiques jusqu’en avril 1946"
"The Battle of the Bulge": "La bataille des Bulges"
"16 December 1944 – 25 January 1945": "16 décembre 1944 – 25 janvier 1945"
"On 16 December 1944 Germany launched its last great offensive in the west, through the thinly held Ardennes, aiming to split the Allied armies and retake Antwerp. Fog and low cloud grounded Allied aircraft, and three German armies broke through the American lines. On 17 December men of the SS battle group Peiper shot 84 captured American soldiers at Baugnez near Malmedy, and the group killed Belgian civilians around Stavelot. American troops held the northern shoulder at Elsenborn and delayed the Germans at St. Vith, which fell on 21 December.": "Le 16 décembre 1944, l’Allemagne lançait sa dernière grande offensive à l’ouest, à travers les Ardennes peu tenues, dans le but de diviser les armées alliées et de reprendre Anvers. Des avions alliés au sol et trois armées allemandes ont franchi les lignes américaines. Le 17 décembre, des hommes du groupe tactique SS Peiper ont abattu 84 soldats américains à Baugnez près de Malmedy, et le groupe a tué des civils belges autour de Stavelot. Les troupes américaines tenaient l’épaule nord à Elsenborn et retardaient les Allemands à Saint-Vith, qui tombaient le 21 décembre."
"Surrounded at Bastogne from 20 December, the US 101st Airborne Division and other units refused to surrender. The skies cleared on 23 December, letting Allied aircraft attack the German columns and drop supplies, and on 24 December the US 2nd Armored Division stopped the German spearhead near Celles, a few kilometres short of the Meuse at Dinant. Patton’s Third Army turned north and broke through to Bastogne on 26 December. The Allies then pushed the bulge back, and by 25 January the line had been restored. Each side lost some 80,000 men or more, killed, wounded or captured.": "Encerclée à Bastogne le 20 décembre, la 101ème Division aéroportée américaine et d’autres unités ont refusé de se rendre. Le ciel s’est dégagé le 23 décembre, laissant les avions alliés attaquer les colonnes allemandes et déposer des fournitures, et le 24 décembre, la 2ème Division blindée américaine a arrêté le fer de lance allemand près de Celles, à quelques kilomètres de la Meuse à Dinant. Les Alliés ont ensuite repoussé la poussée et, le 25 janvier, la ligne avait été restaurée. Chaque côté a perdu environ 80 000 hommes ou plus, tués, blessés ou capturés."
"Battle of the Bulge": "Bataille des Bulges"
"American casualties": "Victimes américaines"
"about 77,000–83,000 or more": "environ 77 000–83 000 ou plus"
"German casualties": "Victimes allemandes"
"about 82,000–125,000": "environ 82 000 à 125 000"
"Baugnez": "Baugnez"
"17 December 1944": "17 décembre 1944"
"Soldiers of the battle group Peiper machine-gunned 84 American prisoners at the crossroads, the Malmedy massacre.": "Des soldats du groupe de combat Peiper ont mitraillé 84 prisonniers américains à la croisée des chemins, le massacre de Malmedy."
"Elsenborn Ridge": "Elsenborn Ridge"
"16–26 December 1944": "16–26 décembre 1944"
"American divisions held the northern shoulder of the bulge, blocking the shortest roads to the Meuse.": "Les divisions américaines tenaient l’épaule nord de la bosse, bloquant les routes les plus courtes jusqu’à la Meuse."
"La Gleize": "La Gleize"
"19–24 December 1944": "19–24 décembre 1944"
"Cut off and out of fuel, the battle group Peiper abandoned its tanks and escaped on foot.": "Le groupe de combat Peiper a abandonné ses chars et s’est échappé à pied."
"St. Vith": "Saint-Vith"
"17–21 December 1944": "17–21 décembre 1944"
"American defenders held up the Fifth Panzer Army at the road junction for five days before withdrawing.": "Les défenseurs américains ont retenu la cinquième armée panzer à la jonction routière pendant cinq jours avant de se retirer."
"Bastogne": "Bastogne"
"20–26 December 1944": "20–26 décembre 1944"
"Asked to surrender, General McAuliffe replied “Nuts!”. Patton’s tanks broke the encirclement on 26 December.": "Interrogé pour se rendre, le général McAuliffe a répondu : \"Nuts ! \". Les chars de Patton ont brisé l’encerclement le 26 décembre."
"Celles": "Cellules"
"24–26 December 1944": "24–26 décembre 1944"
"The US 2nd Armored Division destroyed the spearhead of the 2nd Panzer Division a few kilometres from the Meuse.": "La 2e Division blindée américaine a détruit le fer de lance de la 2e Division Panzer à quelques kilomètres de la Meuse."
"Houffalize": "Houffaliser"
"16 January 1945": "16 janvier 1945"
"The US First and Third Armies met here, cutting the bulge in two.": "Les Premier et Troisième Armées des États-Unis se sont rencontrés ici, coupant la bulle en deux."
"Peiper": "Peiper"
"Fifth Panzer Army": "Cinquième armée de Panzer"
"Front line, 16 December 1944": "Ligne de front, 16 décembre 1944"
"Furthest German advance, about 25 December 1944 (approximate)": "Première avance allemande, vers le 25 décembre 1944 (approximative)"
"American success": "Le succès américain"
"American moves": "Mouvements américains"
"The siege of Budapest and the road to Vienna": "Le siège de Budapest et la route vers Vienne"
"December 1944 – April 1945": "décembre 1944 – avril 1945"
"The Red Army reached the outskirts of Budapest in early November 1944, but Hitler ordered the city held as a fortress. On 26 December Soviet forces completed its encirclement, trapping tens of thousands of German and Hungarian soldiers and some 800,000 civilians. Three German relief attacks in January failed. Soviet and Romanian troops took Pest street by street, and on 18 January its last defenders withdrew across the Danube to the castle hill of Buda, blowing up the bridges behind them. On 11 February some 28,000 tried to break out; only about 700 reached the German lines. The last resistance ended on 13 February.": "Au début de novembre 1944, l’armée rouge a atteint la périphérie de Budapest, mais Hitler a ordonné que la ville soit une forteresse. Le 26 décembre, les forces soviétiques ont achevé leur encerclement, piégant des dizaines de milliers de soldats allemands et hongrois et quelque 800 000 civils. Trois attaques de secours allemandes ont échoué en janvier. Les troupes soviétiques et roumaines ont pris la rue Pest par la rue, et le 18 janvier, leurs derniers défenseurs se sont retirés à travers le Danube sur la colline du château de Buda, faisant sauter les ponts derrière eux. Le 11 février, quelque 28 000 personnes ont tenté de s’échapper ; seulement 700 ont atteint les lignes allemandes. La dernière résistance a pris fin le 13 février."
"About 38,000 civilians died in the siege, from shelling, bombing, hunger and disease, and Arrow Cross killings went on almost to the end. Soviet soldiers looted, raped very large numbers of women and rounded up tens of thousands of civilians for forced labour in the Soviet Union. In Debrecen a provisional government formed under Soviet protection had declared war on Germany, and it signed an armistice in Moscow on 20 January 1945.": "Environ 38 000 civils sont morts au siège, du bombardement, de la faim et de la maladie, et les meurtres d’Arrow Cross ont presque pris fin. Des soldats soviétiques ont pillé, violé un très grand nombre de femmes et rassemblé des dizaines de milliers de civils pour le travail forcé en Union soviétique. À Debrecen, un gouvernement provisoire formé sous protection soviétique avait déclaré la guerre à l’Allemagne, et il a signé un armistice à Moscou le 20 janvier 1945."
"In March Hitler threw his last reserves, the 6th SS Panzer Army, into Operation Spring Awakening between Lake Balaton and the Danube, to protect the last oilfields left to Germany, around Nagykanizsa. It gained up to 30 km before stalling in mud and Soviet defences. On 16 March the Soviets counter-attacked, and within weeks they crossed into Austria. Bratislava fell on 4 April and Vienna, after a week of fighting, on 13 April. A provisional Austrian government under Karl Renner was set up in Vienna on 27 April.": "En mars, Hitler a jeté ses dernières réserves, la 6ème armée SS Panzer, dans l’opération Spring Wakening entre le lac Balaton et le Danube, pour protéger les derniers champs de pétrole laissés en Allemagne, autour de Nagykanizsa. Il a gagné jusqu’à 30 km avant de s’écrouler dans la boue et les défenses soviétiques. Bratislava est tombé le 4 avril et Vienne, après une semaine de combats, le 13 avril. Un gouvernement autrichien provisoire sous Karl Renner a été mis en place à Vienne le 27 avril."
"Siege of Budapest": "Siège de Budapest"
"26 December 1944 – 13 February 1945": "26 décembre 1944 – 13 février 1945"
"Civilian dead in Budapest": "Civils morts à Budapest"
"about 38,000": "environ 38 000"
"Vienna taken": "Vienne prise"
"13 April 1945": "13 avril 1945"
"One of the longest city sieges of the war. Pest fell in January; the castle district of Buda held out until 13 February.": "L’un des plus longs sièges de la ville de la guerre. Pest est tombé en janvier ; le quartier du château de Buda a tenu jusqu’au 13 février."
"Esztergom": "Esztergom"
"26 December 1944": "26 décembre 1944"
"Soviet spearheads from north and south of the Danube met near here, closing the ring around Budapest.": "Des fers de lance soviétiques du nord et du sud du Danube se sont réunis près d’ici, fermant le ring autour de Budapest."
"21–22 December 1944": "21–22 décembre 1944"
"A provisional national assembly met here under Soviet protection and formed a government, which declared war on Germany a week later.": "Une assemblée nationale provisoire s’est réunie ici sous la protection soviétique et a formé un gouvernement, qui a déclaré la guerre à l’Allemagne une semaine plus tard."
"Operation Spring Awakening": "Opération Réveillez-vous au printemps"
"6–15 March 1945": "6–15 mars 1945"
"The last big German offensive of the war gained up to 30 km between Lake Balaton and Lake Velence before the Soviet defences held.": "La dernière grande offensive allemande de la guerre a gagné jusqu’à 30 km entre le lac Balaton et le lac Velence avant les défenses soviétiques."
"Bratislava": "Bratislava"
"4 April 1945": "4 avril 1945"
"Soviet and Romanian troops took the Slovak capital.": "Les troupes soviétiques et roumaines ont pris la capitale slovaque."
"Vienna": "Vienne"
"Taken after a week of street fighting. Much of the city centre, including St Stephen’s Cathedral, was damaged.": "Prise après une semaine de combats de rue. Une grande partie du centre-ville, y compris la cathédrale St Stephen, a été endommagée."
"6th SS Panzer Army": "6ème armée SS Panzer"
"To Vienna": "À Vienne"
"Soviet front, early March 1945 (approximate)": "Front soviétique, début mars 1945 (approximatif)"
"Poland moved west": "La Pologne a déménagé à l’ouest"
"January – August 1945": "janvier – août 1945"
"The Red Army’s winter offensive reached the ruins of Warsaw on 17 January 1945 and Auschwitz on 27 January, where it found about 7,000 prisoners left behind; tens of thousands more had been driven west on death marches. Breslau, declared a fortress, held out until 6 May. At Yalta in February the Allied leaders agreed that Poland’s eastern border would follow roughly the Curzon Line, leaving the Soviet Union the lands it had annexed in 1939, and that Poland would be compensated in the west.": "L’offensive d’hiver de l’Armée rouge a atteint les ruines de Varsovie le 17 janvier 1945 et Auschwitz le 27 janvier, où il a trouvé environ 7 000 prisonniers laissés derrière ; des dizaines de milliers d’autres avaient été poussés vers l’ouest sur des marches de la mort. À Yalta en février, les dirigeants alliés ont convenu que la frontière orientale de la Pologne suivrait à peu près la ligne Curzon, laissant l’Union soviétique les terres qu’elle avait annexées en 1939, et que la Pologne serait indemnisée dans l’ouest."
"At Potsdam in August the Allies placed German territory east of the Oder and the Lusatian Neisse under Polish administration, leaving the final border to a peace settlement, and gave northern East Prussia with Königsberg to the Soviet Union. They approved the transfer of the remaining Germans “in an orderly and humane manner”. Millions of Germans had already fled before the Red Army; most who stayed were expelled by 1950, many in brutal conditions, and large numbers died.": "À Potsdam en août, les Alliés ont placé le territoire allemand à l’est de l’Oder et de la Neisse lusatienne sous administration polonaise, laissant la frontière finale à une colonie de paix, et ont donné le nord de la Prusse orientale avec Königsberg à l’Union soviétique. Des millions d’Allemands s’étaient déjà enfuis avant l’armée rouge ; la plupart de ceux qui étaient restés furent expulsés en 1950, beaucoup dans des conditions brutales, et un grand nombre moururent."
"In the east more than a million Poles were moved out of the lands annexed by the Soviet Union, while Ukrainians were sent from Poland to Soviet Ukraine. In 1947 Operation Vistula forcibly resettled most of the Ukrainians left in south-eastern Poland in the former German lands. Many of the new inhabitants of Wrocław, Szczecin and Gdańsk came from Lwów, Vilnius and the eastern countryside.": "Dans l’est, plus d’un million de Polonais ont été déplacés des terres annexées par l’Union soviétique, tandis que les Ukrainiens ont été envoyés de Pologne à l’Ukraine soviétique. En 1947, l’opération Vistula a réinstallé de force la plupart des Ukrainiens partis dans le sud-est de la Pologne dans les anciennes terres allemandes. Beaucoup des nouveaux habitants de Wrocław, Szczecin et Gdańsk viennent de Lwów, Vilnius et la campagne orientale."
"Potsdam Agreement": "Accord de Potsdam"
"2 August 1945": "2 août 1945"
"about 8 million by 1950 (German figures)": "environ 8 millions d’ici 1950 (chiffres allemands)"
"Poles moved from the east": "Les Polonais se sont déplacés de l’est"
"more than 1 million": "plus d’un million"
"17 January 1945": "17 janvier 1945"
"Soviet and Polish troops entered the empty, destroyed city.": "Les troupes soviétiques et polonaises entrèrent dans la ville vide et détruite."
"27 January 1945": "27 janvier 1945"
"Soviet soldiers found about 7,000 sick and starving prisoners left behind by the SS.": "Les soldats soviétiques ont trouvé environ 7 000 prisonniers malades et affamés laissés par les SS."
"Breslau": "Breslau"
"February – 6 May 1945": "février – 6 mai 1945"
"The city, now Wrocław, was held as a fortress until four days after Berlin fell, and much of it was destroyed.": "La ville, maintenant Wrocław, fut tenue comme une forteresse jusqu’à quatre jours après la chute de Berlin, et une grande partie de celle-ci fut détruite."
"Königsberg": "Königsberg"
"9 April 1945": "9 avril 1945"
"The East Prussian capital fell after a siege. Renamed Kaliningrad, it became part of Soviet Russia.": "La capitale est-prussienne tombe après un siège. Rebaptisée Kaliningrad, elle fait partie de la Russie soviétique."
"Szczecin": "Szczécine"
"5 July 1945": "5 juillet 1945"
"The port on the west bank of the Oder was handed to Polish administration.": "Le port de la rive ouest de l’Oder a été remis à l’administration polonaise."
"Potsdam": "Potsdam"
"Britain, the United States and the Soviet Union agreed on the Oder–Neisse line, pending a peace settlement.": "La Grande-Bretagne, les États-Unis et l’Union soviétique se sont mis d’accord sur la ligne Oder-Neisse en attendant un règlement de paix."
"German lands placed under Polish administration": "Terres allemandes placées sous administration polonaise"
"Prewar Polish lands kept by the Soviet Union": "Les terres polonaises d’avant-guerre gardées par l’Union soviétique"
"Northern East Prussia, to the Soviet Union": "Prusse du nord-est, à l’Union soviétique"
"Flight and expulsion of Germans": "Vol et expulsion des Allemands"
"Resettlement of Poles from the east": "Réinstallation des Polonais de l’Est"
"Across the Rhine and the end in Italy": "De l’autre côté du Rhin et la fin en Italie"
"February – May 1945": "février – mai 1945"
"In February and March 1945 the Western Allies cleared the Rhineland, and French and American troops wiped out the German pocket around Colmar, freeing the last of Alsace. On 7 March American troops found the railway bridge at Remagen still standing and crossed the Rhine. Further north British, Canadian and American troops crossed at Rees and Wesel on 23–24 March, with a vast airborne landing, and the Americans encircled the Ruhr, where 317,000 Germans surrendered in mid-April. The Canadians freed the north-east of the Netherlands, while American and British columns raced towards the Elbe.": "En février et mars 1945, les Alliés occidentaux ont dégagé la Rhénanie, et les troupes françaises et américaines ont essuyé la poche allemande autour de Colmar, libérant ainsi le dernier de l’Alsace. Plus au nord, les troupes britanniques, canadiennes et américaines ont traversé Rees and Wesel les 23 et 24 mars, avec un vaste débarquement aérien, et les Américains ont encerclé la Ruhr, où 317 000 Allemands se sont rendus à la mi-avril. Les Canadiens ont libéré le nord-est des Pays-Bas, tandis que les colonnes américaines et britanniques couraient vers l’Elbe."
"As they advanced, the Allies uncovered the concentration camps. British troops entering Bergen-Belsen on 15 April found thousands of unburied bodies and some 60,000 starving and sick prisoners; more than 35,000 people, Anne Frank among them, had died there in the first months of 1945, and thousands more died after liberation. American troops reached Buchenwald on 11 April and Dachau on 29 April. On 4 May the German forces in north-west Germany, the Netherlands and Denmark surrendered at Lüneburg Heath, and on 7 May General Jodl signed the surrender of all German forces at Reims.": "Au fur et à mesure qu’ils avançaient, les Alliés découvrirent les camps de concentration. Les troupes britanniques qui entraient dans Bergen-Belsen le 15 avril ont trouvé des milliers de corps non enterrés et quelque 60 000 prisonniers affamés et malades ; plus de 35 000 personnes, dont Anne Frank, y étaient mortes au cours des premiers mois de 1945, et des milliers d’autres sont mortes après la libération. Le 4 mai, les forces allemandes dans le nord-ouest de l’Allemagne, les Pays-Bas et le Danemark se sont rendus à Lüneburg Heath, et le général Jodl a signé le 7 mai la reddition de toutes les forces allemandes à Reims."
"In Italy the Allies had spent the winter halted on the Gothic Line, while German troops and Fascist units fought a brutal war against the partisans; at Marzabotto in autumn 1944 the SS killed some 770 civilians. The April offensive broke into the Po valley, Bologna fell on 21 April, and partisans rose in Milan, Turin and Genoa. Partisans caught Mussolini near Lake Como as he tried to flee and shot him on 28 April; his body was hung in Milan’s Piazzale Loreto. The German surrender in Italy, signed at Caserta on 29 April, took effect on 2 May.": "En Italie, les Alliés avaient passé l’hiver à s’arrêter sur la ligne gothique, tandis que les troupes allemandes et les unités fascistes combattaient une guerre brutale contre les partisans ; à Marzabotto en automne 1944, les SS tuèrent quelque 770 civils. L’offensive d’avril éclata dans la vallée du Po, Bologne tomba le 21 avril, et les partisans se montèrent à Milan, Turin et Gênes. Partisans pris Mussolini près du lac de Côme alors qu’il a essayé de fuir et de le tuer le 28 avril ; son corps a été pendu à Milan, Piazzale Loreto. La reddition allemande en Italie, signée à Caserta le 29 avril, a pris effet le 2 mai."
"Rhine crossed at Remagen": "Rhin traversé à Remagen"
"7 March 1945": "7 mars 1945"
"Surrender in Italy": "Rendez-vous en Italie"
"signed 29 April, in force 2 May 1945": "signé le 29 avril, en vigueur le 2 mai 1945"
"Surrender at Reims": "Rendez-vous à Reims"
"7 May 1945, in force 8 May": "7 mai 1945, en vigueur 8 mai"
"Remagen": "Rémagène"
"American troops captured the Ludendorff railway bridge before the Germans could destroy it; it collapsed ten days later.": "Les troupes américaines ont capturé le pont ferroviaire de Ludendorff avant que les Allemands ne puissent le détruire ; il s’est effondré dix jours plus tard."
"Colmar": "M. Colmar"
"2 February 1945": "2 février 1945"
"French troops entered the town; the German pocket in Alsace was cleared by 9 February.": "Les troupes françaises sont entrées dans la ville ; la poche allemande en Alsace a été déminée le 9 février."
"Ruhr pocket": "Poche de ruhr"
"1–18 April 1945": "1–18 avril 1945"
"American armies met at Lippstadt on 1 April, encircling the Ruhr; 317,000 Germans surrendered.": "Les armées américaines se sont réunies à Lippstadt le 1er avril, encerclées par la Ruhr ; 317 000 Allemands se sont rendus."
"Bergen-Belsen": "Bergen-Belsen"
"15 April 1945": "15 avril 1945"
"British troops found thousands of unburied dead and about 60,000 prisoners, many dying of typhus and starvation.": "Les troupes britanniques ont trouvé des milliers de morts non enterrés et environ 60 000 prisonniers, dont beaucoup mouraient de typhus et de faim."
"Dachau": "Dachau"
"29 April 1945": "29 avril 1945"
"American troops freed the camp, opened in 1933 as the first of the Nazi concentration camps.": "Les troupes américaines ont libéré le camp, ouvert en 1933 comme le premier des camps de concentration nazis."
"Reims": "Reims"
"7 May 1945": "7 mai 1945"
"Jodl signed the unconditional surrender of all German forces at Eisenhower’s headquarters, to take effect on 8 May.": "Jodl a signé la reddition inconditionnelle de toutes les forces allemandes au quartier général d’Eisenhower, qui entrera en vigueur le 8 mai."
"Bologna": "Bologne"
"21 April 1945": "21 avril 1945"
"Polish and Italian troops entered the city first, after the spring offensive broke the German line.": "Les troupes polonaises et italiennes sont entrées dans la ville d’abord, après l’offensive de printemps a brisé la ligne allemande."
"Piazzale Loreto": "Piazzale Loreto"
"The bodies of Mussolini, shot by partisans the day before, and other Fascist leaders were hung up in the square.": "Les corps de Mussolini, abattus par des partisans la veille, et d’autres dirigeants fascistes étaient accrochés sur la place."
"Ninth Army": "Neuvième armée"
"Occupied by Germany, early April 1945": "Occupé par l’Allemagne, début avril 1945"
"Western front, 7 March 1945 (approximate)": "Front ouest, 7 mars 1945 (approximatif)"
"Allied front in Italy, early April 1945 (approximate)": "Front allié en Italie, début avril 1945 (approximatif)"
"American, British, Canadian, French and Polish moves": "Les mouvements américains, britanniques, canadiens, français et polonais"
"The end in Yugoslavia, Trieste and Bleiburg": "La fin en Yougoslavie, Trieste et Bleiburg"
"January – June 1945": "janvier – juin 1945"
"Through the winter of 1944–45 the Partisans, renamed the Yugoslav Army in March, fought a costly positional war against German and Croatian forces on the Syrmian Front west of Belgrade, while the German Army Group E withdrew from Greece through Bosnia. Mostar was taken in February and Sarajevo on 6 April. On 12 April the Yugoslav 1st Army broke through in Syrmia, and in the west the 4th Army advanced up the Adriatic coast and into Istria. It reached Trieste on 1 May, a day before New Zealand troops of the Eighth Army, and held the city for forty days, arresting thousands of people, many of whom were killed, until an agreement in June left it under Allied control.": "Au cours de l’hiver 1944-1945, les Partisans, rebaptisés Armée yougoslave en mars, ont mené une guerre positionnelle coûteuse contre les forces allemandes et croates sur le Front syrmique à l’ouest de Belgrade, tandis que le Groupe E de l’armée allemande se retirait de la Grèce par la Bosnie. Mostar fut pris en février et Sarajevo le 6 avril. Le 12 avril, la 1ère armée yougoslave s’est effondrée en Syrmie et à l’ouest, la 4ème armée a avancé sur la côte adriatique et est entrée en Istrie. Elle a atteint Trieste le 1er mai, un jour avant les troupes néo-zélandaises de la 8ème armée, et a tenu la ville pendant quarante jours, arrêtant des milliers de personnes, dont beaucoup ont été tuées, jusqu’à ce qu’un accord en juin l’ait laissée sous contrôle allié."
"At the end of the war the government and army of the Independent State of Croatia, with tens of thousands of civilians, Slovene Home Guards and Montenegrin Chetniks, fled north to surrender to the British in Austria. On 15 May the British at Bleiburg refused the surrender of the main Croatian column and directed it to the Partisans, and later they handed back many who had already reached Austria. The Yugoslav authorities shot prisoners without trial in their tens of thousands, at Tezno near Maribor, Kočevski Rog, Macelj and many other places, and others died on forced marches to camps. Most of the dead had served in the Axis-aligned forces, but there were civilians among them.": "À la fin de la guerre, le gouvernement et l’armée de l’État indépendant de Croatie, avec des dizaines de milliers de civils, les Gardes Intérieures slovènes et les Monténégrins Chetniks, ont fui vers le nord pour se rendre aux Britanniques en Autriche. Le 15 mai, les Britanniques à Bleiburg ont refusé la reddition de la principale colonne croate et l’ont dirigée vers les Partisans, puis ils ont remis beaucoup qui avaient déjà atteint l’Autriche. Les autorités yougoslaves ont abattu des prisonniers sans jugement dans leurs dizaines de milliers, à Tezno près de Maribor, Kočevski Rog, Macelj et bien d’autres endroits, et d’autres sont morts lors de marches forcées vers les camps. La plupart des morts avaient servi dans les forces alignées sur l’Axe, mais il y avait parmi eux des civils."
"The number of victims is not known. Estimates range widely, from 20,000–40,000 in some historians’ work to 70,000–80,000 in others; the demographer Vladimir Žerjavić calculated 57,000–65,000, and émigré accounts gave figures in the hundreds of thousands. Slovenia has registered more than 600 concealed mass graves from the war and its aftermath. Under communist rule the killings could not be spoken of; since the 1990s the yearly commemoration at Bleiburg has been disputed, over both the numbers and the Ustaša symbols displayed there.": "Le nombre de victimes n’est pas connu. Les estimations vont de 20 000 à 40 000 dans certains historiens, à 70 000 à 80 000 dans d’autres ; le démographe Vladimir Žerjavić a calculé 57 000 à 65 000, et les comptes émigrés ont donné des chiffres en centaines de milliers. La Slovénie a enregistré plus de 600 fosses communes cachées de la guerre et de ses suites. Sous le régime communiste, les meurtres n’ont pas pu être évoqués ; depuis les années 1990, la commémoration annuelle à Bleiburg a été contestée, tant sur les nombres que sur les symboles d’Ustaša affichés là."
