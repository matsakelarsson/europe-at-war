"The fall of Berlin": "La chute de Berlin"
"April – May 1945": "avril – mai 1945"
"By the spring of 1945 the Red Army stood on the Oder and the Neisse, about 70 km from Berlin, while the Western Allies were advancing across western Germany. On 16 April Georgy Zhukov’s 1st Belorussian Front attacked across the Oder at the Seelow Heights, and Ivan Konev’s 1st Ukrainian Front across the Neisse further south. The heights cost Zhukov days and heavy losses, but by 25 April the two fronts had encircled Berlin, and on the same day Soviet and American soldiers met on the Elbe near Torgau, cutting Germany in two. In the city the remnants of the army and the SS, old men of the Volkssturm militia and boys of the Hitler Youth fought on street by street.": "Au printemps 1945, l’armée rouge se tenait sur l’Oder et la Neisse, à environ 70 km de Berlin, tandis que les Alliés occidentaux progressaient dans l’ouest de l’Allemagne. Le 16 avril Georgy Zhukovs 1er Front belorussien attaquait par-dessus l’Oder aux hauteurs de Seelow, et Ivan Konevs 1er Front ukrainien à travers la Neisse plus au sud. Les hauteurs ont coûté des jours à Zhukov et de lourdes pertes, mais au 25 avril les deux fronts avaient encerclé Berlin, et le même jour les soldats soviétiques et américains se sont rencontrés sur l’Elbe près de Torgau, coupant l’Allemagne en deux."
"Hitler killed himself in his bunker on 30 April, as Soviet soldiers stormed the Reichstag, and the Berlin garrison surrendered on 2 May. Germany’s armed forces surrendered unconditionally at Reims on 7 May and again, at Soviet insistence, in Berlin-Karlshorst late on 8 May, when it was already 9 May in Moscow. The battle had cost some 80,000 Soviet soldiers their lives, and tens of thousands of German civilians died. Soviet troops raped very large numbers of women in Berlin and across eastern Germany. The Soviet Union had lost about 27 million people in the war, more than any other country.": "Hitler s’est tué dans son bunker le 30 avril, alors que des soldats soviétiques ont pris l’assaut du Reichstag, et la garnison de Berlin s’est rendue le 2 mai. Allemagne Les forces armées se sont rendues sans condition à Reims le 7 mai et à nouveau, à l’insistance soviétique, à Berlin-Karlshorst fin 8 mai, alors qu’il était déjà 9 mai à Moscou. La bataille avait coûté la vie à quelque 80 000 soldats soviétiques, et des dizaines de milliers de civils allemands sont morts. Les troupes soviétiques ont violé un très grand nombre de femmes à Berlin et dans toute l’Allemagne orientale. L’Union soviétique a perdu environ 27 millions de personnes dans la guerre, plus que tout autre pays."
"Battle of Berlin": "Bataille de Berlin"
