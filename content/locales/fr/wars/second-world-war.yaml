"Cassino, Anzio and Rome": "Cassino, Anzio et Rome"
"October 1943 – June 1944": "octobre 1943 – juin 1944"
"South of Rome the Germans under Field Marshal Kesselring held fortified lines across the mountains, the strongest the Gustav Line, anchored on Monte Cassino. Through a wet winter the Allies, among them American, British, Canadian, French, Indian, New Zealand and Polish troops, made slow and costly progress. On 22 January 1944 American and British troops landed at Anzio, behind the line, but their commander dug in instead of striking inland, and German counter-attacks pinned the beachhead down for four months. On 15 February Allied bombers destroyed the abbey on Monte Cassino, and the Germans then fortified its ruins.": "Au sud de Rome, les Allemands sous le maréchal Kesselring tenaient des lignes fortifiées à travers les montagnes, la plus forte ligne Gustave, ancrée sur le Monte Cassino. Pendant un hiver humide, les Alliés, parmi lesquels les troupes américaines, britanniques, canadiennes, françaises, indiennes, néo-zélandaises et polonaises, ont fait des progrès lents et coûteux. Le 22 janvier 1944, les troupes américaines et britanniques débarquèrent à Anzio, derrière la ligne, mais leur commandant creusa au lieu de frapper l’intérieur, et les contre-attaques allemandes pilonnèrent la tête de plage pendant quatre mois.Le 15 février, les bombardiers alliés détruisirent l’abbaye du Monte Cassino, et les Allemands fortifièrent ses ruines."
"Three assaults on Cassino failed between January and March. In the fourth, launched on 11 May, French colonial troops broke through the Aurunci mountains, and on 18 May soldiers of the Polish II Corps raised their flag over the abbey ruins after a week of heavy losses. The Anzio force broke out on 23 May, but General Clark turned it towards Rome rather than cutting off the retreating German Tenth Army, and the Americans entered Rome on 4 June. In the advance goumiers of the French Expeditionary Corps committed mass rapes of Italian civilians, remembered as the marocchinate.": "Trois assauts contre Cassino échouèrent entre janvier et mars. Dans le quatrième, lancé le 11 mai, les troupes coloniales françaises traversèrent les montagnes d’Aurunci et, le 18 mai, des soldats du Corps polonais II portèrent leur drapeau sur les ruines de l’abbaye après une semaine de lourdes pertes. La force Anzio éclata le 23 mai, mais le général Clark la tourna vers Rome plutôt que de couper la dixième armée allemande en retraite et les Américains entrèrent à Rome le 4 juin. Dans l’avant-garde, les goumiers du Corps expéditionnaire français ont commis des viols de masse de civils italiens, dont on se souvient comme étant le Marocchinate."
"Behind the lines the occupation grew harsher. In Rome, after a partisan bomb killed 33 German police in the Via Rasella on 23 March, the Germans shot 335 men and boys, prisoners and hostages, at the Ardeatine Caves the next day. Partisan bands formed in the mountains of central and northern Italy, and German troops and Fascist militia answered them with reprisals against villages.": "À Rome, après qu’une bombe partisane eut tué 33 policiers allemands à la Via Rasella le 23 mars, les Allemands ont abattu 335 hommes et garçons, prisonniers et otages dans les grottes d’Ardeatine le lendemain. Des bandes de partisans se sont formées dans les montagnes du centre et du nord de l’Italie, et des troupes allemandes et des milices fascistes leur ont répondu par des représailles contre les villages."
"Battles of Monte Cassino": "Batailles de Monte Cassino"
