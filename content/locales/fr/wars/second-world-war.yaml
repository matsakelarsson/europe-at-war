"Rokossovsky": "Rokossovsky"
"Soviet front, early August 1944 (approximate)": "Front soviétique, début août 1944 (approximatif)"
"The liberation of France and Belgium": "La libération de la France et de la Belgique"
"15 August – September 1944": "15 août – septembre 1944"
"On 15 August 1944 American and French troops landed in Provence between Toulon and Cannes. The French under General de Lattre took Toulon and Marseille by 28 August, far sooner than planned, and the Allies drove up the Rhône valley to meet the forces from Normandy near Dijon in mid-September. In Paris the police and the Resistance rose on 19 August. Eisenhower sent General Leclerc’s French 2nd Armoured Division ahead, and on 25 August the German commander, Dietrich von Choltitz, surrendered the city, which Hitler had ordered him to destroy. De Gaulle walked down the Champs-Élysées the next day.": "Le 15 août 1944, des troupes américaines et françaises débarquent en Provence entre Toulon et Cannes. Les Français sous la direction du général de Lattre prennent Toulon et Marseille le 28 août, bien plus tôt que prévu, et les Alliés montent dans la vallée du Rhône pour rencontrer les forces de Normandie près de Dijon à la mi-septembre. Eisenhower envoya le général Leclerc à l’avance la 2e division blindée française et, le 25 août, le commandant allemand Dietrich von Choltitz rendit la ville qu’Hitler lui avait ordonné de détruire. De Gaulle descendit les Champs-Élysées le lendemain."
"As the Germans retreated, the British and Canadians crossed the Seine and raced north, reaching Brussels on 3 September and Antwerp, with its port intact, on 4 September. The Americans freed Liège and Luxembourg, and by mid-September they stood on the German border near Aachen and on the Moselle. But supplies were stretched, the approaches to Antwerp along the Scheldt stayed in German hands until November, and German garrisons held Dunkirk, Lorient, Saint-Nazaire and La Rochelle until the end of the war. Royan and the Pointe de Grave were retaken by French forces in April 1945.": "Alors que les Allemands reculaient, les Britanniques et les Canadiens traversaient la Seine et couraient vers le nord, atteignant Bruxelles le 3 septembre et Anvers, son port intact, le 4 septembre. Les Américains débarquèrent Liège et Luxembourg, et à la mi-septembre ils se tenaient à la frontière allemande près d’Aix-la-Chapelle et à la Moselle. Mais les approvisionnements sont étendus, les approches d’Anvers le long de l’Escaut restent entre les mains allemandes jusqu’en novembre, et les garnisons allemandes détiennent Dunkerque, Lorient, Saint-Nazaire et La Rochelle jusqu’à la fin de la guerre. Royan et la Pointe de Grave sont repris par les forces françaises en avril 1945."
"The retreat was marked by massacres. In June, after Resistance attacks following D-Day, the SS division Das Reich hanged 99 men in Tulle and killed 642 people at Oradour-sur-Glane, burning the women and children in the church. In July German troops crushed the maquis on the Vercors plateau, killing more than 600 fighters and some 200 civilians. After liberation some 9,000–10,000 people accused of collaboration were killed without trial and about 20,000 women had their heads shaved in public, before the courts took over the purge.": "La retraite a été marquée par des massacres. En juin, après les attaques de résistance après le Jour J, la division SS Das Reich a pendu 99 hommes à Tulle et tué 642 personnes à Oradour-sur-Glane, en brûlant les femmes et les enfants dans l’église. Après la libération, entre 9 000 et 10 000 personnes accusées de collaboration ont été tuées sans procès et environ 20 000 femmes se sont fait raser la tête en public avant que les tribunaux ne prennent le contrôle de la purge."
