"Second World War": "Seconde Guerre mondiale"
"The deadliest war in history, fought between the Axis powers led by Germany, Italy and Japan and the Allies, among them Britain, the Soviet Union, the United States and China. In Europe it began with the German invasion of Poland on 1 September 1939 and ended with Germany’s surrender in May 1945; it brought the Holocaust, the murder of some six million Jews, and left Europe divided. In the west Germany overran the Low Countries and France in 1940, while Britain held out; the Western Allies returned through Italy in 1943 and Normandy in 1944.": "La guerre la plus meurtrière de l’histoire, combattue entre les puissances de l’Axe dirigées par l’Allemagne, l’Italie et le Japon et les Alliés, parmi lesquels la Grande-Bretagne, l’Union soviétique, les États-Unis et la Chine. En Europe elle a commencé avec l’invasion allemande de la Pologne le 1er septembre 1939 et s’est terminée avec la reddition de l’Allemagne en mai 1945 ; elle a apporté l’Holocauste, le meurtre de quelque six millions de juifs, et laissé l’Europe divisée. Dans l’ouest de l’Allemagne, les Pays-Bas et la France en 1940, tandis que la Grande-Bretagne se déroula ; les Alliés occidentaux retournèrent par l’Italie en 1943 et en Normandie en 1944."
"The Soviet Union was Germany’s partner under the Molotov–Ribbentrop Pact from August 1939 until Germany invaded it on 22 June 1941, and then fought on the Allied side.": "L’Union soviétique était partenaire de l’Allemagne sous le pacte Molotov-Ribbentrop d’août 1939 jusqu’à ce que l’Allemagne l’envahisse le 22 juin 1941, puis se battit du côté des Alliés."
"Numbers of dead are estimates, and the sources give ranges for most of them. Places in present-day Poland are named in their Polish forms, with German names of the time where useful.": "Les nombres de morts sont des estimations, et les sources donnent des fourchettes pour la plupart d’entre eux. Les endroits dans la Pologne actuelle sont nommés sous leur forme polonaise, avec des noms allemands de l’époque où utile."
"The map shows the annexations recognised in practice at the time: Germany’s in Poland and the General Government, Alsace-Moselle, Luxembourg and Eupen-Malmedy; the German and Romanian occupation of the Soviet Union at six dates between July 1941 and December 1944; the partition of Yugoslavia from April 1941, region by region until its liberation in 1944–45; and the Bulgarian annexation of eastern Macedonia and Western Thrace. Other occupations are drawn as approximate areas in the steps: Denmark, Norway, the Low Countries and France, the German, Italian and Bulgarian zones in Greece, Italy after September 1943, Hungary in 1944, Partisan territory and the fronts.": "La carte montre les annexions reconnues dans la pratique à l’époque : Allemagne en Pologne et gouvernement général, Alsace-Moselle, Luxembourg et Eupen-Malmedy ; occupation allemande et roumaine de l’Union soviétique à six dates entre juillet 1941 et décembre 1944 ; partition de la Yougoslavie d’avril 1941, région par région jusqu’à sa libération en 1944–1945 ; annexion bulgare de la Macédoine orientale et de la Thrace occidentale. D’autres métiers sont dessinés comme des zones approximatives dans les étapes : le Danemark, la Norvège, les Pays Bas et la France, les zones allemande, italienne et bulgare en Grèce, l’Italie après septembre 1943, la Hongrie en 1944, le territoire du Parti et les fronts."
"Places in the former Yugoslavia are named in their present forms, with Italian, German or Hungarian names of the time where useful; Albanian places are named in Albanian, with Greek names where the Greek army used them.": "Les lieux de l’ex-Yougoslavie sont nommés sous leurs formes actuelles, avec des noms italiens, allemands ou hongrois de l’époque où ils étaient utiles ; les lieux albanais sont nommés en albanais, avec des noms grecs où l’armée grecque les utilisait."
"The numbers of people killed in the Ustaša camps, by the Chetniks, in German and Bulgarian reprisals and after the surrender at Bleiburg are disputed, sometimes bitterly, between the countries of the former Yugoslavia and between historians. The figures given here are those of the United States Holocaust Memorial Museum where it gives them, or the range given by the sources listed, and are approximate.": "Le nombre de personnes tuées dans les camps d’Ustaša, par les Chetniks, par des représailles allemandes et bulgares et après la reddition à Bleiburg est contesté, parfois amèrement, entre les pays de l’ex-Yougoslavie et entre les historiens. Les chiffres donnés ici sont ceux du Musée commémoratif de l’Holocauste des États-Unis où il leur donne, ou la gamme donnée par les sources énumérées, et sont approximatifs."
