"Hungary occupied": "Hongrie occupée"
"March – December 1944": "mars – décembre 1944"
"Hungary had fought beside Germany against the Soviet Union since June 1941 and lost much of its Second Army on the Don in January 1943. Its troops had also killed some 3,000–4,000 Serbs and Jews in the Novi Sad raid of January 1942, many of them shot and pushed under the ice of the Danube. When Germany learned that the regent, Miklós Horthy, was seeking a separate peace, its forces occupied the country on 19 March 1944. Horthy stayed in office, but a pro-German government took over, and Adolf Eichmann arrived with an SS team to deport Hungary’s Jews, some 760,000 of whom were still alive within its wartime borders.": "La Hongrie combattait à côté de l’Allemagne contre l’Union soviétique depuis juin 1941 et perdait une grande partie de sa Seconde Armée sur le Don en janvier 1943. Ses troupes avaient également tué entre 3 000 et 4 000 Serbes et Juifs lors du raid Novi Sad de janvier 1942, dont beaucoup tirèrent et poussèrent sous la glace du Danube. Lorsque l’Allemagne apprit que le régent, Miklós Horthy, cherchait une paix séparée, ses forces occupaient le pays le 19 mars 1944. Horthy resta au pouvoir, mais un gouvernement pro-allemand prit la relève, et Adolf Eichmann arriva avec une équipe SS pour déporter les Juifs de Hongrie, dont quelque 760 000 étaient encore vivants à l’intérieur de ses frontières en temps de guerre."
"With the help of the Hungarian gendarmerie, Jews were forced into ghettos from April, beginning in Carpathian Ruthenia and northern Transylvania. Between 15 May and 9 July 1944 some 437,000 people were deported in 147 trains, nearly all to Auschwitz-Birkenau, where most were gassed on arrival. Under pressure from abroad Horthy halted the deportations in early July, before the Jews of Budapest could be taken. On 15 October, as the Red Army fought its way into eastern Hungary, he announced an armistice. German commandos kidnapped his son, and Horthy was forced to hand power to Ferenc Szálasi, leader of the fascist Arrow Cross.": "Avec l’aide de la gendarmerie hongroise, les Juifs ont été forcés à entrer dans des ghettos à partir d’avril, en commençant par la Ruthénie Carpatienne et le Nord de la Transylvanie. Entre 15 mai et 9 juillet 1944, quelque 437 000 personnes ont été déportées dans 147 trains, presque toutes à Auschwitz-Birkenau, où la plupart ont été gazées à leur arrivée. Le 15 octobre, alors que l’Armée rouge combattait son chemin vers l’est de la Hongrie, il annonça un armistice. Des commandos allemands kidnappèrent son fils et Horthy fut forcé de remettre le pouvoir à Ferenc Szálasi, chef de la Croix d’Arrow fasciste."
"Arrow Cross rule brought a new wave of terror. Tens of thousands of Budapest Jews were driven on foot towards the Austrian border in November, and militiamen shot 10,000–15,000 on the banks of the Danube over the winter. Diplomats such as the Swede Raoul Wallenberg and the Swiss Carl Lutz saved thousands with protective passes and safe houses. About 565,000 of Hungary’s Jews were killed in the war; some 119,000 survived in Budapest.": "Des dizaines de milliers de Juifs de Budapest ont été conduits à pied vers la frontière autrichienne en novembre, et des miliciens ont tiré 10 000 à 15 000 sur les rives du Danube au cours de l’hiver. Des diplomates comme le Suédois Raoul Wallenberg et le Suisse Carl Lutz ont sauvé des milliers avec des passes protectrices et des maisons sûres."
