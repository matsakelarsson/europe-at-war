"The invasion of Poland": "L’invasion de la Pologne"
"1 September 1939": "1er septembre 1939"
"On 23 August 1939 Germany and the Soviet Union signed a non-aggression pact whose secret protocol divided eastern Europe between them, Poland included. A week later, after SS men staged a fake Polish attack on a German radio station at Gleiwitz, Germany invaded. Early on 1 September German aircraft bombed the small town of Wieluń, and the old battleship Schleswig-Holstein opened fire on the Polish depot at Westerplatte in the Free City of Danzig.": "Le 23 août 1939, l’Allemagne et l’Union soviétique signent un pacte de non-agression dont le protocole secret divise l’Europe de l’Est entre eux, y compris la Pologne. Une semaine plus tard, après que les SS aient organisé une fausse attaque polonaise sur une station de radio allemande à Gleiwitz, l’Allemagne envahit. Au début du 1er septembre, l’avion allemand a bombardé la petite ville de Wieluń et le vieux navire de guerre Schleswig-Holstein a ouvert le feu sur le dépôt polonais à Westerplatte dans la ville libre de Danzig."
"German and Slovak forces attacked from the west, from East Prussia in the north and from Slovakia in the south. Britain and France declared war on Germany on 3 September but gave Poland little practical help. The Polish army, spread along a long frontier and outmatched in tanks and aircraft, fought hard in places, as at Mokra, where a cavalry brigade held off a panzer division for a day. Within a week, though, German armoured columns had broken through.": "Les forces allemandes et slovaques ont attaqué de l’ouest, de la Prusse orientale dans le nord et de la Slovaquie dans le sud. La Grande-Bretagne et la France ont déclaré la guerre à l’Allemagne le 3 septembre mais ont donné peu d’aide pratique à la Pologne. Cependant, en une semaine, des colonnes blindées allemandes avaient été brisées."
"German invasion": "Invasion allemande"
"Britain and France declare war": "La Grande-Bretagne et la France déclarent guerre"
"3 September 1939": "3 septembre 1939"
"Westerplatte surrenders": "Remises de Westerplatte"
"7 September 1939": "7 septembre 1939"
"Wieluń": "Wieluń"
"Bombed from about 04:40, one of the first acts of the war. About 70 per cent of the town was destroyed; estimates of the dead range from 127 to several hundred.": "Bombé à partir de 04h40, l’un des premiers actes de guerre. Environ 70 % de la ville a été détruite ; les estimations des morts vont de 127 à plusieurs centaines."
"Westerplatte": "Westerplatte"
"1–7 September 1939": "1–7 septembre 1939"
"A garrison of about two hundred held the Polish military depot for a week against shelling, bombing and assaults.": "Une garnison d’environ deux cents a tenu le dépôt militaire polonais pendant une semaine contre les bombardements, les bombardements et les attaques."
"Polish Post Office, Danzig": "Poste polonais, Danzig"
"Polish postal staff held the building for some 15 hours. Most survivors were sentenced to death by a German court martial and shot in October.": "La plupart des survivants ont été condamnés à mort par une cour martiale allemande et abattus en octobre."
"Gleiwitz incident": "L’incident de Gleiwitz"
"31 August 1939": "31 août 1939"
"SS men disguised as Polish insurgents seized a German radio station to give Germany a pretext for war.": "Des hommes SS déguisés en insurgés polonais ont saisi une station de radio allemande pour donner à l’Allemagne un prétexte de guerre."
"Battle of Mokra": "Bataille de Mokra"
"The Wołyńska Cavalry Brigade held off the German 4th Panzer Division for a day before withdrawing.": "La Brigade de Cavalerie de Wołyńska a tenu un jour au large de la 4e Division Panzer allemande avant de se retirer."
"4th Army": "4e armée"
"3rd Army": "3e armée"
"10th Army": "10e armée"
"14th Army": "14e armée"
"The Bzura and the siege of Warsaw": "La Bzura et le siège de Varsovie"
"8–29 September 1939": "8–29 septembre 1939"
"German armour reached the outskirts of Warsaw on 8 September, but the city’s defenders beat off the first attacks. The next day General Tadeusz Kutrzeba, whose Poznań and Pomorze armies had been bypassed in the west, struck south across the Bzura into the flank of the German 8th Army. It became the largest battle of the campaign. After early success the Poles were surrounded and pounded from the air, and by 19 September the pocket had collapsed, though some units broke through the Kampinos Forest to Warsaw.": "Le lendemain, le général Tadeusz Kutrzeba, dont les armées Poznań et Pomorze avaient été contournées à l’ouest, a frappé le sud en travers de la Bzura dans le flanc de la 8ème armée allemande. Il est devenu la plus grande bataille de la campagne. Après un premier succès, les Polonais furent encerclés et frappés des airs, et le 19 septembre la poche s’était effondrée, bien que certaines unités traversèrent la forêt de Kampinos pour se rendre à Varsovie."
"Warsaw, defended by soldiers and civilians alike, was shelled and bombed for three weeks. About 18,000 civilians died before the city surrendered on 28 September, its water and power cut. The fortress of Modlin held out until 29 September and the Hel peninsula until 2 October. By then the Polish government and high command had left the country.": "Varsovie, défendue par des soldats et des civils, a été bombardée pendant trois semaines. Environ 18 000 civils sont morts avant que la ville ne se rende le 28 septembre, son eau et sa coupure de courant. La forteresse de Modlin s’est tenue jusqu’au 29 septembre et la péninsule Hel jusqu’au 2 octobre."
"Battle of the Bzura": "Bataille de Bzura"
"9–19 September 1939": "9–19 septembre 1939"
"Civilian dead in Warsaw": "Civils morts à Varsovie"
"about 18,000": "environ 18 000"
"Warsaw surrenders": "Remises à Varsovie"
"28 September 1939": "28 septembre 1939"
"The Polish counter-attack from the west threw the Germans back some 20 km before the Poles were encircled. It was the largest battle of the campaign.": "La contre-attaque polonaise de l’ouest a repoussé les Allemands environ 20 km avant que les Polonais ne soient encerclés. C’était la plus grande bataille de la campagne."
"Warsaw": "Varsovie"
"8–28 September 1939": "8–28 septembre 1939"
"The capital held out for three weeks under siege, shelling and bombing.": "La capitale s’est déroulée pendant trois semaines sous le siège, les bombardements et les bombardements."
"Modlin": "Modlin"
"until 29 September 1939": "jusqu’au 29 septembre 1939"
"The fortress north-west of Warsaw surrendered a day after the capital.": "La forteresse au nord-ouest de Varsovie s’est rendue un jour après la capitale."
"Hel": "Hél"
"until 2 October 1939": "jusqu’au 2 octobre 1939"
"The fortified peninsula on the Baltic was one of the last places to give up.": "La péninsule fortifiée de la Baltique fut l’un des derniers endroits à abandonner."
"Kutrzeba": "Kutrzeba"
"4th Panzer Division": "4ème Division Panzer"
"The Soviet invasion": "L’invasion soviétique"
"17 September – October 1939": "17 septembre – octobre 1939"
"On 17 September the Red Army crossed Poland’s eastern border with between about 450,000 and more than 800,000 men, by different estimates, claiming that the Polish state had ceased to exist and that Ukrainians and Belarusians needed protection. The Polish commander-in-chief, Marshal Edward Rydz-Śmigły, ordered his troops not to fight the Soviets except in self-defence, and the government and high command crossed into Romania. Up to 120,000 Polish soldiers escaped into Romania, and others into Hungary and Lithuania, many of them later to fight on in France.": "Le 17 septembre, l’Armée rouge a franchi la frontière orientale de la Pologne avec environ 450 000 à plus de 800 000 hommes, selon des estimations différentes, affirmant que l’État polonais avait cessé d’exister et que les Ukrainiens et les Biélorusses avaient besoin de protection. Jusqu'à 120 000 soldats polonais se sont échappés en Roumanie, et d’autres en Hongrie et en Lituanie, dont beaucoup plus tard pour combattre en France."
"Some units fought anyway. Grodno was defended for three days, and afterwards Soviet troops murdered about 300 of its defenders, including teenage boys. On 22 September Lwów, besieged first by the Germans and then by the Soviets, surrendered to the Red Army, and German and Soviet troops held a joint parade in Brest the same day. At Szack on 28 September Polish border troops beat a Soviet division. Some captured Polish officers were shot on the spot, and thousands of others were murdered at Katyn the following spring.": "Grodno a été défendu pendant trois jours, puis les troupes soviétiques ont assassiné environ 300 de ses défenseurs, y compris des adolescents. Le 22 septembre Lwów, assiégé d’abord par les Allemands et ensuite par les Soviétiques, s’est rendu à l’armée rouge, et les troupes allemandes et soviétiques ont organisé une parade commune à Brest le même jour. Certains policiers polonais capturés ont été abattus sur place, et des milliers d’autres ont été assassinés à Katyn le printemps suivant."
"Soviet invasion": "Invasion soviétique"
"17 September 1939": "17 septembre 1939"
"Lwów surrenders": "Lwów se rend"
"22 September 1939": "22 septembre 1939"
"Polish soldiers captured by the USSR": "Des soldats polonais capturés par l’URSS"
"about 240,000": "environ 240 000"
"Grodno": "Maïs"
"20–22 September 1939": "20–22 septembre 1939"
"Soldiers, police and civilians, among them schoolboys, held the city for three days against Soviet tanks.": "Des soldats, des policiers et des civils, dont des écoliers, ont tenu la ville pendant trois jours contre des chars soviétiques."
"Brest": "Brest"
"German troops, who had taken the fortress, handed it to the Red Army after a joint parade.": "Les troupes allemandes, qui avaient pris la forteresse, l’ont remise à l’Armée rouge après une parade commune."
"Battle of Szack": "Bataille de Szack"
"The Border Protection Corps beat the Soviet 52nd Rifle Division as it fought its way west to join the remaining Polish forces.": "Le Corps de protection des frontières a battu la 52e division soviétique de Rifle alors qu’il combattait son chemin vers l’ouest pour rejoindre les forces polonaises restantes."
"Tomaszów Lubelski": "Tomaszów Lubelski"
"18–20 September 1939": "18–20 septembre 1939"
"The second-largest battle of the campaign and its largest tank battle. Army Kraków, trying to break through to the south-east, surrendered on 20 September.": "La deuxième bataille de la campagne et sa plus grande bataille de chars. Armée Cracovie, essayant de percer au sud-est, s’est rendue le 20 septembre."
"Lwów": "Lwów"
"After a German siege, the city surrendered to the Red Army, which had arrived from the east.": "Après un siège allemand, la ville s’est rendue à l’Armée rouge, qui était arrivée de l’Est."
"Kuty": "C’est bon."
"17–18 September 1939": "17–18 septembre 1939"
"The Polish president, government and high command crossed the bridge into Romania here and were interned.": "Le président, le gouvernement et le haut commandement polonais ont traversé le pont en Roumanie ici et ont été internés."
"Belarusian Front": "Front bélarussien"
"Ukrainian Front": "Front ukrainien"
"Surrender and partition": "Remise et partition"
"28 September – November 1939": "28 septembre – novembre 1939"
"Warsaw surrendered on 28 September. The same day Germany and the Soviet Union signed a Boundary and Friendship Treaty that moved the line between them east from the Vistula to the Bug, while most of Lithuania passed to the Soviet sphere. The last Polish field force, General Franciszek Kleeberg’s group, fought German troops at Kock until 5 October and surrendered the next day. About 65,000 Polish soldiers had been killed, and about 420,000 captured by Germany.": "Varsovie s’est rendue le 28 septembre. Le même jour, l’Allemagne et l’Union soviétique ont signé un traité de frontière et d’amitié qui a déplacé la ligne entre eux à l’Est de la Vistule au Bug, tandis que la plupart des Lituaniens passaient à la sphère soviétique. La dernière force de campagne polonaise, le général Franciszek Kleeberg, combattait les troupes allemandes à Kock jusqu’au 5 octobre et se rendait le lendemain."
"Germany annexed western Poland, including Danzig, Pomerania, Greater Poland and Upper Silesia, and ruled the centre as the General Government under Hans Frank from Kraków. The Soviet Union held staged elections in the east and annexed it to Soviet Belarus and Ukraine in November, giving Vilnius to Lithuania. A Polish government-in-exile formed in France under General Władysław Sikorski, and an underground army began to organise at home.": "L’Allemagne a annexé l’ouest de la Pologne, y compris Danzig, Poméranie, Grande Pologne et Haute Silésie, et a dirigé le centre en tant que gouvernement général sous Hans Frank de Cracovie. L’Union soviétique a tenu des élections organisées dans l’est et l’a annexée à la Biélorussie soviétique et l’Ukraine en novembre, donnant Vilnius à la Lituanie. Un gouvernement polonais en exil formé en France sous la direction du général Władysław Sikorski, et une armée souterraine a commencé à s’organiser chez elle."
"Boundary and Friendship Treaty": "Traité sur la frontière et l’amitié"
"28 September 1939, Moscow": "28 septembre 1939, Moscou"
"Battle of Kock": "Bataille de Kock"
"2–5 October 1939": "2–5 octobre 1939"
"General Government": "Administrations publiques"
"set up 26 October 1939": "créé le 26 octobre 1939"
"The capital surrendered after three weeks of siege, and German troops entered on 1 October.": "La capitale s’est rendue après trois semaines de siège, et les troupes allemandes sont entrées le 1er octobre."
"Kleeberg’s group, formed from units still fighting in the east, fought the last battle of the campaign and surrendered on 6 October.": "Le groupe de Kleeberg, formé d’unités encore en combat à l’est, a combattu la dernière bataille de la campagne et s’est rendu le 6 octobre."
"Kraków": "Cracovie"
"26 October 1939": "26 octobre 1939"
"Seat of the General Government, the German-ruled rump of central Poland under Governor-General Hans Frank.": "Siège du gouvernement général, le croupion allemand du centre de la Pologne sous la direction du gouverneur général Hans Frank."
"Vilnius": "Vilnius"
"28 October 1939": "28 octobre 1939"
"The Soviet Union handed the city and its region to Lithuania, in return for Soviet bases there.": "L’Union soviétique a remis la ville et sa région à la Lituanie, en échange de bases soviétiques là."
"Two occupations and Katyn": "Deux professions et Katyn"
"1939–1941": "1939–1941"
"Both occupiers set out to destroy Poland’s leaders and educated class. In the annexed lands German units and local ethnic German militias shot tens of thousands of Poles in 1939 and 1940, many of them in the Piaśnica forest in Pomerania, and the AB-Aktion of 1940 killed thousands more in the General Government, among them those shot at Palmiry near Warsaw. Hundreds of thousands of Poles were expelled from the annexed lands, Jews were forced into ghettos, and in June 1940 the first prisoners arrived at a new camp at Auschwitz.": "Dans les terres annexées, les unités allemandes et les milices locales allemandes ont abattu des dizaines de milliers de Polonais en 1939 et 1940, dont beaucoup dans la forêt de Piaśnica en Poméranie, et l’AB-Aktion de 1940 a tué des milliers d’autres au gouvernement général, parmi lesquels ceux qui avaient tiré à Palmiry près de Varsovie. Des centaines de milliers de Polonais ont été expulsés des terres annexées, les Juifs ont été forcés dans des ghettos, et en juin 1940 les premiers prisonniers sont arrivés à un nouveau camp à Auschwitz."
"In the Soviet zone the NKVD arrested officials, officers, landowners and community leaders, and from February 1940 deported whole families to Siberia and Kazakhstan; estimates of the number range from about 350,000 to 1.5 million. On 5 March 1940 the Soviet Politburo ordered the shooting of Polish officers, police and others held in its camps. In April and May nearly 22,000 were killed, at Katyn near Smolensk, at Kalinin and at Kharkiv. The Soviet Union blamed Germany until 1990.": "Dans la zone soviétique, le NKVD a arrêté des fonctionnaires, des officiers, des propriétaires fonciers et des dirigeants communautaires et, à partir de février 1940, a expulsé des familles entières vers la Sibérie et le Kazakhstan ; selon les estimations, ce nombre varie entre 350 000 et 1,5 million. Le 5 mars 1940, le Politburo soviétique a ordonné la fusillade d’officiers polonais, de policiers et autres détenus dans ses camps. En avril et mai, près de 22 000 personnes ont été tuées, à Katyn près de Smolensk, à Kalinin et à Kharkiv. L’Union soviétique a accusé l’Allemagne jusqu’en 1990."
"Katyn massacre": "Massacré de Katyn"
"April–May 1940, nearly 22,000 killed": "Avril-mai 1940, près de 22 000 morts"
"Soviet deportations": "Déportations soviétiques"
"about 350,000 to 1.5 million (estimates)": "de 350 000 à 1,5 million (estimations)"
"First prisoners at Auschwitz": "Premiers prisonniers à Auschwitz"
"14 June 1940": "14 juin 1940"
"Katyn": "- Katyn."
"April–May 1940": "avril–mai 1940"
"Prisoners from the Kozelsk camp, most of them officers, were shot in the forest here. Germany announced the discovery of the graves in 1943; the Soviet Union admitted responsibility in 1990.": "Des prisonniers du camp de Kozelsk, pour la plupart des officiers, ont été abattus dans la forêt. L’Allemagne a annoncé la découverte des tombes en 1943 ; l’Union soviétique a reconnu sa responsabilité en 1990."
"Piaśnica": "Piaśnica"
"autumn 1939": "automne 1939"
"Thousands of Poles, Kashubians and others from Pomerania were shot in the forest here in the first months of occupation.": "Des milliers de Polonais, de Kashubiens et d’autres de Poméranie ont été abattus dans la forêt au cours des premiers mois d’occupation."
"Palmiry": "Palmiry"
"1940–1941": "1940–1941"
"A forest north-west of Warsaw where the Germans secretly shot politicians, athletes, writers and other prisoners.": "Une forêt au nord-ouest de Varsovie où les Allemands ont secrètement abattu des politiciens, des athlètes, des écrivains et d’autres prisonniers."
"Auschwitz": "Auschwitz"
"The camp opened with a transport of Polish political prisoners. It later became the largest German killing centre.": "Le camp a ouvert avec un transport de prisonniers politiques polonais. Il est devenu plus tard le plus grand centre d’exécution allemand."
"Deportations east": "Déportations vers l’est"
"Denmark and Norway invaded": "Le Danemark et la Norvège ont envahi"
"9 April – 10 June 1940": "9 avril – 10 juin 1940"
"Early on 9 April 1940 Germany invaded Denmark and Norway, to secure the shipping route for Swedish iron ore and bases on the North Atlantic before Britain could. German troops crossed the Danish border at 04:15 and landed in Copenhagen, and paratroopers took the airfields at Aalborg. After brief fighting the Danish government accepted the occupation within hours. In Norway, landings from sea and air took Bergen, Trondheim and Narvik, but in the Oslofjord the guns and torpedoes of Oscarsborg fortress sank the cruiser Blücher, delaying the capture of Oslo long enough for the king and government to escape.": "Au début du 9 avril 1940, l’Allemagne envahit le Danemark et la Norvège, afin de sécuriser la route maritime pour le minerai de fer suédois et les bases sur l’Atlantique Nord avant que la Grande-Bretagne ne puisse. Les troupes allemandes franchissent la frontière danoise à 04h15 et débarquent à Copenhague, et les parachutistes prennent les aérodromes d’Aalborg. En Norvège, les débarquements de mer et d’air ont pris Bergen, Trondheim et Narvik, mais dans le fjord d’Oslo les canons et torpilles de la forteresse d’Oscarsborg ont coulé le croiseur Blücher, retardant la capture d’Oslo assez longtemps pour que le roi et le gouvernement puissent s’échapper."
"King Haakon VII refused German demands to appoint the Norwegian fascist leader Vidkun Quisling as prime minister, and Norway fought on. British, French and Polish troops landed in central Norway but were evacuated by early May; in the north some 38,000 landed near Narvik. The Royal Navy sank ten German destroyers there on 10 and 13 April, and Allied and Norwegian troops retook the town on 28 May. By then Germany had invaded France, and the Allies withdrew. The king left Tromsø for Britain on 7 June, and the Norwegian forces capitulated on 10 June, after 62 days.": "Le roi Haakon VII refusa aux Allemands de nommer le chef fasciste norvégien Vidkun Quisling Premier ministre et la Norvège combattit. Les troupes britanniques, françaises et polonaises débarquèrent en Norvège centrale mais furent évacuées au début du mois de mai ; dans le nord, quelque 38 000 personnes débarquèrent près de Narvik. La Royal Navy y fit couler dix destroyers allemands les 10 et 13 avril, et les troupes alliées et norvégiennes reprirent la ville le 28 mai. L’Allemagne avait alors envahi la France, et les Alliés se retiraient. Le roi quitta Tromsø pour la Grande-Bretagne le 7 juin, et les forces norvégiennes capitulèrent le 10 juin, après 62 jours."
"Invasion": "Invasion"
"9 April 1940": "9 avril 1940"
"Danish resistance": "Résistance danoise"
"about six hours": "environ six heures"
"Norwegian capitulation": "Capitulation norvégienne"
"10 June 1940": "10 juin 1940"
"Copenhagen": "Copenhague"
"Troops landed from a ship at Langelinie and took the Citadel almost unopposed. The king and government accepted the occupation that morning.": "Des troupes débarquent d’un navire à Langelinie et prennent la Citadelle presque sans opposition. Le roi et le gouvernement acceptent l’occupation ce matin-là."
"Aalborg": "Aalborg"
"German paratroopers seized the airfields, which became a base for the attack on Norway.": "Les parachutistes allemands ont saisi les aérodromes, qui sont devenus une base pour l’attaque contre la Norvège."
"Oscarsborg": "Les oscarsborgs"
"The fortress in the Drøbak Sound sank the heavy cruiser Blücher; an estimated 650–800 Germans died.": "La forteresse du détroit de Drøbak a coulé le gros croiseur Blücher ; on estime que 650–800 Allemands sont morts."
"Fornebu": "Fornebu"
"Airborne troops took Oslo’s airport, and the capital was occupied that afternoon.": "Les troupes aéroportées ont pris l’aéroport d’Oslo, et la capitale a été occupée cet après-midi."
"Midtskogen": "Midtskogen"
"10 April 1940": "10 avril 1940"
"Norwegian guardsmen and volunteers stopped a German raid sent to capture the king and government.": "Des gardes norvégiens et des volontaires ont arrêté un raid allemand envoyé pour capturer le roi et le gouvernement."
"Hegra Fortress": "Forteresse Hegra"
"9 April – 5 May 1940": "9 avril – 5 mai 1940"
"About 250 Norwegian volunteers held the old fortress east of Trondheim for 25 days.": "Environ 250 volontaires norvégiens ont tenu la vieille forteresse à l’est de Trondheim pendant 25 jours."
"Åndalsnes": "Åndalsnes"
"18 April – 2 May 1940": "18 avril – 2 mai 1940"
"British troops landed here to help defend central Norway and were evacuated after two weeks.": "Les troupes britanniques ont atterri ici pour aider à défendre la Norvège centrale et ont été évacuées après deux semaines."
"Battles of Narvik": "Batailles de Narvik"
"10 and 13 April 1940": "10 et 13 avril 1940"
"British destroyers and the battleship Warspite sank all ten German destroyers that had carried troops to Narvik.": "Destroyers britanniques et le navire de guerre Warspite ont coulé les dix destroyers allemands qui avaient transporté des troupes à Narvik."
"Narvik": "Le Président."
"28 May 1940": "28 mai 1940"
"French, Polish and Norwegian troops retook the town, but the Allies left it again in early June.": "Les troupes françaises, polonaises et norvégiennes ont repris la ville, mais les Alliés l’ont quittée au début du mois de juin."
"Tromsø": "Tromsø"
"7 June 1940": "7 juin 1940"
"King Haakon and the government sailed for Britain on HMS Devonshire, to lead Norway in exile.": "Le roi Haakon et le gouvernement s’embarquèrent pour la Grande-Bretagne dans le HMS Devonshire, pour mener la Norvège en exil."
"To Oslo": "À Oslo"
"To Narvik": "À Narvik"
"Occupied by Germany by 10 June 1940": "Occupé par l’Allemagne au 10 juin 1940"
"The fall of the Low Countries": "La chute des pays bas"
"10–21 May 1940": "10–21 mai 1940"
"On 10 May 1940 Germany invaded the neutral Netherlands, Belgium and Luxembourg. Airborne troops seized bridges and airfields ahead of the tanks, and at Eben-Emael, the Belgian fortress guarding the Albert Canal, 78 paratroopers landed by glider on its roof and put its guns out of action within a day. An attempt to capture the Dutch government at The Hague failed, and Queen Wilhelmina and her ministers left for London on 13 May. On 14 May German bombers destroyed the centre of Rotterdam, and the Dutch army surrendered that evening; Zeeland held out until 17 May.": "Le 10 mai 1940, l’Allemagne envahit les Pays-Bas neutres, la Belgique et le Luxembourg. Des troupes aéroportées s’emparèrent de ponts et d’aérodromes devant les chars, et à Eben-Emael, forteresse belge qui gardait le canal Albert, 78 parachutistes débarquèrent par planeur sur son toit et mettent ses canons hors d’action en un jour. Une tentative de capture du gouvernement néerlandais à La Haye échoua, et la reine Wilhelmina et ses ministres partirent pour Londres le 13 mai. Le 14 mai, des bombardiers allemands détruisirent le centre de Rotterdam, et l’armée néerlandaise se rendit ce soir-là ; la Zélande s’arrêta jusqu’au 17 mai."
"The British Expeditionary Force and the best French armies advanced into Belgium to meet what they took to be the main attack. But the main German thrust came further south, through the wooded Ardennes, which the French had thought unsuitable for tanks. Guderian’s panzer corps crossed the Meuse at Sedan on 13 May, broke through and raced west, reaching the Channel near Abbeville on 20 May. The Allied armies in Belgium were cut off from the main French forces, and a British counter-attack at Arras on 21 May could not reopen the way south.": "Mais la principale poussée allemande est venue plus au sud, à travers les Ardennes boisées, que les Français avaient jugé inaptes aux chars. Le corps des panzers de Guderian a traversé la Meuse à Sedan le 13 mai, s’est brisé et a couru vers l’ouest, atteignant la Manche près d’Abbeville le 20 mai. Les armées alliées de Belgique furent coupées des principales forces françaises, et une contre-attaque britannique à Arras le 21 mai ne put pas rouvrir la voie vers le sud."
"10 May 1940": "10 mai 1940"
"Killed in Rotterdam": "Tué à Rotterdam"
"at least 1,150, 711 of them in the bombing of 14 May": "au moins 1 150, 711 d’entre eux dans le bombardement du 14 mai"
"Dutch surrender": "La reddition néerlandaise"
"14 May 1940 (Zeeland 17 May)": "14 mai 1940 (Zéland 17 mai)"
"Eben-Emael": "Eben-Emael"
"10–11 May 1940": "10–11 mai 1940"
"Paratroopers landed by glider on the fortress and blew up its guns with hollow charges; the garrison surrendered the next day.": "Des parachutistes débarquèrent par planeur sur la forteresse et firent sauter ses canons avec des charges creuses ; la garnison se rendit le lendemain."
"The Hague": "La Haye"
"Dutch troops retook the airfields at Ypenburg, Ockenburg and Valkenburg from German airborne troops sent to seize the government and the queen.": "Les troupes néerlandaises ont repris les aérodromes d’Ypenburg, d’Ockenburg et de Valkenburg des troupes allemandes envoyées pour saisir le gouvernement et la reine."
"Kornwerderzand": "Kornwerderzand"
"12–14 May 1940": "12–14 mai 1940"
"The casemates at the end of the Afsluitdijk stopped a German advance across the dike towards North Holland.": "Les casemates à la fin de l’Afsluitdijk ont arrêté une avance allemande à travers la digue vers la Hollande du Nord."
"Grebbeberg": "Grebbeberg"
"11–13 May 1940": "11–13 mai 1940"
"German troops broke through the main Dutch defence line after three days of fighting.": "Les troupes allemandes ont franchi la principale ligne de défense néerlandaise après trois jours de combats."
"Rotterdam": "Rotterdam"
"14 May 1940": "14 mai 1940"
"Bombing destroyed the old city centre, killing 711 people and leaving about 85,000 homeless. The Netherlands surrendered that evening.": "Les bombardements ont détruit le centre-ville, tuant 711 personnes et laissant environ 85 000 sans abri."
"Sedan": "Sedan"
"13–15 May 1940": "13–15 mai 1940"
"Guderian’s corps crossed the Meuse under heavy air attack on the French positions and broke through the French line.": "Le corps de Guderian a traversé la Meuse sous une forte attaque aérienne contre les positions françaises et a franchi la ligne française."
"Abbeville": "Abbeville"
"20 May 1940": "20 mai 1940"
"German tanks reached the sea at the mouth of the Somme, cutting the Allied armies in two.": "Les chars allemands atteignirent la mer à l’embouchure de la Somme, coupant les armées alliées en deux."
"Arras": "Arras"
"21 May 1940": "21 mai 1940"
"A British counter-attack with tanks briefly shook Rommel’s division but failed to cut the German corridor.": "Une contre-attaque britannique avec des chars a brièvement secoué la division Rommel, mais n’a pas réussi à couper le couloir allemand."
"Guderian": "Guderian"
"BEF": "BEF"
"French 7th Army": "Français 7ème armée"
"Held by Germany, 21 May 1940 (approximate)": "Tenue par l’Allemagne, le 21 mai 1940 (approximative)"
"Allied lines, 21 May 1940 (approximate)": "Lignes alliées, 21 mai 1940 (approximative)"
"British and French moves": "Les mouvements britanniques et français"
"Dunkirk and the fall of France": "Dunkerque et la chute de France"
"24 May – 25 June 1940": "24 mai – 25 juin 1940"
"Trapped against the coast, the British, French and Belgian armies fell back on Dunkirk. On 24 May Hitler confirmed an order halting the panzers outside the town, lifted only on 26 May, and the defenders used the pause to strengthen the perimeter. King Leopold III surrendered the Belgian army on 28 May, after 18 days of fighting. Between 26 May and 4 June Operation Dynamo carried about 338,000 soldiers, some 199,000 British and 139,000 French, to England in warships, ferries and hundreds of small boats, under constant air attack. About 40,000 French troops holding the perimeter were taken prisoner.": "Le 24 mai, Hitler confirma un ordre d’arrêt des panzers en dehors de la ville, levé seulement le 26 mai, et les défenseurs utilisèrent la pause pour renforcer le périmètre. Le roi Léopold III rendit l’armée belge le 28 mai, après 18 jours de combats. Entre le 26 mai et le 4 juin, l’opération Dynamo a transporté environ 338 000 soldats, soit 199 000 Britanniques et 139 000 Français, en Angleterre, dans des navires de guerre, des traversiers et des centaines de petites embarcations, sous une attaque aérienne constante."
"Germany attacked south across the Somme and the Aisne on 5 June. Italy declared war on France and Britain on 10 June, and German troops entered Paris unopposed on 14 June. Marshal Philippe Pétain became prime minister and asked for an armistice, while in London General Charles de Gaulle broadcast an appeal on 18 June to fight on. The armistice was signed on 22 June in the railway carriage at Compiègne where Germany had signed in 1918. About 1.8 million French soldiers were prisoners, and Germany occupied the north and the Atlantic coast, some three-fifths of France.": "L’Allemagne attaqua le sud à travers la Somme et l’Aisne le 5 juin. L’Italie déclara la guerre à la France et à la Grande-Bretagne le 10 juin, et les troupes allemandes entrèrent à Paris sans opposition le 14 juin. Le maréchal Philippe Pétain devint premier ministre et demanda un armistice, tandis qu’à Londres, le général Charles de Gaulle publiait un appel pour se battre le 18 juin. L’armistice a été signé le 22 juin dans le transport ferroviaire à Compiègne où l’Allemagne avait signé en 1918. Environ 1,8 million de soldats français étaient prisonniers, et l’Allemagne occupait le nord et la côte atlantique, environ les trois cinquièmes de la France."
"On 10 July the National Assembly, meeting at Vichy, voted full powers to Pétain by 569 votes to 80, ending the Third Republic. His “French State” governed the unoccupied south from the spa town and, in name, the whole country, while Alsace and Moselle were annexed by Germany in all but name. In Britain, de Gaulle began to build the Free French forces from the few thousand soldiers and sailors who had joined him.": "Le 10 juillet, l’Assemblée nationale, réunie à Vichy, a voté les pleins pouvoirs à Pétain par 569 voix contre 80, mettant fin à la troisième République. Son Etat français dirigeait le sud inoccupé de la ville thermale et, en nom, tout le pays, tandis que l’Alsace et la Moselle étaient annexées par l’Allemagne en tous autres noms."
"Evacuated from Dunkirk": "Évacué de Dunkerque"
"about 338,000 (26 May – 4 June 1940)": "environ 338 000 (26 mai-4 juin 1940)"
"Armistice": "Armistice"
"signed 22 June, in force 25 June 1940": "signé le 22 juin, en vigueur le 25 juin 1940"
"French prisoners of war": "Prisonniers de guerre français"
"about 1.8 million": "Environ 1,8 million"
"Dunkirk": "Dunkrk"
"26 May – 4 June 1940": "26 mai – 4 juin 1940"
"More than 800 vessels, from destroyers to pleasure boats, took off about 338,000 troops from the harbour mole and the beaches.": "Plus de 800 navires, des destroyers aux bateaux de plaisance, ont décollé environ 338 000 soldats de la taupe portuaire et des plages."
"Le Paradis": "Le Paradis"
"27 May 1940": "27 mai 1940"
"SS troops machine-gunned 97 soldiers of the Royal Norfolk Regiment after they had surrendered; two survived.": "Les troupes SS ont mitraillé 97 soldats du Royal Norfolk Regiment après leur reddition ; deux ont survécu."
"Lille": "Lille"
"28–31 May 1940": "28–31 mai 1940"
"About 40,000 French troops, surrounded south of the city, held out for four days and tied down several German divisions during the evacuation.": "Environ 40 000 soldats français, encerclés au sud de la ville, ont tenu quatre jours et ligoté plusieurs divisions allemandes pendant l’évacuation."
"Paris": "Paris"
"The government had declared Paris an open city, and German troops entered it without a fight.": "Le gouvernement avait déclaré Paris une ville ouverte, et les troupes allemandes y sont entrées sans se battre."
"Lancastria": "Lancastria"
"17 June 1940": "17 juin 1940"
"German bombers sank the troopship off Saint-Nazaire as it evacuated British soldiers and civilians; between 4,000 and 7,000 people died.": "Des bombardiers allemands ont coulé le navire au large de Saint-Nazaire alors qu’il évacuait des soldats et des civils britanniques ; entre 4 000 et 7 000 personnes sont mortes."
"Compiègne": "Compiègne"
"22 June 1940": "22 juin 1940"
"The armistice was signed in the same railway carriage, in the same forest clearing, as the armistice of 1918.": "L’armistice a été signé dans le même wagon de chemin de fer, dans la même clairière forestière, que l’armistice de 1918."
"Vichy": "Vichy"
"10 July 1940": "10 juillet 1940"
"The National Assembly voted full powers to Pétain, and his government settled in the spa town’s hotels.": "L’Assemblée nationale a voté les pleins pouvoirs à Pétain, et son gouvernement s’est installé dans les hôtels de la ville thermale."
"Menton": "Menton"
"21–24 June 1940": "21–24 juin 1940"
"Italy’s offensive in the Alps made little headway; Menton was the only town of any size it occupied before the Franco-Italian armistice of 24 June.": "L’offensive italienne dans les Alpes a peu progressé ; Menton était la seule ville de toute taille qu’il occupait avant l’armistice franco-italien du 24 juin."
"Operation Dynamo": "Opération Dynamo"
"Occupied by Germany under the armistice of 22 June 1940": "Occupé par l’Allemagne sous l’armistice du 22 juin 1940"
"Unoccupied zone, governed from Vichy": "Zone inoccupée, gouvernée depuis Vichy"
"British and French success": "Succès britannique et français"
"The Battle of Britain and the Blitz": "La bataille d’Angleterre et le Blitz"
"July 1940 – May 1941": "juillet 1940 – mai 1941"
"With France defeated, Britain under Winston Churchill, prime minister since 10 May, refused to negotiate. Hitler ordered preparations for an invasion, Operation Sea Lion, which needed control of the air over the Channel. From July the Luftwaffe attacked convoys and ports, and from 13 August the airfields and radar stations of RAF Fighter Command. The British fighters, guided by radar and a network of observers, were stretched but never broken; among their pilots were 145 Poles and 88 Czechoslovaks. After heavy German losses on 15 September, Hitler postponed the invasion indefinitely two days later.": "Après la défaite de la France, la Grande-Bretagne sous Winston Churchill, premier ministre depuis le 10 mai, refusa de négocier. Hitler ordonna les préparatifs d’une invasion, l’opération Sea Lion, qui nécessitait le contrôle des airs au-dessus de la Manche. Les combattants britanniques, guidés par le radar et un réseau d’observateurs, étaient étirés mais jamais brisés ; parmi leurs pilotes étaient 145 Polonais et 88 Tchécoslovaques. Après de lourdes pertes allemandes le 15 septembre, Hitler reporta l’invasion indéfiniment deux jours plus tard."
"From 7 September the Luftwaffe turned to bombing London and then other cities, mostly at night. London was bombed on 56 of the next 57 days and nights, and a raid on Coventry on 14–15 November killed about 568 people. Liverpool, Birmingham, Clydebank, Belfast, Plymouth and other cities were hit until the last great raid on London on 10–11 May 1941, after which Germany moved its bombers east. More than 40,000 British civilians were killed, almost half of them in London. The Channel Islands, the only British soil Germany occupied, were held from 30 June 1940 until May 1945.": "À partir du 7 septembre, la Luftwaffe s’est tournée vers les bombardements de Londres et d’autres villes, principalement la nuit. Londres a été bombardé sur 56 des 57 jours et nuits suivants, et un raid sur Coventry les 14-15 novembre a tué environ 568 personnes. Liverpool, Birmingham, Clydebank, Belfast, Plymouth et d’autres villes ont été touchés jusqu’au dernier grand raid sur Londres les 10-11 mai 1941, après quoi l’Allemagne a déplacé ses bombardiers à l’Est. Plus de 40 000 civils britanniques ont été tués, dont près de la moitié à Londres. Les îles Anglo-Normandes, seul territoire britannique occupé par l’Allemagne, ont été retenues du 30 juin 1940 au mai 1945."
"Battle of Britain": "Bataille d’Angleterre"
"10 July – 31 October 1940": "10 juillet – 31 octobre 1940"
"The Blitz": "Le Blitz"
"7 September 1940 – 11 May 1941": "7 septembre 1940 – 11 mai 1941"
"Civilians killed": "Les civils tués"
"more than 40,000": "plus de 40 000"
"Channel Islands": "Îles Anglo-Normandes"
"30 June – 1 July 1940": "30 juin – 1er juillet 1940"
"German troops landed unopposed on the islands, which Britain had demilitarised, and held them until 9 May 1945.": "Les troupes allemandes débarquent sans opposition sur les îles, que la Grande-Bretagne avait démilitarisées, et les tiennent jusqu’au 9 mai 1945."
"Biggin Hill": "La colline Biggin"
"August – September 1940": "août – septembre 1940"
"One of the Fighter Command airfields south of London that bore the brunt of the German attacks in August and early September.": "L’un des aérodromes du Commandement des chasseurs, au sud de Londres, a été le plus touché par les attaques allemandes en août et début septembre."
"London": "Londres"
"Bombed on 56 of 57 days and nights from 7 September; the fire raid of 29 December burned much of the City.": "Bombé sur 56 des 57 jours et nuits du 7 septembre ; le raid de tir du 29 décembre a brûlé une grande partie de la ville."
"Coventry": "Coventry"
"14–15 November 1940": "14–15 novembre 1940"
"About 568 people were killed and the medieval cathedral was destroyed.": "Environ 568 personnes ont été tuées et la cathédrale médiévale a été détruite."
"Liverpool": "Liverpool"
"August 1940 – May 1941": "août 1940 – mai 1941"
"About 4,000 people were killed on Merseyside, more than anywhere outside London; the heaviest raids came in the first week of May 1941.": "Environ 4 000 personnes ont été tuées à Merseyside, plus qu’à l’extérieur de Londres ; les raids les plus importants ont eu lieu la première semaine de mai 1941."
"Clydebank": "Banque Clyde"
"13–14 March 1941": "13–14 mars 1941"
"Of about 12,000 houses in the shipbuilding town only eight were left undamaged; 528 people were killed.": "Sur les quelque 12 000 maisons de la ville de construction navale, seules huit ont été laissées intactes ; 528 personnes ont été tuées."
"Belfast": "Belfast"
"15–16 April 1941": "15–16 avril 1941"
"Nearly 1,000 people died in a single night, one of the deadliest raids outside London.": "Près de 1 000 personnes sont mortes en une seule nuit, l’un des raids les plus meurtriers devant Londres."
"Luftflotte 2": "Luftflotte 2"
"Luftflotte 3": "Luftflotte 3"
"Occupied by Germany, 30 June 1940 – 9 May 1945": "Occupé par l’Allemagne, du 30 juin 1940 au 9 mai 1945"
"British success": "Succès britannique"
"German air attacks": "Attaques aériennes allemandes"
"The desert war and the siege of Malta": "La guerre du désert et le siège de Malte"
"September 1940 – July 1942": "septembre 1940 – juillet 1942"
"Italy entered the war on 10 June 1940, as France was collapsing, and from its colony of Libya it invaded Egypt, where British forces guarded the Suez Canal. Marshal Rodolfo Graziani’s 10th Army advanced about 100 km in September and dug in around Sidi Barrani. In November British carrier aircraft crippled three Italian battleships in harbour at Taranto. On 9 December General Richard O’Connor’s Western Desert Force, some 36,000 men, attacked. In two months it took Sidi Barrani, Bardia and Tobruk, cut off the retreating Italians at Beda Fomm and captured more than 130,000 prisoners.": "L’Italie entra dans la guerre le 10 juin 1940, alors que la France s’écroulait, et de sa colonie de Libye elle envahit l’Égypte, où les forces britanniques gardaient le canal de Suez. Le maréchal Rodolfo Graziani avançait sur une centaine de kilomètres en septembre et creusait autour de Sidi Barrani. Le 9 décembre, la Force du désert de l’Ouest, soit 36 000 hommes environ, a attaqué le général Richard O-Connor. En deux mois, il a pris Sidi Barrani, Bardia et Tobruk, coupé les Italiens en retraite à Beda Fomm et capturé plus de 130 000 prisonniers."
"In February 1941 Hitler sent Erwin Rommel to Libya with the first units of what became the Afrika Korps, while many of O’Connor’s troops left for Greece. Rommel drove the British back to the Egyptian border, though an Australian-led garrison held Tobruk through an eight-month siege until it was relieved in November. In May 1942 Rommel struck again at Gazala, where Free French troops held Bir Hakeim for two weeks. Tobruk fell on 21 June with some 33,000 prisoners, and the Axis advance was stopped only at El Alamein, about 100 km from Alexandria, in July.": "En février 1941, Hitler envoya Erwin Rommel en Libye avec les premières unités de ce qui devint l’Afrika Korps, tandis que beaucoup de troupes d’O-Connor sont partis pour la Grèce. Rommel conduisit les Britanniques à la frontière égyptienne, bien qu’une garnison dirigée par l’Australie a tenu Tobrouk à travers un siège de huit mois jusqu’à ce qu’il soit relevé en novembre. En mai 1942 Rommel frappe de nouveau à Gazala, où les troupes françaises libres ont tenu Bir Hakeim pendant deux semaines. Tobruk tombe le 21 juin avec quelque 33 000 prisonniers, et l’avance de l’Axe est arrêtée seulement à El Alamein, à environ 100 km d’Alexandrie, en juillet."
"Everything turned on supplies. From Malta British aircraft and submarines attacked the convoys carrying fuel and troops to Libya, and German and Italian aircraft bombed the island from June 1940 until late 1942, most heavily in the spring of 1942, when its people and garrison came close to starvation. King George VI awarded the island the George Cross in April 1942. In August a convoy fought its way through, Operation Pedestal; most of its ships were sunk, but the tanker Ohio and four freighters reached Valletta.": "De Malte, des avions britanniques et des sous-marins attaquèrent les convois transportant du carburant et des troupes vers la Libye, et des avions allemands et italiens bombardèrent l’île de juin 1940 à la fin de 1942, surtout au printemps 1942, lorsque son peuple et sa garnison s’approchaient de la famine. En août, un convoi a traversé l’opération Pédestal ; la plupart de ses navires ont été coulés, mais le pétrolier Ohio et quatre cargos sont arrivés à La Valette."
"Operation Compass": "Opération Compass"
"9 December 1940 – 9 February 1941, more than 130,000 Italian prisoners": "9 décembre 1940 – 9 février 1941, plus de 130 000 prisonniers italiens"
"Siege of Tobruk": "Siège de Tobrouk"
"April – November 1941": "avril – novembre 1941"
"Siege of Malta": "Siège de Malte"
"June 1940 – November 1942, about 1,300 civilians killed": "Juin 1940 – novembre 1942, environ 1 300 civils tués"
"Taranto": "Tarente"
"11–12 November 1940": "11–12 novembre 1940"
"Swordfish torpedo bombers from the carrier Illustrious put three Italian battleships out of action in their harbour.": "Des bombardiers de torpilles de poissons d’épée du transporteur Illustrent ont mis trois navires de guerre italiens hors d’action dans leur port."
"Sidi Barrani": "Sidi Barrani"
"10–11 December 1940": "10–11 décembre 1940"
"The opening battle of Operation Compass. The fortified Italian camps around the town fell within three days, and tens of thousands of Italians surrendered.": "La bataille d’ouverture de l’opération Compass. Les camps italiens fortifiés autour de la ville sont tombés dans les trois jours, et des dizaines de milliers d’Italiens se sont rendus."
"Beda Fomm": "Béda Fomm"
"5–7 February 1941": "5–7 février 1941"
"British armour cut across the desert ahead of the retreating 10th Army, which surrendered after two days of fighting.": "L’armure britannique a traversé le désert avant la 10e armée en retraite, qui s’est rendue après deux jours de combats."
"Tobruk": "Tobruk"
"10 April – 27 November 1941": "10 avril – 27 novembre 1941"
"Australian, then British, Polish and Czechoslovak troops held the port for 241 days, supplied by sea, until Operation Crusader relieved it.": "Les troupes australiennes, puis britanniques, polonaises et tchécoslovaques ont tenu le port pendant 241 jours, approvisionné par la mer, jusqu’à ce que l’opération Crusader le libère."
"Gazala": "Gazala"
"26 May – 21 June 1942": "26 mai – 21 juin 1942"
"Rommel’s offensive broke the British line, and Tobruk fell on 21 June with some 33,000 prisoners.": "L’offensive de Rommel a brisé la ligne britannique, et Tobrouk est tombé le 21 juin avec quelque 33 000 prisonniers."
"Bir Hakeim": "Bir Hakeim"
"26 May – 11 June 1942": "26 mai – 11 juin 1942"
"General Marie-Pierre Koenig’s 1st Free French Brigade held the southern end of the Gazala line for two weeks before breaking out.": "Le général Marie-Pierre Koenig's 1ère Brigade française libre a tenu l’extrémité sud de la ligne Gazala pendant deux semaines avant d’éclater."
"El Alamein": "El Alamein"
"1–27 July 1942": "1–27 juillet 1942"
"The First Battle of El Alamein stopped the Axis advance on Egypt about 100 km west of Alexandria.": "La première bataille d’El Alamein a stoppé l’avancée de l’Axe sur l’Egypte à environ 100 km à l’ouest d’Alexandrie."
"Malta": "Malte"
"June 1940 – November 1942": "juin 1940 – novembre 1942"
"Some 3,000 air raids hit the island, and about 1,300 civilians were killed. The island was awarded the George Cross on 15 April 1942.": "Quelque 3 000 raids aériens ont frappé l’île et environ 1 300 civils ont été tués. L’île a reçu la Croix de George le 15 avril 1942."
"O’Connor": "O’Connor"
"Rommel, 1941": "Rommel, 1941"
"Rommel, 1942": "Rommel, 1942"
"Front at El Alamein, July 1942 (approximate)": "Front à El Alamein, juillet 1942 (approximation)"
"German and Italian success": "Succès allemand et italien"
"British and Commonwealth moves": "Les mouvements des Britanniques et du Commonwealth"
"German and Italian moves": "Mouvements allemands et italiens"
"The Greco-Italian War": "La guerre gréco-italienne"
"28 October 1940 – April 1941": "28 octobre 1940 – avril 1941"
"Mussolini, eager to match Germany’s conquests, decided to attack Greece without telling Hitler first. Early on 28 October 1940 the Italian minister in Athens delivered an ultimatum demanding passage for Italian troops. The dictator Ioannis Metaxas refused, a moment Greeks still mark every year as Ohi (“No”) Day, and within hours Italian forces crossed from Albania, which Italy had occupied in 1939. Their main thrust in Epirus was stopped on the Kalamas river, and in the Pindus mountains Greek troops cut off and mauled the Julia Alpine Division in early November.": "Au début du 28 octobre 1940, le ministre italien à Athènes a livré un ultimatum exigeant le passage des troupes italiennes. Le dictateur Ioannis Metaxas refusa, un moment que les Grecs marquent toujours chaque année comme Ohi (-) Jour, et en quelques heures les forces italiennes passèrent d’Albanie, que l’Italie avait occupée en 1939. Leur poussée principale à Epirus a été arrêtée sur le fleuve Kalamas, et dans les montagnes de Pindus les troupes grecques ont coupé et maulé la Julia Alpine Division au début novembre."
"The Greeks then went over to the attack and drove the Italians back into Albania. They took Korçë on 22 November, Sarandë and Gjirokastër early in December, Himarë just before Christmas and the Klisura pass in January 1941. It was one of the first Allied victories of the war on land. In the snow of the Albanian mountains, where many soldiers on both sides lost limbs to frostbite, the front then stalled. An Italian spring offensive in March, watched by Mussolini, failed with heavy losses, but Greece had sent almost its whole army to Albania, leaving Macedonia thinly held when Germany attacked in April.": "Les Grecs sont ensuite passés à l’attaque et ont ramené les Italiens en Albanie. Ils ont pris Korçë le 22 novembre, Sarandë et Gjirokastër au début de décembre, Himarë juste avant Noël et le col Klisura en janvier 1941. C’était une des premières victoires alliées de la guerre sur terre. Dans la neige des montagnes albanaises, où de nombreux soldats des deux côtés ont perdu des membres en gelure, le front s’est alors arrêté. Une offensive de printemps italienne en mars, suivie par Mussolini, a échoué avec de lourdes pertes, mais la Grèce avait envoyé presque toute son armée en Albanie, laissant la Macédoine à peine tenue lorsque l’Allemagne attaquait en avril."
"Italian ultimatum": "ultimatum italien"
"28 October 1940, rejected by Metaxas": "28 octobre 1940, rejeté par Metaxas"
"Korçë taken by the Greeks": "Korçë prise par les Grecs"
"22 November 1940": "22 novembre 1940"
"Dead": "Mort"
"about 13,700 Italian and 13,300 Greek soldiers": "environ 13 700 soldats italiens et 13 300 soldats grecs"
"Elaia–Kalamas (Kalpaki)": "Elaia–Kalamas (Kalpaki)"
"2–8 November 1940": "2–8 novembre 1940"
"Greek troops dug in around Kalpaki held the main Italian thrust into Epirus, which was aimed at Ioannina.": "Les troupes grecques creusées autour de Kalpaki tenaient la principale poussée italienne dans Epirus, qui était destinée à Ioannina."
"Pindus": "Pindus"
"28 October – 13 November 1940": "28 octobre – 13 novembre 1940"
"The Italian Julia Alpine Division pushed deep into the mountains towards Metsovo before Greek troops cut it off and drove it back with heavy losses.": "La division italienne Julia Alpine a poussé profondément dans les montagnes en direction de Metsovo avant que les troupes grecques ne l’éteignent et la ramènent avec de lourdes pertes."
"Korçë": "Korçë"
"The main Italian base in south-eastern Albania, called Koritsa in Greek, fell after the Battle of Morava–Ivan.": "La principale base italienne du sud-est de l’Albanie, appelée Koritsa en grec, est tombée après la bataille de Morava–Ivan."
"Gjirokastër": "Gjirokastër"
"8 December 1940": "8 décembre 1940"
"Greek troops entered the town, Argyrokastro in Greek, two days after taking the port of Sarandë.": "Les troupes grecques sont entrées dans la ville, Argyrokastro en grec, deux jours après avoir pris le port de Sarandë."
"Himarë": "Himarë"
"late December 1940": "fin décembre 1940"
"The Greek advance along the coast reached Himarë, some 45 km south of Vlorë, the Italians’ main supply port.": "L’avance grecque le long de la côte a atteint Himarë, à environ 45 km au sud de Vlorë, le port d’approvisionnement principal des Italiens."
"Klisura (Këlcyrë)": "Klisura (Këlcyrë)"
"10 January 1941": "10 janvier 1941"
"The pass on the Vjosë was one of the last big gains of the Greek offensive.": "La passe sur la Vjosë a été l’un des derniers grands gains de l’offensive grecque."
"Trebeshinë": "Trebeshinë"
"9–24 March 1941": "9–24 mars 1941"
"The Italian spring offensive against the heights between the Vjosë and the Osum gained almost no ground, at heavy cost to both sides.": "L’offensive du printemps italien contre les hauteurs entre le Vjosë et l’Osum n’a pratiquement pas gagné de terrain, à un coût lourd pour les deux camps."
"Into Epirus": "Dans l’épirus"
"Julia Division": "Division Julia"
"To Korçë": "À Korçë"
"To Klisura": "À Klisura"
"To Himarë": "À Himarë"
"Held by Greece, March 1941 (approximate)": "Tenue par la Grèce, mars 1941 (approximative)"
"Yugoslavia and Greece invaded": "La Yougoslavie et la Grèce ont envahi"
"6–30 April 1941": "6–30 avril 1941"
"Hitler wanted his southern flank secure before he invaded the Soviet Union. Bulgaria joined the Axis on 1 March 1941 and let German armies in, and on 25 March Yugoslavia’s regent, Prince Paul, also signed the Tripartite Pact. Two days later officers overthrew him in a coup, cheered by crowds in Belgrade, and Hitler ordered Yugoslavia destroyed. On 6 April the Luftwaffe bombed Belgrade without a declaration of war. Estimates of the dead range from about 1,500 to 17,000; many historians think 3,000–4,000 the likeliest. German, Italian and Hungarian armies attacked from all sides, Croatian units mutinied, and the army capitulated on 17 April, as the victors divided the country between them.": "Hitler voulait que son flanc méridional soit sécurisé avant d’envahir l’Union soviétique. La Bulgarie rejoignit l’Axe le 1er mars 1941 et laissa entrer les armées allemandes. Le 25 mars, le régent de Yougoslavie, le prince Paul, signa également le Pacte tripartite. Deux jours plus tard, des officiers le renversèrent par un coup d’Etat, applaudis par des foules à Belgrade, et Hitler ordonna la destruction de la Yougoslavie. Les estimations des morts vont d’environ 1 500 à 17 000 personnes ; de nombreux historiens pensent que les armées allemandes, italiennes et hongroises ont attaqué de tous côtés, des unités croates mutinées, et l’armée a capitulé le 17 avril, alors que les vainqueurs partageaient le pays."
"Greece was attacked the same day from Bulgaria. The forts of the Metaxas Line held for several days, but German armour came round through Yugoslav Macedonia and took Thessaloniki on 9 April. Some 60,000 British, Australian and New Zealand troops, sent to Greece in March, fell back with the Greeks through Vevi, Olympus and Thermopylae. The Greek army in Albania, cut off, surrendered on 20 April, two days after Prime Minister Alexandros Koryzis had killed himself. German troops entered Athens on 27 April, and the Royal Navy took some 50,000 Allied soldiers off the beaches to Crete and Egypt.": "La Grèce a été attaquée le même jour depuis la Bulgarie. Les forts de la ligne Metaxas ont tenu pendant plusieurs jours, mais l’armure allemande est venue par la Macédoine yougoslave et a pris Thessalonique le 9 avril. Environ 60 000 troupes britanniques, australiennes et néo-zélandaises, envoyées en Grèce en mars, sont tombées avec les Grecs par Vevi, Olympus et Thermopylae. L’armée grecque en Albanie, coupée, s’est rendue le 20 avril, deux jours après la mort du Premier ministre Alexandros Koryzis. Les troupes allemandes sont entrées à Athènes le 27 avril et la Marine royale a emmené quelque 50 000 soldats alliés sur les plages de Crète et d’Égypte."
"Bombing of Belgrade": "Bombardement de Belgrade"
"6–7 April 1941": "6–7 avril 1941"
"Yugoslav capitulation": "Capitulation yougoslave"
"17 April 1941, in force 18 April": "17 avril 1941, en vigueur le 18 avril"
"Athens occupied": "Athènes occupée"
"27 April 1941": "27 avril 1941"
"Belgrade": "Belgrade"
"Waves of bombers struck the city from the first morning. Much of the centre was destroyed, along with the National Library and its manuscripts.": "Des vagues de bombardiers ont frappé la ville dès le premier matin. Une grande partie du centre a été détruite, ainsi que la Bibliothèque nationale et ses manuscrits."
"Zagreb": "Zagreb"
"10 April 1941": "10 avril 1941"
"As German troops entered the city, the Ustaša leader Slavko Kvaternik proclaimed the Independent State of Croatia.": "Alors que les troupes allemandes entraient dans la ville, le chef Oustaša Slavko Kvaternik proclamait l’État indépendant de Croatie."
"Skopje": "M. Skopje"
"7 April 1941": "7 avril 1941"
"German armour from Bulgaria took the city on the second day, cutting the Yugoslav army off from the Greeks and British.": "L’armure allemande de Bulgarie a pris la ville le deuxième jour, coupant l’armée yougoslave des Grecs et des Britanniques."
"Fort Roupel": "Fort Roupel"
"6–9 April 1941": "6–9 avril 1941"
"The fort in the Rupel gorge held out against German assaults until the Greek forces in eastern Macedonia were ordered to surrender.": "Le fort de la gorge de Rupel s’est tenu contre les assauts allemands jusqu’à ce que les forces grecques dans l’est de la Macédoine aient reçu l’ordre de se rendre."
"Thessaloniki": "Thessalonique"
"9 April 1941": "9 avril 1941"
"The 2nd Panzer Division reached the city through Yugoslav territory, cutting off the Greek army in eastern Macedonia.": "La 2e Division Panzer a atteint la ville par le territoire yougoslave, coupant l’armée grecque dans l’est de la Macédoine."
"Vevi": "Vévi"
"11–12 April 1941": "11–12 avril 1941"
"SS troops broke through Australian, New Zealand, British and Greek defenders at the Klidi pass, opening the road south.": "Des soldats SS ont franchi l’Australie, la Nouvelle-Zélande, des défenseurs britanniques et grecs au col Klidi, ouvrant la route vers le sud."
"Thermopylae": "Thermopyles"
"24–25 April 1941": "24–25 avril 1941"
"New Zealand and Australian rearguards held the pass long enough for the evacuation from the southern beaches to begin.": "La Nouvelle-Zélande et les arrière-gardes australiennes ont tenu le col assez longtemps pour que l’évacuation des plages du sud commence."
"Athens": "Athènes"
"German troops entered the capital and raised the swastika flag over the Acropolis.": "Les troupes allemandes entrèrent dans la capitale et soulevèrent le drapeau swastika au-dessus de l’Acropole."
"2nd Army": "2e armée"
"1st Panzer Group": "1er Groupe Panzer"
"12th Army": "12e armée"
"To Athens": "À Athènes"
"Italian 2nd Army": "2ème armée italienne"
"Hungarian 3rd Army": "3ème armée hongroise"
"Crete": "Crète"
"20 May – 1 June 1941": "20 mai – 1er juin 1941"
"Crete was held by about 42,000 British, Australian, New Zealand and Greek troops under the New Zealander Bernard Freyberg, many of them men evacuated from the mainland without their heavy weapons. On 20 May 1941 Germany launched the first invasion in history carried out mainly from the air. Paratroopers and glider troops landed around Maleme, Chania, Rethymno and Heraklion and were killed in their hundreds, but on the first night the New Zealand defenders withdrew from Hill 107 above Maleme airfield, and transport aircraft began to fly in mountain troops.": "La Crète était détenue par environ 42 000 soldats britanniques, australiens, néo-zélandais et grecs sous la direction du Néo-Zélandais Bernard Freyberg, dont beaucoup d’hommes évacués du continent sans leurs armes lourdes. Le 20 mai 1941, l’Allemagne lançait la première invasion de l’histoire menée principalement des airs. Des parachutistes et des soldats de planeurs ont atterri autour de Maleme, Chania, Rethymno et Heraklion et ont été tués dans leurs centaines, mais la première nuit, les défenseurs néo-zélandais se sont retirés de la colline 107 au-dessus de l’aérodrome de Maleme, et des avions de transport ont commencé à voler en troupes de montagne."
"The Royal Navy broke up the German seaborne convoys but lost three cruisers and six destroyers to German aircraft. From 28 May the Allies retreated over the mountains to Sfakia on the south coast, and more than 16,000 men were taken off by sea; some 12,000 Commonwealth and 5,000 Greek soldiers were captured. Cretan civilians had fought the invaders with whatever weapons they had, and the Germans answered with reprisals, shooting men at Kondomari on 2 June and razing the village of Kandanos the next day. German losses were so heavy that Hitler never again ordered a large airborne operation.": "La Royal Navy a rompu les convois allemands mais a perdu trois croiseurs et six destroyers à bord d’avions allemands. A partir du 28 mai, les Alliés se sont repliés sur les montagnes jusqu’à Sfakia, sur la côte sud, et plus de 16 000 hommes ont été enlevés par mer ; quelque 12 000 soldats du Commonwealth et 5 000 soldats grecs ont été capturés. Les civils crétois avaient combattu les envahisseurs avec toutes les armes qu’ils possédaient, et les Allemands ont répondu par des représailles, tirant des hommes à Kondomari le 2 juin et rasant le village de Kandanos le lendemain."
"Operation Mercury": "Opération Mercure"
"German losses": "Pertes allemandes"
"about 6,000 killed, wounded or missing": "environ 6 000 morts, blessés ou disparus"
"Allied soldiers captured": "Des soldats alliés capturés"
"about 17,500": "environ 17 500"
"Maleme": "Malème"
"20–22 May 1941": "20–22 mai 1941"
"The loss of the airfield after the withdrawal from Hill 107 decided the battle, as German reinforcements were flown in under fire.": "La perte de l’aérodrome après le retrait de la colline 107 a décidé la bataille, alors que les renforts allemands ont été lancés sous le feu."
"Chania and Galatas": "Chania et Galatas"
"20–26 May 1941": "20–26 mai 1941"
"New Zealand, British and Greek troops fought for a week west of the town before their line broke.": "La Nouvelle-Zélande, les troupes britanniques et grecques se sont battues pendant une semaine à l’ouest de la ville avant que leur ligne ne casse."
"Rethymno": "Rethymno"
"20–30 May 1941": "20–30 mai 1941"
"Australian and Greek troops held the airfield east of the town until, cut off, they were forced to surrender.": "Les troupes australiennes et grecques tenaient l’aérodrome à l’est de la ville jusqu’à ce qu’elles soient obligées de se rendre."
"Heraklion": "Héraklion"
"20–29 May 1941": "20–29 mai 1941"
"British, Australian and Greek defenders held the town and airfield until warships took the garrison off on the night of 28–29 May.": "Les défenseurs britanniques, australiens et grecs ont tenu la ville et l’aérodrome jusqu’à ce que les navires de guerre prennent le large dans la nuit du 28 au 29 mai."
"Naval battles off Crete": "Batailles navales au large de Crète"
"21–23 May 1941": "21–23 mai 1941"
"German aircraft sank the cruisers Gloucester and Fiji and several destroyers, among them Lord Louis Mountbatten’s Kelly.": "L’avion allemand a coulé les croiseurs Gloucester et Fidji et plusieurs destroyers, parmi lesquels Lord Louis Mountbatten."
"Sfakia": "Sfakia"
"28 May – 1 June 1941": "28 mai – 1er juin 1941"
"Allied troops retreated across the White Mountains to this small port, from which most of the evacuated men left for Egypt. Thousands left behind were captured.": "Les troupes alliées reculèrent à travers les Montagnes Blanches vers ce petit port, d’où la plupart des hommes évacués partirent pour l’Egypte. Des milliers de personnes furent capturées."
"Kandanos": "Kandanos"
"2–3 June 1941": "2–3 juin 1941"
"In reprisal for civilian resistance, German paratroopers shot men of Kondomari, near Maleme, on 2 June and razed Kandanos on 3 June.": "En représailles à la résistance civile, des parachutistes allemands ont abattu des hommes de Kondomari, près de Maleme, le 2 juin, et rasé Kandanos le 3 juin."
"Airborne from Attica": "Airporté depuis Attica"
"Retreat to Sfakia": "Retraite à Sfakia"
"Barbarossa and the Battle of Moscow": "Barbarossa et la bataille de Moscou"
"June – December 1941": "juin – décembre 1941"
"On 22 June 1941 Germany broke its pact with the Soviet Union and invaded it with more than three million German soldiers, soon joined by Romanian, Finnish, Hungarian, Italian and Slovak troops. Stalin had dismissed many warnings, and on the first day the Luftwaffe destroyed much of the Soviet air force on the ground. German armoured groups encircled whole Soviet armies, near Białystok and Minsk in June and July, at Smolensk in July and August, and east of Kyiv in September, where more than 600,000 Soviet soldiers were killed, captured or went missing. Romanian troops retook Bessarabia and besieged Odesa until October.": "Le 22 juin 1941, l’Allemagne rompt son pacte avec l’Union soviétique et l’envahit avec plus de trois millions de soldats allemands, bientôt rejoints par des troupes roumaines, finlandaises, hongroises, italiennes et slovaques. Staline avait rejeté de nombreux avertissements, et le premier jour la Luftwaffe a détruit une grande partie de l’armée de l’air soviétique sur le terrain. Des groupes blindés allemands ont encerclé des armées soviétiques entières, près de Białystok et Minsk en juin et juillet, à Smolensk en juillet et août, et à l’est de Kiev en septembre, où plus de 600 000 soldats soviétiques ont été tués, capturés ou portés disparus."
"Behind the front, SS Einsatzgruppen, German police battalions and local collaborators shot Jewish men, women and children by the hundreds of thousands, 33,771 of them at Babi Yar outside Kyiv on 29–30 September. Soviet prisoners of war were left to starve, and some 3.3 million of them died in German hands during the war. In October the Germans encircled more armies at Vyazma and Bryansk and pushed on towards Moscow, but autumn mud, then frost and stiffening resistance slowed them, and by early December they had stalled at the city’s outskirts. On 5 December the Red Army, reinforced with divisions from Siberia and the Far East, counter-attacked and drove them back.": "Derrière le front, les SS Einsatzgruppen, les bataillons de police allemands et les collaborateurs locaux ont abattu des centaines de milliers d’hommes, de femmes et d’enfants juifs, dont 33 771 à Babi Yar, en dehors de Kiev, les 29 et 30 septembre. En octobre, les Allemands encerclèrent plus d’armées à Vyazma et Bryansk et poussèrent vers Moscou, mais la boue d’automne, puis le gel et la résistance durcissante ralentirent, et au début de décembre ils s’étaient immobilisés à la périphérie de la ville."
"Operation Barbarossa begins": "Début de l’opération Barbarossa"
"22 June 1941": "22 juin 1941"
"Kyiv encirclement": "Encerclement de Kiev"
"September 1941, more than 600,000 Soviet soldiers lost": "Septembre 1941, plus de 600 000 soldats soviétiques perdus"
"Soviet counter-offensive at Moscow": "Contre-offensive soviétique à Moscou"
"from 5 December 1941": "à partir du 5 décembre 1941"
"Brest Fortress": "Forteresse Brest"
"22 June – July 1941": "22 juin – juillet 1941"
"Cut off on the first day, the border fortress held out much longer than the Germans expected, and its last defenders fought on in the ruins for weeks.": "Couper le premier jour, la forteresse frontalière s’est tenue bien plus longtemps que les Allemands, et ses derniers défenseurs se sont battus dans les ruines pendant des semaines."
"Minsk": "Minsk"
"28 June 1941": "28 juin 1941"
"The Belarusian capital fell within a week, as German armour closed a vast pocket around the Soviet armies to the west.": "La capitale bélarussienne est tombée en moins d’une semaine, alors que l’armure allemande fermait une vaste poche autour des armées soviétiques à l’ouest."
"Kyiv": "Kyiv"
"August – September 1941": "août – septembre 1941"
"The largest encirclement in history by number of troops. Kyiv itself fell on 19 September.": "Le plus grand encerclement de l’histoire par le nombre de troupes. Kyiv lui-même est tombé le 19 septembre."
"Babi Yar": "Babi Yar"
"29–30 September 1941": "29–30 septembre 1941"
"SS and police units shot 33,771 Jews in this ravine in two days. Tens of thousands more people were killed here during the occupation.": "Les SS et les unités de police ont abattu 33 771 Juifs dans ce ravin en deux jours. Des dizaines de milliers de personnes ont été tuées ici pendant l’occupation."
"Odesa": "Odesa"
"8 August – 16 October 1941": "8 août – 16 octobre 1941"
"Romanian and German troops besieged the port until the Soviets evacuated it by sea. On 22–24 October Romanian and German forces shot or burned some 25,000–34,000 of the city’s Jews.": "Les troupes roumaines et allemandes ont assiégé le port jusqu’à ce que les Soviétiques l’évacuation par mer. Les 22-24 octobre, les forces roumaines et allemandes ont tiré ou brûlé quelque 25 000 à 34 000 Juifs de la ville."
"Vyazma": "Vyazma"
"October 1941": "octobre 1941"
"Two great encirclements, at Vyazma and Bryansk, trapped hundreds of thousands of Soviet soldiers and opened the road to Moscow.": "Deux grands encerclements, à Vyazma et Bryansk, ont piégé des centaines de milliers de soldats soviétiques et ouvert la route vers Moscou."
"Moscow": "Moscou"
"October 1941 – January 1942": "octobre 1941 – janvier 1942"
"The Germans came within sight of the city. The Soviet counter-offensive from 5 December pushed them back and ended hopes of a quick victory.": "Les Allemands ont vu la ville. La contre-offensive soviétique du 5 décembre les a repoussés et ont mis fin à l’espoir d’une victoire rapide."
"Army Group North": "Groupe de l’Armée du Nord"
"Army Group Centre": "Centre du Groupe de l’armée"
"Army Group South": "Groupe de l’Armée du Sud"
"5 December": "5 décembre"
"Front, 5 December 1941 (approximate)": "Front, 5 décembre 1941 (approximative)"
"Partition, terror and uprising in Yugoslavia": "Partition, terreur et soulèvement en Yougoslavie"
"April 1941 – spring 1942": "Avril 1941 – printemps 1942"
"In the Independent State of Croatia, which included Bosnia and Herzegovina, Ante Pavelić’s Ustaša regime set out to rid the state of its nearly two million Serbs, and of its Jews and Roma. From late April 1941 Ustaša units massacred Serb villagers, as at Glina, many of them in its Orthodox church; others were forced to convert, expelled or sent to camps. At Jasenovac, opened in August 1941, some 77,000–99,000 people were killed by the USHMM’s estimate, about half of them Serbs; far higher and far lower figures are still argued over. In all the regime killed some 320,000–340,000 Serbs, and more than 30,000 of its Jews were murdered in its camps or at Auschwitz.": "Dans l’État indépendant de Croatie, qui comprenait la Bosnie-Herzégovine, le régime d’Ante Pavelićs Ustaša a décidé de débarrasser l’état de ses près de deux millions de Serbes, ainsi que de ses juifs et de ses Roms. À partir de fin avril 1941, les unités d’Ustaša ont massacré des villageois serbes, comme à Glina, dont beaucoup dans son église orthodoxe ; d’autres ont été contraints de convertir, expulsés ou envoyés dans des camps. À Jasenovac, ouvert en août 1941, quelque 77 000 à 99 000 personnes ont été tuées par l’USHMM. Environ la moitié d’entre elles sont des Serbes ; des chiffres beaucoup plus élevés et bien inférieurs sont encore contestés. Dans tout le régime a tué entre 320 000 et 340 000 Serbes, et plus de 30 000 de ses juifs ont été assassinés dans ses camps ou à Auschwitz."
"Resistance grew in the summer. In Serbia Colonel Draža Mihailović’s royalist Chetniks gathered on Ravna Gora, and after Germany invaded the Soviet Union the Communist Party under Josip Broz Tito called for a rising. Serbs in Bosnia and Croatia rose against the Ustaše, and Montenegro rose against the Italians on 13 July. Partisans and Chetniks together freed much of western Serbia, with its centre at Užice. The Germans answered with a rule of 100 hostages shot for every German soldier killed and 50 for every one wounded, and in October they shot about 2,000 people at Kraljevo and some 2,800 at Kragujevac, among them schoolboys.": "La résistance s’est accrue en été. En Serbie, le colonel Draža Mihailović avoue que les Chetniks royalistes se sont rassemblés sur Ravna Gora, et après l’invasion de l’Allemagne par l’Union soviétique, le Parti communiste sous Josip Broz Tito a appelé à une montée. Les Partisans et les Chetniks ensemble ont libéré une grande partie de la Serbie occidentale, avec son centre à Užice. Les Allemands ont répondu par une règle de 100 otages abattus pour chaque soldat allemand et 50 pour chaque blessé, et en octobre ils ont tué environ 2 000 personnes à Kraljevo et quelque 2 800 à Kragujevac, parmi lesquels des écoliers."
"Mihailović feared the cost of reprisals and distrusted the communists, and in November the two movements turned on each other. A German offensive then retook Užice and drove the Partisans into Bosnia and Montenegro. Most of the Jewish men of Serbia had been shot as hostages that autumn; in the spring of 1942 the women and children held at the Sajmište camp in Belgrade were murdered in a gas van. Chetnik units, some of them working with the Italians, massacred Muslims and Croats in eastern Bosnia and the Sandžak, as at Foča, and killed tens of thousands by the end of the war.": "Mihailović craignait le coût des représailles et se méfiait des communistes, et en novembre les deux mouvements se tournaient l’un contre l’autre. Une offensive allemande reprit Užice et conduisit les Partisans en Bosnie-et-Monténégro. La plupart des Juifs de Serbie avaient été abattus en otages cet automne ; au printemps 1942, les femmes et les enfants détenus dans le camp de Sajmište à Belgrade ont été assassinés dans une fourgonnette à gaz. Des unités de Chetnik, certaines travaillant avec les Italiens, ont massacré des musulmans et des Croates dans l’est de la Bosnie et dans le Sandžak, comme à Foča, et tué des dizaines de milliers de personnes à la fin de la guerre."
"Independent State of Croatia proclaimed": "État indépendant de Croatie proclamé"
"Killed at Jasenovac": "Tué à Jasenovac"
"about 77,000–99,000 (USHMM estimate)": "environ 77 000 à 99 000 (estimation de l’USHMM)"
"Kragujevac massacre": "Massacré de Kragujevac"
"21 October 1941, about 2,800 killed": "21 octobre 1941, environ 2 800 morts"
"Jasenovac": "Jasenovac"
"August 1941 – April 1945": "août 1941 – avril 1945"
"The largest Ustaša camp, on the Sava. Serbs, Jews, Roma and Croat and Muslim opponents of the regime were killed here; the memorial site lists 83,145 victims by name.": "Le plus grand camp d’Ustaša, sur la Save. Serbes, Juifs, Roms et Croates et opposants musulmans du régime ont été tués ici ; le site commémoratif énumère 83 145 victimes par leur nom."
"Ravna Gora": "Ravna Gora"
"May 1941": "mai 1941"
"Colonel Draža Mihailović and a group of officers who had refused to surrender set up the royalist Chetnik movement on this upland.": "Le colonel Draža Mihailović et un groupe d’officiers qui avaient refusé de se rendre ont mis en place le mouvement royaliste Chetnik sur cette montagne."
"Užice": "Užice"
"24 September – 29 November 1941": "24 septembre – 29 novembre 1941"
"The Partisans ran the town, with its rifle factory, and the surrounding ‘Užice Republic’ until the German offensive of late November.": "Les Partisans dirigeaient la ville, avec son usine de fusils, et la République d’Užice environnante jusqu’à l’offensive allemande de fin novembre."
"Kraljevo": "Kraljevo"
"15–20 October 1941": "15–20 octobre 1941"
"After a Partisan and Chetnik attack on the German garrison, German troops shot about 2,000 people in reprisal.": "Après une attaque de Partisan et Chetnik contre la garnison allemande, les troupes allemandes ont abattu environ 2 000 personnes en représailles."
"Kragujevac": "Kragujevac"
"21 October 1941": "21 octobre 1941"
"German troops shot 2,778–2,794 men and boys, among them 144 secondary-school pupils, in reprisal for German losses in the area.": "Les troupes allemandes ont abattu 2 778 à 2 794 hommes et garçons, dont 144 élèves du secondaire, en représailles des pertes allemandes dans la région."
"Montenegro uprising": "soulèvement du Monténégro"
"13 July 1941": "13 juillet 1941"
"A day after Italy proclaimed a Montenegrin state, insurgents rose across the country. The Italians retook most of it within weeks, burning villages in reprisal.": "Un jour après que l’Italie ait proclamé un État monténégrin, les insurgés se sont levés à travers le pays. Les Italiens ont repris la plupart d’entre eux en quelques semaines, brûlant des villages en représailles."
"Sajmište": "Sajmište"
"March – May 1942": "mars – mai 1942"
"Jewish women and children from Serbia held in this camp on the old Belgrade fairground were killed in a gas van, several thousand people in all.": "Des femmes et des enfants juifs de Serbie détenus dans ce camp sur le vieux parc d’attractions de Belgrade ont été tués dans une fourgonnette à gaz, plusieurs milliers de personnes en tout."
"Foča": "Foča"
"1941–1942": "1941–1942"
"Chetnik units killed thousands of Muslim civilians in and around the town, in the winter of 1941–1942 and again in August 1942.": "Des unités de Chetnik ont tué des milliers de civils musulmans dans et autour de la ville, pendant l’hiver 1941-1942 et encore en août 1942."
"Held by the Partisans and Chetniks, October 1941 (approximate)": "Tenue par les Partisans et les Chetniks, octobre 1941 (approximative)"
"The siege of Leningrad": "Le siège de Leningrad"
"September 1941 – January 1944": "septembre 1941 – janvier 1944"
"Army Group North swept through the Baltic states in the summer of 1941 and reached the approaches to Leningrad in August, while the Finnish army advanced towards the city from the north. On 8 September German troops took Shlisselburg at the source of the Neva and cut Leningrad off by land. Hitler decided not to storm the city but to starve it and then raze it. The Germans shelled and bombed it almost daily, and with food stocks small, rations were cut again and again. From November 1941 to February 1942 many people received only 125 grams of bread a day, much of it sawdust and other fillers.": "Le groupe de l’Armée Nord a balayé les États baltes à l’été 1941 et a atteint les approches de Leningrad en août, tandis que l’armée finlandaise a avancé vers la ville du nord. Le 8 septembre les troupes allemandes ont pris Shlisselburg à la source de la Neva et coupé Leningrad par terre. Hitler a décidé de ne pas prendre d’assaut la ville mais de la mourir de faim et puis de la raser. De novembre 1941 à février 1942, de nombreuses personnes ne recevaient que 125 grammes de pain par jour, dont une grande partie de sciure et d’autres charges."
"In the hunger winter that followed, deaths peaked at about 100,000 a month in January and February 1942, and people died at home, at work and in the streets. Supplies came only across Lake Ladoga, by boat in summer and from November on the ice road known as the Road of Life. Some 1.4 million people, mainly women and children, were evacuated during the siege. In August 1942 the city’s radio orchestra performed Shostakovich’s Seventh Symphony in the besieged city. The Red Army opened a narrow land corridor along the lake shore in January 1943 and drove the Germans back on 27 January 1944, after 872 days.": "Pendant l’hiver de la faim qui a suivi, les morts ont atteint environ 100 000 morts par mois en janvier et février 1942, et des personnes sont mortes à la maison, au travail et dans les rues. L’approvisionnement n’est venu que sur le lac Ladoga, en bateau en été et à partir de novembre sur la route de glace connue sous le nom de Route de la vie. En août 1942, l’orchestre de radio de la ville a joué Chostakovitchs Septième Symphonie dans la ville assiégée. L’Armée Rouge a ouvert un étroit couloir terrestre le long du rivage du lac en janvier 1943 et a repoussé les Allemands le 27 janvier 1944, après 872 jours."
"Siege of Leningrad": "Siège de Leningrad"
"8 September 1941 – 27 January 1944 (872 days)": "8 septembre 1941 – 27 janvier 1944 (872 jours)"
"Lowest bread ration": "La ration de pain la plus faible"
"125 grams a day, November 1941 – February 1942": "125 grammes par jour, novembre 1941 – février 1942"
"Civilian dead": "Décès civils"
"about 1 million by one count, 640,000 in the city and 400,000 during evacuation": "environ 1 million sur un chiffre, 640 000 dans la ville et 400 000 pendant l’évacuation"
"Leningrad": "Léningrad"
"8 September 1941 – 27 January 1944": "8 septembre 1941 – 27 janvier 1944"
"Besieged by German troops from the south and Finnish troops from the north, the city never fell.": "assiégée par les troupes allemandes du sud et les troupes finlandaises du nord, la ville n’est jamais tombée."
"Shlisselburg": "Shlisselburg"
"8 September 1941": "8 septembre 1941"
"German troops took the fortress town at the source of the Neva, cutting Leningrad’s last land link.": "Les troupes allemandes emmenèrent la ville forteresse à la source de la Neva, coupant le dernier lien terrestre de Leningrad."
"Road of Life": "Le chemin de la vie"
"1941–1943": "1941–1943"
"In winter lorries crossed the frozen lake to the city under German air attack; in summer barges and boats carried supplies.": "En hiver, des camions ont traversé le lac gelé jusqu’à la ville sous l’attaque aérienne allemande ; en été, des barges et des bateaux transportaient des vivres."
"Tikhvin": "Tikhvin"
"9 December 1941": "9 décembre 1941"
"The Red Army retook the railway town, ending the German attempt to close a second ring east of Lake Ladoga and meet the Finns on the Svir.": "L’Armée Rouge reprit la ville de chemin de fer, mettant fin à la tentative allemande de fermer une deuxième bague à l’est du lac Ladoga et de rencontrer les Finlandais sur le Svir."
"Operation Iskra": "Opération Iskra"
"12–18 January 1943": "12–18 janvier 1943"
"Soviet troops attacking from the city and from the east met south of Lake Ladoga, opening a land corridor 8–10 km wide, still under German guns.": "Les troupes soviétiques attaquant de la ville et de l’est se rencontrèrent au sud du lac Ladoga, ouvrant un couloir terrestre de 8 à 10 km de large, toujours sous les armes allemandes."
"Iskra": "C’est vrai."
"January 1944": "janvier 1944"
"German siege lines, autumn 1942 (approximate)": "Lignes de siège allemandes, automne 1942 (approximative)"
"Finnish front, 1941–1944 (approximate)": "Front finlandais, 1941-1944 (approximatif)"
"Greece under occupation": "Grèce sous occupation"
"1941–1944": "1941–1944"
"Greece was divided into three zones. Germany kept Athens, Thessaloniki and Central Macedonia, most of Crete and some islands; Bulgaria annexed eastern Macedonia and Western Thrace and crushed a rising at Drama in September 1941; Italy occupied the rest. With food requisitioned by the occupiers, transport wrecked and a British naval blockade, famine struck in the winter of 1941–42, when hundreds died each day in Athens. Estimates of the deaths from hunger during the occupation run as high as 300,000. Food from Turkey, and after the blockade was eased in 1942 Red Cross wheat carried in Swedish ships, saved many lives.": "La Grèce était divisée en trois zones. L’Allemagne gardait Athènes, Thessalonique et la Macédoine centrale, la plupart de la Crète et quelques îles ; la Bulgarie a annexé la Macédoine orientale et la Thrace occidentale et écrasé une montée à Drama en septembre 1941 ; l’Italie occupait le reste. Selon les estimations, les décès dus à la faim pendant l’occupation atteignent 300 000 personnes. La nourriture en provenance de Turquie et après l’assouplissement du blocus en 1942, le blé de la Croix-Rouge transporté par des navires suédois a sauvé de nombreuses vies."
"Resistance grew from 1942, led by the communist-dominated National Liberation Front (EAM) and its army, ELAS, and by smaller groups such as Napoleon Zervas’s EDES. On the night of 25 November 1942 ELAS and EDES fighters and British saboteurs blew up the Gorgopotamos railway viaduct, on the line that carried supplies bound for Rommel’s army. The occupiers answered with mass reprisals. German troops killed 317 villagers at Kommeno in August 1943, nearly 700 people in and around Kalavryta in December 1943 and 228 at Distomo in June 1944. From 1943 ELAS and EDES also fought each other.": "La résistance s’est développée à partir de 1942, dirigée par le Front national de libération (FLE) dominé par les communistes et son armée, ELAS, et par des groupes plus petits tels que Napoléon Zervas. Dans la nuit du 25 novembre 1942, des combattants ELAS et EDES et des saboteurs britanniques ont fait sauter le viaduc ferroviaire de Gorgopotamos, sur la ligne qui transportait des fournitures à destination de l’armée Rommel. Les troupes allemandes tuèrent 317 villageois à Kommerno en août 1943, près de 700 personnes dans et autour de Kalavryta en décembre 1943 et 228 à Distomo en juin 1944."
"In March 1943 the Germans began deporting the Jews of Thessaloniki, one of the great Sephardic communities of Europe. By August some 45,000–50,000 had been sent to Auschwitz, where almost all were murdered. In the same month Bulgaria deported more than 4,000 Jews from its zone in Thrace and Macedonia to Treblinka. After Italy’s surrender in 1943 the Germans hunted down Jews in the former Italian zone as well, and by the end of the occupation more than 80 per cent of the Jews of Greece had been murdered.": "En mars 1943, les Allemands commencèrent à expulser les Juifs de Thessalonique, l’une des grandes communautés séfarades d’Europe. Au mois d’août, entre 45 000 et 50 000 personnes avaient été envoyées à Auschwitz, où presque tous étaient assassinés. Après la reddition de l’Italie en 1943, les Allemands traquèrent les Juifs dans l’ancienne zone italienne, et à la fin de l’occupation plus de 80 pour cent des juifs de Grèce avaient été assassinés."
"Famine deaths": "Décès liés à la famine"
"up to about 300,000 during the occupation (estimates)": "jusqu’à environ 300 000 pendant l’occupation (estimations)"
"Gorgopotamos viaduct destroyed": "Viaduc Gorgopotamos détruit"
"25–26 November 1942": "25–26 novembre 1942"
"Jews deported from Thessaloniki": "Juifs expulsés de Thessalonique"
"about 45,000–50,000, March–August 1943": "environ 45 000–50 000, mars–août 1943"
"winter 1941–1942": "hiver 1941-1942"
"At the height of the famine German and Red Cross observers counted 300–400 deaths a day in the capital.": "Au plus fort de la famine, les observateurs allemands et de la Croix-Rouge ont compté entre 300 et 400 morts par jour dans la capitale."
"Gorgopotamos": "Gorgopotamos"
"ELAS and EDES fighters and a British team under Eddie Myers destroyed the viaduct on the Athens–Thessaloniki railway, cutting the line for several weeks.": "Des chasseurs ELAS et EDES ainsi qu’une équipe britannique sous Eddie Myers ont détruit le viaduc sur le chemin de fer Athènes-Thessaloniki, coupant la ligne pendant plusieurs semaines."
"15 March – August 1943": "15 mars – août 1943"
"Jews were concentrated in the Baron Hirsch quarter by the railway station and deported from there to Auschwitz.": "Les Juifs étaient concentrés dans le quartier du Baron Hirsch par la gare et déportés de là à Auschwitz."
"Drama": "Drame"
"28–29 September 1941": "28–29 septembre 1941"
"After a rising against Bulgarian rule, Bulgarian troops shot hundreds of men in Drama, Doxato and nearby villages. Bulgarian reports put the dead at up to 1,600; Greek sources give higher figures.": "Après une montée contre la domination bulgare, les troupes bulgares ont abattu des centaines d’hommes dans Drama, Doxato et les villages voisins."
"Kommeno": "Kommeno"
"16 August 1943": "16 août 1943"
"German mountain troops killed 317 inhabitants of the village and burned it.": "Les troupes allemandes de montagne ont tué 317 habitants du village et l’ont brûlé."
"Kalavryta": "Kalavryta"
"13 December 1943": "13 décembre 1943"
"Troops of the 117th Jäger Division shot the men and boys of the town after guerrillas had killed 78 German prisoners. Twenty-eight villages around were destroyed.": "Les troupes de la 117e Division Jäger ont abattu les hommes et les garçons de la ville après que les guérilleros eurent tué 78 prisonniers allemands. Vingt-huit villages ont été détruits."
"Distomo": "Distomo"
"10 June 1944": "10 juin 1944"
"An SS police unit killed 228 men, women and children of the village after an ambush by guerrillas nearby.": "Une unité de police SS a tué 228 hommes, femmes et enfants du village après une embuscade par des guérilleros à proximité."
"German zone, 1941–1943 (approximate)": "Zone allemande, 1941-1943 (approximative)"
"Italian zone, 1941–1943 (approximate)": "Zone italienne, 1941-1943 (approximative)"
"Greek resistance success": "Succès de la résistance grecque"
"The Holocaust and the Warsaw Ghetto Uprising": "L’Holocauste et le soulèvement du ghetto de Varsovie"
"1940–1943": "1940–1943"
"Before the war about 3.3 million Jews lived in Poland, the largest Jewish community in Europe. Under German rule they were forced into ghettos. In Warsaw some 400,000 people were shut into about 3.4 km², and tens of thousands died there of hunger and typhus. After Germany invaded the Soviet Union in June 1941, its mobile killing units shot Jews in hundreds of thousands across the east. In some places local people joined in, as at Jedwabne on 10 July 1941, where Polish inhabitants, working with the Germans, murdered hundreds of their Jewish neighbours.": "Avant la guerre, environ 3,3 millions de Juifs vivaient en Pologne, la plus grande communauté juive d’Europe. Sous la domination allemande, ils étaient forcés à entrer dans des ghettos. À Varsovie, quelque 400 000 personnes furent enfermées sur 3,4 km2, et des dizaines de milliers y moururent de faim et de typhus. Dans certains endroits, les habitants de la région se sont joints, comme à Jedwabne le 10 juillet 1941, où des habitants polonais, travaillant avec les Allemands, ont assassiné des centaines de leurs voisins juifs."
"From December 1941 Germany opened death camps to murder the Jews of Poland and of Europe. Chełmno came first, then Bełżec, Sobibór and Treblinka, and gas chambers were built at Auschwitz-Birkenau and Majdanek. Between 22 July and 21 September 1942 more than 250,000 people from the Warsaw Ghetto were taken to Treblinka and gassed. About 3 million Polish Jews, some 90 per cent, were murdered. Poles who hid Jews risked death with their families; from late 1942 the underground Council to Aid Jews, Żegota, helped thousands, while others betrayed Jews to the Germans.": "De décembre 1941, l’Allemagne ouvrit des camps de la mort pour assassiner les juifs de Pologne et d’Europe. Chełmno vint en premier, puis Bełшec, Sobibór et Treblinka, et des chambres à gaz furent construites à Auschwitz-Birkenau et Majdanek. Entre le 22 juillet et le 21 septembre 1942, plus de 250 000 personnes du ghetto de Varsovie furent emmenées à Treblinka et gazées. Environ 3 millions de Juifs polonais, environ 90 pour cent, ont été assassinés. Les Polonais qui cachaient des Juifs risquaient la mort avec leurs familles ; à partir de la fin 1942, le Conseil clandestin d’aide aux juifs, \"Egota, a aidé des milliers, tandis que d’autres trahissaient les Juifs aux Allemands."
"When German forces entered the Warsaw Ghetto on 19 April 1943 to deport its last inhabitants, the Jewish Combat Organisation under Mordechai Anielewicz and the Jewish Military Union fought back with pistols, a few rifles and home-made bombs. It was the largest Jewish revolt of the war. SS General Jürgen Stroop’s troops burned the ghetto building by building, and on 16 May he blew up the Great Synagogue. Stroop reported 56,065 Jews killed or captured; most of those captured were sent to Treblinka, Majdanek and labour camps.": "Lorsque les forces allemandes sont entrées dans le ghetto de Varsovie le 19 avril 1943 pour déporter ses derniers habitants, l’Organisation juive de combat sous Mordechai Anielewicz et l’Union militaire juive ont combattu avec des pistolets, quelques fusils et des bombes artisanales. C’était la plus grande révolte juive de la guerre. SS général Jürgen Stroop ès troupes ont brûlé le bâtiment du ghetto en construisant, et le 16 mai il a fait exploser la Grande Synagogue. Stroop a signalé que 56 065 Juifs avaient été tués ou capturés ; la plupart d’entre eux ont été envoyés à Treblinka, Majdanek et dans des camps de travail."
"Polish Jews murdered": "Juifs polonais assassinés"
"about 3 million, some 90 per cent": "Environ 3 millions, environ 90 %"
"Deportations from Warsaw": "Déportations de Varsovie"
"22 July – 21 September 1942": "22 juillet – 21 septembre 1942"
"Warsaw Ghetto Uprising": "Inauguration des ghettos de Varsovie"
"19 April – 16 May 1943": "19 avril – 16 mai 1943"
"Warsaw Ghetto": "Ghetto de Varsovie"
"November 1940 – May 1943": "novembre 1940 – mai 1943"
"The largest ghetto in occupied Europe. Its last inhabitants rose against deportation on 19 April 1943.": "Le plus grand ghetto d’Europe occupée. Ses derniers habitants se sont levés contre la déportation le 19 avril 1943."
"Treblinka": "Treblinka"
"July 1942 – 1943": "juillet 1942 – 1943"
"Estimates of the Jews murdered here range from about 700,000 to 925,000, among them most of the Warsaw Ghetto.": "Les estimations des juifs assassinés ici vont d’environ 700 000 à 925 000, dont la plupart du ghetto de Varsovie."
"Chełmno": "Chełmno"
"from December 1941": "à partir de décembre 1941"
"The first German death camp, where Jews from the Łódź Ghetto and the region were gassed in vans. At least 150,000 people were killed.": "Le premier camp de la mort allemand, où les juifs du Łód-Ghetto et de la région ont été gazés dans des fourgonnettes. Au moins 150 000 personnes ont été tuées."
"Auschwitz-Birkenau": "Auschwitz-Birkenau"
"1942–1945": "1942–1945"
"The largest killing centre. About 1.1 million people were murdered here, about a million of them Jews from across Europe.": "Environ 1,1 million de personnes ont été assassinées ici, dont environ un million de Juifs venus de toute l’Europe."
"Bełżec": "Bełżec"
"March – December 1942": "mars – décembre 1942"
"The first camp of Operation Reinhard, with fixed gas chambers. Some 430,000 or more Jews were killed, mostly from southern Poland.": "Le premier camp de l’opération Reinhard, avec des chambres à gaz fixes. Quelque 430 000 juifs ou plus ont été tués, principalement du sud de la Pologne."
"Sobibór": "Sobibór"
"1942–1943": "1942–1943"
"About 170,000–250,000 Jews were killed here. A prisoners’ revolt in October 1943 let about 300 escape.": "Environ 170 000 à 250 000 juifs y ont été tués. Une révolte de prisonniers en octobre 1943 a permis à environ 300 personnes d’échapper."
"Majdanek": "Majdanek"
"A concentration camp on the edge of Lublin with gas chambers, where about 78,000 people died, most of them Jews.": "Un camp de concentration au bord de Lublin avec des chambres à gaz, où environ 78 000 personnes sont mortes, la plupart des Juifs."
"Jedwabne": "Jedwabne"
"10 July 1941": "10 juillet 1941"
"Polish inhabitants, with German police present, killed Jewish neighbours, many burned alive in a barn. Estimates range from about 300 to 1,600 victims.": "Les habitants polonais, avec la police allemande présente, ont tué des voisins juifs, beaucoup ont brûlé vif dans une grange. Selon les estimations, de 300 à 1 600 victimes."
"Deportations, July – September 1942": "Déportations, juillet - septembre 1942"
"Eastern Poland, under German occupation from 1941": "Pologne orientale, sous occupation allemande à partir de 1941"
"Stalingrad": "Stalingrad"
"August 1942 – February 1943": "août 1942 – février 1943"
"In the summer of 1942 Germany struck south-east instead of at Moscow, aiming for the oil of the Caucasus. The offensive began on 28 June, after a Soviet attack near Kharkiv had been crushed in May. German armies, with Romanian, Italian and Hungarian armies guarding their long northern flank on the Don, took Rostov on 23 July and pushed into the Caucasus, where they took the wrecked oilfields at Maykop and raised their flag on Mount Elbrus, but were stopped short of Grozny. Further north the 6th Army reached the Volga at Stalingrad on 23 August, the day a massive air raid reduced much of the city to rubble.": "Au cours de l’été 1942, l’Allemagne frappe le sud-est au lieu de Moscou, visant le pétrole du Caucase. L’offensive commence le 28 juin, après qu’une attaque soviétique près de Kharkiv ait été écrasée en mai. Les armées allemandes, avec des armées roumaines, italiennes et hongroises qui gardaient leur long flanc nord sur le Don, ont pris Rostov le 23 juillet et poussé dans le Caucase, où ils ont pris les champs pétrolifères endommagés à Maykop et ont levé leur drapeau sur le mont Elbrus, mais ont été arrêtés à court de Grozny. Plus au nord, la 6ème armée a atteint la Volga à Stalingrad le 23 août, le jour où un raid aérien massif a réduit une grande partie de la ville en décombres."
"In the ruins Vasily Chuikov’s 62nd Army held a narrow strip along the river, fighting for every factory, street and house, while reinforcements crossed the Volga under fire. By November the Germans held about 90 per cent of the city. On 19 November the Red Army struck the Romanian armies on either side of it in Operation Uranus, and on 23 November its pincers met near Kalach, trapping the 6th Army and other units, some 250,000–330,000 men by different counts. Hitler forbade a breakout, a relief attack failed in December, and the last troops surrendered on 2 February 1943. Of about 91,000 prisoners, only some 6,000 ever returned home.": "Dans les ruines Vasily Chuikov's 62e armée tenait une bande étroite le long de la rivière, se battant pour chaque usine, rue et maison, tandis que les renforts traversaient la Volga sous le feu. En Novembre les Allemands ont tenu environ 90 pour cent de la ville. Le 19 novembre, l’armée rouge frappe les armées roumaines de part et d’autre de l’opération Uranus, et le 23 novembre, ses épingles se rencontrent près de Kalach, piégeant la 6ème armée et d’autres unités, quelque 250 000 à 330 000 hommes par différents chefs. Hitler interdit une cassure, une attaque de secours échoue en décembre, et les dernières troupes se rendent le 2 février 1943."
"Germans reach the Volga": "Les Allemands arrivent à la Volga"
"23 August 1942": "23 août 1942"
"Operation Uranus": "Opération Uranus"
"19–23 November 1942": "19–23 novembre 1942"
"German surrender": "La reddition allemande"
"31 January – 2 February 1943, about 91,000 prisoners": "31 janvier – 2 février 1943, environ 91 000 prisonniers"
"23 August 1942 – 2 February 1943": "23 août 1942 – 2 février 1943"
"The city, now Volgograd, was almost entirely destroyed. The defeat of the 6th Army was the turning point of the war in the east.": "La ville, aujourd'hui Volgograd, fut presque entièrement détruite. La défaite de la 6ème armée fut le point tournant de la guerre à l’est."
"Kalach": "Kalach"
"23 November 1942": "23 novembre 1942"
"The two arms of Operation Uranus met near here on the Don, closing the ring around the 6th Army.": "Les deux bras de l’opération Uranus se sont retrouvés près d’ici sur le Don, fermant la bague autour de la 6ème armée."
"Rostov": "Rostov"
"23 July 1942": "23 juillet 1942"
"Taken for the second time, opening the way across the Don into the Caucasus.": "Prise pour la deuxième fois, ouvrant la voie à travers le Don dans le Caucase."
"Maykop": "Maïkop"
"9 August 1942": "9 août 1942"
"The Germans reached the oilfields, but the Soviets had wrecked them before withdrawing.": "Les Allemands arrivèrent aux champs de pétrole, mais les Soviétiques les avaient détruits avant de se retirer."
"Mount Elbrus": "Mont Elbrus"
"21 August 1942": "21 août 1942"
"German mountain troops planted their flag on the highest peak of the Caucasus.": "Les troupes allemandes de montagne ont planté leur drapeau sur le plus haut sommet du Caucase."
"6th Army": "6ème armée"
"To the Caucasus": "Au Caucase"
"Uranus": "Uranus"
"Front, 18 November 1942 (approximate)": "Front, 18 novembre 1942 (approximatif)"
"El Alamein, Torch and Tunisia": "El Alamein, Torche et Tunisie"
"October 1942 – May 1943": "octobre 1942 – mai 1943"
"By October 1942 General Bernard Montgomery’s Eighth Army at El Alamein had about 195,000 men and more than 1,000 tanks, against some 116,000 German and Italian troops who were short of fuel. Montgomery attacked on the night of 23 October behind a huge artillery barrage. After twelve days of fighting through deep minefields the Axis line broke on 4 November, and Rommel retreated across Libya, giving up Tripoli on 23 January 1943 and falling back into southern Tunisia.": "En octobre 1942, le général Bernard Montgomery La huitième armée d’El Alamein comptait environ 195 000 hommes et plus de 1 000 chars, contre quelque 116 000 soldats allemands et italiens qui manquaient de carburant. Montgomery attaqua dans la nuit du 23 octobre derrière un énorme barrage d’artillerie. Après douze jours de combats dans des champs de mines profonds, la ligne de l’Axe s’est brisée le 4 novembre et Rommel a reculé à travers la Libye, abandonnant Tripoli le 23 janvier 1943 et tombant dans le sud de la Tunisie."
"On 8 November 1942 American and British troops landed in Vichy French Morocco and Algeria, at Casablanca, Oran and Algiers. The French fought back for up to three days before Admiral François Darlan ordered a ceasefire and brought French North Africa over to the Allies. Germany and Italy rushed troops into Tunisia and won the race for Tunis. During the six months of their occupation the Germans forced some 5,000 Tunisian Jewish men into labour camps.": "Le 8 novembre 1942, des troupes américaines et britanniques débarquèrent au Maroc français de Vichy et en Algérie, à Casablanca, Oran et Alger. Les Français se sont battus pendant trois jours avant que l’amiral François Darlan n’ordonne un cessez-le-feu et n’amènent l’Afrique du Nord française aux Alliés. L’Allemagne et l’Italie se précipitèrent en Tunisie et remportèrent la course pour Tunis."
"In February 1943 Rommel defeated inexperienced American troops at the Kasserine Pass, but in March the Eighth Army broke through the Mareth Line, and the Axis armies were caught between two Allied armies. Their bridgehead collapsed in early May. Tunis and Bizerte fell on 7 May, and on 13 May some 250,000 German and Italian soldiers surrendered, more than at Stalingrad.": "En février 1943 Rommel défait les troupes américaines inexpérimentées au col de Kasserine, mais en mars la huitième armée franchit la ligne Mareth, et les armées de l’Axe furent prises entre deux armées alliées. Leur tête de pont s’écroula au début mai. Tunis et Bizerte tombaient le 7 mai, et le 13 mai quelque 250 000 soldats allemands et italiens se rendirent plus qu’à Stalingrad."
"Second Battle of El Alamein": "Deuxième bataille d’El Alamein"
"23 October – 4 November 1942": "23 octobre – 4 novembre 1942"
"Operation Torch landings": "Débarquements de l’opération Torche"
"8 November 1942": "8 novembre 1942"
"Axis surrender in Tunisia": "Axis capitulation en Tunisie"
"13 May 1943, about 250,000 prisoners (estimates differ)": "13 mai 1943, environ 250 000 détenus (estimations différentes)"
"Montgomery’s offensive broke the Axis front after twelve days. Allied casualties were about 13,500, and Axis losses far higher.": "L’offensive de Montgomery a éclaté le front de l’Axe après douze jours. Les pertes alliées ont été d’environ 13 500, et les pertes de l’Axe beaucoup plus élevées."
"Tripoli": "Tripoli"
"23 January 1943": "23 janvier 1943"
"The capital of Italian Libya fell to the Eighth Army three months after El Alamein.": "La capitale de la Libye italienne est tombée à la huitième armée trois mois après El Alamein."
"Casablanca": "Casablanca"
"8–11 November 1942": "8–11 novembre 1942"
"American troops under George Patton landed on the Atlantic coast; French warships and coastal batteries fought back until the ceasefire.": "Les troupes américaines sous George Patton débarquèrent sur la côte atlantique ; les navires de guerre français et les batteries côtières se rebattirent jusqu’au cessez-le-feu."
"Oran": "Oran"
"8–10 November 1942": "8–10 novembre 1942"
"American troops landed on either side of the port, which surrendered after two days of fighting.": "Les troupes américaines débarquèrent de chaque côté du port, qui s’est rendu après deux jours de combats."
"Algiers": "Alger"
"British and American troops landed. Darlan, who happened to be in the city, agreed a ceasefire and later took French North Africa over to the Allies.": "Les troupes britanniques et américaines débarquèrent. Darlan, qui se trouvait dans la ville, accepta un cessez-le-feu et emporta plus tard l’Afrique du Nord française vers les Alliés."
"Kasserine Pass": "Le col de Kasserine"
"19–24 February 1943": "19–24 février 1943"
"Rommel’s last victory. German armour broke through the pass and threw back the Americans before being halted.": "La dernière victoire de Rommel. L’armure allemande a traversé le col et a jeté les Américains avant d’être arrêté."
"Mareth Line": "Ligne Mareth"
"20–27 March 1943": "20–27 mars 1943"
"The Eighth Army outflanked the old French fortifications and forced the Axis back to Wadi Akarit.": "La Huitième Armée a dépassé les anciennes fortifications françaises et a forcé l’Axe à retourner à Wadi Akart."
"Tunis": "Tunis"
"7 May 1943": "7 mai 1943"
"British troops entered Tunis, and American troops Bizerte, the same day. The last Axis forces surrendered on and around Cape Bon on 13 May.": "Les troupes britanniques sont entrées à Tunis et les troupes américaines Bizerte, le même jour. Les dernières forces de l’Axe se sont rendues sur et autour du cap Bon le 13 mai."
"Eighth Army": "Huitième armée"
"First Army": "Première armée"
"Rommel": "Rommel"
"Axis bridgehead in Tunisia, late April 1943 (approximate)": "Tête de pont Axis en Tunisie, fin avril 1943 (approximative)"
"British, American and French moves": "Les mouvements britanniques, américains et français"
"Occupation, collaboration and resistance in the west": "Profession, collaboration et résistance dans l’Ouest"
"1940–1944": "1940–1944"
"In the occupied west Germany ruled through military or civilian administrations and relied on local officials. Pétain met Hitler at Montoire in October 1940, and his regime at Vichy chose collaboration and passed its own anti-Jewish laws. The Netherlands was run by a German Reich Commissioner through Dutch civil servants, Belgium and northern France by a German military governor in Brussels. Luxembourg was annexed in August 1942, and when a general strike broke out against conscription into the German army, 21 strikers were sentenced to death. Between 600,000 and 650,000 French workers were sent to work in Germany.": "Dans l’ouest occupé de l’Allemagne gouvernait par des administrations militaires ou civiles et comptait sur les autorités locales. Pétain rencontre Hitler à Montoire en octobre 1940, et son régime à Vichy choisit la collaboration et adopte ses propres lois anti-juives. Les Pays-Bas sont dirigés par un commissaire du Reich allemand à travers des fonctionnaires néerlandais, la Belgique et le nord de la France par un gouverneur militaire allemand à Bruxelles. Le Luxembourg fut annexé en août 1942 et, lorsqu’une grève générale éclata contre la conscription dans l’armée allemande, 21 grévistes furent condamnés à mort. Entre 600 000 et 650 000 travailleurs français furent envoyés au travail en Allemagne."
"The deportation of the Jews of the west began in 1942. In Paris French police arrested 13,152 Jews in the Vel d’Hiv round-up of 16–17 July, and trains left the camp at Drancy for Auschwitz-Birkenau. Of about 340,000 Jews in France some 72,500 were killed; most survived, many hidden by neighbours. From Westerbork about 97,800 Jews were sent to Auschwitz and Sobibór in occupied Poland, and about three-quarters of the Jews of the Netherlands died, among them Anne Frank. From Mechelen more than 25,000 Jews and Roma were deported; about 1,240 returned.": "La déportation des juifs de l’ouest commença en 1942. A Paris, la police française arrêta 13 152 Juifs dans le round-up du Vel d=Hiv du 16 au 17 juillet, et les trains quittèrent le camp de Drancy pour Auschwitz-Birkenau. Sur environ 340 000 Juifs en France, 72 500 furent tués ; la plupart survécurent, beaucoup cachés par des voisins. De Westerbork environ 97 800 juifs ont été envoyés à Auschwitz et Sobibór en Pologne occupée, et environ les trois quarts des Juifs des Pays-Bas sont morts, dont Anne Frank. De Malines plus de 25 000 juifs et Roms ont été expulsés ; environ 1 240 sont revenus."
"Resistance grew from small beginnings. In February 1941 some 300,000 people in and around Amsterdam struck in protest at the first round-ups of Jews. When the Allies landed in French North Africa, Germany occupied the rest of France on 11 November 1942 and Italy most of the south-east and Corsica, and on 27 November, as German troops entered Toulon, the French navy scuttled 77 ships. Forced labour drove thousands of young men into the maquis, and Jean Moulin united the main resistance movements under de Gaulle before his arrest in June 1943.": "En février 1941, quelque 300 000 personnes à Amsterdam et dans les environs protestèrent lors des premières rafales de Juifs. Lorsque les Alliés débarquèrent en Afrique du Nord française, l’Allemagne occupait le reste de la France le 11 novembre 1942 et l’Italie la plus grande partie du sud-est et de la Corse, et le 27 novembre, alors que les troupes allemandes entraient dans Toulon, la marine française égorgeait 77 navires. Le travail forcé a conduit des milliers de jeunes hommes dans le maquis, et Jean Moulin unit les principaux mouvements de résistance sous de Gaulle avant son arrestation en juin 1943."
"Germany occupies all of France": "L’Allemagne occupe toute la France"
"11 November 1942": "11 novembre 1942"
"Jews deported from France": "Juifs expulsés de France"
"more than 75,000; about 72,500 killed": "plus de 75 000 ; environ 72 500 personnes tuées"
"Jews deported from Westerbork": "Juifs expulsés de Westerbork"
"about 97,800": "environ 97 800"
"Seat of Pétain’s French State. After November 1942 it kept its administration and police but lost what independence it had.": "Siège de l’État français de Pétain. Après novembre 1942, il conserva son administration et sa police mais perdit son indépendance."
"Vel d’Hiv round-up": "Vel d’Hiv arrondi"
"16–17 July 1942": "16–17 juillet 1942"
"French police held 13,152 Jews, more than 4,000 of them children, in the cycle stadium and at Drancy before they were deported to Auschwitz.": "La police française a détenu 13 152 juifs, dont plus de 4 000 enfants, dans le stade cycliste et à Drancy avant d’être expulsés vers Auschwitz."
"Drancy": "Drancy"
"The main transit camp in France, from which most of the deportation trains to Auschwitz-Birkenau left.": "Le principal camp de transit en France, à partir duquel la plupart des trains de déportation vers Auschwitz-Birkenau sont partis."
"Westerbork": "Westerbork"
"1942–1944": "1942–1944"
"About 97,800 Jews were deported from this transit camp, most of them to Auschwitz and Sobibór; few returned.": "Environ 97 800 Juifs ont été expulsés de ce camp de transit, la plupart d’entre eux à Auschwitz et Sobibór ; peu sont revenus."
"Mechelen": "Malines"
"From the Dossin barracks more than 25,000 Jews and Roma were deported to Auschwitz; about 1,240 survived.": "De la caserne de Dossin, plus de 25 000 juifs et Roms ont été déportés à Auschwitz ; environ 1 240 ont survécu."
"Amsterdam": "Amsterdam"
"25–26 February 1941": "25–26 février 1941"
"About 300,000 people joined the February strike against the round-up of Jewish men; the Germans crushed it within two days.": "Environ 300 000 personnes se sont jointes à la grève de février contre le rassemblement des Juifs ; les Allemands l’ont écrasé en deux jours."
"Toulon": "Toulon"
"27 November 1942": "27 novembre 1942"
"The French navy scuttled 77 vessels, among them three battleships, as German troops entered the base.": "La marine française a coupé 77 navires, dont trois navires de combat, alors que les troupes allemandes entraient dans la base."
"Le Chambon-sur-Lignon": "Le Chambon-sur-Lignon"
"People in the village and on the plateau around it sheltered thousands of refugees, many of them Jewish children.": "Les habitants du village et sur le plateau qui l’entourait abritaient des milliers de réfugiés, dont beaucoup d’enfants juifs."
"Occupied by Germany, November 1942": "Occupé par l’Allemagne, novembre 1942"
"Occupied by Italy, November 1942 (approximate)": "Occupé par l’Italie, novembre 1942 (approximative)"
"The Neretva, the Sutjeska and the Italian surrender": "La Neretva, la Sutjeska et la reddition italienne"
"January – November 1943": "janvier – novembre 1943"
"By 1943 the Partisans held large parts of Bosnia and Croatia, and the Axis set out to destroy them. In Operation Weiss, from January to March, German, Italian and Croatian troops, with Chetnik units fighting alongside the Italians, drove Tito’s main force south-east through Bosnia. Rather than abandon some 4,000 sick and wounded, the Partisans crossed the Neretva at Jablanica on a makeshift bridge and scattered the Chetniks waiting on the far bank. In May the Axis struck again with about 127,000 men in Operation Schwarz. Surrounded on the Sutjeska, the Partisans broke out in June, losing some 7,000 killed and wounded, about a third of their force, and Tito himself was wounded.": "En 1943, les Partisans détenaient de grandes parties de la Bosnie et de la Croatie, et l’Axe partait pour les détruire. Dans l’opération Weiss, de janvier à mars, les troupes allemandes, italiennes et croates, avec les unités Chetnik combattant aux côtés des Italiens, conduisirent la principale force de Tito dans le sud-est de la Bosnie. Au lieu d’abandonner quelque 4 000 malades et blessés, les Partisans traversèrent la Neretva à Jablanica sur un pont de fortune et dispersèrent les Chetniks qui attendaient sur l’extrême rive. Entourés de la Sutjeska, les Partisans ont éclaté en juin, perdant quelque 7 000 morts et blessés, environ un tiers de leurs forces, et Tito lui-même a été blessé."
"Italy’s armistice, announced on 8 September 1943, left its armies in the Balkans and Greece without orders. The Germans disarmed most of them and sent many of the men to Germany as forced labourers. On Cephalonia the Acqui Division fought back; after it surrendered on 22 September German troops shot about 5,000 of its men, among them General Antonio Gandin. The Partisans seized Italian weapons and, for a time, much of the Dalmatian coast. Germany took over Albania, Montenegro and the Italian zone of Greece, and in November it took Leros in the Dodecanese from its British and Italian garrison.": "L’armistice italien, annoncé le 8 septembre 1943, a quitté ses armées dans les Balkans et en Grèce sans ordre. Les Allemands ont désarmé la plupart d’entre eux et envoyé beaucoup d’hommes en Allemagne comme travailleurs forcés. Sur Céphalonie la division Acqui a combattu ; après qu’il s’est rendu le 22 Septembre les troupes allemandes ont tiré environ 5000 de ses hommes, parmi lesquels le général Antonio Gandin. Les Partisans ont saisi des armes italiennes et, pendant un certain temps, une grande partie de la côte dalmate. L’Allemagne a repris l’Albanie, le Monténégro et la zone italienne de Grèce, et en novembre elle a pris Leros dans le Dodécanèse de sa garnison britannique et italienne."
"On 29 November, at Jajce in Partisan-held Bosnia, the Anti-Fascist Council for the National Liberation of Yugoslavia (AVNOJ) declared itself the country’s supreme legislative and executive body, set up a provisional government under Tito, now a marshal, and barred King Peter II from returning until the people had decided. At Tehran the same week the Allied leaders agreed to support the Partisans, and Britain ended its support for Mihailović in early 1944, as his Chetniks were by then working with the Germans in many places.": "Le 29 novembre, à Jajce en Bosnie-Herzégovine, tenue par le Parti, le Conseil antifasciste pour la libération nationale de Yougoslavie (AVNOJ) s’est déclaré l’organe législatif et exécutif suprême du pays, a créé un gouvernement provisoire sous Tito, devenu marshal, et interdit au roi Pierre II de revenir jusqu’à ce que le peuple ait décidé. La même semaine, à Téhéran, les dirigeants alliés acceptèrent de soutenir les Partis, et la Grande-Bretagne mit fin à son soutien à Mihailović au début de 1944, ses Chetniks travaillant alors avec les Allemands dans de nombreux endroits."
"Battle of the Sutjeska": "Bataille de Sutjeska"
"15 May – 16 June 1943": "15 mai – 16 juin 1943"
"Italian armistice announced": "Armistice italien annoncé"
"8 September 1943": "8 septembre 1943"
"Second session of AVNOJ": "Deuxième session de l’AVNOJ"
"29–30 November 1943, Jajce": "29-30 novembre 1943, Jajce"
"Jablanica (Neretva)": "Jablanica (Neretva)"
"March 1943": "mars 1943"
"Tito had the bridges destroyed to mislead the enemy. The Partisans then crossed on an improvised bridge with their wounded and scattered the Chetnik forces on the far bank.": "Tito fit détruire les ponts pour induire l’ennemi en erreur. Les Partisans traversèrent ensuite un pont improvisé avec leurs blessés et dispersèrent les forces Chetnik sur la rive lointaine."
"Sutjeska": "Sutjeska"
"Encircled by German, Italian, Croatian and Bulgarian troops, the main Partisan force broke out with heavy losses. The Germans killed the wounded they captured.": "Encerclée par les troupes allemandes, italiennes, croates et bulgares, la principale force du Parti s’est soldée par de lourdes pertes."
"Split": "Séparer"
"September 1943": "septembre 1943"
"The Partisans took over the city and the weapons of its Italian garrison, holding it until the Germans retook it late in the month.": "Les Partisans ont repris la ville et les armes de sa garnison italienne, la tenant jusqu’à ce que les Allemands la reprennent tard dans le mois."
"Jajce": "Jajce"
"29–30 November 1943": "29–30 novembre 1943"
"AVNOJ’s second session laid the foundations of a federal Yugoslavia led by the communists.": "La deuxième session de l’AVNOJ a jeté les bases d’une Yougoslavie fédérale dirigée par les communistes."
"Cephalonia": "Céphalonie"
"21–26 September 1943": "21–26 septembre 1943"
"German troops executed about 5,000 Italian soldiers of the Acqui Division after its surrender. Some 3,000 more drowned when ships taking prisoners to the mainland were sunk.": "Les troupes allemandes ont exécuté environ 5 000 soldats italiens de la division Acqui après sa capitulation. Environ 3 000 autres se sont noyés lorsque des navires transportant des prisonniers sur le continent ont été coulés."
"Leros": "Léros"
"12–16 November 1943": "12–16 novembre 1943"
"German paratroopers and seaborne troops took the island from its British and Italian garrison, ending the Allied campaign in the Dodecanese.": "Des parachutistes allemands et des troupes maritimes ont pris l’île de sa garnison britannique et italienne, mettant fin à la campagne alliée dans le Dodécanèse."
"To the Neretva": "Aux Neretva"
"To Montenegro": "Au Monténégro"
"Breakout, June 1943": "Breakout, juin 1943"
"Taken over by Germany after the Italian armistice, September 1943": "Prise en charge par l’Allemagne après l’armistice italien, septembre 1943"
"Largely held by the Partisans, November 1943 (approximate)": "Largement détenu par les Partisans, Novembre 1943 (approximate)"
"The Battle of the Atlantic": "La bataille de l’Atlantique"
"September 1939 – May 1945": "septembre 1939 – mai 1945"
"Britain depended on imports by sea, and Germany set out to cut them off. A U-boat sank the liner Athenia on the day Britain declared war, killing 117, and in October 1939 U-47 sank the battleship Royal Oak at anchor in Scapa Flow, killing 835. After the fall of France the U-boats operated from new bases on the Biscay coast, at Brest, Lorient, Saint-Nazaire and La Rochelle, hunting the convoys in “wolf packs”. In May 1941 the battleship Bismarck sank HMS Hood, killing all but three of her crew of 1,418, before British ships hunted her down three days later.": "La Grande-Bretagne dépendait des importations par mer, et l’Allemagne partit pour les couper. Un U-boat a coulé le paquebot Athénie le jour où la Grande-Bretagne a déclaré la guerre, tuant 117, et en octobre 1939 U-47 a coulé le navire de combat Royal Oak à l’ancre dans Scapa Flow, tuant 835. Après la chute de France, les U-boats opéraient à partir de nouvelles bases sur la côte de Biscaye, à Brest, Lorient, Saint-Nazaire et La Rochelle, pour chasser les convois dans des packs de loups. En mai 1941 le navire de combat Bismarck a coulé HMS Hood, tuant tous ses équipages sauf trois de 1 418, avant que les navires britanniques ne la chassent trois jours plus tard."
"Merchant ships sailed in escorted convoys, and from September 1941 the United States, still neutral, escorted them in the western Atlantic. Losses peaked in 1942, when U-boats also struck off the American coast and the Arctic convoys to the Soviet Union suffered disasters such as PQ 17, of whose 35 ships only 11 arrived. In spring 1943 more escorts, long-range aircraft closing the mid-Atlantic air gap, radar and the breaking of German naval codes at Bletchley Park turned the battle. In “Black May” 43 U-boats were lost, and on 24 May Admiral Dönitz withdrew them from the North Atlantic.": "Des navires marchands naviguèrent dans des convois escortés, et à partir de septembre 1941, les États-Unis, encore neutres, les escortèrent dans l’Atlantique occidental. Les pertes culminèrent en 1942, lorsque les U-boats éclatèrent également au large des côtes américaines et que les convois arctiques en Union soviétique connurent des catastrophes comme le PQ 17, dont 35 navires seulement 11 arrivaient. Au printemps 1943, d’autres escortes, des avions à longue portée fermant l’espace aérien mi-atlantique, le radar et la rupture des codes navals allemands à Bletchley Park ont tourné la bataille. En mai noir 43 U-boats ont été perdus, et le 24 mai amiral Dönitz les a retirés de l’Atlantique Nord."
"Allied ships lost": "Navires alliés perdus"
"about 3,500 merchant ships and 175 warships": "environ 3 500 navires marchands et 175 navires de guerre"
"U-boats lost": "U-boats perdus"
"about 72,000 Allied sailors and merchant seamen; 28,000–30,000 U-boat crew": "environ 72 000 marins alliés et marins marchands ; 28 000 à 30 000 membres de l’équipage des U-boat"
"Athenia": "Athénie"
"Torpedoed without warning north-west of Ireland on the day Britain declared war; 117 passengers and crew died.": "Torpillé sans avertissement au nord-ouest de l’Irlande le jour où la Grande-Bretagne a déclaré la guerre ; 117 passagers et équipage sont morts."
"Scapa Flow": "Flux Scapa"
"14 October 1939": "14 octobre 1939"
"U-47 slipped into the anchorage and sank the battleship Royal Oak; 835 of her crew of 1,234 died.": "U-47 a glissé dans le mouillage et a coulé le navire de combat Royal Oak ; 835 de son équipage de 1 234 personnes sont mortes."
"Denmark Strait": "Détroit de Danemark"
"24 May 1941": "24 mai 1941"
"The Bismarck sank the battlecruiser Hood; only three of her 1,418 crew survived.": "Le Bismarck a coulé le hood du croiseur de combat ; seulement trois de ses 1 418 membres d’équipage ont survécu."
"Sinking of the Bismarck": "Échec du Bismarck"
"27 May 1941": "27 mai 1941"
"Crippled by a torpedo from a Swordfish aircraft, the battleship was sunk by British warships about 300 nautical miles west of Brest; 115 of her crew were saved.": "Le navire de guerre britannique a coulé à environ 300 milles marins à l’ouest de Brest, et 115 membres de son équipage ont été sauvés."
"Lorient": "Lorient"
"1940–1945": "1940–1945"
"The largest of the U-boat bases on the Biscay coast, its concrete pens survived Allied bombing that destroyed most of the town.": "La plus grande des bases U-boot sur la côte de Biscaye, ses enclos en béton ont survécu aux bombardements alliés qui ont détruit la majeure partie de la ville."
"1941–1945": "1941–1945"
"From February 1941 Western Approaches Command directed the convoy battle from Derby House in Liverpool, Britain’s main Atlantic port.": "À partir de février 1941, le Western Approachs Command dirigea la bataille du convoi depuis Derby House à Liverpool, dans le port principal de l’Atlantique."
"Bletchley Park": "Parc Bletchley"
"Codebreakers read the German naval Enigma for much of the war, helping route convoys away from the wolf packs.": "Les Codebreakers ont lu l’Enigma de la marine allemande pour une bonne partie de la guerre, aidant les convois de route loin des meutes de loup."
"Convoys": "Convoyages"
"U-boats": "Bateaux-U"
"Allied convoys": "Convois alliés"
"U-boat patrols": "Patrouilles en sous-marin"
"Kursk and the road to the Dnieper": "Kursk et la route vers le Dniepr"
"July – December 1943": "juillet – décembre 1943"
"After Stalingrad the Red Army pushed west, and the Germans gave up the Caucasus, but in March 1943 Erich von Manstein’s counter-attack retook Kharkiv and left a large Soviet salient around Kursk. Hitler launched Operation Citadel against it on 5 July, attacking its northern and southern sides with the new Tiger and Panther tanks. Warned in advance, the Soviets had built deep belts of minefields, trenches and anti-tank guns. The northern attack stalled within days. In the south German armour pushed further, and on 12 July Soviet tank armies met the SS panzer corps near Prokhorovka in one of the largest tank battles in history.": "Après Stalingrad, l’armée rouge poussa vers l’ouest, et les Allemands abandonnèrent le Caucase, mais en mars 1943, la contre-attaque d’Erich von Manstein a repris Kharkiv et laissé un grand saillant soviétique autour de Kursk. Hitler lança l’opération Citadel contre elle le 5 juillet, attaquant ses côtés nord et sud avec les nouveaux chars Tiger et Panther. A l’avance, les Soviétiques avaient construit des ceintures profondes de champs de mines, de tranchées et de canons antichars. L’attaque du nord s’est arrêtée en quelques jours. Dans l’armure sud-allemande a poussé plus loin, et le 12 juillet les armées soviétiques ont rencontré le corps SS panzer près de Prokhorovka dans l’une des plus grandes batailles de chars de l’histoire."
"In mid-July Hitler called off the offensive, partly because the Western Allies had landed in Sicily on 10 July. The Red Army had already gone over to the attack north of the salient, and it freed Oryol and Belgorod on 5 August, celebrated with the first artillery salute in Moscow, and Kharkiv on 23 August. From then on it held the initiative. Through the autumn it advanced across eastern Ukraine to the Dnieper, crossed the river and on 6 November took Kyiv. The retreating Germans burned villages and drove civilians west, and the freed lands bore the marks of two years of mass murder, hunger and deportation for forced labour.": "À la mi-juillet Hitler a annulé l’offensive, en partie parce que les Alliés occidentaux avaient atterri en Sicile le 10 juillet. L’Armée rouge avait déjà passé à l’attaque au nord du saillant, et il a libéré Oryol et Belgorod le 5 août, célébré avec le premier salut d’artillerie à Moscou, et Kharkiv le 23 août. À l’automne, il a traversé l’est de l’Ukraine pour rejoindre le Dniepr, a traversé la rivière et le 6 novembre a pris Kiev. Les Allemands en retraite ont brûlé des villages et conduit des civils vers l’ouest, et les terres libérées ont porté les marques de deux années de massacre, faim et déportation pour travail forcé."
