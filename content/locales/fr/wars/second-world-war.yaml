"Occupation and resistance in Denmark and Norway": "Profession et résistance au Danemark et en Norvège"
"Denmark’s government stayed in office under German occupation and cooperated to shield the population, but resistance grew. In August 1943, after strikes and sabotage, it refused German demands for martial law and the death penalty for saboteurs, and on 29 August the Germans dissolved it and took full control; the navy scuttled 32 of its ships. When the Germans prepared to deport Denmark’s Jews, a warning leaked by the German diplomat Georg Duckwitz let Danes hide them and ferry about 7,500 across the Øresund to neutral Sweden. The 464 who were caught were sent to Theresienstadt.": "En août 1943, après des grèves et des sabotages, elle refusa aux Allemands de réclamer la loi martiale et la peine de mort pour les saboteurs, et le 29 août les Allemands dissolvent et prennent le contrôle total ; la marine égorge 32 de ses navires. Lorsque les Allemands se préparèrent à expulser les Juifs du Danemark, un avertissement divulgué par le diplomate allemand Georg Duckwitz laissa les Danois les cacher et transborder environ 7 500 à travers l’Øresund vers la Suède neutre. Les 464 qui furent capturés furent envoyés à Theresienstadt."
"Norway was ruled by the German Reichskommissar Josef Terboven, with Quisling heading a collaborationist government from 1942, while the king and government in London kept Norway’s large merchant fleet in Allied service. The Milorg resistance grew to about 40,000 men, and in February 1943 saboteurs trained in Britain wrecked the heavy-water plant at Vemork. Reprisals were harsh. On 26 November 1942 the ship Donau took 532 Jews from Oslo to Auschwitz; at least 765 Jews from Norway were murdered.": "La Norvège est gouvernée par le Reichskommissar allemand Josef Terboven, avec Quisling à la tête d’un gouvernement de collaboration depuis 1942, tandis que le roi et le gouvernement de Londres gardent la Norvège grande flotte marchande dans le service allié. La résistance Milorg grandit à environ 40 000 hommes, et en février 1943 les saboteurs formés en Grande-Bretagne détruisent l’usine d’eau lourde à Vemork. Le 26 novembre 1942, le navire Donau prit 532 Juifs d’Oslo à Auschwitz ; au moins 765 Juifs de Norvège furent assassinés."
"Danish government dissolved": "Le gouvernement danois dissout"
"29 August 1943": "29 août 1943"
"Danish Jews who reached Sweden": "Juifs danois qui ont atteint la Suède"
