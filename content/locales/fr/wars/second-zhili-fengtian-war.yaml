# French translations of the catalogue text (wave 9); step bodies follow later.
Second Zhili–Fengtian War: Seconde guerre Zhili–Fengtian
? The largest of the warlord wars of the 1920s, fought in the autumn of 1924 between the Zhili clique of Cao Kun and Wu Peifu, which controlled the Beijing government, and Zhang Zuolin’s Fengtian clique from the north-east. A war in the lower Yangtze between the Zhili governor of Jiangsu and the Anhui-aligned governor of Zhejiang, which began on 3 September, gave Zhang the occasion for revenge for his defeat of 1922. About 250,000 Fengtian troops, rearmed with Japanese help, attacked the Zhili positions at the Shanhai Pass and in Rehe; Wu Peifu commanded about 200,000. The fighting at the pass was deadlocked when, on the night of 22–23 October, the Zhili general Feng Yuxiang, sent to the Rehe front, marched back to Beijing, seized the capital and arrested President Cao Kun. With Fengtian troops breaking through to the railway behind them, more than 40,000 Zhili soldiers surrendered between Shanhaiguan and Qinhuangdao, and Wu Peifu escaped by sea from Tanggu on 3 November. Feng and Zhang made Duan Qirui provisional chief executive, Feng expelled the last Qing emperor, Puyi, from the Forbidden City, and the Fengtian clique spread its power to the Yangtze.
: La plus grande des guerres entre seigneurs de la guerre des années 1920, livrée à l’automne 1924 entre la clique du Zhili de Cao Kun et Wu Peifu, qui contrôlait le gouvernement de Pékin, et la clique du Fengtian de Zhang Zuolin, venue du Nord-Est. Une guerre dans le bas Yangzi entre le gouverneur du Jiangsu, membre de la clique du Zhili, et le gouverneur du Zhejiang, allié à la clique de l’Anhui, commencée le 3 septembre, donna à Zhang l’occasion de prendre sa revanche sur sa défaite de 1922. Environ 250 000 soldats du Fengtian, réarmés avec l’aide japonaise, attaquèrent les positions du Zhili à la passe de Shanhai et dans le Rehe ; Wu Peifu en commandait environ 200 000. Les combats à la passe étaient dans l’impasse lorsque, dans la nuit du 22 au 23 octobre, le général du Zhili Feng Yuxiang, envoyé sur le front du Rehe, revint sur Pékin, s’empara de la capitale et arrêta le président Cao Kun. Les troupes du Fengtian perçant jusqu’à la voie ferrée sur leurs arrières, plus de 40 000 soldats du Zhili se rendirent entre Shanhaiguan et Qinhuangdao, et Wu Peifu s’échappa par la mer depuis Tanggu le 3 novembre. Feng et Zhang firent de Duan Qirui le chef de l’exécutif provisoire, Feng expulsa de la Cité interdite le dernier empereur Qing, Puyi, et la clique du Fengtian étendit son pouvoir jusqu’au Yangzi.
