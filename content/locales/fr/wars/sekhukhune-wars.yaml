# French translations of the catalogue text (wave 13); step bodies follow later.
Sekhukhune wars: Guerres de Sekhukhune
? The wars in which the Pedi kingdom of Sekhukhune, in the Leolo mountains of the eastern Transvaal, resisted first the South African Republic and then the British. The Pedi, ruled by the Maroteng dynasty from their capital Tsate, had rebuilt their power after the wars of the 1820s; many of their young men worked at the Kimberley diamond fields and came home with guns. Disputes over land, labour and tax led President Thomas Burgers to declare war in May 1876. The Republic’s commandos and their Swazi allies failed to take Tsate in August, and a war of forts and raids ended in an uneasy peace in February 1877. The Republic’s failure helped Britain justify its annexation of the Transvaal in April 1877, and the British in turn demanded Sekhukhune’s submission; their campaigns of 1878 also failed. After the Anglo-Zulu War, Sir Garnet Wolseley attacked with about 2,000 British and colonial troops and some 8,000 to 10,000 Swazi, and on 28 November 1879 Tsate was stormed with heavy loss of life. Sekhukhune was captured on 2 December and imprisoned in Pretoria; released after the Transvaal regained its independence in 1881, he was murdered by his rival Mampuru in 1882.
: Les guerres au cours desquelles le royaume pedi de Sekhukhune, dans les monts Leolo de l’est du Transvaal, résista d’abord à la République sud-africaine, puis aux Britanniques. Les Pedi, gouvernés par la dynastie maroteng depuis leur capitale de Tsate, avaient reconstitué leur puissance après les guerres des années 1820 ; beaucoup de leurs jeunes hommes travaillaient sur les gisements diamantifères de Kimberley et en revenaient avec des fusils. Des différends portant sur la terre, la main-d’œuvre et l’impôt conduisirent le président Thomas Burgers à déclarer la guerre en mai 1876. Les commandos de la République et leurs alliés swazis ne parvinrent pas à prendre Tsate en août, et une guerre de forts et de raids s’acheva sur une paix précaire en février 1877. L’échec de la République aida la Grande-Bretagne à justifier son annexion du Transvaal en avril 1877, et les Britanniques exigèrent à leur tour la soumission de Sekhukhune ; leurs campagnes de 1878 échouèrent elles aussi. Après la guerre anglo-zouloue, sir Garnet Wolseley attaqua avec environ 2 000 soldats britanniques et coloniaux et quelque 8 000 à 10 000 Swazis et, le 28 novembre 1879, Tsate fut prise d’assaut au prix de lourdes pertes en vies humaines. Sekhukhune fut capturé le 2 décembre et emprisonné à Pretoria ; libéré après que le Transvaal eut recouvré son indépendance en 1881, il fut assassiné par son rival Mampuru en 1882.
