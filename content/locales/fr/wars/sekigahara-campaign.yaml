# French translations of the catalogue text (wave 10); step bodies follow later.
Sekigahara campaign: Campagne de Sekigahara
? The war of 1600 in which Tokugawa Ieyasu defeated a coalition of daimyo loyal to the Toyotomi house and made himself master of Japan. When Toyotomi Hideyoshi died in 1598, leaving a five-year-old heir, Hideyori, power passed to a council of five regents, of whom Ieyasu was by far the strongest, and five commissioners led by Ishida Mitsunari. In the summer of 1600 Ieyasu led an army north-east against Uesugi Kagekatsu of Aizu, whom he accused of preparing war. In his absence Ishida raised the western daimyo in Hideyori’s name, with Mōri Terumoto as nominal commander-in-chief in Osaka Castle, and took Fushimi Castle and other strongholds of Ieyasu’s allies around Kyoto. Ieyasu turned back. His allies took Gifu Castle in late September, and on 21 October 1600 the Eastern and Western armies, each of perhaps 80,000 to 90,000 men, met at Sekigahara in Mino, where the defection of Kobayakawa Hideaki decided a battle of a few hours. Ishida, Konishi Yukinaga and Ankokuji Ekei were executed in Kyoto. In the north the Uesugi failed to take Hasedō from the Mogami and withdrew, and in Kyushu Kuroda Josui and Katō Kiyomasa overran the lands of western daimyo. Ieyasu confiscated or reduced the domains of some 90 daimyo, kept Hideyori as a mere great lord in Osaka, and in 1603 was appointed shogun, founding the Tokugawa shogunate that ruled Japan until 1867.
: La guerre de 1600 par laquelle Tokugawa Ieyasu vainquit une coalition de daimyos fidèles à la maison Toyotomi et se rendit maître du Japon. À la mort de Toyotomi Hideyoshi en 1598, qui laissait un héritier de cinq ans, Hideyori, le pouvoir passa à un conseil de cinq régents, dont Ieyasu était de loin le plus puissant, et à cinq commissaires menés par Ishida Mitsunari. À l’été 1600, Ieyasu conduisit une armée vers le nord-est contre Uesugi Kagekatsu d’Aizu, qu’il accusait de préparer la guerre. En son absence, Ishida souleva les daimyos de l’Ouest au nom de Hideyori, avec Mōri Terumoto comme commandant en chef nominal au château d’Osaka, et prit le château de Fushimi et d’autres places fortes des alliés d’Ieyasu autour de Kyoto. Ieyasu fit demi-tour. Ses alliés prirent le château de Gifu fin septembre et, le 21 octobre 1600, les armées de l’Est et de l’Ouest, fortes chacune de peut-être 80 000 à 90 000 hommes, s’affrontèrent à Sekigahara, dans le Mino, où la défection de Kobayakawa Hideaki décida d’une bataille de quelques heures. Ishida, Konishi Yukinaga et Ankokuji Ekei furent exécutés à Kyoto. Dans le nord, les Uesugi ne parvinrent pas à prendre Hasedō aux Mogami et se retirèrent et, au Kyushu, Kuroda Josui et Katō Kiyomasa envahirent les terres des daimyos de l’Ouest. Ieyasu confisqua ou réduisit les domaines de quelque 90 daimyos, ne laissa à Hideyori que le rang de simple grand seigneur à Osaka et fut nommé shogun en 1603, fondant le shogunat Tokugawa qui gouverna le Japon jusqu’en 1867.
