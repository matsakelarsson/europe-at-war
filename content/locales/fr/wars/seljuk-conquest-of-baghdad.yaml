# French translations of the catalogue text (wave 7); step bodies follow later.
Seljuk conquest of Iran and Baghdad: Conquête seldjoukide de l’Iran et de Bagdad
The fifteen years after the battle of Dandanaqan in which the Seljuk Turkmen under Tughril Beg conquered the Iranian plateau from the Kakuyids, the Buyids and other local dynasties. Tughril took Gorgan, Rayy and Khwarazm in 1041–1043, made Rayy his capital, besieged and took Isfahan in 1050–1051, and in 1054 brought the princes of Azerbaijan under his rule. Invited by the caliph al-Qa’im, he entered Baghdad on 18 December 1055 and imprisoned the last Buyid ruler of Iraq, becoming the protector of the Abbasid caliphate.: Les quinze années qui suivirent la bataille de Dandanaqan, au cours desquelles les Turkmènes seldjoukides de Toghrul Beg conquirent le plateau iranien sur les Kakouyides, les Bouyides et d’autres dynasties locales. Toghrul prit Gorgan, Rayy et le Khwarezm en 1041–1043, fit de Rayy sa capitale, assiégea et prit Ispahan en 1050–1051 et soumit en 1054 les princes d’Azerbaïdjan. Invité par le calife al-Qa’im, il entra à Bagdad le 18 décembre 1055 et emprisonna le dernier souverain bouyide d’Irak, devenant le protecteur du califat abbasside.
