"1386–1389": "1386–1389"
"Leopold’s brother Albert III carried on the war on behalf of Leopold’s young sons. The Confederates took Weesen on the Walensee in August 1386, and in March 1387 the people of Glarus declared themselves free of Habsburg rule. Bern, which had stayed out of the fighting at Sempach, seized Habsburg towns and castles around it. On the night of 21–22 February 1388, remembered as the Murder Night of Weesen, Habsburg troops took Weesen back by surprise.": "Les Confédérés ont pris Weesen sur le Walensee en août 1386, et en mars 1387 le peuple de Glarus se déclara libre du règne des Habsbourg. Bern, qui était resté hors des combats à Sempach, s’est emparé des villes et châteaux de Habsbourg autour. Dans la nuit du 21 au 22 février 1388, rappelée comme la nuit des meurtres de Weesen, les troupes de Habsbourg ont repris Weesen par surprise."
"In early April two Habsburg columns set out to subdue Glarus. On 9 April 1388 the main army, perhaps 5,000 strong, stormed the earthwork wall at Näfels, held by about 400 men of Glarus and a few from Schwyz and Uri. As the attackers scattered to plunder, the defenders fell on them from the hillside. The Habsburg troops fled towards Weesen, a bridge collapsed under them, and many drowned; Glarus lost 54 men. On 1 April 1389 Albert agreed to a seven-year peace, extended in 1394 for twenty years, which left the Confederates what they had won.": "Au début d’avril, deux colonnes de Habsbourg se sont mises à soumettre Glarus. Le 9 avril 1388, l’armée principale, peut-être 5 000 hommes, a envahi le mur de terre de Näfels, tenu par environ 400 hommes de Glarus et quelques-uns de Schwyz et Uri. Comme les assaillants dispersés au pillage, les défenseurs sont tombés sur eux du côté de la colline. Les troupes des Habsbourg s’enfuirent vers Weesen, un pont s’écroula sous eux, et beaucoup se noyèrent ; Glarus perdit 54 hommes. Le 1er avril 1389 Albert accepta une paix de sept ans, prolongée en 1394 pendant vingt ans, qui laissa aux Confédérés ce qu’ils avaient gagné."
