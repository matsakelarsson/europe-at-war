"1385–1386": "1385–1386"
"Lucerne had joined the Confederacy in 1332 but was still ringed by Habsburg lands, and in the 1380s it set out to build a territory of its own. In 1385 its men and those of Zurich and Zug attacked Habsburg strongholds such as Rothenburg and Wolhusen. Lucerne had already taken the people of the Entlebuch into its citizenship, and in January 1386 it did the same for the town of Sempach. Duke Leopold III of Austria gathered knights from the Aargau, Alsace, Swabia and Tyrol, with mercenaries, at Brugg. Instead of attacking Zurich, as the Confederates expected, he marched south, burning Willisau and the harvest on his way.": "Lucerne avait rejoint la Confédération en 1332 mais était encore sonné par les terres de Habsbourg, et dans les années 1380 il a entrepris de construire un territoire propre. En 1385 ses hommes et ceux de Zurich et Zug ont attaqué les bastions de Habsburg tels que Rothenburg et Wolhusen. Lucerne avait déjà pris les habitants de l’Entlebuch dans sa citoyenneté, et en janvier 1386 il a fait de même pour la ville de Sempach. Duc Léopold III d’Autriche a rassemblé des chevaliers de l’Argovie, Alsace, Souabe et Tyrol, avec des mercenaires, à Brugg. Au lieu d’attaquer Zurich, comme les confédérés s’y attendaient, il marchait vers le sud, brûlant Willisau et la récolte sur son chemin."
"On 9 July 1386 the men of Lucerne, Uri, Schwyz and Unterwalden, hurrying back from Zurich, met Leopold’s army near Sempach, by the village of Hildisrieden. On ground unsuited to horses the knights fought on foot. After hard fighting the Confederates broke their line, and Leopold and a great many nobles were killed. Swiss tradition later credited the breakthrough to Arnold von Winkelried, who gathered the enemy’s spears into his own body. The defeat broke Habsburg power west of the Rhine, and Lucerne, Bern and Solothurn took over many of its towns and lands.": "Le 9 juillet 1386, les hommes de Lucerne, Uri, Schwyz et Unterwalden, se dépêchant de Zurich, rencontrèrent l’armée de Léopold près de Sempach, dans le village d’Hildisrieden. Au sol, les chevaliers combattirent à pied. La tradition suisse a ensuite attribué la percée à Arnold von Winkelried, qui a rassemblé les lances ennemies dans son propre corps. La défaite a brisé Habsbourg puissance à l’ouest du Rhin, et Lucerne, Berne et Soleure ont pris en charge beaucoup de ses villes et terres."
