# Some French text was translated automatically.
"Sempach War": "Guerre de Sempach"
"A war between the Swiss Confederates and the Habsburg dukes of Austria, set off by Lucerne’s expansion into Habsburg lands. Duke Leopold III was killed with many of his nobles at Sempach in 1386, Glarus won its freedom at Näfels in 1388, and the peace of 1389 left the Confederates their gains.": "Une guerre entre les Confédérés suisses et les ducs des Habsbourg d’Autriche, lancée par l’expansion de Lucerne. Duc Léopold III a été tué avec beaucoup de ses nobles à Sempach en 1386, Glarus a gagné sa liberté à Näfels en 1388, et la paix de 1389 a laissé les Confédérés leurs gains."
"Dates are Julian, as usual for the period. Few accounts of the battles were written before about 1470, and many details, including the story of Arnold von Winkelried, come from Swiss chronicles of around 1500.": "Les dates sont Julian, comme d’habitude pour la période. Peu de récits des batailles ont été écrits avant environ 1470, et beaucoup de détails, y compris l’histoire d’Arnold von Winkelried, viennent de chroniques suisses d’environ 1500."
"The Confederacy then had eight members, Uri, Schwyz, Unterwalden, Lucerne, Zurich, Glarus, Zug and Bern. Bern took no part at Sempach but used the war to take Habsburg lands around it.": "La Confédération comptait alors huit membres, Uri, Schwyz, Unterwalden, Lucerne, Zurich, Glarus, Zug et Bern. Bern n’a pas pris part à Sempach mais a utilisé la guerre pour prendre les terres de Habsbourg autour de lui."
