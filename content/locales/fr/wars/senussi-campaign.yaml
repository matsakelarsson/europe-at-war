# French translations of the catalogue text (wave 12); step bodies follow later.
Senussi campaign: Campagne senoussie
The war of the Senussi, the Sufi order that led the resistance to Italy in Cyrenaica, against Italy and Britain during the First World War. Libyan fighters drove the Italians out of the Fezzan in 1914 and defeated a large Italian column at Gasr Bu Hadi near Sirte in April 1915, after which Italy held little more than a few coastal towns. Urged on by Ottoman officers and supplied by German submarines, the head of the order, Sayyid Ahmed al-Sharif, declared jihad and in November 1915 attacked Egypt, then a British protectorate. A British Empire force drove the Senussi back from the coast in battles from December 1915 to February 1916 and retook Sollum in March. Sayyid Ahmed’s occupation of the oases of the Western Desert was undone in 1916, and after a British raid on Siwa in February 1917 he handed the leadership to his cousin Muhammad Idris, who made peace with Britain and Italy at Akrama in April 1917. Idris became king of independent Libya in 1951.: La guerre menée pendant la Première Guerre mondiale contre l’Italie et la Grande-Bretagne par les Senoussis, la confrérie soufie qui dirigeait la résistance à l’Italie en Cyrénaïque. Des combattants libyens chassèrent les Italiens du Fezzan en 1914 et battirent une importante colonne italienne à Gasr Bu Hadi, près de Syrte, en avril 1915, après quoi l’Italie ne tint plus guère que quelques villes côtières. Poussé par des officiers ottomans et ravitaillé par des sous-marins allemands, le chef de la confrérie, Sayyid Ahmed al-Sharif, proclama le djihad et, en novembre 1915, attaqua l’Égypte, alors protectorat britannique. Une force de l’Empire britannique repoussa les Senoussis loin de la côte lors de combats livrés de décembre 1915 à février 1916 et reprit Salloum en mars. L’occupation des oasis du désert occidental par Sayyid Ahmed prit fin en 1916 et, après un raid britannique sur Siwa en février 1917, il céda la direction de la confrérie à son cousin Muhammad Idris, qui fit la paix avec la Grande-Bretagne et l’Italie à Akrama en avril 1917. Idris devint roi de la Libye indépendante en 1951.
