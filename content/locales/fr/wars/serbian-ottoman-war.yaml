"June 1876 – March 1877": "juin 1876 – mars 1877"
"Serbia and Montenegro, which had armed and aided the rebels in Herzegovina and Bosnia, declared war on the Ottoman Empire on 30 June 1876, a month after Sultan Abdülaziz was deposed. Prince Milan’s main army, about 45,000 men with its volunteers, gathered at Aleksinac under the Russian general Mikhail Chernyayev, conqueror of Tashkent. It advanced down the Nišava valley towards Sofia, while smaller forces crossed the Drina towards Bijeljina and the Timok towards Vidin. The Serbian militia, poorly trained and armed with a mixture of old rifles, was driven back on every front within weeks.": "La Serbie-et-Monténégro, qui avait armé et aidé les rebelles en Herzégovine et en Bosnie, a déclaré la guerre à l’Empire ottoman le 30 juin 1876, un mois après que le Sultan Abdülaziz a été déposé. Elle descend la vallée de Nišava en direction de Sofia, tandis que des forces plus petites traversent la Drina vers Bijeljina et le Timok vers Vidin. La milice serbe, mal entraînée et armée d’un mélange de vieux fusils, est repoussée sur tous les fronts en quelques semaines."
"From Vidin, Osman Pasha took Zaječar and Knjaževac in the Timok valley, where villages were burned and civilians killed. The main Ottoman army under Abdülkerim Pasha advanced from Niš up the Morava. A Serbian redoubt at Šumatovac near Aleksinac held on 23 August, but the Ottomans pushed along the river’s west bank; among the thousands of Russian volunteers, Colonel Nikolai Raevsky was killed at Adrovac. On 29 October they broke the line at Đunis, opening the road north. Russia gave the Porte a 48-hour ultimatum, an armistice followed on 1 November, and the peace of early 1877 restored the pre-war border.": "De Vidin, Osman Pasha a emmené Zaječar et Knjaževac dans la vallée de Timok, où des villages ont été brûlés et des civils tués. Le 23 août, les Ottomans ont poussé le long de la rive ouest de la rivière ; parmi les milliers de volontaires russes, le colonel Nikolai Raevsky a été tué à Adrovac. Le 29 octobre, ils ont brisé la ligne à Uunis, ouvrant la route au nord. La Russie donna à la Porte un ultimatum de 48 heures, un armistice suivi le 1er novembre, et la paix du début de 1877 rétablit la frontière d’avant-guerre."
