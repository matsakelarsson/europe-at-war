"December 1877 – July 1878": "décembre 1877 – juillet 1878"
"Serbia stayed out of the Russo-Turkish War until the Russians had nearly taken Plevna. With Russian money it rebuilt its army in five corps, nearly 90,000 men, and on 13 December 1877, three days after Plevna fell, it declared war again. Under Prince Milan, with General Kosta Protić in effective command, the main force struck south and surrounded Niš within days, while a column took Kuršumlija to cut the road from Kosovo, and Pirot fell on 28 December. Niš surrendered on 11 January 1878. A planned advance into the Sanjak of Novi Pazar was called off under Austro-Hungarian pressure.": "La Serbie est restée hors de la guerre russo-turque jusqu’à ce que les Russes aient failli prendre Plevna. Avec l’argent russe, elle a reconstruit son armée dans cinq corps, près de 90 000 hommes, et le 13 décembre 1877, trois jours après la chute de Plevna, elle a déclaré la guerre à nouveau. Sous le commandement effectif du général Kosta Protić, la principale force frappe le sud et encercle Niš en quelques jours, tandis qu’une colonne prend Kuršumlija pour couper la route du Kosovo, et Pirot tombe le 28 décembre. Niš se rend le 11 janvier 1878. Une avance prévue dans le Sanjak de Novi Pazar est déclenchée sous la pression austro-hongroise."
"Serbian troops took Vranje on 31 January and pushed on towards Preševo and Vitina in Kosovo and into the Bulgarian lands around Trn and Kyustendil before an armistice in early February. The Treaty of San Stefano gave Serbia Niš but assigned Pirot and Vranje to a large Bulgaria; at the Congress of Berlin Serbia won full independence and kept Niš, Pirot, Toplica and Vranje. Tens of thousands of Albanians and other Muslims fled or were driven out of these districts, between 49,000 and 130,000 by different estimates, many to Kosovo, where Serbs then suffered reprisals.": "Les troupes serbes ont pris Vranje le 31 janvier et ont poussé vers Preševo et Vitina au Kosovo et dans les terres bulgares autour de Trn et Kyustendil avant une armistice début février. Le traité de San Stefano a donné la Serbie Niš mais a assigné Pirot et Vranje à une grande Bulgarie ; au Congrès de Berlin, la Serbie a remporté la pleine indépendance et a gardé Niš, Pirot, Toplica et Vranje. Des dizaines de milliers d’Albanais et d’autres musulmans ont fui ou ont été chassés de ces districts, entre 49 000 et 130 000 par des estimations différentes, beaucoup au Kosovo, où les Serbes ont ensuite subi des représailles."
