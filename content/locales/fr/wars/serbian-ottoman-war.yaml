# Some French text was translated automatically.
"Serbian–Ottoman Wars of 1876–1878": "Guerres de 1876–1878 entre les Serbes et les Ottomans"
"Two wars between the Principality of Serbia and the Ottoman Empire during the Great Eastern Crisis. In 1876 Serbia, with Montenegro, went to war in support of the rising in Bosnia and Herzegovina and was beaten at Đunis, saved only by a Russian ultimatum; in December 1877, as Russia was winning its own war, Serbia attacked again and took Niš, Pirot and Vranje, which it kept, with full independence, at the Congress of Berlin.": "Deux guerres entre la Principauté de Serbie et l’Empire ottoman pendant la Grande Crise Orientale. En 1876, la Serbie, avec le Monténégro, partit en guerre pour soutenir l’ascension de la Bosnie-Herzégovine et fut battue à Uunis, sauvée seulement par un ultimatum russe ; en décembre 1877, alors que la Russie gagnait sa propre guerre, la Serbie attaqua de nouveau et prit Niš, Pirot et Vranje, qu’elle conserva, en toute indépendance, au Congrès de Berlin."
"Dates are New Style (Gregorian). Serbia used the Julian calendar, then 12 days behind, so Serbian accounts date the declaration of war 18 June 1876 and the capture of Niš 29–30 December 1877. Some dates of the 1876 campaign appear in either style in the literature.": "Les dates sont New Style (Gregorian). La Serbie a utilisé le calendrier julien, puis 12 jours derrière, de sorte que les comptes serbes datent la déclaration de guerre 18 juin 1876 et la capture de Niš 29-30 décembre 1877. Certaines dates de la campagne de 1876 apparaissent dans l’un ou l’autre style dans la littérature."
"The Russo-Turkish War of 1877–1878, the Montenegrin–Ottoman War of 1876–1878 and the Herzegovina Uprising have their own entries.": "La guerre russo-turque de 1877–1878, la guerre monténégrine–ottomane de 1876–1878 et l’insurrection en Herzégovine ont leurs propres entrées."
