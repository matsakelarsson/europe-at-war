"Serbian Revolution": "Révolution serbe"
"Two risings of the Serbs of the Pashalik of Belgrade against Ottoman rule. The First Serbian Uprising under Karađorđe (1804–1813) began against renegade janissaries, won battles at Ivankovac, Mišar and Deligrad and built a de facto independent state, but collapsed when Russia made peace in 1812; the Second Uprising under Miloš Obrenović (1815) won self-government, recognised by the sultan’s decrees of 1830 and 1833 as an autonomous Principality of Serbia.": "Deux montées des Serbes du Pashalik de Belgrade contre la domination ottomane. La première insurrection serbe sous la direction de Karasorėe (1804-1813) a commencé contre les janissaires renégats, a remporté des batailles à Ivankovac, Mišar et Deligrad et a construit un État indépendant de facto, mais s’est effondrée lorsque la Russie a fait la paix en 1812 ; la deuxième insurrection sous Miloš Obrenović (1815) a gagné l’autonomie gouvernementale, reconnu par les décrets sultan de 1830 et 1833 comme une Principauté autonome de Serbie."
"Dates are New Style (Gregorian). The Serbs used the Julian calendar, then 12 days behind, so Serbian accounts date the Orašac assembly 2 February 1804 and the Takovo rising 11 April 1815. Some battle dates are given in either style in the literature; uncertain ones are given here only by month.": "Les Serbes ont utilisé le calendrier julien, puis 12 jours de retard, donc les comptes serbes datent l’assemblée d’Orašac 2 février 1804 et le Takovo se lève 11 avril 1815. Certaines dates de bataille sont données dans l’un ou l’autre style dans la littérature ; celles incertaines ne sont données ici que par mois."
"The Russo-Turkish War of 1806–1812, in which Russian troops fought beside the rebels, has its own entry. Numbers of fighters, dead and refugees come from contemporary and national accounts and are often uncertain.": "La guerre russo-turque de 1806-1812, dans laquelle les troupes russes combattaient aux côtés des rebelles, a sa propre entrée. Le nombre de combattants, de morts et de réfugiés provient de comptes contemporains et nationaux et sont souvent incertains."
"The term “Serbian Revolution” was coined by the German historian Leopold von Ranke in 1829. Here it covers the two risings and the road to recognised autonomy in 1830–1833.": "Le terme Révolution serbe a été inventé par l’historien allemand Léopold von Ranke en 1829. Ici, il couvre les deux montées et le chemin vers une autonomie reconnue en 1830–1833."
