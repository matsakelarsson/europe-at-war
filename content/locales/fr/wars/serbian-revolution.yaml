"In December 1801 four janissary commanders, the Dahije, murdered Hadži Mustafa Pasha, the sultan’s governor of Belgrade, and divided the pashalik between them in defiance of Selim III. Their rule brought heavy taxes, forced labour and violence. Fearing that the sultan would use the Serbs against them, in January and February 1804 they killed between 70 and 150 village headmen (knezes), priests and traders, the “Slaughter of the Knezes”. On 14 February the survivors met at Orašac in Šumadija and chose Đorđe Petrović, a livestock trader and former Habsburg Free Corps soldier known as Karađorđe (“Black George”), to lead a rising.": "En décembre 1801, quatre commandants janissaires, les Dahije, assassinèrent Hadži Mustafa Pasha, gouverneur sultan de Belgrade, et divisèrent le pachalik entre eux au mépris de Selim III. Leur règne apporta de lourdes taxes, du travail forcé et de la violence. Craignant que le sultan n’utilise les Serbes contre eux, en janvier et février 1804 ils tuèrent entre 70 et 150 chefs de village (knezes), prêtres et commerçants, l’abattage des Knezes. Le 14 février, les survivants se sont réunis à Orašac à Šumadija et ont choisi -."
"Claiming at first to fight for the sultan against the renegades, the rebels took Šumadija, Požarevac and Šabac within months, leaving the Dahije only Belgrade. The four fled down the Danube to the island of Ada Kaleh, where Milenko Stojković’s men caught and beheaded them in August. But the Serbs, meeting at Ostružnica, would not disarm without guarantees and sought Russian and Austrian protection. In 1805 Selim ordered Hafiz Pasha of Niš to crush them. On 18 August Stojković and Karađorđe beat his army at Ivankovac, the first Serbian victory over regular Ottoman troops, and in November the rebels took Smederevo, their first capital.": "Réclamés au début à se battre pour le sultan contre les renégats, les rebelles ont pris Šumadija, Požarevac et Šabac en quelques mois, laissant le Dahije seulement Belgrade. Les quatre ont fui le Danube vers l’île d’Ada Kaleh, où des hommes de Miliko Stojković sont pris et décapités en août. Mais les Serbes, réunis à Ostružnica, ne désarmèrent pas sans garanties et cherchèrent la protection russe et autrichienne.En 1805, Selim ordonna à Hafiz Pacha de Niš de les écraser. Le 18 août Stojković et Karaшorțe battaient son armée à Ivankovac, première victoire serbe sur les troupes régulières ottomanes, et en novembre les rebelles prirent Smederevo, leur première capitale."
