"Ottoman rule brought new taxes and reprisals, and Serbian leaders feared another massacre of the knezes. On 23 April 1815, Palm Sunday, an assembly at Takovo near Gornji Milanovac proclaimed a new rising and chose Miloš Obrenović to lead it. The rebels took Rudnik and in May routed a force of some 7,000 under Imšir Pasha on Ljubić hill outside Čačak, killing its commander. Over the summer they won at Palež, Valjevo, Kragujevac, Jagodina and Požarevac, and in July they stormed the entrenched camp of a Bosnian army at Dublje in Mačva, the last battle of the rising.": "Le 23 avril 1815, dimanche des Rameaux, une assemblée à Takovo près de Gornji Milanovac proclama une nouvelle montée et choisit Miloš Obrenović pour la diriger. Les rebelles ont pris Rudnik et, au mois de mai, ont conduit une force d’environ 7 000 personnes sous Imšir Pasha sur la colline de Ljubić à l’extérieur de Čačak, tuant son commandant. Au cours de l’été, ils ont gagné à Palež, Valjevo, Kragujevac, Jagodina et Požarevac, et en juillet ils ont pris l’assaut du camp retranché d’une armée bosniaque à Dublje à Mačva, la dernière bataille de la montée."
"Larger Ottoman armies were gathering in Bosnia under Hurshid Pasha and in Rumelia under Marashli Ali Pasha, but after Napoleon’s final defeat the Porte feared a new Russian intervention. Miloš, a cautious diplomat, avoided battle with the main armies and negotiated with both pashas. In the autumn of 1815 Marashli Ali Pasha, the new governor of Belgrade, accepted an unwritten settlement under which Serbian knezes would collect the taxes and a Serbian national chancery would sit beside the pasha’s court. Ottoman garrisons stayed in Belgrade and other towns. The terms were close to those Karađorđe had refused in 1807.": "De plus grandes armées ottomanes se rassemblaient en Bosnie sous Hurshid Pacha et à Rumelia sous Marashli Ali Pacha, mais après la défaite finale de Napoléon, la Porte craignait une nouvelle intervention russe. Miloš, un diplomate prudent, évitait la bataille avec les principales armées et négociait avec les deux pachas. À l’automne de 1815, Marachli Ali Pacha, le nouveau gouverneur de Belgrade, accepta un règlement non écrit en vertu duquel les knezes serbes percevraient les impôts et une chancellerie nationale serbe siégerait à côté de la cour des pachas. Les garnisons ottomanes restaient à Belgrade et dans d’autres villes."
