"When the Russo-Turkish war flared again in 1809, Karađorđe struck south-west into the Sanjak of Novi Pazar, hoping to open a corridor to Montenegro and the Adriatic. His men took Sjenica in May and the town of Novi Pazar in June, but not its fortress. In the south-east some 10,000 rebels dug in around the Ottoman fortress of Niš, but their commanders quarrelled and their trenches were poorly supported. On 31 May, after Ottoman reinforcements arrived from Rumelia, the redoubt on Čegar hill was stormed. Its commander, Stevan Sinđelić, fired into the powder magazine, killing himself, his men and many of the attackers.": "Lorsque la guerre russo-turque éclata de nouveau en 1809, Karahore frappe le sud-ouest dans le Sanjak de Novi Pazar, espérant ouvrir un couloir au Monténégro et à l’Adriatique. Ses hommes prennent Sjenica en mai et la ville de Novi Pazar en juin, mais pas sa forteresse. Au sud-est, quelque 10 000 rebelles creusèrent autour de la forteresse ottomane de Niš, mais leurs commandants se disputèrent et leurs tranchées furent mal soutenues. Le 31 mai, après l’arrivée des renforts ottomans de Roumelia, le doubit sur la colline de Čegar fut pris d’assaut."
"Hurshid Pasha had the skulls of the dead Serbs built into a tower beside the Constantinople road at Niš; 952 were set in its walls. His army advanced down the Morava towards Belgrade, and thousands of people fled across the Danube into Austria, until Russian attacks south of the Danube in September drew the Ottomans off. Karađorđe’s appeals to Napoleon and to Vienna came to nothing. In 1810 Russian troops came back to Serbia, and in September Serbs and Russians under General Joseph O’Rourke beat Hurshid at Varvarin. In October a Bosnian army that had crossed the Drina was thrown back at Loznica.": "Hurshid Pasha avait les crânes des Serbes morts construits dans une tour près de la route Constantinople à Niš ; 952 ont été mis dans ses murs. Son armée a avancé vers le bas du Morava vers Belgrade, et des milliers de personnes ont fui à travers le Danube en Autriche, jusqu’à ce que les attaques russes au sud du Danube en Septembre a attiré les Ottomans. Kara-or-e-s appels à Napoléon et à Vienne est venu à rien. En 1810, les troupes russes sont revenues en Serbie et, en septembre, les Serbes et les Russes sous la direction du général Joseph O-Rourke ont battu Hurshid à Varvarin."
