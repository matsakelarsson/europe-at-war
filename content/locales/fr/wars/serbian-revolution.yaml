"In 1806 the Porte sent armies against the rebels from two sides. From Bosnia came sipahi cavalry and Bosnian levies, which Karađorđe met at Mišar near Šabac. From 13 to 15 August his infantry held a square earthwork on the hill against repeated charges, until the Serbian cavalry under Luka Lazarević and Miloš Obrenović struck the attackers in the flank and routed them. In the south a larger army under Ibrahim Pasha of Scutari was beaten at Deligrad on the Morava in early September and agreed to a truce. Meanwhile the envoy Petar Ičko won the Porte’s agreement to wide Serbian autonomy.": "En 1806, la Porte envoya des armées contre les rebelles de deux côtés. De Bosnie vinrent la cavalerie sipahi et les prélèvements bosniaques, ce que Karahora se rencontra à Mišar près de Šabac. Du 13 au 15 août, son fantassin tenait une terre carrée sur la colline contre des accusations répétées, jusqu’à ce que la cavalerie serbe sous Luka Lazarević et Miloš Obrenović frappent les attaquants dans le flanc et les acheminent. Au sud, une armée plus importante sous Ibrahim Pacha de Scutari a été battue à Deligrad sur le Morava au début du mois de septembre et a accepté une trêve."
"In December the rebels broke into the town of Belgrade, and Russia went to war with the Ottomans. Promised Russian help, Karađorđe rejected Ičko’s Peace and fought on for independence. The capture of Belgrade was followed by a massacre of its Muslim inhabitants, among them the garrison of the citadel, attacked as it left under a promise of safe conduct in early 1807; women and children were forcibly baptised. In July 1807 Russian troops joined the Serbs to beat the Ottomans at Malajnica near Negotin. The rebel state abolished the Ottoman landholders’ feudal dues.": "En décembre, les rebelles se sont introduits dans la ville de Belgrade, et la Russie est allée en guerre avec les Ottomans. Promitée par l’aide russe, Karahorlè a rejeté Ičkoís Peace et s’est battue pour l’indépendance. La capture de Belgrade a été suivie d’un massacre de ses habitants musulmans, dont la garnison de la citadelle, attaquée alors qu’elle restait sous une promesse de conduite sûre au début de 1807 ; des femmes et des enfants ont été baptisés de force. En juillet 1807, les troupes russes se joignirent aux Serbes pour battre les Ottomans de Malajnica près de Negotin. L’État rebelle abolit les droits féodaux des propriétaires fonciers ottomans."
