"May 1815": "mai 1815"
"The largest battle of the rising. Imšir Pasha was killed and his army destroyed, and the rebels took Čačak.": "La plus grande bataille de la montée. Imšir Pasha a été tué et son armée détruite, et les rebelles ont pris Čačak."
"Palež": "Palež"
"The rebels drove the Ottomans from the town on the Sava, today’s Obrenovac.": "Les rebelles ont chassé les Ottomans de la ville sur la Save, aujourd'hui Obrenovac."
"Summer 1815": "Été 1815"
"The Ottoman garrison surrendered to Miloš’s troops.": "La garnison ottomane s’est rendue aux troupes de Miloš."
"July 1815": "juillet 1815"
"Miloš’s men, advancing behind wooden shields, stormed the Bosnian camp in Mačva with few losses.": "Les hommes de Milošs, se déplaçant derrière des boucliers en bois, ont pris le camp bosniaque à Mačva avec peu de pertes."
"Autumn 1815": "Automne 1815"
"Miloš and Marashli Ali Pasha agreed the terms of Serbian self-government by word of mouth; the sultan’s decrees of 1816 confirmed parts of them.": "Miloš et Marashli Ali Pacha ont approuvé les termes de l’autonomie serbe par bouche à oreille ; les décrets sultanès de 1816 en ont confirmé certaines parties."
"Miloš Obrenović": "M. Miloš Obrenović"
"Held by the Serbian rebels, summer 1815 (approximate)": "Tenue par les rebelles serbes, été 1815 (approximate)"
"Autonomy": "Autonomie"
"1817–1833": "1817–1833"
"In July 1817 Karađorđe slipped back into Serbia from Bessarabia, having joined the Greek secret society Filiki Eteria, which was planning a wider Balkan rising. Miloš, anxious to keep both the Porte’s trust and his own power, had him killed in his sleep near Velika Plana on 25 July and sent his head to Constantinople. In November an assembly proclaimed Miloš hereditary prince. The murder began a feud between the Obrenović and Karađorđević families that shaped Serbian politics until 1903. Miloš ruled autocratically from Kragujevac, steadily edging Ottoman officials out of the running of the country.": "En juillet 1817, Karahorlöe s’enfuit de Bessarabia en Serbie, après avoir rejoint la société secrète grecque Filiki Eteria, qui planifiait une montée plus large des Balkans. Miloš, soucieux de garder la confiance des Portes et son propre pouvoir, le fit tuer dans son sommeil près de Velika Plana le 25 juillet et envoya sa tête à Constantinople. L’assassinat a commencé une querelle entre les familles Obrenović et Karaшorюević qui a façonné la politique serbe jusqu’en 1903. Miloš a gouverné autocratiquement de Kragujevac, échappant sans cesse aux autorités ottomanes de l’administration du pays."
"Russia took up the Serbian cause. The Akkerman Convention of 1826 and the Treaty of Adrianople of 1829, which ended a Russo-Turkish war, bound the Porte to grant Serbian self-government. A hatt-i sharif of 1830 recognised Miloš as hereditary prince of an autonomous principality paying a yearly tribute; Muslims living outside the garrison towns were to sell their land and leave. Another, in 1833, added six districts that had belonged to Karađorđe’s Serbia, from Krajina and Crna Reka in the east to Jadar in the west. Ottoman garrisons stayed in Belgrade and a few other fortresses until 1867, and full independence came in 1878.": "La Russie a repris la cause serbe. La Convention d’Akkerman de 1826 et le Traité d’Adrianople de 1829, qui a mis fin à une guerre russo-turque, ont lié la Porte à accorder l’autonomie serbe. Un hatt-i sharif de 1830 reconnu Miloš comme prince héréditaire d’une principauté autonome rendant un hommage annuel ; les musulmans vivant en dehors des villes de garnison devaient vendre leurs terres et partir. Un autre, en 1833, ajouta six districts qui avaient appartenu à la Serbie de Karahorroïs, de Krajina et de Crna Reka à l’est jusqu’à Jadar à l’ouest. Les garnisons ottomanes séjournèrent à Belgrade et quelques autres forteresses jusqu’en 1867, et la pleine indépendance arriva en 1878."
"Murder of Karađorđe": "Meurtre de Kara-or-Est"
"25 July 1817": "25 juillet 1817"
"Hatt-i sharif recognising Miloš as hereditary prince": "Hatt-i sharif reconnaissant Miloš comme prince héréditaire"
"Six districts added": "Six districts ajoutés"
"Radovanje": "Radovanje"
"Karađorđe was murdered in the woods by this village on orders passed on by Miloš Obrenović.": "M. Karahora a été assassiné dans les bois par ce village sur ordre de Miloš Obrenović."
"Kragujevac": "Kragujevac"
"1818–1841": "1818–1841"
"Miloš Obrenović’s capital, where Serbia’s first constitution was proclaimed in February 1835.": "Miloš Obrenović, capitale, où la première constitution de la Serbie a été proclamée en février 1835."
"until 1867": "jusqu’en 1867"
"An Ottoman garrison held the fortress, the last sign of the sultan’s rule in Serbia, until it withdrew in 1867.": "Une garnison ottomane tenait la forteresse, le dernier signe de la domination du sultan en Serbie, jusqu’à ce qu’elle se retire en 1867."
"Chief town of the Krajina district, one of the six districts handed to Serbia in 1833.": "Chef-lieu du district de Krajina, l’un des six districts remis à la Serbie en 1833."
"Added to the principality, 1833 (with Jadar, Paraćin and Stari Vlah)": "Ajouté à la principauté, 1833 (avec Jadar, Paracin et Stari Vlah)"
