"By the Treaty of Bucharest of May 1812, signed weeks before Napoleon invaded Russia, Russia withdrew from the Balkans. Its eighth article promised the Serbs an amnesty and self-government, but the Ottomans were to reoccupy the fortresses and towns, and forts built since 1804 were to be razed. Karađorđe refused, and the rebels, weakened by feuds that had led him to exile his rivals Petar Dobrnjac and Milenko Stojković, stood alone. In the summer of 1813 Ottoman armies, largely Bosnian and Albanian, invaded from Niš, Vidin and Bosnia. At Negotin Hajduk Veljko held out against a much larger force until he was killed in July.": "Par le traité de Bucarest de mai 1812, signé quelques semaines avant l’invasion de la Russie par Napoléon, la Russie se retira des Balkans. Son huitième article promettait aux Serbes une amnistie et un gouvernement autonome, mais les Ottomans réoccupaient les forteresses et les villes, et les forts construits depuis 1804 devaient être rasés. Les rebelles, affaiblis par des querelles qui l’avaient conduit à exiler ses rivaux, Petar Dobrnjac et Milenko Stojković, se tenaient seuls. Au cours de l’été 1813, les armées ottomanes, en grande partie bosniaques et albanaises, envahirent Niš, Vidin et la Bosnie."
"In early October Karađorđe and other leaders crossed into Austria with a great many refugees, as many as 100,000 by one estimate, and Belgrade fell. The reconquest brought burned villages, executions and enslavement; on one day in October 1813, 1,800 women and children were reportedly sold at Belgrade. Hurshid Pasha then proclaimed an amnesty, and some commanders submitted, among them Miloš Obrenović, who was made knez of the Rudnik district. A rising led by Hadži Prodan in the Požega district in September 1814 failed, and the Ottomans answered with more killings, impaling some 200 prisoners in Belgrade.": "Au début du mois d’octobre, Karahore et d’autres dirigeants ont traversé l’Autriche avec un grand nombre de réfugiés, jusqu’à 100 000 selon une estimation, et Belgrade est tombée. La reconquête a apporté des villages brûlés, des exécutions et l’esclavage ; un jour en octobre 1813, 1 800 femmes et enfants auraient été vendus à Belgrade. Hurshid Pacha proclama alors une amnistie, et certains commandants soumettèrent, parmi eux Miloš Obrenović, qui fut fait knez du district de Rudnik. Une montée menée par Hadži Prodan dans le district de Požega en septembre 1814 échoua, et les Ottomans répondirent avec plus d’assassinats, empalant quelque 200 prisonniers à Belgrade."
