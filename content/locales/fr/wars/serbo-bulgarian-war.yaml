# Some French text was translated automatically.
"Serbo-Bulgarian War": "Guerre serbo-bulgare"
"A two-week war in November 1885 in which Serbia, objecting to the union of Bulgaria and Eastern Rumelia, invaded Bulgaria and was defeated at Slivnitsa and Pirot. Austria-Hungary stopped the Bulgarian counter-offensive, the Treaty of Bucharest of March 1886 restored peace without changing borders, and the powers accepted the Bulgarian union in the Tophane Agreement.": "Une guerre de deux semaines, en novembre 1885, au cours de laquelle la Serbie, s’opposant à l’union de Bulgarie et de Rumelia orientale, envahit la Bulgarie et fut battue à Slivnitsa et Pirot. L’Autriche-Hongrie arrêta la contre-offensive bulgare, le traité de Bucarest de mars 1886 rétablit la paix sans changer les frontières, et les puissances acceptèrent l’union bulgare dans l’Accord Tophane."
"Bulgaria and Serbia used the Julian (Old Style) calendar, 12 days behind the Gregorian in the 19th century; Bulgarian accounts date the union to 6 September and the war to 2–16 November 1885. All dates here are New Style.": "La Bulgarie et la Serbie ont utilisé le calendrier julien (ancien style), 12 jours derrière le grégorien au 19ème siècle ; les comptes bulgares datent l’union au 6 septembre et la guerre au 2–16 novembre 1885. Toutes les dates ici sont New Style."
"Tsaribrod is today’s Dimitrovgrad in Serbia; the town passed from Bulgaria to Yugoslavia in 1920.": "Tsaribrod est aujourd'hui Dimitrovgrad en Serbie ; la ville est passée de Bulgarie à Yougoslavie en 1920."
