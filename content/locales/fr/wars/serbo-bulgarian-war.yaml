"September – November 1885": "septembre – novembre 1885"
"The Congress of Berlin in 1878 had split the Bulgarian lands, leaving Eastern Rumelia an autonomous Ottoman province. On 18 September 1885 a revolutionary committee and local militia seized power in its capital, Plovdiv, and proclaimed union with the Principality of Bulgaria, and Prince Alexander of Battenberg accepted it. Russia, at odds with Alexander, withdrew its officers from the Bulgarian army, leaving it with no one above the rank of captain. King Milan of Serbia claimed that the balance of Berlin had been upset, and on 14 November, with most Bulgarian troops guarding the Ottoman border far to the south-east, he invaded.": "Le 18 septembre 1885, un comité révolutionnaire et une milice locale s’emparèrent du pouvoir dans sa capitale, Plovdiv, proclama l’union avec la Principauté de Bulgarie, et le prince Alexandre de Battenberg l’accepta. La Russie, contrairement à Alexander, retira ses officiers de l’armée bulgare, ne laissant personne au-dessus du grade de capitaine. Le roi Milan de Serbie a affirmé que l’équilibre de Berlin avait été bouleversé, et le 14 novembre, avec la plupart des troupes bulgares qui gardaient la frontière ottomane loin au sud-est, il a envahi."
"The main Serbian army crossed at Tsaribrod and advanced on Sofia, which lay only some 60 kilometres from the border. The Bulgarians brought troops north from the Rumelian frontier in forced marches and dug in at Slivnitsa, a pass on the road to the capital. There, from 17 to 19 November, they beat off the Serbian attacks and then counter-attacked, with Prince Alexander in command. In the north-west a smaller Serbian army laid siege to Vidin, whose garrison held out.": "L’armée serbe principale a traversé Tsaribrod et avancé sur Sofia, qui se trouve à seulement 60 kilomètres de la frontière. Les Bulgares ont amené des troupes au nord de la frontière rumelienne dans des marches forcées et creusé à Slivnitsa, un passage sur la route de la capitale. Là, du 17 au 19 novembre, ils ont battu les attaques serbes puis contre-attaque, avec le prince Alexandre au commandement. Dans le nord-ouest, une armée serbe plus petite assiégeait Vidin, dont la garnison tenait."
