"Pirot and the peace": "Pirot et la paix"
"November 1885 – April 1886": "novembre 1885 – avril 1886"
"The Bulgarians retook Tsaribrod on 24 November, crossed into Serbia and on 26–27 November beat the Serbian army at Pirot and took the town. The road to Niš lay open. On 28 November the Austro-Hungarian envoy, Count Rudolf Khevenhüller, warned Prince Alexander that Austro-Hungarian troops would enter the war if the Bulgarians went further, and the fighting stopped. The Bulgarians withdrew from Pirot under the armistice.": "Les Bulgares ont repris Tsaribrod le 24 novembre, sont entrés en Serbie et les 26 et 27 novembre ont battu l’armée serbe à Pirot et pris la ville. La route vers Niš était ouverte. Le 28 novembre, l’envoyé austro-hongrois, le comte Rudolf Khevenhüller, a averti le prince Alexandre que les troupes austro-hongroises entreraient dans la guerre si les Bulgares allaient plus loin et les combats s’arrêtaient. Les Bulgares se sont retirés du Pirot sous l’armistice."
"The Treaty of Bucharest, signed on 3 March 1886, had a single article restoring peace, and no border changed. In the Tophane Agreement of 5 April the Ottoman Empire and the powers recognised the Prince of Bulgaria as governor-general of Eastern Rumelia, accepting the union in practice; the Ottomans received the Kardzhali district in the Rhodopes in return. The victory made the young Bulgarian army a source of national pride, but Russia did not forgive Alexander, and in August 1886 pro-Russian officers overthrew him.": "Le traité de Bucarest, signé le 3 mars 1886, comporte un seul article qui rétablit la paix et aucune frontière n’a changé. Dans l’accord tophane du 5 avril, l’Empire ottoman et les pouvoirs reconnaissent le prince de Bulgarie comme gouverneur général de Rumelia orientale, acceptant l’union dans la pratique ; les Ottomans reçoivent en retour le district de Kardzhali dans les Rhodopes. La victoire fit de la jeune armée bulgare une source de fierté nationale, mais la Russie ne pardonna pas à Alexandre et, en août 1886, les officiers pro-russes le renversèrent."
