# French translations of the catalogue text (wave 14); step bodies follow later.
Seven Years’ War in the Caribbean: Guerre de Sept Ans dans les Caraïbes
? The British conquest of France’s and Spain’s most valuable Caribbean islands during the Seven Years’ War. In January 1759 an expedition under Major-General Peregrine Hopson and Commodore John Moore was beaten off at Martinique and turned on Guadeloupe; after months of fighting in which disease killed far more men than the French, Colonel John Barrington received the island’s capitulation on 1–2 May 1759, days before a French relief squadron arrived. In June 1761 a force from Guadeloupe took Dominica, the “neutral island” long left to the Kalinago. Early in 1762 Major-General Robert Monckton and Rear-Admiral George Rodney captured Martinique, after which Saint Lucia, Grenada and Saint Vincent gave up without a fight. Spain had entered the war in January 1762, and in June a great fleet under Admiral George Pocock landed an army under the Earl of Albemarle near Havana. The fortress of El Morro fell on 30 July after a siege in which its commander Luis Vicente de Velasco was mortally wounded, and Havana surrendered on 13 August 1762 with nine Spanish ships of the line; yellow fever and malaria killed some 4,700 British soldiers and sailors by October. In the Treaty of Paris of 10 February 1763 Britain gave back Guadeloupe, Martinique, Saint Lucia and Havana, taking Florida from Spain in exchange for Havana, and kept Dominica, Saint Vincent, Grenada and Tobago.
: La conquête par les Britanniques des îles les plus précieuses de la France et de l’Espagne dans les Caraïbes pendant la guerre de Sept Ans. En janvier 1759, une expédition commandée par le major général Peregrine Hopson et le commodore John Moore fut repoussée à la Martinique et se tourna vers la Guadeloupe ; après des mois de combats au cours desquels les maladies tuèrent bien plus d’hommes que les Français, le colonel John Barrington reçut la capitulation de l’île les 1er et 2 mai 1759, quelques jours avant l’arrivée d’une escadre française de secours. En juin 1761, une force partie de la Guadeloupe prit la Dominique, l’« île neutre » longtemps laissée aux Kalinagos. Au début de 1762, le major général Robert Monckton et le contre-amiral George Rodney s’emparèrent de la Martinique, après quoi Sainte-Lucie, la Grenade et Saint-Vincent se rendirent sans combattre. L’Espagne était entrée en guerre en janvier 1762, et en juin une grande flotte commandée par l’amiral George Pocock débarqua près de La Havane une armée aux ordres du comte d’Albemarle. La forteresse d’El Morro tomba le 30 juillet au terme d’un siège au cours duquel son commandant, Luis Vicente de Velasco, fut mortellement blessé, et La Havane capitula le 13 août 1762 avec neuf vaisseaux de ligne espagnols ; en octobre, la fièvre jaune et le paludisme avaient tué quelque 4 700 soldats et marins britanniques. Par le traité de Paris du 10 février 1763, la Grande-Bretagne rendit la Guadeloupe, la Martinique, Sainte-Lucie et La Havane, en prenant la Floride à l’Espagne en échange de La Havane, et garda la Dominique, Saint-Vincent, la Grenade et Tobago.
