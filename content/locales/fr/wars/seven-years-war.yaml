"1757–1758": "1757–1758"
"Russia joined Austria and France against Prussia in 1757. Empress Elizabeth’s army, about 55,000 strong under Field Marshal Stepan Apraksin, invaded East Prussia, and a detachment took the port of Memel in July. On 30 August Hans von Lehwaldt’s 28,000 Prussians attacked Apraksin at Gross-Jägersdorf and were beaten off after Pyotr Rumyantsev led reserve regiments through a wood into the fight. Instead of following up, Apraksin fell back to the Neman. He was short of supplies, and perhaps feared that the ailing empress would die and be succeeded by her pro-Prussian nephew Peter. He was dismissed and arrested.": "La Russie rejoint l’Autriche et la France contre la Prusse en 1757. L’armée de l’impératrice Elizabeth, environ 55 000 forts sous le maréchal de campagne Stepan Apraksin, envahit la Prusse orientale, et un détachement prend le port de Memel en juillet. Le 30 août, Hans von Lehwaldt 28 000 Prussiens attaquèrent Apraksin à Gross-Jägersdorf et furent battus après que Pyotr Rumyantsev conduisit des régiments de réserve à travers un bois dans le combat. Il était à court de provisions, et craignait peut-être que l’impératrice laborieuse ne meure et ne soit remplacée par son neveu pro prussien Peter."
"His successor, William Fermor, marched into East Prussia in January 1758 almost unopposed. Königsberg surrendered on 22 January, and the province swore allegiance to Elizabeth and stayed under Russian rule for four years. In August Fermor advanced into Brandenburg and bombarded the Oder fortress of Küstrin, setting the town on fire. Frederick II hurried north and on 25 August attacked the Russian army at Zorndorf. With about 11,000 Prussian and some 16,000 Russian casualties it was one of the bloodiest battles of the century. Both sides claimed victory, but Fermor withdrew.": "Son successeur, William Fermor, marcha dans la Prusse orientale en janvier 1758 presque sans opposition. Königsberg se rendit le 22 janvier et la province jura allégeance à Élisabeth et resta sous la domination russe pendant quatre ans. En août Fermor avança au Brandebourg et bombarda la forteresse d’Oder de Küstrin, mettant le feu à la ville. Frederick II se précipita vers le nord et, le 25 août, attaqua l’armée russe à Zorndorf. Avec environ 11 000 Prussiens et 16 000 victimes russes, il fut l’une des batailles les plus sanglantes du siècle."
