"In 1758 Frederick invaded Moravia and in May laid siege to Olmütz. On 30 June the Austrian general Ernst Gideon von Laudon destroyed a great Prussian supply convoy at Domstadtl, and Frederick had to give up the siege and retreat through Bohemia. After fighting the Russians at Zorndorf in August he hurried back to Saxony, where Daun’s army had moved close to his own. Before dawn on 14 October the Austrians surprised the Prussian camp at Hochkirch, near Bautzen. Frederick lost over 9,000 men and much of his artillery, and Field Marshal James Keith was killed, but Daun did not follow up his victory.": "En 1758, Frederick envahit la Moravie et assiégea Olmütz en mai. Le 30 juin, le général autrichien Ernst Gideon von Laudon détruisit un grand convoi d’approvisionnement prussien à Domstadtl, et Frederick dut renoncer au siège et à la retraite par la Bohême. Avant l’aube du 14 octobre, les Autrichiens ont surpris le camp prussien de Hochkirch, près de Bautzen. Frederick a perdu plus de 9 000 hommes et une grande partie de son artillerie, et le maréchal James Keith a été tué, mais Daun n’a pas suivi sa victoire."
"In the west, the French had beaten the Duke of Cumberland’s Hanoverian army at Hastenbeck in July 1757 and occupied Hanover. Britain then paid for a new army of Hanoverians, Hessians and Brunswickers under Duke Ferdinand of Brunswick, joined by British troops in 1758. It drove the French back over the Rhine early in 1758 and beat them at Krefeld on 23 June. On 1 August 1759 at Minden on the Weser, British and Hanoverian infantry, advancing through a misunderstood order, broke charge after charge of the French cavalry, and the French retreated. Ferdinand’s army shielded Hanover and Prussia’s western flank until the end of the war.": "À l’ouest, les Français avaient battu l’armée du Duc de Cumberland à Hastenbeck en juillet 1757 et occupé Hanovre. La Grande-Bretagne a ensuite payé pour une nouvelle armée des Hanovres, Hessiens et Brunswickois sous le duc Ferdinand du Brunswick, rejoint par les troupes britanniques en 1758. Il a conduit les Français sur le Rhin au début de 1758 et les a battus à Krefeld le 23 juin. Le 1er août 1759, à Minden, sur l’infanterie britannique et hanoverienne Weser, en marchant dans un ordre mal compris, rompit la charge après la prise en charge de la cavalerie française, et les Français retirèrent."
"Battle of Hochkirch": "Bataille de Hochkirch"
