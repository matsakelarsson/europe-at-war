"Prague, Kolín, Rossbach and Leuthen": "Prague, Kolín, Rossbach et Leuthen"
"Frederick invaded Bohemia in April 1757. On 6 May he attacked Prince Charles of Lorraine’s army east of Prague and drove it into the city, losing some 14,000 men; Field Marshal Schwerin was killed carrying a regimental flag, and Browne was mortally wounded. But on 18 June at Kolín Frederick attacked an Austrian relief army under Leopold von Daun and was badly beaten, losing about 14,000 of his 34,000 men, and he had to leave Bohemia. Over the summer the French overran Hanover, the Russians invaded East Prussia and the Swedes Pomerania, and in October an Austrian raid briefly held Berlin to ransom.": "Frederick envahit la Bohême en avril 1757. Le 6 mai, il attaqua l’armée du prince Charles de Lorraine à l’est de Prague et la conduisit dans la ville, perdant quelque 14 000 hommes ; le maréchal Schwerin fut tué portant un drapeau régimentaire, et Browne fut mortellement blessé. Mais le 18 juin à Kolín Frederick attaqua une armée de secours autrichienne sous Léopold von Daun et fut gravement battu, perdant environ 14 000 de ses 34 000 hommes, et il dut quitter la Bohême. Au cours de l’été, Hanovre, les Russes envahirent la Prusse orientale et les Suédois Poméranie, et en octobre un raid autrichien tenu brièvement Berlin pour rançon."
"Frederick saved himself with two famous victories. On 5 November at Rossbach in Saxony, a French and Imperial army of about 41,000 under the Prince of Soubise and Saxe-Hildburghausen tried to march round his flank, and Friedrich Wilhelm von Seydlitz’s cavalry routed it in ninety minutes, for the loss of fewer than 600 Prussians. The Austrians took Schweidnitz and Breslau. Frederick marched east, and on 5 December at Leuthen his 36,000 men rolled up the flank of Charles of Lorraine’s army of about 65,000. The Austrians lost some 22,000 men, more than half of them captured, and Breslau was retaken before Christmas.": "Frederick s’est sauvé avec deux victoires célèbres. Le 5 novembre à Rossbach en Saxe, une armée française et impériale d’environ 41 000 hommes sous le prince de Soubise et Saxe-Hildburghausen a essayé de marcher sur son flanc, et Friedrich Wilhelm von SeydlitzS cavalry l’a roué en quatre-vingt-dix minutes, pour la perte de moins de 600 Prussiens. Les Autrichiens prirent Schweidnitz et Breslau. Frederick marcha vers l’est, et le 5 décembre à Leuthen ses 36 000 hommes roula le flanc de l’armée de Charles de Lorraine d’environ 65 000. Les Autrichiens perdirent quelque 22 000 hommes, dont plus de la moitié capturés, et Breslau fut repris avant Noël."
