"Seven Years’ War": "Guerre de Sept Ans"
"A war in which Prussia and Great Britain, with Hanover, fought Austria, France, Russia, Sweden and most of the Holy Roman Empire, while Britain and France, joined by Spain in 1762, fought at sea and in North America, the Caribbean, West Africa and India. Prussia survived invasions from all sides and kept Silesia at the Peace of Hubertusburg in 1763, and the Treaty of Paris left Britain the leading colonial power.": "Une guerre dans laquelle la Prusse et la Grande-Bretagne, avec Hanovre, ont combattu l’Autriche, la France, la Russie, la Suède et la plupart du Saint Empire romain, tandis que la Grande-Bretagne et la France, rejoints par l’Espagne en 1762, combattent en mer et en Amérique du Nord, dans les Caraïbes, en Afrique de l’Ouest et en Inde."
"Dates are New Style (Gregorian). Russia used the Julian calendar, eleven days behind, so Russian sources date Elizabeth’s death 25 December 1761.": "Les dates sont New Style (Gregorian). La Russie a utilisé le calendrier julien, onze jours derrière, donc les sources russes datent la mort d’Elizabeth 25 décembre 1761."
"Sweden’s part in the war is told separately, as the Pomeranian War.": "La partie de la guerre en Suède est racontée séparément, comme la guerre Poméranie."
"The steps follow the war in central Europe, between Prussia and Austria and on the Russian front, with an outline of the war in western Germany. The war at sea, in North America, the Caribbean, West Africa and India is not yet told here.": "Les étapes suivent la guerre en Europe centrale, entre la Prusse et l’Autriche et sur le front russe, avec un aperçu de la guerre en Allemagne occidentale. La guerre en mer, en Amérique du Nord, dans les Caraïbes, en Afrique de l’Ouest et en Inde n’est pas encore racontée ici."
"Places in Silesia, Bohemia and Moravia are named in their German forms of the time; the markers give today’s names.": "Les lieux en Silésie, en Bohême et en Moravie sont nommés dans leurs formes allemandes de l’époque ; les marqueurs donnent aujourd'hui des noms."
