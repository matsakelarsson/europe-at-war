"In 1759 a new commander, Pyotr Saltykov, led the Russian army west through Poland towards the Oder to join the Austrians. On 23 July he beat a smaller Prussian force under Carl Heinrich von Wedel at Kay, near Paltzig, then took Frankfurt an der Oder, where Austrian troops under Ernst Gideon von Laudon joined him. Frederick gathered about 50,000 men, crossed the Oder north of Frankfurt and on 12 August attacked the allied army of some 60,000, dug in on the hills by the village of Kunersdorf.": "En 1759, un nouveau commandant, Pyotr Saltykov, conduisit l’armée russe à travers la Pologne vers l’Oder pour rejoindre les Autrichiens. Le 23 juillet il battit une force prussienne plus petite sous Carl Heinrich von Wedel à Kay, près de Paltzig, puis prit Francfort-sur-le-Main, où les troupes autrichiennes sous Ernst Gideon von Laudon le rejoignirent. Frederick a rassemblé environ 50 000 hommes, traversé l’Oder au nord de Francfort et le 12 août a attaqué l’armée alliée d’environ 60 000, creusé sur les collines par le village de Kunersdorf."
"His first attacks drove in the Russian left, but his tired troops were thrown back again and again from the heights, and Laudon’s cavalry finally broke them. About 19,000 Prussians were killed, wounded or captured, more than a third of the army, and the allies lost some 16,000. That night Frederick wrote that all was lost. But Saltykov, whose army had suffered terribly, and the Austrian commander Leopold von Daun did not march on Berlin, and their armies drew apart. Frederick called his escape the “miracle of the House of Brandenburg”.": "Ses premières attaques ont conduit dans la gauche russe, mais ses troupes fatiguées ont été repoussées encore et encore des hauteurs, et la cavalerie de Laudon. Environ 19 000 Prussiens ont été tués, blessés ou capturés, plus d’un tiers de l’armée, et les alliés ont perdu environ 16.000. Mais Saltykov, dont l’armée avait terriblement souffert, et le commandant autrichien Leopold von Daun ne marcha pas sur Berlin, et leurs armées s’éparpillèrent. Frederick appela son évasion le miracle de la maison du Brandebourg."
