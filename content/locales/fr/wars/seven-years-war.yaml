"Occupied by the Russians, who joined the Austrians here.": "Occupé par les Russes, qui ont rejoint les Autrichiens ici."
"12 August 1759": "12 août 1759"
"Frederick’s worst defeat. His army was scattered, and for a few days he had only a few thousand men left under arms.": "La pire défaite de Frederick. Son armée était dispersée, et pendant quelques jours il n’avait que quelques milliers d’hommes laissés sous les armes."
"Saltykov": "Saltykov"
"Laudon": "Laudon"
"Liegnitz and Torgau": "Liegnitz et Torgau"
"June – November 1760": "juin – novembre 1760"
"By 1760 Prussia was short of men and money, and the Austrians took the initiative. On 23 June Laudon destroyed Fouqué’s Prussian corps at Landeshut in Silesia, and in July he took Glatz. Frederick besieged Dresden, and his guns burned much of the city, but he could not take it. He marched to Silesia, where Laudon, Daun and a Russian army were closing in. At dawn on 15 August near Liegnitz he caught Laudon’s corps on its own and beat it before the others could come up. The Austrians lost some 8,500 men, more than half of them captured, and the Russians drew back across the Oder.": "En 1760, la Prusse était à court d’hommes et d’argent, et les Autrichiens prirent l’initiative. Le 23 juin Laudon détruisit le corps prussien de Fouqués à Landeshut en Silésie, et en juillet il prit Glatz. Frederick assiégea Dresde, et ses armes brûlèrent une grande partie de la ville, mais il ne pouvait pas la prendre. À l’aube du 15 août, près de Liégnitz, il a pris le corps de Laudon et l’a battu avant que les autres ne puissent monter. Les Autrichiens ont perdu quelque 8 500 hommes, dont plus de la moitié sont capturés, et les Russes se sont repliés sur l’Oder."
"In October, while Frederick was still in Silesia, Russian and Austrian troops briefly occupied Berlin. He turned back to Saxony, and on 3 November attacked Daun’s army, dug in on the Süptitz heights outside Torgau. His columns went in piecemeal and were shot down, and by nightfall he thought the battle lost, until Hans Joachim von Zieten’s corps stormed the heights from the south. Daun, wounded, withdrew across the Elbe in the night. Torgau was one of the bloodiest battles of the war, with by some counts up to 16,000 Prussian and 15,000 Austrian casualties, and it left the Austrians little of Saxony beyond Dresden.": "En octobre, alors que Frederick était encore en Silésie, les troupes russes et autrichiennes occupaient brièvement Berlin. Il retourna à la Saxe, et le 3 novembre attaqua l’armée de Daun, creusée sur les hauteurs de Süptitz en dehors de Torgau. Ses colonnes sont allées en morceaux et ont été abattues, et à la tombée de la nuit il a pensé que la bataille a perdu, jusqu’à Hans Joachim von Zieten. corps a pris les hauteurs du sud. Daun, blessé, s’est retiré à travers l’Elbe dans la nuit. Torgau a été l’une des batailles les plus sanglantes de la guerre, avec certains compte jusqu’à 16 000 Prussiens et 15 000 morts autrichiennes, et il a laissé les Autrichiens peu de Saxe au-delà de Dresde."
"Battle of Landeshut": "Bataille de Landeshut"
"23 June 1760, Austrian victory": "23 juin 1760, victoire autrichienne"
"Battle of Liegnitz": "Bataille de Liégnitz"
"15 August 1760, Prussian victory": "15 août 1760, victoire prussienne"
"Battle of Torgau": "Bataille de Torgau"
"3 November 1760, Prussian victory": "3 novembre 1760, victoire prussienne"
"23 June 1760": "23 juin 1760"
"Today’s Kamienna Góra. Laudon’s much larger force stormed Fouqué’s entrenchments, and most of the Prussian corps was killed or captured.": "Aujourd'hui, Kamienna Góra. Laudon est beaucoup plus grande que la force a envahi les enclos Fouqués, et la plupart des corps prussiens ont été tués ou capturés."
"Glatz": "Glace"
"26 July 1760": "26 juillet 1760"
"Laudon took the fortress, today’s Kłodzko, which the Austrians held until the peace.": "Laudon prit la forteresse, aujourd'hui Kłodzko, que les Autrichiens tenaient jusqu’à la paix."
"July 1760": "juillet 1760"
"The Austrian garrison held out against Frederick’s siege. His bombardment destroyed much of the old town, including the Kreuzkirche.": "La garnison autrichienne s’est tenue contre le siège de Frederick. Son bombardement a détruit une grande partie de la vieille ville, y compris la Kreuzkirche."
"15 August 1760": "15 août 1760"
"Fought north-east of today’s Legnica. Frederick’s victory stopped the Austrian and Russian armies from joining forces.": "La victoire de Frederick a empêché les armées autrichienne et russe d’unir leurs forces."
"3 November 1760": "3 novembre 1760"
"A costly victory won only at dusk. Frederick was hit in the chest by a spent musket ball.": "Une victoire coûteuse a gagné seulement au crépuscule. Frederick a été frappé dans la poitrine par une balle de mousquet épuisée."
"Frederick, August": "Frederick, août"
"Frederick, October": "Frederick, octobre"
"Berlin, Kolberg and the peace of 1762": "Berlin, Kolberg et la paix de 1762"
"1760–1762": "1760–1762"
"In October 1760, while Frederick was in Silesia, a Russian corps under Gottlob Totleben and Zakhar Chernyshev and an Austrian corps under Franz Moritz von Lacy marched on Berlin. The small garrison withdrew, and the city surrendered on 9 October. The occupiers took a heavy ransom and destroyed arms works, then left three days later as Frederick approached. The Russians had twice besieged the Pomeranian port of Kolberg without success. In 1761 Pyotr Rumyantsev besieged it again by land and sea, and on 16 December its garrison surrendered, giving Russia a harbour for its army in Pomerania.": "En octobre 1760, alors que Frederick était en Silésie, un corps russe sous Gottlob Totleben et Zakhar Chernyshev et un corps autrichien sous Franz Moritz von Lacy marchèrent sur Berlin. La petite garnison se retira, et la ville se rendit le 9 octobre. Les occupants prirent une lourde rançon et détruisirent les armes, puis partirent trois jours plus tard à l’approche de Frederick. Les Russes avaient assiégé deux fois le port Poméranie de Kolberg sans succès. En 1761 Pyotr Rumyantsev l’assiégea de nouveau par terre et par mer, et le 16 décembre sa garnison se rendit, donnant à la Russie un port pour son armée en Poméranie."
"Prussia was close to exhaustion when Empress Elizabeth died on 5 January 1762. Her nephew and heir, Peter III, admired Frederick. He made peace at once, and in the Treaty of Saint Petersburg on 5 May handed back East Prussia and Pomerania, asking nothing in return. In June he allied with Frederick and placed Chernyshev’s corps under his command. Sweden made peace at Hamburg on 22 May. In July Peter was overthrown by his wife, Catherine II, who kept the peace but ended the alliance. Without Russia, Austria could not win, and the Peace of Hubertusburg in February 1763 left Prussia with Silesia.": "La Prusse était proche de l’épuisement quand l’impératrice Élisabeth mourut le 5 janvier 1762. Son neveu et héritier, Peter III, admirait Frédéric. Il fit la paix à la fois, et dans le traité de Saint-Pétersbourg le 5 mai remit la Prusse orientale et la Poméranie, ne demandant rien en retour. En juillet, Pierre fut renversé par son épouse Catherine II, qui garda la paix mais mit fin à l’alliance. Sans la Russie, l’Autriche ne put gagner, et la Paix d’Hubertusburg, en février 1763, quitta la Prusse avec la Silésie."
"Berlin occupied": "Berlin occupée"
"9–12 October 1760": "9–12 octobre 1760"
"Kolberg surrendered": "Kolberg s’est rendu"
"16 December 1761": "16 décembre 1761"
"Treaty of Saint Petersburg": "Traité de Saint-Pétersbourg"
"5 May 1762, Russia gives back its conquests": "5 mai 1762, la Russie rend ses conquêtes"
"Russian and Austrian troops held the Prussian capital for three days and took a ransom before Frederick’s approach drove them out.": "Les troupes russes et autrichiennes ont tenu la capitale prussienne pendant trois jours et ont pris une rançon avant que Fredericks approche les chasse."
"Kolberg": "Kolberg"
"After sieges in 1758 and 1760 had failed, Rumyantsev starved the fortress into surrender.": "Après l’échec des sièges de 1758 et de 1760, Rumyantsev a perdu la vie dans la forteresse."
"Under the Treaty of Saint Petersburg, East Prussia, held by Russia since 1758, went back to Prussia.": "En vertu du Traité de Saint-Pétersbourg, la Prusse orientale, tenue par la Russie depuis 1758, retourne en Prusse."
"Chernyshev and Totleben": "Chernyshev et Totleben"
"Lacy": "Lactosérum"
"Rumyantsev": "Rumyantsev"
"Exhaustion and the Peace of Hubertusburg": "Épuisement et paix d’Hubertusburg"
"1761 – February 1763": "1761 – février 1763"
"Prussia could no longer win the war, only avoid losing it. In August 1761 Frederick dug his army in at Bunzelwitz in Silesia, and the far larger Austrian and Russian armies did not dare attack; but once he had moved away, Laudon stormed Schweidnitz on 1 October. Britain stopped its subsidies in 1762. Then Russia made peace. On 21 July Frederick drove the Austrians from the heights of Burkersdorf, while a Russian corps, ordered home after Peter III’s overthrow, stood by in his lines. He retook Schweidnitz in October, and on 29 October Prince Henry beat the Austrians and the Imperial army at Freiberg in Saxony.": "En août 1761, Frederick creusa son armée à Bunzelwitz en Silésie, et les armées autrichiennes et russes beaucoup plus grandes n’osèrent pas attaquer ; mais une fois parti, Laudon prit Schweidnitz le 1er octobre. La Grande-Bretagne arrêta ses subventions en 1762. Puis la Russie fit la paix. Le 21 juillet, Frederick conduisit les Autrichiens des hauteurs de Burkersdorf, tandis qu’un corps russe, ordonné maison après le renversement de Peter III, se tenait dans ses lignes. Il reprenait Schweidnitz en octobre, et le 29 octobre le prince Henry battait les Autrichiens et l’armée impériale à Freiberg en Saxe."
"Britain and France agreed peace terms in November 1762, and Austria, on its own, could not hope to defeat Prussia. Envoys of Austria, Prussia and Saxony met at the Saxon hunting lodge of Hubertusburg, and on 15 February 1763, five days after the Treaty of Paris, they agreed to restore the borders of 1756. Prussia kept Silesia and Glatz and left Saxony, and Frederick promised his vote to Maria Theresa’s son Joseph at the next imperial election. The war had cost Prussia, by some estimates, a tenth of its people, and left Saxony ruined, but it made Prussia one of Europe’s great powers.": "En novembre 1762, la Grande-Bretagne et la France s’accordèrent sur des conditions de paix, et l’Autriche ne put espérer à elle seule vaincre la Prusse. Des envoyés d’Autriche, de Prusse et de Saxe se rencontrèrent au pavillon de chasse saxon d’Hubertusburg et, le 15 février 1763, cinq jours après le traité de Paris, ils acceptèrent de rétablir les frontières de 1756. La Prusse garda Silésie et Glatz et quitta la Saxe, et Frédéric promit son vote à Maria Theresa's fils Joseph lors des prochaines élections impériales. La guerre avait coûté à la Prusse, selon certaines estimations, un dixième de son peuple, et laissé la Saxe ruinée, mais elle fit de la Prusse l’une des grandes puissances d’Europe."
"Battle of Freiberg": "Bataille de Freiberg"
"29 October 1762, Prussian victory": "29 octobre 1762, victoire prussienne"
"Peace of Hubertusburg": "Paix d’Hubertusburg"
"15 February 1763": "15 février 1763"
"Result": "Résultat"
"The borders of 1756; Silesia stays Prussian": "Les frontières de 1756 ; Silésie reste prussienne"
"Bunzelwitz": "Bunzelwitz"
"August – September 1761": "août – septembre 1761"
"For three weeks Laudon’s Austrians and Alexander Buturlin’s Russians faced Frederick’s entrenched camp, today in Bolesławice, without attacking.": "Pendant trois semaines, les Autrichiens Laudon et Alexander Buturlin ont affronté le camp de Fredericks, aujourd'hui à Bolesławice, sans attaquer."
"Schweidnitz": "Schweidnitz"
"1761–1762": "1761–1762"
"Today’s Świdnica. Laudon took the fortress by storm on 1 October 1761, and Frederick won it back after a two-month siege on 9 October 1762.": "Aujourd'hui, Laudon prit la forteresse par tempête le 1er octobre 1761 et Frederick la remporta après un siège de deux mois le 9 octobre 1762."
"Battle of Burkersdorf": "Bataille de Burkersdorf"
"21 July 1762": "21 juillet 1762"
"Frederick’s troops stormed Daun’s positions on the hills south of Schweidnitz, near today’s Burkatów.": "Les troupes de Frederick ont pris d’assaut les positions de Dauns sur les collines au sud de Schweidnitz, près aujourd'hui de Burkatów."
"29 October 1762": "29 octobre 1762"
"Prince Henry’s victory, the last great battle of the war in Germany, secured most of Saxony for Prussia.": "La victoire du prince Henry, la dernière grande bataille de la guerre en Allemagne, a assuré la majeure partie de la Saxe pour la Prusse."
"Austria, Prussia and Saxony made peace on the basis of the borders of 1756 at this hunting lodge near Wermsdorf.": "L’Autriche, la Prusse et la Saxe ont fait la paix sur la base des frontières de 1756 dans ce pavillon de chasse près de Wermsdorf."
"Minorca and Portugal": "Minorque et Portugal"
"1756–1763": "1756–1763"
"The war between Britain and France had begun in the Mediterranean, months before Frederick invaded Saxony. On 18 April 1756 a French army of some 15,000 men under the Duke of Richelieu landed on Minorca, British since 1708, and besieged Fort St Philip, which guarded Port Mahon. Admiral John Byng, sent with a fleet to relieve it, fought an indecisive battle with the French fleet off the island on 20 May and then sailed back to Gibraltar, and the garrison surrendered on 29 June. Byng was court-martialled for failing to do his utmost and shot on the deck of a warship at Portsmouth in March 1757, “to encourage the others”, as Voltaire put it in Candide.": "La guerre entre la Grande-Bretagne et la France avait commencé en Méditerranée, des mois avant l’invasion de la Saxe par Frederick. Le 18 avril 1756, une armée française d’environ 15 000 hommes sous le duc de Richelieu débarqua sur Minorque, britannique depuis 1708, et assiégea le fort St Philip, qui gardait Port Mahon. L’amiral John Byng, envoyé avec une flotte pour la soulager, a mené une bataille indécise avec la flotte française au large de l’île le 20 mai, puis il est retourné à Gibraltar, et la garnison s’est rendue le 29 juin. Byng fut court-martiallé pour n’avoir pas fait tout son possible et abattu sur le pont d’un navire de guerre à Portsmouth en mars 1757, afin d’encourager les autres, comme Voltaire l’a dit à Candide."
? "Spain joined France in January 1762 under the Bourbon Family Compact, and when Portugal, Britain’s ally, refused to close its ports to British ships, Spanish armies invaded it on 5 May. A first army of 22,000 took Miranda do Douro, Bragança and Chaves in Trás-os-Montes, but peasant bands cut its supplies and it fell back. Britain sent some 7,000 troops, and the Count of Schaumburg-Lippe took command of the reorganised Portuguese army. A second, Franco-Spanish army under the Count of Aranda took Almeida in August and pushed towards Abrantes. The allies raided the Spanish bases at Valencia de Alcántara and Vila Velha, peasants stripped the country bare, and hunger, sickness and desertion broke the invaders; a British report put their losses at 30,000. A truce followed in December. By the Treaty of Paris of 10 February 1763 Spain gave back its conquests, Britain returned Havana, taken from Spain in 1762, in exchange for Florida, and France handed Minorca back to Britain."
: "L’Espagne a rejoint la France en janvier 1762 sous le Bourbon Family Compact, et lorsque le Portugal, l’allié de Grande-Bretagne, a refusé de fermer ses ports aux navires britanniques, les armées espagnoles l’ont envahie le 5 mai. Une première armée de 22 000 hommes a pris Miranda do Douro, Bragança et Chaves à Trás-os-Montes, mais les bandes paysannes ont coupé ses provisions et elle est tombée. La Grande-Bretagne a envoyé quelque 7 000 soldats, et le comte de Schaumburg-Lippe a pris le commandement de l’armée portugaise réorganisée. Une seconde armée franco-espagnole sous le comte d’Aranda a pris Almeida en août et poussé vers Abrantes. Les alliés pillèrent les bases espagnoles à Valence d’Alcántara et Vila Velha, les paysans dépouillèrent le pays et la faim, la maladie et la désertion brisèrent les envahisseurs ; un rapport britannique mit leurs pertes à 30 000. Une trêve suivit en décembre. Par le traité de Paris du 10 février 1763 l’Espagne remit ses conquêtes, la Grande-Bretagne retourna La Havane, prise d’Espagne en 1762, en échange de la Floride, et la France remit Minorque à la Grande-Bretagne."
"Fort St Philip surrenders": "Fort St Philip se rend"
"29 June 1756": "29 juin 1756"
