"Saxony overrun, Lobositz and Pirna": "Dépassement de la Saxe, Lobositz et Pirna"
"August – October 1756": "août – octobre 1756"
"In 1756 Europe’s alliances were turned upside down. Britain, anxious for Hanover, made a treaty with Prussia at Westminster in January, and Austria, which wanted Silesia back, then allied with its old enemy France. Russia was arming to join them. Frederick II decided to strike first. On 29 August his army, over 60,000 strong, marched into Saxony, whose elector, Augustus III, was also king of Poland and leaned towards Austria. The Prussians occupied Dresden on 9 September, and the Saxon army of some 18,000 men shut itself up in a fortified camp at Pirna, on the Elbe above the capital.": "En 1756, les alliances de l’Europe furent renversées. La Grande-Bretagne, anxieuse pour Hanovre, fit un traité avec la Prusse à Westminster en janvier, et l’Autriche, qui voulait revenir en Silésie, puis alliée à son ancien ennemi France. Le 29 août, son armée, forte de plus de 60 000 hommes, se rendit en Saxe, dont l’électeur, Auguste III, était aussi roi de Pologne et s’appuyait sur l’Autriche. Les Prussiens occupèrent Dresde le 9 septembre, et l’armée saxonne d’environ 18 000 hommes s’enferma dans un camp fortifié à Pirna, sur l’Elbe au-dessus de la capitale."
"An Austrian army under Field Marshal Maximilian Ulysses Browne marched north to rescue the Saxons. Frederick met it with about 28,000 men on 1 October at Lobositz, on the Elbe in northern Bohemia. After a long and confused day Browne fell back in good order, but he could not break through to Pirna. Starving after five weeks of blockade, the Saxons tried to cross the Elbe, were trapped beneath the Lilienstein rock and surrendered in mid-October. Frederick forced the men into Prussian regiments, from which many deserted, and Saxony was occupied and squeezed for money and recruits for the rest of the war.": "Une armée autrichienne sous le maréchal de campagne Maximilian Ulysse Browne marcha vers le nord pour secourir les Saxons. Frederick la rencontra avec environ 28 000 hommes le 1er octobre à Lobositz, sur l’Elbe en Bohême du Nord. Après cinq semaines de blocus, les Saxons essayèrent de traverser l’Elbe, furent pris au piège sous le rocher de Lilienstein et se rendirent à la mi-octobre. Frederick força les hommes dans des régiments prussiens, d’où beaucoup désertèrent, et la Saxe fut occupée et pressée pour de l’argent et des recrues pour le reste de la guerre."
