"5 May – 24 November 1762": "5 mai – 24 novembre 1762"
"Treaty of Paris": "Traité de Paris"
"10 February 1763: Minorca returned to Britain": "10 février 1763 : Minorque revient en Grande-Bretagne"
"French landing": "Atterrissage français"
"18 April 1756": "18 avril 1756"
"Richelieu’s army came ashore at Ciutadella, at the western end of the island, and marched east to Mahon.": "L’armée de Richelieu vint à terre à Ciutadella, à l’extrémité ouest de l’île, et marcha vers l’est jusqu’à Mahon."
"Battle of Minorca": "Bataille de Minorque"
"20 May 1756": "20 mai 1756"
"The British and French fleets fought an inconclusive action south-east of the island. Byng then held a council of war and sailed back to Gibraltar, leaving the garrison to its fate.": "Les flottes anglaise et française ont combattu une action non concluante au sud-est de l’île. Byng a ensuite tenu un conseil de guerre et est retourné à Gibraltar, laissant la garnison à son sort."
"Fort St Philip": "Fort St Philip"
"20 April – 29 June 1756": "20 avril – 29 juin 1756"
"The garrison under Lieutenant-Governor William Blakeney, then in his eighties, held out for more than two months and marched out with the honours of war.": "La garnison sous la direction du lieutenant-gouverneur William Blakeney, puis dans ses années 80, s’est tenue pendant plus de deux mois et a marché avec les honneurs de la guerre."
"Miranda do Douro": "Miranda do Douro"
"9 May 1762": "9 mai 1762"
"An accidental explosion of the castle’s powder magazine killed some 400 people and blew breaches in the walls, and the town surrendered.": "Une explosion accidentelle de la poudrière du château a tué quelque 400 personnes et fait sauter des brèches dans les murs, et la ville s’est rendue."
"Almeida": "Almeida"
"August 1762": "août 1762"
"The border fortress surrendered to Aranda on 25 August after a short siege.": "La forteresse frontalière s’est rendue à Aranda le 25 août, après un court siège."
"Valencia de Alcántara": "Valence de Alcántara"
"27 August 1762": "27 août 1762"
"Brigadier John Burgoyne’s British and Portuguese troops surprised this Spanish supply base after a forced march and took a Spanish general prisoner.": "Le brigadier John Burgoyne (les troupes britanniques et portugaises) a surpris cette base d’approvisionnement espagnole après une marche forcée et a pris un prisonnier général espagnol."
"Vila Velha": "Vila Velha"
"October 1762": "octobre 1762"
"A night attack led by Lieutenant-Colonel Charles Lee broke up a Spanish detachment guarding the crossing of the Tagus.": "Une attaque de nuit menée par le lieutenant-colonel Charles Lee a brisé un détachement espagnol qui gardait la traversée du Tage."
"Richelieu": "Richelieu"
