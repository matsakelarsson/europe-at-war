"1244–1249": "1244–1249"
"In the summer of 1244 Khwarazmian horsemen, nomads in the service of al-Salih Ayyub, the Ayyubid sultan of Egypt, sacked Jerusalem, which the Franks had regained by treaty in 1229, and in October the army of the Latin East and its Syrian allies was destroyed by the Egyptians and Khwarazmians at La Forbie near Gaza. Louis IX of France, who had vowed to go on crusade during a serious illness that year, spent three years preparing. He sailed from his new port of Aigues-Mortes on 25 August 1248 with perhaps 15,000–25,000 men, spent the winter in Cyprus and in May 1249 sailed for Egypt.": "Au cours de l’été 1244, des cavaliers Khwarazmiens, nomades au service d’al-Salih Ayyub, le sultan ayyubide d’Égypte, ont renvoyé Jérusalem, que les Francs avaient récupéré par traité en 1229, et en octobre l’armée du Latin Orient et ses alliés syriens a été détruite par les Egyptiens et Khwarazmiens à La Forbie près de Gaza. Louis IX de France, qui s’était juré d’aller en croisade pendant une grave maladie cette année-là, a passé trois ans à se préparer. Il a navigué de son nouveau port d’Aigues-Mortes le 25 août 1248 avec environ 15 000–25 000 hommes, a passé l’hiver à Chypre et en mai 1249 a navigué pour l’Egypte."
"On 5 June 1249 the crusaders landed on the beach before Damietta in the face of the Egyptian army, Louis wading ashore with his knights. The Egyptian commander, Fakhr al-Din, withdrew that night, the garrison and people of Damietta fled after him, and on 6 June the crusaders occupied the city without a fight. Louis then waited for the Nile flood to pass and for his brother Alphonse of Poitiers to bring reinforcements, and only in November did he march south towards Cairo.": "Le 5 juin 1249, les croisés débarquèrent sur la plage avant Damietta, face à l’armée égyptienne, Louis se baladant à terre avec ses chevaliers. Le commandant égyptien, Fakhr al-Din, se retira cette nuit-là, la garnison et le peuple de Damietta s’enfuirent après lui, et le 6 juin les croisés occupèrent la ville sans se battre. Louis attendait alors que le flot du Nil passe et que son frère Alphonse de Poitiers apporte des renforts, et il ne marcha vers le sud qu’en novembre."
