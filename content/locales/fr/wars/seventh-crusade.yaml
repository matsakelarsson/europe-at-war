# Some French text was translated automatically.
"Seventh Crusade": "Septième croisade"
"The crusade of King Louis IX of France against Ayyubid Egypt, launched after the sack of Jerusalem and the defeat of the Latin East at La Forbie in 1244. Louis took Damietta without a fight in June 1249, but his advance on Cairo was stopped at al-Mansurah in February 1250, and on the retreat his army was destroyed at Fariskur and he was captured. The Mamluk officers who murdered the last Ayyubid sultan of Egypt released him for a ransom and the return of Damietta.": "La croisade du roi Louis IX de France contre l’Egypte ayyoubide, lancée après le sac de Jérusalem et la défaite de l’Orient latin à La Forbie en 1244. Louis prit Damietta sans se battre en juin 1249, mais son avance sur le Caire fut arrêtée à al-Mansurah en février 1250, et lors de la retraite son armée fut détruite à Fariskur et il fut capturé. Les officiers mamelouks qui ont assassiné le dernier sultan ayyoubide d’Egypte l’ont libéré pour une rançon et le retour de Damietta."
"Dates are Julian. The crusade is known in unusual detail from the memoirs of Jean de Joinville, a Champagne nobleman who served Louis and wrote his account decades later, and from Arabic historians.": "Les dates sont Julian. La croisade est connue dans des détails inhabituels des mémoires de Jean de Joinville, un noble champagne qui a servi Louis et a écrit son récit des décennies plus tard, et des historiens arabes."
"The Mamluks were slave soldiers, mostly of Kipchak Turkish origin, bought and trained by the Ayyubid sultan al-Salih Ayyub. After murdering his son Turanshah in May 1250 their commanders ruled Egypt as sultans; the Mamluk Sultanate lasted until 1517.": "Les Mamelouks étaient des esclaves soldats, principalement d’origine turque de Kipchak, achetés et entraînés par le sultan ayyoubid al-Salih Ayyub. Après avoir tué son fils Turanshah en mai 1250, leurs commandants gouvernèrent l’Egypte comme sultans ; le Sultanat mamluk dura jusqu’en 1517."
