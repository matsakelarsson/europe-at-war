"Mansurah and Fariskur": "Mansurah et Fariskur"
"November 1249 – May 1250": "novembre 1249 – mai 1250"
"As the crusaders marched south, al-Salih Ayyub died on 22 November 1249; his widow Shajar al-Durr hid his death, and the army fought on. The crusaders were held up for weeks at the Bahr al-Saghir canal opposite al-Mansurah until a local man showed them a ford. On 8 February 1250 the vanguard crossed and surprised the Egyptian camp, killing Fakhr al-Din, but Louis’s brother Robert of Artois, instead of waiting, charged into al-Mansurah with the Templars. In its narrow streets the Mamluk regiments, among them the future sultan Baibars, killed almost all of them. Louis held the bridgehead against fierce counter-attacks, but could go no further.": "Alors que les croisés marchaient vers le sud, al-Salih Ayyub mourut le 22 novembre 1249 ; sa veuve Shajar al-Durr cacha sa mort, et l’armée combattit. Les croisés furent retenus pendant des semaines au canal Bahr al-Saghir en face d’al-Mansurah jusqu’à ce qu’un homme local leur montre un gué. Le 8 février 1250 l’avant-garde a traversé et surpris le camp égyptien, tuant Fakhr al-Din, mais Louis frère Robert d’Artois, au lieu d’attendre, chargé dans al-Mansurah avec les Templiers. Dans ses rues étroites les régiments mamelouks, parmi eux les futurs sultan Baibars, ont tué presque tous. Louis tenait la tête de pont contre des contre-attaques féroces, mais ne pouvait pas aller plus loin."
"Disease and hunger spread while Egyptian ships cut the crusaders off from Damietta, and the new sultan, Turanshah, arrived from Syria. In April Louis ordered a retreat. On 6 April 1250 at Fariskur the exhausted army was overwhelmed, and Louis, sick with dysentery, was captured with most of his men; many of the sick and wounded prisoners were killed. On 2 May the Mamluk officers murdered Turanshah. They released Louis for a huge ransom, half paid at once, and the return of Damietta, and he went to Acre, where he stayed until 1254 strengthening the coastal towns.": "La maladie et la faim se répandirent alors que les navires égyptiens coupaient les croisés de Damietta, et le nouveau sultan, Turanshah, arriva de Syrie. En avril Louis commanda une retraite. Le 6 avril 1250 à Fariskur l’armée épuisée était débordée, et Louis, malade de dysenterie, fut capturé avec la plupart de ses hommes ; beaucoup des prisonniers malades et blessés furent tués. Le 2 mai, les officiers mamelouks tuèrent Turanshah. Ils relâchèrent Louis pour une énorme rançon, à moitié payée à la fois, et le retour de Damietta, et il alla à Acre, où il resta jusqu’en 1254 renforçant les villes côtières."
