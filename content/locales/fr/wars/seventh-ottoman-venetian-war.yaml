"The Ottomans retake the Morea": "Les Ottomans reprennent la Morea"
"December 1714 – September 1715": "décembre 1714 – septembre 1715"
"At Karlowitz in 1699 the Ottomans had ceded the Morea to Venice, and they were determined to win it back. Victory over Russia in 1711 and the distraction of the other European powers gave them their chance. The pretexts were the seizure of an Ottoman ship and the shelter Venice had given Danilo I, the prince-bishop of Montenegro, after a rising against the Ottomans, and on 9 December 1714 the Sultan declared war. In the spring the grand vizier, Silahdar Damat Ali Pasha, gathered an army of perhaps 70,000 men in Macedonia, while the fleet took Tinos and Aegina, the last Venetian islands in the Aegean.": "À Karlowitz en 1699, les Ottomans avaient cédé la Morea à Venise et ils étaient déterminés à la reconquérir. La victoire sur la Russie en 1711 et la distraction des autres puissances européennes leur donnaient leur chance. Les prétextes étaient la saisie d’un navire ottoman et l’abri Venise avait donné Danilo Ier, le prince-évêque du Monténégro, après une montée contre les Ottomans, et le 9 décembre 1714 le Sultan a déclaré la guerre. Au printemps, le grand vizier, Silahdar Damat Ali Pacha, a rassemblé une armée de quelque 70 000 hommes en Macédoine, tandis que la flotte a pris Tinos et Aegina, les dernières îles vénitiennes de l’Egée."
"Venice had only about 8,000 mercenaries in the Morea, and its Greek subjects, who resented Venetian rule and taxes, supplied the Ottomans. The army crossed the Isthmus of Corinth on 25 June 1715. Acrocorinth surrendered on terms, but Janissaries broke in and killed or enslaved most of the garrison and townspeople. Nafplio, the Venetian capital, fell on 20 July after a mine breached the Palamidi fort. Navarino and Koroni were abandoned and Methoni capitulated, as did Souda and Spinalonga, the last Venetian outposts on Crete. Within a hundred days the whole peninsula was Ottoman again.": "Venise n’avait que 8 000 mercenaires dans la Morea, et ses sujets grecs, qui ignoraient la domination vénitienne et les impôts, fournissaient les Ottomans. L’armée traversait l’isthme de Corinthe le 25 juin 1715. Acrocorinthe se rendit à des conditions, mais Janissaries s’est introduit et a tué ou asservi la plupart des garnisons et des habitants. Navarino et Koroni furent abandonnés et Methoni capitulèrent, tout comme Souda et Spinalonga, les derniers avant-postes vénitiens en Crète. En un siècle, toute la péninsule fut de nouveau ottomane."
