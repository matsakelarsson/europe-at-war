# Some French text was translated automatically.
"Seventh Ottoman–Venetian War": "Septième guerre ottomane-vénitienne"
"The last war between Venice and the Ottoman Empire, in which the Ottomans retook the Peloponnese (the Morea), won by Venice in the 1680s, in a single campaign in 1715, along with Tinos, Aegina and the last Venetian forts on Crete. Venice held Corfu against a siege in 1716 and was saved from worse by Austria’s entry into the war, but at the Peace of Passarowitz in 1718 it kept only the Ionian Islands, Preveza and small gains in Dalmatia.": "La dernière guerre entre Venise et l’Empire ottoman, dans laquelle les Ottomans reprirent le Péloponnèse (la Morea), remportée par Venise dans les années 1680, en une seule campagne en 1715, avec Tinos, Aegina et les derniers forts vénitiens en Crète. Venise a tenu Corfou contre un siège en 1716 et a été sauvé de pire par l’entrée de l’Autriche dans la guerre, mais à la paix de Passarowitz en 1718 il n’a gardé que les îles Ioniennes, Preveza et petits gains en Dalmatie."
"Also called the Second Morean War or, in Croatia, the War of Sinj. The papacy, the Knights of Malta, Portugal, Spain and Tuscany sent ships to help Venice in 1716–1717.": "Aussi appelé la Seconde Guerre de Morée ou, en Croatie, la guerre du Sinj. La papauté, les Chevaliers de Malte, le Portugal, l’Espagne et la Toscane ont envoyé des navires pour aider Venise en 1716-1717."
"Austria’s war against the Ottomans in 1716–1718, with Petrovaradin and Belgrade, is told in the Austro-Turkish War of 1716–1718.": "L’Autriche raconte la guerre contre les Ottomans en 1716–1718, avec Petrovaradin et Belgrade, dans la guerre austro-turque de 1716–1718."
"The size of the Ottoman army in 1715 comes from the journal of the French interpreter Benjamin Brue and may be exaggerated.": "La taille de l’armée ottomane en 1715 provient du journal de l’interprète français Benjamin Brue et peut être exagérée."
