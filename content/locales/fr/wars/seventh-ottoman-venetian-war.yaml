"1716 – July 1718": "1716 – juillet 1718"
"In 1716 the Ottomans turned on the Ionian Islands. They occupied Lefkada and Butrint on the mainland opposite Corfu, and on 8 July landed an army of about 33,000 men on Corfu itself. Count Johann Matthias von der Schulenburg, a German soldier in Venetian service, defended the town with about 8,000 men and beat off several assaults. After a violent storm on 9 August, which the Corfiots credited to their patron saint, Spyridon, and with Austria now in the war and victorious at Petrovaradin, the Ottomans gave up the siege and had left the island by 20 August.": "En 1716, les Ottomans se retournèrent sur les îles Ioniennes. Ils occupèrent Lefkada et Butrint sur le continent face à Corfou, et le 8 juillet ils débarquèrent une armée d’environ 33 000 hommes sur Corfou lui-même. Le comte Johann Matthias von der Schulenburg, soldat allemand au service vénitien, défendit la ville avec environ 8 000 hommes et battit plusieurs attaques. Après une violente tempête le 9 août, que les Corfiots ont créditée à leur saint patron, Spyridon, et avec l’Autriche maintenant dans la guerre et victorieux à Petrovaradin, les Ottomans ont abandonné le siège et avaient quitté l’île au 20 août."
"Austria had renewed its alliance with Venice in April 1716, drawing the main Ottoman effort to the Danube. At sea the Venetian fleet, joined by Portuguese, Maltese and papal ships, fought the Ottomans off Imbros in June 1717 and off Cape Matapan in July without decisive result. Venice took Preveza on the Epirote coast and Imotski in Dalmatia, where Sinj had held out against a siege in 1715. At Passarowitz on 21 July 1718 Venice kept the Ionian Islands, with Kythira, Preveza and its small Dalmatian gains, but gave up the Morea, Tinos, Aegina and the Cretan forts. It was the last war between the two powers.": "L’Autriche avait renouvelé son alliance avec Venise en avril 1716, tirant le principal effort ottoman vers le Danube. En mer, la flotte vénitienne, rejointe par des navires portugais, maltais et papaux, combattit les Ottomans au large d’Imbros en juin 1717 et au large du cap Matapan en juillet sans résultat décisif. À Passarowitz, le 21 juillet 1718, Venise gardait les îles Ioniennes, avec Kythira, Preveza et ses petits gains dalmates, mais abandonnait les forts Morea, Tinos, Aegina et Cretan. C’était la dernière guerre entre les deux puissances."
