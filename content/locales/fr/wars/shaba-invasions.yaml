# French translations of the catalogue text (wave 13); step bodies follow later.
Shaba invasions (Shaba I and Shaba II): Invasions du Shaba (Shaba I et Shaba II)
Two invasions of Zaire’s mining province of Shaba (Katanga) by the Congolese National Liberation Front (FNLC), an army of former Katangese gendarmes and their sons who had gone into exile in Angola after Katanga’s secession ended in 1963 and had fought for the Portuguese and then for the MPLA. In Shaba I (March–May 1977) some 1,600–3,000 FNLC fighters took the towns along the Benguela Railway up to Mutshatsha, near Kolwezi; Mobutu’s army barely resisted, and the invaders were driven out by about 1,500 Moroccan troops flown in by France, with Egyptian pilots and Saudi money. In Shaba II (May 1978) the FNLC crossed through Zambia and seized Kolwezi itself, where hundreds of African and European civilians were killed; French Foreign Legion paratroopers dropped on the town on 19 May and Belgian paratroopers arrived the next day. Mobutu and his Western allies accused Angola, Cuba and the Soviet Union of backing the invasions; Angola and Zaire made peace in 1978, and the FNLC was disarmed.: Deux invasions du Shaba (Katanga), la province minière du Zaïre, par le Front national de libération du Congo (FNLC), une armée d’anciens gendarmes katangais et de leurs fils, partis en exil en Angola après la fin de la sécession katangaise en 1963, qui avaient combattu pour les Portugais puis pour le MPLA. Lors de Shaba I (mars–mai 1977), quelque 1 600 à 3 000 combattants du FNLC prirent les villes situées le long du chemin de fer de Benguela jusqu’à Mutshatsha, près de Kolwezi ; l’armée de Mobutu ne résista guère, et les envahisseurs furent chassés par environ 1 500 soldats marocains acheminés par avion par la France, avec des pilotes égyptiens et des fonds saoudiens. Lors de Shaba II (mai 1978), le FNLC passa par la Zambie et s’empara de Kolwezi même, où des centaines de civils africains et européens furent tués ; des parachutistes de la Légion étrangère française sautèrent sur la ville le 19 mai, et des parachutistes belges arrivèrent le lendemain. Mobutu et ses alliés occidentaux accusèrent l’Angola, Cuba et l’Union soviétique de soutenir les invasions ; l’Angola et le Zaïre firent la paix en 1978, et le FNLC fut désarmé.
