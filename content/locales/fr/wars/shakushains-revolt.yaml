# French translations of the catalogue text (wave 10); step bodies follow later.
Shakushain’s revolt: Révolte de Shakushain
? The largest Ainu rising against Japanese rule in Ezo (Hokkaido). In the 17th century the Tokugawa shogunate gave the Matsumae clan of southern Ezo the sole right to trade with the Ainu, and the Matsumae parcelled the trade out to their retainers at trading posts that set low prices for Ainu goods and fished the salmon rivers. A feud over hunting and fishing grounds on the Shibuchari River (today Shinhidaka) between the Menashikur Ainu under Shakushain and the Sumunkur under Onibishi turned outward when an envoy sent to Matsumae for help died of smallpox on the way home and Ainu came to believe he had been poisoned. In the sixth month of 1669 (summer) Shakushain called on the Ainu to rise, and Ainu from Shiranuka in the east to Mashike in the west attacked trading ships, posts and Japanese hunters; Japanese records count 356 Japanese killed. The Matsumae held the line at Kunnui, the shogunate ordered the Tsugaru, Nanbu and Akita domains to stand by and sent the Matsumae lord’s kinsman Matsumae Yasuhiro to take command, and firearms turned the fighting. In the tenth month (November 1669) Shakushain was invited to peace talks at Pipok (Niikappu) and killed at the banquet, and his fort at Shibuchari was burned the next day. Fighting with other groups went on until 1672. The Ainu had to swear a seven-article oath of obedience to the Matsumae, and the trading-post system was tightened, leaving the Ainu dependent on Japanese merchants.
: Le plus grand soulèvement aïnou contre la domination japonaise à Ezo (Hokkaido). Au XVIIe siècle, le shogunat Tokugawa accorda au clan Matsumae, établi dans le sud d’Ezo, le droit exclusif de commercer avec les Aïnous, et les Matsumae répartirent ce commerce entre leurs vassaux dans des comptoirs qui fixaient de bas prix pour les marchandises aïnoues et pêchaient dans les rivières à saumon. Une querelle sur des territoires de chasse et de pêche le long de la rivière Shibuchari (aujourd’hui Shinhidaka) entre les Aïnous menashikur, menés par Shakushain, et les Sumunkur, menés par Onibishi, finit par se tourner vers l’extérieur quand un émissaire envoyé à Matsumae pour demander de l’aide mourut de la variole sur le chemin du retour et que les Aïnous en vinrent à croire qu’il avait été empoisonné. Au sixième mois de 1669 (en été), Shakushain appela les Aïnous à se soulever, et des Aïnous de Shiranuka, à l’est, jusqu’à Mashike, à l’ouest, attaquèrent des navires marchands, des comptoirs et des chasseurs japonais ; les sources japonaises dénombrent 356 Japonais tués. Les Matsumae tinrent la ligne à Kunnui, le shogunat ordonna aux domaines de Tsugaru, de Nanbu et d’Akita de se tenir prêts et envoya Matsumae Yasuhiro, parent du seigneur de Matsumae, prendre le commandement, et les armes à feu firent basculer les combats. Au dixième mois (novembre 1669), Shakushain fut invité à des pourparlers de paix à Pipok (Niikappu) et tué au cours du banquet, et son fort de Shibuchari fut incendié le lendemain. Les combats avec d’autres groupes se poursuivirent jusqu’en 1672. Les Aïnous durent prêter aux Matsumae un serment d’obéissance en sept articles, et le système des comptoirs fut renforcé, ce qui rendit les Aïnous dépendants des marchands japonais.
