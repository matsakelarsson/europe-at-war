# French translations of the catalogue text (wave 11); step bodies follow later.
Shan conquest of Ava: Conquête d’Ava par les Shans
? The conquest of Ava, the Burmese kingdom of Upper Burma, by the Confederation of Shan States led by Sawlon, the saopha (ruler) of Mohnyin, and its ally Prome, and the rule of Shan kings at Ava until 1555. From the early 1500s Mohnyin’s armies raided ever deeper into Ava’s lands, in 1505–1506 as far south as Dabayin and in 1511 taking Bhamo, while Prome broke away in the south and Toungoo in 1510. Late in 1523 the Confederation and Prome attacked together from north and south; Ava, helped by its loyal Shan ally Hsipaw, was slowly worn down, and on 22 March 1525 the allies sacked the capital. In 1527 they returned and besieged Ava again, and King Shwenankyawshin was killed by a gunshot in the fighting, on 14 March 1527 by one reckoning (others say April). Sawlon made his son Thohanbwa king of Ava, which became in effect another Shan state. In 1533 Sawlon and Thohanbwa sacked Prome, which they accused of failing them, and Sawlon was murdered by his own ministers on the way home. Thohanbwa’s rule is remembered in the chronicles for his hostility to the Buddhist clergy; in 1540 he had 360 monks killed and their manuscripts burned. Many Burmans fled to Toungoo, which grew strong enough to conquer Lower Burma in 1534–1541. Thohanbwa was assassinated by his chief minister in May 1542 and the throne passed to Hkonmaing of Hsipaw; Shan and Burman rulers then contested Ava until Bayinnaung of Toungoo took the city in January 1555.
: La conquête d’Ava, le royaume birman de Haute-Birmanie, par la Confédération des États shans, conduite par Sawlon, saopha (souverain) de Mohnyin, et par son alliée Prome, et le règne de rois shans à Ava jusqu’en 1555. Dès le début des années 1500, les armées de Mohnyin lancèrent des raids toujours plus profonds sur les terres d’Ava, jusqu’à Dabayin au sud en 1505–1506, puis prirent Bhamo en 1511, tandis que Prome faisait sécession dans le sud, et Toungoo en 1510. À la fin de 1523, la Confédération et Prome attaquèrent ensemble par le nord et par le sud ; Ava, aidée par son fidèle allié shan Hsipaw, fut lentement usée, et le 22 mars 1525 les alliés saccagèrent la capitale. En 1527, ils revinrent assiéger Ava, et le roi Shwenankyawshin fut tué d’un coup de feu pendant les combats, le 14 mars 1527 selon un calcul (d’autres disent en avril). Sawlon fit de son fils Thohanbwa le roi d’Ava, qui devint de fait un État shan de plus. En 1533, Sawlon et Thohanbwa saccagèrent Prome, qu’ils accusaient de leur avoir fait défaut, et Sawlon fut assassiné par ses propres ministres sur le chemin du retour. Les chroniques retiennent du règne de Thohanbwa son hostilité envers le clergé bouddhiste ; en 1540, il fit tuer 360 moines et brûler leurs manuscrits. De nombreux Birmans s’enfuirent à Toungoo, qui devint assez puissant pour conquérir la Basse-Birmanie en 1534–1541. Thohanbwa fut assassiné par son premier ministre en mai 1542, et le trône passa à Hkonmaing de Hsipaw ; souverains shans et birmans se disputèrent ensuite Ava jusqu’à ce que Bayinnaung de Toungoo prenne la ville en janvier 1555.
