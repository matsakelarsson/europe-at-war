# French translations of the catalogue text (wave 7); step bodies follow later.
Shaybanid–Timurid wars: Guerres entre Chaybanides et Timourides
The wars in which the Uzbeks under Muhammad Shaybani drove the last Timurid princes out of Central Asia. Shaybani took Samarkand and Bukhara in 1500–1501, beating the young Babur at Sar-e-Pul, defeated the Moghul khans at Akhsi in 1503, conquered Khwarazm and in 1507 took Herat, the last Timurid capital. Babur escaped to Kabul. After Shah Ismail of Persia killed Shaybani at Merv in 1510, Babur, with Persian help, retook Samarkand in 1511, but the Uzbeks beat him at Kul-i Malik in 1512 and destroyed a Persian army at Ghazdewan. Transoxiana stayed Uzbek, and Babur turned towards India.: Les guerres par lesquelles les Ouzbeks de Muhammad Chaybani chassèrent d’Asie centrale les derniers princes timourides. Chaybani prit Samarcande et Boukhara en 1500–1501, battant le jeune Babur à Sar-e-Pul, vainquit les khans du Moghulistan à Akhsi en 1503, conquit le Khwarezm et prit en 1507 Hérat, la dernière capitale timouride. Babur se réfugia à Kaboul. Après que le shah Ismaïl de Perse eut tué Chaybani à Merv en 1510, Babur reprit Samarcande en 1511 avec l’aide des Perses, mais les Ouzbeks le battirent à Kul-i Malik en 1512 et anéantirent une armée persane à Ghazdewan. La Transoxiane resta ouzbèke, et Babur se tourna vers l’Inde.
