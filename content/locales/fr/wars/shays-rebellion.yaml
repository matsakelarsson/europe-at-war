# French translations of the catalogue text (wave 14); step bodies follow later.
Shays’ Rebellion: Rébellion de Shays
? An armed uprising of farmers in western and central Massachusetts against debt collection and taxes after the American Revolution. Many farmers, a large number of them veterans of the war, were deep in debt, and the state, paying off its war debts to creditors in Boston and abroad, levied heavy taxes payable in hard money; courts seized farms and jailed debtors. After petitions failed, armed crowds who called themselves Regulators closed the county courts to stop the foreclosures, beginning at Northampton on 29 August 1786. Governor James Bowdoin raised an army of some 3,000 men under Benjamin Lincoln, paid for largely by Boston merchants. On 25 January 1787 rebels led by Daniel Shays, a former Continental Army captain, and Eli Parsons marched on the federal arsenal at Springfield; the state militia under William Shepard fired cannon into their column, killing four, and they fled. Lincoln surprised and scattered the main rebel force at Petersham on 4 February after a night march through a snowstorm, and a last clash near Sheffield on 27 February left two to four dead, by different counts. About 4,000 men accepted an amnesty; of those condemned to death, two were hanged for robbery in December 1787, and the rest, Shays among them, were pardoned. The voters replaced Bowdoin with John Hancock, and the legislature eased the burden of debt and taxes. The rising alarmed national leaders about the weakness of the government under the Articles of Confederation and added urgency to the Constitutional Convention that met in Philadelphia in May 1787.
: Un soulèvement armé de fermiers de l’ouest et du centre du Massachusetts contre le recouvrement des dettes et les impôts après la Révolution américaine. De nombreux fermiers, dont beaucoup étaient des vétérans de la guerre, étaient lourdement endettés, et l’État, qui remboursait ses dettes de guerre à des créanciers de Boston et de l’étranger, levait de lourds impôts payables en espèces ; les tribunaux saisissaient des fermes et emprisonnaient les débiteurs. Après l’échec des pétitions, des foules armées qui se faisaient appeler les Régulateurs (Regulators) fermèrent les tribunaux des comtés pour empêcher les saisies, à commencer par celui de Northampton le 29 août 1786. Le gouverneur James Bowdoin leva une armée de quelque 3 000 hommes commandée par Benjamin Lincoln, financée en grande partie par des marchands de Boston. Le 25 janvier 1787, des rebelles menés par Daniel Shays, ancien capitaine de l’armée continentale, et par Eli Parsons marchèrent sur l’arsenal fédéral de Springfield ; la milice de l’État, commandée par William Shepard, tira au canon sur leur colonne, tuant quatre hommes, et ils s’enfuirent. Lincoln surprit et dispersa le gros des forces rebelles à Petersham le 4 février, après une marche de nuit dans une tempête de neige, et un dernier affrontement près de Sheffield, le 27 février, fit deux à quatre morts, selon les décomptes. Environ 4 000 hommes acceptèrent une amnistie ; parmi les condamnés à mort, deux furent pendus pour vol en décembre 1787, et les autres, dont Shays, furent graciés. Les électeurs remplacèrent Bowdoin par John Hancock, et la législature allégea le poids des dettes et des impôts. Le soulèvement inquiéta les dirigeants nationaux quant à la faiblesse du gouvernement sous les Articles de la Confédération et rendit plus pressante la Convention constitutionnelle qui se réunit à Philadelphie en mai 1787.
Regulators (Shays’ rebels): Régulateurs (rebelles de Shays)
Massachusetts (state militia and Lincoln’s privately funded army): Massachusetts (milice de l’État et armée de Lincoln financée par des fonds privés)
