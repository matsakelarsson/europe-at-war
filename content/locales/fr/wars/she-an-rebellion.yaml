# French translations of the catalogue text (wave 9); step bodies follow later.
She–An rebellion: Rébellion She-An
A revolt of two Nuosu (Yi) chieftains of the south-west against the Ming, named after She Chongming of Yongning in southern Sichuan and An Bangyan of Shuixi in north-western Guizhou. Ordered to send troops and grain for the war against the Later Jin in Liaodong, She Chongming’s soldiers rose at Chongqing in the autumn of 1621, killed the grand coordinator of Sichuan and proclaimed the state of Daliang; they besieged Chengdu for 102 days but failed to take it. In 1622 An Bangyan, regent of Shuixi, joined the revolt and besieged Guiyang for about ten months, until early 1623; most of the city’s people died of hunger. The Ming retook Chongqing in 1622 and Yongning in 1623, but the war dragged on in the mountains of Guizhou until Zhu Xieyuan’s armies killed She Chongming and An Bangyan in 1629. Shuixi surrendered in 1630. The war drew money and soldiers from the Ming at the time it was fighting the Later Jin in the north-east.: Une révolte de deux chefs nuosu (yi) du Sud-Ouest contre les Ming, qui tire son nom de She Chongming, de Yongning dans le sud du Sichuan, et d’An Bangyan, de Shuixi dans le nord-ouest du Guizhou. Lorsque Yongning reçut l’ordre d’envoyer des troupes et du grain pour la guerre contre les Jin postérieurs au Liaodong, les soldats de She Chongming se soulevèrent à Chongqing à l’automne 1621, tuèrent le grand coordinateur du Sichuan et proclamèrent l’État de Daliang ; ils assiégèrent Chengdu pendant 102 jours sans parvenir à la prendre. En 1622, An Bangyan, régent de Shuixi, rejoignit la révolte et assiégea Guiyang pendant une dizaine de mois, jusqu’au début de 1623 ; la plupart des habitants de la ville moururent de faim. Les Ming reprirent Chongqing en 1622 et Yongning en 1623, mais la guerre se prolongea dans les montagnes du Guizhou jusqu’à ce que les armées de Zhu Xieyuan tuent She Chongming et An Bangyan en 1629. Shuixi se rendit en 1630. La guerre détourna de l’argent et des soldats des Ming au moment même où ils combattaient les Jin postérieurs au nord-est.
