# Some French text was translated automatically.
"Sheikh Said rebellion": "Sheikh Said rébellion"
"A Kurdish rising in south-eastern Turkey in 1925 against the new secular republic, led by the Naqshbandi sheikh Said with the backing of the Kurdish nationalist society Azadî, which spread across the region around Diyarbakır before tens of thousands of troops and aircraft crushed it; Sheikh Said was captured in April and hanged in Diyarbakır with 47 others on 29 June. The government used the rising to pass the Law on the Maintenance of Order, which silenced the opposition press and parties, and historians still debate how far the revolt was nationalist and how far religious.": "Un kurde qui s’élève dans le sud-est de la Turquie en 1925 contre la nouvelle république laïque, dirigée par le Naqshbandi cheikh Said avec le soutien de la société nationaliste kurde Azadî, qui s’étendait sur toute la région autour de Diyarbakır avant que des dizaines de milliers de troupes et d’avions l’écrasent ; Sheikh Said a été capturé en avril et pendu à Diyarbakır avec 47 autres le 29 juin. Le gouvernement a utilisé la montée pour adopter la loi sur le maintien de l’ordre, qui a réduit au silence la presse et les partis d’opposition, et les historiens continuent à débattre jusqu’où la révolte était nationaliste et jusqu’à quel point religieux."
"The rising began at Piran (today Dicle) in February 1925 and failed in an attack on Diyarbakır in March. Villages were destroyed and many people deported in its suppression.": "La montée a commencé à Piran (aujourd'hui Dicle) en février 1925 et a échoué dans une attaque sur Diyarbakır en mars. Les villages ont été détruits et beaucoup de personnes déportées dans sa répression."
