# French translations of the catalogue text (wave 9); step bodies follow later.
Shi Jingtang’s revolt: Révolte de Shi Jingtang
? The revolt of Shi Jingtang, the Shatuo governor of Hedong at Taiyuan, against his brother-in-law Li Congke, emperor of the Later Tang, which he won with the help of the Khitan (Liao) emperor at the price of the Sixteen Prefectures. When Li Congke ordered him moved from Taiyuan in the summer of 936, Shi refused and called on him to abdicate. Besieged in Taiyuan by an imperial army under Zhang Jingda, he asked the Khitan emperor Yelü Deguang (Taizong) for help, promising to treat him as a father and to cede the prefectures along the northern frontier. Deguang came through the passes with about 50,000 horsemen in the autumn, defeated Zhang and trapped the rest of his army at Jin’an, and on 28 November 936 invested Shi as emperor of a new Jin dynasty, the Later Jin. The trapped army surrendered, the relief army of Zhao Dejun was routed at Tuanbo valley, and as Shi advanced on Luoyang Li Congke burned himself to death with his family on 11 January 937. In 938 Shi handed over the Sixteen Prefectures, from Youzhou (Beijing) to Yunzhou (Datong), with the passes that guarded the North China Plain, and promised the Liao a large amount of silk every year.
: La révolte victorieuse de Shi Jingtang, gouverneur shatuo du Hedong à Taiyuan, contre son beau-frère Li Congke, empereur des Tang postérieurs, menée avec l’aide de l’empereur khitan (Liao) au prix des Seize Préfectures. Lorsque Li Congke ordonna son transfert hors de Taiyuan à l’été 936, Shi refusa et le somma d’abdiquer. Assiégé dans Taiyuan par une armée impériale commandée par Zhang Jingda, il demanda l’aide de l’empereur khitan Yelü Deguang (Taizong), en promettant de le traiter comme un père et de lui céder les préfectures de la frontière nord. Deguang franchit les cols à l’automne avec environ 50 000 cavaliers, battit Zhang et enferma le reste de son armée à Jin’an, puis, le 28 novembre 936, investit Shi comme empereur d’une nouvelle dynastie Jin, les Jin postérieurs. L’armée encerclée capitula, l’armée de secours de Zhao Dejun fut mise en déroute dans la vallée de Tuanbo et, tandis que Shi avançait sur Luoyang, Li Congke se donna la mort par le feu avec sa famille le 11 janvier 937. En 938, Shi livra les Seize Préfectures, de Youzhou (Pékin) à Yunzhou (Datong), avec les cols qui protégeaient la plaine de Chine du Nord, et promit aux Liao une grande quantité de soie chaque année.
