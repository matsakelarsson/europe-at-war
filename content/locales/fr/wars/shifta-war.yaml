# French translations of the catalogue text (wave 13); step bodies follow later.
Shifta War: Guerre des Shifta
? "A secessionist war in Kenya’s Northern Frontier District (NFD), where Somalis and many Borana, Gabbra, Rendille and Sakuye pastoralists sought to join the Somali Republic, which backed them. Before independence an informal British inquiry in 1962 found that most of the district’s people wanted union with Somalia, but Britain left the NFD to Kenya. In the weeks before Kenyan independence on 12 December 1963 a few hundred supporters of the Northern Province People’s Progressive Party (NPPPP) took up arms as the Northern Frontier Districts Liberation Movement (NFDLM), attacking police and army posts. Jomo Kenyatta’s government declared a state of emergency on 28 December 1963, created a prohibited zone along the Somali border and, deliberately, called the rebels “shifta”, a Swahili word for bandits, to deny the war its political character; Somalis call the war Gaf Daba. Somalia armed and trained the insurgents, about 1,200 by 1966; Britain gave Kenya military support and Ethiopia signed a defence pact with it in 1964. Neither side could win: the rebels ambushed convoys and laid mines, and the Kenya Army and the paramilitary General Service Unit answered with collective punishment, the confiscation and slaughter of livestock and, in 1966–1967, the forced resettlement of the population into 14 guarded villages (manyattas), which ruined much of the pastoral economy. After Muhammad Haji Ibrahim Egal became Somalia’s prime minister in 1967, Kenya and Somalia signed a memorandum of understanding at Arusha under the chairmanship of Zambia’s President Kenneth Kaunda on 28 October 1967, ending the emergencies on both sides and restoring relations. Kenyan government records put the dead in the thousands; non-governmental organisations reported more than 10,000. Insecurity and cattle raiding went on for years, and the former NFD remained under emergency laws and among Kenya’s poorest regions."
: "Une guerre sécessionniste dans le District de la frontière du Nord (NFD) du Kenya, où les Somalis et de nombreux pasteurs borana, gabbra, rendille et sakuye cherchaient à rejoindre la République de Somalie, qui les soutenait. Avant l’indépendance, une enquête britannique officieuse conclut en 1962 que la majorité des habitants du district souhaitaient l’union avec la Somalie, mais la Grande-Bretagne laissa le NFD au Kenya. Dans les semaines qui précédèrent l’indépendance du Kenya, le 12 décembre 1963, quelques centaines de partisans du Northern Province People’s Progressive Party (NPPPP) prirent les armes sous le nom de Northern Frontier Districts Liberation Movement (NFDLM), attaquant des postes de police et de l’armée. Le gouvernement de Jomo Kenyatta proclama l’état d’urgence le 28 décembre 1963, créa une zone interdite le long de la frontière somalienne et, délibérément, qualifia les rebelles de « shifta », mot swahili désignant des bandits, pour dénier à la guerre son caractère politique ; les Somalis appellent cette guerre Gaf Daba. La Somalie arma et entraîna les insurgés, environ 1 200 en 1966 ; la Grande-Bretagne apporta au Kenya un soutien militaire, et l’Éthiopie signa avec lui un pacte de défense en 1964. Aucun des deux camps ne pouvait l’emporter : les rebelles tendaient des embuscades aux convois et posaient des mines, et l’armée kényane et la General Service Unit paramilitaire répliquèrent par des punitions collectives, la confiscation et l’abattage du bétail et, en 1966–1967, la réinstallation forcée de la population dans 14 villages gardés (manyattas), qui ruina une grande partie de l’économie pastorale. Après que Muhammad Haji Ibrahim Egal fut devenu Premier ministre de la Somalie en 1967, le Kenya et la Somalie signèrent à Arusha, le 28 octobre 1967, sous l’égide du président zambien Kenneth Kaunda, un mémorandum d’entente qui mit fin aux états d’urgence des deux côtés et rétablit les relations. Les archives du gouvernement kényan font état de milliers de morts ; des organisations non gouvernementales en signalèrent plus de 10 000. L’insécurité et les razzias de bétail se poursuivirent pendant des années, et l’ancien NFD resta soumis aux lois d’exception et compta parmi les régions les plus pauvres du Kenya."
