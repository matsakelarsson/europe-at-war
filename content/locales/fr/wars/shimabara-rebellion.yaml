# French translations of the catalogue text (wave 10); step bodies follow later.
Shimabara rebellion: Rébellion de Shimabara
? A rising of peasants, fishermen and former samurai in the Shimabara peninsula and the Amakusa Islands of western Kyushu, the last large armed conflict in Japan until the 1860s. Both areas had once been ruled by Christian lords and had many Christian converts. Their new lords, Matsukura Katsuie of Shimabara and the Terasawa of Karatsu, who held Amakusa, levied crushing taxes during years of crop failure, punished defaulters with torture and persecuted the Christians. On 17 December 1637 the people of the southern Shimabara peninsula killed the local magistrate, and Amakusa rose at the same time. Under a charismatic sixteen-year-old, Amakusa Shirō, the rebels attacked the castles of Tomioka and Hondo on Amakusa and Shimabara Castle, failed to take them and gathered, some 27,000 to 37,000 strong with their families, in the ruined castle of Hara on the Shimabara coast. The shogunate’s first commander, Itakura Shigemasa, was killed in a failed assault; his successor Matsudaira Nobutsuna besieged the castle with about 125,000 men from the Kyushu domains, and the Dutch at Hirado lent cannon and the ship de Ryp to bombard it. When the defenders’ food and powder ran out, the castle was stormed on 12–15 April 1638. Estimates put the rebels and sympathisers killed in the assault and the executions that followed at about 37,000, women and children among them; Amakusa Shirō’s head was displayed at Nagasaki. Matsukura was beheaded for misrule. The shogunate treated the rising as a Christian revolt, expelled the Portuguese in 1639 and tightened its persecution of Christians and its closure of the country.
: Un soulèvement de paysans, de pêcheurs et d’anciens samouraïs dans la péninsule de Shimabara et les îles Amakusa, dans l’ouest de Kyushu, le dernier grand conflit armé au Japon jusqu’aux années 1860. Les deux régions avaient autrefois été gouvernées par des seigneurs chrétiens et comptaient de nombreux convertis. Leurs nouveaux seigneurs, Matsukura Katsuie à Shimabara et les Terasawa de Karatsu, qui tenaient Amakusa, levèrent des impôts écrasants pendant des années de mauvaises récoltes, punirent les mauvais payeurs par la torture et persécutèrent les chrétiens. Le 17 décembre 1637, la population du sud de la péninsule de Shimabara tua le magistrat local, et Amakusa se souleva au même moment. Sous la conduite d’un jeune homme charismatique de seize ans, Amakusa Shirō, les rebelles attaquèrent les châteaux de Tomioka et de Hondo à Amakusa et le château de Shimabara, échouèrent à les prendre et se rassemblèrent, au nombre de quelque 27 000 à 37 000 avec leurs familles, dans le château en ruine de Hara, sur la côte de Shimabara. Le premier commandant envoyé par le shogunat, Itakura Shigemasa, fut tué lors d’un assaut manqué ; son successeur Matsudaira Nobutsuna assiégea le château avec environ 125 000 hommes venus des domaines de Kyushu, et les Néerlandais de Hirado prêtèrent des canons et le navire « de Ryp » pour le bombarder. Lorsque les défenseurs furent à court de vivres et de poudre, le château fut pris d’assaut du 12 au 15 avril 1638. On estime à environ 37 000 le nombre de rebelles et de sympathisants tués lors de l’assaut et des exécutions qui suivirent, parmi lesquels des femmes et des enfants ; la tête d’Amakusa Shirō fut exposée à Nagasaki. Matsukura fut décapité pour mauvaise administration. Le shogunat traita le soulèvement comme une révolte chrétienne, expulsa les Portugais en 1639 et renforça sa persécution des chrétiens et la fermeture du pays.
