# French translations of the catalogue text (wave 10); step bodies follow later.
Shimonoseki campaign: Campagne de Shimonoseki
? Fighting between the Chōshū domain and the navies of the United States, France, the Netherlands and Britain over the Strait of Shimonoseki, the narrow passage between Honshu and Kyushu that links the Inland Sea with the Sea of Japan. In 1863 Emperor Kōmei, under pressure from the radical samurai of the “revere the emperor, expel the barbarians” (sonnō jōi) movement, ordered the shogunate to expel the foreigners by the 10th day of the 5th month (25 June). The shogunate did nothing, but Chōshū, whose lord Mōri Takachika backed the radicals, opened fire from its batteries and steamers on the American steamer Pembroke, the French dispatch boat Kien Chan and the Dutch warship Medusa and closed the strait. The USS Wyoming sank two Chōshū ships on 16 July and a French squadron landed men and wrecked batteries on 20 July, but the strait stayed closed for a year. In September 1864, after Chōshū had been driven from Kyoto, a squadron of nine British, four Dutch and three French warships with an American chartered steamer, about 2,000 men in all, under the British admiral Augustus Kuper, silenced the batteries on 5 September, landed and destroyed them, and forced Chōshū to make peace on 8 September; Takasugi Shinsaku negotiated for the domain. The shogunate had to accept an indemnity of $3,000,000. The defeat turned Chōshū’s leaders from expelling the foreigners to modernising their army with Western arms and overthrowing the shogunate.
: Les combats qui opposèrent le domaine de Chōshū aux marines des États-Unis, de la France, des Pays-Bas et de la Grande-Bretagne pour le détroit de Shimonoseki, l’étroit passage entre Honshu et Kyushu qui relie la mer intérieure de Seto à la mer du Japon. En 1863, l’empereur Kōmei, sous la pression des samouraïs radicaux du mouvement « révérer l’empereur, expulser les barbares » (sonnō jōi), ordonna au shogunat d’expulser les étrangers au plus tard le 10e jour du 5e mois (25 juin). Le shogunat ne fit rien, mais Chōshū, dont le seigneur Mōri Takachika soutenait les radicaux, ouvrit le feu depuis ses batteries et ses vapeurs sur le vapeur américain Pembroke, l’aviso français Kien Chan et le navire de guerre néerlandais Medusa, et ferma le détroit. L’USS Wyoming coula deux navires de Chōshū le 16 juillet et une escadre française débarqua des hommes et détruisit des batteries le 20 juillet, mais le détroit resta fermé pendant un an. En septembre 1864, après que Chōshū eut été chassé de Kyoto, une escadre de neuf navires de guerre britanniques, quatre néerlandais et trois français, accompagnée d’un vapeur affrété par les Américains, soit environ 2 000 hommes en tout, sous le commandement de l’amiral britannique Augustus Kuper, réduisit les batteries au silence le 5 septembre, débarqua et les détruisit, et contraignit Chōshū à faire la paix le 8 septembre ; Takasugi Shinsaku négocia pour le domaine. Le shogunat dut accepter une indemnité de 3 000 000 de dollars. La défaite détourna les dirigeants de Chōshū de l’expulsion des étrangers et les amena à moderniser leur armée avec des armes occidentales et à renverser le shogunat.
