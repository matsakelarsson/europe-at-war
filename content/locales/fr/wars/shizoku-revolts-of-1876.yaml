# French translations of the catalogue text (wave 10); step bodies follow later.
Shinpūren, Akizuki and Hagi rebellions: Rébellions du Shinpūren, d’Akizuki et de Hagi
? Three linked risings of former samurai (shizoku) in western Japan in October and November 1876, provoked by the government’s ban on wearing swords (March 1876) and the forced conversion of samurai stipends into government bonds (August 1876). On the night of 24 October about 170–200 members of the Keishintō, a Shinto league of former Kumamoto samurai known as the Shinpūren (“league of the divine wind”) and led by the priest Otaguro Tomoo, attacked the army garrison and officials in Kumamoto with swords and spears, refusing firearms as foreign. They killed the prefectural governor Yasuoka Ryōsuke, the garrison commander Major General Taneda Masaaki and his chief of staff, and about 60 soldiers and officials, but the garrison rallied by morning; about 124 rebels were killed or took their own lives, Otaguro among them. On 27 October former samurai of Akizuki in Fukuoka Prefecture, led by Miyazaki Kurumanosuke and others, rose in answer to the Kumamoto call, killed police officers and marched out some 200–400 strong; they were scattered by the 14th Infantry Regiment of Kokura under Nogi Maresuke, Miyazaki and other leaders killed themselves, and two were beheaded on 3 December. On 28 October Maebara Issei, a former Chōshū leader and councillor of state, rose at Hagi with about 200 men. Government troops broke the rising within a week. Maebara, sailing for Tokyo, was caught on 5 November at the port of Uryū in Izumo, where bad weather had driven his boat, and on 3 December he and seven other leaders were beheaded. None of the three risings drew in the much larger body of discontented samurai in Satsuma, which rose three months later under Saigō Takamori.
: Trois soulèvements liés d’anciens samouraïs (shizoku) dans l’ouest du Japon en octobre et novembre 1876, provoqués par l’interdiction gouvernementale de porter le sabre (mars 1876) et par la conversion forcée des pensions des samouraïs en obligations d’État (août 1876). Dans la nuit du 24 octobre, quelque 170 à 200 membres du Keishintō, une ligue shintoïste d’anciens samouraïs de Kumamoto connue sous le nom de Shinpūren (« ligue du vent divin ») et dirigée par le prêtre Otaguro Tomoo, attaquèrent la garnison de l’armée et les fonctionnaires de Kumamoto au sabre et à la lance, refusant les armes à feu comme étrangères. Ils tuèrent le gouverneur de la préfecture, Yasuoka Ryōsuke, le commandant de la garnison, le général de division Taneda Masaaki, et son chef d’état-major, ainsi qu’une soixantaine de soldats et de fonctionnaires, mais la garnison se ressaisit au matin ; environ 124 rebelles furent tués ou se donnèrent la mort, Otaguro parmi eux. Le 27 octobre, d’anciens samouraïs d’Akizuki, dans la préfecture de Fukuoka, menés notamment par Miyazaki Kurumanosuke, se soulevèrent en réponse à l’appel de Kumamoto, tuèrent des policiers et se mirent en marche au nombre de quelque 200 à 400 ; ils furent dispersés par le 14e régiment d’infanterie de Kokura sous les ordres de Nogi Maresuke, Miyazaki et d’autres chefs se donnèrent la mort, et deux furent décapités le 3 décembre. Le 28 octobre, Maebara Issei, ancien dirigeant de Chōshū et conseiller d’État, se souleva à Hagi avec environ 200 hommes. Les troupes gouvernementales brisèrent le soulèvement en moins d’une semaine. Maebara, qui faisait voile vers Tokyo, fut arrêté le 5 novembre au port d’Uryū, en Izumo, où le mauvais temps avait poussé son bateau, et le 3 décembre il fut décapité avec sept autres chefs. Aucun des trois soulèvements n’entraîna la masse bien plus nombreuse des samouraïs mécontents de Satsuma, qui se souleva trois mois plus tard sous la conduite de Saigō Takamori.
