# French translations of the catalogue text (wave 8); step bodies follow later.
Siachen conflict: Conflit du Siachen
? The war between India and Pakistan for the Siachen Glacier and the Saltoro Ridge in the eastern Karakoram, the highest battlefield in the world, where posts stand at more than 6,000 metres. The ceasefire line of 1949 and the Line of Control of 1972 ended at a map point called NJ9842, leaving the glaciers to the north undemarcated. In the 1970s Pakistan allowed foreign mountaineering expeditions into the area and many maps drew the line north-east to the Karakoram Pass, which India saw as a claim to the glaciers. In April 1984, in Operation Meghdoot, India flew troops onto the glacier and seized the main passes of the Saltoro Ridge just before Pakistani troops could reach them. Pakistan tried several times to dislodge them, most seriously in 1987, and the two armies fought artillery duels and assaults on each other’s posts until a ceasefire in November 2003. Far more soldiers died of cold, altitude sickness and avalanches than of enemy fire; estimates put the dead of both sides at about 2,000 by 2003, and many more have died since. India still holds the glacier and the main ridge, and talks on demilitarising the area have failed.
: La guerre entre l’Inde et le Pakistan pour le glacier de Siachen et la crête de Saltoro, dans l’est du Karakoram, le champ de bataille le plus élevé du monde, où des postes se trouvent à plus de 6 000 mètres d’altitude. La ligne de cessez-le-feu de 1949 et la ligne de contrôle de 1972 s’arrêtaient à un point cartographique appelé NJ9842, laissant sans délimitation les glaciers situés au nord. Dans les années 1970, le Pakistan autorisa des expéditions d’alpinisme étrangères dans la région, et de nombreuses cartes prolongeaient la ligne vers le nord-est jusqu’au col du Karakoram, ce que l’Inde considéra comme une revendication sur les glaciers. En avril 1984, lors de l’opération Meghdoot, l’Inde transporta des troupes par voie aérienne sur le glacier et s’empara des principaux cols de la crête de Saltoro peu avant que les troupes pakistanaises ne puissent les atteindre. Le Pakistan tenta à plusieurs reprises de les déloger, le plus sérieusement en 1987, et les deux armées s’affrontèrent en duels d’artillerie et en assauts contre leurs postes respectifs jusqu’à un cessez-le-feu en novembre 2003. Le froid, le mal des montagnes et les avalanches tuèrent bien plus de soldats que le feu ennemi ; selon les estimations, les deux camps comptaient environ 2 000 morts en 2003, et beaucoup d’autres ont péri depuis. L’Inde tient toujours le glacier et la crête principale, et les négociations sur la démilitarisation de la zone ont échoué.
