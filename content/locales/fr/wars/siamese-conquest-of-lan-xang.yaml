# French translations of the catalogue text (wave 11); step bodies follow later.
Siamese conquest of Vientiane and Champasak (Lao–Siamese War): Conquête siamoise de Vientiane et de Champassak (guerre lao-siamoise)
? The campaign in which Taksin’s Siam brought the three Lao kingdoms that had succeeded Lan Xang under its overlordship. King Ong Boun of Vientiane had invited the Burmese against his rival Luang Prabang in 1764–1765 and was suspected of siding with Burma; in 1777–1778 his troops killed Phra Vo, a Lao noble who had broken away and put himself under Siamese protection. In December 1778 Chaophraya Chakri (the later King Rama I) marched from Nakhon Ratchasima with about 20,000 men and beat the Lao at Nong Bua Lamphu, while his brother Chaophraya Surasi raised some 10,000 Cambodian troops at Oudong, took a fleet up the Mekong, dug a channel round the Liphi falls and took Champasak, whose king Sayakumane was captured and sent to Thonburi. Nakhon Phanom fell in March 1779. King Surinyavong of Luang Prabang, Vientiane’s enemy, joined the Siamese. Chakri and Surasi besieged Vientiane from April 1779; Ong Boun escaped by boat to Khamkeut, and the city fell after a siege of several months, on 28 September 1779 by one account. The Siamese carried off the Emerald Buddha and the Phra Bang image and deported tens of thousands of Lao to central Siam. Vientiane, Luang Prabang and Champasak remained Siamese tributaries until the French took most of Laos in 1893.
: La campagne par laquelle le Siam de Taksin plaça sous sa suzeraineté les trois royaumes lao qui avaient succédé au Lan Xang. Le roi Ong Boun de Vientiane avait appelé les Birmans contre son rival Luang Prabang en 1764–1765 et était soupçonné de prendre le parti de la Birmanie ; en 1777–1778, ses troupes tuèrent Phra Vo, un noble lao qui avait fait sécession et s’était placé sous la protection siamoise. En décembre 1778, Chaophraya Chakri (le futur roi Rama Ier) partit de Nakhon Ratchasima avec environ 20 000 hommes et battit les Lao à Nong Bua Lamphu, tandis que son frère Chaophraya Surasi levait quelque 10 000 soldats cambodgiens à Oudong, remontait le Mékong avec une flotte, faisait creuser un canal pour contourner les chutes de Liphi et prenait Champassak, dont le roi Sayakumane fut capturé et envoyé à Thonburi. Nakhon Phanom tomba en mars 1779. Le roi Surinyavong de Luang Prabang, ennemi de Vientiane, se joignit aux Siamois. Chakri et Surasi assiégèrent Vientiane à partir d’avril 1779 ; Ong Boun s’échappa en bateau vers Khamkeut, et la ville tomba après un siège de plusieurs mois, le 28 septembre 1779 selon un récit. Les Siamois emportèrent le Bouddha d’émeraude et la statue du Phra Bang et déportèrent des dizaines de milliers de Lao vers le centre du Siam. Vientiane, Luang Prabang et Champassak restèrent tributaires du Siam jusqu’à ce que les Français prennent la plus grande partie du Laos en 1893.
