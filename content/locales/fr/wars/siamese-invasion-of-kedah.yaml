# French translations of the catalogue text (wave 11); step bodies follow later.
Siamese invasion of Kedah: Invasion siamoise du Kedah
? Siam’s conquest of the Malay sultanate of Kedah in November 1821 and the twenty years of resistance that followed. Kedah had long sent Siam the bunga mas, the gold and silver flowers of submission, but Sultan Ahmad Tajuddin Halim Shah II was suspected of dealing with Siam’s enemy Burma and refused a summons to Bangkok. Chaophraya Nakhon Noi, the Siamese governor of Nakhon Si Thammarat (Ligor), took Kedah by surprise with about 7,000 men; the sultan fled to the British at Penang, and about 10,000 Kedahans followed him into British territory. Siam ruled Kedah directly through Nakhon Noi’s son, and the British, who had refused the sultan help, accepted Siam’s claim in the Burney Treaty of 1826. Kedah princes rose in 1831 and in 1838–1839, joined by risings in Pattani, the Malay kingdom Siam had divided into seven provinces; each time Siamese forces retook the country, in 1838 with a British blockade of the coast. In 1839–1843 Siam cut Perlis and Kubang Pasu out of Kedah under rulers of their own, and in 1842 it restored the old sultan to the rest of Kedah as its vassal.
: La conquête du sultanat malais du Kedah par le Siam en novembre 1821 et les vingt années de résistance qui suivirent. Le Kedah envoyait depuis longtemps au Siam le bunga mas, les fleurs d’or et d’argent signifiant sa soumission, mais le sultan Ahmad Tajuddin Halim Shah II était soupçonné de traiter avec la Birmanie, ennemie du Siam, et refusa de se rendre à une convocation à Bangkok. Chaophraya Nakhon Noi, gouverneur siamois de Nakhon Si Thammarat (Ligor), s’empara du Kedah par surprise avec environ 7 000 hommes ; le sultan s’enfuit chez les Britanniques à Penang, et environ 10 000 habitants du Kedah le suivirent en territoire britannique. Le Siam gouverna directement le Kedah par l’intermédiaire du fils de Nakhon Noi, et les Britanniques, qui avaient refusé leur aide au sultan, reconnurent les prétentions du Siam dans le traité Burney de 1826. Des princes du Kedah se soulevèrent en 1831 et en 1838–1839, rejoints par des soulèvements à Pattani, le royaume malais que le Siam avait divisé en sept provinces ; chaque fois, les forces siamoises reprirent le pays, en 1838 avec le concours d’un blocus britannique de la côte. En 1839–1843, le Siam détacha du Kedah le Perlis et le Kubang Pasu, confiés à leurs propres souverains, et en 1842 il rendit le reste du Kedah à l’ancien sultan, désormais son vassal.
