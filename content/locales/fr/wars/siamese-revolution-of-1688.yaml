# French translations of the catalogue text (wave 11); step bodies follow later.
Siamese revolution of 1688: Révolution siamoise de 1688
? The coup in which Phetracha, commander of King Narai’s elephant corps, seized power in Siam and drove out the French garrisons that Narai had admitted. Narai’s Greek minister Constantine Phaulkon had brought a French expedition to Siam in 1687, whose troops held fortresses at Bangkok, guarding the river to Ayutthaya, and at Mergui. With Narai gravely ill, Phetracha, backed by much of the court and the Buddhist clergy, took over the palace at Lopburi on 17–18 May 1688 and arrested the king. Phaulkon was beheaded on 5 June and Narai’s adopted son and his brothers were killed; Narai died in July, and Phetracha was crowned on 1 August. About 40,000 Siamese troops with more than a hundred cannon besieged the 200 French in Bangkok for four months, while the Mergui garrison escaped by sea under fire. Neither side could win, and on 13 November 1688 the French under General Desfarges sailed for Pondicherry under a negotiated agreement. Siam renewed its treaty with the Dutch East India Company the next day and kept the Western powers at a distance for a century and a half.
: Le coup d’État par lequel Phetracha, commandant du corps des éléphants du roi Narai, s’empara du pouvoir au Siam et chassa les garnisons françaises que Narai avait admises. Le ministre grec de Narai, Constantin Phaulkon, avait fait venir au Siam en 1687 une expédition française, dont les troupes tenaient des forteresses à Bangkok, qui gardait le fleuve menant à Ayutthaya, et à Mergui. Alors que Narai était gravement malade, Phetracha, soutenu par une grande partie de la cour et du clergé bouddhique, s’empara du palais de Lopburi les 17 et 18 mai 1688 et fit arrêter le roi. Phaulkon fut décapité le 5 juin, et le fils adoptif de Narai ainsi que ses frères furent tués ; Narai mourut en juillet, et Phetracha fut couronné le 1er août. Environ 40 000 soldats siamois dotés de plus d’une centaine de canons assiégèrent les 200 Français de Bangkok pendant quatre mois, tandis que la garnison de Mergui s’échappait par la mer sous le feu. Aucun des deux camps ne pouvant l’emporter, les Français du général Desfarges appareillèrent pour Pondichéry le 13 novembre 1688 en vertu d’un accord négocié. Le Siam renouvela son traité avec la Compagnie néerlandaise des Indes orientales dès le lendemain et tint les puissances occidentales à distance pendant un siècle et demi.
