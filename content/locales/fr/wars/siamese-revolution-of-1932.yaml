# French translations of the catalogue text (wave 11); step bodies follow later.
Siamese revolution of 1932 and the Boworadet rebellion: Révolution siamoise de 1932 et rébellion de Boworadet
? The end of absolute monarchy in Siam and the royalist attempt to undo it. The People’s Party (Khana Ratsadon) was founded in Paris in February 1927 by seven Siamese students and officers, among them the lawyer Pridi Banomyong and the army officer Plaek Phibunsongkhram, and later joined by senior officers led by Phraya Phahon Phonphayuhasena and Phraya Songsuradet. At dawn on 24 June 1932, while King Prajadhipok was at the seaside palace of Hua Hin, they took control of Bangkok, held Prince Paribatra and other royal officials hostage and announced the end of absolute rule at the Royal Plaza. The seizure of power was almost bloodless. The king returned to Bangkok on 26 June and signed a temporary charter on 27 June, and a permanent constitution, which restored some royal powers, on 10 December 1932. Quarrels over Pridi’s economic plan led the prime minister, Phraya Manopakorn Nititada, to close the assembly in April 1933, and Phraya Phahon removed him in a second coup on 20 June 1933. On 11 October 1933 Prince Boworadet, a former minister of defence, led garrisons from Nakhon Ratchasima and other provinces in a royalist rising; they took Don Mueang airfield north of Bangkok, but the navy stayed neutral and government troops under Phibun retook the airfield on 16 October and beat the rebels at Hin Lap on 23 October, where their commander Phraya Si Sitthisongkhram was killed. Boworadet fled to French Indochina on 25 October. Many rebels were jailed but none was executed. The failure strengthened the People’s Party and Phibun’s career, and King Prajadhipok, who had left for Europe, abdicated on 2 March 1935.
: La fin de la monarchie absolue au Siam et la tentative royaliste de la rétablir. Le Parti du peuple (Khana Ratsadon) fut fondé à Paris en février 1927 par sept étudiants et officiers siamois, parmi lesquels le juriste Pridi Banomyong et l’officier de l’armée de terre Plaek Phibunsongkhram, puis rejoint par des officiers supérieurs menés par Phraya Phahon Phonphayuhasena et Phraya Songsuradet. À l’aube du 24 juin 1932, alors que le roi Prajadhipok séjournait au palais balnéaire de Hua Hin, ils prirent le contrôle de Bangkok, retinrent en otages le prince Paribatra et d’autres dignitaires royaux et proclamèrent la fin du pouvoir absolu sur la place Royale. La prise du pouvoir se fit presque sans effusion de sang. Le roi rentra à Bangkok le 26 juin et signa le 27 juin une charte provisoire, puis, le 10 décembre 1932, une constitution permanente qui rétablissait certains pouvoirs royaux. Les querelles autour du plan économique de Pridi conduisirent le Premier ministre, Phraya Manopakorn Nititada, à fermer l’Assemblée en avril 1933, et Phraya Phahon l’écarta par un second coup d’État le 20 juin 1933. Le 11 octobre 1933, le prince Boworadet, ancien ministre de la Défense, entraîna les garnisons de Nakhon Ratchasima et d’autres provinces dans un soulèvement royaliste ; les rebelles prirent l’aérodrome de Don Mueang, au nord de Bangkok, mais la marine resta neutre, et les troupes gouvernementales commandées par Phibun reprirent l’aérodrome le 16 octobre et les battirent à Hin Lap le 23 octobre, où leur chef, Phraya Si Sitthisongkhram, fut tué. Boworadet s’enfuit en Indochine française le 25 octobre. De nombreux rebelles furent emprisonnés, mais aucun ne fut exécuté. Cet échec renforça le Parti du peuple et la carrière de Phibun, et le roi Prajadhipok, parti pour l’Europe, abdiqua le 2 mars 1935.
