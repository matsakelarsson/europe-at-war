# French translations of the catalogue text (wave 11); step bodies follow later.
Siamese–Vietnamese wars over Cambodia: Guerres siamo-vietnamiennes pour le Cambodge
Two wars between Siam and Vietnam for control of Cambodia, whose kings had long paid tribute to both. In November 1833, with southern Vietnam in revolt under Lê Văn Khôi, Rama III sent armies under Chaophraya Bodindecha into Cambodia and a fleet against Hà Tiên. The Siamese drove the pro-Vietnamese king Ang Chan from Phnom Penh, but were beaten on the Vàm Nao channel in January 1834 and withdrew. Vietnam then ruled most of Cambodia directly as the province of Trấn Tây, with Ang Chan’s daughter Ang Mey as a figurehead queen. Its attempts to remake Cambodian government and customs on the Vietnamese model provoked a general Cambodian rising in 1840, and Siam invaded again with Prince Ang Duong. Vietnam withdrew in 1841, returned in 1845 and besieged the Siamese at Oudong, and in December 1845 both sides agreed that Ang Duong should rule as a vassal of both courts. He was invested by Vietnam in 1847 and crowned by Siam in 1848.: Deux guerres entre le Siam et le Vietnam pour le contrôle du Cambodge, dont les rois payaient depuis longtemps tribut aux deux pays. En novembre 1833, alors que le sud du Vietnam était en révolte sous Lê Văn Khôi, Rama III envoya au Cambodge des armées commandées par Chaophraya Bodindecha et une flotte contre Hà Tiên. Les Siamois chassèrent de Phnom Penh le roi pro-vietnamien Ang Chan, mais furent battus sur le canal de Vàm Nao en janvier 1834 et se retirèrent. Le Vietnam gouverna alors directement la majeure partie du Cambodge, devenue la province de Trấn Tây, avec la fille d’Ang Chan, Ang Mey, comme reine de façade. Ses tentatives pour refaçonner le gouvernement et les coutumes du Cambodge sur le modèle vietnamien provoquèrent un soulèvement général des Cambodgiens en 1840, et le Siam envahit de nouveau le pays avec le prince Ang Duong. Le Vietnam se retira en 1841, revint en 1845 et assiégea les Siamois à Oudong, et en décembre 1845 les deux camps convinrent qu’Ang Duong régnerait en vassal des deux cours. Il fut investi par le Vietnam en 1847 et couronné par le Siam en 1848.
