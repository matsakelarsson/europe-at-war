# French translations of the catalogue text (wave 7); step bodies follow later.
Siege of Baghdad (1258): Siège de Bagdad (1258)
The Mongol conquest of Baghdad, capital of the Abbasid caliphate for five hundred years. After destroying the Nizari Ismailis, Hülegü demanded that the caliph al-Musta’sim submit; the caliph refused, and in the winter of 1257–1258 Mongol armies converged on Iraq from three directions. A caliphal army was destroyed by flooding near the Dujayl canal on 17 January, the city was surrounded, and after the walls were breached the caliph surrendered on 10 February. The Mongols sacked Baghdad for about a week and killed a great many of its people; the caliph was executed on 20 February. The fall of Baghdad ended the Abbasid caliphate there and made Iraq a province of the new Mongol Ilkhanate.: La conquête mongole de Bagdad, capitale du califat abbasside depuis cinq cents ans. Après avoir détruit les ismaéliens nizarites, Houlagou exigea la soumission du calife al-Musta’sim ; celui-ci refusa et, durant l’hiver 1257–1258, des armées mongoles convergèrent sur l’Irak depuis trois directions. Une armée du calife fut anéantie par une inondation près du canal du Dujayl le 17 janvier, la ville fut encerclée et, une fois les murailles percées, le calife se rendit le 10 février. Les Mongols pillèrent Bagdad pendant environ une semaine et tuèrent un très grand nombre de ses habitants ; le calife fut exécuté le 20 février. La chute de Bagdad mit fin au califat abbasside dans cette ville et fit de l’Irak une province du nouvel Ilkhanat mongol.
