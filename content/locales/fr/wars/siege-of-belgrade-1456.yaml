"June – 14 July 1456": "juin – 14 juillet 1456"
"After campaigns against the Serbian despotate in 1454 and 1455, Mehmed II marched on Belgrade, the “key to Hungary”, which Hunyadi had strengthened at his own expense. The sultan brought a large army, many heavy cannon cast for the campaign and a fleet of river boats to close the Danube. The fortress, on a headland between the two rivers, was held by Hunyadi’s brother-in-law Michael Szilágyi with a few thousand men. Meanwhile the Franciscan friar John of Capistrano preached the crusade in Hungary, and thousands of peasants, townsmen and minor nobles, poorly armed but eager, gathered with Hunyadi at Zemun on the opposite bank.": "Après des campagnes contre le despotat serbe en 1454 et 1455, Mehmed II marcha sur Belgrade, le -key vers la Hongrie, que Hunyadi avait renforcé à ses propres frais. Le sultan apporta une grande armée, beaucoup de canons lourds pour la campagne et une flotte de bateaux de rivière pour fermer le Danube. La forteresse, sur un cap entre les deux rivières, était tenue par le beau-frère de Hunyadis Michael Szilágyi avec quelques milliers d’hommes. Pendant ce temps, le frère franciscain Jean de Capistrano prêchait la croisade en Hongrie, et des milliers de paysans, de citadins et de nobles mineurs, mal armés mais avides, se réunissaient avec Hunyadi à Zemun sur la rive opposée."
"From 4 July the Ottoman guns battered the walls. Hunyadi gathered boats along the Danube, and on 14 July, attacked from upstream by his flotilla and from the fortress by about forty vessels manned by Serbian boatmen, the Ottoman fleet was broken after five hours of fighting; several large galleys were sunk and others captured. Hunyadi could now bring his troops and supplies into the fortress.": "À partir du 4 juillet, les canons ottomans ont frappé les murs. Hunyadi a rassemblé des bateaux le long du Danube, et le 14 juillet, attaqué depuis l’amont par sa flottille et depuis la forteresse par une quarantaine de navires habités par des bateliers serbes, la flotte ottomane a été brisée après cinq heures de combats ; plusieurs grandes galères ont été coulés et d’autres capturés."
