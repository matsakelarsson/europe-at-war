"Siege of Belgrade, 1456": "Siège de Belgrade, 1456"
"Mehmed II’s attempt, three years after taking Constantinople, to capture Belgrade, Hungary’s great fortress where the Sava meets the Danube. Defended by Michael Szilágyi and relieved by John Hunyadi’s fleet and an army of crusaders raised by the friar John of Capistrano, the fortress beat off a general assault on 21–22 July, and a sortie the next day overran the Ottoman guns. The sultan, wounded, withdrew, and Ottoman expansion into Hungary was checked for some seventy years.": "Mehmed II's tente, trois ans après avoir pris Constantinople, de capturer Belgrade, la grande forteresse de Hongrie où la Save rencontre le Danube. Défendue par Michael Szilágyi et relevée par la flotte de John Hunyadis et une armée de croisés élevée par le frère Jean de Capistrano, la forteresse battait un assaut général les 21-22 juillet, et une sortie le lendemain surpassait les canons ottomans. Le sultan, blessé, retiré, et l’expansion ottomane en Hongrie a été contrôlée pendant environ soixante-dix ans."
"Numbers vary widely. The garrison had perhaps 5,000–7,000 men, and Hunyadi brought a larger relief force, many of them peasant crusaders. Modern estimates of the Ottoman army range from about 30,000 to 60,000 or more, with dozens of cannon and a river fleet.": "La garnison comptait peut-être entre 5 000 et 7 000 hommes, et Hunyadi apportait une force de secours plus importante, dont beaucoup étaient des croisés paysans. Les estimations modernes de l’armée ottomane vont d’environ 30 000 à 60 000 personnes ou plus, avec des dizaines de canons et une flotte fluviale."
"Pope Callixtus III’s order that church bells be rung at noon to pray for the defenders is often said to commemorate the victory; in fact it was issued before the battle. The story of Titusz Dugovics, who is said to have thrown himself from the walls with a Turkish standard-bearer, is a later legend.": "On dit souvent que le pape Callixtus III a ordonné que les cloches de l’église soient sonnées à midi pour prier pour les défenseurs pour commémorer la victoire ; en fait, elle a été émise avant la bataille. L’histoire de Titusz Dugovics, qui se serait jeté des murs avec un porte-normes turc, est une légende ultérieure."
