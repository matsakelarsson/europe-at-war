"21 July – 11 August 1456": "21 juillet – 11 août 1456"
"On the evening of 21 July Mehmed launched a general assault that went on all night. The janissaries broke into the lower town and climbed towards the citadel, but the defenders threw down burning wood and tar, and a wall of fire cut off those inside the walls from their comrades. The janissaries trapped inside were killed, and the attack outside the walls was beaten off with heavy losses.": "Dans la soirée du 21 juillet, Mehmed a lancé une attaque générale qui s’est déroulée toute la nuit. Les janissaires ont fait irruption dans la ville inférieure et ont grimpé vers la citadelle, mais les défenseurs ont jeté le bois et le goudron brûlants, et un mur de feu a coupé ceux à l’intérieur des murs de leurs camarades."
"On 22 July crusaders slipped out against orders to skirmish with the Ottomans, and others followed until Capistrano, unable to call them back, led them across the Sava against the Ottoman flank, while Hunyadi charged out of the fortress and seized the Ottoman guns. Mehmed fought in person and was wounded, and the Ottomans recovered their camp, but that night they withdrew, leaving much of their artillery and baggage behind. Plague broke out in the Christian camp; Hunyadi died of it at Zemun on 11 August, and Capistrano in October.": "Le 22 juillet, des croisés ont glissé contre les ordres d’escarmouvoir avec les Ottomans, et d’autres ont suivi jusqu’à ce que Capistrano, incapable de les rappeler, les conduise à travers la Sava contre le flanc ottoman, tandis que Hunyadi charge de la forteresse et saisit les canons ottomans. Mehmed combattit en personne et fut blessé, et les Ottomans récupérèrent leur camp, mais cette nuit-là ils se retiraient, laissant une grande partie de leur artillerie et de leurs bagages derrière eux. La peste a éclaté dans le camp chrétien ; Hunyadi en est mort à Zemun le 11 août, et Capistrano en octobre."
