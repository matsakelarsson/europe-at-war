# Some French text was translated automatically.
"Siege of Constantinople, 1394–1402": "Siège de Constantinople, 1394–1402"
"The long blockade of Constantinople by Sultan Bayezid I. By 1391 Ottoman conquests had cut the city off from its hinterland, and after Emperor Manuel II refused to come to him as a vassal, Bayezid built the castle of Anadolu Hisarı (Güzelce Hisar) on the Asian shore of the Bosporus and tried to starve the city into surrender, by land and less effectively by sea. The Crusade of Nicopolis, launched partly to relieve it, was destroyed in 1396. In 1399 Marshal Boucicaut arrived with about 1,200 French soldiers but could do little, and in December Manuel left the city to seek help in Venice, Paris and London, leaving his nephew John VII in charge. The siege ended when Timur invaded Anatolia and defeated and captured Bayezid at Ankara in July 1402.": "Le long blocus de Constantinople par Sultan Bayezid I. En 1391, les conquêtes ottomanes avaient coupé la ville de son arrière-pays et après que l’empereur Manuel II eut refusé de venir à lui en vassal, Bayezid construisit le château d’Anadolu Hisarı (Güzelce Hisar) sur la rive asiatique du Bospore et tenta de faire mourir de faim la ville, par terre et moins efficacement par mer. La croisade de Nicopolis, lancée en partie pour la soulager, fut détruite en 1396. En 1399, le maréchal Boucicaut arriva avec environ 1 200 soldats français mais ne put faire peu, et en décembre Manuel quitta la ville pour chercher de l’aide à Venise, Paris et Londres, laissant son neveu John VII en charge."
"The start of the blockade is dated to 1394 in most accounts; Anadolu Hisarı was built in 1394 or 1395. After Bayezid’s defeat, the Treaty of Gallipoli (1403) gave Thessalonica and some of the coast back to Byzantium.": "Le début du blocus est daté de 1394 dans la plupart des comptes ; Anadolu Hisarı a été construit en 1394 ou 1395. Après la défaite de Bayezid, le traité de Gallipoli (1403) a donné Thessalonique et une partie de la côte à Byzance."
