# French translations of the catalogue text (wave 9); step bodies follow later.
Siege of Fort Zeelandia: Siège du fort Zeelandia
The Ming loyalist commander Zheng Chenggong (Koxinga) took Taiwan from the Dutch East India Company (VOC) in 1661–1662. Defeated before Nanjing in 1659 and squeezed by the Qing on the Fujian coast, he needed a new base. On 30 April 1661 his fleet of several hundred junks, carrying about 25,000 men, slipped through the shallow Luermen channel into the bay behind Tayouan, landed on the main island, routed a Dutch sortie and forced Fort Provintia to surrender within days. Governor Frederick Coyett held Fort Zeelandia, the Company’s castle on the Tayouan sandbar, through a nine-month siege. A relief fleet from Batavia failed to break the blockade, and after a deserter showed Koxinga how to take the Utrecht redoubt overlooking the castle, Coyett surrendered on 1 February 1662. Koxinga made Taiwan the seat of a Zheng state, later called the Kingdom of Tungning, and died there in June 1662.: Le commandant loyaliste Ming Zheng Chenggong (Koxinga) prit Taïwan à la Compagnie néerlandaise des Indes orientales (VOC) en 1661–1662. Battu devant Nankin en 1659 et pressé par les Qing sur la côte du Fujian, il avait besoin d’une nouvelle base. Le 30 avril 1661, sa flotte de plusieurs centaines de jonques, transportant environ 25 000 hommes, se glissa par le chenal peu profond de Luermen dans la baie située derrière Tayouan, débarqua sur l’île principale, mit en déroute une sortie néerlandaise et contraignit le fort Provintia à se rendre en quelques jours. Le gouverneur Frederick Coyett tint le fort Zeelandia, le château de la Compagnie sur le banc de sable de Tayouan, pendant un siège de neuf mois. Une flotte de secours venue de Batavia ne parvint pas à briser le blocus et, après qu’un déserteur eut montré à Koxinga comment prendre la redoute d’Utrecht qui dominait le château, Coyett capitula le 1er février 1662. Koxinga fit de Taïwan le siège d’un État des Zheng, appelé plus tard royaume de Tungning, et y mourut en juin 1662.
