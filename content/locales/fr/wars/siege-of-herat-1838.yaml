# French translations of the catalogue text (wave 7); step bodies follow later.
Siege of Herat: Siège d’Hérat
Mohammad Shah Qajar’s attempt to take Herat, held since 1818 by the last Sadozai prince, Kamran Shah, and his vizier Yar Mohammad Khan Alakozai. Iran regarded Herat as part of Khorasan, and Herati and Turkmen raids had laid waste the frontier. Encouraged by the Russian envoy Count Simonich and opposed by the British, the shah took the fort of Ghurian and besieged Herat from November 1837. The city, helped by a young British officer, Eldred Pottinger, and by a Sunni confederacy of Aimaq, Hazara, Uzbek and Turkmen tribes, held out for ten months and beat off a general assault on 24 June 1838. Britain occupied Kharg Island in the Gulf and threatened war, and on 9 September 1838 the shah lifted the siege. The crisis was the immediate occasion of the First Anglo-Afghan War.: La tentative de Mohammad Shah Qadjar de prendre Hérat, tenue depuis 1818 par le dernier prince sadozai, Kamran Shah, et son vizir Yar Mohammad Khan Alakozai. L’Iran considérait Hérat comme une partie du Khorassan, et les razzias des Hératis et des Turkmènes avaient dévasté la frontière. Encouragé par l’envoyé russe, le comte Simonich, et malgré l’opposition des Britanniques, le shah prit le fort de Ghurian et assiégea Hérat à partir de novembre 1837. La ville, aidée par un jeune officier britannique, Eldred Pottinger, et par une confédération sunnite de tribus aïmaq, hazaras, ouzbèkes et turkmènes, tint dix mois et repoussa un assaut général le 24 juin 1838. La Grande-Bretagne occupa l’île de Kharg, dans le Golfe, et menaça d’entrer en guerre, et le 9 septembre 1838 le shah leva le siège. La crise fut le déclencheur immédiat de la première guerre anglo-afghane.
