# French translations of the catalogue text (wave 8); step bodies follow later.
Siege of Hooghly: Siège de Hooghly
? The Mughal siege and capture of Hooghly (Hugli), the Portuguese trading town on the Hooghly river in western Bengal. The Portuguese settlement had grown from about 1579 into the chief port of Bengal, but Mughal officials accused its people of evading customs, of piracy and of raiding the delta for slaves, often together with the Arakanese, and of converting people by force. Shah Jahan, who is said also to have resented the Portuguese for refusing him help when he was a rebel prince in Bengal, ordered the governor of Bengal, Qasim Khan Juvayni, to take it. A large Mughal army and fleet laid siege to the town from 24 June 1632. The garrison of about 300 Portuguese and some 700 Indian Christians held out for about three months, until the Mughals blew a breach with a mine and stormed it in September (Banglapedia gives 13 September, other accounts 24 September). Many were killed in the fighting and as they tried to escape down the river, and about 4,000 men, women and children were taken prisoner and sent to Agra. Some Portuguese later came back to trade at Hooghly and the neighbouring Bandel, but the town never recovered its importance.
: Le siège et la prise par les Moghols de Hooghly (Hugli), comptoir portugais sur le fleuve Hooghly, dans l’ouest du Bengale. L’établissement portugais, qui datait d’environ 1579, était devenu le principal port du Bengale, mais les officiers moghols accusaient ses habitants de se soustraire aux droits de douane, de se livrer à la piraterie et de razzier le delta pour y capturer des esclaves, souvent avec les Arakanais, ainsi que de convertir de force. Shah Jahan, qui aurait aussi gardé rancune aux Portugais de lui avoir refusé leur aide lorsqu’il était un prince rebelle au Bengale, ordonna au gouverneur du Bengale, Qasim Khan Juvayni, de s’en emparer. Une importante armée moghole, appuyée par une flotte, assiégea la ville à partir du 24 juin 1632. La garnison, composée d’environ 300 Portugais et de quelque 700 chrétiens indiens, tint environ trois mois, jusqu’à ce que les Moghols ouvrent une brèche à l’aide d’une mine et prennent la ville d’assaut en septembre (Banglapedia donne le 13 septembre, d’autres récits le 24 septembre). Beaucoup furent tués dans les combats et en tentant de s’échapper par le fleuve, et environ 4 000 hommes, femmes et enfants furent faits prisonniers et envoyés à Agra. Certains Portugais revinrent plus tard commercer à Hooghly et à Bandel, tout proche, mais la ville ne retrouva jamais son importance.
