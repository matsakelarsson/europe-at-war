# French translations of the catalogue text (wave 10); step bodies follow later.
Odawara Campaign: Campagne d’Odawara
? Toyotomi Hideyoshi’s campaign against the Later Hōjō, the last great independent house of eastern Japan. From their castle at Odawara the Hōjō had ruled most of the Kantō for almost a century, and Hōjō Ujimasa, the retired head who still led the house, put off Hideyoshi’s demands that he come to Kyoto and submit. When a Hōjō commander seized the Sanada castle of Nagurumi at the end of 1589, Hideyoshi declared war. In the spring of 1590 he led an army put at over 200,000 men, with Tokugawa Ieyasu, along the Tōkaidō, while a second army under Maeda Toshiie and Uesugi Kagekatsu came over the mountains from the north and a fleet sailed round the Izu peninsula. Yamanaka castle on the Hakone pass fell in a day, and from May Odawara was surrounded. The Hōjō castles in the Kantō fell one by one, and on 4 August 1590 Hōjō Ujinao surrendered Odawara. Ujimasa and his brother Ujiteru were made to take their own lives, Ujinao was sent into exile on Mount Kōya, and the Hōjō lands were given to Ieyasu, who made Edo his capital. With Date Masamune and the northern lords submitting, all Japan now acknowledged Hideyoshi.
: La campagne de Toyotomi Hideyoshi contre les Hōjō postérieurs, la dernière grande maison indépendante de l’est du Japon. Depuis leur château d’Odawara, les Hōjō gouvernaient la plus grande partie du Kantō depuis près d’un siècle, et Hōjō Ujimasa, le chef retiré qui dirigeait encore la maison, éludait les demandes de Hideyoshi, qui le sommait de venir à Kyoto faire sa soumission. Lorsqu’un commandant des Hōjō s’empara du château de Nagurumi, qui appartenait aux Sanada, à la fin de 1589, Hideyoshi déclara la guerre. Au printemps 1590, il conduisit le long du Tōkaidō, avec Tokugawa Ieyasu, une armée estimée à plus de 200 000 hommes, tandis qu’une seconde armée commandée par Maeda Toshiie et Uesugi Kagekatsu franchissait les montagnes depuis le nord et qu’une flotte contournait la péninsule d’Izu. Le château de Yamanaka, sur le col de Hakone, tomba en un jour et, à partir de mai, Odawara fut encerclé. Les châteaux des Hōjō dans le Kantō tombèrent l’un après l’autre et, le 4 août 1590, Hōjō Ujinao rendit Odawara. Ujimasa et son frère Ujiteru furent contraints de se donner la mort, Ujinao fut exilé sur le mont Kōya et les terres des Hōjō furent données à Ieyasu, qui fit d’Edo sa capitale. Avec la soumission de Date Masamune et des seigneurs du nord, tout le Japon reconnaissait désormais Hideyoshi.
