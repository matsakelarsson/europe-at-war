# French translations of the catalogue text (wave 10); step bodies follow later.
Siege of Osaka: Siège d’Osaka
? The two campaigns in which the Tokugawa shogunate destroyed the Toyotomi family, the last power in Japan that could rival it. After Sekigahara, Toyotomi Hideyoshi’s son Hideyori kept Osaka Castle, the strongest fortress in the country, with his mother Yodo-dono and a large fortune, while Tokugawa Ieyasu became shogun in 1603 and passed the title to his son Hidetada in 1605. In 1614 Ieyasu took offence at the inscription on a bell cast for the Hōkō-ji temple that Hideyori had rebuilt in Kyoto, and when tens of thousands of masterless samurai (rōnin), many of them men dispossessed after Sekigahara, gathered in Osaka, he marched on the city with about 164,000 men. In the winter campaign (November 1614 – January 1615) the defenders, perhaps 100,000 strong, held the castle; Sanada Yukimura’s earthwork, the Sanada-maru, threw back the attackers, and Ieyasu turned to European cannon bought from English and Dutch merchants. A shot into Yodo-dono’s quarters helped bring about a peace on 22 January 1615 by which the outer moats were to be filled; the Tokugawa filled the inner moats as well. In the summer campaign (May–June 1615) the Toyotomi generals came out to fight in the open and were defeated at Kashii, Dōmyōji, Yao and Wakae, and on 3 June in the decisive battle around Tennōji, where Sanada was killed. The next day the castle burned and Hideyori and Yodo-dono killed themselves; Hideyori’s eight-year-old son Kunimatsu was beheaded. The shogunate then decreed one castle to a province and issued the first Laws for the Military Houses, and Japan saw no war on this scale until the 1860s.
: Les deux campagnes au cours desquelles le shogunat Tokugawa anéantit la famille Toyotomi, la dernière puissance du Japon capable de rivaliser avec lui. Après Sekigahara, Hideyori, fils de Toyotomi Hideyoshi, conserva le château d’Osaka, la plus puissante forteresse du pays, avec sa mère Yodo-dono et une grande fortune, tandis que Tokugawa Ieyasu devenait shogun en 1603 et transmettait le titre à son fils Hidetada en 1605. En 1614, Ieyasu prit ombrage de l’inscription d’une cloche fondue pour le temple Hōkō-ji, que Hideyori avait reconstruit à Kyoto, et, lorsque des dizaines de milliers de samouraïs sans maître (rōnin), dont beaucoup avaient été dépossédés après Sekigahara, se rassemblèrent à Osaka, il marcha sur la ville avec environ 164 000 hommes. Lors de la campagne d’hiver (novembre 1614 – janvier 1615), les défenseurs, peut-être 100 000, tinrent le château ; l’ouvrage de terre de Sanada Yukimura, le Sanada-maru, repoussa les assaillants, et Ieyasu eut recours à des canons européens achetés à des marchands anglais et néerlandais. Un boulet tiré dans les appartements de Yodo-dono contribua à amener une paix, le 22 janvier 1615, aux termes de laquelle les douves extérieures devaient être comblées ; les Tokugawa comblèrent aussi les douves intérieures. Lors de la campagne d’été (mai–juin 1615), les généraux des Toyotomi sortirent combattre en rase campagne et furent vaincus à Kashii, Dōmyōji, Yao et Wakae, puis le 3 juin lors de la bataille décisive autour de Tennōji, où Sanada fut tué. Le lendemain, le château brûla, et Hideyori et Yodo-dono se donnèrent la mort ; le fils de Hideyori, Kunimatsu, âgé de huit ans, fut décapité. Le shogunat décréta ensuite un seul château par province et promulgua les premières Lois pour les maisons militaires, et le Japon ne connut plus de guerre de cette ampleur avant les années 1860.
