"23 May – 17 August 1480": "23 mai – 17 août 1480"
"The Knights of St John had ruled Rhodes since 1310, raiding Muslim shipping from its harbours. After the peace with Venice, Mehmed II sent a fleet of about 160 ships and a large army under Mesih Pasha, a member of the Byzantine imperial family who had become an Ottoman commander. They landed on 23 May and set up their heavy guns. The first attacks, from 9 June, fell on the Tower of St Nicholas guarding the harbour mole; d’Aubusson himself led its defence, and the assaults were driven off.": "Après la paix avec Venise, Mehmed II envoya une flotte d’environ 160 navires et une grande armée sous Mesih Pasha, membre de la famille impériale byzantine qui était devenue un commandant ottoman. Ils débarquèrent le 23 mai et installèrent leurs canons lourds. Les premières attaques, à partir du 9 juin, sont tombées sur la tour de St Nicholas qui gardait la taupe portuaire ; d’Aubusson lui-même a dirigé sa défense, et les assauts ont été chassés."
"The Ottomans then battered the weak eastern walls by the Jewish quarter, in the sector of the knights of Italy, while the defenders dug a new ditch and wall behind them. At dawn on 27 July janissaries stormed the breach, raised their flags on the Tower of Italy and entered the city. In three hours of fighting, with the grand master wounded five times, they were thrown back, and the counter-attack reached the Ottoman camp. After losing thousands of men, Mesih Pasha re-embarked his army, and the fleet sailed away by 17 August. Mehmed planned a new expedition but died in May 1481.": "Les Ottomans ont ensuite battu les faibles murs de l’est par le quartier juif, dans le secteur des chevaliers d’Italie, tandis que les défenseurs creusaient un nouveau fossé et un mur derrière eux. À l’aube du 27 juillet, les janisseries ont pris la fuite, ont levé leurs drapeaux sur la tour d’Italie et sont entrés dans la ville. Après avoir perdu des milliers d’hommes, Mesih Pasha réembarqua son armée et la flotte partit le 17 août. Mehmed planifia une nouvelle expédition mais mourut en mai 1481."
