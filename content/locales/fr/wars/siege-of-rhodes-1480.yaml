# Some French text was translated automatically.
"Siege of Rhodes, 1480": "Siège de Rhodes, 1480"
"The failed Ottoman attempt to take Rhodes from the Knights Hospitaller. A fleet and army under Mesih Pasha landed in May 1480 and bombarded the city for nearly three months, but the Knights and the townspeople under Grand Master Pierre d’Aubusson beat off the attacks on the harbour tower of St Nicholas and, on 27 July, a great assault that had already broken into the city. In August the Ottomans withdrew. Rhodes fell to Suleiman the Magnificent in 1522.": "La tentative ottomane infructueuse de prendre Rhodes du Chevalier Hospitalier. Une flotte et une armée sous Mesih Pasha débarquent en mai 1480 et bombardent la ville pendant près de trois mois, mais les chevaliers et les habitants sous le Grand Maître Pierre d’Aubusson battent les attaques contre la tour portuaire de St Nicolas et, le 27 juillet, une grande attaque qui avait déjà éclaté dans la ville. Rhodes est tombé à Suleiman le Magnifique en 1522."
"The Ottoman army is put at about 70,000 men by d’Aubusson, a figure that may be inflated; the defenders numbered a few hundred knights and perhaps 2,000–3,000 soldiers, besides the citizens. The best-known account is by the order’s vice-chancellor Guillaume Caoursin, an eyewitness.": "L’armée ottomane est mise à environ 70 000 hommes par d-Aubusson, un chiffre qui peut être gonflé ; les défenseurs ont compté quelques centaines de chevaliers et peut-être 2000-3000 soldats, outre les citoyens. Le récit le plus connu est par l’ordre du vice-chancelier Guillaume Caoursin, témoin oculaire."
