"Siege of Rhodes, 1522": "Siège de Rhodes, 1522"
"Suleiman the Magnificent’s siege of Rhodes, held since 1310 by the Knights Hospitaller, a military religious order whose galleys raided Muslim shipping between Constantinople and Egypt. After six months of bombardment, mining and assaults, Grand Master Philippe Villiers de L’Isle-Adam surrendered on generous terms in December 1522, and the knights left the island; in 1530 they settled on Malta.": "Suleiman le Magnificent siège de Rhodes, tenu depuis 1310 par les Chevaliers Hospitaliers, un ordre religieux militaire dont les galères ont perquisitionné la navigation musulmane entre Constantinople et l’Egypte. Après six mois de bombardement, d’exploitation minière et d’assauts, Grand Maître Philippe Villiers de L=Isle-Adam s’est rendu à des conditions généreuses en décembre 1522, et les chevaliers ont quitté l’île ; en 1530 ils se sont installés sur Malte."
"Dates are Julian. The size of the Ottoman army is uncertain; accounts of the time give 100,000 or more, including the men who rowed the fleet and dug the mines, and modern historians suggest fewer.": "Les dates sont Julian. La taille de l’armée ottomane est incertaine ; les récits du temps donnent au moins 100 000, y compris les hommes qui ont ramé la flotte et creusé les mines, et les historiens modernes suggèrent moins."
"The knights had beaten off an earlier Ottoman siege in 1480, under Mehmed II, which has its own entry.": "Les chevaliers avaient battu un siège ottoman antérieur en 1480, sous Mehmed II, qui a sa propre entrée."
