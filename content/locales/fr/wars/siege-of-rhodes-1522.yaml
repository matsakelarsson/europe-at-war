"June 1522 – January 1523": "juin 1522 – janvier 1523"
"The knights of St John had ruled Rhodes and its neighbouring islands for two centuries, and their raids on Muslim ships and pilgrims were a constant affront to the sultans. On 26 June 1522 an Ottoman fleet of some 400 ships landed an army under Çoban Mustafa Pasha, and Suleiman came over from the mainland near Marmaris on 28 July to take command. The new grand master, Philippe Villiers de L’Isle-Adam, had about 700 knights and sergeants of the order and a few thousand mercenaries and Rhodian militia behind some of the strongest walls in Europe, each section held by one of the order’s national “tongues”.": "Les chevaliers de Saint-Jean avaient gouverné Rhodes et ses îles voisines pendant deux siècles, et leurs raids sur les navires musulmans et les pèlerins étaient un affront constant aux sultans. Le 26 juin 1522, une flotte ottomane d’environ 400 navires débarqua une armée sous Çoban Mustafa Pasha, et Suleiman vint du continent près de Marmaris le 28 juillet pour prendre le commandement. Le nouveau grand maître, Philippe Villiers de L.Isle-Adam, avait environ 700 chevaliers et sergents de l’ordre et quelques milliers de mercenaires et de miliciens Rhodiens derrière certains des murs les plus forts d’Europe, chaque section tenue par l’un des ordres nationaux de l’ordre."
"The Ottoman guns and miners slowly broke the walls. On 4 September two mines brought down part of the bastion of England, and on 24 September a great assault on four bastions was thrown back with very heavy losses. Ahmed Pasha, an experienced siege engineer, took over and kept up the mining into the winter. With no relief coming from Europe and the townspeople pressing him, the grand master agreed terms on 22 December. The knights could leave with their arms, and the people who stayed were promised freedom of worship. On 1 January 1523 the knights sailed for Crete with several thousand Rhodians, and their castles at Bodrum and Kos were handed over.": "Le 4 septembre, deux mines ont abattu une partie du bastion d’Angleterre et le 24 septembre, un grand assaut sur quatre bastions a été repoussé avec des pertes très lourdes. Ahmed Pacha, ingénieur de siège expérimenté, s’est emparé de l’exploitation minière pendant l’hiver et n’a reçu aucun secours en provenance d’Europe et des habitants qui l’ont pressé, le grand maître a accepté les conditions le 22 décembre. Les chevaliers pouvaient partir avec leurs bras, et les gens qui restaient furent promis la liberté de culte. Le 1er janvier 1523, les chevaliers embarquèrent pour la Crète avec plusieurs milliers de Rhodiens, et leurs châteaux à Bodrum et Kos furent remis."
