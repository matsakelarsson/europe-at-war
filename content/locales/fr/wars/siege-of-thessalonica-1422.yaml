"Siege of Thessalonica, 1422–1430": "Siège de Thessalonique, 1422-1430"
"The eight-year Ottoman blockade of Thessalonica, the second city of the Byzantine world. Sultan Murad II attacked it in 1422 to punish the Byzantines for backing a rival claimant, and in 1423 its despot Andronikos Palaiologos handed it to Venice, which could neither defend it properly nor make peace on its own terms. Murad took the starving city by storm on 29 March 1430, and it remained Ottoman until 1912.": "Le blocus ottoman de Thessalonique, la deuxième ville du monde byzantin, qui a duré huit ans. Le sultan Murad II l’a attaqué en 1422 pour punir les Byzantins d’avoir soutenu un prétendant rival, et en 1423 ses despotes Andronikos Palaiologis le lui ont remis à Venise, qui ne pouvait ni la défendre correctement ni faire la paix selon ses propres conditions."
"Dates are Julian. The city’s population before the siege is estimated at up to 40,000; the main accounts are by the metropolitan Symeon of Thessalonica, who died in 1429, and the eyewitness John Anagnostes, who described the fall.": "Dates sont Julian. La population de la ville avant le siège est estimée à 40 000 ; les comptes principaux sont par le Symeon métropolitain de Thessalonique, qui est mort en 1429, et le témoin oculaire John Anagnoste, qui a décrit la chute."
"Thessalonica had already been under Ottoman rule from 1387 until 1403, when the Treaty of Gallipoli returned it to Byzantium. Murad II’s siege of Constantinople in 1422 is not told here.": "Thessalonica avait déjà été sous le régime ottoman de 1387 jusqu’à 1403, quand le traité de Gallipoli l’a rendu à Byzance. Murad II, siège de Constantinople en 1422 n’est pas dit ici."
