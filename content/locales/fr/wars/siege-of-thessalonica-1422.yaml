"1422–1430": "1422–1430"
"When Murad II became sultan in 1421, the Byzantines backed his uncle Mustafa as a rival. After crushing Mustafa, Murad besieged Constantinople in the summer of 1422 and sent troops to blockade Thessalonica from June. Its ruler, the despot Andronikos Palaiologos, a son of Manuel II, was ill and had neither men nor money to defend it, and in September 1423 he handed the city to Venice. Murad refused to accept the transfer. For years the blockade went on, broken by assaults on the walls, while Venetian and Ottoman ships raided each other’s coasts and Venetian fleets tried in vain to close the Dardanelles at Gallipoli.": "Lorsque Murad II est devenu sultan en 1421, les Byzantins ont soutenu son oncle Mustafa comme un rival. Après avoir écrasé Mustafa, Murad a assiégé Constantinople à l’été de 1422 et envoyé des troupes pour bloquer Thessalonique à partir de Juin. Son chef, le despote Andronikos Palaiologos, fils de Manuel II, était malade et n’avait ni hommes ni argent pour la défendre, et en septembre 1423 il livra la ville à Venise. Murad refusa d’accepter le transfert. Pendant des années, le blocus a continué, brisé par des assauts sur les murs, tandis que les navires vénitiens et Ottomans s’entretuèrent côte et les flottes vénitiennes ont essayé en vain de fermer les Dardanelles à Gallipoli."
"The city starved, and many of its people fled. Resentment of the Venetian governors grew, and although the metropolitan Symeon urged resistance, most citizens came to prefer surrender to a sack. Venice formally declared war in March 1429 but sent too few soldiers. Early in 1430 Murad gathered a large army before the walls, and on 29 March his troops stormed them. The city was plundered and thousands of its people were enslaved, some 7,000 by one account; its population fell to perhaps 2,000, and Murad later brought in new settlers. Venice made peace in July 1430, accepting the loss.": "Le ressentiment des gouverneurs vénitiens grandit, et bien que le métropolite Syméon poussât la résistance, la plupart des citoyens vinrent préférer se rendre à un sac. Venise déclara officiellement la guerre en mars 1429 mais envoya trop peu de soldats. Au début de 1430 Murad rassembla une grande armée devant les murs, et le 29 mars ses troupes les envahirent. La ville a été pillée et des milliers de ses habitants ont été réduits en esclavage, quelque 7 000 par un seul compte ; sa population est tombée à peut-être 2 000, et Murad a amené plus tard de nouveaux colons. Venise a fait la paix en juillet 1430, acceptant la perte."
