# French translations of the catalogue text (wave 10); step bodies follow later.
Siege of Tsingtao: Siège de Tsingtao
? The capture of Germany’s naval base at Tsingtao (Qingdao) in China by Japan and Britain in the first months of the First World War, together with Japan’s seizure of Germany’s islands in the northern Pacific. Germany had held the Kiautschou (Jiaozhou Bay) territory on the Shandong peninsula on a 99-year lease since 1898 and built Tsingtao into a fortified port and the base of its East Asia Squadron, with a railway to Jinan. Japan, Britain’s ally since 1902, sent Germany an ultimatum on 15 August 1914 demanding the surrender of the territory and declared war on 23 August. The German squadron had already left for the Pacific. The Japanese 18th Division, about 23,000 men with 142 guns, landed on the north coast of Shandong at Longkou from 2 September, in breach of China’s neutrality, and at Laoshan Bay east of Tsingtao on 18 September, while other troops occupied the Shandong railway as far as Jinan. A British force of about 1,500 men under Brigadier-General Nathaniel Barnardiston joined them. The garrison of about 3,700 to 4,500 German marines, sailors and reservists and the crew of the Austro-Hungarian cruiser Kaiserin Elisabeth under Governor Alfred Meyer-Waldeck fell back to the hills around the town. After a week-long bombardment from 31 October and a night assault, the garrison surrendered on 7 November. In October the Japanese navy took the Marshall, Caroline, Palau and Mariana Islands without a fight. At the Paris Peace Conference in 1919 Japan was given Germany’s rights in Shandong, which set off the May Fourth Movement in China; Japan returned the territory to China in 1922 and governed the islands as a League of Nations mandate, the South Seas Mandate, until 1945.
: La prise de la base navale allemande de Tsingtao (Qingdao), en Chine, par le Japon et la Grande-Bretagne dans les premiers mois de la Première Guerre mondiale, ainsi que la saisie par le Japon des îles allemandes du Pacifique nord. L’Allemagne tenait depuis 1898 le territoire de Kiautschou (baie de Jiaozhou), sur la péninsule du Shandong, en vertu d’un bail de 99 ans, et avait fait de Tsingtao un port fortifié et la base de son escadre d’Extrême-Orient, relié à Jinan par une voie ferrée. Le Japon, allié de la Grande-Bretagne depuis 1902, adressa à l’Allemagne le 15 août 1914 un ultimatum exigeant la remise du territoire et lui déclara la guerre le 23 août. L’escadre allemande était déjà partie pour le Pacifique. La 18e division japonaise, environ 23 000 hommes et 142 canons, débarqua sur la côte nord du Shandong à Longkou à partir du 2 septembre, en violation de la neutralité chinoise, puis dans la baie de Laoshan, à l’est de Tsingtao, le 18 septembre, tandis que d’autres troupes occupaient le chemin de fer du Shandong jusqu’à Jinan. Une force britannique d’environ 1 500 hommes commandée par le général de brigade Nathaniel Barnardiston se joignit à elle. La garnison, forte d’environ 3 700 à 4 500 fusiliers marins, marins et réservistes allemands, ainsi que l’équipage du croiseur austro-hongrois Kaiserin Elisabeth, sous les ordres du gouverneur Alfred Meyer-Waldeck, se replia sur les collines entourant la ville. Après une semaine de bombardement à partir du 31 octobre et un assaut de nuit, la garnison capitula le 7 novembre. En octobre, la marine japonaise prit sans combat les îles Marshall, Carolines, Palaos et Mariannes. À la conférence de la paix de Paris, en 1919, le Japon reçut les droits de l’Allemagne au Shandong, ce qui déclencha le mouvement du 4 Mai en Chine ; le Japon rendit le territoire à la Chine en 1922 et administra les îles jusqu’en 1945 en tant que mandat de la Société des Nations, le mandat des îles du Pacifique.
