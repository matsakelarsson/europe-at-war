# French translations of the catalogue text (wave 11); step bodies follow later.
Mataram’s sieges of Batavia: Sièges de Batavia par Mataram
? Two attempts by Sultan Agung of Mataram, master of Central and East Java since the fall of Surabaya in 1625, to take Batavia, the fortified headquarters that the Dutch East India Company (VOC) had built on the ruins of Jayakarta in 1619. Agung meant to rule all of Java and saw Batavia as the stepping stone to Banten. In August 1628 a Mataram fleet landed troops beside the castle and an army followed overland, about 10,000 men in all; they tried to storm the outworks and to dam the Ciliwung river, but the garrison of a few hundred held out, and by December the besiegers had run out of food. Agung had the two commanders executed, and the army withdrew, leaving hundreds of beheaded bodies. For the second siege in 1629 Mataram stocked rice at depots along the coast, but Dutch ships found and burned the stores at Tegal and Cirebon, and the Sundanese regent Dipati Ukur turned against Mataram. A weakened army of perhaps 14,000 to 20,000 besieged Batavia from August to early October 1629, when hunger and disease drove it home; Governor-General Jan Pieterszoon Coen died of illness during the siege. Mataram never attacked Batavia again, the Company held its base on Java, and Agung turned his armies east, against Blambangan.
: Deux tentatives du sultan Agung de Mataram, maître de Java central et oriental depuis la chute de Surabaya en 1625, pour prendre Batavia, le quartier général fortifié que la Compagnie néerlandaise des Indes orientales (VOC) avait bâti sur les ruines de Jayakarta en 1619. Agung entendait régner sur l’ensemble de Java et voyait en Batavia le tremplin vers Banten. En août 1628, une flotte de Mataram débarqua des troupes près du château et une armée suivit par voie de terre, environ 10 000 hommes en tout ; ils tentèrent de prendre d’assaut les ouvrages avancés et de barrer le Ciliwung, mais la garnison, forte de quelques centaines d’hommes, tint bon, et en décembre les assiégeants n’avaient plus de vivres. Agung fit exécuter les deux commandants, et l’armée se retira, laissant derrière elle des centaines de corps décapités. Pour le second siège, en 1629, Mataram constitua des réserves de riz dans des dépôts le long de la côte, mais des navires néerlandais découvrirent et incendièrent les stocks de Tegal et de Cirebon, et le régent sundanais Dipati Ukur se retourna contre Mataram. Une armée affaiblie de peut-être 14 000 à 20 000 hommes assiégea Batavia d’août au début d’octobre 1629, quand la faim et la maladie la contraignirent à rentrer ; le gouverneur général Jan Pieterszoon Coen mourut de maladie pendant le siège. Mataram n’attaqua plus jamais Batavia, la Compagnie conserva sa base à Java, et Agung tourna ses armées vers l’est, contre Blambangan.
