# French translations of the catalogue text (wave 8); step bodies follow later.
Sieges of Diu: Sièges de Diu
Two attempts by the Gujarat Sultanate to drive the Portuguese out of the fortress they had built at Diu, the island port at the tip of the Kathiawar peninsula. In 1538 a Gujarati army under Khadjar Safar besieged the fort and an Ottoman fleet of about 70 ships under Hadım Suleiman Pasha, sent from Suez, joined the attack; the small Portuguese garrison under António da Silveira held out until the Ottomans, at odds with their Gujarati allies, sailed away in November. In 1546 Khadjar Safar besieged Diu again for seven months, until the governor of Portuguese India, João de Castro, arrived with a relief fleet and routed the besiegers on 11 November. Diu stayed Portuguese until India annexed it in 1961.: Deux tentatives du sultanat du Goujarat pour chasser les Portugais de la forteresse qu’ils avaient construite à Diu, port insulaire situé à l’extrémité de la péninsule du Kathiawar. En 1538, une armée goujaratie commandée par Khadjar Safar assiégea le fort, et une flotte ottomane d’environ 70 navires, envoyée de Suez sous les ordres de Hadım Suleiman Pacha, se joignit à l’attaque ; la petite garnison portugaise d’António da Silveira tint bon jusqu’à ce que les Ottomans, brouillés avec leurs alliés goujaratis, reprennent la mer en novembre. En 1546, Khadjar Safar assiégea de nouveau Diu pendant sept mois, jusqu’à ce que le gouverneur de l’Inde portugaise, João de Castro, arrive avec une flotte de secours et mette les assiégeants en déroute le 11 novembre. Diu resta portugaise jusqu’à son annexion par l’Inde en 1961.
