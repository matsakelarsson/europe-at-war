# French translations of the catalogue text (wave 13); step bodies follow later.
Sierra Leone Civil War: Guerre civile de Sierra Leone
? The war that began when the Revolutionary United Front (RUF) of Foday Sankoh, backed by Charles Taylor’s NPFL, crossed from Liberia into eastern Sierra Leone on 23 March 1991. Sierra Leone had been run down by decades of one-party rule and corruption, and the RUF, which claimed to fight for the poor and the young, became notorious for abducting children as fighters, for mass rape and for cutting off the hands and limbs of civilians. The war was fought over the alluvial diamond fields as much as for power. Young officers of the National Provisional Ruling Council (NPRC) seized power in 1992; in 1995 the government hired the South African private military company Executive Outcomes, which, with local hunters’ militias, the Kamajors, drove the RUF back. After an election in 1996, soldiers of the Armed Forces Revolutionary Council (AFRC) overthrew President Ahmad Tejan Kabbah in May 1997 and shared power with the RUF until the Nigerian-led ECOMOG force drove them from Freetown in February 1998. In January 1999 the rebels stormed Freetown again, killing thousands. The Lomé agreement of July 1999 brought Sankoh into government and a United Nations force, UNAMSIL, into the country, but the RUF’s seizure of some 500 peacekeepers in May 2000 led to British intervention, Sankoh’s arrest and, with Guinean attacks on the RUF, its disarmament. Kabbah declared the war over on 18 January 2002. Some 50,000 to 70,000 people were killed and about 2.5 million, half the population, displaced.
: La guerre qui commença lorsque le Front révolutionnaire uni (RUF) de Foday Sankoh, soutenu par le NPFL de Charles Taylor, passa du Liberia dans l’est de la Sierra Leone le 23 mars 1991. La Sierra Leone avait été ruinée par des décennies de parti unique et de corruption, et le RUF, qui prétendait combattre pour les pauvres et les jeunes, devint tristement célèbre pour l’enlèvement d’enfants dont il faisait des combattants, pour les viols de masse et pour l’amputation des mains et des membres de civils. La guerre se livra autant pour les gisements de diamants alluviaux que pour le pouvoir. De jeunes officiers du Conseil national provisoire de gouvernement (NPRC) s’emparèrent du pouvoir en 1992 ; en 1995, le gouvernement engagea la société militaire privée sud-africaine Executive Outcomes, qui, avec des milices de chasseurs locaux, les Kamajors, repoussa le RUF. Après une élection en 1996, des soldats du Conseil révolutionnaire des forces armées (AFRC) renversèrent le président Ahmad Tejan Kabbah en mai 1997 et partagèrent le pouvoir avec le RUF jusqu’à ce que l’ECOMOG, force dirigée par le Nigeria, les chasse de Freetown en février 1998. En janvier 1999, les rebelles prirent de nouveau Freetown d’assaut, tuant des milliers de personnes. L’accord de Lomé de juillet 1999 fit entrer Sankoh au gouvernement et une force des Nations unies, la MINUSIL, dans le pays, mais la capture par le RUF de quelque 500 Casques bleus en mai 2000 entraîna l’intervention britannique, l’arrestation de Sankoh et, avec les attaques guinéennes contre le RUF, le désarmement de celui-ci. Kabbah déclara la guerre terminée le 18 janvier 2002. Quelque 50 000 à 70 000 personnes furent tuées et environ 2,5 millions, soit la moitié de la population, déplacées.
