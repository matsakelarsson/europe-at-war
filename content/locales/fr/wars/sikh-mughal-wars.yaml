# French translations of the catalogue text (wave 8); step bodies follow later.
Sikh–Mughal wars (1688–1716): Guerres entre Sikhs et Moghols (1688–1716)
The wars of the tenth Sikh Guru, Gobind Singh, and of his follower Banda Singh Bahadur against the hill rajas of the Punjab Himalaya and the Mughal governors of Sirhind and Lahore. From his base at Anandpur the Guru fought the hill rajas at Bhangani in 1688 and founded the Khalsa, the order of initiated Sikhs, in 1699. In 1704 a Mughal and hill army besieged Anandpur; leaving under a promise of safe conduct, the Guru’s party was attacked, his two elder sons were killed at Chamkaur and his two younger sons put to death at Sirhind. After a last battle at Muktsar he made peace with Aurangzeb’s successor and was assassinated at Nanded in 1708. Banda Singh, sent to the Punjab, raised the peasantry, sacked Sirhind in 1710 and ruled the country between the Sutlej and the Yamuna from Lohgarh, until Mughal armies drove him into the hills and besieged him at Gurdas Nangal; he was captured in 1715 and executed in Delhi with hundreds of his followers in 1716.: Les guerres menées par le dixième guru des Sikhs, Gobind Singh, puis par son disciple Banda Singh Bahadur contre les rajas des collines de l’Himalaya du Pendjab et les gouverneurs moghols de Sirhind et de Lahore. Depuis sa base d’Anandpur, le Guru combattit les rajas des collines à Bhangani en 1688 et fonda en 1699 la Khalsa, l’ordre des Sikhs initiés. En 1704, une armée formée de troupes mogholes et des rajas des collines assiégea Anandpur ; alors qu’elle quittait la place sur la promesse d’un sauf-conduit, la troupe du Guru fut attaquée, ses deux fils aînés furent tués à Chamkaur et ses deux fils cadets mis à mort à Sirhind. Après une dernière bataille à Muktsar, il fit la paix avec le successeur d’Aurangzeb et fut assassiné à Nanded en 1708. Banda Singh, envoyé au Pendjab, souleva la paysannerie, saccagea Sirhind en 1710 et gouverna depuis Lohgarh le pays situé entre la Sutlej et la Yamuna, jusqu’à ce que les armées mogholes le repoussent dans les collines et l’assiègent à Gurdas Nangal ; il fut capturé en 1715 et exécuté à Delhi avec des centaines de ses partisans en 1716.
