# French translations of the catalogue text (wave 8); step bodies follow later.
Sikkim expedition: Expédition du Sikkim
A British Indian campaign in 1888 to drive Tibetan troops out of Sikkim, also called the Anglo-Sikkimese war or the Anglo-Tibetan war of 1888. After the British gave up a planned mission to Lhasa in 1886, Tibetan soldiers built a fort at Lingtu inside Sikkim, on the trade road to Tibet, and the Chogyal of Sikkim, Thutob Namgyal, leaned towards Tibet. A force of about 2,000 under Brigadier-General Thomas Graham stormed Lingtu on 20–21 March 1888. A Tibetan attack on the British camp at Gnatong was beaten off on 22 May, and in late September Graham defeated the Tibetan army at the Tuko La, crossed the Jelep La and pursued it into the Chumbi valley. The British took over the government of Sikkim, and the Anglo-Chinese Convention of Calcutta of 17 March 1890 recognised Sikkim as a British protectorate and fixed its border with Tibet.: Une campagne de l’Inde britannique menée en 1888 pour chasser les troupes tibétaines du Sikkim, appelée aussi guerre anglo-sikkimaise ou guerre anglo-tibétaine de 1888. Après que les Britanniques eurent renoncé en 1886 à une mission prévue à Lhassa, des soldats tibétains construisirent un fort à Lingtu, à l’intérieur du Sikkim, sur la route commerciale du Tibet, et le chogyal du Sikkim, Thutob Namgyal, se rapprocha du Tibet. Une force d’environ 2 000 hommes commandée par le général de brigade Thomas Graham prit Lingtu d’assaut les 20–21 mars 1888. Une attaque tibétaine contre le camp britannique de Gnatong fut repoussée le 22 mai et, fin septembre, Graham vainquit l’armée tibétaine au Tuko La, franchit le Jelep La et la poursuivit jusque dans la vallée de Chumbi. Les Britanniques prirent en main le gouvernement du Sikkim, et la convention anglo-chinoise de Calcutta du 17 mars 1890 reconnut le Sikkim comme protectorat britannique et fixa sa frontière avec le Tibet.
