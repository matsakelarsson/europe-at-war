# Some French text was translated automatically.
"Silesian Uprisings": "Les soulèvements silésiens"
"Three risings by Polish insurgents in German Upper Silesia, in August 1919, August 1920 and May–July 1921, against German police, army and Freikorps units. After a plebiscite on 20 March 1921 gave about 60 per cent of the vote to Germany, the third and largest rising seized much of the region; the Allies then divided it in October 1921, giving Poland the smaller share of the land but most of the coal mines and heavy industry.": "Trois montées par des insurgés polonais dans la Haute-Silésie allemande, en août 1919, août 1920 et mai–juillet 1921, contre les unités allemandes de police, d’armée et de Freikorps. Après un plébiscite le 20 mars 1921 a donné environ 60 pour cent du vote à l’Allemagne, la troisième et la plus forte augmentation s’est emparée d’une grande partie de la région ; les Alliés l’ont ensuite divisée en octobre 1921, donnant à la Pologne une part plus faible des terres mais la plupart des mines de charbon et de l’industrie lourde."
"Several thousand people may have died in the fighting of 1919–1921, most of them in the third rising. Poland took over its share of Upper Silesia in June 1922.": "Plusieurs milliers de personnes sont peut-être mortes dans les combats de 1919-1921, la plupart dans la troisième montée. La Pologne a repris sa part de Haute Silésie en juin 1922."
