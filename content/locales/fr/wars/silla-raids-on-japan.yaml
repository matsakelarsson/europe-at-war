# French translations of the catalogue text (wave 10); step bodies follow later.
Silla raids on Japan: Raids de Silla contre le Japon
? Raids by seafarers from Silla on Tsushima, the Gotō Islands and the coasts of northern Kyushu in the ninth century, at a time when official relations between the two states had broken down and Silla was sinking into famine and rebellion. Japanese records report three Silla ships off Tsushima in the twelfth month of 811, and in 813 a landing by 110 men on Ojika in the Gotō Islands, where nine islanders were killed and about a hundred taken prisoner. In the sixth month of 869 raiders in two ships entered Hakata Bay and carried off the silk and floss of a tax ship from Buzen; the court sent offerings to the shrines of Ise and others and strengthened Tsushima with frontier guards, crossbowmen and Emishi soldiers. In 893 raiders burned houses in Higo and appeared off Matsuura in Hizen. The largest attack came in the ninth month of 894, when 45 ships reached Tsushima. The governor, Fun’ya no Yoshitomo, met them with crossbows and local levies and reported about 300 raiders killed and eleven boats taken; a captive said that famine had emptied Silla’s granaries and that its king had sent a hundred ships and 2,500 men to seize grain and silk. Iki was raided again in 895. The raids deepened the Japanese court’s mistrust of its neighbours, which carried over to Goryeo after Silla’s fall in 935.
: Des raids menés par des marins de Silla contre Tsushima, les îles Gotō et les côtes du nord de Kyushu au IXe siècle, à une époque où les relations officielles entre les deux États étaient rompues et où Silla sombrait dans la famine et la rébellion. Les sources japonaises signalent trois navires de Silla au large de Tsushima au douzième mois de 811 et, en 813, un débarquement de 110 hommes à Ojika, dans les îles Gotō, où neuf insulaires furent tués et une centaine faits prisonniers. Au sixième mois de 869, des pillards montés sur deux navires entrèrent dans la baie de Hakata et emportèrent la soie et la bourre de soie d’un navire transportant l’impôt de Buzen ; la cour fit des offrandes aux sanctuaires d’Ise et à d’autres et renforça Tsushima avec des gardes-frontières, des arbalétriers et des soldats emishi. En 893, des pillards incendièrent des maisons en Higo et apparurent au large de Matsuura, en Hizen. La plus grande attaque eut lieu au neuvième mois de 894, quand 45 navires atteignirent Tsushima. Le gouverneur, Fun’ya no Yoshitomo, les accueillit avec des arbalètes et des levées locales et rapporta qu’environ 300 pillards avaient été tués et onze bateaux pris ; un captif déclara que la famine avait vidé les greniers de Silla et que son roi avait envoyé cent navires et 2 500 hommes s’emparer de grain et de soie. Iki fut de nouveau attaquée en 895. Ces raids accrurent la méfiance de la cour japonaise envers ses voisins, méfiance qui se reporta sur Goryeo après la chute de Silla en 935.
