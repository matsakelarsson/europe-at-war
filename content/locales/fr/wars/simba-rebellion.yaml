# French translations of the catalogue text (wave 13); step bodies follow later.
Simba rebellion: Rébellion simba
Risings in 1963–1965 by followers of the murdered prime minister Patrice Lumumba against the government of the Congo (Léopoldville). Pierre Mulele led a peasant rising in Kwilu from January 1964, and in the east the National Liberation Council (CNL) of Christophe Gbenye and Gaston Soumialot raised an army of young fighters, the Simbas (“lions” in Swahili), who in 1964 took about half the country and proclaimed a People’s Republic of the Congo at Stanleyville. Prime Minister Moïse Tshombe’s army, white mercenaries and Katangese gendarmes, with American aircraft and Belgian officers, drove them back; on 24 November 1964 Belgian paratroopers landed at Stanleyville to free hundreds of foreign hostages (Operation Dragon Rouge). A Cuban column under Che Guevara fought with the rebels near Lake Tanganyika in 1965 and left in November, when the last major rebel stronghold fell. The rebels killed thousands of Congolese they saw as enemies and some 200–400 foreigners; the repression killed tens of thousands more.: Soulèvements menés en 1963–1965 par les partisans du Premier ministre assassiné Patrice Lumumba contre le gouvernement du Congo (Léopoldville). Pierre Mulele conduisit à partir de janvier 1964 un soulèvement paysan au Kwilu et, dans l’est, le Conseil national de libération (CNL) de Christophe Gbenye et Gaston Soumialot leva une armée de jeunes combattants, les Simba (« lions » en swahili), qui prirent en 1964 environ la moitié du pays et proclamèrent une République populaire du Congo à Stanleyville. L’armée du Premier ministre Moïse Tshombe, des mercenaires blancs et des gendarmes katangais, appuyés par des avions américains et des officiers belges, les repoussèrent ; le 24 novembre 1964, des parachutistes belges sautèrent sur Stanleyville pour libérer des centaines d’otages étrangers (opération Dragon rouge). Une colonne cubaine commandée par Che Guevara combattit aux côtés des rebelles près du lac Tanganyika en 1965 et repartit en novembre, quand tomba le dernier grand bastion rebelle. Les rebelles tuèrent des milliers de Congolais qu’ils considéraient comme des ennemis et quelque 200 à 400 étrangers ; la répression fit encore des dizaines de milliers de morts.
