# French translations of the catalogue text (wave 8); step bodies follow later.
Sinhalese–Portuguese War: Guerre entre Cingalais et Portugais
More than a century of wars between the Portuguese and the Sinhalese kingdoms of Sri Lanka. The Portuguese, who had a fort at Colombo from 1518, came in as protectors of the kingdom of Kotte against Mayadunne of Sitawaka, one of the three kingdoms into which Kotte split in 1521. Sitawaka besieged Kotte, defeated the Portuguese at Mulleriyawa in 1559 and forced them to abandon Kotte in 1565; under Rajasinghe I it conquered Kandy and in 1587–88 besieged Colombo for eight months. After Rajasinghe’s death in 1593 Sitawaka collapsed, and in 1597 the Portuguese crown inherited Kotte and ruled the lowlands. The hill kingdom of Kandy resisted every Portuguese invasion, destroying their armies at Danture in 1594, Randeniwela in 1630 and Gannoruwa in 1638. In 1638 Kandy allied with the Dutch, who by 1658 had taken every Portuguese fort on the island.: Plus d’un siècle de guerres entre les Portugais et les royaumes cingalais du Sri Lanka. Les Portugais, qui possédaient un fort à Colombo depuis 1518, intervinrent comme protecteurs du royaume de Kotte contre Mayadunne, roi de Sitawaka, l’un des trois royaumes issus du partage de Kotte en 1521. Sitawaka assiégea Kotte, vainquit les Portugais à Mulleriyawa en 1559 et les força à abandonner Kotte en 1565 ; sous Rajasinghe Ier, Sitawaka conquit Kandy et, en 1587–88, assiégea Colombo pendant huit mois. Après la mort de Rajasinghe en 1593, Sitawaka s’effondra et, en 1597, la Couronne portugaise hérita de Kotte et gouverna les basses terres. Le royaume montagnard de Kandy repoussa toutes les invasions portugaises, anéantissant leurs armées à Danture en 1594, à Randeniwela en 1630 et à Gannoruwa en 1638. En 1638, Kandy s’allia aux Hollandais, qui, en 1658, avaient pris tous les forts portugais de l’île.
