# French translations of the catalogue text (wave 11); step bodies follow later.
Sino-Burmese War: Guerre sino-birmane
? Four invasions of Konbaung Burma by Qing China, fought over the Shan and Tai states of the border hills that both empires claimed. After Burma’s new Konbaung kings reasserted their rule over states the Qing had drawn into their orbit in the 1730s, the governor of Yunnan sent Green Standard troops against Kengtung in December 1765; they were beaten back. A second, larger invasion by Bhamo in 1766–1767 was trapped between the Burmese fort at Kaungton and armies closing in from the hills, and destroyed by battle and disease. The Qianlong Emperor then sent Manchu Bannermen under his son-in-law Ming Rui, who broke through the Shan hills at the Goteik gorge late in 1767 and came within 30 miles of Ava; cut off from his supplies, he was surrounded and destroyed at Maymyo in March 1768 and hanged himself. In 1769 Fuheng led about 60,000 men down the Irrawaddy, but his flotilla was sunk and his army, sick and surrounded near Kaungton, accepted a truce on 13 (or 22) December 1769. Neither court ratified the terms, and Qing trade was banned for twenty years; but Burma had kept its independence and its border states, at the price of losing its conquests in Siam, which used the respite to recover.
: Quatre invasions de la Birmanie des Konbaung par la Chine des Qing, menées pour les États shans et tai des collines frontalières que les deux empires revendiquaient. Après que les nouveaux rois de la dynastie Konbaung eurent rétabli leur autorité sur des États que les Qing avaient attirés dans leur orbite dans les années 1730, le gouverneur du Yunnan envoya des troupes de l’Étendard vert contre Kengtung en décembre 1765 ; elles furent repoussées. Une deuxième invasion, plus importante, passant par Bhamo en 1766–1767, fut prise au piège entre le fort birman de Kaungton et des armées qui se refermaient depuis les collines, et anéantie par les combats et la maladie. L’empereur Qianlong envoya alors des soldats des Bannières mandchoues sous le commandement de son gendre Ming Rui, qui perça à travers les collines shans par la gorge de Goteik à la fin de 1767 et parvint à moins de 30 milles d’Ava ; coupé de ses approvisionnements, il fut encerclé et anéanti à Maymyo en mars 1768 et se pendit. En 1769, Fuheng descendit l’Irrawaddy avec environ 60 000 hommes, mais sa flottille fut coulée et son armée, malade et encerclée près de Kaungton, accepta une trêve le 13 (ou le 22) décembre 1769. Aucune des deux cours ne ratifia les termes, et le commerce avec les Qing fut interdit pendant vingt ans ; mais la Birmanie avait conservé son indépendance et ses États frontaliers, au prix de la perte de ses conquêtes au Siam, qui profita du répit pour se relever.
