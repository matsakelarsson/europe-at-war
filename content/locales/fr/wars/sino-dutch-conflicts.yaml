# French translations of the catalogue text (wave 9); step bodies follow later.
Sino-Dutch conflicts: Conflits sino-néerlandais
? Fighting between the Dutch East India Company (VOC) and Ming China over the Company’s demand for trade on the coast of Fujian. After the Portuguese beat off a Dutch attack on Macau in June 1622, a VOC fleet under Cornelis Reijersen occupied the Penghu (Pescadores) islands, built a fort with forced Chinese labour and raided the Fujian coast to force the Ming to open trade. In 1624 Ming troops under Yu Zigao landed on Penghu and besieged the fort; in August the Dutch agreed to pull down the fort and withdraw to Tayouan on Taiwan, outside Ming rule, where they built what became Fort Zeelandia and the colony of Dutch Formosa. Trade with Taiwan grew through Chinese merchants, but in 1633 the governor Hans Putmans, allied with the pirate Liu Xiang, burned the new fleet of the Ming admiral Zheng Zhilong at Xiamen (Amoy) to force direct trade. On 22 October 1633 Zheng defeated the Dutch and Liu Xiang’s junks with fire ships in Liaoluo Bay off Kinmen. The Company afterwards traded through Zheng Zhilong’s merchants at Tayouan.
: Combats entre la Compagnie néerlandaise des Indes orientales (VOC) et la Chine des Ming, la Compagnie exigeant de pouvoir commercer sur la côte du Fujian. Après que les Portugais eurent repoussé une attaque néerlandaise contre Macao en juin 1622, une flotte de la VOC commandée par Cornelis Reijersen occupa les îles Penghu (Pescadores), y construisit un fort en recourant au travail forcé de Chinois et razzia la côte du Fujian pour contraindre les Ming à ouvrir le commerce. En 1624, des troupes Ming commandées par Yu Zigao débarquèrent aux Penghu et assiégèrent le fort ; en août, les Néerlandais acceptèrent de démolir le fort et de se retirer à Tayouan, à Taïwan, hors de l’autorité des Ming, où ils bâtirent ce qui devint le fort Zeelandia et la colonie de Formose néerlandaise. Le commerce avec Taïwan se développa par l’intermédiaire de marchands chinois, mais en 1633 le gouverneur Hans Putmans, allié au pirate Liu Xiang, incendia à Xiamen (Amoy) la nouvelle flotte de l’amiral Ming Zheng Zhilong pour imposer un commerce direct. Le 22 octobre 1633, Zheng battit les Néerlandais et les jonques de Liu Xiang à l’aide de brûlots dans la baie de Liaoluo, au large de Kinmen. Par la suite, la Compagnie commerça à Tayouan par l’intermédiaire des marchands de Zheng Zhilong.
