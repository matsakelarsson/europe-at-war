# French translations of the catalogue text (wave 11); step bodies follow later.
Sino-French War: Guerre franco-chinoise
? "The war between France and Qing China over Tonkin, northern Vietnam, which China regarded as a tributary state and France had just made a protectorate. China’s Guangxi and Yunnan armies and Liu Yongfu’s Black Flag Army were already fighting the French in Tonkin, and the Tientsin Accord of May 1884, by which China was to withdraw them, broke down when a French column was stopped at Bắc Lệ in June. In August Admiral Courbet destroyed the Fujian fleet at Fuzhou in less than an hour. The French then occupied Keelung on Taiwan but were beaten back at Tamsui, and the war in Taiwan became a long, sickly stalemate. In Tonkin the French defeated the Guangxi army at Kép, took Lạng Sơn in February 1885 and relieved the besieged garrison of Tuyên Quang, but in March they were beaten at Bang Bo below the Zhennan Pass and abandoned Lạng Sơn, which brought down Jules Ferry’s government. After the French took the Pescadores, the two sides made peace: by the Treaty of Tianjin (9 June 1885) China accepted the French protectorate over Vietnam, and France gave back Keelung and the Pescadores without an indemnity."
: "La guerre entre la France et la Chine des Qing pour le Tonkin, le nord du Vietnam, que la Chine considérait comme un État tributaire et dont la France venait de faire un protectorat. Les armées chinoises du Guangxi et du Yunnan et l’armée des Pavillons noirs de Liu Yongfu combattaient déjà les Français au Tonkin, et l’accord de Tientsin de mai 1884, aux termes duquel la Chine devait les retirer, fut rompu lorsqu’une colonne française fut arrêtée à Bắc Lệ en juin. En août, l’amiral Courbet détruisit la flotte du Fujian à Fuzhou en moins d’une heure. Les Français occupèrent ensuite Keelung, à Taïwan, mais furent repoussés à Tamsui, et la guerre à Taïwan s’enlisa dans une longue impasse, minée par la maladie. Au Tonkin, les Français battirent l’armée du Guangxi à Kép, prirent Lạng Sơn en février 1885 et dégagèrent la garnison assiégée de Tuyên Quang, mais en mars ils furent battus à Bang Bo, en contrebas du col de Zhennan, et abandonnèrent Lạng Sơn, ce qui provoqua la chute du gouvernement de Jules Ferry. Après la prise des Pescadores par les Français, les deux camps firent la paix : par le traité de Tianjin (9 juin 1885), la Chine accepta le protectorat français sur le Vietnam, et la France rendit Keelung et les Pescadores sans indemnité."
