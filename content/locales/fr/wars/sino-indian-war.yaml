# French translations of the catalogue text (wave 8); step bodies follow later.
Sino-Indian War: Guerre sino-indienne
"A month-long border war between China and India in the Himalayas in October and November 1962, fought at two fronts 1,000 km apart: Aksai Chin in Ladakh, held by China and claimed by India, and the North-East Frontier Agency (today Arunachal Pradesh), held by India up to the McMahon Line and claimed by China. After years of disputes, the flight of the Dalai Lama to India in 1959 and India’s “forward policy” of posts in disputed land, China attacked on both fronts on 20 October. Its troops overran Indian positions on the Namka Chu and at Tawang, and in a second offensive in November took Se La, Bomdila and Walong and reached the edge of the Assam plain, while in Ladakh they took the Indian posts up to China’s claim line. China then declared a ceasefire on 21 November and withdrew in the east, keeping Aksai Chin. The defeat shook India’s government and led to a large expansion of its army.": "Une guerre frontalière d’un mois entre la Chine et l’Inde dans l’Himalaya, en octobre et novembre 1962, livrée sur deux fronts distants de 1 000 km : l’Aksai Chin, au Ladakh, tenu par la Chine et revendiqué par l’Inde, et l’Agence de la frontière du Nord-Est (aujourd’hui l’Arunachal Pradesh), tenue par l’Inde jusqu’à la ligne McMahon et revendiquée par la Chine. Après des années de différends, la fuite du dalaï-lama en Inde en 1959 et la « politique avancée » de l’Inde, qui installait des postes en territoire disputé, la Chine attaqua sur les deux fronts le 20 octobre. Ses troupes submergèrent les positions indiennes sur la Namka Chu et à Tawang et, lors d’une seconde offensive en novembre, prirent Se La, Bomdila et Walong et atteignirent la lisière de la plaine de l’Assam, tandis qu’au Ladakh elles s’emparaient des postes indiens jusqu’à la ligne revendiquée par la Chine. La Chine déclara alors un cessez-le-feu le 21 novembre et se retira à l’est, conservant l’Aksai Chin. La défaite ébranla le gouvernement indien et entraîna un fort accroissement de son armée."
