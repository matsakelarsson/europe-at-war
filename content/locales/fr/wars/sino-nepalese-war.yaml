# French translations of the catalogue text (wave 8); step bodies follow later.
Sino-Nepalese War: Guerre sino-népalaise
"Two Nepalese invasions of Tibet and a Qing counter-invasion of Nepal. Disputes over the silver coins Nepal minted for Tibet, over trade and salt, and over the refuge Nepal gave to the Tenth Shamarpa led the Gorkha kingdom to send armies over the Himalayan passes in 1788. Tibet bought peace in 1789 with a promise of yearly payments, and when it stopped paying the Nepalese invaded again in 1791 and plundered Tashilhunpo, the monastery of the Panchen Lamas at Shigatse. The Qianlong emperor sent an army under Fuk’anggan, which drove the Nepalese out of Tibet in 1792 and advanced down the Trishuli valley to within about 35 km of Kathmandu. After heavy fighting near Betrawati both sides made peace in October 1792: Nepal returned plunder from Tashilhunpo and sent tribute missions to Beijing every five years until 1908, and the Qing tightened their hold on Tibet.": "Deux invasions népalaises du Tibet et une contre-invasion du Népal par les Qing. Des différends portant sur les pièces d’argent que le Népal frappait pour le Tibet, sur le commerce et le sel, ainsi que sur l’asile accordé par le Népal au dixième Shamarpa poussèrent le royaume de Gorkha à envoyer des armées par les cols himalayens en 1788. Le Tibet acheta la paix en 1789 en promettant des versements annuels et, lorsqu’il cessa de payer, les Népalais l’envahirent de nouveau en 1791 et pillèrent Tashilhunpo, le monastère des panchen-lamas à Shigatsé. L’empereur Qianlong envoya une armée commandée par Fuk’anggan, qui chassa les Népalais du Tibet en 1792 et descendit la vallée de la Trishuli jusqu’à environ 35 km de Katmandou. Après de durs combats près de Betrawati, les deux camps firent la paix en octobre 1792 : le Népal restitua le butin de Tashilhunpo et envoya des missions tributaires à Pékin tous les cinq ans jusqu’en 1908, et les Qing renforcèrent leur emprise sur le Tibet."
