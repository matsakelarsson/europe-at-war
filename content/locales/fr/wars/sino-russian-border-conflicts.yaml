# French translations of the catalogue text (wave 9); step bodies follow later.
Sino-Russian border conflicts: Conflits frontaliers sino-russes
? Intermittent fighting between Russian Cossack bands and the Qing empire over the Amur valley, ending with the Treaty of Nerchinsk. From 1650 Yerofey Khabarov and his successor Onufriy Stepanov raided the Daur and Ducher peoples along the Amur for fur tribute and grain. The Qing, who counted these peoples as their tributaries, attacked Khabarov’s winter fort at Achansk in 1652, fought Stepanov on the Sungari in 1654 with the help of Korean musketeers, besieged him at Kumarsk in 1655 and destroyed his flotilla in 1658. The Russians returned in 1665, when a band of fugitives settled at Albazin, which became the centre of Russian farming and tribute-taking on the upper Amur. After crushing the Revolt of the Three Feudatories, the Kangxi emperor built forts at Aigun and besieged Albazin twice, taking it in 1685 and starving its rebuilt fort in 1686. The Treaty of Nerchinsk (6 September 1689), the first between China and a European state, set the border on the Argun river and the Stanovoy watershed; Russia gave up the Amur and gained the right to trade.
: Des combats intermittents entre des bandes de Cosaques russes et l’empire des Qing pour la vallée de l’Amour, qui s’achevèrent par le traité de Nertchinsk. À partir de 1650, Ierofeï Khabarov et son successeur Onoufri Stepanov razzièrent les peuples daur et ducher le long de l’Amour pour en tirer un tribut en fourrures et du grain. Les Qing, qui comptaient ces peuples parmi leurs tributaires, attaquèrent le fort d’hiver de Khabarov à Atchansk en 1652, combattirent Stepanov sur la Soungari en 1654 avec l’aide de mousquetaires coréens, l’assiégèrent à Koumarsk en 1655 et détruisirent sa flottille en 1658. Les Russes revinrent en 1665, lorsqu’une bande de fugitifs s’installa à Albazine, qui devint le centre de l’agriculture et de la collecte du tribut russes sur le haut Amour. Après avoir écrasé la révolte des Trois Feudataires, l’empereur Kangxi fit construire des forts à Aigun et assiégea deux fois Albazine, qu’il prit en 1685, avant de réduire par la faim son fort reconstruit en 1686. Le traité de Nertchinsk (6 septembre 1689), le premier conclu entre la Chine et un État européen, fixa la frontière sur l’Argoun et sur la ligne de partage des eaux des monts Stanovoï ; la Russie renonça à l’Amour et obtint le droit de commercer.
