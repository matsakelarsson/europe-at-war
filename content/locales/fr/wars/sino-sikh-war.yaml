# French translations of the catalogue text (wave 8); step bodies follow later.
Dogra–Tibetan War: Guerre dogra-tibétaine
A war between the Dogra state of Jammu, a vassal of the Sikh Empire, and Tibet, then under the protection of Qing China; it is also called the Sino-Sikh War. Having conquered Ladakh and Baltistan, Gulab Singh’s general Zorawar Singh invaded western Tibet in May 1841 with about 4,000–6,000 men, took Rudok, Gartok and Taklakot, and reached the sacred lake of Manasarovar. In the winter a Tibetan army cut him off, and in December 1841 he was killed and his army destroyed near Taklakot. The Tibetans advanced into Ladakh and besieged Leh, but were driven back by Dogra reinforcements and beaten at Chushul in August 1842. The Treaty of Chushul, agreed in September 1842, restored the old frontier and trade between Ladakh and Tibet.: Une guerre entre l’État dogra du Jammu, vassal de l’Empire sikh, et le Tibet, alors sous la protection de la Chine des Qing ; elle est aussi appelée guerre sino-sikhe. Après avoir conquis le Ladakh et le Baltistan, Zorawar Singh, général de Gulab Singh, envahit le Tibet occidental en mai 1841 avec environ 4 000 à 6 000 hommes, prit Rudok, Gartok et Taklakot et atteignit le lac sacré de Manasarovar. Pendant l’hiver, une armée tibétaine lui coupa la retraite et, en décembre 1841, il fut tué et son armée anéantie près de Taklakot. Les Tibétains avancèrent au Ladakh et assiégèrent Leh, mais furent repoussés par des renforts dogra et battus à Chushul en août 1842. Le traité de Chushul, conclu en septembre 1842, rétablit l’ancienne frontière et le commerce entre le Ladakh et le Tibet.
