# French translations of the catalogue text (wave 9); step bodies follow later.
Sino-Soviet border conflict: Conflit frontalier sino-soviétique
An undeclared conflict between the Soviet Union and the People’s Republic of China along their long border in 1969, the high point of the Sino-Soviet split. On 2 March Chinese troops ambushed a Soviet border patrol on Zhenbao Island (Damansky to the Russians), a small island in the Ussuri River claimed by both, and on 15 March the two sides fought a battle there with tanks and heavy artillery. Clashes followed on the Amur and in Xinjiang, where on 13 August Soviet troops destroyed a Chinese patrol near Lake Zhalanashkol (Tielieketi). Talk of a Soviet strike on China’s nuclear sites brought fears of a wider war, until the Soviet premier Alexei Kosygin met Zhou Enlai at Beijing airport on 11 September and the two governments agreed to negotiate. The conflict pushed China towards its opening to the United States. The border was finally settled by agreements of 1991 and 2004, which gave Zhenbao Island to China.: Un conflit non déclaré entre l’Union soviétique et la République populaire de Chine le long de leur longue frontière en 1969, point culminant de la rupture sino-soviétique. Le 2 mars, des troupes chinoises tendirent une embuscade à une patrouille frontalière soviétique sur l’île Zhenbao (Damanski pour les Russes), une petite île de l’Oussouri revendiquée par les deux pays et, le 15 mars, les deux camps s’y livrèrent une bataille avec chars et artillerie lourde. D’autres accrochages suivirent sur l’Amour et au Xinjiang, où, le 13 août, des troupes soviétiques anéantirent une patrouille chinoise près du lac Zhalanashkol (Tielieketi). Les spéculations sur une frappe soviétique contre les sites nucléaires chinois firent craindre une guerre plus large, jusqu’à ce que le chef du gouvernement soviétique, Alexis Kossyguine, rencontre Zhou Enlai à l’aéroport de Pékin le 11 septembre et que les deux gouvernements acceptent de négocier. Le conflit poussa la Chine vers son ouverture aux États-Unis. La frontière fut finalement fixée par des accords de 1991 et de 2004, qui attribuèrent l’île Zhenbao à la Chine.
