# French translations of the catalogue text (wave 9); step bodies follow later.
Sino-Soviet conflict of 1929: Conflit sino-soviétique de 1929
An undeclared war in northern Manchuria over the Chinese Eastern Railway, the Russian-built line across Manchuria that the Soviet Union and China had run jointly since 1924. In May–July 1929 the Manchurian ruler Zhang Xueliang, who had just joined Chiang Kai-shek’s Nationalist government, raided the Soviet consulate in Harbin, seized the railway and expelled its Soviet managers. The Soviet Union broke off relations and formed a Special Far Eastern Army under Vasily Blyukher, which in October and November destroyed the Chinese river flotilla on the Sungari, took Lahasusu and Fujin, and routed Zhang’s troops at Zhalainuoer and Manzhouli, taking some 8,000 prisoners. By the Khabarovsk Protocol of 22 December China accepted joint management again. The war showed the weakness of the Chinese army in Manchuria, which Japan attacked two years later.: Une guerre non déclarée dans le nord de la Mandchourie pour le chemin de fer de l’Est chinois, la ligne construite par les Russes à travers la Mandchourie, que l’Union soviétique et la Chine exploitaient conjointement depuis 1924. En mai–juillet 1929, le maître de la Mandchourie, Zhang Xueliang, qui venait de se rallier au gouvernement nationaliste de Tchang Kaï-chek, fit perquisitionner le consulat soviétique de Harbin, s’empara du chemin de fer et en expulsa les dirigeants soviétiques. L’Union soviétique rompit les relations et forma une Armée spéciale d’Extrême-Orient commandée par Vassili Blücher, qui, en octobre et novembre, détruisit la flottille fluviale chinoise sur la Soungari, prit Lahasusu et Fujin et mit en déroute les troupes de Zhang à Zhalainuoer et à Manzhouli, faisant quelque 8 000 prisonniers. Par le protocole de Khabarovsk du 22 décembre, la Chine accepta de nouveau la gestion conjointe. La guerre révéla la faiblesse de l’armée chinoise en Mandchourie, que le Japon attaqua deux ans plus tard.
