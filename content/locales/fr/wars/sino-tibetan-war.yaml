# French translations of the catalogue text (wave 9); step bodies follow later.
Sino-Tibetan War: Guerre sino-tibétaine
Two wars between the Dalai Lama’s government and Chinese forces in Kham, the eastern Tibetan borderland, after Tibet expelled the Qing garrison in 1912–1913. In 1918 the Tibetan army under the Kalon Lama Jampa Tendar defeated the Sichuan frontier troops of the Republic of China and took Chamdo, whose garrison surrendered on 29 April; truces mediated by the British consul Eric Teichman at Chamdo and Rongbatsa left Chamdo, Riwoche, Drayab, Markham, Gonjo and Derge with Tibet. In 1930 a dispute between the chief of Beri and the monastery of Dargye brought Tibetan troops east of the upper Yangtze, where they took Kandze and Nyarong, and in 1932 they attacked Qinghai and besieged Jyekundo. Counter-offensives by the Sichuan warlord Liu Wenhui and the Qinghai army of Ma Bufang drove them back across the Yangtze, and truces in 1932–1933 made the river the line between Chinese- and Tibetan-held Kham until 1950.: Deux guerres entre le gouvernement du dalaï-lama et les forces chinoises dans le Kham, les marches orientales du Tibet, après l’expulsion de la garnison Qing par le Tibet en 1912–1913. En 1918, l’armée tibétaine commandée par le Kalon Lama Jampa Tendar battit les troupes frontalières du Sichuan de la République de Chine et prit Chamdo, dont la garnison se rendit le 29 avril ; des trêves négociées par le consul britannique Eric Teichman à Chamdo et à Rongbatsa laissèrent Chamdo, Riwoche, Drayab, Markham, Gonjo et Derge au Tibet. En 1930, un différend entre le chef de Beri et le monastère de Dargye amena les troupes tibétaines à l’est du haut Yangzi, où elles prirent Kandze et Nyarong, et en 1932 elles attaquèrent le Qinghai et assiégèrent Jyekundo. Les contre-offensives du seigneur de la guerre du Sichuan Liu Wenhui et de l’armée du Qinghai de Ma Bufang les repoussèrent au-delà du Yangzi, et des trêves conclues en 1932–1933 firent du fleuve la ligne de partage entre le Kham tenu par les Chinois et celui tenu par les Tibétains jusqu’en 1950.
