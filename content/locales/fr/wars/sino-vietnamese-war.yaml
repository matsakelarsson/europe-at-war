# French translations of the catalogue text (wave 11); step bodies follow later.
Sino-Vietnamese War: Guerre sino-vietnamienne
China’s invasion of northern Vietnam in February–March 1979 and the border war that followed until 1991. Relations between the former allies had broken down over Vietnam’s alliance with the Soviet Union, its treatment of its ethnic Chinese, who fled in their hundreds of thousands in 1978, disputed borders and islands, and above all its invasion of Cambodia, China’s ally. On 17 February 1979 some 200,000 Chinese troops attacked along the whole border to “teach Vietnam a lesson”, in Deng Xiaoping’s words. They took the provincial capitals of Lào Cai, Cao Bằng and Lạng Sơn against fierce resistance from Vietnamese border troops and militia, then announced their withdrawal on 5 March and left by 16 March, destroying what they could. Both sides claimed victory. Vietnam did not leave Cambodia, and for ten more years the two armies shelled each other and fought for hilltops along the border, most heavily at Vị Xuyên (Laoshan) in 1984–1989. Relations were normalised in November 1991.: L’invasion du nord du Vietnam par la Chine en février–mars 1979 et la guerre frontalière qui suivit jusqu’en 1991. Les relations entre les anciens alliés s’étaient dégradées en raison de l’alliance du Vietnam avec l’Union soviétique, du sort qu’il réservait à sa minorité chinoise, qui s’enfuit par centaines de milliers en 1978, de frontières et d’îles contestées, et surtout de son invasion du Cambodge, allié de la Chine. Le 17 février 1979, quelque 200 000 soldats chinois attaquèrent sur toute la longueur de la frontière pour « donner une leçon au Vietnam », selon les mots de Deng Xiaoping. Ils prirent les chefs-lieux provinciaux de Lào Cai, de Cao Bằng et de Lạng Sơn face à une résistance acharnée des troupes frontalières et des milices vietnamiennes, puis annoncèrent leur retrait le 5 mars et achevèrent de se retirer le 16 mars, détruisant tout ce qu’ils pouvaient. Les deux camps revendiquèrent la victoire. Le Vietnam ne quitta pas le Cambodge, et pendant dix ans encore les deux armées se bombardèrent et se disputèrent des collines le long de la frontière, le plus durement à Vị Xuyên (Laoshan) en 1984–1989. Les relations furent normalisées en novembre 1991.
