# French translations of the catalogue text (wave 9); step bodies follow later.
Six-Day War (1899): Guerre des Six Jours (1899)
? A brief war in April 1899 between British forces and the clans of the New Territories of Hong Kong, which China had leased to Britain for 99 years by the Convention of Peking of June 1898. Fearing the loss of their land rights, the powerful lineages of the Punti villages, led by the Tang clan, raised a militia of some 2,600 men. On 14 April 1899 they burned the matsheds put up for the flag-raising ceremony at Tai Po; British and Indian troops sent there were besieged on Flagstaff Hill until the destroyer HMS Fame shelled the militia. The British then drove the militia from Lam Tsuen and Sheung Tsuen on 17 and 18 April, and the villages surrendered on 19 April. About 500 militiamen were killed; the British suffered only a few wounded. The gates of the Tang walled village of Kat Hing Wai were removed and taken to the governor’s house in Ireland. In May British troops also expelled the Chinese officials from the Kowloon Walled City. Governor Henry Blake afterwards chose conciliation, and the villagers’ customary land and inheritance rights were respected under British rule.
: Une brève guerre, en avril 1899, entre les forces britanniques et les clans des Nouveaux Territoires de Hong Kong, que la Chine avait cédés à bail à la Grande-Bretagne pour 99 ans par la convention de Pékin de juin 1898. Craignant de perdre leurs droits fonciers, les puissants lignages des villages punti, menés par le clan Tang, levèrent une milice de quelque 2 600 hommes. Le 14 avril 1899, ils incendièrent les abris de nattes dressés à Tai Po pour la cérémonie du lever du drapeau ; les troupes britanniques et indiennes envoyées sur place furent assiégées sur Flagstaff Hill jusqu’à ce que le destroyer HMS Fame bombarde la milice. Les Britanniques chassèrent ensuite la milice de Lam Tsuen et de Sheung Tsuen les 17 et 18 avril, et les villages se rendirent le 19 avril. Environ 500 miliciens furent tués ; les Britanniques ne comptèrent que quelques blessés. Les portes de Kat Hing Wai, le village fortifié des Tang, furent démontées et emportées dans la demeure du gouverneur en Irlande. En mai, les troupes britanniques expulsèrent aussi les fonctionnaires chinois de la citadelle de Kowloon. Le gouverneur Henry Blake choisit ensuite la conciliation, et les droits coutumiers des villageois en matière de terres et d’héritage furent respectés sous la domination britannique.
