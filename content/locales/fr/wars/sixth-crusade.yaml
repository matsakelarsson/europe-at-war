# Some French text was translated automatically.
"Sixth Crusade": "Sixième croisade"
"The crusade of the emperor Frederick II, who had married the heiress of the Kingdom of Jerusalem and sailed east in 1228 while excommunicated by Pope Gregory IX. Without fighting a battle, he negotiated the Treaty of Jaffa with the Ayyubid sultan al-Kamil on 18 February 1229, which returned Jerusalem, Bethlehem, Nazareth and a corridor to the coast to the kingdom for ten years, while the Muslims kept the Temple Mount. Frederick crowned himself in the Church of the Holy Sepulchre on 18 March 1229 and hurried home in May, as papal troops had invaded his Kingdom of Sicily.": "La croisade de l’empereur Frédéric II, qui avait épousé l’héritière du Royaume de Jérusalem et a navigué à l’est en 1228 tout en excommunié par le pape Grégoire IX. Sans combattre, il négocia le traité de Jaffa avec le sultan ayyoubid al-Kamil le 18 février 1229, qui retourna Jérusalem, Bethléem, Nazareth et un couloir vers la côte du royaume pendant dix ans, tandis que les musulmans gardaient le mont du Temple. Frederick s’est couronné dans l’église du Saint-Sépulcre le 18 mars 1229 et s’est précipité chez lui en mai, alors que les troupes papales avaient envahi son Royaume de Sicile."
"The treaty was unpopular on both sides. Many Muslims condemned al-Kamil for giving up Jerusalem, and the patriarch of Jerusalem and the military orders rejected an agreement made by an excommunicated emperor. Jerusalem, left unwalled, was lost again in 1244.": "De nombreux musulmans ont condamné Al-Kamil pour avoir abandonné Jérusalem, et le patriarche de Jérusalem et les ordres militaires ont rejeté un accord conclu par un empereur excommunié. Jérusalem, laissée sans mur, a été à nouveau perdue en 1244."
"Frederick’s wars with the papacy and the Lombard cities are told under Frederick II and the Lombard League.": "Les guerres de Frédéric avec la papauté et les villes lombardes sont racontées sous Frederick II et la Lombard League."
