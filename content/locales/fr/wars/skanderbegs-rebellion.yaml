"Skanderbeg’s rebellion": "La rébellion de Skanderbeg"
"The Albanian revolt against the Ottomans led by Gjergj Kastrioti, called Skanderbeg, a former Ottoman commander who seized Krujë in 1443. With the League of Lezhë, and later with help from Naples, the papacy and Venice, he held the mountains of northern and central Albania for a quarter of a century, beating several Ottoman armies and twice seeing sultans fail before Krujë. After his death in 1468 the struggle went on under Venetian leadership until Krujë fell in 1478 and Venice gave up Shkodër in 1479.": "La révolte albanaise contre les Ottomans dirigée par Gjergj Kastrioti, appelé Skanderbeg, un ancien commandant ottoman qui a saisi Krujë en 1443. Avec la Ligue de Lezhë, puis avec l’aide de Naples, la papauté et Venise, il a tenu les montagnes du nord et du centre de l’Albanie pendant un quart de siècle, battant plusieurs armées ottomanes et voyant deux fois les sultans échouer avant Krujë. Après sa mort en 1468, la lutte se poursuivit sous la direction vénitienne jusqu’à ce que Krujë tombe en 1478 et Venise abandonne Shkodër en 1479."
"The main narrative source, Marin Barleti’s life of Skanderbeg written about forty years after his death, is a heroic biography, and its figures for Ottoman armies and losses, often repeated, are much exaggerated. Modern estimates are given here where they exist; Ottoman, Venetian and Ragusan documents give a more sober picture.": "La principale source narrative, Marin Barleti, la vie de Skanderbeg écrite environ quarante ans après sa mort, est une biographie héroïque, et ses chiffres pour les armées ottomanes et les pertes, souvent répétées, sont beaucoup exagérés. Les estimations modernes sont données ici où elles existent ; les documents ottomans, vénitiens et ragusains donnent une image plus sobre."
"The League of Lezhë was a loose alliance of noble families. Several of its members, including Skanderbeg’s own nephew Hamza, changed sides at times, and Venice fought against Skanderbeg in 1447–1448 before becoming his ally in 1463.": "La Ligue de Lezhë était une alliance lâche de familles nobles. Plusieurs de ses membres, dont le neveu de Skanderbeg, Hamza, ont parfois changé de camp et Venise a combattu contre Skanderbeg en 1447–1448 avant de devenir son allié en 1463."
