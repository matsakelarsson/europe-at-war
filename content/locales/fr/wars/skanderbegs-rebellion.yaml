"1443–1450": "1443–1450"
"Skanderbeg, son of the Albanian lord Gjon Kastrioti, had been sent to the Ottoman court as a hostage and rose high in the sultan’s service. In November 1443, during the Hungarian crusade, he left the Ottoman army with a few hundred Albanians, and on 28 November he took Krujë, his family’s old stronghold, with a forged order from the sultan. He returned to Christianity and raised a red flag with a black double-headed eagle. On 2 March 1444, at Venetian-held Lezhë, the leading Albanian families formed an alliance under his command, known as the League of Lezhë.": "Skanderbeg, fils du seigneur albanais Gjon Kastrioti, avait été envoyé à la cour ottomane comme un otage et s’était élevé dans le service du sultan. En novembre 1443, pendant la croisade hongroise, il a quitté l’armée ottomane avec quelques centaines d’Albanais, et le 28 novembre, il a pris Krujë, sa vieille forteresse familiale, avec un ordre faux du sultan. Il retourna au christianisme et porta un drapeau rouge avec un aigle noir à double tête. Le 2 mars 1444, à Lezhë tenu par Vénitien, les principales familles albanaises formèrent une alliance sous son commandement, connue sous le nom de Ligue de Lezhë."
"On 29 June 1444 Skanderbeg defeated an Ottoman army at Torvioll, using a force hidden in the woods to fall on its flank, and in 1446 he won again at Otonetë. A quarrel over the inheritance of the fortress of Dagnum led to war with Venice in 1447–1448, while the Ottomans took the border fortress of Svetigrad in 1448 and Berat in 1450. In May 1450 Murad II himself, with his son Mehmed, besieged Krujë. While Vrana Konti held the castle, Skanderbeg harried the besiegers from the mountains, and in the autumn, after costly assaults had failed, Murad withdrew.": "Le 29 juin 1444 Skanderbeg battit une armée ottomane à Torvioll, utilisant une force cachée dans les bois pour tomber sur son flanc, et en 1446 il gagna de nouveau à Otonetë. Une querelle sur l’héritage de la forteresse de Dagnum conduisit à la guerre avec Venise en 1447–1448, tandis que les Ottomans prirent la forteresse frontière de Svetigrad en 1448 et Berat en 1450. En mai 1450 Murad II lui-même, avec son fils Mehmed, assiégeait Krujë. Alors que Vrana Konti tenait le château, Skanderbeg harcelait les assiégés des montagnes, et à l’automne, après l’échec des assauts coûteux, Murad se retira."
