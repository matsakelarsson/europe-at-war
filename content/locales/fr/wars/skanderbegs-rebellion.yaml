"1468–1479": "1468–1479"
"In January 1468 Skanderbeg called the remaining Albanian lords to Lezhë to plan the war, but he fell ill, perhaps with malaria, and died there on 17 January, aged about 62. His widow and young son fled to Italy, and Venice took over Krujë and carried on the war with the help of Albanian and Montenegrin lords such as Lekë Dukagjini and Ivan Crnojević. In 1474 the Ottomans besieged Venetian Shkodër for three months without success.": "En janvier 1468, Skanderbeg appela à Lezhë les autres seigneurs albanais pour planifier la guerre, mais il tomba malade, peut-être avec le paludisme, et y mourut le 17 janvier, âgé d’environ 62 ans. Sa veuve et son jeune fils s’enfuirent en Italie, et Venise prit Krujë et poursuivit la guerre avec l’aide de seigneurs albanais et monténégrins tels que Lekë Dukagjini et Ivan Crnojević. En 1474, les Ottomans assiégèrent Vénitien Shkodër pendant trois mois sans succès."
"In 1477 Ottoman troops blockaded Krujë, and in September they routed a Venetian and Albanian relief army. Starving, the town surrendered on 15 or 16 June 1478, and many of its defenders are said to have been killed despite promises of safety. Mehmed II then besieged Shkodër in person; its small garrison beat off five great assaults in July, so the sultan took the nearby forts of Žabljak, Drisht and Lezhë, left an army to blockade the town and went home. In the peace of 25 January 1479 Venice gave up Shkodër, and in April its surviving defenders sailed for Venice. Of Venetian Albania only Durrës and a few coastal places were left.": "En 1477 les troupes ottomanes ont bloqué Krujë, et en septembre ils ont dirigé une armée de secours vénitienne et albanaise. Fâchée, la ville s’est rendue le 15 ou 16 juin 1478, et beaucoup de ses défenseurs auraient été tués en dépit des promesses de sécurité. Mehmed II assiégea alors Shkodër en personne ; sa petite garnison battit cinq grands assauts en juillet, et le sultan prit les forts voisins de Žabljak, Drisht et Lezhë, quitta une armée pour bloquer la ville et rentra chez lui. De l’Albanie vénitienne il ne restait que Durrës et quelques places côtières."
