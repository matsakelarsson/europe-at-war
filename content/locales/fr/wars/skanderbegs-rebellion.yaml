"1451–1467": "1451–1467"
"Short of money after the siege, Skanderbeg allied with King Alfonso V of Naples by the Treaty of Gaeta in March 1451, accepting him as overlord in return for troops and supplies. In 1455 he lost much of his cavalry in a surprise attack while besieging Berat, and in 1456 his nephew Hamza, who had lost hope of succeeding him, went over to the Ottomans. In 1457 a large Ottoman army under Isa Bey and Hamza ravaged the lowlands and camped at Albulena (Ujëbardha), between Lezhë and Krujë. Having hidden in the mountains for weeks, Skanderbeg fell on the camp on 2 September and routed the army. Pope Calixtus III named him captain-general of the Holy See.": "En 1455, il perd une grande partie de sa cavalerie lors d’une attaque surprise en assiégeant Berat, et en 1456 son neveu Hamza, qui avait perdu espoir de le succéder, passe aux Ottomans. En 1457, une grande armée ottomane sous Isa Bey et Hamza ravagea les basses terres et campa à Albulena (Ujëbardha), entre Lezhë et Krujë. Ayant caché dans les montagnes pendant des semaines, Skanderbeg tomba sur le camp le 2 septembre et roula l’armée."
"After an expedition to Italy in 1460–1462 to help Alfonso’s son Ferdinand against his rivals, and a short-lived truce with Mehmed in the spring of 1463, Skanderbeg returned to war later that year, now allied with Venice. In 1466 Mehmed II besieged Krujë in person and, when it held, built the fortress of Elbasan in the plain to keep it under pressure. Skanderbeg, back from seeking aid in Rome and Naples, attacked the besiegers with Lekë Dukagjini in April 1467; their commander Ballaban Pasha was killed on 23 April, and the siege was broken. Mehmed came back that summer and laid waste much of the country, but Krujë still held.": "Après une expédition en Italie en 1460–1462 pour aider le fils d’Alfonso-Ferdinand contre ses rivaux, et une trêve de courte durée avec Mehmed au printemps de 1463, Skanderbeg retourna à la guerre plus tard cette année-là, maintenant allié avec Venise. En 1466 Mehmed II assiégea en personne Krujë et, lorsqu’il tenait, construisit la forteresse d’Elbasan dans la plaine pour la maintenir sous pression. Skanderbeg, de retour à la recherche d’aide à Rome et Naples, attaqua les assiégés avec Lekë Dukagjini en avril 1467 ; leur commandant Ballaban Pasha fut tué le 23 avril et le siège fut brisé. Mehmed est revenu cet été et a gâché une grande partie du pays, mais Krujë tenait toujours."
