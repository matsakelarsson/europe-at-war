# French translations of the catalogue text (wave 9); step bodies follow later.
Small Swords Society uprising: Soulèvement de la Société des petites épées
? Risings of the Small Swords Society, a branch of the Heaven and Earth Society (Tiandihui) secret societies, in Fujian and Shanghai during the Taiping Rebellion. In May 1853 the society took Xiamen (Amoy) and nearby towns, holding Xiamen until Qing forces retook it in November 1853. On 7 September 1853 its members in Shanghai, led by Liu Lichuan and mostly from Guangdong and Fujian, seized the walled Chinese city, killed the magistrate and drove out the intendant Wu Jianzhang. They proclaimed a restored Ming state and wrote to the Taiping, who never sent help. Qing troops besieged the city for seventeen months, while thousands of refugees crowded into the foreign settlements outside its walls. The British and Americans at first stayed neutral, and in April 1854 their volunteers fought Qing troops who threatened the settlements at the Battle of Muddy Flat; the French joined the siege in December 1854 and January 1855, and the rebels abandoned the city on the night of 17 February 1855. Liu Lichuan was killed, and the Qing executed many of those who stayed behind.
: Soulèvements de la Société des petites épées, une branche des sociétés secrètes de la Société du Ciel et de la Terre (Tiandihui), au Fujian et à Shanghai pendant la révolte des Taiping. En mai 1853, la société prit Xiamen (Amoy) et des villes voisines, et tint Xiamen jusqu’à sa reprise par les forces Qing en novembre 1853. Le 7 septembre 1853, ses membres à Shanghai, menés par Liu Lichuan et venus pour la plupart du Guangdong et du Fujian, s’emparèrent de la ville chinoise fortifiée, tuèrent le magistrat et chassèrent l’intendant Wu Jianzhang. Ils proclamèrent un État Ming restauré et écrivirent aux Taiping, qui n’envoyèrent jamais d’aide. Les troupes Qing assiégèrent la ville pendant dix-sept mois, tandis que des milliers de réfugiés s’entassaient dans les concessions étrangères, hors de ses murs. Les Britanniques et les Américains restèrent d’abord neutres et, en avril 1854, leurs volontaires combattirent les troupes Qing qui menaçaient les concessions lors de la bataille de Muddy Flat ; les Français se joignirent au siège en décembre 1854 et janvier 1855, et les rebelles abandonnèrent la ville dans la nuit du 17 février 1855. Liu Lichuan fut tué, et les Qing exécutèrent nombre de ceux qui étaient restés.
