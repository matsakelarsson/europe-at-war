"Smolensk War": "Guerre de Smolensk"
"In 1632, during the interregnum after the death of Sigismund III and as the Truce of Deulino neared its end, Russia sent an army under Mikhail Shein to retake Smolensk. The new Polish king, Władysław IV, relieved the city in 1633 and surrounded Shein’s army, which surrendered early in 1634. At Polyanovka that June Russia accepted the Deulino border with small changes and paid Władysław to give up his claim to the Russian throne.": "En 1632, au cours de l’interrègne après la mort de Sigismond III et alors que la trêve de Deulino s’approchait de sa fin, la Russie envoya une armée sous Mikhail Shein pour reprendre Smolensk. Le nouveau roi polonais, Władysław IV, soulagée la ville en 1633 et encerclé l’armée de Shein, qui se rendit au début de 1634. A Polyanovka que juin la Russie a accepté la frontière Deulino avec de petits changements et payé Władysław pour renoncer à sa revendication au trône russe."
"Dates are New Style (Gregorian); Russian sources give them ten days earlier.": "Les dates sont New Style (Gregorian) ; les sources russes leur donnent dix jours plus tôt."
"Smolensk, Dorogobuzh, Bely (Belaya) and Vyazma are today in Russia; Polotsk and Orsha are in Belarus.": "Smolensk, Dorogobuzh, Bely (Belaya) et Vyazma sont aujourd'hui en Russie ; Polotsk et Orsha sont en Biélorussie."
