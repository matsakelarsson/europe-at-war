"The siege of Smolensk": "Le siège de Smolensk"
"October 1632 – October 1633": "octobre 1632 – octobre 1633"
"The Truce of Deulino of 1618 had left Smolensk and the Chernihiv and Siverian lands to Poland–Lithuania, and it was due to run out in 1633. When King Sigismund III died in April 1632, Russia decided not to wait for a new king to be elected. The war was pressed by Patriarch Filaret, the tsar’s father, and in early October an army of some 30,000–35,000 men crossed the border under Mikhail Shein, who had defended Smolensk against the Poles in 1609–1611. Eight of its regiments, about half the army, had been raised and drilled on the Western model under foreign officers.": "La Trêve de Deulino de 1618 avait quitté Smolensk et les terres Chernihiv et Siverian en Pologne-Lituanie, et elle devait s’épuiser en 1633. Lorsque le roi Sigismund III mourut en avril 1632, la Russie décida de ne pas attendre qu’un nouveau roi soit élu. Au début d’octobre, une armée de quelque 30 000 à 35 000 hommes franchit la frontière sous Mikhail Shein, qui avait défendu Smolensk contre les Polonais en 1609–1611. Huit de ses régiments, soit environ la moitié de l’armée, avaient été levés et forés sur le modèle occidental sous la direction d’officiers étrangers."
"Shein took Dorogobuzh and other border towns and on 28 October began the siege of Smolensk, held by about 3,000 soldiers and local nobles. His heavy guns came only in December and March. Mines brought down part of the wall, but assaults failed, and Lithuanian troops under Krzysztof Radziwiłł raided his supply lines and slipped men into the city. In August 1633 the new king, Władysław IV, arrived with a relief army of about 20,000–25,000, joined in September by thousands of Zaporozhian Cossacks. His troops took the Russian siege works one by one, and by 4 October the siege was broken.": "Shein a pris Dorogobuzh et d’autres villes frontalières et le 28 octobre a commencé le siège de Smolensk, tenu par environ 3000 soldats et nobles locaux. Ses armes lourdes sont venues seulement en Décembre et Mars. Mines ont fait tomber une partie du mur, mais les attaques ont échoué, et les troupes lituaniennes sous Krzysztof Radziwiłł ont attaqué ses lignes d’approvisionnement et glissé des hommes dans la ville. En août 1633, le nouveau roi, Władysław IV, arriva avec une armée de secours d’environ 20 000 à 25 000 hommes, rejoint en septembre par des milliers de cosaques zaporozhiens. Ses troupes prirent les travaux de siège russe un par un et le 4 octobre le siège fut brisé."
