"Shein’s surrender and the Peace of Polyanovka": "La capitulation et la paix de Polyanovka"
"October 1633 – June 1634": "octobre 1633 – juin 1634"
"Shein pulled his army back into its fortified camp, and by mid-October it was surrounded. No help came. Polish and Cossack cavalry raided far behind his lines, and Polish–Lithuanian troops retook Dorogobuzh with its stores. Crimean Tatar raids on southern Russia led many servicemen from the south to desert to defend their homes, the foreign officers quarrelled, and disease spread through the camp. Shein opened talks in January. Under the surrender signed on 25 February 1634 his men marched out on 1 March, laid their banners before the king and left most of their guns behind. Over 4,000 of the 12,000 or so who were left, most of the foreigners among them, entered Polish service.": "Shein a ramené son armée dans son camp fortifié, et à la mi-octobre il était encerclé. Aucune aide n’est venue. La cavalerie polonaise et cosaque a fait une descente loin derrière ses lignes, et les troupes polonaises-lithuanes ont repris Dorogobuzh avec ses magasins. Les raids Tatar de Crimée sur le sud de la Russie ont conduit de nombreux militaires du sud à déserter pour défendre leurs maisons, les officiers étrangers se sont querelles, et la maladie s’est répandue dans le camp. Shein ouvrit des pourparlers en janvier. Sous la capitulation signée le 25 février 1634, ses hommes partirent le 1er mars, posèrent leurs bannières devant le roi et laissèrent la plupart de leurs canons derrière eux. Plus de 4 000 des 12 000 qui furent laissés, la plupart des étrangers parmi eux, entrèrent dans le service polonais."
"In Moscow Shein and his deputy Artemy Izmailov were accused of treason and beheaded in April. Władysław marched east, but his siege of Belaya failed, an Ottoman army was gathering on the Commonwealth’s southern border, and the Sejm wanted peace. Talks began on 30 April, and the treaty was signed on 14 June at Semlevo on the Polyanovka river. Russia gave up its claim to Smolensk and paid 20,000 rubles, and Władysław renounced the Russian throne, to which he had been elected in 1610. He also handed over the border town of Serpeysk. Smolensk stayed Polish–Lithuanian for another twenty years.": "À Moscou, Shein et son adjoint Artemy Izmailov furent accusés de trahison et décapités en avril. Władysław marcha vers l’est, mais son siège de Belaya échoua, une armée ottomane se rassembla sur la frontière sud du Commonwealth, et le Sejm voulut la paix. Les pourparlers commencèrent le 30 avril, et le traité fut signé le 14 juin à Semlevo sur la rivière Polyanovka. La Russie a renoncé à sa réclamation à Smolensk et payé 20 000 roubles, et Władysław a renoncé au trône russe, auquel il avait été élu en 1610. Il a également remis la ville frontalière de Serpeysk. Smolensk est resté polonais-lituanien pendant vingt ans."
