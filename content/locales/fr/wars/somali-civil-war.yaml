# French translations of the catalogue text (wave 12); step bodies follow later.
Somali Civil War (1991–2006): Guerre civile somalienne (1991–2006)
? "The collapse of the Somali state and the fifteen years of war, famine and failed peace efforts that followed. When clan-based rebel movements drove Mohamed Siad Barre from Mogadishu in January 1991, the victors fell out: the United Somali Congress split between Ali Mahdi Muhammad and Mohamed Farrah Aidid, whose battle for the capital killed thousands, while the north-west declared itself independent as Somaliland. War and drought caused the famine of 1991–1992, in which some 200,000–300,000 people died, most in the farming lands between the Juba and Shebelle rivers. A US-led force (UNITAF) secured relief from December 1992, but its UN successor, UNOSOM II, was drawn into war with Aidid; after the battle of Mogadishu on 3–4 October 1993, in which 18 American soldiers and hundreds of Somalis were killed, the United States and then the UN withdrew. For a decade Somalia had no central government: Puntland and other regions set up their own administrations, and a series of peace conferences produced governments that could not govern. In 2006 the Islamic Courts Union defeated the faction leaders of Mogadishu, often called warlords, and took most of the south, which led to the Ethiopian intervention of December 2006."
: "L’effondrement de l’État somalien et les quinze années de guerre, de famine et d’efforts de paix infructueux qui suivirent. Lorsque des mouvements rebelles à base clanique chassèrent Mohamed Siad Barre de Mogadiscio, en janvier 1991, les vainqueurs se divisèrent : le Congrès somalien uni se scinda entre Ali Mahdi Muhammad et Mohamed Farrah Aidid, dont la bataille pour la capitale fit des milliers de morts, tandis que le nord-ouest se proclamait indépendant sous le nom de Somaliland. La guerre et la sécheresse provoquèrent la famine de 1991–1992, qui fit quelque 200 000–300 000 morts, pour la plupart dans les terres agricoles situées entre le Djouba et le Chébéli. Une force dirigée par les États-Unis (UNITAF) protégea l’acheminement de l’aide à partir de décembre 1992, mais l’opération de l’ONU qui lui succéda, l’ONUSOM II, fut entraînée dans une guerre contre Aidid ; après la bataille de Mogadiscio des 3 et 4 octobre 1993, où furent tués 18 soldats américains et des centaines de Somaliens, les États-Unis puis l’ONU se retirèrent. Pendant une décennie, la Somalie n’eut pas de gouvernement central : le Puntland et d’autres régions se dotèrent de leurs propres administrations, et une série de conférences de paix donna naissance à des gouvernements incapables de gouverner. En 2006, l’Union des tribunaux islamiques battit les chefs de faction de Mogadiscio, souvent appelés seigneurs de guerre, et prit la majeure partie du sud, ce qui entraîna l’intervention éthiopienne de décembre 2006."
