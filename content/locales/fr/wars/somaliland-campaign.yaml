# French translations of the catalogue text (wave 12); step bodies follow later.
Somaliland campaign (the Dervish War): Campagne du Somaliland (guerre des derviches)
? Twenty years of war between the Dervish movement of Mohammed Abdullah Hassan and the British, Italian and Ethiopian empires in the Somali lands. Hassan, a Somali religious teacher of the Salihiyya order, began preaching against foreign rule at Berbera in 1895 and in 1899 gathered several thousand armed men at Burao and called for a holy war; his followers called themselves daraawiish (dervishes), and the British called him the “Mad Mullah”. Four British expeditions, two of them with Ethiopian armies, failed to destroy him between 1901 and 1904, although his forces were beaten at Jidballi in January 1904. After a truce under Italian protection (1905) the Dervishes returned to the Nugal valley, built stone forts at Taleh and elsewhere, and in 1910 drove the British back to the coast, which left the interior to raiding and famine. In January and February 1920 a British campaign led by twelve aircraft of the Royal Air Force took the Dervish forts and Taleh, and Hassan died in the Ethiopian Ogaden at the end of the year. Estimates of the deaths in the war years, most of them from raiding, hunger and disease, run to about a third of the population of British Somaliland.
: Vingt années de guerre entre le mouvement derviche de Mohammed Abdullah Hassan et les empires britannique, italien et éthiopien dans les terres somalies. Hassan, maître religieux somali de la confrérie Salihiyya, commença à prêcher contre la domination étrangère à Berbera en 1895 et, en 1899, rassembla plusieurs milliers d’hommes armés à Burao et appela à la guerre sainte ; ses partisans se nommaient eux-mêmes daraawiish (derviches), et les Britanniques l’appelaient le « Mollah fou ». Entre 1901 et 1904, quatre expéditions britanniques, dont deux avec des armées éthiopiennes, ne parvinrent pas à l’anéantir, bien que ses forces aient été battues à Jidballi en janvier 1904. Après une trêve sous protection italienne (1905), les derviches regagnèrent la vallée du Nugal, bâtirent des forts de pierre à Taleh et ailleurs et, en 1910, repoussèrent les Britanniques vers la côte, ce qui abandonna l’intérieur aux razzias et à la famine. En janvier et février 1920, une campagne britannique menée par douze avions de la Royal Air Force s’empara des forts derviches et de Taleh, et Hassan mourut dans l’Ogaden éthiopien à la fin de l’année. Les estimations des morts de ces années de guerre, dues pour la plupart aux razzias, à la faim et aux maladies, atteignent environ un tiers de la population du Somaliland britannique.
