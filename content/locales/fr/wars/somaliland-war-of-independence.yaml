# French translations of the catalogue text (wave 12); step bodies follow later.
Somaliland War of Independence: Guerre d’indépendance du Somaliland
? The war of the Somali National Movement (SNM), drawn mainly from the Isaaq clans of north-western Somalia, against the government of Mohamed Siad Barre. Founded in London in 1981, the SNM fought from bases in Ethiopia until a peace deal between Siad Barre and Mengistu Haile Mariam in April 1988 forced it out. In May 1988 it attacked Burao and Hargeisa. The government answered by shelling and bombing the cities, which were largely destroyed, and by killing Isaaq civilians across the north; estimates of the dead range from 50,000 to 100,000, with some as high as 200,000, and up to half a million people fled to Ethiopia. A UN investigation in 2001 concluded that genocide had been committed against the Isaaq. The SNM fought on in the countryside, and when Siad Barre fell in January 1991 it took control of the north. On 18 May 1991 a conference of the northern clans at Burao declared the former British Somaliland independent as the Republic of Somaliland. Somalia regards it as part of its territory; Israel, in December 2025, was the first UN member state to recognise it.
: La guerre du Mouvement national somalien (SNM), recruté principalement parmi les clans isaaq du nord-ouest de la Somalie, contre le gouvernement de Mohamed Siad Barre. Fondé à Londres en 1981, le SNM combattit depuis des bases en Éthiopie jusqu’à ce qu’un accord de paix entre Siad Barre et Mengistu Haile Mariam, en avril 1988, l’oblige à les quitter. En mai 1988, il attaqua Burao et Hargeisa. Le gouvernement riposta en pilonnant et en bombardant les villes, qui furent en grande partie détruites, et en tuant des civils isaaq dans tout le nord ; les estimations du nombre de morts vont de 50 000 à 100 000, certaines atteignant 200 000, et jusqu’à un demi-million de personnes s’enfuirent en Éthiopie. Une enquête de l’ONU conclut en 2001 qu’un génocide avait été commis contre les Isaaq. Le SNM poursuivit la lutte dans les campagnes et, à la chute de Siad Barre en janvier 1991, prit le contrôle du nord. Le 18 mai 1991, une conférence des clans du nord réunie à Burao proclama l’indépendance de l’ancien Somaliland britannique sous le nom de République du Somaliland. La Somalie le considère comme faisant partie de son territoire ; en décembre 2025, Israël fut le premier État membre de l’ONU à le reconnaître.
