"Sonderbund War": "Guerre de Sonderbund"
"A short civil war in Switzerland between the Federal Diet and the Sonderbund, a defensive league of seven Catholic and conservative cantons. The federal army under General Guillaume Henri Dufour forced the league’s members to surrender one by one in under four weeks, with fewer than 100 dead, and the constitution of 1848 turned the loose confederation into a federal state.": "Une courte guerre civile en Suisse entre la Diète Fédérale et le Sonderbund, ligue défensive de sept cantons catholiques et conservateurs. L’armée fédérale du général Guillaume Henri Dufour força les membres de la Ligue à se rendre un par un en moins de quatre semaines, avec moins de 100 morts, et la constitution de 1848 transforma la confédération lâche en État fédéral."
"The Sonderbund (“separate alliance”) was its opponents’ name for the league, which called itself a protective union (Schutzvereinigung). Unterwalden is today the two cantons of Obwalden and Nidwalden.": "Le Sonderbund () était son nom d’opposant pour la ligue, qui s’appelle une union protectrice (Schutzvereinigung). Unterwalden est aujourd'hui les deux cantons d’Obwalden et Nidwalden."
"Neuchâtel, then both a Swiss canton and a principality of the King of Prussia, and Appenzell Innerrhoden stayed neutral and sent no troops.": "Neuchâtel, alors canton suisse et principauté du roi de Prusse, et Appenzell Innerrhoden sont restés neutres et n’ont envoyé aucune troupe."
