"15 November 1847 – 12 September 1848": "15 novembre 1847 – 12 septembre 1848"
"Dufour now marched his army against central Switzerland. On 17 November troops from Uri pushed down into Ticino and took Airolo, but the advance stalled near Biasca. Zug voted to surrender on 21 November without a fight. On 23 November five federal columns converged on Lucerne, and the Sonderbund council and Lucerne’s government withdrew to Uri. At Gisikon on the Reuss the Sonderbund army held a wooded height against two assaults before Colonel Eduard Ziegler led his division up it. It was the bloodiest fight of the war and the last pitched battle fought by Swiss troops.": "Le 17 novembre, les troupes d’Uri ont poussé vers le Tessin et pris Airolo, mais l’avancée s’est arrêtée près de Biasca. Zug a voté pour se rendre le 21 novembre sans se battre. Le 23 novembre, cinq colonnes fédérales ont convergé vers Lucerne, et le conseil Sonderbund et le gouvernement Lucerne's se sont retirés à Uri. A Gisikon sur la Reuss l’armée Sonderbund tenait une hauteur boisée contre deux assauts avant que le colonel Eduard Ziegler ne mène sa division vers le haut. C’était la lutte la plus sanglante de la guerre et la dernière bataille lancée par les troupes suisses."
"Federal troops entered Lucerne on 24 November. The Sonderbund council broke up at Flüelen two days later; Unterwalden, Schwyz and Uri gave in, and Valais, the last, surrendered on 29 November. Later research counts about 60 federal and 33 Sonderbund dead. Dufour had ordered his men to spare the wounded and prisoners, and the war left less bitterness than many had feared. The defeated cantons were charged the war costs and got liberal governments. The Federal Constitution, adopted on 12 September 1848, made Switzerland a federal state and banned the Jesuits.": "Les troupes fédérales sont entrées à Lucerne le 24 novembre. Le conseil de Sonderbund a rompu à Flüelen deux jours plus tard ; Unterwalden, Schwyz et Uri ont cédé, et le Valais, le dernier, s’est rendu le 29 novembre. La recherche compte environ 60 fédéraux et 33 Sonderbund morts. Dufour avait ordonné à ses hommes d’épargner les blessés et les prisonniers, et la guerre a laissé moins d’amertume que beaucoup l’avaient craint. La Constitution fédérale, adoptée le 12 septembre 1848, fait de la Suisse un État fédéral et interdit les Jésuites."
