"1845 – 14 November 1847": "1845 – 14 novembre 1847"
"Switzerland in the 1840s was a loose league of sovereign cantons under the Federal Treaty of 1815. Liberals and radicals, strongest in the Protestant and urban cantons, wanted a federal state; Catholic conservatives defended cantonal sovereignty and the Church. Aargau closed its monasteries in 1841, and Lucerne called in the Jesuits to run its schools in 1844. Bands of radical volunteers twice attacked Lucerne and were beaten off. On 11 December 1845 seven Catholic cantons, Lucerne, Uri, Schwyz, Unterwalden, Zug, Fribourg and Valais, formed a defensive league with its own council of war.": "La Suisse dans les années 1840 était une ligue lâche de cantons souverains en vertu du traité fédéral de 1815. Libéraux et radicaux, plus forts dans les cantons protestants et urbains, voulaient un État fédéral ; conservateurs catholiques défendaient la souveraineté cantonale et l’Église. Aargau fermait ses monastères en 1841, et Lucerne appelait les jésuites à diriger ses écoles en 1844. Le 11 décembre 1845, sept cantons catholiques, Lucerne, Uri, Schwyz, Unterwalden, Zug, Fribourg et Valais, formèrent une ligue défensive avec leur propre conseil de guerre."
"After elections in St Gallen gave the liberals a majority in the Federal Diet, it declared the league illegal under the Federal Treaty on 20 July 1847 and ordered it dissolved. Both sides mobilised in October. The Sonderbund struck first, seizing the St Gotthard on 3 November, and on 4 November the Diet resolved to dissolve it by force. General Guillaume Henri Dufour of Geneva, a moderate conservative, led about 100,000 federal troops. He turned first on isolated Fribourg, which surrendered on 14 November after a brief fight at one of its redoubts.": "Après les élections à St Gallen a donné aux libéraux une majorité dans la Diète fédérale, il a déclaré la ligue illégale en vertu du Traité fédéral le 20 juillet 1847 et ordonné sa dissolution. Les deux parties se sont mobilisées en octobre. Le Sonderbund frappe d’abord, saisissant la St Gotthard le 3 novembre, et le 4 novembre la Diète décide de la dissoudre par la force. Il s’est mis d’abord à l’isolement de Fribourg, qui s’est rendu le 14 novembre après un bref combat à l’un de ses reproches."
