# French translations of the catalogue text (wave 11); step bodies follow later.
Song–Đại Cồ Việt war: Guerre entre les Song et le Đại Cồ Việt
The Song dynasty’s attempt to restore Chinese rule over the Red River plain after the murder of Đinh Bộ Lĩnh, the first king of Đại Cồ Việt, in 979. With a boy king on the throne and Song armies gathering on the border, the court made the commander-in-chief Lê Hoàn king in 980. In early 981 one Song army marched from Guangxi by the Lạng Sơn road while a fleet sailed into the Bạch Đằng estuary. Song records claim a victory on the river; Vietnamese tradition counts the second battle of Bạch Đằng as Lê Hoàn’s. The land army stalled, lost men to disease, and its commander Hou Renbao was lured into an ambush at Chi Lăng and killed; by the spring the Song had withdrawn. Lê Hoàn returned the captured Song officers and sent tribute, and the Song later recognised him. In 982 he turned south, killed the Cham king in battle and sacked Indrapura, the capital of Champa.: La tentative de la dynastie Song de rétablir la domination chinoise sur la plaine du fleuve Rouge après l’assassinat, en 979, de Đinh Bộ Lĩnh, premier roi du Đại Cồ Việt. Comme un enfant occupait le trône et que les armées Song se massaient à la frontière, la cour fit roi le commandant en chef Lê Hoàn en 980. Au début de 981, une armée Song partit du Guangxi par la route de Lạng Sơn tandis qu’une flotte pénétrait dans l’estuaire du Bạch Đằng. Les sources Song revendiquent une victoire sur le fleuve ; la tradition vietnamienne attribue à Lê Hoàn la deuxième bataille du Bạch Đằng. L’armée de terre s’enlisa et perdit des hommes par la maladie, et son commandant Hou Renbao, attiré dans une embuscade à Chi Lăng, y fut tué ; au printemps, les Song s’étaient retirés. Lê Hoàn rendit les officiers Song capturés et envoya un tribut, et les Song finirent par le reconnaître. En 982, il se tourna vers le sud, tua le roi cham au combat et saccagea Indrapura, la capitale du Champa.
