# French translations of the catalogue text (wave 9); step bodies follow later.
Song–Liao war: Guerre entre les Song et les Liao
? "The quarter-century of war between the Song dynasty and the Khitan Liao empire over the Sixteen Prefectures, the band of land around today’s Beijing and Datong that the Liao had held since 938. Fresh from the conquest of the Northern Han, the Song emperor Taizong marched on Youzhou (Yanjing, Beijing) in 979, but was routed at the Gaoliang River and fled south wounded. After years of raids, he tried again in 986, while a boy emperor, Shengzong, reigned in the Liao under his mother, the empress dowager Xiao Chuo. Three Song armies crossed the border; Yelü Xiuge destroyed the eastern army under Cao Bin, the western army lost the four prefectures it had taken in Shanxi, and its general Yang Ye was captured at Chenjiagu and died. From 999 the Liao raided the Song every year, and in 1004 Shengzong and his mother drove deep into Hebei to Chanzhou on the Yellow River, where the Song emperor Zhenzong came to meet them. In January 1005 the Treaty of Chanyuan made peace: the Song paid the Liao 200,000 bolts of silk and 100,000 taels of silver a year, and the two emperors called each other brothers. The border stayed where it was, and peace between the two empires lasted more than a century."
: "Le quart de siècle de guerre entre la dynastie Song et l’empire khitan des Liao pour les Seize Préfectures, la bande de territoire autour des villes actuelles de Pékin et de Datong que les Liao tenaient depuis 938. Aussitôt après la conquête des Han du Nord, l’empereur Song Taizong marcha sur Youzhou (Yanjing, Pékin) en 979, mais fut mis en déroute sur la rivière Gaoliang et s’enfuit vers le sud, blessé. Après des années de raids, il fit une nouvelle tentative en 986, alors qu’un empereur enfant, Shengzong, régnait chez les Liao sous la tutelle de sa mère, l’impératrice douairière Xiao Chuo. Trois armées Song franchirent la frontière ; Yelü Xiuge anéantit l’armée de l’est de Cao Bin, l’armée de l’ouest perdit les quatre préfectures qu’elle avait prises au Shanxi, et son général Yang Ye fut capturé à Chenjiagu et mourut. À partir de 999, les Liao lancèrent chaque année des raids contre les Song et, en 1004, Shengzong et sa mère s’enfoncèrent profondément dans le Hebei jusqu’à Chanzhou, sur le fleuve Jaune, où l’empereur Song Zhenzong vint à leur rencontre. En janvier 1005, le traité de Chanyuan établit la paix : les Song versaient chaque année aux Liao 200 000 pièces de soie et 100 000 taels d’argent, et les deux empereurs s’appelaient frères. La frontière resta inchangée, et la paix entre les deux empires dura plus d’un siècle."
