# French translations of the catalogue text (wave 9); step bodies follow later.
Song reunification of China: Réunification de la Chine par les Song
? "The wars in which the Song dynasty, founded in 960 by the Later Zhou general Zhao Kuangyin (Emperor Taizu), brought the southern kingdoms and the Northern Han under its rule and ended the division of China that had followed the fall of the Tang. Taizu followed a plan of “the south first, the north later”, taking the weaker southern states before turning on the stronger north: Jingnan and Hunan in 963, the Later Shu in Sichuan in 964–965, the Southern Han in the far south in 970–971, and the Southern Tang on the lower Yangtze in 974–976, whose capital Jinling fell after a siege of almost a year. His attacks on the Northern Han at Taiyuan, protected by the Liao, failed in 968–969 and 976. His brother and successor Zhao Guangyi (Emperor Taizong) received the peaceful surrender of Wuyue and the Qingyuan circuit in 978, and in 979 besieged Taiyuan, beat off a Liao relief army and took the surrender of the last Northern Han ruler, Liu Jiyuan. Except for the Sixteen Prefectures held by the Liao, the far north-west and the south-west beyond Sichuan, China was united again. The Song went straight on from Taiyuan to attack the Liao, starting the Song–Liao war."
: "Les guerres au cours desquelles la dynastie Song, fondée en 960 par le général des Zhou postérieurs Zhao Kuangyin (l’empereur Taizu), soumit les royaumes du Sud et les Han du Nord et mit fin à la division de la Chine qui avait suivi la chute des Tang. Taizu frappa d’abord le Sud, plus faible, avant de s’attaquer au Nord, plus fort : le Jingnan et le Hunan en 963, les Shu postérieurs au Sichuan en 964–965, les Han du Sud dans l’extrême sud en 970–971 et les Tang du Sud sur le cours inférieur du Yangtsé en 974–976, dont la capitale, Jinling, tomba après un siège de près d’un an. Ses attaques contre les Han du Nord à Taiyuan, protégés par les Liao, échouèrent en 968–969 et en 976. Son frère et successeur Zhao Guangyi (l’empereur Taizong) obtint en 978 la reddition pacifique du Wuyue et du circuit de Qingyuan et, en 979, assiégea Taiyuan, repoussa une armée de secours des Liao et reçut la reddition du dernier souverain des Han du Nord, Liu Jiyuan. À l’exception des Seize Préfectures tenues par les Liao, de l’extrême nord-ouest et du sud-ouest au-delà du Sichuan, la Chine était de nouveau unie. De Taiyuan, les Song passèrent directement à l’attaque des Liao, déclenchant la guerre entre les Song et les Liao."
