# French translations of the catalogue text (wave 9); step bodies follow later.
Song–Xia war (1038–1044): Guerre entre les Song et les Xia (1038–1044)
? "The war that followed Li Yuanhao’s proclamation of the Tangut empire of the Great Xia, known as the Western Xia, in 1038. The Song refused to recognise a second emperor on its north-western frontier, cut off trade and put a price on Yuanhao’s head. Yuanhao, with an army of mounted warriors raised from all Tangut men between 15 and 60, struck at the Song frontier in Shaanxi and Gansu and won three great battles: at Sanchuankou near Yan’an in early 1040, at Haoshuichuan in 1041, where the Song general Ren Fu and most of his army were killed, and at Dingchuan fort in 1042. But he could not take the walled towns and forts that Fan Zhongyan and Han Qi built up along the border, and the war, the loss of trade and the drain on his men exhausted the Xia. The Liao used the Song’s difficulty to win higher payments in 1042, then attacked the Xia themselves in 1044 and were heavily defeated. In 1044 Yuanhao agreed to call himself lord of Xia and a subject of the Song, in return for gifts each year of silver, silk and tea worth some 250,000 units and the reopening of the border markets."
: "La guerre qui suivit la proclamation par Li Yuanhao, en 1038, de l’empire tangoute du Grand Xia, connu sous le nom de Xia occidentaux. Les Song refusèrent de reconnaître un second empereur sur leur frontière nord-ouest, coupèrent le commerce et mirent à prix la tête de Yuanhao. Avec une armée de guerriers montés levée parmi tous les hommes tangoutes de 15 à 60 ans, Yuanhao frappa la frontière des Song au Shaanxi et au Gansu et remporta trois grandes batailles : à Sanchuankou, près de Yan’an, au début de 1040, à Haoshuichuan en 1041, où le général Song Ren Fu et la plus grande partie de son armée furent tués, et au fort de Dingchuan en 1042. Mais il ne put prendre les villes fortifiées et les forts que Fan Zhongyan et Han Qi multiplièrent le long de la frontière, et la guerre, la perte du commerce et la saignée de ses hommes épuisèrent les Xia. Les Liao profitèrent des difficultés des Song pour obtenir des versements plus élevés en 1042, puis attaquèrent eux-mêmes les Xia en 1044 et subirent une lourde défaite. En 1044, Yuanhao accepta de se dire seigneur de Xia et sujet des Song, en échange de présents annuels d’argent, de soie et de thé d’une valeur d’environ 250 000 unités et de la réouverture des marchés frontaliers."
