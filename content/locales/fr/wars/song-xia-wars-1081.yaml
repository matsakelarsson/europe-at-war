# French translations of the catalogue text (wave 9); step bodies follow later.
Song–Xia wars (1081–1119): Guerres entre les Song et les Xia (1081–1119)
? The second round of wars between the Song and the Tangut Western Xia, fought in the loess hills and deserts of today’s Shaanxi, Ningxia and Gansu. In 1081 the Song emperor Shenzong, whose reforms had filled his treasury, sent five armies, more than 300,000 men, to destroy the Xia while its court was torn by a struggle between the young emperor Huizong and his mother’s family. The Song took Lanzhou and much of the Ordos, but the siege of Lingzhou failed when the Xia broke the Yellow River dikes and flooded the Song camps, and the retreat became a rout. In 1082 the Xia destroyed the new Song fortress of Yongle, killing more than 17,000 men, and the war ended with Shenzong’s death in 1085. In 1097–1099 the Song tried again with a policy of advancing step by step and fortifying each position, and beat off a great Xia attack at Pingxia in 1098; in 1103–1104 it conquered the Tibetan kingdom of Tsongkha. A last offensive under the eunuch Tong Guan from 1113 ended in disaster in 1119, when Liu Fa’s army was destroyed, and a ceasefire was agreed. The wars gained the Song Lanzhou and a belt of forts, at enormous cost.
: La seconde série de guerres entre les Song et les Xia occidentaux tangoutes, livrées dans les collines de lœss et les déserts des actuels Shaanxi, Ningxia et Gansu. En 1081, l’empereur Song Shenzong, dont les réformes avaient rempli le trésor, envoya cinq armées, plus de 300 000 hommes, détruire les Xia, dont la cour était déchirée par une lutte entre le jeune empereur Huizong et la famille de sa mère. Les Song prirent Lanzhou et une grande partie de l’Ordos, mais le siège de Lingzhou échoua lorsque les Xia rompirent les digues du fleuve Jaune et inondèrent les camps des Song, et la retraite tourna à la déroute. En 1082, les Xia détruisirent la nouvelle forteresse Song de Yongle, tuant plus de 17 000 hommes, et la guerre prit fin avec la mort de Shenzong en 1085. En 1097–1099, les Song firent une nouvelle tentative en avançant pas à pas et en fortifiant chaque position, et repoussèrent une grande attaque des Xia à Pingxia en 1098 ; en 1103–1104, ils conquirent le royaume tibétain de Tsongkha. Une dernière offensive menée à partir de 1113 par l’eunuque Tong Guan s’acheva en désastre en 1119, avec la destruction de l’armée de Liu Fa, et un cessez-le-feu fut conclu. Ces guerres valurent aux Song Lanzhou et une ceinture de forts, à un coût énorme.
