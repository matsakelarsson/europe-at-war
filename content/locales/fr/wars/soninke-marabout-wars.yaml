# French translations of the catalogue text (wave 13); step bodies follow later.
Soninke–Marabout wars: Guerres soninké-marabouts
? Half a century of wars in the Gambia valley and Casamance between the old ruling families of the Mandinka kingdoms and Muslim reformers, the marabouts, in which Britain and France took sides and then took the land. “Soninke” here was not the Soninke people but the name the marabouts gave to the rulers and warriors who kept the old religion or a loosely held Islam and lived by raiding, taxing trade and drinking palm wine; the marabouts, among them Mandinka, Fula and Jakhanke clerics, wanted Muslim states ruled by Islamic law. Fighting began in 1850 in Kombo, next to the British post at Bathurst (Banjul), where Muslim towns rose against King Suling Jatta, who was killed in 1855; British and, in 1855, French forces attacked the marabout stronghold of Sabaji (Sabajee), and Britain used the war to add land in Kombo to its colony. In the 1860s Maba Diakhou Bâ carried the war north of the river into Badibu and Saloum, and in 1867 the Fula leader Alfa Molo and Futa Jallon destroyed Kansala, the capital of Kaabu, after which Alfa Molo and his son Musa Molo ruled Fuladu on the upper river. The Jakhanke marabout Fodé Kaba Doumbouya, who had served under Maba, fought Fuladu and the Mandinka and Jola villages from the 1870s and ruled Fogny and eastern Kiang from his fortified town of Medina; the Soninke Mahmadu Lamine’s jihad of 1885–1887 reached Wuli and Niani. All sides took captives, and many were sold for horses and guns. The Anglo-French convention of 1889 drew the Gambia’s borders through these lands, and the two powers used the wars to extend their protectorates. Musa Molo became France’s ally against Fodé Kaba, who was killed when a French column with British support stormed Medina on 23 March 1901; in 1903 Musa Molo himself crossed into the British Gambia rather than submit to France.
: Un demi-siècle de guerres dans la vallée de la Gambie et en Casamance entre les vieilles familles régnantes des royaumes mandingues et les réformateurs musulmans, les marabouts, au cours desquelles la Grande-Bretagne et la France prirent parti, puis s’emparèrent du pays. « Soninké » ne désignait pas ici le peuple soninké, mais le nom que les marabouts donnaient aux souverains et aux guerriers qui restaient fidèles à l’ancienne religion ou à un islam peu rigoureux, vivaient de razzias et de taxes sur le commerce et buvaient du vin de palme ; les marabouts, parmi lesquels des clercs mandingues, peuls et diakhanké, voulaient des États musulmans régis par la loi islamique. Les combats commencèrent en 1850 dans le Kombo, à côté du poste britannique de Bathurst (Banjul), où des villes musulmanes se soulevèrent contre le roi Suling Jatta, qui fut tué en 1855 ; des forces britanniques et, en 1855, françaises attaquèrent la place forte maraboutique de Sabaji (Sabajee), et la Grande-Bretagne profita de la guerre pour adjoindre à sa colonie des terres du Kombo. Dans les années 1860, Maba Diakhou Bâ porta la guerre au nord du fleuve, dans le Badibu et le Saloum, et en 1867 le chef peul Alfa Molo et le Fouta-Djalon détruisirent Kansala, la capitale du Kaabu, après quoi Alfa Molo et son fils Moussa Molo régnèrent sur le Fouladou, sur le haut fleuve. Le marabout diakhanké Fodé Kaba Doumbouya, qui avait servi sous Maba, combattit le Fouladou ainsi que les villages mandingues et diola à partir des années 1870 et régna sur le Fogny et l’est du Kiang depuis sa ville fortifiée de Médina ; le djihad du Soninké Mamadou Lamine, en 1885–1887, atteignit le Wuli et le Niani. Tous les camps faisaient des captifs, et beaucoup furent vendus contre des chevaux et des fusils. La convention franco-britannique de 1889 traça les frontières de la Gambie à travers ces terres, et les deux puissances se servirent des guerres pour étendre leurs protectorats. Moussa Molo devint l’allié de la France contre Fodé Kaba, qui fut tué lorsqu’une colonne française, avec l’appui britannique, prit d’assaut Médina le 23 mars 1901 ; en 1903, Moussa Molo lui-même passa en Gambie britannique plutôt que de se soumettre à la France.
