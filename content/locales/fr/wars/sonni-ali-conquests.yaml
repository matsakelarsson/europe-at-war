# French translations of the catalogue text (wave 12); step bodies follow later.
Sonni Ali’s conquests: Les conquêtes de Sonni Ali
The campaigns by which Sonni Ali, king of Gao from about 1464, turned the small Songhai kingdom into the leading power of the Niger bend. With a cavalry army and a fleet of river boats he took Timbuktu from the Maghsharen Tuareg in January 1468, besieged and took Djenné (in 1473 by the usual reckoning), fought a long war with the Mossi, who reached Walata in 1480 before Sonni Ali defeated them in 1483, and campaigned against the Tuareg, the Fulani, the Dogon of the cliffs and the peoples of the Gourma. He drowned on his way back from the Gourma in November 1492. The Timbuktu chroniclers, who wrote for the scholars he had persecuted and for the Askia dynasty that overthrew his son, remember him as a tyrant; Songhai tradition remembers Si Ali Ber as a great king and magician, and modern historians see in him the real founder of the Songhai Empire.: Les campagnes par lesquelles Sonni Ali, roi de Gao à partir de 1464 environ, fit du petit royaume songhaï la première puissance de la boucle du Niger. Avec une armée de cavaliers et une flotte de bateaux fluviaux, il prit Tombouctou aux Touareg maghsharen en janvier 1468, assiégea et prit Djenné (en 1473 selon la chronologie habituelle), mena une longue guerre contre les Mossi, qui atteignirent Oualata en 1480 avant que Sonni Ali ne les batte en 1483, et fit campagne contre les Touareg, les Peuls, les Dogon des falaises et les peuples du Gourma. Il se noya au retour du Gourma en novembre 1492. Les chroniqueurs de Tombouctou, qui écrivaient pour les lettrés qu’il avait persécutés et pour la dynastie des Askia qui renversa son fils, le présentent comme un tyran ; la tradition songhaï se souvient de Si Ali Ber comme d’un grand roi et d’un magicien, et les historiens modernes voient en lui le véritable fondateur de l’empire songhaï.
