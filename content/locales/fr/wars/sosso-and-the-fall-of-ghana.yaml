# French translations of the catalogue text (wave 12); step bodies follow later.
Sosso and the fall of Ghana: Le Sosso et la chute du Ghana
? The end of the old kingdom of Ghana (Wagadu) and the rise of the Sosso kingdom, which ruled much of the western Sahel from about 1200 until its defeat by Sunjata Keita of Mali in about 1235. After the Almoravid wars of the 1050s–1070s (told in “The Almoravids and Ghana”), Ghana survived as a smaller kingdom; al-Idrisi, writing in 1154, still described it as rich, with a Muslim king. Soninke traditions tell of civil wars among the rulers of Wagadu and of rivalry between the provinces of Kaniaga and Diara. Out of this came the Sosso kingdom of Kaniaga, led by a Kante dynasty of smiths. Its best-known king, Sumaoro (Sumanguru) Kante, is said to have conquered the Soninke lands of Ghana, Diara, the gold country of Bure and the Mande chiefdoms to the south, which tradition says he “broke” nine times; a date of about 1203 is often given for his conquest of Ghana, but it is a modern reconstruction. Traditions remember him as a powerful sorcerer king, hostile to Islam and harsh to his subjects, and say that Muslim merchants left Ghana’s capital for Walata and Djenné; Kante smith lineages tell a kinder story. Ibn Khaldun, writing in the 1390s from informants, says only that the Susu overpowered the people of Ghana and were later subdued by Mari Jata (Sunjata) of Mali. The war that ended Sosso is told in “Battle of Kirina”.
: La fin de l’ancien royaume du Ghana (Wagadou) et l’essor du royaume de Sosso, qui domina une grande partie du Sahel occidental de 1200 environ jusqu’à sa défaite face à Soundiata Keïta du Mali vers 1235. Après les guerres almoravides des années 1050–1070 (racontées dans « Les Almoravides et le Ghana »), le Ghana survécut sous la forme d’un royaume plus petit ; al-Idrisi, qui écrivait en 1154, le décrivait encore comme riche et doté d’un roi musulman. Les traditions soninké évoquent des guerres civiles entre les souverains du Wagadou et la rivalité entre les provinces du Kaniaga et du Diara. C’est de là qu’émergea le royaume sosso du Kaniaga, dirigé par une dynastie de forgerons, les Kanté. Son roi le plus connu, Soumaoro (Soumangourou) Kanté, aurait conquis les pays soninké du Ghana et du Diara, le pays de l’or du Bouré et les chefferies mandingues du sud, qu’il aurait, selon la tradition, « brisées » neuf fois ; on donne souvent la date de 1203 environ pour sa conquête du Ghana, mais il s’agit d’une reconstitution moderne. Les traditions se souviennent de lui comme d’un puissant roi sorcier, hostile à l’islam et dur envers ses sujets, et rapportent que les marchands musulmans quittèrent la capitale du Ghana pour Oualata et Djenné ; les lignages de forgerons kanté en donnent une image plus favorable. Ibn Khaldoun, qui écrivait dans les années 1390 d’après des informateurs, dit seulement que les Susu l’emportèrent sur le peuple du Ghana et furent plus tard soumis par Mari Jata (Soundiata) du Mali. La guerre qui mit fin au Sosso est racontée dans « Bataille de Kirina ».
