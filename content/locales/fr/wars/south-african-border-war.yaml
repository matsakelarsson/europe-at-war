# French translations of the catalogue text (wave 13); step bodies follow later.
South African Border War: Guerre de la frontière sud-africaine
? The war for South West Africa (Namibia), fought between South Africa and the South West Africa People’s Organisation (SWAPO) and its army, the People’s Liberation Army of Namibia (PLAN), and from 1975 also in southern Angola against the Angolan army (FAPLA) and its Cuban allies. South Africa had ruled the former German colony under a League of Nations mandate since 1920 and extended apartheid to it; the United Nations ended the mandate in 1966. The war began on 26 August 1966 with a South African attack on a PLAN camp at Omugulugwombashe. After Angola’s independence in 1975 PLAN fought from bases in southern Angola, and the war centred on Ovamboland, along the border. South Africa built up a large army there, with the police unit Koevoet and the South West Africa Territorial Force, raided deep into Angola, as at Cassinga in 1978, occupied part of Cunene province in 1981–1985 and backed Jonas Savimbi’s UNITA. In 1987–1988 South African troops defeated an Angolan offensive at the Lomba river but failed to take Cuito Cuanavale, and a Cuban advance towards the Namibian border followed. The New York Accords of 22 December 1988 linked South Africa’s withdrawal from Namibia to the departure of the Cubans from Angola. Under UN supervision Namibia held elections in November 1989, which SWAPO won, and became independent on 21 March 1990. Some 2,000–2,500 South African soldiers, about 11,000 PLAN fighters, Cubans, Angolans and about 1,000 Namibian civilians were killed.
: La guerre pour le Sud-Ouest africain (Namibie), qui opposa l’Afrique du Sud à l’Organisation du peuple du Sud-Ouest africain (SWAPO) et à son armée, l’Armée populaire de libération de la Namibie (PLAN), et, à partir de 1975, se déroula aussi dans le sud de l’Angola contre l’armée angolaise (FAPLA) et ses alliés cubains. L’Afrique du Sud administrait l’ancienne colonie allemande en vertu d’un mandat de la Société des Nations depuis 1920 et y avait étendu l’apartheid ; les Nations unies mirent fin au mandat en 1966. La guerre commença le 26 août 1966 par une attaque sud-africaine contre un camp de la PLAN à Omugulugwombashe. Après l’indépendance de l’Angola en 1975, la PLAN combattit depuis des bases situées dans le sud de l’Angola, et la guerre se concentra sur l’Ovamboland, le long de la frontière. L’Afrique du Sud y constitua une armée nombreuse, avec l’unité de police Koevoet et la Force territoriale du Sud-Ouest africain, mena des raids loin en Angola, comme à Cassinga en 1978, occupa une partie de la province de Cunene en 1981–1985 et soutint l’UNITA de Jonas Savimbi. En 1987–1988, les troupes sud-africaines vainquirent une offensive angolaise sur la rivière Lomba, mais ne parvinrent pas à prendre Cuito Cuanavale, et une avancée cubaine vers la frontière namibienne s’ensuivit. Les accords de New York du 22 décembre 1988 lièrent le retrait sud-africain de Namibie au départ des Cubains d’Angola. Sous la supervision de l’ONU, la Namibie organisa en novembre 1989 des élections, que remporta la SWAPO, et devint indépendante le 21 mars 1990. Quelque 2 000 à 2 500 soldats sud-africains, environ 11 000 combattants de la PLAN, des Cubains, des Angolais et environ 1 000 civils namibiens furent tués.
