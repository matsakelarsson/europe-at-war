# Some French text was translated automatically.
"South Ossetia War": "Guerre d’Ossétie du Sud"
"After South Ossetia declared itself a Soviet republic separate from Georgia, the Georgian parliament under Zviad Gamsakhurdia abolished the region’s autonomy on 11 December 1990. On the night of 5–6 January 1991 Georgian police and National Guard units entered Tskhinvali, and fighting with South Ossetian militias, helped by volunteers from North Ossetia, went on around the town and in the villages for a year and a half, with Tskhinvali besieged and shelled. About 1,000 people were killed. More than 40,000 Ossetians fled, most of them to North Ossetia in Russia, and about 23,000 Georgians left South Ossetia. The Sochi (Dagomys) Agreement signed by Boris Yeltsin and Eduard Shevardnadze on 24 June 1992 ended the fighting and set up joint Russian, Georgian and Ossetian peacekeeping forces, leaving most of South Ossetia under separatist control.": "Après que l’Ossétie du Sud s’est déclarée une république soviétique séparée de la Géorgie, le parlement géorgien sous Zviad Gamsakhurdia a aboli l’autonomie de la région le 11 décembre 1990. Dans la nuit du 5 au 6 janvier 1991, des unités de la police et de la Garde nationale géorgiennes sont entrées dans Tskhinvali, et se sont battues avec des milices sud-ossètes, aidés par des volontaires d’Ossétie du Nord, ont continué dans la ville et dans les villages pendant un an et demi, avec Tskhinvali assiégés et bombardés. Plus de 40 000 Ossètes ont fui, pour la plupart en Ossétie du Nord en Russie, et environ 23 000 Géorgiens ont quitté l’Ossétie du Sud. L’Accord Sotchi (Dagomys) signé par Boris Eltsine et Eduard Chevardnadze le 24 juin 1992 a mis fin aux combats et mis en place des forces conjointes de maintien de la paix russes, géorgiennes et ossètes, laissant la majeure partie de l’Ossétie du Sud sous contrôle séparatiste."
"South Ossetia is shown as part of Georgia on the map, as it is internationally recognised. Numbers of dead and displaced are estimates.": "L’Ossétie du Sud fait partie de la Géorgie sur la carte, car elle est reconnue internationalement. Le nombre de morts et de déplacés est estimé."
