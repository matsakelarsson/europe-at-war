# French translations of the catalogue text (wave 12); step bodies follow later.
South Sudanese Civil War: Guerre civile sud-soudanaise
? "The civil war in South Sudan, two and a half years after its independence, between the government of President Salva Kiir and the SPLM/A-in-Opposition of his former vice-president Riek Machar. A power struggle in the ruling SPLM turned into fighting within the presidential guard in Juba on 15 December 2013, followed by the killing of hundreds of Nuer civilians in the capital. The army split largely along ethnic lines, with many Nuer units and the armed Nuer cattle-camp youth of the White Army joining Machar, while Kiir, a Dinka, was backed by Ugandan troops. Bor, Bentiu and Malakal changed hands several times in 2014, and both sides massacred civilians of the other’s community. A peace agreement in August 2015 collapsed when fighting broke out in Juba in July 2016; Machar fled on foot to Congo, and the war spread to the Equatoria region in the south. Famine was declared in parts of Unity State in February 2017. The Revitalised Agreement of September 2018 ended most of the fighting, and Kiir and Machar formed a unity government on 22 February 2020. A study estimated about 383,000 excess deaths by April 2018, half of them from violence, and some 4 million people were driven from their homes. In 2025 the peace broke down again: Machar was arrested and put on trial for treason, and fighting resumed in Upper Nile and Jonglei."
: "La guerre civile qui éclata au Soudan du Sud deux ans et demi après son indépendance, entre le gouvernement du président Salva Kiir et le SPLM/A dans l’opposition de son ancien vice-président Riek Machar. Une lutte de pouvoir au sein du SPLM, parti au pouvoir, dégénéra en combats au sein de la garde présidentielle à Juba le 15 décembre 2013, suivis du meurtre de centaines de civils nuer dans la capitale. L’armée se divisa en grande partie selon des lignes ethniques : de nombreuses unités nuer et les jeunes armés des camps de bétail nuer de l’Armée blanche rejoignirent Machar, tandis que Kiir, un Dinka, était soutenu par des troupes ougandaises. Bor, Bentiu et Malakal changèrent plusieurs fois de mains en 2014, et les deux camps massacrèrent des civils de la communauté adverse. Un accord de paix conclu en août 2015 s’effondra lorsque des combats éclatèrent à Juba en juillet 2016 ; Machar s’enfuit à pied au Congo, et la guerre s’étendit à la région de l’Équatoria, au sud. La famine fut déclarée dans certaines parties de l’État d’Unité en février 2017. L’accord revitalisé de septembre 2018 mit fin à l’essentiel des combats, et Kiir et Machar formèrent un gouvernement d’union le 22 février 2020. Une étude a estimé à environ 383 000 le nombre de décès excédentaires jusqu’en avril 2018, dont la moitié dus à la violence, et quelque 4 millions de personnes furent chassées de chez elles. En 2025, la paix s’effondra de nouveau : Machar fut arrêté et jugé pour trahison, et les combats reprirent dans le Haut-Nil et le Jonglei."
