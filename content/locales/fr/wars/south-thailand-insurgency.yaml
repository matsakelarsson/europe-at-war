# French translations of the catalogue text (wave 11); step bodies follow later.
South Thailand insurgency: Insurrection dans le sud de la Thaïlande
The armed struggle of Malay Muslim separatists in Thailand’s Deep South, the provinces of Pattani, Yala and Narathiwat and four districts of Songkhla, the lands of the old sultanate of Patani, which Siam conquered in 1785 and annexed outright in 1902. Separatist movements had fought the Thai state from the 1960s to the 1990s; the present conflict began with a raid on an army depot in Narathiwat on 4 January 2004 and grew through the killings at the Krue Se mosque and at Tak Bai that year. A secretive network led by the Barisan Revolusi Nasional (BRN) has waged a campaign of shootings and bombings against soldiers, police, officials, teachers and Buddhist and Muslim civilians, while the security forces have ruled the region under martial law and an emergency decree, with arrests, disappearances and torture documented by human rights groups. Talks facilitated by Malaysia since 2013 have not ended the violence. More than 7,000 people have been killed since 2004.: La lutte armée des séparatistes malais musulmans dans l’extrême sud de la Thaïlande, les provinces de Pattani, de Yala et de Narathiwat et quatre districts de Songkhla, terres de l’ancien sultanat de Patani, que le Siam conquit en 1785 et annexa purement et simplement en 1902. Des mouvements séparatistes avaient combattu l’État thaïlandais des années 1960 aux années 1990 ; le conflit actuel commença par un raid contre un dépôt de l’armée à Narathiwat le 4 janvier 2004 et s’amplifia avec les tueries de la mosquée de Krue Se et de Tak Bai la même année. Un réseau secret dirigé par le Barisan Revolusi Nasional (BRN) mène une campagne de fusillades et d’attentats à la bombe contre des soldats, des policiers, des fonctionnaires, des enseignants et des civils bouddhistes et musulmans, tandis que les forces de sécurité administrent la région sous la loi martiale et un décret d’urgence, avec des arrestations, des disparitions et des actes de torture documentés par des organisations de défense des droits humains. Les pourparlers facilités par la Malaisie depuis 2013 n’ont pas mis fin à la violence. Plus de 7 000 personnes ont été tuées depuis 2004.
