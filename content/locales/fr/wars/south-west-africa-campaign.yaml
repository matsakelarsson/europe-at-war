# French translations of the catalogue text (wave 13); step bodies follow later.
South West Africa campaign: Campagne du Sud-Ouest africain
The First World War campaign in which the Union of South Africa conquered German South West Africa (Namibia) for the British Empire. At Britain’s request to seize the colony’s ports and wireless stations, Prime Minister Louis Botha’s government sent troops in September 1914. The invasion was delayed by a defeat at Sandfontein and by an armed rising of Afrikaners who refused to fight Germany for Britain, the Maritz Rebellion, which Botha had largely crushed by the end of 1914. In 1915 Botha advanced inland from Swakopmund and Jan Smuts from the south, taking Windhoek in May. Outnumbered many times over, the German forces under Governor Theodor Seitz and Colonel Victor Franke surrendered at Khorab on 9 July 1915. On the colony’s northern border German troops had also fought the Portuguese in Angola, defeating them at Naulila in December 1914. South Africa ruled the territory under military law until 1920, and then as a League of Nations mandate.: La campagne de la Première Guerre mondiale par laquelle l’Union sud-africaine conquit le Sud-Ouest africain allemand (Namibie) pour le compte de l’Empire britannique. À la demande de la Grande-Bretagne, qui souhaitait s’emparer des ports et des stations de télégraphie sans fil de la colonie, le gouvernement du Premier ministre Louis Botha envoya des troupes en septembre 1914. L’invasion fut retardée par une défaite à Sandfontein et par un soulèvement armé d’Afrikaners qui refusaient de combattre l’Allemagne pour la Grande-Bretagne, la rébellion Maritz, que Botha avait pour l’essentiel écrasée à la fin de 1914. En 1915, Botha avança vers l’intérieur depuis Swakopmund et Jan Smuts depuis le sud, et Windhoek fut prise en mai. En très large infériorité numérique, les forces allemandes du gouverneur Theodor Seitz et du colonel Victor Franke capitulèrent à Khorab le 9 juillet 1915. Sur la frontière nord de la colonie, les troupes allemandes avaient aussi combattu les Portugais de l’Angola, qu’elles battirent à Naulila en décembre 1914. L’Afrique du Sud administra le territoire sous régime militaire jusqu’en 1920, puis en tant que mandat de la Société des Nations.
