# French translations of the catalogue text (wave 11); step bodies follow later.
Southern Han invasions of Tĩnh Hải and the battle of Bạch Đằng: Invasions du Tĩnh Hải par les Han du Sud et bataille du Bạch Đằng
Two attempts by the Southern Han, the kingdom founded at Guangzhou in 917, to take the old Tang circuit of Tĩnh Hải (Jinghai), the Red River plain of today’s northern Vietnam, which local governors of the Khúc family had ruled since about 905. In 930 a Southern Han army took Đại La (Hanoi) and carried off the governor Khúc Thừa Mỹ, but in 931 Dương Đình Nghệ, a Khúc general from Ái Châu (Thanh Hóa), drove out the garrison and killed the relief commander. When Dương Đình Nghệ was murdered in 937 by his officer Kiều Công Tiễn, his son-in-law Ngô Quyền marched north to avenge him, and Kiều Công Tiễn called in the Southern Han. Ngô Quyền killed him before help arrived, then trapped the Southern Han fleet of Liu Hongcao on iron-tipped stakes in the estuary of the Bạch Đằng in late 938; the prince and about half his men died. In 939 Ngô Quyền proclaimed himself king at Cổ Loa. Vietnamese history counts the battle as the end of a thousand years of Chinese rule.: Deux tentatives des Han du Sud, royaume fondé à Guangzhou en 917, pour s’emparer de l’ancien circuit Tang de Tĩnh Hải (Jinghai), la plaine du fleuve Rouge dans l’actuel nord du Vietnam, que des gouverneurs locaux de la famille Khúc dirigeaient depuis 905 environ. En 930, une armée des Han du Sud prit Đại La (Hanoï) et emmena le gouverneur Khúc Thừa Mỹ, mais en 931 Dương Đình Nghệ, un général des Khúc originaire d’Ái Châu (Thanh Hóa), chassa la garnison et tua le commandant de l’armée de secours. Lorsque Dương Đình Nghệ fut assassiné en 937 par son officier Kiều Công Tiễn, son gendre Ngô Quyền marcha vers le nord pour le venger, et Kiều Công Tiễn appela les Han du Sud à l’aide. Ngô Quyền le tua avant l’arrivée des secours, puis, à la fin de 938, piégea la flotte des Han du Sud commandée par Liu Hongcao sur des pieux à pointe de fer plantés dans l’estuaire du Bạch Đằng ; le prince et environ la moitié de ses hommes périrent. En 939, Ngô Quyền se proclama roi à Cổ Loa. L’historiographie vietnamienne voit dans cette bataille la fin de mille ans de domination chinoise.
