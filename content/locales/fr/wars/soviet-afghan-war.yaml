# French translations of the catalogue text (wave 7); step bodies follow later.
Soviet–Afghan War: Guerre soviéto-afghane
The war in which the Soviet Union sent its army into Afghanistan to prop up the communist government of the People’s Democratic Party of Afghanistan (PDPA), which had seized power in April 1978 and faced revolts across the country. Soviet troops crossed the border on 24–25 December 1979, killed the party leader Hafizullah Amin and installed Babrak Karmal. For nine years some 100,000 Soviet soldiers and the Afghan army fought the mujahideen, Islamist and tribal guerrillas armed through Pakistan with money from the United States, Saudi Arabia and others. The Soviet forces held the cities and roads but could not end the insurgency, and much of the countryside was bombed and emptied. Under Mikhail Gorbachev the Soviet Union signed the Geneva Accords in April 1988 and withdrew its last troops on 15 February 1989. Between about half a million and two million Afghans died, more than five million fled abroad, and about 15,000 Soviet soldiers were killed.: La guerre au cours de laquelle l’Union soviétique envoya son armée en Afghanistan pour soutenir le gouvernement communiste du Parti démocratique populaire d’Afghanistan (PDPA), qui avait pris le pouvoir en avril 1978 et faisait face à des révoltes dans tout le pays. Les troupes soviétiques franchirent la frontière les 24 et 25 décembre 1979, tuèrent le chef du parti, Hafizullah Amin, et installèrent Babrak Karmal au pouvoir. Pendant neuf ans, quelque 100 000 soldats soviétiques et l’armée afghane combattirent les moudjahidines, des guérilleros islamistes et tribaux armés par l’intermédiaire du Pakistan avec l’argent des États-Unis, de l’Arabie saoudite et d’autres pays. Les forces soviétiques tenaient les villes et les routes mais ne purent mettre fin à l’insurrection, et une grande partie des campagnes fut bombardée et vidée de ses habitants. Sous Mikhaïl Gorbatchev, l’Union soviétique signa les accords de Genève en avril 1988 et retira ses dernières troupes le 15 février 1989. Entre un demi-million et deux millions d’Afghans environ moururent, plus de cinq millions s’enfuirent à l’étranger, et environ 15 000 soldats soviétiques furent tués.
