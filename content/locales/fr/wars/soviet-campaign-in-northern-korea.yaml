# French translations of the catalogue text (wave 10); step bodies follow later.
Soviet campaign in northern Korea: Campagne soviétique dans le nord de la Corée
? The part of the Soviet war against Japan fought in Korea in August 1945. From 9 August, the day after the Soviet declaration of war, aircraft and torpedo boats of the Pacific Fleet attacked the ports of Unggi (Yuki), Najin (Rashin) and Chongjin (Seishin) in the north-east of Japanese-ruled Korea, while Colonel General Ivan Chistyakov’s 25th Army crossed the Tumen from Primorye. With small marine landings the Soviets took Unggi on 11–12 August and Najin on 12 August. At Chongjin a few hundred marines landed on 13 August and fought for three days against a larger Japanese garrison reinforced by retreating troops until more Soviet forces arrived on 16 August; about 227 Japanese and 230–300 Soviet soldiers were killed or went missing. Japan announced its surrender on 15 August, but fighting in the north-east lasted until about 18 August. Soviet marines landed at Wonsan on 21 August and airborne detachments flew into Hamhung and Pyongyang on 24 August, where the Japanese garrisons laid down their arms; Chistyakov reached Pyongyang on 26 August. On 16 August Stalin had accepted the American proposal, made in General Order No. 1, to divide the occupation of Korea at the 38th parallel, and Soviet troops halted there; American troops landed at Incheon on 8 September. The Soviet Civil Administration set up by the 25th Army governed the North until 1948 and brought Kim Il-sung, who arrived at Wonsan in September, to power. Koreans in the South mark 15 August as Gwangbokjeol, the day of the “restoration of light”, and in the North as the day of liberation (haebang); Soviet troops are remembered there as liberators, while Japanese and many Korean accounts also record looting and rape by Soviet soldiers and the flight of Japanese civilians southwards.
: La partie de la guerre soviétique contre le Japon qui se déroula en Corée en août 1945. À partir du 9 août, lendemain de la déclaration de guerre soviétique, l’aviation et les torpilleurs de la flotte du Pacifique attaquèrent les ports d’Unggi (Yuki), de Najin (Rashin) et de Chongjin (Seishin), dans le nord-est de la Corée sous domination japonaise, tandis que la 25e armée du colonel-général Ivan Tchistiakov franchissait le Tumen depuis le Primorié. Grâce à de petits débarquements de fusiliers marins, les Soviétiques prirent Unggi les 11 et 12 août et Najin le 12 août. À Chongjin, quelques centaines de fusiliers marins débarquèrent le 13 août et combattirent pendant trois jours contre une garnison japonaise plus nombreuse, renforcée par des troupes en retraite, jusqu’à l’arrivée de nouvelles forces soviétiques le 16 août ; environ 227 soldats japonais et 230 à 300 soldats soviétiques furent tués ou portés disparus. Le Japon annonça sa capitulation le 15 août, mais les combats se poursuivirent dans le nord-est jusque vers le 18 août. Des fusiliers marins soviétiques débarquèrent à Wonsan le 21 août et des détachements aéroportés furent acheminés par avion à Hamhung et à Pyongyang le 24 août, où les garnisons japonaises déposèrent les armes ; Tchistiakov arriva à Pyongyang le 26 août. Le 16 août, Staline avait accepté la proposition américaine, formulée dans l’ordre général no 1, de partager l’occupation de la Corée au 38e parallèle, et les troupes soviétiques s’y arrêtèrent ; les troupes américaines débarquèrent à Incheon le 8 septembre. L’Administration civile soviétique mise en place par la 25e armée gouverna le Nord jusqu’en 1948 et porta au pouvoir Kim Il-sung, arrivé à Wonsan en septembre. Les Coréens du Sud célèbrent le 15 août sous le nom de Gwangbokjeol, le jour de la « restauration de la lumière », et ceux du Nord comme le jour de la libération (haebang) ; dans le Nord, les troupes soviétiques sont commémorées comme des libératrices, tandis que les récits japonais et de nombreux récits coréens font aussi état de pillages et de viols commis par des soldats soviétiques, ainsi que de la fuite des civils japonais vers le sud.
