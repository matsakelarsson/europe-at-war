# Some French text was translated automatically.
"Soviet invasion of Georgia": "Invasion soviétique de la Géorgie"
"The Red Army’s conquest of the Democratic Republic of Georgia in February–March 1921, the last step in the Soviet takeover of the Caucasus after the occupation of Azerbaijan in April 1920 and of Armenia in late 1920. Soviet troops took Tbilisi on 25 February, and by mid-March the Georgian government had gone into exile from Batumi, which Turkish troops had briefly entered and which the Soviet–Turkish Treaty of Moscow of 16 March 1921 left to Soviet Georgia.": "La conquête de la République démocratique de Géorgie par l’Armée rouge en février-mars 1921, dernier pas dans la prise soviétique du Caucase après l’occupation de l’Azerbaïdjan en avril 1920 et de l’Arménie à la fin de 1920. Les troupes soviétiques ont pris Tbilissi le 25 février, et à la mi-mars le gouvernement géorgien était allé en exil de Batoumi, que les troupes turques avaient brièvement entrées et que le traité soviet-turque de Moscou du 16 mars 1921 avait laissé à la Géorgie soviétique."
"Soviet Russia had recognised Georgia’s independence in the Treaty of Moscow of 7 May 1920.": "La Russie soviétique avait reconnu l’indépendance de la Géorgie dans le Traité de Moscou du 7 mai 1920."
"The 11th Red Army had entered Baku on 28 April 1920, ending the Azerbaijan Democratic Republic, and entered Armenia at the end of November 1920; the Armenian government handed power to the Bolsheviks on 2 December.": "La 11ème Armée Rouge est entrée à Bakou le 28 avril 1920, mettant fin à la République Démocratique d’Azerbaïdjan, et en Arménie à la fin du mois de novembre 1920 ; le gouvernement arménien a remis le pouvoir aux bolcheviks le 2 décembre."
