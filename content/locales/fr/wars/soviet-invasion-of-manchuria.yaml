# French translations of the catalogue text (wave 9); step bodies follow later.
Soviet invasion of Manchuria: Invasion soviétique de la Mandchourie
? "The Soviet Union’s attack on Japan’s Kwantung Army and the client states of Manchukuo and Mengjiang in August 1945, the last great campaign of the Second World War. Stalin had promised at Yalta to enter the war against Japan within three months of Germany’s defeat, in return for South Sakhalin, the Kurils and Japan’s rights in Manchuria. The Soviet Union declared war on 8 August, between the atomic bombings of Hiroshima and Nagasaki, and at midnight some 1.5 million Soviet troops with Mongolian allies attacked from three sides: across the Gobi and the Greater Khingan from Mongolia, through the fortified border at Mudanjiang from the east, and over the Amur and up the Sungari from the north. The Kwantung Army, stripped of its best units, was broken within a week. After Emperor Hirohito’s surrender broadcast of 15 August most Japanese units laid down their arms, Soviet airborne troops seized the cities, and the Manchukuo emperor Puyi was captured at Mukden. About 600,000 Japanese were taken to labour camps in the Soviet Union. The Soviet army stayed until May 1946 and stripped Manchuria’s industry; on leaving, it let much of the countryside and the captured Japanese arms pass to the Chinese Communists, while the Nationalists took over the southern cities."
: "L’attaque de l’Union soviétique contre l’armée japonaise du Kwantung et les États clients du Mandchoukouo et du Mengjiang en août 1945, la dernière grande campagne de la Seconde Guerre mondiale. Staline avait promis à Yalta d’entrer en guerre contre le Japon dans les trois mois suivant la défaite de l’Allemagne, en échange du sud de Sakhaline, des Kouriles et des droits du Japon en Mandchourie. L’Union soviétique déclara la guerre le 8 août, entre les bombardements atomiques d’Hiroshima et de Nagasaki, et à minuit quelque 1,5 million de soldats soviétiques, avec leurs alliés mongols, attaquèrent sur trois côtés : depuis la Mongolie, à travers le Gobi et le Grand Khingan ; depuis l’est, par la frontière fortifiée de Mudanjiang ; et depuis le nord, en franchissant l’Amour et en remontant la Soungari. L’armée du Kwantung, privée de ses meilleures unités, fut brisée en une semaine. Après l’allocution de capitulation de l’empereur Hirohito, le 15 août, la plupart des unités japonaises déposèrent les armes, des troupes aéroportées soviétiques s’emparèrent des villes, et l’empereur du Mandchoukouo, Puyi, fut capturé à Moukden. Environ 600 000 Japonais furent envoyés dans des camps de travail en Union soviétique. L’armée soviétique resta jusqu’en mai 1946 et démantela l’industrie de la Mandchourie ; en partant, elle laissa une grande partie des campagnes et des armes japonaises saisies passer aux communistes chinois, tandis que les nationalistes prenaient le contrôle des villes du sud."
