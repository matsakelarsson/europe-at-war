# Some French text was translated automatically.
"Soviet occupation of the Baltic states": "L’occupation soviétique des Etats baltes"
"The occupation and annexation of Estonia, Latvia and Lithuania by the Soviet Union in the summer of 1940, under the secret protocols of the Molotov–Ribbentrop Pact. After Soviet ultimatums in mid-June the Red Army marched in unopposed, staged elections in July were followed by annexation on 3–6 August, and on 14 June 1941 about 40,000 people were deported from the three countries to Siberia and Kazakhstan.": "L’occupation et l’annexion de l’Estonie, de la Lettonie et de la Lituanie par l’Union soviétique à l’été 1940, en vertu des protocoles secrets du Pacte Molotov-Ribbentrop. Après les ultimatums soviétiques à la mi-juin, l’Armée rouge a marché dans des élections sans opposition, mises en scène en juillet ont été suivies d’annexions les 3-6 août, et le 14 juin 1941 environ 40 000 personnes ont été expulsées des trois pays vers la Sibérie et le Kazakhstan."
"Since the autumn of 1939 all three states had been forced to accept Soviet military bases under mutual assistance pacts. None of their governments ordered armed resistance in June 1940.": "Depuis l’automne 1939, les trois États ont été contraints d’accepter des bases militaires soviétiques en vertu de pactes d’assistance mutuelle. Aucun de leurs gouvernements n’a ordonné une résistance armée en juin 1940."
"Many Western states, the United States among them, never recognised the annexation, and the three states regained their independence in 1990–1991. Deportation figures are from official NKVD reports and later estimates, about 10,000 from Estonia, 15,000 from Latvia and 17,500 from Lithuania in June 1941.": "De nombreux États occidentaux, dont les États-Unis, n’ont jamais reconnu l’annexion et les trois États ont retrouvé leur indépendance en 1990-1991. Les chiffres d’expulsion proviennent des rapports officiels du NKVD et des estimations ultérieures, soit environ 10 000 de l’Estonie, 15 000 de la Lettonie et 17 500 de la Lituanie en juin 1941."
