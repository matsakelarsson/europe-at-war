# French translations of the catalogue text (wave 12); step bodies follow later.
Spain against Algiers: L’Espagne contre Alger
"Spain’s long struggle with the Regency of Algiers over Oran and Mers el-Kébir, its last fortresses on the Algerian coast, and over the corsair war at sea. During the War of the Spanish Succession the bey of the west, Mustapha Bouchelaghem, took Oran in January 1708 and Mers el-Kébir in April. In 1732 a Spanish armada of some 25,000 men under the Count (later Duke) of Montemar landed near Mers el-Kébir and recovered both, and for the next sixty years the Spanish garrison lived under constant blockade. Charles III tried to strike at Algiers itself: Alejandro O’Reilly’s landing of about 20,000 men in July 1775 was routed on the beaches, and Antonio Barceló’s fleets bombarded the city in 1783 and 1784 without forcing it to terms. Spain made peace with Algiers in 1786. After an earthquake ruined Oran in October 1790 and Bey Mohammed el-Kebir besieged it, Spain agreed to give up Oran and Mers el-Kébir, and handed them over in early 1792.": "La longue lutte de l’Espagne contre la régence d’Alger pour Oran et Mers el-Kébir, ses dernières forteresses sur la côte algérienne, ainsi que dans la guerre de course en mer. Pendant la guerre de Succession d’Espagne, le bey de l’Ouest, Mustapha Bouchelaghem, prit Oran en janvier 1708 et Mers el-Kébir en avril. En 1732, une armada espagnole d’environ 25 000 hommes commandée par le comte (puis duc) de Montemar débarqua près de Mers el-Kébir et reprit les deux places, et pendant les soixante années suivantes la garnison espagnole vécut sous un blocus constant. Charles III tenta de frapper Alger même : le débarquement d’environ 20 000 hommes d’Alejandro O’Reilly en juillet 1775 fut mis en déroute sur les plages, et les flottes d’Antonio Barceló bombardèrent la ville en 1783 et en 1784 sans la contraindre à traiter. L’Espagne fit la paix avec Alger en 1786. Après qu’un tremblement de terre eut ruiné Oran en octobre 1790 et que le bey Mohammed el-Kebir l’eut assiégée, l’Espagne accepta de céder Oran et Mers el-Kébir, qu’elle remit au début de 1792."
