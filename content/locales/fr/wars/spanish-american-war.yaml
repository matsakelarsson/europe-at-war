"Spanish–American War": "Guerre hispano-américaine"
"A war between Spain and the United States that grew out of the Cuban War of Independence and the explosion of the American battleship Maine in Havana harbour in February 1898. American squadrons destroyed the Spanish fleets at Manila Bay on 1 May and off Santiago de Cuba on 3 July, and American troops took Santiago, Puerto Rico and Manila. By the Treaty of Paris of 10 December 1898 Spain gave up Cuba and ceded Puerto Rico, Guam and the Philippines to the United States, for which it was paid $20 million. In Spain the loss of the last major colonies was remembered as “the Disaster” of 1898.": "Une guerre entre l’Espagne et les États-Unis qui est née de la guerre d’indépendance cubaine et de l’explosion du navire de combat américain Maine dans le port de La Havane en février 1898. Les escadrons américains ont détruit les flottes espagnoles à Manille Bay le 1er mai et au large de Santiago de Cuba le 3 juillet, et les troupes américaines ont pris Santiago, Porto Rico et Manille. Par le traité de Paris du 10 décembre 1898 l’Espagne a cédé Cuba et cédé Porto Rico, Guam et les Philippines aux États-Unis, pour lequel il a été payé 20 millions de dollars. En Espagne, la perte des dernières grandes colonies a été rappelée comme la catastrophe de 1898."
"The fighting took place in the Caribbean and the Pacific, outside the map. Far more soldiers on both sides died of disease than in battle.": "Les combats ont eu lieu dans les Caraïbes et le Pacifique, en dehors de la carte. Beaucoup plus de soldats des deux côtés sont morts de maladies que dans la bataille."
