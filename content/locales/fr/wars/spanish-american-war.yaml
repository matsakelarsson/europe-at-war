# French translations of the catalogue text (wave 14); step bodies follow later.
Spanish–American War: Guerre hispano-américaine
Spanish–American War (Wikipedia): Guerre hispano-américaine (Wikipédia)
United States: États-Unis
Spain: Espagne
? The war of 1898 between Spain and the United States, which grew out of the Cuban War of Independence. American sympathy for the Cuban insurgents, outrage at the deaths in Spain’s reconcentration camps, fed by a sensational press, and American investments in Cuba came to a head when the battleship Maine exploded in Havana harbour on 15 February 1898. In April Congress demanded Spain’s withdrawal from Cuba, while renouncing any intention to annex it, and the war began. On 1 May Commodore George Dewey destroyed the Spanish squadron in Manila Bay. In the Caribbean Admiral Pascual Cervera’s squadron took refuge at Santiago de Cuba, and an American army landed nearby in June with the help of Calixto García’s Cuban insurgents, took the San Juan Heights and El Caney on 1 July and besieged the city; on 3 July Cervera’s ships were destroyed trying to break out, and Santiago surrendered on 17 July. American troops then landed in Puerto Rico and advanced across the island until the armistice of 12 August; Manila fell the next day. By the Treaty of Paris of 10 December 1898 Spain gave up Cuba and ceded Puerto Rico, Guam and the Philippines to the United States for $20 million. About 2,450 Americans died, most of them of disease, as did most of the roughly 15,700 Spanish dead. The United States became a colonial power in the Caribbean and the Pacific; in Spain the loss of the last great colonies was remembered as “the Disaster”, and in the Philippines the war led straight into the Philippine–American War.
: La guerre de 1898 entre l’Espagne et les États-Unis, née de la guerre d’indépendance cubaine. La sympathie des Américains pour les insurgés cubains, leur indignation devant les morts des camps de reconcentration espagnols, attisée par une presse à sensation, et les investissements américains à Cuba atteignirent un point critique lorsque le cuirassé Maine explosa dans le port de La Havane le 15 février 1898. En avril, le Congrès exigea le retrait de l’Espagne de Cuba, en renonçant à toute visée d’annexion de l’île, et la guerre commença. Le 1er mai, le commodore George Dewey détruisit l’escadre espagnole dans la baie de Manille. Dans les Caraïbes, l’escadre de l’amiral Pascual Cervera se réfugia à Santiago de Cuba, et une armée américaine débarqua à proximité en juin avec l’aide des insurgés cubains de Calixto García, prit les hauteurs de San Juan et El Caney le 1er juillet et assiégea la ville ; le 3 juillet, les navires de Cervera furent détruits en tentant de forcer la sortie du port, et Santiago capitula le 17 juillet. Les troupes américaines débarquèrent ensuite à Porto Rico et progressèrent à travers l’île jusqu’à l’armistice du 12 août ; Manille tomba le lendemain. Par le traité de Paris du 10 décembre 1898, l’Espagne renonça à Cuba et céda Porto Rico, Guam et les Philippines aux États-Unis contre 20 millions de dollars. Environ 2 450 Américains moururent, pour la plupart de maladie, comme la plupart des quelque 15 700 morts espagnols. Les États-Unis devinrent une puissance coloniale dans les Caraïbes et le Pacifique ; en Espagne, la perte des dernières grandes colonies resta dans les mémoires comme « le Désastre », et aux Philippines la guerre déboucha directement sur la guerre américano-philippine.
