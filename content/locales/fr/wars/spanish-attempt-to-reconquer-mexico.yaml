# French translations of the catalogue text (wave 14); step bodies follow later.
Spanish attempt to reconquer Mexico: Tentative espagnole de reconquête du Mexique
? The expedition with which Ferdinand VII of Spain tried to win back Mexico in 1829, eight years after its independence. Spain had never recognised the Treaty of Córdoba, held the fortress of San Juan de Ulúa off Veracruz until 1825 and kept an army in Cuba; Mexico had expelled many Spanish-born residents in 1827–1829, and Spanish planners hoped that loyalists would rise. Brigadier Isidro Barradas sailed from Havana with about 3,500 soldiers, landed at Cabo Rojo on the Gulf coast at the end of July 1829 and occupied Tampico, but no one rose to join him. Antonio López de Santa Anna, governor of Veracruz, came by sea and land with troops from Veracruz, and Manuel Mier y Terán with forces from the north, and they besieged the Spaniards while yellow fever and dysentery spread through the invading army. After an assault on the fort of La Barra on 10 September, Barradas capitulated on 11 September 1829 at Pueblo Viejo, across the Pánuco River from Tampico, and his troops were shipped back to Cuba. Fever and fighting cost the expedition hundreds of dead. The victory made Santa Anna a national hero, the “hero of Tampico”, and helped bring him to the presidency in 1833. Spain recognised Mexico’s independence in the Santa María–Calatrava Treaty of 28 December 1836.
: L’expédition par laquelle Ferdinand VII d’Espagne tenta de reprendre le Mexique en 1829, huit ans après son indépendance. L’Espagne n’avait jamais reconnu le traité de Córdoba ; elle avait tenu la forteresse de San Juan de Ulúa, au large de Veracruz, jusqu’en 1825 et entretenait une armée à Cuba ; le Mexique avait expulsé de nombreux résidents nés en Espagne en 1827–1829, et les stratèges espagnols espéraient un soulèvement des loyalistes. Le brigadier Isidro Barradas partit de La Havane avec environ 3 500 soldats, débarqua à Cabo Rojo, sur la côte du golfe, à la fin de juillet 1829 et occupa Tampico, mais personne ne se souleva pour le rejoindre. Antonio López de Santa Anna, gouverneur de Veracruz, arriva par mer et par terre avec des troupes de Veracruz, et Manuel Mier y Terán avec des forces du Nord, et ils assiégèrent les Espagnols tandis que la fièvre jaune et la dysenterie se répandaient dans l’armée d’invasion. Après un assaut contre le fort de La Barra le 10 septembre, Barradas capitula le 11 septembre 1829 à Pueblo Viejo, en face de Tampico, sur l’autre rive du Pánuco, et ses troupes furent rembarquées pour Cuba. La fièvre et les combats coûtèrent à l’expédition des centaines de morts. La victoire fit de Santa Anna un héros national, le « héros de Tampico », et contribua à le porter à la présidence en 1833. L’Espagne reconnut l’indépendance du Mexique par le traité Santa María-Calatrava du 28 décembre 1836.
