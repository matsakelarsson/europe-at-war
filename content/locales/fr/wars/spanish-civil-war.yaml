"The Republican offensive west of Madrid took Brunete, but Nationalist counter-attacks retook it, and both sides lost heavily in the summer heat.": "L’offensive républicaine à l’ouest de Madrid a pris Brunete, mais les contre-attaques nationalistes l’ont repris, et les deux parties ont fortement perdu dans la chaleur estivale."
"Belchite": "Belchite"
"6 September 1937": "6 septembre 1937"
"Taken after a siege by Republican troops; the ruined town was never rebuilt, and a new one was built beside it after the war.": "Prise après un siège par les troupes républicaines ; la ville ruinée n’a jamais été reconstruite, et une nouvelle a été construite à côté de elle après la guerre."
"Santander": "Santander"
"26 August 1937": "26 août 1937"
"Spanish and Italian troops entered the city; tens of thousands of Republican soldiers were taken prisoner in Cantabria.": "Des troupes espagnoles et italiennes sont entrées dans la ville ; des dizaines de milliers de soldats républicains ont été faits prisonniers à Cantabrie."
"Santoña": "Saint-Marin"
"Basque battalions surrendered to the Italians on the promise that they would be allowed to leave; the Nationalists overruled the agreement and imprisoned them.": "Les bataillons basques se rendirent aux Italiens sur la promesse qu’ils seraient autorisés à partir ; les nationalistes renversèrent l’accord et les emprisonnèrent."
"Gijón": "Gijón"
"The fall of the city ended the war in the north.": "La chute de la ville a mis fin à la guerre dans le nord."
"Dávila": "Dávila"
"Held by the Nationalists, late October 1937 (approximate)": "Tenue par les nationalistes, fin octobre 1937 (approximative)"
"Teruel": "Teruel"
"December 1937 – February 1938": "décembre 1937 – février 1938"
"To forestall a new Nationalist offensive against Madrid, the Republican army attacked the Nationalist salient of Teruel on 15 December 1937, in snow, during the worst Spanish winter in twenty years. Within a week Republican troops were in the town, where Colonel Domingo Rey d’Harcourt’s garrison held out in a few strongpoints. Franco, unwilling to let any provincial capital fall, cancelled his Madrid offensive and sent relief forces under Generals José Enrique Varela and Antonio Aranda. They attacked on 29 December but were halted by blizzards and severe frost, and on 8 January 1938 Rey d’Harcourt surrendered.": "Pour prévenir une nouvelle offensive nationaliste contre Madrid, l’armée républicaine attaqua le saillant nationaliste de Teruel le 15 décembre 1937, dans la neige, pendant le pire hiver espagnol en vingt ans. En moins d’une semaine, les troupes républicaines étaient dans la ville, où la garnison du colonel Domingo Rey d=Harcourt=\" se tenait en quelques points forts. Franco, peu disposé à laisser tomber une capitale provinciale, annula son offensive de Madrid et envoya des forces de secours sous les généraux José Enrique Varela et Antonio Aranda. Ils attaquèrent le 29 décembre mais furent stoppés par des blizzards et de graves gelées."
"Teruel was the only provincial capital the Republic took during the war, and it did not keep it long. The Nationalists brought up far more artillery and aircraft, broke the Republican lines on the Alfambra north of the town in early February, and closed in from three sides. On 22 February they retook the ruined town as the last Republican units broke out. Each side lost around 60,000 men killed, wounded, sick or frostbitten, and the battle used up the reserves of the Republican army just before the Nationalists struck in Aragon.": "Teruel était la seule capitale provinciale prise par la République pendant la guerre, et elle ne l’a pas gardé longtemps. Les nationalistes ont élevé beaucoup plus d’artillerie et d’avions, brisé les lignes républicaines sur l’Alfambra au nord de la ville au début février, et fermé à partir de trois côtés. Le 22 février ils ont repris la ville ruinée comme les dernières unités républicaines ont éclaté. Chaque camp a perdu environ 60 000 hommes tués, blessés, malades ou engelés, et la bataille a épuisé les réserves de l’armée républicaine juste avant que les nationalistes frappent à Aragon."
"Republican attack": "Attaque républicaine"
"15 December 1937": "15 décembre 1937"
"Garrison surrenders": "Remises de garnison"
"8 January 1938": "8 janvier 1938"
"Nationalists retake Teruel": "Les nationalistes reprennent Teruel"
"22 February 1938": "22 février 1938"
"15 December 1937 – 22 February 1938": "15 décembre 1937 – 22 février 1938"
"Taken by the Republicans after three weeks of street fighting, and retaken by the Nationalists six weeks later.": "Prise par les républicains après trois semaines de combats de rue, et reprise par les nationalistes six semaines plus tard."
"Alfambra": "Alfambra"
"5–7 February 1938": "5–7 février 1938"
"Nationalist cavalry and infantry broke through north of Teruel and took thousands of prisoners.": "La cavalerie et l’infanterie nationalistes ont traversé le nord de Teruel et pris des milliers de prisonniers."
"Republican army": "Armée républicaine"
"Aranda": "Produits alimentaires"
"Republican lines around Teruel, late December 1937 (approximate)": "Lignes républicaines autour de Teruel, fin décembre 1937 (approximation)"
"Nationalist front, late February 1938 (approximate)": "Front nationaliste, fin février 1938 (approximatif)"
"Aragon and the road to the sea": "Aragon et la route vers la mer"
"March – July 1938": "mars – juillet 1938"
"On 7 March 1938 the Nationalists, with Italian divisions and German and Italian aircraft, opened an offensive in Aragon against a Republican army worn out at Teruel. The front gave way. Belchite was retaken on 10 March, and within a month Nationalist columns had overrun eastern Aragon, taken Lleida on 3 April and reached the Segre and the Ebro. On 15 April Navarrese troops under General Camilo Alonso Vega reached the Mediterranean at Vinaròs, cutting the Republic in two and separating Catalonia from Valencia and Madrid. In March Italian bombers from Mallorca had struck Barcelona for three days, killing about a thousand people.": "Le 7 mars 1938 les nationalistes, avec des divisions italiennes et des avions allemands et italiens, ont ouvert une offensive à Aragon contre une armée républicaine épuisée à Teruel. Le front a cédé. Belchite a été repris le 10 mars, et en un mois les colonnes nationalistes avaient envahi l’est de l’Aragon, pris Lleida le 3 avril et atteint le Segre et l’Ebre. Le 15 avril, les troupes de Navarre sous le commandement du général Camilo Alonso Vega atteignirent la Méditerranée à Vinaròs, coupant la République en deux et séparant la Catalogne de Valence et Madrid. En mars, des bombardiers italiens de Majorque avaient frappé Barcelone pendant trois jours, tuant environ mille personnes."
"Instead of attacking Catalonia, Franco turned south against Valencia. His troops took Castellón on 14 June, but in July they were stopped with heavy losses on the fortified XYZ line in the mountains north of Sagunto. The Republican prime minister, Juan Negrín, had offered peace terms on 1 May, his Thirteen Points, which Franco ignored; Negrín hoped that the Republic could hold out until a wider European war brought it allies. On 5 April Franco abolished Catalonia’s autonomy.": "Au lieu d’attaquer la Catalogne, Franco s’est tourné vers le sud contre Valence. Ses troupes ont pris Castellón le 14 juin, mais en juillet elles ont été arrêtées avec de lourdes pertes sur la ligne fortifiée XYZ dans les montagnes au nord de Sagunto. Le premier ministre républicain, Juan Negrín, avait offert des conditions de paix le 1er mai, ses treize points, que Franco a ignorés ; Negrín espérait que la République pourrait tenir jusqu’à ce qu’une guerre européenne plus large lui amène des alliés. Le 5 avril, Franco a aboli l’autonomie de la Catalogne."
"Aragon offensive opens": "Ouverture de l’offensive aragonaise"
"7 March 1938": "7 mars 1938"
"Vinaròs reached": "Vinaròs atteint"
"15 April 1938": "15 avril 1938"
"Castellón taken": "Castellón pris"
"14 June 1938": "14 juin 1938"
"10 March 1938": "10 mars 1938"
"Retaken on the third day of the offensive.": "Reprise le troisième jour de l’offensive."
"Caspe": "Caspe"
"17 March 1938": "17 mars 1938"
"The former seat of the anarchist Council of Aragon fell after a fight with the International Brigades.": "L’ancien siège du Conseil anarchiste d’Aragon est tombé après un combat avec les Brigades Internationales."
"Lleida": "Lleida"
"3 April 1938": "3 avril 1938"
"Yagüe’s troops took the first Catalan provincial capital after a week of fighting; the front then settled on the Segre.": "Après une semaine de combats, les troupes de Yagüe arrivèrent à la première capitale provinciale catalane ; le front s’installa alors sur le Segre."
"Vinaròs": "Vinarès"
"Navarrese troops reached the sea on Good Friday, splitting the Republic into two zones.": "Les troupes de Navarre sont arrivées à la mer le Vendredi saint et ont divisé la République en deux zones."
"16–18 March 1938": "16–18 mars 1938"
"Italian bombers from Mallorca raided the city at intervals for three days and nights.": "Des bombardiers italiens de Majorque ont fait une descente dans la ville à intervalles de trois jours et de nuits."
"Castellón": "Castellón"
"Taken after a slow advance down the coast and through the mountains of the Maestrazgo.": "Prise après une lente avance sur la côte et à travers les montagnes du Maestrazgo."
"XYZ line": "Ligne XYZ"
"July 1938": "juillet 1938"
"Trenches and bunkers in the Sierra de Espadán and the hills north of Sagunto stopped the Nationalist drive on Valencia.": "Des tranchées et des bunkers dans la Sierra d’Espadán et les collines au nord de Sagunto ont arrêté la conduite nationaliste sur Valence."
"Alonso Vega": "Alonso Vega"
"Held by the Nationalists, late July 1938 (approximate)": "Tenue par les nationalistes, fin juillet 1938 (approximative)"
"The Ebro": "L’Èbre"
"July – November 1938": "juillet – novembre 1938"
"On the night of 24–25 July 1938 the Republican Army of the Ebro under Juan Modesto crossed the river in boats and on pontoon bridges between Mequinenza and Amposta, to rejoin the two halves of the Republic and draw Franco away from Valencia. The crossing took the Nationalists by surprise, and in a few days the Republicans pushed into the great bend of the river as far as the outskirts of Gandesa. They could not take the town, and the offensive stalled. Nationalist aircraft bombed the bridges again and again, and dams upstream were opened to flood the river behind the Republicans.": "Dans la nuit du 24 au 25 juillet 1938, l’armée républicaine de l’Èbre sous Juan Modesto traversa la rivière en bateau et sur ponton des ponts entre Mequinenza et Amposta, pour rejoindre les deux moitiés de la République et détourner Franco de Valence. La traversée prit les nationalistes par surprise, et en quelques jours les républicains poussèrent dans le grand virage de la rivière jusqu’à la périphérie de Gandesa. Ils ne pouvaient pas prendre la ville, et l’offensive a décroché. L’avion nationaliste bombardait encore et encore les ponts, et des barrages en amont étaient ouverts pour inonder le fleuve derrière les républicains."
"Franco chose to wear the Republican army down where it stood. For more than three months Nationalist artillery and aircraft pounded its positions in the bare hills of the Sierra de Pàndols and Cavalls, and counter-attack after counter-attack slowly retook the ground. By 16 November the last Republican troops had crossed back over the river. The battle, the longest of the war, cost each side tens of thousands of casualties and destroyed the Republic’s last effective army. Meanwhile the Munich Agreement of 30 September ended Negrín’s hope of help from Britain and France, and the International Brigades were withdrawn, holding a farewell parade in Barcelona on 28 October.": "Franco a choisi de porter l’armée républicaine là où elle se trouvait. Pendant plus de trois mois, l’artillerie et les avions nationalistes ont frappé ses positions dans les collines nues de la Sierra de Pàndols et de Cavalls, et contre-attaque après avoir repris lentement le sol. La bataille, la plus longue de la guerre, a coûté à chaque camp des dizaines de milliers de victimes et détruit la dernière armée efficace de la République. Pendant ce temps, l’Accord de Munich du 30 septembre a mis fin à l’espoir d’aide de la Grande-Bretagne et de la France, et les Brigades internationales ont été retirées, tenant un défilé d’adieu à Barcelone le 28 octobre."
"Crossing of the Ebro": "Traversée de l’Ebro"
"night of 24–25 July 1938": "nuit du 24 au 25 juillet 1938"
"Last Republicans withdraw": "Les derniers républicains se retirent"
"16 November 1938": "16 novembre 1938"
"International Brigades’ farewell": "Adieu des Brigades Internationales"
"Barcelona, 28 October 1938": "Barcelone, 28 octobre 1938"
"Móra d’Ebre": "Móra d’Ebre"
"25 July 1938": "25 juillet 1938"
"One of the main crossing points; boats, footbridges and pontoon bridges carried the Army of the Ebro over in the first night and day.": "L’un des principaux points de passage ; bateaux, passerelles et ponts ponton transportèrent l’Armée de l’Èbre dans la première nuit et le premier jour."
"Gandesa": "Gandesa"
"late July – early August 1938": "fin juillet – début août 1938"
"The Republican attacks on the town, defended by Nationalist troops on the heights around it, failed and the offensive came to a halt.": "Les attaques républicaines contre la ville, défendues par les troupes nationalistes sur les hauteurs qui l’entourent, ont échoué et l’offensive s’est arrêtée."
"Sierra de Pàndols": "Sierra de Pàndols"
"August – November 1938": "août – novembre 1938"
"Some of the hardest fighting of the battle took place on these rocky heights, where the Republicans had little cover from artillery.": "Certains des combats les plus difficiles de la bataille ont eu lieu sur ces hauteurs rocheuses, où les républicains avaient peu de couverture de l’artillerie."
"Amposta": "Amposta"
"A crossing by the XIV International Brigade near the mouth of the river was thrown back with heavy losses.": "Un passage par la XIVe Brigade internationale près de l’embouchure du fleuve a été repoussé avec de lourdes pertes."
"28 October 1938": "28 octobre 1938"
"The International Brigades marched through the city in a farewell parade, where the communist leader Dolores Ibárruri, “La Pasionaria”, told them “You are history”.": "Les Brigades Internationales ont marché à travers la ville dans une parade d’adieu, où le leader communiste Dolores Ibárruri, La Pasionaria, leur a dit : Vous êtes l’histoire."
"Modesto": "Modesto"
"Front before and after the battle, July and November 1938 (approximate)": "Front avant et après la bataille, juillet et novembre 1938 (approximative)"
"Republican bridgehead, early August 1938 (approximate)": "Tête de pont républicaine, début août 1938 (approximative)"
"Catalonia and the end of the war": "Catalogne et fin de la guerre"
"December 1938 – April 1939": "décembre 1938 – avril 1939"
"On 23 December 1938 the Nationalists attacked Catalonia with overwhelming artillery and air power. The worn-out Republican army could not hold, Tarragona fell on 15 January 1939 and Barcelona on 26 January, almost without a fight. Hundreds of thousands of soldiers and civilians fled north through snow and air raids to the French border, which France opened to civilians on 28 January and to soldiers on 5 February. Nearly 500,000 people crossed in what Spaniards call La Retirada (the retreat), and many were held behind barbed wire in camps on the beaches of Roussillon. Nationalist troops reached the border on 10 February.": "Le 23 décembre 1938, les nationalistes attaquèrent la Catalogne avec une puissance aérienne et d’artillerie écrasante. L’armée républicaine épuisée ne put pas tenir, Tarragona tomba le 15 janvier 1939 et Barcelone le 26 janvier, presque sans combat. Des centaines de milliers de soldats et de civils s’enfuirent au nord par des raids enneigés et aériens à la frontière française, que la France ouvrit aux civils le 28 janvier et aux soldats le 5 février. Près de 500 000 personnes ont traversé ce que les Espagnols appellent La Retirada (la retraite), et beaucoup ont été retenus derrière des barbelés dans des camps sur les plages de Roussillon. Les troupes nationalistes sont arrivées à la frontière le 10 février."
"The Republic still held Madrid, Valencia and the south-east, but Britain and France recognised Franco’s government on 27 February and President Manuel Azaña resigned. On 5 March Colonel Segismundo Casado, commanding the Army of the Centre, rose against Negrín’s government, which he accused of serving the communists, and set up a National Defence Council to negotiate peace, setting off a week of fighting in Madrid. Franco would accept only unconditional surrender. His troops entered Madrid on 28 March, and on 1 April he declared the war over. The victors executed many thousands of Republicans and held hundreds of thousands in camps and prisons.": "La République a toujours tenu Madrid, Valence et le sud-est, mais la Grande-Bretagne et la France ont reconnu le gouvernement François le 27 février et le président Manuel Azaña a démissionné. Le 5 mars, le colonel Segismundo Casado, commandant l’armée du Centre, s’est levé contre le gouvernement Negrín, qu’il accusait de servir les communistes, et a mis en place un Conseil national de défense pour négocier la paix, déclenchant une semaine de combats à Madrid. Franco accepterait seulement la reddition inconditionnelle. Ses troupes sont entrées à Madrid le 28 mars, et le 1er avril il a déclaré la guerre. Les vainqueurs ont exécuté des milliers de républicains et tenu des centaines de milliers dans les camps et les prisons."
"Barcelona taken": "Barcelone prise"
"26 January 1939": "26 janvier 1939"
"Casado’s coup": "Coup d’État de Casado"
"5 March 1939": "5 mars 1939"
"End of the war": "Fin de la guerre"
