"The July coup": "Le coup d’Etat de juillet"
"17–31 July 1936": "17–31 juillet 1936"
"Spain had been a republic since 1931. After the Popular Front, an alliance of the left, won the elections of February 1936, strikes, land seizures and killings by militants of left and right deepened the divide, and a group of generals led by Emilio Mola in Pamplona planned a coup. On 13 July Assault Guards and socialist gunmen murdered the monarchist leader José Calvo Sotelo. The rising began in Spanish Morocco on 17 July and spread to garrisons across the mainland over the next two days. Francisco Franco, the commander in the Canary Islands, flew to Tetuán to lead the Army of Africa, Spain’s best troops.": "L’Espagne était une république depuis 1931. Après le Front populaire, alliance de gauche, a remporté les élections de février 1936, grèves, saisies de terres et assassinats par des militants de gauche et de droite ont approfondi la fracture, et un groupe de généraux dirigé par Emilio Mola à Pampelune a planifié un coup d’État. La montée a commencé au Maroc espagnol le 17 juillet et s’est étendue aux garnisons à travers le continent au cours des deux prochains jours. Francisco Franco, le commandant dans les îles Canaries, a volé à Tetuán pour diriger l’Armée d’Afrique, Espagne les meilleures troupes."
"The coup took Seville, Zaragoza and most of Old Castile, León, Galicia and Navarre, but it failed in Madrid, Barcelona, Valencia, Asturias and the Basque coast, where the government armed the workers’ parties and trade unions. Most of the navy’s crews turned on their officers, leaving the Army of Africa stranded in Morocco, and Mola’s columns were stopped in the passes of the Guadarrama north of Madrid. Behind the lines both sides began to kill their enemies. The rebels shot trade unionists, left-wing politicians and officials, and in the Republican zone militias murdered priests, landowners and suspected right-wingers.": "Le coup prit Séville, Saragosse et la plupart de la Vieille Castille, León, Galice et Navarre, mais il échoua à Madrid, Barcelone, Valence, Asturies et la côte basque, où le gouvernement a armé les partis ouvriers et les syndicats. La plupart des équipages de la marine ont tourné sur leurs officiers, laissant l’Armée d’Afrique échouée au Maroc, et les colonnes de Mola sont arrêtées dans les cols du Guadarrama au nord de Madrid. Derrière les lignes ont commencé à tuer leurs ennemis."
