"March – October 1937": "mars – octobre 1937"
"In spring 1937 Franco turned against the Republican north, cut off from the rest of the Republic. Mola’s offensive against the Basque Country began on 31 March, when the town of Durango was bombed. On 26 April aircraft of the German Condor Legion, joined by Italian bombers, destroyed much of Guernica, the historic seat of the Basque assemblies, killing perhaps 200 to 300 people. The Nationalists claimed the retreating Basques had burned the town, but reports by foreign journalists, and Pablo Picasso’s painting, made it known across the world. Mola was killed in an air crash on 3 June, and on 19 June the Nationalists entered Bilbao after breaking through its fortified ring.": "Au printemps 1937, Franco se tourna contre le nord républicain, coupé du reste de la République. L’offensive des Molas contre le Pays Basque commença le 31 mars, lorsque la ville de Durango fut bombardée. Le 26 avril, l’avion de la Légion Condor allemande, rejoint par des bombardiers italiens, détruisit une grande partie de Guernica, siège historique des assemblées basques, tuant peut-être 200 à 300 personnes. Les nationalistes ont affirmé que les Basques en retraite avaient brûlé la ville, mais des journalistes étrangers, et Pablo Picasso de peinture, l’ont fait connaître à travers le monde. Mola a été tué dans un accident aérien le 3 juin, et le 19 juin les nationalistes sont entrés Bilbao après avoir traversé son anneau fortifié."
"To relieve the north the Republic attacked at Brunete, west of Madrid, in July and towards Zaragoza in August, but took only a few villages and the ruined town of Belchite, at heavy cost. Santander fell on 26 August; many Basque troops surrendered to the Italians at Santoña on terms that the Nationalists did not honour. Asturias held out until 21 October, when Gijón fell. With the northern coast, its coal and iron mines and its heavy industry, Franco had the stronger economy and could move his whole army south and east. Some of the defeated took to the mountains as guerrillas.": "Pour soulager le nord de la République attaqué à Brunete, à l’ouest de Madrid, en juillet et vers Saragosse en août, mais a pris seulement quelques villages et la ville ruinée de Belchite, à un coût lourd. Santander est tombé le 26 août ; beaucoup de troupes basques se sont rendues aux Italiens à Santoña à des conditions que les nationalistes n’ont pas honorés. Asturies tenu jusqu’au 21 octobre, quand Gijón tombe. Avec la côte nord, ses mines de charbon et de fer et son industrie lourde, Franco avait l’économie plus forte et pouvait déplacer toute son armée vers le sud et l’est."
