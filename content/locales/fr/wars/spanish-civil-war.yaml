"Cartagena": "Cartagena"
"4–7 March 1939": "4–7 mars 1939"
"During a rising in the naval base the Republican fleet sailed for Bizerte, and the coastal batteries sank the Nationalist troopship Castillo de Olite, killing about 1,500 men.": "Lors d’une montée dans la base navale, la flotte républicaine a navigué pour Bizerte, et les batteries côtières ont coulé le vaisseau nationaliste Castillo de Olite, tuant environ 1500 hommes."
"28 March 1939": "28 mars 1939"
"After Casado’s forces had defeated the communist-led units in the city, Nationalist troops marched in without a fight.": "Après que les forces de Casado ont vaincu les unités communistes de la ville, les troupes nationalistes ont marché sans se battre."
"Alicante": "Alicante"
"30 March – 1 April 1939": "30 mars – 1er avril 1939"
"Thousands of Republicans gathered at the port in the hope of ships; few came, and Italian troops took them prisoner.": "Des milliers de républicains se sont rassemblés au port dans l’espoir de navires ; peu sont venus, et les troupes italiennes les ont faits prisonniers."
"La Retirada": "La Retraitada"
"Still held by the Republic, February–March 1939 (approximate)": "Toujours détenu par la République, février-mars 1939 (approximative)"
