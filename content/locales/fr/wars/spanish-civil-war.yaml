"Spanish Civil War": "Guerre civile espagnole"
"A war between the government of the Second Spanish Republic, backed by the parties of the left, the trade unions and the Basque and Catalan autonomists, and the Nationalists, army rebels joined by monarchists, Carlists and the fascist Falange, who were led from October 1936 by General Francisco Franco. With troops, aircraft and arms from Fascist Italy and Nazi Germany the Nationalists won, while the Republic depended on the Soviet Union and the International Brigades; Franco then ruled Spain as dictator until his death in 1975. Estimates of the dead differ widely, but by many counts some 200,000 died at the front and about as many were murdered or executed behind the lines and after the war, most of them by the Nationalists.": "Une guerre entre le gouvernement de la Deuxième République espagnole, soutenue par les partis de gauche, les syndicats et les autonomistes basques et catalans, et les nationalistes, rebelles de l’armée rejoints par les monarchistes, les carlistes et le fasciste Falange, qui ont été conduits à partir d’octobre 1936 par le général Francisco Franco. Avec des troupes, des avions et des armes de l’Italie fasciste et de l’Allemagne nazie, les nationalistes ont gagné, tandis que la République dépendait de l’Union soviétique et des Brigades Internationales ; Franco a alors gouverné l’Espagne comme dictateur jusqu’à sa mort en 1975."
"The Republicans were also called loyalists, and their enemies called them “Reds”; the Nationalists (nacionales) were also called rebels or insurgents. The base map shows Spain undivided, under the Republic, which Britain and France recognised until 27 February 1939; the areas held by each side are drawn in the steps, approximately, from general accounts.": "Les Républicains étaient aussi appelés loyalistes, et leurs ennemis les appelaient Rouges ; les Nationalistes (nacionales) étaient également appelés rebelles ou insurgés. La carte de base montre l’Espagne indivise, sous la République, que la Grande-Bretagne et la France ont reconnu jusqu’au 27 février 1939 ; les zones détenues par chaque partie sont tracées dans les étapes, environ, des comptes généraux."
"Places in Catalonia and the Basque Country are named in their present official forms, such as Lleida (Lérida), Girona (Gerona) and Vinaròs (Vinaroz); Guernica is Gernika in Basque.": "Les lieux de Catalogne et du Pays Basque sont nommés dans leurs formes officielles actuelles, comme Lleida (Lérida), Girona (Gérone) et Vinaròs (Vinaroz) ; Guernica est Gernika en basque."
"Italy sent some 70,000–75,000 troops in all, as the Corps of Volunteer Troops (CTV), and Germany some 16,000, many of them in the Condor Legion’s air units. The Soviet Union sold the Republic aircraft, tanks and arms and sent a few thousand advisers, pilots and tank crews, and about 35,000 foreign volunteers served in the International Brigades.": "L’Italie a envoyé entre 70 000 et 75 000 soldats en tout, comme le Corps des troupes volontaires (CTV), et l’Allemagne environ 16 000, dont beaucoup dans les unités aériennes de la Condor Legion. L’Union soviétique a vendu des avions, des chars et des armes de la République et envoyé quelques milliers de conseillers, pilotes et équipages de chars, et environ 35 000 volontaires étrangers ont servi dans les Brigades internationales."
