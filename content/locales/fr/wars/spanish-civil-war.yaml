"The Republican government had already left for Girona and Figueres; Nationalist troops entered the city unopposed.": "Le gouvernement républicain était déjà parti pour Girona et Figueres ; les troupes nationalistes entrèrent dans la ville sans opposition."
"Figueres": "Figueres"
"1 February 1939": "1er février 1939"
"The last meeting of the Republican parliament, the Cortes, was held in the cellars of the castle.": "La dernière réunion du parlement républicain, les Cortes, a eu lieu dans les caves du château."
"Le Perthus": "Le Perthus"
"28 January – 10 February 1939": "28 janvier – 10 février 1939"
