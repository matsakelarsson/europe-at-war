"With the strait closed by the Republican navy, Franco asked Hitler and Mussolini for aircraft. From the end of July German Junkers Ju 52 transports and Italian Savoia-Marchetti bombers flew thousands of Spanish legionaries and Moroccan Regulares from Tetuán to Seville, in the first long-range airlift of troops in history, and a convoy crossed under air cover on 5 August. Columns under Lieutenant Colonel Juan Yagüe drove north through Extremadura by lorry, routing the militias that stood in their way. On 14 August they stormed Badajoz, where estimates of the prisoners and civilians shot in the following days, many of them in the bullring, range from 500 to 4,000.": "À la fin du mois de juillet, les transports allemands Ju 52 et les bombardiers Savoie-Marsetti italiens ont volé des milliers de légionnaires espagnols et de Régulateurs marocains de Tetuán à Séville, lors du premier transport aérien à longue portée de troupes dans l’histoire, et un convoi a traversé sous couvert aérien le 5 août. Des colonnes sous le lieutenant-colonel Juan Yagüe ont traversé l’Estrémadure par un camion, roulant les milices qui se trouvaient sur leur chemin. Le 14 août, ils ont pris Badajoz, où les estimations des prisonniers et des civils abattus dans les jours suivants, beaucoup d’entre eux dans les arènes, vont de 500 à 4.000."
"Badajoz joined the two Nationalist zones along the border with Portugal, whose dictator, António de Oliveira Salazar, openly favoured them. Yagüe’s men took Talavera de la Reina on 3 September, but Franco turned aside to relieve the Alcázar of Toledo, where Colonel José Moscardó, with Civil Guards, cadets and their families, had held out since July; his troops reached it on 27 September. In the north Mola’s forces took Irun on 5 September, cutting the Basque Country and Asturias off from France, and San Sebastián a week later. On 1 October Franco took office in Burgos as Generalísimo and head of the Nationalist state.": "Badajoz a rejoint les deux zones nationalistes le long de la frontière avec le Portugal, dont le dictateur António de Oliveira Salazar les a ouvertement favorisés. Le 3 septembre, des hommes de Yagüe-Schwa ont pris Talavera de la Reina, mais Franco s’est mis de côté pour soulager l’Alcázar de Tolède, où le colonel José Moscardó, avec des gardes civils, des cadets et leurs familles, avait tenu le combat depuis juillet ; ses troupes y sont arrivées le 27 septembre. Dans le nord de Mola, les forces prennent Irun le 5 septembre, coupant le Pays basque et les Asturies de France, et San Sebastián une semaine plus tard. Le 1er octobre Franco prend ses fonctions à Burgos en tant que généralísimo et chef de l’État nationaliste."
