"By early November the Army of Africa stood at the western and southern edge of Madrid. On 6 November the government of Francisco Largo Caballero left for Valencia, leaving General José Miaja in charge of a defence junta, with Vicente Rojo as his chief of staff. The main assault, through the Casa de Campo park and the University City, began on 8 November. Militias and new units of the Republican army, the first International Brigades of foreign volunteers, and Soviet tanks and fighters held the line, and Franco called off the frontal attack on 23 November. Through November and December some 2,000 or more prisoners taken from the city’s jails were killed at Paracuellos de Jarama and Torrejón de Ardoz.": "Au début de novembre, l’armée africaine se trouvait à la limite ouest et sud de Madrid. Le 6 novembre, le gouvernement de Francisco Largo Caballero partit pour Valence, laissant le général José Miaja en charge d’une junte de défense, avec Vicente Rojo comme chef d’état-major. Les milices et les nouvelles unités de l’armée républicaine, les premières Brigades internationales de volontaires étrangers, les chars et les combattants soviétiques ont tenu la ligne, et Franco a annulé l’attaque frontale le 23 novembre. Jusqu'en novembre et décembre quelque 2 000 prisonniers ou plus ont été enlevés des prisons de la ville à Paracuellos de Jarama et Torrejón de Ardoz."
"The Nationalists then tried to cut Madrid off. They gained ground on the Corunna road to the north-west in January 1937, and in February crossed the Jarama south-east of the city, but in three weeks of costly fighting failed to cut the road to Valencia. In March the Italian Corps of Volunteer Troops attacked from the north-east towards Guadalajara and was routed near Brihuega. In the south Nationalist and Italian troops took Málaga on 8 February. Refugees fleeing along the coast road to Almería were bombed from the air and shelled from the sea, and estimates of the dead run up to several thousand.": "En janvier 1937, les nationalistes tentèrent de couper Madrid. Ils prirent du terrain sur la route de Corunna au nord-ouest et, en février, traversèrent le Jarama au sud-est de la ville, mais en trois semaines de combats coûteux, ils ne purent pas couper la route vers Valence. Dans le sud, les troupes nationalistes et italiennes ont pris Malaga le 8 février. Les réfugiés fuyant le long de la route côtière vers Almería ont été bombardés de l’air et bombardés de la mer, et les estimations des morts courent jusqu’à plusieurs milliers."
