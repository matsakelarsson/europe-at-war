# French translations of the catalogue text (wave 14); step bodies follow later.
Spanish conquest of Cuba: Conquête espagnole de Cuba
? The conquest of Cuba by Diego Velázquez de Cuéllar in 1511–1514. Velázquez crossed from western Hispaniola early in 1511 with some 300 men and landed in the east of the island, where Hatuey, a cacique who had fled from Hispaniola, led the Taíno in a guerrilla war for several months; he was captured and burned at the stake on 2 February 1512. Reinforced by Pánfilo de Narváez and archers from Jamaica, Velázquez founded Baracoa and in 1513 sent columns west along both coasts and through the interior. At Caonao, in the Camagüey region, Narváez’s men massacred a village that had come out to meet them with food; Bartolomé de las Casas, who saw it, wrote that more than three thousand people were killed. By 1515 Velázquez had founded seven towns, from Baracoa and Bayamo to Trinidad, Sancti Spíritus, Puerto Príncipe, Havana and Santiago, and divided the Taíno in encomiendas to work the gold placers. Disease, forced labour and flight destroyed most of the island’s Indigenous population within a few decades; Taíno resistance went on in the eastern mountains under Guamá until 1533.
: La conquête de Cuba par Diego Velázquez de Cuéllar en 1511–1514. Velázquez passa de l’ouest d’Hispaniola à Cuba au début de 1511 avec quelque 300 hommes et débarqua dans l’est de l’île, où Hatuey, un cacique qui avait fui Hispaniola, mena les Taïnos dans une guérilla de plusieurs mois ; capturé, il fut brûlé vif le 2 février 1512. Renforcé par Pánfilo de Narváez et des archers venus de la Jamaïque, Velázquez fonda Baracoa et, en 1513, envoya des colonnes vers l’ouest le long des deux côtes et à travers l’intérieur. À Caonao, dans la région de Camagüey, les hommes de Narváez massacrèrent un village dont les habitants étaient venus à leur rencontre avec des vivres ; Bartolomé de las Casas, qui en fut témoin, écrivit que plus de trois mille personnes furent tuées. En 1515, Velázquez avait fondé sept villes, de Baracoa et Bayamo à Trinidad, Sancti Spíritus, Puerto Príncipe, La Havane et Santiago, et réparti les Taïnos en encomiendas pour exploiter les placers aurifères. Les maladies, le travail forcé et la fuite anéantirent en quelques décennies la plus grande partie de la population autochtone de l’île ; la résistance taïno se poursuivit dans les montagnes de l’est sous la conduite de Guamá jusqu’en 1533.
