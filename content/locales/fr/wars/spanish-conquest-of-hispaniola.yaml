# French translations of the catalogue text (wave 14); step bodies follow later.
Spanish conquest of Hispaniola: Conquête espagnole d’Hispaniola
? "The conquest of the Taíno chiefdoms of Hispaniola (Ayiti or Quisqueya) by the Crown of Castile in the decade after Christopher Columbus’s first voyage. In November 1493 Columbus’s second expedition found the fort of La Navidad destroyed by the warriors of the cacique Caonabo, and in January 1494 he founded La Isabela on the north coast and sent men into the gold-bearing Cibao. Alonso de Ojeda captured Caonabo, and in March 1495 Columbus defeated an alliance of caciques in the Vega Real and imposed a tribute in gold and cotton on the Taíno. His brother Bartolomé put down the rising of Guarionex in 1497–1498, while the Spanish colonists themselves rebelled under Francisco Roldán. Governor Nicolás de Ovando, who arrived in 1502, ended the last independent chiefdoms: in 1503 his men burned some eighty caciques in a house at Xaraguá and hanged its ruler Anacaona, and in 1503–1504 Juan de Esquivel conquered Higüey, whose cacique Cotubanamá was hanged in Santo Domingo. The surviving Taíno were divided among the colonists in encomiendas. War, famine, forced labour, enslavement and disease destroyed them within a generation: estimates of the population in 1492 range from under 100,000 to several million, a Spanish count of 1508 found about 60,000, and the repartimiento of 1514 listed about 26,000."
: "La conquête des chefferies taïnos d’Hispaniola (Ayiti ou Quisqueya) par la couronne de Castille dans la décennie qui suivit le premier voyage de Christophe Colomb. En novembre 1493, la deuxième expédition de Colomb trouva le fort de La Navidad détruit par les guerriers du cacique Caonabo ; en janvier 1494, Colomb fonda La Isabela sur la côte nord et envoya des hommes dans le Cibao aurifère. Alonso de Ojeda captura Caonabo, et en mars 1495 Colomb vainquit une alliance de caciques dans la Vega Real et imposa aux Taïnos un tribut en or et en coton. Son frère Bartolomé réprima le soulèvement de Guarionex en 1497–1498, tandis que les colons espagnols eux-mêmes se rebellaient sous la conduite de Francisco Roldán. Le gouverneur Nicolás de Ovando, arrivé en 1502, mit fin aux dernières chefferies indépendantes : en 1503, ses hommes brûlèrent quelque quatre-vingts caciques dans une maison au Xaraguá et pendirent Anacaona, souveraine de cette chefferie, et en 1503–1504 Juan de Esquivel conquit le Higüey, dont le cacique Cotubanamá fut pendu à Santo Domingo. Les Taïnos survivants furent répartis entre les colons en encomiendas. La guerre, la famine, le travail forcé, l’esclavage et les maladies les anéantirent en une génération : les estimations de la population de 1492 vont de moins de 100 000 à plusieurs millions de personnes, un dénombrement espagnol de 1508 en trouva environ 60 000, et le repartimiento de 1514 en recensait environ 26 000."
