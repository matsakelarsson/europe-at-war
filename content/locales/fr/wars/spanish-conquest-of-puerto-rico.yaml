# French translations of the catalogue text (wave 14); step bodies follow later.
Spanish conquest of Puerto Rico: Conquête espagnole de Porto Rico
? The conquest of Borikén, the island the Spaniards called San Juan Bautista and later Puerto Rico, and the Taíno war against it. In 1508 Juan Ponce de León, a veteran of the conquest of Higüey, came from Hispaniola with about fifty men, was received by the high chief Agüeybaná, who exchanged names with him in the guaytiao ritual, and founded Caparra near San Juan Bay. As governor from 1509 he divided the Taíno among the colonists in encomiendas to work the gold placers. After Agüeybaná’s death in 1510 his brother Agüeybaná II formed an alliance of caciques; according to the chroniclers, Urayoán’s men drowned a Spaniard, Diego Salcedo, to prove that the newcomers were mortal. Early in 1511 the Taíno killed Cristóbal de Sotomayor and burned his settlement, and Ponce de León answered with campaigns in the south and west that culminated in a battle at Yagüecas, where by the traditional account Agüeybaná II was shot dead. Some historians, citing later documents, think he survived and fought on. Under Juan Cerón and Miguel Díaz the Spaniards carried out dozens of slave raids in 1512–1513, while the Taíno and their Kalinago allies burned Caparra in 1513 and fought on from the east of the island and the neighbouring islands into the 1520s. A census of 1530 counted 1,148 Taíno on the island.
: La conquête de Borikén, l’île que les Espagnols appelèrent San Juan Bautista puis Porto Rico, et la guerre que les Taïnos menèrent contre elle. En 1508, Juan Ponce de León, un vétéran de la conquête du Higüey, vint d’Hispaniola avec une cinquantaine d’hommes ; il fut reçu par le grand chef Agüeybaná, qui échangea son nom avec lui selon le rite du guaytiao, et fonda Caparra près de la baie de San Juan. Gouverneur à partir de 1509, il répartit les Taïnos entre les colons en encomiendas pour exploiter les placers aurifères. Après la mort d’Agüeybaná en 1510, son frère Agüeybaná II forma une alliance de caciques ; selon les chroniqueurs, les hommes d’Urayoán noyèrent un Espagnol, Diego Salcedo, pour prouver que les nouveaux venus étaient mortels. Au début de 1511, les Taïnos tuèrent Cristóbal de Sotomayor et incendièrent son établissement ; Ponce de León riposta par des campagnes dans le sud et l’ouest qui culminèrent dans une bataille à Yagüecas, où, selon le récit traditionnel, Agüeybaná II fut abattu d’un coup de feu. Certains historiens, s’appuyant sur des documents plus tardifs, pensent qu’il survécut et continua le combat. Sous Juan Cerón et Miguel Díaz, les Espagnols menèrent des dizaines de raids esclavagistes en 1512–1513, tandis que les Taïnos et leurs alliés kalinagos incendiaient Caparra en 1513 et poursuivaient la lutte depuis l’est de l’île et les îles voisines jusque dans les années 1520. Un recensement de 1530 dénombra 1 148 Taïnos dans l’île.
