# French translations of the catalogue text (wave 14); step bodies follow later.
Spanish conquest of the Aztec Empire: Conquête de l’Empire aztèque
The overthrow of the Aztec Triple Alliance by a few hundred Spaniards under Hernán Cortés and tens of thousands of Indigenous allies, above all the Tlaxcalans, between 1519 and 1521. Cortés landed on the Gulf coast in April 1519, won over the Totonacs of Cempoala and, after a short war, Tlaxcala, massacred the people of Cholula and entered Tenochtitlan in November, where he held Moctezuma II prisoner. In 1520 the city rose after the Toxcatl massacre, and the Spaniards were driven out with heavy losses on La Noche Triste. Smallpox then killed many people in central Mexico, among them Moctezuma’s successor Cuitláhuac. From Texcoco Cortés and his allies cut Tenochtitlan off by land and, with thirteen brigantines, by water; after a siege of about three months the city fell on 13 August 1521 and Cuauhtémoc was captured. The empire’s lands became New Spain.: Le renversement de la Triple Alliance aztèque, entre 1519 et 1521, par quelques centaines d’Espagnols commandés par Hernán Cortés et des dizaines de milliers d’alliés autochtones, au premier rang desquels les Tlaxcaltèques. Cortés débarqua sur la côte du golfe en avril 1519, gagna à sa cause les Totonaques de Cempoala puis, après une courte guerre, Tlaxcala, massacra les habitants de Cholula et entra en novembre à Tenochtitlan, où il retint Moctezuma II prisonnier. En 1520, la ville se souleva après le massacre de Toxcatl, et les Espagnols en furent chassés avec de lourdes pertes lors de la Noche Triste. La variole tua ensuite de nombreux habitants du centre du Mexique, parmi lesquels Cuitláhuac, le successeur de Moctezuma. Depuis Texcoco, Cortés et ses alliés coupèrent Tenochtitlan du monde extérieur par la terre et, grâce à treize brigantins, par l’eau ; après un siège d’environ trois mois, la ville tomba le 13 août 1521 et Cuauhtémoc fut capturé. Les terres de l’empire devinrent la Nouvelle-Espagne.
