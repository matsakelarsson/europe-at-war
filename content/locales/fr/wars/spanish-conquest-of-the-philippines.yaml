# French translations of the catalogue text (wave 11); step bodies follow later.
Spanish conquest of the Philippines: Conquête espagnole des Philippines
? "The conquest that made the islands the Spanish Philippines, from Miguel López de Legazpi’s landing in 1565 to the occupation of Mindanao’s north coast in the 1590s. The islands were not one state but many: hundreds of independent communities (barangays and their federations) ruled by datus and rajahs, among them the trading towns of Cebu, Manila and Tondo, the last two with close ties to the Muslim sultanate of Brunei. Sent by Philip II from New Spain with a few hundred Spanish and Mexican soldiers, Legazpi made blood compacts with chiefs in Bohol, took Cebu from Rajah Tupas in April 1565, withstood a Portuguese blockade in 1568, and moved to Panay in 1569. In 1570 his captain Martín de Goiti fought Rajah Sulayman at Manila, and in 1571 Legazpi returned with Visayan allies, made peace with the rulers of Manila and Tondo, defeated the Kapampangan fleet at Bangkusay and founded Spanish Manila. In the next few years Juan de Salcedo and Goiti brought most of the coasts of Luzon under Spanish rule, often through agreements with local chiefs, sometimes by force. The Chinese captain Limahong’s attack on Manila in 1574, Japanese settlers in Cagayan in 1582 and a conspiracy of the Tagalog nobility in 1587–1588 were defeated, and missions reached northern Mindanao in the 1590s. For Spain it was the beginning of an empire in Asia that lasted until 1898 and of the galleon trade between Manila and Acapulco; for the peoples of the islands it brought tribute, forced labour and Christianity. The Muslim sultanates of Mindanao and Sulu, which Spain fought from 1578, were never fully conquered."
: "La conquête qui fit de l’archipel les Philippines espagnoles, du débarquement de Miguel López de Legazpi en 1565 à l’occupation de la côte nord de Mindanao dans les années 1590. Les îles ne formaient pas un seul État, mais une multitude : des centaines de communautés indépendantes (barangays et leurs fédérations) gouvernées par des datus et des rajahs, parmi lesquelles les villes marchandes de Cebu, de Manille et de Tondo, ces deux dernières étroitement liées au sultanat musulman de Brunei. Envoyé de Nouvelle-Espagne par Philippe II avec quelques centaines de soldats espagnols et mexicains, Legazpi conclut des pactes de sang avec des chefs de Bohol, prit Cebu au rajah Tupas en avril 1565, résista à un blocus portugais en 1568 et s’installa à Panay en 1569. En 1570, son capitaine Martín de Goiti combattit le rajah Sulayman à Manille, et en 1571 Legazpi revint avec des alliés visayans, fit la paix avec les souverains de Manille et de Tondo, vainquit la flotte kapampangan à Bangkusay et fonda la Manille espagnole. Dans les années qui suivirent, Juan de Salcedo et Goiti soumirent à la domination espagnole la plupart des côtes de Luçon, souvent par des accords avec les chefs locaux, parfois par la force. L’attaque du capitaine chinois Limahong contre Manille en 1574 fut repoussée, des colons japonais furent vaincus à Cagayan en 1582 et une conspiration de la noblesse tagalog fut déjouée en 1587–1588, et des missions atteignirent le nord de Mindanao dans les années 1590. Pour l’Espagne, ce fut le début d’un empire en Asie qui dura jusqu’en 1898 et du commerce des galions entre Manille et Acapulco ; pour les peuples des îles, ce fut le tribut, le travail forcé et le christianisme. Les sultanats musulmans de Mindanao et de Sulu, que l’Espagne combattit à partir de 1578, ne furent jamais entièrement conquis."
