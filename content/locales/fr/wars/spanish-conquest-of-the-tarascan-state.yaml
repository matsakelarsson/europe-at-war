# French translations of the catalogue text (wave 14); step bodies follow later.
Spanish conquest of the Tarascan state: Conquête espagnole de l’État tarasque
? The submission of the Purépecha (Tarascan) kingdom of Michoacán to the Spaniards and its end with the execution of its last king. The Purépecha state, ruled from Tzintzuntzan on Lake Pátzcuaro by a king the Spaniards called the cazonci, had by one estimate about a million people (others say up to 1.5 million) and had held off the Aztec Empire for half a century. In 1520 the cazonci Zuangua refused a Mexica request for an alliance against the Spaniards, and he died in the smallpox epidemic that followed. After the fall of Tenochtitlan his son Tangáxuan II (Tzintzicha) sent envoys to Cortés, and in 1522 Cristóbal de Olid marched into Michoacán with Spanish soldiers and many Mexica warriors. Tangáxuan chose not to fight his large army against them, fled for a time and then submitted; Olid occupied Tzintzuntzan for about four months and carried off its treasure in gold and silver, and the Purépecha helped the Spaniards reach the Pacific at Zacatula and conquer Colima in 1523. Tangáxuan was baptised Francisco and went on ruling, so that for some years Michoacán paid tribute both to him and to the Spanish encomenderos. In 1529 Nuño de Guzmán, president of the first Audiencia of Mexico, set out on his conquest of the west, took the cazonci with him and, with the help of a rival noble, Don Pedro Cuinierángari, had him tried for plotting rebellion, hiding treasure and other charges. Tangáxuan was tortured, and on 14 February 1530 he was executed by burning; his ashes were thrown into the Lerma River. Michoacán then came under direct Spanish rule, with Purépecha nobles as governors under Spanish oversight; Vasco de Quiroga, its first bishop, later founded his hospital towns there. Most of what is known of the Purépecha state comes from the Relación de Michoacán, written down about 1540 from the accounts of Purépecha nobles.
: La soumission aux Espagnols du royaume purépecha (tarasque) du Michoacán, puis sa fin avec l’exécution de son dernier roi. L’État purépecha, gouverné depuis Tzintzuntzan, sur le lac de Pátzcuaro, par un roi que les Espagnols appelaient le cazonci, comptait selon une estimation environ un million d’habitants (d’autres avancent jusqu’à 1,5 million) et avait tenu l’Empire aztèque en échec pendant un demi-siècle. En 1520, le cazonci Zuangua refusa une demande d’alliance des Mexicas contre les Espagnols, et il mourut lors de l’épidémie de variole qui suivit. Après la chute de Tenochtitlan, son fils Tangáxuan II (Tzintzicha) envoya des émissaires à Cortés et, en 1522, Cristóbal de Olid entra dans le Michoacán avec des soldats espagnols et de nombreux guerriers mexicas. Tangáxuan choisit de ne pas lancer contre eux sa nombreuse armée, s’enfuit pour un temps, puis se soumit ; Olid occupa Tzintzuntzan pendant environ quatre mois et emporta son trésor d’or et d’argent, et les Purépechas aidèrent les Espagnols à atteindre le Pacifique à Zacatula et à conquérir Colima en 1523. Tangáxuan fut baptisé sous le nom de Francisco et continua de régner, si bien que pendant quelques années le Michoacán paya tribut à la fois au roi et aux encomenderos espagnols. En 1529, Nuño de Guzmán, président de la première Audiencia de Mexico, partit à la conquête de l’Ouest, emmena le cazonci avec lui et, avec l’aide d’un noble rival, don Pedro Cuinierángari, le fit juger pour complot de rébellion, dissimulation de trésor et d’autres chefs d’accusation. Tangáxuan fut torturé et, le 14 février 1530, exécuté sur le bûcher ; ses cendres furent jetées dans le Lerma. Le Michoacán passa alors sous administration espagnole directe, avec des nobles purépechas comme gouverneurs sous contrôle espagnol ; Vasco de Quiroga, son premier évêque, y fonda plus tard ses villages-hôpitaux. L’essentiel de ce que l’on sait de l’État purépecha provient de la Relación de Michoacán, rédigée vers 1540 d’après les récits de nobles purépechas.
