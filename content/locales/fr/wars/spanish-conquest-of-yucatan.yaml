# French translations of the catalogue text (wave 14); step bodies follow later.
Spanish conquest of Yucatán: Conquête espagnole du Yucatán
The twenty-year struggle of Francisco de Montejo, his son and his nephew to conquer the Maya provinces of the Yucatán Peninsula. Northern Yucatán had no single ruler to overthrow, only sixteen or more rival provinces, and two attempts, from the east coast in 1527–1528 and from Campeche in 1531–1535, ended in retreat. In 1540–1542 Montejo the Younger returned with a larger force, founded Campeche and Mérida and, with the help of the Xiu of Maní, brought the western provinces under Spanish rule; the eastern provinces were subdued in 1542–1545 and rose together in the Great Maya Revolt of November 1546, which was put down early in 1547. Many Maya fled south to the Petén, where the Itza held out until 1697.: La lutte de vingt ans menée par Francisco de Montejo, son fils et son neveu pour conquérir les provinces mayas de la péninsule du Yucatán. Le nord du Yucatán n’avait pas de souverain unique à renverser, mais seize provinces rivales ou davantage, et deux tentatives, depuis la côte orientale en 1527–1528 et depuis Campeche en 1531–1535, se terminèrent par un repli. En 1540–1542, Montejo le Jeune revint avec une force plus importante, fonda Campeche et Mérida et, avec l’aide des Xiu de Maní, plaça les provinces occidentales sous la domination espagnole ; les provinces orientales furent soumises en 1542–1545 et se soulevèrent ensemble lors de la grande révolte maya de novembre 1546, qui fut réprimée au début de 1547. De nombreux Mayas s’enfuirent vers le sud, dans le Petén, où les Itzas résistèrent jusqu’en 1697.
