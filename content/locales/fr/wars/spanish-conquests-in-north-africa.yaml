# French translations of the catalogue text (wave 12); step bodies follow later.
Spanish conquests in North Africa: Conquêtes espagnoles en Afrique du Nord
A run of Castilian and Aragonese conquests along the coast of the Maghreb after the fall of Granada, aimed at the ports from which ships raided the Spanish coasts and at carrying the war against Islam into Africa. Melilla was occupied in 1497, Mers el-Kébir taken in 1505, and in May 1509 an army financed and accompanied by Cardinal Cisneros and led by Pedro Navarro stormed Oran. In 1510 Navarro took Bougie, the towns of the central Maghreb from Algiers to Tlemcen accepted Spanish garrisons or paid tribute, and in July he took Tripoli after hard street fighting, killing and enslaving many thousands of its people. Then, at the end of August 1510, an army of about 15,000 that landed on Djerba was routed by its people and the heat, and its commander García Álvarez de Toledo was killed. Spain kept Melilla, Oran, Bougie, Tripoli and the island fort off Algiers, but the advance was over, and the ports of the Maghreb soon turned to the Barbarossa brothers for help.: Une série de conquêtes castillanes et aragonaises le long de la côte du Maghreb après la chute de Grenade, visant les ports d’où partaient les navires qui attaquaient les côtes espagnoles, et destinées à porter en Afrique la guerre contre l’islam. Melilla fut occupée en 1497, Mers el-Kébir prise en 1505 et, en mai 1509, une armée financée et accompagnée par le cardinal Cisneros et menée par Pedro Navarro prit Oran d’assaut. En 1510, Navarro prit Bougie, les villes du Maghreb central, d’Alger à Tlemcen, acceptèrent des garnisons espagnoles ou payèrent tribut, et en juillet il prit Tripoli après de durs combats de rue, tuant et réduisant en esclavage de nombreux milliers de ses habitants. Puis, à la fin d’août 1510, une armée d’environ 15 000 hommes débarquée à Djerba fut mise en déroute par ses habitants et par la chaleur, et son commandant, García Álvarez de Toledo, fut tué. L’Espagne garda Melilla, Oran, Bougie, Tripoli et le fort insulaire face à Alger, mais l’avance avait pris fin, et les ports du Maghreb se tournèrent bientôt vers les frères Barberousse pour obtenir de l’aide.
