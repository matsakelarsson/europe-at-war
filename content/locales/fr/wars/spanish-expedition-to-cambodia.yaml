# French translations of the catalogue text (wave 11); step bodies follow later.
Spanish expedition to Cambodia (Cambodian–Spanish War): Expédition espagnole au Cambodge (guerre hispano-cambodgienne)
? Siamese invasions of Cambodia and the attempt of Spanish and Portuguese adventurers, backed in the end by Spanish Manila, to make Cambodia a client of Spain. After Naresuan had thrown off Burmese rule, Siamese armies attacked Cambodia in 1593, and King Satha I sent the Portuguese Diogo Veloso and the Spaniard Gregorio Vargas to Manila to ask for help. In 1594 the Siamese took and sacked the capital, Longvek; Satha fled to Lan Xang, where he died, and the Siamese carried off thousands of Cambodians, among them Prince Soriyopor. In 1596 an expedition of three ships under Juan Juárez Gallinato left Manila with Spanish and Mexican soldiers and Japanese and Filipino auxiliaries, between about 120 and 400 men by different accounts. At Phnom Penh, Blas Ruiz de Hernán González and Veloso fought the Chinese merchants and stormed the palace of the new king, Reamea Chung Prey (Preah Ram I), who was killed; Gallinato withdrew. Ruiz and Veloso then brought Satha’s son Barom Reachea II back from Lan Xang and put him on the throne in 1597, receiving two provinces. In 1599, when more ships from Manila had been wrecked, Cham and Malay forces under the Laksmana, with Cambodian allies, killed Ruiz, Veloso and almost all the Spaniards and Portuguese at Phnom Penh; the young king was killed soon after. Soriyopor returned from Ayutthaya with Siamese support, and the Spanish plans for Cambodia were given up.
: Les invasions siamoises du Cambodge et la tentative d’aventuriers espagnols et portugais, finalement soutenus par la Manille espagnole, de faire du Cambodge un État client de l’Espagne. Après que Naresuan eut secoué la domination birmane, les armées siamoises attaquèrent le Cambodge en 1593, et le roi Satha Ier envoya le Portugais Diogo Veloso et l’Espagnol Gregorio Vargas demander de l’aide à Manille. En 1594, les Siamois prirent et pillèrent la capitale, Longvek ; Satha s’enfuit au Lan Xang, où il mourut, et les Siamois emmenèrent des milliers de Cambodgiens, parmi lesquels le prince Soriyopor. En 1596, une expédition de trois navires commandée par Juan Juárez Gallinato quitta Manille avec des soldats espagnols et mexicains et des auxiliaires japonais et philippins, entre 120 et 400 hommes environ selon les récits. À Phnom Penh, Blas Ruiz de Hernán González et Veloso combattirent les marchands chinois et prirent d’assaut le palais du nouveau roi, Reamea Chung Prey (Preah Ram Ier), qui fut tué ; Gallinato se retira. Ruiz et Veloso ramenèrent alors du Lan Xang le fils de Satha, Barom Reachea II, et le placèrent sur le trône en 1597, recevant deux provinces. En 1599, alors que d’autres navires venus de Manille avaient fait naufrage, des forces chames et malaises commandées par le Laksmana, avec des alliés cambodgiens, tuèrent Ruiz, Veloso et presque tous les Espagnols et Portugais présents à Phnom Penh ; le jeune roi fut tué peu après. Soriyopor revint d’Ayutthaya avec le soutien du Siam, et les projets espagnols pour le Cambodge furent abandonnés.
