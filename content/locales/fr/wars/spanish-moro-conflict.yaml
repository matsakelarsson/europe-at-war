# French translations of the catalogue text (wave 11); step bodies follow later.
Spanish–Moro conflict: Conflit hispano-moro
? "The three centuries of war between Spain and the Muslim sultanates of Mindanao and the Sulu archipelago, whose peoples the Spanish called Moros. After taking Manila in 1571, the Spanish tried again and again to bring Sulu, Maguindanao and the Maranao of Lake Lanao under their rule and to stop the raids that the sultanates’ fleets made on the Christian towns of the Visayas and Luzon. In the 1630s Governor Sebastián Hurtado de Corcuera built a fort at Zamboanga, defeated Sultan Kudarat of Maguindanao and occupied Jolo, but the Spanish gave up Jolo in 1646 and Zamboanga in 1663. From the rebuilt fort at Zamboanga (1718) they fought a long war of raids and counter-raids, which reached its height in the 1750s and again from the 1770s, when Iranun and Banguingui fleets sailing under the protection of Sulu’s datus raided across Southeast Asia for the slave markets of Jolo; historians estimate that 200,000 to 300,000 people were taken between 1770 and 1870. Steam gunboats turned the balance: the Spanish destroyed the Banguingui strongholds on Balangingi in 1848, took Jolo in 1851 and again in 1876, occupied Cotabato, Davao and Palawan, and reached Lake Lanao in 1895. Spain never fully subdued the sultanates, and handed its claim to the United States in 1898–1899."
: "Les trois siècles de guerre entre l’Espagne et les sultanats musulmans de Mindanao et de l’archipel de Sulu, dont les Espagnols appelaient les peuples Moros. Après la prise de Manille en 1571, les Espagnols tentèrent à maintes reprises de soumettre Sulu, Maguindanao et les Maranao du lac Lanao et de mettre fin aux raids que les flottes des sultanats menaient contre les villes chrétiennes des Visayas et de Luçon. Dans les années 1630, le gouverneur Sebastián Hurtado de Corcuera construisit un fort à Zamboanga, vainquit le sultan Kudarat de Maguindanao et occupa Jolo, mais les Espagnols abandonnèrent Jolo en 1646 et Zamboanga en 1663. Depuis le fort reconstruit de Zamboanga (1718), ils menèrent une longue guerre de raids et de contre-raids, qui atteignit son paroxysme dans les années 1750, puis de nouveau à partir des années 1770, lorsque des flottes iranun et banguingui naviguant sous la protection des datus de Sulu lancèrent des raids dans toute l’Asie du Sud-Est pour alimenter les marchés aux esclaves de Jolo ; les historiens estiment que 200 000 à 300 000 personnes furent enlevées entre 1770 et 1870. Les canonnières à vapeur firent pencher la balance : les Espagnols détruisirent les places fortes banguingui de Balangingi en 1848, prirent Jolo en 1851 puis de nouveau en 1876, occupèrent Cotabato, Davao et Palawan, et atteignirent le lac Lanao en 1895. L’Espagne ne soumit jamais entièrement les sultanats, et céda ses prétentions aux États-Unis en 1898–1899."
