# French translations of the catalogue text (wave 8); step bodies follow later.
Sri Lankan Civil War: Guerre civile du Sri Lanka
The war between the Sri Lankan state and the Liberation Tigers of Tamil Eelam (LTTE), who fought for an independent Tamil state, Tamil Eelam, in the north and east of the island. It grew out of decades of Tamil grievances against Sinhalese-majority governments and began in earnest with an LTTE ambush and the anti-Tamil pogrom of July 1983. India first sheltered the Tamil militants, then sent a peacekeeping force under the Indo-Sri Lanka Accord of 1987, which fought the LTTE until it withdrew in 1990. The LTTE built a de facto state in the Vanni, with its own army, navy and suicide units, and killed Rajiv Gandhi and President Premadasa. A Norwegian-brokered ceasefire in 2002 broke down after 2005, and in 2006–2009 the army took the east and then the north, destroying the LTTE in a final battle on a strip of coast in May 2009, in which very many civilians died. The UN estimated that 80,000 to 100,000 people were killed in the war; the civilian toll of its last months is contested.: La guerre entre l’État sri-lankais et les Tigres de libération de l’Îlam tamoul (LTTE), qui combattaient pour un État tamoul indépendant, l’Îlam tamoul, dans le nord et l’est de l’île. Née de décennies de griefs des Tamouls envers des gouvernements à majorité cingalaise, elle commença véritablement avec une embuscade des LTTE et le pogrom antitamoul de juillet 1983. L’Inde abrita d’abord les militants tamouls puis, en vertu de l’accord indo-sri-lankais de 1987, envoya une force de maintien de la paix, qui combattit les LTTE jusqu’à son retrait en 1990. Les LTTE bâtirent un État de facto dans le Vanni, doté de sa propre armée, de sa propre marine et d’unités suicide, et assassinèrent Rajiv Gandhi et le président Premadasa. Un cessez-le-feu négocié par la Norvège en 2002 s’effondra après 2005 et, en 2006–2009, l’armée prit l’est puis le nord, anéantissant les LTTE lors d’une bataille finale sur une bande côtière en mai 2009, au cours de laquelle de très nombreux civils périrent. L’ONU a estimé que de 80 000 à 100 000 personnes avaient été tuées pendant la guerre ; le bilan civil de ses derniers mois est contesté.
