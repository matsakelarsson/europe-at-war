# French translations of the catalogue text (wave 14); step bodies follow later.
Akwamu insurrection on St John: Insurrection akwamu de Saint John
? "The rising of enslaved Akwamu people on St John (Sankt Jan) in the Danish West Indies, which held most of the island for six months. The Danish West India and Guinea Company had settled St John in 1718, and by 1733 its 109 plantations held 1,087 enslaved Africans and 206 Europeans. Many of the enslaved were Akwamu from the Gold Coast, some of them former nobles and soldiers, sold after their state was overthrown in 1730. In 1733 drought, a hurricane and insect plagues brought hunger, and the colony answered growing flight with a harsh slave code. On 23 November 1733 the Akwamu rose: men carrying wood into the company’s fort at Coral Bay drew hidden cane knives, killed most of the garrison and fired the signal gun, and rebels led by King June (Juni), Kanta, King Claes, Breffu, Prince Akwasi and others took the estates around Coral Bay and much of the north shore, killing many of the colonists, while other planters and some of the enslaved held out at the fortified Durloo plantation, which the rebels nearly took twice, and many escaped by boat to St Thomas. Danish soldiers sent from St Thomas were driven off, and some 60 British troops from Tortola were ambushed as they landed and withdrew. The Danes then appealed to France, and on 23 April 1734 two ships from Martinique landed some 400 French and Swiss troops, who restored the planters’ control by late May; many rebels, Breffu among them, took their own lives rather than be captured. The militia declared the rising over on 25 August 1734, and captured rebels were executed. Many planters moved to St Croix, which Denmark had bought from France in 1733. The rising is remembered in the US Virgin Islands as a fight for freedom."
: "Le soulèvement d’esclaves akwamu à Saint John (Sankt Jan), dans les Indes occidentales danoises, qui tint la plus grande partie de l’île pendant six mois. La Compagnie danoise des Indes occidentales et de Guinée avait colonisé Saint John en 1718, et en 1733 ses 109 plantations comptaient 1 087 Africains réduits en esclavage et 206 Européens. Beaucoup des esclaves étaient des Akwamu de la Côte-de-l’Or, parmi lesquels d’anciens nobles et soldats, vendus après le renversement de leur État en 1730. En 1733, la sécheresse, un ouragan et des invasions d’insectes provoquèrent la famine, et la colonie répondit à la multiplication des fuites par un code des esclaves impitoyable. Le 23 novembre 1733, les Akwamu se soulevèrent : des hommes qui apportaient du bois au fort de la compagnie à Coral Bay sortirent des coutelas à canne qu’ils avaient cachés, tuèrent la plus grande partie de la garnison et firent tonner le canon d’alarme, et des rebelles menés par le roi June (Juni), Kanta, le roi Claes, Breffu, le prince Akwasi et d’autres prirent les domaines autour de Coral Bay et une grande partie de la côte nord, tuant nombre de colons, tandis que d’autres planteurs et une partie des esclaves tenaient bon dans la plantation fortifiée de Durloo, que les rebelles faillirent prendre à deux reprises, et que beaucoup s’enfuyaient en bateau vers Saint-Thomas. Des soldats danois envoyés de Saint-Thomas furent repoussés, et quelque 60 soldats britanniques venus de Tortola tombèrent dans une embuscade à leur débarquement et se retirèrent. Les Danois firent alors appel à la France, et le 23 avril 1734 deux navires venus de la Martinique débarquèrent quelque 400 soldats français et suisses, qui rétablirent l’autorité des planteurs avant la fin mai ; de nombreux rebelles, dont Breffu, se donnèrent la mort plutôt que d’être capturés. La milice déclara le soulèvement terminé le 25 août 1734, et les rebelles capturés furent exécutés. Beaucoup de planteurs s’installèrent à Sainte-Croix, que le Danemark avait achetée à la France en 1733. Le soulèvement est commémoré dans les îles Vierges des États-Unis comme un combat pour la liberté."
Denmark-Norway (the Danish West India and Guinea Company and its planters), with French troops from Martinique: Danemark-Norvège (la Compagnie danoise des Indes occidentales et de Guinée et ses planteurs), avec des troupes françaises venues de la Martinique
