# French translations of the catalogue text (wave 11); step bodies follow later.
Spanish and Dutch in the Moluccas: Espagnols et Néerlandais aux Moluques
? "Half a century of war between Spain and the Dutch East India Company (VOC) over the clove islands of the northern Moluccas, fought alongside the old rivalry of the sultanates of Ternate and Tidore. In 1605 a VOC fleet under Steven van der Hagen took the Portuguese forts on Ambon and Tidore; Portugal then shared its king with Spain, and the governor of the Philippines, Pedro Bravo de Acuña, answered with an expedition from Manila that stormed Ternate on 1 April 1606 and carried Sultan Said and many nobles off to Manila, where Said died in exile. In May 1607 Cornelis Matelief de Jonge and Ternatean leaders who had fled to Halmahera built Fort Oranje at Malayu on the east coast of Ternate, and from then on the island was divided: the Spanish held the old Portuguese town of Gamalama in the south-west and allied with Tidore, while the VOC backed Ternate’s new sultans, who granted it the clove trade. Forts on Ternate, Tidore, Makian, Moti, Bacan and the coasts of Halmahera changed hands in raids and sieges, the Twelve Years’ Truce of 1609 did not stop the fighting in Asia, and Dutch fleets tried repeatedly to cut the Spanish supply route from Manila. The Peace of Münster in 1648 left both sides where they were. In 1662, when Zheng Chenggong (Koxinga), who had just taken Taiwan, demanded tribute from Manila, the governor of the Philippines called in his outlying garrisons to defend the city, and in 1663 the Spanish left Ternate and Tidore; a small post on Siau held out until the VOC took it in 1677. The war left the VOC the dominant power in the northern Moluccas."
: "Un demi-siècle de guerre entre l’Espagne et la Compagnie néerlandaise des Indes orientales (VOC) pour les îles à girofle du nord des Moluques, mêlée à la vieille rivalité des sultanats de Ternate et de Tidore. En 1605, une flotte de la VOC commandée par Steven van der Hagen prit les forts portugais d’Ambon et de Tidore ; le Portugal partageait alors son roi avec l’Espagne, et le gouverneur des Philippines, Pedro Bravo de Acuña, riposta par une expédition partie de Manille qui prit Ternate d’assaut le 1er avril 1606 et emmena à Manille le sultan Said et de nombreux nobles ; Said y mourut en exil. En mai 1607, Cornelis Matelief de Jonge et des chefs de Ternate réfugiés à Halmahera construisirent le fort Oranje à Malayu, sur la côte est de Ternate, et dès lors l’île fut divisée : les Espagnols tenaient l’ancienne ville portugaise de Gamalama, au sud-ouest, et s’allièrent à Tidore, tandis que la VOC soutenait les nouveaux sultans de Ternate, qui lui accordèrent le commerce du girofle. Les forts de Ternate, de Tidore, de Makian, de Moti, de Bacan et des côtes de Halmahera changèrent de mains au gré des raids et des sièges, la trêve de Douze Ans de 1609 n’arrêta pas les combats en Asie, et les flottes néerlandaises tentèrent à plusieurs reprises de couper la route de ravitaillement espagnole depuis Manille. La paix de Münster, en 1648, laissa chaque camp sur ses positions. En 1662, lorsque Zheng Chenggong (Koxinga), qui venait de prendre Taïwan, exigea un tribut de Manille, le gouverneur des Philippines rappela ses garnisons éloignées pour défendre la ville, et en 1663 les Espagnols quittèrent Ternate et Tidore ; un petit poste à Siau tint jusqu’à sa prise par la VOC en 1677. La guerre fit de la VOC la puissance dominante du nord des Moluques."
