# French translations of the catalogue text (wave 12); step bodies follow later.
Sudanese civil war (2023–present): Guerre civile soudanaise (depuis 2023)
? The war between Sudan’s army, the Sudanese Armed Forces (SAF) under General Abdel Fattah al-Burhan, and the paramilitary Rapid Support Forces (RSF) of General Mohamed Hamdan Dagalo, known as Hemedti. The two generals had removed Omar al-Bashir together in 2019 and the civilian-led transitional government in 2021, but fell out over how and when the RSF would be merged into the army. Fighting broke out in Khartoum on 15 April 2023. The RSF took most of the capital, nearly all of Darfur, where its fighters and allied Arab militias massacred the Masalit of El Geneina, and in December 2023 the Gezira. From late 2024 the army, rearmed with drones, retook the Gezira, Sennar and, in March 2025, Khartoum. The RSF and its allies set up a rival government in Nyala, and in October 2025 they took El Fasher, the last army stronghold in Darfur, after an 18-month siege, killing thousands of civilians. The war then centred on Kordofan and Blue Nile and on drone strikes across the country. Both sides have been accused of war crimes; the United States determined in January 2025 that the RSF and allied militias had committed genocide. The war has caused the world’s largest displacement crisis, with some 13–14 million people driven from their homes, and famine; reported deaths number tens of thousands, and estimates of the true toll run far higher.
: La guerre entre l’armée soudanaise, les Forces armées soudanaises (FAS) du général Abdel Fattah al-Burhan, et les Forces de soutien rapide (FSR), paramilitaires, du général Mohamed Hamdan Dagalo, dit Hemedti. Les deux généraux avaient ensemble renversé Omar el-Béchir en 2019, puis le gouvernement de transition dirigé par des civils en 2021, mais ils se sont brouillés sur les modalités et le calendrier de l’intégration des FSR dans l’armée. Les combats ont éclaté à Khartoum le 15 avril 2023. Les FSR se sont emparées de la plus grande partie de la capitale, de la quasi-totalité du Darfour, où leurs combattants et des milices arabes alliées ont massacré les Masalit d’El Geneina, puis, en décembre 2023, de la Gezira. À partir de la fin de 2024, l’armée, réarmée avec des drones, a repris la Gezira, Sennar et, en mars 2025, Khartoum. Les FSR et leurs alliés ont installé un gouvernement rival à Nyala et, en octobre 2025, ont pris El Fasher, dernier bastion de l’armée au Darfour, après un siège de 18 mois, tuant des milliers de civils. La guerre s’est ensuite concentrée sur le Kordofan et le Nil Bleu, ainsi que sur des frappes de drones dans tout le pays. Les deux camps ont été accusés de crimes de guerre ; en janvier 2025, les États-Unis ont conclu que les FSR et les milices alliées avaient commis un génocide. La guerre a provoqué la plus grande crise de déplacement au monde, avec quelque 13–14 millions de personnes chassées de chez elles, ainsi qu’une famine ; les morts recensés se comptent par dizaines de milliers, et les estimations du bilan réel sont bien plus élevées.
