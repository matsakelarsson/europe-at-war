# French translations of the catalogue text (wave 12); step bodies follow later.
Conflict in South Kordofan and Blue Nile: Conflit au Kordofan du Sud et au Nil Bleu
? "The war between the government of Sudan and the SPLM-North, the northern branch of the Sudan People’s Liberation Movement, in the two border states that stayed in Sudan when South Sudan became independent. The Nuba of South Kordofan and peoples of southern Blue Nile had fought on the SPLA’s side in the second civil war, and the peace agreement of 2005 promised them only “popular consultations”. After disputed state elections in South Kordofan in May 2011, which the ruling party’s Ahmed Haroun won against the SPLM’s Abdelaziz al-Hilu, the army moved to disarm the SPLA’s Nuba units; fighting broke out in Kadugli on 5 June 2011, with reports of targeted killings of Nuba civilians. In September 2011 it spread to Blue Nile, where the elected governor and SPLM-North chairman Malik Agar was removed and fled to Kurmuk. The government bombed villages with Antonov aircraft and restricted aid, and hundreds of thousands of people fled to the rebel-held Nuba Mountains around Kauda, to refugee camps such as Yida and Maban in South Sudan, and to Ethiopia. With the Darfur rebels the SPLM-North formed the Sudan Revolutionary Front in November 2011. The war also set Sudan against South Sudan, which Khartoum accused of arming the rebels: on 10 April 2012 South Sudan’s army seized the Heglig oil field, and Sudan retook it about ten days later and bombed the area around Bentiu; the two states signed cooperation agreements in Addis Ababa in September 2012. The SPLM-North split in 2017 between al-Hilu’s faction, which held most of the Nuba Mountains, and Agar’s. Ceasefires held from 2016, and after Bashir’s fall Agar’s faction signed the Juba Peace Agreement of 3 October 2020; al-Hilu’s faction stayed out, and in the civil war of 2023 it took part in the fighting and later allied with the RSF."
: "La guerre entre le gouvernement du Soudan et le SPLM-Nord, branche septentrionale du Mouvement populaire de libération du Soudan, dans les deux États frontaliers restés au Soudan lors de l’indépendance du Soudan du Sud. Les Nouba du Kordofan du Sud et les peuples du sud du Nil Bleu avaient combattu aux côtés de la SPLA pendant la deuxième guerre civile, et l’accord de paix de 2005 ne leur promettait que des « consultations populaires ». Après des élections contestées dans l’État du Kordofan du Sud en mai 2011, remportées par Ahmed Haroun, du parti au pouvoir, face à Abdelaziz al-Hilu, du SPLM, l’armée entreprit de désarmer les unités nouba de la SPLA ; des combats éclatèrent à Kadugli le 5 juin 2011, et des meurtres ciblés de civils nouba furent signalés. En septembre 2011, la guerre s’étendit au Nil Bleu, où le gouverneur élu et président du SPLM-Nord, Malik Agar, fut destitué et s’enfuit à Kurmuk. Le gouvernement bombarda des villages avec des avions Antonov et restreignit l’aide humanitaire, et des centaines de milliers de personnes s’enfuirent vers les monts Nouba tenus par les rebelles autour de Kauda, vers des camps de réfugiés comme ceux de Yida et de Maban au Soudan du Sud, et vers l’Éthiopie. Avec les rebelles du Darfour, le SPLM-Nord forma le Front révolutionnaire soudanais en novembre 2011. La guerre dressa aussi le Soudan contre le Soudan du Sud, que Khartoum accusait d’armer les rebelles : le 10 avril 2012, l’armée sud-soudanaise s’empara du champ pétrolifère de Heglig, que le Soudan reprit une dizaine de jours plus tard, avant de bombarder les environs de Bentiu ; les deux États signèrent des accords de coopération à Addis-Abeba en septembre 2012. Le SPLM-Nord se scinda en 2017 entre la faction d’al-Hilu, qui tenait la plus grande partie des monts Nouba, et celle d’Agar. Des cessez-le-feu furent respectés à partir de 2016 et, après la chute de Béchir, la faction d’Agar signa l’accord de paix de Juba du 3 octobre 2020 ; la faction d’al-Hilu resta à l’écart et, pendant la guerre civile de 2023, prit part aux combats avant de s’allier aux FSR."
