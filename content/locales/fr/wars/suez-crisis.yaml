# Some French text was translated automatically.
"Suez Crisis": "Crise de Suez"
? "An attack on Egypt by Israel, Britain and France after President Gamal Abdel Nasser nationalised the Suez Canal Company in July 1956. Under a secret plan agreed at Sèvres, Israel invaded the Sinai on 29 October; Britain and France, claiming to separate the two sides, bombed Egyptian airfields from 31 October and landed paratroops and marines at Port Said on 5–6 November, while Egypt blocked the canal by sinking ships in it. The United States, which put heavy financial pressure on Britain, and the Soviet Union, which threatened to intervene, both opposed the attack, and Britain and France accepted a UN ceasefire that came into force on the night of 6–7 November. Their troops left by 22 December, replaced by the first UN peacekeeping force, and Israel withdrew from Sinai and Gaza in March 1957. Israel lost 172 dead and Britain and France a few dozen; the Egyptian dead, soldiers and civilians, were never reliably counted but ran into thousands by most estimates. Nasser’s standing rose across the Arab world, and the British prime minister, Anthony Eden, resigned in January 1957."
: "Une attaque contre l’Égypte par Israël, la Grande-Bretagne et la France après que le président Gamal Abdel Nasser eut nationalisé la Compagnie du Canal de Suez en juillet 1956. Dans le cadre d’un plan secret convenu à Sèvres, Israël a envahi le Sinaï le 29 octobre ; la Grande-Bretagne et la France, prétendant séparer les deux parties, ont bombardé des aérodromes égyptiens du 31 octobre et débarqué des parachutes et des marines à Port Said les 5-6 novembre, tandis que l’Égypte a bloqué le canal en y coulant des navires. Les États-Unis, qui ont exercé de fortes pressions financières sur la Grande-Bretagne et l’Union soviétique, qui menaçaient d’intervenir, se sont tous deux opposés à cette attaque, et la Grande-Bretagne et la France ont accepté un cessez-le-feu des Nations unies entré en vigueur dans la nuit du 6 au 7 novembre. Israël a perdu 172 morts et la Grande-Bretagne et la France quelques dizaines ; les morts égyptiens, les soldats et les civils, n’ont jamais été comptés de façon fiable, mais ont couru en milliers selon la plupart des estimations."
"Known in Egypt as the Tripartite Aggression and in Israel as the Sinai War or Operation Kadesh; the Anglo-French landing was Operation Musketeer. The fighting took place outside the map.": "Connu en Égypte comme l’agression tripartite et en Israël comme la guerre du Sinaï ou l’opération Kadesh ; le débarquement anglo-français était l’opération Musketeer. Les combats ont eu lieu en dehors de la carte."
