# French translations of the catalogue text (wave 14); step bodies follow later.
Sugar Intervention: Intervention sucrière
? The American military presence in eastern Cuba from 1917 to 1922. In November 1916 the Conservative president Mario García Menocal was re-elected in an election the Liberals said had been stolen, and on 11 February 1917 the Liberals rose under the former president José Miguel Gómez in the revolt called La Chambelona, after the Liberal campaign song; Alfredo Zayas, Gerardo Machado and Gómez’s son Miguel Mariano Gómez were among its leaders, and Liberal forces took up arms in Las Villas, Camagüey and Oriente. The United States announced that it would not recognise a government that took power by force, and from 12 February, at the request of American sugar planters, American sailors and then marines landed at Guantánamo, Santiago and other ports of Oriente to guard estates, mines and railways. Government troops defeated Gómez’s column near Placetas in Las Villas and captured him with his son and his escort at Caicaje on 8 March 1917. Fighting went on in Camagüey and Oriente into the spring, and by mid-1917 the revolt had been crushed; Menocal later pardoned the prisoners, Gómez after eleven months in prison. After the United States entered the First World War in April 1917, with Cuba declaring war on Germany the next day, the marines stayed, officially to train in a warm climate and to protect the sugar harvest the Allies depended on; the first contingent of under 1,000 arrived in August 1917, and more followed in 1918, among them 1,120 marines who reached Guantánamo in December. After a further disputed election in 1920 President Woodrow Wilson sent General Enoch Crowder, who arrived in January 1921 and for two years advised, and pressed, the Cuban government on its elections and finances. By 15 February 1922 the only American forces left in Cuba were at Guantánamo Bay.
: La présence militaire américaine dans l’est de Cuba de 1917 à 1922. En novembre 1916, le président conservateur Mario García Menocal fut réélu lors d’une élection que les libéraux disaient volée, et le 11 février 1917 les libéraux se soulevèrent sous la conduite de l’ancien président José Miguel Gómez, dans la révolte dite de La Chambelona, du nom de la chanson de campagne libérale ; Alfredo Zayas, Gerardo Machado et le fils de Gómez, Miguel Mariano Gómez, figuraient parmi ses chefs, et des forces libérales prirent les armes à Las Villas, dans le Camagüey et dans l’Oriente. Les États-Unis annoncèrent qu’ils ne reconnaîtraient pas un gouvernement arrivé au pouvoir par la force, et à partir du 12 février, à la demande des planteurs de canne américains, des marins puis des marines américains débarquèrent à Guantánamo, à Santiago et dans d’autres ports de l’Oriente pour protéger les domaines, les mines et les chemins de fer. Les troupes gouvernementales battirent la colonne de Gómez près de Placetas, dans Las Villas, et le capturèrent avec son fils et son escorte à Caicaje le 8 mars 1917. Les combats se poursuivirent dans le Camagüey et l’Oriente jusqu’au printemps, et au milieu de 1917 la révolte avait été écrasée ; Menocal gracia plus tard les prisonniers, Gómez au bout de onze mois de détention. Après l’entrée en guerre des États-Unis dans la Première Guerre mondiale en avril 1917, Cuba déclarant la guerre à l’Allemagne le lendemain, les marines restèrent, officiellement pour s’entraîner sous un climat chaud et protéger la récolte sucrière dont dépendaient les Alliés ; le premier contingent, de moins de 1 000 hommes, arriva en août 1917, et d’autres suivirent en 1918, dont 1 120 marines qui atteignirent Guantánamo en décembre. Après une nouvelle élection contestée en 1920, le président Woodrow Wilson envoya le général Enoch Crowder, qui arriva en janvier 1921 et, pendant deux ans, conseilla le gouvernement cubain, tout en faisant pression sur lui, au sujet de ses élections et de ses finances. Le 15 février 1922, les seules forces américaines encore présentes à Cuba se trouvaient dans la baie de Guantánamo.
