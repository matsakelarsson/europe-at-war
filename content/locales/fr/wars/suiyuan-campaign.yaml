Suiyuan Campaign: Campagne du Suiyuan
? An attempt in late 1936 by Japanese-backed Mongol and Chinese forces to take the province of Suiyuan (today central Inner Mongolia), and its defeat by the provincial army of Fu Zuoyi. After the Japanese conquest of Rehe, the Kwantung Army encouraged the Mongol prince Demchugdongrub (De Wang), who set up a Mongol Military Government in northern Chahar in May 1936. Its Inner Mongolian Army, about 10,000 men, and the Grand Han Righteous Army of Wang Ying, about 6,000, advanced into Suiyuan in the autumn with Japanese advisers, armoured cars and aircraft; the operation was planned by Kwantung Army staff officers, among them Tanaka Ryūkichi. Fu Zuoyi’s 35th Army and allied troops, about 45,000 in all, held the village of Hongort against attacks on 15 and 16 November, counter-attacked on 17 November and then, in a surprise night attack with motor transport, took the Mongol base at Bailingmiao on 24 November. Most of Wang Ying’s army was destroyed or went over to the Chinese side in December. Captured equipment showed Japanese involvement, which the Japanese government denied. The victory was celebrated across China and added to the pressure on Chiang Kai-shek to stop fighting the Communists and resist Japan, which came to a head in the Xi’an Incident of 12 December 1936.
: Une tentative menée à la fin de 1936 par des forces mongoles et chinoises soutenues par le Japon pour s’emparer de la province du Suiyuan (aujourd’hui le centre de la Mongolie-Intérieure), et son échec face à l’armée provinciale de Fu Zuoyi. Après la conquête japonaise du Rehe, l’armée du Kwantung encouragea le prince mongol Demchugdongrub (De Wang), qui établit en mai 1936 un gouvernement militaire mongol dans le nord du Chahar. Son armée de Mongolie-Intérieure, environ 10 000 hommes, et la Grande Armée juste des Han de Wang Ying, environ 6 000, avancèrent dans le Suiyuan à l’automne avec des conseillers, des automitrailleuses et des avions japonais ; l’opération fut planifiée par des officiers d’état-major de l’armée du Kwantung, parmi lesquels Tanaka Ryūkichi. La 35e armée de Fu Zuoyi et les troupes alliées, environ 45 000 hommes en tout, tinrent le village de Hongort face aux attaques des 15 et 16 novembre, contre-attaquèrent le 17 novembre puis, lors d’une attaque de nuit surprise appuyée par des transports motorisés, prirent la base mongole de Bailingmiao le 24 novembre. La plus grande partie de l’armée de Wang Ying fut détruite ou passa du côté chinois en décembre. Le matériel saisi prouva l’implication japonaise, que le gouvernement japonais nia. La victoire fut célébrée dans toute la Chine et accrut la pression sur Tchang Kaï-chek pour qu’il cesse de combattre les communistes et résiste au Japon, pression qui culmina avec l’incident de Xi’an du 12 décembre 1936.
