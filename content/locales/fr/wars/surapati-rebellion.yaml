# French translations of the catalogue text (wave 11); step bodies follow later.
Surapati’s rebellion: Rébellion de Surapati
? The twenty-year resistance to the Dutch East India Company (VOC) of Untung Surapati, a Balinese-born former slave who built his own domain in East Java. Sold as a child in Batavia, Surapati escaped in the late 1670s and led a band of runaway slaves and Balinese in the hills of West Java. In 1683 the Company enlisted him and his men as a Balinese unit in the civil war in Banten, but in January 1684, after a Dutch officer insulted him and threatened to return his men to slavery, they attacked the officer’s camp and went east. Surapati was taken into the service of Amangkurat II of Mataram, whose chief minister led the court party opposed to the Company. When the VOC sent Captain François Tack to Kartasura to take him, Surapati’s men, with the connivance of the court, killed Tack and 74 of his soldiers on 8 February 1686. Surapati then moved to Pasuruan in East Java, where, under the name Tumenggung Wiranegara, he ruled a domain that by the 1690s reached from the eastern salient to Madiun; a Mataram army sent against him in 1690 was defeated. After Amangkurat II’s death in 1703 the Company backed his brother Pangeran Puger (Pakubuwono I) against the new king, Amangkurat III, who joined Surapati after the VOC and Puger took Kartasura in 1705. In 1706 a combined army of the Company, Kartasura and Madura attacked Surapati’s fortifications at Bangil; he was wounded and died on 5 December 1706. His sons and Amangkurat III fought on in the hills until 1708. Surapati was declared a National Hero of Indonesia in 1975.
: Les vingt ans de résistance à la Compagnie néerlandaise des Indes orientales (VOC) d’Untung Surapati, ancien esclave né à Bali, qui se constitua son propre domaine à Java oriental. Vendu enfant à Batavia, Surapati s’échappa à la fin des années 1670 et prit la tête d’une bande d’esclaves fugitifs et de Balinais dans les collines de Java occidental. En 1683, la Compagnie l’enrôla avec ses hommes comme unité balinaise dans la guerre civile de Banten, mais en janvier 1684, après qu’un officier néerlandais l’eut insulté et eut menacé de renvoyer ses hommes en esclavage, ils attaquèrent le camp de l’officier et partirent vers l’est. Surapati entra au service d’Amangkurat II de Mataram, dont le premier ministre dirigeait le parti de la cour hostile à la Compagnie. Lorsque la VOC envoya le capitaine François Tack à Kartasura pour s’emparer de lui, les hommes de Surapati, avec la complicité de la cour, tuèrent Tack et 74 de ses soldats le 8 février 1686. Surapati s’installa ensuite à Pasuruan, à Java oriental, où, sous le nom de Tumenggung Wiranegara, il gouverna un domaine qui, dans les années 1690, s’étendait de l’extrémité orientale de Java jusqu’à Madiun ; une armée de Mataram envoyée contre lui en 1690 fut vaincue. Après la mort d’Amangkurat II en 1703, la Compagnie soutint son frère Pangeran Puger (Pakubuwono Ier) contre le nouveau roi, Amangkurat III, qui rejoignit Surapati après la prise de Kartasura par la VOC et Puger en 1705. En 1706, une armée combinée de la Compagnie, de Kartasura et de Madura attaqua les fortifications de Surapati à Bangil ; il fut blessé et mourut le 5 décembre 1706. Ses fils et Amangkurat III poursuivirent la lutte dans les collines jusqu’en 1708. Surapati a été proclamé héros national de l’Indonésie en 1975.
