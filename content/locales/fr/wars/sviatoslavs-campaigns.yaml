"John I Tzimiskes, who had murdered Nikephoros and taken the throne in December 969, first put down a revolt in Asia Minor. In the spring of 971 he marched north with perhaps 30,000–40,000 men, while a fleet carrying Greek fire sailed for the Danube. The passes through the Balkan Mountains were unguarded. Preslav was stormed on 13 April and Boris II was captured. Sviatoslav, who had some 300 Bulgarian nobles executed for fear of a rising, fell back to Dorostolon on the Danube, where the Byzantines besieged him by land and river.": "John Ier Tzimiskes, qui avait assassiné Nikephoros et pris le trône en décembre 969, a d’abord déposé une révolte en Asie Mineure. Au printemps de 971 il marchait vers le nord avec peut-être 30 000 à 40 000 hommes, tandis qu’une flotte transportant le feu grec naviguait pour le Danube. Sviatoslav, qui a fait exécuter quelque 300 nobles bulgares par crainte d’une montée, est revenu à Dorostolon sur le Danube, où les Byzantins l’assiégeaient par terre et par rivière."
"The siege lasted about three months, with several battles outside the walls. Starving and cut off, the Rus’ came to terms in late July. They gave up Bulgaria and their captives, swore never again to attack Byzantine lands, and were given food for the journey; Leo the Deacon describes Sviatoslav rowing his own boat to meet the emperor. Tzimiskes annexed eastern Bulgaria. The Rus’ wintered hungry at the mouth of the Dnieper. In the spring of 972, as they passed the rapids, the Pecheneg khan Kurya ambushed them and killed Sviatoslav, and the chronicle says he made a drinking cup of his skull.": "Le siège a duré environ trois mois, avec plusieurs batailles à l’extérieur des murs. Meurtant et coupé, le Rus est arrivé à terme à la fin de juillet. Ils ont abandonné la Bulgarie et leurs captifs, juré de ne plus jamais attaquer les terres byzantines, et ont été donné à manger pour le voyage ; Léon le diacre décrit Sviatoslav ramer son propre bateau pour rencontrer l’empereur. Tzimiskes annexés à l’est de la Bulgarie. Au printemps de 972, alors qu’ils passaient les rapides, le Pecheneg khan Kurya les a embusqués et tué Sviatoslav, et la chronique dit qu’il a fait une tasse à boire de son crâne."
