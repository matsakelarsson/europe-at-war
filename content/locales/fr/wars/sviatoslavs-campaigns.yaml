"Sviatoslav, the son of Igor and Olga, took over the government of Kiev from his mother in the early 960s and spent the rest of his life at war. The Primary Chronicle says he travelled like his warriors, without tents or wagons, and warned his enemies with a short message: “I want to come at you.” He first made the Vyatichi on the Oka, who paid tribute to the Khazars, pay it to Kiev instead. Under the year 965 the chronicle says he defeated the Khazars and took their fortress on the Don, Sarkel, which the Rus’ called Belaya Vezha, the White Tower.": "Sviatoslav, fils d’Igor et d’Olga, prit le gouvernement de Kiev de sa mère au début des années 960 et passa le reste de sa vie en guerre. La Chronique Primaire dit qu’il voyageait comme ses guerriers, sans tentes ni chariots, et avertissait ses ennemis avec un court message : « Je veux venir à vous. » Il a d’abord fait le Vyatichi sur l’Oka, qui a rendu hommage aux Khazars, le payer à Kiev à la place. Sous l’année 965, la chronique dit qu’il a vaincu les Khazars et pris leur forteresse sur le Don, Sarkel, que la Russ."
"The Arab geographer Ibn Hawqal wrote that the Rus’ sacked the Khazar capital Atil in the Volga delta, Samandar on the Caspian coast and Bulghar on the middle Volga, around 968–969. Many historians link these raids to Sviatoslav, although the order of events is disputed. The chronicle also tells of victories over the Alans and the Circassians of the north Caucasus. Sviatoslav did not try to rule the Khazar lands, but the khaganate, for two centuries the leading power of the steppe, never recovered, and the Pechenegs and other nomads took its place.": "Le géographe arabe Ibn Hawqal a écrit que le Rusa saccagé la capitale du Khazar Atil dans le delta de la Volga, Samandar sur la côte caspienne et Bulgare sur la Volga centrale, vers 968-969. De nombreux historiens relient ces raids à Sviatoslav, bien que l’ordre des événements soit contesté. La chronique raconte également des victoires sur les Alans et les Circassiens du nord du Caucase. Sviatoslav n’a pas essayé de gouverner les terres de Khazar, mais le khaganate, pendant deux siècles la puissance principale de la steppe, ne s’est jamais rétabli, et les Pechenegs et autres nomades a pris sa place."
