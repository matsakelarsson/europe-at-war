"967/968–970": "967/968–970"
"In 966 the Byzantine emperor Nikephoros II Phokas stopped paying the tribute promised to Bulgaria in 927. Rather than fight in the Bulgarian mountains, he paid Sviatoslav to attack from the north; his envoy, Kalokyros of Cherson, is said to have brought 1,500 pounds of gold. In August 967 or 968 the Rus’ sailed along the Black Sea coast, crossed the Danube, beat a Bulgarian army and overran the Dobruja. Sviatoslav settled at Pereyaslavets in the Danube delta. In 968 the Pechenegs besieged Kiev, and he hurried home to drive them off.": "En 966, l’empereur byzantin Nikephoros II Phokas a cessé de payer l’hommage promis à la Bulgarie en 927. Plutôt que de se battre dans les montagnes bulgares, il a payé Sviatoslav pour attaquer du nord ; son envoyé, Kalokyros de Cherson, aurait apporté 1500 livres d’or. En août 967 ou 968 le Rus a navigué le long de la côte de la mer Noire, traversé le Danube, battu une armée bulgare et envahi la Dobruja. Sviatoslav s’est installé à Pereyaslavets dans le delta du Danube. En 968 les Pechenegs ont assiégé Kiev, et il est rentré à la hâte pour les chasser."
"His mother Olga died in 969. Sviatoslav set his sons over Kiev, the Drevlian land and Novgorod and returned to the Danube, saying, in the chronicle’s words, that Pereyaslavets would be the centre of his lands, where all good things flowed. He stormed the Bulgarian capital, Preslav, and kept Tsar Boris II as a figurehead. In early 970 his army of Rus’, Bulgarians, Pechenegs and Magyars crossed the Balkan Mountains and sacked Philippopolis, where Leo the Deacon says 20,000 people were impaled. Near Arcadiopolis in Thrace the Byzantine general Bardas Skleros drew the Pechenegs into an ambush and routed the invaders.": "Sa mère Olga est morte en 969. Sviatoslav a placé ses fils sur Kiev, la terre de Drevlian et Novgorod et est retourné au Danube, disant, selon la chronique, que Pereyaslavets serait le centre de ses terres, où toutes les bonnes choses ont coulé. Au début de 970 son armée de Rus, Bulgares, Pechenegs et Magyars ont traversé les montagnes des Balkans et renvoyé Philippopolis, où Leo le diacre dit 20 000 personnes ont été empalées. Près d’Arcadiopolis à Thrace le général byzantin Bardas Skleros a attiré les Pechenegs dans une embuscade et a roué les envahisseurs."
