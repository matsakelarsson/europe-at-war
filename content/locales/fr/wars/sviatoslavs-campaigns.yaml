"Sviatoslav’s campaigns": "Campagnes de Sviatoslav"
"The wars of Sviatoslav I of Kiev, who broke the power of the Khazar khaganate on the Don and the Volga, then invaded Bulgaria at Byzantium’s invitation and tried to keep it for himself. Defeated by the Byzantine emperor John I Tzimiskes at Dorostolon in 971, he was killed by the Pechenegs at the Dnieper rapids on his way home.": "Les guerres de Sviatoslav Ier de Kiev, qui ont brisé le pouvoir du khaganate Khazar sur le Don et la Volga, puis envahi la Bulgarie à l’invitation de Byzance et essayé de le garder pour lui-même. Défait par l’empereur byzantin Jean I Tzimiskes à Dorostolon en 971, il a été tué par les Pechenegs au Dniepr rapides sur son chemin de retour."
"The main sources are the Rus’ Primary Chronicle, compiled in Kiev about 1113, and the Byzantine historians Leo the Deacon and John Skylitzes. They often disagree on dates. The Khazar campaign is dated anywhere from 965 to 969, and the first invasion of Bulgaria to 967 or 968.": "Les principales sources sont la Chronique primaire Rus, compilée à Kiev vers 1113, et les historiens byzantins Leo le diacre et John Skylitzes. Ils sont souvent en désaccord sur les dates. La campagne Khazar est datée n’importe où de 965 à 969, et la première invasion de Bulgarie à 967 ou 968."
"Bulgarians, Pechenegs and Magyars fought against the Rus’ at some times and alongside them at others.": "Les Bulgares, les Pechenegs et les Magyars ont parfois combattu contre les Rus."
"Dorostolon is today’s Silistra in Bulgaria, Philippopolis is Plovdiv, and Arcadiopolis is Lüleburgaz in Turkey. Pereyaslavets is thought to have stood near Nufăru in the Danube delta, in Romania.": "Dorostolon est aujourd'hui le Silistra en Bulgarie, Philippopolis est Plovdiv, et Arcadiopolis est Lüleburgaz en Turquie. Pereyaslavets est censé avoir été près de Nufăru dans le delta du Danube, en Roumanie."
