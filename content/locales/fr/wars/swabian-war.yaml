"From the Val Müstair to Calven": "Du Val Müstair au Calven"
"January–May 1499": "janvier–mai 1499"
"The Swiss had refused the reforms of the Diet of Worms in 1495, with its new imperial court and tax, and would not join the Swabian League on their northern border. The spark came in the Grisons, whose Three Leagues had allied with the Confederates in 1497–98. On 20 January 1499 Habsburg troops from Tyrol occupied the Val Müstair, on the route from Tyrol to Milan, and plundered its convent. They were driven out and a truce was made, but troops from Uri, coming to help the Leagues, clashed with Habsburg soldiers on the Rhine, and within weeks the war had spread along the whole frontier.": "Les Suisses avaient refusé les réformes de la Diète des Vers en 1495, avec sa nouvelle cour impériale et ses nouvelles taxes, et ne se joignaient pas à la Ligue souabe sur leur frontière nord. L’étincelle vint dans les Grisons, dont les trois ligues s’étaient alliées aux Confédérés en 1497–1498. Le 20 janvier 1499, les troupes de Habsbourg du Tyrol occupèrent le Val Müstair, sur la route du Tyrol à Milan, et pillèrent son couvent. Elles furent chassées et une trêve fut faite, mais des troupes d’Uri, venant aider les ligues, se heurtèrent aux soldats de Habsbourg sur le Rhin, et en quelques semaines la guerre s’était étendue le long de toute la frontière."
"The Swabian League called up its forces, and Maximilian placed the Confederates under the imperial ban. The war became a series of raids, burnings and plundering expeditions by both sides, broken by battles that the experienced Swiss infantry nearly always won, at Hard on Lake Constance on 20 February, Bruderholz near Basel on 22 March, Schwaderloh near Constance on 11 April and Frastanz near Feldkirch on 20 April. On 22 May the men of the Three Leagues stormed the Habsburg entrenchments at the Calven gorge near Glurns and ravaged the Vinschgau before Maximilian could arrive.": "La Ligue souabe a appelé ses forces, et Maximilian a placé les Confédérés sous l’interdiction impériale. La guerre est devenue une série de raids, d’incendies et de pillages par les deux parties, brisés par des batailles que l’infanterie suisse expérimentée a presque toujours remportées, à Hard sur le lac de Constance le 20 février, Bruderholz près de Bâle le 22 mars, Schwaderloh près de Constance le 11 avril et Frastanz près de Feldkirch le 20 avril. Le 22 mai, les hommes des trois ligues ont pris d’assaut les enclos Habsburg à la gorge du Calven près de Glorns et ravagé le Vinschgau avant que Maximilian ne puisse arriver."
