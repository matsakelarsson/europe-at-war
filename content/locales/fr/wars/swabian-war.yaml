"July–September 1499": "juillet–septembre 1499"
"Maximilian came to Lake Constance to take command, but the Swabian League refused to send its troops to the Grisons, and for weeks little happened. By July his unpaid mercenaries and the League’s peasant soldiers, eager to bring in the harvest, were close to leaving. On 21 July a Swabian force crossed the lake and burned Rheineck and Rorschach. The next day an army of about 16,000 under Count Heinrich von Fürstenberg, besieging the castle of Dorneck above Dornach near Basel, was attacked by a hurriedly gathered Confederate army. Fürstenberg was killed early on, and after a long, hard fight the Swabians fled, leaving about 3,000 dead and all their guns.": "Maximilian vint au lac de Constance pour prendre le commandement, mais la Ligue souabe refusa d’envoyer ses troupes aux Grisons, et pendant des semaines peu se produisit. En juillet ses mercenaires non rémunérés et les soldats paysans de la Ligue, désireux d’apporter la récolte, étaient près de partir. Le 21 juillet, une force souabe traversa le lac et brûla Rheineck et Rorschach. Le lendemain, une armée d’environ 16 000 hommes sous le comte Heinrich von Fürstenberg, assiégeant le château de Dorneck au-dessus de Dornach près de Bâle, fut attaquée par une armée confédérée rassemblée à la hâte."
"Neither side wanted to go on, and the Duke of Milan, who needed both Swiss soldiers and Maximilian’s help against France, mediated. The Peace of Basel, signed on 22 September 1499, treated the war as one between the Confederates and the Habsburgs rather than the Empire. The imperial ban was quietly dropped, and the Confederates stayed outside the new imperial court and taxes. No land changed hands, but the Confederates took over the high court of the Thurgau from the city of Constance. Formally the Swiss stayed in the Empire until 1648; in practice they had left it.": "Ni l’un ni l’autre ne voulait continuer, et le duc de Milan, qui avait besoin à la fois de soldats suisses et de Maximiliens contre la France, soutint la médiation. La paix de Bâle, signée le 22 septembre 1499, traita la guerre entre les Confédérés et les Habsbourg plutôt que l’Empire. L’interdiction impériale fut discrètement abandonnée, et les Confédérés restèrent en dehors de la nouvelle cour impériale et des taxes. Aucun pays n’a changé de mains, mais les Confédérés ont pris la haute cour de Thurgau de la ville de Constance. Formellement les Suisses sont restés dans l’Empire jusqu’en 1648 ; en pratique ils l’avaient quittée."
