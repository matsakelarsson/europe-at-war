"Swabian War": "Guerre des Souabes"
"The last great war between the Swiss Confederacy and the Habsburgs, fought from the Grisons to Basel against King Maximilian I and the Swabian League. The Swiss and their allies of the Three Leagues won almost every battle, ending at Dornach, and the Peace of Basel freed them from the imperial reforms of 1495, so that in practice they stood outside the Empire.": "La dernière grande guerre entre la Confédération suisse et les Habsbourg, a combattu des Grisons à Bâle contre le roi Maximilien Ier et la Ligue souabe. Les Suisses et leurs alliés des trois ligues ont remporté presque toutes les batailles, se terminant à Dornach, et la Paix de Bâle les a libérés des réformes impériales de 1495, de sorte qu’en pratique ils se tenaient en dehors de l’Empire."
"Dates are Julian, as usual for the period. The war is called the Schwabenkrieg (Swabian War) in Switzerland and the Schweizerkrieg (Swiss War) in Germany; in Austria it was also called the Engadine War.": "Les dates sont Julian, comme d’habitude pour l’époque. La guerre est appelée la Schwabenkrieg (guerre swabienne) en Suisse et la Schweizerkrieg (guerre suisse) en Allemagne ; en Autriche elle a également été appelée la guerre engadine."
"The Swabian League, founded in 1488, joined the Swabian imperial cities and knights with the Habsburg lands and the Count of Württemberg. Maximilian I had been king of the Romans since 1486 and ruled all the Habsburg lands from 1493.": "La Ligue souabe, fondée en 1488, rejoint les villes impériales et les chevaliers swabiens avec les terres des Habsbourg et le comte de Wurtemberg. Maximilian I était roi des Romains depuis 1486 et gouvernait toutes les terres des Habsbourg à partir de 1493."
