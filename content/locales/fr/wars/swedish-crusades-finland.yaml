"Medieval Sweden pushed east across the Baltic. Later chronicles tell of a first crusade to south-western Finland in the 1150s under King Eric and Bishop Henry, though historians doubt how much of the story is true. Raids went both ways: in 1164 Swedes attacked Ladoga, and in 1187 raiders from the eastern Baltic sacked Sigtuna.": "Des chroniques plus tard racontent une première croisade au sud-ouest de la Finlande dans les années 1150 sous le roi Eric et l’évêque Henry, bien que les historiens doutent à quel point l’histoire est vraie. Raids vont dans les deux sens : en 1164 Suédois attaque Ladoga, et en 1187 les raideurs de l’est de la Baltique ont saccagé Sigtuna."
"In July 1240 a Swedish force that sailed up the Neva was beaten by Prince Alexander of Novgorod, who earned the name Nevsky for it. Sweden turned instead to Tavastia in inner Finland. Around 1249–1250 Birger Jarl led an expedition there, defeated the Tavastians and began building a castle, bringing the region under Swedish rule.": "En juillet 1240, une force suédoise qui naviguait sur la Neva fut battue par le prince Alexandre de Novgorod, qui lui valut le nom de Nevsky. La Suède se tourna plutôt vers Tavastia en Finlande intérieure. Vers 1249-1250 Birger Jarl y menait une expédition, battait les Tavastiens et commençait à construire un château, ramenant la région sous domination suédoise."
