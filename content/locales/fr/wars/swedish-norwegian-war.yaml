"Norway declared independence, adopted a constitution at Eidsvoll on 17 May 1814 and chose the Danish prince Christian Frederick as king. At the end of July Charles John invaded with a much larger army, taking the Hvaler islands and the fortress town of Fredrikstad.": "La Norvège déclare l’indépendance, adopte une constitution à Eidsvoll le 17 mai 1814 et choisit le prince danois Christian Frederick comme roi. À la fin de juillet Charles John envahit avec une armée beaucoup plus grande, prenant les îles Hvaler et la ville forteresse de Fredrikstad."
"On the Kongsvinger front the Norwegians stopped the Swedes at Lier on 2 August and Matrand on 5 August, but on 14 August the Swedes forced the Kjølberg bridge and the road to Christiania lay open. That same day the Convention of Moss ended the fighting. Charles John accepted Norway’s constitution, and on 4 November 1814 the Storting elected Charles XIII king of Norway, joining the two kingdoms in a union. Sweden has not fought a war since.": "Sur le front de Kongsvinger, les Norvégiens arrêtèrent les Suédois à Lier le 2 août et Matrand le 5 août, mais le 14 août, les Suédois forcèrent le pont de Kjølberg et la route vers Christiania s’ouvrit. Charles John accepta la constitution de la Norvège et, le 4 novembre 1814, le Storting élut Charles XIII roi de Norvège, rejoignant les deux royaumes dans une union."
