"Swedish–Norwegian War": "Guerre suédoise-norvégienne"
"A short war in which Sweden forced Norway, which had declared independence and adopted its own constitution after the Treaty of Kiel, into a union under the Swedish king. The Convention of Moss ended the fighting after two weeks, and Norway kept its constitution and parliament.": "Une courte guerre dans laquelle la Suède a forcé la Norvège, qui avait déclaré l’indépendance et adopté sa propre constitution après le traité de Kiel, à une union sous le roi suédois. La Convention de Moss a mis fin aux combats après deux semaines, et la Norvège a gardé sa constitution et son parlement."
