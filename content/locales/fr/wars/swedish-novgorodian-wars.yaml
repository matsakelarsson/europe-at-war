"In 1293 a Swedish army under the marshal Torgils Knutsson won part of western Karelia and built Viborg Castle on the site of a destroyed Karelian fort. In 1300 the Swedes went further, building a fortress called Landskrona where the Okhta meets the Neva, but Novgorod soon destroyed it.": "En 1293 une armée suédoise sous le maréchal Torgils Knutsson a gagné une partie de l’ouest Karelia et construit Viborg Château sur le site d’un fort karélien détruit. En 1300 les Suédois sont allés plus loin, construire une forteresse appelée Landskrona où l’Okhta rencontre la Neva, mais Novgorod bientôt détruit."
"Novgorod hit back hard. In 1318 its forces burned Turku and its cathedral, and a few years later they besieged Viborg and built the fortress of Oreshek, Nöteborg in Swedish, where the Neva leaves Lake Ladoga. There, on 12 August 1323, the two sides agreed on their first border, dividing Karelia between them. How far north the line ran is still debated.": "En 1318 ses forces brûlèrent Turku et sa cathédrale, et quelques années plus tard ils assiégèrent Viborg et construisirent la forteresse d’Oreshek, Nöteborg en suédois, où la Neva quitte le lac Ladoga. Là, le 12 août 1323, les deux parties s’entendirent sur leur première frontière, divisant Karelia entre elles."
