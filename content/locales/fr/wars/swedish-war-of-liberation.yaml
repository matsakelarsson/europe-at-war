"Gustav Eriksson Vasa escaped to Dalarna, and in January 1521 the people of northern Dalarna made him their commander. His peasant army took Västerås on 29 April 1521, the Sture party joined him, and later that year he became regent. In 1522 the Hanseatic city of Lübeck joined the war against Denmark with ships and money.": "Gustav Eriksson Vasa s’enfuit à Dalarna et, en janvier 1521, les habitants du nord de Dalarna firent de lui leur commandant. Son armée paysanne prit Västerås le 29 avril 1521, le parti Sture le rejoignit, et plus tard cette année-là il devint régent. En 1522 la ville hanséatique de Lübeck se joignit à la guerre contre le Danemark avec des navires et de l’argent."
"Kalmar fell on 27 May 1523. On 6 June, now Sweden’s national day, Gustav was elected king at Strängnäs, and Stockholm surrendered on 17 June after a siege of about two years. By September Finland too was in his hands. The Kalmar Union was over.": "Kalmar tomba le 27 mai 1523. Le 6 juin, jour national de la Suède, Gustav fut élu roi à Strängnäs, et Stockholm se rendit le 17 juin après un siège d’environ deux ans. En septembre la Finlande aussi était entre ses mains."
