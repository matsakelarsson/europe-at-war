# Some French text was translated automatically.
"Swiss Peasant War": "Guerre suisse des paysans"
? "A rising of the rural subjects of Lucerne, Bern, Solothurn and Basel against their city governments, set off when the end of the Thirty Years’ War brought falling grain prices and Bern, Fribourg and Solothurn devalued their coins in December 1652. It began in February 1653 in the Entlebuch valley of Lucerne and spread to the Emmental and beyond, and on 14 May peasants from all four territories swore a league at Huttwil under Niklaus Leuenberger of Bern, demanding the right to hold their own assemblies. Peasant armies blockaded Bern and Lucerne, and Bern made terms at Murifeld on 28 May, but the Confederation’s army under Konrad Werdmüller beat the rebels at Wohlenschwil on 3 June and Bernese troops crushed them at Herzogenbuchsee on 8 June. Bern then repudiated its treaty. Leaders were executed, including Christian Schybi of the Entlebuch and Leuenberger, beheaded in Bern on 6 September, and many others were sent to the galleys or banished."
: "Une montée des sujets ruraux de Lucerne, Berne, Soleure et Bâle contre leurs gouvernements municipaux, partit lorsque la fin de la guerre de Trente Ans fit chuter les prix des céréales et Bern, Fribourg et Soleure dévalorisèrent leurs pièces en décembre 1652. Elle a commencé en février 1653 dans la vallée d’Entlebuch de Lucerne et s’est étendue à l’Emmental et au-delà, et le 14 mai les paysans des quatre territoires ont juré une ligue à Huttwil sous Niklaus Leuenberger de Berne, exigeant le droit de tenir leurs propres assemblées. Les armées paysannes ont bloqué Berne et Lucerne, et Bern a pris des conditions à Murifeld le 28 mai, mais l’armée de la Confédération sous Konrad Werdmüller a battu les rebelles à Wohlenschwil le 3 juin et les troupes bernoises les ont écrasés à Herzogenbuchsee le 8 juin. Bern a ensuite répudié son traité. Des dirigeants furent exécutés, dont Christian Schybi de l’Entlebuch et Leuenberger, décapités à Berne le 6 septembre, et beaucoup d’autres furent envoyés aux galères ou bannis."
"Bern and the other Protestant cantons used the Julian calendar until 1701, ten days behind the Gregorian calendar of the Catholic cantons such as Lucerne; dates here are as usually given.": "Bern et les autres cantons protestants ont utilisé le calendrier julien jusqu’en 1701, dix jours derrière le calendrier grégorien des cantons catholiques tels que Lucerne ; les dates sont comme d’habitude données."
"Some sources date the treaty of Murifeld to 28 May and others to 29 May.": "Certaines sources datent le traité de Murifeld au 28 mai et d’autres au 29 mai."
