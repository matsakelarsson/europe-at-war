# French translations of the catalogue text (wave 9); step bodies follow later.
Syrym Datov’s rebellion: Rébellion de Syrym Datov
? A rising of the Kazakhs of the Junior Zhuz (Little Horde), in the steppe east of the lower Ural river, against the Russian frontier administration, the Ural Cossacks and their own khans. After Pugachev’s rebellion the government let the Kazakhs graze between the Volga and the Ural only for payment, the Cossacks demanded hostages and barred them from crossing the river, and Cossack raids and the exactions of Khan Nurali and his sultans weighed on the herders. In 1783 Syrym Datov (Syrym Datuly), an elder of the Baiuly clans who had probably fought with Pugachev, led raids on the Cossack outposts and forts of the Ural line, which brought punitive expeditions in return. Captured by the Cossacks in 1783 and ransomed in 1784, he helped drive Nurali out in 1786; the khan fled to the Russians and was sent to Ufa. The governor-general in Ufa, Osip (Iosif) Igelström, then tried a reform that set aside the khan’s power in favour of a council of elders and frontier courts, with Syrym at its head, but in 1789–1791 St Petersburg chose to restore the khanate, and the election of Nurali’s brother Yeraly as khan renewed the fighting. Raids on the line and on caravans cut off trade with Central Asia; in 1797 the rebels killed Yeraly’s successor, Khan Yesim. Talks with the elders and sultans then brought most of the clans to terms, and Syrym moved south to the Khanate of Khiva with his followers. He died there in 1802.
: Un soulèvement des Kazakhs du Petit Jüz (Petite Horde), dans la steppe à l’est du cours inférieur du fleuve Oural, contre l’administration frontalière russe, les Cosaques de l’Oural et leurs propres khans. Après la rébellion de Pougatchev, le gouvernement ne permit plus aux Kazakhs de faire paître leurs troupeaux entre la Volga et l’Oural que contre paiement, les Cosaques exigèrent des otages et leur interdirent de franchir le fleuve, et les raids cosaques ainsi que les exactions du khan Nurali et de ses sultans pesaient sur les éleveurs. En 1783, Syrym Datov (Syrym Datuly), un ancien des clans baiuly qui avait probablement combattu aux côtés de Pougatchev, mena des raids contre les avant-postes et les forts cosaques de la ligne de l’Oural, qui attirèrent en retour des expéditions punitives. Capturé par les Cosaques en 1783 et racheté en 1784, il contribua à chasser Nurali en 1786 ; le khan s’enfuit chez les Russes et fut envoyé à Oufa. Le gouverneur général à Oufa, Ossip (Iossif) Igelström, tenta alors une réforme qui écartait le pouvoir du khan au profit d’un conseil des anciens et de tribunaux frontaliers, avec Syrym à sa tête, mais en 1789–1791 Saint-Pétersbourg choisit de rétablir le khanat, et l’élection du frère de Nurali, Yeraly, comme khan raviva les combats. Les raids contre la ligne et contre les caravanes coupèrent le commerce avec l’Asie centrale ; en 1797, les rebelles tuèrent le successeur de Yeraly, le khan Yesim. Des pourparlers avec les anciens et les sultans amenèrent ensuite la plupart des clans à composer, et Syrym partit vers le sud, au khanat de Khiva, avec ses partisans. Il y mourut en 1802.
