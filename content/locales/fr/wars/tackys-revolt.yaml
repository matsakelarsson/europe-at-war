# French translations of the catalogue text (wave 14); step bodies follow later.
Tacky’s Revolt: Révolte de Tacky
? The war of liberation fought by enslaved Coromantee (Akan) people in Jamaica in 1760–1761, the largest rising in the British Caribbean in the eighteenth century. Its leaders had been soldiers and nobles on the Gold Coast, and they planned to overthrow British rule and make the island a free African state. On Easter Monday, 7 April 1760, Tacky, a Fante royal enslaved in St Mary, led a rising on the estates near Port Maria; his men seized arms from Fort Haldane, but the militia and Maroons from the eastern Maroon towns, bound by the treaties of 1739, hunted them down, and Tacky was shot dead within days. On 25 May a larger, better-planned rising broke out in Westmoreland under Apongo, called Wager by the British, said to have been a prince and war leader on the Gold Coast; his fighters fortified a camp in the hills and beat off the militia before regular troops, sailors and Leeward Maroons stormed it in early June. Apongo was captured in July and executed, but bands under his lieutenant Simon fought on from the Cockpit Country into 1761, and plots were uncovered across the island, including in Kingston, where Coromantee people had crowned a ‘Queen’, Cubah. Over 60 whites and a similar number of free people of colour were killed; some 400 rebels died in battle or by execution by the usual count (the militia claimed more), and more than 500 were transported and sold abroad. The historian Trevor Burnard judged that in its shock to the British Empire only the American Revolution surpassed it in that century.
: La guerre de libération menée par des Coromantins (Akans) réduits en esclavage en Jamaïque en 1760–1761, le plus grand soulèvement des Caraïbes britanniques au XVIIIe siècle. Ses chefs avaient été soldats et nobles sur la Côte-de-l’Or, et ils projetaient de renverser la domination britannique et de faire de l’île un État africain libre. Le lundi de Pâques, 7 avril 1760, Tacky, un membre de la famille royale fanti réduit en esclavage dans la paroisse de St Mary, mena un soulèvement sur les domaines proches de Port Maria ; ses hommes s’emparèrent d’armes au fort Haldane, mais la milice et des Marrons des villes marronnes de l’est, liés par les traités de 1739, les traquèrent, et Tacky fut abattu en quelques jours. Le 25 mai, un soulèvement plus vaste et mieux préparé éclata dans le Westmoreland sous la conduite d’Apongo, que les Britanniques appelaient Wager et qui aurait été prince et chef de guerre sur la Côte-de-l’Or ; ses combattants fortifièrent un camp dans les collines et repoussèrent la milice, avant que des troupes régulières, des marins et des Marrons sous le Vent ne le prennent d’assaut au début de juin. Apongo fut capturé en juillet et exécuté, mais des bandes conduites par son lieutenant Simon poursuivirent le combat depuis le Cockpit Country jusqu’en 1761, et des complots furent découverts dans toute l’île, notamment à Kingston, où des Coromantins avaient couronné une « reine », Cubah. Plus de 60 Blancs et un nombre comparable de libres de couleur furent tués ; quelque 400 rebelles moururent au combat ou furent exécutés selon le décompte habituel (la milice en revendiqua davantage), et plus de 500 furent déportés et vendus à l’étranger. L’historien Trevor Burnard a estimé que, par le choc qu’elle causa à l’Empire britannique, seule la Révolution américaine la surpassa au cours de ce siècle.
