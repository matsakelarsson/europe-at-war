# French translations of the catalogue text (wave 9); step bodies follow later.
Taiping Rebellion: Révolte des Taiping
A civil war between the Qing dynasty and the Taiping Heavenly Kingdom, a state founded by Hong Xiuquan, a Hakka from Guangdong who believed he was the younger brother of Jesus. His God Worshipping Society rose at Jintian in Guangxi in January 1851, marched north through Hunan to the Yangtze and took Nanjing in March 1853, making it the Heavenly Capital (Tianjing). A Taiping army came close to Tianjin in 1853, and at its height the kingdom ruled much of the Yangtze valley. A bloody purge of its leaders in 1856 weakened it; it recovered under Li Xiucheng and Chen Yucheng and took Suzhou and Hangzhou in 1860–1861, but the provincial armies of Zeng Guofan, Li Hongzhang and Zuo Zongtang, helped from 1862 by British and French forces and Western-officered units around Shanghai, wore it down. Nanjing fell on 19 July 1864. It was the deadliest civil war of the 19th century; most estimates of the dead range from 20 to 30 million, and some are far higher.: Une guerre civile entre la dynastie Qing et le Royaume céleste des Taiping, un État fondé par Hong Xiuquan, un Hakka du Guangdong qui se croyait le frère cadet de Jésus. Sa Société des adorateurs de Dieu se souleva à Jintian, au Guangxi, en janvier 1851, marcha vers le nord à travers le Hunan jusqu’au Yangzi et prit Nankin en mars 1853, dont elle fit la Capitale céleste (Tianjing). Une armée taiping s’approcha de Tianjin en 1853 et, à son apogée, le royaume gouvernait une grande partie de la vallée du Yangzi. Une purge sanglante de ses dirigeants en 1856 l’affaiblit ; il se redressa sous Li Xiucheng et Chen Yucheng et prit Suzhou et Hangzhou en 1860–1861, mais les armées provinciales de Zeng Guofan, Li Hongzhang et Zuo Zongtang, aidées à partir de 1862 par des forces britanniques et françaises et par des unités encadrées par des officiers occidentaux autour de Shanghai, finirent par l’user. Nankin tomba le 19 juillet 1864. Ce fut la guerre civile la plus meurtrière du XIXe siècle ; la plupart des estimations du nombre de morts vont de 20 à 30 millions, et certaines sont bien plus élevées.
