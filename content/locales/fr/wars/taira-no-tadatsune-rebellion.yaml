# French translations of the catalogue text (wave 10); step bodies follow later.
Taira no Tadatsune’s rebellion: Rébellion de Taira no Tadatsune
? The rising of Taira no Tadatsune, a great landholder of the Bōsō peninsula east of today’s Tokyo, against the provincial governors of Kazusa, Shimōsa and Awa. In the sixth month of 1028 Tadatsune burned the governor of Awa to death and occupied the provincial headquarters of Kazusa, and much of the local gentry joined him. The court’s commander, Taira no Naokata, whose branch of the clan was an old rival of Tadatsune’s, campaigned for two years without result, while Tadatsune drove the next governor out of Awa in 1030 and held out in a stronghold at Ishimi in Isumi district. The fighting and requisitions ruined the three provinces; the governor of Shimōsa was said to be starving. In 1030 the court replaced Naokata with Minamoto no Yorinobu, governor of Kai, whom Tadatsune had once served. In the spring of 1031, before Yorinobu had even marched, Tadatsune shaved his head as a monk and surrendered with his sons. He died of illness at Nogami in Mino on the way to the capital, in the sixth month. His sons were pardoned and founded the Chiba and Kazusa clans, and the affair made the Kawachi branch of the Minamoto the leading warrior house of eastern Japan.
: Le soulèvement de Taira no Tadatsune, grand propriétaire terrien de la péninsule de Bōsō, à l’est de l’actuelle Tokyo, contre les gouverneurs des provinces de Kazusa, de Shimōsa et d’Awa. Au sixième mois de 1028, Tadatsune brûla vif le gouverneur d’Awa et occupa le siège du gouvernement provincial de Kazusa, et une grande partie de la petite noblesse locale se joignit à lui. Le commandant envoyé par la cour, Taira no Naokata, dont la branche du clan était une vieille rivale de celle de Tadatsune, fit campagne pendant deux ans sans résultat, tandis que Tadatsune chassait d’Awa le gouverneur suivant en 1030 et tenait bon dans une place forte à Ishimi, dans le district d’Isumi. Les combats et les réquisitions ruinèrent les trois provinces ; on disait que le gouverneur de Shimōsa mourait de faim. En 1030, la cour remplaça Naokata par Minamoto no Yorinobu, gouverneur de Kai, que Tadatsune avait autrefois servi. Au printemps 1031, avant même que Yorinobu se soit mis en marche, Tadatsune se rasa la tête, se fit moine et se rendit avec ses fils. Il mourut de maladie à Nogami, dans le Mino, en route vers la capitale, au sixième mois. Ses fils furent graciés et fondèrent les clans Chiba et Kazusa, et l’affaire fit de la branche Kawachi des Minamoto la principale maison guerrière de l’est du Japon.
