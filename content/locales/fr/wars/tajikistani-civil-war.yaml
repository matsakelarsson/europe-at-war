# French translations of the catalogue text (wave 7); step bodies follow later.
Tajikistani Civil War: Guerre civile du Tadjikistan
? The civil war that followed Tajikistan’s independence from the Soviet Union. It was fought between the old communist establishment, drawn mainly from the northern Leninabad (Khujand) region and the southern Kulob region, and an opposition of Islamists, democrats and Pamiri nationalists, drawn largely from the Gharm valley and Gorno-Badakhshan. After a coalition government formed in May 1992 collapsed, the pro-government Popular Front, backed by Russia and Uzbekistan, took the capital Dushanbe in December 1992, and its militias killed and expelled thousands of people from opposition regions in the south. The opposition, united from 1993 as the United Tajik Opposition (UTO), fought on from bases in Afghanistan and the eastern mountains, attacking Russian border posts on the Panj river. UN-sponsored talks from 1994 led to the General Agreement on the Establishment of Peace and National Accord, signed in Moscow on 27 June 1997 by President Emomali Rahmon and the UTO leader Sayid Abdullo Nuri, which gave the opposition 30 per cent of government posts.
: La guerre civile qui suivit l’indépendance du Tadjikistan vis-à-vis de l’Union soviétique. Elle opposa l’ancien appareil communiste, issu principalement de la région de Leninabad (Khodjent), au nord, et de celle de Kulob, au sud, à une opposition d’islamistes, de démocrates et de nationalistes pamiris, issue en grande partie de la vallée de Gharm et du Haut-Badakhchan. Après l’effondrement d’un gouvernement de coalition formé en mai 1992, le Front populaire progouvernemental, soutenu par la Russie et l’Ouzbékistan, prit la capitale, Douchanbé, en décembre 1992, et ses milices tuèrent et expulsèrent des milliers d’habitants des régions d’opposition du sud. L’opposition, unie à partir de 1993 au sein de l’Opposition tadjike unie (OTU), poursuivit la lutte depuis des bases en Afghanistan et dans les montagnes de l’est, attaquant les postes-frontières russes sur le Piandj. Les pourparlers parrainés par l’ONU à partir de 1994 aboutirent à l’Accord général sur l’instauration de la paix et de l’entente nationale, signé à Moscou le 27 juin 1997 par le président Emomali Rahmon et le chef de l’OTU, Sayid Abdullo Nuri, qui accordait à l’opposition 30 % des postes gouvernementaux.
