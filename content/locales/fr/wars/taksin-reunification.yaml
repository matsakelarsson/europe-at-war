# French translations of the catalogue text (wave 11); step bodies follow later.
Taksin’s reunification of Siam: Réunification du Siam par Taksin
? "The wars in which Phraya Tak, the later King Taksin, rebuilt the Siamese kingdom after the Burmese destroyed Ayutthaya in April 1767. A provincial governor of Teochew Chinese descent who had broken out of the siege in January 1767, he took Chanthaburi on the east coast on 15 June 1767, sailed up the Chao Phraya with about 5,000 men in October, took Thonburi on 6 November and destroyed the Burmese garrison at Phosamton, and was crowned king at Thonburi on 28 December 1767. Four rival regimes had divided the rest of the country: the governor of Phitsanulok and the monk Chao Phra Fang at Sawangkhaburi in the north, Prince Thepphiphit at Phimai on the Khorat plateau, and the acting governor of Nakhon Si Thammarat in the south. Taksin beat back a Burmese force at Bang Kung in 1768, was defeated and wounded at Koeichai by the Phitsanulok forces, but took Phimai in 1768 and Nakhon Si Thammarat in 1769. Chao Phra Fang, who had absorbed Phitsanulok, was overthrown in 1770. With Siam united again, Taksin turned to Lan Na, Cambodia and the Lao kingdoms."
: "Les guerres par lesquelles Phraya Tak, le futur roi Taksin, reconstruisit le royaume siamois après la destruction d’Ayutthaya par les Birmans en avril 1767. Gouverneur de province d’ascendance chinoise teochew, qui avait forcé les lignes du siège en janvier 1767, il prit Chanthaburi, sur la côte est, le 15 juin 1767, remonta la Chao Phraya avec environ 5 000 hommes en octobre, prit Thonburi le 6 novembre et détruisit la garnison birmane de Phosamton, puis fut couronné roi à Thonburi le 28 décembre 1767. Quatre régimes rivaux s’étaient partagé le reste du pays : le gouverneur de Phitsanulok et le moine Chao Phra Fang, à Sawangkhaburi, au nord, le prince Thepphiphit à Phimai, sur le plateau de Khorat, et le gouverneur par intérim de Nakhon Si Thammarat au sud. Taksin repoussa une force birmane à Bang Kung en 1768, fut battu et blessé à Koeichai par les forces de Phitsanulok, mais prit Phimai en 1768 et Nakhon Si Thammarat en 1769. Chao Phra Fang, qui avait absorbé Phitsanulok, fut renversé en 1770. Le Siam de nouveau uni, Taksin se tourna vers le Lan Na, le Cambodge et les royaumes lao."
