# French translations of the catalogue text (wave 9); step bodies follow later.
Tang–Nanzhao wars: Guerres entre les Tang et le Nanzhao
The wars between Tang China and Nanzhao, the kingdom of the Erhai lake in Yunnan, after their alliance against Tibet broke down. In 829 the Nanzhao general Wang Cuodian invaded Xichuan (Sichuan), plundered the country around Chengdu and carried off thousands of captives before withdrawing in 830. Under King Shilong, who took the title of emperor in 859, Nanzhao attacked on two fronts. In Annan (northern Vietnam), allied with local chiefs, its armies took the capital Songping (Hanoi) in 861 and again in 863 and held the delta for three years, until the Tang general Gao Pian retook it in 864–866. In Sichuan it took Xizhou and besieged Chengdu in 869–870, and raided to the walls of Chengdu again in 874. Gao Pian, sent to Chengdu, drove the Nanzhao army back across the Dadu River in 875. The wars exhausted both states. A Tang official wrote that the conscription and the supplies they demanded had emptied the treasury and turned peasants into robbers, and the great rebellion of Huang Chao began in the same years.: Les guerres entre la Chine des Tang et le Nanzhao, le royaume du lac Erhai, au Yunnan, après la rupture de leur alliance contre le Tibet. En 829, le général du Nanzhao Wang Cuodian envahit le Xichuan (Sichuan), pilla la région de Chengdu et emmena des milliers de captifs avant de se retirer en 830. Sous le roi Shilong, qui prit le titre d’empereur en 859, le Nanzhao attaqua sur deux fronts. En Annam (nord du Vietnam), alliées à des chefs locaux, ses armées prirent la capitale, Songping (Hanoï), en 861 puis de nouveau en 863, et tinrent le delta pendant trois ans, jusqu’à sa reconquête par le général Tang Gao Pian en 864–866. Au Sichuan, le Nanzhao prit Xizhou et assiégea Chengdu en 869–870, puis poussa de nouveau un raid jusqu’aux murs de Chengdu en 874. Gao Pian, envoyé à Chengdu, refoula l’armée du Nanzhao au-delà de la rivière Dadu en 875. Ces guerres épuisèrent les deux États. Un fonctionnaire Tang écrivit que la conscription et les approvisionnements qu’elles exigeaient avaient vidé le trésor et fait des paysans des brigands, et la grande rébellion de Huang Chao éclata dans ces mêmes années.
