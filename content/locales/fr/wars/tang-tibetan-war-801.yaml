# French translations of the catalogue text (wave 9); step bodies follow later.
Tang–Tibetan war (801–821): Guerre entre les Tang et le Tibet (801–821)
The last phase of the long wars between Tang China and the Tibetan Empire, ended by the treaty of 821–822. Tibet then held the Hexi Corridor, Longyou and the Tarim Basin, and its armies raided the Tang frontier in the Ordos and the west every few years. In 801 the Tang governor of Xichuan (Sichuan), Wei Gao, and Nanzhao, which had broken with Tibet in 794, attacked the Tibetan forts on the south-eastern frontier; they besieged Weizhou and Kunming (today’s Yanyuan) and early in 802 captured the Tibetan commander Lun Mangre, but could not take the towns. Raids and counter-raids went on under the Tibetan emperors Tride Songtsen and Ralpacan, who were also fighting the Uyghurs and the Abbasids. In 821 envoys of Ralpacan and the Tang emperor Muzong swore a treaty at Chang’an, sworn again at Lhasa in 822, which fixed the frontier where it then lay. Its bilingual text, put up in 823 on a pillar in front of the Jokhang, still stands.: La dernière phase des longues guerres entre la Chine des Tang et l’Empire tibétain, close par le traité de 821–822. Le Tibet tenait alors le corridor du Hexi, le Longyou et le bassin du Tarim, et ses armées lançaient tous les deux ou trois ans des raids sur la frontière des Tang, dans l’Ordos et à l’ouest. En 801, le gouverneur Tang du Xichuan (Sichuan), Wei Gao, et le Nanzhao, qui avait rompu avec le Tibet en 794, attaquèrent les forts tibétains de la frontière sud-est ; ils assiégèrent Weizhou et Kunming (l’actuelle Yanyuan) et capturèrent au début de 802 le commandant tibétain Lun Mangre, mais ne purent prendre les villes. Raids et contre-raids se poursuivirent sous les empereurs tibétains Tride Songtsen et Ralpacan, qui combattaient aussi les Ouïghours et les Abbassides. En 821, les envoyés de Ralpacan et de l’empereur Tang Muzong jurèrent à Chang’an un traité, juré de nouveau à Lhassa en 822, qui fixait la frontière là où elle passait alors. Son texte bilingue, gravé en 823 sur un pilier dressé devant le Jokhang, est toujours en place.
