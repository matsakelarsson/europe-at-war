# French translations of the catalogue text (wave 9); step bodies follow later.
Tapani incident: Incident de Tapani
? The last large armed rising of Han Taiwanese against Japanese rule, also called the Xilai Temple incident after the temple in Tainan where it was planned, and named after Tapani (today Yujing, in Tainan), where its main battle was fought. Its leader, Yu Qingfang, preached a millenarian message, raised money at the temple under the cover of repairs and proclaimed a state called Da Ming Cibei Guo, expecting “celestial troops” from China to come to his aid. When the police uncovered the plot and arrested his associate Luo Jun and others, Yu and the mountain leader Jiang Ding rose with Han farmers, camphor workers and Indigenous Taivoan fighters. In July 1915 they attacked Japanese police stations, beginning with the branch office at Kōbasen (Jiaxianpu) on 9 July, and killed officers and their families. On 6 August Japanese troops and police defeated them at Tapani, and in the following weeks they searched the surrounding villages, burning houses and killing villagers. A study for the Tainan city government in 2015 counted 1,412 dead; other estimates range from several hundred to 30,000. Yu was seized by villagers and handed over on 22 August 1915, and executed in September. Of 1,957 people arrested and tried, 866 were sentenced to death, about three-quarters of whom were later reprieved. Jiang Ding held out in the hills until he surrendered in April 1916 on a promise of pardon; he and his 272 men were arrested on 18 May 1916, and he was executed. After Tapani, Han Taiwanese opposition to Japanese rule took political rather than armed forms.
: Le dernier grand soulèvement armé des Taïwanais han contre la domination japonaise, appelé aussi incident du temple Xilai, du nom du temple de Tainan où il fut préparé, et nommé d’après Tapani (aujourd’hui Yujing, à Tainan), où se livra sa principale bataille. Son chef, Yu Qingfang, prêchait un message millénariste, collectait de l’argent au temple sous couvert de réparations et proclama un État nommé Da Ming Cibei Guo, comptant sur l’arrivée de « troupes célestes » venues de Chine pour lui prêter main-forte. Lorsque la police découvrit le complot et arrêta son associé Luo Jun et d’autres, Yu et le chef montagnard Jiang Ding se soulevèrent avec des paysans han, des ouvriers du camphre et des combattants autochtones taivoan. En juillet 1915, ils attaquèrent des postes de police japonais, à commencer par le poste annexe de Kōbasen (Jiaxianpu) le 9 juillet, et tuèrent des policiers et leurs familles. Le 6 août, les troupes et la police japonaises les battirent à Tapani et, dans les semaines qui suivirent, fouillèrent les villages environnants, brûlant des maisons et tuant des villageois. Une étude réalisée en 2015 pour la municipalité de Tainan a dénombré 1 412 morts ; d’autres estimations vont de plusieurs centaines à 30 000. Yu fut capturé par des villageois et livré le 22 août 1915, puis exécuté en septembre. Sur 1 957 personnes arrêtées et jugées, 866 furent condamnées à mort, dont environ les trois quarts furent ensuite graciées. Jiang Ding tint bon dans les collines jusqu’à sa reddition en avril 1916, contre une promesse de pardon ; lui et ses 272 hommes furent arrêtés le 18 mai 1916, et il fut exécuté. Après Tapani, l’opposition des Taïwanais han à la domination japonaise prit des formes politiques plutôt qu’armées.
