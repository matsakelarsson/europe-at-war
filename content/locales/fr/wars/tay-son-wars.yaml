# French translations of the catalogue text (wave 11); step bodies follow later.
Tây Sơn wars: Guerres des Tây Sơn
? Three decades of war that began with a rising of three brothers from Tây Sơn in Bình Định, Nguyễn Nhạc, Nguyễn Huệ and Nguyễn Lữ, against the Nguyễn lords of southern Đại Việt and ended with the unification of Vietnam under the last surviving Nguyễn prince. Drawing on peasants, upland peoples, Chinese merchants and Vietnamese traders, the Tây Sơn took Quy Nhơn in 1773, and while the Trịnh lords of the north invaded and took the Nguyễn capital Phú Xuân, they drove the Nguyễn south and in 1777 took Saigon and killed nearly the whole ruling family. Nguyễn Ánh, who escaped, fought back from the Mekong delta with Siamese, French and Chinese help. Nguyễn Huệ destroyed a Siamese fleet at Rạch Gầm–Xoài Mút in 1785, ended the rule of the Trịnh in 1786, routed a Qing army sent to restore the Lê emperor at Ngọc Hồi–Đống Đa in 1789 and reigned as Emperor Quang Trung until his death in 1792. From his base at Gia Định, Nguyễn Ánh advanced up the coast in yearly monsoon campaigns, took the Tây Sơn heartland at Quy Nhơn and Phú Xuân in 1799–1801, and in July 1802 entered Thăng Long as the Gia Long Emperor.
: Trois décennies de guerre qui commencèrent par le soulèvement de trois frères de Tây Sơn, dans le Bình Định, Nguyễn Nhạc, Nguyễn Huệ et Nguyễn Lữ, contre les seigneurs Nguyễn du sud du Đại Việt, et s’achevèrent par l’unification du Vietnam sous le dernier prince Nguyễn survivant. S’appuyant sur des paysans, des peuples des hautes terres, des marchands chinois et des commerçants vietnamiens, les Tây Sơn prirent Quy Nhơn en 1773 et, tandis que les seigneurs Trịnh du Nord envahissaient le pays et s’emparaient de Phú Xuân, la capitale des Nguyễn, ils repoussèrent les Nguyễn vers le sud, prirent Saïgon en 1777 et tuèrent presque toute la famille régnante. Nguyễn Ánh, qui en avait réchappé, contre-attaqua depuis le delta du Mékong avec une aide siamoise, française et chinoise. Nguyễn Huệ anéantit une flotte siamoise à Rạch Gầm–Xoài Mút en 1785, mit fin au pouvoir des Trịnh en 1786, mit en déroute à Ngọc Hồi–Đống Đa, en 1789, une armée Qing envoyée pour rétablir l’empereur Lê, et régna sous le nom d’empereur Quang Trung jusqu’à sa mort en 1792. Depuis sa base de Gia Định, Nguyễn Ánh remonta la côte au fil de campagnes annuelles rythmées par la mousson, prit Quy Nhơn et Phú Xuân, au cœur du territoire des Tây Sơn, en 1799–1801, et entra en juillet 1802 dans Thăng Long en tant qu’empereur Gia Long.
