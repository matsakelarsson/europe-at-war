# French translations of the catalogue text (wave 14); step bodies follow later.
Tecumseh’s War: Guerre de Tecumseh
? The struggle of the confederacy led by the Shawnee brothers Tecumseh and Tenskwatawa against the expansion of the United States in the Northwest. After the Treaty of Greenville, William Henry Harrison, governor of Indiana Territory, bought millions of acres from individual nations by treaty. Tenskwatawa, known as the Prophet, led a religious revival that drew followers from many nations to Prophetstown on the Wabash, and Tecumseh turned it into a political and military alliance, holding that the land belonged to all the nations in common and that none could sell it alone. He rejected the Treaty of Fort Wayne of 1809 to Harrison’s face at Vincennes in 1810 and travelled south in 1811 to win over the Muscogee and others. While he was away Harrison marched on Prophetstown with about 1,000 men; on 7 November 1811 warriors attacked his camp at Tippecanoe and were beaten off, and Harrison burned the town. Raids on the frontier followed, and when the War of 1812 began Tecumseh joined the British; his war merged into the larger one, and he was killed at the Battle of the Thames on 5 October 1813.
: La lutte de la confédération menée par les frères shawnees Tecumseh et Tenskwatawa contre l’expansion des États-Unis dans le Nord-Ouest. Après le traité de Greenville, William Henry Harrison, gouverneur du territoire de l’Indiana, acheta par traité des millions d’acres à des nations prises une à une. Tenskwatawa, appelé le Prophète, mena un renouveau religieux qui attira à Prophetstown, sur la Wabash, des fidèles de nombreuses nations, et Tecumseh en fit une alliance politique et militaire, affirmant que la terre appartenait en commun à toutes les nations et qu’aucune ne pouvait la vendre seule. Il rejeta le traité de Fort Wayne de 1809 face à Harrison, à Vincennes, en 1810 et partit vers le sud en 1811 pour rallier les Muscogees et d’autres peuples. En son absence, Harrison marcha sur Prophetstown avec environ 1 000 hommes ; le 7 novembre 1811, des guerriers attaquèrent son camp à Tippecanoe et furent repoussés, et Harrison incendia la ville. Des raids sur la frontière suivirent et, lorsque la guerre anglo-américaine de 1812 éclata, Tecumseh se joignit aux Britanniques ; sa guerre se fondit dans le conflit plus vaste, et il fut tué à la bataille de la Thames le 5 octobre 1813.
Tecumseh’s confederacy (Shawnee, Kickapoo, Potawatomi, Ho-Chunk, Wyandot, Odawa, Ojibwe and others): Confédération de Tecumseh (Shawnees, Kickapous, Potawatomis, Ho-Chunks, Wyandots, Outaouais, Ojibwés et d’autres)
United States (Indiana Territory, the US Army and Indiana and Kentucky militia): États-Unis (territoire de l’Indiana, armée américaine et milices de l’Indiana et du Kentucky)
