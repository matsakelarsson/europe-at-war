# French translations of the catalogue text (wave 8); step bodies follow later.
Telangana rebellion: Rébellion du Telangana
A communist-led peasant insurrection in the Telangana region of the princely state of Hyderabad, also called the Telangana armed struggle. It grew out of the movements of the Andhra Mahasabha against the great landlords (deshmukhs and jagirdars), forced labour (vetti), illegal levies and debt bondage. On 4 July 1946 a landlord’s men shot dead a village activist, Doddi Komarayya, at Kadavendi in Warangal district, and the movement turned into an armed rising led by the Communist Party of India. Peasant squads (dalams) fought the landlords, the Nizam’s police and the Razakar militia, set up village communes and redistributed land; by 1948 they held some 3,000 to 4,000 villages in Nalgonda, Warangal and Khammam. After India took over Hyderabad in September 1948 the Indian army turned against the communists, and thousands were killed or detained. The party called off the struggle in October 1951.: Une insurrection paysanne dirigée par les communistes dans la région du Telangana, dans l’État princier d’Hyderabad, appelée aussi lutte armée du Telangana. Elle naquit des mouvements de l’Andhra Mahasabha contre les grands propriétaires fonciers (deshmukhs et jagirdars), le travail forcé (vetti), les prélèvements illégaux et la servitude pour dettes. Le 4 juillet 1946, les hommes d’un propriétaire abattirent un militant villageois, Doddi Komarayya, à Kadavendi, dans le district de Warangal, et le mouvement se transforma en soulèvement armé dirigé par le Parti communiste d’Inde. Des escouades paysannes (dalams) combattirent les propriétaires, la police du nizam et la milice des Razakars, instaurèrent des communes villageoises et redistribuèrent la terre ; en 1948, elles tenaient quelque 3 000 à 4 000 villages dans les districts de Nalgonda, de Warangal et de Khammam. Après la prise de contrôle d’Hyderabad par l’Inde en septembre 1948, l’armée indienne se retourna contre les communistes, et des milliers d’entre eux furent tués ou détenus. Le parti mit fin à la lutte en octobre 1951.
Communist-led peasant squads: Escouades paysannes dirigées par les communistes
