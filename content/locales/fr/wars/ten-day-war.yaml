"A JNA armoured column from Vrhnika took the airport on 27 June. Yugoslav aircraft struck it the next day, killing the Austrian journalists Nikolas Vogel and Norbert Werner and wrecking four Adria Airways airliners.": "Une colonne blindée de la JNA de Vrhnika a pris l’aéroport le 27 juin. Des avions yougoslaves l’ont frappé le lendemain, tuant les journalistes autrichiens Nikolas Vogel et Norbert Werner et détruisant quatre avions Adria Airways."
