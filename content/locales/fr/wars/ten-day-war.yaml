"25–28 June 1991": "25–28 juin 1991"
"On 23 December 1990 Slovenes voted for independence in a referendum, and the republic’s government spent the following months preparing its Territorial Defence (TO) for a fight with the Yugoslav People’s Army. Slovenia and Croatia both declared independence on 25 June 1991, a day earlier than planned. Slovenian officers took over the border posts with Italy, Austria and Hungary and set up new ones on the border with Croatia.": "Le 23 décembre 1990, les Slovènes ont voté pour l’indépendance lors d’un référendum, et le gouvernement de la république a passé les mois suivants à préparer sa défense territoriale (TO) pour une lutte avec l’armée populaire yougoslave. La Slovénie et la Croatie ont tous deux déclaré leur indépendance le 25 juin 1991, un jour plus tôt que prévu."
"Early on 27 June JNA columns left their barracks to retake the crossings and Brnik airport. The army expected little resistance, but the Slovenian leadership under Milan Kučan chose to fight. The TO shot down two army helicopters, blocked roads with lorries and besieged barracks across the country. By midnight the JNA held every crossing on the Italian border and most on the Austrian, but many of its units were stranded, and on 28 June the TO went over to a general offensive.": "Au début du 27 juin, les colonnes de la JNA ont quitté leur caserne pour reprendre les points de passage et l’aéroport de Brnik. L’armée attendait peu de résistance, mais les dirigeants slovènes sous Milan Kučan ont choisi de se battre. Vers minuit, la JNA tenait tous les passages à la frontière italienne et surtout à l’Autriche, mais beaucoup de ses unités étaient bloquées, et le 28 juin la TO est passée à une offensive générale."
