"The TO took the border post on the Austrian border, killing three JNA soldiers and capturing 45, for two of its own dead. Austrian television filmed soldiers apparently trying to surrender as shots rang out; whether any of them were killed has been disputed ever since.": "La Défense territoriale prend le poste à la frontière autrichienne. Elle tue trois soldats de l’Armée populaire yougoslave et en capture 45, au prix de deux morts dans ses rangs. La télévision autrichienne filme des soldats qui semblent tenter de se rendre alors que des coups de feu retentissent. La question de savoir si certains d’entre eux ont été tués reste controversée."
