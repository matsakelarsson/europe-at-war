# Some French text was translated automatically.
"Ten-Day War": "Guerre de dix jours"
"Slovenia declared independence from Yugoslavia on 25 June 1991, after a referendum in which 88.5 per cent of voters had backed it. Two days later the Yugoslav People’s Army (JNA) moved to seize the republic’s border crossings and Ljubljana airport. The Slovenian Territorial Defence and police, prepared for months, blockaded barracks and ambushed tank columns, and many of the army’s conscripts surrendered. A European Community ceasefire held from 4 July and the Brioni Declaration of 7 July ended the fighting. About 80 people were killed, and the last JNA troops left Slovenia in October.": "La Slovénie a déclaré son indépendance de la Yougoslavie le 25 juin 1991, après un référendum au cours duquel 88,5 % des électeurs l’avaient soutenue. Deux jours plus tard, l’armée populaire yougoslave (JNA) s’est installée pour saisir les postes frontière de la République et l’aéroport de Ljubljana. Un cessez-le-feu de la Communauté européenne tenu le 4 juillet et la déclaration de Brioni du 7 juillet ont mis fin aux combats ; environ 80 personnes ont été tuées, et les dernières troupes de la JNA ont quitté la Slovénie en octobre."
"Casualty figures are Slovenian estimates. The JNA was still the army of the whole federation, and its dead and prisoners included men from every republic, Slovenes among them.": "La JNA était encore l’armée de toute la fédération, et ses morts et prisonniers comprenaient des hommes de toutes les républiques, des Slovènes parmi eux."
