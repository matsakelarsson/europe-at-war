"29 June – 26 October 1991": "29 juin – 26 octobre 1991"
"In the following days the TO overran crossings at Šentilj, Gornja Radgona and Vrtojba and took barracks and depots, re-arming itself with captured weapons. The garrison at Dravograd, some 400 men, surrendered on 30 June. On 2 July, the heaviest day of fighting, a relief column from Jastrebarsko in Croatia was turned back at Bregana, and a trapped air defence column in the Krakovo Forest held out near Krško.": "Dans les jours qui ont suivi, la TO a traversé Šentilj, Gornja Radgona et Vrtojba et pris des casernes et des dépôts, se réarmant avec des armes capturées. La garnison de Davograd, quelque 400 hommes, s’est rendue le 30 juin. Le 2 juillet, jour le plus lourd des combats, une colonne de secours de Jastrebarsko en Croatie a été retournée à Bregana et une colonne de défense aérienne piégée dans la forêt de Krakovo s’est tenue près de Krško."
"The army’s generals wanted a full-scale offensive, but the federal presidency would not authorise one. A ceasefire took hold from the evening of 3 July, and on 7 July Slovenia, Croatia and the federal government signed the Brioni Declaration under European Community mediation. Slovenia and Croatia suspended their independence for three months. On 18 July the federal presidency decided to withdraw the JNA from Slovenia, and the last troops left by 26 October. The war in Croatia was only beginning.": "Les généraux de l’armée voulaient une offensive à grande échelle, mais la présidence fédérale n’en autoriserait pas une. Un cessez-le-feu a pris fin dans la soirée du 3 juillet et le 7 juillet la Slovénie, la Croatie et le gouvernement fédéral ont signé la Déclaration de Brioni sous médiation de la Communauté européenne. La Slovénie et la Croatie ont suspendu leur indépendance pendant trois mois."
