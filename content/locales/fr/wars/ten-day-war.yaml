"The Slovenian parliament proclaimed independence on 25 June. On 27 June the TO shot down a JNA Gazelle helicopter over Rožna Dolina; its pilot, Toni Mrlak, was himself a Slovene, and it turned out to be carrying bread for the troops.": "Le Parlement slovène a proclamé son indépendance le 25 juin. Le 27 juin, la TO a abattu un hélicoptère de la JNA Gazelle au-dessus de Rožna Dolina ; son pilote, Toni Mrlak, était lui-même un Slovène, et il s’est avéré porter du pain pour les troupes."
