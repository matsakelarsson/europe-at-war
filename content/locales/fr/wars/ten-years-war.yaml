# French translations of the catalogue text (wave 14); step bodies follow later.
Ten Years’ War: Guerre des Dix Ans
? "The first Cuban war of independence, fought from 1868 to 1878 between the insurgent Republic of Cuba in Arms and Spain. On 10 October 1868 Carlos Manuel de Céspedes, a planter and lawyer of Manzanillo, freed the people he held in slavery at his La Demajagua sugar mill and proclaimed Cuba’s independence. The rising spread through the east of the island, Oriente and Camagüey, where there were fewer great plantations and fewer enslaved people than in the west, and briefly to Las Villas; the rebels took Bayamo, and in April 1869 an assembly at Guáimaro gave the republic a constitution, with Céspedes as president. Spain, supported in Havana by tens of thousands of Volunteers loyal to the colony, answered with columns, executions, forts and the fortified line of the Júcaro–Morón trocha that kept the war out of the sugar plantations of the west. Insurgent commanders such as Ignacio Agramonte, Máximo Gómez, Antonio Maceo and Calixto García won battles, notably Las Guásimas in 1874, and Gómez carried the war across the trocha into Las Villas in 1875, but the insurgents never had the arms, the recognition abroad or the unity to win: Agramonte was killed in 1873, the House of Representatives deposed Céspedes, who was killed in 1874, and regional quarrels split the army. After the end of the Carlist War in Spain, General Arsenio Martínez Campos combined fresh troops with pardons and promises, and on 10 February 1878 the Pact of Zanjón ended the war without independence or the abolition of slavery. Maceo rejected it in the Protest of Baraguá and fought on until May. Estimates of the dead range from about 100,000 to more than 200,000, most of them Spanish soldiers who died of disease and Cuban civilians and insurgents."
: "La première guerre d’indépendance cubaine, menée de 1868 à 1878 entre l’Espagne et la République de Cuba en armes, proclamée par les insurgés. Le 10 octobre 1868, Carlos Manuel de Céspedes, planteur et avocat de Manzanillo, libéra les personnes qu’il tenait en esclavage dans sa sucrerie de La Demajagua et proclama l’indépendance de Cuba. Le soulèvement s’étendit à l’est de l’île, l’Oriente et le Camagüey, où les grandes plantations et les esclaves étaient moins nombreux que dans l’ouest, et brièvement à Las Villas ; les rebelles prirent Bayamo, et en avril 1869 une assemblée réunie à Guáimaro donna à la république une constitution, avec Céspedes pour président. L’Espagne, soutenue à La Havane par des dizaines de milliers de Volontaires fidèles à la colonie, répondit par des colonnes, des exécutions, des forts et la ligne fortifiée de la trocha de Júcaro à Morón, qui tint la guerre à l’écart des plantations sucrières de l’ouest. Des chefs insurgés comme Ignacio Agramonte, Máximo Gómez, Antonio Maceo et Calixto García remportèrent des batailles, notamment celle de Las Guásimas en 1874, et Gómez porta la guerre au-delà de la trocha, dans Las Villas, en 1875, mais les insurgés n’eurent jamais les armes, la reconnaissance internationale ni l’unité nécessaires pour vaincre : Agramonte fut tué en 1873, la Chambre des représentants destitua Céspedes, qui fut tué en 1874, et des querelles régionales divisèrent l’armée. Après la fin de la guerre carliste en Espagne, le général Arsenio Martínez Campos combina troupes fraîches, pardons et promesses, et le 10 février 1878 le pacte de Zanjón mit fin à la guerre sans indépendance ni abolition de l’esclavage. Maceo le rejeta par la protestation de Baraguá et poursuivit le combat jusqu’en mai. Les estimations des morts vont d’environ 100 000 à plus de 200 000, pour la plupart des soldats espagnols morts de maladie ainsi que des civils et des insurgés cubains."
