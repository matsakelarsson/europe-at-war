# French translations of the catalogue text (wave 14); step bodies follow later.
Tepanec War: Guerre tépanèque
? The war in which the Mexica of Tenochtitlan, the Acolhua of Texcoco and the Tepanec city of Tlacopan overthrew the Tepanec state of Azcapotzalco, which had dominated the Valley of Mexico, and founded the Triple Alliance that became the Aztec Empire. When the Tepanec king Tezozomoc died in 1426 or 1427, his son Maxtla seized the throne from the heir he had chosen. Chimalpopoca, ruler of Tenochtitlan, died soon afterwards, by most accounts on Maxtla’s orders, and his successor Itzcoatl refused to submit. Nezahualcoyotl, the exiled heir of Texcoco, whose father the Tepanecs had killed in 1418, raised Acolhua towns and won help from Huexotzinco and Tlaxcala, and Tlacopan broke with Azcapotzalco. In 1428 the allies retook Texcoco and its towns and stormed and destroyed Azcapotzalco; Maxtla was killed or fled. The victors divided the Tepanec lands and agreed to wage their wars together, and over the next years they conquered Coyoacán and the chinampa towns of the southern lakes. Nezahualcoyotl became king of Texcoco in 1431.
: La guerre au cours de laquelle les Mexicas de Tenochtitlan, les Acolhuas de Texcoco et la cité tépanèque de Tlacopan renversèrent l’État tépanèque d’Azcapotzalco, qui dominait la vallée de Mexico, et fondèrent la Triple Alliance, qui devint l’Empire aztèque. À la mort du roi tépanèque Tezozomoc, en 1426 ou 1427, son fils Maxtla s’empara du trône aux dépens de l’héritier que son père avait choisi. Chimalpopoca, souverain de Tenochtitlan, mourut peu après, sur l’ordre de Maxtla selon la plupart des récits, et son successeur Itzcoatl refusa de se soumettre. Nezahualcoyotl, l’héritier exilé de Texcoco, dont le père avait été tué par les Tépanèques en 1418, souleva les villes acolhuas et obtint l’aide de Huexotzinco et de Tlaxcala, et Tlacopan rompit avec Azcapotzalco. En 1428, les alliés reprirent Texcoco et ses villes, puis prirent d’assaut et détruisirent Azcapotzalco ; Maxtla fut tué ou s’enfuit. Les vainqueurs se partagèrent les terres tépanèques et convinrent de mener leurs guerres en commun ; au cours des années suivantes, ils conquirent Coyoacán et les villes à chinampas des lacs du sud. Nezahualcoyotl devint roi de Texcoco en 1431.
