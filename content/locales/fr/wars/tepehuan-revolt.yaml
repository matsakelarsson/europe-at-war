# French translations of the catalogue text (wave 14); step bodies follow later.
Tepehuán Revolt: Révolte des Tepehuán
? A rising of the Tepehuán of the Sierra Madre Occidental in Nueva Vizcaya, today’s Durango, against Spanish rule and the Jesuit missions. The Tepehuán were farmers living in scattered settlements on the eastern slopes of the sierra. Spanish miners and ranchers had moved into their lands from the 1570s, and the Jesuits founded missions among them from 1596, at Santiago Papasquiaro, Santa Catarina de Tepehuanes and El Zape; epidemics in 1594, 1601–1602, 1606–1607, 1610 and 1616–1617 may have killed more than four-fifths of the peoples of the region. In 1616 a baptised Tepehuán prophet, Quautlatas, carrying a broken cross, preached that the old gods were angry and that the Spaniards and the missionaries must be killed or driven out, promising that the dead would rise again. The revolt began on 16 November 1616 with an attack on a wagon train near Santa Catarina, and in coordinated attacks in the following days the Tepehuán, under six war leaders of whom Francisco Gogoxito was the best known, killed about 100 people in the church at El Zape and a similar number at Santiago Papasquiaro; all but one of the Jesuits in their country were killed. Governor Gaspar de Alvear, fearing an attack on Durango, ordered the execution of some 75 Indigenous leaders held there and led a column into the sierra in December; further expeditions in 1617 and 1618, with Concho and other Indigenous allies, fought a war “by fire and blood” and killed the last of the war leaders in 1618. Raiding went on until the revolt was declared over in 1620. More than 200 Spaniards, ten missionaries, and unknown numbers of Indigenous, African and mestizo people on the Spanish side died, and perhaps 4,000 Tepehuán, many of hunger and disease; mines and churches were burned and the province took decades to recover. Fifteen years earlier, in December 1601, the Acaxee of the sierra to the west, led by an elder called Perico, had risen against the mining camps around Topia; after the Jesuit Hernando de Santarén failed to make peace, Francisco de Urdiñola put the rising down with Spanish and Indigenous troops and executed Perico and about 48 others in 1602–1603.
: Un soulèvement des Tepehuán de la Sierra Madre occidentale, en Nouvelle-Biscaye, l’actuel Durango, contre la domination espagnole et les missions jésuites. Les Tepehuán étaient des agriculteurs qui vivaient en habitat dispersé sur les versants orientaux de la sierra. Des mineurs et des éleveurs espagnols s’étaient installés sur leurs terres à partir des années 1570, et les jésuites avaient fondé des missions chez eux à partir de 1596, à Santiago Papasquiaro, Santa Catarina de Tepehuanes et El Zape ; les épidémies de 1594, 1601–1602, 1606–1607, 1610 et 1616–1617 ont peut-être tué plus des quatre cinquièmes des peuples de la région. En 1616, un prophète tepehuán baptisé, Quautlatas, qui portait une croix brisée, prêcha que les anciens dieux étaient en colère et qu’il fallait tuer ou chasser les Espagnols et les missionnaires, promettant que les morts ressusciteraient. La révolte commença le 16 novembre 1616 par l’attaque d’un convoi de chariots près de Santa Catarina et, lors d’attaques coordonnées les jours suivants, les Tepehuán, menés par six chefs de guerre dont Francisco Gogoxito était le plus connu, tuèrent une centaine de personnes dans l’église d’El Zape et à peu près autant à Santiago Papasquiaro ; tous les jésuites de leur pays sauf un furent tués. Le gouverneur Gaspar de Alvear, craignant une attaque contre Durango, fit exécuter quelque 75 chefs autochtones qui y étaient détenus et conduisit une colonne dans la sierra en décembre ; d’autres expéditions, en 1617 et 1618, avec des Conchos et d’autres alliés autochtones, menèrent une guerre « à feu et à sang » et tuèrent le dernier des chefs de guerre en 1618. Les raids se poursuivirent jusqu’à ce que la révolte soit déclarée terminée en 1620. Plus de 200 Espagnols, dix missionnaires et un nombre inconnu d’Autochtones, d’Africains et de métis du côté espagnol périrent, ainsi que peut-être 4 000 Tepehuán, dont beaucoup de faim et de maladie ; des mines et des églises furent incendiées, et la province mit des décennies à se relever. Quinze ans plus tôt, en décembre 1601, les Acaxee de la sierra située plus à l’ouest, menés par un ancien nommé Perico, s’étaient soulevés contre les camps miniers des environs de Topia ; après l’échec du jésuite Hernando de Santarén à rétablir la paix, Francisco de Urdiñola réprima le soulèvement avec des troupes espagnoles et autochtones et fit exécuter Perico et environ 48 autres personnes en 1602–1603.
