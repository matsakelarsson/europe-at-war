# French translations of the catalogue text (wave 11); step bodies follow later.
Ternatean–Portuguese war: Guerre entre Ternate et le Portugal
? The war in which the sultanate of Ternate, the great clove-producing kingdom of northern Maluku, drove the Portuguese from their fortress on the island. The Portuguese had built the fort of São João Baptista on Ternate from 1522 as allies of the sultans, but their captains’ behaviour, their missions and their attempts to control the clove trade led to growing conflict with Sultan Hairun (Khairun), who fought them in Ambon and Halmahera in the 1560s. On 25 February 1570 the captain Diogo Lopes de Mesquita invited Hairun into the fort for a meal of reconciliation, and his nephew Martim Afonso Pimentel stabbed the sultan to death at the gate. Hairun’s son Babullah was proclaimed sultan on the island of Hiri and swore enmity to the Portuguese until his father’s killers were punished. Ternate’s forces took the smaller Portuguese posts on the island and besieged São João Baptista, letting in only small rations of sago, while Ternatan fleets attacked Portuguese and mission positions in Halmahera and Morotai, and in Ambon, Buru and western Seram; the Portuguese kept their new fort at Ambon only with difficulty. Tidore at first sided with Ternate. After five years Babullah gave the garrison 24 hours to leave, and on 15 July 1575 the captain Nuno Pereira de Lacerda handed over the fort; the Portuguese left unharmed for Ambon, Malacca and the sandalwood islands of Solor and Timor. Babullah made the fort his palace and went on to build Ternate’s widest sphere of influence, while the Portuguese were allowed a fort on Tidore in 1578. Indonesians count the victory as the first of a state of the archipelago over a European power; Babullah was made a National Hero of Indonesia in 2020.
: La guerre au cours de laquelle le sultanat de Ternate, grand royaume producteur de clous de girofle du nord des Moluques, chassa les Portugais de leur forteresse sur l’île. Les Portugais avaient construit le fort de São João Baptista sur Ternate à partir de 1522, en alliés des sultans, mais la conduite de leurs capitaines, leurs missions et leurs tentatives de contrôler le commerce du girofle provoquèrent un conflit croissant avec le sultan Hairun (Khairun), qui les combattit à Ambon et à Halmahera dans les années 1560. Le 25 février 1570, le capitaine Diogo Lopes de Mesquita invita Hairun dans le fort pour un repas de réconciliation, et son neveu Martim Afonso Pimentel poignarda le sultan à mort à la porte. Babullah, fils de Hairun, fut proclamé sultan sur l’île de Hiri et jura d’être l’ennemi des Portugais jusqu’à ce que les meurtriers de son père soient punis. Les forces de Ternate prirent les petits postes portugais de l’île et assiégèrent São João Baptista, n’y laissant entrer que de maigres rations de sagou, tandis que les flottes de Ternate attaquaient les positions portugaises et missionnaires à Halmahera et à Morotai, ainsi qu’à Ambon, à Buru et dans l’ouest de Seram ; les Portugais ne conservèrent qu’à grand-peine leur nouveau fort d’Ambon. Tidore se rangea d’abord aux côtés de Ternate. Au bout de cinq ans, Babullah donna 24 heures à la garnison pour partir et, le 15 juillet 1575, le capitaine Nuno Pereira de Lacerda remit le fort ; les Portugais partirent sains et saufs pour Ambon, Malacca et les îles à santal de Solor et de Timor. Babullah fit du fort son palais et bâtit ensuite la plus vaste sphère d’influence qu’ait connue Ternate, tandis que les Portugais furent autorisés à établir un fort à Tidore en 1578. Les Indonésiens voient dans cette victoire la première remportée par un État de l’archipel sur une puissance européenne ; Babullah a été proclamé héros national de l’Indonésie en 2020.
