# French translations of the catalogue text (wave 12); step bodies follow later.
Wars of Tewodros II: Guerres de Tewodros II
The wars by which Kassa Hailu, a chief from the western borderland of Qwara, ended the Zemene Mesafint, the “Era of the Princes” in which regional lords had ruled Ethiopia in the name of powerless emperors at Gondar, and made himself emperor as Tewodros II. Between November 1852 and February 1855 he defeated the lords of Gojjam at Gur Amba, the regent Ras Ali II at Ayshal and Dejazmach Wube of Semien and Tigray at Derasge, and was crowned on 11 February 1855. He then took Wollo and, in 1855–1856, the kingdom of Shewa, whose young heir Menelik he brought to his court. His attempts to rule through appointed officials and a standing army, and to tax the church, met revolt in almost every province, which he answered with ever harsher reprisals. By 1867 he held little beyond his fortress of Magdala, where he died during the British assault of April 1868.: Les guerres par lesquelles Kassa Hailu, chef originaire du Qwara, marche occidentale du pays, mit fin au Zemene Mesafint, l’« ère des princes », durant laquelle des seigneurs régionaux avaient gouverné l’Éthiopie au nom d’empereurs sans pouvoir résidant à Gondar, et se fit empereur sous le nom de Tewodros II. Entre novembre 1852 et février 1855, il battit les seigneurs du Godjam à Gur Amba, le régent ras Ali II à Ayshal et le dejazmach Wube du Semien et du Tigré à Derasge, et fut couronné le 11 février 1855. Il prit ensuite le Wollo et, en 1855–1856, le royaume du Choa, dont il emmena à sa cour le jeune héritier, Ménélik. Ses tentatives de gouverner au moyen de fonctionnaires nommés et d’une armée permanente, et d’imposer l’Église, se heurtèrent à des révoltes dans presque toutes les provinces, auxquelles il répondit par des représailles de plus en plus dures. En 1867, il ne tenait plus guère que sa forteresse de Magdala, où il mourut lors de l’assaut britannique d’avril 1868.
