# French translations of the catalogue text (wave 14); step bodies follow later.
Texas–Indian wars: Guerres texano-indiennes
? "The wars between Texas, as a republic, a state of the United States and a Confederate state, and the Comanche, the Kiowa and other Native nations of Texas, from Texan independence to the surrender of the last free Comanche band in 1875. In May 1836 Comanche, Kiowa and allied fighters attacked Fort Parker and carried off five captives, among them the nine-year-old Cynthia Ann Parker. Sam Houston sought treaties, but his successor Mirabeau Lamar (1838–1841) made war: in July 1839 Texan forces drove the Cherokee and their allies out of East Texas, killing their leader Duwali (Chief Bowl) at the Neches. On 19 March 1840, at a peace council in the Council House at San Antonio, Texan officials tried to hold the Comanche delegation of the Penateka leader Muguara hostage for the return of captives; 35 Comanche, among them 12 leaders, and 7 Texans were killed, and the Comanche killed 13 of the captives they held in reply. In August Buffalo Hump (Potsanaquahip) led several hundred Comanche and Kiowa to the coast, sacking Victoria and burning Linnville, and on the way back Texan militia and Rangers attacked them at Plum Creek on 12 August; in October John Henry Moore’s volunteers destroyed a Comanche village on the upper Colorado River. Houston returned to treaty-making in 1843–1844. After annexation (1845) the United States built lines of forts and in 1854 a reservation on the Brazos, whose Caddo, Anadarko and Tonkawa scouts fought beside the Rangers at Antelope Hills in 1858, where the Comanche leader Iron Jacket was killed, but in 1859 attacks by Texan vigilantes forced the reservation peoples into Indian Territory. At Pease River in December 1860 Rangers attacked a Comanche camp and recaptured Cynthia Ann Parker, the mother of Quanah. During the Civil War Comanche and Kiowa raids, such as the Elm Creek raid of October 1864, pushed the line of settlement back by more than 160 km, and Kickapoo migrating to Mexico defeated Confederate Texans at Dove Creek in January 1865. After the war the Kiowa leaders Satanta, Satank and Big Tree attacked a wagon train on Salt Creek Prairie in May 1871, and Ranald Mackenzie’s cavalry began campaigning on the Llano Estacado; the Red River War of 1874–1875 ended with Quanah Parker’s Quahadi Comanche surrendering at Fort Sill on 2 June 1875."
: "Les guerres entre le Texas, en tant que république, puis comme État des États-Unis et comme État confédéré, et les Comanches, les Kiowas et d’autres nations amérindiennes du Texas, de l’indépendance texane à la reddition de la dernière bande libre de Comanches en 1875. En mai 1836, des combattants comanches, kiowas et alliés attaquèrent Fort Parker et emmenèrent cinq captifs, parmi lesquels Cynthia Ann Parker, âgée de neuf ans. Sam Houston chercha à conclure des traités, mais son successeur Mirabeau Lamar (1838–1841) fit la guerre : en juillet 1839, les forces texanes chassèrent les Cherokees et leurs alliés de l’est du Texas, tuant leur chef Duwali (Chief Bowl) sur la Neches. Le 19 mars 1840, lors d’un conseil de paix à la Council House de San Antonio, des représentants texans tentèrent de retenir en otage la délégation comanche du chef penateka Muguara pour obtenir la restitution de captifs ; 35 Comanches, dont 12 chefs, et 7 Texans furent tués, et les Comanches tuèrent en représailles 13 des captifs qu’ils détenaient. En août, Buffalo Hump (Potsanaquahip) mena plusieurs centaines de Comanches et de Kiowas jusqu’à la côte, mettant Victoria à sac et incendiant Linnville, et sur le chemin du retour, la milice texane et les Rangers les attaquèrent à Plum Creek le 12 août ; en octobre, les volontaires de John Henry Moore détruisirent un village comanche sur le cours supérieur du Colorado. Houston revint à la politique des traités en 1843–1844. Après l’annexion (1845), les États-Unis construisirent des lignes de forts et, en 1854, une réserve sur le Brazos, dont les éclaireurs caddos, anadarkos et tonkawas combattirent aux côtés des Rangers à Antelope Hills en 1858, où le chef comanche Iron Jacket fut tué ; mais en 1859, les attaques de justiciers texans contraignirent les peuples de la réserve à partir pour le territoire indien. À Pease River, en décembre 1860, des Rangers attaquèrent un camp comanche et reprirent Cynthia Ann Parker, la mère de Quanah. Pendant la guerre de Sécession, des raids comanches et kiowas, comme celui d’Elm Creek en octobre 1864, firent reculer la ligne de peuplement de plus de 160 km, et des Kickapous qui émigraient au Mexique battirent des Texans confédérés à Dove Creek en janvier 1865. Après la guerre, les chefs kiowas Satanta, Satank et Big Tree attaquèrent un convoi de chariots sur la Salt Creek Prairie en mai 1871, et la cavalerie de Ranald Mackenzie commença à faire campagne sur le Llano Estacado ; la guerre de la Red River de 1874–1875 s’acheva avec la reddition des Comanches Quahadis de Quanah Parker à Fort Sill le 2 juin 1875."
