# French translations of the catalogue text (wave 14); step bodies follow later.
Texas Revolution: Révolution texane
? The rebellion of Texas against the government of Mexico in 1835–1836, which made Texas an independent republic. From the 1820s Mexico had invited settlers into its thinly peopled province of Coahuila y Tejas, and by 1835 Anglo-American colonists, many of them slaveholders from the US South, outnumbered the Tejanos (Mexican Texans) by several to one. They clashed with the government over Mexico’s attempts to end slavery and to stop immigration from the United States, and over the centralist rule of Antonio López de Santa Anna, who in 1835 overthrew the federal constitution of 1824. The fighting began at Gonzales on 2 October 1835; by December the Texians, with Tejano allies, had driven the Mexican garrisons out. Santa Anna marched north with some 6,000 men, took the Alamo in San Antonio on 6 March 1836, killing all its defenders, and on 27 March had more than 340 prisoners shot at Goliad. A convention declared Texas independent on 2 March. On 21 April Sam Houston’s army surprised and routed Santa Anna’s force at San Jacinto and captured him; at Velasco he agreed to withdraw his troops. Mexico never accepted the treaties, and Texas remained an independent republic, recognised by the United States, France and Britain but not by Mexico, until the United States annexed it in 1845.
: La rébellion du Texas contre le gouvernement du Mexique en 1835–1836, qui fit du Texas une république indépendante. Depuis les années 1820, le Mexique avait invité des colons à s’installer dans sa province peu peuplée de Coahuila y Tejas et, en 1835, les colons anglo-américains, dont beaucoup étaient des propriétaires d’esclaves venus du Sud des États-Unis, étaient plusieurs fois plus nombreux que les Tejanos (Texans mexicains). Ils s’opposèrent au gouvernement au sujet des tentatives du Mexique pour abolir l’esclavage et arrêter l’immigration en provenance des États-Unis, ainsi que du régime centraliste d’Antonio López de Santa Anna, qui avait aboli en 1835 la constitution fédérale de 1824. Les combats commencèrent à Gonzales le 2 octobre 1835 ; en décembre, les Texians, avec des alliés tejanos, avaient chassé les garnisons mexicaines. Santa Anna marcha vers le nord avec quelque 6 000 hommes, prit Fort Alamo, à San Antonio, le 6 mars 1836, en tuant tous ses défenseurs, et fit fusiller plus de 340 prisonniers à Goliad le 27 mars. Une convention proclama l’indépendance du Texas le 2 mars. Le 21 avril, l’armée de Sam Houston surprit et mit en déroute les forces de Santa Anna à San Jacinto et le captura ; à Velasco, il accepta de retirer ses troupes. Le Mexique ne reconnut jamais ces traités, et le Texas resta une république indépendante, reconnue par les États-Unis, la France et la Grande-Bretagne mais pas par le Mexique, jusqu’à son annexion par les États-Unis en 1845.
