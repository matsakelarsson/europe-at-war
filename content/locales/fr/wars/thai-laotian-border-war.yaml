# French translations of the catalogue text (wave 11); step bodies follow later.
Thai–Laotian Border War: Guerre frontalière thaïlando-laotienne
? "A short war between Thailand and Laos over a disputed stretch of their border in the Luang Prabang range, around the village of Ban Rom Klao in Chat Trakan district of Phitsanulok province and Botene district of Sainyabuli province. The Franco-Siamese treaty of 1907 put the border on the watershed, but the French map drawn after it did not always follow it, and where a river split into two branches each side claimed a different one; logging in the disputed forest added to the friction. Clashes in 1984 over three villages on the border of Uttaradit province had already brought the two countries close to war. In December 1987 the Thai army moved to drive Lao troops from Hill 1428 above Ban Rom Klao, which both sides claimed, and the fighting grew into a two-month battle for the hill. Thai F-5 and other aircraft bombed the Lao positions, and Thailand lost two aircraft to Lao air defences; Vietnam, then allied with Laos, moved troops into Sainyabuli. The Lao forces kept the summit. After talks on 16–17 February 1988 a ceasefire took effect on 19 February, and both sides pulled back 3 km. Estimates of the dead range from about 100 to 200 Thai and some 300 Lao soldiers. The war hastened a change in Thai policy: the new prime minister, Chatichai Choonhavan, spoke in 1988 of turning the battlefields of Indochina into marketplaces, and the border was surveyed and largely demarcated in the following decades."
: "Une courte guerre entre la Thaïlande et le Laos au sujet d’un tronçon contesté de leur frontière dans la chaîne de Luang Prabang, autour du village de Ban Rom Klao, dans le district de Chat Trakan de la province de Phitsanulok et le district de Botene de la province de Sainyabuli. Le traité franco-siamois de 1907 fixait la frontière sur la ligne de partage des eaux, mais la carte française établie à sa suite ne la suivait pas toujours, et là où une rivière se divisait en deux bras, chaque camp revendiquait un bras différent ; l’exploitation forestière dans la forêt contestée attisa les frictions. Des affrontements en 1984 au sujet de trois villages situés à la limite de la province d’Uttaradit avaient déjà mené les deux pays au bord de la guerre. En décembre 1987, l’armée thaïlandaise entreprit de chasser les troupes lao de la colline 1428, qui domine Ban Rom Klao et que les deux camps revendiquaient, et les combats se muèrent en une bataille de deux mois pour la colline. Des F-5 et d’autres avions thaïlandais bombardèrent les positions lao, et la Thaïlande perdit deux appareils, abattus par la défense antiaérienne lao ; le Vietnam, alors allié du Laos, fit entrer des troupes dans le Sainyabuli. Les forces lao conservèrent le sommet. Après des pourparlers les 16 et 17 février 1988, un cessez-le-feu entra en vigueur le 19 février, et les deux camps reculèrent de 3 km. Les estimations des morts vont d’environ 100 à 200 soldats thaïlandais et quelque 300 soldats lao. La guerre accéléra un changement de la politique thaïlandaise : le nouveau Premier ministre, Chatichai Choonhavan, parla en 1988 de transformer les champs de bataille de l’Indochine en marchés, et la frontière fut relevée et en grande partie démarquée au cours des décennies suivantes."
