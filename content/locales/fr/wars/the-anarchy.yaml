"1143–1154": "1143–1154"
"Neither side could win, and the war became one of castles, sieges and raids. Barons built castles without the king’s leave, and some, like Geoffrey de Mandeville in the fens, plundered at will until he was killed in 1144. The Peterborough chronicler wrote that men said openly that Christ and his saints slept. Robert of Gloucester died in 1147, and the Empress left England in 1148, leaving the cause to her son, Henry FitzEmpress. Henry became duke of Normandy in 1150 and count of Anjou in 1151, and in 1152 he married Eleanor, duchess of Aquitaine.": "Les barons construisirent des châteaux sans la permission du roi, et certains, comme Geoffrey de Mandeville dans les fens, pillèrent à volonté jusqu’à sa mort en 1144. Le chroniqueur de Peterborough écrivit que les hommes disaient ouvertement que le Christ et ses saints dormaient. Robert de Gloucester est décédé en 1147, et l’impératrice a quitté l’Angleterre en 1148, laissant la cause à son fils, Henry FitzEmpress. Henry est devenu duc de Normandie en 1150 et comte d’Anjou en 1151, et en 1152, il a épousé Eleanor, duchesse d’Aquitaine."
"In January 1153 Henry crossed to England with a small army. In July his forces and Stephen’s faced each other across the Thames at Wallingford, but the barons on both sides would not fight, and the church arranged a truce. Stephen’s son Eustace died in August. In November, at Winchester, Stephen recognised Henry as his adopted son and heir, keeping the crown for life. Stephen died on 25 October 1154, and Henry II was crowned on 19 December, ruling lands from the Scottish border to the Pyrenees. In 1157 he made David’s grandson Malcolm IV hand back the northern counties.": "En janvier 1153, Henry passa en Angleterre avec une petite armée. En juillet, ses forces et Stephens se confrontèrent à travers la Tamise à Wallingford, mais les barons des deux côtés ne combattirent pas, et l’église arrangea une trêve. Stephen mourut le 25 octobre 1154, et Henri II fut couronné le 19 décembre, au pouvoir des terres depuis la frontière écossaise jusqu’aux Pyrénées. En 1157, il fit revenir le petit-fils de David Malcolm IV dans les comtés du nord."
