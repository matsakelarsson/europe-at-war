"1135–1139": "1135–1139"
"Henry I’s only legitimate son drowned in the wreck of the White Ship in 1120, and Henry made his barons swear to accept his daughter Matilda, the widowed empress, now married to Count Geoffrey of Anjou. When Henry died on 1 December 1135, his nephew Stephen of Blois crossed from Boulogne, won over London and, with the help of his brother Henry, bishop of Winchester, the royal treasury, and was crowned that month. Matilda’s uncle, King David I of Scotland, invaded the north and was allowed to keep Carlisle. In 1138 Robert, earl of Gloucester, Matilda’s half-brother and one of the richest barons, renounced his loyalty to Stephen, and revolts broke out in Kent and the south-west.": "En 1120, Henry n’a noyé que son fils légitime dans l’épave du navire blanc, et il a fait jurer à ses barons d’accepter sa fille Matilda, l’impératrice veuve, maintenant mariée au comte Geoffrey d’Anjou. À la mort d’Henry le 1er décembre 1135, son neveu Stephen de Blois croise Boulogne, gagne Londres et, avec l’aide de son frère Henry, évêque de Winchester, trésor royal, est couronné ce mois-là. L’oncle Matilda, roi David Ier d’Écosse, envahit le nord et fut autorisé à garder Carlisle. En 1138, Robert, comte de Gloucester, demi-frère de Matilda et l’un des barons les plus riches, renonce à sa loyauté envers Stephen, et des révoltes éclatent dans le Kent et le sud-ouest."
"That year David invaded again, and his army plundered Northumberland and Durham. Archbishop Thurstan of York rallied the northern barons and levies, who gathered round a cart carrying a ship’s mast hung with the banners of northern saints, the Standard. On 22 August 1138, on Cowton Moor near Northallerton, they routed the Scots. Even so, by the Treaty of Durham of 9 April 1139 Stephen made David’s son Henry earl of Northumberland, leaving the Scots in control almost to the Tees. On 30 September Matilda and Robert landed at Arundel; Stephen let her join her brother at Bristol, and the west of England became her stronghold.": "Cette année-là, David envahit de nouveau, et son armée pilla Northumberland et Durham. L’archevêque Thurstan de York rallia les barons et les prélèvements du nord, qui rassemblèrent autour d’un char portant un navire le mât accroché avec les bannières des saints du nord, le Standard. Le 22 août 1138, sur Cowton Moor près de Northallerton, ils roulèrent les Écossais. Malgré cela, par le traité de Durham du 9 avril 1139 Étienne fit le fils de David Henry Earl de Northumberland, laissant les Écossais au contrôle presque aux Tees. Le 30 septembre Matilda et Robert débarquèrent à Arundel ; Stephen la laissa rejoindre son frère à Bristol, et l’ouest de l’Angleterre devint sa forteresse."
