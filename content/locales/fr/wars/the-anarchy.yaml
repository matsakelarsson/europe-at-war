"1141–1142": "1141–1142"
"Early in 1141 Stephen besieged Lincoln castle, which Ranulf, earl of Chester, had seized. Ranulf and Robert of Gloucester came to its relief with their men, the disinherited and Welsh troops, and on 2 February Stephen fought on foot after his earls had fled, until he was captured; he was imprisoned at Bristol. Bishop Henry, now papal legate, went over to the Empress, and in April a church council at Winchester accepted her as Lady of the English. But when she came to London in June to be crowned, her demands for money angered the citizens, who rose and drove her out.": "Au début de 1141, Stephen assiégea le château Lincoln, que Ranulf, comte de Chester, avait saisi. Ranulf et Robert de Gloucester vinrent à son secours avec leurs hommes, les troupes déshéritées et galloises, et le 2 février, Stephen combattit à pied après que ses oreillers eurent fui, jusqu’à ce qu’il soit capturé ; il fut emprisonné à Bristol. L’évêque Henry, maintenant légate papale, est allé à l’impératrice et en avril un conseil d’église à Winchester l’a acceptée comme Dame des Anglais. Mais quand elle est venue à Londres en juin pour être couronnée, ses demandes d’argent ont irrité les citoyens, qui se sont levés et l’ont chassée."
"Stephen’s queen, Matilda of Boulogne, kept his cause alive with William of Ypres and his Flemish mercenaries. When the Empress besieged Bishop Henry, who had changed sides again, in Winchester, the queen’s army besieged her in turn. On 14 September the Angevins broke out and were routed; Robert of Gloucester was captured covering the retreat at Stockbridge and exchanged for Stephen in November. In 1142 Stephen besieged the Empress in Oxford castle. In December she escaped across the frozen Thames, dressed in white against the snow, to Wallingford. Meanwhile her husband Geoffrey conquered Normandy, entering Rouen in January 1144.": "Lorsque l’impératrice assiégea Mgr Henry, qui avait de nouveau changé de camp, à Winchester, l’armée de la reine l’assiégea à son tour. Le 14 septembre, les Angevins éclatèrent et furent chassés ; Robert de Gloucester fut capturé couvrant la retraite de Stockbridge et échangé contre Stephen en novembre. En 1142, Stephen assiégea l’Impératrice au château d’Oxford. En décembre, elle s’échappa à travers la Tamise gelée, vêtue de blanc contre la neige, à Wallingford. Pendant ce temps son mari Geoffrey conquiert la Normandie en entrant à Rouen en janvier 1144."
