# Some French text was translated automatically.
"The Anarchy": "L’anarchie"
"A civil war in England and Normandy over the succession to Henry I, fought between his nephew King Stephen and his daughter, the Empress Matilda, with King David I of Scotland taking her side and seizing the north. Neither side could win, and in 1153 Stephen recognised Matilda’s son Henry as his heir; Henry II succeeded him in 1154.": "Une guerre civile en Angleterre et en Normandie sur la succession d’Henri Ier, a combattu entre son neveu le roi Stephen et sa fille, l’impératrice Matilda, avec le roi David Ier d’Écosse prenant son parti et saisissant le nord. Aucune des deux parties n’a pu gagner, et en 1153 Étienne a reconnu le fils de Matildas Henry comme son héritier ; Henri II lui a succédé en 1154."
"The name “the Anarchy” was given by Victorian historians; contemporaries wrote of the troubles of Stephen’s reign. The main chronicles, the Gesta Stephani, William of Malmesbury and Henry of Huntingdon, each lean to one side.": "Le nom d’Anarchie est donné par les historiens victoriens ; les contemporains ont écrit sur les troubles du règne d’Étienne. Les principales chroniques, la Gesta Stephani, William de Malmesbury et Henry de Huntingdon, se penchent chacun sur un côté."
"Matilda is called the Empress because her first husband was the Emperor Henry V. To avoid confusion with her, Stephen’s queen is called Matilda of Boulogne.": "Matilda est appelée l’Impératrice parce que son premier mari était l’Empereur Henry V. Pour éviter toute confusion avec elle, la reine d’Étienne s’appelle Matilda de Boulogne."
