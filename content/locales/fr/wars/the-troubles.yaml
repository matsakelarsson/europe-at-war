# Some French text was translated automatically.
"The Troubles": "Les problèmes"
"A conflict in Northern Ireland from the late 1960s to 1998 between republican paramilitaries seeking a united Ireland, loyalist paramilitaries determined to keep Northern Ireland British, and the British Army and police. More than 3,500 people were killed, about half of them civilians, before ceasefires and the Good Friday Agreement of 1998 set up a power-sharing government.": "Un conflit en Irlande du Nord de la fin des années 1960 à 1998 entre des paramilitaires républicains cherchant une Irlande unie, des paramilitaires loyalistes déterminés à garder l’Irlande du Nord britannique, et l’armée et la police britanniques. Plus de 3 500 personnes ont été tuées, dont environ la moitié de civils, avant que les cessez-le-feu et l’Accord du Vendredi saint de 1998 mettent en place un gouvernement de partage du pouvoir."
"Writers date the start differently, to the founding of the loyalist Ulster Volunteer Force in 1966, the Derry march of October 1968 or the arrival of British troops in August 1969. Violence by small groups opposed to the peace process went on after 1998.": "Les écrivains datent le début différemment, à la fondation de l’Ulster Volontaire Force loyaliste en 1966, la marche Derry d’octobre 1968 ou l’arrivée des troupes britanniques en août 1969. La violence par les petits groupes opposés au processus de paix a continué après 1998."
"The main republican groups were the Provisional IRA and the smaller Irish National Liberation Army (INLA); the main loyalist groups were the Ulster Volunteer Force (UVF) and the Ulster Defence Association (UDA). The security forces were the British Army, the Royal Ulster Constabulary (RUC) and the locally recruited Ulster Defence Regiment.": "Les principaux groupes républicains étaient l’IRA provisoire et la plus petite Armée irlandaise de libération nationale (INLA) ; les principaux groupes loyalistes étaient la Force volontaire d’Ulster (UVF) et l’Association de défense d’Ulster (UDA)."
"The city of Derry is officially named Londonderry; both names are in use, and this story uses the shorter one. Figures for the dead are from the Sutton Index of Deaths (CAIN, Ulster University).": "La ville de Derry est officiellement nommée Londonderry ; les deux noms sont utilisés, et cette histoire utilise la plus courte. Les chiffres pour les morts sont de l’indice Sutton des décès (CAIN, Université Ulster)."
