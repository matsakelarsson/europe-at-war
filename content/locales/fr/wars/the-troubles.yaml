"Civil rights, Bloody Sunday and the 1970s": "Droits civils, Dimanche sanglant et les années 1970"
"October 1968 – August 1979": "octobre 1968 – août 1979"
"Since 1921 Northern Ireland had had its own parliament and government, always led by unionists, and its Catholic minority faced discrimination in housing, jobs and local elections. In the late 1960s a civil rights movement took to the streets. On 5 October 1968 police batoned a banned march in Derry, and in January 1969 loyalists ambushed a student march at Burntollet Bridge. In August 1969, after the “Battle of the Bogside” between Derry nationalists and the police, and riots in Belfast in which Catholic streets were burned, the British government sent in troops. The IRA split, and the new Provisional IRA began a campaign to drive Britain out.": "Depuis 1921, l’Irlande du Nord a son propre parlement et gouvernement, toujours dirigé par des syndicalistes, et sa minorité catholique est victime de discrimination en matière de logement, d’emploi et d’élections locales. À la fin des années 1960, un mouvement de défense des droits civils s’est rendu dans les rues. En août 1969, après la bataille de Bogside entre les nationalistes de Derry et la police, et des émeutes à Belfast dans lesquelles les rues catholiques ont été brûlées, le gouvernement britannique a envoyé des troupes. L’IRA s’est séparée, et la nouvelle IRA provisoire a commencé une campagne pour chasser la Grande-Bretagne."
"Internment without trial, brought in in August 1971, was used almost only against nationalists. On 30 January 1972, Bloody Sunday, paratroopers shot dead 13 unarmed men at a civil rights march in Derry, and another died later. 1972 was the deadliest year, with nearly 500 killed. Britain suspended Stormont and ruled directly from London, and on Bloody Friday, 21 July, the IRA set off some twenty bombs in Belfast, killing nine people.": "L’internement sans procès, introduit en août 1971, n’a été utilisé que contre les nationalistes. Le 30 janvier 1972, Bloody Sunday, les parachutistes ont abattu 13 hommes non armés lors d’une marche des droits civils à Derry, et un autre est décédé plus tard. 1972 a été l’année la plus meurtrière, avec près de 500 morts. La Grande-Bretagne suspendit Stormont et régna directement de Londres, et le vendredi 21 juillet, l’IRA a lancé une vingtaine de bombes à Belfast, tuant neuf personnes."
"A power-sharing government formed under the Sunningdale Agreement collapsed in May 1974 during a loyalist general strike. That month UVF car bombs killed 33 people in Dublin and Monaghan, the deadliest attack of the Troubles, and in November IRA bombs killed 21 people in two Birmingham pubs. Sectarian murders by both sides went on through the decade. On 27 August 1979 the IRA killed Lord Mountbatten and three others in County Sligo and 18 soldiers at Warrenpoint.": "Un gouvernement de partage du pouvoir formé dans le cadre de l’accord de Sunningdale s’est effondré en mai 1974 lors d’une grève générale loyaliste. Ce mois-là, les bombes UVF ont tué 33 personnes à Dublin et Monaghan, l’attaque la plus meurtrière des Troubles, et en novembre, les bombes IRA ont tué 21 personnes dans deux pubs de Birmingham. Le 27 août 1979, l’IRA a tué Lord Mountbatten et trois autres dans le comté de Sligo et 18 soldats à Warrenpoint."
