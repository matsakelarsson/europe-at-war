"Hunger strikes, ceasefires and the Good Friday Agreement": "Grèves de la faim, cessez-le-feu et accord du vendredi saint"
"1981 – 1998": "1981 – 1998"
"In 1976 Britain stopped treating paramilitary prisoners as a special category, and republicans in the Maze prison protested for years, then went on hunger strike. In 1981 ten men, seven from the IRA and three from the INLA, starved to death. The first, Bobby Sands, was elected to Parliament weeks before he died in May, and some 100,000 people went to his funeral. Sinn Féin, the IRA’s political wing, began to stand in elections. The IRA bombed the Brighton hotel where Margaret Thatcher’s government was staying in 1984 and killed eleven people at a Remembrance Day ceremony in Enniskillen in 1987.": "En 1976, la Grande-Bretagne a cessé de traiter les prisonniers paramilitaires comme une catégorie spéciale et les républicains de la prison de Maze ont protesté pendant des années, puis ont fait grève de la faim.En 1981, dix hommes, sept de l’IRA et trois de l’INLA, affamés à mort. Le premier, Bobby Sands, a été élu au Parlement semaines avant sa mort en mai, et quelque 100 000 personnes sont allées à ses funérailles. Sinn Féin, l’aile politique de l’IRA, a commencé à se présenter aux élections. L’IRA a bombardé l’hôtel Brighton où le gouvernement Margaret Thatcher est resté en 1984 et tué onze personnes lors d’une cérémonie du jour du Souvenir à Enniskillen en 1987."
"The Anglo-Irish Agreement of 1985 gave the Irish government a say in Northern Ireland, to the fury of unionists. Secret talks, the Downing Street Declaration of December 1993 and American mediation opened a peace process. The IRA declared a ceasefire on 31 August 1994 and the main loyalist groups in October. The IRA broke it with a bomb in London’s Docklands in February 1996, then restored it in July 1997.": "L’accord anglo-irlandais de 1985 a donné au gouvernement irlandais son mot d’ordre en Irlande du Nord, à la fureur des syndicalistes. Des pourparlers secrets, la déclaration de Downing Street de décembre 1993 et la médiation américaine ont ouvert un processus de paix. L’IRA a déclaré un cessez-le-feu le 31 août 1994 et les principaux groupes loyalistes en octobre."
"Talks chaired by the American senator George Mitchell produced the Good Friday Agreement of 10 April 1998, which set up a power-sharing government and cross-border bodies, released paramilitary prisoners and laid down that Northern Ireland would stay in the United Kingdom until a majority there voted otherwise. Voters approved it on 22 May, by 71 per cent in Northern Ireland and 94 per cent in the Republic. On 15 August a bomb planted by the Real IRA, a breakaway group, killed 29 people in Omagh. In all more than 3,500 had died; republicans killed about 60 per cent of them, loyalists 30 and the security forces 10.": "Les discussions présidées par le sénateur américain George Mitchell ont abouti à l’accord du vendredi saint du 10 avril 1998, qui a mis en place un gouvernement de partage du pouvoir et des organes transfrontaliers, libéré les prisonniers paramilitaires et fixé que l’Irlande du Nord resterait au Royaume-Uni jusqu’à ce qu’une majorité y ait voté autrement. Le 15 août, une bombe posée par l’IRA, un groupe d’évadés, a tué 29 personnes à Omagh. Au total, plus de 3 500 personnes sont mortes ; les républicains en ont tué environ 60 %, les loyalistes 30 et les forces de sécurité 10."
