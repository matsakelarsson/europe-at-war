"Soldiers of the Parachute Regiment opened fire on a march against internment in the Bogside. The Saville Inquiry found in 2010 that none of the victims had posed a threat, and the British prime minister apologised.": "Les soldats du Parachute Regiment ont ouvert le feu lors d’une marche contre l’internement à Bogside. L’enquête de Saville a révélé en 2010 qu’aucune des victimes n’avait posé de menace, et le premier ministre britannique s’est excusé."
