# French translations of the catalogue text (wave 7); step bodies follow later.
Third Anglo-Afghan War: Troisième guerre anglo-afghane
A short war between Afghanistan and British India in 1919. The new emir, Amanullah Khan, proclaimed Afghanistan fully independent and sent troops across the frontier, where they took the springs at Bagh in the Khyber Pass. The British drove them back, advanced to Dakka, took Spin Boldak and relieved Thal, which Nadir Khan had besieged, and their aircraft bombed Jalalabad and Kabul. Afghanistan asked for an armistice in June. By the Treaty of Rawalpindi Britain gave up control of Afghan foreign policy, and Afghanistan accepted the existing border with India.: Une courte guerre entre l’Afghanistan et l’Inde britannique en 1919. Le nouvel émir, Amanullah Khan, proclama la pleine indépendance de l’Afghanistan et envoya des troupes de l’autre côté de la frontière, où elles prirent les sources de Bagh, dans la passe de Khyber. Les Britanniques les repoussèrent, avancèrent jusqu’à Dakka, prirent Spin Boldak et dégagèrent Thal, qu’assiégeait Nadir Khan, et leurs avions bombardèrent Jalalabad et Kaboul. L’Afghanistan demanda un armistice en juin. Par le traité de Rawalpindi, la Grande-Bretagne renonça au contrôle de la politique étrangère afghane, et l’Afghanistan accepta la frontière existante avec l’Inde.
