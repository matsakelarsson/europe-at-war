# French translations of the catalogue text (wave 13); step bodies follow later.
Third Anglo-Ashanti War: Troisième guerre anglo-ashanti
? The war in which Britain broke the power of the Asante Empire over the Gold Coast, now Ghana. When the Netherlands sold its Gold Coast forts to Britain in 1872, Asante lost Elmina, the port through which it had traded with the Dutch and which it regarded as its own. In 1873 Asante armies under Amankwatia crossed the Pra river, overran the lands of the Fante and their neighbours under British protection and threatened the forts on the coast. Britain sent Major-General Sir Garnet Wolseley, who held the coast through the autumn while disease drove the Asante back across the Pra, and then, with three British battalions, West Indian and African troops and thousands of carriers, built a road through the forest and marched on Kumasi. After hard fighting at Amoaful on 31 January 1874 and at Odaso on 4 February, the British entered Kumasi, abandoned by the Asantehene Kofi Karikari, and on 6 February blew up the palace and burned the city. By the Treaty of Fomena Asante promised a huge indemnity in gold and gave up its claims south of the Pra. Britain proclaimed the Gold Coast Colony in July 1874, and Asante, its authority shaken, lost much of its empire over the following years.
: La guerre par laquelle la Grande-Bretagne brisa la domination de l’empire ashanti sur la Côte-de-l’Or, l’actuel Ghana. Lorsque les Pays-Bas vendirent leurs forts de la Côte-de-l’Or à la Grande-Bretagne en 1872, l’Ashanti perdit Elmina, le port par lequel il commerçait avec les Néerlandais et qu’il considérait comme le sien. En 1873, des armées ashanti commandées par Amankwatia franchirent le Pra, envahirent les terres des Fanti et de leurs voisins placés sous protection britannique et menacèrent les forts de la côte. La Grande-Bretagne envoya le major-général sir Garnet Wolseley, qui tint la côte pendant l’automne tandis que la maladie repoussait les Ashanti au-delà du Pra, puis, avec trois bataillons britanniques, des troupes antillaises et africaines et des milliers de porteurs, construisit une route à travers la forêt et marcha sur Kumasi. Après de durs combats à Amoaful le 31 janvier 1874 et à Odaso le 4 février, les Britanniques entrèrent dans Kumasi, abandonnée par l’Asantehene Kofi Karikari, et, le 6 février, firent sauter le palais et incendièrent la ville. Par le traité de Fomena, l’Ashanti promit une énorme indemnité en or et renonça à ses prétentions au sud du Pra. La Grande-Bretagne proclama la colonie de la Côte-de-l’Or en juillet 1874, et l’Ashanti, dont l’autorité était ébranlée, perdit une grande partie de son empire dans les années qui suivirent.
