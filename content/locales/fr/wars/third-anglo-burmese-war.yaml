# French translations of the catalogue text (wave 11); step bodies follow later.
Third Anglo-Burmese War: Troisième guerre anglo-birmane
? The British conquest of the Konbaung kingdom of Upper Burma, and the long resistance that followed. Relations between British India and King Thibaw’s court at Mandalay had been poor since his accession in 1878, and the British feared the court’s dealings with France, which was then conquering Tonkin. In 1885 the Burmese council of ministers (Hluttaw) fined the Bombay Burmah Trading Corporation, a British teak firm, for under-reporting the timber it took from the Toungoo forests and underpaying its workers. The Viceroy, Lord Dufferin, answered with an ultimatum on 22 October 1885 that would have put Burma’s foreign relations under British control. When the court refused, a flotilla of steamers under Major-General Harry Prendergast carried about 9,000 British and Indian troops up the Irrawaddy, took the forts at Minhla on 17 November and reached Mandalay on 28 November. Thibaw surrendered and was exiled to Ratnagiri in India, where he died in 1916, and on 1 January 1886 Upper Burma was annexed to British India. Princes, former officials, soldiers of the disbanded army, monks and village leaders then fought the occupation for about ten years. British reports called them “dacoits”, armed robbers; Burmese histories call it a resistance movement. The British needed tens of thousands of soldiers and military police, collective punishments of villages and the resettlement of villagers to end it, and they extended their rule over the Shan states and the Chin and Kachin hills.
: La conquête britannique du royaume Konbaung de Haute-Birmanie, et la longue résistance qui suivit. Les relations entre l’Inde britannique et la cour du roi Thibaw à Mandalay étaient mauvaises depuis son avènement en 1878, et les Britanniques redoutaient les tractations de la cour avec la France, qui conquérait alors le Tonkin. En 1885, le conseil des ministres birman (Hluttaw) infligea une amende à la Bombay Burmah Trading Corporation, une compagnie britannique d’exploitation du teck, pour avoir sous-déclaré le bois qu’elle tirait des forêts de Toungoo et sous-payé ses ouvriers. Le vice-roi, Lord Dufferin, répondit le 22 octobre 1885 par un ultimatum qui aurait placé les relations extérieures de la Birmanie sous contrôle britannique. La cour ayant refusé, une flottille de vapeurs commandée par le major-général Harry Prendergast transporta environ 9 000 soldats britanniques et indiens en remontant l’Irrawaddy, prit les forts de Minhla le 17 novembre et atteignit Mandalay le 28 novembre. Thibaw se rendit et fut exilé à Ratnagiri, en Inde, où il mourut en 1916, et le 1er janvier 1886 la Haute-Birmanie fut annexée à l’Inde britannique. Des princes, d’anciens fonctionnaires, des soldats de l’armée dissoute, des moines et des chefs de village combattirent alors l’occupation pendant une dizaine d’années. Les rapports britanniques les qualifiaient de « dacoïts », des brigands armés ; l’historiographie birmane parle d’un mouvement de résistance. Il fallut aux Britanniques des dizaines de milliers de soldats et de policiers militaires, des punitions collectives infligées aux villages et la réinstallation des villageois pour en venir à bout, et ils étendirent leur domination aux États shans et aux collines chin et kachin.
