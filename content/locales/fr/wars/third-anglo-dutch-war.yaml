# Some French text was translated automatically.
"Third Anglo-Dutch War": "Troisième guerre anglo-néerlandaise"
"England’s part in Louis XIV’s attack on the Dutch Republic, agreed in the secret Treaty of Dover of 1670 in return for French subsidies. An English attack on the Dutch Smyrna convoy in March 1672 opened the war. On 7 June 1672 Michiel de Ruyter surprised the Anglo-French fleet at Solebay off the Suffolk coast, and in 1673 his smaller fleet fought the allies to a standstill in two battles at the Schooneveld off Zeeland and at the Texel (Kijkduin) on 21 August, preventing a landing in Holland; a Dutch squadron also briefly retook New York. The war was unpopular and expensive in England, where suspicion of Catholic influence at court grew. By the Treaty of Westminster of 19 February 1674 the Dutch handed New York back to England and agreed to pay an indemnity, and England left the war, which went on as the Franco-Dutch War.": "L’Angleterre participe à l’attaque de Louis XIV contre la République néerlandaise, convenue dans le traité secret de Douvres de 1670 en échange de subventions françaises. Une attaque anglaise sur le convoi néerlandais Smyrne en mars 1672 a ouvert la guerre. Le 7 juin 1672, Michiel de Ruyter surprit la flotte anglo-française à Solebay au large de la côte de Suffolk et, en 1673, sa petite flotte combattit les alliés pour s’arrêter dans deux batailles au Schooneveld au large de Zeeland et au Texel (Kijkduin) le 21 août, empêchant un débarquement en Hollande ; un escadron néerlandais reprit brièvement New York. La guerre était impopulaire et coûteuse en Angleterre, où les soupçons d’influence catholique à la cour se développèrent. Par le traité de Westminster du 19 février 1674, les Hollandais livrèrent New York à l’Angleterre et acceptèrent de payer une indemnité, et l’Angleterre quitta la guerre, qui continua comme la guerre franco-néerlandaise."
"Dates are New Style (Gregorian), as used in the Dutch Republic; English Old Style dates were ten days earlier.": "Les dates sont New Style (Gregorian), tel qu’utilisé en République Néerlandaise ; les dates de l’ancien style anglais étaient dix jours plus tôt."
