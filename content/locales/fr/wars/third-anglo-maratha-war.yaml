# French translations of the catalogue text (wave 8); step bodies follow later.
Third Anglo-Maratha War: Troisième guerre anglo-marathe
The last war between the British East India Company and the Maratha powers, also called the Pindari War. In 1817 the Governor-General, Lord Hastings, gathered some 120,000 men to destroy the Pindaris, the mounted raiders of central India, and forced Scindia and Amir Khan to join him. The Peshwa Baji Rao II, the Bhonsle ruler of Nagpur and Holkar’s army rose against the Company and were beaten at Khadki, Sitabuldi and Mahidpur, and a small Company force held off the Peshwa’s army at Koregaon. Baji Rao surrendered in June 1818 and was pensioned off to Bithur; his lands were annexed, the Raja of Satara was given a small state, Nagpur and Holkar lost territory, and the Pindari bands were broken up. Asirgarh, the last fortress to hold out, fell in April 1819. The Company was now the paramount power in India south of the Sutlej.: La dernière guerre entre la Compagnie britannique des Indes orientales et les puissances marathes, appelée aussi guerre des Pindaris. En 1817, le gouverneur général, Lord Hastings, rassembla quelque 120 000 hommes pour anéantir les Pindaris, les cavaliers pillards de l’Inde centrale, et contraignit Scindia et Amir Khan à se joindre à lui. Le peshwa Baji Rao II, le souverain bhonsle de Nagpur et l’armée de Holkar se soulevèrent contre la Compagnie et furent battus à Khadki, à Sitabuldi et à Mahidpur, et une petite force de la Compagnie tint tête à l’armée du peshwa à Koregaon. Baji Rao se rendit en juin 1818 et fut relégué à Bithur avec une pension ; ses terres furent annexées, le raja de Satara reçut un petit État, Nagpur et Holkar perdirent des territoires, et les bandes de Pindaris furent dispersées. Asirgarh, la dernière forteresse à résister, tomba en avril 1819. La Compagnie était désormais la puissance prépondérante en Inde au sud de la Sutlej.
