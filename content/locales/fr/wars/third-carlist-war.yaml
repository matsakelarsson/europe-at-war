# Some French text was translated automatically.
"Third Carlist War": "Troisième guerre carliste"
"The last Carlist War, fought by the supporters of the claimant Carlos VII against the governments of King Amadeo I, the First Spanish Republic and finally Alfonso XII. Strongest again in Navarre and the Basque provinces, where they set up a state with its capital at Estella, and in Catalonia and the Maestrazgo, the Carlists besieged Bilbao in 1874 without taking it. After the Bourbon restoration of December 1874 brought the army behind Alfonso XII, government forces took La Seu d’Urgell in 1875 and Estella in February 1876, and on 28 February Carlos VII crossed into France. The Basque fueros were abolished that July.": "La dernière guerre carliste, combattue par les partisans du demandeur Carlos VII contre les gouvernements du roi Amadeo Ier, la première République espagnole et finalement Alfonso XII. Plus fort encore en Navarre et dans les provinces basques, où ils ont établi un État avec sa capitale à Estella, et en Catalogne et le Maestrazgo, les carlistes assiégèrent Bilbao en 1874 sans l’emporter. Après la restauration du Bourbon en décembre 1874, les forces gouvernementales prennent La Seu d’Urgell en 1875 et Estella en février 1876 et le 28 février Carlos VII entre en France. Les fueros basques sont abolis en juillet."
"Estimates of the casualties vary widely, from about 7,000 to 50,000. The siege of Bilbao, from February to May 1874, included a heavy bombardment of the city; it was lifted on 2 May, and in June General Manuel Gutiérrez de la Concha was killed leading an attack on the Carlist lines near Estella.": "Le siège de Bilbao, de février à mai 1874, comprenait un bombardement lourd de la ville ; il a été levé le 2 mai et, en juin, le général Manuel Gutiérrez de la Concha a été tué en menant une attaque contre les lignes carlistes près d’Estella."
