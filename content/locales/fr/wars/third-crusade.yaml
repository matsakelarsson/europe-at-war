"Richard I of England and Philip II set out together from Vézelay on 4 July 1190 and wintered in Sicily, where Richard sacked Messina in a quarrel with King Tancred. In April 1191, on the way to Acre, part of Richard’s fleet was wrecked off Cyprus, which had been ruled since 1184 by Isaac Komnenos, a rebel member of the Byzantine imperial family, and Isaac seized the survivors and their goods. Richard landed at Limassol on 6 May, married Berengaria of Navarre there on 12 May and conquered the island in a month. Isaac surrendered at the end of May.": "Richard Ier d’Angleterre et Philippe II partirent ensemble de Vézelay le 4 juillet 1190 et hivernèrent en Sicile, où Richard lança Messine dans une querelle avec le roi Tancred. En avril 1191, sur le chemin d’Acre, une partie de la flotte de Richard , fut détruite au large de Chypre, qui avait été gouvernée depuis 1184 par Isaac Komnenos, un membre rebelle de la famille impériale byzantine, et Isaac saisit les survivants et leurs biens. Richard débarqua à Limassol le 6 mai, y épousa Berengaria de Navarre le 12 mai et conquit l’île en un mois. Isaac se rendit fin mai."
"Richard reached Acre on 8 June 1191. With the two kings’ siege engines battering the walls and the town starving, the garrison surrendered on 12 July, against Saladin’s wishes, promising a ransom, the release of Christian prisoners and the return of the True Cross. Guy was confirmed as king for life, with Conrad as his heir. Philip, ill and at odds with Richard, sailed home at the end of July. When the ransom was delayed, Richard had about 2,700 Muslim prisoners killed outside the town on 20 August.": "Richard atteignit Acre le 8 juin 1191. Avec les deux rois des moteurs de siège frappant les murs et la ville affamée, la garnison se rendit le 12 juillet, contre les souhaits de Saladin, promettant une rançon, la libération des prisonniers chrétiens et le retour de la vraie Croix. Guy fut confirmé comme roi à vie, avec Conrad comme son héritier. Philippe, malade et en désaccord avec Richard, s’embarqua chez lui à la fin du mois de juillet. Lorsque la rançon a été retardée, Richard a eu environ 2 700 prisonniers musulmans tués à l’extérieur de la ville le 20 août."
