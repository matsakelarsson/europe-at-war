"By the 1180s Saladin, sultan of Egypt and of Damascus and Aleppo, surrounded the Kingdom of Jerusalem, which was bitterly divided. In 1186 Queen Sibyl, sister of the leper king Baldwin IV, had her husband Guy of Lusignan crowned, against the wishes of the barons led by Raymond III of Tripoli, who made a separate truce with Saladin. When Raynald of Châtillon, lord of Kerak, broke the general truce by seizing a caravan, Saladin prepared for holy war. On 1 May 1187 his scouts destroyed a small force of Templars and Hospitallers at the Springs of Cresson near Nazareth.": "Dès les années 1180, Saladin, sultan d’Égypte et de Damas et Alep, entourait le royaume de Jérusalem, qui était amèrement divisé. En 1186, la reine Sibyl, sœur du roi lépreux Baldwin IV, fit couronner son mari Guy de Lusignan, contre la volonté des barons dirigés par Raymond III de Tripoli, qui firent une trêve séparée avec Saladin. Lorsque Raynald de Châtillon, seigneur de Kerak, rompit la trêve générale en s’emparant d’une caravane, Saladin se prépara à la guerre sainte. Le 1er mai 1187, ses éclaireurs détruisirent une petite force de Templiers et d’Hospitaliers aux sources de Cresson près de Nazareth."
"At the end of June Saladin crossed the Jordan with perhaps 30,000 men, and on 2 July he took the town of Tiberias, where Raymond’s wife still held the citadel. Against Raymond’s advice, Guy led the kingdom’s whole army, some 20,000 men with about 1,200 knights, from the springs of Sephoria across a dry plateau. Harassed by archers and tormented by thirst and the smoke of grass fires, it was surrounded near the Horns of Hattin and destroyed on 4 July. Guy was captured with the relic of the True Cross. Saladin killed Raynald with his own hand and had some 200 Templars and Hospitallers executed.": "À la fin de Juin Saladin a traversé la Jordanie avec peut-être 30 000 hommes, et le 2 Juillet il a pris la ville de Tibériade, où Raymond , femme toujours tenu la citadelle. Contre les conseils de Raymond , Guy a dirigé l’armée du royaume, quelque 20 000 hommes avec environ 1200 chevaliers, des sources de Sephoria à travers un plateau sec. Harcelé par les archers et tourmenté par la soif et la fumée des feux d’herbe, il fut encerclé près des cornes de Hattin et détruit le 4 juillet. Guy fut capturé avec la relique de la Vraie Croix. Saladin tua Raynald de sa propre main et fit exécuter quelque 200 Templiers et Hospitaliers."
