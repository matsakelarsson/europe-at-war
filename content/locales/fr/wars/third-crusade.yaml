"Released by Saladin on a promise not to fight him again, Guy of Lusignan was refused entry to Tyre by Conrad, who now claimed the kingdom himself. In August 1189 Guy marched south with a few thousand men and on 28 August began a siege of Acre, camping on a hill outside the walls. Saladin came up and surrounded the besiegers, who were thus besieged in their turn. The crusaders dug ditches facing both ways, and as ships brought more men from the West, the siege grew into a long war of attrition.": "Libéré par Saladin sur une promesse de ne pas le combattre à nouveau, Guy de Lusignan a été refusé l’entrée à Tyr par Conrad, qui maintenant revendiquait le royaume lui-même. En août 1189 Guy marcha vers le sud avec quelques milliers d’hommes et le 28 août commença un siège d’Acre, campant sur une colline en dehors des murs. Les croisés creusèrent des fossés face aux deux voies, et comme les navires apportèrent plus d’hommes de l’Ouest, le siège devint une longue guerre d’attrition."
"On 4 October 1189 the Franks attacked Saladin’s camp and were thrown back with heavy losses; the Templar master Gerard of Ridefort was killed. Fleets from Pisa, Denmark, Frisia, England and France kept the camp supplied, while Egyptian ships fought their way into the harbour. Henry of Champagne arrived in July 1190 with French troops. Disease and hunger killed thousands in the camp, among them, in 1190, Queen Sibyl and her daughters; Conrad then married her half-sister Isabella and claimed the throne. Philip II of France landed on 20 April 1191.": "Le 4 octobre 1189, les Francs attaquèrent le camp de Saladin et furent repoussés avec de lourdes pertes ; le maître templier Gerard de Ridefort fut tué. Des flottes de Pise, Danemark, Frisia, Angleterre et France gardèrent le camp à disposition, tandis que des navires égyptiens se battaient pour entrer dans le port. Henry de Champagne arriva en juillet 1190 avec des troupes françaises. La maladie et la faim tuèrent des milliers de personnes dans le camp, dont en 1190 la reine Sibyl et ses filles ; Conrad épousa ensuite sa demi-sœur Isabella et revendiqua le trône. Philippe II de France débarqua le 20 avril 1191."
