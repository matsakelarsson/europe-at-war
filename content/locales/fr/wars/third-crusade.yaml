"Messina": "Messine"
"October 1190": "octobre 1190"
"Richard’s troops stormed the city after quarrels with its people. Tancred of Sicily bought peace and paid the dowry of Richard’s sister Joan.": "Les troupes de Richard ont envahi la ville après des querelles avec son peuple. Tancred de Sicile a acheté la paix et payé la dot de Richards soeur Joan."
"Limassol": "Limassol"
"6 May 1191": "6 mai 1191"
"Richard landed under fire and took the town. Berengaria was married and crowned queen of England in its chapel six days later.": "Richard débarqua sous le feu et prit la ville. Berengaria fut mariée et couronnée reine d’Angleterre dans sa chapelle six jours plus tard."
"Cape Andreas": "Cap Andreas"
"late May 1191": "fin mai 1191"
"Isaac Komnenos surrendered here, at the tip of the Karpas peninsula. He was said to have asked not to be put in irons, so Richard had him bound in silver chains.": "Isaac Komnenos s’est rendu ici, à la pointe de la péninsule de Karpas. On dit qu’il a demandé de ne pas être mis dans les fers, alors Richard l’a lié dans des chaînes d’argent."
"The kings’ banners were raised over the town. The banner of Leopold V of Austria was thrown down, an insult he avenged by imprisoning Richard in 1192.": "La bannière de Léopold V d’Autriche a été renversée, une insulte qu’il a vengée en emprisonnant Richard en 1192."
"Richard I": "Richard I"
"Conquered by Richard I, May 1191": "Conquis par Richard Ier, mai 1191"
"Crusaders": "Croisés"
"Arsuf": "Arsuf"
"August 1191 – July 1192": "août 1191 – juillet 1192"
"On 22 August 1191 Richard led the army south from Acre along the coast towards Jaffa, the port nearest Jerusalem, with the fleet keeping pace offshore. Marching in close order, with infantry and crossbowmen shielding the knights and the baggage on the seaward side, the crusaders bore daily attacks by Saladin’s horse archers. On 7 September, on the plain north of Arsuf, Saladin threw his whole army at them. The Hospitallers in the rear charged before Richard gave the signal, and Richard sent in the rest of the knights. Saladin’s army was driven from the field, though not destroyed.": "Le 22 août 1191, Richard conduisit l’armée au sud d’Acre le long de la côte vers Jaffa, le port le plus proche de Jérusalem, avec la flotte qui suit son rythme au large. Marchant en ordre étroit, l’infanterie et les arbalètes protégeant les chevaliers et les bagages du côté marin, les croisés firent des attaques quotidiennes par les archers de cheval de Saladin. Le 7 septembre, dans la plaine au nord d’Arsuf, Saladin jeta toute son armée sur eux. Les Hospitaliers à l’arrière chargés avant que Richard ne donne le signal, et Richard envoya le reste des chevaliers."
"Richard occupied Jaffa on 10 September, while Saladin had the walls of Ascalon pulled down so the crusaders could not use them. Twice, in January and in June 1192, the crusaders came within a day’s march of Jerusalem at Beit Nuba, and twice turned back, since even if they took the city they could not hold it once the crusaders went home. In April 1192 the barons chose Conrad as king, but on 28 April he was murdered in Tyre by two Assassins. Henry of Champagne married the widowed Isabella and ruled in his place, and Guy was compensated with Cyprus.": "Richard occupa Jaffa le 10 septembre, tandis que Saladin fit descendre les murs d’Ascalon de sorte que les croisés ne purent les utiliser. Deux fois, en janvier et en juin 1192, les croisés arrivèrent dans un jour de marche de Jérusalem à Beit Nuba, et se retournèrent deux fois, car même s’ils prenaient la ville, ils ne pouvaient pas la tenir une fois les croisés rentrés chez eux. En avril 1192, les barons choisissent Conrad comme roi, mais le 28 avril il est assassiné à Tyr par deux Assassins. Henry de Champagne épouse la veuve Isabella et règne à sa place, et Guy est indemnisé avec Chypre."
"Battle of Arsuf": "Bataille d’Arsuf"
"7 September 1191, crusader victory": "7 septembre 1191, victoire de croisé"
"Advances on Jerusalem": "Progrès réalisés à Jérusalem"
"January and June 1192, turned back at Beit Nuba": "Janvier et Juin 1192, tourné en arrière à Beit Nuba"
"Conrad of Montferrat murdered": "Conrad de Montferrat assassiné"
"28 April 1192": "28 avril 1192"
"7 September 1191": "7 septembre 1191"
"The only great pitched battle between Richard and Saladin. The crusaders’ charge broke the Ayyubid army, which rallied in the woods inland.": "La seule grande bataille entre Richard et Saladin. La charge des croisés brisa l’armée ayyoubide, qui se rassembla dans les bois intérieurs."
"Jaffa": "Jaffa"
"10 September 1191": "10 septembre 1191"
"The crusaders found the town’s walls destroyed and spent weeks rebuilding them.": "Les croisés ont trouvé les murs de la ville détruits et ont passé des semaines à les reconstruire."
"Beit Nuba": "Beit Nuba"
"January and June 1192": "Janvier et juin 1192"
"The furthest point of Richard’s two advances on Jerusalem. From the hills nearby, tradition says, he refused to look at the city he could not take.": "Le point le plus éloigné de Richards deux avance sur Jérusalem. Du côté des collines, dit la tradition, il a refusé de regarder la ville qu’il ne pouvait pas prendre."
"September 1191": "septembre 1191"
"Saladin had the town’s walls demolished rather than let the crusaders use it as a base. Richard rebuilt them in 1192.": "Saladin fit démolir les murs de la ville plutôt que de laisser les croisés s’en servir comme base. Richard les rebâtit en 1192."
"Conrad of Montferrat was stabbed in the street by two members of the Nizari Isma‘ili sect known as the Assassins, days after his election as king.": "Conrad de Montferrat a été poignardé dans la rue par deux membres de la secte Nizari Isma'ili connue sous le nom d’Assassins, quelques jours après son élection comme roi."
"Jaffa and the Treaty of Jaffa": "Jaffa et le traité de Jaffa"
"July–October 1192": "juillet–octobre 1192"
"While Richard was at Acre preparing to sail home, Saladin attacked Jaffa on 27 July 1192, broke into the town after three days and was about to take the citadel. Richard hurried south by sea with a few galleys, waded ashore and drove the Ayyubid troops out. A few days later, in early August, Saladin attacked Richard’s small camp outside the walls. Richard had about 2,000 men, mostly Italian crossbowmen and spearmen, and only some fifty knights. The spearmen knelt behind their shields with the crossbowmen between them, beat off repeated cavalry charges, and Richard fought in the front line.": "Alors que Richard se préparait à rentrer chez lui à Acre, Saladin attaqua Jaffa le 27 juillet 1192, s’enfuit dans la ville après trois jours et était sur le point de prendre la citadelle. Richard avait environ 2 000 hommes, principalement des arbalètes et des lanceurs italiens, et seulement une cinquantaine de chevaliers. Les lanceurs s’agenouillaient derrière leurs boucliers avec les arbalètes entre eux, battaient les charges répétées de cavalerie, et Richard combattait en première ligne."
"Both sides were exhausted, Richard was ill, and news from home urged him back. On 2 September 1192 he and Saladin agreed the Treaty of Jaffa, a truce of three years and eight months. The Franks kept the coast from Tyre to Jaffa; Ascalon was to be demolished and returned to Saladin; and Christian pilgrims could visit Jerusalem freely. Richard sailed on 9 October and was captured on his way home by Leopold of Austria, whom he had insulted at Acre. Saladin died in Damascus on 4 March 1193. The kingdom, now ruled from Acre, lasted another century.": "Les deux camps étaient épuisés, Richard était malade et les nouvelles de chez lui l’exhortaient à revenir. Le 2 septembre 1192, lui et Saladin acceptèrent le traité de Jaffa, une trêve de trois ans et huit mois. Les Francs gardèrent la côte de Tyr à Jaffa ; Ascalon devait être démoli et retourné à Saladin ; et les pèlerins chrétiens pouvaient visiter Jérusalem librement. Richard navigua le 9 octobre et fut capturé sur son chemin par Léopold d’Autriche, qu’il avait insulté à Acre. Saladin mourut à Damas le 4 mars 1193. Le royaume, maintenant gouverné d’Acre, dura un autre siècle."
"Battle of Jaffa": "Bataille de Jaffa"
"early August 1192, crusader victory": "début août 1192, victoire croisée"
"Treaty of Jaffa": "Traité de Jaffa"
"2 September 1192": "2 septembre 1192"
"Truce": "Trêve"
"three years and eight months": "trois ans et huit mois"
"early August 1192": "début août 1192"
"Richard’s small force of spearmen and crossbowmen held off Saladin’s cavalry all day. It was the last battle of the crusade.": "La petite armée de lances et d’arboriers a tenu la cavalerie de Saladin toute la journée. C’était la dernière bataille de la croisade."
"Negotiated through envoys, as Richard and Saladin never met. Muslims and Christians were free to travel through each other’s lands.": "Négocié par des envoyés, comme Richard et Saladin ne se sont jamais rencontrés. Les musulmans et les chrétiens étaient libres de voyager à travers les terres des autres."
"Under the treaty the town, which Richard had refortified, was demolished again and handed back to Saladin.": "Sous le traité, la ville, que Richard avait refortifiée, fut de nouveau démolie et remise à Saladin."
"9 October 1192": "9 octobre 1192"
"Richard sailed from here for Europe. He was imprisoned by Leopold of Austria and the emperor Henry VI until February 1194.": "Richard partit d’ici pour l’Europe. Il fut emprisonné par Léopold d’Autriche et l’empereur Henri VI jusqu’en février 1194."
"Richard, by sea": "Richard, par mer"
