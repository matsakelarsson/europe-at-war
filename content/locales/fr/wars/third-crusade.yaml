"Third Crusade": "Troisième croisade"
"The war that followed Saladin’s destruction of the army of the Kingdom of Jerusalem at Hattin in 1187 and his capture of Jerusalem. Frederick Barbarossa’s German army crossed Anatolia but broke up after he drowned in Cilicia; Philip II of France and Richard I of England, who conquered Cyprus on the way, retook Acre in 1191, and Richard beat Saladin at Arsuf and Jaffa but did not try to take Jerusalem. The Treaty of Jaffa of 1192 left the crusaders a coastal kingdom from Tyre to Jaffa, with access to Jerusalem for Christian pilgrims.": "La guerre qui a suivi la destruction de Saladin de l’armée du Royaume de Jérusalem à Hattin en 1187 et sa prise de Jérusalem. L’armée allemande de Frederick Barbarossa a traversé l’Anatolie mais s’est séparée après sa noyade en Cilicie ; Philippe II de France et Richard Ier d’Angleterre, qui ont conquis Chypre sur le chemin, ont repris Acre en 1191, et Richard a battu Saladin à Arsuf et Jaffa mais n’ont pas essayé de prendre Jérusalem. Le traité de Jaffa de 1192 laissa aux croisés un royaume côtier de Tyr à Jaffa, avec accès à Jérusalem pour les pèlerins chrétiens."
"Dates are Julian. The main sources are the crusader chronicles of Ambroise and the Itinerarium Peregrinorum, the German accounts of Frederick’s expedition, and Saladin’s secretaries Baha al-Din ibn Shaddad and Imad al-Din al-Isfahani, with the later historian Ibn al-Athir. Numbers of soldiers come from these sources and are uncertain.": "Les principales sources sont les chroniques croisés d’Ambroise et de l’Itinerarium Peregrinum, les récits allemands de l’expédition Frederick, et les secrétaires de Saladin, Baha al-Din ibn Shaddad et Imad al-Din al-Isfahani, avec le plus tard historien Ibn al-Athir. Le nombre de soldats provient de ces sources et sont incertains."
"Places have the names usual in histories of the crusades, with modern names where they help, such as Acre (Akko), Ascalon (Ashkelon), Iconium (Konya), the Saleph (Göksu), Philippopolis (Plovdiv) and Adrianople (Edirne).": "Les lieux ont les noms habituels dans l’histoire des croisades, avec des noms modernes où ils aident, comme Acre (Akko), Ascalon (Ashkelon), Iconium (Konya), le Saleph (Göksu), Philippopolis (Plovdiv) et Adrianople (Edirne)."
"Saladin (Salah al-Din Yusuf ibn Ayyub) was a Kurd who had made himself master of Egypt in 1169–1171 and of Muslim Syria after 1174. His dynasty is known as the Ayyubids.": "Saladin (Salah al-Din Yusuf ibn Ayyub) était un Kurde qui s’était fait maître de l’Egypte en 1169-1171 et de la Syrie musulmane après 1174. Sa dynastie est connue comme les Ayyoubides."
