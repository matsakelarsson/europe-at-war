"Frederick Barbarossa, now in his late sixties, left Regensburg on 11 May 1189 with the best-organised of the crusading armies, perhaps 12,000–20,000 men, several thousand of them knights. He crossed Hungary in peace and was welcomed at Niš by Stefan Nemanja of Serbia, who offered to become his vassal. But the Byzantine emperor Isaac II Angelos, who had an understanding with Saladin, imprisoned Frederick’s envoys and harassed his march. Frederick occupied Philippopolis and then Adrianople, where he spent the winter, and threatened to attack Constantinople. In February 1190 Isaac gave way, and in March Byzantine ships carried the army over the Dardanelles.": "Frederick Barbarossa, maintenant à la fin des années soixante, quitta Ratisbonne le 11 mai 1189 avec les armées les mieux organisées, soit entre 12 000 et 20 000 hommes, dont plusieurs milliers de chevaliers. Il traversa la Hongrie en paix et fut accueilli à Niš par Stefan Nemanja de Serbie, qui offrit de devenir son vassal. Mais l’empereur byzantin Isaac II Angelos, qui avait une entente avec Saladin, emprisonnait Frederick et harcelait sa marche. Frédéric occupait Philippopolis puis Adrianople, où il passait l’hiver, et menaçait d’attaquer Constantinople. En février 1190 Isaac céda la place, et en mars les navires byzantins transportèrent l’armée sur les Dardanelles."
"In Anatolia the army was harried by the Turks of the Sultanate of Rum, whose aged sultan Kilij Arslan II had promised safe passage but no longer controlled his sons. Short of food and water, the Germans beat a Turkish army near Philomelion on 7 May and stormed Iconium, the Seljuk capital, on 18 May 1190. They crossed the Taurus into Armenian Cilicia, but on 10 June Frederick drowned in the river Saleph. His army broke up. Many went home, and his son Frederick of Swabia led the rest by way of Antioch to Acre, where he died in January 1191.": "En Anatolie, l’armée était harcelée par les Turcs du Sultanat de Rhum, dont le sultan âgé Kilij Arslan II avait promis un passage sûr mais ne contrôlait plus ses fils. À court de nourriture et d’eau, les Allemands ont battu une armée turque près de Philomelion le 7 mai et pris Iconium, la capitale Seljuk, le 18 mai 1190. Ils traversèrent le Taureau en Cilicie Arménienne, mais le 10 juin Frederick se noya dans la rivière Saleph. Son armée rompit. Beaucoup rentrèrent chez lui, et son fils Frederick de Souabe conduisit le reste par Antioche à Acre, où il mourut en janvier 1191."
