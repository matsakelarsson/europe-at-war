"With its army gone, the kingdom had few defenders left. Acre surrendered on 10 July, and within weeks Saladin and his brother al-Adil had taken Nablus, Jaffa, Sidon, Beirut and, in early September, Ascalon. Tyre was about to give up when Conrad of Montferrat arrived by sea on 14 July and took charge of its defence. Jerusalem, crowded with refugees, was held by Balian of Ibelin. When Saladin’s miners breached the northern wall, Balian negotiated a surrender, and on 2 October 1187 the city passed to Saladin, 88 years after the crusaders had taken it.": "Acre se rendit le 10 juillet, et quelques semaines plus tard, Saladin et son frère al-Adil avaient pris Naplouse, Jaffa, Sidon, Beyrouth et, au début de septembre, Ascalon. Tyr était sur le point d’abandonner lorsque Conrad de Montferrat est arrivé par la mer le 14 juillet et a pris en charge sa défense. Jérusalem, surpeuplée de réfugiés, est détenue par Balian d’Ibelin. Lorsque les mineurs de Saladin explosent le mur du nord, Balian négocie une reddition, et le 2 octobre 1187 la ville passe à Saladin, 88 ans après que les croisés l’aient prise."
"Saladin let the inhabitants buy their freedom. Those who could pay left for Tyre, Tripoli or Egypt, but many thousands of the poor, perhaps 15,000, were sold into slavery. There was no massacre, and Eastern Christians could stay. The Dome of the Rock and the al-Aqsa Mosque were returned to Muslim worship. Saladin failed to take Tyre that winter, released Guy in 1188 and took Kerak and many castles in the north. By 1189 the Franks held little more than Tyre, Tripoli, Antioch and a few fortresses.": "Saladin laissa les habitants acheter leur liberté. Ceux qui pouvaient payer gauche pour Tyr, Tripoli ou l’Egypte, mais beaucoup de milliers de pauvres, peut-être 15 000, furent vendus en esclavage. Il n’y avait pas de massacre, et les chrétiens d’Est pouvait rester. Le Dôme du Rocher et la Mosquée al-Aqsa ont été retournés à culte musulman. En 1189, les Francs tenaient peu plus que Tyr, Tripoli, Antioche et quelques forteresses."
"The news reached Europe in the autumn of 1187. Pope Gregory VIII called a new crusade, and Henry II of England and Philip II of France took the cross in January 1188 and raised a tax, the Saladin tithe, to pay for it. The emperor Frederick Barbarossa took the cross at Mainz in March. When Henry died in July 1189 his son Richard I took his place. The kings’ quarrels delayed them, but fleets from Pisa, Sicily and northern Europe were soon sailing east.": "La nouvelle arriva en Europe à l’automne de 1187. Le pape Grégoire VIII appela une nouvelle croisade, et Henri II d’Angleterre et Philippe II de France prirent la croix en janvier 1188 et soulevèrent une taxe, la dîme Saladin, pour la payer. L’empereur Frederick Barbarossa prit la croix à Mayence en mars. Quand Henry mourut en juillet 1189 son fils Richard Ier prit sa place. Les querelles des rois les retardèrent, mais les flottes de Pise, de Sicile et d’Europe du Nord naviguaient bientôt vers l’est."
