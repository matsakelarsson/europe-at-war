# French translations of the catalogue text (wave 11); step bodies follow later.
Third Javanese War of Succession: Troisième guerre de succession javanaise
? "The war that split the kingdom of Mataram in two, and later three. Prince Mangkubumi, a younger brother of King Pakubuwono II, left the court at Surakarta in 1746 after the Dutch East India Company (VOC) had humiliated him and the king had taken back a fief promised to him, and joined his nephew Raden Mas Said, who had been in revolt since the Chinese War. In December 1749 the dying Pakubuwono II signed over the “sovereignty” of Mataram to the Company, which installed his son as Pakubuwono III, while Mangkubumi’s followers proclaimed him king. Mangkubumi and Raden Mas Said fought the Company and Pakubuwono III across Central Java and destroyed a Company army at the Bogowonto River in 1751, but neither side could win. Mangkubumi fell out with Raden Mas Said and made peace with the Company, and by the Treaty of Giyanti of 13 February 1755 Mataram was divided: Pakubuwono III kept Surakarta and the east, and Mangkubumi became Sultan Hamengkubuwono I of Yogyakarta in the west. Raden Mas Said fought on until the Treaty of Salatiga of 17 March 1757 gave him a principality of his own, Mangkunegaran, as Mangkunegara I. The partition, with the Company as overlord of all three courts, lasted until Indonesian independence."
: "La guerre qui scinda le royaume de Mataram en deux, puis en trois. Le prince Mangkubumi, frère cadet du roi Pakubuwono II, quitta la cour de Surakarta en 1746, après avoir été humilié par la Compagnie néerlandaise des Indes orientales (VOC) et s’être vu reprendre par le roi un fief qui lui avait été promis, et rejoignit son neveu Raden Mas Said, en révolte depuis la guerre des Chinois. En décembre 1749, Pakubuwono II, mourant, céda la « souveraineté » de Mataram à la Compagnie, qui installa son fils sur le trône sous le nom de Pakubuwono III, tandis que les partisans de Mangkubumi le proclamaient roi. Mangkubumi et Raden Mas Said combattirent la Compagnie et Pakubuwono III dans tout le centre de Java et anéantirent une armée de la Compagnie sur la rivière Bogowonto en 1751, mais aucun des deux camps ne parvint à l’emporter. Mangkubumi se brouilla avec Raden Mas Said et fit la paix avec la Compagnie, et le traité de Giyanti du 13 février 1755 partagea Mataram : Pakubuwono III conserva Surakarta et l’est, et Mangkubumi devint le sultan Hamengkubuwono Ier de Yogyakarta, à l’ouest. Raden Mas Said poursuivit la lutte jusqu’à ce que le traité de Salatiga du 17 mars 1757 lui accorde une principauté propre, Mangkunegaran, sous le nom de Mangkunegara Ier. Le partage, qui faisait de la Compagnie la suzeraine des trois cours, dura jusqu’à l’indépendance de l’Indonésie."
