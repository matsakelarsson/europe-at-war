"In February 1538 Pope Paul III, Venice and Charles V formed a Holy League. In September its fleet, under the Genoese admiral Andrea Doria with the Venetians under Vincenzo Capello and the papal galleys under Marco Grimani, found Barbarossa’s smaller fleet sheltering in the Gulf of Arta, near the old battlefield of Actium. Doria would not force the narrow entrance under the guns of Preveza. On 28 September, as the League ships moved off down the coast, Barbarossa came out and attacked. The League lost a number of ships, and Doria withdrew to Corfu with the rest.": "En février 1538, le pape Paul III, Venise et Charles V formèrent une Sainte Ligue. En septembre, sa flotte, sous l’amiral génois Andrea Doria avec les Vénitiens sous Vincenzo Capello et les galères papales sous Marco Grimani, trouva Barbarossa dans la petite flotte abritant dans le golfe d’Arta, près de l’ancien champ de bataille de Actium. Le 28 septembre, alors que les navires de la Ligue s’éloignaient de la côte, Barbarossa sortait et attaquait. La Ligue perdit un certain nombre de navires, et Doria se retira à Corfou avec le reste."
"In October Spanish troops took Castelnuovo at the mouth of the Bay of Kotor, but in the summer of 1539 Barbarossa besieged it by land and sea and killed almost all of its garrison. Venice made a separate peace on 2 October 1540. It gave up Nauplia and Monemvasia, its last towns in the Morea, recognised the loss of the Aegean islands and paid 300,000 ducats. The Ottoman fleet was now the strongest in the eastern Mediterranean.": "En octobre les troupes espagnoles ont pris Castelnuovo à l’embouchure de la baie de Kotor, mais en été 1539 Barbarossa assiégé par terre et par mer et tué presque toute sa garnison. Venise a fait une paix séparée le 2 octobre 1540. Il a donné Nauplia et Monemvasia, ses dernières villes dans la Morea, reconnu la perte des îles Égées et payé 300 000 ducats. La flotte ottomane était maintenant la plus forte de la Méditerranée orientale."
