"Corfu": "Corfou"
"In 1537 Suleiman brought a great army to Valona in Albania, meaning to cross to Italy with Hayreddin Barbarossa’s fleet while his ally Francis I of France attacked Charles V in the north. At the end of July Ottoman troops landed near Otranto and ravaged the country, carrying thousands of people into slavery, but the French attack was slow to come and they were withdrawn. A series of clashes at sea with Venetian galleys gave the sultan a reason to turn on Venice, which had tried to stay neutral.": "En 1537, Suleiman apporta une grande armée à Valona en Albanie, ce qui signifie traverser l’Italie avec la flotte de Hayreddin Barbarossa pendant que son allié François Ier attaquait Charles V dans le nord. Fin juillet, les troupes ottomanes débarquèrent près d’Otranto et ravageèrent le pays, transportant des milliers de personnes en esclavage, mais l’attaque française fut lente à venir et elles furent retirées. Une série d’affrontements en mer avec les galères vénitiennes a donné au sultan une raison de tourner sur Venise, qui avait essayé de rester neutre."
"In late August some 25,000 Ottoman troops landed on Corfu, Venice’s key to the Adriatic. They burned the countryside and carried off many islanders, but the guns of the citadel, rebuilt to withstand artillery, held them off. With rain, disease in the camp and the season ending, Suleiman lifted the siege in mid-September. Barbarossa then swept through the Aegean, sacking Aegina and taking or forcing tribute from the Venetian islands and the Duchy of Naxos.": "Vers la fin du mois d’août, quelque 25 000 soldats ottomans débarquent sur Corfou, Venise, clé de l’Adriatique. Ils brûlent la campagne et emportent de nombreux insulaires, mais les canons de la citadelle, reconstruits pour résister à l’artillerie, les retiennent. Barbarossa a ensuite balayé l’Egée, lançant Aegina et prenant ou forçant hommage des îles vénitiennes et duché de Naxos."
