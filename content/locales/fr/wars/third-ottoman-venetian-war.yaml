"1537": "1537"
"Third Ottoman–Venetian War": "Troisième guerre ottomane-vénétienne"
"A war that began when Suleiman the Magnificent, gathering forces in Albania to invade Italy in concert with France, turned instead on Venetian Corfu. The siege of 1537 failed, but Hayreddin Barbarossa took Venice’s Aegean islands, beat the Holy League fleet of Venice, the pope and Charles V at Preveza in 1538 and retook Castelnuovo in 1539. In the peace of 1540 Venice gave up its last towns in the Morea and paid 300,000 ducats.": "Une guerre qui a commencé lorsque Suleiman le Magnifique, rassemblant des forces en Albanie pour envahir l’Italie en concert avec la France, s’est tournée à la place sur Corfou vénitien. Le siège de 1537 a échoué, mais Hayreddin Barbarossa a pris Venise , îles Égées, battu la flotte de la Ligue Sainte de Venise, le pape et Charles V à Preveza en 1538 et repris Castelnuovo en 1539. Dans la paix de 1540 Venise a abandonné ses dernières villes dans la Morea et payé 300 000 ducats."
"Dates are Julian. The size of the fleets at Preveza differs widely between sources; most give the Holy League well over 100 galleys and many sailing ships, and Barbarossa about 120 galleys and galliots.": "Les dates sont Julian. La taille des flottes de Preveza varie largement entre les sources ; la plupart donnent à la Ligue Sainte bien plus de 100 galères et de nombreux voiliers, et Barbarossa environ 120 galères et galiotes."
"Venetian and imperial writers blamed each other for the defeat at Preveza. Venetians accused Andrea Doria, the Genoese admiral of Charles V, of holding back his ships on purpose, while imperial writers said the Venetians would not follow his orders.": "Les écrivains vénitiens et impériaux s’accusèrent mutuellement de la défaite de Preveza. Les Vénitiens accusèrent Andrea Doria, l’amiral génois de Charles V, de retenir délibérément ses navires, tandis que les écrivains impériaux disaient que les Vénitiens ne suivraient pas ses ordres."
