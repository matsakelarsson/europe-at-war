# French translations of the catalogue text (wave 14); step bodies follow later.
Third Seminole War: Troisième guerre séminole
? The last war between the United States and the Seminoles of Florida, also called the Billy Bowlegs War. After the Second Seminole War some few hundred Seminoles and Miccosukees remained in southern Florida under Holata Micco (Billy Bowlegs) and Abiaka (Sam Jones). As settlement pushed south, Florida and the federal government pressed them to leave, built a chain of forts and sent surveyors into their lands. On 20 December 1855 Bowlegs and some 30 to 40 warriors attacked an army surveying patrol under Lieutenant George Hartsuff near the Big Cypress Swamp, whose men, Seminole accounts say, had destroyed his gardens; four soldiers were killed. In the war that followed, Seminole bands raided farms and posts as far north as Tampa Bay, while regulars and Florida volunteers, using boats to reach the islands of the Everglades and the Big Cypress, burned villages and crops; one of the largest actions was at the Tillis farm near Fort Meade in June 1856. Worn down by hunger and offered cash payments, Bowlegs agreed to emigrate, and in May 1858 he left for Indian Territory with about 165 people; the army declared the war over on 8 May 1858. Abiaka and between about 100 and 300 others never left, and their descendants are the Seminole Tribe of Florida and the Miccosukee Tribe of Indians of Florida, who never signed a peace treaty with the United States.
: La dernière guerre entre les États-Unis et les Séminoles de Floride, appelée aussi guerre de Billy Bowlegs. Après la deuxième guerre séminole, quelques centaines de Séminoles et de Miccosukees étaient restés dans le sud de la Floride, sous la conduite de Holata Micco (Billy Bowlegs) et d’Abiaka (Sam Jones). À mesure que la colonisation progressait vers le sud, la Floride et le gouvernement fédéral les pressèrent de partir, bâtirent une chaîne de forts et envoyèrent des arpenteurs sur leurs terres. Le 20 décembre 1855, Bowlegs et quelque 30 à 40 guerriers attaquèrent une patrouille d’arpentage de l’armée commandée par le lieutenant George Hartsuff près du marais de Big Cypress ; selon les récits séminoles, ses hommes avaient détruit les jardins de Bowlegs. Quatre soldats furent tués. Dans la guerre qui suivit, des bandes séminoles attaquèrent fermes et postes jusqu’à la baie de Tampa au nord, tandis que des réguliers et des volontaires de Floride, se servant de bateaux pour atteindre les îles des Everglades et du Big Cypress, brûlaient villages et récoltes ; l’un des plus importants affrontements eut lieu à la ferme Tillis, près de Fort Meade, en juin 1856. Épuisé par la faim et devant l’offre de paiements en argent, Bowlegs accepta d’émigrer et, en mai 1858, il partit pour le territoire indien avec environ 165 personnes ; l’armée déclara la guerre terminée le 8 mai 1858. Abiaka et entre 100 et 300 autres personnes environ ne partirent jamais, et leurs descendants forment la Seminole Tribe of Florida et la Miccosukee Tribe of Indians of Florida, qui n’ont jamais signé de traité de paix avec les États-Unis.
