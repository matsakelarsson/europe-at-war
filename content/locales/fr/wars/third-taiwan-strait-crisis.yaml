# French translations of the catalogue text (wave 9); step bodies follow later.
Third Taiwan Strait Crisis: Troisième crise du détroit de Taïwan
? A series of Chinese missile tests and military exercises around Taiwan in 1995–1996, meant to warn Taiwan’s president Lee Teng-hui against moves towards independence and to sway Taiwan’s first direct presidential election. After the United States allowed Lee to visit Cornell University, where he had studied, in June 1995, the PLA fired missiles into target zones in the sea north of Taiwan from 21 July and held naval and amphibious exercises in August and November. In March 1996, in the weeks before the election, it fired missiles into zones close to the ports of Keelung and Kaohsiung, disrupting shipping, and held live-fire exercises and landing drills in the strait, the largest at Pingtan from 18 to 25 March. The United States sent two aircraft carrier groups, led by the USS Independence and the USS Nimitz, to the waters near Taiwan, its largest show of force in Asia since the Vietnam War. No one was killed. Lee won the election on 23 March 1996 with 54 per cent of the vote. The crisis led China to build up forces able to keep American carriers away from the strait, and the United States to deepen its military ties with Taiwan.
: Une série d’essais de missiles et d’exercices militaires chinois autour de Taïwan en 1995–1996, destinés à mettre en garde le président taïwanais Lee Teng-hui contre toute avancée vers l’indépendance et à peser sur la première élection présidentielle au suffrage direct de Taïwan. Après que les États-Unis eurent autorisé Lee à se rendre en juin 1995 à l’université Cornell, où il avait étudié, l’APL tira des missiles dans des zones cibles en mer au nord de Taïwan à partir du 21 juillet et mena des exercices navals et amphibies en août et en novembre. En mars 1996, dans les semaines précédant l’élection, elle tira des missiles dans des zones proches des ports de Keelung et de Kaohsiung, perturbant la navigation, et organisa des exercices à tir réel et des manœuvres de débarquement dans le détroit, les plus importants à Pingtan du 18 au 25 mars. Les États-Unis envoyèrent dans les eaux proches de Taïwan deux groupes aéronavals, menés par l’USS Independence et l’USS Nimitz, leur plus grande démonstration de force en Asie depuis la guerre du Viêt Nam. Personne ne fut tué. Lee remporta l’élection le 23 mars 1996 avec 54 % des voix. La crise conduisit la Chine à développer des forces capables de tenir les porte-avions américains à l’écart du détroit, et les États-Unis à resserrer leurs liens militaires avec Taïwan.
