"Talks in 1464 and 1465 failed, but the Order’s position kept slipping. In 1466 the Prince-Bishop of Warmia changed sides, and on 28 September Dunin took Chojnice, the Order’s last major stronghold in the west. With the papal legate Rudolf of Rüdesheim as mediator, peace was signed at Toruń on 19 October 1466. Thirteen years of war, raids and unpaid soldiers had left much of Prussia devastated.": "En 1466, le prince-évêque de Warmia changea de camp et, le 28 septembre, Dunin prit Chojnice, la dernière forteresse majeure de l’Ordre à l’ouest. Avec le pape Rudolf de Rüdesheim comme médiateur, la paix fut signée à Toruń le 19 octobre 1466. Treize ans de guerre, de raids et de soldats non rémunérés ont laissé une grande partie de la Prusse dévastée."
"The Order gave up Gdańsk Pomerania, the Chełmno Land, the lands around Malbork and Elbląg, and the Prince-Bishopric of Warmia. These became Royal Prussia, a province of the Polish crown with its own diet and privileges. The Order kept eastern Prussia, ruled from Königsberg, but as a Polish fief: each Grand Master had to swear allegiance to the king within six months of taking office.": "L’Ordre abandonna la Poméranie de Gdańsk, la Terre de Chełmno, les terres autour de Malbork et d’Elblig, et le Prince-Bishopric de Warmia. Ceux-ci devinrent la Prusse Royale, une province de la couronne polonaise avec son propre régime alimentaire et privilèges. L’Ordre gardait la Prusse orientale, régnant de Königsberg, mais comme un fief polonais : chaque Grand Maître devait jurer allégeance au roi dans les six mois suivant son entrée en fonction."
