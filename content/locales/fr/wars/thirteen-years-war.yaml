"Thirteen Years’ War": "Treize ans de guerre"
"A war between the Teutonic Order and the Prussian Confederation of towns and gentry, allied with Poland under Casimir IV. Fought largely by mercenaries on both sides, it ended with the Second Peace of Thorn in 1466, which gave western Prussia to Poland as Royal Prussia and made the rest of the Order’s state a Polish fief.": "Une guerre entre l’Ordre teutonique et la Confédération prussienne des villes et genterie, alliée à la Pologne sous Casimir IV. Frappée en grande partie par des mercenaires des deux côtés, elle se termina avec la Deuxième Paix de Thorn en 1466, qui donna la Prusse occidentale à la Pologne comme Prusse Royale et fit du reste de l’Ordre un fief polonais."
"Dates are Julian (Old Style), as the sources give them.": "Les dates sont Julian (Ancien Style), comme les sources leur donnent."
"Also called the War of the Cities. Inside Prussia it was largely a civil war, and Lithuania, though ruled by Casimir IV, took almost no part.": "Aussi appelé la guerre des villes. À l’intérieur de la Prusse, il s’agissait en grande partie d’une guerre civile, et la Lituanie, bien que gouvernée par Casimir IV, ne prit presque aucune part."
"Places are given their modern names, with the German names of the time where useful, such as Malbork (Marienburg) and Chojnice (Konitz).": "Des lieux sont donnés leurs noms modernes, avec les noms allemands de l’époque où utile, tels que Malbork (Marienburg) et Chojnice (Konitz)."
