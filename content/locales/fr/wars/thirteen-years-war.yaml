"The Prussian revolt and Chojnice": "La révolte prussienne et Chojnice"
"After Grunwald the Order taxed Prussia heavily and kept a tight grip on its trade, and the towns and gentry wanted the rights their neighbours enjoyed in Poland. In 1440 they formed the Prussian Confederation, led by Gdańsk, Toruń and Elbląg and the knights of the Chełmno Land. When the Emperor banned it in 1453, it turned to Poland. On 4 February 1454 it renounced its allegiance to the Grand Master, and within weeks its forces held almost all of Prussia except Malbork, Sztum and Chojnice. On 6 March King Casimir IV took Prussia into his kingdom.": "Après Grunwald l’Ordre taxa fortement la Prusse et garda une forte emprise sur son commerce, et les villes et le gentry voulaient les droits dont leurs voisins jouissaient en Pologne. En 1440, ils formèrent la Confédération prussienne, dirigée par Gdańsk, Toruń et Elblig et les chevaliers de la Terre de Chełmno. Lorsque l’Empereur l’interdisa en 1453, il se tourna vers la Pologne. Le 4 février 1454, il renonça à son allégeance au Grand Maître et, en quelques semaines, ses forces retiennent presque toutes les Prusses sauf Malbork, Sztum et Chojnice."
"The Order hired mercenaries in Germany and Bohemia, and in September a relief army of about 15,000 under Duke Rudolf of Żagań and Bernard von Zinnenberg marched on Chojnice, which a Polish levy was besieging. On 18 September 1454 the Polish cavalry broke the first Teutonic line, killing Rudolf, but the mercenaries’ wagon fort held and a sally from the town struck the Poles from behind. Casimir had to be led from the field, and some 300 knights were captured. The Poles abandoned the siege of Malbork, and what both sides had expected to be a short war became a long, costly struggle for castles and towns.": "L’Ordre engagea des mercenaires en Allemagne et en Bohême, et en septembre une armée de secours d’environ 15 000 hommes sous le duc Rudolf d’Ugań et Bernard von Zinnenberg marchèrent sur Chojnice, qu’un prélèvement polonais assiégea. Le 18 septembre 1454, la cavalerie polonaise brisa la première ligne teutonique, tuant Rudolf, mais le fort du chariot de mercenaires écoutait et un sally de la ville frappa les Polonais par derrière. Casimir dut être conduit du champ, et quelque 300 chevaliers furent capturés. Les Polonais abandonnèrent le siège de Malbork, et ce que les deux camps attendaient d’être une courte guerre devint une longue lutte coûteuse pour les châteaux et les villes."
