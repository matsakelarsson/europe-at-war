"Unable to pay its mercenaries, the Order pledged them its castles, and in 1455 they took over Malbork. Their Bohemian captain, Ulrich Czerwonka, sold it to the Poles, and on 6 June 1457 Malbork, Tczew and Iława were handed over for 190,000 Hungarian gold pieces, much of it lent by Gdańsk. The Grand Master moved to Königsberg, which became the Order’s capital. Teutonic troops retook the town of Malbork that September with the help of its burghers, but the castle stayed Polish, and the town fell again in 1460.": "Incapable de payer ses mercenaires, l’Ordre leur a promis ses châteaux, et en 1455 ils ont repris Malbork. Leur capitaine bohème, Ulrich Czerwonka, le vendit aux Polonais, et le 6 juin 1457 Malbork, Tczew et Iława furent remis pour 190 000 pièces d’or hongroises, la plupart prêtées par Gdańsk. Le Grand Maître s’installa à Königsberg, qui devint la capitale de l’Ordre. Les troupes teutoniques reprirent la ville de Malbork en septembre avec l’aide de ses bourgeons, mais le château resta polonais, et la ville tomba de nouveau en 1460."
"The war turned once Poland stopped relying on noble levies and paid for a small professional army under Piotr Dunin. On 17 September 1462 Dunin beat the Order’s army at Świecino, west of Gdańsk, where its able commander Fritz Raweneck was killed. On 15 September 1463 ships from Gdańsk and Elbląg destroyed the Order’s fleet on the Vistula Lagoon, and Gniew surrendered on 1 January 1464 after a long siege. From then on the Order, short of money, was mostly on the defensive.": "La guerre tourna une fois que la Pologne cessa de s’appuyer sur de nobles prélèvements et paya pour une petite armée professionnelle sous Piotr Dunin. Le 17 septembre 1462 Dunin battit l’armée de l’Ordre à l’ouest de Gdańsk, où son puissant commandant Fritz Raweneck fut tué. Le 15 septembre 1463, des navires de Gdańsk et d’Elblig détruisirent la flotte de l’Ordre sur la Lagune de Vistule, et Gniew se rendit le 1er janvier 1464 après un long siège."
