# French translations of the catalogue text (wave 10); step bodies follow later.
Thirty-Eight Years’ War: Guerre de Trente-Huit Ans
? "The long series of campaigns in which the Japanese imperial court brought the Emishi of northern Honshu under its rule. It began in 774, when Emishi of the Pacific coast attacked the frontier fort of Monofu, and grew in 780 when Iji no Azamaro, an Emishi chief in the court’s service, killed the provincial inspector and burned Taga, the headquarters of Mutsu. Emperor Kanmu sent ever larger armies north: in 789 the Emishi of Isawa under Aterui routed the army of Ki no Kosami at Sufuse on the Kitakami River, but in 801 Sakanoue no Tamuramaro, the second man to bear the title sei-i taishōgun, conquered the Isawa region. He built Isawa Castle in 802, Aterui and More surrendered and were executed, and Shiwa Castle followed in 803. After a last campaign by Fun’ya no Watamaro in 811 against the villages of Nisatai and Hei, the court declared the fighting over. The name, given by the historian Torao Toshiya in 1975, comes from Watamaro’s report that there had been “thirty-eight years in all” of border warfare since 774."
: "La longue série de campagnes par lesquelles la cour impériale japonaise soumit à son autorité les Emishi du nord de Honshu. Elle commença en 774, quand des Emishi de la côte pacifique attaquèrent le fort frontalier de Monofu, et prit de l’ampleur en 780 lorsque Iji no Azamaro, un chef emishi au service de la cour, tua l’inspecteur provincial et incendia Taga, siège de la province de Mutsu. L’empereur Kanmu envoya vers le nord des armées toujours plus nombreuses : en 789, les Emishi d’Isawa menés par Aterui mirent en déroute l’armée de Ki no Kosami à Sufuse, sur le fleuve Kitakami, mais en 801 Sakanoue no Tamuramaro, le deuxième homme à porter le titre de sei-i taishōgun, conquit la région d’Isawa. Il construisit le château d’Isawa en 802, Aterui et More se rendirent et furent exécutés, et le château de Shiwa suivit en 803. Après une dernière campagne menée par Fun’ya no Watamaro en 811 contre les villages de Nisatai et de Hei, la cour déclara les combats terminés. Le nom, donné par l’historien Torao Toshiya en 1975, vient du rapport de Watamaro selon lequel il y avait eu « trente-huit ans en tout » de guerre frontalière depuis 774."
