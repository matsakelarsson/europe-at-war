"1620–1621": "1620–1621"
"Ferdinand found allies where Frederick found none. In the Treaty of Munich of October 1619 Duke Maximilian of Bavaria put the army of the Catholic League at his disposal in return for his costs and, secretly, Frederick’s electoral title. Lutheran Saxony joined the Emperor for the promise of Lusatia, and Spain sent money and troops. In July 1620 the Protestant Union agreed at Ulm to stay neutral. Maximilian and his general Tilly then occupied Upper Austria, whose estates had joined the rebels, while John George of Saxony took Lusatia and a Spanish army invaded the Rhenish Palatinate.": "Ferdinand trouva des alliés où Frederick n’en trouva pas. Dans le traité de Munich d’octobre 1619, le duc Maximilien de Bavière mit à sa disposition l’armée de la Ligue catholique en échange de ses coûts et, secrètement, le titre électoral de Frédéric. La Saxe luthérienne se joignit à l’Empereur pour la promesse de Lusatia, et l’Espagne envoya de l’argent et des troupes. Maximilian et son général Tilly occupèrent alors la Haute-Autriche, dont les domaines avaient rejoint les rebelles, tandis que John George de Saxe prit Lusatia et une armée espagnole envahit le Palatinat rhénan."
"The League and imperial armies under Tilly and Bucquoy marched into Bohemia, and on 8 November 1620 they attacked the Bohemian army under Christian of Anhalt on the White Mountain outside Prague. Within two hours it was routed, and Frederick fled, mocked ever after as the “Winter King”. On 21 June 1621 twenty-seven leaders of the revolt were executed on Prague’s Old Town Square. The rebels’ estates were confiscated, Bohemia became a hereditary Habsburg kingdom, Protestant worship was banned, and tens of thousands of Protestants went into exile.": "La Ligue et les armées impériales sous Tilly et Bucquoy marchèrent en Bohême, et le 8 novembre 1620, ils attaquèrent l’armée bohémienne sous Christian d’Anhalt sur la Montagne Blanche à l’extérieur de Prague. En deux heures, il fut roué, et Frederick s’enfuit, se moquant toujours comme le Roi d’Hiver. Le 21 juin 1621, vingt-sept dirigeants de la révolte furent exécutés sur la place de la vieille ville de Prague. Les domaines rebelles furent confisqués, la Bohême devint un royaume héréditaire des Habsbourg, le culte protestant fut interdit, et des dizaines de milliers de protestants allèrent en exil."
