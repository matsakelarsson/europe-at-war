"1621–1623": "1621–1623"
"Frederick was placed under the imperial ban in January 1621, and the Protestant Union dissolved itself that spring. Spanish troops already held the Palatinate west of the Rhine, and in the autumn Maximilian’s army took the Upper Palatinate. Frederick’s cause was kept alive by three commanders, Mansfeld, Margrave George Frederick of Baden-Durlach and Christian of Brunswick, the Protestant administrator of Halberstadt. In 1622 Mansfeld beat Tilly at Mingolsheim on 27 April, but Tilly, joined by Spanish troops under Gonzalo de Córdoba, routed Baden-Durlach at Wimpfen on 6 May and caught Christian crossing the Main at Höchst on 20 June.": "Frederick fut placé sous l’interdiction impériale en janvier 1621, et l’Union protestante se dissout ce printemps-là. Les troupes espagnoles tenaient déjà le Palatinat à l’ouest du Rhin, et à l’automne l’armée Maximilienne prit le Palatinat supérieur. La cause de Frederick fut maintenue en vie par trois commandants, Mansfeld, Margrave George Frederick de Baden-Durlach et Christian de Brunswick, l’administrateur protestant de Halberstadt. En 1622, Mansfeld bat Tilly à Mingolsheim le 27 avril, mais Tilly, rejoint par les troupes espagnoles sous Gonzalo de Córdoba, fait route Baden-Durlach à Wimpfen le 6 mai et prend Christian traversant la Main à Höchst le 20 juin."
"Tilly took Heidelberg in September after a two-month siege, and Mannheim in November. Mansfeld and Christian cut their way through a Spanish army at Fleurus and went into Dutch service. On 25 February 1623, at an assembly of princes at Regensburg, Ferdinand transferred Frederick’s electoral title to Maximilian of Bavaria, despite Protestant protests and Spanish misgivings. When Christian marched again that summer, Tilly caught him at Stadtlohn near the Dutch border on 6 August and destroyed his army. The war in the Empire seemed over, and Frederick lived on in exile in The Hague.": "Tilly prit Heidelberg en septembre après un siège de deux mois, et Mannheim en novembre. Mansfeld et Christian s’efforçèrent de traverser une armée espagnole à Fleurus et se rendirent au service des Hollandais. Le 25 février 1623, lors d’une assemblée de princes à Ratisbonne, Ferdinand transféra le titre électoral de Frédéric à Maximilien de Bavière, malgré les protestations protestantes et les doutes espagnols. Quand Christian marcha de nouveau cet été-là, Tilly l’attrape à Stadtlohn près de la frontière néerlandaise le 6 août et détruit son armée. La guerre dans l’Empire semble terminée, et Frederick vit en exil à La Haye."
