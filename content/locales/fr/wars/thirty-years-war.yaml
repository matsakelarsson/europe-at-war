"About 3,000 killed or wounded and 2,500 captured": "Environ 3 000 morts ou blessés et 2 500 capturés"
"League losses": "Pertes de la Ligue"
"About 700 killed or wounded": "Environ 700 morts ou blessés"
"27 August 1626": "27 août 1626"
"Tilly’s veterans broke the Danish-German army at the foot of the Barenberg, twenty miles from Wolfenbüttel. The survivors who took refuge in Lutter castle surrendered the next day.": "Les vétérans de Tilly ont brisé l’armée danoise-allemande au pied du Barenberg, à 20 miles de Wolfenbüttel. Les survivants qui se sont réfugiés dans le château de Lutter se rendirent le lendemain."
"Stade": "Stade"
"Winter 1626–1627": "Hiver 1626–1627"
"Unable to hold Wolfenbüttel, Christian moved his winter quarters north to the lower Elbe.": "Incapable de tenir Wolfenbüttel, Christian déplace ses quartiers d’hiver vers le nord vers l’Elbe inférieur."
"Retreat to Stade": "Retraite au Stade"
"Wallenstein in Jutland": "Wallenstein en Jutland"
"In the summer of 1627 Wallenstein brought his army north and joined Tilly, and the Danish forces were swept out of Lower Saxony. In September the two armies invaded Holstein and then pushed up through Schleswig and the Jutland peninsula as far as the Limfjord, while Christian withdrew to the Danish islands, which his navy kept safe. The occupying troops lived off the land, and Jutland suffered heavy requisitions, looting and violence.": "Au cours de l’été 1627, Wallenstein apporta son armée au nord et rejoignit Tilly, et les forces danoises furent emportées hors de la Basse-Saxe. En septembre, les deux armées envahirent Holstein puis poussèrent à travers le Schleswig et la péninsule du Jutland jusqu’au Limfjord, tandis que Christian se retira dans les îles danoises, que sa marine gardait en sécurité. Les troupes d’occupation vivaient hors des terres, et le Jutland subissait de lourdes réquisitions, pillages et violences."
"The Emperor rewarded Wallenstein with the duchy of Mecklenburg, whose dukes had sided with Christian, and in April 1628 named him “General of the Oceanic and Baltic Seas”. Together with Spain he planned an imperial fleet on the Baltic, to be built in the captured ports of Wismar, Rostock and Greifswald. The prospect of Habsburg power on the Baltic alarmed both Denmark and Sweden, which made an alliance in April 1628.": "L’empereur a récompensé Wallenstein avec le duché de Mecklembourg, dont les ducs avaient pris parti avec Christian, et en avril 1628 il l’a nommé général des mers océaniques et baltes. Avec l’Espagne, il a planifié une flotte impériale sur la Baltique, à construire dans les ports capturés de Wismar, Rostock et Greifswald. La perspective du pouvoir de Habsbourg sur la Baltique a alarmé le Danemark et la Suède, qui ont fait une alliance en avril 1628."
"Invasion of Holstein": "Invasion de Holstein"
"September 1627": "septembre 1627"
"Occupied": "Occupés"
"Holstein, Schleswig and Jutland, 1627–1629": "Holstein, Schleswig et Jutland, 1627–1629"
"Wallenstein": "Wallenstein"
"Duke of Mecklenburg from January 1628": "Duc de Mecklembourg à partir de janvier 1628"
"Glückstadt": "Glückstadt"
"1627–1628": "1627–1628"
"Christian IV’s new fortress town on the Elbe held out, supplied by sea.": "Christian IV est une nouvelle ville forteresse sur l’Elbe tenue, alimentée par la mer."
"Aalborg": "Aalborg"
"Imperial troops reached the Limfjord, and Wallenstein planned to use the port for his fleet. The Danes later raided it from the sea and destroyed the naval works.": "Les troupes impériales atteignirent le Limfjord, et Wallenstein planifia d’utiliser le port pour sa flotte."
"Güstrow": "Güstrow"
"Wallenstein made the castle of the deposed dukes his residence as the new Duke of Mecklenburg.": "Wallenstein fit du château des dukes dépossédés sa résidence en tant que nouveau duc de Mecklembourg."
"Wallenstein and Tilly": "Wallenstein et Tilly"
"Occupied by Imperial and League troops, 1627–1629": "Occupé par les troupes impériales et de la Ligue, 1627–1629"
"Stralsund, Wolgast and the Peace of Lübeck": "Stralsund, Wolgast et la paix de Lübeck"
"1628–1629": "1628–1629"
"The Pomeranian port of Stralsund refused to take an imperial garrison, and in May 1628 imperial troops laid siege to it. Denmark sent help by sea, including 900 Scots of Donald Mackay’s regiment, of whom 500 were killed in the fighting. Swedish troops followed, and in June the town made a twenty-year alliance with Sweden. Wallenstein took command himself but lifted the siege on 4 August, his first serious setback.": "Le port Poméranie de Stralsund refusa de prendre une garnison impériale et, en mai 1628, les troupes impériales y assiégèrent. Le Danemark envoyait de l’aide par la mer, dont 900 Écossais du régiment Donald Mackay, dont 500 furent tués dans les combats. Les troupes suédoises suivirent et, en juin, la ville fit alliance avec la Suède pendant vingt ans. Wallenstein prit le commandement mais leva le siège le 4 août, son premier sérieux revers."
"Christian IV used his command of the sea to raid the coasts. In August he landed on Usedom with 7,000 men and took Wolgast, but on 2 September Wallenstein beat him outside the town and the Danes re-embarked. Both men now wanted peace. By the Peace of Lübeck, signed on 22 May 1629, Christian got back all his lands without paying anything, but gave up his claims to the north German bishoprics and promised to stay out of the Empire’s affairs. The next year Sweden entered the war.": "Christian IV a utilisé son commandement de la mer pour attaquer les côtes. En août, il atterrit à Usedom avec 7 000 hommes et prit Wolgast, mais le 2 septembre Wallenstein l’a battu hors de la ville et les Danois ont réembarqué. Par la paix de Lübeck, signée le 22 mai 1629, Christian récupéra toutes ses terres sans payer quoi que ce soit, mais abandonna ses revendications aux évêques allemands du nord et promit de rester hors des affaires de l’Empire."
"Siege of Stralsund": "Siège de Stralsund"
"13 May – 4 August 1628, abandoned": "13 mai – 4 août 1628, abandonné"
"Battle of Wolgast": "Bataille de Wolgast"
"2 September 1628, Imperial victory": "2 septembre 1628, victoire impériale"
"Peace of Lübeck": "Paix de Lübeck"
"22 May 1629, ratified by the Emperor on 7 June": "22 mai 1629, ratifié par l’empereur le 7 juin"
"13 May – 4 August 1628": "13 mai – 4 août 1628"
"Danish, Scottish and then Swedish troops helped the townspeople beat off repeated assaults. The town stayed in Swedish hands for most of the next two centuries.": "Les troupes danoises, écossaises et suédoises ont aidé les habitants à vaincre les assauts répétés. La ville est restée aux mains des Suédois pendant la plupart des deux siècles suivants."
"2 September 1628": "2 septembre 1628"
"Wallenstein, fresh from Stralsund, routed Christian’s landing force, which had to abandon the town.": "Wallenstein, fraîchement de Stralsund, a acheminé la force d’atterrissage de Christians, qui a dû abandonner la ville."
"22 May 1629": "22 mai 1629"
"Negotiated in secret by Christian and Wallenstein. Denmark–Norway lost no land but left the war.": "Négocié en secret par Christian et Wallenstein. Danemark-Norvège n’a perdu aucune terre mais a quitté la guerre."
"Christian IV, 1628": "Chrétien IV, 1628"
"Occupied by Imperial and League troops until the peace": "Occupé par les troupes impériales et de la Ligue jusqu’à la paix"
"Sweden enters the war": "La Suède entre dans la guerre"
"The Truce of Altmark with Poland in 1629 let Sweden keep Livonia and several Prussian ports, and it freed King Gustav II Adolf to intervene in Germany. In July 1630 he landed at Peenemünde on the island of Usedom with about 13,000 men.": "La trêve d’Altmark avec la Pologne en 1629 permet à la Suède de garder Livonie et plusieurs ports prussiens, et elle libère le roi Gustav II Adolf d’intervenir en Allemagne. En juillet 1630, il débarque à Peenemünde sur l’île d’Usedom avec environ 13 000 hommes."
"Stettin fell within weeks, and a treaty with the Duke of Pomerania turned the duchy into Sweden’s bridgehead. In January 1631 France promised to pay for the war in the Treaty of Bärwalde.": "Stettin tomba en quelques semaines, et un traité avec le duc de Poméranie transforma le duché en tête de pont de la Suède. En janvier 1631, la France promettait de payer pour la guerre dans le Traité de Bärwalde."
"King": "Roi"
"Gustav II Adolf": "Gustav II Adolf"
"Landing force": "Force d’atterrissage"
"About 13,000 men (10,000 foot, 3,000 horse)": "Environ 13 000 hommes (10 000 pieds, 3 000 chevaux)"
"Landing at Peenemünde": "Débarquement à Peenemünde"
"6 July 1630 (New Style)": "6 juillet 1630 (Nouveau style)"
"A fleet of 27 ships brought the king and some 13,000 troops to Usedom, at the mouth of the Peene.": "Une flotte de 27 navires amena le roi et quelque 13 000 soldats à Usedom, à l’embouchure du Peene."
"Stettin": "Stétine"
"July 1630": "juillet 1630"
"The Pomeranian capital was taken soon after the landing. By the autumn it held the largest Swedish garrison in the duchy, over 4,200 men.": "La capitale de Poméranie fut prise peu après le débarquement. À l’automne, elle détenait la plus grande garnison suédoise du duché, soit plus de 4 200 hommes."
"Stralsund": "Fraisund"
"Already a Swedish ally. In the autumn of 1630 about 3,100 Swedish soldiers were based here.": "Déjà un allié suédois. À l’automne de 1630, environ 3 100 soldats suédois étaient basés ici."
"Prussian ports": "Ports prussiens"
"1629–1635": "1629–1635"
"Under the Truce of Altmark Sweden held coastal towns such as Pillau, Memel and Elbing and took a share of the tolls on Polish trade, which helped pay for the war in Germany.": "Sous la Trêve d’Altmark, la Suède a tenu des villes côtières telles que Pillau, Memel et Elbing et a pris une part des péages sur le commerce polonais, qui a contribué à payer pour la guerre en Allemagne."
"Magdeburg and Breitenfeld": "Magdeburg et Breitenfeld"
"In May 1631 Imperial troops under Tilly stormed the Protestant city of Magdeburg before the Swedes could relieve it, killing some 20,000 people. The massacre pushed wavering Protestant princes toward Sweden, and Saxony joined Gustav Adolf.": "En mai 1631, les troupes impériales sous Tilly s’emparèrent de la ville protestante de Magdebourg avant que les Suédois ne puissent la soulager, tuant quelque 20 000 personnes."
"On 17 September 1631, at Breitenfeld north of Leipzig, the Swedish-Saxon army of about 40,000 routed Tilly’s 31,000, even after the Saxons fled early in the battle. The king then swept west through Franconia to winter at Mainz on the Rhine.": "Le 17 septembre 1631, à Breitenfeld au nord de Leipzig, l’armée soudano-saxonne d’environ 40 000 hommes roulait vers 31 000 Tilly, même après que les Saxons aient fui tôt dans la bataille."
"Swedish-Saxon army": "Armée suédoise-saxonne"
"About 40,000": "Environ 40 000"
"Imperial army": "Armée impériale"
"About 31,000": "Environ 31 000"
"Sack of Magdeburg": "Sac de Magdeburg"
"20 May 1631": "20 mai 1631"
"Tilly’s army stormed the city after a two-month siege. Most of its inhabitants died in the massacre and fire that followed.": "L’armée de Tilly a envahi la ville après un siège de deux mois. La plupart de ses habitants sont morts dans le massacre et le feu qui ont suivi."
"Battle of Breitenfeld": "Bataille de Breitenfeld"
"17 September 1631": "17 septembre 1631"
"The first great Protestant victory of the war. The Saxons broke, but the Swedish brigades held and destroyed Tilly’s army.": "La première grande victoire protestante de la guerre. Les Saxons ont rompu, mais les brigades suédoises détiennent et détruisent l’armée Tilly."
"Winter quarters at Mainz": "Logements d’hiver à Mayence"
"Winter 1631–32": "Hiver 1631–1632"
"After conquering Franconia the king set up his winter quarters on the Rhine.": "Après avoir conquis Franconie, le roi installa ses quartiers d’hiver sur le Rhin."
"Into Franconia": "En Franconie"
"Into Bavaria, and death at Lützen": "En Bavière, et mort à Lützen"
"In April 1632 the Swedes forced the river Lech at Rain over a pontoon bridge. Tilly was mortally wounded, and on 17 May the king rode into Munich. Wallenstein, back in command of the Emperor’s armies, then pinned him at Nuremberg, where a costly assault on Wallenstein’s camp at the Alte Veste failed in September.": "En avril 1632, les Suédois forcèrent la rivière Lech à Pluie sur un ponton. Tilly fut mortellement blessé et le roi monta à Munich le 17 mai. Wallenstein, de retour au commandement des armées de l’empereur, le pilonna alors à Nuremberg, où une attaque coûteuse contre le camp de Wallenstein à l’Alte Veste échoua en septembre."
"The armies met again at Lützen on 16 November 1632. Sweden won the battle, but Gustav II Adolf was killed. His five-year-old daughter Christina became queen, and Chancellor Axel Oxenstierna took charge of the war.": "Les armées se rencontrent à nouveau à Lützen le 16 novembre 1632. La Suède gagne la bataille, mais Gustav II Adolf est tué. Sa fille de cinq ans Christina devient reine, et le chancelier Axel Oxenstierna prend en charge la guerre."
"Killed at Lützen": "Tué à Lützen"
"Gustav II Adolf, aged 37": "Gustav II Adolf, 37 ans"
"New ruler": "Nouvelle règle"
"Queen Christina, with a regency": "Reine Christina, avec une régence"
"Battle of Rain": "Bataille de pluie"
"15 April 1632": "15 avril 1632"
"Finnish cavalry crossed first, under fire. Tilly was badly wounded and died two weeks later.": "La cavalerie finlandaise a traversé le premier, sous le feu. Tilly a été gravement blessé et est mort deux semaines plus tard."
"Munich": "Munich"
"17 May 1632": "17 mai 1632"
"The Bavarian capital paid a heavy ransom to avoid being plundered. It was the deepest Swedish thrust into the Empire.": "La capitale bavaroise a payé une lourde rançon pour éviter d’être pillé. C’était la plus profonde poussée suédoise dans l’Empire."
"Battle of the Alte Veste": "Bataille de l’Alte Veste"
"3–4 September 1632": "3–4 septembre 1632"
"Gustav Adolf attacked Wallenstein’s entrenched camp outside Nuremberg and was beaten back with heavy losses.": "Gustav Adolf a attaqué Wallensteins camp retranché à l’extérieur de Nuremberg et a été battu avec de lourdes pertes."
"Battle of Lützen": "Bataille de Lützen"
"16 November 1632": "16 novembre 1632"
"A hard-fought Swedish victory over Wallenstein, paid for with the life of the king, who was killed in the fighting.": "Une victoire suédoise dure sur Wallenstein, payée avec la vie du roi, qui a été tué dans les combats."
"To Lützen": "À Lützen"
"Nördlingen and the Peace of Prague": "Nördlingen et la paix de Prague"
"1633–1635": "1633–1635"
"Oxenstierna kept the war going through the Heilbronn League of German Protestant states, paid for by France. But on 6 September 1634 an Imperial army, reinforced by 15,000 Spanish troops, crushed the Swedish-German army at Nördlingen. The Swedes had to pull out of Bavaria.": "Oxenstierna garda la guerre à travers la Ligue Heilbronn des États protestants allemands, payée par la France. Mais le 6 septembre 1634, une armée impériale, renforcée de 15 000 soldats espagnols, a écrasé l’armée suédoise-allemande à Nördlingen. Les Suédois durent sortir de Bavière."
"In May 1635 Saxony and other Lutheran princes made the Peace of Prague with the Emperor, leaving Sweden almost alone. To free up troops, Sweden also gave up its Prussian ports in the Truce of Stuhmsdorf with Poland in September 1635, while keeping Livonia with Riga.": "En mai 1635, la Saxe et d’autres princes luthériens firent la paix de Prague avec l’empereur, laissant la Suède presque seule. Pour libérer les troupes, la Suède abandonna également ses ports prussiens dans la Trêve de Stuhmsdorf avec la Pologne en septembre 1635, tout en gardant Livonie avec Riga."
"Swedish losses at Nördlingen": "Pertes suédoises à Nördlingen"
"About 21,000 killed or captured": "Environ 21 000 tués ou capturés"
"Allies lost": "Alliés perdus"
"Saxony and most Lutheran princes": "Saxe et la plupart des princes luthériens"
"Heilbronn League": "Ligue Heilbronn"
"An alliance of German Protestant states under Swedish leadership, formed after the king’s death and funded by France.": "Une alliance des États protestants allemands sous la direction suédoise, formée après la mort du roi et financée par la France."
"Battle of Nördlingen": "Bataille de Nördlingen"
"6 September 1634": "6 septembre 1634"
"A crushing Imperial-Spanish victory that destroyed the Swedish field army in the south. Some historians call it the pivotal battle of the war.": "Une victoire impériale-espagnole écrasante qui a détruit l’armée de campagne suédoise dans le sud. Certains historiens appellent cela la bataille centrale de la guerre."
"Peace of Prague": "Paix de Prague"
"30 May 1635": "30 mai 1635"
"Saxony and most German Lutheran rulers made peace with the Emperor and abandoned their Swedish alliance.": "La Saxe et la plupart des dirigeants luthériens allemands ont fait la paix avec l’empereur et abandonné leur alliance suédoise."
"Truce of Stuhmsdorf": "Trêve de Stuhmsdorf"
"12 September 1635": "12 septembre 1635"
"The truce with Poland was extended by 26 years. Sweden gave up the Prussian ports and their tolls, and kept most of Livonia, including Riga.": "La trêve avec la Pologne fut prolongée de 26 ans. La Suède abandonna les ports prussiens et leurs péages, et conserva la plupart des Livonies, y compris Riga."
"Swedish retreat": "Retraite suédoise"
"France enters the war, and the Year of Corbie": "La France entre dans la guerre et l’Année de Corbie"
"1635–1636": "1635–1636"
"After the Swedish defeat at Nördlingen and the Peace of Prague, Cardinal Richelieu could no longer fight the Habsburgs only through allies and subsidies. When Spanish troops seized Trier in March 1635 and carried off its archbishop-elector, who was under French protection, France declared war on Spain on 19 May. A French army won at Les Avins in the Spanish Netherlands the next day, but with its Dutch allies it failed before Leuven and melted away through disease and desertion. In October France took Bernhard of Saxe-Weimar’s German army into its pay.": "Après la défaite suédoise à Nördlingen et la paix de Prague, le cardinal Richelieu ne pouvait plus combattre les Habsbourg uniquement par des alliés et des subventions. Lorsque les troupes espagnoles s’emparèrent de Trèves en mars 1635 et déportèrent son archevêque-éclecteur, qui était sous protection française, la France déclara la guerre à l’Espagne le 19 mai. Une armée française a gagné aux Avins dans les Pays-Bas espagnols le lendemain, mais avec ses alliés néerlandais elle a échoué avant Louvain et s’est fondue par la maladie et la désertion."
"In July 1636 the Cardinal-Infante Ferdinand, governor of the Spanish Netherlands, invaded Picardy with Spanish troops and imperial cavalry under Ottavio Piccolomini and the Bavarian general Johann von Werth. They took La Capelle and Le Catelet, forced the Somme on 5 August and took Corbie on 15 August, while their horsemen raided as far as Compiègne and panic spread in Paris, about 120 km away. Louis XIII raised a new army, the invaders withdrew, and Corbie was retaken on 14 November. In the east an imperial invasion of Burgundy under Matthias Gallas stalled at Saint-Jean-de-Losne.": "En juillet 1636, le cardinal-infante Ferdinand, gouverneur des Pays-Bas d’Espagne, envahit la Picardie avec les troupes espagnoles et la cavalerie impériale sous Ottavio Piccolomini et le général bavarois Johann von Werth. Ils emmenèrent La Capelle et Le Catelet, forcèrent la Somme le 5 août et prirent Corbie le 15 août, tandis que leurs cavaliers pénétraient jusqu’à Compiègne et s’étendaient à Paris, à environ 120 km. Louis XIII éleva une nouvelle armée, les envahisseurs se retiraient, et Corbie fut repris le 14 novembre. À l’est, une invasion impériale de Bourgogne sous Matthias Gallas s’étalait à Saint-Jean-de-Losne."
"France declares war on Spain": "La France déclare la guerre à l’Espagne"
"19 May 1635": "19 mai 1635"
"Corbie": "Corbie"
"Taken by Spain 15 August, retaken 14 November 1636": "Prise par l’Espagne 15 août, reprise 14 novembre 1636"
"Known in France as": "Connu en France comme étant"
"l’année de Corbie, the Year of Corbie": "Année de Corbie, l’année de Corbie"
"Trier": "Trève"
"26 March 1635": "26 mars 1635"
"Spanish troops from Luxembourg surprised the city and captured Archbishop-Elector Philipp Christoph von Sötern, who had put himself under French protection. He was held prisoner for ten years.": "Les troupes espagnoles du Luxembourg ont surpris la ville et capturé l’archevêque-électeur Philipp Christoph von Sötern, qui s’était placé sous protection française. Il a été détenu pendant dix ans."
"Brussels": "Bruxelles"
"A French herald brought the declaration of war to the capital of the Spanish Netherlands, opening a war with Spain that lasted until 1659.": "Un héraut français apporta la déclaration de guerre à la capitale des Pays-Bas espagnols, ouvrant une guerre avec l’Espagne qui dura jusqu’en 1659."
"Battle of Les Avins": "Bataille des Avins"
"20 May 1635": "20 mai 1635"
"Marshals Châtillon and Brézé beat a smaller Spanish army under Prince Thomas of Savoy near Huy.": "Les marshals Châtillon et Brézé ont battu une petite armée espagnole sous le prince Thomas de Savoie près de Huy."
"Leuven": "Leuven"
"June – July 1635": "juin – juillet 1635"
"The French and Dutch besieged the city for about ten days and then withdrew, their armies wasted by disease, hunger and desertion.": "Les Français et les Hollandais ont assiégé la ville pendant une dizaine de jours, puis se sont retirés, leurs armées gaspillées par la maladie, la faim et la désertion."
"La Capelle": "La Capelle"
"8 July 1636": "8 juillet 1636"
"The frontier fortress surrendered after a short siege, opening the road into Picardy.": "La forteresse frontalière s’est rendue après un court siège, ouvrant la route à Picardie."
"15 August 1636": "15 août 1636"
"The fortress on the Somme above Amiens surrendered after a week. A French army of some 50,000 men won it back on 14 November after a six-week siege.": "La forteresse sur la Somme au-dessus d’Amiens s’est rendue après une semaine. Une armée française de quelque 50 000 hommes l’a remportée le 14 novembre après un siège de six semaines."
"Saint-Jean-de-Losne": "Saint-Jean-de-Losne"
"November 1636": "novembre 1636"
"The small Burgundian town on the Saône held out against Gallas’s army, which then retreated, weakened by hunger and disease.": "La petite ville bourguignonne de la Saône s’est opposée à l’armée galloise, qui a alors reculé, affaiblie par la faim et la maladie."
"Cardinal-Infante": "Cardinal-Infante"
"Imperial cavalry": "Cavalerie impériale"
"Louis XIII": "Louis XIII"
"Gallas": "Les gallas"
"Imperial and Bavarian success": "Succès impérial et bavarois"
"Imperial and Bavarian moves": "Mouvements impériaux et bavarois"
"Banér holds on": "Détentions Banér"
"1636–1641": "1636–1641"
"With Saxony now an enemy, Johan Banér fought back from Sweden’s Baltic base. On 4 October 1636 he and the Scottish general Alexander Leslie beat a larger Imperial-Saxon army at Wittstock in Brandenburg, restoring Swedish power in northern Germany. A new subsidy treaty with France followed in 1638.": "Le 4 octobre 1636, lui et le général écossais Alexander Leslie battent une armée impériale-saxonne plus grande à Wittstock dans le Brandebourg, rétablissant la puissance suédoise dans le nord de l’Allemagne. Un nouveau traité de subvention avec la France suivit en 1638."
"Banér beat the Saxons again at Chemnitz in 1639 and pushed into Bohemia. In the winter of 1640–41 he struck at Regensburg with French help, then had to fall back. He died at Halberstadt in May 1641.": "Banér bat à nouveau les Saxons à Chemnitz en 1639 et pousse dans la Bohême. À l’hiver de 1640–1641, il frappe à Ratisbonne avec l’aide française, puis doit tomber. Il meurt à Halberstadt en mai 1641."
"At Wittstock": "Chez Wittstock"
"About 18,000 Swedes against about 25,000": "Environ 18 000 Suédois contre environ 25 000"
"French subsidies": "Subventions françaises"
"Treaty of Hamburg, 1638": "Traité de Hambourg, 1638"
"Battle of Wittstock": "Bataille de Wittstock"
"4 October 1636": "4 octobre 1636"
"A decisive victory over the Imperial-Saxon army, 93 km north-west of Berlin, which showed the Swedes were not a spent force after Nördlingen.": "Une victoire décisive sur l’armée impériale-saxonne, à 93 km au nord-ouest de Berlin, qui montre que les Suédois ne sont pas une force passée après Nördlingen."
"Battle of Chemnitz": "Bataille de Chemnitz"
"Banér defeated the Saxons, opening the way into Bohemia. It may have been his finest battle.": "Banér battit les Saxons, ouvrant la voie à la Bohême. C’était peut-être sa plus belle bataille."
"Strike at Regensburg": "Grève à Ratisbonne"
"Winter 1640–41": "Hiver 1640–41"
"Banér and the French under Guébriant tried a surprise attack on the city where the Imperial Diet was meeting, but could not take it.": "Banér et les Français sous Guébriant essayèrent une attaque surprise sur la ville où se réunissait la Diète Impériale, mais ne purent l’emporter."
"Banér dies": "Banér meurt"
"May 1641": "mai 1641"
"Worn out by the retreat, Banér died at Halberstadt after naming Lennart Torstenson his successor.": "Issu de la retraite, Banér meurt à Halberstadt après avoir nommé Lennart Torstenson son successeur."
"Into Bohemia": "Dans la Bohême"
"Retreat": "Retraite"
"Torstenson on the offensive": "Torstenson sur l’offensive"
"1642–1645": "1642–1645"
"Lennart Torstenson moved fast. He took Olomouc in Moravia in June 1642 and destroyed an Imperial army at the second battle of Breitenfeld on 2 November 1642.": "Il prit Olomouc en Moravie en juin 1642 et détruisit une armée impériale lors de la deuxième bataille de Breitenfeld le 2 novembre 1642."
"After a lightning campaign against Denmark (see the Torstenson War), he turned south again. At Jankau in Bohemia on 6 March 1645 he routed the Emperor’s army and headed for Vienna, but a long siege of Brno failed and he had to withdraw.": "Après une campagne de foudre contre le Danemark (voir la guerre de Torstenson), il retourne au sud. À Jankau en Bohême, le 6 mars 1645, il dirige l’armée de l’empereur et se dirige vers Vienne, mais un long siège de Brno échoue et il doit se retirer."
"Commander": "Commandant"
"Lennart Torstenson": "Lennart Torstenson"
"Brno siege": "Brno siège"
"3 May – 23 August 1645, failed": "3 mai – 23 août 1645, échoué"
"Olomouc": "Olomouc"
"14 June 1642": "14 juin 1642"
"The Moravian city fell after a short siege and stayed in Swedish hands for the rest of the war.": "La ville morave tomba après un court siège et resta aux mains des Suédois pour le reste de la guerre."
"Second Battle of Breitenfeld": "Deuxième bataille de Breitenfeld"
"2 November 1642": "2 novembre 1642"
"Fought on the same ground as in 1631. Torstenson turned on the army that had lifted his siege of Leipzig and won crushingly.": "Frappé sur le même terrain qu’en 1631. Torstenson se tourna vers l’armée qui avait levé son siège de Leipzig et gagné écrasantement."
"Battle of Jankau": "Bataille de Jankau"
"6 March 1645": "6 mars 1645"
"One of the bloodiest battles of the war, about 50 km south-east of Prague. It opened the road to Vienna.": "Une des batailles les plus sanglantes de la guerre, à environ 50 km au sud-est de Prague. Il a ouvert la route vers Vienne."
"Siege of Brno": "Siège de Brno"
"May – August 1645": "mai – août 1645"
"The last fortress between Torstenson and Vienna held out for more than three months. When his Transylvanian allies made peace, he gave up.": "La dernière forteresse entre Torstenson et Vienne s’est tenue pendant plus de trois mois. Quand ses alliés transylvaniens ont fait la paix, il a abandonné."
"Toward Vienna": "Vers Vienne"
"France against Bavaria in the south": "France contre la Bavière dans le sud"
"1643–1645": "1643–1645"
"In 1638 Bernhard of Saxe-Weimar, a German Protestant general in French pay, took the Habsburg fortress of Breisach on the upper Rhine, and after his death in 1639 France took over his army and his conquests. It fought Bavaria for south-west Germany. In November 1643 Marshal Guébriant took Rottweil but died of his wounds, and on 24 November the Bavarian general Franz von Mercy, with Johann von Werth and Lorraine troops, surprised the French army in its winter quarters at Tuttlingen and captured most of it. In July 1644 Mercy took Freiburg im Breisgau.": "En 1638, Bernhard de Saxe-Weimar, un général protestant allemand à la solde française, prit la forteresse Habsbourg de Breisach sur le Rhin supérieur, et après sa mort en 1639, la France reprit son armée et ses conquêtes. En novembre 1643, le maréchal Guébriant prit Rottweil mais mourut de ses blessures et, le 24 novembre, le général bavarois Franz von Mercy, avec Johann von Werth et les troupes lorraines, surprit l’armée française dans ses quartiers d’hiver à Tuttlingen et en captura la plupart."
"The young Duke of Enghien, the future Great Condé, joined Turenne with fresh troops, and on 3, 5 and 9 August they stormed Mercy’s entrenchments on the wooded hills around Freiburg in some of the bloodiest fighting of the war. Mercy withdrew in good order, but the French went on to take Philippsburg, Speyer, Worms and Mainz. In May 1645 Mercy surprised Turenne at Herbsthausen, but on 3 August Enghien, Turenne and their Hessian allies beat the Bavarians at Allerheim near Nördlingen. Mercy was killed, and both armies were so badly mauled that the French fell back to the Rhine.": "Le jeune duc d’Enghien, le futur Grand Condé, rejoignit Turenne avec de nouvelles troupes et, les 3, 5 et 9 août, ils s’emparèrent des enchâssements de Mercy sur les collines boisées autour de Fribourg dans quelques-uns des combats les plus sanglants de la guerre. En mai 1645, Mercy surprend Turenne à Herbsthausen, mais le 3 août Enghien, Turenne et leurs alliés hessiens battent les Bavarois à Allerheim près de Nördlingen. Mercy est tuée, et les deux armées sont tellement malmenées que les Français retournent au Rhin."
"Battle of Tuttlingen": "Bataille de Tuttlingen"
"24 November 1643, Bavarian victory": "24 novembre 1643, victoire bavaroise"
"Battle of Freiburg": "Bataille de Fribourg"
"3–9 August 1644, indecisive": "3-9 août 1644, indécis"
"Battle of Allerheim": "Bataille d’Allerheim"
"3 August 1645, French victory; Mercy killed": "3 août 1645, victoire française ; Mercy tué"
"Breisach": "Breisach"
"1638–1648": "1638–1648"
"Bernhard of Saxe-Weimar starved the Rhine fortress into surrender in December 1638. France kept it in the Peace of Westphalia, together with the Habsburg lands in Alsace.": "Bernhard de Saxe-Weimar a laissé tomber la forteresse du Rhin en décembre 1638. La France l’a gardée dans la Paix de Westphalie, avec les terres des Habsbourg en Alsace."
"Rottweil": "Crèche"
"19 November 1643": "19 novembre 1643"
"Guébriant took the imperial city but was mortally wounded during the siege, leaving the army to the less able Josias Rantzau.": "Guébriant a pris la ville impériale mais a été mortellement blessé pendant le siège, laissant l’armée au moins capable Josias Rantzau."
"24 November 1643": "24 novembre 1643"
"Mercy’s and Werth’s cavalry fell on the scattered French quarters. Some 7,000 men were captured, Rantzau among them, and the French army in Germany ceased to exist for a time.": "La cavalerie de Mercy et Werth est tombée sur les quartiers français dispersés. Environ 7 000 hommes ont été capturés, Rantzau parmi eux, et l’armée française en Allemagne a cessé d’exister pendant un certain temps."
"3–9 August 1644": "3–9 août 1644"
"Three days of assaults on Mercy’s fortified lines cost the French perhaps 8,000 men and the Bavarians about half as many. Mercy then withdrew through the Black Forest.": "Trois jours d’assauts sur les lignes fortifiées de Mercy ont coûté aux Français environ 8 000 hommes et aux Bavarois environ la moitié de leur nombre."
"Philippsburg": "Philippsburg"
"12 September 1644": "12 septembre 1644"
"The capture of this fortress, and of the cities of the middle Rhine, gave France control of the river. The Peace of Westphalia let it keep a garrison here.": "La prise de cette forteresse, et des villes du Rhin moyen, a donné à la France le contrôle du fleuve. La Paix de Westphalie la laisse garder une garnison ici."
"Battle of Herbsthausen": "Bataille de Herbsthausen"
"5 May 1645": "5 mai 1645"
"Mercy surprised Turenne’s army near Mergentheim in Franconia and destroyed most of his infantry.": "Mercy a surpris l’armée de Turenne près de Mergentheim en Franconie et détruit la plupart de son infanterie."
"3 August 1645": "3 août 1645"
"Also called the Second Battle of Nördlingen. Each side lost about 4,000 men killed, wounded or captured, and Mercy was killed in the fighting.": "Aussi appelé la Deuxième bataille de Nördlingen. Chaque partie a perdu environ 4000 hommes tués, blessés ou capturés, et Mercy a été tué dans les combats."
"Mercy and Werth": "Miséricorde et Werth"
"Enghien": "Enghien"
"Enghien and Turenne, 1645": "Enghien et Turenne, 1645"
"Bavarian and Imperial success": "Le succès bavarois et impérial"
"Bavarian and Imperial moves": "Les mouvements bavarois et impériaux"
"The last campaigns and the Peace of Westphalia": "Les dernières campagnes et la paix de Westphalie"
"1646–1648": "1646–1648"
"Carl Gustaf Wrangel and the French under Turenne beat the last Imperial-Bavarian field army at Zusmarshausen on 17 May 1648. Königsmarck’s flying column then surprised Prague in July and looted the castle and the Lesser Town, but students and citizens held the Charles Bridge.": "Carl Gustaf Wrangel et les Français sous Turenne ont battu la dernière armée de campagne impériale-bavarienne à Zusmarshausen le 17 mai 1648. Les Königsmarck's ont alors surpris Prague en juillet et pillé le château et la petite ville, mais des étudiants et des citoyens tenaient le pont Charles."
"Peace was signed at Osnabrück and Münster on 24 October 1648. Sweden gained Western Pomerania with Stettin and Rügen, the port of Wismar, and the bishoprics of Bremen and Verden, together with 5 million thalers and a seat in the Imperial Diet.": "La paix a été signée à Osnabrück et Münster le 24 octobre 1648. La Suède a gagné la Poméranie occidentale avec Stettin et Rügen, le port de Wismar, et les évêchés de Brême et Verden, avec 5 millions de thalers et un siège dans la Diète Impériale."
"Gained": "Gains"
"Western Pomerania, Wismar, Bremen-Verden": "Poméranie occidentale, Wismar, Brême-Verden"
"Indemnity": "Indemnisation"
"5 million thalers": "5 millions de thalers"
"Also": "Aussi"
"Brandenburg got Farther Pomerania, France most of Alsace": "Brandenburg a obtenu Farther Pomerania, France la plupart de l’Alsace"
"Battle of Zusmarshausen": "Bataille de Zusmarshausen"
"17 May 1648": "17 mai 1648"
"The last major battle of the war on German soil, won by a Franco-Swedish army under Wrangel and Turenne.": "La dernière grande bataille de la guerre sur le sol allemand, remportée par une armée franco-suédoise sous Wrangel et Turenne."
"Battle of Prague": "Bataille de Prague"
"25 July – 1 November 1648": "25 juillet – 1er novembre 1648"
"The Swedes took and plundered the west bank of the city, including the castle, but never got across the river. Fighting stopped when news of the peace arrived.": "Les Suédois ont pris et pillé la rive ouest de la ville, y compris le château, mais n’ont jamais traversé la rivière."
"Treaty of Osnabrück": "Traité de Osnabrück"
"24 October 1648": "24 octobre 1648"
"Sweden negotiated its part of the Peace of Westphalia here, in a city held by Protestant forces.": "La Suède a négocié sa partie de la paix de Westphalie ici, dans une ville tenue par les forces protestantes."
"Wismar": "Wismar"
"The Mecklenburg port and the island of Poel became Swedish under the peace.": "Le port de Mecklembourg et l’île de Poel sont devenus suédois sous la paix."
"Wrangel": "Frappe"
"Königsmarck": "Königsmarck"
"Gained by Sweden in this peace": "Acquis par la Suède dans cette paix"
"Swedish on a 30-year pledge": "Suédois sur un engagement de 30 ans"
