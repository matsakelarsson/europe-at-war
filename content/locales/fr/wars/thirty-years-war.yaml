"In late July 1626 Christian led his army out of Wolfenbüttel to seek battle with Tilly’s Catholic League army, not knowing that Wallenstein had sent Tilly more than 4,000 reinforcements. Outmanoeuvred and soaked by torrential rain, the Danes turned back, and for three days their rearguard fought off Tilly’s cavalry. On 27 August Christian decided to stand at Lutter am Barenberge.": "Fin juillet 1626, Christian conduisit son armée de Wolfenbüttel à la recherche d’une bataille avec l’armée de la Ligue catholique de Tilly, ne sachant pas que Wallenstein avait envoyé plus de 4000 renforts à Tilly. Outmanœuvré et trempé par une pluie torrentielle, les Danois se retournèrent, et pendant trois jours leur arrière-garde combattit la cavalerie de Tilly."
"An unauthorised attack by his right wing drew the whole army into a general advance, which was thrown back with heavy losses. Christian had four horses shot under him and fled with his cavalry. He left behind about 3,000 dead and wounded and all his artillery, and 2,500 more men surrendered the next day; Tilly lost about 700. Most of Christian’s German allies now abandoned him, and he withdrew to winter quarters at Stade.": "Une attaque non autorisée par son aile droite a attiré toute l’armée dans une avancée générale, qui a été repoussée avec de lourdes pertes. Christian avait quatre chevaux abattus sous lui et a fui avec sa cavalerie. Il a laissé derrière environ 3000 morts et blessés et toute son artillerie, et 2 500 autres hommes se sont rendus le lendemain ; Tilly a perdu environ 700. La plupart des alliés allemands chrétiens l’ont maintenant abandonné, et il s’est retiré dans les quartiers d’hiver au Stade."
"Battle of Lutter": "Bataille de Lutter"
