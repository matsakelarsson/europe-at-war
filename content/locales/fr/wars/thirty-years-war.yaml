"Thirty Years’ War": "Guerre de Trente Ans"
"The long war in the Holy Roman Empire between the Catholic Emperor and his allies and Protestant princes backed by foreign powers, which devastated much of Germany. Denmark–Norway fought in it in 1625–1629 and Sweden from 1630; by the Peace of Westphalia in 1648 Sweden gained Western Pomerania, Wismar and Bremen-Verden.": "Cette longue guerre du Saint-Empire oppose l’empereur catholique et ses alliés à des princes protestants soutenus par des puissances étrangères. Elle dévaste une grande partie de l’Allemagne. Le Danemark-Norvège y participe de 1625 à 1629 et la Suède à partir de 1630. Par la paix de Westphalie, en 1648, la Suède obtient la Poméranie occidentale, Wismar et Brême-et-Verden."
"Dates in Germany and Poland are New Style (Gregorian); Scandinavian dates are mostly Old Style (Julian), as usually cited, which ran ten days behind.": "Les dates en Allemagne et en Pologne sont New Style (Gregorian) ; les dates scandinaves sont pour la plupart Old Style (Julian), comme on le cite habituellement, qui a duré dix jours."
"The Swedish phase (1630–1648) was migrated from Sweden at War and is told from Sweden’s side. The Danish phase (1625–1629), the Bohemian and Palatine phases (1618–1623) and France’s war against Spain and Bavaria (1635–1645) were added for World at War.": "La phase suédoise (1630–1648) a été migrée de Suède à la guerre et est racontée du côté suédois. La phase danoise (1625–1629), les phases bohème et palatine (1618–1623) et la guerre de France contre l’Espagne et la Bavière (1635–1645) ont été ajoutées pour l’Europe à la guerre."
