"1625 – spring 1626": "1625 – printemps 1626"
"By 1625 the Emperor Ferdinand II and the Catholic League had crushed the Bohemian revolt and overrun the Palatinate, and the Protestant princes of northern Germany feared that their lands and their former church estates would be next. Christian IV of Denmark–Norway, who as Duke of Holstein was also a prince of the Empire, took command of the forces of the Lower Saxon Circle in May 1625. He hoped as well to win north German bishoprics for his sons.": "En 1625, l’empereur Ferdinand II et la Ligue catholique avaient écrasé la révolte bohème et envahi les Palatinats, et les princes protestants d’Allemagne du Nord craignaient que leurs terres et leurs anciens domaines religieux ne soient les suivants. Christian IV de Danemark–Norvège, qui comme duc de Holstein était aussi un prince de l’Empire, prit le commandement des forces du Cercle inférieur saxon en mai 1625. Il espérait aussi gagner des évêchés nord-allemands pour ses fils."
"Christian had few trained troops, and England and the Dutch Republic agreed to pay for more only in the Treaty of The Hague in December 1625. Meanwhile the Emperor gained an army of his own, raised by the Bohemian nobleman Albrecht von Wallenstein and fed by the lands it occupied. In April 1626 Wallenstein beat Christian’s ally Ernst von Mansfeld at the Dessau Bridge on the Elbe, and Mansfeld’s army marched off towards Silesia and Hungary.": "Christian avait peu de troupes entraînées, et l’Angleterre et la République néerlandaise acceptèrent de payer pour plus seulement dans le traité de La Haye en décembre 1625. Entre-temps, l’empereur a gagné une armée de sa propre, élevée par le noble bohème Albrecht von Wallenstein et nourrie par les terres qu’il occupait. En avril 1626, Wallenstein a battu Christians, l’allié Ernst von Mansfeld au pont Dessau sur l’Elbe, et l’armée de Mansfeld a marché vers la Silésie et la Hongrie."
