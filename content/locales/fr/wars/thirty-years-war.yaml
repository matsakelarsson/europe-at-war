"1618–1619": "1618–1619"
"The mostly Protestant estates of Bohemia had won religious freedom from Rudolf II in his Letter of Majesty of 1609, but the choice of the strictly Catholic Ferdinand of Styria as their next king, and quarrels over Protestant churches on church land, convinced them that their rights were in danger. On 23 May 1618 Protestant nobles led by Count Heinrich Matthias Thurn threw two of the king’s regents and their secretary from a window of Prague Castle. All three survived. The estates set up a government of thirty directors and raised an army.": "Dans sa lettre de majesté de 1609, Rudolf II avait accordé la liberté religieuse aux domaines essentiellement protestants de Bohême, mais le choix du Ferdinand strictement catholique de Styrie comme prochain roi et les querelles sur les églises protestantes sur les terres de l’église les ont convaincus que leurs droits étaient en danger. Le 23 mai 1618, des nobles protestants dirigés par le comte Heinrich Matthias Thurn jetèrent deux des régents du roi et leur secrétaire de la fenêtre du château de Prague. Tous trois survécurent."
"In November the mercenary general Ernst von Mansfeld took the Catholic stronghold of Plzeň for the rebels. After Emperor Matthias died in March 1619, Thurn marched through Moravia, which now joined the revolt, to the edge of Vienna, but turned back when the imperial general Bucquoy beat Mansfeld at Sablat on 10 June. On 31 July Bohemia, Moravia, Silesia and the two Lusatias formed a confederation, and in August the estates deposed Ferdinand and elected the Calvinist Elector Palatine, Frederick V. He was crowned in Prague on 4 November, two months after Ferdinand had been elected Emperor.": "En novembre, le général de mercenaire Ernst von Mansfeld prit la forteresse catholique de Plzea pour les rebelles. Après la mort de l’empereur Matthias en mars 1619, Thurn marcha à travers la Moravie, qui se joignit maintenant à la révolte, jusqu’au bord de Vienne, mais retourna en arrière lorsque le général impérial Bucquoy battit Mansfeld à Sablat le 10 juin. Le 31 juillet, la Bohême, la Moravie, la Silésie et les deux Lusatias formèrent une confédération, et en août les successions déposèrent Ferdinand et élirent l’Électeur calviniste Palatine Frederick V. Il fut couronné à Prague le 4 novembre, deux mois après que Ferdinand eut été élu Empereur."
