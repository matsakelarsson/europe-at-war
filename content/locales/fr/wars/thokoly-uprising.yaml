"Thököly Uprising": "La montée en puissance de Thököly"
? "A rising of the kuruc, the Hungarian rebels against Habsburg rule, led by the young Upper Hungarian magnate Imre Thököly. After the Magnate Conspiracy of 1670–1671 Leopold I suspended the Hungarian constitution, ruled through a governing council and persecuted Protestants, and thousands of dispossessed nobles, discharged soldiers and runaway serfs fled to Ottoman Hungary and Transylvania. With French subsidies and Transylvanian help, Thököly took command in 1678 and invaded Royal Hungary, seizing the mining towns of Upper Hungary. In 1681 Leopold restored some of the estates’ rights at the Diet of Sopron, but Thököly turned to the Ottomans. In 1682, helped by the pasha of Buda, he took Kassa and Fülek, and the sultan recognised him as “King of Upper Hungary”, a title he used as prince, in return for tribute. In the same year he married Ilona Zrínyi, widow of Francis I Rákóczi. In 1683 his kuruc fought alongside the grand vizier’s army that besieged Vienna. After the Ottoman defeat his support melted away; imperial armies retook Upper Hungary, he was defeated near Eperjes in 1685, and in October the Ottoman pasha of Várad, suspecting him of dealing with the emperor, had him arrested and sent in chains to Edirne. Ilona Zrínyi held out in the castle of Munkács until January 1688. Thököly, later briefly prince of Transylvania, died in exile in İzmit in 1705."
: "Une montée du kuruc, les rebelles hongrois contre le gouvernement de Habsbourg, dirigé par le jeune magnat hongrois supérieur Imre Thököly. Après la conspiration Magnétique de 1670–1671 Léopold J’ai suspendu la constitution hongroise, gouverné par un conseil directeur et persécuté protestants, et des milliers de nobles dépossédés, soldats libérés et serfs fuyés ont fui vers la Hongrie ottomane et la Transylvanie. Avec les subventions françaises et l’aide transylvanienne, Thököly prend le commandement en 1678 et envahit la Hongrie royale, s’emparant des villes minières de Haute-Hongrie. En 1681 Léopold rétablit certains des droits de succession à la Diète de Sopron, mais Thököly se tourne vers les Ottomans. En 1682, aidé par la pacha de Buda, il prit Kassa et Fülek, et le sultan le reconnut comme roi de Haute Hongrie, titre qu’il utilisa comme prince, en retour pour rendre hommage. La même année, il épousa Ilona Zrínyi, veuve de François I Rákóczi. En 1683, son kuruc combattit aux côtés de l’armée du grand vizier qui assiégea Vienne. Après la défaite ottomane, son soutien se fondit ; les armées impériales reprirent la Haute Hongrie, il fut défait près d’Eperjes en 1685 et, en octobre, la pacha ottomane de Várad, le soupçonnant de traiter avec l’empereur, le fit arrêter et envoyer enchaîné à Edirne. Ilona Zrínyi a tenu dans le château de Munkács jusqu’en janvier 1688. Thököly, plus tard brièvement prince de Transylvanie, est mort en exil à Izmit en 1705."
"Dates are Gregorian. Kuruc bands had fought the Habsburg authorities since the early 1670s; the uprising is usually dated from Thököly’s leadership in 1678. The war of 1683–1699, including the siege of Vienna and Thököly’s later campaigns, is told in the entry on the Great Turkish War.": "Dates sont grégorien. Les bandes Kuruc ont combattu les autorités de Habsbourg depuis le début des années 1670 ; le soulèvement est généralement daté de la direction de Thököly, en 1678. La guerre de 1683–1699, y compris le siège de Vienne et les campagnes de Thököly, est racontée dans l’entrée sur la Grande Guerre turque."
"Ilona Zrínyi’s son by her first marriage, Francis II Rákóczi, led the next great kuruc rising in 1703–1711, which has its own entry.": "Ilona Zrínyi, fils de son premier mariage, François II Rákóczi, a conduit le prochain grand kuruc en 1703–1711, qui a sa propre entrée."
