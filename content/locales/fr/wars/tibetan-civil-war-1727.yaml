# French translations of the catalogue text (wave 9); step bodies follow later.
Tibetan civil war of 1727–1728: Guerre civile tibétaine de 1727–1728
? A war between the nobles of Ü and Tsang over the government of Tibet, which brought a permanent Qing garrison and resident officials (ambans) to Lhasa. After the Qing expedition of 1720 drove the Dzungars out, Tibet was governed by a council of ministers under Khangchenné Sönam Gyalpo, a noble from western Tsang favoured by the Qing, with the Ü nobles Ngapö Dorje Gyalpo, Lumpané Tashi Gyalpo and Jarraba Lodrö Gyalpo and the Tsang noble Polhané Sönam Topgyé. Rivalry between the two regions and over the Qing’s favour came to a head on 5 August 1727, when Ngapö, Lumpané and Jarraba had Khangchenné killed in Lhasa, with the backing of the young Seventh Dalai Lama’s father. Polhané, away at his estate, escaped the men sent to seize him, raised the levies of Tsang, allied with Khangchenné’s brother, the governor of Ngari, and appealed to the Yongzheng emperor. After about half a year of fighting he defeated Ngapö’s army near Gyantse, marched on Lhasa with some 9,000 men and took the city; his enemies, who had shut themselves in the Potala, were taken prisoner on 5 July 1728. A Qing army arrived in Lhasa on 4 September, after the fighting was over. On 1 November 1728 Qing officials had Ngapö and Lumpané executed by slicing, two lamas hanged and thirteen others beheaded, and some of their relatives killed or exiled. The Dalai Lama was sent to Gartar near Litang in Kham until 1735, Polhané was given charge of the government, ruling Tsang himself and Ü through two ministers under his direction, with two ambans supervising, and Qing troops were stationed in Lhasa. He governed Tibet until his death in 1747.
: Une guerre entre les nobles de l’Ü et du Tsang pour le gouvernement du Tibet, qui amena à Lhassa une garnison Qing permanente et des représentants résidents (ambans). Après que l’expédition Qing de 1720 eut chassé les Dzoungars, le Tibet fut gouverné par un conseil de ministres dirigé par Khangchenné Sönam Gyalpo, un noble du Tsang occidental favorisé par les Qing, avec les nobles de l’Ü Ngapö Dorje Gyalpo, Lumpané Tashi Gyalpo et Jarraba Lodrö Gyalpo et le noble du Tsang Polhané Sönam Topgyé. La rivalité entre les deux régions et pour la faveur des Qing culmina le 5 août 1727, lorsque Ngapö, Lumpané et Jarraba firent assassiner Khangchenné à Lhassa, avec l’appui du père du jeune septième dalaï-lama. Polhané, qui se trouvait sur son domaine, échappa aux hommes envoyés pour l’arrêter, leva les troupes du Tsang, s’allia au frère de Khangchenné, gouverneur du Ngari, et en appela à l’empereur Yongzheng. Après environ six mois de combats, il battit l’armée de Ngapö près de Gyantsé, marcha sur Lhassa avec quelque 9 000 hommes et prit la ville ; ses ennemis, qui s’étaient enfermés dans le Potala, furent faits prisonniers le 5 juillet 1728. Une armée Qing arriva à Lhassa le 4 septembre, une fois les combats terminés. Le 1er novembre 1728, des fonctionnaires Qing firent exécuter Ngapö et Lumpané par le supplice du découpage, pendre deux lamas et décapiter treize autres personnes, et certains de leurs parents furent tués ou exilés. Le dalaï-lama fut envoyé à Gartar, près de Litang, au Kham, jusqu’en 1735 ; Polhané reçut la charge du gouvernement, administrant lui-même le Tsang, et l’Ü par l’intermédiaire de deux ministres placés sous sa direction, sous la surveillance de deux ambans, et des troupes Qing furent stationnées à Lhassa. Il gouverna le Tibet jusqu’à sa mort en 1747.
