# French translations of the catalogue text (wave 9); step bodies follow later.
Expulsion of the Qing garrison from Tibet: Expulsion de la garnison Qing du Tibet
? The fighting in which Tibetans drove the Chinese garrison out of Lhasa and central Tibet after the fall of the Qing dynasty. A Qing army of some 2,000 men had entered Lhasa in February 1910, and the 13th Dalai Lama had fled to British India. When news of the Wuchang uprising of October 1911 reached Tibet, the unpaid garrison mutinied, plundered and split into factions. In the spring of 1912 the Dalai Lama, still in India, called on Tibetans to rise; Tibetan militias under Tsarong Dazang Dramdul besieged the Chinese in Lhasa, where the mutineers had plundered the city and occupied Sera monastery, while the garrisons of Gyantse and Shigatse surrendered and were sent to India through the mediation of the British trade agent David Macdonald. An agreement of 12 August 1912, concluded in the presence of Nepalese representatives, required the Chinese in Lhasa to seal their arms and leave within fifteen days. Fighting broke out again in September; a second armistice on 14 November was followed on 12 December 1912 by the departure from Lhasa of the last troops under Zhong Ying, who went home by way of India. The Dalai Lama returned to Lhasa in January 1913 and on 13 February 1913 issued a proclamation that Tibetans regard as a declaration of independence. The Republic of China maintained its claim to Tibet; a Sichuan army that reoccupied much of Kham in 1912 did not advance into central Tibet after Britain protested in August 1912. From 1913 to 1950 the Dalai Lama’s government governed central and western Tibet itself, although no major state recognised it as independent.
: Les combats par lesquels les Tibétains chassèrent la garnison chinoise de Lhassa et du Tibet central après la chute de la dynastie Qing. Une armée Qing d’environ 2 000 hommes était entrée à Lhassa en février 1910, et le 13e dalaï-lama s’était enfui en Inde britannique. Lorsque la nouvelle du soulèvement de Wuchang d’octobre 1911 parvint au Tibet, la garnison, qui n’était plus payée, se mutina, pilla et se divisa en factions. Au printemps 1912, le dalaï-lama, toujours en Inde, appela les Tibétains à se soulever ; des milices tibétaines commandées par Tsarong Dazang Dramdul assiégèrent les Chinois à Lhassa, où les mutins avaient pillé la ville et occupé le monastère de Sera, tandis que les garnisons de Gyantsé et de Shigatsé se rendaient et étaient renvoyées en Inde grâce à la médiation de l’agent commercial britannique David Macdonald. Un accord du 12 août 1912, conclu en présence de représentants népalais, obligea les Chinois de Lhassa à mettre leurs armes sous scellés et à partir dans les quinze jours. Les combats reprirent en septembre ; un second armistice, le 14 novembre, fut suivi le 12 décembre 1912 du départ de Lhassa des dernières troupes, commandées par Zhong Ying, qui rentrèrent par l’Inde. Le dalaï-lama revint à Lhassa en janvier 1913 et, le 13 février 1913, publia une proclamation que les Tibétains considèrent comme une déclaration d’indépendance. La République de Chine maintint sa revendication sur le Tibet ; une armée du Sichuan, qui réoccupa une grande partie du Kham en 1912, ne s’avança pas dans le Tibet central après les protestations britanniques d’août 1912. De 1913 à 1950, le gouvernement du dalaï-lama administra lui-même le Tibet central et occidental, bien qu’aucun grand État ne l’ait reconnu comme indépendant.
