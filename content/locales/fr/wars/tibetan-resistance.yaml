# French translations of the catalogue text (wave 9); step bodies follow later.
Tibetan armed resistance: Résistance armée tibétaine
? Guerrilla resistance to Chinese rule by Tibetans, chiefly Khampas from Kham, from 1956 to 1974. Kham and Amdo lay outside the territory of the Lhasa government and were governed as parts of Sichuan, Qinghai, Gansu and Yunnan, where land reform and campaigns against monasteries and chiefs began in the mid-1950s. Revolts broke out across eastern Kham early in 1956; the PLA besieged monasteries and in March 1956 bombed the monastery of Lithang from the air. Refugees and fighters moved west into central Tibet, and on 16 June 1958 the Khampa trader Andrug Gompo Tashi formed the Chushi Gangdruk (“Four Rivers, Six Ranges”) in Lhoka, south of Lhasa, while revolts spread through Amdo. From 1957 the CIA trained Tibetans on Saipan and at Camp Hale in Colorado, 259 there in all, and dropped some of them with arms into Tibet, where most were killed. The guerrillas held much of Lhoka in 1958–1959 and escorted the Dalai Lama to India in March 1959 (see the 1959 Tibetan uprising). After the PLA crushed the revolt inside Tibet, the CIA funded a base in Mustang in northern Nepal, where about 2,000 fighters under Baba Yeshi gathered from 1960 and raided across the border; a raid in 1961 captured a satchel of PLA documents. American support was reduced as the United States sought better relations with China and ended in 1974. That year, under Chinese pressure, Nepal’s army moved into Mustang; the Dalai Lama urged the guerrillas to lay down their arms, most surrendered, and their commander Gyatotsang Wangdu was killed in an ambush near the Tinkar pass as he tried to reach India. The number of people killed in Kham and Amdo is not known.
: La guérilla menée contre la domination chinoise par des Tibétains, principalement des Khampas du Kham, de 1956 à 1974. Le Kham et l’Amdo se trouvaient hors du territoire du gouvernement de Lhassa et étaient administrés comme parties du Sichuan, du Qinghai, du Gansu et du Yunnan, où la réforme agraire et les campagnes contre les monastères et les chefs commencèrent au milieu des années 1950. Des révoltes éclatèrent dans tout l’est du Kham au début de 1956 ; l’APL assiégea des monastères et, en mars 1956, bombarda par avion le monastère de Lithang. Réfugiés et combattants se dirigèrent vers l’ouest, dans le Tibet central, et le 16 juin 1958 le marchand khampa Andrug Gompo Tashi fonda le Chushi Gangdruk (« Quatre fleuves, six chaînes ») dans le Lhoka, au sud de Lhassa, tandis que des révoltes s’étendaient à l’Amdo. À partir de 1957, la CIA forma des Tibétains à Saipan et à Camp Hale, dans le Colorado, où 259 furent formés au total, et en parachuta certains avec des armes au Tibet, où la plupart furent tués. Les guérilleros tinrent une grande partie du Lhoka en 1958–1959 et escortèrent le dalaï-lama jusqu’en Inde en mars 1959 (voir le soulèvement tibétain de 1959). Après que l’APL eut écrasé la révolte à l’intérieur du Tibet, la CIA finança une base au Mustang, dans le nord du Népal, où environ 2 000 combattants commandés par Baba Yeshi se rassemblèrent à partir de 1960 et menèrent des raids de l’autre côté de la frontière ; un raid de 1961 permit de saisir une sacoche de documents de l’APL. Le soutien américain diminua à mesure que les États-Unis cherchaient à améliorer leurs relations avec la Chine, et prit fin en 1974. Cette année-là, sous la pression chinoise, l’armée népalaise entra au Mustang ; le dalaï-lama exhorta les guérilleros à déposer les armes, la plupart se rendirent, et leur commandant Gyatotsang Wangdu fut tué dans une embuscade près du col de Tinkar alors qu’il tentait de gagner l’Inde. Le nombre de personnes tuées dans le Kham et l’Amdo n’est pas connu.
