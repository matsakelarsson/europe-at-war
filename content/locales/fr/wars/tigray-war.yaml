# French translations of the catalogue text (wave 12); step bodies follow later.
Tigray War: Guerre du Tigré
? A war in northern Ethiopia between the federal government of Prime Minister Abiy Ahmed, allied with Eritrea and the forces of the Amhara region, and the Tigray People’s Liberation Front (TPLF), which had dominated Ethiopia’s government until 2018 and still ruled the Tigray region. It began on the night of 3–4 November 2020 when Tigrayan forces seized the bases of the federal army’s Northern Command. Federal, Amhara and Eritrean forces took Mekelle within a month, and Amhara forces occupied Western Tigray, from which Tigrayans were driven out. Massacres, mass rape and the looting and blockade of the region followed, and by mid-2021 hundreds of thousands of people in Tigray faced famine. In June 2021 the Tigray Defense Forces retook Mekelle and then advanced deep into the Amhara and Afar regions, coming within about 200 km of Addis Ababa in November, before a government counteroffensive built on drones drove them back. After a truce in 2022 and a last offensive by Ethiopian and Eritrean forces, the African Union brokered a cessation of hostilities signed in Pretoria on 2 November 2022. Estimates of the dead, most of them civilians who died of violence, hunger and lack of care, range from about 100,000 to 600,000.
: Une guerre dans le nord de l’Éthiopie entre le gouvernement fédéral du Premier ministre Abiy Ahmed, allié à l’Érythrée et aux forces de la région Amhara, et le Front populaire de libération du Tigré (TPLF), qui avait dominé le gouvernement éthiopien jusqu’en 2018 et gouvernait encore la région du Tigré. Elle commença dans la nuit du 3 au 4 novembre 2020, lorsque les forces tigréennes s’emparèrent des bases du commandement Nord de l’armée fédérale. Les forces fédérales, amharas et érythréennes prirent Mekelle en moins d’un mois, et les forces amharas occupèrent le Tigré occidental, d’où les Tigréens furent chassés. Suivirent des massacres, des viols de masse, le pillage et le blocus de la région et, à la mi-2021, des centaines de milliers de personnes étaient menacées de famine au Tigré. En juin 2021, les Forces de défense du Tigré reprirent Mekelle, puis s’enfoncèrent profondément dans les régions Amhara et Afar, arrivant en novembre à environ 200 km d’Addis-Abeba, avant qu’une contre-offensive gouvernementale fondée sur les drones ne les repousse. Après une trêve en 2022 et une dernière offensive des forces éthiopiennes et érythréennes, l’Union africaine négocia une cessation des hostilités, signée à Pretoria le 2 novembre 2022. Les estimations du nombre de morts, pour la plupart des civils victimes de la violence, de la faim et du manque de soins, vont d’environ 100 000 à 600 000.
