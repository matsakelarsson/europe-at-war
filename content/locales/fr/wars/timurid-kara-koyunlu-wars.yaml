# French translations of the catalogue text (wave 7); step bodies follow later.
Timurid–Kara Koyunlu wars: Guerres entre Timourides et Kara Koyunlu
? Shah Rukh’s three campaigns against the Kara Koyunlu (Black Sheep) Turkmen, who had taken Azerbaijan, Armenia and Iraq from the Timurids and the Jalayirids after Timur’s death. Qara Yusuf died in late 1420 as the first campaign began, and his sons fought over the succession. In 1421 Shah Rukh defeated Iskandar in a hard battle at Alashkert (Eleşkirt) and briefly occupied Tabriz, whose artists and calligraphers his son Baysunghur took to Herat. Iskandar won back Azerbaijan, and in 1429 Shah Rukh beat him again near Salmas and installed his brother Abu Said, whom Iskandar killed in 1431. A third campaign in 1434–1435 drove Iskandar out, and in 1436 Shah Rukh made another brother, Jahan Shah, ruler of Tabriz as his vassal; Iskandar was defeated by Jahan Shah and murdered by his own son at the fortress of Alinja. The Armenian chronicler Tovma Metsopetsi describes the wars as a catastrophe for Armenia, with towns sacked and many people carried off as slaves. After Shah Rukh’s death in 1447 Jahan Shah threw off Timurid rule.
: Les trois campagnes de Shah Rukh contre les Turkmènes Kara Koyunlu (« Moutons Noirs »), qui avaient pris l’Azerbaïdjan, l’Arménie et l’Irak aux Timourides et aux Djalayirides après la mort de Tamerlan. Qara Yusuf mourut à la fin de 1420, au moment où commençait la première campagne, et ses fils se disputèrent sa succession. En 1421, Shah Rukh vainquit Iskandar au terme d’une rude bataille à Alashkert (Eleşkirt) et occupa brièvement Tabriz, dont son fils Baysunghur emmena les artistes et les calligraphes à Hérat. Iskandar reprit l’Azerbaïdjan ; en 1429, Shah Rukh le battit de nouveau près de Salmas et mit en place Abu Said, frère d’Iskandar, que celui-ci tua en 1431. Une troisième campagne, en 1434–1435, chassa Iskandar, et en 1436 Shah Rukh fit d’un autre de ses frères, Jahan Shah, le souverain de Tabriz sous sa suzeraineté ; Iskandar fut vaincu par Jahan Shah et assassiné par son propre fils dans la forteresse d’Alinja. Le chroniqueur arménien Tovma Metsopetsi décrit ces guerres comme une catastrophe pour l’Arménie, dont les villes furent mises à sac et dont de nombreux habitants furent emmenés en esclavage. Après la mort de Shah Rukh en 1447, Jahan Shah s’affranchit de la tutelle timouride.
