# French translations of the catalogue text (wave 7); step bodies follow later.
Timurid succession war: Guerre de succession timouride
The struggle among Timur’s sons and grandsons after his death at Otrar on 18 February 1405, on campaign against Ming China. His grandson Khalil Sultan seized Samarkand and the treasury; Pir Muhammad, the grandson Timur is said to have named as heir, was beaten by Khalil and murdered by one of his own nobles in 1407; and Timur’s youngest son, Shah Rukh, held Khorasan from Herat. In the west the Kara Koyunlu and the Jalayirids returned. Qara Yusuf beat Abu Bakr at Nakhchivan in October 1406 and on 20 April 1408 defeated and killed Miran Shah at Sardrud near Tabriz, ending Timurid rule in Azerbaijan. Khalil Sultan lost the support of his emirs in a famine, and Shah Rukh entered Samarkand unopposed on 13 May 1409. He gave it to his son Ulugh Beg and ruled the empire from Herat until 1447; Khalil was made governor of Ray, where he died in 1411.: La lutte entre les fils et petits-fils de Tamerlan après sa mort à Otrar, le 18 février 1405, alors qu’il était en campagne contre la Chine des Ming. Son petit-fils Khalil Sultan s’empara de Samarcande et du trésor ; Pir Muhammad, le petit-fils que Tamerlan aurait désigné comme héritier, fut battu par Khalil et assassiné par l’un de ses propres nobles en 1407 ; et le plus jeune fils de Tamerlan, Shah Rukh, tint le Khorassan depuis Hérat. À l’ouest, les Kara Koyunlu et les Djalayirides firent leur retour. Qara Yusuf battit Abu Bakr à Nakhitchevan en octobre 1406, puis, le 20 avril 1408, vainquit et tua Miran Shah à Sardroud, près de Tabriz, mettant fin à la domination timouride en Azerbaïdjan. Khalil Sultan perdit le soutien de ses émirs lors d’une famine, et Shah Rukh entra sans rencontrer de résistance à Samarcande le 13 mai 1409. Il la confia à son fils Ulugh Beg et gouverna l’empire depuis Hérat jusqu’en 1447 ; Khalil fut nommé gouverneur de Ray, où il mourut en 1411.
