# French translations of the catalogue text (wave 14); step bodies follow later.
Tivoli Incursion: Incursion de Tivoli
? The battle in West Kingston, Jamaica, in May 2010, when the security forces went into the Tivoli Gardens housing scheme to arrest Christopher “Dudus” Coke, wanted in the United States for drug and arms trafficking. Tivoli Gardens, built in the 1960s, was a stronghold of the Jamaica Labour Party (JLP) and part of Prime Minister Bruce Golding’s own constituency, and Coke, the leader of the Shower Posse, ruled it as a “don”, keeping order, giving out jobs and welfare and commanding armed men. The United States asked for his extradition in August 2009; Golding’s government resisted for nine months, arguing that the American evidence came from illegal wiretaps, and was found to have paid a US law firm, Manatt, Phelps & Phillips, to lobby in Washington on the case. Under mounting pressure Golding announced on 17 May 2010 that the extradition would go ahead. Coke’s supporters barricaded the approaches to Tivoli Gardens with vehicles, wire and explosives, and on 23 May gunmen attacked and burned police stations in West Kingston. The government declared a state of emergency in Kingston and St Andrew, and on 24 May more than 1,000 police of the Jamaica Constabulary Force and soldiers of the Jamaica Defence Force stormed the area; the army fired 37 mortar rounds into it, and a US surveillance aircraft filmed the operation, which the government at first denied. Coke was not found. In the fighting of the next few days more than 70 people were killed, nearly all of them civilians of West Kingston (the Public Defender counted 74 civilians and one soldier; other counts range from 73 to 77 dead), and more than 700 men were detained, most of them later released. Coke was arrested at a police checkpoint near Kingston on 22 June 2010 and extradited to New York on 24 June; he pleaded guilty to racketeering and assault charges and was sentenced in 2012 to 23 years in prison. The West Kingston Commission of Enquiry, chaired by Sir David Simmons, reported in June 2016 that the mortar fire was a serious error of judgement and named 15 people who may have been killed unlawfully by the police.
: La bataille de West Kingston, en Jamaïque, en mai 2010, lorsque les forces de sécurité pénétrèrent dans le quartier d’habitat social de Tivoli Gardens pour arrêter Christopher « Dudus » Coke, recherché aux États-Unis pour trafic de drogue et d’armes. Construit dans les années 1960, Tivoli Gardens était un bastion du Parti travailliste jamaïcain (JLP) et faisait partie de la circonscription du Premier ministre Bruce Golding lui-même, et Coke, chef du Shower Posse, y régnait en « don », maintenant l’ordre, distribuant emplois et aides sociales et commandant des hommes armés. Les États-Unis demandèrent son extradition en août 2009 ; le gouvernement Golding résista pendant neuf mois, arguant que les preuves américaines provenaient d’écoutes illégales, et l’on découvrit qu’il avait payé un cabinet d’avocats américain, Manatt, Phelps & Phillips, pour faire du lobbying à Washington sur cette affaire. Sous une pression croissante, Golding annonça le 17 mai 2010 que l’extradition aurait lieu. Les partisans de Coke barricadèrent les accès de Tivoli Gardens avec des véhicules, du fil de fer et des explosifs, et le 23 mai des hommes armés attaquèrent et incendièrent des postes de police de West Kingston. Le gouvernement déclara l’état d’urgence à Kingston et à Saint Andrew et, le 24 mai, plus de 1 000 policiers de la Jamaica Constabulary Force et soldats de la Force de défense de la Jamaïque donnèrent l’assaut au quartier ; l’armée y tira 37 obus de mortier, et un avion de surveillance américain filma l’opération, ce que le gouvernement nia d’abord. Coke resta introuvable. Dans les combats des jours suivants, plus de 70 personnes furent tuées, presque toutes des civils de West Kingston (le Défenseur public dénombra 74 civils et un soldat ; d’autres décomptes vont de 73 à 77 morts), et plus de 700 hommes furent détenus, pour la plupart libérés ensuite. Coke fut arrêté à un barrage de police près de Kingston le 22 juin 2010 et extradé vers New York le 24 juin ; il plaida coupable de racket et de voies de fait, et fut condamné en 2012 à 23 ans de prison. La commission d’enquête sur West Kingston, présidée par Sir David Simmons, conclut en juin 2016 que les tirs de mortier avaient été une grave erreur d’appréciation et nomma 15 personnes qui pourraient avoir été tuées illégalement par la police.
