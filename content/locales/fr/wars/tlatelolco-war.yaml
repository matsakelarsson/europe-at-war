# French translations of the catalogue text (wave 14); step bodies follow later.
Tlatelolco War: Guerre de Tlatelolco
? "The war in which Tenochtitlan conquered Tlatelolco, its twin Mexica city on the north of the same island in Lake Texcoco. Tlatelolco had its own rulers and held the greatest market in central Mexico; it had fought beside Tenochtitlan against the Tepanecs but was not one of the three partners of the Triple Alliance. Its ruler Moquihuix was married to Chalchiuhnenetzin, the sister of Axayacatl, who had become ruler of Tenochtitlan in 1469. The sources give different causes: insults and fights between young nobles of the two cities in the market, a canal dug by Tlatelolco and filled in, and Moquihuix’s ill-treatment of his wife, who is said to have warned her brother that her husband was plotting war. According to the Dominican Diego Durán, a Tlatelolca night attack on Tenochtitlan was beaten off, and Axayacatl’s warriors then pushed into Tlatelolco and its market square. Moquihuix and his adviser Teconal took refuge on top of the great temple, where Axayacatl killed them, or, in the Codex Mendoza, Moquihuix threw himself down the steps. The chronicler Chimalpahin says the fighting lasted a year. Tlatelolco lost its dynasty and was ruled by military governors appointed from Tenochtitlan, and it paid tribute like a conquered town, though its people kept a separate identity. In 1521 Tlatelolco was the last part of the city to hold out against the Spaniards."
: "La guerre au cours de laquelle Tenochtitlan conquit Tlatelolco, la cité mexica jumelle située au nord de la même île du lac Texcoco. Tlatelolco avait ses propres souverains et abritait le plus grand marché du centre du Mexique ; elle avait combattu aux côtés de Tenochtitlan contre les Tépanèques, mais n’était pas l’un des trois partenaires de la Triple Alliance. Son souverain Moquihuix avait épousé Chalchiuhnenetzin, sœur d’Axayacatl, devenu souverain de Tenochtitlan en 1469. Les sources donnent des causes différentes : des insultes et des rixes entre jeunes nobles des deux cités sur le marché, un canal creusé par Tlatelolco puis comblé, et les mauvais traitements infligés par Moquihuix à son épouse, qui aurait averti son frère que son mari préparait la guerre. Selon le dominicain Diego Durán, une attaque nocturne des Tlatelolcas contre Tenochtitlan fut repoussée, puis les guerriers d’Axayacatl pénétrèrent dans Tlatelolco et jusque sur sa place du marché. Moquihuix et son conseiller Teconal se réfugièrent au sommet du grand temple, où Axayacatl les tua, à moins que, selon le Codex Mendoza, Moquihuix ne se soit jeté du haut des marches. Le chroniqueur Chimalpahin affirme que les combats durèrent un an. Tlatelolco perdit sa dynastie et fut placée sous l’autorité de gouverneurs militaires nommés par Tenochtitlan ; elle paya tribut comme une ville conquise, bien que ses habitants aient conservé une identité distincte. En 1521, Tlatelolco fut la dernière partie de la ville à résister aux Espagnols."
