# Some French text was translated automatically.
"Toggenburg War (Second War of Villmergen)": "Guerre de Toggenburg (deuxième guerre de Villmergen)"
"The last religious war of the old Swiss Confederacy, which grew out of a long dispute between the Prince-Abbot of St Gall and his mostly Protestant subjects in the Toggenburg valley. In April 1712 Zürich and Bern took the Toggenburgers’ side against the abbot, and the five Catholic cantons of central Switzerland joined him. The Protestant armies occupied the Thurgau and the abbey’s lands, took Mellingen, won at Bremgarten on 26 May and then took Baden. A first peace agreed at Aarau in July was rejected by the inner cantons, and on 25 July the Bernese decisively beat the Catholic army at Villmergen, where more than 3,000 men died. The Peace of Aarau of 11 August 1712 took the county of Baden and the lower Freie Ämter from the Catholic cantons, joining Zürich’s and Bern’s territories, and ended the Catholic majority’s control of the common lordships with equal rights for both faiths.": "La dernière guerre religieuse de l’ancienne Confédération suisse, qui est née d’une longue dispute entre le prince-abbé de Saint-Gall et ses sujets principalement protestants dans la vallée de Toggenburg. En avril 1712 Zürich et Bern ont pris le parti des Toggenburgers () contre l’abbé, et les cinq cantons catholiques de Suisse centrale l’ont rejoint. Les armées protestantes occupèrent les terres de Thurgau et des abbayes, prirent Mellingen, remportèrent à Bremgarten le 26 mai puis prirent Baden. Une première paix convenue à Aarau en juillet fut rejetée par les cantons intérieurs, et le 25 juillet les Bernois battèrent résolument l’armée catholique à Villmergen, où plus de 3 000 hommes moururent. La paix d’Aarau du 11 août 1712 prit le comté de Baden et la basse Freie Ämter des cantons catholiques, rejoignant les territoires de Zurich et de Berne, et mit fin au contrôle par la majorité catholique des seigneuries communes avec des droits égaux pour les deux confessions."
"Also called the Zwölferkrieg. Geneva, Neuchâtel and Biel supported Zürich and Bern, and the Valais the Catholic side; Basel, Schaffhausen, Fribourg, Solothurn, Glarus and Appenzell stayed neutral.": "Genève, Neuchâtel et Biel ont soutenu Zürich et Berne, et le Valais du côté catholique ; Bâle, Schaffhausen, Fribourg, Soleure, Glarus et Appenzell sont restés neutres."
"The abbot regained the Toggenburg in the Peace of Baden in 1718. The Catholic cantons, angry at the loss of Baden, refused to meet there, and the Diet moved to Frauenfeld in 1713.": "L’abbé reprit le Toggenburg dans la paix de Baden en 1718. Les cantons catholiques, en colère contre la perte de Baden, refusèrent de s’y rencontrer, et la Diète déménagea à Frauenfeld en 1713."
