# French translations of the catalogue text (wave 13); step bodies follow later.
Togoland campaign: Campagne du Togoland
? The British and French conquest of the German colony of Togoland in August 1914, the first Allied campaign of the First World War. Germany had ruled Togoland since 1884; its value to Berlin in 1914 lay in the new wireless station at Kamina, near Atakpamé, which linked Germany with its colonies, its warships and South America. The acting governor, Major Hans-Georg von Doering, had only about 1,500 police, reservists and levies, and offered neutrality, which Britain refused. French troops from Dahomey crossed the Mono on 6 August and took Aného; the British from the Gold Coast entered Lomé, which the Germans gave up without a fight, and advanced up the railway towards Kamina while smaller French and British columns closed in from the east, the west and the north. The German police delayed them at Agbeluvoe (15 August) and on the Khra river (22 August), then blew up the wireless masts and surrendered unconditionally on 26 August. Britain and France divided the colony between them; in 1922 it became the League of Nations mandates of British Togoland, which joined Ghana in 1957, and French Togoland, independent as Togo in 1960. The partition cut through the lands of the Ewe.
: La conquête britannique et française de la colonie allemande du Togoland en août 1914, première campagne alliée de la Première Guerre mondiale. L’Allemagne gouvernait le Togoland depuis 1884 ; sa valeur pour Berlin, en 1914, tenait à la nouvelle station de radiotélégraphie de Kamina, près d’Atakpamé, qui reliait l’Allemagne à ses colonies, à ses navires de guerre et à l’Amérique du Sud. Le gouverneur par intérim, le major Hans-Georg von Doering, ne disposait que d’environ 1 500 policiers, réservistes et hommes levés sur place, et proposa la neutralité, que la Grande-Bretagne refusa. Les troupes françaises venues du Dahomey franchirent le Mono le 6 août et prirent Aného ; les Britanniques venus de la Côte-de-l’Or entrèrent dans Lomé, que les Allemands abandonnèrent sans combat, et remontèrent la voie ferrée vers Kamina, tandis que des colonnes françaises et britanniques plus petites convergeaient depuis l’est, l’ouest et le nord. La police allemande les retarda à Agbeluvoe (15 août) et sur la rivière Khra (22 août), puis fit sauter les pylônes de la station et se rendit sans conditions le 26 août. La Grande-Bretagne et la France se partagèrent la colonie ; en 1922, elle devint les mandats de la Société des Nations du Togoland britannique, rattaché au Ghana en 1957, et du Togo français, devenu indépendant sous le nom de Togo en 1960. Le partage coupa en deux le pays des Ewe.
