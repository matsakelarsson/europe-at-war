# French translations of the catalogue text (wave 10); step bodies follow later.
Toi invasion: Invasion des Toi
? A raid on Tsushima, Iki and northern Kyushu by a fleet of about 50 ships, manned mostly by Jurchens from the north-east coast of the Korean peninsula, whom the Japanese called Toi, from a Korean word for the peoples to the east. From 5 May 1019 (the 28th day of the third month) the raiders plundered Tsushima and then Iki, where the governor and his 147 men were killed and the provincial temple was burned, and in mid-May the districts of Ito, Shima and Sawara in Chikuzen, carrying off people and killing cattle for food. They camped on Nokonoshima in Hakata Bay, but their attack on the guard post at Hakata was beaten off by warriors under Fujiwara no Takaie, the acting governor-general of the Dazaifu, and Ōkura no Taneki, and a landing at Matsuura in Hizen was repelled by local warriors. The Dazaifu counted 364 people killed and 1,280 carried off, and some 380 horses and cattle lost. Takaie forbade his pursuing ships to go beyond Tsushima into Korean waters. On their way home the raiders went on plundering the Korean coast until the Goryeo navy destroyed their fleet; about 270 Japanese captives were freed and sent back to Tsushima by a Goryeo envoy, Jeong Ja-ryang. The court in Kyoto at first took the raiders for Goryeo forces, and it learned who they were only from a Tsushima official who had crossed to Korea to look for his family.
: Un raid contre Tsushima, Iki et le nord de Kyushu, mené par une flotte d’environ 50 navires montés pour la plupart par des Jurchen de la côte nord-est de la péninsule coréenne, que les Japonais appelaient Toi, d’après un mot coréen désignant les peuples de l’Est. À partir du 5 mai 1019 (le 28e jour du troisième mois), les pillards ravagèrent Tsushima, puis Iki, où le gouverneur et ses 147 hommes furent tués et le temple provincial incendié, puis, à la mi-mai, les districts d’Ito, de Shima et de Sawara, dans le Chikuzen, emmenant des habitants et abattant le bétail pour se nourrir. Ils campèrent sur Nokonoshima, dans la baie de Hakata, mais leur attaque contre le poste de garde de Hakata fut repoussée par des guerriers commandés par Fujiwara no Takaie, gouverneur général par intérim du Dazaifu, et par Ōkura no Taneki, et un débarquement à Matsuura, dans le Hizen, fut repoussé par des guerriers locaux. Le Dazaifu dénombra 364 personnes tuées et 1 280 emmenées, ainsi que quelque 380 chevaux et bovins perdus. Takaie interdit à ses navires lancés à leur poursuite d’aller au-delà de Tsushima, dans les eaux coréennes. Sur le chemin du retour, les pillards continuèrent de ravager la côte coréenne jusqu’à ce que la marine du Goryeo détruise leur flotte ; environ 270 captifs japonais furent libérés et renvoyés à Tsushima par un envoyé du Goryeo, Jeong Ja-ryang. La cour de Kyoto prit d’abord les pillards pour des forces du Goryeo, et elle n’apprit qui ils étaient que par un fonctionnaire de Tsushima qui était passé en Corée pour rechercher sa famille.
