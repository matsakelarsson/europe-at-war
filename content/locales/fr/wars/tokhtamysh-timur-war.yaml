# French translations of the catalogue text (wave 7); step bodies follow later.
Tokhtamysh–Timur war: Guerre entre Tokhtamych et Tamerlan
The war between Timur, master of Transoxiana and Iran, and Tokhtamysh, khan of the Golden Horde, whom Timur had helped to power a decade earlier. Tokhtamysh, who had reunited the Horde and sacked Moscow in 1382, claimed Azerbaijan and Khwarazm and resented Timur’s growing power. He attacked Timur’s army in Karabakh in 1387 and raided Transoxiana while Timur was in Iran. Timur answered with two great campaigns into the steppe. In 1391 he marched across the Kazakh steppe and defeated Tokhtamysh on the Kondurcha, near the Volga; in 1395 he crossed the Caucasus, defeated him again on the Terek, and then sacked the cities of the Golden Horde, from Tana on the Sea of Azov to Astrakhan and Sarai on the Volga. The Golden Horde never recovered its strength, and Tokhtamysh, overthrown by Edigu, died a fugitive in Siberia around 1406.: La guerre entre Tamerlan, maître de la Transoxiane et de l’Iran, et Tokhtamych, khan de la Horde d’or, que Tamerlan avait aidé à prendre le pouvoir une décennie plus tôt. Tokhtamych, qui avait réunifié la Horde et mis à sac Moscou en 1382, revendiquait l’Azerbaïdjan et le Khwarezm et voyait d’un mauvais œil la puissance croissante de Tamerlan. Il attaqua l’armée de Tamerlan au Karabagh en 1387 et lança des raids sur la Transoxiane pendant que Tamerlan se trouvait en Iran. Tamerlan riposta par deux grandes campagnes dans la steppe. En 1391, il traversa la steppe kazakhe et battit Tokhtamych sur la Kondourtcha, près de la Volga ; en 1395, il franchit le Caucase, le battit de nouveau sur le Terek, puis mit à sac les villes de la Horde d’or, de Tana, sur la mer d’Azov, jusqu’à Astrakhan et Saraï, sur la Volga. La Horde d’or ne retrouva jamais sa puissance, et Tokhtamych, renversé par Edigu, mourut en fugitif en Sibérie vers 1406.
