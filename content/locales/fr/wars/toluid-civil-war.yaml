# French translations of the catalogue text (wave 9); step bodies follow later.
Toluid civil war: Guerre civile toluide
? The war of succession between two grandsons of Genghis Khan, the brothers Kublai and Ariq Böke, sons of Tolui, after the death of the Great Khan Möngke at the siege of Diaoyu in Sichuan in August 1259. Ariq Böke, left in charge at Karakorum, had the backing of most of Möngke’s family and court; Kublai, who commanded the armies in China, had himself elected Great Khan at Kaiping (later Shangdu) on 5 May 1260, and Ariq Böke was proclaimed at Karakorum a month later. Kublai’s generals won Gansu and the Hexi Corridor, and his blockade of grain from China starved Mongolia. Ariq Böke lost Karakorum twice, was beaten at Shimultai in 1261 and then fought Alghu, the Chagatayid khan he had installed, who had changed sides; his harsh rule in the Ili valley and famine cost him his followers, and on 21 August 1264 he surrendered to Kublai at Shangdu. The war left Kublai master of China and Mongolia, but the khans of the Golden Horde, the Chagatai lands and the house of Ögedei never fully accepted him, and the Mongol Empire was never again ruled as one.
: La guerre de succession entre deux petits-fils de Gengis Khan, les frères Kubilai et Ariq Böke, fils de Tolui, après la mort du grand khan Möngke au siège de Diaoyu, au Sichuan, en août 1259. Ariq Böke, resté aux commandes à Karakorum, avait le soutien de la plus grande partie de la famille et de la cour de Möngke ; Kubilai, qui commandait les armées en Chine, se fit élire grand khan à Kaiping (plus tard Shangdu) le 5 mai 1260, et Ariq Böke fut proclamé à Karakorum un mois plus tard. Les généraux de Kubilai gagnèrent le Gansu et le corridor du Hexi, et son blocus des grains de Chine affama la Mongolie. Ariq Böke perdit deux fois Karakorum, fut battu à Shimultai en 1261, puis combattit Alghu, le khan djaghataïde qu’il avait lui-même installé et qui avait changé de camp ; son gouvernement brutal dans la vallée de l’Ili et la famine lui coûtèrent ses partisans, et le 21 août 1264 il se rendit à Kubilai à Shangdu. La guerre laissa Kubilai maître de la Chine et de la Mongolie, mais les khans de la Horde d’or, des terres de Djaghataï et de la maison d’Ögedei ne l’acceptèrent jamais pleinement, et l’Empire mongol ne fut plus jamais gouverné comme un tout.
