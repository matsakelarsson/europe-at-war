# French translations of the catalogue text (wave 11); step bodies follow later.
French campaigns in Tonkin: Campagnes françaises au Tonkin
? The French conquest of Tonkin, the north of Nguyễn Vietnam (Đại Nam), in two attempts. In 1873 the naval officer Francis Garnier, sent from Saigon to settle a quarrel between the court and the arms trader Jean Dupuis over trade on the Red River, stormed the citadel of Hanoi and overran the delta, but he was killed by Liu Yongfu’s Black Flag Army outside Hanoi, and France withdrew under the treaty of 1874. In 1882 Henri Rivière took Hanoi again; his death at the Paper Bridge in May 1883 led France to send an expeditionary corps, attack Huế and force the court to accept a protectorate (August 1883). French armies took Sơn Tây from the Black Flags in December 1883 and Bắc Ninh and Hưng Hóa from the Chinese armies in Tonkin in March and April 1884, and the Treaty of Huế of June 1884 made the protectorate final. The clash with China that followed is told as the Sino-French War; after it the French fought local resistance across Tonkin and declared the country under control in April 1886, though fighting went on for another decade.
: La conquête française du Tonkin, le nord du Vietnam des Nguyễn (Đại Nam), en deux tentatives. En 1873, l’officier de marine Francis Garnier, envoyé de Saïgon pour régler un différend entre la cour et le marchand d’armes Jean Dupuis au sujet du commerce sur le fleuve Rouge, prit d’assaut la citadelle de Hanoï et s’empara du delta, mais il fut tué par l’armée des Pavillons noirs de Liu Yongfu aux abords de Hanoï, et la France se retira aux termes du traité de 1874. En 1882, Henri Rivière reprit Hanoï ; sa mort au pont de Papier, en mai 1883, conduisit la France à envoyer un corps expéditionnaire, à attaquer Huế et à contraindre la cour à accepter un protectorat (août 1883). Les armées françaises prirent Sơn Tây aux Pavillons noirs en décembre 1883, puis Bắc Ninh et Hưng Hóa aux armées chinoises du Tonkin en mars et avril 1884, et le traité de Huế de juin 1884 rendit le protectorat définitif. L’affrontement avec la Chine qui suivit est raconté sous le titre de guerre franco-chinoise ; après celle-ci, les Français combattirent la résistance locale dans tout le Tonkin et déclarèrent le pays sous contrôle en avril 1886, bien que les combats se soient poursuivis pendant une décennie encore.
