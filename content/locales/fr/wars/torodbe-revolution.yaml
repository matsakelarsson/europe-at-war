# French translations of the catalogue text (wave 13); step bodies follow later.
Torodbe revolution in Futa Toro: Révolution torodo au Fouta-Toro
? The Islamic revolution that overthrew the Denianke kings of Futa Toro, in the middle Senegal valley, set up an imamate ruled by elected clerics of the Torodbe class, and carried its wars to the neighbouring Moorish emirates and Wolof kingdoms. The Denianke had lost the support of the farmers of the valley by failing to protect them from raids by the nomads north of the river. From about 1769 the cleric Sulayman Bal led a movement against them, and in 1776 the Torodbe drove them from power; Sulayman Bal was killed in battle that year, and the Torodbe chose as first almami (imam) Abdul Kader Kan, a teacher and judge who had studied in Cayor and Mauritania. Ruling from Thilogne, he defeated the Brakna Moors, fought the last Denianke satigi, Sule Bubu Gayssiri, in western Futa until Sule’s death, defeated the buurba of Jolof in 1785 and, allied with the Brakna, defeated the Trarza near Dagana in 1786, killing their emir Ali Kouri. The new state banned the slave trade on its stretch of the river, and in 1785 the French at Saint-Louis agreed to stop buying Muslim slaves and to pay customs to Futa. Cayor and Waalo at first accepted Abdul Kader’s authority, but Amari Ngoone Ndella, damel of Cayor from 1790, broke with him and crushed a rising of Cayor’s clerics, selling many into slavery. In 1796 Abdul Kader, allied with Jolof, invaded Cayor with what was said to be the largest army ever seen in Senegambia; the damel poisoned the wells of his eastern provinces, and at Bungoy (Bunxoy) the exhausted Futa army was routed and Abdul Kader captured. Amari Ngoone treated him with honour and sent him home once Futa had chosen a new almami. The revolution’s expansion ended there; Abdul Kader was killed in 1806 in a war with Bundu and Kaarta.
: La révolution islamique qui renversa les rois denianké du Fouta-Toro, dans la moyenne vallée du Sénégal, instaura un imamat gouverné par des clercs élus issus de la classe des Torodbe et porta ses guerres dans les émirats maures et les royaumes wolof voisins. Les Denianké avaient perdu le soutien des cultivateurs de la vallée, faute de les protéger des raids des nomades établis au nord du fleuve. À partir de 1769 environ, le clerc Souleymane Baal mena un mouvement contre eux, et en 1776 les Torodbe les chassèrent du pouvoir ; Souleymane Baal fut tué au combat cette année-là, et les Torodbe choisirent comme premier almamy (imam) Abdoul Kader Kane, maître et cadi qui avait étudié au Cayor et en Mauritanie. Gouvernant depuis Thilogne, il vainquit les Maures brakna, combattit dans l’ouest du Fouta le dernier satigi denianké, Sule Bubu Gayssiri, jusqu’à la mort de celui-ci, vainquit le bourba du Djolof en 1785 et, allié aux Brakna, battit les Trarza près de Dagana en 1786, tuant leur émir Ali Kouri. Le nouvel État interdit la traite des esclaves sur son tronçon du fleuve, et en 1785 les Français de Saint-Louis acceptèrent de ne plus acheter d’esclaves musulmans et de payer des droits de douane au Fouta. Le Cayor et le Waalo acceptèrent d’abord l’autorité d’Abdoul Kader, mais Amari Ngoone Ndella, damel du Cayor à partir de 1790, rompit avec lui et écrasa un soulèvement des clercs du Cayor, dont il vendit beaucoup comme esclaves. En 1796, Abdoul Kader, allié au Djolof, envahit le Cayor avec ce qui passait pour la plus grande armée jamais vue en Sénégambie ; le damel fit empoisonner les puits de ses provinces orientales, et à Bungoy (Bunxoy) l’armée du Fouta, épuisée, fut mise en déroute et Abdoul Kader capturé. Amari Ngoone le traita avec honneur et le renvoya chez lui une fois que le Fouta eut choisi un nouvel almamy. L’expansion de la révolution s’arrêta là ; Abdoul Kader fut tué en 1806 dans une guerre contre le Boundou et le Kaarta.
