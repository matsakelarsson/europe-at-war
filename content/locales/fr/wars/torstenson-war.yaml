"Torstenson War": "Guerre de Torstenson"
"A war in which Sweden, in the middle of the Thirty Years’ War, attacked Denmark–Norway from Germany and from Sweden. By the Peace of Brömsebro in 1645 Denmark–Norway lost Gotland, Ösel, Jämtland and Härjedalen, handed over Halland for 30 years and freed Swedish ships from the Sound Dues.": "Une guerre dans laquelle la Suède, au milieu de la guerre de Trente Ans, attaqua le Danemark-Norvège d’Allemagne et de Suède. Par la paix de Brömsebro en 1645 Danemark-Norvège perd Gotland, Ösel, Jämtland et Härjedalen, remis Halland pendant 30 ans et libéré les navires suédois du Sound Dues."
"Dates in Germany and Poland are New Style (Gregorian); Scandinavian dates are mostly Old Style (Julian), as usually cited, which ran ten days behind.": "Les dates en Allemagne et en Pologne sont New Style (Gregorian) ; les dates scandinaves sont pour la plupart Old Style (Julian), comme on le cite habituellement, qui a duré dix jours."
