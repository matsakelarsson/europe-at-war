"In the middle of the German war Sweden turned on Denmark–Norway. Torstenson overran Jutland from the south in December 1643 and January 1644, Gustav Horn invaded Scania, and a Swedish-Dutch fleet destroyed the Danish navy off Fehmarn in October 1644. Bremen and Verden were occupied in 1645.": "Au milieu de la guerre allemande, la Suède s’est tournée vers le Danemark et la Norvège. Torstenson a envahi Jutland du sud en décembre 1643 et janvier 1644, Gustav Horn a envahi Scania, et une flotte suédoise-néerlandaise a détruit la marine danoise au large de Fehmarn en octobre 1644. Brême et Verden ont été occupés en 1645."
"At the Peace of Brömsebro on 13 August 1645, Denmark–Norway gave up Gotland, Ösel, Jämtland, Härjedalen, Idre and Särna, handed over Halland for 30 years, and freed Swedish ships from the Sound Dues.": "À la Paix de Brömsebro, le 13 août 1645, le Danemark et la Norvège ont abandonné Gotland, Ösel, Jämtland, Härjedalen, Idre et Särna, remis Halland pendant 30 ans, et libéré les navires suédois des droits sonores."
