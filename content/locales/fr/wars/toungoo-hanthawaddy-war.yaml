# French translations of the catalogue text (wave 11); step bodies follow later.
Toungoo–Hanthawaddy War: Guerre entre Toungoo et Hanthawaddy
"The war in which the small Burmese kingdom of Toungoo, in the Sittaung valley, conquered Hanthawaddy, the larger and richer Mon-speaking kingdom of Lower Burma, and began the second unification of Burma. Toungoo’s young king Tabinshwehti and his general and brother-in-law, later known as Bayinnaung, raided Pegu without success in three dry seasons from 1534. In 1538 a ruse led King Takayutpi to execute his best ministers; he then abandoned Pegu, and Bayinnaung destroyed his retreating army at Naungyo. Tabinshwehti made Pegu his capital, won over the Mon lords and hired Portuguese gunners, and in May 1541, after a seven-month siege, took and sacked the port of Martaban, whose viceroy had held out with Portuguese help. This entry also tells in brief the wars that followed until 1547: the conquest of Prome (1542) against armies sent by Ava, the Confederation of Shan States and Arakan; Toungoo’s advance to Pagan (1544); and the failed invasion of Arakan, where Mrauk U held out in January 1547.": "La guerre au cours de laquelle le petit royaume birman de Toungoo, dans la vallée du Sittaung, conquit Hanthawaddy, le royaume de langue môn de Basse-Birmanie, plus grand et plus riche, et entama la deuxième unification de la Birmanie. Le jeune roi de Toungoo, Tabinshwehti, et son général et beau-frère, connu plus tard sous le nom de Bayinnaung, lancèrent sans succès des raids sur Pégou pendant trois saisons sèches à partir de 1534. En 1538, une ruse amena le roi Takayutpi à faire exécuter ses meilleurs ministres ; il abandonna ensuite Pégou, et Bayinnaung anéantit son armée en retraite à Naungyo. Tabinshwehti fit de Pégou sa capitale, gagna à sa cause les seigneurs môns et engagea des artilleurs portugais, et en mai 1541, après un siège de sept mois, il prit et saccagea le port de Martaban, dont le vice-roi avait résisté avec l’aide des Portugais. Cette notice retrace aussi brièvement les guerres qui suivirent jusqu’en 1547 : la conquête de Prome (1542) face aux armées envoyées par Ava, la Confédération des États shans et l’Arakan ; l’avancée de Toungoo jusqu’à Pagan (1544) ; et l’invasion manquée de l’Arakan, où Mrauk U résista en janvier 1547."
