# Some French text was translated automatically.
"Transnistria War": "Guerre de Transnistrie"
? "In September 1990 leaders on the left bank of the Dniester, where many people were Russian or Ukrainian speakers wary of Moldova’s moves towards Romania, proclaimed the Pridnestrovian Moldavian Republic. Clashes began that November and grew into war in March 1992, with fighting around Dubăsari and the bridgeheads over the river and, worst of all, in Bender (Tighina) on 19–21 June. Cossack and other volunteers from Russia and Ukraine joined the separatists, and the Russian 14th Army, stationed in the region, armed them; after its new commander, Alexander Lebed, arrived, its artillery struck Moldovan forces near Bender on 3 July, in effect ending the fighting. About 1,000 people were killed. A ceasefire signed by Boris Yeltsin and Mircea Snegur on 21 July 1992 created joint peacekeeping forces, and Transnistria has stayed outside Moldovan control, recognised by no member of the United Nations."
: "En septembre 1990, les dirigeants sur la rive gauche du Dniestr, où de nombreuses personnes étaient des locuteurs russes ou ukrainiens méfiant de Moldova se déplacent vers la Roumanie, ont proclamé la République moldave de Pridnestrovien. Les affrontements ont commencé en novembre et sont devenus la guerre en mars 1992, avec des combats autour de Dubăsari et les têtes de pont au-dessus du fleuve et, pire encore, à Bender (Tighina) les 19-21 juin. Cosaque et d’autres volontaires de Russie et d’Ukraine se sont joints aux séparatistes, et la 14ème armée russe, stationnée dans la région, les ont armés ; après que son nouveau commandant, Alexander Lebed, est arrivé, son artillerie a frappé les forces moldaves près de Bender le 3 juillet, mettant ainsi fin aux combats. Un cessez-le-feu signé par Boris Eltsine et Mircea Snegur le 21 juillet 1992 a créé des forces conjointes de maintien de la paix, et la Transnistrie est restée en dehors du contrôle moldave, reconnu par aucun membre des Nations Unies."
"Transnistria is shown as part of Moldova on the map, as it is internationally recognised. Casualty figures differ between Moldovan, Transnistrian and Russian sources.": "La Transnistrie est représentée sur la carte, car elle est reconnue internationalement. Les chiffres des pertes diffèrent entre les sources moldaves, transnistriennes et russes."
"Fighting had begun on a small scale at Dubăsari in November 1990; the war is usually dated from 2 March 1992.": "Les combats avaient commencé sur une petite échelle à Dubăsari en novembre 1990 ; la guerre date généralement du 2 mars 1992."
