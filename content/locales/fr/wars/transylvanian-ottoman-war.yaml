# Some French text was translated automatically.
"Transylvanian–Ottoman War (1658–1662)": "Guerre transylvanienne–Ottoman (1658-1662)"
? "The war in which the Ottoman Empire crushed the attempts of George II Rákóczi and then John Kemény to free the Principality of Transylvania from Ottoman control. Rákóczi’s unauthorised invasion of Poland in 1657 ended in disaster, and the grand vizier Köprülü Mehmed Pasha ordered him deposed. When he refused to go, an Ottoman and Crimean Tatar army invaded in 1658; the Tatars ravaged the country, burning Gyulafehérvár (Alba Iulia) and carrying off many thousands of people, and the Ottomans annexed Jenő and the districts of Lugos and Karánsebes and installed Ákos Barcsay as prince. Rákóczi fought on, but in May 1660 he was defeated near Gyalu (Szászfenes) and died of his wounds at Várad on 7 June. The Ottomans besieged Várad, the key fortress of eastern Hungary, which surrendered on 27 August 1660 and became the seat of a new province. John Kemény, elected prince on 1 January 1661, declared Transylvania’s break with the Porte and asked Vienna for help; Leopold I sent Raimondo Montecuccoli, but the imperial troops did little and withdrew. The Ottomans installed Michael I Apafi as prince, and Kemény was killed in battle at Nagyszőllős in January 1662. Transylvania survived as a smaller, poorer Ottoman vassal, and the conflict led directly to the Austro-Turkish War of 1663–1664."
: "La guerre dans laquelle l’Empire Ottoman a écrasé les tentatives de George II Rákóczi puis John Kemény pour libérer la Principauté de Transylvanie du contrôle ottoman. L’invasion non autorisée de la Pologne en 1657 s’est terminée par un désastre, et le grand vizier Köprülü Mehmed Pasha l’a ordonné déposé. Quand il refusa d’y aller, une armée tatare ottomane et de Crimée envahit en 1658 ; les Tatars ravagent le pays, brûlant Gyulafehérvár (Alba Iulia) et transportant des milliers de personnes, et les Ottomans annexent Jenő et les districts de Lugos et Karánsebes et installent Ákos Barcsay comme prince. Rákóczi combat, mais en mai 1660 il est défait près de Gyalu (Szászfenes) et meurt de ses blessures à Várad le 7 juin. Les Ottomans assiégés Várad, la forteresse principale de l’est de la Hongrie, qui s’est rendue le 27 août 1660 et est devenue le siège d’une nouvelle province. John Kemény, élu prince le 1er janvier 1661, déclara que les Transylvaniens rompaient avec la Porte et demanda l’aide de Vienne ; Léopold J’envoyai Raimondo Montecucoli, mais les troupes impériales firent peu et se retiraient. Les Ottomans installèrent Michael I Apafi comme prince, et Kemény fut tué dans la bataille à Nagyszőllős en janvier 1662. La Transylvanie a survécu comme un vassal ottoman plus petit et plus pauvre, et le conflit a conduit directement à la guerre austro-turque de 1663–1664."
"Dates are Gregorian. Sources differ by a day on the date of Kemény’s death (22 or 23 January 1662) and give different dates in May 1660 for the battle near Gyalu.": "Les sources diffèrent d’un jour à la date de la mort de Kemény (22 ou 23 janvier 1662) et donnent des dates différentes en mai 1660 pour la bataille près de Gyalu."
"Transylvanian politics in these years were split between Rákóczi and Kemény on one side and princes backed by the Ottomans, Francis Rhédey, Ákos Barcsay and Michael Apafi, on the other. Rákóczi’s Polish campaign of 1657 belongs to the Second Northern War, which has its own entry.": "La politique transylvanienne de ces années a été divisée entre Rákóczi et Kemény d’un côté et les princes soutenus par les Ottomans, Francis Rhédey, Ákos Barcsay et Michael Apafi de l’autre."
