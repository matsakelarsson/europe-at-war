# French translations of the catalogue text (wave 11); step bodies follow later.
Trịnh–Nguyễn war: Guerre entre les Trịnh et les Nguyễn
The intermittent war between the two families that ruled Đại Việt in the name of the powerless Lê emperors, the Trịnh lords in the north (Đàng Ngoài, known to Europeans as Tonkin) and the Nguyễn lords in the south (Đàng Trong, or Cochinchina). When the Nguyễn refused to send taxes and accept orders from the Trịnh-controlled court, Trịnh Tráng sent an army south in 1627. Over the next 45 years the Trịnh, with a much larger population, attacked seven times across the narrow coastal plain of Quảng Bình, but were held by the Nguyễn walls designed by Đào Duy Từ near Đồng Hới and by the Nguyễn’s cannon, made with Portuguese help; the Dutch East India Company, allied to the Trịnh, lost a warship at the Gianh River in 1643. A Nguyễn counter-offensive in 1655 reached Nghệ An before it was driven back. After a last failed Trịnh assault in 1672 the two sides made a truce with the Gianh River as the border. It held for a hundred years, while the Nguyễn expanded south into Champa and the Mekong delta.: "La guerre intermittente entre les deux familles qui gouvernaient le Đại Việt au nom des empereurs Lê, privés de pouvoir : les seigneurs Trịnh au nord (Đàng Ngoài, que les Européens appelaient le Tonkin) et les seigneurs Nguyễn au sud (Đàng Trong, ou Cochinchine). Lorsque les Nguyễn refusèrent d’envoyer les impôts et d’obéir à la cour contrôlée par les Trịnh, Trịnh Tráng envoya une armée vers le sud en 1627. Au cours des 45 années suivantes, les Trịnh, dont la population était bien plus nombreuse, attaquèrent à sept reprises à travers l’étroite plaine côtière du Quảng Bình, mais furent arrêtés par les murailles des Nguyễn conçues par Đào Duy Từ près de Đồng Hới et par les canons des Nguyễn, fabriqués avec l’aide des Portugais ; la Compagnie néerlandaise des Indes orientales, alliée des Trịnh, perdit un navire de guerre sur la rivière Gianh en 1643. Une contre-offensive des Nguyễn en 1655 atteignit le Nghệ An avant d’être repoussée. Après un dernier assaut manqué des Trịnh en 1672, les deux camps conclurent une trêve qui fixait la frontière sur la rivière Gianh. Elle tint cent ans, tandis que les Nguyễn s’étendaient vers le sud, au Champa et dans le delta du Mékong."
