# French translations of the catalogue text (wave 8); step bodies follow later.
Tripartite Struggle: Lutte tripartite
The long contest of the three great powers of India for Kannauj, the old imperial city on the Ganges, from the late 8th to the early 10th century. The Gurjara-Pratiharas of Malwa and Rajasthan, the Palas of Bengal and Bihar and the Rashtrakutas of the Deccan each took or controlled the city in turn. The Rashtrakuta kings Dhruva and Govinda III raided as far as the Ganges and went home again; the Pala king Dharmapala put his own candidate on the throne of Kannauj; and in about 816 the Pratihara Nagabhata II took the city and made it his capital, which it stayed for two centuries. A last great Rashtrakuta raid under Indra III sacked Kannauj in about 916. The struggle exhausted all three and left room for the regional kingdoms that followed.: La longue rivalité des trois grandes puissances de l’Inde pour Kannauj, l’ancienne cité impériale sur le Gange, de la fin du VIIIe au début du Xe siècle. Les Gurjara-Pratihara du Malwa et du Rajasthan, les Pala du Bengale et du Bihar et les Rashtrakuta du Dekkan prirent ou contrôlèrent tour à tour la ville. Les rois rashtrakuta Dhruva et Govinda III lancèrent des raids jusqu’au Gange, puis rentrèrent chez eux ; le roi pala Dharmapala plaça son propre candidat sur le trône de Kannauj ; et vers 816, le Pratihara Nagabhata II prit la ville et en fit sa capitale, ce qu’elle resta pendant deux siècles. Un dernier grand raid rashtrakuta mené par Indra III saccagea Kannauj vers 916. La lutte épuisa les trois puissances et laissa le champ libre aux royaumes régionaux qui leur succédèrent.
