# French translations of the catalogue text (wave 11); step bodies follow later.
Trunajaya rebellion: Rébellion de Trunajaya
? "A rebellion against King Amangkurat I of Mataram, led by Trunajaya, a prince of Madura, and joined by Makassarese fighters who had left South Sulawesi after the Makassar War, by the spiritual lord of Giri and by Javanese nobles weary of the king’s cruelty. Raids on the north coast of Java from 1674 grew into open war: in 1676 a rebel army of about 9,000 crossed from Madura, routed the royal army at Gegodog near Tuban and took most of the north coast. In 1677 the Dutch East India Company (VOC), called in by Mataram, took Surabaya from Trunajaya, but the rebels took and plundered the royal capital, Plered; Amangkurat I died in flight, and his son Amangkurat II bought the Company’s help with sweeping concessions. Company troops, Bugis under Arung Palakka and Javanese levies took Trunajaya’s new capital, Kediri, in November 1678; Trunajaya surrendered in December 1679 and was stabbed to death by Amangkurat II in January 1680, and the last rebels at Giri were crushed in April. Amangkurat II built a new capital at Kartasura with a Company garrison beside his palace: Mataram survived, but the Company had become the arbiter of Javanese politics."
: "Une rébellion contre le roi Amangkurat Ier de Mataram, conduite par Trunajaya, prince de Madura, et rejointe par des combattants makassarais qui avaient quitté le sud de Sulawesi après la guerre de Makassar, par le seigneur spirituel de Giri et par des nobles javanais las de la cruauté du roi. Les raids lancés sur la côte nord de Java à partir de 1674 se transformèrent en guerre ouverte : en 1676, une armée rebelle d’environ 9 000 hommes traversa depuis Madura, mit en déroute l’armée royale à Gegodog, près de Tuban, et s’empara de la majeure partie de la côte nord. En 1677, la Compagnie néerlandaise des Indes orientales (VOC), appelée par Mataram, prit Surabaya à Trunajaya, mais les rebelles prirent et pillèrent la capitale royale, Plered ; Amangkurat Ier mourut dans sa fuite, et son fils Amangkurat II acheta l’aide de la Compagnie au prix de vastes concessions. Les troupes de la Compagnie, les Bugis d’Arung Palakka et des levées javanaises prirent la nouvelle capitale de Trunajaya, Kediri, en novembre 1678 ; Trunajaya se rendit en décembre 1679 et fut poignardé à mort par Amangkurat II en janvier 1680, et les derniers rebelles de Giri furent écrasés en avril. Amangkurat II bâtit une nouvelle capitale à Kartasura, avec une garnison de la Compagnie à côté de son palais : Mataram survécut, mais la Compagnie était devenue l’arbitre de la politique javanaise."
