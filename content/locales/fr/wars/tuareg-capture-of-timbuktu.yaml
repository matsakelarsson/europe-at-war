# French translations of the catalogue text (wave 12); step bodies follow later.
Tuareg capture of Timbuktu: Prise de Tombouctou par les Touareg
? The end of Malian rule in Timbuktu and the town’s decades under the Maghsharen Tuareg. As Mali weakened in the early fifteenth century, Tuareg of the Maghsharen confederation under their chief Akil ag Malwal raided the country around Timbuktu year after year. The townspeople did not take up arms, and the Malian officials withdrew; according to the Tarikh al-Sudan, Akil took the town about 1433 and was its master for forty years. The Tuareg went on living in their tents and moving with their herds outside the town, which they governed through the Timbuktu-koi, the Sanhaja notable Muhammad Naddi, who had held the office under Mali and kept it, with all administrative and financial powers, under its new overlords. He built the mosque of Sidi Yahya and made his friend Sidi Yahya al-Tadilsi its imam. The Tarikh says Akil’s rule turned harsh in its last years, with houses broken into and women assaulted, and that he took the third of the taxes that by custom went to the Timbuktu-koi. Muhammad Naddi’s son and successor Ammar then secretly invited Sonni Ali of Gao to take the town. When Songhai horsemen appeared on the Gourma bank of the Niger, Akil fled to Walata with many of the scholars of Sankore, and Sonni Ali entered Timbuktu in January 1468 (see “Sonni Ali’s conquests”). The Tuareg chiefs’ authority, the chronicle notes, had never reached beyond the river.
: La fin de la domination malienne sur Tombouctou et les décennies que la ville passa sous l’autorité des Touareg maghsharen. Tandis que le Mali s’affaiblissait au début du XVe siècle, des Touareg de la confédération maghsharen, conduits par leur chef Akil ag Malwal, razziaient année après année la région de Tombouctou. Les habitants ne prirent pas les armes, et les fonctionnaires maliens se retirèrent ; selon le Tarikh es-Soudan, Akil prit la ville vers 1433 et en fut le maître pendant quarante ans. Les Touareg continuèrent à vivre sous leurs tentes et à se déplacer avec leurs troupeaux hors de la ville, qu’ils gouvernaient par l’intermédiaire du Tombouctou-koï, le notable sanhadja Muhammad Naddi, qui avait exercé cette charge sous le Mali et la conserva, avec tous les pouvoirs administratifs et financiers, sous ses nouveaux suzerains. Il fit construire la mosquée de Sidi Yahya et en nomma imam son ami Sidi Yahya al-Tadilsi. Le Tarikh rapporte que le gouvernement d’Akil devint dur dans ses dernières années, avec des maisons forcées et des femmes agressées, et qu’il s’appropria le tiers des impôts qui revenait par coutume au Tombouctou-koï. Le fils et successeur de Muhammad Naddi, Ammar, invita alors secrètement Sonni Ali de Gao à prendre la ville. Lorsque des cavaliers songhaï apparurent sur la rive gourma du Niger, Akil s’enfuit à Oualata avec de nombreux lettrés de Sankoré, et Sonni Ali entra dans Tombouctou en janvier 1468 (voir « Les conquêtes de Sonni Ali »). L’autorité des chefs touareg, note la chronique, n’avait jamais dépassé le fleuve.
