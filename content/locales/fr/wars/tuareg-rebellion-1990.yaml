# French translations of the catalogue text (wave 12); step bodies follow later.
Tuareg rebellion of 1990–1995: Rébellion touarègue de 1990–1995
? Rebellions of Tuareg, and in Mali also Arab, movements against the governments of Mali and Niger in the early 1990s. The droughts of 1973–1974 and 1984–1985 destroyed the herds on which the nomads of the Sahara’s southern edge lived, and many young men left for Algeria and Libya, where some served in Muammar Gaddafi’s Islamic Legion. When they came back at the end of the 1980s to poverty and suspicion, a raid on the post at Tchin-Tabaraden in Niger in May 1990 brought army reprisals that killed hundreds of Tuareg civilians, and in June an attack on Ménaka opened the war in Mali. Algeria brokered the Tamanrasset accords in January 1991, and after a coup in Bamako Mali signed a National Pact with the rebel movements in April 1992, promising a special status for the north, the integration of fighters and development. Fighting flared again in 1994, when the Songhai militia Ganda Koy and the rebels killed civilians of each other’s communities, before local peace meetings ended it; the weapons of the Malian war were burned in Timbuktu on 27 March 1996. In Niger the government signed a peace accord with the Tuareg movements in Ouagadougou on 24 April 1995. More than 2,500 people were killed. New rebellions broke out in both countries in 2006–2009.
: Les rébellions de mouvements touareg, et au Mali également arabes, contre les gouvernements du Mali et du Niger au début des années 1990. Les sécheresses de 1973–1974 et de 1984–1985 détruisirent les troupeaux dont vivaient les nomades de la bordure sud du Sahara, et beaucoup de jeunes hommes partirent pour l’Algérie et la Libye, où certains servirent dans la Légion islamique de Mouammar Kadhafi. À leur retour, à la fin des années 1980, ils trouvèrent la pauvreté et la méfiance ; en mai 1990, un raid contre le poste de Tchin-Tabaraden, au Niger, entraîna des représailles de l’armée qui firent des centaines de morts parmi les civils touareg et, en juin, une attaque contre Ménaka ouvrit la guerre au Mali. L’Algérie négocia les accords de Tamanrasset en janvier 1991 et, après un coup d’État à Bamako, le Mali signa en avril 1992 un Pacte national avec les mouvements rebelles, qui promettait un statut particulier pour le nord, l’intégration des combattants et le développement. Les combats reprirent en 1994, lorsque la milice songhaï Ganda Koy et les rebelles tuèrent des civils de leurs communautés respectives, avant que des rencontres de paix locales n’y mettent fin ; les armes de la guerre malienne furent brûlées à Tombouctou le 27 mars 1996. Au Niger, le gouvernement signa un accord de paix avec les mouvements touareg à Ouagadougou le 24 avril 1995. Plus de 2 500 personnes furent tuées. De nouvelles rébellions éclatèrent dans les deux pays en 2006–2009.
