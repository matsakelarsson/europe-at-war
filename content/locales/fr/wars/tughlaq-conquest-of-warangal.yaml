# French translations of the catalogue text (wave 8); step bodies follow later.
Tughlaq conquest of Warangal: Conquête de Warangal par les Tughlaq
? The campaigns that ended the Kakatiya kingdom of Telangana and made it a province of the Delhi Sultanate. The Kakatiya king Prataparudra had been a tributary of Delhi since Malik Kafur’s siege of Warangal in 1310. When he stopped paying, Sultan Qutb al-Din Mubarak Shah sent his general Khusrau Khan, who besieged Warangal in 1318 and forced Prataparudra to hand over 100 elephants, 12,000 horses and treasure and to give up five districts. Under the new Tughluq dynasty the tribute again stopped, and Ghiyath al-Din Tughluq sent his son Ulugh Khan, the future Muhammad bin Tughluq. His first siege of Warangal broke up when a false rumour of the sultan’s death set off a revolt in his camp, and the Kakatiya army chased him back to Devagiri. Within months he returned, took the outlying forts of Badrikot and Bodhan and, after a siege of about five months, forced Prataparudra to surrender in 1323. The king was sent towards Delhi as a prisoner and died on the way, probably by his own hand on the banks of the Narmada. Delhi’s rule in Telangana lasted only until 1336, when Kapaya Nayaka drove out its governor.
: Les campagnes qui mirent fin au royaume kakatiya du Telangana et en firent une province du sultanat de Delhi. Le roi kakatiya Prataparudra était tributaire de Delhi depuis le siège de Warangal par Malik Kafur en 1310. Lorsqu’il cessa de payer, le sultan Qutb al-Din Mubarak Shah envoya son général Khusrau Khan, qui assiégea Warangal en 1318 et contraignit Prataparudra à livrer 100 éléphants, 12 000 chevaux et un trésor, et à céder cinq districts. Sous la nouvelle dynastie des Tughluq, le tribut cessa de nouveau d’être versé, et Ghiyath al-Din Tughluq envoya son fils Ulugh Khan, le futur Muhammad bin Tughluq. Son premier siège de Warangal fut levé lorsque la fausse rumeur de la mort du sultan déclencha une révolte dans son camp, et l’armée kakatiya le poursuivit jusqu’à Devagiri. Quelques mois plus tard, il revint, prit les forts avancés de Badrikot et de Bodhan et, après un siège d’environ cinq mois, contraignit Prataparudra à se rendre en 1323. Le roi fut envoyé prisonnier vers Delhi et mourut en chemin, probablement de sa propre main, sur les rives de la Narmada. La domination de Delhi sur le Telangana ne dura que jusqu’en 1336, lorsque Kapaya Nayaka en chassa le gouverneur.
