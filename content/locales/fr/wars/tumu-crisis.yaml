# French translations of the catalogue text (wave 9); step bodies follow later.
Tumu crisis: Crise de Tumu
? The Oirat invasion of Ming China in 1449, in which the Zhengtong Emperor was captured. Esen, the Oirat taishi who had made himself master of the Mongolian steppe, attacked the Ming frontier in July 1449 after quarrels over the tribute trade and a refused marriage alliance. Urged on by the eunuch Wang Zhen, the 22-year-old emperor led a hastily gathered army out of Beijing, marched to Datong and turned back, and on 1 September 1449 his army was surrounded and destroyed at the post station of Tumu, about 90 km north-west of Beijing. Wang Zhen and many of the highest officials were killed and the emperor was taken prisoner. In Beijing the minister of war Yu Qian refused to abandon the capital, the emperor’s half-brother was enthroned as the Jingtai Emperor, and when Esen came to the walls in October 1449 he was beaten back within five days. Esen released the former emperor in September 1450, gaining little from his victory. No territory changed hands, but the defeat ended Ming campaigns on the steppe and turned the dynasty to defending the frontier with walls.
: L’invasion de la Chine des Ming par les Oïrats en 1449, au cours de laquelle l’empereur Zhengtong fut capturé. Esen, le taishi oïrat qui s’était rendu maître de la steppe mongole, attaqua la frontière des Ming en juillet 1449 après des querelles sur le commerce tributaire et le refus d’une alliance matrimoniale. Poussé par l’eunuque Wang Zhen, l’empereur, âgé de 22 ans, conduisit hors de Pékin une armée levée à la hâte, marcha jusqu’à Datong et fit demi-tour, et le 1er septembre 1449 son armée fut encerclée et anéantie au relais de poste de Tumu, à environ 90 km au nord-ouest de Pékin. Wang Zhen et beaucoup des plus hauts fonctionnaires furent tués, et l’empereur fut fait prisonnier. À Pékin, le ministre de la Guerre Yu Qian refusa d’abandonner la capitale, le demi-frère de l’empereur fut intronisé sous le nom d’empereur Jingtai et, lorsqu’Esen parut sous les murs en octobre 1449, il fut repoussé en cinq jours. Esen libéra l’ancien empereur en septembre 1450, sans avoir tiré grand-chose de sa victoire. Aucun territoire ne changea de mains, mais la défaite mit fin aux campagnes des Ming dans la steppe et tourna la dynastie vers la défense de la frontière par des murailles.
