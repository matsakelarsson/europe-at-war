# French translations of the catalogue text (wave 12); step bodies follow later.
Armed struggles for Tunisian and Moroccan independence: Luttes armées pour l’indépendance de la Tunisie et du Maroc
? The armed phase of the independence movements in the French protectorates of Tunisia and Morocco. In Tunisia the arrest of Habib Bourguiba and other leaders of the Neo-Destour party on 18 January 1952 set off strikes, riots and a harsh French sweep of Cap Bon, and armed bands, the fellaghas, took to the hills of the centre and south. The murder of the trade union leader Farhat Hached on 5 December 1952 by La Main Rouge, a secret group linked to French intelligence, brought protests across North Africa. By 1954 several thousand fellaghas were in the field, and in October 1954 they defeated a French force at Tamerza; after the French prime minister Pierre Mendès France promised internal autonomy in his Carthage speech of 31 July 1954, many of them handed in their arms in late 1954 under an agreement with the French. In Morocco, France deposed Sultan Mohammed V on 20 August 1953 and exiled him to Corsica and Madagascar, which turned the nationalist movement into an urban armed resistance of bombings and assassinations, answered by settler counter-terror. On 20 August 1955 risings at Oued Zem and in the Khouribga mining region killed dozens of Europeans and were followed by reprisals that killed far more Moroccans, and on 1–2 October 1955 the Moroccan Army of Liberation attacked French posts on the edge of the Rif. France brought Mohammed V back on 16 November 1955. Morocco became independent on 2 March 1956, with the Spanish zone following on 7 April, and Tunisia on 20 March 1956; the war in Algeria went on until 1962.
: La phase armée des mouvements d’indépendance dans les protectorats français de Tunisie et du Maroc. En Tunisie, l’arrestation de Habib Bourguiba et d’autres dirigeants du parti Néo-Destour le 18 janvier 1952 déclencha des grèves, des émeutes et un dur ratissage français du cap Bon, et des bandes armées, les fellaghas, gagnèrent les collines du centre et du sud. L’assassinat du dirigeant syndical Farhat Hached le 5 décembre 1952 par La Main rouge, un groupe secret lié aux services de renseignement français, provoqua des manifestations dans toute l’Afrique du Nord. En 1954, plusieurs milliers de fellaghas étaient en campagne, et en octobre 1954 ils battirent une force française à Tamerza ; après que le président du Conseil Pierre Mendès France eut promis l’autonomie interne dans son discours de Carthage du 31 juillet 1954, beaucoup d’entre eux remirent leurs armes à la fin de 1954 en vertu d’un accord avec les Français. Au Maroc, la France déposa le sultan Mohammed V le 20 août 1953 et l’exila en Corse puis à Madagascar, ce qui transforma le mouvement nationaliste en une résistance armée urbaine faite d’attentats et d’assassinats, à laquelle répondit un contre-terrorisme de colons. Le 20 août 1955, des soulèvements à Oued Zem et dans la région minière de Khouribga tuèrent des dizaines d’Européens et furent suivis de représailles qui tuèrent bien plus de Marocains, et les 1er et 2 octobre 1955 l’Armée de libération marocaine attaqua des postes français en bordure du Rif. La France ramena Mohammed V le 16 novembre 1955. Le Maroc devint indépendant le 2 mars 1956, la zone espagnole suivant le 7 avril, et la Tunisie le 20 mars 1956 ; la guerre d’Algérie se poursuivit jusqu’en 1962.
