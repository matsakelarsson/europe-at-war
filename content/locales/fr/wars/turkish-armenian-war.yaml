# Some French text was translated automatically.
"Turkish–Armenian War": "Guerre turc-arménienne"
"A war in the autumn of 1920 in which the army of the Turkish nationalist government in Ankara, under Kâzım Karabekir, invaded the Republic of Armenia, took Sarıkamış, Kars and Alexandropol (now Gyumri) and killed tens of thousands of Armenian civilians. In the Treaty of Alexandropol, signed on the night of 2–3 December 1920 as Armenia’s government handed power to the Bolsheviks, Armenia gave up Kars and its claims under the Treaty of Sèvres, and the Treaty of Kars of October 1921 confirmed the new border.": "Une guerre à l’automne 1920 dans laquelle l’armée du gouvernement nationaliste turc à Ankara, sous Kâzım Karabekir, envahit la République d’Arménie, prit Sarıkamış, Kars et Alexandropol (aujourd'hui Gyumri) et tua des dizaines de milliers de civils arméniens. Dans le traité d’Alexandropol, signé dans la nuit du 2 au 3 décembre 1920 alors que le gouvernement arménien confia le pouvoir aux bolcheviks, l’Arménie abandonna Kars et ses revendications en vertu du traité de Sèvres, et le traité de Kars d’octobre 1921 confirma la nouvelle frontière."
"The Ankara government of the Grand National Assembly became the Republic of Turkey in 1923.": "Le gouvernement d’Ankara de la Grande Assemblée nationale est devenu la République de Turquie en 1923."
"Kars and Ardahan had been Russian from 1878 to 1918; Armenia held Kars from 1919 to 1920.": "Kars et Ardahan avaient été russes de 1878 à 1918 ; l’Arménie a tenu Kars de 1919 à 1920."
