"The second Geneva conference broke down on 14 August, when the Turkish side demanded an immediate answer on separate zones and the Greek Cypriot and Greek delegations asked for time. Within hours the Turkish army attacked east and west. It took Famagusta on 15–16 August and Morphou in the west, and by the ceasefire of 16 August, with a few later advances, held about 36 per cent of the island. The ceasefire line became the United Nations buffer zone, the Green Line, running through the centre of Nicosia.": "La deuxième conférence de Genève s’est effondrée le 14 août, lorsque la partie turque a demandé une réponse immédiate sur des zones séparées et que les délégations chypriote grecque et grecque ont demandé du temps. Quelques heures plus tard, l’armée turque a attaqué l’Est et l’Ouest. La ligne de cessez-le-feu est devenue la zone tampon des Nations Unies, la Ligne verte, qui traverse le centre de Nicosie."
"About 150,000 Greek Cypriots fled or were driven from the north, and over the following year about 60,000 Turkish Cypriots moved there from the south. Civilians were killed on both sides. Turkish Cypriot villagers at Maratha, Santalaris, Aloda and Tochni were massacred by EOKA-B, while Greek Cypriot civilians and prisoners were killed by Turkish troops and Turkish Cypriot fighters. Varosha, the modern quarter of Famagusta, was fenced off and left empty. The north declared itself the Turkish Republic of Northern Cyprus in 1983, recognised only by Turkey, and the island remains divided.": "Environ 150 000 Chypriotes grecs ont fui ou ont été chassés du nord et, l’année suivante, environ 60 000 Chypriotes turcs se sont déplacés du sud. Des civils ont été tués des deux côtés. Des villageois chypriotes turcs à Maratha, Santalaris, Aloda et Tochni ont été massacrés par l’EOKA-B, tandis que des civils et des prisonniers chypriotes grecs ont été tués par les troupes turques et des combattants chypriotes turcs. Varosha, le quartier moderne de Famagusta, a été clôturé et laissé vide. Le nord s’est déclaré la République turque de Chypre-Nord en 1983, reconnue uniquement par la Turquie, et l’île reste divisée."
