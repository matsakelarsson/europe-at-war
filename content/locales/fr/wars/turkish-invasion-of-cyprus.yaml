"The coup of 15 July": "Le coup d’État du 15 juillet"
"15–19 July 1974": "15–19 juillet 1974"
"Since the violence of 1963–1964, Turkish Cypriots had lived largely in armed enclaves, watched over by a United Nations force. President Makarios had given up enosis, union with Greece, as an aim, and the military junta in Athens backed the underground EOKA-B against him. On 2 July 1974 Makarios demanded that Greece withdraw the Greek officers who commanded the Cypriot National Guard. On 15 July the National Guard, led by those officers, attacked the presidential palace in Nicosia and seized the radio station and other key points across the island.": "Depuis la violence de 1963-1964, les Chypriotes turcs vivaient en grande partie dans des enclaves armées, surveillées par une force des Nations Unies. Le président Makarios avait renoncé à l’énose, à l’union avec la Grèce, comme objectif, et la junte militaire d’Athènes soutenait contre lui l’EOKA-B clandestine. Le 15 juillet, la Garde nationale, dirigée par ces officiers, a attaqué le palais présidentiel de Nicosie et saisi la station de radio et d’autres points clefs de l’île."
"Makarios escaped through the back of the burning palace to Paphos, where he broadcast that he was alive; the British flew him out from their base at Akrotiri the next day. The coup leaders made Nikos Sampson, a former EOKA gunman known for his hostility to the Turkish Cypriots, president. Fighting between the coup forces and Makarios’s supporters killed many Greek Cypriots, with estimates ranging from about a hundred to several hundred. Turkey called the coup a step towards annexation by Greece, and when Britain declined to act with it, prepared to invade.": "Makarios s’est évadé par l’arrière du palais en feu jusqu’à Paphos, où il a annoncé qu’il était vivant ; les Britanniques l’ont emmené de leur base à Akrotiri le lendemain. Les dirigeants du coup ont fait Nikos Sampson, un ancien tireur EOKA connu pour son hostilité aux Chypriotes turcs, président. Les combats entre les forces du coup d’État et les partisans de Makarios ont tué de nombreux Chypriotes grecs, avec des estimations allant d’une centaine à plusieurs centaines. La Turquie a appelé le coup d’Etat un pas vers l’annexion par la Grèce, et lorsque la Grande-Bretagne a refusé d’agir avec elle, prêt à envahir."
