"20 July – 13 August 1974": "20 juillet – 13 août 1974"
"Before dawn on 20 July Turkish troops landed on a beach west of Kyrenia, while paratroopers dropped into the Turkish Cypriot enclave north of Nicosia. The National Guard and the Greek army contingent on the island fought back, and a Turkish destroyer was sunk by Turkish aircraft by mistake. Elsewhere Greek Cypriot forces overran Turkish Cypriot quarters and villages and took thousands of Turkish Cypriot men prisoner. When a ceasefire called for by the United Nations took hold on 22 July, Turkish forces held Kyrenia and a corridor to Nicosia, about 3 per cent of the island.": "Avant l’aube du 20 juillet, les troupes turques ont atterri sur une plage à l’ouest de Kyrenia, tandis que des parachutistes se sont jetés dans l’enclave chypriote turque au nord de Nicosie. La Garde nationale et le contingent de l’armée grecque sur l’île se sont battus et un destroyer turc a été coulé par erreur par des avions turcs. Lorsqu'un cessez-le-feu demandé par l’ONU a pris effet le 22 juillet, les forces turques ont tenu Kyrenia et un couloir à Nicosie, soit environ 3 % de l’île."
"The crisis brought down the junta in Athens, which handed power to civilians on 23 July, and Konstantinos Karamanlis returned from exile to lead Greece. In Cyprus, Sampson resigned and Glafcos Clerides became acting president. Britain, Greece and Turkey, the three guarantor powers, met in Geneva, but the Turkish army went on widening its bridgehead, and the Turkish Cypriot leadership pressed for a federation of two separate zones.": "La crise a fait tomber la junte à Athènes, qui a donné le pouvoir aux civils le 23 juillet, et Konstantinos Karamanlis est revenu d’exil pour diriger la Grèce. À Chypre, Sampson a démissionné et Glafcos Clerides est devenu président par intérim. La Grande-Bretagne, la Grèce et la Turquie, les trois puissances garantes, se sont rencontrées à Genève, mais l’armée turque a continué à élargir sa tête de pont, et les dirigeants chypriotes turcs ont insisté pour une fédération de deux zones distinctes."
