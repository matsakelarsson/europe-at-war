# Some French text was translated automatically.
"Turkish invasion of Cyprus": "Invasion turque de Chypre"
"Turkey’s military intervention in Cyprus in July and August 1974, five days after a coup backed by the Greek junta had overthrown President Makarios. In two offensives the Turkish army took about 36 per cent of the island in the north; some 150,000 Greek Cypriots and later about 60,000 Turkish Cypriots were uprooted, and the ceasefire line, patrolled by the United Nations, has divided the island ever since.": "L’intervention militaire turque à Chypre en juillet et août 1974, cinq jours après un coup d’État soutenu par la junte grecque avait renversé le président Makarios. Dans deux offensives, l’armée turque a pris environ 36 % de l’île dans le nord ; quelque 150 000 Chypriotes grecs et plus tard environ 60 000 Chypriotes turcs ont été déracinés, et la ligne de cessez-le-feu, patrouille par les Nations Unies, a toujours divisé l’île."
"Turkey calls the operation the Cyprus Peace Operation and cites its rights as a guarantor under the Treaty of Guarantee of 1960; the Republic of Cyprus, Greece and the United Nations Security Council regard the continuing presence of Turkish troops in the north as an occupation. The Turkish Republic of Northern Cyprus, declared in 1983, is recognised only by Turkey.": "La Turquie appelle l’opération de paix à Chypre et cite ses droits en tant que garant du Traité de garantie de 1960 ; la République de Chypre, la Grèce et le Conseil de sécurité des Nations unies considèrent la présence continue des troupes turques dans le nord comme une occupation."
"The base map shows Cyprus as one state, as it is internationally recognised; the Turkish-held north and the ceasefire line are shown as areas.": "La carte de base montre Chypre comme un seul État, comme il est reconnu internationalement ; le nord contrôlé par la Turquie et la ligne de cessez-le-feu sont indiqués comme zones."
"Civilians were killed on both sides. The Committee on Missing Persons in Cyprus lists about 1,500 Greek Cypriots and 500 Turkish Cypriots missing from 1963–1964 and 1974, many of whom have since been identified from remains.": "Des civils ont été tués de part et d’autre. Le Comité des personnes disparues à Chypre énumère environ 1 500 Chypriotes grecs et 500 Chypriotes turcs portés disparus entre 1963 et 1964 et 1974, dont beaucoup ont depuis été identifiés parmi les restes."
