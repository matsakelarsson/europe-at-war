# French translations of the catalogue text (wave 14); step bodies follow later.
Tuscarora War: Guerre des Tuscaroras
? "A war in North Carolina between the colony and the southern Tuscarora and their allies. The Tuscarora, an Iroquoian-speaking people of the coastal plain, had lost land to colonists, most recently to the Swiss and German settlers of New Bern, and many of their people had been kidnapped and sold as slaves. In September 1711 the southern Tuscarora under Hancock, with the Coree, Pamlico, Neuse, Bear River, Machapunga and other peoples, executed the surveyor John Lawson and attacked the farms along the Neuse, Trent and Pamlico rivers, killing well over a hundred colonists, while the northern Tuscarora under Tom Blount stayed out of the war. South Carolina sent two armies made up mostly of Native allies: John Barnwell’s in 1712, mainly Yamasee, and James Moore Jr.’s in 1712–1713, with many Cherokee and Catawba. In March 1713 Moore stormed the Tuscarora fort of Neoheroka, where about 950 people were killed or captured and sold into slavery. Most of the southern Tuscarora moved north and were accepted into the Haudenosaunee Confederacy as its sixth nation in about 1722; those who stayed received a reservation on the Roanoke River."
: "Une guerre en Caroline du Nord entre la colonie et les Tuscaroras du Sud et leurs alliés. Les Tuscaroras, un peuple de langue iroquoienne de la plaine côtière, avaient perdu des terres au profit des colons, en dernier lieu des colons suisses et allemands de New Bern, et beaucoup des leurs avaient été enlevés et vendus comme esclaves. En septembre 1711, les Tuscaroras du Sud menés par Hancock, avec les Corees, les Pamlicos, les Neuses, les Bear River, les Machapungas et d’autres peuples, exécutèrent l’arpenteur John Lawson et attaquèrent les fermes le long de la Neuse, de la Trent et de la Pamlico, tuant bien plus d’une centaine de colons, tandis que les Tuscaroras du Nord de Tom Blount restaient à l’écart de la guerre. La Caroline du Sud envoya deux armées composées surtout d’alliés autochtones : celle de John Barnwell en 1712, principalement formée de Yamasees, et celle de James Moore Jr. en 1712–1713, qui comptait de nombreux Cherokees et Catawbas. En mars 1713, Moore prit d’assaut le fort tuscarora de Neoheroka, où environ 950 personnes furent tuées ou capturées et vendues comme esclaves. La plupart des Tuscaroras du Sud partirent vers le nord et furent admis dans la Confédération haudenosaunee comme sixième nation vers 1722 ; ceux qui restèrent reçurent une réserve sur la Roanoke."
Southern Tuscarora and their allies (Coree, Pamlico, Neuse, Bear River, Machapunga, Mattamuskeet): Tuscaroras du Sud et leurs alliés (Corees, Pamlicos, Neuses, Bear River, Machapungas, Mattamuskeets)
North and South Carolina, with Yamasee, Catawba, Cherokee and other Native allies (and from 1712 Tom Blount’s northern Tuscarora): Caroline du Nord et Caroline du Sud, avec des Yamasees, des Catawbas, des Cherokees et d’autres alliés autochtones (et, à partir de 1712, les Tuscaroras du Nord de Tom Blount)
