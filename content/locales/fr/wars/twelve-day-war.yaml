# French translations of the catalogue text (wave 7); step bodies follow later.
Twelve-Day War: Guerre des Douze Jours
? A war between Israel and Iran in June 2025, which the United States joined with strikes on Iran’s nuclear sites. After decades of shadow war, the two states had exchanged direct missile and air attacks twice in 2024. On 13 June 2025, the day after the International Atomic Energy Agency’s board found Iran in breach of its non-proliferation obligations, Israel launched a surprise air campaign against Iran’s nuclear facilities, missile forces and military leadership, killing the chief of staff of the armed forces, the commander of the Revolutionary Guards and at least ten nuclear scientists. Iran answered with more than 550 ballistic missiles and some 1,000 drones fired at Israel, most of which were intercepted, while Israeli aircraft struck targets across Iran. On 22 June American B-2 bombers struck the enrichment sites at Fordow and Natanz and the nuclear centre at Isfahan. After Iran fired missiles at a US air base in Qatar, President Donald Trump announced a ceasefire, which took effect on 24 June. Iran’s government reported about 1,060 dead and an Iranian human rights group about 1,190; in Israel 33 people were killed.
: Une guerre entre Israël et l’Iran en juin 2025, à laquelle les États-Unis se joignirent en frappant les sites nucléaires iraniens. Après des décennies de guerre de l’ombre, les deux États avaient échangé à deux reprises, en 2024, des attaques directes de missiles et des frappes aériennes. Le 13 juin 2025, au lendemain du jour où le conseil des gouverneurs de l’Agence internationale de l’énergie atomique avait jugé que l’Iran manquait à ses obligations de non-prolifération, Israël lança une campagne aérienne surprise contre les installations nucléaires, les forces de missiles et les dirigeants militaires de l’Iran, tuant le chef d’état-major des forces armées, le commandant des Gardiens de la révolution et au moins dix scientifiques du nucléaire. L’Iran riposta en tirant sur Israël plus de 550 missiles balistiques et quelque 1 000 drones, dont la plupart furent interceptés, tandis que l’aviation israélienne frappait des cibles dans tout l’Iran. Le 22 juin, des bombardiers américains B-2 frappèrent les sites d’enrichissement de Fordo et de Natanz ainsi que le centre nucléaire d’Ispahan. Après des tirs de missiles iraniens contre une base aérienne américaine au Qatar, le président Donald Trump annonça un cessez-le-feu, qui entra en vigueur le 24 juin. Le gouvernement iranien fit état d’environ 1 060 morts et une organisation iranienne de défense des droits humains d’environ 1 190 ; en Israël, 33 personnes furent tuées.
