# Some French text was translated automatically.
"Tyrolean Rebellion": "Rébellion tyrolienne"
"A rising of the people of Tyrol, ceded to Bavaria in 1805, against Bavarian and French rule during Austria’s war with Napoleon in 1809. Led by the innkeeper Andreas Hofer and helped at first by Austrian troops, the insurgents won battles on the Bergisel above Innsbruck and held most of Tyrol for months, but after the Peace of Schönbrunn left Tyrol to Bavaria they were defeated in November; Hofer was captured and shot at Mantua in February 1810, and Tyrol was divided between Bavaria, Napoleon’s Kingdom of Italy and the Illyrian Provinces.": "Une montée du peuple du Tyrol, cédée en Bavière en 1805, contre la domination bavaroise et française pendant l’Autriche de guerre avec Napoléon en 1809. Dirigés par l’aubergiste Andreas Hofer et aidés d’abord par les troupes autrichiennes, les insurgés remportent des batailles sur le Bergisel au-dessus d’Innsbruck et tiennent la plupart du Tyrol pendant des mois, mais après la paix de Schönbrunn quitte le Tyrol en Bavière, ils sont défaits en novembre ; Hofer est capturé et abattu à Mantoue en février 1810, et Tyrol est divisé entre la Bavière, Napoléon du Royaume d’Italie et des Provinces Illyriennes."
"The Tyrol of 1809 included today’s South Tyrol and Trentino in Italy.": "Le Tyrol de 1809 comprenait aujourd'hui le Tyrol du Sud et le Trentino en Italie."
