# French translations of the catalogue text (wave 10); step bodies follow later.
Uesugi Zenshū’s Rebellion: Rébellion d’Uesugi Zenshū
? A revolt in the Kantō against Ashikaga Mochiuji, the Kamakura kubō, who governed eastern Japan for the shogunate from Kamakura. Uesugi Ujinori, known by his Buddhist name Zenshū, of the Inukake branch of the Uesugi, had served as Mochiuji’s deputy (Kantō kanrei) since 1411, but after a quarrel in council in 1415 he was dismissed and replaced by Uesugi Norimoto of the rival Yamanouchi branch. Zenshū allied with Mochiuji’s uncle Ashikaga Mitsutaka and his adopted son Mochinaka and won over many eastern houses, among them the Takeda of Kai, the Chiba, the Iwamatsu and the Nasu. On the night of the 2nd day of the tenth month of 1416 they rose in Kamakura and took the city; Mochiuji and Norimoto escaped, Mochiuji to Suruga. The shogun Ashikaga Yoshimochi chose to back his kinsman Mochiuji and sent Imagawa Norimasa of Suruga, Uesugi Fusakata of Echigo and other lords against the rebels. Zenshū beat the Edo and Toshima of Musashi, who had turned against him, at Seyagahara on New Year’s Day 1417, but as the Imagawa army advanced into Sagami his support fell away. On the 10th day of the first month of 1417 Zenshū, Mitsutaka and Mochinaka took their own lives at Yukinoshita in Kamakura, by the Tsurugaoka Hachimangū shrine. Mochiuji then spent years punishing the rebels’ allies, among them houses that the shogunate protected, and his relations with Kyoto never recovered; the quarrel led to the Eikyō Rebellion of 1438.
: Une révolte dans le Kantō contre Ashikaga Mochiuji, le Kamakura kubō, qui gouvernait l’est du Japon pour le compte du shogunat depuis Kamakura. Uesugi Ujinori, connu sous son nom bouddhique de Zenshū, de la branche Inukake des Uesugi, était l’adjoint de Mochiuji (Kantō kanrei) depuis 1411, mais après une querelle au conseil en 1415, il fut démis et remplacé par Uesugi Norimoto, de la branche rivale des Yamanouchi. Zenshū s’allia à l’oncle de Mochiuji, Ashikaga Mitsutaka, et au fils adoptif de celui-ci, Mochinaka, et rallia de nombreuses maisons de l’Est, parmi lesquelles les Takeda de Kai, les Chiba, les Iwamatsu et les Nasu. Dans la nuit du 2e jour du dixième mois de 1416, ils se soulevèrent à Kamakura et prirent la ville ; Mochiuji et Norimoto s’échappèrent, Mochiuji vers le Suruga. Le shogun Ashikaga Yoshimochi choisit de soutenir son parent Mochiuji et envoya contre les rebelles Imagawa Norimasa de Suruga, Uesugi Fusakata d’Echigo et d’autres seigneurs. Zenshū battit les Edo et les Toshima de Musashi, qui s’étaient retournés contre lui, à Seyagahara le jour de l’An 1417, mais à mesure que l’armée des Imagawa avançait dans le Sagami, ses soutiens l’abandonnèrent. Le 10e jour du premier mois de 1417, Zenshū, Mitsutaka et Mochinaka se donnèrent la mort à Yukinoshita, à Kamakura, près du sanctuaire Tsurugaoka Hachimangū. Mochiuji passa ensuite des années à punir les alliés des rebelles, parmi lesquels des maisons que le shogunat protégeait, et ses relations avec Kyoto ne s’en remirent jamais ; la querelle conduisit à la rébellion d’Eikyō de 1438.
