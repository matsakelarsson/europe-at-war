# French translations of the catalogue text (wave 13); step bodies follow later.
Uganda–Tanzania War: Guerre ougando-tanzanienne
? The war between Idi Amin’s Uganda and Julius Nyerere’s Tanzania that ended with the fall of Amin. Relations had been hostile since Amin overthrew Milton Obote in 1971 and Obote took refuge in Tanzania. In October 1978 Ugandan troops, amid unrest in their own army, crossed the border, and on 30 October about 3,000 of them invaded the Kagera Salient, the Tanzanian land between the border and the Kagera River, killing some 1,500 civilians; on 1 November Amin announced its annexation. Nyerere declared war, mobilised the Tanzania People’s Defence Force (TPDF), which grew from under 40,000 to over 150,000, and drove the Ugandans out of Kagera by January 1979. With Ugandan exile forces, among them Obote’s supporters and Yoweri Museveni’s FRONASA, the TPDF then invaded Uganda, took and razed Masaka and Mbarara in February, and on 10–11 March defeated a Ugandan, Libyan and Palestinian force at Lukaya, the largest battle of the war; Muammar Gaddafi had sent about 4,500 Libyan troops to save Amin, and the PLO a few hundred fighters. While the exiles formed the Uganda National Liberation Front (UNLF) at Moshi, the Tanzanians took Entebbe on 7 April and Kampala on 10–11 April 1979; Amin fled to Libya and later Saudi Arabia, and the UNLF’s Yusuf Lule became president. Tanzanian forces reached the Sudanese border on 3 June. Tanzania lost 373 soldiers, 96 of them in combat, and about 1,500 civilians; about 1,000 Ugandan soldiers and at least 600 Libyans were killed. Numbers of Ugandan civilian deaths are uncertain; revenge killings by Ugandan rebels in the north and west were widespread. The war cost Tanzania between $500 million and $1 billion, and its troops stayed in Uganda until 1981, while Uganda slid into the Bush War.
: La guerre entre l’Ouganda d’Idi Amin et la Tanzanie de Julius Nyerere, qui se termina par la chute d’Amin. Les relations étaient hostiles depuis qu’Amin avait renversé Milton Obote en 1971 et qu’Obote s’était réfugié en Tanzanie. En octobre 1978, des troupes ougandaises, sur fond de troubles au sein de leur propre armée, franchirent la frontière et, le 30 octobre, environ 3 000 d’entre elles envahirent le saillant de la Kagera, le territoire tanzanien compris entre la frontière et la rivière Kagera, tuant quelque 1 500 civils ; le 1er novembre, Amin en annonça l’annexion. Nyerere déclara la guerre, mobilisa la Force de défense populaire de Tanzanie (TPDF), dont les effectifs passèrent de moins de 40 000 à plus de 150 000 hommes, et chassa les Ougandais de la Kagera en janvier 1979. Avec des forces ougandaises en exil, parmi lesquelles les partisans d’Obote et le FRONASA de Yoweri Museveni, la TPDF envahit ensuite l’Ouganda, prit et rasa Masaka et Mbarara en février et, les 10 et 11 mars, vainquit à Lukaya une force ougandaise, libyenne et palestinienne, lors de la plus grande bataille de la guerre ; Mouammar Kadhafi avait envoyé environ 4 500 soldats libyens pour sauver Amin, et l’OLP quelques centaines de combattants. Tandis que les exilés formaient le Front national de libération de l’Ouganda (UNLF) à Moshi, les Tanzaniens prirent Entebbe le 7 avril et Kampala les 10 et 11 avril 1979 ; Amin s’enfuit en Libye, puis en Arabie saoudite, et Yusuf Lule, de l’UNLF, devint président. Les forces tanzaniennes atteignirent la frontière soudanaise le 3 juin. La Tanzanie perdit 373 soldats, dont 96 au combat, et environ 1 500 civils ; environ 1 000 soldats ougandais et au moins 600 Libyens furent tués. Le nombre de civils ougandais tués est incertain ; les rebelles ougandais commirent de nombreux meurtres par vengeance dans le nord et l’ouest. La guerre coûta à la Tanzanie entre 500 millions et 1 milliard de dollars, et ses troupes restèrent en Ouganda jusqu’en 1981, tandis que l’Ouganda sombrait dans la guerre de brousse.
