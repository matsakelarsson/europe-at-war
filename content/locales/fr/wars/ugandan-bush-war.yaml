# French translations of the catalogue text (wave 13); step bodies follow later.
Ugandan Bush War: Guerre de brousse ougandaise
? The civil war in Uganda between the governments of Milton Obote and, from July 1985, Tito Okello, with their Uganda National Liberation Army (UNLA), and several rebel groups, above all Yoweri Museveni’s National Resistance Army (NRA), which won it in January 1986. After Tanzania and Ugandan exiles overthrew Idi Amin in 1979, Obote returned to power in disputed elections in December 1980. Former Amin soldiers had already risen in West Nile in October 1980, and the UNLA’s reprisals there drove some 250,000 people into exile. Museveni, who said the elections had been rigged, began a guerrilla war on 6 February 1981 with an attack on Kabamba barracks; his Popular Resistance Army merged with Yusuf Lule’s fighters into the National Resistance Movement and its army, with its base in the Luwero Triangle north of Kampala. The UNLA, advised by North Korean officers, fought the NRA there with massacres, looting and the forced removal of hundreds of thousands of civilians into camps, notably in Operation Bonanza from June 1983. After Acholi officers under Bazilio Olara-Okello and Tito Okello overthrew Obote in July 1985, the NRA refused a power-sharing deal signed in Nairobi in December, took Masaka and Mbarara and entered Kampala on 26 January 1986; Museveni was sworn in as president on 29 January, and the NRA took the north in March. Estimates of the dead range from about 100,000 to 500,000, most of them civilians; the International Committee of the Red Cross estimated in 1985 that the Obote government was responsible for more than 300,000 civilian deaths since 1980. The NRA also committed abuses and used child soldiers, the kadogo. The defeated northern soldiers formed new rebel groups, among them those that led to the Lord’s Resistance Army.
: La guerre civile qui opposa en Ouganda les gouvernements de Milton Obote puis, à partir de juillet 1985, de Tito Okello, avec leur Armée de libération nationale de l’Ouganda (UNLA), à plusieurs groupes rebelles, surtout l’Armée de résistance nationale (NRA) de Yoweri Museveni, qui la remporta en janvier 1986. Après le renversement d’Idi Amin par la Tanzanie et les exilés ougandais en 1979, Obote revint au pouvoir à l’issue d’élections contestées en décembre 1980. D’anciens soldats d’Amin s’étaient déjà soulevés dans le Nil occidental en octobre 1980, et les représailles de l’UNLA dans cette région poussèrent quelque 250 000 personnes à l’exil. Museveni, qui affirmait que les élections avaient été truquées, lança une guérilla le 6 février 1981 par une attaque contre la caserne de Kabamba ; son Armée populaire de résistance fusionna avec les combattants de Yusuf Lule pour former le Mouvement de résistance nationale et son armée, avec pour base le triangle de Luwero, au nord de Kampala. L’UNLA, conseillée par des officiers nord-coréens, y combattit la NRA par des massacres, des pillages et le déplacement forcé de centaines de milliers de civils dans des camps, notamment lors de l’opération Bonanza, à partir de juin 1983. Après le renversement d’Obote en juillet 1985 par des officiers acholi menés par Bazilio Olara-Okello et Tito Okello, la NRA refusa un accord de partage du pouvoir signé à Nairobi en décembre, prit Masaka et Mbarara et entra dans Kampala le 26 janvier 1986 ; Museveni prêta serment comme président le 29 janvier, et la NRA prit le nord en mars. Les estimations du nombre de morts vont d’environ 100 000 à 500 000, pour la plupart des civils ; le Comité international de la Croix-Rouge estima en 1985 que le gouvernement Obote était responsable de plus de 300 000 morts civils depuis 1980. La NRA commit elle aussi des exactions et utilisa des enfants soldats, les kadogo. Les soldats du Nord vaincus formèrent de nouveaux groupes rebelles, dont ceux qui donnèrent naissance à l’Armée de résistance du Seigneur.
