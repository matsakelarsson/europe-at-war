# French translations of the catalogue text (wave 12); step bodies follow later.
Umar Tall’s jihad: Le djihad d’Oumar Tall
? The holy war of al-Hajj Umar Tall, a Tijani scholar from Futa Toro on the Senegal, which in twelve years built the largest state of the western Sudan, the Umarian or Toucouleur Empire. From his community at Dinguiraye, in the hills east of Futa Jallon, Umar declared jihad after the king of Tamba attacked him in September 1852. He conquered Bambuk and the Khasso kingdoms in 1854 and the Bamana kingdom of Kaarta in 1855, making its capital Nioro his own. When he turned west towards his homeland on the Senegal he met the French of Governor Louis Faidherbe, who had built a fort at Médine; Umar besieged it from April to July 1857 and failed, and after recruiting thousands of emigrants in Futa Toro he left the Senegal valley to the French. In 1860–1861 he conquered the Bamana kingdom of Ségou, and in May 1862, after the battle of Cayawal, the Fulbe Caliphate of Hamdullahi in Massina, a Muslim state whose overthrow he had to justify in writing. Massina rose against him in 1863 under Ba Lobbo and the Kunta scholar Ahmad al-Bakkay; Umar was besieged in Hamdullahi, broke out in February 1864 and died in the cliffs of Degembere near Bandiagara. His son Ahmadu ruled from Ségou and his nephew Tidiani from Bandiagara until the French conquest of 1890–1893. Umar is remembered in Senegal as a reformer and a resister of the French, and in parts of Mali as a conqueror whose wars of booty and captives devastated the middle Niger.
: La guerre sainte d’el-Hadj Oumar Tall, lettré tidjane du Fouta-Toro, sur le Sénégal, qui bâtit en douze ans le plus grand État du Soudan occidental, l’empire omarien ou toucouleur. Depuis sa communauté de Dinguiraye, dans les collines à l’est du Fouta-Djalon, Oumar proclama le djihad après que le roi du Tamba l’eut attaqué en septembre 1852. Il conquit le Bambouk et les royaumes du Khasso en 1854, puis en 1855 le royaume bambara du Kaarta, dont il fit sienne la capitale, Nioro. Lorsqu’il se tourna vers l’ouest, vers son pays natal sur le Sénégal, il se heurta aux Français du gouverneur Louis Faidherbe, qui avaient construit un fort à Médine ; Oumar l’assiégea en vain d’avril à juillet 1857 et, après avoir recruté des milliers d’émigrants au Fouta-Toro, abandonna la vallée du Sénégal aux Français. En 1860–1861, il conquit le royaume bambara de Ségou et, en mai 1862, après la bataille de Cayawal, le califat peul de Hamdallahi au Macina, un État musulman dont il dut justifier le renversement par écrit. Le Macina se souleva contre lui en 1863 sous la conduite de Ba Lobbo et du lettré kounta Ahmad al-Bakkay ; assiégé dans Hamdallahi, Oumar parvint à en sortir en février 1864 et mourut dans les falaises de Déguembéré, près de Bandiagara. Son fils Ahmadou régna depuis Ségou et son neveu Tidiani depuis Bandiagara jusqu’à la conquête française de 1890–1893. Oumar est honoré au Sénégal comme un réformateur et un résistant face aux Français ; dans certaines régions du Mali, on se souvient de lui comme d’un conquérant dont les guerres de butin et de captifs ravagèrent le moyen Niger.
