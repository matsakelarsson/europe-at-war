# French translations of the catalogue text (wave 12); step bodies follow later.
Umayyad–Fatimid struggle for the Maghreb: Lutte entre Omeyyades et Fatimides pour le Maghreb
? "Seventy years of war by proxy between the two rival caliphates of the west, the Ismaili Fatimids of Ifriqiya and Cairo and the Sunni Umayyads of Córdoba, for the lands of today’s Morocco and western Algeria. The Fatimids struck first: their Miknasa general Masala ibn Habus sacked Nekor in 917 and in 921 deposed the Idrisid ruler of Fez and restored their rule at Sijilmasa. Abd al-Rahman III answered by taking Melilla (927), Ceuta (931) and later Tangier as bridgeheads, and by winning over Berber chiefs such as Musa ibn Abi’l-Afiya and the Zenata emirs of the Maghrawa and the Banu Ifran. The Idrisids, driven from Fez to their mountain fortress of Hajar al-Nasr in the Rif, changed sides as each caliph gained the upper hand. Jawhar’s great expedition of 958–959 took Sijilmasa and Fez and carried Fatimid rule to the Atlantic, but after the Fatimids moved to Egypt, the Umayyad general Ghalib took the last Idrisid, al-Hasan ibn Qannun, to Córdoba in 974. A Zirid counter-offensive in 979–980 failed to hold the west, and when al-Hasan returned from Egypt in 985 he was defeated and killed. Fez and the north were left to Zenata emirs allied with Córdoba."
: "Soixante-dix ans de guerre par procuration entre les deux califats rivaux de l’Occident musulman, les Fatimides ismaéliens d’Ifriqiya et du Caire et les Omeyyades sunnites de Cordoue, pour les terres de l’actuel Maroc et de l’ouest de l’Algérie. Les Fatimides frappèrent les premiers : leur général miknassa Masala ibn Habus mit Nekor à sac en 917 et, en 921, déposa le souverain idrisside de Fès et rétablit leur autorité à Sijilmassa. Abd al-Rahman III riposta en prenant Melilla (927), Ceuta (931) puis Tanger comme têtes de pont, et en gagnant à sa cause des chefs berbères comme Musa ibn Abi’l-Afiya et les émirs zénètes des Maghrawa et des Banu Ifran. Les Idrissides, chassés de Fès vers leur forteresse de montagne de Hajar al-Nasr, dans le Rif, changèrent de camp au gré des succès de chaque calife. La grande expédition de Jawhar en 958–959 prit Sijilmassa et Fès et porta la domination fatimide jusqu’à l’Atlantique, mais après l’installation des Fatimides en Égypte, le général omeyyade Ghalib emmena le dernier Idrisside, al-Hasan ibn Qannun, à Cordoue en 974. Une contre-offensive ziride en 979–980 ne parvint pas à tenir l’ouest, et lorsqu’al-Hasan revint d’Égypte en 985, il fut vaincu et tué. Fès et le nord furent laissés aux émirs zénètes alliés de Cordoue."
