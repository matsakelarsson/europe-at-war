# Some French text was translated automatically.
"Unification of Norway (Battle of Hafrsfjord)": "Unification de la Norvège (Bataille de Hafrsfjord)"
"Harald Fairhair’s wars to make himself king over the petty kingdoms of western Norway, which culminated in his naval victory over a coalition of chieftains from Rogaland and the west coast in Hafrsfjord, near today’s Stavanger. The date is uncertain; the traditional year 872 is a 19th-century estimate, and historians have placed the battle anywhere between about 870 and 900, most now favouring the 880s. Later tradition held that many who refused to submit emigrated to Iceland.": "Harald Fairhair's guerres pour se faire roi sur les petits royaumes de la Norvège occidentale, qui a culminé dans sa victoire navale sur une coalition de chefs du Rogaland et de la côte ouest à Hafrsfjord, près d’aujourd'hui de Stavanger. La date est incertaine ; l’année traditionnelle 872 est une estimation du XIXe siècle, et les historiens ont placé la bataille n’importe où entre environ 870 et 900, la plupart maintenant favorisant les 880."
"The only near-contemporary source is a praise poem by Harald’s court poet, Thorbjørn Hornklove. The fuller story comes from Snorri Sturluson’s sagas, written more than 300 years later. Most historians now see the unification of Norway as a long process rather than the result of one battle.": "La seule source quasi contemporaine est un poème de louange du poète de la cour d’Harald, Thorbjørn Hornklove. L’histoire plus complète vient de Snorri Sturluson, sagas, écrit plus de 300 ans plus tard. La plupart des historiens voient maintenant l’unification de la Norvège comme un long processus plutôt que le résultat d’une bataille."
"The start year shown is the traditional date, used for Norway’s millennial celebrations in 1872, not a firm date.": "L’année de début indiquée est la date traditionnelle, utilisée pour les célébrations du millénaire en Norvège en 1872, pas une date ferme."
