# French translations of the catalogue text (wave 7); step bodies follow later.
Unification of Saudi Arabia: Unification de l’Arabie saoudite
The thirty years of wars in which Abdulaziz ibn Saud (Ibn Saud) rebuilt the Saudi state from exile in Kuwait. Starting with the capture of Riyadh by a small band in 1902, he defeated the Rashidi emirs of Ha’il, took al-Hasa from the Ottomans in 1913, conquered Ha’il in 1921 and the Hashemite Kingdom of the Hejaz in 1924–1925, and crushed the revolt of his own Ikhwan warriors in 1929–1930. In 1932 his lands were united as the Kingdom of Saudi Arabia.: Les trente années de guerres au cours desquelles Abdelaziz ibn Saoud (Ibn Saoud) reconstruisit l’État saoudien depuis son exil au Koweït. À partir de la prise de Riyad par une petite troupe en 1902, il vainquit les émirs rachidites de Haïl, prit al-Hassa aux Ottomans en 1913, conquit Haïl en 1921 et le royaume hachémite du Hedjaz en 1924–1925, et écrasa la révolte de ses propres guerriers ikhwan en 1929–1930. En 1932, ses territoires furent unis en un royaume d’Arabie saoudite.
