# French translations of the catalogue text (wave 9); step bodies follow later.
Unification of the Mongol tribes: Unification des tribus mongoles
? The wars in which Temüjin, a chief of the Borjigin Mongols on the Onon River, brought the peoples of the Mongolian steppe under his rule and took the title Genghis (Chinggis) Khan. With his patron Toghrul, khan of the Kereit, and his sworn brother Jamukha he defeated the Merkits; elected khan of the Mongols in the 1180s, he was beaten by Jamukha at Dalan Baljut and disappears from the record for some years. From 1196 he fought the Tatars as an ally of the Jin dynasty, crushed the Taichiud and a coalition that had made Jamukha its gur-khan, and in 1202 destroyed the Tatars. In 1203 Toghrul turned on him and routed him at Qalaqaljid Sands, but within months Temüjin surprised and absorbed the Kereit. In 1204 he defeated the Naiman of Tayang Khan at Chakirmaut and then the Merkits. Jamukha was handed over by his own men and put to death, and in 1206 a great assembly at the source of the Onon proclaimed Temüjin Genghis Khan of the Great Mongol State. The last Merkit and Naiman leaders were defeated on the Irtysh in 1208–1209.
: Les guerres au cours desquelles Temüdjin, chef des Mongols Borjigin sur l’Onon, soumit les peuples de la steppe mongole et prit le titre de Gengis (Tchinggis) Khan. Avec son protecteur Toghrul, khan des Kereït, et son frère juré Djamuqa, il vainquit les Merkites ; élu khan des Mongols dans les années 1180, il fut battu par Djamuqa à Dalan Baljut et disparut des sources pendant quelques années. À partir de 1196, il combattit les Tatars en allié de la dynastie Jin, écrasa les Taichiud et une coalition qui avait fait de Djamuqa son gur-khan, et anéantit les Tatars en 1202. En 1203, Toghrul se retourna contre lui et le mit en déroute aux sables de Qalaqaljid, mais en quelques mois Temüdjin surprit les Kereït et les absorba. En 1204, il battit les Naïmans de Tayang Khan à Chakirmaut, puis les Merkites. Djamuqa fut livré par ses propres hommes et mis à mort, et en 1206 une grande assemblée réunie aux sources de l’Onon proclama Temüdjin Gengis Khan du Grand État mongol. Les derniers chefs merkites et naïmans furent vaincus sur l’Irtych en 1208–1209.
