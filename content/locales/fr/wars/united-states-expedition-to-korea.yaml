# French translations of the catalogue text (wave 10); step bodies follow later.
United States expedition to Korea: Expédition américaine en Corée
"An American naval expedition to Korea, called Sinmi Yangyo in Korean (“the Western disturbance of 1871”). Frederick Low, the United States minister to China, and Rear Admiral John Rodgers sailed to Korea with five warships to learn the fate of the merchant schooner General Sherman, destroyed at Pyongyang in 1866, and to negotiate a treaty. On 1 June 1871 Korean batteries fired on American ships surveying the Ganghwa strait. When no apology came, about 650 sailors and marines landed on Ganghwa on 10 June, took the forts of Chojijin and Deokjinjin, and on 11 June stormed the citadel of Gwangseongbo, where the Korean commander Eo Jae-yeon and most of his men were killed: 243 Koreans by the American count, against three Americans. The Korean government still refused to negotiate, and the squadron left for China on 3 July. The regent Heungseon Daewongun set up stelae across the country warning against peace with Westerners; Korea and the United States signed a treaty only in 1882.": "Une expédition navale américaine en Corée, appelée Sinmi Yangyo en coréen (« les troubles occidentaux de 1871 »). Frederick Low, ministre des États-Unis en Chine, et le contre-amiral John Rodgers se rendirent en Corée avec cinq navires de guerre pour connaître le sort de la goélette marchande General Sherman, détruite à Pyongyang en 1866, et pour négocier un traité. Le 1er juin 1871, des batteries coréennes ouvrirent le feu sur des navires américains qui effectuaient des relevés dans le détroit de Ganghwa. Faute d’excuses, environ 650 marins et fusiliers marins débarquèrent sur Ganghwa le 10 juin, prirent les forts de Chojijin et de Deokjinjin et, le 11 juin, prirent d’assaut la citadelle de Gwangseongbo, où le commandant coréen Eo Jae-yeon et la plupart de ses hommes furent tués : 243 Coréens selon le décompte américain, contre trois Américains. Le gouvernement coréen refusa toujours de négocier, et l’escadre repartit pour la Chine le 3 juillet. Le régent Heungseon Daewongun fit ériger dans tout le pays des stèles mettant en garde contre toute paix avec les Occidentaux ; la Corée et les États-Unis ne signèrent un traité qu’en 1882."
