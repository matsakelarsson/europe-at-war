# French translations of the catalogue text (wave 14); step bodies follow later.
United States invasion of Grenada: Invasion de la Grenade par les États-Unis
? The American-led invasion of Grenada in October 1983, code-named Operation Urgent Fury, which overthrew the military council that had seized power after the killing of Prime Minister Maurice Bishop. Bishop’s New Jewel Movement had taken power in a revolution in 1979 and set up the People’s Revolutionary Government, which built close ties with Cuba and the Soviet Union and, with Cuban workers, a new international airport at Point Salines that the Reagan administration said was meant for military use. In October 1983 a rival faction around Deputy Prime Minister Bernard Coard put Bishop under house arrest; when a crowd freed him on 19 October, soldiers executed him and seven others at Fort Rupert, and General Hudson Austin’s Revolutionary Military Council took power under a shoot-on-sight curfew. At the request of the Organisation of Eastern Caribbean States, Barbados and Jamaica, and citing the safety of about 600 American medical students, President Reagan sent some 7,300 troops, joined by about 350 soldiers and police of a Caribbean Peace Force. They landed on 25 October against resistance from the People’s Revolutionary Army and armed Cuban construction workers and military personnel, and by 28 October held the island. The United States lost 19 killed and 116 wounded; 45 Grenadian soldiers, 25 Cubans and at least 24 Grenadian civilians were killed, 18 of them when American aircraft bombed a mental hospital by mistake. The UN General Assembly condemned the invasion as a flagrant violation of international law by 108 votes to 9, and Britain, whose queen was Grenada’s head of state, had not been consulted. The Governor-General, Sir Paul Scoon, appointed an interim government, American combat troops left in December 1983, and elections were held in December 1984.
: L’invasion de la Grenade menée par les États-Unis en octobre 1983, sous le nom de code d’opération Urgent Fury, qui renversa le conseil militaire qui avait pris le pouvoir après l’assassinat du Premier ministre Maurice Bishop. Le New Jewel Movement de Bishop avait pris le pouvoir lors d’une révolution en 1979 et instauré le Gouvernement révolutionnaire populaire, qui noua des liens étroits avec Cuba et l’Union soviétique et construisit, avec des ouvriers cubains, un nouvel aéroport international à Point Salines, destiné selon l’administration Reagan à un usage militaire. En octobre 1983, une faction rivale réunie autour du vice-Premier ministre Bernard Coard plaça Bishop en résidence surveillée ; lorsque la foule le libéra, le 19 octobre, des soldats l’exécutèrent avec sept autres personnes à Fort Rupert, et le Conseil militaire révolutionnaire du général Hudson Austin prit le pouvoir en imposant un couvre-feu avec ordre de tirer à vue. À la demande de l’Organisation des États de la Caraïbe orientale, de la Barbade et de la Jamaïque, et en invoquant la sécurité d’environ 600 étudiants en médecine américains, le président Reagan envoya quelque 7 300 soldats, rejoints par environ 350 soldats et policiers d’une Force de paix caribéenne. Ils débarquèrent le 25 octobre face à la résistance de l’Armée révolutionnaire populaire et d’ouvriers du bâtiment et de militaires cubains armés, et le 28 octobre ils tenaient l’île. Les États-Unis eurent 19 tués et 116 blessés ; 45 soldats grenadiens, 25 Cubains et au moins 24 civils grenadiens furent tués, dont 18 lorsque des avions américains bombardèrent par erreur un hôpital psychiatrique. L’Assemblée générale des Nations unies condamna l’invasion comme une violation flagrante du droit international par 108 voix contre 9, et la Grande-Bretagne, dont la reine était le chef de l’État de la Grenade, n’avait pas été consultée. Le gouverneur général, Sir Paul Scoon, nomma un gouvernement intérimaire ; les troupes de combat américaines partirent en décembre 1983, et des élections eurent lieu en décembre 1984.
