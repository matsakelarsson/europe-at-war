# French translations of the catalogue text (wave 14); step bodies follow later.
United States occupation of Haiti: Occupation d’Haïti par les États-Unis
? The occupation of Haiti by the United States Marine Corps from 1915 to 1934, and the Caco wars fought against it. After years of political turmoil, in which rival politicians used peasant armies called cacos to seize power, and with American banks in control of Haiti’s national bank, President Woodrow Wilson sent Marines ashore at Port-au-Prince on 28 July 1915, the day after President Vilbrun Guillaume Sam was killed by a crowd. The United States installed President Philippe Sudré Dartiguenave, took control of Haiti’s customs and finances by a treaty of 1915 and created a Gendarmerie officered by Marines. The cacos of the north were defeated in the First Caco War, ending with the fall of Fort Rivière on 17 November 1915. Forced road labour (the corvée) and a constitution of 1918 that let foreigners own land provoked a larger rising in 1918–1920 under Charlemagne Péralte and, after Marines killed him in 1919, Benoît Batraville. The Marines reported 2,250 to 3,250 Haitians killed in the fighting of 1915–1920; Haitian estimates of the dead of the whole occupation run to 15,000. After the killing of protesters at Marchaterre near Les Cayes in 1929 and the Forbes Commission, the United States handed back power, and the last Marines left on 15 August 1934; US control of Haiti’s finances lasted until 1947.
: L’occupation d’Haïti par le corps des Marines des États-Unis de 1915 à 1934, et les guerres des Cacos qui lui furent opposées. Après des années de troubles politiques, au cours desquelles des politiciens rivaux se servaient d’armées paysannes appelées cacos pour s’emparer du pouvoir, et alors que des banques américaines contrôlaient la banque nationale d’Haïti, le président Woodrow Wilson fit débarquer des Marines à Port-au-Prince le 28 juillet 1915, au lendemain de la mort du président Vilbrun Guillaume Sam, tué par la foule. Les États-Unis installèrent au pouvoir le président Philippe Sudré Dartiguenave, prirent le contrôle des douanes et des finances haïtiennes par un traité de 1915 et créèrent une Gendarmerie encadrée par des officiers des Marines. Les cacos du Nord furent vaincus lors de la première guerre des Cacos, qui s’acheva par la chute du fort Rivière le 17 novembre 1915. Le travail forcé sur les routes (la corvée) et une constitution de 1918 qui autorisait les étrangers à posséder des terres provoquèrent un soulèvement plus vaste en 1918–1920, mené par Charlemagne Péralte puis, après que des Marines l’eurent tué en 1919, par Benoît Batraville. Selon les rapports des Marines, 2 250 à 3 250 Haïtiens furent tués dans les combats de 1915–1920 ; les estimations haïtiennes des morts de toute l’occupation vont jusqu’à 15 000. Après la fusillade qui tua des manifestants à Marchaterre, près des Cayes, en 1929, et la commission Forbes, les États-Unis rendirent le pouvoir, et les derniers Marines partirent le 15 août 1934 ; le contrôle américain des finances haïtiennes dura jusqu’en 1947.
