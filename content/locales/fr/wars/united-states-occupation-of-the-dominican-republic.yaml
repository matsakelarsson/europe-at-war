# French translations of the catalogue text (wave 14); step bodies follow later.
United States occupation of the Dominican Republic: Occupation de la République dominicaine par les États-Unis
? The occupation of the Dominican Republic by the United States from 1916 to 1924. The country had been under an American customs receivership since 1905, and in 1916, with Dominican politics in turmoil and the First World War raising American fears of German influence, President Woodrow Wilson’s government demanded control of Dominican finances and armed forces. When the Secretary of War, Desiderio Arias, broke with President Juan Isidro Jimenes, US Marines landed at Santo Domingo on 5 May 1916; Jimenes resigned rather than accept American terms, and the Marines occupied the capital on 15 May. Colonel Joseph H. Pendleton’s Marines marched inland from Monte Cristi and Puerto Plata, defeated Arias’s men at Las Trencheras (27 June) and Guayacanas (3 July) and entered Santiago. When the provisional Dominican government still refused American demands, a US military government was proclaimed on 29 November 1916. It ruled by decree, built roads, disarmed the population and created a National Guard, while in the eastern sugar provinces guerrillas whom the Americans called gavilleros fought the Marines from 1917 to 1922. Under pressure at home and from Latin America, the United States agreed in 1922 to withdraw; Horacio Vásquez was elected president in 1924, and the last American forces left on 18 September 1924. The National Guard that the Marines trained became the base of Rafael Trujillo’s dictatorship from 1930.
: L’occupation de la République dominicaine par les États-Unis de 1916 à 1924. Le pays était placé sous tutelle douanière américaine depuis 1905, et en 1916, alors que la vie politique dominicaine était en plein désordre et que la Première Guerre mondiale faisait craindre aux Américains une influence allemande, le gouvernement du président Woodrow Wilson exigea le contrôle des finances et des forces armées dominicaines. Lorsque le secrétaire à la Guerre, Desiderio Arias, rompit avec le président Juan Isidro Jimenes, des Marines américains débarquèrent à Santo Domingo le 5 mai 1916 ; Jimenes démissionna plutôt que d’accepter les conditions américaines, et les Marines occupèrent la capitale le 15 mai. Les Marines du colonel Joseph H. Pendleton marchèrent vers l’intérieur depuis Monte Cristi et Puerto Plata, battirent les hommes d’Arias à Las Trencheras (27 juin) et à Guayacanas (3 juillet) et entrèrent à Santiago. Comme le gouvernement provisoire dominicain refusait toujours les exigences américaines, un gouvernement militaire américain fut proclamé le 29 novembre 1916. Il gouverna par décret, construisit des routes, désarma la population et créa une Garde nationale, tandis que dans les provinces sucrières de l’est des guérilleros que les Américains appelaient gavilleros combattaient les Marines de 1917 à 1922. Sous la pression de l’opinion américaine et de l’Amérique latine, les États-Unis acceptèrent en 1922 de se retirer ; Horacio Vásquez fut élu président en 1924, et les dernières forces américaines partirent le 18 septembre 1924. La Garde nationale formée par les Marines devint la base de la dictature de Rafael Trujillo à partir de 1930.
