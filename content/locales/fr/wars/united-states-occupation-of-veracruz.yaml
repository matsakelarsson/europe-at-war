# French translations of the catalogue text (wave 14); step bodies follow later.
United States occupation of Veracruz: Occupation de Veracruz par les États-Unis
? The seizure and seven-month occupation of Mexico’s main port by United States forces during the Mexican Revolution. President Woodrow Wilson had refused to recognise Victoriano Huerta, who had taken power in the coup of February 1913 in which President Francisco I. Madero was murdered. When soldiers of Huerta’s garrison briefly detained nine American sailors at Tampico on 9 April 1914, Admiral Henry Mayo demanded a 21-gun salute to the US flag, which Huerta refused, and on 21 April, told that the German steamer Ypiranga was about to land arms for Huerta, Wilson ordered the navy to seize the customs house at Veracruz. The Mexican commander withdrew his troops on orders from the capital, but naval cadets, freed prisoners and townspeople fought the landing parties in the streets for two days. Nineteen Americans were killed; Mexican losses are estimated at 150 to 200 dead, soldiers, cadets and civilians. The army under Frederick Funston governed the city until 23 November 1914, while Argentina, Brazil and Chile mediated at Niagara Falls. The occupation cut Huerta off from the customs revenue of the port and hastened his fall in July, and the Americans left the city, with the arms they had stored there, to Venustiano Carranza’s Constitutionalists. In Mexico it is remembered as an invasion, and it left lasting resentment.
: La prise et l’occupation pendant sept mois du principal port du Mexique par les forces des États-Unis, durant la révolution mexicaine. Le président Woodrow Wilson avait refusé de reconnaître Victoriano Huerta, arrivé au pouvoir par le coup d’État de février 1913, au cours duquel le président Francisco I. Madero avait été assassiné. Lorsque des soldats de la garnison de Huerta retinrent brièvement neuf marins américains à Tampico, le 9 avril 1914, l’amiral Henry Mayo exigea une salve de 21 coups de canon en l’honneur du drapeau américain, ce que Huerta refusa ; le 21 avril, informé que le vapeur allemand Ypiranga était sur le point de débarquer des armes pour Huerta, Wilson ordonna à la marine de s’emparer de la douane de Veracruz. Le commandant mexicain retira ses troupes sur ordre de la capitale, mais des élèves de l’École navale, des prisonniers libérés et des habitants combattirent les détachements de débarquement dans les rues pendant deux jours. Dix-neuf Américains furent tués ; les pertes mexicaines sont estimées entre 150 et 200 morts, soldats, élèves officiers et civils. L’armée, sous les ordres de Frederick Funston, administra la ville jusqu’au 23 novembre 1914, tandis que l’Argentine, le Brésil et le Chili menaient une médiation à Niagara Falls. L’occupation priva Huerta des recettes douanières du port et hâta sa chute en juillet, et les Américains laissèrent la ville, avec les armes qu’ils y avaient entreposées, aux constitutionnalistes de Venustiano Carranza. Au Mexique, on s’en souvient comme d’une invasion, et elle laissa un ressentiment durable.
