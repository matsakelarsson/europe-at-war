"1190–1202": "1190–1202"
"Now on the offensive, the Bulgarians and their Cuman allies raided Thrace and Macedonia. In 1194 they routed a Byzantine army at Arcadiopolis, and in 1196 Asen beat another near Serres. But the brothers made enemies among their own nobles. Asen was murdered by the boyar Ivanko in 1196, and Peter was killed the next year. Their younger brother Kaloyan, who had spent years as a hostage in Constantinople, took power in 1197.": "Sur l’offensive, les Bulgares et leurs alliés Cuman ont attaqué Thrace et la Macédoine. En 1194 ils ont dirigé une armée byzantine à Arcadiopolis, et en 1196 Asen a battu un autre près de Serres. Mais les frères ont fait des ennemis parmi leurs propres nobles. Asen a été assassiné par le boyar Ivanko en 1196, et Peter a été tué l’année suivante. Leur jeune frère Kaloyan, qui avait passé des années en otage à Constantinople, a pris le pouvoir en 1197."
"Kaloyan pressed on. He took Constantia and, in March 1201, the Black Sea port of Varna, and the weak emperor Alexios III made peace with him in 1201 or 1202, accepting his rule over the lands he held. Kaloyan sought recognition from Pope Innocent III, and in November 1204 a papal legate crowned him king at Tarnovo. The Second Bulgarian Empire, which he called an empire of the Bulgarians and Vlachs, lasted until the Ottoman conquest of 1393–1396.": "Kaloyan poursuivit. Il prit Constantia et, en mars 1201, le port de la mer Noire de Varna, et le faible empereur Alexios III fit la paix avec lui en 1201 ou 1202, acceptant sa domination sur les terres qu’il détenait. Kaloyan chercha à être reconnu par le pape Innocent III, et en novembre 1204 un légat papale le couronne roi à Tarnovo. Le Second Empire bulgare, qu’il appela un empire des Bulgares et des Vlaches, dura jusqu’à la conquête ottomane de 1393–1396."
