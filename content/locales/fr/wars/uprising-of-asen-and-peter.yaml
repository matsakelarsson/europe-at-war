"1185–1190": "1185–1190"
"In 1185 the Byzantine emperor Isaac II Angelos raised a new tax to pay for his wedding to the daughter of Béla III of Hungary, and it fell heavily on the people of the Haemus (Balkan Mountains). Two brothers from the region, Theodore, later called Peter, and Asen, came to Isaac at Kypsella to ask for an estate and were refused and humiliated. On 26 October 1185, the feast of St Demetrius, they raised a revolt at Tarnovo, proclaiming that the saint had left Thessalonica to help them, and Peter took the title of tsar, reviving the Bulgarian Empire destroyed in 1018.": "En 1185, l’empereur byzantin Isaac II Angelos éleva une nouvelle taxe pour payer son mariage à la fille de Béla III de Hongrie, et il tomba lourdement sur le peuple des montagnes Haemus (Balkan). Deux frères de la région, Théodore, plus tard appelé Pierre, et Asen, vinrent à Isaac à Kypsella pour demander un domaine et furent refusés et humiliés. Le 26 octobre 1185, la fête de Saint-Demétrius, ils soulevèrent une révolte à Tarnovo, proclamant que le saint avait quitté Thessalonique pour les aider, et Pierre prit le titre de tsar, ravivant l’Empire bulgare détruit en 1018."
"Isaac’s campaign of 1186 drove many rebels north of the Danube, but they came back with Cuman horsemen from the steppe and held the land between the Haemus and the Danube. After a three-month siege of Lovech failed in 1187, Isaac agreed a truce that left them in control, taking the youngest brother, Kaloyan, as a hostage. In 1190 he tried again and besieged Tarnovo, but rumours of a Cuman army made him retreat, and in a mountain pass near Tryavna the Bulgarians ambushed his column. Isaac barely escaped, and the new state was secure.": "La campagne d’Isaac de 1186 a conduit de nombreux rebelles au nord du Danube, mais ils sont revenus avec Cuman cavaliers de la steppe et ont tenu le pays entre le Haemus et le Danube. Après un siège de trois mois de Lovech échoué en 1187, Isaac a convenu une trêve qui les a laissés en contrôle, prenant le plus jeune frère, Kaloyan, comme otage. En 1190, il essaya encore et assiégé Tarnovo, mais les rumeurs d’une armée de Cuman le firent battre en retraite, et dans un col de montagne près de Tryavna, les Bulgares embusquérent sa colonne. Isaac s’échappa à peine, et le nouvel État était sûr."
