"Uprising of Asen and Peter": "L’insurrection d’Asen et de Pierre"
"The revolt of the Bulgarians and Vlachs of the Balkan Mountains against Byzantine rule, led by the brothers Asen and Peter, which began at Tarnovo in 1185 and restored an independent Bulgarian state, the Second Bulgarian Empire. With Cuman help the rebels beat the emperor Isaac II at Tryavna in 1190 and went on to raid Thrace and Macedonia; their younger brother Kaloyan made peace with Byzantium in 1201 or 1202.": "La révolte des Bulgares et des Vlaches des Balkans contre la domination byzantine, menée par les frères Asen et Pierre, qui ont commencé à Tarnovo en 1185 et restauré un État bulgare indépendant, le Second Empire bulgare. Avec Cuman aider les rebelles battre l’empereur Isaac II à Tryavna en 1190 et a continué à attaquer Thrace et Macédoine ; leur frère cadet Kaloyan fait la paix avec Byzance en 1201 ou 1202."
"The main source is the Byzantine historian Niketas Choniates, who served Isaac II and took part in some of the campaigns. Historians debate how far the rising was Bulgarian or Vlach (Romanian-speaking) in character; the sources speak of both peoples, and the new state was ruled from Tarnovo as a Bulgarian empire.": "La source principale est l’historien byzantin Niketas Choniates, qui a servi Isaac II et a pris part à certaines des campagnes. Les historiens débattent jusqu’à quel point la montée était bulgare ou Vlach (Roumanie parlant) dans le caractère ; les sources parlent des deux peuples, et le nouvel État a été gouverné de Tarnovo comme un empire bulgare."
"Some accounts treat the uprising as ending with the truce of 1187, which left the rebels in control north of the Balkan Mountains; this entry follows the war to the peace Kaloyan made with Alexios III.": "Certains récits traitent le soulèvement comme se terminant par la trêve de 1187, qui a laissé les rebelles au contrôle au nord des montagnes des Balkans ; cette entrée suit la guerre à la paix Kaloyan faite avec Alexios III."
