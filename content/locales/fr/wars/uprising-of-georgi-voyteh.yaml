"Uprising of Georgi Voyteh": "Élèvement de Georgi Voyteh"
"A rising against Byzantine rule in the Balkans after the defeat at Manzikert. Bulgarian nobles in Skopje led by Georgi Voyteh asked Prince Mihailo of Duklja for a leader, and his son Constantine Bodin, a descendant of Samuel’s family, was proclaimed tsar of the Bulgarians as Peter III at Prizren in the autumn of 1072. The rebels routed a Byzantine army and took Skopje; Bodin marched north to Niš while his general Petrilo took Ohrid and Devol but was beaten at Kastoria. In December Michael Saronites retook Skopje and captured Bodin and Voyteh near Kosovo Polje. Voyteh died on the way to Constantinople, and the last rebels were put down by Nikephoros Bryennios in 1073.": "Une montée contre la domination byzantine dans les Balkans après la défaite à Manzikert. Les nobles bulgares à Skopje conduit par Georgi Voyteh a demandé le prince Mihailo de Duklja pour un dirigeant, et son fils Constantin Bodin, descendant de la famille Samuel, a été proclamé tsar des Bulgares comme Pierre III à Prizren à l’automne de 1072. Les rebelles ont conduit une armée byzantine et pris Skopje ; Bodin a marché vers le nord jusqu’à Niš tandis que son général Petrilo a pris Ohrid et Devol mais a été battu à Kastoria. En décembre Michael Saronites a repris Skopje et capturé Bodin et Voyteh près de Kosovo Polje. Voyteh est mort sur le chemin de Constantinople, et les derniers rebelles ont été abattus par Nikephoros Bryennios en 1073."
"The main sources are John Skylitzes’ continuator and Nikephoros Bryennios. In Serbian historiography the rising is known as the Slavic uprising against Byzantine rule. Bodin later escaped from captivity and ruled Duklja.": "Les principales sources d’information sont John Skylitzes, continueur et Nikephoros Bryennios. Dans l’historiographie serbe, la montée est connue comme le soulèvement slave contre la domination byzantine. Bodin plus tard échappé de captivité et gouverné Duklja."
