# Some French text was translated automatically.
"Uprising of Peter Delyan": "L’insurrection de Peter Delyan"
"The largest Bulgarian rising against Byzantine rule before 1185. Discontent grew when the government demanded taxes in coin instead of in kind, and in 1040 Peter Delyan, who claimed to be a grandson of Samuel, was proclaimed tsar in Belgrade. The rising spread south to Niš, Skopje and the region of Dyrrhachium, where a rival leader, Tihomir, was put to death. Alusian, a son of Ivan Vladislav, joined it but failed before Thessalonica; he then blinded Delyan and went over to the Byzantines. In 1041 the Emperor Michael IV defeated the rebels near Ostrovo, with Harald Hardrada among his Varangians, and the last resistance at Prilep and around Sofia was crushed.": "Le plus grand Bulgare se levant contre la domination byzantine avant 1185. Le mécontentement a augmenté lorsque le gouvernement a exigé des impôts en monnaie plutôt qu’en nature, et en 1040 Peter Delyan, qui prétendait être un petit-fils de Samuel, a été proclamé tsar à Belgrade. La montée s’est étendue au sud à Niš, Skopje et la région de Dyrrachium, où un chef rival, Tihomir, a été mis à mort. Alusian, un fils d’Ivan Vladislav, l’a rejoint mais a échoué avant Thessalonique ; il a alors aveugle Delyan et est passé aux Byzantins. En 1041, l’empereur Michael IV a vaincu les rebelles près d’Ostrovo, avec Harald Hardrada parmi ses Varangiens, et la dernière résistance à Prilep et autour de Sofia a été écrasée."
"The main source is John Skylitzes; Michael Psellos and the Norse sagas of Harald Hardrada add details. Whether Delyan was killed at Ostrovo or captured and taken to Constantinople is not known for certain.": "La source principale est John Skylitzes ; Michael Psellos et les sagas nordiques de Harald Hardrada ajouter des détails. Que Delyan a été tué à Ostrovo ou capturé et emmené à Constantinople n’est pas connu pour certain."
