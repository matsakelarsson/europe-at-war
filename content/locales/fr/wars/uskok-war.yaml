# Some French text was translated automatically.
"Uskok War": "Guerre d’Uskok"
"A war between Venice and Archduke Ferdinand of Inner Austria, also called the War of Gradisca, fought mainly around Gradisca and Gorizia on the Isonzo. Its cause was the Uskoks of Senj, refugees from the Ottoman advance who served the Habsburgs as frontier troops and, often unpaid, raided Ottoman and Venetian shipping in the Adriatic. After Uskok raids on Venetian territory in late 1615, Venice besieged the Habsburg fortress of Gradisca in 1616 and again in 1617, without taking it; the young Albrecht von Wallenstein helped to relieve it. Venice hired some 4,000 Dutch soldiers and English volunteers, while Spain, Ferdinand’s ally, sent money, and the Duke of Osuna, viceroy of Naples, sent his ships into the Adriatic, where his fleet fought the Venetians off Ragusa in November 1617. The Peace of Madrid of September 1617 restored the conquests; many Uskoks were executed or driven from Senj, and a permanent imperial garrison was placed in the town.": "Une guerre entre Venise et l’archiduc Ferdinand de l’Autriche intérieure, également appelé la guerre de Gradisca, a principalement combattu autour de Gradisca et Gorizia sur l’Isonzo. Sa cause était les Ouskoks de Senj, réfugiés de l’avance ottomane qui ont servi les Habsbourg comme troupes frontalières et, souvent impayés, ont attaqué la navigation ottomane et vénitienne dans l’Adriatique. Après les raids d’Uskok sur le territoire vénitien à la fin de 1615, Venise assiégea la forteresse Habsbourg de Gradisca en 1616 et encore en 1617, sans la prendre ; le jeune Albrecht von Wallenstein a contribué à la soulager. Venise engagea quelque 4 000 soldats néerlandais et volontaires anglais, tandis que l’Espagne, Ferdinand, envoya de l’argent, et le duc d’Osuna, vice-roi de Naples, envoya ses navires dans l’Adriatique, où sa flotte combattit les Vénitiens au large de Ragusa en novembre 1617. La paix de Madrid de septembre 1617 rétablit les conquêtes ; beaucoup d’Uskok furent exécutés ou chassés de Senj, et une garnison impériale permanente fut placée dans la ville."
"Dates are Gregorian. A truce on the Isonzo front was agreed on 6 November 1617, and fighting at sea went on into that month.": "Les dates sont Grégoriennes. Une trêve sur le front d’Isonzo a été convenue le 6 novembre 1617, et les combats en mer se sont poursuivis ce mois-là."
"The war ran alongside the War of the Montferrat Succession and was settled by the same treaties. Ferdinand, soon to be emperor, made peace partly to be free for the troubles in Bohemia that began the Thirty Years’ War.": "La guerre a couru à côté de la Guerre de la Succession Montferrat et a été réglée par les mêmes traités. Ferdinand, bientôt empereur, a fait la paix en partie pour être libre pour les troubles en Bohême qui ont commencé la guerre de Trente Ans."
