# French translations of the catalogue text (wave 14); step bodies follow later.
Utah War: Guerre de l’Utah
? An armed confrontation in 1857–1858 between the government of the United States and the Latter-day Saints of Utah Territory, led by their church president and territorial governor Brigham Young. Believing reports that the Mormons were in rebellion against federal authority, President James Buchanan replaced Young as governor with Alfred Cumming and sent some 2,500 soldiers to install him. Young declared martial law, called out the territorial militia, the Nauvoo Legion, and prepared to resist. On 11 September 1857 Mormon militiamen from southern Utah, with some Southern Paiutes, killed about 120 men, women and children of the Baker–Fancher wagon train from Arkansas at Mountain Meadows, the worst atrocity of the conflict. In October Mormon raiders under Lot Smith burned three army supply trains and the army wintered near the burned-out Fort Bridger. In 1858, through the mediation of Thomas L. Kane, Cumming entered Salt Lake City as governor, some 30,000 Latter-day Saints left their homes in northern Utah in the Move South, Buchanan pardoned those who submitted, and the army marched through the empty city on 26 June to set up Camp Floyd. There were no battles; about 150 people died in the conflict, most of them at Mountain Meadows.
: "Une confrontation armée qui opposa en 1857–1858 le gouvernement des États-Unis aux saints des derniers jours du territoire de l’Utah, menés par Brigham Young, président de leur Église et gouverneur du territoire. Ajoutant foi à des rapports selon lesquels les mormons étaient en rébellion contre l’autorité fédérale, le président James Buchanan remplaça Young au poste de gouverneur par Alfred Cumming et envoya quelque 2 500 soldats pour l’installer. Young proclama la loi martiale, mobilisa la milice territoriale, la Légion de Nauvoo, et se prépara à résister. Le 11 septembre 1857, des miliciens mormons du sud de l’Utah, accompagnés de quelques Paiutes du Sud, tuèrent environ 120 hommes, femmes et enfants du convoi de chariots Baker-Fancher, venu de l’Arkansas, à Mountain Meadows : ce fut la pire atrocité du conflit. En octobre, des partisans mormons menés par Lot Smith incendièrent trois convois de ravitaillement de l’armée, et l’armée hiverna près des ruines incendiées de Fort Bridger. En 1858, grâce à la médiation de Thomas L. Kane, Cumming entra à Salt Lake City en qualité de gouverneur, quelque 30 000 saints des derniers jours quittèrent leurs foyers du nord de l’Utah lors de l’exode vers le sud (Move South), Buchanan gracia ceux qui se soumettaient, et l’armée traversa la ville vide le 26 juin pour établir Camp Floyd. Il n’y eut pas de bataille ; environ 150 personnes moururent au cours du conflit, la plupart à Mountain Meadows."
