# French translations of the catalogue text (wave 14); step bodies follow later.
Ute War (White River War): Guerre des Utes (guerre de White River)
? A short war in western Colorado in 1879 between the White River Ute and the United States, which ended with the removal of most Ute from Colorado. The treaty of 1868 had given the Ute most of western Colorado for their “absolute and undisturbed use and occupation”, but miners moved onto their land in the 1870s, and Colorado’s governor, Frederick Pitkin, campaigned on the slogan “The Utes Must Go!”. Nathan Meeker, the agent at the White River Agency from 1878, tried to make the White River Ute settle as farmers and become Christians, and in September 1879 he had a pasture and racetrack where they kept their horses ploughed. After a scuffle with the Ute leader Canalla (Johnson), Meeker asked for troops, and Major Thomas Thornburgh marched from Fort Fred Steele in Wyoming with about 150 soldiers. The Ute had warned that troops entering the reservation would mean war. On 29 September 1879 Ute fighters under Nicaagat (Captain Jack) and Colorow met Thornburgh’s column at Milk Creek, about 29 km north of today’s Meeker, killed him and 13 of his men and besieged the rest for almost a week, until a company of the 9th Cavalry, Buffalo Soldiers under Captain Francis Dodge, reached them on 2 October and Colonel Wesley Merritt’s relief column on 5 October. The same day as the battle, Ute men under Quinkent (Douglass) killed Meeker and ten agency employees and took five women and children captive, among them Meeker’s wife Arvilla and daughter Josephine; they were freed on 21 October through talks in which the Uncompahgre Ute leader Ouray, his wife Chipeta and his sister Shawsheen took part. Under an agreement of 1880 the White River Ute were removed to the Uintah Reservation in Utah in 1881 and the Uncompahgre Ute, who had not fought, to a reservation beside it; only the Southern Ute kept a strip of land in south-western Colorado, and millions of acres were opened to settlement.
: Une courte guerre qui opposa en 1879, dans l’ouest du Colorado, les Utes de White River aux États-Unis, et qui s’acheva par le déplacement de la plupart des Utes hors du Colorado. Le traité de 1868 avait accordé aux Utes la plus grande partie de l’ouest du Colorado pour leur « usage et occupation absolus et sans trouble », mais des mineurs s’installèrent sur leurs terres dans les années 1870, et le gouverneur du Colorado, Frederick Pitkin, fit campagne sur le slogan « Les Utes doivent partir ! ». Nathan Meeker, agent de l’agence de White River à partir de 1878, tenta d’obliger les Utes de White River à se fixer comme agriculteurs et à devenir chrétiens et, en septembre 1879, il fit labourer un pâturage et une piste de course où ils gardaient leurs chevaux. Après une altercation avec le chef ute Canalla (Johnson), Meeker demanda des troupes, et le major Thomas Thornburgh partit de Fort Fred Steele, dans le Wyoming, avec environ 150 soldats. Les Utes avaient prévenu que l’entrée de troupes dans la réserve signifierait la guerre. Le 29 septembre 1879, des combattants utes menés par Nicaagat (Captain Jack) et Colorow affrontèrent la colonne de Thornburgh à Milk Creek, à environ 29 km au nord de l’actuelle Meeker, le tuèrent ainsi que 13 de ses hommes et assiégèrent les autres pendant près d’une semaine, jusqu’à ce qu’une compagnie du 9e de cavalerie, des Buffalo Soldiers commandés par le capitaine Francis Dodge, les rejoigne le 2 octobre, suivie le 5 octobre de la colonne de secours du colonel Wesley Merritt. Le jour même de la bataille, des Utes menés par Quinkent (Douglass) tuèrent Meeker et dix employés de l’agence et emmenèrent captifs cinq femmes et enfants, dont la femme de Meeker, Arvilla, et sa fille Josephine ; ils furent libérés le 21 octobre grâce à des pourparlers auxquels prirent part le chef des Utes Uncompahgres, Ouray, sa femme Chipeta et sa sœur Shawsheen. En vertu d’un accord de 1880, les Utes de White River furent déplacés en 1881 vers la réserve d’Uintah, dans l’Utah, et les Utes Uncompahgres, qui n’avaient pas combattu, vers une réserve voisine ; seuls les Utes du Sud conservèrent une bande de terre dans le sud-ouest du Colorado, et des millions d’acres furent ouverts à la colonisation.
