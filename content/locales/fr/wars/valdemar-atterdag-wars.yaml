"1362–1370": "1362–1370"
"Valdemar’s conquest of Visby and his heavy dues on the Sound and the Scanian herring markets threatened the trade of the Hanseatic towns. In April 1362 a Hanseatic fleet under Johann Wittenborg of Lübeck laid siege to Helsingborg, but Valdemar fell on the ships and captured a dozen of them; Wittenborg was later executed by his own city. In 1367 the towns, from the Baltic to the Netherlands, formed the Confederation of Cologne and allied with King Albert of Sweden, the dukes of Mecklenburg and the counts of Holstein.": "En avril 1362, une flotte hanséatique sous Johann Wittenborg de Lübeck assiégea Helsingborg, mais Valdemar tomba sur les navires et en prit une douzaine ; Wittenborg fut plus tard exécuté par sa propre ville. En 1367, les villes, de la Baltique aux Pays-Bas, formèrent la Confédération de Cologne et s’allièrent avec le roi Albert de Suède, les ducs de Mecklembourg et les comtes de Holstein."
"In 1368 their fleets sacked Copenhagen and raided the coasts of Denmark and Norway, whose king, Valdemar’s son-in-law Haakon VI, soon made a truce. Swedish and German troops overran most of Scania while the Holsteiners marched into Jutland. Valdemar left the country to seek allies, and when Helsingborg fell in 1369 his council sued for peace. By the Peace of Stralsund on 24 May 1370 the towns kept their privileges and held the Scanian castles of Skanör, Falsterbo, Malmö and Helsingborg, with two-thirds of their revenues, for fifteen years.": "En 1368, leurs flottes saccagent Copenhague et pillent les côtes du Danemark et de la Norvège, dont le roi, le gendre de Valdemar, Haakon VI, fait bientôt une trêve. Les troupes suédoises et allemandes envahissent la plus grande partie de Scania pendant que les Holsteiners marchent dans le Jutland. Par la Paix de Stralsund le 24 mai 1370, les villes ont gardé leurs privilèges et tenu les châteaux Scaniens de Skanör, Falsterbo, Malmö et Helsingborg, avec les deux tiers de leurs revenus, pendant quinze ans."
