"1332–1361": "1332–1361"
"While Denmark lay broken and pawned to German lords, Magnus Eriksson bought Scania and Blekinge in 1332 from Duke John of Holstein, after the local people said they would rather be ruled by the Swedes. He also gained Halland, and for almost thirty years the Swedish king held the whole southern coast.": "Tandis que le Danemark était brisé et mis en gage aux seigneurs allemands, Magnus Eriksson a acheté Scania et Blekinge en 1332 du duc John de Holstein, après que les gens locaux ont dit qu’ils préféreraient être gouvernés par les Suédois. Il a également gagné Halland, et pendant presque trente ans le roi suédois tenait toute la côte sud."
"Valdemar IV Atterdag rebuilt Denmark. In 1360, after the death of Magnus’s rebellious son Erik, he crossed the Sound, forced Magnus to give up Helsingborg and took back Scania, Blekinge and Halland. The next summer he landed on Gotland. On 27 July 1361 his professional soldiers slaughtered the island’s peasant army outside the walls of Visby, which then accepted him as ruler.": "Valdemar IV Atterdag reconstruit le Danemark. En 1360, après la mort du fils rebelle de Magnus Erik, il traversa le détroit, força Magnus à abandonner Helsingborg et prit Scania, Blekinge et Halland. L’été suivant, il débarqua sur Gotland. Le 27 juillet 1361, ses soldats professionnels massacrérent l’armée paysanne de l’île hors des murs de Visby, qui l’accepta alors comme chef."
