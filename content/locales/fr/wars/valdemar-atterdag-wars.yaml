"Valdemar Atterdag’s wars with Sweden": "Les guerres de Valdemar Atterdag avec la Suède"
"Valdemar IV Atterdag of Denmark took Scania, Blekinge and Halland back from Sweden in 1360 and conquered Gotland and Visby in 1361. The Hanseatic towns, allied with Sweden, then fought him until the Peace of Stralsund in 1370, which confirmed their hold on Baltic trade.": "Valdemar IV Atterdag du Danemark a repris Scania, Blekinge et Halland de Suède en 1360 et conquis Gotland et Visby en 1361. Les villes hanséatiques, alliées à la Suède, l’ont ensuite combattu jusqu’à la paix de Stralsund en 1370, ce qui a confirmé leur prise sur le commerce baltique."
