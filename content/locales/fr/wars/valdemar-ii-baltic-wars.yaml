"Wars of Valdemar II": "Guerres de Valdemar II"
"The wars by which Valdemar II of Denmark built a Baltic empire stretching from Holstein and Lübeck to northern Estonia, and then lost most of it. After his kidnapping by a German count in 1223, his north German lands broke away, and his defeat at Bornhöved in 1227 pushed Denmark’s border back to the Eider.": "Les guerres par lesquelles Valdemar II du Danemark a construit un empire baltique s’étendant de Holstein et Lübeck au nord de l’Estonie, puis a perdu la plupart de lui. Après son enlèvement par un comte allemand en 1223, ses terres nord-allemandes ont rompu, et sa défaite à Bornhöved en 1227 a repoussé le Danemark à la frontière Eider."
"Valdemar is remembered in Denmark as Valdemar Sejr, “the Victorious”. The main sources are German chronicles, Henry of Livonia’s chronicle for Estonia, and later Danish annals; numbers in them are unreliable.": "Valdemar est connu au Danemark sous le nom de Valdemar Sejr, la Victoire. Les principales sources sont les chroniques allemandes, Henry de Livonia, chronique pour l’Estonie, et plus tard les annales danoises ; nombres en eux sont peu fiables."
"The legend that the Danish flag, the Dannebrog, fell from the sky at Lyndanisse is first recorded about three centuries after the battle.": "La légende selon laquelle le drapeau danois, le Dannebrog, est tombé du ciel à Lyndanisse a été enregistrée pour la première fois environ trois siècles après la bataille."
