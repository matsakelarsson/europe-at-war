"In May 1223 Count Henry of Schwerin, one of Valdemar’s German vassals, kidnapped the king and his eldest son while they were hunting on the island of Lyø and carried them off to his castles in Germany. The north German princes and cities rose against Danish rule, and a Danish army under Albert of Orlamünde was beaten at Mölln in 1225. To be freed, Valdemar had to give up his German conquests, pay 44,000 marks of silver and swear not to take revenge.": "En mai 1223, le comte Henry de Schwerin, l’un des vassaux allemands de Valdemar, kidnappait le roi et son fils aîné pendant qu’ils chassaient sur l’île de Lyø et les transportaient vers ses châteaux en Allemagne. Les princes et les villes du nord de l’Allemagne se sont levés contre la domination danoise, et une armée danoise sous Albert d’Orlamünde a été battue à Mölln en 1225. Pour être libéré, Valdemar a dû renoncer à ses conquêtes allemandes, payer 44 000 points d’argent et jurer de ne pas se venger."
"The pope released him from his oath, and Valdemar tried to win his lands back. On 22 July 1227 he met Count Adolf IV of Holstein and his allies, among them Lübeck, Hamburg, the Duke of Saxony and Henry of Schwerin, at Bornhöved. The peasant army of Dithmarschen, fighting for the king, changed sides in mid-battle and the Danes were routed; Valdemar lost an eye. Denmark’s southern border went back to the Eider, and only Rügen was kept. In the same year the Sword Brothers took Danish Estonia, which was returned to Denmark in 1238.": "Le 22 juillet 1227, il rencontra le comte Adolf IV de Holstein et ses alliés, parmi lesquels Lübeck, Hambourg, le duc de Saxe et Henri de Schwerin, à Bornhöved. L’armée paysanne de Dithmarschen, combattant pour le roi, changea de camp au milieu de la bataille et les Danois furent chassés ; Valdemar perdit un oeil. Danemark La frontière sud retourna à l’Eider, et seul Rügen fut gardé. La même année, les frères Sword prirent l’Estonie danoise, qui fut retournée au Danemark en 1238."
