"In 1201 Duke Valdemar of Schleswig, younger brother of King Canute VI, defeated Count Adolf III of Holstein at Stellau and captured him at Hamburg. Holstein and Lübeck submitted to Danish rule, and the count only bought his freedom in 1203 by giving up his claims. Valdemar became king on his brother’s death in November 1202 and set his nephew Albert of Orlamünde over Holstein.": "En 1201, le duc Valdemar de Schleswig, frère cadet du roi Canute VI, battit le comte Adolf III de Holstein à Stellau et l’empêcha à Hambourg. Holstein et Lübeck se soumettèrent au régime danois, et le comte n’acheta sa liberté qu’en 1203 en abandonnant ses prétentions."
"Taking advantage of the struggle for the German crown, Valdemar extended Danish power along the coast as far as Pomerania, and fought for control of the lower Elbe and Hamburg. In 1214 the young emperor Frederick II, in need of allies, formally granted Denmark all the lands north of the Elbe and the Elde. Denmark was then the leading power of the Baltic.": "Profitant de la lutte pour la couronne allemande, Valdemar étendit le pouvoir danois le long de la côte jusqu’à Poméranie et combattit pour le contrôle de l’Elbe inférieure et de Hambourg. En 1214, le jeune empereur Frederick II, dans le besoin d’alliés, accorda officiellement au Danemark toutes les terres au nord de l’Elbe et de l’Elde."
