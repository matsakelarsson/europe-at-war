"Lyndanisse and Estonia": "Lyndanisse et Estonie"
"German crusaders and the Livonian Brothers of the Sword had been fighting the pagan Estonians for more than a decade when the bishop of Riga asked Valdemar for help. With the pope’s blessing, Valdemar sailed to northern Estonia in June 1219 with a large fleet, Archbishop Anders Sunesen of Lund, Prince Vitslav of Rügen and Count Albert. They camped at Lyndanisse, a hill-fort by the sea, and began to build a castle.": "Les croisés allemands et les frères livoniens de l’Épée combattaient les Estoniens païens depuis plus d’une décennie quand l’évêque de Riga demandait de l’aide à Valdemar. Avec la bénédiction du pape, Valdemar naviguait au nord de l’Estonie en juin 1219 avec une grande flotte, Mgr Anders Sunesen de Lund, le prince Vitslav de Rügen et le comte Albert. Ils campaient à Lyndanisse, une colline-fort près de la mer, et ont commencé à construire un château."
"On 15 June the Estonians attacked the camp from several sides and took the crusaders by surprise. Bishop Theoderich, mistaken for the king, was killed. A counterattack by Vitslav’s men turned the battle, and many Estonians were killed. The Danes built their castle on the hill of Toompea; the town that grew up around it is today’s Tallinn. Over the next years northern Estonia was conquered and baptised, in rivalry with the Sword Brothers advancing from the south.": "Le 15 juin, les Estoniens attaquèrent le camp de plusieurs côtés et prirent les croisés par surprise. Mgr Théoderich, confondu avec le roi, fut tué. Une contre-attaque des hommes de Vitslav entraîna la bataille, et beaucoup d’Estoniens furent tués. Les Danois construisirent leur château sur la colline de Toompea ; la ville qui grandit autour de lui est aujourd'hui Tallinn. Au cours des années suivantes, l’Estonie du Nord a été conquise et baptisée, en rivalité avec les Frères de l’épée qui avançaient du Sud."
