# Some French text was translated automatically.
"Valtellina War": "Guerre de la Valteline"
"A long struggle for the Valtellina, the Alpine valley between Milan and the Tyrol that was ruled by the Protestant-led Three Leagues of the Grisons and offered Spain its best road from Italy to Austria. On 19 July 1620 Catholic Valtellinese rose and killed several hundred Protestants, and Spanish troops from Milan occupied the valley while the Austrians invaded the Grisons. Papal troops took over the Valtellina forts in 1623, and in November 1624 a French army drove them out. The Treaty of Monzón of 1626 left the valley to the Grisons, self-governing and Catholic. In 1635 the Duke of Rohan led French and Grisons troops into the valley and beat Spanish and imperial armies, but France would not hand it back, and in 1637 the Grisons, led by Jürg Jenatsch, turned on the French and forced Rohan to leave. By the Treaty of Milan of 3 September 1639 Spain restored the valley to the Grisons, on condition that only Catholic worship was allowed, and gained free passage for its troops.": "Une longue lutte pour la Valtellina, la vallée alpine entre Milan et le Tyrol qui était dirigée par les trois ligues des Grisons sous direction protestante et offrait à l’Espagne sa meilleure route d’Italie vers l’Autriche. Le 19 juillet 1620, le catholique Valtellinese se lève et tue plusieurs centaines de protestants, et les troupes espagnoles de Milan occupent la vallée tandis que les Autrichiens envahissent les Grisons. En 1623, les troupes papales s’emparèrent des forts de Valtellina et, en novembre 1624, une armée française les chassa. Le traité de Monzón de 1626 laissa la vallée aux Grisons, autonomes et catholiques. En 1635, le duc de Rohan conduisit les troupes françaises et des Grisons dans la vallée et battit les armées espagnoles et impériales, mais la France ne voulut pas la remettre, et en 1637, les Grisons, dirigés par Jürg Jenatsch, se tournèrent vers les Français et força Rohan à partir. Par le traité de Milan du 3 septembre 1639, l’Espagne restaure la vallée aux Grisons, à condition que seul le culte catholique soit autorisé et qu’il obtienne le libre passage pour ses troupes."
"Dates are Gregorian. The war was a side theatre of the Thirty Years’ War; Wikipedia’s article covers only the years 1620–1626.": "Les dates sont grégorien. La guerre était un théâtre parallèle de la Guerre des Trente Ans ; Wikipédia's article couvre seulement les années 1620–1626."
"The killings of 1620 are known in Italian as the Sacro Macello, the ‘holy butchery’. Accounts give between about 400 and 600 dead.": "Les meurtres de 1620 sont connus en italien sous le nom de Sacro Macello, la boucherie sainte."
"The sides changed over time. In 1637–1639 the Grisons came to terms with Spain against France.": "Les parties ont changé au fil du temps. En 1637–1639, les Grisons se sont entendus avec l’Espagne contre la France."
