# French translations of the catalogue text (wave 8); step bodies follow later.
Vellore Mutiny: Mutinerie de Vellore
? A rising of Indian sepoys of the Madras army in the fortress of Vellore, where the family of Tipu Sultan had been held since 1799. In November 1805 new regulations forbade Hindu soldiers to wear caste marks on duty, told Muslims to trim their beards, and introduced a new round turban with a leather cockade, which many saw as an attack on their religion and a step towards forced conversion. Protests were punished with floggings and dismissals. In the early hours of 10 July 1806 men of the 1st and 23rd Madras Native Infantry rose, killed or wounded about 200 soldiers of the British 69th Foot and many of their own officers, and raised the flag of Mysore over the fort, in the name of one of Tipu’s sons. Colonel Robert Gillespie rode in from Arcot, about 25 km away, with the 19th Light Dragoons and galloper guns, blew open the gate and retook the fort within hours. About 350 sepoys were killed, some 100 were executed on the spot and more after courts martial. The regulations were withdrawn, Tipu’s family was moved to Calcutta, and the Governor of Madras, Lord William Bentinck, and the commander-in-chief, Sir John Cradock, were recalled. It is also called the Vellore Revolt or Vellore Rebellion, and is often remembered as a forerunner of the rising of 1857.
: Un soulèvement de cipayes indiens de l’armée de Madras dans la forteresse de Vellore, où la famille de Tipu Sultan était détenue depuis 1799. En novembre 1805, un nouveau règlement interdit aux soldats hindous de porter des marques de caste en service, ordonna aux musulmans de tailler leur barbe et introduisit un nouveau turban rond orné d’une cocarde de cuir, ce que beaucoup virent comme une atteinte à leur religion et un pas vers la conversion forcée. Les protestations furent punies de coups de fouet et de renvois. Aux premières heures du 10 juillet 1806, des hommes des 1er et 23e régiments d’infanterie indigène de Madras se soulevèrent, tuèrent ou blessèrent environ 200 soldats du 69e régiment d’infanterie britannique et nombre de leurs propres officiers, et hissèrent le drapeau du Mysore sur le fort, au nom de l’un des fils de Tipu. Le colonel Robert Gillespie accourut d’Arcot, à environ 25 km, avec le 19e régiment de dragons légers et des canons légers attelés, fit sauter la porte et reprit le fort en quelques heures. Environ 350 cipayes furent tués, quelque 100 furent exécutés sur-le-champ et d’autres encore après être passés en cour martiale. Le règlement fut retiré, la famille de Tipu fut transférée à Calcutta, et le gouverneur de Madras, Lord William Bentinck, ainsi que le commandant en chef, Sir John Cradock, furent rappelés. On l’appelle aussi révolte ou rébellion de Vellore, et on y voit souvent un signe avant-coureur du soulèvement de 1857.
