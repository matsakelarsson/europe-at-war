# French translations of the catalogue text (wave 11); step bodies follow later.
Vietnam War: Guerre du Vietnam
? The war for the south of Vietnam between the communist Democratic Republic of Vietnam (North Vietnam) and the National Liberation Front it directed in the South, on one side, and the Republic of Vietnam (South Vietnam) and the United States with its allies on the other. The Geneva Accords of 1954 divided Vietnam at the 17th parallel pending elections that were never held. From 1959 Hanoi backed an armed rising in the South, and the United States, which saw South Vietnam as a barrier against the spread of communism in Asia, sent first advisers and money, then, after the Gulf of Tonkin incident of August 1964, bombers and from March 1965 combat troops, more than half a million by 1968. The war of attrition that followed, fought in the villages, jungles and highlands of the South and in the air over the North, Laos and Cambodia, could not be won by either side. The Tết Offensive of 1968 failed militarily but turned American opinion against the war. Under Richard Nixon the United States handed the fighting to the South Vietnamese army, carried the war into Cambodia and Laos and withdrew after the Paris Peace Accords of January 1973. Two years later the North Vietnamese army overran the South, and Saigon fell on 30 April 1975. Estimates of the Vietnamese dead range from about 1 million to more than 3 million; some 58,000 Americans died.
: La guerre pour le sud du Vietnam qui opposa, d’un côté, la République démocratique du Vietnam communiste (Nord-Vietnam) et le Front national de libération qu’elle dirigeait dans le Sud, de l’autre, la République du Vietnam (Sud-Vietnam) et les États-Unis avec leurs alliés. Les accords de Genève de 1954 divisèrent le Vietnam au niveau du 17e parallèle dans l’attente d’élections qui n’eurent jamais lieu. À partir de 1959, Hanoï soutint un soulèvement armé dans le Sud, et les États-Unis, qui voyaient dans le Sud-Vietnam un rempart contre l’expansion du communisme en Asie, envoyèrent d’abord des conseillers et de l’argent, puis, après l’incident du golfe du Tonkin d’août 1964, des bombardiers et, à partir de mars 1965, des troupes de combat, plus d’un demi-million d’hommes en 1968. La guerre d’usure qui suivit, menée dans les villages, les jungles et les hauts plateaux du Sud et dans le ciel du Nord, du Laos et du Cambodge, ne pouvait être gagnée par aucun des deux camps. L’offensive du Tết de 1968 fut un échec militaire, mais retourna l’opinion américaine contre la guerre. Sous Richard Nixon, les États-Unis confièrent les combats à l’armée sud-vietnamienne, étendirent la guerre au Cambodge et au Laos et se retirèrent après les accords de paix de Paris de janvier 1973. Deux ans plus tard, l’armée nord-vietnamienne s’empara du Sud, et Saïgon tomba le 30 avril 1975. Les estimations des morts vietnamiens vont d’environ 1 million à plus de 3 millions ; quelque 58 000 Américains moururent.
