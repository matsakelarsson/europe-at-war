# French translations of the catalogue text (wave 11); step bodies follow later.
Nguyễn interventions in Cambodia: Interventions des Nguyễn au Cambodge
? A century of wars in which the Nguyễn lords of Đàng Trong, the southern Vietnamese state, intervened in the quarrels of the Cambodian royal family, usually backing one branch while Ayutthaya backed another, and in the process took over the Mekong delta. Vietnamese settlers had been allowed to settle at Prey Nokor (Saigon) since about 1623, after a Nguyễn princess married King Chey Chettha II. In 1658, when Buddhist princes rose against King Ramathipadi I (Ponhea Chan), a convert to Islam, a Nguyễn army invaded at their call, captured the king and took him to Quảng Bình, where he died in 1659. After a further invasion in 1674 the Nguyễn recognised Ang Sor (Chey Chettha IV) as king at Longvek and Ang Nan as second king at Prey Nokor, both paying them tribute. In 1679 they settled some 3,000 Ming loyalist soldiers, under Dương Ngạn Địch and Trần Thượng Xuyên, at Mỹ Tho and Biên Hòa, and they fought again in Cambodia in 1688–1691. In 1698 Nguyễn Hữu Cảnh organised the region of Saigon as the prefecture of Gia Định, and in 1700 his army defeated Chey Chettha IV and entered Phnom Penh. Rivalry between Siamese-backed kings and the Nguyễn-backed prince Ang Em brought new wars in 1705 and 1714–1717, when Vietnamese armies besieged Longvek and Siam sent armies and a fleet; the settlement left Ang Em king, under Siamese overlordship. Hà Tiên, a port ruled by the Chinese merchant Mạc Cửu, became a Nguyễn vassal in 1708 and was sacked by a Siamese-backed Cambodian army in 1715. Cambodian attempts from 1739 to recover the delta failed; the Nguyễn gained Vĩnh Long in 1732 and, after new wars in the 1750s led by Nguyễn Cư Trinh, the rest of the delta by 1757.
: Un siècle de guerres au cours desquelles les seigneurs Nguyễn de Đàng Trong, l’État vietnamien du sud, intervinrent dans les querelles de la famille royale cambodgienne, soutenant d’ordinaire une branche tandis qu’Ayutthaya en soutenait une autre, et s’emparèrent au passage du delta du Mékong. Des colons vietnamiens étaient autorisés à s’installer à Prey Nokor (Saïgon) depuis 1623 environ, après le mariage d’une princesse Nguyễn avec le roi Chey Chettha II. En 1658, lorsque des princes bouddhistes se soulevèrent contre le roi Ramathipadi Ier (Ponhea Chan), converti à l’islam, une armée Nguyễn envahit le pays à leur appel, captura le roi et l’emmena au Quảng Bình, où il mourut en 1659. Après une nouvelle invasion en 1674, les Nguyễn reconnurent Ang Sor (Chey Chettha IV) comme roi à Longvek et Ang Nan comme second roi à Prey Nokor, tous deux leurs tributaires. En 1679, ils installèrent quelque 3 000 soldats restés fidèles aux Ming, sous Dương Ngạn Địch et Trần Thượng Xuyên, à Mỹ Tho et à Biên Hòa, et ils combattirent de nouveau au Cambodge en 1688–1691. En 1698, Nguyễn Hữu Cảnh organisa la région de Saïgon en préfecture de Gia Định et, en 1700, son armée battit Chey Chettha IV et entra dans Phnom Penh. La rivalité entre des rois soutenus par le Siam et le prince Ang Em, soutenu par les Nguyễn, entraîna de nouvelles guerres en 1705 et en 1714–1717, lorsque des armées vietnamiennes assiégèrent Longvek et que le Siam envoya des armées et une flotte ; le règlement laissa Ang Em sur le trône, sous suzeraineté siamoise. Hà Tiên, un port gouverné par le marchand chinois Mạc Cửu, devint vassal des Nguyễn en 1708 et fut mis à sac en 1715 par une armée cambodgienne soutenue par le Siam. Les tentatives cambodgiennes pour reprendre le delta à partir de 1739 échouèrent ; les Nguyễn obtinrent Vĩnh Long en 1732 et, après de nouvelles guerres menées dans les années 1750 par Nguyễn Cư Trinh, tenaient en 1757 le reste du delta.
