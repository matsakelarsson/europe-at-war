# French translations of the catalogue text (wave 8); step bodies follow later.
Vijayabahu’s war against the Cholas: Guerre de Vijayabahu contre les Chola
The war in which the Sinhalese prince Kitti, crowned as Vijayabahu I, drove the Chola Empire out of Sri Lanka. From 1055 he led the resistance in Ruhuna, the south-eastern province the Cholas had never firmly held, and by 1058 he controlled it. A first attack on the Chola capital of Polonnaruwa in 1066 was beaten back by reinforcements from India, but when the Chola kingdom was shaken by a disputed succession in 1069–1070, his armies took Anuradhapura and, after a siege of about seven months, Polonnaruwa. The Cholas withdrew in 1070, ending more than seventy years of occupation in the north, and the island was united under one king again for the first time in over a century.: La guerre au cours de laquelle le prince cingalais Kitti, couronné sous le nom de Vijayabahu Ier, chassa l’Empire chola du Sri Lanka. À partir de 1055, il dirigea la résistance dans le Ruhuna, la province du sud-est que les Chola n’avaient jamais fermement tenue, et en 1058 il la contrôlait. Une première attaque contre Polonnaruwa, la capitale chola, fut repoussée en 1066 par des renforts venus d’Inde, mais lorsque le royaume chola fut ébranlé par une succession disputée en 1069–1070, ses armées prirent Anuradhapura puis, après un siège d’environ sept mois, Polonnaruwa. Les Chola se retirèrent en 1070, mettant fin à plus de soixante-dix ans d’occupation dans le nord, et l’île fut de nouveau réunie sous un seul roi pour la première fois depuis plus d’un siècle.
