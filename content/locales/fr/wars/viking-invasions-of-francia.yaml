"911": "911"
"Viking invasions of Francia": "Invasions vikings en Francie"
"A century of Scandinavian raids on the Frankish lands, from the first attacks on the coast around 800 to the great fleets that sacked Rouen, Nantes and Paris and the long siege of Paris in 885–886. It ended in 911, when King Charles the Simple granted the lower Seine to the Viking leader Rollo, whose county became the Duchy of Normandy.": "Pendant un siècle, des Scandinaves lancent des raids sur les terres franques. Les premières attaques touchent les côtes vers 800. De grandes flottes pillent ensuite Rouen, Nantes et Paris, qui subit un long siège en 885–886. En 911, le roi Charles le Simple cède la basse Seine au chef viking Rollon. Son comté devient le duché de Normandie."
"The main sources are Frankish annals, chiefly the Annals of St-Bertin and of St-Vaast, and the monk Abbo’s poem on the siege of Paris. They give large and often exaggerated numbers of ships and men, and they rarely say where the raiders came from; most seem to have been Danes, with Norwegians among them.": "Les principales sources sont les annales de Frankish, principalement les Annales de St-Bertin et de Saint-Vaast, et le poème du moine Abbo. Ils donnent un grand nombre souvent exagéré de navires et d’hommes, et ils disent rarement d’où viennent les raideurs ; la plupart semblent avoir été Danois, avec des Norvégiens parmi eux."
"The story of Rollo and the grant of 911 comes mostly from Dudo of Saint-Quentin, who wrote about a century later for Rollo’s descendants. No text of the agreement survives, and its date and place are traditional; a royal charter of 918 confirms that Charles had granted land on the lower Seine to the Northmen.": "L’histoire de Rollo et la concession de 911 vient principalement de Dudo de Saint-Quentin, qui a écrit environ un siècle plus tard pour les descendants de Rollo. Aucun texte de l’accord survit, et sa date et lieu sont traditionnels ; une charte royale de 918 confirme que Charles avait accordé des terres sur la Seine inférieure aux Nordistes."
