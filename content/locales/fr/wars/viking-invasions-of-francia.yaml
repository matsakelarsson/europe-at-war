"In 879 a large Viking army that had gathered on the Thames, finding no opening in Wessex after Alfred’s victory at Edington, crossed from England to the Low Countries. From camps at Ghent and elsewhere it ravaged the lands between the Scheldt and the Seine for years. King Louis III beat part of it at Saucourt-en-Vimeu on 3 August 881, a victory celebrated in the Old High German Ludwigslied, but the raids went on. In November 885 a fleet the monk Abbo puts at 700 ships came up the Seine under Sigfred and Sinric and found the way blocked by the fortified bridges of Paris, then confined to the Île de la Cité.": "En 879, une grande armée viking qui s’était réunie sur la Tamise, ne trouvant aucune ouverture dans le Wessex après la victoire d’Alfred à Edington, traversa l’Angleterre aux Pays-Bas. De camps à Gand et ailleurs, elle ravagea les terres entre l’Escaut et la Seine pendant des années. Le roi Louis III en battit une partie à Saucourt-en-Vimeu le 3 août 881, victoire célébrée dans l’ancien haut-allemand Ludwigslied, mais les raids continuèrent. En novembre 885, une flotte que le moine Abbo met à 700 bateaux monta sur la Seine sous Siggred et Sinric et trouva la voie bloquée par les ponts fortifiés de Paris, puis confinée à l’île de la Cité."
"Count Odo of Paris and Bishop Gozlin held the city through a siege of almost a year, against towers, rams, fire and mining. In February 886 a flood swept away one bridge, and the twelve defenders of its tower were killed. Sigfred took 60 pounds of silver and left in the spring, but others stayed. The emperor Charles the Fat arrived only in October, camped at Montmartre and, instead of fighting, paid 700 pounds and let the Vikings sail on to plunder Burgundy, which was in revolt. Odo’s defence made his name; when Charles was deposed in 887, the West Franks chose Odo as their king.": "Le comte Odo de Paris et Mgr Gozlin ont tenu la ville par un siège de près d’un an, contre des tours, des béliers, des incendies et des mines. En février 886 une inondation a balayé un pont, et les douze défenseurs de sa tour ont été tués. Siggred a pris 60 livres d’argent et est parti au printemps, mais d’autres sont restés. L’empereur Charles le Fat n’arriva qu’en octobre, campait à Montmartre et, au lieu de se battre, payait 700 livres et laissait les Vikings s’embarquer pour piller la Bourgogne, qui était en révolte. La défense d’Odo a fait son nom ; lorsque Charles fut déposé en 887, les Francs occidentaux ont choisi Odo comme leur roi."
