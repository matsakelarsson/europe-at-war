"Scandinavian raiders first struck the coast of the Frankish empire around 799, and Charlemagne ordered fleets and coastguards along the Channel and the North Sea. In 810 the Danish king Godfred sent some 200 ships against Frisia, which paid tribute. After Louis the Pious lost control of his sons in the 830s the attacks grew. Dorestad, the great trading town on the Rhine, was raided in 834 and in several years after. In 841 a fleet sailed up the Seine and burned Rouen and the abbey of Jumièges, and in 843 raiders took Nantes on the feast of St John and killed its bishop in the cathedral.": "Les raideurs scandinaves ont d’abord frappé la côte de l’empire franquiste vers 799, et Charlemagne a commandé des flottes et des garde-côtes le long de la Manche et de la mer du Nord. En 810, le roi danois Godfred a envoyé quelque 200 navires contre la Frisia, qui a rendu hommage. Dorestad, la grande ville commerçante du Rhin, fut perquisitionnée en 834 et plusieurs années plus tard. En 841 une flotte navigua sur la Seine et brûla Rouen et l’abbaye de Jumièges, et en 843 les raideurs emmenèrent Nantes à la fête de Saint-Jean et tuèrent son évêque dans la cathédrale."
"The fleets then began to winter in Francia, on islands such as Noirmoutier at the mouth of the Loire and Oissel in the Seine. In March 845 about 120 ships under a leader the annals call Reginherus reached Paris at Easter and plundered it, and Charles the Bald paid 7,000 pounds of silver and gold to make them leave, the first of many such payments. In 864 he ordered fortified bridges across the rivers, and one was built at Pont-de-l’Arche on the Seine. On 2 July 866 Vikings under the chieftain Hastein and their Breton allies killed Robert the Strong, the Frankish commander in the west, at Brissarthe.": "Les flottilles commencent alors à hiverner en Francia, sur des îles comme Noirmoutier à l’embouchure de la Loire et Oissel dans la Seine. En mars 845, environ 120 navires sous le commandement d’un chef, les annales de Reginherus arrivent à Paris à Pâques et le pillent, et Charles le Bald paie 7 000 livres d’argent et d’or pour les faire partir, le premier de beaucoup de ces paiements. En 864, il commanda des ponts fortifiés à travers les rivières, et l’un d’eux fut construit à Pont-de-l=Arche sur la Seine. Le 2 juillet 866, des Vikings sous le chef Hastein et leurs alliés bretons tuèrent Robert les Forts, commandant franc dans l’ouest, à Brissarthe."
