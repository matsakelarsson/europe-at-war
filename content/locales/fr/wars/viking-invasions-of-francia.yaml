"Viking settlers had been living along the lower Seine for years when a band led by Rollo besieged Chartres in 911. On 20 July a Frankish army under Robert, marquis of Neustria and brother of the late King Odo, with Duke Richard of Burgundy and Count Ebles of Poitiers, came to the city’s relief. Bishop Gantelme led a sortie from the walls, by later tradition displaying the Virgin’s tunic, the cathedral’s relic, and the Vikings were beaten.": "Des colons vikings vivaient le long de la Seine basse depuis des années quand une bande dirigée par Rollo assiégeait Chartres en 911. Le 20 juillet, une armée francaise sous Robert, marquis de Neustria et frère du défunt roi Odo, avec le duc Richard de Bourgogne et le comte Ebles de Poitiers, vint à l’aide de la ville. Mgr Gantelme a conduit une sortie des murs, par la tradition plus tard montrant la tunique de la Vierge, la relique de la cathédrale et les Vikings ont été battus."
"King Charles the Simple chose to make the Vikings defenders of the realm rather than fight them every year. According to Dudo, he met Rollo at Saint-Clair-sur-Epte and granted him the land from the Epte to the sea around Rouen; Rollo became the king’s man, agreed to defend the Seine against other raiders and was baptised, taking the name Robert. Further grants in 924 and 933 added the land around Bayeux and the Cotentin. Rollo’s descendants ruled as counts and then dukes of Normandy, and within a few generations the Normans spoke French.": "Le roi Charles le Simple choisit de faire des Vikings les défenseurs du royaume plutôt que de les combattre chaque année. Selon Dudo, il rencontre Rollo à Saint-Clair-sur-Epte et lui accorde la terre de l’Epte à la mer autour de Rouen ; Rollo devient l’homme du roi, accepte de défendre la Seine contre d’autres raideurs et est baptisé, prenant le nom de Robert. D’autres concessions en 924 et 933 ajoutèrent la terre autour de Bayeux et du Cotentin. Rollo ès descendants régnaient comme comtes puis ducs de Normandie, et en quelques générations les Normands parlaient français."
