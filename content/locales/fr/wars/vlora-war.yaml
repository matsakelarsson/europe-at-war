# Some French text was translated automatically.
"Vlora War": "Guerre de Vlora"
"A conflict in the summer of 1920 in which Albanian nationalists besieged the Italian garrison of Vlorë, held since 1914, whose troops were weakened by malaria and could not be reinforced after soldiers in Ancona mutinied rather than sail for Albania. By the Treaty of Tirana of 2 August 1920 Italy agreed to leave Vlorë, keeping only the island of Sazan (Saseno), and gave up its hopes of a mandate over Albania; the war is remembered in Albania as a turning point in securing its independence.": "Un conflit au cours de l’été 1920 dans lequel les nationalistes albanais assiégèrent la garnison italienne de Vlorë, tenue depuis 1914, dont les troupes étaient affaiblies par le paludisme et ne pouvaient être renforcées après que des soldats d’Ancone eurent mutiné plutôt que de partir pour l’Albanie. Par le traité de Tirana du 2 août 1920, l’Italie a accepté de quitter Vlorë, ne conservant que l’île de Sazan (Saseno), et a renoncé à ses espoirs d’un mandat sur l’Albanie ; la guerre est rappelée en Albanie comme un tournant dans l’obtention de son indépendance."
"The last Italian troops left Vlorë in early September 1920.": "Les dernières troupes italiennes quittèrent Vlorë au début de septembre 1920."
