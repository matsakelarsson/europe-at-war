# French translations of the catalogue text (wave 12); step bodies follow later.
Volta-Bani War: Guerre du Bani-Volta
? A war against French colonial rule in the lands between the Bani and the Black Volta rivers, in what are now western Burkina Faso and south-eastern Mali, in 1915–1917, during the First World War. It began when representatives of about a dozen villages met at Bona in November 1915 and resolved to take up arms; the heavy forced recruitment of soldiers for the war in Europe was the main grievance, and many believed the colonial government could be beaten while France was weak. The movement spread to around a thousand villages with up to 900,000 people, among them Marka, Bwa, Samo, Minianka, Bobo, Nuna and others, without any single leader or state. Armed mostly with bows and flintlocks, the coalition threw back the first two French columns. In 1916 France brought in about 5,000 troops, mostly West African tirailleurs and auxiliaries, with artillery and machine guns, and waged a campaign of systematic destruction until the last strongholds fell in September 1916; scattered resistance went on into 1917. At least 30,000 Africans were killed, many of them civilians, against about 300 on the French side, and more than a hundred villages were razed; there was also fighting between the coalition and villages that sided with the French or tried to stay out. It was one of the largest armed challenges to colonial rule anywhere in Africa, and led France to create the colony of Upper Volta, today Burkina Faso, in 1919.
: Une guerre contre la domination coloniale française dans les pays situés entre le Bani et la Volta Noire, dans l’actuel ouest du Burkina Faso et le sud-est du Mali, en 1915–1917, pendant la Première Guerre mondiale. Elle commença lorsque des représentants d’une douzaine de villages se réunirent à Bona en novembre 1915 et décidèrent de prendre les armes ; le lourd recrutement forcé de soldats pour la guerre en Europe était le principal grief, et beaucoup pensaient que l’administration coloniale pouvait être vaincue tant que la France était affaiblie. Le mouvement s’étendit à un millier de villages comptant jusqu’à 900 000 habitants, parmi lesquels des Marka, des Bwa, des Samo, des Minianka, des Bobo, des Nuna et d’autres, sans chef unique ni État. Armée surtout d’arcs et de fusils à silex, la coalition repoussa les deux premières colonnes françaises. En 1916, la France fit venir environ 5 000 hommes, pour la plupart des tirailleurs et des auxiliaires ouest-africains, avec de l’artillerie et des mitrailleuses, et mena une campagne de destruction systématique jusqu’à la chute des derniers bastions en septembre 1916 ; une résistance dispersée se poursuivit jusqu’en 1917. Au moins 30 000 Africains furent tués, dont beaucoup de civils, contre environ 300 du côté français, et plus d’une centaine de villages furent rasés ; il y eut aussi des combats entre la coalition et des villages qui avaient pris le parti des Français ou tentaient de rester à l’écart. Ce fut l’un des plus grands défis armés lancés à la domination coloniale dans toute l’Afrique, et il conduisit la France à créer en 1919 la colonie de Haute-Volta, l’actuel Burkina Faso.
