# French translations of the catalogue text (wave 13); step bodies follow later.
Voortrekker–Zulu war: Guerre entre Voortrekkers et Zoulous
? The war between the Zulu kingdom of Dingane and the Voortrekkers, the emigrant Boers of the Great Trek who crossed the Drakensberg into Natal in 1837. Their leader Piet Retief negotiated with Dingane for land south of the Thukela; on 6 February 1838 Dingane had Retief and about 100 of his party killed at his capital, uMgungundlovu, and his regiments then attacked the trekker camps along the Bushmans and Bloukrans rivers, killing over 500 men, women, children and servants. In April a Boer commando was beaten at Italeni and a force from Port Natal destroyed on the Thukela. In December 1838 a new commando under Andries Pretorius defeated the Zulu army at the Ncome River, the battle Afrikaners called Blood River, and burned out uMgungundlovu. The trekkers founded the Republic of Natalia, and in 1839 Dingane’s half-brother Mpande crossed into Natal with his followers and allied with them. In January 1840 Mpande’s army defeated Dingane at the Maqongqo hills; Dingane fled and was killed, and Pretorius proclaimed Mpande king of the Zulu, who ruled until 1872 as Natalia’s and then Britain’s neighbour.
: La guerre entre le royaume zoulou de Dingane et les Voortrekkers, les Boers émigrants du Grand Trek qui avaient franchi le Drakensberg pour entrer au Natal en 1837. Leur chef Piet Retief négocia avec Dingane l’obtention de terres au sud de la Thukela ; le 6 février 1838, Dingane fit tuer Retief et environ 100 membres de son groupe dans sa capitale, uMgungundlovu, puis ses régiments attaquèrent les campements de trekkers le long des rivières Bushmans et Bloukrans, tuant plus de 500 hommes, femmes, enfants et serviteurs. En avril, un commando boer fut battu à Italeni et une troupe venue de Port Natal fut anéantie sur la Thukela. En décembre 1838, un nouveau commando commandé par Andries Pretorius vainquit l’armée zouloue sur la rivière Ncome, bataille que les Afrikaners appelèrent Blood River, et incendia uMgungundlovu. Les trekkers fondèrent la république de Natalia et, en 1839, Mpande, demi-frère de Dingane, passa au Natal avec ses partisans et s’allia avec eux. En janvier 1840, l’armée de Mpande battit Dingane aux collines de Maqongqo ; Dingane s’enfuit et fut tué, et Pretorius proclama Mpande roi des Zoulous ; celui-ci régna jusqu’en 1872, voisin de Natalia, puis de la Grande-Bretagne.
