# French translations of the catalogue text (wave 12); step bodies follow later.
Voulet–Chanoine Mission: Mission Voulet-Chanoine
? The march of the French Central Africa mission (mission Afrique centrale) from the Niger towards Lake Chad in 1899, under Captains Paul Voulet and Julien Chanoine, the officers who had taken Ouagadougou in 1896. Sent with vague orders and little money to put the lands between the Niger and Lake Chad “under French protection” and to meet the columns of Foureau and Lamy from Algeria and Gentil from the Congo, the column of some 600 soldiers and about 2,000 porters and followers lived off the country, and from January 1899 burned villages and killed those who resisted or failed to supply it, across what is now western and southern Niger. Sarraounia Mangou, the ruler of the Azna of Lougou, fought it in April. At Birni-N’Konni in May the column destroyed a town of more than 10,000 people. When reports reached Paris, the government sent Lieutenant-Colonel Jean-François Klobb to take command; on 14 July Voulet had his men fire on Klobb and kill him at Dankori. Two and three days later the African soldiers of the column killed Chanoine and then Voulet. Under new officers the mission took Zinder, capital of the sultanate of Damagaram, on 30 July, and went on as the Joalland–Meynier mission to join the battle of Kousséri in April 1900. The killings were one of the great scandals of the European conquest of Africa; in 2025 descendants of the victims in Niger asked France for reparations.
: La marche de la mission française Afrique centrale du Niger vers le lac Tchad en 1899, sous les ordres des capitaines Paul Voulet et Julien Chanoine, les officiers qui avaient pris Ouagadougou en 1896. Envoyée avec des ordres vagues et peu d’argent pour placer les pays situés entre le Niger et le lac Tchad « sous la protection de la France » et rejoindre les colonnes de Foureau et Lamy, venue d’Algérie, et de Gentil, venue du Congo, la troupe, forte d’environ 600 soldats et de quelque 2 000 porteurs et suivants, vécut sur le pays et, à partir de janvier 1899, incendia des villages et tua ceux qui résistaient ou ne la ravitaillaient pas, dans ce qui est aujourd’hui l’ouest et le sud du Niger. Sarraounia Mangou, souveraine des Azna de Lougou, la combattit en avril. À Birni-N’Konni, en mai, la colonne détruisit une ville de plus de 10 000 habitants. Lorsque les rapports parvinrent à Paris, le gouvernement envoya le lieutenant-colonel Jean-François Klobb prendre le commandement ; le 14 juillet, à Dankori, Voulet fit ouvrir le feu par ses hommes sur Klobb, qui fut tué. Deux et trois jours plus tard, les soldats africains de la colonne tuèrent Chanoine, puis Voulet. Sous de nouveaux officiers, la mission prit Zinder, capitale du sultanat du Damagaram, le 30 juillet, et poursuivit sa route sous le nom de mission Joalland-Meynier pour prendre part à la bataille de Kousséri en avril 1900. Ces tueries furent l’un des grands scandales de la conquête européenne de l’Afrique ; en 2025, des descendants des victimes au Niger ont demandé des réparations à la France.
