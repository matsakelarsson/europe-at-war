"Wallachian campaign of 1462": "Campagne wallachienne de 1462"
"Mehmed II’s invasion of Wallachia to punish its prince, Vlad III, later known as Vlad the Impaler, who had stopped paying tribute, allied with Hungary and slaughtered thousands of people along the Ottoman bank of the Danube. Vlad fought a war of scorched earth and raids, and on the night of 17 June attacked the sultan’s camp near Târgoviște. Mehmed reached the capital but withdrew, and his candidate, Vlad’s brother Radu, won over the boyars; Vlad sought help from King Matthias of Hungary, who instead had him imprisoned.": "Mehmed II's invasion de Wallachie pour punir son prince, Vlad III, plus tard connu sous le nom de Vlad l’Impaler, qui avait cessé de rendre hommage, allié avec la Hongrie et abattu des milliers de personnes le long de la rive ottomane du Danube. Vlad a combattu une guerre de terre brûlée et des raids, et dans la nuit du 17 juin attaqué le camp de sultan près de Târgoviște. Mehmed atteignit la capitale, mais se retira, et son candidat, le frère de Vlad, Radu, gagna les boyars ; Vlad sollicita l’aide du roi Matthias de Hongrie, qui au contraire le fit emprisonner."
"The figures in the sources are unreliable. Contemporaries put the Ottoman army at 90,000 to 300,000 or more, and modern historians at perhaps 60,000–90,000; Vlad may have had about 30,000 men. Vlad’s own figure of 23,884 Turks killed in his winter raid comes from his letter to Matthias Corvinus.": "Les chiffres dans les sources sont peu fiables. Les contemporains mettent l’armée ottomane à 90 000 à 300 000 ou plus, et les historiens modernes à environ 60 000–90 000 ; Vlad a peut-être eu environ 30 000 hommes. Vlad est le propre chiffre de 23 884 Turcs tués dans son raid d’hiver vient de sa lettre à Matthias Corvinus."
"Accounts of the night attack differ widely, from great slaughter in the Ottoman camp to small losses of men and many of horses and camels, and its outcome is generally described as inconclusive.": "Les récits de l’attaque nocturne sont très différents, allant du grand massacre dans le camp ottoman à de petites pertes d’hommes et de nombreux chevaux et chameaux, et son issue est généralement qualifiée d’inconclus."
