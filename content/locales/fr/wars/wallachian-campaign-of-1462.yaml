"February – November 1462": "février – novembre 1462"
"Vlad III had held the Wallachian throne since 1456 as an Ottoman vassal, but he stopped paying tribute and made an alliance with Matthias Corvinus of Hungary. When the bey of Nicopolis, Hamza, tried to seize him by a trick near Giurgiu in the winter of 1461–1462, Vlad ambushed and captured him, took Giurgiu and raided the Ottoman bank of the Danube from Serbia to the Black Sea in January and February 1462, killing, by his own count, 23,884 people. In the spring Mehmed II led a great army north, crossing the Danube in early June while his fleet attacked Brăila and Kiliia.": "Vlad III avait tenu le trône de Wallachie depuis 1456 comme vassal ottoman, mais il a cessé de rendre hommage et fait une alliance avec Matthias Corvinus de Hongrie. Lorsque la beie de Nicopolis, Hamza, a tenté de le saisir par un tour près de Giurgiu au cours de l’hiver 1461-1462, Vlad a embusqué et capturé, a pris Giurgiu et a fait une descente sur la rive ottomane du Danube de Serbie à la mer Noire en janvier et février 1462, tuant, par son propre chef, 23 884 personnes. Au printemps Mehmed II a mené une grande armée au nord, traversant le Danube au début de juin tandis que sa flotte attaquait Brăila et Kiliia."
"Vlad emptied the country before the invaders, burning crops and poisoning wells, and harried them with raids. On the night of 17 June, with several thousand horsemen, he attacked the Ottoman camp south of Târgoviște, perhaps hoping to kill the sultan, and caused great confusion before the janissaries drove him off. When Mehmed reached Târgoviște he found it deserted, and outside it a forest of stakes with thousands of impaled prisoners, among them Hamza. The sultan withdrew, burning Brăila on 29 June, and left Vlad’s younger brother Radu, raised at the Ottoman court, to win over the boyars. By the autumn most of the boyars had gone over to Radu. Vlad turned to Matthias Corvinus, who came to Transylvania in November, but the king had no wish to fight the sultan; he had Vlad arrested and kept him a prisoner until 1475.": "Vlad a vidé le pays devant les envahisseurs, brûlé des récoltes et empoisonné des puits, et les a harcelés avec des raids. Dans la nuit du 17 juin, avec plusieurs milliers de cavaliers, il a attaqué le camp ottoman au sud de Târgoviște, espérant peut-être tuer le sultan, et a causé une grande confusion avant que les janissaires ne l’expulsent. Quand Mehmed atteignit Târgoviște, il le trouva désert, et en dehors d’elle une forêt de pieux avec des milliers de prisonniers empalés, parmi lesquels Hamza. Le sultan se retira, brûlant Brăila le 29 juin, et laissa le jeune frère de Vlad, Radu, élevé à la cour ottomane, pour gagner les boyars. Vlad se tourna vers Matthias Corvinus, qui vint en Transylvanie en novembre, mais le roi n’avait pas envie de combattre le sultan ; il fit arrêter Vlad et le garda prisonnier jusqu’en 1475."
