# Some French text was translated automatically.
"Wallachian Revolution of 1848": "Révolution wallachienne de 1848"
"A liberal and national revolution in Wallachia, an autonomous principality under Ottoman suzerainty and Russian protection. Young intellectuals and militia officers proclaimed a programme of reforms at Islaz on 21 June 1848, Prince Gheorghe Bibescu abdicated, and a provisional government in Bucharest abolished Roma slavery, ended censorship and promised land reform. Russia refused to accept it, and on 25 September Ottoman troops occupied Bucharest, after a clash with the city’s firemen on Dealul Spirii, while Russian troops entered the country. A joint Russian–Ottoman occupation lasted until 1851, but many of the revolutionaries later led the union of the principalities and the Romanian state. A smaller movement in Moldavia had been put down in the spring.": "Une révolution libérale et nationale en Wallachie, une principauté autonome sous la suzeraineté ottomane et la protection russe. Jeunes intellectuels et officiers de milice ont proclamé un programme de réformes à Islaz le 21 juin 1848, le prince Gheorghe Bibescu abdiqué, et un gouvernement provisoire à Bucarest a aboli l’esclavage rom, mis fin à la censure et promis la réforme foncière. La Russie a refusé de l’accepter, et le 25 septembre les troupes ottomanes ont occupé Bucarest, après un conflit avec les pompiers de la ville sur Dealul Spirii, tandis que les troupes russes sont entrées dans le pays. Une occupation russo-ottomane conjointe a duré jusqu’en 1851, mais beaucoup des révolutionnaires ont dirigé plus tard l’union des principautés et l’État roumain."
"Wallachia used the Julian calendar, then 12 days behind the Gregorian, so Romanian accounts date the Islaz Proclamation 9 June and the entry of the Ottoman troops into Bucharest 13 September 1848 (Old Style).": "Wallachie a utilisé le calendrier julien, puis 12 jours derrière le grégorien, donc les comptes roumains datent la Proclamation d’Islaz 9 juin et l’entrée des troupes ottomanes à Bucarest 13 septembre 1848 (Ancien Style)."
