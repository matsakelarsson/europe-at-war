# Some French text was translated automatically.
"Wallachian Uprising of 1821": "Inauguration wallachienne de 1821"
"A rising in Wallachia, then an autonomous principality under Ottoman suzerainty, led by Tudor Vladimirescu and his Pandurs, irregular soldiers of Oltenia. Begun in early 1821 against the Greek Phanariote princes and the boyars, in uneasy partnership with the Filiki Eteria, whose army under Alexander Ypsilantis had crossed from Moldavia to start the Greek War of Independence, it took Bucharest in March. When Vladimirescu negotiated with the Ottomans, the Eterists seized and killed him; Ottoman troops then crushed the scattered Pandurs and routed Ypsilantis’s army, with its Sacred Band, at Drăgășani in June. The Porte then ended Phanariote rule and named native boyars as princes of Wallachia and Moldavia, and the rising is seen as the start of Romania’s national revival.": "Une montée en Wallachie, puis une principauté autonome sous la suzeraineté ottomane, dirigée par Tudor Vladimirescu et ses Pandurs, soldats irréguliers d’Oltenia. Commencé au début de 1821 contre les princes grecs Phanariote et les boyars, en partenariat difficile avec le Filiki Eteria, dont l’armée sous Alexander Ypsilantis avait traversé de Moldavie pour commencer la guerre d’indépendance grecque, il a pris Bucarest en mars. Lorsque Vladimirescu a négocié avec les Ottomans, les Etéristes l’ont saisi et tué ; les troupes ottomanes ont ensuite écrasé les Pandurs dispersés et ont roué l’armée Ypsilantis, avec sa bande sacrée, au Drăgășani en juin. La Porte a alors mis fin à la domination phanariote et nommé boyars indigènes comme princes de Wallachie et de Moldavie, et la montée est considérée comme le début du renouveau national de la Roumanie."
"Wallachia used the Julian calendar, then 12 days behind the Gregorian. Romanian accounts date Vladimirescu’s proclamation at Padeș 23 January 1821 and his entry into Bucharest 21 March (Old Style).": "Wallachia a utilisé le calendrier julien, puis 12 jours derrière le grégorien. Les comptes roumains datent la proclamation de Vladimirescu au Padeș 23 janvier 1821 et son entrée à Bucarest 21 mars (Ancien Style)."
"Ypsilantis’s campaign in the principalities is also the first step of the Greek War of Independence.": "La campagne des Ypsilantis dans les principautés est également la première étape de la guerre d’indépendance grecque."
