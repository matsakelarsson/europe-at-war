# French translations of the catalogue text (wave 9); step bodies follow later.
Wang Xiaobo and Li Shun rebellion: Rébellion de Wang Xiaobo et Li Shun
? The peasant rising in Sichuan led by Wang Xiaobo and Li Shun against the Song, which had conquered the region from the Later Shu in 965. The Song had carried off the Shu treasury and made the officials’ purchasing office the only buyer of the region’s silk and cloth, and in the crowded Chengdu plain many poor farmers could not live from their land. In the spring of 993 Wang Xiaobo, a farmer of Qingcheng county, rose with a few hundred followers under the slogan “I hate the inequality of rich and poor; today I will make it equal for you”. His band grew to tens of thousands and took counties in Qiongzhou and Shuzhou; at Pengshan they killed the hated county magistrate and stuffed his belly with coins. Wang Xiaobo was killed by an arrow in a battle at Jiangyuan late in 993, and his comrade Li Shun took the lead. In early 994 Li Shun took Chengdu, proclaimed himself King of Great Shu with an era name of his own, and sent his forces as far as the Jianmen Pass in the north and the Yangtze gorges in the east; his army failed in an eighty-day siege of Zizhou. The emperor Taizong sent the eunuch Wang Ji’en with armies over the Qinling and up the Yangtze. Chengdu was retaken in the summer of 994, with some 30,000 rebels killed, and Li Shun was captured and executed, though rumours long said he had escaped. His follower Zhang Yu fought on in eastern Sichuan until early 995, when his own men killed him. The new prefect of Chengdu, Zhang Yong, sent the captured rebels home to farm and restored order.
: "Le soulèvement paysan mené au Sichuan par Wang Xiaobo et Li Shun contre les Song, qui avaient conquis la région sur les Shu postérieurs en 965. Les Song avaient emporté le trésor des Shu et fait du bureau d’achat des fonctionnaires le seul acheteur de la soie et des étoffes de la région, et, dans la plaine surpeuplée de Chengdu, beaucoup de paysans pauvres ne pouvaient vivre de leur terre. Au printemps 993, Wang Xiaobo, paysan du district de Qingcheng, se souleva avec quelques centaines de partisans sous le mot d’ordre : « Je hais l’inégalité entre riches et pauvres ; aujourd’hui, je rétablirai l’égalité pour vous. » Sa bande grossit jusqu’à compter des dizaines de milliers d’hommes et prit des districts dans les préfectures de Qiongzhou et de Shuzhou ; à Pengshan, les rebelles tuèrent le magistrat de district honni et lui bourrèrent le ventre de pièces de monnaie. Wang Xiaobo fut tué d’une flèche lors d’une bataille à Jiangyuan à la fin de 993, et son compagnon Li Shun prit la tête du mouvement. Au début de 994, Li Shun prit Chengdu, se proclama roi du Grand Shu avec son propre nom d’ère et envoya ses forces jusqu’au col de Jianmen au nord et jusqu’aux gorges du Yangtsé à l’est ; son armée échoua lors d’un siège de quatre-vingts jours devant Zizhou. L’empereur Taizong envoya l’eunuque Wang Ji’en avec des armées à travers les monts Qinling et en remontant le Yangtsé. Chengdu fut reprise à l’été 994, quelque 30 000 rebelles furent tués, et Li Shun fut capturé et exécuté, même si des rumeurs affirmèrent longtemps qu’il s’était échappé. Son partisan Zhang Yu poursuivit le combat dans l’est du Sichuan jusqu’au début de 995, lorsque ses propres hommes le tuèrent. Le nouveau préfet de Chengdu, Zhang Yong, renvoya les rebelles capturés cultiver leurs terres et rétablit l’ordre."
