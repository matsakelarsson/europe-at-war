"Sigismund, son of John III, was king of Poland–Lithuania as well as Sweden, and a Catholic. His Lutheran uncle Duke Charles governed Sweden and had himself chosen regent against the king’s will. In 1598 Sigismund landed at Kalmar with an army of mercenaries to take back control.": "Sigismond, fils de Jean III, était roi de Pologne – Lituanie ainsi que de Suède, et un catholique. Son oncle luthérien duc Charles gouverna la Suède et s’était lui-même choisi régent contre le testament du roi. En 1598 Sigismund atterrit à Kalmar avec une armée de mercenaires pour reprendre le contrôle."
"He won a first clash at Stegeborg in September but let Charles escape. Two weeks later, on 25 September 1598, Charles attacked his army at the Stångebro bridges in Linköping and won. Sigismund went back to Poland and was deposed as king of Sweden in 1599, starting a long feud between the Polish and Swedish branches of the Vasa family.": "Deux semaines plus tard, le 25 septembre 1598, Charles attaqua son armée aux ponts de Stångebro à Linköping et gagna. Sigismond retourna en Pologne et fut déposé roi de Suède en 1599, commençant une longue querelle entre les branches polonaises et suédoises de la famille Vasa."
