# French translations of the catalogue text (wave 7); step bodies follow later.
War in Iraq against the Islamic State: Guerre en Irak contre l’État islamique
The war in which the Islamic State (ISIS), the successor of al-Qaeda in Iraq, seized a third of Iraq in 2014 and was driven out again by 2017. Exploiting Sunni Arab anger at the Shia-led government of Nuri al-Maliki and the civil war in neighbouring Syria, its fighters took Fallujah in January 2014 and Mosul, Iraq’s second city, in June, and proclaimed a “caliphate” across the Syrian–Iraqi border. They massacred captured soldiers and Shia, and killed and enslaved thousands of Yazidis in a campaign the UN has called genocide. Iraqi forces, Shia volunteer militias of the Popular Mobilization Forces, Kurdish Peshmerga and a US-led coalition providing air power and advisers fought back, retaking Tikrit in 2015, Ramadi and Fallujah in 2016, and Mosul after a nine-month battle in July 2017. Prime Minister Haider al-Abadi declared victory on 9 December 2017, though an ISIS insurgency continued. Tens of thousands of civilians were killed and some five million people were displaced.: La guerre au cours de laquelle l’État islamique (EI), successeur d’al-Qaïda en Irak, s’empara d’un tiers de l’Irak en 2014 avant d’en être chassé en 2017. Exploitant la colère des Arabes sunnites contre le gouvernement à dominante chiite de Nouri al-Maliki et la guerre civile dans la Syrie voisine, ses combattants prirent Falloujah en janvier 2014 et Mossoul, deuxième ville d’Irak, en juin, et proclamèrent un « califat » de part et d’autre de la frontière syro-irakienne. Ils massacrèrent des soldats capturés et des chiites, et tuèrent et réduisirent en esclavage des milliers de Yézidis lors d’une campagne que l’ONU a qualifiée de génocide. Les forces irakiennes, les milices chiites de volontaires des Unités de mobilisation populaire, les peshmergas kurdes et une coalition dirigée par les États-Unis, qui fournissait l’appui aérien et des conseillers, contre-attaquèrent, reprenant Tikrit en 2015, Ramadi et Falloujah en 2016, et Mossoul en juillet 2017, après une bataille de neuf mois. Le Premier ministre Haïder al-Abadi proclama la victoire le 9 décembre 2017, même si une insurrection de l’EI se poursuivit. Des dizaines de milliers de civils furent tués et quelque cinq millions de personnes furent déplacées.
