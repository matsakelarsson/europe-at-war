# Some French text was translated automatically.
"War in Abkhazia": "Guerre en Abkhazie"
"On 14 August 1992, amid a dispute over Abkhazia’s status, Georgian National Guard troops entered the region and took Sukhumi, and the Abkhaz leadership under Vladislav Ardzinba withdrew to Gudauta, where a Russian military base stood. Abkhaz forces, joined by thousands of volunteers from the North Caucasus, among them Shamil Basayev, and helped by arms and air support from parts of the Russian military, took Gagra in October 1992 and, after a ceasefire of July 1993 broke down, Sukhumi on 27 September 1993. Atrocities were committed on both sides, and the Abkhaz victory was followed by the killing and expulsion of ethnic Georgians, the largest group in Abkhazia before the war. About 250,000 people fled or were driven out, which the OSCE called ethnic cleansing. A ceasefire agreed in Moscow in May 1994 was policed by Russian peacekeepers.": "Le 14 août 1992, alors que le statut d’Abkhazie faisait l’objet d’un différend, les troupes de la Garde nationale géorgienne sont entrées dans la région et ont pris Soukhoumi, et les dirigeants abkhazes sous Vladislav Ardzinba se sont retirés à Gudauta, où se trouvait une base militaire russe. Les forces abkhazes, auxquelles se sont joints des milliers de volontaires du Caucase du Nord, parmi lesquels Shamil Basaïev, aidés par les armes et l’appui aérien de certaines parties de l’armée russe, ont pris Gagra en octobre 1992 et, après un cessez-le-feu de juillet 1993, Soukhoumi le 27 septembre 1993. Des atrocités ont été commises des deux côtés et la victoire abkhaze a été suivie par l’assassinat et l’expulsion de Géorgiens de souche, le plus grand groupe d’Abkhazie avant la guerre. Environ 250 000 personnes ont fui ou ont été chassées, ce que l’OSCE a appelé le nettoyage ethnique."
"Abkhazia is shown as part of Georgia on the map, as it is internationally recognised. Russia officially claimed neutrality; the extent of Russian military help to the Abkhaz side is disputed in detail but widely documented.": "L’Abkhazie est montrée sur la carte en tant que partie de la Géorgie, comme elle est internationalement reconnue. La Russie a officiellement revendiqué la neutralité ; l’ampleur de l’aide militaire russe à la partie abkhaze est contestée en détail mais largement documentée."
"Numbers of dead are uncertain; sources give from about 10,000 to 30,000 in all.": "Le nombre de morts est incertain ; les sources donnent d’environ 10 000 à 30 000 au total."
