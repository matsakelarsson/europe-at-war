# French translations of the catalogue text (wave 7); step bodies follow later.
War in Afghanistan (2001–2021): Guerre d’Afghanistan (2001–2021)
? The war that began when the United States and its allies attacked Afghanistan after the al-Qaeda attacks of 11 September 2001, because the Taliban government refused to hand over al-Qaeda’s leader, Osama bin Laden. With US air power and special forces, the Northern Alliance took Kabul in November 2001 and the Taliban lost their last city, Kandahar, in December. A new Afghan state was built under the Bonn Agreement, protected by a NATO-led force, but the Taliban regrouped in Pakistan and from 2006 fought a growing insurgency in the south and east. A US “surge” in 2009–2011 brought foreign troop numbers to about 140,000, and bin Laden was killed in Pakistan in 2011, but the insurgency survived the handover of security to Afghan forces in 2014. After a US–Taliban agreement in February 2020 foreign troops withdrew; the Afghan republic collapsed as the Taliban took Kabul on 15 August 2021, and the last US troops left on 30 August after a chaotic airlift. About 176,000 people were killed in Afghanistan by one widely used estimate, among them some 46,000 civilians.
: La guerre qui commença lorsque les États-Unis et leurs alliés attaquèrent l’Afghanistan après les attentats d’al-Qaïda du 11 septembre 2001, le gouvernement des talibans ayant refusé de livrer le chef d’al-Qaïda, Oussama ben Laden. Avec l’appui de l’aviation et des forces spéciales américaines, l’Alliance du Nord prit Kaboul en novembre 2001, et les talibans perdirent leur dernière ville, Kandahar, en décembre. Un nouvel État afghan fut construit en vertu de l’accord de Bonn, sous la protection d’une force dirigée par l’OTAN, mais les talibans se regroupèrent au Pakistan et menèrent à partir de 2006 une insurrection croissante dans le sud et l’est. L’envoi de renforts américains en 2009–2011 (le « surge ») porta les effectifs des troupes étrangères à environ 140 000 hommes, et Ben Laden fut tué au Pakistan en 2011, mais l’insurrection survécut au transfert de la sécurité aux forces afghanes en 2014. Après un accord entre les États-Unis et les talibans en février 2020, les troupes étrangères se retirèrent ; la république afghane s’effondra lorsque les talibans prirent Kaboul, le 15 août 2021, et les dernières troupes américaines partirent le 30 août, au terme d’un pont aérien chaotique. Selon une estimation largement reprise, environ 176 000 personnes furent tuées en Afghanistan, dont quelque 46 000 civils.
