# French translations of the catalogue text (wave 12); step bodies follow later.
War in Amhara: Guerre en Amhara
? Last updated 27 November 2026. The insurgency of the Fano, Amhara nationalist militias, against the Ethiopian federal government of Abiy Ahmed in the Amhara region, which since September 2026 has merged into a wider war. The Fano had fought beside the federal army against the TPLF in the Tigray War, but the Pretoria agreement of 2022, the government’s order in April 2023 to disband the regional special forces and the unresolved fate of Western Tigray turned them against it. In August 2023 Fano fighters briefly took Lalibela, Gondar and other towns, and the government declared a state of emergency. Since then the Fano, divided into regional commands in Gojjam, Gondar, Wollo and Shewa until they united as the Amhara Fano National Movement in January 2026, have controlled much of the countryside while the army holds the towns and main roads and strikes from the air; drone strikes, killings of civilians by all sides and mass arrests have been reported throughout. On 20 September 2026 the Fano joined the TPLF, the Oromo Liberation Army and other groups in an armed coalition against the government, and from 23 September fighting resumed in Tigray and spread along the fronts of Wollo, Wag Hemra and Afar, with Eritrea accused of backing the rebels.
: "Dernière mise à jour : 27 novembre 2026. L’insurrection des Fano, milices nationalistes amharas, contre le gouvernement fédéral éthiopien d’Abiy Ahmed dans la région Amhara, qui s’est fondue depuis septembre 2026 dans une guerre plus large. Les Fano avaient combattu aux côtés de l’armée fédérale contre le TPLF pendant la guerre du Tigré, mais l’accord de Pretoria de 2022, l’ordre donné par le gouvernement en avril 2023 de dissoudre les forces spéciales régionales et le sort non résolu du Tigré occidental les ont retournés contre lui. En août 2023, des combattants fano ont brièvement pris Lalibela, Gondar et d’autres villes, et le gouvernement a proclamé l’état d’urgence. Depuis, les Fano, divisés en commandements régionaux dans le Godjam, à Gondar, dans le Wollo et dans le Choa jusqu’à leur union au sein du Mouvement national fano amhara en janvier 2026, contrôlent une grande partie des campagnes, tandis que l’armée tient les villes et les grands axes et frappe depuis les airs ; des frappes de drones, des meurtres de civils commis par toutes les parties et des arrestations massives ont été signalés tout au long du conflit. Le 20 septembre 2026, les Fano ont rejoint le TPLF, l’Armée de libération oromo et d’autres groupes au sein d’une coalition armée contre le gouvernement et, à partir du 23 septembre, les combats ont repris au Tigré et se sont étendus le long des fronts du Wollo, du Wag Hemra et de l’Afar, l’Érythrée étant accusée de soutenir les rebelles."
