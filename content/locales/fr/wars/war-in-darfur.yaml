# French translations of the catalogue text (wave 12); step bodies follow later.
War in Darfur: Guerre du Darfour
? The war in Sudan’s western region of Darfur between rebel movements drawn mainly from the Fur, Masalit and Zaghawa peoples and the government of Omar al-Bashir, which fought them with its army and air force and with Arab militias known as the Janjaweed. The Sudan Liberation Movement/Army (SLM/A) and the Justice and Equality Movement (JEM) rose in 2003 against the region’s neglect and the arming of Arab groups against non-Arab farmers. The government answered with a campaign of bombing and militia raids that burned thousands of villages, killed tens of thousands of civilians and drove some 2–3 million people into camps in Darfur and Chad. The United States called it genocide in 2004; a UN commission found crimes against humanity and war crimes but no proven genocidal policy, and the case went to the International Criminal Court, which in 2009 and 2010 issued arrest warrants for Bashir, the second for genocide. African Union and then joint UN–AU peacekeepers (UNAMID) were deployed, peace agreements in 2006 and 2011 brought in only some of the rebels, and in 2013 the Janjaweed were reorganised as the Rapid Support Forces. The UN estimated about 300,000 deaths by 2008, most from disease and hunger; the government gave 10,000. After Bashir’s fall in 2019 most rebel groups signed the Juba Peace Agreement of October 2020, but Darfur became a battlefield again in the civil war of 2023.
: La guerre qui opposa, dans le Darfour, région occidentale du Soudan, des mouvements rebelles issus principalement des peuples four, masalit et zaghawa au gouvernement d’Omar el-Béchir, qui les combattit avec son armée et son aviation et avec des milices arabes appelées Janjawid. Le Mouvement/Armée de libération du Soudan (SLM/A) et le Mouvement pour la justice et l’égalité (JEM) se soulevèrent en 2003 contre l’abandon de la région et l’armement de groupes arabes contre les cultivateurs non arabes. Le gouvernement riposta par une campagne de bombardements et de raids de milices qui incendia des milliers de villages, tua des dizaines de milliers de civils et poussa quelque 2–3 millions de personnes dans des camps au Darfour et au Tchad. Les États-Unis la qualifièrent de génocide en 2004 ; une commission de l’ONU conclut à des crimes contre l’humanité et à des crimes de guerre, mais pas à une politique génocidaire avérée, et l’affaire fut portée devant la Cour pénale internationale, qui délivra en 2009 et 2010 des mandats d’arrêt contre Béchir, le second pour génocide. Des forces de maintien de la paix de l’Union africaine, puis une mission conjointe ONU–UA (MINUAD) furent déployées, les accords de paix de 2006 et 2011 ne rallièrent qu’une partie des rebelles et, en 2013, les Janjawid furent réorganisés en Forces de soutien rapide. L’ONU estima à environ 300 000 le nombre de morts jusqu’en 2008, pour la plupart de maladie et de faim ; le gouvernement avança le chiffre de 10 000. Après la chute de Béchir en 2019, la plupart des groupes rebelles signèrent l’accord de paix de Juba d’octobre 2020, mais le Darfour redevint un champ de bataille lors de la guerre civile de 2023.
