# French translations of the catalogue text (wave 12); step bodies follow later.
War in Somalia (2006–2009): Guerre de Somalie (2006–2009)
? The Ethiopian intervention against the Islamic Courts Union and the insurgency that followed. In December 2006 Ethiopian forces, backing the internationally recognised but powerless Transitional Federal Government, defeated the Courts’ militias around Baidoa and drove them out of Mogadishu and Kismayo within two weeks, with American air strikes against suspected al-Qaeda members in the far south. The occupation of Mogadishu soon provoked an insurgency by former Courts fighters, clan militias and above all al-Shabaab, the Courts’ youth militia, which broke away to fight on its own. Shelling and street fighting in the capital killed thousands of civilians and drove hundreds of thousands into camps; African Union peacekeepers (AMISOM) arrived from March 2007. By late 2008 the insurgents held most of the south. A peace deal signed in Djibouti between the government and the moderate wing of the old Courts, led by Sharif Sheikh Ahmed, opened the way for Ethiopia’s withdrawal in January 2009 and Sharif’s election as president; al-Shabaab rejected it and fought on.
: L’intervention éthiopienne contre l’Union des tribunaux islamiques et l’insurrection qui suivit. En décembre 2006, les forces éthiopiennes, venues soutenir le Gouvernement fédéral de transition, reconnu internationalement mais impuissant, battirent les milices des tribunaux autour de Baidoa et les chassèrent de Mogadiscio et de Kismayo en deux semaines, tandis que des frappes aériennes américaines visaient des membres présumés d’al-Qaïda dans l’extrême sud. L’occupation de Mogadiscio provoqua bientôt une insurrection d’anciens combattants des tribunaux, de milices claniques et surtout des Chabab, la milice de jeunes des tribunaux, qui fit sécession pour combattre de son côté. Les bombardements et les combats de rue dans la capitale tuèrent des milliers de civils et poussèrent des centaines de milliers de personnes dans des camps ; les forces de maintien de la paix de l’Union africaine (AMISOM) arrivèrent à partir de mars 2007. Fin 2008, les insurgés tenaient la plus grande partie du sud. Un accord de paix signé à Djibouti entre le gouvernement et l’aile modérée des anciens tribunaux, dirigée par Sharif Sheikh Ahmed, ouvrit la voie au retrait éthiopien en janvier 2009 et à l’élection de Sharif à la présidence ; les Chabab le rejetèrent et poursuivirent le combat.
