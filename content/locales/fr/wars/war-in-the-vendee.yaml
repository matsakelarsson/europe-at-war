"March – December 1793": "mars – décembre 1793"
"In March 1793, when the Republic ordered a levy of 300,000 men for its armies, the countryside south of the lower Loire rose in revolt. Its peasants already resented the Revolution’s treatment of the Church, which had driven out the priests who refused to swear the oath to the new constitution. At Machecoul insurgents killed well over a hundred republicans in the first weeks. The rebels chose leaders from among themselves, such as the carter Jacques Cathelineau and the gamekeeper Jean-Nicolas Stofflet, and from the local nobles, such as Charette, Bonchamps, d’Elbée and Henri de La Rochejaquelein. Their Catholic and Royal Army took Thouars, Fontenay, Saumur and Angers in May and June, but its attack on Nantes on 29 June failed, and Cathelineau was mortally wounded.": "En mars 1793, lorsque la République ordonna un prélèvement de 300 000 hommes pour ses armées, les campagnes au sud de la Basse Loire se soulevèrent en révolte. Ses paysans s’opposaient déjà au traitement de l’Église par la Révolution, qui avait chassé les prêtres qui refusaient de prêter serment à la nouvelle constitution. Les rebelles ont choisi des chefs parmi eux, tels que la carter Jacques Cathelineau et le gardien Jean-Nicolas Stofflet, ainsi que des nobles locaux comme Charette, Bonchamps, d’Elbée et Henri de La Rochejaquelein. Leur armée catholique et royale a pris Thouars, Fontenay, Saumur et Angers en mai et juin, mais son attaque contre Nantes le 29 juin a échoué, et Cathelineau a été mortellement blessé."
"The Convention ordered the Vendée to be destroyed and sent in the veteran Army of Mainz, freed by that city’s surrender. The Vendéans won at Torfou in September but were beaten at Cholet on 17 October, where d’Elbée and Bonchamps were mortally wounded; Bonchamps, dying, ordered his men to spare some 5,000 republican prisoners. Perhaps 60,000 to 100,000 people, soldiers with women, children and old people, then crossed the Loire at Saint-Florent-le-Vieil, hoping to meet a British fleet. They failed to take the port of Granville in November and turned back, and were destroyed at Le Mans on 12–13 December and at Savenay on 23 December, where thousands were killed in the fighting and the massacres that followed.": "La Convention ordonna la destruction et l’envoi de la Vendée dans l’ancienne armée de Mayence, libérée par la capitulation de cette ville. Les Vénéens remportèrent à Torfou en septembre mais furent battus à Cholet le 17 octobre, où d’Elbée et Bonchamps furent mortellement blessés ; Bonchamps, mourant, ordonna à ses hommes d’épargner quelque 5 000 prisonniers républicains. Peut-être 60 000 à 100 000 personnes, soldats avec femmes, enfants et vieillards, ont traversé la Loire à Saint-Florent-le-Vieil en espérant rencontrer une flotte britannique. Ils n’ont pas pris le port de Granville en novembre et se sont retournés, et ont été détruits au Mans les 12-13 décembre et à Savenay le 23 décembre, où des milliers ont été tués dans les combats et les massacres qui ont suivi."
