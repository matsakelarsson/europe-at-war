# Some French text was translated automatically.
"War in the Vendée": "La guerre de Vendée"
"A royalist and Catholic rising in western France, south of the lower Loire, against the French Republic. Sparked by conscription in March 1793, the Catholic and Royal Army won a string of victories that summer but was destroyed after crossing the Loire, and the Republic’s repression killed tens of thousands of prisoners and civilians before the last leaders were captured and shot in 1796.": "Un royaliste et catholique s’élevant dans l’ouest de la France, au sud de la Basse-Loire, contre la République française. Stimulé par la conscription en mars 1793, l’armée catholique et royale a remporté une série de victoires cet été-là mais a été détruite après avoir traversé la Loire, et la répression de la République a tué des dizaines de milliers de prisonniers et de civils avant que les derniers dirigeants ne soient capturés et abattus en 1796."
"The insurgent region, the “Vendée militaire”, took in parts of four départements, Vendée, Maine-et-Loire, Loire-Inférieure (today Loire-Atlantique) and Deux-Sèvres. North of the Loire a related guerrilla war, the Chouannerie, went on in Brittany, Maine and Normandy until 1800, and smaller risings followed in the Vendée in 1799, 1815 and 1832.": "La région des insurgés, la \"Vendée militaire\" a pris une partie de quatre départements : Vendée, Maine-et-Loire, Loire-Inférieure (aujourd'hui Loire-Atlantique) et Deux-Sèvres. Au nord de la Loire, une guérilla connexe, la Chouannerie, se poursuit en Bretagne, dans le Maine et en Normandie jusqu’en 1800, et des montées plus petites suivent en Vendée en 1799, 1815 et 1832."
"Estimates of the dead have varied widely and are still debated. One recent estimate is about 200,000 in all, some 170,000 of them people of the insurgent region, a fifth or more of its population.": "Les estimations des morts ont varié considérablement et sont encore débattues. Une estimation récente est d’environ 200 000 au total, dont quelque 170 000 personnes de la région des insurgés, soit un cinquième ou plus de sa population."
