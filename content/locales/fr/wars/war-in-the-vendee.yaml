"December 1793 – July 1796": "décembre 1793 – juillet 1796"
"The Republic’s revenge fell on prisoners and civilians alike. In Nantes the representative on mission Jean-Baptiste Carrier had prisoners, among them priests, women and children, drowned in the Loire from November 1793 to February 1794, perhaps 4,000 or more, and thousands more were shot or guillotined there and at Angers. From January 1794 General Louis-Marie Turreau sent twelve “infernal columns” across the region with orders to burn villages and kill the rebels, and they killed tens of thousands of people, many of them not rebels at all; at Les Lucs-sur-Boulogne in February some hundreds of villagers were massacred. The killing revived the revolt, and Charette and Stofflet fought on in the bocage.": "À Nantes, le représentant en mission Jean-Baptiste Carrier a fait noyer dans la Loire, de novembre 1793 à février 1794, des prêtres, des femmes et des enfants, des milliers d’autres personnes qui y ont été abattues ou guillotinées. À partir de janvier 1794, le général Louis-Marie Turreau envoya douze colonnes infernales à travers la région avec l’ordre de brûler les villages et de tuer les rebelles, et ils tuèrent des dizaines de milliers de personnes, dont beaucoup n’étaient pas rebelles du tout ; aux Lucs-sur-Boulogne en février quelques centaines de villageois furent massacrés."
"After the fall of Robespierre in July 1794 the Republic changed course. By the Treaty of La Jaunaye on 17 February 1795 Charette made peace in return for an amnesty, freedom of worship and exemption from conscription, and Stofflet followed in May. But in June 1795 British ships landed émigré regiments on the Quiberon peninsula in Brittany, and Charette took up arms again. General Lazare Hoche crushed the landing in July and set about pacifying the west with both force and concessions. Stofflet was captured and shot at Angers on 25 February 1796, and Charette, taken in the woods near La Chabotterie, was shot at Nantes on 29 March. By the summer the west was at peace.": "Après la chute de Robespierre en juillet 1794, la République changea de cap. Par le traité de La Jaunaye du 17 février 1795, Charette fit la paix en échange d’une amnistie, de la liberté de culte et de l’exemption de conscription, et Stofflet suivit en mai. Le général Lazare Hoche a écrasé l’atterrissage en juillet et s’est mis à pacifier l’ouest avec la force et les concessions. Stofflet a été capturé et abattu à Angers le 25 février 1796, et Charette, prise dans les bois près de La Chabotterie, a été abattue à Nantes le 29 mars."
