# French translations of the catalogue text (wave 14); step bodies follow later.
War of 1812: Guerre anglo-américaine de 1812
? The war between the United States and the United Kingdom, with its colonies in Canada and its Native allies, from 1812 to 1815. The United States declared war on 18 June 1812 over British restrictions on its trade with Napoleonic France, the impressment of American sailors into the Royal Navy and British support for the Native nations resisting American expansion in the Northwest, and many Americans hoped to conquer Canada. American invasions of Upper and Lower Canada failed in 1812 and 1813, against British regulars, Canadian militia and Native warriors, among them Tecumseh’s confederacy, whose leader was killed at the Thames in 1813 after the American naval victory on Lake Erie. York, the capital of Upper Canada, was burned in 1813, and after Napoleon’s fall British forces burned Washington in August 1814, but were beaten off at Baltimore and on Lake Champlain at Plattsburgh in September. The Treaty of Ghent, signed on 24 December 1814, restored the pre-war borders; before the news arrived, Andrew Jackson defeated the British attack on New Orleans on 8 January 1815. The war ended Native hopes of British-backed resistance south of the Great Lakes and became a founding story for Canadians; some Americans came to remember it as a “second war of independence”.
: La guerre qui opposa de 1812 à 1815 les États-Unis au Royaume-Uni, à ses colonies du Canada et à ses alliés autochtones. Les États-Unis déclarèrent la guerre le 18 juin 1812 en raison des restrictions britanniques à leur commerce avec la France napoléonienne, de l’enrôlement forcé de marins américains dans la Royal Navy et du soutien britannique aux nations autochtones qui résistaient à l’expansion américaine dans le Nord-Ouest, et de nombreux Américains espéraient conquérir le Canada. Les invasions américaines du Haut-Canada et du Bas-Canada échouèrent en 1812 et en 1813 face aux réguliers britanniques, aux miliciens canadiens et aux guerriers autochtones, parmi lesquels la confédération de Tecumseh, dont le chef fut tué à la Thames en 1813, après la victoire navale américaine sur le lac Érié. York, la capitale du Haut-Canada, fut incendiée en 1813 et, après la chute de Napoléon, les forces britanniques incendièrent Washington en août 1814, mais furent repoussées à Baltimore et, sur le lac Champlain, à Plattsburgh en septembre. Le traité de Gand, signé le 24 décembre 1814, rétablit les frontières d’avant-guerre ; avant que la nouvelle ne parvienne en Amérique, Andrew Jackson repoussa l’attaque britannique contre La Nouvelle-Orléans le 8 janvier 1815. La guerre mit fin aux espoirs autochtones d’une résistance soutenue par les Britanniques au sud des Grands Lacs et devint un récit fondateur pour les Canadiens ; certains Américains en vinrent à s’en souvenir comme d’une « seconde guerre d’indépendance ».
United States (with Seneca and other New York Haudenosaunee, Choctaw, Cherokee and Muscogee allies): États-Unis (avec des alliés senecas et autres Haudenosaunee de New York, chactas, cherokees et muscogees)
United Kingdom, with Upper and Lower Canada, Nova Scotia and New Brunswick (British regulars, Canadian militia and the Colonial Marines): Royaume-Uni, avec le Haut-Canada et le Bas-Canada, la Nouvelle-Écosse et le Nouveau-Brunswick (réguliers britanniques, milice canadienne et Colonial Marines)
Tecumseh’s confederacy and other Native allies of Britain (Shawnee, Potawatomi, Wyandot, Odawa, Ojibwe, Sauk, Kickapoo, Grand River Haudenosaunee, Kahnawake Mohawk and others): Confédération de Tecumseh et autres alliés autochtones de la Grande-Bretagne (Shawnees, Potawatomis, Wyandots, Outaouais, Ojibwés, Sauks, Kickapous, Haudenosaunee de la rivière Grand, Mohawks de Kahnawake et d’autres)
