# French translations of the catalogue text (wave 14); step bodies follow later.
War of 1912 in Cuba: Guerre de 1912 à Cuba
? The armed protest of the Partido Independiente de Color (Independent Party of Colour) in 1912 and the government campaign that crushed it, in which thousands of Afro-Cubans were killed. It is also called the Little Race War (la Guerrita de las Razas), the Race War of 1912 and the Negro Rebellion, and in Cuba often the Massacre of 1912. Afro-Cubans had made up a large part of the Liberation Army in the wars of independence, but under the republic they were largely shut out of public jobs, land and political office. In 1908 veterans led by Evaristo Estenoz and Pedro Ivonnet founded the Partido Independiente de Color to press for equal rights. In 1910 Congress passed the Morúa Amendment to the electoral law, which banned parties formed on racial lines, and President José Miguel Gómez’s government had the party disbanded and its leaders jailed for a time. On 20 May 1912 party members took up arms to force the repeal of the ban, mainly in Oriente, where many Afro-Cubans worked on the sugar and coffee estates, with smaller groups in Las Villas. The government, the army under General José de Jesús Monteagudo and volunteer militias answered with a campaign of killings in the countryside of Oriente, where many Black Cubans who had not taken up arms were shot or hanged, while the press spread fear of a Black uprising. The United States landed marines to guard American sugar estates, mines and railways, with about 2,800 men in Cuba by June; the rebels fought them only once, at El Cuero. Estenoz was killed on 27 June and Ivonnet on 18 July, after he had surrendered, and the rising was over. Estimates of the dead range from about 2,000 to 6,000, nearly all Afro-Cubans; losses on the government side were small. The party was destroyed, and the last marines left on 2 August.
: La protestation armée du Partido Independiente de Color (Parti indépendant de couleur) en 1912 et la campagne gouvernementale qui l’écrasa, au cours de laquelle des milliers d’Afro-Cubains furent tués. On l’appelle aussi la petite guerre des races (la Guerrita de las Razas), la guerre des races de 1912 ou la Negro Rebellion, et à Cuba souvent le massacre de 1912. Les Afro-Cubains avaient formé une grande partie de l’Armée de libération pendant les guerres d’indépendance, mais sous la république ils étaient largement exclus des emplois publics, de la terre et des fonctions politiques. En 1908, des vétérans menés par Evaristo Estenoz et Pedro Ivonnet fondèrent le Partido Independiente de Color pour réclamer l’égalité des droits. En 1910, le Congrès adopta l’amendement Morúa à la loi électorale, qui interdisait les partis fondés sur une base raciale, et le gouvernement du président José Miguel Gómez fit dissoudre le parti et emprisonner un temps ses dirigeants. Le 20 mai 1912, des membres du parti prirent les armes pour obtenir l’abrogation de l’interdiction, principalement dans l’Oriente, où de nombreux Afro-Cubains travaillaient dans les plantations de canne à sucre et de café, avec des groupes moins nombreux à Las Villas. Le gouvernement, l’armée du général José de Jesús Monteagudo et des milices de volontaires répondirent par une campagne de tueries dans les campagnes de l’Oriente, où de nombreux Cubains noirs qui n’avaient pas pris les armes furent fusillés ou pendus, tandis que la presse répandait la peur d’un soulèvement des Noirs. Les États-Unis débarquèrent des marines pour protéger les plantations sucrières, les mines et les chemins de fer américains, avec environ 2 800 hommes à Cuba en juin ; les rebelles ne les affrontèrent qu’une fois, à El Cuero. Estenoz fut tué le 27 juin et Ivonnet le 18 juillet, après s’être rendu, et le soulèvement prit fin. Les estimations des morts vont d’environ 2 000 à 6 000, presque tous afro-cubains ; les pertes du côté gouvernemental furent faibles. Le parti fut anéanti, et les derniers marines partirent le 2 août.
