"1376–1379": "1376–1379"
"Venice and Genoa, the great trading rivals of the eastern Mediterranean, had fought three wars since the 1250s. A fourth broke out over Tenedos, an island that guarded the entrance to the Dardanelles and the route to the Black Sea. In 1376 the Byzantine emperor John V Palaiologos granted it to Venice, and Genoa, backing his rebellious son Andronikos IV, tried to take it. Genoa gathered a strong coalition, with Louis I of Hungary, who had taken Dalmatia from Venice in 1358, Francesco da Carrara, lord of Padua, and the Patriarch of Aquileia.": "Venise et Gênes, les grands rivaux commerciaux de la Méditerranée orientale, avaient combattu trois guerres depuis les années 1250. Un quatrième a éclaté sur Tenedos, une île qui gardait l’entrée des Dardanelles et le chemin vers la mer Noire. En 1376, l’empereur byzantin Jean V Palaiologis l’a accordé à Venise, et Gênes, soutenant son fils rebelle Andronikos IV, a essayé de le prendre. Gênes a rassemblé une forte coalition, avec Louis Ier de Hongrie, qui avait pris la Dalmatie de Venise en 1358, Francesco da Carrara, seigneur de Padoue, et le Patriarche d’Aquiléia."
"On 30 May 1378 the Venetian admiral Vettor Pisani beat a Genoese squadron off Anzio, but on 7 May 1379, off Pola in Istria, the Genoese under Luciano Doria destroyed his fleet. Doria was killed in the battle, and Pisani was imprisoned for his defeat. A new Genoese fleet under Pietro Doria entered the Adriatic and, with Paduan troops attacking from the mainland, broke into the lagoon and took Chioggia, at its southern end, on 16 August 1379. Venice was cut off by sea and land, and Doria rejected its offer of terms; he is said to have sworn to bridle the bronze horses of St Mark’s.": "Le 30 mai 1378, l’amiral vénitien Vettor Pisani a battu un escadron génois au large d’Anzio, mais le 7 mai 1379, au large de Pola en Istrie, le Génois sous Luciano Doria a détruit sa flotte. Doria a été tué dans la bataille, et Pisani a été emprisonné pour sa défaite. Une nouvelle flotte génoise sous Pietro Doria est entrée dans l’Adriatique et, avec les troupes Paduan attaquant du continent, s’est effondrée dans la lagune et a pris Chioggia, à son extrémité sud, le 16 août 1379. Venise a été coupée par mer et par terre, et Doria a rejeté son offre de termes ; il aurait juré de brider les chevaux de bronze de St Marc."
