# Some French text was translated automatically.
"War of Chioggia": "Guerre de Chioggia"
"The fourth war between Venice and Genoa, fought over the island of Tenedos at the mouth of the Dardanelles. Allied with Hungary and Padua, the Genoese destroyed the Venetian fleet off Pola and took Chioggia in the Venetian lagoon in 1379, but Venice blockaded them there and forced their surrender in June 1380; the Peace of Turin in 1381 gave neither side much, but Genoa never again threatened Venice at home.": "La quatrième guerre entre Venise et Gênes, a combattu sur l’île de Tenedos à l’embouchure des Dardanelles. Alliés avec la Hongrie et Padoue, les Génois ont détruit la flotte vénitienne au large de Pola et pris Chioggia dans le lagon vénitien en 1379, mais Venise les y a bloqués et forcé leur reddition en juin 1380 ; la paix de Turin en 1381 n’a donné beaucoup de côté, mais Gênes ne menaça plus jamais Venise chez eux."
"Venice’s only ally of note was Bernabò Visconti of Milan, who attacked Genoa by land but gave little direct help. Genoa’s allies were Louis I of Hungary, Francesco da Carrara of Padua and the Patriarch of Aquileia.": "Venise Le seul allié de la note est Bernabò Visconti de Milan, qui attaque Gênes par terre mais donne peu d’aide directe. Gênes alliés sont Louis Ier de Hongrie, Francesco da Carrara de Padoue et le Patriarche d’Aquileia."
"Guns were used on both sides, in the siege of Chioggia and on board ship, one of the first times in Italian warfare. Numbers of ships and men differ between sources.": "Des canons ont été utilisés des deux côtés, dans le siège de Chioggia et à bord du navire, une des premières fois dans la guerre italienne. Nombre de navires et d’hommes diffèrent entre les sources."
