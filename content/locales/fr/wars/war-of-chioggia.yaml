"1379–1381": "1379–1381"
"Venice released Pisani to popular acclaim and armed every vessel it could. On the night of 22 December 1379 Pisani and Doge Andrea Contarini sank barges loaded with stones in the channels around Chioggia, trapping the Genoese fleet inside the lagoon. On 1 January 1380 Carlo Zeno came back with his galleys from raiding Genoese shipping in the eastern Mediterranean, and the besiegers were themselves besieged. Pietro Doria was killed by a Venetian cannon ball, and a Genoese relief fleet failed to break through in May.": "Dans la nuit du 22 décembre 1379 Pisani et Doge Andrea Contarini ont coulé des barges chargées de pierres dans les canaux autour de Chioggia, piégant la flotte génoise à l’intérieur du lagon. Le 1er janvier 1380, Carlo Zeno est revenu avec ses galères de la descente des navires génois dans l’est de la Méditerranée, et les assiégés ont eux-mêmes été assiégés. Pietro Doria a été tué par un ballon de canon vénitien, et une flotte de secours génoise n’a pas réussi à percer en mai."
"On 24 June 1380 the starving Genoese in Chioggia surrendered, some 4,000 of them by most accounts. The war went on at sea and on the mainland, and in 1381 Venice handed Treviso to Duke Leopold III of Austria rather than let it fall to Padua. Exhausted, both sides accepted the mediation of Count Amadeus VI of Savoy. In the Peace of Turin of 8 August 1381 Tenedos was handed over to Savoy, its fortifications were razed and its people moved away, and Venice agreed to pay Hungary a yearly tribute and accepted the loss of Dalmatia. Genoa never again threatened Venice in its lagoon.": "Le 24 juin 1380, les Génois affamés de Chioggia se rendirent, environ 4 000 d’entre eux selon la plupart des récits. La guerre se poursuivit en mer et sur le continent, et en 1381 Venise livra Treviso au duc Léopold III d’Autriche plutôt que de le laisser tomber à Padoue. Dans la Paix de Turin du 8 août 1381 Tenedos a été remis à Savoie, ses fortifications ont été rasées et son peuple s’est éloigné, et Venise a accepté de rendre un hommage annuel à la Hongrie et a accepté la perte de Dalmatie. Gênes ne menace plus jamais Venise dans sa lagune."
