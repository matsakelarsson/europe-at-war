# Some French text was translated automatically.
"War of Curzola": "Guerre de Curzola"
"The second great war between Venice and Genoa, named after the sea battle off the Dalmatian island of Curzola (Korčula). After the fall of Acre in 1291 the two republics fought for the trade of the Levant and the Black Sea. The Genoese beat a Venetian fleet at Laiazzo (Ayas) in Cilician Armenia in 1294 and attacked the Venetians in Constantinople; Venetian fleets raided Genoese Pera and in 1296 took Caffa in the Crimea. In September 1298 the Genoese admiral Lamba Doria destroyed the Venetian fleet under Andrea Dandolo off Curzola, taking thousands of prisoners; Dandolo is said to have killed himself in captivity, and Marco Polo, by tradition captured in the war, dictated the story of his travels in a Genoese prison. Exhausted, the two republics made peace at Milan on 25 May 1299, through the mediation of Matteo Visconti, on terms that left neither side the clear winner.": "La deuxième grande guerre entre Venise et Gênes, nommée après la bataille de mer au large de l’île dalmate de Curzola (Korčula). Après la chute d’Acre en 1291, les deux républiques ont combattu pour le commerce du Levant et de la Mer Noire. En 1294, les Génois ont battu une flotte vénitienne à Laiazzo (Ayas) en Arménie cilicienne et attaqué les Vénitiens à Constantinople ; les flottilles vénitiennes ont fait un raid sur Genoese Pera et en 1296 ont pris Caffa dans la Crimée. En septembre 1298, l’amiral génois Lamba Doria a détruit la flotte vénitienne sous Andrea Dandolo au large de Curzola, prenant des milliers de prisonniers ; Dandolo aurait été tué en captivité, et Marco Polo, par tradition capturé pendant la guerre, dicta l’histoire de ses voyages dans une prison génoise. Épuisés, les deux républiques ont fait la paix à Milan le 25 mai 1299, par la médiation de Matteo Visconti, à des conditions qui n’ont laissé aucun côté du vainqueur clair."
"The Byzantine emperor Andronikos II, Genoa’s ally, arrested the surviving Venetians in Constantinople but soon came to terms with Venice. Accounts differ on whether Marco Polo was taken at Curzola, at Laiazzo or in a smaller clash.": "L’empereur byzantin Andronikos II, allié de Gênes, a arrêté les Vénitiens survivants à Constantinople mais est rapidement venu à des conditions avec Venise. Les comptes diffèrent sur la prise de Marco Polo à Curzola, à Laiazzo ou dans un petit affrontement."
