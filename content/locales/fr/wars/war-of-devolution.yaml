"War of Devolution": "Guerre de dévolution"
? "Louis XIV’s war to claim part of the Spanish Netherlands for his wife, Maria Theresa, daughter of Philip IV of Spain, under a custom of Brabant (the right of “devolution”) that favoured the children of a first marriage over those of a second. After Philip’s death in 1665, Turenne’s army invaded in May 1667 and took Charleroi, Tournai, Douai, Oudenaarde and, on 28 August, Lille, meeting little resistance from the weak Spanish forces. In February 1668 the Prince of Condé overran Franche-Comté in about two weeks. Alarmed by French success, England, the Dutch Republic and Sweden formed the Triple Alliance in January 1668 to press for peace. In the Treaty of Aix-la-Chapelle (Aachen) of 2 May 1668 France gave back Franche-Comté but kept Lille, Douai, Tournai, Oudenaarde, Courtrai, Charleroi and other towns in Flanders and Hainaut, which Vauban soon fortified. Louis resented the Dutch for the alliance, and four years later attacked them."
: "Louis XIV's guerre pour réclamer une partie des Pays-Bas espagnols pour sa femme, Maria Theresa, fille de Philippe IV d’Espagne, en vertu d’une coutume de Brabant (le droit de Dévolution) qui favorisait les enfants d’un premier mariage sur ceux d’une seconde. Après la mort de Philippes en 1665, l’armée Turenne envahit en mai 1667 et prit Charleroi, Tournai, Douai, Oudenaarde et, le 28 août, Lille, rencontrant peu de résistance des forces espagnoles faibles. Alarmée par le succès français, l’Angleterre, la République néerlandaise et la Suède forment la Triple Alliance en janvier 1668 pour faire pression pour la paix. Dans le Traité d’Aix-la-Chapelle (Aachen) du 2 mai 1668, la France rend la Franche-Comté mais maintient Lille, Douai, Tournai, Oudenaarde, Courtrai, Charleroi et d’autres villes de Flandre et Hainaut, que Vauban fortifie bientôt. Louis a ressenti le refus des Hollandais pour l’alliance, et quatre ans plus tard les a attaqués."
