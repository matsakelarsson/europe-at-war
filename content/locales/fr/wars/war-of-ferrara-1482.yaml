# Some French text was translated automatically.
"War of Ferrara, 1482–1484": "Guerre de Ferrare, 1482-1484"
"A war in which Venice, at first allied with Pope Sixtus IV, attacked Ercole I d’Este, Duke of Ferrara, who was backed by Naples, Milan, Florence and Mantua. On 21 August 1482 the papal and Venetian army under Roberto Malatesta beat the Neapolitans of Alfonso, Duke of Calabria, at Campomorto near Velletri, but in December Sixtus changed sides and later put Venice under interdict. Venetian forces overran the Polesine and threatened Ferrara itself, while the allies attacked Venetian territory in Lombardy. Exhausted, the powers made peace at Bagnolo on 7 August 1484; Venice kept the Polesine of Rovigo, and Sixtus, who had wanted a different outcome, died a few days later.": "Une guerre dans laquelle Venise, d’abord alliée avec le pape Sixte IV, attaqua Ercole I d-Este, duc de Ferrare, qui fut soutenu par Naples, Milan, Florence et Mantoue. Le 21 août 1482, l’armée papale et vénitienne sous Roberto Malatesta battit les Néapolitains d’Alfonso, duc de Calabre, à Campomorto près de Velletri, mais en décembre Sixte changea de camp et mit Venise sous interdit. Les forces vénitiennes écrasent les Polonais et menacent Ferrare elle-même, tandis que les alliés attaquent le territoire vénitien en Lombardie. Épuisés, les puissances firent la paix à Bagnolo le 7 août 1484 ; Venise garda le Polonais de Rovigo, et Sixtus, qui avait voulu un autre résultat, mourut quelques jours plus tard."
"The papacy fought on Venice’s side until December 1482 and against it afterwards. The war is also called the Salt War, after a dispute over salt from the Venetian saltworks.": "La papauté a combattu sur le côté de Venise jusqu’en décembre 1482 et contre elle par la suite. La guerre est également appelée la Guerre du sel, après une dispute sur le sel des usines de sel vénitiennes."
