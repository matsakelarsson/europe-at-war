# French translations of the catalogue text (wave 14); step bodies follow later.
War of Jenkins’ Ear: Guerre de l’oreille de Jenkins
? A war between Great Britain and Spain in the Caribbean and on the border between Georgia and Spanish Florida. British merchants resented the Spanish coast guards who searched their ships for contraband, and the opposition to Robert Walpole made a cause of Captain Robert Jenkins, whose ear a Spanish officer had cut off in 1731; Spain and Britain also disputed the land between Georgia, founded in 1733, and Florida. Britain declared war in October 1739. Admiral Edward Vernon took Porto Bello on the Isthmus of Panama in November 1739, but the great expedition against Cartagena de Indias in 1741 was beaten by Blas de Lezo’s defence and by yellow fever, and an attempt on Santiago de Cuba also failed. On the mainland James Oglethorpe of Georgia besieged Saint Augustine in 1740 and was defeated at Fort Mose by Spanish troops and the free Black militia of Francisco Menéndez; in 1742 a Spanish invasion of Georgia was turned back on St. Simons Island at Gully Hole Creek and Bloody Marsh. From 1742 the war merged into the War of the Austrian Succession, and the Treaty of Aix-la-Chapelle in 1748 restored the state before the war.
: Une guerre entre la Grande-Bretagne et l’Espagne dans les Caraïbes et à la frontière entre la Géorgie et la Floride espagnole. Les marchands britanniques supportaient mal les garde-côtes espagnols qui fouillaient leurs navires à la recherche de contrebande, et l’opposition à Robert Walpole fit son cheval de bataille de l’affaire du capitaine Robert Jenkins, dont un officier espagnol avait tranché l’oreille en 1731 ; l’Espagne et la Grande-Bretagne se disputaient aussi les terres situées entre la Géorgie, fondée en 1733, et la Floride. La Grande-Bretagne déclara la guerre en octobre 1739. L’amiral Edward Vernon prit Porto Bello, sur l’isthme de Panama, en novembre 1739, mais la grande expédition contre Carthagène des Indes, en 1741, fut mise en échec par la défense de Blas de Lezo et par la fièvre jaune, et une tentative contre Santiago de Cuba échoua également. Sur le continent, James Oglethorpe, gouverneur de la Géorgie, assiégea Saint-Augustin en 1740 et fut battu au fort Mose par les troupes espagnoles et la milice noire libre de Francisco Menéndez ; en 1742, une invasion espagnole de la Géorgie fut repoussée sur l’île St. Simons, à Gully Hole Creek et à Bloody Marsh. À partir de 1742, la guerre se fondit dans la guerre de Succession d’Autriche, et le traité d’Aix-la-Chapelle de 1748 rétablit la situation d’avant-guerre.
Great Britain, with Georgia, South Carolina and the other colonies, and Muscogee, Chickasaw, Yamacraw and other Native allies: Grande-Bretagne, avec la Géorgie, la Caroline du Sud et les autres colonies, et des alliés autochtones (Muscogees, Chicachas, Yamacraws et autres)
