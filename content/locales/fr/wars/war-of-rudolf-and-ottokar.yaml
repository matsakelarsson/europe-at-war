"1273–1276": "1273–1276"
"Ottokar II, king of Bohemia since 1253, had built up the largest realm in the Empire. He took Austria in 1251, Styria after beating the Hungarians in 1260, the Egerland in 1266, and Carinthia and Carniola in 1269. When the electors chose Count Rudolf of Habsburg as king of the Romans in 1273, Ottokar refused to recognise him. A diet at Nuremberg in 1274 ordered all imperial lands taken since 1250 to be given back; Ottokar ignored the summons to answer for his, was placed under the imperial ban, and in June 1276 Rudolf declared war.": "Ottokar II, roi de Bohême depuis 1253, avait construit le plus grand royaume de l’Empire. Il a pris l’Autriche en 1251, Styrie après avoir battu les Hongrois en 1260, l’Egerland en 1266, et Carinthie et Carniola en 1269. Quand les électeurs ont choisi le comte Rudolf de Habsbourg comme roi des Romains en 1273, Ottokar a refusé de le reconnaître. Un régime alimentaire à Nuremberg en 1274 ordonna la restitution de toutes les terres impériales prises depuis 1250 ; Ottokar ignora les citations à répondre pour sa, fut placé sous l’interdiction impériale, et en juin 1276 Rudolf déclara la guerre."
"Rudolf won over Duke Henry XIII of Lower Bavaria, Ottokar’s ally, and marched down the Danube into Austria, where towns and nobles came over to him, while Count Meinhard II of Tyrol led a second army through Carinthia into Styria. In Bohemia the powerful Vítkovci clan rose against Ottokar. With Vienna under siege and his support crumbling, Ottokar gave in. On 21 November 1276 he renounced Austria, Styria, Carinthia, Carniola and the Egerland, and he received Bohemia and Moravia back from Rudolf as fiefs. His son Wenceslaus was betrothed to Rudolf’s daughter Judith.": "Rudolf remporta le duc Henri XIII de Basse-Bavière, allié d’Ottokars, et descendit le Danube en Autriche, où des villes et des nobles lui vinrent, tandis que le comte Meinhard II du Tyrol menait une seconde armée par Carinthie en Styrie. En Bohême, le puissant clan Vítkovci s’éleva contre Ottokar. Le 21 novembre 1276, il renonça à l’Autriche, à la Styrie, à la Carinthie, à la Carniola et à l’Egerland, et reçut de Rudolf la Bohême et la Moravie comme fiefs."
