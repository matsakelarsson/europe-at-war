"1277–1278": "1277–1278"
"Ottokar soon quarrelled with Rudolf over how the treaty was carried out, and he found allies among the margraves of Brandenburg, the Polish and Silesian princes and, again, Henry XIII of Lower Bavaria. Rudolf won over the Viennese with new privileges and allied with the young King Ladislaus IV of Hungary. In the summer of 1278 Ottokar invaded Lower Austria and besieged Drosendorf and then Laa an der Thaya. Rudolf left Vienna and marched north-east into the Marchfeld, the plain along the river Morava, where Hungarian and Cuman horsemen joined him.": "Ottokar se disputa bientôt avec Rudolf sur la manière dont le traité fut exécuté, et il trouva des alliés parmi les margraves de Brandebourg, les princes polonais et silésiens et, encore une fois, Henri XIII de Basse-Bavière. Rudolf gagna la Vienne avec de nouveaux privilèges et allié au jeune roi Ladislaus IV de Hongrie. Au cours de l’été 1278, Ottokar envahit la Basse-Autriche et assiégea Drosendorf, puis Laa an der Thaya. Rudolf quitta Vienne et marcha au nord-est dans le Marchfeld, la plaine le long de la rivière Morava, où des cavaliers hongrois et Cuman se joignirent à lui."
"On 26 August the two armies, both almost entirely mounted, met between Dürnkrut and Jedenspeigen. Cuman horse archers harried Ottokar’s left, and the Hungarians drove it from the field; in the centre Rudolf, aged 60, was unhorsed and nearly killed. Around midday a reserve of heavy cavalry under Ulrich von Kapellen, hidden until then, struck Ottokar’s flank, and his army broke. Ottokar was killed in the rout. Rudolf held Moravia for five years, and Margrave Otto of Brandenburg became regent of Bohemia for the six-year-old Wenceslaus II. In 1282 Rudolf gave Austria and Styria to his sons.": "Le 26 août, les deux armées, presque toutes montées, se rencontrèrent entre Dürnkrut et Jedenspeigen. Les archers de cheval de Cuman harcelèrent Ottokar, et les Hongrois la conduisirent hors du champ ; au centre Rudolf, âgé de 60 ans, fut débordé et faillit être tué. Vers midi, une réserve de cavalerie lourde sous Ulrich von Kapellen, cachée jusqu’alors, frappa le flanc d’Ottokar et son armée se brisa. Ottokar fut tué dans la rout. Rudolf tenu Moravia pendant cinq ans, et Margrave Otto de Brandebourg devint régent de Bohême pour les six ans Wenceslaus II. En 1282, Rudolf donna l’Autriche et la Styrie à ses fils."
