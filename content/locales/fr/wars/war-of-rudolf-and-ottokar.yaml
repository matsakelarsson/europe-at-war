# Some French text was translated automatically.
"1276": "1276"
"War of Rudolf I and Ottokar II": "Guerre de Rudolf I et Ottokar II"
"The war in which Rudolf of Habsburg, elected king of the Romans in 1273, took Austria, Styria, Carinthia and Carniola from King Ottokar II of Bohemia. Ottokar submitted at Vienna in 1276, tried to win the lands back and was killed at the battle on the Marchfeld in 1278; the Habsburgs held Austria from then until 1918.": "La guerre dans laquelle Rudolf de Habsbourg, élu roi des Romains en 1273, a pris l’Autriche, Styrie, Carinthie et Carniola du Roi Ottokar II de Bohême. Ottokar soumis à Vienne en 1276, essayé de gagner les terres et a été tué à la bataille sur le Marsfeld en 1278 ; les Habsbourg tenu Autriche de ce temps jusqu’en 1918."
"Dates are Julian, as usual for the period. The war took place in the duchies of Austria, Styria and Carinthia and the March of Carniola, today divided between Austria and Slovenia; their medieval borders are shown only approximately.": "Les dates sont Julian, comme d’habitude pour la période. La guerre a eu lieu dans les duchés d’Autriche, Styrie et Carinthie et la Marche de Carniola, aujourd'hui divisée entre l’Autriche et la Slovénie ; leurs frontières médiévales ne sont montrées qu’approximativement."
"Rudolf was king of the Romans, the elected German king, but was never crowned emperor.": "Rudolf était roi des Romains, le roi allemand élu, mais n’a jamais été couronné empereur."
