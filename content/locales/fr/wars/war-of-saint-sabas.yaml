# Some French text was translated automatically.
"War of Saint Sabas": "Guerre de Saint Sabas"
"A war between Genoa and Venice, each with its allies, that began in 1256 with fighting in Acre over property near the monastery of St Sabas and spread across the eastern Mediterranean, dividing the barons and military orders of the Kingdom of Jerusalem. Venice and Pisa drove the Genoese out of Acre after a naval victory in 1258, and Genoa moved its base to Tyre and in 1261 allied with the Byzantine emperor Michael VIII, who recovered Constantinople that year. Venetian fleets won again at Settepozzi in 1263 and at Trapani in 1266. Peace was made at Cremona in 1270, under pressure from Louis IX, who needed both cities’ ships for his crusade.": "Une guerre entre Gênes et Venise, chacune avec ses alliés, qui a commencé en 1256 avec des combats à Acre sur la propriété près du monastère de St Sabas et s’est étendue à travers la Méditerranée orientale, divisant les barons et les ordres militaires du Royaume de Jérusalem. Venise et Pise ont chassé les Génois d’Acre après une victoire navale en 1258, et Gênes a déplacé sa base à Tyr et en 1261 allié avec l’empereur byzantin Michael VIII, qui a récupéré Constantinople cette année-là. La paix a été faite à Cremona en 1270, sous la pression de Louis IX, qui avait besoin des deux villes pour sa croisade."
"Pisa at first sided with Genoa and changed sides in 1257. In the Kingdom of Jerusalem the Templars and the Ibelins mostly backed Venice, and the Hospitallers and Philip of Montfort, lord of Tyre, backed Genoa. The war weakened the kingdom at the moment when the Mongols and then the Mamluks were advancing.": "Pise d’abord à côté de Gênes et a changé de camp en 1257. Dans le Royaume de Jérusalem les Templiers et les Ibelins ont soutenu la plupart du temps Venise, et les Hospitaliers et Philippe de Montfort, seigneur de Tyr, ont soutenu Gênes. La guerre affaibli le royaume au moment où les Mongols et puis les Mamelouks avançaient."
