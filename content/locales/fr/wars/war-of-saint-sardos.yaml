# Some French text was translated automatically.
"War of Saint-Sardos": "Guerre de Saint-Sardos"
"A short war in which Charles IV of France seized most of the English king’s duchy of Aquitaine. It grew out of a dispute over a French bastide at Saint-Sardos in the Agenais, which a Gascon lord, Raymond-Bernard of Montpezat, burned in October 1323, hanging a royal sergeant. Charles declared the duchy forfeit, and in August–September 1324 Charles of Valois overran most of it, taking La Réole from the Earl of Kent after a siege. A truce negotiated by Queen Isabella in 1325 left the French in possession of their conquests, and her stay in France led to Edward II’s overthrow.": "Une courte guerre dans laquelle Charles IV de France s’empare de la plupart des rois anglais duchés d’Aquitaine. Elle est née d’une dispute sur une bastide française à Saint-Sardos dans l’Agenais, qu’un seigneur Gascon, Raymond-Bernard de Montpezat, a brûlée en octobre 1323, pendant un sergent royal. Charles a déclaré le duché confisqué, et en août-septembre 1324 Charles de Valois l’a emporté la majeure partie, prenant La Réole du comte de Kent après un siège. Une trêve négociée par la reine Isabella en 1325 quitta les Français en possession de leurs conquêtes, et son séjour en France conduisit à la chute d’Edward II."
"Historians see the war as one of the forerunners of the Hundred Years’ War. Under the settlement the Agenais stayed in French hands, and English Gascony was reduced to a coastal strip around Bordeaux and Bayonne.": "Les historiens voient la guerre comme l’un des précurseurs de la guerre de Cent Ans. Sous la colonie, les Agenais restent aux mains des Français, et la Gascogne anglaise est réduite à une bande côtière autour de Bordeaux et Bayonne."
