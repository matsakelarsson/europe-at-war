"Frederick repudiated the truce at the end of 1741, accusing Austria of letting it become known, and his troops took Olmütz in Moravia. In February 1742 he led Prussians, Saxons and French through Moravia towards Vienna, but the advance stalled before Brünn for lack of supplies, and in April he fell back into Bohemia. Prince Charles of Lorraine, Maria Theresa’s brother-in-law, followed with about 30,000 men and attacked him at Chotusitz, near Čáslav, on 17 May. The Austrians broke into the Prussian lines and set the village on fire, but were driven off. Each side lost some 5,000 to 7,000 men.": "Frederick répudie la trêve à la fin de 1741, accusant l’Autriche de la faire connaître, et ses troupes prennent Olmütz en Moravie. En février 1742, il conduit les Prussiens, les Saxons et les Français à travers la Moravie vers Vienne, mais l’avance s’arrête devant Brünn pour manque de fournitures, et en avril il tombe dans la Bohême. Le 17 mai, le prince Charles de Lorraine, beau-frère de Maria Theresa, suivit avec environ 30 000 hommes et l’attaqua à Chotusitz, près de Čáslav. Les Autrichiens firent irruption dans les lignes prussiennes et incendièrent le village, mais furent chassés."
"Maria Theresa now needed peace with Prussia to deal with France and Bavaria. By the preliminary Peace of Breslau on 11 June, confirmed in Berlin on 28 July, she gave up most of Silesia and the county of Glatz, keeping only Teschen and parts of Troppau, Jägerndorf and Neisse. Saxony made peace too, and the French in Prague were left besieged. On 16 December Marshal Belle-Isle broke out with 14,000 men and marched them through the snow to Eger in ten days, losing many to cold and sickness. The 6,000 left behind under François de Chevert, mostly sick or wounded, then marched out with the honours of war.": "Maria Theresa avait maintenant besoin de la paix avec la Prusse pour traiter avec la France et la Bavière. Par la paix préliminaire de Breslau le 11 juin, confirmée à Berlin le 28 juillet, elle a abandonné la majeure partie de la Silésie et du comté de Glatz, ne tenant que Teschen et des parties de Toppau, Jägerndorf et Neisse. Le 16 décembre, le maréchal Belle-Isle débarqua avec 14 000 hommes et les marcha dans la neige jusqu’à Eger en dix jours, perdant beaucoup à cause du froid et de la maladie."
