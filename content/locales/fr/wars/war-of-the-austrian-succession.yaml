"Dettingen and the fall of Bavaria": "Dettingen et la chute de la Bavière"
"In 1743 the war turned against Charles VII. Prince Charles of Lorraine invaded Bavaria again, beat the Bavarians at Simbach on the Inn on 9 May, and drove them and their French allies out of the country. The emperor fled to Frankfurt, and on 27 June his generals agreed at Niederschönenfeld to keep the Bavarian army neutral while Austria governed Bavaria. Charles VII was left an emperor without lands, dependent on French subsidies.": "En 1743, la guerre se retourna contre Charles VII. Le prince Charles de Lorraine envahit de nouveau la Bavière, battit les Bavarois à Simbach sur l’Auberge le 9 mai et les chassa ainsi que leurs alliés français hors du pays. L’empereur s’enfuit à Francfort et, le 27 juin, ses généraux acceptèrent à Niederschönenfeld de maintenir la neutralité de l’armée bavaroise pendant que l’Autriche gouvernait la Bavière."
"Britain, which was paying subsidies to Austria, sent an army to Germany. The Pragmatic Army of British, Hanoverian and Austrian troops, led by King George II, marched up the Main and was nearly trapped by a larger French army under Marshal Noailles. On 27 June at Dettingen a French force under the Duke of Gramont left its strong position to attack and was driven back across the river. It was the last battle in which a British monarch led his troops in person. In September Britain, Austria and Sardinia allied at Worms, and in the spring of 1744 France declared war on Britain and Austria.": "La Grande-Bretagne, qui payait des subventions à l’Autriche, envoya une armée en Allemagne. L’armée pragmatique des troupes britanniques, hanoveriennes et autrichiennes, dirigée par le roi George II, monta dans la Main et fut presque piégée par une plus grande armée française sous le maréchal Noailles. Ce fut la dernière bataille où un monarque britannique mena ses troupes en personne. En septembre, la Grande-Bretagne, l’Autriche et la Sardaigne alliés à Worms, et au printemps de 1744, la France déclara la guerre à la Grande-Bretagne et à l’Autriche."
"Battle of Simbach": "Bataille de Simbach"
"9 May 1743, Austrian victory": "9 mai 1743, victoire autrichienne"
"Battle of Dettingen": "Bataille de Dettingen"
"27 June 1743, Pragmatic Army victory": "27 juin 1743, victoire de l’armée pragmatique"
"Treaty of Worms": "Traité sur les vers"
"13 September 1743, Britain, Austria and Sardinia": "13 septembre 1743, Grande-Bretagne, Autriche et Sardaigne"
"9 May 1743": "9 mai 1743"
"Prince Charles of Lorraine’s Austrians routed a Bavarian corps, which lost some 4,000 men killed or captured. The town was almost entirely destroyed.": "Le prince Charles de Lorraine a fait route vers un corps bavarois, qui a perdu quelque 4 000 hommes tués ou capturés. La ville a été presque entièrement détruite."
"27 June 1743": "27 juin 1743"
"George II’s army beat the French on the Main between Aschaffenburg and Hanau. Handel wrote his Dettingen Te Deum to celebrate it.": "L’armée de George II battait les Français sur la Main entre Aschaffenburg et Hanau. Haendel écrivait son Dettingen Te Deum pour le célébrer."
"George II": "George II"
"Occupied by Austria, 1743–1744": "Occupé par l’Autriche, 1743–1744"
"The Second Silesian War": "La Seconde Guerre de Silésie"
"August 1744 – December 1745": "août 1744 – décembre 1745"
"Austria’s successes alarmed Frederick, who feared that it would take back Silesia once it had beaten Bavaria and France. In August 1744 he invaded Bohemia with some 70,000 men and took Prague on 16 September, while the main Austrian army was across the Rhine in Alsace. It hurried back, and Field Marshal Otto Ferdinand von Traun, refusing battle, cut the Prussian supply lines until Frederick retreated to Silesia, losing thousands of men to hunger and desertion. Charles VII died on 20 January 1745, and in April his son made peace at Füssen, giving up his father’s claims in return for Bavaria.": "En août 1744, il envahit la Bohême avec quelque 70 000 hommes et prit Prague le 16 septembre, alors que la principale armée autrichienne traversait le Rhin en Alsace. Le maréchal Otto Ferdinand von Traun, refusant la bataille, coupa les lignes de ravitaillement prussiennes jusqu’à ce que Frederick se retire en Silésie, perdant des milliers d’hommes à la faim et à la désertion. Charles VII mourut le 20 janvier 1745, et en avril son fils fit la paix à Füssen, abandonnant les revendications de son père en échange de la Bavière."
"At the end of May an Austrian and Saxon army under Prince Charles crossed the mountains into Silesia. At dawn on 4 June Frederick attacked it at Hohenfriedberg; the Bayreuth Dragoons broke the Austrian infantry, and the allies lost more than 10,000 men. He won again at Soor in Bohemia at the end of September, soon after Maria Theresa’s husband was elected emperor as Francis I. When they planned a winter march on Berlin, the old Prince Leopold of Anhalt-Dessau beat the Saxons at Kesselsdorf on 15 December, and Dresden fell. By the Peace of Dresden on 25 December Austria again gave up Silesia, and Prussia recognised Francis I.": "A la fin du mois de mai, une armée autrichienne et saxonne sous le prince Charles traversa les montagnes en Silésie. À l’aube du 4 juin, Frederick l’attaqua à Hohenfriedberg ; les Dragoons de Bayreuth brisèrent l’infanterie autrichienne, et les alliés perdirent plus de 10 000 hommes. Lorsqu'ils planifièrent une marche d’hiver sur Berlin, le vieux prince Léopold d’Anhalt-Dessau battit les Saxons à Kesselsdorf le 15 décembre et Dresde tomba. Par la paix de Dresde le 25 décembre l’Autriche abandonna de nouveau Silésie, et la Prusse reconnut François Ier."
"Battle of Hohenfriedberg": "Bataille de Hohenfriedberg"
"4 June 1745, Prussian victory": "4 juin 1745, victoire prussienne"
"Battle of Kesselsdorf": "Bataille de Kesselsdorf"
"15 December 1745, Prussian victory": "15 décembre 1745, victoire prussienne"
"Peace of Dresden": "Paix de Dresde"
"25 December 1745": "25 décembre 1745"
"16 September 1744": "16 septembre 1744"
"The city surrendered after a week of bombardment, but the Prussians had to give it up in November.": "La ville s’est rendue après une semaine de bombardement, mais les Prussiens ont dû l’abandonner en novembre."
"Peace of Füssen": "Paix de Füssen"
"22 April 1745": "22 avril 1745"
"Maximilian III Joseph of Bavaria renounced his father’s claims and promised his vote to Maria Theresa’s husband, and Austria gave Bavaria back.": "Maximilien III Joseph de Bavière a renoncé à ses revendications de père et promis son vote au mari de Maria Theresa, et l’Autriche a rendu la Bavière."
"4 June 1745": "4 juin 1745"
"Fought near Striegau, today’s Strzegom. One of Frederick’s most complete victories.": "Frappé près de Striegau, aujourd'hui Strzegom. Une des victoires les plus complètes de Frederick."
"15 December 1745": "15 décembre 1745"
"The Prussians stormed the Saxon position west of Dresden, opening the way to the capital.": "Les Prussiens ont pris la position saxonne à l’ouest de Dresde, ouvrant le chemin vers la capitale."
"Austria and Saxony made peace with Prussia, which kept Silesia and Glatz and recognised Francis I as emperor.": "L’Autriche et la Saxe ont fait la paix avec la Prusse, qui a gardé Silésie et Glatz et reconnu François Ier comme empereur."
"Frederick, 1744": "Frédéric, 1744"
"Charles of Lorraine, 1745": "Charles de Lorraine, 1745"
"Leopold of Anhalt-Dessau": "Léopold d’Anhalt-Dessau"
"The Peace of Aachen": "La paix d’Aachen"
"1745–1748": "1745–1748"
"Away from Silesia the war was fought above all in the Low Countries and Italy, and there it went on after Prussia made peace. In Flanders the French under Marshal Maurice de Saxe beat the allied armies at Fontenoy in May 1745, Rocoux in 1746 and Lauffeld in 1747, and conquered the Austrian Netherlands. In Italy Austrian and Sardinian troops fought the Spanish and French. Britain and France also fought at sea, in North America and in India. In 1748, as the French besieged Maastricht, a Russian corps paid for by Britain and the Dutch was marching west across Germany.": "En Flandre, les Français sous le maréchal Maurice de Saxe ont battu les armées alliées à Fontenoy en mai 1745, Rocoux en 1746 et Lauffeld en 1747, et conquis les Pays-Bas autrichiens. En Italie, les troupes autrichiennes et sardes combattent les Espagnols et les Français. En 1748, alors que les Français assiégeaient Maastricht, un corps russe payé par la Grande-Bretagne et les Hollandais marchait à l’ouest en Allemagne."
"A peace congress opened at Aachen (Aix-la-Chapelle) in April 1748, and the treaty was signed on 18 October. It confirmed Maria Theresa’s inheritance and her husband’s title as emperor, and guaranteed Silesia to Prussia. France gave back the Austrian Netherlands, and Britain and France returned each other’s colonial conquests. The Spanish Infante Philip received Parma, Piacenza and Guastalla, and Sardinia gained land in Lombardy. Silesia was the only great change north of the Alps, and Maria Theresa never accepted its loss; within a few years she had reformed her army and found new allies to win it back.": "Un congrès de paix ouvert à Aachen (Aix-la-Chapelle) en avril 1748, et le traité fut signé le 18 octobre. Il confirma l’héritage de Maria Theresa et son mari comme empereur, et garantit la Silésie à la Prusse. L’infante espagnole Philip reçoit Parma, Piacenza et Guastalla, et la Sardaigne gagne des terres en Lombardie. La Silésie est le seul grand changement au nord des Alpes, et Maria Theresa n’accepte jamais sa perte ; en quelques années elle a réformé son armée et trouvé de nouveaux alliés pour la reconquérir."
"Treaty of Aix-la-Chapelle": "Traité d’Aix-la-Chapelle"
"18 October 1748": "18 octobre 1748"
"Silesia guaranteed": "Silésie garantie"
"Parma, Piacenza and Guastalla": "Parme, Piacenza et Guastalla"
"To the Spanish Infante Philip": "À l’Infanterie espagnole Philip"
"Battle of Fontenoy": "Bataille de Fontenoy"
"11 May 1745": "11 mai 1745"
"Maurice de Saxe beat a British, Hanoverian, Dutch and Austrian army under the Duke of Cumberland, opening the way into Flanders.": "Maurice de Saxe a battu une armée britannique, hanoverienne, néerlandaise et autrichienne sous le duc de Cumberland, ouvrant la voie à la Flandre."
"Battle of Rocoux": "Bataille de Rocoux"
"11 October 1746": "11 octobre 1746"
"A French victory outside Liège. By then France held almost all of the Austrian Netherlands.": "Une victoire française en dehors de Liège. À l’époque, la France a tenu presque tous les Pays-Bas autrichiens."
"Battle of Lauffeld": "Bataille de Lauffeld"
"2 July 1747": "2 juillet 1747"
"Saxe beat Cumberland’s allied army west of Maastricht, though it escaped across the Meuse.": "Saxe bat l’armée alliée de Cumberland à l’ouest de Maastricht, bien qu’elle se soit échappée à travers la Meuse."
"Maastricht": "Maastricht"
"April – May 1748": "avril – mai 1748"
"Saxe’s last siege of the war. The Dutch fortress was handed over in May, after the preliminary peace had been agreed.": "La forteresse hollandaise fut cédée en mai, après l’accord préalable de paix."
"The peace confirmed Maria Theresa’s inheritance and restored almost all conquests except Silesia.": "La paix confirma l’héritage de Maria Theresa et rétablit presque toutes les conquêtes sauf la Silésie."
"Occupied by France by 1748 (approximate)": "Occupé par la France en 1748 (approximative)"
