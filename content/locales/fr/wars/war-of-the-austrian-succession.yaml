"1742–1747": "1742–1747"
"In Italy, Philip V’s queen, Elisabeth Farnese, hoped to win a duchy in the north for her younger son, Philip. From the winter of 1741–1742 Spanish armies landed in Tuscany, and another marched through southern France into Savoy, which Spain occupied until the peace. Charles Emmanuel III of Sardinia, who could bargain with both sides, joined Maria Theresa in 1742 in return for promises of land. In August a British squadron forced Naples out of the war by threatening to bombard the city. The Austrians and Sardinians fought the Spanish to a bloody draw at Campo Santo near Modena in February 1743, and in August 1744 King Charles of Naples, back in the war, threw back an Austrian night attack on his headquarters at Velletri, south of Rome. In 1745 Genoa joined the Bourbons, and after their victory at Bassignana in September the French and Spanish entered Milan.": "En Italie, Elisabeth Farnese, reine de Philippe V., espérait gagner un duché dans le nord pour son fils cadet, Philip. Dès l’hiver 1741–1742, les armées espagnoles débarquèrent en Toscane et une autre parcourait le sud de la France en Savoie, que l’Espagne occupait jusqu’à la paix. Charles Emmanuel III de Sardaigne, qui pouvait négocier avec les deux parties, rejoignit Maria Theresa en 1742 en échange des promesses de terre. En août, un escadron britannique força Naples à sortir de la guerre en menaçant de bombarder la ville. Les Autrichiens et les sardes combattirent les Espagnols pour un tir sanglant au Campo Santo près de Modène en février 1743, et en août 1744, le roi Charles de Naples, de retour dans la guerre, jeta une attaque de nuit autrichienne sur son quartier général à Velletri, au sud de Rome. En 1745 Gênes rejoint les Bourbons, et après leur victoire à Bassignana en septembre les Français et les Espagnols entrent à Milan."
"The tide turned in 1746. Austrian troops freed by the peace with Prussia beat the French and Spanish in a hard battle at Piacenza on 16 June, and the Bourbon armies fell back to Provence. Genoa, left on its own, surrendered in September and was made to pay a heavy indemnity. On 5 December the Genoese rose against the Austrian occupiers – by tradition the revolt began when a boy known as Balilla threw a stone at soldiers dragging a mortar through the streets – and drove them out within days, and an Austrian siege the next spring failed. On 19 July 1747 a French army trying to break into Piedmont attacked the Sardinians entrenched on the Assietta ridge and was thrown back with heavy losses; its commander, the Chevalier de Belle-Isle, was killed. At the peace the Infante Philip received Parma, Piacenza and Guastalla.": "Les troupes autrichiennes libérées par la paix avec la Prusse ont battu les Français et les Espagnols dans une bataille acharnée à Piacenza le 16 juin, et les armées Bourbon sont retombées en Provence. Gênes, quitta toute seule, se rendit en septembre et fut faite pour payer une lourde indemnité. Le 5 décembre, les Génois se sont levés contre les occupants autrichiens – par tradition la révolte a commencé quand un garçon connu sous le nom de Balilla a jeté une pierre sur des soldats qui traînaient un mortier dans les rues – et les a chassés en quelques jours, et un siège autrichien le printemps suivant a échoué. Le 19 juillet 1747, une armée française qui tentait d’entrer par effraction dans le Piémont attaqua les sardes enchâssés sur la crête d’Assietta et fut repoussée avec de lourdes pertes ; son commandant, le Chevalier de Belle-Isle, fut tué."
