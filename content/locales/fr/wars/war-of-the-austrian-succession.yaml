"December 1740 – May 1741": "décembre 1740 – mai 1741"
"When the Emperor Charles VI died on 20 October 1740, his 23-year-old daughter Maria Theresa inherited the Habsburg lands under the Pragmatic Sanction, a settlement that most of Europe had promised to respect. Frederick II, king of Prussia for only five months, saw his chance. Pressing old and doubtful Hohenzollern claims to Silesian duchies, he marched about 27,000 men into Silesia on 16 December without declaring war. The rich province was weakly garrisoned, and its capital, Breslau, let the Prussians in without a fight early in January 1741.": "Lorsque l’empereur Charles VI mourut le 20 octobre 1740, sa fille de 23 ans Maria Theresa hérite des terres Habsbourg sous la Sanction pragmatique, une colonie que la plupart des Européens avaient promis de respecter. Frederick II, roi de Prusse pendant seulement cinq mois, vit sa chance. Le 16 décembre 1741, il fit marcher environ 27 000 hommes dans la Silésie sans déclarer la guerre. La province riche était faiblement en garnison et sa capitale Breslau laissait entrer les Prussiens sans se battre."
"Only the fortresses of Glogau, Brieg and Neisse held out, and Glogau was stormed on 9 March. Late that month an Austrian army under Wilhelm Reinhard von Neipperg crossed the mountains from Moravia and relieved Neisse. On 10 April the two armies met in the snow at Mollwitz, near Brieg. The Austrian cavalry routed the Prussian horse, and Frederick, urged by Field Marshal Kurt von Schwerin, rode from the field; but Schwerin’s infantry held and drove the Austrians off with its steady fire. Each side lost some 4,500 to 5,000 men, and the victory encouraged France, Bavaria and Saxony to join the attack on Austria.": "Seules les forteresses de Glogau, Brieg et Neisse ont tenu, et Glogau a été pris d’assaut le 9 mars. Fin ce mois-là, une armée autrichienne sous Wilhelm Reinhard von Neipperg a traversé les montagnes de Moravie et soulagé Neisse. Le 10 avril les deux armées se sont rencontrées dans la neige à Mollwitz, près de Brieg. La cavalerie autrichienne a conduit le cheval prussien, et Frederick, poussé par le maréchal de campagne Kurt von Schwerin, est monté du champ ; mais l’infanterie Schwerin occupa et chassait les Autrichiens avec son feu constant. Chaque côté perdit environ 4 500 à 5 000 hommes, et la victoire encouragea la France, la Bavière et la Saxe à se joindre à l’attaque contre l’Autriche."
