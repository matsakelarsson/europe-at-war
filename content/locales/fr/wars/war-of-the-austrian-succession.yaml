"Charles Albert, Elector of Bavaria, who was married to a daughter of the Emperor Joseph I, claimed the Habsburg lands for himself, and France backed him in the hope of breaking Habsburg power for good. Bavarian troops seized Passau at the end of July 1741 and French armies began crossing the Rhine on 15 August. At Linz, taken in September, Charles Albert received homage as Archduke of Austria. Saxony joined the allies, and Spain attacked the Habsburg lands in Italy. On 11 September Maria Theresa appealed for help to the Hungarian Diet at Pressburg, and the nobles voted her troops.": "Charles Albert, électeur de Bavière, marié à une fille de l’empereur Joseph Ier, revendique les terres des Habsbourg pour lui-même et la France le soutient dans l’espoir de briser le pouvoir de Habsburg pour le bien. Les troupes bavaroises s’emparent de Passau à la fin du mois de juillet 1741 et les armées françaises commencent à traverser le Rhin le 15 août. La Saxe rejoint les alliés, et l’Espagne attaque les terres des Habsbourg en Italie. Le 11 septembre Maria Theresa demande de l’aide à la Diète hongroise à Pressburg, et les nobles votent ses troupes."
"In October she bought a secret truce from Frederick at Klein-Schnellendorf by handing over Neisse, and the allies, instead of marching on Vienna, turned north into Bohemia. In late November French, Bavarian and Saxon troops stormed Prague, and on 19 December Charles Albert received homage there as King of Bohemia. On 24 January 1742 the electors chose him as emperor, the first from outside the House of Habsburg in three centuries, and he was crowned at Frankfurt as Charles VII on 12 February. By then an Austrian army under Count Khevenhüller had retaken Linz and overrun Bavaria, and on 13 February it entered Munich.": "En octobre, elle acheta une trêve secrète à Frederick à Klein-Schnellendorf en remettant Neisse, et les alliés, au lieu de marcher sur Vienne, tournèrent le nord en Bohême. Fin novembre, les troupes françaises, bavaroises et saxonnes ont pris Prague, et le 19 décembre Charles Albert y reçut un hommage comme roi de Bohème. Le 24 janvier 1742, les électeurs l’ont choisi comme empereur, le premier de l’extérieur de la Chambre des Habsbourg en trois siècles, et il a été couronné à Francfort en tant que Charles VII le 12 février."
