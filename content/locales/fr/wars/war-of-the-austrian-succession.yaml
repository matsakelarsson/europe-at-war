"1743": "1743"
"War of the Austrian Succession": "Guerre de la Succession autrichienne"
"A European war over the inheritance of Maria Theresa, in which Prussia seized Silesia and France, Bavaria, Spain and Saxony tried to divide the Habsburg lands, while Britain, Hanover, the Dutch Republic and Sardinia supported Austria. It spread to Italy, the Low Countries, the seas and the colonies, and the Treaty of Aix-la-Chapelle in 1748 confirmed Maria Theresa’s inheritance but left Silesia to Prussia.": "Une guerre européenne sur l’héritage de Maria Theresa, dans laquelle la Prusse s’emparait de la Silésie et de la France, de la Bavière, de l’Espagne et de la Saxe tentait de diviser les terres des Habsbourg, tandis que la Grande-Bretagne, Hanovre, la République néerlandaise et la Sardaigne soutenaient l’Autriche. Il s’étendit à l’Italie, aux Pays-Bas, aux mers et aux colonies, et le traité d’Aix-la-Chapelle en 1748 confirma l’héritage de Maria Theresa, mais laissa la Silésie à la Prusse."
"Dates are New Style (Gregorian). Britain still used the Julian calendar, eleven days behind, so British sources of the time date Dettingen 16 June 1743.": "Les dates sont New Style (Gregorian). La Grande-Bretagne utilise toujours le calendrier julien, onze jours de retard, donc les sources britanniques de l’heure datent Dettingen 16 juin 1743."
"The First (1740–1742) and Second (1744–1745) Silesian Wars between Prussia and Austria were part of this war. Saxony fought against Austria in 1741–1742 and on its side in 1744–1745.": "Les premières (1740–1742) et les deuxièmes (1744–1745) guerres silésiennes entre la Prusse et l’Autriche faisaient partie de cette guerre. La Saxe combattit contre l’Autriche en 1741–1742 et de son côté en 1744–1745."
"Places in Silesia, Bohemia and Moravia are named in their German forms of the time; the markers give today’s names.": "Les lieux en Silésie, en Bohême et en Moravie sont nommés dans leurs formes allemandes de l’époque ; les marqueurs donnent aujourd'hui des noms."
"The war in the Low Countries and Italy, at sea and overseas is only outlined here.": "La guerre dans les pays bas et en Italie, en mer et à l’étranger n’est décrite ici que."
