# Some French text was translated automatically.
"War of the Bavarian Succession": "Guerre de la Succession bavaroise"
"A war between Austria and Prussia, allied with Saxony, over Joseph II’s attempt to acquire much of Bavaria when its ruling line died out in 1777. The armies faced each other in Bohemia without fighting a major battle, and the Peace of Teschen in 1779 left Austria only the Innviertel.": "Une guerre entre l’Autriche et la Prusse, alliée à la Saxe, sur Joseph IIs tente d’acquérir une grande partie de la Bavière quand sa ligne dirigeante meurt en 1777. Les armées se affrontent en Bohême sans combattre une bataille majeure, et la Paix de Teschen en 1779 quitte l’Autriche seulement l’Innviertel."
"Known in Prussia and Saxony as the Potato War (Kartoffelkrieg) and in Austria as the Plum Fuss (Zwetschgenrummel).": "Connu en Prusse et en Saxe comme la guerre de la pomme de terre (Kartoffelkrieg) et en Autriche comme le Fusil à prune (Zwetschgenrummel)."
"Places in Bohemia and Silesia are named in their German forms of the time; the markers give today’s names.": "Les lieux en Bohême et en Silésie sont nommés dans leurs formes allemandes de l’époque ; les marqueurs donnent aujourd'hui des noms."
