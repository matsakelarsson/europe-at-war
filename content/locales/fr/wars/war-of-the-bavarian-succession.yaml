"July 1778 – May 1779": "juillet 1778 – mai 1779"
"When Maximilian III Joseph, the last elector of the Bavarian line of the Wittelsbachs, died childless on 30 December 1777, his heir was the Elector Palatine, Charles Theodore. Within days Charles Theodore agreed to hand Lower Bavaria to the Emperor Joseph II, who hoped to round off the Austrian lands, and Austrian troops marched in. Frederick II of Prussia, unwilling to see Austria grow, backed the protests of Charles Theodore’s own heir, Duke Charles August of Zweibrücken, and of Saxony. In early July 1778 he led a Prussian army into Bohemia, while his brother Prince Henry invaded from Saxony with Prussian and Saxon troops.": "Lorsque Maximilien III Joseph, dernier électeur de la lignée bavaroise des Wittelsbach, mourut sans enfant le 30 décembre 1777, son héritier était l’Électeur Palatine, Charles Theodore. En quelques jours, Charles Théodore accepta de remettre la Basse-Bavière à l’empereur Joseph II, qui espérait arrondir les terres autrichiennes, et les troupes autrichiennes marchèrent. Frédéric II de Prusse, peu disposé à voir l’Autriche croître, a soutenu les protestations de Charles Theodore héritier, duc Charles August de Zweibrücken, et de la Saxe. Au début juillet 1778, il a conduit une armée prussienne en Bohême, tandis que son frère le prince Henry envahit de la Saxe avec les troupes prussiennes et saxonnes."
"Joseph II and Field Marshal Franz Moritz von Lacy waited behind redoubts on the heights above the upper Elbe, and Laudon fell back behind the Iser before Prince Henry. Neither side attacked. The armies stripped the countryside bare, and thousands of soldiers died of disease or deserted; the Prussians named the campaign after the potatoes they dug up to eat. The Prussians withdrew in the autumn, and after a winter of raids Maria Theresa, against her son’s wishes, accepted French and Russian mediation. By the Peace of Teschen on 13 May 1779 Austria kept only the Innviertel, a strip along the Inn, and Saxony received six million gulden.": "Joseph II et le maréchal de campagne Franz Moritz von Lacy attendirent derrière eux des doutes sur les hauteurs au-dessus de l’Elbe supérieur, et Laudon retomba derrière l’Iser devant le prince Henry. Ni l’un ni l’autre attaquèrent. Les armées dépouillèrent la campagne, et des milliers de soldats moururent de maladies ou désertèrent ; les Prussiens nommèrent la campagne après les pommes de terre qu’ils déterraient pour manger. Les Prussiens se retiraient à l’automne, et après un hiver de raids Maria Theresa, contre ses désirs fils, acceptèrent la médiation française et russe. Par la paix de Teschen le 13 mai 1779 l’Autriche gardait seulement l’Innviertel, une bande le long de l’Auberge, et la Saxe reçut six millions de goulde."
