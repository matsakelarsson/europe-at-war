# Some French text was translated automatically.
"War of the Burgundian Succession": "Guerre de la succession bourguignonne"
"The war between Louis XI of France and Maximilian of Habsburg over the lands of Charles the Bold, killed at Nancy in January 1477. Louis seized the duchy of Burgundy and Picardy and occupied Franche-Comté and Artois, while Charles’s daughter Mary married Maximilian and kept the Low Countries. Maximilian beat the French at Guinegate on 7 August 1479 but could not follow up his victory. After Mary’s death in a riding accident in 1482, the estates of Flanders forced him to accept the Treaty of Arras, which left the duchy of Burgundy and Picardy to France and promised Artois and Franche-Comté as the dowry of his daughter Margaret, betrothed to the future Charles VIII.": "La guerre entre Louis XI de France et Maximilien de Habsbourg sur les terres de Charles le Bold, tué à Nancy en janvier 1477. Louis s’empare du duché de Bourgogne et de Picardie et occupe Franche-Comté et Artois, tandis que la fille de Charles Mary épouse Maximilian et garde les Pays Bas. Maximilien bat les Français à Guinegate le 7 août 1479 mais ne peut pas suivre sa victoire. Après la mort de Marie dans un accident d’équitation en 1482, les domaines de Flandre l’obligent à accepter le traité d’Arras, qui quitte le duché de Bourgogne et de Picardie en France et promet à Artois et Franche-Comté comme la dot de sa fille Margaret, fiancée au futur Charles VIII."
"Some historians extend the war to 1493. When Charles VIII married Anne of Brittany instead of Margaret, the Treaty of Senlis (1493) returned Artois and Franche-Comté to the Habsburgs.": "Quelques historiens prolongent la guerre jusqu’en 1493. Lorsque Charles VIII épouse Anne de Bretagne au lieu de Margaret, le traité de Senlis (1493) rend Artois et Franche-Comté aux Habsbourg."
