"War of the Castilian Succession": "Guerre de la succession castillane"
"The war for the throne of Castile after the death of Henry IV in 1474, between his half-sister Isabella, married to Ferdinand of Aragon, and his daughter Joanna, called la Beltraneja, backed by her uncle and betrothed, Afonso V of Portugal, and by Louis XI of France. The indecisive battle of Toro in 1476 turned into a political victory for Isabella, while Portugal won the war at sea. By the Treaty of Alcáçovas in 1479 Afonso gave up his claim, Castile kept the Canary Islands and Portugal the rest of the Atlantic islands and the trade of Africa. Ferdinand had become king of Aragon that January, and the two crowns were now joined under the Catholic Monarchs.": "La guerre pour le trône de Castille après la mort d’Henri IV en 1474, entre sa demi-sœur Isabella, mariée à Ferdinand d’Aragon, et sa fille Joanna, appelée la Beltraneja, soutenue par son oncle et fiancée, Afonso V du Portugal, et par Louis XI de France. La bataille indécise de Toro en 1476 s’est transformée en victoire politique pour Isabella, tandis que le Portugal a gagné la guerre en mer. Par le traité d’Alcáçovas en 1479 Afonso a renoncé à sa revendication, Castille a gardé les îles Canaries et le Portugal le reste des îles atlantiques et le commerce de l’Afrique. Ferdinand était devenu roi d’Aragon en janvier, et les deux couronnes étaient maintenant rejointes sous les monarques catholiques."
"Joanna’s enemies claimed that she was not Henry IV’s daughter but that of his favourite, Beltrán de la Cueva, hence the nickname la Beltraneja. Historians still debate it; her supporters called her the Excellent Lady. Some historians prefer the neutral name War of 1475–1479.": "Les ennemis de Joanna affirmèrent qu’elle n’était pas la fille d’Henri IV, mais celle de son préféré, Beltrán de la Cueva, d’où le surnom de la Beltraneja. Les historiens en discutent encore ; ses partisans l’appelaient l’Excellence Dame. Certains historiens préfèrent le nom neutre Guerre de 1475–1479."
"Both sides claimed Toro as a victory, and historians still disagree about who won the battle itself. Dates are Julian.": "Les deux parties ont revendiqué Toro comme une victoire, et les historiens ne sont toujours pas d’accord sur qui a gagné la bataille elle-même."
