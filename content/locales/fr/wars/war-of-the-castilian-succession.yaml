"1476–1479": "1476–1479"
"Louis XI gave Afonso nothing, and in 1478 he made peace with Castile. In Castile Isabella’s troops took the castle of Toro and reduced the remaining nobles of Joanna’s party one by one. The war went on along the frontier and at sea, where Castilian ships challenged Portugal’s hold on the trade of West Africa and the Atlantic islands. In 1478 a Portuguese fleet captured a Castilian fleet trading at the gold coast of Mina, in the Gulf of Guinea. On land, the last Portuguese invasion was beaten at La Albuera, near Badajoz, on 24 February 1479 by the Master of Santiago, Alonso de Cárdenas.": "Louis XI ne donna rien à Afonso et, en 1478, il fit la paix avec la Castille. En Castille Isabella, les troupes prirent le château de Toro et réduisirent un par un les nobles restants du parti Joanna. La guerre se poursuivit le long de la frontière et en mer, où les navires castilliens défièrent le Portugal de s’emparer du commerce de l’Afrique occidentale et des îles atlantiques. En 1478, une flotte portugaise s’empare d’une flotte castillane qui se négocie sur la côte or de Mina, dans le golfe de Guinée. Sur terre, la dernière invasion portugaise a été battue à La Albuera, près de Badajoz, le 24 février 1479 par le maître de Santiago, Alonso de Cárdenas."
"The peace was arranged by Isabella’s aunt, Beatrice, Duchess of Viseu, who was also Afonso’s sister-in-law, in talks at Alcántara, and signed at Alcáçovas on 4 September 1479. Afonso gave up his claim to Castile, and Isabella and Ferdinand theirs to Portugal. Castile kept the Canary Islands; Portugal kept Madeira, the Azores and Cape Verde, the trade and conquest of the African coast and the right to conquer Fez. Joanna had to choose between a convent and a betrothal to Isabella’s infant son. She chose the convent, and lived on in Portugal until 1530, still signing herself “I, the Queen”.": "La paix a été arrangée par la tante d’Isabella, Béatrice, duchesse de Viseu, qui était aussi belle-soeur d’Afonso, dans des pourparlers à Alcántara, et signée à Alcáçovas le 4 septembre 1479. Afonso a renoncé à sa revendication à Castille, et Isabella et Ferdinand à la leur au Portugal. La Castille garda les îles Canaries ; le Portugal conserva Madère, les Açores et le Cap-Vert, le commerce et la conquête de la côte africaine et le droit de conquérir Fez. Joanna dut choisir entre un couvent et une fiancée au fils d’Isabelle. Elle choisit le couvent, et vécut au Portugal jusqu’en 1530, se signant encore ─I, la Reine."
