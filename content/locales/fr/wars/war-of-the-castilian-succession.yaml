"1474–1476": "1474–1476"
"When Henry IV of Castile died in December 1474, his half-sister Isabella had herself proclaimed queen at Segovia. Her rival was Henry’s daughter Joanna, aged twelve. Joanna’s supporters, led by the Marquis of Villena and the Archbishop of Toledo, turned to her uncle, Afonso V of Portugal. He invaded on 10 May 1475, was betrothed to Joanna at Plasencia, where the two were proclaimed king and queen of Castile, and won over Toro and Zamora. In September Louis XI of France allied with him, and the next spring a French army attacked Fuenterrabía in the Basque country but was beaten off.": "Quand Henry IV de Castille mourut en décembre 1474, sa demi-sœur Isabella se fit proclamer reine à Ségovie. Sa rivale était la fille d’Henri Joanna, âgée de douze ans. Les partisans de Joanna, dirigés par le marquis de Villena et l’archevêque de Tolède, se tournèrent vers son oncle, Afonso V du Portugal. Il envahit le 10 mai 1475, fut fiancé à Joanna à Plasencia, où les deux furent proclamés roi et reine de Castille, et remportèrent Toro et Zamora. En septembre Louis XI de France s’alliait avec lui, et au printemps suivant une armée française attaqua Fuenterrabía dans le pays basque mais fut battue."
"Ferdinand gathered an army and in December 1475 won back the town of Zamora, though not its castle. In February 1476 Afonso, reinforced by his son, Prince John, besieged Ferdinand there in vain. On 1 March, as the Portuguese fell back, Ferdinand caught them near Toro, at Peleagonzalo, and they fought in the rain as darkness fell. Ferdinand’s wing broke Afonso’s, while Prince John beat the Castilians facing him and held the field. Both claimed the victory, but Isabella made the most of it. Zamora castle surrendered, nobles came over to her, and in the autumn Afonso sailed for France to beg Louis XI for help.": "En février 1476, Afonso, renforcé par son fils, le prince Jean, y assiégea en vain Ferdinand. Le 1er mars, alors que les Portugais s’écroulaient, Ferdinand les prit près de Toro, à Peleagonzalo, et ils combattirent sous la pluie lorsque l’obscurité tomba. L’aile de Ferdinand a brisé Afonso, tandis que le prince Jean battait les Castiliens face à lui et tenait le champ. Tous deux ont revendiqué la victoire, mais Isabella en a profité. Le château de Zamora s’est rendu, les nobles sont venus vers elle, et à l’automne Afonso a navigué pour la France pour supplier Louis XI pour l’aide."
