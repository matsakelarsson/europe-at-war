# Some French text was translated automatically.
"War of the Eight Saints": "Guerre des Huit Saints"
? "A war between Florence, allied with Bernabò Visconti of Milan, and Pope Gregory XI, whose legates were extending papal rule in central Italy. In 1375 Florence encouraged revolts across the Papal States, and dozens of towns rose against their papal governors. The pope put Florence under interdict in March 1376, exposing its merchants abroad to arrest and seizure of their goods, and sent an army of Breton mercenaries under Cardinal Robert of Geneva; in February 1377 they massacred thousands of the people of Cesena. The war was run in Florence by a committee of eight, called the Eight Saints, and its cost helped bring on the Ciompi revolt of 1378. After Gregory, who had brought the papacy back from Avignon to Rome in 1377, died in March 1378, Catherine of Siena and others worked for peace, and Florence made peace with Pope Urban VI at Tivoli in July 1378, agreeing to pay a large indemnity."
: "Une guerre entre Florence, alliée à Bernabò Visconti de Milan, et le pape Grégoire XI, dont les légats étendaient la domination papale en Italie centrale. En 1375 Florence encourageait les révoltes dans les États pontificaux, et des dizaines de villes s’élevaient contre leurs gouverneurs pontificals. Le pape a interdit Florence en mars 1376, exposant ses marchands à l’étranger pour arrêter et saisir leurs biens, et envoyé une armée de mercenaires bretons sous le cardinal Robert de Genève ; en février 1377 ils ont massacré des milliers de gens de Cesena. La guerre a été menée à Florence par un comité de huit, appelé les Huit Saints, et son coût a contribué à faire venir sur la révolte Ciompi de 1378. Après que Grégoire, qui avait ramené la papauté d’Avignon à Rome en 1377, mourut en mars 1378, Catherine de Sienne et d’autres travaillèrent pour la paix, et Florence fit la paix avec le pape Urbain VI à Tivoli en juillet 1378, acceptant de payer une importante indemnité."
"The English condottiere John Hawkwood fought for the pope at first and was present at Cesena, but went over to Florence in 1377.": "Le condottier anglais John Hawkwood combat au début pour le pape et était présent à Cesena, mais est allé à Florence en 1377."
