# French translations of the catalogue text (wave 13); step bodies follow later.
War of the Golden Stool: Guerre du Tabouret d’or
? The last war between the Asante and the British, also called the Yaa Asantewaa War. After the British occupation of Kumasi in 1896 and the exile of the Asantehene Prempeh I, Asante was ruled by a British resident, and resentment grew over forced labour, taxes and the absence of the king. In March 1900 the governor of the Gold Coast, Sir Frederic Hodgson, told the assembled Asante chiefs in Kumasi that the Golden Stool, the sacred stool that embodies the soul of the Asante nation and on which not even the king sits, should be handed over so that he could sit on it. Led by Yaa Asantewaa, the queen mother of Ejisu, the Asante rose and besieged the British, the governor among them, in the Kumasi fort from April to July. A relief column under Colonel James Willcocks broke through on 15 July, and British columns spent the rest of the year breaking resistance across the country. Yaa Asantewaa was captured in March 1901 and exiled to the Seychelles with other leaders, and on 1 January 1902 Asante was annexed as a British colony. The Golden Stool itself was never found by the British; it remained hidden and is kept in Kumasi today.
: "La dernière guerre entre les Ashanti et les Britanniques, appelée aussi guerre de Yaa Asantewaa. Après l’occupation britannique de Kumasi en 1896 et l’exil de l’Asantehene Prempeh Ier, l’Ashanti était gouverné par un résident britannique, et le ressentiment grandissait contre le travail forcé, les impôts et l’absence du roi. En mars 1900, le gouverneur de la Côte-de-l’Or, sir Frederic Hodgson, déclara aux chefs ashanti réunis à Kumasi que le Tabouret d’or, le siège sacré qui incarne l’âme de la nation ashanti et sur lequel même le roi ne s’assoit pas, devait lui être remis afin qu’il puisse s’y asseoir. Menés par Yaa Asantewaa, reine mère d’Ejisu, les Ashanti se soulevèrent et assiégèrent les Britanniques, gouverneur compris, dans le fort de Kumasi d’avril à juillet. Une colonne de secours commandée par le colonel James Willcocks perça les lignes le 15 juillet, et des colonnes britanniques passèrent le reste de l’année à briser la résistance dans tout le pays. Yaa Asantewaa fut capturée en mars 1901 et exilée aux Seychelles avec d’autres chefs, et le 1er janvier 1902 l’Ashanti fut annexé comme colonie britannique. Les Britanniques ne trouvèrent jamais le Tabouret d’or lui-même : il resta caché et il est aujourd’hui conservé à Kumasi."
