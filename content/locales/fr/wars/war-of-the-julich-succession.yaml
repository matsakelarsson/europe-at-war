"War of the Jülich Succession": "Guerre de Succession de Juliers"
"A war over the inheritance of the united duchies of Jülich, Cleves and Berg on the lower Rhine, claimed by Brandenburg and Palatinate-Neuburg after the last duke died in 1609, which drew in the Emperor, France, the Dutch Republic and Spain. The Treaty of Xanten in 1614 divided the lands, giving the Hohenzollerns of Brandenburg their first territories in western Germany.": "Une guerre sur l’héritage des duchés unis de Jülich, Cleves et Berg sur le Rhin inférieur, revendiquée par Brandebourg et Palatinat-Neuburg après la mort du dernier duc en 1609, qui a attiré dans l’empereur, la France, la République néerlandaise et l’Espagne. Le traité de Xanten en 1614 divise les terres, donnant aux Hohenzollerns de Brandebourg leurs premiers territoires en Allemagne occidentale."
"The two claimants first fought together as the “possessing princes” against the Emperor’s commissioner in 1609–1610, then fell out. In 1614 Spain backed Neuburg and the Dutch backed Brandenburg, though the Spanish and Dutch armies avoided fighting each other during their Twelve Years’ Truce.": "En 1614, l’Espagne soutenait Neuburg et les Hollandais soutenaient Brandebourg, bien que les armées espagnoles et néerlandaise n’aient pas pu se battre les unes contre les autres pendant leur trêve de douze ans."
"Catholic and Protestant territories used different calendars, ten days apart; dates are as usually given. The partition was provisional and was confirmed by the Treaty of Cleves in 1666.": "Les territoires catholiques et protestants utilisaient différents calendriers, dix jours d’intervalle ; les dates sont comme habituellement données. La partition était provisoire et a été confirmée par le traité de Clèves en 1666."
