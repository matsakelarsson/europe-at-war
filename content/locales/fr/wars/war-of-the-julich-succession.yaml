"1609–1614": "1609–1614"
"When the mentally ill Duke John William of Jülich-Cleves-Berg died childless on 25 March 1609, two Lutheran princes claimed his rich lands through his sisters, Elector John Sigismund of Brandenburg and Wolfgang William of Palatinate-Neuburg. On 10 June they agreed at Dortmund to rule jointly, but Emperor Rudolf II sent Archduke Leopold, who took over the fortress of Jülich. France, the Dutch Republic and the Protestant Union backed the claimants. Henry IV of France was preparing to intervene in force when he was assassinated on 14 May 1610, yet Dutch, French, English and Union troops besieged Jülich, which surrendered on 1 September.": "Lorsque le malade mental duc John William de Jülich-Cleves-Berg meurt sans enfant le 25 mars 1609, deux princes luthériens revendiquent ses riches terres par l’intermédiaire de ses sœurs, l’électeur John Sigismund de Brandebourg et Wolfgang Guillaume de Palatinat-Neuburg. Le 10 juin, ils s’accordèrent à Dortmund pour gouverner conjointement, mais l’empereur Rudolf II envoya Archduke Léopold, qui prit la forteresse de Jülich. La France, la République néerlandaise et l’Union protestante soutenaient les demandeurs. Henri IV de France se préparait à intervenir en vigueur lorsqu’il fut assassiné le 14 mai 1610, mais les troupes hollandaises, françaises, anglaises et de l’Union assiégées Jülich, qui se rendirent le 1er septembre."
"The two princes then fell out. In 1613 Wolfgang William became a Catholic and married a sister of Maximilian of Bavaria, and John Sigismund turned Calvinist. In 1614 the Dutch seized Jülich and Wolfgang William took Düsseldorf. Spain’s army under Ambrogio Spinola restored Aachen’s Catholic council in August and took Wesel, while Maurice of Nassau occupied Cleves and Mark. The two armies did not fight, and on 12 November the Treaty of Xanten divided the inheritance, giving Cleves, Mark and Ravensberg to Brandenburg and Jülich and Berg to Neuburg. Spanish and Dutch garrisons stayed on.": "En 1613, Wolfgang William devint catholique et épousa une sœur de Maximilien de Bavière, et John Sigismond devint calviniste. En 1614, les Hollandais s’emparèrent de Jülich et Wolfgang William prit Düsseldorf. L’armée espagnole sous Ambrogio Spinola rétablit le conseil catholique d’Aix-la-Chapelle en août et emmena Wesel, tandis que Maurice de Nassau occupait Cleves et Marc. Les deux armées n’ont pas combattu, et le 12 novembre le traité de Xanten a divisé l’héritage, donnant Cleves, Mark et Ravensberg à Brandenburg et Jülich et Berg à Neuburg."
