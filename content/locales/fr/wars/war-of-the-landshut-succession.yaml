# Some French text was translated automatically.
"War of the Landshut Succession": "Guerre de la succession Landshut"
"A war between two branches of the House of Wittelsbach over the duchy of Bavaria-Landshut, which Duke George the Rich had left at his death in December 1503 to his daughter Elisabeth and her husband Rupert of the Palatinate, against the family’s rule of male succession. Albert IV of Bavaria-Munich, backed by King Maximilian I, the Swabian League, Württemberg, Hesse and Nuremberg, fought the Palatine side in 1504, devastating Lower Bavaria and the Rhenish Palatinate; Maximilian beat a Bohemian mercenary army at Wenzenbach on 12 September 1504. Rupert and Elisabeth both died that year, and Maximilian’s award at the Diet of Cologne on 30 July 1505 gave most of the duchy to Munich, reuniting Bavaria. Their young sons received the new principality of Palatinate-Neuburg, Maximilian took Kufstein, Kitzbühel and Rattenberg for Tyrol, and Nuremberg kept Lauf, Hersbruck and Altdorf.": "Une guerre entre deux branches de la maison de Wittelsbach sur le duché de Bavière-Landshut, que le duc George le Rich avait laissé à sa mort en décembre 1503 à sa fille Elisabeth et son mari Rupert du Palatinat, contre la règle familiale de succession masculine. Albert IV de Bavière-Munich, soutenu par le roi Maximilian Ier, la Ligue souabe, Wurtemberg, Hesse et Nuremberg, a combattu la partie palatine en 1504, la Basse-Bavière dévastatrice et le Palatinat rhénan ; Maximilian a battu une armée mercenaire bohème à Wenzenbach le 12 septembre 1504. Rupert et Elisabeth sont tous deux décédés cette année-là, et le prix Maximilian à la Diète de Cologne, le 30 juillet 1505 a donné la majeure partie du duché à Munich, réunifiant la Bavière. Leurs jeunes fils ont reçu la nouvelle principauté de Palatinat-Neuburg, Maximilian a pris Kufstein, Kitzbühel et Rattenberg pour Tyrol, et Nuremberg a gardé Lauf, Hersbruck et Altdorf."
"Also called the Bavarian War of Succession or the Landshut War. Götz von Berlichingen, fighting for Munich, lost his right hand to a cannon shot before Landshut in July 1504 and afterwards wore the iron hand that made him famous.": "Aussi appelé la guerre de succession bavarois ou la guerre de Landshut. Götz von Berlichingen, combattant pour Munich, a perdu sa main droite à un coup de canon avant Landshut en juillet 1504 et a ensuite porté la main de fer qui le rend célèbre."
"Elisabeth’s side was supported by the Elector Palatine Philip, Rupert’s father, and hired Bohemian troops; the Electoral Palatinate also lost land to Hesse and Württemberg in the peace.": "Elisabeth était soutenue par l’électeur Palatine Philip, père de Rupert, et engageait des troupes bohèmes ; le Palatinat électoral perdait également des terres à Hesse et Wurtemberg dans la paix."
