# Some French text was translated automatically.
"War of the Limburg Succession": "Guerre de la Succession du Limbourg"
"A war for the Duchy of Limburg, between the Meuse and Aachen, after its heiress Ermengarde died childless in 1283. Her widower, Count Reginald I of Guelders, kept the duchy with the backing of the Archbishop of Cologne, Siegfried of Westerburg, and Count Henry VI of Luxembourg, while Duke John I of Brabant bought the rival claim of the Count of Berg and allied with Berg, Mark, Loon and the townspeople of Cologne. At Worringen, north of Cologne, on 5 June 1288 John won a large and bloody battle; Henry of Luxembourg and two of his brothers were killed, and both the archbishop and Reginald were captured. Limburg passed to Brabant, and the city of Cologne was freed from its archbishop’s rule.": "Une guerre pour le duché de Limbourg, entre la Meuse et Aachen, après que sa héritière Ermengarde est morte sans enfant en 1283. Son veuf, le comte Reginald Ier de Guelders, garda le duché avec l’appui de l’archevêque de Cologne, Siegfried de Westerburg, et le comte Henry VI de Luxembourg, tandis que le duc Jean Ier de Brabant achetait la revendication rivale du comte de Berg et allié avec Berg, Mark, Loon et les habitants de Cologne. À Worringen, au nord de Cologne, le 5 juin 1288, John remporte une grande bataille sanglante ; Henry du Luxembourg et deux de ses frères sont tués, et l’archevêque et Reginald sont capturés. Limburg passe à Brabant, et la ville de Cologne est libérée de son archevêque."
"The last duke, Waleran IV, died in 1279 or 1280; his daughter Ermengarde followed in 1283. Shortly before Worringen, Reginald of Guelders sold his own claim to Henry of Luxembourg.": "Le dernier duc, Waleran IV, mourut en 1279 ou 1280 ; sa fille Ermengarde suivit en 1283. Peu avant Worringen, Reginald de Guelders vendit sa propre réclamation à Henry du Luxembourg."
"After the battle Archbishop Siegfried was held for over a year at Schloss Burg by the Count of Berg, who gave Düsseldorf its town charter that August. The city of Cologne was formally recognised as a free imperial city only in 1475.": "Après la bataille, l’archevêque Siegfried a été détenu pendant plus d’un an à Schloss Burg par le comte de Berg, qui a donné à Düsseldorf sa charte de ville en août. La ville de Cologne a été officiellement reconnue comme une ville impériale libre seulement en 1475."
