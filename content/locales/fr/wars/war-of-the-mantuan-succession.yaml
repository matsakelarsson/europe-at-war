"1628–1629": "1628–1629"
"Vincenzo II Gonzaga died on 26 December 1627, three days after his niece Maria, heiress of Montferrat, had married the son of his cousin Charles Gonzaga, Duke of Nevers, a French peer. Nevers took over in Mantua in January 1628. The Spanish governor of Milan, Gonzalo Fernández de Córdoba, had already agreed with Charles Emmanuel I of Savoy to share Montferrat. The emperor had placed both duchies under sequestration until he decided the succession, but in March Córdoba laid siege to Casale, one of the strongest fortresses in Europe, and the Savoyards took Trino and Nizza Monferrato.": "Vincenzo II Gonzaga mourut le 26 décembre 1627, trois jours après que sa nièce Maria, héritière de Montferrat, eut épousé le fils de son cousin Charles Gonzaga, duc de Nevers, un pair français. Nevers prit la relève à Mantoue en janvier 1628. Le gouverneur espagnol de Milan, Gonzalo Fernández de Cordoue, avait déjà convenu avec Charles Emmanuel Ier de Savoie de partager Montferrat. L’empereur avait placé les deux duches sous séquestration jusqu’à ce qu’il décide de la succession, mais en mars Córdoba a posé siège à Casale, l’une des forteresses les plus fortes d’Europe, et les Savoyards ont pris Trino et Nizza Monferrato."
"Casale held out through the year, defended by Nevers’ troops with French volunteers, and a relief force Nevers raised in France was destroyed by the Savoyards in the Alps. Once the Huguenot stronghold of La Rochelle had surrendered in October 1628, France could act. In March 1629 Louis XIII and Cardinal Richelieu brought an army over the Montgenèvre and on 6 March stormed the barricades the Savoyards had built across the Pass of Susa. Charles Emmanuel came to terms at once, the Spanish lifted the siege of Casale, and French troops moved into Susa and Casale.": "Casale se déroula tout au long de l’année, défendue par les troupes de Nevers avec des volontaires français, et une force de secours de Nevers élevée en France fut détruite par les Savoyards dans les Alpes. Une fois le bastion Huguenot de La Rochelle livré en octobre 1628, la France pouvait agir. En mars 1629, Louis XIII et le cardinal Richelieu apportèrent une armée au-dessus de Montgenèvre et, le 6 mars, les barricades que les Savoyards avaient construites en travers du col de Susa. Charles Emmanuel prit fin immédiatement, les Espagnols lèvent le siège de Casale, et les troupes françaises s’installent à Susa et Casale."
