# Some French text was translated automatically.
"War of the Mantuan Succession": "Guerre de Succession de Mantoue"
"A war over the succession to Mantua and Montferrat after the last Gonzaga duke of the main line died in December 1627. France backed his heir, the French-born Duke of Nevers, while Spain, Savoy and the emperor tried to keep him out; the fighting, a side theatre of the Thirty Years’ War, centred on the fortress of Casale and ended with Nevers confirmed as duke and France holding Pinerolo.": "Une guerre sur la succession à Mantua et Montferrat après la dernière Gonzaga duc de la ligne principale est morte en décembre 1627. La France a soutenu son héritier, le duc français de Nevers, tandis que l’Espagne, Savoy et l’empereur essayaient de l’empêcher ; les combats, un théâtre parallèle de la guerre de Trente Ans, centrés sur la forteresse de Casale et se sont terminés avec Nevers confirmés comme duc et la France tenant Pinerolo."
"Dates are Gregorian. Savoy fought with Spain in 1628, made peace with France at Susa in March 1629, and joined Spain again late that year.": "Dates sont grégorien. Savoy a combattu avec l’Espagne en 1628, fait la paix avec la France à Susa en mars 1629, et rejoint l’Espagne à nouveau tard cette année-là."
"Plague, brought by the armies, killed perhaps a third of the people of northern Italy in 1629–1631; Milan and Venice lost about half their inhabitants. The epidemic is the background of Alessandro Manzoni’s novel The Betrothed.": "Plague, apportée par les armées, tua peut-être un tiers des habitants du nord de l’Italie en 1629–1631 ; Milan et Venise perdirent environ la moitié de leurs habitants. L’épidémie est le fond du roman d’Alessandro Manzoni."
"Wikipedia’s article dates the French capture of Pinerolo to March 1629; it fell to Richelieu’s army on 29 March 1630.": "L’article de Wikipédia date de la capture française de Pinerolo en mars 1629 ; il tombe à l’armée de Richelieu le 29 mars 1630."
