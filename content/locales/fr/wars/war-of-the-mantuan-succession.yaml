"1629–1631": "1629–1631"
"Spain sent Ambrogio Spinola to try again, and Emperor Ferdinand II, now free of his war with Denmark, sent an army from Germany under Count Collalto. Spinola besieged Casale again, Savoy rejoined Spain, and the imperial army besieged Mantua from late 1629. A French army under Montmorency overran Savoy, and in March 1630 Richelieu took Pinerolo, the key to the western Alps. Plague came with the armies and killed perhaps a third of the people of northern Italy. The war grew savage. In April 1630, at Ostiglia, imperial soldiers killed about 600 villagers, women and children among them, in revenge for an attack by local bandits.": "L’Espagne a envoyé Ambrogio Spinola pour essayer à nouveau, et l’empereur Ferdinand II, maintenant libre de sa guerre avec le Danemark, a envoyé une armée d’Allemagne sous le comte Collalto. Spinola assiégea de nouveau Casale, Savoy rejoint l’Espagne, et l’armée impériale assiégé Mantua de la fin 1629. Une armée française sous Montmorency overran Savoy, et en mars 1630 Richelieu prit Pinerolo, la clé des Alpes occidentales. Plague vint avec les armées et tua peut-être un tiers de la population du nord de l’Italie. La guerre devint sauvage. En avril 1630, à Ostiglia, des soldats impériaux tuèrent environ 600 villageois, femmes et enfants parmi eux, pour se venger d’une attaque de bandits locaux."
"On 29 May 1630 the imperialists routed a Venetian relief army at Villabuona, and on 18 July they stormed Mantua, whose garrison plague had cut to about 700 fit men. The city and the Gonzaga collections were plundered for three days. Casale held out, and in late October, as a French relief army arrived, the papal envoy Giulio Mazarin rode between the lines to arrange a truce. Ferdinand, now facing Gustavus Adolphus of Sweden in Germany, made peace at Cherasco on 6 April and 19 June 1631. Nevers kept Mantua and Montferrat, Savoy gained Trino and Alba, and by a secret agreement Savoy let France keep Pinerolo, which it held until 1696.": "Le 29 mai 1630, les impérialistes acheminèrent une armée de secours vénitienne à Villabuona et, le 18 juillet, ils s’emparèrent de Mantoue, dont la peste de garnison avait réduit à environ 700 hommes. La ville et les collections de Gonzaga furent pillées pendant trois jours. Casale se tint, et fin octobre, alors qu’une armée de secours française arrivait, l’envoyé papale Giulio Mazarin roulait entre les lignes pour organiser une trêve. Ferdinand, aujourd'hui face à Gustavus Adolphus de Suède en Allemagne, fit la paix à Cherasco le 6 avril et le 19 juin 1631. Nevers garda Mantua et Montferrat, Savoie gagna Trino et Alba, et par un accord secret Savoy laissa la France garder Pinerolo, qu’elle conserva jusqu’en 1696."
