# Some French text was translated automatically.
"War of the Montferrat Succession": "Guerre de Succession du Montferrat"
? "A war between Charles Emmanuel I of Savoy and Spain over Montferrat, the Gonzaga dukes of Mantua’s duchy in Piedmont. When Duke Francesco IV of Mantua died in December 1612 leaving a daughter, Charles Emmanuel, her grandfather, claimed Montferrat for her and invaded it in April 1613, taking Trino, Alba and Moncalvo. Spain, ruling Milan and anxious about the fortress of Casale on the road between Milan and Genoa, backed Francesco’s brother Ferdinando and drove the Savoyards out. In 1614–1615 the governor of Milan, the Marquis of Hinojosa, invaded Piedmont, until French mediation brought the Peace of Asti in June 1615. Spain disowned it, and in 1616–1617 Savoy fought on with Venetian money, help from the French governor of Dauphiné, Lesdiguières, and German mercenaries under Ernst von Mansfeld. The new governor of Milan, Pedro de Toledo, took Vercelli in July 1617. Treaties at Madrid in September and Pavia in October 1617 restored all conquests, and Ferdinando kept Montferrat. The question came back ten years later in the War of the Mantuan Succession."
: "Une guerre entre Charles Emmanuel Ier de Savoie et l’Espagne sur Montferrat, les ducs de Gonzaga de Mantoue au Piémont. Lorsque le duc Francesco IV de Mantua est mort en décembre 1612 laissant une fille, Charles Emmanuel, son grand-père, a réclamé Montferrat pour elle et l’a envahi en avril 1613, prenant Trino, Alba et Moncalvo. En 1614–1615, le gouverneur de Milan, le marquis d’Hinojosa, envahit le Piémont, jusqu’à ce que la médiation française amène la Paix d’Asti en juin 1615. En 1616–1617, l’Espagne la renonça et, en 1616–1617, Savoy combattit avec de l’argent vénitien, l’aide du gouverneur français de Dauphiné, des Dassiguières et des mercenaires allemands sous le commandement d’Ernst von Mansfeld. Le nouveau gouverneur de Milan, Pedro de Toledo, prit Vercelli en juillet 1617. La question est revenue dix ans plus tard dans la guerre de la Succession Mantuan."
