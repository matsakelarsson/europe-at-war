"1435–1438": "1435–1438"
"Queen Joanna II of Naples, the last of her line, had adopted first Alfonso V of Aragon, King of Sicily, and then Louis III of Anjou as her heir. When she died on 2 February 1435 Louis was already dead, and her will named his brother René of Anjou. René was a prisoner of the Duke of Burgundy, so his wife Isabella of Lorraine came to Naples to rule for him, while Alfonso, who had never given up his claim, besieged Gaeta. Pope Eugenius IV claimed the right to decide as the kingdom’s overlord, and Filippo Maria Visconti of Milan, then master of Genoa, backed the Angevins.": "La reine Joanna II de Naples, la dernière de sa lignée, avait adopté d’abord Alfonso V d’Aragon, roi de Sicile, puis Louis III d’Anjou comme héritier. Quand elle est morte le 2 février 1435 Louis était déjà mort, et son testament a nommé son frère René d’Anjou. René était prisonnier du duc de Bourgogne, de sorte que sa femme Isabella de Lorraine vint à Naples pour gouverner pour lui, tandis qu’Alfonso, qui n’avait jamais renoncé à sa revendication, assiégea Gaeta. Le pape Eugenius IV revendiqua le droit de décider comme le royaume Overlord, et Filippo Maria Visconti de Milan, alors maître de Gênes, appuya les Angevins."
"On 5 August 1435 a Genoese fleet sent to relieve Gaeta met Alfonso’s larger fleet off the island of Ponza and routed it, capturing Alfonso, two of his brothers and many nobles. They were taken to Milan, but Alfonso persuaded Filippo Maria that a French king in Naples would threaten Milan more than he would, and in October he was freed as the duke’s ally. Genoa, furious, threw off Milanese rule at the end of the year. The Aragonese took Gaeta, which became Alfonso’s base; René, ransomed, reached Naples only in May 1438.": "Le 5 août 1435, une flotte génoise envoyée pour soulager Gaeta rencontra une flotte plus grande d’Alfonso. Elle l’envoya prendre Alfonso, deux de ses frères et plusieurs nobles. Ils furent emmenés à Milan, mais Alfonso convainquit Filippo Maria qu’un roi français de Naples menacerait Milan plus qu’il ne le ferait, et en octobre il fut libéré comme allié du duc. Gênes, furieux, jeta la règle milanaise à la fin de l’année. L’Aragonais prit Gaeta, qui devint la base d’Alfonso ; René, racheté, n’arriva à Naples qu’en mai 1438."
