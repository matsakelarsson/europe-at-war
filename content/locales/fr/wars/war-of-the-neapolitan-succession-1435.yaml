"War of the Neapolitan Succession, 1435–1442": "Guerre de la Succession napolitaine, 1435-1442"
"The war for the Kingdom of Naples after the death of Queen Joanna II, between her heir René of Anjou and Alfonso V of Aragon, King of Sicily. Captured by the Genoese at Ponza in 1435, Alfonso won over his captor, the Duke of Milan, and slowly conquered the kingdom; he took Naples in June 1442, and the pope recognised him as king in 1443.": "La guerre pour le Royaume de Naples après la mort de la reine Joanna II, entre son héritier René d’Anjou et Alfonso V d’Aragon, roi de Sicile. Capturé par les Génois à Ponza en 1435, Alfonso a gagné sur son capteur, le duc de Milan, et a lentement conquis le royaume ; il a pris Naples en juin 1442, et le pape l’a reconnu comme roi en 1443."
"Alfonso V of Aragon is Alfonso I of Naples. The Kingdom of Naples is shown as one polity throughout; in 1442 it passed from René of Anjou to Alfonso, who ruled it alongside Aragon, Sicily and Sardinia until his death in 1458.": "Alfonso V d’Aragon est Alfonso I de Naples. Le royaume de Naples est montré comme une seule politique dans tout ; en 1442 il passa de René d’Anjou à Alfonso, qui l’a gouverné aux côtés d’Aragon, Sicile et Sardaigne jusqu’à sa mort en 1458."
"Milan and Genoa began the war on the Angevin side. After Ponza the Duke of Milan made peace with Alfonso, and Genoa, rebelling against Milan, kept up the war against him.": "Milan et Gênes commencèrent la guerre du côté d’Angevin. Après Ponza le duc de Milan fit la paix avec Alfonso, et Gênes, se rebellant contre Milan, poursuivit la guerre contre lui."
