"1438–1443": "1438–1443"
"The war became a slow struggle for castles and barons across the kingdom. René had the pope’s support and the services of Giacomo Caldora, the strongest of the kingdom’s captains, and Genoa sent him galleys, but he was always short of money. Alfonso’s brother Peter was killed by a cannon ball during a siege of Naples in October 1438, and the Aragonese garrison of the Castel Nuovo surrendered to René in 1439. But Caldora died that year, his son was a weaker ally, and Alfonso took one stronghold after another, Benevento in 1441, until he could close in on Naples itself.": "La guerre devint une lutte lente pour les châteaux et les barons à travers le royaume. René eut le soutien du pape et les services de Giacomo Caldora, le plus fort des capitaines du royaume, et Gênes lui envoya des galères, mais il fut toujours à court d’argent. Le frère d’Alfonso, Pierre, a été tué par une balle de canon lors du siège de Naples en octobre 1438, et la garnison aragonaise du Castel Nuovo s’est rendue à René en 1439. Mais Caldora est mort cette année-là, son fils était un allié plus faible, et Alfonso a pris une forteresse après l’autre, Benevento en 1441, jusqu’à ce qu’il puisse fermer sur Naples elle-même."
"On 2 June 1442 Aragonese soldiers entered the city through a disused aqueduct, as Belisarius’s men had done nine centuries earlier, and Naples fell. René escaped by sea and went back to Provence. On 26 February 1443 Alfonso entered Naples in a triumph in the Roman style, later commemorated by the marble arch of the Castel Nuovo, and on 14 June 1443, at Terracina, Eugenius IV recognised him as king and his illegitimate son Ferdinand as his heir. Naples became Alfonso’s capital. On his death in 1458 it went to Ferdinand, and Aragon and Sicily to his brother John.": "Le 2 juin 1442, des soldats aragonais entrèrent dans la ville par un aqueduc désaffecté, comme les hommes de Belisarius avaient fait neuf siècles plus tôt, et Naples tomba. René s’échappa par la mer et retourna en Provence. Le 26 février 1443, Alfonso entre à Naples dans un triomphe de style romain, commémoré plus tard par l’arche en marbre du Castel Nuovo, et le 14 juin 1443, à Terracina, Eugenius IV le reconnaît comme roi et son fils illégitime Ferdinand comme héritier. Naples devient la capitale d’Alfonso. À sa mort en 1458, il se rend à Ferdinand, et Aragon et Sicile à son frère Jean."
