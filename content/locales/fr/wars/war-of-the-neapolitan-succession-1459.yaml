# Some French text was translated automatically.
"War of the Neapolitan Succession, 1459–1464": "Guerre de la Succession napolitaine, 1459-1464"
"The war for the Kingdom of Naples after the death of Alfonso V of Aragon in 1458, who left it to his illegitimate son Ferdinand (Ferrante). Many barons, led by the Prince of Taranto, Giovanni Antonio Orsini del Balzo, rose against him and called in John of Anjou, son of René, who landed in October 1459 with help from French-ruled Genoa. On 7 July 1460 the Angevins and rebels beat Ferdinand near Sarno, and the condottiere Jacopo Piccinino overran the Abruzzi for them. Ferdinand held on with help from Pope Pius II, Francesco Sforza of Milan and the Albanian leader Skanderbeg, who crossed the Adriatic with troops in 1461, and on 18 August 1462 he and Alessandro Sforza routed John and Piccinino at Troia in Apulia. The Prince of Taranto made peace, other barons followed, and in 1464 John left the kingdom; Angevin holdouts on Ischia were beaten at sea in 1465.": "La guerre pour le Royaume de Naples après la mort d’Alfonso V d’Aragon en 1458, qui l’a laissé à son fils illégitime Ferdinand (Ferrante). Beaucoup de barons, conduits par le prince de Tarente, Giovanni Antonio Orsini del Balzo, se sont levés contre lui et ont appelé à Jean d’Anjou, fils de René, qui a débarqué en octobre 1459 avec l’aide de Gênes gouvernée par les Français. Le 7 juillet 1460, les Angevins et les rebelles ont battu Ferdinand près de Sarno, et le condottiere Jacopo Piccinino a envahi les Abruzzes pour eux. Ferdinand a continué avec l’aide du pape Pie II, Francesco Sforza de Milan et le leader albanais Skanderbeg, qui a traversé l’Adriatique avec des troupes en 1461, et le 18 août 1462, lui et Alessandro Sforza ont conduit John et Piccinino à Troia dans les Pouilles. Le prince de Tarente fit la paix, d’autres barons suivirent, et en 1464 Jean quitta le royaume ; Angevin battit les caleçons sur Ischia en 1465."
"Italian historians often call the barons’ revolt of 1459–1462 the first conspiracy of the barons, to distinguish it from that of 1485–1486. Genoa was under French rule from 1458 until it rebelled in 1461.": "Les historiens italiens appellent souvent la révolte des barons de 1459–1462 la première conspiration des barons, pour la distinguer de celle de 1485–1486. Gênes était sous le régime français de 1458 jusqu’à ce qu’il se rebellât en 1461."
