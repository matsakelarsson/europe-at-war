# Some French text was translated automatically.
"War of the Oranges": "Guerre des Oranges"
"A brief war in 1801 in which Spain, urged on by Napoleon, invaded Portugal to force it to break with Britain. Olivenza and Juromenha surrendered at once and Campo Maior after a siege, but Elvas held out, and by the Treaty of Badajoz Portugal closed its ports to British ships, paid an indemnity and ceded Olivenza to Spain.": "Une brève guerre en 1801, au cours de laquelle l’Espagne, pressée par Napoléon, envahit le Portugal pour la forcer à rompre avec la Grande-Bretagne. Olivenza et Juromena se rendirent immédiatement et Campo Maior après un siège, mais Elvas s’empara, et par le traité de Badajoz Portugal ferma ses ports aux navires britanniques, paya une indemnité et ceda Olivenza à l’Espagne."
"The fighting lasted less than three weeks. The name comes from the oranges Godoy picked under the walls of Elvas and sent to Queen Maria Luisa.": "Les combats durent moins de trois semaines. Le nom vient des oranges Godoy cueillies sous les murs d’Elvas et envoyées à la reine Maria Luisa."
"Portugal later declared the Treaty of Badajoz void, and has never formally recognised Spanish sovereignty over Olivenza (Olivença in Portuguese).": "Le Portugal a par la suite déclaré le traité de Badajoz nul et n’a jamais officiellement reconnu la souveraineté espagnole sur Olivenza (Olivença en portugais)."
