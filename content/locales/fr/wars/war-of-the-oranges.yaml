"May – June 1801": "mai – juin 1801"
"In 1800 and 1801 Napoleon, then First Consul, and Manuel Godoy, the chief minister of Charles IV of Spain, demanded that Portugal, Britain’s last ally on the Continent, break its alliance and close its ports to British ships. Portugal refused. At dawn on 20 May 1801 Godoy’s Spanish army of Extremadura crossed the border on the Guadiana. Olivenza and nearby Juromenha, their walls unfinished and held by a few hundred men, mostly militia, surrendered at once. The garrison of Campo Maior held two Spanish divisions for 17 days, and at Elvas the Portuguese threw back Godoy’s assault.": "En 1800 et 1801 Napoléon, puis Premier Consul, et Manuel Godoy, le ministre en chef de Charles IV d’Espagne, exige que le Portugal, la Grande-Bretagne, dernier allié sur le continent, rompent son alliance et ferment ses ports aux navires britanniques. Le Portugal refuse. À l’aube le 20 mai 1801 Godoy est l’armée espagnole d’Estrémadure qui franchit la frontière sur la Guadiana. Olivenza et Juromena, leurs murs inachevés et tenus par quelques centaines d’hommes, principalement des milices, se sont rendus à la fois. La garnison de Campo Maior a tenu deux divisions espagnoles pendant 17 jours, et à Elvas les Portugais ont repoussé l’assaut Godoy."
"The war then stalled, with the Spanish tied down in sieges and a French corps waiting in Spain. Godoy picked oranges outside Elvas and sent them to Queen Maria Luisa, with word that he would go on to Lisbon. Portugal, with no help from Britain, gave way. By the Treaty of Badajoz of 6 June it agreed to close its ports to the British, give trade concessions to France and pay an indemnity, and it ceded Olivenza and its district east of the Guadiana; Spain returned the other towns it had taken. Napoleon, who wanted more, imposed a harsher Treaty of Madrid on 29 September. Meanwhile in South America the Portuguese seized the Spanish missions east of the Uruguay River, and kept them.": "La guerre s’est alors arrêtée, les Espagnols étant liés par des sièges et un corps français attendant en Espagne. Godoy a choisi des oranges à l’extérieur d’Elvas et les a envoyés à la reine Maria Luisa, avec le mot qu’il allait aller à Lisbonne. Le Portugal, sans l’aide de la Grande-Bretagne, a cédé la place. Par le traité de Badajoz du 6 juin, il a accepté de fermer ses ports aux Britanniques, de donner des concessions commerciales à la France et de payer une indemnité, et il a cédé Olivenza et son district à l’est de la Guadiana ; l’Espagne a rendu les autres villes qu’elle avait prises. Napoléon, qui en voulait plus, a imposé un traité de Madrid plus sévère le 29 septembre."
