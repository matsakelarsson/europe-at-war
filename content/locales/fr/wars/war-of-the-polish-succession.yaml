# Some French text was translated automatically.
"War of the Polish Succession": "Guerre de la Succession polonaise"
"After Augustus II died in 1733, most of the Polish nobility elected Stanisław Leszczyński with French backing, while Russia and Austria put Augustus III of Saxony on the throne. Russian troops took Danzig, where Stanisław had taken refuge, in 1734, and the war between France, Spain and Sardinia and the Emperor was fought mostly in the Rhineland and Italy. The peace agreed at Vienna in 1735 left Augustus III king of Poland and gave Stanisław the Duchy of Lorraine for life.": "Après la mort d’Auguste II en 1733, la plupart de la noblesse polonaise a élu Stanisław Leszczyński avec le soutien des Français, tandis que la Russie et l’Autriche ont mis Auguste III de Saxe sur le trône. Les troupes russes ont pris Danzig, où Stanisław s’était réfugié, en 1734, et la guerre entre la France, l’Espagne et la Sardaigne et l’empereur a été principalement combattu dans la Rhénanie et l’Italie. La paix convenue à Vienne en 1735 quitta Augustus III roi de Pologne et donna à vie Stanisław le duché de Lorraine."
"The preliminary peace of 1735 was confirmed in the Treaty of Vienna in 1738.": "La paix préliminaire de 1735 a été confirmée par le Traité de Vienne en 1738."
