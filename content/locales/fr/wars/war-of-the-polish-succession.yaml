"The Peace of Vienna": "La paix de Vienne"
"1735–1738": "1735–1738"
"By 1735 Austria, with no help from Britain or the Dutch Republic, had lost almost all its Italian lands except Mantua, and a Russian corps sent to help it reached the Rhine too late to fight. Preliminaries of peace were agreed at Vienna on 3 October 1735, and after long negotiations the Treaty of Vienna was signed on 18 November 1738. Augustus III kept Poland. Stanisław gave up the crown and received the duchies of Lorraine and Bar for life, after which they were to pass to France, as they did when he died in 1766. Lorraine’s own duke, Francis Stephen, who married Maria Theresa in 1736, received Tuscany instead when the last Medici grand duke died in 1737.": "En 1735, l’Autriche, sans aucune aide de la Grande-Bretagne ni de la République néerlandaise, avait perdu presque toutes ses terres italiennes à l’exception de Mantoue, et un corps russe envoyé pour l’aider à atteindre le Rhin trop tard pour se battre. Les préliminaires de paix ont été convenus à Vienne le 3 octobre 1735, et après de longues négociations le traité de Vienne a été signé le 18 novembre 1738. Augustus III garda la Pologne. Stanisław abandonna la couronne et reçut à vie les duchés de Lorraine et de Bar, après quoi ils passèrent en France, comme ils l’ont fait lorsqu’il mourut en 1766. Le duc de Lorraine, Francis Stephen, qui épousa Maria Theresa en 1736, reçut plutôt la Toscane lorsque le dernier grand-duc de Médicis mourut en 1737."
"Don Carlos was recognised as king of Naples and Sicily, and gave up Parma and Piacenza to the Emperor, though he took the Farnese art collections to Naples with him. Charles Emmanuel of Sardinia gained Novara and Tortona from the Duchy of Milan, which returned to Austria. France also recognised the Pragmatic Sanction, the law by which Charles VI wanted his daughter Maria Theresa to inherit all his lands. When he died in 1740, that promise did not hold.": "Don Carlos est reconnu comme roi de Naples et de Sicile, et abandonne Parma et Piacenza à l’empereur, bien qu’il emmène les collections d’art des Farnèses à Naples avec lui. Charles Emmanuel de Sardaigne obtient Novara et Tortona du Duché de Milan, qui revient en Autriche. La France reconnaît également la Sanction pragmatique, loi par laquelle Charles VI veut que sa fille Maria Theresa hérite de toutes ses terres. Lorsqu'il mourut en 1740, cette promesse ne tenait pas."
