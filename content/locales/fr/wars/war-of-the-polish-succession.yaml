"Bitonto, Parma and Guastalla": "Bitonto, Parma et Guastalla"
"November 1733 – July 1735": "novembre 1733 – juillet 1735"
"In Italy the Austrians were caught unprepared. In the autumn of 1733 a French and Sardinian army under Charles Emmanuel and the aged Marshal Villars overran the Duchy of Milan, and only the fortress of Mantua held out. In 1734 the Austrians under Count Mercy came back over the Alps and pressed the allies back to Parma, but on 29 June Mercy was killed attacking their lines outside the city, at San Pietro or La Crocetta, in a battle that cost both sides heavily. On 19 September his successor, Count Königsegg, attacked the allies again at Guastalla on the Po and was beaten, and the Austrians fell back on Mantua and the Tyrol.": "En Italie, les Autrichiens ne furent pas préparés. À l’automne de 1733, une armée française et sarde sous Charles Emmanuel et le vieux maréchal Villars envahirent le duché de Milan, et seule la forteresse de Mantua tenait. En 1734, les Autrichiens sous le comte Mercy revinrent sur les Alpes et pressèrent les alliés de nouveau à Parme, mais le 29 juin, Mercy fut tué en attaquant leurs lignes en dehors de la ville, à San Pietro ou La Crocetta, dans une bataille qui coûta beaucoup aux deux camps. Le 19 septembre, son successeur, le comte Königsegg, attaqua de nouveau les alliés à Guastalla sur le Po et fut battu, et les Autrichiens retombèrent sur Mantoue et le Tyrol."
"Meanwhile Elisabeth Farnese’s son Don Carlos, Duke of Parma since 1731, led a Spanish army of some 21,000 men south through the Papal States to claim Naples. He entered the city in May 1734, and on 25 May the Count of Montemar beat the outnumbered Austrians at Bitonto in Apulia. Gaeta fell in August and Capua in November, and Spanish troops crossed to Sicily, where the last Austrian fortresses fell in 1735. Philip V gave his son both kingdoms, and Carlos was crowned king of Sicily at Palermo on 3 July 1735. For the first time in more than two centuries Naples had a king who lived there.": "Entre-temps Elisabeth Farnese, fils de Don Carlos, duc de Parme depuis 1731, conduisit une armée espagnole d’environ 21 000 hommes au sud à travers les États pontificaux pour réclamer Naples. Il entra dans la ville en mai 1734, et le 25 mai le comte de Montemar battit les Autrichiens plus nombreux à Bitonto dans les Pouilles. Gaeta tomba en août et Capua en novembre, et les troupes espagnoles passèrent en Sicile, où les dernières forteresses autrichiennes tombèrent en 1735. Philippe V donna à son fils les deux royaumes, et Carlos fut couronné roi de Sicile à Palerme le 3 juillet 1735."
