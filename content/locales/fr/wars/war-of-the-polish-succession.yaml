"Danzig and Philippsburg": "Danzig et Philippsburg"
"February 1733 – July 1734": "février 1733 – juillet 1734"
"When Augustus II, king of Poland and elector of Saxony, died on 1 February 1733, the Polish nobles gathered near Warsaw elected Stanisław Leszczyński, who had been king under Swedish protection in 1704–1709 and whose daughter was married to Louis XV. Russia and Austria backed Augustus’s son, Frederick Augustus of Saxony; a Russian army crossed the border, and on 5 October a minority of nobles under its protection elected him Augustus III. Stanisław took refuge in Danzig, which Russian troops under Field Marshal Münnich, later joined by the Saxons, besieged from February 1734. A French force of about 2,000 men landed at the mouth of the Vistula in May but had to surrender, and the city capitulated at the end of June. Stanisław had escaped days before, disguised as a peasant.": "Quand Augustus II, roi de Pologne et électeur de Saxe, mourut le 1er février 1733, les nobles polonais se rassemblèrent près de Varsovie pour élire Stanisław Leszczyński, qui avait été roi sous protection suédoise en 1704–1709 et dont la fille était mariée à Louis XV. La Russie et l’Autriche ont soutenu Augustus, le fils de Frederick Augustus de Saxe ; une armée russe a traversé la frontière, et le 5 octobre une minorité de nobles sous sa protection l’a élu Augustus III. Stanisław s’est réfugié à Danzig, que les troupes russes sous le maréchal Münnich, plus tard rejoint par les Saxons, assiégé à partir de février 1734. Une force française d’environ 2 000 hommes débarqua à l’embouchure de la Vistule en mai mais dut se rendre, et la ville capitula fin juin. Stanisław s’était échappé quelques jours auparavant, déguisé en paysan."
"France declared war on the Emperor Charles VI on 10 October 1733, allied with Spain and with Charles Emmanuel III of Sardinia, who was promised Milan. A French army crossed the Rhine and took Kehl at the end of October, and in 1734 it besieged Philippsburg. Prince Eugene, now seventy, could not gather an army strong enough to relieve it. The French commander, the Duke of Berwick, was killed by a cannonball in the trenches on 12 June, but the fortress surrendered on 18 July. After that the Rhine saw little fighting, and the war was decided in Italy.": "La France déclara la guerre à l’empereur Charles VI le 10 octobre 1733, allié avec l’Espagne et avec Charles Emmanuel III de Sardaigne, promis à Milan. Une armée française traversa le Rhin et prit Kehl à la fin du mois d’octobre, et en 1734 elle assiégea Philippsburg. Le prince Eugène, aujourd'hui soixante-dix, ne put rassembler une armée assez forte pour la soulager. Le commandant français, le duc de Berwick, a été tué par un boulet de canon dans les tranchées le 12 juin, mais la forteresse s’est rendue le 18 juillet. Après cela le Rhin a vu peu de combats, et la guerre a été décidée en Italie."
