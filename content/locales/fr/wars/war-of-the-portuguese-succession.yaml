"1581–1583": "1581–1583"
"Only the Azores held out for António, above all Terceira, whose harbour at Angra was a port of call for the fleets returning from the Indies and America. On 25 July 1581 a Spanish landing at Salga Bay on Terceira was beaten off when the islanders drove half-wild cattle into the troops. Catherine de’ Medici, herself a claimant, backed a fleet of about 60 ships under the Florentine exile Filippo Strozzi, which reached the islands in July 1582. On 26 July, off São Miguel, Santa Cruz defeated it with fewer but larger ships. Strozzi was killed, and Santa Cruz had many prisoners executed as pirates, since France and Spain were not formally at war.": "Seuls les Açores tenaient pour António, surtout Terceira, dont le port d’Angra était une escale pour les flottes revenant des Indes et de l’Amérique. Le 25 juillet 1581, un débarquement espagnol à Salga Bay sur Terceira a été battu lorsque les insulaires ont conduit des bovins à moitié sauvages dans les troupes. Elle-même réclamait une soixantaine de navires sous l’exil florentin Filippo Strozzi, qui atteignit les îles en juillet 1582. Le 26 juillet, au large de São Miguel, Santa Cruz la battit avec moins de navires mais plus grands. Strozzi fut tué et Santa Cruz fit exécuter de nombreux prisonniers en tant que pirates, puisque la France et l’Espagne n’étaient pas officiellement en guerre."
"António went back to France for more men, and in 1583 Santa Cruz returned with nearly 100 ships and about 15,000 men. On 26 July he landed at the Baía das Mós, away from the defended harbours, stormed the beach defences and took Angra within days. The French and English soldiers were allowed to leave, but leading Portuguese supporters of António were executed, and the other islands submitted. António lived on in exile in France and England, joined an English attempt on Lisbon in 1589 and died in Paris in 1595. Portugal remained united with Spain until 1640.": "António est retourné en France pour plus d’hommes, et en 1583 Santa Cruz est revenu avec près de 100 navires et environ 15 000 hommes. Le 26 juillet il a débarqué à la Baía das Mós, loin des ports défendus, a pris les défenses de plage et Angra en quelques jours. Les soldats français et anglais ont été autorisés à partir, mais les principaux supporters portugais d’António ont été exécutés, et les autres îles soumises. António a vécu en exil en France et en Angleterre, s’est joint à une tentative anglaise de Lisbonne en 1589 et est mort à Paris en 1595. Le Portugal est resté uni avec l’Espagne jusqu’en 1640."
