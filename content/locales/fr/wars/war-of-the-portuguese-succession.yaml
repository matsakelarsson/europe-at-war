"War of the Portuguese Succession": "Guerre de la Succession portugaise"
"The war in which Philip II of Spain made good his claim to the Portuguese throne after the deaths of King Sebastian in 1578 and Cardinal-King Henry in 1580. The Duke of Alba defeated the rival claimant, António, Prior of Crato, at Alcântara outside Lisbon in 1580, and the Marquis of Santa Cruz won the Azores in 1582–1583, beginning sixty years of union between the Spanish and Portuguese crowns.": "La guerre au cours de laquelle Philippe II d’Espagne a fait sa revendication sur le trône portugais après la mort du roi Sebastian en 1578 et du cardinal-roi Henri en 1580. Le duc d’Alba a défait le réclamant rival, António, prieur de Crato, à Alcântara en dehors de Lisbonne en 1580, et le marquis de Santa Cruz a remporté les Açores en 1582-1583, commençant soixante ans d’union entre les couronnes espagnole et portugaise."
"Dates up to early October 1582 are Julian. Spain and Portugal adopted the Gregorian calendar in October 1582, so the dates of 1583 are Gregorian.": "Les dates jusqu’au début octobre 1582 sont Julian. L’Espagne et le Portugal ont adopté le calendrier grégorien en octobre 1582, de sorte que les dates de 1583 sont grégoriennes."
"Under the Iberian Union Portugal kept its own laws, coinage, Cortes and empire, and was ruled by the Spanish kings as a separate kingdom. On the map it stays Portugal.": "Sous l’Union ibérique le Portugal a gardé ses propres lois, pièces de monnaie, Cortes et empire, et a été gouverné par les rois espagnols comme un royaume séparé. Sur la carte il reste le Portugal."
