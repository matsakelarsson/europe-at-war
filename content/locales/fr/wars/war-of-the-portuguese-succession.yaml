"1580–1581": "1580–1581"
"King Sebastian’s death at Alcácer Quibir left the throne to his great-uncle, Cardinal Henry, who was old and childless and died on 31 January 1580 without naming an heir. The strongest claimants were Philip II of Spain, a grandson of King Manuel I through his mother; Catherine, Duchess of Braganza, a granddaughter through a son; and António, Prior of Crato, Manuel’s grandson in the male line but born out of wedlock. Most of the nobles and higher clergy, many won over with Spanish money, accepted Philip. The common people of Lisbon and many towns favoured António, who was acclaimed king at Santarém on 24 July.": "La mort du roi Sebastian à Alcácer Quibir a laissé le trône à son arrière-oncle, le cardinal Henry, qui était vieux et sans enfant et est décédé le 31 janvier 1580 sans nommer d’héritier. Les plus grands demandeurs étaient Philippe II d’Espagne, petit-fils du roi Manuel Ier par sa mère ; Catherine, duchesse de Braganza, petite-fille par un fils ; et António, prieur de Crato, petit-fils de Manuels dans la lignée masculine mais né hors mariage. La plupart des nobles et le clergé supérieur, beaucoup ont gagné avec l’argent espagnol, accepté Philip. Le peuple de Lisbonne et de nombreuses villes ont favorisé António, qui a été acclamé roi à Santarém le 24 juillet."
"Philip had already sent his army in. The aged Duke of Alba crossed the border near Elvas in late June with a large army, many of them German and Italian mercenaries, while a fleet under the Marquis of Santa Cruz took Setúbal and carried the troops round to Cascais. On 25 August Alba routed António’s hastily raised army of townsmen, peasants and freed slaves at the bridge of Alcântara, just west of Lisbon, and the city surrendered. Sancho Dávila took Porto in October; António hid for months and escaped to France. In April 1581 the Cortes at Tomar acclaimed Philip king, and he promised that Portugal would keep its own laws and offices.": "Philip avait déjà envoyé son armée. Le vieux duc d’Alba a traversé la frontière près d’Elvas à la fin de juin avec une grande armée, beaucoup d’entre eux des mercenaires allemands et italiens, tandis qu’une flotte sous le marquis de Santa Cruz a pris Setúbal et a transporté les troupes autour à Cascais. Le 25 août, Alba a fait route vers António. Sancho Dávila a pris Porto en octobre ; António s’est caché pendant des mois et s’est enfuie en France. En avril 1581, les Cortes de Tomar acclamèrent le roi Philippe, et il promit que le Portugal conserverait ses propres lois et bureaux."
