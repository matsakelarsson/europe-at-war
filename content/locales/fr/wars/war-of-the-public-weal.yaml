# Some French text was translated automatically.
"War of the Public Weal": "Guerre du Bien public"
"A revolt of great French nobles against Louis XI, led by Charles the Bold, then Count of Charolais and heir to Burgundy, with the king’s brother Charles of Berry as figurehead and Francis II of Brittany, John of Bourbon and John of Calabria among its leaders. They called their alliance the League of the Public Weal, claiming to act for the common good against the king’s ministers and taxes. The Burgundian army fought the king to a draw at Montlhéry on 16 July 1465 and besieged Paris with its allies, and Louis bought peace in the treaties of Conflans and Saint-Maur that October, giving Normandy to his brother and the Somme towns back to Burgundy. He took Normandy back the next year, and spent the rest of his reign breaking up the coalition.": "Une révolte de grands nobles français contre Louis XI, dirigé par Charles le Bold, puis comte de Charolais et héritier de Bourgogne, avec le roi Charles de Berry frère comme figure de proue et François II de Bretagne, Jean de Bourbon et Jean de Calabre parmi ses dirigeants. Ils ont appelé leur alliance la Ligue du Public Weal, prétendant agir pour le bien commun contre les ministres du roi et les impôts. L’armée bourguignonne combattit le roi à Montlhéry le 16 juillet 1465 et assiégea Paris avec ses alliés, et Louis acquit la paix dans les traités de Conflans et de Saint-Maur en octobre, donnant la Normandie à son frère et aux villes de Somme en Bourgogne. Il ramena la Normandie l’année suivante et passa le reste de son règne à rompre la coalition."
"The Somme towns, among them Amiens, Abbeville and Saint-Quentin, had been pledged to Burgundy in 1435 and bought back by Louis XI in 1463.": "Les villes de Somme, dont Amiens, Abbeville et Saint-Quentin, avaient été promises à la Bourgogne en 1435 et rachetées par Louis XI en 1463."
