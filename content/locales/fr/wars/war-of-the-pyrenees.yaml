"Ricardos in Roussillon": "Ricardos en Roussillon"
"March 1793 – March 1794": "mars 1793 – mars 1794"
"France declared war on Spain on 7 March 1793, six weeks after guillotining Louis XVI, a Bourbon cousin of Charles IV. In April Captain General Antonio Ricardos crossed the eastern Pyrenees into Roussillon with a small but well-led army. He beat the French at Mas Deu on 19 May and besieged the frontier fort of Bellegarde, which surrendered on 24 June. In September he sent two divisions to cut off Perpignan, the provincial capital, but they were stopped at Peyrestortes on 17 September; five days later Ricardos beat the main French army at Truillas and fell back to a strong position on the River Tech.": "La France déclara la guerre à l’Espagne le 7 mars 1793, six semaines après avoir guillotiné Louis XVI, cousin Bourbon de Charles IV. En avril, le capitaine général Antonio Ricardos traversa les Pyrénées orientales en Roussillon avec une petite armée bien conduite. Il battit les Français à Mas Deu le 19 mai et assiégea le fort frontière de Bellegarde, qui se rendit le 24 juin. En septembre, il envoya deux divisions pour couper Perpignan, la capitale provinciale, mais elles furent arrêtées à Peyrestortes le 17 septembre ; cinq jours plus tard, Ricardos battit l’armée française principale à Truillas et retomba dans une position forte sur le River Tech."
"French attacks on his lines failed through the autumn. A Portuguese division of some 5,000 men under John Forbes joined the Spanish, and on 20 December General Cuesta took the ports of Collioure and Port-Vendres, so that the Spanish wintered on French soil. On the Basque frontier the war was a matter of raids and outposts along the Bidasoa. The French Republic was harsh with its own people as well as its enemies: generals who lost battles risked the guillotine, royalist prisoners were shot, and in March 1794, after some of their young men fled across the border, the people of Sare and other French Basque villages were deported to the Landes, where some 1,600 died. Ricardos died in Madrid on 6 March 1794.": "Les attaques françaises sur ses lignes échouèrent tout au long de l’automne. Une division portugaise de quelque 5 000 hommes sous John Forbes rejoignit les Espagnols et, le 20 décembre, le général Cuesta prit les ports de Collioure et de Port-Vendres, de sorte que les Espagnols hivernèrent en terre française. La République française est dure avec son propre peuple et ses ennemis : des généraux qui ont perdu des batailles risquent la guillotine, des prisonniers royalistes sont abattus, et en mars 1794, après que certains de leurs jeunes hommes se soient enfuis de l’autre côté de la frontière, les habitants de Sare et d’autres villages basques français sont déportés dans les Landes où environ 1600 personnes meurent. Ricardos meurt à Madrid le 6 mars 1794."
