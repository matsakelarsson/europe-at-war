# Some French text was translated automatically.
"War of the Pyrenees": "Guerre des Pyrénées"
"The war between Revolutionary France and Spain, with a Portuguese contingent, fought on both ends of the Pyrenees in 1793–1795 as part of the War of the First Coalition. A Spanish army under Antonio Ricardos invaded Roussillon in 1793, but in 1794 the French drove it out, won the Battle of the Black Mountain and took Figueres, while in the west they overran the Basque provinces. Spain made peace at Basel in July 1795, giving up its half of Hispaniola.": "La guerre entre la France révolutionnaire et l’Espagne, avec un contingent portugais, a combattu aux deux extrémités des Pyrénées en 1793–1795 dans le cadre de la Première Coalition. Une armée espagnole sous Antonio Ricardos a envahi Roussillon en 1793, mais en 1794 les Français l’ont chassé, gagné la bataille de la Montagne Noire et pris Figueres, tandis que dans l’ouest ils ont envahi les provinces basques. L’Espagne fit la paix à Bâle en juillet 1795, abandonnant sa moitié d’Hispaniola."
"Also called the War of Roussillon or the War of the Convention (in Spanish Guerra del Rosellón or Guerra de la Convención, in Catalan Guerra Gran). Spanish ships and troops also helped defend Toulon in 1793; that siege is told with the French Revolutionary Wars.": "Aussi appelé la guerre de Roussillon ou la guerre de la Convention (en espagnol Guerra del Rosellón ou Guerra de la Convención, en catalan Guerra Gran). Les navires et les troupes espagnols ont également aidé à défendre Toulon en 1793 ; ce siège est raconté avec les guerres révolutionnaires françaises."
"Dates are Gregorian. French sources of the time use the Revolutionary calendar from late 1793.": "Les dates sont grégorien. Les sources françaises du temps utilisent le calendrier révolutionnaire à partir de la fin 1793."
