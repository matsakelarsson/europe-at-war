"April 1794 – July 1795": "avril 1794 – juillet 1795"
"The Republic, its internal revolts crushed, now sent larger armies south. General Dugommier, who had retaken Toulon, broke the Spanish lines on the Tech at Boulou on 29 April – 1 May 1794, and the Spanish fled over the border leaving their guns and baggage. Collioure fell in May with its 7,000-strong garrison, and Bellegarde was starved into surrender in September. From 17 to 20 November Dugommier attacked the Spanish entrenchments around the Black Mountain north of Figueres. Both commanders were killed, Dugommier and the Count of La Unión, and the Spanish army broke. The great fortress of Sant Ferran at Figueres surrendered within days with some 9,000 men, and Roses fell in February 1795.": "Le général Dugommier, qui avait repris Toulon, brisa les lignes espagnoles du Tech à Boulou le 29 avril – 1er mai 1794, et les Espagnols s’enfuirent au-dessus de la frontière en laissant leurs armes et leurs bagages. Collioure tomba en mai avec sa garnison de 7 000 hommes, et Bellegarde fut affamée de capitulation en septembre. Du 17 au 20 novembre, Dugommier attaqua les enclos espagnols autour de la Montagne Noire au nord de Figueres. Les deux commandants furent tués, Dugommier et le comte de La Unión, et l’armée espagnole éclata. La grande forteresse de Sant Ferran à Figueres se rendit en quelques jours avec environ 9 000 hommes, et Roses tomba en février 1795."
"In the west General Moncey seized the Baztan valley in July 1794, then Fuenterrabía on 1 August and San Sebastián two days later, both with little resistance. In 1795 he pushed into Álava and Biscay, taking Vitoria on 17 July and Bilbao two days later, and crossed the Ebro. Spain, with its armies beaten and its treasury empty, made peace at Basel on 22 July 1795. France gave back all it had taken in Spain and received the Spanish half of the island of Hispaniola. Charles IV gave his minister Manuel Godoy the title “Prince of the Peace”, and in 1796 Spain allied itself with France against Britain.": "Dans l’ouest, le général Moncey s’empare de la vallée du Baztan en juillet 1794, puis Fuenterrabía le 1er août et San Sebastián deux jours plus tard, avec peu de résistance. En 1795 il pousse à Álava et Biscay, prenant Vitoria le 17 juillet et Bilbao deux jours plus tard, et traverse l’Èbre. L’Espagne, avec ses armées battues et son trésor vide, fait la paix à Bâle le 22 juillet 1795. La France a rendu tout ce qu’elle avait pris en Espagne et reçu la moitié espagnole de l’île d’Hispaniola. Charles IV a donné à son ministre Manuel Godoy le titre de Prince de la Paix, et en 1796 l’Espagne s’est alliée avec la France contre la Grande-Bretagne."
