# Some French text was translated automatically.
"War of the Quadruple Alliance": "Guerre de l’Alliance Quadruple"
? "A war in which Spain, led by Philip V’s minister Cardinal Giulio Alberoni and Queen Elisabeth Farnese, tried to win back the Italian lands lost at Utrecht, and Britain, France, Austria and Savoy, later joined by the Dutch Republic, combined to stop it. Spain had seized Austrian Sardinia in 1717, and in July 1718 it landed an army in Sicily, then ruled by Savoy; on 11 August Admiral George Byng destroyed the Spanish fleet off Cape Passaro. Austrian troops fought the Spaniards in Sicily, losing at Francavilla in June 1719 but taking Messina that autumn, while a French army under the Duke of Berwick invaded northern Spain and took Fuenterrabía and San Sebastián, and a British force raided Vigo. Spain also backed the Jacobite rising of 1719 in Scotland. Philip V dismissed Alberoni in December 1719 and accepted the allies’ terms in the Treaty of The Hague of 17 February 1720. Spain left Sicily and Sardinia; Austria took Sicily and Savoy received Sardinia in exchange, and the Emperor Charles VI gave up his claim to Spain, while Don Carlos, Elisabeth Farnese’s son, was promised the succession to Parma and Tuscany."
: "Une guerre au cours de laquelle l’Espagne, dirigée par le cardinal Giulio Alberoni et la reine Elisabeth Farnese, ministre de Philippe V.S., a tenté de reconquérir les terres italiennes perdues à Utrecht, et la Grande-Bretagne, la France, l’Autriche et Savoie, rejoints plus tard par la République néerlandaise, se sont combinées pour y mettre fin. L’Espagne s’était emparée de la Sardaigne autrichienne en 1717 et, en juillet 1718, elle débarqua une armée en Sicile, alors gouvernée par Savoy ; le 11 août, l’amiral George Byng détruisit la flotte espagnole au large du cap Passaro. Les troupes autrichiennes combattent les Espagnols en Sicile, perdant à Francavilla en juin 1719 mais prenant Messine cet automne-là, tandis qu’une armée française sous le duc de Berwick envahit le nord de l’Espagne et prend Fuenterrabía et San Sebastián, et une force britannique raid Vigo. L’Espagne quitta la Sicile et la Sardaigne ; l’Autriche prit la Sicile et la Savoie reçurent la Sardaigne en échange, et l’empereur Charles VI abandonna sa demande à l’Espagne, tandis que Don Carlos, fils d’Elisabeth Farnese, fut promis à Parme et à la Toscane."
"The Quadruple Alliance was agreed in London on 2 August 1718 by Britain, France and Austria; Savoy joined later in the year, and the Dutch Republic, whose name the alliance anticipated, in 1719.": "L’Alliance Quadruple a été adoptée à Londres le 2 août 1718 par la Grande-Bretagne, la France et l’Autriche ; Savoy a rejoint plus tard dans l’année, et la République néerlandaise, dont le nom était prévu, en 1719."
"Britain and Spain fought at sea from 1718, but Britain declared war only in December 1718 and France in January 1719. There was also minor fighting in North America, around Pensacola.": "La Grande-Bretagne et l’Espagne ont combattu en mer à partir de 1718, mais la Grande-Bretagne n’a déclaré la guerre qu’en décembre 1718 et la France en janvier 1719."
