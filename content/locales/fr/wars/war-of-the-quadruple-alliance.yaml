"August 1717 – December 1718": "août 1717 – décembre 1718"
"Philip V’s queen, Elisabeth Farnese, and his minister, Cardinal Alberoni, wanted to win back the Italian lands Spain had lost at Utrecht. In August 1717 a Spanish expedition from Barcelona landed at Cagliari and by the end of October had taken all of Sardinia from the Emperor. On 1 July 1718 about 30,000 Spanish troops under the Marquis of Lede landed near Palermo, in the Kingdom of Sicily, which Victor Amadeus of Savoy had held since 1713. Palermo opened its gates, and the Spaniards overran most of the island and besieged the citadel of Messina. On 2 August Britain, France and Austria formed the Quadruple Alliance in London to force Spain to withdraw.": "La reine de Philippe V, Elisabeth Farnese, et son ministre, le cardinal Alberoni, voulaient reconquérir les terres italiennes que l’Espagne avait perdues à Utrecht. En août 1717, une expédition espagnole de Barcelone débarqua à Cagliari et, fin octobre, elle prit toute la Sardaigne de l’empereur. Le 1er juillet 1718, environ 30 000 troupes espagnoles sous le marquis de Lede débarquèrent près de Palerme, dans le royaume de Sicile que Victor Amadeus de Savoie détenait depuis 1713. Palerme ouvrit ses portes, et les Espagnols envahirent la majeure partie de l’île et assiégèrent la citadelle de Messine."
"Admiral Sir George Byng had already sailed with a British fleet. On 11 August, off Cape Passaro at the south-eastern tip of Sicily, he caught the Spanish fleet strung out along the coast and attacked, although Britain and Spain were not at war. In a running fight the Spanish lost seven ships of the line and six frigates, and more were scuttled by their crews. The Spanish army was now cut off on the island. It took the citadel of Messina at the end of September and beat an Austrian force from Naples at Milazzo on 15 October, but the Austrians held on to a bridgehead there. Britain declared war on Spain in December, and France in January 1719.": "L’amiral sir George Byng avait déjà navigué avec une flotte britannique. Le 11 août, au large du cap Passaro à la pointe sud-est de la Sicile, il a pris la flotte espagnole coincée le long de la côte et attaqué, bien que la Grande-Bretagne et l’Espagne n’étaient pas en guerre. Dans un combat de course, les Espagnols ont perdu sept navires de la ligne et six frégates, et d’autres ont été égorgés par leurs équipages. Il prit la citadelle de Messine à la fin du mois de septembre et battit une force autrichienne de Naples à Milazzo le 15 octobre, mais les Autrichiens s’y accrochèrent en tête de pont. La Grande-Bretagne déclara la guerre à l’Espagne en décembre et la France en janvier 1719."
