"1719 – August 1720": "1719 – août 1720"
"In 1719 France attacked by land. The Duke of Berwick, who had won Almansa for Philip V twelve years before, led a French army into the Basque country and took Fuenterrabía in June and San Sebastián in August, and in October a British expedition seized Vigo. Spain backed a Jacobite landing in Scotland, which failed at Glen Shiel in June. In Sicily, an Austrian army of about 24,000 men under Count Mercy, ferried over by the British fleet, attacked the Spanish lines at Francavilla on 20 June and was beaten back with heavy losses. Mercy then besieged Messina, which fell in the autumn, but Lede’s army still held most of the island.": "En 1719, la France attaqua par terre. Le duc de Berwick, qui avait remporté l’Almansa pour Philippe V douze ans auparavant, mena une armée française dans le pays basque et prit Fuenterrabía en juin et San Sebastián en août, et en octobre une expédition britannique saisit Vigo. En Sicile, une armée autrichienne d’environ 24 000 hommes sous le Comte Mercy, transbordée par la flotte britannique, attaqua les lignes espagnoles à Francavilla le 20 juin et fut battue avec de lourdes pertes. Mercy assiégea ensuite Messina, qui tomba à l’automne, mais l’armée de Lede était encore en possession de la majeure partie de l’île."
"Philip V dismissed Alberoni in December 1719 and accepted the allies’ terms in the Treaty of The Hague of 17 February 1720. The Spanish troops left Sicily and Sardinia, and the two islands changed rulers as the allies had agreed in 1718. Austria took Sicily, which was reunited with Naples under the Emperor, and Victor Amadeus received Sardinia instead, taking the title King of Sardinia; the island was handed over to him on 8 August 1720. The Emperor Charles VI recognised Philip V as king of Spain, and Elisabeth Farnese’s son Don Carlos was promised the succession to Parma and Tuscany.": "Philippe V renonça à Alberoni en décembre 1719 et accepta les termes du traité de La Haye du 17 février 1720. Les troupes espagnoles quittèrent la Sicile et la Sardaigne, et les deux îles changeèrent de gouvernement comme l’avaient convenu les alliés en 1718. L’Autriche prit la Sicile, qui fut réunie avec Naples sous l’empereur, et Victor Amadeus reçut la Sardaigne, prenant le titre de roi de Sardaigne ; l’île lui fut remise le 8 août 1720. L’empereur Charles VI reconnut Philippe V comme roi d’Espagne, et le fils d’Elisabeth Farnèse Don Carlos fut promis à Parme et à la Toscane."
