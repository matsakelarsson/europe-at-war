# Some French text was translated automatically.
"War of the Reunions": "Guerre des Réunions"
"A short war between France and Spain over Louis XIV’s “reunions”, the annexation of towns and lands along France’s eastern border, from Montbéliard to Luxembourg, which special courts, the Chambers of Reunion, claimed had once belonged to territories ceded to France. Strasbourg was seized in 1681 in the same policy. With the Emperor tied down by the Ottoman siege of Vienna, French troops entered the Spanish Netherlands in September 1683, and Spain declared war in October. The French took Courtrai and Dixmude, bombarded Luxembourg in December and besieged it in the spring; Vauban took the fortress in June 1684. In the Truce of Ratisbon (Regensburg) of 15 August 1684 Spain and the Emperor accepted France’s possession of Strasbourg, Luxembourg and the reunited lands for twenty years, and France gave back Courtrai and Dixmude.": "Une brève guerre entre la France et l’Espagne au-dessus de Louis XIV, les réunions, l’annexion des villes et des terres le long de la frontière orientale de la France, de Montbéliard à Luxembourg, que les tribunaux spéciaux, les chambres de réunion, prétendaient avoir autrefois appartenu à des territoires cédés à la France. Strasbourg fut saisie en 1681 dans la même politique. L’empereur étant lié par le siège ottoman de Vienne, les troupes françaises entrèrent aux Pays-Bas espagnols en septembre 1683 et l’Espagne déclara la guerre en octobre. Les Français prirent Courtrai et Dixmude, bombardèrent le Luxembourg en décembre et l’assiégea au printemps ; Vauban prit la forteresse en juin 1684. Dans la Trêve de Ratisbon (Regensburg) du 15 août 1684, l’Espagne et l’Empereur acceptèrent la possession de la France de Strasbourg, du Luxembourg et des terres réunies pendant vingt ans, et la France rendit Courtrai et Dixmude."
"The truce was meant to last twenty years, but the Nine Years’ War broke out in 1688, and the Peace of Ryswick of 1697 returned Luxembourg and most of the reunions outside Alsace.": "La trêve devait durer vingt ans, mais la guerre de neuf ans éclata en 1688, et la paix du Ryswick de 1697 retourna au Luxembourg et la plupart des retrouvailles en dehors de l’Alsace."
