"Caltabellotta": "Caltabellotta"
"In May 1302 Charles of Valois, brother of Philip IV of France, whom Boniface VIII had called to Italy, landed at Termini with a large army to join Robert of Calabria. Frederick avoided battle and let the invaders wear themselves out in the summer heat. Charles besieged Sciacca, on the south coast, where disease ravaged his army. With neither side able to win, Charles of Valois, Robert and Frederick met at Caltabellotta, a hill town above Sciacca, and agreed a peace on 31 August 1302.": "En mai 1302, Charles de Valois, frère de Philippe IV de France, que Boniface VIII avait appelé en Italie, débarqua à Termini avec une grande armée pour rejoindre Robert de Calabre. Frederick évita la bataille et laissa les envahisseurs s’user dans la chaleur estivale. Charles assiégea Sciacca, sur la côte sud, où la maladie ravageait son armée. Ni l’un ni l’autre n’ayant pu gagner, Charles de Valois, Robert et Frederick se sont rencontrés à Caltabellotta, une ville montagneuse au-dessus de Sciacca, et ont convenu d’une paix le 31 août 1302."
"Frederick kept the island for life with the title King of Trinacria, the old Greek name for Sicily, and married Charles II’s daughter Eleanor. On his death the island was to return to the Angevins, and his heirs were to be compensated elsewhere. Each side gave back what it held in the other’s lands. Boniface VIII confirmed the peace in 1303. But Frederick never meant the island to go back, and when war broke out again in 1313–1314 the Sicilian parliament recognised his son Peter as heir. Sicily and Naples fought on and off until 1372.": "Frederick garda l’île à vie avec le titre de Roi de Trinacrie, ancien nom grec pour la Sicile, et épousa la fille de Charles II, Eleanor. À sa mort, l’île devait retourner aux Angevins, et ses héritiers devaient être indemnisés ailleurs. Chaque partie rendait ce qu’elle détenait dans les autres terres. Boniface VIII confirmait la paix en 1303. Mais Frederick n’a jamais voulu que l’île retourne en arrière, et quand la guerre éclata de nouveau en 1313–1314 le parlement sicilien reconnut son fils Pierre comme héritier. La Sicile et Naples combattèrent jusqu’à 1372."
