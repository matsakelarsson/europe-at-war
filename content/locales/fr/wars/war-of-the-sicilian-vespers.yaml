"The Vespers": "Les Vêpres"
"Charles of Anjou ruled the Kingdom of Sicily from Naples, and the island resented his heavy taxes, his French officials and the use of its wealth for his planned conquest of Constantinople. On Easter Monday, 30 March 1282, at the hour of vespers outside the church of Santo Spirito in Palermo, a French soldier is said to have insulted a Sicilian woman and was killed by her husband. The crowd turned on the French, and in the night and the days that followed, by the chroniclers’ count, some 2,000 French men, women and children were killed in Palermo. The rising spread across the island. Messina rose at the end of April and burned the ships gathered there for Charles’s expedition.": "Charles d’Anjou dirigea le Royaume de Sicile depuis Naples, et l’île en ressentit les lourdes taxes, ses fonctionnaires français et l’utilisation de ses richesses pour sa conquête planifiée de Constantinople. Le lundi de Pâques, 30 mars 1282, à l’heure des vêpres devant l’église de Santo Spirito à Palerme, un soldat français aurait insulté une femme sicilienne et aurait été tué par son mari. La foule se retourna sur les Français, et dans la nuit et les jours qui suivirent, par le compte des chroniqueurs, quelque 2 000 hommes, femmes et enfants français furent tués à Palerme. La montée s’étendit sur toute l’île. Messine se leva fin avril et brûla les navires qui s’y rassemblèrent pour l’expédition Charles."
"The rebels formed communes and offered to place themselves under the pope, who refused. Charles crossed the strait with a large army and besieged Messina from July, but its people, women among them, held the walls. The Sicilians then offered the crown to Peter III of Aragon, whose wife Constance was Manfred’s daughter and heir. Peter, who had been waiting with a fleet at Collo on the African coast, landed at Trapani on 30 August and was proclaimed king in Palermo on 4 September. As his army marched on Messina, Charles, in danger of being cut off, withdrew to Calabria at the end of September.": "Les rebelles formèrent des communes et se proposèrent de se placer sous le pape, qui refusa. Charles traversa le détroit avec une grande armée et assiégea Messina à partir de juillet, mais son peuple, des femmes parmi elles, tenait les murs. Peter, qui attendait avec une flotte à Collo sur la côte africaine, débarqua à Trapani le 30 août et fut proclamé roi à Palerme le 4 septembre. Alors que son armée marchait sur Messine, Charles, en danger d’être coupé, se retira en Calabre fin septembre."
