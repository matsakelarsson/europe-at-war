"James was crowned King of Sicily in Palermo in 1286, and the war went on. On 23 June 1287 Lauria destroyed another Angevin fleet in the Bay of Naples, in what became known as the Battle of the Counts after the many nobles taken prisoner. Charles of Salerno, now King Charles II, was released in 1288 under the Treaty of Canfranc, promising to work for peace, but the pope annulled the agreement and crowned him king of the whole kingdom in 1289. Aragon itself was under pressure from France and the papacy, and in 1291 Alfonso III agreed at Tarascon to abandon Sicily, but he died that June.": "Jacques fut couronné roi de Sicile à Palerme en 1286, et la guerre continua. Le 23 juin 1287 Lauria détruisit une autre flotte d’Angevin dans la baie de Naples, dans ce qui devint connu sous le nom de bataille des comtes après les nombreux nobles faits prisonniers. Charles de Salerno, aujourd'hui roi Charles II, est libéré en 1288 sous le traité de Canfranc, promettant de travailler pour la paix, mais le pape annule l’accord et le couronne roi de tout le royaume en 1289. Aragon lui-même subit des pressions de la France et de la papauté, et en 1291 Alfonso III accepte à Tarascon d’abandonner la Sicile, mais il meurt en juin."
"James now became King of Aragon too, and left his younger brother Frederick to govern Sicily. To secure Aragon, James made peace with France, the pope and Charles II in the Treaty of Anagni of 20 June 1295. He gave Sicily up to the Church, to be returned to the Angevins, and married Charles’s daughter Blanche; Pope Boniface VIII later granted him Sardinia and Corsica instead. The Sicilians refused to be handed back. Their parliament proclaimed Frederick king, and he was crowned in Palermo on 25 March 1296.": "Jacques devint aussi roi d’Aragon et laissa son jeune frère Frédéric gouverner la Sicile. Pour assurer Aragon, Jacques fit la paix avec la France, le pape et Charles II dans le traité d’Anagni du 20 juin 1295. Il abandonna la Sicile à l’Église, pour être retourné aux Angevins, et épousa Blanche, fille de Charles ; le Pape Boniface VIII lui accorda plus tard la Sardaigne et la Corse. Leur parlement proclama Frederick roi, et il fut couronné à Palerme le 25 mars 1296."
