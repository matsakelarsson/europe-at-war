"Pope Martin IV, a Frenchman and Charles’s ally, excommunicated Peter, declared him deposed from Aragon and granted that kingdom to Charles of Valois, son of Philip III of France. Charles of Anjou challenged Peter to settle the war by a combat of a hundred knights each at Bordeaux on 1 June 1283; it was never fought, and each king claimed that the other had failed to appear. The war was decided at sea. On 8 July 1283 the Aragonese and Sicilian fleet under its admiral Roger of Lauria, a southern Italian exile in Aragonese service, destroyed an Angevin fleet sent to relieve the French garrison of Malta, and Aragonese troops held much of the Calabrian coast.": "Le pape Martin IV, un Français et son allié Charles, excommunié Pierre, le déposèrent d’Aragon et accorda ce royaume à Charles de Valois, fils de Philippe III de France. Charles d’Anjou défia Pierre de régler la guerre par un combat de cent chevaliers chacun à Bordeaux le 1er juin 1283 ; il ne fut jamais combattu, et chaque roi prétendit que l’autre n’avait pas comparu. La guerre fut décidée en mer. Le 8 juillet 1283, la flotte aragonaise et sicilienne sous son amiral Roger de Lauria, un exil italien du sud au service aragonais, détruisit une flotte d’Angevin envoyée pour libérer la garnison française de Malte, et les troupes aragonaises détenaient une grande partie de la côte calabrienne."
"On 5 June 1284 Lauria lured the fleet of Charles’s son, Charles of Salerno, out of Naples and captured him with many of his ships. Charles of Anjou besieged Reggio that summer but had to withdraw, and he died at Foggia on 7 January 1285. In 1285 Philip III of France invaded Aragon itself in a crusade that ended in disaster. Lauria destroyed the French fleet at Les Formigues, and Philip died at Perpignan in October on the retreat. Peter III died in November. Aragon passed to his elder son Alfonso III, and Sicily to his younger son James.": "Le 5 juin 1284 Lauria attira la flotte de Charles, le fils de Salerno, de Naples et l’empoigna avec beaucoup de ses navires. Charles d’Anjou assiégea Reggio cet été-là mais dut se retirer, et il mourut à Foggia le 7 janvier 1285. En 1285 Philippe III de France envahit Aragon lui-même dans une croisade qui s’acheva en catastrophe. Lauria détruisit la flotte française aux Formigues, et Philippe mourut à Perpignan en octobre lors de la retraite. Pierre III mourut en novembre. Aragon passa à son fils aîné Alfonso III, et la Sicile à son fils cadet Jacques."
