"War of the Sicilian Vespers": "Guerre des Vêpres siciliennes"
"The war that followed the rising of the Sicilians against Charles of Anjou in 1282, when the island gave its crown to Peter III of Aragon. Aragonese and Sicilian fleets under Roger of Lauria won almost every battle at sea; when Aragon made peace in 1295, the Sicilians crowned Peter’s son Frederick and fought on against the Angevins, the papacy and Aragon itself, until the Peace of Caltabellotta in 1302 left Sicily to Frederick and split the old kingdom in two.": "La guerre qui suivit la montée des Siciliens contre Charles d’Anjou en 1282, lorsque l’île donna sa couronne à Pierre III d’Aragon. Les flottes aragonaise et sicilienne sous Roger de Lauria remportèrent presque toutes les batailles en mer ; quand Aragon fit la paix en 1295, les Siciliens couronnent le fils de Pierre Frédéric et combattent contre les Angevins, la papauté et l’Aragon lui-même, jusqu’à ce que la Paix de Caltabellotta en 1302 quitte la Sicile à Frederick et divise le vieux royaume en deux."
"After 1282 both kingdoms still called themselves the Kingdom of Sicily. Historians call the island kingdom Sicily (or, after 1302, Trinacria) and the mainland kingdom Naples, as the map does.": "Après 1282 les deux royaumes se nomment encore le Royaume de Sicile. Les historiens appellent le royaume île Sicile (ou, après 1302, Trinacria) et le royaume continental Naples, comme la carte le fait."
"Whether the rising was planned is disputed. Peter III and the Byzantine emperor Michael VIII, whom Charles was preparing to attack, had both been plotting against him, and later legend gave the leading role to the exile John of Procida.": "Pierre III et l’empereur byzantin Michel VIII, que Charles se préparait à attaquer, avaient tous deux comploté contre lui, et plus tard la légende a donné le rôle de premier plan à l’exil Jean de Procida."
"The French crusade against Aragon in 1284–1285 has its own entry, the Aragonese Crusade. Frederick of Sicily is usually numbered Frederick III, though some historians call him Frederick II.": "La croisade française contre Aragon en 1284–1285 a sa propre entrée, la Croisade aragonaise. Frédéric de Sicile est généralement numéroté Frédéric III, bien que certains historiens l’appellent Frédéric II."
