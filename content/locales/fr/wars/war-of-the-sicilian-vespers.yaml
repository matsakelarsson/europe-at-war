"Frederick took the war to the mainland, invading Calabria and Apulia in 1296–1297. Roger of Lauria, who quarrelled with him, went over to James, now bound by the treaty to help the pope and the Angevins win back the island. In 1298 James and Lauria brought an Aragonese fleet to Sicily, and on 4 July 1299 off Cape Orlando they defeated Frederick’s fleet, though James then went home. Angevin troops under Charles II’s son Robert of Calabria landed and took Catania and other towns in the east of the island.": "Frederick prit la guerre sur le continent, envahissant la Calabre et les Pouilles en 1296–1297. Roger de Lauria, qui se disputait avec lui, alla vers Jacques, désormais lié par le traité pour aider le pape et les Angevins à reconquérir l’île. En 1298, James et Lauria apportèrent une flotte aragonaise en Sicile, et le 4 juillet 1299 au large de Cap Orlando, ils déferlèrent la flotte de Frederick, bien que James rentrât chez lui."
"On land the Sicilians held their own. On 1 December 1299 Frederick routed an Angevin army at Falconaria near Trapani and captured its commander, Charles II’s son Philip of Taranto, and in 1300 his Aragonese captain Blasco de Alagón won again at Gagliano. At sea Lauria was still the master, and on 14 June 1300 he destroyed a Sicilian and Genoese fleet off Ponza. But the Angevins could not conquer the island, and Robert’s siege of Messina in 1301 failed through hunger and disease.": "Le 1er décembre 1299, Frederick dirigea une armée d’Angevin à Falconaria près de Trapani et captura son commandant, Charles II fils Philippe de Tarente, et en 1300 son capitaine aragonais Blasco de Alagón gagna à nouveau à Gagliano. En mer Lauria était toujours le maître, et le 14 juin 1300 il a détruit une flotte sicilienne et génoise au large de Ponza. Mais les Angevins ne pouvaient pas conquérir l’île, et Robert du siège de Messine en 1301 échoué par la faim et la maladie."
