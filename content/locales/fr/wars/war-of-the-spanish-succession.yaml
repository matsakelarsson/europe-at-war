"The capital of the Spanish Netherlands opened its gates days after the battle and proclaimed Charles III. The provinces were then governed in his name by Britain and the Dutch.": "La capitale des Pays-Bas espagnols ouvrit ses portes quelques jours après la bataille et proclama Charles III. Les provinces furent alors gouvernées en son nom par la Grande-Bretagne et les Hollandais."
