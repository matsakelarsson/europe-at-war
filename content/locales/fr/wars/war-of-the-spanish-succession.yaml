"When Charles II of Spain, the last of the Spanish Habsburgs, died childless on 1 November 1700, his will left the whole Spanish monarchy – Spain and its American empire, the Spanish Netherlands, Milan, Naples, Sicily and Sardinia – to Philip, Duke of Anjou, a grandson of Louis XIV, who accepted it for him. The Emperor Leopold I claimed it for his younger son, Archduke Charles. England and the Dutch at first recognised Philip V, but in February 1701 French troops replaced the Dutch garrisons in the barrier fortresses of the Spanish Netherlands, and Louis kept Philip’s right to the French throne. On 7 September 1701 the Emperor, England and the Dutch Republic formed the Grand Alliance at The Hague; they declared war in May 1702.": "Quand Charles II d’Espagne, le dernier des Habsbourg espagnols, mourut sans enfant le 1er novembre 1700, son testament laissa toute la monarchie espagnole – l’Espagne et son empire américain, les Pays-Bas espagnols, Milan, Naples, Sicile et Sardaigne – à Philippe, duc d’Anjou, petit-fils de Louis XIV, qui l’accepta pour lui. L’empereur Léopold je le revendis pour son fils cadet, Archduke Charles. L’Angleterre et les Hollandais reconnurent d’abord Philippe V, mais en février 1701 les troupes françaises remplaçèrent les garnisons néerlandaises dans les forteresses de barrière des Pays-Bas espagnols, et Louis garda Philips droit sur le trône français. Le 7 septembre 1701 l’empereur, l’Angleterre et la République néerlandaise formèrent la Grande Alliance à La Haye ; ils déclaraient la guerre en mai 1702."
"The fighting began in Italy, where Leopold wanted the Duchy of Milan, an imperial fief. In May 1701 Prince Eugene of Savoy led about 30,000 imperial troops over mountain tracks from Tyrol into the neutral Venetian lands, and on 9 July he drove a French force from Carpi on the Adige. On 1 September Marshal Villeroi attacked his entrenchments at Chiari and was thrown back with heavy losses. On the night of 31 January 1702 imperial soldiers got into Cremona through an old aqueduct and seized Villeroi, but Irish regiments in French service drove them out. In August Eugene fought Villeroi’s successor, the Duke of Vendôme, to a bloody draw at Luzzara, and by the end of 1702 the French had won back most of the lost ground.": "Les combats ont commencé en Italie, où Léopold voulait le duché de Milan, un fief impérial. En mai 1701 le prince Eugène de Savoie a conduit environ 30 000 troupes impériales sur les pistes de montagne du Tyrol dans les terres vénitiennes neutres, et le 9 juillet il a conduit une force française de Carpi sur l’Adige. Dans la nuit du 31 janvier 1702, des soldats impériaux arrivèrent à Cremona par un ancien aqueduc et s’emparèrent de Villeroi, mais les régiments irlandais en service français les chassaient. En août, Eugène combattit le successeur de Villeroi, le duc de Vendôme, lors d’un tir sanglant à Luzzara, et à la fin de 1702, les Français avaient repris la majeure partie du terrain perdu."
