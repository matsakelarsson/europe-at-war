"In the Low Countries the Earl of Marlborough, who commanded the allied army there, took the fortresses of the Meuse – Venlo, Roermond and Liège – in the autumn of 1702, and Bonn in May 1703. Maximilian II Emanuel, Elector of Bavaria, sided with Louis XIV and seized the imperial city of Ulm in September 1702, as his brother, the Elector of Cologne, had already done. Marshal Villars crossed the Rhine and fought the Margrave of Baden at Friedlingen, and in 1703 he joined the Elector on the Danube, where they beat an imperial army at Höchstädt on 20 September. With Hungary in revolt under Francis II Rákóczi, Vienna seemed in danger. But in 1703 Portugal joined the Grand Alliance, and Savoy changed sides.": "Dans les Pays-Bas, le comte de Marlborough, qui y commandait l’armée alliée, prit les forteresses de la Meuse – Venlo, Roermond et Liège – à l’automne 1702, et Bonn en mai 1703. Maximilian II Emanuel, Électeur de Bavière, s’allia avec Louis XIV et saisit la ville impériale d’Ulm en septembre 1702, comme avait déjà fait son frère, l’Électeur de Cologne. Le maréchal Villars traversa le Rhin et combattit le margrave de Baden à Friedlingen, et en 1703 il rejoignit l’Électeur sur le Danube, où ils battèrent une armée impériale à Höchstädt le 20 septembre. Avec la Hongrie en révolte sous François II Rákóczi, Vienne semblait en danger."
"In May 1704 Marlborough marched an allied army some 400 km from near Cologne to the Danube in five weeks, keeping friend and foe guessing where he was going. On 2 July he stormed the Schellenberg above Donauwörth, and his troops burned villages across Bavaria to force the Elector to change sides. On 13 August, near the village of Blindheim, Marlborough and Prince Eugene attacked the armies of the Elector and Marshals Tallard and Marsin. Marlborough broke the French centre, and some 10,000 French infantry trapped in Blindheim surrendered. Tallard was taken prisoner; the Franco-Bavarian army lost more than 30,000 men killed, wounded and captured, against some 12,000 allies. The Emperor occupied Bavaria until the peace.": "En mai 1704, Marlborough marcha dans une armée alliée à environ 400 km de Cologne jusqu’au Danube en cinq semaines, gardant ami et ennemi devinant où il allait. Le 2 juillet, il s’empare du Schellenberg au-dessus de Donauwörth, et ses troupes brûlent des villages à travers la Bavière pour forcer l’électeur à changer de camp. Le 13 août, près du village de Blindheim, Marlborough et le prince Eugène attaquèrent les armées de l’Électeur et des Maréchaux Tallard et Marsin. Marlborough brisa le centre français, et quelque 10 000 d’infanterie française prisonniers à Blindheim se rendirent. Tallard fut fait prisonnier ; l’armée franco-bavarienne perdit plus de 30 000 hommes tués, blessés et capturés contre quelque 12 000 alliés. L’empereur occupa la Bavière jusqu’à la paix."
