"The great port surrendered without a siege.": "Le grand port s’est rendu sans siège."
"Battle of Calcinato": "Bataille de Calcinato"
"19 April 1706": "19 avril 1706"
"Vendôme surprised and beat the imperial army in Eugene’s absence, before he was recalled to Flanders after Ramillies.": "Vendôme a surpris et battu l’armée impériale en absence d’Eugène, avant qu’il soit rappelé en Flandre après Ramillies."
"7 September 1706": "7 septembre 1706"
"Eugene and Victor Amadeus broke through the French lines, ending a siege that had begun in June. It decided the war in Italy.": "Eugène et Victor Amadeus ont franchi les lignes françaises, mettant fin à un siège qui avait commencé en juin. Il a décidé la guerre en Italie."
"Battle of Castiglione": "Bataille de Castiglione"
"9 September 1706": "9 septembre 1706"
"Two days after Turin, a French force beat a Hessian corps of the imperial army near Mantua, too late to change anything.": "Deux jours après Turin, une force française a battu un corps hessien de l’armée impériale près de Mantoue, trop tard pour changer quoi que ce soit."
"Villeroi": "Villeroi"
"Taken by the allies, 1702–1706": "Prise par les alliés, 1702–1706"
"Taken by the Emperor’s army, 1706–1707": "Prise par l’armée de l’empereur, 1706–1707"
"Oudenaarde and Lille": "Oudenaarde et Lille"
"1707–1708": "1707–1708"
"The year 1707 went badly for the allies. In Spain the Duke of Berwick crushed the allied army at Almansa on 25 April, and Philip V took back Valencia and Aragon; in Germany Villars broke through the Lines of Stollhofen and raided deep into Swabia; and an attack on Toulon by Eugene and the Duke of Savoy, supported by the British fleet, failed in August. In Italy, though, Austrian troops marched through the Papal States and took Naples from Philip V. In July 1708 a French army under the Duke of Burgundy, Louis XIV’s grandson, and Vendôme retook Ghent and Bruges, whose citizens had tired of allied rule.": "En Espagne, le duc de Berwick a écrasé l’armée alliée à Almansa le 25 avril, et Philip V a repris Valence et Aragon ; en Allemagne, Villars a traversé les lignes de Stollhofen et fait une descente profonde dans la Souabe ; et une attaque contre Toulon par Eugène et le duc de Savoie, soutenue par la flotte britannique, a échoué en août. En Italie, cependant, les troupes autrichiennes ont marché à travers les États pontificaux et pris Naples de Philip V. En juillet 1708 une armée française sous le duc de Bourgogne, le petit-fils de Louis XIV, et Vendôme retook Ghent et Bruges, dont les citoyens avaient fatigué de la domination alliée."
"Marlborough, joined by Eugene, caught the French crossing the Scheldt at Oudenaarde on 11 July 1708. The battle was a scramble in which units joined as they arrived. Burgundy and Vendôme quarrelled, much of the French army never fought, and by nightfall Dutch troops under Overkirk had almost surrounded the French right. The allies then besieged Lille, one of France’s richest cities and its strongest fortress, rebuilt by Vauban. Marshal Boufflers held out for 120 days, while a convoy of munitions from Ostend fought its way through at Wijnendale. The town surrendered on 22 October and the citadel on 10 December, and early in 1709 the allies retook Ghent and Bruges.": "Marlborough, rejoint par Eugène, attrape la traversée de l’Escaut français à Oudenaarde le 11 juillet 1708. La bataille est un brouillage dans lequel des unités s’enrôlent à leur arrivée. Bourgogne et Vendôme se disputent, une grande partie de l’armée française ne combattent jamais, et par tombée de nuit les troupes néerlandaises sous Overkirk ont presque encerclé la droite française. Les alliés ont ensuite assiégé Lille, l’une des villes les plus riches de France et sa forteresse la plus forte, reconstruite par Vauban. Les bouffants maréchals se sont tenus pendant 120 jours, tandis qu’un convoi de munitions d’Ostende s’est battu à Wijnendale. La ville s’est rendue le 22 octobre et la citadelle le 10 décembre, et au début de 1709 les alliés ont repris Gand et Bruges."
"Battle of Oudenaarde": "Bataille d’Oudenaarde"
"11 July 1708, allied victory": "11 juillet 1708, victoire alliée"
"Siege of Lille": "Siège de Lille"
"12 August – 10 December 1708": "12 août – 10 décembre 1708"
"Battle of Almansa": "Bataille d’Almansa"
"25 April 1707, Bourbon victory in Spain": "25 avril 1707, victoire de Bourbon en Espagne"
"Ghent and Bruges": "Gand et Bruges"
"July 1708": "juillet 1708"
"Townspeople let French troops into both cities by surprise, cutting the allies’ waterways to the sea.": "Les habitants laissent les troupes françaises entrer dans les deux villes par surprise, coupant les alliés des voies navigables à la mer."
"11 July 1708": "11 juillet 1708"
"Marlborough’s army force-marched to the Scheldt and attacked the French as they crossed it. The French lost about 15,000 men, many of them captured.": "L’armée de Marlborough s’est massacrée à l’Escaut et a attaqué les Français pendant leur traversée. Les Français ont perdu environ 15 000 hommes, dont beaucoup sont capturés."
"Battle of Wijnendale": "Bataille de Wijnendale"
"28 September 1708": "28 septembre 1708"
"A British-led escort under John Webb beat off a larger French force and brought a vital convoy from Ostend to the siege of Lille.": "Une escorte dirigée par les Britanniques sous John Webb a battu une force française plus importante et amené un convoi vital d’Ostende au siège de Lille."
"The largest siege of the war. Boufflers surrendered the town in October and the citadel in December, with the honours of war.": "Le plus grand siège de la guerre. Boufflers a rendu la ville en octobre et la citadelle en décembre, avec les honneurs de la guerre."
"Burgundy and Vendôme": "Bourgogne et Vendôme"
"Convoy": "Convoyage"
"Held by the allies, end of 1708": "Tenue par les alliés, fin 1708"
"Almansa and Villaviciosa": "Almansa et Villaviciosa"
"1707–1710": "1707–1710"
"On 25 April 1707 the Duke of Berwick, an illegitimate son of James II of England and a marshal of France, met the allied army of Galway, a French Huguenot in British service, and the Marquis of Minas at Almansa, on the road from Valencia to Madrid. Berwick’s Franco-Spanish army broke the Portuguese, British and Dutch regiments; the allies lost some 4,000 killed and wounded and thousands of prisoners. Valencia and Aragon returned to Philip V, and Lleida fell in the autumn. By the decrees of Nueva Planta of June 1707 Philip abolished the separate laws and institutions of Valencia and Aragon as punishment for their rebellion, and the town of Xàtiva, which had resisted, was burned. The allies held on in Catalonia, and in 1708 their fleet took Sardinia for Charles, while General James Stanhope captured Minorca and its harbour of Port Mahon.": "Le 25 avril 1707, le duc de Berwick, fils illégitime de Jacques II d’Angleterre et marshal de France, rencontra l’armée alliée de Galway, un Huguenot français au service britannique, et le marquis de Minas à Almansa, sur la route de Valence à Madrid. Valence et Aragon retournèrent à Philippe V, et Lleida tomba à l’automne. Par les décrets de Nueva Planta de juin 1707 Philippe abolit les lois et institutions distinctes de Valence et d’Aragon comme punition pour leur rébellion, et la ville de Xàtiva, qui avait résisté, fut brûlée. En 1708, leur flotte prit la Sardaigne pour Charles, tandis que le général James Stanhope captura Minorque et son port de Port Mahon."
"In 1710 the allies tried once more. Under the Austrian general Guido Starhemberg and Stanhope they beat Philip at Almenar on 27 July and at Saragossa on 20 August, and Charles entered Madrid in September. Again the Castilians would not accept him. The city stayed sullen, guerrillas cut the roads, and a French army under the Duke of Vendôme came to join Philip. In December the allies retreated towards Catalonia in separate columns. On 8–9 December Vendôme trapped Stanhope’s British rearguard in the walled town of Brihuega and forced it to surrender, and then at Villaviciosa he fought Starhemberg in a bloody battle that both sides claimed. Starhemberg went on retreating, and only some 7,000 men reached Barcelona. Charles’s cause in Castile was finished.": "En 1710, les alliés essayèrent une fois de plus. Sous le général autrichien Guido Starhemberg et Stanhope, ils battit Philippe à Almenar le 27 juillet et à Saragosse le 20 août, et Charles entra à Madrid en septembre. Là encore, les Castiliens ne l’acceptèrent pas. La ville resta sullen, la guérilla coupa les routes, et une armée française sous le duc de Vendôme vint rejoindre Philippe. En décembre, les alliés reculèrent vers la Catalogne dans des colonnes séparées. Les 8 et 9 décembre, Vendôme emprisonna l’arrière-garde britannique de Stanhope, dans la ville fortifiée de Brihuega, et le força à se rendre, puis, à Villaviciosa, il combattit Starhemberg dans une bataille sanglante que les deux camps réclamaient."
"25 April 1707, Bourbon victory": "25 avril 1707, victoire de Bourbon"
"Nueva Planta decrees": "Décrets de Nueva Planta"
"1707: Valencia and Aragon lose their own laws": "1707 : Valence et Aragon perdent leurs propres lois"
"Brihuega and Villaviciosa": "Brihuega et Villaviciosa"
"8–10 December 1710, Bourbon victories": "8-10 décembre 1710, victoires de Bourbon"
"25 April 1707": "25 avril 1707"
"Perhaps the only battle in which an Englishman commanded the French and a Frenchman the English. It won back most of eastern Spain for Philip V.": "Peut-être la seule bataille dans laquelle un Anglais commandait le Français et un Français les Anglais. Il a remporté la plupart de l’est de l’Espagne pour Philip V."
"Lleida": "Lleida"
"September – November 1707": "septembre – novembre 1707"
"The Duke of Orléans took the town in October and its castle in November, opening the way into Catalonia.": "Le duc d’Orléans a pris la ville en octobre et son château en novembre, ouvrant la voie à la Catalogne."
"Port Mahon": "Port Mahon"
"September 1708": "septembre 1708"
"Stanhope’s British and Dutch troops landed on 14 September and soon forced Fort St Philip to surrender. The harbour gave the Royal Navy a base in the western Mediterranean, and Britain kept Minorca at Utrecht.": "Les troupes britanniques et néerlandaises de Stanhope débarquèrent le 14 septembre et forcèrent bientôt le fort St Philip à se rendre. Le port donna à la Royal Navy une base dans l’ouest de la Méditerranée, et la Grande-Bretagne garda Minorque à Utrecht."
"Cagliari": "Cagliari"
"August 1708": "août 1708"
"Admiral Leake’s fleet took Sardinia for Charles III almost without a fight.": "La flotte de l’amiral Leakes a pris la Sardaigne pour Charles III presque sans se battre."
"Battle of Almenar": "Bataille d’Almenar"
"27 July 1710": "27 juillet 1710"
"Stanhope’s cavalry broke Philip V’s army north of Lleida, which fell back behind the Ebro.": "La cavalerie de Stanhope a brisé l’armée de Philip Vs au nord de Lleida, qui est tombée derrière l’Èbre."
"Battle of Saragossa": "Bataille de Saragosse"
"20 August 1710": "20 août 1710"
"Starhemberg beat Philip’s army outside the city, opening the road to Madrid.": "Starhemberg bat l’armée de Philips en dehors de la ville, ouvrant la route vers Madrid."
"Brihuega": "Brihuega"
"8–9 December 1710": "8–9 décembre 1710"
"Some 4,000 British troops quartered in the town held out until the walls were breached, then surrendered with Stanhope.": "Quelque 4 000 soldats britanniques, cantonnés dans la ville, s’arrêtèrent jusqu’à ce que les murs soient brisés, puis se rendirent avec Stanhope."
"Battle of Villaviciosa": "Bataille de Villaviciosa"
"10 December 1710": "10 décembre 1710"
"Starhemberg held his ground against Vendôme until nightfall, but the next day he abandoned his guns and retreated to Catalonia.": "Starhemberg a tenu son terrain contre Vendôme jusqu’à la tombée de la nuit, mais le lendemain il a abandonné ses armes et se replié en Catalogne."
"Charles and Starhemberg": "Charles et Starhemberg"
"Vendôme": "Vendôme"
"Retreat, December 1710": "Retraite, décembre 1710"
"Malplaquet": "Malplaquet"
"The winter of 1708–1709 was the coldest in Europe for centuries, and frost and a failed harvest brought famine to France. Louis XIV sought peace, and his envoys at The Hague accepted almost all of the allies’ demands. But the allies insisted that if Philip V would not give up Spain within two months, Louis must help drive his own grandson out. Louis refused and explained why in a public letter to his subjects. The allies took Tournai, whose citadel surrendered on 3 September after a grim underground war of mines, and Marshal Villars, now France’s chief commander, entrenched his army among the woods near Malplaquet to stop them besieging Mons.": "L’hiver de 1708–1709 fut le plus froid d’Europe depuis des siècles, et le gel et une récolte ratée apportèrent la famine à la France. Louis XIV chercha la paix, et ses envoyés à La Haye acceptèrent presque toutes les demandes des alliés. Mais les alliés insistèrent pour que si Philippe V n’abandonnait pas l’Espagne dans un délai de deux mois, Louis devait aider à chasser son propre petit-fils. Les alliés ont pris Tournai, dont la citadelle s’est rendue le 3 septembre après une sombre guerre souterraine de mines, et le maréchal Villars, maintenant commandant en chef de France, a retranché son armée dans les bois près de Malplaquet pour les empêcher d’assiéger Mons."
"On 11 September Marlborough and Eugene attacked Villars’s lines in the bloodiest battle of the war. Dutch infantry under the young Prince of Orange suffered terribly in repeated assaults on the French right, while the allies forced the French left back through the woods. Villars was badly wounded, and Boufflers withdrew the army in good order. The allies held the field and took Mons on 20 October, but they had lost about 21,000 men killed and wounded, perhaps twice the French losses. In Britain the cost turned many against the war, and in 1710 the Whig ministry gave way to a Tory one that wanted peace.": "Le 11 septembre, Marlborough et Eugène attaquèrent les lignes de Villars dans la bataille la plus sanglante de la guerre. L’infanterie néerlandaise sous le jeune prince d’Orange souffrit terriblement d’assauts répétés sur la droite française, tandis que les alliés forçaient les Français à retourner dans les bois. Les alliés ont tenu le champ et pris Mons le 20 octobre, mais ils avaient perdu environ 21 000 hommes tués et blessés, peut-être deux fois les pertes françaises. En Grande-Bretagne le coût a tourné beaucoup contre la guerre, et en 1710 le ministère de Whig a cédé la place à un Tory qui voulait la paix."
"Battle of Malplaquet": "Bataille de Malplaquet"
"11 September 1709, allied victory at great cost": "11 septembre 1709, victoire alliée à grand prix"
"Marlborough and Eugene; Villars and Boufflers": "Marlborough et Eugene ; Villars et Boufflers"
"Losses": "Pertes"
"About 21,000 allied and 11,000 French killed and wounded (estimates vary)": "Environ 21 000 alliés et 11 000 Français tués et blessés (les estimations varient)"
"Peace talks at The Hague": "Les pourparlers de paix à La Haye"
"May – June 1709": "mai – juin 1709"
"Louis XIV’s foreign minister, the Marquis de Torcy, came to negotiate in person. The preliminaries of 28 May failed over the demand that Louis help remove Philip V from Spain.": "Le ministre des Affaires étrangères Louis XIV, le marquis de Torcy, est venu négocier en personne. Les préliminaires du 28 mai ont échoué à la demande que Louis aide à retirer Philip V d’Espagne."
"Tournai": "Tournai"
"June – September 1709": "juin – septembre 1709"
"The town fell at the end of July and the citadel on 3 September, after weeks of fighting in the tunnels beneath it.": "La ville est tombée à la fin du mois de juillet et la citadelle le 3 septembre, après des semaines de combats dans les tunnels en dessous."
"11 September 1709": "11 septembre 1709"
"The allies attacked the French entrenchments in the gap between two woods. The French lost the field, but the allies’ losses shocked Europe.": "Les alliés attaquèrent les enchâssements français dans l’écart entre deux bois. Les Français perdirent le champ, mais les pertes des alliés choquèrent l’Europe."
"Mons": "Mons"
"September – October 1709": "septembre – octobre 1709"
"The capital of Hainaut surrendered on 20 October, the allies’ last gain of the year.": "La capitale du Hainaut s’est rendue le 20 octobre, le dernier gain de l’année des alliés."
"Marlborough and Eugene": "Marlborough et Eugène"
"Villars": "Villars"
"Denain": "Dénaïne"
"1710–1712": "1710–1712"
"Talks at Geertruidenberg in 1710 broke down on the same issue, and the allies took Douai, Béthune, Aire and Saint-Venant. In Spain the allied army won at Almenara and Saragossa and entered Madrid for the second time in September 1710, but Castile stood by Philip V, and in December Vendôme beat the allies at Brihuega and Villaviciosa. In April 1711 the Emperor Joseph I died, and his brother, Archduke Charles, succeeded him; a Habsburg ruling both Spain and the Empire now worried the British almost as much as a Bourbon one. The new Tory ministry negotiated secretly with France, and Marlborough, who had slipped through Villars’s “Ne Plus Ultra” lines and taken Bouchain in 1711, was dismissed at the end of the year.": "Les pourparlers à Geertruidenberg en 1710 ont éclaté sur le même sujet, et les alliés ont pris Douai, Béthune, Aire et Saint-Venant. En Espagne, l’armée alliée a gagné à Almenara et Saragosse et est entrée à Madrid pour la deuxième fois en septembre 1710, mais Castille s’est tenue par Philip V, et en décembre Vendôme a battu les alliés à Brihuega et Villaviciosa. En avril 1711, l’empereur Joseph Ier mourut, et son frère, Archduke Charles, lui succéda ; un Habsbourg qui régnait à la fois en Espagne et dans l’Empire s’inquiétait maintenant presque autant des Britanniques qu’un Bourbon. Le nouveau ministère tory négocia secrètement avec la France, et Marlborough, qui avait glissé à travers les lignes de Villars, et pris Bouchain en 1711, fut congédié à la fin de l’année."
"The Duke of Ormonde, Marlborough’s successor, had secret orders not to fight, and in July the British withdrew under an armistice and took over Dunkirk as a pledge of peace. Eugene took Le Quesnoy and besieged Landrecies, but his supplies came from the depot at Marchiennes along a long fortified corridor across the Scheldt. On 24 July Villars feinted towards Landrecies and fell instead on the Earl of Albemarle’s Dutch and imperial troops at Denain, driving many of them into the river. Villars then took Marchiennes and retook Douai, Le Quesnoy and Bouchain. Denain ended the threat of an invasion of France and strengthened Louis XIV’s hand at the peace talks.": "Le duc d’Ormonde, successeur de Marlborough, avait des ordres secrets de ne pas se battre, et en juillet les Britanniques se retiraient sous une armistice et reprenaient Dunkerque comme un gage de paix. Eugène prit Le Quesnoy et assiégea Landrecies, mais ses provisions provenèrent du dépôt de Marchiennes le long d’un long couloir fortifié à travers l’Escaut. Le 24 juillet, les Villars se sont battus vers Landrecies et sont tombés sur le comte d’Albemarle. Les troupes néerlandaises et impériales de Denain ont conduit beaucoup d’entre eux dans la rivière. Les Villars ont ensuite pris Marchiennes et repris Douai, Le Quesnoy et Bouchain."
"Battle of Denain": "Bataille de Denain"
"24 July 1712, French victory": "24 juillet 1712, victoire française"
"British armistice": "Armistice britannique"
"17 July 1712": "17 juillet 1712"
"Marlborough dismissed": "Marlborough licencié"
"31 December 1711": "31 décembre 1711"
"Ne Plus Ultra lines crossed": "Les lignes de Ne Plus Ultra croisées"
"5 August 1711": "5 août 1711"
"Marlborough feinted west, then marched through the night and crossed Villars’s lines near Arleux without a battle.": "Marlborough feint à l’ouest, puis marcha dans la nuit et traversa les lignes de Villars près d’Arleux sans bataille."
"Bouchain": "Bouchain"
"August – September 1711": "août – septembre 1711"
"Marlborough’s last siege; the fortress surrendered on 12 September 1711. Villars retook it in October 1712.": "Le dernier siège de Marlborough ; la forteresse se rendit le 12 septembre 1711. Villars la reprit en octobre 1712."
"Dunkirk": "Dunkrk"
"July 1712": "juillet 1712"
"Handed to British troops as a pledge for the peace. Under the Peace of Utrecht its fortifications and harbour were to be destroyed.": "A remis aux troupes britanniques en gage de paix. Sous la Paix d’Utrecht ses fortifications et son port devaient être détruits."
"Le Quesnoy": "Le Quesnoy"
"4 July 1712": "4 juillet 1712"
"Eugene’s last success in the war, taken after a short siege. Villars won it back in October.": "Eugene est le dernier succès de la guerre, prise après un court siège. Villars l’a remporté en octobre."
"Landrecies": "Locaux"
"Eugene had to give up the siege after Denain.": "Eugène a dû abandonner le siège après Denain."
"24 July 1712": "24 juillet 1712"
"Villars stormed the fortified camp guarding the allies’ supply route. The bridge over the Scheldt broke under the fleeing troops, and many drowned.": "Les Villars ont pris l’assaut du camp fortifié qui gardait la route d’approvisionnement des alliés. Le pont au-dessus de l’Escaut s’est brisé sous les troupes en fuite, et beaucoup se sont noyés."
"Marchiennes": "Marchiennes"
"The allies’ main depot fell to Villars with its stores of munitions and its boats on the Scarpe.": "Le dépôt principal des alliés est tombé à Villars avec ses stocks de munitions et ses bateaux sur la Scarpe."
"Douai": "Douai"
"September 1712": "septembre 1712"
"Taken by the allies in 1710 and retaken by Villars on 8 September 1712.": "Prise par les alliés en 1710 et reprise par Villars le 8 septembre 1712."
"Ormonde withdraws": "Ormonde se retire"
"Utrecht and Rastatt": "Utrecht et Rastatt"
"1713–1714": "1713–1714"
"The Peace of Utrecht was a set of treaties signed from April 1713 between France and Spain and the allies, except the Emperor. Philip V kept Spain and its empire but renounced his rights to the French throne. Britain kept Gibraltar and Minorca, taken in 1704 and 1708, and won Newfoundland, Acadia and Hudson Bay from France, and from Spain the asiento, the right to supply enslaved Africans to Spanish America. Victor Amadeus of Savoy received Sicily and a royal crown, and Prussia gained Upper Guelders and recognition of its kingship. France recognised the Protestant succession in Britain and promised to destroy Dunkirk’s fortifications.": "La paix d’Utrecht est un ensemble de traités signés en avril 1713 entre la France et l’Espagne et les alliés, à l’exception de l’empereur. Philippe V garde l’Espagne et son empire mais renonce à ses droits sur le trône français. La Grande-Bretagne conserve Gibraltar et Minorque, pris en 1704 et 1708, et gagne Terre-Neuve, l’Acadie et la baie d’Hudson de France, et d’Espagne l’asiento, le droit de fournir des Africains esclaves à l’Amérique espagnole. Victor Amadeus de Savoie reçut la Sicile et une couronne royale, et la Prusse obtint le haut Guelders et la reconnaissance de sa royauté. La France reconnut la succession protestante en Grande-Bretagne et promit de détruire les fortifications de Dunkerque."
"The Emperor Charles VI fought on alone for another year, but in 1713 Villars took Landau and Freiburg. Villars and Eugene, old opponents, made peace at Rastatt on 7 March 1714, confirmed for the Empire at Baden in Switzerland on 7 September. Austria received the Spanish Netherlands, Milan, Naples and Sardinia; France kept Landau; and the Electors of Bavaria and Cologne got their lands back. Barcelona, which had fought on for Charles after the allied troops left Catalonia, fell to a Franco-Spanish army on 11 September 1714 after a siege of more than a year, and Philip V abolished the separate laws and institutions of the Crown of Aragon.": "L’empereur Charles VI combattit seul pendant une autre année, mais en 1713 Villars prit Landau et Fribourg. Villars et Eugène, anciens adversaires, firent la paix à Rastatt le 7 mars 1714, confirmé pour l’Empire à Baden en Suisse le 7 septembre. L’Autriche reçut les Pays-Bas espagnols, Milan, Naples et Sardaigne ; la France conserva Landau ; et les électeurs de Bavière et Cologne récupérèrent leurs terres. Barcelone, qui avait combattu pour Charles après que les troupes alliées aient quitté la Catalogne, est tombé dans une armée franco-espagnole le 11 septembre 1714 après un siège de plus d’un an, et Philippe V a aboli les lois et institutions distinctes de la Couronne d’Aragon."
"Peace of Utrecht": "Paix d’Utrecht"
"11 April 1713 (France and the allies); 13 July 1713 (Spain and Britain)": "11 avril 1713 (France et alliés) ; 13 juillet 1713 (Espagne et Grande-Bretagne)"
"Treaty of Rastatt": "Traité de Rastatt"
"7 March 1714, France and the Emperor": "7 mars 1714, France et l’empereur"
"Treaty of Baden": "Traité de Baden"
"7 September 1714, France and the Empire": "7 septembre 1714, la France et l’Empire"
"11 April 1713": "11 avril 1713"
"France signed treaties with Britain, the Dutch Republic, Savoy, Prussia and Portugal; Spain’s treaties followed from July 1713.": "La France a signé des traités avec la Grande-Bretagne, la République néerlandaise, la Savoie, la Prusse et le Portugal ; les traités de l’Espagne ont suivi à partir de juillet 1713."
"June – August 1713": "juin – août 1713"
"The fortress changed hands for the fourth time in the war, and France kept it at the peace.": "La forteresse a changé de mains pour la quatrième fois dans la guerre, et la France l’a maintenue à la paix."
"Freiburg": "Fribourg"
"September – November 1713": "septembre – novembre 1713"
"Taken by Villars after a hard siege, but returned to Austria at Rastatt.": "Prise par les Villars après un siège dur, mais de retour en Autriche à Rastatt."
"7 March 1714": "7 mars 1714"
"Villars and Eugene negotiated the peace between Louis XIV and Charles VI in the margrave of Baden’s new palace.": "Villars et Eugène négocièrent la paix entre Louis XIV et Charles VI dans le margrave du nouveau palais de Baden."
"7 September 1714": "7 septembre 1714"
"The Holy Roman Empire made peace with France on the terms agreed at Rastatt.": "Le Saint Empire romain a fait la paix avec la France selon les conditions convenues à Rastatt."
"To Austria at Rastatt, now the Austrian Netherlands": "Pour l’Autriche à Rastatt, maintenant les Pays-Bas autrichiens"
"The siege of Barcelona": "Le siège de Barcelone"
"July 1713 – July 1715": "juillet 1713 – juillet 1715"
"Under the peace the allied troops left Catalonia, and Charles VI, emperor since 1711, called his wife home from Barcelona. The Catalans were promised an amnesty, but not their own laws. In July 1713 the Junta de Braços, an assembly of the Catalan estates, voted to fight on alone to defend the country’s constitutions. A Bourbon army under the Duke of Popoli blockaded Barcelona from late July. The city’s defence was led by its chief councillor, Rafael Casanova, at the head of the Coronela, the citizen militia, and by the general Antonio de Villarroel. Catalan irregulars fought on in the countryside, and the castle of Cardona and the island of Mallorca also held out for Charles.": "Sous la paix, les troupes alliées quittèrent la Catalogne, et Charles VI, empereur depuis 1711, appela sa femme de Barcelone. Les Catalans furent promis une amnistie, mais pas leurs propres lois. En juillet 1713, la Junta de Braços, une assemblée des domaines catalans, vota pour se battre seul pour défendre les constitutions du pays. La défense de la ville a été dirigée par son conseiller principal, Rafael Casanova, à la tête de la Coronela, la milice citoyenne, et par le général Antonio de Villarroel. Les irréguliers catalans se sont battus dans la campagne, et le château de Cardona et l’île de Majorque ont également tenu pour Charles."
"In July 1714 Louis XIV sent the Duke of Berwick with French troops and a siege train, and the trenches crept towards the walls. The final assault began at half past four in the morning of 11 September. The attackers broke through in several places and fought their way into the streets; Casanova and Villarroel were both wounded, and that day the defenders asked for terms. Cardona surrendered a week later, and Mallorca and Ibiza in July 1715. Philip V abolished Catalonia’s government and laws by the Nueva Planta decree of 1716, and much of Barcelona’s Ribera quarter was pulled down to build a citadel to hold the city. Catalans mark 11 September as their national day, the Diada.": "En juillet 1714, Louis XIV envoya le duc de Berwick avec des troupes françaises et un train de siège, et les tranchées s’inclinèrent vers les murs. L’assaut final commença à quatre heures et demie dans la matinée du 11 septembre. Les assaillants parvinrent en plusieurs endroits et combattirent dans les rues ; Casanova et Villarroel furent tous deux blessés, et ce jour-là les défenseurs demandaient des conditions. Cardona se rendit une semaine plus tard, et Majorque et Ibiza en juillet 1715. Philippe V abolit le gouvernement et les lois de Catalogne par le décret Nueva Planta de 1716, et une grande partie du quartier Ribera de Barcelone fut abattue pour construire une citadelle pour tenir la ville. Les Catalans marquent le 11 septembre comme leur jour national, le Diada."
"Siege of Barcelona": "Siège de Barcelone"
"July 1713 – 11 September 1714": "juillet 1713 – 11 septembre 1714"
"Popoli, then Berwick; Villarroel and Casanova for Barcelona": "Popoli, puis Berwick ; Villarroel et Casanova pour Barcelone"
"Nueva Planta decree for Catalonia": "Décret Nueva Planta pour la Catalogne"
"16 January 1716": "16 janvier 1716"
"11 September 1714": "11 septembre 1714"
"The Bourbon assault broke into the city after a siege of more than a year. Terms were agreed the next day, and Berwick’s troops took over the city.": "L’assaut de Bourbon s’est effondré dans la ville après un siège de plus d’un an. Les conditions ont été convenues le lendemain, et les troupes de Berwick a pris la ville."
"Cardona": "Cardona"
"18 September 1714": "18 septembre 1714"
"The mountain castle, the last Catalan stronghold on the mainland, surrendered a week after Barcelona.": "Le château de montagne, la dernière forteresse catalane sur le continent, s’est rendu une semaine après Barcelone."
"Mallorca": "Majorque"
"July 1715": "juillet 1715"
"A Bourbon expedition under the Chevalier d’Asfeld landed in June 1715, and Palma surrendered in early July, ending the war in Spain.": "Une expédition Bourbon sous le Chevalier d’Asfeld débarqua en juin 1715, et Palma se rendit au début de juillet, mettant fin à la guerre en Espagne."
"Berwick": "Berwick"
"Held for Charles until July 1715": "Tenue pour Charles jusqu’en juillet 1715"
