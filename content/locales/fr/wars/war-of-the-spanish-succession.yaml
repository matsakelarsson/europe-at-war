"War of the Spanish Succession": "Guerre de la Succession espagnole"
"A European war over the inheritance of Charles II of Spain, in which France and Bourbon Spain, with Bavaria, fought the Emperor, Britain, the Dutch Republic and their allies to decide whether Louis XIV’s grandson Philip V or the Habsburg Archduke Charles would rule the Spanish monarchy. Marlborough’s and Eugene’s victories drove the French from Germany, Italy and the Spanish Netherlands, but the peace of Utrecht, Rastatt and Baden in 1713–1714 left Philip V on the Spanish throne and gave Spain’s lands in Italy and the Low Countries to Austria.": "Une guerre européenne sur l’héritage de Charles II d’Espagne, dans laquelle la France et Bourbon Espagne, avec la Bavière, combattirent l’empereur, la Grande-Bretagne, la République néerlandaise et leurs alliés pour décider si le petit-fils de Louis XIV Philippe V ou l’archiduc des Habsbourg Charles dirigerait la monarchie espagnole. Les victoires de Marlborough et d’Eugène conduisirent les Français d’Allemagne, d’Italie et des Pays-Bas espagnols, mais la paix d’Utrecht, Rastatt et Baden en 1713–1714 laissa Philippe V sur le trône espagnol et donna à l’Espagne des terres en Italie et dans les pays bas à l’Autriche."
"Dates are New Style (Gregorian). England and Scotland still used the Julian calendar, eleven days behind, so British sources of the time date Blenheim 2 August 1704.": "Les dates sont New Style (Gregorian). L’Angleterre et l’Écosse ont toujours utilisé le calendrier julien, onze jours après, donc les sources britanniques de la date Blenheim 2 août 1704."
"England and Scotland joined as the Kingdom of Great Britain on 1 May 1707, during the war. Savoy fought on the French side until 1703 and then joined the allies, as did Portugal; Prussia, Hanover, Denmark and other German states supplied troops to the allied armies, many of them paid by Britain and the Dutch.": "L’Angleterre et l’Écosse se joignirent au Royaume de Grande-Bretagne le 1er mai 1707, pendant la guerre. Savoy combattit du côté français jusqu’en 1703 puis rejoignit les alliés, comme le Portugal ; la Prusse, Hanovre, le Danemark et d’autres États allemands fournissaient des troupes aux armées alliées, dont beaucoup payaient par la Grande-Bretagne et les Hollandais."
"The war in Spain and Portugal, at sea, and in the colonies (in North America called Queen Anne’s War) is only outlined here. Blenheim is called the Second Battle of Höchstädt in German and French; Oudenaarde is often spelt Oudenarde in English.": "La guerre en Espagne et au Portugal, en mer et dans les colonies (en Amérique du Nord appelée la Guerre de la Reine Anne) n’est décrite ici que. Blenheim est appelé la Deuxième bataille de Höchstädt en allemand et en français ; Oudenaarde est souvent épelt Oudenarde en anglais."
