"Portugal joined the Grand Alliance in 1703, and in March 1704 Archduke Charles, proclaimed Charles III of Spain, landed at Lisbon. In May an Anglo-Dutch fleet under Admiral Sir George Rooke, carrying Prince George of Hesse-Darmstadt, a former viceroy of Catalonia, failed to raise Barcelona for Charles. Rooke then turned on Gibraltar. After a heavy bombardment, English and Dutch marines and sailors stormed the town, and on 4 August 1704 its governor surrendered his small garrison; most of the townspeople left. On 24 August the French fleet from Toulon fought Rooke off Málaga in the largest sea battle of the war. Neither side lost a ship, but the French battle fleet did not put to sea in strength again during the war, and a Franco-Spanish siege of Gibraltar by land was given up in April 1705.": "Le Portugal rejoint la Grande Alliance en 1703 et, en mars 1704, l’archiduc Charles proclame Charles III d’Espagne, atterrit à Lisbonne. En mai, une flotte anglo-néerlandaise sous la direction de l’amiral sir George Rooke, transportant le prince George de Hesse-Darmstadt, ancien vice-roi de Catalogne, ne réussit pas à élever Barcelone pour Charles. Après un bombardement lourd, des marines et des marins anglais et néerlandais ont envahi la ville et, le 4 août 1704, son gouverneur a remis sa petite garnison ; la plupart des habitants sont partis. Le 24 août, la flotte française de Toulon a combattu Rooke au large de Málaga dans la plus grande bataille maritime de la guerre. Ni l’un ni l’autre n’a perdu un navire, mais la flotte de combat française ne s’est pas ressaisie pendant la guerre, et un siège franco-espagnol de Gibraltar par terre a été abandonné en avril 1705."
"In 1705 the allies turned to the lands of the Crown of Aragon, where many feared that a Bourbon king would govern them as the kings of France governed their provinces. An allied army under the Earl of Peterborough landed near Barcelona in August, stormed the hill fort of Montjuïc on 14 September, where Prince George was killed, and forced the city to surrender on 9 October. Catalonia and Valencia, and in 1706 Aragon and Mallorca, accepted Charles III. In April 1706 Philip V besieged Barcelona, but when an English fleet arrived with reinforcements he abandoned his guns and retreated into France. An allied army from Portugal under the Earl of Galway and the Marquis of Minas then marched on Madrid and entered it in June, but Castile rose for Philip, and by the autumn the allies had fallen back to Valencia.": "En 1705, les alliés se tournèrent vers les terres de la Couronne d’Aragon, où beaucoup craignaient qu’un roi Bourbon les gouverne comme les rois de France gouvernaient leurs provinces. Une armée alliée sous le comte de Peterborough débarqua près de Barcelone en août, s’empare du fort de Montjuïc le 14 septembre, où le prince George fut tué, et força la ville à se rendre le 9 octobre. La Catalogne et Valence, et en 1706 Aragon et Majorque, acceptent Charles III. En avril 1706 Philip V assiégé Barcelone, mais quand une flotte anglaise arrive avec des renforts, il abandonne ses armes et se retire en France. Une armée alliée du Portugal sous le comte de Galway et le marquis de Minas marcha alors sur Madrid et y entra en juin, mais la Castille se leva pour Philippe, et à l’automne les alliés étaient retombés à Valence."
