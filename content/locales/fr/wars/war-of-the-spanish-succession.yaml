"The year 1705 settled little. The allies took Barcelona for Archduke Charles, proclaimed King Charles III of Spain, but Marlborough’s invasion of France along the Moselle came to nothing. In May 1706 Louis XIV ordered Marshal Villeroi to seek battle in the Spanish Netherlands. On 23 May his French, Spanish and Bavarian army of about 60,000 met Marlborough’s Dutch, British and Danish army of similar size at Ramillies, north of Namur. Marlborough moved troops from his right to his centre unseen behind a ridge, the Dutch and Danish cavalry broke through on the left, and Villeroi’s army fled. Within weeks Leuven, Brussels, Antwerp, Ghent and Bruges opened their gates and recognised Charles III, and Ostend, Menin and Ath fell to sieges.": "L’année 1705 s’installa peu. Les alliés prirent Barcelone pour l’archiduc Charles, proclamèrent le roi Charles III d’Espagne, mais Marlborough de l’invasion de la France le long de la Moselle arrivèrent à rien. Le 23 mai, son armée française, espagnole et bavaroise d’environ 60 000 hommes rencontra l’armée néerlandaise, britannique et danoise de la même taille à Ramillies, au nord de Namur. Marlborough déplaça des troupes de sa droite vers son centre invisible derrière une crête, la cavalerie néerlandaise et danoise se brisa à gauche, et l’armée de Villeroi s’enfuit. En quelques semaines, Louvain, Bruxelles, Anvers, Gand et Bruges ouvraient leurs portes et reconnaissaient Charles III, et Ostende, Menin et Ath tombaient aux sièges."
"In Italy the French had overrun most of Piedmont, and from June 1706 an army under the Duke of La Feuillade besieged Turin, the capital of Victor Amadeus II of Savoy. Prince Eugene marched an imperial army from the Adige along the south bank of the Po, outpacing the French under the Duke of Orléans, and joined the Savoyard cavalry near Turin. On 7 September they stormed the French siege lines and routed the besiegers. The garrison had held out for three months; on the night of 29 August the miner Pietro Micca had blown up a tunnel, and himself, to stop French grenadiers getting into the citadel. The French left northern Italy, and Milan passed to Austrian rule.": "En Italie, les Français avaient envahi la majeure partie du Piémont et à partir de juin 1706 une armée sous le duc de La Feuillade assiégé Turin, la capitale de Victor Amadeus II de Savoie. Le prince Eugène marchait une armée impériale de l’Adige le long de la rive sud du Po, dépassant les Français sous le duc d’Orléans, et rejoignit la cavalerie savoyarde près de Turin. Le 7 septembre, ils s’emparèrent des lignes de siège françaises et roulèrent les assiéges. La garnison avait tenu trois mois ; dans la nuit du 29 août, le mineur Pietro Micca avait fait sauter un tunnel, et lui-même, pour empêcher les grenadiers français d’entrer dans la citadelle. Les Français quittèrent l’Italie du nord et Milan passa à la domination autrichienne."
