# Some French text was translated automatically.
"War of the Straits": "Guerre du détroit"
"The third war between Venice and Genoa, fought over access to the Black Sea after the Genoese tightened their hold on Caffa, Pera (Galata) and the passage of the Bosporus and seized Chios. Venice allied with Peter IV of Aragon and the Byzantine emperor John VI Kantakouzenos, while the Genoese of Pera won the support of the Ottoman ruler Orhan. A bloody and indecisive battle in the Bosporus on 13 February 1352 left Genoa holding Pera, and Byzantium made a separate peace that May. An Aragonese–Venetian fleet crushed the Genoese off Alghero in Sardinia in August 1353, and Genoa placed itself under Giovanni Visconti of Milan; but on 4 November 1354 Paganino Doria captured almost the whole Venetian fleet at Porto Longo on the island of Sapienza. The peace signed through Visconti mediation on 1 June 1355 settled little; both sides agreed to stay away from Tana for three years.": "La troisième guerre entre Venise et Gênes, a combattu sur l’accès à la mer Noire après que les Génois ont serré leur emprise sur Caffa, Pera (Galata) et le passage du Bospore et s’est emparé de Chios. Venise allié avec Pierre IV d’Aragon et l’empereur byzantin Jean VI Kantakouzenos, tandis que les Génois de Pera ont remporté le soutien du chef ottoman Orhan. Une bataille sanglante et indécise dans le Bospore le 13 février 1352 quitta Gênes tenant Pera, et Byzance fit une paix séparée en mai. Une flotte aragonaise-vénétienne a écrasé le Genoese au large d’Alghero en Sardaigne en août 1353, et Gênes s’est placé sous Giovanni Visconti de Milan ; mais le 4 novembre 1354 Paganino Doria a capturé presque toute la flotte vénitienne à Porto Longo sur l’île de Sapienza. La paix signée par la médiation de Visconti le 1er juin 1355 s’installa peu ; les deux parties acceptèrent de rester loin de Tana pendant trois ans."
"The Battle of Porto Conte off Alghero is dated 27 or 29 August 1353 in different accounts. The Ottomans, the war’s real winners in the east, crossed into Europe at Gallipoli in 1354.": "La bataille de Porto Conte au large d’Alghero est datée du 27 ou 29 août 1353 dans différents comptes. Les Ottomans, la guerre des vrais vainqueurs à l’est, ont traversé en Europe à Gallipoli en 1354."
