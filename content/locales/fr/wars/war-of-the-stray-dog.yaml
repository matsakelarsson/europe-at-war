"War of the Stray Dog": "Guerre du chien en Stray"
"A brief Greek invasion of Bulgaria in October 1925, also called the Incident at Petrich, after a Greek soldier was shot at the border on Mount Belasitsa – by one account while chasing his dog across it – and the Greek dictator Theodoros Pangalos sent troops towards the town of Petrich. Bulgaria appealed to the League of Nations, which ordered a ceasefire and the withdrawal of Greek troops and made Greece pay £45,000 in compensation, a quick success that contrasted with the League’s failure in the Corfu incident two years earlier.": "Une brève invasion grecque de la Bulgarie en octobre 1925, également appelé l’incident à Petrich, après qu’un soldat grec ait été abattu à la frontière sur le mont Belasitsa - par un compte en poursuivant son chien à travers elle - et le dictateur grec Theodoros Pangalos envoyé des troupes vers la ville de Petrich. La Bulgarie a lancé un appel à la Société des Nations, qui a ordonné un cessez-le-feu et le retrait des troupes grecques et fait payer à la Grèce £45 000 en compensation, un succès rapide qui contraste avec l’échec de la Ligue dans l’incident de Corfou deux ans plus tôt."
"Greece’s version was that Bulgarian soldiers had crossed the border and attacked a Greek outpost. Greek troops entered Bulgaria on 22 October; the League’s ceasefire came hours before their planned attack on Petrich.": "La version grecque était que des soldats bulgares avaient franchi la frontière et attaqué un avant-poste grec. Les troupes grecques sont entrées en Bulgarie le 22 octobre ; le cessez-le-feu de la Ligue est arrivé quelques heures avant leur attaque prévue contre Petrich."
