# French translations of the catalogue text (wave 9); step bodies follow later.
War of the Two Capitals: Guerre des Deux Capitales
? The succession war of the Yuan dynasty after the death of the emperor Yesün Temür at Shangdu in August 1328, fought between a court at Dadu (Beijing) and a court at Shangdu, the summer capital. In Dadu the Kipchak commander El Temür, whose family had risen under the emperor Khayishan, seized power in September and brought Khayishan’s son Tugh Temür to the throne; at Shangdu the Muslim minister Dawlat Shah enthroned Yesün Temür’s young son Ragibagh in October. The Shangdu armies, drawing on Mongolia, Liaodong, Shaanxi, Sichuan and Yunnan, broke through the Great Wall passes and reached the outskirts of Dadu, but El Temür held the capital, and while the Shangdu forces were engaged on the wall, princes of the eastern wing on the Dadu side surrounded Shangdu on 14 November 1328. It surrendered the next day; Dawlat Shah and most of the Shangdu leaders were executed, and Ragibagh, about eight years old, disappeared. The loyalists in Shaanxi gave up in December and those in Sichuan in January 1329. Tugh Temür stood down for his elder brother Kusala, who was proclaimed khan north of Karakorum on 27 February 1329 but died on 30 August, four days after a banquet with Tugh Temür, probably poisoned on El Temür’s orders; Tugh Temür took the throne again on 8 September 1329. In Yunnan Prince Tugel, with the help of local peoples, held out against the Dadu court until March 1332. It was the bloodiest succession struggle in Yuan history, and left El Temür in control of the court until his death in 1333.
: La guerre de succession de la dynastie Yuan qui suivit la mort de l’empereur Yesün Temür à Shangdu en août 1328, livrée entre une cour établie à Dadu (Pékin) et une cour établie à Shangdu, la capitale d’été. À Dadu, le commandant kiptchak El Temür, dont la famille s’était élevée sous l’empereur Khayishan, s’empara du pouvoir en septembre et porta sur le trône Tugh Temür, fils de Khayishan ; à Shangdu, le ministre musulman Dawlat Shah intronisa en octobre Ragibagh, le jeune fils de Yesün Temür. Les armées de Shangdu, qui puisaient dans les ressources de la Mongolie, du Liaodong, du Shaanxi, du Sichuan et du Yunnan, forcèrent les cols de la Grande Muraille et atteignirent les faubourgs de Dadu, mais El Temür tint la capitale et, tandis que les forces de Shangdu étaient engagées sur la muraille, des princes de l’aile orientale ralliés à Dadu encerclèrent Shangdu le 14 novembre 1328. La ville se rendit le lendemain ; Dawlat Shah et la plupart des chefs de Shangdu furent exécutés, et Ragibagh, âgé d’environ huit ans, disparut. Les loyalistes du Shaanxi capitulèrent en décembre et ceux du Sichuan en janvier 1329. Tugh Temür s’effaça devant son frère aîné Kusala, proclamé khan au nord de Karakorum le 27 février 1329, mais celui-ci mourut le 30 août, quatre jours après un banquet avec Tugh Temür, probablement empoisonné sur l’ordre d’El Temür ; Tugh Temür reprit le trône le 8 septembre 1329. Au Yunnan, le prince Tugel, avec l’aide des populations locales, résista à la cour de Dadu jusqu’en mars 1332. Ce fut la lutte de succession la plus sanglante de l’histoire des Yuan, et elle laissa El Temür maître de la cour jusqu’à sa mort en 1333.
