# Some French text was translated automatically.
"War of the Two Peters": "Guerre des deux Pierres"
"A war between Peter I of Castile and Peter IV of Aragon, fought mostly along their border in Aragon and Valencia. It began in 1356 after Catalan galleys in Aragonese service seized Genoese ships, allies of Castile, at Sanlúcar de Barrameda. Castile had the better of the fighting, taking Tarazona in 1357 and, in 1362–1363, a string of towns in Aragon and Valencia, among them Teruel, Segorbe and Murviedro (Sagunto), with help from Navarre, Portugal and Granada. The peaces of Terrer (1361) and Murviedro (1363) did not hold. Peter IV then backed Peter of Castile’s half-brother Henry of Trastámara, and from 1366 the war merged into the Castilian Civil War; Castile’s conquests were lost. A final peace was made at Almazán in 1375, sealed by the marriage of Peter IV’s daughter Eleanor to Henry’s heir, the future John I of Castile.": "Une guerre entre Pierre Ier de Castille et Pierre IV d’Aragon, a principalement combattu le long de leur frontière à Aragon et Valence. Elle a commencé en 1356 après que des galères catalanes dans le service aragonais ont saisi des navires génois, alliés de Castille, à Sanlúcar de Barrameda. La Castille a eu le meilleur de la bataille, prenant Tarazona en 1357 et, en 1362-1363, une série de villes d’Aragon et Valence, parmi lesquelles Teruel, Segorbe et Murviedro (Sagunto), avec l’aide de Navarre, Portugal et Grenade. Les paixs de Terrer (1361) et Murviedro (1363) n’ont pas tenu. Pierre IV a ensuite soutenu Pierre de Castille, demi-frère Henri de Trastámara, et à partir de 1366 la guerre s’est fusionnée dans la guerre civile castillanienne ; les conquêtes de Castille furent perdues. Une paix finale fut faite à Almazán en 1375, scellé par le mariage de la fille de Pierre IV.Eleanor à Henry héritier, le futur Jean I de Castille."
"Also called the Castilian–Aragonese War of 1356–1369. The Castilian Civil War (1351–1369) has its own entry.": "Aussi appelé la guerre Castilienne-Aragonaise de 1356–1369. La guerre civile castillan (1351–1369) a sa propre entrée."
