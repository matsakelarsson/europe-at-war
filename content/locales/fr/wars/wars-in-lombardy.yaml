"War broke out again in 1434, and the rival condottieri dominated the campaigns, Niccolò Piccinino for Milan, Gattamelata and Francesco Sforza for the league. From 1438 Piccinino besieged Brescia, which held out for over two years, while Venice dragged a fleet of galleys overland from the Adige to Lake Garda to bring it help. In 1440 Piccinino crossed the Apennines with Florentine exiles to raise a revolt in Tuscany.": "La guerre éclata de nouveau en 1434, et le rival condottieri domina les campagnes, Niccolò Piccinino pour Milan, Gattamelata et Francesco Sforza pour la ligue. De 1438 Piccinino assiégeait Brescia, qui se tenait pendant plus de deux ans, tandis que Venise traîné une flotte de galères par-dessus terre de l’Adige au lac de Garde pour l’aider. En 1440, Piccinino traversa les Apennins avec des exilés florentins pour susciter une révolte en Toscane."
"On 29 June 1440, near Anghiari in the upper Tiber valley, the Florentine and papal army met Piccinino’s men as they came down from Sansepolcro and beat them after a long fight for a bridge. Machiavelli later mocked the battle, claiming that only one man died, crushed after falling from his horse; modern accounts give far higher losses. The war ended with the Peace of Cremona on 20 November 1441. Sforza married Filippo Maria’s only child, Bianca Maria, with Cremona as her dowry, and Venice kept Ravenna, which it had taken over that year.": "Le 29 juin 1440, près d’Anghiari dans la haute vallée du Tibre, l’armée florentine et papale rencontra les hommes de Piccininos alors qu’ils descendaient de Sansepolcro et les battaient après un long combat pour un pont. Machiavel se moquait plus tard de la bataille, affirmant qu’un seul homme était mort, écrasé après être tombé de son cheval ; les récits modernes donnent des pertes beaucoup plus élevées. La guerre s’est terminée avec la paix de Cremona le 20 novembre 1441. Sforza a épousé Filippo Marias enfant unique, Bianca Maria, avec Cremona comme sa dot, et Venise a gardé Ravenne, qu’elle avait repris cette année-là."
