"1423–1433": "1423–1433"
"Filippo Maria Visconti, Duke of Milan, set out to rebuild the state of his father Gian Galeazzo, which had broken up on his death in 1402. In 1423 he intervened in Forlì, in the Romagna, and Florence, fearing encirclement, went to war; its army was routed at Zagonara in July 1424. In December 1425 Venice joined Florence, urged on by Francesco Bussone, known as Carmagnola, a condottiere who had left Milan’s service. Carmagnola took Brescia for Venice in 1426.": "Filippo Maria Visconti, duc de Milan, a entrepris de reconstruire l’état de son père Gian Galeazzo, qui avait rompu à sa mort en 1402. En 1423 il est intervenu à Forlì, dans la Romagne, et Florence, craignant l’encerclement, est allé en guerre ; son armée a été acheminée à Zagonara en juillet 1424. En décembre 1425 Venise rejoint Florence, avec l’impulsion de Francesco Bussone, connu sous le nom de Carmagnola, un condottière qui avait quitté Milan."
"On 11 October 1427 Carmagnola drew the Milanese army under Carlo Malatesta onto marshy ground near Maclodio, west of Brescia, and destroyed it. Some 8,000 prisoners were taken, and as was usual among the condottieri most were soon released. In the Peace of Ferrara of April 1428 Milan gave up Brescia and Bergamo, carrying Venice’s mainland state west to the Adda. War broke out again in 1431; after several defeats Carmagnola was suspected of double-dealing, lured to Venice, tried and beheaded on 5 May 1432. A second Peace of Ferrara in 1433 confirmed Venice’s gains.": "Le 11 octobre 1427, Carmagnola dessina l’armée milanaise sous Carlo Malatesta sur un terrain marécageux près de Maclodio, à l’ouest de Brescia, et le détruisit. Environ 8 000 prisonniers furent pris, et comme d’habitude parmi les condottieri la plupart furent bientôt libérés. La guerre éclata de nouveau en 1431 ; après plusieurs défaites Carmagnola fut soupçonnée d’avoir fait des doubles transactions, attiré à Venise, essayé et décapité le 5 mai 1432. Une seconde paix de Ferrare en 1433 confirma les gains de Venise."
