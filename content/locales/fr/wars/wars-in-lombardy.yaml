"1446–1454": "1446–1454"
"When Filippo Maria died without a son on 13 August 1447, the Milanese proclaimed a republic, the Golden Ambrosian Republic, and hired Sforza to defend it against Venice, whose army was already advancing on the city. On 15 September 1448 Sforza routed the Venetians at Caravaggio. A month later he changed sides, made his own peace with Venice at Rivoltella and turned on Milan. He blockaded the starving city until it gave in, and on 26 February 1450 he entered it; in March he was proclaimed duke.": "Quand Filippo Maria mourut sans fils le 13 août 1447, les Milanais proclamèrent une république, la République Ambrosienne d’Or, et engageèrent Sforza pour la défendre contre Venise, dont l’armée progressait déjà sur la ville. Le 15 septembre 1448, Sforza dirigea les Vénitiens à Caravaggio. Un mois plus tard, il changea de camp, fit sa propre paix avec Venise à Rivoltella et tourna Milan. Il obtint le blocus de la ville affamée jusqu’à ce qu’elle y cède et, le 26 février 1450, il entra ; en mars on le proclama duc."
"Venice, alarmed, allied with Alfonso V of Naples against Sforza, who had the support of Cosimo de’ Medici’s Florence, and the war went on in 1452–1454 without decisive battles. The fall of Constantinople to the Ottomans in May 1453 and the exhaustion of all sides brought peace. On 9 April 1454 Venice and Milan signed the Peace of Lodi, which recognised Sforza as duke and fixed their border on the Adda, leaving Bergamo, Brescia and Crema to Venice. Florence, Naples and the pope soon joined them in an Italian League that kept the peace between the main Italian states, with interruptions, for forty years.": "Venise, alarmé, allié avec Alfonso V de Naples contre Sforza, qui a eu le soutien de Cosimo de. Médicis Florence, et la guerre se poursuit en 1452-1454 sans batailles décisives. La chute de Constantinople aux Ottomans en mai 1453 et l’épuisement de toutes les parties ont apporté la paix. Le 9 avril 1454, Venise et Milan signèrent la paix de Lodi, qui reconnut Sforza comme duc et fixa leur frontière sur l’Adda, laissant Bergame, Brescia et Crema à Venise. Florence, Naples et le pape les rejoignirent bientôt dans une Ligue italienne qui gardait la paix entre les principaux états italiens, avec des interruptions, pendant quarante ans."
