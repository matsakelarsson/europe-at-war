"Wars in Lombardy": "Guerres en Lombardie"
"Thirty years of intermittent war between the Duchy of Milan under Filippo Maria Visconti and the Republics of Venice and Florence, fought largely by mercenary captains. Venice won Brescia and Bergamo after Maclodio (1427), Florence and the pope beat Milan at Anghiari (1440), and after Visconti’s death the condottiere Francesco Sforza beat Venice at Caravaggio (1448) and made himself duke; the Peace of Lodi in 1454 fixed the Venetian–Milanese border on the Adda and opened forty years of relative peace in Italy.": "Trente années de guerre intermittente entre le duché de Milan sous Filippo Maria Visconti et les Républiques de Venise et Florence, combattues en grande partie par des capitaines mercenaires. Venise a remporté Brescia et Bergamo après Maclodio (1427), Florence et le pape ont battu Milan à Anghiari (1440), et après la mort de Visconti, le condottiere Francesco Sforza a battu Venise à Caravaggio (1448) et s’est fait duc ; la Paix de Lodi en 1454 a fixé la frontière vénitienne-militaine sur l’Adda et ouvert quarante ans de paix relative en Italie."
"The armies were led by condottieri, mercenary captains hired by contract, who often changed employers. Francesco Sforza fought for and against both Milan and Venice before becoming Duke of Milan; Florence, his ally, then fought on Milan’s side.": "Les armées étaient dirigées par condottieri, capitaines mercenaires engagés par contrat, qui changeaient souvent d’employeur. Francesco Sforza s’est battu pour et contre Milan et Venise avant de devenir duc de Milan ; Florence, son allié, a ensuite combattu du côté de Milan."
"Historians divide the fighting into four or five wars between 1423 and 1454, separated by short-lived peaces (Venice 1426, Ferrara 1428 and 1433, Cremona 1441).": "Les historiens divisent les combats en quatre ou cinq guerres entre 1423 et 1454, séparées par des paixs de courte durée (Venise 1426, Ferrare 1428 et 1433, Cremona 1441)."
