# Some French text was translated automatically.
"Wars of Castro": "Guerres de Castro"
? "Two wars between the papacy and the Farnese dukes of Parma over the Duchy of Castro, their fief in northern Lazio. After Odoardo Farnese quarrelled with Pope Urban VIII’s Barberini nephews, Rome stopped buying grain from Castro, and Odoardo could not pay his Roman creditors. On 12 October 1641 a papal army took Castro almost without a fight, and the pope excommunicated Odoardo. In 1642 Odoardo’s cavalry rode deep into the Papal States and threatened Rome, and Venice, Tuscany and Modena allied with him. After fighting in the Po valley and around Lake Trasimeno, the papal army was beaten at Lagoscuro, near Ferrara, on 17 March 1644, and a peace signed at Ferrara on 31 March gave Castro back. In 1649 Odoardo’s son Ranuccio II stopped paying the creditors, and after the new bishop of Castro was murdered, Pope Innocent X sent troops who took the town. On 2 September 1649 Castro was razed on the pope’s orders, and a column was put up saying ‘Here stood Castro’. The duchy passed to the Papal States."
: "Deux guerres opposent la papauté aux ducs de Parme de la famille Farnèse pour le duché de Castro, leur fief dans le nord du Latium. Après une querelle entre Édouard Farnèse et les neveux du pape Urbain VIII, de la famille Barberini, Rome cesse d’acheter le blé de Castro et le duc ne peut plus rembourser ses créanciers romains. Le 12 octobre 1641, l’armée pontificale prend Castro presque sans combat et le pape excommunie le duc. En 1642, sa cavalerie pénètre dans les États pontificaux et menace Rome. Venise, la Toscane et Modène se rangent à ses côtés. Après des combats dans la plaine du Pô et autour du lac Trasimène, l’armée pontificale est battue à Lagoscuro, près de Ferrare, le 17 mars 1644. La paix signée à Ferrare le 31 mars restitue Castro aux Farnèse. En 1649, Ranuce II, fils d’Édouard, suspend les paiements aux créanciers. Après l’assassinat du nouvel évêque de Castro, le pape Innocent X envoie des troupes qui prennent la ville. Le 2 septembre 1649, Castro est rasée sur ordre du pape. Une colonne porte la mention « Ici se trouvait Castro ». Le duché passe aux États pontificaux."
"Dates are Gregorian. Parma fought alone in the second war of 1649.": "Les dates sont grégorien. Parma a combattu seul dans la deuxième guerre de 1649."
"The first war cost the papacy about 12 million scudi, raised by heavy taxes on Rome. After Urban VIII died in July 1644 his nephews fled to France.": "La première guerre a coûté à la papauté environ 12 millions de scudi, élevés par les lourdes taxes sur Rome. Après la mort d’Urban VIII en juillet 1644 ses neveux ont fui en France."
