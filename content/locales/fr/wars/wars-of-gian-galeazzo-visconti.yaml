"Wars of Gian Galeazzo Visconti": "Guerres de Gian Galeazzo Visconti"
? "The wars between Gian Galeazzo Visconti, lord and from 1395 Duke of Milan, and Florence and its allies, as Visconti built a state that covered most of northern and central Italy. Having taken Verona in 1387 and Padua in 1388, he went to war with Florence and Bologna in 1390. Florence’s captain John Hawkwood invaded Lombardy in 1391 but had to retreat, and its French ally, the Count of Armagnac, was defeated and killed outside Alessandria that July; the Peace of Genoa of 1392 settled little. After an attack on Mantua and a truce in 1398, Visconti bought Pisa in 1399 and took Siena, Perugia and much of Umbria under his rule, and in 1401 his army turned back the German king Rupert near Brescia. On 26 June 1402 it routed the Bolognese and Florentines at Casalecchio and took Bologna, leaving Florence isolated, but Gian Galeazzo died of plague at Melegnano on 3 September 1402, and his state broke up among his captains and young sons."
: "Les guerres entre Gian Galeazzo Visconti, seigneur et de 1395 duc de Milan, et Florence et ses alliés, comme Visconti construit un État qui couvrait la majeure partie de l’Italie septentrionale et centrale. Ayant pris Vérone en 1387 et Padoue en 1388, il est allé à la guerre avec Florence et Bologne en 1390. Le capitaine de Florence John Hawkwood envahit la Lombardie en 1391 mais dut se retirer, et son allié français, le comte d’Armagnac, fut vaincu et tué hors d’Alessandria ce juillet ; la paix de Gênes de 1392 s’installa peu. Après une attaque contre Mantoue et une trêve en 1398, Visconti acheta Pise en 1399 et prit Sienne, Pérouse et une grande partie de l’Ombrie sous sa domination, et en 1401 son armée retourna le roi allemand Rupert près de Brescia. Le 26 juin 1402, il parcourt la Bologne et les Florentines à Casalecchio et prend Bologne, laissant Florence isolée, mais Gian Galeazzo meurt de peste à Melegnano le 3 septembre 1402, et son état se sépare entre ses capitaines et ses jeunes fils."
"Francesco Gonzaga of Mantua joined the league against Milan in 1397 but later went over to Visconti, and commanded troops for him at Casalecchio.": "Francesco Gonzaga de Mantua rejoint la ligue contre Milan en 1397, mais plus tard passe à Visconti, et commande des troupes pour lui à Casalecchio."
"Francesco Novello da Carrara recovered Padua from Milan in 1390 and remained Florence’s ally. Florentine writers such as Leonardo Bruni later presented the war as a defence of republican liberty against tyranny.": "Francesco Novello da Carrara a récupéré Padoue de Milan en 1390 et est resté l’allié de Florence. Les écrivains florentins tels que Leonardo Bruni plus tard présenté la guerre comme une défense de la liberté républicaine contre la tyrannie."
