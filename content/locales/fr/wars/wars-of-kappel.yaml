# Some French text was translated automatically.
"Wars of Kappel": "Guerres de Kappel"
? "Two wars between the Protestant and Catholic cantons of the Swiss Confederacy during the Reformation, named after Kappel am Albis on the border between Zürich and Zug. In June 1529 Zürich, led by the reformer Huldrych Zwingli, declared war on the five Catholic cantons of central Switzerland (Lucerne, Uri, Schwyz, Unterwalden and Zug), but the armies did not fight, and the First Peace of Kappel on 26 June made the Catholics give up their alliance with Austria. In 1531 a food blockade by Zürich and Bern drove the five cantons to declare war on 9 October. Two days later they routed the outnumbered Zürich army at Kappel, killing some 500 men, among them Zwingli, and on the night of 23–24 October beat a larger Protestant force on the Gubel near Menzingen. The Second Peace of Kappel, signed on 20 November 1531, let each canton choose its own faith but favoured Catholicism in the common territories, and checked the spread of the Reformation in Switzerland."
: "Deux guerres entre les cantons protestant et catholique de la Confédération suisse pendant la Réforme, nommées d’après Kappel am Albis à la frontière entre Zürich et Zug. En juin 1529, Zürich, dirigé par le réformateur Huldrych Zwingli, déclare la guerre aux cinq cantons catholiques de Suisse centrale (Lucerne, Uri, Schwyz, Unterwalden et Zug), mais les armées ne se battent pas, et la première paix de Kappel, le 26 juin, fait renoncer les catholiques à leur alliance avec l’Autriche. En 1531, un blocus alimentaire par Zürich et Bern conduisit les cinq cantons à déclarer la guerre le 9 octobre. Deux jours plus tard, ils acheminèrent l’armée züriche plus nombreuse à Kappel, tuant quelque 500 hommes, dont Zwingli, et dans la nuit du 23 au 24 octobre, ils battirent une force protestante plus importante sur le Gubel près de Menzingen. La Deuxième Paix de Kappel, signée le 20 novembre 1531, permet à chaque canton de choisir sa propre foi mais favorise le catholicisme dans les territoires communs, et contrôle la propagation de la Réforme en Suisse."
"The armies’ meal together at Kappel in 1529, when soldiers from Zug are said to have brought milk and those from Zürich bread, became known as the Kappeler Milchsuppe, a symbol of Swiss reconciliation.": "En 1529, les armées se régalent à Kappel, quand on dit que des soldats de Zug ont apporté du lait et ceux de Zürich, sont connus sous le nom de Kappeler Milchsuppe, symbole de réconciliation suisse."
"Both sides belonged to the Swiss Confederacy, which the map shows as one state.": "Les deux côtés appartenaient à la Confédération suisse, que la carte montre comme un seul état."
