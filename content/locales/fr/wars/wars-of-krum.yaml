"In 812 Krum took Develtos and, that autumn, the port of Mesembria, where he captured a supply of Greek fire and the bronze tubes used to throw it. Nikephoros’s son-in-law, Michael I, refused his offer of peace. In June 813 Michael led a large army north and met Krum near Versinikia, north of Adrianople. After two weeks of waiting the Byzantines attacked on 22 June and were routed. Byzantine writers later suspected Leo the Armenian, whose Anatolian troops were among the first to leave the field. Within weeks Michael had abdicated and Leo was emperor.": "En 812 Krum prit Develtos et, cet automne-là, le port de Mesembria, où il captura un approvisionnement en feu grec et les tubes de bronze utilisés pour le lancer. Nikephoros's gendre, Michael Ier, refusa son offre de paix.En juin 813 Michel mena une grande armée au nord et rencontra Krum près de Versinikia, au nord d’Adrianople. Après deux semaines d’attente, les Byzantins attaquèrent le 22 juin et furent chassés. Des écrivains byzantins soupçonnèrent plus tard Léon l’Arménien, dont les troupes anatoliennes étaient parmi les premiers à quitter le champ."
"On 17 July Krum appeared before Constantinople and made sacrifices outside the Golden Gate. Leo invited him to a parley and set archers to kill him; Krum escaped wounded. In revenge he burned the suburbs, took Adrianople and carried thousands of its people off beyond the Danube, among them the family of the future emperor Basil I. He was preparing siege engines for an assault on the city when he died on 13 April 814. His son Omurtag made a thirty-year peace in 815 or 816. The frontier ran from Develtos inland along an earthwork, later called the Erkesia, and it held for most of the century.": "Le 17 juillet, Krum parut devant Constantinople et fit des sacrifices à l’extérieur de la Porte d’Or. Léo l’invita à un pâté et mit des archers pour le tuer ; Krum s’échappa blessé. En revanche, il brûla les banlieues, prit Adrianople et transporta des milliers de personnes au-delà du Danube, dont la famille du futur empereur Basil Ier. Son fils Omurtag fit une paix de trente ans en 815 ou 816. La frontière courut de Develtos à l’intérieur du pays le long d’un ouvrage, plus tard appelé l’Erkesia, et il a tenu pendant la majeure partie du siècle."
