"In the summer of 811 Nikephoros invaded Bulgaria with a large army drawn from the themes of Thrace and Asia Minor and the guard regiments, and his son Staurakios at his side. He refused Krum’s offers of peace at the frontier fortress of Marcellae, crossed the Balkan Mountains and, after beating the forces Krum could gather in haste, took Pliska on 20 July. The palace was looted and burned. Later sources describe the Byzantine troops killing the people of the town, children among them.": "Au cours de l’été 811 Nikephoros envahit la Bulgarie avec une grande armée tirée des thèmes de Thrace et d’Asie Mineure et les régiments de garde, et son fils Staurakios à ses côtés. Il refusa les offres de paix de Krum dans la forteresse frontalière de Marcellae, traversa les montagnes balkaniques et, après avoir battu les forces Krum pu se rassembler en hâte, prit Pliska le 20 juillet. Le palais a été pillé et brûlé. Des sources plus tard décrivent les troupes byzantines tuant la population de la ville, des enfants parmi eux."
"Krum armed everyone he could and blocked the passes with ditches and wooden palisades. As the army marched south through a narrow valley, usually identified as the Varbitsa Pass, it found itself trapped, and at dawn on 26 July the Bulgarians fell on its camp. The army broke; many men died at the palisades or in a river. Nikephoros was killed, the first Byzantine emperor to die in battle since Valens in 378. Theophanes writes that Krum had his skull lined with silver and drank from it. Staurakios, badly wounded in the neck, reigned for a few weeks and died in 812.": "Krum a armé tout le monde qu’il pouvait et bloqué les cols avec des fossés et des palissades en bois. Alors que l’armée marchait au sud à travers une vallée étroite, généralement identifiée comme le col de Varbitsa, elle se trouvait piégée, et à l’aube le 26 juillet les Bulgares tombaient sur son camp. L’armée s’est cassée ; beaucoup d’hommes sont morts aux palissades ou dans une rivière. Nikephoros a été tué, le premier empereur byzantin à mourir au combat depuis Valens en 378. Theophanes écrit que Krum avait son crâne doublé d’argent et bu de lui. Staurakios, gravement blessé dans le cou, régna pendant quelques semaines et mourut en 812."
