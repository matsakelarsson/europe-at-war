"Krum, who became khan of the Bulgars around 800, first turned north-west, where the Avar khaganate had been broken by Charlemagne’s Franks; by about 805 he had taken over its eastern lands, bringing Bulgaria to the borders of the Frankish empire. In the south lay the Byzantine Empire, ruled since 802 by Nikephoros I, a former finance minister who meant to recover the Balkans. His first campaign, in 807, got no further than Adrianople, where he turned back after discovering a plot against him.": "Krum, devenu khan des Bulgares vers 800, a d’abord tourné au nord-ouest, où le khaganate Avar avait été brisé par Charlemagnes Franks ; vers 805 il avait repris ses terres orientales, apportant la Bulgarie aux frontières de l’empire franquais. Dans le sud se trouve l’Empire byzantin, gouverné depuis 802 par Nikephoros Ier, un ancien ministre des finances qui voulait récupérer les Balkans. Sa première campagne, en 807, n’a pas été plus loin qu’Adrianople, où il a tourné en arrière après avoir découvert un complot contre lui."
"In 808 or 809 the Bulgarians surprised a Byzantine army in the valley of the Struma and captured the money sent to pay it. Then, shortly before Easter 809, Krum took Serdica, the Byzantine stronghold on the main road across the Balkans. Theophanes writes that he killed the garrison of 6,000 men and many civilians, although they had surrendered on terms. Nikephoros marched north, claimed to have reached Krum’s capital, Pliska, and tried to rebuild Serdica. In 810 he moved settlers from Asia Minor into the Slav lands on the frontier to hold it.": "En 808 ou 809 les Bulgares ont surpris une armée byzantine dans la vallée du Struma et capturé l’argent envoyé pour le payer. Puis, peu avant Pâques 809, Krum a pris Serdica, la forteresse byzantine sur la route principale à travers les Balkans. Theophanes écrit qu’il a tué la garnison de 6.000 hommes et de nombreux civils, bien qu’ils se soient rendus à des conditions. Nikephoros marcha vers le nord, prétendit avoir atteint la capitale de Krums, Pliska, et tenta de reconstruire Serdica. En 810, il emménagea des colons d’Asie Mineure dans les terres slaves à la frontière pour les tenir."
