"Krum’s wars with Byzantium": "Krums guerres avec Byzance"
"The wars between Khan Krum of Bulgaria and the Byzantine Empire, in which Krum took Serdica (Sofia), destroyed the army of the Emperor Nikephoros I in the Balkan passes in 811 and killed him, routed Michael I at Versinikia in 813 and stood before the walls of Constantinople. After Krum’s death in 814 his son Omurtag made a thirty-year peace that fixed the frontier in northern Thrace.": "Les guerres entre Khan Krum de Bulgarie et l’Empire byzantin, au cours desquelles Krum a pris Serdica (Sofia), ont détruit l’armée de l’empereur Nikephoros I dans les cols des Balkans en 811 et l’ont tué, conduit Michael Ier à Versinikia en 813 et se tenait devant les murs de Constantinople. Après la mort de Krum en 814, son fils Omurtag fit une paix de trente ans qui fixa la frontière dans le nord de Thrace."
"The main source is the chronicle of Theophanes the Confessor, a contemporary who was hostile to Nikephoros I, with a fragment by an anonymous writer (the Scriptor Incertus) for 811–815. Both were written on the Byzantine side; Bulgarian inscriptions add a little. Numbers are uncertain, and some events (the Struma defeat, the peace) are dated a year apart in different accounts.": "La source principale est la chronique de Théophanes le Confesseur, un contemporain qui a été hostile à Nikephoros I, avec un fragment par un écrivain anonyme (le scriptor Incertus) pour 811-815. Tous deux ont été écrits du côté byzantin ; les inscriptions bulgares ajoutent un peu. Les nombres sont incertains, et certains événements (la défaite de Struma, la paix) sont datés d’un an dans différents récits."
"Krum’s title was khan (in the inscriptions kanasubigi). Serdica is today’s Sofia, Develtos stood near Debelt south of Burgas, Mesembria is Nesebar, Adrianople is Edirne and Arcadiopolis is Lüleburgaz in Turkey.": "Le titre du Krum est khan (dans les inscriptions kanasubigi). Serdica est aujourd'hui à Sofia, Develtos se tenait près de Debelt au sud de Burgas, Mesembria est Nesebar, Adrianople est Edirne et Arcadiopolis est Lüleburgaz en Turquie."
