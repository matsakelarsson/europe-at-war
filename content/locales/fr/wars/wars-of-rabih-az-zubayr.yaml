# French translations of the catalogue text (wave 12); step bodies follow later.
Wars of Rabih az-Zubayr: Guerres de Rabah
? "The wars of Rabih az-Zubayr, a Sudanese soldier and slave trader who led the remnant of al-Zubayr Rahma Mansur’s private army from the Bahr el-Ghazal across Central Africa and made himself master of the ancient empire of Bornu. After the Egyptian government of the Sudan crushed the revolt of al-Zubayr’s son Suleiman in 1879, Rabih escaped west with about 400 men. For twelve years his army raided the peoples of today’s Central African Republic and southern Chad for captives and ivory, growing to some 5,000 riflemen. In 1892–1893 he drove the king of Baguirmi from Massenya, and in 1893–1894 he defeated the armies of the al-Kanemi shehus, sacked Kukawa and ruled Bornu from Dikwa as a military state. France, which claimed the Chad basin, declared him a usurper: his army destroyed a French column at Togbao in July 1899 and held off another at Kouno in October, but on 22 April 1900 three French columns, from the Congo, the Niger and Algeria, joined at Kousséri and defeated him; Rabih and the French commander, Amédée-François Lamy, were both killed. Rabih’s son Fadlallah fought on in the British sphere until he was killed at Gujba in August 1901. Rabih is remembered in Bornu and southern Chad for depopulation and devastation, and by others as one of the last great opponents of French rule in Africa."
: "Les guerres de Rabah (Rabih az-Zubayr), soldat et marchand d’esclaves soudanais qui conduisit les restes de l’armée privée d’al-Zubayr Rahma Mansur du Bahr el-Ghazal à travers l’Afrique centrale et se rendit maître de l’ancien empire du Bornou. Après que le gouvernement égyptien du Soudan eut écrasé la révolte de Suleiman, fils d’al-Zubayr, en 1879, Rabah s’enfuit vers l’ouest avec environ 400 hommes. Pendant douze ans, son armée razzia les peuples de l’actuelle République centrafricaine et du sud du Tchad pour en tirer des captifs et de l’ivoire, et finit par compter quelque 5 000 fusiliers. En 1892–1893, il chassa le roi du Baguirmi de Massenya et, en 1893–1894, il vainquit les armées des shehus al-Kanemi, saccagea Kukawa et gouverna le Bornou depuis Dikwa comme un État militaire. La France, qui revendiquait le bassin du Tchad, le déclara usurpateur : son armée anéantit une colonne française à Togbao en juillet 1899 et en tint une autre en échec à Kouno en octobre, mais le 22 avril 1900, trois colonnes françaises venues du Congo, du Niger et d’Algérie firent leur jonction à Kousséri et le vainquirent ; Rabah et le commandant français, Amédée-François Lamy, y furent tués tous deux. Le fils de Rabah, Fadlallah, poursuivit la lutte dans la zone d’influence britannique jusqu’à sa mort à Gujba en août 1901. Au Bornou et dans le sud du Tchad, on se souvient de Rabah pour le dépeuplement et les dévastations qu’il causa, tandis que d’autres voient en lui l’un des derniers grands adversaires de la domination française en Afrique."
