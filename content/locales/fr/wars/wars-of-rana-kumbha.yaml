# French translations of the catalogue text (wave 8); step bodies follow later.
Wars of Rana Kumbha: Guerres de Rana Kumbha
"The wars of Rana Kumbha, king of Mewar from 1433 to 1468, against the sultans of Malwa and Gujarat. When Sultan Mahmud Khalji of Malwa sheltered Mahpa Panwar, one of the murderers of Kumbha’s father, Kumbha marched against him and defeated him at Sarangpur in 1437; Mewar’s inscriptions say he took the sultan to Chittor as a prisoner and freed him after six months. Mahmud Khalji answered with almost yearly invasions: between 1442 and 1446 he attacked Kumbhalgarh and Chittor and fought indecisive battles at Mandalgarh and on the Banas, in 1444 he took the fort of Gagron, and in 1457 Mandalgarh. Kumbha’s capture of Nagaur in 1456 brought Gujarat into the war, and late that year the two sultans agreed at Champaner to divide Mewar between them. Their armies ravaged the country and besieged Kumbhalgarh, but neither took Kumbhalgarh or Chittor, and Kumbha held his kingdom until his son Udaysimha murdered him in 1468.": "Les guerres de Rana Kumbha, roi du Mewar de 1433 à 1468, contre les sultans du Malwa et du Goujarat. Lorsque le sultan Mahmud Khalji du Malwa donna asile à Mahpa Panwar, l’un des meurtriers du père de Kumbha, celui-ci marcha contre lui et le vainquit à Sarangpur en 1437 ; selon les inscriptions du Mewar, il emmena le sultan prisonnier à Chittor et le libéra au bout de six mois. Mahmud Khalji riposta par des invasions presque annuelles : entre 1442 et 1446, il attaqua Kumbhalgarh et Chittor et livra des batailles indécises à Mandalgarh et sur la Banas ; en 1444, il prit le fort de Gagron, et en 1457 Mandalgarh. La prise de Nagaur par Kumbha en 1456 entraîna le Goujarat dans la guerre et, à la fin de cette année-là, les deux sultans convinrent à Champaner de se partager le Mewar. Leurs armées ravagèrent le pays et assiégèrent Kumbhalgarh, mais aucune ne prit Kumbhalgarh ni Chittor, et Kumbha conserva son royaume jusqu’à ce que son fils Udaysimha l’assassine en 1468."
