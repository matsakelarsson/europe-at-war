"Henry VI had been king since he was nine months old. By 1453 almost all of English France was lost, and that August he fell into a stupor that lasted more than a year. Richard, Duke of York, the greatest landowner in England and a royal kinsman with his own claim to the throne, was made Protector and had his rival Edmund Beaufort, Duke of Somerset, sent to the Tower. When the king recovered, Somerset was freed and York shut out. On 22 May 1455 York and his allies, the Neville earls of Salisbury and Warwick, fought the king’s party in the streets of St Albans. Somerset was killed and Henry taken.": "Henri VI était roi depuis l’âge de neuf mois. En 1453, presque toute la France anglaise fut perdue, et qu’août il tomba dans une stupeur qui dura plus d’un an. Richard, duc d’York, le plus grand propriétaire foncier en Angleterre et un parent royal avec sa propre revendication au trône, fut fait Protecteur et fit envoyer son rival Edmund Beaufort, duc de Somerset, à la Tour. Le 22 mai 1455, York et ses alliés, les comtes de Neville de Salisbury et Warwick, combattirent le parti du roi dans les rues de St Albans. Somerset fut tué et Henry pris."
"An uneasy peace followed, with Queen Margaret of Anjou leading the court. Fighting resumed in 1459. Salisbury won at Blore Heath, but at Ludford Bridge the Yorkist army broke up when the Calais garrison went over to the king. York fled to Ireland, and his son Edward, Earl of March, went with Salisbury and Warwick to Calais. A parliament at Coventry declared them all traitors. In June 1460 the earls landed at Sandwich, entered London and, on 10 July, beat the royal army at Northampton and captured the king. In October Parliament made York Henry’s heir, passing over the king’s own son.": "Une paix difficile suivit, avec la reine Margaret d’Anjou à la tête de la cour. Les combats reprirent en 1459. Salisbury gagna à Blore Heath, mais à Ludford Bridge l’armée Yorkiste rompit lorsque la garnison de Calais alla vers le roi. York s’enfuit en Irlande, et son fils Edward, comte de mars, partit avec Salisbury et Warwick à Calais. Un parlement de Coventry les déclara tous traîtres. En juin 1460, les comtes débarquent à Sandwich, entrent à Londres et, le 10 juillet, battent l’armée royale de Northampton et capturent le roi."
