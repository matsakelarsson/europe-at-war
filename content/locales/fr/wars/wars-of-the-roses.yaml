"1483–1485": "1483–1485"
"Edward IV died on 9 April 1483, leaving a twelve-year-old son, Edward V. The boy’s uncle, Richard, Duke of Gloucester, took charge of him, had the queen’s kinsmen arrested and later executed, and in June had Edward IV’s children declared illegitimate. He was crowned Richard III on 6 July. Edward V and his younger brother were not seen outside the Tower after that summer, and most people came to believe they had been killed. A rising that autumn, joined by Richard’s former ally the Duke of Buckingham, failed, and Buckingham was beheaded at Salisbury.": "Edward IV mourut le 9 avril 1483, laissant un fils de douze ans, Edward V. L’oncle du garçon, Richard, duc de Gloucester, prit sa charge, fit arrêter et exécuter la reine par la suite, et en juin fit déclarer illégitimes les enfants d’Édouard IV. Il fut couronné Richard III le 6 juillet. Edward V et son frère cadet n’ont pas été vus à l’extérieur de la tour après cet été-là, et la plupart des gens sont venus croire qu’ils avaient été tués."
"Henry Tudor, Earl of Richmond, the Lancastrian claimant through his mother Margaret Beaufort, had lived in exile in Brittany since 1471. At Christmas 1483 he swore in Rennes Cathedral to marry Edward IV’s daughter Elizabeth. With French money, ships and mercenaries he landed at Mill Bay in Pembrokeshire on 7 August 1485 and gathered men as he marched through Wales. On 22 August he met Richard’s larger army near Market Bosworth. Richard charged at Henry with his household knights, Sir William Stanley’s men then fell on him, and he was killed, the last English king to die in battle.": "Henry Tudor, comte de Richmond, le demandeur Lancastrian par l’intermédiaire de sa mère Margaret Beaufort, vivait en exil en Bretagne depuis 1471. À Noël 1483, il jura à la cathédrale de Rennes d’épouser Elizabeth, fille d’Edward IV. Avec de l’argent français, des navires et des mercenaires, il débarqua à Mill Bay dans le Pembrokeshire le 7 août 1485 et rassembla des hommes qui marchaient au Pays de Galles. Le 22 août, il rencontra une plus grande armée de Richards près de Market Bosworth. Richard chargea Henry de ses chevaliers domestiques, les hommes de sir William Stanley s’écroulèrent alors sur lui, et il fut tué, le dernier roi anglais à mourir au combat."
