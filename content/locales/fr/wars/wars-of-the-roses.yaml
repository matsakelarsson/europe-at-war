"1483": "1483"
"Wars of the Roses": "Guerres des Roses"
"The civil wars for the English throne between the houses of Lancaster and York, two branches of the royal Plantagenet family. They began when Richard, Duke of York, challenged the court of the feeble Henry VI, brought Edward IV to the throne at Towton in 1461 and again at Barnet and Tewkesbury in 1471, and ended when Henry Tudor defeated Richard III at Bosworth in 1485 and crushed the last Yorkist rising at Stoke in 1487.": "Les guerres civiles pour le trône anglais entre les maisons de Lancaster et York, deux branches de la famille royale Plantagenet. Ils commencèrent quand Richard, duc d’York, contesta la cour du faible Henry VI, apporta Edward IV au trône de Towton en 1461 et à nouveau à Barnet et Tewkesbury en 1471, et se terminèrent lorsque Henry Tudor battit Richard III à Bosworth en 1485 et écrasa le dernier Yorkiste qui montait à Stoke en 1487."
"Dates are Julian (Old Style), as in English sources of the time. The chroniclers’ figures for armies and the dead are often far too large; modern estimates are given where they differ.": "Les dates sont Julian (Ancien Style), comme dans les sources anglaises de l’époque. Les chiffres chroniques pour les armées et les morts sont souvent beaucoup trop grands ; des estimations modernes sont données là où elles diffèrent."
"The name “Wars of the Roses” came into common use only in the 19th century. The white rose was a Yorkist badge, but the red rose of Lancaster was mostly a Tudor invention; Henry VII’s Tudor rose joined the two. Contemporaries spoke simply of the civil wars.": "Le nom « Guerres des Roses » n’est devenu courant qu’au XIXe siècle. La rose blanche est un insigne Yorkiste, mais la rose rouge de Lancaster est surtout une invention Tudor ; Henry VII » la rose Tudor rejoint les deux. Les contemporains parlent simplement des guerres civiles."
"Several leading figures changed sides, above all Richard Neville, Earl of Warwick, “the Kingmaker”, who fought for York until 1469 and died fighting for Lancaster in 1471.": "Plusieurs personnalités ont changé de camp, surtout Richard Neville, comte de Warwick, le Kingmaker, qui s’est battu pour York jusqu’en 1469 et est mort en 1471."
