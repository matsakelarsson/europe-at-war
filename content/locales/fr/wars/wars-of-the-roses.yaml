"Mechelen": "Malines"
"Margaret of York, Edward IV’s sister and widow of Charles the Bold, kept her court here and backed the plot with money and soldiers.": "Margaret de York, Edward IV, sœur et veuve de Charles le Bold, a gardé sa cour ici et soutenu l’intrigue avec de l’argent et des soldats."
"24 May 1487": "24 mai 1487"
"The Earl of Kildare, the king’s deputy, and most of the lords of the Pale accepted the boy as king, and he was crowned in Christ Church Cathedral.": "Le comte de Kildare, l’adjoint du roi et la plupart des seigneurs du Pale acceptèrent le garçon comme roi, et il fut couronné dans la cathédrale Christ Church."
"Furness": "Fourrure"
"4 June 1487": "4 juin 1487"
"The rebel fleet landed near Piel Island, on the Lancashire coast opposite Ireland.": "La flotte rebelle débarque près de l’île Piel, sur la côte du Lancashire en face de l’Irlande."
"Kenilworth": "Kenilworth"
"May 1487": "mai 1487"
"Henry gathered his army at the castle in the Midlands, ready to move north.": "Henry rassembla son armée au château des Midlands, prêt à se diriger vers le nord."
"16 June 1487": "16 juin 1487"
"The battle lasted about three hours on a ridge above the Trent. Almost all the rebel leaders were killed; Lord Lovell disappeared and was never seen again.": "La bataille a duré environ trois heures sur une crête au-dessus de la Trente. Presque tous les chefs rebelles ont été tués ; Lord Lovell disparu et n’a jamais été revu."
