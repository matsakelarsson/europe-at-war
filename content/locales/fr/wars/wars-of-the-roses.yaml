"1486–1487": "1486–1487"
"Henry VII was crowned on 30 October 1485 and married Elizabeth of York in January 1486, joining the two houses, but his hold on the throne was weak. A boy of about ten, Lambert Simnel, was coached by an Oxford priest to pose as Edward, Earl of Warwick, the Yorkist heir whom Henry kept in the Tower. The plot was taken up by John de la Pole, Earl of Lincoln, Richard III’s nephew, and by Edward IV’s sister Margaret of York, dowager duchess of Burgundy, who paid for about 2,000 mercenaries, mostly German, under Martin Schwartz. In Ireland the Earl of Kildare and the Anglo-Irish lords took up the cause, and on 24 May 1487 Simnel was crowned “Edward VI” in Dublin.": "Henri VII fut couronné le 30 octobre 1485 et épousa Elizabeth de York en janvier 1486, rejoignant les deux maisons, mais sa main sur le trône était faible. Un garçon d’environ dix ans, Lambert Simnel, fut entraîné par un prêtre d’Oxford pour se présenter comme Edward, comte de Warwick, l’héritier Yorkais qu’Henry gardait dans la Tour. L’intrigue fut reprise par John de la Pole, comte de Lincoln, neveu de Richard III et par Edward IV Margaret de York, dowager duchesse de Bourgogne, qui paya environ 2000 mercenaires, principalement allemands, sous Martin Schwartz. En Irlande, le comte de Kildare et les seigneurs anglo-irlandais ont pris la cause, et le 24 mai 1487 Simnel a été couronné \"Edward VI\" à Dublin."
"The rebels, with several thousand Irish troops, landed at Furness in Lancashire on 4 June and marched across the Pennines and south towards Newark, finding little support. Henry met them at East Stoke on 16 June. The mercenaries fought hard and the lightly armed Irish suffered terribly, but the rebel army was destroyed; Lincoln and Schwartz were killed. Henry pardoned the boy and put him to work in the royal kitchens. Another pretender, Perkin Warbeck, troubled the king in the 1490s, but Stoke was the last battle between armies fighting for the throne.": "Les rebelles, avec plusieurs milliers de troupes irlandaises, débarquèrent à Furness dans le Lancashire le 4 juin et marchèrent à travers les Pennines et au sud vers Newark, trouvant peu de soutien. Henry les rencontra à East Stoke le 16 juin. Les mercenaires luttaient dur et les Irlandais légèrement armés souffraient terriblement, mais l’armée rebelle fut détruite ; Lincoln et Schwartz furent tués. Henry pardonna le garçon et le mit au travail dans la cuisine royale. Un autre prétendant, Perkin Warbeck, a troublé le roi dans les années 1490, mais Stoke a été la dernière bataille entre les armées combattant pour le trône."
