"1469–1471": "1469–1471"
"In 1464 Edward IV secretly married Elizabeth Woodville, a widow from a minor family, while Warwick was negotiating a French match for him. The rise of her relatives, and Edward’s alliance with Burgundy against France, drove Warwick into opposition. In 1469 he and the king’s brother George, Duke of Clarence, stirred up a rising in the north; its men beat a royal army at Edgcote on 24 July, and the queen’s father and a brother were executed. Edward was held for a time but regained control. In 1470 a second rising was crushed at Losecoat Field, and Warwick and Clarence fled to France, where Louis XI reconciled Warwick with Margaret of Anjou.": "En 1464, Edward IV épousa secrètement Elizabeth Woodville, veuve d’une famille mineure, tandis que Warwick négociait un match français pour lui. La montée de sa famille et l’alliance d’Edward avec la Bourgogne contre la France ont poussé Warwick à s’opposer. En 1469, lui et le roi George frère, duc de Clarence, se sont levés dans le nord ; ses hommes ont battu une armée royale à Edgcote le 24 juillet, et le père et un frère de la reine ont été exécutés. Edward a été tenu pendant un temps mais a repris le contrôle. En 1470, une seconde montée fut écrasée au champ de Losecoat, et Warwick et Clarence s’enfuirent en France, où Louis XI réconcilia Warwick avec Margaret d’Anjou."
"Warwick landed in Devon in September 1470. Outnumbered, Edward fled from King’s Lynn to the Low Countries, ruled by his brother-in-law Charles the Bold, and Henry VI was brought out of the Tower and restored. With Burgundian help Edward landed at Ravenspurn on the Humber in March 1471, won Clarence back and entered London. On 14 April, in fog at Barnet, he beat and killed Warwick. That day Margaret and her son landed at Weymouth; Edward caught them at Tewkesbury on 4 May. The prince was killed, and Henry VI died in the Tower on the night Edward returned to London, almost certainly on his orders.": "Warwick débarqua à Devon en septembre 1470. Épuisé, Edward s’enfuit du roi Lynn aux Pays-Bas, dirigé par son beau-frère Charles le Bold, et Henry VI fut fait sortir de la Tour et restauré. Avec l’aide bourguignonne Edward débarqua à Ravenspurn sur le Humber en mars 1471, remporta Clarence et entra à Londres. Le 14 avril, dans le brouillard à Barnet, il battit et tua Warwick. Ce jour-là, Margaret et son fils débarquèrent à Weymouth ; Edward les attrapent à Tewkesbury le 4 mai. Le prince est tué, et Henry VI meurt dans la Tour la nuit où Edward revient à Londres, presque certainement sur ses ordres."
