"1460–1464": "1460–1464"
"Queen Margaret would not accept her son’s disinheritance, and the northern lords gathered an army for her. York marched north to meet it, and on 30 December 1460 he left Sandal Castle to fight outside Wakefield and was killed with his son Edmund; Salisbury was beheaded at Pontefract the next day. The queen’s army moved south, plundering as it went, beat Warwick at the second battle of St Albans on 17 February 1461 and recovered the king. But London shut its gates, and the army turned back north. York’s eldest son Edward had already won at Mortimer’s Cross, and on 4 March he was proclaimed king in London as Edward IV.": "La reine Margaret n’accepta pas la déshéritage de son fils, et les seigneurs du nord rassemblèrent une armée pour elle. York marcha vers le nord pour la rencontrer, et le 30 décembre 1460, il quitta Sandal Castle pour se battre à l’extérieur de Wakefield et fut tué avec son fils Edmund ; Salisbury fut décapité à Pontefract le lendemain. L’armée de la reine se déplaçait vers le sud, pillant à son tour, battit Warwick lors de la deuxième bataille de St Albans le 17 février 1461 et récupéra le roi. Mais Londres ferma ses portes, et l’armée retourna au nord."
"Edward followed the Lancastrians north. On 29 March, Palm Sunday, the armies met near Towton in a snowstorm and fought for most of the day, until the Duke of Norfolk’s late arrival turned the Lancastrian flank and the rout ended at the Cock Beck, where many drowned. The heralds were said to have counted 28,000 dead. Modern historians think that too high, but Towton was probably the largest and bloodiest battle ever fought on English soil. Henry and Margaret fled to Scotland and gave it Berwick for its help. Lancastrians held out in the Northumberland castles until 1464; Henry was captured in 1465.": "Edward suivit les Lancastrians au nord. Le 29 mars, dimanche des Rameaux, les armées se rencontrèrent près de Towton dans une tempête de neige et combattèrent pendant la majeure partie de la journée, jusqu’à ce que le duc de Norfolk arrivât tard à tourner le flanc de Lancastrian et que la rout finisse au Cock Beck, où beaucoup se noyaient. Les historiens modernes pensent que trop haut, mais Towton a probablement été la plus grande et la plus sanglante bataille jamais combattu sur le sol anglais. Henry et Margaret ont fui en Écosse et lui ont donné Berwick pour son aide. Lancastrians tenu dans les châteaux de Northumberland jusqu’en 1464 ; Henry a été capturé en 1465."
