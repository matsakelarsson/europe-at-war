"1650–1651": "1650–1651"
"Charles II landed in Scotland in June 1650 after swearing to the Covenants, and the Commonwealth struck first. Cromwell invaded in July, but David Leslie’s army blocked him outside Edinburgh until, short of food and sick, the English fell back to Dunbar. On 3 September Cromwell attacked the Scots as they came down from the hills and routed them. Estimates of the Scottish dead range from a few hundred to several thousand, and at least 6,000 were captured; thousands of the prisoners died on the march south and in captivity at Durham, and many survivors were sent to the colonies.": "Charles II débarqua en Écosse en juin 1650 après avoir juré aux Alliances, et le Commonwealth frappa d’abord. Cromwell envahit en juillet, mais l’armée de David Leslie le bloqua hors d’Édimbourg jusqu’à ce que, sans nourriture ni maladie, les Anglais retombent à Dunbar. Le 3 septembre Cromwell attaqua les Écossais alors qu’ils descendaient des collines et les roulèrent. Les estimations des morts écossais vont de quelques centaines à plusieurs milliers, et au moins 6 000 ont été capturés ; des milliers de prisonniers sont morts sur la marche sud et en captivité à Durham, et de nombreux survivants ont été envoyés dans les colonies."
"Charles was crowned at Scone on 1 January 1651. In July an English army crossed the Firth of Forth and won at Inverkeithing, and Charles gambled on invading England with a mainly Scottish army, hoping English Royalists would rise. Few did. Cromwell caught him at Worcester on 3 September 1651, a year to the day after Dunbar, and destroyed his army. Charles escaped, hiding at one point in an oak tree at Boscobel, and reached France six weeks later. In Scotland General George Monck took Stirling and stormed Dundee, and the country was occupied.": "Charles est couronné à Scone le 1er janvier 1651. En juillet, une armée anglaise traverse la Firth of Forth et gagne à Inverkeithing, et Charles joue en envahissant l’Angleterre avec une armée principalement écossaise, espérant que les royalistes anglais monteront. Peu. Cromwell l’attrape à Worcester le 3 septembre 1651, un an après Dunbar, et détruit son armée. Charles s’échappa, se cachant à un moment dans un chêne de Boscobel, et atteignit la France six semaines plus tard. En Écosse, le général George Monck prit Stirling et prit la fuite de Dundee, et le pays fut occupé."
