"The year 1643 went the King’s way. The Earl of Newcastle beat the Fairfaxes at Adwalton Moor in June and took most of Yorkshire, Royalist cavalry won at Roundway Down in July, and Rupert stormed Bristol, England’s second city, on 26 July. Essex saved Gloucester in September and fought his way home at Newbury. Both sides looked for allies. Charles made a truce with the Irish Confederates so that he could bring troops home, and Parliament agreed the Solemn League and Covenant with the Scots, promising to reform the Church of England on Presbyterian lines in return for an army.": "En 1643, le comte de Newcastle battit les Fairfax à Adwalton Moor en juin et prit la majeure partie du Yorkshire, la cavalerie royaliste gagne à Roundway Down en juillet, et Rupert s’empare de Bristol (Angleterre) deuxième ville, le 26 juillet. Essex sauve Gloucester en septembre et combattra son retour à Newbury. Charles fit une trêve avec les confédérés irlandais afin qu’il puisse ramener les troupes chez lui, et le Parlement accepta la Ligue solennelle et l’Alliance avec les Écossais, promettant de réformer l’Église d’Angleterre sur les lignes presbytériennes en échange d’une armée."
"In January 1644 about 20,000 Scots under the Earl of Leven crossed the Tweed, and with the Fairfaxes and the Earl of Manchester’s army they besieged York. Rupert relieved the city, then attacked them at Marston Moor on 2 July. More than 40,000 men fought, and Oliver Cromwell’s cavalry broke the Royalist right and won the battle; about 4,000 Royalists were killed. York surrendered on 16 July, and the north was lost to the King. In the south he did better, trapping Essex’s army in Cornwall, where its infantry surrendered at Lostwithiel in September.": "En janvier 1644, environ 20 000 Écossais sous le comte de Leven traversèrent le Tweed, et avec les Fairfax et l’armée du comte de Manchester, ils assiégèrent York. Rupert souligna la ville, puis les attaqua à Marston Moor le 2 juillet. Plus de 40 000 hommes combattirent, et Oliver Cromwells brisa la cavalerie royale et gagna la bataille ; environ 4 000 Royalistes furent tués. York s’est rendu le 16 juillet, et le nord a été perdu au roi. Dans le sud, il a fait mieux, piégeant l’armée Essex à Cornwall, où son infanterie s’est rendue à Lostwithiel en septembre."
