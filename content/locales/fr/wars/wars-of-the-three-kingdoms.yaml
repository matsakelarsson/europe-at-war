"The Scots handed Charles over to Parliament in January 1647 on payment of part of the money owed to their army. Parliament’s Presbyterian majority then tried to disband the New Model Army without its arrears of pay, and the army seized the King and marched on London; at Putney its officers and the radical Levellers debated who should have the vote. Charles escaped in November but was held at Carisbrooke Castle on the Isle of Wight, where he signed a secret Engagement with Scottish nobles, who would restore him in return for three years of Presbyterianism in England.": "Les Écossais ont remis Charles au Parlement en janvier 1647 sur le paiement d’une partie de l’argent dû à leur armée. La majorité presbytérienne du parlement a ensuite essayé de dissoudre la Nouvelle Armée modèle sans ses arriérés de salaire, et l’armée s’est emparée du roi et a marché sur Londres ; à Putney ses officiers et les radicaux Levelers ont débattu qui devrait avoir le vote. Charles s’enfuit en novembre mais fut détenu au château de Carisbrooke sur l’île de Wight, où il signe un engagement secret avec les nobles écossais qui le rétabliront en retour pendant trois ans de presbytérianisme en Angleterre."
"In 1648 risings broke out in South Wales, Kent and Essex, and part of the navy mutinied. The army crushed them one by one, the Welsh at St Fagans in May, Kent at Maidstone on 1 June, and Colchester after a siege of eleven weeks, after which two Royalist commanders were shot. On 8 July the Duke of Hamilton led the Engagers’ army into England, and on 17–19 August Cromwell, with fewer men, destroyed it around Preston. On 6 December soldiers under Colonel Thomas Pride kept out of the Commons the members who still wanted a settlement with the King.": "En 1648, des ascensions éclatèrent dans le sud du pays de Galles, Kent et Essex, et une partie de la marine mutinée. L’armée les écrasa un par un, le gallois à St Fagans en mai, Kent à Maidstone le 1er juin et Colchester après un siège de onze semaines, après quoi deux commandants royalistes furent abattus. Le 8 juillet, le duc de Hamilton conduisit l’armée des Engagers en Angleterre et, les 17 et 19 août, Cromwell, avec moins d’hommes, la détruisit autour de Preston."
