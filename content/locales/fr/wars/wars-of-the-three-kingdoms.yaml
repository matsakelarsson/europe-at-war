"Edgehill": "Edgehill"
"In London, King and Parliament quarrelled over who should command the army needed to crush the Irish rising. On 4 January 1642 Charles came to the House of Commons with soldiers to arrest five members, who had fled, and soon afterwards he left the capital. In April the governor of Hull shut its gates and its arsenal against him, and on 22 August Charles raised his standard at Nottingham. Most of the north, the west and Wales sided with the King, and London, the south-east, East Anglia and the navy with Parliament, though almost every county was divided.": "Le 4 janvier 1642, Charles vint à la Chambre des communes avec des soldats pour arrêter cinq membres, qui s’étaient enfuis, et peu de temps après il quitta la capitale. En avril le gouverneur de Hull ferma ses portes et son arsenal contre lui, et le 22 août Charles souleva sa position à Nottingham. La plus grande partie du nord, l’ouest et le pays de Galles ont fait front avec le roi, et Londres, le sud-est, l’est de l’Anglie et la marine avec le Parlement, bien que presque tous les comtés aient été divisés."
"The King recruited in the Welsh borders and marched on London. At Edgehill in Warwickshire on 23 October he met Parliament’s army under the Earl of Essex. Prince Rupert’s cavalry swept away the horse in front of them but rode off in pursuit, and the infantry fought to a bloody draw. Charles took Banbury and Oxford and pressed on, and his troops sacked Brentford on 12 November. The next day some 24,000 Parliamentarian soldiers and London trained bands barred the road at Turnham Green, and he fell back to Oxford, his capital for the rest of the war.": "À Edgehill, dans le Warwickshire, le 23 octobre, il rencontra l’armée du Parlement sous le comte d’Essex. La cavalerie de Prince Rupert balaya le cheval en face d’eux mais partit à la poursuite, et l’infanterie se battit pour un tir sanglant. Charles prit Banbury et Oxford et pressa, et ses troupes saccagèrent Brentford le 12 novembre. Le lendemain, quelque 24 000 soldats parlementaires et des groupes formés à Londres ont interdit la route à Turnham Green, et il est retourné à Oxford, sa capitale pour le reste de la guerre."
