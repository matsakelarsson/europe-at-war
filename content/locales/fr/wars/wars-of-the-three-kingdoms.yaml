"1642": "1642"
"Wars of the Three Kingdoms": "Guerres des Trois Royaumes"
"The linked wars in Scotland, Ireland and England under Charles I and the Commonwealth, from the Scottish Covenanters’ revolt and the Irish rising of 1641 to the English Civil Wars between King and Parliament. They ended with the execution of Charles I in 1649, the abolition of the monarchy and the conquest of Ireland and Scotland by the English Commonwealth.": "Ces guerres liées entre elles touchent l’Écosse, l’Irlande et l’Angleterre sous Charles Ier, puis sous le Commonwealth. Elles vont de la révolte des covenantaires écossais et du soulèvement irlandais de 1641 aux guerres civiles anglaises entre le roi et le Parlement. Elles se terminent par l’exécution de Charles Ier en 1649, l’abolition de la monarchie et la conquête de l’Irlande et de l’Écosse par le Commonwealth anglais."
"Also called the British Civil Wars. The fighting in England is usually called the English Civil War (the First, 1642–1646, and the Second, 1648), and the war in Ireland the Irish Confederate Wars.": "Aussi appelé les guerres civiles britanniques. Les combats en Angleterre est généralement appelé la guerre civile anglaise (la première, 1642–1646, et la seconde, 1648), et la guerre en Irlande les guerres confédérées irlandaises."
"Alliances shifted. The Scots fought Charles I in 1639–1640 and 1644–1646, invaded England for him in 1648 (the Engagers), and fought for Charles II in 1650–1651. The Irish Confederates, Catholic rebels who governed most of Ireland from Kilkenny, made truces and treaties with the King’s Lord Lieutenant, the Marquis of Ormond, and joined him against the Commonwealth in 1649.": "Les Alliances se sont déplacées. Les Écossais combattirent Charles Ier en 1639–1640 et 1644–1646, envahirent l’Angleterre pour lui en 1648 (les Engagers), et combattèrent pour Charles II en 1650–1651. Les Confédérés irlandais, rebelles catholiques qui gouvernaient la majeure partie de l’Irlande de Kilkenny, firent des trêves et des traités avec le roi Lord Lieutenant, le marquis d’Ormond, et se joignirent à lui contre le Commonwealth en 1649."
"Dates are Old Style (Julian), as usual in British history, ten days behind the calendar used on the Continent, with the year starting on 1 January.": "Les dates sont Old Style (Julien), comme d’habitude dans l’histoire britannique, dix jours derrière le calendrier utilisé sur le continent, avec l’année à partir du 1er janvier."
