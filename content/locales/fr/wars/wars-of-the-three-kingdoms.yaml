"1651–1653": "1651–1653"
"In Ireland, Ireton took Limerick in October 1651 after a long siege and died of plague a month later. Galway, the last city, surrendered on 12 May 1652, and the last organised Irish force gave up at Cloughoughter in County Cavan on 27 April 1653, though guerrillas fought on. War, famine and plague had cost Ireland perhaps a fifth of its people. Tens of thousands of Irish soldiers left to serve in Spain and France, and thousands of prisoners and destitute people were shipped as servants to the colonies, Barbados above all.": "En Irlande, Ireton prit Limerick en octobre 1651 après un long siège et mourut d’une peste un mois plus tard. Galway, la dernière ville, se rendit le 12 mai 1652, et la dernière force irlandaise organisée abandonna à Cloughacheter dans le comté de Cavan le 27 avril 1653, bien que les guérilleros combattirent. La guerre, la famine et la peste avaient peut-être coûté à l’Irlande un cinquième de son peuple. Des dizaines de milliers de soldats irlandais sont partis pour servir en Espagne et en France, et des milliers de prisonniers et de personnes démunies ont été expédiés comme domestiques dans les colonies, la Barbade surtout."
"The Act for the Settlement of Ireland of August 1652 confiscated the land of those who had fought against Parliament, to pay the soldiers and the investors who had financed the war. Catholic landowners allowed to keep any land were to be moved west of the Shannon, to Connacht and Clare, and by some estimates Catholic ownership fell to about 8%. Scotland was declared united with the Commonwealth in February 1652 and held down by Monck’s garrisons. In England Cromwell dissolved the Rump in April 1653, and on 16 December he became Lord Protector of England, Scotland and Ireland.": "La loi pour le règlement de l’Irlande du mois d’août 1652 confisquait les terres de ceux qui avaient combattu contre le Parlement, pour payer les soldats et les investisseurs qui avaient financé la guerre. Les propriétaires catholiques ont permis de garder toutes les terres à l’ouest du Shannon, à Connacht et Clare, et selon certaines estimations, la propriété catholique est tombée à environ 8%. En Angleterre, Cromwell dissout le Rump en avril 1653 et, le 16 décembre, il devint Lord Protector d’Angleterre, d’Écosse et d’Irlande."
