"1637–1641": "1637–1641"
"Charles I ruled three kingdoms with three different churches. In 1637 he imposed a new prayer book on Scotland without consulting its Parliament or Kirk, and on 23 July its first reading in St Giles’ in Edinburgh set off a riot. In February 1638 thousands signed the National Covenant to defend the Reformed Kirk, and that December the General Assembly in Glasgow abolished the bishops. In the Bishops’ Wars Charles twice failed to force the Scots back into line, and in August 1640 a Covenanter army routed his troops at Newburn and occupied Newcastle.": "Charles Ier gouverna trois royaumes avec trois églises différentes. En 1637, il imposa un nouveau livre de prière à l’Écosse sans consulter son Parlement ou Kirk, et le 23 juillet sa première lecture à St Giles-Edimbourg lança une émeute.En février 1638, des milliers de personnes signèrent le Pacte national pour défendre Kirk réformé, et en décembre, l’Assemblée générale de Glasgow abolit les évêques. Dans les Evêques de Guerre Charles deux fois n’a pas forcé les Écossais à retourner dans la ligne, et en août 1640 une armée d’allianceers a acheminé ses troupes à Newburn et occupé Newcastle."
"To pay the Scots to leave, Charles had to summon the Long Parliament in November 1640, which sent his minister Strafford to the block and dismantled his personal rule. Irish Catholics feared a Puritan Parliament would take their land and religion. On 23 October 1641 a plot to seize Dublin Castle was betrayed, but in Ulster the rising led by Sir Phelim O’Neill spread fast. Thousands of Protestant settlers were robbed, driven out or killed, about 4,000 in the attacks and perhaps up to 12,000 with those who died of cold and disease, and settlers and soldiers killed Catholics in revenge. Exaggerated reports of massacre inflamed England and Scotland.": "Pour payer les Écossais pour partir, Charles dut convoquer le Long Parlement en novembre 1640, qui envoya son ministre Strafford au bloc et démantela sa domination personnelle. Les catholiques irlandais craignaient qu’un parlement puritain prenne leurs terres et leur religion. Le 23 octobre 1641, un complot pour s’emparer du château de Dublin fut trahi, mais à Ulster la montée menée par sir Phelim O-Neill se répandit rapidement. Des milliers de colons protestants ont été volés, chassés ou tués, environ 4 000 dans les attaques et peut-être jusqu’à 12 000 avec ceux qui sont morts du froid et de la maladie, et des colons et des soldats ont tué des catholiques en vengeance."
