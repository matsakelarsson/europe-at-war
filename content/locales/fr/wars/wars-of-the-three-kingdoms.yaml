"1649–1650": "1649–1650"
"A High Court of Justice set up by the purged Commons tried Charles for treason against his people, and he was beheaded outside the Banqueting House in Whitehall on 30 January 1649. England abolished the monarchy and the House of Lords and became a Commonwealth. The Scots, who had not been consulted, proclaimed his son King Charles II. In Ireland the Confederates and the Royalists under the Marquis of Ormond joined forces and held almost all the country except Dublin and Derry.": "Une Haute Cour de justice créée par les Communes purgées jugea Charles pour trahison contre son peuple, et il fut décapité devant la Maison des Banquets à Whitehall le 30 janvier 1649. L’Angleterre abolit la monarchie et la Chambre des lords et devint un Commonwealth. Les Écossais, qui n’avaient pas été consultés, proclamèrent son fils roi Charles II. En Irlande, les Confédérés et les Royalistes sous le marquis d’Ormond ont uni leurs forces et tenu presque tout le pays à l’exception de Dublin et Derry."
"On 2 August Colonel Michael Jones routed Ormond’s army at Rathmines, outside Dublin, and on 15 August Cromwell landed with about 12,000 veterans. He stormed Drogheda on 11 September, and his troops killed most of the garrison, many after they had surrendered, together with Catholic clergy and an unknown number of civilians. At Wexford in October between 1,500 and 2,000 soldiers and townspeople died in the sack. At Clonmel in May 1650 Hugh O’Neill’s garrison inflicted the New Model Army’s heaviest losses before slipping away. Cromwell returned to England that month, leaving the war to his son-in-law Henry Ireton.": "Le 2 août, le colonel Michael Jones dirigea l’armée d’Ormond à Rathmines, en dehors de Dublin, et le 15 août, Cromwell débarqua avec environ 12 000 anciens combattants. Il prit Drogheda le 11 septembre, et ses troupes tuèrent la majeure partie de la garnison, beaucoup après leur reddition, ainsi que le clergé catholique et un nombre inconnu de civils. À Clonmel, en mai 1650, la garnison de Hugh O=Neill=a infligé les pertes les plus lourdes de la New Model Army. Cromwell retourna en Angleterre ce mois-là, laissant la guerre à son gendre Henry Ireton."
