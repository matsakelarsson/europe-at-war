"Parliament reorganised its forces as the New Model Army under Sir Thomas Fairfax, with Cromwell commanding the cavalry. On 14 June 1645, at Naseby in Northamptonshire, it destroyed the King’s main field army. Some 4,500 Royalist infantry were captured, and so was the King’s correspondence, which showed him seeking Irish and foreign troops; Parliament published it. Fairfax beat the western Royalists at Langport in July, and in September Rupert surrendered Bristol. The remaining Royalist garrisons fell one by one.": "Le 14 juin 1645, à Naseby, dans le Northamptonshire, il détruisit l’armée de campagne principale du roi. Quelque 4 500 fantassins royalistes furent capturés, et la correspondance du roi lui montra qu’il cherchait des troupes irlandaises et étrangères ; le Parlement la publia. Fairfax battit les Royalistes de l’Ouest à Langport en juillet, et en septembre Rupert capitula Bristol. Les garnisons royalistes restantes tombèrent une par une."
"In Scotland, James Graham, Marquis of Montrose, leading Highlanders and Irish troops sent from Ulster, won six victories in a year, the last at Kilsyth on 15 August 1645. At Philiphaugh on 13 September a Covenanter army destroyed his force, and prisoners and camp followers were massacred. In Ireland Owen Roe O’Neill beat the Scottish army in Ulster at Benburb in June 1646. By then the war in England was over. On 5 May 1646 Charles gave himself up to the Scottish army besieging Newark, and Oxford surrendered on 24 June.": "En Écosse, James Graham, marquis de Montrose, chef des Highlanders et des troupes irlandaises envoyées d’Ulster, a remporté six victoires en un an, la dernière à Kilsyth le 15 août 1645. À Philiphaugh le 13 septembre, une armée du Covenanter a détruit ses forces, et des prisonniers et des partisans de camp ont été massacrés. Le 5 mai 1646, Charles se rendit à l’armée écossaise qui assiégea Newark et Oxford capitula le 24 juin."
