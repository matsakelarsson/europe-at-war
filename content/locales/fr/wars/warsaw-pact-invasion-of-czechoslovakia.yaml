# Some French text was translated automatically.
"Warsaw Pact invasion of Czechoslovakia": "Invasion de la Tchécoslovaquie par le Pacte de Varsovie"
"The invasion of Czechoslovakia on the night of 20–21 August 1968 by about 250,000 troops of the Soviet Union, Poland, Hungary and Bulgaria, which ended the reforms of the Prague Spring. The Czechoslovak army was ordered not to resist, and 137 Czechoslovak citizens were killed in the invasion and the months that followed. The reformist leaders were forced to accept the Moscow Protocol, Soviet troops stayed until 1991, and from 1969 Gustáv Husák’s “normalisation” restored strict Communist rule.": "L’invasion de la Tchécoslovaquie dans la nuit du 20 au 21 août 1968 par environ 250 000 soldats de l’Union soviétique, de la Pologne, de la Hongrie et de la Bulgarie, qui ont mis fin aux réformes du printemps de Prague. Les dirigeants réformistes ont été forcés d’accepter le Protocole de Moscou, les troupes soviétiques sont restées jusqu’en 1991 et à partir de 1969 Gustáv Husák."
"East Germany prepared two divisions for the invasion, but Moscow ordered them at the last moment not to cross the border, apart from a few specialists. Romania and Albania refused to take part, and Albania left the Warsaw Pact in September 1968.": "L’Allemagne de l’Est a préparé deux divisions pour l’invasion, mais Moscou leur a ordonné au dernier moment de ne pas franchir la frontière, à part quelques spécialistes. La Roumanie et l’Albanie ont refusé de participer, et l’Albanie a quitté le Pacte de Varsovie en septembre 1968."
"The invasion was code-named Operation Danube. Czechoslovakia, a member of the Warsaw Pact itself, offered no armed resistance, and most of the dead were civilians.": "L’invasion s’appelait opération Danube. La Tchécoslovaquie, membre du Pacte de Varsovie lui-même, n’offrait aucune résistance armée et la plupart des morts étaient des civils."
