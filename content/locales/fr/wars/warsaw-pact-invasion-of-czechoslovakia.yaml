"The Moscow Protocol and “normalisation”": "Protocole de Moscou et normalisation"
"21 August 1968 – April 1969": "21 août 1968 – avril 1969"
"The invaders had expected a new government to take over, but no credible collaborators came forward. An extraordinary party congress met secretly in a Prague factory on 22 August and backed Dubček. President Ludvík Svoboda flew to Moscow and insisted that the arrested leaders join the talks. On 26 August all of them except František Kriegel signed the Moscow Protocol, accepting renewed censorship and the presence of Soviet troops, which a treaty in October let stay “temporarily”; they remained until 1991. In 1968, 137 Czechoslovak citizens were killed during the invasion and occupation, and some 70,000 fled to the West.": "Les envahisseurs s’attendaient à ce qu’un nouveau gouvernement prenne la relève, mais aucun collaborateur crédible ne se présenta. Un extraordinaire congrès du parti s’est réuni secrètement dans une usine de Prague le 22 août et a soutenu Dubček. Le 26 août, tous, à l’exception de František Kriegel, ont signé le Protocole de Moscou, acceptant une censure renouvelée et la présence des troupes soviétiques, que le traité d’octobre a laissé rester temporairement ; ils sont restés jusqu’en 1991.En 1968, 137 citoyens tchécoslovaques ont été tués pendant l’invasion et l’occupation, et environ 70 000 ont fui vers l’Ouest."
"Resistance went on in other forms. In January 1969 the student Jan Palach set himself on fire in Wenceslas Square and died three days later; Jan Zajíc did the same in February. After crowds celebrating an ice-hockey victory over the Soviet Union in March 1969 attacked the Soviet airline office in Prague, Moscow forced Dubček out. On 17 April Gustáv Husák replaced him as party leader and began what was called “normalisation”. Purges removed hundreds of thousands from the party, reformers lost their jobs and censorship returned. The Brezhnev Doctrine justified the invasion as the defence of socialism in the bloc.": "En janvier 1969, l’étudiant Jan Palach s’est mis en feu sur la place Wenceslas et est mort trois jours plus tard ; Jan Zajíc a fait de même en février. Après que des foules célébrant une victoire sur l’Union soviétique en mars 1969 ont attaqué le bureau de la compagnie aérienne soviétique à Prague, Moscou a forcé Dubček. Le 17 avril, Gustáv Husák le remplaça comme chef du parti et commença ce qu’on appelait la normalisation. Purges retira des centaines de milliers de personnes du parti, les réformateurs perdirent leur emploi et retournèrent à la censure. La doctrine Brejnev justifiait l’invasion comme défense du socialisme dans le bloc."
