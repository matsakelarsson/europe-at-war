"January – 21 August 1968": "janvier – 21 août 1968"
"In January 1968 the Slovak Communist Alexander Dubček replaced Antonín Novotný as party leader in Czechoslovakia. Under him censorship was relaxed and then effectively ended, victims of the purges of the 1950s were rehabilitated, and the party’s Action Programme of April promised “socialism with a human face”. Public debate flourished. The Soviet leadership under Leonid Brezhnev, and the leaders of Poland, East Germany, Hungary and Bulgaria, feared that the reforms would end the party’s monopoly of power and spread to their own countries. In July they demanded a halt in the Warsaw Letter, and talks at Čierna nad Tisou and Bratislava brought only a brief pause.": "En janvier 1968, le communiste slovaque Alexander Dubček a remplacé Antonín Novotný comme chef du parti en Tchécoslovaquie. Sous lui la censure s’est assouplie puis a effectivement fini, les victimes des purges des années 1950 ont été réhabilitées, et le programme d’action du parti d’avril a promis le socialisme avec un visage humain. Les dirigeants soviétiques sous Leonid Brejnev, et les dirigeants de la Pologne, de l’Allemagne de l’Est, de la Hongrie et de la Bulgarie, craignaient que les réformes mettent fin au monopole du parti et s’étendent à leur propre pays."
"At about 11 pm on 20 August some 250,000 Soviet, Polish, Hungarian and Bulgarian troops with about 2,000 tanks crossed the borders, and Soviet airborne troops landed at Prague’s Ruzyně airport. The Czechoslovak army was ordered not to resist. By morning Dubček and other leaders had been arrested, and they were soon flown to the Soviet Union. Crowds surrounded the tanks, argued with the young soldiers and took down street signs to confuse the invaders, while clandestine radio stations kept broadcasting. People were killed in Prague, Bratislava, Liberec and other towns, several outside the Prague radio building.": "Vers 23 heures, le 20 août, quelque 250 000 soldats soviétiques, polonais, hongrois et bulgares avec environ 2 000 chars ont franchi les frontières, et des troupes soviétiques aéroportées ont atterri à l’aéroport de Prague. L’armée tchécoslovaque a reçu l’ordre de ne pas résister. Des foules encerclent les chars, se disputent avec les jeunes soldats et prennent des panneaux de rue pour confondre les envahisseurs, tandis que des stations de radio clandestines continuent à diffuser."
