# French translations of the catalogue text (wave 8); step bodies follow later.
Waziristan campaign of 1936–1939: Campagne du Waziristan de 1936–1939
A series of British Indian operations in Waziristan, on the North-West Frontier, against the followers of Mirzali Khan, a religious leader the British called the Faqir of Ipi. In 1936 a court in Bannu annulled the marriage of a Hindu girl who had converted to Islam, Islam Bibi, and the Faqir proclaimed a holy war against British interference in religion. In November 1936 a column sent through the Khaisora valley was ambushed and withdrew, and the rising spread among the Tori Khel Wazirs, Mahsuds and Bhittanis. At the height of the campaign in 1937 about 40,000 to 60,000 troops, with aircraft, armoured cars and artillery, faced perhaps 4,000 tribal fighters; villages were destroyed and the Royal Air Force bombed hostile areas. In April 1937 a convoy was ambushed in the Shahur Tangi gorge with the loss of 52 officers and men. The fighting died down by 1939, but the Faqir was never caught, and he kept up his resistance against Pakistan after 1947 until his death in 1960.: Une série d’opérations de l’Inde britannique au Waziristan, sur la frontière du Nord-Ouest, contre les partisans de Mirzali Khan, un chef religieux que les Britanniques appelaient le fakir d’Ipi. En 1936, un tribunal de Bannu annula le mariage d’une jeune fille hindoue convertie à l’islam, Islam Bibi, et le fakir proclama la guerre sainte contre l’ingérence britannique en matière religieuse. En novembre 1936, une colonne envoyée dans la vallée de la Khaisora tomba dans une embuscade et se retira, et le soulèvement s’étendit aux Wazirs Tori Khel, aux Mahsuds et aux Bhittanis. Au plus fort de la campagne, en 1937, quelque 40 000 à 60 000 soldats, appuyés par des avions, des automitrailleuses et de l’artillerie, affrontèrent peut-être 4 000 combattants tribaux ; des villages furent détruits et la Royal Air Force bombarda les zones hostiles. En avril 1937, un convoi tomba dans une embuscade dans les gorges de Shahur Tangi, perdant 52 officiers et soldats. Les combats s’étaient apaisés en 1939, mais le fakir ne fut jamais capturé et poursuivit sa résistance contre le Pakistan après 1947, jusqu’à sa mort en 1960.
