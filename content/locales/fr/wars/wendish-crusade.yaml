# Some French text was translated automatically.
"Wendish Crusade": "Croisade contre les Wendes"
"A crusade of Saxon, Danish and Polish princes and bishops against the Slav peoples east of the Elbe, launched alongside the Second Crusade with the same indulgences, after the Saxons asked to fight their pagan neighbours instead of going to the Holy Land. The Obotrite prince Niklot struck first by raiding Wagria; one army besieged his fortress of Dobin and left after a token baptism of its defenders, while another, led by Albert the Bear and the bishops, retook Havelberg, failed before Demmin and turned on Szczecin, which was already Christian. The crusade won few converts, but it opened the way for German settlement east of the Elbe.": "Une croisade de princes et évêques saxons, danois et polonais contre les peuples slaves à l’est de l’Elbe, lancée le long de la deuxième croisade avec les mêmes indulgences, après que les Saxons ont demandé à combattre leurs voisins païens au lieu d’aller en Terre Sainte. Le prince d’Obotrite Niklot frappe d’abord en fouillant Wagria ; une armée assiégé sa forteresse de Dobin et part après un baptême symbolique de ses défenseurs, tandis qu’une autre, dirigée par Albert l’ours et les évêques, reprend Havelberg, échoue devant Demmin et se tourne vers Szczecin, qui est déjà chrétien. La croisade a gagné peu de convertis, mais elle a ouvert la voie à la colonie allemande à l’est de l’Elbe."
"Pope Eugenius III authorised the crusade in the bull Divina dispensatione of 11 April 1147, after Bernard of Clairvaux had urged a fight against the Wends until they were converted or destroyed. The main source is Helmold of Bosau’s Chronicle of the Slavs, written two decades later.": "Le pape Eugenius III a autorisé la croisade dans le taureau Divina dispensatione du 11 avril 1147, après que Bernard de Clairvaux avait demandé une lutte contre les Wends jusqu’à ce qu’ils soient convertis ou détruits. La source principale est Helmold de Bosau , Chronique des Slaves, écrit deux décennies plus tard."
"At Szczecin Bishop Albert of Pomerania and Duke Ratibor I met the crusaders, and Albert told the crusaders that if they had come to strengthen the faith, they should have done so by preaching, not by arms. Duke Henry the Lion of Saxony and the rival Danish kings Sweyn III and Canute V led the army at Dobin.": "À Szczecin, Mgr Albert de Poméranie et duc Ratibor, j’ai rencontré les croisés, et Albert a dit aux croisés que s’ils étaient venus pour renforcer la foi, ils auraient dû le faire en prêchant, non par les armes. Le duc Henry le Lion de Saxe et les rois danois concurrents Sweyn III et Canute V ont dirigé l’armée à Dobin."
