# French translations of the catalogue text (wave 14); step bodies follow later.
West Indies campaign of the American Revolutionary War: Campagne des Antilles de la guerre d’indépendance des États-Unis
? The war for the sugar islands fought by Britain against France, Spain and the Dutch Republic after France allied itself with the United States in 1778. The French governor of Martinique, the Marquis de Bouillé, opened it by taking Dominica in September 1778; a British force answered by seizing Saint Lucia in December, beating off Admiral d’Estaing’s attempts to retake it. In 1779 the French took Saint Vincent, with the help of the Garifuna of Joseph Chatoyer, and Grenada, and d’Estaing mauled Admiral John Byron’s fleet off Grenada. When Britain went to war with the Dutch, Admiral George Rodney took Sint Eustatius, the free port that had supplied the American rebels, in February 1781 and plundered it; the French took Tobago that summer and retook Sint Eustatius in November, after Admiral de Grasse’s fleet had sailed north to seal the British defeat at Yorktown. In early 1782 de Grasse and Bouillé took St Kitts, Nevis and Montserrat, and France and Spain prepared to invade Jamaica, but on 12 April 1782 Rodney defeated and captured de Grasse at the Battle of the Saintes, and the invasion was abandoned. A Spanish force from Havana took Nassau in the Bahamas in May 1782; Loyalists retook it in April 1783. In the Peace of Versailles of 1783 France kept Tobago and the other islands were returned.
: La guerre pour les îles à sucre que la Grande-Bretagne livra contre la France, l’Espagne et les Provinces-Unies après l’alliance conclue par la France avec les États-Unis en 1778. Le gouverneur français de la Martinique, le marquis de Bouillé, l’ouvrit en prenant la Dominique en septembre 1778 ; une force britannique riposta en s’emparant de Sainte-Lucie en décembre et repoussa les tentatives de l’amiral d’Estaing pour la reprendre. En 1779, les Français prirent Saint-Vincent, avec l’aide des Garifunas de Joseph Chatoyer, puis la Grenade, et d’Estaing malmena la flotte de l’amiral John Byron au large de la Grenade. Lorsque la Grande-Bretagne entra en guerre contre les Néerlandais, l’amiral George Rodney prit en février 1781 Saint-Eustache, le port franc qui avait approvisionné les rebelles américains, et la pilla ; les Français prirent Tobago cet été-là et reprirent Saint-Eustache en novembre, après que la flotte de l’amiral de Grasse eut fait voile vers le nord pour sceller la défaite britannique à Yorktown. Au début de 1782, de Grasse et Bouillé prirent Saint-Christophe, Niévès et Montserrat, et la France et l’Espagne préparèrent une invasion de la Jamaïque, mais le 12 avril 1782 Rodney battit et captura de Grasse à la bataille des Saintes, et l’invasion fut abandonnée. Une force espagnole venue de La Havane prit Nassau, aux Bahamas, en mai 1782 ; des loyalistes la reprirent en avril 1783. Par la paix de Versailles de 1783, la France conserva Tobago, et les autres îles furent restituées.
