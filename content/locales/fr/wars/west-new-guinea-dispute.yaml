# French translations of the catalogue text (wave 11); step bodies follow later.
West New Guinea dispute: Différend sur la Nouvelle-Guinée occidentale
? The armed climax of the dispute between Indonesia and the Netherlands over the western half of New Guinea, which the Dutch had kept when they transferred sovereignty over the rest of the Dutch East Indies in 1949. Indonesia claimed it as part of the former colony; the Netherlands argued that the Papuans were a different people with a right to decide their own future, and from 1961 prepared them for self-government, with an elected New Guinea Council and a Papuan flag, the Morning Star. Indonesia broke off relations in August 1960, bought large quantities of Soviet arms, and on 19 December 1961 Sukarno ordered the territory to be taken by force (Trikora). An attempt to land troops by sea ended in the sinking of an Indonesian torpedo boat off Vlakke Hoek on 15 January 1962; through 1962 some 1,700 Indonesian soldiers were landed by sea or dropped by parachute, most of them killed or captured, while a full invasion was prepared. Under American pressure the Netherlands agreed in the New York Agreement of 15 August 1962 to hand the territory to a United Nations administration (UNTEA), which passed it to Indonesia on 1 May 1963, with a promise of an act of self-determination. In the Act of Free Choice of 1969, 1,025 Papuan representatives chosen by the Indonesian authorities voted unanimously for integration, a vote whose fairness is disputed to this day.
: Le point culminant armé du différend entre l’Indonésie et les Pays-Bas au sujet de la moitié occidentale de la Nouvelle-Guinée, que les Néerlandais avaient conservée lorsqu’ils avaient transféré la souveraineté sur le reste des Indes orientales néerlandaises en 1949. L’Indonésie la revendiquait comme partie intégrante de l’ancienne colonie ; les Pays-Bas soutenaient que les Papous formaient un peuple distinct ayant le droit de décider de son propre avenir et, à partir de 1961, les préparèrent à l’autonomie, avec un Conseil de Nouvelle-Guinée élu et un drapeau papou, l’Étoile du matin. L’Indonésie rompit les relations diplomatiques en août 1960, acheta de grandes quantités d’armes soviétiques et, le 19 décembre 1961, Sukarno ordonna de prendre le territoire par la force (Trikora). Une tentative de débarquement par mer se solda par la perte d’une vedette lance-torpilles indonésienne, coulée au large de Vlakke Hoek le 15 janvier 1962 ; tout au long de l’année 1962, quelque 1 700 soldats indonésiens furent débarqués par mer ou parachutés, pour la plupart tués ou capturés, tandis que se préparait une invasion de grande ampleur. Sous la pression américaine, les Pays-Bas acceptèrent, par l’accord de New York du 15 août 1962, de remettre le territoire à une administration des Nations unies (UNTEA), qui le transféra à l’Indonésie le 1er mai 1963, avec la promesse d’un acte d’autodétermination. Lors de l’Acte de libre choix de 1969, 1 025 représentants papous choisis par les autorités indonésiennes votèrent à l’unanimité pour l’intégration, un vote dont la régularité est contestée aujourd’hui encore.
