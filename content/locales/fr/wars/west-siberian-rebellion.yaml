# French translations of the catalogue text (wave 9); step bodies follow later.
West Siberian rebellion: Rébellion de Sibérie occidentale
? The largest peasant rising against Soviet rule, in western Siberia and the north of today’s Kazakhstan. After Kolchak’s defeat the Bolsheviks sent some 35,000 men of the food detachments to requisition grain in Siberia, where peasants had never known serfdom. The revolt began on 31 January 1921 in the Ishim district and spread within weeks across the Tyumen, Omsk, Akmolinsk and Chelyabinsk provinces, from Obdorsk (Salekhard) on the Arctic coast to Karkaralinsk in the steppe; estimates of the rebels in arms range from 30,000 to 150,000, with 55,000–100,000 the most often given. They took Petropavlovsk (briefly), Kokchetav, Tobolsk, Surgut, Berezovo and Obdorsk, and for about three weeks in February cut both lines of the Trans-Siberian Railway, stopping grain trains to central Russia. The Red Army, under a commission of Ivan Smirnov, Vasily Shorin and Ivan Pavlunovsky, reopened the railway in early March, retook Tobolsk on 8 April and crushed the main rebel army at Aromashevo at the end of April; the northern towns were retaken in May and June. Repression was severe, with hostages taken and villages shelled; Smirnov reported some 22,000 peasants killed in the Ishim and Petropavlovsk districts in the first six weeks alone. The end of requisitioning under the New Economic Policy helped bring the revolt to an end, though the last bands in the Ishim region were broken only at the end of 1922.
: Le plus grand soulèvement paysan contre le pouvoir soviétique, en Sibérie occidentale et dans le nord de l’actuel Kazakhstan. Après la défaite de Koltchak, les bolcheviks envoyèrent quelque 35 000 hommes des détachements de ravitaillement réquisitionner le grain en Sibérie, où les paysans n’avaient jamais connu le servage. La révolte commença le 31 janvier 1921 dans le district d’Ichim et s’étendit en quelques semaines aux provinces de Tioumen, d’Omsk, d’Akmolinsk et de Tcheliabinsk, d’Obdorsk (Salekhard), sur la côte arctique, à Karkaralinsk, dans la steppe ; les estimations du nombre de rebelles en armes vont de 30 000 à 150 000, les chiffres de 55 000 à 100 000 étant les plus souvent avancés. Ils prirent Petropavlovsk (brièvement), Kokchetav, Tobolsk, Sourgout, Berezovo et Obdorsk et, pendant environ trois semaines en février, coupèrent les deux voies du Transsibérien, arrêtant les trains de grain à destination de la Russie centrale. L’Armée rouge, placée sous une commission formée d’Ivan Smirnov, de Vassili Chorine et d’Ivan Pavlounovski, rouvrit la voie ferrée au début de mars, reprit Tobolsk le 8 avril et écrasa la principale armée rebelle à Aromachevo à la fin d’avril ; les villes du nord furent reprises en mai et en juin. La répression fut sévère, avec des prises d’otages et des villages bombardés ; Smirnov signala quelque 22 000 paysans tués dans les districts d’Ichim et de Petropavlovsk au cours des six premières semaines seulement. La fin des réquisitions avec la Nouvelle politique économique contribua à mettre fin à la révolte, bien que les dernières bandes de la région d’Ichim n’aient été brisées qu’à la fin de 1922.
