? "Last updated 27 November 2026. The low-intensity war between Morocco and the Polisario Front that resumed in November 2020 after 29 years of ceasefire. In October 2020 Sahrawi protesters blocked the road through the UN buffer strip at Guerguerat, the only road from Morocco and Moroccan-held Western Sahara to Mauritania. On 13 November Moroccan troops moved into the strip, cleared the road and extended the sand wall (the berm) to the Mauritanian border, and the next day the Polisario declared the 1991 ceasefire over. Since then Polisario units have fired on Moroccan positions along the berm, claiming daily attacks that are hard to verify, and Morocco has struck vehicles and fighters east of the berm with armed drones, killing Polisario commanders and also civilians, among them Algerian and Mauritanian traders and herders; by one count at least 120 people had been killed by drone strikes by November 2024. Shells fired at the town of Smara killed a civilian in October 2023. The diplomatic balance moved towards Morocco: the United States recognised Moroccan sovereignty in December 2020, as Morocco restored relations with Israel; Spain, France and others backed Morocco’s autonomy plan; and Algeria, the Polisario’s main supporter, broke off relations with Morocco in August 2021. On 31 October 2025 UN Security Council Resolution 2797, adopted with Russia, China and Pakistan abstaining and Algeria not voting, called for negotiations on the basis of Morocco’s autonomy plan and said that genuine autonomy “could represent a most feasible outcome”; the Polisario and Algeria rejected it. Morocco, the Polisario, Algeria and Mauritania met for three rounds of talks in Washington and Madrid in January and February 2026, but by October the UN envoy reported a stalemate. On 30 October 2026 Russia vetoed a US draft that would have renewed the UN mission (MINURSO) while dropping the referendum from its name and mandate, a rival Russian draft failed, and on 31 October the mission’s mandate lapsed for the first time since 1991; its withdrawal began on 1 November. On 10 November the Polisario declared a general mobilisation, citing what it called escalating Moroccan military movements along the berm, while Morocco said it remained committed to the ceasefire. Moroccan media reported a drone strike on Polisario vehicles the same day; few such reports could be independently confirmed, and it was uncertain whether Morocco would try to take the area east of the berm."
: "Dernière mise à jour : 27 novembre 2026. La guerre de basse intensité entre le Maroc et le Front Polisario qui a repris en novembre 2020, après 29 ans de cessez-le-feu. En octobre 2020, des manifestants sahraouis ont bloqué la route qui traverse la zone tampon de l’ONU à Guerguerat, seule route reliant le Maroc et le Sahara occidental sous contrôle marocain à la Mauritanie. Le 13 novembre, des troupes marocaines sont entrées dans la zone tampon, ont dégagé la route et ont prolongé le mur de sable (la berme) jusqu’à la frontière mauritanienne, et le lendemain le Polisario a déclaré la fin du cessez-le-feu de 1991. Depuis, des unités du Polisario tirent sur les positions marocaines le long de la berme, revendiquant des attaques quotidiennes difficiles à vérifier, et le Maroc frappe à l’aide de drones armés des véhicules et des combattants à l’est de la berme, tuant des commandants du Polisario mais aussi des civils, parmi lesquels des commerçants et des éleveurs algériens et mauritaniens ; selon un décompte, au moins 120 personnes avaient été tuées par des frappes de drones en novembre 2024. Des obus tirés sur la ville de Smara ont tué un civil en octobre 2023. L’équilibre diplomatique a penché en faveur du Maroc : les États-Unis ont reconnu la souveraineté marocaine en décembre 2020, au moment où le Maroc rétablissait ses relations avec Israël ; l’Espagne, la France et d’autres pays ont soutenu le plan d’autonomie marocain ; et l’Algérie, principal soutien du Polisario, a rompu ses relations avec le Maroc en août 2021. Le 31 octobre 2025, la résolution 2797 du Conseil de sécurité de l’ONU, adoptée avec l’abstention de la Russie, de la Chine et du Pakistan, l’Algérie ne prenant pas part au vote, a appelé à des négociations sur la base du plan d’autonomie marocain et a affirmé qu’une véritable autonomie « pourrait constituer la solution la plus réalisable » ; le Polisario et l’Algérie l’ont rejetée. Le Maroc, le Polisario, l’Algérie et la Mauritanie se sont réunis pour trois cycles de pourparlers à Washington et à Madrid en janvier et février 2026, mais en octobre l’envoyé de l’ONU faisait état d’une impasse. Le 30 octobre 2026, la Russie a opposé son veto à un projet américain qui aurait renouvelé la mission de l’ONU (MINURSO) tout en retirant le référendum de son nom et de son mandat, un projet russe concurrent a échoué et, le 31 octobre, le mandat de la mission a expiré pour la première fois depuis 1991 ; son retrait a commencé le 1er novembre. Le 10 novembre, le Polisario a décrété la mobilisation générale en invoquant ce qu’il présentait comme une escalade des mouvements militaires marocains le long de la berme, tandis que le Maroc affirmait rester attaché au cessez-le-feu. Le même jour, des médias marocains ont fait état d’une frappe de drone contre des véhicules du Polisario ; peu de ces informations ont pu être confirmées de manière indépendante, et l’on ignorait si le Maroc tenterait de prendre la zone située à l’est de la berme."
