# French translations of the catalogue text (wave 12); step bodies follow later.
Western Sahara War: Guerre du Sahara occidental
? The war over the former Spanish Sahara between Morocco, Mauritania and the Polisario Front, the Sahrawi independence movement backed by Algeria. As Spain prepared to leave its colony in 1975, Morocco and Mauritania claimed it, while a UN mission found that most Sahrawis wanted independence, and the International Court of Justice found no tie of sovereignty that would override their right to self-determination. Morocco answered with the Green March of some 350,000 unarmed civilians in November 1975, and by the Madrid Accords Spain handed the administration to Morocco and Mauritania. Moroccan and Mauritanian troops moved in, tens of thousands of Sahrawis fled to camps near Tindouf in Algeria, and on 27 February 1976 the Polisario proclaimed the Sahrawi Arab Democratic Republic. With fast columns of Land Rovers the Polisario struck deep into Mauritania, raiding Nouakchott and the iron mines of Zouérat, until a coup in 1978 brought Mauritania to make peace in 1979; Morocco then took the Mauritanian share. Against Morocco the Polisario won battles in 1979–1981, but from 1980 Morocco built a sand wall, the berm, which by 1987 ran some 2,700 km and enclosed about four fifths of the territory, turning the war into a stalemate. A UN-brokered ceasefire took effect on 6 September 1991, with a promise of a referendum on independence that has never been held. Estimates of the dead range from about 10,000 to 20,000.
: La guerre pour l’ancien Sahara espagnol entre le Maroc, la Mauritanie et le Front Polisario, le mouvement indépendantiste sahraoui soutenu par l’Algérie. Alors que l’Espagne se préparait à quitter sa colonie en 1975, le Maroc et la Mauritanie la revendiquèrent, tandis qu’une mission de l’ONU constatait que la plupart des Sahraouis voulaient l’indépendance et que la Cour internationale de justice ne trouvait aucun lien de souveraineté susceptible de l’emporter sur leur droit à l’autodétermination. Le Maroc répondit par la Marche verte de quelque 350 000 civils non armés en novembre 1975 et, par les accords de Madrid, l’Espagne remit l’administration du territoire au Maroc et à la Mauritanie. Les troupes marocaines et mauritaniennes y entrèrent, des dizaines de milliers de Sahraouis s’enfuirent vers des camps près de Tindouf, en Algérie, et le 27 février 1976 le Polisario proclama la République arabe sahraouie démocratique. Avec des colonnes rapides de Land Rover, le Polisario frappa en profondeur en Mauritanie, lançant des raids sur Nouakchott et sur les mines de fer de Zouérat, jusqu’à ce qu’un coup d’État en 1978 amène la Mauritanie à faire la paix en 1979 ; le Maroc s’empara alors de la part mauritanienne. Contre le Maroc, le Polisario remporta des batailles en 1979–1981, mais à partir de 1980 le Maroc construisit un mur de sable, la berme, qui en 1987 s’étendait sur quelque 2 700 km et enserrait environ les quatre cinquièmes du territoire, transformant la guerre en impasse. Un cessez-le-feu négocié sous l’égide de l’ONU entra en vigueur le 6 septembre 1991, avec la promesse d’un référendum sur l’indépendance qui n’a jamais eu lieu. Les estimations du nombre de morts vont d’environ 10 000 à 20 000.
