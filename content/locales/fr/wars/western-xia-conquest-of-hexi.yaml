# French translations of the catalogue text (wave 9); step bodies follow later.
Western Xia conquest of the Hexi Corridor: Conquête du corridor du Hexi par les Xia occidentaux
? The campaigns in which the Tanguts, under Li Deming and his son Li Yuanhao, took the Hexi Corridor, the string of oases in today’s Gansu that carried the Silk Road between China and Central Asia. Since the fall of Tibetan rule in the 9th century the corridor had been divided between the Uyghur kingdom of Ganzhou (Zhangye), Tibetan tribes around Liangzhou (Wuwei), known as Xiliangfu, and the Chinese Guiyi circuit of the Cao family at Shazhou (Dunhuang) and Guazhou. In 1028 Li Deming sent Yuanhao against Ganzhou, already weakened by Liao attacks, and the Uyghur capital fell. The Uyghurs of Guazhou submitted in 1030. Yuanhao’s attack on the new Tibetan kingdom of Tsongkha under Gusiluo in Qinghai was beaten back, but in 1032 he took Liangzhou from the Tibetans of Xiliangfu, and in the same year succeeded his father. By 1036 he held the whole corridor, including Suzhou (Jiuquan) and Shazhou (Dunhuang), ending the Ganzhou kingdom and the Guiyi circuit; many Uyghurs moved west, some becoming the ancestors of the Yellow Uyghurs. In the same year the new Tangut script was put into official use. The corridor gave the Tanguts the Silk Road trade and the horses and resources for the empire Yuanhao proclaimed in 1038; they held it for almost two centuries.
: Les campagnes au cours desquelles les Tangoutes, sous Li Deming et son fils Li Yuanhao, prirent le corridor du Hexi, le chapelet d’oasis de l’actuel Gansu par lequel passait la route de la soie entre la Chine et l’Asie centrale. Depuis la fin de la domination tibétaine au IXe siècle, le corridor était partagé entre le royaume ouïghour de Ganzhou (Zhangye), des tribus tibétaines établies autour de Liangzhou (Wuwei), connues sous le nom de Xiliangfu, et le circuit chinois de Guiyi, aux mains de la famille Cao, à Shazhou (Dunhuang) et à Guazhou. En 1028, Li Deming envoya Yuanhao contre Ganzhou, déjà affaiblie par les attaques des Liao, et la capitale ouïghoure tomba. Les Ouïghours de Guazhou se soumirent en 1030. L’attaque de Yuanhao contre le nouveau royaume tibétain de Tsongkha, dirigé par Gusiluo au Qinghai, fut repoussée, mais en 1032 il prit Liangzhou aux Tibétains du Xiliangfu et succéda la même année à son père. En 1036, il tenait tout le corridor, y compris Suzhou (Jiuquan) et Shazhou (Dunhuang), mettant fin au royaume de Ganzhou et au circuit de Guiyi ; beaucoup d’Ouïghours partirent vers l’ouest, et certains devinrent les ancêtres des Ouïghours jaunes. La même année, la nouvelle écriture tangoute entra en usage officiel. Le corridor apporta aux Tangoutes le commerce de la route de la soie ainsi que les chevaux et les ressources de l’empire que Yuanhao proclama en 1038 ; ils le conservèrent pendant près de deux siècles.
