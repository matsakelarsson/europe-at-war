# French translations of the catalogue text (wave 14); step bodies follow later.
Whiskey Rebellion: Rébellion du whisky
? Resistance by farmers on the western frontier, above all in western Pennsylvania, to the federal excise tax on distilled spirits. Treasury Secretary Alexander Hamilton’s tax of March 1791, meant to help pay the state war debts the federal government had taken over, fell hard on farmers west of the Appalachians, who turned their grain into whiskey to carry it over the mountains and used it as money, and who had to pay the tax in cash; large distillers in the East could pay less per gallon. Tax collectors were threatened and tarred and feathered from 1791 on. In July 1794, when a federal marshal came to serve writs, armed men besieged the house of the regional tax inspector, John Neville, at Bower Hill near Pittsburgh on 16–17 July; soldiers from Fort Pitt defended it, a rebel leader, James McFarlane, was killed, and the house was burned. On 1 August some 7,000 people gathered at Braddock’s Field and marched through Pittsburgh. Moderates such as Albert Gallatin and Hugh Henry Brackenridge urged restraint at a meeting at Parkinson’s Ferry, while President George Washington called out about 12,950 militia from Pennsylvania, New Jersey, Maryland and Virginia under Henry Lee, with Hamilton accompanying them; Washington rode with the army as far as Carlisle and Bedford in October, often described as the only time a sitting president has led troops in the field. The resistance melted away before the army arrived. About 20 men were taken to Philadelphia for trial; two were convicted of treason and pardoned by Washington. The rising was the first great test of the new federal government’s power to enforce its laws, and it deepened the divide between Federalists and Jefferson’s Republicans, who repealed the tax in 1802.
: La résistance des fermiers de la frontière occidentale, surtout dans l’ouest de la Pennsylvanie, à l’impôt fédéral sur les spiritueux distillés. L’impôt de mars 1791 du secrétaire au Trésor Alexander Hamilton, destiné à aider à payer les dettes de guerre des États que le gouvernement fédéral avait reprises à son compte, pesa lourdement sur les fermiers établis à l’ouest des Appalaches, qui transformaient leur grain en whisky pour le transporter par-delà les montagnes et s’en servaient comme monnaie, et qui devaient payer l’impôt en espèces ; les grands distillateurs de l’Est pouvaient payer moins par gallon. Dès 1791, des percepteurs furent menacés, enduits de goudron et couverts de plumes. En juillet 1794, alors qu’un marshal fédéral venait signifier des assignations, des hommes armés assiégèrent les 16 et 17 juillet la maison de l’inspecteur régional des impôts, John Neville, à Bower Hill, près de Pittsburgh ; des soldats de Fort Pitt la défendirent, un chef rebelle, James McFarlane, fut tué, et la maison fut incendiée. Le 1er août, quelque 7 000 personnes se rassemblèrent à Braddock’s Field et défilèrent dans Pittsburgh. Des modérés comme Albert Gallatin et Hugh Henry Brackenridge appelèrent à la retenue lors d’une réunion à Parkinson’s Ferry, tandis que le président George Washington mobilisait environ 12 950 miliciens de Pennsylvanie, du New Jersey, du Maryland et de Virginie sous le commandement de Henry Lee, accompagnés par Hamilton ; Washington chevaucha avec l’armée jusqu’à Carlisle et Bedford en octobre, ce qui est souvent présenté comme la seule fois où un président en exercice a mené des troupes en campagne. La résistance se dissipa avant l’arrivée de l’armée. Une vingtaine d’hommes furent emmenés à Philadelphie pour y être jugés ; deux furent reconnus coupables de trahison et graciés par Washington. Le soulèvement fut la première grande mise à l’épreuve du pouvoir du nouveau gouvernement fédéral de faire appliquer ses lois, et il creusa le fossé entre les fédéralistes et les républicains de Jefferson, qui abrogèrent l’impôt en 1802.
Whiskey rebels (farmers and distillers of western Pennsylvania): Rebelles du whisky (fermiers et distillateurs de l’ouest de la Pennsylvanie)
