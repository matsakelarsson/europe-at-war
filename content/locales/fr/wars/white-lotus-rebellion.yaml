# French translations of the catalogue text (wave 9); step bodies follow later.
White Lotus Rebellion: Rébellion du Lotus blanc
? A rebellion in the mountains where Hubei, Sichuan and Shaanxi meet, led by followers of the millenarian sects the Qing called the White Lotus, who taught that the Eternal Venerable Mother would send the Buddha Maitreya to save the faithful at the end of the age. The highlands of the upper Han River had filled with poor settlers in the 18th century, and the sects spread among them. A government campaign against the sects from 1794, carried out by extortionate local officials, drove them to revolt in 1796 in western Hubei and then in eastern Sichuan. Mobile rebel bands, among them one led by the young widow Wang Cong’er, moved through five provinces for years while badly led and corrupt Qing armies failed to catch them. After the death of the Qianlong Emperor and the fall of his favourite Heshen in 1799, the Jiaqing Emperor’s commanders moved the people into fortified villages, raised local militias and offered amnesty, and starved the bands out. The war was declared over in 1804. It cost the state, by its own reckoning, about 120 million taels, and some 100,000 rebels are thought to have been killed; civilian losses are unknown.
: Une rébellion dans les montagnes où se rejoignent le Hubei, le Sichuan et le Shaanxi, menée par des adeptes des sectes millénaristes que les Qing appelaient le Lotus blanc, qui enseignaient que la Vénérable Mère éternelle enverrait le Bouddha Maitreya sauver les fidèles à la fin des temps. Les hautes terres du cours supérieur de la Han s’étaient remplies de colons pauvres au XVIIIe siècle, et les sectes se répandirent parmi eux. Une campagne gouvernementale contre les sectes, lancée en 1794 et menée par des fonctionnaires locaux pratiquant l’extorsion, les poussa à la révolte en 1796 dans l’ouest du Hubei, puis dans l’est du Sichuan. Des bandes rebelles mobiles, dont l’une était menée par la jeune veuve Wang Cong’er, parcoururent cinq provinces pendant des années, tandis que des armées Qing mal commandées et corrompues ne parvenaient pas à les rattraper. Après la mort de l’empereur Qianlong et la chute de son favori Heshen en 1799, les commandants de l’empereur Jiaqing regroupèrent la population dans des villages fortifiés, levèrent des milices locales et offrirent l’amnistie, et réduisirent les bandes par la faim. La guerre fut déclarée terminée en 1804. Elle coûta à l’État, selon ses propres comptes, environ 120 millions de taels, et l’on estime qu’environ 100 000 rebelles furent tués ; les pertes civiles sont inconnues.
