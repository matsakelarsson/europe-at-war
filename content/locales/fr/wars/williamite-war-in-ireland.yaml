"Williamite War in Ireland": "Guerre williamite en Irlande"
"The war that followed the Glorious Revolution of 1688, when William of Orange landed in England and James II fled to France. Backed by France, James held Ireland until William’s victory at the Boyne in 1690 and Ginkel’s at Aughrim in 1691. The Treaty of Limerick sent the Jacobite army to France and opened a century of Protestant Ascendancy in Ireland.": "La guerre qui suivit la Glorieuse Révolution de 1688, quand William d’Orange débarqua en Angleterre et Jacques II s’enfuit en France. Soutenu par la France, James conserva l’Irlande jusqu’à la victoire de William à Boyne en 1690 et de Ginkel à Aughrim en 1691. Le traité de Limerick envoya l’armée jacobite en France et ouvrit un siècle d’Ascendance protestante en Irlande."
"Dates are Old Style (Julian), as used in Britain and Ireland, ten days behind the New Style used in France and the Dutch Republic. The Boyne was fought on 1 July 1690 Old Style (11 July New Style) and is commemorated on 12 July.": "Les dates sont Old Style (Julien), comme utilisé en Grande-Bretagne et en Irlande, dix jours derrière le New Style utilisé en France et en République Néerlandaise. Le Boyne a été combattu le 1er Juillet 1690 Old Style (11 Juillet Nouveau Style) et est commémoré le 12 Juillet."
"The war in Ireland was part of the Nine Years’ War between France and the Grand Alliance. For the rising in Scotland, see the Jacobite rising of 1689.": "La guerre en Irlande faisait partie de la guerre de neuf ans entre la France et la Grande Alliance. Pour la montée en Écosse, voir la montée jacobite de 1689."
