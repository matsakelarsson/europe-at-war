"1688–1689": "1688–1689"
"James II, a Catholic, had alarmed his Protestant subjects by appointing Catholics to the army and government and suspending the laws against them. The birth of his son on 10 June 1688 promised a Catholic dynasty, and on 30 June seven English politicians invited William of Orange, stadtholder of the Dutch Republic and husband of James’s Protestant daughter Mary, to intervene. William, expecting war with France, wanted England on his side. He sailed with a fleet of over 400 ships and about 15,000 soldiers and landed at Brixham in Torbay on 5 November 1688.": "Jacques II, un catholique, avait alarmé ses sujets protestants en nommant des catholiques à l’armée et au gouvernement et en suspendant les lois contre eux. La naissance de son fils le 10 juin 1688 promit une dynastie catholique, et le 30 juin sept politiciens anglais invitèrent William d’Orange, propriétaire de la République néerlandaise et mari de la fille protestante de Jacques Marie, à intervenir. Il a navigué avec une flotte de plus de 400 navires et environ 15 000 soldats et atterri à Brixham à Torbay le 5 novembre 1688."
"James’s army, larger on paper, melted away as officers such as John Churchill went over to William, and after a skirmish at Reading on 9 December James tried to flee. Fishermen caught him near Faversham, but William let him escape, and he reached France on 25 December. A Convention declared that James had abandoned the throne and on 13 February 1689 offered the crown to William and Mary jointly, with a Declaration of Rights; Scotland followed in April. In Ireland, however, the Lord Deputy, the Earl of Tyrconnell, held the country for James, and only Protestant towns in Ulster, led by Derry, defied him.": "L’armée de James, plus grande sur le papier, fondit alors que des officiers comme John Churchill se rendaient à William, et après une escarmouche à Reading le 9 décembre, James tenta de s’enfuir. Une convention déclara que Jacques avait abandonné le trône et, le 13 février 1689, il offrit la couronne à William et à Marie en même temps qu’une déclaration des droits ; l’Écosse suivit en avril. Cependant, en Irlande, le Lord Deputy, comte de Tyrconnell, tenait le pays pour James, et seules les villes protestantes d’Ulster, dirigées par Derry, le défiaient."
