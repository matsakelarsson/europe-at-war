"Aughrim and Limerick": "Aughrim et Limerick"
"In 1691 William’s Dutch general, Godert de Ginkel, took command in Ireland. After a ten-day bombardment his troops forded the Shannon and stormed Athlone on 30 June. The French general the Marquis de Saint-Ruth, sent by Louis XIV with officers and supplies, made a stand at Aughrim on 12 July. The Jacobites held until Saint-Ruth was killed by a cannonball and their left wing gave way. Estimates of the Jacobite dead run from 4,000 to 7,000, making Aughrim the bloodiest battle ever fought in Ireland. Galway surrendered on 21 July.": "En 1691, le général hollandais William, Godert de Ginkel, prend le commandement en Irlande. Après un bombardement de dix jours, ses troupes ferment le Shannon et prennent Athlone le 30 juin. Le général français le marquis de Saint-Ruth, envoyé par Louis XIV avec des officiers et des fournitures, fait une prise de position à Aughrim le 12 juillet. Les Jacobites ont tenu jusqu’à Saint-Ruth a été tué par un boulet de canon et leur aile gauche a cédé la place. Selon les estimations des Jacobites morts courent de 4000 à 7.000, faisant Aughrim la bataille la plus sanglante jamais combattu en Irlande. Galway s’est rendu le 21 juillet."
"Limerick, besieged again from late August, negotiated a surrender, and the Treaty of Limerick was signed on 3 October 1691. Its military articles let Jacobite soldiers go to France, and some 12,000 to 14,000 sailed with Sarsfield to serve Louis XIV, the “Flight of the Wild Geese”. Its civil articles promised Catholics the religious freedom they had had under Charles II and protected the estates of those who submitted. But the Protestant-controlled Irish Parliament ratified only part of them, in 1697, and passed the Penal Laws, which barred Catholics from public office and most professions and restricted their right to own land for much of the 18th century.": "Limerick, assiégé de nouveau à partir de la fin d’août, négocia une reddition, et le traité de Limerick fut signé le 3 octobre 1691. Ses articles militaires laissaient les soldats jacobites aller en France, et environ 12 000 à 14 000 embarquèrent avec Sarsfield pour servir Louis XIV, le feu des Oies sauvages. Mais le Parlement irlandais contrôlé par les protestants n’en a ratifié qu’une partie, en 1697, et a adopté les lois pénales qui interdisaient aux catholiques d’exercer des fonctions publiques et la plupart des professions et restreignaient leur droit de posséder des terres pendant une grande partie du XVIIIe siècle."
