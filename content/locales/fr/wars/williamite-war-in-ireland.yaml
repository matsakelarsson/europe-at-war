"James landed at Kinsale on 12 March 1689 with French officers, money and arms, and the Irish Parliament he called to Dublin restored land confiscated from Catholics. From April his army besieged Derry. Crowded with Protestant refugees, the city held out for 105 days through famine and disease until on 28 July the ship Mountjoy broke the boom across the River Foyle and brought food; the siege was lifted on 1 August. On 31 July men from Enniskillen had beaten a Jacobite force at Newtownbutler. In August the Duke of Schomberg landed with a Williamite army, but disease ravaged it in camp near Dundalk.": "James débarqua à Kinsale le 12 mars 1689 avec des officiers français, de l’argent et des armes, et le Parlement irlandais appela à Dublin pour restaurer les terres confisquées aux catholiques. A partir d’avril son armée assiégée Derry. Crowdé avec des réfugiés protestants, la ville se tint 105 jours par famine et maladie jusqu’au 28 juillet le navire Mountjoy brisa le boom sur la rivière Foyle et apporta de la nourriture ; le siège fut levé le 1er août. Le 31 juillet, des hommes d’Enniskillen avaient battu une force jacobite à Newtownbutler. En août, le duc de Schomberg débarqua avec une armée Williamite, mais la maladie l’a ravagée dans un camp près de Dundalk."
"William came himself, landing at Carrickfergus on 14 June 1690 with an army of English, Dutch, Danish, German and Huguenot troops, some 36,000 men. On 1 July he forced the crossing of the Boyne near Drogheda against James’s smaller Irish and French army. Schomberg was killed, but the Jacobites retreated in good order, and James fled to France. William entered Dublin, but in August his siege of Limerick failed after Patrick Sarsfield’s cavalry destroyed his siege train at Ballyneety. In the autumn John Churchill, now Earl of Marlborough, took Cork and Kinsale.": "William arriva lui-même, atterrissant à Carrickfergus le 14 juin 1690 avec une armée de troupes anglaise, néerlandaise, danoise, allemande et huguenot, quelque 36 000 hommes. Le 1er juillet il força la traversée du Boyne près de Drogheda contre James's plus petite armée irlandaise et française. Schomberg fut tué, mais les Jacobites se retiraient en bon ordre, et James s’enfuit en France. William entra à Dublin, mais en août son siège de Limerick échoua après que la cavalerie de Patrick Sarsfield détruisit son train de siège à Ballyneety. À l’automne John Churchill, aujourd'hui comte de Marlborough, prit Cork et Kinsale."
