"The Moscow Peace": "La paix à Moscou"
"Under the Moscow Peace Finland ceded the Karelian Isthmus with Viipuri, the northern shores of Lake Ladoga with Sortavala and Käkisalmi, the area around Salla and part of Kuusamo in the north, its part of the Rybachy peninsula and islands in the Gulf of Finland. It also leased Hanko to the Soviet Union for 30 years as a naval base. The ceded lands were about a tenth of Finland’s territory and held much of its industry. Rather than live under Soviet rule, almost all their inhabitants, more than 400,000 people, moved to the rest of Finland, many of them already evacuated during the fighting.": "Sous la paix de Moscou, la Finlande a cédé l’isthme carélien avec Viipuri, les rives nord du lac Ladoga avec Sortavala et Käkisalmi, la région autour de Salla et une partie de Kuusamo dans le nord, sa partie de la péninsule Rybachy et des îles dans le golfe de Finlande. Les terres cédées étaient environ un dixième du territoire de la Finlande et tenaient une grande partie de son industrie. Plutôt que de vivre sous le régime soviétique, presque tous leurs habitants, plus de 400 000 personnes, ont déménagé dans le reste de la Finlande, beaucoup d’entre eux déjà évacués pendant les combats."
"Finland had kept its independence and avoided occupation, but at a heavy cost. About 26,000 Finns were dead or missing, and Soviet losses were several times higher, by different counts from about 127,000 to 168,000 dead or missing. The Red Army’s poor showing strengthened Hitler’s belief that it could be quickly beaten, while in Moscow it led to reforms. In Finland the loss, the resettlement of the Karelians and continued Soviet pressure pushed the government towards Germany, and in June 1941 Finland joined the German war against the Soviet Union.": "La Finlande avait gardé son indépendance et évité l’occupation, mais à un coût lourd. Environ 26 000 Finlandais étaient morts ou disparus, et les pertes soviétiques étaient plusieurs fois plus élevées, selon différents chiffres allant d’environ 127 000 à 168 000 morts ou disparus. En Finlande la perte, la réinstallation des Karéliens et la poursuite de la pression soviétique poussèrent le gouvernement vers l’Allemagne, et en juin 1941 la Finlande a rejoint la guerre allemande contre l’Union soviétique."
