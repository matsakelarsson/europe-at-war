"The Bay of Viipuri": "La baie de Viipuri"
"February – March 1940": "février – mars 1940"
"By the end of February the Finns held a last line from Viipuri to the Vuoksi river and Taipale. The Red Army attacked Viipuri from the south and in early March sent troops across the frozen Bay of Viipuri, from the Koivisto islands the Finns had given up, to land on the western shore behind the city. Finnish coastal troops and hastily gathered units fought them on the ice and in the shore villages, while Viipuri itself, bombed almost to ruins, held out. Further east Soviet troops crossed the Vuoksi at Vuosalmi, and the defence was close to breaking.": "Fin février, les Finlandais détenaient une dernière ligne entre Viipuri et la rivière Vuoksi et Taipale. L’Armée Rouge attaquait Viipuri du sud et au début de mars envoyait des troupes à travers la baie gelée de Viipuri, des îles Koivistes que les Finlandais avaient abandonnées, pour atterrir sur la rive ouest derrière la ville. Les troupes finlandaises du littoral et les unités rassemblées à la hâte les combattaient sur la glace et dans les villages côtiers, tandis que Viipuri lui-même, bombardait presque en ruines, s’arrêtait."
"At the end of January Moscow had let it be known, through Sweden, that it would negotiate with the Finnish government after all. Britain and France offered an expedition, but it would have had to cross Norway and Sweden, which refused transit, and the Finnish government judged it too small and too late. A delegation under Prime Minister Risto Ryti travelled to Moscow and accepted terms harsher than those Finland had refused in the autumn. The peace was signed late on 12 March, and the fighting ended the next day, with Viipuri still in Finnish hands.": "A la fin du mois de janvier, Moscou avait fait savoir, par l’intermédiaire de la Suède, qu’elle négocierait avec le gouvernement finlandais après tout. La Grande-Bretagne et la France ont offert une expédition, mais elle aurait dû traverser la Norvège et la Suède, qui refusaient le transit, et le gouvernement finlandais l’a jugé trop petit et trop tard. La paix a été signée tard le 12 mars, et les combats ont pris fin le lendemain, Viipuri restant entre les mains de la Finlande."
