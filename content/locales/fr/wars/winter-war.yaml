"Mainila and the invasion": "Mainila et l’invasion"
"October – December 1939": "octobre – décembre 1939"
"Under the secret protocol of the Molotov–Ribbentrop Pact, Finland fell in the Soviet sphere. In October 1939 Stalin demanded that Finland move its border on the Karelian Isthmus back from Leningrad, cede islands in the Gulf of Finland and its part of the Rybachy peninsula, and lease the Hanko peninsula as a naval base, offering larger but remote lands in East Karelia in return. Finland offered smaller concessions and refused Hanko. On 26 November the Soviet Union claimed that Finnish artillery had shelled its troops at the border village of Mainila. Finnish border posts reported that the shots came from the Soviet side, and most historians regard the incident as staged.": "En octobre 1939, Staline demanda à la Finlande de déplacer sa frontière sur l’isthme carélien en provenance de Leningrad, des îles cèdes du golfe de Finlande et de sa partie de la péninsule Rybachy, et de louer la péninsule Hanko comme base navale, offrant en retour des terres plus vastes mais éloignées dans la Carélie orientale. Le 26 novembre, l’Union soviétique a affirmé que l’artillerie finlandaise avait bombardé ses troupes au village frontalier de Mainila. Les postes frontière finlandais ont signalé que les tirs venaient du côté soviétique et la plupart des historiens considèrent l’incident comme étant organisé."
"On 30 November the Red Army invaded along the whole border with about 450,000 men, and Soviet aircraft bombed Helsinki, killing about 100 people. The next day a puppet “Finnish Democratic Republic” under the exiled communist Otto Wille Kuusinen was proclaimed at Terijoki, the first town the Soviets took. The League of Nations expelled the Soviet Union on 14 December. Finland did not collapse, as Moscow had expected. The government was widened, Mannerheim took command, and the army fell back on the Isthmus to its main defences, while smaller forces met the Soviet columns in the northern forests.": "Le 30 novembre, l’armée rouge a envahi toute la frontière avec environ 450 000 hommes, et des avions soviétiques ont bombardé Helsinki, tuant une centaine de personnes. Le lendemain, une marionnette, la République démocratique finlandaise, sous le régime communiste exilé Otto Wille Kuusinen a été proclamée à Terijoki, première ville prise par les Soviétiques. La Société des Nations a expulsé l’Union soviétique le 14 décembre. Le gouvernement s’élargit, Mannerheim prend le commandement, et l’armée retombe sur l’isthme à ses principales défenses, tandis que les petites forces rencontrent les colonnes soviétiques dans les forêts du nord."
