# Some French text was translated automatically.
"Winter War": "Guerre d’hiver"
"A war in which the Soviet Union invaded Finland after Finland refused to cede territory near Leningrad and lease a naval base. The Finnish army held out for three and a half months against a much larger Red Army, but in the Moscow Peace of March 1940 Finland ceded about a tenth of its territory, including Viipuri, and more than 400,000 Karelians lost their homes.": "Une guerre dans laquelle l’Union soviétique envahit la Finlande après que la Finlande a refusé de céder le territoire près de Leningrad et de louer une base navale. L’armée finlandaise s’est tenue pendant trois mois et demi contre une armée rouge beaucoup plus grande, mais dans la paix de Moscou de mars 1940 la Finlande a cédé environ un dixième de son territoire, y compris Viipuri, et plus de 400 000 Karéliens ont perdu leurs maisons."
"Places are named in Finnish as they were then. Viipuri is now Vyborg, Terijoki is Zelenogorsk, Koivisto is Primorsk and Käkisalmi is Priozersk, all in Russia.": "Viipuri est maintenant Vyborg, Terijoki est Zelenogorsk, Koivisto est Primorsk et Käkisalmi est Priozersk, le tout en Russie."
"Losses are estimates. Finnish dead and missing numbered about 26,000; Soviet figures range from about 127,000 to 168,000 dead and missing.": "Les pertes sont estimées. Finlandais morts et disparus étaient d’environ 26 000 ; les chiffres soviétiques vont d’environ 127 000 à 168 000 morts et disparus."
"Front lines and the area ceded around Salla are approximate.": "Les lignes de front et la zone cédée autour de Salla sont approximatives."
