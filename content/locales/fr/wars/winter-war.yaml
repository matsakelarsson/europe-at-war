"Suomussalmi and the Raate road": "Suomoussalmi et la route Raate"
"December 1939 – January 1940": "décembre 1939 – janvier 1940"
"In the wilderness along the eastern border, from Lake Ladoga to Lapland, Soviet divisions trained for open country advanced along the few roads in long columns. The Finns, on skis and at home in the forest, cut them into isolated pockets they called motti, after the word for a stacked cubic metre of firewood, and destroyed them piece by piece in temperatures that fell below –40 °C. On 12 December a much smaller Finnish force under Paavo Talvela beat two Soviet divisions at Tolvajärvi, the first Finnish victory, and on the Kollaa river the Finns held their line throughout the war.": "Dans la nature sauvage le long de la frontière orientale, du lac Ladoga à la Laponie, les divisions soviétiques entraînées pour la campagne ouverte avancent le long des quelques routes en longues colonnes. Les Finlandais, sur skis et chez eux dans la forêt, les coupent en poches isolées qu’ils appellent motti, après le mot pour un mètre cube empilé de bois de chauffage, et les détruisent pièce par pièce dans des températures qui tombent sous –40 °C. Le 12 décembre, une force finlandaise beaucoup plus petite sous Paavo Talvela a battu deux divisions soviétiques à Tolvajärvi, la première victoire finlandaise, et sur le fleuve Kollaa les Finlandais ont maintenu leur ligne tout au long de la guerre."
"At Suomussalmi the Soviet 163rd Division was trying to cut Finland in half at its narrow waist and reach Oulu on the Gulf of Bothnia. Colonel Hjalmar Siilasvuo’s troops surrounded and destroyed it by the end of December, and in the first week of January they destroyed the 44th Division, sent to relieve it, along the Raate road. Thousands of Soviet soldiers were killed or froze to death, and the Finns captured tanks, guns and lorries they badly needed. In Lapland the Soviet advance on Kemijärvi was stopped at Salla and Pelkosenniemi. The victories made Finland’s fight famous abroad, and volunteers came to help, among them about 8,000 Swedes.": "À Suomussalmi, la 163e Division soviétique tentait de couper la Finlande en deux à sa taille étroite et d’atteindre Oulu sur le golfe de Botnie. Les troupes du colonel Hjalmar Siilasvuo l’entourèrent et la détruisirent fin décembre, et dans la première semaine de janvier elles détruisirent la 44e Division, envoyée pour la soulager, le long de la route Raate. Des milliers de soldats soviétiques ont été tués ou gelés à mort, et les Finlandais ont capturé des chars, des armes et des camions dont ils avaient grand besoin. En Laponie, l’avance soviétique sur Kemijärvi a été arrêtée à Salla et Pelkosenniemi."
