"The Mannerheim Line": "La ligne Mannerheim"
"December 1939 – February 1940": "décembre 1939 – février 1940"
"On the Karelian Isthmus the main Soviet effort ran into the Mannerheim Line, a chain of trenches, concrete bunkers and anti-tank obstacles from the Gulf of Finland to Taipale on Lake Ladoga. It was weaker than its later fame, but in December the Red Army attacked it in poorly coordinated waves and lost heavily, at Summa and at Taipale, where Finnish artillery broke assaults across the frozen river. Soviet tanks broke through at Summa on 19 December, but without infantry following they were destroyed or turned back.": "Sur l’isthme karélien, le principal effort soviétique a traversé la ligne Mannerheim, une chaîne de tranchées, de bunkers en béton et d’obstacles antichars du golfe de Finlande à Taipale sur le lac Ladoga. Il était plus faible que sa renommée ultérieure, mais en décembre l’Armée rouge l’a attaqué dans des vagues mal coordonnées et a fortement perdu, à Summa et à Taipale, où l’artillerie finlandaise a cassé les assauts au-dessus de la rivière gelée. Les chars soviétiques ont traversé à Summa le 19 décembre, mais sans infanterie après qu’ils aient été détruits ou retournés."
"Stalin replaced the commanders and gave the front to Semyon Timoshenko, who brought up fresh divisions, heavy artillery and tanks, until by February about 460,000 Soviet soldiers faced the Finns on the Isthmus. The new offensive opened on 1 February with days of bombardment, and on 11 February the Red Army broke through at Lähde near Summa. The exhausted Finnish troops fell back to an intermediate line and then, by the end of the month, to a rear line covering Viipuri. They were short of shells and reserves, and the help discussed in Britain and France had not come.": "Staline remplaça les commandants et donna le front à Semyon Timochenko, qui fit monter de nouvelles divisions, de l’artillerie lourde et des chars, jusqu’à ce qu’en février environ 460 000 soldats soviétiques affrontent les Finlandais sur l’isthme. La nouvelle offensive s’ouvrit le 1er février avec des jours de bombardement, et le 11 février l’Armée rouge parvint à Lähde près de Summa. Les troupes finlandaises épuisées sont retombées sur une ligne intermédiaire puis, à la fin du mois, sur une ligne arrière couvrant Viipuri. Elles manquaient d’obus et de réserves, et l’aide discutée en Grande-Bretagne et en France n’était pas venue."
