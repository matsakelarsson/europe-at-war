# French translations of the catalogue text (wave 10); step bodies follow later.
Wokou raids on Goryeo: Raids des wokou sur le Goryeo
? Four decades of raids on Goryeo by the wokou, bands of raiders and smugglers who came mostly from Tsushima, Iki and northern Kyushu at a time when Japan was divided by the civil war between its Northern and Southern Courts; Koreans and Chinese also joined such bands. From the second month of 1350 the raids came almost every year, first on the southern coasts and then up the west coast to the approaches to Kaegyong, seizing the tax grain that Goryeo shipped by sea and carrying off people. The Goryeosa records more than a hundred raids under King Gongmin and 378 under King U (1374–1388), and coastal districts were abandoned. Goryeo rebuilt its navy and, on the advice of Choe Mu-seon, began making gunpowder and cannon in 1377. In 1380 its fleet burned some 500 wokou ships at Jinpo at the mouth of the Geum River, and the stranded raiders, after plundering inland, were destroyed by Yi Seong-gye at Hwangsan. After a further naval victory at Gwaneumpo in 1383 and a raid on Tsushima in 1389 the attacks declined, and Yi Seong-gye’s fame from these wars helped him found the Joseon dynasty in 1392.
: Quatre décennies de raids sur le Goryeo menés par les wokou, des bandes de pillards et de contrebandiers venus surtout de Tsushima, d’Iki et du nord du Kyushu, à une époque où le Japon était divisé par la guerre civile entre ses cours du Nord et du Sud ; des Coréens et des Chinois se joignaient aussi à ces bandes. À partir du deuxième mois de 1350, les raids se succédèrent presque chaque année, d’abord sur les côtes méridionales, puis en remontant la côte ouest jusqu’aux abords de Kaegyong ; les pillards s’emparaient du grain de l’impôt que le Goryeo acheminait par mer et enlevaient des habitants. Le Goryeosa enregistre plus d’une centaine de raids sous le roi Gongmin et 378 sous le roi U (1374–1388), et des districts côtiers furent abandonnés. Le Goryeo reconstitua sa marine et, sur le conseil de Choe Mu-seon, commença à fabriquer de la poudre et des canons en 1377. En 1380, sa flotte incendia quelque 500 navires wokou à Jinpo, à l’embouchure du Geum, et les assaillants restés à terre, après avoir pillé l’intérieur du pays, furent anéantis par Yi Seong-gye à Hwangsan. Après une nouvelle victoire navale à Gwaneumpo en 1383 et un raid sur Tsushima en 1389, les attaques diminuèrent, et la renommée que Yi Seong-gye tira de ces guerres l’aida à fonder la dynastie Joseon en 1392.
