# French translations of the catalogue text (wave 14); step bodies follow later.
The Ghost Dance and Wounded Knee: La danse des Esprits et Wounded Knee
? The army’s campaign of 1890–1891 on the Lakota reservations of South Dakota against the Ghost Dance movement, in which Sitting Bull was killed and the 7th Cavalry killed between about 250 and 300 Lakota at Wounded Knee Creek. In 1889 the Great Sioux Reservation was broken up into six smaller reservations and about nine million acres of it opened to settlers; rations were cut, crops failed in drought, and disease spread. The Lakota learned of the Ghost Dance taught by Wovoka, a Northern Paiute prophet in Nevada, who promised that through the dance and right living the dead would return and the old world be restored, and by the autumn of 1890 thousands danced on Pine Ridge, Rosebud, Cheyenne River and Standing Rock. Alarmed agents called for troops, and in November 1890 General Nelson Miles sent thousands of soldiers onto the reservations; Ghost Dancers under Short Bull and Kicking Bear withdrew to the Stronghold in the Badlands. On 15 December Lakota police sent to arrest Sitting Bull at his home on the Grand River killed him in a fight with his followers. Spotted Elk (Big Foot) led his Miniconjou band, with Hunkpapa refugees, towards Pine Ridge; on 28 December the 7th Cavalry intercepted them and camped them on Wounded Knee Creek, and on the morning of 29 December, as the soldiers disarmed the men, a shot was fired and the troops and their Hotchkiss guns opened fire on the camp, killing men, women and children, many as they fled; 25 soldiers also died. The last Ghost Dance bands surrendered at Pine Ridge on 15 January 1891. Wounded Knee is often counted as the end of the wars between the United States and the Native nations of the plains.
: La campagne de 1890–1891 de l’armée dans les réserves lakotas du Dakota du Sud contre le mouvement de la danse des Esprits, au cours de laquelle Sitting Bull fut tué et le 7e de cavalerie tua entre 250 et 300 Lakotas environ à Wounded Knee Creek. En 1889, la Grande Réserve sioux fut divisée en six réserves plus petites et environ neuf millions d’acres furent ouverts aux colons ; les rations furent réduites, les récoltes furent détruites par la sécheresse et les maladies se répandirent. Les Lakotas apprirent l’existence de la danse des Esprits enseignée par Wovoka, un prophète paiute du Nord établi au Nevada, qui promettait que, par la danse et une vie droite, les morts reviendraient et l’ancien monde serait restauré ; à l’automne 1890, des milliers de Lakotas dansaient à Pine Ridge, Rosebud, Cheyenne River et Standing Rock. Alarmés, les agents réclamèrent des troupes et, en novembre 1890, le général Nelson Miles envoya des milliers de soldats dans les réserves ; des adeptes de la danse des Esprits menés par Short Bull et Kicking Bear se retirèrent dans le Stronghold, dans les Badlands. Le 15 décembre, des policiers lakotas envoyés arrêter Sitting Bull chez lui, sur la Grand River, le tuèrent au cours d’un affrontement avec ses partisans. Spotted Elk (Big Foot) conduisit sa bande miniconjou, accompagnée de réfugiés hunkpapas, vers Pine Ridge ; le 28 décembre, le 7e de cavalerie les intercepta et les fit camper au bord de la Wounded Knee Creek et, le matin du 29 décembre, alors que les soldats désarmaient les hommes, un coup de feu partit, et les troupes et leurs canons Hotchkiss ouvrirent le feu sur le camp, tuant hommes, femmes et enfants, beaucoup pendant leur fuite ; 25 soldats moururent également. Les dernières bandes de la danse des Esprits se rendirent à Pine Ridge le 15 janvier 1891. Wounded Knee est souvent considéré comme la fin des guerres entre les États-Unis et les nations amérindiennes des plaines.
