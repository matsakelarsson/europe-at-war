# French translations of the catalogue text (wave 12); step bodies follow later.
Woyane rebellion: Rébellion Woyane
? A rising in Tigray against the restored government of Emperor Haile Selassie in 1943. After the Italian defeat in 1941 the emperor’s government centralised power, sent Shewan officials into the provinces and raised new taxes, while the countryside was full of weapons left from the war and unrest among the Raya and Azebo and other groups. In May 1943 peasants and local nobles in eastern Tigray rose under the name woyane (Tigrinya, roughly “revolt” or “popular movement”), led by Fitawrari Yeebio Woldai, Dejazmach Negusse Bezabih and Blatta Haile Mariam Redda. Their aims, as the sources give them, were self-administration within Ethiopia, Tigrayan customary law and lower taxes, not separation. They defeated government forces at Quiha and Ara and took Mekelle, but the government, under Ras Abebe Aregai, gathered a larger army, and in early October British Blenheim bombers from Aden struck Mekelle, Hintalo and Corbetta, killing about 70 people by one account. The rebels were beaten in fighting around Amba Alagi, Alaje, Wukro and the Tembien and the rising was crushed by November. Abebe Aregai’s repression, with killings, land confiscations and heavy taxes, was long remembered in Tigray; the nobles were mostly pardoned within a few years, but Haile Mariam Redda spent 22 years in prison. The Tigray People’s Liberation Front later called its own struggle the second woyane.
: Un soulèvement au Tigré contre le gouvernement restauré de l’empereur Hailé Sélassié, en 1943. Après la défaite italienne de 1941, le gouvernement impérial centralisa le pouvoir, envoya des fonctionnaires choans dans les provinces et leva de nouveaux impôts, alors que les campagnes regorgeaient d’armes laissées par la guerre et que l’agitation gagnait les Raya, les Azebo et d’autres groupes. En mai 1943, des paysans et des nobles locaux de l’est du Tigré se soulevèrent sous le nom de woyane (en tigrigna, à peu près « révolte » ou « mouvement populaire »), menés par le fitawrari Yeebio Woldai, le dejazmach Negusse Bezabih et le blatta Haile Mariam Redda. Leurs objectifs, tels que les rapportent les sources, étaient l’autonomie administrative au sein de l’Éthiopie, le droit coutumier tigréen et la baisse des impôts, et non la sécession. Ils battirent les forces gouvernementales à Quiha et à Ara et prirent Mekelle, mais le gouvernement, sous la conduite du ras Abebe Aregai, rassembla une armée plus nombreuse et, début octobre, des bombardiers britanniques Blenheim venus d’Aden frappèrent Mekelle, Hintalo et Corbetta, tuant environ 70 personnes selon une source. Les rebelles furent battus lors de combats autour de l’Amba Alagi, d’Alaje, de Wukro et du Tembien, et, en novembre, le soulèvement avait été écrasé. La répression d’Abebe Aregai, faite de meurtres, de confiscations de terres et de lourds impôts, resta longtemps dans les mémoires au Tigré ; les nobles furent pour la plupart graciés en quelques années, mais Haile Mariam Redda passa 22 ans en prison. Le Front populaire de libération du Tigré qualifia plus tard sa propre lutte de seconde woyane.
