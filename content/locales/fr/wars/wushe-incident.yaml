# French translations of the catalogue text (wave 9); step bodies follow later.
Wushe incident: Incident de Wushe
? An uprising of Seediq people against Japanese rule at Wushe (Musha), a police and administrative centre in the mountains of central Taiwan, today in Ren’ai Township, Nantou County. Forced labour, police abuses and contempt for Seediq customs had built up resentment, and after a quarrel at a wedding feast in which a Japanese policeman was struck, the Tgdaya chief Mona Rudao led more than 300 warriors in attacks on police posts on 27 October 1930 and then on the elementary school where Japanese residents had gathered for a sports meet. About 134 Japanese were killed, and two Han Taiwanese by mistake. The colonial government sent about 2,000 troops and police with artillery and aircraft, which dropped bombs and, by many accounts, poison gas, which some describe as the first use of chemical weapons in Asia; it also set rival Seediq groups, notably the Toda, against the rebels. Mona Rudao shot himself in a cave in late November, and his son Tado Mona and the last fighters killed themselves on 8 December. Of the rising villages’ people, about 644 died, many of them by suicide. On 25 April 1931 Toda men, encouraged by the Japanese, attacked the shelters of the survivors and killed about 200 more (the second Wushe incident), and in May the 298 who remained were moved to Kawanakajima, today Qingliu. The governor-general resigned in January 1931. The incident is remembered in Taiwan as an act of resistance and was the subject of the film Seediq Bale (2011).
: Un soulèvement des Seediq contre la domination japonaise à Wushe (Musha), centre policier et administratif situé dans les montagnes du centre de Taïwan, aujourd’hui dans le canton de Ren’ai, comté de Nantou. Le travail forcé, les abus de la police et le mépris des coutumes seediq avaient accumulé le ressentiment et, après une querelle lors d’un banquet de mariage au cours de laquelle un policier japonais fut frappé, le chef tgdaya Mona Rudao mena plus de 300 guerriers à l’attaque des postes de police le 27 octobre 1930, puis de l’école primaire où les résidents japonais s’étaient rassemblés pour une rencontre sportive. Environ 134 Japonais furent tués, ainsi que deux Taïwanais han, par erreur. Le gouvernement colonial envoya environ 2 000 soldats et policiers, avec de l’artillerie et des avions qui larguèrent des bombes et, selon de nombreux récits, des gaz toxiques, ce que certains décrivent comme le premier emploi d’armes chimiques en Asie ; il dressa aussi contre les rebelles des groupes seediq rivaux, notamment les Toda. Mona Rudao se tua d’un coup de feu dans une grotte à la fin de novembre, et son fils Tado Mona et les derniers combattants se donnèrent la mort le 8 décembre. Parmi la population des villages insurgés, environ 644 personnes moururent, dont beaucoup par suicide. Le 25 avril 1931, des hommes toda, encouragés par les Japonais, attaquèrent les abris des survivants et en tuèrent environ 200 de plus (le second incident de Wushe) et, en mai, les 298 qui restaient furent déplacés à Kawanakajima, aujourd’hui Qingliu. Le gouverneur général démissionna en janvier 1931. L’incident est commémoré à Taïwan comme un acte de résistance et a fait l’objet du film Seediq Bale (2011).
