# French translations of the catalogue text (wave 13); step bodies follow later.
Xhosa Wars (Cape Frontier Wars): Guerres xhosa (guerres de la frontière du Cap)
? A century of intermittent war on the eastern frontier of the Cape Colony, between the Xhosa chiefdoms and the Dutch and then British colonial state, in which the Xhosa lost their independence and most of their land west of the Mbhashe. Nine wars are usually counted. In the first three (1779–1803) Boer commandos and Xhosa chiefdoms fought over the grazing of the Zuurveld, between the Bushmans and Great Fish rivers, and in 1799 Khoikhoi servants rose and joined the Xhosa. In 1811–1812 British troops drove the Xhosa of the Zuurveld across the Fish. In 1819 the prophet Makhanda led an attack on Grahamstown, and after its defeat the colony took the land up to the Keiskamma. The wars of 1834–1836 (in which the Gcaleka king Hintsa was killed while in British custody), 1846–1847 (the War of the Axe) and 1850–1853 (Mlanjeni’s War, with a rising of Khoikhoi in the Kat River settlement) ended with the land between the Keiskamma and the Kei annexed as British Kaffraria and the Ngqika driven from the Amatola mountains. In 1856–1857, after years of defeat, drought and cattle disease, the Xhosa followed the prophecies of Nongqawuse and killed their cattle; some 40,000 people died of hunger and the colony took much of their remaining land. The last war, in 1877–1878, brought Gcalekaland under colonial rule, and the Cape took over the rest of the Transkei by 1894.
: Un siècle de guerres intermittentes sur la frontière orientale de la colonie du Cap, entre les chefferies xhosa et l’État colonial, néerlandais puis britannique, au terme duquel les Xhosa perdirent leur indépendance et la plus grande partie de leurs terres à l’ouest de la Mbhashe. On compte généralement neuf guerres. Lors des trois premières (1779–1803), des commandos boers et des chefferies xhosa se disputèrent les pâturages du Zuurveld, entre les rivières Bushmans et Great Fish, et en 1799 des serviteurs khoïkhoï se soulevèrent et rejoignirent les Xhosa. En 1811–1812, les troupes britanniques repoussèrent les Xhosa du Zuurveld au-delà de la Fish. En 1819, le prophète Makhanda mena une attaque contre Grahamstown et, après son échec, la colonie s’empara des terres jusqu’à la Keiskamma. Les guerres de 1834–1836 (au cours de laquelle le roi gcaleka Hintsa fut tué alors qu’il était détenu par les Britanniques), de 1846–1847 (la guerre de la Hache) et de 1850–1853 (la guerre de Mlanjeni, marquée par un soulèvement des Khoïkhoï de l’établissement de la Kat River) se terminèrent par l’annexion des terres situées entre la Keiskamma et la Kei sous le nom de Cafrerie britannique et par l’expulsion des Ngqika des monts Amatola. En 1856–1857, après des années de défaites, de sécheresse et d’épizooties, les Xhosa suivirent les prophéties de Nongqawuse et abattirent leur bétail ; quelque 40 000 personnes moururent de faim et la colonie s’empara d’une grande partie des terres qui leur restaient. La dernière guerre, en 1877–1878, plaça le Gcalekaland sous domination coloniale et, en 1894, le Cap avait pris le contrôle du reste du Transkei.
