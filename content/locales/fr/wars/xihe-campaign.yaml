# French translations of the catalogue text (wave 9); step bodies follow later.
Xihe campaign: Campagne du Xihe
? The campaign in which the Song general Wang Shao conquered the Tibetan lands of the upper Tao and Huang rivers in today’s southern Gansu, west of the Song frontier. Under the reforming emperor Shenzong and his minister Wang Anshi, the Song wanted to break out of the passive defence of the previous reigns and outflank the Western Xia from the south-west. Wang Shao had proposed winning over or conquering the Tibetan tribes between the two powers, whose leader Mucheng, grandson of the Tsongkha king Gusiluo, held Hezhou and had sided with the Tanguts. In 1072 Wang Shao took Wushengjun, renamed Xizhou (today’s Lintao), and the new Xihe circuit was set up. He then took Hezhou (Linxia), in 1072 or 1073 according to different accounts, where 7,000 Tibetans were killed, 12,000 taken prisoner and more than 20,000 tents destroyed, and in 1073 went on to take Taozhou, Minzhou, Diezhou and Dangzhou, adding some 2,000 li of land to the empire. Mucheng escaped, and in 1074 he and the Tsongkha king Dongzhan submitted to the Song. The new circuit gave the Song a base for the war with the Xia in 1081 and for the later conquest of Tsongkha, but its Tibetan tribes stayed restless.
: La campagne au cours de laquelle le général Song Wang Shao conquit les terres tibétaines du cours supérieur des rivières Tao et Huang, dans le sud de l’actuel Gansu, à l’ouest de la frontière des Song. Sous l’empereur réformateur Shenzong et son ministre Wang Anshi, les Song voulaient sortir de la défense passive des règnes précédents et déborder les Xia occidentaux par le sud-ouest. Wang Shao avait proposé de gagner ou de conquérir les tribus tibétaines situées entre les deux puissances, dont le chef, Mucheng, petit-fils du roi de Tsongkha Gusiluo, tenait Hezhou et avait pris le parti des Tangoutes. En 1072, Wang Shao prit Wushengjun, rebaptisée Xizhou (l’actuelle Lintao), et le nouveau circuit du Xihe fut créé. Il prit ensuite Hezhou (Linxia), en 1072 ou en 1073 selon les récits, où 7 000 Tibétains furent tués, 12 000 faits prisonniers et plus de 20 000 tentes détruites, puis en 1073 il prit Taozhou, Minzhou, Diezhou et Dangzhou, ajoutant à l’empire quelque 2 000 li de territoire. Mucheng s’échappa et, en 1074, lui et le roi de Tsongkha Dongzhan se soumirent aux Song. Le nouveau circuit donna aux Song une base pour la guerre contre les Xia en 1081 et pour la conquête ultérieure du Tsongkha, mais ses tribus tibétaines restèrent agitées.
