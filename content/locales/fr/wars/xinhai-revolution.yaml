# French translations of the catalogue text (wave 9); step bodies follow later.
Xinhai Revolution: Révolution Xinhai
The revolution that ended the Qing dynasty and two thousand years of imperial rule in China, also called the 1911 Revolution. After a summer of protest in Sichuan against the nationalisation of the provincial railways, revolutionary soldiers of the New Army rose at Wuchang on 10 October 1911 and set up a military government for Hubei. Within two months most provinces of the south and centre had declared their independence of the Qing, often after killing or driving out the Manchu garrisons. The court recalled Yuan Shikai, whose Beiyang Army retook Hankou and Hanyang, but the revolutionaries took Nanjing in December, and on 1 January 1912 Sun Yat-sen was inaugurated there as provisional president of the Republic of China. Yuan negotiated with both sides, and on 12 February 1912 the empress dowager Longyu issued the abdication of the six-year-old Xuantong emperor, Puyi. Sun stepped down and Yuan became president of the Republic. Outer Mongolia and Tibet broke away from Chinese rule in the same months.: La révolution qui mit fin à la dynastie Qing et à deux mille ans de régime impérial en Chine, appelée aussi révolution de 1911. Après un été de protestations dans le Sichuan contre la nationalisation des chemins de fer provinciaux, des soldats révolutionnaires de la Nouvelle Armée se soulevèrent à Wuchang le 10 octobre 1911 et instaurèrent un gouvernement militaire pour le Hubei. En deux mois, la plupart des provinces du Sud et du Centre proclamèrent leur indépendance à l’égard des Qing, souvent après avoir tué ou chassé les garnisons mandchoues. La cour rappela Yuan Shikai, dont l’armée de Beiyang reprit Hankou et Hanyang, mais les révolutionnaires prirent Nankin en décembre et, le 1er janvier 1912, Sun Yat-sen y fut investi président provisoire de la République de Chine. Yuan négocia avec les deux camps et, le 12 février 1912, l’impératrice douairière Longyu promulgua l’abdication de l’empereur Xuantong, Puyi, âgé de six ans. Sun se retira et Yuan devint président de la République. La Mongolie-Extérieure et le Tibet se détachèrent de la domination chinoise au cours des mêmes mois.
