# French translations of the catalogue text (wave 9); step bodies follow later.
Xinjiang conflict: Conflit du Xinjiang
? Armed attacks, riots and uprisings by Uyghurs in Xinjiang and elsewhere in China from 1990 to 2017, and the Chinese government’s response, which grew from security campaigns into mass surveillance and the detention of hundreds of thousands, by many estimates more than a million, Uyghurs, Kazakhs and other Muslims. Grievances over Han migration, restrictions on religion and language, birth-control rules and jobs fed a movement for an independent “East Turkestan”, a small part of which turned to violence; the government treats separatism, religious extremism and terrorism as one threat. The main events were the Baren uprising (1990), the Ghulja protests and the Ürümqi bus bombings (1997), the Kashgar attack before the 2008 Olympics, the Ürümqi riots of July 2009, in which 197 people were killed, and a wave of attacks in 2013–2014, among them the killing of 31 people at Kunming railway station. The government answered with the Strike Hard campaign of 2014 and, from 2017, the internment camps, which a UN report of 2022 said may amount to crimes against humanity. No attacks in Xinjiang have been reported since February 2017; the security regime and the detentions continue.
: Les attaques armées, émeutes et soulèvements d’Ouïghours au Xinjiang et ailleurs en Chine de 1990 à 2017, et la réponse du gouvernement chinois, qui passa de campagnes sécuritaires à une surveillance de masse et à la détention de centaines de milliers, selon de nombreuses estimations plus d’un million, d’Ouïghours, de Kazakhs et d’autres musulmans. Les griefs liés à la migration han, aux restrictions en matière de religion et de langue, aux règles de contrôle des naissances et à l’emploi nourrirent un mouvement pour un « Turkestan oriental » indépendant, dont une petite partie se tourna vers la violence ; le gouvernement traite le séparatisme, l’extrémisme religieux et le terrorisme comme une seule et même menace. Les principaux événements furent le soulèvement de Baren (1990), les manifestations de Ghulja et les attentats contre des bus à Ürümqi (1997), l’attaque de Kachgar avant les Jeux olympiques de 2008, les émeutes d’Ürümqi de juillet 2009, au cours desquelles 197 personnes furent tuées, et une vague d’attaques en 2013–2014, dont le meurtre de 31 personnes à la gare de Kunming. Le gouvernement répondit par la campagne « Frapper fort » de 2014 et, à partir de 2017, par les camps d’internement, qui, selon un rapport de l’ONU de 2022, pourraient constituer des crimes contre l’humanité. Aucune attaque n’a été signalée au Xinjiang depuis février 2017 ; le régime sécuritaire et les détentions se poursuivent.
