# French translations of the catalogue text (wave 14); step bodies follow later.
Yakima War: Guerre Yakima
? A war of 1855–1858 in Washington and Oregon territories between the United States and the Yakama and other peoples of the Columbia Plateau, fought together with the Puget Sound War west of the Cascades. At the Walla Walla Council of May–June 1855, Governor Isaac Stevens of Washington Territory and Joel Palmer of Oregon pressed the Yakama, Nez Perce, Walla Walla, Cayuse and Umatilla to cede most of their land for reservations, and within weeks the ceded land was declared open while miners bound for a gold strike near Fort Colville crossed Yakama country. Some miners were killed, and in September 1855 Yakama men killed the Indian agent Andrew Bolon. The Yakama under Kamiakin defeated Major Granville Haller’s troops at Toppenish Creek on 6 October 1855, and Oregon volunteers seized the Walla Walla leader Peopeomoxmox during talks under a flag of truce and killed him in December. West of the mountains the Nisqually leader Leschi, who had refused the Medicine Creek treaty of 1854, led Nisqually, Puyallup, Muckleshoot and Klickitat fighters; after deaths among the settlers on the White River in October 1855 they attacked Seattle on 26 January 1856 and were driven off by the sloop-of-war USS Decatur, and Yakama and Klickitat fighters attacked the settlement at the Cascades of the Columbia in March. Leschi was later captured and hanged on 19 February 1858; a historical court in Washington exonerated him in 2004. The war flared again in 1858, when Spokane, Coeur d’Alene and Palouse fighters defeated Lieutenant Colonel Edward Steptoe at Pine Creek on 17 May. Colonel George Wright defeated them at Four Lakes and Spokane Plains on 1 and 5 September, had about 800 of their horses shot and hanged Qualchan and other men. Kamiakin went into exile in British territory, and the Senate ratified the 1855 treaties in 1859. Some peoples fought for the United States, among them the Snoqualmie under Patkanim and Nez Perce scouts with Wright.
: Une guerre de 1855–1858 dans les territoires de Washington et de l’Oregon entre les États-Unis et les Yakamas et d’autres peuples du plateau du Columbia, menée parallèlement à la guerre du Puget Sound, à l’ouest des Cascades. Au conseil de Walla Walla, en mai–juin 1855, le gouverneur du territoire de Washington, Isaac Stevens, et Joel Palmer, de l’Oregon, pressèrent les Yakamas, les Nez-Percés, les Walla Wallas, les Cayuses et les Umatillas de céder la plupart de leurs terres en échange de réserves et, en quelques semaines, les terres cédées furent déclarées ouvertes, tandis que des mineurs en route vers un gisement d’or près de Fort Colville traversaient le pays yakama. Des mineurs furent tués et, en septembre 1855, des Yakamas tuèrent l’agent des Affaires indiennes Andrew Bolon. Les Yakamas menés par Kamiakin battirent les troupes du major Granville Haller à Toppenish Creek le 6 octobre 1855, et des volontaires de l’Oregon s’emparèrent du chef walla walla Peopeomoxmox pendant des pourparlers sous drapeau blanc et le tuèrent en décembre. À l’ouest des montagnes, le chef nisqually Leschi, qui avait refusé le traité de Medicine Creek de 1854, mena des combattants nisquallys, puyallups, muckleshoots et klickitats ; après des morts parmi les colons de la White River en octobre 1855, ils attaquèrent Seattle le 26 janvier 1856 et furent repoussés par le sloop de guerre USS Decatur, et des combattants yakamas et klickitats attaquèrent l’établissement des Cascades du Columbia en mars. Leschi fut plus tard capturé et pendu le 19 février 1858 ; une cour historique de l’État de Washington l’a disculpé en 2004. La guerre se ralluma en 1858, lorsque des combattants spokanes, cœurs d’alène et palouses battirent le lieutenant-colonel Edward Steptoe à Pine Creek le 17 mai. Le colonel George Wright les battit à Four Lakes et à Spokane Plains les 1er et 5 septembre, fit abattre environ 800 de leurs chevaux et fit pendre Qualchan et d’autres hommes. Kamiakin s’exila en territoire britannique, et le Sénat ratifia les traités de 1855 en 1859. Certains peuples combattirent aux côtés des États-Unis, parmi lesquels les Snoqualmies de Patkanim et des éclaireurs nez-percés qui accompagnaient Wright.
Yakama, Walla Walla, Palouse and other Plateau peoples (Kamiakin, Peopeomoxmox); Spokane and Coeur d’Alene in 1858: Yakamas, Walla Wallas, Palouses et autres peuples du Plateau (Kamiakin, Peopeomoxmox) ; Spokanes et Cœurs d’Alène en 1858
