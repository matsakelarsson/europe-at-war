# French translations of the catalogue text (wave 9); step bodies follow later.
Yakut revolt: Révolte iakoute
? The last campaign of the Russian Civil War, fought in Yakutia and on the Okhotsk coast. In September 1921 about 200 men under the White cornet Mikhail Korobeinikov rose in the Maya district east of Yakutsk, and Yakut and Tungus (Evenk) herders angered by requisitions and arrests joined them; a small White detachment landed at Okhotsk from Vladivostok. In March 1922 Yakut intellectuals formed the Provisional Yakut Regional People’s Administration at Churapcha, and its People’s Army drove the Reds from most of Yakutia and besieged Yakutsk. Moscow answered by proclaiming the Yakut Autonomous Soviet Socialist Republic on 27 April 1922 and sending about 5,000 troops, who by September had pushed the insurgents back to Ayan and Nelkan near the Pacific. In September 1922 General Anatoly Pepelyayev landed at Ayan with about 750 volunteers of the Siberian Volunteer Druzhina, sailing from White-held Vladivostok just before it fell. He took Amga in early 1923 but failed to take the Red detachment of Ivan Strod at the Sasyl-Sysyy farmstead in an eighteen-day siege in February and March, and fell back to the coast. A Red expedition under Stepan Vostretsov sailed from Vladivostok in April, took Okhotsk in early June, and on 18 June 1923 surrounded Ayan, where Pepelyayev surrendered without a fight. Losses are estimated at about 1,000 on the Red side and 500–1,000 killed among the insurgents, with more than 1,000 captured.
: La dernière campagne de la guerre civile russe, livrée en Iakoutie et sur la côte d’Okhotsk. En septembre 1921, environ 200 hommes commandés par le cornette blanc Mikhaïl Korobeïnikov se soulevèrent dans le district de Maïa, à l’est de Iakoutsk, et des éleveurs iakoutes et toungouses (évenks), irrités par les réquisitions et les arrestations, se joignirent à eux ; un petit détachement blanc venu de Vladivostok débarqua à Okhotsk. En mars 1922, des intellectuels iakoutes formèrent à Tchouraptcha l’Administration populaire régionale provisoire iakoute, dont l’Armée populaire chassa les Rouges de la plus grande partie de la Iakoutie et assiégea Iakoutsk. Moscou répondit en proclamant la République socialiste soviétique autonome iakoute le 27 avril 1922 et en envoyant environ 5 000 hommes, qui, en septembre, avaient repoussé les insurgés jusqu’à Aïan et Nelkan, près du Pacifique. En septembre 1922, le général Anatoli Pepeliaïev débarqua à Aïan avec environ 750 volontaires de la Droujina des volontaires de Sibérie, partis de Vladivostok, encore aux mains des Blancs, juste avant sa chute. Il prit Amga au début de 1923, mais ne parvint pas à réduire le détachement rouge d’Ivan Strod à la ferme de Sasyl-Sysyy lors d’un siège de dix-huit jours en février et mars, et se replia vers la côte. Une expédition rouge commandée par Stepan Vostretsov partit de Vladivostok en avril, prit Okhotsk au début de juin et, le 18 juin 1923, encercla Aïan, où Pepeliaïev se rendit sans combattre. Les pertes sont estimées à environ 1 000 hommes du côté rouge et à 500 à 1 000 tués parmi les insurgés, avec plus de 1 000 prisonniers.
