# French translations of the catalogue text (wave 14); step bodies follow later.
Yamasee War: Guerre des Yamasees
? A war between South Carolina and a broad alliance of the Native nations of the Southeast, led by the Yamasee and the Muscogee (Creek). Carolina’s trade in deerskins and in Native captives sold as slaves had left the Yamasee and their neighbours deep in debt to traders who abused them, enslaved their kin and let planters’ cattle onto their lands. On Good Friday, 15 April 1715, the Yamasee killed the colony’s Indian agent Thomas Nairne and the traders at Pocotaligo, and within weeks the Muscogee, Catawba, Apalachee and others had killed some 90 of the 100 traders in their towns and raided the settlements to within a few miles of Charles Town. Governor Charles Craven’s militia, with help from Virginia and North Carolina, drove the Yamasee south into Spanish Florida, and the Catawba made peace in 1715. The war turned when the Cherokee allied with Carolina and killed a delegation of Muscogee leaders at Tugaloo in January 1716; the Muscogee moved their towns west to the Chattahoochee and made peace in late 1717. About seven per cent of South Carolina’s colonists had been killed; the war hastened the end of the Native slave trade and of proprietary rule, and set the Muscogee on a course of balancing the British, French and Spanish.
: Une guerre entre la Caroline du Sud et une vaste alliance des nations autochtones du Sud-Est, menée par les Yamasees et les Muscogees (Creeks). Le commerce carolinien des peaux de cerf et des captifs autochtones vendus comme esclaves avait profondément endetté les Yamasees et leurs voisins auprès de marchands qui les maltraitaient, réduisaient leurs proches en esclavage et laissaient le bétail des planteurs envahir leurs terres. Le vendredi saint 15 avril 1715, les Yamasees tuèrent l’agent des affaires indiennes de la colonie, Thomas Nairne, et les marchands présents à Pocotaligo et, en quelques semaines, les Muscogees, les Catawbas, les Apalachees et d’autres avaient tué quelque 90 des 100 marchands établis dans leurs villages et lancé des raids sur les établissements jusqu’à quelques milles de Charles Town. La milice du gouverneur Charles Craven, avec l’aide de la Virginie et de la Caroline du Nord, repoussa les Yamasees vers le sud, en Floride espagnole, et les Catawbas firent la paix en 1715. La guerre bascula lorsque les Cherokees s’allièrent à la Caroline et tuèrent une délégation de chefs muscogees à Tugaloo en janvier 1716 ; les Muscogees déplacèrent leurs villages vers l’ouest, sur la Chattahoochee, et firent la paix à la fin de 1717. Environ sept pour cent des colons de la Caroline du Sud avaient été tués ; la guerre précipita la fin de la traite des esclaves autochtones et du régime des propriétaires, et engagea les Muscogees dans une politique d’équilibre entre Britanniques, Français et Espagnols.
Yamasee, Muscogee (Creek), Catawba and allied nations (Apalachee, Savannah River Shawnee, Waxhaw, Santee and others): Yamasees, Muscogees (Creeks), Catawbas et nations alliées (Apalachees, Shawnees de la Savannah, Waxhaws, Santees et d’autres)
South Carolina, with help from Virginia and North Carolina, and from 1716 the Cherokee: Caroline du Sud, avec l’aide de la Virginie et de la Caroline du Nord, et à partir de 1716 les Cherokees
