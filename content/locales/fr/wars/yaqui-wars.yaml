# French translations of the catalogue text (wave 14); step bodies follow later.
Yaqui Wars: Guerres des Yaquis
? The century of wars between the Yaqui (Yoeme) people of southern Sonora and the Mexican state over the lands of the eight Yaqui towns on the lower Yaqui River. The Yaqui had defeated Spanish expeditions in 1533 and 1609–1610 before accepting Jesuit missionaries on their own terms in 1617, and had risen in 1740. After independence Mexico’s attempts to tax the Yaqui, divide their land and open it to settlers led to the revolt of Juan Banderas (1825–1833), who tried to unite the Native peoples of Sonora, and to recurring wars. From 1875 the Yaqui leader Cajeme governed the valley as a self-ruling nation until the federal army broke it in 1886–1887. Tetabiate’s guerrillas fought on in the Bacatete mountains; after the massacre at Mazocoba in 1900, Porfirio Díaz’s government deported thousands of Yaqui to the henequen plantations of Yucatán and other parts of the south, where many died. Yaqui soldiers fought in the Mexican Revolution, and the last Yaqui rising was put down in 1926–1927 with aircraft. In 1937 President Lázaro Cárdenas recognised a reduced Yaqui territory, and in 2021 the Mexican government apologised to the Yaqui people.
: Le siècle de guerres qui opposa le peuple yaqui (yoeme) du sud du Sonora à l’État mexicain pour les terres des huit villages yaquis du cours inférieur du río Yaqui. Les Yaquis avaient vaincu des expéditions espagnoles en 1533 et en 1609–1610 avant d’accepter, à leurs propres conditions, des missionnaires jésuites en 1617, et ils s’étaient soulevés en 1740. Après l’indépendance, les tentatives du Mexique pour soumettre les Yaquis à l’impôt, diviser leurs terres et les ouvrir aux colons conduisirent à la révolte de Juan Banderas (1825–1833), qui tenta d’unir les peuples autochtones du Sonora, puis à des guerres récurrentes. À partir de 1875, le chef yaqui Cajeme gouverna la vallée comme une nation autonome, jusqu’à ce que l’armée fédérale la brise en 1886–1887. Les guérilleros de Tetabiate poursuivirent le combat dans les montagnes du Bacatete ; après le massacre de Mazocoba en 1900, le gouvernement de Porfirio Díaz déporta des milliers de Yaquis vers les plantations de henequen du Yucatán et d’autres régions du Sud, où beaucoup moururent. Des soldats yaquis combattirent pendant la révolution mexicaine, et le dernier soulèvement yaqui fut réprimé en 1926–1927 avec le concours de l’aviation. En 1937, le président Lázaro Cárdenas reconnut un territoire yaqui réduit et, en 2021, le gouvernement mexicain présenta ses excuses au peuple yaqui.
