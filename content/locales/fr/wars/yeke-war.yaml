# French translations of the catalogue text (wave 13); step bodies follow later.
End of the Yeke kingdom: Fin du royaume yeke
? "The Congo Free State’s seizure of Katanga and the killing of Msiri, king of the Yeke (Garanganze). Msiri, a Nyamwezi trader from the Tabora region, settled in Katanga about 1856 and built a kingdom from his capital, Bunkeya, out of lands that had paid tribute to Kazembe, trading copper, ivory and slaves east to the Swahili and Arab merchants of Zanzibar’s sphere and west to Portuguese Angola through Ovimbundu caravans. The Berlin agreements of 1884–1885 gave Katanga to Leopold II’s Free State on paper, but only effective occupation would secure it, and Cecil Rhodes’s British South Africa Company was also seeking a treaty. Msiri turned away the company’s envoy Alfred Sharpe in 1890 and gave the Free State expedition of Paul Le Marinel only a vague letter in 1891. By then his kingdom was under strain: the Sanga and other subject peoples had risen against him, and his main army was away in the south. The Compagnie du Katanga, one of Leopold’s companies, sent an expedition under the Canadian-born British officer William Stairs, with about 400 Africans hired mostly in Zanzibar, which reached Bunkeya on 14 December 1891 with orders to take Katanga with or without Msiri’s agreement. Msiri received Stairs on 17 December but refused to accept the Free State flag, and left for the fortified village of Munema. On 20 December 1891 Stairs’s second-in-command, the Belgian captain Omer Bodson, went into Munema to arrest him; in the confrontation Bodson shot Msiri dead and was mortally wounded by Msiri’s son Masuka. The expedition’s askaris looted Munema and killed many of its people, Msiri’s head was cut off and displayed, according to the expedition’s Marquis de Bonchamps, and the people of Bunkeya, which may have had 60,000–80,000 inhabitants, scattered amid famine. Stairs recognised Msiri’s adopted son Mukanda-Bantu as chief of a reduced territory and restored the Sanga chiefs Msiri had overthrown, and by early January 1892 he had the treaties that secured Katanga for the Free State; the Anglo-Belgian agreement of 1894 fixed the border on the Luapula. Of the expedition’s 400 Africans, 189 returned to Zanzibar, most of the others having died of disease and hunger, and Stairs died of malaria on the Zambezi on 9 June 1892 (3 June in some accounts)."
: "La mainmise de l’État indépendant du Congo sur le Katanga et la mort de Msiri, roi des Yeke (Garanganze). Msiri, marchand nyamwezi de la région de Tabora, s’établit au Katanga vers 1856 et se constitua un royaume, depuis sa capitale de Bunkeya, sur des terres qui avaient payé tribut au Kazembe ; il échangeait cuivre, ivoire et esclaves à l’est avec les marchands swahilis et arabes de la sphère de Zanzibar et à l’ouest avec l’Angola portugais par l’intermédiaire des caravanes ovimbundu. Les accords de Berlin de 1884–1885 avaient attribué le Katanga, sur le papier, à l’État indépendant de Léopold II, mais seule une occupation effective pouvait le lui assurer, et la British South Africa Company de Cecil Rhodes cherchait elle aussi à obtenir un traité. Msiri éconduisit l’envoyé de la compagnie, Alfred Sharpe, en 1890 et ne remit en 1891 qu’une vague lettre à l’expédition de l’État indépendant conduite par Paul Le Marinel. Son royaume était alors fragilisé : les Sanga et d’autres peuples soumis s’étaient soulevés contre lui, et le gros de son armée se trouvait au sud. La Compagnie du Katanga, l’une des compagnies de Léopold, envoya une expédition commandée par l’officier britannique d’origine canadienne William Stairs, avec environ 400 Africains recrutés pour la plupart à Zanzibar ; elle atteignit Bunkeya le 14 décembre 1891 avec ordre de prendre le Katanga avec ou sans l’accord de Msiri. Msiri reçut Stairs le 17 décembre mais refusa d’accepter le drapeau de l’État indépendant, et partit pour le village fortifié de Munema. Le 20 décembre 1891, l’adjoint de Stairs, le capitaine belge Omer Bodson, entra dans Munema pour l’arrêter ; lors de l’affrontement, Bodson abattit Msiri et fut mortellement blessé par Masuka, fils de Msiri. Les askaris de l’expédition pillèrent Munema et tuèrent nombre de ses habitants, la tête de Msiri fut coupée et exposée, selon le marquis de Bonchamps, membre de l’expédition, et la population de Bunkeya, qui comptait peut-être 60 000 à 80 000 habitants, se dispersa en pleine famine. Stairs reconnut Mukanda-Bantu, fils adoptif de Msiri, comme chef d’un territoire réduit et rétablit les chefs sanga que Msiri avait renversés et, dès le début de janvier 1892, il disposait des traités qui assuraient le Katanga à l’État indépendant ; l’accord anglo-belge de 1894 fixa la frontière sur le Luapula. Sur les 400 Africains de l’expédition, 189 rentrèrent à Zanzibar, la plupart des autres étant morts de maladie et de faim, et Stairs mourut du paludisme sur le Zambèze le 9 juin 1892 (le 3 juin selon certains récits)."
