# French translations of the catalogue text (wave 7); step bodies follow later.
Yemeni Civil War (1994): Guerre civile yéménite (1994)
A short war between the armies of the former North and South Yemen, four years after the two states united in May 1990. The union had kept the two armies separate, and its leaders, President Ali Abdullah Saleh of the north and Vice-President Ali Salim al-Beidh of the south, fell out over the sharing of power and oil revenue and over a string of assassinations of southern Yemeni Socialist Party officials. After al-Beidh withdrew to Aden in 1993, a reconciliation accord signed in Amman in February 1994 failed, and full war broke out on 4 May. On 21 May al-Beidh proclaimed a Democratic Republic of Yemen in the south, which no state recognised. The larger northern forces, joined by Islamist volunteers and southerners who had fled after the South’s own civil war of 1986, besieged Aden and took it on 7 July, while the southern leaders fled abroad. Estimates of the dead range from under 1,000, the government’s figure, to about 10,000. The south’s grievances after the war later fed a secessionist movement.: Une courte guerre entre les armées des anciens Yémen du Nord et Yémen du Sud, quatre ans après l’union des deux États en mai 1990. L’union avait laissé les deux armées séparées, et ses dirigeants, le président Ali Abdallah Saleh, du Nord, et le vice-président Ali Salem al-Beidh, du Sud, se brouillèrent au sujet du partage du pouvoir et des revenus pétroliers, ainsi que d’une série d’assassinats de responsables sudistes du Parti socialiste yéménite. Après le repli d’al-Beidh à Aden en 1993, un accord de réconciliation signé à Amman en février 1994 échoua, et la guerre ouverte éclata le 4 mai. Le 21 mai, al-Beidh proclama dans le Sud une République démocratique du Yémen, qu’aucun État ne reconnut. Les forces du Nord, plus nombreuses, rejointes par des volontaires islamistes et par des Sudistes qui avaient fui après la guerre civile qu’avait connue le Sud en 1986, assiégèrent Aden et la prirent le 7 juillet, tandis que les dirigeants du Sud s’enfuyaient à l’étranger. Les estimations du nombre de morts vont de moins de 1 000, chiffre du gouvernement, à environ 10 000. Les griefs du Sud après la guerre alimentèrent plus tard un mouvement sécessionniste.
