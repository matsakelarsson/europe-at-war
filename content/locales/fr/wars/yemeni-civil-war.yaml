# French translations of the catalogue text (wave 7); step bodies follow later.
Yemeni Civil War: Guerre civile yéménite
? The war that began when the Houthis (Ansar Allah), a Zaydi Shia revivalist movement from the far north, took the capital Sanaa in September 2014, allied with the forces of the former president Ali Abdullah Saleh, and drove President Abd Rabbuh Mansur Hadi’s government south to Aden and into exile. In March 2015 a Saudi-led coalition intervened against the Houthis, whom it saw as Iran’s proxies, with air strikes and a blockade, and southern forces backed by the United Arab Emirates drove the Houthis out of Aden. The war then settled into years of stalemate, air strikes on Houthi-held areas, Houthi missile attacks on Saudi Arabia, and one of the world’s worst humanitarian crises. A UN-brokered truce of April 2022 largely held for four years, while the Houthis attacked shipping in the Red Sea in 2023–2025 and fought the United States and Israel. In 2026 the war flared up again, with a Houthi offensive on the Red Sea coast and around Taiz and a Saudi-backed government counter-offensive; the fighting was continuing in late November 2026. By the end of 2021 the UN estimated about 377,000 deaths, most of them from hunger and disease. Last updated 27 November 2026.
: "La guerre qui commença lorsque les Houthis (Ansar Allah), mouvement de renouveau chiite zaydite originaire de l’extrême nord du pays, prirent la capitale, Sanaa, en septembre 2014, alliés aux forces de l’ancien président Ali Abdallah Saleh, et chassèrent le gouvernement du président Abd Rabbo Mansour Hadi vers le sud, à Aden, puis en exil. En mars 2015, une coalition dirigée par l’Arabie saoudite intervint contre les Houthis, qu’elle considérait comme des supplétifs de l’Iran, par des frappes aériennes et un blocus, et des forces du Sud soutenues par les Émirats arabes unis chassèrent les Houthis d’Aden. La guerre s’enlisa ensuite dans des années d’impasse, de frappes aériennes sur les zones tenues par les Houthis, d’attaques de missiles des Houthis contre l’Arabie saoudite et de l’une des pires crises humanitaires du monde. Une trêve négociée par l’ONU en avril 2022 tint pour l’essentiel pendant quatre ans, tandis que les Houthis attaquaient la navigation en mer Rouge en 2023–2025 et combattaient les États-Unis et Israël. En 2026, la guerre se ralluma, avec une offensive des Houthis sur la côte de la mer Rouge et autour de Taëz et une contre-offensive gouvernementale soutenue par l’Arabie saoudite ; les combats se poursuivaient fin novembre 2026. Fin 2021, l’ONU estimait le nombre de morts à environ 377 000, dus pour la plupart à la faim et aux maladies. Dernière mise à jour : 27 novembre 2026."
