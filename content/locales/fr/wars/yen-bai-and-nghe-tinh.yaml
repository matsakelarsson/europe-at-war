# French translations of the catalogue text (wave 11); step bodies follow later.
Yên Bái uprising and the Nghệ-Tĩnh soviets: Soulèvement de Yên Bái et soviets du Nghệ-Tĩnh
? Two risings against French rule in Vietnam in 1930–1931, one nationalist and one communist, both crushed. The Vietnamese Nationalist Party (Việt Nam Quốc Dân Đảng, VNQDĐ), founded in Hanoi in 1927 on the model of the Chinese Kuomintang and led by Nguyễn Thái Học, lost about 1,000 members to arrests after the killing of the labour recruiter Bazin in February 1929. It planned a general rising among the Vietnamese troops of Tonkin. On the night of 9–10 February 1930 about 50 Vietnamese riflemen of the Yên Bái garrison and about 60 party members attacked their French officers and killed five of them, but most of the 550 Vietnamese soldiers there did not join, and the rising was put down within the day; attacks at Hưng Hóa and Lâm Thao and bombs in Hanoi also failed. On 16 February French aircraft bombed the village of Cổ Am, killing about 200 people, most of them civilians. Courts tried 547 people and passed 80 death sentences, and on 17 June 1930 Nguyễn Thái Học and twelve others were guillotined at Yên Bái. From May 1930 strikes and peasant marches spread through the provinces of Nghệ An and Hà Tĩnh, led by local cadres of the Communist Party founded in February 1930 under Nguyễn Ái Quốc (later Ho Chi Minh) and renamed the Indochinese Communist Party in October. On 12 September aircraft bombed a march at Hưng Nguyên, killing an estimated 140 to 200 people. In many villages peasant associations, later called the Nghệ-Tĩnh soviets, drove out officials, cancelled taxes and shared out communal land and rice, until French troops, the Foreign Legion and new military posts broke them by late 1931. The historian Martin Bernal estimates that over 1,300 Vietnamese were killed and about 1,000 more died in prisons and camps; the party lost most of its cadres, but it soon replaced the VNQDĐ as the main force of Vietnamese resistance.
: Deux soulèvements contre la domination française au Vietnam en 1930–1931, l’un nationaliste, l’autre communiste, tous deux écrasés. Le Parti nationaliste vietnamien (Việt Nam Quốc Dân Đảng, VNQDĐ), fondé à Hanoï en 1927 sur le modèle du Kuomintang chinois et dirigé par Nguyễn Thái Học, perdit environ 1 000 membres dans les arrestations qui suivirent l’assassinat du recruteur de main-d’œuvre Bazin en février 1929. Il prépara un soulèvement général parmi les troupes vietnamiennes du Tonkin. Dans la nuit du 9 au 10 février 1930, une cinquantaine de tirailleurs vietnamiens de la garnison de Yên Bái et une soixantaine de membres du parti attaquèrent leurs officiers français et en tuèrent cinq, mais la plupart des 550 soldats vietnamiens présents ne se joignirent pas à eux, et le soulèvement fut réprimé dans la journée ; les attaques de Hưng Hóa et de Lâm Thao et les attentats à la bombe de Hanoï échouèrent également. Le 16 février, l’aviation française bombarda le village de Cổ Am, tuant environ 200 personnes, pour la plupart des civils. Les tribunaux jugèrent 547 personnes et prononcèrent 80 condamnations à mort, et le 17 juin 1930 Nguyễn Thái Học et douze de ses compagnons furent guillotinés à Yên Bái. À partir de mai 1930, grèves et marches paysannes gagnèrent les provinces de Nghệ An et de Hà Tĩnh, sous la conduite des cadres locaux du Parti communiste fondé en février 1930 sous l’égide de Nguyễn Ái Quốc (le futur Hô Chi Minh) et rebaptisé Parti communiste indochinois en octobre. Le 12 septembre, des avions bombardèrent une marche à Hưng Nguyên, tuant entre 140 et 200 personnes selon les estimations. Dans de nombreux villages, des associations paysannes, appelées plus tard les soviets du Nghệ-Tĩnh, chassèrent les fonctionnaires, abolirent les impôts et partagèrent les terres communales et le riz, jusqu’à ce que les troupes françaises, la Légion étrangère et de nouveaux postes militaires en viennent à bout à la fin de 1931. L’historien Martin Bernal estime que plus de 1 300 Vietnamiens furent tués et qu’environ 1 000 autres moururent dans les prisons et les camps ; le parti perdit la plupart de ses cadres, mais il supplanta bientôt le VNQDĐ comme principale force de la résistance vietnamienne.
