# French translations of the catalogue text (wave 10); step bodies follow later.
Yeosu–Suncheon rebellion: Rébellion de Yeosu–Suncheon
? "A rebellion of the South Korean army’s 14th Regiment in South Jeolla in October 1948, known in Korea as the Yeosu–Suncheon 10·19 incident. On the night of 19 October, as the regiment prepared to sail from Yeosu to fight the Jeju uprising, members of the Workers’ Party of South Korea among its soldiers, led by Staff Sergeant Ji Chang-su and Lieutenant Kim Ji-hoe, seized the armoury and called on the troops to refuse to fight fellow Koreans. Some 2,000–3,000 soldiers joined them, with local leftists; they took Yeosu and Suncheon and spread to Gwangyang, Gurye, Boseong and other towns, killing police officers, officials and right-wing civilians. The government declared martial law and sent loyal regiments: Suncheon was retaken on 23 October and Yeosu, after two days of street fighting, on 27 October. In the reprisals that followed, troops and police screened the townspeople and executed many suspected of helping the rebels, often without trial. Estimates of the dead range from about 3,000 to more than 10,000, most of them killed by government forces. The surviving rebels withdrew to Mount Jiri and fought as guerrillas into the Korean War. The rebellion led to the National Security Act of December 1948 and a purge of suspected leftists in the army, in which Major Park Chung-hee, later president, was convicted and spared after cooperating with investigators. A special law of 2021 provided for investigating the killings and restoring the honour of the victims."
: "Une rébellion du 14e régiment de l’armée sud-coréenne dans le Jeolla du Sud en octobre 1948, connue en Corée sous le nom d’« incident 10·19 de Yeosu–Suncheon ». Dans la nuit du 19 octobre, alors que le régiment s’apprêtait à embarquer à Yeosu pour combattre le soulèvement de Jeju, des membres du Parti du travail de Corée du Sud parmi ses soldats, menés par le sergent-chef Ji Chang-su et le lieutenant Kim Ji-hoe, s’emparèrent de l’armurerie et appelèrent les troupes à refuser de combattre leurs compatriotes coréens. Quelque 2 000 à 3 000 soldats se joignirent à eux, avec des militants de gauche locaux ; ils prirent Yeosu et Suncheon et s’étendirent à Gwangyang, Gurye, Boseong et d’autres villes, tuant des policiers, des fonctionnaires et des civils de droite. Le gouvernement proclama la loi martiale et envoya des régiments loyaux : Suncheon fut reprise le 23 octobre et Yeosu, après deux jours de combats de rue, le 27 octobre. Lors des représailles qui suivirent, les militaires et la police passèrent au crible la population des villes et exécutèrent de nombreuses personnes soupçonnées d’avoir aidé les rebelles, souvent sans procès. Les estimations du nombre de morts vont d’environ 3 000 à plus de 10 000, la plupart tués par les forces gouvernementales. Les rebelles survivants se replièrent sur le mont Jiri et combattirent comme guérilleros jusque dans la guerre de Corée. La rébellion entraîna l’adoption de la loi sur la sécurité nationale de décembre 1948 et une purge, dans l’armée, des hommes soupçonnés de sympathies de gauche, au cours de laquelle le commandant Park Chung-hee, futur président, fut condamné puis épargné après avoir coopéré avec les enquêteurs. Une loi spéciale de 2021 a prévu une enquête sur les tueries et le rétablissement de l’honneur des victimes."
