# French translations of the catalogue text (wave 9); step bodies follow later.
Yermak’s campaign and the conquest of the Khanate of Sibir: Campagne d’Iermak et conquête du khanat de Sibir
The Russian conquest of the Khanate of Sibir, the Tatar state on the Tobol and Irtysh rivers east of the Urals, which opened Siberia to Russia. In 1581 or 1582 the Stroganov merchant family, who held frontier lands on the Kama and the Chusovaya, sent a band of about 840 Volga Cossacks and hired men under the ataman Yermak Timofeyevich over the Urals. Armed with muskets and a few small guns, they beat Khan Kuchum’s army at Chuvash Cape and took his capital, Qashliq, in October 1582. Ivan IV pardoned the Cossacks and sent troops, but famine, revolts and Tatar attacks wore the force down, and in August 1585 Kuchum surprised Yermak’s camp at the mouth of the Vagay, where Yermak drowned. The survivors left Siberia. Government expeditions then built forts at Tyumen (1586), Tobolsk (1587), Tara, Surgut and elsewhere, and on 20 August 1598 a force from Tara destroyed Kuchum’s camp on the upper Ob. Kuchum escaped and died in exile a few years later; his sons and grandsons raided the Russian frontier for decades.: La conquête russe du khanat de Sibir, l’État tatar établi sur le Tobol et l’Irtych à l’est de l’Oural, qui ouvrit la Sibérie à la Russie. En 1581 ou 1582, la famille de marchands Stroganov, qui détenait des terres frontalières sur la Kama et la Tchoussovaïa, envoya au-delà de l’Oural une troupe d’environ 840 Cosaques de la Volga et hommes à gages, commandée par l’ataman Iermak Timofeïevitch. Armés de mousquets et de quelques petits canons, ils battirent l’armée du khan Koutchoum au cap Tchouvache et prirent sa capitale, Qashliq, en octobre 1582. Ivan IV gracia les Cosaques et envoya des troupes, mais la famine, les révoltes et les attaques tatares usèrent la troupe et, en août 1585, Koutchoum surprit le camp d’Iermak à l’embouchure de la Vagaï, où Iermak se noya. Les survivants quittèrent la Sibérie. Des expéditions envoyées par le gouvernement construisirent ensuite des forts à Tioumen (1586), Tobolsk (1587), Tara, Sourgout et ailleurs et, le 20 août 1598, une troupe partie de Tara détruisit le camp de Koutchoum sur le haut Ob. Koutchoum s’échappa et mourut en exil quelques années plus tard ; ses fils et ses petits-fils razzièrent la frontière russe pendant des décennies.
