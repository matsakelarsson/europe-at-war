# French translations of the catalogue text (wave 10); step bodies follow later.
Yi Gwal’s rebellion: Rébellion de Yi Gwal
? A revolt by Yi Gwal, a general who had helped put King Injo on the throne in the coup of 1623 and was then sent north as deputy commander at Yeongbyeon against the Later Jin. Rewarded less than he expected, and accused of plotting by the ruling Westerners’ faction, he killed the officials sent to arrest his son and rose on 11 March 1624 with about 12,000 men, among them some 100 Japanese soldiers who had gone over to Korea in the Imjin War. Avoiding Pyongyang, where the commander-in-chief Jang Man had too few troops to stop him, he marched south by side roads, beat government forces at Hwangju and on the Imjin River, and on 26 March crossed the Imjin. Injo fled south to Gongju, and Yi Gwal entered Hanseong, the first rebel to take the capital in Joseon history, and set up Prince Heungan as king. On 29 March Jang Man and Jeong Chung-sin defeated him on the hill of Gilmajae (Anhyeon), just outside the city. He fled towards Icheon, where his own officers killed him and Han Myeong-ryeon and gave themselves up. The revolt weakened the northern defences, and Han Myeong-ryeon’s son, who escaped to the Later Jin, urged them to invade Korea, which they did in 1627.
: Une révolte de Yi Gwal, un général qui avait aidé à porter le roi Injo sur le trône lors du coup d’État de 1623 et avait ensuite été envoyé dans le nord comme commandant adjoint à Yeongbyeon, face aux Jin postérieurs. Moins récompensé qu’il ne l’espérait, et accusé de complot par la faction des Occidentaux, alors au pouvoir, il tua les fonctionnaires envoyés arrêter son fils et se souleva le 11 mars 1624 avec environ 12 000 hommes, dont une centaine de soldats japonais passés du côté coréen pendant la guerre d’Imjin. Évitant Pyongyang, où le commandant en chef Jang Man n’avait pas assez de troupes pour l’arrêter, il marcha vers le sud par des routes secondaires, battit les forces gouvernementales à Hwangju et sur la rivière Imjin et, le 26 mars, franchit l’Imjin. Injo s’enfuit vers le sud, à Gongju, et Yi Gwal entra à Hanseong, premier rebelle de l’histoire de Joseon à prendre la capitale, et y installa le prince Heungan comme roi. Le 29 mars, Jang Man et Jeong Chung-sin le battirent sur la colline de Gilmajae (Anhyeon), juste à l’extérieur de la ville. Il s’enfuit vers Icheon, où ses propres officiers le tuèrent, ainsi que Han Myeong-ryeon, et se rendirent. La révolte affaiblit les défenses du nord, et le fils de Han Myeong-ryeon, qui s’était enfui chez les Jin postérieurs, les poussa à envahir la Corée, ce qu’ils firent en 1627.
