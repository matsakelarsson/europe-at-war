# French translations of the catalogue text (wave 10); step bodies follow later.
Yi In-jwa’s rebellion: Rébellion de Yi In-jwa
? A revolt against King Yeongjo, also called the Musin rebellion after the year 1728 in the sixty-year cycle. Members of the radical Soron faction, driven from power after Yeongjo’s accession in 1724, and of the excluded Namin faction claimed that Yeongjo had poisoned his half-brother King Gyeongjong and was not King Sukjong’s son, and planned to replace him with Prince Milpung, a descendant of Crown Prince Sohyeon. The plan in the capital was betrayed, but in the provinces Yi In-jwa’s band, entering as a funeral party, took Cheongju on the night of 23 April 1728, killing the provincial army commander, and spread to the towns around it; in Gyeongsang, Jeong Hui-ryang raised troops and took Anui, Geochang, Hamyang and Hapcheon. A government army of some 2,300 men under O Myeong-hang, with Bak Mun-su as his aide, defeated Yi In-jwa at Anseong and Juksan at the start of May; Yi was captured and executed in Hanseong, local gentry retook Cheongju, and troops from Gyeongsang put down Jeong Hui-ryang. Yeongjo answered the revolt with his tangpyeong policy of appointing men from all factions.
: Une révolte contre le roi Yeongjo, appelée aussi rébellion de Musin, d’après l’année 1728 dans le cycle sexagésimal. Des membres de la faction radicale Soron, écartés du pouvoir après l’avènement de Yeongjo en 1724, et de la faction Namin, tenue à l’écart, affirmaient que Yeongjo avait empoisonné son demi-frère le roi Gyeongjong et n’était pas le fils du roi Sukjong, et projetaient de le remplacer par le prince Milpung, descendant du prince héritier Sohyeon. Le complot dans la capitale fut trahi, mais en province la bande de Yi In-jwa, entrée sous l’apparence d’un cortège funèbre, prit Cheongju dans la nuit du 23 avril 1728, tuant le commandant de l’armée provinciale, et s’étendit aux villes voisines ; dans le Gyeongsang, Jeong Hui-ryang leva des troupes et prit Anui, Geochang, Hamyang et Hapcheon. Une armée gouvernementale d’environ 2 300 hommes commandée par O Myeong-hang, secondé par Bak Mun-su, battit Yi In-jwa à Anseong et à Juksan au début de mai ; Yi fut capturé et exécuté à Hanseong, la petite noblesse locale reprit Cheongju, et des troupes du Gyeongsang vinrent à bout de Jeong Hui-ryang. Yeongjo répondit à la révolte par sa politique du tangpyeong, qui consistait à nommer des hommes de toutes les factions.
