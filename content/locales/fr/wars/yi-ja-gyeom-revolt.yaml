# French translations of the catalogue text (wave 10); step bodies follow later.
Yi Ja-gyeom’s revolt: Révolte de Yi Ja-gyeom
? A struggle for power at the Goryeo court that left most of the royal palace in ashes. Yi Ja-gyeom, head of the Inju (Gyeongwon) Yi clan, was both the grandfather and the father-in-law of King Injong, having married two of his daughters to the young king, and by the 1120s he controlled appointments and much of the government. In the second month of 1126 officials close to the king tried to remove him and his ally, the general Cheok Jun-gyeong, attacking at night and killing Cheok’s brother and son. Cheok Jun-gyeong’s soldiers set fire to the palace and broke in, killed the king’s supporters, and took Injong to Yi Ja-gyeom’s house; the palace burned almost to the ground. Yi Ja-gyeom, now in full control, also had Goryeo accept the Jurchen Jin empire as overlord. The king then secretly won Cheok Jun-gyeong over through the official Choe Sa-jeon, and in the fifth month of 1126 Cheok’s troops arrested Yi Ja-gyeom, who was exiled to Yeonggwang and died there the same year. Cheok Jun-gyeong was himself exiled in 1127.
: Une lutte pour le pouvoir à la cour du Goryeo qui réduisit en cendres la plus grande partie du palais royal. Yi Ja-gyeom, chef du clan Yi d’Inju (Gyeongwon), était à la fois le grand-père et le beau-père du roi Injong, ayant marié deux de ses filles au jeune roi, et dans les années 1120 il contrôlait les nominations et une grande partie du gouvernement. Au deuxième mois de 1126, des fonctionnaires proches du roi tentèrent de l’écarter, ainsi que son allié, le général Cheok Jun-gyeong, en lançant une attaque nocturne au cours de laquelle furent tués le frère et le fils de Cheok. Les soldats de Cheok Jun-gyeong mirent le feu au palais et y firent irruption, tuèrent les partisans du roi et emmenèrent Injong dans la demeure de Yi Ja-gyeom ; le palais brûla presque entièrement. Yi Ja-gyeom, désormais seul maître du pouvoir, fit aussi reconnaître par le Goryeo la suzeraineté de l’empire jurchen des Jin. Le roi gagna alors secrètement Cheok Jun-gyeong à sa cause par l’intermédiaire du fonctionnaire Choe Sa-jeon et, au cinquième mois de 1126, les troupes de Cheok arrêtèrent Yi Ja-gyeom, qui fut exilé à Yeonggwang et y mourut la même année. Cheok Jun-gyeong fut lui-même exilé en 1127.
