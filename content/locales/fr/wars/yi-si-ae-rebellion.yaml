# French translations of the catalogue text (wave 10); step bodies follow later.
Yi Si-ae’s rebellion: Rébellion de Yi Si-ae
? A rising in Hamgil (later Hamgyong) province in the north-east against King Sejo’s centralising rule. The north-east, the home region of the dynasty’s founder, had been governed by local landowning families who held the frontier against the Jurchens, but Sejo increasingly sent officials from the south and tightened control through a household tally system. Yi Si-ae, a former magistrate of Hoeryong from a powerful family of Gilju (Kilju), rose in the fifth month of 1467. He killed the provincial army commander Gang Hyo-mun at Gilju and spread rumours that troops from the south were coming to massacre the northerners; local people then killed the officials sent from the capital across the province, among them the governor, Sin Myeon, at Hamhung. Yi Si-ae also sent word to the court that Gang Hyo-mun had plotted with the great ministers Han Myeong-hoe and Sin Suk-ju, and Sejo briefly had them arrested. The king sent an army under Prince Guseong (Yi Jun), with Heo Jong, Gang Sun, Eo Yu-so and Nam I, which grew to some 30,000 men and more. Yi Si-ae’s forces, which included the province’s experienced frontier troops with firearms, held their own at Hongwon and Bukcheong, but late in the seventh month they were routed at the Mannyeong pass near Iwon. Yi Si-ae fled north towards the Jurchen lands, was seized by his own followers through a ruse of the government officer Heo Yu-rye, and was executed on the twelfth day of the eighth month. The province was split in two and the local self-governing councils (yuhyangso) were abolished.
: Un soulèvement dans la province de Hamgil (plus tard Hamgyong), dans le nord-est, contre le pouvoir centralisateur du roi Sejo. Le nord-est, région d’origine du fondateur de la dynastie, avait été gouverné par des familles de propriétaires locaux qui tenaient la frontière face aux Jurchen, mais Sejo y envoyait de plus en plus de fonctionnaires venus du sud et renforça son contrôle par un système de tablettes de recensement des foyers. Yi Si-ae, ancien magistrat de Hoeryong issu d’une puissante famille de Gilju (Kilju), se souleva au cinquième mois de 1467. Il tua le commandant de l’armée provinciale, Gang Hyo-mun, à Gilju et répandit la rumeur que des troupes du sud venaient massacrer les gens du nord ; la population locale tua alors dans toute la province les fonctionnaires envoyés par la capitale, dont le gouverneur, Sin Myeon, à Hamhung. Yi Si-ae fit aussi savoir à la cour que Gang Hyo-mun avait comploté avec les grands ministres Han Myeong-hoe et Sin Suk-ju, et Sejo les fit brièvement arrêter. Le roi envoya une armée commandée par le prince Guseong (Yi Jun), avec Heo Jong, Gang Sun, Eo Yu-so et Nam I, qui atteignit quelque 30 000 hommes, voire davantage. Les forces de Yi Si-ae, qui comprenaient les troupes frontalières aguerries de la province, dotées d’armes à feu, tinrent bon à Hongwon et à Bukcheong, mais à la fin du septième mois elles furent mises en déroute au col de Mannyeong, près d’Iwon. Yi Si-ae s’enfuit vers le nord en direction des terres jurchen, fut capturé par ses propres partisans grâce à une ruse de l’officier gouvernemental Heo Yu-rye, et fut exécuté le douzième jour du huitième mois. La province fut divisée en deux et les conseils locaux autonomes (yuhyangso) furent abolis.
