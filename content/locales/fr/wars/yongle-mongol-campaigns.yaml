# French translations of the catalogue text (wave 9); step bodies follow later.
Yongle Emperor’s campaigns against the Mongols: Campagnes de l’empereur Yongle contre les Mongols
Five expeditions that the Yongle Emperor led in person into Mongolia between 1410 and 1424, after a Ming army under Qiu Fu was destroyed on the Kherlen River in 1409. The Mongols were divided between the Eastern Mongols, led by the chancellor Arughtai and his khan Bunyashiri, and the Oirats of the west under Mahmud. In 1410 the emperor defeated Bunyashiri on the Onon and Arughtai near the Taor River; in 1414 his cannon broke the Oirats between the Tuul and the Kherlen. The campaigns of 1422, 1423 and 1424, with armies of more than 200,000 men and enormous supply trains, failed to bring Arughtai to battle, and the emperor died on the way home from the last of them, on 12 August 1424. The expeditions kept the Mongols divided but won no lasting settlement; his successors gave them up and pulled the frontier back to the Great Wall line.: Cinq expéditions que l’empereur Yongle mena en personne en Mongolie entre 1410 et 1424, après l’anéantissement d’une armée Ming commandée par Qiu Fu sur le Kherlen en 1409. Les Mongols étaient divisés entre les Mongols orientaux, menés par le chancelier Arughtai et son khan Bunyashiri, et les Oïrats de l’ouest, sous Mahmud. En 1410, l’empereur battit Bunyashiri sur l’Onon et Arughtai près de la rivière Taor ; en 1414, ses canons brisèrent les Oïrats entre la Tuul et le Kherlen. Les campagnes de 1422, 1423 et 1424, avec des armées de plus de 200 000 hommes et d’énormes convois de ravitaillement, ne parvinrent pas à contraindre Arughtai à livrer bataille, et l’empereur mourut au retour de la dernière, le 12 août 1424. Ces expéditions maintinrent les Mongols divisés mais n’aboutirent à aucun règlement durable ; ses successeurs y renoncèrent et ramenèrent la frontière sur la ligne de la Grande Muraille.
