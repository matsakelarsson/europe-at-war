# French translations of the catalogue text (wave 12); step bodies follow later.
Zaian War: Guerre zaïane
A war between France and the Zaian confederation of Berber tribes in the Middle Atlas of Morocco, part of the French conquest of the country. The Zaians, led since 1877 by Mouha ou Hammou Zayani, held the mountains around Khénifra, on the routes between Fez, Marrakesh and the south-east. French columns took Khénifra in June 1914, but on 13 November 1914 a French column that attacked the Zaian winter camp at El Herri was surrounded and lost 623 men killed, the heaviest French defeat in Morocco. During the First World War Lyautey, who had sent most of his troops to France, held a line of posts while the Zaians and their allies, aided with money and arms by German and Ottoman agents, raided it. After the war France won over Mouha ou Hammou’s sons, who submitted in 1920; he was killed in March 1921 fighting tribesmen who had gone over to the French, and a French offensive in September 1921 ended the war. His ally Moha ou Said and others fought on in the High Atlas into the 1930s.: Une guerre entre la France et la confédération zaïane, un ensemble de tribus berbères du Moyen Atlas marocain, qui s’inscrivit dans la conquête française du pays. Les Zaïans, menés depuis 1877 par Mouha ou Hammou Zayani, tenaient les montagnes autour de Khénifra, sur les routes reliant Fès, Marrakech et le sud-est. Des colonnes françaises prirent Khénifra en juin 1914, mais le 13 novembre 1914 une colonne française qui attaquait le campement d’hiver zaïan d’El Herri fut encerclée et perdit 623 tués, la plus lourde défaite française au Maroc. Pendant la Première Guerre mondiale, Lyautey, qui avait envoyé la plupart de ses troupes en France, tint une ligne de postes que les Zaïans et leurs alliés, soutenus en argent et en armes par des agents allemands et ottomans, harcelaient de leurs raids. Après la guerre, la France rallia les fils de Mouha ou Hammou, qui se soumirent en 1920 ; il fut tué en mars 1921 en combattant des membres de tribus passés aux Français, et une offensive française en septembre 1921 mit fin à la guerre. Son allié Moha ou Said et d’autres continuèrent le combat dans le Haut Atlas jusque dans les années 1930.
