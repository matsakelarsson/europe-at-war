# French translations of the catalogue text (wave 7); step bodies follow later.
Zand–Qajar war: Guerre entre Zand et Qadjars
The struggle for Iran after the death of Karim Khan Zand in 1779. Agha Mohammad Khan, chief of the Qajar tribe and for sixteen years a hostage at the Zand court in Shiraz, escaped to the Caspian provinces, fought off his own brothers and several Zand armies, and made Tehran his capital in 1786, while the Zand princes fought each other for the throne. He took Shiraz in 1792 and in 1794 captured Kerman, where the last Zand ruler, Lotf Ali Khan, had made his stand, punishing its people with mass blinding and enslavement. Lotf Ali Khan was handed over at Bam and put to death, and the Qajars ruled Iran until 1925.: La lutte pour l’Iran après la mort de Karim Khan Zand en 1779. Agha Mohammad Khan, chef de la tribu qadjare, retenu seize ans en otage à la cour zand de Chiraz, s’enfuit vers les provinces caspiennes, repoussa ses propres frères et plusieurs armées zand, et fit de Téhéran sa capitale en 1786, tandis que les princes zand se disputaient le trône. Il prit Chiraz en 1792 et, en 1794, Kerman, où s’était retranché le dernier souverain zand, Lotf Ali Khan ; il en punit les habitants par des aveuglements en masse et la réduction en esclavage. Lotf Ali Khan fut livré à Bam et mis à mort, et les Qadjars régnèrent sur l’Iran jusqu’en 1925.
