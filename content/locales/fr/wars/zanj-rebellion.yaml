# French translations of the catalogue text (wave 7); step bodies follow later.
Zanj Rebellion: Révolte des Zanj
A rising of slaves and other poor people in the marshes and salt flats around Basra in southern Iraq, led by Ali ibn Muhammad, who claimed descent from the Prophet’s family. Many of his followers were East African slaves, the Zanj, who were made to clear the salt crust from the land. For fourteen years the rebels held the marshes of lower Iraq, sacked Ubulla, Basra, Ahvaz and Wasit and came within about 80 km of Baghdad, while the caliphate was also at war with the Saffarids of Iran. From 879 the regent al-Muwaffaq and his son Abu’l-Abbas, the future caliph al-Mu’tadid, won back the marshes, and in August 883 they took the rebel capital, al-Mukhtara.: Soulèvement d’esclaves et d’autres pauvres dans les marais et les salines des environs de Bassora, dans le sud de l’Irak, mené par Ali ibn Muhammad, qui se disait descendant de la famille du Prophète. Beaucoup de ses partisans étaient des esclaves d’Afrique de l’Est, les Zanj, employés à débarrasser les terres de leur croûte de sel. Pendant quatorze ans, les rebelles tinrent les marais du bas Irak, mirent à sac Ubulla, Bassora, Ahvaz et Wasit et arrivèrent à environ 80 km de Bagdad, alors que le califat était aussi en guerre contre les Saffarides d’Iran. À partir de 879, le régent al-Muwaffaq et son fils Abu’l-Abbas, le futur calife al-Mu’tadid, reconquirent les marais, et en août 883 ils prirent la capitale des rebelles, al-Mukhtara.
