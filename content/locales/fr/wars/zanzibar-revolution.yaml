# French translations of the catalogue text (wave 13); step bodies follow later.
Zanzibar Revolution: Révolution de Zanzibar
? The overthrow of the Sultan of Zanzibar and his Arab-led government by African insurgents on 12 January 1964, a month after the islands became independent, and the killings of Arabs and South Asians that followed. Zanzibar’s population of about 300,000 included some 230,000 Africans, among them people of mainland origin and Shirazis who claimed Persian descent, about 50,000 Arabs, who owned most of the land, and 20,000 South Asians. In elections in 1961 and 1963 the African-led Afro-Shirazi Party (ASP) won the most votes but, under a constituency map drawn to its disadvantage, not a majority of seats, and the Zanzibar Nationalist Party and its ally formed the government that took Zanzibar to independence on 10 December 1963 under Sultan Jamshid bin Abdullah. Before dawn on 12 January 1964 some 600–800 poorly armed men, many from the ASP Youth League and joined by recently dismissed policemen, led by John Okello, a Ugandan labourer and self-styled “field marshal”, seized the police armouries, the radio station and the airstrip; the Sultan fled by yacht. Gangs then killed Arabs and South Asians across Unguja, looting their property and raping women. Estimates of the dead range from several hundred to 20,000; Western newspapers at the time gave 2,000–4,000. A Revolutionary Council under the ASP leader Abeid Karume proclaimed the People’s Republic of Zanzibar and Pemba. Britain and the United States evacuated their citizens and Britain drew up intervention plans it never carried out; the Soviet Union, China and East Germany recognised the new government at once. Karume sidelined Okello, who was barred from the islands in March, and on 26 April 1964 Zanzibar united with Tanganyika in what became the United Republic of Tanzania.
: Le renversement du sultan de Zanzibar et de son gouvernement à direction arabe par des insurgés africains le 12 janvier 1964, un mois après l’indépendance des îles, et les tueries d’Arabes et de Sud-Asiatiques qui suivirent. La population de Zanzibar, environ 300 000 habitants, comprenait quelque 230 000 Africains, parmi lesquels des personnes originaires du continent et des Shirazi qui revendiquaient une ascendance persane, environ 50 000 Arabes, qui possédaient la plupart des terres, et 20 000 Sud-Asiatiques. Aux élections de 1961 et de 1963, l’Afro-Shirazi Party (ASP), à direction africaine, obtint le plus de voix mais, en raison d’un découpage électoral qui le désavantageait, pas la majorité des sièges, et le Zanzibar Nationalist Party et son allié formèrent le gouvernement qui mena Zanzibar à l’indépendance le 10 décembre 1963 sous le sultan Jamshid bin Abdullah. Avant l’aube du 12 janvier 1964, quelque 600 à 800 hommes mal armés, venus pour beaucoup de la Ligue de la jeunesse de l’ASP et rejoints par des policiers récemment renvoyés, menés par John Okello, ouvrier ougandais qui s’était proclamé « maréchal », s’emparèrent des armureries de la police, de la station de radio et de la piste d’atterrissage ; le sultan s’enfuit en yacht. Des bandes tuèrent ensuite des Arabes et des Sud-Asiatiques dans toute l’île d’Unguja, pillant leurs biens et violant des femmes. Les estimations du nombre de morts vont de plusieurs centaines à 20 000 ; les journaux occidentaux de l’époque avançaient 2 000 à 4 000. Un Conseil révolutionnaire dirigé par le chef de l’ASP, Abeid Karume, proclama la République populaire de Zanzibar et Pemba. La Grande-Bretagne et les États-Unis évacuèrent leurs ressortissants, et la Grande-Bretagne élabora des plans d’intervention qu’elle ne mit jamais à exécution ; l’Union soviétique, la Chine et l’Allemagne de l’Est reconnurent aussitôt le nouveau gouvernement. Karume écarta Okello, interdit de séjour dans les îles en mars, et le 26 avril 1964 Zanzibar s’unit au Tanganyika dans ce qui devint la République unie de Tanzanie.
