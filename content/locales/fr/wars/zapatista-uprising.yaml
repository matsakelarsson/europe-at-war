# French translations of the catalogue text (wave 14); step bodies follow later.
Zapatista uprising: Soulèvement zapatiste
? The armed rising of the Zapatista Army of National Liberation (EZLN) in Chiapas, Mexico’s southernmost and one of its poorest states, on 1 January 1994, the day the North American Free Trade Agreement (NAFTA) came into force. The EZLN, founded in the Lacandon Jungle in 1983 by a small group of urban leftists who joined Tzeltal, Tzotzil, Ch’ol and Tojolabal Maya communities, took its name from Emiliano Zapata and spoke for Indigenous peoples who demanded land, work, health care, education, democracy and an end to discrimination, and who saw NAFTA and the reform of 1992 that ended land redistribution as a threat to their communities. Several thousand insurgents, many of them women, seized San Cristóbal de las Casas, Ocosingo, Las Margaritas, Altamirano and other towns and declared war on the federal army and the government of President Carlos Salinas de Gortari. The army struck back with troops, aircraft and armour; the worst fighting was in the market of Ocosingo. On 12 January, as large crowds marched in Mexico City for peace, Salinas declared a ceasefire. Official figures gave about 145 dead, among them soldiers, police, insurgents and civilians; other estimates are higher. The EZLN’s spokesman, Subcomandante Marcos, became known around the world. Talks led to the San Andrés Accords on Indigenous rights in February 1996, which the government did not put into law, while an army offensive in February 1995 and paramilitary violence, above all the Acteal massacre of 1997, continued the conflict at lower intensity. The EZLN has kept its arms but has not fought the army since, and governs its own autonomous communities in Chiapas.
: Le soulèvement armé de l’Armée zapatiste de libération nationale (EZLN) au Chiapas, l’État le plus méridional du Mexique et l’un des plus pauvres, le 1er janvier 1994, jour de l’entrée en vigueur de l’Accord de libre-échange nord-américain (ALENA). Fondée en 1983 dans la forêt Lacandone par un petit groupe de militants de gauche venus des villes, qui rejoignirent des communautés mayas tzeltal, tzotzil, ch’ol et tojolabal, l’EZLN tirait son nom d’Emiliano Zapata et parlait au nom de peuples autochtones qui réclamaient la terre, le travail, la santé, l’éducation, la démocratie et la fin des discriminations, et qui voyaient dans l’ALENA et dans la réforme de 1992, qui mettait fin à la redistribution des terres, une menace pour leurs communautés. Plusieurs milliers d’insurgés, dont beaucoup de femmes, s’emparèrent de San Cristóbal de las Casas, d’Ocosingo, de Las Margaritas, d’Altamirano et d’autres villes et déclarèrent la guerre à l’armée fédérale et au gouvernement du président Carlos Salinas de Gortari. L’armée riposta avec des troupes, des avions et des blindés ; les combats les plus violents eurent lieu au marché d’Ocosingo. Le 12 janvier, alors que de grandes foules manifestaient pour la paix à Mexico, Salinas décréta un cessez-le-feu. Les chiffres officiels firent état d’environ 145 morts, parmi lesquels des soldats, des policiers, des insurgés et des civils ; d’autres estimations sont plus élevées. Le porte-parole de l’EZLN, le sous-commandant Marcos, devint célèbre dans le monde entier. Les négociations aboutirent en février 1996 aux accords de San Andrés sur les droits des peuples autochtones, que le gouvernement ne traduisit pas dans la loi, tandis qu’une offensive de l’armée en février 1995 et les violences paramilitaires, surtout le massacre d’Acteal en 1997, prolongeaient le conflit à plus basse intensité. L’EZLN a conservé ses armes mais n’a plus combattu l’armée depuis, et elle administre ses propres communautés autonomes au Chiapas.
