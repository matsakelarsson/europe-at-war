# French translations of the catalogue text (wave 9); step bodies follow later.
Zhang Yichao’s revolt: Révolte de Zhang Yichao
? The rising in which Zhang Yichao, a leading man of Shazhou (Dunhuang), drove the Tibetan garrisons out of the Hexi Corridor and returned it to nominal Tang rule. Tibet had held Dunhuang since about 781–786, but after the death of the emperor Langdarma in 842 its generals in the north-west fought each other. In 848 Zhang led the Han, Uyghur, Tuyuhun and Qiang people of Shazhou in a rising, the Tibetan garrison fled, and he took Guazhou and then, by about 850, Ganzhou, Suzhou and Yizhou (Hami). His brother carried maps of the recovered prefectures to Chang’an, and in 851 the emperor Xuanzong made Zhang military governor of a new Guiyi (“Return to Allegiance”) circuit based at Shazhou. Zhang took Liangzhou (Wuwei) with 7,000 men in 863, and in 866 his forces defeated the Tibetan general Lun Kongre near Xizhou; the Uyghurs of Qocho soon took Xizhou and the northern Tianshan for themselves. Zhang went to Chang’an in 867 and died there in 872. The Guiyi circuit, ruled by the Zhang and then the Cao families and in practice independent, held Dunhuang until the Tanguts took it in the 1030s.
: Le soulèvement au cours duquel Zhang Yichao, un notable de Shazhou (Dunhuang), chassa les garnisons tibétaines du corridor du Hexi et le rendit à la souveraineté nominale des Tang. Le Tibet tenait Dunhuang depuis 781–786 environ, mais après la mort de l’empereur Langdarma en 842, ses généraux du nord-ouest se combattirent entre eux. En 848, Zhang souleva les Han, les Ouïghours, les Tuyuhun et les Qiang de Shazhou ; la garnison tibétaine s’enfuit, et il prit Guazhou puis, vers 850, Ganzhou, Suzhou et Yizhou (Hami). Son frère porta à Chang’an les cartes des préfectures reconquises et, en 851, l’empereur Xuanzong nomma Zhang gouverneur militaire d’un nouveau circuit de Guiyi (« Retour à l’allégeance »), établi à Shazhou. Zhang prit Liangzhou (Wuwei) avec 7 000 hommes en 863 et, en 866, ses forces battirent le général tibétain Lun Kongre près de Xizhou ; les Ouïghours de Qocho s’emparèrent bientôt pour leur propre compte de Xizhou et du nord du Tian Shan. Zhang se rendit à Chang’an en 867 et y mourut en 872. Le circuit de Guiyi, gouverné par les Zhang puis par les Cao et indépendant dans les faits, tint Dunhuang jusqu’à sa prise par les Tangoutes dans les années 1030.
