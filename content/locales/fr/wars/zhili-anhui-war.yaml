# French translations of the catalogue text (wave 9); step bodies follow later.
Zhili–Anhui War: Guerre Zhili–Anhui
? A ten-day war in July 1920 for control of the Beijing government, fought in Zhili (today Hebei) between the Anhui clique of Duan Qirui and an alliance of the Zhili clique and Zhang Zuolin’s Fengtian clique. Duan had dominated the Beiyang government since 1916 through his army, the Anfu Club in parliament and large Japanese loans; the Zhili generals opposed his wish to conquer the south by force, and Zhang Zuolin was alarmed when Duan’s ally Xu Shuzheng took Outer Mongolia in 1919. On 12 July the Zhili and allied generals denounced Duan and the Anfu Club, and on 14 July the Anhui army, about 42,000 men, attacked on two fronts south and south-east of Beijing. Its western army under Duan Zhigui and Qu Tongfeng first pushed the Zhili troops back near Gaobeidian, but on 17 July Wu Peifu outflanked it, captured Qu Tongfeng and took Zhuozhou, and the eastern army under Xu Shuzheng, which had advanced along the railway to Yangcun, collapsed when the Fengtian troops attacked it the same day; Xu fled to Beijing. Duan resigned on 19 July, and on 23 July Zhili and Fengtian troops entered Beijing. The Anhui army lost about 35,000 men killed or scattered and 6,500 captured. Cao Kun, Wu Peifu and Zhang Zuolin shared the Beijing government until they fell out in 1922.
: Une guerre de dix jours, en juillet 1920, pour le contrôle du gouvernement de Pékin, livrée dans le Zhili (l’actuel Hebei) entre la clique de l’Anhui de Duan Qirui et une alliance formée par la clique du Zhili et la clique du Fengtian de Zhang Zuolin. Duan dominait le gouvernement de Beiyang depuis 1916 grâce à son armée, au club Anfu au parlement et à d’importants prêts japonais ; les généraux du Zhili s’opposaient à sa volonté de conquérir le Sud par la force, et Zhang Zuolin s’inquiéta lorsque l’allié de Duan, Xu Shuzheng, prit la Mongolie-Extérieure en 1919. Le 12 juillet, les généraux du Zhili et leurs alliés dénoncèrent Duan et le club Anfu et, le 14 juillet, l’armée de l’Anhui, environ 42 000 hommes, attaqua sur deux fronts au sud et au sud-est de Pékin. Son armée de l’ouest, commandée par Duan Zhigui et Qu Tongfeng, repoussa d’abord les troupes du Zhili près de Gaobeidian, mais le 17 juillet Wu Peifu la déborda, captura Qu Tongfeng et prit Zhuozhou, et l’armée de l’est de Xu Shuzheng, qui avait avancé le long de la voie ferrée jusqu’à Yangcun, s’effondra sous l’attaque des troupes du Fengtian le même jour ; Xu s’enfuit à Pékin. Duan démissionna le 19 juillet et, le 23 juillet, les troupes du Zhili et du Fengtian entrèrent à Pékin. L’armée de l’Anhui perdit environ 35 000 hommes tués ou dispersés et 6 500 prisonniers. Cao Kun, Wu Peifu et Zhang Zuolin se partagèrent le gouvernement de Pékin jusqu’à leur brouille en 1922.
