# French translations of the catalogue text (wave 9); step bodies follow later.
Zhu Yigui uprising: Soulèvement de Zhu Yigui
? A rising of Han settlers in southern Taiwan that briefly drove out the Qing authorities. Angered by the exactions of the Taiwan prefect Wang Zhen and his officials, settlers in the hills of Fengshan county chose as their leader Zhu Yigui, a duck farmer of Zhangzhou origin whose surname was that of the Ming emperors. They rose on 14 May 1721 at Gangshan, joined forces with a band under Du Junying, a settler from Guangdong whose followers were largely Hakka, defeated the garrison troops at Chishan on 22 May and took the prefectural city (Tainan) on 26 May, while officials fled to Penghu. Zhu proclaimed himself Zhongxing Wang (“king of the restoration”) with the reign name Yonghe, and within days the rebels held most of the settled plains. Their coalition soon split along lines of origin, between Zhu’s Hoklo followers and Du’s Hakka, and the Hakka villages of the Liudui settlements in the south formed a militia that defeated the rebels on the Xia Danshui river in early July. A Qing fleet from Fujian under Shi Shibiao and Lan Tingzhen forced the Luermen channel on 10 July, took Anping on 12 July and retook the prefectural city on 17 July; the expedition grew to some 18,000 men. Zhu was handed over by village militia leaders on 28 July and executed by slicing in Beijing, and Du Junying later surrendered. The rising led the Qing to strengthen their garrison and administration in Taiwan, and Lan Tingzhen’s kinsman and adviser Lan Dingyuan wrote influential essays urging fuller settlement of the island.
: Un soulèvement de colons han dans le sud de Taïwan qui chassa brièvement les autorités Qing. Exaspérés par les exactions du préfet de Taïwan Wang Zhen et de ses fonctionnaires, des colons des collines du district de Fengshan choisirent pour chef Zhu Yigui, un éleveur de canards originaire de Zhangzhou dont le nom de famille était celui des empereurs Ming. Ils se soulevèrent le 14 mai 1721 à Gangshan, unirent leurs forces à celles d’une bande menée par Du Junying, un colon du Guangdong dont les partisans étaient en majorité hakka, battirent les troupes de la garnison à Chishan le 22 mai et prirent la ville préfectorale (Tainan) le 26 mai, tandis que les fonctionnaires s’enfuyaient aux Penghu. Zhu se proclama Zhongxing Wang (« roi de la restauration ») avec le nom de règne Yonghe et, en quelques jours, les rebelles tinrent la plus grande partie des plaines colonisées. Leur coalition se divisa bientôt selon les origines, entre les partisans hoklo de Zhu et les Hakka de Du, et les villages hakka des établissements de Liudui, dans le sud, formèrent une milice qui battit les rebelles sur la rivière Xia Danshui début juillet. Une flotte Qing venue du Fujian sous les ordres de Shi Shibiao et de Lan Tingzhen força le chenal de Luermen le 10 juillet, prit Anping le 12 juillet et reprit la ville préfectorale le 17 juillet ; l’expédition finit par compter quelque 18 000 hommes. Zhu fut livré par des chefs de milices villageoises le 28 juillet et exécuté à Pékin par le supplice du découpage, et Du Junying se rendit plus tard. Le soulèvement conduisit les Qing à renforcer leur garnison et leur administration à Taïwan, et Lan Dingyuan, parent et conseiller de Lan Tingzhen, écrivit des essais influents plaidant pour une colonisation plus complète de l’île.
