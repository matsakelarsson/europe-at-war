# French translations of the catalogue text (wave 12); step bodies follow later.
Zirid–Hammadid War: Guerre entre Zirides et Hammadides
? "The war that split the Zirid realm, which ruled Ifriqiya and the central Maghreb for the Fatimid caliphs of Cairo, into two Sanhaja Berber states. Hammad ibn Buluggin, uncle of the Zirid emir Badis and governor of the west from his new fortress capital, the Qal’a in the Hodna mountains, refused in about 1014 to give up Constantine and other towns to Badis’s heir; he had the Abbasid caliph named in the Friday sermon instead of the Fatimid and killed Shi’is in his lands. In 1015 he took and sacked Béja. Badis seized Ashir, beat Hammad on the Chelif river in the autumn and besieged him in the Qal’a from November, but died in his camp in May 1016, and the Zirid army went home. Hammad recovered his lands and beat a Zirid force near Ashir. The young emir al-Mu’izz ibn Badis defeated him in August 1017 while Hammad was besieging Baghaya, and by a treaty of 5 January 1018, sealed by a marriage, recognised him as independent ruler of M’Sila, Tobna, the Zab, Ashir, Tahert and whatever else he could conquer in the central Maghreb. The two branches stayed rivals for more than a century: they recognised opposite caliphs, backed rival Arab tribes after the Hilalian invasion, fought at Sbiba in 1065, and the Hammadids attacked Mahdia in 1135. The Normans ended Zirid rule in 1148 and the Almohads the Hammadids in 1152."
: "La guerre qui scinda en deux États berbères sanhadja le royaume ziride, lequel gouvernait l’Ifriqiya et le Maghreb central pour le compte des califes fatimides du Caire. Hammad ibn Buluggin, oncle de l’émir ziride Badis et gouverneur de l’ouest depuis sa nouvelle capitale fortifiée, la Qal’a, dans les monts du Hodna, refusa vers 1014 de céder Constantine et d’autres villes à l’héritier de Badis ; il fit nommer le calife abbasside dans le sermon du vendredi à la place du calife fatimide et tua des chiites sur ses terres. En 1015, il prit et pilla Béja. Badis s’empara d’Achir, battit Hammad sur le Chélif à l’automne et l’assiégea dans la Qal’a à partir de novembre, mais il mourut dans son camp en mai 1016, et l’armée ziride rentra chez elle. Hammad recouvra ses terres et battit une force ziride près d’Achir. Le jeune émir al-Mu’izz ibn Badis le vainquit en août 1017 alors que Hammad assiégeait Baghaya et, par un traité du 5 janvier 1018 scellé par un mariage, le reconnut comme souverain indépendant de M’Sila, de Tobna, du Zab, d’Achir, de Tahert et de tout ce qu’il pourrait conquérir d’autre dans le Maghreb central. Les deux branches restèrent rivales pendant plus d’un siècle : elles reconnurent des califes opposés, soutinrent des tribus arabes rivales après l’invasion hilalienne, s’affrontèrent à Sbiba en 1065, et les Hammadides attaquèrent Mahdia en 1135. Les Normands mirent fin au pouvoir ziride en 1148, et les Almohades à celui des Hammadides en 1152."
