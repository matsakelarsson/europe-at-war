# French translations of the catalogue text (wave 7); step bodies follow later.
Ziyarid–Buyid wars: Guerres entre Ziyarides et Bouyides
The intermittent wars between the Ziyarids, a dynasty from Gilan founded by Mardavij in 931, and the Buyids, his former officers, over the Jibal, Tabaristan and Gorgan. After Mardavij’s murder in 935 the Buyid Hasan (Rukn al-Dawla) fought his brother and successor Vushmgir, taking Isfahan for good in 940 and Rayy in 943. Vushmgir held on to Gorgan and Tabaristan with the help of the Samanids, and the provinces changed hands repeatedly until a Samanid–Buyid treaty in 955; fighting broke out again before Vushmgir was killed by a boar while hunting in 967. In 980 his son Qabus sheltered the Buyid prince Fakhr al-Dawla and refused to give him up, and the Buyids conquered Gorgan and Tabaristan. Qabus spent eighteen years in exile in Samanid Khorasan. After Fakhr al-Dawla’s death in 997 he regained Gorgan in 998 and ruled until 1012, when his own officers deposed him; he died in captivity.: Les guerres intermittentes entre les Ziyarides, dynastie originaire du Gilan fondée par Mardavij en 931, et les Bouyides, ses anciens officiers, pour le Djibal, le Tabaristan et le Gorgan. Après l’assassinat de Mardavij en 935, le Bouyide Hasan (Rukn al-Dawla) combattit son frère et successeur Vushmgir, et prit définitivement Ispahan en 940 et Rayy en 943. Vushmgir se maintint au Gorgan et au Tabaristan avec l’aide des Samanides, et les provinces changèrent plusieurs fois de mains jusqu’à un traité entre Samanides et Bouyides en 955 ; les combats reprirent avant que Vushmgir ne soit tué par un sanglier à la chasse en 967. En 980, son fils Qabus donna asile au prince bouyide Fakhr al-Dawla et refusa de le livrer, et les Bouyides conquirent le Gorgan et le Tabaristan. Qabus passa dix-huit ans en exil dans le Khorassan samanide. Après la mort de Fakhr al-Dawla en 997, il reprit le Gorgan en 998 et régna jusqu’en 1012, quand ses propres officiers le déposèrent ; il mourut en captivité.
