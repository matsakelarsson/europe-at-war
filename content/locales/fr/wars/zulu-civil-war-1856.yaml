# French translations of the catalogue text (wave 13); step bodies follow later.
Zulu civil war of 1856: Guerre civile zouloue de 1856
? "The succession war between two sons of King Mpande, decided at the battle of Ndondakusuka on the lower Tugela. Mpande, who had ruled the Zulu kingdom since 1840, named no heir, and in the 1850s his sons Cetshwayo, the eldest, and Mbuyazi, whom the king was thought to favour, built up rival followings: Cetshwayo’s party called itself the uSuthu, Mbuyazi’s the iziGqoza. In 1856 Mpande gave Mbuyazi land near the Tugela, and Mbuyazi moved south with his followers, their families and cattle, hoping for support from the Colony of Natal across the river. Cetshwayo followed with a larger army. On 2 December 1856, with the Tugela in flood behind them, the iziGqoza, about 7,000 fighting men, with the hunter John Dunn and a small party of Natal border police and African hunters on their side, were attacked by some 15,000 to 20,000 uSuthu near Ndondakusuka hill. Mbuyazi’s army broke, and his people were driven into the river: Mbuyazi and five of his brothers were killed, and the uSuthu killed many of the women and children who had come with the iziGqoza. Estimates of the dead, combatants and others, run to about 20,000, though no count was made; the place where the bodies washed up was afterwards called Mathambo, “the bones”. Cetshwayo was from then on the effective heir and, as Mpande aged, the real power in the kingdom; Mpande died in 1872 and Cetshwayo was installed in 1873. Dunn made his peace with him and became his adviser and a Zulu chief."
: "La guerre de succession entre deux fils du roi Mpande, tranchée à la bataille de Ndondakusuka, sur le cours inférieur de la Tugela. Mpande, qui régnait sur le royaume zoulou depuis 1840, n’avait désigné aucun héritier et, dans les années 1850, ses fils Cetshwayo, l’aîné, et Mbuyazi, que le roi passait pour favoriser, se constituèrent des partis rivaux : celui de Cetshwayo se nommait les uSuthu, celui de Mbuyazi les iziGqoza. En 1856, Mpande donna à Mbuyazi des terres près de la Tugela, et Mbuyazi partit vers le sud avec ses partisans, leurs familles et leur bétail, dans l’espoir d’obtenir le soutien de la colonie du Natal, de l’autre côté du fleuve. Cetshwayo le suivit avec une armée plus nombreuse. Le 2 décembre 1856, la Tugela en crue dans leur dos, les iziGqoza, environ 7 000 combattants, épaulés par le chasseur John Dunn et un petit groupe de policiers de la frontière du Natal et de chasseurs africains, furent attaqués par quelque 15 000 à 20 000 uSuthu près de la colline de Ndondakusuka. L’armée de Mbuyazi se débanda et les siens furent repoussés dans le fleuve : Mbuyazi et cinq de ses frères furent tués, et les uSuthu tuèrent nombre des femmes et des enfants qui avaient accompagné les iziGqoza. Les estimations du nombre de morts, combattants et autres, atteignent environ 20 000, bien qu’aucun décompte n’ait été fait ; le lieu où les corps s’échouèrent fut ensuite appelé Mathambo, « les os ». Cetshwayo fut dès lors l’héritier de fait et, à mesure que Mpande vieillissait, le véritable maître du royaume ; Mpande mourut en 1872 et Cetshwayo fut intronisé en 1873. Dunn fit la paix avec lui et devint son conseiller ainsi qu’un chef zoulou."
