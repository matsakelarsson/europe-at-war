# French translations of the catalogue text (wave 13); step bodies follow later.
Zulu wars of expansion and the Mfecane: Guerres d’expansion zouloues et Mfecane
? "The wars in which the Zulu kingdom was built under Shaka, and the wider upheaval among the peoples of south-eastern Africa known as the Mfecane (in Sotho the Difaqane or Lifaqane). Around 1800 larger states were forming between the Phongolo and Thukela rivers, led by the Mthethwa of Dingiswayo and the Ndwandwe of Zwide. Shaka, who became chief of the small Zulu chiefdom in 1816 with Dingiswayo’s help, took over the leadership of the Mthethwa alliance after Zwide killed Dingiswayo, defeated the Ndwandwe in 1818–1820 and made the Zulu kingdom the strongest power in the region, until his assassination in September 1828. The Ndwandwe dispersed: Soshangane founded the Gaza kingdom in southern Mozambique and Zwangendaba led the Ngoni north across the Zambezi. Mzilikazi broke away from Shaka and took his Ndebele onto the highveld; the Hlubi, the amaNgwane of Matiwane and the Tlokwa of MaNthatisi fought and raided across the Caledon valley; Moshoeshoe gathered the survivors into the Basotho kingdom at Thaba Bosiu; and Sebetwane led the Kololo to the upper Zambezi. Many communities were destroyed or uprooted, and the new kingdoms remade the map of the region. Historians disagree about the causes and scale of the upheaval: older accounts blamed Shaka for one or two million deaths, while since the 1980s historians have pointed to drought, competition for land and the ivory and cattle trade at Delagoa Bay, slave and cattle raiding by Griqua and colonial groups, and the self-serving exaggerations of colonial writers."
: "Les guerres par lesquelles le royaume zoulou se constitua sous Shaka, et le bouleversement plus large qui toucha les peuples du sud-est de l’Afrique, connu sous le nom de Mfecane (en sotho, Difaqane ou Lifaqane). Vers 1800, des États plus vastes se formaient entre les rivières Phongolo et Thukela, dominés par les Mthethwa de Dingiswayo et les Ndwandwe de Zwide. Shaka, devenu chef de la petite chefferie zouloue en 1816 avec l’aide de Dingiswayo, prit la tête de l’alliance mthethwa après que Zwide eut tué Dingiswayo, vainquit les Ndwandwe en 1818–1820 et fit du royaume zoulou la première puissance de la région, jusqu’à son assassinat en septembre 1828. Les Ndwandwe se dispersèrent : Soshangane fonda le royaume de Gaza dans le sud du Mozambique et Zwangendaba mena les Ngoni vers le nord, au-delà du Zambèze. Mzilikazi rompit avec Shaka et emmena ses Ndébélés sur le Highveld ; les Hlubi, les amaNgwane de Matiwane et les Tlokwa de MaNthatisi combattirent et razzièrent dans toute la vallée du Caledon ; Moshoeshoe rassembla les survivants dans le royaume basotho, à Thaba Bosiu ; et Sebetwane conduisit les Kololo jusqu’au haut Zambèze. De nombreuses communautés furent détruites ou déracinées, et les nouveaux royaumes redessinèrent la carte de la région. Les historiens divergent sur les causes et l’ampleur de ce bouleversement : les récits anciens imputaient à Shaka un ou deux millions de morts, tandis que, depuis les années 1980, des historiens mettent en avant la sécheresse, la concurrence pour la terre et le commerce de l’ivoire et du bétail à la baie de Delagoa, les razzias d’esclaves et de bétail menées par des Griqua et des groupes coloniaux, ainsi que les exagérations intéressées des auteurs coloniaux."
