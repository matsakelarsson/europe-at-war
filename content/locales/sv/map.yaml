borderSources:
  Peace of Westphalia. Brandenburg gains Minden, Halberstadt, Farther Pomerania and the reversion of Magdeburg; Sweden gains Western Pomerania and Bremen-Verden; the Lower Palatinate is restored to Charles Louis.: Westfaliska freden. Brandenburg får Minden, Halberstadt och Hinterpommern samt rätt att senare överta Magdeburg. Sverige får Vorpommern och Bremen-Verden. Nedre Pfalz återgår till Karl Ludvig.
  historical-basemaps world_800 (automatic draft, partly hand-corrected): historical-basemaps world_800 (automatiskt utkast, delvis handkorrigerat)
  About 800. Byzantium holds Anatolia west of the Taurus and Anti-Taurus. The Abbasid caliphate holds Cilicia and the fortified frontier zone (the thughur) from Tarsus to Melitene, Upper Mesopotamia, and Armenia, ruled by Armenian princes as an Arab province.: Omkring 800. Bysans behärskar Anatolien väster om Taurus och Antitaurus. Abbasidiska kalifatet behärskar Kilikien och den befästa gränszonen (thughur) från Tarsos till Melitene, övre Mesopotamien samt Armenien, som styrs av armeniska furstar som en arabisk provins.
  About 800. Byzantium holds Greece, Thrace and the coasts, with loose claims over the Slavs of Macedonia and the interior. Bulgaria rules the lower Danube on both banks. Charlemagne’s Franks have broken the Avar Khaganate (791–796) and hold Pannonia, Carantania and Istria; the Croats of Dalmatia and the Serbs of Raška are ruled by their own princes.: Omkring 800. Bysans behärskar Grekland, Thrakien och kusterna, med lösa anspråk på slaverna i Makedonien och inlandet. Bulgarien härskar över nedre Donau på båda sidor om floden. Karl den stores franker har krossat Avariska khaganatet (791–796) och behärskar Pannonien, Karantanien och Istrien; kroaterna i Dalmatien och serberna i Raška styrs av egna furstar.
  About 800. Mercia under Coenwulf dominates southern England, including Kent, Sussex, Surrey, London and East Anglia; Essex keeps its own kings under Mercian overlordship. Wessex holds the south-west as far as the Tamar, Northumbria stretches from the Humber to the Forth and Galloway, the Picts hold the north and east of Scotland, Dál Riata holds Argyll, and the Britons hold Strathclyde, Wales and Cornwall. Ireland is divided among many Gaelic kingdoms.: Omkring 800. Mercia under Coenwulf dominerar södra England, inklusive Kent, Sussex, Surrey, London och East Anglia; Essex behåller sina egna kungar under merciskt överherradöme. Wessex behärskar sydväst ända till Tamar, Northumbria sträcker sig från Humber till Forth och Galloway, pikterna behärskar Skottlands norra och östra delar, Dál Riata behärskar Argyll, och britterna behärskar Strathclyde, Wales och Cornwall. Irland är uppdelat mellan många gaeliska kungariken.
  About 800. The Emirate of Córdoba rules most of the peninsula. The Kingdom of Asturias holds the north coast from Galicia to the Basque lands and the upper Ebro; the Frankish March of Spain holds Girona, Urgell and Aragon; the Balearics are still nominally Byzantine; the Duero valley is a thinly settled frontier.: Omkring 800. Emiratet Córdoba härskar över större delen av halvön. Kungariket Asturien behärskar nordkusten från Galicien till de baskiska områdena och övre Ebro; den frankiska spanska marken omfattar Girona, Urgell och Aragonien; Balearerna är fortfarande formellt bysantinska; Duerodalen är ett glest befolkat gränsland.
  About 800. Charlemagne, crowned emperor in Rome this Christmas, rules the Lombard kingdom of Italy with the Duchy of Spoleto. The pope holds Rome, the old Exarchate of Ravenna and the Pentapolis; the Lombard Duchy of Benevento holds the south; Byzantium keeps Sicily, Sardinia, Calabria, Otranto and Gaeta, and Naples and Venice are Byzantine duchies that go their own way.: Omkring 800. Karl den store, som denna jul kröns till kejsare i Rom, härskar över det langobardiska kungariket Italien med hertigdömet Spoleto. Påven behärskar Rom, det gamla exarkatet Ravenna och Pentapolis; det langobardiska hertigdömet Benevento behärskar södra Italien; Bysans behåller Sicilien, Sardinien, Kalabrien, Otranto och Gaeta, och Neapel och Venedig är bysantinska hertigdömen som går sin egen väg.
  About 800. Syria, Palestine and Egypt are provinces of the Abbasid caliphate, ruled from Baghdad.: Omkring 800. Syrien, Palestina och Egypten är provinser i Abbasidiska kalifatet och styrs från Bagdad.
  Louis the Pious takes Barcelona after a long siege; it becomes the seat of a Frankish county.: Ludvig den fromme intar Barcelona efter en lång belägring; staden blir säte för ett frankiskt grevskap.
  About 805. Khan Krum of Bulgaria destroys what is left of the Avar Khaganate east of the Danube; the Great Hungarian Plain, the Banat and Transylvania come under loose Bulgarian rule.: Omkring 805. Khan Krum av Bulgarien förstör det som återstår av Avariska khaganatet öster om Donau; Stora ungerska slätten, Banatet och Transsylvanien kommer under löst bulgariskt styre.
  Pamplona and the western Pyrenees accept Frankish overlordship.: Pamplona och västra Pyrenéerna erkänner frankiskt överherradöme.
  Krum takes Serdica (Sofia) in the spring of 809 and opens the way into the upper Struma valley.: Krum intar Serdica (Sofia) våren 809 och öppnar vägen in i övre Strumadalen.
  Thirty years’ peace between Khan Omurtag and Emperor Leo V. The border follows the Erkesia earthwork from Develtos on the Gulf of Burgas to the Maritsa; northern Thrace with Stara Zagora, Sliven and Yambol is Bulgarian.: Trettioårig fred mellan khan Omurtag och kejsar Leo V. Gränsen följer jordvallen Erkesia från Develtos vid Burgasbukten till Maritsa; norra Thrakien med Stara Zagora, Sliven och Jambol är bulgariskt.
  Second battle of Roncevaux. The Basques of Pamplona, allied with the Banu Qasi, defeat a Frankish army; Íñigo Arista rules Pamplona as an independent king, and the county of Aragon falls into its orbit.: Andra slaget vid Roncevaux. Baskerna i Pamplona, allierade med Banu Qasi, besegrar en frankisk armé; Íñigo Arista härskar över Pamplona som självständig kung, och grevskapet Aragonien dras in i dess intressesfär.
  Battle of Ellendun. Egbert of Wessex defeats Mercia and takes Kent, Sussex, Surrey and Essex.: Slaget vid Ellendun. Egbert av Wessex besegrar Mercia och tar Kent, Sussex, Surrey och Essex.
  After Mercia's defeat at Ellendun, East Anglia throws off Mercian rule.: Efter Mercias nederlag vid Ellendun skakar East Anglia av sig det merciska styret.
  Omurtag’s Bulgarians drive the Franks from Syrmia and the land along the lower Drava; the war lasts until 829.: Omurtags bulgarer driver frankerna ut ur Syrmien och landet längs nedre Drava; kriget varar till 829.
  Arab and Berber forces from Ifriqiya land at Mazara at the invitation of the rebel Euphemius; the conquest of Sicily begins.: Arabiska och berbiska styrkor från Ifriqiya landstiger vid Mazara på inbjudan av upprorsmannen Eufemios; erövringen av Sicilien inleds.
  About 827–828. Andalusi exiles led by Abu Hafs land on Crete and found an emirate with its capital at Chandax (Heraklion). Some historians date the landing to 824.: Omkring 827–828. Landsflyktiga andalusier under Abu Hafs landstiger på Kreta och grundar ett emirat med huvudstad i Chandax (Heraklion). Vissa historiker daterar landstigningen till 824.
  Palermo falls to the Arabs after a year-long siege and becomes the capital of Muslim Sicily.: Palermo faller till araberna efter en ettårig belägring och blir huvudstad i det muslimska Sicilien.
  Mojmír I of Moravia drives Prince Pribina from Nitra and unites the two principalities into Great Moravia.: Mojmír I av Mähren driver fursten Pribina från Nitra och förenar de två furstendömena till Stormähren.
  About 836. Philippopolis (Plovdiv) and the upper Maritsa valley pass to Bulgaria under Khan Malamir or his successor Presian.: Omkring 836. Filippopolis (Plovdiv) och övre Maritsadalen övergår till Bulgarien under khan Malamir eller hans efterträdare Presian.
  Battle of Hingston Down. Egbert defeats the Cornish and their Viking allies; Cornwall comes under West Saxon rule.: Slaget vid Hingston Down. Egbert besegrar kornländarna och deras vikingaallierade; Cornwall kommer under västsaxiskt styre.
  Arab forces hold Agrigento and the centre of the island, and seize Taranto on the mainland.: Arabiska styrkor behärskar Agrigento och öns centrala delar och erövrar Taranto på fastlandet.
  Kenneth MacAlpin, king of Dál Riata, becomes king of the Picts as well; the two kingdoms grow together into Alba (the traditional date).: Kenneth MacAlpin, kung av Dál Riata, blir även pikternas kung; de två kungarikena växer samman till Alba (det traditionella årtalet).
  Messina falls to the Arabs.: Messina faller till araberna.
  Treaty of Verdun. Louis the German receives the eastern Frankish lands, with Pannonia, Carantania and Carniola; Istria and Friuli stay with Lothair’s Italy.: Fördraget i Verdun. Ludvig den tyske får de östfrankiska länderna med Pannonien, Karantanien och Krain; Istrien och Friuli stannar hos Lothars Italien.
  "Treaty of Verdun. The sons of Louis the Pious divide the Frankish empire: Charles the Bald takes West Francia, Louis the German East Francia, and the emperor Lothair the middle kingdom from Frisia to Italy.": "Fördraget i Verdun. Ludvig den frommes söner delar det frankiska riket: Karl den skallige får Västfrankiska riket, Ludvig den tyske Östfrankiska riket och kejsar Lothar mellanriket från Frisland till Italien."
  Treaty of Verdun. The Catalan counties pass to West Francia.: Fördraget i Verdun. De katalanska grevskapen tillfaller Västfrankiska riket.
  Berkshire has passed from Mercia to Wessex by the 840s.: Berkshire har övergått från Mercia till Wessex på 840-talet.
  Arab mercenaries seize Bari, which becomes the seat of an emirate.: Arabiska legosoldater erövrar Bari, som blir säte för ett emirat.
  The Arabs take Ragusa and the south-east.: Araberna intar Ragusa och sydöstra delen av ön.
  The Divisio Ducatus Beneventani. Emperor Louis II divides the Lombard south into the Principalities of Benevento and Salerno.: Divisio Ducatus Beneventani. Kejsar Ludvig II delar det langobardiska Syditalien i furstendömena Benevento och Salerno.
  About 850. Under Presian and Boris I the Bulgarians extend their rule over the Morava valley, Kosovo, Macedonia and the Rhodopes; the dates of these conquests, between the 830s and the 860s, are uncertain.: Omkring 850. Under Presian och Boris I utsträcker bulgarerna sitt välde över Moravadalen, Kosovo, Makedonien och Rhodopebergen; tidpunkterna för dessa erövringar, mellan 830-talet och 860-talet, är osäkra.
  Norse settlers have taken over the Hebrides (about 850).: Nordiska nybyggare har tagit över Hebriderna (omkring 850).
  Battle of Jengland and Treaty of Angers. Charles the Bald recognises Erispoe as king of the Bretons, with Rennes, Nantes and the Pays de Retz.: Slaget vid Jengland och fördraget i Angers. Karl den skallige erkänner Erispoe som bretonernas kung, med Rennes, Nantes och Pays de Retz.
  Amlaíb (Olaf) becomes king of the Norse at Dublin; the Viking kingdom of Dublin is founded.: Amlaíb (Olav) blir kung över nordborna i Dublin; vikingariket Dublin grundas.
  Ordoño I of Asturias resettles León and Astorga.: Ordoño I av Asturien återbefolkar León och Astorga.
  Enna (Castrogiovanni), the central fortress of Byzantine Sicily, falls.: Enna (Castrogiovanni), det bysantinska Siciliens centrala fästning, faller.
  Treaty of Compiègne. Charles the Bald grants the Cotentin, with the Channel Islands, to Salomon of Brittany.: Fördraget i Compiègne. Karl den skallige överlåter Cotentin med Kanalöarna till Salomon av Bretagne.
  Docibilis I rules Gaeta as an independent duke.: Docibilis I styr Gaeta som självständig hertig.
  Vímara Peres takes Porto for Alfonso III; the County of Portugal is founded between the Minho and the Douro.: Vímara Peres intar Porto för Alfons III; grevskapet Portugal grundas mellan Minho och Douro.
  Ahmad ibn Tulun arrives in Egypt as governor and soon rules it as his own.: Ahmad ibn Tulun kommer till Egypten som guvernör och styr snart landet som sitt eget.
  The Great Heathen Army defeats and kills King Edmund; East Anglia comes under Danish rule.: Den stora hedniska hären besegrar och dödar kung Edmund; East Anglia kommer under danskt styre.
  The Aghlabids take Malta.: Aghlabiderna intar Malta.
  Emperor Louis II takes Bari from the Arabs.: Kejsar Ludvig II tar Bari från araberna.
  Orkney and Shetland become a Norse earldom under the Norwegian crown (traditionally dated to Harald Fairhair).: Orkney och Shetland blir ett nordiskt jarldöme under den norska kronan (traditionellt daterat till Harald Hårfagre).
  Halfdan shares out the land of southern Northumbria (Deira) among his men; York becomes a Viking kingdom.: Halfdan fördelar landet i södra Northumbria (Deira) bland sina män; York blir ett vikingarike.
  Byzantine troops take over Bari.: Bysantinska trupper tar över Bari.
  The Danes partition Mercia and settle its eastern half, later the Five Boroughs. Western Mercia stays English under Ceolwulf II and then Ealdorman Æthelred, who accepts Alfred’s lordship.: Danerna delar Mercia och bosätter sig i dess östra hälft, de senare fem borgarna. Västra Mercia förblir engelskt under Ceolwulf II och sedan ealdorman Æthelred, som erkänner Alfreds överhöghet.
  Ahmad ibn Tulun of Egypt takes Syria and the Cilician frontier.: Ahmad ibn Tulun av Egypten tar Syrien och den kilikiska gränsen.
  Alfonso III’s counts take Coimbra, Viseu and Lamego and settle Trás-os-Montes.: Alfons III:s grevar intar Coimbra, Viseu och Lamego och koloniserar Trás-os-Montes.
  Ahmad ibn Tulun takes Syria.: Ahmad ibn Tulun tar Syrien.
  Syracuse falls after a nine-month siege; only Taormina, Catania and a few strongholds in the north-east remain Byzantine.: Syrakusa faller efter en niomånaders belägring; endast Taormina, Catania och några fästen i nordost förblir bysantinska.
  At Mantaille the bishops and nobles of Provence and Lower Burgundy elect Boso king, the first non-Carolingian king in the West.: I Mantaille väljer Provences och Nedre Burgunds biskopar och stormän Boso till kung, den förste icke-karolingiske kungen i väst.
  Boso is elected king of Provence; the coast around Monaco belongs to his kingdom.: Boso väljs till kung av Provence; kusten kring Monaco hör till hans kungarike.
  After Edington and the Peace of Wedmore, Guthrum’s army settles East Anglia; Essex and the south-east Midlands fall within the Danelaw, as the Treaty of Alfred and Guthrum later sets out.: Efter Edington och freden i Wedmore bosätter sig Guthrums här i East Anglia; Essex och sydöstra Midlands hamnar inom Danelagen, så som fördraget mellan Alfred och Guthrum senare fastställer.
  Treaty of Ribemont. West Francia gives up its half of Lotharingia; all of Lotharingia belongs to East Francia.: Fördraget i Ribemont. Västfrankiska riket avstår sin halva av Lotharingien; hela Lotharingien tillhör Östfrankiska riket.
  The Byzantines retake Taranto.: Bysantinerna återtar Taranto.
  Count Diego Rodríguez Porcelos founds Burgos for Alfonso III of Asturias.: Greve Diego Rodríguez Porcelos grundar Burgos åt Alfons III av Asturien.
  Ashot I Bagratuni is recognised as king of Armenia by the caliph and by Byzantium; the Artsruni of Vaspurakan become kings in 908.: Ashot I Bagratuni erkänns som kung av Armenien av kalifen och av Bysans; artsruniderna i Vaspurakan blir kungar 908.
  Nikephoros Phokas the Elder reconquers northern Calabria and much of Apulia and Lucania for Byzantium.: Nikeforos Fokas den äldre återerövrar norra Kalabrien och stora delar av Apulien och Lukanien åt Bysans.
  Adarnase IV of Tao-Klarjeti takes the title king of the Iberians.: Adarnase IV av Tao-Klardzjeti antar titeln iberernas kung.
  After Charles the Fat is deposed, Rudolph I is crowned king of Upper Burgundy at Saint-Maurice.: Sedan Karl den tjocke avsatts kröns Rudolf I till kung av Övre Burgund i Saint-Maurice.
  Emperor Charles the Fat dies and the Carolingian empire breaks up; Friuli and Istria belong to the Kingdom of Italy.: Kejsar Karl den tjocke dör och det karolingiska riket bryts upp; Friuli och Istrien hör till kungariket Italien.
  Emperor Charles the Fat dies and the Carolingian empire breaks apart. Berengar of Friuli is crowned king of Italy; Rudolph of Upper Burgundy takes the Aosta valley.: Kejsar Karl den tjocke dör och det karolingiska riket faller sönder. Berengar av Friuli kröns till kung av Italien; Rudolf av Övre Burgund tar Aostadalen.
  Alfonso III resettles Zamora on the Duero.: Alfons III återbefolkar Zamora vid Duero.
  The Magyars, driven from the steppe north of the Black Sea by the Pechenegs, cross the Carpathians and occupy the Great Hungarian Plain and the upper Tisza. The Pechenegs take the steppe north of the lower Danube.: Magyarerna, som drivits från stäppen norr om Svarta havet av petjenegerna, korsar Karpaterna och besätter Stora ungerska slätten och övre Tisza. Petjenegerna tar stäppen norr om nedre Donau.
  historical-basemaps world_900 (automatic draft, partly hand-corrected): historical-basemaps world_900 (automatiskt utkast, delvis handkorrigerat)
  After the death of Emperor Arnulf (899) the Magyars take Pannonia west of the Danube from East Francia. Transylvania is settled in the same years.: Efter kejsar Arnulfs död (899) tar magyarerna Pannonien väster om Donau från Östfrankiska riket. Transsylvanien koloniseras under samma år.
  By about 900 the kingdom of Strathclyde has expanded south over Cumbria and Galloway, the western lands of the old Northumbria.: Omkring 900 har kungariket Strathclyde expanderat söderut över Cumbria och Galloway, det gamla Northumbrias västra landområden.
  Atenulf I of Capua takes Benevento and unites the two principalities.: Atenulf I av Capua intar Benevento och förenar de två furstendömena.
  Sardinia, cut off from Byzantium, is ruled by its own judges in four judicates.: Sardinien, avskuret från Bysans, styrs av sina egna domare i fyra judikat.
  The Irish expel the Norse from Dublin. Many of them settle the coast of north-west England between the Ribble and the Mersey, which falls under the Viking kingdom of York.: Irländarna fördriver nordborna från Dublin. Många av dem bosätter sig längs kusten i nordvästra England mellan Ribble och Mersey, som hamnar under vikingariket York.
  Isam al-Khawlani conquers the Balearic Islands for the Emirate of Córdoba.: Isam al-Khawlani erövrar Balearerna åt emiratet Córdoba.
  Ibrahim II takes Taormina; the last Byzantine strongholds in eastern Sicily fall.: Ibrahim II intar Taormina; de sista bysantinska fästena på östra Sicilien faller.
  A peace after Simeon’s wars with Byzantium sets the border about 20 km north of Thessaloniki; Bulgaria holds most of Albania and northern Epirus, while Dyrrhachium stays Byzantine.: En fred efter Simeons krig mot Bysans drar gränsen omkring 20 km norr om Thessaloniki; Bulgarien behärskar större delen av Albanien och norra Epirus, medan Dyrrachion förblir bysantinskt.
  The Abbasids end Tulunid rule and recover Syria and Cilicia.: Abbasiderna gör slut på tulunidernas styre och återtar Syrien och Kilikien.
  An Abbasid army enters Fustat and ends Tulunid rule in Egypt and Syria.: En abbasidisk armé tågar in i Fustat och gör slut på tulunidernas styre i Egypten och Syrien.
  Battle of Pressburg. A Bavarian army is destroyed by the Magyars, who now control the former Moravian lands in the Danube basin. Their hold on the hills of today’s northern Slovakia stays loose for another century.: Slaget vid Pressburg. En bayersk armé förintas av magyarerna, som nu kontrollerar de forna mähriska länderna i Donaubäckenet. Deras grepp om höglandet i dagens norra Slovakien förblir löst under ytterligare ett sekel.
  The Bavarian army is destroyed by the Magyars at Pressburg. Great Moravia has collapsed; the Magyars hold the Carpathian Basin, Moravia and the land east of the Enns, and the Přemyslid dukes rule Bohemia.: Den bayerska armén förintas av magyarerna vid Pressburg. Stormähren har kollapsat; magyarerna behärskar Karpatiska bäckenet, Mähren och landet öster om Enns, och de přemyslidiska hertigarna styr Böhmen.
  The counts of Castile and León reach the Duero, resettling Roa, Osma, San Esteban de Gormaz and Simancas.: Grevarna av Kastilien och León når Duero och återbefolkar Roa, Osma, San Esteban de Gormaz och Simancas.
  Edward the Elder conquers the southern Danelaw, including Essex and East Anglia. In Ireland, Sihtric Cáech retakes Dublin for the Norse.: Edvard den äldre erövrar södra Danelagen, inklusive Essex och East Anglia. På Irland återtar Sihtric Cáech Dublin åt nordborna.
  The Five Boroughs of the east Midlands submit to Edward and Æthelflæd.: De fem borgarna i östra Midlands underkastar sig Edvard och Æthelflæd.
  After Æthelflæd, Lady of the Mercians, dies in June, Edward removes her daughter Ælfwynn and takes Mercia under his own rule.: Sedan Æthelflæd, mercernas härskarinna, dött i juni avsätter Edvard hennes dotter Ælfwynn och tar Mercia under sitt eget styre.
  Ordoño II of León and Sancho Garcés I of Pamplona take Nájera and Viguera; La Rioja passes to Pamplona.: Ordoño II av León och Sancho Garcés I av Pamplona intar Nájera och Viguera; La Rioja övergår till Pamplona.
  Tsar Simeon’s army annexes Serbia after deposing its prince Zaharija.: Tsar Simeons armé annekterar Serbien efter att ha avsatt dess furste Zaharija.
  About 925. Tomislav unites Pannonian and Dalmatian Croatia; a papal letter of 925 calls him king.: Omkring 925. Tomislav förenar det pannoniska och det dalmatiska Kroatien; ett påvligt brev från 925 kallar honom kung.
  Abd al-Rahman III takes Melilla.: Abd al-Rahman III intar Melilla.
  Æthelstan takes York, and at Eamont the kings of the north submit to him. He becomes the first king of all the English.: Æthelstan intar York, och vid Eamont underkastar sig nordens kungar honom. Han blir den förste kungen över alla engelsmän.
  The Althing meets for the first time; the Icelandic Commonwealth.: Alltinget sammanträder för första gången; Isländska fristaten.
  Abd al-Rahman III takes Ceuta.: Abd al-Rahman III intar Ceuta.
  About 933. Časlav Klonimirović escapes from Bulgaria and restores the Serbian principality.: Omkring 933. Časlav Klonimirović flyr från Bulgarien och återupprättar det serbiska furstendömet.
  William Longsword of Normandy annexes the Cotentin and the Channel Islands.: Vilhelm Långsvärd av Normandie annekterar Cotentin och Kanalöarna.
  John Kourkouas takes Melitene (Malatya) after years of campaigning.: Johannes Kourkouas intar Melitene (Malatya) efter flera års fälttåg.
  Muhammad ibn Tughj al-Ikhshid takes over Egypt as governor and founds the Ikhshidid dynasty.: Muhammad ibn Tughj al-Ikhshid tar över Egypten som guvernör och grundar ikhshididdynastin.
  After Æthelstan’s death, Olaf Guthfrithson of Dublin is accepted as king at York.: Efter Æthelstans död erkänns Olaf Guthfrithson av Dublin som kung i York.
  Olaf Guthfrithson takes the Five Boroughs of the east Midlands.: Olaf Guthfrithson tar de fem borgarna i östra Midlands.
  After the victory at Simancas in 939, Count Fernán González resettles Sepúlveda south of the Duero.: Efter segern vid Simancas 939 återbefolkar greve Fernán González Sepúlveda söder om Duero.
  Ramiro II of León resettles Salamanca and Ledesma on the Tormes.: Ramiro II av León återbefolkar Salamanca och Ledesma vid Tormes.
  King Edmund recovers the Five Boroughs.: Kung Edmund återtar de fem borgarna.
  Edmund drives the Norse kings out of York.: Edmund driver ut de nordiska kungarna ur York.
  Sayf al-Dawla, the Hamdanid emir of Aleppo (from 944) and Mayyafariqin, rules northern Syria, the Jazira and the Diyarbakır region, and leads the war against Byzantium.: Sayf al-Dawla, hamdanidisk emir av Aleppo (från 944) och Mayyafariqin, härskar över norra Syrien, Jazira och Diyarbakırregionen och leder kriget mot Bysans.
  Sayf al-Dawla takes Aleppo (944); a treaty with the Ikhshidids leaves him northern Syria and them Damascus, Palestine and the coast.: Sayf al-Dawla intar Aleppo (944); ett fördrag med ikhshididerna lämnar norra Syrien åt honom och Damaskus, Palestina och kusten åt dem.
  The Northumbrians accept Eric Bloodaxe as king at York.: Northumbrierna erkänner Erik Blodyx som kung i York.
  Otto I founds the bishoprics of Brandenburg and Havelberg in the Slav lands between the Elbe and the Oder, conquered by Henry I and the margrave Gero.: Otto I grundar biskopsdömena Brandenburg och Havelberg i de slaviska länderna mellan Elbe och Oder, som erövrats av Henrik I och markgreven Gero.
  Byzantium takes Theodosiopolis (Erzurum) and the upper Euphrates valley.: Bysans intar Theodosiopolis (Erzurum) och övre Eufratdalen.
  Count Fernán González has made Castile, with Álava and Biscay, all but independent of León.: Greve Fernán González har gjort Kastilien, med Álava och Biscaya, nästan oberoende av León.
  Eric Bloodaxe is driven out of York, and the last Viking kingdom in England ends.: Erik Blodyx fördrivs från York, och det sista vikingariket i England upphör.
  John Tzimiskes takes Samosata.: Johannes Tzimiskes intar Samosata.
  Nikephoros Phokas takes Chandax after a winter siege; Crete is Byzantine again.: Nikeforos Fokas intar Chandax efter en vinterbelägring; Kreta är åter bysantinskt.
  Nikephoros Phokas takes Germanikeia (Marash) and sacks Aleppo.: Nikeforos Fokas intar Germanikeia (Marash) och plundrar Aleppo.
  Otto I is crowned emperor in Rome. Carantania, Carniola and the March of Istria belong to the empire.: Otto I kröns till kejsare i Rom. Karantanien, Krain och marken Istrien hör till riket.
  Otto I is crowned emperor in Rome; Lotharingia, part of his kingdom since 925, belongs to the Holy Roman Empire.: Otto I kröns till kejsare i Rom; Lotharingien, som varit en del av hans kungarike sedan 925, hör till tysk-romerska riket.
  Otto I is crowned emperor in Rome; East Francia becomes the core of the Holy Roman Empire.: Otto I kröns till kejsare i Rom; Östfrankiska riket blir kärnan i tysk-romerska riket.
  Otto I is crowned emperor in Rome; the Kingdom of Italy becomes part of the Holy Roman Empire, and the emperors take over the Exarchate and the Pentapolis in practice.: Otto I kröns till kejsare i Rom; kungariket Italien blir en del av tysk-romerska riket, och kejsarna tar i praktiken över exarkatet och Pentapolis.
  Byzantium takes Cyprus, which had been shared with the Arab caliphate since the treaty of 688.: Bysans intar Cypern, som sedan fördraget 688 delats med det arabiska kalifatet.
  Nikephoros II takes Tarsus, a year after Mopsuestia; Cilicia is Byzantine again.: Nikeforos II intar Tarsos, ett år efter Mopsuestia; Kilikien är åter bysantinskt.
  The Armenian princes of Taron cede their land to Byzantium.: De armeniska furstarna av Taron avträder sitt land till Bysans.
  The Fatimid general Jawhar takes Fustat and founds Cairo nearby.: Den fatimidiske fältherren Jawhar intar Fustat och grundar Kairo i närheten.
  Byzantine troops take Antioch. Aleppo becomes a Byzantine tributary.: Bysantinska trupper intar Antiochia. Aleppo blir bysantinsk tributstat.
  Byzantium takes Antioch; Latakia and Tartus are Byzantine too. Aleppo becomes a tributary under the treaty of Safar.: Bysans intar Antiochia; även Latakia och Tartus blir bysantinska. Aleppo blir tributstat enligt fördraget i Safar.
  The Fatimids take Palestine and Damascus (970–971).: Fatimiderna intar Palestina och Damaskus (970–971).
  After defeating Sviatoslav of Kiev at Dorostolon, John I Tzimiskes annexes eastern Bulgaria with Preslav and the Thracian lands. The western Bulgarian lands stay independent under the Cometopuli brothers, later Tsar Samuel.: Efter att ha besegrat Svjatoslav av Kiev vid Dorostolon annekterar Johannes I Tzimiskes östra Bulgarien med Preslav och de thrakiska länderna. De västra bulgariska länderna förblir självständiga under bröderna Kometopuli, senare tsar Samuel.
  Otto II gives the march on the Danube east of the Enns to Leopold of Babenberg, the beginning of Austria.: Otto II ger marken vid Donau öster om Enns till Leopold av Babenberg, början till Österrike.
  Pandulf Ironhead dies; Capua and Benevento separate again.: Pandulf Järnhuvud dör; Capua och Benevento skiljs åt igen.
  The Great Slav Rising. The Lutici destroy Havelberg and Brandenburg, and the Empire loses the land between the Elbe and the Oder for almost two centuries.: Det stora slaviska upproret. Liutizerna förstör Havelberg och Brandenburg, och riket förlorar landet mellan Elbe och Oder för nästan två sekler.
  Samuel takes Larissa (986) and defeats Basil II at the Gates of Trajan. By then Bulgaria also holds the north-east again; the date of that recovery is uncertain.: Samuel intar Larissa (986) och besegrar Basileios II vid Trajanus port. Vid den tiden behärskar Bulgarien även nordost igen; när detta återtagande skedde är osäkert.
  Almanzor takes Coimbra; the land south of the Douro returns to Córdoba.: Almanzor intar Coimbra; landet söder om Douro återgår till Córdoba.
  Hugh Capet is crowned king of the West Franks.: Hugo Capet kröns till västfrankernas kung.
  Count Borrell II of Barcelona no longer renews his allegiance to the new Capetian king; the Catalan counties are independent in practice.: Greve Borrell II av Barcelona förnyar inte längre sin trohetsed till den nye capetingiske kungen; de katalanska grevskapen är i praktiken självständiga.
  The Kurdish Marwanid dynasty takes over the Diyarbakır region after the Hamdanids.: Den kurdiska marwaniddynastin tar över Diyarbakırregionen efter hamdaniderna.
  In the 990s Samuel takes Dyrrhachium on the Adriatic.: Under 990-talet intar Samuel Dyrrachion vid Adriatiska havet.
  historical-basemaps world_1000 (automatic draft, partly hand-corrected): historical-basemaps world_1000 (automatiskt utkast, delvis handkorrigerat)
  Basil II’s generals retake Pliska, Preslav and Dorostolon in north-eastern Bulgaria.: Basileios II:s fältherrar återtar Pliska, Preslav och Dorostolon i nordöstra Bulgarien.
  Battle of Svolder. Olaf Tryggvason falls; Norway is divided between the Danish and Swedish kings, ruled for Sweyn Forkbeard by the jarls of Lade.: Slaget vid Svolder. Olav Tryggvason stupar; Norge delas mellan den danske och den svenske kungen och styrs för Sven Tveskäggs räkning av ladejarlarna.
  Byzantium recovers Thessaly and the fortresses of Berroia and Servia in western Macedonia.: Bysans återtar Thessalien och fästningarna Berroia och Servia i västra Makedonien.
  The last Hamdanid of Aleppo is deposed by his minister Lu’lu’. Aleppo passes to Fatimid governors and, from 1024, to the Mirdasid emirs; the Jazira is held by Arab emirs of the Uqaylid and Numayrid families.: Den siste hamdaniden i Aleppo avsätts av sin minister Lu’lu’. Aleppo övergår till fatimidiska guvernörer och från 1024 till mirdasidiska emirer; Jazira behärskas av arabiska emirer ur släkterna uqaylid och numayrid.
  Vidin surrenders after an eight-month siege (1002 or 1003); Byzantium holds the Danube from Vidin to the sea.: Vidin kapitulerar efter en åttamånaders belägring (1002 eller 1003); Bysans behärskar Donau från Vidin till havet.
  Basil II defeats Samuel on the Vardar and takes Skopje (1003 or 1004).: Basileios II besegrar Samuel vid Vardar och intar Skopje (1003 eller 1004).
  Dyrrhachium is handed back to Byzantium.: Dyrrachion lämnas tillbaka till Bysans.
  Olaf Haraldsson (Saint Olaf) takes the Norwegian throne and drives out the jarls.: Olav Haraldsson (Olav den helige) bestiger den norska tronen och driver ut jarlarna.
  Basil II completes the conquest of Bulgaria after Samuel’s death and the surrender of Tsar Ivan Vladislav’s widow at Ohrid. Sirmium follows in 1018–1019.: Basileios II fullbordar erövringen av Bulgarien efter Samuels död och tsar Ivan Vladislavs änkas kapitulation i Ohrid. Sirmium följer 1018–1019.
  Battle of Carham. Malcolm II of Scotland and Owen of Strathclyde defeat the Northumbrians; Lothian passes to Scotland for good. After Owen’s death Strathclyde, with Cumbria and Galloway, is absorbed into the Scottish kingdom.: Slaget vid Carham. Malcolm II av Skottland och Owen av Strathclyde besegrar northumbrierna; Lothian övergår för gott till Skottland. Efter Owens död uppgår Strathclyde, med Cumbria och Galloway, i det skotska kungariket.
  The Byzantine catepan Basil Boioannes defeats Melus and his Norman allies at Cannae and secures the Capitanata.: Den bysantinske katepanen Basileios Boioannes besegrar Melus och hans normandiska allierade vid Cannae och säkrar Capitanata.
  Senekerim-John of Vaspurakan cedes his kingdom to Basil II (1021–1022).: Senekerim-Johannes av Vaspurakan avträder sitt kungarike till Basileios II (1021–1022).
  Cnut the Great, king of Denmark and England, drives Olaf out and takes Norway; Olaf falls at Stiklestad in 1030 trying to return.: Knut den store, kung av Danmark och England, driver ut Olav och tar Norge; Olav stupar vid Stiklestad 1030 när han försöker återvända.
  Count García Sánchez of Castile is murdered in León; Sancho III of Pamplona takes Castile.: Greve García Sánchez av Kastilien mördas i León; Sancho III av Pamplona tar Kastilien.
  George Maniakes takes Edessa.: Georgios Maniakes intar Edessa.
  "The Caliphate of Córdoba is abolished. Al-Andalus breaks up into taifa kingdoms: Zaragoza (with Lleida and Tortosa), Toledo, Badajoz (with Lisbon), Seville, Granada (with Málaga and Jaén), Almería, Murcia, Valencia, Denia (with the Balearics), and Córdoba itself.": "Kalifatet Córdoba avskaffas. Al-Andalus splittras i taifakungariken: Zaragoza (med Lleida och Tortosa), Toledo, Badajoz (med Lissabon), Sevilla, Granada (med Málaga och Jaén), Almería, Murcia, Valencia, Denia (med Balearerna) och Córdoba självt."
  With the end of the Caliphate of Córdoba, its protectorate in northern Morocco breaks up among Zenata Berber emirs at Fez, Sijilmasa and elsewhere.: När kalifatet Córdoba upphör splittras dess protektorat i norra Marocko mellan zenataberbiska emirer i Fès, Sijilmasa och på andra håll.
  Conrad II is crowned king of Burgundy after the last Rudolfian king dies; the kingdom of Burgundy (Arles) becomes part of the Holy Roman Empire.: Konrad II kröns till kung av Burgund efter att den siste rudolfingiske kungen dött; kungariket Burgund (Arles) blir en del av tysk-romerska riket.
  Conrad II inherits the Kingdom of Burgundy; Humbert the White-Handed holds the Aosta valley, the start of the house of Savoy.: Konrad II ärver kungariket Burgund; Humbert Vithand behärskar Aostadalen, början till huset Savojen.
  The county of Provence, with Monaco, is held by its own counts within the Kingdom of Burgundy.: Grevskapet Provence, med Monaco, innehas av egna grevar inom kungariket Burgund.
  The Faroe Islands come under the Norwegian crown (traditionally dated about 1035).: Färöarna kommer under den norska kronan (traditionellt daterat till omkring 1035).
  Magnus the Good, Olaf's son, is king of Norway after Cnut's regime collapses.: Magnus den gode, Olavs son, är kung av Norge sedan Knuts välde kollapsat.
  Sancho III of Pamplona dies. His son Ferdinand rules Castile as king, Ramiro rules Aragon, and García keeps Pamplona with Álava and Biscay.: Sancho III av Pamplona dör. Hans son Ferdinand styr Kastilien som kung, Ramiro styr Aragonien och García behåller Pamplona med Álava och Biscaya.
  Battle of Tamarón. Ferdinand I of Castile defeats and kills Bermudo III of León and takes his kingdom.: Slaget vid Tamarón. Ferdinand I av Kastilien besegrar och dödar Bermudo III av León och tar hans kungarike.
  Stefan Vojislav of Duklja defeats a Byzantine army near Bar and makes Duklja independent.: Stefan Vojislav av Duklja besegrar en bysantinsk armé nära Bar och gör Duklja självständigt.
  The Normans at Melfi elect William Iron Arm count of Apulia.: Normanderna i Melfi väljer Vilhelm Järnarm till greve av Apulien.
  Byzantium annexes the Bagratid kingdom of Ani.: Bysans annekterar det bagratidiska kungariket Ani.
  Battle of Civitate. The Normans defeat and capture Pope Leo IX; they hold the Capitanata.: Slaget vid Civitate. Normanderna besegrar och tillfångatar påven Leo IX; de behärskar Capitanata.
  Treaty of Melfi. Pope Nicholas II invests Robert Guiscard as Duke of Apulia and Calabria, and of Sicily to come.: Fördraget i Melfi. Påven Nikolaus II förlänar Robert Guiscard titeln hertig av Apulien och Kalabrien, och av Sicilien när det väl erövrats.
  Robert Guiscard takes Reggio, completing the conquest of Calabria.: Robert Guiscard intar Reggio och fullbordar erövringen av Kalabrien.
  Roger and Robert Guiscard cross the strait and take Messina.: Roger och Robert Guiscard korsar sundet och intar Messina.
  Richard of Capua takes Gaeta.: Rikard av Capua intar Gaeta.
  The Normans take Taranto and Matera.: Normanderna intar Taranto och Matera.
  Ferdinand I takes Coimbra.: Ferdinand I intar Coimbra.
  Sultan Alp Arslan takes Ani; Kars follows within a year.: Sultan Alp Arslan intar Ani; Kars följer inom ett år.
  "Ferdinand I dies and divides his realm: Sancho II takes Castile, Alfonso VI León with Portugal, and García Galicia.": "Ferdinand I dör och delar sitt rike: Sancho II får Kastilien, Alfons VI León med Portugal och García Galicien."
  "France in 1066. The Capetian kings rule a small royal domain, but the great fiefs of the kingdom (Normandy, Anjou, Aquitaine, Burgundy, Champagne and the rest) are shown with France. The duchy of Brittany, the county of Flanders (with Artois) and the county of Toulouse are shown separately. East of the Scheldt, the Meuse, the Saône and the Rhône lie the lands of the Holy Roman Empire: the Low Countries, Lorraine, Alsace, the Free County of Burgundy, Dauphiné and Provence.": "Frankrike 1066. De capetingiska kungarna styr en liten kronodomän, men kungarikets stora län (Normandie, Anjou, Aquitanien, Burgund, Champagne och de övriga) visas som en del av Frankrike. Hertigdömet Bretagne, grevskapet Flandern (med Artois) och grevskapet Toulouse visas separat. Öster om Schelde, Maas, Saône och Rhône ligger tysk-romerska rikets länder: Nederländerna, Lothringen, Elsass, Fria grevskapet Burgund, Dauphiné och Provence."
  William of Normandy is crowned king of England. The Channel Islands, part of his duchy, stay with the English crown when Normandy is lost in 1204.: Vilhelm av Normandie kröns till kung av England. Kanalöarna, som hör till hans hertigdöme, stannar hos den engelska kronan när Normandie går förlorat 1204.
  William, duke of Normandy, is crowned king of England. Normandy stays a fief of the French crown, held by the English king.: Vilhelm, hertig av Normandie, kröns till kung av England. Normandie förblir ett län under den franska kronan, innehaft av den engelske kungen.
  Al-Mu’tamid of Seville annexes Córdoba.: Al-Mu’tamid av Sevilla annekterar Córdoba.
  About 1070. The Cumans (Kipchaks) push the Pechenegs out of the steppe north of the Danube.: Omkring 1070. Kumanerna (kiptjakerna) tränger ut petjenegerna från stäppen norr om Donau.
  William FitzOsbern, earl of Hereford, has conquered Gwent (Monmouthshire), the first Norman lordship in Wales.: William FitzOsbern, earl av Hereford, har erövrat Gwent (Monmouthshire), det första normandiska herradömet i Wales.
  The Normans take Brindisi and Otranto.: Normanderna intar Brindisi och Otranto.
  About 1070. The qadis of the Banu Ammar family make Tripoli independent of the Fatimids.: Omkring 1070. Kadierna ur släkten Banu Ammar gör Tripoli oberoende av fatimiderna.
  King Solomon of Hungary takes Belgrade and Sirmium from Byzantium.: Kung Salomon av Ungern tar Belgrad och Sirmium från Bysans.
  Catania falls to Count Roger.: Catania faller till greve Roger.
  Bari, the last Byzantine city in Italy, surrenders to Robert Guiscard after a siege of nearly three years.: Bari, den sista bysantinska staden i Italien, kapitulerar för Robert Guiscard efter en nästan treårig belägring.
  Battle of Manzikert. Alp Arslan defeats and captures Romanos IV; Byzantine rule in the east collapses.: Slaget vid Manzikert. Alp Arslan besegrar och tillfångatar Romanos IV; det bysantinska styret i öster bryter samman.
  Robert Guiscard and Roger take Palermo.: Robert Guiscard och Roger intar Palermo.
  Sancho II is killed besieging Zamora; Alfonso VI reunites León and Castile.: Sancho II dödas under belägringen av Zamora; Alfons VI återförenar León och Kastilien.
  Zaragoza annexes Denia; Mallorca becomes a taifa of its own.: Zaragoza annekterar Denia; Mallorca blir en egen taifa.
  Sancho IV of Pamplona is murdered at Peñalén. Alfonso VI takes La Rioja, Álava, Biscay and Gipuzkoa; Sancho Ramírez of Aragon becomes king of Pamplona.: Sancho IV av Pamplona mördas vid Peñalén. Alfons VI tar La Rioja, Álava, Biscaya och Gipuzkoa; Sancho Ramírez av Aragonien blir kung av Pamplona.
  Robert Guiscard takes Salerno (the citadel holds out until May 1077); the last Lombard principality ends, and Benevento city passes to the pope.: Robert Guiscard intar Salerno (citadellet håller ut till maj 1077); det sista langobardiska furstendömet upphör, och staden Benevento övergår till påven.
  Count Roger takes Trapani.: Greve Roger intar Trapani.
  The Turkmen chief Atsiz took Jerusalem (1073) and Damascus (1076); Tutush, brother of the Seljuk sultan Malik-Shah, now rules Damascus. The Fatimids keep the coast.: Turkmenhövdingen Atsiz hade intagit Jerusalem (1073) och Damaskus (1076); Tutush, bror till seldjuksultanen Malik-Shah, härskar nu över Damaskus. Fatimiderna behåller kusten.
  The Armenian lord Ruben founds a principality in the Taurus mountains of Cilicia.: Den armeniske stormannen Ruben grundar ett furstendöme i Kilikiens Taurusberg.
  By 1081 Turkish emirs hold most of Anatolia. Süleyman ibn Qutalmish rules from Nicaea as the first Seljuk sultan of Rum, and the Danishmendids hold the north-east; a treaty with Alexios I sets the frontier on the Drakon near Nicomedia. Byzantium keeps the Black Sea coast and Attaleia; the Armenian general Philaretos holds Melitene, Antioch and Edessa in its name.: År 1081 behärskar turkiska emirer större delen av Anatolien. Süleyman ibn Qutalmish härskar från Nicaea som den förste seldjukiske sultanen av Rum, och danishmendiderna behärskar nordost; ett fördrag med Alexios I drar gränsen vid Drakon nära Nikomedia. Bysans behåller Svartahavskusten och Attaleia; den armeniske fältherren Filaretos behärskar Melitene, Antiochia och Edessa i dess namn.
  The Almoravids take Ceuta and Melilla.: Almoraviderna intar Ceuta och Melilla.
  Süleyman of Rum takes Antioch and the Cilician plain.: Süleyman av Rum intar Antiochia och den kilikiska slätten.
  The Seljuks end Marwanid rule in Diyarbakır.: Seldjukerna gör slut på marwanidernas styre i Diyarbakır.
  Alfonso VI takes Toledo, the old Visigothic capital, and the land between the Sistema Central and the Tagus; the deposed al-Qadir is installed in Valencia.: Alfons VI intar Toledo, den gamla västgotiska huvudstaden, och landet mellan Sistema Central och Tajo; den avsatte al-Qadir insätts i Valencia.
  Tutush takes Aleppo; northern Syria and the Jazira come under Seljuk rule.: Tutush intar Aleppo; norra Syrien och Jazira kommer under seldjukiskt styre.
  Süleyman is killed fighting Tutush; Antioch and, in 1087, Edessa pass to governors of the Great Seljuk sultan Malik-Shah.: Süleyman dödas i strid mot Tutush; Antiochia och 1087 Edessa övergår till guvernörer under storseldjuksultanen Malik-Shah.
  Count Roger takes Syracuse.: Greve Roger intar Syrakusa.
  Count Roger takes Agrigento, and Enna surrenders.: Greve Roger intar Agrigento, och Enna kapitulerar.
  Count Roger takes Butera.: Greve Roger intar Butera.
  The Almoravid emir Yusuf ibn Tashfin, who had defeated Alfonso VI at Sagrajas in 1086, deposes the taifa kings of Granada and Málaga.: Den almoravidiske emiren Yusuf ibn Tashfin, som hade besegrat Alfons VI vid Sagrajas 1086, avsätter taifakungarna i Granada och Málaga.
  Ladislaus I of Hungary takes Slavonia; he founds the bishopric of Zagreb a few years later.: Ladislaus I av Ungern tar Slavonien; några år senare grundar han biskopsdömet Zagreb.
  Noto, the last Muslim stronghold in Sicily, surrenders. Later that year Roger raids Malta and makes it tributary.: Noto, det sista muslimska fästet på Sicilien, kapitulerar. Senare samma år plundrar Roger Malta och gör ön skattskyldig.
  The Almoravids take Seville and send al-Mu’tamid into exile; Córdoba, Almería and Murcia fall the same year.: Almoraviderna intar Sevilla och skickar al-Mu’tamid i landsflykt; Córdoba, Almería och Murcia faller samma år.
  William II takes Carlisle and Cumbria from Scotland.: Vilhelm II tar Carlisle och Cumbria från Skottland.
  The Almoravids take Denia.: Almoraviderna intar Denia.
  "After Rhys ap Tewdwr of Deheubarth is killed, Norman lords take southern Wales: Glamorgan, Brecon, Gower and Pembroke become Marcher lordships under the English crown.": "Sedan Rhys ap Tewdwr av Deheubarth dödats tar normandiska stormän södra Wales: Glamorgan, Brecon, Gower och Pembroke blir marcher-herradömen under den engelska kronan."
  The Almoravids take Badajoz and its lands, including Lisbon.: Almoraviderna intar Badajoz och dess landområden, inklusive Lissabon.
  Rodrigo Díaz, El Cid, takes Valencia after a twenty-month siege and rules it as his own.: Rodrigo Díaz, El Cid, intar Valencia efter en tjugo månader lång belägring och styr staden som sin egen.
  Peter I of Aragon takes Huesca after the battle of Alcoraz.: Peter I av Aragonien intar Huesca efter slaget vid Alcoraz.
  Nicaea surrenders to Byzantium during the First Crusade; in 1097–1098 John Doukas recovers the west coast and its river valleys.: Nicaea kapitulerar för Bysans under första korståget; 1097–1098 återtar Johannes Dukas västkusten och dess floddalar.
  Magnus Barefoot’s expedition. Scotland recognises Norwegian rule over the Hebrides and Man (the Kingdom of the Isles).: Magnus Barfots expedition. Skottland erkänner norskt styre över Hebriderna och Isle of Man (Öarnas kungarike).
  Baldwin of Boulogne takes over Edessa and founds the first crusader state.: Balduin av Boulogne tar över Edessa och grundar den första korsfararstaten.
  The crusaders take Antioch; Bohemond of Taranto founds the Principality of Antioch.: Korsfararna intar Antiochia; Bohemund av Taranto grundar furstendömet Antiochia.
  The crusaders take Antioch, with the land around Maarat and Albara to the south-east.: Korsfararna intar Antiochia, med landet kring Maarat och Albara i sydost.
  The Fatimids retake Jerusalem from the Artuqid governors.: Fatimiderna återtar Jerusalem från de artuqidiska guvernörerna.
  The crusaders take Jerusalem and massacre much of its population; Godfrey of Bouillon rules the new Kingdom of Jerusalem. Jaffa and Galilee are taken the same year.: Korsfararna intar Jerusalem och massakrerar en stor del av invånarna; Gottfrid av Bouillon härskar över det nya kungariket Jerusalem. Jaffa och Galileen intas samma år.
  historical-basemaps world_1100 (automatic draft, partly hand-corrected): historical-basemaps world_1100 (automatiskt utkast, delvis handkorrigerat)
  "About 1100. As Great Seljuk power in the west breaks up, Turkish dynasties hold the east: the Saltukids at Erzurum, the Mengujekids at Erzincan, the Artuqids around Diyarbakır and Mardin, and the Shah-Armens at Ahlat.": "Omkring 1100. När storseldjukernas makt i väster bryts upp behärskar turkiska dynastier östra delen: saltukiderna i Erzurum, mengujekiderna i Erzincan, artuqiderna kring Diyarbakır och Mardin samt shah-armenerna i Ahlat."
  Genoa and Pisa, the leading sea powers of the western Mediterranean, govern themselves as communes.: Genua och Pisa, västra Medelhavets ledande sjömakter, styr sig själva som kommuner.
  The Principality of Antioch takes the Cilician plain with Tarsus, Adana and Mamistra.: Furstendömet Antiochia tar den kilikiska slätten med Tarsos, Adana och Mamistra.
  King Baldwin I takes Arsuf and Caesarea; Haifa fell in 1100.: Kung Balduin I intar Arsuf och Caesarea; Haifa föll år 1100.
  The Danishmendids take Melitene.: Danishmendiderna intar Melitene.
  Coloman of Hungary is crowned king of Croatia at Biograd. Croatia stays a separate kingdom in union with Hungary, shown here on its own until 1527.: Koloman av Ungern kröns till kung av Kroatien i Biograd. Kroatien förblir ett eget kungarike i union med Ungern och visas här separat fram till 1527.
  Raymond of Toulouse takes Tortosa (Tartus).: Raimond av Toulouse intar Tortosa (Tartus).
  Jimena, El Cid’s widow, abandons Valencia, which the Almoravids occupy.: Jimena, El Cids änka, överger Valencia, som almoraviderna besätter.
  Tancred of Antioch takes Latakia from Byzantium.: Tankred av Antiochia tar Latakia från Bysans.
  Marash passes to the County of Edessa.: Marash övergår till grevskapet Edessa.
  Battle of Uclés. The Almoravids defeat Castile and retake the land south-east of Toledo.: Slaget vid Uclés. Almoraviderna besegrar Kastilien och återtar landet sydost om Toledo.
  Tripoli surrenders after a siege of several years; it becomes the capital of the County of Tripoli.: Tripoli kapitulerar efter en flerårig belägring; staden blir huvudstad i grevskapet Tripoli.
  Baldwin I takes Beirut and Sidon; Tyre follows in 1124.: Balduin I intar Beirut och Sidon; Tyros följer 1124.
  The Almoravids take Zaragoza, the last independent taifa.: Almoraviderna intar Zaragoza, den sista självständiga taifan.
  Baldwin I builds Montréal (Shobak) and extends the kingdom beyond the Jordan to Ayla on the Red Sea (1116); Kerak is built in 1142.: Balduin I bygger Montréal (Shobak) och utvidgar kungariket bortom Jordan till Ayla vid Röda havet (1116); Kerak byggs 1142.
  The Almoravids occupy Mallorca after the Pisan–Catalan raid of 1114–15.: Almoraviderna besätter Mallorca efter det pisansk-katalanska anfallet 1114–15.
  Alfonso I of Aragon, the Battler, takes Zaragoza.: Alfons I av Aragonien, Krigaren, intar Zaragoza.
  John II retakes Laodicea (1119) and Sozopolis (1120).: Johannes II återtar Laodikeia (1119) och Sozopolis (1120).
  Alfonso I takes Tudela.: Alfons I intar Tudela.
  "Provence is partitioned: the counts of Barcelona keep Provence south of the Durance, the counts of Toulouse take the march north of it (the later Comtat Venaissin).": "Provence delas: grevarna av Barcelona behåller Provence söder om Durance, grevarna av Toulouse tar marken norr därom (det senare Comtat Venaissin)."
  Imad al-Din Zengi becomes atabeg of Mosul, with the Kurdish mountains to the north.: Imad al-Din Zengi blir atabeg av Mosul, med de kurdiska bergen i norr.
  Duke William of Apulia dies childless; Roger II of Sicily claims and conquers Apulia and Calabria. Roger also annexes Malta.: Hertig Vilhelm av Apulien dör barnlös; Roger II av Sicilien gör anspråk på och erövrar Apulien och Kalabrien. Roger annekterar även Malta.
  Imad al-Din Zengi, atabeg of Mosul, takes Aleppo.: Imad al-Din Zengi, atabeg av Mosul, intar Aleppo.
  Battle of São Mamede. Afonso Henriques defeats his mother’s party and rules the County of Portugal as his own.: Slaget vid São Mamede. Afonso Henriques besegrar sin mors parti och styr grevskapet Portugal som sitt eget.
  Mstislav the Great dies, and Kievan Rus' breaks up into rival principalities under branches of the Rurikid dynasty; Novgorod becomes a republic in 1136.: Mstislav den store dör, och Kievriket splittras i rivaliserande furstendömen under olika grenar av rurikdynastin; Novgorod blir en republik 1136.
  Alfonso I dies childless. Pamplona elects García Ramírez as king, with Tudela, Álava and Gipuzkoa; Aragon keeps Zaragoza.: Alfons I dör barnlös. Pamplona väljer García Ramírez till kung, med Tudela, Álava och Gipuzkoa; Aragonien behåller Zaragoza.
  Roger II conquers the Principality of Capua.: Roger II erövrar furstendömet Capua.
  First Treaty of Durham. During the Anarchy, David I of Scotland keeps Cumbria.: Första fördraget i Durham. Under anarkin behåller David I av Skottland Cumbria.
  John II subdues Cilicia and captures the Armenian prince Leo I.: Johannes II underkuvar Kilikien och tillfångatar den armeniske fursten Leo I.
  Béla II takes Bosnia (Rama), which is ruled by bans under Hungarian overlordship.: Béla II tar Bosnien (Rama), som styrs av baner under ungerskt överherradöme.
  Petronilla of Aragon is betrothed to Count Ramon Berenguer IV of Barcelona, joining Aragon and the Catalan counties in the Crown of Aragon.: Petronilla av Aragonien trolovas med greve Ramon Berenguer IV av Barcelona, vilket förenar Aragonien och de katalanska grevskapen i Aragoniska kronan.
  After the Treaty of Mignano, in which Pope Innocent II recognises Roger II as king, Naples submits; the last independent duchy in the south ends.: Efter fördraget i Mignano, där påven Innocentius II erkänner Roger II som kung, underkastar sig Neapel; det sista självständiga hertigdömet i söder upphör.
  Second Treaty of Durham. Stephen grants the earldom of Northumberland to David’s son Henry.: Andra fördraget i Durham. Stefan ger grevskapet Northumberland till Davids son Henrik.
  Roger II’s sons conquer the Abruzzi.: Roger II:s söner erövrar Abruzzerna.
  Geoffrey Plantagenet, count of Anjou, takes Rouen and becomes duke of Normandy, which passes out of the English king’s hands during the Anarchy.: Gottfrid Plantagenet, greve av Anjou, intar Rouen och blir hertig av Normandie, som under anarkin går den engelske kungen ur händerna.
  Zengi takes Edessa after a four-week siege.: Zengi intar Edessa efter en fyra veckor lång belägring.
  The Almohads take Ceuta and Melilla.: Almohaderna intar Ceuta och Melilla.
  The Almoravid state collapses. The Almohads take Seville and western al-Andalus; Ibn Mardanish, the “Wolf King”, rules Murcia and Valencia.: Den almoravidiska staten kollapsar. Almohaderna intar Sevilla och västra al-Andalus; Ibn Mardanish, ”Vargkungen”, härskar över Murcia och Valencia.
  Alfonso VII of Castile takes Calatrava.: Alfons VII av Kastilien intar Calatrava.
  Afonso Henriques takes Santarém.: Afonso Henriques intar Santarém.
  Alfonso VII, with Genoese, Pisan and Catalan help, takes Almería.: Alfons VII intar Almería med genuesisk, pisansk och katalansk hjälp.
  Afonso Henriques takes Lisbon with the help of crusaders sailing to the Holy Land.: Afonso Henriques intar Lissabon med hjälp av korsfarare på väg till Heliga landet.
  The Banu Ghaniya governors keep Mallorca as an independent Almoravid state.: Guvernörerna av släkten Banu Ghaniya behåller Mallorca som en självständig almoravidisk stat.
  Ramon Berenguer IV takes Tortosa.: Ramon Berenguer IV intar Tortosa.
  Sultan Mesud of Rum takes Marash.: Sultan Mesud av Rum intar Marash.
  Ramon Berenguer IV takes Lleida.: Ramon Berenguer IV intar Lleida.
  Countess Beatrice sells the rest of the County of Edessa to Byzantium, which loses it to Nur al-Din and Rum within a year.: Grevinnan Beatrice säljer resten av grevskapet Edessa till Bysans, som förlorar det till Nur al-Din och Rum inom ett år.
  Thoros II recovers the Cilician plain for the Armenians; in 1158 he accepts Manuel I as overlord.: Thoros II återtar den kilikiska slätten åt armenierna; 1158 erkänner han Manuel I som överherre.
  Baldwin III takes Ascalon, the last Fatimid stronghold in Palestine.: Balduin III intar Askalon, det sista fatimidiska fästet i Palestina.
  Zengi’s son Nur al-Din takes Damascus.: Zengis son Nur al-Din intar Damaskus.
  Henry II is crowned king of England. Count of Anjou, Maine and Touraine and duke of Normandy, and since his marriage to Eleanor in 1152 duke of Aquitaine too, he holds more of France than the French king; Brittany comes under his family in 1166.: Henrik II kröns till kung av England. Som greve av Anjou, Maine och Touraine och hertig av Normandie, och sedan sitt giftermål med Eleonora 1152 även hertig av Aquitanien, behärskar han mer av Frankrike än den franske kungen; Bretagne kommer under hans släkt 1166.
  Henry II makes Malcolm IV return Cumbria and Northumberland.: Henrik II tvingar Malcolm IV att lämna tillbaka Cumbria och Northumberland.
  Alfonso VII dies; León (with Galicia and Salamanca) and Castile are divided between his sons. The Almohads retake Almería.: Alfons VII dör; León (med Galicien och Salamanca) och Kastilien delas mellan hans söner. Almohaderna återtar Almería.
  Nur al-Din defeats the crusaders at Harim and takes the fortress.: Nur al-Din besegrar korsfararna vid Harim och intar fästningen.
  Gerald the Fearless takes Évora for Portugal; the Portuguese settle the frontier to the Tagus and beyond.: Geraldo den orädde intar Évora åt Portugal; portugiserna koloniserar gränslandet fram till Tajo och bortom.
  Manuel I’s victory at Sirmium confirms Byzantine rule over Syrmia, Bosnia and Dalmatia, taken in the war that began in 1162.: Manuel I:s seger vid Sirmium bekräftar det bysantinska styret över Syrmien, Bosnien och Dalmatien, som erövrats i kriget som började 1162.
  Valdemar I and Bishop Absalon take Arkona. The princes of Rügen become Danish vassals.: Valdemar I och biskop Absalon intar Arkona. Furstarna av Rügen blir danska vasaller.
  Anglo-Norman knights invited by Diarmait Mac Murchada, the deposed king of Leinster, land at Bannow Bay and take the Norse town of Wexford.: Anglonormandiska riddare, inbjudna av Diarmait Mac Murchada, Leinsters avsatte kung, landstiger vid Bannow Bay och intar den nordiska staden Wexford.
  Strongbow (Richard de Clare) storms Waterford.: Strongbow (Richard de Clare) stormar Waterford.
  Strongbow and Diarmait take Dublin; its Norse king Ascall flees.: Strongbow och Diarmait intar Dublin; dess nordiske kung Ascall flyr.
  Alfonso II of Aragon founds Teruel.: Alfons II av Aragonien grundar Teruel.
  Saladin, vizier of Egypt since 1169, ends the Fatimid caliphate; he took Ayla in 1170.: Saladin, Egyptens vesir sedan 1169, gör slut på fatimidiska kalifatet; han intog Ayla 1170.
  Henry II lands at Waterford. Strongbow, lord of Leinster since Diarmait’s death, and many Irish kings submit to him, and the Lordship of Ireland begins. Meath is granted to Hugh de Lacy in 1172.: Henrik II landstiger i Waterford. Strongbow, herre över Leinster sedan Diarmaits död, och många irländska kungar underkastar sig honom, och herradömet Irland tar sin början. Meath förlänas Hugh de Lacy 1172.
  Count Girard II of Roussillon leaves his county to Alfonso II of Aragon.: Greve Girard II av Roussillon testamenterar sitt grevskap till Alfons II av Aragonien.
  Ibn Mardanish dies; Murcia and Valencia submit to the Almohads.: Ibn Mardanish dör; Murcia och Valencia underkastar sig almohaderna.
  After Nur al-Din’s death Saladin takes Damascus, and Homs and Hama in 1175.: Efter Nur al-Dins död intar Saladin Damaskus, och Homs och Hama 1175.
  John de Courcy conquers eastern Ulster, and the Anglo-Normans take Cork.: John de Courcy erövrar östra Ulster, och anglonormanderna intar Cork.
  Alfonso VIII of Castile takes Cuenca.: Alfons VIII av Kastilien intar Cuenca.
  By 1178 Kılıç Arslan II of Rum has absorbed the Danishmendid lands, taking Sivas (about 1174) and Melitene.: År 1178 har Kılıç Arslan II av Rum införlivat danishmendidernas länder och intagit Sivas (omkring 1174) och Melitene.
  Manuel I dies. Béla III of Hungary recovers Syrmia and Dalmatia; Ban Kulin rules Bosnia as an independent banate.: Manuel I dör. Béla III av Ungern återtar Syrmien och Dalmatien; ban Kulin styr Bosnien som ett självständigt banat.
  Saladin takes Edessa and the Jazira; Kılıç Arslan II takes Sozopolis from Byzantium.: Saladin intar Edessa och Jazira; Kılıç Arslan II tar Sozopolis från Bysans.
  Saladin takes Aleppo, after the Jazira (1182).: Saladin intar Aleppo, efter Jazira (1182).
  Prince John’s expedition. Louth and Tipperary are granted to Anglo-Norman lords.: Prins Johans expedition. Louth och Tipperary förlänas anglonormandiska stormän.
  The brothers Asen and Peter rise against Byzantium at Tarnovo. By 1187 the Second Bulgarian Empire holds the land between the Danube and the Balkan range.: Bröderna Asen och Peter gör uppror mot Bysans i Tarnovo. År 1187 behärskar Andra bulgariska riket landet mellan Donau och Balkanbergen.
  Stefan Nemanja of Serbia conquers Duklja (Zeta) with its coastal towns.: Stefan Nemanja av Serbien erövrar Duklja (Zeta) med dess kuststäder.
  After his victory at Hattin (4 July), Saladin takes Acre, Sidon and Beirut, and Jerusalem surrenders on 2 October. Tyre holds out; Kerak (1188) and Montréal (1189) fall after long sieges.: Efter segern vid Hattin (4 juli) intar Saladin Akko, Sidon och Beirut, och Jerusalem kapitulerar den 2 oktober. Tyros håller stånd; Kerak (1188) och Montréal (1189) faller efter långa belägringar.
  Saladin takes Latakia.: Saladin intar Latakia.
  After the battle on the Morava, Byzantium recognises Stefan Nemanja’s Serbia, which keeps Kosovo, Toplica and the upper Morava valley.: Efter slaget vid Morava erkänner Bysans Stefan Nemanjas Serbien, som behåller Kosovo, Toplica och övre Moravadalen.
  The Almohad caliph Yaqub al-Mansur retakes Alcácer do Sal and the land south of the Tagus except Évora.: Den almohadiske kalifen Yaqub al-Mansur återtar Alcácer do Sal och landet söder om Tajo utom Évora.
  Emperor Henry VI grants Monaco to Genoa.: Kejsar Henrik VI förlänar Monaco till Genua.
  Acre surrenders to the armies of the Third Crusade.: Akko kapitulerar för det tredje korstågets arméer.
  Count Philip of Flanders dies at Acre. Artois, the dowry of his niece Isabella of Hainaut, passes to her son, the future Louis VIII, and so to the French crown.: Greve Filip av Flandern dör vid Akko. Artois, hemgiften för hans systerdotter Isabella av Hainaut, övergår till hennes son, den blivande Ludvig VIII, och därmed till den franska kronan.
  Treaty of Jaffa. Richard I and Saladin agree a three-year truce; the coast from Tyre to Jaffa stays with the crusaders, the interior and Jerusalem with Saladin.: Fördraget i Jaffa. Rikard I och Saladin enas om ett treårigt stillestånd; kusten från Tyros till Jaffa stannar hos korsfararna, inlandet och Jerusalem hos Saladin.
  Asen takes Sofia and the upper Struma valley; Vidin and the north-west also pass to Bulgaria.: Asen intar Sofia och övre Strumadalen; även Vidin och nordväst övergår till Bulgarien.
  Battle of Alarcos. The Almohads defeat Alfonso VIII and retake Calatrava.: Slaget vid Alarcos. Almohaderna besegrar Alfons VIII och återtar Calatrava.
  Richard I gives the Agenais to Raymond VI of Toulouse as the dowry of his sister Joan.: Rikard I ger Agenais till Raimond VI av Toulouse som hemgift för sin syster Johanna.
  Limerick receives a charter as an English town; the Anglo-Normans settle the county.: Limerick får stadsprivilegier som engelsk stad; anglonormanderna koloniserar grevskapet.
  The crusade of Emperor Henry VI recovers Beirut and Byblos.: Kejsar Henrik VI:s korståg återtar Beirut och Byblos.
  Pope Innocent III takes over the Duchy of Spoleto and the March of Ancona.: Påven Innocentius III tar över hertigdömet Spoleto och marken Ancona.
  historical-basemaps world_1200 (automatic draft, partly hand-corrected): historical-basemaps world_1200 (automatiskt utkast, delvis handkorrigerat)
  Alfonso VIII of Castile takes Álava and Gipuzkoa from Navarre.: Alfons VIII av Kastilien tar Álava och Gipuzkoa från Navarra.
  Danish forces take Holstein, Hamburg and Lübeck. Danish overlordship north of the Elbe lasts until 1227.: Danska styrkor intar Holstein, Hamburg och Lübeck. Det danska överherradömet norr om Elbe varar till 1227.
  Tsar Kaloyan takes Varna.: Tsar Kalojan intar Varna.
  Süleyman II of Rum ends the Saltukid emirate of Erzurum.: Süleyman II av Rum gör slut på saltukidernas emirat i Erzurum.
  The Fourth Crusade takes Zara (Zadar) for Venice.: Fjärde korståget intar Zara (Zadar) åt Venedig.
  Kaloyan takes Belgrade and Braničevo from Hungary, Niš and most of Macedonia from Byzantium (1202–1203).: Kalojan tar Belgrad och Braničevo från Ungern samt Niš och större delen av Makedonien från Bysans (1202–1203).
  The Almohads conquer Mallorca from the Banu Ghaniya.: Almohaderna erövrar Mallorca från Banu Ghaniya.
  The Fourth Crusade takes Constantinople. The Latins claim north-western Asia Minor; Theodore Laskaris holds the rest of Byzantine Anatolia from Nicaea. Alexios and David Komnenos, with Georgian help, found the Empire of Trebizond and take the Paphlagonian coast.: Fjärde korståget intar Konstantinopel. Latinerna gör anspråk på nordvästra Mindre Asien; Theodoros Laskaris behärskar resten av det bysantinska Anatolien från Nicaea. Alexios och David Komnenos grundar med georgisk hjälp kejsardömet Trapezunt och tar den paflagoniska kusten.
  The Fourth Crusade sacks Constantinople. Baldwin of Flanders is crowned Latin emperor, with Thrace as his share; Boniface of Montferrat founds the Kingdom of Thessalonica.: Fjärde korståget plundrar Konstantinopel. Balduin av Flandern kröns till latinsk kejsare, med Thrakien som sin andel; Bonifatius av Montferrat grundar kungariket Thessaloniki.
  Rouen surrenders to Philip II. After two years of war he has taken Normandy, Anjou, Maine and Touraine from King John.: Rouen kapitulerar för Filip II. Efter två års krig har han tagit Normandie, Anjou, Maine och Touraine från kung Johan.
  "The crusaders conquer southern Greece: William of Champlitte and Geoffrey of Villehardouin found the Principality of Achaea, Othon de la Roche the lordship of Athens and Thebes. Michael Komnenos Doukas holds Epirus; Venice takes Ragusa and Dyrrhachium.": "Korsfararna erövrar södra Grekland: Guillaume de Champlitte och Geoffroi de Villehardouin grundar furstendömet Achaia, Othon de la Roche herradömet Aten och Thebe. Mikael Komnenos Dukas behärskar Epirus; Venedig tar Ragusa och Dyrrachion."
  Kaloyan destroys the Latin army at Adrianople and captures Emperor Baldwin; Bulgaria takes the Thracian plain north of Adrianople.: Kalojan förintar den latinska armén vid Adrianopel och tillfångatar kejsar Balduin; Bulgarien tar den thrakiska slätten norr om Adrianopel.
  Queen Tamar’s Georgian army takes Kars, after Ani in 1199.: Drottning Tamars georgiska armé intar Kars, efter Ani 1199.
  Marco Sanudo founds the Duchy of the Archipelago in the Cyclades; Venice occupies Corfu.: Marco Sanudo grundar hertigdömet Arkipelagen på Kykladerna; Venedig besätter Korfu.
  Kaykhusraw I of Rum takes Attaleia (Antalya).: Kaykhusraw I av Rum intar Attaleia (Antalya).
  Emperor Henry defeats Tsar Boril near Philippopolis; the plain of Plovdiv returns to the Latin Empire.: Kejsar Henrik besegrar tsar Boril nära Filippopolis; Plovdivslätten återgår till Latinska kejsardömet.
  The Lombard lords of Euboea (Negroponte) accept Venetian overlordship.: De langobardiska herrarna på Euboia (Negroponte) erkänner venetianskt överherradöme.
  Venice, which bought Crete from Boniface in 1204, completes its conquest of the island.: Venedig, som köpte Kreta av Bonifatius 1204, fullbordar erövringen av ön.
  The crusading army of Alfonso VIII retakes Calatrava on its march south; on 16 July Castile, Aragon and Navarre crush the Almohads at Las Navas de Tolosa.: Alfons VIII:s korstågsarmé återtar Calatrava på sin marsch söderut; den 16 juli krossar Kastilien, Aragonien och Navarra almohaderna vid Las Navas de Tolosa.
  Michael I of Epirus takes Dyrrhachium from Venice.: Mikael I av Epirus tar Dyrrachion från Venedig.
  Philip II’s forces seize Auvergne.: Filip II:s styrkor erövrar Auvergne.
  Alfonso VIII takes Alcaraz.: Alfons VIII intar Alcaraz.
  Nicaea takes Heraclea and Amastris from David Komnenos.: Nicaea tar Herakleia och Amastris från David Komnenos.
  Michael I of Epirus takes Corfu from Venice.: Mikael I av Epirus tar Korfu från Venedig.
  Kaykaus I of Rum takes Sinope and captures Alexios I of Trebizond.: Kaykaus I av Rum intar Sinope och tillfångatar Alexios I av Trapezunt.
  Portugal, helped by crusaders, takes Alcácer do Sal.: Portugal intar Alcácer do Sal med hjälp av korsfarare.
  Battle of Lyndanisse (Tallinn). Valdemar II begins the Danish conquest of northern Estonia.: Slaget vid Lyndanise (Tallinn). Valdemar II inleder den danska erövringen av norra Estland.
  Grand Prince Yuri II of Vladimir founds Nizhny Novgorod where the Oka meets the Volga.: Storfurst Jurij II av Vladimir grundar Nizjnij Novgorod där Oka möter Volga.
  The fall of Tarbatu (Tartu). Southern Estonia passes to the Livonian Brothers of the Sword and the Bishops of Riga and Dorpat (shown as the Order).: Tarbatu (Tartu) faller. Södra Estland övergår till Svärdsriddarorden och biskoparna av Riga och Dorpat (visas som orden).
  La Rochelle surrenders to Louis VIII. Poitou and Saintonge are lost to the English crown, and the lords of the Limousin, Périgord and the Gascon borderlands turn to France; Henry III keeps only Gascony.: La Rochelle kapitulerar för Ludvig VIII. Poitou och Saintonge går förlorade för den engelska kronan, och herrarna i Limousin, Périgord och de gaskognska gränsmarkerna vänder sig till Frankrike; Henrik III behåller endast Gascogne.
  Theodore Komnenos Doukas of Epirus takes Thessalonica and ends the Latin kingdom; he is crowned emperor.: Theodoros Komnenos Dukas av Epirus intar Thessaloniki och gör slut på det latinska kungariket; han kröns till kejsare.
  After the battle of Poimanenon (1224) the Latins keep only Nicomedia and the shore opposite Constantinople.: Efter slaget vid Poimanenon (1224) behåller latinerna endast Nikomedia och stranden mittemot Konstantinopel.
  Theodore takes Adrianople and western Thrace. In Asia Minor, the Empire of Nicaea takes the Aegean islands from the Latins.: Theodoros intar Adrianopel och västra Thrakien. I Mindre Asien tar kejsardömet Nicaea de egeiska öarna från latinerna.
  The Sword Brothers take Danish Estonia and Saaremaa while Valdemar II is weakened by his captivity (1223–1225).: Svärdsriddarna tar danska Estland och Ösel medan Valdemar II är försvagad av sin fångenskap (1223–1225).
  Battle of Bornhöved. Denmark loses Holstein, Hamburg and Lübeck; Rügen stays Danish.: Slaget vid Bornhöved. Danmark förlorar Holstein, Hamburg och Lübeck; Rügen förblir danskt.
  Kayqubad I ends the Mengujekid emirate of Erzincan.: Kayqubad I gör slut på mengujekidernas emirat i Erzincan.
  Almohad rule in al-Andalus collapses. Ibn Hud, proclaimed at Murcia, wins most of the south; Zayyan ibn Mardanish rules Valencia.: Almohadernas styre i al-Andalus kollapsar. Ibn Hud, utropad i Murcia, vinner större delen av södern; Zayyan ibn Mardanish härskar över Valencia.
  Treaty of Jaffa. Sultan al-Kamil cedes Jerusalem, Bethlehem and a corridor to the coast to Emperor Frederick II.: Fördraget i Jaffa. Sultan al-Kamil avträder Jerusalem, Betlehem och en korridor till kusten till kejsar Fredrik II.
  Treaty of Paris (Meaux) ends the Albigensian Crusade. Raymond VII keeps Toulouse, Quercy, Rouergue and the Agenais for his lifetime; lower Languedoc (Carcassonne, Béziers, Nîmes) and Foix pass to the French crown.: Fördraget i Paris (Meaux) avslutar albigenserkorståget. Raimond VII behåller Toulouse, Quercy, Rouergue och Agenais på livstid; nedre Languedoc (Carcassonne, Béziers, Nîmes) och Foix övergår till den franska kronan.
  Alfonso IX of León takes Cáceres.: Alfons IX av León intar Cáceres.
  James I of Aragon takes Madina Mayurqa (Palma); the conquest of Mallorca follows.: Jakob I av Aragonien intar Madina Mayurqa (Palma); erövringen av Mallorca följer.
  Alfonso IX takes Mérida and Badajoz.: Alfons IX intar Mérida och Badajoz.
  Treaty of Kruszwica. Duke Konrad of Masovia grants Chełmno Land to the Teutonic Order as a base against the Prussians.: Fördraget i Kruszwica. Hertig Konrad av Masovien överlåter Chełmnolandet till Tyska orden som bas mot prussarna.
  Ivan Asen II defeats and captures Theodore at Klokotnitsa and takes Thrace, Macedonia and Albania. Theodore’s brother Manuel keeps Thessalonica as a Bulgarian vassal.: Ivan Asen II besegrar och tillfångatar Theodoros vid Klokotnitsa och tar Thrakien, Makedonien och Albanien. Theodoros bror Manuel behåller Thessaloniki som bulgarisk vasall.
  Kayqubad I defeats the Khwarazmshah Jalal al-Din at Yassıçemen and takes Ahlat and the Lake Van region.: Kayqubad I besegrar khwarazmshahen Jalal al-Din vid Yassıçemen och tar Ahlat och området kring Vansjön.
  Alfonso IX dies; his son Ferdinand III of Castile inherits León, and the two crowns are joined for good.: Alfons IX dör; hans son Ferdinand III av Kastilien ärver León, och de två kronorna förenas för gott.
  About 1230–1233. Hungary organises the Banate of Severin in Oltenia.: Omkring 1230–1233. Ungern organiserar banatet Severin i Oltenien.
  James I takes Burriana and Peñíscola, beginning the conquest of Valencia.: Jakob I intar Burriana och Peñíscola och inleder erövringen av Valencia.
  Rum takes Harput from the Artuqids.: Rum tar Harput från artuqiderna.
  Ibn Mahfuz rules Niebla and the Algarve as an independent taifa.: Ibn Mahfuz styr Niebla och Algarve som en självständig taifa.
  Nicaea takes Nicomedia and the Asian shore of the Bosporus.: Nicaea intar Nikomedia och Bosporens asiatiska strand.
  Nicaea, allied with Bulgaria against the Latins, takes Gallipoli and the Thracian coast.: Nicaea, allierat med Bulgarien mot latinerna, intar Gallipoli och den thrakiska kusten.
  Richard de Burgh conquers Connacht; the O’Conor kings keep only the “King’s cantreds” around Roscommon.: Richard de Burgh erövrar Connacht; O’Conor-kungarna behåller endast ”kungens cantreds” kring Roscommon.
  The Mongols conquer Volga Bulgaria and destroy its cities.: Mongolerna erövrar Volgabulgarien och förstör dess städer.
  Ferdinand III takes Córdoba.: Ferdinand III intar Córdoba.
  Muhammad ibn al-Ahmar, founder of the Nasrid dynasty, enters Granada; Málaga and Almería accept him. Portugal takes Mértola and the land around Beja.: Muhammad ibn al-Ahmar, grundare av nasriddynastin, tågar in i Granada; Málaga och Almería erkänner honom. Portugal intar Mértola och landet kring Beja.
  Treaty of Stensby. The Teutonic Order returns northern Estonia to Denmark.: Fördraget i Stensby. Tyska orden återlämnar norra Estland till Danmark.
  Zayyan surrenders Valencia to James I.: Zayyan överlämnar Valencia till Jakob I.
  Batu's armies defeat the Cumans and take the steppe from the Dniester to the Volga.: Batus arméer besegrar kumanerna och tar stäppen från Dnjestr till Volga.
  Starting state. The Holy Roman Empire is drawn as one polity until 1500; Bohemia and Moravia are a kingdom of the Empire with their own ruler, and the Burgenland belongs to Hungary.: Utgångsläge. Tysk-romerska riket ritas som en enda stat fram till 1500; Böhmen och Mähren är ett kungarike inom riket med egen härskare, och Burgenland hör till Ungern.
  Sweden at War border state “1240”: Gränsläge ”1240” från Sweden at War
  Treaties made during the crusade of Theobald of Champagne and Richard of Cornwall (1239–1241) return Ascalon, Beaufort and much of Galilee to the kingdom.: Fördrag som slöts under Theobald av Champagnes och Rikard av Cornwalls korståg (1239–1241) återlämnar Askalon, Beaufort och stora delar av Galileen till kungariket.
  After the Mongol invasion of 1241–1242, the steppe east of the Carpathians and the Wallachian plain come under the Golden Horde.: Efter mongolernas invasion 1241–1242 kommer stäppen öster om Karpaterna och den valakiska slätten under Gyllene horden.
  Batu founds his capital at Sarai on the lower Volga. The western part of the Mongol Empire becomes the Golden Horde (the Ulus of Jochi), and the Rus' princes rule as its tributaries.: Batu grundar sin huvudstad Saraj vid nedre Volga. Mongolrikets västra del blir Gyllene horden (Jochis ulus), och de ryska furstarna styr som dess skattskyldiga.
  Treaty of Alcaraz. The taifa of Murcia submits to Castile.: Fördraget i Alcaraz. Taifan Murcia underkastar sig Kastilien.
  Battle of Köse Dağ. The Mongols defeat Kaykhusraw II; Rum becomes a Mongol vassal and the east comes under the Mongols, from 1256 the Ilkhanate.: Slaget vid Köse Dağ. Mongolerna besegrar Kaykhusraw II; Rum blir en mongolisk vasall och öster kommer under mongolerna, från 1256 Ilkhanatet.
  Khwarazmian troops in Ayyubid service sack Jerusalem; it never returns to crusader rule.: Khwarazmiska trupper i ayyubidisk tjänst plundrar Jerusalem; staden återgår aldrig till korsfararnas styre.
  James I takes Biar, completing the conquest of the Kingdom of Valencia to the line agreed at Almizra.: Jakob I intar Biar och fullbordar erövringen av kungariket Valencia fram till den linje som avtalats i Almizra.
  Pact of Jaén. Muhammad I surrenders Jaén and becomes Ferdinand III’s vassal.: Pakten i Jaén. Muhammad I överlämnar Jaén och blir Ferdinand III:s vasall.
  John III Vatatzes takes Thessalonica and, after the death of the young tsar Koloman, the Bulgarian lands in Thrace and Macedonia.: Johannes III Vatatzes intar Thessaloniki och, efter den unge tsar Kolomans död, de bulgariska länderna i Thrakien och Makedonien.
  Béla IV organises the Banate of Macsó south of the Sava; Belgrade is Hungarian too.: Béla IV organiserar banatet Macsó söder om Sava; även Belgrad är ungerskt.
  Tver becomes a principality of its own under Yaroslav Yaroslavich, Alexander Nevsky's brother.: Tver blir ett eget furstendöme under Jaroslav Jaroslavitj, Aleksandr Nevskijs bror.
  The Ayyubids take Ascalon.: Ayyubiderna intar Askalon.
  Seville surrenders to Ferdinand III after a sixteen-month siege.: Sevilla kapitulerar för Ferdinand III efter en sexton månader lång belägring.
  Afonso III of Portugal takes Faro and completes the conquest of the Algarve.: Afonso III av Portugal intar Faro och fullbordar erövringen av Algarve.
  Sweden at War border state “1250”: Gränsläge ”1250” från Sweden at War
  Mamluk officers murder Sultan Turanshah; the Mamluks take power in Egypt.: Mamlukofficerare mördar sultan Turanshah; mamlukerna tar makten i Egypten.
  Emperor Frederick II dies; the counts of Gorizia rule the upper Soča valley and the Karst as their own county.: Kejsar Fredrik II dör; grevarna av Görz styr övre Sočadalen och Karst som sitt eget grevskap.
  "Emperor Frederick II dies and imperial power in Italy collapses. North and central Italy are a patchwork of city-states and lordships: Milan, Florence, Siena, Lucca, Genoa, Pisa and Venice, the Este at Ferrara, Savoy, Montferrat, the Patriarchate of Aquileia and many smaller communes.": "Kejsar Fredrik II dör och den kejserliga makten i Italien kollapsar. Norra och mellersta Italien är ett lapptäcke av stadsstater och herradömen: Milano, Florens, Siena, Lucca, Genua, Pisa och Venedig, ätten Este i Ferrara, Savojen, Montferrat, patriarkatet Aquileia och många mindre kommuner."
  After the Babenberg line dies out, Ottokar of Bohemia takes the duchy of Austria.: Sedan den babenbergska ätten dött ut tar Ottokar av Böhmen hertigdömet Österrike.
  The Livonian Order founds Memel castle (Klaipėda). The Memel land stays with the Order and its successors until 1920.: Livländska orden grundar borgen Memel (Klaipėda). Memellandet stannar hos orden och dess efterföljare fram till 1920.
  Pisa and its allies destroy the Judicate of Cagliari.: Pisa och dess allierade förstör judikatet Cagliari.
  The Ilkhan Hülegü takes Upper Mesopotamia; the Mamluks, victorious at Ain Jalut, hold the land west of the Euphrates.: Ilkhanen Hülegü intar övre Mesopotamien; mamlukerna, segrare vid Ain Jalut, behärskar landet väster om Eufrat.
  Peter of Savoy completes his conquest of the Vaud.: Peter av Savojen fullbordar erövringen av Vaud.
  Bohemond VI of Antioch and Tripoli, allied with the Mongols, recovers Latakia.: Bohemund VI av Antiochia och Tripoli, allierad med mongolerna, återtar Latakia.
  The Mamluks defeat the Mongols at Ain Jalut and take over Ayyubid Syria; Kerak follows in 1263. The Jazira east of the Euphrates stays Mongol.: Mamlukerna besegrar mongolerna vid Ain Jalut och tar över det ayyubidiska Syrien; Kerak följer 1263. Jazira öster om Eufrat förblir mongoliskt.
  Peace of Vienna. Béla IV of Hungary gives up Styria to Ottokar II of Bohemia.: Freden i Wien. Béla IV av Ungern avstår Steiermark till Ottokar II av Böhmen.
  Peace of Vienna after Kressenbrunn. Béla IV of Hungary gives up Styria to Ottokar.: Freden i Wien efter Kressenbrunn. Béla IV av Ungern avstår Steiermark till Ottokar.
  Alexios Strategopoulos retakes Constantinople for Michael VIII Palaiologos; the Latin Empire ends.: Alexios Strategopoulos återtar Konstantinopel åt Mikael VIII Palaiologos; Latinska kejsardömet upphör.
  Old Covenant. The Icelanders accept the king of Norway.: Gamla fördraget. Islänningarna erkänner Norges kung.
  Alfonso X of Castile takes Niebla and Cádiz.: Alfons X av Kastilien intar Niebla och Cádiz.
  Mastino I della Scala is elected captain of the people of Verona.: Mastino I della Scala väljs till folkets kapten i Verona.
  Baybars takes Caesarea, Haifa and Arsuf.: Baybars intar Caesarea, Haifa och Arsuf.
  Treaty of Perth. After the Battle of Largs, Norway cedes the Hebrides and Man to Scotland and keeps Orkney and Shetland.: Fördraget i Perth. Efter slaget vid Largs avträder Norge Hebriderna och Isle of Man till Skottland och behåller Orkney och Shetland.
  By the Treaty of Viterbo, Charles of Anjou gains Corfu.: Genom fördraget i Viterbo får Karl av Anjou Korfu.
  Poreč submits to Venice (1267), the first of the Istrian coastal towns; Pula follows in 1331. Inner Istria stays with the counts of Gorizia and later the Habsburgs.: Poreč underkastar sig Venedig (1267), den första av de istriska kuststäderna; Pula följer 1331. Inre Istrien stannar hos grevarna av Görz och senare habsburgarna.
  Gilbert de Clare seizes the upland lordship of Senghenydd and begins Caerphilly Castle; the hills of Glamorgan and Gwent come under the Marcher lords.: Gilbert de Clare erövrar höglandsherradömet Senghenydd och påbörjar Caerphilly Castle; bergen i Glamorgan och Gwent kommer under marcher-herrarna.
  Baybars takes Jaffa.: Baybars intar Jaffa.
  Baybars takes Beaufort.: Baybars intar Beaufort.
  The Marinids, having taken Marrakesh, rule Morocco with its ports.: Mariniderna, som har intagit Marrakech, härskar över Marocko med dess hamnar.
  Ottokar II inherits Carniola and Carinthia from Duke Ulrich III.: Ottokar II ärver Krain och Kärnten från hertig Ulrik III.
  Ottokar inherits Carinthia and Carniola under the will of Duke Ulrich III.: Ottokar ärver Kärnten och Krain enligt hertig Ulrik III:s testamente.
  Alphonse of Poitiers, count of Toulouse by marriage to Raymond VII’s daughter, dies without heirs. The county of Toulouse passes to the French crown.: Alfons av Poitiers, greve av Toulouse genom giftermål med Raimond VII:s dotter, dör utan arvingar. Grevskapet Toulouse övergår till den franska kronan.
  Count Philip of Savoy acquires Bresse through his marriage to the heiress of Bâgé.: Greve Filip av Savojen förvärvar Bresse genom sitt giftermål med arvtagerskan till Bâgé.
  Charles of Anjou proclaims himself king of Albania at Durrës.: Karl av Anjou utropar sig till kung av Albanien i Durrës.
  Philip III hands the Comtat Venaissin to the papacy, as the Treaty of Paris of 1229 had promised. (The city of Avignon follows in 1348.): Filip III överlämnar Comtat Venaissin till påvestolen, så som fördraget i Paris 1229 hade utlovat. (Staden Avignon följer 1348.)
  Edward I grants Thomond (Clare) to Thomas de Clare.: Edvard I förlänar Thomond (Clare) till Thomas de Clare.
  James I of Aragon dies; Roussillon and Cerdagne pass with the Balearics to the Kingdom of Majorca under his younger son James II.: Jakob I av Aragonien dör; Roussillon och Cerdagne övergår tillsammans med Balearerna till kungariket Mallorca under hans yngre son Jakob II.
  James I dies. His younger son James II rules the Kingdom of Majorca (Mallorca, Ibiza, Roussillon and Montpellier, with overlordship of Muslim Menorca) under Aragonese suzerainty.: Jakob I dör. Hans yngre son Jakob II styr kungariket Mallorca (Mallorca, Ibiza, Roussillon och Montpellier, med överhöghet över det muslimska Menorca) under aragonisk överhöghet.
  Treaty of Vienna. Ottokar gives up Austria, Styria, Carinthia and Carniola to King Rudolf of Habsburg.: Fördraget i Wien. Ottokar avstår Österrike, Steiermark, Kärnten och Krain till kung Rudolf av Habsburg.
  Treaty of Aberconwy. After Edward I’s first Welsh war, Llywelyn ap Gruffudd is left only Gwynedd west of the Conwy; the Perfeddwlad (the land between the Conwy and the Dee), Powys and the south-west pass to the English crown and its allies.: Fördraget i Aberconwy. Efter Edvard I:s första walesiska krig får Llywelyn ap Gruffudd behålla endast Gwynedd väster om Conwy; Perfeddwlad (landet mellan Conwy och Dee), Powys och sydväst övergår till den engelska kronan och dess allierade.
  Rudolf of Habsburg recognises papal rule over Romagna and Bologna.: Rudolf av Habsburg erkänner påvligt styre över Romagna och Bologna.
  The first paréage makes the bishop of Urgell and the count of Foix joint lords of Andorra.: Den första paréagen gör biskopen av Urgell och greven av Foix till gemensamma herrar över Andorra.
  historical-basemaps world_1279 (automatic draft, partly hand-corrected): historical-basemaps world_1279 (automatiskt utkast, delvis handkorrigerat)
  Koper (Capodistria) submits to Venice; Izola and Piran follow by 1283.: Koper (Capodistria) underkastar sig Venedig; Izola och Piran följer till 1283.
  Treaty of Amiens. Philip III gives the Agenais to Edward I, as the Treaty of Paris of 1259 had promised.: Fördraget i Amiens. Filip III ger Agenais till Edvard I, så som fördraget i Paris 1259 hade utlovat.
  Thomas III of Savoy takes Turin.: Tomas III av Savojen intar Turin.
  Byzantium defeats the Angevins at Berat and holds central and southern Albania.: Bysans besegrar angevinerna vid Berat och behärskar mellersta och södra Albanien.
  Stefan Uroš II Milutin of Serbia takes Skopje and northern Macedonia, and Niš.: Stefan Uroš II Milutin av Serbien intar Skopje och norra Makedonien samt Niš.
  The Sicilian Vespers. Peter III of Aragon lands at Trapani and is acclaimed king of Sicily; Charles of Anjou keeps the mainland, called the Kingdom of Naples.: Den sicilianska vespern. Peter III av Aragonien landstiger i Trapani och hyllas som kung av Sicilien; Karl av Anjou behåller fastlandet, kallat kungariket Neapel.
  Rudolf enfeoffs his sons with Austria and Styria; Styria stays with the Habsburgs.: Rudolf förlänar sina söner Österrike och Steiermark; Steiermark stannar hos habsburgarna.
  Rudolf enfeoffs his sons with Austria and Styria, the start of Habsburg rule there.: Rudolf förlänar sina söner Österrike och Steiermark, början på det habsburgska styret där.
  Llywelyn’s brother Dafydd is captured. Edward I completes the conquest of Wales, which the Statute of Rhuddlan (1284) annexes to the English crown.: Llywelyns bror Dafydd tillfångatas. Edvard I fullbordar erövringen av Wales, som genom Rhuddlanstadgan (1284) införlivas med den engelska kronan.
  Stefan Dragutin, who abdicated the Serbian throne, receives Belgrade and Mačva from Hungary.: Stefan Dragutin, som abdikerat från den serbiska tronen, får Belgrad och Mačva av Ungern.
  Battle of Meloria. Genoa destroys the Pisan fleet; Pisa gives up Corsica, which passes to Genoa.: Slaget vid Meloria. Genua förintar den pisanska flottan; Pisa avstår Korsika, som övergår till Genua.
  In the Aragonese Crusade, James II of Majorca sided with France; his nephew Alfonso III of Aragon conquers Mallorca (November 1285) and Ibiza.: I det aragoniska korståget tog Jakob II av Mallorca Frankrikes parti; hans brorson Alfons III av Aragonien erövrar Mallorca (november 1285) och Ibiza.
  Alfonso III of Aragon conquers Menorca and expels or enslaves its Muslim population.: Alfons III av Aragonien erövrar Menorca och fördriver eller förslavar dess muslimska befolkning.
  Sultan Qalawun takes Latakia.: Sultan Qalawun intar Latakia.
  Pisa takes Gallura.: Pisa intar Gallura.
  Qalawun takes Tripoli; the County of Tripoli ends.: Qalawun intar Tripoli; grevskapet Tripoli upphör.
  Dragutin and Milutin take Braničevo from the Bulgarian lords Darman and Kudelin.: Dragutin och Milutin tar Braničevo från de bulgariska stormännen Darman och Kudelin.
  Al-Ashraf Khalil takes Acre; Tyre, Sidon, Beirut, Haifa, Tortosa and Athlit are abandoned or surrender by August.: Al-Ashraf Khalil intar Akko; Tyros, Sidon, Beirut, Haifa, Tortosa och Athlit överges eller kapitulerar före augusti.
  Uri, Schwyz and Unterwalden renew their alliance, the traditional founding of the Swiss Confederacy.: Uri, Schwyz och Unterwalden förnyar sitt förbund, den traditionella grundläggningen av Schweiziska edsförbundet.
  Sweden at War border state “1293”: Gränsläge ”1293” från Sweden at War
  James II of Aragon occupies the Kingdom of Murcia.: Jakob II av Aragonien besätter kungariket Murcia.
  Treaty of Alcañices. Castile cedes Olivenza and the Riba-Côa to Portugal.: Fördraget i Alcañices. Kastilien avträder Olivenza och Riba-Côa till Portugal.
  The Mamluks take Marash from Armenian Cilicia.: Mamlukerna tar Marash från det armeniska Kilikien.
  Under the terms of the treaty of Anagni (1295), James II of Aragon restores the Balearics to James II of Majorca.: Enligt villkoren i fördraget i Anagni (1295) återlämnar Jakob II av Aragonien Balearerna till Jakob II av Mallorca.
  historical-basemaps world_1300 (automatic draft, partly hand-corrected): historical-basemaps world_1300 (automatiskt utkast, delvis handkorrigerat)
  About 1300. Seljuk Rum has dissolved into Turkish emirates (beyliks), among them Osman’s on the Byzantine frontier in Bithynia and the Karamanids in the Taurus; Ilkhanid governors rule central and eastern Anatolia. The emirates overrun most of Byzantine Asia Minor in the next decades.: Omkring 1300. Seldjukernas Rum har upplösts i turkiska emirat (beylikat), bland dem Osmans vid den bysantinska gränsen i Bitynien och karamaniderna i Taurus; ilkhanidiska guvernörer styr centrala och östra Anatolien. Emiraten erövrar större delen av det bysantinska Mindre Asien under de följande decennierna.
  Treaty of Torrellas. Aragon returns Murcia to Castile but keeps Alicante, Elche and Orihuela.: Fördraget i Torrellas. Aragonien återlämnar Murcia till Kastilien men behåller Alicante, Elche och Orihuela.
  The last Seljuk sultan of Rum dies; the Karamanids take Konya.: Den siste seldjukiske sultanen av Rum dör; karamaniderna intar Konya.
  The bishop of Viviers accepts French sovereignty over the Vivarais.: Biskopen av Viviers erkänner fransk överhöghet över Vivarais.
  The Teutonic Order seizes Danzig, and Pomerelia within a year. Brandenburg sells its claims at Soldin (1309); Poland recognises the loss at Kalisz (1343).: Tyska orden erövrar Danzig, och Pomerellen inom ett år. Brandenburg säljer sina anspråk i Soldin (1309); Polen erkänner förlusten i Kalisz (1343).
  The Knights Hospitaller complete their conquest of Rhodes and make it the seat of their order.: Johanniterorden fullbordar erövringen av Rhodos och gör ön till ordens säte.
  Cangrande della Scala takes Vicenza.: Cangrande della Scala intar Vicenza.
  Treaty of Vienne. Lyon passes from the Empire to the kingdom of France.: Fördraget i Vienne. Lyon övergår från riket till kungariket Frankrike.
  Treaty of Pontoise. Flanders hands over Lille, Douai and Orchies (Walloon Flanders), ceded at Athis-sur-Orge in 1305.: Fördraget i Pontoise. Flandern överlämnar Lille, Douai och Orchies (vallonska Flandern), som avträtts i Athis-sur-Orge 1305.
  Saruhan Bey takes Magnesia (Manisa).: Saruhan Bey intar Magnesia (Manisa).
  The Mamluks take Malatya.: Mamlukerna intar Malatya.
  The emirs of Aydın take the citadel of Smyrna; the harbour castle follows in 1329.: Emirerna av Aydin intar citadellet i Smyrna; hamnborgen följer 1329.
  Jacopo I da Carrara becomes lord of Padua.: Jacopo I da Carrara blir herre över Padua.
  Battle of Dysert O’Dea. The O’Briens destroy the de Clare lordship of Thomond.: Slaget vid Dysert O’Dea. O’Brien-ätten förintar de Clares herradöme Thomond.
  Charles I of Hungary retakes Belgrade and Mačva from Dragutin’s son.: Karl I av Ungern återtar Belgrad och Mačva från Dragutins son.
  About 1320. The Byzantine Despotate of the Morea, based at Mystras since 1262, takes most of Arcadia and holds the larger part of the Peloponnese outside Achaea’s north-west and the Venetian ports.: Omkring 1320. Det bysantinska despotatet Morea, med säte i Mystras sedan 1262, tar större delen av Arkadien och behärskar huvuddelen av Peloponnesos utanför Achaias nordvästra del och de venetianska hamnarna.
  Emperor Louis IV pledges the Egerland to John of Bohemia.: Kejsar Ludvig IV pantsätter Egerland till Johan av Böhmen.
  Sweden at War border state “1323”: Gränsläge ”1323” från Sweden at War
  Pisa surrenders Cagliari to the Infante Alfonso of Aragon; the Aragonese Kingdom of Sardinia holds the south and the north, Arborea the centre-west.: Pisa överlämnar Cagliari till infanten Alfons av Aragonien; det aragoniska kungariket Sardinien behärskar södra och norra delen, Arborea den centrala västra delen.
  After the War of Saint-Sardos, Charles IV keeps the Agenais, which his army occupied in 1324.: Efter kriget vid Saint-Sardos behåller Karl IV Agenais, som hans armé besatte 1324.
  Wizlaw III, the last prince of Rügen, dies. The principality passes to the dukes of Pomerania.: Wizlaw III, den siste fursten av Rügen, dör. Furstendömet övergår till hertigarna av Pommern.
  Ban Stephen II Kotromanić of Bosnia takes Hum (Zachlumia) from Serbia, and the Tropolje around Livno.: Ban Stefan II Kotromanić av Bosnien tar Hum (Zachlumien) från Serbien, och Tropolje kring Livno.
  Orhan takes Bursa after a long blockade and makes it the Ottoman capital.: Orhan intar Bursa efter en lång blockad och gör staden till osmansk huvudstad.
  Luigi Gonzaga seizes Mantua.: Luigi Gonzaga tar makten i Mantua.
  Cangrande della Scala takes Padua.: Cangrande della Scala intar Padua.
  With Görlitz, all of Upper Lusatia is under the Bohemian crown (Bautzen since 1319).: I och med Görlitz ligger hela Oberlausitz under den böhmiska kronan (Bautzen sedan 1319).
  Cangrande takes Treviso, shortly before his death.: Cangrande intar Treviso, kort före sin död.
  The Teutonic Order occupies Dobrzyń Land, and Kuyavia in 1332.: Tyska orden besätter Dobrzyńlandet, och Kujavien 1332.
  Battle of Posada. Basarab I of Wallachia defeats King Charles I of Hungary; Wallachia is independent.: Slaget vid Posada. Basarab I av Valakiet besegrar kung Karl I av Ungern; Valakiet är självständigt.
  Orhan takes Nicaea (İznik).: Orhan intar Nicaea (İznik).
  Sweden at War border state “1332”: Gränsläge ”1332” från Sweden at War
  Lucerne joins the three forest cantons.: Luzern ansluter sig till de tre skogskantonerna.
  Andronikos III takes Thessaly after the death of its ruler Stephen Gabrielopoulos.: Andronikos III tar Thessalien efter dess härskare Stefan Gabrielopoulos död.
  Edward III grants Man to William Montagu; the island stays under the English crown.: Edvard III förlänar Isle of Man till William Montagu; ön stannar under den engelska kronan.
  William de Burgh, earl of Ulster, is murdered. The earldom collapses outside Carrickfergus, the Ards and Lecale, and the de Burghs of Connacht become Gaelic-style lords independent of the crown.: William de Burgh, earl av Ulster, mördas. Grevskapet bryter samman utanför Carrickfergus, Ards och Lecale, och de Burgh-ätten i Connacht blir herrar på gaeliskt vis, oberoende av kronan.
  Azzone Visconti rules Bergamo, Como, Lodi, Cremona, Novara, Vercelli and Piacenza; Brescia follows in 1337.: Azzone Visconti härskar över Bergamo, Como, Lodi, Cremona, Novara, Vercelli och Piacenza; Brescia följer 1337.
  Emperor Louis IV enfeoffs the Habsburgs with Carinthia and Carniola.: Kejsar Ludvig IV förlänar habsburgarna Kärnten och Krain.
  The Ilkhan Abu Said dies and the Ilkhanate breaks up. Eretna, its former governor, rules central Anatolia from Sivas and Kayseri; Turkmen and Kurdish lords hold the east.: Ilkhanen Abu Said dör och Ilkhanatet bryts upp. Eretna, dess tidigare guvernör, härskar över centrala Anatolien från Sivas och Kayseri; turkmeniska och kurdiska herrar behärskar öster.
  Obizzo III d’Este becomes lord of Modena.: Obizzo III d’Este blir herre över Modena.
  Orhan takes Nicomedia and the shore of the Bosporus. In the south-east, the Dulkadirids found an emirate at Elbistan and Marash.: Orhan intar Nikomedia och Bosporens strand. I sydost grundar dulkadiriderna ett emirat i Elbistan och Marash.
  The Carraresi recover Padua from the Scaligeri.: Carrara-ätten återtar Padua från Scaligeri.
  Peace of Venice. Venice receives Treviso, its first mainland territory.: Freden i Venedig. Venedig får Treviso, sitt första område på fastlandet.
  Andronikos III annexes Epirus (1338–1340).: Andronikos III annekterar Epirus (1338–1340).
  Asti accepts Visconti lordship.: Asti erkänner Viscontis herravälde.
  Stefan Dušan of Serbia takes the rest of Macedonia and most of Albania (1342–1345), taking advantage of the Byzantine civil war.: Stefan Dušan av Serbien tar resten av Makedonien och större delen av Albanien (1342–1345) och utnyttjar då det bysantinska inbördeskriget.
  Peter IV of Aragon conquers the Kingdom of Majorca and joins it to the Crown.: Peter IV av Aragonien erövrar kungariket Mallorca och förenar det med kronan.
  Treaty of Kalisz. The Order returns Dobrzyń Land and Kuyavia to Poland and keeps Pomerelia and Chełmno Land.: Fördraget i Kalisz. Orden återlämnar Dobrzyńlandet och Kujavien till Polen och behåller Pomerellen och Chełmnolandet.
  Anna of Savoy, regent in Constantinople, cedes Philippopolis and the upper Maritsa valley to Tsar Ivan Alexander of Bulgaria for his help in the civil war.: Anna av Savojen, regent i Konstantinopel, avträder Filippopolis och övre Maritsadalen till tsar Ivan Alexander av Bulgarien som tack för hans hjälp i inbördeskriget.
  Peter IV of Aragon, having taken Mallorca in 1343, reunites Roussillon with the Crown of Aragon.: Peter IV av Aragonien, som intog Mallorca 1343, återförenar Roussillon med Aragoniska kronan.
  Orhan annexes the emirate of Karasi (1345–1357), which reaches the Dardanelles.: Orhan annekterar emiratet Karasi (1345–1357), som når fram till Dardanellerna.
  Dušan takes Serres; Mount Athos accepts his rule. In 1346 he is crowned emperor.: Dušan intar Serres; berget Athos erkänner hans styre. År 1346 kröns han till kejsare.
  Luchino Visconti buys Parma.: Luchino Visconti köper Parma.
  Calais surrenders to Edward III after an eleven-month siege. It stays English for 211 years.: Calais kapitulerar för Edvard III efter en elva månader lång belägring. Staden förblir engelsk i 211 år.
  Gaston Fébus, count of Foix, declares that he holds Béarn from God alone and from no king.: Gaston Fébus, greve av Foix, förklarar att han innehar Béarn av Gud allena och inte av någon kung.
  Dušan’s commanders take Thessaly and Epirus (1347–1348).: Dušans befälhavare intar Thessalien och Epirus (1347–1348).
  Alessandria passes to the Visconti.: Alessandria övergår till Visconti.
  Treaty of Bolotovo. Novgorod recognises the independence of Pskov.: Fördraget i Bolotovo. Novgorod erkänner Pskovs självständighet.
  Treaty of Romans. The last dauphin, Humbert II, sells the Dauphiné to the heir of the French crown.: Fördraget i Romans. Den siste dauphinen, Humbert II, säljer Dauphiné till den franske tronarvingen.
  Archbishop Giovanni Visconti buys Bologna from the Pepoli.: Ärkebiskop Giovanni Visconti köper Bologna av ätten Pepoli.
  Florence buys Prato from the Angevins of Naples.: Florens köper Prato av angevinerna i Neapel.
  Zürich joins the Confederacy.: Zürich ansluter sig till edsförbundet.
  Glarus (4 June) and Zug (27 June) join the Confederacy.: Glarus (4 juni) och Zug (27 juni) ansluter sig till edsförbundet.
  Peace of Brandenburg. The Confederates must return Glarus and Zug to Habsburg rule, though both stay allied to them.: Freden i Brandenburg. Edsförbundet måste återlämna Glarus och Zug till habsburgskt styre, men båda förblir allierade med det.
  Bern joins the Confederacy.: Bern ansluter sig till edsförbundet.
  The Ottomans take Ankara.: Osmanerna intar Ankara.
  An earthquake ruins the walls of Gallipoli; Süleyman Pasha’s Ottoman troops occupy the town, their first foothold in Europe.: En jordbävning raserar Gallipolis murar; Süleyman paschas osmanska trupper besätter staden, deras första fotfäste i Europa.
  Stefan Dušan dies. His empire breaks up; in Albania local families rule their own principalities.: Stefan Dušan dör. Hans rike faller sönder; i Albanien styr lokala släkter sina egna furstendömen.
  About 1356. Ivan Alexander’s son Ivan Sratsimir rules Vidin as a separate tsardom.: Omkring 1356. Ivan Alexanders son Ivan Sratsimir styr Vidin som ett eget tsardöme.
  Algirdas of Lithuania takes Bryansk.: Algirdas av Litauen intar Brjansk.
  Treaty of Zadar. Venice gives up Dalmatia to Louis I of Hungary; Ragusa accepts Hungarian overlordship and governs itself.: Fördraget i Zadar. Venedig avstår Dalmatien till Ludvig I av Ungern; Ragusa erkänner ungerskt överherradöme och styr sig självt.
  Epirus passes to Serbian and Albanian lords after the death of Nikephoros II; the ruler of Ioannina takes the title of despot.: Epirus övergår till serbiska och albanska stormän efter Nikeforos II:s död; härskaren i Ioannina antar titeln despot.
  Bogdan I, who rebelled against Hungary, rules Moldavia as an independent principality around Baia, Siret and Suceava.: Bogdan I, som gjort uppror mot Ungern, styr Moldavien som ett självständigt furstendöme kring Baia, Siret och Suceava.
  Pavia surrenders to Galeazzo II Visconti.: Pavia kapitulerar för Galeazzo II Visconti.
  Cardinal Albornoz recovers Bologna for the pope.: Kardinal Albornoz återtar Bologna åt påven.
  Sweden at War border state “1360”: Gränsläge ”1360” från Sweden at War
  "Treaty of Brétigny, ratified at Calais. Edward III gives up his claim to the French crown and receives a greatly enlarged Aquitaine in full sovereignty: Poitou, Saintonge, Angoumois, Limousin, Périgord, Quercy, Rouergue, the Agenais, Bigorre and Gaure, as well as Calais and Ponthieu.": "Fördraget i Brétigny, ratificerat i Calais. Edvard III avstår från sitt anspråk på den franska kronan och får ett kraftigt utvidgat Aquitanien med full suveränitet: Poitou, Saintonge, Angoumois, Limousin, Périgord, Quercy, Rouergue, Agenais, Bigorre och Gaure, samt Calais och Ponthieu."
  About 1362. The Balšić family rules Zeta independently of the Serbian emperor.: Omkring 1362. Ätten Balšić styr Zeta oberoende av den serbiske kejsaren.
  After the Battle of Blue Waters, Lithuania takes Kiev and the Seversk lands; the Upper Oka princes become Lithuanian vassals.: Efter slaget vid Blå vattnen tar Litauen Kiev och Severien; furstarna vid övre Oka blir litauiska vasaller.
  After the Battle of Blue Waters, Lithuania takes Podolia from the Golden Horde.: Efter slaget vid Blå vattnen tar Litauen Podolien från Gyllene horden.
  Margaret of Tyrol hands the county of Tyrol to Rudolf IV of Austria.: Margareta av Tyrolen överlämnar grevskapet Tyrolen till Rudolf IV av Österrike.
  John II grants the duchy of Burgundy to his youngest son, Philip the Bold. The Valois dukes of Burgundy will build a state of their own.: Johan II förlänar hertigdömet Burgund till sin yngste son, Filip den djärve. Valoishertigarna av Burgund ska bygga upp en egen stat.
  Schwyz takes Zug back from the Habsburgs; it rejoins the Confederacy.: Schwyz tar tillbaka Zug från habsburgarna; Zug återinträder i edsförbundet.
  Amadeus VI of Savoy takes Gallipoli from the Ottomans and hands it to Byzantium.: Amadeus VI av Savojen tar Gallipoli från osmanerna och överlämnar staden till Bysans.
  Karl Thopia takes Durrës from the Angevins.: Karl Thopia tar Durrës från angevinerna.
  Charles IV completes the purchase of Lower Lusatia for the Bohemian crown.: Karl IV fullbordar köpet av Niederlausitz till den böhmiska kronan.
  Mariano IV of Arborea, at war with Aragon, overruns most of Sardinia; Aragon holds only Cagliari and Alghero.: Mariano IV av Arborea, i krig med Aragonien, erövrar större delen av Sardinien; Aragonien behåller endast Cagliari och Alghero.
  Murad I takes Adrianople (at some point between 1361 and 1369), which becomes the Ottoman capital, and Philippopolis (about 1363).: Murad I intar Adrianopel (någon gång mellan 1361 och 1369), som blir osmansk huvudstad, och Filippopolis (omkring 1363).
  Philip the Bold marries Margaret, heiress of Flanders. As part of the settlement Charles V returns Walloon Flanders to her father.: Filip den djärve gifter sig med Margareta, arvtagerskan till Flandern. Som en del av uppgörelsen återlämnar Karl V vallonska Flandern till hennes far.
  Charles V confiscates Aquitaine after the Gascon lords appeal to him against the Black Prince. Rouergue, Quercy, the Agenais, Armagnac and Bigorre go over to France within months.: Karl V konfiskerar Aquitanien sedan de gaskognska stormännen vädjat till honom mot Svarte prinsen. Rouergue, Quercy, Agenais, Armagnac och Bigorre går över till Frankrike inom några månader.
  Battle of the Maritsa. The Ottomans destroy the army of the Serbian lords of Macedonia and take northern Thrace; Tsar Ivan Shishman of Bulgaria and the surviving Serbian lords become Ottoman vassals.: Slaget vid Maritsa. Osmanerna förintar de serbiska stormännens armé i Makedonien och intar norra Thrakien; tsar Ivan Sjisjman av Bulgarien och de överlevande serbiska stormännen blir osmanska vasaller.
  After the death of the Serbian lords at the Maritsa, Manuel Palaiologos retakes Serres and the lower Struma for Byzantium.: Efter de serbiska stormännens död vid Maritsa återtar Manuel Palaiologos Serres och nedre Struma åt Bysans.
  Du Guesclin’s campaigns have recovered Poitou, Saintonge, Angoumois, the Limousin and Périgord. The English hold little more than Bordeaux, Bayonne and Calais.: Du Guesclins fälttåg har återerövrat Poitou, Saintonge, Angoumois, Limousin och Périgord. Engelsmännen behärskar knappt mer än Bordeaux, Bayonne och Calais.
  About 1375. The Kara Koyunlu Turkmen, based north of Lake Van, rule the Armenian highlands.: Omkring 1375. Kara Koyunlu-turkmenerna, med bas norr om Vansjön, härskar över det armeniska höglandet.
  Sis falls to the Mamluks; the Armenian Kingdom of Cilicia ends.: Sis faller till mamlukerna; Armeniska kungariket Kilikien upphör.
  The Habsburgs buy Feldkirch, the first of the Vorarlberg lordships (Bludenz follows in 1394, Bregenz in 1451–1523).: Habsburgarna köper Feldkirch, det första av herradömena i Vorarlberg (Bludenz följer 1394, Bregenz 1451–1523).
  Andronikos IV hands Gallipoli back to Murad I.: Andronikos IV lämnar tillbaka Gallipoli till Murad I.
  Tvrtko I, who took the upper Drina and Lim valleys and Trebinje in 1373, is crowned king of Bosnia.: Tvrtko I, som 1373 tog övre Drina- och Limdalarna samt Trebinje, kröns till kung av Bosnien.
  Biella accepts the lordship of Savoy.: Biella erkänner Savojens herravälde.
  Peace of Turin ends the War of Chioggia; Venice gives Treviso to Duke Leopold III of Austria.: Freden i Turin avslutar Chioggiakriget; Venedig ger Treviso till hertig Leopold III av Österrike.
  About 1382–1385. The Ottomans take Sofia.: Omkring 1382–1385. Osmanerna intar Sofia.
  Cuneo submits to Amadeus VI of Savoy; Trieste places itself under Leopold III of Austria.: Cuneo underkastar sig Amadeus VI av Savojen; Trieste ställer sig under Leopold III av Österrike.
  The Ottomans take Serres; Mount Athos submits.: Osmanerna intar Serres; berget Athos underkastar sig.
  Arezzo submits to Florence; Francesco da Carrara buys Treviso.: Arezzo underkastar sig Florens; Francesco da Carrara köper Treviso.
  Louis of Male, count of Flanders, dies. Philip the Bold and Margaret inherit Flanders, Artois and the Free County of Burgundy.: Ludvig av Male, greve av Flandern, dör. Filip den djärve och Margareta ärver Flandern, Artois och Fria grevskapet Burgund.
  The Ottomans take Niš.: Osmanerna intar Niš.
  Corfu places itself under Venice, which rules it until 1797.: Korfu ställer sig under Venedig, som styr ön till 1797.
  Gian Galeazzo Visconti takes Verona and Vicenza, ending the Scaliger lordship; Asti goes to Louis of Orléans as the dowry of Valentina Visconti.: Gian Galeazzo Visconti intar Verona och Vicenza och gör slut på Scaligeris herravälde; Asti går till Ludvig av Orléans som hemgift för Valentina Visconti.
  Thessalonica surrenders to the Ottomans after a four-year siege.: Thessaloniki kapitulerar för osmanerna efter en fyraårig belägring.
  The men of Glarus defeat the Austrians at Näfels and Glarus is free of Habsburg rule; the peace of 1389 confirms it.: Männen från Glarus besegrar österrikarna vid Näfels och Glarus blir fritt från habsburgskt styre; freden 1389 bekräftar det.
  The Dedition of Nice. Nice and its hinterland leave Provence for the protection of Amadeus VII of Savoy.: Nizzas dedition. Nizza och dess omland lämnar Provence och ställer sig under Amadeus VII av Savojens beskydd.
  Gian Galeazzo takes Padua and Treviso from the Carraresi; he passes Treviso to Venice.: Gian Galeazzo tar Padua och Treviso från Carrara-ätten; han överlämnar Treviso till Venedig.
  Bayezid I annexes the western emirates (Aydın, Saruhan, Menteşe, Germiyan, Hamid and Teke) and takes Philadelphia, the last Byzantine town in Asia Minor.: Bayezid I annekterar de västra emiraten (Aydin, Saruhan, Menteşe, Germiyan, Hamid och Teke) och intar Filadelfia, den sista bysantinska staden i Mindre Asien.
  About 1388–1390. Mircea the Elder of Wallachia takes Dobruja and Silistra.: Omkring 1388–1390. Mircea den äldre av Valakiet tar Dobrudzja och Silistra.
  Francesco Novello da Carrara recovers Padua.: Francesco Novello da Carrara återtar Padua.
  Bayezid I takes Amasya, Samsun and Kastamonu.: Bayezid I intar Amasya, Samsun och Kastamonu.
  "Roman I calls himself ruler of Moldavia “from the mountains to the sea”: Moldavia now reaches the Dniester and the Black Sea at Cetatea Albă.": "Roman I kallar sig härskare över Moldavien ”från bergen till havet”: Moldavien når nu Dnjestr och Svarta havet vid Cetatea Albă."
  Duke Władysław of Opole pawns Dobrzyń Land to the Teutonic Order.: Hertig Władysław av Opole pantsätter Dobrzyńlandet till Tyska orden.
  The Ottomans take Skopje from Vuk Branković.: Osmanerna tar Skopje från Vuk Branković.
  Venice takes over Durrës from the Thopia.: Venedig tar över Durrës från ätten Thopia.
  Tarnovo falls after a three-month siege; Bayezid I annexes the Bulgarian tsardom and occupies Thessaly.: Tarnovo faller efter en tre månader lång belägring; Bayezid I annekterar det bulgariska tsardömet och besätter Thessalien.
  Battle of Rovine. The Ottoman vassals Prince Marko and Konstantin Dejanović fall fighting for Bayezid against Wallachia; their lands in Macedonia are annexed.: Slaget vid Rovine. De osmanska vasallerna prins Marko och Konstantin Dejanović stupar i strid för Bayezid mot Valakiet; deras länder i Makedonien annekteras.
  Gian Galeazzo Visconti is made Duke of Milan; the duchy includes the Ticino valleys.: Gian Galeazzo Visconti blir hertig av Milano; hertigdömet omfattar Ticinodalarna.
  Venice buys Shkodër from the Balšići and holds Lezhë.: Venedig köper Shkodër av ätten Balšić och behärskar Lezhë.
  After the crusaders’ defeat at Nicopolis, Bayezid I annexes the Tsardom of Vidin.: Efter korsfararnas nederlag vid Nikopolis annekterar Bayezid I tsardömet Vidin.
  Bayezid I annexes the emirate of Karaman.: Bayezid I annekterar emiratet Karaman.
  Kalmar Union. Orkney and Shetland follow Norway into union with Denmark.: Kalmarunionen. Orkney och Shetland följer Norge in i unionen med Danmark.
  Kalmar Union. Iceland and the Faroes follow Norway into union with Denmark.: Kalmarunionen. Island och Färöarna följer Norge in i unionen med Danmark.
  Sweden at War border state “1397”: Gränsläge ”1397” från Sweden at War
  Bayezid I takes Sivas and Kayseri after the death of Kadi Burhan al-Din.: Bayezid I intar Sivas och Kayseri efter Kadi Burhan al-Dins död.
  Gian Galeazzo buys Pisa and Livorno; Siena submits to him.: Gian Galeazzo köper Pisa och Livorno; Siena underkastar sig honom.
  Under Vytautas the Grand Duchy of Lithuania reaches the Black Sea between the Dniester and the Dnieper.: Under Vytautas når storfurstendömet Litauen Svarta havet mellan Dnjestr och Dnepr.
  historical-basemaps world_1400 (automatic draft, partly hand-corrected): historical-basemaps world_1400 (automatiskt utkast, delvis handkorrigerat)
  About 1400. Grand Duke Vytautas extends Lithuanian rule over the steppe between the Dniester and the Dnieper.: Omkring 1400. Storfurst Vytautas utsträcker det litauiska styret över stäppen mellan Dnjestr och Dnepr.
  By about 1400 the Gaelic revival has pushed English rule back to the Pale around Dublin, the Butler earldom of Ormond and the towns. Leinster’s mountains belong to the MacMurroughs and O’Byrnes, and the FitzGerald earls of Desmond rule Munster as independent lords.: Omkring 1400 har den gaeliska återhämtningen trängt tillbaka det engelska styret till the Pale kring Dublin, Butlers grevskap Ormond och städerna. Leinsters berg tillhör MacMurrough- och O’Byrne-ätterna, och FitzGerald-ättens earlar av Desmond styr Munster som självständiga herrar.
  Perugia submits to Gian Galeazzo.: Perugia underkastar sig Gian Galeazzo.
  Florence takes direct rule of Pistoia.: Florens tar över det direkta styret av Pistoia.
  After Timur’s campaigns, the Aq Qoyunlu Turkmen hold the upper Jazira.: Efter Timurs fälttåg behärskar Aq Qoyunlu-turkmenerna övre Jazira.
  After the battle of Casalecchio, Gian Galeazzo takes Bologna; he dies of plague on 3 September.: Efter slaget vid Casalecchio intar Gian Galeazzo Bologna; han dör i pest den 3 september.
  Battle of Ankara. Timur defeats and captures Bayezid I and restores the western emirates, Karaman and Kastamonu; the Ottoman princes keep Bithynia and the north. Timur gives the Diyarbakır region to the Aq Qoyunlu Turkmen.: Slaget vid Ankara. Timur besegrar och tillfångatar Bayezid I och återupprättar de västra emiraten, Karaman och Kastamonu; de osmanska prinsarna behåller Bitynien och norr. Timur ger Diyarbakırregionen till Aq Qoyunlu-turkmenerna.
  Treaty of Gallipoli. After the Ottoman defeat at Ankara, Süleyman Çelebi returns Thessalonica and Mount Athos to Byzantium.: Fördraget i Gallipoli. Efter det osmanska nederlaget vid Ankara återlämnar Süleyman Çelebi Thessaloniki och berget Athos till Bysans.
  Bologna and Perugia return to the pope.: Bologna och Perugia återgår till påven.
  Despot Stefan Lazarević of Serbia receives Belgrade and Mačva from King Sigismund.: Despoten Stefan Lazarević av Serbien får Belgrad och Mačva av kung Sigismund.
  Siena throws off Milanese rule. Vicenza, Belluno and Feltre give themselves to Venice.: Siena skakar av sig det milanesiska styret. Vicenza, Belluno och Feltre ger sig till Venedig.
  Peace of Raciąż. Poland and Lithuania confirm the cession of Samogitia to the Teutonic Order (first agreed at Salynas in 1398); Poland buys back Dobrzyń Land.: Freden i Raciąż. Polen och Litauen bekräftar avträdelsen av Samogitien till Tyska orden (först avtalad i Salynas 1398); Polen köper tillbaka Dobrzyńlandet.
  Jean de Béthencourt completes the conquest of Lanzarote and Fuerteventura for Castile.: Jean de Béthencourt fullbordar erövringen av Lanzarote och Fuerteventura åt Kastilien.
  Verona surrenders to Venice.: Verona kapitulerar för Venedig.
  Venice takes Padua; the Carraresi are executed.: Venedig intar Padua; Carrara-ätten avrättas.
  Neuchâtel enters a perpetual alliance with Bern and becomes an associate of the Confederacy.: Neuchâtel ingår ett evigt förbund med Bern och blir associerat med edsförbundet.
  Pisa surrenders to Florence after a long siege.: Pisa kapitulerar för Florens efter en lång belägring.
  Genoa takes Livorno.: Genua intar Livorno.
  The Kara Koyunlu take Mardin from the last Artuqids.: Kara Koyunlu tar Mardin från de sista artuqiderna.
  Niccolò III d’Este takes Reggio.: Niccolò III d’Este intar Reggio.
  Battle of Sanluri. Martin the Younger of Sicily defeats Arborea; Aragon recovers the south of Sardinia.: Slaget vid Sanluri. Martin den yngre av Sicilien besegrar Arborea; Aragonien återtar södra Sardinien.
  Ladislaus of Naples sells Zadar and his rights in Dalmatia to Venice.: Ladislaus av Neapel säljer Zadar och sina rättigheter i Dalmatien till Venedig.
  Kara Yusuf, back from exile, restores Kara Koyunlu rule over the Armenian highlands.: Kara Yusuf, tillbaka från landsflykten, återupprättar Kara Koyunlus styre över det armeniska höglandet.
  Oristano surrenders; Leonardo Cubello holds it as the Marquisate of Oristano under the Crown of Aragon.: Oristano kapitulerar; Leonardo Cubello innehar det som markisatet Oristano under Aragoniska kronan.
  First Peace of Thorn. After Grunwald, Samogitia returns to Lithuania for the lifetimes of Jogaila and Vytautas; the Treaty of Melno (1422) makes it permanent.: Första freden i Thorn. Efter Grunwald återgår Samogitien till Litauen under Jogailas och Vytautas livstid; fördraget i Melno (1422) gör det permanent.
  Appenzell, which had freed itself from the abbot of St. Gallen, becomes an associate of the Confederacy (a full canton in 1513).: Appenzell, som frigjort sig från abboten av S:t Gallen, blir associerat med edsförbundet (fullvärdig kanton 1513).
  At the Emperor’s call the Confederates conquer the Habsburg Aargau and rule it as a subject territory.: På kejsarens uppmaning erövrar edsförbundet det habsburgska Aargau och styr det som ett underlydande område.
  Portugal takes Ceuta.: Portugal intar Ceuta.
  The Ottomans take Dobruja from Wallachia, and Vlorë, Berat and southern Albania (1417–1419).: Osmanerna tar Dobrudzja från Valakiet, samt Vlorë, Berat och södra Albanien (1417–1419).
  The Grimaldi of Genoa take lasting possession of Monaco.: Grimaldi från Genua tar varaktigt Monaco i besittning.
  Rouen surrenders to Henry V after a six-month siege; the English conquest of Normandy is complete.: Rouen kapitulerar för Henrik V efter en sex månader lång belägring; den engelska erövringen av Normandie är fullbordad.
  Venice completes its conquest of Dalmatia (Šibenik 1412, Trogir and Split 1420); Kotor places itself under Venice.: Venedig fullbordar erövringen av Dalmatien (Šibenik 1412, Trogir och Split 1420); Kotor ställer sig under Venedig.
  Portuguese settlers begin to colonise Madeira.: Portugisiska nybyggare börjar kolonisera Madeira.
  Udine surrenders; Venice conquers the Friuli from the Patriarch of Aquileia.: Udine kapitulerar; Venedig erövrar Friuli från patriarken av Aquileia.
  William III of Narbonne, the last judge of Arborea, sells his rights and Sassari to Alfonso V of Aragon.: Vilhelm III av Narbonne, den siste domaren av Arborea, säljer sina rättigheter och Sassari till Alfons V av Aragonien.
  Treaty of Troyes (May 1420). Charles VI disinherits his son and makes Henry V his heir and regent. Henry enters Paris in December; with Burgundian support, the Lancastrians control northern France.: Fördraget i Troyes (maj 1420). Karl VI gör sin son arvlös och utser Henrik V till sin arvinge och regent. Henrik tågar in i Paris i december; med burgundiskt stöd kontrollerar huset Lancaster norra Frankrike.
  Balša III dies; Zeta passes to his uncle, Despot Stefan Lazarević of Serbia.: Balša III dör; Zeta övergår till hans morbror, despoten Stefan Lazarević av Serbien.
  Florence buys Livorno from Genoa.: Florens köper Livorno av Genua.
  Byzantium hands besieged Thessalonica to Venice.: Bysans överlämnar det belägrade Thessaloniki till Venedig.
  Le Mans surrenders to the English, who take Maine.: Le Mans kapitulerar för engelsmännen, som tar Maine.
  Peace of Venice. Filippo Maria Visconti cedes Brescia to Venice.: Freden i Venedig. Filippo Maria Visconti avträder Brescia till Venedig.
  Stefan Lazarević dies; under their agreement Belgrade and Mačva return to Hungary.: Stefan Lazarević dör; enligt deras överenskommelse återgår Belgrad och Mačva till Ungern.
  Filippo Maria Visconti cedes Vercelli to Savoy.: Filippo Maria Visconti avträder Vercelli till Savojen.
  By about 1428 Murad II has annexed the restored western emirates again.: Omkring 1428 har Murad II åter annekterat de återupprättade västra emiraten.
  Peace of Ferrara, after the battle of Maclodio. Venice receives Bergamo.: Freden i Ferrara efter slaget vid Maclodio. Venedig får Bergamo.
  Philip the Good inherits the county of Namur, which he had bought in 1421.: Filip den gode ärver grevskapet Namur, som han hade köpt 1421.
  Charles VII is crowned at Reims after Joan of Arc relieves Orléans. Champagne, Laon, Soissons, Beauvais and Compiègne go over to him.: Karl VII kröns i Reims sedan Jeanne d’Arc undsatt Orléans. Champagne, Laon, Soissons, Beauvais och Compiègne går över till honom.
  Constantine Palaiologos takes Patras; Thomas Palaiologos ends the Principality of Achaea in 1432.: Konstantin Palaiologos intar Patras; Thomas Palaiologos gör slut på furstendömet Achaia 1432.
  Murad II takes Thessalonica by storm.: Murad II stormar Thessaloniki.
  Philip the Good inherits the duchies of Brabant and Limburg.: Filip den gode ärver hertigdömena Brabant och Limburg.
  Ioannina surrenders to the Ottomans; the Tocco keep Arta as vassals.: Ioannina kapitulerar för osmanerna; ätten Tocco behåller Arta som vasaller.
  Portugal begins to settle the Azores.: Portugal börjar kolonisera Azorerna.
  Charles VII’s men take Chartres by surprise.: Karl VII:s män intar Chartres genom en överrumpling.
  Jacqueline of Bavaria gives up Holland, Zeeland and Hainaut to Philip the Good (Treaty of Delft, 1428).: Jakobea av Bayern avstår Holland, Zeeland och Hainaut till Filip den gode (fördraget i Delft, 1428).
  Treaty of Arras. Philip the Good of Burgundy makes peace with Charles VII and receives Auxerre, Mâcon and the towns on the Somme.: Fördraget i Arras. Filip den gode av Burgund sluter fred med Karl VII och får Auxerre, Mâcon och städerna vid Somme.
  Paris opens its gates to Charles VII’s army.: Paris öppnar sina portar för Karl VII:s armé.
  Ulugh Muhammad founds the Khanate of Kazan on the middle Volga.: Ulugh Muhammad grundar Kazankhanatet vid mellersta Volga.
  Murad II takes Smederevo; Despot Đurađ Branković flees to Hungary and Serbia becomes an Ottoman province.: Murad II intar Smederevo; despoten Đurađ Branković flyr till Ungern och Serbien blir en osmansk provins.
  The Nogai Horde breaks away east of the Volga.: Nogajhorden bryter sig loss öster om Volga.
  Hacı I Giray founds the Crimean Khanate.: Hacı I Giray grundar Krimkhanatet.
  Venice takes Ravenna.: Venedig intar Ravenna.
  Antonio Alberico Malaspina rules Massa.: Antonio Alberico Malaspina styr Massa.
  Venice takes Bar, Ulcinj and Budva on the Zeta coast.: Venedig intar Bar, Ulcinj och Budva på Zetakusten.
  Oddantonio da Montefeltro is made Duke of Urbino by Pope Eugene IV.: Oddantonio da Montefeltro görs till hertig av Urbino av påven Eugenius IV.
  Burgundian troops take Luxembourg, which Philip the Good had bought from its duchess.: Burgundiska trupper intar Luxemburg, som Filip den gode hade köpt av dess hertiginna.
  Peace of Szeged. After Hunyadi’s Long Campaign, Murad II restores the Serbian Despotate to Đurađ Branković.: Freden i Szeged. Efter Hunyadis långa fälttåg återställer Murad II det serbiska despotatet till Đurađ Branković.
  Stjepan Vukčić Kosača takes the title “herceg of Saint Sava”; his lands become known as Herzegovina.: Stjepan Vukčić Kosača antar titeln ”herceg av Sankt Sava”; hans länder blir kända som Hercegovina.
  The English hand over Le Mans and Maine, as promised in the truce of Tours.: Engelsmännen överlämnar Le Mans och Maine, så som utlovats i stilleståndet i Tours.
  The Ottomans take Arta.: Osmanerna intar Arta.
  Cherbourg surrenders, four months after Formigny. Normandy is French again.: Cherbourg kapitulerar, fyra månader efter Formigny. Normandie är åter franskt.
  About 1451. Stefan Crnojević rules Upper Zeta between Venice and the Ottomans.: Omkring 1451. Stefan Crnojević styr Övre Zeta mellan Venedig och osmanerna.
  The abbey of St. Gallen allies with the Confederacy (the city follows in 1454).: Klostret S:t Gallen sluter förbund med edsförbundet (staden följer 1454).
  Bayonne surrenders; Gascony falls to France, although Bordeaux briefly returns to English rule in 1452–53.: Bayonne kapitulerar; Gascogne faller till Frankrike, även om Bordeaux en kort tid återgår till engelskt styre 1452–53.
  Mehmed II takes Constantinople; the last emperor, Constantine XI, dies in the fighting.: Mehmed II intar Konstantinopel; den siste kejsaren, Konstantin XI, dör i striderna.
  Bordeaux capitulates after Castillon. Of the English crown’s lands in France only Calais remains.: Bordeaux kapitulerar efter Castillon. Av den engelska kronans länder i Frankrike återstår endast Calais.
  The Ottomans take Novo Brdo and Prizren, and with them Kosovo and the upper Ibar and Lim valleys.: Osmanerna intar Novo Brdo och Prizren, och därmed Kosovo samt övre Ibar- och Limdalarna.
  The Acropolis surrenders to the Ottomans, two years after the city of Athens; the Duchy of Athens ends.: Akropolis kapitulerar för osmanerna, två år efter staden Aten; hertigdömet Aten upphör.
  Smederevo surrenders; the Serbian Despotate ends.: Smederevo kapitulerar; det serbiska despotatet upphör.
  Treaty of Ribe. Christian I becomes Duke of Schleswig and Count of Holstein; Holstein stays an imperial fief.: Fördraget i Ribe. Kristian I blir hertig av Slesvig och greve av Holstein; Holstein förblir ett län under riket.
  Mehmed II conquers the Despotate of the Morea (1460); only the Venetian ports and Monemvasia stay outside Ottoman rule.: Mehmed II erövrar despotatet Morea (1460); endast de venetianska hamnarna och Monemvasia förblir utanför osmanskt styre.
  The Confederates take the Habsburg Thurgau.: Edsförbundet erövrar det habsburgska Thurgau.
  Mehmed II takes Trebizond; the emirate of Kastamonu and Sinope has surrendered earlier in the year.: Mehmed II intar Trapezunt; emiratet Kastamonu och Sinope har kapitulerat tidigare under året.
  Mehmed II takes Lesbos from the Genoese Gattilusio family.: Mehmed II tar Lesbos från den genuesiska släkten Gattilusio.
  Louis XI occupies Roussillon and Cerdagne, pledged to him by John II of Aragon in 1462.: Ludvig XI besätter Roussillon och Cerdagne, som Johan II av Aragonien pantsatt till honom 1462.
  Mehmed II conquers Bosnia; King Stephen Tomašević is executed.: Mehmed II erövrar Bosnien; kung Stefan Tomašević avrättas.
  Louis XI buys back the Somme towns from Philip the Good.: Ludvig XI köper tillbaka Sommestäderna av Filip den gode.
  Matthias Corvinus retakes Jajce and organises the banates of Jajce and Srebrenik along the Sava.: Matthias Corvinus återtar Jajce och organiserar banaten Jajce och Srebrenik längs Sava.
  "Treaty of Conflans after the War of the Public Weal: Louis XI has to return the Somme towns to Burgundy.": "Fördraget i Conflans efter Allmänna väls krig: Ludvig XI måste återlämna Sommestäderna till Burgund."
  By 1466 the Ottomans hold most of Herzegovina; Herceg Novi and the western strongholds hold out.: År 1466 behärskar osmanerna större delen av Hercegovina; Herceg Novi och de västra fästena håller stånd.
  The Khanate of Astrakhan breaks away; what is left of the Golden Horde is called the Great Horde.: Astrachankhanatet bryter sig loss; det som återstår av Gyllene horden kallas Stora horden.
  Second Peace of Thorn. Royal Prussia (Pomerelia with Danzig, Chełmno Land, Marienburg and Warmia) passes to the Polish crown. The Teutonic Order keeps eastern Prussia as a Polish fief.: Andra freden i Thorn. Kungliga Preussen (Pomerellen med Danzig, Chełmnolandet, Marienburg och Ermland) övergår till den polska kronan. Tyska orden behåller östra Preussen som polskt län.
  Uzun Hasan of the Aq Qoyunlu defeats and kills the Kara Koyunlu ruler Jahan Shah and takes his lands.: Uzun Hasan av Aq Qoyunlu besegrar och dödar Kara Koyunlus härskare Jahan Shah och tar hans länder.
  The Ottomans annex Karaman (1468; its last strongholds fall in 1474).: Osmanerna annekterar Karaman (1468; dess sista fästen faller 1474).
  Christian I pledges Orkney to James III of Scotland as security for his daughter’s dowry; the pledge is never redeemed.: Kristian I pantsätter Orkney till Jakob III av Skottland som säkerhet för sin dotters hemgift; panten löses aldrig in.
  Christian I pledges Shetland to Scotland as well. Both are annexed to the Scottish crown in 1472.: Kristian I pantsätter även Shetland till Skottland. Båda införlivas med den skotska kronan 1472.
  Sweden at War border state “1470”: Gränsläge ”1470” från Sweden at War
  Mehmed II takes Negroponte (Chalkis) from Venice.: Mehmed II tar Negroponte (Chalkis) från Venedig.
  The Grey League, the League of God’s House and the League of the Ten Jurisdictions form the Three Leagues (the Grisons).: Grå förbundet, Gudshusförbundet och Tiodomsförbundet bildar Tre förbunden (Graubünden).
  Ivan III conquers Great Perm.: Ivan III erövrar Stora Perm.
  Charles the Bold conquers the duchy of Guelders, bought from its old duke Arnold.: Karl den djärve erövrar hertigdömet Geldern, som köpts av dess gamle hertig Arnold.
  The Ottomans fortify Podgorica.: Osmanerna befäster Podgorica.
  The Ottomans take Kaffa and the principality of Theodoro (Mangup); the Crimean Khanate becomes an Ottoman vassal.: Osmanerna intar Kaffa och furstendömet Theodoro (Mangup); Krimkhanatet blir en osmansk vasall.
  After the battle on the Planta at Sion, Upper Valais conquers Lower Valais from Savoy.: Efter slaget vid Planta i Sion erövrar Övre Valais Nedre Valais från Savojen.
  Charles the Bold is killed at Nancy. Louis XI seizes the duchy of Burgundy and the Somme towns.: Karl den djärve stupar vid Nancy. Ludvig XI tar hertigdömet Burgund och Sommestäderna.
  Charles’s daughter Mary marries Maximilian of Austria. The Burgundian Netherlands pass to the Habsburgs; Guelders, Artois and the Free County are contested.: Karls dotter Maria gifter sig med Maximilian av Österrike. De burgundiska Nederländerna övergår till habsburgarna; Geldern, Artois och Fria grevskapet är omstridda.
  The Crimean Khanate becomes an Ottoman vassal; its Nogai subjects roam the steppe east of the Dniester.: Krimkhanatet blir en osmansk vasall; dess nogajiska undersåtar strövar över stäppen öster om Dnjestr.
  Ivan III annexes the Novgorod Republic and its northern lands.: Ivan III annekterar republiken Novgorod och dess nordliga länder.
  Krujë surrenders to the Ottomans, ten years after Skanderbeg’s death.: Krujë kapitulerar för osmanerna, tio år efter Skanderbegs död.
  Treaty of Constantinople. Venice cedes Shkodër and Lezhë to the Ottomans.: Fördraget i Konstantinopel. Venedig avträder Shkodër och Lezhë till osmanerna.
  Francis Phoebus, count of Foix and viscount of Béarn, becomes king of Navarre.: Frans Febus, greve av Foix och vicegreve av Béarn, blir kung av Navarra.
  Peace of Olomouc. Vladislaus II keeps Bohemia; Matthias Corvinus of Hungary keeps Moravia, Silesia and Lusatia for his lifetime.: Freden i Olomouc. Vladislav II behåller Böhmen; Matthias Corvinus av Ungern behåller Mähren, Schlesien och Lausitz på livstid.
  Charles of Maine, the last Angevin count of Provence, dies and leaves Provence to Louis XI.: Karl av Maine, den siste angevinske greven av Provence, dör och testamenterar Provence till Ludvig XI.
  Compact of Stans. Fribourg and Solothurn join the Confederacy.: Stansöverenskommelsen. Fribourg och Solothurn ansluter sig till edsförbundet.
  The Ottomans take Herceg Novi, the last stronghold of Herzegovina.: Osmanerna intar Herceg Novi, Hercegovinas sista fäste.
  Treaty of Arras. Maximilian accepts the loss of Burgundy and Picardy, and Artois and the Free County go to France as the dowry of his daughter Margaret, betrothed to the dauphin.: Fördraget i Arras. Maximilian godtar förlusten av Burgund och Pikardiet, och Artois och Fria grevskapet går till Frankrike som hemgift för hans dotter Margareta, trolovad med dauphinen.
  Bayezid II takes Kilia and Akkerman (Cetatea Albă), Moldavia's ports at the mouths of the Danube and the Dniester. Suleiman I annexes the Budjak steppe between them in 1538.: Bayezid II intar Kilia och Akkerman (Cetatea Albă), Moldaviens hamnar vid Donaus och Dnjestrs mynningar. Süleyman I annekterar Budjakstäppen mellan dem 1538.
  Treaty of Bagnolo ends the War of Ferrara; Venice receives the Polesine of Rovigo.: Fördraget i Bagnolo avslutar Ferrarakriget; Venedig får Polesine di Rovigo.
  Matthias Corvinus takes Vienna after a long siege and makes it his residence; most of Lower Austria is under Hungarian rule until his death.: Matthias Corvinus intar Wien efter en lång belägring och gör staden till sin residens; större delen av Niederösterreich står under ungerskt styre fram till hans död.
  Ivan III takes Tver.: Ivan III intar Tver.
  Málaga surrenders to Ferdinand and Isabella after a siege.: Málaga kapitulerar för Ferdinand och Isabella efter en belägring.
  Moscow annexes Vyatka.: Moskva annekterar Vjatka.
  Queen Catherine Cornaro abdicates; Venice takes over Cyprus.: Drottning Caterina Cornaro abdikerar; Venedig tar över Cypern.
  Almería and Guadix surrender to Castile after the fall of Baza.: Almería och Guadix kapitulerar för Kastilien efter Bazas fall.
  Matthias Corvinus dies; Moravia, Silesia and Lusatia return to the Bohemian crown.: Matthias Corvinus dör; Mähren, Schlesien och Lausitz återgår till den böhmiska kronan.
  After Matthias's death Maximilian of Habsburg retakes Vienna and Lower Austria.: Efter Matthias död återtar Maximilian av Habsburg Wien och Niederösterreich.
  historical-basemaps world_1492 (automatic draft, partly hand-corrected): historical-basemaps world_1492 (automatiskt utkast, delvis handkorrigerat)
  Charles of Egmond returns to Guelders and wins back his family’s duchy from the Habsburgs.: Karl av Egmond återvänder till Geldern och vinner tillbaka sin släkts hertigdöme från habsburgarna.
  Mengli I Giray of Crimea builds the fortress of Ochakov; Lithuania loses the Black Sea steppe (Ochakov is Ottoman from 1526).: Mengli I Giray av Krim bygger fästningen Otjakov; Litauen förlorar Svartahavsstäppen (Otjakov är osmanskt från 1526).
  Muhammad XII hands over Granada to Ferdinand and Isabella; the last Muslim state in Iberia ends.: Muhammad XII överlämnar Granada till Ferdinand och Isabella; den sista muslimska staten på Iberiska halvön upphör.
  Treaty of Barcelona. Charles VIII returns Roussillon and Cerdagne to Aragon to keep Ferdinand neutral in Italy.: Fördraget i Barcelona. Karl VIII återlämnar Roussillon och Cerdagne till Aragonien för att hålla Ferdinand neutral i Italien.
  Treaty of Senlis. Charles VIII, who has married Anne of Brittany instead of Margaret, returns Artois and the Free County to the Habsburgs.: Fördraget i Senlis. Karl VIII, som har gift sig med Anna av Bretagne i stället för Margareta, återlämnar Artois och Fria grevskapet till habsburgarna.
  Peace with Lithuania. Moscow keeps Vyazma and the Upper Oka principalities that have changed sides.: Fred med Litauen. Moskva behåller Vjazma och de furstendömen vid övre Oka som har bytt sida.
  Pisa rebels against Florence when Charles VIII’s army arrives.: Pisa gör uppror mot Florens när Karl VIII:s armé anländer.
  Sweden at War border state “1495”: Gränsläge ”1495” från Sweden at War
  The Ottomans annex Zeta after the last Crnojević ruler leaves for Venice.: Osmanerna annekterar Zeta sedan den siste härskaren av ätten Crnojević rest till Venedig.
  The conquest of Tenerife completes Castile’s conquest of the Canary Islands.: Erövringen av Teneriffa fullbordar Kastiliens erövring av Kanarieöarna.
  Castilian forces under the Duke of Medina Sidonia occupy Melilla.: Kastilianska styrkor under hertigen av Medina Sidonia besätter Melilla.
  Venice receives Cremona as its share of Louis XII’s conquest of Milan.: Venedig får Cremona som sin andel av Ludvig XII:s erövring av Milano.
  historical-basemaps world_1500 (automatic draft, partly hand-corrected): historical-basemaps world_1500 (automatiskt utkast, delvis handkorrigerat)
  The last count of Gorizia dies; the county passes to Maximilian of Habsburg.: Den siste greven av Görz dör; grevskapet övergår till Maximilian av Habsburg.
  "The Diet of Augsburg sets up the Imperial Circles. From here on the map shows the larger territorial states of the Empire: the duchy of Lorraine, the Prince-Bishopric of Liège and the Habsburg lands in Upper Alsace.": "Riksdagen i Augsburg inrättar rikskretsarna. Från och med nu visar kartan rikets större territorialstater: hertigdömet Lothringen, furstbiskopsdömet Liège och de habsburgska länderna i Oberelsass."
  Imperial Reform. The Diet of Augsburg sets up the Imperial Circles. From here the map shows the larger territorial states of the Empire; before, the Empire is drawn as one. The many small states (ecclesiastical states, imperial cities, counts) remain grouped as the Holy Roman Empire. Saxony is shown as divided by the Leipzig partition of 1485 into the Ernestine electorate (Wittenberg and Thuringia) and Albertine ducal Saxony (Meissen).: Riksreformen. Riksdagen i Augsburg inrättar rikskretsarna. Härifrån visar kartan rikets större territorialstater; tidigare ritas riket som en enhet. De många små staterna (andliga stater, riksstäder, grevskap) förblir grupperade som tysk-romerska riket. Sachsen visas delat enligt Leipzigdelningen 1485 i det ernestinska kurfurstendömet (Wittenberg och Thüringen) och det albertinska hertigdömet Sachsen (Meissen).
  The County of Gorizia passes to Maximilian of Habsburg.: Grevskapet Görz övergår till Maximilian av Habsburg.
  Basel joins the Confederacy (Schaffhausen follows on 10 August).: Basel ansluter sig till edsförbundet (Schaffhausen följer den 10 augusti).
  The Ottomans take Durrës from Venice.: Osmanerna tar Durrës från Venedig.
  Mengli I Giray of Crimea sacks Sarai, and the Great Horde comes to an end. The steppe north of the Black Sea becomes the Crimean Khanate's; the Nogais hold the lands east of the Don.: Mengli I Giray av Krim plundrar Saraj, och Stora horden går under. Stäppen norr om Svarta havet blir Krimkhanatets; nogajerna behärskar länderna öster om Don.
  Venice takes Rimini and Faenza after the fall of Cesare Borgia.: Venedig intar Rimini och Faenza efter Cesare Borgias fall.
  Tula and the lands of Princess Agrippina of Ryazan pass to Moscow.: Tula och furstinnan Agrippina av Rjazans länder övergår till Moskva.
  Truce of Moscow. Lithuania cedes Chernihiv–Siveria and the upper Oka lands, about a third of its territory, to Moscow.: Stilleståndet i Moskva. Litauen avträder Tjernihiv-Siverien och länderna vid övre Oka, omkring en tredjedel av sitt territorium, till Moskva.
  Treaty of Arona. France, holding Milan, cedes Bellinzona; with the Leventina (Uri’s since 1440), Blenio and Riviera, the northern Ticino is Swiss (Lugano and Locarno follow in 1512).: Fördraget i Arona. Frankrike, som innehar Milano, avträder Bellinzona; tillsammans med Leventina (Uris sedan 1440), Blenio och Riviera är norra Ticino schweiziskt (Lugano och Locarno följer 1512).
  Shah Ismail I of Persia takes the Aq Qoyunlu lands (1501–1507), Diyarbakır last.: Shah Ismail I av Persien tar Aq Qoyunlus länder (1501–1507), Diyarbakır sist.
  Shah Ismail I of Persia takes the upper Jazira with the Aq Qoyunlu lands.: Shah Ismail I av Persien tar övre Jazira med Aq Qoyunlus länder.
  Battle of Agnadello. Venice loses its mainland for a time; Julius II recovers Romagna, and the French take Cremona for Milan.: Slaget vid Agnadello. Venedig förlorar för en tid sina fastlandsbesittningar; Julius II återtar Romagna, och fransmännen tar Cremona åt Milano.
  Pisa surrenders to Florence.: Pisa kapitulerar för Florens.
  Vasily III ends the independence of Pskov.: Vasilij III gör slut på Pskovs självständighet.
  The Ottomans take Srebrenik.: Osmanerna intar Srebrenik.
  The Swiss drive the French from Milan. The Grisons take the Valtellina; Julius II takes Parma, Piacenza and Reggio, the last from the Duke of Ferrara.: Schweizarna driver fransmännen från Milano. Graubünden tar Valtellina; Julius II tar Parma, Piacenza och Reggio, det sistnämnda från hertigen av Ferrara.
  Ferdinand of Aragon’s army under the Duke of Alba takes Pamplona; Upper Navarre is annexed to Castile in 1515.: Ferdinand av Aragoniens armé under hertigen av Alba intar Pamplona; Övre Navarra införlivas med Kastilien 1515.
  Emperor Maximilian sells Modena, which his troops had held since 1510, to Pope Leo X.: Kejsar Maximilian säljer Modena, som hans trupper hade hållit sedan 1510, till påven Leo X.
  Vasily III takes Smolensk from Lithuania.: Vasilij III tar Smolensk från Litauen.
  After defeating Ismail at Chaldiran (23 August 1514), Selim I takes Erzincan, Bayburt and Kemah; his commanders take Diyarbakır and the Kurdish emirates (1515–1516) and Mardin (1517).: Efter att ha besegrat Ismail vid Chaldiran (23 augusti 1514) intar Selim I Erzincan, Bayburt och Kemah; hans befälhavare intar Diyarbakır och de kurdiska emiraten (1515–1516) samt Mardin (1517).
  After Marignano, Leo X gives up Parma and Piacenza to Francis I as Duke of Milan.: Efter Marignano avstår Leo X Parma och Piacenza till Frans I i egenskap av hertig av Milano.
  Ferdinand of Aragon dies; his grandson Charles inherits the Spanish kingdoms, including Roussillon.: Ferdinand av Aragonien dör; hans dotterson Karl ärver de spanska kungarikena, inklusive Roussillon.
  Ferdinand of Aragon dies; his grandson Charles inherits both Castile and Aragon, and the crowns are ruled together as Spain.: Ferdinand av Aragonien dör; hans dotterson Karl ärver både Kastilien och Aragonien, och kronorna styrs tillsammans som Spanien.
  Selim I destroys the Mamluk army at Marj Dabiq near Aleppo and takes Cilicia and the Mamluk lands west of the Euphrates.: Selim I förintar mamlukarmén vid Marj Dabiq nära Aleppo och tar Kilikien och mamlukernas länder väster om Eufrat.
  Selim I destroys the Mamluk army at Marj Dabiq; Aleppo, Damascus (September) and Jerusalem (December) open their gates.: Selim I förintar mamlukarmén vid Marj Dabiq; Aleppo, Damaskus (september) och Jerusalem (december) öppnar sina portar.
  Selim I defeats the last Mamluk sultan, Tumanbay, at Ridaniya outside Cairo; Egypt, Palestine and the Hejaz route pass to the Ottomans.: Selim I besegrar den siste mamluksultanen, Tumanbay, vid Ridaniya utanför Kairo; Egypten, Palestina och vägen till Hijaz övergår till osmanerna.
  The Swabian League, which drove out Duke Ulrich in 1519, sells Württemberg to Charles V; it is ruled by Ferdinand of Austria.: Schwabiska förbundet, som drev ut hertig Ulrik 1519, säljer Württemberg till Karl V; det styrs av Ferdinand av Österrike.
  Papal and imperial troops retake Parma and Piacenza for Leo X.: Påvliga och kejserliga trupper återtar Parma och Piacenza åt Leo X.
  Vasily III annexes the Principality of Ryazan.: Vasilij III annekterar furstendömet Rjazan.
  Sweden at War border state “1521”: Gränsläge ”1521” från Sweden at War
  Suleiman I takes Belgrade and Šabac.: Süleyman I intar Belgrad och Šabac.
  Selim’s son Suleiman I annexes the Dulkadirid emirate, an Ottoman vassal since 1515.: Selims son Süleyman I annekterar dulkadiridernas emirat, en osmansk vasall sedan 1515.
  The Ottomans take Knin.: Osmanerna intar Knin.
  The Knights Hospitaller surrender Rhodes after a six-month siege and leave on 1 January 1523.: Johanniterorden överlämnar Rhodos efter en sex månader lång belägring och lämnar ön den 1 januari 1523.
  After the death of Pope Adrian VI, Alfonso I d’Este recovers Reggio.: Efter påven Adrianus VI:s död återtar Alfonso I d’Este Reggio.
  Friesland submits to Charles V after a decade of war with Saxony and Guelders.: Friesland underkastar sig Karl V efter ett decennium av krig med Sachsen och Geldern.
  Prussian Homage. The last grand master in Prussia, Albert of Brandenburg, becomes the first Duke of Prussia, a Lutheran duchy under the Polish crown.: Den preussiska hyllningen. Den siste stormästaren i Preussen, Albrekt av Brandenburg, blir den förste hertigen av Preussen, ett lutherskt hertigdöme under den polska kronan.
  After the battle of Mohács (29 August), the Ottomans keep Syrmia and Osijek.: Efter slaget vid Mohács (29 augusti) behåller osmanerna Syrmien och Osijek.
  Ferdinand of Habsburg is elected King of Bohemia after Louis II falls at Mohács; Bohemia, Moravia, Silesia and Lusatia pass to the Habsburgs. In December he is also elected King of Hungary, and western Hungary (with the later Burgenland) comes under Habsburg rule.: Ferdinand av Habsburg väljs till kung av Böhmen sedan Ludvig II stupat vid Mohács; Böhmen, Mähren, Schlesien och Lausitz övergår till habsburgarna. I december väljs han även till kung av Ungern, och västra Ungern (med det senare Burgenland) kommer under habsburgskt styre.
  Two kings for Hungary. John Zápolya, crowned in November, holds the centre and east; Ferdinand of Habsburg, elected on 17 December, holds the west and north. The line between them shifts for years; Zápolya’s kingdom becomes the Principality of Transylvania.: Två kungar i Ungern. Johan Zápolya, krönt i november, behärskar centrum och öster; Ferdinand av Habsburg, vald den 17 december, behärskar väster och norr. Gränsen mellan dem förskjuts under flera år; Zápolyas kungarike blir furstendömet Transsylvanien.
  The Croatian estates at Cetin elect Ferdinand of Habsburg king.: De kroatiska ständerna i Cetin väljer Ferdinand av Habsburg till kung.
  During the Sack of Rome, Alfonso I d’Este retakes Modena.: Under plundringen av Rom återtar Alfonso I d’Este Modena.
  The Ottomans take Jajce and Banja Luka.: Osmanerna intar Jajce och Banja Luka.
  The Ottomans take Lika (Udbina, 1527–1528).: Osmanerna intar Lika (Udbina, 1527–1528).
  The bishop of Utrecht hands his temporal power over Utrecht and Overijssel to Charles V.: Biskopen av Utrecht överlämnar sin världsliga makt över Utrecht och Overijssel till Karl V.
  historical-basemaps world_1530 (automatic draft, partly hand-corrected): historical-basemaps world_1530 (automatiskt utkast, delvis handkorrigerat)
  Charles V grants Malta to the Knights of Saint John, expelled from Rhodes.: Karl V förlänar Malta till johanniterorden, som fördrivits från Rhodos.
  Charles V grants Asti to Beatrice of Portugal, Duchess of Savoy.: Karl V förlänar Asti till Beatrice av Portugal, hertiginna av Savojen.
  The Edict of Union joins the duchy of Brittany to the kingdom of France.: Unionsediktet förenar hertigdömet Bretagne med kungariket Frankrike.
  Treaty of Kaaden. After Philip of Hesse defeats the Austrians at Lauffen, Ulrich is restored to Württemberg as an Austrian fief.: Fördraget i Kaaden. Sedan Filip av Hessen besegrat österrikarna vid Lauffen återinsätts Ulrik i Württemberg som österrikiskt län.
  Groningen and Drenthe accept Charles V’s rule.: Groningen och Drenthe erkänner Karl V:s styre.
  Bern conquers the Vaud from Savoy.: Bern erövrar Vaud från Savojen.
  Geneva adopts the Reformation and makes itself an independent republic, allied with Bern and Fribourg.: Genève antar reformationen och gör sig till en självständig republik, allierad med Bern och Fribourg.
  The Ottomans take Požega and western Slavonia (1536–1537).: Osmanerna intar Požega och västra Slavonien (1536–1537).
  Truce of Moscow. Lithuania recovers Homel.: Stilleståndet i Moskva. Litauen återtar Homel.
  Suleiman I’s campaign against Petru Rareș. Moldavia becomes a tributary state; the Ottomans annex the Budjak steppe and Bender, and Brăila in Wallachia.: Süleyman I:s fälttåg mot Petru Rareș. Moldavien blir en skattskyldig stat; osmanerna annekterar Budjakstäppen och Bender, samt Brăila i Valakiet.
  Suleiman I occupies Buda. Central Hungary becomes an Ottoman province; Queen Isabella and the infant John Sigismund keep the east.: Süleyman I besätter Buda. Centrala Ungern blir en osmansk provins; drottning Isabella och den späde Johan Sigismund behåller öster.
  The Ottomans take Pécs, Siklós, Esztergom and Székesfehérvár.: Osmanerna intar Pécs, Siklós, Esztergom och Székesfehérvár.
  Treaty of Venlo. William of Cleves gives up Guelders and Zutphen to Charles V; the Seventeen Provinces are complete.: Fördraget i Venlo. Vilhelm av Kleve avstår Geldern och Zutphen till Karl V; de sjutton provinserna är fullständiga.
  Pope Paul III creates the Duchy of Parma and Piacenza for his son Pier Luigi Farnese.: Påven Paulus III skapar hertigdömet Parma och Piacenza åt sin son Pier Luigi Farnese.
  Capitulation of Wittenberg after Mühlberg. The electorate and Wittenberg pass to the Albertine Wettins; the Ernestines keep only their Thuringian lands.: Kapitulationen i Wittenberg efter Mühlberg. Kurfurstendömet och Wittenberg övergår till den albertinska grenen av huset Wettin; den ernestinska grenen behåller endast sina länder i Thüringen.
  Suleiman I takes Van; the Peace of Amasya (1555) confirms Ottoman rule over the Lake Van region.: Süleyman I intar Van; freden i Amasya (1555) bekräftar det osmanska styret över området kring Vansjön.
  Treaty of Weissenburg. Queen Isabella gives up Transylvania and the eastern counties to Ferdinand of Habsburg in exchange for Silesian duchies.: Fördraget i Weissenburg. Drottning Isabella avstår Transsylvanien och de östra komitaten till Ferdinand av Habsburg i utbyte mot schlesiska hertigdömen.
  The Ottomans take Temesvár and the Banat, Lippa, Szolnok, Nógrád and Veszprém, and Virovitica in Slavonia; Eger holds out.: Osmanerna intar Temesvár och Banatet, Lippa, Szolnok, Nógrád och Veszprém, samt Virovitica i Slavonien; Eger håller stånd.
  Henry II of France occupies Metz, Toul and Verdun (the Three Bishoprics), recognised as French in 1648.: Henrik II av Frankrike besätter Metz, Toul och Verdun (de tre biskopsdömena), som erkänns som franska 1648.
  Ivan IV takes Kazan; the khanate is annexed.: Ivan IV intar Kazan; khanatet annekteras.
  The Ottomans take Kaposvár.: Osmanerna intar Kaposvár.
  Laois and Offaly are shired as Queen’s County and King’s County and planted with English settlers; Carlow is under crown control again.: Laois och Offaly görs till grevskapen Queen’s County och King’s County och koloniseras med engelska nybyggare; Carlow står åter under kronans kontroll.
  Russia annexes the Khanate of Astrakhan; the whole Volga is Russian.: Ryssland annekterar Astrachankhanatet; hela Volga är ryskt.
  Charles V abdicates as king of Spain. His son Philip II inherits Spain, the Netherlands and the Free County of Burgundy.: Karl V abdikerar som kung av Spanien. Hans son Filip II ärver Spanien, Nederländerna och Fria grevskapet Burgund.
  With Ottoman backing, Isabella and her son John Sigismund return to Transylvania; the Habsburg troops leave.: Med osmanskt stöd återvänder Isabella och hennes son Johan Sigismund till Transsylvanien; de habsburgska trupperna drar sig tillbaka.
  Most Bashkir tribes accept the tsar's rule.: De flesta basjkiriska stammarna erkänner tsarens styre.
  Philip II grants Siena, conquered in 1555, to Cosimo I de’ Medici, keeping the coastal State of the Presidi.: Filip II förlänar Siena, som erövrats 1555, till Cosimo I de’ Medici men behåller kuststaten Stato dei Presidi.
  The duke of Guise takes Calais from the English.: Hertigen av Guise tar Calais från engelsmännen.
  Sweden at War border state “1561”: Gränsläge ”1561” från Sweden at War
  Union of Vilnius. The Livonian Order is dissolved; its last master, Gotthard Kettler, becomes Duke of Courland and Semigallia under the Grand Duchy of Lithuania.: Unionen i Vilnius. Livländska orden upplöses; dess siste mästare, Gotthard Kettler, blir hertig av Kurland och Semgallen under storfurstendömet Litauen.
  Ivan IV takes Polotsk from Lithuania during the Livonian War.: Ivan IV tar Polotsk från Litauen under livländska kriget.
  The Ottomans take Szigetvár (7 September, after Suleiman’s death in his camp) and Gyula.: Osmanerna intar Szigetvár (7 september, efter att Süleyman dött i sitt läger) och Gyula.
  Philip of Hesse dies and Hesse is divided among his sons; Hesse-Kassel and Hesse-Darmstadt are the lasting lines.: Filip av Hessen dör och Hessen delas mellan hans söner; Hessen-Kassel och Hessen-Darmstadt blir de bestående linjerna.
  Union of Lublin. The Bracław region passes from Lithuania to the Polish Crown in the new Commonwealth.: Lublinunionen. Området kring Bracław övergår från Litauen till den polska kronan i det nya samväldet.
  Union of Lublin. The Crown of Poland and the Grand Duchy of Lithuania become one Commonwealth; Podlasie, Volhynia, Bracław and Kyiv pass from the Grand Duchy to the Crown.: Lublinunionen. Polens krona och storfurstendömet Litauen förenas i ett samvälde; Podlasien, Volynien, Bracław och Kyiv övergår från storfurstendömet till kronan.
  Ivan IV takes the Don Cossacks into his service. Their lands are shown with Russia from here, though the Host governed itself, and Azov at the mouth of the Don stayed Ottoman until 1696.: Ivan IV tar donkosackerna i sin tjänst. Deras land visas härifrån som en del av Ryssland, även om kosackhären styrde sig själv, och Azov vid Dons mynning förblev osmanskt till 1696.
  Sweden at War border state “1570”: Gränsläge ”1570” från Sweden at War
  Famagusta surrenders after an eleven-month siege; Cyprus is Ottoman. Bar and Ulcinj fall the same year.: Famagusta kapitulerar efter elva månaders belägring; Cypern blir osmanskt. Bar och Ulcinj faller samma år.
  Lala Mustafa Pasha takes Kars and the Georgian principality of Samtskhe with Ardahan and Artvin.: Lala Mustafa pasha intar Kars och det georgiska furstendömet Samtsche med Ardahan och Artvin.
  After the death of Joseph Nasi, whom Selim II made duke in 1566, the Cyclades come under direct Ottoman rule.: Efter Joseph Nasis död – Selim II hade gjort honom till hertig 1566 – kommer Kykladerna under direkt osmanskt styre.
  Stefan Báthory retakes Polotsk.: Stefan Batory återtar Polotsk.
  Act of Abjuration. The provinces of the Union of Utrecht renounce Philip II; the Dutch Republic is born.: Avsägelseakten. Provinserna i Utrechtunionen säger upp sin trohet mot Filip II; Nederländska republiken föds.
  Sweden at War border state “1583”: Gränsläge ”1583” från Sweden at War
  The earl of Desmond is killed, ending the Second Desmond Rebellion. His lands are confiscated and planted as the Munster Plantation.: Earlen av Desmond dödas, och det andra Desmondupproret är över. Hans gods konfiskeras och koloniseras som Munster Plantation.
  The Composition of Connacht. The lords of Connacht and Thomond accept crown rule and English land tenure; Longford has been shired.: Composition of Connacht. Herrarna i Connacht och Thomond godtar kronans styre och engelsk jordrätt; Longford har gjorts till grevskap.
  The fortress of Voronezh is founded on the steppe frontier.: Fästningen Voronezj grundas vid stäppgränsen.
  Samara is founded; the Volga route to Astrakhan is secured with forts (Tsaritsyn 1589, Saratov 1590).: Samara grundas; vägen längs Volga till Astrachan säkras med fästen (Tsaritsyn 1589, Saratov 1590).
  Treaty of Constantinople. Persia cedes the Erivan region to the Ottomans.: Freden i Konstantinopel. Persien avträder området kring Erivan till osmanerna.
  The Ottomans take Bihać.: Osmanerna intar Bihać.
  Archduke Matthias retakes Nógrád during the Long Turkish War.: Ärkehertig Matthias återtar Nógrád under det långa turkiska kriget.
  Maurice of Nassau takes Groningen; Groningen and Drenthe join the Republic.: Moritz av Nassau intar Groningen; Groningen och Drenthe ansluter sig till republiken.
  Sweden at War border state “1595”: Gränsläge ”1595” från Sweden at War
  Belgorod is founded, and the frontier line moves south into the Wild Fields.: Belgorod grundas, och gränslinjen flyttas söderut in i Vilda fälten.
  The Ottomans take Eger.: Osmanerna intar Eger.
  Verkhoturye is founded on the road across the Urals into Siberia.: Verchoturje grundas vid vägen över Ural in i Sibirien.
  Duke Alfonso II d’Este dies without a legitimate heir; Pope Clement VIII takes Ferrara, and the Este keep Modena and Reggio.: Hertig Alfonso II d’Este dör utan legitim arvinge; påven Clemens VIII tar Ferrara, och huset Este behåller Modena och Reggio.
  historical-basemaps world_1600 (automatic draft, partly hand-corrected): historical-basemaps world_1600 (automatiskt utkast, delvis handkorrigerat)
  The Ottomans take Kanizsa.: Osmanerna intar Kanizsa.
  Treaty of Lyon. Savoy cedes Bresse, Bugey and Gex to France in exchange for Saluzzo.: Freden i Lyon. Savojen avträder Bresse, Bugey och Gex till Frankrike i utbyte mot Saluzzo.
  Treaty of Mellifont. Hugh O’Neill submits, ending the Nine Years’ War; the whole of Ireland is under the English crown for the first time.: Fördraget i Mellifont. Hugh O’Neill underkastar sig, och nioårskriget är över; hela Irland står för första gången under den engelska kronan.
  Shah Abbas I retakes Erivan.: Shah Abbas I återtar Erivan.
  Sigismund III takes Smolensk after a siege of twenty months.: Sigismund III intar Smolensk efter en belägring på tjugo månader.
  Treaty of Xanten. The Jülich-Cleves inheritance is divided; Cleves, Mark and Ravensberg go to Brandenburg, Jülich and Berg to Palatinate-Neuburg.: Fördraget i Xanten. Det jülich-klevska arvet delas; Kleve, Mark och Ravensberg tillfaller Brandenburg, Jülich och Berg Pfalz-Neuburg.
  Sweden at War border state “1617”: Gränsläge ”1617” från Sweden at War
  Duke Albert Frederick dies, and Ducal Prussia passes to the electors of Brandenburg. It stays a Polish fief until the Treaty of Wehlau (1657).: Hertig Albrekt Fredrik dör, och hertigdömet Preussen övergår till kurfurstarna av Brandenburg. Det förblir ett polskt län fram till fördraget i Wehlau (1657).
  Truce of Deulino. Moscow cedes Smolensk, Chernihiv and Siveria to the Commonwealth, which is now at its largest.: Stilleståndet i Deulino. Moskva avträder Smolensk, Tjernihiv och Severien till samväldet, som nu når sin största utbredning.
  Louis XIII marches into Béarn, restores Catholic worship and joins Béarn and Lower Navarre to the French crown.: Ludvig XIII tågar in i Béarn, återinför den katolska gudstjänsten och förenar Béarn och Nedre Navarra med den franska kronan.
  Ferdinand II gives the Upper Palatinate, conquered in 1621, to Maximilian of Bavaria.: Ferdinand II ger Oberpfalz, som erövrats 1621, till Maximilian av Bayern.
  Sweden at War border state “1629”: Gränsläge ”1629” från Sweden at War
  Duke Francesco Maria II della Rovere dies; Urbino passes to the Papal States.: Hertig Francesco Maria II della Rovere dör; Urbino övergår till Kyrkostaten.
  Kalmyk Oirats arrive on the lower Volga and drive the Nogais west; the Kalmyk Khanate accepts Russian suzerainty in 1655.: Kalmuckiska oirater kommer till nedre Volga och driver nogajerna västerut; Kalmuckiska khanatet erkänner rysk överhöghet 1655.
  Peace of Prague. Ferdinand II cedes Upper and Lower Lusatia to Saxony.: Freden i Prag. Ferdinand II avträder Över- och Nederlausitz till Sachsen.
  Tambov is founded as part of the Belgorod defensive line.: Tambov grundas som en del av Belgorodlinjen, en försvarslinje.
  Sweden at War border state “1643”: Gränsläge ”1643” från Sweden at War
  Sweden at War border state “1645”: Gränsläge ”1645” från Sweden at War
  Sweden at War border state “1648”: Gränsläge ”1648” från Sweden at War
  Peace of Münster. Spain recognises the independence of the Dutch Republic, which keeps northern Brabant and Zeelandic Flanders.: Freden i Münster. Spanien erkänner Nederländska republikens självständighet; republiken behåller norra Brabant och Zeeländska Flandern.
  Peace of Westphalia. The Habsburgs cede Upper Alsace and the Sundgau to France, and the Three Bishoprics are confirmed as French.: Westfaliska freden. Habsburgarna avträder Övre Elsass och Sundgau till Frankrike, och de tre biskopsdömena bekräftas som franska.
  Treaty of Zboriv. The king recognises Cossack self-rule in the Kyiv, Bracław and Chernihiv voivodeships, which Khmelnytsky's Hetmanate has held since 1648.: Fördraget i Zboriv. Kungen erkänner kosackernas självstyre i vojvodskapen Kyiv, Bracław och Tjernihiv, som Chmelnytskyjs hetmanat har behärskat sedan 1648.
  historical-basemaps world_1650 (automatic draft, partly hand-corrected): historical-basemaps world_1650 (automatiskt utkast, delvis handkorrigerat)
  The Instrument of Government gives Ireland seats in the Protectorate’s parliament; after the Cromwellian conquest Ireland is ruled as part of the Commonwealth.: Instrument of Government ger Irland platser i protektoratets parlament; efter Cromwells erövring styrs Irland som en del av samväldet.
  Kharkiv is founded by Cossack settlers in Sloboda Ukraine under the tsar.: Charkiv grundas av kosackiska nybyggare i Slobodaukraina under tsaren.
  Sweden at War border state “1654”: Gränsläge ”1654” från Sweden at War
  The Ordinance of Union incorporates Scotland into the Commonwealth of England, Scotland and Ireland.: Unionsförordningen införlivar Skottland i samväldet England, Skottland och Irland.
  Sweden at War border state “1658”: Gränsläge ”1658” från Sweden at War
  Peace of the Pyrenees. Spain cedes Roussillon and most of Artois to France.: Pyreneiska freden. Spanien avträder Roussillon och större delen av Artois till Frankrike.
  Sweden at War border state “1660”: Gränsläge ”1660” från Sweden at War
  The Restoration. Charles II returns, and Scotland and Ireland are separate kingdoms again.: Restaurationen. Karl II återvänder, och Skottland och Irland är åter separata kungariken.
  The Ottomans take Várad (Oradea) from Transylvania.: Osmanerna tar Várad (Oradea) från Transsylvanien.
  The Ottomans take Érsekújvár (Nové Zámky) and Nógrád; the Treaty of Vasvár (1664) leaves them to the Ottomans.: Osmanerna intar Érsekújvár (Nové Zámky) och Nógrád; freden i Vasvár (1664) lämnar dem åt osmanerna.
  Treaty of Lisbon. Spain recognises Portugal’s independence; Ceuta, which had stayed loyal to Philip IV in 1640, remains Spanish.: Freden i Lissabon. Spanien erkänner Portugals självständighet; Ceuta, som förblivit lojalt mot Filip IV 1640, förblir spanskt.
  Treaty of Aachen ends the War of Devolution. France keeps Lille, Douai and the towns it took in Flanders.: Freden i Aachen avslutar devolutionskriget. Frankrike behåller Lille, Douai och de städer det intagit i Flandern.
  Candia (Heraklion) surrenders after a siege of 21 years; Venice keeps only three island forts off Crete.: Candia (Heraklion) kapitulerar efter en belägring på 21 år; Venedig behåller bara tre öfästen utanför Kreta.
  Treaty of Buczacz. Poland–Lithuania cedes Podolia and the right-bank Ukraine to the Ottomans and their Cossack vassals.: Freden i Buczacz. Polen–Litauen avträder Podolien och Ukraina väster om Dnepr till osmanerna och deras kosackiska vasaller.
  Treaty of Buchach. Poland cedes Podolia to the Ottoman Empire; the right-bank Cossacks under Doroshenko accept the sultan's protection.: Freden i Butjatj. Polen avträder Podolien till Osmanska riket; kosackerna väster om Dnepr under Dorosjenko ställer sig under sultanens beskydd.
  Peace of Nijmegen. Spain cedes the Free County of Burgundy and Valenciennes, Cambrai and Maubeuge to France.: Freden i Nijmegen. Spanien avträder Franche-Comté samt Valenciennes, Cambrai och Maubeuge till Frankrike.
  Sweden at War border state “1679”: Gränsläge ”1679” från Sweden at War
  The archbishopric of Magdeburg falls to Brandenburg on the death of its last administrator.: Ärkestiftet Magdeburg tillfaller Brandenburg när dess siste administrator dör.
  French troops occupy Strasbourg, the last free city in Alsace; the Truce of Ratisbon (1684) and Ryswick (1697) leave it French.: Franska trupper besätter Strasbourg, den sista fria staden i Elsass; stilleståndet i Regensburg (1684) och freden i Rijswijk (1697) lämnar den åt Frankrike.
  Truce of Ratisbon. The Emperor and Spain accept for twenty years France’s Reunions, Strasbourg and Luxembourg, taken in June after a siege.: Stilleståndet i Regensburg. Kejsaren och Spanien godtar för tjugo år Frankrikes reunioner, Strasbourg och Luxemburg, som intagits i juni efter en belägring.
  The Simmern line dies out and the Palatinate passes to the Neuburg line, which also holds Jülich and Berg.: Linjen Simmern dör ut, och Pfalz övergår till linjen Neuburg, som också innehar Jülich och Berg.
  The last Duke of Saxe-Lauenburg dies; the duchy passes to the dukes of Brunswick-Lüneburg (Hanover).: Den siste hertigen av Sachsen-Lauenburg dör; hertigdömet övergår till hertigarna av Braunschweig-Lüneburg (Hannover).
  Danilo I becomes prince-bishop of Montenegro (1696 or 1697); Old Montenegro around Cetinje is in practice independent of Ottoman rule.: Danilo I blir furstbiskop av Montenegro (1696 eller 1697); Gamla Montenegro kring Cetinje är i praktiken oberoende av osmanskt styre.
  Peace of Ryswick. France returns Luxembourg to Spain, and Lorraine to its duke.: Freden i Rijswijk. Frankrike återlämnar Luxemburg till Spanien och Lothringen till dess hertig.
  Treaty of Karlowitz. The Ottomans cede Hungary (except the Banat), Transylvania and Slavonia to the Habsburgs, the Morea and inland Dalmatia to Venice, and Podolia to Poland–Lithuania.: Freden i Karlowitz. Osmanerna avträder Ungern (utom Banatet), Transsylvanien och Slavonien till habsburgarna, Morea och inre Dalmatien till Venedig och Podolien till Polen–Litauen.
  Treaty of Karlowitz. The Ottomans return Podolia, and right-bank Ukraine comes back under Polish rule.: Freden i Karlowitz. Osmanerna återlämnar Podolien, och Ukraina väster om Dnepr kommer åter under polskt styre.
  historical-basemaps world_1700 (automatic draft, partly hand-corrected): historical-basemaps world_1700 (automatiskt utkast, delvis handkorrigerat)
  Sweden at War border state “1700”: Gränsläge ”1700” från Sweden at War
  The Acts of Union join England and Scotland as the Kingdom of Great Britain.: Unionsakterna förenar England och Skottland till Kungariket Storbritannien.
  Union of England and Scotland. The Channel Islands stay crown dependencies of the new kingdom.: Unionen mellan England och Skottland. Kanalöarna förblir kronbesittningar under det nya kungariket.
  The estates of Neuchâtel choose Frederick I of Prussia as their prince.: Ständerna i Neuchâtel väljer Fredrik I av Preussen till sin furste.
  Emperor Joseph I confiscates Mantua and grants Montferrat to Victor Amadeus II of Savoy.: Kejsar Josef I konfiskerar Mantua och förlänar Monferrato åt Viktor Amadeus II av Savojen.
  The Ottomans take over Khotyn as a district under their direct rule.: Osmanerna tar över Chotyn som ett distrikt under direkt osmanskt styre.
  Peace of Utrecht. Savoy keeps Alessandria and the Lomellina, occupied in 1707 (with the Oltrepò Pavese, ceded at Worms in 1743), and receives Sicily; Austria later receives Naples, Milan and Sardinia.: Freden i Utrecht. Savojen behåller Alessandria och Lomellina, som ockuperats 1707 (med Oltrepò Pavese, avträtt i Worms 1743), och får Sicilien; Österrike får senare Neapel, Milano och Sardinien.
  Treaty of Utrecht. Spain cedes Menorca (occupied since 1708) and Gibraltar to Great Britain.: Freden i Utrecht. Spanien avträder Menorca (ockuperat sedan 1708) och Gibraltar till Storbritannien.
  Treaty of Rastatt. The Spanish Netherlands pass to the Austrian Habsburgs.: Freden i Rastatt. Spanska Nederländerna övergår till de österrikiska habsburgarna.
  historical-basemaps world_1715 (automatic draft, partly hand-corrected): historical-basemaps world_1715 (automatiskt utkast, delvis handkorrigerat)
  The Ottomans complete the reconquest of the Morea from Venice in a single summer campaign; the Treaty of Passarowitz (1718) confirms it.: Osmanerna fullbordar återerövringen av Morea från Venedig under ett enda sommarfälttåg; freden i Passarowitz (1718) bekräftar det.
  Third Barrier Treaty. The Dutch receive Venlo and part of Upper Guelders; with Maastricht they hold most of Limburg.: Tredje barriärtraktaten. Nederländerna får Venlo och en del av Övre Geldern; tillsammans med Maastricht innehar de större delen av Limburg.
  Treaty of Passarowitz. The Ottomans cede the Banat, northern Serbia and Oltenia to the Habsburgs.: Freden i Passarowitz. Osmanerna avträder Banatet, norra Serbien och Oltenien till habsburgarna.
  Vaduz and Schellenberg are united as the Principality of Liechtenstein.: Vaduz och Schellenberg förenas till furstendömet Liechtenstein.
  Sweden at War border state “1720”: Gränsläge ”1720” från Sweden at War
  Treaty of The Hague. Savoy exchanges Sicily for Sardinia, and Victor Amadeus II becomes King of Sardinia.: Fördraget i Haag. Savojen byter Sicilien mot Sardinien, och Viktor Amadeus II blir kung av Sardinien.
  Sweden at War border state “1721”: Gränsläge ”1721” från Sweden at War
  Hans Egede lands in western Greenland, and Danish–Norwegian colonisation begins. The east coast was not reached until the 1880s.: Hans Egede landstiger på västra Grönland, och den dansk-norska koloniseringen börjar. Östkusten nåddes först på 1880-talet.
  Treaty of Constantinople between Russia and the Ottomans; the Ottomans occupy Erivan.: Fördraget i Konstantinopel mellan Ryssland och osmanerna; osmanerna besätter Erivan.
  The Orenburg expedition builds forts on the Ural River (Orenburg 1743).: Orenburgexpeditionen bygger fästen vid floden Ural (Orenburg 1743).
  Preliminary Peace of Vienna. Don Carlos keeps Naples and Sicily, conquered in 1734–35; Austria receives Parma and Piacenza.: Preliminärfreden i Wien. Don Carlos behåller Neapel och Sicilien, som erövrats 1734–35; Österrike får Parma och Piacenza.
  Nader takes back Erivan for Persia (1735) and is crowned shah.: Nader återtar Erivan åt Persien (1735) och kröns till shah.
  Treaty of Vienna. Savoy receives Novara and Tortona from Milan.: Freden i Wien. Savojen får Novara och Tortona från Milano.
  Treaty of Belgrade. The Habsburgs return northern Serbia with Belgrade to the Ottomans and Oltenia to Wallachia.: Freden i Belgrad. Habsburgarna återlämnar norra Serbien med Belgrad till osmanerna och Oltenien till Valakiet.
  Preliminary Peace of Breslau (confirmed in Berlin on 28 July). Maria Theresa cedes almost all of Silesia and the county of Glatz to Prussia; Austria keeps Teschen, Troppau and Jägerndorf.: Preliminärfreden i Breslau (bekräftad i Berlin den 28 juli). Maria Teresia avträder nästan hela Schlesien och grevskapet Glatz till Preussen; Österrike behåller Teschen, Troppau och Jägerndorf.
  Sweden at War border state “1743”: Gränsläge ”1743” från Sweden at War
  Treaty of Worms. Maria Theresa promises Savoy the Upper Novarese and Vigevano for its alliance.: Fördraget i Worms. Maria Teresia lovar Savojen övre Novarese och Vigevano i utbyte mot dess allians.
  The last Cirksena count dies and Prussia takes East Frisia.: Den siste greven av ätten Cirksena dör, och Preussen tar Ostfriesland.
  Treaty of Aachen. Parma and Piacenza go to the Spanish Infante Philip.: Freden i Aachen. Parma och Piacenza tillfaller den spanske infanten Filip.
  France takes Fort St Philip and occupies Menorca.: Frankrike intar Fort St Philip och besätter Menorca.
  Treaty of Paris. France returns Menorca to Britain.: Freden i Paris. Frankrike återlämnar Menorca till Storbritannien.
  Catherine II abolishes the office of hetman. The Hetmanate becomes the Little Russia Governorate of the Russian Empire; its last institutions go in 1781.: Katarina II avskaffar hetmansämbetet. Hetmanatet blir guvernementet Lillryssland i Ryska riket; dess sista institutioner avskaffas 1781.
  Revestment Act. The British crown buys the lordship of Man; it stays a crown dependency outside the United Kingdom.: Revestment Act. Den brittiska kronan köper herradömet Man; ön förblir en kronbesittning utanför Storbritannien.
  Stanisław Leszczyński, the former king of Poland, dies, and the duchies of Lorraine and Bar pass to France.: Stanisław Leszczyński, Polens förre kung, dör, och hertigdömena Lothringen och Bar övergår till Frankrike.
  Treaty of Versailles. Genoa, unable to put down the Corsican revolt, cedes Corsica to France.: Fördraget i Versailles. Genua, som inte förmår slå ned det korsikanska upproret, avträder Korsika till Frankrike.
  Most of the Kalmyks leave for Dzungaria, and Catherine II abolishes the Kalmyk Khanate.: De flesta kalmucker utvandrar till Dzungariet, och Katarina II avskaffar Kalmuckiska khanatet.
  First Partition of Poland. Prussia takes Royal Prussia (without Danzig and Thorn) and the Netze District, Austria takes Galicia, and Russia takes Polish Livonia and the lands east of the Dvina and Dnieper.: Polens första delning. Preussen tar Kungliga Preussen (utan Danzig och Thorn) och Netzedistriktet, Österrike tar Galizien och Ryssland tar Polska Livland och landområdena öster om Dvina och Dnepr.
  Treaty of Küçük Kaynarca. Russia gains the steppe north of the Sea of Azov, Azov itself, Kerch and Kinburn, and Kabarda in the northern Caucasus (North Ossetia accepts Russian rule the same year); the Crimean Khanate becomes independent of the Ottomans.: Freden i Küçük Kaynarca. Ryssland vinner stäppen norr om Azovska sjön, själva Azov, Kertj och Kinburn samt Kabarda i norra Kaukasus (Nordossetien underkastar sig ryskt styre samma år); Krimkhanatet blir oberoende av osmanerna.
  The Ottomans cede Bukovina, the north-western corner of Moldavia, to the Habsburgs, who had occupied it in 1774.: Osmanerna avträder Bukovina, Moldaviens nordvästra hörn, till habsburgarna, som hade ockuperat det 1774.
  Russian troops destroy the Zaporozhian Sich; its lands become part of New Russia.: Ryska trupper förstör zaporogkosackernas sitj; dess landområden blir en del av Nya Ryssland.
  The Bavarian Wittelsbachs die out; Charles Theodore, Elector Palatine, inherits Bavaria and unites the two electorates.: Den bayerska grenen av huset Wittelsbach dör ut; Karl Teodor, kurfurste av Pfalz, ärver Bayern och förenar de båda kurfurstendömena.
  Peace of Teschen. Austria gains the Innviertel from Bavaria.: Freden i Teschen. Österrike vinner Innviertel från Bayern.
  A Franco-Spanish force takes Fort St Philip; Spain keeps Menorca at the Peace of Versailles in 1783.: En fransk-spansk styrka intar Fort St Philip; Spanien behåller Menorca vid freden i Versailles 1783.
  historical-basemaps world_1783 (automatic draft, partly hand-corrected): historical-basemaps world_1783 (automatiskt utkast, delvis handkorrigerat)
  Catherine II annexes the Crimean Khanate, with its lands north of the Crimea and on the Kuban.: Katarina II annekterar Krimkhanatet med dess landområden norr om Krim och vid Kuban.
  Sweden at War border state “1788”: Gränsläge ”1788” från Sweden at War
  The National Assembly annexes Avignon and the Comtat Venaissin.: Nationalförsamlingen annekterar Avignon och Comtat Venaissin.
  Treaty of Jassy. The Ottomans cede the land between the Southern Bug and the Dniester, with the southern half of today's Transnistria.: Freden i Jassy. Osmanerna avträder landet mellan Södra Bug och Dnestr, med den södra halvan av dagens Transnistrien.
  Treaty of Jassy. The Ottomans cede Ochakov and the land between the Southern Bug and the Dniester.: Freden i Jassy. Osmanerna avträder Otjakov och landet mellan Södra Bug och Dnestr.
  France annexes Savoy as the department of Mont-Blanc.: Frankrike annekterar Savojen som departementet Mont-Blanc.
  Second Partition of Poland. Podolia, with the northern half of today's Transnistria, goes to Russia.: Polens andra delning. Podolien, med den norra halvan av dagens Transnistrien, tillfaller Ryssland.
  Second Partition of Poland. Prussia takes Greater Poland, Danzig and Thorn; Russia takes central Belarus and right-bank Ukraine.: Polens andra delning. Preussen tar Storpolen, Danzig och Thorn; Ryssland tar mellersta Belarus och Ukraina väster om Dnepr.
  France annexes the county of Nice.: Frankrike annekterar grevskapet Nice.
  France annexes Monaco.: Frankrike annekterar Monaco.
  The northern part of the prince-bishopric of Basel, occupied by France, is annexed as the department of Mont-Terrible.: Den norra delen av furstbiskopsdömet Basel, som Frankrike ockuperat, annekteras som departementet Mont-Terrible.
  Sweden at War border state “1795”: Gränsläge ”1795” från Sweden at War
  The stadtholder flees as French troops cross the frozen rivers; the Batavian Republic is proclaimed.: Ståthållaren flyr när franska trupper tar sig över de frusna floderna; Bataviska republiken utropas.
  Treaty of The Hague. The Batavian Republic cedes Zeelandic Flanders, Maastricht and Venlo to France.: Fördraget i Haag. Bataviska republiken avträder Zeeländska Flandern, Maastricht och Venlo till Frankrike.
  France annexes the Austrian Netherlands and the Prince-Bishopric of Liège; Austria recognises the annexation at Campo Formio (1797).: Frankrike annekterar Österrikiska Nederländerna och furstbiskopsdömet Liège; Österrike erkänner annekteringen i Campo Formio (1797).
  Third Partition of Poland. The Commonwealth disappears from the map. Russia also annexes the Duchy of Courland.: Polens tredje delning. Samväldet försvinner från kartan. Ryssland annekterar också hertigdömet Kurland.
  After the Montenegrin victory at Krusi, the Bjelopavlići and Piperi clans join Montenegro.: Efter den montenegrinska segern vid Krusi ansluter sig klanerna Bjelopavlići och Piperi till Montenegro.
  Treaty of Campo Formio. The Republic of Venice is abolished; Austria takes Venetian Albania with the Bay of Kotor, and France the Ionian Islands.: Freden i Campo Formio. Republiken Venedig upplöses; Österrike tar Venetianska Albanien med Kotorbukten och Frankrike Joniska öarna.
  Treaty of Campo Formio. Austria accepts the French annexation of the left bank of the Rhine, organised as four departments in 1798 and confirmed at Lunéville in 1801.: Freden i Campo Formio. Österrike godtar den franska annekteringen av Rhens vänstra strand, som 1798 organiseras i fyra departement och bekräftas i Lunéville 1801.
  Treaty of Campo Formio. Austria recognises the Cisalpine Republic (Lombardy, Mantua, Modena, Massa and the Papal Legations, with Venetian Bergamo, Brescia and Crema) and receives Venice with the Venetian mainland, Istria and Dalmatia.: Freden i Campo Formio. Österrike erkänner Cisalpinska republiken (Lombardiet, Mantua, Modena, Massa och de påvliga legationerna, med venetianska Bergamo, Brescia och Crema) och får Venedig med det venetianska fastlandet, Istrien och Dalmatien.
  French troops proclaim the Roman Republic; Pius VI is taken into exile.: Franska trupper utropar Romerska republiken; Pius VI förs i exil.
  France annexes Geneva.: Frankrike annekterar Genève.
  The Valais is incorporated into the Helvetic Republic, the French-backed unitary state that replaced the Old Confederacy in April.: Valais införlivas i Helvetiska republiken, den Frankrikestödda enhetsstat som i april ersatt det gamla edsförbundet.
  Napoleon takes Malta from the Knights on his way to Egypt.: Napoleon tar Malta från johanniterorden på väg till Egypten.
  Britain occupies Menorca again.: Storbritannien ockuperar Menorca på nytt.
  The Grisons join the Helvetic Republic as the canton of Raetia.: Graubünden ansluts till Helvetiska republiken som kantonen Raetia.
  Neapolitan troops enter Rome; the Roman Republic ends and papal rule is restored in 1800.: Neapolitanska trupper rycker in i Rom; Romerska republiken upphör, och det påvliga styret återupprättas 1800.
  historical-basemaps world_1800 (automatic draft, partly hand-corrected): historical-basemaps world_1800 (automatiskt utkast, delvis handkorrigerat)
  Russia and the Ottomans set up the Septinsular Republic in the Ionian Islands, under Ottoman suzerainty.: Ryssland och osmanerna upprättar Sjuöarsrepubliken på Joniska öarna, under osmansk överhöghet.
  The French garrison of Valletta surrenders to the British after a two-year siege.: Den franska garnisonen i Valletta kapitulerar för britterna efter två års belägring.
  The Act of Union joins the Kingdom of Ireland to Great Britain as the United Kingdom of Great Britain and Ireland.: Unionsakten förenar Kungariket Irland med Storbritannien till Förenade kungariket Storbritannien och Irland.
  Treaty of Lunéville. After Marengo the Cisalpine Republic is restored, now with Novara, the Ossola and the Lomellina.: Freden i Lunéville. Efter Marengo återupprättas Cisalpinska republiken, nu med Novara, Ossola och Lomellina.
  Treaty of Badajoz, after the War of the Oranges. Portugal cedes Olivenza to Spain.: Freden i Badajoz efter apelsinkriget. Portugal avträder Olivenza till Spanien.
  Alexander I annexes the kingdom of Kartli-Kakheti (eastern Georgia).: Alexander I annekterar kungariket Kartli-Kachetien (östra Georgien).
  Treaty of Amiens. Britain returns Menorca to Spain.: Freden i Amiens. Storbritannien återlämnar Menorca till Spanien.
  Napoleon detaches the Valais from Switzerland as a separate republic.: Napoleon skiljer Valais från Schweiz som en separat republik.
  France annexes Piedmont.: Frankrike annekterar Piemonte.
  Mingrelia accepts Russian rule, and a Russian expedition subdues the Jar-Belokani communities.: Mingrelien underkastar sig ryskt styre, och en rysk expedition kuvar samfunden i Djar-Belokani.
  Reichsdeputationshauptschluss. Almost all ecclesiastical states and most imperial cities are given to the secular princes as compensation for the left bank of the Rhine.: Reichsdeputationshauptschluss. Nästan alla andliga stater och de flesta riksstäder tilldelas de världsliga furstarna som ersättning för Rhens vänstra strand.
  Russian troops storm Ganja; the khanate is annexed.: Ryska trupper stormar Ganja; khanatet annekteras.
  France annexes the Ligurian Republic.: Frankrike annekterar Liguriska republiken.
  The sultan recognises Muhammad Ali, chosen by Cairo’s notables, as governor of Egypt; he and his heirs rule it as an autonomous state.: Sultanen erkänner Muhammad Ali, som valts av Kairos notabiliteter, som guvernör över Egypten; han och hans arvingar styr landet som en autonom stat.
  Treaty of Pressburg. Austria cedes the former Venetian lands, with the Bay of Kotor, to Napoleon’s Kingdom of Italy.: Freden i Pressburg. Österrike avträder de tidigare venetianska områdena, med Kotorbukten, till Napoleons kungarike Italien.
  Peace of Pressburg. Austria cedes Tyrol and Vorarlberg to Bavaria and Further Austria to Baden and Württemberg, and gains Salzburg.: Freden i Pressburg. Österrike avträder Tyrolen och Vorarlberg till Bayern och Främre Österrike till Baden och Württemberg, och vinner Salzburg.
  Peace of Pressburg. Austria cedes Venetia, Venetian Istria and Dalmatia to the Kingdom of Italy.: Freden i Pressburg. Österrike avträder Venetien, venetianska Istrien och Dalmatien till kungariket Italien.
  Russian forces take Baku, Derbent and Quba.: Ryska styrkor intar Baku, Derbent och Quba.
  Prussia cedes Neuchâtel to Napoleon, who gives it to Marshal Berthier.: Preussen avträder Neuchâtel till Napoleon, som ger det till marskalk Berthier.
  Napoleon creates the Grand Duchy of Berg for Joachim Murat from Berg and the Prussian part of Cleves.: Napoleon skapar storhertigdömet Berg åt Joachim Murat av Berg och den preussiska delen av Kleve.
  Napoleon joins Massa and Carrara to his sister Elisa’s Principality of Lucca.: Napoleon förenar Massa och Carrara med sin syster Elisas furstendöme Lucca.
  The Confederation of the Rhine. Its members leave the Empire, which Francis II dissolves on 6 August, and absorb the remaining counts and knights.: Rhenförbundet. Dess medlemmar lämnar riket, som Frans II upplöser den 6 augusti, och uppslukar de kvarvarande grevskapen och riddarherrskapen.
  Sweden at War border state “1807”: Gränsläge ”1807” från Sweden at War
  Treaty of Tilsit. Russia gives the Ionian Islands to France.: Freden i Tilsit. Ryssland överlämnar Joniska öarna till Frankrike.
  Peace of Tilsit. Prussia loses all its lands west of the Elbe; Erfurt becomes a French imperial domain.: Freden i Tilsit. Preussen förlorar alla sina landområden väster om Elbe; Erfurt blir en fransk kejserlig domän.
  Treaties of Tilsit. Napoleon makes the Duchy of Warsaw out of Prussia's partition gains; Danzig becomes a free city and Białystok goes to Russia.: Freden i Tilsit. Napoleon bildar hertigdömet Warszawa av Preussens vinster vid delningarna; Danzig blir fristad och Białystok tillfaller Ryssland.
  Napoleon creates the Kingdom of Westphalia for his brother Jérôme from Hesse-Kassel, Brunswick and Prussia’s lands west of the Elbe.: Napoleon skapar kungariket Westfalen åt sin bror Jérôme av Hessen-Kassel, Braunschweig och Preussens landområden väster om Elbe.
  East Frisia is given to the Kingdom of Holland.: Ostfriesland överlämnas till kungariket Holland.
  Mark, Münster and other former Prussian lands are added to the Grand Duchy of Berg.: Mark, Münster och andra tidigare preussiska områden läggs till storhertigdömet Berg.
  Marshal Marmont abolishes the Republic of Ragusa, which is joined to the Kingdom of Italy.: Marskalk Marmont upplöser republiken Ragusa, som förenas med kungariket Italien.
  Napoleon annexes the Marches, taken from the Papal States, to the Kingdom of Italy.: Napoleon införlivar Marche, som tagits från Kyrkostaten, med kungariket Italien.
  France annexes Parma and Tuscany (the Kingdom of Etruria, dissolved in December 1807).: Frankrike annekterar Parma och Toscana (kungariket Etrurien, upplöst i december 1807).
  Sweden at War border state “1809”: Gränsläge ”1809” från Sweden at War
  Napoleon annexes Rome and the rest of the Papal States to France; Pius VII is arrested in July.: Napoleon införlivar Rom och resten av Kyrkostaten med Frankrike; Pius VII arresteras i juli.
  Treaty of Fredrikshamn. Sweden cedes Finland and Åland to Russia. Alexander I had already promised the Diet of Porvoo (March 1809) to rule Finland as an autonomous grand duchy.: Freden i Fredrikshamn. Sverige avträder Finland och Åland till Ryssland. Alexander I hade redan lovat Borgå lantdag (mars 1809) att styra Finland som ett autonomt storfurstendöme.
  Treaty of Schönbrunn. Austria cedes Carniola, Gorizia, Trieste, Istria, western Carinthia and Croatia south of the Sava; with Dalmatia, Ragusa and Kotor from the Kingdom of Italy they form the Illyrian Provinces of the French Empire.: Freden i Schönbrunn. Österrike avträder Krain, Gorizia, Trieste, Istrien, västra Kärnten och Kroatien söder om Sava; tillsammans med Dalmatien, Ragusa och Kotor från kungariket Italien bildar de Franska kejsardömets illyriska provinser.
  Treaty of Schönbrunn. After the Austro-Polish War, the Duchy of Warsaw gains West Galicia with Kraków; Russia takes the Tarnopol district.: Freden i Schönbrunn. Efter det österrikisk-polska kriget vinner hertigdömet Warszawa Västgalizien med Kraków; Ryssland tar distriktet Tarnopol.
  Russia deposes King Solomon II and annexes Imereti. Abkhazia and Guria become Russian protectorates (both are annexed outright later, Guria in 1829).: Ryssland avsätter kung Salomo II och annekterar Imeretien. Abchazien och Gurien blir ryska protektorat (båda annekteras helt senare, Gurien 1829).
  Treaty of Paris between France and Bavaria. Bavaria gains Salzburg and the Innviertel (ceded by Austria at Schönbrunn) and gives South Tyrol and Trentino to the Kingdom of Italy.: Fördraget i Paris mellan Frankrike och Bayern. Bayern vinner Salzburg och Innviertel (som Österrike avträtt i Schönbrunn) och överlämnar Sydtyrolen och Trentino till kungariket Italien.
  Most of Hanover, under French occupation since 1803, is given to the Kingdom of Westphalia.: Större delen av Hannover, under fransk ockupation sedan 1803, överlämnas till kungariket Westfalen.
  Louis Bonaparte cedes the Dutch lands south of the Waal to France.: Louis Bonaparte avträder de nederländska områdena söder om Waal till Frankrike.
  Napoleon annexes the Kingdom of Holland to France.: Napoleon införlivar kungariket Holland med Frankrike.
  France annexes the Kingdom of Holland, with East Frisia.: Frankrike annekterar kungariket Holland med Ostfriesland.
  France annexes the Valais as the département of the Simplon, to secure the road over the Simplon Pass.: Frankrike annekterar Valais som departementet Simplon för att säkra vägen över Simplonpasset.
  France annexes the North Sea coast of Germany, with Oldenburg, Bremen, Hamburg, Lübeck and Lauenburg.: Frankrike annekterar Tysklands Nordsjökust med Oldenburg, Bremen, Hamburg, Lübeck och Lauenburg.
  Alexander I joins “Old Finland”, the Vyborg province taken from Sweden in 1721 and 1743, to the Grand Duchy.: Alexander I förenar ”Gamla Finland”, Viborgs län som tagits från Sverige 1721 och 1743, med storfurstendömet.
  Treaty of Bucharest. The Ottomans cede the eastern half of Moldavia, between the Prut and the Dniester, which Russia names Bessarabia.: Freden i Bukarest. Osmanerna avträder Moldaviens östra halva, mellan Prut och Dnestr, som Ryssland ger namnet Bessarabien.
  Treaty of Gulistan. Persia recognises Russian rule over Georgia, Dagestan and the khanates north of the Aras, including Talysh.: Freden i Gulistan. Persien erkänner ryskt styre över Georgien, Dagestan och khanaten norr om Aras, däribland Talysj.
  After Leipzig the Kingdom of Westphalia collapses; the Elector of Hesse, the Duke of Brunswick, Prussia and Hanover return.: Efter Leipzig bryter kungariket Westfalen samman; kurfursten av Hessen, hertigen av Braunschweig, Preussen och Hannover återvänder.
  The Allies take over north-west Germany; the Grand Duchy of Berg comes under Prussian-led administration and the French departments on the coast are dissolved (Hamburg holds out until May 1814).: De allierade tar över nordvästra Tyskland; storhertigdömet Berg kommer under preussiskledd förvaltning, och de franska departementen vid kusten upplöses (Hamburg håller ut till maj 1814).
  The French have left the northern Netherlands; William of Orange returns and is proclaimed sovereign prince.: Fransmännen har lämnat norra Nederländerna; Vilhelm av Oranien återvänder och utropas till suverän furste.
  Austrian troops enter the Valais and the French department of the Simplon is dissolved.: Österrikiska trupper rycker in i Valais, och det franska departementet Simplon upplöses.
  The French leave Geneva, which restores its republic.: Fransmännen lämnar Genève, som återupprättar sin republik.
  The French garrison of Erfurt surrenders; the town returns to Prussia.: Den franska garnisonen i Erfurt kapitulerar; staden återgår till Preussen.
  Treaty of Kiel. Norway goes to Sweden, but Iceland, the Faroes and Greenland stay with Denmark. The kingdom is Denmark alone again, with the duchies.: Freden i Kiel. Norge tillfaller Sverige, men Island, Färöarna och Grönland stannar hos Danmark. Kungariket är åter bara Danmark, med hertigdömena.
  Sweden at War border state “1814”: Gränsläge ”1814” från Sweden at War
  Treaty of Fontainebleau. Parma and Piacenza go to Napoleon’s wife Marie Louise.: Fördraget i Fontainebleau. Parma och Piacenza tillfaller Napoleons hustru Marie-Louise.
  Lord William Bentinck restores the Republic of Genoa.: Lord William Bentinck återupprättar republiken Genua.
  Davout’s garrison leaves Hamburg.: Davouts garnison lämnar Hamburg.
  After Austria reconquers the Illyrian Provinces in 1813, the First Peace of Paris returns them, with Dalmatia, Ragusa and Kotor, to Austria.: Sedan Österrike återerövrat Illyriska provinserna 1813 återlämnas de genom första Parisfreden, med Dalmatien, Ragusa och Kotor, till Österrike.
  First Peace of Paris. France gives up Nice; it keeps Chambéry and Annecy for now.: Första Parisfreden. Frankrike ger upp Nice men behåller tills vidare Chambéry och Annecy.
  First Peace of Paris. France gives up the left bank of the Rhine except Saarbrücken and Saarlouis; the north comes under Prussian administration, the Palatinate and Rhenish Hesse under a joint Austrian–Bavarian one.: Första Parisfreden. Frankrike ger upp Rhens vänstra strand utom Saarbrücken och Saarlouis; norra delen kommer under preussisk förvaltning, Pfalz och Rheinhessen under en gemensam österrikisk-bayersk.
  First Peace of Paris. Austria, whose troops had occupied northern Italy in April, receives Lombardy and Venetia; Piedmont, Novara and Nice return to Sardinia, the Papal States to the pope, Tuscany to its grand duke, Modena to the Este, Massa to Maria Beatrice d’Este, and Monaco to its prince.: Första Parisfreden. Österrike, vars trupper hade ockuperat norra Italien i april, får Lombardiet och Venetien; Piemonte, Novara och Nice återgår till Sardinien, Kyrkostaten till påven, Toscana till sin storhertig, Modena till huset Este, Massa till Maria Beatrice d’Este och Monaco till sin furste.
  Bavaria returns Tyrol and Vorarlberg to Austria, which also takes back Trentino and South Tyrol from the Kingdom of Italy.: Bayern återlämnar Tyrolen och Vorarlberg till Österrike, som också tar tillbaka Trentino och Sydtyrolen från kungariket Italien.
  The Eight Articles of London. The Allies agree to unite the former Austrian Netherlands with the Dutch state under William of Orange, who takes over their government in August.: Londons åtta artiklar. De allierade enas om att förena de forna Österrikiska Nederländerna med den nederländska staten under Vilhelm av Oranien, som tar över styret där i augusti.
  Sweden at War border state “1814b”: Gränsläge ”1814b” från Sweden at War
  historical-basemaps world_1815 (automatic draft, partly hand-corrected): historical-basemaps world_1815 (automatiskt utkast, delvis handkorrigerat)
  The Congress of Vienna gives Genoa and Liguria to the Kingdom of Sardinia.: Wienkongressen överlämnar Genua och Ligurien till kungariket Sardinien.
  The powers at Vienna award the former prince-bishopric of Basel to Bern.: Stormakterna i Wien tilldelar Bern det forna furstbiskopsdömet Basel.
  The Valais, Neuchâtel and Geneva join the Confederation as cantons (Neuchâtel remains a principality of the King of Prussia until 1848).: Valais, Neuchâtel och Genève ansluter sig till edsförbundet som kantoner (Neuchâtel förblir ett furstendöme under kungen av Preussen till 1848).
  Denmark gains Lauenburg as compensation for Norway and Swedish Pomerania (taking possession in 1816). Holstein and Lauenburg join the German Confederation.: Danmark får Lauenburg som ersättning för Norge och Svenska Pommern (och tar det i besittning 1816). Holstein och Lauenburg går med i Tyska förbundet.
  Final Act of the Congress of Vienna. Luxembourg becomes a grand duchy in personal union with the Netherlands and a member of the German Confederation; Eupen and Malmedy go to Prussia.: Wienkongressens slutakt. Luxemburg blir ett storhertigdöme i personalunion med Nederländerna och medlem av Tyska förbundet; Eupen och Malmedy tillfaller Preussen.
  Final Act of the Congress of Vienna. Saxony cedes the north of the kingdom, with Lower Lusatia and northern Upper Lusatia, to Prussia; Prussia gains the Rhineland and Westphalia; Hanover gains East Frisia.: Wienkongressens slutakt. Sachsen avträder kungarikets norra del, med Niederlausitz och norra Oberlausitz, till Preussen; Preussen vinner Rhenlandet och Westfalen; Hannover vinner Ostfriesland.
  Final Act of the Congress of Vienna. The Kingdom of Poland (Congress Poland) is created in union with Russia, Kraków becomes a free city, and Prussia keeps Posen and Danzig.: Wienkongressens slutakt. Kungariket Polen (Kongresspolen) skapas i union med Ryssland, Kraków blir fristad och Preussen behåller Posen och Danzig.
  Prussia takes over Swedish Pomerania, which Denmark (given it at Kiel in 1814) has exchanged for Lauenburg.: Preussen tar över Svenska Pommern, som Danmark (som fått det i Kiel 1814) har bytt mot Lauenburg.
  Treaty of Paris. The Ionian Islands become the United States of the Ionian Islands under British protection.: Fördraget i Paris. Joniska öarna blir Förenta staterna Joniska öarna under brittiskt beskydd.
  Second Peace of Paris. France returns the rest of Savoy to the Kingdom of Sardinia.: Andra Parisfreden. Frankrike återlämnar resten av Savojen till kungariket Sardinien.
  Second Peace of Paris. France cedes Saarbrücken and Saarlouis.: Andra Parisfreden. Frankrike avträder Saarbrücken och Saarlouis.
  Treaty of Munich (14 April). Bavaria returns Salzburg and the Innviertel to Austria and receives the Palatinate on the left bank of the Rhine.: Fördraget i München (14 april). Bayern återlämnar Salzburg och Innviertel till Österrike och får Pfalz på Rhens vänstra strand.
  Hesse-Darmstadt takes possession of Rhenish Hesse (Mainz, Worms, Alzey).: Hessen-Darmstadt tar Rheinhessen (Mainz, Worms, Alzey) i besittning.
  Ferdinand IV of Naples, restored in 1815, unites his kingdoms as the Kingdom of the Two Sicilies.: Ferdinand IV av Neapel, återinsatt 1815, förenar sina riken till Kungariket Bägge Sicilierna.
  The assembly in Belgrade recognises Miloš Obrenović as hereditary prince. Serbia, autonomous in practice since the Second Serbian Uprising (1815), has its status confirmed by the sultan in 1830.: Församlingen i Belgrad erkänner Miloš Obrenović som ärftlig furste. Serbien, i praktiken självstyrande sedan det andra serbiska upproret (1815), får sin ställning bekräftad av sultanen 1830.
  Treaty of Turkmenchay. Persia cedes the khanates of Erivan and Nakhchivan.: Freden i Turkmantjaj. Persien avträder khanaten Erivan och Nachitjevan.
  After the Battle of Khasauka, Karachay is annexed.: Efter slaget vid Chasauka annekteras Karatjaj.
  Treaty of Adrianople. The Ottoman fortresses on the Danube’s left bank, Brăila among them, go back to Wallachia, and the principalities come under Russian protection.: Freden i Adrianopel. De osmanska fästningarna på Donaus vänstra strand, bland dem Brăila, återgår till Valakiet, och furstendömena kommer under ryskt beskydd.
  Treaty of Adrianople. The Ottomans cede Akhaltsikhe and Akhalkalaki and recognise Russian rule over Georgia and the eastern Black Sea coast.: Freden i Adrianopel. Osmanerna avträder Achaltsiche och Achalkalaki och erkänner ryskt styre över Georgien och Svarta havets östra kust.
  Maria Beatrice d’Este dies; Massa and Carrara pass to her son, Duke Francis IV of Modena.: Maria Beatrice d’Este dör; Massa och Carrara övergår till hennes son, hertig Frans IV av Modena.
  "London Protocol. Britain, France and Russia recognise Greece as an independent kingdom: the Peloponnese, Central Greece south of a line from the Aspropotamos to Zitouni, Euboea and the Cyclades.": "Londonprotokollet. Storbritannien, Frankrike och Ryssland erkänner Grekland som ett självständigt kungarike: Peloponnesos, Mellersta Grekland söder om en linje från Aspropotamos till Zitouni, Euboia och Kykladerna."
  The sultan gives Crete to Muhammad Ali of Egypt in return for his help against the Greek revolution.: Sultanen ger Kreta till Muhammad Ali av Egypten som tack för hans hjälp mot den grekiska revolutionen.
  The Belgian revolution. A provisional government declares Belgium independent of the United Kingdom of the Netherlands; Limburg (except Maastricht) and most of Luxembourg join the revolt.: Belgiska revolutionen. En provisorisk regering förklarar Belgien oberoende av Förenade kungariket Nederländerna; Limburg (utom Maastricht) och större delen av Luxemburg ansluter sig till upproret.
  Treaty of Constantinople. The Ottomans accept the Arta–Volos line, which adds Acarnania to Greece.: Fördraget i Konstantinopel. Osmanerna godtar linjen Arta–Volos, vilket lägger Akarnanien till Grekland.
  A decree of the sultan adds six districts to Serbia, among them the Krajina, Crna Reka and Kruševac.: Ett dekret från sultanen lägger sex distrikt till Serbien, bland dem Krajina, Crna Reka och Kruševac.
  Convention of Kütahya. After Ibrahim Pasha’s victories, the sultan gives Muhammad Ali Syria, Palestine and the district of Adana.: Konventionen i Kütahya. Efter Ibrahim pashas segrar ger sultanen Muhammad Ali Syrien, Palestina och distriktet Adana.
  Treaty of London. The Netherlands recognises Belgium; Limburg and Luxembourg are divided, the eastern halves staying with William I.: Londonfördraget. Nederländerna erkänner Belgien; Limburg och Luxemburg delas, och de östra halvorna stannar hos Vilhelm I.
  Muhammad Ali accepts the London convention and returns Crete and Syria to the Ottomans.: Muhammad Ali godtar Londonkonventionen och återlämnar Kreta och Syrien till osmanerna.
  Under pressure from Britain, Austria and Russia, Muhammad Ali accepts the London convention and gives up Syria and Adana; Egypt becomes his family’s hereditary governorship.: Under tryck från Storbritannien, Österrike och Ryssland godtar Muhammad Ali Londonkonventionen och ger upp Syrien och Adana; Egypten blir ett ärftligt guvernörskap för hans familj.
  After the Kraków Uprising, Austria annexes the Free City as the Grand Duchy of Kraków.: Efter Krakówupproret annekterar Österrike fristaden som storfurstendömet Kraków.
  Duke Charles Louis hands Lucca to Tuscany.: Hertig Karl Ludvig överlämnar Lucca till Toscana.
  The princes of Hohenzollern-Hechingen and Hohenzollern-Sigmaringen cede their lands to Prussia.: Furstarna av Hohenzollern-Hechingen och Hohenzollern-Sigmaringen avträder sina länder till Preussen.
  Treaty of Paris. After the Crimean War Russia cedes southern Bessarabia (Cahul, Bolgrad, Izmail) to Moldavia, keeping it away from the mouths of the Danube.: Freden i Paris. Efter Krimkriget avträder Ryssland södra Bessarabien (Cahul, Bolgrad, Izmail) till Moldavien, vilket håller Ryssland borta från Donaus mynningar.
  Alexandru Ioan Cuza, already prince of Moldavia, is elected prince of Wallachia too. The United Principalities take the name Romania in 1862 and become independent in 1878.: Alexandru Ioan Cuza, redan furste av Moldavien, väljs även till furste av Valakiet. De förenade furstendömena antar namnet Rumänien 1862 och blir självständiga 1878.
  Alexandru Ioan Cuza is elected prince of both Moldavia and Wallachia, the start of Romania.: Alexandru Ioan Cuza väljs till furste av både Moldavien och Valakiet – början på Rumänien.
  Imam Shamil surrenders at Gunib; Chechnya and mountain Dagestan come under Russian rule.: Imam Sjamil kapitulerar vid Gunib; Tjetjenien och det bergiga Dagestan kommer under ryskt styre.
  A boundary commission marks Montenegro’s border after its victory at Grahovac (1858), adding Grahovo, Drobnjak and the upper Vasojevići.: En gränskommission märker ut Montenegros gräns efter segern vid Grahovac (1858), vilket lägger till Grahovo, Drobnjak och övre Vasojevići.
  Treaty of Zürich. After the Second Italian War of Independence, Austria cedes Lombardy (without Mantua) to France, which passes it to Sardinia.: Freden i Zürich. Efter det andra italienska frihetskriget avträder Österrike Lombardiet (utan Mantua) till Frankrike, som överlämnar det till Sardinien.
  After plebiscites, Sardinia annexes Parma, Modena and the Papal Legations (Emilia and Romagna).: Efter folkomröstningar annekterar Sardinien Parma, Modena och de påvliga legationerna (Emilia och Romagna).
  Sardinia annexes Tuscany after a plebiscite.: Sardinien annekterar Toscana efter en folkomröstning.
  Treaty of Turin. Sardinia cedes Savoy and Nice to France in return for its support in 1859; plebiscites in April confirm the transfer.: Fördraget i Turin. Sardinien avträder Savojen och Nice till Frankrike som tack för dess stöd 1859; folkomröstningar i april bekräftar överlåtelsen.
  Sardinia annexes the Two Sicilies, conquered by Garibaldi’s Thousand and the Sardinian army, and the Marche and Umbria, taken from the Papal States, after plebiscites. Gaeta holds out until February 1861.: Efter folkomröstningar annekterar Sardinien Bägge Sicilierna, som erövrats av Garibaldis tusen och den sardinska armén, samt Marche och Umbrien, som tagits från Kyrkostaten. Gaeta håller ut till februari 1861.
  The Kingdom of Italy is proclaimed in Turin, with Victor Emmanuel II as king.: Kungariket Italien utropas i Turin med Viktor Emanuel II som kung.
  The last Circassian resistance ends at Kbaade (Krasnaya Polyana). Most Circassians are killed or driven out to the Ottoman Empire.: Det sista tjerkessiska motståndet upphör vid Kbaade (Krasnaja Poljana). De flesta tjerkesser dödas eller fördrivs till Osmanska riket.
  Britain hands the Ionian Islands to Greece, as agreed in the Treaty of London of March 1864.: Storbritannien överlämnar Joniska öarna till Grekland, enligt Londonfördraget från mars 1864.
  Treaty of Vienna. After the Second Schleswig War, Denmark cedes Schleswig, Holstein and Lauenburg to Prussia and Austria jointly.: Freden i Wien. Efter det andra slesvigska kriget avträder Danmark Slesvig, Holstein och Lauenburg till Preussen och Österrike gemensamt.
  Gastein Convention. Prussia takes over Schleswig and buys Lauenburg; Austria administers Holstein.: Gasteinkonventionen. Preussen tar över Slesvig och köper Lauenburg; Österrike förvaltar Holstein.
  Peace of Prague. After the Austro-Prussian War, Austria gives up Holstein; Prussia annexes the duchies.: Freden i Prag. Efter preussisk-österrikiska kriget ger Österrike upp Holstein; Preussen annekterar hertigdömena.
  After the Austro-Prussian War Prussia annexes Hanover, Hesse-Kassel, Nassau and Frankfurt (the law of 20 September; Schleswig-Holstein follows in 1867).: Efter preussisk-österrikiska kriget annekterar Preussen Hannover, Hessen-Kassel, Nassau och Frankfurt (lagen av den 20 september; Slesvig-Holstein följer 1867).
  Treaty of Vienna. After the war of 1866, in which Italy fought on Prussia’s side, Austria cedes Venetia and Mantua (through France) to Italy.: Freden i Wien. Efter kriget 1866, där Italien stred på Preussens sida, avträder Österrike Venetien och Mantua (via Frankrike) till Italien.
  After the January Uprising, the Kingdom of Poland loses its separate administration and is governed as provinces of the Russian Empire (the "Vistula Land").: Efter januariupproret förlorar kungariket Polen sin egen förvaltning och styrs som provinser i Ryska riket (”Weichsellandet”).
  The Austro-Hungarian Compromise.: Den österrikisk-ungerska utjämningen.
  "The Austro-Hungarian Compromise. The Austrian Empire becomes the Dual Monarchy of Austria-Hungary: Hungary with Transylvania, Croatia–Slavonia and the Banat under a government in Budapest; Slovenia, Istria, Dalmatia and Bukovina under Vienna.": "Den österrikisk-ungerska utjämningen. Kejsardömet Österrike blir dubbelmonarkin Österrike-Ungern: Ungern med Transsylvanien, Kroatien–Slavonien och Banatet under en regering i Budapest; Slovenien, Istrien, Dalmatien och Bukovina under Wien."
  The Austro-Hungarian Compromise. Bukovina stays in the Austrian half of the monarchy.: Den österrikisk-ungerska utjämningen. Bukovina stannar i monarkins österrikiska halva.
  The Austro-Hungarian Compromise. The Austrian Empire becomes the Dual Monarchy of Austria-Hungary, with a Hungarian government in Budapest under the same monarch.: Den österrikisk-ungerska utjämningen. Kejsardömet Österrike blir dubbelmonarkin Österrike-Ungern, med en ungersk regering i Budapest under samma monark.
  Italian troops entered Rome on 20 September after the French garrison left; Lazio is annexed after a plebiscite, and Rome becomes the capital. The pope withdraws into the Vatican.: Italienska trupper ryckte in i Rom den 20 september sedan den franska garnisonen lämnat staden; Lazio annekteras efter en folkomröstning, och Rom blir huvudstad. Påven drar sig tillbaka till Vatikanen.
  The German Empire is proclaimed.: Tyska kejsarriket utropas.
  The German Empire is proclaimed; Eupen and Malmedy are part of Prussia within it.: Tyska kejsarriket utropas; Eupen och Malmedy ingår i Preussen inom riket.
  The German Empire is proclaimed at Versailles; the German states, still with their own rulers, form one federal empire under the King of Prussia.: Tyska kejsarriket utropas i Versailles; de tyska staterna, som behåller sina egna furstar, bildar ett federalt kejsarrike under kungen av Preussen.
  The German Empire is proclaimed; Prussia's Polish provinces become part of it.: Tyska kejsarriket utropas; Preussens polska provinser blir en del av det.
  Treaty of Frankfurt. France cedes Alsace and part of Lorraine to the German Empire.: Freden i Frankfurt. Frankrike avträder Elsass och en del av Lothringen till Tyska kejsarriket.
  Cyprus Convention. The Ottomans hand the administration of Cyprus to Britain in return for an alliance against Russia; Britain annexes it in 1914.: Cypernkonventionen. Osmanerna överlämnar förvaltningen av Cypern till Storbritannien i utbyte mot en allians mot Ryssland; Storbritannien annekterar ön 1914.
  Congress of Berlin. Romania, Serbia and Montenegro become independent and gain land; Romania takes northern Dobruja in exchange for southern Bessarabia. A smaller Bulgaria than the one agreed at San Stefano becomes an autonomous principality, Eastern Rumelia an autonomous Ottoman province. Austria-Hungary occupies Bosnia and Herzegovina.: Berlinkongressen. Rumänien, Serbien och Montenegro blir självständiga och vinner land; Rumänien tar norra Dobrudja i utbyte mot södra Bessarabien. Ett mindre Bulgarien än det som avtalats i San Stefano blir ett autonomt furstendöme, Östrumelien en autonom osmansk provins. Österrike-Ungern ockuperar Bosnien och Hercegovina.
  Congress of Berlin. Romania, now independent, returns southern Bessarabia to Russia and receives Northern Dobruja instead.: Berlinkongressen. Rumänien, nu självständigt, återlämnar södra Bessarabien till Ryssland och får i stället norra Dobrudja.
  Congress of Berlin. The Ottomans cede Kars, Ardahan and Batumi to Russia.: Berlinkongressen. Osmanerna avträder Kars, Ardahan och Batumi till Ryssland.
  historical-basemaps world_1880 (automatic draft, partly hand-corrected): historical-basemaps world_1880 (automatiskt utkast, delvis handkorrigerat)
  Under pressure from the Great Powers, the Ottomans hand Ulcinj to Montenegro in place of Plav and Gusinje.: Under tryck från stormakterna överlämnar osmanerna Ulcinj till Montenegro i stället för Plav och Gusinje.
  Convention of Constantinople. The Ottomans cede Thessaly and the district of Arta to Greece.: Konventionen i Konstantinopel. Osmanerna avträder Thessalien och distriktet Arta till Grekland.
  A bloodless coup in Plovdiv unites Eastern Rumelia with Bulgaria; the union survives the Serbo-Bulgarian War that follows.: En oblodig kupp i Plovdiv förenar Östrumelien med Bulgarien; unionen överlever det serbisk-bulgariska krig som följer.
  Prince George of Greece arrives as high commissioner of the autonomous Cretan State; the last Ottoman troops left in November.: Prins Georg av Grekland anländer som överkommissarie för den autonoma Kretensiska staten; de sista osmanska trupperna lämnade ön i november.
  historical-basemaps world_1900 (automatic draft, partly hand-corrected): historical-basemaps world_1900 (automatiskt utkast, delvis handkorrigerat)
  Sweden recognises the dissolution of the union. Norway is a fully independent kingdom (Haakon VII is elected in November).: Sverige erkänner unionsupplösningen. Norge är ett helt självständigt kungarike (Haakon VII väljs i november).
  Treaty of Ouchy ends the Italo-Turkish War. Italy keeps the Dodecanese, occupied in May 1912, pending an Ottoman withdrawal from Libya that never fully happens.: Freden i Ouchy avslutar italiensk-turkiska kriget. Italien behåller Dodekanesos, som ockuperats i maj 1912, i väntan på ett osmanskt tillbakadragande från Libyen som aldrig helt genomförs.
  "Treaty of London. The Ottomans give up everything west of a line from Enos to Midia. The allies keep the land they occupied: Serbia most of Macedonia, Kosovo and the Sandžak; Greece southern Macedonia and Epirus; Montenegro the upper Lim valley and western Kosovo; Bulgaria eastern Macedonia, Thrace and the Rhodopes.": "Londonfördraget. Osmanerna ger upp allt väster om en linje från Enos till Midia. De allierade behåller det land de ockuperat: Serbien större delen av Makedonien, Kosovo och Sandžak; Grekland södra Makedonien och Epirus; Montenegro övre Limdalen och västra Kosovo; Bulgarien östra Makedonien, Thrakien och Rhodoperna."
  The Conference of Ambassadors in London recognises Albania as an independent principality; its southern border follows in December.: Ambassadörskonferensen i London erkänner Albanien som ett självständigt furstendöme; dess södra gräns fastställs i december.
  Treaty of Bucharest ends the Second Balkan War. Greece takes eastern Macedonia with Kavala, Romania southern Dobruja; Bulgaria keeps the Strumica valley and western Thrace.: Freden i Bukarest avslutar andra Balkankriget. Grekland tar östra Makedonien med Kavala, Rumänien södra Dobrudja; Bulgarien behåller Strumicadalen och västra Thrakien.
  Treaty of Constantinople. Bulgaria returns Adrianople and eastern Thrace, retaken by the Ottomans in July.: Freden i Konstantinopel. Bulgarien återlämnar Adrianopel och östra Thrakien, som osmanerna återtog i juli.
  Treaty of Athens between Greece and the Ottomans. The Great Powers award Greece the north-eastern Aegean islands occupied in 1912 (February 1914); the Ottomans accept it only at Lausanne in 1923.: Freden i Aten mellan Grekland och osmanerna. Stormakterna tilldelar Grekland de nordöstra Egeiska öarna som ockuperats 1912 (februari 1914); osmanerna godtar det först i Lausanne 1923.
  Crete is formally united with Greece.: Kreta förenas formellt med Grekland.
  The Protocol of Florence gives Gjirokastër and Korçë to Albania; Greek troops leave in 1914.: Florensprotokollet tilldelar Albanien Gjirokastër och Korçë; de grekiska trupperna lämnar området 1914.
  historical-basemaps world_1914 (automatic draft, partly hand-corrected): historical-basemaps world_1914 (automatiskt utkast, delvis handkorrigerat)
  Russia's Provisional Government recognises Poland's right to independence. Congress Poland, occupied by Germany and Austria-Hungary since 1915, is ruled by the Kingdom of Poland they proclaimed in November 1916, a client state under a Regency Council from October 1917 (shown as Poland).: Rysslands provisoriska regering erkänner Polens rätt till självständighet. Kongresspolen, ockuperat av Tyskland och Österrike-Ungern sedan 1915, styrs av det kungarike Polen som de utropade i november 1916, en klientstat under ett regentskapsråd från oktober 1917 (visas som Polen).
  October Revolution. The left bank of the Dniester is claimed by Soviet Russia.: Oktoberrevolutionen. Sovjetryssland gör anspråk på Dnestrs vänstra strand.
  October Revolution. The northern Caucasus is fought over in the Russian Civil War (not shown); Transcaucasia stays outside Soviet rule.: Oktoberrevolutionen. Om norra Kaukasus strids under ryska inbördeskriget (visas inte); Transkaukasien förblir utanför sovjetiskt styre.
  October Revolution. The Bolsheviks take power in Estonia and the unoccupied parts of Latvia and Belarus; German forces have held Lithuania, Courland, Grodno and Brest since 1915 and Riga since September 1917.: Oktoberrevolutionen. Bolsjevikerna tar makten i Estland och de icke ockuperade delarna av Lettland och Belarus; tyska styrkor har hållit Litauen, Kurland, Grodno och Brest sedan 1915 och Riga sedan september 1917.
  October Revolution. The Bolsheviks take power in Petrograd; the shifting fronts of the Russian Civil War are not shown.: Oktoberrevolutionen. Bolsjevikerna tar makten i Petrograd; ryska inbördeskrigets skiftande fronter visas inte.
  The Finnish parliament declares independence; Soviet Russia recognises it on 31 December.: Finlands lantdag förklarar landet självständigt; Sovjetryssland erkänner självständigheten den 31 december.
  The Ukrainian People's Republic declares independence, claiming the left bank of the Dniester.: Ukrainska folkrepubliken förklarar sig självständig och gör anspråk på Dnestrs vänstra strand.
  The Fourth Universal. The Ukrainian People's Republic declares independence.: Fjärde universalen. Ukrainska folkrepubliken förklarar sig självständig.
  Act of Independence of Lithuania, signed in German-occupied Vilnius.: Litauens självständighetsförklaring undertecknas i det tyskockuperade Vilnius.
  Estonia declares independence, a day before German troops take Tallinn. Its borders are settled by the Treaty of Tartu (1920).: Estland förklarar sig självständigt, en dag innan tyska trupper intar Tallinn. Dess gränser fastställs genom freden i Tartu (1920).
  Treaty of Brest-Litovsk. Soviet Russia cedes Kars, Ardahan and Batumi to the Ottoman Empire, whose troops take them in April.: Freden i Brest-Litovsk. Sovjetryssland avträder Kars, Ardahan och Batumi till Osmanska riket, vars trupper intar dem i april.
  Treaty of Brest-Litovsk. Soviet Russia gives up Poland, Lithuania, Courland and Riga, and Grodno and Brest; Livonia and Estonia, occupied in the German offensive of February, follow in August. These lands are under German military rule until November 1918. Eastern Belarus, also occupied, stays Russian by the treaty.: Freden i Brest-Litovsk. Sovjetryssland ger upp Polen, Litauen, Kurland och Riga samt Grodno och Brest; Livland och Estland, som ockuperats under den tyska offensiven i februari, följer i augusti. Dessa områden står under tyskt militärstyre till november 1918. Östra Belarus, som också ockuperats, förblir enligt fördraget ryskt.
  The Bessarabian assembly (Sfatul Țării), with Romanian troops in the country, votes for union with Romania.: Bessarabiens församling (Sfatul Țării) röstar, med rumänska trupper i landet, för union med Rumänien.
  The Transcaucasian Federation breaks up. Georgia declares independence.: Transkaukasiska federationen bryts upp. Georgien förklarar sig självständigt.
  Armenia and Azerbaijan declare independence. Karabakh, Zangezur and Nakhchivan are disputed between them.: Armenien och Azerbajdzjan förklarar sig självständiga. Karabach, Zangezur och Nachitjevan är omstridda mellan dem.
  The Czechoslovak Republic is proclaimed in Prague; Slovak leaders join it two days later at Martin.: Tjeckoslovakiska republiken utropas i Prag; slovakiska ledare ansluter sig två dagar senare i Martin.
  The National Committee in Prague proclaims the Czechoslovak state; its borders with Austria, Germany and Poland are fixed in 1919–1920.: Nationalkommittén i Prag utropar den tjeckoslovakiska staten; dess gränser mot Österrike, Tyskland och Polen fastställs 1919–1920.
  Armistice of Mudros. Aqaba and Ma’an, taken by the Arab Revolt, are administered by the Kingdom of Hejaz.: Vapenstilleståndet i Mudros. Aqaba och Ma’an, som intagits under det arabiska upproret, förvaltas av kungariket Hijaz.
  The Aster Revolution in Budapest; Hungary leaves the union with Austria, and the Burgenland remains Hungarian until 1921.: Asterrevolutionen i Budapest; Ungern lämnar unionen med Österrike, och Burgenland förblir ungerskt till 1921.
  Ukrainians take power in Lviv and proclaim the West Ukrainian People's Republic; the Polish–Ukrainian War follows.: Ukrainare tar makten i Lviv och utropar Västukrainska folkrepubliken; det polsk-ukrainska kriget följer.
  Armistice of Villa Giusti. Italian troops occupy the Slovene Littoral, Istria and the islands of Cres, Lošinj and Lastovo, within the line promised in the 1915 Treaty of London; the Treaty of Rapallo (12 November 1920) confirms them as Italian.: Vapenstilleståndet i Villa Giusti. Italienska trupper ockuperar Slovenska kustlandet, Istrien och öarna Cres, Lošinj och Lastovo, inom den linje som utlovats i Londonfördraget 1915; Rapallofördraget (12 november 1920) bekräftar dem som italienska.
  Armistice of Villa Giusti. Italy occupies South Tyrol and Trentino up to the Brenner, annexed under the Treaty of Saint-Germain (1919).: Vapenstilleståndet i Villa Giusti. Italien ockuperar Sydtyrolen och Trentino upp till Brenner, som annekteras enligt freden i Saint-Germain (1919).
  Armistice of Villa Giusti. Italian troops occupy Trieste and Gorizia; the Treaty of Rapallo of 1920 confirms them as Italian.: Vapenstilleståndet i Villa Giusti. Italienska trupper ockuperar Trieste och Gorizia; Rapallofördraget 1920 bekräftar dem som italienska.
  Poland regains independence as Germany and Austria-Hungary collapse. Its borders are fought over until 1921.: Polen återfår sin självständighet när Tyskland och Österrike-Ungern bryter samman. Om dess gränser strids till 1921.
  The Republic of German-Austria is proclaimed (named Austria under the Treaty of Saint-Germain).: Republiken Tyskösterrike utropas (enligt freden i Saint-Germain med namnet Österrike).
  The Hungarian People’s Republic is proclaimed; Austria-Hungary has dissolved.: Ungerska folkrepubliken utropas; Österrike-Ungern har upplösts.
  Latvia proclaims independence. Its War of Independence lasts until 1920.: Lettland utropar sin självständighet. Dess frihetskrig varar till 1920.
  French troops enter Strasbourg after the armistice; the Treaty of Versailles returns Alsace-Lorraine to France in 1919.: Franska trupper rycker in i Strasbourg efter vapenstilleståndet; Versaillesfreden återlämnar Elsass-Lothringen till Frankrike 1919.
  The Podgorica Assembly deposes King Nicholas and votes for union with Serbia.: Podgoricaförsamlingen avsätter kung Nikola och röstar för union med Serbien.
  The General Congress of Bukovina in Czernowitz votes for union with Romania.: Bukovinas allmänna kongress i Czernowitz röstar för union med Rumänien.
  A congress in Czernowitz votes for the union of Bukovina with Romania.: En kongress i Czernowitz röstar för Bukovinas union med Rumänien.
  Under the Armistice of Mudros the Ottoman army leaves Transcaucasia. British troops hold Batumi until July 1920, when it passes to Georgia; it is shown as Georgian from here.: Enligt vapenstilleståndet i Mudros lämnar den osmanska armén Transkaukasien. Brittiska trupper håller Batumi till juli 1920, då staden övergår till Georgien; den visas härifrån som georgisk.
  The Kingdom of Serbs, Croats and Slovenes is proclaimed in Belgrade, uniting Serbia and Montenegro with the South Slav lands of Austria-Hungary, Vojvodina among them. The same day an assembly at Alba Iulia votes for the union of Transylvania with Romania.: Serbers, kroaters och sloveners kungarike utropas i Belgrad och förenar Serbien och Montenegro med Österrike-Ungerns sydslaviska områden, bland dem Vojvodina. Samma dag röstar en församling i Alba Iulia för Transsylvaniens union med Rumänien.
  The Danish–Icelandic Act of Union. Iceland becomes a sovereign kingdom in personal union with Denmark (a republic from 17 June 1944).: Den dansk-isländska unionslagen. Island blir ett suveränt kungarike i personalunion med Danmark (republik från den 17 juni 1944).
  The Socialist Soviet Republic of Byelorussia is proclaimed as the Red Army moves west behind the withdrawing Germans.: Vitrysslands socialistiska sovjetrepublik utropas när Röda armén rycker västerut i spåren av de retirerande tyskarna.
  Truce of Trier. The Greater Poland Uprising has won most of the Province of Posen for Poland.: Stilleståndet i Trier. Storpolska upproret har vunnit större delen av provinsen Posen åt Polen.
  After the Ottoman withdrawal, Armenia takes over Kars and Georgia takes Ardahan and Artvin, with British backing.: Efter det osmanska tillbakadragandet tar Armenien över Kars och Georgien Ardahan och Artvin, med brittiskt stöd.
  Polish forces take Vilnius. By mid-1919 Poland holds western Belarus up to the line of the later Riga border; the front moves east and back again in 1920.: Polska styrkor intar Vilnius. Vid mitten av 1919 håller Polen västra Belarus upp till den linje där Rigagränsen senare dras; fronten flyttas österut och tillbaka igen 1920.
  The Polish–Ukrainian War ends with all of Eastern Galicia under Polish control; Polish forces also hold western Volhynia.: Det polsk-ukrainska kriget slutar med hela Östgalizien under polsk kontroll; polska styrkor håller också västra Volynien.
  Treaty of Saint-Germain. Carpathian Ruthenia is assigned to Czechoslovakia.: Freden i Saint-Germain. Karpaterukraina tilldelas Tjeckoslovakien.
  Treaty of Neuilly. Bulgaria cedes the Strumica valley to Yugoslavia and western Thrace to the Allies.: Freden i Neuilly. Bulgarien avträder Strumicadalen till Jugoslavien och västra Thrakien till de allierade.
  historical-basemaps world_1920 (automatic draft, partly hand-corrected): historical-basemaps world_1920 (automatiskt utkast, delvis handkorrigerat)
  The Treaty of Versailles comes into force. The Saar is placed under the League of Nations for fifteen years, administered by France.: Versaillesfreden träder i kraft. Saar ställs under Nationernas förbund i femton år, med Frankrike som förvaltare.
  The Treaty of Versailles comes into force. Poland receives most of West Prussia (the "Polish Corridor"), Danzig becomes a free city under the League of Nations, and the Memel Territory is put under Allied administration.: Versaillesfreden träder i kraft. Polen får större delen av Västpreussen (”polska korridoren”), Danzig blir en fristad under Nationernas förbund och Memelområdet ställs under allierad förvaltning.
  Treaty of Tartu. Soviet Russia recognises Estonia, with Petseri (Pechory) and the land east of the Narva.: Freden i Tartu. Sovjetryssland erkänner Estland, med Petseri (Petjory) och landet öster om Narva.
  After Denikin's defeat the Red Army takes Kyiv (December 1919) and Odesa, and holds Ukraine east of the Polish lines; a Soviet Ukrainian republic governs it (shown with Soviet Russia). The Polish–Ukrainian offensive of spring 1920 is drawn in the Polish–Soviet War, and Wrangel's Crimea in the Russian Civil War.: Efter Denikins nederlag intar Röda armén Kyiv (december 1919) och Odesa och håller Ukraina öster om de polska linjerna; en sovjetisk ukrainsk republik styr området (visas tillsammans med Sovjetryssland). Den polsk-ukrainska offensiven våren 1920 visas under polsk-sovjetiska kriget, och Wrangels Krim under ryska inbördeskriget.
  The Red Army enters Baku, and Azerbaijan becomes a Soviet republic.: Röda armén rycker in i Baku, och Azerbajdzjan blir en sovjetrepublik.
  The Allies hand western Thrace to Greece, which confirms its rule in the Treaty of Sèvres.: De allierade överlämnar västra Thrakien till Grekland, som får sitt styre bekräftat i freden i Sèvres.
  "Treaty of Trianon. Hungary loses two-thirds of its territory: the Banat, Crișana and Maramureș go to Romania, Međimurje and Prekmurje to Yugoslavia.": "Trianonfreden. Ungern förlorar två tredjedelar av sitt territorium: Banatet, Crișana och Maramureș tillfaller Rumänien, Međimurje och Prekmurje Jugoslavien."
  After the plebiscites of February and March 1920, North Schleswig is handed to Denmark; the south votes to stay German.: Efter folkomröstningarna i februari och mars 1920 överlämnas Nordslesvig till Danmark; den södra delen röstar för att förbli tysk.
  A British civil administration replaces the military government in Palestine; the League of Nations confirms the mandate in 1922.: En brittisk civilförvaltning ersätter militärregeringen i Palestina; Nationernas förbund bekräftar mandatet 1922.
  French troops defeat the army of Faisal’s Arab Kingdom of Syria at Maysalun and take Damascus; Syria and Lebanon, with Alexandretta, come under the French mandate. The land east of the Jordan falls to the British mandate.: Franska trupper besegrar armén från Faisals arabiska kungarike Syrien vid Maysalun och intar Damaskus; Syrien och Libanon, med Alexandretta, kommer under det franska mandatet. Landet öster om Jordan tillfaller det brittiska mandatet.
  The Conference of Ambassadors divides Teschen Silesia along the Olza. Czechoslovakia keeps the land west of the river with the Karviná coalfield and the Košice–Bohumín railway, which it had held since 1919; Poland gets the eastern part with Bielsko and Cieszyn's old town.: Ambassadörskonferensen delar Teschen-Schlesien längs Olza. Tjeckoslovakien behåller landet väster om floden med Karvinás kolfält och järnvägen Košice–Bohumín, som det hållit sedan 1919; Polen får den östra delen med Bielsko och Cieszyns gamla stad.
  Treaty of Riga. Soviet Russia recognises Latvia, with Abrene (Pytalovo).: Freden i Riga. Sovjetryssland erkänner Lettland, med Abrene (Pytalovo).
  Under the Soviet–Lithuanian Peace Treaty, the retreating Red Army hands Vilnius to Lithuania.: Enligt det sovjetisk-litauiska fredsfördraget överlämnar den retirerande Röda armén Vilnius till Litauen.
  Eupen and Malmedy pass to Belgium under the Treaty of Versailles.: Eupen och Malmedy övergår till Belgien enligt Versaillesfreden.
  After Żeligowski's staged mutiny, the Republic of Central Lithuania is proclaimed in Vilnius under Polish protection.: Efter Żeligowskis iscensatta myteri utropas Republiken Mellersta Litauen i Vilnius under polskt beskydd.
  Treaty of Tartu. Soviet Russia recognises Finland's border and cedes Petsamo, giving Finland a port on the Arctic Ocean.: Freden i Tartu. Sovjetryssland erkänner Finlands gräns och avträder Petsamo, vilket ger Finland en hamn vid Norra ishavet.
  Turkish nationalist forces take Kars in the Turkish–Armenian War.: Turkiska nationalistiska styrkor intar Kars under turkisk-armeniska kriget.
  Armenia becomes a Soviet republic, and the Treaty of Alexandropol leaves Kars to Turkey.: Armenien blir en sovjetrepublik, och freden i Alexandropol lämnar Kars åt Turkiet.
  Treaty of Moscow between Soviet Russia and the Turkish nationalists. Turkey keeps Kars, Ardahan and Artvin; Batumi stays with Georgia (confirmed at Kars in October).: Moskvafördraget mellan Sovjetryssland och de turkiska nationalisterna. Turkiet behåller Kars, Ardahan och Artvin; Batumi stannar hos Georgien (bekräftat i Kars i oktober).
  Peace of Riga. The left bank of the Dniester stays in Soviet Ukraine (the Moldavian ASSR from 1924).: Freden i Riga. Dnestrs vänstra strand stannar i Sovjetukraina (Moldaviska ASSR från 1924).
  The Red Army takes Tbilisi (25 February) and Batumi; Georgia becomes a Soviet republic.: Röda armén intar Tbilisi (25 februari) och Batumi; Georgien blir en sovjetrepublik.
  Peace of Riga. Poland, Soviet Russia and Soviet Ukraine fix a border that leaves western Belarus and western Volhynia in Poland. Soviet Ukraine and Belarus join the USSR in 1922.: Freden i Riga. Polen, Sovjetryssland och Sovjetukraina fastställer en gräns som lämnar västra Belarus och västra Volynien i Polen. Sovjetukraina och Belarus går upp i Sovjetunionen 1922.
  Peace of Riga. Soviet Ukraine, which holds the rest of Ukraine, joins the USSR in December 1922.: Freden i Riga. Sovjetukraina, som håller resten av Ukraina, går upp i Sovjetunionen i december 1922.
  Abdullah, son of the sharif of Mecca, becomes emir of Transjordan under the British mandate.: Abdullah, son till sharifen av Mecka, blir emir av Transjordanien under det brittiska mandatet.
  Austrian troops take over the Burgenland, awarded to Austria at Saint-Germain and Trianon (Sopron stays Hungarian after a plebiscite in December).: Österrikiska trupper tar över Burgenland, som tilldelats Österrike i Saint-Germain och Trianon (Sopron förblir ungerskt efter en folkomröstning i december).
  Central Lithuania is incorporated into Poland. Lithuania does not recognise the loss of Vilnius until 1938.: Mellersta Litauen införlivas med Polen. Litauen erkänner inte förlusten av Vilnius förrän 1938.
  After the plebiscite and the Silesian Uprisings, Polish troops enter the eastern part of Upper Silesia awarded to Poland.: Efter folkomröstningen och de schlesiska upproren rycker polska trupper in i den östra delen av Övre Schlesien, som tilldelats Polen.
  The Grand National Assembly in Ankara abolishes the sultanate; its government, which has won the war against Greece, takes over from the Ottoman state. Allied troops leave Istanbul in October 1923, after the Treaty of Lausanne; the Republic is proclaimed on 29 October 1923.: Stora nationalförsamlingen i Ankara avskaffar sultanatet; dess regering, som har vunnit kriget mot Grekland, tar över efter den osmanska staten. De allierade trupperna lämnar Istanbul i oktober 1923, efter freden i Lausanne; republiken utropas den 29 oktober 1923.
  The Irish Free State is founded under the Anglo-Irish Treaty; Northern Ireland opts out the next day and stays in the United Kingdom.: Irländska fristaten grundas enligt det anglo-irländska fördraget; Nordirland väljer att stå utanför dagen därpå och stannar i Storbritannien.
  After the Klaipėda Revolt, the Allied Conference of Ambassadors transfers the Memel Territory to Lithuania.: Efter Klaipėdarevolten överför de allierades ambassadörskonferens Memelområdet till Litauen.
  After the Saudi conquest of the Hejaz, Britain attaches Aqaba and Ma’an to Transjordan.: Efter den saudiska erövringen av Hijaz lägger Storbritannien Aqaba och Ma’an till Transjordanien.
  The Svalbard Treaty (1920) comes into force, and the archipelago becomes part of Norway.: Svalbardtraktaten (1920) träder i kraft, och ögruppen blir en del av Norge.
  Norway annexes Jan Mayen (counted with Nordland in today's regions).: Norge annekterar Jan Mayen (som i dagens regionindelning räknas till Nordland).
  historical-basemaps world_1930 (automatic draft, partly hand-corrected): historical-basemaps world_1930 (automatiskt utkast, delvis handkorrigerat)
  After a plebiscite the Saar returns to Germany.: Efter en folkomröstning återgår Saar till Tyskland.
  historical-basemaps world_1938 (automatic draft, partly hand-corrected): historical-basemaps world_1938 (automatiskt utkast, delvis handkorrigerat)
  The Anschluss. German troops enter Austria, which is annexed to Germany.: Anschluss. Tyska trupper rycker in i Österrike, som införlivas med Tyskland.
  Munich Agreement. Czechoslovakia cedes the Sudetenland to Germany (occupied 1–10 October).: Münchenöverenskommelsen. Tjeckoslovakien avträder Sudetlandet till Tyskland (ockuperat 1–10 oktober).
  Poland occupies Zaolzie, the Czechoslovak part of Teschen.: Polen ockuperar Zaolzie, den tjeckoslovakiska delen av Teschen.
  First Vienna Award. Germany and Italy give southern Slovakia, with Košice, to Hungary.: Första Wienskiljedomen. Tyskland och Italien tilldelar Ungern södra Slovakien med Košice.
  Slovakia declares independence under German protection; Germany occupies Bohemia and Moravia the next day.: Slovakien förklarar sig självständigt under tyskt beskydd; Tyskland ockuperar Böhmen och Mähren dagen därpå.
  Carpatho-Ukraine declares independence; Hungary occupies it the same day.: Karpato-Ukraina förklarar sig självständigt; Ungern ockuperar det samma dag.
  German troops occupy what remains of Bohemia and Moravia, which Hitler declares a protectorate of the Reich.: Tyska trupper ockuperar det som återstår av Böhmen och Mähren, som Hitler förklarar som ett protektorat under riket.
  Under a German ultimatum, Lithuania cedes the Memel Territory to Germany.: Under ett tyskt ultimatum avträder Litauen Memelområdet till Tyskland.
  France cedes the Sanjak of Alexandretta, briefly the Hatay State, to Turkey.: Frankrike avträder sandjaken Alexandretta, en kort tid staten Hatay, till Turkiet.
  On the first day of its invasion of Poland, Germany annexes the Free City of Danzig.: På första dagen av sin invasion av Polen annekterar Tyskland Fristaden Danzig.
  German–Soviet Boundary and Friendship Treaty. Germany annexes western Poland, with Zaolzie (formally from 26 October), and sets up the General Government in the centre; the Soviet Union annexes the east.: Det tysk-sovjetiska gräns- och vänskapsfördraget. Tyskland annekterar västra Polen med Zaolzie (formellt från 26 oktober) och upprättar Generalguvernementet i mitten; Sovjetunionen annekterar östra delen.
  Soviet–Lithuanian Mutual Assistance Treaty. Lithuania receives Vilnius and part of its region and accepts Soviet bases.: Det sovjetisk-litauiska biståndsavtalet. Litauen får Vilnius och en del av dess omgivning och godtar sovjetiska baser.
  Moscow Peace Treaty. After the Winter War Finland cedes the Karelian Isthmus with Vyborg, Ladoga Karelia, part of Salla and Kuusamo, and islands in the Gulf of Finland, and leases Hanko to the Soviet Union.: Moskvafreden. Efter vinterkriget avträder Finland Karelska näset med Viborg, Ladogakarelen, delar av Salla och Kuusamo samt öar i Finska viken, och arrenderar ut Hangö till Sovjetunionen.
  Germany annexes Eupen, Malmedy and Sankt Vith, which Belgium had received at Versailles.: Tyskland annekterar Eupen, Malmedy och Sankt Vith, som Belgien hade fått i Versailles.
  Under a Soviet ultimatum Romania cedes Bessarabia and Northern Bukovina, with the Hertsa region, to the Soviet Union.: Under ett sovjetiskt ultimatum avträder Rumänien Bessarabien och norra Bukovina, med Hertsaområdet, till Sovjetunionen.
  "After the armistice Germany puts Alsace and Moselle under Gauleiters of the neighbouring German provinces: a de facto annexation that France never recognised.": Efter vapenstilleståndet ställer Tyskland Elsass och Moselle under gauledarna i de angränsande tyska provinserna – en de facto-annektering som Frankrike aldrig erkände.
  Lithuania, occupied by the Red Army in June, is annexed by the Soviet Union.: Litauen, som ockuperats av Röda armén i juni, annekteras av Sovjetunionen.
  Latvia is annexed by the Soviet Union.: Lettland annekteras av Sovjetunionen.
  Estonia is annexed by the Soviet Union.: Estland annekteras av Sovjetunionen.
  Second Vienna Award. Germany and Italy give northern Transylvania to Hungary.: Andra Wienskiljedomen. Tyskland och Italien tilldelar Ungern norra Transsylvanien.
  Treaty of Craiova. Romania returns southern Dobruja to Bulgaria.: Fördraget i Craiova. Rumänien återlämnar södra Dobrudja till Bulgarien.
  Yugoslavia capitulates and is partitioned. The Independent State of Croatia (proclaimed 10 April) takes Croatia, Bosnia–Herzegovina and Syrmia; Germany annexes northern Slovenia de facto; Italy takes Ljubljana (annexed 3 May); Hungary takes Bačka, Baranja, Međimurje and Prekmurje (annexed in December); Bulgaria takes most of Macedonia and Pirot; Kosovo, western Macedonia and the Montenegrin borderlands go to Italian-ruled Albania; Serbia and Montenegro are put under German and Italian military rule.: Jugoslavien kapitulerar och delas. Oberoende staten Kroatien (utropad 10 april) tar Kroatien, Bosnien–Hercegovina och Syrmien; Tyskland annekterar de facto norra Slovenien; Italien tar Ljubljana (annekterat 3 maj); Ungern tar Bačka, Baranja, Međimurje och Prekmurje (annekterade i december); Bulgarien tar större delen av Makedonien och Pirot; Kosovo, västra Makedonien och de montenegrinska gränsområdena tillfaller det italienskstyrda Albanien; Serbien och Montenegro ställs under tyskt respektive italienskt militärstyre.
  Bulgaria annexes eastern Macedonia and western Thrace, which its army had occupied from 20 April (Evros stays under German control).: Bulgarien annekterar östra Makedonien och västra Thrakien, som dess armé ockuperat från den 20 april (Evros förblir under tysk kontroll).
  Treaties of Rome. The Independent State of Croatia cedes to Italy most of the Dalmatian coast and islands (the Governorate of Dalmatia, with Zadar, Šibenik, Split, Korčula and the Bay of Kotor), and Krk and Rab, joined to the province of Fiume.: Romfördragen. Oberoende staten Kroatien avträder till Italien större delen av den dalmatiska kusten och öarna (guvernementet Dalmatien, med Zadar, Šibenik, Split, Korčula och Kotorbukten) samt Krk och Rab, som läggs till provinsen Fiume.
  Romania, at war with the Soviet Union beside Germany, retakes Bessarabia and Northern Bukovina.: Rumänien, i krig mot Sovjetunionen vid Tysklands sida, återtar Bessarabien och norra Bukovina.
  Six weeks after the invasion of 22 June, German forces hold Lithuania, Latvia, southern Estonia, most of Belarus, western Ukraine, Pskov and Smolensk.: Sex veckor efter invasionen den 22 juni håller tyska styrkor Litauen, Lettland, södra Estland, större delen av Belarus, västra Ukraina, Pskov och Smolensk.
  After the German invasion of the Soviet Union, Eastern Galicia is added to the General Government and the Białystok district is put under East Prussian administration. The occupation further east is in ww2-east.yaml.: Efter den tyska invasionen av Sovjetunionen läggs Östgalizien till Generalguvernementet, och distriktet Białystok ställs under östpreussisk förvaltning. Ockupationen längre österut finns i ww2-east.yaml.
  In the Continuation War Finnish forces retake Ladoga Karelia and, on 29 August, Vyborg; the ceded land is annexed again in December 1941. East Karelia, beyond the old border, is occupied (shown in the war's steps).: Under fortsättningskriget återtar finska styrkor Ladogakarelen och den 29 augusti Viborg; det avträdda landet annekteras på nytt i december 1941. Östkarelen, bortom den gamla gränsen, ockuperas (visas i krigets steg).
  The furthest German advance before the Soviet counter-offensive at Moscow. Estonia, eastern Belarus, most of Ukraine and the Crimea except Sevastopol are occupied; Leningrad is besieged. Romania administers the land between the Dniester and the Southern Bug as “Transnistria”.: Den längsta tyska framryckningen före den sovjetiska motoffensiven vid Moskva. Estland, östra Belarus, större delen av Ukraina och Krim utom Sevastopol är ockuperade; Leningrad är belägrat. Rumänien förvaltar landet mellan Dnestr och Södra Bug som ”Transnistrien”.
  Germany annexes Luxembourg, under civil administration since 1940, and introduces conscription; a general strike follows.: Tyskland annekterar Luxemburg, som stått under civilförvaltning sedan 1940, och inför värnplikt; en generalstrejk följer.
  The eve of the Soviet counter-offensive at Stalingrad. After the summer offensive Germany holds the Donbas, the lower Don, the Kuban and the northern Caucasus foothills; Sevastopol fell in July. Kaluga was retaken in the winter.: Kvällen före den sovjetiska motoffensiven vid Stalingrad. Efter sommaroffensiven håller Tyskland Donbas, nedre Don, Kuban och norra Kaukasus förberg; Sevastopol föll i juli. Kaluga återtogs under vintern.
  After the Italian armistice the Independent State of Croatia annexes the Italian part of Dalmatia except Zadar, and German troops take over the Bay of Kotor with Montenegro. Ljubljana, Fiume, Krk and Rab come under German rule as part of the Adriatic Littoral zone (shown here as Italian territory under occupation).: Efter det italienska vapenstilleståndet annekterar Oberoende staten Kroatien den italienska delen av Dalmatien utom Zadar, och tyska trupper tar över Kotorbukten och Montenegro. Ljubljana, Fiume, Krk och Rab kommer under tyskt styre som en del av operationszonen Adriatiska kustlandet (visas här som italienskt territorium under ockupation).
  France releases the Lebanese government, which it had arrested; Lebanon is independent.: Frankrike friger den libanesiska regering som det hade arresterat; Libanon är självständigt.
  After Stalingrad, Kursk and the battles for the Dnieper, the Red Army has retaken the northern Caucasus, eastern Ukraine with Kyiv, and Smolensk.: Efter Stalingrad, Kursk och striderna om Dnepr har Röda armén återtagit norra Kaukasus, östra Ukraina med Kyiv samt Smolensk.
  The Red Army retakes Chernivtsi and Northern Bukovina.: Röda armén återtar Tjernivtsi och norra Bukovina.
  The Red Army retakes Odesa (10 April) and the land east of the Dniester.: Röda armén återtar Odesa (10 april) och landet öster om Dnestr.
  The Red Army takes Vyborg in its summer offensive.: Röda armén intar Viborg under sin sommaroffensiv.
  The Red Army takes Lviv and Białystok. A Soviet agreement with the Polish Committee of National Liberation (Lublin) sets the new border close to the Curzon Line.: Röda armén intar Lviv och Białystok. Ett sovjetiskt avtal med Polska kommittén för nationell befrielse (Lublin) drar den nya gränsen nära Curzonlinjen.
  The Jassy–Kishinev offensive. The Red Army retakes Bessarabia, and Romania changes sides the next day.: Jassy–Kisjinjov-offensiven. Röda armén återtar Bessarabien, och Rumänien byter sida dagen därpå.
  After the spring offensives in Ukraine and the Crimea and Operation Bagration in Belarus, the Red Army stands in eastern Poland and the Baltic states.: Efter vårens offensiver i Ukraina och på Krim och operation Bagration i Belarus står Röda armén i östra Polen och Baltikum.
  American troops liberate Luxembourg City; most of the country is free by mid-September.: Amerikanska trupper befriar staden Luxemburg; större delen av landet är fritt i mitten av september.
  American troops reach Eupen and Malmedy, which return to Belgium.: Amerikanska trupper når Eupen och Malmedy, som återgår till Belgien.
  Moscow Armistice. Finland returns to the 1940 border, cedes Petsamo and leases Porkkala to the Soviet Union (until 1956); the Paris peace treaty confirms this in 1947.: Vapenstilleståndet i Moskva. Finland återgår till 1940 års gräns, avträder Petsamo och arrenderar ut Porkala till Sovjetunionen (till 1956); Parisfreden bekräftar detta 1947.
  The Partisans liberate Dubrovnik and the southern Dalmatian islands.: Partisanerna befriar Dubrovnik och de sydliga dalmatiska öarna.
  The Red Army and the Partisans liberate Belgrade; the German occupation of Serbia ends, and the Bulgarian-annexed Pirot and Vranje return to Yugoslavia.: Röda armén och partisanerna befriar Belgrad; den tyska ockupationen av Serbien upphör, och de av Bulgarien annekterade Pirot och Vranje återgår till Jugoslavien.
  Novi Sad is liberated; Bačka returns to Yugoslavia.: Novi Sad befrias; Bačka återgår till Jugoslavien.
  The Bulgarian army completes its withdrawal from eastern Macedonia and western Thrace, under the terms of the armistice with the Allies.: Den bulgariska armén fullbordar sitt tillbakadragande från östra Makedonien och västra Thrakien enligt villkoren i vapenstilleståndet med de allierade.
  The Partisans liberate Split and central Dalmatia.: Partisanerna befriar Split och mellersta Dalmatien.
  The Red Army takes Carpathian Ruthenia (Uzhhorod falls on 27 October). A Czechoslovak government delegation takes office in Khust, but Soviet-backed committees soon push it aside and in November call for union with Soviet Ukraine.: Röda armén intar Karpaterukraina (Uzjhorod faller den 27 oktober). En tjeckoslovakisk regeringsdelegation tillträder i Chust, men sovjetstödda kommittéer skjuter snart undan den och kräver i november union med Sovjetukraina.
  The last Italian authorities leave Zadar, which the Partisans enter.: De sista italienska myndigheterna lämnar Zadar, dit partisanerna rycker in.
  The Partisans liberate Šibenik.: Partisanerna befriar Šibenik.
  Skopje is liberated; the Bulgarian annexation of Macedonia ends.: Skopje befrias; den bulgariska annekteringen av Makedonien upphör.
  The Partisans take Pristina; Kosovo and western Macedonia are separated from Albania again.: Partisanerna intar Pristina; Kosovo och västra Makedonien skiljs åter från Albanien.
  American troops take Metz; Moselle returns to France.: Amerikanska trupper intar Metz; Moselle återgår till Frankrike.
  French troops liberate Strasbourg.: Franska trupper befriar Strasbourg.
  The Battle of Batina opens Baranja to the Red Army and the Partisans.: Slaget vid Batina öppnar Baranja för Röda armén och partisanerna.
  The Partisans take Knin; northern Dalmatia is free.: Partisanerna intar Knin; norra Dalmatien är fritt.
  The last German troops leave Montenegro; the Partisans enter Podgorica.: De sista tyska trupperna lämnar Montenegro; partisanerna rycker in i Podgorica.
  Estonia, most of Latvia with Riga (13 October) and western Lithuania are retaken. German forces hold out in the Courland pocket until May 1945.: Estland, större delen av Lettland med Riga (13 oktober) och västra Litauen återtas. Tyska styrkor håller ut i Kurlandsfickan till maj 1945.
  The Vistula–Oder Offensive. Soviet and Polish troops take Warsaw (17 January), Kraków and Łódź (19 January).: Wisła–Oder-offensiven. Sovjetiska och polska trupper intar Warszawa (17 januari), Kraków och Łódź (19 januari).
  The Red Army takes Memel (Klaipėda) after a three-month siege; the Memel Territory returns to Soviet Lithuania.: Röda armén intar Memel (Klaipėda) efter tre månaders belägring; Memelområdet återgår till Sovjetlitauen.
  The Vistula–Oder Offensive halts on the Oder. Behind it the rest of the pre-war Polish west is free, Bydgoszcz (24 January), Katowice (27 January), Toruń (1 February) and Greater Poland, though Poznań holds out until 23 February and Grudziądz until 6 March.: Wisła–Oder-offensiven stannar vid Oder. Bakom den är resten av det förkrigstida västra Polen fritt – Bydgoszcz (24 januari), Katowice (27 januari), Toruń (1 februari) och Storpolen – även om Poznań håller ut till den 23 februari och Grudziądz till den 6 mars.
  The Colmar Pocket is cleared; Alsace is wholly French again.: Colmarfickan rensas; Elsass är åter helt franskt.
  The Partisans take Mostar; Herzegovina is free.: Partisanerna intar Mostar; Hercegovina är fritt.
  With the Groza government in office, Romanian administration returns to northern Transylvania; the Paris peace treaty (1947) confirms the 1920 border.: När regeringen Groza har tillträtt återvänder den rumänska förvaltningen till norra Transsylvanien; Parisfreden (1947) bekräftar 1920 års gräns.
  Soviet and Polish troops take Gdynia (28 March) and Danzig (30 March). Polish Pomerania is free, and Danzig comes under Polish administration as Gdańsk.: Sovjetiska och polska trupper intar Gdynia (28 mars) och Danzig (30 mars). Polska Pommern är fritt, och Danzig kommer under polsk förvaltning som Gdańsk.
  The Red Army drives the Hungarians out of Prekmurje and Međimurje.: Röda armén driver ut ungrarna ur Prekmurje och Međimurje.
  Soviet and Romanian troops take Bratislava; Slovakia, with the land Hungary took in 1938, returns to Czechoslovakia.: Sovjetiska och rumänska trupper intar Bratislava; Slovakien, med det land som Ungern tog 1938, återgår till Tjeckoslovakien.
  The Partisans liberate Sarajevo.: Partisanerna befriar Sarajevo.
  The Yugoslav Army breaks through the Syrmian Front.: Jugoslaviska armén bryter igenom Syrmiska fronten.
  Osijek is liberated; Slavonia is free.: Osijek befrias; Slavonien är fritt.
  The Partisans take Banja Luka; northern and western Bosnia are free.: Partisanerna intar Banja Luka; norra och västra Bosnien är fria.
  Karl Renner’s provisional government in Vienna declares Austria independent again (occupied by the four powers until 1955).: Karl Renners provisoriska regering i Wien förklarar Österrike åter självständigt (ockuperat av de fyra makterna till 1955).
  The Partisans enter Zagreb; the Independent State of Croatia collapses (its last troops surrender at Bleiburg and Poljana on 15 May).: Partisanerna rycker in i Zagreb; Oberoende staten Kroatien bryter samman (dess sista trupper kapitulerar vid Bleiburg och Poljana den 15 maj).
  Prague is liberated and Czechoslovakia is restored within its borders before Munich.: Prag befrias, och Tjeckoslovakien återupprättas inom sina gränser från före München.
  Germany surrenders. The German lands east of the Oder and Neisse, where Poland had set up administrative districts from March, are under Polish administration (Stettin is handed over on 5 July), and northern East Prussia with Königsberg (taken 9 April) is under Soviet rule.: Tyskland kapitulerar. De tyska områdena öster om Oder och Neisse, där Polen hade inrättat förvaltningsdistrikt från mars, står under polsk förvaltning (Stettin överlämnas den 5 juli), och norra Ostpreussen med Königsberg (intaget 9 april) står under sovjetiskt styre.
  The Courland pocket surrenders after Germany's capitulation.: Kurlandsfickan kapitulerar efter Tysklands kapitulation.
  The Partisans liberate Ljubljana; German-annexed and Italian-annexed Slovenia return to Yugoslavia. Yugoslav forces also hold Trieste and Istria until June (shown in the war files).: Partisanerna befriar Ljubljana; det av Tyskland och det av Italien annekterade Slovenien återgår till Jugoslavien. Jugoslaviska styrkor håller också Trieste och Istrien till juni (visas i krigsfilerna).
  Berlin Declaration. The four powers assume supreme authority in Germany, divided into American, British, French and Soviet zones; Berlin is under joint four-power rule. Germany east of the Oder and Neisse comes under Polish and Soviet administration.: Berlindeklarationen. De fyra makterna övertar den högsta makten i Tyskland, som delas i en amerikansk, en brittisk, en fransk och en sovjetisk zon; Berlin står under gemensamt fyrmaktsstyre. Tyskland öster om Oder och Neisse kommer under polsk och sovjetisk förvaltning.
  Czechoslovakia cedes Carpathian Ruthenia to the Soviet Union, which had occupied it in October 1944.: Tjeckoslovakien avträder Karpaterukraina till Sovjetunionen, som hade ockuperat området i oktober 1944.
  Agreement on the zones of occupation in Austria. The Soviet Union holds Lower Austria, Burgenland and Upper Austria north of the Danube; the United States Upper Austria south of the Danube and Salzburg; Britain Styria, Carinthia and East Tyrol; France North Tyrol and Vorarlberg. Vienna is under joint four-power rule, with a sector for each power and an international centre. Unlike Germany, Austria keeps its own government, recognised by all four powers in October.: Avtalet om ockupationszonerna i Österrike. Sovjetunionen håller Niederösterreich, Burgenland och Oberösterreich norr om Donau; USA Oberösterreich söder om Donau samt Salzburg; Storbritannien Steiermark, Kärnten och Östtyrolen; Frankrike Nordtyrolen och Vorarlberg. Wien står under gemensamt fyrmaktsstyre, med en sektor för varje makt och ett internationellt centrum. Till skillnad från Tyskland behåller Österrike en egen regering, som erkänns av alla fyra makterna i oktober.
  historical-basemaps world_1945 (automatic draft, needs checking): historical-basemaps world_1945 (automatiskt utkast, behöver kontrolleras)
  Potsdam Agreement. The Allies confirm Polish administration east of the Oder and Neisse and Soviet rule in northern East Prussia, pending a peace settlement. Most Germans there are expelled.: Potsdamöverenskommelsen. De allierade bekräftar polsk förvaltning öster om Oder och Neisse och sovjetiskt styre i norra Ostpreussen i väntan på en fredsuppgörelse. De flesta tyskar där fördrivs.
  The last French troops leave Syria.: De sista franska trupperna lämnar Syrien.
  Britain hands the Dodecanese, which Italy ceded under the Paris peace treaty, to Greece.: Storbritannien överlämnar Dodekanesos, som Italien avträtt genom Parisfreden, till Grekland.
  The Paris peace treaty comes into force. Italy cedes Istria, most of the Slovene Littoral, Cres, Lošinj and Lastovo to Yugoslavia; Koper, Izola and Piran become Zone B of the Free Territory of Trieste, under Yugoslav military administration.: Parisfreden träder i kraft. Italien avträder Istrien, större delen av Slovenska kustlandet, Cres, Lošinj och Lastovo till Jugoslavien; Koper, Izola och Piran blir zon B i Fria territoriet Trieste, under jugoslavisk militärförvaltning.
  The Paris peace treaty comes into force. Trieste becomes the Free Territory of Trieste, under Anglo-American (Zone A) and Yugoslav (Zone B) military administration.: Parisfreden träder i kraft. Trieste blir Fria territoriet Trieste, under angloamerikansk (zon A) och jugoslavisk (zon B) militärförvaltning.
  The Saar, detached from the French zone, becomes a French protectorate with its own constitution.: Saar, som skilts från den franska zonen, blir ett franskt protektorat med egen författning.
  The British mandate ends and Israel declares independence; Arab armies invade. By the 1949 armistice lines Israel holds most of the former mandate, Jordan the West Bank (annexed in 1950) and Egypt the Gaza Strip.: Det brittiska mandatet upphör och Israel förklarar sig självständigt; arabiska arméer invaderar. Enligt stilleståndslinjerna 1949 håller Israel större delen av det tidigare mandatet, Jordanien Västbanken (annekterad 1950) och Egypten Gazaremsan.
  The Basic Law. The Federal Republic of Germany is founded in the three western zones.: Grundlagen. Förbundsrepubliken Tyskland grundas i de tre västliga zonerna.
  The German Democratic Republic is founded in the Soviet zone.: Tyska demokratiska republiken grundas i den sovjetiska zonen.
  London Memorandum. Zone B of the Free Territory passes to Yugoslavia, Zone A with Trieste to Italy.: Londonmemorandumet. Fria territoriets zon B övergår till Jugoslavien, zon A med Trieste till Italien.
  London Memorandum. Zone A of the Free Territory, with Trieste, passes to Italy.: Londonmemorandumet. Fria territoriets zon A, med Trieste, övergår till Italien.
  The Austrian State Treaty, signed in Vienna on 15 May, comes into force. The Allied Council is dissolved and the occupation ends; the last foreign troops leave by 25 October, and the next day Austria declares its permanent neutrality.: Österrikiska statsfördraget, undertecknat i Wien den 15 maj, träder i kraft. Allierade rådet upplöses och ockupationen upphör; de sista utländska trupperna lämnar landet senast den 25 oktober, och dagen därpå förklarar Österrike sin permanenta neutralitet.
  After a referendum the Saar joins the Federal Republic.: Efter en folkomröstning ansluts Saar till Förbundsrepubliken.
  Egypt and Syria unite as the United Arab Republic.: Egypten och Syrien går samman i Förenade arabrepubliken.
  historical-basemaps world_1960 (automatic draft, needs checking): historical-basemaps world_1960 (automatiskt utkast, behöver kontrolleras)
  Cyprus becomes independent of Britain, which keeps two sovereign base areas.: Cypern blir självständigt från Storbritannien, som behåller två suveräna basområden.
  A military coup in Damascus takes Syria out of the United Arab Republic.: En militärkupp i Damaskus för Syrien ut ur Förenade arabrepubliken.
  Malta becomes independent of Britain.: Malta blir självständigt från Storbritannien.
  After Jordan gives up its claim to the West Bank (31 July), the Palestine National Council declares the State of Palestine in the territories occupied by Israel since 1967.: Sedan Jordanien gett upp sitt anspråk på Västbanken (31 juli) utropar Palestinska nationalrådet staten Palestina i de områden som Israel ockuperat sedan 1967.
  German reunification. The GDR’s states and Berlin join the Federal Republic.: Tysklands återförening. DDR:s delstater och Berlin ansluts till Förbundsrepubliken.
  Georgia declares the restoration of its independence.: Georgien förklarar sin självständighet återupprättad.
  Slovenia and Croatia declare independence from Yugoslavia.: Slovenien och Kroatien förklarar sig självständiga från Jugoslavien.
  Ukraine declares independence (confirmed by referendum on 1 December).: Ukraina förklarar sig självständigt (bekräftat genom folkomröstning den 1 december).
  Belarus declares independence.: Belarus förklarar sig självständigt.
  Moldova declares independence. Transnistria, which had declared itself a separate republic in 1990, is not under its control.: Moldavien förklarar sig självständigt. Transnistrien, som utropat sig till en separat republik 1990, står inte under dess kontroll.
  The Soviet Union recognises the independence of Estonia, Latvia and Lithuania.: Sovjetunionen erkänner Estlands, Lettlands och Litauens självständighet.
  Macedonia votes for independence from Yugoslavia in a referendum.: Makedonien röstar för självständighet från Jugoslavien i en folkomröstning.
  Armenia declares independence after a referendum.: Armenien förklarar sig självständigt efter en folkomröstning.
  Azerbaijan declares the restoration of its independence.: Azerbajdzjan förklarar sin självständighet återupprättad.
  The Soviet Union is dissolved; the northern Caucasus republics stay in the Russian Federation.: Sovjetunionen upplöses; republikerna i norra Kaukasus stannar i Ryska federationen.
  The Soviet Union is dissolved; the Kaliningrad region stays with Russia.: Sovjetunionen upplöses; Kaliningrad oblast stannar hos Ryssland.
  The Soviet Union is dissolved. Most republics had declared independence between August and December 1991.: Sovjetunionen upplöses. De flesta republikerna hade förklarat sig självständiga mellan augusti och december 1991.
  Bosnia and Herzegovina declares independence after a referendum boycotted by most Bosnian Serbs.: Bosnien och Hercegovina förklarar sig självständigt efter en folkomröstning som bojkottas av de flesta bosnienserber.
  Czechoslovakia splits peacefully into the Czech Republic and Slovakia.: Tjeckoslovakien delas fredligt i Tjeckien och Slovakien.
  Czechoslovakia is dissolved into the Czech Republic and Slovakia.: Tjeckoslovakien upplöses i Tjeckien och Slovakien.
  historical-basemaps world_1994 (automatic draft, needs checking): historical-basemaps world_1994 (automatiskt utkast, behöver kontrolleras)
  historical-basemaps world_2000 (automatic draft, needs checking): historical-basemaps world_2000 (automatiskt utkast, behöver kontrolleras)
  Montenegro declares independence after its referendum of 21 May; Serbia becomes the successor of the state union.: Montenegro förklarar sig självständigt efter folkomröstningen den 21 maj; Serbien blir statsunionens efterträdare.
  Natural Earth admin-0 (de jure borders after Kosovo’s declaration of independence): Natural Earth admin-0 (de jure-gränser efter Kosovos självständighetsförklaring)
  Kosovo, under UN administration since 1999, declares independence from Serbia. Serbia and a number of states do not recognise it.: Kosovo, under FN-förvaltning sedan 1999, förklarar sig självständigt från Serbien. Serbien och ett antal stater erkänner inte självständigheten.
  About 800. The Abbasid Caliphate rules Armenia, Arran, Shirvan and Azerbaijan through its governors (the province of Arminiya), with Tbilisi and Derbent as frontier fortresses. In the west, Leon II has made the Kingdom of Abkhazia independent of Byzantium; the Georgian princes of Iberia, Kakheti and Hereti and the Alans of the northern Caucasus are autonomous, and the Khazars hold the plains north of the mountains.: Omkring 800. Abbasidiska kalifatet styr Armenien, Arran, Sjirvan och Azerbajdzjan genom sina ståthållare (provinsen Arminiya), med Tbilisi och Derbent som gränsfästningar. I väster har Leon II gjort kungariket Abchazien oberoende av Bysans; de georgiska furstarna i Iberien, Kachetien och Hereti och alanerna i norra Kaukasus är självstyrande, och khazarerna behärskar slätterna norr om bergen.
  About 800. East Slavic tribes live in the forests from the Bug to the upper Volga; the Khazar Khaganate rules the steppe from the Dnieper to beyond the Volga and takes tribute from the Slavs nearest to it. Volga Bulgaria is forming on the middle Volga, Byzantium holds Cherson in the Crimea, and Finnic, Permic and Ugric peoples live in the north and east.: Omkring 800. Östslaviska stammar lever i skogarna från Bug till övre Volga; Khazariska khaganatet behärskar stäppen från Dnepr till bortom Volga och tar tribut av de närmaste slaverna. Volgabulgarien håller på att bildas vid mellersta Volga, Bysans behärskar Cherson på Krim, och finska, permiska och ugriska folk lever i norr och öster.
  About 830. The Magyars move west into Etelköz, the steppe between the Dnieper and the lower Danube, still under Khazar overlordship.: Omkring 830. Magyarerna flyttar västerut till Etelköz, stäppen mellan Dnepr och nedre Donau, fortfarande under khazarisk överhöghet.
  About 833. Ishaq ibn Ismail, the emir of Tbilisi, stops obeying the caliph. Bugha al-Kabir sacks the city in 853 and kills him, but the emirate goes on under its own emirs.: Omkring 833. Ishaq ibn Ismail, emir i Tbilisi, slutar lyda kalifen. Bugha al-Kabir plundrar staden 853 och dödar honom, men emiratet lever vidare under egna emirer.
  Haytham ibn Khalid, the Arab governor of Shirvan, takes the title of Shirvanshah and founds a dynasty independent of the caliphs.: Haytham ibn Khalid, arabisk ståthållare i Sjirvan, antar titeln sjirvansjah och grundar en dynasti som är oberoende av kaliferna.
  "The date the Primary Chronicle gives for the call to Rurik: Scandinavian Rus’ princes rule Novgorod, Ladoga and Izborsk, with Beloozero and Rostov.": "Det år Nestorskrönikan anger för kallelsen av Rurik: skandinaviska rusfurstar härskar över Novgorod, Ladoga och Izborsk samt Beloozero och Rostov."
  Hashim ibn Suraqa becomes emir of Derbent (Bab al-Abwab) and founds the Hashimid emirate.: Hashim ibn Suraqa blir emir i Derbent (Bab al-Abwab) och grundar det hashimidiska emiratet.
  Oleg of Novgorod takes Kiev and makes it his capital, with Smolensk on the way. By 885 the Drevlians have submitted, and the Severians and Radimichs pay tribute to him instead of the Khazars.: Oleg av Novgorod intar Kiev och gör staden till sin huvudstad, efter att ha tagit Smolensk på vägen. År 885 har drevljanerna underkastat sig, och severjanerna och radimitjerna betalar tribut till honom i stället för till khazarerna.
  The caliph and the Byzantine emperor recognise Ashot I Bagratuni as king of Armenia. The Armenian princes of Syunik, Khachen (Artsakh) and the north acknowledge him.: Kalifen och den bysantinske kejsaren erkänner Asjot I Bagratuni som kung av Armenien. De armeniska furstarna i Sjunik, Chatjen (Artsach) och norr erkänner honom.
  The caliph appoints Muhammad ibn Abi’l-Saj governor of Azerbaijan. His family, the Sajids, rule Azerbaijan, Arran and Nakhchivan from Ardabil and Maragha as all but independent emirs until 929.: Kalifen utser Muhammad ibn Abi’l-Saj till ståthållare i Azerbajdzjan. Hans släkt, sajiderna, styr Azerbajdzjan, Arran och Nachitjevan från Ardabil och Maragha som i praktiken oberoende emirer fram till 929.
  Grigol Hamam of Hereti, whose seat is at Sheki, takes the title of king.: Grigol Hamam av Hereti, med säte i Sjeki, antar kungatiteln.
  About 893. The Oghuz and the Khazars drive the Pechenegs west across the Volga; the Oghuz take the steppe between the Volga and the Ural River.: Omkring 893. Oguzerna och khazarerna driver petjenegerna västerut över Volga; oguzerna tar stäppen mellan Volga och Uralfloden.
  The Pechenegs, allied with Bulgaria, attack the Magyars, who leave Etelköz and cross the Carpathians. The Pechenegs hold the steppe from the Don to the Danube.: Petjenegerna, i förbund med Bulgarien, angriper magyarerna, som lämnar Etelköz och korsar Karpaterna. Petjenegerna behärskar stäppen från Don till Donau.
  Marzuban ibn Muhammad of the Sallarid (Musafirid) dynasty takes Azerbaijan and Arran, filling the gap left by the end of the Sajids (929).: Marzuban ibn Muhammad av den sallaridiska (musafiridiska) dynastin tar Azerbajdzjan och Arran och fyller tomrummet efter sajidernas slut (929).
  Sviatoslav of Kiev subdues the Vyatichi of the upper Oka (964–966), the last East Slavic tribe paying tribute to the Khazars.: Svjatoslav av Kiev underkuvar vjatitjerna vid övre Oka (964–966), den sista östslaviska stammen som betalade tribut till khazarerna.
  Sviatoslav of Kiev destroys the Khazar Khaganate (965–969). North of the mountains the Kasogs (Circassians) and Alania are left independent, and the Avar kingdom of Sarir is the strongest power in Dagestan.: Svjatoslav av Kiev förstör Khazariska khaganatet (965–969). Norr om bergen förblir kasogerna (tjerkesserna) och Alanien självständiga, och avarernas kungarike Sarir är den starkaste makten i Dagestan.
  Sviatoslav of Kiev destroys the Khazar Khaganate (965–969). The Pechenegs take over the steppe west of the Volga, the Oghuz the lower Volga, and Alania the plains north of the Caucasus.: Svjatoslav av Kiev förstör Khazariska khaganatet (965–969). Petjenegerna tar över stäppen väster om Volga, oguzerna nedre Volga och Alanien slätterna norr om Kaukasus.
  Lashkari ibn Muhammad of the Shaddadid dynasty takes Ganja, and the Shaddadids rule Arran from there; in Azerbaijan the Rawwadids of Tabriz take over from the Sallarids (about 980).: Lashkari ibn Muhammad av den shaddadidiska dynastin intar Ganja, och därifrån styr shaddadiderna Arran; i Azerbajdzjan tar rawwadiderna i Tabriz över efter sallariderna (omkring 980).
  Gurgen (Kiurike I) founds the Armenian kingdom of Tashir-Dzoraget (Lori) as a vassal of the Bagratid kings of Ani.: Gurgen (Kiurike I) grundar det armeniska kungariket Tasjir-Dzoraget (Lori) som vasall under bagratidkungarna i Ani.
  Vladimir of Novgorod takes Polotsk, killing its prince Rogvolod, and then Kiev.: Vladimir av Novgorod intar Polotsk, där han dödar fursten Rogvolod, och därefter Kiev.
  Smbat of Syunik is crowned king; the Kingdom of Syunik holds the mountains between Lake Sevan and the Aras.: Smbat av Sjunik kröns till kung; kungariket Sjunik behärskar bergen mellan Sevansjön och Aras.
  Vladimir, baptised this year, sends his sons to rule Rostov and Murom; the lands of the Finnic Merya and Muroma on the upper Volga and the Oka are part of Rus’.: Vladimir, som döps detta år, sänder sina söner att styra Rostov och Murom; de finska merjanernas och muromernas land vid övre Volga och Oka blir en del av Rus’.
  "Vladimir has taken the Cherven towns (981), fought the Yatvingians (983) and the Croats (992–993): Volhynia, Red Ruthenia and the Bug and Neman lands are part of Rus’.": "Vladimir har intagit Tjervenstäderna (981) och krigat mot jatvingerna (983) och kroaterna (992–993): Volynien, Röda Rutenien och landen vid Bug och Njemen är en del av Rus’."
  Bryachislav succeeds his father Iziaslav, whom Vladimir had made prince of Polotsk; from now on Polotsk is ruled by its own line of princes.: Brjatjislav efterträder sin far Izjaslav, som Vladimir hade gjort till furste i Polotsk; från och med nu styrs Polotsk av en egen furstelinje.
  Bagrat III, heir to both Abkhazia and Tao-Klarjeti, unites the western and eastern Georgian lands into the Kingdom of Georgia.: Bagrat III, arvinge till både Abchazien och Tao-Klardzjeti, förenar de västra och östra georgiska länderna i kungariket Georgien.
  About 1020. Kvirike III of Kakheti absorbs Hereti and rules the Kingdom of Kakheti-Hereti.: Omkring 1020. Kvirike III av Kachetien införlivar Hereti och härskar över kungariket Kachetien-Hereti.
  Byzantium annexes the Bagratid kingdom of Ani. The Armenian kingdoms of Lori and Syunik and the principality of Khachen survive as vassals.: Bysans annekterar bagratidernas kungarike Ani. De armeniska kungarikena Lori och Sjunik och furstendömet Chatjen överlever som vasaller.
  The Seljuk sultan Tughril marches into Azerbaijan; the Rawwadids of Tabriz submit to him.: Seldjuksultanen Tughril tågar in i Azerbajdzjan; rawwadiderna i Tabriz underkastar sig honom.
  The Cumans (Polovtsians), who have driven the Torks and the Pechenegs west, raid Rus’ for the first time. They hold the steppe from the Danube to beyond the Volga.: Kumanerna (polovtserna), som har drivit torkerna och petjenegerna västerut, plundrar Rus’ för första gången. De behärskar stäppen från Donau till bortom Volga.
  Sultan Alp Arslan takes Ani from Byzantium.: Sultanen Alp Arslan tar Ani från Bysans.
  The Seljuks end the Shaddadid emirate of Ganja and occupy Derbent, where local emirs go on ruling under Seljuk and Shirvani overlordship. The Shirvanshahs keep their throne as Seljuk vassals.: Seldjukerna gör slut på shaddadidernas emirat i Ganja och besätter Derbent, där lokala emirer fortsätter att styra under seldjukisk och sjirvansk överhöghet. Sjirvansjaherna behåller sin tron som seldjukiska vasaller.
  David IV the Builder annexes the Kingdom of Kakheti-Hereti.: David IV Byggaren annekterar kungariket Kachetien-Hereti.
  David IV takes Lori from the Kiurikid kings; their heirs keep only a small domain in Tavush.: David IV tar Lori från kiurikidkungarna; deras arvingar behåller bara en liten domän i Tavusj.
  After the Battle of Didgori (1121) David IV takes Tbilisi, ending four centuries of Muslim rule there, and makes it his capital.: Efter slaget vid Didgori (1121) intar David IV Tbilisi, gör slut på fyra sekler av muslimskt styre där och gör staden till sin huvudstad.
  The Seljuk sultan grants Arran to Eldiguz; within thirty years he and his sons, the Atabegs of Azerbaijan, rule Arran, Azerbaijan and Nakhchivan as the real power behind the sultans.: Seldjuksultanen förlänar Arran åt Eldiguz; inom trettio år styr han och hans söner, atabegerna av Azerbajdzjan, Arran, Azerbajdzjan och Nachitjevan som den verkliga makten bakom sultanerna.
  The Eldiguzids take Baghaberd, the last fortress of the kings of Syunik.: Eldiguziderna intar Baghaberd, Sjunikkungarnas sista fästning.
  Queen Tamar’s generals Zakare and Ivane Mkhargrdzeli take Ani (1199) and Dvin (1203). Northern Armenia is ruled by the Zakarids under the Georgian crown, with the Orbelians in Syunik.: Drottning Tamars fältherrar Zakare och Ivane Mchargrdzeli intar Ani (1199) och Dvin (1203). Norra Armenien styrs av zakariderna under den georgiska kronan, med orbelianerna i Sjunik.
  After the crusaders take Constantinople, Cherson and Crimean Gothia pass to the Empire of Trebizond.: Sedan korsfararna har intagit Konstantinopel övergår Cherson och Krimgotien till kejsardömet Trapezunt.
  Jalal al-Din, the last Khwarazmshah, takes Tabriz and ends the Eldiguzid atabegate.: Jalal al-Din, den siste khwarazmsjahen, intar Tabriz och gör slut på eldiguzidernas atabegat.
  Jalal al-Din is killed, and the Mongol general Chormaqan takes Azerbaijan and Arran.: Jalal al-Din dödas, och den mongoliske fältherren Chormaqan tar Azerbajdzjan och Arran.
  The Mongols take Ganja (1235), Lori, Ani and Kars (1236) and the Zakarid lands of Armenia. Queen Rusudan of Georgia submits in 1243, and the kingdom becomes a Mongol vassal.: Mongolerna intar Ganja (1235), Lori, Ani och Kars (1236) och zakaridernas armeniska land. Drottning Rusudan av Georgien underkastar sig 1243, och riket blir mongolisk vasall.
  The Mongols take Derbent and the northern Caucasus plains; the Alan capital, Magas, falls in the winter of 1239–1240.: Mongolerna intar Derbent och slätterna i norra Kaukasus; alanernas huvudstad Magas faller vintern 1239–1240.
  Hülegü founds the Ilkhanate, which rules Azerbaijan, Arran, Armenia and Derbent. Georgia and Shirvan stay on the map as its vassals.: Hülegü grundar Ilkhanatet, som styr Azerbajdzjan, Arran, Armenien och Derbent. Georgien och Sjirvan står kvar på kartan som dess vasaller.
  David VI Narin breaks away from Mongol rule and is king in western Georgia, which becomes the Kingdom of Imereti.: David VI Narin bryter sig loss från mongolernas styre och är kung i västra Georgien, som blir kungariket Imeretien.
  The Mongols execute Hasan-Jalal, prince of Khachen; his heirs rule as Mongol vassals.: Mongolerna avrättar Hasan-Jalal, furste av Chatjen; hans arvingar styr som mongoliska vasaller.
  Sargis Jaqeli, lord of Samtskhe, breaks with the Georgian crown and submits directly to the Ilkhan.: Sargis Jaqeli, herre över Samtsche, bryter med den georgiska kronan och underkastar sig direkt ilkhanen.
  "George V the Brilliant reunites the Kingdom of Georgia: he takes Imereti (1329–1330) and brings Samtskhe back under the crown (1334).": "Georg V den lysande återförenar kungariket Georgien: han tar Imeretien (1329–1330) och för Samtsche tillbaka under kronan (1334)."
  The Ilkhanate breaks up after the death of Abu Said (1335). Hasan Kuchak of the Chobanid family takes Azerbaijan, Arran and Armenia.: Ilkhanatet faller sönder efter Abu Saids död (1335). Hasan Kuchak av den chobanidiska släkten tar Azerbajdzjan, Arran och Armenien.
  The Golden Horde khan Jani Beg ends the Chobanid state (1357); after his death Shaikh Uvais of the Jalayirids takes Tabriz.: Gyllene hordens khan Jani Beg gör slut på chobanidernas stat (1357); efter hans död intar Shaikh Uvais av jalayiriderna Tabriz.
  Ibrahim I of Derbent becomes Shirvanshah and founds the Derbendi dynasty, which holds Derbent with Shirvan.: Ibrahim I av Derbent blir sjirvansjah och grundar den derbendiska dynastin, som behärskar Derbent tillsammans med Sjirvan.
  Timur takes Tabriz and invades Georgia, where he captures Tbilisi. Azerbaijan, Arran and Armenia become part of his empire; Georgia and Shirvan survive as tributaries.: Timur intar Tabriz och invaderar Georgien, där han erövrar Tbilisi. Azerbajdzjan, Arran och Armenien blir en del av hans rike; Georgien och Sjirvan överlever som tributpliktiga.
  Timur defeats Tokhtamysh of the Golden Horde on the Terek and ravages the northern Caucasus; Alania never recovers. Kabarda becomes the leading power of the Circassian princes, and the Chechen and Ingush communities of the mountains are left to themselves.: Timur besegrar Toktamysj av Gyllene horden vid Terek och härjar norra Kaukasus; Alanien återhämtar sig aldrig. Kabarda blir den ledande makten bland de tjerkessiska furstarna, och de tjetjenska och ingusjiska bergssamhällena lämnas åt sig själva.
  About 1400. After Timur’s campaigns Sheki is ruled by its own princes.: Omkring 1400. Efter Timurs fälttåg styrs Sjeki av egna furstar.
  Qara Yusuf of the Kara Koyunlu defeats and kills Timur’s son Miran Shah at Sardrud and takes Azerbaijan.: Qara Yusuf av Kara Koyunlu besegrar och dödar Timurs son Miran Shah vid Sardrud och tar Azerbajdzjan.
  At Chikhori the rebel Bagrat of Imereti defeats King George VIII. Bagrat becomes king in Imereti, and the princes of Mingrelia, Guria and Abkhazia rule their lands as vassals in name only.: Vid Tjichori besegrar rebellen Bagrat av Imeretien kung Georg VIII. Bagrat blir kung i Imeretien, och furstarna i Mingrelien, Gurien och Abchazien styr sina länder som vasaller endast till namnet.
  Qvarqvare II Jaqeli of Samtskhe defeats and captures George VIII at Paravani; Samtskhe breaks away again, and George rules on in Kakheti as its first king.: Qvarqvare II Jaqeli av Samtsche besegrar och tillfångatar Georg VIII vid Paravani; Samtsche bryter sig loss igen, och Georg fortsätter att regera i Kachetien som dess förste kung.
  Uzun Hasan of the Aq Qoyunlu defeats and kills Jahan Shah of the Kara Koyunlu.: Uzun Hasan av Aq Qoyunlu besegrar och dödar Jahan Shah av Kara Koyunlu.
  Ismail Safavi defeats the Aq Qoyunlu at Sharur, takes Tabriz and is crowned shah of Persia.: Ismail Safavi besegrar Aq Qoyunlu vid Sharur, intar Tabriz och kröns till shah av Persien.
  Rostom Gurieli receives Adjara, taken from Samtskhe.: Rostom Gurieli får Adzjarien, som tagits från Samtsche.
  Shah Tahmasp I ends the rule of the Shirvanshahs and annexes Shirvan and Derbent.: Shah Tahmasp I gör slut på sjirvansjahernas styre och annekterar Sjirvan och Derbent.
  Shah Tahmasp I annexes Sheki.: Shah Tahmasp I annekterar Sjeki.
  Lala Mustafa Pasha defeats the Persians at Çıldır and takes Samtskhe, which becomes the Ottoman province of Childir (Akhaltsikhe).: Lala Mustafa pasha besegrar perserna vid Çıldır och tar Samtsche, som blir den osmanska provinsen Childir (Achaltsiche).
  "Treaty of Constantinople. Persia cedes to the Ottomans the Caucasus lands they had taken since 1578: Erivan, Nakhchivan, Karabakh, Ganja, Shirvan with Derbent, Sheki and Tabriz.": "Freden i Konstantinopel. Persien avträder till osmanerna de kaukasiska länder de hade tagit sedan 1578: Erivan, Nachitjevan, Karabach, Ganja, Sjirvan med Derbent, Sjeki och Tabriz."
  Shah Abbas I retakes Tabriz (1603), Nakhchivan and Erivan.: Shah Abbas I återtar Tabriz (1603), Nachitjevan och Erivan.
  Shah Abbas I completes the reconquest with Ganja (1606), Shirvan, Baku and Derbent.: Shah Abbas I fullbordar återerövringen med Ganja (1606), Sjirvan, Baku och Derbent.
  The Ottomans conquer Adjara.: Osmanerna erövrar Adzjarien.
  The Lezgin (Avar and Tsakhur) communities of Jar and Belokani defeat the king of Kakheti and keep the lands of old Hereti north of the Alazani as free communities.: De lezginska (avariska och tsachuriska) samhällena i Jar och Belokani besegrar kungen av Kachetien och behåller som fria samhällen det gamla Heretis land norr om Alazani.
  "Peter the Great’s Persian campaign: Derbent opens its gates to the Russian army.": "Peter den stores persiska fälttåg: Derbent öppnar sina portar för den ryska armén."
  Treaty of Saint Petersburg. The Safavid prince Tahmasp cedes the Caspian coast to Russia; Russian troops hold Baku (taken in July), Quba, Salyan and the Talysh coast.: Freden i Sankt Petersburg. Den safavidiske prinsen Tahmasp avträder Kaspiska havets kust till Ryssland; ryska trupper håller Baku (intaget i juli), Quba, Saljan och Talysjkusten.
  Treaty of Constantinople between Russia and the Ottomans. Ottoman armies take Tbilisi and Kartli (1723), Erivan, Ganja, Nakhchivan and Karabakh; Shirvan and Sheki submit under Ottoman protection.: Fördraget i Konstantinopel mellan Ryssland och osmanerna. Osmanska arméer intar Tbilisi och Kartli (1723), Erivan, Ganja, Nachitjevan och Karabach; Sjirvan och Sjeki ställer sig under osmanskt beskydd.
  The Ottomans take Tabriz.: Osmanerna intar Tabriz.
  Nader, Tahmasp II’s general, drives the Ottomans out of Tabriz and Azerbaijan.: Nader, Tahmasp II:s fältherre, driver ut osmanerna ur Tabriz och Azerbajdzjan.
  Treaty of Resht. Russia returns the Persian lands south of the Kura.: Freden i Resjt. Ryssland återlämnar de persiska länderna söder om Kura.
  Treaty of Ganja. Russia returns Baku and Derbent to Persia.: Freden i Ganja. Ryssland återlämnar Baku och Derbent till Persien.
  Nader defeats the Ottomans at Yeghevard and retakes Ganja, Tbilisi, Shirvan and Karabakh. Kartli is ruled by Persian governors.: Nader besegrar osmanerna vid Yeghevard och återtar Ganja, Tbilisi, Sjirvan och Karabach. Kartli styrs av persiska ståthållare.
  Erivan surrenders to Nader (October 1735), who is crowned shah in 1736 and makes Erivan one of four khanates in the Caucasus.: Erivan kapitulerar för Nader (oktober 1735), som kröns till shah 1736 och gör Erivan till ett av fyra khanat i Kaukasus.
  Haji Chalabi leads a rising against Nader’s officials in Sheki and founds the Khanate of Sheki.: Haji Chalabi leder ett uppror mot Naders ämbetsmän i Sjeki och grundar khanatet Sjeki.
  Nader gives Kartli to Teimuraz II and Kakheti to his son Erekle II as vassal kings.: Nader ger Kartli åt Teimuraz II och Kachetien åt hans son Erekle II som vasallkungar.
  Nader Shah is murdered, and Persian rule north of the Aras falls apart. The khans of Karabakh, Ganja, Shirvan, Baku, Quba, Derbent, Talysh, Javad, Erivan and Nakhchivan rule as independent princes.: Nader shah mördas, och det persiska styret norr om Aras faller samman. Khanerna i Karabach, Ganja, Sjirvan, Baku, Quba, Derbent, Talysj, Javad, Erivan och Nachitjevan styr som oberoende furstar.
  Teimuraz II dies, and Erekle II unites Kartli and Kakheti; the kingdom also holds the Kazakh and Shamshadil lands north of Ganja.: Teimuraz II dör, och Erekle II förenar Kartli och Kachetien; riket omfattar också Kazach- och Sjamsjadilländerna norr om Ganja.
  Fatali Khan of Quba takes Derbent; by the 1780s he also controls Baku and Shirvan, but his realm breaks up after his death (1789).: Fatali khan av Quba intar Derbent; på 1780-talet behärskar han även Baku och Sjirvan, men hans välde faller sönder efter hans död (1789).
  Agha Mohammad Khan Qajar receives the submission of Erivan and Nakhchivan on his way to sack Tbilisi; both stay under Persian rule until 1828.: Agha Mohammad khan Qajar tar emot Erivans och Nachitjevans underkastelse på väg mot Tbilisi, som han plundrar; båda förblir under persiskt styre till 1828.
  The khans of Karabakh, with Zangezur, and Sheki (and in December Shirvan) accept Russian suzerainty, Russia annexes the Shuragel sultanate around Gyumri, and the Khanate of Javad is annexed.: Khanerna i Karabach, med Zangezur, och Sjeki (och i december Sjirvan) erkänner rysk överhöghet, Ryssland annekterar sultanatet Sjuragel runt Gjumri, och khanatet Javad annekteras.
  About 800. The Abbasid Caliphate of Harun al-Rashid rules Iraq, Iran, Khorasan and Transoxiana. Gilan on the Caspian, the Shahis of Kabul, the Zunbils of Zabulistan and the Turkic Karluks are outside its rule, and the mountains of Ghor, Badakhshan and the Pamirs are held by local chiefs (not shown as states).: Omkring 800. Harun al-Rashids abbasidiska kalifat styr Irak, Iran, Khorasan och Transoxanien. Gilan vid Kaspiska havet, Kabulshahierna, zunbilerna i Zabulistan och de turkiska karlukerna står utanför dess styre, och bergen i Ghor, Badakhshan och Pamir behärskas av lokala hövdingar (visas inte som stater).
  Tahir ibn Husayn, al-Ma’mun’s general, becomes governor of Khorasan. His family, the Tahirids, govern Khorasan and the east as hereditary governors for the caliphs until 873; the Samanid brothers rule Transoxiana under them.: Tahir ibn Husayn, al-Ma’muns fältherre, blir ståthållare i Khorasan. Hans släkt, tahiriderna, styr Khorasan och de östra provinserna som ärftliga ståthållare åt kaliferna fram till 873; de samanidiska bröderna styr Transoxanien under dem.
  Mazyar, the ruler of Tabaristan, rebels against the Tahirids and is defeated and executed; Tabaristan passes to the Tahirids.: Mazyar, härskaren i Tabaristan, gör uppror mot tahiriderna men besegras och avrättas; Tabaristan övergår till tahiriderna.
  "Ya’qub ibn al-Layth, a coppersmith turned leader of volunteer fighters, takes Zaranj in Sistan: the beginning of the Saffarids.": "Ya’qub ibn al-Layth, en kopparslagare som blivit ledare för frivilliga krigare, intar Zaranj i Sistan: början på saffariddynastin."
  Hasan ibn Zayd, a Zaydi descendant of Ali, is proclaimed in Tabaristan and drives out the Tahirid governors.: Hasan ibn Zayd, en zayditisk ättling till Ali, utropas till härskare i Tabaristan och driver ut de tahiridiska ståthållarna.
  Ya’qub kills the Zunbil of Zabulistan and takes his lands, Bost and Ghazni among them.: Ya’qub dödar zunbilen av Zabulistan och tar hans länder, bland dem Bost och Ghazni.
  Ya’qub takes Kerman. He also defeats the governor of Fars at Shiraz, but goes home with the spoils.: Ya’qub intar Kerman. Han besegrar också ståthållaren i Fars vid Shiraz men vänder hem med bytet.
  Ya’qub takes Herat, Balkh and Bamyan (870–871), and drives the Hindu Shahis from Kabul.: Ya’qub intar Herat, Balkh och Bamyan (870–871) och driver hindushahierna från Kabul.
  Ya’qub enters Nishapur and ends Tahirid rule in Khorasan. In Transoxiana the Samanid governors, until now under the Tahirids, rule on their own; the caliph names Nasr ibn Ahmad governor of all Transoxiana in 875.: Ya’qub tågar in i Nishapur och gör slut på tahiridernas styre i Khorasan. I Transoxanien styr de samanidiska ståthållarna, som hittills lytt under tahiriderna, på egen hand; kalifen utnämner Nasr ibn Ahmad till ståthållare över hela Transoxanien 875.
  Ya’qub defeats Muhammad ibn Wasil, master of Fars since 870, near Lake Bakhtegan and takes Fars.: Ya’qub besegrar Muhammad ibn Wasil, herre över Fars sedan 870, nära Bakhtegansjön och tar Fars.
  Ismail the Samanid takes Talas from the Karluks.: Samaniden Ismail tar Talas från karlukerna.
  Ismail the Samanid defeats and captures the Saffarid Amr ibn al-Layth near Balkh. Khorasan passes to the Samanids, who also take Tabaristan from the Alids; the Saffarids keep Sistan, Kerman and Fars, and Kabul returns to the Hindu Shahis. Ghazni and Bost fall to local rulers (not shown as states).: Samaniden Ismail besegrar och tillfångatar saffariden Amr ibn al-Layth nära Balkh. Khorasan övergår till samaniderna, som också tar Tabaristan från aliderna; saffariderna behåller Sistan, Kerman och Fars, och Kabul återgår till hindushahierna. Ghazni och Bost tillfaller lokala härskare (visas inte som stater).
  Abbasid forces retake Fars and Kerman from the Saffarids.: Abbasidiska styrkor återtar Fars och Kerman från saffariderna.
  The Samanids conquer Sistan (911–913).: Samaniderna erövrar Sistan (911–913).
  Hasan al-Utrush restores Alid rule in Tabaristan (until 928).: Hasan al-Utrush återupprättar alidernas styre i Tabaristan (fram till 928).
  A Saffarid, Abu Ja’far Ahmad, is restored in Sistan under Samanid overlordship.: En saffarid, Abu Ja’far Ahmad, återinsätts i Sistan under samanidisk överhöghet.
  The Hamdanid Nasir al-Dawla governs Mosul and the Jazira for the caliphs, and from the 930s on his own account.: Hamdaniden Nasir al-Dawla styr Mosul och Jazira åt kaliferna, och från 930-talet för egen räkning.
  "Mardavij ibn Ziyar, a Gilani officer who overthrew Asfar ibn Shiruya, the last master of the former Alid lands, rules Tabaristan, Gorgan and the Jibal from Isfahan: the Ziyarid dynasty.": "Mardavij ibn Ziyar, en officer från Gilan som har störtat Asfar ibn Shiruya, den siste herren över de forna alidiska länderna, styr Tabaristan, Gorgan och Jibal från Isfahan: ziyariddynastin."
  Muhammad ibn Ilyas, a Samanid officer, makes himself ruler of Kerman (until 968).: Muhammad ibn Ilyas, en samanidisk officer, gör sig till härskare över Kerman (fram till 968).
  "Ali ibn Buya, later called Imad al-Dawla, takes Shiraz: the Buyids, Daylamite soldiers, rule Fars.": "Ali ibn Buya, senare kallad Imad al-Dawla, intar Shiraz: buyiderna, daylamitiska soldater, styr Fars."
  The Buyid Ahmad ibn Buya takes Khuzestan.: Buyiden Ahmad ibn Buya tar Khuzestan.
  About 940. The Karakhanids, a Turkic dynasty that turns to Islam under Satuq Bughra Khan, take Balasagun from the Karluks.: Omkring 940. Karakhaniderna, en turkisk dynasti som övergår till islam under Satuq Bughra khan, tar Balasagun från karlukerna.
  The Buyid Rukn al-Dawla retakes Isfahan, which he first took after Mardavij’s murder in 935 and lost to the Ziyarid Vushmgir; the Buyids hold Isfahan and the Jibal.: Buyiden Rukn al-Dawla återtar Isfahan, som han först intog efter mordet på Mardavij 935 och sedan förlorade till ziyariden Vushmgir; buyiderna behärskar Isfahan och Jibal.
  The Buyid Rukn al-Dawla takes Rayy for good.: Buyiden Rukn al-Dawla intar Rayy för gott.
  Ahmad ibn Buya enters Baghdad and the caliph names him Mu’izz al-Dawla. The Buyids rule Iraq; the Abbasid caliphs keep only their religious authority.: Ahmad ibn Buya tågar in i Bagdad, och kalifen ger honom namnet Mu’izz al-Dawla. Buyiderna styr Irak; de abbasidiska kaliferna behåller bara sin religiösa auktoritet.
  Alptigin, a Samanid general who had fallen out with the court, takes Ghazni; his Turkish successors, the Ghaznavids, rule it as Samanid vassals.: Alptigin, en samanidisk fältherre som blivit osams med hovet, intar Ghazni; hans turkiska efterträdare, ghaznaviderna, styr staden som samanidiska vasaller.
  The Buyid Adud al-Dawla ends the Ilyasids and takes Kerman.: Buyiden Adud al-Dawla gör slut på ilyasiderna och tar Kerman.
  Sabuktigin succeeds at Ghazni and takes Bost.: Sabuktigin blir härskare i Ghazni och intar Bost.
  Adud al-Dawla takes Mosul from the Hamdanids.: Adud al-Dawla tar Mosul från hamdaniderna.
  Adud al-Dawla, who took Tabaristan in 980, and his brother Mu’ayyad al-Dawla drive the Ziyarid Qabus from Gorgan (until 998).: Adud al-Dawla, som intog Tabaristan 980, och hans bror Mu’ayyad al-Dawla driver ut ziyariden Qabus från Gorgan (fram till 998).
  Sabuktigin defeats Jayapala, the Hindu Shahi king, near Laghman and takes Kabul and the lands from Laghman towards Peshawar.: Sabuktigin besegrar hindushahikungen Jayapala nära Laghman och tar Kabul och landet från Laghman mot Peshawar.
  The Uqaylid Arabs take Mosul from the Buyids.: De uqaylidiska araberna tar Mosul från buyiderna.
  Ma’mun ibn Muhammad of Gurganj unites Khwarazm under his Ma’munid dynasty.: Ma’mun ibn Muhammad av Gurganj enar Khwarazm under sin dynasti, ma’muniderna.
  Qabus regains Tabaristan and Gorgan for the Ziyarids.: Qabus återvinner Tabaristan och Gorgan åt ziyariderna.
  The Karakhanids take Bukhara and end the Samanid state north of the Oxus. Mahmud of Ghazni, who held Khorasan for the Samanids, keeps the lands south of it and rules on his own.: Karakhaniderna intar Buchara och gör slut på den samanidiska staten norr om Oxus. Mahmud av Ghazni, som behärskade Khorasan åt samaniderna, behåller länderna söder om floden och styr på egen hand.
  Mahmud of Ghazni defeats Jayapala near Peshawar; the Hindu Shahis lose their lands west of the Indus.: Mahmud av Ghazni besegrar Jayapala nära Peshawar; hindushahierna förlorar sina länder väster om Indus.
  Mahmud ends the Saffarids of Sistan.: Mahmud gör slut på saffariderna i Sistan.
  Mahmud subdues Ghor.: Mahmud underkuvar Ghor.
  Mahmud annexes Khwarazm and ends the Ma’munids.: Mahmud annekterar Khwarazm och gör slut på ma’muniderna.
  Mahmud takes Rayy from the Buyid Majd al-Dawla.: Mahmud tar Rayy från buyiden Majd al-Dawla.
  The Seljuk Turks under Tughril take Nishapur; Merv had fallen to them in 1037.: Seldjukturkarna under Tughril intar Nishapur; Merv hade fallit i deras händer 1037.
  The Seljuks defeat the Ghaznavid Mas’ud at Dandanaqan. Khorasan and Herat pass to them; the Ghaznavids keep Balkh and their lands to the east.: Seldjukerna besegrar ghaznaviden Mas’ud vid Dandanaqan. Khorasan och Herat övergår till dem; ghaznaviderna behåller Balkh och sina länder i öster.
  The Seljuks take Rayy, Gorgan and Tabaristan; the Ziyarids rule on as their vassals until 1090.: Seldjukerna tar Rayy, Gorgan och Tabaristan; ziyariderna fortsätter att styra som deras vasaller fram till 1090.
  The Seljuks take Khwarazm.: Seldjukerna tar Khwarazm.
  Qavurt, Tughril’s nephew, founds the Seljuk sultanate of Kerman; Sistan accepts Seljuk rule.: Qavurt, Tughrils brorson, grundar det seldjukiska sultanatet Kerman; Sistan godtar seldjukiskt styre.
  Tughril takes Isfahan, which becomes his capital, and the Jibal.: Tughril tar Jibal och Isfahan, som blir hans huvudstad.
  Tughril enters Baghdad; the last Buyid ruler of Iraq is deposed.: Tughril tågar in i Bagdad; den siste buyidiske härskaren i Irak avsätts.
  "Peace between the Seljuks and the Ghaznavids: Balkh and Tokharistan go to the Seljuks.": "Fred mellan seldjukerna och ghaznaviderna: Balkh och Tokharistan tillfaller seldjukerna."
  The Seljuks end the last Buyid rule in Fars.: Seldjukerna gör slut på det sista buyidiska styret i Fars.
  The Nizari Ismailis, who seized Alamut in 1090, take control of Quhistan.: De nizaritiska ismailiterna, som intog Alamut 1090, tar kontroll över Quhistan.
  Kerbogha, a Seljuk commander, takes Mosul from the Uqaylids.: Kerbogha, en seldjukisk befälhavare, tar Mosul från uqayliderna.
  "Qutb al-Din Muhammad becomes Khwarazmshah: his Anushteginid dynasty rules Khwarazm as Seljuk vassals.": "Qutb al-Din Muhammad blir khwarazmshah: hans dynasti, anushteginiderna, styr Khwarazm som seldjukiska vasaller."
  "Imad al-Din Zengi becomes atabeg of Mosul: the Zengids.": "Imad al-Din Zengi blir atabeg i Mosul: zengiddynastin."
  Yelü Dashi, founder of the Qara Khitai, takes Balasagun from the Karakhanids.: Yelü Dashi, grundaren av Qara Khitai, tar Balasagun från karakhaniderna.
  Sunqur ibn Mawdud founds the Salghurid atabegate of Fars.: Sunqur ibn Mawdud grundar salghuridernas atabegat i Fars.
  The Shansabani princes of Ghor throw off Ghaznavid rule; in 1150 Ala al-Din Husayn burns Ghazni.: Shansabanifurstarna i Ghor skakar av sig det ghaznavidiska styret; 1150 bränner Ala al-Din Husayn Ghazni.
  Sanjar, the last Great Seljuk sultan in the east, dies after three years as a captive of the Oghuz. Khorasan breaks up among Oghuz chiefs and former Seljuk commanders (not shown as states); the Abbasid caliphs rule Iraq on their own again, the Bavandids Tabaristan and the maliks of Sistan their province.: Sanjar, den siste storseldjukiske sultanen i öster, dör efter tre år som oguzernas fånge. Khorasan splittras mellan oguziska hövdingar och före detta seldjukiska befälhavare (visas inte som stater); de abbasidiska kaliferna styr åter Irak på egen hand, liksom bavandiderna Tabaristan och malikerna i Sistan sin provins.
  Ghiyath al-Din of Ghor takes Ghazni; the Ghaznavids withdraw to Lahore.: Ghiyath al-Din av Ghor intar Ghazni; ghaznaviderna drar sig tillbaka till Lahore.
  The Ghurids take Herat.: Ghuriderna intar Herat.
  Oghuz tribesmen under Malik Dinar end the Seljuk sultanate of Kerman.: Oguziska stamkrigare under Malik Dinar gör slut på det seldjukiska sultanatet Kerman.
  The Khwarazmshah Tekish takes Nishapur and, over the next years, the rest of western Khorasan.: Khwarazmshahen Tekish intar Nishapur och under de följande åren resten av västra Khorasan.
  Tekish defeats and kills Tughril III, the last Seljuk sultan of Iraq, near Rayy. The Khwarazmshahs take the Jibal; Caliph al-Nasir takes Khuzestan.: Tekish besegrar och dödar Tughril III, den siste seldjukiske sultanen av Irak, nära Rayy. Khwarazmshaherna tar Jibal; kalifen al-Nasir tar Khuzestan.
  The Ghurids take Balkh.: Ghuriderna intar Balkh.
  About 1203. The Khwarazmshahs take Kerman.: Omkring 1203. Khwarazmshaherna tar Kerman.
  The Khwarazmshah Muhammad II ends the Bavandids of Tabaristan.: Khwarazmshahen Muhammad II gör slut på bavandiderna i Tabaristan.
  Kuchlug, a Naiman prince, usurps the throne of the Qara Khitai and takes the eastern Karakhanid lands in Ferghana.: Kuchlug, en naimanfurste, tillskansar sig Qara Khitais tron och tar de östra karakhanidiska länderna i Fergana.
  Muhammad II takes Samarkand and ends the western Karakhanids.: Muhammad II intar Samarkand och gör slut på de västra karakhaniderna.
  "After the death of Muhammad of Ghor (1206) the Khwarazmshahs take the Ghurid lands: Herat, Balkh and, in 1215, Ghazni.": "Efter Muhammad av Ghors död (1206) tar khwarazmshaherna de ghuridiska länderna: Herat, Balkh och 1215 Ghazni."
  The Mongol general Jebe destroys Kuchlug; the former Qara Khitai lands pass to the Mongol Empire.: Den mongoliske fältherren Jebe förintar Kuchlug; Qara Khitais forna länder övergår till Mongolriket.
  Genghis Khan takes Bukhara (February) and Samarkand (March).: Djingis khan intar Buchara (februari) och Samarkand (mars).
  The Mongols destroy Gurganj, Merv, Nishapur, Balkh and Herat, and defeat Jalal al-Din on the Indus in November. His brother Ghiyath al-Din holds the Jibal and Isfahan, and the Nizaris keep Quhistan.: Mongolerna förstör Gurganj, Merv, Nishapur, Balkh och Herat och besegrar Jalal al-Din vid Indus i november. Hans bror Ghiyath al-Din behärskar Jibal och Isfahan, och nizariterna behåller Quhistan.
  "Baraq Hajib, a former Qara Khitai officer, takes Kerman: the Qutlugh-Khanids, who soon accept Mongol overlordship.": "Baraq Hajib, en före detta officer i Qara Khitai, tar Kerman: qutlugh-khaniderna, som snart godtar mongolisk överhöghet."
  Jalal al-Din is killed; the Mongol general Chormaqan takes the Jibal and Rayy (Isfahan falls in 1235/36).: Jalal al-Din dödas; den mongoliske fältherren Chormaqan tar Jibal och Rayy (Isfahan faller 1235/36).
  Shams al-Din Kart succeeds his father as malik of Herat. His Kartid dynasty rules Herat and Ghor as vassals of the Mongols, from 1256 of the Ilkhans.: Shams al-Din Kart efterträder sin far som malik av Herat. Hans dynasti, kartiderna, styr Herat och Ghor som vasaller under mongolerna, från 1256 under ilkhanerna.
  Hülegü destroys the Nizari castles and founds the Ilkhanate.: Hülegü förstör nizariternas borgar och grundar Ilkhanatet.
  Hülegü takes Baghdad and has the last Abbasid caliph of Baghdad, al-Musta’sim, killed.: Hülegü intar Bagdad och låter döda den siste abbasidiske kalifen i Bagdad, al-Musta’sim.
  About 1260. The Chagatai khan Alghu takes Transoxiana; the Golden Horde holds Khwarazm. In Afghanistan the Chagatai khans and their Negüderi allies hold Balkh, Kabul and Ghazni.: Omkring 1260. Tjagataikhanen Alghu tar Transoxanien; Gyllene horden behärskar Khwarazm. I Afghanistan behärskar tjagataikhanerna och deras negüderiska bundsförvanter Balkh, Kabul och Ghazni.
  The Ilkhanate takes Mosul from the successors of Badr al-Din Lu’lu’, who had ruled it from 1233 as the Zengids’ heir (shown with Zengid Mosul until then).: Ilkhanatet tar Mosul från efterträdarna till Badr al-Din Lu’lu’, som hade styrt staden från 1233 som zengidernas arvtagare (visas fram till dess som zengidernas Mosul).
  The Ilkhanate annexes Fars after the last Salghurid ruler, Abish Khatun.: Ilkhanatet annekterar Fars efter den sista salghuridiska härskaren, Abish Khatun.
  About 1300. The kings of Hormuz move to the island of Jarun, the new Hormuz, which becomes the Gulf’s great trading port.: Omkring 1300. Kungarna av Hormuz flyttar till ön Jarun, det nya Hormuz, som blir Persiska vikens stora handelshamn.
  Öljeitü conquers Gilan and ends the Qutlugh-Khanids of Kerman.: Öljeitü erövrar Gilan och gör slut på qutlugh-khaniderna i Kerman.
  The Ilkhanate breaks up after the death of Abu Sa’id (1335). The Jalayirids take Baghdad, the Chobanids the Jibal, the Injuids Fars and Isfahan, the Muzaffarids Kerman and the Sarbadars western Khorasan; the Kartids of Herat rule on their own, and Gilan and Mazandaran return to local rulers.: Ilkhanatet bryts upp efter Abu Sa’ids död (1335). Jalayiriderna tar Bagdad, chobaniderna Jibal, injuiderna Fars och Isfahan, muzaffariderna Kerman och sarbadarerna västra Khorasan; kartiderna i Herat styr på egen hand, och Gilan och Mazandaran återgår till lokala härskare.
  "The Chagatai Khanate splits: the eastern khans rule Moghulistan, while Transoxiana is run by Turkic emirs in the name of puppet khans.": "Tjagataikhanatet delas: de östra khanerna styr Moghulistan, medan Transoxanien styrs av turkiska emirer i marionettkhaners namn."
  The Muzaffarid Mubariz al-Din takes Shiraz (1353) and Isfahan (1357), ending the Injuids.: Muzaffariden Mubariz al-Din intar Shiraz (1353) och Isfahan (1357) och gör slut på injuiderna.
  After the end of the Chobanids (1357) the Jalayirids take the Jibal.: Efter chobanidernas fall (1357) tar jalayiriderna Jibal.
  Husayn Sufi takes Urgench from the Golden Horde and founds the Sufi dynasty of Khwarazm.: Husayn Sufi tar Urgentj från Gyllene horden och grundar sufidynastin i Khwarazm.
  Timur defeats his rival Amir Husayn at Balkh and becomes master of Transoxiana.: Timur besegrar sin rival Amir Husayn vid Balkh och blir herre över Transoxanien.
  Timur takes Herat and ends the Kartids; the Sarbadars submit.: Timur intar Herat och gör slut på kartiderna; sarbadarerna underkastar sig.
  Timur sacks Sistan and takes Kandahar.: Timur härjar Sistan och intar Kandahar.
  Timur takes Gorgan, Rayy and Sultaniyya.: Timur intar Gorgan, Rayy och Sultaniyya.
  Timur destroys Urgench and annexes Khwarazm.: Timur förstör Urgentj och annekterar Khwarazm.
  "Timur’s Five-Year Campaign: he ends the Muzaffarids, takes Mazandaran (1392) and in August 1393 Baghdad.": "Timurs femårsfälttåg: han gör slut på muzaffariderna, tar Mazandaran (1392) och i augusti 1393 Bagdad."
  Timur dies at Otrar (18 February). Ahmad Jalayir returns to Baghdad, the Marashi sayyids to Mazandaran and the maliks of Sistan to their province.: Timur dör i Otrar (18 februari). Ahmad Jalayir återvänder till Bagdad, de marashiska sayyiderna till Mazandaran och malikerna i Sistan till sin provins.
  Qara Yusuf of the Kara Koyunlu takes Baghdad and the Jibal from the Jalayirids, who hold out in the south until 1432.: Qara Yusuf av Kara Koyunlu tar Bagdad och Jibal från jalayiriderna, som håller stånd i söder fram till 1432.
  The Kara Koyunlu take Basra from the last Jalayirids.: Kara Koyunlu tar Basra från de sista jalayiriderna.
  About 1440. The Musha’sha’, a messianic Arab movement led by Muhammad ibn Falah, take Khuzestan.: Omkring 1440. Musha’sha’, en messiansk arabisk rörelse under ledning av Muhammad ibn Falah, tar Khuzestan.
  After the death of the Timurid Shah Rukh (1447), Jahan Shah of the Kara Koyunlu takes Rayy, Isfahan, Fars and Kerman (1452–1458).: Efter timuriden Shah Rukhs död (1447) tar Jahan Shah av Kara Koyunlu Rayy, Isfahan, Fars och Kerman (1452–1458).
  Uzun Hasan of the Aq Qoyunlu defeats and kills Jahan Shah; the Aq Qoyunlu take the Kara Koyunlu lands in Iraq and western Iran.: Uzun Hasan av Aq Qoyunlu besegrar och dödar Jahan Shah; Aq Qoyunlu tar Kara Koyunlus länder i Irak och västra Iran.
  The Arghuns, Timurid governors, rule Kandahar on their own.: Arghunerna, timuridiska ståthållare, styr Kandahar på egen hand.
  Yunus Khan of Moghulistan takes Tashkent.: Yunus khan av Moghulistan intar Tasjkent.
  Muhammad Shaybani Khan’s Uzbeks take Samarkand and Bukhara from the Timurids (1500–1501).: Muhammad Shaybani khans uzbeker tar Samarkand och Buchara från timuriderna (1500–1501).
  Shah Ismail I defeats the Aq Qoyunlu at Hamadan; by 1504 he holds the Jibal, Isfahan, Fars, Yazd and Kerman.: Shah Ismail I besegrar Aq Qoyunlu vid Hamadan; år 1504 behärskar han Jibal, Isfahan, Fars, Yazd och Kerman.
  Shaybani defeats the khans of Moghulistan at Akhsi and takes Tashkent and Ferghana.: Shaybani besegrar khanerna av Moghulistan vid Akhsi och tar Tasjkent och Fergana.
  Babur, a Timurid prince driven out of Ferghana, takes Kabul.: Babur, en timuridisk prins som fördrivits från Fergana, intar Kabul.
  Shaybani takes Urgench and Khwarazm.: Shaybani tar Urgentj och Khwarazm.
  Shaybani takes Herat and ends the Timurids of Khorasan.: Shaybani intar Herat och gör slut på timuriderna i Khorasan.
  Shah Ismail takes Baghdad, Mosul and Khuzestan; the Musha’sha’ rule on as his vassals.: Shah Ismail tar Bagdad, Mosul och Khuzestan; Musha’sha’ fortsätter att styra som hans vasaller.
  Shah Ismail defeats and kills Muhammad Shaybani near Merv and takes Khorasan and Herat; the Uzbeks fall back across the Oxus. Babur takes Kunduz and Badakhshan.: Shah Ismail besegrar och dödar Muhammad Shaybani nära Merv och tar Khorasan och Herat; uzbekerna drar sig tillbaka över Oxus. Babur tar Kunduz och Badakhshan.
  "Ilbars, a Shaybanid of the Arabshahid line, takes Khwarazm: the Khanate of Khiva.": "Ilbars, en shaybanid av den arabshahidiska grenen, tar Khwarazm: khanatet Chiva."
  The Uzbeks defeat Babur and his Persian allies at Ghazdewan; Babur loses Transoxiana and Balkh but keeps Kunduz and Badakhshan.: Uzbekerna besegrar Babur och hans persiska bundsförvanter vid Ghazdewan; Babur förlorar Transoxanien och Balkh men behåller Kunduz och Badakhshan.
  The Portuguese under Afonso de Albuquerque build a fortress on Hormuz; the kings of Hormuz rule on as their vassals, and Muscat is held by a Portuguese garrison.: Portugiserna under Afonso de Albuquerque bygger en fästning på Hormuz; kungarna av Hormuz fortsätter att styra som deras vasaller, och Muskat hålls av en portugisisk garnison.
  Babur takes Kandahar from the Arghuns.: Babur tar Kandahar från arghunerna.
  Suleiman the Magnificent enters Baghdad; Iraq passes to the Ottomans.: Süleyman den store tågar in i Bagdad; Irak övergår till osmanerna.
  Basra submits to the Ottomans.: Basra underkastar sig osmanerna.
  Shah Tahmasp I takes Kandahar from the Mughals.: Shah Tahmasp I tar Kandahar från mogulerna.
  About 1570. The Moghul khans, now based in Yarkand, have lost the Chuy and Issyk-Kul lands; the Kyrgyz tribes there live outside any state.: Omkring 1570. Moghulkhanerna, som nu har sitt säte i Yarkand, har förlorat länderna vid Tjuj och Issyk-Kul; de kirgiziska stammarna där lever utan att lyda under någon stat.
  Abdullah Khan II of Bukhara takes Badakhshan and Kunduz.: Abdullah khan II av Buchara tar Badakhshan och Kunduz.
  The Uzbeks of Abdullah Khan II take Herat (1588) and Mashhad (1589).: Abdullah khan II:s uzbeker intar Herat (1588) och Mashhad (1589).
  Shah Abbas I annexes Gilan (1592) and Mazandaran (1596–97).: Shah Abbas I annekterar Gilan (1592) och Mazandaran (1596–97).
  The Mughals regain Kandahar.: Mogulerna återvinner Kandahar.
  Shah Abbas I retakes Mashhad and Herat from the Uzbeks.: Shah Abbas I återtar Mashhad och Herat från uzbekerna.
  The Kazakh khan Tevekkel takes Tashkent.: Kazakkhanen Tevekkel intar Tasjkent.
  The Turkmen of the steppe between the Caspian and Merv live outside the rule of Khiva and Persia (not shown as states).: Turkmenerna på stäppen mellan Kaspiska havet och Merv lever utanför Chivas och Persiens styre (visas inte som stater).
  An Anglo-Persian force takes Hormuz from the Portuguese; the Kingdom of Ormus ends. The Portuguese fall back on Muscat, the Batinah coast with Sohar, and Musandam; the coast to the west passes to its tribes (not shown as a state), and the Omani imams take Julfar in 1633.: En engelsk-persisk styrka tar Hormuz från portugiserna; kungariket Hormuz upphör. Portugiserna drar sig tillbaka till Muskat, Batinahkusten med Sohar samt Musandam; kusten i väster övergår till sina stammar (visas inte som en stat), och de omanska imamerna intar Julfar 1633.
  Shah Abbas I takes Kandahar from the Mughals.: Shah Abbas I tar Kandahar från mogulerna.
  Shah Abbas I takes Baghdad.: Shah Abbas I intar Bagdad.
  Sultan Murad IV retakes Baghdad. The Treaty of Zuhab (1639) leaves Iraq to the Ottomans.: Sultan Murad IV återtar Bagdad. Freden i Zuhab (1639) lämnar Irak åt osmanerna.
  The Mughals regain Kandahar, whose governor goes over to them.: Mogulerna återvinner Kandahar, vars guvernör går över till dem.
  Shah Abbas II retakes Kandahar; Mughal sieges in 1649, 1652 and 1653 fail.: Shah Abbas II återtar Kandahar; mogulernas belägringar 1649, 1652 och 1653 misslyckas.
  About 1680. The Dzungar Khanate takes Moghulistan’s lands in Semirechye.: Omkring 1680. Dzungarkhanatet tar Moghulistans länder i Semiretje.
  "Mirwais Hotak leads a revolt in Kandahar and kills the Persian governor: the Hotaki dynasty.": "Mirwais Hotak leder ett uppror i Kandahar och dödar den persiske guvernören: hotakidynastin."
  "Shahrukh Bi, of the Ming clan, makes Ferghana independent of Bukhara: the beginning of the Khanate of Kokand.": "Shahrukh Bi av mingklanen gör Fergana oberoende av Buchara: början på khanatet Kokand."
  The Abdali Afghans take Herat.: De afghanska abdalierna intar Herat.
  Isfahan surrenders to Mahmud Hotaki after a six-month siege; Shah Sultan Husayn abdicates. The Afghans hold Isfahan, Kerman and, from 1724, Shiraz; Shah Tahmasp II holds out in the north.: Isfahan kapitulerar för Mahmud Hotaki efter en sex månader lång belägring; shah Sultan Husayn abdikerar. Afghanerna behärskar Isfahan, Kerman och från 1724 Shiraz; shah Tahmasp II håller stånd i norr.
  Russian troops occupy Gilan during the Russo-Persian War; the Treaty of Saint Petersburg (1723) cedes the Caspian provinces to Russia.: Ryska trupper besätter Gilan under rysk-persiska kriget; genom fördraget i Sankt Petersburg (1723) avträds de kaspiska provinserna till Ryssland.
  The Dzungars take Tashkent and Turkestan from the Kazakhs.: Dzungarerna tar Tasjkent och Turkestan från kazakerna.
  The Ottomans take Hamadan and Kermanshah.: Osmanerna intar Hamadan och Kermanshah.
  Nader, Tahmasp II’s general, defeats the Afghans at Damghan and Murche-Khort and retakes Isfahan, Fars and Kerman.: Nader, Tahmasp II:s fältherre, besegrar afghanerna vid Damghan och Murche-Khort och återtar Isfahan, Fars och Kerman.
  Nader drives the Ottomans out of Hamadan and Kermanshah.: Nader driver ut osmanerna ur Hamadan och Kermanshah.
  Nader takes Herat from the Abdalis. By the Treaty of Rasht Russia returns Gilan.: Nader tar Herat från abdalierna. Genom fördraget i Rasht återlämnar Ryssland Gilan.
  Nader’s son Reza Qoli takes Balkh.: Naders son Reza Qoli intar Balkh.
  Nader takes Kandahar and ends the Hotaki dynasty; Kabul surrenders in June.: Nader intar Kandahar och gör slut på hotakidynastin; Kabul kapitulerar i juni.
  "Nader Shah is murdered. Ahmad Khan Abdali is chosen shah at Kandahar: the Durrani Empire.": "Nader shah mördas. Ahmad khan Abdali väljs till shah i Kandahar: Durraniriket."
  Ahmad Shah Durrani takes Herat. The Afsharid Shahrokh keeps only Khorasan, under Durrani protection; Karim Khan Zand rules western Iran from Shiraz, nominally for a Safavid puppet. Mazandaran and Astarabad are held by the Qajar chief Mohammad Hasan Khan until 1759.: Ahmad shah Durrani intar Herat. Afshariden Shahrokh behåller bara Khorasan, under durraniskt beskydd; Karim khan Zand styr västra Iran från Shiraz, nominellt för en safavidisk marionetts räkning. Mazandaran och Astarabad behärskas av qajarhövdingen Mohammad Hasan khan fram till 1759.
  Ahmad Shah takes Balkh.: Ahmad shah intar Balkh.
  The Qing destroy the Dzungar Khanate. Tashkent is ruled by its own hakims (from 1784 by Yunus Khoja), and the Kyrgyz tribes are free of outside rule (neither shown as states).: Qingdynastin krossar Dzungarkhanatet. Tasjkent styrs av sina egna hakimer (från 1784 av Yunus Khoja), och de kirgiziska stammarna är fria från yttre styre (ingetdera visas som stat).
  Ahmad Shah takes Badakhshan.: Ahmad shah tar Badakhshan.
  Basra surrenders to the Zand army after a year-long siege.: Basra kapitulerar för zandarmén efter en årslång belägring.
  Karim Khan Zand dies. Agha Mohammad Khan Qajar escapes from Shiraz and takes Mazandaran and Gorgan.: Karim khan Zand dör. Agha Mohammad khan Qajar flyr från Shiraz och tar Mazandaran och Gorgan.
  Shah Murad of Bukhara, of the Manghit dynasty, takes the title of emir and sacks Merv.: Shah Murad av Buchara, av manghitdynastin, antar titeln emir och plundrar Merv.
  Agha Mohammad Khan makes Tehran his capital; he holds the north and the Jibal.: Agha Mohammad khan gör Teheran till sin huvudstad; han behärskar norra Iran och Jibal.
  Agha Mohammad Khan enters Shiraz, handed to him by its governor Hajji Ebrahim in 1791; Lotf Ali Khan, the last Zand ruler, holds out in the south-east.: Agha Mohammad khan tågar in i Shiraz, som dess guvernör Hajji Ebrahim överlämnat till honom 1791; Lotf Ali khan, den siste zandhärskaren, håller stånd i sydost.
  Agha Mohammad Khan takes Kerman after a five-month siege and soon captures Lotf Ali Khan at Bam; Qajar Iran.: "Agha Mohammad khan intar Kerman efter en fem månader lång belägring och tillfångatar snart Lotf Ali khan i Bam: Qajarernas Iran."
  Agha Mohammad Khan takes Mashhad and ends the Afsharids.: Agha Mohammad khan intar Mashhad och gör slut på afshariderna.
  Alim Khan of Kokand takes Tashkent.: Alim khan av Kokand intar Tasjkent.
  The Durrani Empire breaks up after the Barakzai brothers rebel. Herat stays with Mahmud Shah’s Sadozai line, Kandahar goes to the Barakzai sardars, and Kabul passes to Dost Mohammad Khan in 1826.: Durraniriket bryts upp sedan barakzaibröderna gjort uppror. Herat stannar hos Mahmud shahs sadozaigren, Kandahar tillfaller barakzaisardarerna, och Kabul övergår till Dost Mohammad khan 1826.
  Murad Beg of Kunduz and the Uzbek khans of Balkh and Maimana break free of Afghan rule.: Murad beg av Kunduz och de uzbekiska khanerna av Balkh och Maimana frigör sig från afghanskt styre.
  Khiva takes Merv.: Chiva tar Merv.
  Kokand builds forts at Pishpek and Tokmak and takes over the Chuy valley.: Kokand bygger fort vid Pishpek och Tokmak och tar över Tjujdalen.
  Dost Mohammad retakes Balkh.: Dost Mohammad återtar Balkh.
  Dost Mohammad takes Kandahar.: Dost Mohammad intar Kandahar.
  Persian troops take Herat. The Anglo-Persian War follows, and by the Treaty of Paris (March 1857) Persia withdraws.: Persiska trupper intar Herat. Anglo-persiska kriget följer, och genom freden i Paris (mars 1857) drar sig Persien tillbaka.
  The Tekke Turkmen take Merv from Khiva.: Tekketurkmenerna tar Merv från Chiva.
  Persia hands Herat back to its own ruler.: Persien lämnar tillbaka Herat till dess egen härskare.
  Afghan forces take Kunduz and Badakhshan.: Afghanska styrkor tar Kunduz och Badakhshan.
  Russian troops take Pishpek and Tokmak from Kokand; the Issyk-Kul Kyrgyz accept Russian rule.: Ryska trupper tar Pishpek och Tokmak från Kokand; kirgizerna vid Issyk-Kul godtar ryskt styre.
  Dost Mohammad takes Herat, shortly before his death.: Dost Mohammad intar Herat, kort före sin död.
  Russia takes Aulie-Ata and the Talas valley.: Ryssland tar Aulie-Ata och Talasdalen.
  General Chernyayev takes Tashkent from Kokand.: General Tjernjajev tar Tasjkent från Kokand.
  Persia takes Sistan; the Goldsmid arbitration (1872) divides Sistan, leaving the Helmand delta’s west bank to Persia.: Persien tar Sistan; Goldsmids skiljedom (1872) delar Sistan och lämnar västra stranden av Helmanddeltat åt Persien.
  Russia takes Khujand, Ura-Tyube and Jizzakh.: Ryssland tar Chudzjand, Ura-Tjube och Dzjizak.
  Russia takes Samarkand. The emir of Bukhara becomes a Russian vassal (formally a protectorate from 1873).: Ryssland tar Samarkand. Emiren av Buchara blir rysk vasall (formellt protektorat från 1873).
  Russia builds a fort at Naryn.: Ryssland bygger ett fort vid Naryn.
  Russia founds Krasnovodsk on the Caspian.: Ryssland grundlägger Krasnovodsk vid Kaspiska havet.
  "Treaty of Gandomian: Khiva becomes a Russian protectorate and cedes the right bank of the Amu Darya.": "Fördraget i Gandomian: Chiva blir ett ryskt protektorat och avträder Amu-Darjas högra strand."
  Russia annexes the Khanate of Kokand as the Fergana oblast.: Ryssland annekterar khanatet Kokand som oblastet Fergana.
  Russian troops under Skobelev storm Geok Tepe; the Ahal Tekke oasis is annexed, and the Akhal-Khorasan treaty (December 1881) fixes the border with Persia.: Ryska trupper under Skobelev stormar Geok Tepe; oasen Ahal Tekke annekteras, och Akhal-Khorasanfördraget (december 1881) fastställer gränsen mot Persien.
  Afghanistan occupies Shughnan and Roshan in the western Pamirs.: Afghanistan besätter Shughnan och Roshan i västra Pamir.
  Merv submits to Russia.: Merv underkastar sig Ryssland.
  "The Anglo-Russian Pamir agreement fixes the Panj as the border: the lands north of it go to Russia and Bukhara, and the Wakhan corridor to Afghanistan.": "Det brittisk-ryska Pamiravtalet fastställer Pjandzj som gräns: länderna norr om floden tillfaller Ryssland och Buchara, och Wakhankorridoren Afghanistan."
  The Turkestan Autonomous Soviet Socialist Republic is proclaimed in Tashkent, within Soviet Russia; the fighting with the Kokand Autonomy, the Basmachi and the Transcaspian government is drawn in the wars’ steps.: Turkestanska autonoma socialistiska sovjetrepubliken utropas i Tasjkent, som en del av Sovjetryssland; striderna med Kokandautonomin, basmatjerna och den transkaspiska regeringen visas i krigens steg.
  At San Remo the Allies give Britain the mandate for Iraq, made up of the Ottoman provinces of Baghdad, Basra and Mosul; Turkey renounces Mosul in 1926.: I San Remo ger de allierade Storbritannien mandatet över Irak, som består av de osmanska provinserna Bagdad, Basra och Mosul; Turkiet avstår från Mosul 1926.
  The Khan of Khiva has abdicated (February); the Khorezm People’s Soviet Republic is proclaimed.: Khanen av Chiva har abdikerat (februari); Khorezms folksovjetrepublik utropas.
  After the Red Army takes Bukhara (2 September) the Bukharan People’s Soviet Republic is proclaimed.: Sedan Röda armén intagit Buchara (2 september) utropas Bucharas folksovjetrepublik.
  "The national delimitation of Soviet Central Asia: the people’s republics of Khorezm and Bukhara are dissolved, and the Uzbek and Turkmen SSRs and the Tajik and Kirghiz autonomous regions are formed within the Soviet Union.": "Den nationella avgränsningen i sovjetiska Centralasien: folkrepublikerna Khorezm och Buchara upplöses, och Uzbekiska och Turkmeniska SSR samt de tadzjikiska och kirgiziska autonoma områdena bildas inom Sovjetunionen."
  About 800. The Abbasid caliphs send governors to the Hejaz, Yemen and Bahrayn (eastern Arabia). Oman is ruled by its Ibadi imams; Najd, Asir, Dhofar and Hadramawt are tribal lands outside any state.: Omkring 800. De abbasidiska kaliferna sänder ståthållare till Hijaz, Jemen och Bahrayn (östra Arabien). Oman styrs av sina ibaditiska imamer; Najd, Asir, Dhofar och Hadramawt är stamområden som inte lyder under någon stat.
  Muhammad ibn Ziyad, sent by the caliph al-Ma’mun against rebels in the Tihama, founds Zabid (820). His Ziyadid dynasty rules the Tihama and the south of Yemen in the caliph’s name.: Muhammad ibn Ziyad, som kalifen al-Ma’mun sänt mot upprorsmän i Tihama, grundar Zabid (820). Hans dynasti, ziyadiderna, styr Tihama och södra Jemen i kalifens namn.
  Yu’fir ibn Abd al-Rahman takes Sanaa. His Yufirid dynasty rules the Yemeni highlands, at times recognising the Abbasids.: Yu’fir ibn Abd al-Rahman intar Sanaa. Hans dynasti, yufiriderna, styr det jemenitiska höglandet och erkänner tidvis abbasiderna.
  An Abbasid army under Muhammad ibn Nur takes Oman from the Ibadi imams.: En abbasidisk armé under Muhammad ibn Nur tar Oman från de ibaditiska imamerna.
  Yahya ibn al-Husayn, al-Hadi ila’l-Haqq, founds the Zaydi imamate at Sa’da in northern Yemen.: Yahya ibn al-Husayn, al-Hadi ila’l-Haqq, grundar det zayditiska imamatet i Sa’da i norra Jemen.
  Abu Sa’id al-Jannabi founds a Qarmatian state in Bahrayn, eastern Arabia, with its capital at al-Ahsa from the 920s. The desert coast to the north, today’s Kuwait, is tribal land (not shown as a state).: Abu Sa’id al-Jannabi grundar en qarmatisk stat i Bahrayn i östra Arabien, med huvudstad i al-Ahsa från 920-talet. Ökenkusten i norr, dagens Kuwait, är stamland (visas inte som en stat).
  "Ja’far ibn Muhammad al-Hasani takes Mecca: the beginning of the Sharifate of Mecca, which recognises the Fatimids from 969.": "Ja’far ibn Muhammad al-Hasani intar Mecka: början på sharifatet Mecka, som erkänner fatimiderna från 969."
  A Buyid expedition takes Oman.: En buyidisk expedition tar Oman.
  The Yufirid dynasty of Sanaa comes to an end; the Zaydi imams and local rulers contend for the highlands.: Yufiriddynastin i Sanaa går under; de zayditiska imamerna och lokala härskare strider om höglandet.
  "Najah, a former slave commander, takes Zabid from the slave regents who had ruled since the last Ziyadid died in 1018: the Najahid dynasty rules the Tihama.": "Najah, en före detta slavbefälhavare, tar Zabid från de slavregenter som hade styrt sedan den siste ziyadiden dog 1018: najahiddynastin styr Tihama."
  Ali ibn Muhammad al-Sulayhi, an Ismaili missionary, rises against the Zaydis in the Haraz mountains west of Sanaa and founds the Sulayhid dynasty, which unites most of Yemen by 1063.: Ali ibn Muhammad al-Sulayhi, en ismailitisk missionär, reser sig mot zayditerna i Harazbergen väster om Sanaa och grundar sulayhiddynastin, som 1063 har enat större delen av Jemen.
  Ali al-Sulayhi, who had Najah poisoned in 1060, takes Zabid and the Tihama; by 1063 Aden accepts his rule.: Ali al-Sulayhi, som lät förgifta Najah 1060, tar Zabid och Tihama; år 1063 har Aden godtagit hans styre.
  About 1065. Qavurt, the Seljuk ruler of Kerman, conquers Oman.: Omkring 1065. Qavurt, den seldjukiske härskaren i Kerman, erövrar Oman.
  Abd Allah ibn Ali al-Uyuni, with Seljuk help, overthrows the Qarmatians of Bahrayn and founds the Uyunid emirate.: Abd Allah ibn Ali al-Uyuni störtar med seldjukisk hjälp qarmaterna i Bahrayn och grundar det uyunidiska emiratet.
  Jayyash, a son of Najah, returns from exile and retakes Zabid; the Najahids rule the Tihama again.: Jayyash, en son till Najah, återvänder från landsflykten och återtar Zabid; najahiderna styr åter Tihama.
  Hatim ibn al-Ghashim, a Hamdani chief, takes power in Sanaa, left to Hamdani governors since the Sulayhids moved to Jibla; his Hatimid sultans rule Sanaa and the north.: Hatim ibn al-Ghashim, en hamdanihövding, tar makten i Sanaa, som lämnats åt hamdaniska ståthållare sedan sulayhiderna flyttat till Jibla; hans hatimidiska sultaner styr Sanaa och landet norrut.
  Queen Arwa, the last Sulayhid ruler, dies. The Zurayids of Aden take over her lands around Ta’izz and Jibla, and the Hatimid sultans of Sanaa the rest of the highlands.: Drottning Arwa, den sista sulayhidiska härskaren, dör. Zurayiderna i Aden tar över hennes länder kring Ta’izz och Jibla, och de hatimidiska sultanerna i Sanaa resten av höglandet.
  About 1154. The Nabhani dynasty takes power in Oman.: Omkring 1154. Nabhanidynastin tar makten i Oman.
  "Ali ibn Mahdi takes Zabid and ends the Najahids: the Mahdids.": "Ali ibn Mahdi intar Zabid och gör slut på najahiderna: mahdiddynastin."
  Saladin’s brother Turan-Shah conquers Zabid and Aden, and the Hejaz comes under Ayyubid overlordship; Sanaa follows in 1175.: Saladins bror Turan-Shah erövrar Zabid och Aden, och Hijaz hamnar under ayyubidisk överhöghet; Sanaa följer 1175.
  "Umar ibn Rasul, the Ayyubids’ governor, makes himself sultan of Yemen: the Rasulids.": "Umar ibn Rasul, ayyubidernas ståthållare, gör sig till sultan av Jemen: rasuliddynastin."
  After the end of the Ayyubids in Egypt the sharifs of Mecca rule the Hejaz on their own, under Rasulid influence.: Sedan ayyubidernas välde i Egypten upphört styr shariferna av Mecka Hijaz på egen hand, under rasulidiskt inflytande.
  The Usfurids, a branch of the Banu Uqayl, replace the Uyunids in eastern Arabia.: Usfuriderna, en gren av Banu Uqayl, ersätter uyuniderna i östra Arabien.
  The Mamluk sultan Baybars, on pilgrimage, makes the Hejaz a Mamluk dependency.: Mamluksultanen Baybars gör under sin vallfärd Hijaz till ett mamlukiskt lydland.
  The Rasulids conquer Dhofar.: Rasuliderna erövrar Dhofar.
  About 1320. Hormuz rules the Omani coast, from Qalhat to Musandam, and Julfar.: Omkring 1320. Hormuz behärskar den omanska kusten från Qalhat till Musandam samt Julfar.
  The Bahrain islands become tributary to the kings of Hormuz.: Bahrainöarna blir skattskyldiga till kungarna av Hormuz.
  About 1395. The Kathiri sultans take power in Hadramawt.: Omkring 1395. Kathirisultanerna tar makten i Hadramawt.
  About 1414. The Kathiri sultan Ali ibn Umar takes Dhofar from its Rasulid rulers; the Kathiri hold it, with interruptions, until the Omani conquest of 1829.: Omkring 1414. Kathirisultanen Ali ibn Umar tar Dhofar från dess rasulidiska härskare; ätten Kathiri behärskar det, med avbrott, fram till den omanska erövringen 1829.
  About 1417. The Jabrids, a Bedouin family of the Banu Uqayl, take over eastern Arabia.: Omkring 1417. Jabriderna, en beduinsläkt ur Banu Uqayl, tar över östra Arabien.
  The Mahri Ba Dujana family take the port of Shihr; their Mahra Sultanate, later centred on Qishn and Socotra, rules the Mahra coast.: Mahrisläkten Ba Dujana intar hamnstaden Shihr; deras sultanat, Mahrasultanatet, senare med centrum i Qishn och på Sokotra, styr Mahrakusten.
  The Tahirids, a local family of Rada’a, replace the Rasulids; the Zaydi imams hold the northern highlands and Sanaa.: Tahiriderna, en lokal släkt från Rada’a, ersätter rasuliderna; de zayditiska imamerna behärskar det norra höglandet och Sanaa.
  About 1485. The Jabrids take Bahrain from the kings of Hormuz.: Omkring 1485. Jabriderna tar Bahrain från kungarna av Hormuz.
  A Mamluk expedition ends the Tahirids in the Tihama; when the Mamluk sultanate falls to the Ottomans the same year, its commanders in Yemen recognise the Ottoman sultan. The sharif of Mecca sends the keys of the holy cities to Selim I.: En mamlukisk expedition gör slut på tahiriderna i Tihama; när det mamlukiska sultanatet faller för osmanerna samma år erkänner dess befälhavare i Jemen den osmanske sultanen. Sharifen av Mecka sänder de heliga städernas nycklar till Selim I.
  The Portuguese and Hormuz take Bahrain from the Jabrids.: Portugiserna och Hormuz tar Bahrain från jabriderna.
  An Ottoman fleet takes Aden from the last Tahirids; Zabid, held by the former Mamluk commanders, comes under direct Ottoman rule in 1539.: En osmansk flotta tar Aden från de sista tahiriderna; Zabid, som behärskas av de forna mamlukiska befälhavarna, kommer under direkt osmanskt styre 1539.
  The Ottomans take Sanaa.: Osmanerna intar Sanaa.
  The Ottomans take al-Hasa (Lahsa eyalet).: Osmanerna tar al-Hasa (ejaletet Lahsa).
  Shah Abbas I takes Bahrain from the Portuguese.: Shah Abbas I tar Bahrain från portugiserna.
  "Nasir ibn Murshid is elected imam: the Ya’ariba dynasty begins to unite Oman. The Portuguese still hold Muscat, Sohar and the coast.": "Nasir ibn Murshid väljs till imam: ya’aribadynastin börjar ena Oman. Portugiserna behärskar fortfarande Muskat, Sohar och kusten."
  The Zaydi imam al-Mu’ayyad Muhammad drives the last Ottoman troops from Yemen; the Qasimid imamate rules all of Yemen.: Den zayditiske imamen al-Mu’ayyad Muhammad driver ut de sista osmanska trupperna ur Jemen; det qasimidiska imamatet styr hela Jemen.
  The Omanis take Sohar from the Portuguese.: Omanierna tar Sohar från portugiserna.
  Imam Sultan ibn Saif takes Muscat; the Portuguese leave Oman.: Imam Sultan ibn Saif intar Muskat; portugiserna lämnar Oman.
  The Qasimid imams of Yemen take Hadramawt (until the early 18th century).: De qasimidiska imamerna i Jemen tar Hadramawt (fram till början av 1700-talet).
  Barrak ibn Ghurayr of the Banu Khalid drives the Ottomans from al-Hasa; the Banu Khalid also rule the coast to the north, where Kuwait is founded.: Barrak ibn Ghurayr av Banu Khalid driver ut osmanerna ur al-Hasa; Banu Khalid styr också kusten i norr, där Kuwait grundas.
  About 1705. The Kathiri sultans regain Hadramawt.: Omkring 1705. Kathirisultanerna återvinner Hadramawt.
  The Omanis take Bahrain from Persia.: Omanierna tar Bahrain från Persien.
  The Abdali sultan of Lahej breaks away from the Zaydi imams and takes Aden (about 1731).: Abdalisultanen av Lahej bryter sig loss från de zayditiska imamerna och tar Aden (omkring 1731).
  Nader takes Bahrain for Persia.: Nader tar Bahrain åt Persien.
  Nader’s army, called in by one side of the Omani civil war, holds Muscat and the coast.: Naders armé, som kallats in av den ena sidan i det omanska inbördeskriget, behärskar Muskat och kusten.
  "Muhammad ibn Saud and the preacher Muhammad ibn Abd al-Wahhab make their pact at Diriyah: the first Saudi state.": "Muhammad ibn Saud och predikanten Muhammad ibn Abd al-Wahhab sluter sin pakt i Diriyah: den första saudiska staten."
  "Ahmad ibn Sa’id, governor of Sohar, drives out the Persians and is elected imam (1749): the Al Bu Sa’id dynasty. The Qawasim rule the coast from Ras al-Khaimah to Sharjah; the Bani Yas tribes the land behind it (not shown as a state).": "Ahmad ibn Sa’id, guvernör i Sohar, driver ut perserna och väljs till imam (1749): dynastin Al Bu Sa’id. Qawasim styr kusten från Ras al-Khaimah till Sharjah, Bani Yas-stammarna inlandet bakom den (visas inte som en stat)."
  The Al Sabah family become rulers of Kuwait.: Familjen Al Sabah blir härskare i Kuwait.
  The Al Khalifa of Zubarah and their allies take Bahrain from Persia.: Al Khalifa från Zubarah och deras bundsförvanter tar Bahrain från Persien.
  About 1786. The first Saudi state rules most of Najd.: Omkring 1786. Den första saudiska staten styr större delen av Najd.
  The Saudis defeat the Banu Khalid and take al-Hasa.: Saudierna besegrar Banu Khalid och tar al-Hasa.
  The Saudis take Mecca (and Medina in 1805); the Asir highlands join them.: Saudierna intar Mecka (och Medina 1805); höglandet i Asir ansluter sig till dem.
  An Egyptian army sent by Muhammad Ali retakes Medina (and Mecca and Taif in January 1813) for the Ottomans.: En egyptisk armé, sänd av Muhammad Ali, återtar Medina (och Mecka och Taif i januari 1813) åt osmanerna.
  Ibrahim Pasha takes Diriyah and ends the first Saudi state. Egyptian troops hold Najd until 1824 (not shown), and the Banu Khalid return to al-Hasa under Egyptian protection.: Ibrahim pasha intar Diriyah och gör slut på den första saudiska staten. Egyptiska trupper behärskar Najd fram till 1824 (visas inte), och Banu Khalid återvänder till al-Hasa under egyptiskt beskydd.
  "The General Maritime Treaty: after a British campaign against the Qawasim, the sheikhs of the coast make treaties with Britain, the Trucial States.": "Det allmänna sjöfördraget: efter ett brittiskt fälttåg mot qawasim sluter shejkerna längs kusten, Fördragsstaterna, fördrag med Storbritannien."
  "Turki ibn Abdullah retakes Riyadh: the second Saudi state, the Emirate of Nejd.": "Turki ibn Abdullah återtar Riyadh: den andra saudiska staten, Emiratet Najd."
  Sa’id ibn Sultan of Muscat takes Dhofar.: Sa’id ibn Sultan av Muskat tar Dhofar.
  The Saudis take al-Hasa again.: Saudierna tar al-Hasa igen.
  "Abdullah ibn Rashid takes power in Ha’il: the Rashidi emirate of Jabal Shammar.": "Abdullah ibn Rashid tar makten i Ha’il: det rashidiska emiratet Jabal Shammar."
  British forces take Aden, which is governed from British India.: Brittiska styrkor intar Aden, som styrs från Brittiska Indien.
  The Ottomans return to the Tihama.: Osmanerna återvänder till Tihama.
  Britain recognises Muhammad ibn Thani as ruler of Qatar.: Storbritannien erkänner Muhammad ibn Thani som härskare över Qatar.
  Midhat Pasha’s expedition takes al-Hasa and Qatar for the Ottomans, during a Saudi civil war; Asir follows.: Midhat pashas expedition tar al-Hasa och Qatar åt osmanerna under ett saudiskt inbördeskrig; Asir följer.
  The Ottomans take Sanaa; the Zaydi imams keep the far north.: Osmanerna intar Sanaa; de zayditiska imamerna behåller den nordligaste delen av landet.
  "About 1886–1888. Britain makes protection treaties with the sultans of the Aden hinterland, Mahra and Hadramawt: the Aden Protectorate.": "Omkring 1886–1888. Storbritannien sluter skyddsfördrag med sultanerna i Adens inland, Mahra och Hadramawt: Adenprotektoratet."
  The Rashidis defeat the Saudis at Mulayda and take Riyadh and Qasim; the Saudi family goes into exile in Kuwait.: Rashidierna besegrar saudierna vid Mulayda och tar Riyadh och Qasim; den saudiska familjen går i landsflykt i Kuwait.
  Abdulaziz ibn Saud retakes Riyadh.: Abdulaziz ibn Saud återtar Riyadh.
  Ibn Saud wins Qasim after the Battle of Rawdat Muhanna.: Ibn Saud vinner Qasim efter slaget vid Rawdat Muhanna.
  Ibn Saud takes al-Hasa from the Ottomans; the Anglo-Ottoman Convention (July 1913) renounces Ottoman claims to Qatar.: Ibn Saud tar al-Hasa från osmanerna; genom den brittisk-osmanska konventionen (juli 1913) avstår osmanerna från sina anspråk på Qatar.
  Sharif Hussein of Mecca begins the Arab Revolt and takes Mecca, Jeddah and Taif; he is recognised as King of the Hejaz.: Sharif Hussein av Mecka inleder det arabiska upproret och intar Mecka, Jidda och Taif; han erkänns som kung av Hijaz.
  Armistice of Mudros. The Ottomans leave Yemen, where Imam Yahya founds the Mutawakkilite Kingdom, and Asir, where the Idrisid emir rules the Tihama and the Al Aid emirs the highlands around Abha (not shown as a state); Arab forces hold Tabuk.: Vapenstilleståndet i Mudros. Osmanerna lämnar Jemen, där imam Yahya grundar det mutawakkilitiska kungariket, och Asir, där den idrisidiske emiren styr Tihama och Al Aid-emirerna höglandet kring Abha (visas inte som en stat); arabiska styrkor behärskar Tabuk.
  The Ottoman garrison of Medina, besieged since 1916, surrenders.: Den osmanska garnisonen i Medina, belägrad sedan 1916, kapitulerar.
  Ibn Saud’s forces defeat Hasan ibn Aid, emir of highland Asir, and take Abha; a settlement in August leaves the Tihama tribes to the Idrisid emir.: Ibn Sauds styrkor besegrar Hasan ibn Aid, emir över höglandet i Asir, och intar Abha; en uppgörelse i augusti lämnar Tihamastammarna åt den idrisidiske emiren.
  Britain leaves Hodeidah, which it has occupied since the war, and hands it to the Idrisid emir of Asir.: Storbritannien lämnar Hodeidah, som det har ockuperat sedan kriget, och överlämnar staden till den idrisidiske emiren av Asir.
  Ibn Saud takes Ha’il and ends the Rashidi emirate.: Ibn Saud intar Ha’il och gör slut på det rashidiska emiratet.
  Imam Yahya’s forces take Hodeidah from the Idrisids.: Imam Yahyas styrkor tar Hodeidah från idrisiderna.
  "Jeddah surrenders to Ibn Saud, after Mecca (October 1924) and Medina (December 1925): the end of the Kingdom of Hejaz.": "Jidda kapitulerar för Ibn Saud, efter Mecka (oktober 1924) och Medina (december 1925): slutet för kungariket Hijaz."
  Ibn Saud takes over the government of the Idrisid emirate of Asir, a Saudi protectorate since 1926; it is formally annexed in 1934.: Ibn Saud tar över styret av det idrisidiska emiratet Asir, ett saudiskt protektorat sedan 1926; det annekteras formellt 1934.
  "Treaty of Taif after the Saudi–Yemeni War: Najran and Jizan stay Saudi.": "Fördraget i Taif efter saudisk-jemenitiska kriget: Najran och Jizan förblir saudiska."
  Britain leaves Aden; the People’s Republic of South Yemen becomes independent.: Storbritannien lämnar Aden; Folkrepubliken Sydjemen blir självständig.
  Six of the Trucial States form the United Arab Emirates; Ras al-Khaimah joins on 10 February 1972.: Sex av Fördragsstaterna bildar Förenade Arabemiraten; Ras al-Khaimah ansluter sig den 10 februari 1972.
  Ras al-Khaimah joins the United Arab Emirates.: Ras al-Khaimah ansluter sig till Förenade Arabemiraten.
  North and South Yemen unite as the Republic of Yemen.: Nord- och Sydjemen förenas till Republiken Jemen.
  About 800. The Abbasid Caliphate holds Sind and Multan, and the Turk Shahis rule Gandhara from Kabul. In the north the Pala Empire of Bengal is overlord of Kannauj, whose king Chakrayudha it has installed; the Gurjara-Pratiharas rule Malwa and Rajasthan, and the Rashtrakutas the Deccan. The Pallavas, Pandyas and Chera Perumals share the south, and the Anuradhapura kingdom rules Sri Lanka. Hill and forest peoples in the north-east, the Kirat hills and western Nepal, the Thar and Kutch are outside any state, and the eastern Punjab and south-eastern Bengal are divided among small kingdoms (not shown as states).: Omkring 800. Abbasidiska kalifatet behärskar Sind och Multan, och turkshahierna styr Gandhara från Kabul. I norr är Palariket i Bengalen överherre över Kannauj, där det har insatt kungen Chakrayudha; gurjara-pratiharas styr Malwa och Rajasthan och rashtrakutas Deckan. Pallavas, pandyas och chera perumals delar på södern, och kungariket Anuradhapura styr Sri Lanka. Berg- och skogsfolk i nordost, Kiratbergen och västra Nepal, Tharöknen och Kutch står utanför alla stater, och östra Punjab och sydöstra Bengalen är uppdelade mellan små kungariken (visas inte som stater).
  About 816. The Pratihara king Nagabhata II takes Kannauj from Chakrayudha and makes it his capital.: Omkring 816. Pratiharakungen Nagabhata II tar Kannauj från Chakrayudha och gör staden till sin huvudstad.
  The Tibetan Empire breaks up after the death of Langdarma. Its outposts in Baltistan, Gilgit and the Bhutanese valleys fall to local rulers (not shown as states).: Tibetanska riket faller sönder efter Langdarmas död. Dess utposter i Baltistan, Gilgit och de bhutanesiska dalarna tillfaller lokala härskare (visas inte som stater).
  "About 848. Vijayalaya Chola takes Thanjavur from the Muttaraiyar chiefs, vassals of the Pallavas: the beginning of the Chola kingdom.": "Omkring 848. Vijayalaya Chola tar Thanjavur från muttaraiyarhövdingarna, som är vasaller under pallavas: början på Cholariket."
  About 850. Mihira Bhoja extends Pratihara rule over the middle Ganges plain to Varanasi and Gorakhpur.: Omkring 850. Mihira Bhoja utsträcker pratiharastyret över mellersta Gangesslätten ända till Varanasi och Gorakhpur.
  About 855. As Abbasid authority fades, the Habbarids rule Sind from Mansura as independent emirs, and the Banu Munabbih rule Multan. Makran and Turan pass to local emirs (not shown as states).: Omkring 855. När den abbasidiska makten bleknar styr habbariderna Sind från Mansura som självständiga emirer, och Banu Munabbih styr Multan. Makran och Turan övergår till lokala emirer (visas inte som stater).
  Ya’qub the Saffarid kills the Zunbil of Zabulistan; the Saffarids take Arachosia, with Pishin and the Quetta valley.: Saffariden Ya’qub dödar zunbilen av Zabulistan; saffariderna tar Arachosien med Pishin och Quettadalen.
  Aditya I Chola defeats the Pallava king Aparajita and annexes Tondaimandalam, the Pallava land around Kanchipuram.: Aditya I Chola besegrar pallavakungen Aparajita och annekterar Tondaimandalam, pallavalandet kring Kanchipuram.
  Ismail the Samanid defeats and captures the Saffarid Amr ibn al-Layth; Arachosia, with Pishin and Quetta, falls to local rulers (not shown as states).: Samaniden Ismail besegrar och tillfångatar saffariden Amr ibn al-Layth; Arachosien med Pishin och Quetta tillfaller lokala härskare (visas inte som stater).
  About 910. Parantaka I Chola defeats the Pandyas and takes Madurai; Kongu follows.: Omkring 910. Parantaka I Chola besegrar pandyas och intar Madurai; Kongu följer därefter.
  "About 930. The Chandra dynasty of Harikela rules eastern Bengal: Samatata, Vanga and Srihatta (Sylhet).": "Omkring 930. Chandradynastin i Harikela styr östra Bengalen: Samatata, Vanga och Srihatta (Sylhet)."
  About 940. The Somavamshi king Yayati I unites Utkala (coastal Odisha) with his kingdom of Kosala; the Bhauma-Kara dynasty has ended.: Omkring 940. Somavamshikungen Yayati I förenar Utkala (kustområdet i Odisha) med sitt kungarike Kosala; Bhauma-Kara-dynastin har upphört.
  Mularaja founds the Chaulukya (Solanki) kingdom at Anahilavada, in northern Gujarat.: Mularaja grundar chaulukyakungariket (solankikungariket) i Anahilavada i norra Gujarat.
  Battle of Takkolam. The Rashtrakuta king Krishna III defeats the Cholas and takes Tondaimandalam.: Slaget vid Takkolam. Rashtrakutakungen Krishna III besegrar cholas och tar Tondaimandalam.
  About 950. Ladakh becomes a kingdom of its own (Maryul) under a dynasty founded by Nyima-Gon. The Chandelas of Jejakabhukti, at Khajuraho and Kalinjar, throw off Pratihara overlordship; the Chahamanas of Naddula hold southern Marwar and the Bhatis the desert around Lodurva. In Saurashtra the Chudasamas rule from Vamanasthali (Junagadh).: Omkring 950. Ladakh blir ett eget kungarike (Maryul) under en dynasti som grundats av Nyima-Gon. Chandelas i Jejakabhukti, i Khajuraho och Kalinjar, skakar av sig pratiharas överhöghet; chahamanas i Naddula behärskar södra Marwar och bhatis öknen kring Lodurva. I Saurashtra styr chudasamas från Vamanasthali (Junagadh).
  About 965. Jayapala, the Hindu Shahi king, rules from Kabul to the Beas.: Omkring 965. Hindushahikungen Jayapala härskar från Kabul till Beas.
  About 970. The Cholas under Sundara Chola retake Tondaimandalam from the Rashtrakutas.: Omkring 970. Cholas under Sundara Chola återtar Tondaimandalam från rashtrakutas.
  About 972. Siyaka, the Paramara king of Malwa and a Rashtrakuta vassal, sacks the Rashtrakuta capital Manyakheta; the Paramaras become independent.: Omkring 972. Siyaka, paramarakung i Malwa och vasall under rashtrakutas, plundrar rashtrakutas huvudstad Manyakheta; paramaras blir självständiga.
  Tailapa II overthrows the last Rashtrakuta king. His Western Chalukya (Kalyani Chalukya) Empire takes over the Deccan; the Paramaras take the land south of the Narmada.: Tailapa II störtar den siste rashtrakutakungen. Hans rike, Västra Chalukyariket (Kalyani-Chalukyariket), tar över Deckan; paramaras tar landet söder om Narmada.
  Sabuktigin succeeds at Ghazni and takes Bost and Kandahar; the Ghaznavids hold Pishin and the Quetta valley.: Sabuktigin blir härskare i Ghazni och intar Bost och Kandahar; ghaznaviderna behärskar Pishin och Quettadalen.
  About 990. The Chaulukyas extend their rule to Lata, southern Gujarat.: Omkring 990. Chaulukyas utsträcker sitt välde till Lata, södra Gujarat.
  Rajaraja I Chola invades Sri Lanka and takes Anuradhapura; the north of the island becomes a Chola province. The Sinhalese king Mahinda V holds out in the south-east (Ruhuna).: Rajaraja I Chola invaderar Sri Lanka och intar Anuradhapura; öns norra del blir en cholaprovins. Den singalesiske kungen Mahinda V håller ut i sydost (Ruhuna).
  About 1000. The Kalachuris of Ratanpur, a branch of the Kalachuris of Tripuri, rule Dakshina Kosala (Chhattisgarh).: Omkring 1000. Kalachuris i Ratanpur, en gren av kalachuris i Tripuri, styr Dakshina Kosala (Chhattisgarh).
  Mahmud of Ghazni defeats the Hindu Shahi king Jayapala near Peshawar and takes Gandhara.: Mahmud av Ghazni besegrar hindushahikungen Jayapala nära Peshawar och tar Gandhara.
  Rajaraja I Chola takes Talakad and the Ganga country (Gangavadi), southern Karnataka.: Rajaraja I Chola intar Talakad och gangalandet (Gangavadi) i södra Karnataka.
  Mahmud of Ghazni annexes Multan from its Ismaili ruler Abu’l-Fath Daud.: Mahmud av Ghazni annekterar Multan från dess ismailitiske härskare Abu’l-Fath Daud.
  Rajendra I Chola completes the conquest of Sri Lanka and carries off King Mahinda V.: Rajendra I Chola fullbordar erövringen av Sri Lanka och för bort kung Mahinda V.
  About 1021. With the death of Trilochanapala the Hindu Shahi kingdom ends; Mahmud of Ghazni annexes the Punjab, with Lahore.: Omkring 1021. Med Trilochanapalas död upphör hindushahiriket; Mahmud av Ghazni annekterar Punjab med Lahore.
  Returning from Somnath, Mahmud of Ghazni deposes the Habbarid emir of Mansura. In Sind the Soomras take power, at first under Ghaznavid overlordship.: På hemvägen från Somnath avsätter Mahmud av Ghazni den habbaridiske emiren i Mansura. I Sind tar soomras makten, till en början under ghaznavidisk överhöghet.
  About 1029. Sinhalese princes regain Ruhuna, the south and east of Sri Lanka, from the Cholas.: Omkring 1029. Singalesiska furstar återtar Ruhuna, Sri Lankas södra och östra del, från cholas.
  About 1036. The Pratihara kingdom of Kannauj comes to an end. The Kalachuri king Gangeyadeva holds Varanasi and Prayaga; the rest of the Ganges plain is divided among minor rulers (not shown as states).: Omkring 1036. Pratiharas kungarike i Kannauj går under. Kalachurikungen Gangeyadeva behärskar Varanasi och Prayaga; resten av Gangesslätten är uppdelad mellan mindre härskare (visas inte som stater).
  About 1070. The Sena dynasty rises in Radha, western Bengal, under Samantasena and Vijayasena. Kulottunga I unites the Eastern Chalukya kingdom of Vengi with the Chola Empire.: Omkring 1070. Senadynastin växer fram i Radha, västra Bengalen, under Samantasena och Vijayasena. Kulottunga I förenar östra chalukyas kungarike Vengi med Cholariket.
  Vijayabahu I takes Polonnaruwa and drives the Cholas out of Sri Lanka.: Vijayabahu I intar Polonnaruwa och driver ut cholas från Sri Lanka.
  About 1080. The Varman dynasty succeeds the Chandras in Vanga, eastern Bengal.: Omkring 1080. Varmandynastin efterträder chandras i Vanga, östra Bengalen.
  About 1090. Chandradeva founds the Gahadavala kingdom at Kannauj and Varanasi.: Omkring 1090. Chandradeva grundar gahadavalas kungarike i Kannauj och Varanasi.
  Nanyadeva founds the Karnat dynasty of Mithila at Simraungadh, in the Terai.: Nanyadeva grundar Karnatdynastin i Mithila, med säte i Simraungadh i Terai.
  "About 1100. The Katyuri kingdom breaks up: Kumaon passes to the Chand rajas, and Garhwal is divided among many chiefs (not shown as states). The Pala dynasty of Kamarupa ends; Upper Assam falls to the Chutia and Kachari chiefs, and Srihatta (Sylhet) to the kingdom of Gour (not shown as states). The Khasa Malla kings rule western Nepal from Sinja.": "Omkring 1100. Katyuririket faller sönder: Kumaon övergår till chanddynastins rajor, och Garhwal delas upp mellan många hövdingar (visas inte som stater). Paladynastin i Kamarupa upphör; Övre Assam tillfaller chutia- och kacharihövdingarna och Srihatta (Sylhet) kungariket Gour (visas inte som stater). Khasa-mallakungarna styr västra Nepal från Sinja."
  About 1112. The Eastern Ganga king Anantavarman Chodaganga conquers Utkala; his dynasty rules Odisha.: Omkring 1112. Anantavarman Chodaganga av Östra Gangadynastin erövrar Utkala; hans dynasti styr Odisha.
  The Hoysala king Vishnuvardhana takes Talakad from the Cholas and rules southern Karnataka, at first as a vassal of the Western Chalukyas.: Hoysalakungen Vishnuvardhana tar Talakad från cholas och styr södra Karnataka, till en början som vasall under västra chalukyas.
  About 1124. The Chera Perumal kingdom of Mahodayapuram breaks up. Venad in the south, Cochin (Perumpadappu) and the Zamorins of Calicut in the north become separate kingdoms.: Omkring 1124. Chera perumals kungarike i Mahodayapuram faller sönder. Venad i söder samt Cochin (Perumpadappu) och zamorinernas Calicut i norr blir separata kungariken.
  About 1136. The Chaulukya king Jayasimha Siddharaja takes Dhara; Malwa is ruled from Gujarat for about half a century.: Omkring 1136. Chaulukyakungen Jayasimha Siddharaja intar Dhara; Malwa styrs från Gujarat i ungefär ett halvt sekel.
  About 1150. The Chahamana king Vigraharaja IV takes Delhi from the Tomaras. In Bengal the Senas under Vijayasena take Varendra from the Palas and Vanga from the Varmans.: Omkring 1150. Chahamanakungen Vigraharaja IV tar Delhi från tomaras. I Bengalen tar senas under Vijayasena Varendra från palas och Vanga från varmans.
  About 1162. The Pala dynasty ends; the Gahadavalas take the west of Bihar.: Omkring 1162. Paladynastin upphör; gahadavalas tar västra Bihar.
  The Kakatiya ruler Rudradeva declares independence from the Western Chalukyas at Hanamakonda; Warangal becomes his dynasty’s capital.: Kakatiyahärskaren Rudradeva förklarar sig oberoende av västra chalukyas i Hanamakonda; Warangal blir hans dynastis huvudstad.
  Ghiyath al-Din of Ghor takes Ghazni; the Ghurids take Arachosia with Pishin and Quetta.: Ghiyath al-Din av Ghor intar Ghazni; ghuriderna tar Arachosien med Pishin och Quetta.
  Muhammad of Ghor takes Multan and Uch, which had slipped from Ghaznavid control.: Muhammad av Ghor intar Multan och Uch, som hade glidit ghaznaviderna ur händerna.
  Muhammad of Ghor takes Peshawar from the Ghaznavids.: Muhammad av Ghor tar Peshawar från ghaznaviderna.
  About 1180. Vindhyavarman restores Paramara rule in Malwa.: Omkring 1180. Vindhyavarman återupprättar paramarastyret i Malwa.
  Muhammad of Ghor takes Lahore and deposes Khusrau Malik, the last Ghaznavid.: Muhammad av Ghor intar Lahore och avsätter Khusrau Malik, den siste ghaznaviden.
  The Western Chalukya Empire ends. The Seuna (Yadava) king Bhillama V takes the north of the Deccan; the Hoysalas the south.: Västra Chalukyariket går under. Seuna- (yadava-)kungen Bhillama V tar norra Deckan och hoysalas den södra delen.
  About 1190. The Pandyas regain their independence from the declining Cholas at Madurai.: Omkring 1190. I Madurai återvinner pandyas sitt oberoende från de allt svagare cholas.
  Second Battle of Tarain. Muhammad of Ghor defeats Prithviraj Chauhan, who is executed, and takes the Chahamana lands.: Andra slaget vid Tarain. Muhammad av Ghor besegrar Prithviraj Chauhan, som avrättas, och tar chahamanas länder.
  Qutb al-Din Aibak takes Delhi from its Tomara rulers, vassals of the Chahamanas.: Qutb al-Din Aibak tar Delhi från dess tomarahärskare, som är vasaller under chahamanas.
  Battle of Chandawar. Muhammad of Ghor defeats the Gahadavala king Jayachandra; Varanasi and the middle Ganges fall to the Ghurids.: Slaget vid Chandawar. Muhammad av Ghor besegrar gahadavalakungen Jayachandra; Varanasi och mellersta Gangesdalen faller i ghuridernas händer.
  The Ghurids put down Hariraja’s revolt and annex Ajmer.: Ghuriderna slår ned Harirajas uppror och annekterar Ajmer.
  The Ghurids take Gwalior from the Parihar chiefs.: Ghuriderna tar Gwalior från pariharhövdingarna.
  Qutb al-Din Aibak takes Badaun (Rohilkhand) for the Ghurids.: Qutb al-Din Aibak intar Badaun (Rohilkhand) åt ghuriderna.
  About 1200. Bakhtiyar Khalji, a Ghurid commander, takes Bihar.: Omkring 1200. Bakhtiyar Khalji, en ghuridisk befälhavare, intar Bihar.
  Bakhtiyar Khalji takes Nadia from Lakshmana Sena and founds Lakhnauti in Gauda. The Senas keep eastern Bengal.: Bakhtiyar Khalji tar Nadia från Lakshmana Sena och grundar Lakhnauti i Gauda. Senas behåller östra Bengalen.
  "Qutb al-Din Aibak takes power in Lahore after the murder of Muhammad of Ghor: the beginning of the Delhi Sultanate. Nasir al-Din Qabacha, ruling Multan and Uch, and the Khalji lords of Lakhnauti owe him only nominal allegiance.": "Qutb al-Din Aibak tar makten i Lahore efter mordet på Muhammad av Ghor: början på Delhisultanatet. Nasir al-Din Qabacha, som styr Multan och Uch, och khaljiherrarna i Lakhnauti erkänner honom bara till namnet."
  About 1210. The Kakatiya king Ganapati conquers coastal Andhra from the Velanati Chodas.: Omkring 1210. Kakatiyakungen Ganapati erövrar kustområdet i Andhra från velanati-chodas.
  The Khwarazmshah Muhammad takes Ghazni; his empire reaches Peshawar and Quetta.: Khwarazmshahen Muhammad intar Ghazni; hans rike når Peshawar och Quetta.
  Kalinga Magha invades Sri Lanka and takes Polonnaruwa. The Sinhalese kings withdraw to Dambadeniya in the south-west; Magha rules the north from Polonnaruwa.: Kalinga Magha invaderar Sri Lanka och intar Polonnaruwa. De singalesiska kungarna drar sig tillbaka till Dambadeniya i sydväst; Magha styr norra delen från Polonnaruwa.
  After the Mongol conquest of Khwarazm, Mongol commanders hold Peshawar and Pishin.: Efter den mongoliska erövringen av Khwarazm behärskar mongoliska befälhavare Peshawar och Pishin.
  Iltutmish defeats Nasir al-Din Qabacha, who drowns in the Indus, and ends his rule at Multan and Uch. In the Brahmaputra valley the Tai prince Sukaphaa founds the Ahom kingdom.: Iltutmish besegrar Nasir al-Din Qabacha, som drunknar i Indus, och gör slut på hans styre i Multan och Uch. I Brahmaputradalen grundar taifursten Sukaphaa Ahomriket.
  About 1230. The last Sena kings lose eastern Bengal to the Deva dynasty (not shown as a state). The Baghels settle at Bandhavgarh, the core of the later kingdom of Rewa. After the end of the Kalachuris of Tripuri, Gond chiefs rule the upper Narmada.: Omkring 1230. De sista senakungarna förlorar östra Bengalen till Devadynastin (visas inte som en stat). Baghelerna slår sig ned i Bandhavgarh, kärnan i det senare kungariket Rewa. Sedan kalachuris i Tripuri har försvunnit styr gondhövdingar övre Narmada.
  About 1255. Parakramabahu II of Dambadeniya drives Magha out of Polonnaruwa. Jaffna, the Vanni and the east stay outside Sinhalese rule.: Omkring 1255. Parakramabahu II av Dambadeniya driver ut Magha ur Polonnaruwa. Jaffna, Vanni och östra delen av ön förblir utanför singalesiskt styre.
  "About 1257. The king of Kamarupa, Sandhya, moves his capital to Kamatapur: the Kamata kingdom.": "Omkring 1257. Kungen av Kamarupa, Sandhya, flyttar sin huvudstad till Kamatapur: Kamatariket."
  About 1258. Jatavarman Sundara Pandya I takes the Chola heartland and Kanchipuram; the Pandyas dominate the Tamil country. The last Chola king, Rajendra III, dies about 1279.: Omkring 1258. Jatavarman Sundara Pandya I tar cholas kärnland och Kanchipuram; pandyas dominerar tamilområdet. Den siste cholakungen, Rajendra III, dör omkring 1279.
  About 1260. The Chagatai Khanate holds the country west of the Indus, with Peshawar and Pishin.: Omkring 1260. Tjagataikhanatet behärskar landet väster om Indus, med Peshawar och Pishin.
  After the death of Sultan Balban, his son Bughra Khan, governor of Lakhnauti, rules Bengal as an independent sultan; his successors keep it independent until 1324.: Efter sultan Balbans död styr hans son Bughra Khan, guvernör i Lakhnauti, Bengalen som självständig sultan; hans efterträdare bevarar dess självständighet fram till 1324.
  Alauddin Khalji’s generals conquer Gujarat; the Vaghela king Karna flees.: Alauddin Khaljis generaler erövrar Gujarat; vaghelakungen Karna flyr.
  About 1303. Shamsuddin Firuz Shah of Lakhnauti, who also rules Sonargaon, conquers Srihatta (Sylhet), with the Sufi Shah Jalal.: Omkring 1303. Shamsuddin Firuz Shah av Lakhnauti, som också styr Sonargaon, erövrar Srihatta (Sylhet) tillsammans med sufin Shah Jalal.
  Alauddin Khalji takes Chittorgarh after an eight-month siege; the Guhila ruler Ratnasimha is killed.: Alauddin Khalji intar Chittorgarh efter åtta månaders belägring; guhilahärskaren Ratnasimha dödas.
  Ain al-Mulk Multani conquers Malwa for Alauddin Khalji; the Paramara dynasty ends.: Ain al-Mulk Multani erövrar Malwa åt Alauddin Khalji; Paramaradynastin upphör.
  Alauddin Khalji takes Jalore from Kanhadadeva Songara. Malik Kafur’s army sacks Dwarasamudra and Madurai.: Alauddin Khalji tar Jalore från Kanhadadeva Songara. Malik Kafurs armé plundrar Dwarasamudra och Madurai.
  About 1315. The last Chandela strongholds pass to the Delhi Sultanate.: Omkring 1315. Chandelas sista fästen övergår till Delhisultanatet.
  Qutb al-Din Mubarak Shah defeats the last Yadava, Harapaladeva; the Yadava kingdom is annexed.: Qutb al-Din Mubarak Shah besegrar den siste yadavakungen, Harapaladeva; yadavariket annekteras.
  Ulugh Khan (the future Muhammad bin Tughluq) takes Warangal and captures the Kakatiya king Prataparudra; the Kakatiya lands and the Pandya kingdom of Madurai are annexed.: Ulugh Khan (den blivande Muhammad bin Tughluq) intar Warangal och tillfångatar kakatiyakungen Prataparudra; kakatiyas länder och pandyas kungarike Madurai annekteras.
  Ghiyath al-Din Tughluq intervenes in a succession war in Bengal and makes it a province of the Delhi Sultanate, governed from Lakhnauti, Satgaon and Sonargaon.: Ghiyath al-Din Tughluq ingriper i ett tronföljdskrig i Bengalen och gör landet till en provins i Delhisultanatet, styrd från Lakhnauti, Satgaon och Sonargaon.
  Ghiyath al-Din Tughluq destroys Simraungadh; the Karnat kingdom of Mithila ends. The Terai passes to local chiefs.: Ghiyath al-Din Tughluq förstör Simraungadh; karnatkungariket i Mithila upphör. Terai övergår till lokala hövdingar.
  About 1325. Prolaya Vema Reddi founds the Reddi kingdom in coastal Andhra.: Omkring 1325. Prolaya Vema Reddi grundar Reddiriket i kustområdet i Andhra.
  "About 1326. Hammir Singh, of the Sisodia branch of the Guhilas, retakes Chittorgarh: Mewar is independent again.": "Omkring 1326. Hammir Singh, av guhilaättens sisodiagren, återtar Chittorgarh: Mewar är åter självständigt."
  "Jalal al-Din Ahsan Khan, governor of Ma’bar, declares independence at Madurai: the Madurai Sultanate.": "Jalal al-Din Ahsan Khan, guvernör i Ma’bar, förklarar sig självständig i Madurai: Maduraisultanatet."
  The Musunuri Nayakas drive the Tughluq governors out of Warangal. In the south Harihara and Bukka found the Vijayanagara Empire on the Tungabhadra.: Musunuri-nayakas driver ut tughluqdynastins guvernörer ur Warangal. I söder grundar Harihara och Bukka Vijayanagarariket vid Tungabhadra.
  Fakhruddin Mubarak Shah declares himself sultan at Sonargaon, in eastern Bengal, and takes Chittagong about 1340.: Fakhruddin Mubarak Shah utropar sig till sultan i Sonargaon, i östra Bengalen, och intar Chittagong omkring 1340.
  "Shah Mir takes the throne of Kashmir: the Kashmir Sultanate.": "Shah Mir bestiger Kashmirs tron: Kashmirsultanatet."
  Shamsuddin Ilyas Shah takes Satgaon and Lakhnauti; he unites Bengal in 1352.: Shamsuddin Ilyas Shah intar Satgaon och Lakhnauti; han enar Bengalen 1352.
  "About 1342. The Hada Chauhans take Bundi: the beginning of Hadoti.": "Omkring 1342. Hada-chauhanerna intar Bundi: början på Hadoti."
  The last Hoysala king, Veera Ballala III, is killed fighting the Madurai Sultanate; Vijayanagara takes the Hoysala lands.: Den siste hoysalakungen, Veera Ballala III, stupar i strid mot Maduraisultanatet; Vijayanagara tar hoysalas länder.
  "Rebel amirs of the Deccan proclaim Hasan Gangu sultan at Daulatabad: the Bahmani Sultanate, with its capital at Gulbarga.": "Upproriska emirer i Deckan utropar Hasan Gangu till sultan i Daulatabad: Bahmanisultanatet, med huvudstad i Gulbarga."
  About 1350. Gond kingdoms rule the hills of eastern Vidarbha around Chanda and Deogarh.: Omkring 1350. Gondriken styr bergen i östra Vidarbha kring Chanda och Deogarh.
  About 1351. The Samma dynasty replaces the Soomras in Sind, with its capital at Thatta.: Omkring 1351. Sammadynastin ersätter soomras i Sind, med huvudstad i Thatta.
  About 1358. Ajay Pal unites the chiefdoms of Garhwal into one kingdom.: Omkring 1358. Ajay Pal förenar Garhwals hövdingadömen till ett kungarike.
  The Recherla Velamas, allies of the Bahmanis, kill the Musunuri ruler Kapaya Nayaka; Telangana falls under Bahmani sway (the Velama kingdom of Rachakonda is not shown as a state).: Recherla-velamas, Bahmanisultanatets bundsförvanter, dödar musunurihärskaren Kapaya Nayaka; Telangana hamnar under Bahmanisultanatets välde (velamakungariket Rachakonda visas inte som en stat).
  About 1370. Vijayanagara takes Goa from the Bahmanis. Kumara Kampana of Vijayanagara conquers the Sambuvarayas of the northern Tamil country and, by 1378, ends the Madurai Sultanate.: Omkring 1370. Vijayanagara tar Goa från Bahmanisultanatet. Kumara Kampana av Vijayanagara erövrar sambuvarayas rike i det norra tamilområdet och har 1378 gjort slut på Maduraisultanatet.
  Timur defeats his rival Amir Husayn at Balkh and becomes master of the Chagatai lands, with Kabul and the Peshawar valley.: Timur besegrar sin rival Amir Husayn vid Balkh och blir herre över tjagatailänderna, med Kabul och Peshawardalen.
  Malik Raja Faruqi founds the Khandesh Sultanate.: Malik Raja Faruqi grundar Khandeshsultanatet.
  Timur takes Kandahar, with Pishin and Quetta.: Timur intar Kandahar med Pishin och Quetta.
  About 1390. The Khasa Malla kingdom of western Nepal breaks up into the Baise (twenty-two) principalities.: Omkring 1390. Khasa-mallakungariket i västra Nepal splittras i Baise-furstendömena (”de tjugotvå”).
  "Malik Sarwar, a Tughluq eunuch, declares himself independent at Jaunpur: the Jaunpur Sultanate.": "Malik Sarwar, en eunuck vid tughluqhovet, förklarar sig självständig i Jaunpur: Jaunpursultanatet."
  "Bir Singh Deo Tomar takes Gwalior: the Tomaras of Gwalior.": "Bir Singh Deo Tomar intar Gwalior: Tomaras i Gwalior."
  "About 1395. Rao Chunda takes Mandore: the Rathores rule Marwar.": "Omkring 1395. Rao Chunda intar Mandore: rathorerna styr Marwar."
  Timur sacks Delhi, and the weakened sultanate loses its outlying provinces. In eastern Rajasthan the Kachwahas of Amber, rulers there since the 11th century, are shown as their own state; Ajmer is fought over by Mewar, Marwar and Malwa.: Timur plundrar Delhi, och det försvagade sultanatet förlorar sina avlägsna provinser. I östra Rajasthan visas kachwahas i Amber, som härskat där sedan 1000-talet, som en egen stat; Mewar, Marwar och Malwa strider om Ajmer.
  About 1400. The Manikya dynasty rules Tripura. The Chaubisi (twenty-four) principalities share the hills of central Nepal.: Omkring 1400. Manikyadynastin styr Tripura. Chaubisi-furstendömena (”de tjugofyra”) delar på bergen i centrala Nepal.
  "Dilawar Khan Ghuri, governor of Malwa, makes himself independent: the Malwa Sultanate.": "Dilawar Khan Ghuri, guvernör i Malwa, gör sig självständig: Malwasultanatet."
  "Zafar Khan, governor of Gujarat, proclaims himself Sultan Muzaffar Shah at Birpur: the Gujarat Sultanate, with its seat at Patan.": "Zafar Khan, guvernör i Gujarat, utropar sig till sultan Muzaffar Shah i Birpur: Gujaratsultanatet, med säte i Patan."
  Kapilendra Deva deposes the last Eastern Ganga king and founds the Gajapati dynasty in Odisha.: Kapilendra Deva avsätter den siste kungen av Östra Gangadynastin och grundar Gajapatidynastin i Odisha.
  "About 1445. The Langah tribe takes power in Multan: the Langah Sultanate.": "Omkring 1445. Langahstammen tar makten i Multan: Langahsultanatet."
  About 1450. Prince Sapumal of Kotte conquers the Jaffna Kingdom for Parakramabahu VI.: Omkring 1450. Prins Sapumal av Kotte erövrar kungariket Jaffna åt Parakramabahu VI.
  About 1454. The Gajapati Kapilendra Deva conquers the Reddi kingdoms of Rajahmundry and Kondavidu.: Omkring 1454. Gajapatikungen Kapilendra Deva erövrar reddikungarikena Rajahmundry och Kondavidu.
  About 1459. The Arakanese kingdom of Mrauk U takes Chittagong from Bengal.: Omkring 1459. Det arakanesiska kungariket Mrauk U tar Chittagong från Bengalen.
  About 1467. Jaffna regains its independence under Kanakasooriya Cinkaiariyan.: Omkring 1467. Jaffna återvinner sitt oberoende under Kanakasooriya Cinkaiariyan.
  The Bahmanis take Goa from Vijayanagara. In Sri Lanka Senasammata Vikramabahu makes Kandy, in the hills, a kingdom of its own.: Bahmanisultanatet tar Goa från Vijayanagara. På Sri Lanka gör Senasammata Vikramabahu Kandy, i bergen, till ett eget kungarike.
  Mahmud Begada of Gujarat takes Junagadh and ends the Chudasama kingdom of Saurashtra.: Mahmud Begada av Gujarat intar Junagadh och gör slut på chudasamas kungarike i Saurashtra.
  Bahlul Lodi of Delhi defeats Hussain Shah Sharqi and annexes the Jaunpur Sultanate.: Bahlul Lodi av Delhi besegrar Hussain Shah Sharqi och annekterar Jaunpursultanatet.
  Dhu’l-Nun Arghun, a Timurid governor, takes Pishin, Shal (Quetta) and Mastung; the Arghuns rule Kandahar on their own account.: Dhu’l-Nun Arghun, en timuridisk guvernör, tar Pishin, Shal (Quetta) och Mastung; arghunerna styr Kandahar för egen räkning.
  Rao Bika, a son of Rao Jodha of Marwar, founds Bikaner.: Rao Bika, en son till Rao Jodha av Marwar, grundar Bikaner.
  "The Bahmani Sultanate breaks up: Ahmad Nizam Shah founds the Ahmadnagar Sultanate, Yusuf Adil Shah the Bijapur Sultanate and Fathullah Imad-ul-Mulk the Berar Sultanate; the Barid Shahis hold the rump at Bidar.": "Bahmanisultanatet faller sönder: Ahmad Nizam Shah grundar Ahmadnagarsultanatet, Yusuf Adil Shah Bijapursultanatet och Fathullah Imad-ul-Mulk Berarsultanatet; baridshahierna behåller resten i Bidar."
  About 1490. Tripura under Dhanya Manikya extends its rule over the plains of Comilla.: Omkring 1490. Tripura under Dhanya Manikya utsträcker sitt välde över slätterna kring Comilla.
  About 1495. Sikandar Lodi drives Husain Shah Sharqi, the last sultan of Jaunpur, out of Bihar and annexes it; the land east of Barh stays with Bengal.: Omkring 1495. Sikandar Lodi driver Husain Shah Sharqi, den siste sultanen av Jaunpur, ut ur Bihar och annekterar det; landet öster om Barh förblir hos Bengalen.
  Alauddin Hussain Shah of Bengal conquers the Kamata kingdom.: Alauddin Hussain Shah av Bengalen erövrar Kamatariket.
  "Rudra Pratap Singh founds Orchha: the Bundela Rajputs rule Bundelkhand.": "Rudra Pratap Singh grundar Orchha: bundela-rajputerna styr Bundelkhand."
  Afonso de Albuquerque takes Goa from Bijapur, after a first capture and loss earlier in the year.: Afonso de Albuquerque tar Goa från Bijapur, sedan han tidigare samma år först erövrat och sedan förlorat staden.
  Krishnadevaraya of Vijayanagara takes Udayagiri, Kondavidu and the coast south of the Krishna from the Gajapatis. In the west of the Brahmaputra valley Vishwa Singha founds the Koch kingdom.: Krishnadevaraya av Vijayanagara tar Udayagiri, Kondavidu och kusten söder om Krishna från Gajapatiriket. I västra delen av Brahmaputradalen grundar Vishwa Singha Kochriket.
  About 1516. Alauddin Hussain Shah of Bengal takes Chittagong back from Arakan.: Omkring 1516. Alauddin Hussain Shah av Bengalen tar tillbaka Chittagong från Arakan.
  About 1518. Ibrahim Lodi forces Vikramaditya Tomar to surrender Gwalior.: Omkring 1518. Ibrahim Lodi tvingar Vikramaditya Tomar att överlämna Gwalior.
  Quli Qutb-ul-Mulk, Bahmani governor of Telangana, makes himself independent at Golconda.: Quli Qutb-ul-Mulk, Bahmanisultanatets guvernör i Telangana, gör sig självständig i Golconda.
  Babur, ruler of Kabul, takes Bajaur and the Peshawar valley.: Babur, härskare i Kabul, intar Bajaur och Peshawardalen.
  Shah Beg Arghun takes Thatta and ends the Samma dynasty. In the Deccan, Krishnadevaraya of Vijayanagara defeats Bijapur at Raichur and takes the fortress.: Shah Beg Arghun intar Thatta och gör slut på Sammadynastin. I Deckan besegrar Krishnadevaraya av Vijayanagara Bijapur vid Raichur och intar fästningen.
  "The Vijayabahu Kollaya: Vijayabahu VI of Kotte is killed and his sons divide the kingdom. Mayadunne rules Sitawaka, in the interior.": "Vijayabahu Kollaya: Vijayabahu VI av Kotte dödas och hans söner delar riket. Mayadunne styr Sitawaka, i inlandet."
  Babur takes Kandahar; the Mughals also take Pishin and the Quetta valley.: Babur intar Kandahar; mogulerna tar också Pishin och Quettadalen.
  "First Battle of Panipat. Babur defeats and kills Ibrahim Lodi and takes Delhi and Agra: the Mughal Empire.": "Första slaget vid Panipat. Babur besegrar och dödar Ibrahim Lodi och intar Delhi och Agra: Mogulriket."
  The last Bahmani sultan flees; the Barid Shahis rule Bidar as a sultanate of their own.: Den siste bahmanisultanen flyr; baridshahierna styr Bidar som ett eget sultanat.
  Shah Husain Arghun takes Multan and ends the Langah Sultanate.: Shah Husain Arghun intar Multan och gör slut på Langahsultanatet.
  The Mughals take Awadh, Gwalior, Chanderi and the Ganges plain to Bihar.: Mogulerna tar Awadh, Gwalior, Chanderi och Gangesslätten fram till Bihar.
  Battle of the Ghaghra. Babur defeats the Afghans of Bihar and Bengal; Bihar submits.: Slaget vid Ghaghra. Babur besegrar afghanerna i Bihar och Bengalen; Bihar underkastar sig.
  Vishwanatha Nayaka, governor of Madurai for Vijayanagara, founds the Madurai Nayaka dynasty.: Vishwanatha Nayaka, Vijayanagaras guvernör i Madurai, grundar nayakadynastin i Madurai.
  Bahadur Shah of Gujarat conquers the Malwa Sultanate.: Bahadur Shah av Gujarat erövrar Malwasultanatet.
  About 1532. The Vijayanagara governors at Thanjavur become hereditary Nayakas.: Omkring 1532. Vijayanagaras guvernörer i Thanjavur blir ärftliga nayakas.
  In the 1530s, as the Bengal Sultanate weakens, Arakan retakes Chittagong.: På 1530-talet, när Bengalsultanatet försvagas, återtar Arakan Chittagong.
  Sher Khan Sur takes Gaur, the capital of Bengal.: Sher Khan Sur intar Gaur, Bengalens huvudstad.
  Battle of Kannauj. Sher Shah Suri defeats Humayun; the Mughals lose Hindustan to the Sur Empire.: Slaget vid Kannauj. Sher Shah Suri besegrar Humayun; mogulerna förlorar Hindustan till Surriket.
  Sher Shah Suri conquers Malwa.: Sher Shah Suri erövrar Malwa.
  Battle of Sammel. Sher Shah Suri defeats Maldeo Rathore and occupies Marwar.: Slaget vid Sammel. Sher Shah Suri besegrar Maldeo Rathore och ockuperar Marwar.
  Sher Shah dies at the siege of Kalinjar; Maldeo Rathore retakes Jodhpur.: Sher Shah dör under belägringen av Kalinjar; Maldeo Rathore återtar Jodhpur.
  About 1548. Khengarji I unites Kutch under the Jadejas, with his capital at Bhuj.: Omkring 1548. Khengarji I förenar Kutch under jadejas, med huvudstad i Bhuj.
  Tarkhan rulers succeed the Arghuns in Sind. In Bengal the governor Muhammad Khan Sur declares himself independent.: Tarkhanhärskare efterträder arghunerna i Sind. I Bengalen förklarar sig guvernören Muhammad Khan Sur självständig.
  Baz Bahadur makes himself sultan of Malwa.: Baz Bahadur gör sig till sultan av Malwa.
  Humayun retakes Delhi.: Humayun återtar Delhi.
  Second Battle of Panipat. Akbar’s army defeats Hemu; the Mughals take the rest of the Sur lands in Hindustan.: Andra slaget vid Panipat. Akbars armé besegrar Hemu; mogulerna tar resten av Surrikets länder i Hindustan.
  Andiri Andiri, a Portuguese captain, takes Malé; the Maldives are under Portuguese rule until 1573.: Andiri Andiri, en portugisisk kapten, intar Malé; Maldiverna står under portugisiskt styre fram till 1573.
  "About 1559. Drabya Shah takes Gorkha: the Gorkha kingdom, the future Nepal.": "Omkring 1559. Drabya Shah intar Gorkha: kungariket Gorkha, det framtida Nepal."
  The Portuguese take Daman.: Portugiserna intar Daman.
  Adham Khan defeats Baz Bahadur; the Mughals annex Malwa.: Adham Khan besegrar Baz Bahadur; mogulerna annekterar Malwa.
  Battle of Talikota. The Deccan sultanates defeat Vijayanagara and sack its capital. Bijapur takes the land south of the Tungabhadra; the Aravidu kings rule the rest of the empire from Penukonda. The Keladi Nayakas become independent in Kanara. In Marwar Akbar’s forces take Jodhpur.: Slaget vid Talikota. Deckansultanaten besegrar Vijayanagara och plundrar dess huvudstad. Bijapur tar landet söder om Tungabhadra; aravidukungarna styr resten av riket från Penukonda. Nayakas i Keladi blir självständiga i Kanara. I Marwar intar Akbars styrkor Jodhpur.
  Mukunda Deva, the last independent king of Odisha, is killed; the Karrani sultans of Bengal take Odisha.: Mukunda Deva, Odishas siste självständige kung, dödas; karranisultanerna i Bengalen tar Odisha.
  The Maldivians under Muhammad Thakurufaanu drive out the Portuguese.: Maldiverna under Muhammad Thakurufaanu driver ut portugiserna.
  Akbar wins the Battle of Ahmedabad; the Gujarat Sultanate is annexed.: Akbar vinner slaget vid Ahmedabad; Gujaratsultanatet annekteras.
  Ahmadnagar annexes the Berar Sultanate.: Ahmadnagar annekterar Berarsultanatet.
  Battle of Rajmahal. The Mughals defeat and kill Daud Khan Karrani and annex Bengal and Bihar; the Baro-Bhuyan chiefs of eastern Bengal resist until 1611.: Slaget vid Rajmahal. Mogulerna besegrar och dödar Daud Khan Karrani och annekterar Bengalen och Bihar; baro-bhuyanhövdingarna i östra Bengalen gör motstånd fram till 1611.
  About 1579. Golconda conquers coastal Andhra up to the Godavari.: Omkring 1579. Golconda erövrar kustområdet i Andhra upp till Godavari.
  Rajasinha I of Sitawaka conquers Kandy. Of Kotte only Colombo and its coast remain, held by the Portuguese for King Dharmapala.: Rajasinha I av Sitawaka erövrar Kandy. Av Kotte återstår bara Colombo och dess kust, som portugiserna håller för kung Dharmapalas räkning.
  Akbar installs Udai Singh as Rao of Marwar, a Mughal vassal.: Akbar insätter Udai Singh som rao av Marwar och mogulernas vasall.
  About 1585. The Nagvanshi raja of Chota Nagpur submits to the Mughals.: Omkring 1585. Nagvanshirajan av Chota Nagpur underkastar sig mogulerna.
  The Mughals annex the Kashmir Sultanate.: Mogulerna annekterar Kashmirsultanatet.
  About 1590. Konappu Bandara, crowned as Vimaladharmasuriya I, retakes Kandy from Sitawaka.: Omkring 1590. Konappu Bandara, krönt som Vimaladharmasuriya I, återtar Kandy från Sitawaka.
  Man Singh conquers Odisha for the Mughals.: Man Singh erövrar Odisha åt mogulerna.
  The Tarkhan ruler of Thatta submits; the Mughals annex Sind. Rajasinha I of Sitawaka dies and his kingdom falls apart; the Portuguese take the lowlands.: Tarkhanhärskaren i Thatta underkastar sig; mogulerna annekterar Sind. Rajasinha I av Sitawaka dör och hans rike faller sönder; portugiserna tar låglandet.
  The Mughals regain Kandahar, with Pishin and Quetta.: Mogulerna återvinner Kandahar med Pishin och Quetta.
  Chand Bibi of Ahmadnagar cedes Berar to the Mughals.: Chand Bibi av Ahmadnagar avträder Berar till mogulerna.
  Akbar takes Asirgarh and annexes Khandesh.: Akbar intar Asirgarh och annekterar Khandesh.
  The Wodeyar king Raja Wodeyar I takes Srirangapatna and rules southern Karnataka as the Kingdom of Mysore.: Wodeyarkungen Raja Wodeyar I intar Srirangapatna och styr södra Karnataka som kungariket Mysore.
  The Mughals take Sylhet and, from the Koch, Koch Hajo (Lower Assam).: Mogulerna tar Sylhet och, från Kochriket, Koch Hajo (Nedre Assam).
  About 1616. Ngawang Namgyal, the Zhabdrung, arrives from Tibet and begins to unite western Bhutan; the east follows by about 1650.: Omkring 1616. Ngawang Namgyal, zhabdrungen, kommer från Tibet och börjar ena västra Bhutan; östra delen följer omkring 1650.
  Phillippe de Oliveira conquers the Jaffna Kingdom for Portugal.: Phillippe de Oliveira erövrar kungariket Jaffna åt Portugal.
  Bijapur annexes the Bidar Sultanate.: Bijapur annekterar Bidarsultanatet.
  Shah Abbas I takes Kandahar; the Safavids also hold Pishin.: Shah Abbas I intar Kandahar; safaviderna behärskar också Pishin.
  The Mughals take Daulatabad from Ahmadnagar.: Mogulerna tar Daulatabad från Ahmadnagar.
  The Ahmadnagar Sultanate is extinguished. Bijapur keeps Pune and the south of the Konkan; the rest passes to the Mughals.: Ahmadnagarsultanatet utplånas. Bijapur behåller Pune och södra Konkan; resten övergår till mogulerna.
  The Mughals regain Kandahar, with Pishin.: Mogulerna återvinner Kandahar med Pishin.
  The Dutch East India Company, allied with Kandy, takes Galle from the Portuguese; Matara follows. The Portuguese keep Colombo.: Nederländska ostindiska kompaniet, allierat med Kandy, tar Galle från portugiserna; Matara följer. Portugiserna behåller Colombo.
  Phuntsog Namgyal is consecrated as the first Chogyal of Sikkim.: Phuntsog Namgyal invigs till Sikkims förste chogyal.
  The Dutch take Negombo from the Portuguese for the second time and keep it.: Holländarna tar Negombo från portugiserna för andra gången och behåller det.
  "The Vijayanagara Empire ends: Golconda and Bijapur divide the last lands of the Aravidu kings.": "Vijayanagarariket går under: Golconda och Bijapur delar aravidukungarnas sista länder."
  Shah Abbas II retakes Kandahar, with Pishin.: Shah Abbas II återtar Kandahar med Pishin.
  The Dutch take Colombo from the Portuguese. Shivaji, a Maratha jagirdar of Bijapur, takes Javli, the start of his own state.: Holländarna tar Colombo från portugiserna. Shivaji, en marathajagirdar i Bijapurs tjänst, intar Javli, början på hans egen stat.
  The Dutch take Jaffna, the last Portuguese stronghold in Sri Lanka; Kandy keeps the interior.: Holländarna intar Jaffna, portugisernas sista fäste på Sri Lanka; Kandy behåller inlandet.
  About 1666. Mir Ahmad founds the Khanate of Kalat.: Omkring 1666. Mir Ahmad grundar khanatet Kalat.
  Shaista Khan’s Mughal army takes Chittagong from Arakan.: Shaista Khans mogularmé tar Chittagong från Arakan.
  The Ahoms retake Guwahati from the Mughals; they keep it after the Battle of Saraighat (1671).: Ahomerna återtar Guwahati från mogulerna; de behåller staden efter slaget vid Saraighat (1671).
  About 1670. Mysore under Chikka Devaraja conquers Kongu (Coimbatore and Salem) from Madurai.: Omkring 1670. Mysore under Chikka Devaraja erövrar Kongu (Coimbatore och Salem) från Madurai.
  "Shivaji is crowned at Raigad: the Maratha kingdom. Venkoji, his half-brother, takes Thanjavur from the Nayakas. The French found Pondicherry.": "Shivaji kröns i Raigad: Marathakungariket. Hans halvbror Venkoji tar Thanjavur från nayakas. Fransmännen grundar Pondichéry."
  Shivaji’s southern campaign takes Gingee and Vellore from Bijapur.: Shivajis fälttåg i söder tar Gingee och Vellore från Bijapur.
  Aurangzeb occupies Marwar after the death of Jaswant Singh; the Rajput War begins.: Aurangzeb ockuperar Marwar efter Jaswant Singhs död; rajputkriget börjar.
  The Ahom viceroy Laluk Sola Borphukan hands Guwahati over to the Mughals.: Ahomernas vicekung Laluk Sola Borphukan överlämnar Guwahati till mogulerna.
  Battle of Itakhuli. The Ahoms take Guwahati and the country east of the Manas from the Mughals for good.: Slaget vid Itakhuli. Ahomerna tar Guwahati och landet öster om Manas från mogulerna för gott.
  Aurangzeb takes Bijapur and ends the Adil Shahi sultanate.: Aurangzeb intar Bijapur och gör slut på adilshahiernas sultanat.
  Aurangzeb takes Golconda and ends the Qutb Shahi sultanate.: Aurangzeb intar Golconda och gör slut på qutbshahiernas sultanat.
  After the capture of Sambhaji and the fall of Raigad, the Mughals occupy most of the Maratha country. The Marathas fight on from Gingee and, after 1700, across the Deccan.: Efter tillfångatagandet av Sambhaji och Raigads fall ockuperar mogulerna större delen av marathernas land. Maratherna fortsätter kampen från Gingee och, efter 1700, över hela Deckan.
  The Dutch take Pondicherry from the French; they return it under the Treaty of Ryswick (1699).: Holländarna tar Pondichéry från fransmännen; de lämnar tillbaka staden enligt freden i Rijswijk (1699).
  Zulfiqar Khan takes Gingee for the Mughals.: Zulfiqar Khan intar Gingee åt mogulerna.
  Pondicherry is handed back to France.: Pondichéry lämnas tillbaka till Frankrike.
  Aurangzeb recognises Yar Muhammad Kalhoro as ruler in Sind; the Kalhoras rule Sind, later as Durrani vassals.: Aurangzeb erkänner Yar Muhammad Kalhoro som härskare i Sind; kalhoras styr Sind, senare som durraniska vasaller.
  Aurangzeb dies. Ajit Singh retakes Jodhpur; the Marathas under Shahu recover their homeland.: Aurangzeb dör. Ajit Singh återtar Jodhpur; maratherna under Shahu återvinner sitt hemland.
  Mirwais Hotak leads a revolt in Kandahar; the Hotakis hold Pishin.: Mirwais Hotak leder ett uppror i Kandahar; hotakierna behärskar Pishin.
  About 1710. Saadatullah Khan, Mughal governor of the Carnatic at Arcot, founds the line of the Nawabs of the Carnatic under the Nizam’s nominal authority.: Omkring 1710. Saadatullah Khan, mogulernas guvernör i Karnatik med säte i Arcot, grundar ätten av nawaber i Karnatik under nizamens nominella överhöghet.
  Murshid Quli Khan, diwan and then governor, makes Bengal and Odisha a hereditary nawabate under nominal Mughal rule.: Murshid Quli Khan, först diwan och sedan guvernör, gör Bengalen och Odisha till ett ärftligt nawabat under nominellt mogulstyre.
  Saadat Khan becomes governor of Awadh; he and his successors rule it as hereditary nawabs.: Saadat Khan blir guvernör i Awadh; han och hans efterträdare styr provinsen som ärftliga nawaber.
  About 1723. Dost Mohammad Khan founds the state of Bhopal.: Omkring 1723. Dost Mohammad Khan grundar staten Bhopal.
  Battle of Shakar Kheda. Asaf Jah I (Nizam-ul-Mulk) defeats the Mughal governor of the Deccan and rules it as Nizam of Hyderabad.: Slaget vid Shakar Kheda. Asaf Jah I (Nizam-ul-Mulk) besegrar mogulernas guvernör i Deckan och styr området som nizam av Hyderabad.
  About 1730. With Mughal power gone from Saurashtra, its many chiefs (Junagadh, Nawanagar, Bhavnagar and others) are independent; the Marathas soon levy tribute on them.: Omkring 1730. När mogulmakten har försvunnit från Saurashtra är dess många hövdingar (Junagadh, Nawanagar, Bhavnagar med flera) självständiga; maratherna börjar snart utkräva tribut av dem.
  About 1732. Chhatrasal of Bundelkhand leaves a third of his kingdom, with Jhansi and Kalpi, to the Peshwa Baji Rao I.: Omkring 1732. Chhatrasal av Bundelkhand testamenterar en tredjedel av sitt rike, med Jhansi och Kalpi, till peshwan Baji Rao I.
  Shuja-ud-Din, Nawab of Bengal, adds Bihar to his government; his forces annex the plains of Tripura (Comilla).: Shuja-ud-Din, nawab av Bengalen, lägger Bihar under sitt styre; hans styrkor annekterar slätterna i Tripura (Comilla).
  Chanda Sahib takes Madurai and Tiruchirappalli for the Nawab of the Carnatic; the Madurai Nayaka dynasty ends.: Chanda Sahib tar Madurai och Tiruchirappalli åt nawaben av Karnatik; nayakadynastin i Madurai upphör.
  Treaty of Duraha, after the Battle of Bhopal. The Nizam cedes Malwa to the Marathas. The Nawab of Awadh gives the Benares zamindari to Mansa Ram.: Fördraget i Duraha, efter slaget vid Bhopal. Nizamen avträder Malwa till maratherna. Nawaben av Awadh ger zamindarin Benares till Mansa Ram.
  Nader Shah takes Peshawar on his way to India; at Karnal in 1739 the Mughal emperor cedes him everything west of the Indus.: Nader shah intar Peshawar på väg till Indien; vid Karnal 1739 avträder mogulkejsaren allt väster om Indus till honom.
  About 1740. Ali Mohammed Khan, leader of the Rohilla Afghans, rules Rohilkhand from Aonla.: Omkring 1740. Ali Mohammed Khan, ledare för rohilla-afghanerna, styr Rohilkhand från Aonla.
  Raghoji Bhonsle of Nagpur, a Maratha general, takes Chhattisgarh from the Kalachuris of Ratanpur.: Raghoji Bhonsle av Nagpur, en marathageneral, tar Chhattisgarh från kalachuris i Ratanpur.
  Raghoji Bhonsle takes Nagpur and the Gond kingdom of Deogarh.: Raghoji Bhonsle intar Nagpur och gondkungariket Deogarh.
  Nader Shah is murdered. Ahmad Shah Durrani takes his eastern lands, with Peshawar and Pishin.: Nader shah mördas. Ahmad shah Durrani tar hans östra länder, med Peshawar och Pishin.
  About 1748. Nawab Bahawal Khan I founds Bahawalpur, the capital of the Daudpotra state south of the Sutlej.: Omkring 1748. Nawab Bahawal Khan I grundar Bahawalpur, huvudstad i daudpotrastaten söder om Sutlej.
  Alivardi Khan of Bengal cedes Odisha to Raghoji Bhonsle of Nagpur.: Alivardi Khan av Bengalen avträder Odisha till Raghoji Bhonsle av Nagpur.
  The Mughal emperor cedes Lahore and Multan to Ahmad Shah Durrani, whose army takes Kashmir. Under the Treaty of Bhalki the Nizam cedes Khandesh to the Marathas.: Mogulkejsaren avträder Lahore och Multan till Ahmad shah Durrani, vars armé intar Kashmir. Genom fördraget i Bhalki avträder nizamen Khandesh till maratherna.
  The Marathas take Ahmedabad; Gujarat is shared between the Peshwa and the Gaekwads of Baroda. The French Company’s general Bussy obtains the Northern Circars from the Nizam.: Maratherna intar Ahmedabad; Gujarat delas mellan peshwan och gaekwaderna i Baroda. Det franska kompaniets general Bussy får Northern Circars av nizamen.
  The Marathas under Raghunath Rao take Lahore and drive the Durrani governors out of the Punjab.: Maratherna under Raghunath Rao intar Lahore och driver ut durraniernas guvernörer ur Punjab.
  The British take Masulipatnam; the French lose the Northern Circars, which return to the Nizam.: Britterna intar Masulipatnam; fransmännen förlorar Northern Circars, som återgår till nizamen.
  Ahmad Shah Durrani invades again and retakes the Punjab from the Marathas.: Ahmad shah Durrani invaderar på nytt och återtar Punjab från maratherna.
  Battle of Udgir. The Nizam cedes Bijapur, Ahmadnagar, Daulatabad and Burhanpur to the Marathas.: Slaget vid Udgir. Nizamen avträder Bijapur, Ahmadnagar, Daulatabad och Burhanpur till maratherna.
  Mir Qasim, the new Nawab of Bengal, cedes Burdwan, Midnapore and Chittagong to the East India Company.: Mir Qasim, den nye nawaben av Bengalen, avträder Burdwan, Midnapore och Chittagong till Ostindiska kompaniet.
  Hyder Ali takes power in Mysore. After Panipat the Maratha chiefs Scindia and Holkar rule Gwalior and Malwa as states of their own within the Maratha Confederacy; Scindia also holds Burhanpur.: Hyder Ali tar makten i Mysore. Efter Panipat styr marathahövdingarna Scindia och Holkar Gwalior och Malwa som egna stater inom Marathaförbundet; Scindia behärskar också Burhanpur.
  The British take Pondicherry after a long siege and raze its fortifications.: Britterna intar Pondichéry efter en lång belägring och raserar dess befästningar.
  Prithvi Narayan Shah of Gorkha takes Makwanpur.: Prithvi Narayan Shah av Gorkha intar Makwanpur.
  Hyder Ali takes Bednur and ends the Keladi Nayaka kingdom.: Hyder Ali intar Bednur och gör slut på nayakakungariket i Keladi.
  The Sikh misls take Lahore and the plains between the Indus and the Yamuna from the Durranis.: Sikhernas misler tar Lahore och slätterna mellan Indus och Yamuna från durranierna.
  Pondicherry is handed back to France under the Treaty of Paris (1763).: Pondichéry lämnas tillbaka till Frankrike enligt freden i Paris (1763).
  Treaty of Allahabad. The Mughal emperor grants the East India Company the diwani (revenue rights) of Bengal, Bihar and Odisha; the Company rules Bengal and Bihar.: Fördraget i Allahabad. Mogulkejsaren ger Ostindiska kompaniet diwani (rätten att driva in skatter) i Bengalen, Bihar och Odisha; kompaniet styr Bengalen och Bihar.
  Hyder Ali conquers Malabar and the Zamorin’s kingdom of Calicut.: Hyder Ali erövrar Malabar och zamorinens kungarike Calicut.
  Treaty of Batticaloa, after the Kandyan–Dutch war. Kandy cedes the whole coast of Sri Lanka, with Batticaloa and Trincomalee, to the Dutch.: Fördraget i Batticaloa, efter kriget mellan Kandy och holländarna. Kandy avträder hela Sri Lankas kust, med Batticaloa och Trincomalee, till holländarna.
  The Nizam cedes the Northern Circars to the East India Company.: Nizamen avträder Northern Circars till Ostindiska kompaniet.
  "Prithvi Narayan Shah takes Kathmandu; Lalitpur and Bhaktapur fall by 1769: the Kingdom of Nepal.": "Prithvi Narayan Shah intar Katmandu; Lalitpur och Bhaktapur har fallit senast 1769: kungariket Nepal."
  Rohilla War. The Nawab of Awadh annexes Rohilkhand with the help of East India Company troops. Prithvi Narayan Shah conquers the Kirat country and Morang, eastern Nepal.: Rohillakriget. Nawaben av Awadh annekterar Rohilkhand med hjälp av trupper från Ostindiska kompaniet. Prithvi Narayan Shah erövrar kiratlandet och Morang i östra Nepal.
  Treaty of Faizabad. The Nawab of Awadh cedes the Benares zamindari to the East India Company.: Fördraget i Faizabad. Nawaben av Awadh avträder zamindarin Benares till Ostindiska kompaniet.
  The British take Pondicherry again, after France joins the American War of Independence.: Britterna intar Pondichéry igen, sedan Frankrike gått in i amerikanska frihetskriget.
  Hyder Ali takes Cuddapah and the land of the Pathan nawabs of Cuddapah and Kurnool.: Hyder Ali tar Cuddapah och pathannawabernas länder i Cuddapah och Kurnool.
  The Peshwa’s governor of Saugor ends the Gond kingdom of Garha-Mandla; Mandla passes to the Bhonsles of Nagpur in 1799.: Peshwans guvernör i Saugor gör slut på gondkungariket Garha-Mandla; Mandla övergår till bhonslerna i Nagpur 1799.
  "Battle of Halani. Mir Fateh Ali Khan Talpur overthrows the Kalhoras: the Talpur Mirs rule Sind.": "Slaget vid Halani. Mir Fateh Ali Khan Talpur störtar kalhoras: talpurmirerna styr Sind."
  Pondicherry is returned to France under the Treaty of Versailles (1783).: Pondichéry lämnas tillbaka till Frankrike enligt freden i Versailles (1783).
  About 1785. Mahadji Scindia controls Delhi, Agra and the upper Doab as regent of the Mughal emperor.: Omkring 1785. Mahadji Scindia kontrollerar Delhi, Agra och övre Doab som regent för mogulkejsaren.
  Nepal conquers the Chaubisi principalities of central Nepal.: Nepal erövrar Chaubisi-furstendömena i centrala Nepal.
  Nepal conquers the Baise principalities of the west, with Jumla, and invades Sikkim.: Nepal erövrar Baise-furstendömena i väster, med Jumla, och invaderar Sikkim.
  Nepal conquers the Chand kingdom of Kumaon.: Nepal erövrar chandkungariket Kumaon.
  Treaty of Seringapatam, after the Third Anglo-Mysore War. Tipu Sultan cedes Malabar, Salem and the Baramahal to the East India Company, and Bellary and Cuddapah to the Nizam.: Fördraget i Seringapatam, efter tredje Mysorekriget. Tipu Sultan avträder Malabar, Salem och Baramahal till Ostindiska kompaniet och Bellary och Cuddapah till nizamen.
  The British take Pondicherry in the war with revolutionary France; they hold it, but for a few months in 1802–1803, until 1816.: Britterna intar Pondichéry under kriget mot det revolutionära Frankrike; bortsett från några månader 1802–1803 behåller de staden till 1816.
  "The British take Jaffna and, in 1796, Colombo: the Dutch possessions in Sri Lanka pass to Britain.": "Britterna intar Jaffna och 1796 Colombo: de nederländska besittningarna på Sri Lanka övergår till Storbritannien."
  Seringapatam falls and Tipu Sultan is killed. The Wodeyars are restored to a smaller Mysore under British protection; the Company takes Kanara and Coimbatore. In October the Raja of Thanjavur cedes his kingdom to the Company, and in July Ranjit Singh takes Lahore.: Seringapatam faller och Tipu Sultan dödas. Wodeyardynastin återinsätts i ett mindre Mysore under brittiskt beskydd; kompaniet tar Kanara och Coimbatore. I oktober avträder rajan av Thanjavur sitt kungarike till kompaniet, och i juli intar Ranjit Singh Lahore.
  The Nizam cedes the districts he received from Mysore (the Ceded Districts) to the East India Company.: Nizamen avträder de distrikt han fått från Mysore (”Ceded Districts”) till Ostindiska kompaniet.
  The East India Company annexes the Carnatic. In November the Nawab of Awadh cedes Rohilkhand, the lower Doab and Gorakhpur.: Ostindiska kompaniet annekterar Karnatik. I november avträder nawaben av Awadh Rohilkhand, nedre Doab och Gorakhpur.
  Battle of Delhi. Lake’s army defeats Scindia’s forces; the Company takes Delhi and the Mughal emperor comes under its protection.: Slaget vid Delhi. Lakes armé besegrar Scindias styrkor; kompaniet intar Delhi och mogulkejsaren ställs under dess beskydd.
  Treaty of Deogaon. The Bhonsle of Nagpur cedes Odisha; under the Treaty of Surji-Anjangaon (30 December) Scindia cedes his lands north of the Jumna and in Gujarat. The Company also takes Bundelkhand from the Peshwa.: Fördraget i Deogaon. Bhonslen av Nagpur avträder Odisha; genom fördraget i Surji-Anjangaon (30 december) avträder Scindia sina länder norr om Jumna och i Gujarat. Kompaniet tar också Bundelkhand från peshwan.
  Nepal conquers Garhwal.: Nepal erövrar Garhwal.
  Nepal annexes the kingdom of Palpa, with Butwal, after executing its king, Prithvi Pal Sen.: Nepal annekterar kungariket Palpa, med Butwal, sedan dess kung Prithvi Pal Sen avrättats.
  Ranjit Singh takes Jammu.: Ranjit Singh intar Jammu.
  Treaty of Amritsar. Ranjit Singh accepts the Sutlej as his border; the Cis-Sutlej states pass under British protection. Ranjit Singh takes Kangra from the Gorkhas.: Fördraget i Amritsar. Ranjit Singh godtar Sutlej som sin gräns; Cis-Sutlej-staterna ställs under brittiskt beskydd. Ranjit Singh tar Kangra från gorkhas.
  Kandyan Convention. The British take Kandy, and the whole of Sri Lanka becomes British Ceylon.: Kandykonventionen. Britterna intar Kandy, och hela Sri Lanka blir Brittiska Ceylon.
  Treaty of Sugauli. Nepal cedes Kumaon, Garhwal and its lands in Sikkim to the East India Company; Garhwal is divided between British Garhwal and the princely state of Tehri Garhwal.: Fördraget i Sugauli. Nepal avträder Kumaon, Garhwal och sina länder i Sikkim till Ostindiska kompaniet; Garhwal delas mellan Brittiska Garhwal och furstestaten Tehri Garhwal.
  Pondicherry is returned to France for the third time.: Pondichéry lämnas tillbaka till Frankrike för tredje gången.
  Diwan Sawan Mal and the Sikh army take Multan from the Durranis.: Diwan Sawan Mal och sikhernas armé tar Multan från durranierna.
  "The Peshwa surrenders: the Third Anglo-Maratha War ends the Maratha Confederacy. The Company annexes the Peshwa’s lands; Scindia, Holkar and the Bhonsle become princely states, the Bhonsle losing the Narmada valley.": "Peshwan kapitulerar: tredje marathakriget gör slut på Marathaförbundet. Kompaniet annekterar peshwans länder; Scindia, Holkar och bhonslen blir furstestater, varvid bhonslen förlorar Narmadadalen."
  Battle of Shopian. The Sikh Empire takes Kashmir from the Durranis.: Slaget vid Shopian. Sikhriket tar Kashmir från durranierna.
  The Burmese occupy Assam; they have held Manipur since 1819.: Burmeserna ockuperar Assam; de har behärskat Manipur sedan 1819.
  Ranjit Singh makes Gulab Singh, a Dogra, Raja of Jammu.: Ranjit Singh gör dogran Gulab Singh till raja av Jammu.
  Treaty of Yandabo. Burma gives up Assam and Manipur; the Company annexes Assam, and Manipur is restored under Gambhir Singh.: Fördraget i Yandabo. Burma ger upp Assam och Manipur; kompaniet annekterar Assam, och Manipur återupprättas under Gambhir Singh.
  The British restore Purandar Singha as Ahom king in Upper Assam.: Britterna återinsätter Purandar Singha som ahomkung i Övre Assam.
  Zorawar Singh, Gulab Singh’s general, begins the conquest of Ladakh; the kingdom is annexed by 1842.: Zorawar Singh, Gulab Singhs general, inleder erövringen av Ladakh; kungariket är annekterat 1842.
  Hari Singh Nalwa occupies Peshawar for the Sikh Empire.: Hari Singh Nalwa ockuperar Peshawar åt Sikhriket.
  The British annex the Jaintia kingdom; with the Khasi hills (from 1833) Meghalaya comes under British rule.: Britterna annekterar jaintiakungariket; tillsammans med Khasibergen (från 1833) kommer Meghalaya under brittiskt styre.
  The British depose Purandar Singha and annex Upper Assam.: Britterna avsätter Purandar Singha och annekterar Övre Assam.
  Zorawar Singh conquers Baltistan; Gilgit follows in 1842.: Zorawar Singh erövrar Baltistan; Gilgit följer 1842.
  Battle of Dubba (Hyderabad). After Miani, the British annex Sind.: Slaget vid Dubba (Hyderabad). Efter Miani annekterar britterna Sind.
  Treaty of Lahore, after the First Anglo-Sikh War. The Sikh Empire cedes the Jalandhar Doab and the hills between the Beas and the Sutlej.: Fördraget i Lahore, efter första sikhkriget. Sikhriket avträder Jalandhar-Doab och bergen mellan Beas och Sutlej.
  "Treaty of Amritsar. The British sell Kashmir to Gulab Singh: the princely state of Jammu and Kashmir.": "Fördraget i Amritsar. Britterna säljer Kashmir till Gulab Singh: furstestaten Jammu och Kashmir."
  After the Second Anglo-Sikh War the East India Company annexes the Punjab.: Efter andra sikhkriget annekterar Ostindiska kompaniet Punjab.
  The Nizam assigns Berar to the East India Company to pay for the Hyderabad Contingent.: Nizamen överlåter Berar till Ostindiska kompaniet som betalning för Hyderabadkontingenten.
  The East India Company annexes the Nagpur kingdom of the Bhonsles under the doctrine of lapse.: Ostindiska kompaniet annekterar bhonslernas kungarike Nagpur med stöd av doktrinen om förverkad arvsrätt (doctrine of lapse).
  The East India Company annexes Awadh.: Ostindiska kompaniet annekterar Awadh.
  A British penal settlement is founded at Port Blair in the Andaman Islands.: En brittisk straffkoloni grundas i Port Blair på Andamanerna.
  Scindia cedes the Nimar district, with Khandwa, to British India in an exchange of territory.: Scindia avträder distriktet Nimar, med Khandwa, till Brittiska Indien i ett områdesbyte.
  Treaty of Sinchula, after the Bhutan War. Bhutan cedes the Bengal and Assam Duars and Kalimpong to British India.: Fördraget i Sinchula, efter Bhutankriget. Bhutan avträder Bengal- och Assamduars samt Kalimpong till Brittiska Indien.
  Treaty of Gandamak. Afghanistan cedes Pishin and Sibi to British India; Quetta is leased from Kalat in 1876–1883.: Fördraget i Gandamak. Afghanistan avträder Pishin och Sibi till Brittiska Indien; Quetta arrenderas från Kalat 1876–1883.
  About 1881. The British complete the annexation of the Naga Hills, with Kohima.: Omkring 1881. Britterna fullbordar annekteringen av Nagabergen, med Kohima.
  The British annex the Lushai Hills (Mizoram).: Britterna annekterar Lushaibergen (Mizoram).
  The Durand Line agreement fixes the border between Afghanistan and British India; the Pashtun tribal areas come under British political agents.: Avtalet om Durandlinjen fastställer gränsen mellan Afghanistan och Brittiska Indien; de pashtunska stamområdena ställs under brittiska politiska agenter.
  The Arakkal ruler of Cannanore cedes the Laccadive Islands to British India.: Arakkalhärskaren i Cannanore avträder Lackadiverna till Brittiska Indien.
  Simla Convention. The McMahon Line between Tibet and British India puts the hills north of Assam on the British side; they are not administered until the 1940s, Tawang until 1951.: Simlakonventionen. McMahonlinjen mellan Tibet och Brittiska Indien lägger bergen norr om Assam på den brittiska sidan; de förvaltas inte förrän på 1940-talet, Tawang först 1951.
  Partition of India. Pakistan becomes independent, with Sind, western Punjab, the North-West Frontier, British Baluchistan and East Bengal; Sylhet joins East Bengal after a referendum.: Indiens delning. Pakistan blir självständigt, med Sind, västra Punjab, Nordvästra gränsprovinsen, Brittiska Baluchistan och Östbengalen; Sylhet ansluter sig till Östbengalen efter en folkomröstning.
  India becomes independent. Most princely states have acceded to it; Hyderabad, Jammu and Kashmir and others have not yet decided.: Indien blir självständigt. De flesta furstestater har anslutit sig till landet; Hyderabad, Jammu och Kashmir och andra har ännu inte bestämt sig.
  Bahawalpur accedes to Pakistan.: Bahawalpur ansluter sig till Pakistan.
  Rebels in the west of Jammu and Kashmir, backed by Pakistani tribesmen, proclaim Azad (Free) Kashmir; the area they hold stays under Pakistani control.: Rebeller i västra Jammu och Kashmir, med stöd av pakistanska stammän, utropar Azad (Fria) Kashmir; det område de behärskar förblir under pakistansk kontroll.
  Maharaja Hari Singh accedes Jammu and Kashmir to India; the First Kashmir War follows. The ceasefire of 1 January 1949 leaves the valley, Jammu and Ladakh under Indian control.: Maharadja Hari Singh ansluter Jammu och Kashmir till Indien; första Kashmirkriget följer. Vapenvilan den 1 januari 1949 lämnar dalen, Jammu och Ladakh under indisk kontroll.
  After the Gilgit Scouts’ revolt (1 November) Pakistan takes over the Gilgit Agency; Baltistan follows in 1948.: Efter Gilgit Scouts revolt (1 november) tar Pakistan över Gilgit Agency; Baltistan följer 1948.
  Ceylon becomes an independent dominion.: Ceylon blir en självständig dominion.
  The Khan of Kalat accedes to Pakistan.: Khanen av Kalat ansluter sig till Pakistan.
  Operation Polo. The Nizam surrenders and Hyderabad is annexed to India.: Operation Polo. Nizamen kapitulerar och Hyderabad införlivas med Indien.
  France hands over the administration of Pondicherry, Karaikal, Mahé and Yanam to India (de jure in 1962).: Frankrike överlämnar förvaltningen av Pondichéry, Karaikal, Mahé och Yanam till Indien (de jure 1962).
  India annexes Goa, Daman and Diu after a two-day military operation. Dadra and Nagar Haveli, freed from Portuguese rule in 1954, is merged into India in August.: Indien annekterar Goa, Daman och Diu efter en tvådagars militär operation. Dadra och Nagar Haveli, som befriats från portugisiskt styre 1954, införlivas med Indien i augusti.
  "The Pakistani army surrenders in Dhaka: East Pakistan becomes the independent state of Bangladesh, proclaimed on 26 March.": "Den pakistanska armén kapitulerar i Dhaka: Östpakistan blir den självständiga staten Bangladesh, utropad den 26 mars."
  Sikkim becomes a state of India after a referendum.: Sikkim blir en indisk delstat efter en folkomröstning.
  Operation Meghdoot. Indian troops occupy the Siachen Glacier, north of the end of the 1949 ceasefire line; the two armies have faced each other there since.: Operation Meghdoot. Indiska trupper ockuperar Siachenglaciären, norr om slutet på 1949 års eldupphörslinje; de båda arméerna har stått mot varandra där sedan dess.
  About 800. Tang China rules from Chang’an but has lost the north-west to the Tibetan Empire, which holds the Hexi Corridor, Gansu west of the Liupan Mountains, Qinghai and the Tarim; the Kingdom of Khotan is its vassal. The Uyghur Khaganate rules Mongolia, Dzungaria and Turfan, the Karluks the Ili and Semirechye, the Oghuz the lower Syr Darya and the Kimek–Kipchak confederation the Irtysh steppe. In the north-east the Khitan tribes live on the Liao and Xar Moron rivers and Balhae rules Manchuria; Nanzhao rules Yunnan. The peoples of Siberia, the Mohe tribes of the Amur and the indigenous peoples of Taiwan live outside any state.: Omkring 800. Tangdynastins Kina styr från Chang’an men har förlorat nordväst till Tibetanska riket, som behärskar Hexikorridoren, Gansu väster om Liupanbergen, Qinghai och Tarim; kungariket Khotan är dess vasall. Uiguriska khaganatet härskar över Mongoliet, Dzungariet och Turfan, karlukerna över Ili och Semiretje, oguzerna över nedre Syr-Darja och det kimek-kiptjakiska förbundet över stäppen vid Irtysj. I nordost lever khitanstammarna vid floderna Liao och Xar Moron, och Balhae härskar över Manchuriet; Nanzhao härskar över Yunnan. Sibiriens folk, mohestammarna vid Amur och Taiwans ursprungsfolk lever utanför varje stat.
  The Yenisei Kyrgyz take the Uyghur capital Ordu-Baliq and destroy the Uyghur Khaganate. Uyghur groups flee to the Tang frontier, to Gansu and to Turfan, where they found the Kingdom of Qocho; the Karluks take western Dzungaria. Inner Mongolia and Hulunbuir are left to the Shatuo, Tatar and Shiwei tribes.: Jenisejkirgizerna intar den uiguriska huvudstaden Ordu-Baliq och krossar Uiguriska khaganatet. Uiguriska grupper flyr till gränsen mot Tangdynastins Kina, till Gansu och till Turfan, där de grundar kungariket Qocho; karlukerna tar västra Dzungariet. Inre Mongoliet och Hulunbuir lämnas åt shatuo-, tatar- och shiweistammarna.
  The Samanid Nuh ibn Asad takes Isfijab (Sayram) from its Turkic rulers.: Samaniden Nuh ibn Asad tar Isfijab (Sayram) från dess turkiska härskare.
  The Tibetan Empire breaks up after the death of the emperor Langdarma; Tibetan rule over Amdo, Kham and the Tarim collapses. The Karluks take Kashgar.: Tibetanska riket faller sönder efter kejsar Langdarmas död; det tibetanska styret över Amdo, Kham och Tarim bryter samman. Karlukerna intar Kashgar.
  Zhang Yichao drives the Tibetans out of Shazhou (Dunhuang).: Zhang Yichao driver ut tibetanerna ur Shazhou (Dunhuang).
  Tang China recovers Qinzhou, Yuanzhou and the passes west of the Liupan Mountains from Tibet.: Tangdynastins Kina återtar Qinzhou, Yuanzhou och passen väster om Liupanbergen från Tibet.
  Zhang Yichao, now governor of the Guiyi circuit under the Tang, holds the Hexi Corridor and Hami; Liangzhou (Wuwei) follows in 861.: Zhang Yichao, nu ståthållare över Guiyikretsen under Tangdynastin, behärskar Hexikorridoren och Hami; Liangzhou (Wuwei) följer 861.
  Nanzhao takes Xizhou (Xichang) south of the Dadu River and besieges Chengdu; after Gao Pian’s campaign of 875 the Dadu stays the border.: Nanzhao tar Xizhou (Xichang) söder om Dadufloden och belägrar Chengdu; efter Gao Pians fälttåg 875 förblir Dadu gränsen.
  The Kingdom of Qocho takes Yizhou (Hami) from the Guiyi circuit.: Kungariket Qocho tar Yizhou (Hami) från Guiyikretsen.
  The Tangut chief Tuoba Sigong is made military governor of Xiazhou (the Dingnan circuit) for his help against Huang Chao; his family rules the Ordos borderland as a hereditary circuit.: Tanguthövdingen Tuoba Sigong utnämns till militärguvernör över Xiazhou (Dingnankretsen) för sin hjälp mot Huang Chao; hans släkt styr gränslandet Ordos som en ärftlig krets.
  The Samanid Ismail takes Taraz (Talas) from the Karluks.: Samaniden Ismail tar Taraz (Talas) från karlukerna.
  About 894. Uyghurs settled in Gansu found the Ganzhou Uyghur Kingdom at Zhangye; the Guiyi circuit is left with Guazhou and Shazhou.: Omkring 894. Uigurer som har bosatt sig i Gansu grundar Uiguriska kungariket Ganzhou i Zhangye; Guiyikretsen har kvar Guazhou och Shazhou.
  "Zhu Wen deposes the last Tang emperor and founds the Later Liang at Kaifeng: the Five Dynasties and Ten Kingdoms. Li Keyong’s Jin holds Shanxi, Liu Shouguang’s Lulong circuit holds Youzhou (Beijing), Li Maozhen’s Qi holds Fengxiang and eastern Gansu; in the south Wu, Wuyue, Min, Chu, Lingnan (the later Southern Han) and Former Shu go their own way.": "Zhu Wen avsätter den siste Tangkejsaren och grundar Senare Liang i Kaifeng: De fem dynastierna och de tio rikena. Li Keyongs Jin behärskar Shanxi, Liu Shouguangs Lulongkrets behärskar Youzhou (Peking) och Li Maozhens Qi behärskar Fengxiang och östra Gansu; i söder går Wu, Wuyue, Min, Chu, Lingnan (det senare Södra Han) och Tidigare Shu sin egen väg."
  Li Cunxu of Jin captures Liu Shouguang and annexes Yan.: Li Cunxu av Jin tillfångatar Liu Shouguang och annekterar Yan.
  Former Shu takes Qinzhou (Tianshui) from Qi and the Jingnan circuit goes over to the Later Liang; Li Maozhen is left with Fengxiang.: Tidigare Shu tar Qinzhou (Tianshui) från Qi, och Jingnankretsen går över till Senare Liang; Li Maozhen har kvar Fengxiang.
  Abaoji of the Khitans campaigns west across the Yinshan, subjecting the Tuyuhun, Tangut and Tatar tribes of Inner Mongolia; the Weibo army in southern Hebei has gone over to Jin.: Khitanernas Abaoji drar på fälttåg västerut över Yinshan och underkuvar tuyuhun-, tangut- och tatarstammarna i Inre Mongoliet; Weiboarmén i södra Hebei har gått över till Jin.
  Li Cunxu, who has proclaimed the Later Tang, takes Kaifeng; the Later Liang falls and Jin’s lands become the core of the Later Tang.: Li Cunxu, som har utropat Senare Tang, intar Kaifeng; Senare Liang faller och Jins länder blir kärnan i Senare Tang.
  "Li Maozhen of Qi submits to the Later Tang. Abaoji’s western campaign reaches the Orkhon: the Kyrgyz withdraw to the Yenisei and the Khitans dominate the Mongolian steppe.": "Li Maozhen av Qi underkastar sig Senare Tang. Abaojis fälttåg västerut når Orchon: kirgizerna drar sig tillbaka till Jenisej och khitanerna dominerar den mongoliska stäppen."
  The Later Tang conquers Former Shu.: Senare Tang erövrar Tidigare Shu.
  Abaoji destroys Balhae and sets up the Dongdan kingdom under his son in its place; the Mohe peoples of the east keep to themselves.: Abaoji krossar Balhae och upprättar i dess ställe kungariket Dongdan under sin son; mohefolken i öster håller sig för sig själva.
  About 930. Nyima Gon, a descendant of the Tibetan emperors, founds a kingdom in Ngari in western Tibet; Guge is its central part.: Omkring 930. Nyima Gon, en ättling till de tibetanska kejsarna, grundar ett kungarike i Ngari i västra Tibet; Guge är dess centrala del.
  Meng Zhixiang, the Later Tang governor of Sichuan, proclaims the Later Shu.: Meng Zhixiang, Senare Tangs ståthållare i Sichuan, utropar Senare Shu.
  The Later Jin cedes the Sixteen Prefectures, from Youzhou to Yunzhou (Datong), to the Liao in return for Khitan help in Shi Jingtang’s revolt (936).: Senare Jin avträder de sexton prefekturerna, från Youzhou till Yunzhou (Datong), till Liao i utbyte mot khitanernas hjälp i Shi Jingtangs revolt (936).
  About 940. The Karakhanids, who turn to Islam under Satuq Bughra Khan, rule Kashgar, the Ili and Semirechye from Balasagun.: Omkring 940. Karakhaniderna, som övergår till islam under Satuq Bughra khan, styr Kashgar, Ili och Semiretje från Balasagun.
  Southern Tang conquers Min. Fuzhou goes its own way under Li Renda, and Quanzhou and Zhangzhou under Liu Congxiao.: Södra Tang erövrar Min. Fuzhou går sin egen väg under Li Renda, och Quanzhou och Zhangzhou under Liu Congxiao.
  Wuyue takes Fuzhou, defeating a Southern Tang army sent against Li Renda.: Wuyue tar Fuzhou och besegrar en armé från Södra Tang som har sänts mot Li Renda.
  Liu Congxiao rules Quanzhou and Zhangzhou as the autonomous Qingyuan circuit.: Liu Congxiao styr Quanzhou och Zhangzhou som den självstyrande Qingyuankretsen.
  Guo Wei founds the Later Zhou; Liu Chong, the brother of the last Later Han emperor, founds the Northern Han in Taiyuan.: Guo Wei grundar Senare Zhou; Liu Chong, bror till den siste kejsaren av Senare Han, grundar Norra Han i Taiyuan.
  Southern Tang conquers Chu; Southern Han takes the Chu prefectures in Guangxi.: Södra Tang erövrar Chu; Södra Han tar Chus prefekturer i Guangxi.
  Liu Yan and Zhou Xingfeng drive the Southern Tang out of Hunan (Wuping).: Liu Yan och Zhou Xingfeng driver ut Södra Tang ur Hunan (Wuping).
  Southern Tang cedes all its land north of the Yangtze to the Later Zhou after the Huainan campaigns.: Södra Tang avträder allt sitt land norr om Yangtze till Senare Zhou efter fälttågen i Huainan.
  Zhao Kuangyin takes the throne of the Later Zhou and founds the Song dynasty.: Zhao Kuangyin tar Senare Zhous tron och grundar Songdynastin.
  Song takes Jingnan and Hunan (Wuping).: Songdynastin tar Jingnan och Hunan (Wuping).
  Song conquers the Later Shu.: Songdynastin erövrar Senare Shu.
  Song conquers the Southern Han.: Songdynastin erövrar Södra Han.
  Song takes Jinling (Nanjing); the Southern Tang falls.: Songdynastin intar Jinling (Nanking); Södra Tang faller.
  Qian Chu of Wuyue and Chen Hongjin of Qingyuan surrender their lands to the Song.: Qian Chu av Wuyue och Chen Hongjin av Qingyuan överlämnar sina länder till Songdynastin.
  Song conquers the Northern Han, the last of the Ten Kingdoms; the Song–Liao war follows.: Songdynastin erövrar Norra Han, det sista av de tio rikena; kriget mellan Song och Liao följer.
  Hasan Bughra Khan of the Karakhanids takes Isfijab from the Samanids without a fight; Taraz follows.: Karakhaniden Hasan Bughra khan tar Isfijab från samaniderna utan strid; Taraz följer.
  Li Jiqian, the Tangut leader who has fought the Song since 982, takes Lingzhou.: Li Jiqian, den tangutiske ledare som har bekämpat Songdynastin sedan 982, intar Lingzhou.
  The Karakhanids conquer the Buddhist Kingdom of Khotan after a long war.: Karakhaniderna erövrar det buddhistiska kungariket Khotan efter ett långt krig.
  Li Yuanhao takes Ganzhou and ends the Ganzhou Uyghur Kingdom; the Tanguts hold the Hexi Corridor and the Alxa desert.: Li Yuanhao intar Ganzhou och gör slut på Uiguriska kungariket Ganzhou; tanguterna behärskar Hexikorridoren och Alxaöknen.
  Gusiluo, a descendant of the Tibetan emperors, makes Qingtang (Xining) the capital of the Tsongkha kingdom in Amdo.: Gusiluo, en ättling till de tibetanska kejsarna, gör Qingtang (Xining) till huvudstad i kungariket Tsongkha i Amdo.
  Western Xia takes Guazhou and Shazhou (Dunhuang); the Guiyi circuit ends.: Västra Xia tar Guazhou och Shazhou (Dunhuang); Guiyikretsen upphör.
  About 1050. The Kimek confederation on the Irtysh gives way to the Kipchaks, who spread over the steppe; the Kipchaks also displace the Oghuz on the lower Syr Darya.: Omkring 1050. Kimekförbundet vid Irtysj ger vika för kiptjakerna, som sprider sig över stäppen; kiptjakerna tränger också undan oguzerna vid nedre Syr-Darja.
  Wang Shao’s Xihe campaign brings Hezhou, Taozhou and Minzhou under the Song; Lanzhou is taken from Western Xia in 1081.: Wang Shaos fälttåg i Xihe för Hezhou, Taozhou och Minzhou under Songdynastin; Lanzhou tas från Västra Xia 1081.
  Song takes Xining and ends the Tsongkha kingdom.: Songdynastin intar Xining och gör slut på kungariket Tsongkha.
  Aguda of the Wanyan Jurchens proclaims the Jin dynasty after his victories over the Liao at Ningjiang and Chuhedian (1114) and takes Huanglong.: Aguda av wanyanjurchenerna utropar Jindynastin efter sina segrar över Liao vid Ningjiang och Chuhedian (1114) och intar Huanglong.
  Jin takes Liaoyang and the Liaodong peninsula.: Jin intar Liaoyang och Liaodonghalvön.
  Jin takes the Liao Supreme Capital.: Jin intar Liaos högsta huvudstad.
  Jin takes the Liao Central and Western capitals; the Song attack on the Southern Capital (Beijing) fails, and Jin takes it in December.: Jin intar Liaos centrala och västra huvudstäder; Songdynastins angrepp på den södra huvudstaden (Peking) misslyckas, och Jin intar den i december.
  Jin hands Yanjing (Beijing) and six prefectures to the Song for an annual payment.: Jin överlämnar Yanjing (Peking) och sex prefekturer till Songdynastin mot en årlig betalning.
  "Jin captures the last Liao emperor. The Mongolian steppe falls to tribal confederations: the Kereit on the Tuul and Orkhon, the Naimans in the west, the Merkits on the Selenga, the Tatars by Lake Hulun and the Mongols on the Onon and Kherlen, who form the Khamag Mongol (about 1130).": "Jin tillfångatar den siste Liaokejsaren. Den mongoliska stäppen tillfaller stamförbund: kereiterna vid Tuul och Orchon, naimanerna i väster, merkiterna vid Selenga, tatarerna vid Hulunsjön och mongolerna vid Onon och Kherlen, som bildar Khamag Mongol (omkring 1130)."
  Jin invades the Song and retakes Yanjing.: Jin invaderar Songriket och återtar Yanjing.
  Jin takes Kaifeng and carries off the Song emperors (the Jingkang incident); Hebei and Shanxi are in Jin hands. The Song court re-forms in the south.: Jin intar Kaifeng och för bort Songkejsarna (Jingkangincidenten); Hebei och Shanxi är i Jins händer. Songhovet bildas på nytt i söder.
  Jin takes Shandong and Henan.: Jin tar Shandong och Henan.
  Jin sets up the puppet state of Qi under Liu Yu to rule Henan and Shandong; Shaanxi is added after the Song defeat at Fuping (1130).: Jin upprättar marionettstaten Qi under Liu Yu för att styra Henan och Shandong; Shaanxi läggs till efter Songdynastins nederlag vid Fuping (1130).
  Jin takes the Xihe region, Xining and Tianshui from the Song.: Jin tar Xiheområdet, Xining och Tianshui från Songdynastin.
  Yelü Dashi, founder of the Qara Khitai, takes Balasagun; the Karakhanids of Kashgar and the Kingdom of Qocho become his vassals.: Yelü Dashi, grundaren av Qara Khitai, intar Balasagun; karakhaniderna i Kashgar och kungariket Qocho blir hans vasaller.
  Western Xia takes Xining from the Jin.: Västra Xia tar Xining från Jin.
  Jin abolishes the Qi state and rules its lands directly.: Jin avskaffar staten Qi och styr dess länder direkt.
  Under a peace agreed in 1138 the Jin hand Henan and Shaanxi back to the Song.: Enligt en fred som sluts 1138 lämnar Jin tillbaka Henan och Shaanxi till Songdynastin.
  The Jin break the peace and retake Henan and Shaanxi; the Treaty of Shaoxing (1142) fixes the border on the Huai River and the Dasan Pass.: Jin bryter freden och återtar Henan och Shaanxi; freden i Shaoxing (1142) fastställer gränsen vid Huaifloden och Dasanpasset.
  About 1152. The Khwarazmshah Atsiz takes Jend and the lower Syr Darya.: Omkring 1152. Khwarazmshahen Atsiz tar Jend och nedre Syr-Darja.
  Temüjin destroys the Tatars.: Temüjin krossar tatarerna.
  Temüjin defeats the Kereit and takes their lands.: Temüjin besegrar kereiterna och tar deras länder.
  Temüjin defeats the Naimans at Chakirmaut and the Merkits.: Temüjin besegrar naimanerna vid Chakirmaut samt merkiterna.
  "Jochi subdues the forest peoples: the Oirats, the Kyrgyz of the Yenisei and the Buryat and Tuvan tribes submit to the Mongols.": "Jochi underkuvar skogsfolken: oiraterna, kirgizerna vid Jenisej och de burjatiska och tuvinska stammarna underkastar sig mongolerna."
  The Khwarazmshah Muhammad II defeats the Qara Khitai and takes Otrar, Isfijab and Taraz.: Khwarazmshahen Muhammad II besegrar Qara Khitai och tar Otrar, Isfijab och Taraz.
  Kuchlug, the Naiman prince who has usurped the Qara Khitai throne, takes Kashgar and Khotan from the Karakhanids.: Kuchlug, den naimanfurste som har tillskansat sig Qara Khitais tron, tar Kashgar och Khotan från karakhaniderna.
  The Mongols take the Jin Central Capital (Beijing); the Jin court has moved to Kaifeng. The north of the Jin realm, from Liaoxi to Datong, is in Mongol hands.: Mongolerna intar Jins centrala huvudstad (Peking); Jinhovet har flyttat till Kaifeng. Den norra delen av Jinriket, från Liaoxi till Datong, är i mongoliska händer.
  Puxian Wannu, a Jin general, founds Eastern Xia in eastern Manchuria and the Ussuri country.: Puxian Wannu, en general i Jins tjänst, grundar Östra Xia i östra Manchuriet och Ussuriområdet.
  The Mongols take Otrar, Jend and the cities of the Syr Darya; Muqali’s campaigns take Hebei and Shanxi from the Jin.: Mongolerna intar Otrar, Jend och städerna vid Syr-Darja; genom Muqalis fälttåg tas Hebei och Shanxi från Jin.
  About 1222. The Mongols conquer the Kipchak steppe east of the Urals.: Omkring 1222. Mongolerna erövrar kiptjakstäppen öster om Ural.
  "Genghis Khan’s last campaign takes the Hexi Corridor from Western Xia: Ganzhou, Suzhou and Liangzhou fall in the summer.": "Djingis khans sista fälttåg tar Hexikorridoren från Västra Xia: Ganzhou, Suzhou och Liangzhou faller under sommaren."
  Li Quan, besieged in Yidu since 1226, surrenders to the Mongols and is made governor of Shandong.: Li Quan, som har varit belägrad i Yidu sedan 1226, kapitulerar för mongolerna och utnämns till ståthållare i Shandong.
  Western Xia surrenders and is destroyed, days after Genghis Khan’s death.: Västra Xia kapitulerar och förintas, några dagar efter Djingis khans död.
  The Mongols take Fengxiang and Guanzhong.: Mongolerna tar Fengxiang och Guanzhong.
  The Mongols take Nanjing (Yanji) and end Eastern Xia.: Mongolerna intar Nanjing (Yanji) och gör slut på Östra Xia.
  The last Jin emperor dies at Caizhou; the Mongols hold all of the former Jin realm.: Den siste Jinkejsaren dör i Caizhou; mongolerna behärskar hela det forna Jinriket.
  Batu’s western campaign subdues the Bashkirs and the forest-steppe of the Tobol and the Tura.: Batus fälttåg västerut underkuvar basjkirerna och skogsstäppen vid Tobol och Tura.
  The Mongols take Hanzhong and sack Chengdu.: Mongolerna intar Hanzhong och plundrar Chengdu.
  "Doorda Darkhan’s expedition: the Mongols raid central Tibet and take Amdo.": "Doorda Darkhans expedition: mongolerna gör räder in i centrala Tibet och tar Amdo."
  The Mongols hold the Sichuan basin; the Song keep Chongqing and the east.: Mongolerna behärskar Sichuanbäckenet; Songdynastin behåller Chongqing och östra delen.
  Batu’s Ulus of Jochi (the Golden Horde) takes over the steppe from the Irtysh to the Volga.: Batus Jochis ulus (Gyllene horden) tar över stäppen från Irtysj till Volga.
  Kublai takes Dali; the Mongols end the Dali Kingdom and the chiefdoms of Kham submit to them.: Khubilai intar Dali; mongolerna gör slut på kungariket Dali, och hövdingadömena i Kham underkastar sig dem.
  About 1260. Alghu makes the Ulus of Chagatai independent of the Great Khan; it holds the Ili, Semirechye and the Tarim oases.: Omkring 1260. Alghu gör Tjagatais ulus oberoende av storkhanen; det behärskar Ili, Semiretje och oaserna i Tarim.
  Kublai is proclaimed Great Khan at Kaiping (Shangdu); his brother Ariq Böke holds Karakorum and Mongolia. Kublai’s realm is the Yuan dynasty (named in 1271).: Khubilai utropas till storkhan i Kaiping (Shangdu); hans bror Ariq Böke behärskar Karakorum och Mongoliet. Khubilais rike är Yuandynastin (som får sitt namn 1271).
  Ariq Böke surrenders to Kublai; Mongolia comes under the Yuan.: Ariq Böke kapitulerar för Khubilai; Mongoliet kommer under Yuandynastin.
  Kaidu, grandson of Ögedei, rules Dzungaria and dominates the Chagatai Khanate; the western Mongol khanates no longer obey the Yuan.: Kaidu, Ögedeis sonson, härskar över Dzungariet och dominerar Tjagataikhanatet; de västra mongoliska khanaten lyder inte längre Yuandynastin.
  Xiangyang surrenders to the Yuan after a five-year siege.: Xiangyang kapitulerar för Yuandynastin efter en femårig belägring.
  The Yuan general Bayan has crossed the Yangtze; Jiankang (Nanjing) and the land south of the river fall.: Yuangeneralen Bayan har gått över Yangtze; Jiankang (Nanking) och landet söder om floden faller.
  The Song court at Lin’an (Hangzhou) surrenders to Bayan; Song loyalists fight on in the south.: Songhovet i Lin’an (Hangzhou) kapitulerar för Bayan; Songlojalister fortsätter striden i söder.
  Yangzhou and Luzhou (Hefei), the last Song strongholds between the Huai and the Yangtze, surrender.: Yangzhou och Luzhou (Hefei), Songdynastins sista fästen mellan Huai och Yangtze, kapitulerar.
  The Yuan take Fujian and Guangxi.: Yuandynastin tar Fujian och Guangxi.
  Chongqing falls to the Yuan.: Chongqing faller i Yuandynastins händer.
  The Yuan bring the chiefdoms of Guizhou under their administration.: Yuandynastin för in hövdingadömena i Guizhou under sin förvaltning.
  "Battle of Yamen: the last Song fleet is destroyed and the boy emperor drowned.": "Slaget vid Yamen: den sista Songflottan förintas och barnkejsaren drunknar."
  The Uyghur ruler of Qocho withdraws to Gansu before Kaidu’s armies; Turfan passes to the Chagatai Khanate, Hami stays with the Yuan.: Den uiguriske härskaren i Qocho drar sig tillbaka till Gansu undan Kaidus arméer; Turfan övergår till Tjagataikhanatet, medan Hami stannar hos Yuandynastin.
  "The Chagatai Khanate splits: the eastern khans rule Moghulistan, from the Ili to the Tarim and Turfan, while Transoxiana is run by Turkic emirs.": "Tjagataikhanatet delas: de östra khanerna styr Moghulistan, från Ili till Tarim och Turfan, medan Transoxanien styrs av turkiska emirer."
  Ming Yuzhen, a Red Turban leader who has held Chongqing since 1357, proclaims the Xia dynasty and rules Sichuan.: Ming Yuzhen, en ledare för de röda turbanerna som har behärskat Chongqing sedan 1357, utropar Xiadynastin och styr Sichuan.
  Zhu Yuanzhang proclaims the Ming dynasty at Nanjing; his armies hold the Yangtze valley and take Fujian, Guangdong and Guangxi in the spring.: Zhu Yuanzhang utropar Mingdynastin i Nanking; hans arméer behärskar Yangtzedalen och tar Fujian, Guangdong och Guangxi under våren.
  Ming troops take Dadu (Beijing); the Yuan court flees to Mongolia, where it rules as the Northern Yuan.: Mingtrupper intar Dadu (Peking); Yuanhovet flyr till Mongoliet, där det härskar som Norra Yuan.
  Ming takes Shanxi, Shaanxi and Gansu; Hainan submits.: Mingdynastin tar Shanxi, Shaanxi och Gansu; Hainan underkastar sig.
  About 1370. The Ming garrison Dongsheng in the Ordos.: Omkring 1370. Mingdynastin förlägger en garnison i Dongsheng i Ordos.
  Ming conquers the Xia state in Sichuan and takes Xining; the Yuan governor of Liaodong surrenders.: Mingdynastin erövrar Xiastaten i Sichuan och tar Xining; Yuandynastins ståthållare i Liaodong kapitulerar.
  Ming extends the Great Wall line to Jiayu Pass and holds the Hexi Corridor; Dunhuang is ruled by Mongol princes as a Ming guard. In Amdo and Kham the Tibetan chiefs take Ming titles.: Mingdynastin förlänger Kinesiska murens linje till Jiayupasset och behärskar Hexikorridoren; Dunhuang styrs av mongoliska furstar som ett vaktdistrikt under Mingdynastin. I Amdo och Kham tar de tibetanska hövdingarna emot titlar från Mingdynastin.
  About 1376. Timur takes Sayram and Yasi (Turkistan), where he later builds the mausoleum of Khoja Ahmad Yasawi.: Omkring 1376. Timur tar Sayram och Yasi (Turkistan), där han senare bygger Khoja Ahmad Yasawis mausoleum.
  About 1380. The Chagatayid prince Gunashiri rules Hami (Kara Del); it becomes a Ming guard in 1406.: Omkring 1380. Tjagataidfursten Gunashiri härskar över Hami (Kara Del); det blir ett vaktdistrikt under Mingdynastin 1406.
  Ming conquers Yunnan from the Yuan Prince of Liang and brings Guizhou under its rule.: Mingdynastin erövrar Yunnan från Yuandynastins prins av Liang och för in Guizhou under sitt styre.
  Naghachu, the Northern Yuan commander in Manchuria, surrenders to the Ming. Ming holds Liaoxi and garrisons Daning in the Rehe hills; the Jurchen tribes of Jilin and Heilongjiang take Ming titles but rule themselves.: Naghachu, Norra Yuans befälhavare i Manchuriet, kapitulerar för Mingdynastin. Ming behärskar Liaoxi och förlägger en garnison i Daning i Rehes bergstrakter; jurchenstammarna i Jilin och Heilongjiang tar emot titlar från Mingdynastin men styr sig själva.
  About 1399. The Oirats of western Mongolia break away from the Northern Yuan khans.: Omkring 1399. Oiraterna i västra Mongoliet bryter sig loss från Norra Yuans khaner.
  The Yongle Emperor withdraws the garrisons of Daning and Dongsheng; the Rehe hills pass to the Uriankhai Mongols, Ming vassals.: Yonglekejsaren drar tillbaka garnisonerna i Daning och Dongsheng; Rehes bergstrakter övergår till uriankhaimongolerna, Mingdynastins vasaller.
  Abu’l-Khayr, a Shaybanid, is proclaimed khan at Chimgi-Tura (Tyumen) and builds an Uzbek khanate on the steppe east of the Urals.: Abu’l-Khayr, en shaybanid, utropas till khan i Chimgi-Tura (Tiumen) och bygger upp ett uzbekiskt khanat på stäppen öster om Ural.
  Abu’l-Khayr takes Sygnak, Sauran, Yasi and the towns of the Syr Darya from the Timurids.: Abu’l-Khayr tar Sygnak, Sauran, Yasi och städerna vid Syr-Darja från timuriderna.
  "About 1465. Kerey and Janibek lead their followers from Abu’l-Khayr’s khanate to the Chu valley: the Kazakh Khanate.": "Omkring 1465. Kerey och Janibek leder sina anhängare från Abu’l-Khayrs khanat till Tjudalen: Kazakkhanatet."
  Abu’l-Khayr dies. The Kazakhs take most of the steppe and Sygnak; Ibak, a Shaybanid, rules the Tyumen Khanate.: Abu’l-Khayr dör. Kazakerna tar större delen av stäppen och Sygnak; Ibak, en shaybanid, härskar över Tiumenkhanatet.
  Yunus Khan’s son Ahmad (Ala) of Turfan takes Hami and its Ming-appointed ruler.: Yunus khans son Ahmad (Ala) av Turfan intar Hami och tillfångatar dess härskare, som Mingdynastin har tillsatt.
  Hanshen, a prince of the Hami house, retakes Hami with Ming backing.: Hanshen, en prins av Hamis furstehus, återtar Hami med stöd från Mingdynastin.
  Ahmad of Turfan kills Hanshen and takes Hami again.: Ahmad av Turfan dödar Hanshen och intar Hami på nytt.
  After a Ming trade embargo Turfan gives Hami back to its Ming-appointed ruler.: Efter ett handelsembargo från Mingdynastin lämnar Turfan tillbaka Hami till den härskare som Mingdynastin har tillsatt.
  Muhammad Shaybani’s Uzbeks, now masters of Transoxiana, hold Yasi and Sayram against the Kazakhs.: Muhammad Shaybanis uzbeker, som nu är herrar över Transoxanien, håller Yasi och Sayram mot kazakerna.
  Turfan takes Hami from its Ming-appointed ruler for good; the Ming lose the guards west of Jiayu Pass in the following years.: Turfan tar för gott Hami från den härskare som Mingdynastin har tillsatt; under de följande åren förlorar Mingdynastin vaktdistrikten väster om Jiayupasset.
  About 1513. Under Kasym Khan the Kazakhs hold Semirechye and the steppe to the Ural river.: Omkring 1513. Under Kasym khan behärskar kazakerna Semiretje och stäppen fram till Uralfloden.
  Sultan Said Khan takes Kashgar and Yarkand from Mirza Abu Bakr Dughlat and founds the Yarkent Khanate; the Moghul khans of Turfan rule the east.: Sultan Said khan tar Kashgar och Yarkand från Mirza Abu Bakr Dughlat och grundar Yarkentkhanatet; moghulkhanerna i Turfan styr den östra delen.
  About 1520. The Kazakhs under Kasym Khan hold the steppe of the Tobol and the Turgai.: Omkring 1520. Kazakerna under Kasym khan behärskar stäppen vid Tobol och Turgaj.
  The Ming close Jiayu Pass and give up Dunhuang, which falls to Turfan and the Mongols.: Mingdynastin stänger Jiayupasset och överger Dunhuang, som faller i händerna på Turfan och mongolerna.
  About 1552. The Khalkha Mongols push the Oirats west; the Khotogoid khans rule the north-west of Mongolia and Tuva.: Omkring 1552. Khalkhamongolerna tränger oiraterna västerut; khotogoidkhanerna härskar över nordvästra Mongoliet och Tuva.
  The Ming allow the Portuguese to settle at Macau for an annual rent.: Mingdynastin tillåter portugiserna att bosätta sig i Macao mot en årlig hyra.
  About 1560. Mongols of the Tümed under Altan Khan’s relatives settle around Kokonor.: Omkring 1560. Tümedmongoler under Altan khans släktingar bosätter sig kring Kokonor.
  After Yermak’s campaign (1582–1585) the Russians found Tyumen (1586) and Tobolsk (1587) on the lands of the Khanate of Sibir.: Efter Jermaks fälttåg (1582–1585) grundar ryssarna Tiumen (1586) och Tobolsk (1587) på Khanatet Sibirs områden.
  The Russians take Pelym and found Berezov (1593) and Surgut (1594) among the Khanty and Mansi.: Ryssarna intar Pelym och grundar Berjozov (1593) och Surgut (1594) bland chanterna och mansierna.
  The Russians found Tara on the Irtysh.: Ryssarna grundar Tara vid Irtysj.
  The Russians found Obdorsk on the lower Ob; Mangazeya follows in 1601.: Ryssarna grundar Obdorsk vid nedre Ob; Mangazeja följer 1601.
  The Russians found Narym; Tomsk follows in 1604.: Ryssarna grundar Narym; Tomsk följer 1604.
  Kuchum Khan is defeated on the Ob (Battle of Irmen) and flees to the Nogais; the Russians take the forest-steppe of the Tobol and the Baraba. The southern steppe passes to the Kazakhs. The Kazakhs also take Tashkent, Turkistan and Sayram from the Shaybanids.: Kutjum khan besegras vid Ob (slaget vid Irmen) och flyr till nogajerna; ryssarna tar skogsstäppen vid Tobol och Baraba. Den södra stäppen övergår till kazakerna. Kazakerna tar också Tasjkent, Turkistan och Sayram från shaybaniderna.
  Nurhaci, chief of the Jianzhou Jurchens, proclaims the Later Jin at Hetu Ala.: Nurhaci, hövding över jianzhoujurchenerna, utropar Senare Jin i Hetu Ala.
  The Russians found Kuznetsk.: Ryssarna grundar Kuznetsk.
  The Russians found Yeniseysk (Krasnoyarsk follows in 1628).: Ryssarna grundar Jenisejsk (Krasnojarsk följer 1628).
  Later Jin defeats the Ming at Sarhu and destroys the Yehe, the last free Haixi Jurchen tribe.: Senare Jin besegrar Mingdynastin vid Sarhu och krossar yehe, den sista fria stammen bland haixijurchenerna.
  Later Jin takes Shenyang and Liaoyang and all of Liaodong east of the Liao River.: Senare Jin intar Shenyang och Liaoyang och hela Liaodong öster om Liaofloden.
  The Dutch East India Company, driven from Penghu by the Ming, builds Fort Zeelandia at Tayouan (Tainan).: Nederländska Ostindiska kompaniet, som har fördrivits från Penghu av Mingdynastin, bygger Fort Zeelandia vid Tayouan (Tainan).
  The Spanish found San Salvador at Keelung and Santo Domingo at Tamsui (1628).: Spanjorerna grundar San Salvador vid Keelung och Santo Domingo vid Tamsui (1628).
  The Russians found Ilimsk and Kirensk on the way to the Lena.: Ryssarna grundar Ilimsk och Kirensk på vägen till Lena.
  Ladakh conquers the kingdom of Guge.: Ladakh erövrar kungariket Guge.
  The Cossack Pyotr Beketov founds the Lena fort (Yakutsk).: Kosacken Pjotr Beketov grundar Lenafästet (Jakutsk).
  Hong Taiji’s campaign drives Ligdan Khan of the Chahar west; the eastern Mongol banners, allied with the Later Jin since the 1620s, come under its rule.: Hong Taijis fälttåg driver chaharernas Ligdan khan västerut; de östmongoliska fänikorna, som har varit allierade med Senare Jin sedan 1620-talet, kommer under dess styre.
  Later Jin takes Lüshun (Port Arthur), the last Ming base on the Liaodong peninsula.: Senare Jin intar Lüshun (Port Arthur), Mingdynastins sista bas på Liaodonghalvön.
  Erdeni Batur founds the Dzungar Khanate in the Ili valley and Dzungaria.: Erdeni Batur grundar Dzungarkhanatet i Ilidalen och Dzungariet.
  The Kalmyks drive the Nogais west across the Ural river and hold the Caspian shore to Mangyshlak; the Kazakhs of the Junior Zhuz take the steppe of the Emba and the Ilek.: Kalmuckerna driver nogajerna västerut över Uralfloden och behärskar Kaspiska havets kust ända till Mangysjlak; kazakerna i Yngre zhuzen tar stäppen vid Emba och Ilek.
  "Ligdan Khan’s son surrenders to the Later Jin: the Northern Yuan ends and the Inner Mongols submit to the Manchus. The Khalkha khans in Outer Mongolia stay independent.": "Ligdan khans son kapitulerar för Senare Jin: Norra Yuan upphör och de inre mongolerna underkastar sig manchuerna. Khalkhakhanerna i Yttre Mongoliet förblir självständiga."
  Dutch campaigns bring the plains villages of the south-west under the Company.: Nederländska fälttåg för slättbyarna i sydväst under kompaniets styre.
  Güshi Khan of the Khoshut defeats the Khalkha Tsogt Taiji at Kokonor; the Khoshut rule Qinghai.: Khoshuternas Güshi khan besegrar khalkhafursten Tsogt Taiji vid Kokonor; khoshuterna härskar över Qinghai.
  About 1640. The Dzungars dominate the upper Irtysh.: Omkring 1640. Dzungarerna dominerar övre Irtysj.
  Güshi Khan defeats Donyo Dorje, the Bon king of Beri, and subdues Kham; in 1642 he takes Shigatse and makes the Fifth Dalai Lama ruler of Tibet.: Güshi khan besegrar Donyo Dorje, bonkungen av Beri, och underkuvar Kham; 1642 intar han Shigatse och gör den femte dalai lama till härskare över Tibet.
  The Qing take Jinzhou after the Battle of Songjin; the Ming hold only Ningyuan and Shanhai Pass beyond the Great Wall.: Qingdynastin intar Jinzhou efter slaget vid Songjin; Mingdynastin behåller bara Ningyuan och Shanhaipasset utanför Kinesiska muren.
  The Dutch take Keelung from the Spanish; their campaigns of 1642–1645 extend Company rule up the west coast.: Nederländarna tar Keelung från spanjorerna; deras fälttåg 1642–1645 utsträcker kompaniets styre norrut längs västkusten.
  Qing expeditions bring the Jurchen and Daur peoples of the Amur and Ussuri under tribute.: Qingexpeditioner gör jurchen- och daurfolken vid Amur och Ussuri tributskyldiga.
  Li Zicheng proclaims the Shun dynasty at Xi’an; he holds Shaanxi, Gansu and Henan.: Li Zicheng utropar Shundynastin i Xi’an; han behärskar Shaanxi, Gansu och Henan.
  Li Zicheng takes Beijing; the Chongzhen Emperor hangs himself. Shun officials take over Shanxi, Hebei and Shandong.: Li Zicheng intar Peking; Chongzhenkejsaren hänger sig. Shunämbetsmän tar över Shanxi, Hebei och Shandong.
  After the Battle of Shanhai Pass the Qing enter Beijing; they take Hebei and Shandong in the summer and Shanxi in the autumn.: Efter slaget vid Shanhaipasset tågar Qingtrupperna in i Peking; de tar Hebei och Shandong under sommaren och Shanxi under hösten.
  "The Ming Prince of Fu is enthroned at Nanjing as the Hongguang Emperor: the Southern Ming.": "Mingprinsen av Fu tronsätts i Nanking som Hongguangkejsaren: Södra Ming."
  Zhang Xianzhong proclaims the Great Xi at Chengdu.: Zhang Xianzhong utropar Stora Xi i Chengdu.
  The Qing take Tongguan and Xi’an; the Shun state collapses.: Qingdynastin intar Tongguan och Xi’an; Shunstaten bryter samman.
  Yangzhou has fallen (20 May); the Qing take Nanjing.: Yangzhou har fallit (20 maj); Qingdynastin intar Nanking.
  The Qing take Hangzhou and Shanghai, and Jiangxi and Hubei by the end of the year.: Qingdynastin intar Hangzhou och Shanghai, och före årets slut Jiangxi och Hubei.
  The Longwu Emperor is captured at Tingzhou; the Qing take Fujian. Zheng Chenggong holds out on Kinmen and Xiamen.: Longwukejsaren tillfångatas i Tingzhou; Qingdynastin tar Fujian. Zheng Chenggong håller ut på Kinmen och i Xiamen.
  The Russians found Okhotsk on the Pacific.: Ryssarna grundar Ochotsk vid Stilla havet.
  Zhang Xianzhong is killed by the Qing; the Great Xi collapses and the Qing take Chengdu and Chongqing.: Zhang Xianzhong dödas av Qingstyrkorna; Stora Xi bryter samman och Qingdynastin intar Chengdu och Chongqing.
  The Qing take Guangzhou and Hunan.: Qingdynastin tar Kanton och Hunan.
  Jin Shenghuan, the Qing commander in Jiangxi, goes over to the Yongli Emperor; Li Chengdong follows with Guangdong in May, and He Tengjiao’s Ming armies retake most of Hunan.: Jin Shenghuan, Qingdynastins befälhavare i Jiangxi, går över till Yonglikejsaren; Li Chengdong följer med Guangdong i maj, och He Tengjiaos Mingarméer återtar större delen av Hunan.
  The Qing retake Nanchang (February) and Hunan, where He Tengjiao is captured and killed.: Qingdynastin återtar Nanchang (februari) och Hunan, där He Tengjiao tillfångatas och dödas.
  About 1650. Russian forts and winter quarters on the Okhotsk coast and the Anadyr; the Koryaks and Chukchi remain unsubdued.: Omkring 1650. Ryska fästen och vinterläger vid Ochotskkusten och Anadyr; korjakerna och tjuktjerna förblir okuvade.
  Shang Kexi and Geng Jimao retake Guangzhou for the Qing after a ten-month siege.: Shang Kexi och Geng Jimao återtar Kanton åt Qingdynastin efter en tio månader lång belägring.
  The Qing take Guilin.: Qingdynastin intar Guilin.
  The Russians found Nerchinsk in Transbaikalia.: Ryssarna grundar Nertjinsk i Transbajkalien.
  Three Qing armies converge on Guizhou and take Guiyang.: Tre Qingarméer sammanstrålar i Guizhou och intar Guiyang.
  The Qing take Kunming; the Yongli Emperor flees to Burma.: Qingdynastin intar Kunming; Yonglikejsaren flyr till Burma.
  The Russians found Irkutsk; the Buryats west of Lake Baikal pay tribute.: Ryssarna grundar Irkutsk; burjaterna väster om Bajkalsjön betalar tribut.
  Zheng Chenggong (Koxinga) lands on Taiwan and takes Penghu.: Zheng Chenggong (Koxinga) landstiger på Taiwan och tar Penghu.
  "The Dutch surrender Fort Zeelandia to Zheng Chenggong: the Kingdom of Tungning.": "Nederländarna överlämnar Fort Zeelandia till Zheng Chenggong: kungariket Tungning."
  The Yongli Emperor, handed over by Burma, is executed in Kunming; Zheng Chenggong’s heirs hold Kinmen and Xiamen for Tungning.: Yonglikejsaren, som har utlämnats av Burma, avrättas i Kunming; Zheng Chenggongs arvingar håller Kinmen och Xiamen åt Tungning.
  The Qing take Xiamen and Kinmen from the Zheng.: Qingdynastin tar Xiamen och Kinmen från familjen Zheng.
  The Russians found Verkhneudinsk (Ulan-Ude) and Selenginsk on the Selenga.: Ryssarna grundar Verchneudinsk (Ulan-Ude) och Selenginsk vid Selenga.
  The Dzungars defeat the Khotogoid khans and take Tuva; the Yenisei Kyrgyz become their vassals.: Dzungarerna besegrar khotogoidkhanerna och tar Tuva; jenisejkirgizerna blir deras vasaller.
  Zheng Jing joins the Revolt of the Three Feudatories and takes Xiamen and Kinmen.: Zheng Jing ansluter sig till de tre feodalfurstarnas revolt och tar Xiamen och Kinmen.
  About 1680. Galdan of the Dzungars conquers the Yarkent Khanate, Turfan and Hami and rules the Tarim through the Afaqi Khojas; the Dzungars also take Moghulistan’s lands in Semirechye.: Omkring 1680. Dzungarernas Galdan erövrar Yarkentkhanatet, Turfan och Hami och styr Tarim genom de afaqiska khojorna; dzungarerna tar också Moghulistans länder i Semiretje.
  The Qing drive Zheng Jing back to Taiwan.: Qingdynastin driver tillbaka Zheng Jing till Taiwan.
  Shi Lang defeats the Zheng fleet at Penghu.: Shi Lang besegrar Zhengflottan vid Penghu.
  Zheng Keshuang surrenders; the Qing annex western Taiwan.: Zheng Keshuang kapitulerar; Qingdynastin annekterar västra Taiwan.
  "Treaty of Tingmosgang, after the Tibet–Ladakh–Mughal war: Ngari passes to Tibet; the uninhabited Aksai Chin plateau stays with Ladakh.": "Fördraget i Tingmosgang, efter kriget mellan Tibet, Ladakh och Mogulriket: Ngari övergår till Tibet; den obebodda Aksai Chin-platån stannar hos Ladakh."
  At Dolon Nor the Khalkha khans, driven from their lands by Galdan, submit to the Kangxi Emperor.: I Dolon Nor underkastar sig khalkhakhanerna Kangxikejsaren, sedan Galdan har fördrivit dem från deras länder.
  Hami submits to the Qing.: Hami underkastar sig Qingdynastin.
  Vladimir Atlasov conquers Kamchatka for Russia; Itelmen risings continue until 1731.: Vladimir Atlasov erövrar Kamtjatka åt Ryssland; itelmenernas resningar fortsätter fram till 1731.
  The Dzungars have carried the Yenisei Kyrgyz off to the Ili (1703); the Russians found the Abakan fort in the Minusinsk basin.: Dzungarerna har fört bort jenisejkirgizerna till Ili (1703); ryssarna grundar fästet Abakan i Minusinskbäckenet.
  In the war with the Dzungars the Qing occupy Dunhuang and garrison Turfan.: I kriget mot dzungarerna besätter Qingdynastin Dunhuang och förlägger en garnison i Turfan.
  The Russians found Biysk on the upper Ob; the Altai foothills come under Russian rule.: Ryssarna grundar Bijsk vid övre Ob; Altajs förberg kommer under ryskt styre.
  A Qing army enters Lhasa and expels the Dzungars (who have held it since 1717); Tibet becomes a Qing protectorate, with Chamdo under the Lhasa government.: En Qingarmé tågar in i Lhasa och fördriver dzungarerna (som har behärskat staden sedan 1717); Tibet blir ett Qingprotektorat, med Chamdo under regeringen i Lhasa.
  "The Aqtaban Shubyryndy: the Dzungars overrun the Kazakh south and take Taraz, Turkistan and Sayram.": "Aqtaban Shubyryndy: dzungarerna sveper över de kazakiska områdena i söder och tar Taraz, Turkistan och Sayram."
  The Qing crush Lobzang Danjin’s revolt and annex Kokonor (Qinghai).: Qingdynastin slår ned Lobzang Danjins revolt och annekterar Kokonor (Qinghai).
  The Qing put eastern Kham (Batang, Litang) under Sichuan; the border with Tibet is fixed at Bum La (1727).: Qingdynastin lägger östra Kham (Batang, Litang) under Sichuan; gränsen mot Tibet fastställs vid Bum La (1727).
  The Qing take Ghulja and destroy the Dzungar state; Amursana’s revolt and its suppression follow until 1757.: Qingdynastin intar Ghulja och krossar dzungarstaten; därefter följer Amursanas revolt, som inte slås ned förrän 1757.
  The Altai Oirats and Teleuts submit to Russia.: Altajoiraterna och teleuterna underkastar sig Ryssland.
  With the Dzungars gone, the Kazakhs return to Semirechye, the upper Irtysh and the Talas.: När dzungarerna är borta återvänder kazakerna till Semiretje, övre Irtysj och Talas.
  The Qing defeat the Khoja brothers and annex Kashgaria (Altishahr).: Qingdynastin besegrar khojabröderna och annekterar Kashgarien (Altishahr).
  Most of the Kalmyks leave the Volga for Dzungaria; the steppe between the Volga and the Ural comes under direct Russian rule, and Adai Kazakhs move onto Mangyshlak.: De flesta kalmuckerna lämnar Volga för Dzungariet; stäppen mellan Volga och Ural kommer under direkt ryskt styre, och adaikazaker flyttar in på Mangysjlak.
  The Chukchi agree to pay tribute after decades of war with Russia.: Tjuktjerna går med på att betala tribut efter årtionden av krig mot Ryssland.
  The Qing set up the Kavalan subprefecture in Yilan.: Qingdynastin upprättar underprefekturen Kavalan i Yilan.
  Kokand takes Turkistan and the Syr Darya towns from the Kazakhs, and in the 1820s the Talas valley.: Kokand tar Turkistan och städerna vid Syr-Darja från kazakerna, och på 1820-talet Talasdalen.
  Kokand builds the fort of Ak-Mechet on the lower Syr Darya.: Kokand bygger fästet Ak-Metjet vid nedre Syr-Darja.
  Russia abolishes the khanship of the Middle Zhuz; the northern and central steppe is ruled through Russian districts.: Ryssland avskaffar khanvärdigheten i Mellersta zhuzen; den norra och centrala stäppen styrs genom ryska distrikt.
  Russia abolishes the khanship of the Junior Zhuz.: Ryssland avskaffar khanvärdigheten i Yngre zhuzen.
  Kokand builds forts at Aulie-Ata and in the Chu valley.: Kokand bygger fästen vid Aulie-Ata och i Tjudalen.
  Zorawar Singh, general of the Dogra ruler Gulab Singh, conquers Ladakh; Aksai Chin is claimed with it.: Zorawar Singh, general hos dograhärskaren Gulab Singh, erövrar Ladakh; anspråket på Aksai Chin följer med.
  "Treaty of Nanking, after the First Opium War: the Qing cede Hong Kong Island to Britain.": "Freden i Nanking, efter första opiumkriget: Qingdynastin avträder Hongkongön till Storbritannien."
  Russia founds the Novopetrovsk fort (Fort-Shevchenko) on Mangyshlak.: Ryssland grundar fästet Novopetrovsk (Fort-Sjevtjenko) på Mangysjlak.
  The Senior Zhuz accepts Russian rule; the Russians found Kopal (1847) and Verny (Almaty, 1854).: Äldre zhuzen godtar ryskt styre; ryssarna grundar Kopal (1847) och Vernyj (Almaty, 1854).
  Russian troops take Ak-Mechet from Kokand.: Ryska trupper tar Ak-Metjet från Kokand.
  "Treaty of Aigun: the Qing cede the left bank of the Amur to Russia.": "Fördraget i Aigun: Qingdynastin avträder Amurs vänstra strand till Ryssland."
  "Convention of Peking: the Qing cede Kowloon to Britain.": "Pekingkonventionen: Qingdynastin avträder Kowloon till Storbritannien."
  "Treaty of Peking: the Qing cede the land east of the Ussuri (Primorye) to Russia.": "Fördraget i Peking: Qingdynastin avträder landet öster om Ussuri (Primorje) till Ryssland."
  Russia takes Aulie-Ata and Turkistan (12 June).: Ryssland tar Aulie-Ata och Turkistan (12 juni).
  Russia takes Chimkent; the Kazakh steppe is under Russian rule.: Ryssland intar Tjimkent; den kazakiska stäppen står under ryskt styre.
  Yakub Beg, a Kokandi commander, takes Kashgar in the Dungan and Uyghur revolt against the Qing; by 1867 he rules the Tarim (Yettishar).: Yakub Beg, en befälhavare från Kokand, intar Kashgar under dunganernas och uigurernas revolt mot Qingdynastin; 1867 härskar han över Tarim (Yettishar).
  Yakub Beg takes Turfan and Ürümqi from the Dungan rebels.: Yakub Beg tar Turfan och Ürümqi från de dunganska rebellerna.
  Russia occupies the Ili valley, ending the Taranchi sultanate of Ghulja.: Ryssland ockuperar Ilidalen och gör slut på tarantjisultanatet i Ghulja.
  After the Japanese expedition of 1874 the Qing open the mountains and the east coast of Taiwan to settlement and administration.: Efter den japanska expeditionen 1874 öppnar Qingdynastin bergen och östkusten på Taiwan för bosättning och förvaltning.
  Zuo Zongtang’s army takes Turfan; Yakub Beg dies.: Zuo Zongtangs armé intar Turfan; Yakub Beg dör.
  The Qing take Khotan, completing the reconquest of the Tarim.: Qingdynastin intar Khotan och fullbordar återerövringen av Tarim.
  Russia returns the Ili valley to the Qing under the Treaty of Saint Petersburg (1881).: Ryssland återlämnar Ilidalen till Qingdynastin enligt fördraget i Sankt Petersburg (1881).
  "Treaty of Shimonoseki, after the First Sino-Japanese War: the Qing cede Taiwan and Penghu to Japan.": "Freden i Shimonoseki, efter första kinesisk-japanska kriget: Qingdynastin avträder Taiwan och Penghu till Japan."
  Germany leases Kiautschou Bay for 99 years.: Tyskland arrenderar Kiautschoubukten på 99 år.
  Russia leases the Kwantung peninsula, with Port Arthur and Dalian.: Ryssland arrenderar Kwantunghalvön med Port Arthur och Dalian.
  France leases Guangzhouwan.: Frankrike arrenderar Guangzhouwan.
  Britain leases the New Territories of Hong Kong for 99 years, and Weihaiwei.: Storbritannien arrenderar Nya territorierna i Hongkong på 99 år, samt Weihaiwei.
  "Treaty of Portsmouth, after the Russo-Japanese War: Russia transfers the Kwantung lease to Japan.": "Freden i Portsmouth, efter rysk-japanska kriget: Ryssland överlåter arrendet av Kwantung till Japan."
  Zhao Erfeng’s troops take Chamdo; a Qing army enters Lhasa (12 February) and the Thirteenth Dalai Lama flees to India.: Zhao Erfengs trupper intar Chamdo; en Qingarmé tågar in i Lhasa (12 februari) och den trettonde dalai lama flyr till Indien.
  "The Bogd Khan is enthroned in Urga: Outer Mongolia declares independence from the Qing. Most of the Tuvan banners also accept the Bogd Khan.": "Bogd khan tronsätts i Urga: Yttre Mongoliet förklarar sig självständigt från Qingdynastin. De flesta tuvinska fänikorna erkänner också Bogd khan."
  Hulunbuir (Barga) declares independence and joins the Mongolian state.: Hulunbuir (Barga) förklarar sig självständigt och ansluter sig till den mongoliska staten.
  The last Qing emperor abdicates; the Republic of China claims the whole Qing realm.: Den siste Qingkejsaren abdikerar; Republiken Kina gör anspråk på hela Qingriket.
  The Chinese garrison in Lhasa agrees to leave Tibet; the last troops go in January 1913 and the Dalai Lama proclaims Tibet’s independence.: Den kinesiska garnisonen i Lhasa går med på att lämna Tibet; de sista trupperna ger sig av i januari 1913 och dalai lama utropar Tibets självständighet.
  Mongolian forces take Khovd from its Chinese garrison.: Mongoliska styrkor tar Khovd från dess kinesiska garnison.
  Russia makes the Uriankhai country (Tuva) a protectorate.: Ryssland gör Uriankhailandet (Tuva) till protektorat.
  Japan takes Qingdao and Kiautschou from Germany.: Japan tar Qingdao och Kiautschou från Tyskland.
  Hulunbuir returns to China as a special region.: Hulunbuir återgår till Kina som en särskild region.
  The Bolsheviks take power in Petrograd; Soviet rule spreads to Siberia and the Kazakh steppe over the winter, and the Russian Civil War follows.: Bolsjevikerna tar makten i Petrograd; sovjetmakten sprider sig under vintern till Sibirien och den kazakiska stäppen, och ryska inbördeskriget följer.
  In the Sino-Tibetan war Tibetan troops take Chamdo from the Sichuan frontier army; the Rongbatsa truce in October leaves it to Tibet.: I det kinesisk-tibetanska kriget tar tibetanska trupper Chamdo från Sichuans gränsarmé; vapenvilan i Rongbatsa i oktober lämnar staden åt Tibet.
  The Turkestan Soviet Republic is proclaimed in Tashkent, with Semirechye and the Syr Darya.: Turkestanska sovjetrepubliken utropas i Tasjkent, med Semiretje och Syr-Darja.
  The Chinese government abolishes Mongolia’s autonomy after Xu Shuzheng’s troops occupy Urga.: Den kinesiska regeringen avskaffar Mongoliets autonomi efter att Xu Shuzhengs trupper har besatt Urga.
  The Far Eastern Republic is proclaimed at Verkhneudinsk as a buffer state between Soviet Russia and Japan.: Fjärran Östern-republiken utropas i Verchneudinsk som en buffertstat mellan Sovjetryssland och Japan.
  Ataman Semyonov has been driven from Chita; a conference there unites Transbaikalia, the Amur region and the coast under the Far Eastern Republic.: Ataman Semjonov har drivits ut ur Tjita; en konferens där förenar Transbajkalien, Amurområdet och kusten under Fjärran Östern-republiken.
  The Primorye government in Vladivostok joins the Far Eastern Republic; Japanese troops stay in the city, and a White government holds it from May 1921 until October 1922.: Primorjeregeringen i Vladivostok ansluter sig till Fjärran Östern-republiken; japanska trupper stannar i staden, och en vit regering behärskar den från maj 1921 till oktober 1922.
  Baron Ungern-Sternberg takes Urga and restores the Bogd Khan; the Red Army and Sükhbaatar’s partisans take Urga in July.: Baron Ungern-Sternberg intar Urga och återinsätter Bogd khan; Röda armén och Sükhbaatars partisaner intar Urga i juli.
  The Tuvan People’s Republic is proclaimed.: Tuvinska folkrepubliken utropas.
  The Far Eastern Republic is merged into Soviet Russia.: Fjärran Östern-republiken går upp i Sovjetryssland.
  Japan returns Kiautschou (Qingdao) to China.: Japan återlämnar Kiautschou (Qingdao) till Kina.
  Britain returns Weihaiwei to China.: Storbritannien återlämnar Weihaiwei till Kina.
  Japan sets up Manchukuo in Manchuria after the Mukden incident (1931).: Japan upprättar Manchukuo i Manchuriet efter Mukdenincidenten (1931).
  "Japanese and Manchukuo troops take Chengde: Rehe is added to Manchukuo.": "Trupper från Japan och Manchukuo intar Chengde: Rehe läggs till Manchukuo."
  After the Japanese conquest of Chahar and Suiyuan the Mongol United Autonomous Government (later Mengjiang) is set up under Prince Demchugdongrub.: Efter den japanska erövringen av Chahar och Suiyuan upprättas Mongoliska förenade autonoma regeringen (senare Mengjiang) under prins Demchugdongrub.
  Tuva is annexed by the Soviet Union.: Tuva annekteras av Sovjetunionen.
  Japan surrenders; Manchukuo and Mengjiang are dissolved and their lands return to the Republic of China, Manchuria after a Soviet occupation that lasts until May 1946. France returns Guangzhouwan.: Japan kapitulerar; Manchukuo och Mengjiang upplöses och deras områden återgår till Republiken Kina, Manchuriet efter en sovjetisk ockupation som varar till maj 1946. Frankrike återlämnar Guangzhouwan.
  Soviet troops occupy Port Arthur and Dalian, leased to the Soviet Union as a naval base by the treaty of 14 August.: Sovjetiska trupper besätter Port Arthur och Dalian, som genom fördraget den 14 augusti arrenderas ut till Sovjetunionen som flottbas.
  Japan hands Taiwan and Penghu over to the Republic of China.: Japan överlämnar Taiwan och Penghu till Republiken Kina.
  Jammu and Kashmir accedes to India, which inherits the claim to Aksai Chin.: Jammu och Kashmir ansluts till Indien, som ärver anspråket på Aksai Chin.
  Mao Zedong proclaims the People’s Republic of China in Beijing. The Communists hold the north, the north-east, the Yangtze valley and the north-west; the Nationalists still hold the south and south-west.: Mao Zedong utropar Folkrepubliken Kina i Peking. Kommunisterna behärskar norra och nordöstra Kina, Yangtzedalen och nordvästra Kina; nationalisterna behärskar fortfarande södra och sydvästra Kina.
  The People’s Liberation Army takes Guangzhou.: Folkets befrielsearmé intar Kanton.
  The People’s Liberation Army takes Xiamen; its attack on Kinmen fails (25–27 October).: Folkets befrielsearmé intar Xiamen; dess angrepp på Kinmen misslyckas (25–27 oktober).
  The People’s Liberation Army takes Guiyang and Chongqing.: Folkets befrielsearmé intar Guiyang och Chongqing.
  The Nationalist government moves to Taipei; Yunnan and Xikang change sides on 9 December and Chengdu falls on 27 December. Guangxi has been taken in the same weeks.: Nationalistregeringen flyttar till Taipei; Yunnan och Xikang byter sida den 9 december och Chengdu faller den 27 december. Guangxi har intagits under samma veckor.
  The People’s Liberation Army takes Hainan.: Folkets befrielsearmé tar Hainan.
  The People’s Liberation Army takes Chamdo.: Folkets befrielsearmé intar Chamdo.
  "The Seventeen Point Agreement: the Tibetan government accepts the sovereignty of the People’s Republic, whose troops reach Lhasa in October. Aksai Chin, crossed by Chinese troops from Xinjiang, is claimed by India as part of Ladakh.": "Sjuttonpunktsavtalet: den tibetanska regeringen godtar Folkrepublikens suveränitet, och Folkrepublikens trupper når Lhasa i oktober. Indien hävdar att Aksai Chin, som korsas av kinesiska trupper från Xinjiang, är en del av Ladakh."
  The Soviet Union hands Port Arthur back to China.: Sovjetunionen lämnar tillbaka Port Arthur till Kina.
  The Soviet Union is dissolved; Siberia and the Far East stay with Russia.: Sovjetunionen upplöses; Sibirien och Fjärran Östern stannar hos Ryssland.
  Britain hands Hong Kong over to China.: Storbritannien överlämnar Hongkong till Kina.
  Portugal hands Macau over to China.: Portugal överlämnar Macao till Kina.
  About 800. Silla rules the Korean peninsula south of the Taedong River and the coast up to the Wonsan area; the land between the Taedong and the Chongchon is an empty frontier, and Balhae rules the Yalu and the north-east. Tamna (Jeju) is a kingdom of its own that sends tribute to Silla. Japan, ruled from Heian-kyō (Kyoto) since 794, holds Kyushu, Shikoku and Honshu up to the lands of the Emishi in the north of Tōhoku, where the court’s armies are still fighting. Hokkaido, southern Sakhalin and the Kurils are the land of the Satsumon and Okhotsk peoples, ancestors of the Ainu, and the north of Sakhalin that of the Nivkh. The Ryukyu Islands are outside any state.: Omkring 800. Silla härskar över Koreahalvön söder om Taedongfloden och kusten upp till trakten kring Wonsan; landet mellan Taedong och Chongchon är ett öde gränsland, och Balhae härskar över Yalu och halvöns nordöstra del. Tamna (Jeju) är ett eget kungarike som betalar tribut till Silla. Japan, som styrs från Heian-kyō (Kyoto) sedan 794, behärskar Kyushu, Shikoku och Honshu upp till emishifolkets land i norra Tōhoku, där hovets arméer fortfarande strider. Hokkaido, södra Sachalin och Kurilerna är satsumon- och ochotskfolkens land, ainufolkets förfäder, och norra Sachalin är nivchernas land. Ryūkyūöarna hör inte till någon stat.
  Sakanoue no Tamuramaro builds Isawa Castle on the Kitakami River and the Emishi leaders Aterui and More surrender. Shiwa Castle follows in 803, and Fun’ya no Watamaro’s campaign of 811 brings the rest of the Kitakami basin (Iwate) under the court.: Sakanoue no Tamuramaro bygger borgen Isawa vid Kitakamifloden, och emishiledarna Aterui och More kapitulerar. Borgen Shiwa följer 803, och Fun’ya no Watamaros fälttåg 811 för resten av Kitakamibäckenet (Iwate) under hovet.
  Gyeon Hwon, a Silla commander, rebels in the south-west and takes Mujinju (Gwangju).: Gyeon Hwon, en befälhavare i Sillas tjänst, gör uppror i sydväst och intar Mujinju (Gwangju).
  Gyeon Hwon proclaims Later Baekje at Wansanju (Jeonju).: Gyeon Hwon utropar Senare Baekje i Wansanju (Jeonju).
  Gung Ye, a rebel leader who has taken central Korea from Silla, proclaims Later Goguryeo at Songak (Kaesong). It is renamed Majin in 904 and Taebong in 911.: Gung Ye, en rebelledare som har tagit centrala Korea från Silla, utropar Senare Goguryeo i Songak (Kaesong). Riket byter namn till Majin 904 och till Taebong 911.
  Hong Gi, the commander of Gongju, goes over to Gung Ye with the land around it.: Hong Gi, befälhavaren i Gongju, går över till Gung Ye med landet runt staden.
  Wang Geon overthrows Gung Ye and founds Goryeo; he resettles the ruined Pyongyang as the Western Capital (Seogyeong). Ungju (Gongju) and Unju (Hongseong) go over to Later Baekje.: Wang Geon störtar Gung Ye och grundar Goryeo; han befolkar på nytt det ödelagda Pyongyang och gör staden till Västra huvudstaden (Seogyeong). Ungju (Gongju) och Unju (Hongseong) går över till Senare Baekje.
  Later Baekje takes Daeya (Hapcheon) and the west of Gyeongsang from Silla.: Senare Baekje tar Daeya (Hapcheon) och västra Gyeongsang från Silla.
  With the fall of Balhae to the Liao, the Jurchen tribes are left in the north of the Korean peninsula; Balhae refugees flee to Goryeo.: När Balhae faller i Liaos händer lämnas norra delen av Koreahalvön åt jurchenstammarna; flyktingar från Balhae flyr till Goryeo.
  King Gyeongsun of Silla gives up his kingdom to Goryeo.: Kung Gyeongsun av Silla överlämnar sitt rike till Goryeo.
  Goryeo destroys Later Baekje at the battle of the Illi River and unifies the peninsula.: Goryeo krossar Senare Baekje i slaget vid Illifloden och enar halvön.
  After the first Khitan invasion, Seo Hui’s talks with the Liao commander Xiao Sunning (993) win Goryeo the land between the Chongchon and the Yalu, held by Jurchen tribes; Goryeo fortifies it as the six garrisons east of the river.: Efter den första khitanska invasionen ger Seo Huis förhandlingar med Liaos befälhavare Xiao Sunning (993) Goryeo landet mellan Chongchon och Yalu, som jurchenstammar håller; Goryeo befäster området och gör det till de sex garnisonerna öster om floden.
  Goryeo completes the Thousand-li Wall (Cheolli Jangseong), begun in 1033, from the mouth of the Yalu to the east coast at Jeongpyeong, on the south-western edge of the Hamhung plain, and settles the coast behind it.: Goryeo fullbordar Tusen li-muren (Cheolli Jangseong), som påbörjades 1033, från Yalus mynning till östkusten vid Jeongpyeong, i sydvästra utkanten av Hamhungslätten, och befolkar kusten bakom muren med nybyggare.
  "About 1100 (the exact date is not known). After the campaign of 1070, the Kiyohara and then the Northern Fujiwara of Hiraizumi, who govern Mutsu and Dewa for the court, bring the north of Honshu under Japanese rule: districts are set up in Nukanobu and Tsugaru (Aomori).": "Omkring 1100 (det exakta årtalet är okänt). Efter fälttåget 1070 lägger Kiyoharaklanen och därefter Norra Fujiwara i Hiraizumi, som styr Mutsu och Dewa åt hovet, norra Honshu under japanskt styre: distrikt upprättas i Nukanobu och Tsugaru (Aomori)."
  Tamna becomes a county of Goryeo, though its rulers keep their titles.: Tamna blir ett härad under Goryeo, men dess härskare behåller sina titlar.
  The Jurchens of the north-east of the peninsula, led by the Wanyan since the 1100s, come under the new Jin dynasty.: Jurchenerna i nordöstra delen av halvön, som har letts av Wanyanklanen sedan 1100-talet, kommer under den nya Jindynastin.
  Puxian Wannu’s Eastern Xia takes the north-east of the peninsula from the Jin.: Puxian Wannus Östra Xia tar nordöstra delen av halvön från Jin.
  The Mongols end Eastern Xia; its lands in the north-east of the peninsula come under the Mongol Empire.: Mongolerna gör slut på Östra Xia; dess områden i nordöstra delen av halvön kommer under Mongolriket.
  Two Goryeo officials, Jo Hwi and Tak Cheong, kill the local commander and hand the land north of the Cheollyeong pass to the Mongols, who govern it as the Ssangseong Commandery.: Två ämbetsmän i Goryeo, Jo Hwi och Tak Cheong, dödar den lokale befälhavaren och överlämnar landet norr om Cheollyeongpasset till mongolerna, som styr det som kommanderiet Ssangseong.
  The Mongol lands in the north-east of the peninsula pass to Kublai.: De mongoliska områdena i nordöstra delen av halvön övergår till Khubilai.
  Choe Tan, an officer at Pyongyang who rebelled against Goryeo in 1269, hands the north-west to the Mongols, who govern it as the Dongnyeong Prefecture.: Choe Tan, en officer i Pyongyang som gjorde uppror mot Goryeo 1269, överlämnar nordvästra delen till mongolerna, som styr den som prefekturen Dongnyeong.
  After the last Sambyeolcho stronghold on Jeju falls, the Mongols take the island as a horse-breeding ground under their own governor.: Sedan Sambyeolchos sista fäste på Jeju har fallit tar mongolerna ön och gör den till ett område för hästavel under en egen ståthållare.
  The Yuan give the Dongnyeong Prefecture back to Goryeo.: Yuandynastin lämnar tillbaka prefekturen Dongnyeong till Goryeo.
  The Yuan give Jeju back to Goryeo; Mongol horse-breeders stay on the island, and a Yuan commandery set up again in 1300 is replaced by a Goryeo garrison in 1301.: Yuandynastin lämnar tillbaka Jeju till Goryeo; mongoliska hästuppfödare stannar kvar på ön, och ett Yuankommanderi som upprättas på nytt 1300 ersätts 1301 av en garnison från Goryeo.
  About 1322. Okinawa is divided between three kingdoms, Hokuzan in the north, Chūzan in the centre and Nanzan in the south; from 1372 they send tribute to Ming China.: Omkring 1322. Okinawa är delat mellan tre kungariken, Hokuzan i norr, Chūzan i mitten och Nanzan i söder; från 1372 sänder de tribut till Mingdynastins Kina.
  "King Gongmin turns against the Yuan: his army takes back the Ssangseong Commandery, helped by a local commander, Yi Ja-chun, the father of Yi Seong-gye, and pushes north along the coast.": "Kung Gongmin vänder sig mot Yuandynastin: hans armé återtar kommanderiet Ssangseong med hjälp av en lokal befälhavare, Yi Ja-chun, far till Yi Seong-gye, och tränger norrut längs kusten."
  The Yuan lands on the Tumen and the upper Yalu pass to the Mongols who hold Manchuria for the Northern Yuan.: Yuandynastins områden vid Tumen och övre Yalu övergår till de mongoler som håller Manchuriet åt Norra Yuan.
  Kanggye on the middle Yalu, a Goryeo garrison since 1361, becomes a garrison command (manhobu).: Kanggye vid mellersta Yalu, en garnison under Goryeo sedan 1361, blir ett garnisonskommando (manhobu).
  After Naghachu’s surrender to the Ming, the Jurchen tribes of the Tumen and the upper Yalu are left to themselves.: Efter Naghachus kapitulation för Mingdynastin lämnas jurchenstammarna vid Tumen och övre Yalu åt sig själva.
  Goryeo makes Kapsan, on the upper Yalu, a garrison command.: Goryeo gör Kapsan vid övre Yalu till ett garnisonskommando.
  Yi Seong-gye takes the throne and founds Joseon (so named in 1393), ending Goryeo.: Yi Seong-gye bestiger tronen och grundar Joseon (som får sitt namn 1393), vilket gör slut på Goryeo.
  Shō Hashi of Chūzan conquers Nanzan, having taken Hokuzan in 1416, and unites Okinawa as the Ryukyu Kingdom.: Shō Hashi av Chūzan, som intog Hokuzan 1416, erövrar Nanzan och enar Okinawa till Ryūkyūriket.
  "Kim Jong-seo begins the six garrisons on the lower Tumen, completed by 1449, while King Sejong’s armies set up four commanderies on the middle Yalu in 1433–1443 (all four were abandoned in 1455–1459 and the land left empty): the Yalu and the Tumen become the border of Korea.": "Kim Jong-seo påbörjar de sex garnisonerna vid nedre Tumen, som står färdiga 1449, medan kung Sejongs arméer upprättar fyra kommanderier vid mellersta Yalu 1433–1443 (alla fyra övergavs 1455–1459 och landet lämnades öde): Yalu och Tumen blir Koreas gräns."
  Shō Toku conquers Kikai, the last of the Amami Islands to come under Ryukyu.: Shō Toku erövrar Kikai, den sista av Amamiöarna som kommer under Ryūkyū.
  Ryukyuan forces defeat Oyake Akahachi on Ishigaki; the Yaeyama and Miyako Islands come under the rule of Shuri.: Styrkor från Ryūkyū besegrar Oyake Akahachi på Ishigaki; Yaeyama- och Miyakoöarna kommer under Shuris styre.
  Tokugawa Ieyasu grants the Matsumae clan the sole right to trade with the Ainu; their land at the south-western tip of Ezo (Hokkaido), where Japanese settlers have held forts since the 1450s, becomes the Matsumae domain.: Tokugawa Ieyasu ger Matsumaeklanen ensamrätt till handeln med ainufolket; klanens land på sydvästspetsen av Ezo (Hokkaido), där japanska nybyggare har haft fästen sedan 1450-talet, blir Matsumaedomänen.
  "Two years after the Satsuma invasion, the released king Shō Nei accepts Satsuma’s terms: the Amami Islands are ruled directly by Satsuma, and Ryukyu becomes a vassal of Satsuma and the shogunate while still sending tribute to China.": "Två år efter Satsumas invasion godtar den frisläppte kungen Shō Nei Satsumas villkor: Amamiöarna styrs direkt av Satsuma, och Ryūkyū blir vasall under Satsuma och shogunatet men fortsätter att sända tribut till Kina."
  Cossacks from Kamchatka land on Shumshu, and in 1713 on Paramushir; Russia takes tribute from the Ainu of the northern Kurils.: Kosacker från Kamtjatka landstiger på Sjumsju och 1713 på Paramusjir; Ryssland driver in tribut från ainufolket på de norra Kurilerna.
  The shogunate takes eastern Ezo and the southern Kurils (Kunashir and Iturup) from the Matsumae domain and rules them directly, against Russian advances; western Ezo follows in 1807. The lands go back to Matsumae in 1821 and to the shogunate again in 1855.: Shogunatet tar östra Ezo och de södra Kurilerna (Kunasjir och Iturup) från Matsumaedomänen och styr dem direkt för att möta ryska framstötar; västra Ezo följer 1807. Områdena återgår till Matsumae 1821 och till shogunatet igen 1855.
  Gennady Nevelskoy’s expedition sets up Russian posts on Sakhalin; Russia occupies the north of the island, where it opens coal mines at Dué and, from 1869, a penal colony.: Gennadij Nevelskojs expedition upprättar ryska utposter på Sachalin; Ryssland besätter öns norra del, där landet öppnar kolgruvor vid Dué och från 1869 en straffkoloni.
  "Treaty of Shimoda: Russia and Japan draw their border in the Kurils between Iturup and Urup, and leave Sakhalin, where both have posts, undivided and open to both.": "Fördraget i Shimoda: Ryssland och Japan drar sin gräns på Kurilerna mellan Iturup och Urup och lämnar Sachalin, där båda har utposter, odelat och öppet för båda."
  "Treaty of Saint Petersburg: Japan gives up its claims to Sakhalin, which becomes wholly Russian, in exchange for the Kurils north of Iturup.": "Fördraget i Sankt Petersburg: Japan avstår från sina anspråk på Sachalin, som blir helt ryskt, i utbyte mot Kurilerna norr om Iturup."
  Japan abolishes the Ryukyu Domain, made from the kingdom in 1872, and annexes the islands as Okinawa Prefecture; King Shō Tai is taken to Tokyo.: Japan avskaffar Ryūkyūdomänen, som bildades av kungariket 1872, och annekterar öarna som prefekturen Okinawa; kung Shō Tai förs till Tokyo.
  "Treaty of Portsmouth: Russia cedes Sakhalin south of the 50th parallel (Karafuto) to Japan.": "Freden i Portsmouth: Ryssland avträder Sachalin söder om 50:e breddgraden (Karafuto) till Japan."
  Japan annexes Korea, its protectorate since 1905; the Korean Empire ends.: Japan annekterar Korea, som har varit japanskt protektorat sedan 1905; Koreanska kejsardömet upphör.
  The Bolsheviks take power in Petrograd. Northern Sakhalin, held by the Whites from 1918, rises in January 1920 and is occupied by Japanese troops in April.: Bolsjevikerna tar makten i Petrograd. Norra Sachalin, som de vita behärskar från 1918, reser sig i januari 1920 och besätts av japanska trupper i april.
  Northern Sakhalin is claimed by the Far Eastern Republic; Japanese troops occupy it from 1920 to 1925.: Fjärran Östern-republiken gör anspråk på norra Sachalin; japanska trupper ockuperar området från 1920 till 1925.
  Northern Sakhalin passes to Soviet Russia with the rest of the Far Eastern Republic.: Norra Sachalin övergår till Sovjetryssland tillsammans med resten av Fjärran Östern-republiken.
  Soviet troops, who entered Korea on 10–12 August, reach Pyongyang. The Japanese north of the 38th parallel, the line agreed with the United States between their zones, surrender to them, and the Soviet Union sets up its administration.: Sovjetiska trupper, som gick in i Korea den 10–12 augusti, når Pyongyang. Japanerna norr om 38:e breddgraden, den linje mellan de två zonerna som man har kommit överens om med USA, kapitulerar för de sovjetiska trupperna, och Sovjetunionen upprättar sin förvaltning.
  The Japanese governor-general surrenders in Seoul to American forces, who landed at Incheon the day before; the US Army Military Government rules Korea south of the 38th parallel.: Den japanske generalguvernören kapitulerar i Seoul för amerikanska styrkor, som landsteg i Incheon dagen innan; Amerikanska arméns militärregering styr Korea söder om 38:e breddgraden.
  "An order of the Allied occupation separates the islands south of 30° N from Japan’s administration: the Ryukyu and Amami Islands (Okinawa, taken by American forces in the battle of Okinawa in April–June 1945, and the other islands, whose garrisons surrendered in September 1945) are ruled by a US military government, from 1950 the United States Civil Administration of the Ryukyu Islands. The Treaty of San Francisco (1951) confirmed American rule; Japan kept residual sovereignty.": "En order från den allierade ockupationsmakten skiljer öarna söder om 30° N från Japans förvaltning: Ryūkyū- och Amamiöarna (Okinawa, som amerikanska styrkor intog i slaget om Okinawa i april–juni 1945, och de övriga öarna, vars garnisoner kapitulerade i september 1945) styrs av en amerikansk militärregering, från 1950 USA:s civilförvaltning av Ryūkyūöarna. Fredsfördraget i San Francisco (1951) bekräftade det amerikanska styret; Japan behöll en kvarvarande suveränitet."
  The Soviet Union annexes South Sakhalin and the Kuril Islands, which its troops occupied in August and September 1945. Japan renounced South Sakhalin and the Kurils in the Treaty of San Francisco (1951), which the Soviet Union did not sign, but holds that the four southern islands, Iturup, Kunashir, Shikotan and the Habomai, are not part of the Kurils it renounced (Shikotan and the Habomai being part of Hokkaido) and claims them as its Northern Territories; the dispute is unresolved.: Sovjetunionen annekterar Södra Sachalin och Kurilerna, som dess trupper besatte i augusti och september 1945. Japan avsade sig Södra Sachalin och Kurilerna i fredsfördraget i San Francisco (1951), som Sovjetunionen inte undertecknade, men hävdar att de fyra södra öarna, Iturup, Kunasjir, Sjikotan och Habomaiöarna, inte ingår i de Kuriler som landet avsade sig (Sjikotan och Habomaiöarna anses höra till Hokkaido), och gör anspråk på dem som Norra territorierna; tvisten är olöst.
  The Republic of Korea is proclaimed in Seoul, with Syngman Rhee as president.: Republiken Korea utropas i Seoul med Syngman Rhee som president.
  The Democratic People’s Republic of Korea is proclaimed in Pyongyang, with Kim Il-sung as premier.: Demokratiska folkrepubliken Korea utropas i Pyongyang med Kim Il-sung som premiärminister.
  "Korean Armistice Agreement: the front line becomes the Military Demarcation Line. South Korea keeps the land north of the 38th parallel in the east, North Korea the land south of it in the west, with Kaesong and the Ongjin peninsula.": "Vapenstilleståndsavtalet i Korea: frontlinjen blir den militära demarkationslinjen. Sydkorea behåller landet norr om 38:e breddgraden i öster, Nordkorea landet söder om den i väster, med Kaesong och Ongjinhalvön."
  The United States returns the Amami Islands to Japan.: USA återlämnar Amamiöarna till Japan.
  The United States returns Okinawa and the rest of the Ryukyu Islands to Japan; American bases stay.: USA återlämnar Okinawa och resten av Ryūkyūöarna till Japan; de amerikanska baserna blir kvar.
  Sakhalin and the Kurils pass to Russia with the end of the Soviet Union.: Sachalin och Kurilerna övergår till Ryssland när Sovjetunionen upphör.
  ? About 800. In Burma the Pyu city-states (Sri Ksetra near Prome, Halin) hold the dry zone and the Mon city-states of Thaton and Pegu the coast; Arakan is a kingdom of its own (Waithali). In Thailand the Mon city-states of Dvaravati hold the Chao Phraya plain and Hariphunchai (Lamphun) the north. The Khmer lands of Chenla, divided at this time, stretch from southern Laos and the Khorat plateau over Cambodia to the Mekong delta. The Tang protectorate of Annan rules the Red River delta down to Hà Tĩnh, and Champa the coast to the south. Srivijaya, from Palembang, rules southern Sumatra and the Strait of Malacca with the Malay peninsula; the Sailendra and Sanjaya kings of Mataram (Medang) rule Central Java, and the kingdom of Sunda West Java. Bali has kings of its own. The rest of the islands — northern Sumatra, Borneo, Sulawesi, the Moluccas, the Philippines, Timor and New Guinea — are the land of smaller polities and peoples outside these kingdoms. The northern hills of Burma, Laos and Vietnam are outside any state.
  : Omkring 800. I Burma behärskar pyuernas stadsstater (Sri Ksetra nära Prome, Halin) den torra zonen och monernas stadsstater Thaton och Pegu kusten; Arakan är ett eget kungarike (Waithali). I Thailand behärskar monernas stadsstater i Dvaravati Chao Phraya-slätten och Hariphunchai (Lamphun) norra delen. Khmerernas land Chenla, som vid denna tid är delat, sträcker sig från södra Laos och Khoratplatån över Kambodja till Mekongdeltat. Tangdynastins protektorat Annan styr Röda flodens delta ned till Hà Tĩnh, och Champa kusten söder därom. Srivijaya styr från Palembang södra Sumatra och Malackasundet med Malackahalvön; Sailendra- och Sanjayakungarna i Mataram (Medang) styr Centrala Java och kungariket Sunda Västra Java. Bali har egna kungar. Resten av öarna – norra Sumatra, Borneo, Sulawesi, Moluckerna, Filippinerna, Timor och Nya Guinea – är hemvist för mindre politiska enheter och folk utanför dessa riken. Bergstrakterna i norra Burma, Laos och Vietnam hör inte till någon stat.
  Pagan is founded on the Irrawaddy, by the traditional date, after Nanzhao’s raids of the 830s have broken the Pyu cities.: Pagan grundas vid Irrawaddy, enligt det traditionella årtalet, sedan Nanzhaos räder på 830-talet har brutit ned pyuernas städer.
  Khúc Thừa Dụ, a local leader, takes over the Tang circuit of Tĩnh Hải (Jinghai) in the Red River delta as the Tang dynasty breaks up, and rules it in its name.: Khúc Thừa Dụ, en lokal ledare, tar över Tangdynastins krets Tĩnh Hải (Jinghai) i Röda flodens delta när Tangdynastin faller sönder och styr den i dynastins namn.
  Mpu Sindok moves the court of Mataram (Medang) from Central Java to the Brantas valley in East Java, perhaps after an eruption of Merapi; East Java becomes the centre of the kingdom.: Mpu Sindok flyttar hovet i Mataram (Medang) från Centrala Java till Brantasdalen på Östra Java, kanske efter ett utbrott av Merapi; Östra Java blir rikets centrum.
  "Ngô Quyền, victor over the Southern Han fleet at the Bạch Đằng River in 938, proclaims himself king at Cổ Loa: the Red River delta becomes an independent kingdom. Đinh Bộ Lĩnh reunites it in 968 after the wars of the twelve warlords and names it Đại Cồ Việt.": "Ngô Quyền, som besegrade Södra Hans flotta vid floden Bạch Đằng 938, utropar sig till kung i Cổ Loa: Röda flodens delta blir ett självständigt kungarike. Đinh Bộ Lĩnh återförenar det 968 efter de tolv krigsherrarnas krig och ger det namnet Đại Cồ Việt."
  Po-ni, on the north-west coast of Borneo, the forerunner of Brunei, sends its first recorded embassy to the Song court.: Po-ni på Borneos nordvästkust, föregångaren till Brunei, sänder sin första belagda beskickning till Songhovet.
  Mataram (Medang) collapses when Wurawari, a vassal allied with Srivijaya, sacks its capital and kills King Dharmawangsa (the Pralaya); Airlangga, his son-in-law, survives in the hills.: Mataram (Medang) går under när Wurawari, en vasall i förbund med Srivijaya, plundrar dess huvudstad och dödar kung Dharmawangsa (Pralaya); hans svärson Airlangga överlever i bergen.
  About 1025. Suryavarman I extends Khmer rule over Lavo (Lopburi) and the Mon lands of the Chao Phraya plain; Dvaravati’s cities become Khmer provinces.: Omkring 1025. Suryavarman I utsträcker khmerernas välde över Lavo (Lopburi) och monernas land på Chao Phraya-slätten; Dvaravatis städer blir khmeriska provinser.
  Airlangga, crowned in 1019, has reunited East Java under his kingdom of Kahuripan. Before his death in 1049 he divides it into Janggala and Panjalu (Kediri), which Kediri later absorbs.: Airlangga, som kröntes 1019, har återförenat Östra Java i sitt kungarike Kahuripan. Före sin död 1049 delar han det i Janggala och Panjalu (Kediri); Janggala uppgår senare i Kediri.
  Anawrahta becomes king of Pagan and unites the dry zone; the Pyu towns of the south come under Pagan.: Anawrahta blir kung i Pagan och enar den torra zonen; pyuernas städer i söder kommer under Pagan.
  Anawrahta takes Thaton, the main city of the Mon, and brings Lower Burma and the Tenasserim coast under Pagan.: Anawrahta intar Thaton, monernas främsta stad, och lägger Nedre Burma och Tenasserimkusten under Pagan.
  Lý Thánh Tông takes the Cham capital and its king Rudravarman III, who buys his freedom with the three northern districts of Champa (Quảng Bình and the north of Quảng Trị).: Lý Thánh Tông tar chamernas huvudstad och deras kung Rudravarman III, som köper sig fri med Champas tre nordligaste distrikt (Quảng Bình och norra Quảng Trị).
  About 1100. Kedah, the old port kingdom at the foot of Gunung Jerai, rules its coast as a state of its own after Srivijaya’s decline; its rulers become Muslim, by tradition, in 1136.: Omkring 1100. Kedah, det gamla hamnriket vid foten av Gunung Jerai, styr sin kust som en egen stat efter Srivijayas nedgång; enligt traditionen blir dess härskare muslimer 1136.
  "About 1180. Under Jayavarman VII the Khmer Empire reaches its greatest extent: inscriptions and rest houses show Khmer rule as far as Sukhothai in the west and the Vientiane plain in the north. On the isthmus Tambralinga (Nakhon Si Thammarat) has replaced Srivijaya as the leading power.": "Omkring 1180. Under Jayavarman VII når Khmerriket sin största utbredning: inskrifter och rasthus visar att khmerernas välde sträcker sig ända till Sukhothai i väster och Vientianeslätten i norr. På näset har Tambralinga (Nakhon Si Thammarat) ersatt Srivijaya som den ledande makten."
  Jayavarman VII’s army conquers Champa, which is ruled as a Khmer province until 1220.: Jayavarman VII:s armé erövrar Champa, som styrs som en khmerisk provins fram till 1220.
  The Khmer withdraw from Champa, and Jaya Paramesvaravarman II restores its independence.: Khmererna drar sig tillbaka från Champa, och Jaya Paramesvaravarman II återupprättar dess självständighet.
  Ken Arok defeats King Kertajaya of Kediri at Ganter and founds the kingdom of Singhasari in East Java.: Ken Arok besegrar kung Kertajaya av Kediri vid Ganter och grundar kungariket Singhasari på Östra Java.
  About 1238. Two Thai chiefs, Pho Khun Bang Klang Hao and Pha Mueang, drive the Khmer governor from Sukhothai; Bang Klang Hao becomes its first king, Si Inthrathit.: Omkring 1238. Två thaihövdingar, Pho Khun Bang Klang Hao och Pha Mueang, driver ut khmerernas guvernör från Sukhothai; Bang Klang Hao blir stadens förste kung, Si Inthrathit.
  About 1240. Lavo (Lopburi) and the lower Chao Phraya plain break away from the Khmer Empire; Lavo sends its own missions to China later in the century.: Omkring 1240. Lavo (Lopburi) och nedre Chao Phraya-slätten bryter sig loss från Khmerriket; senare under århundradet sänder Lavo egna beskickningar till Kina.
  Mangrai, ruler of Ngoenyang, founds Chiang Rai, the first step of the kingdom of Lan Na.: Mangrai, härskare i Ngoenyang, grundar Chiang Rai, det första steget mot kungariket Lan Na.
  About 1267. Samudera Pasai, on the north coast of Sumatra, becomes a sultanate under Malik al-Saleh (died 1297), the first Muslim kingdom of the islands known from its own remains.: Omkring 1267. Samudera Pasai på Sumatras nordkust blir ett sultanat under Malik al-Saleh (död 1297), det första muslimska kungariket i övärlden som är känt genom egna lämningar.
  Kertanegara of Singhasari sends the Pamalayu expedition to Sumatra (1275–1293). By then the leadership of the Malay world in Sumatra has passed from Srivijaya to Melayu, with its centre on the upper Batang Hari at Dharmasraya, and the ports of the southern Malay peninsula and the Riau Islands no longer answer to one ruler.: Kertanegara av Singhasari sänder Pamalayuexpeditionen till Sumatra (1275–1293). Vid det laget har ledarskapet i den malajiska världen på Sumatra gått över från Srivijaya till Melayu, med sitt centrum vid övre Batang Hari i Dharmasraya, och hamnarna på södra Malackahalvön och Riauöarna lyder inte längre under en enda härskare.
  A Mongol invasion from Yunnan and the murder of King Narathihapate break up the Pagan Empire. Wareru, a Mon, makes himself king at Martaban, founding the kingdom later called Hanthawaddy; the Shan chiefs of the hills go their own way, and the Tenasserim coast south of Tavoy passes to Sukhothai. Pagan survives as a small kingdom until 1297, when its king Kyawswa submits to the Mongols and is deposed.: En mongolisk invasion från Yunnan och mordet på kung Narathihapate bryter sönder Paganriket. Wareru, en mon, gör sig till kung i Martaban och grundar det rike som senare kallas Hanthawaddy; shanhövdingarna i bergen går sin egen väg, och Tenasserimkusten söder om Tavoy övergår till Sukhothai. Pagan lever kvar som ett litet kungarike till 1297, då dess kung Kyawswa underkastar sig mongolerna och avsätts.
  Mangrai takes Hariphunchai (Lamphun); in 1296 he founds Chiang Mai, the capital of Lan Na.: Mangrai intar Hariphunchai (Lamphun); 1296 grundar han Chiang Mai, Lan Nas huvudstad.
  Jayakatwang, ruler of Gelang-gelang and a vassal of Singhasari, rebels while Kertanegara’s army is away in Sumatra, kills the king in his palace and restores the kingdom of Kediri at Daha.: Jayakatwang, härskare i Gelang-gelang och vasall under Singhasari, gör uppror medan Kertanegaras armé är borta på Sumatra, dödar kungen i hans palats och återupprättar kungariket Kediri i Daha.
  Raden Wijaya, Kertanegara’s son-in-law, uses the Mongol expedition sent against Java to overthrow Jayakatwang of Kediri, who had killed Kertanegara in 1292, then drives the Mongols out and founds Majapahit.: Raden Wijaya, Kertanegaras svärson, utnyttjar den mongoliska expedition som har sänts mot Java för att störta Jayakatwang av Kediri, som hade dödat Kertanegara 1292, driver sedan ut mongolerna och grundar Majapahit.
  The three brothers of Myinsaing, Shan-Burmese commanders, depose the last Pagan king, Kyawswa, and rule the dry zone; Thihathu moves the capital to Pinya in 1313.: De tre bröderna från Myinsaing, shan-burmesiska befälhavare, avsätter den siste kungen av Pagan, Kyawswa, och styr den torra zonen; Thihathu flyttar huvudstaden till Pinya 1313.
  About 1300. In the islands the oldest kingdoms of South Sulawesi are named in their chronicles — Luwu, Bone and the Makassar kingdom of Gowa — and Ternate and Tidore rule the clove islands of the northern Moluccas.: Omkring 1300. På öarna nämns de äldsta kungarikena på södra Sulawesi i deras krönikor – Luwu, Bone och makassarernas kungarike Gowa – och Ternate och Tidore styr kryddnejlikeöarna i norra Moluckerna.
  Champa cedes the districts of Ô and Lý (Thuận Hóa, around Huế) to Đại Việt as the marriage gift for the Vietnamese princess Huyền Trân.: Champa avträder distrikten Ô och Lý (Thuận Hóa, kring Huế) till Đại Việt som brudgåva vid giftermålet med den vietnamesiska prinsessan Huyền Trân.
  Sawyun, a son of Thihathu, makes Sagaing a kingdom of its own across the Irrawaddy from Pinya.: Sawyun, en son till Thihathu, gör Sagaing till ett eget kungarike på andra sidan Irrawaddy, mitt emot Pinya.
  Lan Na annexes the kingdom of Phayao.: Lan Na annekterar kungariket Phayao.
  Adityawarman, a prince of Melayu raised at Majapahit, moves his court to the Minangkabau highlands, the beginning of the kingdom of Pagaruyung. Palembang has rulers of its own.: Adityawarman, en prins från Melayu som har vuxit upp i Majapahit, flyttar sitt hov till Minangkabauhöglandet, början på kungariket Pagaruyung. Palembang har egna härskare.
  About 1350. Tanjungpura in western Borneo and Kutai on the Mahakam are named among Majapahit’s tributaries in the Nagarakretagama (1365).: Omkring 1350. Tanjungpura på västra Borneo och Kutai vid Mahakam nämns bland Majapahits tributstater i Nagarakretagama (1365).
  U Thong founds Ayutthaya, joining Lavo and Suphannaburi into one kingdom; Nakhon Si Thammarat (the old Tambralinga) and the upper isthmus, ruled by a Thai line since the late 13th century, come under it.: U Thong grundar Ayutthaya och förenar Lavo och Suphannaburi till ett kungarike; Nakhon Si Thammarat (det gamla Tambralinga) och övre delen av näset, som sedan slutet av 1200-talet har styrts av en thaiätt, kommer under det.
  Fa Ngum, a Lao prince raised at Angkor, founds the kingdom of Lan Xang at Muang Sua (Luang Prabang), stretching from the borders of Yunnan to the Khone Falls and over the Khorat plateau.: Fa Ngum, en laotisk prins som har vuxit upp i Angkor, grundar kungariket Lan Xang i Muang Sua (Luang Prabang), som sträcker sig från Yunnans gränser till Khonefallen och över Khoratplatån.
  Thado Minbya ends the rival kingdoms of Pinya and Sagaing and founds Ava, which rules the dry zone for the next two centuries.: Thado Minbya gör slut på de rivaliserande kungarikena Pinya och Sagaing och grundar Ava, som styr den torra zonen under de följande två århundradena.
  Majapahit sacks Palembang after its ruler seeks recognition from the Ming. Chinese settlers then rule the port; the Ming name one of them its governor in 1407.: Majapahit plundrar Palembang sedan dess härskare har sökt erkännande från Mingdynastin. Kinesiska nybyggare styr sedan hamnen; Mingdynastin utnämner 1407 en av dem till guvernör.
  About 1400. Parameswara, a prince from Palembang driven from Temasek (Singapore), founds Malacca, which becomes the leading port of the Strait within a generation. The southern Malay peninsula and the Riau Islands, under Srivijaya’s heirs until the late 13th century, have had no one ruler since. Buton is a kingdom of its own off south-eastern Sulawesi.: Omkring 1400. Parameswara, en prins från Palembang som har fördrivits från Temasek (Singapore), grundar Malacka, som inom en generation blir den ledande hamnen vid sundet. Södra Malackahalvön och Riauöarna, som fram till slutet av 1200-talet lydde under Srivijayas arvtagare, har sedan dess inte haft någon gemensam härskare. Buton är ett eget kungarike utanför sydöstra Sulawesi.
  Hồ Quý Ly, who seized the throne of Đại Việt in 1400 and renamed it Đại Ngu, forces Champa to cede Amaravati (Quảng Nam and Quảng Ngãi).: Hồ Quý Ly, som tog Đại Việts tron 1400 och döpte om riket till Đại Ngu, tvingar Champa att avträda Amaravati (Quảng Nam och Quảng Ngãi).
  The Ming, who have conquered Đại Ngu and captured the Hồ rulers, annex it as the province of Jiaozhi. Champa takes back the lands south of the Hải Vân pass that it had ceded to the Hồ.: Mingdynastin, som har erövrat Đại Ngu och tillfångatagit Hồdynastins härskare, annekterar landet som provinsen Jiaozhi. Champa tar tillbaka landet söder om Hải Vân-passet som det hade avträtt till Hồdynastin.
  Lê Lợi, victor of the ten-year Lam Sơn rising, takes the throne of a restored Đại Việt after the Ming army withdraws.: Lê Lợi, segraren i den tioåriga Lam Sơn-resningen, bestiger tronen i ett återupprättat Đại Việt sedan Mingarmén har dragit sig tillbaka.
  Ayutthaya takes and sacks Angkor. The Khmer court moves south, to Srei Santhor and later Phnom Penh, and Ayutthaya takes the Khorat plateau and the coast at Chanthaburi.: Ayutthaya intar och plundrar Angkor. Khmerernas hov flyttar söderut, till Srei Santhor och senare Phnom Penh, och Ayutthaya tar Khoratplatån och kusten vid Chanthaburi.
  On the death of King Mahathammaracha IV, Ayutthaya annexes Sukhothai, its vassal since 1378.: Vid kung Mahathammaracha IV:s död annekterar Ayutthaya Sukhothai, dess vasall sedan 1378.
  Lan Na under Tilokarat annexes Phrae and Nan in the 1440s.: Lan Na under Tilokarat annekterar Phrae och Nan på 1440-talet.
  About 1448. During the troubles in Lan Xang, Đại Việt annexes the Black Tai country along the Black River in the north-west (Điện Biên and Sơn La).: Omkring 1448. Under oroligheterna i Lan Xang annekterar Đại Việt de svarta taiernas land längs Svarta floden i nordväst (Điện Biên och Sơn La).
  About 1450. Sulu, in the archipelago south-west of Mindanao, becomes a sultanate under Sharif ul-Hashim, by its own tradition; Malacca, now Muslim, rules Pahang and the coasts of the peninsula and of Sumatra opposite.: Omkring 1450. Sulu, i ögruppen sydväst om Mindanao, blir enligt sin egen tradition ett sultanat under Sharif ul-Hashim; Malacka, som nu är muslimskt, styr Pahang och kusterna på halvön och på Sumatra mitt emot.
  Pahang, conquered by Malacca in the 1450s, receives a Malacca prince, Muhammad Shah, as its first sultan.: Pahang, som Malacka erövrade på 1450-talet, får en prins från Malacka, Muhammad Shah, som sin förste sultan.
  Lê Thánh Tông takes Vijaya, the Cham capital, and annexes it with Amaravati (Quảng Nam and Quảng Ngãi); what remains of Champa, in Kauthara and Panduranga, becomes a small kingdom in the far south.: Lê Thánh Tông intar Vijaya, chamernas huvudstad, och annekterar den tillsammans med Amaravati (Quảng Nam och Quảng Ngãi); det som återstår av Champa, i Kauthara och Panduranga, blir ett litet kungarike längst i söder.
  About 1475. Demak, on the north coast of Central Java, becomes the first Muslim power of Java under Raden Patah.: Omkring 1475. Demak, på Centrala Javas nordkust, blir Javas första muslimska makt under Raden Patah.
  Cirebon, under Sunan Gunung Jati, breaks away from the Hindu kingdom of Sunda.: Cirebon under Sunan Gunung Jati bryter sig loss från det hinduiska kungariket Sunda.
  Thado Minsaw, governor of Prome, breaks away from Ava and founds the kingdom of Prome.: Thado Minsaw, guvernör i Prome, bryter sig loss från Ava och grundar kungariket Prome.
  About 1496. Aceh, at the northern tip of Sumatra, becomes a sultanate; Ali Mughayat Syah (died 1530) makes it a power.: Omkring 1496. Aceh, på Sumatras nordspets, blir ett sultanat; Ali Mughayat Syah (död 1530) gör det till en makt.
  About 1500. Ternate’s rulers extend their sway to Hitu on Ambon and to Seram and Buru, the islands of the central Moluccas.: Omkring 1500. Ternates härskare utsträcker sitt välde till Hitu på Ambon och till Seram och Buru, öarna i de centrala Moluckerna.
  About 1500. Pattani, the port of the old Langkasuka, is a Malay sultanate; Kelantan has its own rulers under Malacca’s overlordship; Brunei, at the height of its power, rules the coasts of north-western Borneo. Aru (Haru), on the east coast of Sumatra, is the rival of Pasai and Malacca.: Omkring 1500. Pattani, det gamla Langkasukas hamn, är ett malajiskt sultanat; Kelantan har egna härskare under Malackas överhöghet; Brunei, på höjden av sin makt, styr kusterna på nordvästra Borneo. Aru (Haru), på Sumatras östkust, är rival till Pasai och Malacka.
  Mingyi Nyo of Toungoo breaks with Ava, the beginning of the Toungoo kingdom.: Mingyi Nyo av Toungoo bryter med Ava, början på Toungooriket.
  A Portuguese fleet under Afonso de Albuquerque takes Malacca. Sultan Mahmud withdraws, first to Pahang and Bintan, and his heirs rule the peninsula’s south from the Riau Islands and Johor.: En portugisisk flotta under Afonso de Albuquerque intar Malacka. Sultan Mahmud drar sig tillbaka, först till Pahang och Bintan, och hans arvingar styr halvöns södra del från Riauöarna och Johor.
  About 1520. Sharif Kabungsuwan, from Johor, founds the sultanate of Maguindanao in the Cotabato valley of Mindanao.: Omkring 1520. Sharif Kabungsuwan från Johor grundar sultanatet Maguindanao i Cotabatodalen på Mindanao.
  Aceh takes Pasai, which the Portuguese have held since 1521, and Pedir; by 1530 it rules the north of Sumatra.: Aceh intar Pasai, som portugiserna har hållit sedan 1521, och Pedir; 1530 styr Aceh norra Sumatra.
  About 1526. Raden Samudra, with help from Demak, becomes the first sultan of Banjar (Banjarmasin) in southern Borneo.: Omkring 1526. Raden Samudra blir med hjälp från Demak den förste sultanen av Banjar (Banjarmasin) på södra Borneo.
  Demak has destroyed Majapahit’s successor at Daha (Kediri) and, under Fatahillah, takes Sunda Kelapa (Jayakarta) and Banten from Sunda; Palembang is governed for Demak. In Burma the Confederation of Shan States, led by Mohnyin, takes Ava. In Đại Việt the general Mạc Đăng Dung seizes the throne and founds the Mạc dynasty.: Demak har krossat Majapahits efterföljare i Daha (Kediri) och tar under Fatahillah Sunda Kelapa (Jayakarta) och Banten från Sunda; Palembang styrs för Demaks räkning. I Burma intar Shanstaternas konfederation, ledd av Mohnyin, Ava. I Đại Việt tillskansar sig generalen Mạc Đăng Dung tronen och grundar Mạcdynastin.
  "Sultan Mahmud’s sons divide what is left of Malacca’s realm: Alauddin Riayat Shah founds Johor, with the Riau Islands, Singapore and the south of the peninsula, and Muzaffar Shah founds Perak.": "Sultan Mahmuds söner delar det som återstår av Malackas rike: Alauddin Riayat Shah grundar Johor, med Riauöarna, Singapore och halvöns södra del, och Muzaffar Shah grundar Perak."
  Tabinshwehti of Toungoo takes Pegu, the capital of Hanthawaddy.: Toungookungen Tabinshwehti intar Pegu, Hanthawaddys huvudstad.
  Toungoo takes Martaban after a seven-month siege, and with it the Mon country to Tavoy.: Toungooriket intar Martaban efter en belägring på sju månader, och därmed monernas land ned till Tavoy.
  Toungoo takes Prome.: Toungooriket intar Prome.
  The Lê, restored in exile in 1533 by Nguyễn Kim, take back Thanh Hóa; for fifty years the Lê (with the Trịnh and Nguyễn lords) hold the south and the Mạc the north.: Lêdynastin, som återupprättades i exil 1533 av Nguyễn Kim, tar tillbaka Thanh Hóa; i femtio år behärskar Lêdynastin (med Trịnh- och Nguyễnfurstarna) södra delen och Mạcdynastin norra.
  After the death of Hkonmaing, the Shan king of Ava, Ava makes peace with Toungoo and cedes the land down to Pagan.: Sedan Hkonmaing, shankungen i Ava, har dött sluter Ava fred med Toungooriket och avträder landet ned till Pagan.
  "Sultan Trenggana of Demak dies before Panarukan, and Demak’s realm falls apart: Surabaya leads the east, and Jaka Tingkir, lord of Pajang, rises in the interior.": "Sultan Trenggana av Demak dör inför Panarukan, och Demaks rike faller sönder: Surabaya leder östra delen, och Jaka Tingkir, herre över Pajang, växer sig stark i inlandet."
  About 1550. Palembang, a vassal of Demak and later Mataram, is ruled by a Javanese dynasty; it becomes a sultanate in 1659. Jambi has its own Malay rulers.: Omkring 1550. Palembang, vasall under Demak och senare Mataram, styrs av en javanesisk dynasti; det blir sultanat 1659. Jambi har egna malajiska härskare.
  Bayinnaung of Toungoo takes Ava from the Shan, and in 1557 the Shan states become his vassals.: Toungookungen Bayinnaung tar Ava från shanerna, och 1557 blir shanstaterna hans vasaller.
  Bayinnaung of Toungoo takes Chiang Mai; Lan Na becomes a Burmese vassal kingdom and, from 1578, is ruled by Burmese princes and governors.: Toungookungen Bayinnaung intar Chiang Mai; Lan Na blir ett burmesiskt vasallkungarike och styrs från 1578 av burmesiska prinsar och guvernörer.
  Aceh conquers Aru on the east coast of Sumatra.: Aceh erövrar Aru på Sumatras östkust.
  Miguel López de Legazpi lands at Cebu and founds the first Spanish settlement in the Philippines.: Miguel López de Legazpi landstiger på Cebu och grundar den första spanska bosättningen i Filippinerna.
  Jaka Tingkir, as Sultan Hadiwijaya, makes Pajang the heir of Demak in the interior of Central Java.: Jaka Tingkir gör som sultan Hadiwijaya Pajang till Demaks arvtagare i Centrala Javas inland.
  The Spanish move to Panay.: Spanjorerna flyttar till Panay.
  Legazpi founds Spanish Manila on the site of the Muslim town of Maynila, taken the year before, and makes it the capital of the Spanish East Indies; the towns of the Manila Bay plain and Mindoro submit.: Legazpi grundar det spanska Manila på platsen för den muslimska staden Maynila, som intogs året innan, och gör det till huvudstad i Spanska Ostindien; städerna på slätten kring Manilabukten och Mindoro underkastar sig.
  In 1572–1574 Juan de Salcedo’s expeditions bring the Ilocos coast, Pangasinan and the Bicol peninsula under Spain, and the rest of the Visayas follow.: Åren 1572–1574 lägger Juan de Salcedos expeditioner Ilocoskusten, Pangasinan och Bicolhalvön under Spanien, och resten av Visayasöarna följer.
  Banten takes Pakuan Pajajaran, the capital of Sunda, and the Hindu kingdom of Sunda comes to an end; Sumedang Larang, which claims its heritage, keeps the Priangan highlands.: Banten intar Pakuan Pajajaran, Sundas huvudstad, och det hinduiska kungariket Sunda går under; Sumedang Larang, som gör anspråk på dess arv, behåller Prianganhöglandet.
  The Spanish occupy the Cagayan valley in northern Luzon.: Spanjorerna besätter Cagayandalen på norra Luzon.
  Senapati, lord of Mataram, takes over Pajang and founds the Mataram Sultanate.: Senapati, herre över Mataram, tar över Pajang och grundar Mataramsultanatet.
  The Lê and Trịnh retake Thăng Long; the Mạc hold out in Cao Bằng, under Ming and later Qing protection, until 1677.: Lêdynastin och Trịnhfurstarna återtar Thăng Long; Mạcdynastin håller ut i Cao Bằng, under Mingdynastins och senare Qingdynastins beskydd, till 1677.
  Naresuan’s armies take Tavoy and Tenasserim from Burma for Ayutthaya.: Naresuans arméer tar Tavoy och Tenasserim från Burma åt Ayutthaya.
  The governor of Moulmein rises against Pegu and calls in Naresuan; the Burmese garrison abandons Martaban, and the Mon provinces become subject to Ayutthaya.: Guvernören i Moulmein reser sig mot Pegu och kallar in Naresuan; den burmesiska garnisonen överger Martaban, och monernas provinser blir underställda Ayutthaya.
  As the Toungoo empire breaks up, Nawrahta Minsaw, Bayinnaung’s son and viceroy of Lan Na, breaks with Pegu; about 1602 he submits to Naresuan, and Lan Na becomes a vassal of Ayutthaya.: När Toungooriket faller sönder bryter Nawrahta Minsaw, Bayinnaungs son och vicekung i Lan Na, med Pegu; omkring 1602 underkastar han sig Naresuan, och Lan Na blir vasall under Ayutthaya.
  "The Toungoo empire breaks up: the armies of Arakan and of Toungoo’s own lord take and burn Pegu. The Nyaungyan prince holds Ava, and the port of Syriam is left to Arakan and its Portuguese mercenaries.": "Toungooriket faller sönder: Arakans arméer och Toungoos egen furste intar och bränner Pegu. Prinsen av Nyaungyan håller Ava, och hamnen Syriam lämnas åt Arakan och dess portugisiska legosoldater."
  About 1600. Nguyễn Hoàng, governor of Thuận Hóa and Quảng Nam, returns to the south and rules it as his own, the start of Đàng Trong. The Spanish have occupied the north coast of Mindanao (Caraga and Butuan); around Lake Lanao the Maranao have formed the confederation of the Lanao sultanates (Pat a Pangampong ko Ranao).: Omkring 1600. Nguyễn Hoàng, guvernör i Thuận Hóa och Quảng Nam, återvänder söderut och styr området som sitt eget, början på Đàng Trong. Spanjorerna har besatt Mindanaos nordkust (Caraga och Butuan); kring Lanaosjön har maranaoerna bildat Lanaosultanatens konfederation (Pat a Pangampong ko Ranao).
  Filipe de Brito e Nicote, the Portuguese commander at Syriam, declares for Portugal and rules the port as a Portuguese fort.: Filipe de Brito e Nicote, den portugisiske befälhavaren i Syriam, förklarar sig för Portugal och styr hamnen som ett portugisiskt fort.
  The Dutch East India Company (VOC) takes the Portuguese fort on Ambon, its first territory in the islands.: Nederländska ostindiska kompaniet (VOC) tar det portugisiska fortet på Ambon, kompaniets första territorium i övärlden.
  The Nguyễn take Phú Yên from Champa.: Nguyễnfurstarna tar Phú Yên från Champa.
  Anaukpetlun’s armies bring Lan Na back under Burma, whose vassal kings rule it for more than a century.: Anaukpetluns arméer för Lan Na tillbaka under Burma, vars vasallkungar styr landet i mer än ett sekel.
  Jan Pieterszoon Coen takes Jayakarta from Banten and founds Batavia, the VOC’s capital in Asia.: Jan Pieterszoon Coen tar Jayakarta från Banten och grundar Batavia, VOC:s huvudstad i Asien.
  About 1620. Sumedang Larang, the heir of Sunda in the Priangan highlands, submits to Mataram.: Omkring 1620. Sumedang Larang, Sundas arvtagare i Prianganhöglandet, underkastar sig Mataram.
  Bima, on Sumbawa, becomes a sultanate after Gowa’s conquest and conversion of the island.: Bima på Sumbawa blir ett sultanat sedan Gowa har erövrat ön och omvänt den till islam.
  Pahang, devastated by Aceh in 1617, passes to Johor.: Pahang, som ödelades av Aceh 1617, övergår till Johor.
  Sultan Agung of Mataram conquers Madura.: Sultan Agung av Mataram erövrar Madura.
  Sultan Agung takes Surabaya after a five-year siege; Mataram rules all of Central and East Java except Blambangan.: Sultan Agung intar Surabaya efter fem års belägring; Mataram styr hela Centrala och Östra Java utom Blambangan.
  The VOC and Johor take Malacca from the Portuguese after a five-month siege.: VOC och Johor tar Malacka från portugiserna efter en belägring på fem månader.
  The Nguyễn take Kauthara (Khánh Hòa) from Champa.: Nguyễnfurstarna tar Kauthara (Khánh Hòa) från Champa.
  The Spanish build the fort of Taytay in northern Palawan, where the Calamianes and Cuyo have had Spanish missions since the 1620s.: Spanjorerna bygger fortet Taytay på norra Palawan, där Calamianes- och Cuyoöarna har haft spanska missioner sedan 1620-talet.
  By the Treaty of Bongaya, after its defeat by the VOC and Bone, Gowa loses its overseas vassals and hands the fort of Makassar to the Company; Bone becomes the leading power of South Sulawesi.: Gowa, besegrat av VOC och Bone, förlorar genom fördraget i Bongaya sina vasaller på andra sidan havet och överlämnar fortet i Makassar till kompaniet; Bone blir den ledande makten på södra Sulawesi.
  Deli, on the east coast of Sumatra, throws off the overlordship of Aceh.: Deli på Sumatras östkust skakar av sig Acehs överhöghet.
  The Lê and Trịnh take Cao Bằng, the last stronghold of the Mạc.: Lêdynastin och Trịnhfurstarna tar Cao Bằng, Mạcdynastins sista fäste.
  A treaty with Sultan Amsterdam of Ternate, in force from 11 May 1677, hands Ternate’s possessions in Sulawesi, Gorontalo and Limboto among them, to the VOC.: Ett fördrag med sultan Amsterdam av Ternate, i kraft från den 11 maj 1677, överlämnar Ternates besittningar på Sulawesi, bland dem Gorontalo och Limboto, till VOC.
  The chiefs of Minahasa, in northern Sulawesi, sign a treaty with the VOC, which has replaced the Spanish at Manado.: Hövdingarna i Minahasa på norra Sulawesi sluter ett fördrag med VOC, som har ersatt spanjorerna i Manado.
  Sultan Amsterdam of Ternate, defeated in his war against the VOC, signs a treaty that makes Ternate a fief of the Company, which takes over its sovereignty and more of its lands; his predecessor Mandar Syah had already given up Ternate’s claims in the central Moluccas in return for the Company’s help against rebels.: Sultan Amsterdam av Ternate, besegrad i sitt krig mot VOC, undertecknar ett fördrag som gör Ternate till ett län under kompaniet, som tar över dess suveränitet och mer av dess land; hans företrädare Mandar Syah hade redan avstått från Ternates anspråk i de centrala Moluckerna i utbyte mot kompaniets hjälp mot rebeller.
  The English East India Company founds Bencoolen (Bengkulu) on the west coast of Sumatra.: Engelska ostindiska kompaniet grundar Bencoolen (Bengkulu) på Sumatras västkust.
  Nguyễn Hữu Cảnh organises the Đồng Nai and Saigon (Prey Nokor) country, long settled by Vietnamese under Cambodian rule, as the Nguyễn prefecture of Gia Định.: Nguyễn Hữu Cảnh organiserar landet kring Đồng Nai och Saigon (Prey Nokor), som länge har befolkats av vietnameser under kambodjanskt styre, som Nguyễnfurstarnas prefektur Gia Định.
  The first Portuguese governor of Timor settles at Lifau (Oecusse); the Timorese kingdoms of the east are drawn into a loose Portuguese overlordship. Dili becomes the capital in 1769.: Den förste portugisiske guvernören på Timor slår sig ned i Lifau (Oecusse); de timoresiska kungarikena i öster dras in under en lös portugisisk överhöghet. Dili blir huvudstad 1769.
  About 1704. Brunei cedes north-eastern Borneo to Sulu, by Sulu’s account in return for help in a Brunei civil war; some sources date the cession to 1658, and Brunei’s tradition denies it. Sulu also claims southern Palawan.: Omkring 1704. Brunei avträder nordöstra Borneo till Sulu, enligt Sulus version i utbyte mot hjälp i ett inbördeskrig i Brunei; vissa källor daterar avträdelsen till 1658, och Bruneis tradition förnekar den. Sulu gör också anspråk på södra Palawan.
  Mataram cedes the eastern Priangan and Cirebon to the VOC for its help in the First Javanese War of Succession; the western Priangan and Semarang had been ceded in 1677–1678, for the Company’s help against Trunajaya.: Mataram avträder östra Priangan och Cirebon till VOC för dess hjälp i första javanesiska tronföljdskriget; västra Priangan och Semarang hade avträtts 1677–1678 för kompaniets hjälp mot Trunajaya.
  Lan Xang splits into the kingdoms of Luang Prabang and Vientiane; Muang Phuan (Xieng Khouang) goes its own way between them.: Lan Xang delas i kungarikena Luang Prabang och Vientiane; Muang Phuan (Xieng Khouang) går sin egen väg mellan dem.
  Nokasad, a grandson of the last king of Lan Xang, founds the kingdom of Champasak in the south.: Nokasad, en sonson till Lan Xangs siste kung, grundar kungariket Champasak i söder.
  The Spanish rebuild their fort at Zamboanga, first held from 1635 to 1663.: Spanjorerna bygger upp sitt fort i Zamboanga igen, som de första gången höll från 1635 till 1663.
  Raja Kecil, who has fought Johor for its throne, founds the sultanate of Siak, until then a Johor dependency, on the east coast of Sumatra.: Raja Kecil, som har kämpat mot Johor om dess tron, grundar sultanatet Siak, dittills ett lydland under Johor, på Sumatras östkust.
  About 1725. Terengganu becomes a sultanate of its own under Zainal Abidin I, a younger brother of the Johor sultan Abdul Jalil IV; Terengganu’s own tradition dates his rule from 1708.: Omkring 1725. Terengganu blir ett eget sultanat under Zainal Abidin I, en yngre bror till Johorsultanen Abdul Jalil IV; Terengganus egen tradition daterar hans styre från 1708.
  Chiang Mai rises against Burmese rule, and Burmese control of Lan Na falls apart as the Toungoo kingdom declines; only Chiang Saen keeps a Burmese governor. Lan Na’s principalities are independent until 1763.: Chiang Mai reser sig mot det burmesiska styret, och Burmas kontroll över Lan Na faller sönder i takt med att Toungooriket försvagas; bara Chiang Saen behåller en burmesisk guvernör. Lan Nas furstendömen är självständiga till 1763.
  The Nguyễn set up the Định Viễn district at Vĩnh Long, pushing further into the Mekong delta.: Nguyễnfurstarna upprättar distriktet Định Viễn i Vĩnh Long och tränger längre in i Mekongdeltat.
  The Mon of Lower Burma rise against Ava and restore the kingdom of Hanthawaddy at Pegu.: Monerna i Nedre Burma reser sig mot Ava och återupprättar kungariket Hanthawaddy i Pegu.
  About 1740. The Balinese kingdom of Karangasem conquers Lombok.: Omkring 1740. Det balinesiska kungariket Karangasem erövrar Lombok.
  Pakubuwono II cedes the north coast of Java and Madura to the VOC for its help against the Chinese War rebels.: Pakubuwono II avträder Javas nordkust och Madura till VOC för dess hjälp mot rebellerna i kinesiska kriget.
  The VOC and its Timorese allies defeat the Topasses (Portuguese-speaking mestizos from Larantuka) at Penfui near Kupang; West Timor passes to the Company’s sphere.: VOC och dess timoresiska bundsförvanter besegrar topasserna (portugisisktalande mestiser från Larantuka) vid Penfui nära Kupang; Västtimor övergår till kompaniets intressesfär.
  Alaungpaya, headman of Moksobo (Shwebo), refuses to submit to the Mon armies besieging Ava, proclaims himself king and founds the Konbaung dynasty.: Alaungpaya, byhövding i Moksobo (Shwebo), vägrar underkasta sig de monska arméer som belägrar Ava, utropar sig till kung och grundar Konbaungdynastin.
  Hanthawaddy’s army takes Ava, ending the Toungoo dynasty.: Hanthawaddys armé intar Ava, vilket gör slut på Toungoodynastin.
  Konbaung forces under Alaungpaya’s son Hsinbyushin retake Ava.: Konbaungstyrkor under Alaungpayas son Hsinbyushin återtar Ava.
  The Treaty of Giyanti divides Mataram between Pakubuwono III at Surakarta and his uncle Mangkubumi, now Sultan Hamengkubuwono I, at Yogyakarta; their outer provinces are divided in a patchwork, which the map simplifies.: Fördraget i Giyanti delar Mataram mellan Pakubuwono III i Surakarta och hans onkel Mangkubumi, nu sultan Hamengkubuwono I, i Yogyakarta; deras yttre provinser delas upp i ett lapptäcke, som kartan förenklar.
  Cambodia cedes the rest of the Mekong delta (Trà Vinh, Sóc Trăng and the Bassac) to the Nguyễn; Hà Tiên, ruled by the Mạc family as a Nguyễn vassal since 1708, joins it.: Kambodja avträder resten av Mekongdeltat (Trà Vinh, Sóc Trăng och Bassac) till Nguyễnfurstarna; Hà Tiên, som sedan 1708 har styrts av familjen Mạc som Nguyễnfurstarnas vasall, ansluter sig.
  Alaungpaya takes Pegu and destroys the restored kingdom of Hanthawaddy.: Alaungpaya intar Pegu och krossar det återupprättade kungariket Hanthawaddy.
  Konbaung armies, based at Chiang Saen, take Chiang Mai and bring Lan Na under direct Burmese rule.: Konbaungarméer med bas i Chiang Saen intar Chiang Mai och lägger Lan Na under direkt burmesiskt styre.
  Konbaung armies take Mergui and Tenasserim on their way to Ayutthaya.: Konbaungarméer intar Mergui och Tenasserim på väg mot Ayutthaya.
  About 1766. Raja Lumu, of the Bugis family that rules in Riau, becomes the first sultan of Selangor.: Omkring 1766. Raja Lumu, av den buginesiska släkt som härskar i Riau, blir Selangors förste sultan.
  Ayutthaya falls to the Burmese and is destroyed. The Burmese hold the lower Chao Phraya; elsewhere Siam breaks up among rival regimes at Phitsanulok, Fang, Phimai and Nakhon Si Thammarat.: Ayutthaya faller i burmesernas händer och förstörs. Burmeserna håller nedre Chao Phraya; i övrigt splittras Siam mellan rivaliserande regimer i Phitsanulok, Fang, Phimai och Nakhon Si Thammarat.
  Phraya Tak (Taksin) takes Chanthaburi, the base for his reconquest.: Phraya Tak (Taksin) intar Chanthaburi, basen för hans återerövring.
  Taksin takes Thonburi and then the Burmese camp at Pho Sam Ton, and makes Thonburi his capital; he is crowned on 28 December.: Taksin intar Thonburi och därefter det burmesiska lägret vid Pho Sam Ton och gör Thonburi till sin huvudstad; han kröns den 28 december.
  Taksin defeats the Phimai regime on the Khorat plateau.: Taksin besegrar regimen i Phimai på Khoratplatån.
  The VOC conquers Blambangan, at the eastern end of Java, after a war with its Balinese-backed rulers; resistance goes on until 1772.: VOC erövrar Blambangan på Javas östspets efter ett krig mot dess härskare, som stöddes av Bali; motståndet fortsätter till 1772.
  Taksin defeats the Nakhon Si Thammarat regime in the south.: Taksin besegrar regimen i Nakhon Si Thammarat i söder.
  Taksin defeats the regimes of Phitsanulok and Fang and reunites Siam.: Taksin besegrar regimerna i Phitsanulok och Fang och återförenar Siam.
  Syarif Abdurrahman Alkadrie founds Pontianak at the mouth of the Kapuas.: Syarif Abdurrahman Alkadrie grundar Pontianak vid Kapuasflodens mynning.
  The Tây Sơn brothers, who rose in 1771, take Quy Nhơn.: Tây Sơn-bröderna, som reste sig 1771, intar Quy Nhơn.
  The Minangkabau chiefs of the Negeri Sembilan bring Raja Melewar from Pagaruyung as their ruler, the first Yang di-Pertuan Besar.: Minangkabauhövdingarna i Negeri Sembilan hämtar Raja Melewar från Pagaruyung som sin härskare, den förste Yang di-Pertuan Besar.
  A Trịnh army from the north takes Phú Xuân (Huế), the Nguyễn capital, while the Tây Sơn take Quảng Nam, Quảng Ngãi and Phú Yên.: En Trịnharmé från norr intar Phú Xuân (Huế), Nguyễnfurstarnas huvudstad, medan Tây Sơn tar Quảng Nam, Quảng Ngãi och Phú Yên.
  Chiang Mai, with its Lan Na lords Kawila and Chaban, goes over to Taksin; Lan Na becomes a vassal kingdom of Siam. Chiang Saen stays Burmese until 1804.: Chiang Mai går med sina Lan Na-furstar Kawila och Chaban över till Taksin; Lan Na blir ett vasallkungarike under Siam. Chiang Saen förblir burmesiskt till 1804.
  The Tây Sơn take Gia Định and kill the Nguyễn lords; only a nephew, Nguyễn Ánh, escapes.: Tây Sơn intar Gia Định och dödar Nguyễnfurstarna; bara en brorson, Nguyễn Ánh, kommer undan.
  Nguyễn Ánh retakes Gia Định and holds the south, apart from a Tây Sơn offensive in 1782, until 1783.: Nguyễn Ánh återtar Gia Định och håller södern, frånsett en Tây Sơn-offensiv 1782, fram till 1783.
  The VOC deposes the sultan of Tidore and makes the sultanate a fief of the Company, which takes over its sovereignty; Prince Nuku’s rebellion against it lasts until 1805.: VOC avsätter sultanen av Tidore och gör sultanatet till ett län under kompaniet, som tar över dess suveränitet; prins Nukus uppror mot kompaniet varar till 1805.
  The Spanish occupy the Batanes Islands.: Spanjorerna besätter Batanesöarna.
  The Tây Sơn drive Nguyễn Ánh out of the Mekong delta; he takes refuge in Siam, whose army the Tây Sơn rout at Rạch Gầm–Xoài Mút in 1785.: Tây Sơn driver ut Nguyễn Ánh ur Mekongdeltat; han tar sin tillflykt till Siam, vars armé Tây Sơn krossar vid Rạch Gầm–Xoài Mút 1785.
  Bodawpaya’s army takes Mrauk U and annexes Arakan to Burma.: Bodawpayas armé intar Mrauk U och annekterar Arakan till Burma.
  The Tây Sơn take Phú Xuân from the Trịnh, then march north, end the rule of the Trịnh lords and leave the north to the Lê emperor.: Tây Sơn tar Phú Xuân från Trịnhfurstarna, marscherar sedan norrut, gör slut på Trịnhfurstarnas styre och lämnar norra delen åt Lêkejsaren.
  Francis Light takes possession of Penang, leased from Kedah, for the East India Company; Province Wellesley on the mainland follows in 1800.: Francis Light tar Penang, som har arrenderats från Kedah, i besittning för Brittiska ostindiska kompaniet; Province Wellesley på fastlandet följer 1800.
  The Tây Sơn take Thăng Long, and the Lê emperor Lê Chiêu Thống flees to the Qing.: Tây Sơn intar Thăng Long, och Lêkejsaren Lê Chiêu Thống flyr till Qingdynastin.
  Nguyễn Ánh, back from exile in Siam, retakes Gia Định (Saigon) and makes it his base; French volunteers raised by Pigneau de Behaine join him from 1789.: Nguyễn Ánh, som har återvänt från exilen i Siam, återtar Gia Định (Saigon) och gör det till sin bas; franska frivilliga som Pigneau de Behaine har värvat ansluter sig till honom från 1789.
  Siam annexes Battambang and Siem Reap, the north-west of Cambodia, and takes the coast of Koh Kong under its own administration.: Siam annekterar Battambang och Siem Reap, Kambodjas nordvästra del, och lägger kusten vid Koh Kong under egen förvaltning.
  British forces take Malacca from the Dutch, whose country is now ruled by revolutionary France; the British keep it until 1818.: Brittiska styrkor tar Malacka från holländarna, vars land nu styrs av det revolutionära Frankrike; britterna behåller det till 1818.
  Nguyễn Ánh takes Quy Nhơn; the coast from Bình Định to Bình Thuận is his.: Nguyễn Ánh intar Quy Nhơn; kusten från Bình Định till Bình Thuận är hans.
  Nguyễn Ánh takes Phú Xuân (Huế).: Nguyễn Ánh intar Phú Xuân (Huế).
  Nguyễn Ánh, crowned as the Gia Long emperor on 1 June, takes Thăng Long; the Tây Sơn are destroyed and Vietnam is united under the Nguyễn.: Nguyễn Ánh, som har krönts till kejsar Gia Long den 1 juni, intar Thăng Long; Tây Sơn krossas och Vietnam enas under Nguyễndynastin.
  Siamese and Lan Na forces take Chiang Saen, the last Burmese stronghold in Lan Na.: Siamesiska styrkor och styrkor från Lan Na intar Chiang Saen, burmesernas sista fäste i Lan Na.
  Java and the Dutch posts surrender to a British expedition from India at Tuntang; the Moluccas have been British since 1810. Raffles governs for the East India Company until 1816.: Java och de holländska utposterna kapitulerar för en brittisk expedition från Indien vid Tuntang; Moluckerna har varit brittiska sedan 1810. Raffles styr för Brittiska ostindiska kompaniets räkning till 1816.
  British troops storm the kraton of Yogyakarta; the sultan is deposed and Kedu is annexed (the map draws Kedu with Bagelen and Banyumas, which follow in 1830). Palembang cedes Bangka to the British.: Brittiska trupper stormar kratonen i Yogyakarta; sultanen avsätts och Kedu annekteras (kartan ritar Kedu tillsammans med Bagelen och Banyumas, som följer 1830). Palembang avträder Bangka till britterna.
  Raffles ends the sultanate of Banten; its Lampung lands in Sumatra are left to their own chiefs.: Raffles gör slut på sultanatet Banten; dess Lampungområden på Sumatra lämnas åt sina egna hövdingar.
  Siam takes Melou Prey and Tonle Repou, the north of Cambodia between the Dângrêk range and the Mekong.: Siam tar Melou Prey och Tonle Repou, norra Kambodja mellan Dângrêkbergen och Mekong.
  Java and the other Dutch possessions are handed back to the Netherlands, now a kingdom, under the Anglo-Dutch convention of 1814.: Java och de övriga holländska besittningarna lämnas tillbaka till Nederländerna, nu ett kungarike, enligt den brittisk-nederländska konventionen 1814.
  The British hand Malacca back to the Dutch.: Britterna lämnar tillbaka Malacka till holländarna.
  The Dutch reassert their authority over Pontianak and the coast of western Borneo.: Holländarna återupprättar sin myndighet över Pontianak och västra Borneos kust.
  Minangkabau chiefs at Padang, at war with the Padri, cede the Pagaruyung lands to the Dutch, who need until 1838 to conquer them.: Minangkabauhövdingar i Padang, i krig med padrierna, avträder Pagaruyungs land till holländarna, som behöver ända till 1838 för att erövra det.
  Siam invades Kedah, whose sultan it suspects of an alliance with Burma, and rules it directly; the sultan flees to Penang.: Siam invaderar Kedah, vars sultan Siam misstänker för en allians med Burma, och styr landet direkt; sultanen flyr till Penang.
  After its wars with the Dutch (1819–1821), the sultanate of Palembang is abolished.: Efter sina krig med holländarna (1819–1821) avskaffas sultanatet Palembang.
  "The Sultan of Johor and the Temenggong cede Singapore, where the East India Company has had a post since 1819, to the Company outright. By the Anglo-Dutch Treaty of March 1824 the Johor realm is split: Johor and Pahang in the British sphere, Riau-Lingga in the Dutch.": "Sultanen av Johor och temenggongen avträder Singapore, där Brittiska ostindiska kompaniet har haft en handelsstation sedan 1819, helt och hållet till kompaniet. Genom det brittisk-nederländska fördraget i mars 1824 delas Johors rike: Johor och Pahang hamnar i den brittiska intressesfären, Riau-Lingga i den nederländska."
  "The Anglo-Dutch Treaty of 1824 takes effect: the Dutch hand Malacca to Britain and receive Bencoolen.": "Det brittisk-nederländska fördraget från 1824 träder i kraft: holländarna överlämnar Malacka till Storbritannien och får Bencoolen."
  The East India Company joins Penang, Malacca and Singapore as the Straits Settlements.: Brittiska ostindiska kompaniet förenar Penang, Malacka och Singapore till Straits Settlements.
  "The Treaty of Yandabo ends the First Anglo-Burmese War: Burma cedes Arakan and Tenasserim (the coast south and east of the Salween) to the East India Company, and gives up Assam and Manipur.": "Fördraget i Yandabo avslutar första anglo-burmesiska kriget: Burma avträder Arakan och Tenasserim (kusten söder och öster om Salween) till Brittiska ostindiska kompaniet och avsäger sig Assam och Manipur."
  Siam, overlord of the Lao kingdoms since it took Vientiane in 1779, crushes the rebellion of Anouvong, destroys Vientiane and annexes the kingdom; the Khorat plateau’s Lao principalities come under Bangkok’s governors.: Siam, de laotiska kungarikenas överherre sedan det intog Vientiane 1779, krossar Anouvongs uppror, förstör Vientiane och annekterar kungariket; Khoratplatåns laotiska furstendömen kommer under Bangkoks guvernörer.
  The Dutch proclaim their sovereignty over the south-western coast of New Guinea at Fort Du Bus on Triton Bay, claiming the island west of 141° E; their rule stays nominal until posts are founded in 1898.: Holländarna utropar sin suveränitet över Nya Guineas sydvästkust vid Fort Du Bus vid Tritonbukten och gör anspråk på ön väster om 141° O; deras styre förblir nominellt tills utposter grundas 1898.
  "After the Java War the Dutch annex the outer provinces of Yogyakarta and Surakarta: Banyumas, Bagelen, Madiun and Kediri.": "Efter Javakriget annekterar holländarna Yogyakartas och Surakartas yttre provinser: Banyumas, Bagelen, Madiun och Kediri."
  The Minh Mạng emperor abolishes the Cham principality of Panduranga (Thuận Thành), a Nguyễn vassal since 1697, and annexes it.: Kejsar Minh Mạng avskaffar chamernas furstendöme Panduranga (Thuận Thành), en Nguyễnvasall sedan 1697, och annekterar det.
  The Minh Mạng emperor annexes Muang Phuan (Xieng Khouang), whose ruler Chao Noi he has had executed, as the Vietnamese prefecture of Trấn Ninh.: Kejsar Minh Mạng annekterar Muang Phuan (Xieng Khouang), vars härskare Chao Noi han har låtit avrätta, som den vietnamesiska prefekturen Trấn Ninh.
  The Minh Mạng emperor annexes Cambodia as the province of Trấn Tây, with the princess Ang Mey as a figurehead.: Kejsar Minh Mạng annekterar Kambodja som provinsen Trấn Tây, med prinsessan Ang Mey som galjonsfigur.
  Vietnam gives up its province in Cambodia after risings and war with Siam; Ang Duong becomes king in 1848 under the joint overlordship of Siam and Vietnam.: Vietnam ger upp sin provins i Kambodja efter resningar och krig med Siam; Ang Duong blir kung 1848 under Siams och Vietnams gemensamma överhöghet.
  James Brooke, an English adventurer who has helped put down a revolt for Brunei, is made Rajah of Sarawak (the Kuching river country) by the sultan’s uncle, Pengiran Muda Hashim; the sultan confirms the grant in 1842.: James Brooke, en engelsk äventyrare som har hjälpt till att slå ned en revolt åt Brunei, utses till raja av Sarawak (landet kring Kuchingfloden) av sultanens onkel, Pengiran Muda Hashim; sultanen bekräftar förläningen 1842.
  Siam restores the Kedah sultanate, but keeps Perlis and Setul (Satun) apart from it; Setul is ruled by its own raja under Bangkok.: Siam återupprättar sultanatet Kedah men håller Perlis och Setul (Satun) åtskilda från det; Setul styrs av sin egen raja under Bangkok.
  Perlis becomes a separate kingdom under Siamese overlordship.: Perlis blir ett eget kungarike under siamesisk överhöghet.
  Kutai accepts Dutch sovereignty after a Dutch punitive expedition, sent once the sultan’s forces had driven off the British adventurer James Erskine Murray, who was killed trying to settle there.: Kutai godtar holländsk suveränitet efter en holländsk straffexpedition, som sändes sedan sultanens styrkor hade drivit bort den brittiske äventyraren James Erskine Murray, som dödades när han försökte slå sig ned där.
  The Spanish occupy Basilan, which France had tried to acquire from Sulu, and build the fort of Isabela.: Spanjorerna besätter Basilan, som Frankrike hade försökt förvärva från Sulu, och bygger fortet Isabela.
  Brunei cedes the island of Labuan to Britain.: Brunei avträder ön Labuan till Storbritannien.
  "Muang Phuan has its own princes again: Chao Po, a son of Chao Noi, rules it from 1848 as a vassal of the Vietnamese emperors, and after a rising in the mid-1850s it pays tribute to Siam as well.": "Muang Phuan har åter egna furstar: Chao Po, en son till Chao Noi, styr det från 1848 som vasall under de vietnamesiska kejsarna, och efter en resning i mitten av 1850-talet betalar det tribut även till Siam."
  The Spanish found a settlement at Davao after a campaign against its Muslim ruler; missions and military posts reach the Bukidnon plateau in the following decades.: Spanjorerna grundar en bosättning i Davao efter ett fälttåg mot dess muslimske härskare; missioner och militärposter når Bukidnonplatån under de följande decennierna.
  The Dutch take Jagaraga at the third attempt and bring Buleleng and Jembrana, in northern and western Bali, under their rule.: Holländarna intar Jagaraga i tredje försöket och lägger Buleleng och Jembrana, på norra och västra Bali, under sitt styre.
  Britain annexes Pegu (Lower Burma) after the Second Anglo-Burmese War; the frontier runs about 80 km north of Prome and Toungoo.: Storbritannien annekterar Pegu (Nedre Burma) efter andra anglo-burmesiska kriget; gränsen går omkring 80 km norr om Prome och Toungoo.
  Brooke Sarawak acquires the Saribas and Batang Lupar country.: Brookes Sarawak förvärvar landet kring Saribas och Batang Lupar.
  About 1853. Pahang’s Bendahara rules as an independent sovereign; the Pahang civil war (1857–1863) brings Wan Ahmad to power, as sultan from 1881.: Omkring 1853. Pahangs bendahara styr som självständig suverän; inbördeskriget i Pahang (1857–1863) för Wan Ahmad till makten, som sultan från 1881.
  The Dutch conquer Lampung after the death of the resistance leader Raden Intan II.: Holländarna erövrar Lampung efter motståndsledaren Raden Intan II:s död.
  Siak signs a treaty with the Netherlands that makes it and its dependencies part of the Dutch East Indies.: Siak sluter ett fördrag med Nederländerna som gör det och dess lydländer till en del av Nederländska Ostindien.
  By the Treaty of Lisbon (signed 1859, in force 1860) Portugal sells its claims on Flores, Solor and Alor to the Netherlands; the Dutch claim the islands east of Bali, though their rule there long stays nominal. Portugal receives Maubara on Timor.: Genom fördraget i Lissabon (undertecknat 1859, i kraft 1860) säljer Portugal sina anspråk på Flores, Solor och Alor till Nederländerna; holländarna gör anspråk på öarna öster om Bali, även om deras styre där länge förblir nominellt. Portugal får Maubara på Timor.
  Spanish military districts are set up in the Cordillera of northern Luzon (Benguet, Lepanto, Bontoc) and in Nueva Vizcaya from the 1840s to the 1850s.: Spanska militärdistrikt upprättas i Cordillera på norra Luzon (Benguet, Lepanto, Bontoc) och i Nueva Vizcaya från 1840-talet till 1850-talet.
  The Dutch abolish the sultanate of Banjar during the Banjarmasin War; resistance goes on in the interior until 1905.: Holländarna avskaffar sultanatet Banjar under Banjarmasinkriget; motståndet i inlandet fortsätter till 1905.
  Brunei cedes the Rajang, Mukah and Bintulu country to Sarawak. The Spanish occupy Cotabato, the centre of Maguindanao.: Brunei avträder landet kring Rajang, Mukah och Bintulu till Sarawak. Spanjorerna besätter Cotabato, Maguindanaos centrum.
  The Dutch establish their rule over Deli and the east coast of Sumatra, now opening to tobacco planting.: Holländarna upprättar sitt styre över Deli och Sumatras östkust, som nu öppnas för tobaksodling.
  By the Treaty of Saigon the Tự Đức emperor cedes the three eastern provinces of Cochinchina — Biên Hòa, Gia Định and Định Tường — to France.: Genom fördraget i Saigon avträder kejsar Tự Đức Cochinkinas tre östra provinser – Biên Hòa, Gia Định och Định Tường – till Frankrike.
  France annexes the three western provinces of Cochinchina — Vĩnh Long, An Giang and Hà Tiên.: Frankrike annekterar Cochinkinas tre västra provinser – Vĩnh Long, An Giang och Hà Tiên.
  The Spanish found Puerto Princesa and occupy southern Palawan, which the Sultan of Sulu claimed. After the capture of Jolo (1876) the sultan accepts Spanish sovereignty in the protocol of 1878, but keeps his internal rule; the map shows Sulu as its own state until 1904.: Spanjorerna grundar Puerto Princesa och besätter södra Palawan, som sultanen av Sulu gjorde anspråk på. Efter erövringen av Jolo (1876) godtar sultanen spansk suveränitet i protokollet 1878 men behåller sitt inre styre; kartan visar Sulu som en egen stat till 1904.
  After taking the kraton of Aceh at Kutaraja, the Dutch proclaim the sultanate annexed; the war in the rest of Aceh lasts thirty years.: Sedan holländarna har intagit Acehs kraton i Kutaraja förklarar de sultanatet annekterat; kriget i resten av Aceh varar i trettio år.
  Britain and Burma agree to recognise the independence of the Karenni (Red Karen) states.: Storbritannien och Burma kommer överens om att erkänna självständigheten för Karennistaterna (de röda karenernas stater).
  The British North Borneo Company receives its royal charter for the lands leased from Brunei and Sulu in 1877–1878.: Brittiska Nordborneokompaniet får sitt kungliga privilegiebrev för de områden som arrenderades från Brunei och Sulu 1877–1878.
  Brunei cedes the Baram to Sarawak.: Brunei avträder Baram till Sarawak.
  Britain annexes Upper Burma after the Third Anglo-Burmese War; the Shan states submit in 1887–1890, and the Kachin and Chin hills are occupied in the following years.: Storbritannien annekterar Övre Burma efter tredje anglo-burmesiska kriget; shanstaterna underkastar sig 1887–1890, och Kachin- och Chinbergen besätts under de följande åren.
  The Đồng Khánh emperor cedes Hanoi, Haiphong and Tourane (Đà Nẵng), French concessions since the 1870s and 1880s, to full French sovereignty.: Kejsar Đồng Khánh avträder Hanoi, Haiphong och Tourane (Đà Nẵng), franska koncessioner sedan 1870- och 1880-talen, med full suveränitet till Frankrike.
  The Chin Hills are occupied by British columns in the Chin–Lushai expedition (1889–1890). Sarawak annexes Limbang; Trusan had been ceded to it in 1885, and Lawas follows in 1905.: Chinbergen besätts av brittiska kolonner under Chin–Lushai-expeditionen (1889–1890). Sarawak annekterar Limbang; Trusan hade avträtts till Sarawak 1885, och Lawas följer 1905.
  The British North Borneo Company takes over the administration of Labuan.: Brittiska Nordborneokompaniet tar över förvaltningen av Labuan.
  After the Paknam crisis, Siam cedes to France all its land on the left bank of the Mekong; the kingdom of Luang Prabang becomes a French protectorate, while its lands on the right bank (Sainyabuli) stay with Siam. France also claims the Central Highlands of Vietnam, where it sets up posts in the following years.: Efter Paknamkrisen avträder Siam allt sitt land på Mekongs vänstra strand till Frankrike; kungariket Luang Prabang blir ett franskt protektorat, medan dess land på högra stranden (Sainyabuli) stannar hos Siam. Frankrike gör också anspråk på Vietnams centrala högland, där det upprättar poster under de följande åren.
  A Dutch expedition takes Cakranegara and ends the Balinese kingdom of Lombok.: En holländsk expedition intar Cakranegara och gör slut på det balinesiska kungariket på Lombok.
  The Spanish take Marawi on Lake Lanao after a campaign against the Lanao sultanates.: Spanjorerna intar Marawi vid Lanaosjön efter ett fälttåg mot Lanaosultanaten.
  Perak, Selangor, Negeri Sembilan and Pahang, under British residents since 1874–1888, form the Federated Malay States under the Treaty of Federation signed in July 1895.: Perak, Selangor, Negeri Sembilan och Pahang, som har stått under brittiska residenter sedan 1874–1888, bildar Federerade malajstaterna genom det federationsfördrag som undertecknas i juli 1895.
  "The office of the viceroy (kinh lược) of Tonkin is abolished and its powers pass to the French résident supérieur: Tonkin is ruled directly as part of French Indochina, while Annam keeps the Nguyễn court at Huế.": "Ämbetet som vicekung (kinh lược) i Tonkin avskaffas och dess befogenheter övergår till den franske résident supérieur: Tonkin styrs direkt som en del av Franska Indokina, medan Annam behåller Nguyễnhovet i Huế."
  The kingdom of Lan Na loses its autonomy with the creation of the Siamese province (monthon) of Phayap.: Kungariket Lan Na förlorar sitt självstyre när den siamesiska provinsen (monthon) Phayap bildas.
  "The Treaty of Paris (1898) comes into force: Spain cedes the Philippines to the United States. The First Philippine Republic, proclaimed in January, fights the American occupation until 1902; its territory is shown in the war’s steps. In the Bates Treaty of August 1899 the Sultan of Sulu accepts American sovereignty and keeps his internal rule.": "Freden i Paris (1898) träder i kraft: Spanien avträder Filippinerna till USA. Första filippinska republiken, som utropades i januari, bekämpar den amerikanska ockupationen till 1902; dess territorium visas i krigets steg. I Batesfördraget i augusti 1899 godtar sultanen av Sulu amerikansk suveränitet och behåller sitt inre styre."
  Siam deposes Abdul Kadir, the last raja of Pattani, and annexes the seven Malay principalities into which it had divided the old sultanate after Rama I’s conquest of 1786.: Siam avsätter Abdul Kadir, den siste rajan av Pattani, och annekterar de sju malajiska furstendömen som Siam hade delat det gamla sultanatet i efter Rama I:s erövring 1786.
  Sultan Muhammad Daud Syah of Aceh surrenders to the Dutch; the north-east coast of Aceh comes under Dutch rule, though fighting goes on in the Gayo highlands.: Sultan Muhammad Daud Syah av Aceh kapitulerar för holländarna; Acehs nordöstra kust kommer under holländskt styre, men striderna fortsätter i Gayohöglandet.
  By a Franco-Siamese convention Siam cedes Champasak on the right bank of the Mekong, Sainyabuli opposite Luang Prabang, Melou Prey, and Trat with Koh Kong to France. France attaches Stung Treng, Melou Prey and Koh Kong to Cambodia.: Genom en fransk-siamesisk konvention avträder Siam Champasak på Mekongs högra strand, Sainyabuli mitt emot Luang Prabang, Melou Prey samt Trat med Koh Kong till Frankrike. Frankrike förenar Stung Treng, Melou Prey och Koh Kong med Kambodja.
  The United States abrogates the Bates Treaty and rules the Sulu archipelago directly, as a district of the Moro Province.: USA upphäver Batesfördraget och styr Suluarkipelagen direkt, som ett distrikt i Moroprovinsen.
  In the South Sulawesi expeditions the Dutch occupy Bone (July), Luwu, and Gowa (October–December), and bring Bima, Mandar and Central Sulawesi under their rule.: Under expeditionerna till södra Sulawesi besätter holländarna Bone (juli), Luwu och Gowa (oktober–december) och lägger Bima, Mandar och Centrala Sulawesi under sitt styre.
  Buton accepts Dutch sovereignty in the Asyikin–Brugman treaty (8 April), and Jambi, whose last sultan died in 1904, is annexed.: Buton godtar holländsk suveränitet i Asyikin–Brugman-fördraget (8 april), och Jambi, vars siste sultan dog 1904, annekteras.
  Labuan becomes part of the Straits Settlements.: Labuan blir en del av Straits Settlements.
  Siam cedes Battambang, Siem Reap and Sisophon to France, which attaches them to Cambodia, and receives back Trat; Koh Kong stays with Cambodia.: Siam avträder Battambang, Siem Reap och Sisophon till Frankrike, som förenar dem med Kambodja, och får tillbaka Trat; Koh Kong stannar hos Kambodja.
  The Dutch conquest of Bali ends with the puputan, the ritual mass death of the court of Klungkung; Badung and Tabanan fell in 1906.: Den holländska erövringen av Bali avslutas med puputan, den rituella massdöden vid hovet i Klungkung; Badung och Tabanan föll 1906.
  The Dutch depose the last sultan of Riau-Lingga, who has refused to sign an agreement curbing his powers, and rule the sultanate directly; they annex it formally in 1913.: Holländarna avsätter den siste sultanen av Riau-Lingga, som har vägrat underteckna ett avtal som inskränker hans makt, och styr sultanatet direkt; de annekterar det formellt 1913.
  Burma is separated from British India and becomes a colony of its own.: Burma skiljs från Brittiska Indien och blir en egen koloni.
  The Tokyo convention, mediated by Japan after the Franco-Thai War, gives Thailand the lands on the right bank of the Mekong (Sainyabuli and Champasak) and the north-west of Cambodia without Angkor. The Allies do not recognise it, and Thailand returns the lands in 1946.: Tokyokonventionen, som Japan medlade fram efter fransk-thailändska kriget, ger Thailand landet på Mekongs högra strand (Sainyabuli och Champasak) och nordvästra Kambodja utom Angkor. De allierade erkänner den inte, och Thailand lämnar tillbaka områdena 1946.
  Hồ Chí Minh proclaims the Democratic Republic of Vietnam in Hanoi, after the Japanese surrender and the abdication of the emperor Bảo Đại (30 August), which ends the Nguyễn monarchy. France, back in Cochinchina from September, does not recognise its independence; it accepts it as a free state within the French Union in March 1946, and war breaks out in December. The base map keeps French Indochina until the State of Vietnam of 1949; the zones the Democratic Republic held are drawn in the war’s steps.: Hồ Chí Minh utropar Demokratiska republiken Vietnam i Hanoi, efter den japanska kapitulationen och kejsar Bảo Đạis abdikation (30 augusti), som gör slut på Nguyễnmonarkin. Frankrike, som är tillbaka i Cochinkina från september, erkänner inte dess självständighet; i mars 1946 godtar Frankrike den som en fri stat inom Franska unionen, och i december bryter krig ut. Baskartan behåller Franska Indokina fram till Staten Vietnam 1949; de zoner som Demokratiska republiken höll ritas i krigets steg.
  Britain joins the Malay states — the four northern ones under British protection since Siam gave up its rights over them in 1909 — with Penang and Malacca as the Malayan Union, and makes Singapore a separate crown colony.: Storbritannien förenar malajstaterna – de fyra nordliga har stått under brittiskt beskydd sedan Siam avstod från sina rättigheter över dem 1909 – med Penang och Malacka till Malajiska unionen och gör Singapore till en separat kronkoloni.
  The Philippines becomes independent from the United States, as had been laid down in the Tydings–McDuffie Act of 1934.: Filippinerna blir självständigt från USA, i enlighet med Tydings–McDuffie-lagen från 1934.
  North Borneo, with Labuan, becomes a British crown colony.: Nordborneo blir tillsammans med Labuan en brittisk kronkoloni.
  France and the king of Luang Prabang agree on a unified Kingdom of Laos under French protection.: Frankrike och kungen av Luang Prabang kommer överens om ett enat kungarike Laos under franskt beskydd.
  Under the Washington agreement Thailand returns the lands it gained in 1941 to Laos and Cambodia.: Genom Washingtonöverenskommelsen lämnar Thailand tillbaka de områden det vann 1941 till Laos och Kambodja.
  Burma becomes independent as the Union of Burma, with the Shan and Karenni states as member states.: Burma blir självständigt som Unionen Burma, med shan- och karennistaterna som delstater.
  The Federation of Malaya replaces the Malayan Union.: Malajiska federationen ersätter Malajiska unionen.
  France recognises the State of Vietnam under Bảo Đại, with Cochinchina, as an associated state; the United States and Britain recognise it in 1950. The Democratic Republic of Vietnam, recognised by China and the Soviet Union in January 1950, holds much of the countryside; its zones are shown in the war’s steps.: Frankrike erkänner Staten Vietnam under Bảo Đại, med Cochinkina, som associerad stat; USA och Storbritannien erkänner den 1950. Demokratiska republiken Vietnam, som erkändes av Kina och Sovjetunionen i januari 1950, håller stora delar av landsbygden; dess zoner visas i krigets steg.
  The Netherlands transfers sovereignty over the Dutch East Indies, without western New Guinea, to the Republic of the United States of Indonesia; it becomes the unitary Republic of Indonesia on 17 August 1950. Yogyakarta, the seat of the Republic during the revolution, and Surakarta become part of it.: Nederländerna överlåter suveräniteten över Nederländska Ostindien, utom västra Nya Guinea, till Republiken Indonesiens förenta stater; den blir den enhetliga Republiken Indonesien den 17 augusti 1950. Yogyakarta, republikens säte under revolutionen, och Surakarta blir en del av den.
  "The Geneva conference divides Vietnam at the 17th parallel: the Democratic Republic of Vietnam takes the north, the State of Vietnam keeps the south, pending elections that are never held.": "Genèvekonferensen delar Vietnam vid 17:e breddgraden: Demokratiska republiken Vietnam får norra delen, Staten Vietnam behåller södra delen, i väntan på val som aldrig hålls."
  The Federation of Malaya becomes independent within the Commonwealth.: Malajiska federationen blir självständig inom samväldet.
  Under the New York Agreement the Netherlands hands western New Guinea to the United Nations Temporary Executive Authority.: Enligt New York-avtalet överlämnar Nederländerna västra Nya Guinea till FN:s tillfälliga verkställande myndighet.
  UNTEA hands western New Guinea to Indonesia, which holds the Act of Free Choice in 1969.: UNTEA överlämnar västra Nya Guinea till Indonesien, som genomför ”Act of Free Choice” 1969.
  Malaya, Singapore, Sarawak and North Borneo (Sabah), both British crown colonies since 1946, form Malaysia; Brunei stays out.: Malaya, Singapore, Sarawak och Nordborneo (Sabah) – de två sistnämnda brittiska kronkolonier sedan 1946 – bildar Malaysia; Brunei står utanför.
  Singapore leaves Malaysia and becomes independent.: Singapore lämnar Malaysia och blir självständigt.
  North Vietnamese troops take Saigon; the Republic of South Vietnam, under the Provisional Revolutionary Government, replaces the Republic of Vietnam.: Nordvietnamesiska trupper intar Saigon; Republiken Sydvietnam, under den provisoriska revolutionära regeringen, ersätter Republiken Vietnam.
  North and South Vietnam are united as the Socialist Republic of Vietnam.: Nord- och Sydvietnam enas till Socialistiska republiken Vietnam.
  Indonesia, which invaded East Timor in December 1975, annexes it as its 27th province. The United Nations never recognises the annexation and regards Portugal as the administering power; the occupation is shown on the map as the map of its time.: Indonesien, som invaderade Östtimor i december 1975, annekterar det som sin 27:e provins. FN erkänner aldrig annekteringen och betraktar Portugal som administrerande makt; ockupationen visas på kartan så som den tidens kartor visade den.
  Brunei, a British protected state since 1888, becomes fully independent.: Brunei, en brittisk skyddsstat sedan 1888, blir helt självständigt.
  After the independence referendum of 30 August 1999 and the violence that followed, the United Nations takes over the administration of East Timor (UNTAET).: Efter självständighetsfolkomröstningen den 30 augusti 1999 och det våld som följde tar FN över förvaltningen av Östtimor (UNTAET).
  East Timor becomes independent as Timor-Leste.: Östtimor blir självständigt som Timor-Leste.
  North Africa, the Sahel and the Horn about 800. In the Maghreb the Idrisids (from 789) rule around Fez and Tlemcen, the Barghawata the Atlantic plain, the Emirate of Nekor the Rif and the Midrarids Sijilmasa; the Ibadi Rustamids rule from Tahert, and the Aghlabids (from 800) govern Ifriqiya and Tripoli for the Abbasid caliph, whose governors in Egypt hold Barqa. South of the Sahara the Ghana Empire (Wagadu) rules from Koumbi Saleh, Gao (Kawkaw) is a kingdom on the Niger, and Kanem lies north-east of Lake Chad. On the Nile, Christian Makuria and Alwa rule Nubia, and in the highlands the late Kingdom of Aksum survives. Desert and pastoral peoples without a state (the Sanhaja, the Tuareg, the Beja, the Somali and Oromo clans) are shown as no state.: Nordafrika, Sahel och Afrikas horn omkring 800. I Maghreb styr idrisiderna (från 789) kring Fès och Tlemcen, barghawata den atlantiska slätten, emiratet Nekor Rifbergen och midrariderna Sijilmasa; de ibaditiska rustamiderna styr från Tahert, och aghlabiderna (från 800) förvaltar Ifriqiya och Tripoli åt den abbasidiske kalifen, vars ståthållare i Egypten behärskar Barqa. Söder om Sahara styr Ghanariket (Wagadu) från Koumbi Saleh, Gao (Kawkaw) är ett kungarike vid Nigerfloden, och Kanem ligger nordost om Tchadsjön. Vid Nilen styr de kristna rikena Makuria och Alwa Nubien, och i höglandet lever det sena kungariket Aksum kvar. Öken- och herdefolk utan egen stat (sanhaja, tuareger, beja samt somaliska och oromiska klaner) visas som statslösa områden.
  Ahmad ibn Tulun, governor of Egypt, rules on his own; Barqa passes with Egypt to the Tulunids.: Ahmad ibn Tulun, ståthållare i Egypten, styr på egen hand; Barqa övergår tillsammans med Egypten till tuluniderna.
  The Abbasids end Tulunid rule in Egypt and Barqa.: Abbasiderna gör slut på tulunidernas styre i Egypten och Barqa.
  The Kutama army of the missionary Abu Abdallah al-Shi’i takes Raqqada; the last Aghlabid emir, Ziyadat Allah III, has fled to the east. The Fatimid caliphate is proclaimed there in January 910.: Missionären Abu Abdallah al-Shi’is kutamaarmé intar Raqqada; den siste aghlabidiske emiren, Ziyadat Allah III, har flytt österut. Det fatimidiska kalifatet utropas där i januari 910.
  Abu Abdallah takes Tahert and ends the Rustamid imamate; the Ibadis withdraw to Ouargla and the Jebel Nafusa. In August he frees al-Mahdi at Sijilmasa, where the Midrarids keep their throne under Fatimid overlordship.: Abu Abdallah intar Tahert och gör slut på det rustamidiska imamatet; ibaditerna drar sig tillbaka till Ouargla och Jebel Nafusa. I augusti befriar han al-Mahdi i Sijilmasa, där midrariderna behåller sin tron under fatimidisk överhöghet.
  Fatimid troops take Barqa, the base for their invasions of Egypt in 914–915 and 919–921.: Fatimidiska trupper intar Barqa, utgångspunkten för deras invasioner av Egypten 914–915 och 919–921.
  The Banu Khattab, an Ibadi Berber family, rule the Fezzan from Zuwila (about 918).: Banu Khattab, en ibaditisk berbersläkt, styr Fezzan från Zuwila (omkring 918).
  The Fatimid general Masala ibn Habus deposes the Idrisid Yahya IV at Fez, which he hands to the Miknasa chief Musa ibn Abi’l-Afiya; Tlemcen falls too. The Idrisids keep only the north, around the Hajar al-Nasr.: Den fatimidiske fältherren Masala ibn Habus avsätter idrisiden Yahya IV i Fès och överlämnar staden åt miknasahövdingen Musa ibn Abi’l-Afiya; även Tlemcen faller. Idrisiderna behåller bara norra delen, kring Hajar al-Nasr.
  Musa ibn Abi’l-Afiya changes sides and recognises the Umayyad caliph of Córdoba, Abd al-Rahman III, who holds Ceuta (931) and Melilla (927). For forty years Fez and the north pass between Umayyad and Fatimid clients.: Musa ibn Abi’l-Afiya byter sida och erkänner den umayyadiske kalifen i Córdoba, Abd al-Rahman III, som behärskar Ceuta (931) och Melilla (927). I fyrtio år växlar Fès och norra delen mellan umayyadernas och fatimidernas klienter.
  The Umayyads of Córdoba take Tangier from the Idrisids.: Umayyaderna i Córdoba tar Tanger från idrisiderna.
  The Fatimid general Jawhar marches west and takes Sijilmasa; its Midrarid ruler, Muhammad ibn al-Fath, is killed.: Den fatimidiske fältherren Jawhar marscherar västerut och intar Sijilmasa; dess midraridiske härskare, Muhammad ibn al-Fath, dödas.
  Tradition tells of a queen, Gudit (Yodit), who destroyed Aksum about 960; scholars debate who she was. The kingdom survives in a weaker form.: Enligt traditionen förstörde en drottning, Gudit (Yodit), Aksum omkring 960; forskarna är oeniga om vem hon var. Riket lever kvar i försvagad form.
  Jawhar storms Fez and captures its Umayyad governor; Fatimid rule reaches the Atlantic.: Jawhar stormar Fès och tillfångatar dess umayyadiske guvernör; det fatimidiska styret når Atlanten.
  A Midrarid, Abu Muhammad al-Mu’tazz, rules Sijilmasa again.: En midrarid, Abu Muhammad al-Mu’tazz, styr åter Sijilmasa.
  The Fatimid caliph al-Mu’izz leaves for Egypt, conquered by Jawhar in 969, and makes Buluggin ibn Ziri governor of Ifriqiya and the central Maghreb; the Zirids rule it as his vassals. Barqa stays under Cairo.: Den fatimidiske kalifen al-Mu’izz beger sig till Egypten, som Jawhar hade erövrat 969, och gör Buluggin ibn Ziri till guvernör över Ifriqiya och centrala Maghreb; ziriderna styr området som hans vasaller. Barqa förblir under Kairo.
  The Umayyad general Ghalib campaigns in northern Morocco and in 974 ends the Idrisid dynasty. Fez and the north are governed for Córdoba, from the 980s through Zenata emirs, and Tlemcen and the west of the central Maghreb pass to Zenata emirs (the Maghrawa and the Banu Ifran) who recognise Córdoba.: Den umayyadiske fältherren Ghalib för krig i norra Marocko och gör 974 slut på idrisiddynastin. Fès och norra delen styrs för Córdobas räkning, från 980-talet genom zenataemirer, och Tlemcen och västra delen av centrala Maghreb övergår till zenataemirer (maghrawa och Banu Ifran) som erkänner Córdoba.
  Khazrun ibn Fulful of the Maghrawa takes Sijilmasa for Córdoba and ends the Midrarids.: Khazrun ibn Fulful av maghrawa intar Sijilmasa för Córdobas räkning och gör slut på midrariderna.
  Ghana takes Aoudaghost, the Sanhaja trading town at the southern end of the Saharan route (about 992).: Ghana tar Aoudaghost, sanhajas handelsstad vid den södra änden av vägen genom Sahara (omkring 992).
  Fulful ibn Sa’id of the Banu Khazrun, a Zenata family, seizes Tripoli; his house holds it, with breaks, until 1146.: Fulful ibn Sa’id av Banu Khazrun, en zenatasläkt, tar makten i Tripoli; hans ätt behåller staden, med avbrott, till 1146.
  Hammad ibn Buluggin, governor of the central Maghreb for the Zirids, rules on his own from his fortress, the Qal’a of the Banu Hammad; peace in 1017 confirms the split.: Hammad ibn Buluggin, ziridernas guvernör över centrala Maghreb, styr på egen hand från sin fästning, Banu Hammads Qal’a; en fred 1017 bekräftar splittringen.
  With the end of the Caliphate of Córdoba the Zenata emirs of Fez, Salé and Tadla, Aghmat and Sijilmasa rule on their own.: När kalifatet Córdoba upphör styr zenataemirerna i Fès, Salé och Tadla, Aghmat och Sijilmasa på egen hand.
  The Banu Sulaym and the Banu Hilal, Arab Bedouin tribes sent west by the Fatimids after the Zirid break with Cairo (1048), overrun Barqa; Fatimid rule there ends.: Banu Sulaym och Banu Hilal, arabiska beduinstammar som fatimiderna hade skickat västerut efter ziridernas brytning med Kairo (1048), sveper in över Barqa; det fatimidiska styret där upphör.
  The Almoravids, a reform movement of the Sanhaja of the western Sahara led by Abdallah ibn Yasin and Abu Bakr ibn Umar, take Sijilmasa and Aoudaghost (1054–1055).: Almoraviderna, en reformrörelse bland sanhaja i västra Sahara under ledning av Abdallah ibn Yasin och Abu Bakr ibn Umar, intar Sijilmasa och Aoudaghost (1054–1055).
  The Almoravids take the Sous and the Draa.: Almoraviderna tar Sous och Draa.
  After the Zirid defeat at Haydaran (1052) the Hilali tribes sack Kairouan; the Zirid emir al-Mu’izz withdraws to Mahdia. Inland Ifriqiya and the interior of Tripolitania pass to Bedouin chiefs and small emirates (the Banu Jami at Gabès, the Banu Rand at Gafsa).: Efter ziridernas nederlag vid Haydaran (1052) plundrar de hilaliska stammarna Kairouan; ziridemiren al-Mu’izz drar sig tillbaka till Mahdia. Det inre av Ifriqiya och Tripolitaniens inland övergår till beduinhövdingar och små emirat (Banu Jami i Gabès, Banu Rand i Gafsa).
  The Almoravids take Aghmat, near the later Marrakesh, and Tadla.: Almoraviderna intar Aghmat, nära det senare Marrakech, och Tadla.
  Tunis, under the Banu Khurasan, recognises the Hammadids.: Tunis under Banu Khurasan erkänner hammadiderna.
  The Almoravids break the Barghawata on the Atlantic plain, where Ibn Yasin was killed in 1059.: Almoraviderna krossar barghawata på den atlantiska slätten, där Ibn Yasin hade dödats 1059.
  Yusuf ibn Tashfin takes Fez (1069–1070) and the plains of the north; Marrakesh, founded about 1070, becomes the Almoravid capital.: Yusuf ibn Tashfin intar Fès (1069–1070) och slätterna i norr; Marrakech, grundat omkring 1070, blir almoravidernas huvudstad.
  The Almoravids take Tangier.: Almoraviderna intar Tanger.
  The Almoravids take Taza, Oujda and Tlemcen and destroy the Emirate of Nekor in the Rif.: Almoraviderna intar Taza, Oujda och Tlemcen och förstör emiratet Nekor i Rifbergen.
  The Almoravids take Oran, Tenes and Algiers; their border with the Hammadids runs east of Algiers.: Almoraviderna intar Oran, Tenes och Alger; deras gräns mot hammadiderna går öster om Alger.
  Abu Bakr ibn Umar, leader of the Almoravids in the Sahara since 1072, dies; the movement’s hold on the desert south of the Draa breaks up (the sources are thin).: Abu Bakr ibn Umar, almoravidernas ledare i Sahara sedan 1072, dör; rörelsens grepp om öknen söder om Draa upplöses (källorna är knapphändiga).
  The Hammadids leave the Qal’a, exposed to the Hilali tribes, for Bougie (Béjaïa); the steppe passes to the Bedouin. Bône (Annaba) is held by the Hammadids under al-Mansur (1088–1105).: Hammadiderna lämnar Qal’a, som är utsatt för de hilaliska stammarna, för Bougie (Béjaïa); stäppen övergår till beduinerna. Bône (Annaba) behärskas av hammadiderna under al-Mansur (1088–1105).
  Roger II of Sicily takes the island of Djerba.: Roger II av Sicilien intar ön Djerba.
  The Zagwe dynasty, from Lasta, rules the Christian kingdom (from about 1137; the dates are uncertain), with its capital at Roha (Lalibela).: Zagwedynastin från Lasta styr det kristna riket (från omkring 1137; årtalen är osäkra), med huvudstad i Roha (Lalibela).
  The Almohads, followers of Ibn Tumart (proclaimed Mahdi in 1121, at Tinmel from about 1124) led since 1130 by Abd al-Mu’min, hold the High Atlas, the Sous and the Draa.: Almohaderna, anhängare till Ibn Tumart (utropad till mahdi 1121, i Tinmel från omkring 1124) och sedan 1130 ledda av Abd al-Mu’min, behärskar Höga Atlas, Sous och Draa.
  After the death of the Almoravid emir Tashfin ibn Ali near Oran, the Almohads take Tlemcen, Oran and the north-east of Morocco.: Sedan den almoravidiske emiren Tashfin ibn Ali har dött nära Oran intar almohaderna Tlemcen, Oran och nordöstra Marocko.
  The Almohads take Fez after a long siege, then Meknes, Salé, Ceuta and Sijilmasa.: Almohaderna intar Fès efter en lång belägring, därefter Meknès, Salé, Ceuta och Sijilmasa.
  A Sicilian fleet takes Tripoli.: En siciliansk flotta intar Tripoli.
  The Almohads take Marrakesh and end the Almoravid dynasty; in the Sahara the Almoravids’ Sanhaja homeland falls back to its tribes, and Algiers passes to the Hammadids.: Almohaderna intar Marrakech och gör slut på almoraviddynastin; i Sahara återgår almoravidernas sanhajiska hemland till sina stammar, och Alger övergår till hammadiderna.
  The Sicilian admiral George of Antioch takes Mahdia, Sousse and Sfax and ends the Zirid dynasty; the Normans rule the coast of Ifriqiya from Tripoli to Sfax. Tunis, under the Banu Khurasan, is on its own until the Almohads take it in 1159.: Den sicilianske amiralen Georg av Antiochia intar Mahdia, Sousse och Sfax och gör slut på ziriddynastin; normanderna styr Ifriqiyas kust från Tripoli till Sfax. Tunis under Banu Khurasan är självständigt tills almohaderna intar staden 1159.
  Abd al-Mu’min takes Algiers and Bougie and ends the Hammadid dynasty; Constantine submits.: Abd al-Mu’min intar Alger och Bougie och gör slut på hammadiddynastin; Constantine underkastar sig.
  A Sicilian fleet takes Bône (Annaba).: En siciliansk flotta intar Bône (Annaba).
  Revolts drive the Sicilian garrisons from Sfax, Tripoli and Djerba (1156–1158); only Mahdia and Sousse remain Norman.: Revolter driver ut de sicilianska garnisonerna ur Sfax, Tripoli och Djerba (1156–1158); bara Mahdia och Sousse förblir normandiska.
  Abd al-Mu’min takes Tunis from the Banu Khurasan.: Abd al-Mu’min tar Tunis från Banu Khurasan.
  Abd al-Mu’min takes Mahdia from the Normans after Tunis (1159); Tripoli, Bône and the whole of Ifriqiya are Almohad, and for the first time one power rules from the Atlantic to Tripolitania.: Abd al-Mu’min tar Mahdia från normanderna efter Tunis (1159); Tripoli, Bône och hela Ifriqiya är almohadiska, och för första gången styr en enda makt från Atlanten till Tripolitanien.
  Qaraqush, a Mamluk commander from Egypt, takes Zuwila and ends the Banu Khattab (1172–1176); the Fezzan falls to Kanem’s rulers in the following century.: Qaraqush, en mamlukisk befälhavare från Egypten, intar Zuwila och gör slut på Banu Khattab (1172–1176); Fezzan faller under Kanems härskare under det följande århundradet.
  The Sosso king Sumanguru Kanté takes Koumbi Saleh, the old capital of Ghana, whose power had been declining for a century (about 1203; the dates are traditional).: Sossokungen Sumanguru Kanté intar Koumbi Saleh, Ghanas gamla huvudstad, vars makt hade varit på nedgång i ett sekel (omkring 1203; årtalen bygger på traditionen).
  Abu Zakariya, Almohad governor at Tunis, breaks with Marrakesh and founds the Hafsid dynasty; he takes Constantine and Bougie in 1230 and Algiers in 1235.: Abu Zakariya, almohadisk guvernör i Tunis, bryter med Marrakech och grundar hafsiddynastin; han intar Constantine och Bougie 1230 och Alger 1235.
  Abu Zakariya takes Constantine and Bougie.: Abu Zakariya intar Constantine och Bougie.
  Sundiata Keita of the Mandinka defeats Sumanguru at Kirina (about 1235) and founds the Mali Empire.: Sundiata Keita av mandinkafolket besegrar Sumanguru vid Kirina (omkring 1235) och grundar Maliriket.
  Abu Zakariya takes Algiers.: Abu Zakariya intar Alger.
  "Yaghmurasen ibn Zayyan of the Banu Abd al-Wad rules Tlemcen on his own: the Zayyanid kingdom.": "Yaghmurasen ibn Zayyan av Banu Abd al-Wad styr Tlemcen på egen hand: det zayyanidiska kungariket."
  Kanem’s king Dunama Dibalemi extends his rule to the Fezzan, governed from Traghen (mid-thirteenth century; the dates are uncertain).: Kanems kung Dunama Dibalemi utsträcker sitt välde till Fezzan, som styrs från Traghen (mitten av 1200-talet; årtalen är osäkra).
  The Marinids, Zenata nomads from the east of Morocco, take Meknes and the north-east.: Mariniderna, zenatanomader från östra Marocko, intar Meknès och den nordöstra delen.
  The Marinid Abu Yahya takes Fez, which becomes the Marinid capital.: Mariniden Abu Yahya intar Fès, som blir marinidernas huvudstad.
  The Marinids take Sijilmasa.: Mariniderna intar Sijilmasa.
  The Zayyanids take Sijilmasa.: Zayyaniderna intar Sijilmasa.
  "The Marinid Abu Yusuf Yaqub takes Marrakesh: the end of the Almohad caliphate, whose last followers hold out at Tinmel until 1275.": "Mariniden Abu Yusuf Yaqub intar Marrakech: slutet för det almohadiska kalifatet, vars sista anhängare håller ut i Tinmel till 1275."
  Yekuno Amlak of Amhara overthrows the Zagwe and founds the Solomonic dynasty of Ethiopia.: Yekuno Amlak av Amhara störtar Zagwedynastin och grundar den salomoniska dynastin i Etiopien.
  The Marinids retake Sijilmasa.: Mariniderna återtar Sijilmasa.
  Tangier, ruled by its own lords since the Almohad collapse, submits to the Marinids.: Tanger, som har styrts av egna herrar sedan almohadernas sammanbrott, underkastar sig mariniderna.
  Roger of Lauria, admiral of Aragonese Sicily, takes the island of Djerba.: Roger av Lauria, amiral i det aragoniska Sicilien, intar ön Djerba.
  Umar Walasma founds the sultanate of Ifat east of Shewa and absorbs the old Muslim sultanate of Shewa; its rule reaches the Harar plateau, and Zeila is its port.: Umar Walasma grundar Ifatsultanatet öster om Shewa och uppslukar det gamla muslimska sultanatet Shewa; dess välde når Hararplatån, och Zeila är dess hamn.
  The Ajuran Sultanate rules the Shabelle and Juba valleys and the Benadir coast (from the thirteenth century; dates are uncertain).: Ajuransultanatet styr Shabelle- och Jubadalarna och Benadirkusten (från 1200-talet; årtalen är osäkra).
  The Zayyanids of Tlemcen take Algiers from the Hafsids; from the mid-fourteenth century its Thaaliba amirs rule it largely on their own as tributaries of Tlemcen.: Zayyaniderna i Tlemcen tar Alger från hafsiderna; från mitten av 1300-talet styr stadens thaalibaemirer den i stort sett på egen hand som skattskyldiga under Tlemcen.
  Gao and Timbuktu are under Mali by the time Mansa Musa returns from his pilgrimage to Mecca (1324–1325); Mali reaches from the Atlantic to the middle Niger.: Gao och Timbuktu lyder under Mali när Mansa Musa återvänder från sin pilgrimsfärd till Mecka (1324–1325); Mali sträcker sig från Atlanten till Nigers mellersta lopp.
  Amda Seyon defeats Ifat, Hadiya and Dawaro; the Muslim sultanates of the south become tributaries of Ethiopia.: Amda Seyon besegrar Ifat, Hadiya och Dawaro; de muslimska sultanaten i söder blir skattskyldiga under Etiopien.
  The people of Djerba rise against Sicilian rule and the Hafsids retake the island.: Invånarna på Djerba reser sig mot det sicilianska styret, och hafsiderna återtar ön.
  The Marinid Abu al-Hasan takes Tlemcen after a two-year siege; the Zayyanid king dies in the fighting.: Mariniden Abu al-Hasan intar Tlemcen efter en tvåårig belägring; den zayyanidiske kungen dör i striderna.
  Abu al-Hasan enters Tunis; for a few months the Marinids rule the whole Maghreb.: Abu al-Hasan tågar in i Tunis; under några månader styr mariniderna hela Maghreb.
  After Abu al-Hasan’s defeat by the Arab tribes near Kairouan (April 1348), the Zayyanids retake Tlemcen and Algiers, and the Hafsid princes Constantine and Bougie.: Efter Abu al-Hasans nederlag mot de arabiska stammarna nära Kairouan (april 1348) återtar zayyaniderna Tlemcen och Alger, och de hafsidiska prinsarna Constantine och Bougie.
  Abu al-Hasan leaves Tunis by sea (December 1349); the Hafsids return.: Abu al-Hasan lämnar Tunis sjövägen (december 1349); hafsiderna återvänder.
  Abu al-Hasan’s son Abu Inan takes Tlemcen and Algiers and, in 1352–1353, Bougie.: Abu al-Hasans son Abu Inan intar Tlemcen och Alger och 1352–1353 Bougie.
  After Abu Inan’s death the Zayyanid Abu Hammu II retakes Tlemcen and Algiers, and the Hafsids Bougie.: Efter Abu Inans död återtar zayyaniden Abu Hammu II Tlemcen och Alger, och hafsiderna Bougie.
  After a civil war (1365) the Makurian court leaves Dongola for Gebel Adda in Lower Nubia; the Dongola reach passes to Arab tribes. Makuria had been a Mamluk vassal since 1276 and had its first Muslim king in 1316–1317.: Efter ett inbördeskrig (1365) lämnar det makuriska hovet Dongola för Gebel Adda i Nedre Nubien; Dongolaavsnittet av Nilen övergår till arabiska stammar. Makuria hade varit mamlukisk vasall sedan 1276 och fick sin förste muslimske kung 1316–1317.
  The Bulala drive the Sayfawa kings out of Kanem (from about 1380); the dynasty moves west of Lake Chad to Bornu, and Kanem’s hold on the Fezzan ends.: Bulala driver ut Sayfawakungarna ur Kanem (från omkring 1380); dynastin flyttar väster om Tchadsjön till Bornu, och Kanems grepp om Fezzan upphör.
  The kingdom of Kaffa rises in the forests south-west of the Gibe (about 1390; dates are traditional).: Kungariket Kaffa växer fram i skogarna sydväst om floden Gibe (omkring 1390; årtalen bygger på traditionen).
  The Tuareg of Aïr accept a sultan (about 1405); Agadez becomes his seat in the 1430s.: Tuaregerna i Aïr godtar en sultan (omkring 1405); Agadez blir hans säte på 1430-talet.
  An Ethiopian army kills Sa’ad ad-Din of Ifat at Zeila (in 1403 under Dawit I or about 1415 under Yeshaq; the sources differ). His sons return from Yemen and found the Adal Sultanate further east, with its capital at Dakkar and from 1520 at Harar.: En etiopisk armé dödar Sa’ad ad-Din av Ifat vid Zeila (1403 under Dawit I eller omkring 1415 under Yeshaq; källorna går isär). Hans söner återvänder från Jemen och grundar Adalsultanatet längre österut, med huvudstad i Dakkar och från 1520 i Harar.
  Gao breaks away from Mali under the Sonni dynasty (about 1430).: Gao bryter sig loss från Mali under Sonnidynastin (omkring 1430).
  The Tuareg chief Akil takes Timbuktu from Mali (1433–1434); Walata and the Sahel fall to them a few years later.: Tuareghövdingen Akil tar Timbuktu från Mali (1433–1434); Walata och Sahel faller i tuaregernas händer några år senare.
  The Mossi kingdoms (Ouagadougou, Yatenga, Tenkodogo) rule the plateau of the White and Red Volta by the mid-fifteenth century; their origins and dates are traditional.: Mossirikena (Ouagadougou, Yatenga, Tenkodogo) styr platån vid Vita och Röda Volta vid mitten av 1400-talet; deras ursprung och årtal bygger på traditionen.
  Sonni Ali comes to the throne of Gao and begins the conquests that make Songhai an empire.: Sonni Ali bestiger Gaos tron och inleder de erövringar som gör Songhai till ett storrike.
  Sonni Ali takes Timbuktu.: Sonni Ali intar Timbuktu.
  After taking Asilah, the Portuguese occupy Tangier, abandoned by its people.: Sedan portugiserna har intagit Asilah besätter de Tanger, som invånarna har övergett.
  Muhammad al-Shaykh, of the Wattasids, a family of Marinid viziers, takes Fez, where a revolt had killed the last Marinid sultan in 1465 and the sharif Muhammad al-Juti had ruled since; the Wattasid sultanate. Marrakesh is held by its Hintata emirs and the Sous by local lords.: Muhammad al-Shaykh av wattasiderna, en släkt av marinidiska vesirer, intar Fès, där en revolt hade dödat den siste marinidiske sultanen 1465 och där sharifen Muhammad al-Juti hade styrt sedan dess; det wattasidiska sultanatet tar sin början. Marrakech behärskas av sina hintataemirer och Sous av lokala herrar.
  Sonni Ali takes Djenné after a long siege.: Sonni Ali intar Djenné efter en lång belägring.
  The Shilluk kingdom on the White Nile takes shape under its reths (dates are traditional).: Shillukriket vid Vita Nilen tar form under sina reth (årtalen bygger på traditionen).
  "Askia Muhammad, who seized the Songhai throne in 1493, campaigns against the Mossi, Aïr and the western provinces of Mali: Diafunu falls in 1501 and Diara in 1512. Aïr pays tribute.": "Askia Muhammad, som tog Songhais tron 1493, för krig mot mossi, Aïr och Malis västra provinser: Diafunu faller 1501 och Diara 1512. Aïr betalar tribut."
  The Funj under Amara Dunqas and the Abdallab Arabs destroy Soba, the capital of Alwa (about 1504); the Funj Sultanate rules from Sennar, the Abdallab as its vassals in the north.: Funj under Amara Dunqas och abdallab-araberna förstör Soba, Alwas huvudstad (omkring 1504); Funjsultanatet styr från Sennar, med abdallab som vasaller i norr.
  Castile takes Mers el-Kébir; Melilla had been taken in 1497.: Kastilien intar Mers el-Kébir; Melilla hade intagits 1497.
  The Bornu king Idris Katakarmabe enters Njimi, the old capital of Kanem, and makes peace with the Bulala, who keep Kanem.: Bornukungen Idris Katakarmabe tågar in i Njimi, Kanems gamla huvudstad, och sluter fred med bulala, som behåller Kanem.
  A Castilian army under Cardinal Cisneros and Pedro Navarro storms Oran.: En kastiliansk armé under kardinal Cisneros och Pedro Navarro stormar Oran.
  "Muhammad al-Qa’im, a sharif of the Sous, is proclaimed leader of the holy war against the Portuguese: the start of the Saadian dynasty.": "Muhammad al-Qa’im, en sharif från Sous, utropas till ledare för det heliga kriget mot portugiserna: början på den saadiska dynastin."
  Pedro Navarro takes Bougie for Castile; Algiers accepts a Spanish fort on the islet before the town (the Peñón).: Pedro Navarro intar Bougie för Kastiliens räkning; Alger godtar ett spanskt fort på holmen utanför staden (Peñón).
  Pedro Navarro takes Tripoli, which is placed under the viceroy of Sicily.: Pedro Navarro intar Tripoli, som ställs under vicekungen av Sicilien.
  The Portuguese take Azemmour; with Safi (1508) they dominate the Doukkala plain.: Portugiserna intar Azemmour; tillsammans med Safi (1508) behärskar de Doukkalaslätten.
  "Oruç Reis (Barbarossa) seizes Algiers, which had called on him against the Spanish. After his death (1518) his brother Hayreddin places Algiers under the Ottoman sultan (1519), who makes him its governor: the Regency of Algiers. Kabyle rivals hold the town again in 1520–1525.": "Oruç Reis (Barbarossa) tar makten i Alger, som hade kallat på honom mot spanjorerna. Efter hans död (1518) ställer hans bror Hayreddin Alger under den osmanske sultanen (1519), som gör honom till stadens guvernör: regentskapet Alger. Kabyliska rivaler behärskar åter staden 1520–1525."
  Oran and Bougie pass with the Crown of Castile to Spain.: Oran och Bougie övergår med Kastilianska kronan till Spanien.
  The kingdom of Baguirmi is founded on the Chari, with its capital at Massenya (dates are traditional).: Kungariket Baguirmi grundas vid floden Chari, med huvudstad i Massenya (årtalen bygger på traditionen).
  The Saadians take Marrakesh from its Hintata emirs (1524 or 1525); the Wattasids keep Fez and the north, and in 1527 the two dynasties divide Morocco along the Oum er-Rbia.: Saadierna tar Marrakech från dess hintataemirer (1524 eller 1525); wattasiderna behåller Fès och norra delen, och 1527 delar de två dynastierna Marocko längs floden Oum er-Rbia.
  Hayreddin takes the Spanish Peñón of Algiers; his rule reaches west to Cherchell and Ténès and east into Kabylia.: Hayreddin intar det spanska Peñón vid Alger; hans välde når västerut till Cherchell och Ténès och österut in i Kabylien.
  Charles V gives Tripoli, with Malta, to the Knights Hospitaller.: Karl V ger Tripoli, tillsammans med Malta, till johanniterorden.
  Hayreddin takes Constantine and, briefly, Tunis (August 1534) from the Hafsids; Charles V restores the Hafsid Mawlay Hasan at Tunis in 1535 as his vassal.: Hayreddin tar Constantine och för en kort tid Tunis (augusti 1534) från hafsiderna; Karl V återinsätter hafsiden Mawlay Hasan i Tunis 1535 som sin vasall.
  After the Saadians take Agadir (March 1541), the Portuguese evacuate Safi and Azemmour.: Sedan saadierna har intagit Agadir (mars 1541) utrymmer portugiserna Safi och Azemmour.
  The Saadian Muhammad al-Shaykh takes Fez and ends Wattasid rule.: Saadiern Muhammad al-Shaykh intar Fès och gör slut på wattasidernas styre.
  The Awlad Muhammad, a family of sharifs, found a sultanate in the Fezzan with its capital at Murzuq; they pay tribute to Tripoli from the late sixteenth century.: Awlad Muhammad, en sharifsläkt, grundar ett sultanat i Fezzan med huvudstad i Murzuq; från slutet av 1500-talet betalar de tribut till Tripoli.
  An Ottoman fleet under Sinan Pasha and Turgut Reis takes Tripoli from the Knights of St John.: En osmansk flotta under Sinan Pasha och Turgut Reis tar Tripoli från johanniterna.
  Salah Rais, Ottoman governor of Algiers, makes the oasis towns of Touggourt and Ouargla pay tribute and garrisons Biskra.: Salah Rais, osmansk guvernör i Alger, gör oasstäderna Touggourt och Ouargla skattskyldiga och lägger en garnison i Biskra.
  With Ottoman help the Wattasid Ali Abu Hassun retakes Fez.: Med osmansk hjälp återtar wattasiden Ali Abu Hassun Fès.
  Muhammad al-Shaykh defeats and kills Abu Hassun near Fez (September 1554); the Saadians rule all Morocco. Algiers, which had driven the Saadians from Tlemcen in 1551, ends the Zayyanid kingdom (1554–1556).: Muhammad al-Shaykh besegrar och dödar Abu Hassun nära Fès (september 1554); saadierna styr hela Marocko. Alger, som hade drivit ut saadierna ur Tlemcen 1551, gör slut på det zayyanidiska kungariket (1554–1556).
  The Ottomans make Suakin, with Massawa (1557), the seat of the province of Habesh on the Red Sea.: Osmanerna gör Suakin, tillsammans med Massawa (1557), till säte för provinsen Habesh vid Röda havet.
  Salah Rais takes Bougie from Spain.: Salah Rais tar Bougie från Spanien.
  Özdemir Pasha takes Massawa for the Ottomans.: Özdemir Pasha intar Massawa för osmanernas räkning.
  By the 1570s the Oromo, moving north under their gadaa age-sets, have taken over Shewa, Bale, Hadiya and the Harar plateau; Ethiopia’s rule shrinks to the north.: På 1570-talet har oromo, som rör sig norrut organiserade i sina gadaa-åldersklasser, tagit över Shewa, Bale, Hadiya och Hararplatån; Etiopiens välde krymper till norr.
  Uluç Ali, governor of Algiers, takes Tunis from the Hafsids.: Uluç Ali, guvernör i Alger, tar Tunis från hafsiderna.
  Don John of Austria retakes Tunis and restores a Hafsid as Spain’s vassal.: Don Juan av Österrike återtar Tunis och återinsätter en hafsid som Spaniens vasall.
  "An Ottoman army under Sinan Pasha and Uluç Ali takes La Goulette and Tunis and ends the Hafsid dynasty. Tunis becomes an Ottoman province, ruled from 1591 by its deys and from 1613 by beys: the Regency of Tunis.": "En osmansk armé under Sinan Pasha och Uluç Ali intar La Goulette och Tunis och gör slut på hafsiddynastin. Tunis blir en osmansk provins, från 1591 styrd av sina dejer och från 1613 av bejer: regentskapet Tunis."
  "Imam Muhammad Jasa moves the capital of Adal from Harar to Aussa in the Awash delta: the Imamate of Aussa. Adal’s Somali coast falls away.": "Imam Muhammad Jasa flyttar Adals huvudstad från Harar till Aussa i Awashdeltat: imamatet Aussa. Adals somaliska kust går förlorad."
  Under a treaty with Idris Alooma of Bornu the Bulala give up western Kanem with Njimi and keep the east around Lake Fitri (about 1580; the dates are uncertain).: Genom ett fördrag med Idris Alooma av Bornu ger bulala upp västra Kanem med Njimi och behåller den östra delen kring Fitrisjön (omkring 1580; årtalen är osäkra).
  The Saadian sultan Ahmad al-Mansur sends an army to the oases of the Tuat and Gourara and the Saoura, which pay tribute to Morocco from now on.: Den saadiske sultanen Ahmad al-Mansur sänder en armé till oaserna i Tuat och Gourara och till Saoura, som från och med nu betalar tribut till Marocko.
  The Moroccan army of Judar Pasha defeats the Songhai at Tondibi; Gao, Timbuktu and Djenné fall. The Moroccan pashas rule the Niger bend from Timbuktu (the Pashalik); the Songhai princes hold out downstream in Dendi.: Judar Pashas marockanska armé besegrar songhai vid Tondibi; Gao, Timbuktu och Djenné faller. De marockanska pashorna styr Nigerkröken från Timbuktu (pashaliket); songhaiprinsarna håller ut längre nedströms i Dendi.
  After the death of Mansa Mahmud IV (about 1610) the Mali Empire breaks up into small Manding kingdoms.: Efter Mansa Mahmud IV:s död (omkring 1610) splittras Maliriket i små mandingkungariken.
  Anaukpetlun of Ava takes Syriam and executes de Brito, then retakes Martaban; Tavoy comes back under Burma in the following years (in 1614 or 1622, by different accounts). Lower Burma is again united with Ava.: Anaukpetlun av Ava intar Syriam och avrättar de Brito och återtar sedan Martaban; Tavoy kommer åter under Burma under de följande åren (1614 eller 1622, enligt olika uppgifter). Nedre Burma förenas åter med Ava.
  Abd al-Karim founds the Wadai sultanate east of Lake Fitri, with its capital at Wara (about 1635).: Abd al-Karim grundar Wadaisultanatet öster om Fitrisjön, med huvudstad i Wara (omkring 1635).
  The Ottoman pashas of Tripoli bring Barqa (Cyrenaica) and the coast of the Gulf of Sirte under their rule (from the 1630s).: De osmanska pashorna i Tripoli lägger Barqa (Cyrenaika) och kusten vid Sidrabukten under sitt styre (från 1630-talet).
  The river north of Niamey breaks up into small Songhai chiefdoms; the askias keep Dendi in the south.: Landet längs floden norr om Niamey splittras i små songhaihövdingdömen; askiorna behåller Dendi i söder.
  Ali ibn Daud founds the Emirate of Harar, independent of Aussa.: Ali ibn Daud grundar emiratet Harar, oberoende av Aussa.
  Sulayman Solongdungu founds the Keira sultanate of Darfur (about 1650; the dates are uncertain).: Sulayman Solongdungu grundar Keirasultanatet i Darfur (omkring 1650; årtalen är osäkra).
  The Trarza and Brakna emirates of the Hassani Arabs take shape north of the Senegal River in the seventeenth century; the Char Bouba war (about 1673–1677; older accounts give 1644–1674) confirms Hassani dominance over the Berber tribes.: Hassaniarabernas emirat Trarza och Brakna tar form norr om Senegalfloden under 1600-talet; Char Bouba-kriget (omkring 1673–1677; äldre framställningar anger 1644–1674) befäster hassaniernas herravälde över berberstammarna.
  Portugal hands Tangier to England under the marriage treaty of Charles II and Catherine of Braganza (June 1661).: Portugal överlämnar Tanger till England genom äktenskapsfördraget mellan Karl II och Katarina av Braganza (juni 1661).
  Moulay al-Rashid, of the Alaouite sharifs of the Tafilalet, takes Fez; in 1668 he destroys the Dila’iyya and takes Marrakesh, reuniting Morocco after sixty years of division among rival Saadians, the Dila’iyya, the corsair republic of Salé and others.: Moulay al-Rashid av de alawitiska shariferna i Tafilalet intar Fès; 1668 förstör han Dila’iyya och intar Marrakech och återförenar därmed Marocko efter sextio års splittring mellan rivaliserande saadier, Dila’iyya, korsarrepubliken Salé och andra.
  Negasi Krestos founds the kingdom of Shewa in Menz (about 1682).: Negasi Krestos grundar kungariket Shewa i Menz (omkring 1682).
  England evacuates and destroys Tangier after years of blockade by the army of Moulay Ismail.: England utrymmer och förstör Tanger efter år av blockad från Moulay Ismails armé.
  The Ajuran Sultanate falls apart in the late seventeenth century; its lands pass to Hawiye and Rahanweyn clans and smaller sultanates.: Ajuransultanatet faller sönder i slutet av 1600-talet; dess land övergår till hawiye- och rahanweynklaner och mindre sultanat.
  The Geledi Sultanate rises at Afgooye on the lower Shabelle (about 1700).: Geledisultanatet växer fram i Afgooye vid nedre Shabelle (omkring 1700).
  The bey of Mascara takes Oran for the Regency of Algiers.: Bejen av Mascara intar Oran åt regentskapet Alger.
  Ahmed Karamanli, an officer of the Tripoli garrison, seizes power; his dynasty rules the Regency of Tripoli under nominal Ottoman sovereignty until 1835.: Ahmed Karamanli, officer i Tripolis garnison, tar makten; hans dynasti styr regentskapet Tripoli under nominell osmansk överhöghet till 1835.
  Biton Coulibaly makes Ségou the centre of the Bamana Empire.: Biton Coulibaly gör Ségou till centrum för Bambarariket.
  The sultanate of Damagaram is founded; Zinder becomes its capital in the 1730s.: Damagaramsultanatet grundas; Zinder blir dess huvudstad på 1730-talet.
  A Spanish army under the Count of Montemar retakes Oran; Mers el-Kébir follows the next day.: En spansk armé under greven av Montemar återtar Oran; Mers el-Kébir följer dagen därpå.
  The Tuareg defeat the arma, the Moroccan soldiers’ descendants who rule the Pashalik, at Toya; Gao and the east pass to the Iwillimmeden Tuareg.: Tuaregerna besegrar arma, ättlingarna till de marockanska soldater som styr pashaliket, vid Toya; Gao och östra delen övergår till iwillimmeden-tuaregerna.
  The Emirate of Adrar takes shape around Atar and Chinguetti (about 1745).: Emiratet Adrar tar form kring Atar och Chinguetti (omkring 1745).
  The kingdom of Taqali rules much of the Nuba Mountains (from about 1750).: Kungariket Taqali styr stora delar av Nubabergen (från omkring 1750).
  The Isaaq Sultanate takes shape in the north (about 1750); the Majeerteen Sultanate rules the north-east tip of Somalia (from the mid-eighteenth century).: Isaaqsultanatet tar form i norr (omkring 1750); Majeerteensultanatet styr Somalias nordöstra spets (från mitten av 1700-talet).
  The Massassi Bamana kings, rivals of Ségou since the seventeenth century, move west and rule Kaarta around Nioro (about 1753).: Massassi-bambarakungarna, Ségous rivaler sedan 1600-talet, flyttar västerut och styr Kaarta kring Nioro (omkring 1753).
  The Funj general Muhammad Abu Likaylik overruns Kordofan and drives out the Musabba’at, a branch of the Darfur royal house.: Funjfältherren Muhammad Abu Likaylik erövrar Kordofan och driver ut musabba’at, en gren av Darfurs kungahus.
  Alaungpaya takes Prome.: Alaungpaya intar Prome.
  Alaungpaya takes Dagon, which he renames Yangon (Rangoon), and the delta.: Alaungpaya intar Dagon, som han döper om till Yangon (Rangoon), och deltat.
  Darfur’s sultan Tayrab takes Kordofan as the Funj withdraw amid civil war (about 1785).: Darfurs sultan Tayrab tar Kordofan när funj drar sig tillbaka under ett inbördeskrig (omkring 1785).
  Spain, under a treaty of 1791 that followed the earthquake of 1790, hands Oran and Mers el-Kébir to the Regency of Algiers.: Spanien överlämnar, genom ett fördrag från 1791 som följde på jordbävningen 1790, Oran och Mers el-Kébir till regentskapet Alger.
  Sultan Sabun of Wadai makes Baguirmi a tributary and extends his rule south to Dar Sila and the Salamat.: Sultan Sabun av Wadai gör Baguirmi skattskyldigt och utsträcker sitt välde söderut till Dar Sila och Salamat.
  Brahima Seydou founds the Fulani emirate of Liptako, with its capital at Dori.: Brahima Seydou grundar fulaniemiratet Liptako, med huvudstad i Dori.
  Tripoli’s general Muhammad al-Mukni ends the Awlad Muhammad sultanate of the Fezzan (1811–1812).: Tripolis general Muhammad al-Mukni gör slut på Awlad Muhammads sultanat i Fezzan (1811–1812).
  Seku Amadu defeats the Bamana of Ségou at Noukouma and founds the Massina Empire, with its capital at Hamdullahi from about 1820.: Seku Amadu besegrar bambara i Ségou vid Noukouma och grundar Massinariket, med huvudstad i Hamdullahi från omkring 1820.
  The army of Muhammad Ali of Egypt under his son Ismail Kamil Pasha takes Dongola.: Den egyptiske härskaren Muhammad Alis armé under hans son Ismail Kamil Pasha intar Dongola.
  The last Funj sultan surrenders Sennar to Ismail Kamil; Egypt rules the Nile valley to Fazughli.: Den siste funjsultanen överlämnar Sennar till Ismail Kamil; Egypten styr Nildalen upp till Fazughli.
  Egyptian troops defeat Darfur’s army at Bara and take Kordofan.: Egyptiska trupper besegrar Darfurs armé vid Bara och tar Kordofan.
  The Kénédougou kingdom of the Traoré rises around Sikasso (dates are traditional).: Traorédynastins Kénédougourike växer fram kring Sikasso (årtalen bygger på traditionen).
  Massina takes Timbuktu, ending the Pashalik in practice.: Massina intar Timbuktu, vilket i praktiken gör slut på pashaliket.
  A French army takes Algiers and the dey surrenders. The bey of Constantine, Ahmed Bey, carries on the Ottoman regency in the east; in the west and centre tribes and towns choose their own leaders, and from 1832 most follow the emir Abd al-Qadir, whose state is shown in the war’s steps.: En fransk armé intar Alger och dejen kapitulerar. Bejen av Constantine, Ahmed Bey, för det osmanska regentskapet vidare i öster; i väster och i mitten väljer stammar och städer sina egna ledare, och från 1832 följer de flesta emiren Abd al-Qadir, vars stat visas i krigets steg.
  Tlemcen offers its allegiance to the sultan of Morocco, Abd al-Rahman, who sends troops; he withdraws them in 1832 under French pressure.: Tlemcen erbjuder Marockos sultan, Abd al-Rahman, sin trohet, och han sänder trupper; han drar tillbaka dem 1832 under franskt tryck.
  French troops occupy Oran.: Franska trupper besätter Oran.
  France takes Bône (Annaba); Moroccan troops leave Tlemcen.: Frankrike intar Bône (Annaba); marockanska trupper lämnar Tlemcen.
  France takes Mostaganem and Bougie (September).: Frankrike intar Mostaganem och Bougie (september).
  An Ottoman fleet deposes the Karamanli dynasty; Tripolitania and Cyrenaica are again an Ottoman province. The Fezzan is held by Abd al-Jalil of the Awlad Sulayman until 1842.: En osmansk flotta avsätter Karamanlidynastin; Tripolitanien och Cyrenaika är åter en osmansk provins. Fezzan behärskas av Abd al-Jalil av Awlad Sulayman till 1842.
  France takes Constantine at its second attempt; Ahmed Bey holds out in the Aurès until 1848.: Frankrike intar Constantine vid andra försöket; Ahmed Bey håller ut i Aurèsbergen till 1848.
  Egypt takes Taka and founds Kassala.: Egypten tar Taka och grundar Kassala.
  Sahle Selassie of Shewa (1813–1847) extends his kingdom south over the Oromo of the Shewan plateau.: Sahle Selassie av Shewa (1813–1847) utsträcker sitt kungarike söderut över oromo på Shewaplatån.
  French troops take Médéa; Miliana follows in June.: Franska trupper intar Médéa; Miliana följer i juni.
  Bugeaud takes Mascara, Abd al-Qadir’s former capital.: Bugeaud intar Mascara, Abd al-Qadirs tidigare huvudstad.
  The Ottomans retake the Fezzan; Abd al-Jalil is killed.: Osmanerna återtar Fezzan; Abd al-Jalil dödas.
  Bugeaud occupies Tlemcen.: Bugeaud besätter Tlemcen.
  The Duke of Aumale captures Abd al-Qadir’s smala at Taguine; France builds posts at Orléansville, Tiaret and Teniet el-Had, and by the end of the year Abd al-Qadir has withdrawn to Morocco.: Hertigen av Aumale tar Abd al-Qadirs smala vid Taguine; Frankrike anlägger poster vid Orléansville, Tiaret och Teniet el-Had, och vid årets slut har Abd al-Qadir dragit sig tillbaka till Marocko.
  The Duke of Aumale takes Biskra; French columns hold the Aurès and the Hodna.: Hertigen av Aumale intar Biskra; franska kolonner behärskar Aurèsbergen och Hodna.
  Abd al-Qadir surrenders to General Lamoricière; France holds the Tell from Tlemcen to the Titteri.: Abd al-Qadir kapitulerar inför general Lamoricière; Frankrike behärskar Tell från Tlemcen till Titteri.
  French troops storm Laghouat; Géryville (El Bayadh) and Djelfa follow.: Franska trupper stormar Laghouat; Géryville (El Bayadh) och Djelfa följer.
  France takes Touggourt; Ouargla and the Souf submit.: Frankrike intar Touggourt; Ouargla och Souf underkastar sig.
  Umar Tall takes Nioro and ends the kingdom of Kaarta.: Umar Tall intar Nioro och gör slut på kungariket Kaarta.
  Tewodros II conquers Shewa (1855–1856).: Tewodros II erövrar Shewa (1855–1856).
  Marshal Randon’s campaign conquers Great Kabylia; Lalla Fatma N’Soumer is captured.: Marskalk Randons fälttåg erövrar Storkabylien; Lalla Fatma N’Soumer tas till fånga.
  Umar Tall takes Ségou and ends the Bamana Empire.: Umar Tall intar Ségou och gör slut på Bambarariket.
  Umar Tall takes Hamdullahi and ends the Massina Empire. Timbuktu passes to the Kunta and the Tuareg.: Umar Tall intar Hamdullahi och gör slut på Massinariket. Timbuktu övergår till kunta och tuaregerna.
  The Ottoman sultan hands Suakin and Massawa to Egypt; Egypt places a post at Fashoda in the Shilluk country.: Den osmanske sultanen överlämnar Suakin och Massawa till Egypten; Egypten upprättar en post i Fashoda i shillukernas land.
  Menelik escapes from Magdala and is proclaimed negus of Shewa; he submits to Yohannes IV in 1878 and keeps his kingdom.: Menelik flyr från Magdala och utropas till negus av Shewa; han underkastar sig Yohannes IV 1878 och behåller sitt kungarike.
  Samuel Baker annexes Gondokoro and the upper Nile for Egypt as the province of Equatoria.: Samuel Baker annekterar Gondokoro och övre Nilen för Egyptens räkning som provinsen Equatoria.
  Egypt occupies Keren and the Bogos under Werner Munzinger.: Egypten besätter Keren och Bogos under Werner Munzinger.
  Egypt annexes the Bahr el-Ghazal, conquered by the slave-trading armies of al-Zubayr Rahma Mansur, who is made its governor.: Egypten annekterar Bahr el-Ghazal, som har erövrats av al-Zubayr Rahma Mansurs slavhandelsarméer; han utnämns till dess guvernör.
  Al-Zubayr defeats and kills Sultan Ibrahim of Darfur and takes El Fasher for Egypt.: Al-Zubayr besegrar och dödar sultan Ibrahim av Darfur och intar El Fasher för Egyptens räkning.
  The Ottomans place a garrison at Ghat.: Osmanerna förlägger en garnison i Ghat.
  Egyptian troops occupy Harar; Zeila and Berbera are Egyptian too (1874–1884).: Egyptiska trupper besätter Harar; även Zeila och Berbera är egyptiska (1874–1884).
  Yusuf Ali Kenadid founds the Sultanate of Hobyo.: Yusuf Ali Kenadid grundar Hobyosultanatet.
  France builds a post at Aïn Sefra in the southern Oranais during the rising of Bou Amama.: Frankrike anlägger en post vid Aïn Sefra i södra Oranais under Bou Amamas resning.
  "Treaty of Bardo: the bey of Tunis accepts a French protectorate (confirmed by the La Marsa Convention of 1883). The beylik remains on the map as Tunisia.": "Bardofördraget: bejen av Tunis godtar ett franskt protektorat (bekräftat genom La Marsa-konventionen 1883). Bejliket finns kvar på kartan som Tunisien."
  The Italian state takes over Assab, bought by the Rubattino company in 1869.: Den italienska staten tar över Assab, som Rubattinobolaget köpte 1869.
  France annexes the Mzab, a protectorate since 1853.: Frankrike annekterar Mzab, ett protektorat sedan 1853.
  French troops under Borgnis-Desbordes occupy Bamako, linked to Kayes on the Senegal River by a line of forts.: Franska trupper under Borgnis-Desbordes besätter Bamako, som förbinds med Kayes vid Senegalfloden genom en rad fort.
  "Britain makes treaties with the Somali clans of the north coast as Egypt withdraws (1884–1886): British Somaliland.": "Storbritannien sluter fördrag med de somaliska klanerna på nordkusten när Egypten drar sig tillbaka (1884–1886): Brittiska Somaliland."
  France occupies Obock, bought in 1862, and makes treaties with the sultan of Tadjoura.: Frankrike besätter Obock, som köptes 1862, och sluter fördrag med sultanen av Tadjoura.
  Under the Hewett Treaty Egypt returns the Bogos (Keren) to Ethiopia.: Genom Hewettfördraget återlämnar Egypten Bogos (Keren) till Etiopien.
  Spain declares a protectorate over the coast of the Río de Oro between Cape Bojador and Cape Blanc, with a post at Villa Cisneros (Dakhla).: Spanien förklarar protektorat över Río de Oros kust mellan Kap Bojador och Kap Blanc, med en post vid Villa Cisneros (Dakhla).
  "The Mahdi’s army storms Khartoum and kills Gordon: the Mahdist State rules Sudan from Omdurman. Kordofan (1883), Darfur and the Bahr el-Ghazal (1883–1884) had already fallen. Suakin stays Egyptian, and Emin Pasha holds out in Equatoria until 1889.": "Mahdins armé stormar Khartoum och dödar Gordon: mahdiststaten styr Sudan från Omdurman. Kordofan (1883), Darfur och Bahr el-Ghazal (1883–1884) hade redan fallit. Suakin förblir egyptiskt, och Emin Pasha håller ut i Equatoria till 1889."
  Italian troops land at Massawa as the Egyptian garrison leaves.: Italienska trupper landstiger i Massawa när den egyptiska garnisonen lämnar staden.
  The Egyptians leave Harar; Emir Abdullahi rules it again.: Egyptierna lämnar Harar; emir Abdullahi styr åter staden.
  Kassala surrenders to the Mahdists.: Kassala kapitulerar för mahdisterna.
  Menelik of Shewa defeats Emir Abdullahi at Chelenqo and takes Harar. With the Arsi (1886), Wollega and the Gurage, much of the south is now under Shewa.: Menelik av Shewa besegrar emir Abdullahi vid Chelenqo och intar Harar. Med Arsi (1886), Wollega och guragernas land står nu stora delar av södern under Shewa.
  France founds Djibouti on the south shore of the Gulf of Tadjoura.: Frankrike grundar Djibouti på Tadjouravikens södra strand.
  The sultan of Hobyo accepts an Italian protectorate; Majeerteen follows on 7 April.: Sultanen av Hobyo godtar ett italienskt protektorat; Majeerteen följer den 7 april.
  Emin Pasha leaves Equatoria with Stanley’s relief expedition; the Mahdists, who took Rejaf in 1888, hold the upper Nile.: Emin Pasha lämnar Equatoria med Stanleys undsättningsexpedition; mahdisterna, som intog Rejaf 1888, behärskar övre Nilen.
  Italian troops occupy Keren and, on 3 August, Asmara; the colony of Eritrea is proclaimed on 1 January 1890.: Italienska trupper besätter Keren och den 3 augusti Asmara; kolonin Eritrea utropas den 1 januari 1890.
  Menelik of Shewa is crowned emperor of Ethiopia; Shewa and its conquests join the empire.: Menelik av Shewa kröns till kejsare av Etiopien; Shewa och dess erövringar går upp i kejsardömet.
  Archinard takes Ségou from Ahmadu, Umar Tall’s son.: Archinard tar Ségou från Ahmadu, Umar Talls son.
  Archinard takes Nioro.: Archinard intar Nioro.
  The sultan of Zanzibar leases the Benadir ports to Italy (bought outright in 1905).: Sultanen av Zanzibar arrenderar ut Benadirhamnarna till Italien (som köper dem helt och hållet 1905).
  Rabih az-Zubayr, a slave-trader’s commander from the Nile valley, conquers Baguirmi’s lands on the Chari and the Bornu empire west of Lake Chad. Kanem, long contested between Bornu and Wadai, is left to its alifas and the Awlad Sulayman.: Rabih az-Zubayr, befälhavare i en slavhandlares tjänst från Nildalen, erövrar Baguirmis land vid Chari och Bornuriket väster om Tchadsjön. Kanem, länge omstritt mellan Bornu och Wadai, lämnas åt sina alifa och Awlad Sulayman.
  Archinard takes Djenné and Bandiagara.: Archinard intar Djenné och Bandiagara.
  Bonnier’s column enters Timbuktu, which a French river flotilla had reached in December 1893; the Hodh and Walata come under French rule in the following years.: Bonniers kolonn tågar in i Timbuktu, som en fransk flodflottilj hade nått i december 1893; Hodh och Walata kommer under franskt styre under de följande åren.
  Italian troops take Kassala from the Mahdists.: Italienska trupper tar Kassala från mahdisterna.
  Menelik conquers Wolaita; the lands of the Rift Valley and the south-west follow.: Menelik erövrar Wolaita; länderna i Riftdalen och i sydväst följer.
  Britain makes the land up to the Juba the East Africa Protectorate.: Storbritannien gör landet upp till floden Juba till Östafrikanska protektoratet.
  Ras Welde Giyorgis defeats the sultan of Aussa at Arraddó (January 1896); Aussa becomes a tributary of Ethiopia and keeps its sultan. Ethiopia’s rule reaches the northern Afar lowlands.: Ras Welde Giyorgis besegrar sultanen av Aussa vid Arraddó (januari 1896); Aussa blir skattskyldigt under Etiopien och behåller sin sultan. Etiopiens välde når det norra afarlåglandet.
  Voulet’s column takes Ouagadougou; the Mossi kingdoms come under French protection (1895–1897).: Voulets kolonn intar Ouagadougou; mossirikena kommer under franskt beskydd (1895–1897).
  Kitchener’s Egyptian army takes Dongola.: Kitcheners egyptiska armé intar Dongola.
  French columns occupy Say, Dori, Bobo-Dioulasso and Gourma.: Franska kolonner besätter Say, Dori, Bobo-Dioulasso och Gourma.
  Menelik’s armies conquer the Borana and the Ogaden; treaties with Britain (May 1897) and France fix the eastern borders.: Meneliks arméer erövrar Borana och Ogaden; fördrag med Storbritannien (maj 1897) och Frankrike fastställer de östra gränserna.
  Congo Free State troops defeat the Mahdists at Rejaf and occupy the Lado Enclave on the west bank of the upper Nile, leased to King Leopold II by Britain in 1894.: Kongostatens trupper besegrar mahdisterna vid Rejaf och besätter Ladoenklaven på övre Nilens västra strand, som Storbritannien hade arrenderat ut till kung Leopold II 1894.
  Kitchener’s army occupies Berber.: Kitcheners armé besätter Berber.
  Ethiopian armies take the kingdom of Kaffa and capture its last king, Gaki Sherocho.: Etiopiska arméer tar kungariket Kaffa och tillfångatar dess siste kung, Gaki Sherocho.
  Italy hands Kassala to the Egyptian army.: Italien överlämnar Kassala till den egyptiska armén.
  Ethiopia takes Benishangul and the Gambela lowlands to the Sudan border.: Etiopien tar Benishangul och Gambelalåglandet fram till gränsen mot Sudan.
  French troops storm Sikasso and end the Kénédougou kingdom.: Franska trupper stormar Sikasso och gör slut på Kénédougouriket.
  Kitchener’s Anglo-Egyptian army destroys the Mahdist army at Omdurman. Under the Condominium Agreement of January 1899 Britain and Egypt rule Sudan jointly. In Darfur Ali Dinar restores the sultanate under nominal Anglo-Egyptian overlordship.: Kitcheners anglo-egyptiska armé förintar mahdistarmén vid Omdurman. Genom kondominatavtalet i januari 1899 styr Storbritannien och Egypten Sudan gemensamt. I Darfur återupprättar Ali Dinar sultanatet under nominell anglo-egyptisk överhöghet.
  French troops occupy Gao; the Tuareg of the Adrar des Ifoghas submit in the following years.: Franska trupper besätter Gao; tuaregerna i Adrar des Ifoghas underkastar sig under de följande åren.
  Remnants of the Voulet–Chanoine mission take Zinder and end the sultanate of Damagaram.: Resterna av Voulet–Chanoine-expeditionen intar Zinder och gör slut på Damagaramsultanatet.
  French columns take In Salah in the Tidikelt (December 1899) and the oases of the Tuat and Gourara, over the protests of the sultan of Morocco.: Franska kolonner intar In Salah i Tidikelt (december 1899) och oaserna i Tuat och Gourara, trots protester från Marockos sultan.
  French forces defeat and kill Rabih at Kousséri. Baguirmi, under French protection since 1897, and Rabih’s lands become the Military Territory of Chad.: Franska styrkor besegrar och dödar Rabih vid Kousséri. Baguirmi, under franskt beskydd sedan 1897, och Rabihs länder blir Militärterritoriet Tchad.
  The Treaty of Paris fixes the southern and eastern borders of Spain’s Río de Oro.: Parisfördraget fastställer de södra och östra gränserna för Spaniens Río de Oro.
  French troops defeat the Senussi at Bir Alali in Kanem.: Franska trupper besegrar senussierna vid Bir Alali i Kanem.
  The battle of Tit breaks the resistance of the Kel Ahaggar Tuareg; the Hoggar submits.: Slaget vid Tit bryter Kel Ahaggar-tuaregernas motstånd; Hoggar underkastar sig.
  France occupies Béchar (Colomb-Béchar) in the Saoura.: Frankrike besätter Béchar (Colomb-Béchar) i Saoura.
  France creates the Civil Territory of Mauritania from the emirates of Trarza and Brakna, which had accepted protectorates in 1902–1903.: Frankrike bildar Civilterritoriet Mauretanien av emiraten Trarza och Brakna, som hade godtagit protektorat 1902–1903.
  Coppolani’s column takes Tidjikja in the Tagant; Coppolani is killed there in May.: Coppolanis kolonn intar Tidjikja i Tagant; Coppolani dödas där i maj.
  French troops occupy Agadez.: Franska trupper besätter Agadez.
  Italy unites its Somali possessions as the colony of Italian Somaliland.: Italien förenar sina somaliska besittningar till kolonin Italienska Somaliland.
  Gouraud’s column takes Atar and the Emirate of Adrar.: Gourauds kolonn intar Atar och emiratet Adrar.
  French troops take Abéché, the capital of Wadai.: Franska trupper intar Abéché, Wadais huvudstad.
  After Leopold II’s death the Lado Enclave passes to the Anglo-Egyptian Sudan.: Efter Leopold II:s död övergår Ladoenklaven till Anglo-egyptiska Sudan.
  French troops occupy Djanet in the Tassili n’Ajjer, which the Ottomans had claimed.: Franska trupper besätter Djanet i Tassili n’Ajjer, som osmanerna hade gjort anspråk på.
  "Treaty of Fez: the sultan of Morocco accepts a French protectorate. The sultanate remains on the map as Morocco.": "Fèsfördraget: Marockos sultan godtar ett franskt protektorat. Sultanatet finns kvar på kartan som Marocko."
  "Treaty of Ouchy (Lausanne): the Ottoman Empire withdraws from Tripolitania and Cyrenaica, which Italy had annexed by decree in November 1911. Italian rule outside the coastal towns stays contested for twenty years; Kufra falls in 1931.": "Freden i Ouchy (Lausanne): Osmanska riket drar sig tillbaka från Tripolitanien och Cyrenaika, som Italien hade annekterat genom dekret i november 1911. Det italienska styret utanför kuststäderna förblir omstritt i tjugo år; Kufra faller 1931."
  A Franco-Spanish treaty gives Spain a zone of the protectorate in the north (the Rif and the Jebala, capital Tetouan) and in the south between the Draa and 27°40′ N (the Tarfaya Strip, administered with the Sahara), and confirms Spain’s claim to the Saguia el-Hamra. Spanish forces occupy Cape Juby in 1916 and Smara in 1934.: Ett fransk-spanskt fördrag ger Spanien en zon av protektoratet i norr (Rifbergen och Jebala, huvudstad Tétouan) och i söder mellan Draa och 27°40′ N (Tarfayaremsan, som förvaltas tillsammans med Sahara), och bekräftar Spaniens anspråk på Saguia el-Hamra. Spanska styrkor besätter Kap Juby 1916 och Smara 1934.
  French troops take the Senussi stronghold of Ain Galakka in Borkou.: Franska trupper intar senussiernas fäste Ain Galakka i Borkou.
  French troops reach Bardaï in the Tibesti (withdrawn in 1916, back from 1929).: Franska trupper når Bardaï i Tibesti (tillbakadragna 1916, åter där från 1929).
  France occupies the sultanate of Dar Sila.: Frankrike besätter sultanatet Dar Sila.
  An Anglo-Egyptian force takes El Fasher; Darfur is annexed to Sudan, and Ali Dinar is killed in November. Dar Masalit keeps its sultan until it is absorbed into Sudan after the Anglo-French border settlement.: En anglo-egyptisk styrka intar El Fasher; Darfur annekteras till Sudan, och Ali Dinar dödas i november. Dar Masalit behåller sin sultan tills området införlivas med Sudan efter den anglo-franska gränsuppgörelsen.
  Dar Masalit is joined to the Anglo-Egyptian Sudan (the sources give 1919 or 1922).: Dar Masalit förenas med Anglo-egyptiska Sudan (källorna anger 1919 eller 1922).
  "The Tangier Statute (1923) comes into force: Tangier becomes an international zone under the sultan’s nominal sovereignty. Spain occupies it from June 1940 to October 1945.": "Tangerstadgan (1923) träder i kraft: Tanger blir en internationell zon under sultanens nominella suveränitet. Spanien ockuperar staden från juni 1940 till oktober 1945."
  Britain cedes Jubaland, west of the Juba, to Italy.: Storbritannien avträder Jubaland, väster om Juba, till Italien.
  Italian troops occupy Hobyo and end the sultanate.: Italienska trupper besätter Hobyo och gör slut på sultanatet.
  Italian troops complete the conquest of the Majeerteen Sultanate.: Italienska trupper fullbordar erövringen av Majeerteensultanatet.
  French forces occupy the Tiris and join the Saharan zones of Mauritania, Algeria and Morocco.: Franska styrkor besätter Tiris och förenar Mauretaniens, Algeriets och Marockos saharazoner.
  French forces occupy Tindouf and join the Algerian, Moroccan and West African Sahara.: Franska styrkor besätter Tindouf och förenar det algeriska, det marockanska och det västafrikanska Sahara.
  Spanish troops occupy Ifni, ceded by Morocco in 1860.: Spanska trupper besätter Ifni, som Marocko hade avträtt 1860.
  Mussolini proclaims the annexation of Ethiopia four days after Italian troops enter Addis Ababa; on 1 June Ethiopia, Eritrea and Italian Somaliland are joined as Italian East Africa. Most states recognise the conquest by 1938, but the United States, the Soviet Union and a few others never do, and Ethiopian resistance continues (shown in the war’s steps).: Mussolini proklamerar annekteringen av Etiopien fyra dagar efter att italienska trupper har tågat in i Addis Abeba; den 1 juni förenas Etiopien, Eritrea och Italienska Somaliland till Italienska Östafrika. De flesta stater erkänner erövringen senast 1938, men USA, Sovjetunionen och några andra gör det aldrig, och det etiopiska motståndet fortsätter (visas i krigets steg).
  Eritrea and Italian Somaliland join Italian East Africa.: Eritrea och Italienska Somaliland går upp i Italienska Östafrika.
  Haile Selassie returns to Addis Ababa after the British and Ethiopian campaign. The Ogaden stays under British military administration, confirmed by the Anglo-Ethiopian agreement of January 1942, until 1948. Eritrea and Somalia are administered by Britain as occupied enemy territory.: Haile Selassie återvänder till Addis Abeba efter det brittiska och etiopiska fälttåget. Ogaden förblir under brittisk militärförvaltning, bekräftad genom det anglo-etiopiska avtalet i januari 1942, till 1948. Eritrea och Somalia förvaltas av Storbritannien som ockuperat fientligt territorium.
  The Anglo-Ethiopian agreement confirms British administration of the Ogaden and the Haud.: Det anglo-etiopiska avtalet bekräftar den brittiska förvaltningen av Ogaden och Haud.
  Ifni, the Sahara and the Tarfaya Strip are joined as Spanish West Africa, governed from Sidi Ifni.: Ifni, Sahara och Tarfayaremsan förenas till Spanska Västafrika, som styrs från Sidi Ifni.
  "The peace treaty with Italy, signed in February, comes into force: Italy gives up Libya. Britain, which has administered Tripolitania and Cyrenaica since 1942–1943, goes on doing so; France administers the Fezzan and Ghadames.": "Fredsfördraget med Italien, undertecknat i februari, träder i kraft: Italien avstår från Libyen. Storbritannien, som har förvaltat Tripolitanien och Cyrenaika sedan 1942–1943, fortsätter att göra det; Frankrike förvaltar Fezzan och Ghadames."
  "The peace treaty with Italy comes into force: Italy gives up Eritrea and Somalia, which remain under British military administration until the United Nations decides their future.": "Fredsfördraget med Italien träder i kraft: Italien avstår från Eritrea och Somalia, som förblir under brittisk militärförvaltning tills FN har beslutat om deras framtid."
  Britain hands the Ogaden back to Ethiopia; the Haud and the Reserved Area follow in 1955.: Storbritannien återlämnar Ogaden till Etiopien; Haud och Reserved Area följer 1955.
  Idris al-Senussi proclaims the Emirate of Cyrenaica, under British administration.: Idris al-Senussi utropar emiratet Cyrenaika under brittisk förvaltning.
  Italy takes over Somalia as a United Nations trust territory for ten years.: Italien tar över Somalia som FN:s förvaltarskapsområde under tio år.
  Libya becomes independent as the United Kingdom of Libya under King Idris, uniting Cyrenaica, Tripolitania and the Fezzan.: Libyen blir självständigt som Förenade kungariket Libyen under kung Idris och förenar Cyrenaika, Tripolitanien och Fezzan.
  Eritrea is federated with Ethiopia under the Ethiopian crown, by a United Nations resolution of 1950.: Eritrea federeras med Etiopien under den etiopiska kronan, enligt en FN-resolution från 1950.
  Sudan becomes independent.: Sudan blir självständigt.
  The French protectorate in Morocco ends.: Det franska protektoratet i Marocko upphör.
  Tunisia becomes independent; on 25 July 1957 the bey is deposed and Habib Bourguiba proclaims the republic.: Tunisien blir självständigt; den 25 juli 1957 avsätts bejen och Habib Bourguiba utropar republiken.
  Spain recognises Morocco’s independence and gives up its zone in the north.: Spanien erkänner Marockos självständighet och avstår från sin zon i norr.
  The Tangier international zone is returned to Morocco.: Den internationella zonen Tanger återlämnas till Marocko.
  "Spanish West Africa is dissolved: the Sahara (10 January) and Ifni (14 January) become Spanish provinces.": "Spanska Västafrika upplöses: Sahara (10 januari) och Ifni (14 januari) blir spanska provinser."
  Under the Angra de Cintra agreement of 1 April, Spain hands the Tarfaya Strip to Morocco.: Genom Angra de Cintra-avtalet den 1 april överlämnar Spanien Tarfayaremsan till Marocko.
  The Mali Federation of Senegal and the Sudanese Republic becomes independent; Senegal leaves it in August and the Sudanese Republic takes the name Mali on 22 September.: Malifederationen, bestående av Senegal och Sudanesiska republiken, blir självständig; Senegal lämnar den i augusti och Sudanesiska republiken antar namnet Mali den 22 september.
  British Somaliland becomes independent as the State of Somaliland.: Brittiska Somaliland blir självständigt som Staten Somaliland.
  Somaliland and the trust territory unite as the Somali Republic.: Somaliland och förvaltarskapsområdet förenas till Somaliska republiken.
  Niger becomes independent.: Niger blir självständigt.
  Upper Volta becomes independent; it is renamed Burkina Faso in 1984.: Övre Volta blir självständigt; landet byter namn till Burkina Faso 1984.
  Chad becomes independent.: Tchad blir självständigt.
  Mauritania becomes independent.: Mauretanien blir självständigt.
  Algeria becomes independent after the Évian Accords (March 1962) and the referendum of 1 July.: Algeriet blir självständigt efter Évianavtalen (mars 1962) och folkomröstningen den 1 juli.
  The Eritrean assembly votes to dissolve the federation, and Ethiopia annexes Eritrea.: Den eritreanska församlingen röstar för att upplösa federationen, och Etiopien annekterar Eritrea.
  Spain returns Ifni to Morocco.: Spanien återlämnar Ifni till Marocko.
  "Spain withdraws from Western Sahara under the Madrid Accords of November 1975, which divided its administration between Morocco and Mauritania; the Polisario Front proclaims the Sahrawi Arab Democratic Republic on 27 February. Western Sahara is shown as one territory, on the United Nations list of non-self-governing territories, its status disputed: Moroccan, Mauritanian and Polisario control are shown in the war’s steps.": "Spanien drar sig tillbaka från Västsahara enligt Madridavtalet från november 1975, som delade dess förvaltning mellan Marocko och Mauretanien; Polisario utropar Sahrawiska arabiska demokratiska republiken den 27 februari. Västsahara visas som ett enda territorium, på FN:s lista över icke självstyrande territorier, med omstridd status: Marockos, Mauretaniens och Polisarios kontroll visas i krigets steg."
  Djibouti becomes independent.: Djibouti blir självständigt.
  The Somali National Movement declares Somaliland independent within the borders of British Somaliland. It governs itself but no United Nations member recognised it until Israel did in December 2025.: Somaliska nationella rörelsen förklarar Somaliland självständigt inom Brittiska Somalilands gränser. Det styr sig självt, men ingen FN-medlem erkände det förrän Israel gjorde det i december 2025.
  The EPLF takes Asmara and Eritrea governs itself; it becomes formally independent on 24 May 1993 after the referendum.: EPLF intar Asmara och Eritrea styr sig självt; landet blir formellt självständigt den 24 maj 1993 efter folkomröstningen.
  South Sudan becomes independent after the referendum of January 2011 under the Comprehensive Peace Agreement. The status of Abyei is still disputed.: Sydsudan blir självständigt efter folkomröstningen i januari 2011 enligt det övergripande fredsavtalet. Abyeis status är fortfarande omstridd.
  "Africa south of the Sahara about 800. Farming and iron-working peoples, among them the Bantu-speaking peoples who have spread over most of Central, East and Southern Africa, live in villages and chiefdoms; Khoikhoi herders and San hunter-gatherers live in the far south-west, and Austronesian settlers have reached Madagascar. Towns are growing on the middle Niger (shown with the Sahel), at Igbo-Ukwu east of the lower Niger and on the Swahili coast, where traders from the Persian Gulf call. No states are shown here yet: the kingdoms appear as the written sources, oral traditions and archaeology begin to describe them.": "Afrika söder om Sahara omkring 800. Jordbrukande och järnsmidande folk, bland dem de bantutalande folk som har spridit sig över större delen av Central- och Östafrika och södra Afrika, lever i byar och hövdingdömen; khoikhoiherdar och san, som är jägare och samlare, lever längst i sydväst, och austronesiska nybyggare har nått Madagaskar. Städer växer fram vid mellersta Niger (visas med Sahel), i Igbo-Ukwu öster om nedre Niger och på Swahilikusten, där handelsmän från Persiska viken lägger till. Här visas ännu inga stater: kungarikena dyker upp i takt med att skriftliga källor, muntlig tradition och arkeologi börjar beskriva dem."
  Kano, one of the Hausa city-states; the Kano Chronicle, written down much later, dates the founding of its ruling house by Bagauda to about 999.: Kano, en av hausastadsstaterna; Kanokrönikan, som skrevs ned långt senare, daterar Bagaudas grundande av stadens härskarhus till omkring 999.
  Takrur on the middle Senegal is known to Arab writers by the eleventh century; according to al-Bakri its king War Jabi (died 1040–1041) was the first ruler there to adopt Islam.: Takrur vid mellersta Senegal är känt för arabiska författare senast på 1000-talet; enligt al-Bakri var dess kung War Jabi (död 1040–1041) den förste härskaren där som antog islam.
  Mapungubwe, near the confluence of the Shashe and the Limpopo, becomes the first state of the southern African interior, rich on gold and ivory traded to the coast (about 1075–1220).: Mapungubwe, nära sammanflödet av Shashe och Limpopo, blir den första staten i det inre av södra Afrika, rik på guld och elfenben som säljs till kusten (omkring 1075–1220).
  Kilwa Kisiwani becomes the leading city-state of the southern Swahili coast; the Kilwa Chronicle dates its Shirazi dynasty to the tenth century, archaeology to the twelfth.: Kilwa Kisiwani blir den ledande stadsstaten på södra Swahilikusten; Kilwakrönikan daterar dess shirazidynasti till 900-talet, arkeologin till 1100-talet.
  Mombasa, a Swahili city-state on its island, is described by al-Idrisi in the twelfth century.: Mombasa, en swahilisk stadsstat på sin ö, beskrivs av al-Idrisi på 1100-talet.
  The kingdom of Benin of the Edo; its present dynasty dates by tradition from about 1200, and the obas Ewuare (about 1440–1473) and his successors make it the strongest state of the forest.: Edofolkets kungarike Benin; dess nuvarande dynasti går enligt traditionen tillbaka till omkring 1200, och oban Ewuare (omkring 1440–1473) och hans efterträdare gör det till skogsbältets starkaste stat.
  Mapungubwe is abandoned and power moves north to Great Zimbabwe, whose stone enclosures are built from the thirteenth century; it controls the gold trade with the coast until about 1450.: Mapungubwe överges och makten flyttar norrut till Stora Zimbabwe, vars inhägnader av sten byggs från 1200-talet; det kontrollerar guldhandeln med kusten till omkring 1450.
  Sundiata Keita founds the Mali Empire (about 1235); its Mandinka heartland lies on the upper Niger around Niani, Siguiri and Kangaba (the site of the capital is debated).: Sundiata Keita grundar Maliriket (omkring 1235); mandinkafolkets kärnland ligger vid övre Niger kring Niani, Siguiri och Kangaba (var huvudstaden låg är omstritt).
  "The Mali Empire extends its rule west to the Gambia: by tradition Tiramakhan Traoré, a general of Sundiata, conquers the land that becomes Mali’s western province of Kaabu (thirteenth century; the dates are traditional).": "Maliriket utsträcker sitt välde västerut till Gambiafloden: enligt traditionen erövrar Tiramakhan Traoré, en av Sundiatas fältherrar, det land som blir Malis västra provins Kaabu (1200-talet; årtalen bygger på traditionen)."
  The Mali Empire conquers Takrur (about 1286) and rules it through military governors (farba).: Maliriket erövrar Takrur (omkring 1286) och styr det genom militära guvernörer (farba).
  The Hausa kingdom of Zamfara (by tradition from the eleventh century; Birnin Zamfara by the fourteenth).: Hausakungariket Zamfara (enligt traditionen från 1000-talet; Birnin Zamfara senast på 1300-talet).
  Under the Mahdali sultans Kilwa controls the gold trade of Sofala; Ibn Battuta visits Kilwa in 1331.: Under mahdalisultanerna kontrollerar Kilwa guldhandeln från Sofala; Ibn Battuta besöker Kilwa 1331.
  The Swahili towns of the Lamu archipelago, led in later centuries by Pate, flourish on the trade of the northern coast (by the fourteenth century).: Swahilistäderna i Lamuarkipelagen, under senare sekler ledda av Pate, blomstrar på handeln längs den norra kusten (senast på 1300-talet).
  The Jolof Empire, founded by tradition by Ndiadiane Ndiaye in the mid-fourteenth century, unites the Wolof and Serer kingdoms of Waalo, Cayor, Baol and Sine under the burba of Jolof.: Jolofriket, enligt traditionen grundat av Ndiadiane Ndiaye i mitten av 1300-talet, förenar wolofernas och serernas kungariken Waalo, Cayor, Baol och Sine under Jolofs burba.
  The Hausa kingdom of Katsina, ruled from the fourteenth century by the dynasty of Muhammadu Korau.: Hausakungariket Katsina, från 1300-talet styrt av Muhammadu Koraus dynasti.
  As Mali’s power in the west fades in the fourteenth century, Fulbe dynasties (the Lam Termes and Lam Taaga) take power in Takrur.: När Malis makt i väster bleknar under 1300-talet tar fulbedynastier (Lam Termes och Lam Taaga) makten i Takrur.
  Driven out of Kanem by the Bulala, the Sayfawa kings settle in Bornu, west of Lake Chad; Ali Gaji builds Birni Ngazargamu as their capital about 1470.: Fördrivna ur Kanem av bulala slår sig sayfawakungarna ned i Bornu, väster om Tchadsjön; Ali Gaji bygger Birni Ngazargamu som deras huvudstad omkring 1470.
  The Kingdom of Kongo is founded, by tradition by Lukeni lua Nimi, who conquers the land around Mbanza Kongo in the late fourteenth century; its provinces reach from the Congo River to the Dande and inland to the Kwango.: Kongoriket grundas, enligt traditionen av Lukeni lua Nimi, som erövrar landet kring Mbanza Kongo i slutet av 1300-talet; dess provinser sträcker sig från Kongofloden till Dande och inåt landet till Kwango.
  The Hausa kingdom of Zazzau, with Zaria as its capital from the sixteenth century (the dates are traditional).: Hausakungariket Zazzau, med Zaria som huvudstad från 1500-talet (årtalen bygger på traditionen).
  The Yoruba kingdom of Oyo north of the forest, with Oyo-Ile as its capital, and the Ijebu kingdom near the coast (by the fifteenth century; the dates are traditional).: Yorubakungariket Oyo norr om skogsbältet, med Oyo-Ile som huvudstad, och Ijeburiket nära kusten (senast på 1400-talet; årtalen bygger på traditionen).
  The Bamum kingdom of the western Grassfields, founded by tradition by Nchare Yen in the late fourteenth century; Foumban is its capital.: Bamumriket i västra Grassfields, enligt traditionen grundat av Nchare Yen i slutet av 1300-talet; Foumban är dess huvudstad.
  The Swahili city-state of Malindi (by the fifteenth century), whose envoys reach China in 1414–1415 and whose ruler welcomes Vasco da Gama in 1498 and becomes Portugal’s ally.: Swahilistadsstaten Malindi (senast på 1400-talet), vars sändebud når Kina 1414–1415 och vars härskare välkomnar Vasco da Gama 1498 och blir Portugals bundsförvant.
  The Mossi-related kingdoms of Dagbon and Mamprugu rule the savanna of the north, descended by tradition from Na Gbewaa; the dates are traditional.: De mossibesläktade kungarikena Dagbon och Mamprugu styr savannen i norr och härstammar enligt traditionen från Na Gbewaa; årtalen bygger på traditionen.
  The Akan state of Bono, with Bono-Manso as its capital, controls the trade routes between the forest gold fields and the Niger (by the fifteenth century).: Akanstaten Bono, med Bono-Manso som huvudstad, kontrollerar handelsvägarna mellan guldfälten i skogsbältet och Niger (senast på 1400-talet).
  The Karagwe kingdom west of Lake Victoria, ruled by the Hinda dynasty (by tradition from the fifteenth century).: Karagweriket väster om Victoriasjön, styrt av hindadynastin (enligt traditionen från 1400-talet).
  Great Zimbabwe is abandoned in the fifteenth century. Its heirs are the Mutapa kingdom in the north, founded by tradition by Nyatsimba Mutota, and the Torwa kingdom (Butua) in the south-west, with Khami as its capital.: Stora Zimbabwe överges under 1400-talet. Dess arvtagare är Mutapariket i norr, enligt traditionen grundat av Nyatsimba Mutota, och Torwariket (Butua) i sydväst, med Khami som huvudstad.
  The burba of Jolof conquers Takrur (in the 1450s; by about 1456) and divides it among his governors (farba).: Jolofs burba erövrar Takrur (på 1450-talet; senast omkring 1456) och delar upp det mellan sina guvernörer (farba).
  Portuguese settlers found Ribeira Grande on Santiago, the first European town in the tropics, on the uninhabited Cape Verde islands sighted in 1456–1460.: Portugisiska nybyggare grundar Ribeira Grande på Santiago, den första europeiska staden i tropikerna, på de obebodda Kap Verdeöarna, som hade siktats 1456–1460.
  Portuguese settlers found the town of São Tomé on the uninhabited island, which becomes a sugar colony worked by enslaved Africans.: Portugisiska nybyggare grundar staden São Tomé på den obebodda ön, som blir en sockerkoloni där förslavade afrikaner arbetar.
  Mbegan Ndour founds the kingdom of Saloum (about 1494).: Mbegan Ndour grundar kungariket Saloum (omkring 1494).
  The Aja kingdom of Allada controls the coast between the Mono and the Ouémé (by the sixteenth century).: Ajafolkets kungarike Allada kontrollerar kusten mellan Mono och Ouémé (senast på 1500-talet).
  The Bariba (Baatombu) kingdoms of Borgu, led by Nikki, rule the north of today’s Benin and the lands around Bussa on the Niger (by the sixteenth century; the traditions differ).: Baribas (baatombus) kungariken i Borgu, ledda av Nikki, styr norra delen av dagens Benin och landet kring Bussa vid Niger (senast på 1500-talet; traditionerna skiljer sig åt).
  The Igala kingdom, with Idah as its capital, rules the lands east of the Niger–Benue confluence (by about 1500).: Igalariket, med Idah som huvudstad, styr landet öster om sammanflödet mellan Niger och Benue (senast omkring 1500).
  The sultanate of Mandara (Wandala) rules the hills and plains south of Lake Chad (by about 1500).: Mandarasultanatet (Wandala) styr bergen och slätterna söder om Tchadsjön (senast omkring 1500).
  The Tio (Teke) kingdom, the Anziku of Portuguese writers, rules the plateaus north of Malebo Pool and the lands on both sides of the pool (by about 1500).: Tioriket (Teke), de portugisiska författarnas Anziku, styr platåerna norr om Malebo Pool och landet på båda sidor om sjön (senast omkring 1500).
  The Mbundu kingdom of Ndongo, ruled by the ngola, grows between the Kwanza and the Lukala as a tributary of Kongo (by about 1500).: Mbundufolkets kungarike Ndongo, styrt av ngola, växer fram mellan Kwanza och Lukala som skattland under Kongo (senast omkring 1500).
  Portugal settles the island of Príncipe.: Portugal koloniserar ön Príncipe.
  Bunyoro-Kitara, ruled by the Babiito dynasty from about 1500 (the dates are traditional), is the strongest kingdom of the lakes; its kings claim the heritage of the older Kitara of the Bachwezi.: Bunyoro-Kitara, styrt av babiitodynastin från omkring 1500 (årtalen bygger på traditionen), är det starkaste kungariket kring de stora sjöarna; dess kungar gör anspråk på arvet efter bachwezis äldre Kitara.
  The kingdom of Buganda on the north-west shore of Lake Victoria, founded by tradition by Kintu; its kabakas are dated from the fourteenth or fifteenth century.: Kungariket Buganda vid Victoriasjöns nordvästra strand, enligt traditionen grundat av Kintu; dess kabakor dateras från 1300- eller 1400-talet.
  The Nkore (Ankole) kingdom of the Hinda dynasty (by tradition from about 1500).: Hindadynastins kungarike Nkore (Ankole) (enligt traditionen från omkring 1500).
  Sultanates of Shirazi descent rule the Comoro islands, often at war with one another (by the sixteenth century); Malagasy raids devastate them around 1800.: Sultanat med härskare av shirazisk härkomst styr Komorerna och ligger ofta i krig med varandra (senast på 1500-talet); malagassiska räder ödelägger dem kring 1800.
  The Maravi kingdoms of the Phiri clan grow south and west of Lake Malawi under the kalonga (by the sixteenth century; the dates are uncertain).: Phiriklanens maravikungariken växer fram söder och väster om Malawisjön under kalonga (senast på 1500-talet; årtalen är osäkra).
  Francisco de Almeida takes Kilwa, installs a sultan friendly to Portugal and builds a fort; in August he sacks Mombasa. The Portuguese leave Kilwa in 1512.: Francisco de Almeida intar Kilwa, insätter en portugisvänlig sultan och bygger ett fort; i augusti plundrar han Mombasa. Portugiserna lämnar Kilwa 1512.
  Pero de Anaya builds a Portuguese fort at Sofala.: Pero de Anaya bygger ett portugisiskt fort i Sofala.
  The Portuguese build a fort on Mozambique Island, which becomes the capital of Portuguese East Africa.: Portugiserna bygger ett fort på Moçambiqueön, som blir huvudstad i Portugisiska Östafrika.
  The Portuguese abandon their fort at Kilwa.: Portugiserna överger sitt fort i Kilwa.
  Koli Tenguella, whose father Tenguella was killed fighting Songhai in 1512, leads his Fulbe from Futa Jallon across the upper Gambia and Senegal, takes Futa Toro from Jolof’s governors and founds the Denianke dynasty (1513 in some sources, about 1520 in others).: Koli Tenguella, vars far Tenguella stupade i strid mot songhai 1512, leder sina fulbe från Futa Jallon över övre Gambia och Senegal, tar Futa Toro från Jolofs guvernörer och grundar deniankedynastin (1513 enligt vissa källor, omkring 1520 enligt andra).
  Kanta Kotal, a commander in Songhai’s war against Aïr, breaks away and founds the kingdom of Kebbi (about 1516).: Kanta Kotal, en befälhavare i Songhais krig mot Aïr, bryter sig loss och grundar kungariket Kebbi (omkring 1516).
  Sine, like its Serer neighbour Saloum, leaves the Jolof Empire at least twenty-nine years before the battle of Danki (by about 1520).: Sine lämnar, liksom sin serergranne Saloum, Jolofriket minst tjugonio år före slaget vid Danki (senast omkring 1520).
  The Mbundu kingdom of Matamba on the upper Kwango (first mentioned in 1530).: Mbundufolkets kungarike Matamba vid övre Kwango (omnämnt första gången 1530).
  Tsoede (Edegi) founds the Nupe kingdom on the middle Niger (by tradition in 1531).: Tsoede (Edegi) grundar Nuperiket vid mellersta Niger (enligt traditionen 1531).
  The Nupe take and sack Oyo-Ile (about 1535); the alaafins flee to Borgu and later rule from Igboho (the dates are traditional).: Nupe intar och plundrar Oyo-Ile (omkring 1535); alaafinerna flyr till Borgu och styr senare från Igboho (årtalen bygger på traditionen).
  Kaabu, Mali’s western province, becomes an independent kingdom as Mali declines (the sources give 1537 or the mid-sixteenth century); the Mandinka kingdoms of the Gambia valley go their own ways.: Kaabu, Malis västra provins, blir ett självständigt kungarike när Mali går tillbaka (källorna anger 1537 eller mitten av 1500-talet); mandinkakungarikena i Gambiadalen går var och en sin egen väg.
  The Merina kingdom of Imerina in the central highlands of Madagascar, founded by tradition by Andriamanelo (about 1540).: Merinafolkets kungarike Imerina i Madagaskars centrala högland, enligt traditionen grundat av Andriamanelo (omkring 1540).
  Portuguese trading posts at Quelimane and Inhambane (by the 1540s).: Portugisiska handelsstationer i Quelimane och Inhambane (senast på 1540-talet).
  Amari Ngoone Sobel Fall of Cayor defeats the burba of Jolof at Danki (1549); Cayor becomes independent, and Waalo and Baol break away, leaving Jolof a small inland kingdom.: Amari Ngoone Sobel Fall av Cayor besegrar Jolofs burba vid Danki (1549); Cayor blir självständigt, och Waalo och Baol bryter sig loss, så att Jolof blir ett litet kungarike i inlandet.
  Mande horsemen found the kingdom of Gonja in the mid-sixteenth century; under Ndewura Jakpa (seventeenth century) it reaches its greatest size.: Manderyttare grundar kungariket Gonja i mitten av 1500-talet; under Ndewura Jakpa (1600-talet) når det sin största utbredning.
  The Kingdom of Loango on the coast north of the Congo, with the smaller kingdoms of Kakongo and Ngoyo (Cabinda), which are shown with it (by the sixteenth century).: Kungariket Loango vid kusten norr om Kongofloden, med de mindre kungarikena Kakongo och Ngoyo (Cabinda), som visas tillsammans med det (senast på 1500-talet).
  Paulo Dias de Novais founds São Paulo de Luanda, the start of the Portuguese colony of Angola; its wars with Ndongo begin in 1579.: Paulo Dias de Novais grundar São Paulo de Luanda, början på den portugisiska kolonin Angola; dess krig med Ndongo börjar 1579.
  The Portuguese conquer the lower Kwanza and Bengo valleys and build the fort of Massangano (1582).: Portugiserna erövrar de nedre dalgångarna kring Kwanza och Bengo och bygger fortet Massangano (1582).
  The Luba kingdom is founded between the Lomami and the upper Lualaba, by tradition by Kalala Ilunga (about 1585; the dates are traditional).: Lubariket grundas mellan Lomami och övre Lualaba, enligt traditionen av Kalala Ilunga (omkring 1585; årtalen bygger på traditionen).
  The Portuguese found Cacheu on the Guinea coast, a trading post of Cape Verde merchants.: Portugiserna grundar Cacheu på Guineakusten, en handelsstation för köpmän från Kap Verde.
  Portuguese settlers take over the Kerimba (Querimba) islands, among them Ibo (late sixteenth century).: Portugisiska nybyggare tar över Kerimbaöarna (Querimba), bland dem Ibo (slutet av 1500-talet).
  After sacking Mombasa again (1589) the Portuguese build Fort Jesus (1593) and make the sultan of Malindi, their ally, ruler of Mombasa.: Sedan portugiserna åter har plundrat Mombasa (1589) bygger de Fort Jesus (1593) och gör sin bundsförvant sultanen av Malindi till härskare över Mombasa.
  The Fante states of the coast, with Mankessim as their old centre, trade gold and, increasingly, enslaved people with the European forts at Cape Coast, Elmina and Anomabu.: Fantestaterna vid kusten, vars gamla centrum är Mankessim, handlar med guld och i allt högre grad med förslavade människor vid de europeiska forten i Cape Coast, Elmina och Anomabu.
  The Akan state of Akwamu rises inland from Accra (about 1600).: Akanstaten Akwamu växer fram i inlandet bakom Accra (omkring 1600).
  The kingdom of Whydah (Hueda), with Savi as its capital and Ouidah as its port, becomes the busiest slave-trading port of the coast in the late seventeenth century.: Kungariket Whydah (Hueda), med Savi som huvudstad och Ouidah som hamn, blir kustens livligaste slavhandelshamn i slutet av 1600-talet.
  Lagos (Eko), whose ruling house descends from a Benin war camp of the late sixteenth century, is ruled as a dependency of Benin.: Lagos (Eko), vars härskarhus härstammar från ett krigsläger från Benin i slutet av 1500-talet, styrs som ett lydland under Benin.
  The Xhosa chiefdoms between the Fish and the Mthatha rivers, under the paramountcy of the Tshawe royal house (by the seventeenth century).: Xhosahövdingdömena mellan floderna Fish och Mthatha, under tshawekungahusets överhöghet (senast på 1600-talet).
  Alaafin Abipa brings the court back to rebuild Oyo-Ile (about 1610).: Alaafin Abipa för hovet tillbaka för att återuppbygga Oyo-Ile (omkring 1610).
  The Portuguese found Benguela.: Portugiserna grundar Benguela.
  Denkyira becomes the leading Akan state of the forest between the Pra and the Ofin, with tributaries reaching west to Wassa and Aowin (about 1620); its capital is Abankeseso.: Denkyira blir den ledande akanstaten i skogsbältet mellan Pra och Ofin, med skattländer som når västerut till Wassa och Aowin (omkring 1620); dess huvudstad är Abankeseso.
  Imbangala bands under the leader Kasanje settle in the Baixa de Cassange below the Malanje escarpment and found the kingdom of Kasanje (about 1620), which grows rich as the middleman of the slave trade between the Lunda lands and Luanda.: Imbangalaskaror under ledaren Kasanje slår sig ned i Baixa de Cassange nedanför Malanjebranten och grundar kungariket Kasanje (omkring 1620), som blir rikt som mellanhand i slavhandeln mellan lundaländerna och Luanda.
  The kingdom of Dahomey is founded on the Abomey plateau (early seventeenth century; by tradition under Dakodonu and Houegbadja).: Kungariket Dahomey grundas på Abomeyplatån (början av 1600-talet; enligt traditionen under Dakodonu och Houegbadja).
  Shyaam a-Mbul founds the Kuba kingdom between the Kasai and the Sankuru (about 1625, by tradition).: Shyaam a-Mbul grundar Kubariket mellan Kasai och Sankuru (omkring 1625, enligt traditionen).
  After the treaty of 1629 that made the Mutapa a Portuguese vassal, Portuguese prazo holders take over the lower Zambezi valley around Sena and Quelimane.: Efter fördraget 1629, som gjorde Mutapas kung till portugisisk vasall, tar portugisiska prazoinnehavare över nedre Zambezidalen kring Sena och Quelimane.
  Njinga Mbande, driven from Ndongo by the Portuguese and their Imbangala allies, conquers Matamba and makes it her kingdom; the Portuguese keep a puppet king of Ndongo at Pungo Andongo.: Njinga Mbande, fördriven från Ndongo av portugiserna och deras imbangalabundsförvanter, erövrar Matamba och gör det till sitt kungarike; portugiserna håller en marionettkung över Ndongo i Pungo Andongo.
  Sultan Yusuf bin Hasan (Dom Jerónimo Chingulia) had killed the Portuguese of Fort Jesus in 1631 and fled; Portugal now rules Mombasa and Malindi directly.: Sultan Yusuf bin Hasan (Dom Jerónimo Chingulia) hade dödat portugiserna i Fort Jesus 1631 och flytt; Portugal styr nu Mombasa och Malindi direkt.
  The Dutch East India Company settles uninhabited Mauritius.: Nederländska ostindiska kompaniet koloniserar det obebodda Mauritius.
  The Dutch West India Company takes Luanda and Benguela; the Portuguese hold out at Massangano.: Nederländska västindiska kompaniet intar Luanda och Benguela; portugiserna håller ut i Massangano.
  Jacques Pronis of the French Compagnie de l’Orient founds Fort-Dauphin in the south-east of Madagascar; the settlers leave in 1674.: Jacques Pronis från det franska Compagnie de l’Orient grundar Fort-Dauphin i sydöstra Madagaskar; nybyggarna lämnar platsen 1674.
  The Portuguese found Ziguinchor on the Casamance as a dependency of Cacheu.: Portugiserna grundar Ziguinchor vid Casamance som ett lydområde under Cacheu.
  A fleet from Brazil under Salvador Correia de Sá retakes Luanda; the Dutch leave Angola.: En flotta från Brasilien under Salvador Correia de Sá återtar Luanda; holländarna lämnar Angola.
  Oyo’s cavalry makes it the dominant Yoruba state; its rule reaches the Egba forest and the towns of the Osun valley (by the mid-seventeenth century).: Tack vare sitt kavalleri blir Oyo den dominerande yorubastaten; dess välde når egbaskogen och städerna i Osundalen (senast i mitten av 1600-talet).
  The Nyiginya kingdom of Rwanda takes shape in central Rwanda in the seventeenth century (by tradition under Ruganzu Ndori).: Nyiginyadynastins kungarike Rwanda tar form i centrala Rwanda under 1600-talet (enligt traditionen under Ruganzu Ndori).
  The Sakalava kingdom of Menabe, founded by Andriandahifotsy in the mid-seventeenth century, rules the west coast of Madagascar.: Sakalavariket Menabe, grundat av Andriandahifotsy i mitten av 1600-talet, styr Madagaskars västkust.
  The Lozi (Luyi) kingdom of Barotseland on the upper Zambezi floodplain (by the seventeenth century).: Lozis (luyis) kungarike Barotseland på den övre Zambezis översvämningsslätt (senast på 1600-talet).
  The Pedi kingdom of the Maroteng (by tradition from the mid-seventeenth century); under Thulare (about 1780–1820) it dominates the north-eastern highveld.: Pediriket under marotengdynastin (enligt traditionen från mitten av 1600-talet); under Thulare (omkring 1780–1820) dominerar det nordöstra Highveld.
  The Ovambo kingdoms, among them Ndonga and Kwanyama, farm the floodplains between the Kunene and the Okavango (by the seventeenth century).: Ovamboriken, bland dem Ndonga och Kwanyama, odlar översvämningsslätterna mellan Kunene och Okavango (senast på 1600-talet).
  Jan van Riebeeck founds a Dutch East India Company station at the Cape; colonists spread over the south-western Cape, taking the land and herds of the Khoikhoi.: Jan van Riebeeck grundar en station för Nederländska ostindiska kompaniet vid Kap; kolonister sprider sig över sydvästra Kaplandet och tar khoikhoifolkets land och hjordar.
  The Dutch leave Mauritius; they return in 1664.: Holländarna lämnar Mauritius; de återvänder 1664.
  The English East India Company settles uninhabited St Helena.: Engelska ostindiska kompaniet koloniserar det obebodda Sankt Helena.
  The Dutch resettle Mauritius.: Holländarna återkoloniserar Mauritius.
  The Lunda kingdom of the Mwata Yamvo, with its capital (musumba) on the upper Kasai and Lulua, begins a century of expansion west to the Kwango and east to the Luapula (about 1665).: Mwata Yamvos lundarike, med sin huvudstad (musumba) vid övre Kasai och Lulua, inleder ett sekel av expansion västerut till Kwango och österut till Luapula (omkring 1665).
  The Portuguese take Pungo Andongo and end the kingdom of Ndongo.: Portugiserna intar Pungo Andongo och gör slut på kungariket Ndongo.
  The French abandon Fort-Dauphin.: Fransmännen överger Fort-Dauphin.
  The kingdom of Burundi is founded, by tradition by Ntare Rushatsi in the late seventeenth century; under Ntare Rugamba (about 1796–1850) it reaches its modern size.: Kungariket Burundi grundas, enligt traditionen av Ntare Rushatsi i slutet av 1600-talet; under Ntare Rugamba (omkring 1796–1850) når det sin nuvarande storlek.
  Akwamu completes its conquest of the Ga kingdom of Accra (1677–1681).: Akwamu fullbordar sin erövring av gafolkets kungarike Accra (1677–1681).
  Changamire Dombo, a former keeper of the Mutapa’s royal herds, conquers Butua and founds the Rozvi Empire (about 1683).: Changamire Dombo, som tidigare hade vaktat Mutapakungens hjordar, erövrar Butua och grundar Rozviriket (omkring 1683).
  The Portuguese found Bissau as a fortified trading post.: Portugiserna grundar Bissau som en befäst handelsstation.
  A prince of Allada founds the kingdom of Porto-Novo (Hogbonou) on the lagoon (by tradition in 1688).: En prins från Allada grundar kungariket Porto-Novo (Hogbonou) vid lagunen (enligt traditionen 1688).
  Malik Sy, a Fulbe cleric from Futa Toro, founds the almamate of Bundu between the Senegal and the Falémé (about 1690–1699).: Malik Sy, en religiös lärd från fulbefolket i Futa Toro, grundar almamatet Bundu mellan Senegal och Falémé (omkring 1690–1699).
  The Abron found the Gyaman kingdom around Bondoukou (late seventeenth century); it becomes a tributary of Asante after 1740.: Abronfolket grundar Gyamanriket kring Bondoukou (slutet av 1600-talet); det blir skattland under Ashanti efter 1740.
  A Sakalava prince founds the kingdom of Boina in the north-west (about 1690), around the port of Mahajanga; Boina and Menabe are shown together.: En sakalavaprins grundar kungariket Boina i nordväst (omkring 1690), kring hamnen Mahajanga; Boina och Menabe visas tillsammans.
  Changamire Dombo drives the Portuguese from the plateau (Dambarare, 1693) and from Manyika (1695).: Changamire Dombo driver bort portugiserna från platån (Dambarare, 1693) och från Manyika (1695).
  Omani forces take Fort Jesus after a siege of nearly three years (1696–1698); Oman becomes the leading power of the coast north of Cape Delgado and takes Zanzibar and Pemba.: Omanska styrkor intar Fort Jesus efter en nästan treårig belägring (1696–1698); Oman blir den ledande makten på kusten norr om Kap Delgado och tar Zanzibar och Pemba.
  The Ovimbundu kingdoms of the central highlands, among them Bailundo, Bié and Wambu (Huambo), grow rich on the caravan trade to Benguela (by the eighteenth century).: Ovimbunduriken i det centrala höglandet, bland dem Bailundo, Bié och Wambu (Huambo), blir rika på karavanhandeln till Benguela (senast på 1700-talet).
  The Tswana kingdoms (the Kwena, Ngwaketse and Ngwato, and further south the Rolong and Tlhaping) rule the eastern edge of the Kalahari (by the eighteenth century).: Tswanariken (kwena, ngwaketse och ngwato och längre söderut rolong och tlhaping) styr Kalaharis östra kant (senast på 1700-talet).
  Osei Tutu’s Asante, united under the Golden Stool, defeat Denkyira at Feyiase (1701); Asante takes Denkyira’s place as the strongest power of the forest.: Osei Tutus Ashanti, enat under den gyllene pallen, besegrar Denkyira vid Feyiase (1701); Ashanti tar Denkyiras plats som skogsbältets starkaste makt.
  Akwamu conquers the Ewe lands east of the Volta (1702–1710).: Akwamu erövrar ewefolkets land öster om Volta (1702–1710).
  St Helena passes with England to the Kingdom of Great Britain.: Sankt Helena övergår med England till Kungariket Storbritannien.
  Seku Wattara founds the Kong Empire, a state of Dyula traders and warriors in the north of the Ivory Coast (about 1710).: Seku Wattara grundar Kongriket, en stat av dyulahandelsmän och krigare i norra Elfenbenskusten (omkring 1710).
  The Dutch abandon Mauritius.: Holländarna överger Mauritius.
  Ratsimilaho unites the peoples of the north-east coast as the Betsimisaraka confederation (about 1712–1720).: Ratsimilaho förenar folken på nordöstra kusten i Betsimisarakaförbundet (omkring 1712–1720).
  France claims Mauritius as Île de France and settles it from 1721 with colonists and enslaved Africans and Malagasy; Rodrigues follows.: Frankrike gör anspråk på Mauritius som Île de France och koloniserar ön från 1721 med kolonister och förslavade afrikaner och malagasser; Rodrigues följer.
  Opoku Ware of Asante conquers Bono and destroys Bono-Manso (1723).: Opoku Ware av Ashanti erövrar Bono och förstör Bono-Manso (1723).
  Weakened by civil wars, the Mutapa kings keep their capital in the Zambezi valley (Chidima) from 1723; the northern plateau is held by independent Shona chiefdoms.: Försvagade av inbördeskrig behåller Mutapakungarna från 1723 sin huvudstad i Zambezidalen (Chidima); den norra platån behärskas av självständiga shonahövdingdömen.
  King Agaja of Dahomey conquers Allada.: Kung Agaja av Dahomey erövrar Allada.
  The Fulbe jihad of Karamokho Alfa and Ibrahima Sori founds the Imamate of Futa Jallon, with Timbo as its capital and Fugumba as its religious centre (about 1725; the dates are debated).: Karamokho Alfas och Ibrahima Soris fulbejihad grundar imamatet Futa Jallon, med Timbo som huvudstad och Fugumba som religiöst centrum (omkring 1725; årtalen är omstridda).
  Agaja conquers Whydah, giving Dahomey direct access to the European slave traders; Oyo’s invasions make Dahomey its tributary from 1730.: Agaja erövrar Whydah och ger därmed Dahomey direkt tillgång till de europeiska slavhandlarna; Oyos invasioner gör Dahomey till Oyos skattland från 1730.
  With the help of Pate, the Portuguese retake Mombasa and Fort Jesus.: Med Pates hjälp återtar portugiserna Mombasa och Fort Jesus.
  The Portuguese give up Fort Jesus after a rising in Mombasa, and Omani governors return.: Portugiserna ger upp Fort Jesus efter en resning i Mombasa, och omanska guvernörer återvänder.
  Akyem and its allies defeat Akwamu (1730), whose rulers withdraw to a small state on the Volta; Akyem takes over Akwamu’s lands west of the Volta and the rents of the Accra forts.: Akyem och dess bundsförvanter besegrar Akwamu (1730), vars härskare drar sig tillbaka till en liten stat vid Volta; Akyem tar över Akwamus land väster om Volta och arrendeavgifterna för forten i Accra.
  A Lunda general founds the kingdom of Kazembe on the Luapula (about 1740).: En lundafältherre grundar kungariket Kazembe vid Luapula (omkring 1740).
  Asante defeats Akyem (1742) and takes control of the trade routes to Accra.: Ashanti besegrar Akyem (1742) och tar kontroll över handelsvägarna till Accra.
  The Mazrui governors of Mombasa break with the new Busaidi rulers of Oman (1741–1746) and rule Mombasa and Pemba on their own; their state is shown as Mombasa.: Mazruiguvernörerna i Mombasa bryter med Omans nya busaidihärskare (1741–1746) och styr Mombasa och Pemba på egen hand; deras stat visas som Mombasa.
  Gobir, driven south from the borders of Aïr, settles in the Rima valley with Alkalawa as its capital (mid-eighteenth century).: Gobir, som har drivits söderut från Aïrs gränser, slår sig ned i Rimadalen med Alkalawa som huvudstad (mitten av 1700-talet).
  The Maravi kingdoms break up into rival chiefdoms (eighteenth century).: Maravikungarikena splittras i rivaliserande hövdingdömen (1700-talet).
  The Swazi kingdom takes shape under Ngwane III (mid-eighteenth century); Sobhuza I (about 1815–1836) builds it north of the Pongola.: Swaziriket tar form under Ngwane III (mitten av 1700-talet); Sobhuza I (omkring 1815–1836) bygger upp det norr om Pongolafloden.
  Gobir destroys Birnin Zamfara (the sources give 1756 to 1764) and takes Zamfara.: Gobir förstör Birnin Zamfara (källorna anger 1756 till 1764) och tar Zamfara.
  French settlers and enslaved Africans settle the uninhabited Seychelles, claimed by France in 1756.: Franska nybyggare och förslavade afrikaner slår sig ned på de obebodda Seychellerna, som Frankrike gjorde anspråk på 1756.
  Governor van Plettenberg makes the Great Fish River the Cape Colony’s eastern border; colonists and Xhosa fight the first frontier war in 1779–1781.: Guvernör van Plettenberg gör Great Fish River till Kapkolonins östgräns; kolonister och xhosa utkämpar det första gränskriget 1779–1781.
  In the Treaty of El Pardo Portugal cedes Fernando Po (Bioko) and Annobón to Spain; Spanish rule takes hold only in the 1840s, after a British naval base on Fernando Po (1827–1843).: Genom fördraget i El Pardo avträder Portugal Fernando Po (Bioko) och Annobón till Spanien; det spanska styret slår rot först på 1840-talet, efter en brittisk flottbas på Fernando Po (1827–1843).
  The Egba throw off Oyo rule under Lisabi (about 1775–1780).: Egbafolket gör sig fritt från Oyos välde under Lisabi (omkring 1775–1780).
  Buganda takes Buddu and other lands from Bunyoro (late eighteenth century) and becomes the strongest kingdom of the lakes.: Buganda tar Buddu och andra landområden från Bunyoro (slutet av 1700-talet) och blir det starkaste kungariket kring de stora sjöarna.
  Portugal builds a permanent fort at Lourenço Marques on Delagoa Bay, after Dutch (1721–1730) and Austrian (1777–1781) posts there.: Portugal bygger ett permanent fort i Lourenço Marques vid Delagoabukten, efter nederländska (1721–1730) och österrikiska (1777–1781) utposter där.
  Oman places a garrison at Kilwa Kisiwani; the last Kilwa sultans rule under Omani overlordship.: Oman förlägger en garnison i Kilwa Kisiwani; de sista Kilwasultanerna styr under omansk överhöghet.
  Black Loyalists from Nova Scotia found Freetown for the Sierra Leone Company, on land bought from Temne rulers; it becomes a British crown colony in 1808.: Svarta lojalister från Nova Scotia grundar Freetown för Sierra Leone-kompaniets räkning, på mark som köpts från temnehärskare; staden blir en brittisk kronkoloni 1808.
  Andrianampoinimerina reunites Imerina, makes Antananarivo his capital and extends his rule over Vakinankaratra (1790s–1800s).: Andrianampoinimerina återförenar Imerina, gör Antananarivo till sin huvudstad och utsträcker sitt välde över Vakinankaratra (1790-talet och början av 1800-talet).
  The Bemba kingdom of the Chitimukulu becomes the strongest power on the plateau of north-eastern Zambia between Lake Bangweulu and Lake Tanganyika (by about 1800; it expands most in the mid-nineteenth century).: Bembariket, styrt av chitimukulu, blir den starkaste makten på platån i nordöstra Zambia mellan Bangweulusjön och Tanganyikasjön (senast omkring 1800; det expanderar mest i mitten av 1800-talet).
  The fall of Alkalawa, the Gobir capital (October 1808), completes the conquest of the Hausa kingdoms by Usman dan Fodio’s jihad (1804–1808); his flag-bearers rule Kano, Katsina, Zaria and new emirates such as Bauchi and Gombe in the Sokoto Caliphate.: Med Gobirs huvudstad Alkalawas fall (oktober 1808) fullbordar Usman dan Fodios jihad (1804–1808) erövringen av hausakungarikena; hans fanbärare styr Kano, Katsina, Zaria och nya emirat som Bauchi och Gombe i Sokotokalifatet.
  Modibo Adama, a flag-bearer of Usman dan Fodio, begins to build the emirate of Adamawa (Fombina) on the upper Benue.: Modibo Adama, en av Usman dan Fodios fanbärare, börjar bygga upp emiratet Adamawa (Fombina) vid övre Benue.
  British forces take Île de France, ceded to Britain in 1814 with its dependencies, the Seychelles among them.: Brittiska styrkor intar Île de France, som avträds till Storbritannien 1814 tillsammans med sina lydområden, bland dem Seychellerna.
  Lamu defeats Pate and the Mazrui at Shela (about 1812) and calls in Oman, which garrisons a new fort at Lamu (1813–1821); the Lamu archipelago comes under Omani rule over the next decade.: Lamu besegrar Pate och mazruierna vid Shela (omkring 1812) och kallar in Oman, som lägger en garnison i ett nytt fort i Lamu (1813–1821); Lamuarkipelagen kommer under omanskt styre under det följande decenniet.
  Griqua communities of Khoikhoi and mixed descent, led by the Kok and Waterboer families, settle at Griquatown, the core of later Griqualand West.: Griquasamhällen av khoikhoi och folk av blandad härkomst, ledda av familjerna Kok och Waterboer, slår sig ned i Griquatown, kärnan i det senare Griqualand West.
  The Treaty of Paris confirms British rule of the Seychelles, a dependency of Mauritius until 1903.: Parisfreden bekräftar det brittiska styret över Seychellerna, som är ett lydområde under Mauritius till 1903.
  Britain garrisons Ascension during Napoleon’s exile on St Helena.: Storbritannien förlägger en garnison på Ascension under Napoleons exil på Sankt Helena.
  After invasions in 1807, 1811 and 1814–1816 the Fante states submit to Asante; only the European forts stay outside its rule.: Efter invasioner 1807, 1811 och 1814–1816 underkastar sig fantestaterna Ashanti; bara de europeiska forten står utanför dess välde.
  Britain annexes Tristan da Cunha.: Storbritannien annekterar Tristan da Cunha.
  Britain founds Bathurst (Banjul) on St Mary’s Island at the mouth of the Gambia, ceded by the king of Kombo.: Storbritannien grundar Bathurst (Banjul) på St Mary’s Island, som kungen av Kombo har avträtt, vid Gambiaflodens mynning.
  The emirate of Muri is founded on the middle Benue.: Emiratet Muri grundas vid mellersta Benue.
  Radama I, allied with Britain by a treaty of 1817, takes Toamasina and the north-east coast and conquers the Sihanaka of Lake Alaotra (1817–1823); Britain recognises him as king of Madagascar.: Radama I, som genom ett fördrag 1817 är allierad med Storbritannien, intar Toamasina och nordöstra kusten och erövrar sihanaka vid Alaotrasjön (1817–1823); Storbritannien erkänner honom som kung av Madagaskar.
  Shaka’s Zulu kingdom defeats the Ndwandwe (1818–1819) and becomes the strongest power between the Drakensberg and the sea.: Shakas zulurike besegrar ndwandwe (1818–1819) och blir den starkaste makten mellan Drakensberg och havet.
  Omani forces take Pemba from the Mazrui.: Omanska styrkor tar Pemba från mazruierna.
  Settlers sent by the American Colonization Society, free-born and formerly enslaved Black Americans, move to Cape Mesurado, where Monrovia is founded.: Nybyggare som har sänts av American Colonization Society, frifödda och tidigare förslavade svarta amerikaner, flyttar till Kap Mesurado, där Monrovia grundas.
  Afonja, Oyo’s general at Ilorin, had rebelled in 1817 with the help of Fulani and Hausa fighters; after his death (1823–1824) Ilorin becomes an emirate of the Sokoto Caliphate, and the Oyo Empire falls apart.: Afonja, Oyos fältherre i Ilorin, hade gjort uppror 1817 med hjälp av fulani- och hausakrigare; efter hans död (1823–1824) blir Ilorin ett emirat i Sokotokalifatet, och Oyoriket faller sönder.
  Radama’s armies reach the far north, Vohemar and the Antankarana lands.: Radamas arméer når längst upp i norr, till Vohemar och antankaranas land.
  Radama takes Mahajanga and the Sakalava kingdom of Boina.: Radama intar Mahajanga och sakalavariket Boina.
  Moshoeshoe gathers refugees of the wars of the 1820s at Thaba Bosiu and builds the Basotho kingdom.: Moshoeshoe samlar flyktingar från 1820-talets krig vid Thaba Bosiu och bygger upp Basothoriket.
  Merina armies take the south-east coast to Fort-Dauphin.: Merinaarméer tar sydöstra kusten ned till Fort-Dauphin.
  Soshangane, a Nguni leader driven north by the Zulu wars, founds the Gaza Empire in southern Mozambique (about 1825), with its capital in the lower Limpopo valley.: Soshangane, en av ngunifolkets ledare, som drivits norrut av zulukrigen, grundar Gazariket i södra Moçambique (omkring 1825), med huvudstad i nedre Limpopodalen.
  An army of the coastal states and the British defeats Asante at Katamanso (Dodowa) near Accra; Asante loses its hold on the south and in the treaty of 1831 gives up its claims to the coastal states, which come under informal British protection; Akyem Abuakwa, which fought on the coastal side, is independent again.: Kuststaternas och britternas armé besegrar Ashanti vid Katamanso (Dodowa) nära Accra; Ashanti förlorar greppet om söder och ger i fördraget 1831 upp sina anspråk på kuststaterna, som kommer under informellt brittiskt beskydd; Akyem Abuakwa, som stred på kuststaternas sida, är åter självständigt.
  Mzilikazi’s Ndebele settle on the Magaliesberg and the Marico, from where they raid the highveld (1827–1837).: Mzilikazis ndebele slår sig ned vid Magaliesberg och Marico, varifrån de plundrar Highveld (1827–1837).
  Yoruba soldiers settle at Ibadan, a war camp that grows into the strongest Yoruba power.: Yorubasoldater slår sig ned i Ibadan, ett krigsläger som växer till den starkaste yorubamakten.
  Dar al-Kuti, a Muslim state founded under the overlordship of Wadai, rules the lands north of the Ubangi basin (about 1830); from 1890 its sultan Muhammad al-Sanusi raids far to the south for slaves, from 1894 from his new capital Ndélé.: Dar al-Kuti, en muslimsk stat som grundats under Wadais överhöghet, styr landet norr om Ubangibäckenet (omkring 1830); från 1890 företar dess sultan Muhammad al-Sanusi slavräder långt söderut, från 1894 från sin nya huvudstad Ndélé.
  Kaboyo, a son of the Bunyoro king, makes Toro an independent kingdom (about 1830).: Kaboyo, en son till Bunyoros kung, gör Toro till ett självständigt kungarike (omkring 1830).
  By about 1830 the Merina kingdom rules the Betsileo highlands and the edge of the western plains; Menabe, the Bara and the peoples of the far south stay outside its rule.: Omkring 1830 styr Merinariket Betsileohöglandet och kanten av de västra slätterna; Menabe, bara och folken längst i söder står utanför dess välde.
  Moshoeshoe’s Basotho kingdom spreads over the fertile lowlands on both sides of the Caledon (1830s), which it defends against the Boers in the wars of 1858 and 1865–1868.: Moshoeshoes basothorike breder ut sig över det bördiga låglandet på båda sidor om Caledon (1830-talet), som det försvarar mot boerna i krigen 1858 och 1865–1868.
  Settlers of the Maryland State Colonization Society found Harper at Cape Palmas, the colony of Maryland in Africa (an independent republic from 1854).: Nybyggare från Maryland State Colonization Society grundar Harper vid Kap Palmas, kolonin Maryland i Afrika (självständig republik från 1854).
  Mallam Dendo’s sons make Nupe an emirate of the caliphate, and new emirates rule the lands south of Zaria (Keffi, Nasarawa, Lafia); the lamidates of Adamawa reach Garoua, Ngaoundéré and Tibati.: Mallam Dendos söner gör Nupe till ett emirat i kalifatet, och nya emirat styr landet söder om Zaria (Keffi, Nasarawa, Lafia); Adamawas lamidat når Garoua, Ngaoundéré och Tibati.
  After Zwangendaba’s Ngoni have ravaged the plateau (1833–1835), Nyamazana’s Ngoni take Danamombe and kill the Rozvi king Chirisamhuru (1835); the Rozvi Empire breaks up.: Sedan Zwangendabas ngoni har härjat platån (1833–1835) intar Nyamazanas ngoni Danamombe och dödar rozvikungen Chirisamhuru (1835); Rozviriket faller sönder.
  After the Sixth Frontier War Governor D’Urban annexes the land up to the Kei as Queen Adelaide Province.: Efter det sjätte gränskriget annekterar guvernör D’Urban landet upp till Kei som Drottning Adelaides provins.
  On London’s orders Queen Adelaide Province is given up, and the Xhosa chiefs regain their land under treaties with the Cape.: På Londons order ges Drottning Adelaides provins upp, och xhosahövdingarna återfår sitt land genom fördrag med Kapkolonin.
  Said bin Sultan takes Fort Jesus and ends Mazrui rule in Mombasa.: Said bin Sultan intar Fort Jesus och gör slut på mazruiernas styre i Mombasa.
  Voortrekker and Griqua-Rolong attacks drive the Ndebele north (1837); Voortrekkers settle Potchefstroom (1838). The trekker communities north of the Vaal unite as the South African Republic, recognised by Britain in the Sand River Convention of 1852.: Angrepp från voortrekkerna och griqua-rolong driver ndebele norrut (1837); voortrekkerna slår sig ned i Potchefstroom (1838). Voortrekkersamhällena norr om Vaal enas som Sydafrikanska republiken, som Storbritannien erkänner i Sand River-konventionen 1852.
  King Denis Rapontchombo of the Mpongwe signs a treaty giving France land on the Gabon estuary; a French post follows in 1843 and Libreville in 1849.: Kung Denis Rapontchombo av mpongwe undertecknar ett fördrag som ger Frankrike land vid Gabonestuariet; en fransk post följer 1843 och Libreville 1849.
  Monrovia and the settlements of Grand Bassa unite as the Commonwealth of Liberia; Liberia declares its independence in 1847.: Monrovia och bosättningarna i Grand Bassa enas som Samväldet Liberia; Liberia förklarar sig självständigt 1847.
  After their victory over Dingane at Blood River (Ncome, December 1838) the Voortrekkers proclaim the Republic of Natalia south of the Tugela.: Efter sin seger över Dingane vid Blood River (Ncome, december 1838) utropar voortrekkerna Republiken Natalia söder om Tugela.
  Ibadan defeats Ilorin at Osogbo (1840) and becomes the protector of the Osun towns.: Ibadan besegrar Ilorin vid Osogbo (1840) och blir Osunstädernas beskyddare.
  Portugal founds Moçâmedes (Namibe) on the southern coast.: Portugal grundar Moçâmedes (Namibe) på den södra kusten.
  Said bin Sultan moves his capital from Muscat to Zanzibar; his governors rule the mainland ports from Tanga to Bagamoyo, where the caravan routes to the Great Lakes begin.: Said bin Sultan flyttar sin huvudstad från Muskat till Zanzibar; hans guvernörer styr fastlandshamnarna från Tanga till Bagamoyo, där karavanvägarna till de stora sjöarna börjar.
  The Gaza Empire extends its rule north of the Save to the Zambezi (by about 1840) and takes tribute from the Portuguese posts of Sofala and Sena; from the 1860s its capital is Mossurize, in the highlands near the Save.: Gazariket utsträcker sitt välde norr om Save till Zambezi (senast omkring 1840) och tar tribut från de portugisiska posterna Sofala och Sena; från 1860-talet är dess huvudstad Mossurize, i höglandet nära Save.
  Mzilikazi’s Ndebele, driven from the Transvaal in 1837, settle north of the Limpopo (1838–1840); their kingdom raids and takes tribute from the Shona.: Mzilikazis ndebele, som drevs ut ur Transvaal 1837, slår sig ned norr om Limpopo (1838–1840); deras kungarike plundrar shona och tar tribut av dem.
  Sebetwane’s Kololo, Sotho migrants from the south, conquer Barotseland (about 1840).: Sebetwanes kololo, sothoinvandrare från söder, erövrar Barotseland (omkring 1840).
  Mississippi in Africa (Greenville, Sinoe) joins the Commonwealth of Liberia.: Mississippi i Afrika (Greenville, Sinoe) ansluter sig till Samväldet Liberia.
  France builds forts at Grand-Bassam and Assinie after treaties with the local rulers (1842–1843).: Frankrike bygger fort i Grand-Bassam och Assinie efter fördrag med de lokala härskarna (1842–1843).
  Britain annexes Natal.: Storbritannien annekterar Natal.
  Trekkers under Hendrik Potgieter settle Ohrigstad (1845) and Lydenburg (1849) in the east.: Voortrekkerna under Hendrik Potgieter slår sig ned i Ohrigstad (1845) och Lydenburg (1849) i öster.
  Sir Harry Smith extends the Cape Colony’s northern border to the Orange River.: Sir Harry Smith flyttar Kapkolonins nordgräns till Oranjefloden.
  "After the War of the Axe Britain annexes the land between the Fish and the Kei: the west to the Cape, the rest as the crown colony of British Kaffraria, joined to the Cape in 1866.": "Efter yxkriget annekterar Storbritannien landet mellan Fish och Kei: den västra delen till Kapkolonin, resten som kronkolonin Brittiska Kaffraria, som förenas med Kapkolonin 1866."
  Sir Harry Smith proclaims British sovereignty between the Orange and the Vaal (the Orange River Sovereignty); Britain withdraws in 1854 and the Boers form the Orange Free State.: Sir Harry Smith utropar brittisk suveränitet mellan Oranjefloden och Vaal (Oranjeflodssuveräniteten); Storbritannien drar sig tillbaka 1854 och boerna bildar Oranjefristaten.
  Umar Tall settles at Dinguiraye with his followers, the base from which he launches his jihad in 1852.: Umar Tall slår sig ned i Dinguiraye med sina anhängare; därifrån inleder han sin jihad 1852.
  Munyigumba unites the Hehe chiefdoms (about 1855); under his son Mkwawa (from 1879) the Hehe kingdom dominates the southern highlands of today’s Tanzania.: Munyigumba enar hehehövdingdömena (omkring 1855); under hans son Mkwawa (från 1879) dominerar Heheriket det södra höglandet i dagens Tanzania.
  Faidherbe’s troops conquer Waalo, which France annexes to Senegal.: Faidherbes trupper erövrar Waalo, som Frankrike införlivar med Senegal.
  Msiri, a Nyamwezi trader, builds the Yeke kingdom (Garanganze) in the copper country of southern Katanga, with Bunkeya as his capital (from about 1856).: Msiri, en nyamwezihandlare, bygger upp Yekeriket (Garanganze) i kopparlandet i södra Katanga, med Bunkeya som huvudstad (från omkring 1856).
  "After the death of Said bin Sultan his sons divide his realm: Majid rules Zanzibar and the African coast as a separate sultanate (confirmed by the Canning Award of 1861).": "Efter Said bin Sultans död delar hans söner upp hans rike: Majid styr Zanzibar och den afrikanska kusten som ett eget sultanat (bekräftat genom Canningskiljedomen 1861)."
  After a war with the Grebo and a referendum, the Republic of Maryland joins Liberia as Maryland County.: Efter ett krig med grebo och en folkomröstning ansluter sig Republiken Maryland till Liberia som Maryland County.
  France founds Dakar on the Cap-Vert peninsula, opposite its island of Gorée.: Frankrike grundar Dakar på Cap-Vert-halvön, mittemot sin ö Gorée.
  Ibadan brings the Ekiti kingdoms under its rule (1850s–1870s).: Ibadan lägger ekitikungarikena under sitt välde (från 1850-talet till 1870-talet).
  Rwanda absorbs Gisaka in the east (mid-nineteenth century), and under Kigeli IV Rwabugiri (about 1867–1895) royal rule reaches Lake Kivu; the north-west is brought under the court only in the 1910s.: Rwanda införlivar Gisaka i öster (mitten av 1800-talet), och under Kigeli IV Rwabugiri (omkring 1867–1895) når det kungliga styret Kivusjön; nordväst underordnas hovet först på 1910-talet.
  Britain annexes Lagos, which it had bombarded in 1851.: Storbritannien annekterar Lagos, som det hade bombarderat 1851.
  France extends its rule to Cape Lopez and the Orungu on the Ogooué delta.: Frankrike utsträcker sitt välde till Kap Lopez och orungu i Ogooués delta.
  The Lozi rise against the Kololo and restore their kingdom under Sipopa.: Lozi reser sig mot kololo och återupprättar sitt kungarike under Sipopa.
  After defeating the damel Lat Dior at Loro (12 January 1864), France restores its candidate Madiodio as damel and annexes Cayor (1865).: Sedan Frankrike har besegrat damel Lat Dior vid Loro (12 januari 1864) återinsätter det sin kandidat Madiodio som damel och annekterar Cayor (1865).
  In the treaty of Thaba Bosiu, after the second Free State–Basotho war, Moshoeshoe cedes the lowlands west of the Caledon, the Conquered Territory, to the Orange Free State; the cession is confirmed with a smaller border in the second treaty of Aliwal North (1869).: Genom fördraget i Thaba Bosiu, efter det andra kriget mellan Fristaten och basotho, avträder Moshoeshoe låglandet väster om Caledon, det ”erövrade territoriet” (Conquered Territory), till Oranjefristaten; avträdelsen bekräftas med en mindre gräns genom det andra fördraget i Aliwal North (1869).
  Futa Jallon’s army takes Kansala, the Kaabu capital, whose defenders blow it up (1867); Alfa Molo, a Fulbe leader, builds the kingdom of Fuladu on Kaabu’s ruins.: Futa Jallons armé intar Kansala, Kaabus huvudstad, vars försvarare spränger den i luften (1867); Alfa Molo, en fulbeledare, bygger upp kungariket Fuladu på Kaabus ruiner.
  An arbitration by US President Ulysses S. Grant awards Bolama, long claimed by Britain, to Portugal; Bolama becomes the capital of Portuguese Guinea in 1879.: En skiljedom av USA:s president Ulysses S. Grant tillerkänner Portugal Bolama, som Storbritannien länge hade gjort anspråk på; Bolama blir huvudstad i Portugisiska Guinea 1879.
  France, weakened by its war with Prussia, recognises Lat Dior as damel of Cayor again (July 1870; by treaty in January 1871).: Frankrike, försvagat av kriget mot Preussen, erkänner åter Lat Dior som damel av Cayor (juli 1870; genom fördrag i januari 1871).
  Britain annexes Griqualand West with the diamond fields around Kimberley.: Storbritannien annekterar Griqualand West med diamantfälten kring Kimberley.
  After the Anglo-Ashanti war of 1873–1874 Britain proclaims the Gold Coast Colony over the southern states it had protected; the Danes had sold their forts to Britain in 1850 and the Dutch theirs in 1872.: Efter det brittisk-ashantiska kriget 1873–1874 utropar Storbritannien kolonin Guldkusten över de sydliga stater det hade beskyddat; danskarna hade sålt sina fort till Storbritannien 1850 och holländarna sina 1872.
  Kabalega of Bunyoro reconquers Toro.: Kabalega av Bunyoro återerövrar Toro.
  The Ekiti, Ijesha and their allies rise against Ibadan as the Ekitiparapo, beginning the sixteen-year Kiriji War.: Ekiti, ijesha och deras bundsförvanter reser sig mot Ibadan som Ekitiparapo och inleder det sexton år långa Kirijikriget.
  Samori Touré, a Mandinka trader turned war leader, proclaims himself faama with his capital at Bissandougou (1878); his state is the Wassoulou Empire.: Samori Touré, en mandinkahandlare som har blivit krigsledare, utropar sig till faama med huvudstad i Bissandougou (1878); hans stat är Wassoulouriket.
  Britain annexes Walvis Bay, joined to the Cape Colony in 1884.: Storbritannien annekterar Walvis Bay, som förenas med Kapkolonin 1884.
  After its defeat at Ulundi (4 July 1879) the Zulu kingdom is divided by Wolseley among thirteen chiefs, and Cetshwayo is exiled.: Efter nederlaget vid Ulundi (4 juli 1879) delar Wolseley upp Zuluriket mellan tretton hövdingar, och Cetshwayo förvisas.
  British and Swazi troops storm Tsate, Sekhukhune’s capital, and capture him on 2 December; the Pedi kingdom falls to the Transvaal, then under British rule.: Brittiska trupper och swazitrupper stormar Tsate, Sekhukhunes huvudstad, och tillfångatar honom den 2 december; Pediriket faller till Transvaal, som då står under brittiskt styre.
  Griqualand West is joined to the Cape Colony.: Griqualand West förenas med Kapkolonin.
  Samori takes Kankan (1881) and extends his rule over the upper Niger, the Bouré gold country and the edge of the forest.: Samori intar Kankan (1881) och utsträcker sitt välde över övre Niger, guldlandet Bouré och skogsbältets kant.
  Vakaba Touré’s kingdom of Kabadougou (Odienné) comes under Samori’s rule.: Vakaba Tourés kungarike Kabadougou (Odienné) kommer under Samoris välde.
  France groups its posts and protectorates on the Guinea coast (Boké, Boffa, Dubréka, Conakry) as the Rivières du Sud, from 1891 French Guinea.: Frankrike sammanför sina poster och protektorat på Guineakusten (Boké, Boffa, Dubréka, Conakry) som Rivières du Sud, från 1891 Franska Guinea.
  The French parliament ratifies the treaty in which Makoko, king of the Tio, placed his lands under French protection (signed with Brazza in 1880); Brazzaville grows on the north bank of the pool.: Det franska parlamentet ratificerar fördraget genom vilket Makoko, kung av Tio, ställde sina länder under franskt beskydd (undertecknat med Brazza 1880); Brazzaville växer fram på norra stranden av Malebo Pool.
  The Ma Loango places Loango under French protection, and France occupies the coast.: Ma Loango ställer Loango under franskt beskydd, och Frankrike besätter kusten.
  Gustav Nachtigal signs a protection treaty with Mlapa III at Togoville; the coast becomes the German protectorate of Togoland.: Gustav Nachtigal undertecknar ett beskyddarfördrag med Mlapa III i Togoville; kusten blir det tyska protektoratet Togoland.
  Gustav Nachtigal raises the German flag at Douala after treaties with the Duala kings (12 July 1884); Kamerun becomes a German protectorate.: Gustav Nachtigal hissar den tyska flaggan i Douala efter fördrag med dualakungarna (12 juli 1884); Kamerun blir ett tyskt protektorat.
  Germany raises its flag at Lüderitz Bay (Angra Pequena), bought by the Bremen merchant Adolf Lüderitz in 1883; the coast becomes German South West Africa.: Tyskland hissar sin flagga vid Lüderitzbukten (Angra Pequena), som Bremenköpmannen Adolf Lüderitz köpte 1883; kusten blir Tyska Sydvästafrika.
  Boer volunteers who had helped Dinuzulu win the Zulu civil war take a large part of western Zululand as their reward and proclaim the New Republic (Nieuwe Republiek) at Vryheid; Britain recognises a reduced version of it in 1886.: Boerfrivilliga som hade hjälpt Dinuzulu att vinna inbördeskriget i Zululand tar en stor del av västra Zululand som belöning och utropar Nya republiken (Nieuwe Republiek) i Vryheid; Storbritannien erkänner 1886 republiken i mindre omfattning.
  Portugal, which attacked the Mutapa state in 1884, annexes its last lands in Chidima and drives Mwenemutapa Dzuda into exile. His successor Chioko leads a rising that holds much of the Tete region (1897–1902) until he is killed helping the Barue against the Portuguese.: Portugal, som angrep Mutapastaten 1884, annekterar dess sista landområden i Chidima och driver mwenemutapa Dzuda i exil. Hans efterträdare Chioko leder en resning som behärskar stora delar av Teteregionen (1897–1902) tills han dödas när han hjälper barue mot portugiserna.
  "The Cape annexes the Transkei piecemeal (1879–1894): Fingoland, Gcalekaland, Thembuland, Griqualand East and last Pondoland (1894).": "Kapkolonin annekterar Transkei bit för bit (1879–1894): Fingoland, Gcalekaland, Thembuland, Griqualand East och sist Pondoland (1894)."
  In the treaty of Simulambuco the princes of Cabinda accept Portuguese protection.: Genom fördraget i Simulambuco godtar Cabindas furstar portugisiskt beskydd.
  France and the International Association of the Congo agree their border; the Berlin conference (26 February 1885) recognises King Leopold II’s Congo Free State, which claims the Congo basin, and France the lands of Gabon and the Congo north and west of it.: Frankrike och Internationella Kongosällskapet kommer överens om sin gräns; Berlinkonferensen (26 februari 1885) erkänner kung Leopold II:s Kongostat, som gör anspråk på Kongobäckenet, och Frankrikes anspråk på länderna i Gabon och Kongo norr och väster därom.
  Britain proclaims the Bechuanaland Protectorate between the Molopo and 22° S, where the Tswana kings keep much of their power; to the south Warren’s expedition has ended the Boer republics of Stellaland and Goshen.: Storbritannien utropar Bechuanalandprotektoratet mellan Molopo och 22° S, där tswanakungarna behåller mycket av sin makt; söderut har Warrens expedition gjort slut på boerrepublikerna Stellaland och Goshen.
  Britain proclaims the Oil Rivers Protectorate over the Niger delta and the Cross River (Bonny, Kalabari, Brass, Opobo, Old Calabar) and the lands behind them.: Storbritannien utropar Oil Rivers-protektoratet över Nigerdeltat och Cross River (Bonny, Kalabari, Brass, Opobo, Old Calabar) och landet bakom dem.
  The land south of the Molopo becomes the crown colony of British Bechuanaland.: Landet söder om Molopo blir kronkolonin Brittiska Bechuanaland.
  The treaty ending the Franco-Hova War gives France the bay of Diego-Suarez and control of Madagascar’s foreign affairs.: Fördraget som avslutar fransk-hovakriget ger Frankrike Diego-Suarezbukten och kontroll över Madagaskars utrikesärenden.
  Agreements with Britain (1885–1886) and France (December 1885) fix the coastal borders of Kamerun; Germany claims the forest and the Grassfields behind them, which it conquers over the next two decades.: Avtal med Storbritannien (1885–1886) och Frankrike (december 1885) fastställer Kameruns kustgränser; Tyskland gör anspråk på skogen och Grassfields bakom dem, som det erövrar under de följande två decennierna.
  In the treaty of Kéniéba-Koura Samori gives up the left bank of the Niger and the Bouré to France; France builds a fort at Siguiri in 1888.: Genom fördraget i Kéniéba-Koura ger Samori upp Nigers vänstra strand och Bouré till Frankrike; Frankrike bygger ett fort i Siguiri 1888.
  A Franco-Portuguese convention fixes the borders of Portuguese Guinea; Portugal gives up Ziguinchor and the Casamance to France (handed over in 1888).: En fransk-portugisisk konvention fastställer Portugisiska Guineas gränser; Portugal ger upp Ziguinchor och Casamance till Frankrike (överlämnade 1888).
  The Royal Niger Company receives a royal charter to govern the lands along the lower Niger and Benue covered by its treaties.: Royal Niger Company får ett kungligt privilegiebrev att styra de länder längs nedre Niger och Benue som omfattas av dess fördrag.
  Samba Laobé Fall, the damel France had installed in 1883, is killed at Tivaouane after a quarrel with the French; France abolishes the kingship and divides Cayor into provinces. Lat Dior, who had fought the railway from Dakar to Saint-Louis, is killed at Dékheulé on 27 October.: Samba Laobé Fall, den damel som Frankrike hade insatt 1883, dödas i Tivaouane efter en tvist med fransmännen; Frankrike avskaffar kungadömet och delar upp Cayor i provinser. Lat Dior, som hade bekämpat järnvägen från Dakar till Saint-Louis, dödas vid Dékheulé den 27 oktober.
  An Anglo-German agreement recognises the sultan of Zanzibar’s coastal strip and divides the mainland behind it into a British sphere in the north and a German sphere in the south; the chartered companies of both countries make treaties with local rulers, and occupation follows over the next twenty years.: Ett brittisk-tyskt avtal erkänner sultanen av Zanzibars kustremsa och delar fastlandet bakom den i en brittisk intressesfär i norr och en tysk i söder; båda ländernas privilegierade kompanier sluter fördrag med lokala härskare, och ockupationen följer under de kommande tjugo åren.
  A Portuguese–German treaty fixes the southern border of Angola; Portugal claims the lands behind its coast, which it conquers between the 1880s and 1917.: Ett portugisisk-tyskt fördrag fastställer Angolas södra gräns; Portugal gör anspråk på länderna bakom sin kust, som det erövrar mellan 1880-talet och 1917.
  The Portuguese–German treaty makes the Rovuma the border between Mozambique and German East Africa.: Det portugisisk-tyska fördraget gör Rovuma till gräns mellan Moçambique och Tyska Östafrika.
  The Portuguese–German treaty fixes the northern border of German South West Africa; Germany makes protection treaties with Herero and Nama leaders and claims the interior.: Det portugisisk-tyska fördraget fastställer Tyska Sydvästafrikas norra gräns; Tyskland sluter beskyddarfördrag med herero- och namaledare och gör anspråk på inlandet.
  France and the Congo Free State make the Ubangi their border; French posts spread up the river, where Bangui is founded in 1889.: Frankrike och Kongostaten gör Ubangi till sin gräns; franska poster sprider sig uppför floden, där Bangui grundas 1889.
  Britain annexes Zululand, except the Boer New Republic (joined to the Transvaal in 1888); Zululand is joined to Natal in 1897.: Storbritannien annekterar Zululand, utom boernas Nya republiken (som förenas med Transvaal 1888); Zululand förenas med Natal 1897.
  Mamadou Lamine Dramé, who had taken Bundu in his war with France, is killed; France takes over Bundu.: Mamadou Lamine Dramé, som hade tagit Bundu i sitt krig mot Frankrike, dödas; Frankrike tar över Bundu.
  The New Republic joins the South African Republic (Transvaal) as its Vryheid district.: Nya republiken ansluts till Sydafrikanska republiken (Transvaal) som dess distrikt Vryheid.
  An Anglo-French convention fixes the borders of the British Gambia, a strip along the river; Britain proclaims its protectorate over the interior in 1894.: En brittisk-fransk konvention fastställer gränserna för Brittiska Gambia, en remsa längs floden; Storbritannien utropar sitt protektorat över inlandet 1894.
  A French column enters Jolof; its burba, Alboury Ndiaye, withdraws east to join Ahmadu of the Toucouleur Empire.: En fransk kolonn tränger in i Jolof; dess burba, Alboury Ndiaye, drar sig österut för att ansluta sig till Ahmadu i Toucouleurriket.
  Britain extends the Bechuanaland Protectorate north of 22° S, over Ngamiland and the lands to the Chobe.: Storbritannien utsträcker Bechuanalandprotektoratet norr om 22° S, över Ngamiland och landet upp till Chobe.
  The Anglo-German agreement of 1890 fixes Togoland’s western border; Germany claims the Ewe uplands west and north of Lomé.: Det brittisk-tyska avtalet 1890 fastställer Togolands västra gräns; Tyskland gör anspråk på ewefolkets högland väster och norr om Lomé.
  The British South Africa Company’s Pioneer Column raises the flag at Fort Salisbury (Harare); the company rules Mashonaland under its charter of 1889.: Brittiska Sydafrikakompaniets pionjärkolonn hissar flaggan vid Fort Salisbury (Harare); kompaniet styr Mashonaland enligt sitt privilegiebrev från 1889.
  After the first Franco-Dahomean war Dahomey recognises French rule of Cotonou and the French protectorate over Porto-Novo.: Efter det första fransk-dahomeyska kriget erkänner Dahomey det franska styret över Cotonou och det franska protektoratet över Porto-Novo.
  Germany buys the sultan’s coastal strip south of the Umba, after the Abushiri revolt (1888–1890) against the German East Africa Company, which had leased it in 1888; German rule begins on 1 January 1891.: Tyskland köper sultanens kustremsa söder om Umba efter Abushiriupproret (1888–1890) mot Tyska Östafrikakompaniet, som hade arrenderat den 1888; det tyska styret börjar den 1 januari 1891.
  Emin Pasha founds the German station of Bukoba; Karagwe and the Haya kingdoms come under German rule.: Emin Pasha grundar den tyska stationen Bukoba; Karagwe och hayakungarikena kommer under tyskt styre.
  France brings Baol, Sine and Saloum under its protectorate administration (1887–1894; their kings become chiefs under French rule) and ends the resistance in Futa Toro, where Abdul Bokar Kane is killed (1891).: Frankrike lägger Baol, Sine och Saloum under sin protektoratsförvaltning (1887–1894; deras kungar blir hövdingar under franskt styre) och gör slut på motståndet i Futa Toro, där Abdul Bokar Kane dödas (1891).
  France occupies Dinguiraye.: Frankrike besätter Dinguiraye.
  The Luba kingdom has broken up in succession wars and raids by Swahili-Arab and Chokwe traders; Free State expeditions take over its lands (1891–1892).: Lubariket har fallit sönder genom tronföljdskrig och räder av swahili-arabiska handlare och chokwehandlare; Kongostatens expeditioner tar över dess land (1891–1892).
  Lugard restores Toro under Kasagama, with British protection.: Lugard återupprättar Toro under Kasagama, med brittiskt beskydd.
  An Anglo-Italian protocol makes the Juba the border between the British and Italian spheres.: Ett brittisk-italienskt protokoll gör Juba till gräns mellan den brittiska och den italienska intressesfären.
  Archinard’s column takes Kankan.: Archinards kolonn intar Kankan.
  Britain proclaims a protectorate over the lands west and south of Lake Malawi, the British Central Africa Protectorate (Nyasaland from 1907); the Yao chiefs and the Maseko Ngoni are conquered by 1898, and the northern Ngoni accept British rule in 1904.: Storbritannien utropar ett protektorat över landet väster och söder om Malawisjön, Brittiska Centralafrikaprotektoratet (Nyasaland från 1907); yaohövdingarna och maseko-ngoni är besegrade 1898, och de nordliga ngoni godtar brittiskt styre 1904.
  A treaty between Portugal and the Congo Free State divides the old Lunda lands.: Ett fördrag mellan Portugal och Kongostaten delar upp de gamla lundaländerna.
  The Anglo-Portuguese treaty fixes the eastern border of Angola (the Barotse border is settled by arbitration in 1905).: Det brittisk-portugisiska fördraget fastställer Angolas östra gräns (gränsen mot Barotse avgörs genom skiljedom 1905).
  The Anglo-Portuguese treaty fixes the borders of Mozambique and the British lands north of the Zambezi, which the British South Africa Company governs. Portugal receives the Gaza lands north of the Save, which Ngungunhane had left when he moved his capital south in 1889, and conquers its interior by about 1920; the company conquers Mpezeni’s Ngoni in 1898 and brings the Bemba under its rule by 1899.: Det brittisk-portugisiska fördraget fastställer gränserna för Moçambique och för de brittiska länderna norr om Zambezi, som Brittiska Sydafrikakompaniet styr. Portugal får gazaländerna norr om Save, som Ngungunhane hade lämnat när han flyttade sin huvudstad söderut 1889, och har erövrat dess inland omkring 1920; kompaniet besegrar Mpezenis ngoni 1898 och har lagt bemba under sitt styre 1899.
  A Free State expedition under William Stairs kills Msiri at Bunkeya; the Yeke kingdom falls to the Congo Free State.: En expedition från Kongostaten under William Stairs dödar Msiri i Bunkeya; Yekeriket faller till Kongostaten.
  Humbert’s column takes Bissandougou; Samori abandons his homeland and moves his state east, into the northern Ivory Coast (1892–1894).: Humberts kolonn intar Bissandougou; Samori överger sitt hemland och flyttar sin stat österut, in i norra Elfenbenskusten (1892–1894).
  British troops defeat the Ijebu at Imagbon and occupy Ijebu-Ode.: Brittiska trupper besegrar ijebu vid Imagbon och besätter Ijebu-Ode.
  After Dodds’s capture of Abomey (17 November 1892) France annexes Ouidah and the coastal lands of Dahomey.: Sedan Dodds har intagit Abomey (17 november 1892) annekterar Frankrike Ouidah och Dahomeys kustland.
  A Franco-Liberian treaty fixes the border between French Guinea and Liberia; the forest peoples of the south (the Kissi, Toma, Kpelle and Mano) come under French rule over the next twenty years.: Ett fransk-liberianskt fördrag fastställer gränsen mellan Franska Guinea och Liberia; skogsfolken i söder (kissi, toma, kpelle och mano) kommer under franskt styre under de kommande tjugo åren.
  Treaties with Britain (1885) and France (1892) fix Liberia’s borders; the government in Monrovia extends its rule over the peoples of the interior only in the early twentieth century.: Fördrag med Storbritannien (1885) och Frankrike (1892) fastställer Liberias gränser; regeringen i Monrovia utsträcker sitt styre över folken i inlandet först i början av 1900-talet.
  Rabih az-Zubayr conquers Bornu and destroys its capital Kukawa.: Rabih az-Zubayr erövrar Bornu och förstör dess huvudstad Kukawa.
  France makes the Ivory Coast a colony; treaties made by Binger and Treich-Laplène give it claims to the interior, whose peoples (the Baoulé, Bété, Guro, Dan and others) resist French rule into the 1910s.: Frankrike gör Elfenbenskusten till koloni; fördrag som Binger och Treich-Laplène har slutit ger det anspråk på inlandet, vars folk (baoulé, bété, guro, dan och andra) gör motstånd mot det franska styret in på 1910-talet.
  Governor Carter’s treaties bring Ibadan, Oyo and the Ekiti and Ondo kingdoms into the British protectorate of Lagos; Ibadan accepts a British resident. The Egba keep their independence.: Guvernör Carters fördrag för in Ibadan, Oyo och ekiti- och ondokungarikena i det brittiska protektoratet Lagos; Ibadan godtar en brittisk resident. Egba behåller sin självständighet.
  Company forces take Bulawayo; Lobengula flees and dies early in 1894, and the Ndebele kingdom falls.: Kompaniets styrkor intar Bulawayo; Lobengula flyr och dör i början av 1894, och Ndebeleriket faller.
  Samori rebuilds his state in the north of the Ivory Coast, with Dabakala as its capital.: Samori bygger upp sin stat på nytt i norra Elfenbenskusten, med Dabakala som huvudstad.
  Agoli-Agbo, a brother of King Béhanzin, signs the surrender, and France makes him king of a smaller Dahomey on the Abomey plateau under a French resident; France takes the rest of the kingdom and its neighbours. Béhanzin gives himself up later in January.: Agoli-Agbo, en bror till kung Béhanzin, undertecknar kapitulationen, och Frankrike gör honom till kung över ett mindre Dahomey på Abomeyplatån under en fransk resident; Frankrike tar resten av kungariket och dess grannar. Béhanzin ger sig senare i januari.
  A Franco-German protocol fixes the border between Kamerun and the French Congo; France claims the upper Sangha and the Ubangi–Shari lands.: Ett fransk-tyskt protokoll fastställer gränsen mellan Kamerun och Franska Kongo; Frankrike gör anspråk på övre Sangha och länderna vid Ubangi och Shari.
  Britain proclaims a protectorate over Buganda, after company rule under Lugard and the civil wars of 1888–1892; the Uganda Agreement of 1900 makes Buganda a province of the protectorate under its kabaka.: Storbritannien utropar ett protektorat över Buganda, efter kompaniets styre under Lugard och inbördeskrigen 1888–1892; Ugandaavtalet 1900 gör Buganda till en provins i protektoratet under dess kabaka.
  France forms the Colony of Dahomey with Porto-Novo as its capital. King Toffa keeps his title under French rule until his death in 1908, when France makes his heir a “superior chief”.: Frankrike bildar kolonin Dahomey med Porto-Novo som huvudstad. Kung Toffa behåller sin titel under franskt styre till sin död 1908, då Frankrike gör hans arvinge till ”överhövding”.
  Samori’s forces occupy the Gyaman kingdom (Bondoukou).: Samoris styrkor besätter Gyamanriket (Bondoukou).
  France joins Senegal, French Sudan, Guinea and the Ivory Coast in the federation of French West Africa, governed from Saint-Louis and from 1902 from Dakar.: Frankrike förenar Senegal, Franska Sudan, Guinea och Elfenbenskusten i federationen Franska Västafrika, som styrs från Saint-Louis och från 1902 från Dakar.
  French rule extends to the upper Gambia and the Bassari country around Kédougou, where the Bassari resist into the 1900s.: Det franska styret utsträcks till övre Gambia och bassarilandet kring Kédougou, där bassari gör motstånd in på 1900-talets första årtionde.
  Britain proclaims the East Africa Protectorate, taking over from the Imperial British East Africa Company; the sultan’s coastal strip, leased to the company in 1887–1888, is governed as part of it but remains his in law until 1963.: Storbritannien utropar Östafrikanska protektoratet och tar över efter Imperial British East Africa Company; sultanens kustremsa, som arrenderades ut till kompaniet 1887–1888, styrs som en del av protektoratet men förblir juridiskt hans till 1963.
  British Bechuanaland is joined to the Cape Colony.: Brittiska Bechuanaland förenas med Kapkolonin.
  Mouzinho de Albuquerque captures Ngungunhane at Chaimite; the Gaza Empire falls.: Mouzinho de Albuquerque tillfångatar Ngungunhane i Chaimite; Gazariket faller.
  A British expedition occupies Kumasi without a fight (17 January 1896) and deposes and exiles the Asantehene Prempeh I; Britain rules Asante as a protectorate under a resident.: En brittisk expedition besätter Kumasi utan strid (17 januari 1896) och avsätter och förvisar asantehene Prempeh I; Storbritannien styr Ashanti som ett protektorat under en resident.
  Britain extends the Uganda Protectorate over Bunyoro, Toro, Ankole, Busoga and the lands east to the Rift Valley (Kavirondo and Naivasha). Kabalega of Bunyoro fights on until his capture in 1899; the north and east are occupied over the next two decades.: Storbritannien utsträcker Ugandaprotektoratet över Bunyoro, Toro, Ankole, Busoga och landet österut till Riftdalen (Kavirondo och Naivasha). Kabalega av Bunyoro fortsätter att strida tills han tillfångatas 1899; norr och öster besätts under de följande två decennierna.
  After capturing Antananarivo (30 September 1895) France annexes Madagascar as a colony; Ranavalona III is exiled in 1897, and the Menalamba rising and the resistance in the west and south are put down by about 1904.: Sedan Frankrike har intagit Antananarivo (30 september 1895) annekterar det Madagaskar som koloni; Ranavalona III förvisas 1897, och menalambaresningen och motståndet i väster och söder är nedslagna omkring 1904.
  Britain proclaims a protectorate over the hinterland of Sierra Leone, whose borders it had agreed with France in 1895.: Storbritannien utropar ett protektorat över Sierra Leones inland, vars gränser det hade kommit överens om med Frankrike 1895.
  German troops under Tom von Prince occupy Uhehe and found the station of Iringa, after storming Kalenga, Mkwawa’s fortress, in October 1894; Mkwawa fights on until his death in 1898.: Tyska trupper under Tom von Prince besätter Uhehe och grundar stationen Iringa, sedan de i oktober 1894 har stormat Kalenga, Mkwawas fästning; Mkwawa fortsätter att strida till sin död 1898.
  French troops defeat Bokar Biro, the almamy of Futa Jallon, at Porédaka, where he is killed; France, which had entered Timbo on 3 November, installs client almamies and rules Futa Jallon as a protectorate.: Franska trupper besegrar Bokar Biro, Futa Jallons almamy, vid Porédaka, där han dödas; Frankrike, som hade tågat in i Timbo den 3 november, insätter klientalmamyer och styr Futa Jallon som ett protektorat.
  Mwami Yuhi V Musinga accepts German protection; Germany rules Rwanda through its king.: Mwami Yuhi V Musinga godtar tyskt beskydd; Tyskland styr Rwanda genom dess kung.
  The Royal Niger Company’s troops take Bida, capital of the Nupe emirate.: Royal Niger Companys trupper intar Bida, nupeemiratets huvudstad.
  The Royal Niger Company’s troops take Ilorin.: Royal Niger Companys trupper intar Ilorin.
  Congo Free State troops take Rejaf and occupy the Lado Enclave west of the upper Nile, leased to Leopold II in 1894, with the West Nile lands.: Kongostatens trupper intar Rejaf och besätter Ladoenklaven väster om övre Nilen, som hade arrenderats ut till Leopold II 1894, tillsammans med West Nile-områdena.
  A British expedition takes Benin City, burns it and loots the Benin Bronzes; Oba Ovonramwen is exiled.: En brittisk expedition intar Benin City, bränner staden och plundrar Beninbronserna; oba Ovonramwen förvisas.
  Samori sacks Kong, the old Dyula city, which had accepted his rule in 1895.: Samori plundrar Kong, den gamla dyulastaden, som hade godtagit hans välde 1895.
  A Franco-German convention fixes the northern borders of Togoland.: En fransk-tysk konvention fastställer Togolands norra gränser.
  "The Anglo-French convention of 1898 divides Borgu: France takes Nikki, Kandi and the north of Dahomey, Britain the lands around Bussa.": "Den brittisk-franska konventionen 1898 delar Borgu: Frankrike tar Nikki, Kandi och norra Dahomey, Storbritannien landet kring Bussa."
  Gouraud’s troops capture Samori at Guéléma; his state falls to France, and Samori dies in exile in Gabon in 1900.: Gourauds trupper tillfångatar Samori i Guéléma; hans stat faller till Frankrike, och Samori dör i exil i Gabon 1900.
  Company forces drive Kazembe X from his capital on the Luapula.: Kompaniets styrkor driver Kazembe X från hans huvudstad vid Luapula.
  After the death of the senior chief Mwamba (1898) the British South Africa Company occupies the Bemba country, ending its independence.: Efter den främste hövdingen Mwambas död (1898) besätter Brittiska Sydafrikakompaniet bembalandet, vilket gör slut på dess självständighet.
  Dahomey becomes part of French West Africa.: Dahomey blir en del av Franska Västafrika.
  An order in council brings Barotseland, whose king Lewanika had signed treaties with the British South Africa Company in 1890, into the company’s North-Western Rhodesia; the Lozi kings keep a special position until 1964.: En kunglig förordning (order in council) för in Barotseland, vars kung Lewanika hade slutit fördrag med Brittiska Sydafrikakompaniet 1890, i kompaniets Nordvästrhodesia; lozikungarna behåller en särställning till 1964.
  Free State forces occupy the Kuba capital Nsheng (1899–1900).: Kongostatens styrkor besätter Kubarikets huvudstad Nsheng (1899–1900).
  "The Royal Niger Company’s charter is revoked: its southern lands join the Niger Coast Protectorate as the Protectorate of Southern Nigeria.": "Royal Niger Companys privilegiebrev återkallas: dess södra landområden förenas med Nigerkustprotektoratet som protektoratet Sydnigeria."
  The rest of the Company’s lands become the Protectorate of Northern Nigeria, under Frederick Lugard.: Resten av kompaniets landområden blir protektoratet Nordnigeria, under Frederick Lugard.
  The Igala kingdom comes under the Protectorate of Northern Nigeria.: Igalariket kommer under protektoratet Nordnigeria.
  France deposes Agoli-Agbo and abolishes the kingdom of Dahomey.: Frankrike avsätter Agoli-Agbo och avskaffar kungariket Dahomey.
  In the Treaty of Paris France recognises Spain’s claim to Río Muni on the mainland.: Genom Parisfördraget erkänner Frankrike Spaniens anspråk på Río Muni på fastlandet.
  British troops take Yola, capital of the Adamawa emirate; Germany occupies its southern lamidates (Ngaoundéré, Garoua) in 1901.: Brittiska trupper intar Yola, Adamawaemiratets huvudstad; Tyskland besätter dess södra lamidat (Ngaoundéré, Garoua) 1901.
  British columns occupy Bauchi, Gombe, Zaria and the emirates south of it, and Bornu, where Rabih’s son Fadlallah had been killed by the French (1901); the British install Shehu Abubakar Garbai as emir of Bornu. German troops take Maroua and Mandara.: Brittiska kolonner besätter Bauchi, Gombe, Zaria och emiraten söder därom samt Bornu, där Rabihs son Fadlallah hade dödats av fransmännen (1901); britterna insätter shehu Abubakar Garbai som emir av Bornu. Tyska trupper intar Maroua och Mandara.
  German officers reach Foumban; King Njoya of Bamum accepts German rule and keeps his throne.: Tyska officerare når Foumban; kung Njoya av Bamum godtar tyskt styre och behåller sin tron.
  Britain annexes Asante, after the War of the Golden Stool (1900), and makes the Northern Territories a protectorate, as parts of the Gold Coast (by orders of September 1901). Eastern Dagbon with Yendi had gone to German Togoland in 1899; it joins Ghana with British Togoland.: Storbritannien annekterar Ashanti efter kriget om den gyllene pallen (1900) och gör Nordterritorierna till protektorat, som delar av Guldkusten (genom förordningar i september 1901). Östra Dagbon med Yendi hade gått till Tyska Togoland 1899; det förenas med Ghana tillsammans med Brittiska Togoland.
  Uganda’s Eastern Province, with Kisumu and Naivasha, is transferred to the East Africa Protectorate, which now reaches Lake Victoria along the Uganda Railway.: Ugandas östra provins, med Kisumu och Naivasha, överförs till Östafrikanska protektoratet, som nu når Victoriasjön längs Ugandajärnvägen.
  Musa Molo, king of Fuladu, flees to the Gambia after quarrels with the French; France takes over Fuladu.: Musa Molo, kung av Fuladu, flyr till Gambia efter tvister med fransmännen; Frankrike tar över Fuladu.
  Portugal crushes the Bailundo revolt (1902–1903) and occupies the Ovimbundu highlands.: Portugal krossar Bailundoupproret (1902–1903) och besätter ovimbunduhöglandet.
  After the Anglo-Boer War the Vryheid and Utrecht districts are transferred from the Transvaal to Natal.: Efter boerkriget överförs distrikten Vryheid och Utrecht från Transvaal till Natal.
  British troops take Kano; Katsina submits.: Brittiska trupper intar Kano; Katsina underkastar sig.
  British troops take Sokoto; the caliph Attahiru I flees east and is killed at Burmi in July, and his successor accepts British rule.: Brittiska trupper intar Sokoto; kalifen Attahiru I flyr österut och dödas vid Burmi i juli, och hans efterträdare godtar brittiskt styre.
  After German campaigns Mwami Mwezi Gisabo of Burundi accepts German rule in the treaty of Kiganda.: Efter tyska fälttåg godtar mwami Mwezi Gisabo av Burundi tyskt styre genom fördraget i Kiganda.
  The Colony and Protectorate of Lagos is merged with Southern Nigeria.: Kolonin och protektoratet Lagos slås samman med Sydnigeria.
  Captain Kurt Streitwolf founds Schuckmannsburg and takes over the Caprivi Strip for German South West Africa, which had received it in the Anglo-German agreement of 1890 as a corridor to the Zambezi; until then the Lozi kingdom had ruled it.: Kapten Kurt Streitwolf grundar Schuckmannsburg och tar över Capriviremsan för Tyska Sydvästafrikas räkning, som hade fått den i det brittisk-tyska avtalet 1890 som en korridor till Zambezi; dittills hade lozikungariket styrt den.
  Portugal completes its occupation of Matamba and Kasanje on the Kwango.: Portugal fullbordar sin ockupation av Matamba och Kasanje vid Kwango.
  An Anglo-German-Belgian convention fixes the borders around the Virunga volcanoes; Kigezi becomes part of Uganda.: En brittisk-tysk-belgisk konvention fastställer gränserna kring Virungavulkanerna; Kigezi blir en del av Uganda.
  The Cape, Natal, the Transvaal and the Orange River Colony unite as the Union of South Africa, a self-governing dominion ruled by its white minority.: Kapkolonin, Natal, Transvaal och Oranjeflodskolonin förenas som Sydafrikanska unionen, ett självstyrande dominion som styrs av sin vita minoritet.
  French troops kill al-Sanusi at Ndélé and end Dar al-Kuti.: Franska trupper dödar al-Sanusi i Ndélé och gör slut på Dar al-Kuti.
  In the Morocco–Congo treaty France gives Germany two strips of the French Congo, Neukamerun, reaching the Congo and the Ubangi; German rule begins in 1912. Only the provinces that lay mostly within it are shown.: Genom Marocko–Kongo-fördraget ger Frankrike Tyskland två remsor av Franska Kongo, Neukamerun, som når Kongo och Ubangi; det tyska styret börjar 1912. Bara de provinser som huvudsakligen låg inom området visas.
  France annexes the Comoro sultanates of Grande Comore, Anjouan and Mohéli, its protectorates since 1886, as a colony under the governor-general of Madagascar; from 1914 the islands are a province of Madagascar. Mayotte, French since 1841, is not shown.: Frankrike annekterar Komorernas sultanat Grande Comore, Anjouan och Mohéli, dess protektorat sedan 1886, som en koloni under generalguvernören på Madagaskar; från 1914 är öarna en provins under Madagaskar. Mayotte, franskt sedan 1841, visas inte.
  After the Kongo revolt of 1913–1914 Portugal abolishes the Kingdom of Kongo, its vassal since 1857.: Efter upproret i Kongo 1913–1914 avskaffar Portugal Kongoriket, dess vasall sedan 1857.
  Lugard joins Northern and Southern Nigeria as the Colony and Protectorate of Nigeria.: Lugard förenar Nord- och Sydnigeria som kolonin och protektoratet Nigeria.
  West Nile is transferred from the Sudan to Uganda.: West Nile överförs från Sudan till Uganda.
  After unrest in Abeokuta the British end the Egba’s independence and join their land to Nigeria.: Efter oroligheter i Abeokuta gör britterna slut på egbafolkets självständighet och förenar dess land med Nigeria.
  Portuguese troops defeat the Kwanyama under King Mandume at Mongua and occupy the Ovambo lands of southern Angola.: Portugisiska trupper besegrar kwanyama under kung Mandume vid Mongua och besätter ovamboländerna i södra Angola.
  King Mandume of the Kwanyama is killed fighting South African troops, and South Africa takes over the Ovambo kingdoms.: Kung Mandume av kwanyama stupar i strid mot sydafrikanska trupper, och Sydafrika tar över Ovamboriken.
  With the Treaty of Versailles, Togoland, conquered by British and French troops in August 1914, is divided into British and French League of Nations mandates.: Genom Versaillesfreden delas Togoland, som hade erövrats av brittiska och franska trupper i augusti 1914, i ett brittiskt och ett franskt mandat under Nationernas förbund.
  With the Treaty of Versailles, Kamerun, conquered by British, French and Belgian troops in 1914–1916, is divided into British and French League of Nations mandates. Northern Cameroons, the northern part of the British mandate, ran along the Nigerian border and joined Nigeria in 1961; it is not shown.: Genom Versaillesfreden delas Kamerun, som hade erövrats av brittiska, franska och belgiska trupper 1914–1916, i ett brittiskt och ett franskt mandat under Nationernas förbund. Nordkamerun, den norra delen av det brittiska mandatet, löpte längs den nigerianska gränsen och förenades med Nigeria 1961; det visas inte.
  With the Treaty of Versailles, Neukamerun, retaken in 1914–1916, returns to French Equatorial Africa.: Genom Versaillesfreden återgår Neukamerun, som hade återtagits 1914–1916, till Franska Ekvatorialafrika.
  "With the Treaty of Versailles, German East Africa, conquered in 1916–1917, is divided: Britain receives Tanganyika and Belgium Ruanda-Urundi as League of Nations mandates.": "Genom Versaillesfreden delas Tyska Östafrika, som hade erövrats 1916–1917: Storbritannien får Tanganyika och Belgien Ruanda-Urundi som mandat under Nationernas förbund."
  With the Treaty of Versailles, German South West Africa, conquered by South African troops in 1915, becomes a League of Nations mandate under South Africa.: Genom Versaillesfreden blir Tyska Sydvästafrika, som hade erövrats av sydafrikanska trupper 1915, ett mandat under Nationernas förbund förvaltat av Sydafrika.
  Walvis Bay, which stays South African territory in law, is governed as part of the South West Africa mandate (1922–1977).: Walvis Bay, som juridiskt förblir sydafrikanskt territorium, förvaltas som en del av mandatet Sydvästafrika (1922–1977).
  "Company rule ends south of the Zambezi: Southern Rhodesia becomes a self-governing British colony, ruled by its white settlers.": "Kompaniets styre upphör söder om Zambezi: Sydrhodesia blir en självstyrande brittisk koloni, styrd av sina vita nybyggare."
  Northern Rhodesia becomes a British protectorate.: Nordrhodesia blir ett brittiskt protektorat.
  Britain joins Southern Rhodesia, Northern Rhodesia and Nyasaland in the Federation of Rhodesia and Nyasaland, against the opposition of most Africans.: Storbritannien förenar Sydrhodesia, Nordrhodesia och Nyasaland i Federationen Rhodesia och Nyasaland, trots motstånd från de flesta afrikaner.
  After a plebiscite in May 1956, British Togoland joins the Gold Coast, which becomes independent as Ghana on 6 March 1957.: Efter en folkomröstning i maj 1956 förenas Brittiska Togoland med Guldkusten, som blir självständigt som Ghana den 6 mars 1957.
  Guinea votes no in de Gaulle’s referendum on the French Community and becomes independent under Ahmed Sékou Touré.: Guinea röstar nej i de Gaulles folkomröstning om Franska gemenskapen och blir självständigt under Ahmed Sékou Touré.
  Senegal and French Sudan become independent together as the Mali Federation.: Senegal och Franska Sudan blir tillsammans självständiga som Malifederationen.
  The Belgian Congo becomes independent as the Republic of the Congo, with Patrice Lumumba as prime minister; within weeks the army mutinies and Katanga and South Kasai secede.: Belgiska Kongo blir självständigt som Republiken Kongo, med Patrice Lumumba som premiärminister; inom några veckor gör armén myteri och Katanga och Sydkasai bryter sig ut.
  Dahomey becomes independent.: Dahomey blir självständigt.
  Côte d’Ivoire becomes independent under Félix Houphouët-Boigny.: Elfenbenskusten blir självständigt under Félix Houphouët-Boigny.
  The Central African Republic (Ubangi-Shari) becomes independent.: Centralafrikanska republiken (Ubangi-Shari) blir självständig.
  The Republic of the Congo (Middle Congo) becomes independent.: Republiken Kongo (Mellersta Kongo) blir självständig.
  Gabon becomes independent.: Gabon blir självständigt.
  Senegal leaves the Mali Federation.: Senegal lämnar Malifederationen.
  After a UN plebiscite Southern Cameroons joins the Republic of Cameroon as a federated state.: Efter en folkomröstning under FN:s ledning ansluter sig Sydkamerun till Republiken Kamerun som delstat i en federation.
  Rwanda, a republic since the revolution of 1959–1961, and the kingdom of Burundi become independent.: Rwanda, en republik sedan revolutionen 1959–1961, och kungariket Burundi blir självständiga.
  The Federation of Rhodesia and Nyasaland is dissolved; Malawi and Zambia become independent in 1964, while Southern Rhodesia’s white government declares independence as Rhodesia in 1965.: Federationen Rhodesia och Nyasaland upplöses; Malawi och Zambia blir självständiga 1964, medan Sydrhodesias vita regering utropar självständighet som Rhodesia 1965.
  After the revolution of January 1964 that overthrew the sultan, Zanzibar unites with Tanganyika as Tanzania.: Efter revolutionen i januari 1964, som störtade sultanen, går Zanzibar samman med Tanganyika som Tanzania.
  South Africa returns Walvis Bay to its Cape Province.: Sydafrika återför Walvis Bay till sin Kapprovins.
  South Africa hands Walvis Bay to Namibia.: Sydafrika överlämnar Walvis Bay till Namibia.
  "North America and the Caribbean about 800. In Mesoamerica the Classic Maya city-states of the southern lowlands are close to their collapse, while the cities of northern Yucatán flourish; Monte Albán, the old Zapotec capital in the valley of Oaxaca, is in decline, and central Mexico is divided among the cities that rose after the fall of Teotihuacan, such as Xochicalco and Cacaxtla. North of Mexico, farming peoples live in the river valleys of the East and the Southwest, and hunting, fishing and gathering peoples across the rest of the continent; the Caribbean islands are home to the ancestors of the Taíno. Only the Mesoamerican states are shown on the map: the Native nations north of Mexico appear in the wars they fought.": "Nordamerika och Karibien omkring 800. I Mesoamerika står de klassiska mayastadsstaterna i det södra låglandet nära sin kollaps, medan städerna i norra Yucatán blomstrar; Monte Albán, zapotekernas gamla huvudstad i Oaxacadalen, är på nedgång, och centrala Mexiko är delat mellan de städer som växte fram efter Teotihuacans fall, till exempel Xochicalco och Cacaxtla. Norr om Mexiko lever jordbrukande folk i floddalarna i öster och i sydväst och folk som lever av jakt, fiske och insamling på resten av kontinenten; på de karibiska öarna bor taínofolkets förfäder. Endast de mesoamerikanska staterna visas på kartan: ursprungsnationerna norr om Mexiko visas i de krig de utkämpade."
  About 900 Chichen Itza becomes the leading power of northern Yucatán. In the southern lowlands most of the great Classic cities, among them Palenque and Calakmul, have been abandoned or are in decline.: Omkring 900 blir Chichén Itzá den ledande makten i norra Yucatán. I det södra låglandet har de flesta av de stora klassiska städerna, bland dem Palenque och Calakmul, övergetts eller är på nedgång.
  About 950 Tula, the capital of the Toltecs in Hidalgo, rises to dominate the north of central Mexico.: Omkring 950 växer Tula, toltekernas huvudstad i Hidalgo, till den dominerande makten i norra delen av centrala Mexiko.
  By about 950 Mixtec kingdoms such as Tilantongo dominate the Mixteca of western Oaxaca, while Zapotec kingdoms hold the valley of Oaxaca and the isthmus.: Omkring 950 dominerar mixtekiska kungariken som Tilantongo Mixteca i västra Oaxaca, medan zapotekiska kungariken behärskar Oaxacadalen och näset.
  By about 1100 Chichen Itza has declined as a regional power, and northern Yucatán is divided among smaller Maya cities.: Omkring 1100 har Chichén Itzá förlorat sin ställning som regional makt, och norra Yucatán är delat mellan mindre mayastäder.
  About 1150 Tula is sacked and abandoned, and the Toltec state breaks up. Over the next two centuries peoples from the north, among them the Mexica, move into the valley of Mexico.: Omkring 1150 plundras och överges Tula, och Toltekriket faller sönder. Under de följande två århundradena flyttar folk från norr, bland dem mexica, in i Mexikodalen.
  From the 1220s Mayapan is the capital of a league that rules most of northern Yucatán.: Från 1220-talet är Mayapán huvudstad i ett förbund som härskar över större delen av norra Yucatán.
  "By about 1350 Tariácuri has united the towns around Lake Pátzcuaro: the Purépecha (Tarascan) state, which by 1450 rules most of Michoacán. In the highlands east of the valley of Mexico the Tlaxcaltecs found the towns that form the confederation of Tlaxcala.": Omkring 1350 har Tariácuri enat städerna kring Pátzcuarosjön till purépechafolkets stat, Tarascanriket, som år 1450 behärskar större delen av Michoacán. I höglandet öster om Mexikodalen grundar tlaxcaltekerna de städer som bildar förbundet Tlaxcala.
  Under Tezozomoc (about 1370–1426) the Tepanec city of Azcapotzalco becomes the dominant power in the valley of Mexico, with the Mexica of Tenochtitlan among its tributaries and allies.: Under Tezozomoc (omkring 1370–1426) blir tepanekstaden Azcapotzalco den dominerande makten i Mexikodalen, med mexica i Tenochtitlan bland sina tributskyldiga och allierade.
  About 1395 the Tepanecs and their allies conquer the Otomí kingdom of Xaltocan, in the north of the valley, and extend their rule into the Otomí lands around Tula; Metztitlán in the mountains beyond stays independent.: Omkring 1395 erövrar tepanekerna och deras allierade otomíernas kungarike Xaltocan i dalens norra del och utsträcker sitt välde till otomíernas land kring Tula; Metztitlán i bergen längre bort förblir självständigt.
  Tenochtitlan, Texcoco and Tlacopan defeat Azcapotzalco and form the Triple Alliance, the Aztec Empire.: Tenochtitlan, Texcoco och Tlacopan besegrar Azcapotzalco och bildar trippelalliansen, Aztekriket.
  By 1440 the Triple Alliance has conquered the Tlahuica of Morelos, around Cuauhnahuac (Cuernavaca).: År 1440 har trippelalliansen erövrat tlahuicafolket i Morelos, kring Cuauhnahuac (Cuernavaca).
  Mayapan is destroyed in a revolt, and northern Yucatán breaks up into about sixteen rival Maya provinces.: Mayapán förstörs i ett uppror, och norra Yucatán splittras i omkring sexton rivaliserande mayaprovinser.
  About 1458 Moctezuma I conquers Coixtlahuaca and brings much of the Mixteca under Aztec rule; the coastal Mixtec kingdom of Tututepec stays independent.: Omkring 1458 erövrar Moctezuma I Coixtlahuaca och lägger stora delar av Mixteca under aztekiskt styre; det mixtekiska kustriket Tututepec förblir självständigt.
  The Triple Alliance conquers the Gulf coast around Cotaxtla and the Totonac towns of central Veracruz.: Trippelalliansen erövrar kusten vid Mexikanska golfen kring Cotaxtla och totonakernas städer i centrala Veracruz.
  Tepeaca and the south of Puebla fall to the Triple Alliance; Cholula and Huejotzingo, like Tlaxcala, stay independent.: Tepeaca och södra Puebla faller i trippelalliansens händer; Cholula och Huejotzingo förblir, liksom Tlaxcala, självständiga.
  By about 1490 the Triple Alliance rules most of Guerrero. Ahuitzotl’s armies reach the Pacific coast near Acapulco in the late 1490s, but the Yopi country stays independent.: Omkring 1490 behärskar trippelalliansen större delen av Guerrero. Ahuitzotls arméer når Stillahavskusten nära Acapulco i slutet av 1490-talet, men yopiernas land förblir självständigt.
  The Spaniards found Santo Domingo, the first capital of their empire in the Americas, and subdue the Taíno chiefdoms of Hispaniola; the last, Jaragua and Higüey, are crushed in 1503–1504.: Spanjorerna grundar Santo Domingo, den första huvudstaden i deras imperium i Amerika, och underkuvar taínofolkets hövdingadömen på Hispaniola; de sista, Jaragua och Higüey, krossas 1503–1504.
  Juan Ponce de León lands on Puerto Rico, founds Caparra and begins the conquest of the island.: Juan Ponce de León landstiger på Puerto Rico, grundar Caparra och inleder erövringen av ön.
  Juan de Esquivel begins the Spanish settlement of Jamaica.: Juan de Esquivel inleder den spanska bosättningen på Jamaica.
  Diego Velázquez lands at Baracoa and begins the conquest of Cuba.: Diego Velázquez landstiger vid Baracoa och inleder erövringen av Kuba.
  Tenochtitlan falls to Hernán Cortés and his Tlaxcalan and other Native allies after a siege of nearly three months. The Aztec Empire passes to Spain, and New Spain is built on its ruins; Tlaxcala keeps privileges as an ally.: Efter en nästan tre månader lång belägring faller Tenochtitlan för Hernán Cortés och hans tlaxcaltekiska och andra ursprungsamerikanska allierade. Aztekriket övergår till Spanien, och Nya Spanien byggs upp på dess ruiner; Tlaxcala behåller privilegier som allierad.
  The Tarascan king Tangáxuan II submits to the Spaniards, and expeditions under Francisco de Orozco and Pedro de Alvarado subdue the Zapotec and Mixtec lords of Oaxaca.: Den taraskiske kungen Tangáxuan II underkastar sig spanjorerna, och expeditioner under Francisco de Orozco och Pedro de Alvarado underkuvar de zapotekiska och mixtekiska herrarna i Oaxaca.
  Gonzalo de Sandoval founds Colima.: Gonzalo de Sandoval grundar Colima.
  Spanish settlers take possession of Curaçao, Aruba and Bonaire.: Spanska nybyggare tar Curaçao, Aruba och Bonaire i besittning.
  Diego de Mazariegos founds Villa Real (San Cristóbal de las Casas) and completes the conquest of highland Chiapas.: Diego de Mazariegos grundar Villa Real (San Cristóbal de las Casas) och fullbordar erövringen av höglandet i Chiapas.
  Francisco de Montejo subdues the Chontal Maya of Tabasco.: Francisco de Montejo underkuvar chontalmayafolket i Tabasco.
  Nuño de Guzmán conquers the west of Mexico, which becomes the kingdom of New Galicia, and founds Culiacán; north of the valley of Mexico the Otomí lord Conín, an ally of the Spaniards, founds Querétaro.: Nuño de Guzmán erövrar västra Mexiko, som blir kungariket Nya Galicien, och grundar Culiacán; norr om Mexikodalen grundar otomífursten Conín, en allierad till spanjorerna, Querétaro.
  Francisco de Montejo the Younger founds San Francisco de Campeche.: Francisco de Montejo den yngre grundar San Francisco de Campeche.
  Montejo the Younger founds Mérida on the ruins of the Maya city of T’ho, and the Maya provinces of the north-west submit; a great Maya revolt in the east is crushed in 1546–1547. On the northern frontier San Miguel is founded in the lands of the Chichimecs.: Montejo den yngre grundar Mérida på ruinerna av mayastaden T’ho, och mayaprovinserna i nordväst underkastar sig; ett stort mayauppror i öster krossas 1546–1547. Vid den norra gränsen grundas San Miguel i chichimekernas land.
  The campaign of the Pachecos takes Bacalar in the south-east of Yucatán, where Gaspar Pacheco founds the Spanish town of Salamanca de Bacalar in 1545; the forests of the interior stay largely outside Spanish control.: Under familjen Pachecos fälttåg intas Bacalar i sydöstra Yucatán, där Gaspar Pacheco 1545 grundar den spanska staden Salamanca de Bacalar; skogarna i inlandet förblir till stor del utanför spansk kontroll.
  Silver is found at Zacatecas. The mining towns spread north into the lands of the Chichimecs, who fight the Spaniards from 1550 to about 1590.: Silver hittas i Zacatecas. Gruvstäderna sprider sig norrut in i chichimekernas land, och chichimekerna strider mot spanjorerna från 1550 till omkring 1590.
  Francisco de Ibarra founds Durango as the capital of New Vizcaya.: Francisco de Ibarra grundar Durango som huvudstad i Nya Vizcaya.
  "Pedro Menéndez de Avilés founds St Augustine and destroys the French Huguenot colony of Fort Caroline: Spanish Florida.": "Pedro Menéndez de Avilés grundar S:t Augustine och förstör den franska hugenottkolonin Fort Caroline: Spanska Florida."
  Santa Bárbara, the first Spanish mining town in Chihuahua, is founded.: Santa Bárbara, den första spanska gruvstaden i Chihuahua, grundas.
  Aguascalientes is founded as a way station on the silver road.: Aguascalientes grundas som etappstation på silvervägen.
  Saltillo is founded in Coahuila.: Saltillo grundas i Coahuila.
  After the Chichimec War, San Luis Potosí is founded at the new silver mines of Cerro de San Pedro.: Efter Chichimekkriget grundas San Luis Potosí vid de nya silvergruvorna i Cerro de San Pedro.
  Antonio de Berrío founds San José de Oruña, the first Spanish town on Trinidad.: Antonio de Berrío grundar San José de Oruña, den första spanska staden på Trinidad.
  Diego de Montemayor founds Monterrey.: Diego de Montemayor grundar Monterrey.
  Juan de Oñate leads settlers up the Rio Grande and founds the province of New Mexico among the Pueblos, with its first capital at San Juan de los Caballeros; Santa Fe follows in about 1610.: Juan de Oñate leder nybyggare uppför Rio Grande och grundar provinsen New Mexico bland puebloindianerna, med sin första huvudstad i San Juan de los Caballeros; Santa Fe följer omkring 1610.
  Pierre Dugua de Mons and Samuel de Champlain found Port-Royal, the first lasting settlement of French Acadia.: Pierre Dugua de Mons och Samuel de Champlain grundar Port-Royal, den första bestående bosättningen i det franska Akadien.
  The Virginia Company founds Jamestown, the first lasting English settlement in North America.: Virginiakompaniet grundar Jamestown, den första bestående engelska bosättningen i Nordamerika.
  Samuel de Champlain founds Quebec, the centre of New France on the St Lawrence.: Samuel de Champlain grundar Québec, centrum för Nya Frankrike vid Saint Lawrencefloden.
  John Guy founds the English colony of Cupids on Conception Bay in Newfoundland, whose fishing grounds English, French, Portuguese and Basque fishermen had used for a century.: John Guy grundar den engelska kolonin Cupids vid Conception Bay på Newfoundland, vars fiskevatten engelska, franska, portugisiska och baskiska fiskare hade utnyttjat i ett sekel.
  English settlers arrive in Bermuda, where the Virginia Company’s ship Sea Venture was wrecked in 1609.: Engelska nybyggare anländer till Bermuda, där Virginiakompaniets skepp Sea Venture förliste 1609.
  Jesuit missions among the Mayo and the Yaqui bring southern Sonora under Spanish rule.: Jesuitmissioner bland mayo- och yaquifolken lägger södra Sonora under spanskt styre.
  The Pilgrims of the Mayflower found Plymouth; the Massachusetts Bay Colony follows at Boston in 1630.: Pilgrimsfäderna från Mayflower grundar Plymouth; Massachusetts Bay-kolonin följer i Boston 1630.
  English fishing and trading settlements begin on the Piscataqua and the coast of Maine.: De första engelska fiske- och handelsbosättningarna anläggs vid Piscataquafloden och längs Maines kust.
  "The Dutch West India Company settles Fort Orange (Albany), and in 1625–1626 New Amsterdam on Manhattan: New Netherland.": "Nederländska västindiska kompaniet anlägger Fort Orange (Albany) och 1625–1626 Nya Amsterdam på Manhattan: Nya Nederländerna."
  Thomas Warner founds the first English colony in the Caribbean on St Kitts.: Thomas Warner grundar den första engelska kolonin i Karibien, på Saint Kitts.
  English settlers land on Barbados.: Engelska nybyggare landstiger på Barbados.
  "The English and the French, who arrived under Pierre Belain d’Esnambuc in 1625, partition St Kitts: the French take the two ends of the island.": "Engelsmännen och fransmännen, som kom dit under Pierre Belain d’Esnambuc 1625, delar Saint Kitts mellan sig: fransmännen tar öns båda ändar."
  English settlers from St Kitts settle Nevis.: Engelska nybyggare från Saint Kitts bosätter sig på Nevis.
  Charles Daniel builds a French fort at Sainte-Anne on Cape Breton Island.: Charles Daniel bygger ett franskt fort vid Sainte-Anne på Kap Bretonön.
  Dutch settlers found Pavonia on the west bank of the Hudson; New Netherland claims the land between the Hudson and the Delaware.: Nederländska nybyggare grundar Pavonia på Hudsonflodens västra strand; Nya Nederländerna gör anspråk på landet mellan Hudson och Delaware.
  Charles de La Tour builds Fort Sainte-Marie at the mouth of the Saint John River.: Charles de La Tour bygger Fort Sainte-Marie vid floden Saint Johns mynning.
  William Claiborne of Virginia sets up a trading post on Kent Island in Chesapeake Bay; in 1634 Leonard Calvert founds St Mary’s City in the new proprietary colony of Maryland.: William Claiborne från Virginia anlägger en handelsstation på Kent Island i Chesapeake Bay; 1634 grundar Leonard Calvert St Mary’s City i den nya ägarkolonin Maryland.
  English settlers from St Kitts settle Antigua and Montserrat, where many of the first colonists are Irish.: Engelska nybyggare från Saint Kitts bosätter sig på Antigua och Montserrat, där många av de första kolonisterna är irländare.
  Traders from Plymouth build a post at Windsor, the first English settlement in Connecticut; Puritans from Massachusetts follow to Wethersfield and Hartford in 1634–1636.: Handelsmän från Plymouth bygger en handelsstation i Windsor, den första engelska bosättningen i Connecticut; puritaner från Massachusetts följer efter till Wethersfield och Hartford 1634–1636.
  The Spanish garrison of Curaçao surrenders to a Dutch West India Company fleet under Johannes van Walbeeck; the Dutch take Aruba and Bonaire in 1636.: Den spanska garnisonen på Curaçao kapitulerar för en flotta från Nederländska västindiska kompaniet under Johannes van Walbeeck; nederländarna tar Aruba och Bonaire 1636.
  French settlers land on Guadeloupe.: Franska nybyggare landstiger på Guadeloupe.
  Pierre Belain d’Esnambuc founds Saint-Pierre on Martinique.: Pierre Belain d’Esnambuc grundar Saint-Pierre på Martinique.
  Roger Williams, banished from Massachusetts, founds Providence.: Roger Williams, som förvisats från Massachusetts, grundar Providence.
  The Dutch settle Sint Eustatius, and Saba a few years later.: Nederländarna koloniserar Sint Eustatius och några år senare Saba.
  "Peter Minuit lands the first Swedish colonists, who found Fort Christina (Wilmington) on the Delaware: New Sweden.": "Peter Minuit landsätter de första svenska kolonisterna, som grundar Fort Christina (Wilmington) vid Delawarefloden: Nya Sverige."
  Governor Johan Printz moves the seat of New Sweden to Tinicum Island, in what is now Pennsylvania, where Swedish and Finnish settlers farm along the Delaware.: Guvernör Johan Printz flyttar Nya Sveriges säte till Tinicum Island i nuvarande Pennsylvania, där svenska och finska nybyggare odlar jorden längs Delawarefloden.
  The Eleutheran Adventurers, Puritans from Bermuda, settle Eleuthera in the Bahamas; French settlers from St Kitts settle St Barthélemy, and Dutch settlers Tortola.: Eleutheran Adventurers, puritaner från Bermuda, bosätter sig på Eleuthera i Bahamas; franska nybyggare från Saint Kitts bosätter sig på Saint-Barthélemy och nederländska nybyggare på Tortola.
  By the Treaty of Concordia the French and the Dutch partition St Martin.: Genom Concordiafördraget delar fransmännen och nederländarna Saint Martin mellan sig.
  Jacques Dyel du Parquet, governor of Martinique, founds a French settlement on Grenada.: Jacques Dyel du Parquet, guvernör på Martinique, grundar en fransk bosättning på Grenada.
  English settlers settle Anguilla; the French take St Croix from the Spaniards.: Engelska nybyggare bosätter sig på Anguilla; fransmännen tar Saint Croix från spanjorerna.
  French settlers from Martinique settle St Lucia.: Franska nybyggare från Martinique bosätter sig på Saint Lucia.
  The Order of Saint John, the Knights of Malta, buys the French part of St Kitts, St Barthélemy, St Martin and St Croix; it sells them to the French West India Company in 1665.: Johanniterorden, Malteserriddarna, köper den franska delen av Saint Kitts, Saint-Barthélemy, Saint Martin och Saint Croix; orden säljer dem till Franska västindiska kompaniet 1665.
  The Duchy of Courland founds New Courland on Tobago.: Hertigdömet Kurland grundar Nya Kurland på Tobago.
  An English expedition under Robert Sedgwick takes Port-Royal and the French forts on the Saint John; England holds Acadia until 1670.: En engelsk expedition under Robert Sedgwick intar Port-Royal och de franska forten vid floden Saint John; England behåller Akadien till 1670.
  An English expedition sent by Oliver Cromwell takes Jamaica from Spain.: En engelsk expedition, utsänd av Oliver Cromwell, tar Jamaica från Spanien.
  Peter Stuyvesant takes Fort Christina, and New Sweden becomes part of New Netherland.: Peter Stuyvesant intar Fort Christina, och Nya Sverige blir en del av Nya Nederländerna.
  The Dutch take Tobago from Courland.: Nederländarna tar Tobago från Kurland.
  Charles II grants Carolina to eight Lords Proprietors; settlers from Virginia are already farming around Albemarle Sound.: Karl II förlänar Carolina åt åtta Lords Proprietors; nybyggare från Virginia odlar redan jorden kring Albemarle Sound.
  An English fleet takes New Amsterdam, which is renamed New York; all of New Netherland, with the former New Sweden on the Delaware, becomes English.: En engelsk flotta intar Nya Amsterdam, som får namnet New York; hela Nya Nederländerna, med det forna Nya Sverige vid Delawarefloden, blir engelskt.
  The Order of Saint John sells its islands to the French West India Company.: Johanniterorden säljer sina öar till Franska västindiska kompaniet.
  Bertrand d’Ogeron becomes the French governor of Tortuga and the coast of Saint-Domingue, the buccaneer settlements in western Hispaniola.: Bertrand d’Ogeron blir fransk guvernör över Tortuga och Saint-Domingues kust, bukanjärernas bosättningar på västra Hispaniola.
  Settlers from Bermuda settle New Providence, which soon becomes the centre of the Bahamas.: Nybyggare från Bermuda bosätter sig på New Providence, som snart blir Bahamas centrum.
  A French officer claims St Pierre and Miquelon, where a few French fishermen live all year; the small settlement grows with support from the French colony of Plaisance in Newfoundland.: En fransk officer gör anspråk på Saint-Pierre och Miquelon, där några franska fiskare bor året runt; den lilla bosättningen växer med stöd från den franska kolonin Plaisance på Newfoundland.
  The Bahamas are granted to the Lords Proprietors of Carolina.: Bahamas förlänas åt Carolinas Lords Proprietors.
  "English settlers from Barbados and England found Charles Town (Charleston): South Carolina.": "Engelska nybyggare från Barbados och England grundar Charles Town (Charleston): South Carolina."
  Charles II grants the Hudson’s Bay Company all the lands draining into Hudson Bay, which are named Rupert’s Land.: Karl II förlänar Hudson’s Bay Company alla landområden som avvattnas till Hudson Bay, och de får namnet Ruperts land.
  Under the Treaty of Breda (1667) England hands Acadia back to France; the new governor, Hector d’Andigné de Grandfontaine, takes over the forts between July and September.: Enligt freden i Breda (1667) lämnar England tillbaka Akadien till Frankrike; den nye guvernören, Hector d’Andigné de Grandfontaine, tar över forten mellan juli och september.
  By the Treaty of Madrid Spain recognises English rule in Jamaica and the Cayman Islands.: Genom fördraget i Madrid erkänner Spanien det engelska styret över Jamaica och Caymanöarna.
  At Sault Ste. Marie, Simon-François Daumont de Saint-Lusson claims the Great Lakes and the lands beyond for Louis XIV before an assembly of Native nations.: Vid Sault Ste. Marie gör Simon-François Daumont de Saint-Lusson anspråk på Stora sjöarna och landen bortom dem för Ludvig XIV inför en församling av ursprungsnationer.
  The Danish West India Company settles St Thomas; the English take Tortola from the Dutch.: Danska västindiska kompaniet koloniserar Saint Thomas; engelsmännen tar Tortola från nederländarna.
  A French fleet under the comte d’Estrées takes Tobago and destroys the Dutch settlement; the island is left almost empty and is later declared neutral.: En fransk flotta under greve d’Estrées intar Tobago och förstör den nederländska bosättningen; ön lämnas nästan öde och förklaras senare neutral.
  The English colonise Barbuda.: Engelsmännen koloniserar Barbuda.
  The Pueblo Revolt, led by Popé, drives the Spaniards out of New Mexico; they withdraw to El Paso. The Hopi in the west never come back under Spanish rule.: Puebloupproret under ledning av Popé driver ut spanjorerna ur New Mexico; de drar sig tillbaka till El Paso. Hopifolket i väster kommer aldrig mer under spanskt styre.
  Salt rakers from Bermuda begin working the Turks Islands.: Saltarbetare från Bermuda börjar utvinna salt på Turksöarna.
  Charles II grants Pennsylvania to William Penn, who founds Philadelphia in 1682.: Karl II förlänar Pennsylvania åt William Penn, som grundar Philadelphia 1682.
  René-Robert Cavelier de La Salle reaches the mouth of the Mississippi and claims its whole basin for France as Louisiana.: René-Robert Cavelier de La Salle når Mississippis mynning och gör anspråk på hela dess flodområde för Frankrike under namnet Louisiana.
  The Jesuit Eusebio Kino begins founding missions in the Pimería Alta, in what is now southern Arizona.: Jesuiten Eusebio Kino börjar grunda missioner i Pimería Alta, i nuvarande södra Arizona.
  Diego de Vargas reoccupies Santa Fe, and Spanish rule over the Pueblos is restored by 1696.: Diego de Vargas återockuperar Santa Fe, och fram till 1696 återupprättas det spanska styret över puebloindianerna.
  "By the Peace of Ryswick Spain recognises French rule in western Hispaniola: Saint-Domingue.": "Genom freden i Rijswijk erkänner Spanien det franska styret på västra Hispaniola: Saint-Domingue."
  Juan María de Salvatierra founds the mission of Loreto, the first lasting Spanish settlement in Baja California.: Juan María de Salvatierra grundar missionen Loreto, den första bestående spanska bosättningen i Baja California.
  Pierre Le Moyne d’Iberville builds Fort Maurepas on Biloxi Bay, the first settlement of French Louisiana.: Pierre Le Moyne d’Iberville bygger Fort Maurepas vid Biloxibukten, den första bosättningen i det franska Louisiana.
  The French found Mobile, which becomes the capital of Louisiana.: Fransmännen grundar Mobile, som blir Louisianas huvudstad.
  Bermuda passes with England to the Kingdom of Great Britain.: Bermuda övergår tillsammans med England till kungariket Storbritannien.
  Peace of Utrecht. France cedes Acadia (mainland Nova Scotia) and its claims to Newfoundland, with St Pierre and Miquelon, and Hudson Bay to Britain, but keeps Cape Breton, where it builds Louisbourg, and Île Saint-Jean.: Freden i Utrecht. Frankrike avträder Akadien (Nova Scotias fastland) och sina anspråk på Newfoundland, med Saint-Pierre och Miquelon, samt Hudson Bay till Storbritannien men behåller Kap Bretonön, där det bygger Louisbourg, och Île Saint-Jean.
  "Peace of Utrecht: France cedes its part of St Kitts to Britain.": "Freden i Utrecht: Frankrike avträder sin del av Saint Kitts till Storbritannien."
  Spain founds missions and a presidio in East Texas against the French in Louisiana; San Antonio follows in 1718.: Spanien grundar missioner och ett garnisonsfort (presidio) i östra Texas som värn mot fransmännen i Louisiana; San Antonio följer 1718.
  The French build Fort Toulouse among the Alabama, where the Coosa and the Tallapoosa meet.: Fransmännen bygger Fort Toulouse bland alabamafolket, där floderna Coosa och Tallapoosa flyter samman.
  The Danes settle St John.: Danskarna koloniserar Saint John.
  French settlers found Port-La-Joye on Île Saint-Jean (Prince Edward Island).: Franska nybyggare grundar Port-La-Joye på Île Saint-Jean (Prince Edward Island).
  Massachusetts builds Fort Dummer, the first lasting English settlement in what is now Vermont.: Massachusetts bygger Fort Dummer, den första bestående engelska bosättningen i nuvarande Vermont.
  By about 1727 settlers from Pennsylvania are farming the valleys west of the Blue Ridge, in what is now the Eastern Panhandle of West Virginia.: Omkring 1727 odlar nybyggare från Pennsylvania dalarna väster om Blue Ridge, i det som i dag är West Virginias Eastern Panhandle.
  James Oglethorpe founds Savannah and the colony of Georgia.: James Oglethorpe grundar Savannah och kolonin Georgia.
  France sells St Croix to the Danish West India Company.: Frankrike säljer Saint Croix till Danska västindiska kompaniet.
  José de Escandón settles the Gulf coast between Tampico and the Nueces River as the province of Nuevo Santander.: José de Escandón koloniserar kusten vid Mexikanska golfen mellan Tampico och Nuecesfloden som provinsen Nuevo Santander.
  By the secret Treaty of Fontainebleau France gives Louisiana west of the Mississippi, with New Orleans, to Spain.: Genom det hemliga fördraget i Fontainebleau ger Frankrike Louisiana väster om Mississippi, med New Orleans, till Spanien.
  Treaty of Paris. France cedes Canada, Acadia, Cape Breton and Île Saint-Jean and all of Louisiana east of the Mississippi to Britain, which gives St Pierre and Miquelon back to France as a shelter for its fishermen; Spain cedes Florida to Britain.: Freden i Paris. Frankrike avträder Kanada, Akadien, Kap Bretonön och Île Saint-Jean samt hela Louisiana öster om Mississippi till Storbritannien, som ger Saint-Pierre och Miquelon tillbaka till Frankrike som tillflyktsort för dess fiskare; Spanien avträder Florida till Storbritannien.
  The rest of New France east of the Mississippi passes to Britain.: Resten av Nya Frankrike öster om Mississippi övergår till Storbritannien.
  Treaty of Paris. France cedes Grenada, and the neutral islands of Dominica, St Vincent and Tobago go to Britain; St Lucia stays French.: Freden i Paris. Frankrike avträder Grenada, och de neutrala öarna Dominica, Saint Vincent och Tobago tillfaller Storbritannien; Saint Lucia förblir franskt.
  "The Royal Proclamation organises Britain’s new lands: the St Lawrence valley becomes the Province of Quebec, Labrador goes to Newfoundland, Cape Breton and Île Saint-Jean are joined to Nova Scotia, and the lands west of the Appalachians are reserved for the Native nations.": "Kungliga proklamationen organiserar Storbritanniens nya landområden: Saint Lawrencedalen blir provinsen Québec, Labrador läggs till Newfoundland, Kap Bretonön och Île Saint-Jean förenas med Nova Scotia, och landen väster om Appalacherna reserveras för ursprungsnationerna."
  Île Saint-Jean, renamed St John’s Island, becomes a British colony separate from Nova Scotia; it is renamed Prince Edward Island in 1799.: Île Saint-Jean, som fått namnet St John’s Island, blir en brittisk koloni skild från Nova Scotia; den byter namn till Prince Edward Island 1799.
  Gaspar de Portolá and Junípero Serra found San Diego, the first of the Spanish presidios and missions of Alta California; missions spread through northern Baja California at the same time.: Gaspar de Portolá och Junípero Serra grundar San Diego, det första av de spanska garnisonsforten (presidios) och missionerna i Alta California; samtidigt sprids missioner över norra Baja California.
  The Quebec Act extends the Province of Quebec to the Great Lakes and the Ohio country, and to Labrador.: Québeclagen utvidgar provinsen Québec till Stora sjöarna och Ohiolandet samt till Labrador.
  The thirteen colonies declare their independence as the United States. Vermont, claimed by New York and New Hampshire, declares itself an independent republic in 1777 and joins the Union in 1791.: De tretton kolonierna förklarar sig självständiga som Amerikas förenta stater. Vermont, som New York och New Hampshire gör anspråk på, förklarar sig 1777 som en självständig republik och går med i unionen 1791.
  Peace of Paris. Britain recognises the independence of the United States, with a border along the Great Lakes and the Mississippi, and cedes East and West Florida to Spain.: Freden i Paris. Storbritannien erkänner USA:s självständighet, med en gräns längs Stora sjöarna och Mississippi, och avträder Öst- och Västflorida till Spanien.
  Peace of Versailles. Britain cedes Tobago to France.: Freden i Versailles. Storbritannien avträder Tobago till Frankrike.
  Loyalist refugees from the United States settle along the Saint John, and New Brunswick is separated from Nova Scotia.: Lojalistiska flyktingar från USA bosätter sig längs floden Saint John, och New Brunswick skiljs från Nova Scotia.
  France cedes St Barthélemy to Sweden in exchange for trading rights in Gothenburg.: Frankrike avträder Saint-Barthélemy till Sverige i utbyte mot handelsrättigheter i Göteborg.
  Grigory Shelikhov founds a Russian settlement at Three Saints Bay on Kodiak Island. Russia claims Alaska, which the Russian-American Company governs from 1799.: Grigorij Sjelichov grundar en rysk bosättning vid Three Saints Bay på Kodiakön. Ryssland gör anspråk på Alaska, som Rysk-amerikanska kompaniet styr från 1799.
  The Constitutional Act divides the Province of Quebec into Lower Canada, on the lower St Lawrence, and Upper Canada, settled by Loyalists, on the Great Lakes.: Konstitutionsakten delar provinsen Québec i Nedre Kanada, vid nedre Saint Lawrencefloden, och Övre Kanada, som befolkats av lojalister, vid Stora sjöarna.
  The Dutch Republic becomes the Batavian Republic.: Nederländska republiken blir Bataviska republiken.
  By the Peace of Basel Spain cedes Santo Domingo, the eastern part of Hispaniola, to France; Toussaint Louverture takes it over in the name of France in January 1801.: Genom freden i Basel avträder Spanien Santo Domingo, den östra delen av Hispaniola, till Frankrike; Toussaint Louverture tar över den i Frankrikes namn i januari 1801.
  By the secret Treaty of San Ildefonso Spain returns Louisiana to France; Spanish officials go on governing it until 1803.: Genom det hemliga fördraget i San Ildefonso återlämnar Spanien Louisiana till Frankrike; spanska ämbetsmän fortsätter att förvalta det till 1803.
  By the Peace of Amiens Spain cedes Trinidad, taken by the British in 1797, to Britain.: Genom freden i Amiens avträder Spanien Trinidad, som britterna intog 1797, till Storbritannien.
  The United States buys Louisiana from France for 15 million dollars, doubling its territory.: USA köper Louisiana av Frankrike för 15 miljoner dollar och fördubblar därmed sitt territorium.
  Jean-Jacques Dessalines proclaims the independence of Haiti, the first state founded by formerly enslaved people, after the defeat of Napoleon’s army. The east of the island stays in French hands.: Efter nederlaget för Napoleons armé utropar Jean-Jacques Dessalines självständigheten för Haiti, den första stat som grundats av tidigare förslavade människor. Öns östra del förblir i franska händer.
  "After the murder of Dessalines Haiti splits: Henri Christophe rules the north as the State of Haiti, from 1811 the Kingdom of Haiti, and Alexandre Pétion the south as the Republic of Haiti.": "Efter mordet på Dessalines splittras Haiti: Henri Christophe styr norra delen som staten Haiti, från 1811 kungariket Haiti, och Alexandre Pétion södra delen som republiken Haiti."
  An act of Parliament returns the coast of Labrador to Newfoundland.: En parlamentsakt för Labradors kust tillbaka till Newfoundland.
  The French garrison of Santo Domingo surrenders to Dominican rebels and a British squadron, and the east of Hispaniola returns to Spain.: Den franska garnisonen i Santo Domingo kapitulerar för dominikanska rebeller och en brittisk eskader, och östra Hispaniola återgår till Spanien.
  After American settlers in Spanish West Florida take the fort at Baton Rouge and proclaim a republic, President Madison claims West Florida for the United States, and American troops occupy it as far as the Pearl River.: Sedan amerikanska nybyggare i spanska Västflorida intagit fortet i Baton Rouge och utropat en republik gör president Madison anspråk på Västflorida för USA, och amerikanska trupper ockuperar det fram till Pearlfloden.
  American troops under James Wilkinson take Mobile from Spain; Congress had annexed the coast between the Pearl and the Perdido the year before.: Amerikanska trupper under James Wilkinson tar Mobile från Spanien; kongressen hade annekterat kusten mellan floderna Pearl och Perdido året innan.
  The Danish West Indies pass with Denmark to the reduced Danish kingdom after the Treaty of Kiel.: Efter freden i Kiel följer Danska Västindien med Danmark över till det förminskade danska kungariket.
  By the Treaty of Paris France cedes St Lucia and Tobago to Britain.: Genom freden i Paris avträder Frankrike Saint Lucia och Tobago till Storbritannien.
  The Anglo-American Convention fixes the border on the 49th parallel from the Lake of the Woods to the Rocky Mountains, and the Red River valley south of it passes to the United States. The Oregon Country west of the mountains is left open to both.: Den brittisk-amerikanska konventionen fastställer gränsen längs 49:e breddgraden från Lake of the Woods till Klippiga bergen, och Red Rivers dalgång söder om den övergår till USA. Oregonlandet väster om bergen lämnas öppet för båda.
  Henri Christophe shoots himself during a revolt, and Jean-Pierre Boyer reunites Haiti.: Henri Christophe skjuter sig under ett uppror, och Jean-Pierre Boyer återförenar Haiti.
  "The Adams–Onís Treaty comes into force: Spain cedes Florida to the United States, and their border is fixed along the Sabine, the Red and the Arkansas rivers and the 42nd parallel to the Pacific.": "Adams–Onís-fördraget träder i kraft: Spanien avträder Florida till USA, och gränsen mellan dem fastställs längs floderna Sabine, Red och Arkansas och längs 42:a breddgraden till Stilla havet."
  Mexico declares its independence as the Mexican Empire under Agustín de Iturbide, a month after the last Spanish viceroy accepted it in the Treaty of Córdoba.: Mexiko förklarar sig självständigt som Mexikanska kejsardömet under Agustín de Iturbide, en månad efter att den siste spanske vicekungen godtagit självständigheten i fördraget i Córdoba.
  José Núñez de Cáceres declares the independence of Spanish Haiti, the east of the island.: José Núñez de Cáceres förklarar Spanska Haiti, öns östra del, självständigt.
  After the Hudson’s Bay Company absorbs its rival, the North West Company, the Crown grants it the sole right to trade in the lands north and west of Rupert’s Land.: Sedan Hudson’s Bay Company uppslukat sin rival North West Company ger kronan det ensamrätt till handeln i landen norr och väster om Ruperts land.
  Boyer’s army enters Santo Domingo, and Haiti rules the whole island for 22 years.: Boyers armé tågar in i Santo Domingo, och Haiti behärskar hela ön i 22 år.
  Sam Houston defeats and captures Santa Anna at San Jacinto, securing the independence of the Republic of Texas, declared on 2 March. Mexico does not recognise it, and the land between the Nueces and the Rio Grande stays disputed.: Sam Houston besegrar och tillfångatar Santa Anna vid San Jacinto och säkrar därmed självständigheten för republiken Texas, som utropades den 2 mars. Mexiko erkänner den inte, och landet mellan Nueces och Rio Grande förblir omstritt.
  Upper and Lower Canada are united as the Province of Canada.: Övre och Nedre Kanada förenas till provinsen Kanada.
  The Trinitarios led by Juan Pablo Duarte proclaim the Dominican Republic in Santo Domingo.: Trinitarios, ledda av Juan Pablo Duarte, utropar Dominikanska republiken i Santo Domingo.
  The Dutch islands of the Caribbean, governed with Suriname from Paramaribo since 1828, become the colony of Curaçao and Dependencies, governed from Willemstad.: De nederländska öarna i Karibien, som sedan 1828 har styrts tillsammans med Surinam från Paramaribo, blir kolonin Curaçao med underlydande områden, som styrs från Willemstad.
  Texas is annexed by the United States.: Texas annekteras av USA.
  The Oregon Treaty divides the Oregon Country along the 49th parallel; the land south of it passes to the United States.: Oregonfördraget delar Oregonlandet längs 49:e breddgraden; landet söder om den övergår till USA.
  "Treaty of Guadalupe Hidalgo. Mexico recognises the Rio Grande as the border of Texas and cedes California and New Mexico to the United States: with Texas, it loses about half of its territory.": "Freden i Guadalupe Hidalgo. Mexiko erkänner Rio Grande som gräns för Texas och avträder Kalifornien och New Mexico till USA: tillsammans med Texas förlorar landet ungefär hälften av sitt territorium."
  Vancouver Island becomes a British colony, granted to the Hudson’s Bay Company.: Vancouver Island blir en brittisk koloni, förlänad åt Hudson’s Bay Company.
  In the Gadsden Purchase the United States buys the land south of the Gila River from Mexico, for a southern railway route.: Genom Gadsdenköpet köper USA landet söder om Gilafloden av Mexiko för en sydlig järnvägsdragning.
  During the Fraser River gold rush the mainland becomes the British colony of British Columbia.: Under guldrushen vid Fraserfloden blir fastlandet den brittiska kolonin Brittiska Columbia.
  President Pedro Santana returns the Dominican Republic to Spanish rule; a war of restoration forces Spain to leave in 1865.: President Pedro Santana återför Dominikanska republiken under spanskt styre; ett restaurationskrig tvingar Spanien att lämna landet 1865.
  Vancouver Island is united with British Columbia.: Vancouver Island förenas med Brittiska Columbia.
  Russia sells Alaska to the United States for 7.2 million dollars.: Ryssland säljer Alaska till USA för 7,2 miljoner dollar.
  Confederation. The Province of Canada, split into Ontario and Quebec, Nova Scotia and New Brunswick unite as the Dominion of Canada.: Konfederationen. Provinsen Kanada, uppdelad i Ontario och Québec, Nova Scotia och New Brunswick går samman till dominionen Kanada.
  Canada takes over Rupert’s Land and the North-Western Territory from the Hudson’s Bay Company, and Manitoba becomes a province after the Red River Rebellion.: Kanada tar över Ruperts land och Nordvästterritoriet från Hudson’s Bay Company, och Manitoba blir en provins efter Red River-upproret.
  British Columbia joins Canada, which promises it a railway to the east.: Brittiska Columbia går med i Kanada, som lovar provinsen en järnväg österut.
  Prince Edward Island joins Canada.: Prince Edward Island går med i Kanada.
  Sweden returns St Barthélemy to France.: Sverige återlämnar Saint-Barthélemy till Frankrike.
  Britain transfers its claims to the Arctic islands to Canada.: Storbritannien överför sina anspråk på de arktiska öarna till Kanada.
  Treaty of Paris. After its defeat in the Spanish–American War, Spain cedes Puerto Rico to the United States and gives up Cuba.: Freden i Paris. Efter sitt nederlag i spansk-amerikanska kriget avträder Spanien Puerto Rico till USA och ger upp Kuba.
  Spain hands Cuba over to an American military government.: Spanien överlämnar Kuba till en amerikansk militärregering.
  The American military government ends, and Cuba becomes an independent republic, under the Platt Amendment.: Den amerikanska militärregeringen upphör, och Kuba blir en självständig republik under Plattilläggets villkor.
  The United States takes possession of Guantánamo Bay, leased from Cuba as a naval station by an agreement of February 1903.: USA tar Guantánamobukten i besittning; genom ett avtal i februari 1903 har landet arrenderat den av Kuba som flottbas.
  Denmark sells the Danish West Indies to the United States, which renames them the Virgin Islands.: Danmark säljer Danska Västindien till USA, som döper om dem till Jungfruöarna.
  Guadeloupe and Martinique, with St Martin and St Barthélemy, become overseas departments of France.: Guadeloupe och Martinique blir, med Saint Martin och Saint-Barthélemy, franska utomeuropeiska departement.
  Newfoundland and Labrador join Canada after two referendums.: Newfoundland och Labrador går med i Kanada efter två folkomröstningar.
  By the Charter for the Kingdom the Netherlands Antilles, so named since 1948, become a self-governing country within the Kingdom of the Netherlands.: Genom Stadgan för kungariket blir Nederländska Antillerna, som burit det namnet sedan 1948, ett självstyrande land inom kungariket Nederländerna.
  Ten British colonies form the West Indies Federation, with its capital at Port of Spain.: Tio brittiska kolonier bildar Västindiska federationen, med huvudstad i Port of Spain.
  The West Indies Federation is dissolved after Jamaica votes to leave it.: Västindiska federationen upplöses sedan Jamaica röstat för att lämna den.
  Jamaica becomes independent.: Jamaica blir självständigt.
  Trinidad and Tobago becomes independent.: Trinidad och Tobago blir självständigt.
  Barbados becomes independent.: Barbados blir självständigt.
  The Bahamas become independent.: Bahamas blir självständigt.
  Grenada becomes independent.: Grenada blir självständigt.
  Dominica becomes independent.: Dominica blir självständigt.
  St Lucia becomes independent.: Saint Lucia blir självständigt.
  St Vincent and the Grenadines becomes independent.: Saint Vincent och Grenadinerna blir självständigt.
  Antigua and Barbuda becomes independent.: Antigua och Barbuda blir självständigt.
  St Kitts and Nevis becomes independent; Anguilla, which broke away in 1967, stays British.: Saint Kitts och Nevis blir självständigt; Anguilla, som bröt sig loss 1967, förblir brittiskt.
  Aruba leaves the Netherlands Antilles and becomes a separate country within the Kingdom of the Netherlands.: Aruba lämnar Nederländska Antillerna och blir ett eget land inom kungariket Nederländerna.
  "The Netherlands Antilles are dissolved: Curaçao and Sint Maarten become separate countries within the kingdom, and Bonaire, Sint Eustatius and Saba special municipalities of the Netherlands.": "Nederländska Antillerna upplöses: Curaçao och Sint Maarten blir egna länder inom kungariket, och Bonaire, Sint Eustatius och Saba blir särskilda kommuner i Nederländerna."
  "Virginia’s Kentucky County comes into being, and North Carolina has taken in the Watauga settlements as its Washington District: the lands west of the mountains are governed by the new states, though Britain gives up its claim only in 1783.": "Virginias Kentucky County inrättas, och North Carolina har införlivat bosättningarna vid Watauga som sitt Washington District: landen väster om bergen styrs av de nya delstaterna, även om Storbritannien ger upp sitt anspråk först 1783."
