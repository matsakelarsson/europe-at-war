# Svenska översättningar av katalogtexten (våg 9); stegtexterna kommer senare.
1959 Tibetan uprising: Det tibetanska upproret 1959
? A rising in Lhasa in March 1959 against Chinese rule, and its suppression by the People’s Liberation Army, which ended with the flight of the 14th Dalai Lama to India. Revolts against land reform and the campaigns against monasteries had spread from Kham and Amdo since 1956, and refugees and guerrillas of the Chushi Gangdruk crowded into central Tibet. On 10 March 1959, fearing that the Dalai Lama would be seized at a theatre performance in the PLA camp, thousands of Lhasa residents surrounded his summer palace, the Norbulingka; assemblies in the city declared Tibet independent. On the night of 17 March the Dalai Lama slipped away, and from 20 March the PLA shelled the Norbulingka and the Tibetan positions and took the city by 23 March. Thousands of Tibetans were killed in Lhasa; estimates of the dead in the suppression of the revolt across central Tibet range much higher. On 28 March the Chinese government dissolved the Tibetan government, and on 31 March the Dalai Lama crossed into India, where about 80,000 refugees followed him. Exiles mark 10 March as Tibetan Uprising Day; the Chinese government describes the events as an armed rebellion of the upper strata to preserve serfdom, and since 2009 marks 28 March as Serfs’ Emancipation Day.
: En resning i Lhasa i mars 1959 mot det kinesiska styret och Folkets befrielsearmés nedslående av den, som slutade med att den fjortonde Dalai lama flydde till Indien. Revolter mot jordreformen och kampanjerna mot klostren hade spridit sig från Kham och Amdo sedan 1956, och flyktingar och gerillasoldater ur Chushi Gangdruk trängdes i centrala Tibet. Den 10 mars 1959 omringade tusentals invånare i Lhasa, som fruktade att Dalai lama skulle gripas vid en teaterföreställning i Folkets befrielsearmés läger, hans sommarpalats Norbulingka; församlingar i staden förklarade Tibet självständigt. Natten den 17 mars smet Dalai lama i väg, och från den 20 mars besköt Folkets befrielsearmé Norbulingka och de tibetanska ställningarna och hade intagit staden den 23 mars. Tusentals tibetaner dödades i Lhasa; uppskattningarna av antalet döda vid nedslåendet av revolten i hela centrala Tibet är betydligt högre. Den 28 mars upplöste den kinesiska regeringen den tibetanska regeringen, och den 31 mars gick Dalai lama över gränsen till Indien, dit omkring 80 000 flyktingar följde honom. Exiltibetaner högtidlighåller den 10 mars som Tibetanska upprorsdagen; den kinesiska regeringen beskriver händelserna som ett väpnat uppror av överskiktet för att bevara livegenskapen och högtidlighåller sedan 2009 den 28 mars som De livegnas befrielsedag.
