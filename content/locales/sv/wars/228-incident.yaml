# Svenska översättningar av katalogtexten (våg 9); stegtexterna kommer senare.
February 28 incident: Incidenten den 28 februari
? "An uprising in Taiwan against the Nationalist administration and its violent suppression. Japan had handed Taiwan to the Republic of China in October 1945, and the government of Chen Yi, staffed mostly by officials from the mainland, was resented for corruption, state monopolies, inflation and discrimination against Taiwanese. On 27 February 1947 agents of the Tobacco Monopoly in Taipei beat a widow, Lin Jiang-mai, while seizing her cigarettes, and one of them fired into the crowd, killing a bystander. The next day soldiers fired on protesters outside the governor’s office, and the unrest spread across the island. Taiwanese took over local offices, police stations and a radio station in Taipei, some mainlanders were beaten or killed by crowds, and settlement committees presented 32 demands for reform and self-government. Armed groups fought government troops at Chiayi and Kaohsiung, and in Taichung the Twenty-Seven Brigade, formed by the communist Xie Xuehong, took up arms. Chen Yi negotiated while asking Nanjing for troops. On 6 March the Kaohsiung garrison under Peng Meng-chi arrested and executed a peace delegation led by the city’s mayor and attacked the city, and on 8 March the 21st Division began landing at Keelung. In the following weeks troops killed protesters, students, lawyers, doctors and local leaders across the island; the last armed group was dispersed near Puli on 16 March. The number of dead is unknown: a government commission in 1992 estimated 18,000 to 28,000, the figure adopted officially in 2007, while other estimates are around 10,000 or lower. The incident was followed by martial law (1949–1987) and the White Terror, when it could not be discussed in public. President Lee Teng-hui apologised in 1995, and 28 February is now Peace Memorial Day."
: "Ett uppror på Taiwan mot nationalistförvaltningen och det våldsamma nedslåendet av det. Japan hade överlämnat Taiwan till Republiken Kina i oktober 1945, och Chen Yis regering, som mest bemannades av ämbetsmän från fastlandet, väckte förbittring genom korruption, statliga monopol, inflation och diskriminering av taiwaneser. Den 27 februari 1947 misshandlade agenter från tobaksmonopolet i Taipei en änka, Lin Jiang-mai, när de beslagtog hennes cigaretter, och en av dem sköt in i folkmassan och dödade en åskådare. Dagen därpå sköt soldater mot demonstranter utanför guvernörens kansli, och oroligheterna spred sig över ön. Taiwaneser tog över lokala ämbetskontor, polisstationer och en radiostation i Taipei, en del fastlandsbor misshandlades eller dödades av folkmassor, och förlikningskommittéer lade fram 32 krav på reformer och självstyre. Beväpnade grupper stred mot regeringstrupper i Chiayi och Kaohsiung, och i Taichung grep Tjugosjunde brigaden, som bildats av kommunisten Xie Xuehong, till vapen. Chen Yi förhandlade samtidigt som han bad Nanking om trupper. Den 6 mars grep och avrättade garnisonen i Kaohsiung under Peng Meng-chi en fredsdelegation ledd av stadens borgmästare och angrep staden, och den 8 mars började 21:a divisionen landstiga i Keelung. Under de följande veckorna dödade trupper demonstranter, studenter, advokater, läkare och lokala ledare över hela ön; den sista beväpnade gruppen skingrades nära Puli den 16 mars. Antalet döda är okänt: en regeringskommission uppskattade 1992 antalet till 18 000 till 28 000, den siffra som officiellt antogs 2007, medan andra uppskattningar ligger kring 10 000 eller lägre. Incidenten följdes av krigslagar (1949–1987) och den vita terrorn, då den inte kunde diskuteras offentligt. President Lee Teng-hui bad om ursäkt 1995, och den 28 februari är nu Fredens minnesdag."
