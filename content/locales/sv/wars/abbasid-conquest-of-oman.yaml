# Svenska översättningar av katalogtexten (våg 7); stegtexterna kommer senare.
Abbasid conquest of Oman: Abbasidernas erövring av Oman
The Abbasid invasion of Oman in 893, which ended the second Ibadi imamate. During a civil war among the Omani tribes, one faction asked Muhammad ibn Nur, the caliph’s governor of Bahrayn, to intervene, and the caliph al-Mu’tadid approved an expedition. Muhammad’s army, said to number 25,000, marched overland while supplies came by sea from Basra. It took Julfar after a brief fight, advanced in April 893 by way of Tu’am to Nizwa, which fell without resistance, and in mid-May defeated the imam Azzan ibn Tamim, who was killed with many of his followers; their heads were sent to Baghdad. A last tribal alliance was crushed at Dama. Ibadi sources describe harsh repression, with torture, mutilation and killings, the burning of books and the destruction of irrigation channels, and called Muhammad ibn Bur, “son of desolation”. He returned to Bahrayn in 896, leaving a deputy in Oman.: Den abbasidiska invasionen av Oman 893, som gjorde slut på det andra ibaditiska imamatet. Under ett inbördeskrig mellan de omanska stammarna bad en fraktion Muhammad ibn Nur, kalifens guvernör i Bahrayn, att ingripa, och kalifen al-Mu’tadid godkände en expedition. Muhammads armé, som sägs ha uppgått till 25 000 man, marscherade landvägen medan förnödenheter kom sjövägen från Basra. Den intog Julfar efter en kort strid, ryckte i april 893 fram via Tu’am till Nizwa, som föll utan motstånd, och besegrade i mitten av maj imamen Azzan ibn Tamim, som dödades tillsammans med många av sina anhängare; deras huvuden sändes till Bagdad. En sista stamallians krossades vid Dama. Ibaditiska källor beskriver ett hårt förtryck, med tortyr, stympningar och dödande, bokbål och förstörda bevattningskanaler, och kallade honom Muhammad ibn Bur, ”ödeläggelsens son”. Han återvände till Bahrayn 896 och lämnade kvar en ställföreträdare i Oman.
