# Svenska översättningar av katalogtexten (våg 9); stegtexterna kommer senare.
Wars of Abu’l-Khayr Khan: Abu’l-Khayr khans krig
? The campaigns by which Abu’l-Khayr, a Shaybanid prince of the house of Jochi, built the Uzbek Khanate on the steppe east of the Urals and the Volga, and the defeats that broke it. Proclaimed khan in 1428 at about the age of seventeen, in the lands of the Tura and the Tobol around Chimgi-Tura (today’s Tyumen), he defeated rival Jochid khans, among them Hajji Muhammad of Sibir and, near Astrakhan, Mustafa Khan. In 1430–1431 his army sacked Urgench in Timurid Khwarazm, and in about 1446 he took the towns of the middle Syr Darya, Sighnaq, Sozak, Uzgend and Arquq, and made Sighnaq his capital. In 1451 he helped the Timurid Abu Sa’id take Samarkand and married a daughter of Ulugh Beg. In about 1457 an Oirat army under Uz Temür taishi routed him at Kök Kashane near Sighnaq and plundered his lands, and soon after the sultans Kerei and Janibek left him with their followers and settled in Moghulistan, where they founded the Kazakh Khanate. Abu’l-Khayr died in 1468 (some sources say 1469) on a campaign against them; his khanate broke up, and his grandson Muhammad Shaybani later founded the Shaybanid state in Mawarannahr.
: De fälttåg genom vilka Abu’l-Khayr, en shaybanidisk furste av Jochis hus, byggde upp Uzbekiska khanatet på stäppen öster om Ural och Volga, och de nederlag som bröt det. Han utropades till khan 1428, vid omkring sjutton års ålder, i länderna vid Tura och Tobol kring Chimgi-Tura (dagens Tiumen) och besegrade rivaliserande jochidiska khaner, bland dem Hajji Muhammad av Sibir och, nära Astrachan, Mustafa khan. År 1430–1431 plundrade hans armé Urgentj i det timuridiska Khwarazm, och omkring 1446 intog han städerna vid mellersta Syr-Darja, Sighnaq, Sozak, Uzgend och Arquq, och gjorde Sighnaq till sin huvudstad. År 1451 hjälpte han timuriden Abu Sa’id att inta Samarkand och gifte sig med en dotter till Ulugh Beg. Omkring 1457 slog en oiratisk armé under Uz Temür taishi honom på flykten vid Kök Kashane nära Sighnaq och plundrade hans länder, och kort därefter lämnade sultanerna Kerei och Janibek honom med sina anhängare och slog sig ned i Moghulistan, där de grundade Kazakkhanatet. Abu’l-Khayr dog 1468 (vissa källor säger 1469) under ett fälttåg mot dem; hans khanat föll sönder, och hans sonson Muhammad Shaybani grundade senare den shaybanidiska staten i Mawarannahr.
