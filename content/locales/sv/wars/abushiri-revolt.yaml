Abushiri revolt: Abushiriupproret
? The rising of the Swahili coast of present-day Tanzania against the German East Africa Company. In April 1888 Sultan Khalifa of Zanzibar leased the mainland coast to the company, and when its agents arrived in August, hauled down the sultan’s flags and took over the customs houses, the towns rose. Led at Pangani by Abushiri ibn Salim al-Harthi, a planter of Arab and Oromo descent, and at Saadani by Bwana Heri, Swahili townspeople, Arab planters and traders and the peoples of the hinterland drove the company out of every port except Bagamoyo and Dar es Salaam, which held out with the help of German warships. Germany and Britain blockaded the coast, and in 1889 the imperial commissioner Hermann von Wissmann, with an army of African soldiers recruited in Egypt and Mozambique, stormed Abushiri’s fort near Bagamoyo (8 May) and retook the northern ports. Abushiri was betrayed and hanged at Pangani on 15 December 1889; Bwana Heri submitted early in 1890, and Kilwa, Lindi and Mikindani were retaken in May. The German government took over the colony from the company on 1 January 1891, and Wissmann’s force became the core of the Schutztruppe.
: Resningen på Swahilikusten i dagens Tanzania mot Tyska Östafrikakompaniet. I april 1888 arrenderade sultan Khalifa av Zanzibar ut fastlandskusten till kompaniet, och när dess agenter anlände i augusti, halade sultanens flaggor och tog över tullhusen, reste sig städerna. Under ledning av Abushiri ibn Salim al-Harthi, en plantageägare av arabisk och oromisk härkomst, i Pangani och av Bwana Heri i Saadani drev swahiliska stadsbor, arabiska plantageägare och handelsmän och folken i inlandet ut kompaniet ur alla hamnar utom Bagamoyo och Dar es-Salaam, som höll stånd med hjälp av tyska krigsfartyg. Tyskland och Storbritannien blockerade kusten, och 1889 stormade rikskommissarien Hermann von Wissmann, med en armé av afrikanska soldater som rekryterats i Egypten och Moçambique, Abushiris fort nära Bagamoyo (8 maj) och återtog de nordliga hamnarna. Abushiri förråddes och hängdes i Pangani den 15 december 1889; Bwana Heri underkastade sig i början av 1890, och Kilwa, Lindi och Mikindani återtogs i maj. Den tyska regeringen tog över kolonin från kompaniet den 1 januari 1891, och Wissmanns styrka blev kärnan i Schutztruppe.
