Acadian Civil War: Akadiska inbördeskriget
? A war in French Acadia between two rival commanders, Charles de Saint-Étienne de La Tour, based at Fort Sainte-Marie (Fort La Tour) at the mouth of the Saint John River, and Charles de Menou d’Aulnay, based at Port-Royal across the Bay of Fundy, over the fur trade and the right to govern the colony. After the death of the governor Isaac de Razilly in 1635, the French crown divided Acadia between them in 1638 in a way that left each with a fort inside the other’s lands. In 1640 the two came to blows when La Tour was refused entry at Port-Royal. D’Aulnay won royal orders charging La Tour with disloyalty and calling him to France, and in 1642–1643 blockaded Fort Sainte-Marie, while La Tour’s wife, Françoise-Marie Jacquelin, slipped out to plead his case in France. La Tour turned to Puritan Boston, where Governor John Winthrop let him hire ships and volunteers; in July 1643 he returned with four ships and some 270 men, broke the blockade, chased d’Aulnay to Port-Royal, burned his mill and seized his furs, and skirmished with him again at Penobscot. D’Aulnay’s first attack on Fort Sainte-Marie, in February 1645, was beaten off. In April, learning that La Tour was again in Boston, he returned with about two hundred men. Jacquelin held the fort for several days before surrendering on a promise of quarter; d’Aulnay then had the garrison hanged, all but one man who was made to act as executioner, and forced her to watch with a rope around her neck. She died there three weeks later. D’Aulnay ruled all Acadia until he drowned in 1650; in 1653 La Tour, restored as governor, married his widow, Jeanne Motin. The rivalry weakened Acadia, which a New England expedition under Robert Sedgwick took in 1654.
: Ett krig i franska Akadien mellan två rivaliserande befälhavare, Charles de Saint-Étienne de La Tour, med bas i Fort Sainte-Marie (Fort La Tour) vid Saint John-flodens mynning, och Charles de Menou d’Aulnay, med bas i Port-Royal på andra sidan Fundybukten, om pälshandeln och rätten att styra kolonin. Efter guvernören Isaac de Razillys död 1635 delade den franska kronan 1638 upp Akadien mellan dem på ett sätt som gav var och en av dem ett fort inne på den andres område. År 1640 drabbade de samman när La Tour nekades tillträde till Port-Royal. D’Aulnay utverkade kungliga order som anklagade La Tour för illojalitet och kallade honom till Frankrike, och 1642–1643 blockerade han Fort Sainte-Marie, medan La Tours hustru, Françoise-Marie Jacquelin, tog sig ut för att föra hans talan i Frankrike. La Tour vände sig till det puritanska Boston, där guvernör John Winthrop lät honom hyra skepp och frivilliga; i juli 1643 återvände han med fyra skepp och omkring 270 man, bröt blockaden, jagade d’Aulnay till Port-Royal, brände hans kvarn och beslagtog hans pälsar och drabbade på nytt samman med honom vid Penobscot. D’Aulnays första anfall mot Fort Sainte-Marie, i februari 1645, slogs tillbaka. I april, när han fick veta att La Tour åter var i Boston, kom han tillbaka med omkring tvåhundra man. Jacquelin höll fortet i flera dagar innan hon kapitulerade mot löfte om pardon; d’Aulnay lät sedan hänga garnisonen, alla utom en man som tvingades tjänstgöra som bödel, och tvingade henne att se på med ett rep om halsen. Hon dog där tre veckor senare. D’Aulnay styrde hela Akadien tills han drunknade 1650; 1653 gifte sig La Tour, som hade återinsatts som guvernör, med hans änka, Jeanne Motin. Rivaliteten försvagade Akadien, som en expedition från New England under Robert Sedgwick intog 1654.
