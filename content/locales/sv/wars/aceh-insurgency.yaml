# Svenska översättningar av katalogtexten (våg 11); stegtexterna kommer senare.
Aceh insurgency: Upprorsrörelsen i Aceh
? The war of the Free Aceh Movement (Gerakan Aceh Merdeka, GAM) for the independence of Aceh, at the northern tip of Sumatra, from Indonesia. Aceh had been an independent sultanate until the Dutch conquest (1873–1904), and many Acehnese felt that Jakarta had broken its promises of autonomy and taken the wealth of the natural gas fields opened near Lhokseumawe in the 1970s. Hasan di Tiro declared independence on 4 December 1976; his small movement was crushed by 1979, revived in 1989 with fighters trained in Libya, and was met by a decade of military operations in which thousands of civilians were killed, tortured or disappeared. After the fall of Suharto in 1998 GAM grew quickly; ceasefires in 2000 and 2002 broke down, and in May 2003 the government imposed martial law and launched its largest military operation since East Timor. The Indian Ocean tsunami of 26 December 2004, which killed some 170,000 people in Aceh, pushed both sides to talks in Helsinki under the former Finnish president Martti Ahtisaari. In the agreement of 15 August 2005 GAM gave up its demand for independence and disarmed, and Indonesia withdrew most of its troops, granted an amnesty and allowed local political parties; GAM disbanded its army on 27 December 2005. An estimated 15,000 people, most of them civilians, died in the conflict, though estimates range from about 10,000 to 30,000.
: Det krig som Rörelsen för ett fritt Aceh (Gerakan Aceh Merdeka, GAM) förde för att göra Aceh, på Sumatras nordspets, självständigt från Indonesien. Aceh hade varit ett självständigt sultanat fram till den nederländska erövringen (1873–1904), och många acehneser ansåg att Jakarta hade svikit sina löften om självstyre och lagt beslag på rikedomarna från de naturgasfält som öppnades nära Lhokseumawe på 1970-talet. Hasan di Tiro förklarade Aceh självständigt den 4 december 1976; hans lilla rörelse var krossad 1979, återuppstod 1989 med kämpar som hade utbildats i Libyen och möttes av ett decennium av militära operationer där tusentals civila dödades, torterades eller försvann. Efter Suhartos fall 1998 växte GAM snabbt; vapenvilor 2000 och 2002 bröt samman, och i maj 2003 införde regeringen krigslagar och inledde sin största militära operation sedan Östtimor. Tsunamin i Indiska oceanen den 26 december 2004, som dödade omkring 170 000 människor i Aceh, drev båda sidor till samtal i Helsingfors under Finlands förre president Martti Ahtisaari. I avtalet den 15 augusti 2005 gav GAM upp sitt krav på självständighet och lämnade ifrån sig sina vapen, och Indonesien drog tillbaka större delen av sina trupper, beviljade amnesti och tillät lokala politiska partier; GAM upplöste sin armé den 27 december 2005. Uppskattningsvis 15 000 människor, de flesta av dem civila, dog i konflikten, även om uppskattningarna sträcker sig från omkring 10 000 till 30 000.
