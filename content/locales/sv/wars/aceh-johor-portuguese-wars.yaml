# Svenska översättningar av katalogtexten (våg 11); stegtexterna kommer senare.
Aceh, Johor and Portugal’s wars for the Strait of Malacca: Acehs, Johors och Portugals krig om Malackasundet
? The century of wars between Portuguese Malacca, the sultanate of Aceh in northern Sumatra and the sultanate of Johor, heir of the old Malacca sultanate, for control of the Strait of Malacca, the main sea route between the Indian Ocean and the China Sea. Historians call it a triangular war, because each of the three fought the other two in turn. Aceh, which had grown rich on the pepper trade that Muslim merchants moved there after 1511 and that it shipped to the Red Sea in defiance of the Portuguese, attacked Malacca again and again from 1537, with gunners and guns from the Ottoman Empire after the 1560s. Johor, which wanted Malacca back, besieged it with Javanese help in 1551, but feared Aceh more and often sided with the Portuguese; Aceh sacked the Johor capital in 1564, the Portuguese in 1587. Japara, the Javanese port ruled by Ratu Kalinyamat, sent its fleets against Malacca in 1551 and 1574. After 1600 the Dutch East India Company joined the war as Johor’s ally against Portugal, besieging Malacca in 1606. Aceh reached its height under Iskandar Muda (1607–1636), who conquered Pahang, Kedah and Perak, carried their people off to Aceh and sacked Johor three times, until his great armada was destroyed at the Duyon River outside Malacca in 1629 by the Portuguese, helped by Johor and Patani. Aceh never again threatened Malacca, and in 1641 the Dutch and Johor took the city from the Portuguese.
: Det sekel av krig som Portugisiska Malacka, sultanatet Aceh på norra Sumatra och sultanatet Johor, arvtagare till det gamla Malackasultanatet, utkämpade om herraväldet över Malackasundet, den viktigaste sjövägen mellan Indiska oceanen och Kinesiska havet. Historikerna kallar det ett triangelkrig, eftersom var och en av de tre i tur och ordning bekämpade de båda andra. Aceh, som hade blivit rikt på den pepparhandel som muslimska köpmän flyttade dit efter 1511 och som Aceh skeppade till Röda havet i trots mot portugiserna, anföll Malacka gång på gång från 1537, efter 1560-talet med artillerister och kanoner från Osmanska riket. Johor, som ville ha tillbaka Malacka, belägrade staden med javanesisk hjälp 1551, men fruktade Aceh mer och ställde sig ofta på portugisernas sida; Aceh plundrade Johors huvudstad 1564, portugiserna 1587. Japara, den javanesiska hamnstad som styrdes av Ratu Kalinyamat, sände sina flottor mot Malacka 1551 och 1574. Efter 1600 gick Nederländska ostindiska kompaniet in i kriget som Johors bundsförvant mot Portugal och belägrade Malacka 1606. Aceh nådde sin höjdpunkt under Iskandar Muda (1607–1636), som erövrade Pahang, Kedah och Perak, förde bort deras befolkning till Aceh och plundrade Johor tre gånger, tills hans stora armada 1629 förintades vid floden Duyon utanför Malacka av portugiserna, med hjälp av Johor och Patani. Aceh hotade aldrig mer Malacka, och 1641 tog nederländarna och Johor staden från portugiserna.
