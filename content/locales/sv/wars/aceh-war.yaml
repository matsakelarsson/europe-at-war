# Svenska översättningar av katalogtexten (våg 11); stegtexterna kommer senare.
Aceh War: Acehkriget
? The longest of the Dutch colonial wars, fought for the sultanate of Aceh at the northern tip of Sumatra. Aceh was an independent Muslim kingdom and a great exporter of pepper, whose independence Britain had agreed to respect in 1824; in the Treaty of Sumatra of 1871 Britain gave the Dutch a free hand, and when Aceh sought foreign support the Dutch declared war in March 1873. A first expedition was driven off after its general was killed; a second took the sultan’s palace in January 1874, and the Dutch proclaimed Aceh annexed and renamed its capital Kutaraja. But the war went on in the countryside for thirty years, led by uleebalang (territorial chiefs) and ulama (religious scholars) who preached it as a holy war. Teungku Chik di Tiro led the resistance in the 1880s; Teuku Umar served the Dutch from 1893 and turned against them in 1896 with their weapons, fighting with his wife Cut Nyak Dhien until his death in 1899. Under J. B. van Heutsz, with the scholar Christiaan Snouck Hurgronje as adviser and mobile marechaussee units, the Dutch broke the resistance village by village; the sultan surrendered in January 1903, and in 1904 a column under G. C. E. van Daalen marched through the Gayo and Alas highlands, killing at least 2,922 people by its own count. Fighting went on in places until about 1914, and Acehnese count the resistance as lasting until the Japanese invasion of 1942. Estimates of the Acehnese dead range from about 50,000 to more than 100,000; on the colonial side about 37,000 died, most of them from disease.
: Det längsta av de nederländska kolonialkrigen, utkämpat om sultanatet Aceh på Sumatras nordspets. Aceh var ett självständigt muslimskt kungarike och en stor exportör av peppar, vars självständighet Storbritannien 1824 hade lovat att respektera; i Sumatrafördraget 1871 gav Storbritannien nederländarna fria händer, och när Aceh sökte utländskt stöd förklarade nederländarna krig i mars 1873. En första expedition drevs tillbaka sedan dess general hade dödats; en andra intog sultanens palats i januari 1874, och nederländarna proklamerade att Aceh var annekterat och döpte om dess huvudstad till Kutaraja. Men kriget fortsatte på landsbygden i trettio år, lett av uleebalang (territoriella hövdingar) och ulama (religiösa lärda), som predikade det som ett heligt krig. Teungku Chik di Tiro ledde motståndet på 1880-talet; Teuku Umar tjänade nederländarna från 1893 och vände sig mot dem 1896 med deras egna vapen, och han stred tillsammans med sin hustru Cut Nyak Dhien fram till sin död 1899. Under J. B. van Heutsz, med den lärde Christiaan Snouck Hurgronje som rådgivare och med rörliga marechaussee-enheter, bröt nederländarna motståndet by för by; sultanen gav upp i januari 1903, och 1904 marscherade en kolonn under G. C. E. van Daalen genom Gayo- och Alashöglandet och dödade enligt sin egen räkning minst 2 922 människor. Striderna fortsatte på sina håll till omkring 1914, och enligt acehnesisk räkning varade motståndet fram till den japanska invasionen 1942. Uppskattningarna av antalet döda acehneser varierar från omkring 50 000 till mer än 100 000; på kolonial sida dog omkring 37 000, de flesta av sjukdomar.
