# Svenska översättningar av katalogtexten (våg 7); stegtexterna kommer senare.
Aden Emergency: Adenkrisen
The armed revolt against British rule in Aden and the Federation of South Arabia, the union of Aden colony and the sultanates of its hinterland that Britain had formed to keep its naval and air base. Nationalist movements backed by Nasser’s Egypt and the new Yemen Arab Republic, chiefly the National Liberation Front (NLF) and, from 1966, the Front for the Liberation of Occupied South Yemen (FLOSY), fought British troops in the Radfan mountains in 1964 and waged a campaign of bombings and assassinations in Aden itself. In 1966 Britain announced that it would leave. In 1967 the NLF and FLOSY fought each other as well as the British; after a mutiny in June the rebels held Aden’s Crater district for two weeks. The NLF took over the sultanates one by one, and when the last British troops left on 29–30 November 1967 it proclaimed the People’s Republic of South Yemen. About 90 British soldiers and several hundred Arab fighters and civilians were killed.: Det väpnade upproret mot det brittiska styret i Aden och Sydarabiska federationen, den union av kolonin Aden och sultanaten i dess inland som Storbritannien hade bildat för att behålla sin flott- och flygbas. Nationalistiska rörelser med stöd av Nassers Egypten och den nya Jemenitiska arabrepubliken, främst Nationella befrielsefronten (NLF) och från 1966 Fronten för befrielse av det ockuperade Sydjemen (FLOSY), stred mot brittiska trupper i Radfanbergen 1964 och förde en kampanj av bombattentat och mord i själva Aden. År 1966 meddelade Storbritannien att man skulle lämna landet. Under 1967 stred NLF och FLOSY mot varandra såväl som mot britterna; efter ett myteri i juni höll rebellerna stadsdelen Crater i Aden i två veckor. NLF tog över sultanaten ett efter ett, och när de sista brittiska trupperna lämnade landet den 29–30 november 1967 utropade fronten Folkrepubliken Sydjemen. Omkring 90 brittiska soldater och flera hundra arabiska kämpar och civila dödades.
