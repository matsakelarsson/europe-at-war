# Svenska översättningar av katalogtexten (våg 13); stegtexterna kommer senare.
ADF insurgency: ADF:s uppror
? "Last updated 27 November 2026. The insurgency of the Allied Democratic Forces (ADF), a Ugandan Islamist rebel group that has fought mostly in the eastern Democratic Republic of the Congo and since 2019 has been, in its main faction, the Congolese branch of the Islamic State’s Central Africa Province (ISCAP). The ADF was formed in the mid-1990s by Jamil Mukulu, a convert from Catholicism who had joined the Tabligh movement, and merged with the remnants of an older western Ugandan rebel group, NALU, aiming to overthrow Yoweri Museveni’s government. Its first large attack, on Bwera and Mpondwe in Kasese district on 13 November 1996, killed about 50 people; on 8 June 1998 its fighters killed some 80 students at Kichwamba Technical College in Kabarole, and bombs in Kampala restaurants and on buses killed dozens more that year. Driven out of Uganda by the army by the early 2000s, it settled in the Rwenzori mountains and the Beni area of North Kivu, financed by timber, gold and trade. It revived from 2013; from October 2014 a wave of massacres around Beni killed hundreds of civilians, though investigators also found that Congolese army officers and other armed groups had a hand in some of the killings. Mukulu was arrested in Tanzania in April 2015, and his deputy Musa Baluku took over and brought the group into the Islamic State, which recognised it as part of ISCAP in 2018 and to which it pledged allegiance in 2019; a minority stayed loyal to Mukulu. The ADF killed UN peacekeepers, among them 15 Tanzanians at Semuliki on 7 December 2017, attacked prisons and Christian congregations, and moved north into Ituri. After a series of bombings in Uganda in late 2021, among them suicide attacks in Kampala, Uganda and the DR Congo launched a joint offensive, Operation Shujaa, on 30 November 2021, with 4,000–5,000 Ugandan troops by early 2025. It pushed the ADF out of most strongholds near Beni, but the group shifted west into Irumu and Mambasa in Ituri and south into Lubero and Tshopo, and kept raiding: 42 people, most of them pupils, were killed at Lhubiriha Secondary School in Mpondwe, Uganda, in June 2023; more than 40 people (at least 43 according to the UN) at a Catholic church in Komanda, Ituri, on 27 July 2025; at least 71 mourners at a funeral wake at Ntoyo, Lubero, on 8 September 2025; and 28 people, 17 of them in a church-run hospital, at Byambwe on 14–15 November 2025, part of a week of attacks in Lubero that killed at least 89 according to the UN. In 2025 the ADF partly rebuilt its strength while Congolese forces were drawn into the war with the M23; a strike on Musa Baluku’s headquarters on 23 February 2026 forced his camp to move deeper into the forest, but attacks went on, and the group’s raids hampered the response to an Ebola outbreak declared in Ituri in May 2026. In one week in November 2026 the ADF killed at least 44 civilians in Mambasa territory, Ituri, days after killing 66 people in North Kivu, according to humanitarian and security sources, and Africanews reported that the Ugandan and Congolese armies had had no significant success against it. Total deaths since 1996 run into the thousands, mostly Congolese civilians; exact figures are not known."
: "Senast uppdaterad 27 november 2026. Upproret av Allierade demokratiska styrkorna (ADF), en ugandisk islamistisk rebellgrupp som mest har stridit i östra Demokratiska republiken Kongo och som sedan 2019, i sin huvudfraktion, är den kongolesiska grenen av Islamiska statens Centralafrikaprovins (ISCAP). ADF bildades i mitten av 1990-talet av Jamil Mukulu, en konvertit från katolicismen som hade anslutit sig till Tablighrörelsen, och gick samman med resterna av en äldre rebellgrupp från västra Uganda, NALU, med målet att störta Yoweri Musevenis regering. Dess första stora anfall, mot Bwera och Mpondwe i distriktet Kasese den 13 november 1996, dödade omkring 50 människor; den 8 juni 1998 dödade dess kämpar omkring 80 elever vid Kichwamba Technical College i Kabarole, och bomber på restauranger och bussar i Kampala dödade ytterligare dussintals samma år. Sedan armén i början av 2000-talet drivit ut den ur Uganda slog den sig ned i Rwenzoribergen och i området kring Beni i Nordkivu, finansierad av timmer, guld och handel. Den återhämtade sig från 2013; från oktober 2014 dödade en våg av massakrer kring Beni hundratals civila, även om utredare också fann att kongolesiska arméofficerare och andra väpnade grupper hade del i en del av dödandet. Mukulu greps i Tanzania i april 2015, och hans ställföreträdare Musa Baluku tog över och förde in gruppen i Islamiska staten, som 2018 erkände den som en del av ISCAP och som den svor trohet till 2019; en minoritet förblev lojal mot Mukulu. ADF dödade FN-soldater, bland dem 15 tanzanier i Semuliki den 7 december 2017, angrep fängelser och kristna församlingar och flyttade norrut in i Ituri. Efter en serie bombdåd i Uganda i slutet av 2021, bland dem självmordsattentat i Kampala, inledde Uganda och DR Kongo den 30 november 2021 en gemensam offensiv, Operation Shujaa, som i början av 2025 omfattade 4 000–5 000 ugandiska soldater. Den drev ut ADF ur de flesta fästena nära Beni, men gruppen flyttade västerut till Irumu och Mambasa i Ituri och söderut till Lubero och Tshopo och fortsatte sina räder: 42 människor, de flesta elever, dödades vid Lhubiriha Secondary School i Mpondwe i Uganda i juni 2023; mer än 40 människor (minst 43 enligt FN) i en katolsk kyrka i Komanda i Ituri den 27 juli 2025; minst 71 sörjande vid en likvaka i Ntoyo i Lubero den 8 september 2025; och 28 människor, 17 av dem på ett kyrkligt drivet sjukhus, i Byambwe den 14–15 november 2025, som en del av en vecka av anfall i Lubero som enligt FN dödade minst 89. Under 2025 återuppbyggde ADF delvis sin styrka medan de kongolesiska styrkorna drogs in i kriget mot M23; ett angrepp mot Musa Balukus högkvarter den 23 februari 2026 tvingade hans läger att flytta djupare in i skogen, men anfallen fortsatte, och gruppens räder försvårade insatserna mot ett ebolautbrott som utlystes i Ituri i maj 2026. Under en vecka i november 2026 dödade ADF minst 44 civila i territoriet Mambasa i Ituri, några dagar efter att ha dödat 66 människor i Nordkivu, enligt humanitära källor och säkerhetskällor, och Africanews rapporterade att den ugandiska och den kongolesiska armén inte hade nått några betydande framgångar mot gruppen. Det totala antalet döda sedan 1996 uppgår till tusentals, mest kongolesiska civila; exakta siffror är inte kända."
