Afghan Civil War of 1863–1869: Afghanska inbördeskriget 1863–1869
The war of succession among the sons of Dost Mohammad Khan, who died at Herat on 9 June 1863, days after taking the city. His chosen heir, Sher Ali Khan, was challenged by his half-brothers Mohammad Afzal Khan and Mohammad Azam Khan and by Afzal’s son Abdur Rahman Khan, and by his own full brother Mohammad Amin Khan at Kandahar. Sher Ali defeated and killed Amin in 1865, but lost his heir in the same battle; Abdur Rahman and Azam then beat him at Sheikhabad in 1866 and at Kalat-i-Ghilzai in 1867, and Afzal and then Azam ruled in Kabul. After Afzal’s death in 1867 the victors quarrelled, and Sher Ali, with his son Yaqub Khan, retook Kandahar in May 1868 and Kabul in September. Azam fled to Persia and Abdur Rahman to Russian Turkestan, from where he returned to take the throne in 1880. British India stayed out of the war and recognised whoever held Kabul.: Tronföljdskriget mellan sönerna till Dost Mohammad Khan, som dog i Herat den 9 juni 1863, några dagar efter att ha intagit staden. Hans utvalde arvinge, Sher Ali Khan, utmanades av sina halvbröder Mohammad Afzal Khan och Mohammad Azam Khan och av Afzals son Abdur Rahman Khan, samt av sin egen helbror Mohammad Amin Khan i Kandahar. Sher Ali besegrade och dödade Amin 1865 men förlorade sin arvinge i samma slag; Abdur Rahman och Azam slog honom sedan vid Sheikhabad 1866 och vid Kalat-i-Ghilzai 1867, och först Afzal och sedan Azam härskade i Kabul. Efter Afzals död 1867 blev segrarna oense, och Sher Ali återtog tillsammans med sin son Yaqub Khan Kandahar i maj 1868 och Kabul i september. Azam flydde till Persien och Abdur Rahman till Ryska Turkestan, varifrån han återvände och besteg tronen 1880. Brittiska Indien höll sig utanför kriget och erkände den som behärskade Kabul.
