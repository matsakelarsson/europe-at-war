Afghan civil war of 1928–1929: Afghanska inbördeskriget 1928–1929
A civil war that overthrew King Amanullah Khan, whose reforms, among them women’s rights, Western dress and conscription, had angered tribal and religious leaders. It began with a revolt of the Shinwari tribe around Jalalabad in November 1928. Habibullah Kalakani, a Tajik from the Koh-i Daman north of Kabul whose followers are known as the Saqqawists, attacked Kabul in December and took it on 17 January 1929, after Amanullah had abdicated and fled to Kandahar. Habibullah ruled as emir for nine months and took Kandahar in June, after Amanullah had left the country, while a Soviet detachment briefly entered the north. Nadir Khan, a former commander-in-chief, raised the tribes of the south-east and took Kabul on 13 October 1929. He became king, and Habibullah was executed in November. Each side is estimated to have lost about 7,500 fighters.: Ett inbördeskrig som störtade kung Amanullah Khan, vars reformer, bland dem kvinnors rättigheter, västerländsk klädsel och värnplikt, hade väckt vrede bland stamledare och religiösa ledare. Det började med ett uppror bland shinwaristammen kring Jalalabad i november 1928. Habibullah Kalakani, en tadzjik från Koh-i Daman norr om Kabul, vars anhängare kallas saqqawister, anföll Kabul i december och intog staden den 17 januari 1929, sedan Amanullah abdikerat och flytt till Kandahar. Habibullah härskade som emir i nio månader och intog Kandahar i juni, sedan Amanullah lämnat landet, medan en sovjetisk avdelning en kort tid trängde in i norr. Nadir Khan, en före detta överbefälhavare, mobiliserade stammarna i sydost och intog Kabul den 13 oktober 1929. Han blev kung, och Habibullah avrättades i november. Vardera sidan beräknas ha förlorat omkring 7 500 stridande.
