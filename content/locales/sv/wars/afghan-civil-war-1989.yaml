# Svenska översättningar av katalogtexten (våg 7); stegtexterna kommer senare.
Afghan Civil War (1989–1992): Afghanska inbördeskriget (1989–1992)
The war between the communist government of President Mohammad Najibullah and the mujahideen after the last Soviet troops left Afghanistan in February 1989. Most observers expected the government to fall quickly, but its army, militias and air force, still supplied by the Soviet Union, beat off a mujahideen assault on Jalalabad in 1989, and Najibullah survived a coup attempt by his own defence minister in 1990. The mujahideen took their first city, Khost, in March 1991. When the Soviet Union collapsed at the end of 1991, its aid stopped; Najibullah’s northern militia commanders, led by Abdul Rashid Dostum, went over to Ahmad Shah Massoud, and in April 1992 the government fell. Najibullah took refuge in the UN compound in Kabul, and the mujahideen parties proclaimed the Islamic State of Afghanistan, but they soon fell to fighting among themselves.: Kriget mellan president Mohammad Najibullahs kommunistiska regering och mujahedin sedan de sista sovjetiska trupperna hade lämnat Afghanistan i februari 1989. De flesta bedömare väntade sig att regeringen snabbt skulle falla, men dess armé, miliser och flygvapen, som fortfarande försörjdes av Sovjetunionen, slog tillbaka mujahedins anfall mot Jalalabad 1989, och Najibullah överlevde ett kuppförsök av sin egen försvarsminister 1990. Mujahedin intog sin första stad, Khost, i mars 1991. När Sovjetunionen föll samman i slutet av 1991 upphörde biståndet; Najibullahs milisbefälhavare i norr, ledda av Abdul Rashid Dostum, gick över till Ahmad Shah Massoud, och i april 1992 föll regeringen. Najibullah tog sin tillflykt till FN:s anläggning i Kabul, och mujahedinpartierna utropade Islamiska staten Afghanistan, men de började snart strida inbördes.
