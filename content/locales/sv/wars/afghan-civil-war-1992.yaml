# Svenska översättningar av katalogtexten (våg 7); stegtexterna kommer senare.
Afghan Civil War (1992–1996): Afghanska inbördeskriget (1992–1996)
The war among the victorious mujahideen factions after the fall of Najibullah’s government. The Islamic State of Afghanistan, led by President Burhanuddin Rabbani and his defence minister Ahmad Shah Massoud, held Kabul, but Gulbuddin Hekmatyar’s Hezb-e Islami, backed by Pakistan, shelled the capital from the south, and the Hazara Shia party Hezb-e Wahdat and, from 1994, Abdul Rashid Dostum’s Uzbek Junbish-e Milli also fought the government in shifting alliances. Much of Kabul, which had come through the Soviet war largely intact, was destroyed, and tens of thousands of its people were killed. In 1994 a new movement of religious students, the Taliban, emerged in Kandahar, disarmed local warlords with Pakistani support, and swept across the south and west, taking Herat in 1995 and Kabul on 27 September 1996, when they hanged Najibullah.: Kriget mellan de segrande mujahedinfraktionerna efter Najibullahregeringens fall. Islamiska staten Afghanistan, ledd av president Burhanuddin Rabbani och hans försvarsminister Ahmad Shah Massoud, höll Kabul, men Gulbuddin Hekmatyars Hezb-e-Islami, som stöddes av Pakistan, besköt huvudstaden söderifrån, och hazarernas shiitiska parti Hezb-e Wahdat och från 1994 Abdul Rashid Dostums uzbekiska Junbish-e Milli stred också mot regeringen i skiftande allianser. Stora delar av Kabul, som i stort sett hade klarat sig oskadat genom kriget mot Sovjetunionen, förstördes, och tiotusentals av stadens invånare dödades. År 1994 uppstod en ny rörelse av religionsstudenter, talibanerna, i Kandahar. Med pakistanskt stöd avväpnade de lokala krigsherrar och svepte fram över södra och västra Afghanistan; de intog Herat 1995 och Kabul den 27 september 1996, då de hängde Najibullah.
