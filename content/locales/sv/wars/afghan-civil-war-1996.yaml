# Svenska översättningar av katalogtexten (våg 7); stegtexterna kommer senare.
Afghan Civil War (1996–2001): Afghanska inbördeskriget (1996–2001)
The war between the Taliban’s Islamic Emirate of Afghanistan, which took Kabul in September 1996, and the Northern Alliance (United Islamic Front), a coalition of the forces of Ahmad Shah Massoud, Abdul Rashid Dostum, the Hazara party Hezb-e Wahdat and others, which kept the internationally recognised government of Burhanuddin Rabbani alive in the north-east. The Taliban, supported by Pakistan and joined by thousands of foreign fighters including Osama bin Laden’s al-Qaeda, took Mazar-i-Sharif in 1998 after a failed attempt the year before, and by 2001 held about 85 to 90 per cent of the country. Both sides committed massacres of prisoners and civilians, often along ethnic lines. Massoud was killed by al-Qaeda suicide bombers two days before the attacks of 11 September 2001, and the war merged into the US-led invasion that began on 7 October 2001.: Kriget mellan talibanernas Islamiska emiratet Afghanistan, som intog Kabul i september 1996, och Norra alliansen (Förenade islamiska fronten), en koalition av Ahmad Shah Massouds och Abdul Rashid Dostums styrkor, hazarapartiet Hezb-e Wahdat och andra, som höll Burhanuddin Rabbanis internationellt erkända regering vid liv i nordöstra Afghanistan. Talibanerna, som fick stöd av Pakistan och förstärktes av tusentals utländska kämpar, bland dem Usama bin Ladins al-Qaida, intog Mazar-i-Sharif 1998 efter ett misslyckat försök året innan och kontrollerade 2001 omkring 85 till 90 procent av landet. Båda sidor begick massakrer på fångar och civila, ofta längs etniska skiljelinjer. Massoud dödades av självmordsbombare från al-Qaida två dagar före attackerna den 11 september 2001, och kriget gick upp i den USA-ledda invasion som inleddes den 7 oktober 2001.
