# Svenska översättningar av katalogtexten (våg 8); stegtexterna kommer senare.
Afghan–Sikh Wars: Afghansk-sikhiska krigen
The wars in which Maharaja Ranjit Singh’s Sikh Empire took the Durrani Empire’s provinces east of the Khyber Pass. As the Durrani state broke up in civil war, the Sikhs bought the fortress of Attock in 1813 and held it against the Afghan wazir Fateh Khan, stormed Multan in 1818 and conquered Kashmir in 1819. After a hard-fought victory over the Pashtun tribes and the Barakzai sardar Azim Khan at Nowshera in 1823, Peshawar became a Sikh tributary, and in 1834 it was annexed. Emir Dost Mohammad Khan of Kabul tried twice to win it back, in 1835 without a battle and in 1837 at Jamrud, where the Sikh general Hari Singh Nalwa was killed but the Afghans failed to take the fort. The loss of Peshawar shaped Afghan relations with Britain and led into the First Anglo-Afghan War.: De krig där maharadja Ranjit Singhs sikhrike tog Durranirikets provinser öster om Khyberpasset. När durranistaten föll sönder i inbördeskrig köpte sikherna fästningen Attock 1813 och höll den mot den afghanske vesiren Fateh Khan, stormade Multan 1818 och erövrade Kashmir 1819. Efter en hårt tillkämpad seger över pashtunstammarna och barakzaisardaren Azim Khan vid Nowshera 1823 blev Peshawar skattskyldigt till sikherna, och 1834 annekterades det. Emiren Dost Mohammad Khan av Kabul försökte två gånger vinna tillbaka staden, 1835 utan strid och 1837 vid Jamrud, där sikhernas general Hari Singh Nalwa stupade men afghanerna misslyckades med att inta fortet. Förlusten av Peshawar präglade Afghanistans förbindelser med Storbritannien och ledde fram till första anglo-afghanska kriget.
