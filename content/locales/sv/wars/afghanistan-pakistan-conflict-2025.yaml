# Svenska översättningar av katalogtexten (våg 8); stegtexterna kommer senare.
Afghanistan–Pakistan conflict: Konflikten mellan Afghanistan och Pakistan
? The war between Pakistan and Afghanistan’s Taliban government, which Pakistan accuses of sheltering the Pakistani Taliban (TTP) and other groups that attack it from Afghan soil; the Taliban deny this. In October 2025 Pakistani air strikes in Kabul, aimed at the TTP’s leader, were followed by Afghan attacks on Pakistani border posts and a week of the heaviest border fighting in decades, ended by a ceasefire mediated by Qatar and Turkey on 19 October. Talks in Istanbul failed and the border stayed closed. In February 2026, after a wave of bombings in Pakistan, Pakistan struck targets across Afghanistan, including Kabul, Kandahar and Bagram, and declared “open war”. Fighting along the border, Pakistani air and drone strikes and Afghan drone attacks continued through 2026, interrupted only by short truces at the Eid holidays, while talks mediated by China and others brought no settlement. By October 2026 the UN counted more than 1,100 Afghan civilians killed or wounded, and about 115,000 Afghans had been displaced. Last updated 27 November 2026.
: Kriget mellan Pakistan och Afghanistans talibanregering, som Pakistan anklagar för att ge skydd åt de pakistanska talibanerna (TTP) och andra grupper som angriper Pakistan från afghansk mark; talibanerna förnekar detta. I oktober 2025 följdes pakistanska flyganfall i Kabul, riktade mot TTP:s ledare, av afghanska angrepp på pakistanska gränsposteringar och en vecka av de hårdaste gränsstriderna på årtionden, som avslutades med ett eldupphör som Qatar och Turkiet hade medlat fram, den 19 oktober. Förhandlingarna i Istanbul misslyckades, och gränsen förblev stängd. I februari 2026, efter en våg av bombdåd i Pakistan, angrep Pakistan mål över hela Afghanistan, bland annat Kabul, Kandahar och Bagram, och förklarade ”öppet krig”. Striderna längs gränsen, pakistanska flyg- och drönaranfall och afghanska drönarattacker fortsatte under hela 2026, endast avbrutna av korta vapenvilor under eidhelgerna, medan förhandlingar med medling av Kina och andra inte ledde till någon uppgörelse. I oktober 2026 räknade FN med fler än 1 100 dödade eller sårade afghanska civila, och omkring 115 000 afghaner hade fördrivits. Senast uppdaterad 27 november 2026.
