# Svenska översättningar av katalogtexten (våg 12); stegtexterna kommer senare.
Agacher Strip War: Kriget om Agacherremsan
? Two short border wars between Mali and Upper Volta (Burkina Faso from 1984) over the Agacher, a strip of semi-desert about 160 km long on their common border in the north-east of Burkina Faso, with seasonal pools along the Béli river that mattered to herders and, it was believed, minerals underground. The colonial boundary between French Sudan and Upper Volta had never been marked on the ground, and both states claimed the strip. Fighting in November and December 1974 ended in African mediation and an agreement to have the line studied. In December 1985, after a Burkinabé census reached villages in the strip, Mali attacked on Christmas Day with armour and aircraft and took most of the Agacher; Burkinabé aircraft bombed Sikasso. A ceasefire arranged by the West African defence pact ANAD took effect on 30 December. Estimates of the dead range from about 60 to about 140, soldiers and civilians. Both states had already put the dispute to the International Court of Justice, whose chamber on 22 December 1986 divided the strip roughly in two, giving Mali the more populated west and Burkina Faso the east along the Béli; both accepted the ruling.
: Två korta gränskrig mellan Mali och Övre Volta (från 1984 Burkina Faso) om Agacher, en omkring 160 km lång remsa halvöken vid ländernas gemensamma gräns i nordöstra Burkina Faso, med säsongsbundna vattensamlingar längs floden Béli som var viktiga för boskapsskötarna och, trodde man, mineraltillgångar under jord. Den koloniala gränsen mellan Franska Sudan och Övre Volta hade aldrig märkts ut i terrängen, och båda staterna gjorde anspråk på remsan. Striderna i november och december 1974 slutade med afrikansk medling och en överenskommelse om att låta utreda gränsdragningen. I december 1985, sedan en burkinsk folkräkning hade nått byar i remsan, anföll Mali på juldagen med pansar och flyg och intog större delen av Agacher; burkinskt flyg bombade Sikasso. En vapenvila som förmedlats av den västafrikanska försvarspakten ANAD trädde i kraft den 30 december. Uppskattningarna av antalet döda, soldater och civila, varierar från omkring 60 till omkring 140. Båda staterna hade redan hänskjutit tvisten till Internationella domstolen, vars kammare den 22 december 1986 delade remsan ungefär på mitten och gav Mali den tätare befolkade västra delen och Burkina Faso den östra delen längs Béli; båda godtog domen.
