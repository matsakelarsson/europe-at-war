Ahom–Mughal wars: Ahom-mogulska krigen
The long struggle between the Mughal Empire and the Ahom kingdom of the Brahmaputra valley, in today’s Assam, for the borderland of Kamrup and the town of Guwahati. The wars began when the Mughals, having conquered the Koch kingdom of Hajo, pushed up the river in 1615. After two decades of frontier fighting, the Treaty of Asurar Ali in 1639 left Guwahati to the Mughals. In 1661–62 Mir Jumla, governor of Bengal, invaded with a large army and fleet and took the Ahom capital, Garhgaon, but the monsoon, disease and Ahom raids wore his army down, and the Treaty of Ghilajharighat (1663) only bought a tribute and western Assam. The Ahoms took Guwahati back in 1667 under their general Lachit Borphukan, held it against the army of Raja Ram Singh of Amber, and won a decisive river battle at Saraighat in 1671. Guwahati was betrayed to the Mughals in 1679, but in 1682 the Ahoms under King Gadadhar Singha won it back at Itakhuli and pushed the Mughal frontier back to the Manas river, where it stayed.: Den långa kampen mellan Mogulriket och ahomriket i Brahmaputradalen, i dagens Assam, om gränslandet Kamrup och staden Guwahati. Krigen började när mogulerna, som hade erövrat kochriket Hajo, trängde uppför floden 1615. Efter två årtionden av gränsstrider lämnade fördraget vid Asurar Ali 1639 Guwahati åt mogulerna. Åren 1661–62 invaderade Mir Jumla, guvernör i Bengalen, med en stor armé och flotta och intog ahomernas huvudstad Garhgaon, men monsunen, sjukdomar och ahomernas räder nötte ned hans armé, och fördraget i Ghilajharighat (1663) gav bara en tribut och västra Assam. Ahomerna tog tillbaka Guwahati 1667 under sin general Lachit Borphukan, höll staden mot den armé som raja Ram Singh av Amber förde och vann ett avgörande slag på floden vid Saraighat 1671. Guwahati förråddes till mogulerna 1679, men 1682 vann ahomerna under kung Gadadhar Singha tillbaka staden vid Itakhuli och trängde tillbaka mogulgränsen till floden Manas, där den sedan blev kvar.
