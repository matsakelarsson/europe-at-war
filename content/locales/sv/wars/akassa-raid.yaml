# Svenska översättningar av katalogtexten (våg 13); stegtexterna kommer senare.
Akassa raid: Räden mot Akassa
? An attack by the Nembe kingdom, also called Brass, on the Royal Niger Company in the Niger Delta, and the British reprisal that followed. Nembe was an Ijaw trading state on the eastern side of the delta, inside the British Oil Rivers Protectorate since 1884. The Royal Niger Company, which held a British charter over the Niger from 1886, used its rules and licences to keep the river trade for itself and shut out the Nembe traders, who had sold palm oil in the interior markets for generations. In January 1895 King Frederick William Koko, who had recently renounced Christianity, led more than a thousand men in some 22 war canoes against the company’s headquarters at Akassa, at the mouth of the Nun river. At dawn on 29 January they destroyed its warehouses, offices and machinery, killed a number of its African workers and carried about 70 captives back to Nembe. Koko offered to exchange them for a return to free trade, writing that his quarrel was with the company and not with Queen Victoria; when the British refused, more than forty of the captives were killed in a ritual, and later reports said they had been eaten. On 22 February a Royal Navy force, which had left Brass two days earlier, attacked and burnt Nembe, and many more people died in a smallpox epidemic that followed. Koko escaped. The inquiry of Sir John Kirk, published in 1896, confirmed the killings but also upheld many of Nembe’s complaints against the company. Koko refused the settlement offered and died in hiding in 1898. Criticism of the company after Akassa contributed to the revocation of its charter in 1899; on 1 January 1900 its territories passed to the British crown.
: Ett anfall som kungariket Nembe, även kallat Brass, riktade mot Royal Niger Company i Nigerdeltat, och den brittiska vedergällning som följde. Nembe var en ijawisk handelsstat på deltats östra sida, sedan 1884 inom det brittiska Oil Rivers-protektoratet. Royal Niger Company, som från 1886 hade ett brittiskt privilegiebrev över Niger, använde sina regler och licenser för att behålla flodhandeln för sig självt och stänga ute köpmännen från Nembe, som i generationer hade handlat med palmolja på marknaderna i inlandet. I januari 1895 ledde kung Frederick William Koko, som nyligen hade avsagt sig kristendomen, mer än tusen man i omkring 22 krigskanoter mot kompaniets högkvarter i Akassa, vid floden Nuns mynning. I gryningen den 29 januari förstörde de dess lagerhus, kontor och maskiner, dödade ett antal av dess afrikanska arbetare och förde omkring 70 fångar med sig tillbaka till Nembe. Koko erbjöd sig att byta ut dem mot ett återupprättande av den fria handeln och skrev att hans tvist gällde kompaniet och inte drottning Viktoria; när britterna vägrade dödades mer än fyrtio av fångarna i en ritual, och senare rapporter uppgav att de hade ätits. Den 22 februari anföll och brände en styrka ur Royal Navy, som hade lämnat Brass två dagar tidigare, Nembe, och många fler människor dog i en smittkoppsepidemi som följde. Koko kom undan. Sir John Kirks utredning, som publicerades 1896, bekräftade dödandet men gav också Nembe rätt i många av dess klagomål mot kompaniet. Koko avvisade den uppgörelse som erbjöds och dog i gömsle 1898. Kritiken mot kompaniet efter Akassa bidrog till att dess privilegiebrev återkallades 1899; den 1 januari 1900 övergick dess territorier till den brittiska kronan.
