# Svenska översättningar av katalogtexten (våg 12); stegtexterna kommer senare.
Al-Shabaab insurgency: Al-Shabaabs uppror
? The war of al-Shabaab, a Somali jihadist movement allied to al-Qaeda since 2012, against Somalia’s internationally backed governments, African Union peacekeepers, Kenya, Ethiopia and the United States. After the Ethiopian withdrawal in January 2009 al-Shabaab held most of southern and central Somalia and fought the government for Mogadishu, until African Union troops drove it out of the city in August 2011, the year a famine killed some 258,000 people in its areas and beyond. Kenyan and Ethiopian forces then entered Somalia, and by 2014 the African Union mission (AMISOM) and the Somali army had taken the main towns, including Kismayo and Barawe. Al-Shabaab fell back to the countryside, which it still largely governs and taxes, and fought on with ambushes, assaults on African Union bases and bombings in Mogadishu, among them the truck bomb of 14 October 2017 that killed 587 people, and in Uganda and Kenya, at the Westgate mall in Nairobi (2013) and Garissa University (2015). A government offensive with clan militias in 2022–2023 retook parts of central Somalia, but al-Shabaab won most of them back in 2025. A smaller branch of the Islamic State fights in Puntland. In late 2026 the war continues alongside a deep political crisis in Mogadishu.
: Det krig som al-Shabaab, en somalisk jihadiströrelse allierad med al-Qaida sedan 2012, för mot Somalias internationellt stödda regeringar, Afrikanska unionens fredsbevarande styrkor, Kenya, Etiopien och USA. Efter det etiopiska tillbakadragandet i januari 2009 behärskade al-Shabaab större delen av södra och centrala Somalia och stred mot regeringen om Mogadishu, tills Afrikanska unionens trupper drev ut rörelsen ur staden i augusti 2011, samma år som en hungersnöd dödade omkring 258 000 människor i dess områden och utanför dem. Kenyanska och etiopiska styrkor gick därefter in i Somalia, och 2014 hade Afrikanska unionens mission (AMISOM) och den somaliska armén intagit de viktigaste städerna, bland dem Kismayo och Barawe. Al-Shabaab drog sig tillbaka till landsbygden, som rörelsen fortfarande till stor del styr och beskattar, och fortsatte kampen med bakhåll, anfall mot Afrikanska unionens baser och bombattentat i Mogadishu, bland dem lastbilsbomben den 14 oktober 2017 som dödade 587 människor, samt i Uganda och Kenya, vid köpcentret Westgate i Nairobi (2013) och universitetet i Garissa (2015). En regeringsoffensiv tillsammans med klanmiliser 2022–2023 återtog delar av centrala Somalia, men al-Shabaab vann tillbaka de flesta av dem 2025. En mindre gren av Islamiska staten strider i Puntland. I slutet av 2026 pågår kriget samtidigt som Mogadishu befinner sig i en djup politisk kris.
