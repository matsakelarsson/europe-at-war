# Svenska översättningar av katalogtexten (våg 12); stegtexterna kommer senare.
Alaouite rise to power: Alawiternas väg till makten
? The wars in which Moulay al-Rashid, a prince of the Alaouite sharifs of Tafilalt, reunited Morocco after the fall of the Saadians and founded the dynasty that still reigns. By 1659, when the last Saadian sultan was murdered, the country was divided between the Dila’iyya, a Sufi lodge of the Middle Atlas whose leader had been proclaimed sultan in Fez; the war leader al-Khadir Ghailan in the north-west; the Shabana Arabs in Marrakesh; the Semlali lords of Iligh in the Sous; the corsair town of Salé; and the Alaouites of Tafilalt under Muhammad ibn Sharif. Al-Rashid, who had refused to accept his half-brother Muhammad and fled, built a following around Taza and the east, and in August 1664 Muhammad was killed fighting him at Angad. Al-Rashid then took Sijilmasa (1665) and Fez (June 1666), defeated Ghailan, destroyed the zawiya of Dila (June 1668), took Marrakesh (July 1668) and subdued the Sous (1670). He died in Marrakesh in April 1672 after a fall from his horse, and his half-brother Moulay Ismail succeeded him.
: De krig genom vilka Moulay al-Rashid, en prins av de alawitiska shariferna i Tafilalt, återförenade Marocko efter saadiernas fall och grundade den dynasti som fortfarande regerar. År 1659, när den siste saadiske sultanen mördades, var landet delat mellan Dila’iyya, ett sufiskt brödraskap i Mellersta Atlas vars ledare hade utropats till sultan i Fès; krigsledaren al-Khadir Ghailan i nordväst; shabana-araberna i Marrakech; semlali-furstarna av Iligh i Sous; korsarstaden Salé; och alawiterna i Tafilalt under Muhammad ibn Sharif. Al-Rashid, som hade vägrat att erkänna sin halvbror Muhammad och flytt, samlade en anhängarskara kring Taza och i öster, och i augusti 1664 stupade Muhammad i strid mot honom vid Angad. Därefter intog al-Rashid Sijilmasa (1665) och Fès (juni 1666), besegrade Ghailan, förstörde zawiyan i Dila (juni 1668), intog Marrakech (juli 1668) och underkuvade Sous (1670). Han dog i Marrakech i april 1672 efter ett fall från hästen, och hans halvbror Moulay Ismail efterträdde honom.
