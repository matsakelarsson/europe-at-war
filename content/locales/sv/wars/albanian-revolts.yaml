Albanian revolts of 1910–1912: Albanska upproren 1910–1912
A series of risings in the Albanian lands of the Ottoman Empire against the Young Turk government’s centralising policies, taxes, conscription and disarmament campaigns – in Kosovo in 1910, crushed by an Ottoman army that burned villages and closed Albanian schools; among the Catholic highlanders of Malësia in 1911; and in a general revolt in 1912, when the rebels took Skopje. On 4 September 1912 the government accepted most of the rebels’ demands, a settlement overtaken weeks later by the First Balkan War.: En serie resningar i Osmanska rikets albanska områden mot ungturkregeringens centraliseringspolitik, skatter, utskrivningar och avväpningskampanjer – i Kosovo 1910, då upproret slogs ned av en osmansk armé som brände byar och stängde albanska skolor; bland de katolska bergsborna i Malësia 1911; och i ett allmänt uppror 1912, då rebellerna intog Skopje. Den 4 september 1912 godtog regeringen de flesta av rebellernas krav, en uppgörelse som några veckor senare kördes över av första Balkankriget.
