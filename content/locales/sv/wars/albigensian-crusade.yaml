Simon turned on Raymond VI himself, whom the legates had excommunicated again. He failed to take Toulouse in 1211, but by 1212 he held most of the county outside the city. King Peter II of Aragon, fresh from the great victory over the Almohads at Las Navas de Tolosa, was overlord of many of the southern lords and Raymond’s brother-in-law, and he crossed the Pyrenees to defend them. In September 1213 he and Raymond, with the counts of Foix and Comminges, were besieging the little town of Muret when Simon slipped in with his knights. On 12 September they charged out, Peter was killed in the mêlée, and the southern army broke; many men drowned in the Garonne.: Simon vände sig mot Raimond VI själv, som legaterna åter hade bannlyst. Han misslyckades med att inta Toulouse 1211, men 1212 behärskade han större delen av grevskapet utanför staden. Kung Peter II av Aragonien, som just hade vunnit den stora segern över almohaderna vid Las Navas de Tolosa, var länsherre över många av de sydfranska herrarna och Raimonds svåger, och han gick över Pyrenéerna för att försvara dem. I september 1213 belägrade han och Raimond, tillsammans med grevarna av Foix och Comminges, den lilla staden Muret när Simon tog sig in i den med sina riddare. Den 12 september gjorde de ett utfall, Peter dödades i tumultet och den sydfranska armén bröts; många män drunknade i Garonne.
In 1215 the Fourth Lateran Council gave Raymond’s lands to Simon. But Raymond and his son, the future Raymond VII, came back. In 1216 the young Raymond took Beaucaire on the Rhône and held it against Simon, and in September 1217 Raymond VI was welcomed back into Toulouse. Simon besieged the city for nine months. On 25 June 1218, as he went to help his wounded brother, he was killed by a stone from a siege engine, worked, says the Song of the crusade, by the ladies, girls and women of Toulouse. His son Amaury lifted the siege a month later.: År 1215 gav fjärde Laterankonciliet Raimonds länder till Simon. Men Raimond och hans son, den blivande Raimond VII, återvände. År 1216 intog den unge Raimond Beaucaire vid Rhône och höll staden mot Simon, och i september 1217 välkomnades Raimond VI tillbaka i Toulouse. Simon belägrade staden i nio månader. Den 25 juni 1218, när han skyndade till sin sårade brors hjälp, dödades han av en sten från en belägringsmaskin som enligt Sången om korståget sköttes av Toulouses damer, flickor och kvinnor. Hans son Amaury hävde belägringen en månad senare.
