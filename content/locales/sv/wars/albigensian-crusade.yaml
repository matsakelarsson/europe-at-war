The king’s crusade and the Treaty of Paris: Kungens korståg och freden i Paris
The Cathars, whom their enemies called Albigensians after the town of Albi, held that the material world was the work of an evil principle and rejected the Catholic Church and its sacraments; their leaders, the perfects, were known to their followers as good men and good women. How organised and widespread the movement was is debated by historians.: Katarerna, som deras fiender kallade albigenser efter staden Albi, ansåg att den materiella världen var ett verk av en ond princip och förkastade den katolska kyrkan och dess sakrament; deras ledare, de fullkomliga, kallades av sina anhängare goda män och goda kvinnor. Hur organiserad och utbredd rörelsen var är omstritt bland historiker.
The chief sources are the crusade’s chronicler Peter of Vaux-de-Cernay, the Song of the Albigensian Crusade (in Occitan, its first part by a pro-crusade author and its second by a southern one) and William of Puylaurens.: De viktigaste källorna är korstågets krönikör Pierre des Vaux-de-Cernay, Sången om albigenserkorståget (på occitanska; dess första del skrevs av en korstågsvänlig författare och den andra av en sydfransk) och Guillaume de Puylaurens.
