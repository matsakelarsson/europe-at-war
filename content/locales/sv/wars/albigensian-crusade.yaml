In the towns and castles of Languedoc many people followed the Cathars, and local lords, among them Count Raymond VI of Toulouse, tolerated them. On 14 January 1208 the papal legate Pierre de Castelnau was murdered near Saint-Gilles by a man thought to be in Raymond’s service, and Pope Innocent III called a crusade, promising the crusaders the lands of heretics and their protectors. Raymond did public penance at Saint-Gilles and joined the crusade himself, so the army of northern barons that left Lyon on 24 June 1209 turned against his nephew, Raymond-Roger Trencavel, viscount of Béziers and Carcassonne.: I Languedocs städer och borgar följde många människor katarerna, och lokala herrar, bland dem greve Raimond VI av Toulouse, tolererade dem. Den 14 januari 1208 mördades den påvlige legaten Pierre de Castelnau nära Saint-Gilles av en man som troddes stå i Raimonds tjänst, och påven Innocentius III utlyste ett korståg och lovade korsfararna kättarnas och deras beskyddares länder. Raimond gjorde offentlig bot i Saint-Gilles och anslöt sig själv till korståget, så den armé av nordfranska baroner som lämnade Lyon den 24 juni 1209 vände sig i stället mot hans systerson Raimond-Roger Trencavel, vicegreve av Béziers och Carcassonne.
On 22 July, after a sortie by the defenders, the crusaders’ camp followers broke into Béziers and the army sacked it, killing men, women and children, many of them in the churches where they had taken refuge. The legates told the pope that almost 20,000 died, surely an exaggeration. A generation later a German monk put in the mouth of the abbot Arnaud Amalric the words “Kill them all; God will know his own.” Carcassonne was besieged from 1 August; Trencavel was seized while negotiating, and the city surrendered on 15 August. Simon de Montfort, a baron from near Paris, took his lands. At Minerve in 1210 and Lavaur in 1211 hundreds of Cathars were burned.: Den 22 juli, efter ett utfall av försvararna, bröt sig korsfararnas tross in i Béziers, och armén plundrade staden och dödade män, kvinnor och barn, många av dem i kyrkorna där de hade sökt skydd. Legaterna meddelade påven att nästan 20 000 dog, säkert en överdrift. En generation senare lade en tysk munk orden ”Döda dem alla; Gud känner de sina” i munnen på abboten Arnaud Amalric. Carcassonne belägrades från den 1 augusti; Trencavel greps under förhandlingar, och staden kapitulerade den 15 augusti. Simon de Montfort, en baron från trakten av Paris, tog hans länder. I Minerve 1210 och Lavaur 1211 brändes hundratals katarer.
