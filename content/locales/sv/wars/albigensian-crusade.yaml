In 1219 Prince Louis of France led an army south and took Marmande, where the crusaders massacred the townspeople, but he failed before Toulouse. Raymond VI died in 1222, and his son Raymond VII and the count of Foix won back most of the south; in 1224 Amaury de Montfort gave up Carcassonne and ceded his claims to the crown. In 1226 Louis, now King Louis VIII, came again with a royal crusade down the Rhône. Avignon, an imperial city, closed its gates and was besieged from 10 June until it surrendered on 9 September, and most of Languedoc submitted without a fight. On the way home Louis died of dysentery at Montpensier on 8 November.: År 1219 ledde prins Ludvig av Frankrike en armé söderut och intog Marmande, där korsfararna massakrerade invånarna, men han misslyckades framför Toulouse. Raimond VI dog 1222, och hans son Raimond VII och greven av Foix vann tillbaka större delen av södern; 1224 gav Amaury de Montfort upp Carcassonne och överlät sina anspråk till kronan. År 1226 kom Ludvig, nu kung Ludvig VIII, tillbaka med ett kungligt korståg längs Rhône. Avignon, en kejserlig stad, stängde sina portar och belägrades från den 10 juni tills den kapitulerade den 9 september, och större delen av Languedoc underkastade sig utan strid. På hemvägen dog Ludvig i dysenteri i Montpensier den 8 november.
The royal commander Humbert de Beaujeu kept up the war, laying waste the country around Toulouse, until Raymond VII made peace. By the Treaty of Paris, agreed at Meaux and sealed in Paris on 12 April 1229, the day Raymond did penance at Notre-Dame, he kept Toulouse for life but gave up his eastern lands to the crown, and his daughter Joan was to marry Alphonse, a brother of Louis IX, with the rest of the county to pass to them. When both died childless in 1271, it went to the crown. The Inquisition, set up in the early 1230s, hunted the remaining Cathars; in 1244 more than 200 were burned after the fall of their fortress of Montségur.: Den kunglige befälhavaren Humbert de Beaujeu fortsatte kriget och ödelade trakten kring Toulouse, tills Raimond VII slöt fred. Genom freden i Paris, som avtalades i Meaux och beseglades i Paris den 12 april 1229, samma dag som Raimond gjorde bot i Notre-Dame, fick han behålla Toulouse på livstid men avstod sina östra länder till kronan, och hans dotter Johanna skulle gifta sig med Alfons, en bror till Ludvig IX, varvid resten av grevskapet skulle övergå till dem. När båda dog barnlösa 1271 tillföll det kronan. Inkvisitionen, som inrättades i början av 1230-talet, jagade de återstående katarerna; 1244 brändes mer än 200 av dem sedan deras fästning Montségur hade fallit.
