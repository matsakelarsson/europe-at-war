Short of water and crowded with refugees, the city surrendered after two weeks. Its people were allowed to leave with only the clothes they wore. Trencavel died in his own prison that November.: Med ont om vatten och full av flyktingar kapitulerade staden efter två veckor. Invånarna fick lämna den med bara de kläder de bar. Trencavel dog i sitt eget fängelse i november samma år.
