Albigensian Crusade: Albigenserkorståget
A crusade called by Pope Innocent III against the Cathar heretics of Languedoc and the southern lords who tolerated them. Northern French barons led by Simon de Montfort massacred Béziers and took the lands of the Trencavel family and most of the County of Toulouse, but the southerners fought back, and only the royal crusade of Louis VIII forced Count Raymond VII to accept the Treaty of Paris in 1229, which brought Languedoc under the French crown.: Ett korståg som påven Innocentius III utlyste mot katarerna, kättarna i Languedoc, och de sydfranska herrar som tolererade dem. Nordfranska baroner under Simon de Montfort massakrerade Béziers och tog släkten Trencavels länder och större delen av grevskapet Toulouse, men sydfransmännen slog tillbaka, och först Ludvig VIII:s kungliga korståg tvingade greve Raimond VII att godta freden i Paris 1229, som förde Languedoc under den franska kronan.
