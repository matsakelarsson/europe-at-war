# Svenska översättningar av katalogtexten (våg 14); stegtexterna kommer senare.
Aleutian Islands campaign: Fälttåget på Aleuterna
? The fight for the western Aleutian Islands of Alaska, then a US territory, during the Second World War. In June 1942, as part of the operation against Midway, Japanese carrier aircraft bombed the US base at Dutch Harbor on 3 and 4 June, and Japanese troops landed unopposed on Kiska on 6 June and on Attu on 7 June, the only US soil in the Americas occupied by a foreign enemy during the war. The Attu villagers were taken to Japan as prisoners, and the US government removed nearly 900 Unangax̂ (Aleut) people from their island villages to camps in southeast Alaska, where many died. Through the following year US and Canadian aircraft bombed the islands from bases built westward along the chain, at Adak and Amchitka, and US ships and submarines cut the Japanese supply lines; after the naval Battle of the Komandorski Islands on 26 March 1943 Japan supplied the garrisons only by submarine. In May 1943 the US 7th Infantry Division retook Attu in nearly three weeks of fighting in fog, snow and mud, ending in a mass charge by the last Japanese troops on 29 May; nearly the whole garrison of about 2,600 died. In late July Japanese ships evacuated the 5,000-man garrison of Kiska under cover of fog, unseen, and when 34,000 US and Canadian troops landed there on 15 August they found the island empty. From Attu and Shemya US aircraft raided Japan’s Kuril Islands until the end of the war.
: Striderna om de västra Aleuterna i Alaska, då ett amerikanskt territorium, under andra världskriget. I juni 1942, som en del av operationen mot Midway, bombade japanska hangarfartygsplan den amerikanska basen i Dutch Harbor den 3 och 4 juni, och japanska trupper landsteg utan motstånd på Kiska den 6 juni och på Attu den 7 juni, den enda del av USA:s territorium på den amerikanska kontinenten som ockuperades av en utländsk fiende under kriget. Byborna på Attu fördes som fångar till Japan, och den amerikanska regeringen flyttade bort nästan 900 unangax̂ (aleuter) från deras öbyar till läger i sydöstra Alaska, där många dog. Under det följande året bombade amerikanska och kanadensiska flygplan öarna från baser som byggdes allt längre västerut längs ökedjan, på Adak och Amchitka, och amerikanska fartyg och ubåtar skar av de japanska försörjningslinjerna; efter sjöslaget vid Kommendörsöarna den 26 mars 1943 försörjde Japan garnisonerna enbart med ubåtar. I maj 1943 återtog den amerikanska 7:e infanteridivisionen Attu efter nästan tre veckors strider i dimma, snö och lera, som slutade med en massanstormning av de sista japanska soldaterna den 29 maj; nästan hela garnisonen på omkring 2 600 man dog. I slutet av juli evakuerade japanska fartyg i skydd av dimman, utan att upptäckas, Kiskas garnison på 5 000 man, och när 34 000 amerikanska och kanadensiska soldater landsteg där den 15 augusti fann de ön tom. Från Attu och Shemya genomförde amerikanska flygplan räder mot de japanska Kurilerna fram till krigsslutet.
