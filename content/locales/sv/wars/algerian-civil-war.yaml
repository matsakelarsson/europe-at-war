# Svenska översättningar av katalogtexten (våg 12); stegtexterna kommer senare.
Algerian Civil War: Algeriska inbördeskriget
? "The war between the Algerian state and armed Islamist groups that followed the army’s cancellation of the elections of 1991–1992, known in Algeria as the black decade. After riots in October 1988 ended the FLN’s single-party rule, the Islamic Salvation Front (FIS) won local elections in 1990 and the first round of parliamentary elections on 26 December 1991. On 11 January 1992 the army forced President Chadli Bendjedid to resign, cancelled the second round, banned the FIS and interned thousands of its members in desert camps. Armed groups took to the mountains and the suburbs: the Islamic Salvation Army (AIS), loyal to the FIS, fought the security forces, while the more radical Armed Islamic Group (GIA) killed police and soldiers, officials, journalists, intellectuals, foreigners and finally villagers by the hundreds, above all in the massacres of 1997–1998 around Algiers and in the west. The security forces answered with torture, summary executions and thousands of disappearances, and armed village militias. The AIS declared a truce in 1997, President Abdelaziz Bouteflika’s Civil Concord of 1999 offered amnesty to fighters who surrendered, and the killing of the GIA’s leader Antar Zouabri in February 2002 is usually taken as the end of the war, though the GSPC fought on. Algerian officials gave about 150,000 dead, a figure of 200,000 is often cited, and some researchers estimate far fewer; several thousand people disappeared."
: "Kriget mellan den algeriska staten och väpnade islamistiska grupper som följde på att armén ogiltigförklarade valen 1991–1992, i Algeriet kallat det svarta årtiondet. Sedan upplopp i oktober 1988 hade gjort slut på FLN:s enpartistyre vann Islamiska frälsningsfronten (FIS) lokalvalen 1990 och första omgången av parlamentsvalet den 26 december 1991. Den 11 januari 1992 tvingade armén president Chadli Bendjedid att avgå, ställde in den andra omgången, förbjöd FIS och internerade tusentals av dess medlemmar i läger i öknen. Väpnade grupper gick upp i bergen och ut i förorterna: Islamiska frälsningsarmén (AIS), som var lojal mot FIS, bekämpade säkerhetsstyrkorna, medan den mer radikala Väpnade islamiska gruppen (GIA) dödade poliser och soldater, tjänstemän, journalister, intellektuella, utlänningar och till slut bybor i hundratal, framför allt i massakrerna 1997–1998 kring Alger och i väster. Säkerhetsstyrkorna svarade med tortyr, summariska avrättningar och tusentals försvinnanden, och de beväpnade bymiliser. AIS utlyste vapenvila 1997, president Abdelaziz Bouteflikas lag om medborgerlig samdräkt 1999 erbjöd amnesti åt kämpar som gav upp, och att GIA:s ledare Antar Zouabri dödades i februari 2002 brukar räknas som krigets slut, även om GSPC fortsatte att strida. Algeriska myndigheter uppgav omkring 150 000 döda, en siffra på 200 000 anges ofta, och vissa forskare gör betydligt lägre uppskattningar; flera tusen människor försvann."
