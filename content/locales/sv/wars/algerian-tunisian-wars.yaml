# Svenska översättningar av katalogtexten (våg 12); stegtexterna kommer senare.
Wars between Algiers and Tunis: Krigen mellan Alger och Tunis
A series of wars between the two Ottoman regencies of Algiers and Tunis, nominal vassals of the same sultan, fought over their border, over tribute and over Tunis’s ruling families. An earlier war, in 1628, had ended with a treaty fixing the border along the Mellègue. In 1694 an Algerian army took Tunis for a rival claimant, until a revolt brought the Muradid bey back in 1695; in 1705 another Algerian invasion captured the bey Ibrahim Sharif at El Kef, but the officer Husayn ibn Ali held Tunis and founded the Husainid dynasty. Algiers backed Husayn’s nephew Ali Pasha against him in 1735, and in 1756 helped Husayn’s sons overthrow Ali Pasha, storming and sacking Tunis; for half a century afterwards Tunis paid tribute to Algiers. In 1807 Hammouda Pasha refused to pay, failed to take Constantine but beat the Algerian counter-invasion near El Kef, ending Tunis’s dependence. Fighting flared again in 1811 and 1813 before a peace at the end of 1813.: En serie krig mellan de två osmanska regentskapen Alger och Tunis, nominellt vasaller under samme sultan, som utkämpades om gränsen, om tribut och om Tunis härskarsläkter. Ett tidigare krig 1628 hade slutat med ett fördrag som drog gränsen längs Mellègue. År 1694 intog en algerisk armé Tunis åt en rivaliserande tronpretendent, tills ett uppror förde tillbaka den muraditiske bejen 1695; 1705 tillfångatog en ny algerisk invasionsarmé bejen Ibrahim Sharif vid El Kef, men officeren Husayn ibn Ali höll Tunis och grundade husainiddynastin. Alger stödde Husayns brorson Ali pasha mot honom 1735 och hjälpte 1756 Husayns söner att störta Ali pasha, varvid Tunis stormades och plundrades; under ett halvt sekel därefter betalade Tunis tribut till Alger. År 1807 vägrade Hammouda pasha att betala; han misslyckades med att inta Constantine men slog tillbaka den algeriska motinvasionen nära El Kef och gjorde därmed slut på Tunis beroende. Striderna blossade upp igen 1811 och 1813, innan fred slöts i slutet av 1813.
