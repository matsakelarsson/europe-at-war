Algerian War: Algerietkriget
? The war of independence fought by Algeria’s National Liberation Front (FLN) against French rule. It began with coordinated attacks on 1 November 1954 and became a guerrilla war in the countryside and a campaign of bombings in the cities, as in the Battle of Algiers in 1957. The French counter-insurgency made wide use of torture, summary executions and the forced resettlement of some two million villagers, and the FLN also killed many civilians, Algerian and European. The war brought down the Fourth Republic in 1958 and returned Charles de Gaulle to power, and it reached France itself, where the Paris police killed dozens of Algerian demonstrators on 17 October 1961, by some estimates as many as two hundred. After a failed army putsch in Algiers in April 1961 and a campaign of bombings and murders by the OAS, a secret army opposed to independence, the Évian Accords brought a ceasefire on 19 March 1962, and Algeria became independent on 5 July. Some 900,000 Europeans, the pieds-noirs, left for France within months, and many thousands of harkis, Algerians who had served with the French army, were killed. Estimates of the Algerian dead range from a few hundred thousand to the 1.5 million of official Algerian figures; about 25,000 French soldiers died.
: Det självständighetskrig som Algeriets nationella befrielsefront (FLN) förde mot det franska styret. Det inleddes med samordnade attacker den 1 november 1954 och blev ett gerillakrig på landsbygden och en bombkampanj i städerna, som i slaget om Alger 1957. Den franska upprorsbekämpningen använde i stor omfattning tortyr, summariska avrättningar och tvångsförflyttning av omkring två miljoner bybor, och även FLN dödade många civila, både algerier och européer. Kriget fällde fjärde republiken 1958 och förde Charles de Gaulle tillbaka till makten, och det nådde också Frankrike, där Parispolisen den 17 oktober 1961 dödade dussintals algeriska demonstranter, enligt vissa uppskattningar så många som tvåhundra. Efter en misslyckad armékupp i Alger i april 1961 och en kampanj av bombdåd och mord från OAS, en hemlig armé som motsatte sig självständigheten, gav Évianavtalen vapenvila den 19 mars 1962, och Algeriet blev självständigt den 5 juli. Omkring 900 000 européer, så kallade pieds-noirs, lämnade landet för Frankrike inom några månader, och många tusen harkis, algerier som hade tjänstgjort i den franska armén, dödades. Uppskattningarna av antalet algeriska döda varierar från några hundra tusen till de officiella algeriska siffrornas 1,5 miljoner; omkring 25 000 franska soldater dog.
