? The war of independence fought by Algeria’s National Liberation Front (FLN) and its army, the ALN, against French rule. Algeria, conquered from 1830, was governed as part of France, with a million settlers of European descent and some nine million Muslim Algerians who had few political rights. After the bloody repression of the Sétif and Guelma rising in May 1945 and years of blocked reform, the FLN began the war with coordinated attacks on 1 November 1954. It became a guerrilla war in the mountains and a campaign of bombings and assassinations in the cities, as in the Battle of Algiers in 1957. France sent some 400,000 soldiers, most of them conscripts, sealed the borders with Tunisia and Morocco with electrified barriers, moved more than two million villagers into camps and made wide use of torture and summary executions; the FLN killed many civilians, European and Algerian, and fought a bitter war with its rival, the MNA. The crisis brought down the Fourth Republic in May 1958 and returned Charles de Gaulle to power. His army all but defeated the ALN inside Algeria, but he turned towards self-determination, survived an army putsch in April 1961 and the bombings of the OAS, a secret army of settlers and officers, and signed the Évian Accords, which brought a ceasefire on 19 March 1962. Algeria voted for independence on 1 July and celebrated it on 5 July 1962. Some 900,000 Europeans, the pieds-noirs, left for France within months, and tens of thousands of harkis, Algerians who had served with the French army, were killed. Estimates of the Algerian dead range from about 300,000 to the 1.5 million of official Algerian figures; about 25,000 French soldiers died.
: Det självständighetskrig som Algeriets Nationella befrielsefront (FLN) och dess armé, ALN, förde mot det franska styret. Algeriet, som erövrades från 1830, styrdes som en del av Frankrike, med en miljon nybyggare av europeiskt ursprung och omkring nio miljoner muslimska algerier som hade få politiska rättigheter. Efter det blodiga undertryckandet av resningen i Sétif och Guelma i maj 1945 och år av blockerade reformer inledde FLN kriget med samordnade anfall den 1 november 1954. Det blev ett gerillakrig i bergen och en kampanj av bombattentat och mord i städerna, som i slaget om Alger 1957. Frankrike sände omkring 400 000 soldater, de flesta av dem värnpliktiga, spärrade gränserna mot Tunisien och Marocko med elektrifierade hinder, flyttade mer än två miljoner bybor till läger och använde i stor utsträckning tortyr och summariska avrättningar; FLN dödade många civila, både européer och algerier, och förde ett bittert krig mot sin rival MNA. Krisen fällde fjärde republiken i maj 1958 och förde Charles de Gaulle tillbaka till makten. Hans armé besegrade ALN nästan helt inne i Algeriet, men han svängde mot självbestämmande, överlevde en militärkupp i april 1961 och bombdåden från OAS, en hemlig armé av nybyggare och officerare, och undertecknade Évianavtalen, som ledde till vapenvila den 19 mars 1962. Algeriet röstade för självständighet den 1 juli och firade den den 5 juli 1962. Omkring 900 000 européer, pieds-noirs, reste till Frankrike inom några månader, och tiotusentals harkier, algerier som hade tjänat i den franska armén, dödades. Uppskattningarna av antalet döda algerier sträcker sig från omkring 300 000 till de 1,5 miljoner som officiella algeriska siffror anger; omkring 25 000 franska soldater dog.
