Algiers Expedition: Expeditionen mot Alger
? Emperor Charles V’s attempt to take Algiers, the corsair base ruled for the Ottomans by Hasan Agha, Hayreddin Barbarossa’s deputy. Charles sailed late in the year, against the advice of his admiral Andrea Doria, with a fleet of over 500 sails gathered at Majorca and some 24,000 German, Spanish and Italian soldiers, joined by Knights of Malta; Hernán Cortés, the conqueror of Mexico, came as a volunteer. The army landed east of the city on 23 October, but on the night of 24–25 October a violent storm drenched the troops’ powder, wrecked many ships on the shore and allowed the defenders to make a fierce sortie, held off at the Bab Azoun gate largely by the knights. Doria gathered what was left of the fleet at Cape Matifou, and the army re-embarked and sailed to Spanish Bougie, from where Charles left for Spain in late November. About 150 ships were lost, with many soldiers and sailors, and so many were taken prisoner that slaves were said to be sold in Algiers for almost nothing. The defeat left the corsairs of Algiers secure for the rest of the century.
: Kejsar Karl V:s försök att inta Alger, den korsarbas som Hasan Agha, Hayreddin Barbarossas ställföreträdare, styrde för osmanernas räkning. Karl seglade sent på året, mot sin amiral Andrea Dorias råd, med en flotta på över 500 segel som samlats vid Mallorca och omkring 24 000 tyska, spanska och italienska soldater, förstärkta av malteserriddare; Hernán Cortés, Mexikos erövrare, följde med som frivillig. Armén landsteg öster om staden den 23 oktober, men natten mellan den 24 och 25 oktober dränkte en våldsam storm truppernas krut, kastade många fartyg upp på stranden och gav försvararna tillfälle till ett häftigt utfall, som vid porten Bab Azoun hejdades främst av riddarna. Doria samlade det som återstod av flottan vid Kap Matifou, och armén gick åter ombord och seglade till spanska Bougie, varifrån Karl reste till Spanien i slutet av november. Omkring 150 fartyg gick förlorade, med många soldater och sjömän, och så många togs till fånga att slavar sades säljas i Alger för nästan ingenting. Nederlaget gjorde Algers korsarer trygga under resten av århundradet.
