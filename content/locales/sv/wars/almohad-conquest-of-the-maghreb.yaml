# Svenska översättningar av katalogtexten (våg 12); stegtexterna kommer senare.
Almohad conquest of the Maghreb: Almohadernas erövring av Maghreb
? The rise of the Almohads (al-Muwahhidun, “those who affirm the unity of God”), a religious movement founded among the Masmuda Berbers of the High Atlas by the preacher Ibn Tumart, and their conquest of North Africa from the Atlantic to Tripolitania. Proclaimed the Mahdi in 1121, Ibn Tumart made the mountain village of Tinmel his base and waged war on the Almoravids, whom he accused of corrupting Islam; his first attack on Marrakesh was crushed at al-Buhayra in 1130, and he died a few months later. His successor Abd al-Mu’min, a Zenata from near Tlemcen, fought his way along the mountains for years, broke the Almoravid army near Tlemcen and Oran in 1144–1145, took Fez in 1146 and Marrakesh in 1147, and crushed a great revolt with mass executions. He then turned east, ending the Hammadid kingdom at Bougie in 1152, defeating the Arab tribes at Sétif in 1153 and, in 1159–1160, taking Tunis and driving the Normans of Sicily from Mahdia. For the first time the whole Maghreb was united under one ruler, a Berber dynasty that also held al-Andalus.
: Framväxten av almohaderna (al-Muwahhidun, ”de som bekänner Guds enhet”), en religiös rörelse som predikanten Ibn Tumart grundade bland masmudaberberna i Höga Atlas, och deras erövring av Nordafrika från Atlanten till Tripolitanien. Ibn Tumart, som utropades till mahdi 1121, gjorde bergsbyn Tinmel till sin bas och förde krig mot almoraviderna, som han anklagade för att fördärva islam; hans första anfall mot Marrakech krossades vid al-Buhayra 1130, och han dog några månader senare. Hans efterträdare Abd al-Mu’min, en zenata från trakten av Tlemcen, kämpade sig under flera år fram längs bergen, krossade den almoravidiska armén nära Tlemcen och Oran 1144–1145, intog Fès 1146 och Marrakech 1147 och slog ned ett stort uppror med massavrättningar. Därefter vände han sig österut, gjorde slut på hammadidernas kungarike vid Bougie 1152, besegrade de arabiska stammarna vid Sétif 1153 och intog 1159–1160 Tunis och fördrev Siciliens normander från Mahdia. För första gången var hela Maghreb förenat under en enda härskare, en berberdynasti som även behärskade al-Andalus.
