# Svenska översättningar av katalogtexten (våg 12); stegtexterna kommer senare.
Almoravid conquest of the Maghreb: Almoravidernas erövring av Maghreb
The rise of the Almoravids (al-Murabitun), a movement of religious reform among the veiled Sanhaja Berbers of the western Sahara, and their conquest of what is now Morocco and western Algeria. Brought to the Gudala and Lamtuna tribes by the Maliki scholar Abdallah ibn Yasin in the 1040s, the movement took the caravan cities at both ends of the western Saharan trade in 1054–1055, Sijilmasa in the north and Awdaghust in the south. Under the Lamtuna chiefs Yahya ibn Umar and Abu Bakr ibn Umar it conquered the Sous, Aghmat (1058) and the Barghawata of the Atlantic plains, whose own faith it stamped out; Ibn Yasin was killed fighting them in 1059. Abu Bakr founded Marrakesh and went back to the desert, leaving the north to his cousin Yusuf ibn Tashfin, who took Fez from its Zenata emirs (1069–1075), then Tangier, Tlemcen and Algiers, and in 1083 Ceuta on the Strait. The Almoravids ruled from the Senegal to the Mediterranean, and in 1086 they crossed into al-Andalus at the call of its Muslim kings.: Framväxten av almoraviderna (al-Murabitun), en religiös reformrörelse bland de beslöjade sanhajaberberna i västra Sahara, och deras erövring av det som i dag är Marocko och västra Algeriet. Rörelsen, som den malikitiske lärde Abdallah ibn Yasin förde till gudala- och lamtunastammarna på 1040-talet, intog 1054–1055 karavanstäderna i båda ändarna av den västsahariska handeln, Sijilmasa i norr och Awdaghust i söder. Under lamtunahövdingarna Yahya ibn Umar och Abu Bakr ibn Umar erövrade den Sous, Aghmat (1058) och barghawata på slätterna vid Atlantkusten, vars egen tro den utrotade; Ibn Yasin stupade i strid mot dem 1059. Abu Bakr grundade Marrakech och återvände till öknen och lämnade norr åt sin kusin Yusuf ibn Tashfin, som tog Fès från dess zenataemirer (1069–1075), därefter Tanger, Tlemcen och Alger och 1083 Ceuta vid Gibraltarsundet. Almoraviderna härskade från Senegalfloden till Medelhavet, och 1086 gick de över till al-Andalus på uppmaning av dess muslimska kungar.
