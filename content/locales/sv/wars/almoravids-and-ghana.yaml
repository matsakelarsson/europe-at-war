# Svenska översättningar av katalogtexten (våg 12); stegtexterna kommer senare.
The Almoravids and Ghana: Almoraviderna och Ghana
? The contacts and conflict between the Almoravid movement of the western Sahara and the Soninke kingdom of Ghana in the Sahel, and the long debate about whether the Almoravids conquered Ghana in 1076. What is certain is that in 1054–1055 the Almoravids sacked Awdaghust, a Saharan trading town that recognised the king of Ghana. Al-Bakri, writing in 1068, describes Ghana under its kings Bassi and Tunka Manin as rich and powerful, with a royal town and a Muslim merchants’ town with twelve mosques, Muslim officials at court and a king who kept the old religion; Tunka Manin is said to have corresponded with Yusuf ibn Tashfin. Hints in later Arabic writers, above all Ibn Khaldun, gave rise to the long-held view that the Almoravids conquered Ghana in 1076–1077 and forced its people to convert. In 1982 David Conrad and Humphrey Fisher argued that this conquest was largely a misreading of the sources; others accept that Almoravid pressure and agitation weakened Ghana, and archaeology at Koumbi Saleh, the site most often identified with the capital, shows no sign of a sudden destruction. Ghana’s rulers did become Muslim around this time, and in 1154 al-Idrisi described the country as Muslim and its capital as the greatest town of the Sudan.
: Kontakterna och konflikten mellan almoravidrörelsen i västra Sahara och soninkernas kungarike Ghana i Sahel, och den långa debatten om huruvida almoraviderna erövrade Ghana 1076. Säkert är att almoraviderna 1054–1055 plundrade Awdaghust, en handelsstad i Sahara som erkände Ghanas kung som sin överherre. Al-Bakri, som skrev 1068, beskriver Ghana under kungarna Bassi och Tunka Manin som rikt och mäktigt, med en kunglig stad och en stad för muslimska köpmän med tolv moskéer, muslimska ämbetsmän vid hovet och en kung som höll fast vid den gamla religionen; Tunka Manin sägs ha brevväxlat med Yusuf ibn Tashfin. Antydningar hos senare arabiska författare, framför allt Ibn Khaldun, gav upphov till den länge rådande uppfattningen att almoraviderna erövrade Ghana 1076–1077 och tvingade dess folk att konvertera. År 1982 hävdade David Conrad och Humphrey Fisher att denna erövring till stor del byggde på en feltolkning av källorna; andra medger att almoravidiskt tryck och agitation försvagade Ghana, och arkeologin i Koumbi Saleh, den plats som oftast identifieras med huvudstaden, visar inga tecken på en plötslig förstörelse. Ghanas härskare blev visserligen muslimer vid denna tid, och 1154 beskrev al-Idrisi landet som muslimskt och dess huvudstad som den största staden i Sudan.
