# Svenska översättningar av katalogtexten (våg 9); stegtexterna kommer senare.
Altan Khan’s wars with the Ming: Altan khans krig mot Mingriket
"Four decades of raiding on the northern frontier of Ming China by Altan Khan (1507/08–1582), ruler of the Tümed Mongols and leader of the right wing of the Eastern Mongols, who wanted regular trade and tribute relations with China and was repeatedly refused. His horsemen raided Shanxi, the Ordos frontier and the region of Beijing almost every year; in 1542 they plundered the country around Taiyuan, and in the autumn of 1550, in the Gengxu incident, they broke through the wall at Gubeikou and burned the suburbs of Beijing for three days while the Ming armies stayed behind the walls. Horse markets opened in 1551 were closed again within a year. Peace came in 1570–1571, after Altan’s grandson defected to the Ming: in April 1571 the Longqing Emperor named Altan Shunyi Wang (Obedient and Righteous Prince), and regular markets on the frontier kept the peace with the western Mongols for decades.": "Fyra decennier av räder mot Mingrikets norra gräns under Altan khan (1507/08–1582), härskare över tümedmongolerna och ledare för östmongolernas högra flygel, som ville ha regelbundna handels- och tributförbindelser med Kina och gång på gång fick avslag. Hans ryttare plundrade Shanxi, Ordosgränsen och trakten kring Peking nästan varje år; 1542 plundrade de landet kring Taiyuan, och hösten 1550, under Gengxuincidenten, bröt de igenom muren vid Gubeikou och brände Pekings förstäder i tre dagar medan Mingarméerna stannade bakom murarna. Hästmarknader som öppnades 1551 stängdes igen inom ett år. Freden kom 1570–1571, sedan Altans sonson hade gått över till Ming: i april 1571 utnämnde Longqingkejsaren Altan till Shunyi wang (”den lydige och rättrådige fursten”), och regelbundna marknader vid gränsen bevarade freden med västmongolerna i årtionden."
