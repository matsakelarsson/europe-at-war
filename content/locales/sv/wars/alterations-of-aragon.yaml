Alterations of Aragon: Oroligheterna i Aragonien
The rising in Zaragoza in 1591 over Antonio Pérez, Philip II’s fallen secretary, who had escaped from prison in Castile in April 1590 and claimed the protection of Aragon’s laws. When the king turned to the Inquisition, which those laws could not block, crowds in Zaragoza freed Pérez from its custody on 24 May and again on 24 September 1591; the king’s representative, the Marquis of Almenara, was mortally wounded in the first riot, and more than thirty people died in the second. The Justicia of Aragon, Juan de Lanuza, declared the coming of a Castilian army a breach of the kingdom’s liberties and called out its men, but only about 2,000 answered. A royal army of some 14,000 under Alonso de Vargas entered Zaragoza unopposed on 12 November, Pérez fled to France, and on 20 December Lanuza was beheaded in the market square without trial. Other leaders were executed or died in prison. In 1592 the Cortes of Tarazona kept Aragon’s laws and institutions but gave the crown more power over them.: Resningen i Zaragoza 1591 kring Antonio Pérez, Filip II:s fallne sekreterare, som i april 1590 hade rymt ur fängelset i Kastilien och åberopat Aragoniens lagars skydd. När kungen vände sig till inkvisitionen, som dessa lagar inte kunde stoppa, befriade folkmassor i Zaragoza Pérez ur dess förvar den 24 maj och på nytt den 24 september 1591; kungens representant, markisen av Almenara, sårades dödligt i det första upploppet, och mer än trettio människor dog i det andra. Aragoniens justitia, Juan de Lanuza, förklarade att en kastiliansk armés ankomst bröt mot kungarikets friheter och kallade ut dess män, men bara omkring 2 000 hörsammade kallelsen. En kunglig armé på omkring 14 000 man under Alonso de Vargas ryckte in i Zaragoza utan motstånd den 12 november, Pérez flydde till Frankrike, och den 20 december halshöggs Lanuza på torget utan rättegång. Andra ledare avrättades eller dog i fängelse. År 1592 behöll cortes i Tarazona Aragoniens lagar och institutioner men gav kronan större makt över dem.
