Ambela campaign: Ambelafälttåget
A British Indian expedition on the North-West Frontier in 1863 against the community of Indian mujahideen at Malka, beyond the border of British territory, followers of the movement of Sayyid Ahmad Barelvi whom the British called the “Hindustani Fanatics”, and the Pashtun tribes who backed them. About 6,000 troops under Brigadier-General Neville Chamberlain marched into the Ambela (Umbeyla) pass in October, intending to cross Buner. The Bunerwals, joined by Swatis rallied by the Akhund of Swat and by other tribes, some 15,000 men in all, rose and pinned the force in the pass for weeks; the Crag Picquet changed hands several times, and Chamberlain was badly wounded. Reinforced and under Major-General John Garvock, the British broke out in mid-December, and the Buner elders agreed to destroy Malka themselves, which a party escorted by British officers burned on 23 December. British casualties were some 900 to 1,000 killed and wounded.: En brittisk-indisk expedition vid nordvästgränsen 1863 mot gemenskapen av indiska mujahedin i Malka, bortom gränsen till brittiskt territorium – anhängare av Sayyid Ahmad Barelvis rörelse, som britterna kallade ”de hindustanska fanatikerna” – och de pashtunska stammar som stödde dem. Omkring 6 000 soldater under brigadgeneral Neville Chamberlain marscherade i oktober in i Ambelapasset (Umbeyla) med avsikt att ta sig över Buner. Bunerwalerna, förstärkta av swatier som Akhund av Swat hade samlat och av andra stammar, sammanlagt omkring 15 000 man, reste sig och höll fast styrkan i passet i flera veckor; Crag Picquet bytte ägare flera gånger, och Chamberlain sårades svårt. Förstärkta och under befäl av generalmajor John Garvock bröt sig britterna ut i mitten av december, och de äldste i Buner gick med på att själva förstöra Malka, som en grupp eskorterad av brittiska officerare brände den 23 december. De brittiska förlusterna uppgick till omkring 900 till 1 000 dödade och sårade.
