# Svenska översättningar av katalogtexten (våg 11); stegtexterna kommer senare.
Ambon wars (Great Ambon War): Ambonkrigen (Stora Ambonkriget)
? The war in which the Dutch East India Company (VOC) completed its monopoly of cloves in the central Moluccas by crushing the Muslim communities of Hoamoal, the western peninsula of Seram, and their allies on the nearby islands. Hoamoal, the main clove-growing area outside Company control, was ruled for the sultan of Ternate by a governor (kimelaha), and Makassar (Gowa) traders bought its cloves in defiance of the Company. In 1650 a court faction in Ternate drove out Sultan Mandar Syah, whom the VOC restored; the kimelaha Majira sided with the rebels, and in 1651 the Hoamoal villages and allied communities on the neighbouring islands rose, killing Company soldiers and Christian Ambonese and attacking VOC posts. Arnold de Vlaming van Oudshoorn, sent from Batavia, fought them from 1651 to 1656. In 1652 he made Mandar Syah cede Ternate’s rights in Hoamoal and agree to the destruction of all clove trees outside Ambon and the Lease islands, in return for a yearly payment. Makassar sent fleets and troops to Hoamoal in 1653–1655. De Vlaming’s campaign of 1654–1655 destroyed villages, crops and clove groves; the stronghold of Asahudi fell in July 1655, and on 6 August 1655 his troops took a hill fort in the Kalike mountains, where the Ternatean prince Kaicili Saidi was captured and killed. Majira escaped to Makassar. The war ended in early 1656, when news reached Ambon of a peace between the VOC and Makassar. The surviving people of Hoamoal were moved to Ambon and its neighbouring islands, the peninsula was left almost empty, and clove growing was confined to Company-controlled Ambon and the Lease islands.
: Kriget där Nederländska ostindiska kompaniet (VOC) fullbordade sitt kryddnejlikemonopol i mellersta Moluckerna genom att krossa de muslimska samhällena i Hoamoal, Serams västra halvö, och deras bundsförvanter på de närbelägna öarna. Hoamoal, det viktigaste kryddnejlikeodlande området utanför kompaniets kontroll, styrdes för Ternatesultanens räkning av en guvernör (kimelaha), och handelsmän från Makassar (Gowa) köpte dess kryddnejlikor i trots mot kompaniet. År 1650 drev en hovfraktion i Ternate ut sultan Mandar Syah, som VOC återinsatte; kimelahan Majira ställde sig på rebellernas sida, och 1651 reste sig Hoamoals byar och allierade samhällen på grannöarna, dödade kompanisoldater och kristna ambonesier och anföll VOC:s posteringar. Arnold de Vlaming van Oudshoorn, som sändes från Batavia, bekämpade dem från 1651 till 1656. År 1652 fick han Mandar Syah att avträda Ternates rättigheter i Hoamoal och gå med på att alla kryddnejliketräd utanför Ambon och Leaseöarna skulle förstöras, mot en årlig ersättning. Makassar sände flottor och trupper till Hoamoal 1653–1655. De Vlamings fälttåg 1654–1655 förstörde byar, grödor och kryddnejlikelundar; fästet Asahudi föll i juli 1655, och den 6 augusti 1655 intog hans trupper ett bergsfort i Kalikebergen, där den ternatiske prinsen Kaicili Saidi tillfångatogs och dödades. Majira flydde till Makassar. Kriget tog slut i början av 1656, när nyheten om en fred mellan VOC och Makassar nådde Ambon. Hoamoals överlevande befolkning flyttades till Ambon och dess grannöar, halvön lämnades nästan tom, och kryddnejlikeodlingen begränsades till det kompanikontrollerade Ambon och Leaseöarna.
