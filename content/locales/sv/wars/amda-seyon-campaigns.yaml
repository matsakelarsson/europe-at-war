# Svenska översättningar av katalogtexten (våg 12); stegtexterna kommer senare.
Amda Seyon’s campaigns against Ifat and its allies: Amda Seyons fälttåg mot Ifat och dess allierade
Wars of the Ethiopian emperor Amda Seyon I (r. 1314–1344) against the Muslim sultanate of Ifat and the states of the south and east that made the Solomonic kingdom the leading power of the Horn of Africa. After campaigns against Damot and Hadiya in 1316–1317, Amda Seyon invaded Ifat when its sultan Haqq ad-Din I had his envoy, returning from Mamluk Cairo, put to death. In 1332 Haqq ad-Din’s brother Sabr ad-Din rose against him, joined by Hadiya and Dawaro, and the Muslims of Adal and Mora under the religious leader Salih joined in. In a long campaign told in the chronicle known as the Glorious Victories of Amda Seyon, the emperor defeated them one after another, installed a succession of Walashma princes in Ifat as his vassals, and extended his overlordship over Dawaro, Hadiya, Bale and the lands across the Awash. Arab writers of the time, among them al-Umari, list seven Muslim states in the region, all paying tribute to the Christian king.: Den etiopiske kejsaren Amda Seyon I:s (reg. 1314–1344) krig mot det muslimska sultanatet Ifat och staterna i söder och öster, som gjorde det salomoniska riket till den ledande makten på Afrikas horn. Efter fälttåg mot Damot och Hadiya 1316–1317 invaderade Amda Seyon Ifat sedan dess sultan Haqq ad-Din I hade låtit döda kejsarens sändebud, som var på väg hem från det mamlukiska Kairo. År 1332 reste sig Haqq ad-Dins bror Sabr ad-Din mot kejsaren med stöd av Hadiya och Dawaro, och muslimerna i Adal och Mora under den religiöse ledaren Salih anslöt sig. Under ett långt fälttåg, som skildras i krönikan känd som Amda Seyons ärorika segrar, besegrade Amda Seyon dem en efter en, insatte en rad furstar av walashmadynastin i Ifat som sina vasaller och utsträckte sitt överherredöme över Dawaro, Hadiya, Bale och länderna bortom Awash. Samtida arabiska författare, bland dem al-Umari, räknar upp sju muslimska stater i regionen, som alla betalade tribut till den kristne kungen.
