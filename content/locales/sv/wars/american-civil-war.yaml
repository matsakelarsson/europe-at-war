# Svenska översättningar av katalogtexten (våg 14); stegtexterna kommer senare.
American Civil War: Amerikanska inbördeskriget
? The war between the United States (the Union) and the Confederate States of America, formed by eleven Southern slave states that seceded to preserve slavery after Abraham Lincoln, who opposed its spread into the western territories, was elected president in 1860. It began with the Confederate bombardment of Fort Sumter on 12 April 1861. The Union, with more than twice the population and most of the country’s industry, railways and ships, blockaded the Southern coast, took the Mississippi Valley in 1862–1863 and split the Confederacy in two, while Robert E. Lee’s Army of Northern Virginia defended Richmond and twice invaded the North, to be turned back at Antietam (1862) and Gettysburg (1863). Lincoln’s Emancipation Proclamation of 1 January 1863 made the end of slavery a Union war aim, and about 179,000 Black soldiers, most of them formerly enslaved, served in the Union army. Ulysses S. Grant’s Overland Campaign of 1864 pinned Lee at Petersburg, William T. Sherman took Atlanta and marched to the sea, and Lee surrendered at Appomattox on 9 April 1865; the last Confederate forces surrendered in May and June. The war was fought also in the Far West and in Indian Territory, where the Cherokee, Muscogee and Seminole nations divided between the two sides. An estimated 620,000 to 750,000 soldiers died, more than in any other American war. The Thirteenth Amendment of December 1865 abolished slavery throughout the United States, freeing about four million people.
: Kriget mellan USA (unionen) och Amerikas konfedererade stater, som bildades av elva slavstater i Södern som utträdde ur unionen för att bevara slaveriet sedan Abraham Lincoln, som motsatte sig dess spridning till de västra territorierna, hade valts till president 1860. Det började med Konfederationens bombardemang av Fort Sumter den 12 april 1861. Unionen, med mer än dubbelt så stor befolkning och större delen av landets industri, järnvägar och fartyg, blockerade sydstatskusten, tog Mississippidalen 1862–1863 och klöv Konfederationen i två delar, medan Robert E. Lees Army of Northern Virginia försvarade Richmond och två gånger invaderade nordstaterna, men slogs tillbaka vid Antietam (1862) och Gettysburg (1863). Lincolns emancipationsproklamation den 1 januari 1863 gjorde slaveriets avskaffande till ett av unionens krigsmål, och omkring 179 000 svarta soldater, de flesta av dem tidigare förslavade, tjänstgjorde i unionsarmén. Ulysses S. Grants Overlandfälttåg 1864 band Lee vid Petersburg, William T. Sherman intog Atlanta och marscherade till havet, och Lee kapitulerade vid Appomattox den 9 april 1865; de sista konfedererade styrkorna kapitulerade i maj och juni. Kriget utkämpades också i Fjärran västern och i Indianterritoriet, där cherokesernas, muscogeernas och seminolernas nationer splittrades mellan de två sidorna. Uppskattningsvis 620 000 till 750 000 soldater dog, fler än i något annat amerikanskt krig. Det trettonde tillägget till konstitutionen i december 1865 avskaffade slaveriet i hela USA och befriade omkring fyra miljoner människor.
