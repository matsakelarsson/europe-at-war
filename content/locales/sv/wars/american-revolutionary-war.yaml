# Svenska översättningar av katalogtexten (våg 14); stegtexterna kommer senare.
American Revolutionary War: Amerikanska frihetskriget
? The war in which thirteen of Britain’s North American colonies won their independence as the United States. Quarrels over taxation and self-government after the Seven Years’ War turned to fighting at Lexington and Concord on 19 April 1775. The Continental Congress made George Washington commander of a Continental Army, the colonies declared independence on 4 July 1776, and an American invasion of Canada failed. Britain took New York in 1776 and Philadelphia in 1777, but the surrender of John Burgoyne’s army at Saratoga in October 1777 brought France into the war in 1778, followed by Spain in 1779 and the Dutch Republic in 1780, which made it a world war fought from the Caribbean to India. The Haudenosaunee (Iroquois) Confederacy split, most of its nations fighting for Britain and the Oneida and Tuscarora for the Americans, and the war on the frontier destroyed towns on both sides. Britain then turned to the South, taking Savannah and Charleston, and promised freedom to enslaved people who escaped from rebel owners; tens of thousands did. After a hard campaign in the Carolinas, Charles Cornwallis was besieged at Yorktown by American and French armies and a French fleet and surrendered on 19 October 1781. The Treaty of Paris of 3 September 1783 recognised the United States, with a western boundary on the Mississippi, and in a treaty signed the same day Britain returned Florida to Spain; Britain’s Native allies were not mentioned in it, and some 60,000 Loyalists left the new republic.
: "Det krig genom vilket tretton av Storbritanniens nordamerikanska kolonier vann sin självständighet som Amerikas förenta stater. Tvister om beskattning och självstyre efter sjuårskriget övergick i strider vid Lexington och Concord den 19 april 1775. Kontinentalkongressen gjorde George Washington till befälhavare för en kontinentalarmé, kolonierna förklarade sig självständiga den 4 juli 1776, och en amerikansk invasion av Kanada misslyckades. Storbritannien intog New York 1776 och Philadelphia 1777, men kapitulationen av John Burgoynes armé vid Saratoga i oktober 1777 förde in Frankrike i kriget 1778, följt av Spanien 1779 och Nederländska republiken 1780, vilket gjorde det till ett världskrig som utkämpades från Karibien till Indien. Haudenosauneeförbundet (irokesförbundet) splittrades: de flesta av dess nationer stred för Storbritannien och oneida och tuscarora för amerikanerna, och kriget vid gränsen förstörde byar och orter på båda sidor. Storbritannien vände sig sedan mot Södern, intog Savannah och Charleston och lovade frihet åt förslavade som flydde från rebelliska ägare; tiotusentals gjorde det. Efter ett hårt fälttåg i North och South Carolina belägrades Charles Cornwallis i Yorktown av amerikanska och franska arméer och en fransk flotta och kapitulerade den 19 oktober 1781. Freden i Paris den 3 september 1783 erkände USA, med en västgräns vid Mississippi, och i ett fördrag som undertecknades samma dag återlämnade Storbritannien Florida till Spanien; Storbritanniens ursprungsamerikanska allierade nämndes inte i fördraget, och omkring 60 000 lojalister lämnade den nya republiken."
