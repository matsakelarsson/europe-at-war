# Svenska översättningar av katalogtexten (våg 11); stegtexterna kommer senare.
Anawrahta’s wars: Anawrahtas krig
The wars by which Anawrahta, king of Pagan from 1044 to 1077, made his small kingdom in the dry zone of Upper Burma the first state to rule the whole Irrawaddy valley. According to the Burmese chronicles he seized the throne by killing King Sokkate in 1044, and in 1057 his armies took Thaton, the Mon city on the Gulf of Martaban, after a three-month siege, bringing its king Manuha, its monks, scriptures and artisans to Pagan; Pegu became his vassal. He received the submission of chiefs in the eastern hills, marched to the gates of Dali in Yunnan, guarded the plains with a line of 43 forts (1061), raided Arakan and drove a Khmer army out of Tenasserim. He sent help to Vijayabahu I of Sri Lanka against the Cholas, and monks to restore the Buddhist ordination there. Historians accept the outline of his rule, which the inscriptions confirm, but treat many chronicle stories as later legends; whether the conquest of Thaton happened as told, and how much it changed Pagan, is disputed.: De krig genom vilka Anawrahta, kung av Pagan 1044–1077, gjorde sitt lilla rike i Övre Burmas torrzon till den första stat som behärskade hela Irrawaddydalen. Enligt de burmesiska krönikorna tog han tronen genom att döda kung Sokkate 1044, och 1057 intog hans arméer efter en tre månader lång belägring Thaton, monernas stad vid Martabanbukten, och förde dess kung Manuha, dess munkar, skrifter och hantverkare till Pagan; Pegu blev hans vasall. Han tog emot hövdingarnas underkastelse i de östra bergen, tågade fram till Dalis portar i Yunnan, skyddade slättlandet med en linje av 43 fort (1061), gjorde räder i Arakan och drev en khmerarmé ut ur Tenasserim. Han sände hjälp till Vijayabahu I av Sri Lanka mot Cholariket och munkar för att återupprätta munkvigningen där. Historikerna godtar huvuddragen i hans regering, som inskrifterna bekräftar, men betraktar många av krönikornas berättelser som senare legender; om erövringen av Thaton gick till så som det berättas, och hur mycket den förändrade Pagan, är omstritt.
