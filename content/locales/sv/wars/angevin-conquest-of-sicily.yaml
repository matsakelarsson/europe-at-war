The popes regarded the Kingdom of Sicily, which took in both the island and the mainland south of the Papal States, as a fief of the Holy See. Charles ruled the whole kingdom until the Sicilian Vespers of 1282; on the map it keeps its name, Kingdom of Sicily.: Påvarna betraktade kungariket Sicilien, som omfattade både ön och fastlandet söder om Kyrkostaten, som ett len under den heliga stolen. Karl styrde hela kungariket fram till den sicilianska aftonsången 1282; på kartan behåller det namnet Kungariket Sicilien.
Charles was Count of Anjou and, through his wife Beatrice, Count of Provence. His army was largely French and Provençal, and was paid for with loans from Tuscan bankers guaranteed by the papacy and with church taxes raised as for a crusade.: Karl var greve av Anjou och, genom sin hustru Beatrice, greve av Provence. Hans armé var till stor del fransk och provensalsk och finansierades med lån från toskanska bankirer, garanterade av påvedömet, och med kyrkoskatter som togs ut som för ett korståg.
