Charles’s rule and his French officials were soon resented, and the Ghibellines called on Conradin, Frederick II’s fifteen-year-old grandson and the last legitimate Hohenstaufen, to claim his inheritance. He crossed the Alps in the autumn of 1267 and was welcomed at Verona, Pavia and Pisa. Revolts broke out in the south. The Saracens of Lucera rose, and exiles landed in Sicily with troops from Tunis, where much of the island declared for Conradin. On 24 July 1268 he entered Rome in triumph, received by its senator, Henry of Castile, a Castilian prince who had fallen out with Charles.: Karls styre och hans franska ämbetsmän väckte snart förbittring, och ghibellinerna kallade på Konradin, Fredrik II:s femtonårige sonson och den siste legitime stauferen, för att han skulle göra anspråk på sitt arv. Han gick över Alperna hösten 1267 och välkomnades i Verona, Pavia och Pisa. Revolter bröt ut i söder. Saracenerna i Lucera gjorde uppror, och landsflyktingar landsteg på Sicilien med trupper från Tunis, varpå stora delar av ön tog ställning för Konradin. Den 24 juli 1268 höll han ett triumfartat intåg i Rom, där han togs emot av stadens senator, Henrik av Kastilien, en kastiliansk prins som hade blivit osams med Karl.
On 23 August 1268 Conradin’s army met Charles’s smaller force on the Palentine plain near Tagliacozzo, in the Abruzzi. The Ghibellines routed Charles’s first lines and scattered to plunder his camp. Charles, who on the advice of the veteran crusader Érard de Valéry had kept a reserve hidden behind a hill, then fell on them and destroyed them. Conradin fled towards the coast and was betrayed and captured at Torre Astura. After a trial he was beheaded in the market square of Naples on 29 October 1268, with his friend Frederick of Baden. Lucera surrendered in August 1269, and the rising in Sicily was crushed with great cruelty; at Augusta the people were massacred.: Den 23 augusti 1268 mötte Konradins armé Karls mindre styrka på den palentinska slätten nära Tagliacozzo i Abruzzerna. Ghibellinerna slog Karls främre linjer på flykten och skingrades för att plundra hans läger. Karl, som på inrådan av den erfarne korsfararen Érard de Valéry hade hållit en reserv dold bakom en kulle, föll då över dem och förintade dem. Konradin flydde mot kusten men blev förrådd och tillfångatagen vid Torre Astura. Efter en rättegång halshöggs han på torget i Neapel den 29 oktober 1268 tillsammans med sin vän Fredrik av Baden. Lucera kapitulerade i augusti 1269, och resningen på Sicilien slogs ned med stor grymhet; i Augusta massakrerades invånarna.
