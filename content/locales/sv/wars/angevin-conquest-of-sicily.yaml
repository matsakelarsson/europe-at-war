The popes feared the Hohenstaufen hold on both the Empire and the Kingdom of Sicily. After Frederick II’s death his son Manfred, at first regent for his young nephew Conradin, took the Sicilian crown himself in 1258 and backed the Ghibellines across Italy. The French pope Urban IV offered the kingdom to Charles of Anjou, brother of Louis IX of France and Count of Provence, and his successor Clement IV confirmed the grant. Charles reached Rome by sea in May 1265, and on 6 January 1266 cardinals crowned him King of Sicily in St Peter’s, while his army, which had come over the Alps and through Lombardy that winter, joined him.: Påvarna fruktade staufernas grepp om både kejsarriket och kungariket Sicilien. Efter Fredrik II:s död tog hans son Manfred, som först var förmyndare för sin unge brorson Konradin, själv den sicilianska kronan 1258 och stödde ghibellinerna i hela Italien. Den franske påven Urban IV erbjöd kungariket åt Karl av Anjou, bror till Ludvig IX av Frankrike och greve av Provence, och hans efterträdare Clemens IV bekräftade förläningen. Karl nådde Rom sjövägen i maj 1265, och den 6 januari 1266 krönte kardinaler honom till kung av Sicilien i Peterskyrkan, medan hans armé, som under vintern hade tågat över Alperna och genom Lombardiet, förenade sig med honom.
In February Charles crossed into the kingdom at Ceprano, where the bridge over the Liri had been left undefended, and stormed San Germano below Montecassino. Manfred chose to fight before more of his barons went over. On 26 February 1266, on the plain outside Benevento, his German knights and Saracen archers from Lucera at first drove back the French, but Charles’s men-at-arms, told to strike at the horses, broke the German cavalry, and many of Manfred’s barons left the field. Manfred rode into the fighting and was killed. Benevento was sacked, Manfred’s wife and children were imprisoned, and Charles entered Naples on 7 March.: I februari gick Karl in i kungariket vid Ceprano, där bron över Liri hade lämnats oförsvarad, och stormade San Germano nedanför Montecassino. Manfred valde att strida innan fler av hans baroner gick över till fienden. Den 26 februari 1266, på slätten utanför Benevento, drev hans tyska riddare och saracenska bågskyttar från Lucera först tillbaka fransmännen, men Karls tungt rustade ryttare, som beordrats att hugga mot hästarna, bröt det tyska kavalleriet, och många av Manfreds baroner lämnade slagfältet. Manfred red in i striden och dödades. Benevento plundrades, Manfreds hustru och barn fängslades, och Karl tågade in i Neapel den 7 mars.
