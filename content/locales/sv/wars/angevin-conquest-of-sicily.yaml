Angevin conquest of the Kingdom of Sicily: Angevinernas erövring av kungariket Sicilien
The conquest of the Hohenstaufen Kingdom of Sicily by Charles of Anjou, brother of Louis IX of France, invited by the popes to take it from Frederick II’s heirs. Charles defeated and killed King Manfred at Benevento in 1266 and beat Manfred’s nephew Conradin at Tagliacozzo in 1268, after which Conradin was beheaded in Naples and the risings in his favour were crushed.: Erövringen av staufernas kungarike Sicilien av Karl av Anjou, bror till Ludvig IX av Frankrike, som påvarna bjudit in för att ta det från Fredrik II:s arvingar. Karl besegrade och dödade kung Manfred vid Benevento 1266 och slog Manfreds brorson Konradin vid Tagliacozzo 1268, varefter Konradin halshöggs i Neapel och resningarna till hans förmån slogs ned.
