Anglo-Aro War: Kriget mellan Storbritannien och Aro
? The British conquest of the Aro Confederacy in what is now south-eastern Nigeria. The Aro, an Igbo people centred on Arochukwu, had built from the 17th century a network of trading settlements across Igboland and the Cross River region, held together by the prestige of their oracle, Ibini Ukpabi, which Europeans called the Long Juju, and by alliances with warrior communities such as Abam, Ohafia and Edda. Pilgrims came to the oracle from far and wide to settle disputes, and many of those it condemned were sold into slavery, making the Aro the leading suppliers of captives to the coastal ports during the Atlantic slave trade and of slaves to the region afterwards. As British rule spread inland from the coast in the 1890s, the Aro saw their trade, their influence and their oracle threatened by British officials, merchants and missionaries, and they and their allies attacked communities that had accepted British protection. After the Aro sacked Obegu, a British ally, in November 1901, the Southern Nigeria Protectorate sent four columns of about 1,550 soldiers and 2,100 carriers under Lieutenant-Colonel Arthur Montanaro converging on Arochukwu. They took the town on 28 December 1901 after four days of fighting and destroyed the oracle’s shrine; the last major Aro resistance was broken at Bende in March 1902. The Aro Confederacy collapsed, but resistance to British rule in Igboland went on for years.
: Den brittiska erövringen av Arokonfederationen i det som i dag är sydöstra Nigeria. Aro, ett igbofolk med centrum i Arochukwu, hade från 1600-talet byggt upp ett nätverk av handelsbosättningar över igbolandet och Cross River-området, sammanhållet av prestigen hos deras orakel, Ibini Ukpabi, som européerna kallade Long Juju, och av allianser med krigarsamhällen som Abam, Ohafia och Edda. Pilgrimer kom till oraklet från när och fjärran för att få tvister avgjorda, och många av dem som det dömde såldes som slavar, vilket gjorde aro till de främsta leverantörerna av fångar till kusthamnarna under den atlantiska slavhandeln och av slavar till regionen därefter. När det brittiska styret på 1890-talet spred sig inåt landet från kusten såg aro sin handel, sitt inflytande och sitt orakel hotade av brittiska tjänstemän, köpmän och missionärer, och de och deras bundsförvanter anföll samhällen som hade godtagit brittiskt beskydd. Sedan aro i november 1901 hade plundrat Obegu, en brittisk bundsförvant, sände protektoratet Sydnigeria fyra kolonner med omkring 1 550 soldater och 2 100 bärare under överstelöjtnant Arthur Montanaro, som från olika håll ryckte fram mot Arochukwu. De intog staden den 28 december 1901 efter fyra dagars strider och förstörde orakelns helgedom; det sista större motståndet från aro bröts vid Bende i mars 1902. Arokonfederationen föll samman, men motståndet mot det brittiska styret i igbolandet fortsatte i flera år.
