# Svenska översättningar av katalogtexten (våg 14); stegtexterna kommer senare.
Anglo-Cherokee War: Engelsk-cherokesiska kriget
? A war between the Cherokee and the British colonies of South Carolina, Virginia and North Carolina, backed by British regular troops, during the French and Indian War. The Cherokee had been Britain’s allies, and hundreds of their warriors served against the French in 1758, but Virginia frontiersmen killed some 30 to 40 of them on their way home, and their kin took revenge on the frontier as Cherokee law required. Governor William Henry Lyttelton of South Carolina seized Cherokee peace envoys as hostages in 1759; in February 1760 Oconostota besieged Fort Prince George, and after its commander was killed the garrison put the hostages to death. In 1760 the Cherokee raided the Carolina backcountry, turned back a British army under Archibald Montgomery at Echoe, and starved Fort Loudoun into surrender, killing many of its garrison as they marched away. In 1761 a larger army under James Grant fought its way into the Middle towns and burned some fifteen to eighteen towns and their crops, leaving thousands of Cherokee facing famine. Attakullakulla led the Cherokee to peace in treaties with Virginia and South Carolina at the end of 1761.
: Ett krig mellan cherokeserna och de brittiska kolonierna South Carolina, Virginia och North Carolina, med stöd av brittiska reguljära trupper, under fransk-indianska kriget. Cherokeserna hade varit Storbritanniens allierade, och hundratals av deras krigare stred mot fransmännen 1758, men gränsbor från Virginia dödade omkring 30 till 40 av dem på hemvägen, och deras anhöriga tog hämnd vid gränsen så som cherokesisk lag krävde. Guvernör William Henry Lyttelton av South Carolina tog cherokesiska fredssändebud som gisslan 1759; i februari 1760 belägrade Oconostota Fort Prince George, och sedan fortets befälhavare hade dödats avrättade garnisonen gisslan. År 1760 gjorde cherokeserna räder i Carolinas inland, drev tillbaka en brittisk armé under Archibald Montgomery vid Echoe och svalt ut Fort Loudoun till kapitulation, varvid de dödade många ur dess garnison när den marscherade bort. År 1761 kämpade sig en större armé under James Grant in bland de mellersta byarna (Middle towns) och brände omkring femton till arton byar och deras grödor, så att tusentals cherokeser stod inför svält. Attakullakulla ledde cherokeserna till fred genom fördrag med Virginia och South Carolina i slutet av 1761.
