# Svenska översättningar av katalogtexten (våg 12); stegtexterna kommer senare.
Anglo-Egyptian conquest of Darfur: Den anglo-egyptiska erövringen av Darfur
The conquest of the Sultanate of Darfur, the last independent state in what is now Sudan, by the Anglo-Egyptian government of Sudan during the First World War. Sultan Ali Dinar of the Keira dynasty had restored the sultanate after the fall of the Mahdist State in 1898 and paid a yearly tribute to Khartoum. In 1915, after the Ottoman sultan called for holy war against the Allies, he renounced his allegiance and made contact with the Ottomans through the Senussi in Libya. The governor-general, Reginald Wingate, sent about 2,000 men under Lieutenant-Colonel Philip Kelly, supported by four aircraft of the Royal Flying Corps. They crossed into Darfur on 16 March 1916, defeated the Fur army at Beringia on 22 May and entered El Fasher the next day. Ali Dinar fled to Jebel Marra and the west, and on 6 November 1916 a small force under Major Hubert Huddleston found him at Jebel Juba, where he was shot dead. Darfur was annexed to Anglo-Egyptian Sudan.: Erövringen av Darfursultanatet, den sista självständiga staten i nuvarande Sudan, som Sudans anglo-egyptiska regering genomförde under första världskriget. Sultan Ali Dinar av keiradynastin hade återupprättat sultanatet efter mahdiststatens fall 1898 och betalade en årlig tribut till Khartoum. År 1915, sedan den osmanske sultanen hade utlyst heligt krig mot de allierade, avsade han sig sin trohet och tog kontakt med osmanerna genom senussierna i Libyen. Generalguvernören Reginald Wingate sände omkring 2 000 man under överstelöjtnant Philip Kelly, understödda av fyra flygplan från Royal Flying Corps. De gick in i Darfur den 16 mars 1916, besegrade furernas armé vid Beringia den 22 maj och tågade in i El Fasher dagen därpå. Ali Dinar flydde till Jebel Marra och västerut, och den 6 november 1916 fann en liten styrka under major Hubert Huddleston honom vid Jebel Juba, där han sköts ihjäl. Darfur annekterades av Anglo-egyptiska Sudan.
