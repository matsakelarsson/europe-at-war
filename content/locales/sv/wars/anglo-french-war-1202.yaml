Philip’s side of the story was told by his chaplain William the Breton, who also wrote a long poem on the king’s deeds; on John’s side the main sources are English chroniclers such as Roger of Wendover, who disliked him. Numbers at Bouvines are uncertain; modern estimates give each army between about 6,000 and 9,000 men.: Filips version av händelserna berättades av hans kaplan Guillaume le Breton, som också skrev en lång dikt om kungens bedrifter; på Johans sida är huvudkällorna engelska krönikörer som Roger of Wendover, som ogillade honom. Styrkorna vid Bouvines är osäkra; moderna uppskattningar ger vardera armén mellan omkring 6 000 och 9 000 man.
