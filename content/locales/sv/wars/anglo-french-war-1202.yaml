Taken by Philip II, 1204–1205: Intaget av Filip II 1204–1205
John spent years raising money and allies to win back his lands. In 1213 Philip prepared to invade England, but on 30–31 May an English fleet under William Longespée, earl of Salisbury, caught the French fleet at Damme in Flanders with most of its crews ashore, captured some 300 ships and burned about 100 more. John then joined a coalition with his nephew, the Emperor Otto IV, Count Ferrand of Flanders, Count Renaud of Boulogne and princes of the Low Countries. The plan was to attack from two sides. John landed at La Rochelle in February 1214, won over some Poitevin lords and crossed into Anjou, but when Prince Louis came to relieve the castle of La Roche-aux-Moines on 2 July, the Poitevins would not fight and John retreated.: Johan ägnade flera år åt att samla pengar och allierade för att vinna tillbaka sina länder. År 1213 förberedde Filip en invasion av England, men den 30–31 maj överraskade en engelsk flotta under William Longespée, earl av Salisbury, den franska flottan vid Damme i Flandern med större delen av besättningarna i land, erövrade omkring 300 fartyg och brände ungefär 100 till. Johan gick sedan in i en koalition med sin systerson kejsar Otto IV, greve Ferrand av Flandern, greve Renaud av Boulogne och furstar i Nederländerna. Planen var att anfalla från två håll. Johan landsteg i La Rochelle i februari 1214, vann över några herrar i Poitou och gick in i Anjou, men när prins Ludvig kom för att undsätta borgen La Roche-aux-Moines den 2 juli vägrade männen från Poitou att strida, och Johan drog sig tillbaka.
In the north Otto gathered the allied army at Valenciennes. On 27 July 1214, near the bridge of Bouvines between Lille and Tournai, Philip turned and gave battle. The allied infantry broke into the French centre and Philip was unhorsed, but the French knights routed the allied wings and centre; Otto fled, and Ferrand, Renaud and Salisbury were taken prisoner. On 18 September John agreed a five-year truce at Chinon and gave up hope of recovering the north. Otto lost his throne to Frederick II, and John came home weakened to face his rebellious barons, the beginning of the First Barons’ War.: I norr samlade Otto den allierade armén vid Valenciennes. Den 27 juli 1214, nära bron vid Bouvines mellan Lille och Tournai, vände Filip och gick till strid. Det allierade fotfolket bröt in i det franska centrum och Filip kastades ur sadeln, men de franska riddarna slog de allierade flyglarna och centrum på flykten; Otto flydde, och Ferrand, Renaud och Salisbury togs till fånga. Den 18 september gick Johan med på ett femårigt stillestånd i Chinon och gav upp hoppet om att återvinna norr. Otto förlorade sin tron till Fredrik II, och Johan kom hem försvagad för att möta sina upproriska baroner – början på första baronkriget.
