In 1200 King John married Isabella of Angoulême, who had been promised to Hugh of Lusignan, and the Lusignans appealed to Philip II, John’s overlord for his lands in France. John refused to answer a summons to the French king’s court, which in April 1202 declared his French fiefs forfeit. Philip invaded Normandy and recognised John’s young nephew, Arthur of Brittany, as lord of Anjou, Maine, Touraine and Poitou. On 1 August, after a forced march from Le Mans, John surprised Arthur and the Lusignans besieging his mother, Eleanor of Aquitaine, at Mirebeau and captured them all. Arthur disappeared in prison in 1203, almost certainly killed on John’s orders, and many of John’s barons turned against him.: År 1200 gifte sig kung Johan med Isabella av Angoulême, som hade varit utlovad åt Hugo av Lusignan, och släkten Lusignan vädjade till Filip II, Johans länsherre för hans besittningar i Frankrike. Johan vägrade att hörsamma en kallelse till den franske kungens domstol, som i april 1202 förklarade hans franska län förverkade. Filip invaderade Normandie och erkände Johans unge brorson Arthur av Bretagne som herre över Anjou, Maine, Touraine och Poitou. Den 1 augusti, efter en ilmarsch från Le Mans, överraskade Johan Arthur och Lusignanerna när de belägrade hans mor, Eleonora av Aquitanien, i Mirebeau och tog dem alla till fånga. Arthur försvann i fängelset 1203, nästan säkert dödad på Johans order, och många av Johans baroner vände sig mot honom.
In the late summer of 1203 Philip laid siege to Château Gaillard, the great castle Richard I had built above the Seine to guard Normandy. John failed to relieve it and left the duchy in December. The castle fell on 6 March 1204, after French soldiers got in through a latrine chute, and on 24 June Rouen surrendered. Normandy, ruled with England since 1066, was lost. Philip went on to take Anjou, Maine, Touraine and much of Poitou; Chinon and Loches held out until 1205. John landed at La Rochelle in 1206, but the truce agreed at Thouars that October left him only Gascony, part of Poitou and, off the Norman coast, the Channel Islands.: Sensommaren 1203 belägrade Filip Château Gaillard, den stora borg som Rikard I hade byggt ovanför Seine för att skydda Normandie. Johan misslyckades med att undsätta den och lämnade hertigdömet i december. Borgen föll den 6 mars 1204 sedan franska soldater tagit sig in genom ett latrinschakt, och den 24 juni kapitulerade Rouen. Normandie, som hade styrts tillsammans med England sedan 1066, var förlorat. Filip intog därefter Anjou, Maine, Touraine och stora delar av Poitou; Chinon och Loches höll ut till 1205. Johan landsteg i La Rochelle 1206, men det stillestånd som slöts i Thouars i oktober samma år lämnade honom bara Gascogne, en del av Poitou och, utanför den normandiska kusten, Kanalöarna.
