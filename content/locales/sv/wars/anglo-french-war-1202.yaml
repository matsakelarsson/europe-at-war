Anglo-French War of 1202–1214: Engelsk-franska kriget 1202–1214
The war in which Philip II of France took Normandy, Anjou, Maine and Touraine from King John of England in 1202–1205, ending the Angevin hold on northern France. John’s attempt to win them back with a coalition led by Emperor Otto IV failed at La Roche-aux-Moines and Bouvines in 1214.: Det krig där Filip II av Frankrike 1202–1205 tog Normandie, Anjou, Maine och Touraine från kung Johan av England och därmed bröt angevinernas grepp om norra Frankrike. Johans försök att vinna tillbaka dem med en koalition under kejsar Otto IV misslyckades vid La Roche-aux-Moines och Bouvines 1214.
