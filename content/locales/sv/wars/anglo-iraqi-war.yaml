Anglo-Iraqi War: Anglo-irakiska kriget
A month-long war in the Second World War between Britain and the government of Rashid Ali al-Gaylani, who had taken power in Iraq in a coup by nationalist officers in April 1941 and sought German help. Iraqi troops besieged the British air base at Habbaniya, but the base’s aircraft drove them off, a relief column crossed the desert from Transjordan, and German and Italian air support came too late. Rashid Ali fled as British forces approached Baghdad, and an armistice was signed on 31 May. The anti-Jewish riots of the Farhud followed in Baghdad.: Ett månadslångt krig under andra världskriget mellan Storbritannien och Rashid Ali al-Gaylanis regering, som hade tagit makten i Irak genom en kupp av nationalistiska officerare i april 1941 och sökt tysk hjälp. Irakiska trupper belägrade den brittiska flygbasen i Habbaniya, men basens flygplan drev bort dem, en undsättningskolonn tog sig över öknen från Transjordanien, och tyskt och italienskt flygunderstöd kom för sent. Rashid Ali flydde när brittiska styrkor närmade sig Bagdad, och ett vapenstillestånd undertecknades den 31 maj. Därefter följde Farhud, de antijudiska upploppen i Bagdad.
