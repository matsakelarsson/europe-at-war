# Svenska översättningar av katalogtexten (våg 8); stegtexterna kommer senare.
Anglo-Kandyan Wars: Anglo-kandyska krigen
The wars in which Britain conquered the Kingdom of Kandy, the last independent kingdom of Sri Lanka, in the island’s central highlands. A British invasion in 1803 took the abandoned capital but ended in disaster when the garrison left behind surrendered and was killed. In 1815, after King Sri Vikrama Rajasinha had turned his chief nobles against him, a second invasion met almost no resistance; the king was captured and exiled, and by the Kandyan Convention the chiefs gave the kingdom to the British Crown. Within two years many of the same chiefs led the Uva rebellion of 1817–1818, which was crushed with great destruction and loss of life, after which the British ruled the highlands directly.: De krig där Storbritannien erövrade kungariket Kandy, Sri Lankas sista självständiga kungarike, i öns centrala högland. En brittisk invasion 1803 intog den övergivna huvudstaden men slutade i katastrof när den kvarlämnade garnisonen kapitulerade och dödades. År 1815, sedan kung Sri Vikrama Rajasinha hade vänt sina främsta stormän mot sig, mötte en andra invasion nästan inget motstånd; kungen tillfångatogs och förvisades, och genom Kandykonventionen överlät hövdingarna riket till den brittiska kronan. Inom två år ledde många av samma hövdingar Uvaupproret 1817–1818, som slogs ned med stor förstörelse och stora förluster i människoliv, varefter britterna styrde höglandet direkt.
