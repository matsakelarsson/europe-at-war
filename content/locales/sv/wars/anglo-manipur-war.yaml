Anglo-Manipur War: Anglo-manipuriska kriget
A short war in 1891 between British India and the kingdom of Manipur, which the British regarded as a protected state and the Manipuris as independent. In September 1890 the senapati (army commander) Tikendrajit Singh deposed Maharaja Surachandra Singh and put his brother Kulachandra on the throne. The British accepted Kulachandra but sent the Chief Commissioner of Assam, James Quinton, with a Gurkha escort to arrest Tikendrajit. The attempt on 24 March 1891 failed, the British Residency was besieged, and Quinton, the political agent Frank Grimwood and three other officers were killed after going to parley; the rest escaped to Cachar. Three columns from Kohima, Silchar and Tamu then invaded, defeated the Manipuri forces at Thoubal and in the battle of Khongjom in late April, and occupied Imphal on 27 April. Tikendrajit and the general Thangal were hanged in public on 13 August 1891, and the British made the boy Churachand raja of a princely state under their control.: Ett kort krig 1891 mellan Brittiska Indien och kungariket Manipur, som britterna betraktade som en skyddsstat och manipurierna som självständigt. I september 1890 avsatte arméchefen (senapati) Tikendrajit Singh maharadja Surachandra Singh och satte sin bror Kulachandra på tronen. Britterna godtog Kulachandra men sände Assams chefskommissarie, James Quinton, med en gurkhaeskort för att arrestera Tikendrajit. Försöket den 24 mars 1891 misslyckades, det brittiska residentskapet belägrades, och Quinton, den politiske agenten Frank Grimwood och tre andra officerare dödades sedan de gått ut för att förhandla; de övriga flydde till Cachar. Tre kolonner från Kohima, Silchar och Tamu invaderade sedan landet, besegrade de manipuriska styrkorna vid Thoubal och i slaget vid Khongjom i slutet av april och besatte Imphal den 27 april. Tikendrajit och generalen Thangal hängdes offentligt den 13 augusti 1891, och britterna gjorde pojken Churachand till raja över en furstestat under brittisk kontroll.
