# Svenska översättningar av katalogtexten (våg 8); stegtexterna kommer senare.
Child’s War (Anglo-Mughal war): Childs krig (anglo-mogulska kriget)
The English East India Company’s first war against an Indian power, named after Sir Josiah Child, the Company’s head in London, who decided to win better trading terms and a fortified base in Bengal by force. In 1686 Company troops fought the Mughal governor’s men at Hooghly, and Job Charnock withdrew the Company’s Bengal staff down the river to the island of Hijli, where they were besieged and decimated by disease. In 1688–1689 English ships seized Mughal merchant and pilgrim ships off the western coast; Aurangzeb ordered the Company’s factories across India seized, and his admiral, the Siddi of Janjira, besieged Bombay for more than a year. In 1690 the Company sued for peace, paid a fine of 150,000 rupees and was allowed to trade again. Charnock returned to Bengal and in August 1690 set up the settlement at Sutanuti that grew into Calcutta.: Engelska ostindiska kompaniets första krig mot en indisk makt, uppkallat efter sir Josiah Child, kompaniets chef i London, som beslöt att med våld skaffa sig bättre handelsvillkor och en befäst bas i Bengalen. År 1686 stred kompaniets trupper mot den mogulske guvernörens män vid Hooghly, och Job Charnock drog tillbaka kompaniets personal i Bengalen nedför floden till ön Hijli, där de belägrades och decimerades av sjukdomar. Åren 1688–1689 kapade engelska fartyg mogulska handels- och pilgrimsfartyg utanför västkusten; Aurangzeb beordrade att kompaniets faktorier i hela Indien skulle beslagtas, och hans amiral, Siddi av Janjira, belägrade Bombay i mer än ett år. År 1690 bad kompaniet om fred, betalade böter på 150 000 rupier och fick åter bedriva handel. Charnock återvände till Bengalen och grundade i augusti 1690 bosättningen vid Sutanuti, som växte till Calcutta.
