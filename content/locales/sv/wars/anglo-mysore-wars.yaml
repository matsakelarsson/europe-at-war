Anglo-Mysore Wars: Mysorekrigen
Four wars between the Kingdom of Mysore, ruled by Hyder Ali and then his son Tipu Sultan, and the British East India Company, with the Marathas and the Nizam of Hyderabad as allies of one side or the other. In the first (1767–1769) Hyder rode to the gates of Madras and made the Company accept a defensive treaty. In the second (1780–1784) Mysore destroyed a British column at Pollilur, overran the Carnatic with French help and ended the war on equal terms at Mangalore. In the third (1790–1792) Lord Cornwallis, allied with the Marathas and the Nizam, besieged Srirangapatna and took half of Tipu’s kingdom. In the fourth (1799) a British and Hyderabadi army stormed Srirangapatna; Tipu was killed in the breach, his kingdom was partitioned and a child of the old Wodeyar dynasty was set on the throne of a smaller Mysore under Company protection.: Fyra krig mellan kungariket Mysore, styrt av Hyder Ali och sedan av hans son Tipu Sultan, och Brittiska ostindiska kompaniet, med maratherna och nizamen av Hyderabad som allierade till den ena eller andra sidan. I det första (1767–1769) red Hyder ända fram till Madras portar och tvingade kompaniet att godta ett försvarsfördrag. I det andra (1780–1784) förintade Mysore en brittisk kolonn vid Pollilur, drog med fransk hjälp fram över Karnatik och avslutade kriget på lika villkor i Mangalore. I det tredje (1790–1792) belägrade lord Cornwallis, allierad med maratherna och nizamen, Srirangapatna och tog halva Tipus rike. I det fjärde (1799) stormade en brittisk och hyderabadisk armé Srirangapatna; Tipu stupade i bräschen, hans rike delades och ett barn av den gamla Wodeyardynastin sattes på tronen i ett mindre Mysore under kompaniets beskydd.
