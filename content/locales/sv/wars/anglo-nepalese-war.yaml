# Svenska översättningar av katalogtexten (våg 8); stegtexterna kommer senare.
Anglo-Nepalese War: Anglo-nepalesiska kriget
A war between the East India Company and the Gorkha kingdom of Nepal, which in half a century had grown from a small hill state into a Himalayan empire stretching from the Teesta to the Sutlej. Border disputes in the Terai lowlands, above all over Butwal and Sheoraj, led the Governor-General, Lord Moira, to invade along the whole frontier in 1814. Nepalese garrisons beat off the first attacks at Kalunga and Jaithak and in the Terai, but in 1815 the Company took Kumaon and forced Amar Singh Thapa to give up the western hills at Malaun. When Kathmandu would not ratify the Treaty of Sugauli, Sir David Ochterlony marched to Makwanpur, and Nepal accepted the treaty on 4 March 1816. It lost Kumaon, Garhwal, the hill states to the Sutlej, the Sikkim lands and most of the Terai, part of which was soon returned, and took a British Resident, but kept its independence. The British began recruiting the soldiers they had fought, the origin of the Gurkha regiments.: Ett krig mellan Brittiska ostindiska kompaniet och gorkhakungariket Nepal, som på ett halvsekel hade vuxit från en liten bergsstat till ett himalayarike som sträckte sig från Teesta till Sutlej. Gränstvister i låglandet Terai, framför allt om Butwal och Sheoraj, fick generalguvernören, lord Moira, att 1814 invadera längs hela gränsen. Nepalesiska garnisoner slog tillbaka de första anfallen vid Kalunga och Jaithak och i Terai, men 1815 intog kompaniet Kumaon och tvingade Amar Singh Thapa att avstå de västra bergstrakterna vid Malaun. När Katmandu vägrade ratificera fördraget i Sugauli marscherade sir David Ochterlony till Makwanpur, och Nepal godtog fördraget den 4 mars 1816. Landet förlorade Kumaon, Garhwal, bergsstaterna fram till Sutlej, Sikkimområdena och större delen av Terai, varav en del snart återlämnades, och måste ta emot en brittisk resident, men det behöll sin självständighet. Britterna började värva de soldater de hade kämpat mot, och därur växte gurkharegementena fram.
