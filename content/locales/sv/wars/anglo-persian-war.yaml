Anglo-Persian War: Anglo-persiska kriget
A short war between Britain and Qajar Iran over Herat. In 1856 Naser al-Din Shah’s army besieged and took Herat, which Iran claimed as part of Khorasan and had promised in 1853 to leave alone. Britain, which wanted Herat in Afghan hands as a barrier against Russian and Persian influence near India, declared war on 1 November 1856. Instead of marching across Afghanistan it sent a force from Bombay to the Gulf, which seized Kharg Island and Bushehr, defeated an Iranian army at Khushab in February 1857 and took Mohammerah (Khorramshahr) and Ahvaz in March and April. A peace signed in Paris on 4 March 1857, before the last battles were fought, made Iran give up Herat and its claims in Afghanistan; the British left Bushehr in October 1857.: Ett kort krig mellan Storbritannien och Qajarernas Iran om Herat. År 1856 belägrade och intog Naser al-Din shahs armé Herat, som Iran gjorde anspråk på som en del av Khorasan och 1853 hade lovat att lämna i fred. Storbritannien, som ville se Herat i afghanska händer som en barriär mot ryskt och persiskt inflytande nära Indien, förklarade krig den 1 november 1856. I stället för att marschera genom Afghanistan sände britterna en styrka från Bombay till Persiska viken, som intog ön Kharg och Bushehr, besegrade en iransk armé vid Khushab i februari 1857 och intog Mohammerah (Khorramshahr) och Ahvaz i mars och april. En fred som undertecknades i Paris den 4 mars 1857, innan de sista striderna hade utkämpats, tvingade Iran att avstå från Herat och sina anspråk i Afghanistan; britterna lämnade Bushehr i oktober 1857.
