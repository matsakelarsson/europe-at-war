# Svenska översättningar av katalogtexten (våg 14); stegtexterna kommer senare.
Anglo-Powhatan Wars: Powhatankrigen
? Three wars between the English colony of Virginia and Tsenacomoco, the paramount chiefdom of some thirty Algonquian-speaking nations of the Virginia coastal plain ruled by Powhatan (Wahunsenacawh) and later by his brother Opechancanough. In the first (1609–1614), Powhatan cut off the starving colony at Jamestown, and the English, reinforced in 1610, burned towns along the James River, killed women and children and took Pocahontas hostage; it ended with her marriage to John Rolfe. As tobacco planting spread up the rivers, Opechancanough’s warriors struck the English settlements on 22 March 1622 and killed 347 colonists, opening a second war (1622–1632) in which the English destroyed Powhatan crops year after year. His last attack, on 18 April 1644, killed about 400 colonists, but the colony now numbered some 8,000. Opechancanough was captured in 1646 and shot by a guard at Jamestown, and by the treaty of October 1646 his successor Necotowance made the Powhatan nations tributaries of the English crown and gave up the land between the York and the Blackwater rivers. Several tribes descended from the nations of Tsenacomoco are recognised by Virginia today, among them the Pamunkey and Mattaponi, who still hold reservations set aside in the 1600s.
: Tre krig mellan den engelska kolonin Virginia och Tsenacomoco, det överordnade hövdingadöme som omfattade ett trettiotal algonkinspråkiga nationer på Virginias kustslätt och styrdes av Powhatan (Wahunsenacawh) och senare av hans bror Opechancanough. I det första (1609–1614) skar Powhatan av den svältande kolonin i Jamestown, och engelsmännen, som fick förstärkningar 1610, brände byar längs James River, dödade kvinnor och barn och tog Pocahontas som gisslan; kriget slutade med hennes giftermål med John Rolfe. När tobaksodlingen spred sig uppför floderna slog Opechancanoughs krigare till mot de engelska bosättningarna den 22 mars 1622 och dödade 347 kolonister, vilket inledde ett andra krig (1622–1632) där engelsmännen förstörde powhatanfolkets skördar år efter år. Hans sista anfall, den 18 april 1644, dödade omkring 400 kolonister, men kolonin hade nu omkring 8 000 invånare. Opechancanough tillfångatogs 1646 och sköts av en vakt i Jamestown, och genom fördraget i oktober 1646 gjorde hans efterträdare Necotowance powhatannationerna tributpliktiga under den engelska kronan och avstod landet mellan floderna York och Blackwater. Flera stammar som härstammar från Tsenacomocos nationer är i dag erkända av Virginia, bland dem pamunkey och mattaponi, som fortfarande innehar reservat som avsattes på 1600-talet.
