# Svenska översättningar av katalogtexten (våg 10); stegtexterna kommer senare.
Anglo-Satsuma War: Kriget mellan Storbritannien och Satsuma
? A brief war between Britain and the Satsuma domain, fought as the bombardment of Kagoshima. On 14 September 1862 samurai escorting Shimazu Hisamitsu, the father and regent of the Satsuma daimyo, cut down British merchants who had failed to make way for his procession at Namamugi near Yokohama, killing Charles Lennox Richardson. Britain demanded £100,000 and an apology from the shogunate, which paid, and £25,000 and the trial and execution of the killers from Satsuma, which refused. In August 1863 Admiral Augustus Kuper sailed from Yokohama with seven warships and anchored in Kagoshima Bay on 11 August. When talks failed he seized three Satsuma steamers on 15 August; the shore batteries opened fire, and in a typhoon the British squadron bombarded the town and the forts for two days. The British lost 13 killed, among them Captain Josling and Commander Wilmot of the flagship Euryalus, killed by the same shot from a shore battery, and 50 to 69 wounded by different counts; Satsuma reported 5 killed. About 500 houses burned, between 5 and 10 per cent of the town in different accounts, together with Satsuma’s modern factory complex, the Shūseikan, and five Ryukyuan junks in the harbour. Short of coal and ammunition, the squadron withdrew on 17 August. In talks at Yokohama that autumn Satsuma agreed to pay the £25,000, borrowed from the shogunate, and promised to look for the killers, who were never handed over. The war convinced Satsuma’s leaders that they could not drive out the Western powers by force; the domain soon bought British ships and arms, sent students to Britain in 1865 and became one of Britain’s main partners in Japan.
: Ett kort krig mellan Storbritannien och Satsumadomänen, som utkämpades i form av bombardemanget av Kagoshima. Den 14 september 1862 högg samurajer som eskorterade Shimazu Hisamitsu, far till och regent för Satsumas daimyo, ned brittiska köpmän som inte hade lämnat plats för hans procession vid Namamugi nära Yokohama och dödade Charles Lennox Richardson. Storbritannien krävde 100 000 pund och en ursäkt av shogunatet, som betalade, och 25 000 pund samt rättegång mot och avrättning av gärningsmännen av Satsuma, som vägrade. I augusti 1863 seglade amiral Augustus Kuper från Yokohama med sju krigsfartyg och ankrade i Kagoshimabukten den 11 augusti. När förhandlingarna misslyckades beslagtog han tre ångfartyg från Satsuma den 15 augusti; strandbatterierna öppnade eld, och under en tyfon bombarderade den brittiska eskadern staden och fästningarna i två dagar. Britterna förlorade 13 döda, bland dem kapten Josling och kommendörkapten Wilmot på flaggskeppet Euryalus, som dödades av samma skott från ett strandbatteri, och 50 till 69 sårade enligt olika räkningar; Satsuma uppgav 5 döda. Omkring 500 hus brann, enligt olika uppgifter mellan 5 och 10 procent av staden, tillsammans med Satsumas moderna fabrikskomplex Shūseikan och fem djonker från Ryūkyū i hamnen. Med ont om kol och ammunition drog sig eskadern tillbaka den 17 augusti. Vid förhandlingar i Yokohama samma höst gick Satsuma med på att betala de 25 000 punden, som lånades av shogunatet, och lovade att leta efter gärningsmännen, som aldrig överlämnades. Kriget övertygade Satsumas ledare om att de inte kunde driva ut västmakterna med våld; domänen köpte snart brittiska fartyg och vapen, skickade studenter till Storbritannien 1865 och blev en av Storbritanniens viktigaste partner i Japan.
