Dates are Julian (Old Style). The campaign was part of the War of the League of Cambrai; border raids went on until the Anglo-French peace of 1514, which included Scotland.: Datumen följer den julianska kalendern (gamla stilen). Fälttåget var en del av Cambraiförbundets krig; gränsräderna fortsatte fram till den engelsk-franska freden 1514, som även omfattade Skottland.
