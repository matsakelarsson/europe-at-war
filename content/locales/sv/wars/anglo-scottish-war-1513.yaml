Anglo-Scottish War of 1513: Engelsk-skotska kriget 1513
James IV of Scotland invaded England to support his French allies while Henry VIII was campaigning in France. He took the border castles of Norham, Etal and Ford and waited on Flodden Hill, but the English army under the Earl of Surrey marched round to his rear. On 9 September 1513, near Branxton, the Scottish pikemen advanced downhill, lost their order in marshy ground and were cut down at close quarters by English billmen. James IV was killed, the last monarch in Britain to die in battle, with many of his nobles and perhaps 10,000 of his men, though estimates vary widely. His infant son became James V.: Jakob IV av Skottland invaderade England för att stödja sina franska allierade medan Henrik VIII förde krig i Frankrike. Han intog gränsborgarna Norham, Etal och Ford och väntade på Flodden Hill, men den engelska armén under earlen av Surrey marscherade runt till hans rygg. Den 9 september 1513, nära Branxton, ryckte de skotska pikenerarna fram nedför sluttningen, förlorade ordningen i sank terräng och höggs ned i närstrid av engelska hillebardiärer. Jakob IV stupade – den siste monarken i Storbritannien som dött i strid – tillsammans med många av sina adelsmän och kanske 10 000 av sina män, även om uppskattningarna varierar kraftigt. Hans späde son blev Jakob V.
