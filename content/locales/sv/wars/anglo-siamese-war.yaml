# Svenska översättningar av katalogtexten (våg 11); stegtexterna kommer senare.
Anglo-Siamese War: Anglo-siamesiska kriget
? A short war between the English East India Company and the kingdom of Siam under King Narai, fought almost entirely at Mergui (Myeik), Siam’s port on the Bay of Bengal. Narai’s Greek minister Constantine Phaulkon had made two Englishmen, Richard Burnaby and Samuel White, governor and harbour master of Mergui, and from 1685 they seized Indian ships, above all those of Golconda, in a private vendetta that the Company and Golconda regarded as piracy and blamed on Siam. In 1687 the Company, armed with a royal order recalling Englishmen from foreign service, sent the warships Curtana and James under Anthony Weltden to take the English out of Siamese service and to hold the port’s shipping until Narai paid £65,000 in damages. On the night of 14 June 1687, while the English were ashore, Siamese troops under the governor of Tenasserim fired on the ships and attacked the English in the town; about sixty were killed, by most accounts including Burnaby, and the James was sunk. Weltden and White escaped. Siam declared war on the Company in August 1687, and in September a Company frigate sent to occupy Mergui was captured on arrival, by which time a French governor had taken over the port. There was little more fighting; no peace was signed, because the Company kept its claim for damages, and after the revolution of 1688 Siam closed its ports to Company ships until 1708.
: Ett kort krig mellan Engelska ostindiska kompaniet och kungariket Siam under kung Narai, som nästan helt utkämpades vid Mergui (Myeik), Siams hamn vid Bengaliska viken. Narais grekiske minister Constantine Phaulkon hade gjort två engelsmän, Richard Burnaby och Samuel White, till guvernör respektive hamnkapten i Mergui, och från 1685 kapade de indiska fartyg, framför allt från Golconda, i en privat vendetta som kompaniet och Golconda betraktade som sjöröveri och skyllde på Siam. År 1687 sände kompaniet, beväpnat med en kunglig order som kallade hem engelsmän ur utländsk tjänst, krigsfartygen Curtana och James under Anthony Weltden för att föra engelsmännen ut ur siamesisk tjänst och hålla kvar hamnens fartyg tills Narai hade betalat 65 000 pund i skadestånd. Natten den 14 juni 1687, medan engelsmännen var i land, besköt siamesiska trupper under guvernören i Tenasserim fartygen och angrep engelsmännen i staden; omkring sextio dödades, enligt de flesta uppgifter även Burnaby, och James sänktes. Weltden och White kom undan. Siam förklarade kompaniet krig i augusti 1687, och i september erövrades en av kompaniets fregatter, som hade sänts för att besätta Mergui, vid ankomsten; vid det laget hade en fransk guvernör tagit över hamnen. Det blev inte mycket mer strider; ingen fred slöts, eftersom kompaniet höll fast vid sitt skadeståndskrav, och efter revolutionen 1688 stängde Siam sina hamnar för kompaniets fartyg fram till 1708.
