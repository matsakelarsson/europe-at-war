Anglo-Soviet invasion of Iran: Anglo-sovjetiska invasionen av Iran
The joint invasion of neutral Iran by Britain and the Soviet Union in the Second World War. Wanting to secure the oil fields and the Trans-Iranian Railway as a supply route to the Soviet Union, and to expel German nationals, the two powers attacked on 25 August 1941, British and Indian troops from Iraq and the Gulf, Soviet armies from the Caucasus and Central Asia. Iran ordered a ceasefire after four days. Reza Shah abdicated in favour of his son Mohammad Reza on 16 September, and Iran stayed under Allied occupation until 1946.: Storbritanniens och Sovjetunionens gemensamma invasion av det neutrala Iran under andra världskriget. För att säkra oljefälten och Transiranska järnvägen som försörjningsväg till Sovjetunionen, och för att utvisa tyska medborgare, anföll de två makterna den 25 augusti 1941, brittiska och indiska trupper från Irak och Persiska viken, sovjetiska arméer från Kaukasus och Centralasien. Iran beordrade eldupphör efter fyra dagar. Reza shah abdikerade till förmån för sin son Mohammad Reza den 16 september, och Iran förblev ockuperat av de allierade till 1946.
