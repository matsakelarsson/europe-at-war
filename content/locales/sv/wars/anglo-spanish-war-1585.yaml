The war’s last years were fought mainly in the Low Countries and Ireland. English regiments under Sir Francis Vere fought in the Dutch army that beat Archduke Albert at Nieuwpoort on 2 July 1600, and from 1601 helped hold Ostend, whose siege lasted more than three years. In Ireland, where Hugh O’Neill, Earl of Tyrone, had been at war with the crown since the mid-1590s, Spain at last sent help. About 3,500 Spanish soldiers under Juan del Águila landed at Kinsale in October 1601. Lord Mountjoy besieged them, and on 3 January 1602 routed the Irish army that came to their relief; del Águila surrendered on terms and sailed home.: Krigets sista år utkämpades främst i Nederländerna och på Irland. Engelska regementen under sir Francis Vere stred i den nederländska armé som besegrade ärkehertig Albrekt vid Nieuwpoort den 2 juli 1600, och från 1601 hjälpte de till att hålla Oostende, vars belägring varade i mer än tre år. På Irland, där Hugh O’Neill, earl av Tyrone, hade legat i krig med kronan sedan mitten av 1590-talet, sände Spanien till slut hjälp. Omkring 3 500 spanska soldater under Juan del Águila landsteg vid Kinsale i oktober 1601. Lord Mountjoy belägrade dem och slog den 3 januari 1602 den irländska armé som kom till deras undsättning på flykten; del Águila kapitulerade på villkor och seglade hem.
Elizabeth died on 24 March 1603, and James VI of Scotland, who had never been at war with Spain, became James I of England and soon stopped the fighting. In 1604 English and Spanish envoys met at Somerset House in London, and the treaty was signed in August. Neither side gained land. England ended its official help to the Dutch, though English volunteers went on serving them; Spain gave up hope of restoring Catholicism in England, and English merchants could trade with Spain again. Ostend fell to Spain three weeks after the peace.: Elisabet dog den 24 mars 1603, och Jakob VI av Skottland, som aldrig hade legat i krig med Spanien, blev Jakob I av England och avbröt snart striderna. År 1604 möttes engelska och spanska sändebud i Somerset House i London, och fördraget undertecknades i augusti. Ingen av parterna vann land. England upphörde med sin officiella hjälp till nederländarna, även om engelska frivilliga fortsatte att tjäna dem; Spanien gav upp hoppet om att återinföra katolicismen i England, och engelska köpmän kunde åter handla med Spanien. Oostende föll i spanska händer tre veckor efter freden.
