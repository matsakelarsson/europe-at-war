Anglo-Spanish War of 1585–1604: Engelsk-spanska kriget 1585–1604
An undeclared war between Elizabeth I’s England and Philip II’s Spain, fought over religion, English help for the Dutch revolt and English raids on Spain’s Atlantic trade. Its best-known episode is the defeat of the Spanish Armada in 1588; England’s counter-attack failed in 1589, Cádiz was sacked in 1596, and Spanish troops landed in Ireland in 1601. James I made peace in the Treaty of London in 1604, restoring the position before the war.: Ett oförklarat krig mellan Elisabet I:s England och Filip II:s Spanien om religionen, den engelska hjälpen till det nederländska upproret och engelska räder mot Spaniens atlanthandel. Den mest kända episoden är den spanska armadans nederlag 1588; Englands motangrepp misslyckades 1589, Cádiz plundrades 1596 och spanska trupper landsteg på Irland 1601. Jakob I slöt fred genom Londonfreden 1604, som återställde läget från före kriget.
