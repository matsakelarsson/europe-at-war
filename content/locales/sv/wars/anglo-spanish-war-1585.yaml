Relations between Elizabeth I and Philip II had soured over religion, English raids on Spain’s American trade and English sympathy for the Dutch rebels. When the Duke of Parma’s reconquest of the southern Netherlands took Antwerp in August 1585, Elizabeth made the Treaty of Nonsuch with the rebels and sent an army under the Earl of Leicester, while Francis Drake raided the Spanish Caribbean. Philip began to plan an invasion of England, and after Mary, Queen of Scots, was executed in February 1587 he had no reason to wait for a Catholic succession. That spring Drake raided Cádiz and destroyed dozens of ships gathering for the expedition.: Förbindelserna mellan Elisabet I och Filip II hade försämrats på grund av religionen, engelska räder mot Spaniens amerikanska handel och engelsk sympati för de nederländska rebellerna. När hertigen av Parma under sin återerövring av södra Nederländerna intog Antwerpen i augusti 1585 slöt Elisabet fördraget i Nonsuch med rebellerna och sände en armé under earlen av Leicester, medan Francis Drake plundrade i spanska Karibien. Filip började planera en invasion av England, och sedan Maria Stuart avrättats i februari 1587 hade han ingen anledning att vänta på en katolsk tronföljd. Samma vår gjorde Drake en räd mot Cádiz och förstörde dussintals fartyg som samlades för expeditionen.
The Armada, about 130 ships under the Duke of Medina Sidonia, left Lisbon in May 1588 to escort Parma’s army across from Flanders. Sighted off Cornwall on 29 July, it sailed up the Channel in a tight crescent, harried by the English under Lord Howard and Drake, but lost few ships. Anchored off Calais, it was scattered by fireships on the night of 7–8 August, and the next day the English attacked it off Gravelines. Parma’s barges, blockaded by Dutch ships, never came out. The wind drove the Armada north, round Scotland and Ireland, where storms wrecked many ships; around a third never returned, and thousands of men died.: Armadan, omkring 130 fartyg under hertigen av Medina Sidonia, lämnade Lissabon i maj 1588 för att eskortera Parmas armé över från Flandern. Den siktades utanför Cornwall den 29 juli och seglade uppför Engelska kanalen i en tät halvmåneformation, ansatt av engelsmännen under lord Howard och Drake, men förlorade få fartyg. När den låg för ankar utanför Calais skingrades den av brännare natten mellan den 7 och 8 augusti, och dagen därpå anföll engelsmännen den utanför Gravelines. Parmas pråmar, blockerade av nederländska fartyg, kom aldrig ut. Vinden drev armadan norrut, runt Skottland och Irland, där stormar fick många fartyg att förlisa; omkring en tredjedel återvände aldrig, och tusentals män omkom.
