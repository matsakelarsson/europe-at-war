Dates are New Style (Gregorian), as used in Spain from 1582. England kept the Julian calendar, ten days behind, so English accounts date the Armada’s arrival off Cornwall to 19 July 1588 and Gravelines to 29 July.: Datumen anges enligt nya stilen (den gregorianska kalendern), som användes i Spanien från 1582. England behöll den julianska kalendern, som låg tio dagar efter, så engelska skildringar daterar armadans ankomst utanför Cornwall till den 19 juli 1588 och slaget vid Gravelines till den 29 juli.
Philip II was also king of Portugal from 1580, and the Armada sailed from Lisbon. The war ran alongside the Dutch revolt (the Eighty Years’ War), the French Wars of Religion, in which England and Spain backed opposite sides, and the Nine Years’ War in Ireland.: Filip II var också kung av Portugal från 1580, och armadan seglade från Lissabon. Kriget pågick parallellt med det nederländska upproret (åttioåriga kriget), de franska religionskrigen, där England och Spanien stödde motsatta sidor, och nioårskriget på Irland.
