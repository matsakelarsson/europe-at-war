In 1589 Elizabeth sent a fleet of her own under Drake and Sir John Norris to destroy the surviving Spanish ships, raise Portugal for the pretender Dom António and seize the Azores. It wasted two weeks at A Coruña, failed to take Lisbon and lost thousands of men to disease, and Philip rebuilt his navy. England turned to helping Henry IV of France against the Catholic League and Spain, sending troops to Normandy and to Brittany, where a Spanish force held Blavet; in 1594 English and French troops stormed the Spanish fort at Crozon near Brest. In 1595 Spanish soldiers from Brittany burned Mousehole and Penzance.: År 1589 sände Elisabet en egen flotta under Drake och sir John Norris för att förstöra de återstående spanska fartygen, få Portugal att resa sig för tronpretendenten dom António och erövra Azorerna. Den slösade bort två veckor vid A Coruña, misslyckades med att inta Lissabon och förlorade tusentals man i sjukdomar, och Filip byggde upp sin flotta igen. England övergick till att hjälpa Henrik IV av Frankrike mot katolska ligan och Spanien och sände trupper till Normandie och till Bretagne, där en spansk styrka höll Blavet; 1594 stormade engelska och franska trupper det spanska fortet vid Crozon nära Brest. År 1595 brände spanska soldater från Bretagne Mousehole och Penzance.
In June 1596 an English and Dutch fleet under Lord Howard and the Earl of Essex attacked Cádiz. It destroyed or took the warships in the bay, and its soldiers stormed and sacked the city and held it for two weeks, while the Spanish burned the merchant fleet to keep it from them. Philip answered with two more armadas. In October 1596 a storm off Cape Finisterre wrecked many ships of the first, and the second was scattered by gales off the Channel in October 1597. Drake and John Hawkins had both died on a failed raid on the Caribbean, and Essex’s voyage to the Azores in 1597 also failed.: I juni 1596 anföll en engelsk-nederländsk flotta under lord Howard och earlen av Essex Cádiz. Den förstörde eller erövrade krigsfartygen i bukten, och dess soldater stormade och plundrade staden och höll den i två veckor, medan spanjorerna brände handelsflottan för att den inte skulle falla i fiendens händer. Filip svarade med ytterligare två armador. I oktober 1596 fick en storm utanför Kap Finisterre många fartyg i den första att förlisa, och den andra skingrades av stormar utanför Engelska kanalen i oktober 1597. Drake och John Hawkins hade båda dött under en misslyckad räd mot Karibien, och Essex expedition till Azorerna 1597 misslyckades också.
