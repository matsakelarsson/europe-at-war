Anglo-Spanish War of 1654–1660: Engelsk-spanska kriget 1654–1660
A war between Oliver Cromwell’s Protectorate and Spain, begun with the “Western Design” against Spain’s Caribbean empire. An expedition was beaten off at Santo Domingo in April 1655 but took Jamaica in May. At sea Robert Blake’s fleet blockaded Cádiz, captured part of a silver fleet in 1656 and destroyed the Spanish fleet sheltering at Santa Cruz de Tenerife on 20 April 1657, though its silver had already been landed. Allied with France from March 1657, English troops helped Turenne beat the Spanish army and its French and English Royalist allies, led by Condé and the future James II, at the Battle of the Dunes on 14 June 1658, and Dunkirk, which surrendered soon afterwards, was handed to England. The fighting stopped after the Restoration of Charles II in 1660, and treaties signed at Madrid in 1667 and 1670 formally ended the war. England kept Jamaica; Charles II sold Dunkirk to France in 1662.: Ett krig mellan Oliver Cromwells protektorat och Spanien, inlett med ”Western Design”, planen mot Spaniens karibiska välde. En expedition slogs tillbaka vid Santo Domingo i april 1655 men intog Jamaica i maj. Till sjöss blockerade Robert Blakes flotta Cádiz, kapade en del av en silverflotta 1656 och förstörde den spanska flotta som sökt skydd vid Santa Cruz de Tenerife den 20 april 1657, även om dess silver redan hade lossats. Allierade med Frankrike från mars 1657 hjälpte engelska trupper Turenne att besegra den spanska armén och dess franska och engelska rojalistiska allierade, ledda av Condé och den blivande Jakob II, i slaget vid Dynerna den 14 juni 1658, och Dunkerque, som kapitulerade kort därefter, överlämnades till England. Striderna upphörde efter Karl II:s restauration 1660, och fördrag som undertecknades i Madrid 1667 och 1670 avslutade formellt kriget. England behöll Jamaica; Karl II sålde Dunkerque till Frankrike 1662.
