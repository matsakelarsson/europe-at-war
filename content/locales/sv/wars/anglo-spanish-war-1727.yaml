Dates are New Style (Gregorian). Britain still used the Julian calendar, eleven days behind. Some historians date the start of the war to 1726, when Britain sent a fleet to the Spanish Caribbean.: Datumen anges enligt nya stilen (den gregorianska kalendern). Storbritannien använde fortfarande den julianska kalendern, som låg elva dagar efter. Vissa historiker daterar krigets början till 1726, då Storbritannien sände en flotta till spanska Karibien.
Spanish historians count this as the thirteenth siege of Gibraltar.: Spanska historiker räknar detta som den trettonde belägringen av Gibraltar.
