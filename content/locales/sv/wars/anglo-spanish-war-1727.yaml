Anglo-Spanish War of 1727–1729: Engelsk-spanska kriget 1727–1729
A short war in which Philip V’s Spain, counting on its new alliance with the Emperor Charles VI, tried to win back Gibraltar, which it had ceded to Britain at Utrecht in 1713. On 11 February 1727 a Spanish army under the Count de las Torres, put at between 12,000 and 25,000 men and many of them foreign regiments, opened a siege from the isthmus below the Rock. The Royal Navy held the Strait, and the garrison, about 1,500 men at first, was reinforced by sea to some 5,000. Spanish batteries pounded the north front, but rain, sickness and fire from the Rock wore the besiegers down, and the promised Austrian help never came. Fighting stopped in June 1727 after preliminaries signed in Paris, having cost Spain over 1,400 men against about 300 British. Meanwhile a British squadron blockading Porto Bello in Panama lost some 4,000 men to disease. The Convention of El Pardo (March 1728) and the Treaty of Seville (9 November 1729) restored the position before the war, and Gibraltar stayed British.: Ett kort krig där Filip V:s Spanien, som räknade med sin nya allians med kejsar Karl VI, försökte vinna tillbaka Gibraltar, som det hade avträtt till Storbritannien i Utrecht 1713. Den 11 februari 1727 inledde en spansk armé under greven de las Torres, uppskattad till mellan 12 000 och 25 000 man och till stor del bestående av utländska regementen, en belägring från näset nedanför klippan. Royal Navy behärskade sundet, och garnisonen, till en början omkring 1 500 man, förstärktes sjövägen till omkring 5 000. Spanska batterier besköt nordfronten, men regn, sjukdom och eld från klippan nötte ned belägrarna, och den utlovade österrikiska hjälpen kom aldrig. Striderna upphörde i juni 1727 efter preliminärer som undertecknats i Paris och hade då kostat Spanien över 1 400 man mot omkring 300 brittiska. Under tiden förlorade en brittisk eskader som blockerade Porto Bello i Panama omkring 4 000 man i sjukdomar. Konventionen i El Pardo (mars 1728) och freden i Sevilla (9 november 1729) återställde läget från före kriget, och Gibraltar förblev brittiskt.
