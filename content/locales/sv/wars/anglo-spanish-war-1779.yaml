Anglo-Spanish War of 1779–1783: Engelsk-spanska kriget 1779–1783
Spain’s war with Britain as France’s ally during the American War of Independence, fought above all to win back Gibraltar and Minorca. A Franco-Spanish force took Minorca in February 1782, but Gibraltar held out through a siege of three and a half years, the Great Siege, and remained British at the peace of 1783, while Spain kept Minorca and regained Florida.: Spaniens krig mot Storbritannien som Frankrikes allierade under amerikanska frihetskriget, fört framför allt för att vinna tillbaka Gibraltar och Menorca. En fransk-spansk styrka intog Menorca i februari 1782, men Gibraltar höll ut under en belägring på tre och ett halvt år, den stora belägringen, och förblev brittiskt vid freden 1783, medan Spanien behöll Menorca och återfick Florida.
