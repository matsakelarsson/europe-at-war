Spain declared war on Britain on 16 June 1779, as France’s ally, with the recovery of Gibraltar as its chief aim. That summer a combined French and Spanish fleet of some 66 ships of the line sailed into the English Channel to cover an invasion of England, but sickness and indecision ended the attempt. At Gibraltar the Spanish closed the frontier, blockaded the bay and built siege lines across the isthmus. The garrison, some 5,400 men under General George Augustus Eliott, strengthened the batteries on the Rock, but as the winter went on its rations were cut again and again.: Spanien förklarade Storbritannien krig den 16 juni 1779 som Frankrikes allierade, med återerövringen av Gibraltar som främsta mål. Samma sommar seglade en förenad fransk-spansk flotta på omkring 66 linjeskepp in i Engelska kanalen för att täcka en invasion av England, men sjukdomar och obeslutsamhet gjorde slut på försöket. Vid Gibraltar stängde spanjorerna gränsen, blockerade bukten och byggde belägringslinjer tvärs över näset. Garnisonen, omkring 5 400 man under general George Augustus Eliott, förstärkte batterierna på klippan, men allteftersom vintern gick skars ransonerna ned gång på gång.
In January 1780 Admiral Sir George Rodney, escorting a convoy, caught a Spanish squadron off Cape St Vincent and in a night action, the “Moonlight Battle”, captured four of its ships, while a fifth blew up; he reached Gibraltar on 25 January with men and supplies. A second convoy under Admiral Darby got through on 12 April 1781, and the Spanish then opened a bombardment that wrecked much of the town; most of the civilians left with Darby’s ships. On the night of 26–27 November 1781 the garrison made a surprise sortie and blew up the forward Spanish batteries, for the loss of a handful of men.: I januari 1780 överraskade amiral sir George Rodney, som eskorterade en konvoj, en spansk eskader utanför Kap São Vicente och erövrade i en nattlig strid, ”månskensslaget”, fyra av dess fartyg, medan ett femte sprang i luften; han nådde Gibraltar den 25 januari med manskap och förnödenheter. En andra konvoj under amiral Darby kom igenom den 12 april 1781, och spanjorerna inledde då ett bombardemang som förstörde stora delar av staden; de flesta civila lämnade den med Darbys fartyg. Natten mellan den 26 och 27 november 1781 gjorde garnisonen ett överraskande utfall och sprängde de främre spanska batterierna, till priset av en handfull man.
