Spain fought as an ally of France, which had been at war with Britain since 1778, and not formally of the United States. The fighting in the Americas, where Spanish forces took West Florida, and the Franco-Spanish attempt to invade England in the summer of 1779 are only mentioned here.: Spanien stred som allierad till Frankrike, som hade legat i krig med Storbritannien sedan 1778, och inte formellt som allierad till USA. Striderna i Amerika, där spanska styrkor intog Västflorida, och det fransk-spanska försöket att invadera England sommaren 1779 nämns här bara i förbigående.
The peace was signed at Versailles on 3 September 1783, the same day as the Treaty of Paris between Britain and the United States; together they are often called the Peace of Paris.: Freden undertecknades i Versailles den 3 september 1783, samma dag som fördraget i Paris mellan Storbritannien och USA; tillsammans kallas de ofta freden i Paris.
