Gibraltar: Gibraltar
Eliott’s garrison held the Rock throughout. The Spanish lines ran across the sandy isthmus to the north, where the frontier still runs today.: Eliotts garnison höll klippan under hela belägringen. De spanska linjerna gick tvärs över det sandiga näset i norr, där gränsen fortfarande går i dag.
Sortie from Gibraltar: Utfallet från Gibraltar
Some 2,000 men left the fortress at night, spiked the guns and fired the magazines of the Spanish forward batteries, and were back before dawn.: Omkring 2 000 man lämnade fästningen nattetid, spikade igen kanonerna och satte eld på krutförråden i de främre spanska batterierna och var tillbaka före gryningen.
16 January 1780: 16 januari 1780
Juan de Lángara’s squadron was overtaken by Rodney’s larger fleet in stormy weather. Lángara was captured, and the Santo Domingo exploded with almost all its crew.: Juan de Lángaras eskader hanns upp av Rodneys större flotta i stormigt väder. Lángara tillfångatogs, och Santo Domingo exploderade med nästan hela sin besättning.
Rodney: Rodney
On 19 August 1781 a Spanish army of some 8,000 men under the Duc de Crillon landed on Minorca, British since 1763, and besieged Fort St Philip, which guarded Port Mahon; French and German regiments later raised it to about 14,000. General James Murray’s garrison held out for five months, but shut inside the fort without fresh food it was ravaged by scurvy, and by February only a few hundred men were fit to stand. On 5 February 1782 Murray surrendered, and about 2,500 men marched out. Crillon then took command at Gibraltar, where French and Spanish forces prepared a grand assault by land and sea.: Den 19 augusti 1781 landsteg en spansk armé på omkring 8 000 man under hertigen av Crillon på Menorca, brittiskt sedan 1763, och belägrade Fort St Philip, som skyddade Port Mahon; franska och tyska regementen ökade den senare till omkring 14 000 man. General James Murrays garnison höll ut i fem månader, men instängd i fortet utan färsk föda härjades den av skörbjugg, och i februari kunde bara några hundra man stå på benen. Den 5 februari 1782 kapitulerade Murray, och omkring 2 500 man marscherade ut. Crillon tog sedan befälet vid Gibraltar, där franska och spanska styrkor förberedde ett storanfall till lands och till sjöss.
The French engineer Jean d’Arçon had designed ten floating batteries, with thick walls of timber and wet sand meant to be proof against shot and fire. They attacked on 13 September 1782 while hundreds of guns fired from the isthmus. The garrison answered with red-hot shot, and by night the batteries were burning; all ten were lost, and of their crews some 700 were killed, wounded or drowned, though British boats under Roger Curtis rescued hundreds. In October Admiral Howe brought another convoy into the bay. Peace preliminaries ended the siege on 7 February 1783, and at Versailles on 3 September Spain kept Minorca and regained Florida, but not Gibraltar.: Den franske ingenjören Jean d’Arçon hade konstruerat tio flytande batterier med tjocka väggar av trä och våt sand, avsedda att stå emot kulor och eld. De anföll den 13 september 1782 medan hundratals kanoner sköt från näset. Garnisonen svarade med glödgade kulor, och till natten brann batterierna; alla tio gick förlorade, och av besättningarna dödades, sårades eller drunknade omkring 700, även om brittiska båtar under Roger Curtis räddade hundratals. I oktober förde amiral Howe ytterligare en konvoj in i bukten. Fredspreliminärer avslutade belägringen den 7 februari 1783, och i Versailles den 3 september behöll Spanien Menorca och återfick Florida, men inte Gibraltar.
