Anglo-Turkish War of 1807–1809: Engelsk-turkiska kriget 1807–1809
A war between Britain and the Ottoman Empire during the Napoleonic Wars, after Sultan Selim III, encouraged by the French ambassador Horace Sébastiani, drew closer to France and went to war with Russia. In February 1807 a British squadron under Vice-Admiral Sir John Duckworth forced the Dardanelles and anchored off Constantinople, but withdrew under fire from strengthened batteries; in March a British force of about 6,000 men landed at Alexandria, but after defeats at Rosetta by the troops of Muhammad Ali it left Egypt in September. The Treaty of the Dardanelles of 5 January 1809 restored peace.: Ett krig mellan Storbritannien och Osmanska riket under Napoleonkrigen, sedan sultan Selim III, uppmuntrad av den franske ambassadören Horace Sébastiani, närmat sig Frankrike och gått i krig mot Ryssland. I februari 1807 forcerade en brittisk eskader under viceamiral sir John Duckworth Dardanellerna och ankrade utanför Konstantinopel, men drog sig tillbaka under eld från förstärkta batterier; i mars landsteg en brittisk styrka på omkring 6 000 man vid Alexandria, men efter nederlag vid Rosetta mot Muhammad Alis trupper lämnade den Egypten i september. Freden i Dardanellerna den 5 januari 1809 återställde freden.
