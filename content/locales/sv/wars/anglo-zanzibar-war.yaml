Anglo-Zanzibar War: Brittisk-zanzibariska kriget
A British naval bombardment of the sultan’s palace in Zanzibar town on 27 August 1896, often called the shortest war in history. Zanzibar had been a British protectorate since 1890, and Britain claimed the right to approve each new sultan. When Sultan Hamad bin Thuwaini died suddenly on 25 August 1896, his cousin Khalid bin Barghash occupied the palace and proclaimed himself sultan with about 2,800 armed supporters, palace guards and a few guns. The British ordered him to stand down by 9 a.m. on 27 August. At 9.02 five Royal Navy ships under Rear Admiral Harry Rawson opened fire; about 38 minutes later the palace was in flames, the sultan’s only warship, the Glasgow, had been sunk and the flag shot down. About 500 of Khalid’s supporters were killed or wounded; one British sailor was wounded. Khalid escaped to the German consulate, and Britain installed Hamud bin Muhammad, who abolished slavery in Zanzibar the following year.: Ett brittiskt flottbombardemang av sultanens palats i staden Zanzibar den 27 augusti 1896, ofta kallat det kortaste kriget i historien. Zanzibar hade varit brittiskt protektorat sedan 1890, och Storbritannien gjorde anspråk på rätten att godkänna varje ny sultan. När sultan Hamad bin Thuwaini dog plötsligt den 25 augusti 1896 besatte hans kusin Khalid bin Barghash palatset och utropade sig till sultan med omkring 2 800 beväpnade anhängare, palatsvakter och några kanoner. Britterna beordrade honom att träda tillbaka senast klockan 9.00 den 27 augusti. Klockan 9.02 öppnade fem fartyg ur Royal Navy under konteramiral Harry Rawson eld; omkring 38 minuter senare stod palatset i lågor, sultanens enda krigsfartyg, Glasgow, hade sänkts och flaggan skjutits ned. Omkring 500 av Khalids anhängare dödades eller sårades; en brittisk sjöman sårades. Khalid flydde till det tyska konsulatet, och Storbritannien insatte Hamud bin Muhammad, som avskaffade slaveriet på Zanzibar året därpå.
