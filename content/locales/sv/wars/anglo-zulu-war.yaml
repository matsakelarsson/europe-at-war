# Svenska översättningar av katalogtexten (våg 13); stegtexterna kommer senare.
Anglo-Zulu War: Zulukriget
? The British invasion of the Zulu kingdom of Cetshwayo in 1879. Sir Bartle Frere, the British high commissioner, saw the independent Zulu kingdom and its army as the main obstacle to his plan for a confederation of southern Africa under British rule, and in December 1878, without the British government’s approval, sent Cetshwayo an ultimatum that no Zulu king could accept, demanding among other things that he disband his army. On 11 January 1879 Lord Chelmsford’s army crossed into Zululand in three columns. On 22 January a Zulu army of some 20,000 men destroyed the British camp at Isandlwana, killing more than 1,300 soldiers, one of the worst defeats of a colonial army in Africa; that evening and night the small garrison of Rorke’s Drift beat off a Zulu attack. The coastal column was besieged at Eshowe, but in the north Evelyn Wood’s column repulsed the main Zulu army at Kambula on 29 March, and on 2 April Chelmsford won at Gingindlovu and relieved Eshowe. With reinforcements from Britain he invaded again and defeated the Zulu army at Ulundi on 4 July, burning the royal homestead of oNdini. Cetshwayo was captured on 28 August, and Sir Garnet Wolseley divided the kingdom among thirteen chiefs, a settlement that led to civil war in the 1880s and to the British annexation of Zululand in 1887.
: Den brittiska invasionen av Cetshwayos Zulurike 1879. Sir Bartle Frere, den brittiske högkommissarien, såg det självständiga Zuluriket och dess armé som det främsta hindret för sin plan för en federation av södra Afrika under brittiskt styre, och i december 1878 sände han, utan den brittiska regeringens godkännande, Cetshwayo ett ultimatum som ingen zulukung kunde godta och som bland annat krävde att han skulle upplösa sin armé. Den 11 januari 1879 gick Lord Chelmsfords armé in i Zululand i tre kolonner. Den 22 januari förintade en zuluarmé på omkring 20 000 man det brittiska lägret vid Isandlwana och dödade mer än 1 300 soldater, ett av de värsta nederlag en kolonialarmé lidit i Afrika; samma kväll och natt slog den lilla garnisonen vid Rorke’s Drift tillbaka ett zuluanfall. Kustkolonnen belägrades vid Eshowe, men i norr slog Evelyn Woods kolonn tillbaka den zuluiska huvudarmén vid Kambula den 29 mars, och den 2 april segrade Chelmsford vid Gingindlovu och undsatte Eshowe. Med förstärkningar från Storbritannien invaderade han på nytt, besegrade zuluarmén vid Ulundi den 4 juli och brände kungsgården oNdini. Cetshwayo tillfångatogs den 28 augusti, och Sir Garnet Wolseley delade riket mellan tretton hövdingar, en uppgörelse som ledde till inbördeskrig på 1880-talet och till den brittiska annekteringen av Zululand 1887.
