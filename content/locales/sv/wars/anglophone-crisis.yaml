Anglophone Crisis: Den anglofona krisen
? The armed conflict in Cameroon’s two English-speaking regions, the Northwest and Southwest, between the Cameroonian army and separatists who seek an independent state they call Ambazonia. It grew out of protests by lawyers and teachers from October 2016 against the imposition of French-speaking judges and teachers and the long marginalisation of the Anglophone regions, the former British Southern Cameroons, which joined Cameroon in 1961. The government answered with arrests, killings of protesters and a three-month internet shutdown; on 1 October 2017 separatist leaders declared Ambazonia’s independence, and armed groups began attacking soldiers and police. The war has been fought between dozens of separatist militias, which enforce school boycotts and “ghost town” lockdowns and kidnap for ransom, and the army, which has burned villages and killed civilians. A national dialogue in 2019 brought a special status for the two regions but no peace, and mediation by Switzerland and Canada failed. By early 2023 more than 6,000 people had been killed, according to the International Crisis Group, and hundreds of thousands had been displaced. Fighting continued in 2026.
: Den väpnade konflikten i Kameruns två engelskspråkiga regioner, Nordväst och Sydväst, mellan den kamerunska armén och separatister som eftersträvar en självständig stat som de kallar Ambazonia. Den växte fram ur protester som advokater och lärare inledde i oktober 2016 mot att franskspråkiga domare och lärare tvingades på dem och mot den långvariga marginaliseringen av de engelskspråkiga regionerna, det tidigare Brittiska Södra Kamerun, som anslöt sig till Kamerun 1961. Regeringen svarade med arresteringar, dödande av demonstranter och en tre månader lång avstängning av internet; den 1 oktober 2017 utropade separatistledare Ambazonias självständighet, och väpnade grupper började anfalla soldater och poliser. Kriget har utkämpats mellan dussintals separatistmiliser, som genomdriver skolbojkotter och nedstängningar av typen ”spökstad” och kidnappar för lösensumma, och armén, som har bränt byar och dödat civila. En nationell dialog 2019 gav de två regionerna en särskild status men ingen fred, och medling av Schweiz och Kanada misslyckades. I början av 2023 hade mer än 6 000 människor dödats, enligt International Crisis Group, och hundratusentals hade fördrivits. Striderna fortsatte 2026.
