# Svenska översättningar av katalogtexten (våg 13); stegtexterna kommer senare.
Angolan Civil War: Inbördeskriget i Angola
? "The war for power in independent Angola between the MPLA, which held Luanda and proclaimed the People’s Republic of Angola on 11 November 1975, and its rivals UNITA and, until 1976, the FNLA. It began as a Cold War battleground: the Soviet Union armed the MPLA and some 36,000 Cuban troops arrived by early 1976, while South Africa invaded in support of UNITA and the FNLA (Operation Savannah), Zaire backed the FNLA and the United States gave covert aid. The MPLA won the first round; UNITA under Jonas Savimbi rebuilt its army in the south-east with South African and, from 1985, American help. After the battles around Cuito Cuanavale in 1987–1988, the New York Accords brought a Cuban withdrawal and Namibia’s independence, and the Bicesse Accords of 1991 led to elections in 1992. Savimbi rejected his defeat, and the war resumed more destructively than before; the Lusaka Protocol of 1994 broke down in 1998. The war ended only when government troops killed Savimbi on 22 February 2002; the Luena Memorandum of 4 April 2002 made peace. Estimates of the dead range from 500,000 to 800,000, and some 4 million people were displaced."
: "Kriget om makten i det självständiga Angola mellan MPLA, som höll Luanda och utropade Folkrepubliken Angola den 11 november 1975, och dess rivaler Unita och, fram till 1976, FNLA. Det började som en skådeplats för det kalla kriget: Sovjetunionen beväpnade MPLA och i början av 1976 hade omkring 36 000 kubanska soldater anlänt, medan Sydafrika invaderade till stöd för Unita och FNLA (Operation Savannah), Zaire stödde FNLA och USA gav hemlig hjälp. MPLA vann den första omgången; Unita under Jonas Savimbi byggde upp sin armé på nytt i sydost med sydafrikansk och från 1985 amerikansk hjälp. Efter striderna kring Cuito Cuanavale 1987–1988 ledde New York-avtalen till ett kubanskt tillbakadragande och till Namibias självständighet, och Bicesseavtalet 1991 ledde till val 1992. Savimbi godtog inte sitt nederlag, och kriget återupptogs, mer förödande än tidigare; Lusakaprotokollet 1994 bröt samman 1998. Kriget tog slut först när regeringstrupper dödade Savimbi den 22 februari 2002; genom Luenamemorandumet den 4 april 2002 slöts fred. Uppskattningarna av antalet döda varierar från 500 000 till 800 000, och omkring 4 miljoner människor fördrevs."
