# Svenska översättningar av katalogtexten (våg 13); stegtexterna kommer senare.
Angolan War of Independence: Angolas självständighetskrig
? "The war fought in 1961–1974 by Angolan nationalist movements against Portuguese rule, the first and longest theatre of the Portuguese Colonial War. A strike by cotton workers in the Baixa de Cassanje in January 1961 was crushed from the air; on 4 February militants attacked the prisons of Luanda, and on 15 March fighters of Holden Roberto’s UPA rose in the coffee country of the north, killing about 1,000 settlers and thousands of African workers. Portugal’s army and settler militias answered with reprisals that killed tens of thousands and drove hundreds of thousands of Bakongo into the Congo. The war then became a guerrilla war fought from neighbouring countries by three rival movements: the FNLA from Zaire, the MPLA of Agostinho Neto from Congo-Brazzaville and, from 1966, Zambia, and Jonas Savimbi’s UNITA in the east. Portugal, with up to some 65,000 troops, held the towns and most of the country, and the movements fought each other as well as the Portuguese. The war ended with the Carnation Revolution in Lisbon on 25 April 1974; the Alvor Agreement of January 1975 set independence for 11 November 1975, but the movements were already fighting the civil war that followed."
: "Det krig som angolanska nationalistiska rörelser förde 1961–1974 mot det portugisiska styret, den första och längsta krigsskådeplatsen i det portugisiska kolonialkriget. En strejk bland bomullsarbetare i Baixa de Cassanje i januari 1961 krossades från luften; den 4 februari angrep militanta fängelserna i Luanda, och den 15 mars reste sig kämpar från Holden Robertos UPA i kaffedistrikten i norr och dödade omkring 1 000 bosättare och tusentals afrikanska arbetare. Portugals armé och bosättarmiliser svarade med repressalier som dödade tiotusentals och drev hundratusentals bakongo in i Kongo. Kriget blev sedan ett gerillakrig som fördes från grannländerna av tre rivaliserande rörelser: FNLA från Zaire, Agostinho Netos MPLA från Kongo-Brazzaville och från 1966 Zambia, och Jonas Savimbis Unita i öster. Med upp till omkring 65 000 soldater höll Portugal städerna och större delen av landet, och rörelserna bekämpade varandra lika väl som portugiserna. Kriget slutade med nejlikerevolutionen i Lissabon den 25 april 1974; Alvoravtalet i januari 1975 fastställde självständigheten till den 11 november 1975, men rörelserna utkämpade redan det inbördeskrig som följde."
