Annexation of Goa: Annekteringen av Goa
India’s military takeover of Portuguese India, Goa, Daman and Diu, in December 1961, code-named Operation Vijay. Portugal had ruled Goa since 1510 and, under Salazar, refused to negotiate after Indian independence, declaring its Indian territories overseas provinces of Portugal. After years of failed diplomacy and the suppression of nonviolent protests, India sent about 45,000 troops with air and naval support against a Portuguese garrison of some 3,500. The Governor-General, Manuel António Vassalo e Silva, disobeyed Salazar’s order to fight to the last and surrendered on 19 December after about 36 hours. India calls the operation the Liberation of Goa; Portugal called it an invasion and recognised Indian sovereignty only in 1974.: Indiens militära övertagande av Portugisiska Indien – Goa, Daman och Diu – i december 1961, med kodnamnet Operation Vijay. Portugal hade styrt Goa sedan 1510 och vägrade under Salazar att förhandla efter Indiens självständighet; i stället förklarade landet sina indiska områden för portugisiska utomeuropeiska provinser. Efter år av misslyckad diplomati och undertryckta ickevåldsprotester sände Indien omkring 45 000 soldater med flyg- och sjöunderstöd mot en portugisisk garnison på omkring 3 500 man. Generalguvernören, Manuel António Vassalo e Silva, trotsade Salazars order att strida till det sista och kapitulerade den 19 december efter omkring 36 timmar. Indien kallar operationen Goas befrielse; Portugal kallade den en invasion och erkände indisk suveränitet först 1974.
