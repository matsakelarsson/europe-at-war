Annexation of Hyderabad: Annekteringen av Hyderabad
India’s military takeover of the princely state of Hyderabad in September 1948, code-named Operation Polo and officially called a “police action”. The Nizam, Mir Osman Ali Khan, ruled the largest princely state, a mostly Hindu land in the middle of the Deccan, and after independence in 1947 refused to join India or Pakistan. While talks dragged on under a standstill agreement, the Razakars, a militia of the Majlis-e-Ittehadul Muslimeen led by Qasim Razvi, terrorised opponents, and a communist-led peasant rising held much of Telangana. On 13 September 1948 Indian forces invaded from west and east, and after four days the Nizam ordered a ceasefire; his army surrendered on 18 September. The fighting was brief, but in the violence that followed tens of thousands of people, most of them Muslims, were killed.: Indiens militära övertagande av furstestaten Hyderabad i september 1948, med kodnamnet Operation Polo och officiellt kallat en ”polisaktion”. Nizamen, Mir Osman Ali Khan, styrde den största furstestaten, ett till största delen hinduiskt land mitt i Deckan, och vägrade efter självständigheten 1947 att ansluta sig till Indien eller Pakistan. Medan förhandlingarna drog ut på tiden under ett avtal om bibehållet status quo terroriserade razakarerna – en milis knuten till Majlis-e-Ittehadul Muslimeen och ledd av Qasim Razvi – sina motståndare, och ett kommunistlett bondeuppror behärskade stora delar av Telangana. Den 13 september 1948 invaderade indiska styrkor från väster och öster, och efter fyra dagar beordrade nizamen eldupphör; hans armé kapitulerade den 18 september. Striderna var kortvariga, men i det våld som följde dödades tiotusentals människor, de flesta av dem muslimer.
