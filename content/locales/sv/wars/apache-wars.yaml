# Svenska översättningar av katalogtexten (våg 14); stegtexterna kommer senare.
Apache Wars: Apachekrigen
? The wars of 1849–1886 between the Apache peoples, with their Yavapai neighbours, and the United States and Mexico in the deserts and mountains of Arizona, New Mexico, west Texas, Sonora and Chihuahua. The Apache, the Chiricahua, Western Apache, Mescalero, Jicarilla and others, lived in small independent bands and had raided Spanish and Mexican settlements for more than a century, while Sonora and Chihuahua paid bounties for Apache scalps. When the United States took the region from Mexico in 1848 and 1854, miners, ranchers and soldiers moved into Apache country. The Bascom affair of 1861 turned the Chokonen leader Cochise against the Americans, and the killing of Mangas Coloradas under a flag of truce in 1863 deepened the war. After the Camp Grant massacre of 1871 the government made peace with Cochise and set up reservations, while General George Crook’s columns, guided by Apache scouts, forced the Yavapai and Tonto Apache onto them. The concentration of the bands at San Carlos from 1875 led to the breakouts of Victorio in 1879, who was killed by Mexican troops at Tres Castillos in 1880, and of Juh, Naiche and Geronimo in 1881 and 1885. Geronimo’s surrender at Skeleton Canyon on 4 September 1886 ended the wars; the whole Chiricahua people, including the scouts who had served the army, were sent as prisoners of war to Florida, Alabama and Oklahoma and held until 1913.
: Krigen 1849–1886 mellan apacherna, tillsammans med sina grannar yavapai, och USA och Mexiko i öknarna och bergen i Arizona, New Mexico, västra Texas, Sonora och Chihuahua. Apacherna (chiricahua, västapacher, mescalero, jicarilla och andra) levde i små självständiga grupper och hade plundrat spanska och mexikanska bosättningar i mer än ett sekel, medan Sonora och Chihuahua betalade skottpengar för apacheskalper. När USA tog regionen från Mexiko 1848 och 1854 flyttade gruvarbetare, ranchägare och soldater in i apachernas land. Bascomaffären 1861 vände chokonenledaren Cochise mot amerikanerna, och dödandet av Mangas Coloradas under parlamentärflagg 1863 fördjupade kriget. Efter massakern vid Camp Grant 1871 slöt regeringen fred med Cochise och upprättade reservat, medan general George Crooks kolonner, vägledda av apachespanare, tvingade yavapai och tontoapacher att flytta in på dem. Koncentrationen av grupperna till San Carlos från 1875 ledde till att Victorio bröt sig ut 1879 – han dödades av mexikanska trupper vid Tres Castillos 1880 – och att Juh, Naiche och Geronimo gjorde detsamma 1881 och 1885. Geronimos kapitulation vid Skeleton Canyon den 4 september 1886 avslutade krigen; hela chiricahuafolket, inklusive de spanare som hade tjänat armén, sändes som krigsfångar till Florida, Alabama och Oklahoma och hölls fånget till 1913.
