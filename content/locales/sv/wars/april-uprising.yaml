In November 1875 the Bulgarian Revolutionary Central Committee, meeting in exile at Giurgiu in Romania, planned a general rising for the spring and divided the country into revolutionary districts. Arms were hoarded, and in the Sredna Gora the rebels even made a cannon out of cherry wood. A delegate betrayed the plan after a meeting at Oborishte, and Ottoman police tried to arrest the leaders in Koprivshtitsa. On 2 May 1876 Todor Kableshkov’s men attacked the police post there and proclaimed the rising, two weeks early. It spread across the Sredna Gora and the western Rhodopes, with smaller risings around Gabrovo, Tryavna and Sliven and near Berovo in Macedonia.: I november 1875 planerade Bulgariska revolutionära centralkommittén, som sammanträdde i exil i Giurgiu i Rumänien, en allmän resning till våren och delade in landet i revolutionära distrikt. Vapen samlades i hemlighet, och i Sredna Gora tillverkade rebellerna till och med en kanon av körsbärsträ. En delegat förrådde planen efter ett möte i Oborisjte, och osmansk polis försökte arrestera ledarna i Koprivsjtitsa. Den 2 maj 1876 anföll Todor Kablesjkovs män polisstationen där och utropade resningen, två veckor i förtid. Den spred sig över Sredna Gora och västra Rhodoperna, med mindre resningar kring Gabrovo, Trjavna och Sliven och nära Berovo i Makedonien.
Rather than send regular troops, the authorities largely armed bashi-bazouk irregulars, among them Pomaks and Circassians, who put down the rising by the middle of May with massacres. Panagyurishte, Perushtitsa, Klisura and Batak were sacked; at Batak alone some 5,000 people are thought to have been killed. Bratsigovo, which fought regular troops, suffered far fewer deaths. On 29 May the poet Hristo Botev landed from a Danube steamer at Kozloduy with about 200 émigrés from Romania; his band was scattered in the Vratsa Balkan, and he was killed on 1 June.: I stället för att sända reguljära trupper beväpnade myndigheterna till stor del irreguljära basjibozuker, bland dem pomaker och tjerkesser, som slog ned resningen till mitten av maj under massakrer. Panagjurisjte, Perusjtitsa, Klisura och Batak plundrades; bara i Batak tros omkring 5 000 människor ha dödats. Bratsigovo, som stred mot reguljära trupper, fick betydligt färre döda. Den 29 maj landsteg poeten Christo Botev från en Donauångare vid Kozloduj med omkring 200 emigranter från Rumänien; hans skara skingrades i Vratsabalkan, och han dödades den 1 juni.
The Americans Eugene Schuyler and Januarius MacGahan reported the killings, and a British inquiry by Walter Baring largely confirmed them. William Gladstone’s pamphlet Bulgarian Horrors and the Question of the East, published in September 1876, roused British opinion, and the British government, Russia’s rival, could no longer support the Ottomans as before. When the Constantinople Conference of the powers failed to impose reforms early in 1877, Russia went to war, and in 1878 an autonomous Bulgarian principality was created.: Amerikanerna Eugene Schuyler och Januarius MacGahan rapporterade om morden, och en brittisk undersökning under Walter Baring bekräftade dem i stort sett. William Gladstones pamflett Bulgarian Horrors and the Question of the East, som gavs ut i september 1876, väckte den brittiska opinionen, och den brittiska regeringen, Rysslands rival, kunde inte längre stödja osmanerna som tidigare. När stormakternas konferens i Konstantinopel misslyckades med att genomdriva reformer i början av 1877 gick Ryssland i krig, och 1878 skapades ett autonomt bulgariskt furstendöme.
