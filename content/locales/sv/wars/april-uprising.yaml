April Uprising: Aprilupproret
A Bulgarian rising against Ottoman rule in the spring of 1876, organised by the Bulgarian Revolutionary Central Committee and centred on the Sredna Gora and the western Rhodopes. It was crushed within weeks, largely by bashi-bazouk irregulars, with massacres at Batak, Perushtitsa, Panagyurishte and elsewhere; reports of the “Bulgarian horrors” turned European opinion against the Ottomans and prepared the way for the Russo-Turkish War of 1877–1878 and a Bulgarian state.: En bulgarisk resning mot det osmanska styret våren 1876, organiserad av Bulgariska revolutionära centralkommittén och med centrum i Sredna Gora och västra Rhodoperna. Den slogs ned inom några veckor, till stor del av irreguljära basjibozuker, med massakrer i Batak, Perusjtitsa, Panagjurisjte och på andra håll; rapporterna om ”de bulgariska illdåden” vände den europeiska opinionen mot osmanerna och banade väg för rysk-turkiska kriget 1877–1878 och en bulgarisk stat.
