Giurgiu: Giurgiu
November 1875: november 1875
Bulgarian revolutionaries in Romania met here, across the Danube from Ruse, and decided on a rising for the spring of 1876.: Bulgariska revolutionärer i Rumänien möttes här, på andra sidan Donau från Ruse, och beslöt om en resning våren 1876.
Oborishte: Oborisjte
April 1876: april 1876
Delegates of the fourth revolutionary district met in the forest here to prepare the rising; one of them betrayed it to the authorities.: Delegater från det fjärde revolutionära distriktet möttes i skogen här för att förbereda resningen; en av dem förrådde den för myndigheterna.
Koprivshtitsa: Koprivsjtitsa
2 May 1876: 2 maj 1876
Todor Kableshkov’s rebels attacked the Ottoman konak and proclaimed the rising in a letter to Panagyurishte signed with the blood of the killed local governor, the “Bloody Letter”.: Todor Kablesjkovs rebeller anföll den osmanska konaken och utropade resningen i ett brev till Panagjurisjte, undertecknat med den dödade lokala guvernörens blod – ”det blodiga brevet”.
Panagyurishte: Panagjurisjte
May 1876: maj 1876
Centre of the rising, taken and burned by Ottoman troops and bashi-bazouks; some 3,000 people were killed by Schuyler’s estimate.: Resningens centrum, intaget och nedbränt av osmanska trupper och basjibozuker; enligt Schuylers uppskattning dödades omkring 3 000 människor.
Batak: Batak
After the defenders gave up their arms on Ahmed Aga’s promise to withdraw, his bashi-bazouks killed most of the townspeople, many of them in the church of Sveta Nedelya.: Sedan försvararna lämnat ifrån sig sina vapen mot Ahmed agas löfte att dra sig tillbaka dödade hans basjibozuker de flesta av stadens invånare, många av dem i kyrkan Sveta Nedelja.
Perushtitsa: Perusjtitsa
The last defenders held out in the church before it was taken; about 1,000 people were killed by Schuyler’s estimate.: De sista försvararna höll ut i kyrkan innan den intogs; enligt Schuylers uppskattning dödades omkring 1 000 människor.
Bratsigovo: Bratsigovo
One of the best-prepared centres, it held out for days against regular troops. Its leader, Vasil Petleshkov, took all the blame for the rising on himself.: Ett av de bäst förberedda centrumen, som höll ut i flera dagar mot reguljära trupper. Dess ledare, Vasil Petlesjkov, tog på sig hela skulden för resningen.
Kozloduy: Kozloduj
29 May 1876: 29 maj 1876
Botev’s band seized the Austrian steamer Radetzky on the Danube and made its captain land them on the Bulgarian bank.: Botevs skara kapade den österrikiska ångaren Radetzky på Donau och tvingade dess kapten att landsätta dem på den bulgariska stranden.
Vratsa Balkan: Vratsabalkan
After fighting Ottoman troops and Circassians, Botev was shot dead in the mountains near Vratsa, at Okolchitsa or the nearby Vola peak, and his band dispersed.: Efter strider mot osmanska trupper och tjerkesser sköts Botev ihjäl i bergen nära Vratsa, vid Okoltjitsa eller den närbelägna toppen Vola, och hans skara skingrades.
