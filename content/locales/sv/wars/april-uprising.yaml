Koprivshtitsa, Batak and Botev: Koprivsjtitsa, Batak och Botev
April – June 1876: april – juni 1876
Dates are New Style (Gregorian). Bulgarians used the Julian calendar, then 12 days behind, and Bulgaria commemorates the rising on 20 April, the Old Style date of its outbreak at Koprivshtitsa (2 May New Style).: Datumen anges enligt nya stilen (den gregorianska kalendern). Bulgarerna använde den julianska kalendern, som då låg 12 dagar efter, och Bulgarien högtidlighåller resningen den 20 april, datumet enligt gamla stilen för dess utbrott i Koprivsjtitsa (2 maj enligt nya stilen).
The number of dead is disputed. Contemporary investigators put the Bulgarian dead at 12,000 (Walter Baring) to 15,000 (Eugene Schuyler), and the French and Russian consuls at 25,000–40,000; some later historians, notably Justin McCarthy and Stanford Shaw, give much lower figures and stress Muslim victims, which the contemporary reports put at a few hundred.: Antalet döda är omstritt. Samtida utredare uppskattade de bulgariska dödsoffren till mellan 12 000 (Walter Baring) och 15 000 (Eugene Schuyler), och de franska och ryska konsulerna till 25 000–40 000; några senare historiker, särskilt Justin McCarthy och Stanford Shaw, anger mycket lägre siffror och betonar de muslimska offren, som de samtida rapporterna uppskattade till några hundra.
