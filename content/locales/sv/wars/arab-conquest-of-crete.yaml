The Andalusis had held the city for some years. Abdallah ibn Tahir, sent to restore Abbasid rule in Egypt, besieged them and allowed them to sail away.: Andaluserna hade hållit staden i några år. Abdallah ibn Tahir, som sänts för att återupprätta det abbasidiska styret i Egypten, belägrade dem och lät dem segla bort.
Gortyn: Gortyn
The old capital of Byzantine Crete, in the Messara plain. Some historians think the Andalusis ruled from here before Chandax was built.: Det bysantinska Kretas gamla huvudstad, på Messaraslätten. Vissa historiker tror att andaluserna styrde härifrån innan Chandax byggdes.
Chandax: Chandax
c. 827: omkring 827
The Andalusis built a fortified town on the north coast, protected by a great moat, which became the emirate’s capital.: Andaluserna byggde en befäst stad på nordkusten, skyddad av en stor vallgrav, som blev emiratets huvudstad.
Kos: Kos
Krateros, the Byzantine commander, escaped here after his army was routed, but was caught by the Andalusis and crucified.: Krateros, den bysantinske befälhavaren, flydde hit sedan hans armé slagits på flykten, men greps av andaluserna och korsfästes.
