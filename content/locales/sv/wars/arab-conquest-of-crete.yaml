The Andalusi exiles take Crete: De andalusiska landsflyktingarna tar Kreta
c. 824–827: omkring 824–827
The date of the landing is uncertain. Muslim sources put it in 827 or 828, after the expulsion from Alexandria; Byzantine sources place it soon after the revolt of Thomas the Slav (821–823), and several historians now prefer about 824. The landing place is unknown.: Datumet för landstigningen är osäkert. Muslimska källor förlägger den till 827 eller 828, efter fördrivningen från Alexandria; bysantinska källor placerar den strax efter Thomas slavens uppror (821–823), och flera historiker föredrar nu omkring 824. Landstigningsplatsen är okänd.
The exiles are traditionally said to be survivors of the Revolt of the Suburb in Córdoba in 818, but Andalusi corsairs were active in Alexandria earlier, and their leader came from Fahs al-Ballut (Los Pedroches), north of Córdoba. Their numbers are estimated at about 12,000 people, of whom some 3,000 were fighting men.: Landsflyktingarna sägs traditionellt ha varit överlevande från förstadsrevolten i Córdoba 818, men andalusiska korsarer var verksamma i Alexandria redan tidigare, och deras ledare kom från Fahs al-Ballut (Los Pedroches) norr om Córdoba. Deras antal uppskattas till omkring 12 000 människor, varav omkring 3 000 stridande män.
The Byzantine reconquest is told in the Byzantine reconquest of Crete.: Den bysantinska återerövringen skildras under Bysantinska återerövringen av Kreta.
