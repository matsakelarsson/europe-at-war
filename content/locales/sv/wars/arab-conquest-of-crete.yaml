Byzantine success: Bysantinska framgångar
In 818 the emir of Córdoba, al-Hakam I, crushed a revolt in the suburb south of his capital and exiled its people. Many of them, with other Andalusi sailors, made their way to Alexandria, where they seized power in the confusion of the Abbasid civil war. In 827 the Abbasid general Abdallah ibn Tahir besieged them and let them leave with their families in some forty ships. Led by Abu Hafs Umar al-Balluti, they landed on Crete, which they may already have raided. Byzantine writers say Abu Hafs burned the ships so his men could not turn back, but as they had brought their families, this is probably a later story.: År 818 slog emiren av Córdoba, al-Hakam I, ned en revolt i förstaden söder om sin huvudstad och förvisade dess invånare. Många av dem tog sig, tillsammans med andra andalusiska sjömän, till Alexandria, där de grep makten i förvirringen under det abbasidiska inbördeskriget. År 827 belägrade den abbasidiske generalen Abdallah ibn Tahir dem och lät dem lämna staden med sina familjer i ett fyrtiotal fartyg. Under ledning av Abu Hafs Umar al-Balluti landsteg de på Kreta, som de kanske redan hade plundrat. Bysantinska skribenter uppger att Abu Hafs brände fartygen så att hans män inte kunde vända om, men eftersom de hade fört med sig sina familjer är detta troligen en senare berättelse.
The Emperor Michael II, weakened by the revolt of Thomas the Slav, sent a force under Photeinos and Damian, which was beaten; Damian was killed. A second expedition of 70 ships under Krateros won a first battle but was routed in a night attack, and Krateros, who fled to Kos, was captured there and crucified. The Andalusis founded a new capital on the north coast, Chandax, “the castle of the moat”, recognised the Abbasid caliph as their nominal overlord and ruled the island as an independent emirate. Byzantine fleets cleared them from the nearby islands, but Crete became the base for raids across the Aegean for more than a century.: Kejsar Mikael II, försvagad av Thomas slavens uppror, sände en styrka under Photeinos och Damianos, som besegrades; Damianos dödades. En andra expedition på 70 fartyg under Krateros vann ett första slag men slogs på flykten i ett nattligt anfall, och Krateros, som flydde till Kos, tillfångatogs där och korsfästes. Andaluserna grundade en ny huvudstad på nordkusten, Chandax, ”vallgravens borg”, erkände den abbasidiske kalifen som sin nominelle överherre och styrde ön som ett självständigt emirat. Bysantinska flottor rensade de närliggande öarna från dem, men Kreta blev bas för räder över hela Egeiska havet i mer än ett sekel.
