Arab conquest of Crete: Arabernas erövring av Kreta
The conquest of Byzantine Crete by a band of Muslim exiles from al-Andalus, who had held Alexandria until the Abbasids expelled them. Led by Abu Hafs, they beat off the expeditions of the Emperor Michael II, founded Chandax (Heraklion) and made the island an emirate that raided the Aegean until the Byzantines retook it in 961.: Erövringen av det bysantinska Kreta av en skara muslimska landsflyktingar från al-Andalus, som hade hållit Alexandria tills abbasiderna fördrev dem. Under ledning av Abu Hafs slog de tillbaka kejsar Mikael II:s expeditioner, grundade Chandax (Heraklion) och gjorde ön till ett emirat som plundrade i Egeiska havet tills bysantinerna återtog den 961.
