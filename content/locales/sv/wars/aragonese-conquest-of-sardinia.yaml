Aragon struggled to hold the island. The Doria rebelled repeatedly with Genoese backing, and in 1353 Judge Marianus IV of Arborea, who wanted the whole of Sardinia for his own house, joined them. That August an Aragonese and Venetian fleet beat the Genoese off Porto Conte, and in 1354 King Peter IV took Alghero, expelled its people and resettled it with Catalans, whose language is still spoken there. Marianus’s armies overran most of the island in the 1360s, leaving Aragon little more than Cagliari and Alghero. His daughter Eleanor, who ruled for her sons from 1383, kept up the struggle and in about 1392 issued the Carta de Logu, a law code that stayed in force until 1827.: Aragonien hade svårt att hålla ön. Släkten Doria gjorde gång på gång uppror med genuesiskt stöd, och 1353 anslöt sig domaren Marianus IV av Arborea, som ville ha hela Sardinien för sitt eget hus, till dem. I augusti samma år slog en aragonisk-venetiansk flotta genueserna utanför Porto Conte, och 1354 intog kung Peter IV Alghero, fördrev dess invånare och befolkade staden på nytt med katalaner, vars språk fortfarande talas där. Marianus arméer erövrade större delen av ön på 1360-talet och lämnade Aragonien med knappt mer än Cagliari och Alghero. Hans dotter Eleonora, som från 1383 styrde för sina söner, fortsatte kampen och utfärdade omkring 1392 Carta de Logu, en lagbok som gällde fram till 1827.
In 1409 Martin the Younger, King of Sicily and heir to Aragon, brought an army to Sardinia. On 30 June at Sanluri he crushed the army of Arborea and its Genoese allies under the new judge, William III of Narbonne, a French grandson of Eleanor’s sister; thousands of Sardinians were killed. Martin died of malaria at Cagliari on 25 July, but Oristano surrendered in 1410, and its lord, Leonardo Cubello, became Marquis of Oristano under the crown. William held out in the north until 1420, when he sold his remaining rights to Alfonso V for 100,000 gold florins. Castelsardo, the last Doria stronghold, fell in 1448.: År 1409 förde Martin den yngre, kung av Sicilien och arvinge till Aragonien, en armé till Sardinien. Den 30 juni vid Sanluri krossade han Arboreas och dess genuesiska allierades armé under den nye domaren Vilhelm III av Narbonne, ett franskt barnbarn till Eleonoras syster; tusentals sardinier dödades. Martin dog i malaria i Cagliari den 25 juli, men Oristano kapitulerade 1410, och dess herre, Leonardo Cubello, blev markis av Oristano under kronan. Vilhelm höll ut i norr till 1420, då han sålde sina återstående rättigheter till Alfons V för 100 000 guldfloriner. Castelsardo, släkten Dorias sista fäste, föll 1448.
