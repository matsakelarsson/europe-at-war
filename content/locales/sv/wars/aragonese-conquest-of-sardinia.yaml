Aragonese conquest of Sardinia: Aragoniens erövring av Sardinien
The long conquest of Sardinia by the Crown of Aragon, to which the pope had granted the island in 1297. The Infante Alfonso took the Pisan lands in 1323–1324, creating the Kingdom of Sardinia, but Aragon then fought the Doria and Genoa and, from 1353, the native Judicate of Arborea, which at times held most of the island; Martin the Younger’s victory at Sanluri in 1409 broke Arborea, and its last judge sold his rights in 1420.: Aragoniska kronans utdragna erövring av Sardinien, som påven hade förlänat den 1297. Infanten Alfons tog de pisanska områdena 1323–1324 och skapade kungariket Sardinien, men Aragonien fick sedan strida mot släkten Doria och Genua och från 1353 mot det inhemska judikatet Arborea, som stundom behärskade större delen av ön; Martin den yngres seger vid Sanluri 1409 knäckte Arborea, och dess siste domare sålde sina rättigheter 1420.
