The war with Arborea: Kriget mot Arborea
Medieval Sardinia was divided into four judicates (giudicati), native kingdoms ruled by judges. By 1323 only Arborea survived; Pisa held the former judicates of Cagliari and Gallura, and the Genoese Doria and Malaspina families and the city of Sassari held most of the north.: Det medeltida Sardinien var indelat i fyra judikat (giudicati), inhemska kungariken som styrdes av domare. År 1323 fanns bara Arborea kvar; Pisa höll de tidigare judikaten Cagliari och Gallura, och de genuesiska släkterna Doria och Malaspina samt staden Sassari höll större delen av norr.
Arborea fought on Aragon’s side in 1323–1324 and against it from 1353. The war of 1353–1420 is often called the Sardinian–Catalan or Sardinian–Aragonese war, and was broken by several truces and peaces (1355, 1388).: Arborea stred på Aragoniens sida 1323–1324 och mot det från 1353. Kriget 1353–1420 kallas ofta det sardinsk-katalanska eller sardinsk-aragoniska kriget och avbröts av flera stillestånd och fredsslut (1355, 1388).
