In 1297 Pope Boniface VIII had granted Sardinia and Corsica to James II of Aragon in return for his giving up Sicily, but the island was not his to take. Pisa ruled the south and east, the Genoese Doria and Malaspina families much of the north, and the Judicate of Arborea, the last of Sardinia’s native kingdoms, the west. In April 1323 Judge Hugh II of Arborea declared himself James’s vassal and attacked the Pisans. On 13 June an Aragonese fleet of some 300 ships under James’s heir, the Infante Alfonso, landed at Palma di Sulcis in the south-west.: År 1297 hade påven Bonifatius VIII förlänat Sardinien och Korsika åt Jakob II av Aragonien i utbyte mot att han gav upp Sicilien, men ön var inte hans att ta. Pisa styrde södra och östra delen, de genuesiska släkterna Doria och Malaspina stora delar av norr och judikatet Arborea, det sista av Sardiniens inhemska kungariken, den västra. I april 1323 förklarade sig domaren Hugo II av Arborea som Jakobs vasall och anföll pisanerna. Den 13 juni landsteg en aragonisk flotta på omkring 300 fartyg under Jakobs arvinge, infanten Alfons, vid Palma di Sulcis i sydväst.
Alfonso besieged the silver-mining town of Villa di Chiesa (Iglesias), which held out for seven months until hunger forced it to surrender on 7 February 1324, while malaria took a heavy toll of his army. He then turned on Cagliari. On 29 February a Pisan relief army was beaten at Lucocisterna, near Elmas, and the same day the Aragonese fleet beat the Pisan ships off Cagliari. In the peace of June 1324 Pisa gave up its Sardinian lands, keeping only the castle of Cagliari as a fief; after another war it lost that too in 1326. Its Pisan people were expelled, and Cagliari, settled by Catalans, became the capital of the Kingdom of Sardinia.: Alfons belägrade silvergruvstaden Villa di Chiesa (Iglesias), som höll ut i sju månader tills hungern tvingade den att kapitulera den 7 februari 1324, medan malarian skördade många offer i hans armé. Därefter vände han sig mot Cagliari. Den 29 februari besegrades en pisansk undsättningsarmé vid Lucocisterna nära Elmas, och samma dag slog den aragoniska flottan de pisanska fartygen utanför Cagliari. Vid freden i juni 1324 avstod Pisa sina sardinska områden och behöll bara borgen i Cagliari som län; efter ytterligare ett krig förlorade det även den 1326. Dess pisanska invånare fördrevs, och Cagliari, befolkat av katalaner, blev huvudstad i kungariket Sardinien.
