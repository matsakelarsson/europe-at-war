June 1285: juni 1285
Peter’s troops blocked the old Roman road over the Pyrenees, so the French had to find another way.: Peters trupper spärrade den gamla romerska vägen över Pyrenéerna, så fransmännen måste finna en annan väg.
Girona: Girona
7 September 1285: 7 september 1285
The starving city surrendered after a siege of more than two months, the one real prize of the campaign.: Den utsvultna staden kapitulerade efter en belägring på mer än två månader – fälttågets enda verkliga vinst.
Philip III: Filip III
Peter’s admiral, Roger of Lauria, brought his galleys back from Sicily. Early on 4 September, probably near the Formigues islets off the Catalan coast, he attacked a French and Genoese galley fleet and destroyed or captured much of it, and then swept the French supply ships from the coast. Without command of the sea the invaders could not feed an army that disease was already destroying. Philip III, himself ill, ordered a retreat.: Peters amiral, Roger av Lauria, förde tillbaka sina galärer från Sicilien. Tidigt den 4 september, troligen nära Formiguesskären utanför den katalanska kusten, anföll han en fransk och genuesisk galärflotta och förstörde eller erövrade en stor del av den, och sedan sopade han bort de franska förrådsfartygen från kusten. Utan herravälde till sjöss kunde inkräktarna inte försörja en armé som sjukdomarna redan höll på att förinta. Filip III, själv sjuk, beordrade återtåg.
Peter let the French king and his household pass through the mountains, but on 30 September and 1 October his troops fell on the rearguard and baggage at the Col de Panissars and slaughtered many of them. Philip died at Perpignan on 5 October, and Peter III on 11 November. His son Alfonso III punished James II of Majorca by taking Mallorca from him in 1285–1286 and conquered Muslim Menorca in 1287. The Treaty of Tarascon (1291) reconciled Aragon with the pope and France, and by the Treaty of Anagni (1295) Aragon gave up Sicily, which the Sicilians fought on to keep, and agreed to return the Balearics to James II.: Peter lät den franske kungen och hans hov passera genom bergen, men den 30 september och 1 oktober föll hans trupper över eftertruppen och trossen vid Col de Panissars och slaktade många av dem. Filip dog i Perpignan den 5 oktober och Peter III den 11 november. Hans son Alfons III straffade Jakob II av Mallorca genom att ta Mallorca från honom 1285–1286 och erövrade det muslimska Menorca 1287. Freden i Tarascon (1291) försonade Aragonien med påven och Frankrike, och genom freden i Anagni (1295) avstod Aragonien från Sicilien, som sicilianarna fortsatte att kämpa för att behålla, och gick med på att återlämna Balearerna till Jakob II.
