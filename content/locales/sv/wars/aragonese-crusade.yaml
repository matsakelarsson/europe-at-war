Aragonese Crusade: Aragoniska korståget
A crusade proclaimed by Pope Martin IV against Peter III of Aragon, who had taken Sicily from Charles of Anjou after the Sicilian Vespers of 1282. Philip III of France, allied with James II of Majorca, invaded Catalonia in 1285 to win Aragon for his son Charles of Valois and took Girona, but Roger of Lauria’s fleet destroyed the French at sea, disease ravaged the army, and the king died at Perpignan during the retreat. Peace with France and the pope came at Tarascon in 1291 and Anagni in 1295.: Ett korståg som påven Martin IV utlyste mot Peter III av Aragonien, som hade tagit Sicilien från Karl av Anjou efter den sicilianska aftonsången 1282. Filip III av Frankrike, allierad med Jakob II av Mallorca, invaderade Katalonien 1285 för att vinna Aragonien åt sin son Karl av Valois och intog Girona, men Roger av Laurias flotta förintade fransmännen till sjöss, sjukdomar härjade i armén och kungen dog i Perpignan under återtåget. Fred med Frankrike och påven slöts i Tarascon 1291 och Anagni 1295.
