James II of Majorca received the French army in his mainland capital.: Jakob II av Mallorca tog emot den franska armén i sin huvudstad på fastlandet.
Elne: Elne
The town was defended by the illegitimate son of the last count of Roussillon. When it fell, the cathedral was burned and most of the people killed, despite the papal legates in the army.: Staden försvarades av den siste greven av Roussillons utomäktenskaplige son. När den föll brändes katedralen och de flesta av invånarna dödades, trots att påvliga legater fanns i armén.
