Aragonese success: Aragoniska framgångar
After the Sicilian Vespers of 1282, Peter III of Aragon took the crown of Sicily from Charles of Anjou, the brother of Saint Louis of France. Pope Martin IV, a Frenchman, excommunicated Peter and declared him deposed, and in 1284 Philip III of France accepted the crown of Aragon for his younger son, Charles of Valois. The pope proclaimed the war a crusade. Peter’s own brother, James II of Majorca, who held Roussillon and Montpellier as well as the Balearic Islands, sided with France. In the spring of 1285 Philip and Charles led a large army south into Roussillon.: Efter den sicilianska aftonsången 1282 tog Peter III av Aragonien Siciliens krona från Karl av Anjou, bror till Ludvig den helige av Frankrike. Påven Martin IV, en fransman, bannlyste Peter och förklarade honom avsatt, och 1284 tog Filip III av Frankrike emot Aragoniens krona för sin yngre son Karl av Valois. Påven utlyste kriget som ett korståg. Peters egen bror, Jakob II av Mallorca, som utöver Balearerna höll Roussillon och Montpellier, ställde sig på Frankrikes sida. Våren 1285 ledde Filip och Karl en stor armé söderut in i Roussillon.
On 25 May 1285 the crusaders stormed Elne, whose people had resisted them, burned the cathedral and massacred many of the inhabitants. Peter’s troops held the main pass over the Pyrenees, the Col de Panissars, but in June the French crossed by another pass farther east and descended on the Empordà. They besieged Girona from late June. Its garrison under Ramon Folc of Cardona held out through the summer while dysentery spread through the French camp, and the city surrendered only on 7 September, too late in the year to be of much use.: Den 25 maj 1285 stormade korsfararna Elne, vars invånare hade gjort motstånd, brände katedralen och massakrerade många av invånarna. Peters trupper höll huvudpasset över Pyrenéerna, Col de Panissars, men i juni gick fransmännen över ett annat pass längre österut och drog ned i Empordà. De belägrade Girona från slutet av juni. Garnisonen under Ramon Folc av Cardona höll ut hela sommaren medan dysenterin spreds i det franska lägret, och staden kapitulerade först den 7 september, för sent på året för att vara till någon större nytta.
