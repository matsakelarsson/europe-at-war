Lauria’s Catalan and Sicilian galleys surprised the French fleet at night. The chroniclers disagree on where it was fought, some placing it off Roses.: Laurias katalanska och sicilianska galärer överraskade den franska flottan nattetid. Krönikörerna är oense om var slaget stod, och vissa förlägger det utanför Roses.
Almogàvers, Peter’s light infantry, attacked the retreating army in the pass and plundered its baggage.: Almogàvers, Peters lätta infanteri, anföll den retirerande armén i passet och plundrade dess tross.
5 October 1285: 5 oktober 1285
Philip III died here of the fever he had caught in Catalonia. He was buried at Narbonne and Saint-Denis.: Filip III dog här av den feber han hade ådragit sig i Katalonien. Han begravdes i Narbonne och Saint-Denis.
Mallorca: Mallorca
Alfonso III took the island from his uncle James II, who had sided with France. It was returned to James in 1298.: Alfons III tog ön från sin farbror Jakob II, som hade ställt sig på Frankrikes sida. Den återlämnades till Jakob 1298.
