The crusade was one front of the War of the Sicilian Vespers (1282–1302), which has its own entry.: Korståget var en front i den sicilianska aftonsångens krig (1282–1302), som har en egen artikel.
The chronicles of Bernat Desclot and Ramon Muntaner, both Catalan, are the main narratives; they give the French army as well over 100,000 men, far more than it can have been. Dates are Julian.: Krönikorna av Bernat Desclot och Ramon Muntaner, båda katalaner, är de viktigaste berättande källorna; de anger den franska armén till långt över 100 000 man, betydligt fler än den kan ha varit. Datumen följer den julianska kalendern.
