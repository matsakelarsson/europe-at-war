Ararat rebellion: Araratupproret
A Kurdish rising around Mount Ararat in eastern Turkey, organised by the Kurdish nationalist league Xoybûn, which had proclaimed a Republic of Ararat there in 1927, and led by Ihsan Nuri Pasha; Turkish offensives and heavy air bombardment crushed it in the summer of 1930, with many civilians killed in the Zilan valley in July. The last rebels were defeated or fled into Persia by 1931, and in 1932 Persia ceded the slopes of Lesser Ararat to Turkey in exchange for land elsewhere on the border, to close the rebels’ refuge.: En kurdisk resning kring berget Ararat i östra Turkiet, organiserad av det kurdiska nationalistförbundet Xoybûn, som 1927 hade utropat en republik Ararat där, och ledd av Ihsan Nuri pasha; turkiska offensiver och kraftiga flygbombningar slog ned den sommaren 1930, och många civila dödades i Zilandalen i juli. De sista rebellerna besegrades eller flydde till Persien senast 1931, och 1932 avträdde Persien sluttningarna av Lilla Ararat till Turkiet i utbyte mot land på andra ställen längs gränsen, för att stänga rebellernas tillflyktsort.
