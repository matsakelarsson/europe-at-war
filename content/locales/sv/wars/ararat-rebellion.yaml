Also known as the Ağrı rebellion; Ağrı Dağı is the Turkish name of Mount Ararat. Fighting around the mountain began in 1926–1927, and the number of people killed in the Zilan valley in July 1930 is disputed.: Kallas även Ağrıupproret; Ağrı Dağı är det turkiska namnet på berget Ararat. Striderna kring berget började 1926–1927, och antalet människor som dödades i Zilandalen i juli 1930 är omstritt.
