Armagnac–Burgundian Civil War: Inbördeskriget mellan armagnacer och burgunder
A civil war between two branches of the French royal family for control of the government of the mentally ill Charles VI. It began when John the Fearless, Duke of Burgundy, had the king’s brother Louis of Orléans murdered in Paris in 1407; Louis’s son Charles and Charles’s father-in-law Bernard VII of Armagnac led the opposing party. Both sides sought English help. The Burgundians took Paris in 1418 and massacred Armagnacs, the dauphin’s men killed John the Fearless at Montereau in 1419, and his son Philip the Good allied with England until the Treaty of Arras reconciled Burgundy with Charles VII in 1435.: Ett inbördeskrig mellan två grenar av den franska kungaätten om makten över den psykiskt sjuke Karl VI:s regering. Det började när Johan den orädde, hertig av Burgund, lät mörda kungens bror Ludvig av Orléans i Paris 1407; Ludvigs son Karl och Karls svärfar Bernard VII av Armagnac ledde det motsatta partiet. Båda sidor sökte engelsk hjälp. Burgunderna intog Paris 1418 och massakrerade armagnacer, dauphinens män dödade Johan den orädde i Montereau 1419, och hans son Filip den gode allierade sig med England tills freden i Arras försonade Burgund med Karl VII 1435.
