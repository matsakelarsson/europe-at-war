After 1419 the Armagnacs were in effect the party of the dauphin, later Charles VII, and the civil war merged into the Hundred Years’ War. Paris also saw the Cabochien revolt of 1413, a rising of butchers and craftsmen on the Burgundian side.: Efter 1419 var armagnacerna i praktiken dauphinens, den senare Karl VII:s, parti, och inbördeskriget gick upp i hundraårskriget. Paris upplevde också cabochienrevolten 1413, en resning av slaktare och hantverkare på den burgundiska sidan.
