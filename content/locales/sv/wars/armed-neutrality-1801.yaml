March 1801: mars 1801
Eighteen ships and floating batteries, partly manned by volunteers, lay in a line along the shoal off the city, with the Trekroner fort at its northern end.: Arton fartyg och flytande batterier, delvis bemannade av frivilliga, låg i en linje längs grundet utanför staden, med fortet Trekroner i dess norra ände.
Parker and Nelson: Parker och Nelson
On the morning of 2 April Nelson led twelve ships of the line and smaller vessels down the narrow channel in front of Copenhagen. Three of his ships ran aground, but the rest anchored opposite the Danish line and opened fire. The Danes and Norwegians, many of them untrained volunteers, fought for about four hours. When Parker signalled him to break off the action, Nelson is said to have put his telescope to his blind eye and claimed he could not see the signal.: På morgonen den 2 april ledde Nelson tolv linjeskepp och mindre fartyg genom den smala farleden framför Köpenhamn. Tre av hans fartyg gick på grund, men resten ankrade mitt emot den danska linjen och öppnade eld. Danskarna och norrmännen, många av dem otränade frivilliga, stred i omkring fyra timmar. När Parker signalerade att han skulle avbryta striden lär Nelson ha satt kikaren för sitt blinda öga och påstått att han inte kunde se signalen.
By the afternoon most of the Danish ships had been silenced or taken. Nelson sent a letter ashore offering a truce, which Crown Prince Frederick accepted. The British lost 274 killed and 737 wounded; Danish and Norwegian casualties are uncertain, and estimates range from about 1,000 to 1,800 killed and wounded, with many more taken prisoner. After days of talks Denmark agreed on 9 April to a fourteen-week armistice and suspended its part in the league. News arrived that Tsar Paul had been murdered on 23–24 March, and the league fell apart.: På eftermiddagen hade de flesta danska fartygen tystats eller erövrats. Nelson sände ett brev i land med ett erbjudande om vapenvila, som kronprins Fredrik godtog. Britterna förlorade 274 döda och 737 sårade; de danska och norska förlusterna är osäkra, och uppskattningarna varierar från omkring 1 000 till 1 800 döda och sårade, därtill många fler tillfångatagna. Efter flera dagars förhandlingar gick Danmark den 9 april med på ett vapenstillestånd på fjorton veckor och avbröt sitt deltagande i förbundet. Det kom nyheter om att tsar Paul hade mördats natten mellan den 23 och 24 mars, och förbundet föll samman.
