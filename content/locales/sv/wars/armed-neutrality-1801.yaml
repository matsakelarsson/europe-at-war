Dates are New Style. In Denmark the battle is called Slaget på Reden, “the Battle of the Roads”, and it opened the period known as the English Wars (Englandskrigene), which continued with the Gunboat War of 1807–1814.: Datumen anges enligt nya stilen. I Danmark kallas slaget Slaget på Reden, ”slaget på redden”, och det inledde den period som kallas Englandskrigen (Englandskrigene), som fortsatte med kanonbåtskriget 1807–1814.
