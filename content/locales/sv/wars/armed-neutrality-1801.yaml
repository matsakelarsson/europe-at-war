During the wars against revolutionary France, the Royal Navy stopped and searched neutral merchant ships for goods bound for its enemies. Denmark–Norway, with one of Europe’s largest merchant fleets, sent warships to escort its convoys, which led to clashes at sea. In December 1800 Tsar Paul I of Russia brought Denmark–Norway, Sweden and Prussia into a League of Armed Neutrality to resist the searches. Britain saw the league as a pro-French alliance that threatened its supplies of timber, hemp and tar from the Baltic.: Under krigen mot det revolutionära Frankrike stoppade och visiterade Royal Navy neutrala handelsfartyg i jakt på gods avsett för dess fiender. Danmark–Norge, med en av Europas största handelsflottor, sände krigsfartyg för att eskortera sina konvojer, vilket ledde till sammandrabbningar till sjöss. I december 1800 förde tsar Paul I av Ryssland in Danmark–Norge, Sverige och Preussen i ett väpnat neutralitetsförbund för att stå emot visitationerna. Storbritannien såg förbundet som en profransk allians som hotade dess tillförsel av virke, hampa och tjära från Östersjön.
In March 1801 a British fleet under Admiral Sir Hyde Parker, with Vice-Admiral Horatio Nelson as second in command, sailed from Great Yarmouth to break up the league before the Russian, Swedish and Danish fleets could join. It passed through the Sound on 30 March, keeping close to the Swedish shore, whose guns stayed silent. Most of the Danish fleet was laid up without masts or rigging, so the defence of Copenhagen rested on a line of old ships, hulks and floating batteries moored before the city.: I mars 1801 seglade en brittisk flotta under amiral sir Hyde Parker, med viceamiral Horatio Nelson som näst högste befälhavare, från Great Yarmouth för att splittra förbundet innan den ryska, den svenska och den danska flottan kunde förena sig. Den passerade Öresund den 30 mars och höll sig nära den svenska kusten, vars kanoner förblev tysta. Större delen av den danska flottan låg upplagd utan master och rigg, så försvaret av Köpenhamn vilade på en linje av gamla fartyg, hulkar och flytande batterier som förtöjts framför staden.
