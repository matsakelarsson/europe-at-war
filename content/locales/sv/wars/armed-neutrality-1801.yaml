The fleet assembled in Yarmouth Roads. Parker was slow to leave until a private note from the First Lord of the Admiralty hurried him off.: Flottan samlades på Yarmouths redd. Parker dröjde med att avsegla tills ett privat brev från förste amiralitetslorden fick honom att skynda sig iväg.
