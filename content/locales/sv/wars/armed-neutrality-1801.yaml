War of the Second Armed Neutrality: Andra väpnade neutralitetens krig
A brief war in 1801 in which Britain sent a fleet to break up the Russian-led League of Armed Neutrality, which Denmark–Norway had joined. Nelson’s attack on the Danish defence line at Copenhagen on 2 April forced Denmark to suspend its part in the league, which collapsed after the murder of Tsar Paul I.: Ett kort krig 1801 där Storbritannien sände en flotta för att spränga det ryskledda väpnade neutralitetsförbundet, som Danmark–Norge hade anslutit sig till. Nelsons anfall på den danska försvarslinjen vid Köpenhamn den 2 april tvingade Danmark att avbryta sitt deltagande i förbundet, som föll samman efter mordet på tsar Paul I.
