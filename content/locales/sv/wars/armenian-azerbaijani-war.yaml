Armenian–Azerbaijani War: Armenisk-azerbajdzjanska kriget
A war between the newly independent republics of Armenia and Azerbaijan over the mixed borderlands of Karabakh, Zangezur and Nakhchivan, in which both sides massacred and expelled civilians. It ended when the Red Army occupied Azerbaijan in April 1920 and Armenia that November; Soviet rule later placed Nagorno-Karabakh and Nakhchivan in Azerbaijan and Zangezur in Armenia.: Ett krig mellan de nyss självständiga republikerna Armenien och Azerbajdzjan om de etniskt blandade gränsområdena Karabach, Zangezur och Nachitjevan, där båda sidor massakrerade och fördrev civila. Det upphörde när Röda armén ockuperade Azerbajdzjan i april 1920 och Armenien i november samma år; den sovjetiska regimen placerade senare Nagorno-Karabach och Nachitjevan i Azerbajdzjan och Zangezur i Armenien.
