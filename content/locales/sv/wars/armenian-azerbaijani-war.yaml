Among the worst killings were the March Days of 1918, when Bolshevik and Armenian forces in Baku killed thousands of Muslims, the killing of Armenians when Ottoman and Azerbaijani forces took Baku in September 1918, and the Shusha massacre of March 1920.: Bland de värsta morden fanns marsdagarna 1918, då bolsjevikiska och armeniska styrkor i Baku dödade tusentals muslimer, dödandet av armenier när osmanska och azerbajdzjanska styrkor intog Baku i september 1918 och massakern i Sjusja i mars 1920.
The Ottoman Army of Islam fought alongside Azerbaijan in 1918, and British troops occupied Baku and oversaw Karabakh from November 1918 to August 1919.: Den osmanska Islams armé stred på Azerbajdzjans sida 1918, och brittiska trupper ockuperade Baku och övervakade Karabach från november 1918 till augusti 1919.
The numbers of victims are disputed. Estimates for the Shusha massacre range from about 500 to 30,000, depending on the source and the area counted, and for the killing of Armenians in Baku in September 1918 from about 10,000 to 20,000.: Antalet offer är omstritt. Uppskattningarna för massakern i Sjusja varierar från omkring 500 till 30 000, beroende på källa och vilket område som räknas, och för dödandet av armenier i Baku i september 1918 från omkring 10 000 till 20 000.
