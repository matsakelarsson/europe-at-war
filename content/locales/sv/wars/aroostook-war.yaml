# Svenska översättningar av katalogtexten (våg 14); stegtexterna kommer senare.
Aroostook War: Aroostookkriget
? "A bloodless confrontation of 1838–1839 between the US state of Maine and the British colony of New Brunswick over the forests of the Aroostook valley, also called the Pork and Beans War. The Treaty of Paris of 1783 had left the boundary between Maine and British North America unclear, and both sides claimed some 12,000 square miles of timberland. In 1831 the King of the Netherlands, asked to arbitrate, proposed a compromise line that Britain accepted but the United States, under pressure from Maine, rejected. In the winter of 1838–1839 lumbermen from New Brunswick were cutting timber in the disputed valley, and Maine sent a posse under its land agent Rufus McIntire to drive them out; in February 1839 New Brunswick lumbermen seized McIntire and carried him to Woodstock. Both sides called out troops: Maine raised thousands of militia and began Fort Fairfield, New Brunswick and Nova Scotia mobilised theirs and British regulars moved up, and the US Congress authorised 50,000 men and $10 million. President Martin Van Buren sent General Winfield Scott, who in March 1839 arranged a truce with New Brunswick’s lieutenant governor, Sir John Harvey, under which both sides withdrew while the dispute was negotiated. There was no fighting; about 38 militiamen died of disease and accidents. The Webster–Ashburton Treaty of 9 August 1842 drew the boundary, giving the United States about 7,000 square miles and Britain about 5,000, including the route between New Brunswick and Quebec."
: "En oblodig konfrontation 1838–1839 mellan den amerikanska delstaten Maine och den brittiska kolonin New Brunswick om skogarna i Aroostookdalen, även kallad fläsk- och bönkriget (Pork and Beans War). Freden i Paris 1783 hade lämnat gränsen mellan Maine och Brittiska Nordamerika oklar, och båda sidor gjorde anspråk på omkring 12 000 engelska kvadratmil skogsmark. År 1831 föreslog Nederländernas kung, som ombetts att vara skiljedomare, en kompromisslinje som Storbritannien godtog men som USA, under tryck från Maine, förkastade. Vintern 1838–1839 höll skogshuggare från New Brunswick på att avverka timmer i den omstridda dalen, och Maine sände ett uppbåd under sin markagent Rufus McIntire för att driva bort dem; i februari 1839 grep skogshuggare från New Brunswick McIntire och förde honom till Woodstock. Båda sidor kallade ut trupper: Maine mobiliserade tusentals milismän och började bygga Fort Fairfield, New Brunswick och Nova Scotia mobiliserade sina miliser och brittiska reguljära trupper fördes fram, och USA:s kongress beviljade 50 000 man och 10 miljoner dollar. President Martin Van Buren sände general Winfield Scott, som i mars 1839 kom överens med New Brunswicks viceguvernör, Sir John Harvey, om ett stillestånd enligt vilket båda sidor drog sig tillbaka medan tvisten förhandlades. Det förekom inga strider; omkring 38 milismän dog av sjukdomar och olyckor. Webster–Ashburton-fördraget av den 9 augusti 1842 drog upp gränsen och gav USA omkring 7 000 engelska kvadratmil och Storbritannien omkring 5 000, inklusive förbindelseleden mellan New Brunswick och Québec."
