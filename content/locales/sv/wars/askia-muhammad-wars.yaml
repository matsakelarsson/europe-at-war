# Svenska översättningar av katalogtexten (våg 12); stegtexterna kommer senare.
Askia Muhammad’s wars: Askia Muhammads krig
The wars of Askia Muhammad (Muhammad Ture), who seized the Songhai throne from Sonni Ali’s son in 1493 and ruled until his own son deposed him in 1528. After defeating Sonni Baru at Anfao, near Gao, he made the pilgrimage to Mecca, returned with the title of caliph for the lands of Takrur, and led a campaign against the Mossi in 1497–1498 that the Timbuktu chronicle calls the only true holy war of the region. In the following years his armies marched against Aïr (1500), the Malian town of Zalen (1501), Borgu (1505, with heavy losses), Mali (1506–1507), the Fulani leader Tengella in Diara (1512), Katsina in Hausaland (1513) and the sultan of Agadez (1514–1515). On the way back from Agadez, Kanta Kotal of Kebbi rebelled over his share of the plunder and held off a Songhai expedition in 1516–1517, founding an independent Kebbi. Under Askia Muhammad the Songhai Empire reached its greatest extent, from the upper Senegal to Aïr; in 1528, old and nearly blind, he was deposed by his son Musa.: Krigen under Askia Muhammad (Muhammad Ture), som 1493 tog Songhairikets tron från Sonni Alis son och regerade tills hans egen son avsatte honom 1528. Sedan han hade besegrat Sonni Baru vid Anfao nära Gao vallfärdade han till Mecka, återvände med titeln kalif över Takrurs länder och ledde 1497–1498 ett fälttåg mot mossi som Timbuktukrönikan kallar regionens enda verkliga heliga krig. Under de följande åren marscherade hans arméer mot Aïr (1500), den maliska staden Zalen (1501), Borgu (1505, med svåra förluster), Mali (1506–1507), fulaniledaren Tengella i Diara (1512), Katsina i Hausaland (1513) och sultanen av Agadez (1514–1515). På vägen tillbaka från Agadez gjorde Kanta Kotal av Kebbi uppror på grund av sin andel av bytet och höll stånd mot en songhaiisk expedition 1516–1517, varigenom han grundade ett självständigt Kebbi. Under Askia Muhammad nådde Songhairiket sin största utbredning, från övre Senegalfloden till Aïr; 1528, gammal och nästan blind, avsattes han av sin son Musa.
