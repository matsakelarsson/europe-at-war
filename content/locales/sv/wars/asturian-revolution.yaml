Asturian Revolution of 1934: Asturiska revolutionen 1934
A revolutionary general strike called by the Socialists and other left-wing groups across Spain in October 1934, when the Catholic conservative CEDA entered the government of the Second Republic. It failed in most of the country, and in Barcelona Lluís Companys’s proclamation of a Catalan State lasted only ten hours, but in Asturias the miners rose in arms, took the mining valleys and most of Oviedo, and set up revolutionary committees, which killed several dozen priests and others. The government sent the Spanish Legion and Moroccan troops under General Eduardo López Ochoa and Colonel Juan Yagüe, with General Francisco Franco advising the war minister in Madrid, and after two weeks of fighting and a harsh repression about 1,500–2,000 people were dead and 15,000–30,000 imprisoned.: En revolutionär generalstrejk som socialisterna och andra vänstergrupper utlyste i hela Spanien i oktober 1934, när det katolskt konservativa CEDA gick in i andra republikens regering. Den misslyckades i större delen av landet, och i Barcelona varade Lluís Companys utropande av en katalansk stat bara tio timmar, men i Asturien grep gruvarbetarna till vapen, tog gruvdalarna och större delen av Oviedo och inrättade revolutionära kommittéer, som dödade flera dussin präster och andra. Regeringen sände Spanska legionen och marockanska trupper under general Eduardo López Ochoa och överste Juan Yagüe, med general Francisco Franco som rådgivare åt krigsministern i Madrid, och efter två veckors strider och ett hårt förtryck var omkring 1 500–2 000 människor döda och 15 000–30 000 fängslade.
