Austrian Civil War: Österrikiska inbördeskriget
Four days of fighting between the authoritarian government of Engelbert Dollfuss, backed by the army, the police and the right-wing Heimwehr militia, and the Republican Protection League (Schutzbund), the banned militia of the Social Democrats. It began in Linz on 12 February 1934, when Schutzbund members resisted a police search for weapons at the party’s headquarters, and spread to Vienna and the industrial towns of Upper Austria and Styria. In Vienna the army shelled the Karl-Marx-Hof and other municipal housing estates. Between about 350 and 370 people were killed, some 130 of them uninvolved civilians. Nine Schutzbund members were executed, the Social Democratic Party was banned, and the constitution of May 1934 made Austria a one-party corporative state.: Fyra dagars strider mellan Engelbert Dollfuss auktoritära regering, som stöddes av armén, polisen och den högerinriktade Heimwehrmilisen, och Republikanska skyddsförbundet (Schutzbund), socialdemokraternas förbjudna milis. Striderna började i Linz den 12 februari 1934, när Schutzbundmedlemmar gjorde motstånd mot en polisrazzia efter vapen i partiets högkvarter, och spred sig till Wien och industristäderna i Oberösterreich och Steiermark. I Wien besköt armén Karl-Marx-Hof och andra kommunala bostadsområden. Mellan omkring 350 och 370 människor dödades, varav omkring 130 oinblandade civila. Nio Schutzbundmedlemmar avrättades, Socialdemokratiska partiet förbjöds och författningen från maj 1934 gjorde Österrike till en korporativ enpartistat.
