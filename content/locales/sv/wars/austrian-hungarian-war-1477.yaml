Austrian–Hungarian War, 1477–1488: Österrikisk-ungerska kriget 1477–1488
A war between King Matthias Corvinus of Hungary and Emperor Frederick III, as ruler of the Austrian lands, fought mostly in Lower Austria. Matthias declared war in June 1477 after Frederick had invested his rival Vladislaus II with Bohemia, and by the peace of Gmunden and Korneuburg that December won recognition as king of Bohemia. When fighting resumed in the early 1480s, Matthias’s mercenary Black Army took Hainburg, Korneuburg and other strongholds, starved Vienna into surrender on 1 June 1485 and took Wiener Neustadt in August 1487. Matthias held Vienna, where he kept his court, most of Lower Austria and parts of Styria and Carinthia until his death in 1490, after which Frederick’s son Maximilian recovered them.: Ett krig mellan kung Mattias Corvinus av Ungern och kejsar Fredrik III i egenskap av härskare över de österrikiska länderna, fört mest i Niederösterreich. Mattias förklarade krig i juni 1477 sedan Fredrik förlänat hans rival Vladislav II med Böhmen, och genom freden i Gmunden och Korneuburg i december samma år vann han erkännande som kung av Böhmen. När striderna återupptogs i början av 1480-talet intog Mattias legoarmé, Svarta armén, Hainburg, Korneuburg och andra fästen, svalt Wien till kapitulation den 1 juni 1485 och intog Wiener Neustadt i augusti 1487. Mattias höll Wien, där han hade sitt hov, större delen av Niederösterreich och delar av Steiermark och Kärnten fram till sin död 1490, varefter Fredriks son Maximilian återtog dem.
