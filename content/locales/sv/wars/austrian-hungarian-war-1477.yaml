Dates are Julian, as usual for the period. Frederick received little help from the princes of the Empire; an imperial army under Duke Albert of Saxony was raised only in 1487. Albert agreed an armistice with Matthias at St. Pölten, which was extended until Matthias died.: Datumen följer den julianska kalendern, som var brukligt för perioden. Fredrik fick föga hjälp av rikets furstar; en riksarmé under hertig Albrekt av Sachsen sattes upp först 1487. Albrekt slöt ett vapenstillestånd med Mattias i Sankt Pölten, som förlängdes fram till Mattias död.
Vienna was held for Hungary from 1485 to 1490 but was not made the capital of Hungary. Under the Peace of Pressburg of 1491, Maximilian gave up the claim to the Hungarian throne for the time being in return for the right to succeed if Vladislaus II died without a son.: Wien hölls av Ungern från 1485 till 1490 men gjordes inte till Ungerns huvudstad. Genom freden i Pressburg 1491 gav Maximilian tills vidare upp anspråket på den ungerska tronen mot rätten att efterträda Vladislav II om denne dog utan son.
