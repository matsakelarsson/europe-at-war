Sarajevo and the occupation: Sarajevo och ockupationen
29 July – 20 October 1878: 29 juli – 20 oktober 1878
The Ottoman government did not fight the occupation officially, but many of its troops in the provinces joined or helped the resistance. Numbers of insurgents and of Bosnian dead are uncertain; the Austro-Hungarian General Staff estimated 79,000 armed insurgents and 13,800 Ottoman regulars.: Den osmanska regeringen bekämpade inte officiellt ockupationen, men många av dess trupper i provinserna anslöt sig till eller hjälpte motståndet. Antalet upprorsmän och bosniska döda är osäkert; den österrikisk-ungerska generalstaben uppskattade 79 000 beväpnade upprorsmän och 13 800 reguljära osmanska soldater.
The occupation was sanctioned by Article 25 of the Treaty of Berlin. Austro-Hungarian garrisons entered the Sanjak of Novi Pazar, which stayed under Ottoman administration, in September 1879.: Ockupationen sanktionerades av artikel 25 i Berlinfördraget. Österrikisk-ungerska garnisoner ryckte i september 1879 in i sandjaken Novi Pazar, som förblev under osmansk förvaltning.
Austro-Hungarian moves: Österrikisk-ungerska trupprörelser
Austro-Hungarian success: Österrikisk-ungerska framgångar
Moves of the resistance: Motståndets trupprörelser
Success for the resistance: Framgångar för motståndet
The Congress of Berlin allowed Austria-Hungary to occupy and administer Bosnia and Herzegovina, which stayed under the sultan’s nominal sovereignty, and to garrison the Sanjak of Novi Pazar between Serbia and Montenegro. The foreign minister, Gyula Andrássy, expected “a walk with a brass band”, but many Bosnian Muslims, who stood to lose most under Christian rule, and many Orthodox Serbs resisted; most Catholic Croats did not. On 29 July General Josip Filipović’s XIII Corps crossed the Sava at Brod, Kostajnica and Gradiška, while General Stjepan Jovanović’s division marched up the Neretva from Dalmatia and took Mostar on 5 August.: Berlinkongressen tillät Österrike-Ungern att ockupera och förvalta Bosnien och Hercegovina, som förblev under sultanens nominella överhöghet, och att förlägga garnisoner i sandjaken Novi Pazar mellan Serbien och Montenegro. Utrikesministern Gyula Andrássy väntade sig ”en promenad med musikkår”, men många bosniska muslimer, som hade mest att förlora på ett kristet styre, och många ortodoxa serber gjorde motstånd; de flesta katolska kroater gjorde det inte. Den 29 juli gick general Josip Filipovićs XIII armékår över Sava vid Brod, Kostajnica och Gradiška, medan general Stjepan Jovanovićs division marscherade uppför Neretva från Dalmatien och intog Mostar den 5 augusti.
Muslim volunteers led by the preacher Hadži Lojo rallied armed bands, helped almost openly by withdrawing Ottoman troops. Hussars were ambushed at Maglaj on 3 August, and on 7 August the Austro-Hungarians lost some 600 men in a battle near Jajce. Vienna mobilised three more corps, and on 19 August Sarajevo was taken after a day of street fighting; summary courts then had many accused rebels executed. Resistance went on in the hills until Hadži Lojo surrendered on 3 October and the castle of Velika Kladuša fell on 20 October. The campaign needed 153,000 troops and cost almost 5,200 Austro-Hungarian casualties.: Muslimska frivilliga under predikanten Hadži Lojo samlade beväpnade skaror, nästan öppet hjälpta av de osmanska trupper som drog sig tillbaka. Husarer överfölls i ett bakhåll vid Maglaj den 3 augusti, och den 7 augusti förlorade österrikisk-ungrarna omkring 600 man i ett slag nära Jajce. Wien mobiliserade ytterligare tre armékårer, och den 19 augusti intogs Sarajevo efter en dags gatustrider; ståndrätter lät sedan avrätta många anklagade rebeller. Motståndet fortsatte i bergen tills Hadži Lojo gav upp den 3 oktober och borgen Velika Kladuša föll den 20 oktober. Fälttåget krävde 153 000 soldater och kostade Österrike-Ungern nästan 5 200 man i förluster.
