Austro-Hungarian occupation of Bosnia and Herzegovina: Österrike-Ungerns ockupation av Bosnien och Hercegovina
The campaign of July to October 1878 in which Austria-Hungary, given the right by the Congress of Berlin to occupy and administer Bosnia and Herzegovina, overcame armed resistance by Bosnian Muslims and Orthodox Serbs, helped unofficially by Ottoman troops. Sarajevo fell after street fighting on 19 August, and the last strongholds in October; the provinces stayed under nominal Ottoman sovereignty until Austria-Hungary annexed them in 1908.: Det fälttåg från juli till oktober 1878 där Österrike-Ungern, som av Berlinkongressen fått rätt att ockupera och förvalta Bosnien och Hercegovina, övervann väpnat motstånd från bosniska muslimer och ortodoxa serber, som inofficiellt fick hjälp av osmanska trupper. Sarajevo föll efter gatustrider den 19 augusti och de sista fästena i oktober; provinserna förblev under nominell osmansk överhöghet tills Österrike-Ungern annekterade dem 1908.
