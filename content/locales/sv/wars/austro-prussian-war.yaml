Prussia’s chief of staff, Helmuth von Moltke, used the railways to bring three armies to the Bohemian border and sent them through the mountain passes separately, to unite on the battlefield. The Elbe Army and the First Army came from Saxony and Lusatia, the Second Army under Crown Prince Frederick William from Silesia. Ludwig von Benedek, commanding the Austrian North Army and the Saxons, failed to strike at either group alone. In a week of battles from 26 June the Austrians lost at Náchod, Skalitz, Münchengrätz and Gitschin, winning only at Trautenau, as the fast-firing Prussian breech-loading needle gun cut down their attacking columns.: Preussens generalstabschef, Helmuth von Moltke, använde järnvägarna för att föra tre arméer till den böhmiska gränsen och sände dem var för sig genom bergspassen för att förenas på slagfältet. Elbarmén och första armén kom från Sachsen och Lausitz, andra armén under kronprins Fredrik Vilhelm från Schlesien. Ludwig von Benedek, som förde befälet över den österrikiska nordarmén och sachsarna, lyckades inte slå mot någon av grupperna för sig. Under en vecka av strider från den 26 juni förlorade österrikarna vid Náchod, Skalitz, Münchengrätz och Gitschin och vann bara vid Trautenau, medan det snabbskjutande preussiska bakladdade tändnålsgeväret mejade ned deras anfallskolonner.
On 3 July Benedek stood before the fortress of Königgrätz, by the village of Sadowa, with the Elbe at his back. Close to half a million men took part, more than in any battle in Europe since Leipzig in 1813. Prince Frederick Charles’s First Army attacked across the Bistritz in the morning and was held by the Austrian artillery until the Second Army reached the Austrian right flank in the afternoon and took the heights at Chlum. Benedek’s army escaped across the Elbe, covered by its cavalry and guns, but lost about 31,000 men killed, wounded, missing or captured, against about 9,000 Prussians.: Den 3 juli ställde Benedek upp framför fästningen Königgrätz, vid byn Sadowa, med Elbe i ryggen. Närmare en halv miljon man deltog, fler än i något slag i Europa sedan Leipzig 1813. Prins Fredrik Karls första armé anföll över Bistritz på morgonen och hölls tillbaka av det österrikiska artilleriet tills andra armén på eftermiddagen nådde den österrikiska högra flanken och intog höjderna vid Chlum. Benedeks armé kom undan över Elbe, skyddad av sitt kavalleri och sina kanoner, men förlorade omkring 31 000 man i döda, sårade, saknade och tillfångatagna, mot omkring 9 000 preussare.
