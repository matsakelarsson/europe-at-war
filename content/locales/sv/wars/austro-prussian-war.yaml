After their joint victory over Denmark in 1864, Prussia and Austria fell out over Schleswig and Holstein. The Gastein Convention of August 1865 gave Prussia Schleswig and Austria Holstein to administer, but Otto von Bismarck, Prussia’s chief minister, meant to end Austria’s leading role in Germany. On 8 April 1866 he made a secret alliance with Italy, which wanted Venetia. When Austria put the duchies’ future before the Federal Diet, Prussian troops marched into Holstein on 7 June and the Austrians withdrew. On 14 June the Diet voted, nine votes to six, to mobilise federal forces against Prussia, which declared the German Confederation dissolved.: Efter sin gemensamma seger över Danmark 1864 blev Preussen och Österrike osams om Slesvig och Holstein. Gasteinkonventionen i augusti 1865 gav Preussen förvaltningen av Slesvig och Österrike förvaltningen av Holstein, men Otto von Bismarck, Preussens ledande minister, var fast besluten att göra slut på Österrikes ledande roll i Tyskland. Den 8 april 1866 slöt han en hemlig allians med Italien, som ville ha Venetien. När Österrike lade fram frågan om hertigdömenas framtid för förbundsdagen marscherade preussiska trupper in i Holstein den 7 juni, och österrikarna drog sig tillbaka. Den 14 juni röstade förbundsdagen med nio röster mot sex för att mobilisera förbundsstyrkor mot Preussen, som förklarade Tyska förbundet upplöst.
Most of the middle-sized states sided with Austria. On 15 June Prussia demanded that Saxony, Hanover and Hesse-Kassel disarm, and the next day its troops invaded all three. The Saxon army withdrew into Bohemia to join the Austrians, and the Prussians entered Dresden on 18 June. The Elector of Hesse was taken prisoner to Stettin. The Hanoverian army, about 19,000 men with King George V, marched south to join the Bavarians. At Langensalza on 27 June it beat off an attacking Prussian detachment, but converging Prussian forces surrounded it, and it surrendered two days later.: De flesta medelstora staterna ställde sig på Österrikes sida. Den 15 juni krävde Preussen att Sachsen, Hannover och Hessen-Kassel skulle avrusta, och dagen därpå invaderade dess trupper alla tre. Den sachsiska armén drog sig tillbaka in i Böhmen för att förena sig med österrikarna, och preussarna ryckte in i Dresden den 18 juni. Kurfursten av Hessen fördes som fånge till Stettin. Den hannoverska armén, omkring 19 000 man med kung Georg V, marscherade söderut för att förena sig med bayrarna. Vid Langensalza den 27 juni slog den tillbaka en anfallande preussisk avdelning, men preussiska styrkor som ryckte fram från flera håll omringade den, och den kapitulerade två dagar senare.
