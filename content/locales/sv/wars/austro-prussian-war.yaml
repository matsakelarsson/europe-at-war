Austro-Prussian War: Preussisk-österrikiska kriget
A seven-week war in which Prussia and Italy defeated Austria and most of the German middle states. After the Prussian victory at Königgrätz, the Peace of Prague dissolved the German Confederation and shut Austria out of Germany; Prussia annexed Hanover, Hesse-Kassel, Nassau, Frankfurt and Schleswig-Holstein and led a new North German Confederation, and Austria ceded Venetia to Italy.: Ett sju veckor långt krig där Preussen och Italien besegrade Österrike och de flesta tyska mellanstaterna. Efter den preussiska segern vid Königgrätz upplöste freden i Prag Tyska förbundet och stängde ute Österrike från Tyskland; Preussen annekterade Hannover, Hessen-Kassel, Nassau, Frankfurt och Slesvig-Holstein och ledde ett nytt Nordtyska förbundet, och Österrike avträdde Venetien till Italien.
