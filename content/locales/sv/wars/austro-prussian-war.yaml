Also called the Seven Weeks’ War, in German often the German War (Deutscher Krieg), and in Italy the Third War of Independence.: Kallas även sjuveckorskriget, på tyska ofta det tyska kriget (Deutscher Krieg) och i Italien tredje självständighetskriget.
Places in Bohemia and Moravia are named in the German forms used in most accounts of the war; Königgrätz is today’s Hradec Králové, Nikolsburg is Mikulov, Pressburg is Bratislava and Lissa is the Croatian island of Vis.: Orter i Böhmen och Mähren anges med de tyska namnformer som används i de flesta skildringar av kriget; Königgrätz är dagens Hradec Králové, Nikolsburg är Mikulov, Pressburg är Bratislava och Lissa är den kroatiska ön Vis.
