After Langensalza the Prussian forces in the west became the Army of the Main under General Eduard Vogel von Falckenstein. Against them stood two federal corps that never joined up, the Bavarians under Prince Charles of Bavaria and the troops of Württemberg, Baden, Hesse-Darmstadt, Nassau and Austria under Prince Alexander of Hesse. Falckenstein beat the Bavarians at Dermbach on 4 July and at Kissingen on the Franconian Saale on 10 July, then turned west and beat Prince Alexander’s corps at Laufach and Aschaffenburg on 13 and 14 July. On 16 July his troops entered Frankfurt; the Federal Diet had fled to Augsburg.: "Efter Langensalza blev de preussiska styrkorna i väster Mainarmén under general Eduard Vogel von Falckenstein. Mot dem stod två förbundskårer som aldrig förenades: bayrarna under prins Karl av Bayern och trupperna från Württemberg, Baden, Hessen-Darmstadt, Nassau och Österrike under prins Alexander av Hessen. Falckenstein slog bayrarna vid Dermbach den 4 juli och vid Kissingen vid Fränkische Saale den 10 juli, vände sedan västerut och slog prins Alexanders kår vid Laufach och Aschaffenburg den 13 och 14 juli. Den 16 juli ryckte hans trupper in i Frankfurt; förbundsdagen hade flytt till Augsburg."
Frankfurt, which had taken no part in the fighting, was ordered to pay huge war contributions, and its mayor, Karl Fellner, hanged himself rather than enforce them. General Edwin von Manteuffel, who took over the army, beat the Württembergers at Tauberbischofsheim on 24 July and the Bavarians around Helmstadt and Rossbrunn over the next two days. On 27 July Prussian guns shelled the fortress of Würzburg, which held out. Armistices with the southern states followed in early August. In separate peace treaties they paid indemnities and secretly allied with Prussia, and Bavaria and Hesse-Darmstadt gave up small territories.: Frankfurt, som inte hade deltagit i striderna, ålades att betala enorma krigskontributioner, och dess borgmästare, Karl Fellner, hängde sig hellre än att driva in dem. General Edwin von Manteuffel, som tog över armén, slog württembergarna vid Tauberbischofsheim den 24 juli och bayrarna kring Helmstadt och Rossbrunn under de följande två dagarna. Den 27 juli besköt preussiska kanoner fästningen Würzburg, som höll stånd. Vapenstillestånd med sydstaterna följde i början av augusti. I separata fredsfördrag betalade de krigsskadestånd och slöt hemliga allianser med Preussen, och Bayern och Hessen-Darmstadt avstod mindre områden.
