Italy declared war on Austria on 20 June and sent two armies against Venetia. On 24 June the larger, under General Alfonso La Marmora with King Victor Emmanuel II, crossed the Mincio and was beaten at Custoza by the smaller South Army of Archduke Albrecht, based on the fortresses around Verona. The day after Königgrätz Francis Joseph offered Venetia to Napoleon III of France in return for his mediation, to free troops for the defence of Vienna, but Italy, bound by its alliance with Prussia, fought on. Giuseppe Garibaldi’s volunteers pushed into Trentino and beat the Austrians at Bezzecca on 21 July.: Italien förklarade Österrike krig den 20 juni och sände två arméer mot Venetien. Den 24 juni gick den större, under general Alfonso La Marmora och med kung Viktor Emanuel II, över Mincio och besegrades vid Custoza av ärkehertig Albrechts mindre sydarmé, som stödde sig på fästningarna kring Verona. Dagen efter Königgrätz erbjöd Frans Josef Venetien åt Napoleon III av Frankrike i utbyte mot hans medling, för att frigöra trupper till Wiens försvar, men Italien, bundet av sin allians med Preussen, fortsatte att strida. Giuseppe Garibaldis frivilliga trängde in i Trentino och slog österrikarna vid Bezzecca den 21 juli.
At sea the larger and more modern Italian fleet under Admiral Carlo Persano attacked the Austrian island of Lissa in the Adriatic. On 20 July Wilhelm von Tegetthoff’s squadron came to its relief and, in the first battle between fleets of ironclads, rammed and sank the Re d’Italia, while the armoured gunboat Palestro blew up; 612 Italians were killed, against 38 Austrians. As Austrian troops went north, General Enrico Cialdini’s army advanced across Venetia. Garibaldi, ordered on 9 August to leave Trentino, replied with one word, “Obbedisco” (“I obey”), and the armistice of Cormons ended the fighting on 12 August.: Till sjöss anföll den större och modernare italienska flottan under amiral Carlo Persano den österrikiska ön Lissa i Adriatiska havet. Den 20 juli kom Wilhelm von Tegetthoffs eskader till undsättning och rammade och sänkte, i det första slaget mellan flottor av pansarfartyg, Re d’Italia, medan den bepansrade kanonbåten Palestro sprang i luften; 612 italienare dödades, mot 38 österrikare. När österrikiska trupper fördes norrut ryckte general Enrico Cialdinis armé fram genom Venetien. Garibaldi, som den 9 augusti beordrades att lämna Trentino, svarade med ett enda ord, ”Obbedisco” (”Jag lyder”), och vapenstilleståndet i Cormons gjorde slut på striderna den 12 augusti.
