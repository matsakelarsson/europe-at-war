By mid-July the Prussian armies had occupied Prague and Brno and reached the Marchfeld, a day’s march from Vienna, while Austria brought troops north from Italy. On 22 July, during a last action at Blumenau outside Pressburg, an armistice came into force at noon. King William wanted to march into Vienna and annex Austrian and Saxon land, but Bismarck, threatening to resign, insisted on a mild peace that would neither make Austria a lasting enemy nor give France a reason to intervene. The preliminary peace was signed at Nikolsburg on 26 July and the final Peace of Prague on 23 August.: I mitten av juli hade de preussiska arméerna besatt Prag och Brno och nått Marchfeld, en dagsmarsch från Wien, medan Österrike förde trupper norrut från Italien. Den 22 juli, under en sista strid vid Blumenau utanför Pressburg, trädde ett vapenstillestånd i kraft klockan tolv. Kung Vilhelm ville marschera in i Wien och annektera österrikiskt och sachsiskt land, men Bismarck, som hotade att avgå, drev igenom en mild fred som varken skulle göra Österrike till en bestående fiende eller ge Frankrike skäl att ingripa. Preliminärfreden undertecknades i Nikolsburg den 26 juli och den slutliga freden i Prag den 23 augusti.
Austria accepted the end of the German Confederation and its own exclusion from German affairs, gave up its rights in Schleswig and Holstein, and paid an indemnity. Prussia annexed Hanover, Hesse-Kassel, Nassau and the free city of Frankfurt, then Schleswig-Holstein, and led the states north of the Main in a new North German Confederation; Saxony kept its king but had to join it. By the Treaty of Vienna of 3 October Austria ceded Venetia, through France, to Italy. Many in the annexed states resented Prussian rule, and in 1871 a party loyal to the deposed King of Hanover won almost half the vote there.: Österrike godtog Tyska förbundets upplösning och sin egen uteslutning ur tyska angelägenheter, avstod sina rättigheter i Slesvig och Holstein och betalade krigsskadestånd. Preussen annekterade Hannover, Hessen-Kassel, Nassau och den fria staden Frankfurt, därefter Slesvig-Holstein, och ledde staterna norr om Main i ett nytt förbund, Nordtyska förbundet; Sachsen behöll sin kung men måste ansluta sig. Genom freden i Wien den 3 oktober avträdde Österrike Venetien, via Frankrike, till Italien. Många i de annekterade staterna ogillade det preussiska styret, och 1871 fick ett parti lojalt mot Hannovers avsatte kung nästan hälften av rösterna där.
