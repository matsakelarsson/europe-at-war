Zrinski’s winter campaign: Zrinskis vinterfälttåg
In late April Zrinski and the imperial general Wolfgang Julius von Hohenlohe besieged Kanizsa, but they could not breach its walls, and on 2 June, as the grand vizier’s army approached, they withdrew. The Ottomans then besieged Novi Zrin, and Montecuccoli would not risk an attack to save it; the fortress was destroyed on 7 July. Fazıl Ahmed marched north towards Styria. On 1 August Montecuccoli’s imperial army, with troops of the Empire and a French corps of 6,000 sent by Louis XIV, met him at the Rába between Mogersdorf and the abbey of Szentgotthárd. Ottoman troops crossed the river and drove back the imperial centre, but a counter-attack threw them back into the swollen river with heavy losses.: I slutet av april belägrade Zrinski och den kejserlige generalen Wolfgang Julius von Hohenlohe Kanizsa, men de kunde inte bryta igenom murarna, och den 2 juni, när storvesirens armé närmade sig, drog de sig tillbaka. Osmanerna belägrade sedan Novi Zrin, och Montecuccoli ville inte riskera ett anfall för att rädda fästningen; den förstördes den 7 juli. Fazıl Ahmed marscherade norrut mot Steiermark. Den 1 augusti mötte Montecuccolis kejserliga armé, med rikstrupper och en fransk kår på 6 000 man som Ludvig XIV hade sänt, honom vid Rába mellan Mogersdorf och klostret Szentgotthárd. Osmanska trupper gick över floden och drev tillbaka det kejserliga centrum, men ett motanfall kastade dem tillbaka ut i den översvämmade floden med svåra förluster.
In the north Jean-Louis Raduit de Souches retook Nitra and won at Léva. Yet on 10 August, nine days after the battle, Leopold’s envoy signed the Peace of Vasvár. The emperor, worried about France and the Spanish succession, accepted a twenty-year truce in which the Ottomans kept Várad, Érsekújvár and Nógrád, both armies left Transylvania, whose Ottoman-backed prince Michael I Apafi was recognised, and Leopold sent the sultan a “gift” of 200,000 florins. Many Hungarian and Croatian nobles saw it as a betrayal.: I norr återtog Jean-Louis Raduit de Souches Nitra och segrade vid Léva. Ändå undertecknade Leopolds sändebud den 10 augusti, nio dagar efter slaget, freden i Vasvár. Kejsaren, som oroade sig för Frankrike och den spanska tronföljden, godtog ett tjugoårigt stillestånd där osmanerna behöll Várad, Érsekújvár och Nógrád, båda arméerna lämnade Transsylvanien, vars osmanskstödde furste Mikael I Apafi erkändes, och Leopold sände sultanen en ”gåva” på 200 000 floriner. Många ungerska och kroatiska adelsmän såg det som ett förräderi.
