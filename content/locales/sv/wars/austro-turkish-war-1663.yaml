Dates are Gregorian. Sources disagree on the date of Érsekújvár’s surrender, giving dates between 13 and 26 September 1663.: Datumen följer den gregorianska kalendern. Källorna är oense om datumet för Érsekújvárs kapitulation och anger datum mellan den 13 och 26 september 1663.
Nikola Zrinski (in Hungarian Zrínyi Miklós), poet and general, was the great-grandson of the defender of Szigetvár in 1566. He died in a hunting accident in November 1664. The anger at the Peace of Vasvár fed the Magnate Conspiracy, whose leaders, among them his brother Petar Zrinski and Fran Krsto Frankopan, were executed in 1671.: Nikola Zrinski (på ungerska Zrínyi Miklós), poet och general, var barnbarnsbarn till försvararen av Szigetvár 1566. Han dog i en jaktolycka i november 1664. Ilskan över freden i Vasvár gav näring åt magnatsammansvärjningen, vars ledare, bland dem hans bror Petar Zrinski och Fran Krsto Frankopan, avrättades 1671.
The war grew out of the Transylvanian–Ottoman war of 1658–1662, which has its own entry.: Kriget växte fram ur transsylvansk-osmanska kriget 1658–1662, som har en egen artikel.
