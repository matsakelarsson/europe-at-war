After the Ottomans crushed Transylvania’s bid for independence and took Várad in 1660, Leopold I sent troops under Raimondo Montecuccoli into Transylvania, and the ban of Croatia, Nikola Zrinski, raided Ottoman land from his new fortress of Novi Zrin on the Mura. In 1663 the grand vizier Köprülü Fazıl Ahmed Pasha led a large army, perhaps 100,000 men, up the Danube. On 7 August it routed a force under Ádám Forgách, commander of Érsekújvár, at Párkány, and then besieged his fortress, the chief Habsburg stronghold north of the Danube, which surrendered on terms in September.: Sedan osmanerna krossat Transsylvaniens strävan efter självständighet och intagit Várad 1660 sände Leopold I trupper under Raimondo Montecuccoli in i Transsylvanien, och Kroatiens ban, Nikola Zrinski, gjorde räder in på osmanskt område från sin nya fästning Novi Zrin vid Mura. År 1663 ledde storvesiren Köprülü Fazıl Ahmed pasha en stor armé, kanske 100 000 man, uppför Donau. Den 7 augusti slog den vid Párkány en styrka under Ádám Forgách, befälhavare i Érsekújvár, på flykten och belägrade sedan hans fästning, habsburgarnas främsta fäste norr om Donau, som kapitulerade på villkor i september.
Ottoman and Tatar raiders crossed the Váh and devastated western Upper Hungary and Moravia, carrying off thousands of captives, and Nógrád fell too. Zrinski struck back in midwinter. In January 1664, with about 25,000 Croatian, Hungarian and German troops, he marched some 240 kilometres down the Drava, taking Berzence and Babócsa and burning the town of Pécs, and on 1 February he set fire to the Ottoman army’s great wooden bridge across the Drava marshes at Osijek. The raid made him famous throughout Europe.: Osmanska och tatariska plundrare gick över Váh och ödelade västra Övre Ungern och Mähren och förde bort tusentals fångar, och även Nógrád föll. Zrinski slog tillbaka mitt i vintern. I januari 1664 marscherade han med omkring 25 000 kroatiska, ungerska och tyska soldater omkring 240 kilometer nedför Drava, intog Berzence och Babócsa och brände staden Pécs, och den 1 februari satte han eld på den osmanska arméns stora träbro över Dravas träskmarker vid Osijek. Räden gjorde honom berömd i hela Europa.
