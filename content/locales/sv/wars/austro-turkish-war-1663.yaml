Austro-Turkish War (1663–1664): Österrikisk-turkiska kriget (1663–1664)
A war between Emperor Leopold I and the Ottoman Empire, revived under the Köprülü grand viziers. Fazıl Ahmed Pasha took Érsekújvár in 1663, and the Croatian–Hungarian ban Nikola Zrinski answered with a daring winter raid that burned the Ottoman bridge at Osijek. An imperial army with German and French contingents under Raimondo Montecuccoli won at Saint Gotthard in August 1664, but the Peace of Vasvár nine days later left the Ottomans their conquests and angered the Hungarian nobility.: Ett krig mellan kejsar Leopold I och Osmanska riket, som fått ny kraft under storvesirerna av släkten Köprülü. Fazıl Ahmed pasha intog Érsekújvár 1663, och den kroatisk-ungerske banen Nikola Zrinski svarade med en djärv vinterräd som brände den osmanska bron vid Osijek. En kejserlig armé med tyska och franska kontingenter under Raimondo Montecuccoli segrade vid Sankt Gotthard i augusti 1664, men freden i Vasvár nio dagar senare lät osmanerna behålla sina erövringar och väckte den ungerska adelns vrede.
