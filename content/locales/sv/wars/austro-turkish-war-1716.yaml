In June 1717 Eugene crossed the Danube below Belgrade, approaching the city from the east where the Ottomans did not expect him, and on 18 June closed the siege. His troops dug lines 16 kilometres long from the Danube to the Sava, facing both the fortress, held by about 30,000 men under Mustafa Pasha, and the open country behind, while a flotilla guarded the river. On 28 July the new grand vizier, Hacı Halil Pasha, arrived with a relief army of perhaps 140,000 and dug in on the heights behind the besiegers. Caught between two fires and weakened by dysentery and malaria, the imperial army dwindled.: I juni 1717 gick Eugen över Donau nedanför Belgrad och närmade sig staden från öster, där osmanerna inte väntade honom, och den 18 juni slöt han belägringsringen. Hans trupper grävde 16 kilometer långa linjer från Donau till Sava, vända både mot fästningen, som hölls av omkring 30 000 man under Mustafa pasha, och mot det öppna landet bakom, medan en flottilj bevakade floden. Den 28 juli anlände den nye storvesiren, Hacı Halil pasha, med en undsättningsarmé på kanske 140 000 man och grävde ned sig på höjderna bakom belägrarna. Fångad mellan två eldar och försvagad av dysenteri och malaria smälte den kejserliga armén samman.
On 14 August a mortar bomb fired from Zemun blew up the main powder store inside the fortress, killing some 3,000 defenders. Before dawn on 16 August, in thick fog, Eugene attacked the relief army with about 60,000 men. Some units lost their way, and the janissaries broke into a gap in the centre, but Eugene led his reserve cavalry into their flank and the Ottoman army fled, leaving its camp and guns. The garrison surrendered on 21 August and marched out with the Muslim townspeople. The victory made Eugene a hero across Europe and is remembered in the soldiers’ song “Prinz Eugen, der edle Ritter”.: Den 14 augusti sprängde en mörsarbomb som avfyrats från Zemun fästningens största krutförråd i luften och dödade omkring 3 000 försvarare. Före gryningen den 16 augusti, i tät dimma, anföll Eugen undsättningsarmén med omkring 60 000 man. Några förband gick vilse, och janitsjarerna trängde in i en lucka i centrum, men Eugen ledde sitt reservkavalleri mot deras flank, och den osmanska armén flydde och lämnade efter sig läger och kanoner. Garnisonen kapitulerade den 21 augusti och marscherade ut tillsammans med de muslimska stadsborna. Segern gjorde Eugen till en hjälte i hela Europa och lever kvar i soldatvisan ”Prinz Eugen, der edle Ritter”.
