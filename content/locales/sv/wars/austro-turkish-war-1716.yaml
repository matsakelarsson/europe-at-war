Dates are New Style (Gregorian). Numbers of soldiers and dead come from contemporary reports and vary between sources, especially for the Ottoman armies.: Datumen anges enligt nya stilen (den gregorianska kalendern). Uppgifterna om antalet soldater och döda kommer från samtida rapporter och varierar mellan källorna, särskilt för de osmanska arméerna.
Venice’s war with the Ottomans in Greece and the Ionian Sea, including the siege of Corfu in 1716, is told in the Seventh Ottoman–Venetian War.: Venedigs krig mot osmanerna i Grekland och Joniska havet, inklusive belägringen av Korfu 1716, skildras under sjunde osmansk-venetianska kriget.
Places are named as in most accounts of the war; Peterwardein (Pétervárad) is Petrovaradin, today part of Novi Sad, Temesvár is Timișoara, Karlowitz is Sremski Karlovci and Passarowitz is Požarevac.: Orterna anges som i de flesta skildringar av kriget; Peterwardein (Pétervárad) är Petrovaradin, i dag en del av Novi Sad, Temesvár är Timișoara, Karlowitz är Sremski Karlovci och Passarowitz är Požarevac.
