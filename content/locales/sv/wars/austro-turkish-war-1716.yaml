In 1715 the Ottomans took the Morea from Venice. Emperor Charles VI, a guarantor of the Treaty of Karlowitz, allied with the Venetians in April 1716 and demanded that the conquests be returned, and the Ottomans declared war. Grand Vizier Silahdar Damat Ali Pasha led a large army from Belgrade across the Sava into Syrmia. On 2 August it routed an imperial cavalry detachment near Karlowitz and closed in on Petrovaradin, the fortress on the Danube that its builders called the Gibraltar of the Danube, where Prince Eugene of Savoy had gathered an army perhaps half the size of the Ottoman one in an entrenched camp.: År 1715 tog osmanerna Morea från Venedig. Kejsar Karl VI, en av garanterna för freden i Karlowitz, slöt i april 1716 förbund med venetianarna och krävde att erövringarna skulle återlämnas, och osmanerna förklarade krig. Storvesiren Silahdar Damat Ali pasha ledde en stor armé från Belgrad över Sava in i Syrmien. Den 2 augusti slog den en kejserlig kavalleriavdelning på flykten nära Karlowitz och ryckte fram mot Petrovaradin, fästningen vid Donau som dess byggare kallade Donaus Gibraltar, där prins Eugen av Savojen i ett förskansat läger hade samlat en armé som kanske var hälften så stor som den osmanska.
On 5 August Eugene attacked out of his lines. The janissaries at first broke into the imperial centre, but Eugene’s cavalry turned the Ottoman flank, and the army fled back towards Belgrade, leaving its camp and some 250 guns. Damat Ali was mortally wounded; Ottoman losses are often put at about 20,000 men. Eugene then marched into the Banat and besieged Temesvár, the last Ottoman fortress in Hungary, which surrendered in mid-October. Its garrison was allowed to leave for Belgrade, and the Banat, Ottoman since 1552, came under Habsburg rule.: Den 5 augusti anföll Eugen ut ur sina linjer. Janitsjarerna bröt först in i det kejserliga centrum, men Eugens kavalleri kringgick den osmanska flanken, och armén flydde tillbaka mot Belgrad och lämnade efter sig sitt läger och omkring 250 kanoner. Damat Ali sårades dödligt; de osmanska förlusterna anges ofta till omkring 20 000 man. Eugen marscherade sedan in i Banatet och belägrade Temesvár, den sista osmanska fästningen i Ungern, som kapitulerade i mitten av oktober. Garnisonen fick dra bort till Belgrad, och Banatet, osmanskt sedan 1552, kom under habsburgskt styre.
