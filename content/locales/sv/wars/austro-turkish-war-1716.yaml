Peace talks opened at Passarowitz, a small town on the Morava south-east of Belgrade, in June 1718, with British and Dutch envoys mediating. Both sides wanted an end. The Ottomans had lost two armies, and Charles VI needed his troops in Italy, where Spain had seized Sardinia in 1717 and landed in Sicily in July 1718. Venice wanted the Morea back but found no support. The treaty, signed on 21 July 1718, kept what each side held. The Habsburgs gained the Banat of Temesvár, lower Syrmia, Belgrade with most of the Ottoman province of Smederevo south of the Sava and Danube, a strip of northern Bosnia, and Oltenia, the part of Wallachia west of the Olt.: Fredsförhandlingar inleddes i Passarowitz, en liten stad vid Morava sydost om Belgrad, i juni 1718 med brittiska och nederländska sändebud som medlare. Båda sidor ville ha ett slut. Osmanerna hade förlorat två arméer, och Karl VI behövde sina trupper i Italien, där Spanien hade erövrat Sardinien 1717 och landstigit på Sicilien i juli 1718. Venedig ville ha tillbaka Morea men fick inget stöd. Fördraget, som undertecknades den 21 juli 1718, lät vardera sidan behålla vad den höll. Habsburgarna vann Banatet Temesvár, nedre Syrmien, Belgrad med större delen av den osmanska provinsen Smederevo söder om Sava och Donau, en remsa av norra Bosnien samt Oltenien, den del av Valakiet som ligger väster om Olt.
Venice gave up the Morea but kept the Ionian Islands and small gains in Dalmatia. A trade treaty signed the same day opened the Ottoman Empire to Habsburg merchants. The new lands were ruled directly from Vienna. Under its governor, Count Claudius Florimund Mercy, the Banat was drained, fortified and settled with German colonists, Serbs and Romanians; northern Serbia became the Kingdom of Serbia and Oltenia the Banat of Craiova. It was the furthest the Habsburgs had yet reached into the Balkans, but they lost Serbia and Oltenia again in 1739.: Venedig avstod Morea men behöll Joniska öarna och små vinster i Dalmatien. Ett handelsavtal som undertecknades samma dag öppnade Osmanska riket för habsburgska köpmän. De nya områdena styrdes direkt från Wien. Under sin guvernör, greve Claudius Florimund Mercy, dränerades och befästes Banatet och befolkades med tyska kolonister, serber och rumäner; norra Serbien blev kungariket Serbien och Oltenien Banatet Craiova. Det var det längsta habsburgarna dittills hade nått in på Balkan, men de förlorade Serbien och Oltenien igen 1739.
