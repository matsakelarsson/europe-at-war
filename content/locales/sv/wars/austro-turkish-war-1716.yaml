Austro-Turkish War of 1716–1718: Österrikisk-turkiska kriget 1716–1718
A war in which the Habsburg Monarchy, allied with Venice, fought the Ottoman Empire after the Ottomans had retaken the Morea from the Venetians. Prince Eugene of Savoy won at Petrovaradin in 1716, took Temesvár the same year and Belgrade in 1717, and the Treaty of Passarowitz gave the Habsburgs the Banat, Belgrade with northern Serbia, and Oltenia, the greatest extent of their rule in the Balkans.: Ett krig där den habsburgska monarkin, allierad med Venedig, bekämpade Osmanska riket sedan osmanerna återtagit Morea från venetianarna. Prins Eugen av Savojen segrade vid Petrovaradin 1716, intog Temesvár samma år och Belgrad 1717, och freden i Passarowitz gav habsburgarna Banatet, Belgrad med norra Serbien samt Oltenien – den största utbredning deras välde på Balkan någonsin fick.
