Bound by its alliance of 1726 to help Russia, and hoping for easy gains, the Habsburg Monarchy entered the Russo-Turkish war in July 1737. Field Marshal Friedrich Heinrich von Seckendorff led the main army up the Morava from Belgrade and took Niš in late July, and Serbs in the Ottoman lands rose in support. In the west, an army under Prince Joseph of Saxe-Hildburghausen invaded Bosnia and besieged Banja Luka, but on 4 August it ran into a relief army raised by the governor of Bosnia, Hekimoğlu Ali Pasha, from the local captains and their men, and was routed. A third force from Oltenia achieved little in Wallachia.: Bunden av sin allians från 1726 att hjälpa Ryssland, och i hopp om lätta vinster, gick den habsburgska monarkin in i det rysk-turkiska kriget i juli 1737. Fältmarskalk Friedrich Heinrich von Seckendorff ledde huvudarmén uppför Morava från Belgrad och intog Niš i slutet av juli, och serber i de osmanska områdena reste sig till stöd. I väster invaderade en armé under prins Joseph av Sachsen-Hildburghausen Bosnien och belägrade Banja Luka, men den 4 augusti stötte den på en undsättningsarmé som Bosniens guvernör, Hekimoğlu Ali pasha, hade samlat från de lokala kaptenerna och deras män, och slogs på flykten. En tredje styrka från Oltenien uträttade föga i Valakiet.
The Ottomans struck back in the autumn and retook Niš in October; its commander, General Nikolaus Doxat, was later beheaded by the Austrians for giving it up. Seckendorff was recalled, tried and imprisoned at Graz. Peace talks with Russia and the Ottomans at Nemyriv in Poland failed. In 1738 a large Ottoman army under Grand Vizier Yeğen Mehmed Pasha advanced into the Banat, took Mehadia and the island fortress of Orsova on the Danube, while plague spread through both armies and the towns of the region.: Osmanerna slog tillbaka på hösten och återtog Niš i oktober; dess befälhavare, general Nikolaus Doxat, halshöggs senare av österrikarna för att ha gett upp staden. Seckendorff kallades hem, ställdes inför rätta och fängslades i Graz. Fredsförhandlingar med Ryssland och osmanerna i Nemyriv i Polen misslyckades. År 1738 ryckte en stor osmansk armé under storvesiren Yeğen Mehmed pasha in i Banatet och intog Mehadia och ölfästningen Orsova i Donau, medan pesten spreds i båda arméerna och i regionens städer.
