In 1739 Count George Oliver Wallis took command with about 40,000 men. Hearing that the main Ottoman army under Grand Vizier Elhac Ivaz Mehmed Pasha was camped at Grocka, on the Danube below Belgrade, he hurried his cavalry forward. On the morning of 22 July they came out of a narrow defile into the Ottoman army drawn up on the hills, and were shot down as they arrived; the infantry that followed fought all day under fire from above. That night Wallis retreated to Belgrade, and the Ottomans followed and laid siege to the city.: År 1739 tog greve George Oliver Wallis befälet med omkring 40 000 man. När han fick höra att den osmanska huvudarmén under storvesiren Elhac Ivaz Mehmed pasha hade slagit läger vid Grocka, vid Donau nedanför Belgrad, skickade han hastigt fram sitt kavalleri. På morgonen den 22 juli kom ryttarna ut ur ett trångt pass rakt mot den osmanska armén, som stod uppställd på kullarna, och sköts ned allteftersom de anlände; infanteriet som följde efter stred hela dagen under eld ovanifrån. Samma natt drog sig Wallis tillbaka till Belgrad, och osmanerna följde efter och belägrade staden.
Vienna sent Count Wilhelm Reinhard von Neipperg to make peace. Isolated in the grand vizier’s camp and relying on the French ambassador, the Marquis de Villeneuve, he agreed on 1 September to give up Belgrade, not knowing that the emperor had meanwhile decided to hold it. The Treaty of Belgrade, signed on 18 September, returned Belgrade, northern Serbia and the strip of Bosnia south of the Sava to the Ottomans and Oltenia to Wallachia; the Austrians had to demolish the fortifications they had built at Belgrade. The border was again the Sava and the Danube. Wallis and Neipperg were imprisoned until Maria Theresa freed them in 1740, and many Serbs who had sided with the Habsburgs fled north across the rivers.: Wien sände greve Wilhelm Reinhard von Neipperg för att sluta fred. Isolerad i storvesirens läger och beroende av den franske ambassadören, markisen de Villeneuve, gick han den 1 september med på att ge upp Belgrad, ovetande om att kejsaren under tiden hade beslutat att hålla staden. Freden i Belgrad, som undertecknades den 18 september, återlämnade Belgrad, norra Serbien och remsan av Bosnien söder om Sava till osmanerna och Oltenien till Valakiet; österrikarna måste riva de befästningar de hade byggt i Belgrad. Gränsen gick åter längs Sava och Donau. Wallis och Neipperg satt fängslade tills Maria Teresia frigav dem 1740, och många serber som hade ställt sig på habsburgarnas sida flydde norrut över floderna.
