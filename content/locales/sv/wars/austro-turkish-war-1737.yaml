Austro-Turkish War of 1737–1739: Österrikisk-turkiska kriget 1737–1739
A war in which the Habsburg Monarchy, as Russia’s ally, attacked the Ottoman Empire in Serbia, Bosnia and Wallachia. After brief early gains it was beaten at Banja Luka and lost Niš, and after its defeat at Grocka in 1739 the Treaty of Belgrade gave Belgrade, northern Serbia and Oltenia back to the Ottomans and Wallachia, undoing most of the gains of Passarowitz.: Ett krig där den habsburgska monarkin som Rysslands allierade angrep Osmanska riket i Serbien, Bosnien och Valakiet. Efter kortvariga tidiga framgångar besegrades den vid Banja Luka och förlorade Niš, och efter nederlaget vid Grocka 1739 gav freden i Belgrad Belgrad, norra Serbien och Oltenien tillbaka till osmanerna och Valakiet, vilket gjorde de flesta vinsterna från Passarowitz om intet.
