Wallis’s army attacked piecemeal out of a defile and was cut down from the surrounding heights. The defeat decided the war.: Wallis armé anföll bit för bit ut ur ett pass och höggs ned från de omgivande höjderna. Nederlaget avgjorde kriget.
Belgrade: Belgrad
The Ottoman army besieged the fortress after Grocka. It was handed over under the peace, after the Austrians had pulled down their new works.: Den osmanska armén belägrade fästningen efter Grocka. Den överlämnades enligt freden, sedan österrikarna rivit sina nya fästningsverk.
Signed in the grand vizier’s camp through French mediation. It set the Habsburg–Ottoman border on the Sava and the Danube.: Undertecknades i storvesirens läger genom fransk medling. Den drog gränsen mellan habsburgarna och osmanerna längs Sava och Donau.
