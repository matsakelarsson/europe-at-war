Russia’s war with the Ottomans in 1735–1739, on the Black Sea, in the Crimea and in Moldavia, is told in the Russo-Turkish War of 1735–1739, which also covers the Russian peace signed at Belgrade and Niš.: Rysslands krig mot osmanerna 1735–1739, vid Svarta havet, på Krim och i Moldavien, skildras under rysk-turkiska kriget 1735–1739, som också behandlar den ryska fred som undertecknades i Belgrad och Niš.
