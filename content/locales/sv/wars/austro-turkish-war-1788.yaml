Russia’s war with the Ottomans in 1787–1792 is told in the Russo-Turkish War of 1787–1792; the battles of Focșani and Rymnik, won jointly by Austrian and Russian troops, appear in both.: Rysslands krig mot osmanerna 1787–1792 skildras under rysk-turkiska kriget 1787–1792; slagen vid Focșani och Rymnik, som österrikiska och ryska trupper vann tillsammans, finns med i båda.
Karánsebes is today’s Caransebeș in Romania, and Sistova is Svishtov in Bulgaria.: Karánsebes är dagens Caransebeș i Rumänien, och Sistova är Svisjtov i Bulgarien.
