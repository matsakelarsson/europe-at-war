Austro-Turkish War of 1788–1791: Österrikisk-turkiska kriget 1788–1791
The last war between the Habsburg Monarchy and the Ottoman Empire, fought by Joseph II as Russia’s ally. After a disastrous first year, in which disease swept the Habsburg camps and an Ottoman army invaded the Banat, Field Marshal Laudon took Belgrade in 1789 and Austrian troops helped the Russians win at Focșani and Rymnik; but under Prussian pressure Leopold II made peace at Sistova in 1791 and gave back almost everything.: Det sista kriget mellan den habsburgska monarkin och Osmanska riket, fört av Josef II som Rysslands allierade. Efter ett katastrofalt första år, då sjukdomar svepte genom de habsburgska lägren och en osmansk armé invaderade Banatet, intog fältmarskalk Laudon Belgrad 1789, och österrikiska trupper hjälpte ryssarna att segra vid Focșani och Rymnik; men under preussiskt tryck slöt Leopold II fred i Sistova 1791 och lämnade tillbaka nästan allt.
