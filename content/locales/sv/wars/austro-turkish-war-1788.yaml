Joseph, ill since the campaign of 1788, gave the main army to the 72-year-old Laudon in July 1789. On 1 August Austrian troops under Prince Josias of Saxe-Coburg and Russians under Alexander Suvorov beat the Ottomans at Focșani in Moldavia, and on 22 September they routed the grand vizier’s army on the Rymnik. Laudon crossed the Sava in mid-September and besieged Belgrade with more than 200 guns. After three weeks of bombardment Osman Pasha surrendered on 8 October in return for free passage for his garrison. Habsburg troops occupied much of Serbia, and in November Coburg entered Bucharest and occupied Wallachia.: Josef, som varit sjuk sedan fälttåget 1788, överlämnade huvudarmén till den 72-årige Laudon i juli 1789. Den 1 augusti slog österrikiska trupper under prins Josias av Sachsen-Coburg och ryssar under Aleksandr Suvorov osmanerna vid Focșani i Moldavien, och den 22 september slog de storvesirens armé på flykten vid Rymnik. Laudon gick över Sava i mitten av september och belägrade Belgrad med mer än 200 kanoner. Efter tre veckors bombardemang kapitulerade Osman pasha den 8 oktober mot fri avmarsch för sin garnison. Habsburgska trupper besatte stora delar av Serbien, och i november ryckte Coburg in i Bukarest och besatte Valakiet.
Joseph II died on 20 February 1790. His brother Leopold II faced revolt in the Austrian Netherlands, unrest in Hungary and a Prussian army gathered on the Silesian border, and Prussia had allied with the Ottomans. At Reichenbach on 27 July 1790 he agreed to make peace on the basis of the pre-war borders, and an armistice followed at Giurgiu in September. By the Treaty of Sistova, signed on 4 August 1791 under British, Prussian and Dutch mediation, Austria gave back Belgrade, Serbia and Wallachia, keeping only Old Orsova and a strip of the Croatian border. The Serbs who had fought for Austria were left to the Ottomans, and many turned their hopes to Russia.: Josef II dog den 20 februari 1790. Hans bror Leopold II stod inför revolt i Österrikiska Nederländerna, oro i Ungern och en preussisk armé som samlats vid den schlesiska gränsen, och Preussen hade slutit förbund med osmanerna. I Reichenbach gick han den 27 juli 1790 med på att sluta fred på grundval av gränserna före kriget, och ett vapenstillestånd följde i Giurgiu i september. Genom freden i Sistova, som undertecknades den 4 augusti 1791 under brittisk, preussisk och nederländsk medling, lämnade Österrike tillbaka Belgrad, Serbien och Valakiet och behöll bara Gamla Orsova och en remsa av den kroatiska gränsen. De serber som hade stridit för Österrike lämnades åt osmanerna, och många satte i stället sitt hopp till Ryssland.
