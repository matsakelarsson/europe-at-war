Joseph II had allied with Catherine II of Russia in 1781, and when the Ottomans declared war on Russia in August 1787 he was bound to join in. Austria declared war on 9 February 1788. Joseph went to the front himself and spread his armies along the whole border from Croatia to Galicia, waiting for the Russians to draw off the Ottoman forces. He took Šabac on the Sava in April but went no further, and through the summer malaria and dysentery spread in the camps on the marshy banks of the Danube; by some accounts half the army was sick, and thousands died. Serbian refugees and volunteers formed a Free Corps, whose captains, among them Koča Anđelković, raised much of the country around Smederevo.: Josef II hade slutit förbund med Katarina II av Ryssland 1781, och när osmanerna förklarade Ryssland krig i augusti 1787 var han förpliktad att delta. Österrike förklarade krig den 9 februari 1788. Josef begav sig själv till fronten och spred ut sina arméer längs hela gränsen från Kroatien till Galizien i väntan på att ryssarna skulle dra bort de osmanska styrkorna. Han intog Šabac vid Sava i april men kom inte längre, och under sommaren spreds malaria och dysenteri i lägren på Donaus sumpiga stränder; enligt vissa uppgifter var halva armén sjuk, och tusentals dog. Serbiska flyktingar och frivilliga bildade en frikår, vars kaptener, bland dem Koča Anđelković, fick stora delar av landet kring Smederevo att resa sig.
In August the grand vizier, Koca Yusuf Pasha, crossed the Danube into the Banat, took Mehadia and burned villages, and tens of thousands of Serbs and Romanians fled north. Joseph marched against him, but on the night of 21–22 September, near Karánsebes, his retreating columns panicked and fired on each other in the dark. Later accounts of thousands killed by their own side are not borne out by contemporary reports, but the Ottomans took Karánsebes and ravaged the Banat before the winter. In Croatia, Field Marshal Ernst Gideon von Laudon did better, taking the Bosnian border forts of Dubica and Novi on the Una.: I augusti gick storvesiren Koca Yusuf pasha över Donau in i Banatet, intog Mehadia och brände byar, och tiotusentals serber och rumäner flydde norrut. Josef marscherade mot honom, men natten mellan den 21 och 22 september, nära Karánsebes, greps hans retirerande kolonner av panik och sköt på varandra i mörkret. Senare berättelser om tusentals dödade av de egna bekräftas inte av samtida rapporter, men osmanerna intog Karánsebes och härjade Banatet före vintern. I Kroatien gick det bättre för fältmarskalk Ernst Gideon von Laudon, som intog de bosniska gränsfästena Dubica och Novi vid Una.
