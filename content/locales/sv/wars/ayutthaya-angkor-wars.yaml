# Svenska översättningar av katalogtexten (våg 11); stegtexterna kommer senare.
Ayutthaya’s wars with Angkor: Ayutthayas krig mot Angkor
The wars between the new Siamese kingdom of Ayutthaya and the Khmer kingdom of Angkor, which ended with the Khmer court leaving Angkor. Ayutthaya, founded in 1351 on the lower Chao Phraya, in lands the Khmer had once ruled, attacked Angkor three times according to the chronicles. Its founder Uthong took the city in 1352 after a long siege and put his sons on the Khmer throne until a Khmer prince drove them out in 1357; Ramesuan took it again in 1393–1394 and carried off many captives; and in 1431 Borommaracha II took Angkor after a siege of seven months. The Khmer king Ponhea Yat then moved his court south-east, first to Basan near Srei Santhor and then to Chaktomuk, today’s Phnom Penh. Historians agree that the court left Angkor in the fifteenth century, but treat the chronicles’ account of the earlier wars with caution, and see the Siamese attacks as one cause among several, with the shift of trade to the Mekong and the sea, the decay of Angkor’s waterworks and long droughts.: Krigen mellan det nya siamesiska kungariket Ayutthaya och khmerernas kungarike Angkor, som slutade med att khmerhovet lämnade Angkor. Ayutthaya, som grundades 1351 vid nedre Chao Phraya, i trakter som khmererna en gång hade styrt, anföll enligt krönikorna Angkor tre gånger. Dess grundare Uthong intog staden 1352 efter en lång belägring och satte sina söner på khmertronen tills en khmerprins drev ut dem 1357; Ramesuan intog den på nytt 1393–1394 och förde bort många fångar; och 1431 intog Borommaracha II Angkor efter en sju månader lång belägring. Khmerkungen Ponhea Yat flyttade då sitt hov åt sydost, först till Basan nära Srei Santhor och sedan till Chaktomuk, dagens Phnom Penh. Historikerna är eniga om att hovet lämnade Angkor på 1400-talet, men behandlar krönikornas skildring av de tidigare krigen med försiktighet och ser de siamesiska anfallen som en orsak bland flera, jämte handelns förskjutning till Mekong och havet, förfallet av Angkors vattenanläggningar och långa torkperioder.
