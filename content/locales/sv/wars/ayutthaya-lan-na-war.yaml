Ayutthaya–Lan Na war: Kriget mellan Ayutthaya och Lan Na
The long war between the Siamese kingdom of Ayutthaya and the northern Tai kingdom of Lan Na, fought mainly over the old Sukhothai lands of the upper Chao Phraya valley. When Tilokarat seized the throne of Chiang Mai in 1441, his rebel brother’s side called in Borommaracha II of Ayutthaya, whose army was driven back from Chiang Mai in 1442; Tilokarat went on to take Nan and Phrae. After Borommaracha’s son Trailok (Borommatrailokkanat) became king in 1448, a prince of the Sukhothai line, Yuthitthira, went over to Lan Na, and Lan Na armies raided the northern cities; in 1460 the governor of Chaliang (Si Satchanalai) surrendered to Tilokarat. Trailok moved his court to Phitsanulok in 1463 to lead the war, and his son Intharacha was killed fighting the Lan Na army that year. Ayutthaya retook Chaliang in 1474, and in 1475 Tilokarat asked for peace. The war, celebrated on the Ayutthayan side in the poem Lilit Yuan Phai, left the border much as it had been.: Det långa kriget mellan det siamesiska kungariket Ayutthaya och det nordliga taikungariket Lan Na, som främst utkämpades om de gamla Sukhothailänderna i övre Chao Phrayadalen. När Tilokarat tog Chiang Mais tron 1441 kallade hans upproriske brors parti in Borommaracha II av Ayutthaya, vars armé drevs tillbaka från Chiang Mai 1442; Tilokarat intog därefter Nan och Phrae. Sedan Borommarachas son Trailok (Borommatrailokkanat) hade blivit kung 1448 gick en prins av Sukhothaiätten, Yuthitthira, över till Lan Na, och Lan Nas arméer härjade de nordliga städerna; 1460 kapitulerade guvernören i Chaliang (Si Satchanalai) för Tilokarat. Trailok flyttade sitt hov till Phitsanulok 1463 för att leda kriget, och hans son Intharacha stupade samma år i strid mot Lan Nas armé. Ayutthaya återtog Chaliang 1474, och 1475 bad Tilokarat om fred. Kriget, som på Ayutthayas sida hyllades i dikten Lilit Yuan Phai, lämnade gränsen i stort sett som den hade varit.
