# Svenska översättningar av katalogtexten (våg 14); stegtexterna kommer senare.
Aztec–Tarascan War: Aztekisk-taraskiska kriget
The attempt by the Aztec ruler Axayacatl to conquer the Purépecha (Tarascan) kingdom of Michoacán, the other great power of central Mexico, which ended in the worst defeat the Triple Alliance ever suffered. After taking the Toluca Valley from the Matlatzinca, Axayacatl marched west with an army that the chronicles put at 24,000 to 32,000 men, took several frontier towns and was routed near Taximaroa by a larger Purépecha army; the Mexica histories say only a few hundred men came home. The Purépecha then fortified their eastern border, which held until the Spanish conquest.: Aztekhärskaren Axayacatls försök att erövra purépechafolkets (taraskernas) kungarike i Michoacán, den andra stormakten i centrala Mexiko, ett försök som slutade med det värsta nederlag trippelalliansen någonsin led. Sedan Axayacatl hade tagit Tolucadalen från matlatzinca marscherade han västerut med en armé som krönikorna uppskattar till mellan 24 000 och 32 000 man, intog flera gränsstäder och slogs på flykten nära Taximaroa av en större purépechaarmé; enligt mexicas egna historieverk kom bara några hundra man hem. Purépechafolket befäste därefter sin östgräns, som höll ända till den spanska erövringen.
