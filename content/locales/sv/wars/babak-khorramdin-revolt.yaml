Revolt of Babak Khorramdin: Babak Khorramdins uppror
The revolt of the Khurramites of Azerbaijan under their leader Babak against the Abbasid caliphate. From the mountain fortress of Badhdh, between Ardabil and the Aras River, Babak defeated one caliphal army after another for some twenty years, while Khurramites rose elsewhere in western Iran. The caliph al-Mu’tasim finally sent his general al-Afshin, who advanced step by step, stormed Badhdh in August 837 and received Babak from an Armenian prince who had captured him. Babak was executed at Samarra in January 838.: Khurramiternas uppror i Azerbajdzjan under deras ledare Babak mot det abbasidiska kalifatet. Från bergsfästningen Badhdh, mellan Ardabil och floden Aras, besegrade Babak den ena kalifarmén efter den andra i omkring tjugo år, samtidigt som khurramiter gjorde uppror på andra håll i västra Iran. Till slut sände kalifen al-Mu’tasim sin fältherre al-Afshin, som ryckte fram steg för steg, stormade Badhdh i augusti 837 och fick Babak överlämnad av en armenisk furste som hade tillfångatagit honom. Babak avrättades i Samarra i januari 838.
