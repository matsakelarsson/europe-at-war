# Svenska översättningar av katalogtexten (våg 14); stegtexterna kommer senare.
Bacon’s Rebellion: Bacons uppror
? An armed rising in the Colony of Virginia in 1676 against Governor William Berkeley, led by the young planter Nathaniel Bacon, which began as unauthorised war on Native peoples. In July 1675 a quarrel between colonists and the Doeg on the Potomac led Virginia militia to kill fourteen Susquehannock by mistake; in September 1675 Maryland and Virginia militia besieged the Susquehannock fort on Piscataway Creek and killed five of their chiefs who had come out to parley. The Susquehannock answered with raids that killed dozens of colonists in Maryland and Virginia in early 1676. Frontier planters, angered by low tobacco prices, high taxes and Berkeley’s defensive plan of forts and his trade with Native allies, followed Bacon without a commission. In May 1676 his men killed many of the Occaneechi on the Roanoke River, who had just fought the Susquehannock for them, and in August and September they hunted the Pamunkey, allies of the colony, through the swamps of their country and took 45 prisoners. Berkeley declared Bacon a rebel; Bacon forced a commission from the assembly at gunpoint, issued a “Declaration of the People” against the governor on 30 July, and on 19 September 1676 (Old Style) burned Jamestown. Bacon promised freedom to servants and enslaved people who joined him, and in the last months indentured servants and enslaved Africans were among the rebels’ last holdouts. Bacon died of dysentery on 26 October 1676, and his successor, John Ingram, surrendered to Royal Navy captains in November and January; Berkeley had at least thirteen and by most counts twenty-three rebels hanged; a royal commission and 1,000 soldiers arrived in early 1677, and he was recalled. The Treaty of Middle Plantation of May 1677 with the Pamunkey queen Cockacoeske and other nations confirmed their reserved lands as tributaries of the Crown. Historians long saw the rebellion as a forerunner of the Revolution; most now stress its war on Native peoples and the planters’ turn from indentured servants to enslaved Africans that followed.
: Ett väpnat uppror i kolonin Virginia 1676 mot guvernör William Berkeley, lett av den unge plantageägaren Nathaniel Bacon, som började som ett otillåtet krig mot urfolken. I juli 1675 ledde ett gräl mellan kolonister och doeg vid Potomac till att milis från Virginia av misstag dödade fjorton susquehannock; i september 1675 belägrade milis från Maryland och Virginia susquehannockfolkets fort vid Piscataway Creek och dödade fem av deras hövdingar som hade kommit ut för att förhandla. Susquehannock svarade med räder som dödade dussintals kolonister i Maryland och Virginia i början av 1676. Plantageägare vid gränsen, förbittrade över låga tobakspriser, höga skatter och Berkeleys defensiva plan med fort och hans handel med allierade ursprungsamerikaner, följde Bacon utan fullmakt. I maj 1676 dödade hans män många occaneechi vid Roanokefloden, som just hade bekämpat susquehannock för deras räkning, och i augusti och september jagade de pamunkey, koloniens allierade, genom träsken i deras land och tog 45 fångar. Berkeley förklarade Bacon för rebell; Bacon tvingade under vapenhot till sig en fullmakt av koloniförsamlingen, utfärdade den 30 juli en ”Folkets deklaration” mot guvernören och brände den 19 september 1676 (gamla stilen) Jamestown. Bacon lovade frihet åt tjänstefolk och förslavade som anslöt sig till honom, och under de sista månaderna fanns kontraktsbundna tjänare och förslavade afrikaner bland de sista rebellerna som höll ut. Bacon dog av dysenteri den 26 oktober 1676, och hans efterträdare, John Ingram, kapitulerade inför kaptener i Royal Navy i november och januari; Berkeley lät hänga minst tretton och enligt de flesta uppgifter tjugotre rebeller; en kunglig kommission och 1 000 soldater anlände i början av 1677, och han kallades hem. Fördraget i Middle Plantation i maj 1677 med pamunkeydrottningen Cockacoeske och andra nationer bekräftade deras reserverade landområden och gjorde dem tributpliktiga under kronan. Historiker såg länge upproret som en föregångare till den amerikanska revolutionen; de flesta betonar nu dess krig mot urfolken och den övergång från kontraktsbundna tjänare till förslavade afrikaner som plantageägarna gjorde efteråt.
