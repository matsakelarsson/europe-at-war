# Svenska översättningar av katalogtexten (våg 8); stegtexterna kommer senare.
Bahmani–Vijayanagara wars: Krigen mellan Bahmanisultanatet och Vijayanagara
The wars between the Bahmani Sultanate of the Deccan and the Vijayanagara Empire of the south, fought for almost two centuries over the Raichur Doab, the fertile land between the Krishna and the Tungabhadra, with its forts of Raichur and Mudgal. Both states were born in the 1330s and 1340s from the collapse of the Delhi Sultanate’s rule in the south. In repeated wars (1362–1367, 1375–1378, 1398, 1406, 1417–1420, 1423, 1443) the Bahmani sultans usually had the better of the field and forced Vijayanagara to pay tribute, but could not hold the land south of the Tungabhadra, and both sides ravaged the country and killed civilians. Under Mahmud Gawan the Bahmanis took Goa and the west coast (1472). After the sultanate broke up into five states, Krishnadevaraya of Vijayanagara won the Doab, defeating Bijapur at the Battle of Raichur in 1520; the last Bahmani sultan fled in 1527.: Krigen mellan Bahmanisultanatet i Deckan och Vijayanagarariket i söder, som i nästan två sekler utkämpades om Raichurdoaben, det bördiga landet mellan Krishna och Tungabhadra, med dess fästningar Raichur och Mudgal. Båda staterna uppstod på 1330- och 1340-talen när Delhisultanatets välde i söder bröt samman. I upprepade krig (1362–1367, 1375–1378, 1398, 1406, 1417–1420, 1423, 1443) hade bahmanisultanerna oftast övertaget på slagfältet och tvingade Vijayanagara att betala tribut, men de kunde inte hålla landet söder om Tungabhadra, och båda sidor härjade landsbygden och dödade civila. Under Mahmud Gawan intog bahmanierna Goa och västkusten (1472). Sedan sultanatet fallit sönder i fem stater vann Krishnadevaraya av Vijayanagara doaben genom att besegra Bijapur i slaget vid Raichur 1520; den siste bahmanisultanen flydde 1527.
