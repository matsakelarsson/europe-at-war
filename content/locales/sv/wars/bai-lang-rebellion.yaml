# Svenska översättningar av katalogtexten (våg 9); stegtexterna kommer senare.
Bai Lang Rebellion: Bai Langs uppror
? A rising in central and north-western China against the government of Yuan Shikai, led by Bai Lang (1873–1914), a former officer of the New Army from Baofeng in western Henan. Bai took to arms in the disorder after the 1911 revolution with a few dozen men, survived a government purge of armed bands at Lushan in October 1912, and by 1913 led several thousand men who raided towns between the Beijing–Hankou railway and the Han River. Government papers wrote his name with the character for “wolf”, and the foreign press called him the “White Wolf”. In 1913–1914 his army, which took names such as the Citizens’ Punitive Army and claimed to fight Yuan Shikai, grew to 10,000 or more; Huang Xing and other Kuomintang leaders sent letters and arms after the failed Second Revolution, but their influence on it was small. In early 1914 it marched through Henan, Anhui and Hubei, crossed the Tongguan pass into Shaanxi and entered Gansu, where it met hard resistance from the Hui general Ma Anliang and from Hui, Tibetan and Han militias; at Taozhou thousands of Hui Muslims were killed, and Minzhou was plundered. Pressed by about 12,000 Beiyang troops under Duan Qirui’s command, the army broke up on its way back east. Bai was wounded near Lushan and died in August 1914, by most accounts in his home district; his head was shown at Kaifeng. Remnants were dispersed later that year.
: Ett uppror i centrala och nordvästra Kina mot Yuan Shikais regering, lett av Bai Lang (1873–1914), en tidigare officer i Nya armén från Baofeng i västra Henan. Bai grep till vapen i oredan efter revolutionen 1911 med några dussin man, överlevde en rensning bland väpnade band som regeringen genomförde vid Lushan i oktober 1912 och ledde 1913 flera tusen man som plundrade städer mellan järnvägen Peking–Hankou och Hanfloden. I regeringens skrifter skrevs hans namn med tecknet för ”varg”, och den utländska pressen kallade honom ”Vita vargen”. Under 1913–1914 växte hans armé, som tog namn som Medborgarnas straffarmé och sade sig strida mot Yuan Shikai, till 10 000 man eller fler; Huang Xing och andra Kuomintangledare sände brev och vapen efter den misslyckade andra revolutionen, men deras inflytande över den var litet. I början av 1914 marscherade den genom Henan, Anhui och Hubei, gick genom Tongguanpasset in i Shaanxi och tågade in i Gansu, där den mötte hårt motstånd från huigeneralen Ma Anliang och från hui-, tibetanska och hankinesiska miliser; i Taozhou dödades tusentals huimuslimer, och Minzhou plundrades. Pressad av omkring 12 000 Beiyangsoldater under Duan Qiruis befäl bröts armén upp på vägen tillbaka österut. Bai sårades nära Lushan och dog i augusti 1914, enligt de flesta uppgifter i sitt hemdistrikt; hans huvud visades upp i Kaifeng. Resterna skingrades senare samma år.
