Bakhtiyar Khalji’s campaigns: Bakhtiyar Khaljis fälttåg
The conquest of Bihar and north-western Bengal by Muhammad Bakhtiyar Khalji, a Turkish officer in the service of the Ghurids, and his failed expedition towards Tibet. From his fiefs near Mirzapur he raided Bihar, where the great Buddhist monasteries of Odantapuri and Vikramashila were destroyed in these years. In about 1204 he surprised the Sena king Lakshmana Sena at Nadia with a small advance party, made Lakhnauti (Gauda) his capital and ruled northern Bengal for the Ghurids. In 1206 he led about 10,000 horsemen north into the Himalaya to attack Tibet. The expedition ended in disaster; only about a hundred men came back, and Bakhtiyar died, perhaps murdered, at Devkot later that year. The Sena kings kept eastern Bengal for another half-century.: Erövringen av Bihar och nordvästra Bengalen genom Muhammad Bakhtiyar Khalji, en turkisk officer i ghuridernas tjänst, och hans misslyckade expedition mot Tibet. Från sina förläningar nära Mirzapur företog han plundringståg i Bihar, där de stora buddhistiska klostren Odantapuri och Vikramashila förstördes under dessa år. Omkring 1204 överraskade han senakungen Lakshmana Sena i Nadia med en liten förtrupp, gjorde Lakhnauti (Gauda) till sin huvudstad och styrde norra Bengalen för ghuridernas räkning. År 1206 ledde han omkring 10 000 ryttare norrut in i Himalaya för att angripa Tibet. Expeditionen slutade i katastrof; bara omkring hundra man kom tillbaka, och Bakhtiyar dog, kanske mördad, i Devkot senare samma år. Senakungarna behöll östra Bengalen ytterligare ett halvsekel.
