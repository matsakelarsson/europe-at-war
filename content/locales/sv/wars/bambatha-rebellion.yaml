# Svenska översättningar av katalogtexten (våg 13); stegtexterna kommer senare.
Bambatha rising: Bambatharesningen
? The last armed Zulu resistance to colonial rule, in the British Colony of Natal in 1906, known in the colonial records as the Bambatha Rebellion or Zulu Rebellion. In 1905 Natal imposed a poll tax of £1 on every African man over eighteen, on top of the hut tax, to push men into wage labour at a time of depression, cattle disease and land loss. Protests at the tax collection led to the killing of two policemen near Richmond on 8 February 1906 and to martial law; the colonial militia burned homesteads and executed twelve men. Bambatha kaMancinza, chief of the Zondi in the Mpanza valley near Greytown, was deposed for resisting the tax. In April he attacked a police patrol and withdrew into the Nkandla forest of Zululand, where the elderly chief Sigananda of the Cube joined him, and many hoped for the support of Dinuzulu, son of the last Zulu king. A colonial force of over 4,000 men under Colonel Duncan McKenzie surrounded the main body of fighters in the Mome Gorge on 10 June 1906 and killed hundreds with machine guns and artillery; the colonial forces said Bambatha was among the dead and displayed a head as his, but many Zulu believe that he escaped to Mozambique. A rising under Meseni in the lower Thukela valley was crushed by 11 July. Between 3,000 and 4,000 Africans were killed, more than 7,000 imprisoned and some 4,000 flogged; 36 colonial soldiers died. Dinuzulu was tried for treason and imprisoned. Mohandas Gandhi led an Indian stretcher-bearer corps for the colonial forces and later called the campaign “no war but a man hunt”. In 2006 South Africa declared Bambatha a national hero.
: Det sista väpnade zuluiska motståndet mot kolonialstyret, i den brittiska kolonin Natal 1906, i de koloniala handlingarna känt som Bambathaupproret eller zuluupproret. 1905 införde Natal en huvudskatt på 1 pund för varje afrikansk man över arton år, utöver hyddskatten, för att driva männen till lönearbete i en tid av depression, boskapssjukdom och markförluster. Protester vid skatteuppbörden ledde till att två poliser dödades nära Richmond den 8 februari 1906 och till krigslagar; kolonialmilisen brände gårdar och avrättade tolv män. Bambatha kaMancinza, hövding över zondi i Mpanzadalen nära Greytown, avsattes för att han gjort motstånd mot skatten. I april anföll han en polispatrull och drog sig tillbaka till Nkandlaskogen i Zululand, där den gamle hövdingen Sigananda av cube anslöt sig till honom, och många hoppades på stöd från Dinuzulu, son till den siste zulukungen. En kolonial styrka på över 4 000 man under överste Duncan McKenzie omringade krigarnas huvudstyrka i Momeravinen den 10 juni 1906 och dödade hundratals med kulsprutor och artilleri; de koloniala styrkorna uppgav att Bambatha var bland de döda och visade upp ett huvud som de sade var hans, men många zulu tror att han flydde till Moçambique. En resning under Meseni i nedre Thukeladalen hade slagits ned den 11 juli. Mellan 3 000 och 4 000 afrikaner dödades, mer än 7 000 fängslades och omkring 4 000 piskades; 36 koloniala soldater dog. Dinuzulu ställdes inför rätta för förräderi och fängslades. Mohandas Gandhi ledde en indisk bårbärarkår för de koloniala styrkorna och kallade senare fälttåget ”inget krig utan en människojakt”. 2006 förklarade Sydafrika Bambatha som nationalhjälte.
