# Svenska översättningar av katalogtexten (våg 8); stegtexterna kommer senare.
Bangladesh Liberation War: Bangladeshs befrielsekrig
The war in which East Pakistan became independent as Bangladesh. After the Awami League of Sheikh Mujibur Rahman won the Pakistani elections of December 1970 and the military government postponed the new assembly, the Pakistan Army began a crackdown in Dhaka on the night of 25 March 1971 (Operation Searchlight) and arrested Mujib. Bengali leaders declared independence, a government in exile was formed, and Bengali soldiers, police and volunteers, the Mukti Bahini, fought a guerrilla war with Indian support. The army and allied militias killed large numbers of civilians, especially Hindus, students and Awami League supporters; estimates of the dead range from about 300,000 to three million, and some ten million refugees fled to India. India entered the war openly in December, and Pakistan’s Eastern Command surrendered in Dhaka on 16 December 1971.: Kriget där Östpakistan blev självständigt som Bangladesh. Sedan Sheikh Mujibur Rahmans Awamiförbundet hade vunnit de pakistanska valen i december 1970 och militärregeringen skjutit upp den nya församlingens sammanträde, inledde Pakistans armé ett tillslag i Dhaka natten den 25 mars 1971 (Operation Searchlight) och grep Mujib. Bengaliska ledare utropade självständighet, en exilregering bildades, och bengaliska soldater, poliser och frivilliga, Mukti Bahini, förde ett gerillakrig med indiskt stöd. Armén och allierade miliser dödade ett stort antal civila, särskilt hinduer, studenter och anhängare av Awamiförbundet; uppskattningarna av antalet döda sträcker sig från omkring 300 000 till tre miljoner, och omkring tio miljoner flyktingar tog sig till Indien. Indien gick öppet in i kriget i december, och Pakistans östra kommando kapitulerade i Dhaka den 16 december 1971.
