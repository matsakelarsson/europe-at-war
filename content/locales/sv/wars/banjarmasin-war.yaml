# Svenska översättningar av katalogtexten (våg 11); stegtexterna kommer senare.
Banjarmasin War: Banjarmasinkriget
? "The war of the Banjar sultanate in south-eastern Borneo and its Dayak allies against the Dutch, known in Indonesia as the Banjar War (Perang Banjar). After Sultan Adam died in 1857 the Dutch installed Tamjidillah as sultan over the claims of Prince Hidayatullah, whom much of the court preferred, and exiled another claimant; resentment of Dutch interference, taxes and the new Dutch coal mines grew. On 28 April 1859 Prince Antasari, a member of the royal house, attacked the Oranje Nassau coal mine at Pengaron, and the rising spread across the sultanate and up the Barito River. The Dutch deposed Tamjidillah, declared the sultanate abolished in 1860 and annexed its lands, and by 1863 had broken the main resistance: Hidayatullah surrendered in 1862 and was exiled to Java, and Antasari, proclaimed head of the faithful by his followers, died of smallpox on the upper Barito in October 1862. His sons and other leaders fought on from forts in the interior for four more decades, until Gusti Muhammad Seman was killed at Baras Kuning on 24 January 1905."
: "Det krig som sultanatet Banjar på sydöstra Borneo och dess dajakiska allierade förde mot nederländarna, i Indonesien känt som Banjarkriget (Perang Banjar). Sedan sultan Adam hade dött 1857 insatte nederländarna Tamjidillah som sultan och förbigick prins Hidayatullahs anspråk, trots att stora delar av hovet föredrog denne, och de förvisade en annan tronpretendent; förbittringen över nederländsk inblandning, skatter och de nya nederländska kolgruvorna växte. Den 28 april 1859 anföll prins Antasari, en medlem av kungahuset, kolgruvan Oranje Nassau i Pengaron, och resningen spred sig över hela sultanatet och uppför floden Barito. Nederländarna avsatte Tamjidillah, förklarade sultanatet avskaffat 1860 och annekterade dess land, och 1863 hade de brutit det huvudsakliga motståndet: Hidayatullah gav upp 1862 och förvisades till Java, och Antasari, som av sina anhängare hade utropats till de troendes överhuvud, dog i smittkoppor vid övre Barito i oktober 1862. Hans söner och andra ledare fortsatte kampen från fästen i inlandet i ytterligare fyra årtionden, tills Gusti Muhammad Seman dödades vid Baras Kuning den 24 januari 1905."
