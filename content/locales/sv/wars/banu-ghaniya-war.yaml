# Svenska översättningar av katalogtexten (våg 12); stegtexterna kommer senare.
Banu Ghaniya’s war in Ifriqiya: Banu Ghaniyas krig i Ifriqiya
Half a century of war in the eastern Maghreb between the Almohad Caliphate and the Banu Ghaniya, the last branch of the Almoravid ruling family, who had kept the Balearic Islands after the Almohads overthrew the Almoravids. In November 1184 Ali ibn Ghaniya landed at Bougie and, with the help of Arab tribes, overran much of the central Maghreb; driven back by the caliph Abu Yusuf Yaqub al-Mansur, he joined forces with Qaraqush, a mamluk commander from Ayyubid Egypt who held Tripoli, until al-Mansur defeated them in 1187. Ali’s brother Yahya kept the war going, took Mahdia and Tunis and by 1203 ruled most of Ifriqiya. The caliph Muhammad al-Nasir won it back in 1205–1206 and left Abd al-Wahid ibn Abi Hafs as governor, and Yahya went on raiding from the desert until his death in the 1230s. The war kept the Almohads from ever ruling the east securely, and their Hafsid governors became the rulers of Ifriqiya.: Ett halvsekel av krig i östra Maghreb mellan det almohadiska kalifatet och Banu Ghaniya, den sista grenen av den almoravidiska härskarsläkten, som hade behållit Balearerna sedan almohaderna störtat almoraviderna. I november 1184 landsteg Ali ibn Ghaniya vid Bougie och lade med hjälp av arabiska stammar under sig stora delar av centrala Maghreb; när han hade trängts tillbaka av kalifen Abu Yusuf Yaqub al-Mansur gick han samman med Qaraqush, en mamlukisk befälhavare från det ayyubidiska Egypten som behärskade Tripoli, tills al-Mansur besegrade dem 1187. Alis bror Yahya förde kriget vidare, intog Mahdia och Tunis och härskade 1203 över större delen av Ifriqiya. Kalifen Muhammad al-Nasir återvann landet 1205–1206 och lämnade kvar Abd al-Wahid ibn Abi Hafs som guvernör, och Yahya fortsatte att göra räder från öknen fram till sin död på 1230-talet. Kriget hindrade almohaderna från att någonsin få ett säkert grepp om östern, och deras hafsidiska guvernörer blev Ifriqiyas härskare.
