# Svenska översättningar av katalogtexten (våg 12); stegtexterna kommer senare.
Hilalian invasion of Ifriqiya: Den hilaliska invasionen av Ifriqiya
? The arrival in Ifriqiya of the Banu Hilal and Banu Sulaym, Arab Bedouin tribes whom the Fatimid caliphs of Cairo turned loose on their former governors, the Zirids, after the Zirid emir al-Mu’izz ibn Badis broke with Cairo and recognised the Abbasid caliph in Baghdad in the 1040s. On the advice of the vizier al-Yazuri, the caliph al-Mustansir granted the Maghreb to the tribes, then camping in Upper Egypt, in 1050. The Sulaym settled in Cyrenaica; the Hilal moved on into Tripolitania and southern Ifriqiya, and on 14 April 1052 they routed al-Mu’izz’s much larger army at Haydaran, near Gabès. For five years they roamed and plundered the countryside around Kairouan, until in 1057 al-Mu’izz withdrew to the coastal fortress of Mahdia and the tribes sacked his abandoned capital. Ifriqiya broke up into small principalities paying the Arab chiefs for protection. Medieval writers, above all Ibn Khaldun, compared the Hilalians to a swarm of locusts that left ruin behind; many modern historians see a slower migration of families that did less damage than once claimed but changed the Maghreb for good, spreading pastoral nomadism and the Arabic language in the countryside.
: Ankomsten till Ifriqiya av Banu Hilal och Banu Sulaym, arabiska beduinstammar som fatimidkaliferna i Kairo släppte lösa på sina forna ståthållare, ziriderna, sedan den ziridiske emiren al-Mu’izz ibn Badis på 1040-talet hade brutit med Kairo och erkänt den abbasidiske kalifen i Bagdad. På inrådan av vesiren al-Yazuri tilldelade kalifen al-Mustansir 1050 Maghreb åt stammarna, som då höll till i Övre Egypten. Sulaym slog sig ned i Cyrenaika; Hilal drog vidare in i Tripolitanien och södra Ifriqiya, och den 14 april 1052 krossade de vid Haydaran nära Gabès den betydligt större armé som al-Mu’izz hade ställt upp. I fem år strövade de omkring och plundrade landsbygden kring Kairouan, tills al-Mu’izz 1057 drog sig tillbaka till kustfästningen Mahdia och stammarna plundrade hans övergivna huvudstad. Ifriqiya splittrades i små furstendömen som betalade de arabiska hövdingarna för beskydd. Medeltida författare, framför allt Ibn Khaldun, jämförde hilalierna med en gräshoppssvärm som lämnade förödelse efter sig; många moderna historiker ser i stället en långsammare invandring av familjer som orsakade mindre skada än man en gång hävdat men förändrade Maghreb för alltid, genom att sprida nomadisk boskapsskötsel och det arabiska språket på landsbygden.
