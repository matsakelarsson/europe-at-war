# Svenska översättningar av katalogtexten (våg 14); stegtexterna kommer senare.
Baptist War: Baptistkriget
? The largest rising of enslaved people in the British Caribbean, also called the Christmas Rebellion and the Great Jamaican Slave Revolt of 1831–1832. It was planned by Samuel Sharpe, an enslaved man of Montego Bay who was a deacon of the Baptist chapel of the missionary Thomas Burchell and a leader among the Black Baptists of western Jamaica. As the campaign against slavery grew in Britain, many enslaved Jamaicans believed that the king had granted freedom and that the planters were withholding it. Sharpe and his companions swore people on the estates to refuse to work after the Christmas holidays of 1831 unless they were paid wages. The strike turned into an armed rising when the trash house of Kensington estate in the hills of Saint James was set alight on 27 December. Up to 60,000 of the island’s roughly 300,000 enslaved people took part across Saint James, Hanover, Westmoreland, Trelawny and Saint Elizabeth; estates were burned, and a rebel Black Regiment drove back a militia force. The governor, Lord Belmore, declared martial law, and British troops under Sir Willoughby Cotton, with the militia and Maroons, broke the rising in the first weeks of January 1832. Fourteen white people were killed. More than 200 rebels died in the fighting, and between 310 and 340 were executed after trials by courts martial and slave courts; Sharpe was hanged at Montego Bay on 23 May 1832. Planters blamed the missionaries and destroyed Baptist and Methodist chapels. The Assembly put the damage at £1,154,589. The rising and the reprisals, reported in Britain by the missionaries, helped persuade Parliament to pass the Slavery Abolition Act of 1833.
: Den största resningen bland förslavade i brittiska Karibien, även kallad julupproret och det stora jamaicanska slavupproret 1831–1832. Den planerades av Samuel Sharpe, en förslavad man från Montego Bay som var diakon i missionären Thomas Burchells baptistkapell och en ledare bland de svarta baptisterna på västra Jamaica. När kampanjen mot slaveriet växte i Storbritannien trodde många förslavade jamaicaner att kungen hade beviljat dem friheten och att plantageägarna undanhöll den. Sharpe och hans följeslagare lät folk på plantagerna svära att vägra arbeta efter julhelgen 1831 om de inte fick lön. Strejken övergick i en väpnad resning när förrådshuset för bagass på plantagen Kensington i bergen i Saint James sattes i brand den 27 december. Upp till 60 000 av öns omkring 300 000 förslavade deltog i Saint James, Hanover, Westmoreland, Trelawny och Saint Elizabeth; plantager brändes, och rebellernas Svarta regemente drev tillbaka en milisstyrka. Guvernören, lord Belmore, utlyste krigslagar, och brittiska trupper under sir Willoughby Cotton krossade tillsammans med milisen och maroner resningen under de första veckorna av januari 1832. Fjorton vita dödades. Mer än 200 rebeller dog i striderna, och mellan 310 och 340 avrättades efter rättegångar inför krigsrätter och slavdomstolar; Sharpe hängdes i Montego Bay den 23 maj 1832. Plantageägarna gav missionärerna skulden och förstörde baptisternas och metodisternas kapell. Den lagstiftande församlingen beräknade skadorna till 1 154 589 pund. Resningen och repressalierna, som missionärerna rapporterade om i Storbritannien, bidrog till att övertyga parlamentet att anta lagen om slaveriets avskaffande (Slavery Abolition Act) 1833.
