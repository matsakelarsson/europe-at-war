Bar Confederation: Barkonfederationen
In February 1768 Polish nobles formed a confederation at Bar in Podolia against Russian domination, King Stanisław August and the rights for Protestants and Orthodox that Russia had forced on the Sejm. Four years of guerrilla war against Russian troops followed, during which Cossacks in Russian service, chasing confederates, raided the Ottoman border town of Balta, which helped start the Russo-Turkish War of 1768–1774. The last strongholds, among them Częstochowa, fell in 1772, the year Russia, Prussia and Austria took almost a third of Poland–Lithuania in the First Partition.: I februari 1768 bildade polska adelsmän en konfederation i Bar i Podolien mot den ryska dominansen, kung Stanisław August och de rättigheter för protestanter och ortodoxa som Ryssland hade tvingat på sejmen. Fyra års gerillakrig mot ryska trupper följde, och under det plundrade kosacker i rysk tjänst, som förföljde konfederater, den osmanska gränsstaden Balta, vilket bidrog till att utlösa rysk-turkiska kriget 1768–1774. De sista fästena, bland dem Częstochowa, föll 1772, samma år som Ryssland, Preussen och Österrike tog nästan en tredjedel av Polen–Litauen vid den första delningen.
