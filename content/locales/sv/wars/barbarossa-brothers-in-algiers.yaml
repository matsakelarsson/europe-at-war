# Svenska översättningar av katalogtexten (våg 12); stegtexterna kommer senare.
The Barbarossa brothers and the Ottoman conquest of Algiers: Bröderna Barbarossa och den osmanska erövringen av Alger
The war in which two Turkish corsair brothers, Oruç and Hayreddin, called Barbarossa by the Europeans, fought the Spanish garrisons of the central Maghreb and made Algiers an Ottoman province. Invited by the rulers of Bougie and Algiers to drive out the Spaniards, Oruç failed at Bougie in 1512 and 1514 but took Jijel and, in 1516, Algiers, where he had its ruler Salim al-Tumi killed and beat off a Spanish expedition. He took Ténès and Tlemcen in 1517, but a Spanish army from Oran besieged him there, and he was killed while trying to escape in May 1518. Hayreddin, holding only the coast, put himself under the Ottoman sultan Selim I in 1519 and received the title of beylerbey with 2,000 janissaries. Driven out of Algiers in 1520 by a coalition of the Kabyle kingdom of Kuku and the Hafsids, he won it back in 1525, and in May 1529 he took the Spanish fort on the Peñón, the island facing the city, and joined it to the shore with a mole to make the harbour of Algiers.: Det krig där två turkiska korsarbröder, Oruç och Hayreddin, av européerna kallade Barbarossa, bekämpade de spanska garnisonerna i centrala Maghreb och gjorde Alger till en osmansk provins. Inbjuden av härskarna i Bougie och Alger att driva ut spanjorerna misslyckades Oruç vid Bougie 1512 och 1514 men intog Jijel och 1516 Alger, där han lät döda stadens härskare Salim al-Tumi och slog tillbaka en spansk expedition. Han intog Ténès och Tlemcen 1517, men en spansk armé från Oran belägrade honom där, och han dödades under ett försök att fly i maj 1518. Hayreddin, som bara behärskade kusten, ställde sig 1519 under den osmanske sultanen Selim I och fick titeln beylerbey och 2 000 janitsjarer. Sedan han 1520 hade drivits ut ur Alger av en koalition av det kabyliska kungariket Kuku och hafsiderna återtog han staden 1525, och i maj 1529 intog han det spanska fortet på Peñón, ön mitt emot staden, och förband ön med stranden genom en vågbrytare så att Algers hamn bildades.
