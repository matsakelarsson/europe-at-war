# Svenska översättningar av katalogtexten (våg 12); stegtexterna kommer senare.
Barbary Crusade (Mahdia, 1390): Barbareskkorståget (Mahdia, 1390)
? A French and Genoese expedition against Mahdia, a port of the Hafsid kingdom of Tunis from which ships raided Christian shipping and coasts. Genoa, whose trade suffered from the raids, offered ships, supplies and soldiers if France would provide the knights, and Charles VI allowed his uncle Louis II, Duke of Bourbon, to lead about 1,500 French knights and squires, with some English volunteers such as John Beaufort; Pope Boniface IX gave the enterprise crusade privileges. The fleet landed before Mahdia in July 1390 and laid siege to it. The Hafsid sultan Abu al-Abbas Ahmad II came to its relief with an army that included troops from Bougie and Tlemcen; it avoided a pitched battle and harassed the crusaders, who fortified their camp, while disease and shortages wore them down and a last assault on the walls failed. After about two months the Genoese negotiated a ten-year truce, and the army was back in Genoa by mid-October, having lost 274 knights and squires to fighting and disease. Both sides claimed victory; the town stayed Hafsid, and many of the French leaders went on to fight at Nicopolis in 1396.
: En fransk-genuesisk expedition mot Mahdia, en hamn i det hafsidiska kungariket Tunis varifrån fartyg angrep kristen sjöfart och kristna kuster. Genua, vars handel led av räderna, erbjöd fartyg, förnödenheter och soldater om Frankrike ställde upp med riddarna, och Karl VI lät sin morbror Ludvig II, hertig av Bourbon, leda omkring 1 500 franska riddare och väpnare, med några engelska frivilliga som John Beaufort; påven Bonifatius IX gav företaget korstågsprivilegier. Flottan landsteg framför Mahdia i juli 1390 och belägrade staden. Den hafsidiske sultanen Abu al-Abbas Ahmad II kom till undsättning med en armé som omfattade trupper från Bougie och Tlemcen; den undvek ett fältslag och ofredade korsfararna, som befäste sitt läger, medan sjukdomar och brist nötte ned dem och ett sista anfall mot murarna misslyckades. Efter omkring två månader förhandlade genueserna fram ett tioårigt stillestånd, och hären var tillbaka i Genua i mitten av oktober efter att ha förlorat 274 riddare och väpnare i strider och sjukdomar. Båda sidor gjorde anspråk på segern; staden förblev hafsidisk, och många av de franska ledarna stred sedan vid Nikopolis 1396.
