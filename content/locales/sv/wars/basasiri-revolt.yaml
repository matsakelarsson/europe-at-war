# Svenska översättningar av katalogtexten (våg 7); stegtexterna kommer senare.
Revolt of al-Basasiri: Al-Basasiris uppror
The seizure of Baghdad for the Fatimid caliphate of Cairo by al-Basasiri, the Turkish commander of the last Buyids in Iraq. Driven out when the Seljuk Tughril entered Baghdad in 1055, al-Basasiri took service with the Fatimid caliph al-Mustansir, defeated a Seljuk force at Sinjar in January 1057 and briefly held Mosul. In 1058 Tughril’s half-brother Ibrahim Inal rebelled in western Iran and drew Tughril away, and in late December al-Basasiri entered Baghdad with his Arab allies, the Uqaylid emir Quraysh and the Mazyadid Dubays. For about forty weeks the Friday sermon was read in the name of the Fatimid caliph. The Abbasid caliph al-Qa’im was sent into custody at Haditha on the Euphrates, and his vizier Ibn al-Muslima was executed. After defeating and executing Ibrahim Inal, Tughril marched back to Iraq. Al-Basasiri left Baghdad in December 1059, al-Qa’im was restored, and al-Basasiri was defeated and killed near Kufa in January 1060.: Den erövring av Bagdad som al-Basasiri, turkisk befälhavare under de sista buyiderna i Irak, genomförde för det fatimidiska kalifatet i Kairo. Sedan han drivits ut när seldjuken Tughril tågade in i Bagdad 1055 trädde al-Basasiri i tjänst hos den fatimidiske kalifen al-Mustansir, besegrade en seldjukisk styrka vid Sinjar i januari 1057 och behärskade en kort tid Mosul. År 1058 gjorde Tughrils halvbror Ibrahim Inal uppror i västra Iran och drog bort Tughril, och i slutet av december tågade al-Basasiri in i Bagdad med sina arabiska bundsförvanter, den uqaylidiske emiren Quraysh och mazyadiden Dubays. I omkring fyrtio veckor lästes fredagspredikan i den fatimidiske kalifens namn. Den abbasidiske kalifen al-Qa’im sattes i förvar i Haditha vid Eufrat, och hans vesir Ibn al-Muslima avrättades. Sedan Tughril besegrat och avrättat Ibrahim Inal marscherade han tillbaka till Irak. Al-Basasiri lämnade Bagdad i december 1059, al-Qa’im återinsattes, och al-Basasiri besegrades och dödades nära Kufa i januari 1060.
