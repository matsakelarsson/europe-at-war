Basmachi movement: Basmatjrörelsen
An armed resistance to Soviet rule in Central Asia, made up of many separate bands rather than one organisation. It began in the Ferghana Valley after Soviet troops sacked Kokand, the seat of the short-lived Turkestan Autonomy, in February 1918, and spread to Bukhara and Khiva after the Red Army overthrew their rulers in 1920. The former Ottoman war minister Enver Pasha led part of it until he was killed in 1922. Red Army offensives, religious and economic concessions and war-weariness broke the movement by the mid-1920s, but exiles raided from Afghanistan and the collectivisation of farming set off new revolts until the early 1930s.: Ett väpnat motstånd mot sovjetstyret i Centralasien, som bestod av många separata band snarare än en enda organisation. Det började i Ferganadalen sedan sovjetiska trupper i februari 1918 plundrat Kokand, säte för den kortlivade Turkestanska autonomin, och spred sig till Buchara och Chiva sedan Röda armén störtat deras härskare 1920. Osmanska rikets förre krigsminister Enver pasha ledde en del av rörelsen tills han dödades 1922. Röda arméns offensiver, religiösa och ekonomiska eftergifter och krigströtthet bröt rörelsen vid mitten av 1920-talet, men landsflyktiga gjorde räder från Afghanistan, och jordbrukets kollektivisering utlöste nya uppror fram till början av 1930-talet.
