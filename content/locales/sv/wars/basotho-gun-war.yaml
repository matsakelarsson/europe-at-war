# Svenska översättningar av katalogtexten (våg 13); stegtexterna kommer senare.
Basotho Gun War: Basothos gevärskrig
? "The war in which the Basotho resisted the Cape Colony’s attempt to disarm them, and kept their guns. Basutoland, a British protectorate since 1868, had been annexed to the Cape in 1871. Many Basotho had bought rifles with wages earned at the Kimberley diamond fields, and to them guns meant the defence of their land and cattle and the standing of grown men. In 1879 the Cape doubled the hut tax, crushed the rising of the Baphuthi chief Moorosi in the south and announced that the Quthing district would be opened to white settlement; Gordon Sprigg’s government extended the Peace Preservation Act of 1878 to Basutoland, and in 1880 ordered all firearms handed in for compensation. Most chiefs refused. The paramount chief Letsie I stayed formally loyal; his son Lerotholi led the resistance in the south and besieged the magistracy at Mafeteng, and Letsie’s brother Masopha held Thaba Bosiu and blockaded Maseru, while Jonathan Molapo in the north sided with the government against his kinsman Joel Molapo. Cape forces, the Cape Mounted Riflemen, yeomanry and burgher volunteers under Brigadier-General Charles Clarke and Lieutenant-Colonel Frederick Carrington, entered Basutoland on 13 September 1880, but the Basotho, mounted and armed with rifles, fought them to a standstill: at Qalabane on 19 October 1880 Lerotholi’s horsemen cut up a Cape column. The Cape spent about £3 million and lost some 94 men killed. On 29 April 1881 the High Commissioner, Sir Hercules Robinson, gave an award that let the Basotho keep their guns on payment of a licence fee, with a fine in cattle and an amnesty, and Quthing remained Basotho land. Unrest continued, and in 1884 the Cape handed Basutoland back to the Crown, which ruled it as a High Commission territory; that is why Lesotho was not included in the Union of South Africa in 1910 and became independent in 1966."
: "Det krig där basotho gjorde motstånd mot Kapkolonins försök att avväpna dem, och behöll sina gevär. Basutoland, som varit brittiskt protektorat sedan 1868, hade anslutits till Kapkolonin 1871. Många basotho hade köpt gevär för löner som de tjänat vid diamantfälten i Kimberley, och för dem stod gevären för försvaret av deras land och boskap och för vuxna mäns anseende. 1879 fördubblade Kapkolonin hyddskatten, slog ned baphuthihövdingen Moorosis resning i söder och tillkännagav att distriktet Quthing skulle öppnas för vit bosättning; Gordon Spriggs regering utsträckte 1878 års lag om fredens bevarande (Peace Preservation Act) till Basutoland och beordrade 1880 att alla skjutvapen skulle lämnas in mot ersättning. De flesta hövdingar vägrade. Överhövdingen Letsie I förblev formellt lojal; hans son Lerotholi ledde motståndet i söder och belägrade magistratsstationen i Mafeteng, och Letsies bror Masopha höll Thaba Bosiu och blockerade Maseru, medan Jonathan Molapo i norr ställde sig på regeringens sida mot sin släkting Joel Molapo. Kapkolonins styrkor, Cape Mounted Riflemen, yeomanry och frivilliga borgarstyrkor under brigadgeneral Charles Clarke och överstelöjtnant Frederick Carrington, gick in i Basutoland den 13 september 1880, men basotho, som var beridna och beväpnade med gevär, tvingade dem till ett dödläge: vid Qalabane den 19 oktober 1880 tillfogade Lerotholis ryttare en kolonn från Kapkolonin svåra förluster. Kapkolonin spenderade omkring 3 miljoner pund och förlorade omkring 94 man i stupade. Den 29 april 1881 avkunnade högkommissarien, Sir Hercules Robinson, ett skiljedomsutslag som lät basotho behålla sina gevär mot en licensavgift, med böter i boskap och en amnesti, och Quthing förblev basothomark. Oroligheterna fortsatte, och 1884 lämnade Kapkolonin tillbaka Basutoland till kronan, som styrde det som ett högkommissionsterritorium; det är därför Lesotho inte ingick i Sydafrikanska unionen 1910 utan blev självständigt 1966."
