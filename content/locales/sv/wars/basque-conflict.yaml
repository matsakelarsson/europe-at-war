Basque conflict: Baskiska konflikten
The armed campaign of ETA (Euskadi Ta Askatasuna, “Basque Homeland and Freedom”) for an independent socialist Basque state, against Franco’s dictatorship and then against democratic Spain and France. Founded in 1959, ETA killed its first victim in 1968, assassinated the Spanish prime minister Luis Carrero Blanco in 1973, and in all killed over 800 people, among them police, soldiers, politicians, journalists and many bystanders, with its worst year in 1980 and the Hipercor bombing in Barcelona in 1987 the deadliest attack. The state answered with mass arrests, cases of torture and, in 1983–1987, the GAL death squads, which killed 27 people. Weakened by arrests and loss of support, ETA declared a definitive end to its armed activity on 20 October 2011, gave up its weapons in 2017 and dissolved itself in 2018.: ETA:s (Euskadi Ta Askatasuna, ”Baskiskt hemland och frihet”) väpnade kampanj för en självständig socialistisk baskisk stat, först mot Francos diktatur och sedan mot det demokratiska Spanien och Frankrike. ETA grundades 1959, dödade sitt första offer 1968, mördade den spanske premiärministern Luis Carrero Blanco 1973 och dödade sammanlagt över 800 människor, bland dem poliser, soldater, politiker, journalister och många utomstående; det värsta året var 1980, och bombdådet mot Hipercor i Barcelona 1987 var det dödligaste attentatet. Staten svarade med massgripanden, fall av tortyr och, 1983–1987, GAL:s dödspatruller, som dödade 27 människor. Försvagad av gripanden och minskat stöd förklarade ETA den 20 oktober 2011 att dess väpnade verksamhet definitivt upphört, lämnade ifrån sig sina vapen 2017 och upplöste sig själv 2018.
