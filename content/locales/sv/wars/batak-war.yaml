# Svenska översättningar av katalogtexten (våg 11); stegtexterna kommer senare.
Batak War: Batakkriget
? The resistance of Sisingamangaraja XII, the priest-king of the Toba Batak, to the Dutch advance into the Batak highlands of North Sumatra. German missionaries of the Rhenish Mission, led by Ludwig Ingwer Nommensen, had worked in the Silindung valley around Tarutung since the 1860s, and the Dutch stationed troops there to protect them and their converts. Sisingamangaraja XII, whose authority over the Toba Batak was religious more than administrative, saw the mission and the soldiers as a threat to the Batak religion and to the lands still outside Dutch rule. In February 1878 he held a ceremony to rally the Batak and attacked the Dutch posts at Bahal Batu and Tarutung; the attacks failed, and Dutch expeditions that year brought Silindung and much of the southern Toba country under Dutch rule. In 1883–1884, with help from Aceh, then at war with the Dutch, his followers attacked Dutch positions at Uluan, Balige and Tangga Batu; the Dutch replied with burnings, fines and executions but could not catch him. In 1894 they took Bakkara, his seat on the south-western shore of Lake Toba, and he moved to Parlilitan in the hills west of the lake and then to the forests of the Dairi (Pakpak) country, keeping in touch with the Acehnese. In 1904 van Daalen’s column passed through the Batak lands at the end of its march through the Gayo and Alas country. In 1907 a Marechaussee column under Captain Hans Christoffel captured his wife and two of his children, and on 17 June 1907 it caught up with him in the Dairi forest and killed him, his daughter Lopian and his sons Patuan Nagari and Patuan Anggi. His death ended the war. Indonesia declared him a National Hero in 1961.
: Det motstånd som Sisingamangaraja XII, tobabatakernas prästkung, gjorde mot den nederländska framryckningen in i Batakhöglandet på norra Sumatra. Tyska missionärer från Rhenska missionssällskapet, ledda av Ludwig Ingwer Nommensen, hade sedan 1860-talet verkat i Silindungdalen runt Tarutung, och nederländarna förlade trupper där för att skydda dem och de nyomvända. Sisingamangaraja XII, vars auktoritet över tobabatakerna var mer religiös än administrativ, såg missionen och soldaterna som ett hot mot batakernas religion och mot de områden som ännu låg utanför det nederländska styret. I februari 1878 höll han en ceremoni för att samla batakerna och anföll de nederländska posterna i Bahal Batu och Tarutung; anfallen misslyckades, och nederländska expeditioner samma år förde Silindung och stora delar av det södra Tobalandet under nederländskt styre. Åren 1883–1884 anföll hans anhängare, med hjälp från Aceh, som då låg i krig med nederländarna, nederländska ställningar i Uluan, Balige och Tangga Batu; nederländarna svarade med nedbränningar, böter och avrättningar men kunde inte fånga honom. År 1894 intog de Bakkara, hans säte på Tobasjöns sydvästra strand, och han flyttade till Parlilitan i bergen väster om sjön och sedan till skogarna i Dairilandet (Pakpak), där han höll kontakten med acehneserna. År 1904 passerade van Daalens kolonn genom batakernas land i slutet av sin marsch genom Gayo- och Alaslandet. År 1907 tillfångatog en marechaussee-kolonn under kapten Hans Christoffel hans hustru och två av hans barn, och den 17 juni 1907 hann den upp honom i Dairiskogen och dödade honom, hans dotter Lopian och hans söner Patuan Nagari och Patuan Anggi. Hans död gjorde slut på kriget. Indonesien förklarade honom som nationalhjälte 1961.
