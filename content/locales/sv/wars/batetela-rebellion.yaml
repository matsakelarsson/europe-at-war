# Svenska översättningar av katalogtexten (våg 13); stegtexterna kommer senare.
Batetela rebellion: Batetelaupproret
? Three revolts of Tetela and Kusu soldiers of the Congo Free State’s army, the Force Publique, and the guerrilla war that followed them, from 1895 until 1901 or later. The Free State had recruited heavily among the Tetela of the Sankuru, Lomami and Maniema during the Congo Arab war of 1892–1894, in which their leader Ngongo Lutete changed sides and fought for the Free State. In September 1893 Ngongo was executed after a summary court-martial on a charge of treason that many of his followers considered false. In July 1895 the Tetela soldiers of the garrison at Luluabourg (Kananga) rose, killed one of their Belgian officers and marched off; Tetela soldiers from other posts joined them over the following years, and by October 1896 there were some 3,000–4,000 of them in the Kasai, the Lomami and Maniema. In 1897 about 1,300 Tetela and Kusu soldiers of Francis Dhanis’s expedition to the Upper Nile, described as the largest colonial force yet assembled in Africa, rose in the north-east of the Free State over harsh treatment and the execution of some of their chiefs, killed about ten Belgian officers and broke up the expedition, which was meant to claim the Fashoda region before the British and the French; Dhanis spent 1897 and 1898 fighting the rebel bands. On 17 April 1900 the garrison of the Shinkakasa fort, which guarded the river below the capital, Boma, also rose, fired on a ship moored in the river and threatened the town before it was overcome. The last bands, around Lake Kisale in northern Katanga, were defeated in 1901 by some accounts and in 1908 by others. Afterwards the colonial authorities mixed the peoples in every unit of the Force Publique so that no group was a majority. Free State and Belgian writers called the revolts mutinies; they are now counted among the most important anti-colonial revolts in the Congo’s history.
: Tre revolter bland tetela- och kususoldater i Kongostatens armé, Force Publique, och det gerillakrig som följde på dem, från 1895 till 1901 eller senare. Kongostaten hade rekryterat i stor skala bland tetela i Sankuru, Lomami och Maniema under Kongo-arabiska kriget 1892–1894, där deras ledare Ngongo Lutete bytte sida och stred för Kongostaten. I september 1893 avrättades Ngongo efter en summarisk krigsrätt, anklagad för förräderi, en anklagelse som många av hans anhängare ansåg vara falsk. I juli 1895 reste sig tetelasoldaterna i garnisonen i Luluabourg (Kananga), dödade en av sina belgiska officerare och marscherade i väg; tetelasoldater från andra poster anslöt sig till dem under de följande åren, och i oktober 1896 fanns det omkring 3 000–4 000 av dem i Kasai, Lomami och Maniema. År 1897 reste sig omkring 1 300 tetela- och kususoldater i Francis Dhanis expedition till övre Nilen, som har beskrivits som den största koloniala styrka som dittills hade samlats i Afrika; i Kongostatens nordöstra del gjorde de uppror mot hård behandling och mot avrättningen av några av deras hövdingar, dödade omkring tio belgiska officerare och splittrade expeditionen, som skulle göra anspråk på Fashodaregionen före britterna och fransmännen. Dhanis ägnade 1897 och 1898 åt att bekämpa rebellbanden. Den 17 april 1900 reste sig också garnisonen i fortet Shinkakasa, som bevakade floden nedanför huvudstaden Boma, besköt ett fartyg som låg förtöjt i floden och hotade staden innan den betvingades. De sista banden, kring Kisalesjön i norra Katanga, besegrades 1901 enligt vissa framställningar och 1908 enligt andra. Efteråt blandade de koloniala myndigheterna folken i varje förband i Force Publique så att ingen grupp var i majoritet. Skribenter i Kongostaten och i Belgien kallade revolterna myterier; i dag räknas de till de viktigaste antikoloniala revolterna i Kongos historia.
