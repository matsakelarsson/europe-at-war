# Svenska översättningar av katalogtexten (våg 7); stegtexterna kommer senare.
Batken conflict: Batkenkonflikten
? An incursion by the Islamic Movement of Uzbekistan (IMU), an armed group seeking to overthrow Uzbekistan’s government, into the Batken region of southern Kyrgyzstan. In August 1999 several hundred IMU fighters, based in the mountains of Tajikistan since the end of the Tajik civil war, crossed into Kyrgyzstan, apparently aiming to reach Uzbekistan’s part of the Fergana Valley, and occupied villages in the mountains around Batken. They took hostages, among them a Kyrgyz general, Anarbek Shamkeev, and, on 22–23 August, four Japanese geologists and their interpreter. Kyrgyz troops, with Uzbek air strikes, some of which hit villages in Tajikistan, fought the militants through September; the IMU fighters withdrew to Tajikistan, and the Japanese hostages were freed on 25 October, reportedly after a ransom was paid. Between about 20 and 30 Kyrgyz soldiers were killed; claims of militant losses vary widely. The IMU made a larger incursion into Uzbekistan and Kyrgyzstan in 2000 before many of its fighters moved to Afghanistan.
: Ett intrång av Uzbekistans islamiska rörelse (IMU), en väpnad grupp som ville störta Uzbekistans regering, i Batkenregionen i södra Kirgizistan. I augusti 1999 gick flera hundra IMU-kämpar, som sedan slutet av det tadzjikiska inbördeskriget hade haft sin bas i bergen i Tadzjikistan, över gränsen till Kirgizistan, tydligen i syfte att nå den uzbekiska delen av Ferganadalen, och besatte byar i bergen kring Batken. De tog gisslan, bland dem en kirgizisk general, Anarbek Shamkeev, och den 22–23 augusti fyra japanska geologer och deras tolk. Kirgiziska trupper, understödda av uzbekiska flyganfall, av vilka en del träffade byar i Tadzjikistan, bekämpade militanterna under hela september; IMU-kämparna drog sig tillbaka till Tadzjikistan, och den japanska gisslan frigavs den 25 oktober, enligt uppgift sedan en lösensumma hade betalats. Mellan omkring 20 och 30 kirgiziska soldater dödades; uppgifterna om militanternas förluster varierar kraftigt. IMU gjorde ett större intrång i Uzbekistan och Kirgizistan 2000, innan många av dess kämpar flyttade till Afghanistan.
