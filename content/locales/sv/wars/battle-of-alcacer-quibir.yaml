Battle of Alcácer Quibir: Slaget vid Alcácer Quibir
The defeat of King Sebastian of Portugal in northern Morocco on 4 August 1578, also called the Battle of the Three Kings or of Wadi al-Makhazin. The young king had taken up the cause of the deposed Saadi sultan Abu Abdallah Mohammed II against his uncle Abd al-Malik, who had taken the throne with Ottoman help in 1576. Sebastian landed at Asilah with an army of perhaps 17,000–23,000 men, including German, Flemish, Spanish and Italian soldiers, and marched inland. Near Ksar el-Kebir it was surrounded by a much larger Moroccan army, strong in cavalry and firearms, and destroyed; thousands were killed and most of the rest captured. Sebastian and Mohammed II died in the battle, and Abd al-Malik died of illness during it. His brother Ahmad al-Mansur succeeded him and grew rich on the ransoms of Portuguese nobles. Sebastian was childless, and the succession crisis that followed brought Portugal under Philip II of Spain in 1580.: Kung Sebastian av Portugals nederlag i norra Marocko den 4 augusti 1578, även kallat slaget vid de tre kungarna eller slaget vid Wadi al-Makhazin. Den unge kungen hade tagit sig an den avsatte saadiske sultanen Abu Abdallah Muhammad II:s sak mot dennes farbror Abd al-Malik, som med osmansk hjälp hade tagit tronen 1576. Sebastian landsteg vid Asilah med en armé på kanske 17 000–23 000 man, däribland tyska, flamländska, spanska och italienska soldater, och marscherade inåt landet. Nära Ksar el-Kebir omringades armén av en mycket större marockansk armé, stark i kavalleri och eldvapen, och förintades; tusentals dödades och de flesta av de övriga tillfångatogs. Sebastian och Muhammad II stupade i slaget, och Abd al-Malik dog av sjukdom under det. Hans bror Ahmad al-Mansur efterträdde honom och blev rik på lösensummorna för portugisiska adelsmän. Sebastian var barnlös, och den tronföljdskris som följde förde Portugal under Filip II av Spanien 1580.
