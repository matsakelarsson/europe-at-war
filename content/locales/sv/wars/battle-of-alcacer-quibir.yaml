Many Portuguese refused to believe that Sebastian was dead, and several pretenders later claimed to be him. The hope of his return, Sebastianism, lived on in Portuguese popular culture for centuries.: Många portugiser vägrade tro att Sebastian var död, och flera tronpretendenter utgav sig senare för att vara han. Hoppet om hans återkomst, sebastianismen, levde vidare i portugisisk folkkultur i flera hundra år.
? "The defeat of King Sebastian of Portugal in northern Morocco on 4 August 1578, also called the Battle of the Three Kings or, in Morocco, of Wadi al-Makhazin. It grew out of a Saadian succession war: in 1576 Abd al-Malik, with troops from Ottoman Algiers, drove his nephew, the sultan Abu Abdallah Mohammed al-Mutawakkil, from Fez and Marrakesh, and al-Mutawakkil turned to Portugal. Sebastian, young, unmarried and set on a crusade, landed at Asilah with an army of perhaps 17,000–23,000 men, including German, Flemish, Castilian and Italian soldiers, and marched inland. Near Ksar el-Kebir it was surrounded by a much larger Moroccan army, strong in cavalry and firearms, and destroyed; thousands were killed and most of the rest captured. Sebastian and al-Mutawakkil died in the battle, and Abd al-Malik died of illness during it. His brother Ahmad al-Mansur succeeded him and grew rich on the ransoms of Portuguese nobles. Sebastian was childless, and the succession crisis that followed brought Portugal under Philip II of Spain in 1580."
: "Kung Sebastian av Portugals nederlag i norra Marocko den 4 augusti 1578, även kallat slaget vid de tre kungarna eller, i Marocko, slaget vid Wadi al-Makhazin. Det växte fram ur ett saadiskt tronföljdskrig: 1576 drev Abd al-Malik, med trupper från det osmanska Alger, sin brorson, sultanen Abu Abdallah Mohammed al-Mutawakkil, från Fès och Marrakech, och al-Mutawakkil vände sig till Portugal. Sebastian, ung, ogift och fast besluten att föra ett korståg, landsteg i Asilah med en armé på kanske 17 000–23 000 man, bland dem tyska, flamländska, kastilianska och italienska soldater, och marscherade inåt landet. Nära Ksar el-Kebir omringades den av en mycket större marockansk armé, stark i kavalleri och eldvapen, och förintades; tusentals dödades och de flesta av de övriga tillfångatogs. Sebastian och al-Mutawakkil dog i slaget, och Abd al-Malik dog av sjukdom under det. Hans bror Ahmad al-Mansur efterträdde honom och blev rik på lösensummorna för portugisiska adelsmän. Sebastian var barnlös, och den tronföljdskris som följde förde Portugal under Filip II av Spanien 1580."
