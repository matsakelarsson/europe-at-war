# Svenska översättningar av katalogtexten (våg 14); stegtexterna kommer senare.
Battle of Blair Mountain: Slaget vid Blair Mountain
? "The largest armed uprising in the United States since the Civil War, the climax of the West Virginia Mine Wars. Coal operators in Logan and Mingo counties in southern West Virginia kept out the United Mine Workers of America with mine guards, evictions and the Baldwin–Felts Detective Agency, and Logan County’s sheriff, Don Chafin, was paid by the operators to keep organisers out. After the Matewan shootout of May 1920 and martial law in Mingo County, Baldwin–Felts agents shot dead Sid Hatfield, Matewan’s police chief and a hero to the miners, on the courthouse steps at Welch on 1 August 1921. In late August some 10,000 armed miners (estimates run from about 7,000 to 20,000), white, Black and immigrant, many of them First World War veterans wearing red bandanas, gathered at Marmet near Charleston and set out to march through Logan County to Mingo, to free jailed strikers and unionise the southern coalfield. Union officials and Mother Jones tried to stop them. Chafin’s forces, some 3,000 deputies, mine guards, state police and volunteers (one account says more than 5,000), dug in with machine guns along the ridge of Spruce Fork and Blair Mountain, and private aircraft hired by the defenders dropped homemade bombs on the miners. Fighting along the ridge lasted from about 29 August to 2 September. President Warren G. Harding ordered the marchers to disperse and sent some 2,100–2,500 federal troops, with Army Air Service bombers for reconnaissance; when they arrived on 2–3 September, most miners laid down their arms rather than fight the army and went home. The dead were never counted: low estimates are about 20, while the highest give 50 to 100 miners and some 30 defenders. Afterwards 985 miners were indicted for murder, conspiracy and treason against West Virginia; the miners’ leader Bill Blizzard was acquitted of treason in 1922, but union membership in the state collapsed until the New Deal. Blair Mountain was listed on the National Register of Historic Places, and its preservation against surface mining remains contested."
: "Det största väpnade upproret i USA sedan inbördeskriget och kulmen på gruvkrigen i West Virginia. Gruvägarna i Logan County och Mingo County i södra West Virginia höll United Mine Workers of America borta med gruvvakter, vräkningar och detektivbyrån Baldwin–Felts, och Logan Countys sheriff, Don Chafin, betalades av gruvägarna för att hålla fackliga organisatörer borta. Efter skottlossningen i Matewan i maj 1920 och krigslagarna i Mingo County sköt agenter från Baldwin–Felts ihjäl Sid Hatfield, Matewans polischef och en hjälte för gruvarbetarna, på trappan till domstolsbyggnaden i Welch den 1 augusti 1921. I slutet av augusti samlades omkring 10 000 beväpnade gruvarbetare (uppskattningarna går från omkring 7 000 till 20 000), vita, svarta och invandrare, många av dem veteraner från första världskriget med röda halsdukar, i Marmet nära Charleston och gav sig av för att marschera genom Logan County till Mingo, befria fängslade strejkande och organisera de södra kolfälten fackligt. Fackliga funktionärer och Mother Jones försökte stoppa dem. Chafins styrkor, omkring 3 000 sheriffsbiträden, gruvvakter, delstatspoliser och frivilliga (enligt en uppgift mer än 5 000), grävde ned sig med kulsprutor längs åsen vid Spruce Fork och Blair Mountain, och privata flygplan som hyrts av försvararna fällde hemmagjorda bomber över gruvarbetarna. Striderna längs åsen pågick från omkring den 29 augusti till den 2 september. President Warren G. Harding beordrade marschdeltagarna att skingras och sände omkring 2 100–2 500 federala soldater, med bombplan från Army Air Service för spaning; när de anlände den 2–3 september lade de flesta gruvarbetare ned vapnen hellre än att strida mot armén och gick hem. De döda räknades aldrig: låga uppskattningar ligger kring 20, medan de högsta anger 50 till 100 gruvarbetare och omkring 30 försvarare. Efteråt åtalades 985 gruvarbetare för mord, sammansvärjning och förräderi mot West Virginia; gruvarbetarledaren Bill Blizzard frikändes från anklagelsen om förräderi 1922, men fackföreningens medlemsantal i delstaten rasade och återhämtade sig först under New Deal. Blair Mountain har förts upp i National Register of Historic Places, och dess bevarande mot dagbrytning är fortfarande omstritt."
