Battle of Breadfield: Slaget på Brödfältet
The defeat of a large Ottoman raiding army in Transylvania by the forces of King Matthias Corvinus. In October 1479 Ottoman akıncı raiders and other troops under Ali Koca Bey, with Wallachian infantry of Basarab the Younger, crossed into southern Transylvania, plundering villages and taking captives. On 13 October the voivode of Transylvania, Stephen Báthory, attacked their camp on the Breadfield (Kenyérmező) near Alkenyér (Șibot) on the Mureș. The Ottomans had the upper hand, and Báthory was nearly captured, until Pál Kinizsi, count of Temes, charged with the heavy cavalry and Serbian horsemen and broke first their left and then their centre. Hungarian, Székely, Saxon, Serbian and Romanian soldiers fought on the Christian side, and losses were heavy on both sides. The victory kept large Ottoman raids out of Transylvania and southern Hungary for years.: Kung Mattias Corvinus styrkors seger över en stor osmansk plundringsarmé i Transsylvanien. I oktober 1479 gick osmanska akıncı-ryttare och andra trupper under Ali Koca bej, tillsammans med valakiskt fotfolk under Basarab den yngre, in i södra Transsylvanien, där de plundrade byar och tog fångar. Den 13 oktober anföll Transsylvaniens vojvod, Stefan Báthory, deras läger på Brödfältet (Kenyérmező) nära Alkenyér (Șibot) vid Mureș. Osmanerna hade övertaget, och Báthory var nära att tillfångatas, tills Pál Kinizsi, greve av Temes, anföll med det tunga kavalleriet och serbiska ryttare och bröt först deras vänstra flank och sedan deras center. Ungerska, sekleriska, sachsiska, serbiska och rumänska soldater stred på den kristna sidan, och förlusterna var stora på båda sidor. Segern höll stora osmanska räder borta från Transsylvanien och södra Ungern i flera år.
