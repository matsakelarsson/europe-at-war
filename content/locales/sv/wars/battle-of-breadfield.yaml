Numbers are uncertain. The Ottoman force was probably a large raiding army rather than a full field army; estimates range from under 20,000 to 60,000 or more, against some 12,000–15,000 Christians.: Styrkorna är osäkra. Den osmanska styrkan var troligen en stor plundringsarmé snarare än en fullständig fältarmé; uppskattningarna varierar från under 20 000 till 60 000 man eller fler, mot omkring 12 000–15 000 kristna.
