Battle of Brunanburh: Slaget vid Brunanburh
A battle in 937 in which King Æthelstan of England and his brother Edmund defeated an alliance of Olaf Guthfrithson, king of Dublin, Constantine II of Alba and Owain of Strathclyde, who had joined forces to break Æthelstan’s overlordship of Britain after his invasion of Scotland in 934. A poem in the Anglo-Saxon Chronicle celebrates the slaughter, telling of five young kings and seven of Olaf’s earls killed, as well as Constantine’s son. Olaf fled back to Dublin and Constantine to Scotland, and the victory secured the unity of the English kingdom, although Olaf took York after Æthelstan’s death in 939.: Ett slag 937 där kung Æthelstan av England och hans bror Edmund besegrade en allians av Olaf Guthfrithsson, kung av Dublin, Konstantin II av Alba och Owain av Strathclyde, som gått samman för att bryta Æthelstans överhöghet över Britannien efter hans invasion av Skottland 934. En dikt i Anglosaxiska krönikan hyllar blodbadet och berättar om fem unga kungar och sju av Olafs jarlar som stupade, liksom Konstantins son. Olaf flydde tillbaka till Dublin och Konstantin till Skottland, och segern tryggade det engelska rikets enhet, även om Olaf intog York efter Æthelstans död 939.
