The site of Brunanburh is unknown and has been argued over for centuries; Bromborough on the Wirral is the identification most widely accepted today, but many other places in northern England and southern Scotland have been proposed.: Var Brunanburh låg är okänt och har diskuterats i århundraden; Bromborough på halvön Wirral är den identifiering som är mest allmänt accepterad i dag, men många andra platser i norra England och södra Skottland har föreslagits.
