Battle of Bubat: Slaget vid Bubat
? The killing of the king of Sunda and his party at Bubat, a field on the north side of Trowulan, the capital of Majapahit, in 1357. King Hayam Wuruk of Majapahit had asked for the hand of Dyah Pitaloka (Citra Rashmi), daughter of King Linggabuana of Sunda, the kingdom of western Java. The king sailed to Java with his family, nobles and guards, went up the Brantas river and camped at Bubat to await the wedding. There Majapahit’s chief minister, Gajah Mada, demanded that the princess be handed over not as a queen but as a token of Sunda’s submission. The Sundanese refused, and Majapahit troops surrounded the camp. In the fight that followed the king and almost all his party, said to number fewer than a hundred against several thousand, were killed; according to tradition the princess and the other Sundanese women took their own lives. Hayam Wuruk married his cousin instead, and Gajah Mada is said to have lost the king’s favour. Sunda seems to have acknowledged Majapahit’s overlordship for a time and then regained its independence; Linggabuana’s young son Niskala Wastu Kancana, who had stayed at Kawali, cut off relations with Majapahit. The Sundanese remember Linggabuana as Prabu Wangi, and the story is still told in wayang, drama and novels; in 2018 the governors of East Java, West Java and Yogyakarta renamed streets in Surabaya, Bandung and Yogyakarta to mark a reconciliation.
: Dödandet av kungen av Sunda och hans följe vid Bubat, ett fält på norra sidan av Trowulan, Majapahits huvudstad, 1357. Kung Hayam Wuruk av Majapahit hade friat till Dyah Pitaloka (Citra Rashmi), dotter till kung Linggabuana av Sunda, kungariket på västra Java. Kungen seglade till Java med sin familj, sina stormän och livvakter, for uppför floden Brantas och slog läger vid Bubat i väntan på bröllopet. Där krävde Majapahits förste minister, Gajah Mada, att prinsessan skulle överlämnas inte som drottning utan som ett tecken på Sundas underkastelse. Sundaneserna vägrade, och Majapahits trupper omringade lägret. I striden som följde dödades kungen och nästan hela hans följe, som sägs ha varit färre än hundra mot flera tusen; enligt traditionen tog prinsessan och de andra sundanesiska kvinnorna sina egna liv. Hayam Wuruk gifte sig i stället med sin kusin, och Gajah Mada sägs ha förlorat kungens gunst. Sunda tycks under en tid ha erkänt Majapahits överhöghet och sedan återvunnit sin självständighet; Linggabuanas unge son Niskala Wastu Kancana, som hade stannat i Kawali, bröt förbindelserna med Majapahit. Sundaneserna minns Linggabuana som Prabu Wangi, och berättelsen förs fortfarande vidare i wayang, teater och romaner; 2018 döpte guvernörerna i Östra Java, Västra Java och Yogyakarta om gator i Surabaya, Bandung och Yogyakarta för att markera en försoning.
