# Svenska översättningar av katalogtexten (våg 9); stegtexterna kommer senare.
Battle of Chamdo: Slaget vid Chamdo
? The People’s Liberation Army’s campaign of October 1950 against the Tibetan army at Chamdo, in eastern Tibet, and the incorporation of Tibet into the People’s Republic of China that followed. After failed talks, between 20,000 and 30,000 PLA troops of the 18th Army and a cavalry force from Qinghai crossed the upper Yangtze (Drichu) on 6–7 October 1950 and in less than two weeks surrounded the Tibetan army in Kham; its commander, the governor Ngabo Ngawang Jigme, surrendered with about 2,700 men after Chamdo fell on 19 October. The PLA halted there and offered talks. Tibet’s appeal to the United Nations was shelved, and on 23 May 1951 a Tibetan delegation led by Ngabo signed the Seventeen Point Agreement in Beijing, accepting that Tibet was part of China while keeping the Dalai Lama’s government in place. The Dalai Lama accepted it in October 1951, and the PLA entered Lhasa. The People’s Republic calls these events the “peaceful liberation of Tibet”; the Tibetan government in exile calls them an invasion and the start of an occupation.
: Folkets befrielsearmés fälttåg i oktober 1950 mot den tibetanska armén vid Chamdo i östra Tibet, och det införlivande av Tibet i Folkrepubliken Kina som följde. Efter misslyckade förhandlingar gick mellan 20 000 och 30 000 soldater ur Folkets befrielsearmés 18:e armé och en kavalleristyrka från Qinghai över övre Yangtze (Drichu) den 6–7 oktober 1950 och omringade på mindre än två veckor den tibetanska armén i Kham; dess befälhavare, guvernören Ngabo Ngawang Jigme, kapitulerade med omkring 2 700 man sedan Chamdo hade fallit den 19 oktober. Folkets befrielsearmé stannade där och erbjöd förhandlingar. Tibets vädjan till Förenta nationerna lades på is, och den 23 maj 1951 undertecknade en tibetansk delegation ledd av Ngabo Sjuttonpunktsavtalet i Peking, där man godtog att Tibet var en del av Kina samtidigt som Dalai lamas regering fick sitta kvar. Dalai lama godtog avtalet i oktober 1951, och Folkets befrielsearmé tågade in i Lhasa. Folkrepubliken kallar dessa händelser ”Tibets fredliga befrielse”; den tibetanska exilregeringen kallar dem en invasion och början på en ockupation.
