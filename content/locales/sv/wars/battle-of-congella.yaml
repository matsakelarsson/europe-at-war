# Svenska översättningar av katalogtexten (våg 13); stegtexterna kommer senare.
Battle of Congella and the British annexation of Natal: Slaget vid Congella och den brittiska annekteringen av Natal
? The clash at Port Natal (Durban) that ended the Voortrekker Republic of Natalia. Britain had never accepted the republic the trekkers founded south of the Tugela after their war with Dingane, and a Boer raid on the Bhaca of Ncaphayi in December 1840, which alarmed the Cape government about the frontier, decided it to act. On 4 May 1842 Captain Thomas Charlton Smith arrived at Port Natal with a small force of the 27th (Inniskilling) Regiment and camped there. On the night of 23–24 May he marched out to attack the Boer camp at Congella, on the shore of the bay, and was beaten back by Andries Pretorius’s men with the loss of 16 to 19 killed and two guns. The Boers took the harbour and besieged the British camp. The trader Dick King slipped out with his young servant Ndongeni, who turned back part of the way, and rode some 960 km to Grahamstown in about ten days to call for help; on 26 June 1842 the schooner Conch and the frigate Southampton landed troops under Lieutenant-Colonel Abraham Cloete, who relieved the camp. The Natalia Volksraad submitted in July 1842. Britain proclaimed Natal a British colony on 12 May 1843, and on 8 August 1843 the Volksraad in Pietermaritzburg accepted the terms, with the Drakensberg as Natal’s border; Natal was joined to the Cape in 1844 and became a separate colony in 1856. Most trekker families left over the mountains for the highveld, to the lands that became the Orange Free State and the South African Republic.
: Sammandrabbningen vid Port Natal (Durban) som gjorde slut på voortrekkerrepubliken Natalia. Storbritannien hade aldrig erkänt den republik som voortrekkerna grundat söder om Tugela efter sitt krig mot Dingane, och en boerräd mot Ncaphayis bhaca i december 1840, som gjorde Kapregeringen orolig för gränsen, fick Storbritannien att ingripa. Den 4 maj 1842 anlände kapten Thomas Charlton Smith till Port Natal med en liten styrka ur 27:e (Inniskilling) regementet och slog läger där. Natten mellan den 23 och 24 maj marscherade han ut för att anfalla boerlägret vid Congella, vid buktens strand, och slogs tillbaka av Andries Pretorius män med en förlust av 16 till 19 döda och två kanoner. Boerna tog hamnen och belägrade det brittiska lägret. Handelsmannen Dick King tog sig ut tillsammans med sin unge tjänare Ndongeni, som vände tillbaka en bit på vägen, och red omkring 960 km till Grahamstown på ungefär tio dagar för att kalla på hjälp; den 26 juni 1842 landsatte skonaren Conch och fregatten Southampton trupper under överstelöjtnant Abraham Cloete, som undsatte lägret. Natalias Volksraad underkastade sig i juli 1842. Storbritannien proklamerade Natal som brittisk koloni den 12 maj 1843, och den 8 augusti 1843 godtog Volksraad i Pietermaritzburg villkoren, med Drakensberg som Natals gräns; Natal förenades med Kapkolonin 1844 och blev en egen koloni 1856. De flesta voortrekkerfamiljerna drog över bergen till Highveld, till de områden som blev Oranjefristaten och Sydafrikanska republiken.
