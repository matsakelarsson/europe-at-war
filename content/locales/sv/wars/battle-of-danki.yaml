# Svenska översättningar av katalogtexten (våg 13); stegtexterna kommer senare.
Battle of Danki and the breakup of the Jolof Empire: Slaget vid Danki och Jolofrikets sönderfall
? The war in which Cayor, on the coast of today’s Senegal, threw off the overlordship of the Jolof Empire, which had united the Wolof and Serer kingdoms between the Senegal and the Gambia since the fourteenth century. Jolof had already lost Futa Toro to Koli Tenguella early in the sixteenth century, and the coastal vassals, enriched by the Portuguese trade, had grown stronger than their overlord. When the lamane of Cayor, Dece Fu Njogu Fall, stopped sending tribute, his son Amari Ngoone Sobel Fall, with help from his uncle the teigne of Baol, led an army to the buurba Leele Fuli Fak, lured the Jolof army into an ambush at Lake Danki and killed him. Dece Fu was acclaimed damel, but died during the celebrations, and Amari Ngoone, damel from 1549 to 1593, also became teigne of Baol, the first ruler of both kingdoms, and beat off several Jolof attempts at reconquest. Waalo and Baol left the empire, Sine and Saloum had gone their own way before, and Jolof became an inland kingdom whose buurba kept only prestige. Cayor’s chronicles date Danki to 1549; Britannica dates Cayor’s independence to 1556.
: Det krig i vilket Cayor, vid kusten i dagens Senegal, skakade av sig överhögheten från Jolofriket, som sedan 1300-talet hade förenat wolof- och sererrikena mellan floderna Senegal och Gambia. Jolof hade redan i början av 1500-talet förlorat Futa Toro till Koli Tenguella, och vasallerna vid kusten, berikade av handeln med portugiserna, hade blivit starkare än sin överherre. När Cayors lamane, Dece Fu Njogu Fall, slutade sända tribut ledde hans son Amari Ngoone Sobel Fall, med hjälp av sin onkel, teigne av Baol, en armé mot buurba Leele Fuli Fak, lockade jolofarmén i ett bakhåll vid Dankisjön och dödade honom. Dece Fu hyllades som damel men dog under festligheterna, och Amari Ngoone, damel från 1549 till 1593, blev också teigne av Baol, den förste som härskade över båda rikena, och slog tillbaka flera försök från Jolof att återerövra landet. Waalo och Baol lämnade riket, Sine och Saloum hade redan tidigare gått sin egen väg, och Jolof blev ett inlandsrike vars buurba bara behöll sin prestige. Cayors krönikor daterar Danki till 1549; Britannica daterar Cayors självständighet till 1556.
