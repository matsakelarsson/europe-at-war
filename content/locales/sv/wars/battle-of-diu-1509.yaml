Battle of Diu (1509): Slaget vid Diu (1509)
The naval war of 1508–1509 in which Portugal destroyed the fleet that the Mamluk sultan of Egypt, Qansuh al-Ghawri, had sent to India to break the Portuguese hold on the spice trade. Joined at Diu by the ships of Malik Ayaz, governor for the sultan of Gujarat, and supported by Calicut, the Mamluk fleet under Amir Husain al-Kurdi trapped a Portuguese squadron at Chaul in March 1508 and killed its commander Lourenço de Almeida, son of the viceroy. On 3 February 1509 the viceroy Francisco de Almeida took his revenge off Diu, where his carracks’ guns and boarding parties destroyed the Mamluk ships. The victory gave Portugal the mastery of the Arabian Sea for decades.: Sjökriget 1508–1509 där Portugal förintade den flotta som mamluksultanen av Egypten, Qansuh al-Ghawri, hade sänt till Indien för att bryta portugisernas grepp om kryddhandeln. Förstärkt vid Diu av fartygen under Malik Ayaz, guvernör i sultanen av Gujarats tjänst, och med stöd av Calicut stängde mamlukflottan under Amir Husain al-Kurdi in en portugisisk eskader vid Chaul i mars 1508 och dödade dess befälhavare Lourenço de Almeida, vicekungens son. Den 3 februari 1509 tog vicekungen Francisco de Almeida sin hämnd utanför Diu, där hans karackers kanoner och äntringsstyrkor förintade mamlukernas fartyg. Segern gav Portugal herraväldet över Arabiska havet i årtionden.
