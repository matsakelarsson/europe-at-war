Battle of Djerba: Slaget vid Djerba
? A Spanish-led expedition to retake Tripoli, which the corsair Turgut Reis (Dragut) had taken from the Knights of Malta in 1551, that ended in one of the worst Christian defeats at sea of the century. Philip II’s allies, Genoa, the papacy, Naples, Sicily, Florence and the Knights, assembled perhaps 50–60 galleys and many smaller ships under the young Giovanni Andrea Doria and the Duke of Medinaceli, viceroy of Sicily. Delayed by weather and disease, they gave up on Tripoli and in March occupied the island of Djerba, where they built a fort. In May an Ottoman fleet of about 86 galleys and galliots under Piyale Pasha arrived unexpectedly fast and caught the allied ships as they tried to leave, taking or sinking some 27 galleys and many other vessels. The fort, held by Álvaro de Sande with several thousand soldiers and civilians, held out until the Ottomans cut off its water in July; after a last sortie at the end of the month it fell, and thousands were killed or carried off as slaves. A tower of the defenders’ skulls stood on the island until the 19th century. The defeat crippled the Spanish galley fleet for several years.
: En spanskledd expedition för att återta Tripoli, som korsaren Turgut Reis (Dragut) hade tagit från malteserriddarna 1551, och som slutade i ett av århundradets värsta kristna nederlag till sjöss. Filip II:s allierade – Genua, påvedömet, Neapel, Sicilien, Florens och riddarna – samlade kanske 50–60 galärer och många mindre fartyg under den unge Giovanni Andrea Doria och hertigen av Medinaceli, vicekung på Sicilien. Försenade av väder och sjukdomar gav de upp Tripoli och besatte i mars ön Djerba, där de byggde ett fort. I maj anlände en osmansk flotta på omkring 86 galärer och galioter under Piyale pasha oväntat snabbt och överraskade de allierade fartygen när de försökte lämna ön; omkring 27 galärer och många andra fartyg kapades eller sänktes. Fortet, som hölls av Álvaro de Sande med flera tusen soldater och civila, höll ut tills osmanerna skar av dess vattentillförsel i juli; efter ett sista utfall i slutet av månaden föll det, och tusentals dödades eller fördes bort som slavar. Ett torn av försvararnas skallar stod kvar på ön till 1800-talet. Nederlaget lamslog den spanska galärflottan i flera år.
