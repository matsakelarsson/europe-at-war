# Svenska översättningar av katalogtexten (våg 9); stegtexterna kommer senare.
Battle of Guningtou: Slaget vid Guningtou
? A failed amphibious attack by the People’s Liberation Army on Kinmen (Quemoy), the island off Xiamen held by the Republic of China, in the last months of the Chinese Civil War. After taking Xiamen on 17 October 1949, Ye Fei’s 10th Corps sent the first echelon of its 28th Army, over 9,000 men in about 200 fishing boats and junks, across the strait on the night of 24–25 October. They landed along some 10 km of the north-west coast between Longkou and Guningtou, but the boats were stranded by the falling tide and set on fire, and no second wave could follow. The defenders, more than 40,000 men of Li Liangrong’s 22nd Army and of Hu Lien’s 12th Corps, which had just arrived, counter-attacked with M5A1 light tanks, aircraft and naval guns, and by 27 October the landing force had been destroyed. By ROC figures the PLA lost 3,873 killed and 5,175 to 7,364 captured, the higher count including boatmen and porters, while the defenders lost 1,267 killed and 1,982 wounded. It was one of the PLA’s few defeats in the last stage of the civil war; Kinmen stayed in ROC hands, plans to invade Taiwan were set back, and the island became the front line of the Taiwan Strait crises of 1954 and 1958.
: Ett misslyckat amfibieanfall från Folkets befrielsearmé mot Kinmen (Quemoy), ön utanför Xiamen som hölls av Republiken Kina, under det kinesiska inbördeskrigets sista månader. Sedan Ye Feis 10:e kår hade intagit Xiamen den 17 oktober 1949 sände den första echelongen ur sin 28:e armé, över 9 000 man i omkring 200 fiskebåtar och djonker, över sundet natten mellan den 24 och 25 oktober. De landsteg längs omkring 10 km av nordvästkusten mellan Longkou och Guningtou, men båtarna strandade när tidvattnet föll och sattes i brand, och ingen andra våg kunde följa efter. Försvararna, mer än 40 000 man ur Li Liangrongs 22:a armé och ur Hu Liens 12:e kår, som just hade anlänt, gick till motanfall med lätta stridsvagnar av typen M5A1, flygplan och fartygsartilleri, och den 27 oktober hade landstigningsstyrkan förintats. Enligt Republiken Kinas siffror förlorade Folkets befrielsearmé 3 873 dödade och 5 175 till 7 364 tillfångatagna, där den högre siffran inbegriper båtfolk och bärare, medan försvararna förlorade 1 267 dödade och 1 982 sårade. Det var ett av Folkets befrielsearmés få nederlag i inbördeskrigets slutskede; Kinmen förblev i Republiken Kinas händer, planerna på att invadera Taiwan försenades, och ön blev frontlinjen i Taiwansundskriserna 1954 och 1958.
