# Svenska översättningar av katalogtexten (våg 7); stegtexterna kommer senare.
Battle of Herat (1270): Slaget vid Herat (1270)
A war between two Mongol khanates over Khorasan. Baraq, khan of the Chagatai ulus in Central Asia, had been forced by his rival Kaidu to share the revenues of Transoxiana, and in 1270, with Kaidu’s encouragement, he invaded the Ilkhanate’s eastern province instead. He beat Abaqa’s brother Tübshin near Herat and at Maruchaq, sacked Nishapur and made the Kartid ruler of Herat, Shams al-Din, pay tribute, but the princes Kaidu had sent with him soon deserted. The Ilkhan Abaqa marched east from Azerbaijan in late April, keeping his presence secret, and on 22 July 1270 met Baraq on the plain near Herat. After a hard fight in which Baraq’s men broke the Ilkhanid left wing, Abaqa’s counter-attacks won the day; Baraq was thrown from his horse and fled to Bukhara. His army broke up, Kaidu took over the Chagatai lands, and Baraq died in 1271. Abaqa’s troops raided across the Oxus and burned Bukhara in 1273, but the river remained the frontier between the Ilkhanate and the Chagatai lands.: Ett krig mellan två mongoliska khanat om Khorasan. Baraq, khan över Tjagatais ulus i Centralasien, hade av sin rival Kaidu tvingats dela intäkterna från Transoxanien, och 1270 föll han med Kaidus uppmuntran i stället in i Ilkhanatets östra provins. Han slog Abaqas bror Tübshin nära Herat och vid Maruchaq, plundrade Nishapur och tvingade kartidernas härskare i Herat, Shams al-Din, att betala tribut, men de prinsar som Kaidu hade sänt med honom deserterade snart. Ilkhanen Abaqa tågade österut från Azerbajdzjan i slutet av april och höll sin närvaro hemlig, och den 22 juli 1270 mötte han Baraq på slätten nära Herat. Efter en hård strid, där Baraqs män slog den ilkhanidiska vänsterflygeln på flykten, avgjorde Abaqas motanfall slaget; Baraq kastades av hästen och flydde till Buchara. Hans armé föll sönder, Kaidu tog över de tjagataiska länderna, och Baraq dog 1271. Abaqas trupper gjorde räder över Oxus och brände Buchara 1273, men floden förblev gräns mellan Ilkhanatet och de tjagataiska länderna.
