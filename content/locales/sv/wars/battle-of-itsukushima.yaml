# Svenska översättningar av katalogtexten (våg 10); stegtexterna kommer senare.
Battle of Itsukushima: Slaget vid Itsukushima
? The surprise attack on the shrine island of Itsukushima (Miyajima) in which Mōri Motonari destroyed the army of Sue Harukata and made the Mōri the leading power of western Japan. In 1551 Sue Harukata, chief retainer of the Ōuchi, rose against his lord Ōuchi Yoshitaka, who took his own life at the temple of Tainei-ji, and ruled the Ōuchi lands from Yamaguchi through a puppet lord, Ōuchi Yoshinaga. Motonari, a lord of Aki who had served the Ōuchi, broke with Sue in 1554 and beat a Sue army at Oshikibata. He then built a small fort, Miyao, on Itsukushima, across the strait from the mainland, as bait. Sue landed on the island with an army put at 20,000 or more and laid siege to the fort. On the night before the battle Motonari, with 4,000 men or perhaps a few thousand more and the help of the Murakami sea lords of the Inland Sea, crossed to the island in a storm and landed behind Sue’s camp at the Tō-no-oka hill, while his son Kobayakawa Takakage brought ships round to attack from the sea. At dawn on 16 October 1555 (the 1st day of the tenth month) they fell on the Sue army from both sides. Sue’s men broke; many drowned trying to reach the mainland, and some 4,700 were killed. Sue escaped from the fort but found no boat and took his own life. Motonari had the bodies taken to the mainland and the island cleansed, since death polluted the sacred ground. In 1557 his advance into Suō and Nagato drove Ōuchi Yoshinaga to take his own life, ending the Ōuchi, and the Mōri went on to rule most of western Honshu.
: Överraskningsanfallet mot helgedomsön Itsukushima (Miyajima), där Mōri Motonari förintade Sue Harukatas armé och gjorde Mōriklanen till den ledande makten i västra Japan. År 1551 reste sig Sue Harukata, Ōuchiklanens främste vasall, mot sin herre Ōuchi Yoshitaka, som tog sitt liv i templet Tainei-ji, och styrde Ōuchiklanens länder från Yamaguchi genom en marionettherre, Ōuchi Yoshinaga. Motonari, en herre i Aki som hade tjänat Ōuchiklanen, bröt med Sue 1554 och slog en av Sues arméer vid Oshikibata. Därefter byggde han som lockbete en liten borg, Miyao, på Itsukushima, på andra sidan sundet från fastlandet. Sue landsteg på ön med en armé som uppskattas till 20 000 man eller fler och belägrade borgen. Natten före slaget tog sig Motonari, med 4 000 man eller kanske några tusen till och med hjälp av Murakamiklanens sjöherrar i Japanska innanhavet, över till ön i en storm och landsteg bakom Sues läger vid kullen Tō-no-oka, medan hans son Kobayakawa Takakage förde runt fartyg för att anfalla från sjön. I gryningen den 16 oktober 1555 (den 1:a dagen i tionde månaden) föll de över Sues armé från båda håll. Sues män bröt samman; många drunknade när de försökte ta sig till fastlandet, och omkring 4 700 dödades. Sue flydde från borgen men fann ingen båt och tog sitt liv. Motonari lät föra kropparna till fastlandet och rena ön, eftersom döden orenade den heliga marken. År 1557 drev hans framryckning in i Suō och Nagato Ōuchi Yoshinaga till att ta sitt liv, vilket gjorde slut på Ōuchiklanen, och Mōriklanen kom att styra större delen av västra Honshu.
