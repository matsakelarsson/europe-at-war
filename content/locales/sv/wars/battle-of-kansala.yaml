# Svenska översättningar av katalogtexten (våg 13); stegtexterna kommer senare.
Battle of Kansala: Slaget vid Kansala
? The siege and destruction of Kansala, the capital of Kaabu, by the army of the Imamate of Futa Jallon and the Fula of Kaabu who had risen under Alfa Molo, remembered by the Mandinka as Turban Keloo, the war of annihilation. Kaabu, a federation of Mandinka kingdoms that had begun as a western province of the Mali Empire, had ruled the lands between the Gambia river and the Geba for three centuries and grown rich on the slave trade. In the 19th century it was weakened by the end of that trade, by the jihad of Futa Jallon to the south, and by the revolt of the Fula herders who lived among its Mandinka nobility, the Nyancho. In 1867, by the usual dating, Futa Jallon’s army and Alfa Molo’s Fula besieged Kansala; after an assault that lasted, by tradition, eleven days, Mansaba Janke Waali Sanneh opened the gates and had his sons fire the town’s powder stores, killing the defenders and many of the attackers. Kaabu ceased to exist as a power, Futa Jallon carried off thousands of captives, and Alfa Molo founded the kingdom of Fuladu in its eastern lands. The battle is told mainly by griots, and some historians think tradition has enlarged or merged it with earlier fighting.
: Belägringen och förstörelsen av Kansala, Kaabus huvudstad, genom armén från imamatet Futa Jallon och de fula i Kaabu som hade rest sig under Alfa Molo, av mandinka ihågkommen som Turban Keloo, utplåningskriget. Kaabu, en federation av mandinkariken som hade börjat som en västlig provins i Maliriket, hade i tre århundraden härskat över landet mellan Gambiafloden och Geba och blivit rikt på slavhandeln. Under 1800-talet försvagades det av slutet på denna handel, av Futa Jallons jihad i söder och av revolten bland de fulaherdar som levde bland dess mandinkaadel, nyancho. År 1867, enligt den vanliga dateringen, belägrade Futa Jallons armé och Alfa Molos fula Kansala; efter ett anfall som enligt traditionen varade i elva dagar öppnade mansaba Janke Waali Sanneh portarna och lät sina söner antända stadens krutförråd, vilket dödade försvararna och många av angriparna. Kaabu upphörde att existera som makt, Futa Jallon förde bort tusentals fångar, och Alfa Molo grundade kungariket Fuladu i dess östra delar. Slaget är främst känt genom grioternas berättelser, och vissa historiker tror att traditionen har förstorat det eller smält samman det med tidigare strider.
