# Svenska översättningar av katalogtexten (våg 8); stegtexterna kommer senare.
Battle of Kharda: Slaget vid Kharda
? The last campaign in which all the Maratha chiefs fought together under the Peshwa’s government at Pune (Poona). The Nizam of Hyderabad, Nizam Ali Khan, owed the Marathas arrears of chauth (a share of revenue) and refused to pay, and his minister Azim-ul-Umara insulted the Peshwa’s envoys. Under the direction of Nana Phadnavis, the armies of the Peshwa, Daulat Rao Scindia, Tukoji Holkar and Raghuji Bhonsle of Nagpur, led in the field by Parashuram Bhau Patwardhan, met the Nizam’s army near Kharda, south-east of Ahmednagar, on 11 March 1795. After a short fight, in which a Scindia counter-attack drove back the French-trained infantry of Michel Raymond, the Nizam took refuge in the small fort of Kharda, where the Marathas cut off his supplies. After some three weeks of hunger and thirst he came to terms. He ceded lands including the fortress of Daulatabad, promised a large indemnity and surrendered Azim-ul-Umara, who was held at Pune. The British, although the Nizam’s allies, did not intervene, and he responded by enlarging Raymond’s French-officered corps. Most of what he lost was returned in 1796, when Nana Phadnavis needed his support in the succession crisis that followed the death of the young Peshwa Sawai Madhavrao in October 1795.
: Det sista fälttåg där alla marathahövdingar stred tillsammans under peshwans regering i Pune (Poona). Nizamen av Hyderabad, Nizam Ali Khan, var skyldig maratherna obetald chauth (en andel av skatteintäkterna) och vägrade betala, och hans minister Azim-ul-Umara förolämpade peshwans sändebud. Under ledning av Nana Phadnavis mötte arméerna under peshwan, Daulat Rao Scindia, Tukoji Holkar och Raghuji Bhonsle av Nagpur – i fält anförda av Parashuram Bhau Patwardhan – nizamens armé nära Kharda, sydost om Ahmednagar, den 11 mars 1795. Efter en kort strid, där ett motanfall av Scindia drev tillbaka Michel Raymonds franskutbildade infanteri, tog nizamen sin tillflykt till det lilla fortet Kharda, där maratherna skar av hans tillförsel. Efter omkring tre veckor av hunger och törst dagtingade han. Han avträdde landområden, bland dem fästningen Daulatabad, utlovade ett stort skadestånd och utlämnade Azim-ul-Umara, som hölls fången i Pune. Britterna ingrep inte, fastän de var nizamens allierade, och han svarade med att utöka Raymonds kår med franska officerare. Det mesta av det han förlorat återlämnades 1796, när Nana Phadnavis behövde hans stöd i den tronföljdskris som följde efter den unge peshwan Sawai Madhavraos död i oktober 1795.
