# Svenska översättningar av katalogtexten (våg 12); stegtexterna kommer senare.
Battle of Kirina: Slaget vid Kirina
The war in which Sunjata (Sundiata) Keita and a coalition of Mande chiefdoms overthrew Sumaoro (Sumanguru) Kante, king of Sosso, in about 1235, the founding event of the Mali Empire. Sumaoro had made the Mande chiefdoms of the upper Niger his tributaries. According to the epic of Sunjata, the young prince, who had grown up in exile in Mema, was called home by the Mande chiefs, gathered allies at Sibi and, after two indecisive battles, defeated Sumaoro at Kirina, near the Niger south-west of today’s Bamako. Sumaoro fled north into the hills of Koulikoro and disappeared, and the Sosso capital was razed. The battle is known almost entirely from oral tradition, which mixes history with sorcery and spirit powers; the only early written source, Ibn Khaldun, says just that Mari Jata (Sunjata) overcame the Susu and took their kingdom.: Det krig där Sunjata (Sundiata) Keita och en koalition av mandehövdingadömen omkring 1235 störtade Sumaoro (Sumanguru) Kante, kung av Sosso, den händelse som grundade Maliriket. Sumaoro hade gjort mandehövdingadömena vid övre Niger skattskyldiga till sig. Enligt Sunjataeposet kallades den unge prinsen, som hade vuxit upp i landsflykt i Mema, hem av mandehövdingarna, samlade bundsförvanter vid Sibi och besegrade efter två oavgjorda slag Sumaoro vid Kirina, nära Niger sydväst om dagens Bamako. Sumaoro flydde norrut upp i bergen vid Koulikoro och försvann, och Sossos huvudstad jämnades med marken. Slaget är känt nästan uteslutande genom muntlig tradition, som blandar historia med trolldom och andemakter; den enda tidiga skriftliga källan, Ibn Khaldun, säger bara att Mari Jata (Sunjata) besegrade susufolket och tog deras rike.
