Second Battle of Kosovo: Andra slaget på Kosovo polje
A three-day battle on the Field of Blackbirds in Kosovo, where Sultan Murad II defeated a Hungarian-led army under the regent John Hunyadi on the same ground as the battle of 1389. Seeking revenge for Varna, Hunyadi crossed the Danube in September 1448 with Hungarians, Wallachians and German and Bohemian mercenaries, hoping to join Skanderbeg’s Albanians, who were held up on the way; the Serbian despot Đurađ Branković, bound by his truce with the Ottomans, refused to join. Fighting from a wagon fort from 17 October, Hunyadi’s army was worn down by the larger Ottoman army, in which the young Mehmed fought his first battle; on the third day the Wallachians went over to the sultan, by some accounts, and the rest of the army was destroyed. Hunyadi escaped but was held prisoner by Branković until he paid a ransom. It was the last great Hungarian offensive into the Balkans for decades.: Ett tre dagar långt slag på Trastfältet i Kosovo, där sultan Murad II besegrade en ungerskledd armé under riksföreståndaren Johan Hunyadi på samma mark som slaget 1389. Hunyadi, som sökte hämnd för Varna, gick över Donau i september 1448 med ungrare, valaker och tyska och böhmiska legosoldater i hopp om att förena sig med Skanderbegs albaner, som hölls uppe på vägen; den serbiske despoten Đurađ Branković, bunden av sitt stillestånd med osmanerna, vägrade att ansluta sig. Hunyadis armé stred från en vagnborg från den 17 oktober och nöttes ned av den större osmanska armén, där den unge Mehmed utkämpade sitt första slag; på tredje dagen gick valakerna enligt vissa källor över till sultanen, och resten av armén förintades. Hunyadi kom undan men hölls fången av Branković tills han betalat en lösensumma. Det var den sista stora ungerska offensiven in på Balkan på flera decennier.
