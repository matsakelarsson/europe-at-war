Numbers are uncertain; modern estimates give the crusaders about 22,000–30,000 men and the Ottomans perhaps 40,000–60,000. Some historians doubt that the Wallachians really changed sides.: Styrkorna är osäkra; moderna uppskattningar ger korsfararna omkring 22 000–30 000 man och osmanerna kanske 40 000–60 000. Vissa historiker betvivlar att valackerna verkligen bytte sida.
