# Svenska översättningar av katalogtexten (våg 9); stegtexterna kommer senare.
Battle of Lake Khasan: Slaget vid Chasansjön
? A border battle between the Soviet Union and Japan over two hills west of Lake Khasan, where the borders of the Soviet Maritime Province, Japanese-ruled Korea and Manchukuo met near the mouth of the Tumen River, about 120 km south-west of Vladivostok. In July 1938 Soviet border guards fortified Zaozernaya hill (Changkufeng to the Japanese), which Japan and Manchukuo said lay on their side of a boundary drawn in the Russo-Chinese treaties of 1860 and 1886. After a clash at the neighbouring Bezymyannaya hill on 29 July, troops of the Japanese 19th Division from Korea under Lieutenant General Suetaka Kamezō took both hills in a night attack on 31 July. The Soviet 39th Rifle Corps under Grigory Shtern, with Vasily Blyukher in overall command, counter-attacked from 2 August with infantry, tanks and aircraft over marshy ground, at heavy cost, and retook most of the heights. After talks in Moscow between the Soviet foreign commissar Maxim Litvinov and the Japanese ambassador Shigemitsu Mamoru, fighting stopped at 13:30 local time on 11 August, with Soviet troops on the heights and the border where the Soviet Union claimed it. Russian figures give 792 Soviet dead and missing and 3,279 wounded and sick; Japanese records give 526 dead and missing and 913 wounded, while Soviet sources claimed about 3,000 Japanese killed. Blyukher, blamed for the losses, was arrested in October and died in custody in November 1938. The Kwantung Army fought the Soviet Union again, on a larger scale, at Khalkhin Gol in 1939.
: Ett gränsslag mellan Sovjetunionen och Japan om två kullar väster om Chasansjön, där gränserna mellan sovjetiska Kustprovinsen, det japanskstyrda Korea och Manchukuo möttes nära Tumenflodens mynning, omkring 120 km sydväst om Vladivostok. I juli 1938 befäste sovjetiska gränstrupper kullen Zaozernaja (Changkufeng för japanerna), som Japan och Manchukuo hävdade låg på deras sida av en gräns som dragits i de rysk-kinesiska fördragen 1860 och 1886. Efter en sammandrabbning vid den närliggande kullen Bezymjannaja den 29 juli intog trupper ur japanska 19:e divisionen från Korea under generallöjtnant Suetaka Kamezō båda kullarna i ett nattanfall den 31 juli. Sovjetiska 39:e skyttekåren under Grigorij Sjtern, med Vasilij Bljucher som överbefälhavare, gick till motanfall från den 2 augusti med infanteri, stridsvagnar och flyg över sank terräng, till ett högt pris, och återtog större delen av höjderna. Efter förhandlingar i Moskva mellan den sovjetiske utrikeskommissarien Maksim Litvinov och den japanske ambassadören Shigemitsu Mamoru upphörde striderna klockan 13.30 lokal tid den 11 augusti, med sovjetiska trupper på höjderna och gränsen där Sovjetunionen hävdade att den gick. Ryska siffror anger 792 sovjetiska döda och saknade och 3 279 sårade och sjuka; japanska uppgifter anger 526 döda och saknade och 913 sårade, medan sovjetiska källor hävdade omkring 3 000 dödade japaner. Bljucher, som fick skulden för förlusterna, greps i oktober och dog i häkte i november 1938. Kwantungarmén stred åter mot Sovjetunionen, i större skala, vid Khalkhin Gol 1939.
