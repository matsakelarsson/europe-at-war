# Svenska översättningar av katalogtexten (våg 11); stegtexterna kommer senare.
Battle of Mactan: Slaget vid Mactan
? The battle on the island of Mactan, off Cebu, in which the warriors of the datu Lapulapu defeated a landing party of Ferdinand Magellan’s Spanish expedition and killed Magellan. The expedition, sailing west to reach the Spice Islands, arrived among the Visayan islands in March 1521. At Cebu, Rajah Humabon made an alliance with Magellan and was baptised with his queen and many of his people, and Magellan required the neighbouring chiefs to submit to Humabon and to the King of Spain. On Mactan one of the two chiefs, Zula, sent gifts, but Lapulapu refused to submit or pay tribute. Before dawn on 27 April Magellan crossed to Mactan with about 60 Spaniards and 20 to 30 boats of Humabon’s warriors, whom he told to stay back and watch. Because of the reef the boats could not come near the shore, and Magellan waded in with 49 armoured men; the guns firing from the boats were out of range. Lapulapu’s men, about 1,500 according to the chronicler Antonio Pigafetta, attacked from the front and both flanks with arrows, bamboo spears and swords, aiming at the soldiers’ unprotected legs. Magellan burned some houses, was wounded in the leg and the arm and was killed in the shallows while covering the retreat. Pigafetta counted eight Spaniards and four baptised Cebuanos dead, and fifteen of the Mactan warriors. A few days later Humabon turned on his guests and had some two dozen of them killed at a feast, and the survivors sailed on; under Juan Sebastián Elcano one ship completed the first voyage around the world in 1522. Spain returned to the islands with Legazpi in 1565. In the Philippines Lapulapu is honoured as the first to resist foreign rule, and 27 April is Lapulapu Day.
: Slaget på ön Mactan utanför Cebu, där krigarna under datu Lapulapu besegrade en landstigningsstyrka från Ferdinand Magellans spanska expedition och dödade Magellan. Expeditionen, som seglade västerut för att nå Kryddöarna, kom till Visayasöarna i mars 1521. På Cebu slöt raja Humabon en allians med Magellan och döptes tillsammans med sin drottning och många av sitt folk, och Magellan krävde att grannhövdingarna skulle underkasta sig Humabon och kungen av Spanien. På Mactan sände den ene av de två hövdingarna, Zula, gåvor, men Lapulapu vägrade att underkasta sig eller betala tribut. Före gryningen den 27 april for Magellan över till Mactan med omkring 60 spanjorer och 20 till 30 båtar med Humabons krigare, som han befallde att hålla sig i bakgrunden och se på. På grund av revet kunde båtarna inte komma nära stranden, och Magellan vadade i land med 49 bepansrade män; kanonerna som sköt från båtarna nådde inte fram. Lapulapus män, omkring 1 500 enligt krönikören Antonio Pigafetta, anföll framifrån och från båda flankerna med pilar, bambuspjut och svärd och siktade på soldaternas oskyddade ben. Magellan brände några hus, sårades i benet och armen och dödades på grunt vatten medan han täckte återtåget. Enligt Pigafettas räkning dödades åtta spanjorer och fyra döpta cebuaner, och femton av Mactans krigare. Några dagar senare vände sig Humabon mot sina gäster och lät döda ett par dussin av dem vid en fest, och de överlevande seglade vidare; under Juan Sebastián Elcano fullbordade ett av fartygen den första världsomseglingen 1522. Spanien återvände till öarna med Legazpi 1565. I Filippinerna hedras Lapulapu som den förste som gjorde motstånd mot främmande välde, och den 27 april är Lapulapudagen.
