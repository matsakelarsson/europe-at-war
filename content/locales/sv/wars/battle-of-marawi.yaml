# Svenska översättningar av katalogtexten (våg 11); stegtexterna kommer senare.
Battle of Marawi: Slaget om Marawi
? "The five-month battle for the city of Marawi in Lanao del Sur, on the southern Philippine island of Mindanao, between the Philippine armed forces and fighters allied to the Islamic State, led by the Maute group and the Abu Sayyaf leader Isnilon Hapilon. A raid to capture Hapilon on 23 May 2017 met far stronger resistance than expected: several hundred fighters, among them foreigners from Indonesia, Malaysia and the Middle East, seized much of the city, took hostages and raised the black flag of the Islamic State, and President Rodrigo Duterte declared martial law over all of Mindanao the same night. Almost the whole population of about 200,000 fled. The army, supported by air strikes and American and Australian surveillance, retook the city street by street; Hapilon and Omar Maute were killed on 16 October, Duterte declared Marawi liberated the next day, and the fighting ended on 23 October. By official figures 168 soldiers and police, 87 civilians and about 978 militants died, and the centre of the city was destroyed. It was the longest urban battle in the Philippines since the Second World War."
: "Det fem månader långa slaget om staden Marawi i Lanao del Sur, på ön Mindanao i södra Filippinerna, mellan Filippinernas väpnade styrkor och kämpar allierade med Islamiska staten, ledda av Mautegruppen och Abu Sayyaf-ledaren Isnilon Hapilon. En räd för att gripa Hapilon den 23 maj 2017 mötte mycket starkare motstånd än väntat: flera hundra kämpar, bland dem utlänningar från Indonesien, Malaysia och Mellanöstern, intog stora delar av staden, tog gisslan och hissade Islamiska statens svarta flagga, och president Rodrigo Duterte utlyste krigslagar över hela Mindanao samma natt. Nästan hela befolkningen på omkring 200 000 flydde. Armén, med stöd av flyganfall och amerikansk och australisk spaning, återtog staden gata för gata; Hapilon och Omar Maute dödades den 16 oktober, Duterte förklarade Marawi befriat dagen därpå, och striderna upphörde den 23 oktober. Enligt officiella siffror dog 168 soldater och poliser, 87 civila och omkring 978 militanta, och stadens centrum förstördes. Det var det längsta slaget i stadsmiljö i Filippinerna sedan andra världskriget."
