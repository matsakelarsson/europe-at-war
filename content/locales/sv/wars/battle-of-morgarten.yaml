The size of both armies is unknown; Leopold’s has been put at anything from 2,000–3,000 to 20,000, and the Confederates at 1,500 to 4,000. Much of the familiar story, including the warning that the lords of Hünenberg are said to have sent over the border on arrows, comes from chronicles written a century later.: Båda arméernas storlek är okänd; Leopolds har uppskattats till allt från 2 000–3 000 till 20 000 man och edsförbundets till 1 500–4 000. Mycket av den välkända berättelsen, bland annat varningen som herrarna av Hünenberg sägs ha skickat över gränsen med pilar, kommer från krönikor som skrevs ett sekel senare.
The quarrel with Einsiedeln over pastures and forest (the Marchenstreit) had gone on for generations. The Pact of Brunnen was sealed on 9 December 1315, and a truce with the Habsburgs followed in 1318.: Tvisten med Einsiedeln om betesmarker och skog (Marchenstreit) hade pågått i generationer. Förbundet i Brunnen beseglades den 9 december 1315, och ett stillestånd med habsburgarna följde 1318.
