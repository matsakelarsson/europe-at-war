Battle of Morgarten: Slaget vid Morgarten
The first great victory of the Swiss Confederates over the Habsburgs. After men of Schwyz raided the Habsburg-protected abbey of Einsiedeln in January 1314, and with the Forest Cantons backing Louis the Bavarian against the Habsburg Frederick the Fair in the disputed royal election of that year, Duke Leopold I of Austria marched on Schwyz. On 15 November 1315 men of Schwyz, Uri and Unterwalden ambushed his column of knights on the narrow path between Lake Ägeri and Sattel, killing many and driving others into the lake. Less than a month later the three cantons renewed their alliance in the Pact of Brunnen.: Edsförbundets första stora seger över habsburgarna. Sedan män från Schwyz i januari 1314 plundrat det av habsburgarna beskyddade klostret Einsiedeln, och sedan skogskantonerna i det omstridda kungavalet samma år stött Ludvig av Bayern mot habsburgaren Fredrik den sköne, tågade hertig Leopold I av Österrike mot Schwyz. Den 15 november 1315 överföll män från Schwyz, Uri och Unterwalden hans riddarkolonn på den smala vägen mellan Ägerisjön och Sattel, dödade många och drev andra ut i sjön. Mindre än en månad senare förnyade de tre kantonerna sitt förbund i Brunnenpakten.
