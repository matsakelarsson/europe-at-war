# Svenska översättningar av katalogtexten (våg 10); stegtexterna kommer senare.
Battle of Okehazama: Slaget vid Okehazama
? The battle in which Oda Nobunaga, a young lord of Owari, killed Imagawa Yoshimoto and broke the strongest house of the Tōkaidō. Yoshimoto, who ruled Suruga, Tōtōmi and Mikawa, marched west into Owari in 1560 with an army of about 25,000; whether he meant to go on to Kyoto or only to secure the border is debated. His vanguard took the Oda border forts of Washizu and Marune, the second stormed by the young Matsudaira Motoyasu, the later Tokugawa Ieyasu, who served the Imagawa. Nobunaga could raise perhaps 2,000 to 3,000 men. He rode out from Kiyosu by way of the Atsuta shrine to the fort at Zenshō-ji, left banners there to suggest a larger force, and moved against Yoshimoto’s headquarters, which had halted in the narrow valley of Dengaku-hazama near the village of Okehazama. Under cover of a sudden thunderstorm the Oda troops fell on the Imagawa headquarters on 12 June 1560 (the 19th day of the fifth month of Eiroku 3). Yoshimoto was killed in the fight by two Oda samurai, Hattori Koheita and Mōri Shinsuke (accounts differ on which of them struck him down), and most of his commanders died with him. The traditional account has the Oda swing round through the hills to strike from the flank; many historians now think Nobunaga attacked head on. The Imagawa never recovered. Motoyasu went home to Okazaki, made himself independent and in 1562 allied with Nobunaga, and Nobunaga, secure in the east, turned to the conquest of Mino.
: Slaget där Oda Nobunaga, en ung herre i Owari, dödade Imagawa Yoshimoto och bröt makten hos den mäktigaste ätten längs Tōkaidō. Yoshimoto, som härskade över Suruga, Tōtōmi och Mikawa, tågade 1560 västerut in i Owari med en armé på omkring 25 000 man; om han tänkte fortsätta till Kyoto eller bara säkra gränsen är omstritt. Hans förtrupp intog Odaklanens gränsfästen Washizu och Marune, det senare stormat av den unge Matsudaira Motoyasu, den blivande Tokugawa Ieyasu, som stod i Imagawas tjänst. Nobunaga kunde kanske mönstra 2 000 till 3 000 man. Han red ut från Kiyosu via Atsutahelgedomen till fästet vid Zenshō-ji, lämnade fanor där för att ge sken av en större styrka och gick mot Yoshimotos högkvarter, som hade gjort halt i den trånga dalen Dengaku-hazama nära byn Okehazama. I skydd av ett plötsligt åskväder föll Odatrupperna över Imagawas högkvarter den 12 juni 1560 (den 19:e dagen i femte månaden Eiroku 3). Yoshimoto dödades i striden av två av Odas samurajer, Hattori Koheita och Mōri Shinsuke (källorna går isär om vem av dem som fällde honom), och de flesta av hans befälhavare stupade med honom. Enligt den traditionella berättelsen svängde Odatrupperna runt genom bergen för att anfalla från flanken; många historiker tror nu att Nobunaga anföll rakt framifrån. Imagawaklanen återhämtade sig aldrig. Motoyasu återvände hem till Okazaki, gjorde sig självständig och slöt 1562 förbund med Nobunaga, och Nobunaga, som nu hade ryggen fri i öster, vände sig mot erövringen av Mino.
