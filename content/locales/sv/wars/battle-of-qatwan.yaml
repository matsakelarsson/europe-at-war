# Svenska översättningar av katalogtexten (våg 7); stegtexterna kommer senare.
Qara Khitai–Seljuk war and the Battle of Qatwan: Qara Khitais krig mot seldjukerna och slaget vid Qatwan
The war in which the Qara Khitai, Khitans from northern China who had moved west after the fall of their Liao empire, took Transoxiana from the Seljuk sultan Ahmad Sanjar and his Karakhanid vassals. After beating the Karakhanid khan near Khujand in 1137, the Qara Khitai ruler Yelü Dashi destroyed Sanjar’s army on the Qatwan steppe north of Samarkand on 9 September 1141. Transoxiana passed under the overlordship of a non-Muslim empire for the next seventy years, the Khwarazmshah Atsiz plundered Merv, and the Seljuk empire in the east began to decline.: Kriget där Qara Khitai, khitaner från norra Kina som hade dragit västerut efter att deras Liaorike hade fallit, tog Transoxanien från den seldjukiske sultanen Ahmad Sanjar och hans karakhanidiska vasaller. Sedan Qara Khitais härskare Yelü Dashi 1137 hade slagit den karakhanidiske khanen nära Chudzjand förintade han den 9 september 1141 Sanjars armé på Qatwanstäppen norr om Samarkand. Transoxanien kom under ett icke-muslimskt rikes överhöghet under de följande sjuttio åren, khwarazmshahen Atsiz plundrade Merv, och det seldjukiska riket i öster började förfalla.
