The traditional date of 29 July comes from Snorri Sturluson’s saga, written about 200 years later. The sagas also describe a solar eclipse during the battle, but the eclipse visible in Norway in 1030 fell on 31 August, so the exact date is uncertain.: Det traditionella datumet 29 juli kommer från Snorre Sturlassons saga, skriven omkring 200 år senare. Sagorna beskriver också en solförmörkelse under slaget, men den förmörkelse som var synlig i Norge 1030 inträffade den 31 augusti, så det exakta datumet är osäkert.
Olaf was declared a saint by the bishop of Nidaros in 1031. His shrine in Trondheim made Nidaros a pilgrimage centre, and Olsok, 29 July, is still kept in Norway.: Olav förklarades helgon av biskopen i Nidaros 1031. Hans helgonskrin i Trondheim gjorde Nidaros till en vallfartsort, och olsok, den 29 juli, firas fortfarande i Norge.
