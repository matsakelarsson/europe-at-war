Battle of Stiklestad: Slaget vid Stiklestad
The battle in which King Olaf Haraldsson, driven out of Norway in 1028 when Cnut the Great took the country, was killed on 29 July 1030 trying to win back his throne with an army raised in Sweden. He was defeated in the Verdal valley north of Trondheim by a peasant army led by Norwegian chieftains loyal to Cnut. Within a year Olaf was revered as a saint, and harsh Danish rule soon turned Norwegians against Cnut; Olaf’s son Magnus took the throne in 1035.: Det slag där kung Olav Haraldsson, som fördrivits från Norge 1028 när Knut den store tog landet, stupade den 29 juli 1030 i ett försök att vinna tillbaka sin tron med en här som rekryterats i Sverige. Han besegrades i Verdalen norr om Trondheim av en bondehär ledd av norska hövdingar som var lojala mot Knut. Inom ett år vördades Olav som helgon, och det hårda danska styret vände snart norrmännen mot Knut; Olavs son Magnus besteg tronen 1035.
