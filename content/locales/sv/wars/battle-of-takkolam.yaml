# Svenska översättningar av katalogtexten (våg 8); stegtexterna kommer senare.
Battle of Takkolam: Slaget vid Takkolam
The battle in which the Rashtrakuta emperor Krishna III defeated the army of the Chola king Parantaka I near Takkolam, in today’s Ranipet district of Tamil Nadu, in 949. Krishna III invaded the Chola country with his brother-in-law and vassal, the Western Ganga king Butuga II. The Chola army was led by the crown prince Rajaditya, who was killed on his war elephant; a Ganga inscription at Atakur says that Butuga shot him with an arrow, and the Cholas remembered him as the prince “who died on the elephant”. The Chola army broke, and the Rashtrakutas took Tondaimandalam, the northern Chola lands around Kanchipuram, which they held for about twenty years. Krishna III took the title “who took Kanchi and Tanjore”, and his inscriptions claim that he advanced as far as Rameswaram. The defeat set the Cholas back for a generation, until the rise of Rajaraja I after 985.: Slaget där rashtrakutakejsaren Krishna III besegrade cholakungen Parantaka I:s armé nära Takkolam, i dagens distrikt Ranipet i Tamil Nadu, år 949. Krishna III invaderade cholalandet tillsammans med sin svåger och vasall, västgangakungen Butuga II. Cholaarmén leddes av kronprinsen Rajaditya, som dödades på sin krigselefant; en gangainskrift i Atakur säger att Butuga sköt honom med en pil, och i cholatraditionen mindes man honom som prinsen ”som dog på elefanten”. Cholaarmén bröts, och rashtrakutadynastin lade under sig Tondaimandalam, de norra cholaländerna kring Kanchipuram, som den behöll i omkring tjugo år. Krishna III antog titeln ”som intog Kanchi och Tanjore”, och hans inskrifter hävdar att han trängde fram ända till Rameswaram. Nederlaget var ett bakslag för cholariket under en generation, fram till Rajaraja I:s uppgång efter 985.
