# Svenska översättningar av katalogtexten (våg 8); stegtexterna kommer senare.
Battle of Talikota: Slaget vid Talikota
The battle in which an alliance of four Deccan sultanates, Bijapur, Ahmadnagar, Golconda and Bidar, defeated the army of the Vijayanagara Empire, the great power of southern India, on 23 January 1565. Aliya Rama Raya, who ruled Vijayanagara in the name of the emperor Sadashiva, had for twenty years played the sultanates against each other; his growing demands drove them to unite. The armies met south of the Krishna river, near the villages of Rakkasagi and Tangadagi, some 30 km from Talikota, after which the battle is usually named. Rama Raya was captured and beheaded, his army broke, and the sultans’ troops sacked the undefended capital, Vijayanagara (Hampi), over the following months. The empire survived under Rama Raya’s brother Tirumala and the Aravidu dynasty, ruling from Penukonda and later Chandragiri, but never recovered its power.: Slaget där en allians av fyra deckansultanat – Bijapur, Ahmadnagar, Golconda och Bidar – besegrade armén från Vijayanagarariket, södra Indiens stormakt, den 23 januari 1565. Aliya Rama Raya, som styrde Vijayanagara i kejsar Sadashivas namn, hade i tjugo år spelat ut sultanaten mot varandra; hans växande krav drev dem att ena sig. Arméerna möttes söder om floden Krishna, nära byarna Rakkasagi och Tangadagi, omkring 30 km från Talikota, som slaget vanligen har fått sitt namn efter. Rama Raya tillfångatogs och halshöggs, hans armé bröts, och under de följande månaderna plundrade sultanernas trupper den oförsvarade huvudstaden Vijayanagara (Hampi). Riket levde vidare under Rama Rayas bror Tirumala och Aravidudynastin, som styrde från Penukonda och senare Chandragiri, men återfick aldrig sin makt.
