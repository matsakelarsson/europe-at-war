# Svenska översättningar av katalogtexten (våg 14); stegtexterna kommer senare.
Battle of the Caribbean: Slaget om Karibien
? The German and Italian submarine campaign against Allied shipping in the Caribbean Sea and the Gulf of Mexico during the Second World War, part of the Battle of the Atlantic. The region mattered because of the oil of Venezuela, refined on the Dutch islands of Aruba and Curaçao and in Trinidad, the bauxite of the Guianas, needed for aircraft aluminium, and the Panama Canal. After Germany declared war on the United States on 11 December 1941, U-boats opened Operation Neuland on 16 February 1942, torpedoing tankers in the harbours of Aruba and Curaçao and in Trinidad’s Gulf of Paria. Ships sailing alone along lit coasts were easy targets, and in 1942 the Caribbean and the Gulf of Mexico saw some of the heaviest losses of the whole Atlantic war. The sinking of two Mexican tankers in May 1942 brought Mexico into the war. Losses fell sharply once the United States and Britain organised interlocking convoys from mid-1942 and covered them with aircraft from new bases leased in the British islands; by 1943 few U-boats came to the region, and several were sunk there, one of them by a Cuban submarine chaser. In all about 400 ships were sunk in the wider Caribbean, including 56 in the Gulf of Mexico. French Martinique and Guadeloupe, held for the Vichy government by Admiral Georges Robert under a US watch, went over to the Free French in July 1943.
: Den tyska och italienska ubåtskampanjen mot de allierades sjöfart i Karibiska havet och Mexikanska golfen under andra världskriget, en del av slaget om Atlanten. Regionen var viktig på grund av oljan från Venezuela, som raffinerades på de nederländska öarna Aruba och Curaçao och på Trinidad, bauxiten från Guyanaländerna, som behövdes till aluminium för flygplan, och Panamakanalen. Sedan Tyskland hade förklarat USA krig den 11 december 1941 inledde U-båtarna Operation Neuland den 16 februari 1942 och torpederade tankfartyg i Arubas och Curaçaos hamnar och i Pariabukten vid Trinidad. Fartyg som seglade ensamma längs upplysta kuster var lätta mål, och 1942 drabbades Karibien och Mexikanska golfen av några av de svåraste förlusterna under hela kriget i Atlanten. Sänkningen av två mexikanska tankfartyg i maj 1942 förde in Mexiko i kriget. Förlusterna sjönk kraftigt sedan USA och Storbritannien från mitten av 1942 hade organiserat ett system av sammanlänkade konvojer och skyddat dem med flygplan från nya baser som arrenderats på de brittiska öarna; 1943 kom få U-båtar till regionen, och flera sänktes där, en av dem av en kubansk ubåtsjagare. Sammanlagt sänktes omkring 400 fartyg i Karibien i vid mening, bland dem 56 i Mexikanska golfen. Franska Martinique och Guadeloupe, som amiral Georges Robert höll för Vichyregeringen under amerikansk bevakning, gick över till Fria Frankrike i juli 1943.
