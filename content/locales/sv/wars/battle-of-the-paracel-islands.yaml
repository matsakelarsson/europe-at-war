# Svenska översättningar av katalogtexten (våg 11); stegtexterna kommer senare.
Battle of the Paracel Islands: Slaget om Paracelöarna
? "A naval battle in which China took the western Paracel Islands in the South China Sea from South Vietnam. The islands are claimed by China, Taiwan and Vietnam; since 1956 the People’s Republic had held the eastern Amphitrite group, with Woody Island, and South Vietnam the western Crescent group, with Pattle Island. In January 1974 Chinese fishing boats and militia landed on Duncan and Drummond islands, and South Vietnamese warships came to remove them. On 19 January four South Vietnamese warships and six smaller Chinese submarine chasers and minesweepers fought off Duncan Island: the escort ship Nhật Tảo was sunk and the other ships damaged, and South Vietnam lost about 75 men killed; China gave its losses as 18 killed. The next day Chinese troops landed on Pattle, Robert and Money islands and took 48 prisoners, among them an American liaison officer, Gerald Kosh, who was released on 31 January. The United States declined to intervene, the UN Security Council dropped South Vietnam’s complaint, and North Vietnam kept silent. China has held all the Paracels since. China regards the islands as Chinese since ancient times and the battle as a counter-attack in self-defence; Vietnam, which renewed the claim after reunification as successor to South Vietnam and to the Nguyễn emperors who sent expeditions to the islands from the 18th century, calls it an invasion and commemorates the 74 sailors it counts as killed. On 14 March 1988, at Johnson South Reef in the Spratly Islands, Chinese ships opened fire on Vietnamese troops standing on the reef and sank their transport ships, killing 64 Vietnamese; China took six reefs and has since turned some of them into artificial islands. The disputes over both archipelagos remain unresolved."
: "Ett sjöslag där Kina tog de västra Paracelöarna i Sydkinesiska havet från Sydvietnam. Kina, Taiwan och Vietnam gör anspråk på öarna; sedan 1956 hade Folkrepubliken hållit den östra Amphitritegruppen, med Woody Island, och Sydvietnam den västra Crescentgruppen, med Pattle Island. I januari 1974 landsteg kinesiska fiskebåtar och milis på öarna Duncan och Drummond, och sydvietnamesiska krigsfartyg kom för att avlägsna dem. Den 19 januari stred fyra sydvietnamesiska krigsfartyg och sex mindre kinesiska ubåtsjagare och minsvepare utanför Duncan Island: eskortfartyget Nhật Tảo sänktes och de andra fartygen skadades, och Sydvietnam förlorade omkring 75 döda; Kina uppgav sina förluster till 18 döda. Dagen därpå landsteg kinesiska trupper på öarna Pattle, Robert och Money och tog 48 fångar, bland dem en amerikansk sambandsofficer, Gerald Kosh, som släpptes den 31 januari. USA avstod från att ingripa, FN:s säkerhetsråd lade ned Sydvietnams klagomål, och Nordvietnam teg. Kina har hållit alla Paracelöarna sedan dess. Kina betraktar öarna som kinesiska sedan urminnes tider och slaget som ett motanfall i självförsvar; Vietnam, som efter återföreningen förnyade anspråket som efterträdare till Sydvietnam och till Nguyễnkejsarna, som sände expeditioner till öarna från 1700-talet, kallar det en invasion och hedrar minnet av de 74 sjömän som enligt landets räkning dödades. Den 14 mars 1988, vid Johnson South-revet i Spratlyöarna, öppnade kinesiska fartyg eld mot vietnamesiska soldater som stod på revet och sänkte deras transportfartyg, varvid 64 vietnameser dödades; Kina tog sex rev och har sedan dess gjort om några av dem till konstgjorda öar. Tvisterna om båda ögrupperna är fortfarande olösta."
