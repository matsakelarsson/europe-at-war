# Svenska översättningar av katalogtexten (våg 14); stegtexterna kommer senare.
Battle of the St. Lawrence: Slaget om Saint Lawrence
? The German U-boat campaign in the Gulf of St. Lawrence and the lower St. Lawrence River during the Second World War, part of the Battle of the Atlantic and the first fighting in Canada’s inland waters since the War of 1812. On 12 May 1942 U-553 sank the British freighter Nicoya and the Dutch Leto near Anticosti Island, at the mouth of the river. In July U-132 sank three ships of a convoy off Cap-Chat, and in late August and September U-517 sank nine ships, among them the corvette HMCS Charlottetown, and U-165 sank the armed yacht HMCS Raccoon and badly damaged other ships, while residents of the Gaspé coast watched ships burn and bodies wash ashore under wartime censorship. In September 1942 Ottawa closed the river and the gulf to ocean shipping, sending cargoes by rail to Halifax and Sydney, until 1944. On 14 October 1942 U-69 sank the Newfoundland Railway ferry Caribou in the Cabot Strait; 137 of the 237 people aboard died, many of them women and children. On the Atlantic side of Newfoundland, then a separate dominion, U-boats sank four ore carriers at the anchorage of Bell Island in September and November 1942, and U-518 landed the spy Werner von Janowski at New Carlisle, Quebec, where he was arrested the same day. In September 1943 the navy and police foiled Operation Kiebitz, a plan for U-536 to pick up German naval officers escaping from a prisoner-of-war camp at Bowmanville, Ontario, at Pointe de Maisonnette. In autumn 1944 U-1223 damaged the frigate HMCS Magog beyond repair and U-1228 sank the corvette HMCS Shawinigan in the Cabot Strait with all 91 men aboard. In all, U-boats sank more than 20 merchant ships and four Canadian warships in and around the gulf, without losing a U-boat there; the Royal Canadian Navy, the Royal Canadian Air Force and the convoys kept most shipping moving.
: Den tyska U-båtskampanjen i Saint Lawrenceviken och nedre Saint Lawrencefloden under andra världskriget, en del av slaget om Atlanten och de första striderna i Kanadas inre farvatten sedan 1812 års krig. Den 12 maj 1942 sänkte U-553 det brittiska lastfartyget Nicoya och det nederländska Leto nära Anticostiön, vid flodens mynning. I juli sänkte U-132 tre fartyg ur en konvoj utanför Cap-Chat, och i slutet av augusti och i september sänkte U-517 nio fartyg, bland dem korvetten HMCS Charlottetown, och U-165 sänkte den beväpnade jakten HMCS Raccoon och skadade andra fartyg svårt, medan invånarna på Gaspékusten under krigscensuren såg fartyg brinna och döda kroppar flyta i land. I september 1942 stängde Ottawa floden och viken för oceangående sjöfart, och lasterna skickades i stället med järnväg till Halifax och Sydney, fram till 1944. Den 14 oktober 1942 sänkte U-69 Newfoundland Railways färja Caribou i Cabotsundet; 137 av de 237 personerna ombord omkom, många av dem kvinnor och barn. På Atlantsidan av Newfoundland, då ett separat dominion, sänkte U-båtar fyra malmfartyg på ankarplatsen vid Bell Island i september och november 1942, och U-518 landsatte spionen Werner von Janowski vid New Carlisle i Québec, där han greps samma dag. I september 1943 omintetgjorde flottan och polisen Operation Kiebitz, en plan att låta U-536 vid Pointe de Maisonnette hämta upp tyska sjöofficerare som skulle fly från ett krigsfångeläger i Bowmanville i Ontario. Hösten 1944 skadade U-1223 fregatten HMCS Magog så svårt att den inte kunde repareras, och U-1228 sänkte korvetten HMCS Shawinigan i Cabotsundet med alla 91 man ombord. Sammanlagt sänkte U-båtarna mer än 20 handelsfartyg och fyra kanadensiska örlogsfartyg i och omkring viken, utan att förlora någon U-båt där; Royal Canadian Navy, Royal Canadian Air Force och konvojerna höll merparten av sjöfarten i gång.
