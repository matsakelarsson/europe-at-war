# Svenska översättningar av katalogtexten (våg 10); stegtexterna kommer senare.
Battles of Fengwudong and Qingshanli: Slagen vid Fengwudong och Qingshanli
? The largest clashes between Korean independence armies and the Japanese army, fought in 1920 in Jiandao (Gando), the region of China’s Jilin province north of the Tumen River where hundreds of thousands of Koreans lived. After the March First Movement of 1919, armed Korean groups based there raided Japanese posts across the river in Korea. On 7 June 1920 Hong Beom-do’s and Choe Jin-dong’s forces ambushed a pursuing Japanese battalion in the valley of Fengwudong (Bongo-dong). In October, after an attack on the Japanese consulate at Hunchun, Japan sent a large force, by Korean estimates 18,000–20,000 men, into Jiandao with China’s reluctant consent, and from 21 to 26 October the units of Kim Jwa-jin and Hong Beom-do fought a series of actions in the forests around Qingshanli (Cheongsan-ri) before slipping away north. Korean accounts count these as great victories with hundreds or more than a thousand Japanese dead; Japanese army records give only a handful. Japanese troops then burned Korean villages and killed thousands of their people in what Koreans call the Gyeongsin massacre or Gando massacre, and the independence armies withdrew towards Soviet Russia.
: De största sammandrabbningarna mellan koreanska självständighetsarméer och den japanska armén, utkämpade 1920 i Jiandao (Gando), det område i Kinas Jilinprovins norr om Tumenfloden där hundratusentals koreaner bodde. Efter Första mars-rörelsen 1919 gjorde beväpnade koreanska grupper med bas där räder mot japanska poster på andra sidan floden i Korea. Den 7 juni 1920 lade Hong Beom-dos och Choe Jin-dongs styrkor ett bakhåll för en förföljande japansk bataljon i dalen Fengwudong (Bongo-dong). I oktober, efter ett angrepp på det japanska konsulatet i Hunchun, sände Japan en stor styrka, enligt koreanska uppskattningar 18 000–20 000 man, in i Jiandao med Kinas motvilliga samtycke, och från den 21 till den 26 oktober utkämpade Kim Jwa-jins och Hong Beom-dos förband en rad strider i skogarna kring Qingshanli (Cheongsan-ri) innan de smet undan norrut. Koreanska framställningar räknar dessa som stora segrar med hundratals eller mer än tusen döda japaner; den japanska arméns handlingar anger bara en handfull. Japanska trupper brände sedan koreanska byar och dödade tusentals av deras invånare i det som koreaner kallar Gyeongsinmassakern eller Gandomassakern, och självständighetsarméerna drog sig tillbaka mot Sovjetryssland.
