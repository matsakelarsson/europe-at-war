Battles of Kawanakajima: Slagen vid Kawanakajima
Five campaigns fought between Takeda Shingen of Kai and Uesugi Kenshin of Echigo for the Kawanakajima plain in northern Shinano, where the Sai and Chikuma rivers meet, around today’s city of Nagano. After Shingen drove the Murakami and Ogasawara out of Shinano in 1553, they turned to Kenshin, then still called Nagao Kagetora, and he crossed the mountains to stop the Takeda advance towards his own province. The armies met at Kawanakajima in 1553, 1555, 1557, 1561 and 1564. Most of these campaigns were long stand-offs, but the fourth, fought at Hachimanbara on 18 October 1561, was one of the bloodiest battles of the Sengoku period, in which Shingen’s brother Takeda Nobushige was killed and both armies lost thousands of men. Neither side won the plain outright, though the Takeda kept most of northern Shinano; the rivalry of the two lords became one of the most retold stories of Japanese warfare.: Fem fälttåg som Takeda Shingen från Kai och Uesugi Kenshin från Echigo utkämpade om Kawanakajimaslätten i norra Shinano, där floderna Sai och Chikuma flyter samman, kring dagens stad Nagano. Sedan Shingen 1553 hade drivit ut Murakami- och Ogasawaraklanerna ur Shinano vände de sig till Kenshin, som då ännu hette Nagao Kagetora, och han gick över bergen för att hejda Takedas framryckning mot hans egen provins. Arméerna möttes vid Kawanakajima 1553, 1555, 1557, 1561 och 1564. De flesta av dessa fälttåg var långa dödlägen, men det fjärde, som utkämpades vid Hachimanbara den 18 oktober 1561, var ett av de blodigaste slagen under Sengokuperioden; Shingens bror Takeda Nobushige stupade, och båda arméerna förlorade tusentals man. Ingen av sidorna vann slätten helt, även om Takedaklanen behöll större delen av norra Shinano; de två herrarnas rivalitet blev en av de mest återberättade historierna i japansk krigföring.
