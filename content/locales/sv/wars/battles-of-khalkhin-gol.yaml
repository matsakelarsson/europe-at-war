# Svenska översättningar av katalogtexten (våg 9); stegtexterna kommer senare.
Battles of Khalkhin Gol: Striderna vid Khalkhin Gol
? An undeclared war between the Soviet Union and Mongolia on one side and Japan and its client state Manchukuo on the other, fought over a strip of steppe on the Khalkhin Gol, the river that the Japanese said was the border between Manchukuo and the Mongolian People’s Republic, while Mongolia and the Soviet Union placed the border some 16–20 km further east, near the cairn of Nomonhan. Clashes between border patrols in May 1939 grew into a battle of divisions. A Japanese offensive across the river at Bain-Tsagan in early July was thrown back by Soviet armour, and on 20 August Georgy Zhukov’s army group attacked with some 500 tanks and 500 aircraft, encircled the Japanese 23rd Division and destroyed it by the end of the month. A ceasefire agreed in Moscow took effect on 16 September, and the border was fixed roughly where Mongolia had claimed it. Japan lost some 17,000–20,000 killed, wounded and sick, the Soviet Union about 25,000. The defeat turned Japan away from war with the Soviet Union and towards South-East Asia and the Pacific.
: Ett oförklarat krig mellan Sovjetunionen och Mongoliet å ena sidan och Japan och dess lydstat Manchukuo å den andra, utkämpat om en remsa stäpp vid Khalkhin Gol, den flod som japanerna menade utgjorde gränsen mellan Manchukuo och Mongoliska folkrepubliken, medan Mongoliet och Sovjetunionen förlade gränsen omkring 16–20 km längre österut, nära stenröset vid Nomonhan. Sammandrabbningar mellan gränspatruller i maj 1939 växte till ett slag mellan divisioner. En japansk offensiv över floden vid Bain-Tsagan i början av juli slogs tillbaka av sovjetiska pansarstyrkor, och den 20 augusti anföll Georgij Zjukovs armégrupp med omkring 500 stridsvagnar och 500 flygplan, omringade japanska 23:e divisionen och förintade den före månadens slut. En vapenvila som avtalats i Moskva trädde i kraft den 16 september, och gränsen fastställdes ungefär där Mongoliet hade hävdat att den gick. Japan förlorade omkring 17 000–20 000 dödade, sårade och sjuka, Sovjetunionen omkring 25 000. Nederlaget fick Japan att vända sig bort från krig mot Sovjetunionen och i stället mot Sydostasien och Stilla havet.
