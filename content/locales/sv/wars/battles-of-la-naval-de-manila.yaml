# Svenska översättningar av katalogtexten (våg 11); stegtexterna kommer senare.
Battles of La Naval de Manila: Sjöslagen La Naval de Manila
? Five sea battles fought in 1646 in Philippine waters between the Spanish and the Dutch East India Company (VOC), in the last years of the Eighty Years’ War. The VOC, which had taken the Spanish fort on Formosa (Taiwan) in 1642, sent two squadrons to blockade Manila, intercept the galleons from Acapulco and the junks from China, and win over the people of the coasts. Governor Diego Fajardo had only two old merchant galleons fit for war, the Encarnación and the Rosario, with a galley and a few brigantines, manned by Spanish and Filipino crews under Lorenzo Ugalde de Orellana and Sebastián López. On 15 March they fought four Dutch ships off Bolinao in Pangasinan. On 29 July, between Banton and Marinduque, they fought seven Dutch ships and sank a fire ship; on 31 July, between Mindoro and Maestre de Campo, a second fire ship was sunk and the Dutch withdrew. On 16 September the Encarnación fought three Dutch ships off Ambil and Lubang for four hours, and on 4 October, at the entrance of Manila Bay off Mariveles, the galleon and the galley drove off the last three. Dutch landings in Ilocos and Pangasinan and an attack on Zamboanga, where the Dutch were driven back from Caldera, also failed. Spanish accounts give about 15 Spanish dead in the five battles and about 500 Dutch. The crews had made a vow to Our Lady of the Rosary and walked barefoot to the church of Santo Domingo when they came home; on 9 April 1652 (1662 in some accounts) the cathedral chapter of Manila declared the victories miraculous, and La Naval is still celebrated on the second Sunday of October. The Peace of Münster ended the war between Spain and the Dutch Republic in 1648.
: Fem sjöslag som utkämpades 1646 i filippinska vatten mellan spanjorerna och Nederländska ostindiska kompaniet (VOC) under åttioåriga krigets sista år. VOC, som hade tagit det spanska fortet på Formosa (Taiwan) 1642, sände två eskadrar för att blockera Manila, uppbringa galeonerna från Acapulco och djonkerna från Kina och vinna över kustbefolkningen. Guvernör Diego Fajardo hade bara två gamla handelsgaleoner som dugde till krig, Encarnación och Rosario, samt en galär och några brigantiner, bemannade med spanska och filippinska besättningar under Lorenzo Ugalde de Orellana och Sebastián López. Den 15 mars stred de mot fyra nederländska fartyg utanför Bolinao i Pangasinan. Den 29 juli, mellan Banton och Marinduque, stred de mot sju nederländska fartyg och sänkte en brännare; den 31 juli, mellan Mindoro och Maestre de Campo, sänktes en andra brännare och nederländarna drog sig tillbaka. Den 16 september stred Encarnación i fyra timmar mot tre nederländska fartyg utanför Ambil och Lubang, och den 4 oktober, vid inloppet till Manilabukten utanför Mariveles, drev galeonen och galären bort de tre sista. Nederländska landstigningar i Ilocos och Pangasinan och ett anfall mot Zamboanga, där nederländarna drevs tillbaka från Caldera, misslyckades också. Enligt spanska källor dog omkring 15 spanjorer i de fem slagen och omkring 500 nederländare. Besättningarna hade avlagt ett löfte till Vår Fru av Rosenkransen och gick barfota till kyrkan Santo Domingo när de kom hem; den 9 april 1652 (1662 enligt vissa källor) förklarade domkapitlet i Manila segrarna mirakulösa, och La Naval firas fortfarande den andra söndagen i oktober. Freden i Münster gjorde 1648 slut på kriget mellan Spanien och Nederländska republiken.
