# Svenska översättningar av katalogtexten (våg 11); stegtexterna kommer senare.
Chinese uprising at Bau and Kuching: Kinesiska resningen i Bau och Kuching
? A rising of the Hakka gold miners of Bau, in Upper Sarawak, against the Brooke Raj. Their kongsi, the Twelve Kongsi, ran the gold mines of the Bau district and managed many of its own affairs; in the 1850s James Brooke’s government curbed its powers, made it build and pay for a fort at Belidah, and shortly before the rising fined it £150 for smuggling opium. Rumours of Britain’s war with China at Canton and of the British commission of inquiry into Brooke’s rule encouraged the kongsi’s leaders. On 18 February 1857 about 600 miners under Liu Shan Bang went down the Sarawak River by boat from Tundong and attacked Kuching after midnight. They burned the houses of Brooke and his officers and took the stockade with its arms and treasury; Brooke escaped by swimming a creek. Several Europeans were killed, among them a young officer, Nicholetts, whose head was paraded as the Rajah’s, two small children of the police inspector and a Borneo Company clerk. The kongsi’s leaders sat in Brooke’s court, made the Borneo Company’s manager and the Malay Datu Bandar govern the town under them, and went back upriver with their plunder. Malays under the Datu Bandar fought them on the river; within days the Borneo Company steamer Sir James Brooke arrived from Singapore and the Iban fighters of Brooke’s nephew Charles Brooke came from the Batang Lupar. The miners fled towards the Dutch border. Liu Shan Bang was killed on 24 February, and Malay, Iban and Bidayuh forces pursued the retreating Chinese, women and children among them, for days. Brooke-era accounts put the Chinese dead at about 1,000 and those who escaped into Sambas at about 2,000, half of them women and children; one account gives about 3,000 villagers killed in the pursuit. Peace was proclaimed on 15 April 1857. The kongsi was broken up, the Borneo Company took over much of the mining, and the Hakka of Bau later honoured Liu Shan Bang as a deity.
: En resning bland hakkaguldgrävarna i Bau, i övre Sarawak, mot familjen Brookes rajadöme. Deras kongsi, Tolvkongsin, drev guldgruvorna i Baudistriktet och skötte många av sina egna angelägenheter; på 1850-talet inskränkte James Brookes regering dess befogenheter, tvingade den att bygga och bekosta ett fort vid Belidah och bötfällde den kort före resningen på 150 pund för opiumsmuggling. Rykten om Storbritanniens krig mot Kina vid Kanton och om den brittiska undersökningskommissionen om Brookes styre uppmuntrade kongsins ledare. Den 18 februari 1857 for omkring 600 gruvarbetare under Liu Shan Bang i båtar nedför Sarawakfloden från Tundong och anföll Kuching efter midnatt. De brände Brookes och hans tjänstemäns hus och tog palissaden med dess vapen och skattkammare; Brooke undkom genom att simma över en bäck. Flera européer dödades, bland dem en ung tjänsteman, Nicholetts, vars huvud bars omkring som om det vore rajans, två små barn till polisinspektören och en kontorist vid Borneo Company. Kongsins ledare tog plats i Brookes domstolssal, lät Borneo Companys chef och den malajiske Datu Bandar styra staden under dem och for tillbaka uppför floden med sitt byte. Malajer under Datu Bandar stred mot dem på floden; inom några dagar kom Borneo Companys ångare Sir James Brooke från Singapore, och ibankrigarna under Brookes brorson Charles Brooke kom från Batang Lupar. Gruvarbetarna flydde mot den nederländska gränsen. Liu Shan Bang dödades den 24 februari, och styrkor av malajer, iban och bidayuh förföljde i flera dagar de retirerande kineserna, bland dem kvinnor och barn. Källor från Brookes tid anger antalet döda kineser till omkring 1 000 och antalet som undkom till Sambas till omkring 2 000, hälften av dem kvinnor och barn; enligt en källa dödades omkring 3 000 bybor under förföljelsen. Fred utropades den 15 april 1857. Kongsin upplöstes, Borneo Company tog över en stor del av gruvdriften, och hakkafolket i Bau kom senare att hedra Liu Shan Bang som en gudom.
