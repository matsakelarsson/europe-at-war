# Svenska översättningar av katalogtexten (våg 14); stegtexterna kommer senare.
Bay of Pigs Invasion: Invasionen i Grisbukten
? "The failed invasion of Cuba by Brigade 2506, about 1,400 Cuban exiles recruited, trained and armed by the CIA, in April 1961. President Eisenhower approved a plan to overthrow Fidel Castro in March 1960, as Castro’s government nationalised American property and drew close to the Soviet Union, and the brigade trained in Guatemala. President Kennedy, in office since January 1961, approved a revised plan that moved the landing to the remote Bay of Pigs in the Zapata swamp on Cuba’s south coast and kept the American role hidden. On 15 April 1961 exile pilots in B-26 bombers painted in Cuban markings struck three Cuban airfields but left part of Castro’s small air force intact, and the cover story fell apart within hours; Kennedy cancelled a second strike. The brigade landed at Playa Larga and Playa Girón before dawn on 17 April. Cuban aircraft sank two of its supply ships, and Cuban troops and militias, led by Castro himself, attacked down the causeways through the swamp. Short of ammunition and without the American air cover they had expected, the invaders were defeated by the evening of 19 April: 114 were killed and 1,202 captured, while Cuba gave its own losses as 176 dead, with many more militiamen killed or wounded by other estimates. The victory strengthened Castro, who had declared the revolution socialist on 16 April, and pushed Cuba closer to the Soviet Union; the prisoners were ransomed in December 1962 for $53 million in food and medicine, and the United States turned to covert sabotage against Cuba in Operation Mongoose."
: "Den misslyckade invasionen av Kuba i april 1961, utförd av Brigad 2506, omkring 1 400 exilkubaner som hade rekryterats, utbildats och beväpnats av CIA. President Eisenhower godkände i mars 1960 en plan för att störta Fidel Castro, när Castros regering förstatligade amerikansk egendom och närmade sig Sovjetunionen, och brigaden utbildades i Guatemala. President Kennedy, som hade tillträtt i januari 1961, godkände en omarbetad plan som flyttade landstigningen till den avlägsna Grisbukten i Zapataträsket på Kubas sydkust och höll den amerikanska rollen dold. Den 15 april 1961 anföll exilpiloter i B-26-bombplan målade med kubanska beteckningar tre kubanska flygfält men lämnade en del av Castros lilla flygvapen intakt, och täckhistorien föll samman inom några timmar; Kennedy ställde in ett andra anfall. Brigaden landsteg vid Playa Larga och Playa Girón före gryningen den 17 april. Kubanska flygplan sänkte två av dess försörjningsfartyg, och kubanska trupper och miliser, ledda av Castro själv, anföll längs vägbankarna genom träsket. Invasionsstyrkan, som hade ont om ammunition och saknade det amerikanska luftskydd den hade väntat sig, var besegrad på kvällen den 19 april: 114 man hade dödats och 1 202 tillfångatagits, medan Kuba uppgav sina egna förluster till 176 döda, och enligt andra uppskattningar dödades eller sårades betydligt fler milismän. Segern stärkte Castro, som hade förklarat revolutionen socialistisk den 16 april, och drev Kuba närmare Sovjetunionen; fångarna friköptes i december 1962 mot livsmedel och medicin för 53 miljoner dollar, och USA övergick till hemliga sabotage mot Kuba inom ramen för Operation Mongoose."
