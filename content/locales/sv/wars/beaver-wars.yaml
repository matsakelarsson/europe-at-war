# Svenska översättningar av katalogtexten (våg 14); stegtexterna kommer senare.
Beaver Wars (French and Iroquois Wars): Bäverkrigen (de fransk-irokesiska krigen)
? "Nearly a century of intermittent war around the St. Lawrence and the Great Lakes between the Haudenosaunee (Iroquois) Confederacy of the Mohawk, Oneida, Onondaga, Cayuga and Seneca, armed by Dutch and later English traders at Fort Orange (Albany), and New France with its allies, the Wendat (Huron), Algonquin, Innu and later the nations of the upper Great Lakes. It began when Samuel de Champlain joined his Native allies against the Mohawk at Lake Champlain in 1609. After epidemics in the 1630s halved the populations of the region, Haudenosaunee war parties blockaded the St. Lawrence and the Ottawa, and in 1648–1650 destroyed Wendake, the Wendat homeland on Georgian Bay; the Petun, the Neutral and the Erie were defeated and dispersed in turn, and thousands of captives were adopted into the Five Nations. New France, near collapse, was saved by royal troops who burned the Mohawk towns in 1666. War resumed in the 1680s over the western fur trade: the Haudenosaunee attacked the Illinois, Denonville burned the Seneca towns in 1687, and in 1689 Haudenosaunee warriors struck Lachine, near Montreal. French, Anishinaabe and Wyandot counter-attacks in the 1690s drove them back, and at the Great Peace of Montreal of 1701 the Haudenosaunee and some forty nations allied with France made peace. Historians explain the wars by the fur trade, by the mourning-war custom of taking captives to replace the dead, and by the Haudenosaunee aim of bringing other peoples under the Great Law of Peace."
: "Nästan ett sekel av återkommande krig kring Saint Lawrencefloden och Stora sjöarna mellan Haudenosauneeförbundet (irokesförbundet), som bestod av mohawk, oneida, onondaga, cayuga och seneca och beväpnades av nederländska och senare engelska handelsmän i Fort Orange (Albany), och Nya Frankrike med dess allierade: wendat (huroner), algonkiner, innu och senare folken vid de övre Stora sjöarna. Kriget började när Samuel de Champlain slöt upp på sina ursprungsamerikanska allierades sida mot mohawkerna vid Champlainsjön 1609. Sedan epidemier på 1630-talet hade halverat befolkningen i regionen spärrade krigarskaror från haudenosaunee Saint Lawrencefloden och Ottawafloden, och 1648–1650 förstörde de Wendake, wendatfolkets hemland vid Georgian Bay; petun, neutralerna och erie besegrades och skingrades i tur och ordning, och tusentals fångar adopterades in i de fem nationerna. Nya Frankrike, som stod nära sammanbrottet, räddades av kungliga trupper som brände mohawkernas byar 1666. Kriget blossade upp igen på 1680-talet om pälshandeln i väster: haudenosaunee anföll illinois, Denonville brände senecafolkets byar 1687, och 1689 slog krigare från haudenosaunee till mot Lachine nära Montréal. Franska, anishinaabeiska och wyandotiska motangrepp på 1690-talet drev dem tillbaka, och vid den stora freden i Montréal 1701 slöt haudenosaunee och ett fyrtiotal nationer som var allierade med Frankrike fred. Historiker förklarar krigen med pälshandeln, med sedvänjan att föra sorgekrig och ta fångar för att ersätta de döda och med haudenosauneefolkets strävan att föra andra folk in under den stora fredslagen."
