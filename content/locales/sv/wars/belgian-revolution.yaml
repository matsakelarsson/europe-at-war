Belgian Revolution: Belgiska revolutionen
The rising of the southern provinces of the United Kingdom of the Netherlands that created the Kingdom of Belgium. Street fighting drove the Dutch army out of Brussels in September 1830 and a provisional government declared independence; a Dutch invasion in August 1831 was halted by a French army, which also took the citadel of Antwerp in December 1832, and the Netherlands recognised Belgium by the Treaty of London of 1839.: Det uppror i Förenade kungariket Nederländernas södra provinser som skapade kungariket Belgien. Gatustrider drev ut den nederländska armén ur Bryssel i september 1830, och en provisorisk regering utropade självständighet; en nederländsk invasion i augusti 1831 hejdades av en fransk armé, som också intog citadellet i Antwerpen i december 1832, och Nederländerna erkände Belgien genom Londonfördraget 1839.
