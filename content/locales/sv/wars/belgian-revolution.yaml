The National Congress chose Leopold of Saxe-Coburg as king, and he took the oath on 21 July 1831, now Belgium’s national day. William I had not accepted the terms set in London, and on 2 August a Dutch army of about 50,000 under the Prince of Orange crossed the border near Poppel. The Belgians had about 24,000 regulars and militia, split between an Army of the Scheldt around Antwerp and an Army of the Meuse in Limburg. The Dutch beat them at Turnhout, at Houthalen and Hasselt, and on 12 August before Leuven.: Nationalkongressen valde Leopold av Sachsen-Coburg till kung, och han avlade eden den 21 juli 1831, i dag Belgiens nationaldag. Vilhelm I hade inte godtagit de villkor som fastställts i London, och den 2 augusti gick en nederländsk armé på omkring 50 000 man under prinsen av Oranien över gränsen nära Poppel. Belgarna hade omkring 24 000 man reguljära trupper och milis, fördelade på en Scheldearmé kring Antwerpen och en Maasarmé i Limburg. Nederländarna besegrade dem vid Turnhout, vid Houthalen och Hasselt och den 12 augusti framför Leuven.
Leopold had appealed to France, and on 9 August Marshal Étienne Gérard crossed the border with about 70,000 men. Rather than fight the French, the Dutch agreed to a ceasefire on 12 August and withdrew, keeping only the citadel of Antwerp. The powers then offered terms less favourable to Belgium, the Twenty-Four Articles, which Belgium accepted and William refused. In November 1832 British and French warships blockaded the Dutch coast and Gérard returned to besiege the citadel. His engineers under General François Haxo dug their trenches up to the walls and pounded the fort with heavy mortars until Chassé surrendered on 23 December.: Leopold hade vädjat till Frankrike, och den 9 augusti gick marskalk Étienne Gérard över gränsen med omkring 70 000 man. Hellre än att strida mot fransmännen gick nederländarna den 12 augusti med på vapenvila och drog sig tillbaka, och behöll bara citadellet i Antwerpen. Stormakterna erbjöd sedan villkor som var mindre förmånliga för Belgien, de tjugofyra artiklarna, som Belgien godtog och Vilhelm avvisade. I november 1832 blockerade brittiska och franska krigsfartyg den nederländska kusten, och Gérard återvände för att belägra citadellet. Hans ingenjörer under general François Haxo grävde sina löpgravar ända fram till murarna och bombarderade fortet med tunga mörsare tills Chassé kapitulerade den 23 december.
The Dutch still held the forts of Lillo and Liefkenshoek on the Scheldt below Antwerp, and an agreement in May 1833 left matters as they stood. In 1838 William at last accepted the Twenty-Four Articles. By the Treaty of London of 19 April 1839 the Netherlands recognised Belgium, whose independence and perpetual neutrality the great powers guaranteed, the guarantee Germany broke in 1914. Belgium gave up eastern Limburg, with Maastricht and Venlo, to the Netherlands, and the eastern, German-speaking part of Luxembourg, which remained a grand duchy under the Dutch king.: Nederländarna höll fortfarande forten Lillo och Liefkenshoek vid Schelde nedanför Antwerpen, och en överenskommelse i maj 1833 lämnade läget oförändrat. År 1838 godtog Vilhelm till slut de tjugofyra artiklarna. Genom Londonfördraget den 19 april 1839 erkände Nederländerna Belgien, vars självständighet och eviga neutralitet stormakterna garanterade – den garanti som Tyskland bröt 1914. Belgien avstod östra Limburg, med Maastricht och Venlo, till Nederländerna, och den östra, tyskspråkiga delen av Luxemburg, som förblev ett storhertigdöme under den nederländske kungen.
