The Ten Days’ Campaign and the siege of Antwerp: Tiodagarsfälttåget och belägringen av Antwerpen
August 1831 – December 1832: augusti 1831 – december 1832
The United Kingdom of the Netherlands, created in 1815, joined the former Dutch Republic with the former Austrian Netherlands and the Prince-Bishopric of Liège. Its king, William I of Orange-Nassau, was also Grand Duke of Luxembourg. Its army and government are called “Dutch” here, as in most accounts.: Förenade kungariket Nederländerna, som skapades 1815, förenade den tidigare Nederländska republiken med de tidigare Österrikiska Nederländerna och furstbiskopsdömet Liège. Dess kung, Vilhelm I av Oranien-Nassau, var också storhertig av Luxemburg. Dess armé och regering kallas här ”nederländska”, som i de flesta skildringar.
The fighting ended in 1832, but the Netherlands accepted Belgian independence only by the Treaty of London of 19 April 1839, which also divided Limburg and Luxembourg. Until then Belgium held most of both.: Striderna upphörde 1832, men Nederländerna godtog Belgiens självständighet först genom Londonfördraget den 19 april 1839, som också delade Limburg och Luxemburg. Fram till dess höll Belgien större delen av båda.
