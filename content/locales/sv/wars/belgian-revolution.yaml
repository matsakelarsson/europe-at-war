The south of the United Kingdom of the Netherlands had more people than the north but no more seats in the States General, most officials and officers were Dutch, Catholics resented King William I’s control of schools, and French-speakers his promotion of Dutch. Catholics and liberals made common cause against him. Weeks after the July Revolution in Paris, on 25 August 1830, the audience at Brussels’ opera house, the Monnaie, poured into the streets after a performance of Auber’s La Muette de Portici, and rioting spread to Liège and other towns.: Södra delen av Förenade kungariket Nederländerna hade fler invånare än den norra men inte fler platser i generalstaterna, de flesta ämbetsmän och officerare var nederländare, katolikerna var förbittrade över kung Vilhelm I:s kontroll över skolorna och de fransktalande över hans främjande av nederländskan. Katoliker och liberaler gjorde gemensam sak mot honom. Några veckor efter julirevolutionen i Paris, den 25 augusti 1830, strömmade publiken på Bryssels operahus, La Monnaie, ut på gatorna efter en föreställning av Aubers La Muette de Portici, och upploppen spred sig till Liège och andra städer.
The king’s heir, the Prince of Orange, came to Brussels and accepted that north and south should be governed separately, but his father chose force. From 23 to 26 September several thousand troops under his younger son, Prince Frederick, held the park in the city centre against volunteers firing from barricades and houses, then withdrew. Several hundred insurgents were killed; they lie under today’s Place des Martyrs. A provisional government declared independence on 4 October.: Kungens arvinge, prinsen av Oranien, kom till Bryssel och godtog att norr och söder skulle styras var för sig, men hans far valde våld. Från den 23 till den 26 september höll flera tusen soldater under hans yngre son, prins Fredrik, parken i stadens centrum mot frivilliga som sköt från barrikader och hus, och drog sig sedan tillbaka. Flera hundra upprorsmän dödades; de vilar under dagens Place des Martyrs. En provisorisk regering utropade självständighet den 4 oktober.
The Dutch army fell back to the citadel of Antwerp and the fortress of Maastricht. On 27 October, as Belgian volunteers entered Antwerp, General David Chassé’s guns in the citadel bombarded the city, setting warehouses and houses on fire. A National Congress, elected in November, declared Belgium independent and barred the House of Orange from its throne, and on 20 December a conference of the great powers in London accepted that the United Kingdom of the Netherlands was dissolved.: Den nederländska armén föll tillbaka till citadellet i Antwerpen och fästningen Maastricht. Den 27 oktober, när belgiska frivilliga ryckte in i Antwerpen, bombarderade general David Chassés kanoner i citadellet staden och satte magasin och hus i brand. En nationalkongress, vald i november, förklarade Belgien självständigt och uteslöt huset Oranien från tronen, och den 20 december godtog en konferens mellan stormakterna i London att Förenade kungariket Nederländerna var upplöst.
