23–26 September 1830: 23–26 september 1830
Prince Frederick’s troops broke into the city and held the park beside the royal palace for four days under fire, then withdrew in the night of 26–27 September.: Prins Fredriks trupper bröt sig in i staden och höll parken vid kungliga slottet under beskjutning i fyra dagar, och drog sig sedan tillbaka natten mellan den 26 och 27 september.
Antwerp citadel: Citadellet i Antwerpen
27 October 1830: 27 oktober 1830
Chassé’s garrison shelled the city when Belgian volunteers entered it, burning warehouses and houses. The citadel stayed in Dutch hands for two more years.: Chassés garnison besköt staden när belgiska frivilliga ryckte in, och magasin och hus brann. Citadellet förblev i nederländska händer i ytterligare två år.
Maastricht: Maastricht
The Dutch garrison under General Bernard Dibbets held the fortress throughout the revolution, which is why the Netherlands kept eastern Limburg.: Den nederländska garnisonen under general Bernard Dibbets höll fästningen under hela revolutionen, vilket är skälet till att Nederländerna behöll östra Limburg.
