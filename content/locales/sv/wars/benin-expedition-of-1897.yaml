Benin Expedition of 1897: Beninexpeditionen 1897
? The British conquest of the Kingdom of Benin, in what is now southern Nigeria. Benin, ruled by its obas from Benin City for some six centuries, controlled the trade of its hinterland and had kept its independence while Britain built up the Niger Coast Protectorate around it. Britain claimed that a treaty of 1892 had opened Benin to free trade; Oba Ovonramwen went on levying duties and in 1896 halted the palm-oil trade with the Itsekiri middlemen. In late December 1896 the acting consul-general, James Phillips, set out for Benin City with a party of about 250, without waiting for permission from London and against the oba’s request to wait until a festival was over. On 4 January 1897 Benin soldiers attacked the party near Ugbine and killed most of its members. A British force of about 1,200 sailors, marines and protectorate soldiers under Rear-Admiral Harry Rawson invaded in February and took Benin City on 18 February after ten days of fighting; much of the city burned, and the troops looted the palace and shrines of thousands of brass, ivory and wooden works of art, the Benin Bronzes. Ovonramwen surrendered in August and was exiled to Calabar, where he died in 1914, and Benin was annexed to the protectorate. The return of the Bronzes, scattered among museums in Europe and North America, has become one of the best-known questions of restitution of cultural property.
: Den brittiska erövringen av kungariket Benin, i det som i dag är södra Nigeria. Benin, som i omkring sex århundraden hade styrts av sina oba från Benin City, kontrollerade handeln i sitt inland och hade bevarat sin självständighet medan Storbritannien byggde upp Nigerkustprotektoratet runt omkring det. Storbritannien hävdade att ett fördrag från 1892 hade öppnat Benin för fri handel; oba Ovonramwen fortsatte att ta ut tullar och stoppade 1896 palmoljehandeln med itsekiriska mellanhänder. I slutet av december 1896 gav sig den tillförordnade generalkonsuln James Phillips i väg mot Benin City med ett följe på omkring 250 personer, utan att invänta tillstånd från London och mot obans begäran att han skulle vänta tills en festival var över. Den 4 januari 1897 anföll beninska soldater följet nära Ugbine och dödade de flesta av dess medlemmar. En brittisk styrka på omkring 1 200 sjömän, marinsoldater och protektoratsoldater under konteramiral Harry Rawson invaderade i februari och intog Benin City den 18 februari efter tio dagars strider; en stor del av staden brann, och trupperna plundrade palatset och helgedomarna på tusentals konstverk i mässing, elfenben och trä, Beninbronserna. Ovonramwen kapitulerade i augusti och förvisades till Calabar, där han dog 1914, och Benin annekterades till protektoratet. Återlämnandet av bronserna, som är spridda bland museer i Europa och Nordamerika, har blivit en av de mest kända frågorna om restitution av kulturegendom.
