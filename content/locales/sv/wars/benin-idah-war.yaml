# Svenska översättningar av katalogtexten (våg 13); stegtexterna kommer senare.
Benin–Idah war: Kriget mellan Benin och Idah
? "A war between the Kingdom of Benin under Oba Esigie and the Igala kingdom of Idah, on the lower Niger, in 1515–1516, known from Benin tradition and a Portuguese letter. Esigie had come to power after a civil war against his brother Arhuaran, who held the town of Udo, and one account says that Benin nobles who opposed the oba’s dealings with the Portuguese conspired with the Attah (king) of Idah. The Igala attacked Benin and were driven back. Tradition gives a great part to Esigie’s mother Idia, whom he made the first Iyoba (queen mother): she is said to have raised troops and gone to war at his side, and a servant of hers is credited with killing the Igala general. Portuguese missionaries went with the Benin army: on 20 October 1516 the priest Duarte Pires wrote to King Manuel I that they had stayed with the oba “during a whole year of war”, that the oba hoped to finish the war that summer, and that he had given his son and some of his greatest officials to be made Christians. Whether Portuguese soldiers or guns took part is disputed: some accounts credit Portuguese firepower with Benin’s victory, others say Benin won without it. Benin was then selling captives to the Portuguese, who carried many of them to Elmina on the Gold Coast to buy gold."
: "Ett krig 1515–1516 mellan kungariket Benin under oba Esigie och igalariket Idah vid nedre Niger, känt från traditionen i Benin och från ett portugisiskt brev. Esigie hade kommit till makten efter ett inbördeskrig mot sin bror Arhuaran, som höll staden Udo, och enligt en version konspirerade beninska stormän som motsatte sig obans förbindelser med portugiserna med attah (kungen) av Idah. Igala anföll Benin och drevs tillbaka. Traditionen ger Esigies mor Idia, som han gjorde till den första iyoba (drottningmodern), en stor roll: hon sägs ha rest trupper och dragit i krig vid hans sida, och en av hennes tjänare tillskrivs dödandet av igalas general. Portugisiska missionärer följde med Benins armé: den 20 oktober 1516 skrev prästen Duarte Pires till kung Manuel I att de hade stannat hos oban ”under ett helt års krig”, att oban hoppades få slut på kriget samma sommar och att han hade överlämnat sin son och några av sina främsta ämbetsmän för att de skulle bli kristna. Huruvida portugisiska soldater eller vapen deltog är omstritt: vissa framställningar tillskriver Benins seger den portugisiska eldkraften, andra hävdar att Benin segrade utan den. Benin sålde vid denna tid fångar till portugiserna, som förde många av dem till Elmina på Guldkusten för att köpa guld."
