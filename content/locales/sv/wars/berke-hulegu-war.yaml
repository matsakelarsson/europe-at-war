Berke–Hülegü war: Kriget mellan Berke och Hülegü
The first open war between two khanates of the Mongol Empire, fought in the eastern Caucasus between Berke, khan of the Golden Horde, and his cousin Hülegü, founder of the Ilkhanate in Iran. Berke, a convert to Islam, resented the sack of Baghdad, the deaths of Jochid princes in Hülegü’s service and Hülegü’s seizure of Azerbaijan and its pastures, which the Jochids claimed; the two also backed rival candidates in the succession war for the title of Great Khan. In 1262 Berke’s general Nogai crossed the Derbent pass into Shirvan. Hülegü drove him back and took Derbent, but his army was routed on the Terek in January 1263, many drowning when the river ice broke. After Hülegü’s death in 1265 Nogai invaded again and was beaten on the Aksu; Berke died while trying to cross the Kura in 1266. The Derbent–Kura frontier between the two khanates remained a war zone for decades, and Berke’s alliance with the Mamluks of Egypt lasted.: Det första öppna kriget mellan två khanat inom Mongolriket, utkämpat i östra Kaukasus mellan Berke, khan över Gyllene horden, och hans kusin Hülegü, grundaren av Ilkhanatet i Iran. Berke, som hade gått över till islam, harmades över plundringen av Bagdad, över att jochidiska prinsar hade dött i Hülegüs tjänst och över att Hülegü hade bemäktigat sig Azerbajdzjan och dess betesmarker, som jochiderna gjorde anspråk på; de båda stödde också rivaliserande kandidater i tronföljdskriget om titeln storkhan. År 1262 gick Berkes general Nogaj över Derbentpasset in i Shirvan. Hülegü drev tillbaka honom och intog Derbent, men hans armé slogs på flykten vid Terek i januari 1263, och många drunknade när isen på floden brast. Efter Hülegüs död 1265 föll Nogaj in på nytt och besegrades vid Aksu; Berke dog 1266 när han försökte ta sig över Kura. Gränsen mellan Derbent och Kura förblev i årtionden ett krigsområde mellan de båda khanaten, och Berkes förbund med mamlukerna i Egypten bestod.
