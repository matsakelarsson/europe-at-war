Bhutan War: Bhutankriget
A war between British India and Bhutan in 1864–1865, also called the Duar War or the Anglo-Bhutan War. It was fought over the Duars, the fertile strip of foothills and plain below the Bhutanese mountains, after years of disputes over Bhutanese raids into Cooch Behar and Sikkim, the humiliation of a British envoy, Ashley Eden, at Punakha in 1864 and British interest in the land for tea. British columns took the forts along the foothills in the winter of 1864–1865; the Bhutanese retook Dewangiri, which the British then won back. By the Treaty of Sinchula of 11 November 1865 Bhutan gave up the Bengal and Assam Duars and the hills east of the Teesta around Kalimpong, about a fifth of its territory, for an annual payment of 50,000 rupees.: Ett krig mellan Brittiska Indien och Bhutan 1864–1865, även kallat Duarkriget eller det anglo-bhutanesiska kriget. Det utkämpades om Duars, den bördiga remsan av förberg och slättland nedanför de bhutanesiska bergen, efter flera års tvister om bhutanesiska räder in i Cooch Behar och Sikkim, förödmjukelsen av ett brittiskt sändebud, Ashley Eden, i Punakha 1864 och brittiskt intresse för marken som teodlingsland. Brittiska kolonner intog fästena längs förbergen vintern 1864–1865; bhutaneserna återtog Dewangiri, som britterna sedan vann tillbaka. Genom fördraget i Sinchula den 11 november 1865 avstod Bhutan Bengal- och Assam-Duars och bergen öster om Teesta kring Kalimpong, omkring en femtedel av sitt territorium, mot en årlig ersättning på 50 000 rupier.
