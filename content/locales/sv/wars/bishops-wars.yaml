Bishops’ Wars: Biskopskrigen
Two short wars between Charles I and the Scottish Covenanters, who had rejected his new prayer book in 1637, signed the National Covenant in 1638 and abolished the bishops of the Church of Scotland. In 1639 the two armies faced each other near Berwick without a battle and agreed the Pacification of Berwick on 18 June. After the Short Parliament refused him money, Charles tried again in 1640, but a Covenanter army under Alexander Leslie crossed the Tweed, routed the King’s troops at Newburn on 28 August and occupied Newcastle and the north-east. By the Treaty of Ripon of 26 October Charles had to pay the Scottish army £850 a day while it stayed, which forced him to summon the Long Parliament; the Treaty of London ended the war in August 1641. The wars opened the Wars of the Three Kingdoms.: Två korta krig mellan Karl I och de skotska covenanterna, som 1637 hade förkastat hans nya bönbok, 1638 undertecknat National Covenant och avskaffat biskoparna i Skotska kyrkan. År 1639 stod de två arméerna mot varandra nära Berwick utan att någon strid utkämpades och enades om pacifikationen i Berwick den 18 juni. Sedan Korta parlamentet vägrat honom pengar försökte Karl igen 1640, men en covenanterarmé under Alexander Leslie gick över Tweed, slog kungens trupper på flykten vid Newburn den 28 augusti och besatte Newcastle och nordöstra England. Genom fördraget i Ripon den 26 oktober måste Karl betala den skotska armén 850 pund om dagen så länge den stannade, vilket tvingade honom att sammankalla Långa parlamentet; Londonfördraget avslutade kriget i augusti 1641. Krigen inledde de tre kungarikenas krig.
