# Svenska översättningar av katalogtexten (våg 12); stegtexterna kommer senare.
Bizerte crisis: Bizertekrisen
? A short and bloody clash between Tunisia and France over the naval base of Bizerte, which France had kept when Tunisia became independent in 1956. After the French bombing of Sakiet Sidi Youssef in 1958 France gave up its other bases in Tunisia, but it held on to Bizerte, its great harbour on the Strait of Sicily, while the war in neighbouring Algeria went on. In July 1961, angered by work to lengthen the runway at the base and by France’s refusal to set a date for leaving, President Habib Bourguiba demanded a timetable for withdrawal, and on 19 July Tunisian troops and thousands of volunteers, many of them barely armed, blockaded the base. France flew in paratroopers under Vice-Admiral Maurice Amman; French aircraft, artillery and tanks broke the roadblocks, and on 21–23 July French forces fought their way into the town of Bizerte and took it. The UN Security Council called for a ceasefire on 22 July, and a special session of the General Assembly met on the crisis in August. Tunisia gave its losses as 630 killed and 1,555 wounded, many of them civilians and young volunteers; about 24 French soldiers died. Tunisia broke off relations with France for a time, and the last French forces left Bizerte on 15 October 1963, after the end of the Algerian War, a day Tunisia keeps as Evacuation Day.
: En kort och blodig sammandrabbning mellan Tunisien och Frankrike om flottbasen i Bizerte, som Frankrike hade behållit när Tunisien blev självständigt 1956. Efter den franska bombningen av Sakiet Sidi Youssef 1958 lämnade Frankrike sina övriga baser i Tunisien, men höll fast vid Bizerte, sin stora hamn vid Siciliensundet, medan kriget i grannlandet Algeriet pågick. I juli 1961, upprörd över arbeten för att förlänga startbanan vid basen och över Frankrikes vägran att ange ett datum för avflyttningen, krävde president Habib Bourguiba en tidsplan för tillbakadragandet, och den 19 juli blockerade tunisiska trupper och tusentals frivilliga, många av dem knappt beväpnade, basen. Frankrike flög in fallskärmsjägare under viceamiral Maurice Amman; franskt flyg, artilleri och stridsvagnar bröt igenom vägspärrarna, och den 21–23 juli kämpade sig franska styrkor in i staden Bizerte och intog den. FN:s säkerhetsråd uppmanade till vapenvila den 22 juli, och generalförsamlingen samlades till en extra session om krisen i augusti. Tunisien uppgav sina förluster till 630 döda och 1 555 sårade, många av dem civila och unga frivilliga; omkring 24 franska soldater dog. Tunisien bröt för en tid förbindelserna med Frankrike, och de sista franska styrkorna lämnade Bizerte den 15 oktober 1963, efter Algerietkrigets slut, en dag som Tunisien högtidlighåller som evakueringsdagen.
