# Svenska översättningar av katalogtexten (våg 14); stegtexterna kommer senare.
Black Hawk War: Black Hawk-kriget
? A war of 1832 between the United States and a band of about 1,100 Sauk, Meskwaki and Kickapoo people led by the Sauk war leader Black Hawk (Makataimeshekiakiak). Black Hawk’s followers, whom the Americans called the British Band, rejected a treaty of 1804 by which a few Sauk and Meskwaki men had ceded their lands east of the Mississippi, including the great Sauk town of Saukenuk on the Rock River. In April 1832 they crossed back into Illinois, hoping for help from the Ho-Chunk and the British. Illinois militia attacked them, and after routing the militia at Stillman’s Run on 14 May the band fled north into what is now Wisconsin, pursued by regulars and militia under General Henry Atkinson, while warriors raided farms and forts. After the rear guard held the pursuers at Wisconsin Heights on 21 July, the band was caught trying to recross the Mississippi at the mouth of the Bad Axe River on 1–2 August, where soldiers, militia and an armed steamboat killed between about 150 and 260 people or more, many of them women and children. About 77 Americans and between 450 and 600 of the band died in the war. Black Hawk surrendered on 27 August, and in September the Sauk, Meskwaki and Ho-Chunk were made to cede more land.
: Ett krig 1832 mellan USA och en grupp på omkring 1 100 personer ur folken sauk, meskwaki och kickapoo under saukernas krigsledare Black Hawk (Makataimeshekiakiak). Black Hawks anhängare, som amerikanerna kallade British Band, förkastade ett fördrag från 1804 genom vilket några få män ur sauk och meskwaki hade avträtt sina landområden öster om Mississippi, däribland den stora saukbyn Saukenuk vid Rock River. I april 1832 gick de tillbaka över floden till Illinois i hopp om hjälp från ho-chunk och britterna. Milis från Illinois anföll dem, och sedan gruppen hade slagit milisen på flykten vid Stillman’s Run den 14 maj flydde den norrut in i det som i dag är Wisconsin, förföljd av reguljära trupper och milis under general Henry Atkinson, medan krigare plundrade gårdar och fort. Sedan eftertruppen hade hållit förföljarna stången vid Wisconsin Heights den 21 juli hanns gruppen upp när den försökte ta sig tillbaka över Mississippi vid Bad Axe-flodens mynning den 1–2 augusti, där soldater, milis och en beväpnad ångbåt dödade mellan omkring 150 och 260 människor eller fler, många av dem kvinnor och barn. Omkring 77 amerikaner och mellan 450 och 600 ur gruppen dog i kriget. Black Hawk gav upp den 27 augusti, och i september tvingades sauk, meskwaki och ho-chunk att avträda mer land.
