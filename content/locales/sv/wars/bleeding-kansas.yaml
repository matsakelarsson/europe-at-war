# Svenska översättningar av katalogtexten (våg 14); stegtexterna kommer senare.
Bleeding Kansas: Bleeding Kansas
? "The armed struggle over whether Kansas Territory would enter the Union as a slave state or a free state. The Kansas–Nebraska Act of 1854 repealed the Missouri Compromise line and left the question to the territory’s settlers (“popular sovereignty”), and both sides rushed in. Thousands of Missourians crossed the border to vote in the territorial elections of 1854 and 1855, and the proslavery legislature they elected adopted Missouri’s slave code; antislavery settlers, many sent by the New England Emigrant Aid Company, set up a rival Free-State government at Topeka. Rival governments, constitutions and militias led to raids, ambushes and killings, above all in 1856: the sack of Lawrence, John Brown’s killing of five proslavery men at Pottawatomie Creek, and the fights at Black Jack and Osawatomie. Federal troops and a new governor restored a fragile peace in late 1856, Kansans rejected the proslavery Lecompton Constitution in 1858, and Kansas was admitted as a free state on 29 January 1861. About 56 people were killed in political violence, and the struggle split the Democratic Party and helped bring on the Civil War."
: "Den väpnade kampen om huruvida Kansasterritoriet skulle upptas i unionen som slavstat eller fri stat. Kansas–Nebraska-lagen 1854 upphävde Missourikompromissens gränslinje och överlät frågan åt territoriets nybyggare (”folksuveränitet”), och båda sidor strömmade till. Tusentals invånare i Missouri gick över gränsen för att rösta i territorialvalen 1854 och 1855, och den slaverivänliga lagstiftande församling som de valde antog Missouris slavlagar; nybyggare som motsatte sig slaveriet, av vilka många hade sänts av New England Emigrant Aid Company, upprättade en rivaliserande fristatsregering i Topeka. Rivaliserande regeringar, författningar och miliser ledde till räder, bakhåll och dödande, framför allt 1856: plundringen av Lawrence, John Browns dödande av fem slaverivänliga män vid Pottawatomie Creek och striderna vid Black Jack och Osawatomie. Federala trupper och en ny guvernör återställde en bräcklig fred i slutet av 1856, invånarna i Kansas förkastade den slaverivänliga Lecomptonförfattningen 1858, och Kansas upptogs som fri stat den 29 januari 1861. Omkring 56 människor dödades i politiskt våld, och kampen splittrade Demokratiska partiet och bidrog till att utlösa inbördeskriget."
