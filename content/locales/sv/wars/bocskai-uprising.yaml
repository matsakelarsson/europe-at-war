By 1604 the long war had ruined much of Hungary, and Rudolf II’s government was using treason trials to seize the estates of rich nobles, while in Upper Hungary churches were taken from the Protestants; in January 1604 the cathedral of Kassa was handed to the Catholics. In the autumn the imperial commander Giovanni Giacomo Barbiano di Belgioioso moved against István Bocskai, a magnate and former Transylvanian commander whose letters to exiles in Ottoman territory had been intercepted. Bocskai won over the hajdús, cattle drovers turned frontier soldiers, and on the night of 14–15 October they routed an imperial force near Álmosd and Diószeg. In November Kassa opened its gates to him.: År 1604 hade det långa kriget ödelagt stora delar av Ungern, och Rudolf II:s regering använde förräderiprocesser för att lägga beslag på rika adelsmäns gods, medan kyrkor i Övre Ungern togs från protestanterna; i januari 1604 överlämnades katedralen i Kassa till katolikerna. På hösten gick den kejserlige befälhavaren Giovanni Giacomo Barbiano di Belgioioso mot István Bocskai, en magnat och tidigare transsylvansk befälhavare vars brev till landsflyktingar på osmanskt område hade snappats upp. Bocskai vann över hajdukerna, boskapsdrivare som blivit gränssoldater, och natten mellan den 14 och 15 oktober slog de en kejserlig styrka på flykten nära Álmosd och Diószeg. I november öppnade Kassa sina portar för honom.
Giorgio Basta, brought back from the Ottoman front, beat the rebels at Osgyán but could not take Kassa, and in the spring of 1605 he withdrew to Pozsony. Bocskai’s forces overran Upper Hungary and the lands east of the Tisza, and hajdú raiders plundered Moravia, Lower Austria and Styria. The Transylvanian estates elected him prince in February 1605, and the Hungarian diet at Szerencs made him prince of Hungary in April. In November the grand vizier Lala Mehmed Pasha gave him a crown, which he accepted only as a gift. He chose to negotiate, and on 23 June 1606 the Peace of Vienna restored the Hungarian estates’ rights, allowed Protestants to worship freely and left Transylvania and several eastern counties to Bocskai.: Giorgio Basta, som hämtats tillbaka från den osmanska fronten, besegrade rebellerna vid Osgyán men kunde inte inta Kassa, och våren 1605 drog han sig tillbaka till Pozsony. Bocskais styrkor erövrade Övre Ungern och länderna öster om Tisza, och hajdukiska plundrare härjade Mähren, Niederösterreich och Steiermark. De transsylvanska ständerna valde honom till furste i februari 1605, och den ungerska riksdagen i Szerencs gjorde honom till furste av Ungern i april. I november gav storvesiren Lala Mehmed pasha honom en krona, som han tog emot endast som gåva. Han valde att förhandla, och den 23 juni 1606 återställde freden i Wien de ungerska ständernas rättigheter, gav protestanterna religionsfrihet och lämnade Transsylvanien och flera östliga komitat åt Bocskai.
