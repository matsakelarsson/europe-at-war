Dates are Gregorian. Hungarian historians call the revolt Bocskai’s War of Independence. The Long Turkish War, of which it was part, has its own entry.: Datumen följer den gregorianska kalendern. Ungerska historiker kallar revolten Bocskais frihetskrig. Långa turkiska kriget, som den var en del av, har en egen artikel.
Bocskai died in Kassa on 29 December 1606, a few weeks after the Peace of Zsitvatorok ended the Long Turkish War. His followers suspected poison and killed his chancellor, Mihály Káthay. Shortly before his death he settled thousands of hajdús as a privileged free community in the Hajdúság region.: Bocskai dog i Kassa den 29 december 1606, några veckor efter att freden i Zsitvatorok hade avslutat långa turkiska kriget. Hans anhängare misstänkte förgiftning och dödade hans kansler, Mihály Káthay. Kort före sin död lät han tusentals hajduker slå sig ned som en privilegierad fri gemenskap i regionen Hajdúság.
