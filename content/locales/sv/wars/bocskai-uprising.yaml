Bocskai Uprising: Bocskaiupproret
A revolt in Royal Hungary and Transylvania against Emperor Rudolf II, led by the Calvinist magnate István Bocskai during the Long Turkish War. Provoked by treason trials, confiscations and the seizure of Protestant churches, it was carried by the hajdús, free soldiers of the frontier, and backed by the Ottomans. Bocskai was elected prince of Transylvania and of Hungary, and the Peace of Vienna of 1606 guaranteed the estates’ rights and freedom of worship.: Ett uppror i Kungliga Ungern och Transsylvanien mot kejsar Rudolf II, lett av den kalvinistiske magnaten István Bocskai under det långa turkiska kriget. Det framkallades av förräderiprocesser, konfiskationer och beslag av protestantiska kyrkor, bars upp av hajdukerna, gränsens fria soldater, och stöddes av osmanerna. Bocskai valdes till furste av Transsylvanien och av Ungern, och freden i Wien 1606 garanterade ständernas rättigheter och religionsfrihet.
