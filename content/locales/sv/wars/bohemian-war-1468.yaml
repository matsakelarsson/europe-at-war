Dates are Julian, as usual for the period. The Catholic lords had formed the League of Zelená Hora against George in 1465. Matthias, George’s former son-in-law, had the backing of the pope and at first of Emperor Frederick III.: Datumen följer den julianska kalendern, som var brukligt för perioden. De katolska herrarna hade bildat Zelená Hora-förbundet mot Georg 1465. Mattias, Georgs tidigare svärson, hade stöd av påven och till en början av kejsar Fredrik III.
In February 1469 George’s army trapped Matthias near Vilémov, and the two kings met and agreed a truce, which Matthias soon broke. In 1474 Vladislaus and his father, Casimir IV of Poland, besieged Matthias in Breslau without success. Matthias died in 1490, Vladislaus succeeded him as king of Hungary, and the crown lands returned to Bohemia.: I februari 1469 stängde Georgs armé in Mattias nära Vilémov, och de båda kungarna möttes och kom överens om ett stillestånd, som Mattias snart bröt. År 1474 belägrade Vladislav och hans far, Kasimir IV av Polen, utan framgång Mattias i Breslau. Mattias dog 1490, Vladislav efterträdde honom som kung av Ungern, och kronländerna återgick till Böhmen.
