Bohemian War, 1468–1478: Böhmiska kriget 1468–1478
A war for the crown of Bohemia between King Matthias Corvinus of Hungary and the Utraquist King George of Poděbrady, whom Pope Paul II had condemned as a heretic and declared deposed in 1466. Matthias invaded Moravia in 1468 at the call of the Catholic lords and was elected king of Bohemia by them at Olomouc in 1469, but he never took Prague. When George died in 1471 the Bohemian estates chose the Polish prince Vladislaus II Jagiellon, and Poland joined the war. In the peace of Brno in 1478, confirmed at Olomouc in 1479, both kings kept the title; Vladislaus ruled Bohemia itself, and Matthias kept Moravia, Silesia and the two Lusatias, which Bohemia could buy back for 400,000 florins after his death.: Ett krig om Böhmens krona mellan kung Mattias Corvinus av Ungern och den utrakvistiske kungen Georg av Poděbrady, som påven Paulus II hade fördömt som kättare och förklarat avsatt 1466. Mattias invaderade Mähren 1468 på kallelse av de katolska herrarna och valdes av dem till kung av Böhmen i Olomouc 1469, men han intog aldrig Prag. När Georg dog 1471 valde de böhmiska ständerna den polske prinsen Vladislav II Jagello, och Polen gick med i kriget. Vid freden i Brno 1478, bekräftad i Olomouc 1479, behöll båda kungarna titeln; Vladislav styrde själva Böhmen, och Mattias behöll Mähren, Schlesien och de båda Lausitz, som Böhmen efter hans död kunde köpa tillbaka för 400 000 floriner.
