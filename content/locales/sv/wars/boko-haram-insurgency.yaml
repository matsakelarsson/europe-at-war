# Svenska översättningar av katalogtexten (våg 13); stegtexterna kommer senare.
Boko Haram insurgency: Boko Harams uppror
? "The jihadist insurgency centred on Borno State in north-eastern Nigeria and the Lake Chad basin. Boko Haram, a Salafi movement founded in Maiduguri by the preacher Mohammed Yusuf, rose in July 2009; the army crushed the rising and Yusuf was killed in police custody. Under Abubakar Shekau the movement turned to bombings, assassinations and mass killings, abducted 276 schoolgirls from Chibok in April 2014 and by early 2015 held a large part of Borno and neighbouring states, which it declared a caliphate. Shekau pledged allegiance to the Islamic State in March 2015. A counter-offensive by Nigeria, Chad, Cameroon and Niger, later the Multinational Joint Task Force, retook the towns in 2015, but in 2016 the movement split: the Islamic State West Africa Province (ISWAP) built a base on the shores and islands of Lake Chad and attacked army bases, while Shekau’s faction (JAS) kept the Sambisa forest and the Mandara mountains. ISWAP overran Sambisa in May 2021 and Shekau died. After a lull, attacks by both factions rose again from 2024; the United States joined Nigeria in air strikes from December 2025, and fighting continued in 2026 in Borno, around Lake Chad and in Cameroon’s Far North. By the UN’s estimates the war has killed tens of thousands of people directly and, with hunger and disease, about 350,000 by the end of 2020, and has displaced some two million people in north-eastern Nigeria."
: "Det jihadistiska upproret med centrum i delstaten Borno i nordöstra Nigeria och i Tchadsjöbäckenet. Boko Haram, en salafistisk rörelse som grundades i Maiduguri av predikanten Mohammed Yusuf, gjorde uppror i juli 2009; armén krossade resningen och Yusuf dödades i polisens förvar. Under Abubakar Shekau övergick rörelsen till bombattentat, mord och massmord, rövade bort 276 skolflickor från Chibok i april 2014 och höll i början av 2015 en stor del av Borno och grannstaterna, som den utropade till ett kalifat. Shekau svor trohet till Islamiska staten i mars 2015. En motoffensiv av Nigeria, Tchad, Kamerun och Niger, senare den multinationella gemensamma insatsstyrkan, återtog städerna 2015, men 2016 splittrades rörelsen: Islamiska statens Västafrikaprovins (ISWAP) byggde upp en bas på Tchadsjöns stränder och öar och anföll arméns baser, medan Shekaus fraktion (JAS) behöll Sambisaskogen och Mandarabergen. ISWAP överskred Sambisa i maj 2021 och Shekau dog. Efter ett lugnare skede ökade anfallen från båda fraktionerna igen från 2024; från december 2025 genomförde USA flyganfall tillsammans med Nigeria, och striderna fortsatte 2026 i Borno, kring Tchadsjön och i Kameruns region Extrême-Nord. Enligt FN:s uppskattningar har kriget direkt dödat tiotusentals människor och, med svält och sjukdomar inräknade, omkring 350 000 fram till slutet av 2020, och det har fördrivit omkring två miljoner människor i nordöstra Nigeria."
