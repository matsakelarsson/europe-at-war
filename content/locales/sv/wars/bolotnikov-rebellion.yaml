Bolotnikov rebellion: Bolotnikovs uppror
A rising in Russia’s Time of Troubles, led by Ivan Bolotnikov, a former slave and galley oarsman, in the name of the supposedly surviving Tsar Dmitry and against Tsar Vasily Shuisky. His army of Cossacks, runaway peasants, townsmen and provincial gentry marched from Putyvl and besieged Moscow in late 1606, but fell back after the gentry of Ryazan and Tula went over to the tsar, and surrendered at Tula in October 1607.: En resning under den stora oredan i Ryssland, ledd av Ivan Bolotnikov, en före detta träl och galärroddare, i den förment överlevande tsar Dmitrijs namn och mot tsar Vasilij Sjujskij. Hans här av kosacker, förrymda bönder, stadsbor och lantadel tågade från Putyvl och belägrade Moskva i slutet av 1606, men drog sig tillbaka sedan adeln från Rjazan och Tula gått över till tsaren, och kapitulerade i Tula i oktober 1607.
