Dates are Julian (Old Style). Putyvl, where the rising began, is in Ukraine today.: Datumen följer den julianska kalendern (gamla stilen). Putyvl, där resningen började, ligger i dag i Ukraina.
The rebels claimed to fight for Tsar Dmitry, said to have escaped when the first False Dmitry was killed in Moscow in May 1606. A second pretender, the self-styled Tsarevich Peter, joined them at Tula in 1607. Bolotnikov was later blinded and drowned at Kargopol.: Rebellerna sade sig strida för tsar Dmitrij, som påstods ha undkommit när den förste falske Dmitrij dödades i Moskva i maj 1606. En andra tronpretendent, den självutnämnde tsarevitj Pjotr, anslöt sig till dem i Tula 1607. Bolotnikov blev senare bländad och dränkt i Kargopol.
