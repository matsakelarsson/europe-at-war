# Svenska översättningar av katalogtexten (våg 12); stegtexterna kommer senare.
Bombardment of Algiers: Bombardemanget av Alger
? "The bombardment of Algiers on 27 August 1816 by a British and Dutch fleet under Admiral Lord Exmouth, to force the dey to free his European captives and give up taking Christians as slaves. After the Napoleonic Wars, Britain no longer needed the regencies’ goodwill, and pressure was growing in Europe to end the enslavement of Christian captives. In the spring of 1816 Exmouth won agreements from Tunis and Tripoli and a partial one from Algiers, but soon afterwards Algerian troops at Bône (Annaba) killed some 200 Corsican, Sicilian and Sardinian coral fishermen under British protection. Exmouth returned with five ships of the line, frigates, sloops and bomb vessels, joined at Gibraltar by a Dutch squadron of five frigates under Vice-Admiral Theodorus van Capellen. When an Algerian battery opened fire at about 3 p.m., the fleet, anchored close to the mole, silenced the harbour batteries and burned the Algerian ships before withdrawing out of range that night. The British lost 141 killed and 742 wounded, the Dutch 13 killed and 52 wounded; estimates of the Algerian dead, soldiers and civilians, range from 300 to 2,000. Dey Omar Agha accepted Exmouth’s terms, and a treaty was signed on 24 September: he freed 1,083 Christian captives at once, and over 3,000 in all, returned the ransom money he had taken earlier in the year, and renounced the enslavement of Christians. Algiers rebuilt its defences, the taking of captives did not wholly stop under later deys, and a British fleet returned under threat in 1824; the corsair war ended with the French conquest of Algiers in 1830."
: "Bombardemanget av Alger den 27 augusti 1816 av en brittisk-nederländsk flotta under amiral lord Exmouth, för att tvinga dejen att frige sina europeiska fångar och sluta ta kristna som slavar. Efter Napoleonkrigen behövde Storbritannien inte längre regentskapens välvilja, och i Europa växte trycket att göra slut på förslavandet av kristna fångar. Våren 1816 fick Exmouth till stånd överenskommelser med Tunis och Tripoli och en partiell överenskommelse med Alger, men kort därefter dödade algeriska trupper i Bône (Annaba) omkring 200 korsikanska, sicilianska och sardinska korallfiskare som stod under brittiskt beskydd. Exmouth återvände med fem linjeskepp, fregatter, slupar och bombfartyg, förstärkta vid Gibraltar av en nederländsk eskader på fem fregatter under viceamiral Theodorus van Capellen. När ett algeriskt batteri öppnade eld vid tretiden på eftermiddagen tystade flottan, som låg för ankar nära vågbrytaren, hamnbatterierna och brände de algeriska fartygen, innan den samma natt drog sig utom skotthåll. Britterna förlorade 141 döda och 742 sårade, nederländarna 13 döda och 52 sårade; uppskattningarna av antalet algeriska döda, soldater och civila, varierar mellan 300 och 2 000. Dejen Omar Agha godtog Exmouths villkor, och ett fördrag undertecknades den 24 september: han frigav genast 1 083 kristna fångar, och sammanlagt över 3 000, återlämnade de lösenpengar han hade tagit tidigare under året och avsade sig förslavandet av kristna. Alger byggde upp sitt försvar igen, fångtagandet upphörde inte helt under senare dejer, och 1824 återvände en brittisk flotta med nya hot; korsarkriget upphörde med den franska erövringen av Alger 1830."
