# Svenska översättningar av katalogtexten (våg 14); stegtexterna kommer senare.
Mexican Border War: Mexikanska gränskriget
? The armed clashes along and across the border between Mexico and the United States during the Mexican Revolution, from 1910 to 1919. The name is used in US unit and popular history; Mexican histories treat the same fighting as US involvement in Mexico’s civil war, and there was never a declared war. Battles between Mexican factions spilled over the line at Ciudad Juárez, Agua Prieta, Nogales and Naco, and the United States sent troops to the border from 1911. In 1915 raiders acting under the Plan of San Diego struck ranches and railways in the Lower Rio Grande Valley of Texas, and Texas Rangers, posses and some soldiers answered by killing hundreds, possibly thousands, of Mexicans and Mexican Americans, a time Tejanos remember as la matanza. After the United States recognised Venustiano Carranza’s government, Pancho Villa’s men killed American mining employees at Santa Isabel and on 9 March 1916 raided Columbus, New Mexico. General John J. Pershing led a punitive expedition of up to about 10,000 men into Chihuahua that never caught Villa and nearly led to war with Carranza’s government after the fight at Carrizal; more than 100,000 National Guardsmen were called to the border. Pershing withdrew in February 1917. The killings at Porvenir in 1918, the battle of Ambos Nogales in August 1918 and the US crossing to drive Villa from Ciudad Juárez in June 1919 were the last large clashes.
: De väpnade sammandrabbningarna längs och över gränsen mellan Mexiko och USA under mexikanska revolutionen, 1910–1919. Namnet används i amerikansk förbandshistoria och populärhistoria; mexikanska historieverk behandlar samma strider som USA:s inblandning i Mexikos inbördeskrig, och något krig förklarades aldrig. Strider mellan mexikanska fraktioner spred sig över gränslinjen vid Ciudad Juárez, Agua Prieta, Nogales och Naco, och USA sände trupper till gränsen från 1911. År 1915 slog angripare som handlade i enlighet med San Diego-planen till mot ranchar och järnvägar i nedre Rio Grande-dalen i Texas, och Texas Rangers, beväpnade uppbåd och en del soldater svarade med att döda hundratals, möjligen tusentals, mexikaner och mexikansk-amerikaner, en tid som tejanos minns som la matanza. Sedan USA hade erkänt Venustiano Carranzas regering dödade Pancho Villas män amerikanska gruvanställda vid Santa Isabel, och den 9 mars 1916 gjorde de en räd mot Columbus i New Mexico. General John J. Pershing ledde en straffexpedition på upp till omkring 10 000 man in i Chihuahua som aldrig fick tag på Villa och som nästan ledde till krig med Carranzas regering efter striden vid Carrizal; mer än 100 000 nationalgardister kallades till gränsen. Pershing drog sig tillbaka i februari 1917. Dödandet i Porvenir 1918, slaget vid Ambos Nogales i augusti 1918 och den amerikanska gränsövergången för att driva bort Villa från Ciudad Juárez i juni 1919 var de sista stora sammandrabbningarna.
