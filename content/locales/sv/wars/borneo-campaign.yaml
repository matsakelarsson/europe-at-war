# Svenska översättningar av katalogtexten (våg 11); stegtexterna kommer senare.
Borneo campaign (1945): Fälttåget på Borneo (1945)
? The Allied reconquest of parts of Borneo from Japan in the last months of the Second World War, codenamed Oboe and fought mainly by the Australian I Corps, with American naval and air support and Dutch colonial troops. The 26th Brigade landed on the oil island of Tarakan on 1 May 1945 and took it in weeks of hard fighting; the 9th Division landed on Labuan and around Brunei Bay on 10 June and took Brunei town, Beaufort and the oilfields of Seria and Miri; and the 7th Division landed at Balikpapan on 1 July in the largest amphibious operation carried out by Australian forces. Australian special forces parachuted into the interior, where Dayak and other peoples fought the Japanese with them. The campaign cost about 570 Australian dead and several thousand Japanese; its strategic value was disputed then and since, as the war ended before the oilfields could be used. Before the landings the Japanese had marched the Allied prisoners of Sandakan inland to Ranau in the Sandakan death marches of January–June 1945; of some 2,400 Australian and British prisoners, only six, all Australians who escaped, survived. Japanese forces in Borneo surrendered in September 1945.
: De allierades återerövring av delar av Borneo från Japan under andra världskrigets sista månader, med kodnamnet Oboe och utkämpad främst av den australiska 1:a armékåren med amerikanskt flott- och flygunderstöd och nederländska koloniala trupper. 26:e brigaden landsteg på oljeön Tarakan den 1 maj 1945 och intog den efter veckor av hårda strider; 9:e divisionen landsteg på Labuan och runt Bruneibukten den 10 juni och intog staden Brunei, Beaufort och oljefälten vid Seria och Miri; och 7:e divisionen landsteg vid Balikpapan den 1 juli i den största amfibieoperation som australiska styrkor har genomfört. Australiska specialförband hoppade fallskärm in i det inre av ön, där dajaker och andra folk stred mot japanerna tillsammans med dem. Fälttåget kostade omkring 570 australiska och flera tusen japanska döda; dess strategiska värde var omstritt redan då och har förblivit det, eftersom kriget tog slut innan oljefälten kunde utnyttjas. Före landstigningarna hade japanerna tvingat de allierade fångarna i Sandakan att marschera inåt landet till Ranau under dödsmarscherna från Sandakan i januari–juni 1945; av omkring 2 400 australiska och brittiska fångar överlevde bara sex, alla australier som hade rymt. De japanska styrkorna på Borneo kapitulerade i september 1945.
