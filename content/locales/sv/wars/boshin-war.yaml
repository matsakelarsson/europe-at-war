# Svenska översättningar av katalogtexten (våg 10); stegtexterna kommer senare.
Boshin War: Boshinkriget
? The civil war of 1868–1869 in which the new imperial government, led by men of the Satsuma and Chōshū domains, destroyed the power of the Tokugawa shogunate and its allies. The shogun Tokugawa Yoshinobu had handed back his powers to the emperor in November 1867, hoping to keep his lands and a leading place in a council of lords, but on 3 January 1868 Satsuma and its allies seized the palace in Kyoto and proclaimed the restoration of imperial rule. Yoshinobu’s march on Kyoto was beaten at Toba and Fushimi in late January, and when the imperial banner appeared on the battlefield he fled to Edo. The imperial army marched east, and in May 1868 Katsu Kaishū surrendered Edo Castle without a fight. In the north-east more than thirty domains formed the Ōuetsu Reppan Dōmei (the Northern Alliance) around Sendai and Aizu; they were defeated in a summer and autumn of hard fighting at Shirakawa, Nagaoka and Bonari Pass, and Aizu-Wakamatsu fell after a month’s siege on 6 November 1868. Enomoto Takeaki took most of the shogunate’s navy and some French officers to Ezo (Hokkaido), took Hakodate and Matsumae and set up the Republic of Ezo, which surrendered at Goryōkaku on 27 June 1869. The war, named after the year of the earth dragon (boshin) in which it began, cost about 8,200 lives; it gave the Meiji government control of the whole country and opened the way to the abolition of the domains in 1871.
: Inbördeskriget 1868–1869, där den nya kejserliga regeringen, ledd av män från domänerna Satsuma och Chōshū, bröt Tokugawashogunatets och dess allierades makt. Shogunen Tokugawa Yoshinobu hade i november 1867 lämnat tillbaka sina befogenheter till kejsaren i hopp om att få behålla sina länder och en ledande plats i ett råd av feodalherrar, men den 3 januari 1868 bemäktigade sig Satsuma och dess allierade palatset i Kyoto och utropade kejsarmaktens återupprättande. Yoshinobus marsch mot Kyoto slogs tillbaka vid Toba och Fushimi i slutet av januari, och när den kejserliga fanan visade sig på slagfältet flydde han till Edo. Den kejserliga armén tågade österut, och i maj 1868 överlämnade Katsu Kaishū Edoborgen utan strid. I nordost bildade mer än trettio domäner Ōuetsu Reppan Dōmei (Norra alliansen) kring Sendai och Aizu; de besegrades under en sommar och höst av hårda strider vid Shirakawa, Nagaoka och Bonaripasset, och Aizu-Wakamatsu föll efter en månads belägring den 6 november 1868. Enomoto Takeaki förde större delen av shogunatets flotta och några franska officerare till Ezo (Hokkaido), intog Hakodate och Matsumae och grundade Republiken Ezo, som kapitulerade vid Goryōkaku den 27 juni 1869. Kriget, som är uppkallat efter jorddrakens år (boshin), då det bröt ut, kostade omkring 8 200 människoliv; det gav Meijiregeringen kontroll över hela landet och banade väg för avskaffandet av domänerna 1871.
