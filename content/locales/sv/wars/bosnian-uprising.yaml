Gradaščević is remembered by Bosniaks as the “Dragon of Bosnia” (Zmaj od Bosne) and a champion of Bosnian autonomy; other historians see the rising mainly as a conservative revolt of the Muslim nobility against reform. Some sources date the end of the rising to 1833, when the last captaincies submitted.: Gradaščević minns av bosniakerna som ”Bosniens drake” (Zmaj od Bosne) och en förkämpe för bosniskt självstyre; andra historiker ser resningen främst som en konservativ revolt av den muslimska adeln mot reformerna. Vissa källor daterar resningens slut till 1833, då de sista kaptenskapen underkastade sig.
