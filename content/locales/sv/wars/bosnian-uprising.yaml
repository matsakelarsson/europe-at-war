Bosnian Uprising of 1831–1832: Bosniska upproret 1831–1832
A revolt of Bosnia’s Muslim notables, the ayans and hereditary captains, led by Husein Gradaščević, captain of Gradačac, against Sultan Mahmud II’s centralising reforms, which threatened their privileges, and against the Treaty of Adrianople’s promise of six districts to autonomous Serbia. The rebels drove out the governor, marched into Kosovo and beat the grand vizier near Štimlje on 18 July 1831, and an assembly in Sarajevo proclaimed Gradaščević vizier of Bosnia. Herzegovinian captains under Ali-paša Rizvanbegović and Smail-aga Čengić stayed loyal, and their troops helped an Ottoman army defeat the rebels at Stup outside Sarajevo on 4 June 1832. Gradaščević fled to Austria, and in 1833 Herzegovina became a separate province under Rizvanbegović.: Ett uppror av Bosniens muslimska notabiliteter, ajanerna och de ärftliga kaptenerna, under ledning av Husein Gradaščević, kapten av Gradačac, mot sultan Mahmud II:s centraliseringsreformer, som hotade deras privilegier, och mot freden i Adrianopels löfte om sex distrikt till det autonoma Serbien. Rebellerna fördrev guvernören, tågade in i Kosovo och slog storvesiren nära Štimlje den 18 juli 1831, och en församling i Sarajevo utropade Gradaščević till vesir av Bosnien. Hercegovinska kaptener under Ali-paša Rizvanbegović och Smail-aga Čengić förblev lojala, och deras trupper hjälpte en osmansk armé att besegra rebellerna vid Stup utanför Sarajevo den 4 juni 1832. Gradaščević flydde till Österrike, och 1833 blev Hercegovina en egen provins under Rizvanbegović.
