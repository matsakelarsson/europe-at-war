April 1992: april 1992
The JNA and local Serb forces defeated Croatian and Bosnian Croat troops for control of the plateau.: JNA och lokala serbiska styrkor besegrade kroatiska och bosnienkroatiska trupper i striden om högslätten.
From April 1992 JNA and Bosnian Serb forces, some 13,000 men at first, ringed Sarajevo from the surrounding hills and held suburbs such as Ilidža and part of Grbavica. An attack to cut the city in two failed on 2 May. The next day the JNA seized Izetbegović at the airport, and Bosnian fighters attacked the army column leaving the city in exchange for his release. The JNA’s Bosnian units became the Army of Republika Srpska under Ratko Mladić, and on 29 June the airport was handed to the UN for an airlift that lasted more than three years.: Från april 1992 omringade JNA och bosnienserbiska styrkor, till en början omkring 13 000 man, Sarajevo från de omgivande höjderna och höll förorter som Ilidža och en del av Grbavica. Ett anfall för att skära staden i två delar misslyckades den 2 maj. Dagen därpå grep JNA Izetbegović på flygplatsen, och bosniska kämpar anföll den armékolonn som lämnade staden i utbyte mot hans frigivning. JNA:s bosniska förband blev Republika Srpskas armé under Ratko Mladić, och den 29 juni överlämnades flygplatsen till FN för en luftbro som varade i mer än tre år.
The siege lasted 1,425 days, until 29 February 1996. On average 329 shells a day struck the city, which lived for long periods without water, power or gas; the National Library burned with most of its collection in August 1992. From mid-1993 a tunnel under the airport runway was the only land link to the outside. About 13,952 people were killed, 5,434 of them civilians. The ICTY convicted the Sarajevo commanders Stanislav Galić and Dragomir Milošević of terrorising civilians, and Karadžić and Mladić for the siege.: Belägringen varade i 1 425 dagar, till den 29 februari 1996. I genomsnitt träffades staden av 329 granater om dagen, och den levde långa perioder utan vatten, el och gas; Nationalbiblioteket brann med större delen av sina samlingar i augusti 1992. Från mitten av 1993 var en tunnel under flygplatsens landningsbana den enda landförbindelsen med omvärlden. Omkring 13 952 människor dödades, varav 5 434 civila. ICTY dömde befälhavarna vid Sarajevo, Stanislav Galić och Dragomir Milošević, för terror mot civilbefolkningen, och Karadžić och Mladić för belägringen.
