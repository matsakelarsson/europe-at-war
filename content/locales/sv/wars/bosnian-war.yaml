Peace talks opened on 1 November 1995 at an air base in Dayton, Ohio, led by the Americans Warren Christopher and Richard Holbrooke, with Izetbegović, Tuđman and Serbia’s Slobodan Milošević, who spoke for the Bosnian Serbs. The agreement was initialled on 21 November and signed in Paris on 14 December. Bosnia and Herzegovina remained one state, made up of the Federation with 51 per cent of its land and Republika Srpska with 49. Sarajevo was reunited under the Federation, Goražde was joined to it by a corridor, and the status of Brčko was left to arbitration.: Fredsförhandlingar inleddes den 1 november 1995 på en flygbas i Dayton i Ohio, ledda av amerikanerna Warren Christopher och Richard Holbrooke, med Izetbegović, Tuđman och Serbiens Slobodan Milošević, som förde bosnienserbernas talan. Avtalet paraferades den 21 november och undertecknades i Paris den 14 december. Bosnien och Hercegovina förblev en stat, bestående av federationen med 51 procent av landets yta och Republika Srpska med 49. Sarajevo återförenades under federationen, Goražde förbands med den genom en korridor, och frågan om Brčkos status hänsköts till skiljedom.
A NATO-led Implementation Force of some 60,000 troops replaced the UN from 20 December, and a High Representative oversaw civilian affairs. As the Serb-held suburbs of Sarajevo passed to the Federation, most of their Serb residents left, and the siege formally ended on 29 February 1996. Around 100,000 people had been killed, 2.2 million displaced and an estimated 12,000–50,000 women raped. Dayton ended the war but also entrenched the ethnic division it had produced.: En Natoledd genomförandestyrka på omkring 60 000 soldater ersatte FN från den 20 december, och en hög representant övervakade de civila frågorna. När de serbiskt kontrollerade förorterna till Sarajevo övergick till federationen lämnade de flesta av deras serbiska invånare dem, och belägringen upphörde formellt den 29 februari 1996. Omkring 100 000 människor hade dödats, 2,2 miljoner fördrivits och uppskattningsvis 12 000–50 000 kvinnor våldtagits. Dayton gjorde slut på kriget men cementerade också den etniska uppdelning som kriget hade skapat.
