In April and May 1992 Serb forces, with JNA support and paramilitaries from Serbia, took the Bosniak-majority towns along the Drina and in the north-west. Some 40,000 Bosniaks were driven from the Zvornik district; in Višegrad, in what the ICTY called one of the most ruthless campaigns of the war, Bosniaks were killed on the Drina bridge and burned alive in houses; in Foča women were held and raped in detention sites. By the end of the year Bosnian Serb forces held about 70 per cent of the country.: I april och maj 1992 intog serbiska styrkor, med stöd av JNA och paramilitärer från Serbien, städerna med bosniakisk majoritet längs Drina och i nordväst. Omkring 40 000 bosniaker fördrevs från Zvornikdistriktet; i Višegrad, under vad ICTY kallade ett av krigets mest hänsynslösa fälttåg, dödades bosniaker på Drinabron och brändes levande i hus; i Foča hölls kvinnor fångna och våldtogs på förvaringsplatser. Vid årets slut höll bosnienserbiska styrkor omkring 70 procent av landet.
Around Prijedor, taken on 30 April, Bosniaks and Croats were rounded up after the shelling of Kozarac in May. Some 6,000 men were held at Omarska, where hundreds died, and about 30,000 people passed through Trnopolje. When Western journalists reached the camps in August they were closed. Of some 4,868 people killed or missing in the municipality, 3,515 were Bosniak, 186 Croat and 78 Serb civilians. The ICTY sentenced twenty people for crimes in Prijedor; its first trial, of Duško Tadić, concerned them.: Kring Prijedor, som intogs den 30 april, samlades bosniaker och kroater ihop efter beskjutningen av Kozarac i maj. Omkring 6 000 män hölls i Omarska, där hundratals dog, och omkring 30 000 människor passerade genom Trnopolje. När västerländska journalister nådde lägren i augusti stängdes de. Av omkring 4 868 dödade eller försvunna i kommunen var 3 515 bosniakiska, 186 kroatiska och 78 serbiska civila. ICTY dömde tjugo personer för brott i Prijedor; dess första rättegång, mot Duško Tadić, gällde dessa brott.
Bosniak and Croat forces held prisoners too. At the Čelebići camp near Konjic some 400–700 Serbs, mostly civilians, were held in 1992 and as many as 30 died; three of its staff were convicted by the ICTY. At Tuzla on 15 May 1992 a withdrawing JNA column was ambushed and 52 soldiers, most of them Serbs, were killed.: Även bosniakiska och kroatiska styrkor höll fångar. I lägret Čelebići nära Konjic hölls 1992 omkring 400–700 serber, mestadels civila, och upp till 30 dog; tre av lägrets personal dömdes av ICTY. I Tuzla överfölls den 15 maj 1992 en JNA-kolonn på reträtt i ett bakhåll, och 52 soldater, de flesta serber, dödades.
