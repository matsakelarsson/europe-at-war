The Bosnian Serbs’ lands were cut in two in May 1992 when Croatian and Bosnian Croat forces took Derventa in Posavina. In Operation Corridor, from 24 June to 6 October, the VRS reopened the road from Banja Luka to eastern Bosnia and drove Croatian forces back across the Sava at Bosanski Brod, leaving them only the Orašje pocket. On 29 October Jajce, defended by an uneasy mix of HVO and Bosnian army troops, fell to the VRS; its Croats fled to Herzegovina and some 20,000 Bosniaks to Travnik and the Lašva valley.: Bosnienserbernas områden skars i två delar i maj 1992 när kroatiska och bosnienkroatiska styrkor intog Derventa i Posavina. I Operation Korridor, från den 24 juni till den 6 oktober, öppnade VRS åter vägen från Banja Luka till östra Bosnien och drev de kroatiska styrkorna tillbaka över Sava vid Bosanski Brod, så att de bara hade kvar fickan vid Orašje. Den 29 oktober föll Jajce, som försvarades av en orolig blandning av HVO och bosniska regeringstrupper, för VRS; stadens kroater flydde till Hercegovina och omkring 20 000 bosniaker till Travnik och Lašvadalen.
In the east, Bosniak forces under Naser Orić held a large area around Srebrenica and raided Serb villages; at Kravica on Orthodox Christmas, 7 January 1993, 43 Serbs were killed, 13 of them civilians. From March the VRS took back most of the enclave, and the UN Security Council declared Srebrenica a safe area on 16 April and Sarajevo, Tuzla, Žepa, Goražde and Bihać on 6 May. The Vance–Owen peace plan, which would have divided Bosnia into ten provinces, was rejected by the Bosnian Serbs that month.: I öster höll bosniakiska styrkor under Naser Orić ett stort område kring Srebrenica och gjorde räder mot serbiska byar; i Kravica dödades på den ortodoxa julen, den 7 januari 1993, 43 serber, varav 13 civila. Från mars återtog VRS större delen av enklaven, och FN:s säkerhetsråd förklarade Srebrenica som skyddad zon den 16 april och Sarajevo, Tuzla, Žepa, Goražde och Bihać den 6 maj. Vance–Owen-planen, som skulle ha delat Bosnien i tio provinser, förkastades av bosnienserberna samma månad.
