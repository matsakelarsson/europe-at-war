The Serbs handed the airport to UNPROFOR on 29 June 1992 after a UN ultimatum, opening it to humanitarian flights; hundreds of people died trying to run across the runway. From July 1993 a tunnel dug under it from Dobrinja to Butmir carried food, arms and people between the city and Mount Igman.: Serberna överlämnade flygplatsen till UNPROFOR den 29 juni 1992 efter ett ultimatum från FN, vilket öppnade den för humanitära flygningar; hundratals människor dog när de försökte springa över landningsbanan. Från juli 1993 transporterades mat, vapen och människor mellan staden och berget Igman genom en tunnel som grävts under banan från Dobrinja till Butmir.
