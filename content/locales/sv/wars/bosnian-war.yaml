Republika Srpska, Herzeg-Bosnia and Western Bosnia were recognised by no state. The map shows them as areas inside Bosnia and Herzegovina, whose independence the base map shows from 3 March 1992; the Federal Republic of Yugoslavia (Serbia and Montenegro) is shown from 27 April 1992. Front lines are approximate and moved often.: Republika Srpska, Herceg-Bosna och Västbosnien erkändes inte av någon stat. Kartan visar dem som områden inom Bosnien och Hercegovina, vars självständighet baskartan visar från den 3 mars 1992; Förbundsrepubliken Jugoslavien (Serbien och Montenegro) visas från den 27 april 1992. Frontlinjerna är ungefärliga och flyttades ofta.
Bosniak is used for Bosnian Muslims. The Bosnian government’s army (ARBiH) was mainly Bosniak but had Croat and Serb members; the Croatian Defence Council (HVO) was the Bosnian Croat army, and the Army of Republika Srpska (VRS) was formed from the JNA in May 1992.: Bosniaker används för bosniska muslimer. Den bosniska regeringens armé (ARBiH) var huvudsakligen bosniakisk men hade kroatiska och serbiska medlemmar; Kroatiska försvarsrådet (HVO) var bosnienkroaternas armé, och Republika Srpskas armé (VRS) bildades ur JNA i maj 1992.
Casualty figures are disputed. The Sarajevo Research and Documentation Center listed 97,207 named people killed or missing; ICTY demographers put the probable total at about 104,732. Where the ICTY or the International Court of Justice settled what happened, their findings are given.: Uppgifterna om antalet offer är omstridda. Forsknings- och dokumentationscentret i Sarajevo förtecknade 97 207 namngivna personer som dödats eller försvunnit; ICTY:s demografer uppskattade den sannolika totalsiffran till omkring 104 732. Där ICTY eller Internationella domstolen har fastställt vad som hände återges deras slutsatser.
