Bosnian War: Bosnienkriget
The war that followed Bosnia and Herzegovina’s independence from Yugoslavia. Bosnian Serb forces, armed by the Yugoslav People’s Army and backed by Serbia, seized about 70 per cent of the country in 1992, driving out or killing Bosniaks and Croats, and besieged Sarajevo for almost four years. In 1993 the Bosniak-led government and the Bosnian Croats, backed by Croatia, fought each other, until the Washington Agreement of March 1994 made them allies again. The fall of the UN safe area of Srebrenica in July 1995, where more than 8,000 Bosniak men and boys were killed in what international courts ruled was genocide, was followed by NATO air strikes and Croatian and Bosnian offensives. The Dayton Agreement of November 1995 kept Bosnia as one state of two entities. About 100,000 people were killed and 2.2 million displaced.: Det krig som följde på Bosnien och Hercegovinas självständighet från Jugoslavien. Bosnienserbiska styrkor, beväpnade av Jugoslaviska folkarmén och med stöd av Serbien, tog omkring 70 procent av landet 1992, fördrev eller dödade bosniaker och kroater och belägrade Sarajevo i nästan fyra år. År 1993 bekämpade den bosniakledda regeringen och bosnienkroaterna, med stöd av Kroatien, varandra, tills Washingtonavtalet i mars 1994 åter gjorde dem till allierade. Fallet av FN:s skyddade zon Srebrenica i juli 1995, där mer än 8 000 bosniakiska män och pojkar dödades i vad internationella domstolar fastslagit var folkmord, följdes av Natos flyganfall och kroatiska och bosniska offensiver. Daytonavtalet i november 1995 bevarade Bosnien som en stat bestående av två entiteter. Omkring 100 000 människor dödades och 2,2 miljoner fördrevs.
