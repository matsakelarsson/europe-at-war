In 1991 Bosnia and Herzegovina was 44 per cent Bosniak, 32.5 per cent Serb and 17 per cent Croat. As Yugoslavia broke up, Radovan Karadžić’s Serb Democratic Party rejected independence, and on 9 January 1992 Bosnian Serb deputies proclaimed a Serb republic that would stay in Yugoslavia. In a referendum on 29 February and 1 March, which most Serbs boycotted or were prevented from joining, 99.7 per cent of those voting, on a 64 per cent turnout, chose independence. President Alija Izetbegović declared it on 3 March.: År 1991 var Bosnien och Hercegovina till 44 procent bosniakiskt, till 32,5 procent serbiskt och till 17 procent kroatiskt. När Jugoslavien föll sönder motsatte sig Radovan Karadžićs Serbiska demokratiska partiet självständighet, och den 9 januari 1992 utropade bosnienserbiska ledamöter en serbisk republik som skulle stanna i Jugoslavien. I en folkomröstning den 29 februari och 1 mars, som de flesta serber bojkottade eller hindrades från att delta i, röstade 99,7 procent av de röstande, med ett valdeltagande på 64 procent, för självständighet. President Alija Izetbegović utropade den den 3 mars.
Barricades went up in Sarajevo, and violence spread. On 26 March Croat and Bosniak fighters killed some nine to eleven Serb civilians at Sijekovac near Bosanski Brod. On 1–2 April Arkan’s Serb Volunteer Guard and local paramilitaries took Bijeljina, killing dozens of Bosniak civilians. On 5 April Serb gunmen fired on a peace march in Sarajevo, killing Suada Dilberović and Olga Sučić on the Vrbanja bridge. The next day the European Community and the United States recognised Bosnia, and Serb forces began shelling the capital.: Barrikader restes i Sarajevo, och våldet spred sig. Den 26 mars dödade kroatiska och bosniakiska kämpar omkring nio till elva serbiska civila i Sijekovac nära Bosanski Brod. Den 1–2 april intog Arkans Serbiska frivilliga gardet och lokala paramilitärer Bijeljina och dödade dussintals bosniakiska civila. Den 5 april sköt serbiska beväpnade män mot ett fredståg i Sarajevo och dödade Suada Dilberović och Olga Sučić på Vrbanjabron. Dagen därpå erkände Europeiska gemenskapen och USA Bosnien, och serbiska styrkor började beskjuta huvudstaden.
