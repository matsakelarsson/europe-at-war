The HVO and the Bosnian army had fought the Serbs together in 1992, but the Croatian Community of Herzeg-Bosnia under Mate Boban was building its own state, and clashes began in October at Novi Travnik and Prozor. Fighting spread from Gornji Vakuf in January 1993 to open war in central Bosnia in April. On 16 April HVO troops killed about 120 Bosniak civilians at Ahmići in the Lašva valley; the ICTY sentenced their political leader, Dario Kordić, to 25 years. On the same day Bosnian army soldiers killed 22 Croats, sixteen of them civilians, at Trusina near Konjic.: HVO och den bosniska armén hade stridit tillsammans mot serberna 1992, men Kroatiska gemenskapen Herceg-Bosna under Mate Boban byggde upp en egen stat, och sammandrabbningar började i oktober i Novi Travnik och Prozor. Striderna spred sig från Gornji Vakuf i januari 1993 till öppet krig i centrala Bosnien i april. Den 16 april dödade HVO-trupper omkring 120 bosniakiska civila i Ahmići i Lašvadalen; ICTY dömde deras politiske ledare, Dario Kordić, till 25 års fängelse. Samma dag dödade soldater ur den bosniska armén 22 kroater, varav sexton civila, i Trusina nära Konjic.
On 9 May the HVO attacked the Bosniak east bank of Mostar and besieged it until early 1994, holding thousands of Bosniak men at camps such as the Heliodrom and Dretelj. On 9 November its tanks destroyed the 16th-century Old Bridge. In 2017 the ICTY Appeals Chamber confirmed the convictions of six Herzeg-Bosnia leaders for crimes against Bosniaks, though it judged the bridge itself a military target. Herzeg-Bosnia declared itself a republic on 28 August 1993.: Den 9 maj anföll HVO den bosniakiska östra stranden i Mostar och belägrade den till början av 1994, samtidigt som tusentals bosniakiska män hölls i läger som Heliodrom och Dretelj. Den 9 november förstörde dess stridsvagnar den gamla bron från 1500-talet. År 2017 fastställde ICTY:s överinstans domarna mot sex ledare för Herceg-Bosna för brott mot bosniaker, även om den bedömde att själva bron var ett militärt mål. Herceg-Bosna utropade sig till republik den 28 augusti 1993.
The larger Bosnian army took Travnik, Kakanj and Fojnica in June and July and Bugojno in July, where 15,000 Croats left, and Vareš in November. Its soldiers killed at least 13 Croat villagers at Grabovica and 29 at Uzdol in September; HVO troops killed at least 37 Bosniaks at Stupni Do in October. In the Bihać pocket Fikret Abdić proclaimed an Autonomous Province of Western Bosnia on 27 September and made deals with the Serb and Croat leaders. A ceasefire on 23 February 1994 ended the Croat–Bosniak war.: Den större bosniska armén intog Travnik, Kakanj och Fojnica i juni och juli och Bugojno i juli, varifrån 15 000 kroater gav sig av, och Vareš i november. Dess soldater dödade minst 13 kroatiska bybor i Grabovica och 29 i Uzdol i september; HVO-trupper dödade minst 37 bosniaker i Stupni Do i oktober. I Bihaćfickan utropade Fikret Abdić en autonom provins Västbosnien den 27 september och gjorde upp med de serbiska och kroatiska ledarna. En vapenvila den 23 februari 1994 gjorde slut på kriget mellan kroater och bosniaker.
