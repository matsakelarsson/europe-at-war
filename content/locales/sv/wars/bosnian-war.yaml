On 5 February 1994 a mortar bomb killed 68 people at the Markale market in Sarajevo. NATO ordered the Bosnian Serbs to withdraw their heavy weapons from around the city, and on 12 February Sarajevo had its first day without casualties since April 1992. With American mediation the Bosnian government and the Bosnian Croats agreed a ceasefire, and on 18 March signed the Washington Agreement, which joined the areas they held in a Federation of ten cantons.: Den 5 februari 1994 dödade en granat 68 människor på marknaden Markale i Sarajevo. Nato beordrade bosnienserberna att dra tillbaka sina tunga vapen från området runt staden, och den 12 februari hade Sarajevo sin första dag utan offer sedan april 1992. Med amerikansk medling kom den bosniska regeringen och bosnienkroaterna överens om vapenvila, och den 18 mars undertecknade de Washingtonavtalet, som förenade de områden de höll i en federation av tio kantoner.
In April the VRS attacked the Goražde safe area. NATO aircraft struck Serb positions, the first time they had done so in support of UN troops, and an ultimatum forced the Serbs back. In the Bihać pocket the Bosnian army’s 5th Corps defeated Abdić in the summer, survived a Bosnian and Krajina Serb counter-offensive in November that led NATO to bomb Udbina airfield in Croatia, but lost Velika Kladuša again in December. In the south-west the allies retook Kupres on 3 November.: I april anföll VRS den skyddade zonen Goražde. Natoflygplan angrep serbiska ställningar, första gången de gjorde det till stöd för FN-trupper, och ett ultimatum tvingade serberna tillbaka. I Bihaćfickan besegrade den bosniska arméns 5:e kår Abdić under sommaren och överlevde i november en motoffensiv av bosnienserber och krajinaserber, som ledde till att Nato bombade flygfältet i Udbina i Kroatien, men förlorade Velika Kladuša igen i december. I sydväst återtog de allierade Kupres den 3 november.
