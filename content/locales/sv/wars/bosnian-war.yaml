After NATO aircraft bombed Bosnian Serb positions at Pale on 25 May 1995, the VRS shelled the safe areas and took hundreds of UN peacekeepers hostage. That evening a shell killed 71 civilians, most of them young, in the centre of Tuzla. On 6 July the VRS attacked the Srebrenica enclave, defended by a weak Bosnian army division and about 400 lightly armed Dutch peacekeepers, and on 11 July Mladić entered the town.: Sedan Natoflygplan bombat bosnienserbiska ställningar vid Pale den 25 maj 1995 besköt VRS de skyddade zonerna och tog hundratals av FN:s fredsbevarare som gisslan. Samma kväll dödade en granat 71 civila, de flesta unga, i centrala Tuzla. Den 6 juli anföll VRS Srebrenicaenklaven, som försvarades av en svag division ur den bosniska armén och omkring 400 lätt beväpnade nederländska fredsbevarare, och den 11 juli tågade Mladić in i staden.
Some 25,000–30,000 women, children and old men were bussed to Bosnian lines after the men were separated from them at the Dutch base at Potočari. Men who tried to escape through the woods towards Tuzla were hunted down. In the following days more than 8,000 Bosniak men and boys were shot and buried in mass graves, later dug up and scattered to hide the crime. A list of the missing and dead contains 8,372 names.: Omkring 25 000–30 000 kvinnor, barn och gamla män fördes med bussar till de bosniska linjerna sedan männen skilts från dem vid den nederländska basen i Potočari. Män som försökte fly genom skogarna mot Tuzla jagades. Under de följande dagarna sköts mer än 8 000 bosniakiska män och pojkar och begravdes i massgravar, som senare grävdes upp och spreds ut för att dölja brottet. En förteckning över de saknade och döda innehåller 8 372 namn.
The ICTY, in the Krstić appeal of 2004, and the International Court of Justice in 2007 ruled that the killings were genocide; the ICJ found that Serbia had failed to prevent and punish it, though it was not itself responsible. Karadžić and Mladić were sentenced to life imprisonment. Žepa fell on 25 July, but its Ukrainian commander secured the evacuation of its civilians.: ICTY, i överinstansens dom i Krstićmålet 2004, och Internationella domstolen 2007 slog fast att morden var folkmord; Internationella domstolen fann att Serbien hade underlåtit att förhindra och bestraffa det, men inte själv var ansvarigt. Karadžić och Mladić dömdes till livstids fängelse. Žepa föll den 25 juli, men dess ukrainske befälhavare lyckades ordna en evakuering av de civila.
