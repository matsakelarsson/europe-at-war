After Operation Storm had swept the Krajina Serbs out of Croatia and relieved Bihać, a VRS mortar attack on the Markale market in Sarajevo killed 43 people on 28 August 1995. Two days later NATO began Operation Deliberate Force. Until 20 September some 400 aircraft from 15 countries struck 338 Bosnian Serb targets, from air defences and artillery around Sarajevo to depots and command posts, and the VRS pulled its heavy weapons back from the city.: Sedan Operation Storm hade drivit krajinaserberna ut ur Kroatien och undsatt Bihać dödade ett granatanfall från VRS mot marknaden Markale i Sarajevo 43 människor den 28 augusti 1995. Två dagar senare inledde Nato Operation Deliberate Force. Fram till den 20 september angrep omkring 400 flygplan från 15 länder 338 bosnienserbiska mål, från luftvärn och artilleri runt Sarajevo till förråd och ledningsplatser, och VRS drog tillbaka sina tunga vapen från staden.
At the same time Croatian and HVO forces took Jajce, Šipovo and Drvar in Operation Mistral 2, and the Bosnian army’s 5th Corps broke out of the Bihać pocket and took Bosanska Krupa, Bosanski Petrovac and Ključ. When a Serb counter-attack threatened Ključ, the Croats’ Operation Southern Move took Mrkonjić Grad and came within 25 km of Banja Luka. Southern Move alone displaced some 10,000 Serbs, and at least 181 were killed. A nationwide ceasefire took effect on 12 October, with the Federation now holding about half the country.: Samtidigt intog kroatiska styrkor och HVO Jajce, Šipovo och Drvar i Operation Mistral 2, och den bosniska arméns 5:e kår bröt ut ur Bihaćfickan och intog Bosanska Krupa, Bosanski Petrovac och Ključ. När ett serbiskt motanfall hotade Ključ intog kroaternas Operation Southern Move Mrkonjić Grad och kom inom 25 km från Banja Luka. Southern Move ensam fördrev omkring 10 000 serber, och minst 181 dödades. En landsomfattande vapenvila trädde i kraft den 12 oktober, då federationen höll omkring halva landet.
