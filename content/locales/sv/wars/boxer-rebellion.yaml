# Svenska översättningar av katalogtexten (våg 9); stegtexterna kommer senare.
Boxer Rebellion: Boxarupproret
? An anti-foreign and anti-Christian rising in North China, and the war it led to between the Qing court and eight foreign powers. The Boxers, the Yihetuan or “Militia United in Righteousness”, grew among villagers in Shandong and Zhili hit by drought, floods and the German seizure of Jiaozhou Bay; practising martial arts and rituals they believed made them invulnerable, they attacked missionaries, Chinese Christians, railways and telegraphs. In June 1900 they poured into Beijing and Tianjin. When foreign troops seized the Dagu forts, the Empress Dowager Cixi declared war on the powers, and Qing troops and Boxers besieged the foreign legations in Beijing for 55 days. An international army of about 20,000, mostly Japanese, Russian, British and American, took Tianjin and relieved Beijing on 14 August 1900; the court fled to Xi’an, and foreign troops looted the capital and sent punitive columns through Zhili while Russia occupied Manchuria. The Boxer Protocol of September 1901 imposed an indemnity of 450 million taels. About 32,000 Chinese Christians and some 200 foreign missionaries were killed, and estimates of the total dead are around 100,000.
: Ett främlingsfientligt och antikristet uppror i norra Kina och det krig som det ledde till mellan Qinghovet och åtta främmande makter. Boxarna, Yihetuan eller ”Milisen förenad i rättfärdighet”, växte fram bland bybor i Shandong och Zhili som drabbats av torka, översvämningar och Tysklands beslagtagande av Jiaozhoubukten; de utövade kampsport och ritualer som de trodde gjorde dem osårbara och angrep missionärer, kinesiska kristna, järnvägar och telegraflinjer. I juni 1900 strömmade de in i Peking och Tianjin. När utländska trupper intog Daguforten förklarade änkekejsarinnan Cixi krig mot makterna, och Qingtrupper och boxare belägrade de utländska legationerna i Peking i 55 dagar. En internationell armé på omkring 20 000 man, mest japaner, ryssar, britter och amerikaner, intog Tianjin och undsatte Peking den 14 augusti 1900; hovet flydde till Xi’an, och utländska trupper plundrade huvudstaden och sände straffkolonner genom Zhili medan Ryssland ockuperade Manchuriet. Boxarprotokollet i september 1901 ålade Kina ett skadestånd på 450 miljoner tael. Omkring 32 000 kinesiska kristna och omkring 200 utländska missionärer dödades, och uppskattningarna av det totala antalet döda ligger kring 100 000.
