Bozhou rebellion: Upproret i Bozhou
The war between the Ming and Yang Yinglong, hereditary chieftain (tusi) of Bozhou, around today’s Zunyi in northern Guizhou, whose family had ruled the region for some seven centuries under the Tang, Song, Yuan and Ming. From 1589 Yang fought rival chiefs and raided Ming territory, while the court, busy with the war against Japan in Korea, alternated between campaigns and pardons. After his forces took Qijiang in Sichuan in 1599, the court gave Li Hualong command of Sichuan, Guizhou and Huguang. In March 1600 eight Ming columns, about 240,000 men, most of them indigenous troops, invaded Bozhou, and on 15 July 1600 they stormed Yang’s mountain fortress of Hailongtun; Yang took his own life. The chieftaincy was abolished and its lands divided between Sichuan and Guizhou under appointed officials. The Ming counted the war among the Wanli Emperor’s Three Great Campaigns, with the Ningxia campaign of 1592 and the war in Korea.: Kriget mellan Ming och Yang Yinglong, ärftlig hövding (tusi) i Bozhou, kring dagens Zunyi i norra Guizhou, vars släkt hade styrt området i omkring sju sekler under Tang, Song, Yuan och Ming. Från 1589 bekämpade Yang rivaliserande hövdingar och gjorde räder in på Mingområde, medan hovet, upptaget av kriget mot Japan i Korea, växlade mellan fälttåg och benådningar. Sedan hans styrkor hade intagit Qijiang i Sichuan 1599 gav hovet Li Hualong befälet över Sichuan, Guizhou och Huguang. I mars 1600 invaderade åtta Mingkolonner, omkring 240 000 man, de flesta av dem trupper ur ursprungsfolken, Bozhou, och den 15 juli 1600 stormade de Yangs bergfästning Hailongtun; Yang tog sitt liv. Hövdingadömet avskaffades och dess land delades mellan Sichuan och Guizhou under utnämnda ämbetsmän. Ming räknade kriget till Wanlikejsarens tre stora fälttåg, tillsammans med fälttåget i Ningxia 1592 och kriget i Korea.
