Brabant Revolution: Brabantska revolutionen
A revolt in the Austrian Netherlands against the reforms of the Emperor Joseph II, which many saw as an attack on the Catholic Church and on the provinces’ old privileges. Exiles gathered a small army in the Dutch Republic, which crossed the border and beat the Austrians at Turnhout on 27 October 1789. Risings followed across the country, and by the end of the year the Austrian troops had withdrawn to Luxembourg. On 11 January 1790 the rebel provinces declared independence as the United Belgian States, but no power recognised them, and the conservative Statists of Henri Van der Noot, backed by the Church, drove out the liberal Vonckists of Jan Frans Vonck. Joseph’s successor, Leopold II, stopped fighting the Ottomans and came to terms with Prussia at Reichenbach in July 1790; his troops beat the Belgian army at Falmagne in September and reoccupied the country, entering Brussels in early December 1790.: Ett uppror i Österrikiska Nederländerna mot kejsar Josef II:s reformer, som många såg som ett angrepp på katolska kyrkan och på provinsernas gamla privilegier. Landsflyktingar samlade en liten armé i Nederländska republiken, som gick över gränsen och slog österrikarna vid Turnhout den 27 oktober 1789. Resningar följde över hela landet, och vid årets slut hade de österrikiska trupperna dragit sig tillbaka till Luxemburg. Den 11 januari 1790 förklarade sig de upproriska provinserna självständiga som Förenade belgiska staterna, men ingen makt erkände dem, och Henri Van der Noots konservativa statister, med stöd av kyrkan, drev ut Jan Frans Voncks liberala vonckister. Josefs efterträdare, Leopold II, upphörde att kriga mot osmanerna och gjorde upp med Preussen i Reichenbach i juli 1790; hans trupper slog den belgiska armén vid Falmagne i september och återockuperade landet och ryckte in i Bryssel i början av december 1790.
