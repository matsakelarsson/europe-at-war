Sometimes called the Belgian Revolution of 1789–1790. It ran alongside the Liège Revolution and the first year of the French Revolution; the restored Austrian rule lasted only until the French conquests of 1792 and 1794.: Kallas ibland den belgiska revolutionen 1789–1790. Den pågick samtidigt med Liègerevolutionen och franska revolutionens första år; det återupprättade österrikiska styret varade bara fram till de franska erövringarna 1792 och 1794.
