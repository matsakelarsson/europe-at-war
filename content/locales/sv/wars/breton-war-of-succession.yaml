The war is also called the War of the Two Joans, after Joanna of Flanders, Montfort’s wife, who led his party while he was a prisoner, and Joan of Penthièvre, Charles of Blois’s wife, in whose right he claimed the duchy.: Kriget kallas också de två Johannornas krig, efter Johanna av Flandern, Montforts hustru, som ledde hans parti medan han satt fången, och Johanna av Penthièvre, Karl av Blois hustru, i vars namn han gjorde anspråk på hertigdömet.
