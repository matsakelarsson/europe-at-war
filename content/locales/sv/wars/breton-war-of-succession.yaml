Breton War of Succession: Bretagnska tronföljdskriget
A war for the Duchy of Brittany after Duke John III died without children in 1341, between his half-brother John of Montfort, backed by England, and Charles of Blois, husband of his niece Joan of Penthièvre, backed by France. Fought as part of the Hundred Years’ War, it saw Joanna of Flanders’ defence of Hennebont in 1342, Charles’s capture at La Roche-Derrien in 1347 and the Combat of the Thirty in 1351. It ended when Charles was killed at Auray in 1364, and by the Treaty of Guérande in 1365 Montfort’s son John IV was recognised as duke.: Ett krig om hertigdömet Bretagne sedan hertig Johan III dött barnlös 1341, mellan hans halvbror Johan av Montfort, som stöddes av England, och Karl av Blois, make till hans brorsdotter Johanna av Penthièvre, som stöddes av Frankrike. Kriget utkämpades som en del av hundraårskriget och omfattade bland annat Johanna av Flanderns försvar av Hennebont 1342, Karls tillfångatagande vid La Roche-Derrien 1347 och de trettios strid 1351. Det slutade när Karl stupade vid Auray 1364, och genom freden i Guérande 1365 erkändes Montforts son Johan IV som hertig.
