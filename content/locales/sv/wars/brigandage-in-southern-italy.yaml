Brigandage in southern Italy: Brigantaggio i södra Italien
? A guerrilla war in the former Kingdom of the Two Sicilies after its annexation by Italy. Armed bands of former Bourbon soldiers, deserters, peasants and outlaws, encouraged at first by the exiled court of Francis II in Rome and joined by a few foreign legitimists, attacked troops, officials and landowners, above all in Basilicata, Apulia, Campania and the Abruzzi; leaders such as Carmine Crocco commanded hundreds of men. The new state answered with a large part of its army, martial law and, from 1863, the Pica Law, which set up military courts and allowed the arrest of brigands’ relatives. Both sides committed atrocities. After brigands killed some 40 soldiers near Pontelandolfo in August 1861, troops burned Pontelandolfo and Casalduni and killed many of their people. Official figures for 1861–1864 alone count about 2,400 brigands killed in fighting, over 1,000 executed and about 600 soldiers killed; estimates of the total dead vary widely and remain disputed. By the late 1860s the bands had been destroyed, but the war left lasting bitterness in the south.
: Ett gerillakrig i det forna Kungariket Bägge Sicilierna efter dess annektering av Italien. Beväpnade band av tidigare bourbonska soldater, desertörer, bönder och fredlösa, till en början uppmuntrade av Frans II:s landsflyktiga hov i Rom och förstärkta av några utländska legitimister, angrep trupper, ämbetsmän och jordägare, framför allt i Basilicata, Apulien, Kampanien och Abruzzerna; ledare som Carmine Crocco förde befäl över hundratals män. Den nya staten svarade med en stor del av sin armé, krigslagar och från 1863 Picalagen, som inrättade militärdomstolar och tillät gripande av briganternas anhöriga. Båda sidor begick grymheter. Sedan briganter dödat omkring 40 soldater nära Pontelandolfo i augusti 1861 brände trupper Pontelandolfo och Casalduni och dödade många av invånarna. Enbart de officiella siffrorna för 1861–1864 anger omkring 2 400 briganter dödade i strid, över 1 000 avrättade och omkring 600 dödade soldater; uppskattningarna av det totala antalet döda varierar kraftigt och är fortfarande omstridda. I slutet av 1860-talet hade banden krossats, men kriget lämnade en bestående bitterhet i söder.
