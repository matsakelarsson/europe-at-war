# Svenska översättningar av katalogtexten (våg 8); stegtexterna kommer senare.
British conquest of Bengal: Den brittiska erövringen av Bengalen
The wars in which the British East India Company became the real ruler of Bengal, Bihar and Orissa, the richest province of Mughal India. In 1756 the young Nawab Siraj-ud-Daulah took the Company’s town of Calcutta; a force from Madras under Robert Clive retook it, seized the French settlement of Chandernagore and, in league with the Nawab’s own commander Mir Jafar, defeated Siraj at Plassey on 23 June 1757. The Company made and unmade nawabs, replacing Mir Jafar with Mir Qasim in 1760, and when Mir Qasim tried to rule on his own terms it fought and beat him in 1763. At Buxar in October 1764 it defeated Mir Qasim, the Nawab of Awadh and the Mughal emperor Shah Alam II together, and by the settlement of Allahabad in August 1765 the emperor granted the Company the diwani, the right to collect the revenue of the three provinces.: De krig genom vilka Brittiska ostindiska kompaniet blev den verkliga härskaren över Bengalen, Bihar och Orissa, Mogulindiens rikaste provins. År 1756 intog den unge nawaben Siraj-ud-Daulah kompaniets stad Calcutta; en styrka från Madras under Robert Clive återtog den, erövrade den franska bosättningen Chandernagore och besegrade, i maskopi med nawabens egen befälhavare Mir Jafar, Siraj vid Plassey den 23 juni 1757. Kompaniet tillsatte och avsatte nawaber och ersatte Mir Jafar med Mir Qasim 1760, och när Mir Qasim försökte styra på egna villkor förde kompaniet krig mot honom och besegrade honom 1763. Vid Buxar i oktober 1764 besegrade det på en gång Mir Qasim, nawaben av Awadh och mogulkejsaren Shah Alam II, och genom uppgörelsen i Allahabad i augusti 1765 beviljade kejsaren kompaniet diwani, rätten att uppbära skatterna i de tre provinserna.
