# Svenska översättningar av katalogtexten (våg 13); stegtexterna kommer senare.
British conquest of Bunyoro: Storbritanniens erövring av Bunyoro
? The war in which Britain and its Ganda allies conquered the kingdom of Bunyoro-Kitara in western Uganda. Omukama Kabalega, who had rebuilt Bunyoro’s power with a standing army armed with guns, resisted the advance of British influence from Buganda and backed Buganda’s Muslim party. In December 1893 Colonel Henry Colvile invaded with Sudanese troops and a large Ganda army under Semei Kakungulu; Britain declared war on 1 January 1894, and Kabalega abandoned his capital, Mparo. For five years he fought on from the Budongo forest and the country north of the Nile, while the British built forts across his kingdom and gave large parts of it to Buganda and Toro. In 1897 Kabaka Mwanga II of Buganda rose against the British, was defeated and, after a mutiny of the protectorate’s Sudanese troops, joined Kabalega. Both were captured in Lango on 9 April 1899 and exiled to the Seychelles. The lands south of the Kafu given to Buganda remained a grievance in Bunyoro; two of the “lost counties” voted to return to it in a referendum in 1964.
: Det krig där Storbritannien och dess gandaallierade erövrade kungariket Bunyoro-Kitara i västra Uganda. Omukama Kabalega, som hade återuppbyggt Bunyoros makt med en stående armé beväpnad med gevär, gjorde motstånd mot det brittiska inflytandets framryckning från Buganda och stödde Bugandas muslimska parti. I december 1893 invaderade överste Henry Colvile med sudanesiska trupper och en stor gandaarmé under Semei Kakungulu; Storbritannien förklarade krig den 1 januari 1894, och Kabalega övergav sin huvudstad Mparo. I fem år fortsatte han kampen från Budongoskogen och landet norr om Nilen, medan britterna byggde fort över hela hans rike och gav stora delar av det till Buganda och Toro. År 1897 reste sig kabaka Mwanga II av Buganda mot britterna, besegrades och anslöt sig, efter ett myteri bland protektoratets sudanesiska trupper, till Kabalega. Båda tillfångatogs i Lango den 9 april 1899 och förvisades till Seychellerna. De landområden söder om Kafu som hade getts till Buganda förblev en källa till missnöje i Bunyoro; två av de ”förlorade grevskapen” röstade för att återgå dit i en folkomröstning 1964.
