British Conquest of Dutch Ceylon: Den brittiska erövringen av Nederländska Ceylon
The British capture of the Dutch East India Company’s coastal provinces of Ceylon during the French Revolutionary Wars. After France overran the Dutch Republic and set up the Batavian Republic in January 1795, the exiled Prince of Orange told Dutch colonial governors in the Kew Letters to admit British troops. An expedition from Madras of about 2,700 men under Colonel James Stuart, with Rear-Admiral Peter Rainier’s squadron, landed near Trincomalee in August 1795; the town surrendered on 26 August after a short bombardment and Fort Ostenburg on 31 August. Batticaloa, Jaffna, Mullaitivu and Mannar followed in September and October. The Swiss Regiment de Meuron, the backbone of the Dutch garrison, had already been bought into British service. Stuart landed at Negombo in February 1796, and Governor Johan van Angelbeek surrendered Colombo without a fight on 15–16 February; Galle followed a few days later. The Dutch formally ceded Ceylon at the Peace of Amiens in 1802, when it became a British Crown colony.: Britternas erövring av Nederländska ostindiska kompaniets kustprovinser på Ceylon under de franska revolutionskrigen. Sedan Frankrike hade erövrat Nederländska republiken och upprättat Bataviska republiken i januari 1795, uppmanade den landsflyktige prinsen av Oranien i Kewbreven de nederländska koloniguvernörerna att släppa in brittiska trupper. En expedition från Madras på omkring 2 700 man under överste James Stuart landsteg tillsammans med konteramiral Peter Rainiers eskader nära Trincomalee i augusti 1795; staden kapitulerade den 26 augusti efter en kort beskjutning och Fort Ostenburg den 31 augusti. Batticaloa, Jaffna, Mullaitivu och Mannar följde i september och oktober. Det schweiziska regementet de Meuron, ryggraden i den nederländska garnisonen, hade redan köpts över i brittisk tjänst. Stuart landsteg i Negombo i februari 1796, och guvernör Johan van Angelbeek överlämnade Colombo utan strid den 15–16 februari; Galle följde några dagar senare. Nederländerna avträdde formellt Ceylon vid freden i Amiens 1802, då ön blev en brittisk kronkoloni.
