# Svenska översättningar av katalogtexten (våg 13); stegtexterna kommer senare.
British conquest of northern Nigeria: Den brittiska erövringen av norra Nigeria
? The conquest of the Sokoto Caliphate and its emirates by the Royal Niger Company and then the British Northern Nigeria Protectorate. The caliphate, founded in Usman dan Fodio’s jihad, was the largest state in West Africa, a loose union of some thirty emirates under the caliph at Sokoto and the emir of Gwandu. In 1897 the Royal Niger Company, which held a British charter over the lower Niger, defeated the emirates of Nupe at Bida and of Ilorin. The British government took over the company’s territories on 1 January 1900 and Frederick Lugard, as high commissioner, extended British rule emirate by emirate with the West African Frontier Force, taking Kontagora, Yola, Bauchi and Zaria in 1901–1902, Kano on 3 February 1903 and Sokoto on 15 March 1903. Caliph Attahiru I set out with thousands of followers on a hijra towards Mecca and was killed at Burmi in July 1903. Lugard kept the emirs who submitted as rulers under British residents, the system that became known as indirect rule. The last armed resistance, a Mahdist rising at Satiru near Sokoto, was crushed in March 1906 by British troops together with the new sultan’s forces.
: Erövringen av Sokotokalifatet och dess emirat, först genom Royal Niger Company och sedan genom det brittiska protektoratet Nordnigeria. Kalifatet, som hade grundats genom Usman dan Fodios jihad, var den största staten i Västafrika, en lös union av ett trettiotal emirat under kalifen i Sokoto och emiren av Gwandu. År 1897 besegrade Royal Niger Company, som hade ett brittiskt privilegiebrev över nedre Niger, emiraten Nupe, vid Bida, och Ilorin. Den brittiska regeringen tog över kompaniets territorier den 1 januari 1900, och Frederick Lugard utvidgade som överkommissarie det brittiska styret emirat för emirat med West African Frontier Force; han intog Kontagora, Yola, Bauchi och Zaria 1901–1902, Kano den 3 februari 1903 och Sokoto den 15 mars 1903. Kalifen Attahiru I gav sig i väg med tusentals anhängare på en hijra mot Mecka och dödades vid Burmi i juli 1903. Lugard behöll de emirer som underkastade sig som härskare under brittiska residenter, det system som blev känt som indirekt styre. Det sista väpnade motståndet, en mahdistisk resning i Satiru nära Sokoto, krossades i mars 1906 av brittiska trupper tillsammans med den nye sultanens styrkor.
