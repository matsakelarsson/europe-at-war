British Conquest of Sindh: Den brittiska erövringen av Sind
The East India Company’s conquest of Sindh, the lower Indus valley ruled by the Talpur Mirs. The British had forced the Mirs to let the Army of the Indus pass through their country and to accept British troops during the First Anglo-Afghan War; in 1842 the new Governor-General, Lord Ellenborough, and his general in Sindh, Sir Charles Napier, demanded new cessions. After a Baluch attack on the British Residency at Hyderabad, Napier’s small army defeated far larger Talpur forces at Miani on 17 February 1843 and at Dubba near Hyderabad on 24 March, and took Mirpur and Umarkot. Sindh was annexed, except for Khairpur, whose Mir had sided with the British. The conquest was widely criticised in Britain as unprovoked.: Brittiska ostindiska kompaniets erövring av Sind, den nedre Indusdalen, som styrdes av talpurmirerna. Britterna hade tvingat mirerna att låta Indusarmén passera genom deras land och att ta emot brittiska trupper under första anglo-afghanska kriget, och 1842 krävde den nye generalguvernören, lord Ellenborough, och hans general i Sind, sir Charles Napier, nya landavträdelser. Efter ett baluchiskt angrepp på det brittiska residentskapet i Hyderabad besegrade Napiers lilla armé betydligt större talpurstyrkor vid Miani den 17 februari 1843 och vid Dubba nära Hyderabad den 24 mars och intog Mirpur och Umarkot. Sind annekterades, utom Khairpur, vars mir hade ställt sig på britternas sida. I Storbritannien kritiserades erövringen allmänt som oprovocerad.
