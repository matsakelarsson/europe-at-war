# Svenska översättningar av katalogtexten (våg 13); stegtexterna kommer senare.
British conquest of the Cape: Storbritanniens erövring av Kapkolonin
? "The two British invasions that took the Cape of Good Hope from the Dutch, an outcome of the French Revolutionary and Napoleonic Wars. When French armies overran the Dutch Republic in 1795 and the Batavian Republic was proclaimed, Britain moved to keep the Cape, the half-way station on the sea route to India, out of French hands. A squadron under Vice-Admiral George Elphinstone, with troops under Major-General James Craig, anchored in False Bay in June 1795, bearing letters from the exiled stadtholder William V asking the Dutch East India Company’s governor, Abraham Sluysken, to admit them. He refused; the British forced the Muizenberg pass on 7 August, and when reinforcements under General Alured Clarke arrived in September the colony capitulated. A Batavian squadron sent to retake it surrendered in Saldanha Bay in August 1796. The Peace of Amiens returned the Cape to the Batavian Republic, which took it over in February 1803, but when war resumed Britain sent a second expedition: Sir David Baird’s army landed north of Cape Town, defeated Governor Jan Willem Janssens’s smaller and mixed force at Blaauwberg on 8 January 1806, took Cape Town on 10 January and received Janssens’s capitulation on 18 January. The Netherlands ceded the colony to Britain in 1814."
: "De två brittiska invasioner som tog Godahoppsudden från holländarna, en följd av franska revolutionskrigen och Napoleonkrigen. När franska arméer intog Nederländska republiken 1795 och Bataviska republiken utropades, ingrep Storbritannien för att hålla Kap, halvvägsstationen på sjövägen till Indien, utom räckhåll för fransmännen. En eskader under viceamiral George Elphinstone, med trupper under generalmajor James Craig, ankrade i False Bay i juni 1795 med brev från den landsflyktige ståthållaren Vilhelm V som uppmanade Nederländska Ostindiska kompaniets guvernör, Abraham Sluysken, att släppa in dem. Han vägrade; britterna forcerade passet vid Muizenberg den 7 augusti, och när förstärkningar under general Alured Clarke anlände i september kapitulerade kolonin. En batavisk eskader som sänts för att återta den kapitulerade i Saldanhabukten i augusti 1796. Freden i Amiens återlämnade Kap till Bataviska republiken, som tog över kolonin i februari 1803, men när kriget återupptogs sände Storbritannien en andra expedition: Sir David Bairds armé landsteg norr om Kapstaden, besegrade guvernör Jan Willem Janssens mindre och blandade styrka vid Blaauwberg den 8 januari 1806, intog Kapstaden den 10 januari och tog emot Janssens kapitulation den 18 januari. Nederländerna avträdde kolonin till Storbritannien 1814."
