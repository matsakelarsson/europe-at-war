# Svenska översättningar av katalogtexten (våg 12); stegtexterna kommer senare.
British Expedition to Abyssinia: Brittiska expeditionen till Abessinien
? "A British and Indian army’s march to Magdala to free British and other European captives held by Emperor Tewodros II. Tewodros had imprisoned the British consul Charles Cameron in January 1864, after his letter to Queen Victoria went unanswered, and later the envoy Hormuzd Rassam and missionaries. In 1867 the British government sent an army from Bombay under Sir Robert Napier: about 13,000 soldiers, 26,000 followers and more than 40,000 animals, among them elephants, landed at Zula on the Red Sea and marched some 600 km through the highlands, helped by the ruler of Tigray, Kassa Mercha. On 10 April 1868 Tewodros’s army was cut down at Arogee below Magdala; he released the captives, and on 13 April, as the British stormed the fortress, he shot himself. The British looted and burned Magdala and left the country by June. Kassa Mercha, rewarded with arms, became Emperor Yohannes IV in 1872. Many of the manuscripts and treasures taken from Magdala are still in British collections, and Ethiopia has long asked for their return."
: "En brittisk-indisk armés marsch till Magdala för att befria brittiska och andra europeiska fångar som hölls av kejsar Tewodros II. Tewodros hade fängslat den brittiske konsuln Charles Cameron i januari 1864, sedan kejsarens brev till drottning Viktoria hade lämnats obesvarat, och senare även sändebudet Hormuzd Rassam och ett antal missionärer. År 1867 sände den brittiska regeringen en armé från Bombay under sir Robert Napier: omkring 13 000 soldater, 26 000 man trossfolk och mer än 40 000 djur, bland dem elefanter, landsteg vid Zula vid Röda havet och marscherade omkring 600 km genom höglandet, med hjälp av Tigrays härskare Kassa Mercha. Den 10 april 1868 höggs Tewodros armé ned vid Arogee nedanför Magdala; han släppte fångarna, och den 13 april, när britterna stormade fästningen, sköt han sig. Britterna plundrade och brände Magdala och hade lämnat landet i juni. Kassa Mercha, som belönades med vapen, blev kejsar Yohannes IV 1872. Många av de handskrifter och skatter som togs från Magdala finns fortfarande i brittiska samlingar, och Etiopien har länge begärt att de ska återlämnas."
