British expedition to Tibet: Den brittiska expeditionen till Tibet
A British Indian military expedition into Tibet in 1903–1904, led by Colonel Francis Younghusband and Brigadier-General James Macdonald, also called the Younghusband expedition. The Viceroy, Lord Curzon, sent it to force Tibet to accept trade and border agreements, fearing Russian influence in Lhasa. About 3,000 soldiers and 7,000 porters and followers crossed the Jelep La from Sikkim in December 1903. At Guru (Chumik Shenko) on 31 March 1904 British and Indian troops killed some 600 to 700 Tibetans in minutes; Gyantse was besieged and its fortress stormed in July, and the force entered Lhasa on 3 August. The Dalai Lama had fled to Mongolia. The Convention of Lhasa of 7 September 1904 opened trade marts and imposed an indemnity, and the expedition withdrew. Some 2,000 to 3,000 Tibetans were killed.: En brittisk-indisk militärexpedition in i Tibet 1903–1904, ledd av överste Francis Younghusband och brigadgeneral James Macdonald, även kallad Younghusbandexpeditionen. Vicekungen, lord Curzon, sände ut den för att tvinga Tibet att godta handels- och gränsavtal, eftersom han fruktade ryskt inflytande i Lhasa. Omkring 3 000 soldater och 7 000 bärare och följeslagare gick över Jelep La från Sikkim i december 1903. Vid Guru (Chumik Shenko) den 31 mars 1904 dödade brittiska och indiska trupper omkring 600 till 700 tibetaner på några minuter; Gyantse belägrades och dess fästning stormades i juli, och styrkan tågade in i Lhasa den 3 augusti. Dalai lama hade flytt till Mongoliet. Lhasakonventionen den 7 september 1904 öppnade handelsplatser och ålade Tibet ett skadestånd, och expeditionen drog sig tillbaka. Omkring 2 000 till 3 000 tibetaner dödades.
