# Svenska översättningar av katalogtexten (våg 11); stegtexterna kommer senare.
British invasion of Java: Brittiska invasionen av Java
? The British conquest of Java from its Franco-Dutch government during the Napoleonic Wars, and the storming of the court of Yogyakarta that followed. The Netherlands had been annexed by France in 1810, and Java, governed since 1808 by the marshal Herman Willem Daendels and from 1811 by General Jan Willem Janssens, was the last French-ruled base in the East. An expedition of about 12,000 men, half of them Indian sepoys of the East India Company, sailed from India under General Sir Samuel Auchmuty and landed at Cilincing east of Batavia on 4 August 1811. Batavia surrendered without a fight on 8 August, and on the night of 25–26 August the British stormed the fortified lines of Meester Cornelis, where about 5,000 defenders were captured and about 1,000 found dead. Janssens retreated east, and after his last force broke up he capitulated at Tuntang near Salatiga on 18 September. Thomas Stamford Raffles governed Java for the East India Company. On 20 June 1812 British and sepoy troops, with the Mangkunegaran Legion, stormed and plundered the palace of Sultan Hamengkubuwono II of Yogyakarta, who was deposed and exiled to Penang. Java was returned to the Netherlands in 1816.
: Britternas erövring av Java från dess fransk-nederländska regering under Napoleonkrigen, och stormningen av hovet i Yogyakarta som följde. Nederländerna hade annekterats av Frankrike 1810, och Java, som sedan 1808 styrdes av marskalken Herman Willem Daendels och från 1811 av general Jan Willem Janssens, var den sista franskstyrda basen i Östern. En expedition på omkring 12 000 man, varav hälften indiska sepoyer i Brittiska ostindiska kompaniets tjänst, seglade från Indien under general sir Samuel Auchmuty och landsteg vid Cilincing öster om Batavia den 4 augusti 1811. Batavia kapitulerade utan strid den 8 augusti, och natten mellan den 25 och 26 augusti stormade britterna de befästa linjerna vid Meester Cornelis, där omkring 5 000 försvarare tillfångatogs och omkring 1 000 hittades döda. Janssens drog sig tillbaka österut, och sedan hans sista styrka hade upplösts kapitulerade han i Tuntang nära Salatiga den 18 september. Thomas Stamford Raffles styrde Java för Brittiska ostindiska kompaniets räkning. Den 20 juni 1812 stormade och plundrade brittiska trupper och sepoyer, tillsammans med Mangkunegaranlegionen, palatset hos sultan Hamengkubuwono II av Yogyakarta, som avsattes och förvisades till Penang. Java återlämnades till Nederländerna 1816.
