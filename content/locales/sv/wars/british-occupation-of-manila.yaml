# Svenska översättningar av katalogtexten (våg 11); stegtexterna kommer senare.
British occupation of Manila: Brittiska ockupationen av Manila
? The capture and occupation of Manila and Cavite by a British and East India Company expedition from Madras in the Seven Years’ War, and the risings it set off in Luzon. Spain had entered the war on France’s side in January 1762. On 24 September a fleet under Rear-Admiral Samuel Cornish, carrying about 6,800 soldiers, sailors and marines under Brigadier William Draper, among them Company sepoys, sailed into Manila Bay. The city, governed by the acting governor, Archbishop Manuel Rojo, had small regular forces and thousands of Filipino militia; it was stormed on 6 October and sacked, and Rojo agreed to a ransom of four million dollars, of which only a quarter was ever paid. The judge Simón de Anda y Salazar escaped to Pampanga, proclaimed himself governor and, with an army of Filipino volunteers, kept the British confined to Manila and Cavite. In the Ilocos Diego Silang rose against Spanish rule in December 1762 and sought British help, which never came; he was killed on 28 May 1763, and his widow Gabriela Silang fought on until she and her followers were captured and hanged at Vigan in September. Juan de la Cruz Palaris led a revolt in Pangasinan that lasted until 1765. The Treaty of Paris of 10 February 1763 returned Manila to Spain, and the British sailed away in April 1764.
: Erövringen och ockupationen av Manila och Cavite under sjuårskriget, genomförd av en expedition från Madras med brittiska trupper och trupper från Brittiska ostindiska kompaniet, och de resningar den utlöste på Luzon. Spanien hade gått in i kriget på Frankrikes sida i januari 1762. Den 24 september seglade en flotta under konteramiral Samuel Cornish in i Manilabukten med omkring 6 800 soldater, sjömän och marinsoldater under brigadgeneral William Draper ombord, bland dem kompaniets sepoyer. Staden, som styrdes av den tillförordnade guvernören, ärkebiskop Manuel Rojo, hade små reguljära styrkor och tusentals filippinska milismän; den stormades den 6 oktober och plundrades, och Rojo gick med på en lösensumma på fyra miljoner dollar, varav bara en fjärdedel någonsin betalades. Domaren Simón de Anda y Salazar flydde till Pampanga, utropade sig själv till guvernör och höll med en armé av filippinska frivilliga britterna instängda i Manila och Cavite. I Ilocos reste sig Diego Silang mot det spanska styret i december 1762 och sökte brittisk hjälp, som aldrig kom; han dödades den 28 maj 1763, och hans änka Gabriela Silang stred vidare tills hon och hennes anhängare tillfångatogs och hängdes i Vigan i september. Juan de la Cruz Palaris ledde ett uppror i Pangasinan som varade till 1765. Freden i Paris den 10 februari 1763 gav Manila tillbaka till Spanien, och britterna seglade bort i april 1764.
