Bruce campaign in Ireland: Bruces fälttåg på Irland
The invasion of Ireland by Edward Bruce, brother of Robert I of Scotland, who landed near Larne in May 1315 at the invitation of Domnall Ó Néill of Tír Eógain and was proclaimed High King of Ireland. With Irish allies he beat the forces of the Lordship of Ireland at Connor, Kells and Skerries and took Carrickfergus, and Robert joined him in 1317 for a march as far as Limerick. The campaign came during the Great Famine and devastated much of Ireland; it ended when Edward was defeated and killed at Faughart, near Dundalk, on 14 October 1318.: Edward Bruces invasion av Irland; han var bror till Robert I av Skottland, landsteg nära Larne i maj 1315 på inbjudan av Domnall Ó Néill av Tír Eógain och utropades till storkonung av Irland. Med irländska allierade slog han det engelska herradömet Irlands styrkor vid Connor, Kells och Skerries och intog Carrickfergus, och 1317 anslöt sig Robert till honom för en marsch ända till Limerick. Fälttåget sammanföll med den stora svälten och ödelade stora delar av Irland; det slutade när Edward besegrades och stupade vid Faughart nära Dundalk den 14 oktober 1318.
