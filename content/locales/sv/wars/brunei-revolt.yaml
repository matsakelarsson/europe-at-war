# Svenska översättningar av katalogtexten (våg 11); stegtexterna kommer senare.
Brunei revolt: Revolten i Brunei
? The rising of the North Kalimantan National Army (TNKU) in the British protectorate of Brunei and the neighbouring parts of Sarawak and North Borneo. The left-wing Brunei People’s Party of A. M. Azahari had won every elected seat in the Legislative Council in 1962 and opposed the plan to bring Brunei into Malaysia; it wanted a unitary state of North Kalimantan joining Brunei, Sarawak and North Borneo under the Sultan, and its armed wing had been trained and armed with Indonesian help. At about 2 a.m. on 8 December 1962 several thousand TNKU members attacked police stations and government offices across the protectorate, failed to take the Sultan’s palace in Brunei Town, seized the Shell oil field at Seria with European hostages, and took Bangar, Limbang and other towns, while Azahari proclaimed the state from Manila. British troops flown from Singapore, starting with Gurkhas that evening and the Queen’s Own Highlanders on 10 December, retook Brunei Town and Seria within days; on 12 December Royal Marines of 42 Commando stormed Limbang from the river and freed the British Resident and other hostages, losing five men. Iban and other Dayak volunteers raised by Tom Harrisson helped hunt down the rebels in the interior. About 40 rebels were killed and some 3,400 detained; the Commonwealth side lost six dead. The last TNKU commander, Yassin Affendi, was wounded and captured on 18 May 1963. The Sultan declared a state of emergency, which has never been lifted, banned the party and decided in 1963 not to join Malaysia; Brunei stayed a British protectorate until it became independent on 1 January 1984. Indonesia’s support for the revolt led directly to its confrontation with Malaysia.
: Resningen av Nordkalimantans nationella armé (TNKU) i det brittiska protektoratet Brunei och angränsande delar av Sarawak och Nordborneo. A. M. Azaharis vänsterorienterade Bruneis folkparti hade vunnit samtliga valda platser i det lagstiftande rådet 1962 och motsatte sig planen att föra in Brunei i Malaysia; partiet ville ha en enhetsstat, Nordkalimantan, som förenade Brunei, Sarawak och Nordborneo under sultanen, och dess väpnade gren hade tränats och beväpnats med indonesisk hjälp. Omkring klockan 2 på natten den 8 december 1962 anföll flera tusen TNKU-medlemmar polisstationer och regeringskontor över hela protektoratet, misslyckades med att inta sultanens palats i Brunei Town, intog Shells oljefält vid Seria och tog européer som gisslan där och intog Bangar, Limbang och andra städer, medan Azahari utropade staten från Manila. Brittiska trupper som flögs in från Singapore, först gurkhasoldater samma kväll och Queen’s Own Highlanders den 10 december, återtog Brunei Town och Seria inom några dagar; den 12 december stormade Royal Marines ur 42 Commando Limbang från floden och befriade den brittiske residenten och övriga gisslan, med en förlust av fem man. Iban och andra dajakiska frivilliga som Tom Harrisson hade rekryterat hjälpte till att jaga rebellerna i inlandet. Omkring 40 rebeller dödades och omkring 3 400 greps; samväldets sida förlorade sex döda. Den siste TNKU-befälhavaren, Yassin Affendi, sårades och tillfångatogs den 18 maj 1963. Sultanen utlyste undantagstillstånd, som aldrig har hävts, förbjöd partiet och beslöt 1963 att inte ansluta sig till Malaysia; Brunei förblev ett brittiskt protektorat tills landet blev självständigt den 1 januari 1984. Indonesiens stöd för revolten ledde direkt till landets konfrontation med Malaysia.
