Buganda civil wars: Inbördeskrigen i Buganda
? The wars between the Muslim, Catholic and Protestant parties of the kingdom of Buganda, which opened the way to British rule in Uganda. Converts to Islam and to the two Christian missions, many of them young chiefs and royal pages, had become powerful at the court, and Kabaka Mwanga II, who had had dozens of Christians killed in 1885–1887, tried to break them. In August or September 1888 Muslims and Christians together deposed him and enthroned his brother Kiwewa; within weeks the Muslims drove out the Christians and made another brother, Kalema, kabaka. Mwanga escaped and joined the Christian exiles, who won back the capital in October 1889, lost it, and took it for good in February 1890; Kalema withdrew towards Bunyoro. The victors then split into a Catholic party, the Fransa, and a Protestant party, the Ingleza. Frederick Lugard of the Imperial British East Africa Company, who arrived in December 1890, sided with the Protestants, and on 24 January 1892 his Maxim gun decided the battle of Mengo against the Catholics and Mwanga. The settlement that followed divided Buganda’s chieftaincies between the parties, and Buganda became a British protectorate in 1894.
: Krigen mellan det muslimska, det katolska och det protestantiska partiet i kungariket Buganda, som banade väg för brittiskt styre i Uganda. Konvertiter till islam och till de två kristna missionerna, många av dem unga hövdingar och kungliga pager, hade blivit mäktiga vid hovet, och kabaka Mwanga II, som hade låtit döda dussintals kristna 1885–1887, försökte krossa dem. I augusti eller september 1888 avsatte muslimer och kristna honom tillsammans och satte hans bror Kiwewa på tronen; inom några veckor drev muslimerna ut de kristna och gjorde en annan bror, Kalema, till kabaka. Mwanga flydde och anslöt sig till de kristna landsflyktiga, som återtog huvudstaden i oktober 1889, förlorade den och tog den för gott i februari 1890; Kalema drog sig tillbaka mot Bunyoro. Segrarna splittrades sedan i ett katolskt parti, Fransa, och ett protestantiskt parti, Ingleza. Frederick Lugard från Imperial British East Africa Company, som anlände i december 1890, ställde sig på protestanternas sida, och den 24 januari 1892 avgjorde hans Maximkulspruta slaget vid Mengo mot katolikerna och Mwanga. Den uppgörelse som följde fördelade Bugandas hövdingadömen mellan partierna, och Buganda blev brittiskt protektorat 1894.
