Soviet conquest of Khiva and Bukhara: Sovjetiska erövringen av Chiva och Buchara
The overthrow of the last two Central Asian monarchies by the Red Army in 1920. Khiva and Bukhara had been Russian protectorates and became independent in practice after the Russian Revolution. In Khiva, the Turkmen leader Junaid Khan was driven into the desert and the khan abdicated in February 1920; in Bukhara, Mikhail Frunze’s troops stormed the city on 2 September 1920 and the emir fled east and then to Afghanistan. Local reformers, the Young Khivans and Young Bukharans, headed the people’s soviet republics that replaced them, which were divided between new Soviet republics in 1924.: Röda arméns störtande av de två sista centralasiatiska monarkierna 1920. Chiva och Buchara hade varit ryska protektorat och blev i praktiken självständiga efter ryska revolutionen. I Chiva drevs turkmenledaren Junaid Khan ut i öknen och khanen abdikerade i februari 1920; i Buchara stormade Michail Frunzes trupper staden den 2 september 1920, och emiren flydde österut och sedan till Afghanistan. Lokala reformivrare, ungchivanerna och ungbucharerna, ledde de folksovjetrepubliker som ersatte monarkierna och som 1924 delades upp mellan nya sovjetrepubliker.
