# Svenska översättningar av katalogtexten (våg 12); stegtexterna kommer senare.
Bulala wars: Bulalakrigen
The wars in which the Bulala, a pastoral people of the Lake Fitri region, drove the Sayfawa kings out of Kanem, north-east of Lake Chad, and forced them to rebuild their kingdom in Bornu, west of the lake. Taking advantage of a succession war among the Sayfawa, the Bulala king Abd al-Jalil killed Mai Dawud about 1376; between then and about 1389 seven kings fell fighting the Bulala or their Arab allies, and Mai Umar b. Idris abandoned the capital Njimi and Kanem altogether. In Bornu the dynasty survived a century of civil war between two branches of the royal family, while the Bulala built a strong kingdom in Kanem. Mai Ali Gaji ended the civil wars, beat a Bulala raid about 1471 and founded a fortified capital at Ngazargamu; his son Idris Katakarmabe defeated the Bulala and entered Njimi in triumph early in his reign, 122 years after his ancestors had been driven out. He did not move the capital back, and the wars went on at intervals until Idris Alooma’s campaigns of the 1570s.: De krig där bulala, ett herdefolk från trakten kring Fitrisjön, drev sayfawakungarna ut ur Kanem, nordost om Tchadsjön, och tvingade dem att bygga upp sitt rike på nytt i Bornu, väster om sjön. Bulalakungen Abd al-Jalil utnyttjade ett tronföljdskrig inom sayfawadynastin och dödade mai Dawud omkring 1376; mellan dess och omkring 1389 stupade sju kungar i strid mot bulala eller deras arabiska bundsförvanter, och mai Umar b. Idris övergav huvudstaden Njimi och hela Kanem. I Bornu överlevde dynastin ett sekel av inbördeskrig mellan två grenar av kungaätten, medan bulala byggde upp ett starkt rike i Kanem. Mai Ali Gaji gjorde slut på inbördeskrigen, slog tillbaka en bulalaräd omkring 1471 och grundade en befäst huvudstad i Ngazargamu; hans son Idris Katakarmabe besegrade bulala och tågade tidigt under sin regering i triumf in i Njimi, 122 år efter att hans förfäder hade fördrivits därifrån. Han flyttade inte tillbaka huvudstaden, och krigen fortsatte med avbrott fram till Idris Aloomas fälttåg på 1570-talet.
