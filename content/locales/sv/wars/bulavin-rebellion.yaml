Bulavin Rebellion: Bulavinupproret
A rising of Don Cossacks and runaway peasants against Peter the Great’s government, begun in October 1707 when the ataman Kondraty Bulavin and his men killed Prince Yury Dolgorukov, sent to hunt down fugitive serfs on the Don. In 1708 Bulavin took the Don Cossack capital, Cherkassk, but a government army under Yury’s brother Vasily burned Cossack settlements, Bulavin died that July when Cossacks turned against him, and some 2,000 of his followers fled to the Kuban.: Ett uppror bland donkosacker och förrymda bönder mot Peter den stores regering, som började i oktober 1707 när atamanen Kondratij Bulavin och hans män dödade fursten Jurij Dolgorukov, som hade skickats för att jaga förrymda livegna vid Don. År 1708 intog Bulavin donkosackernas huvudstad Tjerkassk, men en regeringsarmé under Jurijs bror Vasilij brände kosackbosättningar, Bulavin dog i juli samma år när kosacker vände sig mot honom, och omkring 2 000 av hans anhängare flydde till Kuban.
