Bulgarian–Latin wars: Bulgarisk-latinska krigen
The wars between the Second Bulgarian Empire and the Latin Empire founded by the Fourth Crusade. Tsar Kaloyan, joined by the Greek nobles of Thrace, destroyed the Latin army at Adrianople in 1205, captured the emperor Baldwin I and ravaged Thrace until his death at Thessalonica in 1207; his successor Boril was beaten by the emperor Henry at Philippopolis in 1208, and peace followed in 1213.: Krigen mellan Andra bulgariska riket och Latinska kejsardömet, som grundats av fjärde korståget. Tsar Kalojan, som fick stöd av de grekiska stormännen i Thrakien, förintade den latinska hären vid Adrianopel 1205, tillfångatog kejsar Balduin I och härjade Thrakien fram till sin död vid Thessalonike 1207; hans efterträdare Boril besegrades av kejsar Henrik vid Philippopolis 1208, och fred slöts 1213.
