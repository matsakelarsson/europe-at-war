Summer 1205: Sommaren 1205
Kaloyan pressed on. On 31 January 1206 he destroyed a Latin force at Rusion, and his armies ravaged Thrace, taking and wrecking towns and carrying off their people. He called himself “the Roman-slayer”, answering the Byzantine emperor Basil II’s name of “Bulgar-slayer”, and the Thracian Greeks, alarmed, turned back to the Latins. Baldwin’s brother Henry, crowned emperor in August 1206, relieved Didymoteicho and won back much of Thrace. In September 1207 Boniface of Thessalonica was killed in a Bulgarian ambush, and Kaloyan besieged Thessalonica, but in October he died in his camp, perhaps murdered.: Kalojan fortsatte framåt. Den 31 januari 1206 förintade han en latinsk styrka vid Rusion, och hans härar härjade Thrakien, intog och ödelade städer och förde bort deras invånare. Han kallade sig ”romardräparen”, som ett svar på den bysantinske kejsaren Basileios II:s tillnamn ”bulgardräparen”, och de thrakiska grekerna vände sig oroade tillbaka till latinarna. Balduins bror Henrik, som kröntes till kejsare i augusti 1206, undsatte Didymoteichon och återvann stora delar av Thrakien. I september 1207 dödades Bonifatius av Thessalonike i ett bulgariskt bakhåll, och Kalojan belägrade Thessalonike, men i oktober dog han i sitt läger, kanske mördad.
His nephew Boril seized the throne and carried on the war. In June 1208 he beat the Latins near Beroe (Stara Zagora), but on 30 June 1208, near Philippopolis, Henry’s army routed him, and the Latins recovered the plain of Philippopolis. Boril’s cousin Alexius Slav, lord of the Rhodopes, went over to the Latins. In 1213 Henry married Boril’s daughter and the two states made peace, which held for the rest of Henry’s reign.: Hans brorson Boril grep tronen och fortsatte kriget. I juni 1208 slog han latinarna nära Beroe (Stara Zagora), men den 30 juni 1208 krossades han nära Philippopolis av Henriks här, och latinarna återtog slätten kring Philippopolis. Borils kusin Alexios Slav, herre över Rhodopebergen, gick över till latinarna. År 1213 gifte sig Henrik med Borils dotter och de två staterna slöt fred, som höll under resten av Henriks regering.
