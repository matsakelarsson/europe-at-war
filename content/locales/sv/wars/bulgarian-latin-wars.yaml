Dates are Julian. The main sources are the crusader chroniclers Geoffrey of Villehardouin and Henry of Valenciennes and the Byzantine historians Niketas Choniates and George Akropolites; numbers of soldiers vary widely between them.: Datum är julianska. De främsta källorna är korsfararkrönikörerna Geoffroi de Villehardouin och Henri de Valenciennes samt de bysantinska historikerna Niketas Choniates och Georgios Akropolites; deras uppgifter om truppernas storlek skiljer sig kraftigt åt.
Fighting between Bulgaria and the Latin Empire flared up again later, notably in the siege of Constantinople of 1235–1236, told under the Nicaean–Latin wars.: Striderna mellan Bulgarien och Latinska kejsardömet blossade upp igen senare, särskilt vid belägringen av Konstantinopel 1235–1236, som skildras under nikaiansk-latinska krigen.
