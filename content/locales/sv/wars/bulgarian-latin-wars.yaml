Kaloyan had offered the crusaders friendship after they took Constantinople in 1204, but the emperor Baldwin I treated him as a rebel against lands that had belonged to the Byzantine Empire. The Greek nobles of Thrace, ill-used by their new Latin lords, rose in February 1205, killed or drove out Latin garrisons in Adrianople and Didymoteicho, and called on Kaloyan for help. Baldwin marched to besiege Adrianople with Count Louis of Blois and the doge Enrico Dandolo before all his forces had gathered.: Kalojan hade erbjudit korsfararna vänskap sedan de intagit Konstantinopel 1204, men kejsar Balduin I behandlade honom som en upprorsman som satt sig över land som hade tillhört Bysantinska riket. De grekiska stormännen i Thrakien, illa behandlade av sina nya latinska herrar, reste sig i februari 1205, dödade eller fördrev de latinska garnisonerna i Adrianopel och Didymoteichon och bad Kalojan om hjälp. Balduin tågade för att belägra Adrianopel tillsammans med greve Ludvig av Blois och dogen Enrico Dandolo innan alla hans styrkor hade samlats.
Kaloyan came south with Bulgarians, Vlachs and a large force of Cuman horsemen. On 14 April 1205 the Cumans drew the Latin knights into a headlong pursuit, and Kaloyan’s army surrounded them. Louis of Blois was killed and Baldwin taken prisoner; he died in captivity at Tarnovo. Villehardouin and Dandolo led the survivors back to Rodosto. In the summer Kaloyan took Serres and much of Thrace, and he destroyed Philippopolis after its Greek leaders had submitted to him.: Kalojan drog söderut med bulgarer, vlaker och en stor styrka kumanska ryttare. Den 14 april 1205 lockade kumanerna de latinska riddarna till en vild förföljelse, och Kalojans här omringade dem. Ludvig av Blois stupade och Balduin togs till fånga; han dog i fångenskap i Tarnovo. Villehardouin och Dandolo ledde de överlevande tillbaka till Rodosto. Under sommaren intog Kalojan Serres och stora delar av Thrakien, och han förstörde Philippopolis sedan stadens grekiska ledare hade underkastat sig honom.
