Hagenbach was tried by judges sent from the towns of the upper Rhine for the crimes of his rule and beheaded. The trial is sometimes called the first international war crimes trial.: Hagenbach dömdes av domare som sänts från städerna vid övre Rhen för brotten under hans styre och halshöggs. Rättegången kallas ibland den första internationella krigsförbrytarrättegången.
