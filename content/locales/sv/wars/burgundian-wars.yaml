Charles the Bold, Duke of Burgundy since 1467, ruled most of the Low Countries as well as the duchy and county of Burgundy, and hoped to join them into a kingdom. In 1469 Sigismund of Austria pledged him the Habsburg lands in Upper Alsace and the Breisgau for 50,000 florins. Charles’s bailiff there, Peter von Hagenbach, ruled harshly and harassed the trade of Basel, Strasbourg and Mulhouse, which turned to Bern for help. In 1474 Sigismund made a lasting peace with his old enemies the Swiss and joined them and the Alsatian towns against Burgundy. The pledged lands rose, and Hagenbach was tried and beheaded at Breisach on 9 May.: Karl den djärve, hertig av Burgund sedan 1467, styrde större delen av Nederländerna liksom hertigdömet och grevskapet Burgund och hoppades kunna förena dem till ett kungarike. År 1469 pantsatte Sigismund av Österrike de habsburgska länderna i Övre Elsass och Breisgau till honom för 50 000 floriner. Karls fogde där, Peter von Hagenbach, styrde hårdhänt och trakasserade handeln i Basel, Strassburg och Mülhausen, som vände sig till Bern för att få hjälp. År 1474 slöt Sigismund en varaktig fred med sina gamla fiender schweizarna och anslöt sig till dem och de elsassiska städerna mot Burgund. De pantsatta länderna reste sig, och Hagenbach ställdes inför rätta och halshöggs i Breisach den 9 maj.
That summer Charles laid siege to Neuss, on the Rhine, to support his ally Archbishop Ruprecht of Cologne against the chapter and towns that had rejected him. The town held out for almost eleven months, and when the Emperor Frederick III came with an imperial army, Charles came to terms and withdrew in June 1475. Meanwhile the Swiss declared war and, with their allies, beat a Burgundian army at Héricourt on 13 November 1474, and in 1475 Bern overran the Vaud, which belonged to Charles’s ally Savoy. Charles made a truce with Louis XI and turned on Lorraine, whose young duke René II had joined his enemies. Nancy fell on 30 November 1475.: Samma sommar belägrade Karl Neuss vid Rhen för att stödja sin bundsförvant ärkebiskop Ruprecht av Köln mot domkapitlet och de städer som hade förkastat honom. Staden höll stånd i nästan elva månader, och när kejsar Fredrik III kom med en riksarmé gjorde Karl upp och drog sig tillbaka i juni 1475. Under tiden förklarade schweizarna krig och slog tillsammans med sina allierade en burgundisk här vid Héricourt den 13 november 1474, och 1475 besatte Bern Vaud, som tillhörde Karls bundsförvant Savojen. Karl slöt stillestånd med Ludvig XI och vände sig mot Lothringen, vars unge hertig René II hade anslutit sig till hans fiender. Nancy föll den 30 november 1475.
