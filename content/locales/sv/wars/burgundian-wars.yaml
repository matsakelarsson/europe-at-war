The Swiss allies were Sigismund of Austria, ruler of Tyrol and the Habsburg lands on the upper Rhine; the Lower Union of Basel, Strasbourg, Colmar, Sélestat and other Alsatian towns; and, from 1475, René II of Lorraine. Louis XI of France paid subsidies but sent no army against Charles until after his death.: Schweizarnas allierade var Sigismund av Österrike, härskare över Tyrolen och de habsburgska länderna vid övre Rhen; Nedre unionen av Basel, Strassburg, Colmar, Sélestat och andra elsassiska städer; samt från 1475 René II av Lothringen. Ludvig XI av Frankrike betalade subsidier men sände ingen här mot Karl förrän efter dennes död.
Places in the Vaud are given their French names, with the German name where English accounts often use it (Morat/Murten).: Orter i Vaud ges sina franska namn, med det tyska namnet där engelskspråkiga framställningar ofta använder det (Morat/Murten).
