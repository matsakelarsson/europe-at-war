René II won back Nancy in October 1476, and Charles, against advice, besieged it again with a much weakened army through a hard winter. René raised an army of Swiss mercenaries, Alsatians and Lorrainers, paid partly with French money, and on 5 January 1477 attacked the Burgundian lines south of the town in snow. While part of the Swiss held the Burgundians in front, a column marched round through the woods and fell on their flank, and the army broke. Charles was killed in the rout. His body, stripped and with the head split open, was found two days later frozen in a pond.: René II återtog Nancy i oktober 1476, och Karl belägrade mot alla råd staden igen med en kraftigt försvagad här under en hård vinter. René samlade en här av schweiziska legosoldater, elsassare och lothringare, delvis betald med franska pengar, och anföll den 5 januari 1477 de burgundiska linjerna söder om staden i snö. Medan en del av schweizarna band burgunderna framifrån gick en kolonn runt genom skogen och föll dem i flanken, och hären bröts sönder. Karl stupade under flykten. Hans kropp, avklädd och med kluvet huvud, hittades två dagar senare fastfrusen i en damm.
His only child, Mary, aged nineteen, inherited his lands. Louis XI at once occupied the duchy of Burgundy and sent troops into Picardy, Artois and Franche-Comté. In Ghent the estates made Mary grant them the Great Privilege, restoring the local liberties her father and grandfather had curbed. In August 1477 she married Maximilian of Habsburg, the Emperor’s son, who took up the war with France. The Swiss gained little land, but their victories made their pikemen the most sought-after mercenaries in Europe.: Hans enda barn, den nittonåriga Maria, ärvde hans länder. Ludvig XI besatte genast hertigdömet Burgund och sände trupper in i Picardie, Artois och Franche-Comté. I Gent tvingade ständerna Maria att bevilja dem Det stora privilegiet, som återställde de lokala friheter som hennes far och farfar hade inskränkt. I augusti 1477 gifte hon sig med Maximilian av Habsburg, kejsarens son, som tog upp kriget mot Frankrike. Schweizarna vann lite land, men deras segrar gjorde deras pikenerare till de mest eftertraktade legosoldaterna i Europa.
