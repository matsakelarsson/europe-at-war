Burgundian Wars: Burgundiska krigen
The wars between Charles the Bold, Duke of Burgundy, and the Swiss Confederates and their allies on the upper Rhine and in Lorraine. Swiss infantry beat the Burgundian army at Grandson and Morat in 1476, and Charles was killed at Nancy in January 1477; his death broke up the Burgundian state, divided between France and the Habsburgs through his daughter Mary’s marriage to Maximilian.: Krigen mellan Karl den djärve, hertig av Burgund, och de schweiziska edsförbundna och deras allierade vid övre Rhen och i Lothringen. Schweiziskt infanteri slog den burgundiska hären vid Grandson och Murten 1476, och Karl stupade vid Nancy i januari 1477; hans död splittrade den burgundiska staten, som delades mellan Frankrike och habsburgarna genom dottern Marias äktenskap med Maximilian.
