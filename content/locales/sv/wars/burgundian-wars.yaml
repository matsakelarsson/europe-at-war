The far outnumbered Burgundians were overwhelmed. A Swiss saying sums up the war — Charles lost his goods at Grandson, his courage at Morat and his blood at Nancy.: "De kraftigt underlägsna burgunderna överväldigades. Ett schweiziskt talesätt sammanfattar kriget: Karl förlorade sitt gods vid Grandson, sitt mod vid Murten och sitt blod vid Nancy."
