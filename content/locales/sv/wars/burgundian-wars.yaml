In February 1476 Charles crossed the Jura with a large army and besieged Grandson, on Lake Neuchâtel, which the Bernese had taken from its Savoyard lord. The garrison of about 400 men surrendered on 28 February, and Charles had them hanged from the trees or drowned in the lake. On 2 March the Swiss army marching to relieve the town ran into the Burgundians a few kilometres to the north-east. As the Swiss columns of pikemen came on, Charles tried to redeploy; the movement turned into panic and his army fled, leaving its guns, tents and the duke’s treasure. Pieces of this “Burgundian booty” are still kept in Swiss museums.: I februari 1476 gick Karl över Jura med en stor här och belägrade Grandson vid Neuchâtelsjön, som berneserna hade tagit från dess savojardiske herre. Garnisonen på omkring 400 man kapitulerade den 28 februari, och Karl lät hänga dem i träden eller dränka dem i sjön. Den 2 mars stötte den schweiziska här som tågade för att undsätta staden på burgunderna några kilometer nordost om den. När de schweiziska pikenerarkolonnerna ryckte fram försökte Karl gruppera om sina styrkor; rörelsen övergick i panik och hans här flydde och lämnade kvar sina kanoner, tält och hertigens skatt. Delar av detta ”burgundiska byte” förvaras än i dag i schweiziska museer.
Charles raised a new army in camp near Lausanne and in June besieged Morat (Murten), held by a Bernese garrison under Adrian von Bubenberg. The Confederates gathered with René of Lorraine and contingents from Alsace and Austria, and on 22 June, after a morning of rain, they stormed the palisade the Burgundians had built facing east. Charles had not expected an attack that day, and his army was caught strung out between its camp and the lake. Thousands were cut down or drowned in Lake Morat; some estimates put the Burgundian dead at 10,000 or more. Savoy soon made its peace with the Swiss and France.: Karl samlade en ny här i ett läger nära Lausanne och belägrade i juni Murten (Morat), som försvarades av en bernsk garnison under Adrian von Bubenberg. De edsförbundna samlades med René av Lothringen och kontingenter från Elsass och Österrike, och den 22 juni, efter en regnig förmiddag, stormade de den palissad som burgunderna hade byggt med front mot öster. Karl hade inte väntat sig något anfall den dagen, och hans här var utspridd mellan lägret och sjön. Tusentals höggs ned eller drunknade i Murtensjön; enligt vissa uppskattningar uppgick de burgundiska förlusterna till 10 000 döda eller fler. Savojen slöt snart fred med schweizarna och Frankrike.
