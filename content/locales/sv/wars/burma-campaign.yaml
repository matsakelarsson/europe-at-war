# Svenska översättningar av katalogtexten (våg 11); stegtexterna kommer senare.
Burma campaign: Fälttåget i Burma
? The fighting for Burma in the Second World War. Japan invaded the British colony from Thailand in December 1941 and January 1942, to cut the Burma Road that carried Allied supplies to China and to guard the flank of its conquests in Malaya, and Burmese nationalists of the Burma Independence Army under Aung San marched in with it, hoping for independence. By May 1942 the British, Indian, Burmese and Chinese armies had been driven out to India and Yunnan, and hundreds of thousands of refugees had fled on foot. Japan built the Burma Railway from Thailand with the forced labour of Allied prisoners and Asian workers, tens of thousands of whom died, and in 1943 declared Burma independent under Ba Maw. Allied counter-attacks in Arakan and Wingate’s Chindit raids in 1943 achieved little, but in 1944 the Japanese offensive into India was broken at Imphal and Kohima, while Chinese and American troops under Stilwell took Myitkyina and reopened the road to China. In 1945 Slim’s Fourteenth Army crossed the Irrawaddy, won at Meiktila and Mandalay and reached Rangoon in May; in March the Burma National Army had turned against the Japanese. Japan’s dead in Burma are estimated at 144,000–164,500, and estimates of Burmese civilian deaths range from about 250,000 to 1 million.
: Striderna om Burma under andra världskriget. Japan invaderade den brittiska kolonin från Thailand i december 1941 och januari 1942 för att skära av Burmavägen, som förde de allierades förnödenheter till Kina, och för att skydda flanken av sina erövringar i Malaya, och burmesiska nationalister i Burmas självständighetsarmé under Aung San marscherade in tillsammans med japanerna i hopp om självständighet. I maj 1942 hade de brittiska, indiska, burmesiska och kinesiska arméerna drivits ut till Indien och Yunnan, och hundratusentals flyktingar hade flytt till fots. Japan byggde Burmajärnvägen från Thailand med tvångsarbete av allierade krigsfångar och asiatiska arbetare, av vilka tiotusentals dog, och förklarade 1943 Burma självständigt under Ba Maw. De allierades motanfall i Arakan och Wingates chinditräder 1943 uträttade föga, men 1944 bröts den japanska offensiven mot Indien vid Imphal och Kohima, medan kinesiska och amerikanska trupper under Stilwell intog Myitkyina och öppnade vägen till Kina igen. 1945 gick Slims fjortonde armé över Irrawaddy, segrade vid Meiktila och Mandalay och nådde Rangoon i maj; i mars hade Burmas nationella armé vänt sig mot japanerna. Japans döda i Burma uppskattas till 144 000–164 500, och uppskattningarna av antalet döda burmesiska civila sträcker sig från omkring 250 000 till 1 miljon.
