# Svenska översättningar av katalogtexten (våg 8); stegtexterna kommer senare.
Burmese invasions of Assam: De burmesiska invasionerna av Assam
Three Burmese invasions of the Ahom kingdom of Assam, and its conquest. Called in by the exiled Ahom viceroy Badan Chandra Borphukan, a Burmese army defeated the Ahoms at Ghiladhari in 1817 and put him in power. A second invasion in 1819 restored King Chandrakanta Singha against his rival Purandar Singha, and when Chandrakanta turned against his patrons, a third invasion in 1821–1822 under Mingimaha Tilowa and Maha Bandula drove him out and ended Ahom rule. Burmese rule, remembered in Assam for its violence, brought the Konbaung empire to the borders of British Bengal. In the First Anglo-Burmese War the East India Company occupied Guwahati in 1824 and took the surrender of Rangpur in January 1825, and in the Treaty of Yandabo (24 February 1826) Burma renounced its claims to Assam and Manipur. Assam passed to British rule.: Tre burmesiska invasioner av ahomriket i Assam, och dess erövring. En burmesisk armé, som tillkallats av den landsflyktige ahomske vicekungen Badan Chandra Borphukan, besegrade ahomerna vid Ghiladhari 1817 och satte honom vid makten. En andra invasion 1819 återinsatte kung Chandrakanta Singha mot hans rival Purandar Singha, och när Chandrakanta vände sig mot sina beskyddare drev en tredje invasion 1821–1822 under Mingimaha Tilowa och Maha Bandula bort honom och gjorde slut på ahomernas välde. Det burmesiska styret, som i Assam är ihågkommet för sitt våld, förde konbaungriket ända fram till gränsen mot det brittiska Bengalen. Under första anglo-burmesiska kriget besatte Brittiska ostindiska kompaniet Guwahati 1824 och tog emot Rangpurs kapitulation i januari 1825, och i fördraget i Yandabo (24 februari 1826) avsade sig Burma sina anspråk på Assam och Manipur. Assam kom under brittiskt styre.
