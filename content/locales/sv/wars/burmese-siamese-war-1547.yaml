# Svenska översättningar av katalogtexten (våg 11); stegtexterna kommer senare.
Burmese–Siamese War (1547–1549): Burmesisk-siamesiska kriget (1547–1549)
The first war between Toungoo Burma and the Siamese kingdom of Ayutthaya, and the first of the Burmese–Siamese wars that went on into the 19th century. According to the Burmese chronicles a Siamese force occupied Tavoy (Dawei), on the Tenasserim coast, by January 1547; a Burmese army retook it later that year. In October 1548, after a succession crisis in Ayutthaya, King Tabinshwehti of Toungoo invaded Siam with about 12,000 men, among them several hundred Portuguese mercenaries, by the Three Pagodas Pass. In a battle outside Ayutthaya, by Thai tradition, Queen Suriyothai was killed on her war elephant shielding her husband, King Maha Chakkraphat. The Burmese could not take the walled island city and withdrew after a month. On the retreat they failed before Kamphaeng Phet but captured the Siamese heir Ramesuan and Prince Thammaracha, who were released under a truce in February 1549 in exchange for two royal war elephants. Tabinshwehti was murdered in 1550; his successor Bayinnaung invaded again in 1563.: Det första kriget mellan Toungoodynastins Burma och det siamesiska kungariket Ayutthaya, och det första av de burmesisk-siamesiska krig som fortsatte in på 1800-talet. Enligt de burmesiska krönikorna hade en siamesisk styrka besatt Tavoy (Dawei) på Tenasserimkusten i januari 1547; en burmesisk armé återtog staden senare samma år. I oktober 1548, efter en tronföljdskris i Ayutthaya, invaderade Toungookungen Tabinshwehti Siam genom Tre pagodernas pass med omkring 12 000 man, bland dem flera hundra portugisiska legosoldater. I ett slag utanför Ayutthaya dödades enligt thailändsk tradition drottning Suriyothai på sin krigselefant när hon skyddade sin make, kung Maha Chakkraphat. Burmeserna kunde inte inta den befästa östaden och drog sig tillbaka efter en månad. Under återtåget misslyckades de framför Kamphaeng Phet men tillfångatog den siamesiske tronarvingen Ramesuan och prins Thammaracha, som släpptes under ett stillestånd i februari 1549 i utbyte mot två kungliga krigselefanter. Tabinshwehti mördades 1550; hans efterträdare Bayinnaung invaderade på nytt 1563.
