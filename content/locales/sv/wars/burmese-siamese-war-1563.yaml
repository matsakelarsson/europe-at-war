# Svenska översättningar av katalogtexten (våg 11); stegtexterna kommer senare.
Burmese–Siamese wars of 1563–1564 and 1568–1569: De burmesisk-siamesiska krigen 1563–1564 och 1568–1569
Two invasions of Siam by Bayinnaung of Toungoo, who had brought the Shan states, Manipur and Lan Na under his rule. In 1563 he demanded one of the Siamese king’s white elephants, the emblems of a universal ruler; when Maha Chakkraphat refused, five Burmese armies took the towns of the north and forced Ayutthaya to surrender in February 1564. Siam became a vassal kingdom, gave up four white elephants and sent hostages to Pegu. In 1568 the former king, allowed home as a monk, renounced the robe and rose in alliance with Setthathirath of Lan Xang, while Maha Thammarachathirat of Phitsanulok stayed loyal to Burma. A Burmese army of about 70,000 besieged Ayutthaya from December 1568, beat a Lao relief army in May 1569, and took the city on 2 August 1569 when a gate was opened from inside. Maha Thammarachathirat was made king of a vassal Siam; Bayinnaung then marched on Vientiane, where the Lao fought a guerrilla war until he withdrew in 1570.: Två invasioner av Siam under Toungookungen Bayinnaung, som hade lagt shanstaterna, Manipur och Lan Na under sitt styre. År 1563 krävde han en av den siamesiske kungens vita elefanter, symbolerna för en universell härskare; när Maha Chakkraphat vägrade intog fem burmesiska arméer städerna i norr och tvingade Ayutthaya att kapitulera i februari 1564. Siam blev ett vasallkungarike, lämnade ifrån sig fyra vita elefanter och sände gisslan till Pegu. År 1568 lade den förre kungen, som hade fått återvända hem som munk, av munkdräkten och reste sig i förbund med Setthathirath av Lan Xang, medan Maha Thammarachathirat av Phitsanulok förblev lojal mot Burma. En burmesisk armé på omkring 70 000 man belägrade Ayutthaya från december 1568, slog en laotisk undsättningsarmé i maj 1569 och intog staden den 2 augusti 1569 när en port öppnades inifrån. Maha Thammarachathirat gjordes till kung över ett Siam i vasallställning; Bayinnaung marscherade sedan mot Vientiane, där laoterna förde ett gerillakrig tills han drog sig tillbaka 1570.
