# Svenska översättningar av katalogtexten (våg 11); stegtexterna kommer senare.
Burmese–Siamese War (1584–1593): Burmesisk-siamesiska kriget (1584–1593)
"The war in which Siam threw off Burmese overlordship. In 1584 Naresuan, the son of Siam’s vassal king Maha Thammarachathirat, led a Siamese army to help Nanda Bayin of Toungoo against a rising at Ava, then withdrew and declared Siam independent on 3 May 1584. Nanda sent five invasions in nine years: a pursuit force beaten at the Sittaung river, an army caught by the floods, attacks from Lan Na in 1586 and 1590–1591, and a siege of Ayutthaya from December 1586 that ended in a disastrous retreat in April 1587. In January 1593 the last Burmese army met Naresuan near Suphanburi; the Burmese crown prince, Mingyi Swa, was killed, in a duel on elephants by the Siamese chronicles, by a gunshot by the Burmese. Siam then took Tavoy and Tenasserim and carried the war into Burma, and the Toungoo empire began to break up.": "Kriget där Siam skakade av sig den burmesiska överhögheten. År 1584 ledde Naresuan, son till Siams vasallkung Maha Thammarachathirat, en siamesisk armé till hjälp åt Toungookungen Nanda Bayin mot en resning i Ava, drog sig sedan tillbaka och förklarade Siam självständigt den 3 maj 1584. Nanda sände fem invasioner på nio år: en förföljande styrka som slogs vid Sittaungfloden, en armé som överraskades av översvämningarna, angrepp från Lan Na 1586 och 1590–1591 och en belägring av Ayutthaya från december 1586 som slutade med ett katastrofalt återtåg i april 1587. I januari 1593 mötte den sista burmesiska armén Naresuan nära Suphanburi; den burmesiske kronprinsen Mingyi Swa dödades, enligt de siamesiska krönikorna i en duell på elefantrygg, enligt de burmesiska av ett skott. Siam tog sedan Tavoy och Tenasserim och förde in kriget i Burma, och Toungooriket började falla sönder."
