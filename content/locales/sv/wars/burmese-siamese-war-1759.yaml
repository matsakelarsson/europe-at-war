# Svenska översättningar av katalogtexten (våg 11); stegtexterna kommer senare.
Burmese–Siamese War (1759–1760): Burmesisk-siamesiska kriget (1759–1760)
Alaungpaya’s invasion of Siam, the first Burmese army to reach Ayutthaya since 1587. Having united Burma, Alaungpaya accused Siam of sheltering Mon rebels and, when the Siamese at Mergui held a ship he claimed as his, left Rangoon on 21 December 1759 with about 40,000 men. His armies took Tavoy, Mergui and Tenasserim, crossed the hills by the Singkhon Pass in March 1760, swept up the Gulf coast through Kuiburi, Phetchaburi and Ratchaburi, and reached Ayutthaya at the end of March. Siam, weakened by quarrels between King Ekkathat and his brother Uthumphon, held out behind its walls. The Burmese burned the suburbs, massacred refugees outside the southern moat on 13 April and shelled the palace, but on 16 April Alaungpaya fell ill, from dysentery by the Burmese chronicles, from a bursting cannon by Siamese and French accounts. The army withdrew by the Mae Sot pass, and Alaungpaya died on the march on 11 May 1760. Burma kept Tavoy; the war prepared the invasion that destroyed Ayutthaya in 1767.: Alaungpayas invasion av Siam, den första burmesiska armé som nådde Ayutthaya sedan 1587. Sedan Alaungpaya hade enat Burma anklagade han Siam för att ge skydd åt monska rebeller, och när siameserna i Mergui höll kvar ett fartyg som han gjorde anspråk på lämnade han Rangoon den 21 december 1759 med omkring 40 000 man. Hans arméer intog Tavoy, Mergui och Tenasserim, gick över bergen genom Singkhonpasset i mars 1760, drog fram längs kusten vid Thailandviken genom Kuiburi, Phetchaburi och Ratchaburi och nådde Ayutthaya i slutet av mars. Siam, försvagat av gräl mellan kung Ekkathat och hans bror Uthumphon, höll ut bakom sina murar. Burmeserna brände förstäderna, massakrerade flyktingar utanför den södra vallgraven den 13 april och besköt palatset, men den 16 april blev Alaungpaya sjuk, av dysenteri enligt de burmesiska krönikorna, av en kanon som sprang enligt siamesiska och franska källor. Armén drog sig tillbaka genom Mae Sot-passet, och Alaungpaya dog under marschen den 11 maj 1760. Burma behöll Tavoy; kriget förberedde den invasion som förstörde Ayutthaya 1767.
