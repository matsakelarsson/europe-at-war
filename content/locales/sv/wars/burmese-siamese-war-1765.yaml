# Svenska översättningar av katalogtexten (våg 11); stegtexterna kommer senare.
Burmese–Siamese War (1765–1767): Burmesisk-siamesiska kriget (1765–1767)
? "The war in which Konbaung Burma destroyed Ayutthaya, the capital of Siam for four centuries. King Hsinbyushin, who had served in his father Alaungpaya’s failed invasion of 1760, first took Lan Na and the Lao kingdoms of Luang Prabang and Vientiane (1763–1765) and the Tenasserim coast (January 1765). In the second half of 1765 two Burmese armies, about 40,000 to 50,000 men in all, invaded Siam: Maha Nawrahta’s from Tavoy in the west and Ne Myo Thihapate’s from Lan Na down the rivers of the north. They met before Ayutthaya in January 1766, beat the Siamese armies sent against them and settled down to a siege that lasted fourteen months, through the floods of the rainy season. Village resistance such as that at Bang Rachan delayed them; a Chinese invasion of Burma from the end of 1765 pressed them to finish. On 7 April 1767 the Burmese undermined and stormed the walls. The city was sacked and burned, King Ekkathat died, and between 30,000 people (by Thai chronicles) and 100,000 (by Burmese) were carried off to Burma. Siam broke up among rival regimes until Taksin, who had broken out of the siege, reunited it."
: "Kriget där Konbaungdynastins Burma förstörde Ayutthaya, Siams huvudstad i fyra århundraden. Kung Hsinbyushin, som hade deltagit i sin far Alaungpayas misslyckade invasion 1760, tog först Lan Na och de laotiska kungarikena Luang Prabang och Vientiane (1763–1765) och Tenasserimkusten (januari 1765). Under andra halvan av 1765 invaderade två burmesiska arméer, sammanlagt omkring 40 000 till 50 000 man, Siam: Maha Nawrahtas från Tavoy i väster och Ne Myo Thihapates från Lan Na nedför floderna i norr. De möttes framför Ayutthaya i januari 1766, slog de siamesiska arméer som sändes mot dem och inledde en belägring som varade i fjorton månader, genom regntidens översvämningar. Motstånd i byar, som det i Bang Rachan, fördröjde dem; en kinesisk invasion av Burma från slutet av 1765 tvingade dem att skynda på. Den 7 april 1767 underminerade och stormade burmeserna murarna. Staden plundrades och brändes, kung Ekkathat dog, och mellan 30 000 människor (enligt thailändska krönikor) och 100 000 (enligt burmesiska) fördes bort till Burma. Siam splittrades mellan rivaliserande regimer tills Taksin, som hade brutit sig ut ur belägringen, återförenade landet."
