# Svenska översättningar av katalogtexten (våg 11); stegtexterna kommer senare.
Burmese–Siamese War (1775–1776): Burmesisk-siamesiska kriget (1775–1776)
? The largest Burmese invasion of Taksin’s Siam, known in Thailand as the war of Athi Wungyi, the Thai name for the Burmese commander Maha Thiha Thura. In 1774 a Mon rising against Burmese rule at Martaban failed and thousands of Mon fled to Siam; in January 1775 Taksin’s army, with the Lan Na lords Kawila of Lampang and Phaya Chaban, who had turned against the Burmese, took Chiang Mai, and Lan Na became a Siamese vassal. A Burmese force of 8,000 that followed the Mon through the Three Pagodas Pass was surrounded at Bangkaeo near Ratchaburi and surrendered on 31 March 1775. In October 1775 Maha Thiha Thura, victor over the Qing at Maymyo, crossed the Mae Lamao pass with about 35,000 men, took Sukhothai and in December besieged Phitsanulok, defended by the brothers Chaophraya Chakri (the later King Rama I) and Chaophraya Surasi. Taksin came north with a river fleet but could not break through; when the Burmese cut his supply lines he fell back from Pakphing to Phichit, and on 15 March 1776 the defenders broke out of Phitsanulok, which the Burmese burned. King Hsinbyushin’s death in June 1776 made Maha Thiha Thura hurry home, and the remaining Burmese troops withdrew in disorder; by September they had left Siam. The war left the northern cities depopulated, but Burma did not regain Lan Na.
: Den största burmesiska invasionen av Taksins Siam, i Thailand känd som Athi Wungyis krig, efter det thailändska namnet på den burmesiske befälhavaren Maha Thiha Thura. År 1774 misslyckades en resning bland monerna mot det burmesiska styret i Martaban, och tusentals moner flydde till Siam; i januari 1775 intog Taksins armé Chiang Mai tillsammans med Lan Na-furstarna Kawila av Lampang och Phaya Chaban, som hade vänt sig mot burmeserna, och Lan Na blev siamesisk vasall. En burmesisk styrka på 8 000 man som följde efter monerna genom Tre pagodernas pass omringades vid Bangkaeo nära Ratchaburi och kapitulerade den 31 mars 1775. I oktober 1775 gick Maha Thiha Thura, segraren över Qingarmén vid Maymyo, över Mae Lamao-passet med omkring 35 000 man, intog Sukhothai och belägrade i december Phitsanulok, som försvarades av bröderna Chaophraya Chakri (den senare kung Rama I) och Chaophraya Surasi. Taksin kom norrut med en flodflotta men kunde inte bryta igenom; när burmeserna skar av hans underhållslinjer drog han sig tillbaka från Pakphing till Phichit, och den 15 mars 1776 bröt sig försvararna ut ur Phitsanulok, som burmeserna brände. Kung Hsinbyushins död i juni 1776 fick Maha Thiha Thura att skynda hem, och de återstående burmesiska trupperna drog sig tillbaka i oordning; i september hade de lämnat Siam. Kriget lämnade de nordliga städerna avfolkade, men Burma återvann inte Lan Na.
