# Svenska översättningar av katalogtexten (våg 11); stegtexterna kommer senare.
Burmese–Siamese War (1809–1812): Burmesisk-siamesiska kriget (1809–1812)
? "The last Burmese invasion of Siam, fought over Phuket island, known as Thalang or Junkceylon, and the tin-rich Andaman coast. In 1809, as King Rama I lay dying (he died in September), Bodawpaya’s commander at Tavoy, the Atwinwun, sent a fleet down the coast: Takua Pa surrendered without a fight, the Burmese crossed from the mainland to Phuket in November 1809 and besieged Thalang, and another army crossed the hills and took Chumphon. The Thalang garrison beat off an assault on the night of 18 November, while the new king, Rama II, sent armies south under his brother, the Front Palace prince Maha Senanurak. The Siamese retook Chumphon in January 1810 and drove that army back towards Takua Pa, but a renewed Burmese assault took Thalang on 13 January 1810; the town was plundered and burnt to the ground and its people fled to the mainland. In March 1810 a Siamese and Malay fleet from Trang and Pak Phra, with the navy of Kedah, whose sultan was compelled to send it, moved against Phuket, and the Burmese abandoned the island. Later Burmese expeditions in May 1810 and at the end of 1811 were wrecked by the monsoon or ran out of supplies, and the war was over by January 1812. Phuket and much of the southern coast were left depopulated for decades; when Burma lost Tenasserim to the British in 1826, the base for these invasions was gone."
: "Den sista burmesiska invasionen av Siam, utkämpad om ön Phuket, som också kallades Thalang eller Junkceylon, och den tennrika Andamankusten. År 1809, när kung Rama I låg för döden (han dog i september), sände Bodawpayas befälhavare i Tavoy, Atwinwun, en flotta söderut längs kusten: Takua Pa kapitulerade utan strid, burmeserna gick över från fastlandet till Phuket i november 1809 och belägrade Thalang, och en annan armé gick över bergen och intog Chumphon. Garnisonen i Thalang slog tillbaka ett anfall natten den 18 november, medan den nye kungen, Rama II, sände arméer söderut under sin bror, Främre palatsets prins Maha Senanurak. Siameserna återtog Chumphon i januari 1810 och drev den armén tillbaka mot Takua Pa, men ett förnyat burmesiskt anfall intog Thalang den 13 januari 1810; staden plundrades och brändes ned till grunden, och dess invånare flydde till fastlandet. I mars 1810 gick en siamesisk-malajisk flotta från Trang och Pak Phra, tillsammans med Kedahs flotta, som sultanen hade tvingats sända, mot Phuket, och burmeserna övergav ön. Senare burmesiska expeditioner i maj 1810 och i slutet av 1811 slogs sönder av monsunen eller fick slut på förnödenheter, och i januari 1812 var kriget över. Phuket och stora delar av sydkusten förblev avfolkade i årtionden; när Burma förlorade Tenasserim till britterna 1826 försvann basen för dessa invasioner."
