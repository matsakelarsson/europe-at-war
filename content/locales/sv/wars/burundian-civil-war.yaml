# Svenska översättningar av katalogtexten (våg 13); stegtexterna kommer senare.
Burundian Civil War: Inbördeskriget i Burundi
? "The civil war in Burundi that followed the murder of the country’s first elected Hutu president, Melchior Ndadaye, by Tutsi army officers on 21 October 1993, and was fought between the Tutsi-dominated army and Hutu rebel movements, chiefly the CNDD-FDD and PALIPEHUTU-FNL. In the weeks after the coup Hutu peasants and local officials killed Tutsi neighbours and the army killed Hutu in reprisal; estimates for the first year range from 50,000 to 100,000 dead. Ndadaye’s successor, Cyprien Ntaryamira, died in the plane shot down over Kigali on 6 April 1994 with Rwanda’s president, and the war grew alongside the Rwandan genocide and the Congo wars: Hutu rebels used bases in Zaire, while Tutsi militias and the army fought them in the hills and in Bujumbura. Major Pierre Buyoya took power in a coup on 25 July 1996, and Burundi’s neighbours imposed an embargo. Peace talks at Arusha, led by Julius Nyerere and after his death by Nelson Mandela, produced the Arusha Peace and Reconciliation Agreement of 28 August 2000, which the main rebel groups did not sign at first. South African troops, an African Union mission and from 2004 a UN operation supported a transition; the CNDD-FDD signed a ceasefire on 3 December 2002 and joined the government in 2003, and after elections its leader, Pierre Nkurunziza, was sworn in as president on 26 August 2005, the date usually taken as the end of the war. The FNL fought on until a ceasefire in 2006, renewed fighting in 2008 and its disarmament in 2009. About 300,000 people were killed in the war, and hundreds of thousands fled to Tanzania."
: "Det inbördeskrig i Burundi som följde på att landets förste valde hutupresident, Melchior Ndadaye, mördades av tutsiska arméofficerare den 21 oktober 1993, och som utkämpades mellan den tutsidominerade armén och huturebellrörelser, främst CNDD-FDD och PALIPEHUTU-FNL. Under veckorna efter kuppen dödade hutubönder och lokala tjänstemän sina grannar som var tutsier, och armén dödade hutuer som hämnd; uppskattningarna för det första året varierar från 50 000 till 100 000 döda. Ndadayes efterträdare Cyprien Ntaryamira omkom i det plan som sköts ned över Kigali den 6 april 1994 tillsammans med Rwandas president, och kriget växte i takt med folkmordet i Rwanda och Kongokrigen: huturebeller använde baser i Zaire, medan tutsimiliser och armén bekämpade dem i bergen och i Bujumbura. Major Pierre Buyoya tog makten genom en statskupp den 25 juli 1996, och Burundis grannländer införde ett embargo. Fredsförhandlingar i Arusha, ledda av Julius Nyerere och efter hans död av Nelson Mandela, ledde fram till Arushaavtalet om fred och försoning den 28 augusti 2000, som de viktigaste rebellgrupperna till en början inte undertecknade. Sydafrikanska trupper, en insats från Afrikanska unionen och från 2004 en FN-insats stödde en övergångsperiod; CNDD-FDD undertecknade en vapenvila den 3 december 2002 och gick in i regeringen 2003, och efter val svors dess ledare Pierre Nkurunziza in som president den 26 augusti 2005, det datum som vanligen räknas som krigets slut. FNL fortsatte att strida fram till en vapenvila 2006, återupptog striderna 2008 och avväpnades 2009. Omkring 300 000 människor dödades i kriget, och hundratusentals flydde till Tanzania."
