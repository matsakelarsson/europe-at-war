# Svenska översättningar av katalogtexten (våg 14); stegtexterna kommer senare.
Bussa’s Rebellion: Bussas uppror
? "The largest rising of enslaved people in the history of Barbados, named after Bussa, an African-born man who was head ranger on Bayley’s plantation in the parish of Saint Philip. Enslaved Barbadians had followed the British debates on slavery and on the Imperial Registry Bill, a plan to register every enslaved person that the island’s House of Assembly rejected in November 1815, and many believed that freedom had been granted in London and was being withheld by the planters. Planned on the estates of Saint Philip in the first months of 1816 by Bussa, the drivers Jackey and King Wiltshire, John and Nanny Grigg, the free man Joseph Pitt Washington Franklin and others, the rising began on the night of Easter Sunday, 14 April 1816, with the burning of cane fields, and spread across Saint Philip into Christ Church, Saint John, Saint George and Saint Thomas. Martial law was declared on 15 April. The island militia and British troops, among them the 1st West India Regiment, whose soldiers were Black, defeated the rebels near Bayley’s plantation on 16 April, and Bussa was killed in the fighting. One soldier and one white civilian died on the colonial side. The reprisals were heavy: in the figures used by the UK National Archives about 50 rebels died in battle, 70 were executed in the field, 144 were executed after trial and 132 were transported from the island, while other counts give 214 executed and 170 exiled. The rising was the first of three great revolts in the British Caribbean before emancipation, followed by Demerara in 1823 and the Baptist War in Jamaica in 1831–1832. Barbados named Bussa a National Hero in 1998, and the Emancipation Statue unveiled near Bridgetown in 1985 is popularly called the Bussa statue."
: "Den största resningen bland förslavade i Barbados historia, uppkallad efter Bussa, en afrikanskfödd man som var överuppsyningsman på Bayleys plantage i socknen Saint Philip. Förslavade barbadier hade följt de brittiska debatterna om slaveriet och om Imperial Registry Bill, ett förslag om att registrera varje förslavad person som öns lagstiftande församling avvisade i november 1815, och många trodde att friheten hade beviljats i London men undanhölls av plantageägarna. Resningen planerades på plantagerna i Saint Philip under de första månaderna 1816 av Bussa, förmännen Jackey och King Wiltshire, John och Nanny Grigg, den frie mannen Joseph Pitt Washington Franklin och andra. Den började under natten på påskdagen, den 14 april 1816, med att sockerrörsfält sattes i brand, och spred sig över Saint Philip till Christ Church, Saint John, Saint George och Saint Thomas. Krigslagar utlystes den 15 april. Öns milis och brittiska trupper, bland dem 1st West India Regiment, vars soldater var svarta, besegrade rebellerna nära Bayleys plantage den 16 april, och Bussa dödades i striderna. En soldat och en vit civilperson dog på den koloniala sidan. Repressalierna var hårda: enligt de siffror som brittiska National Archives använder dog omkring 50 rebeller i strid, 70 avrättades på fältet, 144 avrättades efter rättegång och 132 deporterades från ön, medan andra beräkningar anger 214 avrättade och 170 landsförvisade. Resningen var den första av tre stora revolter i brittiska Karibien före slavfrigörelsen, följd av Demerara 1823 och baptistkriget på Jamaica 1831–1832. Barbados utsåg Bussa till nationalhjälte 1998, och emancipationsstatyn som avtäcktes nära Bridgetown 1985 kallas i folkmun Bussastatyn."
