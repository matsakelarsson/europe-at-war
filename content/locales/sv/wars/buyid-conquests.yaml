# Svenska översättningar av katalogtexten (våg 7); stegtexterna kommer senare.
Buyid conquests: Buyidernas erövringar
The rise of the Buyids, three brothers from Daylam south of the Caspian Sea who began as officers of Daylamite warlords and within twelve years ruled western Iran and Iraq. Ali ibn Buya took Fars in 934, his brother Hasan won the Jibal from the Ziyarids with Isfahan and Rayy, and the youngest, Ahmad, took Khuzestan and in December 945 entered Baghdad, where he deposed the caliph and made his successors figureheads under Buyid protection. A Hamdanid attempt to take Baghdad from him failed in 946.: "Buyidernas uppgång: tre bröder från Daylam söder om Kaspiska havet som började som officerare hos daylamitiska krigsherrar och inom tolv år härskade över västra Iran och Irak. Ali ibn Buya intog Fars 934, hans bror Hasan erövrade Jibal med Isfahan och Rayy från ziyariderna, och den yngste, Ahmad, intog Khuzestan och tågade i december 945 in i Bagdad, där han avsatte kalifen och gjorde hans efterträdare till galjonsfigurer under buyidiskt beskydd. Ett hamdanidiskt försök att ta Bagdad från honom misslyckades 946."
