Byzantine–Angevin war in Albania: Bysantinsk-angevinska kriget i Albanien
The war in which Charles of Anjou, king of Sicily and heir by treaty to the claims of the Latin emperors, sent an army from his Albanian possessions to attack the restored Byzantine Empire. His troops under Hugh of Sully besieged the Byzantine fortress of Berat from 1280, but in the spring of 1281 a relief army under Michael Tarchaneiotes captured Sully in an ambush and routed his army, which fled to the coast. The Byzantines recovered much of inland Albania, and Charles’s plans for a larger expedition against Constantinople were ended by the Sicilian Vespers in 1282.: Kriget där Karl av Anjou, kung av Sicilien och genom fördrag arvtagare till de latinska kejsarnas anspråk, sände en här från sina albanska besittningar för att angripa det återupprättade Bysantinska riket. Hans trupper under Hugo av Sully belägrade den bysantinska fästningen Berat från 1280, men våren 1281 tillfångatog en undsättningshär under Mikael Tarchaneiotes Sully i ett bakhåll och skingrade hans här, som flydde till kusten. Bysantinerna återtog en stor del av Albaniens inland, och Karls planer på en större expedition mot Konstantinopel omintetgjordes av sicilianska aftonsången 1282.
