In 894 Stylianos Zaoutzes, the chief minister of the Emperor Leo VI, let two merchants with links to his household move the market for Bulgarian traders from Constantinople to Thessalonica, where they paid heavier duties. Simeon, who had become ruler of Bulgaria the year before after studying in Constantinople, protested and was ignored. That autumn he invaded Byzantine Thrace and defeated an army under Prokopios Krenites and Kourtikios, who were both killed. He had the noses of the captured Khazar guardsmen cut off and sent them back to Constantinople.: År 894 lät Stylianos Zaoutzes, kejsar Leon VI:s främste minister, två köpmän med band till hans hushåll flytta de bulgariska handelsmännens marknad från Konstantinopel till Thessalonike, där de fick betala högre tullar. Simeon, som hade blivit Bulgariens härskare året innan efter studier i Konstantinopel, protesterade men ignorerades. Samma höst föll han in i det bysantinska Thrakien och besegrade en här under Prokopios Krenites och Kourtikios, som båda stupade. Han lät skära av näsorna på de tillfångatagna khazariska gardisterna och skickade tillbaka dem till Konstantinopel.
Leo paid the Magyars, then living on the steppes between the Dnieper and the Danube, to attack Bulgaria from the north. In 895 a Byzantine fleet ferried them across the Danube while Nikephoros Phokas the Elder threatened Bulgaria from the south. The Magyars beat Simeon, who shut himself up in Dristra, and plundered the country up to Preslav. Simeon bought time with talks about prisoners, then made an alliance with the Pechenegs. In 896, or perhaps late 895, his army beat the Magyars on the Southern Buh while the Pechenegs ravaged their homeland.: Leon betalade magyarerna, som då levde på stäppen mellan Dnepr och Donau, för att anfalla Bulgarien norrifrån. År 895 färjade en bysantinsk flotta dem över Donau medan Nikeforos Fokas den äldre hotade Bulgarien söderifrån. Magyarerna besegrade Simeon, som stängde in sig i Dristra, och plundrade landet ända fram till Preslav. Simeon vann tid med förhandlingar om fångar och slöt sedan förbund med petjenegerna. År 896, eller kanske sent 895, besegrade hans här magyarerna vid Södra Bug medan petjenegerna härjade deras hemland.
