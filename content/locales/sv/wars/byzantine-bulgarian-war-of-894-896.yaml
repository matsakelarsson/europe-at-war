Simeon beat a hastily raised Byzantine army, including the emperor’s Khazar guard, somewhere in Thrace, probably near Adrianople. Both Byzantine commanders were killed.: Simeon besegrade en hastigt uppbådad bysantinsk här, däribland kejsarens khazariska garde, någonstans i Thrakien, troligen nära Adrianopel. Båda de bysantinska befälhavarna stupade.
Simeon defeated in the Dobruja: Simeon besegras i Dobrudzja
The Magyars, carried over the Danube by Byzantine ships, routed Simeon’s army. The site is not recorded.: Magyarerna, som förts över Donau av bysantinska fartyg, slog Simeons här på flykten. Platsen är inte känd.
Dristra: Dristra
Simeon took refuge in the fortress on the Danube while the Magyars plundered the country. They sold many of their captives to the Byzantines.: Simeon tog sin tillflykt till fästningen vid Donau medan magyarerna plundrade landet. De sålde många av sina fångar till bysantinerna.
