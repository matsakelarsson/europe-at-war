The main sources are the Byzantine chronicle of Theophanes Continuatus, Constantine VII’s De administrando imperio, written some fifty years later, and Simeon’s own letters to the Byzantine envoy Leo Choirosphaktes. They give few places and dates; the battle on the Southern Buh is dated to 895 or 896, and its site is unknown.: De främsta källorna är den bysantinska krönikan Theophanes Continuatus, Konstantin VII:s De administrando imperio, skriven omkring femtio år senare, och Simeons egna brev till det bysantinska sändebudet Leon Choirosfaktes. De anger få platser och datum; slaget vid Södra Bug dateras till 895 eller 896, och var det stod är okänt.
Bulgarophygon is today’s Babaeski in Turkish Thrace, and Dristra is Silistra on the Danube. The war is sometimes called the first trade war in Europe; many historians think Simeon was defending his merchants rather than looking for a pretext.: Bulgarofygon är dagens Babaeski i turkiska Thrakien, och Dristra är Silistra vid Donau. Kriget kallas ibland Europas första handelskrig; många historiker anser att Simeon försvarade sina köpmän snarare än sökte en förevändning.
The Magyars’ move into the Carpathian Basin that followed is told in the Hungarian conquest of the Carpathian Basin.: Magyarernas flytt in i Karpaterbäckenet, som följde, skildras under ungrarnas erövring av Karpaterbäckenet.
