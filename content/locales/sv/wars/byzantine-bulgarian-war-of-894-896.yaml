Byzantine–Bulgarian war of 894–896: Bysantinsk-bulgariska kriget 894–896
A war that began when the Byzantine government moved the Bulgarian merchants’ market from Constantinople to Thessalonica. Simeon I of Bulgaria invaded Thrace; the Byzantines brought in the Magyars, who ravaged Bulgaria, but Simeon and the Pechenegs drove the Magyars from their steppe homeland and in 896 he routed the Byzantine army at Bulgarophygon, winning a yearly tribute.: Ett krig som började när den bysantinska regeringen flyttade de bulgariska köpmännens marknad från Konstantinopel till Thessalonike. Simeon I av Bulgarien invaderade Thrakien; bysantinerna kallade in magyarerna, som härjade Bulgarien, men Simeon och petjenegerna drev magyarerna från deras hemland på stäppen, och 896 krossade han den bysantinska hären vid Bulgarofygon och vann en årlig tribut.
