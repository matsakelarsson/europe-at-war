A hard-fought Bulgarian victory somewhere on the river in today’s Ukraine. One account says it cost the victors 20,000 horsemen.: En hårt tillkämpad bulgarisk seger någonstans vid floden i nuvarande Ukraina. Enligt en uppgift kostade den segrarna 20 000 ryttare.
