With the Magyars gone, Simeon demanded that the Byzantines return all their Bulgarian prisoners. Leo, at war with the Arabs in the east and without Nikephoros Phokas, who had died or fallen from favour, gave way. Simeon then claimed that not all had been sent back and in the summer of 896 invaded Thrace again. The Byzantines made a truce in the east and brought over the armies of Asia Minor under the Domestic of the Schools, Leo Katakalon. At Bulgarophygon the Bulgarians routed them; the second-in-command, the protovestiarios Theodosios, was among the dead, and Katakalon escaped with a few men.: När magyarerna var borta krävde Simeon att bysantinerna skulle lämna tillbaka alla sina bulgariska fångar. Leon, som var i krig med araberna i öster och saknade Nikeforos Fokas, som hade dött eller fallit i onåd, gav efter. Simeon hävdade sedan att inte alla hade skickats tillbaka och föll sommaren 896 åter in i Thrakien. Bysantinerna slöt stillestånd i öster och förde över Mindre Asiens härar under Leon Katakalon, domestikos ton scholon. Vid Bulgarofygon slog bulgarerna dem på flykten; den näst högste befälhavaren, protovestiarios Theodosios, var bland de stupade, och Katakalon kom undan med några få man.
An Arab historian, al-Tabari, writes that the Bulgarians then marched on Constantinople and that Leo considered arming Arab prisoners against them. In the peace that followed the market returned to Constantinople and Byzantium agreed to pay Bulgaria a yearly tribute. Bulgaria gained land between the Strandzha mountains and the Black Sea and released its captives, said to number 120,000. The peace lasted until Leo’s death in 912, apart from 904, when Simeon used the Arab sack of Thessalonica to win more of Macedonia.: En arabisk historiker, al-Tabari, skriver att bulgarerna därefter tågade mot Konstantinopel och att Leon övervägde att beväpna arabiska fångar mot dem. I den fred som följde flyttades marknaden tillbaka till Konstantinopel och Bysans gick med på att betala Bulgarien en årlig tribut. Bulgarien vann land mellan Strandzjabergen och Svarta havet och släppte sina fångar, som sägs ha uppgått till 120 000. Freden varade till Leons död 912, bortsett från 904, då Simeon utnyttjade arabernas plundring av Thessalonike för att vinna mer av Makedonien.
