In 912 the new emperor Alexander sent Simeon’s envoys away with threats, ending the peace of 896. Alexander died in June 913, leaving his seven-year-old nephew Constantine VII under a regency led by Patriarch Nicholas Mystikos. In August Simeon arrived before Constantinople with a large army. He knew he could not take the city without ships, and soon opened talks. Nicholas came out to his camp and crowned him, perhaps with his own patriarchal headdress, and the regents seem to have agreed that Constantine would marry one of Simeon’s daughters, which could have made Simeon the boy emperor’s guardian.: År 912 skickade den nye kejsaren Alexander bort Simeons sändebud med hotelser och bröt därmed freden från 896. Alexander dog i juni 913 och lämnade efter sig sin sjuårige brorson Konstantin VII under en förmyndarregering ledd av patriarken Nikolaos Mystikos. I augusti kom Simeon till Konstantinopel med en stor här. Han visste att han inte kunde inta staden utan fartyg och inledde snart förhandlingar. Nikolaos kom ut till hans läger och krönte honom, kanske med sin egen patriarkala huvudbonad, och förmyndarna tycks ha gått med på att Konstantin skulle gifta sig med en av Simeons döttrar, vilket kunde ha gjort Simeon till den unge kejsarens förmyndare.
Byzantine writers later presented the coronation as a sham, but Simeon called himself emperor from then on. In February 914 Constantine’s mother, Zoe Karbonopsina, overthrew the regency and revoked the agreement. Simeon invaded Thrace that summer while his troops pressed on Thessalonica and Dyrrhachium. In September the Armenian commander of Adrianople surrendered the city to him, but the Byzantines soon bought it back.: Bysantinska skribenter framställde senare kröningen som ett skådespel, men Simeon kallade sig kejsare från och med då. I februari 914 störtade Konstantins mor, Zoe Karbonopsina, förmyndarregeringen och upphävde överenskommelsen. Simeon föll in i Thrakien samma sommar medan hans trupper satte press på Thessalonike och Dyrrachion. I september överlämnade Adrianopels armeniske befälhavare staden till honom, men bysantinerna köpte snart tillbaka den.
