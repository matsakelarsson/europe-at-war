Simeon: Simeon
Simeon had spent years installing and deposing Serbian princes as the Byzantines bribed them to change sides. When Prince Zaharija killed two Bulgarian generals and sent their heads to Constantinople, a large army invaded Serbia in 924. Zaharija fled to Croatia; the Serbian župans who came to pay homage to Simeon’s candidate, Časlav, were arrested, and Serbia was annexed. In September Simeon camped once more before Constantinople and met Romanos I at Kosmidion, outside the walls. Neither side’s account of the talks survives in full, but the war in Thrace largely stopped, and Simeon soon styled himself emperor of the Bulgarians and the Romans.: Simeon hade i åratal insatt och avsatt serbiska furstar medan bysantinerna mutade dem att byta sida. När fursten Zaharija dödade två bulgariska generaler och skickade deras huvuden till Konstantinopel föll en stor här in i Serbien 924. Zaharija flydde till Kroatien; de serbiska županerna som kom för att hylla Simeons kandidat, Časlav, greps, och Serbien annekterades. I september slog Simeon än en gång läger framför Konstantinopel och mötte Romanos I vid Kosmidion, utanför murarna. Ingen av parternas redogörelse för samtalen finns bevarad i sin helhet, men kriget i Thrakien upphörde i stort sett, och Simeon kallade sig snart bulgarernas och romarnas kejsare.
Annexing Serbia brought Bulgaria up against Croatia, whose king, Tomislav, was a Byzantine ally. In 926 a Bulgarian army sent into Croatia was destroyed, and papal envoys arranged a peace. Simeon died on 27 May 927 while preparing another attack on Constantinople. His son Peter I, guided by his uncle George Sursuvul, made peace. On 8 October 927 Peter married Maria, the granddaughter of Romanos I. Byzantium recognised his title of emperor (tsar), recognised the head of the Bulgarian church as a patriarch and resumed a yearly payment, and the frontier went back roughly to that of 904.: Annekteringen av Serbien gjorde Bulgarien till granne med Kroatien, vars kung Tomislav var bundsförvant till Bysans. År 926 förintades en bulgarisk här som sänts in i Kroatien, och påvliga sändebud förmedlade en fred. Simeon dog den 27 maj 927 medan han förberedde ännu ett anfall mot Konstantinopel. Hans son Peter I, vägledd av sin morbror Georgios Sursuvul, slöt fred. Den 8 oktober 927 gifte sig Peter med Maria, Romanos I:s sondotter. Bysans erkände hans kejsartitel (tsar), erkände den bulgariska kyrkans överhuvud som patriark och återupptog en årlig betalning, och gränsen återgick ungefär till den från 904.
