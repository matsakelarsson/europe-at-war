After deposing a series of Serbian princes, Simeon made Serbia a Bulgarian province. It regained its independence under Časlav in the 930s.: Sedan Simeon avsatt en rad serbiska furstar gjorde han Serbien till en bulgarisk provins. Landet återfick sin självständighet under Časlav på 930-talet.
Kosmidion: Kosmidion
9 September 924: 9 september 924
Simeon and Romanos I met on a specially built platform outside the walls. Byzantine writers say the emperor shamed Simeon with a sermon; many historians think he recognised Simeon’s imperial title.: Simeon och Romanos I möttes på en särskilt byggd plattform utanför murarna. Bysantinska skribenter säger att kejsaren kom Simeon att skämmas med en predikan; många historiker anser att han erkände Simeons kejsartitel.
Battle of the Bosnian Highlands: Slaget i de bosniska högländerna
King Tomislav’s Croats destroyed a Bulgarian army under Alogobotur. The site, somewhere in the mountains of eastern Bosnia, is unknown, and the date of 27 May given in some modern works is not certain.: Kung Tomislavs kroater förintade en bulgarisk här under Alogobotur. Platsen, någonstans i bergen i östra Bosnien, är okänd, och datumet 27 maj som anges i vissa moderna verk är inte säkert.
Peace of 927: Freden 927
8 October 927: 8 oktober 927
Peter I married Maria Lekapene in Constantinople, and the empire recognised the Bulgarian ruler as emperor.: Peter I gifte sig med Maria Lekapene i Konstantinopel, och riket erkände den bulgariske härskaren som kejsare.
