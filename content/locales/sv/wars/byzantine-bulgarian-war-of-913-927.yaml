The city’s commander handed it over, and the townspeople recognised Simeon as their ruler. The regency of Zoe recovered it for a large payment.: Stadens befälhavare överlämnade den, och invånarna erkände Simeon som sin härskare. Zoes förmyndarregering återvann den mot en stor betalning.
Simeon, 913: Simeon, 913
In 917 Zoe’s government made peace with the Arabs and gathered the whole army of the empire under the Domestic of the Schools, Leo Phokas. The fleet under Romanos Lekapenos was to carry Pechenegs across the Danube to attack from the north, but Romanos and the envoy John Bogas quarrelled and the Pechenegs never crossed. Leo marched up the Black Sea coast alone. On 20 August, by the river Achelous near Anchialos, the Byzantines were at first winning, but when Leo lost his horse panic spread, and Simeon led his cavalry down from the hills. The army was destroyed; Leo the Deacon wrote of piles of bones still visible there decades later.: År 917 slöt Zoes regering fred med araberna och samlade rikets hela här under domestikos ton scholon Leon Fokas. Flottan under Romanos Lekapenos skulle föra petjeneger över Donau för att anfalla norrifrån, men Romanos och sändebudet Johannes Bogas grälade och petjenegerna gick aldrig över. Leon tågade ensam norrut längs Svartahavskusten. Den 20 augusti vid floden Acheloos nära Anchialos var bysantinerna först på väg att vinna, men när Leon förlorade sin häst spred sig paniken, och Simeon ledde sitt kavalleri ned från höjderna. Hären förintades; Leon Diakonen skrev om högar av ben som ännu syntes där årtionden senare.
That autumn Leo Phokas raised another army, and the Bulgarians destroyed it in a night attack at Katasyrtai, close to Constantinople. In 919 Romanos Lekapenos took power, married his daughter to Constantine VII and in 920 was crowned senior emperor, the place Simeon wanted for himself. Simeon refused to deal with him. His armies reached the Isthmus of Corinth, camped on the Dardanelles in 920, routed the Byzantines at Pegae outside Constantinople in 921 and burned imperial palaces near the city in 922.: Samma höst samlade Leon Fokas ännu en här, och bulgarerna förintade den i ett nattligt anfall vid Katasyrtai, nära Konstantinopel. År 919 tog Romanos Lekapenos makten, gifte bort sin dotter med Konstantin VII och kröntes 920 till senior kejsare, den plats som Simeon ville ha för egen del. Simeon vägrade att förhandla med honom. Hans härar nådde Korinthiska näset, slog läger vid Dardanellerna 920, slog bysantinerna på flykten vid Pegai utanför Konstantinopel 921 och brände kejserliga palats nära staden 922.
