One of the worst defeats in Byzantine history. Almost the whole army was killed or captured; Leo Phokas escaped to Mesembria.: Ett av de värsta nederlagen i Bysans historia. Nästan hela hären dödades eller tillfångatogs; Leon Fokas flydde till Mesembria.
