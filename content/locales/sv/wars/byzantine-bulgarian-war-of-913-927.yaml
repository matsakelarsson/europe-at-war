Byzantine–Bulgarian war of 913–927: Bysantinsk-bulgariska kriget 913–927
Simeon I of Bulgaria’s war to win the throne of Constantinople. He extracted an imperial coronation from the regents of the boy emperor Constantine VII in 913, destroyed the Byzantine army at Achelous in 917 and raided Thrace and Greece for years, but without a fleet he could not take the city. After his death in 927 his son Peter made a peace that recognised him as emperor (tsar) of the Bulgarians.: Simeon I av Bulgariens krig för att vinna tronen i Konstantinopel. Han avtvingade förmyndarna för den unge kejsaren Konstantin VII en kejsarkröning 913, förintade den bysantinska hären vid Acheloos 917 och härjade i åratal Thrakien och Grekland, men utan flotta kunde han inte inta staden. Efter hans död 927 slöt sonen Peter en fred som erkände honom som bulgarernas kejsare (tsar).
