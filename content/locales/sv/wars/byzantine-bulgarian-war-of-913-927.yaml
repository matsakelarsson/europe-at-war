Almost all the narrative comes from Byzantine chroniclers hostile to Simeon, above all Theophanes Continuatus, with the letters that Patriarch Nicholas Mystikos and Romanos I wrote to him. What Simeon was crowned in 913, and what Romanos conceded in 924, are disputed; many historians think Simeon was crowned emperor of the Bulgarians, not of the Romans.: Nästan hela berättelsen kommer från bysantinska krönikörer som var fientliga mot Simeon, framför allt Theophanes Continuatus, samt de brev som patriarken Nikolaos Mystikos och Romanos I skrev till honom. Vad Simeon kröntes till 913, och vad Romanos medgav 924, är omstritt; många historiker anser att Simeon kröntes till bulgarernas kejsare, inte romarnas.
The size of the armies at Achelous is not known; figures such as 60,000 for the Byzantines are modern guesses. Anchialos is today’s Pomorie, and Katasyrtai was a place near Constantinople whose site is unknown.: Härarnas storlek vid Acheloos är inte känd; siffror som 60 000 för bysantinerna är moderna gissningar. Anchialos är dagens Pomorie, och Katasyrtai var en plats nära Konstantinopel vars läge är okänt.
The Croatian victory of 926 is told in its own entry, the Croatian–Bulgarian war.: Den kroatiska segern 926 skildras i en egen artikel, kroatisk-bulgariska kriget.
