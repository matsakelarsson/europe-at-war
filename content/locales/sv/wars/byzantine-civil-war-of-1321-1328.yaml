Byzantine civil war of 1321–1328: Bysantinska inbördeskriget 1321–1328
A struggle for the throne between the elderly Emperor Andronikos II Palaiologos and his grandson Andronikos III, whom he had disinherited in 1320. Backed by ambitious young nobles such as John Kantakouzenos, Syrgiannes Palaiologos and Theodore Synadenos, the younger Andronikos raised Thrace against his grandfather in 1321 and forced him to share the empire. Fighting flared up again in 1322 and in 1327–1328, when the Serbian king Stefan Dečanski backed the old emperor and the Bulgarian tsar Michael Shishman the young one. Thessalonica went over to Andronikos III early in 1328, and on the night of 23–24 May he entered Constantinople; his grandfather abdicated and died as a monk in 1332. While the Byzantines fought each other, the Ottomans took Prusa (Bursa) in 1326.: En tronstrid mellan den åldrade kejsaren Andronikos II Palaiologos och hans sonson Andronikos III, som han hade gjort arvlös 1320. Med stöd av ärelystna unga adelsmän som Johannes Kantakouzenos, Syrgiannes Palaiologos och Theodoros Synadenos fick den yngre Andronikos Thrakien att resa sig mot farfadern 1321 och tvingade honom att dela riket. Striderna blossade upp igen 1322 och 1327–1328, då den serbiske kungen Stefan Dečanski stödde den gamle kejsaren och den bulgariske tsaren Mikael Sjisjman den unge. Thessalonike gick över till Andronikos III i början av 1328, och natten mellan den 23 och 24 maj tågade han in i Konstantinopel; farfadern abdikerade och dog som munk 1332. Medan bysantinerna stred mot varandra intog osmanerna Prusa (Bursa) 1326.
