The regency bought Bulgarian help with Philippopolis and other towns in northern Thrace, and courted the Rhodope warlord Momchil, a former brigand. On 7 July 1345 Kantakouzenos and Umur crushed Momchil at Peritheorion on the Aegean coast, and he was killed. Weeks earlier, on 11 June, Apokaukos had been murdered by political prisoners in the new prison he was inspecting in Constantinople. Dušan took Serres in September and was crowned emperor in 1346. Kantakouzenos had himself crowned at Adrianople on 21 May 1346 and married his daughter Theodora to the Ottoman ruler Orhan, whose troops plundered Thrace.: Förmyndarregeringen köpte bulgarisk hjälp med Philippopolis och andra städer i norra Thrakien och uppvaktade krigsherren Momtjil i Rhodopebergen, en före detta stråtrövare. Den 7 juli 1345 krossade Kantakouzenos och Umur Momtjil vid Peritheorion vid Egeiska havets kust, och han dödades. Några veckor tidigare, den 11 juni, hade Apokaukos mördats av politiska fångar i det nya fängelse han inspekterade i Konstantinopel. Dušan intog Serres i september och kröntes till kejsare 1346. Kantakouzenos lät kröna sig i Adrianopel den 21 maj 1346 och gifte bort sin dotter Theodora med den osmanske härskaren Orhan, vars trupper plundrade Thrakien.
On the night of 2–3 February 1347 supporters opened the walled-up Golden Gate of Constantinople, and Kantakouzenos entered with about a thousand men. After a few days the empress gave in. A settlement on 8 February made him senior emperor for ten years beside John V, who married his daughter Helena. Thessalonica’s Zealots held out until 1350. The war had ruined Thrace, cost the empire most of its European lands to Serbia, and left Turkish soldiers familiar with the country, while the Black Death reached Constantinople that year.: Natten mellan den 2 och 3 februari 1347 öppnade anhängare den igenmurade Gyllene porten i Konstantinopel, och Kantakouzenos tågade in med omkring tusen man. Efter några dagar gav kejsarinnan upp. En uppgörelse den 8 februari gjorde honom till senior kejsare i tio år vid sidan av Johannes V, som gifte sig med hans dotter Helena. Seloterna i Thessalonike höll ut till 1350. Kriget hade ödelagt Thrakien, kostat riket större delen av dess europeiska besittningar till Serbien och gjort turkiska soldater förtrogna med landet, samtidigt som digerdöden nådde Konstantinopel samma år.
