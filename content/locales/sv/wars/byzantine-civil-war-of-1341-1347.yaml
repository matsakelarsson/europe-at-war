Andronikos III died on 15 June 1341, leaving a nine-year-old heir, John V. His friend and chief minister, the grand domestic John Kantakouzenos, expected to govern, but while he was campaigning in Thrace the empress Anna of Savoy, Patriarch John Kalekas and the ambitious admiral Alexios Apokaukos took control in Constantinople and declared him an enemy. On 26 October 1341 his army and supporters proclaimed him emperor at Didymoteicho. The great landowners mostly sided with him; the townspeople, crushed by taxes, rose against the rich in Adrianople and elsewhere and declared for the regency.: Andronikos III dog den 15 juni 1341 och efterlämnade en nioårig arvinge, Johannes V. Hans vän och främste minister, megas domestikos Johannes Kantakouzenos, räknade med att få styra, men medan han var på fälttåg i Thrakien tog kejsarinnan Anna av Savojen, patriarken Johannes Kalekas och den ärelystne amiralen Alexios Apokaukos makten i Konstantinopel och förklarade honom som fiende. Den 26 oktober 1341 utropade hans här och anhängare honom till kejsare i Didymoteichon. De stora godsägarna ställde sig mestadels på hans sida; stadsborna, nedtyngda av skatter, reste sig mot de rika i Adrianopel och på andra håll och förklarade sig för förmyndarregeringen.
In 1342 the Zealots, a popular party, seized Thessalonica and drove out the aristocrats, and Kantakouzenos, his army melting away, fled to Stefan Dušan of Serbia. With Serbian help he invaded Macedonia but failed before Serres. His fortunes turned when his friend Umur Bey, emir of Aydın, sailed up the Evros with a large fleet and relieved Didymoteicho, where Kantakouzenos’s wife Irene was besieged. Thessaly accepted his rule and he won Veria, but in 1343 Dušan, who had been taking towns for himself, went over to the regency.: År 1342 tog seloterna, ett folkligt parti, makten i Thessalonike och fördrev aristokraterna, och Kantakouzenos, vars här smälte bort, flydde till Stefan Dušan av Serbien. Med serbisk hjälp föll han in i Makedonien men misslyckades framför Serres. Lyckan vände när hans vän Umur bey, emir av Aydın, seglade uppför Evros med en stor flotta och undsatte Didymoteichon, där Kantakouzenos hustru Irene var belägrad. Thessalien godtog hans styre och han vann Veria, men 1343 gick Dušan, som hade tagit städer för egen räkning, över till förmyndarregeringen.
