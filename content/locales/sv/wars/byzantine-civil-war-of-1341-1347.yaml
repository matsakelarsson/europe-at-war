Dates are Julian. Kantakouzenos later wrote a history of these years in which he justified himself; the other main account, by Nikephoros Gregoras, is also partisan.: Datum är julianska. Kantakouzenos skrev senare en historia över dessa år där han försvarade sitt handlande; den andra huvudkällan, av Nikeforos Gregoras, är också partisk.
Dušan fought for Kantakouzenos in 1342–1343 and then went over to the regency, taking towns for himself throughout. Umur Bey of Aydın and, from 1345, the Ottoman ruler Orhan sent troops to Kantakouzenos; Bulgaria took Philippopolis and other Thracian towns as the regency’s price.: Dušan stred för Kantakouzenos 1342–1343 och gick sedan över till förmyndarregeringen, samtidigt som han hela tiden tog städer för egen räkning. Umur bey av Aydın och från 1345 den osmanske härskaren Orhan sände trupper till Kantakouzenos; Bulgarien tog Philippopolis och andra thrakiska städer som förmyndarregeringens pris.
