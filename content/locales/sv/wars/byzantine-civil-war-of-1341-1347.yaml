Byzantine civil war of 1341–1347: Bysantinska inbördeskriget 1341–1347
The war for power in the Byzantine Empire after the death of Andronikos III, between his chief minister John Kantakouzenos and the regency for the boy emperor John V, led by the empress Anna of Savoy, Patriarch John Kalekas and Alexios Apokaukos. It set the landed aristocracy against the towns, where the Zealots seized Thessalonica, and both sides called in Serbs, Bulgarians and Turks. Kantakouzenos won and entered Constantinople in 1347 as co-emperor, but the war let Stefan Dušan conquer half the empire and brought the Ottomans into Thrace.: Maktkampen i Bysantinska riket efter Andronikos III:s död, mellan hans främste minister Johannes Kantakouzenos och förmyndarregeringen för den unge kejsaren Johannes V, ledd av kejsarinnan Anna av Savojen, patriarken Johannes Kalekas och Alexios Apokaukos. Kriget ställde godsaristokratin mot städerna, där seloterna tog makten i Thessalonike, och båda sidor kallade in serber, bulgarer och turkar. Kantakouzenos segrade och tågade 1347 in i Konstantinopel som medkejsare, men kriget gjorde det möjligt för Stefan Dušan att erövra halva riket och förde in osmanerna i Thrakien.
