Nikephoros Ouranos: Nikeforos Ouranos
From 1000 Basil, at peace in the east, campaigned in the Balkans almost every year. His generals Theodorokanos and Nikephoros Xiphias retook Pliska and the two Preslavs, Great and Little, in the north-east. Basil himself then took Berroia, whose commander changed sides, stormed Servia, recovered the forts of Thessaly and took Vodena after a long siege, moving its people to Thrace. Then he besieged Vidin on the Danube for eight months and took it. While he was there, Samuel raided Adrianople on the feast of the Dormition, 15 August.: Från år 1000 förde Basileios, som hade fred i öster, fälttåg på Balkan nästan varje år. Hans fältherrar Theodorokanos och Nikeforos Xifias återtog Pliska och de två Preslav, Stora och Lilla, i nordost. Basileios själv intog sedan Berroia, vars befälhavare bytte sida, stormade Servia, återvann Thessaliens borgar och intog Vodena efter en lång belägring och flyttade dess invånare till Thrakien. Därefter belägrade han Vidin vid Donau i åtta månader och intog staden. Medan han var där härjade Samuel Adrianopel på Marie insomnandes fest den 15 augusti.
Marching south, Basil found Samuel’s army camped across the Vardar near Skopje. A soldier found a ford, the Byzantines crossed and routed the Bulgarians, and the governor of Skopje surrendered the town. Basil then besieged Pernik, but its commander, Krakra, held out and the Byzantines withdrew with heavy losses. In 1005 the Chryselios family handed Dyrrhachium to a Byzantine fleet, while Samuel’s son-in-law Ashot slipped away to Constantinople. For the next nine years the war went on in yearly raids and sieges, of which little is recorded.: På marschen söderut fann Basileios Samuels här lägrad på andra sidan Vardar nära Skopje. En soldat hittade ett vadställe, bysantinerna gick över och slog bulgarerna på flykten, och Skopjes guvernör överlämnade staden. Basileios belägrade sedan Pernik, men dess befälhavare, Krakra, höll stånd och bysantinerna drog sig tillbaka med svåra förluster. År 1005 överlämnade familjen Chryselios Dyrrachion till en bysantinsk flotta, medan Samuels svärson Asjot smet iväg till Konstantinopel. Under de följande nio åren fortsatte kriget med årliga härjningståg och belägringar, om vilka lite finns nedtecknat.
