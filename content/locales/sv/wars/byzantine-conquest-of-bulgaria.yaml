The Bulgarian ruler was killed in fighting outside Dyrrhachium. Later legend said he was struck down by a mysterious warrior.: Den bulgariske härskaren dödades i strider utanför Dyrrachion. En senare legend sade att han fälldes av en gåtfull krigare.
