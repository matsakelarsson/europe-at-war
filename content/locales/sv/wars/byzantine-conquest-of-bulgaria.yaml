Gabriel Radomir reigned for a year before his cousin Ivan Vladislav, whose life he had once saved, murdered him while hunting in 1015, reportedly with Basil’s encouragement. Ivan offered to submit, then fought on. Basil retook Vodena, which had rebelled, captured Moglena and reached Ohrid, Samuel’s capital, but withdrew when another Byzantine force was ambushed and destroyed. In 1016 Ivan lured Jovan Vladimir of Duklja to Prespa and had him killed, while Basil besieged Pernik for 88 days and again failed to take it.: Gabriel Radomir regerade i ett år innan hans kusin Ivan Vladislav, vars liv han en gång hade räddat, mördade honom under en jakt 1015, enligt uppgift med Basileios uppmuntran. Ivan erbjöd sig att underkasta sig men stred sedan vidare. Basileios återtog Vodena, som hade gjort uppror, intog Moglena och nådde Ohrid, Samuels huvudstad, men drog sig tillbaka när en annan bysantinsk styrka överfölls och förintades. År 1016 lockade Ivan Jovan Vladimir av Duklja till Prespa och lät döda honom, medan Basileios belägrade Pernik i 88 dagar och åter misslyckades med att inta den.
Basil campaigned every year, wasting the country and taking forts one by one. Ivan Vladislav tried to win the Pechenegs as allies and, with Krakra of Pernik, to retake lost towns, without success. In February 1018 he was killed in a skirmish outside the walls of Dyrrhachium, which he was besieging. With him the last Bulgarian ruler with an army in the field was gone, and the nobles began to surrender.: Basileios förde fälttåg varje år, ödelade landet och intog borgarna en efter en. Ivan Vladislav försökte vinna petjenegerna som bundsförvanter och att tillsammans med Krakra av Pernik återta förlorade städer, utan framgång. I februari 1018 dödades han i en skärmytsling utanför murarna till Dyrrachion, som han belägrade. Med honom var den siste bulgariske härskaren med en här i fält borta, och stormännen började kapitulera.
