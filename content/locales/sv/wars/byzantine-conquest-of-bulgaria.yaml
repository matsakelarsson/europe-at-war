For three years Basil was fighting the rebel Bardas Phokas, and Samuel took the chance. He took Berroia and Servia in Macedonia, gained Dyrrhachium on the Adriatic by marrying the daughter of its leading citizen and at some point won back north-eastern Bulgaria. Basil campaigned in Macedonia from 991 and captured Roman, but in 995 he had to go east to save Aleppo from the Fatimids. Samuel’s men then killed the governor of Thessalonica, Gregory Taronites, outside the city, captured his son Ashot and raided through Thessaly and central Greece into the Peloponnese.: I tre år bekämpade Basileios upprorsmannen Bardas Fokas, och Samuel tog tillfället i akt. Han intog Berroia och Servia i Makedonien, vann Dyrrachion vid Adriatiska havet genom att gifta sig med dottern till stadens främste medborgare och återvann vid någon tidpunkt nordöstra Bulgarien. Basileios förde fälttåg i Makedonien från 991 och tillfångatog Roman, men 995 måste han bege sig österut för att rädda Aleppo från fatimiderna. Samuels män dödade då Thessalonikes guvernör, Gregorios Taronites, utanför staden, tillfångatog hans son Asjot och härjade genom Thessalien och mellersta Grekland ända in på Peloponnesos.
Basil’s general Nikephoros Ouranos followed him. On the way home the Bulgarians camped behind the flooded Spercheios near Lamia, sure that no one could cross. Ouranos found a ford, crossed at night and attacked at dawn. Most of the Bulgarian army was killed or captured; Samuel and his son Gabriel Radomir, both wounded, escaped by lying among the dead and fled over the Pindus mountains. When Roman died in captivity in 997, Samuel had himself proclaimed tsar. In 998 he subdued Duklja, on today’s Montenegrin coast, and raided Dalmatia.: Basileios fältherre Nikeforos Ouranos följde efter honom. På hemvägen slog bulgarerna läger bakom den översvämmade Spercheios nära Lamia, säkra på att ingen kunde ta sig över. Ouranos hittade ett vadställe, gick över om natten och anföll i gryningen. Större delen av den bulgariska hären dödades eller tillfångatogs; Samuel och hans son Gabriel Radomir, båda sårade, kom undan genom att ligga bland de döda och flydde över Pindosbergen. När Roman dog i fångenskap 997 lät Samuel utropa sig till tsar. År 998 underkuvade han Duklja, vid den nuvarande montenegrinska kusten, och härjade i Dalmatien.
