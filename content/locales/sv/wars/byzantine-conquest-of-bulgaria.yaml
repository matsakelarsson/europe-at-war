When John I Tzimiskes died in January 976, Byzantium held eastern Bulgaria, but the west had never been conquered. There four brothers, the sons of a count and so called the Cometopuli, rose against the empire; two were soon killed, and the youngest, Samuel, came to rule. Boris II and his brother Roman escaped from Constantinople, but Boris was killed at the frontier by a guard who took him for a Byzantine. Roman, who had been castrated in captivity, was proclaimed tsar, but Samuel held real power. While Basil II fought the rebel Bardas Skleros in Asia Minor, Samuel raided Greece and starved Larissa into surrender after years of blockade.: När Johannes I Tzimiskes dog i januari 976 behärskade Bysans östra Bulgarien, men väster hade aldrig erövrats. Där reste sig fyra bröder, söner till en greve och därför kallade Kometopuli, mot riket; två dödades snart, och den yngste, Samuel, kom att härska. Boris II och hans bror Roman flydde från Konstantinopel, men Boris dödades vid gränsen av en vakt som tog honom för en bysantin. Roman, som hade kastrerats i fångenskapen, utropades till tsar, men det var Samuel som hade den verkliga makten. Medan Basileios II bekämpade upprorsmannen Bardas Skleros i Mindre Asien härjade Samuel i Grekland och svalt efter flera års blockad ut Larissa till kapitulation.
In 986 Basil marched on Serdica through the pass known as the Gates of Trajan and besieged it for twenty days. The defenders sallied out, burned his siege engines and captured his draught animals, and he turned back. On 17 August, in the pass, the Bulgarians fell on his army and routed it. Basil barely escaped, and his baggage and treasury were lost. The historian Leo the Deacon, who was with the army, only just escaped himself.: År 986 tågade Basileios mot Serdica genom passet som kallas Trajanusporten och belägrade staden i tjugo dagar. Försvararna gjorde utfall, brände hans belägringsmaskiner och tog hans dragdjur, och han vände om. Den 17 augusti föll bulgarerna över hans här i passet och slog den på flykten. Basileios kom med nöd och näppe undan, och hans tross och krigskassa gick förlorade. Historikern Leon Diakonen, som var med hären, kom själv undan med knapp nöd.
