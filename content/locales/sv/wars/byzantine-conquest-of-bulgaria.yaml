Byzantine conquest of Bulgaria: Bysantinska erövringen av Bulgarien
The forty-year war in which the Byzantine emperor Basil II destroyed the western Bulgarian realm of Samuel, centred on Prespa and Ohrid. After a defeat at the Gates of Trajan in 986 and years of Bulgarian raids deep into Greece, the Byzantines won at the Spercheios in 997, took fortress after fortress from 1000 and broke Samuel’s army at Kleidion in 1014, blinding thousands of prisoners. The last Bulgarian leaders surrendered in 1018, and Bulgaria was ruled from Constantinople until 1185.: Det fyrtioåriga krig där den bysantinske kejsaren Basileios II krossade Samuels västbulgariska rike med centrum kring Prespa och Ohrid. Efter ett nederlag vid Trajanusporten 986 och år av bulgariska härjningståg djupt in i Grekland segrade bysantinerna vid Spercheios 997, intog från år 1000 den ena fästningen efter den andra och krossade Samuels här vid Kleidion 1014, varefter tusentals fångar bländades. De sista bulgariska ledarna kapitulerade 1018, och Bulgarien styrdes från Konstantinopel fram till 1185.
