Ivan Vladislav: Ivan Vladislav
In the spring of 1018 Basil marched west. Krakra surrendered Pernik and its neighbouring forts, and commanders and nobles came to his camp with the keys of their towns. At Ohrid Ivan Vladislav’s widow, Maria, gave herself up with her children and the treasury. His sons held out for a time on Mount Tomorr, and the last commanders surrendered or were captured within the year. Basil then went south through Thessaly to Athens, gave thanks in the Parthenon, then the church of the Mother of God, and celebrated a triumph in Constantinople in 1019.: Våren 1018 tågade Basileios västerut. Krakra överlämnade Pernik och de närliggande borgarna, och befälhavare och stormän kom till hans läger med nycklarna till sina städer. I Ohrid gav sig Ivan Vladislavs änka, Maria, med sina barn och skattkammaren. Hans söner höll ut en tid på berget Tomorr, och de sista befälhavarna kapitulerade eller tillfångatogs inom året. Basileios drog sedan söderut genom Thessalien till Aten, tackade för segern i Parthenon, då Guds moders kyrka, och firade en triumf i Konstantinopel 1019.
Basil’s settlement was mild by the standards of the war. The Bulgarian lands became the provinces of Bulgaria, with its seat at Skopje, Sirmium and, on the lower Danube, Paristrion. Taxes were still taken in kind, as under Samuel, and the church kept its own archbishop at Ohrid, a Bulgarian, appointed by the emperor. Many nobles received Byzantine titles and posts. The Serbs and Croats acknowledged Basil’s overlordship, and for the first time since the 7th century the empire’s border ran along the Danube.: Basileios uppgörelse var mild med krigets mått mätt. De bulgariska länderna blev provinserna Bulgarien, med säte i Skopje, Sirmium och, vid nedre Donau, Paristrion. Skatterna togs fortfarande ut in natura, som under Samuel, och kyrkan behöll en egen ärkebiskop i Ohrid, en bulgar, utsedd av kejsaren. Många stormän fick bysantinska titlar och ämbeten. Serberna och kroaterna erkände Basileios överhöghet, och för första gången sedan 600-talet gick rikets gräns längs Donau.
Surrender at Ohrid: Kapitulationen i Ohrid
New provinces: Nya provinser
Bulgaria (Skopje), Sirmium, Paristrion: Bulgarien (Skopje), Sirmium, Paristrion
Archbishopric of Ohrid: Ärkebiskopsdömet Ohrid
Self-governing church for the Bulgarian lands: Självstyrande kyrka för de bulgariska länderna
Maria, widow of Ivan Vladislav, surrendered Samuel’s capital, the royal family and the treasury to Basil.: Maria, Ivan Vladislavs änka, överlämnade Samuels huvudstad, kungafamiljen och skattkammaren till Basileios.
Krakra, who had twice held Pernik against Basil, surrendered it with some 35 forts and was made a patrikios.: Krakra, som två gånger hade hållit Pernik mot Basileios, överlämnade den med omkring 35 borgar och utnämndes till patrikios.
Mount Tomorr: Berget Tomorr
Ivan Vladislav’s eldest son, Presian, and two of his brothers took refuge on the mountain before surrendering.: Ivan Vladislavs äldste son, Presian, och två av hans bröder tog sin tillflykt till berget innan de kapitulerade.
Skopje: Skopje
Seat of the governor of the new province of Bulgaria.: Säte för guvernören i den nya provinsen Bulgarien.
Athens: Aten
Basil gave thanks for his victory in the Parthenon, then a church of the Virgin, and gave it rich gifts.: Basileios tackade för sin seger i Parthenon, då en kyrka helgad åt Jungfru Maria, och skänkte den rika gåvor.
Basil II, 1018: Basileios II, 1018
