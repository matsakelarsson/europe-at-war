The main source is John Skylitzes, who wrote in the late 11th century; Leo the Deacon, who was at the Gates of Trajan, Yahya of Antioch and the Armenian Stepanos Taronetsi add details. Their chronologies often disagree, so several dates here are given as alternatives (the Spercheios 996 or 997, Vidin 1002 or 1003, Skopje 1003 or 1004). Yahya of Antioch has Tsar Roman captured in 991 and dying in 997, while Skylitzes has him surrender Skopje in 1004. No Bulgarian account survives.: Huvudkällan är Johannes Skylitzes, som skrev i slutet av 1000-talet; Leon Diakonen, som var med vid Trajanusporten, Yahya av Antiochia och armeniern Stepanos Taronetsi bidrar med detaljer. Deras kronologier går ofta isär, så flera datum anges här som alternativ (Spercheios 996 eller 997, Vidin 1002 eller 1003, Skopje 1003 eller 1004). Enligt Yahya av Antiochia tillfångatogs tsar Roman 991 och dog 997, medan Skylitzes låter honom överlämna Skopje 1004. Ingen bulgarisk skildring finns bevarad.
Samuel’s state is one of the subjects of competing national histories in Bulgaria and North Macedonia. Contemporary Byzantine, Armenian and Arab writers called it Bulgaria, and Basil’s nickname Boulgaroktonos, “Bulgar-slayer”, appears in writing only from the 12th century.: Samuels stat är ett av ämnena för konkurrerande nationella historieskrivningar i Bulgarien och Nordmakedonien. Samtida bysantinska, armeniska och arabiska skribenter kallade den Bulgarien, och Basileios tillnamn Boulgaroktonos, ”bulgardräparen”, förekommer i skrift först från 1100-talet.
Places are given their Byzantine names where these are usual in English, with modern names in the text. Serdica or Sredets is Sofia, Berroia is Veria, Vodena is Edessa, Dyrrhachium is Durrës and Kleidion is near today’s Klyuch in Bulgaria. Sviatoslav’s war of 965–971, after which Byzantium annexed eastern Bulgaria, is told in Sviatoslav’s campaigns.: Orter ges sina bysantinska namn där dessa är brukliga på engelska, med de moderna namnen i texten. Serdica eller Sredets är Sofia, Berroia är Veria, Vodena är Edessa, Dyrrachion är Durrës och Kleidion ligger nära dagens Kljutj i Bulgarien. Svjatoslavs krig 965–971, varefter Bysans annekterade östra Bulgarien, skildras under Svjatoslavs fälttåg.
