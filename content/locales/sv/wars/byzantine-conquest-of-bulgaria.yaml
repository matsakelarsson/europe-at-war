In 1014 Samuel tried to stop Basil’s yearly invasion in the narrow valley of the Strumitsa at Kleidion, “the key”, where he built a thick wooden wall between the mountains of Belasitsa and Ograzhden. Basil’s attacks on the wall failed, and a Bulgarian force sent to distract him was beaten outside Thessalonica by its governor, Theophylact Botaneiates. Nikephoros Xiphias then led a detachment along mountain paths over Belasitsa, and on 29 July he fell on the Bulgarians from behind while Basil stormed the wall. Samuel escaped with the help of his son Gabriel Radomir.: År 1014 försökte Samuel stoppa Basileios årliga invasion i Strumitsas trånga dalgång vid Kleidion, ”nyckeln”, där han byggde en tjock trämur mellan bergen Belasitsa och Ograzjden. Basileios anfall mot muren misslyckades, och en bulgarisk styrka som sänts för att avleda honom slogs utanför Thessalonike av dess guvernör, Theofylaktos Botaneiates. Nikeforos Xifias ledde då en avdelning längs bergsstigar över Belasitsa, och den 29 juli föll han bulgarerna i ryggen medan Basileios stormade muren. Samuel kom undan med hjälp av sin son Gabriel Radomir.
Skylitzes says Basil took 15,000 prisoners (Kekaumenos says 14,000), blinded ninety-nine of every hundred and left the hundredth one eye to lead the others home; modern historians think the numbers exaggerated but do not doubt the blinding. It may have been revenge for Botaneiates, killed soon afterwards in an ambush in a pass near Strumitsa. When the blinded men reached Prespa, Samuel collapsed at the sight and died on 6 October 1014.: Skylitzes uppger att Basileios tog 15 000 fångar (Kekaumenos säger 14 000), bländade nittionio av varje hundra och lämnade den hundrade ett öga för att leda de andra hem; moderna historiker anser att siffrorna är överdrivna men betvivlar inte bländningen. Den kan ha varit en hämnd för Botaneiates, som strax därefter dödades i ett bakhåll i ett pass nära Strumitsa. När de bländade männen nådde Prespa segnade Samuel ned vid åsynen och dog den 6 oktober 1014.
