Byzantine conquests in Cilicia and Syria: Bysantinska erövringar i Kilikien och Syrien
The campaigns in which Nikephoros Phokas, general and then emperor, sacked Aleppo, the capital of the Hamdanid emir Sayf al-Dawla, in 962, conquered Cilicia with Tarsus and Mopsuestia in 965 while his fleet took Cyprus, and in 969 recovered Antioch, lost to the Arabs more than three centuries before. His successor John I Tzimiskes led raids deep into Syria and Palestine in 974–975.: De fälttåg där Nikeforos Fokas, först fältherre och sedan kejsare, plundrade Aleppo, huvudstad för den hamdanidiske emiren Sayf al-Dawla, 962, erövrade Kilikien med Tarsos och Mopsuestia 965 medan hans flotta intog Cypern, och 969 återtog Antiochia, som hade gått förlorat till araberna mer än tre sekler tidigare. Hans efterträdare Johannes I Tzimiskes ledde härjningståg djupt in i Syrien och Palestina 974–975.
