Nikephoros Phokas: Nikeforos Fokas
Nikephoros became emperor in August 963 and turned to Cilicia, the plain whose fortified cities, Tarsus above all, had been bases for raids into Asia Minor for two centuries. Tzimiskes beat the army of Tarsus near Adana, and in 964 Nikephoros took Adana and other towns but failed before Mopsuestia. In 965 he came back with a larger army. Mopsuestia was stormed on 13 July and its people enslaved. Tarsus, besieged and short of food, surrendered on 16 August on condition that its people could leave for Syria with what they could carry.: Nikeforos blev kejsare i augusti 963 och vände sig mot Kilikien, slätten vars befästa städer, framför allt Tarsos, i två sekler hade varit baser för härjningståg in i Mindre Asien. Tzimiskes besegrade Tarsos armé nära Adana, och 964 intog Nikeforos Adana och andra städer men misslyckades framför Mopsuestia. År 965 kom han tillbaka med en större här. Mopsuestia stormades den 13 juli och dess invånare gjordes till slavar. Tarsos, belägrat och med ont om livsmedel, kapitulerade den 16 augusti på villkor att invånarna fick bege sig till Syrien med vad de kunde bära.
Many Muslims left Cilicia, and Christians, many of them Armenians and Syrians, were settled in the emptied lands. Nikephoros carried the bronze gates of Tarsus and Mopsuestia to Constantinople as trophies. In the same year, or perhaps in 964, a fleet under Niketas Chalkoutzes took Cyprus, which had been shared between the empire and the Arabs since the late 7th century, and the whole island became a Byzantine province.: Många muslimer lämnade Kilikien, och kristna, många av dem armenier och syrier, bosattes i de tömda områdena. Nikeforos förde bronsportarna från Tarsos och Mopsuestia till Konstantinopel som troféer. Samma år, eller kanske 964, intog en flotta under Niketas Chalkoutzes Cypern, som hade delats mellan riket och araberna sedan slutet av 600-talet, och hela ön blev en bysantinsk provins.
