Sayf al-Dawla died in 967, and his realm fell into revolt. In late 968 Nikephoros raided Syria as far as Tripoli, and before going home he built a fort at Baghras in the Amanus mountains, from which Michael Bourtzes and the eunuch general Peter were to blockade Antioch. Against orders, Bourtzes bribed a defender and seized a tower by night; on 28 October 969 Peter came up and the city fell. A few weeks later Nikephoros was murdered by Tzimiskes. Under the treaty of Safar, made in the winter of 969–970, Aleppo became a Byzantine tributary, and a Fatimid siege of Antioch in 971 failed.: Sayf al-Dawla dog 967, och hans rike föll sönder i revolter. I slutet av 968 härjade Nikeforos i Syrien ända till Tripoli, och innan han vände hem byggde han en borg vid Baghras i Amanosbergen, varifrån Mikael Bourtzes och eunucken och fältherren Petros skulle blockera Antiochia. Mot order mutade Bourtzes en försvarare och tog ett torn om natten; den 28 oktober 969 kom Petros fram och staden föll. Några veckor senare mördades Nikeforos av Tzimiskes. Genom fördraget i Safar, som slöts vintern 969–970, blev Aleppo bysantinsk tributstat, och en fatimidisk belägring av Antiochia 971 misslyckades.
"In 974 Tzimiskes, now emperor, raided Upper Mesopotamia. In 975 he marched south from Antioch: Emesa and Baalbek fell, Damascus paid tribute, and he went on to Tiberias, Nazareth and Caesarea. He wrote to King Ashot III of Armenia that only fear of the Fatimids kept him from Jerusalem; historians disagree how far to trust the letter. On the way back he took Beirut but failed before Tripoli. He died in January 976, and most of his conquests south of Antioch were soon lost.": "År 974 härjade Tzimiskes, nu kejsare, i Övre Mesopotamien. År 975 tågade han söderut från Antiochia: Emesa och Baalbek föll, Damaskus betalade tribut och han fortsatte till Tiberias, Nasaret och Caesarea. Han skrev till kung Asjot III av Armenien att endast fruktan för fatimiderna höll honom borta från Jerusalem; historikerna är oense om hur mycket man kan lita på brevet. På tillbakavägen intog han Beirut men misslyckades framför Tripoli. Han dog i januari 976, och de flesta av hans erövringar söder om Antiochia gick snart förlorade."
