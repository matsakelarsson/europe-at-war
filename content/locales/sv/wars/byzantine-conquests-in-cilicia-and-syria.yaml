For twenty years Sayf al-Dawla, the Hamdanid emir of Aleppo, had led the Muslim holy war on the frontier, raiding Byzantine Asia Minor almost every year. In 960, while Nikephoros Phokas was away in Crete, his brother Leo ambushed the emir in the Taurus passes and destroyed his army. Back from Crete, Nikephoros took Anazarbus in Cilicia, emptied it of its people and pulled down its walls. In 962 he took Marash and Manbij, where he captured the emir’s cousin, the poet Abu Firas, securing the passes to the north of Aleppo.: I tjugo år hade Sayf al-Dawla, hamdanidernas emir i Aleppo, lett det muslimska heliga kriget vid gränsen och härjat i det bysantinska Mindre Asien nästan varje år. År 960, medan Nikeforos Fokas var borta på Kreta, överföll hans bror Leon emiren i Taurospassen och förintade hans här. Tillbaka från Kreta intog Nikeforos Anazarbos i Kilikien, tömde staden på dess invånare och rev dess murar. År 962 intog han Marash och Manbij, där han tillfångatog emirens kusin, poeten Abu Firas, och säkrade därmed passen norr om Aleppo.
In December, when campaigning normally stopped, he marched on Aleppo with a large army. Sayf al-Dawla’s few troops were scattered and he fled. The Byzantines plundered his palace outside the walls and on 23 or 24 December stormed the city, which they sacked for over a week. The citadel held out, and in revenge for a nephew killed attacking it Nikephoros is said to have beheaded 1,200 prisoners. He withdrew with some 10,000 captives, mostly young men. Sayf al-Dawla returned to a half-empty city, and revolts troubled his last years.: I december, när fälttågen normalt upphörde, tågade han mot Aleppo med en stor här. Sayf al-Dawlas fåtaliga trupper skingrades och han flydde. Bysantinerna plundrade hans palats utanför murarna och stormade den 23 eller 24 december staden, som de plundrade i över en vecka. Citadellet höll stånd, och som hämnd för en brorson som dödats under anfallet mot det sägs Nikeforos ha låtit halshugga 1 200 fångar. Han drog sig tillbaka med omkring 10 000 fångar, mest unga män. Sayf al-Dawla återvände till en halvtom stad, och revolter plågade hans sista år.
