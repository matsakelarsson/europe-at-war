Antioch and Tzimiskes’ campaigns: Antiochia och Tzimiskes fälttåg
The fullest accounts are Arabic (Yahya of Antioch, Ibn al-Adim’s history of Aleppo and others), with the Byzantine historians Leo the Deacon and John Skylitzes. Dates in Arabic sources follow the Islamic calendar and are sometimes uncertain by a year; Anazarbus fell in late 961 or early 962.: De utförligaste skildringarna är arabiska (Yahya av Antiochia, Ibn al-Adims historia över Aleppo med flera), tillsammans med de bysantinska historikerna Leon Diakonen och Johannes Skylitzes. Datum i arabiska källor följer den islamiska kalendern och är ibland osäkra med ett år; Anazarbos föll i slutet av 961 eller början av 962.
Cilicia’s cities, Tarsus above all, were frontier strongholds of the Muslim holy war, nominally under the Abbasid caliph and at times under the Hamdanids or the Ikhshidids of Egypt. Cyprus had been shared between the Byzantines and the Arabs since the late 7th century.: Kilikiens städer, framför allt Tarsos, var gränsfästen för det muslimska heliga kriget, formellt under den abbasidiske kalifen och periodvis under hamdaniderna eller ikhshididerna i Egypten. Cypern hade delats mellan bysantinerna och araberna sedan slutet av 600-talet.
Mopsuestia is today’s Yakapınar near Adana, Anazarbus is Anavarza, and Antioch is Antakya.: Mopsuestia är dagens Yakapınar nära Adana, Anazarbos är Anavarza och Antiochia är Antakya.
