The main sources are the Georgian Chronicles, the Armenian historian Aristakes Lastivertsi and John Skylitzes; they disagree on the battles of 1021–1022. Byzantine and Georgian fighting over the borderlands flared again in 1028.: De främsta källorna är de georgiska krönikorna, den armeniske historikern Aristakes Lastivertsi och Johannes Skylitzes; de är oeniga om striderna 1021–1022. Bysantinska och georgiska strider om gränslanden blossade upp igen 1028.
Tao and Artaan lie in today’s north-eastern Turkey (around Yusufeli and Ardahan), Javakheti in southern Georgia.: Tao och Artaani ligger i dagens nordöstra Turkiet (kring Yusufeli och Ardahan), Dzjavachetien i södra Georgien.
