Byzantine–Georgian wars: Bysantinsk-georgiska krigen
The war between Basil II and King George I of Georgia over the inheritance of David III of Tao, who on his death in 1000 had left his lands in the Byzantine–Georgian borderland to the emperor. George occupied Tao in 1014–1016, while Basil was fighting Bulgaria. In 1021 Basil invaded with a large army, including the Varangian Guard, and ravaged Georgian lands; George allied with two Byzantine generals who rebelled in Basil’s rear, and in the winter the Armenian king of Vaspurakan ceded his kingdom to the empire. After a crushing defeat at Svindax in 1022, George gave up Tao, Phasiane, Kola, Artaan and Javakheti and sent his young son Bagrat to Constantinople as a hostage.: Kriget mellan Basileios II och kung Giorgi I av Georgien om arvet efter David III av Tao, som vid sin död år 1000 hade testamenterat sina länder i det bysantinsk-georgiska gränslandet till kejsaren. Giorgi ockuperade Tao 1014–1016, medan Basileios krigade mot Bulgarien. År 1021 invaderade Basileios med en stor här, däribland väringagardet, och härjade georgiska länder; Giorgi allierade sig med två bysantinska fältherrar som gjorde uppror i Basileios rygg, och under vintern avträdde den armeniske kungen av Vaspurakan sitt rike till kejsardömet. Efter ett förkrossande nederlag vid Svindax 1022 gav Giorgi upp Tao, Fasiane, Kola, Artaan och Dzjavachetien och sände sin unge son Bagrat till Konstantinopel som gisslan.
