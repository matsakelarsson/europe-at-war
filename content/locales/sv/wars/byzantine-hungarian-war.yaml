Manuel besieged and took the Hungarian fortress across the Sava from Belgrade, and his troops took Sirmium and the land between the Sava and the Danube.: Manuel belägrade och intog den ungerska fästningen på andra sidan Sava från Belgrad, och hans trupper tog Sirmium och landet mellan Sava och Donau.
8 July 1167: 8 juli 1167
The Byzantine army, which included Turkish and Western mercenaries, broke the Hungarian charge and routed Dénes’s army. Kinnamos and Choniates tell of heavy Hungarian losses.: Den bysantinska hären, som omfattade turkiska och västerländska legosoldater, bröt den ungerska chocken och slog Dénes här på flykten. Kinnamos och Choniates berättar om svåra ungerska förluster.
Split: Split
A Byzantine army took Split and other Dalmatian towns, which stayed under imperial rule until 1180.: En bysantinsk här intog Split och andra dalmatiska städer, som förblev under kejserligt styre fram till 1180.
