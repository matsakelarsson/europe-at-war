Hungarian success: Ungerska framgångar
When Géza II of Hungary died in 1162, Manuel I backed the claims of Géza’s brothers against his young son Stephen III, whose supporters drove them out. In 1163 the two sides made a deal. Stephen’s younger brother Béla went to Constantinople, where he was betrothed to Manuel’s daughter, renamed Alexios and made heir to the empire, and his inheritance of Croatia, Dalmatia and Sirmium (Srem) was to pass with him. Stephen would not give it up, and for four years Byzantine and Hungarian armies fought over Sirmium, Zemun and the Dalmatian towns, which changed hands several times.: När Géza II av Ungern dog 1162 stödde Manuel I anspråken från Gézas bröder mot hans unge son Stefan III, vars anhängare fördrev dem. År 1163 kom de båda sidorna överens. Stefans yngre bror Béla begav sig till Konstantinopel, där han trolovades med Manuels dotter, fick namnet Alexios och gjordes till tronarvinge, och hans arvedel, Kroatien, Dalmatien och Sirmium (Srem), skulle följa med honom. Stefan ville inte avstå den, och i fyra år stred bysantinska och ungerska härar om Sirmium, Zemun och de dalmatiska städerna, som bytte ägare flera gånger.
In 1167 Manuel sent a large army under his nephew Andronikos Kontostephanos. On 8 July 1167, near Zemun in the region of Sirmium, it met the Hungarian army under Dénes, count of Bács, and routed it. Hungary made peace and accepted Byzantine rule over Sirmium, Bosnia and most of Dalmatia. The gains did not last. When Manuel’s own son was born, Béla lost his place as heir, and he became king of Hungary in 1172 with Byzantine support. After Manuel died in 1180, Béla III took Sirmium and Dalmatia back.: År 1167 sände Manuel en stor här under sin systerson Andronikos Kontostefanos. Den 8 juli 1167, nära Zemun i trakten av Sirmium, mötte den den ungerska hären under Dénes, greve av Bács, och slog den på flykten. Ungern slöt fred och godtog bysantinskt styre över Sirmium, Bosnien och större delen av Dalmatien. Vinsterna blev inte bestående. När Manuels egen son föddes förlorade Béla sin plats som arvinge, och han blev kung av Ungern 1172 med bysantinskt stöd. Efter Manuels död 1180 tog Béla III tillbaka Sirmium och Dalmatien.
