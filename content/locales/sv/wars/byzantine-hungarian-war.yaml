The fullest accounts are by the Byzantine historians John Kinnamos and Niketas Choniates; Hungarian sources say little. The fighting of 1162–1167 is sometimes treated as several short wars.: De utförligaste skildringarna är av de bysantinska historikerna Johannes Kinnamos och Niketas Choniates; ungerska källor säger lite. Striderna 1162–1167 behandlas ibland som flera korta krig.
Croatia had been in union with the Hungarian crown since 1102 and is shown on the map as a separate kingdom. The Dalmatian towns were contested between Hungary, Venice and Byzantium throughout the 12th century.: Kroatien hade varit i union med den ungerska kronan sedan 1102 och visas på kartan som ett separat kungarike. De dalmatiska städerna var omstridda mellan Ungern, Venedig och Bysans under hela 1100-talet.
