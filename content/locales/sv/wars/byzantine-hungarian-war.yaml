Byzantine–Hungarian war of 1162–1167: Bysantinsk-ungerska kriget 1162–1167
A war between the Byzantine emperor Manuel I Komnenos and King Stephen III of Hungary over the succession to the Hungarian throne and over Sirmium, Dalmatia and Bosnia, which Manuel claimed as the inheritance of Stephen’s brother Béla, then living in Constantinople as Manuel’s heir. It ended with a Byzantine victory at Sirmium in 1167 and a peace that left these lands to the empire until Manuel’s death in 1180.: Ett krig mellan den bysantinske kejsaren Manuel I Komnenos och kung Stefan III av Ungern om tronföljden i Ungern och om Sirmium, Dalmatien och Bosnien, som Manuel gjorde anspråk på som arv efter Stefans bror Béla, som då levde i Konstantinopel som Manuels arvinge. Det slutade med en bysantinsk seger vid Sirmium 1167 och en fred som lämnade dessa länder åt kejsardömet fram till Manuels död 1180.
