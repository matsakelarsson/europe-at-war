The Byzantine and Cuman cavalry closed around the Pecheneg wagon camp from both wings, and the defence collapsed. The killing went on until the soldiers, as Anna Komnene put it, grew tired of striking.: Det bysantinska och kumanska kavalleriet slöt sig kring den petjenegiska vagnborgen från båda flyglarna, och försvaret bröt samman. Dödandet fortsatte tills soldaterna, som Anna Komnena uttryckte det, tröttnade på att hugga.
Smyrna: Smyrna
Seat of the emir Tzachas, a former captive at the Byzantine court, who used Greek shipbuilders to build a fleet and took Lesbos, Chios and other islands.: Säte för emiren Tzachas, en före detta fånge vid det bysantinska hovet, som anlitade grekiska skeppsbyggare för att bygga en flotta och tog Lesbos, Chios och andra öar.
Constantinople: Konstantinopel
winter 1090–1091: vintern 1090–1091
With the Pechenegs camped in Thrace and Tzachas’s ships in the Aegean, the capital was more threatened than at any time since the Arab sieges.: Med petjenegerna lägrade i Thrakien och Tzachas fartyg i Egeiska havet var huvudstaden mer hotad än någon gång sedan de arabiska belägringarna.
