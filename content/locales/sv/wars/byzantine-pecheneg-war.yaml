In the 1080s, while Alexios I Komnenos fought the Normans in the west and the Turks held most of Anatolia, the Pechenegs on the lower Danube became a third threat. In 1087 a large Pecheneg host raided deep into Thrace before Byzantine troops drove it back. That summer Alexios, rejecting Pecheneg offers of peace, crossed the Haemus (Balkan Mountains) to strike at their homeland and reached Dristra (Silistra), the chief town of the Danube province.: På 1080-talet, medan Alexios I Komnenos bekämpade normanderna i väster och turkarna behärskade större delen av Anatolien, blev petjenegerna vid nedre Donau ett tredje hot. År 1087 trängde en stor petjenegisk här djupt in i Thrakien på ett härjningståg innan bysantinska trupper drev den tillbaka. Samma sommar avvisade Alexios petjenegernas fredsanbud, gick över Haimos (Balkanbergen) för att slå till mot deras hemland och nådde Dristra (Silistra), huvudstaden i Donauprovinsen.
In August 1087 Alexios took the town but not its citadels and, fearing the arrival of the main Pecheneg army, began to withdraw. The Pechenegs caught up with him. The battle was hard fought until fresh Pecheneg horsemen arrived and the Byzantine army broke. Alexios barely escaped, and many of his men were killed or captured. A quarrel between the Pechenegs and the Cumans over the spoils gave the empire a pause, but for the next three years the Pechenegs raided Thrace almost at will, and Alexios could do little more than buy truces.: I augusti 1087 intog Alexios staden men inte dess citadeller och började, av fruktan för att den petjenegiska huvudhären skulle komma, att dra sig tillbaka. Petjenegerna hann ifatt honom. Slaget var hårt tills nya petjenegiska ryttare anlände och den bysantinska hären bröts sönder. Alexios kom med nöd och näppe undan, och många av hans män dödades eller tillfångatogs. Ett gräl mellan petjenegerna och kumanerna om bytet gav riket ett andrum, men under de följande tre åren härjade petjenegerna i Thrakien nästan som de ville, och Alexios kunde inte göra mycket mer än att köpa stillestånd.
