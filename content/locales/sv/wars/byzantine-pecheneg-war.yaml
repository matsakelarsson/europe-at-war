The Byzantine army was routed as it withdrew from the Danube. Alexios fought his way out with a few companions, carrying, Anna Komnene says, a cloak said to be the Virgin’s as a banner until he had to hide it in a bush.: Den bysantinska hären slogs på flykten när den drog sig tillbaka från Donau. Alexios slog sig ut med några få följeslagare och bar enligt Anna Komnena en mantel som sades vara Jungfruns som fana tills han måste gömma den i en buske.
Alexios I: Alexios I
Pecheneg raids: Petjenegiska härjningståg
In 1090 the danger came close to the capital. The Pechenegs moved south and spent the winter in Thrace near Constantinople, and the Turkish emir Tzachas of Smyrna, who had built a fleet and seized several Aegean islands, sought to join them in an attack on the city by land and sea. Alexios gathered every soldier he could, raised new levies, took Western knights into his service and bought the help of the Cumans, nomads from the steppe north of the Black Sea, whose khans Tugorkhan and Boniak brought a large army south in the spring of 1091.: År 1090 kom faran nära huvudstaden. Petjenegerna drog söderut och övervintrade i Thrakien nära Konstantinopel, och den turkiske emiren Tzachas av Smyrna, som hade byggt en flotta och tagit flera Egeiska öar, försökte förena sig med dem i ett anfall mot staden till lands och sjöss. Alexios samlade varje soldat han kunde, tog ut nya uppbåd, tog västerländska riddare i sin tjänst och köpte hjälp av kumanerna, nomader från stäppen norr om Svarta havet, vars khaner Tugorchan och Boniak förde en stor här söderut våren 1091.
On 29 April 1091 the Byzantines and Cumans attacked the Pecheneg camp at Levounion, a hill near the mouth of the Hebros (Maritsa), not far from Ainos. The Pechenegs, with their women and children in a ring of wagons, were surrounded and overwhelmed. Most of them were killed, families as well as warriors. Anna Komnene wrote that a whole people was wiped out in a single day, and a saying arose that the Pechenegs never saw May. Survivors were settled in the empire or taken into its army, and the Pechenegs did not threaten Byzantium again until 1122.: Den 29 april 1091 anföll bysantinerna och kumanerna det petjenegiska lägret vid Levounion, en kulle nära Hebros (Maritsas) mynning, inte långt från Ainos. Petjenegerna, med sina kvinnor och barn i en vagnborg, omringades och överväldigades. De flesta av dem dödades, familjer såväl som krigare. Anna Komnena skrev att ett helt folk utplånades på en enda dag, och ett talesätt uppstod om att petjenegerna aldrig fick se maj. De överlevande bosattes i riket eller togs in i dess här, och petjenegerna hotade inte Bysans igen förrän 1122.
