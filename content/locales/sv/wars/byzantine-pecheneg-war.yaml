Byzantine–Pecheneg war: Bysantinsk-petjenegiska kriget
The war in which the Pechenegs, Turkic nomads settled along the lower Danube, defeated the Byzantine emperor Alexios I Komnenos at Dristra in 1087 and raided Thrace for four years, coming close to Constantinople. With the help of the Cumans, Alexios destroyed their host at Levounion near the mouth of the Hebros on 29 April 1091.: Kriget där petjenegerna, turkiska nomader som slagit sig ned längs nedre Donau, besegrade den bysantinske kejsaren Alexios I Komnenos vid Dristra 1087 och under fyra år härjade Thrakien och kom nära Konstantinopel. Med hjälp av kumanerna förintade Alexios deras här vid Levounion nära Hebros mynning den 29 april 1091.
