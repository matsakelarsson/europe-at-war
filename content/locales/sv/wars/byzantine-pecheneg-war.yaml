Almost everything known about this war comes from the Alexiad, the history of Alexios’s reign written decades later by his daughter Anna Komnene, who calls the Pechenegs “Scythians”. Her numbers are very large and her dates are not always clear.: Nästan allt som är känt om detta krig kommer från Alexiaden, historien om Alexios regering som skrevs årtionden senare av hans dotter Anna Komnena, som kallar petjenegerna ”skyter”. Hennes siffror är mycket höga och hennes datum är inte alltid tydliga.
The Pechenegs had crossed the lower Danube into the Byzantine province of Paristrion (Paradounavon) in the 1040s and lived there beside local lords who were only loosely subject to the empire.: Petjenegerna hade på 1040-talet gått över nedre Donau in i den bysantinska provinsen Paristrion (Paradounavon) och levde där sida vid sida med lokala herrar som bara löst var underställda riket.
