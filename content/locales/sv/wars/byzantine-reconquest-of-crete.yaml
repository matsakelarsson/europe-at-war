The main accounts are by Byzantine writers, above all Leo the Deacon, with a verse poem on the conquest by Theodosios the Deacon. Their figures for the armies, such as Leo’s 40,000 men in the Cretan relief force, are not reliable.: De främsta skildringarna är av bysantinska skribenter, framför allt Leon Diakonen, tillsammans med en versdikt om erövringen av Theodosios Diakonen. Deras siffror för härarna, som Leons 40 000 man i den kretensiska undsättningsstyrkan, är inte tillförlitliga.
The city fell on 6 March 961 in most accounts; some give 7 March. Chandax is today’s Heraklion.: Staden föll den 6 mars 961 enligt de flesta källor; vissa anger den 7 mars. Chandax är dagens Heraklion.
The Arab conquest of the island is told in the Arab conquest of Crete.: Arabernas erövring av ön skildras under arabernas erövring av Kreta.
