Cretan success: Kretensiska framgångar
Raiders from Crete had plundered the coasts and islands of the Aegean for over a century, and in 904 a Syrian fleet that used the island as a base had sacked Thessalonica. Byzantine expeditions to retake it failed in 911 and 949. Constantine VII prepared another, and his son Romanos II gave the command to the Domestic of the Schools, Nikephoros Phokas. The fleet, with dromons carrying Greek fire and transports fitted with ramps for horses, sailed in June or July 960 and landed near Chandax.: Plundrare från Kreta hade härjat Egeiska havets kuster och öar i över ett sekel, och 904 hade en syrisk flotta som använde ön som bas plundrat Thessalonike. Bysantinska expeditioner för att återta den misslyckades 911 och 949. Konstantin VII förberedde ännu en, och hans son Romanos II gav befälet åt domestikos ton scholon Nikeforos Fokas. Flottan, med dromoner som förde grekisk eld och transportfartyg utrustade med ramper för hästar, seglade i juni eller juli 960 och landsteg nära Chandax.
Nikephoros scattered the Cretan army on the beach, but Chandax had earthen walls wide enough for two wagons to pass on top and a double moat, and his first attempt to storm it failed. He built a fortified camp, and the fleet blockaded the harbour. A foraging party under Nikephoros Pastilas was ambushed and destroyed in the hills. Nikephoros then surprised a relief army at night, cut off the heads of the dead and threw some into the city with catapults. A second assault failed too, and he settled down to starve the city over the winter while his engineers built heavier siege engines.: Nikeforos skingrade den kretensiska hären på stranden, men Chandax hade jordvallar så breda att två vagnar kunde mötas på krönet och en dubbel vallgrav, och hans första stormningsförsök misslyckades. Han byggde ett befäst läger, och flottan blockerade hamnen. En furageringsstyrka under Nikeforos Pastilas överfölls och förintades i bergen. Nikeforos överraskade sedan en undsättningshär om natten, högg huvudet av de döda och slungade in några i staden med katapulter. Även en andra stormning misslyckades, och han inriktade sig på att svälta ut staden under vintern medan hans ingenjörer byggde tyngre belägringsmaskiner.
