Miners brought down part of the wall and the Byzantines stormed the city. It was sacked for three days.: Minörer fick en del av muren att rasa och bysantinerna stormade staden. Den plundrades i tre dagar.
Triumph in Constantinople: Triumf i Konstantinopel
Nikephoros paraded the emir, his family and the spoils of Chandax through the capital.: Nikeforos förde emiren, hans familj och bytet från Chandax i triumftåg genom huvudstaden.
