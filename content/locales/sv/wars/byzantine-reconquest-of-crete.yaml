Byzantine reconquest of Crete: Bysantinska återerövringen av Kreta
The expedition in which the Byzantine general Nikephoros Phokas, the future emperor, landed on Crete in 960 and after a winter siege stormed Chandax (Heraklion), the capital of the emirate that had raided the Aegean for more than a century. Crete became a Byzantine province again.: Expeditionen där den bysantinske fältherren Nikeforos Fokas, den blivande kejsaren, landsteg på Kreta 960 och efter en vinterlång belägring stormade Chandax (Heraklion), huvudstad i det emirat som i mer än ett sekel hade härjat i Egeiska havet. Kreta blev åter en bysantinsk provins.
