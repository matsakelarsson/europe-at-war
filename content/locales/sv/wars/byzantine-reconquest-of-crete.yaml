The troops came ashore down ramps from their ships, already in battle order, and drove the Cretans back into Chandax.: Trupperna gick i land på ramper från fartygen, redan i stridsordning, och drev kretensarna tillbaka in i Chandax.
Chandax: Chandax
The emirate’s capital held out through the winter behind its massive earthen walls and double moat.: Emiratets huvudstad höll ut under vintern bakom sina massiva jordvallar och dubbla vallgrav.
Relief army destroyed: Undsättningshären förintas
Guided by local Christians, Nikephoros attacked a Muslim army gathering in the hills at night and destroyed it. The site is not recorded.: Ledd av lokala kristna anföll Nikeforos om natten en muslimsk här som samlades i bergen och förintade den. Platsen är inte nedtecknad.
Byzantine fleet: Bysantinska flottan
Nikephoros Phokas: Nikeforos Fokas
The emir, Abd al-Aziz ibn Shu’ayb, appealed to the Ikhshidid ruler of Egypt and to the Fatimid caliph al-Mu’izz. The Fatimid promised a fleet, but nothing came in time. In March 961 Nikephoros attacked again. While the defenders were drawn to a battering ram, his miners dug beneath the walls, propped the tunnel with timber and set it on fire, and a great stretch of wall fell. On 6 March the Byzantines broke in, and the city was given over to plunder for three days.: Emiren, Abd al-Aziz ibn Shu’ayb, vädjade till ikhshididernas härskare i Egypten och till den fatimidiske kalifen al-Mu’izz. Fatimiden lovade en flotta, men inget kom i tid. I mars 961 anföll Nikeforos igen. Medan försvararna drogs till en murbräcka grävde hans minörer under murarna, stöttade tunneln med timmer och satte eld på den, och en lång sträcka av muren rasade. Den 6 mars bröt sig bysantinerna in, och staden lämnades åt plundring i tre dagar.
Many inhabitants were killed or enslaved, and the mosques and walls were torn down. The emir and his son al-Nu’man were taken to Constantinople, where Nikephoros celebrated a triumph. Crete became a province again, and missionaries such as Nikon the Metanoeite worked to convert the remaining Muslims. Al-Nu’man, baptised as Anemas, later died fighting for the empire against the Rus’ at Dorostolon. Nikephoros went on to campaign in Cilicia and Syria and took the throne in 963.: Många invånare dödades eller gjordes till slavar, och moskéerna och murarna revs. Emiren och hans son al-Nu’man fördes till Konstantinopel, där Nikeforos firade en triumf. Kreta blev åter en provins, och missionärer som Nikon Metanoeite verkade för att omvända de kvarvarande muslimerna. Al-Nu’man, döpt till Anemas, stupade senare i strid för riket mot ruserna vid Dorostolon. Nikeforos förde därefter fälttåg i Kilikien och Syrien och besteg tronen 963.
