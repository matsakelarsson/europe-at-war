Many raiders were Turkmen bands, only loosely under the Seljuk sultans, who were often more concerned with Iran, Iraq and the Fatimids of Egypt. Byzantine writers called all of them Turks.: Många av plundrarna var turkmenska band, som bara löst lydde under de seldjukiska sultanerna, vilka ofta var mer upptagna av Iran, Irak och fatimiderna i Egypten. Bysantinska skribenter kallade dem alla turkar.
The main sources are Byzantine (Michael Attaleiates, who was at Manzikert, Michael Psellos, John Skylitzes and Nikephoros Bryennios), Armenian (Aristakes Lastivertsi and Matthew of Edessa) and Arabic and Persian historians such as Ibn al-Athir. They differ on numbers, on the terms agreed after Manzikert and on what happened to the troops sent to Khliat.: De främsta källorna är bysantinska (Mikael Attaleiates, som var med vid Manzikert, Mikael Psellos, Johannes Skylitzes och Nikeforos Bryennios), armeniska (Aristakes Lastivertsi och Mattias av Edessa) samt arabiska och persiska historiker som Ibn al-Athir. De skiljer sig åt i fråga om siffror, om de villkor som avtalades efter Manzikert och om vad som hände med trupperna som sändes till Chliat.
Place names. Manzikert is Malazgirt, Khliat is Ahlat, Theodosiopolis is Erzurum, Kapetron is Pasinler, Sebasteia is Sivas, Melitene is Malatya, Caesarea is Kayseri, Iconium is Konya, Chonae is Honaz, Dokeia is Tokat, Kotyaion is Kütahya and Nicaea is İznik. Ani, the old Armenian capital, lies in ruins on today’s Turkish–Armenian border.: Ortnamn. Manzikert är Malazgirt, Chliat är Ahlat, Theodosiopolis är Erzurum, Kapetron är Pasinler, Sebasteia är Sivas, Melitene är Malatya, Caesarea är Kayseri, Ikonion är Konya, Chonai är Honaz, Dokeia är Tokat, Kotyaion är Kütahya och Nikaia är İznik. Ani, den gamla armeniska huvudstaden, ligger i ruiner vid dagens turkisk-armeniska gräns.
