"In 1064 Tughril’s nephew and successor, Alp Arslan, invaded Georgia and Armenia and besieged Ani, the former Armenian royal city, now held by a Byzantine garrison. It fell on 16 August, and Armenian and Arab writers describe the slaughter of many of its people. The next year the Armenian king of Kars handed his land to the empire in exchange for estates in Asia Minor. Turkmen bands now rode deep into Anatolia almost every year: they plundered Caesarea in 1067, Neocaesarea and Amorium in 1068, Iconium in 1069 and Chonae, near the Aegean, in 1070.": "År 1064 föll Tughrils brorson och efterträdare, Alp Arslan, in i Georgien och Armenien och belägrade Ani, den forna armeniska kungastaden, som nu hölls av en bysantinsk garnison. Den föll den 16 augusti, och armeniska och arabiska skribenter beskriver hur många av dess invånare slaktades. Året därpå överlämnade den armeniske kungen av Kars sitt land till riket i utbyte mot gods i Mindre Asien. Turkmenska band red nu djupt in i Anatolien nästan varje år: de plundrade Caesarea 1067, Neokaisareia och Amorion 1068, Ikonion 1069 och Chonai, nära Egeiska havet, 1070."
In 1068 the general Romanos Diogenes married the widowed empress Eudokia and became emperor. He set out to rebuild the eastern army, much of it now foreign mercenaries, and campaigned every year. In 1068 he marched into Syria and took Hierapolis (Manbij); in 1069 he campaigned in Cappadocia and towards Lake Van with little result. In 1070, while he stayed in Constantinople, his general Manuel Komnenos was defeated and captured near Sebasteia. Romanos resolved to secure the frontier by retaking the fortresses around Lake Van.: År 1068 gifte sig fältherren Romanos Diogenes med den änkta kejsarinnan Eudokia och blev kejsare. Han satte sig för att bygga upp den östra hären, som nu till stor del bestod av utländska legosoldater, och förde fälttåg varje år. År 1068 tågade han in i Syrien och intog Hierapolis (Manbij); 1069 förde han fälttåg i Kappadokien och mot Vansjön med ringa resultat. År 1070, medan han stannade i Konstantinopel, besegrades och tillfångatogs hans fältherre Manuel Komnenos nära Sebasteia. Romanos beslöt att säkra gränsen genom att återta fästningarna kring Vansjön.
