Byzantine–Seljuk wars: Bysantinsk-seldjukiska krigen
The wars in which the Seljuk Turks and the Turkmen tribes that followed them broke Byzantine power in Armenia and Asia Minor. After two decades of raids, during which Alp Arslan took Ani in 1064, the sultan defeated and captured the Emperor Romanos IV Diogenes at Manzikert in 1071. The Byzantine civil wars that followed let Turkish bands settle across Anatolia, and by 1081 a Seljuk prince ruled from Nicaea, close to Constantinople.: Krigen där seldjukturkarna och de turkmenstammar som följde dem bröt den bysantinska makten i Armenien och Mindre Asien. Efter två decennier av härjningståg, under vilka Alp Arslan intog Ani 1064, besegrade och tillfångatog sultanen kejsar Romanos IV Diogenes vid Manzikert 1071. De bysantinska inbördeskrig som följde gjorde det möjligt för turkiska skaror att slå sig ned över hela Anatolien, och 1081 styrde en seldjukisk furste från Nicaea, nära Konstantinopel.
