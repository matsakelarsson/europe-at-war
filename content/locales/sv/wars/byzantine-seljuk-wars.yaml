"In the spring of 1071 Romanos marched east with a large but mixed army: Byzantine regiments, Armenian and Georgian levies, Norman and Frankish mercenaries under Roussel de Bailleul, Pecheneg and Uz horsemen and part of the Varangian Guard, perhaps 40,000 men in all. Alp Arslan, who had been campaigning in northern Syria on his way to fight the Fatimids, hurried north. Unaware how close he was, Romanos split his forces, sending Joseph Tarchaneiotes and Roussel with about half the army towards Khliat, and took Manzikert himself on 23 August. The Khliat force took no further part; Muslim writers say it was beaten, Byzantine writers that it withdrew.": "Våren 1071 tågade Romanos österut med en stor men brokig här: bysantinska regementen, armeniska och georgiska uppbåd, normandiska och frankiska legosoldater under Roussel de Bailleul, petjenegiska och uziska ryttare och en del av varjagergardet, kanske 40 000 man sammanlagt. Alp Arslan, som hade varit på fälttåg i norra Syrien på väg för att bekämpa fatimiderna, skyndade norrut. Ovetande om hur nära han var delade Romanos sina styrkor, sände Josef Tarchaneiotes och Roussel med ungefär halva hären mot Chliat och intog själv Manzikert den 23 augusti. Styrkan vid Chliat deltog inte vidare; muslimska skribenter säger att den besegrades, bysantinska att den drog sig tillbaka."
On 26 August, having rejected a Seljuk offer of terms, Romanos advanced across the plain. The Turkish horse archers fell back before him, shooting into his flanks. By evening he had reached the sultan’s camp without forcing a battle and ordered a return to his own. In the confusion Andronikos Doukas, commanding the rearguard and the son of Romanos’s rival, the Caesar John Doukas, marched off the field instead of covering the withdrawal. The Turks attacked, the wings broke and Romanos, fighting on, was wounded and captured, the first Byzantine emperor to become the prisoner of a Muslim ruler. Most of the army escaped, and losses may have been lower than later writers claimed.: Den 26 augusti, sedan han avvisat ett seldjukiskt erbjudande om villkor, ryckte Romanos fram över slätten. De turkiska beridna bågskyttarna vek undan för honom och sköt in i hans flanker. På kvällen hade han nått sultanens läger utan att ha kunnat tvinga fram ett slag och beordrade återtåg till sitt eget. I förvirringen marscherade Andronikos Doukas, som förde befälet över eftertruppen och var son till Romanos rival, caesar Johannes Doukas, bort från slagfältet i stället för att skydda återtåget. Turkarna anföll, flyglarna bröts och Romanos, som fortsatte att strida, sårades och tillfångatogs, den förste bysantinske kejsaren som blev fånge hos en muslimsk härskare. Större delen av hären kom undan, och förlusterna kan ha varit lägre än senare skribenter påstod.
Alp Arslan treated Romanos generously and freed him after a week, on terms that included a ransom, a yearly tribute and, in some accounts, Manzikert, Antioch, Edessa and Hierapolis. But the Doukas family had already made Michael VII emperor; Romanos was defeated, surrendered at Adana and was blinded in June 1072, dying of his wounds. In the civil wars of the next decade, against Roussel de Bailleul, Nikephoros Botaneiates and Nikephoros Melissenos, emperors and rebels alike hired Turkish bands and let them garrison towns, while Turkmen settled across the plateau. When Alexios I Komnenos seized the throne in April 1081, Suleiman ibn Qutulmish ruled from Nicaea. Many historians see these civil wars, more than the battle itself, as the cause of the loss of Anatolia.: Alp Arslan behandlade Romanos generöst och frigav honom efter en vecka, på villkor som omfattade en lösensumma, en årlig tribut och enligt vissa källor Manzikert, Antiochia, Edessa och Hierapolis. Men familjen Doukas hade redan gjort Mikael VII till kejsare; Romanos besegrades, kapitulerade i Adana och bländades i juni 1072 och dog av sina skador. Under det följande decenniets inbördeskrig, mot Roussel de Bailleul, Nikeforos Botaneiates och Nikeforos Melissenos, anlitade kejsare och upprorsmän turkiska band och lät dem besätta städer, medan turkmener slog sig ned över hela högplatån. När Alexios I Komnenos grep tronen i april 1081 styrde Süleyman ibn Qutalmish från Nikaia. Många historiker ser dessa inbördeskrig, mer än själva slaget, som orsaken till att Anatolien gick förlorat.
