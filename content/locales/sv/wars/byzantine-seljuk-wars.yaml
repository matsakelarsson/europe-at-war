Besieged here by Andronikos Doukas, Romanos surrendered on a promise of safety. He was blinded at Kotyaion on 29 June 1072 and died soon after.: Belägrad här av Andronikos Doukas kapitulerade Romanos mot löfte om fri lejd. Han bländades i Kotyaion den 29 juni 1072 och dog kort därefter.
c. 1080–1081: ca 1080–1081
Turkish troops brought in by rival Byzantine claimants garrisoned the city, and Suleiman ibn Qutulmish made it his capital. In 1081 Alexios I agreed with him a frontier on the river Drakon, on the Gulf of Nicomedia.: Turkiska trupper som rivaliserande bysantinska tronpretendenter fört dit besatte staden, och Süleyman ibn Qutalmish gjorde den till sin huvudstad. År 1081 kom Alexios I överens med honom om en gräns vid floden Drakon, vid Nikomediaviken.
