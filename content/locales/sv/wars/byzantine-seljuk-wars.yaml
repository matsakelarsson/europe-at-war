By the 1040s Byzantium had annexed the Armenian kingdoms of Vaspurakan and Ani, and Constantine IX let the local troops of the eastern provinces pay taxes instead of serving. In Iran the Seljuks, a ruling family of Oghuz Turks, had built an empire, and Turkmen bands began raiding Byzantine Armenia. In 1048 Ibrahim Inal, half-brother of the sultan Tughril, invaded in force. The Byzantine commanders, Aaron and Katakalon Kekaumenos, were ordered to wait for the Georgian prince Liparit IV, and meanwhile the Turks burned Artze, a rich, unwalled market town, killing many of its people.: På 1040-talet hade Bysans annekterat de armeniska kungarikena Vaspurakan och Ani, och Konstantin IX lät de lokala trupperna i de östra provinserna betala skatt i stället för att göra tjänst. I Iran hade seldjukerna, en härskarsläkt av oghuzturkar, byggt upp ett imperium, och turkmenska band började härja i det bysantinska Armenien. År 1048 föll Ibrahim Inal, halvbror till sultanen Tughril, in med stor styrka. De bysantinska befälhavarna, Aaron och Katakalon Kekaumenos, beordrades att vänta på den georgiske fursten Liparit IV, och under tiden brände turkarna Artze, en rik och obefäst handelsstad, och dödade många av dess invånare.
"On the night of 18 September the allies fought Ibrahim at Kapetron. The Byzantine wings drove the Turks off, but in the centre Liparit was captured, and Ibrahim went home with his plunder. Liparit was later freed and embassies passed between the two courts, but the raids resumed in 1054, when Tughril himself besieged Manzikert and was beaten off by its commander, Basil Apokapes. With many Byzantine troops away fighting the Pechenegs in the Balkans, the raiders went deeper: Melitene was sacked in 1057 and Sebasteia in 1059.": "Natten till den 18 september stred de allierade mot Ibrahim vid Kapetron. De bysantinska flyglarna drev bort turkarna, men i centrum tillfångatogs Liparit, och Ibrahim drog hem med sitt byte. Liparit frigavs senare och beskickningar gick mellan de två hoven, men härjningarna återupptogs 1054, då Tughril själv belägrade Manzikert och slogs tillbaka av dess befälhavare, Basileios Apokapes. Med många bysantinska trupper borta i strid mot petjenegerna på Balkan trängde plundrarna allt djupare in: Melitene plundrades 1057 och Sebasteia 1059."
