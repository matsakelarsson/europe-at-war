Byzantine–Venetian war of 1171: Bysantinsk-venetianska kriget 1171
On 12 March 1171 the emperor Manuel I Komnenos had all the Venetians in the Byzantine Empire arrested and their ships and goods seized, after Venetians had attacked the Genoese quarter in Constantinople. Venice sent a large fleet under Doge Vitale II Michiel, which attacked Byzantine towns on Euboea and wintered on Chios, but while the doge negotiated, plague broke out in the fleet and it returned home in 1172. The doge was murdered in Venice soon after. Relations were restored only in the 1180s, and the grievance was remembered when the Fourth Crusade turned on Constantinople.: Den 12 mars 1171 lät kejsar Manuel I Komnenos arrestera alla venetianare i Bysantinska riket och beslagta deras fartyg och varor, sedan venetianare hade angripit det genuesiska kvarteret i Konstantinopel. Venedig sände en stor flotta under dogen Vitale II Michiel, som angrep bysantinska städer på Euboia och övervintrade på Chios, men medan dogen förhandlade bröt pest ut i flottan, som återvände hem 1172. Dogen mördades i Venedig kort därefter. Förbindelserna återställdes först på 1180-talet, och oförrätten var inte glömd när fjärde korståget vände sig mot Konstantinopel.
