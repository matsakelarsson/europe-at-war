The number of Venetians arrested is uncertain; the sources give figures of 10,000 or more. Venice had enjoyed wide trading privileges in the empire since the 1080s, which made its merchants rich and widely resented.: Antalet arresterade venetianare är osäkert; källorna anger siffror på 10 000 eller fler. Venedig hade sedan 1080-talet åtnjutit omfattande handelsprivilegier i riket, vilket gjorde dess köpmän rika och allmänt avskydda.
