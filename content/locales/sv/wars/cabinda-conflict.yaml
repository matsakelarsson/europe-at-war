Cabinda conflict: Konflikten i Cabinda
? Last updated 27 November 2026. A low-intensity separatist insurgency in Cabinda, the oil-rich Angolan exclave between the two Congos. Cabinda’s chiefs placed it under Portuguese protection by the Treaty of Simulambuco in 1885, and it was ruled as a separate protectorate before Portugal attached it to Angola; the Front for the Liberation of the Enclave of Cabinda (FLEC), founded in 1963, argues that it was never part of Angola. The Alvor Agreement of January 1975 treated Cabinda as an integral part of Angola, and on 1 August 1975 FLEC proclaimed a Republic of Cabinda, but MPLA and Cuban troops took control of the enclave and its oil installations in November 1975 and beat off FLEC and Zairian attacks. FLEC split into factions and fought a guerrilla war in the forests of Mayombe, kidnapping foreign oil workers and attacking soldiers, while the Angolan army, which built up large forces after the civil war ended in 2002, was accused by rights groups of abuses against civilians. In 2006 a memorandum of understanding with the Cabinda Forum for Dialogue and FLEC-Renovada under António Bento Bembe gave Cabinda a special status, but the main armed faction, FLEC-FAC, rejected it. On 8 January 2010 gunmen of a FLEC faction, FLEC-PM, attacked the bus of Togo’s football team before the Africa Cup of Nations, killing two team officials and the driver. Since then FLEC-FAC has claimed sporadic attacks, including one in March 2025 in which it said it had killed 32 soldiers, claims that cannot be verified and that Angola does not confirm. On 2 February 2026 FLEC’s secretary general, Jacinto António Telica, declared Cabinda “a sovereign and independent state” in a video shown at a press conference in Brussels, the day after police in Cabinda arrested demonstrators marking the anniversary of the Simulambuco treaty; no state is known to have recognised the declaration, and Angola treats the enclave as one of its provinces. The death toll of the conflict is not known.
: Senast uppdaterad 27 november 2026. Ett separatistiskt uppror av låg intensitet i Cabinda, den oljerika angolanska exklaven mellan de två Kongorepublikerna. Cabindas hövdingar ställde området under portugisiskt beskydd genom fördraget i Simulambuco 1885, och det styrdes som ett separat protektorat innan Portugal förenade det med Angola; Fronten för befrielse av enklaven Cabinda (FLEC), grundad 1963, hävdar att det aldrig har varit en del av Angola. Alvoravtalet i januari 1975 behandlade Cabinda som en integrerad del av Angola, och den 1 augusti 1975 utropade FLEC en republik Cabinda, men MPLA:s och Kubas trupper tog kontroll över enklaven och dess oljeanläggningar i november 1975 och slog tillbaka anfall från FLEC och Zaire. FLEC splittrades i fraktioner och förde ett gerillakrig i Mayombes skogar, där man kidnappade utländska oljearbetare och angrep soldater, medan den angolanska armén, som byggde upp stora styrkor sedan inbördeskriget tagit slut 2002, av människorättsorganisationer anklagades för övergrepp mot civila. År 2006 gav ett samförståndsavtal med Cabindas forum för dialog och FLEC-Renovada under António Bento Bembe Cabinda en särskild status, men den viktigaste väpnade fraktionen, FLEC-FAC, förkastade det. Den 8 januari 2010 angrep beväpnade män från en FLEC-fraktion, FLEC-PM, Togos fotbollslandslags buss inför Afrikanska mästerskapet i fotboll och dödade två lagfunktionärer och chauffören. Sedan dess har FLEC-FAC tagit på sig sporadiska anfall, bland dem ett i mars 2025 där fraktionen uppgav att den hade dödat 32 soldater, påståenden som inte kan kontrolleras och som Angola inte bekräftar. Den 2 februari 2026 förklarade FLEC:s generalsekreterare Jacinto António Telica Cabinda för ”en suverän och självständig stat” i en video som visades vid en presskonferens i Bryssel, dagen efter att polisen i Cabinda hade gripit demonstranter som högtidlighöll årsdagen av fördraget i Simulambuco; ingen stat är känd för att ha erkänt förklaringen, och Angola behandlar exklaven som en av sina provinser. Antalet döda i konflikten är inte känt.
