# Svenska översättningar av katalogtexten (våg 14); stegtexterna kommer senare.
California genocide: Folkmordet i Kalifornien
? The killing, enslavement and starvation of the Native peoples of California after the American conquest of 1846, during the gold rush and the first decades of statehood. Between 1846 and 1873 settlers, miners, volunteer companies paid by the state and the US Army killed, by the historian Benjamin Madley’s count, between about 9,500 and 16,000 Native Californians, in hundreds of attacks on villages; several thousand more died of starvation or forced labour. The Native population, perhaps 300,000 before Spanish colonisation and about 150,000 at the American conquest, fell to about 30,000 by 1870 and 16,000 by 1900, through killing, disease, hunger and the loss of land and food. California’s first laws denied Native people the vote and the right to testify against whites, and the Act for the Government and Protection of Indians of 1850 allowed Native children and adults to be bound as unpaid labourers; between 10,000 and 27,000 were held in forced labour. Governor Peter Burnett told the legislature in 1851 that a war of extermination would go on until the Indian race became extinct, and the state paid up to $1.51 million for militia expeditions, much of it repaid by the federal government. Eighteen treaties that would have set aside reservations were rejected by the Senate in 1852. In 2019 Governor Gavin Newsom apologised on behalf of the state and called what happened a genocide; most historians now use the word, while some prefer terms such as ethnic cleansing and give lower death tolls.
: Dödandet, förslavandet och utsvältningen av Kaliforniens ursprungsfolk efter den amerikanska erövringen 1846, under guldrushen och delstatens första årtionden. Mellan 1846 och 1873 dödade nybyggare, gruvarbetare, frivilliga kompanier som betalades av delstaten och USA:s armé enligt historikern Benjamin Madleys beräkning mellan omkring 9 500 och 16 000 kaliforniska ursprungsamerikaner, vid hundratals anfall mot byar; ytterligare flera tusen dog av svält eller tvångsarbete. Ursprungsbefolkningen, som kanske uppgick till 300 000 före den spanska koloniseringen och till omkring 150 000 vid den amerikanska erövringen, sjönk till omkring 30 000 år 1870 och 16 000 år 1900, genom dödande, sjukdomar, svält och förlusten av land och föda. Kaliforniens första lagar förvägrade ursprungsamerikaner rösträtt och rätten att vittna mot vita, och Act for the Government and Protection of Indians från 1850 tillät att ursprungsamerikanska barn och vuxna bands som obetalda arbetare; mellan 10 000 och 27 000 hölls i tvångsarbete. Guvernör Peter Burnett sade till den lagstiftande församlingen 1851 att ett utrotningskrig skulle fortsätta tills den indianska rasen hade dött ut, och delstaten betalade upp till 1,51 miljoner dollar för milisexpeditioner, varav mycket ersattes av den federala regeringen. Arton fördrag som skulle ha avsatt reservat förkastades av senaten 1852. År 2019 bad guvernör Gavin Newsom om ursäkt å delstatens vägnar och kallade det som hade hänt ett folkmord; de flesta historiker använder nu ordet, medan några föredrar termer som etnisk rensning och anger lägre dödstal.
