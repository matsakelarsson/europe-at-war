# Svenska översättningar av katalogtexten (våg 11); stegtexterna kommer senare.
Cambodian Civil War: Kambodjanska inbördeskriget
The war in which the Communist Party of Kampuchea, the Khmer Rouge, came to power in Cambodia. A peasant revolt at Samlaut in 1967 and a communist rising from 1968 were put down by Prince Norodom Sihanouk’s government, but the war widened when General Lon Nol deposed Sihanouk on 18 March 1970. Sihanouk allied with the Khmer Rouge from exile in Beijing; North Vietnamese troops, whose bases in eastern Cambodia had been bombed in secret by the Americans since 1969, routed Lon Nol’s army; and American and South Vietnamese forces invaded the border areas in May 1970. The Khmer Republic, kept alive by American aid and one of the heaviest bombing campaigns in history, lost the countryside to the Khmer Rouge, who besieged Phnom Penh from January 1975 and took it on 17 April 1975. They emptied the cities the same day and began the rule of Democratic Kampuchea, in which some 1.5 to 2 million people died.: Det krig genom vilket Kampucheas kommunistiska parti, Röda khmererna, kom till makten i Kambodja. En bonderevolt i Samlaut 1967 och en kommunistisk resning från 1968 slogs ned av prins Norodom Sihanouks regering, men kriget vidgades när general Lon Nol avsatte Sihanouk den 18 mars 1970. Sihanouk allierade sig med Röda khmererna från exilen i Peking; nordvietnamesiska trupper, vars baser i östra Kambodja amerikanerna i hemlighet hade bombat sedan 1969, krossade Lon Nols armé; och amerikanska och sydvietnamesiska styrkor invaderade gränsområdena i maj 1970. Khmerrepubliken, som hölls vid liv av amerikanskt bistånd och en av de mest omfattande bombkampanjerna i historien, förlorade landsbygden till Röda khmererna, som belägrade Phnom Penh från januari 1975 och intog staden den 17 april 1975. Samma dag tömde de städerna och inledde Demokratiska Kampucheas styre, under vilket omkring 1,5 till 2 miljoner människor dog.
