# Svenska översättningar av katalogtexten (våg 11); stegtexterna kommer senare.
Cambodian–Thai border conflict: Gränskonflikten mellan Kambodja och Thailand
? The armed clashes between Cambodia and Thailand over disputed stretches of their border along the Dângrêk escarpment, in 2008–2011 and again in 2025. The border was drawn by Franco-Siamese treaties of 1904 and 1907 and French maps whose lines do not always follow the watershed the treaties named. In 1962 the International Court of Justice awarded the temple of Preah Vihear to Cambodia, but not the land around it. When the temple was listed as a World Heritage Site in July 2008, Thai nationalists protested, troops faced each other at the temple, and clashes followed until 2011, the worst in February and April–May 2011, before the court ruled in 2013 that the whole promontory was Cambodian. In 2025 a skirmish in May led to five days of war in July, with artillery, rockets and Thai air strikes along some 200 km of the border, ended by a ceasefire brokered by Malaysia with American and Chinese help, and to three weeks of heavier fighting in December, in which Thai forces took several disputed temples and hills. A ceasefire signed on 27 December 2025 has held, uneasily, into late 2026.
: De väpnade sammandrabbningarna mellan Kambodja och Thailand om omstridda sträckor av gränsen längs Dângrêkbranten, 2008–2011 och på nytt 2025. Gränsen drogs genom fransk-siamesiska fördrag 1904 och 1907 och franska kartor vars linjer inte alltid följer den vattendelare som fördragen angav. 1962 tilldömde Internationella domstolen Kambodja templet Preah Vihear, men inte marken runt det. När templet fördes upp på världsarvslistan i juli 2008 protesterade thailändska nationalister, trupper stod mot varandra vid templet, och sammandrabbningar följde fram till 2011, de värsta i februari och april–maj 2011, innan domstolen 2013 fastslog att hela bergsudden var kambodjansk. 2025 ledde en skärmytsling i maj till fem dagars krig i juli, med artilleri, raketer och thailändska flyganfall längs omkring 200 km av gränsen, som avslutades genom ett eldupphör som Malaysia förhandlade fram med amerikansk och kinesisk hjälp, och till tre veckors hårdare strider i december, då thailändska styrkor intog flera omstridda tempel och höjder. Ett eldupphör som undertecknades den 27 december 2025 har hållit, om än ostadigt, in i slutet av 2026.
