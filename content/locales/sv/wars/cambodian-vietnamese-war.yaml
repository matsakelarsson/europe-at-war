# Svenska översättningar av katalogtexten (våg 11); stegtexterna kommer senare.
Cambodian–Vietnamese War: Kambodjansk-vietnamesiska kriget
The war between Vietnam and the Khmer Rouge, and the long occupation that followed. From 1977 the forces of Democratic Kampuchea raided Vietnamese border villages and massacred their people, while purges inside Cambodia drove Khmer Rouge commanders to flee to Vietnam. On 25 December 1978 the Vietnamese army invaded with Cambodian exiles, took Phnom Penh on 7 January 1979 and installed the People’s Republic of Kampuchea, ending a regime under which some 1.5 to 2 million Cambodians had died. China answered with its own attack on Vietnam in February 1979. For ten years Vietnamese troops fought a guerrilla war along the Thai border against the Khmer Rouge, armed by China and sheltered by Thailand, and two non-communist movements backed by ASEAN and the West, which together kept Cambodia’s seat at the United Nations. Vietnam withdrew its army in September 1989, and the Paris Peace Agreements of 23 October 1991 placed Cambodia under UN transitional rule until elections in 1993.: Kriget mellan Vietnam och Röda khmererna, och den långa ockupation som följde. Från 1977 gjorde Demokratiska Kampucheas styrkor räder mot vietnamesiska gränsbyar och massakrerade deras invånare, medan utrensningar inne i Kambodja fick befälhavare inom Röda khmererna att fly till Vietnam. Den 25 december 1978 invaderade den vietnamesiska armén tillsammans med kambodjanska exiler, intog Phnom Penh den 7 januari 1979 och installerade Folkrepubliken Kampuchea, vilket gjorde slut på en regim under vilken omkring 1,5 till 2 miljoner kambodjaner hade dött. Kina svarade med ett eget angrepp på Vietnam i februari 1979. I tio år förde vietnamesiska trupper ett gerillakrig längs den thailändska gränsen mot Röda khmererna, som beväpnades av Kina och fick skydd av Thailand, och två icke-kommunistiska rörelser med stöd av ASEAN och västmakterna, som tillsammans behöll Kambodjas plats i FN. Vietnam drog tillbaka sin armé i september 1989, och Parisavtalen den 23 oktober 1991 ställde Kambodja under FN:s övergångsstyre fram till valen 1993.
