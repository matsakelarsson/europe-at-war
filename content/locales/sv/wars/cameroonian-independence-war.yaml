# Svenska översättningar av katalogtexten (våg 13); stegtexterna kommer senare.
Cameroonian independence war: Kameruns självständighetskrig
? The war between the Union of the Peoples of Cameroon (UPC), the nationalist party that demanded immediate independence and the reunification of the French and British Cameroons, and the French colonial authorities and, after independence in 1960, the government of Ahmadou Ahidjo with French military support. France banned the UPC after riots in May 1955; its leader Ruben Um Nyobè took to the forests of the Sanaga-Maritime in 1956 and was killed by a French-led patrol in September 1958. From 1959 the UPC’s army fought in the Bamileke country of western Cameroon and in the Mungo, where French and Cameroonian troops waged a counter-insurgency of resettlement camps, burned villages and air strikes into the mid-1960s. Félix-Roland Moumié, the UPC’s president in exile, was poisoned by a French agent in Geneva in 1960, and the last guerrilla leader, Ernest Ouandié, was executed in Bafoussam in January 1971. Estimates of the dead range from about 10,000 to well over 100,000; most historians give figures in the tens of thousands. In 2025 France officially acknowledged that it had waged a war in Cameroon.
: Kriget mellan Union des populations du Cameroun (UPC), det nationalistiska parti som krävde omedelbar självständighet och återförening av Franska och Brittiska Kamerun, och de franska kolonialmyndigheterna och, efter självständigheten 1960, Ahmadou Ahidjos regering med franskt militärt stöd. Frankrike förbjöd UPC efter upplopp i maj 1955; partiledaren Ruben Um Nyobè gick 1956 till skogs i Sanaga-Maritime och dödades av en patrull under franskt befäl i september 1958. Från 1959 stred UPC:s armé i bamilekeområdet i västra Kamerun och i Mungo, där franska och kamerunska trupper fram till mitten av 1960-talet förde en upprorsbekämpning med omflyttningsläger, brända byar och flyganfall. Félix-Roland Moumié, UPC:s ordförande i exil, förgiftades av en fransk agent i Genève 1960, och den siste gerillaledaren, Ernest Ouandié, avrättades i Bafoussam i januari 1971. Uppskattningarna av antalet döda sträcker sig från omkring 10 000 till långt över 100 000; de flesta historiker anger siffror i storleksordningen tiotusentals. År 2025 erkände Frankrike officiellt att det hade fört ett krig i Kamerun.
