Camisard revolt: Kamisardupproret
A rising of the Protestants of the Cévennes in southern France against the persecution that followed Louis XIV’s revocation of the Edict of Nantes in 1685, which had made Protestant worship illegal. It began on 24 July 1702, when insurgents killed the abbé du Chayla, who had imprisoned and mistreated Protestants, at Le Pont-de-Montvert. Inspired by prophets and led by young commanders such as Jean Cavalier and Roland (Pierre Laporte), a few thousand Camisards fought a guerrilla war in the mountains and the plain around Nîmes, killing priests and burning churches, against royal troops that grew to many thousands. Marshal Montrevel answered with mass reprisals, and from the autumn of 1703 hundreds of villages and hamlets in the upper Cévennes were burned and their people driven out. Marshal Villars, sent in 1704, combined force with offers of amnesty; Cavalier made terms in May 1704 and later left France, and Roland was killed in August. Scattered resistance went on until about 1710.: Ett uppror bland protestanterna i Cevennerna i södra Frankrike mot den förföljelse som följde på Ludvig XIV:s upphävande av ediktet i Nantes 1685, vilket hade gjort protestantisk gudstjänst olaglig. Det började den 24 juli 1702, när upprorsmän i Le Pont-de-Montvert dödade abbé du Chayla, som hade fängslat och misshandlat protestanter. Inspirerade av profeter och ledda av unga befälhavare som Jean Cavalier och Roland (Pierre Laporte) förde några tusen kamisarder ett gerillakrig i bergen och på slätten kring Nîmes, där de dödade präster och brände kyrkor, mot kungliga trupper som växte till många tusen man. Marskalk Montrevel svarade med massrepressalier, och från hösten 1703 brändes hundratals byar och småorter i övre Cevennerna och invånarna fördrevs. Marskalk Villars, som sändes dit 1704, kombinerade våld med erbjudanden om amnesti; Cavalier ingick en uppgörelse i maj 1704 och lämnade senare Frankrike, och Roland dödades i augusti. Spritt motstånd fortsatte till omkring 1710.
