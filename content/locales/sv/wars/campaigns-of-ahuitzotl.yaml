# Svenska översättningar av katalogtexten (våg 14); stegtexterna kommer senare.
Campaigns of Ahuitzotl: Ahuitzotls fälttåg
? The wars of Ahuitzotl, ruler of Tenochtitlan from 1486 to 1502, who roughly doubled the lands that paid tribute to the Aztec Triple Alliance. He succeeded his brother Tizoc, whose short reign had brought few victories, and began with a campaign against rebel towns in the Huasteca on the Gulf coast, whose captives were sacrificed at the dedication of the enlarged Templo Mayor in 1487; the sources give numbers from about 4,000 to Diego Durán’s 80,400, and modern historians think the higher figures much exaggerated. In the west, in what is now Guerrero, his armies took Teloloapan, Oztoman and Alahuiztlan near the Tarascan frontier and resettled them with colonists from the Valley of Mexico to hold the border. His main wars went south. In Oaxaca the Mexica fought the Mixtec and Zapotec kingdoms, and in the Isthmus of Tehuantepec Cosijoeza, the Zapotec king of Zaachila, allied with the Mixtec, held out in the mountain fortress of Guiengola, near Tehuantepec, through a siege that Zapotec accounts say lasted seven months, in the later 1490s. The war ended in a settlement sealed by Cosijoeza’s marriage to a daughter of Ahuitzotl, and Tehuantepec kept its own kings while Aztec armies used the road through it. Beyond the isthmus Ahuitzotl’s armies conquered Xoconochco (Soconusco) on the Pacific coast of today’s Chiapas, rich in cacao and tropical feathers, and raided into what is now Guatemala; the date of the conquest is given as 1486 in some sources and about 1500 in others. Ahuitzotl died in 1502 and was succeeded by his nephew Moctezuma II.
: Krigen under Ahuitzotl, härskare i Tenochtitlan 1486–1502, som ungefär fördubblade de områden som betalade tribut till aztekernas trippelallians. Han efterträdde sin bror Tizoc, vars korta regering hade gett få segrar, och inledde med ett fälttåg mot upproriska städer i Huasteca vid kusten mot Mexikanska golfen, vars fångar offrades vid invigningen av det utbyggda Templo Mayor 1487; källorna anger antal från omkring 4 000 till Diego Duráns 80 400, och moderna historiker anser de högre siffrorna kraftigt överdrivna. I väster, i det som i dag är Guerrero, intog hans arméer Teloloapan, Oztoman och Alahuiztlan nära den taraskiska gränsen och befolkade dem på nytt med kolonister från Mexikodalen för att hålla gränsen. Hans viktigaste krig gick söderut. I Oaxaca stred mexica mot de mixtekiska och zapotekiska kungarikena, och på Tehuantepecnäset höll Cosijoeza, zapotekkungen i Zaachila, i allians med mixtekerna, stånd i bergsfästningen Guiengola nära Tehuantepec under en belägring som enligt zapotekiska berättelser varade i sju månader, under senare delen av 1490-talet. Kriget slutade med en uppgörelse som beseglades genom Cosijoezas giftermål med en dotter till Ahuitzotl, och Tehuantepec behöll sina egna kungar medan aztekiska arméer använde vägen genom området. På andra sidan näset erövrade Ahuitzotls arméer Xoconochco (Soconusco) vid Stillahavskusten i dagens Chiapas, rikt på kakao och tropiska fjädrar, och gjorde räder in i det som i dag är Guatemala; erövringen dateras till 1486 i vissa källor och till omkring 1500 i andra. Ahuitzotl dog 1502 och efterträddes av sin brorson Moctezuma II.
