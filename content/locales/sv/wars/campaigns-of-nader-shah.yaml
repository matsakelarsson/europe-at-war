# Svenska översättningar av katalogtexten (våg 7); stegtexterna kommer senare.
Campaigns of Nader Shah: Nader Shahs fälttåg
The wars of Nader, an Afshar Turkmen soldier who rose from leading a band in northern Khorasan to be shah of Persia (1736–1747) and the most feared conqueror of his age. After expelling the Afghans from Persia in 1729 and winning back the west from the Ottomans, he subdued the Abdali Afghans of Herat, made himself shah, took Kandahar, the last Hotaki stronghold, in 1738 and invaded Mughal India. He routed the Mughal army at Karnal in 1739, sacked Delhi and carried off the Peacock Throne. In 1740 he forced Bukhara and Khiva to submit. His later years were spent in a costly war in Dagestan, a new war with the Ottomans and the bloody suppression of revolts against his heavy taxes, until his own officers killed him in 1747 and his empire fell apart.: Krigen som fördes av Nader, en turkmensk soldat av afsharstammen som från att ha lett en skara beväpnade män i norra Khorasan steg till att bli shah av Persien (1736–1747) och sin tids mest fruktade erövrare. Sedan han 1729 hade fördrivit afghanerna ur Persien och återvunnit landets västra delar från osmanerna underkuvade han Abdali-afghanerna i Herat, gjorde sig själv till shah, intog 1738 Kandahar, hotakiernas sista fäste, och föll in i mogulernas Indien. Han slog mogulhären på flykten vid Karnal 1739, plundrade Delhi och förde bort Påfågeltronen. År 1740 tvingade han Buchara och Chiva att underkasta sig. Hans senare år upptogs av ett kostsamt krig i Dagestan, ett nytt krig mot osmanerna och det blodiga undertryckandet av uppror mot hans tunga skatter, tills hans egna officerare dödade honom 1747 och hans rike föll sönder.
