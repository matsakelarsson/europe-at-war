Campaigns of Shivaji: Shivajis fälttåg
The wars by which Shivaji Bhonsle, son of a Maratha general in the service of Bijapur, built an independent Maratha kingdom in the hills and coast of the western Deccan. He seized the hill forts around Pune and the valley of Javli, killed the Bijapuri general Afzal Khan at Pratapgad in 1659 and escaped the siege of Panhala in 1660. Against the Mughals he raided the governor Shaista Khan’s quarters in Pune in 1663 and sacked the port of Surat in 1664, but Jai Singh’s campaign forced him to cede most of his forts at Purandar in 1665, and on a visit to Aurangzeb’s court at Agra he was put under house arrest and escaped. From 1670 he won back his forts, sacked Surat again and defeated Mughal armies in the open. On 6 June 1674 he was crowned Chhatrapati at Raigad, and in 1677–1678, allied with Golconda, he conquered Gingee and Vellore in the far south. He died in 1680, leaving a kingdom that resisted the Mughals for the next generation.: De krig genom vilka Shivaji Bhonsle, son till en marathageneral i Bijapurs tjänst, byggde upp ett självständigt marathakungarike i bergen och längs kusten i västra Deckan. Han intog bergsfästningarna kring Pune och Javlidalen, dödade bijapurgeneralen Afzal Khan vid Pratapgad 1659 och undkom ur belägringen av Panhala 1660. Mot mogulerna överföll han guvernören Shaista Khans kvarter i Pune 1663 och plundrade hamnstaden Surat 1664, men Jai Singhs fälttåg tvingade honom att avträda de flesta av sina fästningar i Purandar 1665, och vid ett besök vid Aurangzebs hov i Agra sattes han i husarrest men lyckades fly. Från 1670 vann han tillbaka sina fästningar, plundrade Surat på nytt och besegrade mogularméer i öppen strid. Den 6 juni 1674 kröntes han till chhatrapati i Raigad, och 1677–1678 erövrade han, i allians med Golconda, Gingee och Vellore längst i söder. Han dog 1680 och lämnade efter sig ett rike som stod emot mogulerna under den följande generationen.
