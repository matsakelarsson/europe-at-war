Led now by Berenguer d’Entença and Bernat de Rocafort, the Company took its revenge. On 21 June 1305 the garrison of Gallipoli sallied out and routed the besieging Byzantines, and in July the Catalans crushed Michael IX’s army near Apros. For two years, joined by Turkish bands, they ravaged Thrace from Gallipoli. When the land was exhausted they moved west, wintered on the Kassandra peninsula, plundered the monasteries of Mount Athos and in 1308 failed to take Thessalonica. Their leaders fell out; Rocafort was seized in 1309 by an agent of Charles of Valois and died in prison in Naples.: Nu lett av Berenguer d’Entença och Bernat de Rocafort tog kompaniet sin hämnd. Den 21 juni 1305 gjorde garnisonen i Gallipoli ett utfall och slog de belägrande bysantinerna på flykten, och i juli krossade katalanerna Mikael IX:s här nära Apros. I två år härjade de, med turkiska band som anslutit sig, Thrakien från Gallipoli. När landet var utarmat drog de västerut, övervintrade på halvön Kassandra, plundrade klostren på Athos och misslyckades 1308 med att inta Thessalonike. Deras ledare blev osams; Rocafort greps 1309 av en agent för Karl av Valois och dog i fängelse i Neapel.
In 1309 the Company reached Thessaly, and in 1310 Walter of Brienne, the new Duke of Athens, hired it against his Greek neighbours. When he refused to pay and tried to drive it out, the Catalans met his army near Halmyros on 15 March 1311. They had flooded the marshy ground in front of their line, and the duke’s heavy cavalry charged into the mud and was cut down. Walter and most of the knights of Frankish Greece were killed. The Company took over the duchy and placed it under the Aragonese kings of Sicily; Catalans ruled Athens and Thebes until 1388.: År 1309 nådde kompaniet Thessalien, och 1310 anlitade Walter av Brienne, den nye hertigen av Aten, det mot sina grekiska grannar. När han vägrade att betala och försökte driva bort det mötte katalanerna hans här nära Halmyros den 15 mars 1311. De hade satt den sanka marken framför sin linje under vatten, och hertigens tunga kavalleri red rakt ut i leran och höggs ned. Walter och de flesta riddarna i det frankiska Grekland dödades. Kompaniet tog över hertigdömet och ställde det under de aragoniska kungarna av Sicilien; katalaner styrde Aten och Thebe fram till 1388.
