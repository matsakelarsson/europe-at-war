Campaigns of the Catalan Company: Katalanska kompaniets fälttåg
The wars of the Grand Catalan Company, mercenaries from the War of the Sicilian Vespers hired by the Byzantine emperor Andronikos II to fight the Turks in Anatolia. After victories over the Turks in 1303–1304 the Company fell out with its employers, and when its leader Roger de Flor was murdered in 1305 it turned on the Byzantines, ravaging Thrace and Macedonia for years. In 1311 it destroyed the army of the Duke of Athens at Halmyros and took over his duchy, which it ruled until 1388.: Krigen som fördes av Stora katalanska kompaniet, legosoldater från kriget om sicilianska aftonsången som den bysantinske kejsaren Andronikos II hade anställt för att bekämpa turkarna i Anatolien. Efter segrar över turkarna 1303–1304 blev kompaniet osams med sina uppdragsgivare, och när dess ledare Roger de Flor mördades 1305 vände det sig mot bysantinerna och härjade i åratal Thrakien och Makedonien. År 1311 förintade det hertigen av Atens här vid Halmyros och tog över hans hertigdöme, som det styrde fram till 1388.
