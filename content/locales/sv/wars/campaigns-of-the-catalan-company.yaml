The peace of 1302 that ended the War of the Sicilian Vespers left thousands of Catalan and Aragonese soldiers in Sicily without pay, many of them almogavars, hardy light infantry from the frontier wars in Spain. Their leader, the former Templar Roger de Flor, offered them to Andronikos II, who badly needed soldiers against the Turks. The Company reached Constantinople in 1303, and Roger married the emperor’s niece and was made megas doux, commander of the fleet. After a bloody fight with the city’s Genoese, the Company was shipped to Cyzicus, where it surprised and routed the Turks of Karasi in October.: Freden 1302 som avslutade den sicilianska aftonsångens krig lämnade tusentals katalanska och aragoniska soldater kvar på Sicilien utan sold, många av dem almogávares, härdat lätt infanteri från gränskrigen i Spanien. Deras ledare, den före detta tempelriddaren Roger de Flor, erbjöd deras tjänster åt Andronikos II, som svårt behövde soldater mot turkarna. Kompaniet nådde Konstantinopel 1303, och Roger gifte sig med kejsarens brorsdotter och utnämndes till megas doux, befälhavare över flottan. Efter en blodig strid med stadens genuesare skeppades kompaniet till Kyzikos, där det i oktober överraskade och slog turkarna i Karasi på flykten.
In the spring of 1304 Roger marched south with his Catalans and Alan allies, beat the Turks of Germiyan and Aydın besieging Philadelphia at Aulax, and relieved the city. He went on as far as the Cilician Gates, where on 15 August he won another battle at Kibistra. But the Catalans plundered Greek towns as freely as Turkish ones and quarrelled over pay, and the emperor called them back to Europe; they wintered at Gallipoli. On 30 April 1305 Roger was murdered at a banquet in Adrianople by Alan mercenaries of the co-emperor Michael IX, with many of his escort, and Catalans in Constantinople were killed.: Våren 1304 tågade Roger söderut med sina katalaner och alanska allierade, besegrade turkarna från Germiyan och Aydın som belägrade Filadelfia vid Aulax och undsatte staden. Han fortsatte ända till de kilikiska portarna, där han den 15 augusti vann ännu ett slag vid Kibistra. Men katalanerna plundrade grekiska städer lika ohämmat som turkiska och grälade om solden, och kejsaren kallade tillbaka dem till Europa; de övervintrade i Gallipoli. Den 30 april 1305 mördades Roger vid en bankett i Adrianopel av medkejsaren Mikael IX:s alanska legosoldater, tillsammans med många i hans eskort, och katalaner i Konstantinopel dödades.
