The main account of the Company is the chronicle of Ramon Muntaner, who served in it and tells its story from the Catalan side; the Byzantine historians George Pachymeres and Nikephoros Gregoras saw the Catalans as plunderers. Their numbers for the Company differ widely, from about 1,000 men to Muntaner’s 6,500 fighting men with their families and servants.: Den främsta skildringen av kompaniet är krönikan av Ramon Muntaner, som tjänade i det och berättar dess historia från katalansk sida; de bysantinska historikerna Georgios Pachymeres och Nikeforos Gregoras såg katalanerna som plundrare. Deras siffror för kompaniet skiljer sig kraftigt åt, från omkring 1 000 man till Muntaners 6 500 stridande män med familjer och tjänare.
The battle of 15 March 1311 was long called the battle of the Cephissus and placed near Orchomenos in Boeotia; most historians now place it at Halmyros in southern Thessaly.: Slaget den 15 mars 1311 kallades länge slaget vid Kefissos och förlades till trakten av Orchomenos i Boiotien; de flesta historiker förlägger det nu till Halmyros i södra Thessalien.
The Company’s revenge after 1305 is remembered in Catalan as the venjança catalana. After 1311 the Duchy of Athens, and from 1319 Neopatras, were ruled by the Catalans under the Aragonese kings of Sicily, until Nerio Acciaioli of Corinth took Athens in 1388.: Kompaniets hämnd efter 1305 är ihågkommen på katalanska som venjança catalana. Efter 1311 styrdes hertigdömet Aten, och från 1319 Neopatras, av katalanerna under de aragoniska kungarna av Sicilien, tills Nerio Acciaioli av Korinth intog Aten 1388.
