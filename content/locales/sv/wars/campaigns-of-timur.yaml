# Svenska översättningar av katalogtexten (våg 7); stegtexterna kommer senare.
Campaigns of Timur: Timurs fälttåg
The conquests of Timur, known in Europe as Tamerlane, a Turkic emir of the Barlas tribe who made himself master of Transoxiana in 1370 and spent the next 35 years at war. From his capital, Samarkand, he took Khwarazm and Khorasan, and in a series of long campaigns between 1386 and 1404 overran Iran, Iraq, the Caucasus and eastern Anatolia, twice defeated the Golden Horde, sacked Delhi, and beat the Mamluks in Syria and the Ottomans at Ankara. His campaigns were marked by deliberate mass killings of cities that resisted or rebelled, such as Isfahan, Delhi and Baghdad, and by the deportation of craftsmen and scholars to adorn Samarkand. He built no lasting administration outside his heartland, and after his death at Otrar in 1405, on the way to attack China, his sons and grandsons fought over his empire, which soon shrank to Transoxiana and eastern Iran.: De erövringar som gjordes av Timur, i Europa känd som Tamerlan, en turkisk emir av barlasstammen som 1370 gjorde sig till herre över Transoxanien och tillbringade de följande 35 åren i krig. Från sin huvudstad Samarkand intog han Khwarazm och Khorasan, och i en rad långa fälttåg mellan 1386 och 1404 lade han under sig Iran, Irak, Kaukasus och östra Anatolien, besegrade Gyllene horden två gånger, plundrade Delhi och slog mamlukerna i Syrien och osmanerna vid Ankara. Hans fälttåg präglades av avsiktliga massdödanden i städer som gjorde motstånd eller gjorde uppror, som Isfahan, Delhi och Bagdad, och av deportationer av hantverkare och lärda för att försköna Samarkand. Han byggde inte upp någon varaktig förvaltning utanför sitt kärnland, och efter hans död i Otrar 1405, på väg för att anfalla Kina, stred hans söner och sonsöner om riket, som snart krympte till Transoxanien och östra Iran.
