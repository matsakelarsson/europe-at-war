# Svenska översättningar av katalogtexten (våg 11); stegtexterna kommer senare.
Cần Vương movement: Cần Vương-rörelsen
? A rising against the French protectorate over Annam and Tonkin in the name of the young emperor Hàm Nghi. Cần Vương means “aid the king”. On the night of 4–5 July 1885 the regent Tôn Thất Thuyết’s troops attacked the French garrison at Huế; the attack failed, the French took the citadel, and Thuyết escaped with Hàm Nghi to the mountains, where an edict in the emperor’s name called on scholars and people to rise. Across central and northern Vietnam the local scholar-gentry (văn thân) raised forces, and in the first months bands killed many thousands of Vietnamese Catholics, whom they saw as allies of the French; missionary counts put the dead at about 40,000. The French put Hàm Nghi’s brother Đồng Khánh on the throne, sent columns with Catholic militias and Vietnamese troops of the court, and burned villages that supported the rising. They broke the fortified villages of Ba Đình in January 1887, and in November 1888 Hàm Nghi was betrayed, captured and exiled to Algeria. The resistance held out longest in Hà Tĩnh and Nghệ An under Phan Đình Phùng, whose death at the end of 1895 ended the movement. Hoàng Hoa Thám, who had fought in Yên Thế since the mid-1880s, held out against the French until 1913.
: En resning mot det franska protektoratet över Annam och Tonkin i den unge kejsaren Hàm Nghis namn. Cần Vương betyder ”hjälp kungen”. Natten mellan den 4 och 5 juli 1885 anföll regenten Tôn Thất Thuyếts trupper den franska garnisonen i Huế; anfallet misslyckades, fransmännen intog citadellet, och Thuyết flydde med Hàm Nghi till bergen, där en kungörelse i kejsarens namn uppmanade de lärda och folket att resa sig. Över hela centrala och norra Vietnam rustade den lokala lärda eliten (văn thân) upp styrkor, och under de första månaderna dödade banden många tusen vietnamesiska katoliker, som de såg som fransmännens allierade; enligt missionärernas beräkningar uppgick antalet döda till omkring 40 000. Fransmännen satte Hàm Nghis bror Đồng Khánh på tronen, sände ut kolonner med katolska miliser och vietnamesiska trupper från hovet och brände byar som stödde resningen. De krossade de befästa byarna i Ba Đình i januari 1887, och i november 1888 förråddes Hàm Nghi, tillfångatogs och förvisades till Algeriet. Motståndet höll ut längst i Hà Tĩnh och Nghệ An under Phan Đình Phùng, vars död i slutet av 1895 gjorde slut på rörelsen. Hoàng Hoa Thám, som hade stridit i Yên Thế sedan mitten av 1880-talet, höll stånd mot fransmännen till 1913.
