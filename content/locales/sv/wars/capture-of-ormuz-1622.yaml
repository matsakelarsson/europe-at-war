Capture of Ormuz (1622): Erövringen av Ormuz (1622)
A joint campaign of Safavid Persia and the English East India Company that took the island fortress of Hormuz from the Portuguese, who had controlled it and the trade of the Persian Gulf since 1515. Shah Abbas I had already taken Bahrain in 1602 and the mainland port of Comoran (Gombroon) in 1614–1615. In 1622 English ships bombarded the Portuguese fort on Qeshm and then Hormuz, while Persian troops under Imam Quli Khan besieged the castle, which surrendered on 23 April. The Portuguese moved their base to Muscat, and Abbas built up Gombroon as Bandar Abbas.: Ett gemensamt fälttåg av det safavidiska Persien och engelska Ostindiska kompaniet som tog önfästningen Hormuz från portugiserna, som hade behärskat den och handeln i Persiska viken sedan 1515. Shah Abbas I hade redan intagit Bahrain 1602 och hamnen Comoran (Gombroon) på fastlandet 1614–1615. År 1622 bombarderade engelska fartyg det portugisiska fortet på Qeshm och därefter Hormuz, medan persiska trupper under Imam Quli Khan belägrade borgen, som kapitulerade den 23 april. Portugiserna flyttade sin bas till Muskat, och Abbas byggde ut Gombroon till Bandar Abbas.
