The quarrel between Italy and the papacy that followed, the Roman Question, was settled only by the Lateran Treaty of 1929, which created the Vatican City State.: Den tvist mellan Italien och påvedömet som följde, den romerska frågan, löstes först genom Lateranfördraget 1929, som skapade Vatikanstaten.
