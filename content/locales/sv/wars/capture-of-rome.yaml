Capture of Rome: Intagandet av Rom
The Italian conquest of Rome and the last of the Papal States in September 1870, after the French garrison that had protected the pope left for the Franco-Prussian War. Italian troops breached the city walls at Porta Pia on 20 September, Rome and Lazio voted to join Italy, and Rome became the capital in 1871, while Pius IX declared himself a “prisoner in the Vatican”.: Italiens erövring av Rom och det sista av Kyrkostaten i september 1870, sedan den franska garnison som hade skyddat påven lämnat staden för fransk-tyska kriget. Italienska trupper bröt igenom stadsmuren vid Porta Pia den 20 september, Rom och Lazio röstade för anslutning till Italien, och Rom blev huvudstad 1871, medan Pius IX förklarade sig vara ”fånge i Vatikanen”.
