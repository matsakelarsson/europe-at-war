Since 1849 a French garrison had protected what was left of the Papal States, Rome and Lazio, and in 1867 French and Papal troops had beaten Garibaldi’s volunteers at Mentana. When the Franco-Prussian War broke out in July 1870, Napoleon III withdrew his troops, and after his defeat and capture at Sedan on 2 September the Italian government decided to act. Pope Pius IX rejected a last offer from King Victor Emmanuel II, and on 11 September some 50,000 Italian troops under General Raffaele Cadorna crossed the border. The Papal garrisons fell back on Rome, and Civitavecchia surrendered on 16 September.: Sedan 1849 hade en fransk garnison skyddat det som var kvar av Kyrkostaten, Rom och Lazio, och 1867 hade franska och påvliga trupper besegrat Garibaldis frivilliga vid Mentana. När fransk-tyska kriget bröt ut i juli 1870 drog Napoleon III tillbaka sina trupper, och efter hans nederlag och tillfångatagande vid Sedan den 2 september beslöt den italienska regeringen att handla. Påven Pius IX avvisade ett sista erbjudande från kung Viktor Emanuel II, och den 11 september gick omkring 50 000 italienska soldater under general Raffaele Cadorna över gränsen. De påvliga garnisonerna drog sig tillbaka mot Rom, och Civitavecchia kapitulerade den 16 september.
The pope had about 13,000 troops under General Hermann Kanzler, many of them foreign volunteers, but ordered only a token defence. On the morning of 20 September Italian artillery opened a breach in the Aurelian Walls near the Porta Pia, Bersaglieri and infantry stormed through, and a white flag was raised over St Peter’s; 49 Italian and 19 Papal soldiers were killed. A plebiscite on 2 October approved union with Italy by an overwhelming majority, and Rome became the capital in 1871. Pius IX refused the Law of Guarantees offered by the Italian parliament and called himself a prisoner in the Vatican.: Påven hade omkring 13 000 soldater under general Hermann Kanzler, många av dem utländska frivilliga, men beordrade endast ett symboliskt försvar. På morgonen den 20 september sköt italienskt artilleri en bresch i den aurelianska muren nära Porta Pia, bersaglierer och infanteri stormade igenom, och en vit flagga hissades över Peterskyrkan; 49 italienska och 19 påvliga soldater stupade. En folkomröstning den 2 oktober godkände föreningen med Italien med överväldigande majoritet, och Rom blev huvudstad 1871. Pius IX avvisade den garantilag som det italienska parlamentet erbjöd och kallade sig fånge i Vatikanen.
