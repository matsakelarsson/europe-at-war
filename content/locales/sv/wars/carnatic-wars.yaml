# Svenska översättningar av katalogtexten (våg 8); stegtexterna kommer senare.
Carnatic Wars: Karnatiska krigen
"Three wars between the British and French East India Companies and their Indian allies for influence in the Carnatic, the coastal plain of south-eastern India, and the Deccan. In the first (1746–1748), an offshoot of the War of the Austrian Succession, the French took Madras and beat the Nawab of Arcot’s army at the Adyar, but gave Madras back at the peace. In the second (1749–1754) the companies backed rival claimants to the thrones of Arcot and Hyderabad: the French governor Dupleix made his candidates nawab and Nizam, but Robert Clive’s seizure and defence of Arcot in 1751 and the French surrender at Srirangam in 1752 turned the tide, and the British candidate, Muhammad Ali, kept Arcot. In the third (1757–1763), part of the Seven Years’ War, the comte de Lally took Fort St David and besieged Madras, but Eyre Coote defeated him at Wandiwash in 1760 and took Pondicherry in 1761. The French kept their trading posts but never again challenged British power in India.": "Tre krig mellan det brittiska och det franska ostindiska kompaniet och deras indiska allierade om inflytandet i Karnatik, kustslätten i sydöstra Indien, och i Deckan. I det första (1746–1748), en utlöpare av österrikiska tronföljdskriget, intog fransmännen Madras och slog nawaben av Arcots armé vid Adyar, men de lämnade tillbaka Madras vid fredsslutet. I det andra (1749–1754) stödde kompanierna rivaliserande tronpretendenter i Arcot och Hyderabad: den franske guvernören Dupleix gjorde sina kandidater till nawab och nizam, men Robert Clives erövring och försvar av Arcot 1751 och den franska kapitulationen vid Srirangam 1752 vände krigslyckan, och britternas kandidat, Muhammad Ali, behöll Arcot. I det tredje (1757–1763), en del av sjuårskriget, intog greve de Lally Fort St David och belägrade Madras, men Eyre Coote besegrade honom vid Wandiwash 1760 och intog Pondichéry 1761. Fransmännen behöll sina handelsstationer men utmanade aldrig mer den brittiska makten i Indien."
