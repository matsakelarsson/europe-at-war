Casamance conflict: Konflikten i Casamance
? The separatist conflict in Casamance, the part of Senegal south of the Gambia, between the Senegalese state and the Movement of Democratic Forces of Casamance (MFDC). Casamance, with its own Jola, Mandinka, Balanta and other peoples, its forests and rice fields and its long separation from the north by the Gambia, had grievances over land, neglect and northern officials. A march for independence in Ziguinchor on 26 December 1982, led by the priest Augustin Diamacoune Senghor, was put down, and from 1985 the MFDC’s armed wing, Atika, waged a guerrilla war from bases near the borders with Guinea-Bissau and the Gambia. The fighting was heaviest in the 1990s. Ceasefires in 1991, 1993 and 1999 and a general peace accord in 2004 did not end it, and after Diamacoune’s death in 2007 the MFDC split into factions. Salif Sadio declared a unilateral ceasefire in 2014, but the army attacked rebel bases in 2021 and 2022; the faction of César Atoute Badiate signed a peace agreement in 2022, about 250 fighters of another group laid down their arms in 2023, and the government announced a further agreement with MFDC factions in 2025. By 2026 the rebellion was much weakened and displaced people were returning, but some armed groups, above all in the forests near the Gambian border, had not laid down their arms, and no comprehensive peace agreement has been signed. Some 5,000 people are estimated to have been killed since 1982 and about 60,000 displaced.
: Den separatistiska konflikten i Casamance, den del av Senegal som ligger söder om Gambia, mellan den senegalesiska staten och Casamances demokratiska styrkors rörelse (MFDC). Casamance, med sina egna folk, jola, mandinka, balanta med flera, sina skogar och risfält och sin långa åtskillnad från norra Senegal genom Gambia, hade klagomål som gällde mark, försummelse och tjänstemän från norr. En marsch för självständighet i Ziguinchor den 26 december 1982, ledd av prästen Augustin Diamacoune Senghor, slogs ned, och från 1985 förde MFDC:s väpnade gren, Atika, ett gerillakrig från baser nära gränserna mot Guinea-Bissau och Gambia. Striderna var hårdast under 1990-talet. Vapenvilor 1991, 1993 och 1999 och ett allmänt fredsavtal 2004 gjorde inte slut på konflikten, och efter Diamacounes död 2007 splittrades MFDC i fraktioner. Salif Sadio utlyste en ensidig vapenvila 2014, men armén anföll rebellbaser 2021 och 2022; César Atoute Badiates fraktion undertecknade ett fredsavtal 2022, omkring 250 krigare ur en annan grupp lade ned vapnen 2023, och regeringen tillkännagav ytterligare ett avtal med MFDC-fraktioner 2025. År 2026 var upproret kraftigt försvagat och fördrivna människor återvände, men vissa väpnade grupper, framför allt i skogarna nära gränsen mot Gambia, hade inte lagt ned vapnen, och något heltäckande fredsavtal har inte undertecknats. Omkring 5 000 människor beräknas ha dödats sedan 1982 och omkring 60 000 ha fördrivits.
