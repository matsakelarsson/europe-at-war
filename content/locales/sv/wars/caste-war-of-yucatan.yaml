# Svenska översättningar av katalogtexten (våg 14); stegtexterna kommer senare.
Caste War of Yucatán: Kastkriget i Yucatán
? The rising of the Maya of eastern and southern Yucatán against the Hispanic Yucatecan state, and the half-century war that followed. In the 1840s Yucatán, which had broken away from Mexico, was split between rival factions that armed Maya villagers for their own quarrels, while sugar estates spread into Maya lands and church fees and head taxes weighed on the villages. In July 1847 the Yucatecan authorities executed a Maya leader, Manuel Antonio Ay, for plotting a revolt, and on 30 July Cecilio Chi attacked Tepich. With Jacinto Pat, Chi’s armies took most of the peninsula by May 1848 and came close to Mérida and Campeche, until they dispersed and the Yucatecans, after rejoining Mexico in return for money and troops, drove them back. From 1850 the rebels of the south-east, inspired by a Speaking Cross, built an independent state centred on Chan Santa Cruz, armed through trade with British Honduras. Only after Britain agreed in 1893 to stop that trade did Mexican troops under Ignacio Bravo occupy Chan Santa Cruz, in May 1901; resistance in the villages went on into the 1930s. Yucatán’s population fell by 30 to 50 percent between 1846 and the 1860s through battle, massacre, hunger, disease and flight.
: Mayafolkets resning i östra och södra Yucatán mot de spanskättade yucatekernas stat och det halvsekellånga krig som följde. På 1840-talet var Yucatán, som hade brutit sig loss från Mexiko, splittrat mellan rivaliserande fraktioner som beväpnade bybor ur mayafolket för sina egna strider, samtidigt som sockerplantagerna bredde ut sig på mayafolkets mark och kyrkoavgifter och huvudskatter tyngde byarna. I juli 1847 avrättade de yucatekiska myndigheterna en mayaledare, Manuel Antonio Ay, för att ha planerat ett uppror, och den 30 juli anföll Cecilio Chi Tepich. Tillsammans med Jacinto Pat erövrade Chis arméer större delen av halvön fram till maj 1848 och kom nära Mérida och Campeche, tills de skingrades och yucatekerna, som i utbyte mot pengar och trupper hade återförenats med Mexiko, drev dem tillbaka. Från 1850 byggde rebellerna i sydost, inspirerade av ett talande kors, upp en självständig stat med centrum i Chan Santa Cruz, som fick vapen genom handel med Brittiska Honduras. Först sedan Storbritannien 1893 hade gått med på att stoppa den handeln besatte mexikanska trupper under Ignacio Bravo Chan Santa Cruz, i maj 1901; motståndet i byarna fortsatte in på 1930-talet. Yucatáns befolkning minskade med 30 till 50 procent mellan 1846 och 1860-talet genom strider, massakrer, hunger, sjukdomar och flykt.
