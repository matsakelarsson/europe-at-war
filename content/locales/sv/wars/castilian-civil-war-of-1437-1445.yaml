Castilian Civil War of 1437–1445: Kastilianska inbördeskriget 1437–1445
A struggle for power in Castile between John II’s all-powerful favourite, the constable Álvaro de Luna, and a league of great nobles led by the Infantes of Aragon, John, king consort of Navarre, and Henry, Master of the Order of Santiago, sons of Ferdinand of Antequera. It began with the arrest of the noble Pedro Manrique in 1437. The league twice forced Luna into exile from the court, won control of the king after taking Medina del Campo in 1441, and in 1443 seized John II at Rágama. Luna, the king and the heir, Prince Henry, fought back, and on 19 May 1445, at the battle of Olmedo, the royal army beat the Infantes and their allies. The Infante Henry died of his wounds, and John of Navarre withdrew. The victory restored the crown’s authority for a time, though Luna himself was overthrown and executed in 1453.: En maktkamp i Kastilien mellan Johan II:s allsmäktige gunstling, connetabeln Álvaro de Luna, och ett förbund av stormän lett av infanterna av Aragonien, Johan, gemål till drottningen av Navarra, och Henrik, stormästare i Santiagoorden, söner till Ferdinand av Antequera. Den började med att adelsmannen Pedro Manrique arresterades 1437. Förbundet tvingade två gånger Luna i exil från hovet, fick kontroll över kungen sedan det intagit Medina del Campo 1441 och grep 1443 Johan II i Rágama. Luna, kungen och tronarvingen prins Henrik slog tillbaka, och den 19 maj 1445, i slaget vid Olmedo, besegrade den kungliga hären infanterna och deras allierade. Infanten Henrik dog av sina sår, och Johan av Navarra drog sig tillbaka. Segern återställde kronans auktoritet för en tid, även om Luna själv störtades och avrättades 1453.
