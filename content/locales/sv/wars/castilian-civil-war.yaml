Peter promised the Black Prince Biscay and the pay of his army, and Charles II of Navarre lands on the Navarrese border, in return for their help.: Peter lovade den svarte prinsen Biscaya och solden åt hans här, och Karl II av Navarra land vid den navarresiska gränsen, i utbyte mot deras hjälp.
3 April 1367: 3 april 1367
The English longbowmen broke Henry’s light cavalry and then his men-at-arms. Many Castilians drowned in the river Najerilla as they fled.: De engelska långbågeskyttarna bröt Henriks lätta kavalleri och därefter hans tungt rustade krigare. Många kastilianer drunknade i floden Najerilla under flykten.
Henry and Du Guesclin: Henrik och Du Guesclin
Black Prince: Svarte prinsen
Peter could not pay what he had promised, and the Black Prince, sick and in debt, went back to Aquitaine in the summer of 1367; he never recovered his health. Henry returned that autumn, and much of the north accepted him. In 1368 he made an alliance with Charles V of France, took León and laid siege to Toledo, which held out for Peter. Peter’s ally, Muhammad V of Granada, raided Henry’s towns in Andalusia and sacked Jaén.: Peter kunde inte betala vad han hade lovat, och den svarte prinsen, sjuk och skuldsatt, återvände till Aquitanien sommaren 1367; han återfick aldrig sin hälsa. Henrik återvände samma höst, och stora delar av norr erkände honom. År 1368 slöt han förbund med Karl V av Frankrike, intog León och belägrade Toledo, som höll stånd för Peter. Peters bundsförvant, Muhammad V av Granada, härjade Henriks städer i Andalusien och plundrade Jaén.
In March 1369 Peter marched to relieve Toledo with an army that included Granadan horsemen. Henry and Du Guesclin, now ransomed, surprised it at Montiel, in La Mancha, on 14 March and scattered it, and Peter took refuge in the castle. On the night of 23 March, lured out by an offer of escape, he was brought to Du Guesclin’s tent, where he fought with Henry and was stabbed to death. Henry II founded the Trastámara dynasty, and Castile became France’s ally. John of Gaunt, who married Peter’s daughter Constance, claimed the Castilian crown for years.: I mars 1369 tågade Peter för att undsätta Toledo med en här som omfattade granadiska ryttare. Henrik och Du Guesclin, som nu hade friköpts, överraskade den vid Montiel i La Mancha den 14 mars och skingrade den, och Peter tog sin tillflykt till borgen. Natten till den 23 mars lockades han ut genom ett erbjudande om flykt och fördes till Du Guesclins tält, där han slogs med Henrik och knivhöggs till döds. Henrik II grundade huset Trastámara, och Kastilien blev Frankrikes bundsförvant. Johan av Gent, som gifte sig med Peters dotter Konstantia, gjorde i åratal anspråk på den kastilianska kronan.
