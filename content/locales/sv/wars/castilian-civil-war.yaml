Castilian Civil War: Kastilianska inbördeskriget
The war between Peter I of Castile and his illegitimate half-brother Henry of Trastámara, which became a side theatre of the Hundred Years’ War. Henry, backed by France, Aragon and the Free Companies under Bertrand du Guesclin, drove Peter out in 1366; the Black Prince restored him by his victory at Nájera in 1367, but Henry returned, beat Peter at Montiel in 1369 and killed him, founding the Trastámara dynasty and making Castile an ally of France.: Kriget mellan Peter I av Kastilien och hans utomäktenskaplige halvbror Henrik av Trastámara, som blev en bikrigsskådeplats i hundraåriga kriget. Henrik, som stöddes av Frankrike, Aragonien och de fria kompanierna under Bertrand du Guesclin, drev ut Peter 1366; Svarte prinsen återinsatte honom genom sin seger vid Nájera 1367, men Henrik återvände, besegrade Peter vid Montiel 1369 och dödade honom, grundade huset Trastámara och gjorde Kastilien till Frankrikes bundsförvant.
