Success for Henry: Henriks framgångar
Peter I became king of Castile at fifteen in 1350. His father, Alfonso XI, had had ten children with his mistress Leonor de Guzmán, and in 1351 Peter’s mother had Leonor put to death; her son Henry, count of Trastámara, became his half-brother’s mortal enemy. Peter’s reign saw noble revolts and many executions, among them that of another half-brother, Fadrique, in 1358, and his abandoned French wife, Blanche of Bourbon, died in his custody in 1361, it was said on his orders. Henry fled abroad and fought for Aragon in the War of the Two Peters.: Peter I blev kung av Kastilien vid femton års ålder 1350. Hans far, Alfonso XI, hade fått tio barn med sin älskarinna Leonor de Guzmán, och 1351 lät Peters mor avrätta Leonor; hennes son Henrik, greve av Trastámara, blev sin halvbrors dödsfiende. Peters regering präglades av adelsuppror och många avrättningar, bland dem av en annan halvbror, Fadrique, 1358, och hans försmådda franska hustru, Blanche av Bourbon, dog i hans förvar 1361, enligt ryktet på hans order. Henrik flydde utomlands och stred för Aragonien i de två Petrarnas krig.
In 1366, with French money and Aragonese support, Henry led the Free Companies, bands of soldiers left unemployed by the Hundred Years’ War, into Castile under Bertrand du Guesclin. Peter fled without a fight, and Henry was crowned at Burgos. Peter turned to Edward, the Black Prince, who ruled Aquitaine for England, and by the Treaty of Libourne promised him land and pay for his army. The prince crossed the Pyrenees at Roncesvalles in February 1367, and on 3 April, at Nájera, his English archers and men-at-arms routed Henry’s Castilian and French army. Du Guesclin was captured and Henry fled to France.: År 1366 ledde Henrik, med franska pengar och aragoniskt stöd, de fria kompanierna, band av soldater som blivit arbetslösa genom hundraårskriget, in i Kastilien under Bertrand du Guesclin. Peter flydde utan strid, och Henrik kröntes i Burgos. Peter vände sig till Edvard, den svarte prinsen, som styrde Aquitanien för Englands räkning, och lovade honom genom fördraget i Libourne land och sold åt hans här. Prinsen gick över Pyrenéerna vid Roncesvalles i februari 1367, och den 3 april vid Nájera slog hans engelska bågskyttar och tungt rustade krigare Henriks kastilianska och franska här på flykten. Du Guesclin tillfångatogs och Henrik flydde till Frankrike.
