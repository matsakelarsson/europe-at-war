Toledo: Toledo
The city held out for Peter through a long siege and famine, and surrendered only after his death.: Staden höll stånd för Peter genom en lång belägring och hungersnöd och kapitulerade först efter hans död.
Jaén: Jaén
Muhammad V of Granada, Peter’s ally, sacked the town and carried off many of its people as captives.: Muhammad V av Granada, Peters bundsförvant, plundrade staden och förde bort många av dess invånare som fångar.
14 March 1369: 14 mars 1369
Henry’s army caught Peter’s on the march and routed it. Peter shut himself in the castle, where he was besieged until his death nine days later.: Henriks här överraskade Peters på marsch och slog den på flykten. Peter stängde in sig i borgen, där han belägrades fram till sin död nio dagar senare.
