Peter’s enemies called him the Cruel and his supporters the Just. The main chronicle of his reign was written by Pero López de Ayala, who changed sides to Henry in 1366; Froissart tells the story from the English and French side.: Peters fiender kallade honom den grymme och hans anhängare den rättvise. Den främsta krönikan över hans regering skrevs av Pero López de Ayala, som bytte sida till Henrik 1366; Froissart berättar historien från engelsk och fransk sida.
Historians date the war differently. Some count it from the first noble revolts against Peter in the early 1350s, others only from Henry’s invasion of 1366. It overlapped with the War of the Two Peters (1356–1369) between Castile and Aragon, which has its own entry; Nájera and the Castilian alliance with France also appear in the Hundred Years’ War.: Historikerna daterar kriget olika. Vissa räknar det från de första adelsupproren mot Peter i början av 1350-talet, andra först från Henriks invasion 1366. Det överlappade med de två Petrarnas krig (1356–1369) mellan Kastilien och Aragonien, som har en egen artikel; Nájera och det kastilianska förbundet med Frankrike förekommer också i Hundraårskriget.
Dates are Julian. Nájera is sometimes called the battle of Navarrete.: Datum är julianska. Nájera kallas ibland slaget vid Navarrete.
