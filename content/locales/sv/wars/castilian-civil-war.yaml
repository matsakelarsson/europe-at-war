Henry was crowned in the royal monastery of Las Huelgas. Peter had abandoned the city and fled south to Seville, then to Portugal and Galicia.: Henrik kröntes i det kungliga klostret Las Huelgas. Peter hade övergett staden och flytt söderut till Sevilla, sedan till Portugal och Galicien.
