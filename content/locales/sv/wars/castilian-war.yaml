# Svenska översättningar av katalogtexten (våg 11); stegtexterna kommer senare.
Castilian War: Kastilianska kriget
? The Spanish attack on the sultanate of Brunei in 1578, which the Malays call the Perang Kastila, “the war of the Castilians”. Brunei, the leading Muslim power of northern Borneo, had family and trading ties with Manila and the Sulu archipelago, and the Spaniards, who had taken Manila in 1571, saw its merchants and preachers as rivals to their own rule and missions in the islands. When Sultan Saiful Rijal rejected Governor Francisco de Sande’s demands to stop Muslim preaching and to admit Christian missionaries, Sande sailed from Manila in March 1578 with about 40 ships and more than 2,000 men, most of them Filipino auxiliaries, taking with him two Bruneian nobles, Pengiran Seri Lela and Pengiran Seri Ratna, who hoped for Spanish help against the sultan. On 14 April the fleet destroyed Brunei’s ships in the harbour, and by 16 April the Spaniards held the capital, Kota Batu; they burned its great mosque, and the sultan withdrew to Jerudong. Disease and Bruneian counter-attacks forced the Spaniards out after 72 days, and on 26 June they sailed back to Manila; the sultan returned and rebuilt his capital. A Spanish force sent on to Sulu obtained the submission of Jolo, the start of three centuries of wars between Spain and the Muslim states of the southern Philippines. Brunei kept its independence but never regained its influence in Luzon.
: Det spanska anfallet på sultanatet Brunei 1578, som malajerna kallar Perang Kastila, ”kastilianernas krig”. Brunei, den ledande muslimska makten på norra Borneo, hade släkt- och handelsband med Manila och Suluarkipelagen, och spanjorerna, som hade tagit Manila 1571, såg dess köpmän och predikanter som rivaler till sitt eget styre och sina egna missioner på öarna. När sultan Saiful Rijal avvisade guvernör Francisco de Sandes krav på att stoppa den muslimska predikan och släppa in kristna missionärer seglade Sande från Manila i mars 1578 med omkring 40 fartyg och mer än 2 000 man, de flesta filippinska hjälptrupper, och tog med sig två bruneiska stormän, Pengiran Seri Lela och Pengiran Seri Ratna, som hoppades på spansk hjälp mot sultanen. Den 14 april förintade flottan Bruneis fartyg i hamnen, och den 16 april hade spanjorerna besatt huvudstaden, Kota Batu; de brände dess stora moské, och sultanen drog sig tillbaka till Jerudong. Sjukdomar och bruneiska motanfall tvingade bort spanjorerna efter 72 dagar, och den 26 juni seglade de tillbaka till Manila; sultanen återvände och byggde upp sin huvudstad igen. En spansk styrka som sändes vidare till Sulu fick Jolo att underkasta sig, början på tre sekel av krig mellan Spanien och de muslimska staterna i södra Filippinerna. Brunei behöll sin självständighet men återvann aldrig sitt inflytande på Luzon.
