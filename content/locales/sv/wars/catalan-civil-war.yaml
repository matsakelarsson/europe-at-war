Catalan Civil War: Katalanska inbördeskriget
A civil war in the Principality of Catalonia between John II of Aragon and the Catalan institutions, the Generalitat and its Council of the Principality. Anger at John’s treatment of his son Charles of Viana, who died in Barcelona in 1461, combined with the revolt of the remença peasants against their lords and the conflicts within Barcelona. In 1462 John pledged Roussillon and Cerdanya to Louis XI of France for an army that rescued his queen and their son Ferdinand from the old fort of Girona, and France kept those counties until 1493. The Catalans declared John deposed and offered their crown in turn to Henry IV of Castile, to Peter, constable of Portugal, who lost at Calaf in 1465 and died in 1466, and to René of Anjou, whose son John of Lorraine fought on until his death in 1470. Barcelona, besieged by land and sea through 1472, surrendered by the Capitulation of Pedralbes on 16 October 1472; John granted a general pardon and swore to respect Catalonia’s laws.: Ett inbördeskrig i furstendömet Katalonien mellan Johan II av Aragonien och de katalanska institutionerna, Generalitat och dess furstendömesråd. Vreden över Johans behandling av sonen Karl av Viana, som dog i Barcelona 1461, förenades med remençaböndernas revolt mot sina herrar och konflikterna inom Barcelona. År 1462 pantsatte Johan Roussillon och Cerdanya till Ludvig XI av Frankrike i utbyte mot en här som undsatte hans drottning och deras son Ferdinand i den gamla borgen i Girona, och Frankrike behöll dessa grevskap till 1493. Katalanerna förklarade Johan avsatt och erbjöd i tur och ordning sin krona åt Henrik IV av Kastilien, åt Peter, connetabel av Portugal, som besegrades vid Calaf 1465 och dog 1466, och åt René av Anjou, vars son Johan av Lothringen stred vidare till sin död 1470. Barcelona, som belägrades till lands och sjöss under hela 1472, kapitulerade genom kapitulationen i Pedralbes den 16 oktober 1472; Johan beviljade en allmän amnesti och svor att respektera Kataloniens lagar.
