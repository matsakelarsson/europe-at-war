With the east subdued, the Russian army turned on the Circassians, Ubykhs and Abaza of the western Caucasus, who had fought it for decades and had never been ruled by the Ottomans, although the sultan had claimed their coast. In 1861 their leaders formed an assembly at Sochi and appealed to Britain and the Ottoman Empire, without result. Alexander II approved a plan to drive the highland peoples out of the mountains and the coast and settle Cossacks there. From 1862 Russian columns under Yevdokimov moved through the valleys, burning villages and crops, and told the people to move to the Kuban plain or leave for the Ottoman Empire.: Sedan östra Kaukasus underkuvats vände sig den ryska armén mot tjerkesserna, ubycherna och abazinerna i västra Kaukasus, som hade bekämpat den i årtionden och aldrig styrts av osmanerna, även om sultanen hade gjort anspråk på deras kust. År 1861 bildade deras ledare en församling i Sotji och vädjade till Storbritannien och Osmanska riket, utan resultat. Alexander II godkände en plan att driva bergsfolken ut ur bergen och från kusten och bosätta kosacker där. Från 1862 drog ryska kolonner under Jevdokimov genom dalarna, brände byar och skördar och sade åt folket att flytta till Kubanslätten eller bege sig till Osmanska riket.
On 2 June 1864 a parade at Kbaade, today’s Krasnaya Polyana, marked the end of the war. By then hundreds of thousands of people were crowded on the coast, waiting for ships. Thousands died there of hunger, cold and disease, on overloaded boats and after landing at Trabzon, Samsun and other ports. Estimates vary widely, but several hundred thousand to more than a million people were killed or driven out, and only a small part of the Circassian people remained. Many sources call this a genocide. Georgia recognised it as one in 2011; Russia rejects the term.: Den 2 juni 1864 markerade en parad i Kbaade, dagens Krasnaja Poljana, krigets slut. Då trängdes hundratusentals människor vid kusten i väntan på fartyg. Tusentals dog där av svält, kyla och sjukdomar, på överlastade båtar och efter landstigningen i Trabzon, Samsun och andra hamnar. Uppskattningarna varierar kraftigt, men mellan flera hundra tusen och mer än en miljon människor dödades eller fördrevs, och endast en liten del av det tjerkessiska folket blev kvar. Många källor kallar detta ett folkmord. Georgien erkände det som ett sådant 2011; Ryssland avvisar begreppet.
