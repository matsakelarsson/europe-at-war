During the Crimean War Shamil hoped for help from the Ottomans and the British, which never came in strength. In July 1854 his son Ghazi Muhammad raided the Georgian estate of Tsinandali and carried off two princesses and their children, who were later exchanged for Shamil’s eldest son, held by the Russians since Akhulgo. After the war Prince Aleksandr Baryatinsky, the new viceroy, brought some 200,000 troops to bear. Roads and clearings closed in on Chechnya, and in 1858 the Russians took the Argun gorge and cut it in two.: Under Krimkriget hoppades Sjamil på hjälp från osmanerna och britterna, men den kom aldrig i någon större omfattning. I juli 1854 överföll hans son Ghazi Muhammad det georgiska godset Tsinandali och förde bort två prinsessor och deras barn, som senare byttes mot Sjamils äldste son, som ryssarna hållit fången sedan Achulgo. Efter kriget satte furst Aleksandr Barjatinskij, den nye vicekungen, in omkring 200 000 soldater. Vägar och skogsgator ringade in Tjetjenien, och 1858 intog ryssarna Argunravinen och klöv landet i två delar.
Many villages, worn out by war, hunger and Shamil’s harsh rule, now made their peace with the Russians. Vedeno fell in April 1859 and the imamate collapsed. Shamil retreated with some 400 followers to the mountain village of Gunib in Dagestan, where Russian troops surrounded and stormed it. On 6 September 1859 he surrendered to Baryatinsky. He was taken to Saint Petersburg, lived in honourable exile in Kaluga, and died on pilgrimage in Medina in 1871. Resistance went on in places, but the war in the eastern Caucasus was over.: Många byar, utmattade av krig, hunger och Sjamils hårda styre, slöt nu fred med ryssarna. Vedeno föll i april 1859 och imamatet bröt samman. Sjamil drog sig tillbaka med omkring 400 anhängare till bergsbyn Gunib i Dagestan, där ryska trupper omringade och stormade den. Den 6 september 1859 kapitulerade han inför Barjatinskij. Han fördes till Sankt Petersburg, levde i hedersam landsflykt i Kaluga och dog under en pilgrimsfärd i Medina 1871. Motståndet fortsatte på sina håll, men kriget i östra Kaukasus var över.
