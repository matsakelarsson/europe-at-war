In the highlands of Dagestan, Naqshbandi Sufi teachers preached that Muslims should live by Islamic law, not local custom, and resist Russian rule. In 1829 the scholar Ghazi Muhammad of Gimry was proclaimed imam, and from 1830 he waged holy war. In 1831 he besieged Russian forts and sacked Kizlyar, carrying off some 200 captives. On 29 October 1832 Russian troops stormed Gimry and he was killed. His successor, Hamzat Bek, murdered the ruling family of the Avar khanate at Khunzakh in 1834 and was himself killed in revenge that year.: I Dagestans högland predikade naqshbandiyya-sufiska lärare att muslimerna skulle leva efter islamisk lag, inte efter lokal sedvänja, och göra motstånd mot det ryska styret. År 1829 utropades den lärde Ghazi Muhammad från Gimry till imam, och från 1830 förde han heligt krig. År 1831 belägrade han ryska fästningar och plundrade Kizljar och förde bort omkring 200 fångar. Den 29 oktober 1832 stormade ryska trupper Gimry och han dödades. Hans efterträdare, Hamzat Bek, mördade den härskande familjen i det avariska khanatet i Chunzach 1834 och dödades själv som hämnd samma år.
The next imam was Shamil, an Avar who had escaped from Gimry badly wounded. He built a state with its own law, taxes and standing army, ruling through deputies called naibs. In the summer of 1839 General Pavel Grabbe besieged him in the rock fortress of Akhulgo for 80 days. When it fell, most of the defenders were killed, along with many of the women and children sheltering there, but Shamil escaped with a few followers. In 1840 the Chechens, fearing that the Russians would disarm them, rose and accepted him as imam.: Nästa imam var Sjamil, en avar som hade flytt från Gimry svårt sårad. Han byggde upp en stat med egen lag, egna skatter och en stående armé och styrde genom ställföreträdare kallade naiber. Sommaren 1839 belägrade general Pavel Grabbe honom i klippfästningen Achulgo i 80 dagar. När den föll dödades de flesta av försvararna, tillsammans med många av de kvinnor och barn som sökt skydd där, men Sjamil kom undan med några få anhängare. År 1840 reste sig tjetjenerna, som fruktade att ryssarna skulle avväpna dem, och erkände honom som imam.
