By 1815 Russia ruled Georgia and the khanates south of the mountains, but the peoples of the North Caucasus had never accepted its rule, and the one road over the mountains to Tiflis ran past their lands. Cossack settlements along the Terek and the Kuban suffered raids, and the Russians answered with punitive expeditions. In 1816 General Aleksey Yermolov, a hero of Borodino, took command in the Caucasus, convinced that only fear would bring peace. In 1817 he began to push the line of forts forward from the Terek to the Sunzha, and in 1818 he founded the fortress of Groznaya, “the Menacing”, today’s Grozny.: År 1815 behärskade Ryssland Georgien och khanaten söder om bergen, men Nordkaukasiens folk hade aldrig godtagit dess styre, och den enda vägen över bergen till Tiflis gick förbi deras land. Kosackbosättningarna längs Terek och Kuban drabbades av räder, och ryssarna svarade med straffexpeditioner. År 1816 tog general Aleksej Jermolov, en hjälte från Borodino, befälet i Kaukasus, övertygad om att endast fruktan skulle skapa fred. År 1817 började han flytta fram fästningslinjen från Terek till Sunzja, och 1818 grundade han fästningen Groznaja, ”den hotfulla”, dagens Groznyj.
Forts at Vnezapnaya and Burnaya followed in Dagestan, and a line of posts across Kabarda in the early 1820s. Yermolov’s troops burned villages that resisted, destroyed crops, took hostages and cut wide clearings through the Chechen forests, while families were driven from the lowlands into the mountains. In 1819 his soldiers stormed the Chechen village of Dadi-Yurt house by house and killed most of its people. A rising in Chechnya in 1825 was put down, and in 1827 Yermolov was dismissed, distrusted after the Decembrist revolt and blamed for setbacks against Persia.: Därefter följde fästningar vid Vnezapnaja och Burnaja i Dagestan, och en linje av poster tvärs över Kabarda i början av 1820-talet. Jermolovs trupper brände byar som gjorde motstånd, förstörde skördar, tog gisslan och högg breda gator genom de tjetjenska skogarna, medan familjer drevs från låglandet upp i bergen. År 1819 stormade hans soldater den tjetjenska byn Dadi-Jurt hus för hus och dödade de flesta av dess invånare. Ett uppror i Tjetjenien 1825 slogs ned, och 1827 avskedades Jermolov, misstrodd efter dekabristupproret och anklagad för motgångar mot Persien.
