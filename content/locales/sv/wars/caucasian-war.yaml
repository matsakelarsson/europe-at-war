Dates are New Style (Gregorian). Russian accounts use the Julian calendar, then 12 days behind, so Shamil’s surrender at Gunib is 25 August 1859 and the ceremony at Kbaade that marked the end of the war 21 May 1864 in Russian sources. Circassians mark 21 May as their day of mourning.: Datum anges enligt n.s. (den gregorianska kalendern). Ryska källor använder den julianska kalendern, som då låg 12 dagar efter, så Sjamils kapitulation vid Gunib infaller den 25 augusti 1859 och ceremonin i Kbaade som markerade krigets slut den 21 maj 1864 i ryska källor. Tjerkesserna högtidlighåller den 21 maj som sin sorgedag.
Russian sources of the time called all the peoples of the North Caucasus “mountaineers”. They were many peoples, among them Chechens, Ingush, Avars, Dargins, Lezgins and Kumyks in the east, and in the west Kabardians, Circassians (Adyghe), Abaza, Ubykhs and Karachays.: Dåtidens ryska källor kallade alla Nordkaukasiens folk för ”bergsbor”. De var många folk, bland dem tjetjener, ingusjer, avarer, darginer, lezginer och kumyker i öster, och i väster kabardiner, tjerkesser (adygeer), abaziner, ubycher och karatjajer.
Numbers of dead and expelled are estimates, and they differ very widely between sources, above all for the expulsion of the Circassians in the 1860s.: Antalet döda och fördrivna bygger på uppskattningar, och de skiljer sig mycket kraftigt åt mellan källorna, framför allt när det gäller fördrivningen av tjerkesserna på 1860-talet.
The base map does not show the shifting zones of Russian control in the mountains, which steps show with lines and areas drawn from general accounts.: Grundkartan visar inte de skiftande zonerna av rysk kontroll i bergen, vilka stegen visar med linjer och områden som bygger på översiktliga framställningar.
