Caucasian War: Kaukasiska kriget
The Russian Empire’s half-century war to conquer the peoples of the North Caucasus, from Yermolov’s fortified lines of 1817 to the surrender of Imam Shamil at Gunib in 1859 and the subjugation of Circassia in 1864. It ended with the killing and mass expulsion of the Circassians and other peoples of the western Caucasus to the Ottoman Empire, which many sources call a genocide.: Ryska rikets halvsekellånga krig för att erövra folken i Nordkaukasien, från Jermolovs befästa linjer 1817 till imam Sjamils kapitulation vid Gunib 1859 och underkuvandet av Tjerkessien 1864. Det slutade med att tjerkesserna och andra folk i västra Kaukasus dödades och massfördrevs till Osmanska riket, vilket många källor kallar ett folkmord.
