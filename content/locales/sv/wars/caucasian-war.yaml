In 1843 Shamil struck in Dagestan. Moving his forces faster than the Russians could follow, he took almost every Russian post in Avaria within weeks and besieged the garrisons that were left. The campaign cost the Russians some 2,600 men and a dozen forts. Nicholas I sent large reinforcements and appointed Count Mikhail Vorontsov viceroy, with orders to destroy the imamate. In June 1845 Vorontsov marched south into the mountains with about 18,000 men, waited for weeks at Andi for supplies, and on 18 July took Shamil’s capital, Dargo, which the imam had set on fire.: År 1843 slog Sjamil till i Dagestan. Han förflyttade sina styrkor snabbare än ryssarna kunde följa och intog inom några veckor nästan varje rysk post i Avarien och belägrade de garnisoner som fanns kvar. Fälttåget kostade ryssarna omkring 2 600 man och ett dussin fästningar. Nikolaj I sände stora förstärkningar och utnämnde greve Michail Vorontsov till vicekung med order att förinta imamatet. I juni 1845 tågade Vorontsov söderut in i bergen med omkring 18 000 man, väntade i veckor i Andi på förnödenheter och intog den 18 juli Sjamils huvudstad Dargo, som imamen hade satt eld på.
In the forests around Dargo the Chechens felled trees across the paths and attacked the strung-out columns from cover. A column sent to fetch a supply convoy lost hundreds of men and General Passek. Starving and burdened with wounded, Vorontsov’s army fought its way north for a week until relief troops met it. The campaign cost about 3,600 killed and wounded, among them three generals. Afterwards the Russians turned to slower methods, building forts and roads and clearing the forests, while Shamil moved his capital to Vedeno and beat off a Russian assault on Gergebil in 1847.: I skogarna kring Dargo fällde tjetjenerna träd över stigarna och anföll de utdragna kolonnerna ur skydd. En kolonn som sänts för att hämta en förrådskonvoj förlorade hundratals man och general Passek. Utsvulten och tyngd av sårade kämpade sig Vorontsovs här norrut i en vecka tills undsättningstrupper mötte den. Fälttåget kostade omkring 3 600 döda och sårade, bland dem tre generaler. Därefter övergick ryssarna till långsammare metoder, byggde fästningar och vägar och röjde skogarna, medan Sjamil flyttade sin huvudstad till Vedeno och slog tillbaka ett ryskt anfall mot Gergebil 1847.
