# Svenska översättningar av katalogtexten (våg 14); stegtexterna kommer senare.
Cayuse War: Cayusekriget
? A war in the Oregon Country between the Cayuse and the American settlers of the Willamette Valley, which began with the killing of the missionaries Marcus and Narcissa Whitman. Wagon trains on the Oregon Trail brought measles to the Columbia Plateau in 1847, and the epidemic killed about half of the Cayuse, while most white children treated at the Whitman mission at Waiilatpu, near today’s Walla Walla, recovered. On 29 November 1847 a group of Cayuse men led by Tiloukaikt and Tomahas, believing that Whitman was poisoning their people, killed him, his wife and eleven others at the mission and held some fifty people captive, most of them women and children, until Peter Skene Ogden of the Hudson’s Bay Company ransomed them a month later. The Provisional Government of Oregon raised about 500 volunteers, the Oregon Rifles, under Cornelius Gilliam, who fought the Cayuse and some of their allies at Sand Hollow on 24 February 1848 and burned villages, but could not bring the war to an end; Gilliam was killed in an accident in March. The war led Congress to organise Oregon Territory in August 1848. In 1850 the Cayuse handed over five men, Tiloukaikt, Tomahas, Klokamas, Isaiachalakis and Kimasumpkin, who were tried and hanged at Oregon City on 3 June 1850; whether all of them had taken part in the killings is doubted. Raids and patrols went on until the Walla Walla Council of 1855, where the Cayuse ceded most of their land and were placed with the Umatilla and Walla Walla on the Umatilla Reservation, and some of them fought again in the Yakima War.
: Ett krig i Oregonlandet mellan cayuse och de amerikanska nybyggarna i Willamettedalen, som inleddes med att missionärerna Marcus och Narcissa Whitman dödades. Vagnståg på Oregonleden förde mässling till Columbiaplatån 1847, och epidemin dödade omkring hälften av cayusefolket, medan de flesta vita barn som behandlades vid Whitmans mission i Waiilatpu, nära dagens Walla Walla, tillfrisknade. Den 29 november 1847 dödade en grupp cayusemän under ledning av Tiloukaikt och Tomahas, som trodde att Whitman förgiftade deras folk, honom, hans hustru och elva andra vid missionen och höll omkring femtio personer fångna, de flesta kvinnor och barn, tills Peter Skene Ogden från Hudson’s Bay Company friköpte dem en månad senare. Oregons provisoriska regering mönstrade omkring 500 frivilliga, Oregon Rifles, under Cornelius Gilliam, som stred mot cayuse och några av deras allierade vid Sand Hollow den 24 februari 1848 och brände byar men inte kunde få slut på kriget; Gilliam omkom i en olycka i mars. Kriget fick kongressen att organisera Oregonterritoriet i augusti 1848. År 1850 överlämnade cayuse fem män, Tiloukaikt, Tomahas, Klokamas, Isaiachalakis och Kimasumpkin, som ställdes inför rätta och hängdes i Oregon City den 3 juni 1850; det har ifrågasatts om alla hade deltagit i dödandet. Räder och patruller fortsatte fram till rådsmötet i Walla Walla 1855, där cayuse avträdde större delen av sitt land och placerades tillsammans med umatilla och walla walla på Umatillareservatet, och en del av dem stred på nytt i Yakimakriget.
