# Svenska översättningar av katalogtexten (våg 13); stegtexterna kommer senare.
Central African Republic Bush War: Buskriget i Centralafrikanska republiken
? A rebellion against François Bozizé, who had seized power in the Central African Republic in March 2003 and was elected president in 2005. In the remote north-east, rebels later united in the Union of Democratic Forces for Unity (UFDR), led by Michel Djotodia, raided Birao in November 2004 and in late 2006 took Birao, Sam Ouandja and Ouadda; the government accused Sudan of backing them. French aircraft and troops, based in the country under a defence agreement, helped the army retake Birao in November–December 2006, and when the UFDR attacked again in March 2007 French paratroopers fought for the town, much of which was burned. In the north-west, the APRD, made up largely of supporters of the overthrown president Ange-Félix Patassé, and Abdoulaye Miskine’s FDPC fought the army, whose Presidential Guard burned villages and killed hundreds of civilians; Chadian troops also crossed the border. Some 212,000 people fled their homes. The FDPC signed a peace agreement at Sirte in Libya in February 2007, and the UFDR at Birao in April 2007; a comprehensive peace agreement signed in Libreville in June 2008 by the main groups provided for amnesty and disarmament, but its failure led to the Séléka rebellion of 2012.
: Ett uppror mot François Bozizé, som hade tagit makten i Centralafrikanska republiken i mars 2003 och valdes till president 2005. I det avlägsna nordost gjorde rebeller, som senare enades i Unionen av demokratiska krafter för enhet (UFDR) under ledning av Michel Djotodia, en räd mot Birao i november 2004 och intog i slutet av 2006 Birao, Sam Ouandja och Ouadda; regeringen anklagade Sudan för att stödja dem. Franska flygplan och trupper, som var stationerade i landet enligt ett försvarsavtal, hjälpte armén att återta Birao i november–december 2006, och när UFDR anföll igen i mars 2007 stred franska fallskärmsjägare om staden, som till stor del brändes. I nordväst bekämpade APRD, som till stor del bestod av anhängare till den störtade presidenten Ange-Félix Patassé, och Abdoulaye Miskines FDPC armén, vars presidentgarde brände byar och dödade hundratals civila; även tchadiska trupper gick över gränsen. Omkring 212 000 människor flydde från sina hem. FDPC undertecknade ett fredsavtal i Sirte i Libyen i februari 2007, och UFDR i Birao i april 2007; ett övergripande fredsavtal som de viktigaste grupperna undertecknade i Libreville i juni 2008 föreskrev amnesti och avväpning, men dess misslyckande ledde till Séléka-upproret 2012.
