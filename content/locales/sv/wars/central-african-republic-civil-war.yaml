# Svenska översättningar av katalogtexten (våg 13); stegtexterna kommer senare.
Central African Republic Civil War: Inbördeskriget i Centralafrikanska republiken
? The war that began in December 2012, when the Séléka, an alliance of rebel groups from the largely Muslim north-east, marched on Bangui and in March 2013 overthrew President François Bozizé. The Séléka’s looting and killings provoked the rise of the Anti-balaka, militias drawn mostly from Christian and animist communities, which drove much of the Muslim population out of the west of the country. French troops, African and then UN peacekeepers intervened, the Séléka leader Michel Djotodia resigned in 2014, and elections in 2016 brought Faustin-Archange Touadéra to power, but the country remained divided between more than a dozen armed groups fighting over mines, cattle routes and roadblocks. After a peace agreement in 2019 failed, the armed groups united against Touadéra in the Coalition of Patriots for Change (CPC) in December 2020; Russian Wagner fighters and Rwandan troops drove them back from Bangui and most towns. Two of the largest groups disarmed in 2025, but violence continues in the north-east and south-east. No reliable overall death toll exists; more than a million people were displaced at the height of the war.
: Det krig som började i december 2012, när Séléka, en allians av rebellgrupper från det till stor del muslimska nordost, marscherade mot Bangui och i mars 2013 störtade president François Bozizé. Sélékas plundring och dödande ledde till att anti-balaka uppstod, miliser som främst rekryterades bland kristna och animistiska samhällen och som drev ut en stor del av den muslimska befolkningen ur landets västra del. Franska trupper samt afrikanska och sedan FN:s fredsbevarande styrkor ingrep, Séléka-ledaren Michel Djotodia avgick 2014, och val 2016 förde Faustin-Archange Touadéra till makten, men landet förblev delat mellan mer än ett dussin väpnade grupper som stred om gruvor, boskapsleder och vägspärrar. Sedan ett fredsavtal 2019 misslyckats enades de väpnade grupperna mot Touadéra i Koalitionen av patrioter för förändring (CPC) i december 2020; ryska Wagnerkämpar och rwandiska trupper drev tillbaka dem från Bangui och de flesta städer. Två av de största grupperna lade ned vapnen 2025, men våldet fortsätter i nordost och sydost. Någon tillförlitlig samlad dödssiffra finns inte; mer än en miljon människor var på flykt när kriget var som värst.
