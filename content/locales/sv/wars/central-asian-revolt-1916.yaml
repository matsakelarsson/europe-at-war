# Svenska översättningar av katalogtexten (våg 7); stegtexterna kommer senare.
Central Asian revolt of 1916: Centralasiatiska upproret 1916
A rising against Russian rule in Turkestan and the Kazakh steppe, set off by a wartime decree of July 1916 that called up the region’s Muslim men, until then exempt from military service, for labour behind the front. Rebels killed officials and Russian settlers, above all in Semirechye. The army, Cossacks and settler militias put the revolt down with mass killings, and hundreds of thousands of Kyrgyz and Kazakhs fled across the Tian Shan into China, the flight Kyrgyz remember as the Urkun. Estimates of the Central Asian dead range from about 40,000 to 270,000 or more.: Ett uppror mot det ryska styret i Turkestan och på den kazakiska stäppen, utlöst av ett krigstidsdekret från juli 1916 som kallade in områdets muslimska män, som fram till dess hade varit befriade från militärtjänst, till arbete bakom fronten. Rebeller dödade tjänstemän och ryska nybyggare, framför allt i Semiretje. Armén, kosacker och nybyggarmiliser slog ned upproret med massmord, och hundratusentals kirgizer och kazaker flydde över Tian Shan till Kina, den flykt som kirgizerna minns som Urkun. Uppskattningarna av antalet centralasiatiska döda varierar från omkring 40 000 till 270 000 eller fler.
