# Svenska översättningar av katalogtexten (våg 9); stegtexterna kommer senare.
Central Plains War: Kriget på centralslätten
? "A civil war in 1930 between Chiang Kai-shek’s Nationalist government in Nanjing and a coalition of the generals who had fought beside him in the Northern Expedition: Yan Xishan of Shanxi, Feng Yuxiang of the Northwest Army and Li Zongren of the Guangxi clique, with Wang Jingwei’s faction of the Kuomintang. It grew out of Chiang’s plans to cut the regional armies and the wars of 1929 against the Guangxi clique and Feng. From May to October 1930 well over a million men fought along the railways of Henan, Shandong and Anhui, on the plains of the middle Yellow River, in the largest war of the warlord era. The coalition took Jinan and set up a rival national government in Beiping in September, but Chiang held the Longhai railway and retook Jinan, and the war was decided when Zhang Xueliang, ruler of the north-east, declared for Nanjing on 18 September and sent his army through the Shanhai Pass to occupy Beiping and Tianjin. Feng’s army fell apart and Yan withdrew to Shanxi; both resigned their posts on 4 November. The government admitted 30,000 dead and 60,000 wounded on its own side; losses on both sides and among civilians were much higher. Chiang emerged as China’s leading figure, but the war drained his government, and Zhang’s move south left Manchuria weakly defended a year before the Japanese invasion."
: "Ett inbördeskrig 1930 mellan Chiang Kai-sheks nationalistregering i Nanking och en koalition av de generaler som hade stridit vid hans sida under Norra fälttåget: Yan Xishan i Shanxi, Feng Yuxiang med Nordvästarmén och Li Zongren från Guangxiklicken, tillsammans med Wang Jingweis fraktion inom Kuomintang. Det växte fram ur Chiangs planer på att skära ned de regionala arméerna och ur krigen 1929 mot Guangxiklicken och Feng. Från maj till oktober 1930 stred långt över en miljon man längs järnvägarna i Henan, Shandong och Anhui, på slätterna vid mellersta Gula floden, i krigsherreerans största krig. Koalitionen intog Jinan och bildade en rivaliserande nationell regering i Beiping i september, men Chiang höll Longhaijärnvägen och återtog Jinan, och kriget avgjordes när Zhang Xueliang, härskaren i nordöst, ställde sig på Nankings sida den 18 september och sände sin armé genom Shanhaipasset för att besätta Beiping och Tianjin. Fengs armé föll samman och Yan drog sig tillbaka till Shanxi; båda lämnade sina poster den 4 november. Regeringen medgav 30 000 döda och 60 000 sårade på den egna sidan; förlusterna på båda sidor och bland civila var mycket högre. Chiang framträdde som Kinas ledande gestalt, men kriget tärde på hans regering, och Zhangs förflyttning söderut lämnade Manchuriet svagt försvarat ett år före den japanska invasionen."
