# Svenska översättningar av katalogtexten (våg 12); stegtexterna kommer senare.
Chadian Civil War (1965–1979): Tchadiska inbördeskriget (1965–1979)
? The first civil war of independent Chad, between the governments of François Tombalbaye and Félix Malloum in Fort-Lamy (N’Djamena from 1973) and rebels of the Muslim centre, east and north. Tombalbaye’s one-party state, dominated by southerners, raised taxes that were collected by force, and tax riots at Mangalmé in November 1965 began a peasant revolt that spread across the centre and east. In 1966 exiles in Sudan founded the National Liberation Front of Chad (FROLINAT), and from 1968 Toubou fighters in the Tibesti under Goukouni Oueddei and later Hissène Habré joined the rebellion. France intervened in 1968–1972 and drove the rebels back at the cost of thousands of lives, mostly Chadian. Libya, which occupied the Aouzou Strip in the far north in 1973, armed the rebels; FROLINAT split into rival armies. Tombalbaye was killed in a coup in 1975. In 1978 Goukouni’s forces, with Libyan support, took Faya-Largeau and advanced on the capital until French troops stopped them; Habré then joined the government as prime minister and in February 1979 turned on Malloum. The battle for N’Djamena and the killings that followed in the north and south left thousands dead, the state fell apart into factions, and the agreements of Kano and Lagos brought Goukouni to power at the head of a government of national unity in November 1979. Its collapse began the Chadian–Libyan war.
: Det självständiga Tchads första inbördeskrig, mellan François Tombalbayes och Félix Malloums regeringar i Fort-Lamy (från 1973 N’Djamena) och rebeller från landets muslimska centrala, östra och norra delar. Tombalbayes enpartistat, dominerad av sydlänningar, höjde skatter som drevs in med våld, och skatteupplopp i Mangalmé i november 1965 inledde en bonderevolt som spred sig över de centrala och östra delarna av landet. År 1966 grundade landsflyktingar i Sudan Tchads nationella befrielsefront (FROLINAT), och från 1968 anslöt sig toubouiska krigare i Tibesti under Goukouni Oueddei och senare Hissène Habré till rebellionen. Frankrike intervenerade 1968–1972 och drev tillbaka rebellerna till priset av tusentals liv, mestadels tchadiska. Libyen, som 1973 ockuperade Aouzouremsan längst i norr, beväpnade rebellerna; FROLINAT splittrades i rivaliserande arméer. Tombalbaye dödades vid en kupp 1975. År 1978 intog Goukounis styrkor med libyskt stöd Faya-Largeau och ryckte fram mot huvudstaden tills franska trupper stoppade dem; Habré gick då in i regeringen som premiärminister och vände sig i februari 1979 mot Malloum. Slaget om N’Djamena och de mord som följde i norr och söder krävde tusentals liv, staten föll sönder i fraktioner, och avtalen i Kano och Lagos förde i november 1979 Goukouni till makten i spetsen för en nationell samlingsregering. Dess sammanbrott inledde det tchadisk-libyska kriget.
