# Svenska översättningar av katalogtexten (våg 12); stegtexterna kommer senare.
Chadian Civil War (2005–2010): Tchadiska inbördeskriget (2005–2010)
? "A war between the government of President Idriss Déby and rebel movements based in Darfur, fought alongside the war in Darfur as a proxy war between Chad and Sudan. Déby, who had taken power in 1990, faced defections from his own Zaghawa clan and army over his support for the Darfur rebels and over a constitutional change of 2005 that let him stand for a third term. Sudan armed and sheltered the Chadian rebels, while Chad backed the Darfur rebels of the Justice and Equality Movement (JEM). Rebel columns of pickup trucks crossed Chad from the Sudanese border and reached N’Djamena twice: in April 2006, when the United Front for Democratic Change was beaten back at the National Assembly, and in February 2008, when a coalition of the UFDD, UFDD-F and RFC broke into the capital and besieged Déby in his palace before withdrawing. France helped the government with intelligence, logistics and the evacuation of foreigners. In eastern Chad, where about 250,000 refugees from Darfur lived in camps, militias and rebels raided villages and some 170,000 Chadians were displaced; a European Union force and then a UN mission protected the camps in 2008–2010. After a last rebel offensive was crushed at Am Dam in May 2009, Chad and Sudan signed an agreement on 15 January 2010 to stop backing each other’s rebels."
: "Ett krig mellan president Idriss Débys regering och rebellrörelser med baser i Darfur, utkämpat parallellt med kriget i Darfur som ett ombudskrig mellan Tchad och Sudan. Déby, som hade tagit makten 1990, drabbades av avhopp inom sin egen zaghawaklan och armén på grund av sitt stöd till rebellerna i Darfur och en grundlagsändring 2005 som lät honom ställa upp för en tredje mandatperiod. Sudan beväpnade de tchadiska rebellerna och gav dem en fristad, medan Tchad stödde Darfurrebellerna i Rörelsen för rättvisa och jämlikhet (JEM). Rebellkolonner av pickuper korsade Tchad från den sudanesiska gränsen och nådde N’Djamena två gånger: i april 2006, när Förenade fronten för demokratisk förändring slogs tillbaka vid nationalförsamlingen, och i februari 2008, när en koalition av UFDD, UFDD-F och RFC bröt sig in i huvudstaden och belägrade Déby i hans palats innan den drog sig tillbaka. Frankrike hjälpte regeringen med underrättelser, logistik och evakuering av utlänningar. I östra Tchad, där omkring 250 000 flyktingar från Darfur levde i läger, plundrade miliser och rebeller byar, och omkring 170 000 tchadier drevs på flykt; en styrka från Europeiska unionen och sedan en FN-insats skyddade lägren 2008–2010. Sedan en sista rebelloffensiv hade krossats vid Am Dam i maj 2009 undertecknade Tchad och Sudan den 15 januari 2010 ett avtal om att sluta stödja varandras rebeller."
