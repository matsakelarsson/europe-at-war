# Svenska översättningar av katalogtexten (våg 12); stegtexterna kommer senare.
Chadian–Libyan war: Tchadisk-libyska kriget
? "A war over northern Chad between Muammar Gaddafi’s Libya and successive Chadian governments, fought in and around Chad’s own civil war. Libya had occupied the Aouzou Strip on the Libyan border in 1973 and backed Goukouni Oueddei’s rebels, who took Faya-Largeau with Libyan help in 1978. After the government of national unity formed in 1979 broke apart, Libyan troops helped Goukouni drive his rival Hissène Habré out of N’Djamena in December 1980, and Gaddafi announced a union of the two countries, which alarmed Africa and France; the Libyans withdrew in November 1981, and Habré took the capital in June 1982. Libya then backed Goukouni’s rival government in the north, retook Faya-Largeau in 1983 and held the north of the country for three years, while French troops in Operations Manta and Épervier guarded the south along the 15th and then the 16th parallel. When Goukouni broke with Libya in 1986, the Chadian forces, united under Habré and mounted on Toyota pickup trucks with anti-tank missiles, won the “Toyota War” of 1987: they destroyed the Libyan bases at Fada and Ouadi Doum, took Faya-Largeau and even raided the airbase of Maaten al-Sarra inside Libya. A ceasefire on 11 September 1987 left Libya only the Aouzou Strip, which the International Court of Justice awarded to Chad in 1994; Libya withdrew that May. Habré’s own rule was brutal: a Chadian commission later blamed it for some 40,000 political killings, and he was convicted of crimes against humanity in 2016."
: "Ett krig om norra Tchad mellan Muammar Gaddafis Libyen och Tchads skiftande regeringar, utkämpat i och kring Tchads eget inbördeskrig. Libyen hade 1973 ockuperat Aouzouremsan vid den libyska gränsen och stödde Goukouni Oueddeis rebeller, som med libysk hjälp intog Faya-Largeau 1978. Sedan den nationella samlingsregering som bildats 1979 hade fallit sönder hjälpte libyska trupper Goukouni att driva ut hans rival Hissène Habré ur N’Djamena i december 1980, och Gaddafi tillkännagav en union mellan de två länderna, vilket väckte oro i Afrika och Frankrike; libyerna drog sig tillbaka i november 1981, och Habré intog huvudstaden i juni 1982. Libyen stödde därefter Goukounis rivaliserande regering i norr, återtog Faya-Largeau 1983 och höll landets norra del i tre år, medan franska trupper i operationerna Manta och Épervier bevakade södern längs 15:e och sedan 16:e breddgraden. När Goukouni bröt med Libyen 1986 vann de tchadiska styrkorna, enade under Habré och färdades på Toyotapickuper med pansarvärnsrobotar, ”Toyotakriget” 1987: de förstörde de libyska baserna i Fada och Ouadi Doum, intog Faya-Largeau och gjorde till och med en räd mot flygbasen Maaten al-Sarra inne i Libyen. En vapenvila den 11 september 1987 lämnade Libyen endast Aouzouremsan, som Internationella domstolen tilldömde Tchad 1994; Libyen drog sig tillbaka i maj samma år. Habrés eget styre var brutalt: en tchadisk kommission gav det senare skulden för omkring 40 000 politiska mord, och han dömdes för brott mot mänskligheten 2016."
