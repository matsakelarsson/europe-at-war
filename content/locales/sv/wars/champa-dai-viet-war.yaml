# Svenska översättningar av katalogtexten (våg 11); stegtexterna kommer senare.
Champa–Đại Việt war of 1361–1390: Kriget mellan Champa och Đại Việt 1361–1390
Three decades of war in which Champa, reunited under Chế Bồng Nga (Po Binasuor), nearly overthrew the Trần dynasty of Đại Việt. Cham fleets raided the coast from 1361, and in 1368 Chế Bồng Nga demanded back the districts of Ô and Lý, ceded to Đại Việt in 1306. In 1371, after a succession crisis in Thăng Long, his fleet sailed into the Red River delta and sacked the capital. In 1377 the Trần king Trần Duệ Tông led a large army against the Cham capital Vijaya and was killed in an ambush; the Cham marched north, overran Nghệ An and Thanh Hóa with the help of Vietnamese defectors, and sacked Thăng Long again in 1377–1378 and in 1383. The war ended in 1390 on the Hải Triều (Luộc) River, where a volley of handguns hit Chế Bồng Nga’s barge and killed him. Neither side gained land, both were exhausted, and the general Hồ Quý Ly, who had risen in the war, took the Trần throne in 1400.: Tre decennier av krig där Champa, återförenat under Chế Bồng Nga (Po Binasuor), nästan störtade Đại Việts Trầndynasti. Chamiska flottor härjade kusten från 1361, och 1368 krävde Chế Bồng Nga tillbaka distrikten Ô och Lý, som hade avträtts till Đại Việt 1306. År 1371, efter en tronföljdskris i Thăng Long, seglade hans flotta in i Röda flodens delta och plundrade huvudstaden. År 1377 ledde Trầnkungen Trần Duệ Tông en stor armé mot chamernas huvudstad Vijaya och dödades i ett bakhåll; chamerna marscherade norrut, överskred Nghệ An och Thanh Hóa med hjälp av vietnamesiska överlöpare och plundrade Thăng Long på nytt 1377–1378 och 1383. Kriget slutade 1390 vid floden Hải Triều (Luộc), där en salva från handkanoner träffade Chế Bồng Ngas båt och dödade honom. Ingen av sidorna vann land, båda var utmattade, och generalen Hồ Quý Ly, som hade stigit till makt under kriget, tog Trầntronen 1400.
