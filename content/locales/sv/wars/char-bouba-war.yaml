# Svenska översättningar av katalogtexten (våg 12); stegtexterna kommer senare.
Char Bouba war: Char Bouba-kriget
? A war in the south-western Sahara and the Senegal valley between the clerical Berber tribes (the zawaya) led by the imam Nasir al-Din and the warrior Arab tribes of the Banu Hassan, which ended the zawaya’s political power and left the Hassan emirates of Trarza and Brakna dominant in what is now southern Mauritania. Nasir al-Din (Awbek b. Ashfaga), a scholar of the Lamtuna, preached repentance and the rule of Islamic law, demanded zakat from the tribes of the region and condemned the kings of the Senegal valley for selling their own subjects to European slave traders. The war takes its Berber name, “Bubba’s war”, from a tributary of the Lamtuna who persuaded his chief to call on Haddi b. Ahmad b. Daman of the Trarza to resist the zakat. In 1673 Nasir al-Din’s followers, called the Toubenan (“penitents”) by Europeans, overthrew the Denianke ruler of Futa Toro and the rulers of Kayor and Jolof, with the support of Torodbe clerics, peasants and Muslim Wolof, and later took Waalo. The French at Saint-Louis, whose trade the clerics disrupted, backed the old ruling families. Nasir al-Din was killed at Tirtilass by May 1674; his successors Uthman, Munir al-Din and al-Mukhtar were killed or died in turn, the Wolof and Denianke aristocracies regained their thrones with French help, and the movement collapsed in 1677. The defeated zawaya had to pay tribute to the Hassan and give them rights to water and milk. A famine from 1676 drove many people in the Senegal valley to sell themselves into slavery.
: Ett krig i sydvästra Sahara och Senegaldalen mellan de religiöst lärda berberstammarna (zawaya), ledda av imamen Nasir al-Din, och de arabiska krigarstammarna i Banu Hassan, som gjorde slut på zawayas politiska makt och lämnade hassanemiraten Trarza och Brakna dominerande i det som i dag är södra Mauretanien. Nasir al-Din (Awbek b. Ashfaga), en lärd ur lamtuna, predikade botfärdighet och den islamiska lagens herravälde, krävde zakat av regionens stammar och fördömde kungarna i Senegaldalen för att de sålde sina egna undersåtar till europeiska slavhandlare. Kriget har fått sitt berberiska namn, ”Bubbas krig”, efter en av lamtunas skattskyldiga som övertalade sin hövding att vända sig till Haddi b. Ahmad b. Daman av Trarza för att göra motstånd mot zakaten. År 1673 störtade Nasir al-Dins anhängare, av européerna kallade toubenan (”de botfärdiga”), deniankehärskaren i Futa Toro och härskarna i Kayor och Jolof med stöd av lärda ur torodbe, bönder och muslimska wolofer, och de intog senare Waalo. Fransmännen i Saint-Louis, vars handel de lärda störde, stödde de gamla härskarsläkterna. Nasir al-Din stupade vid Tirtilass senast i maj 1674; hans efterträdare Uthman, Munir al-Din och al-Mukhtar dödades eller dog i tur och ordning, wolof- och deniankearistokratierna återtog sina troner med fransk hjälp, och rörelsen bröt samman 1677. De besegrade zawaya tvingades betala tribut till hassan och ge dem rätt till vatten och mjölk. En hungersnöd från 1676 drev många människor i Senegaldalen att sälja sig själva som slavar.
