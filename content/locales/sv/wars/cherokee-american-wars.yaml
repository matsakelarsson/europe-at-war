# Svenska översättningar av katalogtexten (våg 14); stegtexterna kommer senare.
Cherokee–American wars: Cherokesisk-amerikanska krigen
? Nearly twenty years of war between the Cherokee and the American frontier settlements of Virginia, the Carolinas, Georgia and Tennessee. Settlers had pushed onto Cherokee land beyond the Appalachians, and in 1775 a land company bought Kentucky and much of the Cumberland valley from some Cherokee leaders. In the summer of 1776, encouraged by the British and by the Shawnee, Cherokee warriors attacked the frontier; militia from four states answered by burning more than fifty Cherokee towns, and in 1777 the older leaders made peace and gave up land. Dragging Canoe (Tsiyu Gansini) and those who refused to accept the cessions moved down the Tennessee River and founded new towns, first on Chickamauga Creek and later below Lookout Mountain; the Americans called them the Chickamauga, and later the Lower Cherokee. With British and then Spanish supplies, and with Muscogee, Shawnee and Loyalist allies, they fought on after the Revolution against the settlements on the Holston and the Cumberland. American raids repeatedly destroyed their towns and those of the Cherokee who had made peace, and in 1788 militiamen killed the peace chief Old Tassel under a flag of truce. After Dragging Canoe’s death in 1792 John Watts led the war, until the destruction of Nickajack and Running Water and the defeat of the Western Confederacy in the north led him to make peace at Tellico Blockhouse on 7 November 1794.
: Nästan tjugo år av krig mellan cherokeserna och de amerikanska gränsbosättningarna i Virginia, North och South Carolina, Georgia och Tennessee. Nybyggare hade trängt in på cherokesisk mark bortom Appalacherna, och 1775 köpte ett landbolag Kentucky och en stor del av Cumberlanddalen av några cherokesiska ledare. Sommaren 1776 anföll cherokesiska krigare, uppmuntrade av britterna och av shawnee, gränsbygderna; milis från fyra delstater svarade med att bränna mer än femtio cherokesiska byar, och 1777 slöt de äldre ledarna fred och avstod land. Dragging Canoe (Tsiyu Gansini) och de som vägrade att godta avträdelserna flyttade nedför Tennesseefloden och grundade nya byar, först vid Chickamauga Creek och senare nedanför Lookout Mountain; amerikanerna kallade dem chickamauga och senare nedre cherokeser. Med brittiska och sedan spanska förnödenheter och med allierade bland muscogee, shawnee och lojalister stred de vidare efter revolutionen mot bosättningarna vid Holston och Cumberland. Amerikanska räder förstörde gång på gång deras byar och byarna hos de cherokeser som hade slutit fred, och 1788 dödade milismän fredshövdingen Old Tassel under parlamentärflagg. Efter Dragging Canoes död 1792 ledde John Watts kriget, tills förstörelsen av Nickajack och Running Water och Västra förbundets nederlag i norr fick honom att sluta fred vid Tellico Blockhouse den 7 november 1794.
Cherokee (from 1777 chiefly the Chickamauga or Lower Cherokee of Dragging Canoe and John Watts), with Muscogee, Shawnee and Loyalist allies: Cherokeser (från 1777 främst Dragging Canoes och John Watts chickamauga eller nedre cherokeser), med allierade bland muscogee, shawnee och lojalister
