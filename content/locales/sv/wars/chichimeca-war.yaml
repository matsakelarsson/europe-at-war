# Svenska översättningar av katalogtexten (våg 14); stegtexterna kommer senare.
Chichimeca War: Chichimekkriget
Forty years of war between New Spain and the peoples the Spaniards called Chichimecs, the Guachichiles, Zacatecos, Guamares and Pames of the dry plateau north of the old Aztec lands, set off by the silver strike at Zacatecas in 1546 and the roads, mining towns and slave raids that followed. From 1550 Chichimec raiders attacked wagon trains, ranches and towns along the silver road; by 1561 they had killed more than 4,000 Spaniards and allies. Neither a line of presidios nor the “war of fire and blood” declared in 1567 stopped them, and the raids were at their worst in 1575–1585. From 1586 the viceroys bought peace instead, with food, clothing, tools and land, missions and settlements of Tlaxcalan families; in 1590 the roads to Zacatecas were declared safe for the first time in forty years.: Fyrtio års krig mellan Nya Spanien och de folk som spanjorerna kallade chichimeker, det vill säga guachichiler, zacateker, guamarer och pamer på den torra högplatån norr om de gamla aztekiska områdena, ett krig som utlöstes av silverfyndet i Zacatecas 1546 och av de vägar, gruvstäder och slavräder som följde. Från 1550 anföll chichimekiska krigarskaror vagnskaravaner, ranchar och städer längs silvervägen; fram till 1561 hade de dödat mer än 4 000 spanjorer och allierade. Varken en kedja av presidios eller det ”krig med eld och blod” som förklarades 1567 kunde stoppa dem, och räderna var som värst 1575–1585. Från 1586 köpte vicekungarna i stället fred, med livsmedel, kläder, verktyg och land, missioner och bosättningar av tlaxcaltekiska familjer; 1590 förklarades vägarna till Zacatecas säkra för första gången på fyrtio år.
