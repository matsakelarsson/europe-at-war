# Svenska översättningar av katalogtexten (våg 14); stegtexterna kommer senare.
Chickasaw Wars: Chickasawkrigen
? Two French campaigns against the Chickasaw, whose towns stood near today’s Tupelo, Mississippi. The Chickasaw traded with the British of Carolina, raided French traffic on the Mississippi and had taken in Natchez refugees after the Natchez War, and Governor Jean-Baptiste Le Moyne de Bienville of Louisiana, encouraged by the Choctaw, set out to crush them. In 1736 two armies were to meet at the Chickasaw towns. The northern one, French troops and Illinois and other allied warriors from the Illinois country under Pierre d’Artaguiette, arrived first and attacked the village of Ogoula Tchetoka on 25 March 1736; it was routed, and d’Artaguiette, the Jesuit Antoine Sénat, François-Marie Bissot de Vincennes and other prisoners were burned to death. Bienville, coming up the Tombigbee from Mobile with about 1,200 French soldiers and Choctaw warriors, attacked the fortified town of Ackia on 26 May 1736 and was beaten off with heavy losses. In 1739 Bienville gathered a larger army, with troops and allied warriors from Canada and the Illinois country under Charles Le Moyne de Longueuil and Pierre-Joseph Céloron de Blainville, at Fort de l’Assomption on the Chickasaw Bluffs (today’s Memphis), but sickness and the impossibility of hauling his artillery through the forest stopped him, and in the spring of 1740 Céloron made a peace with the Chickasaw that left them undefeated. The Chickasaw remained allies of the British, and Choctaw and Chickasaw raids on each other went on until France left North America in 1763.
: Två franska fälttåg mot chickasaw, vars byar låg nära dagens Tupelo i Mississippi. Chickasaw handlade med britterna i Carolina, gjorde räder mot den franska trafiken på Mississippi och hade tagit emot flyktingar från natchez efter natchezkriget, och guvernören i Louisiana, Jean-Baptiste Le Moyne de Bienville, föresatte sig, uppmuntrad av choctaw, att krossa dem. År 1736 skulle två arméer mötas vid chickasawbyarna. Den norra, som bestod av franska trupper och krigare från illinois och andra allierade folk i Illinoislandet under Pierre d’Artaguiette, kom fram först och anföll byn Ogoula Tchetoka den 25 mars 1736; den slogs på flykten, och d’Artaguiette, jesuiten Antoine Sénat, François-Marie Bissot de Vincennes och andra fångar brändes till döds. Bienville, som drog uppför Tombigbee från Mobile med omkring 1 200 franska soldater och choctawkrigare, anföll den befästa byn Ackia den 26 maj 1736 och slogs tillbaka med svåra förluster. År 1739 samlade Bienville en större armé, med trupper och allierade krigare från Kanada och Illinoislandet under Charles Le Moyne de Longueuil och Pierre-Joseph Céloron de Blainville, vid Fort de l’Assomption på Chickasaw Bluffs (dagens Memphis), men sjukdomar och omöjligheten att släpa artilleriet genom skogen hejdade honom, och våren 1740 slöt Céloron en fred med chickasaw som lämnade dem obesegrade. Chickasaw förblev britternas allierade, och choctaw och chickasaw fortsatte att göra räder mot varandra tills Frankrike lämnade Nordamerika 1763.
