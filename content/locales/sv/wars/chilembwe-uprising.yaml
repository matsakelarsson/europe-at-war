# Svenska översättningar av katalogtexten (våg 13); stegtexterna kommer senare.
Chilembwe uprising: Chilembweupproret
? A short armed rising against British colonial rule in the Nyasaland Protectorate (Malawi) in January 1915, led by the Baptist minister John Chilembwe. Educated in the United States, Chilembwe ran the Providence Industrial Mission at Mbombwe in the Shire Highlands, where he and a small African middle class of teachers, traders and farmers resented the colour bar, the hut tax and above all thangata, the system by which Africans living on European estates paid their rent in unpaid labour. The neighbouring A. L. Bruce estate at Magomero, whose manager William Jervis Livingstone had burned Chilembwe’s churches on estate land, was notorious for it. The outbreak of the First World War, in which Nyasaland’s Africans were recruited by the thousands as soldiers and porters against German East Africa and died in battle at Karonga, led Chilembwe to protest in the press and then to plan a rising. On the night of 23 January 1915 his followers attacked Magomero, killed Livingstone and two other European men, and spared the women and children; another party raided an armoury in Blantyre for weapons. The rising found little wider support. Troops of the King’s African Rifles and settler volunteers failed to take Mbombwe on 25 January but occupied it the next day, after the rebels had burned the Catholic mission at Nguludi. Chilembwe fled towards Mozambique and was shot by a police patrol on 3 February. About 40 of his followers were executed and some 300 imprisoned. The rising was largely forgotten under colonial rule, but since Malawi’s independence in 1964 Chilembwe has been honoured as a national hero; 15 January is John Chilembwe Day.
: En kort väpnad resning mot det brittiska kolonialstyret i protektoratet Nyasaland (Malawi) i januari 1915, ledd av baptistpastorn John Chilembwe. Chilembwe, som hade utbildats i USA, ledde Providence Industrial Mission i Mbombwe i Shirehöglandet, där han och en liten afrikansk medelklass av lärare, handlare och jordbrukare harmades över rasbarriären, hyddskatten och framför allt thangata, det system genom vilket afrikaner som bodde på europeiska plantager betalade sitt arrende med obetalt arbete. Grannplantagen A. L. Bruce i Magomero, vars förvaltare William Jervis Livingstone hade bränt Chilembwes kyrkor på plantagens mark, var ökänd för detta. Första världskrigets utbrott, då Nyasalands afrikaner rekryterades i tusental som soldater och bärare mot Tyska Östafrika och stupade i strid vid Karonga, fick Chilembwe att protestera i pressen och sedan planera en resning. På natten den 23 januari 1915 anföll hans anhängare Magomero, dödade Livingstone och två andra europeiska män och skonade kvinnorna och barnen; en annan grupp gjorde en räd mot ett vapenförråd i Blantyre för att skaffa vapen. Resningen fick föga bredare stöd. Trupper ur King’s African Rifles och frivilliga nybyggare misslyckades med att inta Mbombwe den 25 januari men besatte platsen dagen därpå, sedan rebellerna bränt den katolska missionsstationen i Nguludi. Chilembwe flydde mot Moçambique och sköts av en polispatrull den 3 februari. Omkring 40 av hans anhängare avrättades och omkring 300 fängslades. Resningen föll i stort sett i glömska under kolonialstyret, men sedan Malawis självständighet 1964 har Chilembwe hedrats som nationalhjälte; den 15 januari är John Chilembwe-dagen.
