# Svenska översättningar av katalogtexten (våg 8); stegtexterna kommer senare.
China–India border clashes of 2020–2021: Gränsstriderna mellan Kina och Indien 2020–2021
? A military standoff along the Line of Actual Control (LAC), the undemarcated border between India and China in the Himalaya, in which soldiers of the two countries died in combat for the first time since 1975. In May 2020 Chinese troops moved into several areas in eastern Ladakh that both sides claimed and patrolled, and brawls broke out at the Pangong lake and in Sikkim. On the night of 15 June, in the Galwan valley, soldiers fought for hours with clubs, stones and rocks, since the two sides had agreed not to use firearms near the border; 20 Indian soldiers were killed, and China later acknowledged four dead. Both countries moved tens of thousands of troops, tanks and aircraft to the high plateau, India banned Chinese apps and curbed Chinese investment, and in late August Indian troops seized heights south of the Pangong lake, after which shots were fired for the first time in decades. Talks between corps commanders led to a pull-back from the Pangong area in February 2021, and from other friction points over the next years, with buffer zones in which neither side patrols.
: En militär konfrontation längs den faktiska kontrollinjen (LAC), den odemarkerade gränsen mellan Indien och Kina i Himalaya, där soldater från de två länderna dog i strid för första gången sedan 1975. I maj 2020 ryckte kinesiska trupper in i flera områden i östra Ladakh som båda sidor gjorde anspråk på och patrullerade, och slagsmål bröt ut vid sjön Pangong och i Sikkim. Natten den 15 juni i Galwandalen slogs soldater i timmar med klubbor, stenar och stenblock, eftersom de två sidorna hade kommit överens om att inte använda skjutvapen nära gränsen; 20 indiska soldater dödades, och Kina medgav senare fyra döda. Båda länderna flyttade tiotusentals soldater, stridsvagnar och flygplan till högplatån, Indien förbjöd kinesiska appar och begränsade kinesiska investeringar, och i slutet av augusti intog indiska trupper höjder söder om sjön Pangong, varefter skott avlossades för första gången på årtionden. Samtal mellan kårchefer ledde till ett tillbakadragande från Pangongområdet i februari 2021 och från andra friktionspunkter under de följande åren, med buffertzoner där ingen av sidorna patrullerar.
