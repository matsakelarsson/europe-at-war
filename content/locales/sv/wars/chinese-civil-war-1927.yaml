# Svenska översättningar av katalogtexten (våg 9); stegtexterna kommer senare.
Chinese Civil War (1927–1937): Kinesiska inbördeskriget (1927–1937)
? "The first phase of the war between the Kuomintang’s Nationalist government and the Chinese Communist Party, from the Communists’ first armed risings in 1927 to the second united front against Japan in 1937. After the Kuomintang turned on its Communist allies in 1927, the Communists rose at Nanchang, in the Autumn Harvest Uprising and at Guangzhou, and were beaten; the survivors built rural bases, the largest in southern Jiangxi and western Fujian, where Mao Zedong and Zhu De formed the Red Army and the Chinese Soviet Republic was proclaimed at Ruijin in November 1931. Chiang Kai-shek’s government launched five encirclement campaigns against the Jiangxi base. The Red Army beat the first four, but the fifth, with about half a million men and lines of blockhouses, forced it to break out in October 1934 on the Long March: of about 86,000 who left Jiangxi, some 8,000 reached northern Shaanxi a year later, and the other Red armies followed in 1936. There, at Bao’an and Yan’an, Mao became the party’s leading figure. In December 1936 Chiang was seized at Xi’an by his own generals, who wanted an end to the civil war, and after Japan invaded in July 1937 the two parties formed a second united front; the Red Army became the Eighth Route Army and the New Fourth Army."
: "Den första fasen av kriget mellan Kuomintangs nationalistregering och Kinas kommunistiska parti, från kommunisternas första väpnade resningar 1927 till den andra enhetsfronten mot Japan 1937. Sedan Kuomintang 1927 hade vänt sig mot sina kommunistiska bundsförvanter gjorde kommunisterna uppror i Nanchang, i Höstskördeupproret och i Kanton och besegrades; de överlevande byggde upp baser på landsbygden, den största i södra Jiangxi och västra Fujian, där Mao Zedong och Zhu De bildade Röda armén och Kinesiska sovjetrepubliken utropades i Ruijin i november 1931. Chiang Kai-sheks regering inledde fem inringningsfälttåg mot basen i Jiangxi. Röda armén slog tillbaka de fyra första, men det femte, med omkring en halv miljon man och linjer av blockhus, tvingade den att bryta sig ut i oktober 1934 på den långa marschen: av omkring 86 000 som lämnade Jiangxi nådde omkring 8 000 norra Shaanxi ett år senare, och de andra röda arméerna följde efter 1936. Där, i Bao’an och Yan’an, blev Mao partiets ledande gestalt. I december 1936 greps Chiang i Xi’an av sina egna generaler, som ville göra slut på inbördeskriget, och sedan Japan hade invaderat i juli 1937 bildade de två partierna en andra enhetsfront; Röda armén blev Åttonde routearmén och Nya fjärde armén."
