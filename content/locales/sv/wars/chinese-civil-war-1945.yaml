# Svenska översättningar av katalogtexten (våg 9); stegtexterna kommer senare.
Chinese Civil War (1945–1949): Kinesiska inbördeskriget (1945–1949)
? The second phase of the war between the Nationalist government of the Kuomintang and the Chinese Communist Party, fought after the defeat of Japan. In August 1945 both sides raced to take over the territory Japan had held, and the Communists moved large forces into Manchuria, where the Soviet army had just driven out the Japanese. American mediation under George Marshall brought a ceasefire in January 1946, but fighting resumed in Manchuria in the spring, and in the summer of 1946 the war became general. The Nationalists, with far larger and better-equipped armies, took many cities, Yan’an among them, in 1946–1947. From mid-1947 the Communist People’s Liberation Army went over to the attack, and in three great campaigns in the autumn and winter of 1948–1949, Liaoshen, Huaihai and Pingjin, it destroyed the main Nationalist armies in Manchuria, on the plains north of Nanjing and around Beiping. In April 1949 it crossed the Yangtze and took Nanjing; Mao Zedong proclaimed the People’s Republic of China in Beijing on 1 October 1949, and on 7 December the Nationalist government moved to Taipei. By the end of 1949 the Republic of China held only Taiwan, Hainan and a few islands off the coast. The Nationalists lost an estimated 1.5–1.7 million men killed, wounded, captured or missing, and the People’s Liberation Army about 1.3 million, including some 260,000 killed; estimates of civilian deaths run from about 2.5 million upwards.
: Den andra fasen av kriget mellan Kuomintangs nationalistregering och Kinas kommunistiska parti, utkämpad efter Japans nederlag. I augusti 1945 tävlade båda sidor om att ta över det territorium som Japan hade hållit, och kommunisterna förde stora styrkor till Manchuriet, där den sovjetiska armén just hade drivit ut japanerna. Amerikansk medling under George Marshall ledde till vapenvila i januari 1946, men striderna återupptogs i Manchuriet på våren, och sommaren 1946 blev kriget allmänt. Nationalisterna, med långt större och bättre utrustade arméer, intog 1946–1947 många städer, bland dem Yan’an. Från mitten av 1947 gick kommunisternas Folkets befrielsearmé till anfall, och i tre stora fälttåg hösten och vintern 1948–1949, Liaoshen, Huaihai och Pingjin, förintade den nationalisternas huvudarméer i Manchuriet, på slätterna norr om Nanking och kring Beiping. I april 1949 gick den över Yangtze och intog Nanking; Mao Zedong utropade Folkrepubliken Kina i Peking den 1 oktober 1949, och den 7 december flyttade nationalistregeringen till Taipei. Vid slutet av 1949 höll Republiken Kina bara Taiwan, Hainan och några öar utanför kusten. Nationalisterna förlorade uppskattningsvis 1,5–1,7 miljoner man i döda, sårade, tillfångatagna eller saknade, och Folkets befrielsearmé omkring 1,3 miljoner, varav omkring 260 000 döda; uppskattningarna av antalet civila döda börjar vid omkring 2,5 miljoner och går uppåt.
