Zhao Erfeng’s campaigns and the Chinese expedition to Tibet: Zhao Erfengs fälttåg och den kinesiska expeditionen till Tibet
The last Qing attempt to bring Tibet and the Tibetan lands of Kham under direct rule. After the British expedition to Lhasa in 1903–1904, the Qing court began to settle Chinese farmers and open mines in Kham. In April 1905 the people and monks of Batang rose and killed the assistant amban Feng Quan. Zhao Erfeng, sent from Sichuan, crushed the rising, besieged and destroyed the great monastery of Sampheling at Chatreng in 1906, and over the next five years abolished the Tibetan chiefdoms of Kham one by one, replacing them with Chinese counties. In 1909 a Sichuan army under Zhong Ying marched on Lhasa; it entered the city on 12 February 1910, and the 13th Dalai Lama fled to British India, where the Qing declared him deposed. Zhao’s troops took Chamdo and pushed into Pome and Zayul. After the Xinhai Revolution, revolutionaries in Chengdu executed Zhao in December 1911, and the Qing garrison in Lhasa fell apart.: Qingdynastins sista försök att föra Tibet och de tibetanska områdena i Kham under direkt styre. Efter den brittiska expeditionen till Lhasa 1903–1904 började Qinghovet att bosätta kinesiska bönder och öppna gruvor i Kham. I april 1905 reste sig folket och munkarna i Batang och dödade den biträdande ambanen Feng Quan. Zhao Erfeng, som sändes från Sichuan, slog ned resningen, belägrade och förstörde det stora klostret Sampheling i Chatreng 1906 och avskaffade under de följande fem åren de tibetanska hövdingadömena i Kham ett efter ett och ersatte dem med kinesiska härad. År 1909 marscherade en sichuanesisk armé under Zhong Ying mot Lhasa; den tågade in i staden den 12 februari 1910, och den trettonde Dalai lama flydde till Brittiska Indien, där Qingdynastin förklarade honom avsatt. Zhaos trupper intog Chamdo och trängde in i Pome och Zayul. Efter Xinhairevolutionen avrättade revolutionärer i Chengdu Zhao i december 1911, och Qinggarnisonen i Lhasa föll samman.
