Batavia massacre and the Chinese War in Java: Massakern i Batavia och kinesiska kriget på Java
? The killing of the Chinese of Batavia by the Dutch East India Company (VOC) and its soldiers and auxiliaries in October 1740, and the war that followed across Central and East Java. Chinese sugar-mill workers around Batavia, threatened with deportation to Ceylon and hit by falling sugar prices, rose in early October 1740 and killed 50 Company soldiers. Rumours of a Chinese plot spread in the town, and from 9 to 22 October Company troops, sailors, militia and other townspeople killed the Chinese inside the walls; historians estimate at least 10,000 dead, and survivors at between 600 and about 3,400. Survivors under Khe Pandjang fled east, where the Chinese of the north coast rose under Singseh and were joined by Javanese lords and, from July 1741, by the court of Mataram under Pakubuwono II, which stormed the Company’s garrison at Kartasura. Semarang was besieged by about 3,500 Chinese and 20,000 Javanese, but Company reinforcements and Cakraningrat IV of Madura turned the tide. Pakubuwono II changed sides in 1742; the rebels proclaimed his nephew Raden Mas Garendi king and took Kartasura in June, until Cakraningrat retook it in December. By the treaty of November 1743 the restored Pakubuwono II ceded the north coast of Java, Madura and the east of the island to the Company, which never again faced a Javanese state it could not dominate.
: Dödandet av Batavias kineser, utfört av Nederländska ostindiska kompaniet (VOC) och dess soldater och hjälptrupper i oktober 1740, och det krig som sedan följde över mellersta och östra Java. Kinesiska sockerbruksarbetare runt Batavia, som hotades av deportation till Ceylon och drabbades av fallande sockerpriser, reste sig i början av oktober 1740 och dödade 50 av kompaniets soldater. Rykten om en kinesisk sammansvärjning spreds i staden, och från den 9 till den 22 oktober dödade kompaniets trupper, sjömän, milis och andra stadsbor kineserna innanför murarna; historiker uppskattar antalet döda till minst 10 000 och antalet överlevande till mellan 600 och omkring 3 400. Överlevande under Khe Pandjang flydde österut, där kineserna på nordkusten reste sig under Singseh och fick stöd av javanska stormän och, från juli 1741, av hovet i Mataram under Pakubuwono II, som stormade kompaniets garnison i Kartasura. Semarang belägrades av omkring 3 500 kineser och 20 000 javaner, men kompaniets förstärkningar och Cakraningrat IV av Madura vände krigslyckan. Pakubuwono II bytte sida 1742; rebellerna utropade hans brorson Raden Mas Garendi till kung och intog Kartasura i juni, tills Cakraningrat återtog staden i december. Genom fördraget i november 1743 avträdde den återinsatte Pakubuwono II Javas nordkust, Madura och öns östra del till kompaniet, som aldrig mer ställdes inför en javansk stat som det inte kunde dominera.
