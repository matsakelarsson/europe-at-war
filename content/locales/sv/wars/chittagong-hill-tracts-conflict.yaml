Chittagong Hill Tracts conflict: Konflikten i Chittagong Hill Tracts
The insurgency of the Jumma, the Buddhist, Hindu and Christian hill peoples of the Chittagong Hill Tracts in south-eastern Bangladesh, against the Bangladeshi state. The Chakma, Marma, Tripura and other peoples had lost much of their best land to the Kaptai dam in the 1960s, and after independence in 1971 Bangladesh refused their demand for autonomy. The Parbatya Chattagram Jana Samhati Samiti (PCJSS), led by Manabendra Narayan Larma, formed an armed wing, the Shanti Bahini (“peace force”), which began attacking the army in 1977. The government answered with a large military presence and by settling some 400,000 landless Bengalis in the hills, which led to clashes over land and to massacres of hill people by soldiers and settlers; the Shanti Bahini also attacked settlers. Tens of thousands of Jumma fled to India. Talks from the late 1980s led to the Chittagong Hill Tracts Peace Accord of 2 December 1997, under which the Shanti Bahini laid down its arms. Estimates of the dead range up to about 30,000.: Upproret bland jumma – de buddhistiska, hinduiska och kristna bergsfolken i Chittagong Hill Tracts i sydöstra Bangladesh – mot den bangladeshiska staten. Folken chakma, marma, tripura och andra hade förlorat mycket av sin bästa mark till Kaptaidammen på 1960-talet, och efter självständigheten 1971 avvisade Bangladesh deras krav på självstyre. Parbatya Chattagram Jana Samhati Samiti (PCJSS), under ledning av Manabendra Narayan Larma, bildade en väpnad gren, Shanti Bahini (”fredsstyrkan”), som började angripa armén 1977. Regeringen svarade med en stor militär närvaro och genom att bosätta omkring 400 000 jordlösa bengaler i bergen, vilket ledde till strider om mark och till massakrer på bergsfolk begångna av soldater och bosättare; Shanti Bahini angrep också bosättare. Tiotusentals jumma flydde till Indien. Förhandlingar från slutet av 1980-talet ledde till fredsavtalet för Chittagong Hill Tracts den 2 december 1997, enligt vilket Shanti Bahini lade ned vapnen. Uppskattningarna av antalet döda går upp till omkring 30 000.
