# Svenska översättningar av katalogtexten (våg 8); stegtexterna kommer senare.
Chola expedition to the Ganges: Cholarikets expedition till Ganges
? The northern campaign of the Chola emperor Rajendra I, about 1019–1021, which took a Chola army through Kalinga and Odisha to Bengal and the Ganges. It grew out of a disputed succession in Vengi, where Rajendra backed his nephew Rajaraja Narendra against a rival supported by the kings of Kalinga and Odisha. While Rajendra waited on the Godavari, his general Araiyan Rajarajan led the army north, defeating the Somavamshi king Indraratha in Odisha, Dharmapala of Dandabhukti, Ranasura of southern Radha, Govindachandra of Vangala in eastern Bengal and the Pala king Mahipala I, and brought back water from the Ganges. The campaign won no lasting territory in the north, but Rajendra took the title Gangaikonda, “who took the Ganges”, built a new capital, Gangaikonda Cholapuram, and made a great tank there, the Cholagangam, which his inscriptions call a liquid pillar of victory. Some historians once read the expedition as a pilgrimage; the Chola records describe it as a war. It is known almost only from Chola inscriptions, above all the Tiruvalangadu copper plates.
: Cholakejsaren Rajendra I:s fälttåg mot norr, omkring 1019–1021, som förde en cholaarmé genom Kalinga och Odisha till Bengalen och Ganges. Det växte fram ur en omstridd tronföljd i Vengi, där Rajendra stödde sin systerson Rajaraja Narendra mot en rival som understöddes av kungarna av Kalinga och Odisha. Medan Rajendra väntade vid Godavari ledde hans general Araiyan Rajarajan armén norrut; han besegrade somavamshikungen Indraratha i Odisha, Dharmapala av Dandabhukti, Ranasura av södra Radha, Govindachandra av Vangala i östra Bengalen och palakungen Mahipala I och förde tillbaka vatten från Ganges. Fälttåget gav inga bestående landvinningar i norr, men Rajendra antog titeln Gangaikonda, ”som intog Ganges”, byggde en ny huvudstad, Gangaikonda Cholapuram, och anlade där en stor bevattningsdamm, Cholagangam, som hans inskrifter kallar en flytande segerpelare. Somliga historiker tolkade en gång expeditionen som en pilgrimsfärd; cholarikets egna källor beskriver den som ett krig. Den är känd nästan enbart genom cholainskrifter, framför allt kopparplåtarna från Tiruvalangadu.
