Chola conquest of Anuradhapura: Cholarikets erövring av Anuradhapura
The conquest of northern Sri Lanka by the Chola Empire of southern India. In 993 the army of Rajaraja I crossed the Palk Strait while the Sinhalese king Mahinda V was struggling with a mutiny of his mercenaries, and sacked Anuradhapura, the island’s capital for more than a thousand years. The north became a Chola province governed from Polonnaruwa. In 1017 Rajaraja’s son Rajendra I invaded Ruhuna in the south-east, captured Mahinda V with his queen, his crown and his treasure, and took him to India, where he died in 1029. Anuradhapura was never a capital again, and the Cholas held the north until Vijayabahu I drove them out in 1070.: Det sydindiska cholarikets erövring av norra Sri Lanka. År 993 gick Rajaraja I:s armé över Palksundet medan den singalesiske kungen Mahinda V kämpade med ett myteri bland sina legosoldater, och den plundrade Anuradhapura, öns huvudstad i mer än tusen år. Den norra delen av ön blev en cholaprovins som styrdes från Polonnaruwa. År 1017 invaderade Rajarajas son Rajendra I Ruhuna i sydost, tillfångatog Mahinda V med hans drottning, hans krona och hans skatt och förde honom till Indien, där han dog 1029. Anuradhapura blev aldrig mer huvudstad, och cholariket behöll norra delen av ön tills Vijayabahu I drev ut cholastyrkorna 1070.
