Chola invasion of Srivijaya: Cholarikets invasion av Srivijaya
The overseas expedition of the Chola emperor Rajendra I against Srivijaya, the maritime power of Sumatra and the Malay Peninsula that controlled the Strait of Malacca. In 1025 a Chola fleet crossed the Bay of Bengal and attacked Srivijaya’s ports, from Kadaram (Kedah) in the north to the capital at Palembang in the south; the king, Sangrama Vijayottungavarman, was taken prisoner. The raid brought plunder and fame rather than lasting conquest, but it weakened Srivijaya, and Chola influence in the straits lasted for decades.: Cholakejsaren Rajendra I:s expedition över havet mot Srivijaya, sjömakten på Sumatra och Malackahalvön som kontrollerade Malackasundet. År 1025 korsade en cholaflotta Bengaliska viken och angrep Srivijayas hamnar, från Kadaram (Kedah) i norr till huvudstaden Palembang i söder; kungen, Sangrama Vijayottungavarman, togs till fånga. Räden gav byte och berömmelse snarare än varaktiga erövringar, men den försvagade Srivijaya, och cholarikets inflytande i sunden bestod i årtionden.
