# Svenska översättningar av katalogtexten (våg 8); stegtexterna kommer senare.
Chola–Western Chalukya wars: Krigen mellan cholariket och västra chalukyadynastin
The wars of more than a century between the Chola Empire of the Tamil country and the Western Chalukyas of Kalyani in the Deccan. They fought over the rich lands of the Raichur Doab between the Krishna and the Tungabhadra, over Gangavadi in southern Karnataka, and above all over Vengi, the Eastern Chalukya kingdom in the Godavari and Krishna deltas. Chola armies sacked the Chalukya capitals Manyakheta (1007) and Kalyani (about 1045), and Chola kings won great battles at Koppam (1054), where the emperor Rajadhiraja I was killed, and at Kudal-Sangamam (about 1062). The Chalukyas held their ground in the Deccan, and under Vikramaditya VI took Vengi in about 1118. Neither side won lasting control, and the long war wore both empires down.: De mer än hundraåriga krigen mellan cholariket i tamilernas land och västra chalukyadynastin i Kalyani i Deckan. De stred om de rika länderna i Raichurdoaben mellan Krishna och Tungabhadra, om Gangavadi i södra Karnataka och framför allt om Vengi, östra chalukyadynastins rike i Godavaris och Krishnas deltan. Cholaarméer plundrade chalukyadynastins huvudstäder Manyakheta (1007) och Kalyani (omkring 1045), och cholakungar vann stora slag vid Koppam (1054), där kejsaren Rajadhiraja I stupade, och vid Kudal-Sangamam (omkring 1062). Västra chalukyadynastin höll stånd i Deckan och intog under Vikramaditya VI Vengi omkring 1118. Ingen av sidorna vann varaktig kontroll, och det långa kriget nötte ned båda rikena.
