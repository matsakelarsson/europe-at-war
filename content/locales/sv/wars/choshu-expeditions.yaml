# Svenska översättningar av katalogtexten (våg 10); stegtexterna kommer senare.
Kinmon incident and the Chōshū expeditions: Kinmonincidenten och Chōshūexpeditionerna
? The armed struggle between the Tokugawa shogunate and the Chōshū domain in western Honshu that broke the shogunate’s authority. Chōshū, led by radical samurai of the “revere the emperor, expel the barbarians” movement, had dominated the imperial court in Kyoto until a coup by Aizu and Satsuma drove its men out in September 1863. On 20 August 1864 about 3,000 Chōshū troops and allied rōnin tried to retake Kyoto by force and were beaten at the gates of the imperial palace by Aizu, Satsuma and other domains; fire destroyed some 28,000 houses in the city. Branded an enemy of the court, Chōshū faced a shogunate army in the First Chōshū expedition, but through the mediation of Satsuma’s Saigō Takamori it submitted without a battle, putting three of its elders to death, and the army withdrew in January 1865. Within weeks Takasugi Shinsaku and his volunteer militias seized power in Chōshū, rearmed it with Western rifles and in March 1866 made a secret alliance with Satsuma. In the Second Chōshū expedition, which Chōshū calls the War on Four Borders, fighting began in July 1866. Chōshū’s modernised army of perhaps 3,500–4,000 men held off a much larger but poorly coordinated shogunate force on the island of Ōshima, on the Hiroshima border, in Iwami, where it took Hamada Castle, and across the strait at Kokura, whose garrison burned its castle and withdrew. The shogun Tokugawa Iemochi died in Osaka on 29 August, and his successor Tokugawa Yoshinobu agreed to a ceasefire in October. The shogunate’s failure to defeat a single domain showed the country that it could be overthrown, as it was in the Boshin War of 1868.
: Den väpnade kampen mellan Tokugawashogunatet och Chōshūdomänen i västra Honshu, som bröt shogunatets auktoritet. Chōshū, som leddes av radikala samurajer ur rörelsen ”vörda kejsaren, fördriv barbarerna”, hade dominerat kejsarhovet i Kyoto tills en kupp av Aizu och Satsuma drev ut dess män i september 1863. Den 20 augusti 1864 försökte omkring 3 000 soldater från Chōshū och allierade rōnin återta Kyoto med våld och slogs tillbaka vid portarna till det kejserliga palatset av Aizu, Satsuma och andra domäner; en brand förstörde omkring 28 000 hus i staden. Chōshū, som stämplats som hovets fiende, ställdes mot en shogunatsarmé i den första Chōshūexpeditionen, men genom medling av Satsumas Saigō Takamori underkastade sig domänen utan strid och lät avrätta tre av sina äldste, och armén drog sig tillbaka i januari 1865. Inom några veckor tog Takasugi Shinsaku och hans frivilliga miliser makten i Chōshū, beväpnade domänen på nytt med västerländska gevär och slöt i mars 1866 en hemlig allians med Satsuma. I den andra Chōshūexpeditionen, som i Chōshū kallas kriget vid de fyra gränserna, inleddes striderna i juli 1866. Chōshūs moderniserade armé på kanske 3 500–4 000 man höll stånd mot en mycket större men dåligt samordnad shogunatsstyrka på ön Ōshima, vid gränsen mot Hiroshima, i Iwami, där den intog Hamadaborgen, och på andra sidan sundet vid Kokura, vars garnison brände sin borg och drog sig tillbaka. Shogunen Tokugawa Iemochi dog i Osaka den 29 augusti, och hans efterträdare Tokugawa Yoshinobu gick med på vapenvila i oktober. Att shogunatet inte förmådde besegra en enda domän visade landet att det kunde störtas, vilket också skedde i Boshinkriget 1868.
