The main English source is the Anglo-Saxon Chronicle; the Encomium Emmae Reginae, written for Cnut’s queen, gives a Danish-friendly account.: Den främsta engelska källan är Anglosaxiska krönikan; Encomium Emmae Reginae, skriven för Knuts drottning, ger en danskvänlig skildring.
The site of the Battle of Assandun is disputed. It is shown at Ashingdon in south-east Essex, the traditional identification; some historians prefer Ashdon in the north of the county.: Platsen för slaget vid Assandun är omstridd. Den visas vid Ashingdon i sydöstra Essex, den traditionella identifieringen; vissa historiker föredrar Ashdon i grevskapets norra del.
