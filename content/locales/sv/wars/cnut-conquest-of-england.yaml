For more than twenty years Viking armies had raided England and been paid ever larger sums of silver, the Danegeld, to leave. In 1002 King Æthelred ordered the killing of the Danes living in England, the St Brice’s Day massacre. Between 1009 and 1012 the army of Thorkell the Tall ravaged the south-east, took Canterbury and killed its archbishop, before Thorkell changed sides and entered Æthelred’s service.: I mer än tjugo år hade vikingahärar härjat i England och fått allt större summor silver, danagäldet, för att dra bort. År 1002 beordrade kung Ethelred att de danskar som bodde i England skulle dödas, massakern på Sankt Britius dag. Mellan 1009 och 1012 härjade Torkel den höges här i sydöstra England, intog Canterbury och dödade dess ärkebiskop, innan Torkel bytte sida och gick i Ethelreds tjänst.
In August 1013 the Danish king, Sweyn Forkbeard, came with his son Cnut to conquer the country. He sailed up the Humber and the Trent to Gainsborough, where Northumbria, Lindsey and the Danish towns of the east Midlands submitted at once. Marching south, he took Oxford and Winchester. London, held by Æthelred and Thorkell, beat off his attack, but after the western thegns submitted at Bath, the Londoners gave in too. Æthelred fled to Normandy, and Sweyn was accepted as king. He died at Gainsborough on 3 February 1014.: I augusti 1013 kom den danske kungen Sven Tveskägg med sin son Knut för att erövra landet. Han seglade uppför Humber och Trent till Gainsborough, där Northumbria, Lindsey och de danska städerna i östra Midlands genast underkastade sig. På marschen söderut intog han Oxford och Winchester. London, som hölls av Ethelred och Torkel, slog tillbaka hans anfall, men sedan tegnerna i väster underkastat sig i Bath gav även Londonborna upp. Ethelred flydde till Normandie, och Sven erkändes som kung. Han dog i Gainsborough den 3 februari 1014.
