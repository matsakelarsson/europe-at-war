The Danish army chose Cnut as its king, but the English recalled Æthelred and drove him out. Cnut sailed for Denmark, leaving the mutilated hostages his father had taken on the beach at Sandwich. He returned in September 1015 with a great fleet and harried Dorset, Wiltshire and Somerset. Ealdorman Eadric Streona went over to him, and Wessex submitted. When Æthelred died in April 1016, the Londoners chose his son Edmund Ironside as king, while the leading men gathered at Southampton chose Cnut.: Den danska hären valde Knut till sin kung, men engelsmännen kallade tillbaka Ethelred och drev ut honom. Knut seglade till Danmark och lämnade de stympade gisslanfångar som hans far hade tagit kvar på stranden vid Sandwich. Han återvände i september 1015 med en stor flotta och härjade Dorset, Wiltshire och Somerset. Ealdorman Eadric Streona gick över till honom, och Wessex underkastade sig. När Ethelred dog i april 1016 valde Londonborna hans son Edmund Järnsida till kung, medan stormännen som samlats i Southampton valde Knut.
Edmund fought hard all summer. He fought the Danes at Penselwood and Sherston, relieved the siege of London and won at Brentford and Otford. But on 18 October 1016, at Assandun in Essex, Eadric withdrew his men in the middle of the battle and the English were routed. At Alney, an island near Deerhurst, the kings agreed that Edmund would keep Wessex and Cnut take the lands north of the Thames. Edmund died on 30 November, and Cnut became king of all England.: Edmund kämpade hårt hela sommaren. Han stred mot danskarna vid Penselwood och Sherston, hävde belägringen av London och segrade vid Brentford och Otford. Men den 18 oktober 1016, vid Assandun i Essex, drog Eadric tillbaka sina män mitt under slaget och engelsmännen slogs på flykten. Vid Alney, en ö nära Deerhurst, kom kungarna överens om att Edmund skulle behålla Wessex och Knut ta landet norr om Themsen. Edmund dog den 30 november, och Knut blev kung över hela England.
Cnut married Æthelred’s widow, Emma of Normandy, and in 1018 raised a vast tax of £72,000, plus £10,500 from London, to pay off his fleet. He became king of Denmark after his brother Harald, beat the Norwegians and Swedes at the Helgeå, probably in 1026, and in 1028 drove Olaf Haraldsson out of Norway. When he died at Shaftesbury in 1035, his North Sea empire soon fell apart.: Knut gifte sig med Ethelreds änka, Emma av Normandie, och tog 1018 ut en väldig skatt på 72 000 pund, plus 10 500 pund från London, för att avlöna och avskeda sin flotta. Han blev kung av Danmark efter sin bror Harald, besegrade norrmännen och svenskarna vid Helgeå, troligen 1026, och drev 1028 ut Olav Haraldsson ur Norge. När han dog i Shaftesbury 1035 föll hans Nordsjövälde snart sönder.
