Danish conquest of England: Danska erövringen av England
The conquest of England by the Danish king Sweyn Forkbeard in 1013 and, after his death, by his son Cnut in 1015–1016. Cnut’s victory at Assandun made him king of England, and later of Denmark and Norway, ruling a North Sea empire until 1035.: Den danske kungen Sven Tveskäggs erövring av England 1013 och, efter hans död, sonen Knuts erövring 1015–1016. Knuts seger vid Assandun gjorde honom till kung av England och senare av Danmark och Norge, och han styrde ett Nordsjövälde fram till 1035.
