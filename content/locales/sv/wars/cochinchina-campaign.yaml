# Svenska översättningar av katalogtexten (våg 11); stegtexterna kommer senare.
Cochinchina campaign: Cochinkinafälttåget
? The war in which France, with Spanish help, took the southern provinces of Nguyễn Vietnam (Đại Nam) and founded the colony of Cochinchina. Napoleon III sent a French fleet under Admiral Rigault de Genouilly, citing the persecution of Catholic missionaries; Spain, whose bishop José María Díaz Sanjurjo had been executed in 1857, sent troops from the Philippines. The allies landed at Tourane (Đà Nẵng) in September 1858 but were held there by Nguyễn Tri Phương’s siege lines and by cholera, and turned south to take Saigon in February 1859. The small garrison of Saigon was itself besieged until Admiral Charner broke the Vietnamese lines at Kỳ Hòa in February 1861. Mỹ Tho, Biên Hòa and Vĩnh Long followed, and by the Treaty of Saigon (5 June 1862) Emperor Tự Đức ceded the provinces of Biên Hòa, Gia Định and Định Tường and the island of Poulo Condore, allowed Catholic worship and agreed to pay an indemnity. Local leaders such as Trương Định and Nguyễn Trung Trực fought on against the French, and in June 1867 Admiral de La Grandière took the three western provinces as well, completing French Cochinchina.
: Kriget där Frankrike med spansk hjälp tog de sydliga provinserna i Nguyễndynastins Vietnam (Đại Nam) och grundade kolonin Cochinkina. Napoleon III sände en fransk flotta under amiral Rigault de Genouilly med hänvisning till förföljelsen av katolska missionärer; Spanien, vars biskop José María Díaz Sanjurjo hade avrättats 1857, sände trupper från Filippinerna. De allierade landsteg vid Tourane (Đà Nẵng) i september 1858 men hölls fast där av Nguyễn Tri Phươngs belägringslinjer och av kolera, och de vände söderut och intog Saigon i februari 1859. Den lilla garnisonen i Saigon belägrades i sin tur tills amiral Charner bröt igenom de vietnamesiska linjerna vid Kỳ Hòa i februari 1861. Mỹ Tho, Biên Hòa och Vĩnh Long följde, och genom fördraget i Saigon (5 juni 1862) avträdde kejsar Tự Đức provinserna Biên Hòa, Gia Định och Định Tường och ön Poulo Condore, tillät katolsk gudstjänst och gick med på att betala ett skadestånd. Lokala ledare som Trương Định och Nguyễn Trung Trực fortsatte kampen mot fransmännen, och i juni 1867 tog amiral de La Grandière även de tre västra provinserna, och därmed var Franska Cochinkina fullbordat.
