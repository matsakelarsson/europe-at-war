# Svenska översättningar av katalogtexten (våg 11); stegtexterna kommer senare.
Cofradía revolt (Hermano Pule): Cofradíaupproret (Hermano Pule)
? A religious brotherhood’s rising in Tayabas (now Quezon), crushed by Spanish troops in 1841. Apolinario de la Cruz, known as Hermano Pule, was born in Lucban in 1815 and was refused entry into the Dominican order in 1829 because he was an indio, a native Filipino. In December 1832 he founded the Cofradía de San José, a lay brotherhood open only to native Filipinos, which grew to some 4,500 to 5,000 members in Tayabas, Laguna and Batangas. The church and the colonial government refused to recognise it, saw it as a threat, and on 19 October 1840 raided a meeting and arrested 243 members; in July 1841 the governor-general outlawed it. Pule and about 4,000 followers gathered at Isabang, on the slopes of Mount San Cristóbal near Tayabas, and later moved to Alitao. On 23 October 1841 an attack led by the alcalde mayor of Tayabas, Joaquín Ortega, was beaten off and Ortega was killed. On 1 November Colonel Joaquín Huet attacked the camp at Alitao with 800 to 1,000 soldiers; in about four hours of fighting some 300 to 500 members of the brotherhood were killed and about 500 were taken prisoner. Pule was caught the next evening near Sariaya, tried summarily and shot at Tayabas on 4 November 1841, aged 26; his body was quartered and displayed. Spain’s Supreme Court later reprimanded Governor-General Marcelino de Oraá, and on 20 January 1843 soldiers of the Tayabas regiment, many of whom had relatives among the dead, rose in Manila under Sergeant Irineo Samaniego and seized Fort Santiago; they were overcome, and the survivors were executed at Bagumbayan two days later. Survivors of the brotherhood kept its devotions alive in the villages around Mount Banahaw.
: Ett religiöst brödraskaps resning i Tayabas (nu Quezon), som slogs ned av spanska trupper 1841. Apolinario de la Cruz, känd som Hermano Pule, föddes i Lucban 1815 och nekades 1829 inträde i dominikanorden eftersom han var indio, en infödd filippinier. I december 1832 grundade han Cofradía de San José, ett lekmannabrödraskap som bara var öppet för infödda filippinier och som växte till omkring 4 500 till 5 000 medlemmar i Tayabas, Laguna och Batangas. Kyrkan och kolonialregeringen vägrade erkänna det och såg det som ett hot; den 19 oktober 1840 slog de till mot ett möte och grep 243 medlemmar, och i juli 1841 förbjöd generalguvernören brödraskapet. Pule och omkring 4 000 anhängare samlades i Isabang, på sluttningarna av berget San Cristóbal nära Tayabas, och flyttade senare till Alitao. Den 23 oktober 1841 slogs ett anfall under ledning av Tayabas alcalde mayor, Joaquín Ortega, tillbaka, och Ortega dödades. Den 1 november anföll överste Joaquín Huet lägret i Alitao med 800 till 1 000 soldater; under omkring fyra timmars strid dödades omkring 300 till 500 av brödraskapets medlemmar och omkring 500 togs till fånga. Pule greps följande kväll nära Sariaya, dömdes summariskt och arkebuserades i Tayabas den 4 november 1841, 26 år gammal; hans kropp styckades och ställdes ut. Spaniens högsta domstol tillrättavisade senare generalguvernören Marcelino de Oraá, och den 20 januari 1843 gjorde soldater ur Tayabasregementet, av vilka många hade släktingar bland de döda, uppror i Manila under sergeant Irineo Samaniego och intog Fort Santiago; de övermannades, och de överlevande avrättades i Bagumbayan två dagar senare. Överlevande medlemmar av brödraskapet höll dess andaktsliv vid liv i byarna runt berget Banahaw.
