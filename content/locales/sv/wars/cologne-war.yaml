Cologne War: Kölnska kriget
? A war over the Electorate of Cologne, set off when the Archbishop-Elector Gebhard Truchsess von Waldburg became a Protestant in December 1582, married Agnes von Mansfeld in February 1583 and tried to turn the archbishopric into a secular principality, against the ecclesiastical reservation of the Peace of Augsburg. The pope deposed him, and in May 1583 the cathedral chapter elected Ernest of Bavaria in his place. Gebhard was backed by John Casimir of the Palatinate and by Dutch and English help, Ernest by his brother Ferdinand’s Bavarian troops, the pope and, from 1586, the Spanish army of the Netherlands under the Duke of Parma. The Bavarians stormed and blew up Godesberg castle in late 1583 after sappers mined its walls, and in July 1586 Parma took and sacked Neuss. In 1588 Gebhard gave up and withdrew to Strasbourg, though his captains Adolf von Neuenahr and Martin Schenck fought on until they were killed in 1589. The war devastated the electorate and left it in Wittelsbach hands until 1761, strengthening the Catholic cause in north-west Germany.
: Ett krig om kurfurstendömet Köln, utlöst när ärkebiskopen och kurfursten Gebhard Truchsess von Waldburg blev protestant i december 1582, gifte sig med Agnes von Mansfeld i februari 1583 och försökte göra ärkestiftet till ett världsligt furstendöme, i strid med det andliga förbehållet i augsburgska religionsfreden. Påven avsatte honom, och i maj 1583 valde domkapitlet Ernst av Bayern i hans ställe. Gebhard fick stöd av Johan Kasimir av Pfalz och hjälp från Nederländerna och England, Ernst av broderns Ferdinands bayerska trupper, påven och från 1586 Spaniens armé i Nederländerna under hertigen av Parma. Bayrarna stormade och sprängde borgen Godesberg i slutet av 1583 sedan minörer undergrävt dess murar, och i juli 1586 intog och plundrade Parma Neuss. År 1588 gav Gebhard upp och drog sig tillbaka till Strassburg, men hans kaptener Adolf von Neuenahr och Martin Schenck stred vidare tills de dödades 1589. Kriget ödelade kurfurstendömet och lämnade det i huset Wittelsbachs händer fram till 1761, vilket stärkte den katolska saken i nordvästra Tyskland.
