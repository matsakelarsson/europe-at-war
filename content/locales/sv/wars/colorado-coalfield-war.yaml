# Svenska översättningar av katalogtexten (våg 14); stegtexterna kommer senare.
Colorado Coalfield War: Kolfältskriget i Colorado
? "A strike that became an armed conflict in the southern Colorado coalfields of Huerfano and Las Animas counties. On 23 September 1913 some 10,000–12,000 coal miners, most of them immigrants from Italy, Greece, the Balkans and Mexico, struck the Colorado Fuel and Iron Company, owned largely by John D. Rockefeller Jr., and the smaller Rocky Mountain Fuel and Victor-American companies. Led by the United Mine Workers of America, they demanded recognition of the union, higher pay, an eight-hour day, the enforcement of Colorado’s mine-safety laws and the right to live and shop outside the company towns. Evicted from company housing, they and their families moved into tent colonies, the largest at Ludlow with about 1,200 people. The companies hired guards from the Baldwin–Felts Detective Agency, who patrolled in an armoured car, and from 28 October the Colorado National Guard was deployed. On 20 April 1914 Guardsmen and company guards attacked the Ludlow colony with machine guns and burned it: about twenty people died, among them the Greek strike leader Louis Tikas, shot while in the Guard’s custody, and two women and eleven children who suffocated in a pit dug under a burning tent. In the “Ten Days’ War” that followed, armed strikers attacked mines, company towns and guards along a front of some 360 km, from Trinidad in the south to Louisville north of Denver, until President Woodrow Wilson sent federal troops, who arrived at the end of April and disarmed both sides. Estimates of the dead in the whole conflict range from 69 to 199. The union ran out of money and ended the strike on 10 December 1914 without winning recognition; Rockefeller answered with a company-run employee representation plan. Ludlow became a symbol of the labour movement and is a National Historic Landmark."
: "En strejk som blev en väpnad konflikt på kolfälten i södra Colorado, i Huerfano County och Las Animas County. Den 23 september 1913 gick omkring 10 000–12 000 kolgruvarbetare, de flesta av dem invandrare från Italien, Grekland, Balkan och Mexiko, ut i strejk mot Colorado Fuel and Iron Company, som till stor del ägdes av John D. Rockefeller Jr., och mot de mindre bolagen Rocky Mountain Fuel och Victor-American. Under ledning av United Mine Workers of America krävde de erkännande av fackföreningen, högre lön, åtta timmars arbetsdag, efterlevnad av Colorados lagar om gruvsäkerhet och rätt att bo och handla utanför bolagsstäderna. Vräkta från bolagens bostäder flyttade de och deras familjer in i tältkolonier, den största i Ludlow med omkring 1 200 människor. Bolagen anställde vakter från detektivbyrån Baldwin–Felts, som patrullerade i en pansarbil, och från den 28 oktober sattes Colorados nationalgarde in. Den 20 april 1914 anföll nationalgardister och bolagsvakter kolonin i Ludlow med kulsprutor och brände ned den: omkring tjugo människor dog, bland dem den grekiske strejkledaren Louis Tikas, som sköts medan han var i gardets förvar, och två kvinnor och elva barn som kvävdes i en grop som grävts under ett brinnande tält. Under det ”tiodagarskrig” som följde anföll beväpnade strejkande gruvor, bolagsstäder och vakter längs en front på omkring 360 km, från Trinidad i söder till Louisville norr om Denver, tills president Woodrow Wilson sände federala trupper, som anlände i slutet av april och avväpnade båda sidor. Uppskattningarna av antalet döda i hela konflikten varierar från 69 till 199. Fackföreningen fick slut på pengar och avbröt strejken den 10 december 1914 utan att ha vunnit erkännande; Rockefeller svarade med en bolagsstyrd plan för personalrepresentation. Ludlow blev en symbol för arbetarrörelsen och är ett National Historic Landmark."
