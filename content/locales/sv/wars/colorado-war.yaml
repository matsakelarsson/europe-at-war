# Svenska översättningar av katalogtexten (våg 14); stegtexterna kommer senare.
Colorado War: Coloradokriget
? The war of 1864–1865 on the central plains between the Southern Cheyenne, the Arapaho and their Lakota allies and the United States, Colorado’s volunteers and settlers, remembered above all for the Sand Creek massacre. The Pikes Peak gold rush of 1858–1859 brought tens of thousands of migrants onto the lands that the Treaty of Fort Laramie (1851) had recognised as Cheyenne and Arapaho, and by the Treaty of Fort Wise (1861) a few chiefs gave up most of it for a small reserve on the Arkansas, which many Cheyenne, above all the Dog Soldiers, rejected. In the spring of 1864 Colorado troops attacked Cheyenne camps, and that summer Cheyenne, Arapaho, Lakota, Kiowa and Comanche raids closed the roads to Denver. In September, after the Camp Weld council, the peace chiefs Black Kettle and Left Hand camped on Sand Creek near Fort Lyon, believing they were under the army’s protection. On 29 November 1864 Colonel John Chivington’s Colorado volunteers attacked the camp and killed between about 150 and 230 people by most estimates, most of them women, children and old men (the estimates range from about 70 to more than 600), and mutilated the dead. Congress and the army condemned the attack. The Cheyenne, Arapaho and Lakota answered by sacking Julesburg and raiding the Platte road in early 1865 before moving north to the Powder River, where General Patrick Connor’s expedition failed to defeat them. In October 1865 the southern chiefs signed the Treaty of the Little Arkansas, which promised reparations for Sand Creek that were never paid.
: Kriget 1864–1865 på de centrala prärierna mellan sydcheyenner, arapaho och deras lakotaallierade å ena sidan och USA, Colorados frivilliga och nybyggare å den andra, ihågkommet framför allt för massakern vid Sand Creek. Guldrushen vid Pikes Peak 1858–1859 förde tiotusentals inflyttare till de landområden som fördraget i Fort Laramie (1851) hade erkänt som cheyennernas och arapahos, och genom fördraget i Fort Wise (1861) gav några hövdingar upp större delen av dem i utbyte mot ett litet reservat vid Arkansasfloden, vilket många cheyenner, framför allt hundsoldaterna (Dog Soldiers), förkastade. Våren 1864 anföll trupper från Colorado cheyenneläger, och den sommaren stängde räder av cheyenner, arapaho, lakota, kiowa och komancher vägarna till Denver. I september, efter rådsmötet i Camp Weld, slog fredshövdingarna Black Kettle och Left Hand läger vid Sand Creek nära Fort Lyon i tron att de stod under arméns beskydd. Den 29 november 1864 anföll överste John Chivingtons frivilliga från Colorado lägret och dödade enligt de flesta uppskattningar mellan omkring 150 och 230 människor, de flesta av dem kvinnor, barn och gamla män (uppskattningarna varierar från omkring 70 till mer än 600), och lemlästade de döda. Kongressen och armén fördömde anfallet. Cheyenner, arapaho och lakota svarade med att plundra Julesburg och göra räder längs Platteleden i början av 1865, innan de drog norrut till Powder River, där general Patrick Connors expedition misslyckades med att besegra dem. I oktober 1865 undertecknade de södra hövdingarna fördraget vid Little Arkansas, som utlovade skadestånd för Sand Creek som aldrig betalades.
