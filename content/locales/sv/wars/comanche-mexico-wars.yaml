# Svenska översättningar av katalogtexten (våg 14); stegtexterna kommer senare.
Comanche–Mexico Wars: Krigen mellan komancherna och Mexiko
? The long war of raids that the Comanche, with their Kiowa and Plains Apache (Kiowa Apache) allies, carried hundreds of kilometres into northern Mexico between Mexican independence and about 1870. Spain had made peace with the Comanche in 1785–1786 and kept it with trade and gifts, which independent Mexico could not afford. From the 1830s, when peace with the United States, the eastern nations and the Cheyenne and Arapaho secured their other borders, Comanche bands gathered each summer on the Red River and its tributaries and rode south in autumn, under what Texans called the Comanche Moon, in war parties of 200 to 800 men. They crossed the Rio Grande near the Big Bend, wintered with their families in the Bolsón de Mapimí and raided Chihuahua, Coahuila, Nuevo León, Durango, Tamaulipas and as far as Zacatecas, San Luis Potosí, Jalisco and Querétaro, taking horses and mules for markets in New Mexico and the United States and captives who were ransomed or brought into Comanche families. A careful but incomplete count by the historian Brian DeLay finds 44 raids of more than 100 men from 1831 to 1848, which killed 2,649 Mexicans and carried off 852 captives and more than 100,000 animals; at least 702 Comanche were killed. Mexican states answered with militias, presidios and bounties for scalps, and accused Texas and the United States of buying the stolen herds and selling the raiders guns. The devastation of the north weakened Mexico against the American invasion of 1846, and in the Treaty of Guadalupe Hidalgo (1848) the United States undertook to stop the raids, an obligation it did not meet and was released from in the Gadsden Purchase of 1853. Cholera in 1849, the decline of the bison and American settlement and campaigns in Texas reduced the raids from the mid-1850s, and the last known Comanche raid into Mexico took place in 1870.
: Det långa räderkrig som komancherna, tillsammans med sina allierade kiowa och prärieapacher (kiowa-apacher), förde hundratals kilometer in i norra Mexiko mellan Mexikos självständighet och omkring 1870. Spanien hade slutit fred med komancherna 1785–1786 och upprätthållit den med handel och gåvor, något som det självständiga Mexiko inte hade råd med. Från 1830-talet, när fred med USA, de östliga nationerna samt cheyenner och arapaho tryggade deras övriga gränser, samlades komanchgrupper varje sommar vid Red River och dess bifloder och red söderut på hösten, under det som texanerna kallade Comanche Moon (komanchmånen), i krigarskaror på 200 till 800 man. De gick över Rio Grande nära Big Bend, övervintrade med sina familjer i Bolsón de Mapimí och plundrade Chihuahua, Coahuila, Nuevo León, Durango, Tamaulipas och ända till Zacatecas, San Luis Potosí, Jalisco och Querétaro, och tog hästar och mulor till marknaderna i New Mexico och USA samt fångar som löstes ut eller togs upp i komanchfamiljer. En noggrann men ofullständig sammanställning av historikern Brian DeLay finner 44 räder med mer än 100 man mellan 1831 och 1848, som dödade 2 649 mexikaner och förde bort 852 fångar och mer än 100 000 djur; minst 702 komancher dödades. De mexikanska delstaterna svarade med miliser, presidios och skottpengar för skalper och anklagade Texas och USA för att köpa de stulna hjordarna och sälja vapen till angriparna. Ödeläggelsen i norr försvagade Mexiko inför den amerikanska invasionen 1846, och i fördraget i Guadalupe Hidalgo (1848) åtog sig USA att stoppa räderna, en förpliktelse som landet inte uppfyllde och som det befriades från genom Gadsdenköpet 1853. Kolera 1849, bisonens tillbakagång samt amerikansk bosättning och amerikanska fälttåg i Texas minskade räderna från mitten av 1850-talet, och den sista kända komanchräden in i Mexiko ägde rum 1870.
