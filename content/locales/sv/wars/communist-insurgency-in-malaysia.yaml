# Svenska översättningar av katalogtexten (våg 11); stegtexterna kommer senare.
Communist insurgency in Malaysia: Den kommunistiska upprorsrörelsen i Malaysia
? "The second armed struggle of the Malayan Communist Party (MCP), sometimes called the Second Malayan Emergency. After its defeat in the Malayan Emergency (1948–1960), the party’s army, the Malayan National Liberation Army, withdrew under Chin Peng to the jungle on the Thai side of the border, around Betong and Sadao. Encouraged by China, it resumed the war on 17 June 1968 with an ambush at Kroh–Betong that killed 17 members of the Malaysian security forces. It recruited among Chinese youth after the race riots of May 1969, broadcast from a radio station in southern China, and carried out ambushes along the border and bombings and assassinations in the towns: Inspector-General of Police Abdul Rahman Hashim was shot dead in Kuala Lumpur on 7 June 1974, and the National Monument was bombed on 26 August 1975. Purges of suspected government agents in 1970 split the party into three rival factions. Malaysia never declared a new emergency; it relied on its security and development programme (KESBAN), village guards, a special forces unit (VAT 69) and, from 1977, joint operations with Thailand. China’s support faded after it established relations with Malaysia in 1974. Talks mediated by Thailand ended the war: in two agreements signed at Hat Yai on 2 December 1989, the MCP agreed to end its armed struggle and disband its army, then about 1,200 strong. Figures commonly given are about 155 members of the security forces killed and 854 wounded, and some 212 guerrillas killed. Chin Peng was not allowed to return to Malaysia and died in Bangkok in 2013."
: "Malayas kommunistpartis (MCP) andra väpnade kamp, ibland kallad det andra undantagstillståndet i Malaya. Efter nederlaget i undantagstillståndet i Malaya (1948–1960) drog sig partiets armé, Malayas nationella befrielsearmé, under Chin Peng tillbaka till djungeln på den thailändska sidan av gränsen, kring Betong och Sadao. Uppmuntrad av Kina återupptog den kriget den 17 juni 1968 med ett bakhåll vid Kroh–Betong som dödade 17 medlemmar av de malaysiska säkerhetsstyrkorna. Den rekryterade bland kinesiska ungdomar efter rasupploppen i maj 1969, sände från en radiostation i södra Kina och genomförde bakhåll längs gränsen och bombdåd och mord i städerna: rikspolischefen Abdul Rahman Hashim sköts ihjäl i Kuala Lumpur den 7 juni 1974, och Nationalmonumentet utsattes för ett bombdåd den 26 augusti 1975. Utrensningar av misstänkta regeringsagenter 1970 splittrade partiet i tre rivaliserande fraktioner. Malaysia utlyste aldrig något nytt undantagstillstånd; landet förlitade sig på sitt säkerhets- och utvecklingsprogram (KESBAN), byvakter, ett specialförband (VAT 69) och, från 1977, gemensamma operationer med Thailand. Kinas stöd avtog efter att landet hade upprättat förbindelser med Malaysia 1974. Samtal med Thailand som medlare avslutade kriget: i två avtal som undertecknades i Hat Yai den 2 december 1989 gick MCP med på att avsluta sin väpnade kamp och upplösa sin armé, som då var omkring 1 200 man stark. Siffror som ofta anges är omkring 155 dödade och 854 sårade inom säkerhetsstyrkorna och omkring 212 dödade gerillasoldater. Chin Peng fick inte återvända till Malaysia och dog i Bangkok 2013."
