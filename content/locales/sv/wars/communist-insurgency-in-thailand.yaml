# Svenska översättningar av katalogtexten (våg 11); stegtexterna kommer senare.
Communist insurgency in Thailand: Den kommunistiska upprorsrörelsen i Thailand
? "The guerrilla war of the Communist Party of Thailand (CPT) against the Thai state. The party, founded in 1942 and banned under anti-communist laws, followed Mao Zedong’s line, broadcast from China and trained its cadres in China, North Vietnam and Laos. It dates its armed struggle from a clash with police at Na Bua in Nakhon Phanom province on 7 August 1965, “the day the guns spoke”. The war was fought above all in the poor north-east (Isan), in the northern hills among the Hmong and other highland peoples, around Phu Hin Rong Kla on the borders of Phitsanulok, Loei and Phetchabun, and in the south around Phatthalung and Surat Thani. The government, backed by American aid and advisers, answered with its Communist Suppression Operations Command, rural development and armed village scouts; in the “Red Drum” killings in Phatthalung in 1972, security forces burned suspected communists in oil drums, with estimates of the dead ranging from several hundred to about 3,000. After the massacre of students at Thammasat University in Bangkok on 6 October 1976 (46 dead by the official count) and the coup that followed, some 3,000 students and activists joined the party in the jungle, and its armed strength rose to perhaps 10,000–12,000. The movement then collapsed: after Vietnam’s invasion of Cambodia, China drew close to Thailand and closed the party’s radio station in 1979, Vietnam and Laos turned against its pro-Chinese leaders, and the students fell out with the party. Prime Minister Prem Tinsulanonda’s Order 66/2523 of April 1980 offered amnesty and a political path, thousands surrendered, and by 1983 the insurgency was over. Several thousand people were killed on both sides."
: "Thailands kommunistiska partis (CPT) gerillakrig mot den thailändska staten. Partiet, som grundades 1942 och var förbjudet enligt antikommunistiska lagar, följde Mao Zedongs linje, sände radio från Kina och utbildade sina kadrer i Kina, Nordvietnam och Laos. Partiet räknar sin väpnade kamp från en sammandrabbning med polis vid Na Bua i provinsen Nakhon Phanom den 7 augusti 1965, ”dagen då gevären talade”. Kriget utkämpades framför allt i det fattiga nordöstra Thailand (Isan), i bergen i norr bland hmong och andra bergsfolk, kring Phu Hin Rong Kla vid gränserna mellan Phitsanulok, Loei och Phetchabun samt i söder kring Phatthalung och Surat Thani. Regeringen, med stöd av amerikanskt bistånd och amerikanska rådgivare, svarade med sitt kommando för bekämpning av kommunismen, landsbygdsutveckling och beväpnade byscouter; vid ”Red Drum”-morden i Phatthalung 1972 brände säkerhetsstyrkor misstänkta kommunister i oljefat, och uppskattningarna av antalet döda sträcker sig från flera hundra till omkring 3 000. Efter massakern på studenter vid Thammasatuniversitetet i Bangkok den 6 oktober 1976 (46 döda enligt den officiella räkningen) och den kupp som följde anslöt sig omkring 3 000 studenter och aktivister till partiet i djungeln, och dess väpnade styrka växte till kanske 10 000–12 000. Därefter föll rörelsen samman: efter Vietnams invasion av Kambodja närmade sig Kina Thailand och stängde partiets radiostation 1979, Vietnam och Laos vände sig mot dess prokinesiska ledare, och studenterna blev osams med partiet. Premiärminister Prem Tinsulanondas order 66/2523 från april 1980 erbjöd amnesti och en politisk väg, tusentals gav upp, och 1983 var upprorsrörelsen över. Flera tusen människor dödades på båda sidor."
