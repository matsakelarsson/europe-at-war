# Svenska översättningar av katalogtexten (våg 11); stegtexterna kommer senare.
Communist revolts in the Dutch East Indies: Kommunistiska revolterna i Nederländska Ostindien
? Risings called by the Communist Party of Indonesia (PKI) against Dutch colonial rule in West Java in November 1926 and West Sumatra in January 1927. The party, founded in 1920 as one of the first communist parties in Asia, had grown among railway, port and plantation workers and in the villages of Banten and West Sumatra, and faced arrests and bans on its meetings. At a meeting at Prambanan in December 1925 its leaders decided on a revolution starting with strikes; Tan Malaka, the party’s representative abroad, opposed it as premature, and the plan was postponed and split the party. On the night of 12–13 November 1926 armed groups attacked the prison, the telephone exchange and police posts in Batavia and were dispersed by the morning; in Banten bands of several hundred men, many led by local religious teachers, killed the district head of Menes and several police officers, gathered at Labuan and held out in places until December, and there were smaller attacks in the Priangan and around Surakarta. In West Sumatra the rising began on the night of 31 December 1926 at Silungkang, near the coal mines of Sawahlunto, and was crushed within days. The colonial government arrested some 13,000 people. About 4,500 were sentenced to prison and a few to death, the party was banned in 1927, and from 1927 some 1,300 people judged dangerous were interned without trial at Boven-Digoel, a camp built for the purpose about 450 km up the Digul River in New Guinea.
: Resningar som Indonesiens kommunistiska parti (PKI) utlyste mot det nederländska kolonialstyret på västra Java i november 1926 och på västra Sumatra i januari 1927. Partiet, som grundades 1920 som ett av de första kommunistpartierna i Asien, hade vuxit bland järnvägs-, hamn- och plantagearbetare och i byarna i Banten och på västra Sumatra, och det utsattes för gripanden och mötesförbud. Vid ett möte i Prambanan i december 1925 beslutade partiets ledare om en revolution som skulle inledas med strejker; Tan Malaka, partiets representant utomlands, motsatte sig den som förhastad, och planen sköts upp och splittrade partiet. Natten mellan den 12 och 13 november 1926 anföll beväpnade grupper fängelset, telefonstationen och polisposter i Batavia och skingrades före morgonen; i Banten dödade band på flera hundra man, många av dem ledda av lokala religiösa lärare, distriktschefen i Menes och flera poliser, samlades i Labuan och höll på sina håll ut till december, och mindre anfall förekom i Priangan och runt Surakarta. På västra Sumatra började resningen natten den 31 december 1926 i Silungkang, nära kolgruvorna i Sawahlunto, och den slogs ned inom några dagar. Kolonialregeringen grep omkring 13 000 människor. Omkring 4 500 dömdes till fängelse och några till döden, partiet förbjöds 1927, och från 1927 internerades omkring 1 300 människor som bedömdes som farliga utan rättegång i Boven-Digoel, ett läger som hade byggts för ändamålet omkring 450 km uppför floden Digul på Nya Guinea.
