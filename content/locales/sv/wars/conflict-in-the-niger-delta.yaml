# Svenska översättningar av katalogtexten (våg 13); stegtexterna kommer senare.
Conflict in the Niger Delta: Konflikten i Nigerdeltat
? "Last updated 27 November 2026. The armed conflict over the oil wealth of the Niger Delta in southern Nigeria, where most of the country’s oil is pumped while many of the people, among them the Ijaw, Ogoni and others, live with oil spills, gas flaring and poverty. Peaceful protest in the 1990s was met with repression: the military government hanged the Ogoni writer Ken Saro-Wiwa and eight others in 1995, and soldiers destroyed the Ijaw town of Odi in 1999, killing scores, if not hundreds. In September 2004 Mujahid Dokubo-Asari’s Niger Delta People’s Volunteer Force (NDPVF), which fought rival militias around Port Harcourt and lived largely from stolen oil, declared “all-out war” on the state; from 2006 the Movement for the Emancipation of the Niger Delta (MEND) attacked pipelines and platforms and kidnapped more than 200 foreign oil workers, repeatedly forcing cuts in Nigeria’s oil output. After an army offensive in May 2009, President Umaru Yar’Adua offered an amnesty from 26 June 2009; some 30,000 fighters registered for stipends and training, among them leaders such as Government Ekpemupolo (Tompolo), whose firms were later paid to guard the pipelines, and violence fell sharply. In 2016 a new group, the Niger Delta Avengers, bombed pipelines and terminals and pushed output to its lowest level in decades before declaring a ceasefire in August. Since then oil theft, illegal refining and piracy have been the main problems, but attacks continued: in early 2025 pipelines were blown up in Rivers State, President Bola Tinubu declared a state of emergency there in March, saying its governor had done nothing to stop them, and in April MEND and another group claimed attacks on the main oil pipeline in Bayelsa State; on 15 June 2026 armed men attacked the Trans-Niger Pipeline at Odau in Rivers State. No one has published a reliable count of the dead; estimates run into the thousands."
: "Senast uppdaterad 27 november 2026. Den väpnade konflikten om oljerikedomarna i Nigerdeltat i södra Nigeria, där större delen av landets olja pumpas upp medan många av invånarna, bland dem ijaw, ogoni och andra, lever med oljeutsläpp, gasfackling och fattigdom. Fredliga protester på 1990-talet möttes med förtryck: militärregeringen hängde den ogoniske författaren Ken Saro-Wiwa och åtta andra 1995, och soldater förstörde ijawstaden Odi 1999 och dödade tiotals, om inte hundratals, människor. I september 2004 förklarade Mujahid Dokubo-Asaris Niger Delta People’s Volunteer Force (NDPVF), som bekämpade rivaliserande miliser kring Port Harcourt och till stor del levde på stulen olja, ”totalt krig” mot staten; från 2006 anföll Movement for the Emancipation of the Niger Delta (MEND) rörledningar och plattformar och kidnappade mer än 200 utländska oljearbetare, vilket upprepade gånger tvingade fram nedskärningar i Nigerias oljeproduktion. Efter en arméoffensiv i maj 2009 erbjöd president Umaru Yar’Adua amnesti från den 26 juni 2009; omkring 30 000 krigare registrerade sig för bidrag och utbildning, bland dem ledare som Government Ekpemupolo (Tompolo), vars företag senare fick betalt för att bevaka rörledningarna, och våldet minskade kraftigt. År 2016 sprängde en ny grupp, Niger Delta Avengers, rörledningar och terminaler och pressade ned produktionen till den lägsta nivån på årtionden innan den utlyste vapenvila i augusti. Sedan dess har oljestölder, illegal raffinering och sjöröveri varit de största problemen, men anfallen har fortsatt: i början av 2025 sprängdes rörledningar i delstaten Rivers, president Bola Tinubu utlyste undantagstillstånd där i mars med motiveringen att delstatens guvernör inte hade gjort något för att stoppa dem, och i april tog MEND och en annan grupp på sig anfall mot den viktigaste oljeledningen i delstaten Bayelsa; den 15 juni 2026 anföll beväpnade män Trans-Niger Pipeline vid Odau i delstaten Rivers. Ingen har publicerat någon tillförlitlig siffra över antalet döda; uppskattningarna uppgår till tusentals."
