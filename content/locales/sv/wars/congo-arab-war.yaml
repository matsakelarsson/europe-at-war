# Svenska översättningar av katalogtexten (våg 13); stegtexterna kommer senare.
Congo Arab war: Kongo-arabiska kriget
? The war in which the Congo Free State of Leopold II destroyed the power of the Swahili-Arab traders in the eastern Congo. From the 1860s traders from Zanzibar’s sphere, led by Tippu Tip, had built a commercial empire in Maniema and on the upper Congo, based on ivory and on raids that took slaves and recruited soldiers, from towns such as Nyangwe, Kasongo and Stanley Falls. In 1887 Leopold made Tippu Tip governor of Stanley Falls for the Free State, but the two powers competed for the same ivory, and when Tippu Tip went back to Zanzibar in 1890 his son Sefu at Kasongo, his nephew Rashid at Stanley Falls and the Lake Tanganyika trader Rumaliza turned against the state. In 1892 the Free State officer Francis Dhanis defeated Tippu Tip’s former vassal Ngongo Lutete, who changed sides with his Tetela and Kusu warriors, and Sefu’s men killed the trader Arthur Hodister’s expedition. From November 1892 Dhanis’s Force Publique, a few dozen European officers with African regulars armed with modern rifles and thousands of African auxiliaries, drove Sefu back across the Lomami, took Nyangwe on 4 March and Kasongo on 22 April 1893, and relieved Stanley Falls. Rumaliza then came west with a large army and held the Free State off in fortified camps on the Luama River until November 1893; Sefu was killed in the fighting. On 14 January 1894 Dhanis stormed Rumaliza’s camps before Kabambare, and Rumaliza fled to German East Africa. The Free State presented the war in Europe as a crusade against the slave trade; historians see it above all as a war for ivory and territory, in which the Free State itself recruited soldiers through slave raids and its auxiliaries raided and killed on a large scale. It lost 16 European officers and NCOs; the African dead, soldiers, auxiliaries and civilians, are not known, with estimates running from tens of thousands to possibly more than 100,000.
: Det krig genom vilket Leopold II:s Kongostat bröt de swahili-arabiska handelsmännens makt i östra Kongo. Från 1860-talet hade handelsmän från Zanzibars intressesfär, ledda av Tippu Tip, byggt upp ett handelsimperium i Maniema och vid övre Kongofloden, grundat på elfenben och på räder som tog slavar och värvade soldater, från städer som Nyangwe, Kasongo och Stanley Falls. År 1887 gjorde Leopold Tippu Tip till Kongostatens guvernör i Stanley Falls, men de två makterna konkurrerade om samma elfenben, och när Tippu Tip återvände till Zanzibar 1890 vände sig hans son Sefu i Kasongo, hans nevö Rashid i Stanley Falls och handelsmannen Rumaliza från Tanganyikasjön mot staten. År 1892 besegrade Kongostatens officer Francis Dhanis Tippu Tips tidigare vasall Ngongo Lutete, som bytte sida med sina tetela- och kusukrigare, och Sefus män dödade deltagarna i handelsmannen Arthur Hodisters expedition. Från november 1892 drev Dhanis Force Publique, några dussin europeiska officerare med afrikanska reguljära soldater beväpnade med moderna gevär och tusentals afrikanska hjälptrupper, Sefu tillbaka över Lomami, intog Nyangwe den 4 mars och Kasongo den 22 april 1893 och undsatte Stanley Falls. Rumaliza kom då västerut med en stor armé och höll Kongostaten stången i befästa läger vid floden Luama fram till november 1893; Sefu stupade i striderna. Den 14 januari 1894 stormade Dhanis Rumalizas läger framför Kabambare, och Rumaliza flydde till Tyska Östafrika. Kongostaten framställde kriget i Europa som ett korståg mot slavhandeln; historiker ser det framför allt som ett krig om elfenben och territorium, där Kongostaten själv värvade soldater genom slavräder och dess hjälptrupper plundrade och dödade i stor skala. Kongostaten förlorade 16 europeiska officerare och underofficerare; antalet afrikanska döda, soldater, hjälptrupper och civila, är inte känt, och uppskattningarna sträcker sig från tiotusentals till möjligen mer än 100 000.
