# Svenska översättningar av katalogtexten (våg 13); stegtexterna kommer senare.
Congo Crisis: Kongokrisen
? The political crisis and wars that followed the independence of the Belgian Congo on 30 June 1960. Within a week the soldiers of the Force Publique rose against their Belgian officers, Belgium sent troops to protect its citizens without the new government’s consent, and the mineral-rich province of Katanga under Moïse Tshombe, backed by Belgian officers and mining interests, declared independence; South Kasai followed in August. Prime Minister Patrice Lumumba asked the United Nations for help and then the Soviet Union, and was dismissed by President Joseph Kasa-Vubu, removed by the army chief Joseph-Désiré Mobutu, handed to the Katangese and killed on 17 January 1961 with Belgian officers present. His followers set up a rival government in Stanleyville. The UN force (ONUC), up to about 20,000 troops, ended Katanga’s secession in January 1963 after three rounds of fighting. Risings by Lumumba’s followers in 1964 (the Simba rebellion) were put down by the army, white mercenaries and a Belgian–American airborne operation, and on 25 November 1965 Mobutu took power in a coup. Some 100,000 people are estimated to have died.
: Den politiska kris och de krig som följde på Belgiska Kongos självständighet den 30 juni 1960. Inom en vecka reste sig soldaterna i Force Publique mot sina belgiska officerare, Belgien sände trupper för att skydda sina medborgare utan den nya regeringens samtycke, och den mineralrika provinsen Katanga under Moïse Tshombe, med stöd av belgiska officerare och gruvintressen, förklarade sig självständig; Sydkasai följde efter i augusti. Premiärminister Patrice Lumumba bad Förenta nationerna om hjälp och sedan Sovjetunionen; han avsattes av president Joseph Kasa-Vubu, fråntogs makten av arméchefen Joseph-Désiré Mobutu, överlämnades till katangeserna och dödades den 17 januari 1961 i närvaro av belgiska officerare. Hans anhängare bildade en rivaliserande regering i Stanleyville. FN-styrkan (ONUC), med upp till omkring 20 000 soldater, gjorde slut på Katangas utbrytning i januari 1963 efter tre omgångar av strider. Resningar bland Lumumbas anhängare 1964 (Simbaupproret) slogs ned av armén, vita legosoldater och en belgisk-amerikansk luftlandsättning, och den 25 november 1965 tog Mobutu makten genom en statskupp. Omkring 100 000 människor beräknas ha dött.
