Russian conquest of Astrakhan: Rysslands erövring av Astrachan
Ivan IV’s conquest of the Astrakhan khanate at the mouth of the Volga, two years after the fall of Kazan. In 1554 a Russian river army took Astrakhan without a fight and made Dervish Ali khan; when he broke with Moscow and turned to the Crimean Tatars, a small force of Cossacks and streltsy took the city again in 1556 and the khanate was annexed, giving Russia the whole course of the Volga to the Caspian Sea.: Ivan IV:s erövring av khanatet Astrachan vid Volgas mynning, två år efter Kazans fall. År 1554 intog en rysk flodhär Astrachan utan strid och gjorde Dervisj Ali till khan; när han bröt med Moskva och vände sig till krimtatarerna intog en liten styrka kosacker och streltser staden på nytt 1556 och khanatet annekterades, vilket gav Ryssland hela Volgas lopp ned till Kaspiska havet.
