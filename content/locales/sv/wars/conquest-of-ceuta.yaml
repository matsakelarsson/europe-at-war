Conquest of Ceuta: Erövringen av Ceuta
The Portuguese capture of Ceuta, a Marinid port on the African shore of the Strait of Gibraltar, often taken as the start of Portugal’s overseas expansion. John I prepared the expedition in secret, letting rumours spread that it was aimed at Holland. A fleet of about 200 ships sailed from Lisbon on 25 July 1415, and on 21 August the army, with the king’s sons Duarte, Pedro and Henry (later called the Navigator), stormed the city in a single day; its governor, Salah ibn Salah, fled. The princes were knighted in the city’s mosque, made a church. Ceuta held out against Marinid and Granadan sieges, but a Portuguese attack on Tangier in 1437 failed. The city stayed Portuguese until it passed to Spain in 1668.: Portugals intagande av Ceuta, en marinidisk hamnstad på den afrikanska sidan av Gibraltarsundet, som ofta räknas som början på Portugals expansion över haven. Johan I förberedde expeditionen i hemlighet och lät rykten spridas om att den riktades mot Holland. En flotta på omkring 200 fartyg seglade från Lissabon den 25 juli 1415, och den 21 augusti stormade hären, med kungens söner Duarte, Pedro och Henrik (senare kallad Sjöfararen), staden på en enda dag; dess guvernör Salah ibn Salah flydde. Prinsarna dubbades till riddare i stadens moské, som gjordes om till kyrka. Ceuta stod emot marinidiska och granadiska belägringar, men ett portugisiskt anfall mot Tanger 1437 misslyckades. Staden förblev portugisisk tills den övergick till Spanien 1668.
