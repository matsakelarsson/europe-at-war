# Svenska översättningar av katalogtexten (våg 9); stegtexterna kommer senare.
Russian conquest of Kamchatka: Den ryska erövringen av Kamtjatka
? "The Russian conquest of the Kamchatka peninsula and the resistance of its peoples, the Itelmens (Kamchadals) and the Koryaks. In 1697 Vladimir Atlasov, commander of the fort of Anadyrsk, led about 65 Cossacks and 60 Yukaghirs south across the Koryak lands, killed about 150 Koryaks who had taken his reindeer, reached the Kamchatka river and claimed the peninsula for the tsar. Forts followed at Verkhnekamchatsk, Nizhnekamchatsk and Bolsheretsk (1703). Cossack demands for fur tribute (yasak), hostage-taking and the enslavement of Itelmens brought repeated risings: Koryaks killed tribute collectors in 1706, rebellious Cossacks of his own command killed Atlasov at Nizhnekamchatsk in 1711, and Itelmens and Koryaks burned the Cossack leader Danila Antsiferov to death in 1712. By 1715 the crown had lost five years of tribute and at least 200 Russians. The largest rising came in 1731, when Itelmens led by the baptised Fyodor Kharchin seized Nizhnekamchatsk. Survivors reached a Russian ship bound for the Anadyr, whose crew landed with cannon and retook the fort, which burned when its powder store exploded; the Cossacks killed their prisoners. Kharchin was captured about a month later, and some of his followers killed themselves and their families rather than surrender. Kamchatka was then put under Okhotsk, and an inquiry under Dmitry Pavlutsky and his fellow officer Merlin (1733–1739) punished Russians and Itelmens alike. War, flight and above all epidemics, smallpox in 1768–1769 worst of all, cut the Itelmens from about 12,000–13,000 people in the late 17th century to fewer than 2,000 by 1827."
: "Den ryska erövringen av Kamtjatkahalvön och motståndet från dess folk, itelmenerna (kamtjadalerna) och korjakerna. År 1697 ledde Vladimir Atlasov, befälhavare för fästet Anadyrsk, omkring 65 kosacker och 60 jukagirer söderut genom korjakernas land, dödade omkring 150 korjaker som hade tagit hans renar, nådde floden Kamtjatka och gjorde anspråk på halvön för tsarens räkning. Fästen anlades sedan i Verchnekamtjatsk, Nizjnekamtjatsk och Bolsjeretsk (1703). Kosackernas krav på pälstribut (jasak), deras gisslantagande och förslavandet av itelmener ledde till upprepade resningar: korjaker dödade tributindrivare 1706, upproriska kosacker ur hans egen trupp dödade Atlasov i Nizjnekamtjatsk 1711, och itelmener och korjaker brände kosackledaren Danila Antsiferov till döds 1712. År 1715 hade kronan förlorat fem års tribut och minst 200 ryssar. Det största upproret kom 1731, när itelmener under den döpte Fjodor Chartjin intog Nizjnekamtjatsk. Överlevande nådde ett ryskt fartyg på väg till Anadyr, vars besättning landsteg med kanoner och återtog fästet, som brann ned när dess krutförråd exploderade; kosackerna dödade sina fångar. Chartjin tillfångatogs ungefär en månad senare, och en del av hans anhängare dödade sig själva och sina familjer hellre än att ge sig. Kamtjatka ställdes därefter under Ochotsk, och en undersökning under Dmitrij Pavlutskij och hans officerskollega Merlin (1733–1739) straffade ryssar och itelmener lika. Krig, flykt och framför allt epidemier, värst av allt smittkopporna 1768–1769, minskade itelmenerna från omkring 12 000–13 000 människor i slutet av 1600-talet till färre än 2 000 år 1827."
