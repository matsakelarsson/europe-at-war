# Svenska översättningar av katalogtexten (våg 14); stegtexterna kommer senare.
Conquest of Nueva Galicia: Erövringen av Nueva Galicia
? Nuño Beltrán de Guzmán’s campaign of conquest in western Mexico, in what are now Michoacán, Jalisco, Nayarit, Zacatecas and Sinaloa. Guzmán, president of the first Audiencia of Mexico and a rival of Hernán Cortés, left Mexico City on 21 December 1529 with 300 to 400 Spaniards and between 5,000 and 8,000 Indigenous auxiliaries, Mexica, Tlaxcalans and others, many of them pressed into service. In Michoacán he had the Purépecha king Tangáxuan II tortured and burned (14 February 1530), then crossed the Lerma into lands of small independent lordships of many languages, the Tecuexe, Coca, Caxcanes, Cora, Totorame, Tahue and others. Some received him peacefully and others fought, as at Tonalá in March 1530, in Nayarit and on the coast of Sinaloa; his men seized food, burned towns, tortured lords for gold that was rarely there and took thousands of people as slaves. Guzmán reached Culiacán, where he founded San Miguel de Culiacán in September 1531, and the expedition also founded Compostela, Chiametla and, in 1532, the first Guadalajara, near Nochistlán. He wanted to call the province Mayor España; the crown named it Nueva Galicia. The bishop of Mexico, Juan de Zumárraga, denounced the campaign, Guzmán lost his offices in the mid-1530s and was arrested in 1537, and modern historians have called his expedition one of the most brutal of the conquest. The seizure of land and labour and the slave raids that followed it led to the Mixtón War of 1540–1542.
: "Nuño Beltrán de Guzmáns erövringståg i västra Mexiko, i det som i dag är Michoacán, Jalisco, Nayarit, Zacatecas och Sinaloa. Guzmán, president för Mexikos första audiencia och rival till Hernán Cortés, lämnade Mexico City den 21 december 1529 med 300–400 spanjorer och mellan 5 000 och 8 000 ursprungsamerikanska hjälptrupper, mexica, tlaxcalteker och andra, många av dem tvångsuttagna. I Michoacán lät han tortera och bränna purépechakungen Tangáxuan II (14 februari 1530) och gick sedan över Lerma in i ett land av små självständiga herradömen med många olika språk: tecuexe, coca, caxcaner, cora, totorame, tahue och andra. Somliga tog emot honom fredligt och andra gjorde motstånd, som vid Tonalá i mars 1530, i Nayarit och på Sinaloas kust; hans män tog livsmedel, brände städer, torterade herrar för att få guld som sällan fanns och tog tusentals människor som slavar. Guzmán nådde Culiacán, där han grundade San Miguel de Culiacán i september 1531, och expeditionen grundade också Compostela, Chiametla och, 1532, det första Guadalajara nära Nochistlán. Han ville kalla provinsen Mayor España; kronan gav den namnet Nueva Galicia. Biskopen av Mexiko, Juan de Zumárraga, fördömde fälttåget, Guzmán förlorade sina ämbeten i mitten av 1530-talet och arresterades 1537, och moderna historiker har kallat hans expedition en av erövringens mest brutala. Beslagtagandet av land och arbetskraft och de slavräder som följde på det ledde till Mixtónkriget 1540–1542."
