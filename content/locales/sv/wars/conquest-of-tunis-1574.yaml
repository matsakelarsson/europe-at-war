# Svenska översättningar av katalogtexten (våg 12); stegtexterna kommer senare.
Conquest of Tunis (1574): Erövringen av Tunis (1574)
? The Ottoman capture of La Goulette and Tunis in 1574, which ended both Spain’s forty-year hold on La Goulette and the Hafsid dynasty that had ruled Tunis since the 13th century. Uluç Ali, the Ottoman governor of Algiers, had taken Tunis in 1569–1570; after Lepanto, Don John of Austria retook it without a fight in October 1573 and set up the Hafsid prince Muhammad as a Spanish client, leaving garrisons in La Goulette and in a new, unfinished fort beside Tunis. In July 1574 Sultan Selim II sent a fleet of about 230–300 galleys under Kılıç Ali Pasha (Uluç Ali) and Koca Sinan Pasha, with troops from Algiers, Tripoli and the Tunisian interior. La Goulette, held by about 7,000 men, was stormed on 24 August, and the fort at Tunis surrendered on 13 September after repeated assaults. Most of the defenders died; the survivors went to the galleys or to captivity in Istanbul, and so did Muhammad, the last Hafsid. Don John’s attempts at relief were defeated by storms and lack of money. Tunis became an Ottoman province, and the frontier between the Habsburg and Ottoman Mediterranean settled into the line it kept for two centuries.
: Osmanernas intagande av La Goulette och Tunis 1574, som gjorde slut både på Spaniens fyrtioåriga innehav av La Goulette och på den hafsidiska dynasti som hade härskat i Tunis sedan 1200-talet. Uluç Ali, den osmanske guvernören i Alger, hade intagit Tunis 1569–1570; efter Lepanto återtog Don Juan av Österrike staden utan strid i oktober 1573 och insatte den hafsidiske prinsen Muhammad som spansk klient, med garnisoner i La Goulette och i ett nytt, ofullbordat fort intill Tunis. I juli 1574 sände sultan Selim II en flotta på omkring 230–300 galärer under Kılıç Ali pasha (Uluç Ali) och Koca Sinan pasha, med trupper från Alger, Tripoli och det tunisiska inlandet. La Goulette, som försvarades av omkring 7 000 man, stormades den 24 augusti, och fortet vid Tunis kapitulerade den 13 september efter upprepade stormningar. De flesta av försvararna dog; de överlevande hamnade på galärerna eller i fångenskap i Istanbul, liksom Muhammad, den siste hafsiden. Don Juans undsättningsförsök omintetgjordes av stormar och penningbrist. Tunis blev en osmansk provins, och gränsen mellan Habsburgs och osmanernas Medelhav stabiliserades längs den linje som den sedan behöll i två sekler.
