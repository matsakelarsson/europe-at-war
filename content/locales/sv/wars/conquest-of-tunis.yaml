Dates are Julian. Figures for the size of the expedition and for the dead in the sack of Tunis vary widely between sources.: Datum är julianska. Siffrorna för expeditionens storlek och för antalet döda vid plundringen av Tunis varierar kraftigt mellan källorna.
Charles’s campaign was celebrated across Europe as a crusade; the Flemish painter Jan Cornelisz Vermeyen went with the army, and his drawings became the basis of a famous set of tapestries woven by Willem de Pannemaker. Charles’s attack on Algiers in 1541 has its own entry.: Karls fälttåg firades över hela Europa som ett korståg; den flamländske målaren Jan Cornelisz Vermeyen följde med hären, och hans teckningar blev underlaget för en berömd serie gobelänger vävda av Willem de Pannemaker. Karls anfall mot Alger 1541 har en egen artikel.
