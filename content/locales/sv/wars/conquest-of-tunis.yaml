Ottoman success: Osmanska framgångar
Hayreddin Barbarossa, the corsair ruler of Algiers whom Suleiman had made admiral of the Ottoman fleet, raided the coasts of Italy in 1534 and on 16 August took Tunis from its Hafsid sultan, Muley Hasan. From there his galleys could close the narrows between Sicily and Africa. Charles V decided to lead a crusade against him in person. A fleet of several hundred ships carrying about 30,000 soldiers gathered from Spain, Genoa under Andrea Doria, Naples, Sicily, Portugal, the Papal States and the Knights of St John; Francis I of France, then seeking an Ottoman alliance, refused to help. The fleet assembled at Cagliari and landed near the ruins of Carthage in mid-June.: Hayreddin Barbarossa, kaparhärskaren i Alger som Süleyman hade gjort till amiral över den osmanska flottan, härjade Italiens kuster 1534 och tog den 16 augusti Tunis från dess hafsidiske sultan, Muley Hasan. Därifrån kunde hans galärer stänga sundet mellan Sicilien och Afrika. Karl V beslöt att själv leda ett korståg mot honom. En flotta på flera hundra fartyg med omkring 30 000 soldater samlades från Spanien, Genua under Andrea Doria, Neapel, Sicilien, Portugal, Kyrkostaten och johanniterorden; Frans I av Frankrike, som då sökte ett förbund med osmanerna, vägrade att hjälpa till. Flottan samlades i Cagliari och landsteg nära Karthagos ruiner i mitten av juni.
La Goulette, the fortress guarding the channel into the lagoon of Tunis, was stormed on 14 July after a month’s siege, and most of Barbarossa’s fleet was taken in the lagoon. As the army marched on Tunis on 21 July, thousands of Christian captives broke out of the kasbah and seized it, and Barbarossa fled to Bône. Charles’s troops then sacked the city, killing many thousands of its people, perhaps 10,000 or more, and enslaving others. Muley Hasan was restored as a vassal of Spain, which kept a garrison in La Goulette. In September Barbarossa struck back by sacking Mahón on Minorca.: La Goulette, fästningen som vaktade inloppet till Tunis lagun, stormades den 14 juli efter en månads belägring, och större delen av Barbarossas flotta togs i lagunen. När hären tågade mot Tunis den 21 juli bröt sig tusentals kristna fångar ut ur kasban och tog den, och Barbarossa flydde till Bône. Karls trupper plundrade därefter staden, dödade många tusen av dess invånare, kanske 10 000 eller fler, och gjorde andra till slavar. Muley Hasan återinsattes som Spaniens vasall, och Spanien behöll en garnison i La Goulette. I september slog Barbarossa tillbaka genom att plundra Mahón på Menorca.
