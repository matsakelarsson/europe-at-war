Conquest of Tunis: Erövringen av Tunis
Emperor Charles V’s expedition against Tunis, which the Ottoman admiral and corsair Hayreddin Barbarossa had seized from its Hafsid sultan in 1534. A fleet from Spain, Genoa, Portugal, the papacy, the Hospitallers and Charles’s Italian kingdoms took the fortress of La Goulette and Tunis in July 1535, sacked the city and restored the Hafsid Muley Hasan as a Spanish vassal, but Barbarossa escaped.: Kejsar Karl V:s expedition mot Tunis, som den osmanske amiralen och korsaren Hayreddin Barbarossa hade tagit från dess hafsidiske sultan 1534. En flotta från Spanien, Genua, Portugal, påvestolen, johanniterna och Karls italienska kungariken intog fästningen La Goulette och Tunis i juli 1535, plundrade staden och återinsatte hafsiden Muley Hasan som spansk vasall, men Barbarossa kom undan.
