# Svenska översättningar av katalogtexten (våg 8); stegtexterna kommer senare.
Conquests of Alauddin Khalji: Alauddin Khaljis erövringar
The campaigns of Alauddin Khalji, sultan of Delhi from 1296 to 1316, and his general Malik Kafur, which carried the Delhi Sultanate’s armies across western and central India and deep into the south. As governor of Kara he plundered the Yadava capital Devagiri in 1296 and used the treasure to seize the throne. As sultan he conquered Gujarat (1299–1304), the Rajput fortresses of Ranthambore (1301) and Chittor (1303), Malwa (1305), Siwana (1308) and Jalore (1311). From 1308 Malik Kafur made the kingdoms of the Deccan and the south tributaries, besieging Warangal in 1310, forcing the Hoysala king to submit at Dwarasamudra in 1311 and plundering the Pandya country as far as Madurai. The wars brought enormous booty to Delhi, and the sieges ended with massacres, jauhar (the self-immolation of Rajput women) and the destruction of temples.: "Fälttågen under Alauddin Khalji, sultan av Delhi från 1296 till 1316, och hans general Malik Kafur, som förde Delhisultanatets arméer genom västra och centrala Indien och djupt in i söder. Som guvernör i Kara plundrade han yadavadynastins huvudstad Devagiri 1296 och använde skatten till att tillskansa sig tronen. Som sultan erövrade han Gujarat (1299–1304), rajputfästningarna Ranthambore (1301) och Chittor (1303), Malwa (1305), Siwana (1308) och Jalore (1311). Från 1308 gjorde Malik Kafur rikena i Deckan och söder till tributärstater: han belägrade Warangal 1310, tvingade hoysalakungen att underkasta sig vid Dwarasamudra 1311 och plundrade pandyaländerna ända till Madurai. Krigen förde enorma byten till Delhi, och belägringarna slutade med massakrer, jauhar (rajputkvinnornas självbränning) och förstörelse av tempel."
