Alarmed by Serbia’s advance into northern Macedonia, the Bulgarian tsar Michael Shishman and the Byzantine emperor Andronikos III agreed to attack it together. Before the Byzantines arrived, King Stefan Dečanski and his son Dušan caught the Bulgarian army near Velbazhd (Kyustendil) on 28 July 1330. The Bulgarians were routed and Michael Shishman was mortally wounded; Dečanski’s nephew Ivan Stefan was put on the Bulgarian throne. The following year nobles eager for southern conquests turned against Dečanski, and Dušan seized power; he was crowned king on 8 September 1331, and his father died in prison at Zvečan soon after.: Oroade av Serbiens framryckning in i norra Makedonien kom den bulgariske tsaren Mikael Sjisjman och den bysantinske kejsaren Andronikos III överens om att anfalla landet tillsammans. Innan bysantinerna anlände överraskade kung Stefan Dečanski och hans son Dušan den bulgariska hären nära Velbazjd (Kjustendil) den 28 juli 1330. Bulgarerna slogs på flykten och Mikael Sjisjman sårades dödligt; Dečanskis systerson Ivan Stefan sattes på den bulgariska tronen. Året därpå vände sig stormän som var ivriga efter erövringar i söder mot Dečanski, och Dušan grep makten; han kröntes till kung den 8 september 1331, och hans far dog kort därefter i fängelse i Zvečan.
Dušan made peace with Bulgaria, marrying Helena, the sister of its new tsar Ivan Alexander, and turned south. With the help of the Byzantine rebel Syrgiannes he took Ohrid, Prilep and Strumica, which the Byzantines recognised as Serbian in 1334. When the Byzantine civil war broke out in 1341 he backed first John Kantakouzenos and then the regency in Constantinople, while his armies took Albania except Durrës, the towns of western Macedonia and, on 25 September 1345 after a long siege, Serres.: Dušan slöt fred med Bulgarien, gifte sig med Helena, syster till dess nye tsar Ivan Alexander, och vände sig söderut. Med hjälp av den bysantinske upprorsmannen Syrgiannes intog han Ohrid, Prilep och Strumica, som bysantinerna 1334 erkände som serbiska. När det bysantinska inbördeskriget bröt ut 1341 stödde han först Johannes Kantakouzenos och sedan förmyndarregeringen i Konstantinopel, medan hans härar intog Albanien utom Durrës, städerna i västra Makedonien och, den 25 september 1345 efter en lång belägring, Serres.
