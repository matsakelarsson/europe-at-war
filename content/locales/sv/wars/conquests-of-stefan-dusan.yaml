Dušan: Dušan
On Easter Sunday, 16 April 1346, an assembly at Skopje raised the Serbian archbishopric to a patriarchate with its seat at Peć, and the new patriarch crowned Dušan Emperor of the Serbs and Romans, with the Bulgarian patriarch and monks of Mount Athos present; Constantinople’s patriarch excommunicated him. In 1347–1348, as the Black Death ravaged the Byzantine lands, his armies took Epirus, Aetolia and Thessaly. Dušan made his half-brother Simeon Uroš governor of Epirus and the general Preljub governor of Thessaly. His law code, proclaimed at Skopje in 1349, was meant to bind the many peoples of his realm together.: På påskdagen den 16 april 1346 upphöjde en församling i Skopje det serbiska ärkebiskopsdömet till patriarkat med säte i Peć, och den nye patriarken krönte Dušan till serbernas och romarnas kejsare, i närvaro av den bulgariske patriarken och munkar från Athos; patriarken i Konstantinopel bannlyste honom. Åren 1347–1348, medan digerdöden härjade de bysantinska länderna, intog hans härar Epirus, Aitolien och Thessalien. Dušan gjorde sin halvbror Simeon Uroš till guvernör i Epirus och fältherren Preljub till guvernör i Thessalien. Hans lagbok, som kungjordes i Skopje 1349, var avsedd att binda samman rikets många folk.
Dušan’s empire now stretched from the Danube to the Gulf of Corinth, but Thessalonica and Constantinople were beyond him without a fleet, and Venice refused to lend him one. In 1350 Kantakouzenos, now emperor, briefly won back Veria and Edessa with Turkish help. In 1352 a Serbian force sent to help John V against Kantakouzenos was beaten near Didymoteicho by Ottoman troops under Orhan’s son Süleyman. Dušan beat off a Hungarian invasion in 1354 and died, aged about 47, on 20 December 1355. Under his son Uroš V the provinces fell away to their governors.: Dušans rike sträckte sig nu från Donau till Korinthiska viken, men Thessalonike och Konstantinopel låg utom räckhåll för honom utan en flotta, och Venedig vägrade att låna honom en. År 1350 återvann Kantakouzenos, nu kejsare, kortvarigt Veria och Edessa med turkisk hjälp. År 1352 besegrades en serbisk styrka som sänts för att hjälpa Johannes V mot Kantakouzenos nära Didymoteichon av osmanska trupper under Orhans son Süleyman. Dušan slog tillbaka en ungersk invasion 1354 och dog, omkring 47 år gammal, den 20 december 1355. Under hans son Uroš V föll provinserna bort till sina guvernörer.
