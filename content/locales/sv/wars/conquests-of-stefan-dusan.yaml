Dates are Julian. Dušan’s titles grew with his conquests; Serbian documents use “Romans” or “Greeks” for the Byzantines, and he was crowned “Emperor of the Serbs and Romans”.: Datum är julianska. Dušans titlar växte med hans erövringar; serbiska urkunder använder ”romare” eller ”greker” om bysantinerna, och han kröntes till ”serbernas och romarnas kejsare”.
The Byzantine civil wars of 1321–1328 and 1341–1347, which made many of these conquests possible, have their own entries.: De bysantinska inbördeskrigen 1321–1328 och 1341–1347, som gjorde många av dessa erövringar möjliga, har egna artiklar.
