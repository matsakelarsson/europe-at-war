Conquests of Stefan Dušan: Stefan Dušans erövringar
The expansion of medieval Serbia to its greatest extent under King, later Emperor, Stefan Dušan. After the Serbian victory over Bulgaria at Velbazhd in 1330, Dušan took the throne from his father and, exploiting the Byzantine civil wars, conquered Macedonia, Albania, Epirus and Thessaly. In 1346 he was crowned Emperor of the Serbs and Greeks at Skopje, but his empire broke apart soon after his death in 1355.: Det medeltida Serbiens expansion till sin största utbredning under kungen, sedermera kejsaren, Stefan Dušan. Efter den serbiska segern över Bulgarien vid Velbazjd 1330 tog Dušan tronen från sin far och erövrade, genom att utnyttja de bysantinska inbördeskrigen, Makedonien, Albanien, Epirus och Thessalien. År 1346 kröntes han i Skopje till serbernas och grekernas kejsare, men hans rike föll sönder kort efter hans död 1355.
