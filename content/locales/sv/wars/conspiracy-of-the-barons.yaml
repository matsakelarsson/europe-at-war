Italian historians call it the second conspiracy of the barons, after the revolt of 1459–1462. Exiled barons later urged Charles VIII of France to claim Naples, which he invaded in 1494.: Italienska historiker kallar den baronernas andra sammansvärjning, efter revolten 1459–1462. Landsflyktiga baroner uppmanade senare Karl VIII av Frankrike att göra anspråk på Neapel, som han invaderade 1494.
