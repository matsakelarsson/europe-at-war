Conspiracy of the Barons: Baronernas sammansvärjning
A revolt of great barons of the Kingdom of Naples, led by Antonello Sanseverino, Prince of Salerno, against King Ferdinand I and his heir Alfonso, Duke of Calabria, whose efforts to strengthen royal power threatened their privileges. Pope Innocent VIII, the kingdom’s overlord, backed them. The rebels took L’Aquila under the papal banner on 26 September 1485, and papal troops under the condottiere Roberto Sanseverino fought Alfonso’s army around Rome, while Milan and Florence sent help to Ferdinand. In August 1486 the pope made peace with Ferdinand, who promised the barons an amnesty. He did not keep it. The leaders, among them his former secretary Antonello Petrucci and the Count of Sarno, Francesco Coppola, were arrested and later executed, and many other barons died in prison; the Prince of Salerno escaped and joined the French court.: En revolt bland stormännen i kungariket Neapel, ledd av Antonello Sanseverino, furste av Salerno, mot kung Ferdinand I och hans arvinge Alfonso, hertig av Kalabrien, vars strävan att stärka kungamakten hotade deras privilegier. Påven Innocentius VIII, kungarikets länsherre, stödde dem. Rebellerna intog L’Aquila under påvens fana den 26 september 1485, och påvliga trupper under kondottiären Roberto Sanseverino stred mot Alfonsos här kring Rom, medan Milano och Florens sände hjälp till Ferdinand. I augusti 1486 slöt påven fred med Ferdinand, som lovade baronerna amnesti. Han höll inte löftet. Ledarna, bland dem hans förre sekreterare Antonello Petrucci och greven av Sarno, Francesco Coppola, arresterades och avrättades senare, och många andra baroner dog i fängelse; fursten av Salerno flydde och anslöt sig till det franska hovet.
