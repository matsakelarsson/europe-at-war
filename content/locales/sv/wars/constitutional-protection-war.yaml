# Svenska översättningar av katalogtexten (våg 9); stegtexterna kommer senare.
Constitutional Protection War: Kriget för författningens skydd
? A series of wars between the Beiyang government in Beijing and the southern provinces that rallied to Sun Yat-sen’s Constitutional Protection Movement, fought mainly in Hunan, Guangdong, Fujian and Sichuan. In 1917 the premier Duan Qirui, who had put down Zhang Xun’s twelve-day restoration of the Qing emperor in July, refused to recall the parliament dissolved in June or to restore the provisional constitution of 1912. Sun went to Guangzhou with part of the navy, and about a hundred members of the old parliament set up a military government there, with Sun as generalissimo (August–September 1917), backed by the Old Guangxi clique of Lu Rongting and the Yunnan clique of Tang Jiyao. Duan’s attempt to take Hunan failed in November 1917, but in March–April 1918 the Zhili commanders Cao Kun and Wu Peifu took Yuezhou, Changsha and Hengyang. Wu then halted, made a truce with the south and in May 1920 withdrew from Hunan. In the south the Guangxi generals pushed Sun aside in May 1918. In 1920 Chen Jiongming’s Guangdong Army returned from southern Fujian and drove the Guangxi clique out of Guangzhou (October 1920), and in 1921 it conquered Guangxi itself. The revived parliament in Guangzhou elected Sun “extraordinary president” in April 1921, but Chen opposed Sun’s plans for a northern expedition, and on 16 June 1922 his troops shelled Sun’s residence in Guangzhou; Sun escaped to a gunboat and later to Shanghai. Sun then turned to the Soviet Union for help, which led to the first united front with the Chinese Communist Party and the Whampoa Military Academy.
: En serie krig mellan Beiyangregeringen i Peking och de sydprovinser som slöt upp kring Sun Yat-sens rörelse för författningens skydd, utkämpade främst i Hunan, Guangdong, Fujian och Sichuan. År 1917 vägrade premiärministern Duan Qirui, som i juli hade slagit ned Zhang Xuns tolv dagar långa återinsättning av Qingkejsaren, att återkalla det parlament som hade upplösts i juni eller att återinföra den provisoriska författningen från 1912. Sun begav sig till Kanton med en del av flottan, och omkring hundra ledamöter av det gamla parlamentet inrättade där en militärregering med Sun som generalissimus (augusti–september 1917), med stöd av den gamla Guangxiklicken under Lu Rongting och Yunnanklicken under Tang Jiyao. Duans försök att inta Hunan misslyckades i november 1917, men i mars–april 1918 intog Zhilibefälhavarna Cao Kun och Wu Peifu Yuezhou, Changsha och Hengyang. Wu stannade sedan, slöt vapenvila med södern och drog sig i maj 1920 tillbaka från Hunan. I söder trängde Guangxigeneralerna undan Sun i maj 1918. År 1920 återvände Chen Jiongmings Guangdongarmé från södra Fujian och drev ut Guangxiklicken ur Kanton (oktober 1920), och 1921 erövrade den själva Guangxi. Det återupplivade parlamentet i Kanton valde Sun till ”extraordinarie president” i april 1921, men Chen motsatte sig Suns planer på ett fälttåg mot norr, och den 16 juni 1922 besköt hans trupper Suns residens i Kanton; Sun flydde till en kanonbåt och senare till Shanghai. Sun vände sig därefter till Sovjetunionen för att få hjälp, vilket ledde till den första enhetsfronten med Kinas kommunistiska parti och militärakademin i Whampoa.
