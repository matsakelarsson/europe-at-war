The Finnish army did not stop at the old border. In September the Army of Karelia advanced into Soviet East Karelia, reached the Svir river between Lakes Ladoga and Onega and crossed it to hold a bridgehead on the southern bank, where it expected to meet German troops coming from the south. They never arrived. The German drive took Tikhvin in November but was thrown back in December. The Finns took Petrozavodsk, the Karelian capital, on 1 October and Medvezhyegorsk at the northern end of Lake Onega in early December, after which Mannerheim halted the offensive.: Den finska armén stannade inte vid den gamla gränsen. I september ryckte Karelska armén in i sovjetiska Östkarelen, nådde floden Svir mellan Ladoga och Onega och gick över den för att hålla ett brohuvud på södra stranden, där den väntade sig att möta tyska trupper som kom söderifrån. De kom aldrig. Den tyska offensiven intog Tichvin i november men kastades tillbaka i december. Finländarna intog Petrozavodsk, Karelens huvudstad, den 1 oktober och Medvezjegorsk vid Onegas norra ände i början av december, varefter Mannerheim avbröt offensiven.
Many Finnish leaders hoped to annex East Karelia, home to Finnic Karelians and Vepsians, as part of a Greater Finland. A military administration ran the occupied area. Its Finnic inhabitants were favoured, while many of its ethnic Russians, nearly a third of those who had stayed, were held in internment camps, where thousands died of hunger and disease, most of them in 1942. Of about 64,000 Soviet prisoners of war taken by Finland, at least 18,000 died in Finnish camps. From 1942 the front settled into trench warfare that lasted until the summer of 1944.: Många finländska ledare hoppades kunna annektera Östkarelen, hem för östersjöfinska karelare och vepser, som en del av ett Storfinland. En militärförvaltning styrde det ockuperade området. Dess östersjöfinska invånare gynnades, medan många av de etniska ryssarna, nästan en tredjedel av dem som stannat kvar, hölls i interneringsläger, där tusentals dog av svält och sjukdomar, de flesta 1942. Av omkring 64 000 sovjetiska krigsfångar som Finland tog dog minst 18 000 i finländska läger. Från 1942 övergick fronten i ett ställningskrig som varade till sommaren 1944.
