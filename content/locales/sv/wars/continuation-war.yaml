Finland’s leaders had secretly coordinated with Germany since late 1940, and German troops were already in northern Finland when Germany invaded the Soviet Union on 22 June 1941. When Soviet aircraft bombed Finnish towns and airfields on 25 June, the government declared that Finland was at war. In the far north, German and Finnish troops attacked towards Murmansk and the railway south of it in Operation Silver Fox, but they were stopped on the Litsa river and in the forests east of Salla, short of their goals. The Soviet base at Hanko, cut off, was besieged until its garrison left by sea in December.: Finlands ledare hade i hemlighet samordnat sig med Tyskland sedan slutet av 1940, och tyska trupper fanns redan i norra Finland när Tyskland invaderade Sovjetunionen den 22 juni 1941. När sovjetiska flygplan bombade finländska städer och flygfält den 25 juni förklarade regeringen att Finland befann sig i krig. Längst i norr anföll tyska och finländska trupper mot Murmansk och järnvägen söder om staden i operation Silberfuchs, men de hejdades vid floden Litsa och i skogarna öster om Salla, utan att ha nått sina mål. Den avskurna sovjetiska basen i Hangö belägrades tills dess garnison lämnade den sjövägen i december.
The Finnish Army of Karelia attacked north of Lake Ladoga on 10 July, reached the lake’s shore within a week and took Sortavala in mid-August. On the Karelian Isthmus the Finns attacked in August, surrounded Soviet divisions on the north-western shore of Ladoga, which escaped by boat, and retook Viipuri on 29 August. By the end of the month they had reached the 1939 border and in places gone beyond it. Most Finns saw this as winning back what had been taken in 1940. The army, however, went further.: Den finska Karelska armén anföll norr om Ladoga den 10 juli, nådde sjöns strand inom en vecka och intog Sortavala i mitten av augusti. På Karelska näset anföll finländarna i augusti, inringade sovjetiska divisioner på Ladogas nordvästra strand, vilka undkom med båt, och återtog Viborg den 29 augusti. Vid månadens slut hade de nått 1939 års gräns och på sina håll gått förbi den. De flesta finländare såg detta som ett återvinnande av det som tagits 1940. Armén gick dock längre.
