Finland was never formally allied to Germany. It fought as a co-belligerent and coordinated its operations with the German army, and Finnish writers long presented the war as a separate conflict that continued the Winter War.: Finland var aldrig formellt allierat med Tyskland. Landet förde krig som medkrigförande och samordnade sina operationer med den tyska armén, och finländska skribenter framställde länge kriget som en separat konflikt som var en fortsättning på vinterkriget.
Places in the lands ceded in 1940 are given their Finnish names. Viipuri is now Vyborg in Russia. The Finnish administration called Petrozavodsk Äänislinna and Medvezhyegorsk Karhumäki.: Orter i de områden som avträddes 1940 ges sina finska namn, utom där ett etablerat svenskt namn finns. Viborg (finska Viipuri) heter i dag Vyborg och ligger i Ryssland. Den finska förvaltningen kallade Petrozavodsk Äänislinna och Medvezjegorsk Karhumäki.
The base map shows the lands retaken in 1941 as Finnish until 1944. The occupation of East Karelia beyond the 1939 border is drawn as an area, and it and the front lines are approximate.: Grundkartan visar de områden som återtogs 1941 som finska fram till 1944. Ockupationen av Östkarelen bortom 1939 års gräns ritas som ett område, och både det och frontlinjerna är ungefärliga.
