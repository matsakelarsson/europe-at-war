Continuation War: Fortsättningskriget
A war between Finland and the Soviet Union fought alongside Germany’s war in the east, in which Finland retook the lands lost in the Winter War and occupied much of East Karelia in 1941. A Soviet offensive in 1944 drove the Finns back until it was stopped at Tali-Ihantala, and in the Moscow Armistice of 19 September 1944 Finland restored the 1940 border, ceded Petsamo and leased Porkkala to the Soviet Union.: Ett krig mellan Finland och Sovjetunionen som fördes parallellt med Tysklands krig i öster, där Finland 1941 återtog de områden som gått förlorade i vinterkriget och ockuperade en stor del av Östkarelen. En sovjetisk offensiv 1944 trängde tillbaka finländarna tills den hejdades vid Tali-Ihantala, och i vapenstilleståndet i Moskva den 19 september 1944 återställde Finland 1940 års gräns, avträdde Petsamo och arrenderade ut Porkala till Sovjetunionen.
