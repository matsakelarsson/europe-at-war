Finland broke off relations with Germany on 2 September, and a ceasefire came into force on 4–5 September. The armistice, signed in Moscow on 19 September, restored the border of 1940 and gave Petsamo, Finland’s outlet to the Arctic Ocean, to the Soviet Union. Porkkala, a peninsula just west of Helsinki, was leased to the Soviet Union for 50 years as a naval base in place of Hanko. Finland agreed to pay reparations, later fixed at 300 million US dollars in goods over six years, and to disarm or expel the German troops still in the country, which led to the Lapland War.: Finland bröt förbindelserna med Tyskland den 2 september, och ett eldupphör trädde i kraft den 4–5 september. Vapenstilleståndet, som undertecknades i Moskva den 19 september, återställde 1940 års gräns och gav Petsamo, Finlands utlopp mot Norra ishavet, till Sovjetunionen. Porkala, en halvö strax väster om Helsingfors, arrenderades ut till Sovjetunionen på 50 år som flottbas i stället för Hangö. Finland gick med på att betala krigsskadestånd, senare fastställt till 300 miljoner amerikanska dollar i varor under sex år, och att avväpna eller fördriva de tyska trupper som fanns kvar i landet, vilket ledde till Lapplandskriget.
Finland also had to legalise the Communist Party, ban organisations the Soviet Union considered fascist, put its wartime leaders on trial and accept an Allied Control Commission led by the Soviet Union. About 63,000 Finns had been killed or gone missing in the war, and Soviet losses are put at 250,000–305,000 dead or missing. The Karelians who had returned home, some 260,000 people, had to leave again. Finland was not occupied and kept its democratic institutions. The Paris Peace Treaty of 1947 confirmed the new border, and the Soviet Union gave Porkkala back in January 1956.: Finland måste också legalisera kommunistpartiet, förbjuda organisationer som Sovjetunionen ansåg fascistiska, ställa sina krigstida ledare inför rätta och godta en allierad kontrollkommission ledd av Sovjetunionen. Omkring 63 000 finländare hade stupat eller försvunnit i kriget, och de sovjetiska förlusterna uppskattas till 250 000–305 000 döda eller saknade. De karelare som hade återvänt hem, omkring 260 000 människor, måste lämna sina hem igen. Finland ockuperades inte och behöll sina demokratiska institutioner. Fredsfördraget i Paris 1947 bekräftade den nya gränsen, och Sovjetunionen återlämnade Porkala i januari 1956.
