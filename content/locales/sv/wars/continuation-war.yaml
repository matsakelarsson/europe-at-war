On the Karelian Isthmus the Finnish army halted at the end of August 1941, roughly at the old border and some 30 km from the centre of Leningrad. On 8 September German troops took Shlisselburg on the southern shore of Lake Ladoga, closing the land blockade of the city. Hitler wanted the Finns to attack Leningrad from the north, but Mannerheim and the government refused, and the Finnish line stayed where it was until 1944. Whether Finland thereby spared the city or helped to starve it is still debated. Its army closed the northern side of the ring and tied down Soviet troops.: På Karelska näset stannade den finska armén i slutet av augusti 1941, ungefär vid den gamla gränsen och omkring 30 km från Leningrads centrum. Den 8 september intog tyska trupper Sjlisselburg på Ladogas södra strand och slöt därmed landblockaden av staden. Hitler ville att finländarna skulle anfalla Leningrad norrifrån, men Mannerheim och regeringen vägrade, och den finska linjen låg kvar där den var till 1944. Om Finland därigenom skonade staden eller bidrog till att svälta ut den är fortfarande omdebatterat. Dess armé stängde ringens norra sida och band sovjetiska trupper.
Leningrad’s only link with the rest of the country ran across Lake Ladoga, between the German and Finnish lines, by boat in summer and over the ice, on the “Road of Life”, in winter. Finnish, German and Italian boats tried to cut the lake route in 1942 without success. By one widely cited count about 640,000 civilians died in the city and some 400,000 more during evacuation, most of them of hunger in the winter of 1941–1942. The Red Army opened a narrow land corridor south of the lake in January 1943 and broke the German siege lines in January 1944, after 872 days.: Leningrads enda förbindelse med resten av landet gick över Ladoga, mellan de tyska och finska linjerna, med båt på sommaren och över isen, på ”Livets väg”, på vintern. Finländska, tyska och italienska båtar försökte utan framgång skära av sjövägen 1942. Enligt en ofta citerad beräkning dog omkring 640 000 civila i staden och ytterligare omkring 400 000 under evakueringen, de flesta av svält vintern 1941–1942. Röda armén öppnade en smal landkorridor söder om sjön i januari 1943 och bröt de tyska belägringslinjerna i januari 1944, efter 872 dagar.
