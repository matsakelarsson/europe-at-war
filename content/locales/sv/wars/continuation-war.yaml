On 9 June 1944, three days after the Allied landings in Normandy, the Red Army opened a massive offensive on the Karelian Isthmus with one of the heaviest bombardments of the war, at Valkeasaari. It broke the first Finnish line at once and the second, the VT line, at Kuuterselkä within a week, and on 20 June retook Viipuri almost without a fight. President Risto Ryti then gave Germany his personal pledge not to make a separate peace, in return for German anti-tank weapons, assault guns and aircraft. Further north the Red Army attacked in East Karelia from 21 June, and the Finns withdrew, giving up Petrozavodsk on 28 June.: Den 9 juni 1944, tre dagar efter de allierades landstigning i Normandie, inledde Röda armén en väldig offensiv på Karelska näset med en av krigets kraftigaste artilleriförberedelser, vid Valkeasaari. Den bröt genast igenom den första finska linjen och inom en vecka den andra, VT-linjen, vid Kuuterselkä, och den 20 juni återtog den Viborg nästan utan strid. President Risto Ryti gav då Tyskland sitt personliga löfte att inte sluta separatfred, i utbyte mot tyska pansarvärnsvapen, stormkanoner och flygplan. Längre norrut anföll Röda armén i Östkarelen från den 21 juni, och finländarna drog sig tillbaka och gav upp Petrozavodsk den 28 juni.
North-east of Viipuri, between Tali and Ihantala, Finnish troops with German air support stopped the Soviet advance in the largest battle in Nordic history, fought from 25 June to 9 July. The Finns also held the Vuoksi at Vuosalmi and the Bay of Viipuri, and in August they encircled and mauled two Soviet divisions at Ilomantsi. The front stabilised, and with its forces needed for the advance on Germany, the Soviet leadership agreed to talks. Ryti resigned on 1 August and Mannerheim became president, which freed Finland from Ryti’s pledge.: Nordost om Viborg, mellan Tali och Ihantala, hejdade finska trupper med tyskt flygstöd den sovjetiska framryckningen i Nordens största slag, som utkämpades från den 25 juni till den 9 juli. Finländarna höll också Vuoksen vid Vuosalmi och Viborgska viken, och i augusti inringade och tilltygade de två sovjetiska divisioner vid Ilomants. Fronten stabiliserades, och eftersom styrkorna behövdes för framryckningen mot Tyskland gick den sovjetiska ledningen med på förhandlingar. Ryti avgick den 1 augusti och Mannerheim blev president, vilket befriade Finland från Rytis löfte.
