Corfu incident: Korfukrisen
A crisis between Greece and Fascist Italy in 1923, after the Italian general Enrico Tellini, marking the Greek–Albanian border for the Conference of Ambassadors, was murdered with members of his staff on Greek soil. Italian warships shelled Corfu, killing some 16 civilians, many of them refugees from Anatolia, and Italian troops occupied the island until Mussolini, defying the League of Nations, won an apology and 50 million lire from Greece through the Conference of Ambassadors, an early sign of the League’s weakness against a great power.: En kris mellan Grekland och det fascistiska Italien 1923, sedan den italienske generalen Enrico Tellini, som märkte ut den grekisk-albanska gränsen på uppdrag av ambassadörskonferensen, mördats tillsammans med medlemmar av sin stab på grekisk mark. Italienska örlogsfartyg besköt Korfu och dödade omkring 16 civila, många av dem flyktingar från Anatolien, och italienska trupper ockuperade ön tills Mussolini, i trots mot Nationernas förbund, genom ambassadörskonferensen tvingade fram en ursäkt och 50 miljoner lire från Grekland, ett tidigt tecken på förbundets svaghet gentemot en stormakt.
