In Denmark’s civil war, the Count’s Feud, Lübeck tried to restore the deposed Christian II. Gustav Vasa, deep in debt to Lübeck, sided with the Danish nobles and Duke Christian, later Christian III. Swedish troops took Halmstad in October 1534 and won at Helsingborg in January 1535, and in June 1535 a Swedish, Danish and Prussian fleet beat Lübeck’s ships off Bornholm. Lübeck’s defeat broke its grip on the Swedish economy.: I Danmarks inbördeskrig, grevefejden, försökte Lübeck återinsätta den avsatte Kristian II. Gustav Vasa, djupt skuldsatt till Lübeck, ställde sig på de danska adelsmännens och hertig Kristians, sedermera Kristian III:s, sida. Svenska trupper intog Halmstad i oktober 1534 och segrade vid Helsingborg i januari 1535, och i juni 1535 slog en svensk, dansk och preussisk flotta Lübecks fartyg utanför Bornholm. Lübecks nederlag bröt dess grepp om den svenska ekonomin.
Gustav’s heavy taxes and his Lutheran Reformation provoked the most serious revolt of his reign. In 1542 Nils Dacke led the peasants of Småland in a rising that almost toppled the king. Gustav’s Swedish and German troops crushed it in 1543, and Dacke was killed that August.: Gustavs tunga skatter och hans lutherska reformation framkallade det allvarligaste upproret under hans regering. År 1542 ledde Nils Dacke smålandsböndernas resning, som nästan störtade kungen. Gustavs svenska och tyska trupper krossade den 1543, och Dacke dödades i augusti samma år.
