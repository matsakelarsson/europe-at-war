Count’s Feud and Dacke War: Grevefejden och Dackefejden
Denmark’s civil war of 1534–1536, in which Lübeck tried to restore the deposed Christian II and Christian III won the throne with Swedish help and then made Denmark–Norway Lutheran, followed by the Dacke War, the great peasant rising in Småland against Gustav Vasa in 1542–1543.: Danmarks inbördeskrig 1534–1536, där Lübeck försökte återinsätta den avsatte Kristian II och Kristian III vann tronen med svensk hjälp och därefter gjorde Danmark–Norge lutherskt, följt av Dackefejden, det stora bondeupproret i Småland mot Gustav Vasa 1542–1543.
