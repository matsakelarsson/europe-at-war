June 1535: juni 1535
One of the first sea battles fought with guns alone, remembered as the Swedish navy’s first big victory.: Ett av de första sjöslagen som utkämpades enbart med kanoner, ihågkommet som den svenska flottans första stora seger.
The rising spread through the forests of Småland. Dacke fell in August 1543 in the parish of Gullabo.: Resningen spred sig genom Smålands skogar. Dacke föll i augusti 1543 i Gullabo socken.
The civil war began in 1534, when Lübeck, under its mayor Jürgen Wullenwever, hired Count Christopher of Oldenburg to restore the imprisoned Christian II. Copenhagen and Malmö opened their gates to him, and in north Jutland the privateer Skipper Clement raised the peasants, who beat the nobles at Svenstrup in October. The frightened nobles of Jutland and Funen chose the Lutheran Duke Christian of Holstein as king. His general, Johan Rantzau, stormed Aalborg on 18 December 1534, killing some 2,000 people, and crushed the rising.: Inbördeskriget började 1534, när Lübeck under sin borgmästare Jürgen Wullenwever anlitade greve Kristoffer av Oldenburg för att återinsätta den fängslade Kristian II. Köpenhamn och Malmö öppnade sina portar för honom, och på norra Jylland fick kaparen Skipper Clement bönderna att resa sig, och de slog adeln vid Svenstrup i oktober. De skrämda adelsmännen på Jylland och Fyn valde den lutherske hertig Kristian av Holstein till kung. Hans fältherre Johan Rantzau stormade Ålborg den 18 december 1534, dödade omkring 2 000 människor och krossade resningen.
In June 1535 Rantzau destroyed the Count’s army at Øksnebjerg on Funen, while the allied fleet beat Lübeck’s at sea. Christian III then besieged Copenhagen for a year. Malmö gave in in April 1536, and Copenhagen, starving, surrendered on 29 July. Christian used his victory to carry out the Reformation. In August he had the Catholic bishops arrested; an assembly in October deposed them and gave their estates to the crown, and a Lutheran church order followed in 1537. Norway, whose archbishop had opposed Christian III, lost its own council of the realm and was ruled from Copenhagen as part of the Danish realm.: I juni 1535 förintade Rantzau grevens här vid Øksnebjerg på Fyn, medan den allierade flottan besegrade Lübecks till sjöss. Kristian III belägrade sedan Köpenhamn i ett år. Malmö gav upp i april 1536, och det utsvultna Köpenhamn kapitulerade den 29 juli. Kristian utnyttjade sin seger till att genomföra reformationen. I augusti lät han arrestera de katolska biskoparna; en församling i oktober avsatte dem och gav deras gods till kronan, och en luthersk kyrkoordning följde 1537. Norge, vars ärkebiskop hade motsatt sig Kristian III, förlorade sitt eget riksråd och styrdes från Köpenhamn som en del av det danska riket.
