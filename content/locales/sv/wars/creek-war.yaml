# Svenska översättningar av katalogtexten (våg 14); stegtexterna kommer senare.
Creek War: Creekkriget
? A civil war within the Muscogee (Creek) Confederacy that became a war with the United States, in present-day Alabama and Georgia. The Red Sticks, a movement strongest in the Upper Creek towns and inspired in part by Tecumseh’s visit in 1811 and by Muscogee prophets, rejected the American ways and land cessions that the Creek National Council and the United States agent Benjamin Hawkins promoted. After the council executed Red Stick warriors who had killed settlers, fighting broke out among the Creeks in 1813. Mississippi militia attacked a Red Stick party returning with Spanish arms at Burnt Corn Creek in July, and on 30 August 1813 the Red Sticks took Fort Mims, killing some 250 to 500 militiamen, settlers, Creeks of the council side and enslaved people. Armies from Tennessee, Georgia and Mississippi Territory invaded the Creek country, with Cherokee, Choctaw and allied Creek warriors; Andrew Jackson’s Tennessee army destroyed Red Stick towns and on 27 March 1814 broke the Red Sticks at Horseshoe Bend, where more than 800 of them died. By the Treaty of Fort Jackson of 9 August 1814 Jackson made the Creek Nation, including his own Creek allies, cede some 21 to 23 million acres, about half of present-day Alabama and part of southern Georgia. Many Red Sticks fled to Spanish Florida and joined the Seminole.
: Ett inbördeskrig inom Muscogeeförbundet (creekförbundet) som blev ett krig mot USA, i nuvarande Alabama och Georgia. Red Sticks, en rörelse som var starkast i de övre creekbyarna och som delvis inspirerades av Tecumsehs besök 1811 och av muscogeeprofeter, förkastade det amerikanska levnadssätt och de landavträdelser som creekernas nationalråd och USA:s agent Benjamin Hawkins främjade. Sedan rådet hade avrättat Red Stick-krigare som dödat nybyggare bröt strider ut bland creekerna 1813. Milis från Mississippi anföll en grupp Red Sticks som återvände med spanska vapen vid Burnt Corn Creek i juli, och den 30 augusti 1813 intog Red Sticks Fort Mims och dödade omkring 250 till 500 milismän, nybyggare, creeker på rådets sida och förslavade. Arméer från Tennessee, Georgia och Mississippiterritoriet invaderade creekernas land, med krigare från cherokeserna, choctaw och allierade creeker; Andrew Jacksons armé från Tennessee förstörde Red Stick-byar och krossade den 27 mars 1814 Red Sticks vid Horseshoe Bend, där mer än 800 av dem dog. Genom fördraget i Fort Jackson den 9 augusti 1814 tvingade Jackson creeknationen, inklusive hans egna allierade creeker, att avträda omkring 21 till 23 miljoner acres, ungefär halva nuvarande Alabama och en del av södra Georgia. Många Red Sticks flydde till Spanska Florida och slöt sig till seminolerna.
