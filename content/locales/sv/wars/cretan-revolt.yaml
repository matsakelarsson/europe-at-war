Crete had stayed Ottoman when Greece became independent, and its Christian majority rose again in 1841 and 1858. The reforms promised after the Crimean War came slowly, and in 1866 a quarrel over the property of the monasteries brought matters to a head. Assemblies of Christian notables petitioned the Sultan, and on 21 August 1866 they proclaimed a revolt and union with Greece. The insurgents, joined by volunteers from Greece, took most of the countryside, while the Ottomans held the fortified towns of the north coast. Egypt’s Khedive Ismail sent a large force of infantry to help put the rising down.: Kreta hade förblivit osmanskt när Grekland blev självständigt, och dess kristna majoritet reste sig på nytt 1841 och 1858. De reformer som utlovats efter Krimkriget kom långsamt, och 1866 ställde en tvist om klostrens egendomar saken på sin spets. Församlingar av kristna notabiliteter vände sig till sultanen med en petition, och den 21 augusti 1866 utropade de uppror och union med Grekland. Upprorsmännen, förstärkta av frivilliga från Grekland, tog större delen av landsbygden, medan osmanerna höll de befästa städerna på nordkusten. Egyptens khediv Ismail sände en stor infanteristyrka för att hjälpa till att slå ned resningen.
The monastery of Arkadi, near Rethymno, was a centre of the revolt. On 8 November 1866 an Ottoman army of perhaps 15,000 men with artillery attacked it; inside were 964 people, of whom 259 were armed men and most of the rest women and children. On the second day the attackers broke in, and the defenders set fire to the powder magazine, killing themselves and many of the soldiers. About 864 of those in the monastery died and 114 were taken prisoner; Ottoman losses are put at about 1,500. Reported abroad by telegraph, the “holocaust of Arkadi” caused outrage, and volunteers from Italy, France, Hungary and Serbia joined the Cretans.: Klostret Arkadi nära Rethymno var ett centrum för upproret. Den 8 november 1866 anföll en osmansk här på kanske 15 000 man med artilleri klostret; därinne fanns 964 människor, av vilka 259 var beväpnade män och de flesta av de övriga kvinnor och barn. Andra dagen bröt sig angriparna in, och försvararna satte eld på krutförrådet och dödade sig själva och många av soldaterna. Omkring 864 av dem som befann sig i klostret dog och 114 togs till fånga; de osmanska förlusterna anges till omkring 1 500. När nyheten spreds utomlands per telegraf väckte ”förintelsen vid Arkadi” upprördhet, och frivilliga från Italien, Frankrike, Ungern och Serbien anslöt sig till kretensarna.
In May 1867 Omer Pasha’s troops overran the Lasithi plateau in the east, and from October 1867 the grand vizier, Âli Pasha, spent four months on the island, building blockhouses and offering reform. His Organic Law of 1868 gave the Christians a large share in local government. Greek ships kept running guns to the rebels until a conference of the powers in Paris in early 1869 made Greece stop, and by then most rebel leaders had submitted.: I maj 1867 intog Omer pashas trupper Lasithiplatån i öster, och från oktober 1867 tillbringade storvesiren Âli pasha fyra månader på ön, där han lät bygga blockhus och erbjöd reformer. Hans organiska lag från 1868 gav de kristna en stor andel i den lokala förvaltningen. Grekiska fartyg fortsatte att smuggla vapen till rebellerna tills en stormaktskonferens i Paris i början av 1869 tvingade Grekland att upphöra, och då hade de flesta rebelledarna redan underkastat sig.
