Cretan Revolt of 1866–1869: Kretensiska upproret 1866–1869
The largest of the nineteenth-century Christian risings in Ottoman Crete, which sought union with Greece. Ottoman and Egyptian troops held the towns and slowly won back the countryside; the destruction of the Arkadi monastery in November 1866, where defenders blew up the powder magazine, turned European opinion towards the Cretans, and the revolt ended in 1869 with a new Organic Law that gave the Christians a share in governing the island.: Det största av 1800-talets kristna uppror på det osmanska Kreta, som strävade efter union med Grekland. Osmanska och egyptiska trupper höll städerna och återtog långsamt landsbygden; förstörelsen av klostret Arkadi i november 1866, där försvararna sprängde krutförrådet, vände den europeiska opinionen till kretensarnas fördel, och upproret upphörde 1869 med en ny organisk lag som gav de kristna en andel i styret av ön.
