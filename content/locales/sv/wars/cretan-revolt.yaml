Also called the Great Cretan Revolution. Numbers at Arkadi come from the commonly cited count of those in the monastery; the Ottoman losses there are an estimate.: Kallas även den stora kretensiska revolutionen. Siffrorna för Arkadi bygger på den vanligen citerade räkningen av dem som befann sig i klostret; de osmanska förlusterna där är en uppskattning.
