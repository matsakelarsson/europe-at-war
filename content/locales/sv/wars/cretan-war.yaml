The siege of Candia: Belägringen av Candia
Dates are Gregorian. Morosini agreed the terms of surrender on 5–6 September 1669; the city was handed over on 27 September.: Datum anges enligt gregoriansk kalender. Morosini godtog kapitulationsvillkoren den 5–6 september 1669; staden överlämnades den 27 september.
Casualty figures for the siege of Candia come mostly from Venetian and other Christian accounts and are uncertain. The war was also fought in Dalmatia, where Venice lost Novigrad in 1646 but in 1647–1648 retook it, beat off an Ottoman siege of Šibenik and took the fortress of Klis.: Förlustsiffrorna för belägringen av Candia kommer mest från venetianska och andra kristna källor och är osäkra. Kriget utkämpades också i Dalmatien, där Venedig förlorade Novigrad 1646 men 1647–1648 återtog staden, slog tillbaka en osmansk belägring av Šibenik och intog fästningen Klis.
