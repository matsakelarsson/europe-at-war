Ottoman fleet: Osmanska flottan
Unable to drive the Ottomans out of Crete, Venice tried to cut their supply line by blockading the Dardanelles, through which troops and stores sailed from Constantinople. The blockade was hard to keep up with oared galleys, and Ottoman convoys often got through. Still, Venetian fleets won most of the fights at sea, among them a three-day battle off Naxos in July 1651, and in 1655 Francesco Morosini raided Aegina and burned the port of Volos. The Ottomans began to add sailing warships, galleons, to their fleet of galleys.: Eftersom Venedig inte kunde driva osmanerna från Kreta försökte republiken skära av deras underhållslinje genom att blockera Dardanellerna, genom vilka trupper och förnödenheter seglade från Konstantinopel. Blockaden var svår att upprätthålla med rodda galärer, och osmanska konvojer tog sig ofta igenom. Ändå vann venetianska flottor de flesta striderna till sjöss, bland dem ett tredagarsslag utanför Naxos i juli 1651, och 1655 plundrade Francesco Morosini Aegina och brände hamnen i Volos. Osmanerna började komplettera sin galärflotta med segelkrigsfartyg, galeoner.
On 26 June 1656 a Venetian and Maltese fleet under Lorenzo Marcello caught Kenan Pasha’s larger fleet coming out of the straits and destroyed it, the worst Ottoman naval defeat since Lepanto. Marcello was killed, but some 5,000 Christian galley slaves were freed, and Venice took the islands of Tenedos and Lemnos. The new grand vizier, Köprülü Mehmed Pasha, restored Ottoman fortunes. In July 1657 a new three-day battle at the straits ended when the Venetian flagship blew up, killing its commander, Lazzaro Mocenigo, and the Ottomans retook both islands.: Den 26 juni 1656 överraskade en venetiansk och maltesisk flotta under Lorenzo Marcello Kenan pashas större flotta när den kom ut ur sundet och förintade den, det värsta osmanska sjönederlaget sedan Lepanto. Marcello stupade, men omkring 5 000 kristna galärslavar befriades, och Venedig tog öarna Tenedos och Lemnos. Den nye storvesiren Köprülü Mehmed pasha vände osmanernas lycka. I juli 1657 slutade ett nytt tredagarsslag vid sundet med att det venetianska flaggskeppet sprängdes i luften och dess befälhavare Lazzaro Mocenigo omkom, och osmanerna återtog båda öarna.
