Cretan War: Kretensiska kriget
The fifth Ottoman–Venetian war, also called the War of Candia, in which the Ottoman Empire took Crete from Venice. The Ottomans landed in 1645 and overran most of the island within three years, but the capital, Candia, held out for over twenty years while the Venetian fleet fought to blockade the Dardanelles. With help from the papacy, Malta and France, Venice won most of the battles at sea, yet in 1669 Francesco Morosini surrendered Candia after one of the longest sieges in history.: Det femte osmansk-venetianska kriget, även kallat Candiakriget, där Osmanska riket tog Kreta från Venedig. Osmanerna landsteg 1645 och erövrade större delen av ön inom tre år, men huvudstaden Candia höll stånd i mer än tjugo år medan den venetianska flottan kämpade för att blockera Dardanellerna. Med hjälp från påvestolen, Malta och Frankrike vann Venedig de flesta sjöslagen, men 1669 överlämnade Francesco Morosini Candia efter en av historiens längsta belägringar.
