On 28 September 1644 galleys of the Knights of Malta captured an Ottoman convoy bound for Egypt with pilgrims for Mecca aboard, among them the former chief black eunuch of the sultan’s palace, who was killed. The knights stopped briefly on the south coast of Venetian Crete before sailing home with their captives. Sultan Ibrahim’s government accused Venice of complicity and prepared a great fleet, which it said was bound for Malta. Instead it appeared off Crete on 23 June 1645 and landed an army west of Chania.: Den 28 september 1644 kapade galärer från Malteserorden en osmansk konvoj på väg till Egypten med pilgrimer till Mecka ombord, bland dem den förre överste svarte eunucken i sultanens palats, som dödades. Riddarna gjorde ett kort uppehåll på det venetianska Kretas sydkust innan de seglade hem med sina fångar. Sultan Ibrahims regering anklagade Venedig för medskyldighet och rustade en stor flotta, som enligt uppgift skulle till Malta. I stället dök den upp utanför Kreta den 23 juni 1645 och landsatte en här väster om Chania.
Chania surrendered on 22 August after a siege of about two months, and the Venetian relief efforts, joined by papal, Tuscan, Neapolitan and Maltese galleys, came too late. In 1646 the Ottomans took Rethymno, whose citadel surrendered in November, and by early 1648 they held the whole island except Candia and a few fortified islets. Plague and war killed a large part of Crete’s people; by one estimate almost two-fifths had died by 1648.: Chania kapitulerade den 22 augusti efter en belägring på omkring två månader, och de venetianska undsättningsförsöken, som fick stöd av påvliga, toskanska, neapolitanska och maltesiska galärer, kom för sent. År 1646 tog osmanerna Rethymno, vars citadell kapitulerade i november, och i början av 1648 behärskade de hela ön utom Candia och några befästa holmar. Pest och krig dödade en stor del av Kretas befolkning; enligt en uppskattning hade nästan två femtedelar dött 1648.
