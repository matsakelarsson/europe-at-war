Crete, occupied by the Ottomans except Candia and island forts: Kreta, ockuperat av osmanerna utom Candia och öfästena
The siege of Candia began in May 1648, but for years it was more a blockade than a siege, as the Ottomans lacked the strength to take the city’s great bastions and Venice could still bring in supplies by sea. A French corps came in 1660 and achieved little. Once peace with the emperor was made at Vasvár in 1664, the grand vizier Köprülü Fazıl Ahmed Pasha came to Crete himself with fresh troops, and from May 1667 the Ottomans pressed the siege with mines and assaults, met by countermines and sorties. By one Venetian count about 108,000 Ottomans and 29,000 defenders died in the last phase of the siege.: Belägringen av Candia inleddes i maj 1648, men i åratal var den mer en blockad än en belägring, eftersom osmanerna saknade styrka att ta stadens väldiga bastioner och Venedig fortfarande kunde föra in förnödenheter sjövägen. En fransk kår kom 1660 och uträttade föga. Sedan fred slutits med kejsaren i Vasvár 1664 kom storvesiren Köprülü Fazıl Ahmed pasha själv till Kreta med nya trupper, och från maj 1667 drev osmanerna på belägringen med minor och stormningar, som besvarades med motminor och utfall. Enligt en venetiansk beräkning dog omkring 108 000 osmaner och 29 000 försvarare under belägringens sista skede.
In June 1669 a French force of some 6,000 men under the Duke of Beaufort landed, but its sortie on 25 June was thrown back and Beaufort was killed. A French warship blew up by accident in July, and in August the French sailed away. Francesco Morosini, with only a few thousand fit men left, agreed terms early in September, and on 27 September Candia was handed over. Its people were allowed to leave with their belongings. Venice kept three island forts off Crete and some gains in Dalmatia, including Klis.: I juni 1669 landsteg en fransk styrka på omkring 6 000 man under hertigen av Beaufort, men dess utfall den 25 juni slogs tillbaka och Beaufort stupade. Ett franskt krigsfartyg sprängdes av misstag i juli, och i augusti seglade fransmännen bort. Francesco Morosini, som bara hade några tusen stridsdugliga man kvar, godtog villkor i början av september, och den 27 september överlämnades Candia. Invånarna fick lämna staden med sina ägodelar. Venedig behöll tre öfästen utanför Kreta och vissa vinster i Dalmatien, däribland Klis.
