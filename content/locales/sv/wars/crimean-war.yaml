Through the winter both armies suffered terribly from cold, hunger and disease. Reports by the war correspondent William Howard Russell turned British opinion against the government, which fell in January 1855, and Florence Nightingale led nurses at the army hospital at Scutari. Nicholas I died in March and was succeeded by Alexander II. The Kingdom of Sardinia joined the allies and sent some 18,000 men. Ottoman troops beat off a Russian attack on Yevpatoria in February, and in May an allied expedition took Kerch and opened the Sea of Azov.: Under vintern led båda arméerna svårt av kyla, hunger och sjukdomar. Krigskorrespondenten William Howard Russells reportage vände den brittiska opinionen mot regeringen, som föll i januari 1855, och Florence Nightingale ledde sjuksköterskorna vid arméns sjukhus i Scutari. Nikolaj I dog i mars och efterträddes av Alexander II. Kungariket Sardinien anslöt sig till de allierade och sände omkring 18 000 man. Osmanska trupper slog tillbaka ett ryskt anfall mot Jevpatorija i februari, och i maj intog en allierad expedition Kertj och öppnade Azovska sjön.
An allied assault on the Malakhov and the Redan on 18 June failed with heavy losses. Admiral Nakhimov was mortally wounded in July. A Russian attempt to break the siege was beaten by French and Sardinian troops on the Chernaya on 16 August. After a massive bombardment, French troops under General Patrice de MacMahon stormed the Malakhov on 8 September, while the British attack on the Redan failed. That night the Russians blew up their forts, sank their remaining ships and withdrew across a pontoon bridge to the north side of the harbour.: En allierad stormning av Malachov och Redan den 18 juni misslyckades med svåra förluster. Amiral Nachimov blev dödligt sårad i juli. Ett ryskt försök att bryta belägringen slogs tillbaka av franska och sardiska trupper vid Tjornaja den 16 augusti. Efter ett massivt bombardemang stormade franska trupper under general Patrice de MacMahon Malachov den 8 september, medan det brittiska anfallet mot Redan misslyckades. Samma natt sprängde ryssarna sina fästningsverk, sänkte sina återstående fartyg och drog sig tillbaka över en pontonbro till hamnens norra sida.
