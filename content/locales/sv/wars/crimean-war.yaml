On 14 September 1854 more than 50,000 British, French and Ottoman troops landed at Kalamita Bay, north of Sevastopol. Six days later they drove Prince Aleksandr Menshikov’s army from the heights above the Alma, with some 9,000 killed and wounded on both sides. Instead of attacking at once, the allies marched round to the south of the city, the British taking Balaklava as their base and the French the bays near Kamiesch. The Russians sank ships across the harbour mouth, and sailors, soldiers and townspeople guided by the engineer Eduard Totleben built earthworks around the city. The siege began in October.: Den 14 september 1854 landsteg mer än 50 000 brittiska, franska och osmanska soldater i Kalamitabukten norr om Sevastopol. Sex dagar senare drev de furst Aleksandr Mensjikovs armé från höjderna ovanför Alma, med omkring 9 000 döda och sårade på båda sidor. I stället för att anfalla genast marscherade de allierade runt till stadens södra sida, där britterna tog Balaklava som bas och fransmännen vikarna vid Kamiesch. Ryssarna sänkte fartyg tvärs över hamninloppet, och sjömän, soldater och stadsbor under ledning av ingenjören Eduard Totleben byggde jordverk kring staden. Belägringen inleddes i oktober.
On 25 October Russian forces attacked towards Balaklava. They took redoubts held by Ottoman troops, but the 93rd Highlanders, the “thin red line”, and the Heavy Brigade stopped their cavalry. A misunderstood order then sent the British Light Brigade charging down a valley into Russian guns, with heavy losses. On 5 November, in thick fog, Russian columns attacked the British on the heights at Inkerman. The fighting broke up into a “soldiers’ battle” until French troops arrived, and the Russians lost some 11,000 men. Then winter came, and a storm on 14 November sank supply ships at Balaklava.: Den 25 oktober anföll ryska styrkor mot Balaklava. De tog skansar som hölls av osmanska trupper, men 93:e höglandsregementet, den ”tunna röda linjen”, och den tunga brigaden stoppade deras kavalleri. En missförstådd order skickade sedan den brittiska lätta brigaden i en anfallsritt nedför en dal rakt mot ryska kanoner, med svåra förluster. Den 5 november, i tät dimma, anföll ryska kolonner britterna på höjderna vid Inkerman. Striderna upplöstes i ett ”soldaternas slag” tills franska trupper anlände, och ryssarna förlorade omkring 11 000 man. Sedan kom vintern, och en storm den 14 november sänkte förrådsfartyg vid Balaklava.
