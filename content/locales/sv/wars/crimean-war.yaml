In 1854 a large British fleet under Admiral Sir Charles Napier, joined by a French squadron, sailed into the Baltic to blockade Russia’s ports. It judged Kronstadt, the sea fortress guarding Saint Petersburg, too strong to attack. In the Gulf of Bothnia British ships burned tar, timber and shipping at Oulu and Raahe in Finland, but at Kokkola local men and soldiers drove off their boats. In August about 10,000 French troops and British marines landed in the Åland Islands and besieged the unfinished fortress of Bomarsund, which surrendered on 16 August and was blown up.: År 1854 seglade en stor brittisk flotta under amiral sir Charles Napier, förstärkt av en fransk eskader, in i Östersjön för att blockera Rysslands hamnar. Den bedömde Kronstadt, sjöfästningen som skyddade Sankt Petersburg, som för stark att anfalla. I Bottenviken brände brittiska fartyg tjära, timmer och fartyg i Uleåborg och Brahestad i Finland, men i Gamlakarleby drev ortsbor och soldater bort deras båtar. I augusti landsteg omkring 10 000 franska soldater och brittiska marinsoldater på Åland och belägrade den ofullbordade fästningen Bomarsund, som kapitulerade den 16 augusti och sprängdes.
The allies returned in 1855 under Admiral Richard Dundas and Rear-Admiral Charles Pénaud. Near Kronstadt several British ships were damaged by Russian sea mines, among the first used in war. On 9–11 August 1855 the fleet bombarded Sveaborg, the island fortress off Helsinki, for two days with mortars and rockets, causing fires and explosions, but made no attempt to land. Sweden, invited to join the allies, stayed neutral. After the war a convention attached to the Treaty of Paris forbade fortifications on Åland, and the islands remain demilitarised.: De allierade återvände 1855 under amiral Richard Dundas och konteramiral Charles Pénaud. Nära Kronstadt skadades flera brittiska fartyg av ryska sjöminor, bland de första som användes i krig. Den 9–11 augusti 1855 bombarderade flottan Sveaborg, öfästningen utanför Helsingfors, i två dygn med mörsare och raketer och orsakade bränder och explosioner, men gjorde inget försök att landstiga. Sverige, som inbjudits att ansluta sig till de allierade, förblev neutralt. Efter kriget förbjöd en konvention som fogades till Parisfreden befästningar på Åland, och öarna är fortfarande demilitariserade.
