In March 1854 Russian troops crossed the lower Danube into Dobruja, and in May an army of up to 90,000 under Field Marshal Ivan Paskevich laid siege to Silistra. The fortress was held by 12,000–18,000 Ottoman and Egyptian troops, helped by a few British officers, and it held out for six weeks. Meanwhile British and French troops landed at Varna, and Austria, alarmed by a Russian advance towards the Balkans, massed troops on its borders and demanded that Russia leave the principalities.: I mars 1854 gick ryska trupper över nedre Donau in i Dobrudzja, och i maj belägrade en armé på upp till 90 000 man under fältmarskalk Ivan Paskevitj Silistra. Fästningen försvarades av 12 000–18 000 osmanska och egyptiska soldater, med hjälp av några brittiska officerare, och höll stånd i sex veckor. Under tiden landsteg brittiska och franska trupper i Varna, och Österrike, oroat av en rysk framryckning mot Balkan, samlade trupper vid sina gränser och krävde att Ryssland skulle lämna furstendömena.
On 23 June, hours before a planned assault, the Russians lifted the siege on Nicholas I’s orders and withdrew north of the Danube. Ottoman troops beat a Russian force on the islands at Giurgiu in July. By August the Russians had left Moldavia and Wallachia, which Austrian troops occupied until 1857. Cholera killed thousands of British and French soldiers around Varna and in a French expedition into Dobruja. With the Danube secure, the allies decided to attack Sevastopol, the base of Russia’s Black Sea Fleet.: Den 23 juni, timmar före en planerad stormning, hävde ryssarna belägringen på Nikolaj I:s order och drog sig tillbaka norr om Donau. Osmanska trupper besegrade en rysk styrka på öarna vid Giurgiu i juli. I augusti hade ryssarna lämnat Moldavien och Valakiet, som österrikiska trupper sedan ockuperade fram till 1857. Kolera dödade tusentals brittiska och franska soldater kring Varna och under en fransk expedition in i Dobrudzja. Med Donau säkrad beslöt de allierade att anfalla Sevastopol, Rysslands svartahavsflottas bas.
