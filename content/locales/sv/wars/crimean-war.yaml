Kerch expedition: Kertjexpeditionen
In June 1855 General Nikolay Muravyov besieged Kars, the main Ottoman fortress in eastern Anatolia, defended by Ottoman troops under the British general William Fenwick Williams. A Russian assault on 29 September was beaten off with heavy losses. Omar Pasha landed an army in Abkhazia to relieve the city by way of Mingrelia but advanced too slowly, and on 28 November the starving garrison surrendered. Facing an Austrian threat to join the allies, Alexander II agreed to make peace.: I juni 1855 belägrade general Nikolaj Muravjov Kars, den främsta osmanska fästningen i östra Anatolien, som försvarades av osmanska trupper under den brittiske generalen William Fenwick Williams. En rysk stormning den 29 september slogs tillbaka med svåra förluster. Omar pasha landsatte en armé i Abchazien för att undsätta staden via Mingrelien men ryckte fram för långsamt, och den 28 november kapitulerade den svältande garnisonen. Inför ett österrikiskt hot om att ansluta sig till de allierade gick Alexander II med på att sluta fred.
By the Treaty of Paris, signed on 30 March 1856, the Black Sea was made neutral and closed to warships, with no naval arsenals on its shores. Russia returned Kars and gave the southern part of Bessarabia, at the mouths of the Danube, to Moldavia, and the allies returned Sevastopol. Moldavia and Wallachia were placed under the guarantee of all the powers instead of Russia’s protection. Hundreds of thousands of soldiers had died, most of them from disease. Defeat helped push Alexander II towards reforms, above all the abolition of serfdom in 1861.: Genom Parisfreden, undertecknad den 30 mars 1856, gjordes Svarta havet neutralt och stängdes för örlogsfartyg, utan flottarsenaler vid dess stränder. Ryssland återlämnade Kars och avträdde den södra delen av Bessarabien, vid Donaus mynningar, till Moldavien, och de allierade återlämnade Sevastopol. Moldavien och Valakiet ställdes under samtliga stormakters garanti i stället för under ryskt beskydd. Hundratusentals soldater hade dött, de flesta av sjukdomar. Nederlaget bidrog till att driva Alexander II mot reformer, framför allt livegenskapens avskaffande 1861.
