A quarrel between Catholic and Orthodox monks over the holy places in Palestine, backed by France and Russia, grew into a crisis when Nicholas I demanded the right to protect all the Orthodox subjects of the sultan. When the Ottomans refused, Russian troops occupied Moldavia and Wallachia in July 1853, and Britain and France sent fleets to the Dardanelles. The Ottoman Empire declared war in October. Omar Pasha’s army crossed the Danube and on 4 November held off a Russian attack at Oltenița.: En tvist mellan katolska och ortodoxa munkar om de heliga platserna i Palestina, med stöd av Frankrike respektive Ryssland, växte till en kris när Nikolaj I krävde rätten att beskydda alla sultanens ortodoxa undersåtar. När osmanerna vägrade ockuperade ryska trupper Moldavien och Valakiet i juli 1853, och Storbritannien och Frankrike sände flottor till Dardanellerna. Osmanska riket förklarade krig i oktober. Omar pashas armé gick över Donau och slog den 4 november tillbaka ett ryskt anfall vid Oltenița.
On 30 November Admiral Pavel Nakhimov’s squadron attacked an Ottoman squadron at anchor in Sinop on the Anatolian coast and destroyed it with explosive shells. Nearly 3,000 Ottomans were killed, and part of the town burned. In the Caucasus Russian forces defeated Ottoman armies at Akhaltsikhe and Başgedikler. In Britain the press called Sinop a massacre. In January 1854 the British and French fleets entered the Black Sea, and at the end of March both countries declared war on Russia.: Den 30 november anföll amiral Pavel Nachimovs eskader en osmansk eskader som låg för ankar i Sinope på den anatoliska kusten och förintade den med explosiva granater. Nära 3 000 osmaner dödades, och en del av staden brann. I Kaukasus besegrade ryska styrkor osmanska arméer vid Achaltsiche och Başgedikler. I Storbritannien kallade pressen Sinope för en massaker. I januari 1854 gick den brittiska och den franska flottan in i Svarta havet, och i slutet av mars förklarade båda länderna Ryssland krig.
