Dates are New Style (Gregorian). Russia used the Julian calendar, then 12 days behind, so Russian sources date the Battle of Sinop to 18 November 1853 and the fall of the Malakhov to 27 August 1855.: Datum anges enligt den nya stilen (gregoriansk kalender). Ryssland använde den julianska kalendern, som då låg 12 dagar efter, så ryska källor daterar slaget vid Sinope till den 18 november 1853 och Malachovs fall till den 27 augusti 1855.
Numbers of dead are estimates. Most of the soldiers who died were killed by cholera, dysentery, typhus and the cold rather than in battle.: Antalet döda är uppskattningar. De flesta soldater som dog dukade under för kolera, dysenteri, tyfus och kyla snarare än i strid.
Places in Crimea are given their usual English names of the time. Crimea is part of Ukraine; Sevastopol, Balaklava and Yevpatoria were then Russian.: Orter på Krim anges med sina vanliga namn från tiden. Krim är en del av Ukraina; Sevastopol, Balaklava och Jevpatorija var då ryska.
