Crimean War: Krimkriget
A war in which the Ottoman Empire, Britain, France and later Sardinia fought the Russian Empire, fearing Russian power over the declining Ottoman state. Fought on the Danube, in the Caucasus, in the Baltic and above all in Crimea, where Sevastopol fell after a siege of nearly a year, it ended with the Treaty of Paris in 1856, which barred warships from the Black Sea.: Ett krig där Osmanska riket, Storbritannien, Frankrike och senare Sardinien bekämpade Ryska riket av fruktan för rysk makt över den försvagade osmanska staten. Det utkämpades vid Donau, i Kaukasus, i Östersjön och framför allt på Krim, där Sevastopol föll efter en nästan årslång belägring, och avslutades med Parisfreden 1856, som stängde Svarta havet för örlogsfartyg.
