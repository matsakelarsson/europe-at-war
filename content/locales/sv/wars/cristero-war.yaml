# Svenska översättningar av katalogtexten (våg 14); stegtexterna kommer senare.
Cristero War: Cristerokriget
? A Catholic rising against the anticlerical laws of the Mexican revolutionary state, fought mainly in the west-central states of Jalisco, Michoacán, Guanajuato, Colima, Zacatecas and Aguascalientes. The 1917 constitution barred the Church from owning property and from running schools, banned religious orders and public worship outside churches and let the states limit the number of priests. President Plutarco Elías Calles enforced these articles strictly, and when the Calles Law of June 1926 set penalties for breaking them, the bishops suspended public worship from 31 July 1926. Armed risings began in August and spread after a call to arms on 1 January 1927. The rebels, mostly rancheros and peasants, called themselves Cristeros after their cry “¡Viva Cristo Rey!” (Long live Christ the King); by 1929 they had perhaps 50,000 men under arms, supplied with ammunition by the women of the Brigades of Saint Joan of Arc, and held much of the countryside of Jalisco. The federal army, with agrarista militias and arms from the United States, held the towns. Both sides killed prisoners and civilians. After the assassination of President-elect Álvaro Obregón by a Catholic militant in 1928, the US ambassador Dwight Morrow brokered the arreglos (arrangements) of 21 June 1929 between the bishops and President Emilio Portes Gil, which allowed worship to resume without repealing the laws. The Cristeros, who had not been consulted, laid down their arms. About 90,000 combatants died, and many civilians; hundreds of Cristero leaders were killed after the amnesty, and a second, smaller rising followed in the 1930s.
: En katolsk resning mot den mexikanska revolutionsstatens antiklerikala lagar, utkämpad främst i delstaterna Jalisco, Michoacán, Guanajuato, Colima, Zacatecas och Aguascalientes i västra centrala Mexiko. Konstitutionen från 1917 förbjöd kyrkan att äga egendom och driva skolor, förbjöd religiösa ordnar och offentlig gudstjänst utanför kyrkorna och lät delstaterna begränsa antalet präster. President Plutarco Elías Calles tillämpade dessa artiklar strikt, och när Calleslagen i juni 1926 införde straff för brott mot dem ställde biskoparna in den offentliga gudstjänsten från den 31 juli 1926. Väpnade resningar började i augusti och spred sig efter en uppmaning till väpnad kamp den 1 januari 1927. Rebellerna, mest rancheros och bönder, kallade sig cristeros efter sitt stridsrop ”¡Viva Cristo Rey!” (Leve Kristus konungen); 1929 hade de kanske 50 000 man under vapen, som fick ammunition av kvinnorna i den heliga Jeanne d’Arcs brigader, och de kontrollerade stora delar av landsbygden i Jalisco. Den federala armén, med agraristmiliser och vapen från USA, höll städerna. Båda sidor dödade fångar och civila. Sedan den nyvalde presidenten Álvaro Obregón hade mördats av en katolsk militant 1928 förmedlade den amerikanske ambassadören Dwight Morrow de arreglos (överenskommelser) som slöts den 21 juni 1929 mellan biskoparna och president Emilio Portes Gil och som lät gudstjänsterna återupptas utan att lagarna upphävdes. Cristeros, som inte hade tillfrågats, lade ned vapnen. Omkring 90 000 stridande dog, och många civila; hundratals cristeroledare dödades efter amnestin, och en andra, mindre resning följde på 1930-talet.
