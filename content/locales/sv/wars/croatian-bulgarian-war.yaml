Croatian–Bulgarian war: Kroatisk-bulgariska kriget
A short war between Simeon I of Bulgaria and King Tomislav of Croatia. After annexing Serbia in 924, Simeon regarded Croatia, which sheltered Serbian exiles and was allied to Byzantium, as a threat to his rear, and in 926 he sent an army under Alogobotur against it. The Croats destroyed it in the mountains of eastern Bosnia, in what is called the battle of the Bosnian Highlands. Papal envoys led by Bishop Madalbert arranged a peace after Simeon’s death in 927, with no change of borders.: Ett kort krig mellan Simeon I av Bulgarien och kung Tomislav av Kroatien. Sedan Simeon annekterat Serbien 924 betraktade han Kroatien, som gav skydd åt serbiska landsflyktingar och var allierat med Bysans, som ett hot i ryggen, och 926 sände han en här under Alogobotur mot landet. Kroaterna förintade den i bergen i östra Bosnien, i det som kallas slaget i det bosniska höglandet. Påvliga sändebud under biskop Madalbert förmedlade en fred efter Simeons död 927, utan gränsförändringar.
