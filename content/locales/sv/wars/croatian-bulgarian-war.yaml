The only accounts are Byzantine, in Constantine VII’s De administrando imperio and Theophanes Continuatus. The battlefield is unknown, and the date of 27 May 926 found in some modern works is uncertain. Constantine VII’s figures for the Croatian army (100,000 foot and 60,000 horse) are generally thought greatly exaggerated.: De enda berättelserna är bysantinska, i Konstantin VII:s De administrando imperio och Theophanes Continuatus. Slagfältet är okänt, och datumet 27 maj 926 som förekommer i vissa moderna verk är osäkert. Konstantin VII:s siffror för den kroatiska hären (100 000 fotsoldater och 60 000 ryttare) anses allmänt vara kraftigt överdrivna.
Simeon’s wider war with Byzantium is told in the Byzantine–Bulgarian war of 913–927.: Simeons större krig mot Bysans skildras i Bysantinsk-bulgariska kriget 913–927.
