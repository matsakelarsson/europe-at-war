Hundred Years’ Croatian–Ottoman War: Hundraåriga kroatisk-osmanska kriget
? The name Croatian historians give to the century of border warfare between Croatia and the Ottoman Empire, from the defeat at Krbava Field to the victory at Sisak. On 9 September 1493 an army of Croatian nobles under Ban Emerik Derenčin tried to cut off Ottoman raiders returning from Carniola and was destroyed near Udbina; Derenčin was captured and many nobles died. Ottoman raids and conquests then ate away at Croatia for decades. Knin fell in 1522, Jajce in 1528, Požega in 1536, and Klis, defended by the Uskok captain Petar Kružić, in 1537; in the same year a Habsburg army under Johann Katzianer was destroyed at Gorjani in Slavonia. After Mohács the Croatian estates elected Ferdinand of Habsburg king at Cetin in 1527, and the frontier gradually became the Military Frontier, financed by the Austrian lands and garrisoned by soldiers and refugees, Croats, Vlachs and Serbs, settled as frontiersmen; Karlovac was founded as its stronghold in 1579. What remained free was called “the remnants of the remnants” of the old kingdom. The fall of Bihać in 1592 opened the way to the heartland, but on 22 June 1593 an army of Croatian, Slovene and Austrian troops destroyed the army of Hasan Pasha Predojević, governor of Bosnia, at Sisak. The battle started the Long Turkish War and is seen in Croatia as the end of the Ottoman advance.
: Det namn som kroatiska historiker ger det sekel av gränskrig mellan Kroatien och Osmanska riket som sträckte sig från nederlaget på Krbavafältet till segern vid Sisak. Den 9 september 1493 försökte en här av kroatiska adelsmän under banen Emerik Derenčin genskjuta osmanska plundrare på väg tillbaka från Krain och förintades nära Udbina; Derenčin tillfångatogs och många adelsmän stupade. Osmanska härjningståg och erövringar nötte sedan ned Kroatien i årtionden. Knin föll 1522, Jajce 1528, Požega 1536 och Klis, som försvarades av uskokkaptenen Petar Kružić, 1537; samma år förintades en habsburgsk här under Johann Katzianer vid Gorjani i Slavonien. Efter Mohács valde de kroatiska ständerna Ferdinand av Habsburg till kung i Cetin 1527, och gränsområdet blev efter hand Militärgränsen, som finansierades av de österrikiska länderna och bemannades av soldater och flyktingar, kroater, valaker och serber, som slog sig ned som gränsbönder; Karlovac grundades som dess fäste 1579. Det som förblev fritt kallades ”resterna av resterna” av det gamla kungariket. Bihaćs fall 1592 öppnade vägen till kärnlandet, men den 22 juni 1593 förintade en här av kroatiska, slovenska och österrikiska trupper vid Sisak den här som leddes av Hasan pasha Predojević, Bosniens guvernör. Slaget utlöste Långa turkiska kriget och ses i Kroatien som slutet på den osmanska framryckningen.
