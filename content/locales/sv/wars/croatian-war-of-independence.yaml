On 1 October 1991 the JNA attacked the Dubrovnik region from Montenegro and eastern Herzegovina, with many Montenegrin reservists in its ranks, while the Yugoslav Navy blockaded the coast. Cavtat fell on 16 October, and by the end of the month the army held almost all the land between the Pelješac peninsula and Prevlaka except Dubrovnik itself, defended at first by a few hundred poorly armed men. Villages in Konavle and the Dubrovnik hinterland were looted and burned.: Den 1 oktober 1991 anföll JNA Dubrovnikregionen från Montenegro och östra Hercegovina, med många montenegrinska reservister i leden, medan den jugoslaviska flottan blockerade kusten. Cavtat föll den 16 oktober, och vid månadens slut behärskade armén nästan allt land mellan halvön Pelješac och Prevlaka utom själva Dubrovnik, som till en början försvarades av några hundra dåligt beväpnade män. Byar i Konavle och Dubrovniks inland plundrades och brändes.
The city was shelled for months, most heavily on 6 December, when the walled Old Town, a World Heritage Site, was hit. The bombardment caused international outrage and helped bring about recognition of Croatia. About 16,000 refugees were evacuated by sea. In May 1992 the JNA pulled back into Herzegovina and handed its equipment to the Bosnian Serb army, and by the end of 1992 Croatian forces had retaken the whole region. The ICTY convicted the commanders Pavle Strugar and Miodrag Jokić for the attacks on the Old Town.: Staden besköts i månader, hårdast den 6 december, då den muromgärdade gamla staden, ett världsarv, träffades. Bombardemanget väckte internationell upprördhet och bidrog till att Kroatien erkändes. Omkring 16 000 flyktingar evakuerades sjövägen. I maj 1992 drog sig JNA tillbaka in i Hercegovina och överlämnade sin utrustning till den bosnienserbiska armén, och vid slutet av 1992 hade kroatiska styrkor återtagit hela regionen. ICTY dömde befälhavarna Pavle Strugar och Miodrag Jokić för anfallen mot gamla staden.
