Franjo Tuđman’s Croatian Democratic Union won Croatia’s first multi-party elections in spring 1990. Many of the republic’s Serbs, about an eighth of the population, feared the new government, and Belgrade’s media told them they faced persecution. On 17 August 1990 Serbs around Knin, led by Milan Babić and the local police chief Milan Martić, blocked the roads into Dalmatia with felled trees to protect a referendum on Serb autonomy. The “Log Revolution” cut the coast off from the rest of Croatia in the middle of the tourist season.: Franjo Tuđmans Kroatiska demokratiska unionen vann Kroatiens första flerpartival våren 1990. Många av republikens serber, omkring en åttondel av befolkningen, fruktade den nya regeringen, och medierna i Belgrad sade till dem att de hotades av förföljelse. Den 17 augusti 1990 blockerade serber kring Knin, ledda av Milan Babić och den lokala polischefen Milan Martić, vägarna in i Dalmatien med fällda träd för att skydda en folkomröstning om serbiskt självstyre. ”Stockrevolutionen” skar av kusten från resten av Kroatien mitt under turistsäsongen.
On 21 December the Serb-run municipalities of Knin, Benkovac, Obrovac, Gračac, Vojnić, Dvor and Kostajnica adopted a statute for a Serbian Autonomous Region (SAO) of Krajina. More than two hundred armed incidents followed. In March 1991 Krajina forces clashed with Croatian police at Pakrac, and on 31 March at the Plitvice Lakes, where the policeman Josip Jović and the Krajina fighter Rajko Vukadinović were killed. The next day the SAO Krajina declared that it was leaving Croatia to join Serbia, and the JNA moved in between the two sides.: Den 21 december antog de serbstyrda kommunerna Knin, Benkovac, Obrovac, Gračac, Vojnić, Dvor och Kostajnica en stadga för en serbisk autonom region (SAO) Krajina. Över tvåhundra väpnade incidenter följde. I mars 1991 drabbade Krajinastyrkor samman med kroatisk polis i Pakrac, och den 31 mars vid Plitvicesjöarna, där polismannen Josip Jović och Krajinakämpen Rajko Vukadinović dödades. Dagen därpå förklarade SAO Krajina att regionen lämnade Kroatien för att ansluta sig till Serbien, och JNA gick in mellan parterna.
