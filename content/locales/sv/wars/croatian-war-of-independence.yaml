Croatian War of Independence: Kroatiska självständighetskriget
The war that followed Croatia’s break with Yugoslavia. From August 1990 Serbs in the Knin region and other Serb-populated areas rose against the new Croatian government and set up the Serbian Autonomous Region of Krajina. After Croatia declared independence on 25 June 1991, the Yugoslav People’s Army (JNA) joined the rebels; by the end of the year Vukovar had been destroyed, Dubrovnik besieged and almost a third of Croatia taken, and most Croats and other non-Serbs had been driven out of the Serb-held areas. A UN-supervised ceasefire from January 1992 froze the front around the Republic of Serbian Krajina for three years. Croatia retook western Slavonia in May 1995 and the Krajina in Operation Storm that August, when most of its Serb population fled. Eastern Slavonia returned peacefully under the Erdut Agreement and a UN transitional administration, which ended in January 1998. More than 20,000 people were killed.: Kriget som följde på Kroatiens brytning med Jugoslavien. Från augusti 1990 reste sig serber i Kninregionen och andra serbbefolkade områden mot den nya kroatiska regeringen och upprättade Serbiska autonoma regionen Krajina. Sedan Kroatien förklarat sig självständigt den 25 juni 1991 anslöt sig Jugoslaviska folkarmén (JNA) till rebellerna; vid årets slut hade Vukovar förstörts, Dubrovnik belägrats och nästan en tredjedel av Kroatien intagits, och de flesta kroater och andra icke-serber hade fördrivits från de serbkontrollerade områdena. Ett FN-övervakat eldupphör från januari 1992 frös fronten kring Republiken Serbiska Krajina i tre år. Kroatien återtog västra Slavonien i maj 1995 och Krajina i Operation Storm i augusti samma år, då större delen av den serbiska befolkningen flydde. Östra Slavonien återgick fredligt genom Erdutavtalet och en övergångsförvaltning under FN, som upphörde i januari 1998. Mer än 20 000 människor dödades.
