After Storm only eastern Slavonia remained in Serb hands. Croatia made its return a condition of taking part in the Dayton peace talks, and the mediators pressed for a peaceful solution. The Erdut Agreement was signed on 12 November 1995 by Hrvoje Šarinić for Croatia and Milan Milanović for the local Serbs, acting on instructions from Belgrade, with the US ambassador Peter Galbraith and the UN mediator Thorvald Stoltenberg as witnesses. It provided for a transitional period under international rule, guarantees of minority rights and the return of refugees.: Efter Storm var endast östra Slavonien kvar i serbiska händer. Kroatien gjorde dess återlämnande till ett villkor för att delta i fredsförhandlingarna i Dayton, och medlarna drev på för en fredlig lösning. Erdutavtalet undertecknades den 12 november 1995 av Hrvoje Šarinić för Kroatien och Milan Milanović för de lokala serberna, som agerade på instruktioner från Belgrad, med USA:s ambassadör Peter Galbraith och FN-medlaren Thorvald Stoltenberg som vittnen. Det föreskrev en övergångsperiod under internationellt styre, garantier för minoriteters rättigheter och flyktingarnas återvändande.
The UN Security Council set up the Transitional Administration for Eastern Slavonia, Baranja and Western Syrmium (UNTAES) on 15 January 1996, with about 5,000 troops. It demilitarised the region, reformed its police, issued Croatian papers and held local elections in April 1997. On 15 January 1998 the region returned to Croatian rule. Its Serb and Croat communities, Vukovar’s above all, remain divided.: FN:s säkerhetsråd inrättade övergångsförvaltningen för Östslavonien, Baranja och Västra Syrmien (UNTAES) den 15 januari 1996, med omkring 5 000 soldater. Den demilitariserade regionen, reformerade dess polis, utfärdade kroatiska handlingar och höll lokalval i april 1997. Den 15 januari 1998 återgick regionen till kroatiskt styre. Dess serbiska och kroatiska befolkningsgrupper, framför allt i Vukovar, är fortfarande splittrade.
