The UN envoy Cyrus Vance negotiated a ceasefire signed in Geneva on 23 November 1991, which did not hold, and an implementation agreement signed in Sarajevo on 2 January 1992 by the JNA general Andrija Rašeta and Croatia’s defence minister Gojko Šušak, which did. Under the Vance plan the Serb-held areas became UN Protected Areas in four sectors, East, West, North and South, patrolled by the UN Protection Force (UNPROFOR) from spring 1992. The JNA was to leave, local forces to disarm and refugees to return.: FN-sändebudet Cyrus Vance förhandlade fram ett eldupphör som undertecknades i Genève den 23 november 1991, vilket inte höll, och ett genomförandeavtal som undertecknades i Sarajevo den 2 januari 1992 av JNA-generalen Andrija Rašeta och Kroatiens försvarsminister Gojko Šušak, vilket höll. Enligt Vanceplanen blev de serbkontrollerade områdena FN:s skyddade områden i fyra sektorer, Öst, Väst, Nord och Syd, som patrullerades av FN:s skyddsstyrka (UNPROFOR) från våren 1992. JNA skulle lämna området, de lokala styrkorna avväpnas och flyktingarna återvända.
Only the first part was carried out. The Krajina Serbs, who had proclaimed the Republic of Serbian Krajina on 19 December 1991, kept their weapons under police and army names, and few of the 170,000–250,000 Croats and other non-Serbs driven from the area could return. The European Community recognised Croatia on 15 January 1992, and it joined the UN on 22 May. The front now ran through a quarter of the country, and fighting flared at its edges, as on the Miljevci plateau in June.: Endast den första delen genomfördes. Krajinaserberna, som hade utropat Republiken Serbiska Krajina den 19 december 1991, behöll sina vapen under polisens och arméns namn, och få av de 170 000–250 000 kroater och andra icke-serber som fördrivits från området kunde återvända. Europeiska gemenskapen erkände Kroatien den 15 januari 1992, och landet blev medlem i FN den 22 maj. Fronten löpte nu genom en fjärdedel av landet, och strider blossade upp längs dess kanter, som på Miljevciplatån i juni.
