On 2 May 1991 Croatian police drove into an ambush at Borovo Selo near Vukovar; twelve policemen and one Serb fighter were killed. On 19 May 93 per cent of voters backed independence in a referendum, and Croatia declared independence on 25 June, the same day as Slovenia. Under the Brioni Declaration of 7 July both agreed to suspend their decisions for three months, but the fighting in Croatia only grew.: Den 2 maj 1991 körde kroatisk polis in i ett bakhåll i Borovo Selo nära Vukovar; tolv poliser och en serbisk kämpe dödades. Den 19 maj röstade 93 procent för självständighet i en folkomröstning, och Kroatien förklarade sig självständigt den 25 juni, samma dag som Slovenien. Genom Brionideklarationen den 7 juli gick båda med på att skjuta upp verkställandet av sina beslut i tre månader, men striderna i Kroatien bara tilltog.
While the JNA left Slovenia, in Croatia it increasingly fought alongside the rebels. Serb forces from eastern Slavonia attacked Dalj on 1 August, killing police and National Guard defenders who had surrendered, and by early August Serb forces had overrun much of Banovina. On 26 August the JNA, under Colonel Ratko Mladić, and Martić’s police took the Croatian village of Kijevo near Knin and burned it. The ICTY later found that the attack was meant to drive its Croat inhabitants out.: Medan JNA lämnade Slovenien stred armén i Kroatien alltmer sida vid sida med rebellerna. Serbiska styrkor från östra Slavonien anföll Dalj den 1 augusti och dödade poliser och nationalgardister som hade kapitulerat, och i början av augusti hade serbiska styrkor erövrat stora delar av Banovina. Den 26 augusti intog JNA, under överste Ratko Mladić, och Martićs polis den kroatiska byn Kijevo nära Knin och brände den. ICTY fann senare att anfallet syftade till att fördriva byns kroatiska invånare.
