The Serb-held strip around Maslenica left Dalmatia joined to northern Croatia only by ferries and the Pag bridge. On 22 January 1993 the Croatian army attacked, retaking the Maslenica crossing, Zemunik airport and the hinterland of Zadar, and on 28 January the Peruća dam, which Serb forces had mined. Croatian sources put the dead at 114 Croatian and 490 Serb soldiers. The villages of Islam Grčki, Kašić and Smoković were burned. The UN Security Council condemned the offensive.: Den serbkontrollerade remsan kring Maslenica gjorde att Dalmatien bara var förbundet med norra Kroatien genom färjor och bron till Pag. Den 22 januari 1993 gick den kroatiska armén till anfall och återtog övergången vid Maslenica, flygplatsen Zemunik och Zadars inland, och den 28 januari Perućadammen, som serbiska styrkor hade minerat. Kroatiska källor anger de döda till 114 kroatiska och 490 serbiska soldater. Byarna Islam Grčki, Kašić och Smoković brändes. FN:s säkerhetsråd fördömde offensiven.
On 9 September Croatian troops attacked the Medak Pocket, a Serb-held salient on the edge of Gospić from which the town was shelled. They took the villages of Divoselo, Čitluk and part of Počitelj, but under international pressure withdrew after a week; by UN and Canadian accounts they exchanged fire with Canadian peacekeepers moving in. The villages were destroyed. ICTY investigators found that at least 100 Serbs had been unlawfully killed; a Croatian court later convicted the commander Mirko Norac of failing to stop the killings of civilians and prisoners.: Den 9 september anföll kroatiska trupper Medakfickan, en serbkontrollerad utbuktning i utkanten av Gospić varifrån staden besköts. De intog byarna Divoselo, Čitluk och en del av Počitelj, men drog sig under internationellt tryck tillbaka efter en vecka; enligt FN:s och kanadensiska uppgifter utväxlade de eld med kanadensiska fredsbevarare som ryckte in. Byarna förstördes. ICTY:s utredare fann att minst 100 serber hade dödats olagligt; en kroatisk domstol dömde senare befälhavaren Mirko Norac för att inte ha stoppat dödandet av civila och fångar.
