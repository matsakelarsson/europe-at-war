A ceasefire in March 1994 and an economic agreement in December reopened the Zagreb–Belgrade motorway through western Slavonia, but Krajina leaders refused even to receive the Z-4 peace plan in January 1995. On 1 May the Croatian army launched Operation Flash and in three days took the 558 km² Serb-held salient around Okučani. Of about 14,000 Serbs there, most fled. In reply Krajina forces fired cluster rockets at Zagreb on 2 and 3 May, killing seven people; the ICTY convicted Martić for the attacks.: Ett eldupphör i mars 1994 och ett ekonomiskt avtal i december öppnade åter motorvägen Zagreb–Belgrad genom västra Slavonien, men Krajinas ledare vägrade ens att ta emot fredsplanen Z-4 i januari 1995. Den 1 maj inledde den kroatiska armén Operation Blixt och intog på tre dagar den 558 km² stora serbkontrollerade utbuktningen kring Okučani. Av de omkring 14 000 serberna där flydde de flesta. Som svar avfyrade Krajinastyrkorna klusterraketer mot Zagreb den 2 och 3 maj och dödade sju människor; ICTY dömde Martić för anfallen.
In late July Croatian and Bosnian Croat forces took Bosansko Grahovo and Glamoč in Bosnia, outflanking Knin. Operation Storm began on 4 August along a 630 km front. Knin fell the next day, and on 6 August Croatian troops linked up with the Bosnian army’s 5th Corps, ending the siege of Bihać. Within four days Croatia had retaken 10,400 km², the whole of the Krajina except eastern Slavonia.: I slutet av juli intog kroatiska och bosnienkroatiska styrkor Bosansko Grahovo och Glamoč i Bosnien och kringgick därmed Knin. Operation Storm inleddes den 4 augusti längs en 630 km lång front. Knin föll dagen därpå, och den 6 augusti förenades kroatiska trupper med den bosniska arméns 5:e kår, vilket gjorde slut på belägringen av Bihać. Inom fyra dagar hade Kroatien återtagit 10 400 km², hela Krajina utom östra Slavonien.
On 4 August the Krajina authorities ordered the evacuation of northern Dalmatia and Lika, and 150,000–200,000 Serbs fled to Bosnia and Serbia. Many of the elderly who stayed were killed in the following months, as at Grubori and Varivode, and villages were looted and burned; ICTY prosecutors put the civilian dead at 324, Serbian sources at 1,192. The tribunal convicted the generals Ante Gotovina and Mladen Markač in 2011, but acquitted them on appeal in 2012, rejecting the charge of a plan to expel the Serbs.: Den 4 augusti beordrade Krajinas myndigheter evakuering av norra Dalmatien och Lika, och 150 000–200 000 serber flydde till Bosnien och Serbien. Många av de äldre som stannade kvar dödades under de följande månaderna, som i Grubori och Varivode, och byar plundrades och brändes; ICTY:s åklagare angav antalet dödade civila till 324, serbiska källor till 1 192. Tribunalen dömde generalerna Ante Gotovina och Mladen Markač 2011 men frikände dem i andra instans 2012 och avvisade anklagelsen om en plan att fördriva serberna.
