From 14 September Croatian forces blockaded JNA barracks across the country and captured many, including all those of the Varaždin corps, gaining the heavy weapons they had lacked. The JNA answered with a full offensive. Vukovar on the Danube, held by about 1,800 guardsmen and volunteers, was besieged for 87 days by up to 36,000 troops and Serbian paramilitaries and reduced to ruins. On 7 October Yugoslav aircraft bombed the presidential palace in Zagreb; the next day Croatia cut its last ties with Yugoslavia.: Från den 14 september blockerade kroatiska styrkor JNA:s kaserner över hela landet och erövrade många, däribland samtliga som tillhörde Varaždinkåren, och kom därmed över de tunga vapen de hade saknat. JNA svarade med en fullskalig offensiv. Vukovar vid Donau, som försvarades av omkring 1 800 gardister och frivilliga, belägrades i 87 dagar av upp till 36 000 soldater och serbiska paramilitärer och lades i ruiner. Den 7 oktober bombade jugoslaviskt flyg presidentpalatset i Zagreb; dagen därpå bröt Kroatien sina sista band med Jugoslavien.
Vukovar fell on 18 November. About 3,000 people had died in the battle, and at least 20,000 inhabitants were expelled. On 20 November some 200 prisoners taken from the town’s hospital were shot at the Ovčara farm; the ICTY convicted the JNA officers Mile Mrkšić and Veselin Šljivančanin. Seventy Croat civilians were killed at Lovas in October, and 62 civilians and five prisoners at Škabrnja near Zadar on 18–19 November, crimes for which the tribunal convicted the Krajina leaders Babić and Martić.: Vukovar föll den 18 november. Omkring 3 000 människor hade dött i striderna, och minst 20 000 invånare fördrevs. Den 20 november sköts omkring 200 fångar som förts bort från stadens sjukhus vid gården Ovčara; ICTY dömde JNA-officerarna Mile Mrkšić och Veselin Šljivančanin. Sjuttio kroatiska civila dödades i Lovas i oktober, och 62 civila och fem fångar i Škabrnja nära Zadar den 18–19 november, brott för vilka tribunalen dömde Krajinaledarna Babić och Martić.
Serb civilians were also killed on the Croatian side. In October 100–120 people, most of them Serbs, were murdered in Gospić on the orders of local commanders, and in December soldiers killed 18 Serbs and a Hungarian at Paulin Dvor near Osijek; Croatian courts later convicted those responsible. In late 1991 Croatian offensives in western Slavonia, Otkos 10 and Orkan 91, retook much of the area the JNA had seized there.: Även serbiska civila dödades på den kroatiska sidan. I oktober mördades 100–120 människor, de flesta serber, i Gospić på order av lokala befälhavare, och i december dödade soldater 18 serber och en ungrare i Paulin Dvor nära Osijek; kroatiska domstolar dömde senare de ansvariga. I slutet av 1991 återtog kroatiska offensiver i västra Slavonien, Otkos 10 och Orkan 91, stora delar av det område som JNA erövrat där.
