Crusade of 1101: Korståget 1101
A second wave of crusaders, inspired by the capture of Jerusalem, who set out in 1100–1101 from Lombardy, France and Germany under leaders including Stephen of Blois, Stephen of Burgundy, William IX of Aquitaine and Welf IV of Bavaria, with Raymond of Toulouse as their guide. Crossing Anatolia in three separate armies in the summer of 1101, they were destroyed by Kilij Arslan I of Rum and the Danishmendids, at Mersivan in August and at Heraclea in August and September. Only a few survivors, among them several of the leaders, reached the Holy Land in 1102.: En andra våg av korsfarare, inspirerade av intagandet av Jerusalem, som 1100–1101 bröt upp från Lombardiet, Frankrike och Tyskland under ledare som Stefan av Blois, Stefan av Burgund, Vilhelm IX av Akvitanien och Welf IV av Bayern, med Raimond av Toulouse som vägvisare. När de sommaren 1101 tågade genom Anatolien i tre separata härar förintades de av Kılıç Arslan I av Rum och danishmendiderna, vid Mersivan i augusti och vid Herakleia i augusti och september. Endast ett fåtal överlevande, bland dem flera av ledarna, nådde Det heliga landet 1102.
