The fall of Tarnovo and Ottoman raids across the Danube led Sigismund of Hungary to appeal to the West, and with England and France at truce, French nobles answered eagerly. Duke Philip of Burgundy paid for much of the expedition and gave its command to his son John, Count of Nevers, aged 24, advised by veterans such as Enguerrand de Coucy, Jean de Vienne and Marshal Boucicaut. The French and Burgundians left Dijon on 30 April 1396 and joined Sigismund at Buda in July, together with German knights, Wallachians under Mircea the Elder and others; Venetian ships brought the Hospitallers of Rhodes into the Black Sea and up the Danube.: Tarnovos fall och osmanska härjningar över Donau fick Sigismund av Ungern att vädja till Västerlandet, och eftersom England och Frankrike hade stillestånd svarade franska adelsmän ivrigt. Hertig Filip av Burgund bekostade en stor del av expeditionen och gav befälet åt sin 24-årige son Johan, greve av Nevers, med veteraner som Enguerrand de Coucy, Jean de Vienne och marskalk Boucicaut som rådgivare. Fransmännen och burgunderna lämnade Dijon den 30 april 1396 och förenade sig med Sigismund i Buda i juli, tillsammans med tyska riddare, valaker under Mircea den äldre och andra; venetianska fartyg förde johanniterna från Rhodos in i Svarta havet och uppför Donau.
Rather than wait for Bayezid in Hungary, the crusaders marched down the Danube and crossed it at Orșova over eight days. Ivan Sratsimir opened Vidin to them, and the Turkish officers of its garrison were put to death. At Oryahovo (Rahova) the townspeople surrendered to Sigismund on promise of their lives, but the French sacked the town and massacred many of them, Turks and Bulgarians, keeping about a thousand for ransom. On 12 September the army reached Nicopolis, a strong fortress on a cliff above the river. Having brought no siege engines, it settled down to starve the garrison out.: I stället för att invänta Bayezid i Ungern tågade korsfararna nedför Donau och gick över floden vid Orșova under åtta dagar. Ivan Sratsimir öppnade Vidin för dem, och de turkiska officerarna i garnisonen avrättades. I Orjachovo (Rahova) kapitulerade invånarna inför Sigismund mot löfte om att få behålla livet, men fransmännen plundrade staden och massakrerade många av dem, turkar och bulgarer, och behöll omkring tusen för lösen. Den 12 september nådde hären Nikopolis, en stark fästning på en klippa ovanför floden. Eftersom man inte hade fört med sig några belägringsmaskiner slog man sig ned för att svälta ut garnisonen.
