Crusade of Nicopolis: Korståget mot Nikopolis
The great crusade of 1396, in which King Sigismund of Hungary and an army of French, Burgundian, German and other knights, with Wallachians, Hospitallers and a Venetian fleet, marched down the Danube to drive the Ottomans from the Balkans. After taking Vidin and Oryahovo they besieged Nicopolis, where on 25 September the army of Sultan Bayezid I and his Serbian vassals destroyed them. Bayezid had thousands of prisoners killed, and annexed Vidin, the last Bulgarian realm.: Det stora korståget 1396, där kung Sigismund av Ungern och en här av franska, burgundiska, tyska och andra riddare, tillsammans med valaker, johanniter och en venetiansk flotta, tågade nedför Donau för att driva osmanerna ut ur Balkan. Sedan de intagit Vidin och Orjachovo belägrade de Nikopolis, där sultan Bayezid I:s här och hans serbiska vasaller förintade dem den 25 september. Bayezid lät döda tusentals fångar och annekterade Vidin, det sista bulgariska riket.
