The Ottoman governor, Doğan Bey, held the fortress, sure that the sultan would come to his relief.: Den osmanske guvernören Doğan bej höll fästningen, säker på att sultanen skulle komma till undsättning.
Crusaders: Korsfarare
Bayezid broke off his blockade of Constantinople and came north through the Shipka Pass, joined by Stefan Lazarević and his Serbian knights. On 25 September the French insisted on leading the attack, against Sigismund’s advice to let the Wallachian infantry open the battle. Their knights rode down the Ottoman light troops and irregular infantry and then, many of them on foot after crossing lines of sharpened stakes, climbed the slope beyond, only to meet fresh Ottoman cavalry held in reserve at the top. Surrounded, Nevers and the surviving French surrendered.: Bayezid avbröt sin blockad av Konstantinopel och kom norrut genom Sjipkapasset, förstärkt av Stefan Lazarević och hans serbiska riddare. Den 25 september insisterade fransmännen på att leda anfallet, mot Sigismunds råd att låta det valakiska infanteriet inleda slaget. Deras riddare red ned de osmanska lätta trupperna och det irreguljära infanteriet och klättrade sedan, många av dem till fots sedan de tagit sig över rader av vässade pålar, uppför sluttningen bortom, bara för att möta nytt osmanskt kavalleri som hållits i reserv uppe på krönet. Omringade kapitulerade Nevers och de överlevande fransmännen.
The Wallachians and Transylvanians left the field, and Sigismund, the Hospitallers and the Germans were overwhelmed after the Serbian horsemen joined the battle. Sigismund escaped in a boat to the Venetian ships; many others drowned trying to reach them. Enraged by his losses and by the killing of prisoners at Oryahovo, Bayezid had several thousand captives put to death the next day, sparing the richest nobles, among them Nevers and Boucicaut, who were ransomed for 200,000 florins. Coucy died in captivity at Bursa. Bayezid then took Vidin and returned to his siege of Constantinople.: Valakerna och transsylvanierna lämnade slagfältet, och Sigismund, johanniterna och tyskarna överväldigades sedan de serbiska ryttarna ingripit i slaget. Sigismund flydde i en båt till de venetianska fartygen; många andra drunknade när de försökte nå dem. Rasande över sina förluster och över dödandet av fångar i Orjachovo lät Bayezid avrätta flera tusen fångar dagen därpå men skonade de rikaste adelsmännen, bland dem Nevers och Boucicaut, som löstes ut för 200 000 floriner. Coucy dog i fångenskap i Bursa. Bayezid tog sedan Vidin och återvände till sin belägring av Konstantinopel.
