Dates are Julian. The chroniclers give armies of 100,000 or more on each side; modern historians think each numbered perhaps 15,000 to 20,000. The reported English contingent seems never to have existed.: Datum anges enligt juliansk kalender. Krönikörerna uppger härar på 100 000 man eller fler på vardera sidan; moderna historiker anser att var och en kanske uppgick till 15 000–20 000 man. Den uppgivna engelska kontingenten tycks aldrig ha funnits.
The main accounts are French (Froissart, the Monk of Saint-Denis and others) and blame the defeat on the French knights’ haste; the young Johann Schiltberger, a Bavarian squire who survived the massacre, left an eyewitness account of it.: De viktigaste berättelserna är franska (Froissart, munken från Saint-Denis med flera) och lägger skulden för nederlaget på de franska riddarnas brådska; den unge Johann Schiltberger, en bayersk väpnare som överlevde massakern, lämnade en ögonvittnesskildring av den.
