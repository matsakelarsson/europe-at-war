The size of the armies is uncertain. The crusaders probably had about 20,000 men in 1444, including several thousand Wallachians; estimates for Murad’s army at Varna range from 40,000 to 60,000 or more.: Härarnas storlek är osäker. Korsfararna hade troligen omkring 20 000 man 1444, däribland flera tusen valaker; uppskattningarna av Murads här vid Varna varierar från 40 000 till 60 000 man eller fler.
Whether the king broke his word is still argued over. Before the truce was sworn, Cardinal Cesarini had Władysław declare in advance that any treaty with the sultan was void, so that it could be ratified without stopping the crusade. Ottoman tradition says that Murad fought at Varna with the broken treaty fixed to his standard.: Huruvida kungen bröt sitt ord är fortfarande omdebatterat. Innan stilleståndet besvors lät kardinal Cesarini Władysław i förväg förklara varje fördrag med sultanen ogiltigt, så att det kunde ratificeras utan att korståget avbröts. Enligt osmansk tradition stred Murad vid Varna med det brutna fördraget fäst vid sin fana.
Władysław’s death was not witnessed by his own men and his body was never found, which gave rise to legends that he survived.: Władysławs död bevittnades inte av hans egna män och hans kropp återfanns aldrig, vilket gav upphov till legender om att han överlevt.
