Crusade of Varna: Korståget mot Varna
The last great crusade against the Ottomans in the Balkans, led by Władysław III, king of Poland and Hungary, and John Hunyadi. Their “long campaign” of 1443 reached the Balkan Mountains before winter drove them back, and in 1444 Sultan Murad II agreed to a ten-year truce that restored the Serbian despotate. Urged on by the papal legate, the king renounced the truce and marched to the Black Sea, where on 10 November 1444 the crusaders were crushed at Varna and Władysław was killed.: Det sista stora korståget mot osmanerna på Balkan, lett av Władysław III, kung av Polen och Ungern, och Johan Hunyadi. Deras ”långa fälttåg” 1443 nådde Balkanbergen innan vintern tvingade dem tillbaka, och 1444 gick sultan Murad II med på ett tioårigt stillestånd som återupprättade det serbiska despotatet. Pådriven av påvens legat sade kungen upp stilleståndet och tågade till Svarta havet, där korsfararna krossades vid Varna den 10 november 1444 och Władysław stupade.
