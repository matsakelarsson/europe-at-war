Since 1439 the Ottomans had annexed the Serbian despotate and besieged Belgrade, and Hunyadi, the voivode of Transylvania, had beaten their raiders in 1441 and 1442. Pope Eugene IV proclaimed a crusade on 1 January 1443, and in October Władysław, Hunyadi and the exiled despot Đurađ Branković crossed into Serbia with a Hungarian, Polish and Serbian army, counting on the Ottoman cavalry having gone home after the harvest. Hunyadi’s vanguard defeated the Ottoman forces near Niš on 2 or 3 November, and the crusaders marched on to Sofia. In the confusion, Skanderbeg and his Albanians left the Ottoman army and rode home to Krujë.: Sedan 1439 hade osmanerna annekterat det serbiska despotatet och belägrat Belgrad, och Hunyadi, vojvod av Transsylvanien, hade slagit deras plundrare 1441 och 1442. Påven Eugenius IV utlyste ett korståg den 1 januari 1443, och i oktober gick Władysław, Hunyadi och den landsflyktige despoten Đurađ Branković in i Serbien med en ungersk, polsk och serbisk här, i förlitan på att det osmanska kavalleriet hade gått hem efter skörden. Hunyadis förtrupp besegrade de osmanska styrkorna nära Niš den 2 eller 3 november, och korsfararna tågade vidare mot Sofia. I förvirringen lämnade Skanderbeg och hans albaner den osmanska hären och red hem till Krujë.
Beyond Sofia the Ottomans burned the countryside and blocked the passes over the Balkan Mountains. On 12 December, in deep snow and bitter cold, the crusaders failed to break through at the Zlatitsa pass and turned back. On 2 or 5 January 1444 they ambushed their pursuers at Kunovica, between Niš and Pirot, and captured Mahmud Bey, the sultan’s brother-in-law and brother of the grand vizier. The army reached Buda in February to a heroes’ welcome; the setback at Zlatitsa was played down.: Bortom Sofia brände osmanerna landsbygden och spärrade passen över Balkanbergen. Den 12 december misslyckades korsfararna, i djup snö och bitande kyla, med att bryta igenom vid Zlatitsapasset och vände tillbaka. Den 2 eller 5 januari 1444 lade de sig i bakhåll för sina förföljare vid Kunovica, mellan Niš och Pirot, och tillfångatog Mahmud bej, sultanens svåger och storvesirens bror. Hären nådde Buda i februari och mottogs som hjältar; bakslaget vid Zlatitsa tonades ned.
