Crusaders: Korsfarare
The Christian fleet failed to stop Murad, recalled from retirement, from bringing his Anatolian army across the Bosporus on 18 October, and he marched north to cut the crusaders off. On 9 November they found him behind them near Varna, trapped between the sea, Lake Varna and the hills. Hunyadi drew up the army in an arc between the lake and the heights, with the wagon fort behind.: Den kristna flottan lyckades inte hindra Murad, som kallats tillbaka från sin avgång, från att föra sin anatoliska här över Bosporen den 18 oktober, och han tågade norrut för att skära av korsfararna. Den 9 november fann de honom bakom sig nära Varna, instängda mellan havet, Varnasjön och bergen. Hunyadi ställde upp hären i en båge mellan sjön och höjderna, med vagnborgen bakom.
On 10 November the Ottoman light cavalry drove in the crusader right wing, many of whom died in the marshes; Cesarini disappeared in the rout. Hunyadi held the left, but the twenty-year-old king, ignoring his advice, charged the janissaries in the Ottoman centre with his Polish household knights. Władysław was killed and his head was shown to his army, which broke. Hunyadi escaped, only to be held for a time in Wallachia by Vlad Dracul. Thousands of crusaders were killed or captured, and no Western army would try again to drive the Ottomans out of the Balkans for many years.: Den 10 november drev det osmanska lätta kavalleriet tillbaka korsfararnas högra flygel, och många av dem omkom i träsken; Cesarini försvann under flykten. Hunyadi höll den vänstra flygeln, men den tjugoårige kungen anföll, utan att lyssna på hans råd, janitsjarerna i den osmanska mitten med sina polska livriddare. Władysław stupade och hans huvud visades för hans här, som upplöstes. Hunyadi kom undan, bara för att en tid hållas kvar i Valakiet av Vlad Dracul. Tusentals korsfarare dödades eller tillfångatogs, och på många år skulle ingen västerländsk här åter försöka driva osmanerna ut ur Balkan.
