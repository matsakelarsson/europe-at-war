Władysław and Hunyadi: Władysław och Hunyadi
Retreat: Återtåg
Under pressure from his Serbian wife Mara and from Mahmud Bey’s family, and threatened by Karaman in Anatolia, Murad II offered peace. The terms agreed at Edirne on 12 June 1444 returned the Serbian despotate, with Smederevo, Golubac and some two dozen towns, to Branković as an Ottoman vassal, released his two blinded sons and set a ten-year truce with Hungary. At the same time, Cardinal Julian Cesarini, the papal legate, kept pressing for a new crusade, and the Venetians and the pope were preparing a fleet to close the straits.: Under tryck från sin serbiska hustru Mara och från Mahmud bejs familj, och hotad av Karaman i Anatolien, erbjöd Murad II fred. Villkoren som överenskoms i Edirne den 12 juni 1444 återlämnade det serbiska despotatet, med Smederevo, Golubac och ett tjugotal andra städer, till Branković som osmansk vasall, frigav hans två bländade söner och fastställde ett tioårigt stillestånd med Ungern. Samtidigt fortsatte kardinal Julian Cesarini, påvens legat, att driva på för ett nytt korståg, och venetianerna och påven förberedde en flotta för att stänga sunden.
On 4 August, with Cesarini’s help, Władysław swore in advance that he renounced any treaty he had made or would make with the sultan, and on 15 August the truce was ratified by oath. Branković took back Serbia on 22 August and stayed out of the coming fight. Murad, believing the peace secure, gave up the throne to his twelve-year-old son Mehmed II and retired. On 20 September the crusading army set out from Szeged, crossed the Danube and marched east along its southern bank, joined near Nicopolis by Wallachian cavalry under Mircea, son of Vlad Dracul.: Den 4 augusti svor Władysław, med Cesarinis hjälp, i förväg att han avsade sig varje fördrag han hade slutit eller skulle sluta med sultanen, och den 15 augusti ratificerades stilleståndet under ed. Branković tog tillbaka Serbien den 22 augusti och höll sig utanför den kommande striden. Murad, som trodde att freden var säkrad, abdikerade till förmån för sin tolvårige son Mehmed II och drog sig tillbaka. Den 20 september bröt korshären upp från Szeged, gick över Donau och tågade österut längs dess södra strand, där valakiskt kavalleri under Mircea, son till Vlad Dracul, anslöt nära Nikopolis.
