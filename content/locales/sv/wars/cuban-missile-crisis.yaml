# Svenska översättningar av katalogtexten (våg 14); stegtexterna kommer senare.
Cuban Missile Crisis: Kubakrisen
? The confrontation of October 1962 between the United States and the Soviet Union over Soviet nuclear missiles secretly installed in Cuba, the closest the Cold War came to nuclear war. In the spring of 1962 Nikita Khrushchev decided, with Fidel Castro’s agreement, to send ballistic missiles with nuclear warheads and some 43,000 Soviet troops to Cuba (Operation Anadyr), to deter another American invasion after the Bay of Pigs and to offset the American lead in long-range missiles and the US Jupiter missiles in Turkey. An American U-2 photographed missile sites on 14 October. After a week of secret deliberation, President Kennedy announced on 22 October a naval “quarantine” of Cuba and demanded the missiles’ removal; American forces went on alert, the Strategic Air Command at DEFCON 2 for the only time in its history, and an invasion force gathered in the south-eastern United States. Soviet ships carrying weapons turned back from the quarantine on 24 October, but work on the missile sites went on, and on 27 October a Soviet anti-aircraft missile shot down a U-2 over eastern Cuba, killing its pilot, Major Rudolf Anderson. On 28 October Khrushchev announced that the missiles would be dismantled and taken home, in return for a public American pledge not to invade Cuba and a secret promise to remove the Jupiter missiles from Turkey, which were withdrawn, with those in Italy, in 1963. Castro, who had not been consulted, refused UN inspection; after the Soviet Union agreed to take back its IL-28 bombers as well, the United States lifted the quarantine on 20 November. The crisis led to the Moscow–Washington hotline and the Partial Test Ban Treaty of 1963.
: Konfrontationen i oktober 1962 mellan USA och Sovjetunionen om de sovjetiska kärnvapenrobotar som i hemlighet hade placerats på Kuba, det närmaste ett kärnvapenkrig som kalla kriget kom. Våren 1962 beslöt Nikita Chrusjtjov, med Fidel Castros samtycke, att sända ballistiska robotar med kärnstridsspetsar och omkring 43 000 sovjetiska soldater till Kuba (Operation Anadyr), för att avskräcka från en ny amerikansk invasion efter Grisbukten och för att uppväga det amerikanska försprånget i fråga om långdistansrobotar och de amerikanska Jupiterrobotarna i Turkiet. Ett amerikanskt U-2-plan fotograferade robotbaser den 14 oktober. Efter en vecka av hemliga överläggningar tillkännagav president Kennedy den 22 oktober en marin ”karantän” kring Kuba och krävde att robotarna skulle avlägsnas; amerikanska styrkor sattes i beredskap, Strategic Air Command på DEFCON 2 för enda gången i sin historia, och en invasionsstyrka samlades i sydöstra USA. Sovjetiska fartyg med vapen vände om framför karantänlinjen den 24 oktober, men arbetet på robotbaserna fortsatte, och den 27 oktober sköt en sovjetisk luftvärnsrobot ned ett U-2-plan över östra Kuba, varvid piloten, major Rudolf Anderson, dödades. Den 28 oktober meddelade Chrusjtjov att robotarna skulle monteras ned och föras hem, i utbyte mot ett offentligt amerikanskt löfte att inte invadera Kuba och ett hemligt löfte att avlägsna Jupiterrobotarna från Turkiet, som drogs tillbaka 1963, tillsammans med dem i Italien. Castro, som inte hade rådfrågats, vägrade godta FN-inspektioner; sedan Sovjetunionen också hade gått med på att ta tillbaka sina IL-28-bombplan hävde USA karantänen den 20 november. Krisen ledde till den heta linjen mellan Moskva och Washington och till det partiella provstoppsavtalet 1963.
