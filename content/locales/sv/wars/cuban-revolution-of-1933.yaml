# Svenska översättningar av katalogtexten (våg 14); stegtexterna kommer senare.
Cuban Revolution of 1933: Kubanska revolutionen 1933
? The overthrow of Gerardo Machado, the Sergeants’ Revolt and the brief revolutionary government of Ramón Grau San Martín. Machado, president since 1925, had extended his term in 1928 and ruled through the police and the army while the Great Depression ruined the sugar economy; students of the Directorio Estudiantil Universitario, the clandestine ABC society and the communists fought him with strikes, bombs and assassinations, and his police killed many opponents. In 1933 the new US ambassador Sumner Welles pressed Machado to step down, and a general strike in August led army officers to withdraw their support; Machado fled on 12 August and Welles’s candidate Carlos Manuel de Céspedes y Quesada became president, with the ABC in his cabinet. On 4 September sergeants and enlisted men at Camp Columbia in Havana, led by the stenographer-sergeant Fulgencio Batista, took over the army and, with the students, replaced Céspedes with a five-man Pentarchy; on 10 September Grau became president. His “Hundred Days” government, with Antonio Guiteras as minister of the interior, decreed the eight-hour day, a minimum wage for cane cutters, autonomy for the university and a law that half of all workers must be Cuban-born, cut electricity rates and repudiated the Platt Amendment. The United States refused to recognise it and sent some thirty warships to Cuban waters, though no troops landed. Batista’s soldiers crushed the deposed officers, about 400 of whom had gathered in the Hotel Nacional, in a battle on 2 October, after which some of the officers who surrendered were killed, and put down a rising of the ABC and army officers that ended at the Atarés fortress in Havana on 8–9 November. On 15 January 1934 Batista, now a colonel and chief of staff, forced Grau out, and after a few days Carlos Mendieta became president and was recognised by Washington within a week. In May 1934 a new treaty abrogated the Platt Amendment. Batista remained the real power in Cuba until 1944; Guiteras was killed in 1935 after a failed general strike.
: Störtandet av Gerardo Machado, sergeantrevolten och Ramón Grau San Martíns kortlivade revolutionära regering. Machado, president sedan 1925, hade förlängt sin mandatperiod 1928 och styrde med hjälp av polisen och armén medan den stora depressionen ruinerade sockerekonomin; studenterna i Directorio Estudiantil Universitario, det hemliga sällskapet ABC och kommunisterna bekämpade honom med strejker, bomber och politiska mord, och hans polis dödade många motståndare. År 1933 pressade den nye amerikanske ambassadören Sumner Welles Machado att avgå, och en generalstrejk i augusti fick arméofficerarna att dra tillbaka sitt stöd; Machado flydde den 12 augusti, och Welles kandidat Carlos Manuel de Céspedes y Quesada blev president, med ABC i regeringen. Den 4 september tog sergeanter och meniga vid Camp Columbia i Havanna, ledda av stenografsergeanten Fulgencio Batista, kontrollen över armén och ersatte tillsammans med studenterna Céspedes med en pentarki, ett femmannaråd; den 10 september blev Grau president. Hans ”hundradagarsregering”, med Antonio Guiteras som inrikesminister, införde genom dekret åttatimmarsdagen, minimilön för sockerrörshuggare, självstyre för universitetet och en lag om att hälften av alla arbetare måste vara födda på Kuba, sänkte elpriserna och förkastade Plattillägget. USA vägrade erkänna regeringen och sände ett trettiotal krigsfartyg till kubanska vatten, men inga trupper landsattes. Batistas soldater krossade de avsatta officerarna, av vilka omkring 400 hade samlats på Hotel Nacional, i en strid den 2 oktober, varefter en del av de officerare som hade kapitulerat dödades, och slog ned ett uppror av ABC och arméofficerare som slutade vid fästningen Atarés i Havanna den 8–9 november. Den 15 januari 1934 tvingade Batista, nu överste och stabschef, bort Grau, och efter några dagar blev Carlos Mendieta president och erkändes av Washington inom en vecka. I maj 1934 upphävdes Plattillägget genom ett nytt fördrag. Batista förblev den verkliga makthavaren på Kuba fram till 1944; Guiteras dödades 1935 efter en misslyckad generalstrejk.
