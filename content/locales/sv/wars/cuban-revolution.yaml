# Svenska översättningar av katalogtexten (våg 14); stegtexterna kommer senare.
Cuban Revolution: Kubanska revolutionen
? The armed struggle that overthrew Fulgencio Batista, who had seized power in Cuba in a coup in March 1952. It began with Fidel Castro’s failed attack on the Moncada Barracks in Santiago de Cuba on 26 July 1953, which gave his 26th of July Movement its name. After prison and exile in Mexico, Castro landed in eastern Cuba from the yacht Granma with 81 men in December 1956; most were killed or captured within days, but the survivors built a guerrilla army in the Sierra Maestra with the help of the peasants there and of an urban underground led by Frank País. In the cities the movement, the students of the Directorio Revolucionario and other groups fought with strikes, sabotage, bombs and assassinations, and Batista’s police and army answered with torture and killings. The United States, which had armed Batista, stopped selling him weapons in March 1958. A general strike called for April 1958 failed, but the army’s summer offensive against the Sierra Maestra, about 12,000 men against some 300 guerrillas, collapsed by August. Rebel columns under Che Guevara and Camilo Cienfuegos then crossed to central Cuba, where with the Directorio Revolucionario they took Santa Clara on 31 December. Batista fled to the Dominican Republic early on 1 January 1959, a general strike called by Castro paralysed resistance, and Castro arrived in Havana on 8 January. The revolutionary government, which Castro soon dominated, tried and executed hundreds of members of Batista’s forces in 1959 and in the following years transformed Cuba into a one-party socialist state allied with the Soviet Union.
: Den väpnade kamp som störtade Fulgencio Batista, som hade tagit makten på Kuba genom en kupp i mars 1952. Den började med Fidel Castros misslyckade anfall mot Moncadakasernen i Santiago de Cuba den 26 juli 1953, som gav hans 26 juli-rörelse dess namn. Efter fängelse och exil i Mexiko landsteg Castro på östra Kuba från jakten Granma med 81 man i december 1956; de flesta dödades eller tillfångatogs inom några dagar, men de överlevande byggde upp en gerillaarmé i Sierra Maestra med hjälp av bönderna där och av en underjordisk rörelse i städerna under ledning av Frank País. I städerna kämpade rörelsen, studenterna i Directorio Revolucionario och andra grupper med strejker, sabotage, bomber och politiska mord, och Batistas polis och armé svarade med tortyr och dödande. USA, som hade beväpnat Batista, slutade sälja vapen till honom i mars 1958. En generalstrejk som utlysts till april 1958 misslyckades, men arméns sommaroffensiv mot Sierra Maestra, omkring 12 000 man mot omkring 300 gerillasoldater, hade brutit samman i augusti. Rebellkolonner under Che Guevara och Camilo Cienfuegos tog sig sedan över till centrala Kuba, där de tillsammans med Directorio Revolucionario intog Santa Clara den 31 december. Batista flydde till Dominikanska republiken tidigt den 1 januari 1959, en generalstrejk som Castro utlyste lamslog motståndet, och Castro anlände till Havanna den 8 januari. Den revolutionära regeringen, som Castro snart dominerade, ställde hundratals medlemmar av Batistas styrkor inför rätta och avrättade dem 1959 och omvandlade under de följande åren Kuba till en socialistisk enpartistat allierad med Sovjetunionen.
