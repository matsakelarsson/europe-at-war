# Svenska översättningar av katalogtexten (våg 14); stegtexterna kommer senare.
Cuban War of Independence: Kubanska självständighetskriget
? The last and decisive Cuban war against Spanish rule, which José Martí called “the necessary war”. Martí united the exiles of Florida and New York in the Cuban Revolutionary Party in 1892 and, with the veterans Máximo Gómez and Antonio Maceo, launched the rising of 24 February 1895, the Cry of Baire. Martí was killed at Dos Ríos in May, but the insurgents of the Liberation Army defeated Martínez Campos at Peralejo, set up a government at Jimaguayú and, in the invasion of 1895–1896, carried the war from the east to the western tip of the island, burning the sugar crop as they went. Spain sent some 200,000 soldiers, the largest army it had ever sent to the Americas, and General Valeriano Weyler forced the rural population of the west and centre into fortified towns; in this reconcentration about 155,000 to 170,000 civilians died of hunger and disease, by the most careful modern estimate, and some estimates are far higher. Maceo was killed in December 1896, but the insurgents held the countryside, Calixto García took Las Tunas and Guisa in 1897, and Spain, after Weyler’s recall, offered autonomy in 1898, which the insurgents rejected. The explosion of the USS Maine in Havana in February 1898 and American public anger at the reconcentration led to the Spanish–American War; Spain gave up Cuba in the armistice of 12 August 1898 and the Treaty of Paris, which handed the island to American military rule until the Republic of Cuba was founded in 1902, bound by the Platt Amendment.
: Det sista och avgörande kubanska kriget mot det spanska styret, som José Martí kallade ”det nödvändiga kriget”. Martí förenade exilkubanerna i Florida och New York i Kubanska revolutionära partiet 1892 och inledde, tillsammans med veteranerna Máximo Gómez och Antonio Maceo, resningen den 24 februari 1895, ropet i Baire. Martí stupade vid Dos Ríos i maj, men befrielsearméns upprorsmän besegrade Martínez Campos vid Peralejo, bildade en regering i Jimaguayú och förde under invasionen 1895–1896 kriget från öster till öns västligaste spets, medan de brände sockerskörden på vägen. Spanien sände omkring 200 000 soldater, den största armé landet någonsin hade sänt till Amerika, och general Valeriano Weyler tvingade landsbygdsbefolkningen i väster och i mitten in i befästa städer; under denna rekoncentration dog omkring 155 000 till 170 000 civila av svält och sjukdomar, enligt den mest noggranna moderna uppskattningen, och vissa uppskattningar är betydligt högre. Maceo stupade i december 1896, men upprorsmännen behärskade landsbygden, Calixto García intog Las Tunas och Guisa 1897, och Spanien erbjöd efter Weylers återkallande självstyre 1898, vilket upprorsmännen avvisade. Explosionen på USS Maine i Havanna i februari 1898 och den amerikanska allmänhetens vrede över rekoncentrationen ledde till spansk-amerikanska kriget; Spanien gav upp Kuba i vapenstilleståndet den 12 augusti 1898 och genom freden i Paris, som överlämnade ön åt amerikanskt militärstyre tills Republiken Kuba grundades 1902, bunden av Plattillägget.
