Cypriot intercommunal violence of 1963–1964: Etniska våldsamheterna på Cypern 1963–1964
Fighting between Greek and Turkish Cypriots that broke up the power-sharing republic of 1960, beginning in Nicosia on 21 December 1963 – the start of what Turkish Cypriots call Bloody Christmas – after President Makarios proposed constitutional changes that Turkish Cypriots rejected. By August 1964 some 364 Turkish Cypriots and 174 Greek Cypriots had been killed and about 25,000 Turkish Cypriots had withdrawn into armed enclaves, and Turkish air strikes during a Greek Cypriot attack on Kokkina brought Greece and Turkey close to war.: Strider mellan grekcyprioter och turkcyprioter som splittrade 1960 års maktdelande republik. De började i Nicosia den 21 december 1963 – inledningen på det som turkcyprioterna kallar Blodiga julen – sedan president Makarios föreslagit författningsändringar som turkcyprioterna avvisade. I augusti 1964 hade omkring 364 turkcyprioter och 174 grekcyprioter dödats och omkring 25 000 turkcyprioter dragit sig tillbaka till beväpnade enklaver, och turkiska flyganfall under ett grekcypriotiskt angrepp på Kokkina förde Grekland och Turkiet nära krig.
