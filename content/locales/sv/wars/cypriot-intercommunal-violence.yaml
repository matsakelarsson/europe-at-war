UNFICYP, United Nations Peacekeeping Force in Cyprus (United Nations): UNFICYP, FN:s fredsbevarande styrka på Cypern (FN)
A British-drawn ceasefire line through Nicosia in December 1963 was the first Green Line. The United Nations force UNFICYP, set up by the Security Council on 4 March 1964, is still in Cyprus; fighting flared again in 1967 at Kofinou, and the enclaves lasted until 1974.: En vapenstilleståndslinje som britterna drog genom Nicosia i december 1963 var den första gröna linjen. FN-styrkan UNFICYP, som säkerhetsrådet inrättade den 4 mars 1964, finns fortfarande på Cypern; striderna blossade upp igen 1967 vid Kofinou, och enklaverna bestod till 1974.
