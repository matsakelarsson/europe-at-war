EOKA’s mountain groups hid in the forests, where large British sweeps in 1956 killed or captured many of them but never found Grivas.: EOKA:s bergsgrupper gömde sig i skogarna, där stora brittiska svepoperationer 1956 dödade eller tillfångatog många av dem men aldrig fann Grivas.
