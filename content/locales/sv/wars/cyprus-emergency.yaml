Cyprus Emergency: Cypernkrisen
The armed campaign of EOKA, a Greek Cypriot guerrilla organisation led by George Grivas, against British rule in Cyprus and for union with Greece (enosis). It was fought with bombings, ambushes and assassinations, met by emergency rule, detention camps and the deportation of Archbishop Makarios, and fed rising violence between Greek and Turkish Cypriots; the Zurich and London agreements of 1959 ended it and made Cyprus an independent republic in 1960.: Den väpnade kampanjen som EOKA, en grekcypriotisk gerillaorganisation ledd av Georgios Grivas, förde mot det brittiska styret på Cypern och för union med Grekland (enosis). Den fördes med bombdåd, bakhåll och mord och möttes av undantagstillstånd, interneringsläger och deportationen av ärkebiskop Makarios, och den underblåste ett tilltagande våld mellan grek- och turkcyprioter; Zürich- och Londonavtalen 1959 avslutade den och gjorde Cypern till en självständig republik 1960.
