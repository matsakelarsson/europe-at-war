EOKA and the road to independence: EOKA och vägen till självständighet
April 1955 – August 1960: april 1955 – augusti 1960
EOKA stands for Ethniki Organosis Kyprion Agoniston (National Organisation of Cypriot Fighters). Grivas used the code name “Digenis”.: EOKA står för Ethniki Organosis Kyprion Agoniston (Cypriotiska kämpars nationella organisation). Grivas använde täcknamnet ”Digenis”.
About 370 British servicemen were killed, and EOKA lost around a hundred fighters; several hundred civilians died, among them Greek Cypriots killed by EOKA as alleged collaborators and victims of the intercommunal violence of 1958. Allegations that British forces tortured detainees were the subject of a court case in London that the British government settled in 2019.: Omkring 370 brittiska militärer dödades, och EOKA förlorade omkring hundra kämpar; flera hundra civila dog, bland dem grekcyprioter som EOKA dödade som påstådda kollaboratörer och offer för de etniska våldsamheterna 1958. Anklagelser om att brittiska styrkor torterat fångar prövades i ett mål i London som den brittiska regeringen förlikte 2019.
