British success: Brittiska framgångar
Most Greek Cypriots, about four-fifths of the island’s people, wanted union with Greece, but Britain, which planned to base its Middle East command on Cyprus, refused. On 1 April 1955 EOKA, led by George Grivas, a Cypriot-born colonel of the Greek army, and backed politically by Archbishop Makarios III, set off bombs across the island. The governor, Field Marshal Sir John Harding, declared a state of emergency in November and in March 1956 deported Makarios to the Seychelles. Some tens of thousands of British troops hunted a few hundred guerrillas in the Troodos and Kyrenia mountains, with curfews, collective fines and detention camps, and nine EOKA members were hanged.: De flesta grekcyprioter, omkring fyra femtedelar av öns befolkning, ville ha union med Grekland, men Storbritannien, som planerade att förlägga sitt Mellanösternkommando till Cypern, vägrade. Den 1 april 1955 utlöste EOKA, lett av Georgios Grivas, en Cypernfödd överste i den grekiska armén, och med politiskt stöd av ärkebiskop Makarios III, bomber över hela ön. Guvernören, fältmarskalk sir John Harding, utlyste undantagstillstånd i november och deporterade i mars 1956 Makarios till Seychellerna. Tiotusentals brittiska soldater jagade några hundra gerillakrigare i Troodos- och Kyreniabergen, med utegångsförbud, kollektiva böter och interneringsläger, och nio EOKA-medlemmar hängdes.
Turkish Cypriots, about a fifth of the population, opposed enosis, and Turkey called for partition. In 1958 the Turkish Resistance Organisation (TMT) and EOKA turned on each other’s communities, and intercommunal killings that summer began the separation of the two peoples. Britain, Greece and Turkey then agreed a compromise. Under the Zurich and London agreements of February 1959, Cyprus became an independent republic on 16 August 1960, with Makarios as president, a Turkish Cypriot vice-president, power shared between the communities, Britain, Greece and Turkey as guarantors, and two British sovereign base areas.: Turkcyprioterna, omkring en femtedel av befolkningen, motsatte sig enosis, och Turkiet krävde delning. År 1958 vände sig Turkiska motståndsorganisationen (TMT) och EOKA mot varandras folkgrupper, och de etniska morden den sommaren inledde de två folkens åtskillnad. Storbritannien, Grekland och Turkiet enades därefter om en kompromiss. Enligt Zürich- och Londonavtalen i februari 1959 blev Cypern en självständig republik den 16 augusti 1960, med Makarios som president, en turkcypriotisk vicepresident, maktdelning mellan folkgrupperna, Storbritannien, Grekland och Turkiet som garantimakter och två brittiska suveräna basområden.
