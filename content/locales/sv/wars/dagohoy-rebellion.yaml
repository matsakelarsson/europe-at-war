# Svenska översättningar av katalogtexten (våg 11); stegtexterna kommer senare.
Dagohoy rebellion: Dagohoyupproret
? A revolt on the island of Bohol that lasted 85 years, the longest against Spanish rule in the Philippines. It began in 1744; the killing of Giuseppe Lamberti, the Jesuit priest of Jagna, is dated to January 1744 in some accounts and January 1745 in others. Francisco Dagohoy (Francisco Sendrijas), a cabeza de barangay of Inabanga, turned against the Spanish when the Jesuit Gaspar Morales refused a Christian burial to his brother Sagarino, a constable killed while pursuing a fugitive, on the ground that he had died in a duel; forced labour, tribute and church dues fed the anger of many Boholanos. Dagohoy led about 3,000 people into the hills of the interior, where from December 1745 they ran their own government and farmed their own fields, with a base in the caves of Danao and the mountains behind Inabanga. Their numbers grew, by some accounts to 20,000. Expeditions sent by about twenty governors-general, and offers of pardon carried by the Jesuits and, after the Jesuits were expelled in 1768, by the Augustinian Recollects, failed to end the revolt, which outlived Dagohoy himself, whose death date is not known. In May 1827 Governor-General Mariano Ricafort sent José Lázaro Cairo to Bohol with 2,200 Spanish and Filipino troops and artillery. Two years of campaigning followed, in which people who had surrendered were beheaded at Inabanga and others were later deported from the island; by 31 August 1829 19,420 people had surrendered, and most were pardoned. The revolt is shown on the provincial flag of Bohol, and the town of Dagohoy is named after him.
: Ett uppror på ön Bohol som varade i 85 år, det längsta mot det spanska styret i Filippinerna. Det började 1744; mordet på Giuseppe Lamberti, jesuitprästen i Jagna, dateras i vissa källor till januari 1744 och i andra till januari 1745. Francisco Dagohoy (Francisco Sendrijas), en cabeza de barangay i Inabanga, vände sig mot spanjorerna när jesuiten Gaspar Morales vägrade hans bror Sagarino, en konstapel som hade dödats när han förföljde en flykting, en kristen begravning med motiveringen att han hade dött i en duell; tvångsarbete, tribut och kyrkoavgifter underblåste vreden hos många boholaner. Dagohoy ledde omkring 3 000 människor upp i bergen i öns inre, där de från december 1745 hade ett eget styre och brukade sina egna fält, med en bas i grottorna vid Danao och bergen bakom Inabanga. Deras antal växte, enligt vissa uppgifter till 20 000. Expeditioner som sändes ut av ett tjugotal generalguvernörer, och erbjudanden om benådning som framfördes av jesuiterna och, sedan jesuiterna hade utvisats 1768, av augustinrekollekterna, lyckades inte göra slut på upproret, som överlevde Dagohoy själv, vars dödsdatum inte är känt. I maj 1827 sände generalguvernören Mariano Ricafort José Lázaro Cairo till Bohol med 2 200 spanska och filippinska soldater och artilleri. Två års fälttåg följde, under vilka människor som hade gett upp halshöggs i Inabanga och andra senare deporterades från ön; den 31 augusti 1829 hade 19 420 människor gett upp, och de flesta av dem benådades. Upproret finns avbildat på Bohols provinsflagga, och orten Dagohoy är uppkallad efter honom.
