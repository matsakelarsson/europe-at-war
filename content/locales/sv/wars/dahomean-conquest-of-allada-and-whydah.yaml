# Svenska översättningar av katalogtexten (våg 13); stegtexterna kommer senare.
Dahomey’s conquest of Allada and Whydah: Dahomeys erövring av Allada och Whydah
? The wars by which King Agaja of Dahomey, an inland kingdom on the Abomey plateau, conquered the two coastal kingdoms through which Europeans bought captives on the Slave Coast, in today’s Benin. Allada and Whydah (Hueda), like Dahomey, were tributaries of the Yoruba empire of Oyo, and their ports, with the forts and compounds of the Dutch, English, French and Portuguese, exported thousands of enslaved people a year. Taking advantage of a succession dispute, Agaja’s army stormed Allada on 30 March 1724, killing its king and burning the palace, and took Godomey on the coast in April. On 26 February 1727 he attacked Whydah, whose king Huffon fled; contemporary reports speak of about 5,000 killed and 10,000 to 11,000 captured in five days, and in April Agaja burned the European trading factories. Dahomey more than doubled its territory and gained direct access to the Atlantic trade, which Agaja made a royal monopoly in 1733. Whether he meant to control the slave trade or, as some writers argued, to end it has long been debated. The conquests brought Oyo’s armies down on Dahomey, and the Whydah exiles fought on from the coastal islands for years.
: De krig genom vilka kung Agaja av Dahomey, ett inlandsrike på Abomeyplatån, erövrade de två kustriken genom vilka européerna köpte fångar på Slavkusten, i dagens Benin. Allada och Whydah (Hueda) var liksom Dahomey skattskyldiga till yorubariket Oyo, och från deras hamnar, med nederländarnas, engelsmännens, fransmännens och portugisernas fort och handelsgårdar, fördes tusentals förslavade människor ut varje år. Agajas armé utnyttjade en tronföljdstvist, stormade Allada den 30 mars 1724, dödade dess kung och brände palatset, och intog Godomey vid kusten i april. Den 26 februari 1727 anföll Agaja Whydah, vars kung Huffon flydde; samtida rapporter talar om omkring 5 000 dödade och 10 000 till 11 000 tillfångatagna på fem dagar, och i april brände Agaja de europeiska handelsfaktorierna. Dahomey mer än fördubblade sitt territorium och fick direkt tillgång till den atlantiska handeln, som Agaja gjorde till kungligt monopol 1733. Huruvida han ville kontrollera slavhandeln eller, som vissa skribenter hävdade, göra slut på den har länge debatterats. Erövringarna drog Oyos arméer över Dahomey, och de landsflyktiga från Whydah fortsatte striden från öarna längs kusten i flera år.
