Dahomey’s wars against Abeokuta: Dahomeys krig mot Abeokuta
Two great attacks by the Kingdom of Dahomey on Abeokuta, the city of the Egba in what is now south-western Nigeria, in 1851 and 1864, part of a rivalry that lasted from the 1840s to the end of Dahomey’s independence. Abeokuta, founded about 1830 by Egba refugees from the wars that followed the fall of Oyo, grew into a large walled city on the Ogun river, a centre of Christian missions and of the new palm-oil trade, and a rival to Dahomey for the trade and captives of the region between them. On 3 March 1851 King Gezo’s army, women soldiers in its front ranks, stormed Abeokuta’s walls and was driven off with heavy losses. Thirteen years later, on 15 March 1864, his son Glele attacked again, to avenge his father, and was routed in turn. Neither attack ended the rivalry. Dahomey went on raiding the Egba and western Yoruba borderlands, destroying Ketu in 1886, until the French conquest of Dahomey in 1892–1894.: Två stora anfall som kungariket Dahomey 1851 och 1864 riktade mot Abeokuta, egbafolkets stad i det som i dag är sydvästra Nigeria, som en del av en rivalitet som varade från 1840-talet till slutet av Dahomeys självständighet. Abeokuta, som grundades omkring 1830 av egbaflyktingar från de krig som följde på Oyos fall, växte till en stor befäst stad vid floden Ogun, ett centrum för kristen mission och för den nya palmoljehandeln och en rival till Dahomey om handeln och fångarna i området mellan dem. Den 3 mars 1851 stormade kung Gezos armé, med kvinnliga soldater i de främsta leden, Abeokutas murar och drevs tillbaka med svåra förluster. Tretton år senare, den 15 mars 1864, anföll hans son Glele på nytt för att hämnas sin far och slogs i sin tur på flykten. Inget av anfallen gjorde slut på rivaliteten. Dahomey fortsatte att göra räder i gränstrakterna mot egba och västra yorubaområdet, och förstörde Ketu 1886, fram till den franska erövringen av Dahomey 1892–1894.
