# Svenska översättningar av katalogtexten (våg 11); stegtexterna kommer senare.
Đại Việt–Champa war of 1471: Kriget mellan Đại Việt och Champa 1471
The invasion of Champa by the Lê emperor Lê Thánh Tông of Đại Việt, which destroyed the Cham capital Vijaya and ended Champa as a major power. After a Cham attack on the Vietnamese frontier at Hóa Châu in 1470, Lê Thánh Tông led south a fleet and army that the Vietnamese sources put at 250,000 men, with firearms on the Ming model. Landing on the coast of today’s Quảng Nam and Quảng Ngãi in February 1471, it overran northern Champa in two weeks, took the port of Thị Nại on 18 March and, after a siege of four days, stormed Vijaya on 22 March. The king, Trà Toàn, was captured and deported to the north; by the figures of the Vietnamese chronicles more than 30,000 Cham were captured and 40,000 executed. Đại Việt annexed the land as far as the Cù Mông pass, south of Vijaya, as the province of Quảng Nam, and the rest of Champa, centred on Panduranga in the far south, survived as a group of small principalities under Vietnamese overlordship until 1832.: Đại Việts invasion av Champa under Lêkejsaren Lê Thánh Tông, som förstörde chamernas huvudstad Vijaya och gjorde slut på Champa som betydande makt. Efter ett chamiskt anfall mot den vietnamesiska gränsen vid Hóa Châu 1470 ledde Lê Thánh Tông söderut en flotta och armé som de vietnamesiska källorna uppger till 250 000 man, med eldvapen efter Mingmönster. Den landsteg på kusten i dagens Quảng Nam och Quảng Ngãi i februari 1471, överskred norra Champa på två veckor, intog hamnen Thị Nại den 18 mars och stormade efter en fyra dagar lång belägring Vijaya den 22 mars. Kungen, Trà Toàn, tillfångatogs och deporterades norrut; enligt de vietnamesiska krönikornas siffror tillfångatogs mer än 30 000 chamer och 40 000 avrättades. Đại Việt annekterade landet ända till Cù Mông-passet, söder om Vijaya, som provinsen Quảng Nam, och resten av Champa, med centrum i Panduranga längst i söder, levde kvar som en grupp små furstendömen under vietnamesisk överhöghet fram till 1832.
