# Svenska översättningar av katalogtexten (våg 11); stegtexterna kommer senare.
Đại Việt–Lan Xang war: Kriget mellan Đại Việt och Lan Xang
The invasion of the Lao kingdom of Lan Xang and the principality of Muang Phuan by Lê Thánh Tông of Đại Việt, also called the White Elephant War after the story the Lao chronicles tell of its cause. After a revolt in Muang Phuan in 1478, in which Vietnamese officials were killed, Vietnamese armies entered the Lao uplands in the autumn of 1479 by five routes. They defeated the Lao army near the Plain of Jars, destroyed the Phuan capital Xieng Khouang and took the Lao capital Luang Prabang, while King Chakkaphat Phaen Phaeo fled to Vientiane. But the invaders suffered from disease, and when one army pushed west towards Lan Na it was defeated near Nan in 1480 or 1481 by Tao Kha Kan, a governor of King Tilok of Lan Na. Under pressure from the Ming, who warned Đại Việt off its neighbours, the Vietnamese withdrew; by October 1484 Lan Xang and Lan Na reported to the Ming that they were gone. Muang Phuan remained a tributary of Đại Việt and Lan Xang in turn.: Đại Việts invasion under Lê Thánh Tông av det laotiska kungariket Lan Xang och furstendömet Muang Phuan; den kallas också den vita elefantens krig efter den berättelse om krigets orsak som de laotiska krönikorna återger. Efter ett uppror i Muang Phuan 1478, där vietnamesiska ämbetsmän dödades, trängde vietnamesiska arméer hösten 1479 in i det laotiska höglandet längs fem vägar. De besegrade den laotiska armén nära Krukslätten, förstörde phuanernas huvudstad Xieng Khouang och intog den laotiska huvudstaden Luang Prabang, medan kung Chakkaphat Phaen Phaeo flydde till Vientiane. Men inkräktarna led av sjukdomar, och när en av arméerna trängde västerut mot Lan Na besegrades den nära Nan 1480 eller 1481 av Tao Kha Kan, en guvernör under kung Tilok av Lan Na. Under tryck från Ming, som varnade Đại Việt för att ge sig på sina grannar, drog sig vietnameserna tillbaka; i oktober 1484 rapporterade Lan Xang och Lan Na till Ming att de var borta. Muang Phuan förblev tributland under växelvis Đại Việt och Lan Xang.
