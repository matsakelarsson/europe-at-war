# Svenska översättningar av katalogtexten (våg 14); stegtexterna kommer senare.
Dakota War of 1862: Dakotakriget 1862
? The war between the eastern Dakota (Santee Sioux) and the United States in the Minnesota River valley in August and September 1862, and its aftermath. Treaties in 1851 and 1858 had left the four eastern Dakota bands a narrow strip along the Minnesota River, and traders’ claims swallowed much of the payments promised for their land. After a crop failure and a hard winter, the 1862 payment was late, and agents and traders refused food on credit. On 17 August four young Dakota men killed five settlers at Acton; that night the Mdewakanton soldiers’ lodge persuaded Taoyateduta (Little Crow) to lead a war to drive the settlers from the valley. Dakota fighters attacked the Lower Sioux Agency on 18 August and killed hundreds of settlers in the following days, but failed to take Fort Ridgely and New Ulm. Colonel Henry Hastings Sibley’s volunteers defeated them at Wood Lake on 23 September, and on 26 September Dakota who had opposed the war handed over 269 captives at Camp Release. Counts of the settlers killed range from 358 to more than 600, besides 77 soldiers and 36 militiamen and armed civilians; Dakota losses are not known. A military commission sentenced 303 Dakota men to death; President Lincoln approved 39 sentences, and 38 men were hanged at Mankato on 26 December 1862, the largest mass execution in the history of the United States. About 1,600 Dakota non-combatants were held in a camp below Fort Snelling, where between about 100 and 300 died; in 1863 Congress annulled the treaties and the Dakota were expelled from Minnesota to Crow Creek on the Missouri. Expeditions under Sibley and Alfred Sully in 1863 and 1864 carried the war into Dakota Territory against the Dakota, Yanktonai and Lakota.
: Kriget mellan östdakota (santee-sioux) och USA i Minnesotaflodens dal i augusti och september 1862, och dess efterspel. Fördrag 1851 och 1858 hade lämnat de fyra östliga dakotagrupperna en smal remsa längs Minnesotafloden, och handlarnas fordringar slukade mycket av de betalningar som utlovats för deras land. Efter en missväxt och en hård vinter blev 1862 års betalning försenad, och agenter och handlare vägrade att ge mat på kredit. Den 17 augusti dödade fyra unga dakotamän fem nybyggare i Acton; samma natt övertalade krigarsällskapet bland mdewakanton Taoyateduta (Little Crow) att leda ett krig för att driva nybyggarna ut ur dalen. Dakotakrigare anföll Lower Sioux Agency den 18 augusti och dödade hundratals nybyggare under de följande dagarna, men misslyckades med att inta Fort Ridgely och New Ulm. Överste Henry Hastings Sibleys frivilliga besegrade dem vid Wood Lake den 23 september, och den 26 september överlämnade dakota som hade motsatt sig kriget 269 fångar vid Camp Release. Uppgifterna om antalet dödade nybyggare varierar från 358 till mer än 600, utöver 77 soldater och 36 milismän och beväpnade civila; dakotas förluster är okända. En militärkommission dömde 303 dakotamän till döden; president Lincoln godkände 39 domar, och 38 män hängdes i Mankato den 26 december 1862, den största massavrättningen i USA:s historia. Omkring 1 600 dakota som inte hade deltagit i striderna hölls i ett läger nedanför Fort Snelling, där mellan omkring 100 och 300 dog; 1863 upphävde kongressen fördragen och dakota fördrevs från Minnesota till Crow Creek vid Missouri. Expeditioner under Sibley och Alfred Sully 1863 och 1864 förde kriget in i Dakotaterritoriet mot dakota, yanktonai och lakota.
