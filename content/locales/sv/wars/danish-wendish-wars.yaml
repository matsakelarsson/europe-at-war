Absalon’s castle on a small island in the harbour of Havn protected the Sound against Wendish raiders. The town grew into Copenhagen.: Absalons borg på en liten holme i Havns hamn skyddade Öresund mot vendiska plundrare. Staden växte till Köpenhamn.
