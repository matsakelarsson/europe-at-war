The Danes now turned on the Christian dukes of Pomerania, whose lands at the mouth of the Oder were also bases for raiders. In 1170 they destroyed a stronghold at Dziwnów and fought their way past a Pomeranian army and fleet at the bridge of Wolin. In 1177 the dukes bought peace with heavy tribute. Valdemar also built a great castle at Vordingborg as a base for further raids.: Danskarna vände sig nu mot de kristna hertigarna av Pommern, vars land vid Oders mynning också var baser för plundrare. År 1170 förstörde de en borg vid Dziwnów och kämpade sig förbi en pommersk här och flotta vid bron i Wolin. År 1177 köpte hertigarna fred mot en tung tribut. Valdemar byggde också en stor borg i Vordingborg som bas för vidare härjningståg.
After Valdemar’s death in 1182 his son Canute VI refused to do homage to the emperor Frederick Barbarossa, who had made Duke Bogislaw I of Pomerania an imperial prince. In 1184 Bogislaw attacked Rügen on the emperor’s behalf, but Absalon, now archbishop of Lund, destroyed the Pomeranian fleet off the coast near Stralsund at Whitsun. Danish raids followed, and in 1185 Bogislaw submitted and took his duchy as a fief from Canute VI.: Efter Valdemars död 1182 vägrade hans son Knut VI att hylla kejsar Fredrik Barbarossa, som hade gjort hertig Bogislav I av Pommern till riksfurste. År 1184 anföll Bogislav Rügen på kejsarens vägnar, men Absalon, nu ärkebiskop av Lund, förintade den pommerska flottan utanför kusten nära Stralsund under pingsten. Danska härjningståg följde, och 1185 underkastade sig Bogislav och tog emot sitt hertigdöme som län av Knut VI.
