Almost everything known about these wars comes from Saxo Grammaticus’s Gesta Danorum, written for Absalon, which celebrates his deeds. Dates and numbers are often uncertain; the fall of Arkona is usually dated 1168, but some historians argue for 1169.: Nästan allt som är känt om dessa krig kommer från Saxo Grammaticus Gesta Danorum, skriven för Absalon, som prisar hans bedrifter. Datum och siffror är ofta osäkra; Arkonas fall dateras vanligen till 1168, men vissa historiker argumenterar för 1169.
Contemporaries saw the campaigns against the pagan Rani as crusades, like the German Wendish Crusade of 1147, though the Pomeranian dukes were already Christian.: Samtiden såg fälttågen mot de hedniska ranerna som korståg, likt det tyska vendiska korståget 1147, trots att de pommerska hertigarna redan var kristna.
