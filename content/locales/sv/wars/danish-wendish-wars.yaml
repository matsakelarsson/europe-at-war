During Denmark’s civil wars of the 1140s and 1150s, Wendish fleets from Rügen and the Pomeranian coast raided the Danish islands almost at will, and by one account a third of the kingdom lay waste when Valdemar I became sole king in 1157. With his foster brother Absalon, bishop of Roskilde from 1158, Valdemar struck back. From 1159 Danish fleets sailed against the Wendish coast almost every year, burning settlements and taking captives, at times in alliance with Duke Henry the Lion of Saxony and at times in rivalry with him.: Under Danmarks inbördeskrig på 1140- och 1150-talen härjade vendiska flottor från Rügen och den pommerska kusten de danska öarna nästan efter behag, och enligt en uppgift låg en tredjedel av riket öde när Valdemar I blev ensam kung 1157. Tillsammans med sin fosterbror Absalon, biskop av Roskilde från 1158, slog Valdemar tillbaka. Från 1159 seglade danska flottor nästan varje år mot den vendiska kusten, brände bosättningar och tog fångar, ibland i allians med hertig Henrik Lejonet av Sachsen och ibland i rivalitet med honom.
The main target was Rügen, home of the pagan Rani and their temple of Svantevit at Arkona. In 1168 Valdemar and Absalon, with Pomeranian allies, took the temple fortress after a siege of only a few days. The great four-headed idol was chopped up and burned. The other strongholds of the island then surrendered, its people were baptised, and their prince, Jaromar, became Valdemar’s vassal. To guard Zealand against raids, Absalon built a castle at Havn, the beginning of Copenhagen.: Huvudmålet var Rügen, hem för de hedniska ranerna och deras Svantevittempel vid Arkona. År 1168 intog Valdemar och Absalon, med pommerska allierade, tempelborgen efter en belägring på bara några dagar. Den stora fyrhövdade gudabilden höggs sönder och brändes. Öns övriga borgar kapitulerade därefter, dess invånare döptes och deras furste Jaromar blev Valdemars vasall. För att skydda Själland mot härjningar byggde Absalon en borg vid Havn, början till Köpenhamn.
