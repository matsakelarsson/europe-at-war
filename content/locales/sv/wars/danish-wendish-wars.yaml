Bridge of Wolin: Bron i Wolin
Duke Casimir of Pomerania tried to trap the Danish fleet at the bridge by the town of Wolin, but the Danes forced their way through.: Hertig Kasimir av Pommern försökte stänga in den danska flottan vid bron vid staden Wolin, men danskarna tvingade sig igenom.
Whitsun 1184: pingsten 1184
Absalon’s fleet surprised and destroyed the Pomeranian ships that had attacked Prince Jaromar of Rügen.: Absalons flotta överraskade och förintade de pommerska fartyg som hade anfallit furst Jaromar av Rügen.
Vordingborg: Vordingborg
