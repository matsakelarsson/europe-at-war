Danish–Wendish wars: Dansk-vendiska krigen
A series of Danish seaborne campaigns under King Valdemar I and Bishop Absalon against the Slavic Wends of the southern Baltic coast, who had raided Denmark for decades. The Danes conquered and converted the island of Rügen in 1168 and in 1185 made the Duke of Pomerania a vassal of the Danish king.: En rad danska sjöburna fälttåg under kung Valdemar I och biskop Absalon mot de slaviska venderna på Östersjöns sydkust, som i årtionden hade härjat Danmark. Danskarna erövrade och kristnade ön Rügen 1168 och gjorde 1185 hertigen av Pommern till den danske kungens vasall.
