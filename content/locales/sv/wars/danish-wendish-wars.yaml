Arkona: Arkona
A fire under one of the towers distracted the defenders, and the Danes stormed the gate. The temple was plundered and destroyed.: En brand under ett av tornen distraherade försvararna, och danskarna stormade porten. Templet plundrades och förstördes.
Charenza (Garz): Karenz (Garz)
Rügen’s main stronghold surrendered without a fight. Absalon had the seven-headed idol of Rugievit cut down and burned.: Rügens främsta borg kapitulerade utan strid. Absalon lät hugga ned och bränna Rugievits sjuhövdade gudabild.
