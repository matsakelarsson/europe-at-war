# Svenska översättningar av katalogtexten (våg 11); stegtexterna kommer senare.
Darul Islam rebellion: Darul Islam-upproret
? "The armed movement for an Islamic state in Indonesia, led by Sekarmadji Maridjan Kartosuwiryo, against the Republic. Darul Islam (“house of Islam”) grew out of the Hizbullah and Sabilillah militias that had fought the Dutch in West Java. When the Renville agreement of January 1948 obliged the Republic’s army to leave West Java for Central Java, these units stayed behind, and in May 1948 Kartosuwiryo formed an Islamic council around Tasikmalaya. On 7 August 1949, as the Republic negotiated with the Dutch, he proclaimed the Islamic State of Indonesia (Negara Islam Indonesia) with himself as imam, and his Islamic Army of Indonesia (TII) fought both the Dutch and the returning Republican army. Other risings, each with grievances of its own, joined it: Amir Fatah in the Brebes and Tegal area of Central Java (1949), Ibnu Hadjar in South Kalimantan (from 1950, in Darul Islam from 1954), Kahar Muzakkar, whose guerrillas had been refused entry into the army as units, in South Sulawesi (from 1950, proclaiming the region part of the Islamic State on 7 August 1953), and Daud Beureu’eh in Aceh (from September 1953), angered when Aceh was merged into the province of North Sumatra. For a decade the rebels controlled much of the hill country of West Java at night and taxed, raided and burned villages that would not support them, while army operations also cost many civilian lives. The army gained the upper hand from about 1959–1960 with the pagar betis (“fence of legs”), in which villagers were made to form human cordons that swept the mountains and drove the rebels before the troops. Kartosuwiryo was captured on Mount Geber near Garut on 4 June 1962, sentenced by a military court and executed in September 1962 on an island in the Bay of Jakarta, and the last bands in West Java surrendered that year. Aceh had already been made a special region in 1959, and Daud Beureu’eh came down from the hills under an amnesty in 1962; Ibnu Hadjar surrendered in 1963 and was executed in 1965, and the movement ended in Sulawesi when Kahar Muzakkar was killed by soldiers in Southeast Sulawesi on 3 February 1965."
: "Den väpnade rörelsen för en islamisk stat i Indonesien, ledd av Sekarmadji Maridjan Kartosuwiryo, mot republiken. Darul Islam (”islams hus”) växte fram ur Hizbullah- och Sabilillahmiliserna, som hade kämpat mot nederländarna på Västra Java. När Renvilleavtalet i januari 1948 tvingade republikens armé att lämna Västra Java för Centrala Java stannade dessa förband kvar, och i maj 1948 bildade Kartosuwiryo ett islamiskt råd kring Tasikmalaya. Den 7 augusti 1949, medan republiken förhandlade med nederländarna, utropade han Islamiska staten Indonesien (Negara Islam Indonesia) med sig själv som imam, och hans Indonesiens islamiska armé (TII) bekämpade både nederländarna och den återvändande republikanska armén. Andra resningar, var och en med sina egna missnöjesanledningar, anslöt sig: Amir Fatah i området kring Brebes och Tegal på Centrala Java (1949), Ibnu Hadjar i Södra Kalimantan (från 1950, inom Darul Islam från 1954), Kahar Muzakkar, vars gerillasoldater hade nekats inträde i armén som samlade förband, i Sydsulawesi (från 1950; den 7 augusti 1953 förklarade han regionen som en del av den islamiska staten) och Daud Beureu’eh i Aceh (från september 1953), som var förbittrad över att Aceh hade slagits samman med provinsen Norra Sumatra. Under ett decennium kontrollerade rebellerna nattetid stora delar av bergslandet på Västra Java och beskattade, plundrade och brände byar som inte ville stödja dem, samtidigt som även arméns operationer kostade många civila livet. Armén fick övertaget från omkring 1959–1960 med pagar betis (”benstaket”), där bybor tvingades bilda mänskliga kedjor som svepte genom bergen och drev rebellerna framför trupperna. Kartosuwiryo tillfångatogs på berget Geber nära Garut den 4 juni 1962, dömdes av en militärdomstol och avrättades i september 1962 på en ö i Jakartabukten, och de sista grupperna på Västra Java kapitulerade samma år. Aceh hade redan 1959 gjorts till en särskild region, och Daud Beureu’eh steg ned från bergen under en amnesti 1962; Ibnu Hadjar kapitulerade 1963 och avrättades 1965, och rörelsen upphörde på Sulawesi när Kahar Muzakkar dödades av soldater på Sydöstra Sulawesi den 3 februari 1965."
