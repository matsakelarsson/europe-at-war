# Svenska översättningar av katalogtexten (våg 9); stegtexterna kommer senare.
Dayan Khan’s wars: Dayan khans krig
? The wars by which Dayan Khan (Batumöngke), a boy of the Chinggisid line proclaimed khan of the Eastern Mongols in about 1479–1480, reunited the Mongols east of the Altai after the collapse of Oirat power. In his early years the campaigns were led by Mandukhai Khatun, widow of the previous khan, who later married him; she defeated the Oirats, and in 1483 the two drove out the taishi Ismayil, who fled towards Hami and was killed there. The right-wing tümens of the Ordos, Tümed and Yöngshiyebü, dominated by the chiefs Ibarai and Mandulai, rejected his authority and killed his son Ulus Bolad when he came to them as jinong. After a defeat at the Turgen stream, Dayan Khan crushed them in 1510 at Dalan Terigün; Mandulai was killed and Ibarai fled to Kokonor, and in 1513 another son, Barsu Bolad, was installed as jinong. Dayan Khan organised the Eastern Mongols into six tümens ruled by his descendants, a structure that lasted until the 17th century. Throughout these years the Mongols raided the Ming frontier, attacking Ningxia in 1500 and Datong and Xuanfu repeatedly, and in 1517 a large raid was turned back by the Zhengde Emperor at Yingzhou; the Ming answered by extending its frontier walls. Dayan Khan’s death is usually dated 1517, though dates up to 1543 are given.
: De krig genom vilka Dayan khan (Batumöngke), en pojke av chinggisidisk ätt som utropades till östmongolernas khan omkring 1479–1480, återförenade mongolerna öster om Altaj efter oiratmaktens sammanbrott. Under hans första år leddes fälttågen av Mandukhai khatun, änka efter den förre khanen, som senare gifte sig med honom; hon besegrade oiraterna, och 1483 drev de två bort taishin Ismayil, som flydde mot Hami och dödades där. Den högra flygelns tümener, Ordos, Tümed och Yöngshiyebü, som dominerades av hövdingarna Ibarai och Mandulai, avvisade hans myndighet och dödade hans son Ulus Bolad när denne kom till dem som jinong. Efter ett nederlag vid bäcken Turgen krossade Dayan khan dem 1510 vid Dalan Terigün; Mandulai dödades och Ibarai flydde till Kokonor, och 1513 insattes en annan son, Barsu Bolad, som jinong. Dayan khan organiserade östmongolerna i sex tümener styrda av hans ättlingar, en struktur som bestod till 1600-talet. Under alla dessa år företog mongolerna räder mot Mingrikets gräns, angrep Ningxia 1500 och upprepade gånger Datong och Xuanfu, och 1517 slogs en stor räd tillbaka av Zhengdekejsaren vid Yingzhou; Ming svarade med att bygga ut sina gränsmurar. Dayan khans död dateras vanligen till 1517, men årtal ända fram till 1543 förekommer.
