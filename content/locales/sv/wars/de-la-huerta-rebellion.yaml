# Svenska översättningar av katalogtexten (våg 14); stegtexterna kommer senare.
De la Huerta rebellion: De la Huerta-upproret
? A military revolt against President Álvaro Obregón after he chose Plutarco Elías Calles to succeed him in the election of 1924. Adolfo de la Huerta, interim president in 1920 and then Obregón’s finance minister, had broken with him over the Bucareli agreements with the United States and over the succession, and became the candidate of the Partido Nacional Cooperatista. On 6 December 1923 General Guadalupe Sánchez rose with the troops in Veracruz, and the next day de la Huerta, who had gone to the port, issued the Plan of Veracruz, accusing Obregón of imposing his successor. Generals Enrique Estrada in Jalisco and Fortunato Maycotte in Oaxaca, with Manuel Diéguez, Salvador Alvarado, Cándido Aguilar and others, joined; between two-fifths and half of the army, some 23,000 men by one count, rebelled, and by mid-December the rebels held most of Veracruz, Tabasco, Jalisco and Oaxaca. But they had no common command or plan. Obregón armed workers’ and peasants’ battalions, the CROM labour federation and agrarista leaders backed the government, and the United States, which had recognised Obregón’s government in 1923, sold it rifles and aircraft. In Yucatán rebel officers shot the socialist governor Felipe Carrillo Puerto and three of his brothers on 3 January 1924, against de la Huerta’s orders. Government troops under Eugenio Martínez beat Sánchez at Esperanza, on the border of Puebla and Veracruz, on 28 January, and in February Obregón defeated Estrada at Ocotlán, on the Lerma, and took Guadalajara. De la Huerta withdrew to Frontera in Tabasco and left for the United States in March; the rebels abandoned Villahermosa, their last stronghold, in June 1924. Thousands died. Many captured rebel generals were shot, among them Maycotte and Diéguez, and Alvarado was killed in Tabasco; the purge left the army more loyal to the Sonoran leaders, and Calles won the election of July 1924.
: En militärrevolt mot president Álvaro Obregón sedan han hade utsett Plutarco Elías Calles till sin efterträdare i valet 1924. Adolfo de la Huerta, tillförordnad president 1920 och därefter Obregóns finansminister, hade brutit med honom på grund av Bucareliavtalen med USA och frågan om efterträdaren, och blev Partido Nacional Cooperatistas kandidat. Den 6 december 1923 reste sig general Guadalupe Sánchez med trupperna i Veracruz, och dagen därpå utfärdade de la Huerta, som hade begett sig till hamnstaden, Veracruzplanen, där han anklagade Obregón för att påtvinga landet sin efterträdare. Generalerna Enrique Estrada i Jalisco och Fortunato Maycotte i Oaxaca anslöt sig, liksom Manuel Diéguez, Salvador Alvarado, Cándido Aguilar med flera; mellan två femtedelar och hälften av armén, enligt en beräkning omkring 23 000 man, gjorde uppror, och i mitten av december höll rebellerna större delen av Veracruz, Tabasco, Jalisco och Oaxaca. Men de saknade gemensamt befäl och gemensam plan. Obregón beväpnade arbetar- och bondebataljoner, den fackliga landsorganisationen CROM och agraristledarna stödde regeringen, och USA, som hade erkänt Obregóns regering 1923, sålde gevär och flygplan till den. I Yucatán arkebuserade upproriska officerare den socialistiske guvernören Felipe Carrillo Puerto och tre av hans bröder den 3 januari 1924, mot de la Huertas order. Regeringstrupper under Eugenio Martínez slog Sánchez vid Esperanza, på gränsen mellan Puebla och Veracruz, den 28 januari, och i februari besegrade Obregón Estrada vid Ocotlán vid Lerma och intog Guadalajara. De la Huerta drog sig tillbaka till Frontera i Tabasco och reste till USA i mars; rebellerna övergav Villahermosa, sitt sista fäste, i juni 1924. Tusentals dog. Många tillfångatagna rebellgeneraler arkebuserades, bland dem Maycotte och Diéguez, och Alvarado dödades i Tabasco; utrensningen gjorde armén mer lojal mot ledarna från Sonora, och Calles vann valet i juli 1924.
