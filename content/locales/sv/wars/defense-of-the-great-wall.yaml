Defence of the Great Wall: Försvaret av Kinesiska muren
? The Japanese conquest of the province of Rehe (Jehol) and the fighting at the passes of the Great Wall in the first months of 1933, which ended with the Tanggu Truce. After the conquest of Manchuria the Kwantung Army claimed Rehe for Manchukuo. It took the Shanhai Pass on 1–3 January 1933, and on 23 February Japanese and Manchukuo troops invaded Rehe, whose governor Tang Yulin fled; Chengde fell on 4 March and Rehe was joined to Manchukuo. Chinese armies, the Northeastern Army of Zhang Xueliang, Song Zheyuan’s 29th Army and divisions of the Central Army, then held the passes of the Great Wall north-east of Beiping for two months, at Xifengkou, Gubeikou, Lengkou and Jielingkou, with heavy losses. In May the Japanese came through the Wall and advanced to within reach of Beiping and Tianjin, and on 31 May 1933 the two sides signed a truce at Tanggu that made the land between the Wall and Beiping a demilitarised zone. Chinese records give about 15,800 soldiers killed and 22,600 wounded from January to May. The truce left the Wall as the de facto border of Manchukuo and opened North China to Japanese pressure.
: Den japanska erövringen av provinsen Rehe (Jehol) och striderna vid Kinesiska murens pass under de första månaderna 1933, som slutade med vapenstilleståndet i Tanggu. Efter erövringen av Manchuriet gjorde Kwantungarmén anspråk på Rehe för Manchukuos räkning. Den intog Shanhaipasset den 1–3 januari 1933, och den 23 februari invaderade japanska trupper och Manchukuotrupper Rehe, vars guvernör Tang Yulin flydde; Chengde föll den 4 mars och Rehe införlivades med Manchukuo. Kinesiska arméer, Zhang Xueliangs Nordöstarmé, Song Zheyuans 29:e armé och divisioner ur Centralarmén, höll sedan murens pass nordost om Beiping i två månader, vid Xifengkou, Gubeikou, Lengkou och Jielingkou, med svåra förluster. I maj tog sig japanerna igenom muren och ryckte fram till inom räckhåll för Beiping och Tianjin, och den 31 maj 1933 undertecknade de båda sidorna ett vapenstillestånd i Tanggu som gjorde området mellan muren och Beiping till en demilitariserad zon. Kinesiska uppgifter anger omkring 15 800 stupade och 22 600 sårade soldater från januari till maj. Vapenstilleståndet lämnade muren som Manchukuos gräns i praktiken och öppnade Nordkina för japanska påtryckningar.
