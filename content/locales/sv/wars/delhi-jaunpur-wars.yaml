# Svenska översättningar av katalogtexten (våg 8); stegtexterna kommer senare.
Delhi–Jaunpur wars: Krigen mellan Delhi och Jaunpur
The wars between the Lodi sultans of Delhi and the Sharqi sultans of Jaunpur, which since Timur’s sack of Delhi in 1398 had been the strongest state in the Ganges plain. In 1452 Mahmud Shah Sharqi besieged Delhi while its new Afghan sultan, Bahlul Lodi, was away in the Punjab; Bahlul returned and defeated him, and the two fought over Etawah and Shamsabad until peace was made in 1457. Husain Shah Sharqi, sultan from 1458, kept a four-year truce, then renewed the war. In 1478 and 1479 he marched on Delhi three times and was beaten each time on the Yamuna or soon after; Bahlul took Kampil, Patiali, Shamsabad and other districts, defeated him again on the Rahab and took Jaunpur. Husain won it back briefly but was driven out and fled to the protection of the sultan of Bengal at Kahalgaon. Bahlul made his son Barbak Shah king of Jaunpur in 1486, and Husain’s last attempt to return was defeated near Benares in 1494.: Krigen mellan lodisultanerna i Delhi och sharqisultanerna i Jaunpur; Jaunpursultanatet hade sedan Timurs plundring av Delhi 1398 varit den starkaste staten på Gangesslätten. År 1452 belägrade Mahmud Shah Sharqi Delhi medan dess nye afghanske sultan, Bahlul Lodi, var borta i Punjab; Bahlul återvände och besegrade honom, och de två stred om Etawah och Shamsabad tills fred slöts 1457. Husain Shah Sharqi, sultan från 1458, höll ett fyraårigt stillestånd och återupptog sedan kriget. Åren 1478 och 1479 marscherade han tre gånger mot Delhi och blev slagen varje gång vid Yamuna eller strax därefter; Bahlul tog Kampil, Patiali, Shamsabad och andra distrikt, besegrade honom på nytt vid floden Rahab och intog Jaunpur. Husain vann tillbaka staden för en kort tid men drevs ut och flydde till Kahalgaon, där han sökte beskydd hos sultanen av Bengalen. Bahlul gjorde sin son Barbak Shah till kung av Jaunpur 1486, och Husains sista försök att återvända slogs tillbaka nära Benares 1494.
Delhi Sultanate (Lodi dynasty): Delhisultanatet (lodidynastin)
Jaunpur Sultanate: Jaunpursultanatet
