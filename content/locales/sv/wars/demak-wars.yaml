# Svenska översättningar av katalogtexten (våg 11); stegtexterna kommer senare.
Demak’s wars: Demaks krig
? "The wars of Demak, the first Muslim sultanate of Java, which in the first half of the 16th century made itself the leading power of the island. Demak, a port on the north coast of Central Java that had broken away from Majapahit, led the Javanese ports against the Portuguese after their capture of Malacca: in January 1513 Pati Unus, the ruler of Japara, attacked Malacca with about 100 ships and was defeated, and Javanese tradition tells of a second attack in 1521 in which he was killed. Under Sultan Trenggana Demak then overcame the last Hindu-Buddhist powers. It defeated Daha, the successor of Majapahit in the Brantas valley, a victory dated by different sources between 1518 and about 1527, and when the Hindu kingdom of Sunda made an alliance with the Portuguese in 1522, Trenggana sent Fatahillah with troops from Demak and Cirebon to take Banten and Sunda Kelapa, which he renamed Jayakarta, in 1527. Campaigns followed against the ports and inland principalities of eastern Java: Tuban, Madiun, Surabaya (1530), Pasuruan and Malang. In 1546 Trenggana was killed while besieging Panarukan, the port of the Hindu kingdom of Blambangan. Demak broke up in a succession war, and its lands passed to Pajang in 1568 and later to Mataram."
: "Krigen som Demak, Javas första muslimska sultanat, förde och genom vilka det under första hälften av 1500-talet gjorde sig till öns ledande makt. Demak, en hamnstad på norra kusten av Centraljava som hade brutit sig loss från Majapahit, ledde de javanesiska hamnstäderna mot portugiserna efter deras erövring av Malacka: i januari 1513 anföll Pati Unus, härskaren i Japara, Malacka med omkring 100 fartyg och besegrades, och den javanesiska traditionen berättar om ett andra anfall 1521 där han dödades. Under sultan Trenggana besegrade Demak därefter de sista hindu-buddhistiska makterna. Det besegrade Daha, Majapahits efterträdare i Brantasdalen, en seger som olika källor daterar till mellan 1518 och omkring 1527, och när det hinduiska kungariket Sunda slöt en allians med portugiserna 1522 sände Trenggana Fatahillah med trupper från Demak och Cirebon, och 1527 intog denne Banten och Sunda Kelapa, som han döpte om till Jayakarta. Därefter följde fälttåg mot hamnstäderna och furstendömena i inlandet på östra Java: Tuban, Madiun, Surabaya (1530), Pasuruan och Malang. År 1546 dödades Trenggana under belägringen av Panarukan, hamnen i det hinduiska kungariket Blambangan. Demak föll sönder i ett tronföljdskrig, och dess länder övergick 1568 till Pajang och senare till Mataram."
