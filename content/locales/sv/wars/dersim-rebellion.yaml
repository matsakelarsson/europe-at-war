Dersim rebellion and massacre: Dersimupproret och massakern i Dersim
The Turkish state’s military campaign of 1937–1938 in Dersim, a mountainous region of Alevi Kurds and Zazas renamed Tunceli in 1935, which followed a local rising under Seyid Riza, hanged in Elazığ in November 1937; with air bombardment, village burnings and reportedly poison gas, thousands of people were killed, many of them civilians, and thousands more deported. Estimates of the dead range from about 13,000, the figure in a 1938 Turkish government document, to tens of thousands, and whether the events should be called a rebellion, a massacre or a genocide remains disputed.: Den turkiska statens militära kampanj 1937–1938 i Dersim, en bergig region befolkad av alevitiska kurder och zazaer som döptes om till Tunceli 1935. Den följde på ett lokalt uppror under Seyid Riza, som hängdes i Elazığ i november 1937; genom flygbombningar, byabränningar och enligt uppgift giftgas dödades tusentals människor, många av dem civila, och ytterligare tusentals deporterades. Uppskattningarna av antalet döda sträcker sig från omkring 13 000, siffran i ett turkiskt regeringsdokument från 1938, till tiotusentals, och huruvida händelserna ska kallas ett uppror, en massaker eller ett folkmord är fortfarande omstritt.
