Desmond Rebellions: Desmondupproren
Two risings in Munster by the FitzGeralds of Desmond and their allies against the spread of English government and Protestantism into the south of Ireland. In the first (1569–1573), James FitzMaurice FitzGerald rose while the Earl of Desmond was held in London, and was crushed by campaigns of deliberate terror under Sir Humphrey Gilbert. In the second (1579–1583), FitzMaurice landed with a small papal force and was soon killed; Gerald FitzGerald, Earl of Desmond, joined the revolt, which spread to Leinster, where Irish forces routed Lord Grey’s army at Glenmalure in 1580. That November several hundred papal soldiers, mostly Italian and Spanish, surrendered at Smerwick and were put to death on Grey’s orders. The English answered the revolt with scorched earth, and war-related famine and disease are thought to have killed up to a third of Munster’s people. The earl was hunted down and killed in November 1583, and his lands were confiscated for the Plantation of Munster.: Två uppror i Munster av FitzGeraldsläkten i Desmond och deras allierade mot det engelska styrets och protestantismens utbredning i södra Irland. I det första (1569–1573) gjorde James FitzMaurice FitzGerald uppror medan earlen av Desmond hölls kvar i London, och han krossades genom fälttåg av avsiktlig terror under sir Humphrey Gilbert. I det andra (1579–1583) landsteg FitzMaurice med en liten påvlig styrka och dödades snart; Gerald FitzGerald, earl av Desmond, anslöt sig till revolten, som spred sig till Leinster, där irländska styrkor krossade lord Greys här vid Glenmalure 1580. I november samma år kapitulerade flera hundra påvliga soldater, mestadels italienare och spanjorer, vid Smerwick och avrättades på Greys order. Engelsmännen svarade på revolten med den brända jordens taktik, och krigsrelaterad svält och sjukdom tros ha dödat upp till en tredjedel av Munsters befolkning. Earlen jagades och dödades i november 1583, och hans gods konfiskerades för koloniseringen av Munster.
