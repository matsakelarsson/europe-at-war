# Svenska översättningar av katalogtexten (våg 7); stegtexterna kommer senare.
Dhofar Rebellion: Dhofarupproret
An insurgency in Dhofar, the mountainous southern province of the Sultanate of Muscat and Oman. It began among the Jebali tribes as a revolt against the neglect and harsh rule of Sultan Said bin Taimur, led from 1965 by the Dhofar Liberation Front, and from 1968, under the name Popular Front for the Liberation of the Occupied Arabian Gulf (PFLOAG), it became a Marxist movement supplied by South Yemen, China and the Soviet Union. By 1970 the rebels held almost all of Dhofar outside the town of Salalah. That year Said was overthrown by his son Qaboos, who combined reforms and an amnesty with a counter-insurgency campaign led by British officers and the SAS, and later with troops from Iran and Jordan. The rebels were pushed back towards the South Yemeni border, and Qaboos declared the war won in December 1975. Estimates of the dead range from a few thousand to about 10,000.: Ett uppror i Dhofar, den bergiga sydliga provinsen i sultanatet Muskat och Oman. Det började bland jebalistammarna som en revolt mot sultan Said bin Taimurs försummelse och hårda styre och leddes från 1965 av Dhofars befrielsefront. Från 1968 blev det, under namnet Folkfronten för befrielse av den ockuperade Arabiska viken (PFLOAG), en marxistisk rörelse som försörjdes av Sydjemen, Kina och Sovjetunionen. År 1970 höll rebellerna nästan hela Dhofar utanför staden Salalah. Samma år störtades Said av sin son Qabus, som kombinerade reformer och amnesti med en upprorsbekämpningskampanj under ledning av brittiska officerare och SAS, och senare med trupper från Iran och Jordanien. Rebellerna trängdes tillbaka mot den sydjemenitiska gränsen, och Qabus förklarade kriget vunnet i december 1975. Uppskattningarna av antalet döda varierar från några tusen till omkring 10 000.
