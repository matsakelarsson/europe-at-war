Djiboutian Civil War: Inbördeskriget i Djibouti
? An armed rising of the Front for the Restoration of Unity and Democracy (FRUD), drawn mainly from the Afar of northern and western Djibouti, against the government of President Hassan Gouled Aptidon, which was dominated by the Issa Somali and his single party, the People’s Rally for Progress. Formed in 1991 from Afar opposition groups, FRUD began its guerrilla campaign in the autumn of 1991, attacked the garrison of Obock in November, took most of the army posts in the north and besieged Tadjourah and Obock. In December 1991 troops fired on a crowd in the Arhiba district of the capital, killing at least 59 people. France, which kept a large garrison in Djibouti, deployed troops in the north from February 1992 as a buffer and pressed for talks, and Djibouti adopted a multi-party constitution in September 1992, although FRUD boycotted the elections. On 5 July 1993 the much-enlarged army launched a counteroffensive that took FRUD’s main base at Assa-Gueyla and the towns of the north and west; some 70,000 civilians were driven from their homes and about 30,000 fled the country. A faction of FRUD under Ali Mohamed Daoud signed a peace agreement at Aba’a on 26 December 1994, joining the government and integrating its fighters into the army; the faction of Ahmed Dini Ahmed fought on at a low level until a final agreement on 12 May 2001. Estimates of the dead are uncertain; FRUD’s losses are given as about 1,000.
: En väpnad resning av Fronten för återupprättande av enhet och demokrati (FRUD), som främst rekryterades bland afarerna i norra och västra Djibouti, mot president Hassan Gouled Aptidons regering, som dominerades av issasomalierna och av hans enda parti, Folkets samling för framsteg. FRUD bildades 1991 av oppositionsgrupper bland afarerna och inledde sitt gerillakrig hösten 1991, anföll garnisonen i Obock i november, intog de flesta av arméns posteringar i norr och belägrade Tadjourah och Obock. I december 1991 öppnade soldater eld mot en folkmassa i huvudstadens stadsdel Arhiba och dödade minst 59 människor. Frankrike, som hade en stor garnison i Djibouti, satte från februari 1992 in trupper i norr som buffert och verkade för förhandlingar, och Djibouti antog en flerpartiförfattning i september 1992, även om FRUD bojkottade valen. Den 5 juli 1993 inledde den kraftigt utökade armén en motoffensiv som intog FRUD:s huvudbas vid Assa-Gueyla och städerna i norr och väster; omkring 70 000 civila drevs från sina hem och omkring 30 000 flydde landet. En falang av FRUD under Ali Mohamed Daoud undertecknade ett fredsavtal i Aba’a den 26 december 1994, gick in i regeringen och införlivade sina kämpar i armén; Ahmed Dini Ahmeds falang fortsatte striderna i liten skala fram till ett slutligt avtal den 12 maj 2001. Uppskattningarna av antalet döda är osäkra; FRUD:s förluster anges till omkring 1 000.
