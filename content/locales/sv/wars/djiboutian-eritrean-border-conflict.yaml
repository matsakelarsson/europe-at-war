# Svenska översättningar av katalogtexten (våg 12); stegtexterna kommer senare.
Djiboutian–Eritrean border conflict: Gränskonflikten mellan Djibouti och Eritrea
? A short border war between Djibouti and Eritrea at Ras Doumeira, a headland on the Bab-el-Mandeb strait where their border meets the Red Sea, and the small Doumeira Island offshore. The 1900 Franco-Italian protocol put the border on the headland but left its exact line and the island unclear, and the two countries had already clashed there in 1996. From early 2008 Eritrean troops dug in around Ras Doumeira, and Djibouti moved troops to face them. On 10 June 2008, after several Eritrean soldiers deserted to the Djiboutian lines, fighting broke out and lasted until 13 June. Djibouti reported 44 of its soldiers killed and 55 wounded and estimated Eritrean losses at about 100 dead; Eritrea gave no figures and denied having attacked. France, which has a base in Djibouti, gave logistical, medical and intelligence support. The UN Security Council called on Eritrea to withdraw (Resolution 1862, January 2009) and in December 2009 imposed sanctions on it, also for its support of armed groups in Somalia. In June 2010 both sides accepted Qatari mediation and Qatar sent observers to the border; when they left in June 2017, Djibouti accused Eritrea of reoccupying the disputed hill and island. Eritrea released Djiboutian prisoners in 2016, and in September 2018, amid the wider Eritrean–Ethiopian peace, the two governments agreed to normalise relations, but the border has not been demarcated.
: Ett kort gränskrig mellan Djibouti och Eritrea vid Ras Doumeira, en udde vid Bab el-Mandebsundet där ländernas gräns når Röda havet, och den lilla ön Doumeira utanför. Det fransk-italienska protokollet från 1900 lade gränsen på udden men lämnade dess exakta sträckning och ön oklara, och de två länderna hade redan drabbat samman där 1996. Från början av 2008 grävde eritreanska trupper ned sig kring Ras Doumeira, och Djibouti förde fram trupper mot dem. Den 10 juni 2008, sedan flera eritreanska soldater hade deserterat till de djiboutiska linjerna, bröt strider ut som varade till den 13 juni. Djibouti uppgav att 44 av dess soldater hade dödats och 55 sårats och uppskattade de eritreanska förlusterna till omkring 100 döda; Eritrea lämnade inga siffror och förnekade att landet hade anfallit. Frankrike, som har en bas i Djibouti, gav logistiskt och medicinskt stöd samt underrättelsestöd. FN:s säkerhetsråd uppmanade Eritrea att dra sig tillbaka (resolution 1862, januari 2009) och införde i december 2009 sanktioner mot landet, även för dess stöd till väpnade grupper i Somalia. I juni 2010 godtog båda sidor qatarisk medling, och Qatar sände observatörer till gränsen; när de lämnade den i juni 2017 anklagade Djibouti Eritrea för att på nytt ha ockuperat den omstridda kullen och ön. Eritrea frigav djiboutiska fångar 2016, och i september 2018, mitt under den bredare freden mellan Eritrea och Etiopien, enades de två regeringarna om att normalisera förbindelserna, men gränsen har inte märkts ut.
