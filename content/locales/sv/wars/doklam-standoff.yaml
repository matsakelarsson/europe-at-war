Doklam standoff: Konfrontationen i Doklam
A 73-day military standoff between India and China on the Doklam plateau, a high pasture claimed by both Bhutan and China near the point where Bhutan, China and the Indian state of Sikkim meet. On 16 June 2017 Chinese troops with road-building equipment began extending a track across the plateau towards the Jampheri ridge, which overlooks the narrow Siliguri corridor linking north-eastern India with the rest of the country. Bhutan protested, and on 18 June some 270 Indian soldiers crossed from their posts at Doka La in Sikkim, with two bulldozers, and stopped the work. Hundreds of troops faced each other a few metres apart for more than two months while China demanded an unconditional Indian withdrawal and its state media warned of war; no shots were fired. On 28 August both sides announced that they had disengaged and the road building stopped. China kept a strong military presence in the northern part of the plateau, where it later built roads, posts and villages.: En 73 dagar lång militär konfrontation mellan Indien och Kina på Doklamplatån, en högt belägen betesmark som både Bhutan och Kina gör anspråk på, nära den punkt där Bhutan, Kina och den indiska delstaten Sikkim möts. Den 16 juni 2017 började kinesiska trupper med vägbyggnadsutrustning förlänga en väg över platån mot Jampheriåsen, som överblickar den smala Siligurikorridoren som förbinder nordöstra Indien med resten av landet. Bhutan protesterade, och den 18 juni gick omkring 270 indiska soldater med två bulldozrar över från sina posteringar vid Doka La i Sikkim och stoppade arbetet. Hundratals soldater stod mitt emot varandra på några meters avstånd i mer än två månader, medan Kina krävde ett villkorslöst indiskt tillbakadragande och kinesiska statsmedier varnade för krig; inga skott avlossades. Den 28 augusti meddelade båda sidor att de hade dragit tillbaka sina styrkor, och vägbygget upphörde. Kina behöll en stark militär närvaro i den norra delen av platån, där landet senare byggde vägar, posteringar och byar.
India: Indien
Bhutan: Bhutan
China: Kina
