# Svenska översättningar av katalogtexten (våg 14); stegtexterna kommer senare.
Dominican Civil War: Dominikanska inbördeskriget
? The civil war of 1965 in Santo Domingo, also called the April Revolution, between the Constitutionalists, officers and armed civilians who wanted to restore the elected president Juan Bosch and the constitution of 1963, and the Loyalists of the military establishment, and the American intervention that ended it. Bosch, the first freely elected president after the assassination of the dictator Rafael Trujillo in 1961, had been overthrown by the army in September 1963. On 24 April 1965 a group of officers rose against the civilian triumvirate that followed, crowds poured into the streets and the Constitutionalists, led militarily by Colonel Francisco Caamaño, armed civilians and drove back an attack by Loyalist tanks and aircraft under General Elías Wessin y Wessin at the Duarte Bridge on 27 April. On 28 April President Lyndon Johnson sent in the Marines, to protect American lives and, as he said, to stop a communist takeover; some 22,000 American troops landed, with more offshore, cut the rebel zone in the old city off from the rest of Santo Domingo and opened a corridor across the capital. The Organization of American States joined the occupation with an Inter-American Peace Force of troops from Brazil, Honduras, Paraguay, Nicaragua, Costa Rica and El Salvador. Loyalist forces under the Government of National Reconstruction of General Antonio Imbert Barrera cleared the northern districts in May, and fighting flared again in June, but OAS mediation led to an Act of Reconciliation, and on 3 September 1965 Héctor García-Godoy became provisional president. Joaquín Balaguer defeated Bosch in the elections of 1 June 1966, and the last foreign troops left in September 1966. Estimates of Dominican casualties, killed and wounded, run to about 6,000; the United States lost 27 killed in action and 44–47 dead in all.
: Inbördeskriget 1965 i Santo Domingo, även kallat aprilrevolutionen, mellan konstitutionalisterna, officerare och beväpnade civila som ville återinsätta den valde presidenten Juan Bosch och 1963 års författning, och lojalisterna inom den militära ledningen, samt den amerikanska intervention som gjorde slut på det. Bosch, den förste fritt valde presidenten efter mordet på diktatorn Rafael Trujillo 1961, hade störtats av armén i september 1963. Den 24 april 1965 reste sig en grupp officerare mot det civila triumvirat som hade följt, folkmassor strömmade ut på gatorna, och konstitutionalisterna, militärt ledda av överste Francisco Caamaño, beväpnade civila och slog den 27 april tillbaka ett anfall av lojalisternas stridsvagnar och flygplan under general Elías Wessin y Wessin vid Duartebron. Den 28 april sände president Lyndon Johnson in marinkåren, för att skydda amerikanska liv och, som han sade, för att hindra ett kommunistiskt maktövertagande; omkring 22 000 amerikanska soldater landsteg, med fler till havs, skar av rebellernas zon i gamla staden från resten av Santo Domingo och öppnade en korridor tvärs genom huvudstaden. Amerikanska samarbetsorganisationen (OAS) anslöt sig till ockupationen med en interamerikansk fredsstyrka med trupper från Brasilien, Honduras, Paraguay, Nicaragua, Costa Rica och El Salvador. Lojalistiska styrkor under general Antonio Imbert Barreras regering för nationell återuppbyggnad rensade de norra stadsdelarna i maj, och striderna blossade upp igen i juni, men OAS:s medling ledde till en försoningsakt, och den 3 september 1965 blev Héctor García-Godoy provisorisk president. Joaquín Balaguer besegrade Bosch i valet den 1 juni 1966, och de sista utländska trupperna lämnade landet i september 1966. Uppskattningarna av de dominikanska förlusterna, döda och sårade, uppgår till omkring 6 000; USA förlorade 27 man stupade i strid och 44–47 döda sammanlagt.
Constitutionalists (Francisco Caamaño, for the return of Juan Bosch): Konstitutionalister (Francisco Caamaño, för Juan Boschs återkomst)
Loyalists (Elías Wessin y Wessin’s forces, from 7 May 1965 the Government of National Reconstruction of Antonio Imbert Barrera): Lojalister (Elías Wessin y Wessins styrkor, från den 7 maj 1965 Antonio Imbert Barreras regering för nationell återuppbyggnad)
