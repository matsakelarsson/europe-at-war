# Svenska översättningar av katalogtexten (våg 14); stegtexterna kommer senare.
Dominican Restoration War: Dominikanska restaurationskriget
? The war in which Dominicans ended Spain’s rule over their country, which President Pedro Santana had handed back to Spain in 1861. Spanish officials, taxes, requisitions and a tobacco monopoly, church demands and rumours that slavery would return turned much of the population against the annexation. On 16 August 1863 Santiago Rodríguez and a band of exiles from Haiti raised the Dominican flag on the hill of Capotillo, near Dajabón; the Cibao rose, the Spanish garrison was driven out of Santiago, and on 14 September a provisional government there proclaimed the republic restored. Spain sent tens of thousands of soldiers from Cuba, Puerto Rico and Spain, who held the capital and the ports and retook the south-west, but they could not reconquer the Cibao, guerrillas cut their roads, and yellow fever and other diseases killed far more of them than the fighting did. With the war unpopular in Spain and the Union winning the American Civil War, Queen Isabella II annulled the annexation on 3 March 1865, and the last Spanish troops left in July. Spain had lost more than 10,000 men, most of them to disease.
: Det krig genom vilket dominikanerna gjorde slut på Spaniens styre över deras land, som president Pedro Santana hade lämnat tillbaka till Spanien 1861. Spanska ämbetsmän, skatter, rekvisitioner och ett tobaksmonopol, kyrkans krav och rykten om att slaveriet skulle återinföras vände stora delar av befolkningen mot annekteringen. Den 16 augusti 1863 hissade Santiago Rodríguez och en grupp landsflyktiga från Haiti den dominikanska flaggan på kullen Capotillo nära Dajabón; Cibao reste sig, den spanska garnisonen drevs ut ur Santiago, och den 14 september förklarade en provisorisk regering där republiken återupprättad. Spanien sände tiotusentals soldater från Kuba, Puerto Rico och Spanien, som höll huvudstaden och hamnarna och återtog sydväst, men de kunde inte återerövra Cibao, gerillan skar av deras vägar, och gula febern och andra sjukdomar dödade långt fler av dem än striderna gjorde. Eftersom kriget var impopulärt i Spanien och unionen höll på att vinna det amerikanska inbördeskriget upphävde drottning Isabella II annekteringen den 3 mars 1865, och de sista spanska trupperna lämnade landet i juli. Spanien hade förlorat mer än 10 000 man, de flesta genom sjukdomar.
