# Svenska översättningar av katalogtexten (våg 14); stegtexterna kommer senare.
Dominican War of Independence: Dominikanska självständighetskriget
? The wars in which the Dominican Republic broke away from Haiti, which had ruled the whole of Hispaniola since 1822, and beat off Haitian attempts to reunite the island. Juan Pablo Duarte’s secret society La Trinitaria, founded in 1838, and conservatives who hoped for French protection joined forces after the revolution of 1843 in Haiti, and on 27 February 1844 Francisco del Rosario Sánchez and Matías Ramón Mella proclaimed independence at the Puerta del Conde in Santo Domingo. President Charles Rivière-Hérard invaded in March 1844, but his armies were repulsed at Azua (19 March) and Santiago (30 March), a Dominican squadron won off Tortuguero (15 April), and a rising in Haiti that overthrew Hérard ended the campaign. Pedro Santana, the cattle rancher who led the Army of the South, seized power and exiled Duarte. Further Haitian invasions were beaten at La Estrelleta and Beler (1845), at El Número and Las Carreras (April 1849) under Faustin Soulouque, and, after Soulouque had made himself emperor, at Santomé, Cambronal (22 December 1855) and Sabana Larga (24 January 1856), after which Haiti made no further attempt to retake the east. In 1861 Santana handed the country back to Spain, which led to the Dominican Restoration War.
: De krig genom vilka Dominikanska republiken bröt sig loss från Haiti, som hade styrt hela Hispaniola sedan 1822, och slog tillbaka haitiska försök att återförena ön. Juan Pablo Duartes hemliga sällskap La Trinitaria, grundat 1838, och konservativa som hoppades på franskt beskydd gjorde gemensam sak efter revolutionen 1843 i Haiti, och den 27 februari 1844 utropade Francisco del Rosario Sánchez och Matías Ramón Mella självständigheten vid Puerta del Conde i Santo Domingo. President Charles Rivière-Hérard invaderade i mars 1844, men hans arméer slogs tillbaka vid Azua (19 mars) och Santiago (30 mars), en dominikansk eskader segrade utanför Tortuguero (15 april), och ett uppror i Haiti som störtade Hérard gjorde slut på fälttåget. Pedro Santana, den boskapsuppfödare som ledde Sydarmén, tog makten och landsförvisade Duarte. Nya haitiska invasioner slogs tillbaka vid La Estrelleta och Beler (1845), vid El Número och Las Carreras (april 1849) under Faustin Soulouque och, sedan Soulouque hade gjort sig till kejsare, vid Santomé, Cambronal (22 december 1855) och Sabana Larga (24 januari 1856), varefter Haiti inte gjorde något ytterligare försök att återta öns östra del. År 1861 lämnade Santana tillbaka landet till Spanien, vilket ledde till det dominikanska restaurationskriget.
