# Svenska översättningar av katalogtexten (våg 10); stegtexterna kommer senare.
Donghak Peasant Revolution: Donghakrevolutionen
? A peasant rising in south-western Korea led by members of Donghak (“Eastern Learning”), a religion founded in 1860. It began on 15 February 1894 at Gobu, where Jeon Bong-jun led farmers against a corrupt magistrate, and grew in the spring into a rebellion across Jeolla. The peasant army beat government troops at Hwangtohyeon on 11 May and on the Hwangryong River on 27 May, and entered Jeonju, the provincial capital, on 31 May. The government asked the Qing for troops; Japan sent its own, and the rebels made a truce at Jeonju in June and set up local offices of their own across Jeolla. After Japanese troops seized the royal palace in July and the First Sino-Japanese War began, the Donghak rose again in October, this time against the Japanese. At Ugeumchi, outside Gongju, Japanese and government troops with modern rifles destroyed the peasant army in early December. Jeon was captured at the end of the year and hanged with other leaders on 24 April 1895. Estimates of the peasants killed range from tens of thousands to several hundred thousand.
: Ett bondeuppror i sydvästra Korea som leddes av medlemmar av Donghak (”österländsk lära”), en religion som grundats 1860. Det började den 15 februari 1894 i Gobu, där Jeon Bong-jun ledde bönder mot en korrumperad prefekt, och växte under våren till ett uppror över hela Jeolla. Bondearmén besegrade regeringstrupper vid Hwangtohyeon den 11 maj och vid Hwangryongfloden den 27 maj och tågade den 31 maj in i provinshuvudstaden Jeonju. Regeringen bad Qing om trupper; Japan sände egna, och rebellerna slöt i juni vapenvila i Jeonju och inrättade egna lokala förvaltningskontor över hela Jeolla. Sedan japanska trupper i juli hade bemäktigat sig kungapalatset och första kinesisk-japanska kriget hade brutit ut reste sig Donghakrörelsen på nytt i oktober, denna gång mot japanerna. Vid Ugeumchi, utanför Gongju, förintade japanska trupper och regeringstrupper med moderna gevär bondearmén i början av december. Jeon tillfångatogs i slutet av året och hängdes tillsammans med andra ledare den 24 april 1895. Uppskattningarna av antalet dödade bönder varierar från tiotusentals till flera hundra tusen.
