# Svenska översättningar av katalogtexten (våg 9); stegtexterna kommer senare.
Drikung rebellion: Drikungupproret
The revolt of the Drikung Kagyu school against the Sakya regime that governed Tibet for Kublai Khan. The monastery of Drikung Thil, north-east of Lhasa, founded in 1179, headed one of the myriarchies (tribute districts) of central Tibet and had been the strongest rival of Sakya before the Mongols made the Sakya lamas their regents. In 1285 Drikung forces attacked and destroyed the monastery of Jayül, killing its abbot, and the Drikung looked for help to the Mongol princes of Central Asia who were at war with Kublai; some sources name the Chagatai khan Du’a, an ally of Kaidu. In 1290 the Sakya ponchen (chief administrator) Aglen, with Mongol troops led by Kublai’s grandson Temür Buqa, defeated the Drikung and burned Drikung Thil; one account gives 10,000 dead. The monastery was rebuilt in the following decades with the help of the emperor and of Sakya, but Drikung lost its political influence for a long time, and Sakya rule lasted until the Phagmodrupa rose in the 1350s.: Drikung kagyu-skolans revolt mot den Sakyaregim som styrde Tibet åt Khubilai khan. Klostret Drikung Thil nordost om Lhasa, grundat 1179, stod i spetsen för en av centrala Tibets myriarkier (tributdistrikt) och hade varit Sakyas starkaste rival innan mongolerna gjorde Sakyalamorna till sina regenter. År 1285 angrep Drikungs styrkor och förstörde klostret Jayül och dödade dess abbot, och Drikung sökte hjälp hos de mongoliska furstar i Centralasien som låg i krig med Khubilai; vissa källor nämner tjagataikhanen Du’a, en bundsförvant till Kaidu. År 1290 besegrade Sakyas ponchen (högste administratör) Aglen, med mongoliska trupper under Khubilais sonson Temür Buqa, Drikung och brände Drikung Thil; enligt en uppgift dog 10 000 människor. Klostret byggdes upp igen under de följande decennierna med hjälp av kejsaren och Sakya, men Drikung förlorade för lång tid sitt politiska inflytande, och Sakyas styre varade tills Phagmodrupa reste sig på 1350-talet.
