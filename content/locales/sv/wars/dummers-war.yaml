# Svenska översättningar av katalogtexten (våg 14); stegtexterna kommer senare.
Dummer’s War: Dummers krig
? A war between the Wabanaki Confederacy and New England and Nova Scotia over the lands between the Kennebec River and Acadia. The Wabanaki had never accepted the British sovereignty written into the Treaty of Portsmouth of 1713, and as New England settlers and forts spread east of the Kennebec they resisted, encouraged and armed by New France and by the Jesuit missionary Sébastien Rale at Norridgewock. After New Englanders raided Norridgewock in January 1722 to seize Rale, the Wabanaki burned the settlement of Brunswick, and Governor Samuel Shute of Massachusetts declared war on 25 July 1722; Lieutenant Governor William Dummer, after whom the war is named, directed it once Shute left for England. In Nova Scotia the Mi’kmaq and Wolastoqiyik (Maliseet) blockaded Annapolis Royal, seized New England fishing boats and fought at Winnepang (Jeddore Harbour) in 1722, and attacked Annapolis Royal again in 1724, while in the west the Abenaki leader Gray Lock raided the towns of the Connecticut valley. On 12 August 1724 (23 August New Style) some 200 rangers under Jeremiah Moulton and Johnson Harmon surprised Norridgewock, killing Rale, the sachem Mog and, by most accounts, about 80 Abenaki, many of them women and children, and burning the village. On 9 May 1725 John Lovewell’s company of volunteer scalp hunters fought the Pequawket Abenaki under Paugus at Pequawket (Fryeburg, Maine); both leaders were killed, only about 20 of Lovewell’s men survived, and the Pequawket afterwards left their town for Canada. Penobscot leaders led by Loron (Sauguaaram) negotiated a peace, signed at Boston on 15 December 1725 and confirmed with the Mi’kmaq at Annapolis Royal in 1726 and at Falmouth in 1727. The English text declared the Wabanaki subjects of the Crown; Loron said publicly that they had agreed to peace, not to submission.
: Ett krig mellan Wabanakiförbundet och New England och Nova Scotia om landet mellan Kennebecfloden och Akadien. Wabanaki hade aldrig godtagit den brittiska suveränitet som skrivits in i fördraget i Portsmouth 1713, och när nybyggare och fort från New England spred sig öster om Kennebec gjorde de motstånd, uppmuntrade och beväpnade av Nya Frankrike och av jesuitmissionären Sébastien Rale i Norridgewock. Sedan män från New England i januari 1722 hade gjort en räd mot Norridgewock för att gripa Rale brände wabanaki bosättningen Brunswick, och guvernör Samuel Shute av Massachusetts förklarade krig den 25 juli 1722; viceguvernör William Dummer, som kriget är uppkallat efter, ledde det sedan Shute rest till England. I Nova Scotia blockerade mi’kmaq och wolastoqiyik (maliseet) Annapolis Royal, beslagtog fiskebåtar från New England och stred vid Winnepang (Jeddore Harbour) 1722, och de anföll Annapolis Royal på nytt 1724, medan abenakiledaren Gray Lock i väster gjorde räder mot orterna i Connecticutdalen. Den 12 augusti 1724 (23 augusti enligt nya stilen) överraskade omkring 200 rangers under Jeremiah Moulton och Johnson Harmon Norridgewock, dödade Rale, sachem Mog och, enligt de flesta uppgifter, omkring 80 abenaki, många av dem kvinnor och barn, och brände byn. Den 9 maj 1725 stred John Lovewells kompani av frivilliga skalpjägare mot pequawketabenaki under Paugus vid Pequawket (Fryeburg, Maine); båda ledarna dödades, bara omkring 20 av Lovewells män överlevde, och pequawket lämnade efteråt sin by och drog till Kanada. Penobscotledare under Loron (Sauguaaram) förhandlade fram en fred, som undertecknades i Boston den 15 december 1725 och bekräftades med mi’kmaq i Annapolis Royal 1726 och i Falmouth 1727. Den engelska texten förklarade wabanaki för kronans undersåtar; Loron sade offentligt att de hade gått med på fred, inte på underkastelse.
Wabanaki Confederacy (Abenaki, Penobscot, Wolastoqiyik and Mi’kmaq), with Gray Lock’s western Abenaki: Wabanakiförbundet (abenaki, penobscot, wolastoqiyik och mi’kmaq), med Gray Locks västliga abenaki
Massachusetts (with Maine and New Hampshire) and Nova Scotia: Massachusetts (med Maine och New Hampshire) och Nova Scotia
