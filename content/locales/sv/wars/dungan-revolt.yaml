# Svenska översättningar av katalogtexten (våg 9); stegtexterna kommer senare.
Dungan Revolt: Dunganupproret
? A series of risings of the Hui (Chinese-speaking Muslims, called Dungans in Central Asia) and other Muslims against the Qing in north-western China, also called the Tongzhi Hui Revolt. Fighting between Hui and Han militias in Shaanxi in 1862, as Taiping and Nian armies approached, turned into a war of massacres on both sides; the Hui besieged Xi’an and then fell back into Gansu, where leaders such as Ma Hualong of the Jahriyya Sufi order held much of the province. In 1864 the Muslims of Xinjiang rose too, and Qing rule there collapsed. Yakub Beg, an officer from Kokand, built a state in the Tarim Basin and took Ürümqi from the Dungans in 1870, while Russia occupied the Ili valley. From 1867 Zuo Zongtang reconquered Shaanxi and Gansu, taking Jinjibao in 1871, Hezhou and Xining in 1872 and Suzhou in 1873, with mass executions and deportations, and in 1876–1877 he retook Xinjiang. The north-west lost a large part of its population; estimates of the dead range from about 8 to 12 million, and one demographic study puts the total loss, by violence, famine, plague and flight, at about 21 million.
: En serie resningar bland hui (kinesisktalande muslimer, i Centralasien kallade dunganer) och andra muslimer mot Qing i nordvästra Kina, även kallad Tongzhitidens huiuppror. Strider mellan hui- och hanmiliser i Shaanxi 1862, när taiping- och nianarméer närmade sig, övergick i ett krig med massakrer på båda sidor; hui belägrade Xi’an och drog sig sedan tillbaka till Gansu, där ledare som Ma Hualong från sufiorden jahriyya höll stora delar av provinsen. År 1864 reste sig även muslimerna i Xinjiang, och Qingstyret där bröt samman. Yakub Beg, en officer från Kokand, byggde upp en stat i Tarimbäckenet och tog Ürümqi från dunganerna 1870, medan Ryssland ockuperade Ilidalen. Från 1867 återerövrade Zuo Zongtang Shaanxi och Gansu och intog Jinjibao 1871, Hezhou och Xining 1872 och Suzhou 1873, med massavrättningar och deportationer, och 1876–1877 återtog han Xinjiang. Nordväst förlorade en stor del av sin befolkning; uppskattningarna av antalet döda varierar från omkring 8 till 12 miljoner, och en demografisk studie anger den totala förlusten, genom våld, svält, pest och flykt, till omkring 21 miljoner.
