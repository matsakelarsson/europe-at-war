# Svenska översättningar av katalogtexten (våg 11); stegtexterna kommer senare.
Dutch capture of Malacca: Nederländarnas erövring av Malacka
? The siege and capture of Portuguese Malacca, the fortified port on the Strait of Malacca that Portugal had held since 1511, by the Dutch East India Company (VOC) and its ally Johor, the sultanate founded by the heirs of the Malay kings whom the Portuguese had driven out. After failed attempts in 1606, 1608 and the 1620s, and years of blockade that cut the town’s trade, the Company landed about 600 soldiers and sailors with Javanese, Bandanese and Mardijker auxiliaries on 3 August 1640, and Johor sent 500–600 men. The Portuguese garrison of 260 soldiers, with 2,000–3,000 local and mixed-descent defenders, held the walls of the fortress of A Famosa for five months, while famine and disease killed thousands in the town and in the besiegers’ camps; three Dutch commanders in turn died of illness. On 14 January 1641 about 650 Dutch troops under Johannes Lamotius stormed the walls and the governor, Manuel de Sousa Coutinho, surrendered. The Portuguese reported about 7,000 dead, and the Dutch lost about 1,000 men. Dutch Malacca remained a secondary post beside Batavia until it passed to Britain in 1825.
: Belägringen och erövringen av Portugisiska Malacka, den befästa hamnstaden vid Malackasundet som Portugal hade hållit sedan 1511, genom Nederländska ostindiska kompaniet (VOC) och dess bundsförvant Johor, det sultanat som grundats av arvtagarna till de malajiska kungar som portugiserna hade drivit ut. Efter misslyckade försök 1606, 1608 och på 1620-talet, och år av blockad som skar av stadens handel, landsatte kompaniet den 3 augusti 1640 omkring 600 soldater och sjömän med hjälptrupper av javaneser, bandaneser och mardijkers, och Johor sände 500–600 man. Den portugisiska garnisonen på 260 soldater, med 2 000–3 000 lokala försvarare och försvarare av blandad härkomst, höll murarna i fästningen A Famosa i fem månader, medan svält och sjukdomar dödade tusentals i staden och i belägrarnas läger; tre nederländska befälhavare dog i tur och ordning av sjukdom. Den 14 januari 1641 stormade omkring 650 nederländska soldater under Johannes Lamotius murarna, och guvernören, Manuel de Sousa Coutinho, kapitulerade. Portugiserna rapporterade omkring 7 000 döda, och nederländarna förlorade omkring 1 000 man. Nederländska Malacka förblev en underordnad post vid sidan av Batavia tills det övergick till Storbritannien 1825.
