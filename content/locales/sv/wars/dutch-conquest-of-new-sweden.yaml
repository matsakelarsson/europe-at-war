Dutch conquest of New Sweden: Den nederländska erövringen av Nya Sverige
? The seizure of the Swedish colony on the Delaware River by New Netherland in 1655. New Sweden, founded at Fort Christina (Wilmington) in 1638 on land the Dutch claimed, traded for furs with the Lenape and the Susquehannock, and its few hundred Swedish and Finnish colonists farmed both banks of the river. In 1651 Peter Stuyvesant built Fort Casimir (New Castle) a few miles below Fort Christina to cut off its trade; in May 1654 the new Swedish governor, Johan Risingh, took it without a fight and renamed it Fort Trinity. On orders from the West India Company, Stuyvesant sailed from New Amsterdam in 1655 with seven ships and 317 soldiers. Fort Trinity surrendered on 11 September, and Fort Christina, besieged and short of men and powder, on 15 September; no one was killed in the fighting. The same day hundreds of Munsee entered New Amsterdam, leading to the Peach War. New Sweden became part of New Netherland, but its colonists kept their lands, church, courts and militia, and Swedish Lutheran congregations survived on the Delaware for more than a century. It was a conflict between the two trading companies, not between the Dutch Republic and Sweden, which were not at war.
: Nya Nederländernas erövring av den svenska kolonin vid Delawarefloden 1655. Nya Sverige, som hade grundats vid Fort Kristina (Wilmington) 1638 på mark som nederländarna gjorde anspråk på, idkade pälshandel med lenape och susquehannock, och dess några hundra svenska och finska kolonister odlade jorden på båda sidor om floden. År 1651 byggde Peter Stuyvesant Fort Casimir (New Castle) några engelska mil nedströms från Fort Kristina för att skära av dess handel; i maj 1654 intog den nye svenske guvernören, Johan Risingh, fortet utan strid och döpte om det till Fort Trefaldighet. På order från Västindiska kompaniet seglade Stuyvesant från Nya Amsterdam 1655 med sju skepp och 317 soldater. Fort Trefaldighet kapitulerade den 11 september, och Fort Kristina, som var belägrat och hade brist på manskap och krut, den 15 september; ingen dödades i striderna. Samma dag tågade hundratals munsee in i Nya Amsterdam, vilket ledde till persikokriget. Nya Sverige blev en del av Nya Nederländerna, men kolonisterna behöll sin jord, sin kyrka, sina domstolar och sin milis, och svenska lutherska församlingar levde kvar vid Delawarefloden i mer än ett sekel. Det var en konflikt mellan de två handelskompanierna, inte mellan Nederländska republiken och Sverige, som inte låg i krig med varandra.
