# Svenska översättningar av katalogtexten (våg 11); stegtexterna kommer senare.
Dutch conquest of the Banda Islands: Nederländarnas erövring av Bandaöarna
? "The conquest of the Banda Islands, the world’s only source of nutmeg and mace, by the Dutch East India Company (VOC), which ended in the killing, starvation, enslavement and expulsion of most of their people. The Bandanese, governed by councils of village elders (orang kaya), sold their spices to all comers and refused to keep to contracts giving the Company a monopoly. In 1609 they killed the Dutch admiral Pieter Verhoeff and 45 of his men during talks on Banda Neira, where the Dutch then built Fort Nassau. Punitive expeditions followed, and the English East India Company, which offered better prices, encouraged the islanders’ resistance from Ai and Run. In 1616 the Dutch took Ai, and Nathaniel Courthope held Run for the English until he was killed in 1620. In 1621 Governor-General Jan Pieterszoon Coen invaded the main island, Lontor, with about 1,900 Dutch soldiers and Japanese mercenaries. After an accused conspiracy, orang kaya were tortured and beheaded, and through 1621 Company troops hunted the islanders through the hills. Of a population estimated at about 15,000, sources estimate that only about 1,000 remained on the islands: thousands died of violence, hunger and disease, about 1,700 or more were enslaved or deported to Batavia, and others fled to the Kei Islands and Seram. The Company divided the nutmeg groves among Dutch planters (perkeniers) worked by enslaved people. Many historians describe the conquest as a genocide."
: "Nederländska ostindiska kompaniets (VOC) erövring av Bandaöarna, världens enda källa till muskotnöt och muskotblomma, som slutade med att större delen av öarnas befolkning dödades, dog av svält, förslavades eller fördrevs. Bandaneserna, som styrdes av råd av byäldste (orang kaya), sålde sina kryddor till alla som kom och vägrade att hålla sig till kontrakt som gav kompaniet monopol. År 1609 dödade de den nederländske amiralen Pieter Verhoeff och 45 av hans män under förhandlingar på Banda Neira, där nederländarna sedan byggde Fort Nassau. Straffexpeditioner följde, och Engelska Ostindiska Kompaniet, som erbjöd bättre priser, uppmuntrade öbornas motstånd från Ai och Run. År 1616 intog nederländarna Ai, och Nathaniel Courthope höll Run för engelsmännen tills han dödades 1620. År 1621 invaderade generalguvernör Jan Pieterszoon Coen huvudön Lontor med omkring 1 900 nederländska soldater och japanska legosoldater. Efter en påstådd sammansvärjning torterades och halshöggs orang kaya, och under hela 1621 jagade kompaniets trupper öborna genom bergen. Av en befolkning som uppskattas till omkring 15 000 fanns enligt källornas uppskattningar bara omkring 1 000 kvar på öarna: tusentals dog av våld, svält och sjukdomar, omkring 1 700 eller fler förslavades eller deporterades till Batavia, och andra flydde till Keiöarna och Seram. Kompaniet delade upp muskotlundarna mellan nederländska plantageägare (perkeniers) som lät förslavade människor arbeta i dem. Många historiker beskriver erövringen som ett folkmord."
