# Svenska översättningar av katalogtexten (våg 11); stegtexterna kommer senare.
Dutch East Indies campaign: Fälttåget i Nederländska Ostindien
? "Japan’s conquest of the Dutch East Indies and British Borneo in 1941–1942, the goal of its southern advance: the oil of Borneo and Sumatra, which Japan had been denied by the American, British and Dutch embargo of 1941, and the rubber, tin and rice of the islands. From mid-December 1941 Japanese forces took the oil towns of British Borneo, then from January 1942 Tarakan and Balikpapan in Dutch Borneo, Manado, Kendari and Makassar in Celebes and Ambon in the Moluccas, in a series of amphibious and airborne landings that closed in on Java from east and west. The Allies formed a joint command, ABDA (American–British–Dutch–Australian), but it had too few ships and aircraft. Japanese paratroopers seized the refineries at Palembang in Sumatra on 14 February, the day before Singapore fell, and the Japanese landed on Bali and Timor. The Allied fleet under Rear Admiral Karel Doorman was destroyed in the battle of the Java Sea on 27 February, the Japanese landed on Java on 1 March, and on 8 March the Dutch commander and the governor-general surrendered at Kalijati. Australian commandos and Timorese fought on in Portuguese Timor until early 1943. The Japanese occupation that followed lasted until 1945; a later UN report estimated that some four million people in the Indies died of famine and forced labour."
: "Japans erövring av Nederländska Ostindien och Brittiska Borneo 1941–1942, målet för dess framstöt söderut: oljan på Borneo och Sumatra, som Japan hade förvägrats genom det amerikanska, brittiska och nederländska embargot 1941, och öarnas gummi, tenn och ris. Från mitten av december 1941 intog japanska styrkor oljestäderna på Brittiska Borneo och sedan, från januari 1942, Tarakan och Balikpapan på Nederländska Borneo, Manado, Kendari och Makassar på Celebes och Ambon i Moluckerna, i en serie amfibie- och luftlandsättningar som ringade in Java från öster och väster. De allierade bildade ett gemensamt amerikanskt–brittiskt–nederländskt–australiskt kommando, ABDA, men det hade för få fartyg och flygplan. Japanska fallskärmsjägare intog raffinaderierna i Palembang på Sumatra den 14 februari, dagen innan Singapore föll, och japanerna landsteg på Bali och Timor. Den allierade flottan under konteramiral Karel Doorman förintades i slaget i Javasjön den 27 februari, japanerna landsteg på Java den 1 mars, och den 8 mars kapitulerade den nederländske befälhavaren och generalguvernören i Kalijati. Australiska kommandosoldater och timoreser fortsatte striden på Portugisiska Timor till början av 1943. Den japanska ockupationen som följde varade till 1945; en senare FN-rapport uppskattade att omkring fyra miljoner människor i Ostindien dog av svält och tvångsarbete."
