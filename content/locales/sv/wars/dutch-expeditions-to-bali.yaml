# Svenska översättningar av katalogtexten (våg 11); stegtexterna kommer senare.
Dutch expeditions to Bali: Nederländska expeditionerna till Bali
? Three Dutch military expeditions against the Balinese kingdoms of Buleleng, Karangasem and Klungkung in 1846, 1848 and 1849. The Dutch, anxious to keep other European powers out of Bali, had made the Balinese rulers sign contracts in 1841–1843 that gave up tawan karang, the ruler’s customary right to ships wrecked on his coast, and that the Dutch read as recognising their sovereignty. When Buleleng and Karangasem went on claiming wrecks, a first expedition in 1846 burned the palace of Buleleng at Singaraja. The patih (chief minister) of Buleleng, I Gusti Ketut Jelantik, then fortified Jagaraga, where he threw back a second expedition in June 1848. A third, larger expedition took Jagaraga in April 1849 and, with troops from the Balinese kingdom of Lombok, overran Karangasem; Jelantik and the raja of Buleleng were killed, and the raja of Karangasem took his own life. At Kusamba the forces of Klungkung killed the Dutch commander, Andreas Victor Michiels, in a night attack. A settlement negotiated at Kuta in July 1849 left the Dutch in control of Buleleng and Jembrana and gave Karangasem to Lombok, while the southern kingdoms stayed independent in practice until 1906.
: Tre nederländska militärexpeditioner mot de balinesiska kungarikena Buleleng, Karangasem och Klungkung 1846, 1848 och 1849. Nederländarna, som ville hålla andra europeiska makter borta från Bali, hade 1841–1843 låtit de balinesiska härskarna underteckna kontrakt som avskaffade tawan karang, härskarens hävdvunna rätt till fartyg som förliste vid hans kust, och som nederländarna tolkade som ett erkännande av nederländsk suveränitet. När Buleleng och Karangasem fortsatte att göra anspråk på vrak brände en första expedition 1846 Bulelengs palats i Singaraja. Bulelengs patih (förste minister), I Gusti Ketut Jelantik, befäste därefter Jagaraga, där han slog tillbaka en andra expedition i juni 1848. En tredje, större expedition intog Jagaraga i april 1849 och erövrade Karangasem med hjälp av trupper från det balinesiska kungariket Lombok; Jelantik och rajan av Buleleng dödades, och rajan av Karangasem tog sitt liv. Vid Kusamba dödade Klungkungs styrkor den nederländske befälhavaren, Andreas Victor Michiels, i ett nattligt anfall. En uppgörelse som förhandlades fram i Kuta i juli 1849 lämnade Buleleng och Jembrana under nederländsk kontroll och gav Karangasem åt Lombok, medan de sydliga kungarikena i praktiken förblev självständiga till 1906.
