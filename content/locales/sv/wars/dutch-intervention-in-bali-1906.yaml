# Svenska översättningar av katalogtexten (våg 11); stegtexterna kommer senare.
Dutch intervention in Bali (1906–1908): Nederländska interventionen på Bali (1906–1908)
The Dutch conquest of the last independent kingdoms of southern Bali. After a wrecked Chinese schooner was plundered off Sanur in 1904 and the raja of Badung refused compensation, a Dutch expedition landed at Sanur in September 1906. On 20 September the raja of Badung, his family, priests and followers, dressed in white, walked out of the palace at Denpasar towards the Dutch troops in a puputan, a ritual fight to the death; they were shot down or killed themselves and each other, and the court of Pemecutan did the same that afternoon. Estimates of the dead range from several hundred to more than 1,000. The raja of Tabanan surrendered and killed himself in prison two days later. In April 1908, after a rising against the new Dutch opium monopoly at Gelgel, the Dutch bombarded Klungkung, and the Dewa Agung, the highest-ranking ruler of Bali, led his court in a last puputan. All of Bali was now under Dutch rule. Photographs and reports of the killings shocked opinion in the Netherlands and abroad.: Den nederländska erövringen av de sista självständiga kungarikena på södra Bali. Sedan en kinesisk skonare som hade förlist utanför Sanur hade plundrats 1904 och rajan av Badung hade vägrat betala ersättning landsteg en nederländsk expedition vid Sanur i september 1906. Den 20 september gick rajan av Badung, hans familj, präster och anhängare, klädda i vitt, ut från palatset i Denpasar mot de nederländska trupperna i en puputan, en rituell strid till döden; de sköts ned eller dödade sig själva och varandra, och hovet i Pemecutan gjorde likadant samma eftermiddag. Uppskattningarna av antalet döda varierar från flera hundra till mer än 1 000. Rajan av Tabanan kapitulerade och tog sitt liv i fängelset två dagar senare. I april 1908, efter en resning mot det nya nederländska opiummonopolet i Gelgel, bombarderade nederländarna Klungkung, och Dewa Agung, Balis högst rankade härskare, ledde sitt hov i en sista puputan. Hela Bali stod nu under nederländskt styre. Fotografier och rapporter om dödandet väckte bestörtning i Nederländerna och utomlands.
