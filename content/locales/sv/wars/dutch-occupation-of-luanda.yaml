# Svenska översättningar av katalogtexten (våg 13); stegtexterna kommer senare.
Dutch occupation of Luanda: Den nederländska ockupationen av Luanda
? "The seven years in which the Dutch West India Company (WIC) held Luanda, the capital and slave port of Portuguese Angola, part of the worldwide Dutch–Portuguese war. The Company, which had conquered the sugar lands of north-eastern Brazil, needed enslaved Africans for its plantations, and in August 1641 a fleet sent from Recife by Johan Maurits of Nassau under Admiral Cornelis Jol took Luanda; the Company also held Benguela in the south. The Portuguese governor and settlers withdrew up the Kwanza to the fort of Massangano. Garcia II of Kongo and Queen Njinga of Ndongo and Matamba, both enemies of the Portuguese, allied with the Dutch, and Soyo sent an embassy to the Dutch Republic. The Company wanted trade more than conquest: truces in 1643 left the Portuguese in their inland forts, and only after Njinga’s defeat at Kavanga in 1646 did it send troops to help her, winning at Kombi in 1647. Portugal, independent again from Spain since 1640, answered from Brazil: in August 1648 Salvador Correia de Sá, governor of Rio de Janeiro, arrived with a fleet and about a thousand men, and on 24 August 1648, after a short siege, the Dutch garrison agreed to leave Angola. Kongo had to make peace on harsh terms in 1649 and Njinga withdrew to Matamba. Without Angola’s slaves Dutch Brazil declined, and it fell to Portugal in 1654."
: "De sju år under vilka Nederländska västindiska kompaniet (WIC) höll Luanda, huvudstad och slavhamn i Portugisiska Angola, som en del av det världsomspännande kriget mellan Nederländerna och Portugal. Kompaniet, som hade erövrat sockerområdena i nordöstra Brasilien, behövde förslavade afrikaner till sina plantager, och i augusti 1641 intog en flotta under amiral Cornelis Jol, utsänd från Recife av Johan Maurits av Nassau, Luanda; kompaniet höll också Benguela i söder. Den portugisiske guvernören och bosättarna drog sig tillbaka uppför Kwanza till fortet Massangano. Garcia II av Kongo och drottning Njinga av Ndongo och Matamba, båda fiender till portugiserna, slöt förbund med nederländarna, och Soyo sände en beskickning till Nederländska republiken. Kompaniet ville hellre handla än erövra: vapenvilor 1643 lämnade portugiserna kvar i deras fort i inlandet, och först efter Njingas nederlag vid Kavanga 1646 sände det trupper till hennes hjälp och segrade vid Kombi 1647. Portugal, som åter var självständigt från Spanien sedan 1640, svarade från Brasilien: i augusti 1648 anlände Salvador Correia de Sá, guvernör i Rio de Janeiro, med en flotta och omkring tusen man, och den 24 augusti 1648, efter en kort belägring, gick den nederländska garnisonen med på att lämna Angola. Kongo måste sluta fred på hårda villkor 1649, och Njinga drog sig tillbaka till Matamba. Utan Angolas slavar gick Nederländska Brasilien tillbaka, och det föll till Portugal 1654."
