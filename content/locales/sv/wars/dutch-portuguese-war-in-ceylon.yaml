Dutch–Portuguese War in Ceylon: Nederländsk-portugisiska kriget på Ceylon
The conquest of Portuguese Ceylon by the Dutch East India Company (VOC), at first in alliance with King Rajasinghe II of Kandy. After the Kandyans destroyed a Portuguese army at Gannoruwa in March 1638, a Dutch fleet took Batticaloa in May and Rajasinghe signed a treaty with the Company. Trincomalee fell in 1639 and Galle, stormed on 13 March 1640, became the Dutch headquarters. A truce between the Dutch Republic and newly independent Portugal halted the fighting in the 1640s, and the allies quarrelled over the captured forts, which the Dutch kept. When war resumed, the Dutch besieged Colombo from late 1655 and took it on 12 May 1656, then turned on Mannar and Jaffna in 1658, ending Portuguese rule in the island. Rajasinghe found that he had exchanged one European power on the coast for another, and Kandy fought the Dutch on and off until 1766.: Nederländska ostindiska kompaniets (VOC) erövring av Portugisiska Ceylon, till en början i allians med kung Rajasinghe II av Kandy. Sedan Kandys styrkor hade förintat en portugisisk armé vid Gannoruwa i mars 1638 intog en nederländsk flotta Batticaloa i maj, och Rajasinghe slöt ett fördrag med kompaniet. Trincomalee föll 1639, och Galle, som stormades den 13 mars 1640, blev nederländarnas högkvarter. Ett stillestånd mellan Nederländska republiken och det nyss självständiga Portugal avbröt striderna på 1640-talet, och de allierade grälade om de erövrade fästena, som nederländarna behöll. När kriget återupptogs belägrade nederländarna Colombo från slutet av 1655 och intog staden den 12 maj 1656; därefter vände de sig mot Mannar och Jaffna 1658 och gjorde slut på det portugisiska styret på ön. Rajasinghe fann att han hade bytt en europeisk makt vid kusten mot en annan, och Kandy stred mot nederländarna med avbrott fram till 1766.
