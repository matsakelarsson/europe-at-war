# Svenska översättningar av katalogtexten (våg 13); stegtexterna kommer senare.
Dutch–Portuguese war on the Gold Coast: Nederländsk-portugisiska kriget på Guldkusten
? The struggle in which Dutch traders, and from 1621 the Dutch West India Company, broke Portugal’s hold on the Gold Coast, part of the wider Dutch–Portuguese War. The Portuguese had traded for Akan gold from São Jorge da Mina at Elmina since 1482, with outposts at Shama and Axim, and paid for much of it with captives brought from Benin. Dutch ships came from the 1590s; about 1598 they opened a post at Moree, which the Portuguese burned in 1610, and in 1612, by treaty with the rulers of Asebu, they built Fort Nassau there. The Company’s first attack on Elmina, on 25 October 1625, was ambushed and beaten by the small garrison and its African allies. In August 1637 a second force from Dutch Brazil, joined by about a thousand African fighters whom the Dutch commander had won over, took the hill of St Jago above the castle and forced its surrender. Shama fell in 1640 or 1642 and Axim early in 1642, and the treaty the Company made with Axim’s chiefs on 17 February 1642 ended Portuguese rule on the coast, three days before the States-General ratified the truce of 1641 between the Dutch and the newly independent Portugal. Both sides relied on African rulers and fighters, who chose their allies for trade and gifts; the Dutch used Elmina, as the Portuguese had, for the trade in gold and increasingly in slaves.
: Den kamp i vilken nederländska köpmän, och från 1621 Nederländska Västindiska kompaniet, bröt Portugals grepp om Guldkusten, som en del av det större nederländsk-portugisiska kriget. Portugiserna hade sedan 1482 handlat till sig guld från akanområdet i São Jorge da Mina i Elmina, med utposter i Shama och Axim, och betalat för en stor del av det med fångar som förts dit från Benin. Nederländska fartyg kom från 1590-talet; omkring 1598 öppnade nederländarna en handelsstation i Moree, som portugiserna brände 1610, och 1612 byggde de, genom ett fördrag med härskarna i Asebu, Fort Nassau där. Kompaniets första anfall mot Elmina, den 25 oktober 1625, föll i ett bakhåll och slogs tillbaka av den lilla garnisonen och dess afrikanska bundsförvanter. I augusti 1637 intog en andra styrka från Nederländska Brasilien, förstärkt med omkring tusen afrikanska krigare som den nederländske befälhavaren hade vunnit över, kullen St Jago ovanför borgen och tvingade den att kapitulera. Shama föll 1640 eller 1642 och Axim i början av 1642, och det fördrag som kompaniet slöt med hövdingarna i Axim den 17 februari 1642 gjorde slut på det portugisiska väldet vid kusten, tre dagar innan generalstaterna ratificerade stilleståndet från 1641 mellan Nederländerna och det nyss självständiga Portugal. Båda sidor förlitade sig på afrikanska härskare och krigare, som valde sina bundsförvanter med tanke på handel och gåvor; nederländarna använde, liksom portugiserna före dem, Elmina för handeln med guld och i allt högre grad med slavar.
