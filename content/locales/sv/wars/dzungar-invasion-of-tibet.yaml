# Svenska översättningar av katalogtexten (våg 9); stegtexterna kommer senare.
Dzungar invasion of Tibet: Dzungarernas invasion av Tibet
In 1717 an army of the Dzungar Khanate under Tseren Dondub crossed the Kunlun and the uninhabited Changtang plateau from Yarkand, defeated Lhazang Khan, the Khoshut Mongol ruler of Tibet, and took Lhasa in late November; Lhazang Khan was killed on 3 December 1717. The Dzungars deposed the Dalai Lama Lhazang had installed, plundered Lhasa and its monasteries and persecuted the Nyingma school, and soon lost the support they had first found among the Gelug clergy. A Qing relief force from Xining was destroyed on the Salween river near Nagqu in September 1718. In 1720 two larger Qing armies, from Kokonor and from Sichuan, with Tibetan forces under Polhané and Kangchenné, drove the Dzungars out. The Qing brought the young Kelzang Gyatso from Kumbum and enthroned him as the Seventh Dalai Lama in the Potala, and left a garrison in Lhasa. The Qing date their rule in Tibet from this expedition; how far it made Tibet part of the Qing empire is disputed.: År 1717 tog sig en armé från Dzungarkhanatet under Tseren Dondub från Yarkand över Kunlun och den obebodda Changtangplatån, besegrade Lhazang khan, Tibets khoshutmongoliske härskare, och intog Lhasa i slutet av november; Lhazang khan dödades den 3 december 1717. Dzungarerna avsatte den dalai lama som Lhazang hade insatt, plundrade Lhasa och dess kloster och förföljde nyingmaskolan, och de förlorade snart det stöd som de först hade funnit bland gelugskolans prästerskap. En undsättningsstyrka från Qing som utgick från Xining förintades vid floden Salween nära Nagqu i september 1718. År 1720 drev två större Qingarméer, från Kokonor och från Sichuan, tillsammans med tibetanska styrkor under Polhané och Kangchenné ut dzungarerna. Qing hämtade den unge Kelzang Gyatso från Kumbum och installerade honom som den sjunde dalai lama i Potala, och lämnade en garnison i Lhasa. Qing daterar sitt styre i Tibet från denna expedition; i vilken mån den gjorde Tibet till en del av Qingriket är omstritt.
