# Svenska översättningar av katalogtexten (våg 9); stegtexterna kommer senare.
Dzungar–Qing War (1687–1697): Kriget mellan dzungarerna och Qing (1687–1697)
? The first war between the Dzungar Khanate of the western Mongols (Oirats) and the Qing empire, fought over Khalkha, the land of the eastern Mongols. Galdan Boshugtu Khan, who had made the Dzungars the leading power of Inner Asia and conquered the oases of the Tarim basin, took a quarrel among the Khalkha khans as his reason to invade Khalkha in 1688. He defeated the Tüsheet Khan at Olgoi Nor and drove the Khalkha nobles, the Jebtsundamba Khutugtu Zanabazar and tens of thousands of their people south into Qing territory, where they submitted to the Kangxi emperor. In 1690 Galdan advanced to Ulan Butung, about 300 km north of Beijing, and fought a Qing army to a standstill before withdrawing. At Dolon Nor in 1691 the Khalkha formally became Qing subjects. In 1696 the Kangxi emperor led three armies across the Gobi, and Fiyanggu’s western army destroyed Galdan’s forces at Jao Modo on the upper Tuul river. Galdan died in the Altai in April 1697. Khalkha remained part of the Qing empire until 1911, while the Dzungar Khanate survived under Galdan’s nephew Tsewang Rabtan.
: Det första kriget mellan västmongolernas (oiraternas) Dzungarkhanat och Qingriket, utkämpat om Khalkha, östmongolernas land. Galdan Boshugtu khan, som hade gjort dzungarerna till Inre Asiens ledande makt och erövrat oaserna i Tarimbäckenet, tog ett gräl mellan khalkhakhanerna till förevändning för att invadera Khalkha 1688. Han besegrade Tüsheet khan vid Olgoi Nor och drev khalkhaadeln, Jebtsundamba khutugtu Zanabazar och tiotusentals av deras folk söderut in på Qingområde, där de underkastade sig Kangxikejsaren. År 1690 ryckte Galdan fram till Ulan Butung, omkring 300 km norr om Peking, och utkämpade ett oavgjort slag mot en Qingarmé innan han drog sig tillbaka. Vid Dolon Nor 1691 blev khalkha formellt Qingrikets undersåtar. År 1696 ledde Kangxikejsaren tre arméer över Gobi, och Fiyanggus västra armé förintade Galdans styrkor vid Jao Modo vid övre Tuul. Galdan dog i Altaj i april 1697. Khalkha förblev en del av Qingriket till 1911, medan Dzungarkhanatet levde vidare under Galdans brorson Tsewang Rabtan.
