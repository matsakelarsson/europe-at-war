# Svenska översättningar av katalogtexten (våg 9); stegtexterna kommer senare.
Dzungar–Qing War (1715–1739): Kriget mellan dzungarerna och Qing (1715–1739)
The second round of wars between the Dzungar Khanate and the Qing empire, fought on the oasis road east of the Tian Shan, in Khalkha and, in 1717–1720, in Tibet. It began in 1715 when Tsewang Rabtan’s Dzungars attacked Hami, a Qing dependency since 1696–1697. The Kangxi emperor stationed armies and military farms at Barkol and Hami, and in 1720 Qing troops reached Turfan, whose people, led by Emin Khoja, went over to the Qing. After a truce under the Yongzheng emperor the war flared up again in 1729, when the Dzungars refused to hand over the Khoshut rebel Lobzang Danjin. At Khoton Nor in the Altai, in July 1731, Galdan Tseren’s army destroyed the Qing northern army under Furdan, but in 1732 the Khalkha prince Tsering defeated a Dzungar invasion of Khalkha near Erdene Zuu. Talks from 1734 ended in an agreement in 1739 that fixed the line between the Dzungar and Khalkha pastures in the Altai and opened trade, and the frontier stayed at peace until the Dzungar civil wars of the 1740s and 1750s.: Den andra omgången krig mellan Dzungarkhanatet och Qingriket, utkämpad längs oasvägen öster om Tianshan, i Khalkha och, 1717–1720, i Tibet. Den började 1715, när Tsewang Rabtans dzungarer anföll Hami, ett lydland under Qing sedan 1696–1697. Kangxikejsaren förlade arméer och militärkolonier till Barkol och Hami, och 1720 nådde Qingtrupper Turfan, vars folk, under ledning av Emin Khoja, gick över till Qing. Efter ett stillestånd under Yongzhengkejsaren blossade kriget upp igen 1729, när dzungarerna vägrade utlämna khoshutrebellen Lobzang Danjin. Vid Khoton Nor i Altaj förintade Galdan Tserens armé i juli 1731 Qings norra armé under Furdan, men 1732 besegrade khalkhafursten Tsering en dzungarisk invasion av Khalkha nära Erdene Zuu. Förhandlingar från 1734 ledde 1739 till en överenskommelse som drog gränsen mellan dzungarernas och khalkhas betesmarker i Altaj och öppnade handeln, och gränsen förblev fredlig fram till de dzungariska inbördeskrigen på 1740- och 1750-talen.
