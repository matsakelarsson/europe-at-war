# Svenska översättningar av katalogtexten (våg 13); stegtexterna kommer senare.
East African campaign (First World War): Östafrikanska fälttåget (första världskriget)
? "The First World War in East Africa, fought for four years over German East Africa (mainland Tanzania, Rwanda and Burundi) and the neighbouring British, Belgian and Portuguese colonies. The German commander, Paul von Lettow-Vorbeck, set out to tie down as many Allied troops as he could. His Schutztruppe, mostly African soldiers (askari), threw back a British landing at Tanga in November 1914. In 1916 the South African general Jan Smuts invaded from Kenya, while Belgian troops from the Congo took Rwanda, Burundi and Tabora and British forces came in from Nyasaland and Northern Rhodesia; by the end of the year the Allies held the north and centre of the colony and its railways. Lettow-Vorbeck withdrew south, fought a costly battle at Mahiwa in October 1917, and in November crossed the Rovuma into Portuguese Mozambique. He marched through Mozambique for ten months, came back through German East Africa into Northern Rhodesia and surrendered at Abercorn on 25 November 1918, two weeks after the armistice in Europe. The war was fought largely by Africans and borne by them: about 11,000 British Empire soldiers and some 95,000 of its African carriers died, and famine and disease caused by the war killed hundreds of thousands of civilians."
: "Första världskriget i Östafrika, som i fyra år utkämpades om Tyska Östafrika (Tanzanias fastland, Rwanda och Burundi) och de angränsande brittiska, belgiska och portugisiska kolonierna. Den tyske befälhavaren Paul von Lettow-Vorbeck föresatte sig att binda så många allierade trupper som möjligt. Hans Schutztruppe, till största delen afrikanska soldater (askarier), slog tillbaka en brittisk landstigning vid Tanga i november 1914. År 1916 invaderade den sydafrikanske generalen Jan Smuts från Kenya, medan belgiska trupper från Kongo intog Rwanda, Burundi och Tabora och brittiska styrkor ryckte in från Nyasaland och Nordrhodesia; vid årets slut höll de allierade koloniens norra och centrala delar och dess järnvägar. Lettow-Vorbeck drog sig söderut, utkämpade ett kostsamt slag vid Mahiwa i oktober 1917 och gick i november över Rovuma in i Portugisiska Moçambique. Han marscherade genom Moçambique i tio månader, kom tillbaka genom Tyska Östafrika in i Nordrhodesia och kapitulerade i Abercorn den 25 november 1918, två veckor efter vapenstilleståndet i Europa. Kriget utkämpades till stor del av afrikaner, och det var de som fick bära bördan: omkring 11 000 soldater från Brittiska imperiet och omkring 95 000 av dess afrikanska bärare dog, och hungersnöd och sjukdomar som kriget orsakade dödade hundratusentals civila."
