# Svenska översättningar av katalogtexten (våg 12); stegtexterna kommer senare.
East African campaign: Östafrikanska fälttåget
? "The Second World War in the Horn of Africa. When Italy entered the war in June 1940, the Duke of Aosta’s army in Italian East Africa, some 250,000–290,000 men, most of them Eritrean, Somali and Ethiopian colonial troops, outnumbered the British forces around it many times over. It took Kassala and Gallabat in Sudan and Moyale in Kenya, and in August 1940 conquered British Somaliland. But cut off from Italy by the closure of the Suez Canal and short of fuel and spares, it could only wait. In January 1941 British, Indian, South African, East and West African, Sudanese, Free French and Belgian Congolese forces attacked from three sides, with Ethiopian Patriots rising in the highlands: from Sudan into Eritrea, where the Italians held the mountain fortress of Keren for eight weeks; from Kenya through Italian Somaliland to Addis Ababa, which fell on 6 April; and with Gideon Force and Emperor Haile Selassie into Gojjam. Haile Selassie returned to his capital on 5 May 1941, the Duke of Aosta surrendered at Amba Alagi on 19 May, and the last Italian army surrendered at Gondar on 27 November 1941. It restored Ethiopia’s independence."
: "Andra världskriget på Afrikas horn. När Italien gick in i kriget i juni 1940 var hertigen av Aostas armé i Italienska Östafrika, omkring 250 000–290 000 man, de flesta av dem eritreanska, somaliska och etiopiska kolonialtrupper, många gånger större än de brittiska styrkorna runt omkring. Den intog Kassala och Gallabat i Sudan och Moyale i Kenya och erövrade i augusti 1940 Brittiska Somaliland. Men avskuren från Italien sedan Suezkanalen stängts, och med brist på bränsle och reservdelar, kunde den bara vänta. I januari 1941 anföll brittiska, indiska, sydafrikanska, öst- och västafrikanska, sudanesiska, fria franska och belgisk-kongolesiska styrkor från tre håll, medan etiopiska patrioter reste sig i höglandet: från Sudan in i Eritrea, där italienarna höll bergsfästningen Keren i åtta veckor; från Kenya genom Italienska Somaliland till Addis Abeba, som föll den 6 april; och med Gideon Force och kejsar Haile Selassie in i Gojjam. Haile Selassie återvände till sin huvudstad den 5 maj 1941, hertigen av Aosta kapitulerade vid Amba Alagi den 19 maj, och den sista italienska armén kapitulerade vid Gondar den 27 november 1941. Fälttåget återställde Etiopiens självständighet."
