Protests went on in some places until about 24 June. The ruling Socialist Unity Party withdrew the rise in work quotas on the afternoon of 16 June, but too late to stop the next day’s strikes.: Protesterna fortsatte på vissa håll till omkring den 24 juni. Det styrande Socialistiska enhetspartiet drog tillbaka höjningen av arbetsnormerna på eftermiddagen den 16 juni, men för sent för att stoppa nästa dags strejker.
