East German uprising of 1953: Upproret i Östtyskland 1953
A wave of strikes and protests across East Germany. It began on 16 June 1953, when construction workers on East Berlin’s Stalinallee struck against a compulsory 10 per cent rise in work quotas, and on 17 June more than a million people in some 700 towns and villages joined strikes and demonstrations, many of them demanding free elections and the government’s resignation. Soviet forces declared martial law and put the rising down with tanks, helped by the East German police. At least 55 people were killed, and some estimates are well over 100. Up to 10,000 people were detained, and Soviet and East German courts passed death sentences. West Germany made 17 June a national holiday, the Day of German Unity, until reunification in 1990.: En våg av strejker och protester i hela Östtyskland. Den började den 16 juni 1953, när byggnadsarbetare på Stalinallee i Östberlin strejkade mot en påtvingad höjning av arbetsnormerna med 10 procent, och den 17 juni anslöt sig mer än en miljon människor på omkring 700 orter till strejker och demonstrationer, många av dem med krav på fria val och regeringens avgång. Sovjetiska styrkor utlyste krigstillstånd och slog ned upproret med stridsvagnar, med hjälp av den östtyska polisen. Minst 55 människor dödades, och vissa uppskattningar ligger långt över 100. Upp till 10 000 människor greps, och sovjetiska och östtyska domstolar utdömde dödsstraff. Västtyskland gjorde den 17 juni till nationell helgdag, Tyska enhetens dag, fram till återföreningen 1990.
