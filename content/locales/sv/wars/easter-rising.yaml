Liam Mellows led 600–700 poorly armed Galway Volunteers against police barracks east of Galway city; shelled by warships, they dispersed on 29 April.: Liam Mellows ledde 600–700 dåligt beväpnade frivilliga från Galway mot polisstationer öster om staden Galway; beskjutna av krigsfartyg skingrades de den 29 april.
