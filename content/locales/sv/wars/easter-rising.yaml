A secret military council of the Irish Republican Brotherhood planned a rising for Easter 1916, while Britain was at war, and hoped for German arms. The plan went wrong at once. The Royal Navy intercepted the arms ship Aud off Kerry, and its crew scuttled it; Roger Casement, landed from a German submarine, was arrested; and Eoin MacNeill, chief of staff of the Irish Volunteers, cancelled the manoeuvres that were to have begun it. The council struck a day later, on Easter Monday, 24 April, with about 1,250 Volunteers, Irish Citizen Army men and women of Cumann na mBan.: Ett hemligt militärråd inom Irländska republikanska brödraskapet planerade ett uppror till påsken 1916, medan Storbritannien låg i krig, och hoppades på tyska vapen. Planen gick genast snett. Royal Navy uppbringade vapenfartyget Aud utanför Kerry, och besättningen sänkte det; Roger Casement, som landsatts från en tysk ubåt, greps; och Eoin MacNeill, stabschef för Irish Volunteers, ställde in de manövrer som skulle ha inlett upproret. Rådet slog till en dag senare, på annandag påsk den 24 april, med omkring 1 250 man ur Irish Volunteers och Irish Citizen Army samt kvinnor ur Cumann na mBan.
They seized the General Post Office in Sackville Street, where Patrick Pearse read the Proclamation of the Irish Republic, and other strongpoints around central Dublin, but failed to take Dublin Castle, the railway stations or the ports. The British brought in troops from the Curragh, Belfast and Britain until they had more than 16,000 men. At Mount Street Bridge on 26 April a handful of Volunteers killed or wounded some 240 soldiers marching in from Kingstown. Artillery and the gunboat Helga shelled the city centre, the GPO was set on fire, and on 29 April Pearse surrendered unconditionally.: De besatte huvudpostkontoret (GPO) på Sackville Street, där Patrick Pearse läste upp proklamationen av den irländska republiken, och andra stödjepunkter i centrala Dublin, men lyckades inte ta Dublin Castle, järnvägsstationerna eller hamnarna. Britterna förde in trupper från Curragh, Belfast och Storbritannien tills de hade mer än 16 000 man. Vid Mount Street Bridge den 26 april dödade eller sårade en handfull frivilliga omkring 240 soldater som marscherade in från Kingstown. Artilleri och kanonbåten Helga besköt stadens centrum, GPO sattes i brand, och den 29 april kapitulerade Pearse villkorslöst.
Of the 485 people killed, 260 were civilians, many hit by shellfire or caught in crossfire, and in North King Street soldiers killed fifteen men in their homes. Secret courts martial sentenced 90 people to death. Fourteen were shot at Kilmainham Gaol between 3 and 12 May, among them all seven signatories of the Proclamation; Thomas Kent was shot in Cork, and Casement was hanged in London in August. About 3,500 people were arrested and 1,800 interned or imprisoned in Britain. The executions turned opinion, and in the 1918 election Sinn Féin won 73 of Ireland’s 105 seats.: Av de 485 dödade var 260 civila, många träffade av granateld eller fångade i korseld, och på North King Street dödade soldater femton män i deras hem. Hemliga krigsrätter dömde 90 personer till döden. Fjorton sköts i Kilmainham Gaol mellan den 3 och 12 maj, bland dem alla sju undertecknarna av proklamationen; Thomas Kent sköts i Cork, och Casement hängdes i London i augusti. Omkring 3 500 personer greps och 1 800 internerades eller fängslades i Storbritannien. Avrättningarna vände opinionen, och i valet 1918 vann Sinn Féin 73 av Irlands 105 mandat.
