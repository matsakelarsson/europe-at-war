24–29 April 1916: 24–29 april 1916
The rebel headquarters, outside which Pearse read the Proclamation. Shelled and set on fire, it was abandoned on 28 April, and the leaders surrendered the next day.: Rebellernas högkvarter, utanför vilket Pearse läste upp proklamationen. Byggnaden besköts och sattes i brand, övergavs den 28 april, och ledarna kapitulerade dagen därpå.
Ashbourne: Ashbourne
28 April 1916: 28 april 1916
Thomas Ashe’s Fingal Volunteers attacked the police barracks and then defeated a column of armed police in a five-hour fight; eight policemen and two Volunteers were killed.: Thomas Ashes frivilliga från Fingal anföll polisstationen och besegrade sedan en kolonn beväpnad polis i en fem timmar lång strid; åtta poliser och två frivilliga dödades.
Enniscorthy: Enniscorthy
27–30 April 1916: 27–30 april 1916
Wexford Volunteers held the town and blockaded its police barracks, and gave up only after two of their officers had heard Pearse confirm the surrender in Dublin.: Frivilliga från Wexford höll staden och blockerade dess polisstation, och gav upp först sedan två av deras officerare hört Pearse bekräfta kapitulationen i Dublin.
