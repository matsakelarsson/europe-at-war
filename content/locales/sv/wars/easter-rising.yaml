Easter Week: Påskveckan
24 April – 12 May 1916: 24 april – 12 maj 1916
All of Ireland was then part of the United Kingdom of Great Britain and Ireland. Sackville Street in Dublin is today’s O’Connell Street, Kingstown is Dún Laoghaire, and Kingsbridge station is Heuston station.: Hela Irland var då en del av Förenade konungariket Storbritannien och Irland. Sackville Street i Dublin är dagens O’Connell Street, Kingstown är Dún Laoghaire och Kingsbridge station är Heuston station.
Figures for the dead are those of the Glasnevin Trust’s count, as given in most recent accounts. The rebels’ strength in Dublin is usually put at about 1,250; others mobilised in the provinces but did little fighting.: Siffrorna för de döda är Glasnevin Trusts räkning, som de återges i de flesta nyare framställningar. Rebellernas styrka i Dublin anges vanligen till omkring 1 250; andra mobiliserade i landsorten men deltog knappt i några strider.
