Easter Rising: Påskupproret
An armed rising in Ireland, centred on Dublin, in which Irish republicans proclaimed an Irish Republic in Easter Week 1916, while Britain was fighting the First World War. British forces crushed it within six days, but the execution of sixteen of its leaders and mass arrests turned much of Irish opinion towards the separatist cause.: Ett väpnat uppror på Irland med centrum i Dublin, där irländska republikaner utropade en irländsk republik under påskveckan 1916, medan Storbritannien utkämpade första världskriget. Brittiska styrkor slog ned det inom sex dagar, men avrättningen av sexton av dess ledare och massarresteringar vände en stor del av den irländska opinionen till förmån för separatismen.
