Casement came ashore here from the U-19 and was arrested within hours. The next day the Aud, carrying about 20,000 rifles, was scuttled off Cork Harbour after being intercepted.: Casement gick i land här från U-19 och greps inom några timmar. Dagen därpå sänktes Aud, med omkring 20 000 gevär ombord, utanför Cork Harbour sedan fartyget uppbringats.
