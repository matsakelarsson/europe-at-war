# Svenska översättningar av katalogtexten (våg 13); stegtexterna kommer senare.
ECOWAS military intervention in the Gambia: Ecowas militära intervention i Gambia
? The West African intervention that made President Yahya Jammeh of the Gambia, in power since a coup in 1994, hand over to the winner of the election of 1 December 2016, Adama Barrow. Jammeh first conceded defeat, then on 9 December rejected the result and appealed to the Supreme Court, which had no judges to hear the case. ECOWAS, the African Union and the United Nations backed Barrow; mediation by West African presidents failed, about 45,000 people fled to Senegal, and Jammeh declared a state of emergency. On 19 January 2017 Barrow was sworn in at the Gambian embassy in Dakar, the UN Security Council unanimously backed ECOWAS’s efforts in Resolution 2337, without explicitly authorising force, and the same day Senegalese troops, with Nigerian aircraft and ships and contingents from Ghana and other states, crossed the border in what was first called Operation Restore Democracy. The Gambian army did not resist; after a last mediation by the presidents of Guinea and Mauritania, Jammeh flew into exile on 21 January, first to Guinea and then to Equatorial Guinea. Barrow returned on 26 January. A smaller ECOWAS force, the ECOWAS Mission in the Gambia (ECOMIG), stayed to secure the transition and was still present in 2025; in January 2022 fighters of the Casamance rebel MFDC attacked a Senegalese ECOMIG patrol near the border, killing four soldiers and capturing seven.
: Den västafrikanska intervention som fick Gambias president Yahya Jammeh, som hade suttit vid makten sedan en kupp 1994, att lämna över makten till segraren i valet den 1 december 2016, Adama Barrow. Jammeh erkände först nederlaget men förkastade sedan den 9 december resultatet och överklagade till högsta domstolen, som inte hade några domare som kunde pröva målet. Ecowas, Afrikanska unionen och FN stödde Barrow; medling av västafrikanska presidenter misslyckades, omkring 45 000 människor flydde till Senegal, och Jammeh utlyste undantagstillstånd. Den 19 januari 2017 svors Barrow in på Gambias ambassad i Dakar, FN:s säkerhetsråd ställde sig enhälligt bakom Ecowas ansträngningar i resolution 2337, utan att uttryckligen bemyndiga våld, och samma dag gick senegalesiska trupper, med nigerianska flygplan och fartyg och kontingenter från Ghana och andra stater, över gränsen i det som först kallades Operation Restore Democracy. Den gambiska armén gjorde inget motstånd; efter en sista medling av presidenterna i Guinea och Mauretanien flög Jammeh i exil den 21 januari, först till Guinea och sedan till Ekvatorialguinea. Barrow återvände den 26 januari. En mindre Ecowasstyrka, Ecowas mission i Gambia (Ecomig), stannade kvar för att säkra övergången och fanns fortfarande på plats 2025; i januari 2022 anföll krigare ur rebellrörelsen MFDC i Casamance en senegalesisk Ecomigpatrull nära gränsen, dödade fyra soldater och tillfångatog sju.
