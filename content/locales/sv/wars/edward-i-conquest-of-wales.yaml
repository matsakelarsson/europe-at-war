Much of Wales, notably the south and the border, was already held by Anglo-Norman marcher lords; the wars were fought over the principality that Llywelyn had built up and that Henry III had recognised in 1267.: Stora delar av Wales, särskilt södra delen och gränsområdena, hölls redan av anglonormandiska marklorder; krigen gällde det furstendöme som Llywelyn hade byggt upp och som Henrik III erkänt 1267.
The Welsh chronicle Brut y Tywysogion and English royal records are the main sources. The circumstances of Llywelyn’s death were told differently on each side and remain unclear.: Den walesiska krönikan Brut y Tywysogion och engelska kungliga handlingar är de viktigaste källorna. Omständigheterna kring Llywelyns död skildrades olika av de båda sidorna och är fortfarande oklara.
