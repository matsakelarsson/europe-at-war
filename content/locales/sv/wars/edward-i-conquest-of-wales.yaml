English officials and English law in the lands taken in 1277 caused bitter resentment, and Dafydd felt poorly rewarded for his help. On Palm Sunday, 22 March 1282, he attacked Hawarden castle and went on to besiege Rhuddlan; risings followed in Deheubarth and northern Powys, and Llywelyn joined the war. Edward advanced along the north coast once more and sent a force to Anglesey. On 6 November, while Archbishop Peckham of Canterbury was trying to make peace, Luke de Tany led a surprise attack across a bridge of boats over the Menai Strait and was routed at Moel-y-don; many of his knights drowned.: Engelska ämbetsmän och engelsk lag i de landområden som tagits 1277 väckte bitter förbittring, och Dafydd ansåg sig dåligt belönad för sin hjälp. På palmsöndagen den 22 mars 1282 anföll han borgen Hawarden och gick vidare för att belägra Rhuddlan; uppror följde i Deheubarth och norra Powys, och Llywelyn anslöt sig till kriget. Edvard ryckte åter fram längs nordkusten och sände en styrka till Anglesey. Den 6 november, medan ärkebiskop Peckham av Canterbury försökte mäkla fred, ledde Luke de Tany ett överraskningsanfall över en båtbro över Menaisundet och slogs på flykten vid Moel-y-don; många av hans riddare drunknade.
Llywelyn went south to raise mid-Wales, and on 11 December he was killed near Cilmeri, by Builth, apparently cut off from his army by English troops at Orewin Bridge. His head was sent to London and set up at the Tower. In January 1283 Edward pushed into Snowdonia and took Dolwyddelan, and Castell y Bere fell on 25 April. Dafydd, who had taken the title of prince, was captured in June and hanged, drawn and quartered at Shrewsbury on 3 October. By the Statute of Rhuddlan of 1284 the principality was annexed to the English crown and divided into shires, and Edward began great castles at Conwy, Caernarfon and Harlech to hold it.: Llywelyn drog söderut för att resa mellersta Wales, och den 11 december dödades han nära Cilmeri, vid Builth, tydligen avskuren från sin här av engelska trupper vid Orewin Bridge. Hans huvud sändes till London och sattes upp vid Towern. I januari 1283 trängde Edvard in i Snowdonia och tog Dolwyddelan, och Castell y Bere föll den 25 april. Dafydd, som hade antagit furstetiteln, tillfångatogs i juni och hängdes, släpades och styckades i Shrewsbury den 3 oktober. Genom stadgan i Rhuddlan 1284 annekterades furstendömet till den engelska kronan och delades in i grevskap, och Edvard påbörjade väldiga borgar i Conwy, Caernarfon och Harlech för att hålla det.
