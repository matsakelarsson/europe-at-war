By the Treaty of Montgomery of 1267 Henry III recognised Llywelyn ap Gruffudd of Gwynedd as Prince of Wales and overlord of the other Welsh rulers. Relations with Henry’s son Edward I soon broke down. Llywelyn would not come to do homage, quarrelled with the marcher lords over the border, and objected that Edward sheltered his brother Dafydd and Gruffudd ap Gwenwynwyn of Powys, who had plotted against his life. When Llywelyn married Eleanor de Montfort, the daughter of Edward’s old enemy Simon, by proxy, Edward had her ship seized at sea on her way from France in 1275. In November 1276 he declared Llywelyn a rebel.: Genom fördraget i Montgomery 1267 erkände Henrik III Llywelyn ap Gruffudd av Gwynedd som furste av Wales och överherre över de andra walesiska härskarna. Förhållandet till Henriks son Edvard I bröt snart samman. Llywelyn vägrade att komma och avlägga tro- och hyllningsed, grälade med marklorderna om gränsen och invände mot att Edvard gav skydd åt hans bror Dafydd och åt Gruffudd ap Gwenwynwyn av Powys, som hade konspirerat mot hans liv. När Llywelyn genom ombud gifte sig med Eleanor de Montfort, dotter till Edvards gamle fiende Simon, lät Edvard 1275 uppbringa hennes fartyg till sjöss på väg från Frankrike. I november 1276 förklarade han Llywelyn för upprorsman.
In 1277 royal armies advanced from Chester, Montgomery and Carmarthen, and the lords of Powys and Deheubarth submitted. In July Edward led the main army west from Chester along the coast, with hundreds of woodcutters clearing a road and new castles begun at Flint and Rhuddlan, while his fleet landed troops on Anglesey to take its harvest, the granary of Gwynedd. Facing a winter of hunger in the mountains, Llywelyn gave in. By the Treaty of Aberconwy in November he kept his title but only Gwynedd west of the Conwy; the land between the Conwy and the Dee went to Edward and to Dafydd, and the other Welsh lords became Edward’s vassals.: År 1277 ryckte kungliga härar fram från Chester, Montgomery och Carmarthen, och herrarna i Powys och Deheubarth underkastade sig. I juli ledde Edvard huvudhären västerut från Chester längs kusten, med hundratals skogshuggare som röjde en väg och nya borgar som påbörjades i Flint och Rhuddlan, medan hans flotta landsatte trupper på Anglesey för att ta skörden från ön, Gwynedds kornbod. Inför en vinter av svält i bergen gav Llywelyn upp. Genom fördraget i Aberconwy i november behöll han sin titel men bara Gwynedd väster om Conwy; landet mellan Conwy och Dee gick till Edvard och Dafydd, och de andra walesiska herrarna blev Edvards vasaller.
