Edward I’s conquest of Wales: Edvard I:s erövring av Wales
The wars in which Edward I of England conquered the principality of Wales. In 1277 he forced Llywelyn ap Gruffudd, Prince of Wales, back into western Gwynedd; when Llywelyn and his brother Dafydd rose in 1282, Edward overran Snowdonia, Llywelyn was killed and Dafydd executed, and the Statute of Rhuddlan of 1284 annexed their lands to the English crown, held down by a ring of great castles.: De krig genom vilka Edvard I av England erövrade furstendömet Wales. År 1277 trängde han tillbaka Llywelyn ap Gruffudd, furste av Wales, till västra Gwynedd; när Llywelyn och hans bror Dafydd gjorde uppror 1282 erövrade Edvard Snowdonia, Llywelyn dödades och Dafydd avrättades, och genom stadgan i Rhuddlan 1284 annekterades deras länder till den engelska kronan och hölls nere av en ring av mäktiga borgar.
