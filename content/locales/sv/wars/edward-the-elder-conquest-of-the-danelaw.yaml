The main source is the Anglo-Saxon Chronicle, including a separate Mercian Register that records Æthelflæd’s campaigns. Whether Lincoln submitted in 918 is uncertain.: Huvudkällan är den anglosaxiska krönikan, inklusive en separat merciansk krönika som återger Æthelflæds fälttåg. Huruvida Lincoln underkastade sig 918 är osäkert.
