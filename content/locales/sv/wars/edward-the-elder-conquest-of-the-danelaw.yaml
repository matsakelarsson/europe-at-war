Edward the Elder’s conquest of the Danelaw: Edvard den äldres erövring av Danelagen
The campaigns in which Edward the Elder of Wessex and his sister Æthelflæd, Lady of the Mercians, conquered the Danish-ruled lands of England south of the Humber. After a West Saxon and Mercian army destroyed a Northumbrian Danish raiding army at Tettenhall on 5 August 910, the two built chains of fortified burhs and pushed into the Danelaw. In 917 the English stormed the Danish fort at Tempsford, killing the last Danish king of East Anglia, and East Anglia, Essex and Derby fell; in 918 Leicester, Stamford and Nottingham submitted, and after Æthelflæd’s death that June Edward took direct rule of Mercia. In 920 at Bakewell the rulers of York, Bamburgh, the Scots and Strathclyde accepted Edward, by the Chronicle’s account, as “father and lord”, though historians doubt how much that meant.: De fälttåg genom vilka Edvard den äldre av Wessex och hans syster Æthelflæd, mercernas härskarinna, erövrade de danskstyrda delarna av England söder om Humber. Sedan en västsaxisk och merciansk här hade förintat en northumbrisk-dansk plundringshär vid Tettenhall den 5 augusti 910 byggde syskonen kedjor av befästa burhs och trängde in i Danelagen. År 917 stormade engelsmännen den danska skansen vid Tempsford och dödade den siste danske kungen av East Anglia, och East Anglia, Essex och Derby föll; 918 underkastade sig Leicester, Stamford och Nottingham, och efter Æthelflæds död i juni samma år tog Edvard direkt styret över Mercia. År 920 i Bakewell erkände härskarna i York, Bamburgh, skottarna och Strathclyde enligt krönikan Edvard som ”fader och herre”, även om historiker betvivlar hur mycket det betydde.
